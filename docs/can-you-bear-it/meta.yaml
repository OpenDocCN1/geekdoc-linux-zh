- md: '## Can You Bear It?


    By Marina Vishmidt, 10 December 2001


    Featured in Mute Vol 1, No. 22 – The Art Issue


    Turbo-reification or the ultimate abject object – collectors, you decide! This
    bear is no bear – she is none other than the reincarnation of ''our'' cherished
    first lady. The bear ages, its fur gets tacky – but the real Jackie O potters
    around her garden in New Mexico, having faked her slow decline from terminal illness
    several years back. This golem is no golem – peel off the fur and there she is
    underneath, all porcelain skin, hand-varnished to her patrician fingernails.


    https://www.metamute.org/editorial/articles/can-you-bear-it


    Her eyes even follow you around the room! Thank goodness for those wraparound
    sunglasses. Did we mention she comes with a wardrobe shaped like one of Jackie''s
    signature purses and stocked with a swish array of 11-inch bear-size A-line skirts
    and handcrafted unmentionables? Zip her up again in her fuzzy carapace and give
    her to the kids to play with – what better way to get them learning about history?
    Okay, Jackie, today we''re playing Bay of Pigs. With our convenient monthly payment
    plan, soon you''ll have the whole Kennedy Clan to lovingly display. These bears
    ain''t no three bears – they''re America''s aristocracy! Spend many charmed hours
    dusting little John-John bear, complete with miniature plane. Move the arms and
    legs of roly-poly Ted bear, complete with miniature Chappaquiddick. And where''s
    Marilyn bear? Sinatra bear? Once you get started down this road, there''s no turning
    back. And there was no turning back for Jackie after the assassination. Installing
    a young lookalike starlet in the White House in her place, Jackie, sans makeup
    bag, headed for the great outdoors where campers have dubbed her ''yeti''. Now
    the story can be told: the two lives of America''s first lady narrated by soft
    sculpture.


    Marina Vishmidt <marinar@artserve.net> is a filmmaker.


    The Jackie Collector Bear is available from the Franklin Mint, Franklin Center,
    PA 19091-0001, USA. Purchasers will be billed for three monthly installments of
    $30 each, plus state sales tax and single shipping charge of $5.95.'
  mdcn: '

    ## 你受得了吗？

    玛丽娜·维施米特 著，2001年12月10日

    收录于《沉默》第1卷第22期——艺术特辑

    超物化还是终极卑贱客体——收藏家们，你们说了算！

    这只熊可不是普通的熊——她正是“我们”挚爱的前第一夫人的转世。

    这只熊会“衰老”，皮毛会变得黏糊糊的——但真正的杰奎琳·欧在新墨西哥州的花园里闲庭信步，早在几年前就伪造了自己因绝症缓慢离世的假象。

    这泥人也并非真泥人——剥开毛皮，底下就是她：瓷白的皮肤，连她的贵族式指甲都做了手工清漆。

    https://www.metamute.org/editorial/articles/can-you-bear-it

    她的眼睛甚至会在房间里跟着你转！

    还好有那副包裹式太阳镜。

    我们还没说呢，她配有一个杰姬标志性手提包造型的衣柜，里面塞满了琳琅满目的11英寸小熊尺码A字裙，还有手工制作的私密小物件。

    把她重新拉上毛茸茸的“外壳”拉链，交给孩子们玩——还有什么比这更能让他们了解历史的？

    好了，杰姬，今天我们要玩猪湾事件。

    只要选择我们便捷的月度付款计划，很快你就能凑齐整个肯尼迪家族，供你精心陈列。

    这些熊可不是什么“三只熊”——它们是美国的贵族阶层！

    花上好几个惬意的时光给小约翰熊掸灰，它还有配套的微型飞机。

    拨动圆滚滚的泰德熊的四肢，它配有查帕奎迪克事件的微型配件。

    那玛丽莲熊呢？辛纳屈熊呢？

    一旦走上这条路，可就回不了头了。

    而杰姬在遇刺事件之后，也再也没了回头路。

    白宫找了个年轻的神似女星替代她的位置，杰姬则不带化妆包，前往野外，那里的露营者给她起了个外号叫“雪人”。

    如今这个故事可以说出来了：美国前第一夫人的两段人生，都由软雕塑来讲述。

    玛丽娜·维施米特（marinar@artserve.net）是一名电影制作人。

    杰姬收藏家熊由美国宾夕法尼亚州富兰克林中心富兰克林铸币厂（邮编19091-0001）发售。

    购买者需分三期支付，每月30美元，此外还需缴纳州销售税以及5.95美元的一笔运费。

    '
