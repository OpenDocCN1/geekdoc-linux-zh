  md: "\n# Command Line Quick Reference\n\nWhen you start using Linux full time, you\
    \ will quickly realise that the graphical interfaces of Ubuntu, Mint, etc. are\
    \ great for many tasks but not great for all tasks. Understanding how to use the\
    \ command line not only builds your understanding of Linux but also improves your\
    \ knowledge of coding and programming in general. Our command line quick reference\
    \ guide is designed to help you master Linux quicker.\n\n### TOP 10 COMMANDS\n\
    \nThese may not be the most common commands used by everyone but they will certainly\
    \ feature frequently for many users of Linux and the command line.\n\n- The **cd**\
    \ command is one of the commands you will use the most at the command line in\
    \ Linux. It allows you to change your working directory. You use it to move around\
    \ within the hierarchy of your file system. You can also use `cd` to move to specific\
    \ directories.\n- The **mv** command moves a file to a different location or renames\
    \ a file. For example `mv file sub` renames the original file to `sub`. `mv file\
    \ ~/Desktop` moves the file `file` to your desktop directory but does not rename\
    \ it. You must specify a new filename to rename a file.\n- The **ls** command\
    \ shows you the files in your current directory. Used with certain options, it\
    \ lets you see file sizes, when files were created and file permissions. For example,\
    \ `ls -l` shows you the files that are in your home directory.\n- The **chown**\
    \ command changes the user and/or group ownership of each given file. If only\
    \ an owner (a user name or numeric user ID) is given, that user is made the owner\
    \ of each given file, and the files' group is not changed.\n- The **cp** command\
    \ is used to make copies of files and directories. For example, `cp file sub`\
    \ makes an exact copy of the file whose name you entered and names the copy `sub`\
    \ but the first file will still exist with its original name.\n- The **chmod**\
    \ command changes the permissions on the files listed. Permissions are based on\
    \ a fairly simple model. You can set permissions for users, groups and world and\
    \ you can set whether each can read, write and or execute the file.\n- The **pwd**\
    \ command prints the full pathname of the current working directory (pwd stands\
    \ for \"print working directory\"). Note that the GNOME terminal also displays\
    \ this information in the title bar of its window.\n- The **rm** command removes\
    \ (deletes) files or directories. The remove process unlinks a filename in a filesystem\
    \ that removes data on the storage device and marks that space as usable by future\
    \ writes. In other words, removing files increases the amount of available space\
    \ on your disk.\n- The **clear** command clears your screen if this is possible.\
    \ It looks in the environment for the terminal type and then in the terminfo database\
    \ to figure out how to clear the screen. This is equivalent to typing Control-L\
    \ when using the bash shell.\n- Short for \"make directory\", **mkdir** is used\
    \ to create directories on a file system. If the specified directory does not\
    \ already exist, `mkdir` will create a working directory. More than one directory\
    \ may be specified when calling mkdir.\n\n![](img/5019375da05cbf0090115165d80772a1_80_0.png)\n\
