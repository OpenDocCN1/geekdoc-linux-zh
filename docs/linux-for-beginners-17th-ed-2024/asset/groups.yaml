    ## Getting to Know Linux


    We''ve used Linux Mint as a guideline here, as it''s an easy to use distro and
    perfect for former Windows users. It''s also one of the most developed and well
    documented Linux distros as well as having some fantastic configuration options.


    In this section, we introduce the Linux Mint Cinnamon Menu and Desktop Environment,
    how it works and what you can do to customise it. Want to create another user
    or even discover how to become anonymous online? Then read on.


    ### Introduction to the Cinnamon Menu


    Now that you have Linux installed it’s time to have a good look around. First
    though, if you’re using Virtualbox you’ll have a notification regarding Software
    Rendering; here’s how to fix it.


    #### CINNAMON VIRTUALBOX FIX


    You’ve already looked at some list functions, using .insert, .remove, and .pop
    but there are also functions that can be applied to strings.


    **STEP 1** Before we begin, we’re assuming you’re having this issue within Virtualbox.
    The Software Rendering message appears in the top right of the desktop. To fix
    this, click on Devices in the Virtualbox window, followed by Insert Guest Additions
    CD image.


    ![](img/5019375da05cbf0090115165d80772a1_29_0.png)


    **STEP 3** After a moment or two you’re automatically dropped into a command line
    view, called the Terminal in Linux. This details the installation of the new VirtualBox
    drivers, removing any old drivers it has detected, and installing the latest versions.
    It won’t take long and when it’s done you will be asked to hit Return to exit
    the Terminal.


    ![](img/5019375da05cbf0090115165d80772a1_29_1.png)


    **STEP 2** The Guest Additions CD contains drivers for Virtualbox, including the
    virtual video hardware. When it’s loaded in, you get a “software needs running”
    notification box with two options, Cancel and Run. Click the Run button and enter
    your Linux user password.


    ![](img/5019375da05cbf0090115165d80772a1_29_2.png)


    The Virtualbox Additions CD icon is on the desktop, so right-click it and then
    scroll the menu to click Eject. You can now restart Linux Mint by clicking the
    Menu, the bottom icon in the strip to the left, then the Restart button. This
    reboots Mint and the problem is fixed.


    ![](img/5019375da05cbf0090115165d80772a1_29_3.png)


    ### CINNAMON ON THE MENU


    Now the Software Rendering issue for Virtualbox users is out of the way, let''s
    take a look at the Mint Menu and how it all works. Remember, this is just for
    Mint Cinnamon, other distros look and behave differently.


    **STEP 1** First off, you may have already noticed the Welcome Screen that pops
    up when you login to Linux Mint. Take a moment to browse through the options,
    read the First Steps option and so on. When you''re done, click the X in the top
    right corner of the window to close it.


    ![](img/5019375da05cbf0090115165d80772a1_30_0.png)


    ![](img/5019375da05cbf0090115165d80772a1_30_1.png)


    **STEP 2** You''ve already used the Mint Menu to reboot the system and when you
    first used the Live Environment. This time, click the Menu button and hover over
    the Office entry in the middle column. This changes the icons represented in the
    right-hand column, detailing what apps are installed under that section.


    ![](img/5019375da05cbf0090115165d80772a1_30_2.png)


    ![](img/5019375da05cbf0090115165d80772a1_30_3.png)


    **STEP 3** Launching any of the apps from the Menu is as simple as finding one
    and clicking it. For example, under the Office section, click on LibreOffice Writer:
    Writer is the preinstalled word processor for Linux Mint. It opens and saves as
    Microsoft Word and functions in almost the same way.


    ![](img/5019375da05cbf0090115165d80772a1_30_4.png)


    ![](img/5019375da05cbf0090115165d80772a1_30_5.png)


    **STEP 4** Open up the Menu again but this time hover the mouse pointer over Graphics,
    then click on GNU Image Manipulation Program. GIMP is a powerful image manipulation
    app that''s probably as effective as Adobe''s Photoshop but requires a little
    more work to get the results you want. It''s certainly worth taking the time to
    master, though.


    **STEP 5** If you''re looking for a particular function or app, such as setting
    up a printer, click on the Search box at the top of the Menu box. Start typing
    the app or function you want, such as printers, and the Mint Menu displays the
    relevant options below. This works with most modern Linux menus, regardless of
    the distro.


    **STEP 6** Hover over any of the apps listed on the right-hand column and right-click,
    to be presented with a list of options: Add to Panel, Add to Desktop, Add to Favourites
    and Uninstall. Most of these options are obvious in their use. Add to Favourites
    though places the app in the left-hand, quick-access column.


    ## Navigating the Cinnamon Desktop


    Each desktop environment behaves differently to that of the next. Some DEs offer
    widgets that can be customised and placed on the desktop, others instead opt for
    a clean, sharp look to keep everything running as fast as possible. Let’s see
    what the Cinnamon desktop has to offer.


    ### A TOUCH OF SPICE


    The Cinnamon desktop environment is a great blend of style and performance. There’s
    lots to like about it, which is why it’s such a popular DE.


    **STEP 1** Begin exploring the Cinnamon desktop by double-clicking the Computer
    icon. This brings up Nemo, the file manager used in Cinnamon. The Computer icon
    opens up the root level file system, with access and views to the optical drive
    (if you have one installed), hard drive and core Linux file system.


    ![](img/5019375da05cbf0090115165d80772a1_31_0.png)


    **STEP 2** The Linux file system can appear confusing to a former Windows user,
    so until you’re a little more knowledgeable on how it all works, we’d recommend
    you concentrate on the Home icon on the desktop instead. In here is everything
    relating to your user account: where you store Pictures, Videos, Music, Documents,
    Downloaded items etc.


    ![](img/5019375da05cbf0090115165d80772a1_31_1.png)


    **STEP 3** Nemo has many different features, views and ways so that you can view
    and manipulate files and folders. For example, if you have any images in the Pictures
    folder, you can select the icon zoom level for the images by using the slider
    located in the bottom right of Nemo, labelled Adjust Zoom Level.


    ![](img/5019375da05cbf0090115165d80772a1_31_2.png)


    **STEP 4** Just like any good file manager, if you right-click any of the files
    or folders within you get a wealth of options. In the case of Cinnamon, the defaults
    allow you to play or view a file depending on what type of file it is and copy,
    cut, delete, compress, rename, send via email and view its properties.


    ![](img/5019375da05cbf0090115165d80772a1_31_3.png)

