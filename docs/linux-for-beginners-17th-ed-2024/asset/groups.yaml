    \ each statement on a new line. Save the script and exit back into the Terminal.\n\
    \n![](img/5019375da05cbf0090115165d80772a1_69_3.png)\n\n- **STEP 5**\n  When you\
    \ run the script now you can use two custom variables ..,/hello.sh David Hayward.\
    \ Naturally change the two variables with your own name, unless you’re also called\
    \ David Hayward. At the moment we’re just printing the contents, so let’s expand\
    \ the two-variable use a little.\n\n![](img/5019375da05cbf0090115165d80772a1_70_0.png)\n\
    \n- **STEP 6**\n  Create a new script called **addition.sh**, using the same format\
    \ as the hello.sh script, but changing the variable names. Here we’ve added **firstnumber**\
    \ and **secondnumber**, and used the echo command to **first** **number** simple\
    \ arithmetic by placing an integer expression. **echo The sum is $(($firstnumber+$secondnumber))**.\
    \ Save the script, and make it executable (**chmod +x addition.sh**).\n\n![](img/5019375da05cbf0090115165d80772a1_70_1.png)\n\
    \n- **STEP 7**\n  When you now run the addition.sh script we can enter two numbers:\
    \ **./addition.sh 1 2**. The result will hopefully be 3, with the Terminal displaying\
    \ **The sum is 3**. Try it with a few different numbers and see what happens.\
    \ See also if you can alter the script and rename it do multiplication, and subtraction.\n\
    \n![](img/5019375da05cbf0090115165d80772a1_70_2.png)\n\n- **STEP 8**\n  Let’s\
    \ expand things further. Create a new script called **greetings.sh**. Enter the\
    \ scripting as below in the screenshot, save it and make it executable with the\
    \ **chmod** command. You can see that there are a few new additions to the script\
    \ now.\n\n![](img/5019375da05cbf0090115165d80772a1_70_3.png)\n\n- **STEP 9**\n\
    \  We’ve added a **–n** to the echo command here which will leave the cursor on\
    \ the same line as the question. Instead of a new line. The **read** command stores\
    \ the users’ input as the variables **firstname** and **surname**, so then read\
    \ back later in the last **echo** line. And the **clear** command clears the screen.\n\
    \n![](img/5019375da05cbf0090115165d80772a1_70_4.png)\n\n- **STEP 10**\n  As a\
    \ final addition, let’s include the date variable we used in the last section.\
    \ Amend the last line of the script to read: **echo Hello $firstname $surname,\
    \ how are you on this fine $(date +%a)?**. The output should display the current\
