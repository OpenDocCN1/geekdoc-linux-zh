    ## 导航 cinnamon 桌面


    **第 5 步** 在桌面底部是面板（Panel）。我们已经查看过面板的一个部分，即菜单。如果在面板的任何位置（面板上的应用程序除外）进行右键单击，你将看到一个允许你编辑、添加并以不同方式设置面板的菜单。


    ![](img/5019375da05cbf0090115165d80772a1_32_0.png)


    **第 6 步** 例如，如果你点击“修改面板”（Modify Panel）选项，你可以移除、移动、重新编号、修改面板，添加新面板，并清除当前存在的小工具（Applets）。顺便说一下，小工具（Applet）是专为在
    Cinnamon 面板中运行和适配而设计的应用程序。


    ![](img/5019375da05cbf0090115165d80772a1_32_1.png)


    **第 7 步** 如果在 Cinnamon 桌面的任何位置右键单击，你会看到一组允许你进一步添加、编辑或以不同方式查看桌面内容的选项。这与 Windows
    非常相似，这就是为什么 Mint 是前 Windows 用户的良好选择。


    ![](img/5019375da05cbf0090115165d80772a1_32_2.png)


    **第 8 步** 从该桌面右键菜单中，选择“自定义”（Customize），然后选择新打开窗口底部的“桌面图标设置”（Desktop Icons Settings）链接。这会打开一个新窗口，你能够编辑存在哪些桌面图标。如果你使用的是连接了多个显示器的设置，你还可以选择哪个显示器显示哪些图标。


    ![](img/5019375da05cbf0090115165d80772a1_32_3.png)


    **第 9 步** 点击菜单并输入 `system settings`，然后打开生成的图标。这将带你进入系统设置选项。从这里，你可以控制和编辑 Linux
    Mint Cinnamon 的外观和工作方式，还可以添加新用户、管理防火墙以及启用无障碍选项。


    ![](img/5019375da05cbf0090115165d80772a1_32_4.png)


    **第 10 步** 简而言之，Linux Mint Cinnamon 可以被配置得相当出色。有许多示例展示了它的良好程度以及可以实现的效果。你可以选择复杂或简单，添加不同的组件和动画，或者保持其简洁易读。


    ![](img/5019375da05cbf0090115165d80772a1_32_5.png)


    # 安装 Linux Mint 后的 10 件事


    Linux Mint 开箱即用的发行版经过精心打磨，但与大多数 Linux 发行版一样，有一些调整可以改善其工作方式。虽然这些是 Mint 特有的调整，但大多数都可以应用于其他发行版。


    ## Linux 调整


    其中一些安装后操作是高度推荐的，而另一些只是方便的功能，用于微调系统或添加自定义设置。


    ### **第 1 步**


    首先，也是最重要的是安装后更新系统。点击面板中的盾牌图标，它位于桌面右下角的时间/日期旁边。这将启动更新管理器（Update Manager）。


    ![](img/5019375da05cbf0090115165d80772a1_33_0.png)


    ### **第 2 步**


    Linux Mint 提供三种级别的更新策略：不弄坏我的电脑（Don''t Break My Computer）、优化稳定性和安全性（Optimise Stability
    and Security）以及始终更新所有内容（Always Update Everything）。推荐选项是“优化稳定性和安全性”，它只更新不会影响核心操作系统关键元素的、安全的必要补丁。请阅读描述，但选择中间也是推荐的选项。


    ![](img/5019375da05cbf0090115165d80772a1_33_2.png)


    ### **第 3 步**


    点击“确定”（OK）按钮，你将看到几个准备安装的更新。但在更新之前，点击蓝色条上的“确定”按钮切换到本地镜像（Local Mirror）。这将打开“软件源”（Software
    Sources）选项。在“镜像”（Mirrors）部分，点击“主”和“基础”（Main and Base）下拉菜单，并选择离你当前位置最近的服务器。


    ![](img/5019375da05cbf0090115165d80772a1_33_1.png)


    ### **第 4 步**


    点击“更新缓存”（Update the Cache）按钮，然后关闭软件源窗口。回到更新管理器，点击“安装更新”（Install Updates）图标并输入你的密码。更新会自动应用并重新启动更新管理器；这次会有更多选项。再次点击“安装更新”，确认所有消息，并等待完成。


    ![](img/5019375da05cbf0090115165d80772a1_33_3.png)


    ### **第 5 步**


    更新按级别分级，级别 1 是低级到级别 3 的更新，级别 5 是危险的更新。请坚持使用级别 3 的更新，如果你配置了关于覆盖配置文件的替换消息，请点击“替换”（Replace）。关于软件渲染问题以及非
    VirtualBox 用户缺少驱动程序的问题，点击菜单并在搜索框中输入“driver”。


    ![](img/5019375da05cbf0090115165d80772a1_34_0.png)


    ### **第 6 步**


    点击搜索结果中出现的“驱动程序管理器”（Driver Manager）应用程序并输入你的密码。Mint 会花一点时间分析可用的内容，并根据检测到的硬件向你展示一组潜在驱动程序的列表。遇到图形问题（如软件渲染）的用户应选择使用最新的推荐图形驱动程序。


    ![](img/5019375da05cbf0090115165d80772a1_34_2.png)


    ### **第 7 步**


    此时你很可能需要重启 Linux Mint，所以现在就执行此操作。重启后，再次点击“菜单”按钮，然后选择“终端”（Terminal）。终端图标位于左侧栏，在“文件”（Files）图标上方。打开终端后，输入：`sudo
    apt-get install libdvd-pkg` 按 Enter 并输入你的密码。这可以启用加密 DVD 播放功能。


    ![](img/5019375da05cbf0090115165d80772a1_34_4.png)


    ### **第 8 步**


    当被要求接受更改时，输入 Y，当被要求配置 lsbvd 时同样输入 Y。确保 OK 被高亮显示，然后按 Enter，对任何进一步的问题回答 Yes。接下来，仍在终端中，输入：`cat
    /proc/sys/vm/swappiness`；结果应为 60。如果你的电脑 RAM/内存少于 4GB，请输入：`gksudo xed /etc/sysctl.conf`。


    ![](img/5019375da05cbf0090115165d80772a1_34_1.png)


    ### **第 9 步**


    此调整有助于提高内存少于 4GB 的系统性能。向下滚动到你刚才打开的文件底部，并添加以下新行：


    `# Decrease swap usage to a more reasonable level`


    `vm.swappiness=10`


    点击“文件 > 保存”，然后“文件 > 退出”。重启 Linux Mint，你应该会注意到性能略有提升。


    ![](img/5019375da05cbf0090115165d80772a1_34_3.png)


    ### **第 10 步**


    在如今这个数字化时代，安全始终是一个关注点。虽然 Linux Mint 是一个安全的系统，但建议始终尝试改进它。点击“菜单”按钮并搜索“Firewall”；点击“防火墙配置”（Firewall
    Configuration）图标并输入你的密码。在防火墙窗口中，点击状态滑块将其设为“开”（On）。


    ![](img/5019375da05cbf0090115165d80772a1_34_5.png)


    # 阿波罗 11 号


    **你知道吗……** 1969 年 7 月 20 日被铭记为人类历史的转折点，那是人类首次踏上月球的时候。帮助宇航员完成那次关键旅程的软件在当时甚至不存在，必须从头开发。麻省理工学院仪表实验室（MIT
    Instrumentation Laboratory）的工程师使用一种名为绳存储器（Rope Memory）的新方法来存储程序，用汇编语言的特殊版本填充了存储器。


    令人难以置信的是，那段代码在 GitHub 上可以免费查看。由一位研究人员于 2003 年上传，你可以通过访问 www.github.com/Chai2010/aag/Apollo-11
    来查看代码。留意代码片段，例如 Burn_Baby_Burn，特别是第 925 行，注释为“再见。很快再回来。”（Goodbye. Come again soon.）


    浏览一下，看看你还能找到什么。


    ![](img/5019375da05cbf0090115165d80772a1_35_0.png)


    ![](img/5019375da05cbf0090115165d80772a1_35_1.png)


    你知道吗……


    人类的一大步，也是编程的一大步。


    ![](img/5019375da05cbf0090115165d80772a1_36_0.png)


    信用：Apollo 11/NASA


    # 创建用户


    当你首次安装 Linux Mint 时，它被配置为单用户模式。虽然与家人共享用户账号没问题，但可能会出现你需要创建具有自己独立主文件夹的独立用户的情况。


    ## 新用户


    拥有不同的用户意味着每个用户都可以访问系统中属于他或她自己的区域。文档、图片、视频等是独立的，这与在其他操作系统中的多用户情况类似。


    **第 1 步** 点击 Linux Mint 菜单并输入 ''users'' 开始搜索相关的控制台。从搜索结果中，选择“用户和组”（Users and Groups）并输入你的密码。“用户和组”控制台看起来相当简单，幸运的是它很容易使用。起初，你只能看到安装
    Linux Mint 时自己的用户名。


    ![](img/5019375da05cbf0090115165d80772a1_37_0.png)


    **第 2 步** 要添加新用户，点击控制台底部的“添加”（Add）按钮。你可以创建两种类型的用户：标准（Standard）和管理员（Administrator）。除非新用户需要安装新应用程序或访问主文件夹之外的文件系统部分，否则请选择标准账号类型。否则，请使用管理员账号类型。


    ![](img/5019375da05cbf0090115165d80772a1_37_1.png)


    **第 3 步** 输入新用户的“全名”（Full Name），然后输入登录 Linux Mint 时需要的“用户名”（Username）。确保用户名全部小写，仅限
    a-z 和 0-9 字符。如果你愿意，可以使用句号、下划线或连字符。准备好继续时，点击“添加”按钮。


    ![](img/5019375da05cbf0090115165d80772a1_37_2.png)


    **第 4 步** 新用户会出现在当前 Linux Mint 用户的列表中，按字母顺序排列。目前，尚未设置密码，因此点击当前用户列表中的该用户，然后点击用户名下方的“未设置密码”（No
    Password Set）选项。


    ![](img/5019375da05cbf0090115165d80772a1_37_3.png)

