  mdcn: '


    # 通过终端更新 Mint


    ## 第 5 步


    根据你更新的状况，如果有任何待安装的内容，你可能会被询问是否要应用 `sudo apt-get upgrade` 命令的结果。你可以按 Y 键接受并继续。这里正在发生的是，apt-get
    有一些更新软件需要应用到 Mint 上，我们正在确认执行此操作。


    ![](img/5019375da05cbf0090115165d80772a1_48_0.png)


    ## 第 6 步


    你的终端窗口可能会显示一长串看似无意义内容的列表，但别担心。升级所需的文件已经下载、准备、解包、处理、安装并正确设置完毕。即使是最小的软件包，执行升级时背后也有许多运作正在进行。


    ![](img/5019375da05cbf0090115165d80772a1_48_2.png)


    ## 第 7 步


    基本上就是这样了，根据 `sudo apt-get update` 命令提供的可用软件包列表，你的系统现在是最新的。你可以再运行一遍该流程，以检查一切是否正常。总结一下，请输入：`sudo
    apt-get update`，按 Enter，然后输入：`sudo apt-get upgrade` 并按 Enter。


    ![](img/5019375da05cbf0090115165d80772a1_48_1.png)


    ## 第 8 步


    有趣的是，Linux Mint 以及其他发行版都提供了将多个命令串联起来的功能。因此，在这个示例中，我们可以使用 `sudo apt-get update
    && sudo apt-get upgrade`。双与符号（&&）用于组合命令，只要前一个命令没有出错，它就能完美工作。建议在每次会话开始时都运行更新和升级的组合命令。


    ![](img/5019375da05cbf0090115165d80772a1_48_3.png)


    ## 终端还是更新管理器？


    无论你使用哪种发行版，为什么使用终端来更新和升级，而不是使用更新管理器呢？一些用户非常倾向于使用终端来更新他们的 Linux 系统及附带的应用程序，认为这样更好。然而，事实往往并非如此。


    使用终端时，`apt-get upgrade` 无法处理软件包版本之间依赖关系的变化，因此如果一个软件包的依赖文件从一个版本到另一个版本发生了变化，升级就会被保留（搁置）。


    更新管理器或软件管理器（取决于发行版）通常会分阶段处理更新，并标记那些依赖关系发生变化的软件包以便更新。然而，这正是 Linux 经常让人感到困惑的地方，有时它又不会这样做。


    归根结底，这取决于被更新软件包的开发者，以及该软件包在发行版仓库中的存储方式，还有该更新是否被归类为稳定版。从用户的角度来看，本质上，如果你定期使用终端和更新管理器进行更新和升级，你就能保持尽可能新的状态，并获得基本且必要的稳定版本软件包和核心软件。如果你追求最前沿的软件包更新，最好选择滚动更新类型的发行版。


    # 通过终端安装应用程序 – 第一部分


    在 Linux 上安装应用程序和程序有多种方法。你可以选择图形化路线，使用软件管理器，或者使用终端。通常，终端提供了对所安装软件的更好控制，有时你在这方面也没有选择余地。


    ## 命令行安装


    使用终端安装应用程序可能需要一些灵活的键盘操作，但你能更清楚地了解正在安装什么以及安装在哪里。


    - **第 1 步**：通过终端安装应用程序通常比较简单。不过，首先你需要确保系统是最新的。为此，打开终端并输入：`sudo apt-get update
    && sudo apt-get upgrade`。输入你的密码并接受任何必要的更新。


    ![](img/5019375da05cbf0090115165d80772a1_49_0.png)


    - **第 2 步**：正如你所见，`sudo apt-get update/upgrade` 等命令旨在升级系统中已安装的软件。那么如何安装更多应用程序呢？其实这非常简单。首先你需要一个要安装的应用程序，让我们再次使用
    Stella。输入：`sudo apt-get install stella`。


    ![](img/5019375da05cbf0090115165d80772a1_49_2.png)


    - **第 3 步**：你需要输入 y 以确认安装，这将占用系统中约 5.5MB 的存储空间。Stella 安装完成后，你可以再次看到 Mint 在菜单中自动创建了“游戏”类别以及应用程序快捷方式。


    ![](img/5019375da05cbf0090115165d80772a1_49_1.png)


    - **第 4 步**：有时，在安装软件时，你需要添加该应用程序的软件仓库。仓库（repo）仅仅是保存软件及其所有依赖项（使其正常运行所需的重要库等）的远程服务器位置。先输入以下内容：`sudo
    add-apt-repository ppa:peterlewi/ppa`。当被要求添加 PPA（个人软件包存档）时，按 Enter。


    ![](img/5019375da05cbf0090115165d80772a1_49_3.png)


    ## 第 5 步


    这将添加 Variety 壁纸更换器的仓库，这是一个基于 Ubuntu 的应用程序，在 Mint 中可用并能自动更换壁纸。既然仓库已添加，请输入：`sudo
    apt-get update`，以更新新信息并将仓库内容添加到软件包数据库中。


    ![](img/5019375da05cbf0090115165d80772a1_50_0.png)


    ## 第 6 步


    现在要安装 Variety，请输入：`sudo apt-get install variety`。按 y 以确认并接受安装，以继续安装过程。安装完成后，你可以在终端中输入
    `variety` 来运行该应用程序。


    ![](img/5019375da05cbf0090115165d80772a1_50_1.png)


    ## 移除应用程序


    除了安装应用程序外，`apt` 命令还可用于移除任何应用程序，有助于保持系统整洁并释放资源。


    ## 第 1 步


    要卸载或移除 Variety 应用程序，请输入以下内容：`sudo apt-get remove variety`。输入 y 以继续卸载该应用程序；请注意，移除应用程序后，你还会收到关于硬驱动器释放了多少空间的信息。


    ![](img/5019375da05cbf0090115165d80772a1_50_2.png)


    ## 第 2 步


    虽然 ''apt-get remove'' 命令会卸载应用程序，但它不会清除随应用程序而来的额外杂乱文件，例如配置文件和库文件。要彻底清除这些杂乱文件，请输入：`sudo
    apt-get purge variety`。


    ![](img/5019375da05cbf0090115165d80772a1_50_4.png)


    ## 第 3 步


    当你从系统中移除应用程序时，你会收到一些自动安装且不再需要的软件包的信息。你在之前的教程中已经看到，你可以使用以下命令来清理：`sudo apt-get autoremove`，然后按
    y 接受该过程。


    ![](img/5019375da05cbf0090115165d80772a1_50_3.png)


    ## 第 4 步


    最后，为了清理系统中所有未使用的软件包，并移除 autoremove 命令未清理的元素，你可以输入：`sudo apt-get autoclean`。最后这几个步骤对于保持
    Linux Mint 系统处于良好运行状态以及削减因安装和升级造成的不必要冗余至关重要。


    ![](img/5019375da05cbf0090115165d80772a1_50_5.png)


    # 通过终端安装应用程序 – 第二部分


    大多数时候，你可以使用标准的 `apt-get` 命令从终端安装应用程序。然而，有时应用程序需要更多的操作。这意味着从源代码安装应用程序，这听起来虽然吓人，但其实并不可怕。


    ## 从源代码


    你需要熟悉这里的命令是 Configure、Make 和 Install。你会发现很多应用程序都是从源代码安装的，所以这绝对是值得投入时间掌握的一项技能。


    1. **第 1 步**：Linux 的源代码文件通常以 `.TAR.GZ` 或 `.TAR.BZ2` 形式提供。两者都是压缩文件，包含构建应用程序所需的所有核心文件。通过这个教程，通过在主目录创建新文件夹来开始：`mkdir
    vim`。

    2. **第 2 步**：顺便说一下，Vim 是一个高级文本编辑器，我们将用它作为安装示例。进入新文件夹，`cd vim`，然后在新 Vim 文件夹内，在终端中输入以下命令：`wget
    ftp://ftp.vim.org/pub/vim/unix/vim-7.4.tar.bz2`。

    3. **第 3 步**：`wget` 命令从互联网获取内容，在这种情况下是 Vim 的 BZ2 文件。要检查文件是否成功下载，请输入 `ls`。根据 Mint
    的文件系统颜色标记，压缩文件应以红色显示。


    ![](img/5019375da05cbf0090115165d80772a1_51_0.png)


    ![](img/5019375da05cbf0090115165d80772a1_51_1.png)


    4. **第 4 步**：现在我们需要解压缩文件的内容，所以在终端中输入：`tar -xf vim-7.4.tar.bz2`。注意：你可以输入 `tar -xf
    v` 并按 Tab 键来自动填充剩余的文件名。


    ![](img/5019375da05cbf0090115165d80772a1_51_2.png)


    ![](img/5019375da05cbf0090115165d80772a1_51_3.png)


    '
