    # Using the Terminal


    # Creating Bash Scripts

    – Part 2


    Previously we looked at creating your first Bash script, Hello World, and adding
    a system variable. Now you can expand these and see what you can do when you start
    to play around with your own unique variables.


    # VARIABLES


    Just as in every other programming language a Bash script can store and call certain
    variables from the system, either generic or user created.


    +   **STEP 1**

    +   Let’s start by creating a new script called hello.sh;

    +   `xed hello.sh.` In it enter: `#!/bin/bash`, then, echo Hello $1. Save the
    file and exit Xed. Back in the Terminal make the script executable with `chmod
    +x hello.sh.`


    +   **STEP 3**

    +   The output now will be Hello David. This is because Bash automatically assigns
    variables for the user, which are then held and passed to the script. So the variable
    ''$1'' now holds ‘David’. You can change the variable by entering something different:
    `./hello.sh Mint`.


