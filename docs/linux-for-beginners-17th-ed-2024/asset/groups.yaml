  - '[PAGE 26]


    # Installing Linux in a Virtual Environment


    **STEP 5** The pop-up window that appears after clicking Create is asking you
    what type of virtual hard disk you want to create. We''re going to use the default
    VDI (VirtualBox Disk Image) in this case, as the others are often used to move
    VMs from one VM application to the next. Make sure VDI is selected, and click
    Next.


    ![](img/5019375da05cbf0090115165d80772a1_26_0.png)


    **STEP 6** The question of whether to opt for Dynamically or Fixed sized virtual
    hard disks may come across as being somewhat confusing to the newcomer. Basically,
    a Dynamically Allocated virtual hard disk is a more flexible storage management
    option. It won''t take up much space within your physical hard disk to begin with
    either. Ensure Dynamically Allocated is selected, and click Next.


    ![](img/5019375da05cbf0090115165d80772a1_26_1.png)


    **STEP 7** The virtual hard disk will be a single folder, up to the size you state
    in this section. Ensure the location of the virtual hard disk, on your computer,
    has enough free space available. For example, we''ve used a bigger storage option
    on our D\ drive, named it Linux Mint, and allocated 25.50GB of space to the virtual
    hard disk.


    ![](img/5019375da05cbf0090115165d80772a1_26_2.png)


    **STEP 8** After clicking Create the initial setup of the VM is complete; you
    should now be looking at the newly created VM within the VirtualBox application.
    Before you begin though, click the Settings button from the top of the right-hand
    panel, and within the General section click the Advanced tab. Using the pull-down
    menus, choose ''Bidirectional'' for both Shared Clipboard and Drag''n''Drop.


    ![](img/5019375da05cbf0090115165d80772a1_26_3.png)


    **STEP 9** Follow that by clicking on the System section, then the Processor tab.
    Depending on your CPU allocate as many cores as you can without detriment to your
    host system; we''ve opted for two CPUs. Now click on the Display section, slide
    the Video Memory up to the maximum, and tick ''Enable 3D Acceleration''. Click
    OK to commit the new settings.


    ![](img/5019375da05cbf0090115165d80772a1_26_4.png)


    **STEP 10** Click on the Start button and use the explorer button in the ''Select
    Start-up Disk'' window; the explorer button is a folder with a green arrow. Click
    Add in the new pop-up window, to locate the downloaded ISO of Mint; and click
    Open to select the ISO. Now click the Start button to boot the VM with the Linux
    Mint Live Environment. You can now install Linux as per the standard PC installation
    requirements.


    ![](img/5019375da05cbf0090115165d80772a1_26_5.png)'
