    ## 使用终端


    **你知道吗……**


    NASA 最先进的超级计算机集群 Pleiades 由 Linux 驱动。Pleiades 由 160 个机架（11,440 个节点）、245,536 个
    CPU 核心、935TB 的总内存、184,320 个 NVIDIA CUDA 核心以及超过 6 英里长的光纤电缆组成。


    其核心是一个复杂的 SUSE Linux 企业服务器（SUSE Linux Enterprise Server）设置，以及许多针对 NASA 项目独有的定制开发包和其他软件。NASA
    高级超级计算部门使用 Pleiades 开展的项目包括：开普勒任务——搜索类地系外行星；用于帮助创建更高效太空发射系统的计算流体动力学（CFD）建模；暗物质研究与模拟；以及地球洋流的可视化，为
    ECCO（海洋环流与气候估计）项目构建数据。


    ![](img/5019375da05cbf0090115165d80772a1_83_0.png)


