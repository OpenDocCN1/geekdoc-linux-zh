    与此同时，openSUSE 试图兼顾两者。openSUSE Leap 是那个坚如磐石的系统；它由社区和 SUSE 员工共同开源开发，后者开发企业级操作系统
    SUSE；SUSE 支撑着伦敦证券交易所等重要设施。它专为关键任务环境设计，在这些环境中没有不稳定的空间；如果你觉得这些太保守了，openSUSE Tumbleweed
    是一个滚动发行版，拥有所有最新功能，偶尔也会崩溃。


