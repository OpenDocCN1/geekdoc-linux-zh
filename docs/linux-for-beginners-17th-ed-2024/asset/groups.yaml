    ## VPN 与 Tor


    之前的步骤有助于保护您的在线隐私，但若要真正匿名，您还需要虚拟私人网络（VPN）和 Tor。


    ### 步骤 1

    VPN 是一台远程服务器，或一组服务器集群，它会与您的计算机建立连接。最终结果是您的计算机在互联网上的身份被隐藏在 VPN 远程服务器之后；因此，即使您居住在英国，也可能拥有一个属于冰岛的
    IP 地址（即计算机的在线身份）。


    ### VPN 是如何工作的？


    ![](img/5019375da05cbf0090115165d80772a1_42_0.png)


    ### 步骤 2

    大多数优秀的 VPN 都需要支付月度或年度费用，但这笔花费是值得的。我们使用 CyberGhost，[www.cyberghostvpn.com](http://www.cyberghostvpn.com)，它提供适用于
    Windows、Mac、Mint（以及其他 Linux 发行版）、Android 和 iOS 设备的 VPN 连接。各操作系统的详细信息可在 [www.support.cyberghostvpn.com/hc/en-us/articles/213190329-Read-me-first.](http://www.support.cyberghostvpn.com/hc/en-us/articles/213190329-Read-me-first.)
    上找到。


    ![](img/5019375da05cbf0090115165d80772a1_42_1.png)


    ### 步骤 3

    另一个选择是使用 Tor。Tor 是一个开放网络，它通过在全球无数节点后隐藏您的 IP 地址，帮助掩盖您的活动。它适用于 Windows、Mac 和 Linux
    计算机，安装和使用都非常简单。首先请访问 [www.torproject.org/download/download-easy.html](http://www.torproject.org/download/download-easy.html)
    并点击“下载 Linux 64 位”按钮。


    ![](img/5019375da05cbf0090115165d80772a1_42_2.png)


    ### 步骤 4

    下载完成后，进入终端并进入下载文件夹，输入 `cd Downloads/`。输入 `ls` 检查 tor.xz 文件是否存在，然后输入 `tar -xf tor-browser--linux-x86_64-0.4.8-en-US.tar.xz`
    进行常规解压。如果您的版本不同，请按 Tab 键自动补全 tor--browser--文件名。文件解压后，使用 `cd tor-browser_en-US/`
    进入新文件夹。


    ![](img/5019375da05cbf0090115165d80772a1_42_3.png)


    ### 步骤 5

    快速执行 `ls` 命令会显示几个条目：一个名为 Browser 的文件夹和一个名为 `start-tor-browser.desktop` 的文件。要启动
    Tor 设置，请输入 `./start-tor-browser.desktop`。此命令将启动 Tor 设置，您将被提供两个选项：连接（Connect）或配置（Configure）。对于大多数用户来说，连接选项就足够了。准备好后点击连接。


    ![](img/5019375da05cbf0090115165d80772a1_42_4.png)


    ### 步骤 6

    连接建立后，Tor 浏览器将启动。这是 Firefox 的一个定制版本，可以帮助您安全地浏览互联网，无需担心被监视或跟踪。同时使用 VPN 和 Tor 可以形成极其安全和私密的在线世界连接。


    ![](img/5019375da05cbf0090115165d80772a1_42_5.png)


