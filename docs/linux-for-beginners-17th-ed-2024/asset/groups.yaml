    \ 比你想象的要丰富得多。\n\n## 免费且开放\n\nLinux 非常适合那些想要与众不同的人。系统的高效性、应用的可用性以及稳定性只是其诸多优点中的几个。\n\
    \n你需要知道的第一件事是，并不存在一个名为 Linux 的操作系统。Linux 实际上是操作系统的内核，是操作系统核心组件。当我们（以及其他人）谈论 Linux\
    \ 时，指的是众多使用 Linux 内核的发行版（distros）中的一个。毫无疑问，你至少听说过当前流行的某个发行版：Ubuntu、Linux Mint、Fedora、openSUSE、Debian、Raspbian，列表还在继续。这些每个发行版都为使用者提供了一些略有不同的东西。虽然它们的核心都是\
    \ Linux 内核，但它们为用户提供不同的桌面环境外观、不同的预装应用程序、不同的系统更新和软件安装方式，以及整个系统略微不同的外观和感觉。然而，中心依然是\
    \ Linux，这就是我们说 Linux 的原因。\n\nLinux 的工作方式与 Windows 或 macOS 大相径庭。首先，它是免费的：免费下载、免费安装到任意多台计算机、免费使用无限时长，并且可以免费升级和扩展，搭配同样免费的程序和应用程序。这种免费使用的特性是开发者最大的吸引点之一。虽然一个\
    \ Windows 许可证可能高达 100 英镑，而 Mac 的费用则更高，但用户——无论是开发者、游戏玩家还是想利用旧电脑的人——可以在几分钟内快速下载一个发行版并开始工作。与免费使用并存的，是一种自定义和塑造系统以满足自身用途的自由。互联网上可用的每个发行版都有一定的“倾向”，有些提供增强的安全性，有些提供外观华丽的桌面，有些针对游戏进行优化，还有些面向学生群体。这种可扩展性使\
    \ Linux 成为一个更令人向往的平台，因为你可以迅速将系统塑造成一个开发基础，包括 Python、Web 开发、C++、Java 等各种 IDE（集成开发环境）；或者创建一个网络匿名基础，例如作为\
    \ Minecraft 服务器、媒体中心等等。\n\nLinux 是一个开启编码旅程的绝佳操作系统。\n\n![](img/5019375da05cbf0090115165d80772a1_7_0.png)\n\
    \n![](img/5019375da05cbf0090115165d80772a1_8_0.png)\n\n# Linux 下有成千上万的免费包可供程序员使用。\n\
