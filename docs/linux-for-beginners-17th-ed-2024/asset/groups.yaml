    **STEP 6** Click the Menu button and search for ‘desktop’ and click the Desktop
    Settings result. The Desktop console allows you to pick the layout, desktop icons
    and options for multi-monitor support you want. You can experiment with the options
    for the best setup, according to your personal tastes.


    ![](img/5019375da05cbf0090115165d80772a1_40_2.png)


    **STEP 9** If you click on the **Add/remove** button in the centre of the three
    available options, you can choose the default view from a number of preinstalled
    themes. Click the theme you want, then click the **Install** (downward-pointing
    arrow) button to enable it.


