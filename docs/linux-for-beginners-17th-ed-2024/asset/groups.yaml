    \ and press **Enter**. Close Firefox to return to the Terminal. Providing you\
    \ know the name of the app, it can run from the Terminal. Additionally, entering\
    \ **firefox** opens Firefox, AND lets you still use the Terminal.\n\n![](img/5019375da05cbf0090115165d80772a1_56_5.png)\n"
  mdcn: "\n## 通过终端安装应用程序 — 第 2 部分\n\n- **步骤 5** 如果你再次输入 `ls`，你会注意到一个新文件夹已被创建：`vim74`；在\
    \ `Mint` 系统中，文件夹通常以浅蓝色文本表示。为主应用程序创建根文件夹总是很方便。你可以通过这种方法升级应用程序，每个版本将有其自己的文件夹。\n\n\
    ![](img/5019375da05cbf0090115165d80772a1_52_0.png)\n\n- **步骤 6** 输入 `cd vim74`\
    \ 以进入该文件夹，然后再次输入 `ls` 查看其内容。里面可能有很多文件；大多数是应用程序的核心文件，而另一些则标记为 `README` 或 `INSTALL`。首先阅读这些文件总是明智之举，因为它们提供了关于安装的宝贵信息。\n\
    \n![](img/5019375da05cbf0090115165d80772a1_52_1.png)\n\n- **步骤 7** 安装的第一部分要求你输入\
    \ `./configure`。`./configure` 命令将检查你的系统是否缺少与该应用程序相关的依赖项。如果你收到有关 C 编译器的错误，请输入：`sudo\
    \ apt-get install build-essential`。第三方应用程序 `Ncurses` 被记录为缺失。我们需要使用以下命令安装它：`sudo\
    \ apt-get install libncurses5-dev libncursesw5-dev`。\n\n![](img/5019375da05cbf0090115165d80772a1_52_2.png)\n\
    \n- **步骤 8** 根据应用程序的不同，你可能需要继续安装新的依赖项。每当安装完一个新的依赖项后，重新运行 `./configure`，当它不再报告错误时，你可以继续安装过程的下一个阶段。注意：你可能需要在线搜索某些错误信息。\n\
    \n![](img/5019375da05cbf0090115165d80772a1_52_3.png)\n\n- **步骤 9** 在 `./configure`\
    \ 成功运行后，系统将创建一个 `Makefile`。需要通过在终端中输入 `make` 来“制作”它。根据应用程序的大小，这可能需要一些时间。\n\n![](img/5019375da05cbf0090115165d80772a1_52_4.png)\n\
    \n- **步骤 10** 最后，你需要在终端中输入：`sudo make install`。这将安装该应用程序，并使其在系统中就绪可用。完成后，你就可以执行该应用程序，在本例中是通过在终端中输入\
    \ `vim` 或通过 Dash 搜索它来执行。\n\n![](img/5019375da05cbf0090115165d80772a1_52_5.png)\n\
    \n## 使用终端\n\n```text\nKernel command line: block2mtl.block2mtl=/dev/hda2,131072,rootfs\
    \ root=/dev/mtdbl\ncOckO rootfstype=jffs2 init=/etc/preinit noinitrd console=tty0\
    \ console=ttyS0,384\n00n8 reboot=biOS\nFound and enabled local APIC\nEnabling\
    \ fast FPU save and restore... done.\nEnabling unmasked SIMD FPu exception support...\
    \ done.\nInitializing CPU#0\nPID hash table entries: 32 (order: 5, 128 bytes)\n\
