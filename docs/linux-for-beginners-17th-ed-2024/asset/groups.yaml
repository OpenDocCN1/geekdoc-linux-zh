    \n一般来说，Linux 占用的系统资源比 Windows 或 macOS 少；这里的系统资源指的是内存、硬盘空间和 CPU 负载。Linux 的代码经过精简，并且没有那些占用系统资源的第三方“臃肿软件”。更高效系统当然意味着有更多可用的资源用于编码和测试环境，以及你最终创建的程序。更少的资源使用也意味着你可以在那些通常难以运行甚至\n\
