    # VPNS AND TOR


    The previous steps can aid your online privacy but to really become anonymous
    you need a Virtual Private Network and Tor.


    **STEP 1**

    A VPN is a remote server, or cluster of servers, that establishes a connection
    with your computer. The end result is that your computer’s identity on the Internet
    is hidden behind the VPN remote server; so you could live in the UK but have an
    IP address (the computer online identity) belonging to Iceland.


    # How VPN works?


    ![](img/5019375da05cbf0090115165d80772a1_42_0.png)


    **STEP 2**

    Most good VPNs charge a monthly or annual fee but it''s worth the expense. We
    use CyberGhost, [www.cyberghostvpn.com](http://www.cyberghostvpn.com), which offers
