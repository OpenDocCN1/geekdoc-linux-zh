    # More Fun Things to

    do in the Terminal


    If the previous list of fun, and quite bizarre, things to do in the Terminal has
    you wanting more, you''re in luck. We''ve put together another batch of some useful,
    and some not so useful, commands for you to try out.


    # MORE FUN, YAY


    Since the Terminal session is already open, and your keyboard digits are nicely
