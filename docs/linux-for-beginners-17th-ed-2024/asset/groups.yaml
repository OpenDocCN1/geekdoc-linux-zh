  mdcn: '

    # 创建和删除目录


    与在终端中创建文件类似，您也可以创建和删除目录，或者如果您喜欢，可以称它们为文件夹。目录构成了文件系统的结构；如果没有逻辑目录，归档系统将会陷入完全的混乱。


    ## 管理文件夹


    学习如何在终端中创建和删除文件夹是一项重要的 Mint，乃至整个 Linux 技能。以下是供您尝试的基础知识。


    -   **步骤 1** 打开终端，输入 `cd` 以确保您位于自己的主目录中。现在输入 `ls` 以查看您在主目录中当前的文件夹。您会注意到，在 Mint
    中，文件夹以青色（浅蓝色）标记。让我们从创建一个新目录开始。输入 `mkdir testdir`。


    ![](img/5019375da05cbf0090115165d80772a1_57_0.png)


    -   **步骤 2** 如果现在再次输入 `ls`，您将看到新目录 `testdir` 已与其他目录一起在主目录区域创建。显然，命令 `mkdir` 是创建目录的指令，毫无疑问您已经猜到它代表
    Make Directory（创建目录）。


    -   **步骤 3** 如果您再次输入命令 `mkdir testdir`，您将收到一条消息，显示：`mkdir: cannot create directory
    ‘testdir’: File exists`。不言而喻，您在当前目录中只能拥有一个唯一命名的目录。但是，由于 Linux 对大小写敏感，您可以拥有 `TestDir`、`TesDir`、`testDir`
    等等。


    ![](img/5019375da05cbf0090115165d80772a1_57_1.png)


    -   **步骤 4** 您可以在已创建的目录内部创建目录。例如，输入 `cd testdir/` 进入 `testdir` 目录，然后输入 `ls` 以列出文件夹结构。自然，里面什么都没有，因为您刚刚创建了该目录。


    现在使用 `cd ~` 返回主目录，并输入 `mkdir testdir/reports`。返回 testdir，`cd testdir/`，并再次 `ls`。


    ![](img/5019375da05cbf0090115165d80772a1_57_2.png)


    ![](img/5019375da05cbf0090115165d80772a1_57_3.png)


    -   **步骤 5** 因此，创建目录的命令是相当合乎逻辑的。您将创建目录及其内部的任何子目录。但是，如果您想在一条命令中创建一个目录和一个子目录怎么办？确保您在**主目录**（`cd
    ~`），然后输入 `mkdir -p Temp/finances`。现在，`cd Temp/`，并 `ls` 以列出新目录。


    ![](img/5019375da05cbf0090115165d80772a1_58_0.png)


    -   **步骤 6** **-p** 选项是使 **mkdir** 命令能够创建子目录以及父目录的关键。在 Linux 中，命令始终遵循相同的结构：**命令、选项和参数**。在上一个步骤的示例中，命令（**mkdir**）、选项（**-p**）和参数（**Temp/finances**）。


    ![](img/5019375da05cbf0090115165d80772a1_58_2.png)


    -   **步骤 7** 如果您想深入了解 **mkdir** 命令可用的各种选项，您可以在终端中输入 `mkdir --help`。这将提供一个快速的帮助指南，详细说明选项以及命令结构如何工作。


    ![](img/5019375da05cbf0090115165d80772a1_58_4.png)


    -   **步骤 8** 现在我们已经创建了一些目录，让我们看看如何删除它们。首先，进入 **testdir** 目录并列出其内容：`cd testdir`，然后
    `ls`。之前创建的 **reports** 子目录存在。删除它的一种方法是输入：`rmdir reports`，然后再次 `ls` 以确认它已不在那里。


    ![](img/5019375da05cbf0090115165d80772a1_58_1.png)


    -   **步骤 9** 快速警告：在终端中删除目录不会将其放入 Mint **回收站**，通过 Nemo 文件管理器也是如此。对于任何文件也是如此。如果您从终端命令中删除一个目录，那么它将永远消失。


    ![](img/5019375da05cbf0090115165d80772a1_58_3.png)


    -   **步骤 10** **Rmdir** 只会删除空目录。要删除包含子目录甚至文件的目录，您需要使用带有 **-R** 选项的 **rm** 命令。例如，在
    **Temp** 页面目录中，使用 `rm -R Temp`。快速 `ls` 显示父文件夹及其所有内容已被删除。使用此命令时要小心。


    ![](img/5019375da05cbf0090115165d80772a1_58_5.png)


    # 在终端中做的有趣事情


    尽管操作系统是严肃的，但 Linux 社区 certainly 并不排斥一点乐趣。多年来，开发人员已在终端中创建并插入了各种有趣和奇异的元素。


    ## 终端乐趣


    接下来这两个部分您将完全在终端中工作，所以开始热身您的手指。毕竟，只有工作没有玩耍……俗话说得好。


    -   **步骤 1** 我们要使用的第一个命令是 **sl**。它默认未安装，所以请输入：`sudo apt-get install sl`。该命令可以通过
    **sl** 运行，执行时将在屏幕上显示一辆行驶中的蒸汽机车（因此称为 ''sl''）。输入 **LS**，注意是大写，也有效。


    ![](img/5019375da05cbf0090115165d80772a1_59_0.png)


    -   **步骤 2** 即使是《星球大战》的粉丝在终端中也能得到满足。通过 telnet 命令连接到远程服务器，您可以观看第四集：新希望，虽然是 ASCII
    形式的。要观看这一奇观，请输入：`telnet towel.blinkenlights.nl`。


    ![](img/5019375da05cbf0090115165d80772a1_59_1.png)


    -   **步骤 3** 如果您一直想让电脑随机读一段预言给您听，那么您很幸运。大多数发行版要求您安装 fortune 应用程序，然而 Linux Mint
    有所不同，因为它已经预装了。您只需将命令 **fortune** 输入终端，然后享受即可。


    ![](img/5019375da05cbf0090115165d80772a1_59_2.png)


    -   **步骤 4** **rev** 命令确实很有趣，起初看起来是对操作系统一个相当无用的添加。然而，它可以用来创建一些看似无法破解的密码。输入：**rev**，现在输入一些文本；当您接下来按下
    **Enter** 时，您输入的所有内容都会被反转。按下 **Ctrl+C** 退出。


    ![](img/5019375da05cbf0090115165d80772a1_59_3.png)


    -   **步骤 5** 如果您卡住了，试图找出某个特定数字的所有可能因数，只需输入 **factor** 后跟该数字。例如，**factor 7** 提供的输出很少，而
    **factor 60** 显示的内容更多。


    ![](img/5019375da05cbf0090115165d80772a1_60_0.png)


    -   **步骤 6** 相当酷的和真正怪异的氛围之间有一条细微的界限。让一只 ASCII 奶牛向您重复文本可能属于后者。输入 **cowsay** 后跟任何您想要的文本，例如
    **cowsay Linux Mint is ace!**。事实上，您甚至可以通过输入 `ls | cowsay` 通过奶牛输出 **ls** 命令。


    ![](img/5019375da05cbf0090115165d80772a1_60_1.png)


    -   **步骤 7** 为了进一步推广奶牛元素，甚至有一个图形的，即非终端的奶牛可用。使用 `sudo apt-get install xcowsay`
    安装它，然后当它安装好后，输入类似 cowsay 的内容，例如 **xcowsay BOM Publications**。


    ![](img/5019375da05cbf0090115165d80772a1_60_2.png)


    -   **步骤 8** 如果您真的想扩展整个奶牛的事情，无论出于什么原因，都可以通过 `fortune | cowsay` 将 fortune 命令通过管道传输给它，对于图形奶牛的等价物：`fortune
    | xcowsay`。此外，总有 **cowthink**。试试：**cowthink ... This book is awesome.**


    ![](img/5019375da05cbf0090115165d80772a1_60_3.png)


    -   **步骤 9** 命令 **toilet** 并不能激发多少信心，我们承认。然而，它并不像听起来那么糟糕。首先使用 `sudo apt-get install
    toilet` 安装它。然后安装后，输入类似 **toilet David** 的内容。或者，也许使用 `ls | toilet` 通过它列出当前文件夹的内容。


    ![](img/5019375da05cbf0090115165d80772a1_60_4.png)


    -   **步骤 10** 扩展 **toilet** 命令，您实际上可以通过它生成一些外观不错的图形。例如，尝试这个 `toilet -F monolid
    -F metal David`。您可以输入 `toilet -help`，以获取命令行参数列表以进一步扩展。


    ![](img/5019375da05cbf0090115165d80772a1_60_5.png)


