    \ - 0xc030bcf0 (597 kB)\n.text : 0xc0010000 - 0xc027653c (1497 kB)\nChecking if\
    \ this processor honors the WP bit even in supervisor mode... Ok.\nCalibrating\
    \ delay using timer specific routine... 4047.64 BogoMIPS (lpj=20238210)\n```\n\
    \n![](img/5019375da05cbf0090115165d80772a1_54_0.png)\n\n### Linux 内核 0.01\n\n\
    ```c\n/*\n * Copyright Linus Torvalds\n * Based on WRITE-BAKED 838-MODE - Q-51.1\n\
    \ * Hopefully (this will be a faster complete VTI.01 implementation.\n */\n\n\
    /*\n * 838: The 838-SIM-1324-41-BRIDGE-DRIVER\n */\n\n#include <linux/mod.h>\n\
    #include <asm/io.h>\n#include <asm/bio.h>\n#include <asm/segm.h>\n\n#define SCREEN_DATA\
    \ 128000\n#define SCREEN_END  (0xC600)\n#define LINES 25\n#define COLUMNS 80\n\
    #define SPAM 16\n\nextern void keyboard_interrupt(void);\n\nstatic unsigned long\
    \ origin=SCREEN_DATA;\nstatic unsigned long mtr_end=SCREEN_DATA+LINES*(COLUMNS+2);\n\
    static unsigned long p0m;\nstatic unsigned long top_i=bottom_LINE;\nstatic unsigned\
    \ long line_i=LINES*COLUMNS;\nstatic unsigned long state;\nstatic unsigned long\
    \ npar,nar*(NPAR);\nstatic unsigned long gear;\nstatic unsigned char attr=NOT;\n\
    ```\n\n你知道吗，由林纳斯·托瓦兹（Linus Torvalds）编写的第一个 Linux 内核仅占用了 65KB 的内存？而且，自 0.01 版本以来，Linux\
    \ 内核现在已拥有超过 1800 万行代码。对于一个大学项目来说，这并不差劲，它现在运行着纽约证券交易所，并驱动着美国国防部的核潜艇编队。\n\n####\
    \ 你知道吗...\n\n## 使用终端创建文件\n\n使用终端，你可以创建文件夹、文件，甚至执行 Linux Mint 应用程序。说实话，如果你没有图形用户界面（GUI）可用，你仍然可以从终端完成同样的工作。\n\
    \n### 更多终端操作\n\n使用终端创建内容并不像一开始看起来那么艰巨。是的，终端对于新手来说可能看起来令人生畏，但一旦掌握，它其实非常直观。\n\n\
    - **步骤 1** 打开终端，确保你当前位于主文件夹（Home folder）。如果没有，请使用 **cd** 命令从当前位置返回主文件夹。\n\n![](img/5019375da05cbf0090115165d80772a1_55_0.png)\n\
    \n- **步骤 2** 让我们从在主文件夹内创建一个新文件夹开始，并将其命名为 **Test**。你需要使用的命令是在输入 **mkdir** 后加上 **Test**。输入命令后，按下\
    \ **Enter** 键创建文件夹，然后输入 **cd /Test** 并按下 **Enter**。这将切换目录（因此称为 **CD**）到新建的 Test\
    \ 文件夹。\n\n![](img/5019375da05cbf0090115165d80772a1_55_1.png)\n\n- **步骤 3** 你的命令行应变为\
    \ Test 文件夹。如果你输入 **ls**（列出文件夹内容），文件夹内将没有任何内容，因为你刚刚创建了它。**mkdir** 命令相当直观：Make Directory（创建目录）后跟一个你选择的名称。\n\
    \n![](img/5019375da05cbf0090115165d80772a1_55_2.png)\n\n- **步骤 4** 要创建一个空的文本文件，命名为\
    \ **Test.txt**，在终端中输入：**touch Test.txt**，然后使用 **ls** 查看文件夹中的新文件。Touch 是一个标准的 Linux\
    \ 命令，它允许在无需打开文本编辑器、保存文件然后关闭编辑器的情况下创建文件。\n\n![](img/5019375da05cbf0090115165d80772a1_55_3.png)\n\
    \n## 使用终端创建文件\n\n- **步骤 5** 假设你现在想要创建一个包含一些内容的文本文件。我们将它命名为 **Test2.txt**。为此，输入：**cat\
    \ > Test2.txt**。这将创建文件 **Test2.txt** 并让终端进入编辑模式。\n\n![](img/5019375da05cbf0090115165d80772a1_56_0.png)\n\
    \n- **步骤 6** 你会注意到，光标在 **cat > Test2.txt** 命令下方闪烁，没有通常的提示符。这种编辑模式允许你输入文件将包含的文本。输入一些文本，然后按下\
    \ **Ctrl+D** 退出并将内容写入文件。\n\n![](img/5019375da05cbf0090115165d80772a1_56_2.png)\n\
    \n- **步骤 7** 当然，你并不总是需要通过终端向文件中输入文本。Mint 自带一个名为 **Xed** 的文本编辑器，它与 Windows 的记事本类似。要在\
    \ Xed 中查看之前创建的文件，在终端中输入：**xed Test2.txt**，然后按 **Enter**。\n\n![](img/5019375da05cbf0090115165d80772a1_56_4.png)\n\
    \n- **步骤 8** Xed 是一个图形用户界面（GUI）应用程序，你可以输入文本并保存文件（或任何文件），方法是使用应用程序的主窗口；以及其顶部菜单栏中的\
    \ **File > Save**（文件 > 保存）或 **File > Save As**（文件 > 另存为）功能。\n\n![](img/5019375da05cbf0090115165d80772a1_56_1.png)\n\
    \n- **步骤 9** 然而，如果你更喜欢留在终端中编辑/保存/创建文件，你可以使用 **Nano**。Nano 是一个简单的基于终端的文本编辑器。要尝试该示例，请输入：**nano\
    \ Test2.txt**。屏幕底部有一个菜单。要在 Nano 中退出并保存任何内容，请按下 **Ctrl+X** 并按照屏幕上的说明操作。\n\n![](img/5019375da05cbf0090115165d80772a1_56_3.png)\n\
    \n- **步骤 10** 我们已经使用终端启动了 Mint 应用程序 **xed**，但可以从终端内启动任何应用程序。例如，尝试：**firefox**\
    \ 然后按 **Enter**。关闭 Firefox 以返回终端。只要你知道应用程序的名称，它就可以从终端运行。此外，输入 **firefox** 会打开\
    \ Firefox，并且你仍然可以使用终端。\n\n![](img/5019375da05cbf0090115165d80772a1_56_5.png)\n"
