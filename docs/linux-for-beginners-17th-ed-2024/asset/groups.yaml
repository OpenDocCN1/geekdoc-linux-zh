    # MORE LOOPING


    You can loop over data using the FOR, WHILE and UNTIL statements. These can be
    handy if you''re batch naming, copying or running a script where a counter is
    needed.


    +   **STEP 1**\nCreate a new script called **count_.sh**. Enter the text in the
    screenshot below, save it and make it executable. This creates the variable ''count''
    which at the beginning of the script equals zero. Then start the WHILE loop, which
    WHILE count is less than (the LT part) 100 will print the current value of count
    in the echo command.


    ![](img/5019375da05cbf0090115165d80772a1_72_0.png)


    +   **STEP 2**\nExecuting the count.sh script will result in the numbers 0 to
    99 listing down the Terminal screen; when it reaches 100 the script will end.
    Modifying the script with the FOR statement, makes it work in much the same way.
    To use it in our script, enter the text from the screenshot into the count.sh
    script.


    ![](img/5019375da05cbf0090115165d80772a1_72_1.png)


    +   **STEP 3**\nThe addition we have here is: **for count in {0..100}; do.** Which
    means, FOR the variable ''count'' in the numbers from zero to one hundred, then
    start the loop. The rest of the script is the same. **Run** this script, and the
    same output should appear in the Terminal.


    ![](img/5019375da05cbf0090115165d80772a1_72_2.png)


    +   **STEP 4**\nThe UNTIL loop works much the same way as the WHILE loop only,
    more often than not, in reverse. So our counting to a hundred; using UNTIL, would
    be: **until [ $count -gt 100 ]; do.** The difference being, UNTIL count is greater
    than (the gt part) one hundred, keep on looping.


    ![](img/5019375da05cbf0090115165d80772a1_72_3.png)


    +   **STEP 5**\nYou''re not limited to numbers zero to one hundred. You can, within
    the loop, have whatever set of commands you like and execute them as many times
    as you want the loop to run for. Renaming a million files, creating fifty folders
    etc. For example, this script will create ten folders named folder1 through to
    folder10 using the FOR loop.


    ![](img/5019375da05cbf0090115165d80772a1_72_4.png)


    +   **STEP 6**\nUsing the FOR statement once more, we can execute the counting
    sequence by manipulating the (0..100) part. This section of the code actually
    means {START,END, INCREMENT}, if there''s no increment then it''s just a single
    digit up to the END, For example, we could get the loops to count up to 1000 in
    two''s with: **for count in {0..1000..2}; do.**


    ![](img/5019375da05cbf0090115165d80772a1_72_5.png)'
