  - '[PAGE 79]


    # Command Line Quick Reference


    When you start using Linux full time, you will quickly realise that the graphical
    interfaces of Ubuntu, Mint, etc. are great for many tasks but not great for all
    tasks. Understanding how to use the command line not only builds your understanding
    of Linux but also improves your knowledge of coding and programming in general.
    Our command line quick reference guide is designed to help you master Linux quicker.


    # TOP 10 COMMANDS


    These may not be the most common commands used by everyone but they will certainly
    feature frequently for many users of Linux and the command line.


    +   The **cd** command is one of the commands you will use the most at the command
    line in Linux. It allows you to change your working directory. You use it to move
    around within the hierarchy of your file system. You can also use cdhir.


    +   The **mv** command moves a file to a different location or renames a file.
    For example `mv file sub` renames the original file to `sub`. `mv sub` moves the
    file `sub` to your desktop directory but does not rename it. You must specify
    a new filename to rename a file.


    +   The **ls** command shows you the files in your current directory. Used with
    certain options, it lets you see file sizes, when files where created and file
    permissions. For example, `ls -` shows you the files that are in your home directory.


    +   The **chown** command changes the user and/or group ownership of each given
    file. If only an owner (a user name or numeric user ID) is given, that user is
    made the owner of each given file, and the files'' group is not changed.


    +   The **cp** command is used to make copies of files and directories. For example,
    `cp file sub` makes an exact copy of the file whose name you entered and names
    the copy sub but the first file will still exist with its original name.


    +   The **chmod** command changes the permissions on the files listed. Permissions
    are based on a fairly simple model. You can set permissions for users, groups
    and world and you can set whether each can read, write and or execute the file.


    +   The **pwd** command prints the full pathname of the current working directory
    (pwd stands for "print working directory"). Note that the GNOME terminal also
    displays this information in the title bar of its window.


    +   The **rm** command removes (deletes) files or directories. The remove process
    unlink a filename in a filesystem that data on the storage device and marks that
    space as usable by future writes. In other words, removing files increases the
    amount of available space on your disk.


    +   The **clear** command clears your screen if this is possible. It looks in
    the environment for the terminal type and then in the termfo database to figure
    out how to clear the screen. This is equivalent to typing Control-L when using
    the bash shell.


    +   Short for "make directory", **mkdir** is used to create directories on a file
    system. If the specified directory does not already exist, `mkdir` will create
    a working directory. More than one directory may be specified when calling mkdir.'
  - "[PAGE 80]\n\n![](img/5019375da05cbf0090115165d80772a1_80_0.png)\n\n# USEFUL HELP/INFO\
    \ COMMANDS\n\nThe following commands are useful for when you are trying to learn\
    \ more about the system or program you are working with in Linux. You might not\
    \ need them every day, but when you do, they will be invaluable.\n\n+   ```\n\
    +   free    The free command displays the total amount of free and used physical\
    \ and swap memory in the system. For example, `free -m` gives the information\
    \ using megabytes.\n+   ```\n+   \n\n+   ```\n+   sed     The sed command opens\
    \ a stream editor. A stream editor is used to perform text transformations on\
    \ an input stream: a file or input from a pipeline.\n+   ```\n+   \n\n+   ```\n\
    +   df      The df command displays filesystem disk space usage for all partitions.\
    \ The command `df -h` is probably the most useful (the -h means human-readable).\n\
    +   ```\n+   \n\n+   ```\n+   adduser The adduser command adds a new user to the\
    \ system. Similarly, the addgroup command adds a new group to the system.\n+ \
    \  ```\n+   \n\n+   ```\n+   top     The top program provides a dynamic real-time\
    \ view of a running system. It can display system summary information, as well\
    \ as a list of processes.\n+   ```\n+   \n\n+   ```\n+   deluser The deluser command\
    \ removes a user from the system. To remove the user’s files and home directory,\
    \ you need to add the `--remove-home` option.\n+   ```\n+   \n\n+   ```\n+   unname-a\
    \ The uname command with the -a option prints all system information, including\
    \ machine name, kernel name, version and a few other details.\n+   ```\n+   \n\
    \n+   ```\n+   delgroup The delgroup command removes a group from the system.\
    \ You cannot remove a group that is the primary group of any users.\n+   ```\n\
    +   \n\n+   ```\n+   ps      The ps command allows you to view all the processes\
    \ running on the machine. Every operating system’s version of ps is slightly different,\
    \ but all do the same thing.\n+   ```\n+   \n\n+   ```\n+   man man The man man\
    \ command brings up the manual entry for the man command, which is a great place\
