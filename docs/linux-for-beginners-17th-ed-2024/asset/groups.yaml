    && tar -xf Term-Animation-2.4.tar.gz && cd Term-Animation-2.4/. Then: perl Makefile.PL
    && make && make test && sudo make install.


    ![](img/5019375da05cbf0090115165d80772a1_62_3.png)


    STEP 7

    A roaring ASCII fire isn''t the most useful command to have at your disposal,
