    # Creating and Removing Directories


    As with creating files in the Terminal, you can also create and delete directories,
    or folders if you prefer. Directories form the structure of your file system;
    without logical directories, the filing system would be in utter chaos.


    ## MANAGING FOLDERS


    Learning how to create and delete folders in the Terminal is an important Mint,
    and indeed Linux overall, skill to master. Here''s the basics for you to try out.


    - **STEP 1** With the Terminal open, enter `cd` to make sure you’re in your own
    Home directory. Now enter `ls` to view the current folders you have housed in
    the Home directory. You’ll notice that folders are labelled in Mint in cyan (light
    blue). Let’s start by creating a new directory. Enter `mkdir testdir`.


    ![](img/5019375da05cbf0090115165d80772a1_57_0.png)


    - **STEP 2** If you now enter `ls` again, you’ll see that the new directory, `testdir`,
    has been created alongside the other directories in the Home area. Obviously the
    command `mkdir` is what creates the directory, and no doubt you’ve already guessed
    it stands for Make Directory.


    - **STEP 3** If you were to enter the command again, `mkdir testdir`, you’ll receive
    a message stating: `mkdir: cannot create directory ‘testdir’: File exists`. It
    goes without saying then, that you’re only able to have one uniquely named directory
    within the current directory. However, as Linux is case-sensitive, you can have
    `TestDir`, `TesDir`, `testDir` and so on.


    ![](img/5019375da05cbf0090115165d80772a1_57_1.png)


    - **STEP 4** You can create directories within directories you’ve already created.
    For example, enter the `testdir` directory with `cd testdir/`, followed by `ls`
    to list the folder structure. Naturally there’s nothing present, as you’ve just
    created the directory.


    Now drop back to Home with `cd ~`, and enter `mkdir testdir/reports`. Go back
    to the testdir, `cd testdir/`, and `ls` again.


    ![](img/5019375da05cbf0090115165d80772a1_57_2.png)


    ![](img/5019375da05cbf0090115165d80772a1_57_3.png)


    - **STEP 5** The command to create directories is quite logical, therefore. You''ll
    create the directory, and any sub-directories within. However, what if you want
    to create a directory and a sub-directory in a single command? Make sure you''re
    at **Home** (`cd ~`) and enter `mkdir -p Temp/finances`. Now, `cd Temp/`, and
    `ls` to list the new directory.


    ![](img/5019375da05cbf0090115165d80772a1_58_0.png)


    - **STEP 6** The **-p** option is what enables the **mkdir** command to create
    the sub-directory as well as the parent directory. In Linux, commands always follow
    the same structure: **Command, Option, and Argument**. In the previous step example,
    command (**mkdir**), option (**-p**), and argument (**Temp/finances**).


    ![](img/5019375da05cbf0090115165d80772a1_58_2.png)


    - **STEP 7** If you want to drill down into the various options available for
    the **mkdir** command, you can enter `mkdir --help` in the Terminal. This will
    provide a quick help guide detailing the options and how the command structure
    works.


    ![](img/5019375da05cbf0090115165d80772a1_58_4.png)


    - **STEP 8** Now that we''ve created some directories, let''s see about removing
    them. Start by entering the **testdir** directory and listing its contents: `cd
    testdir`, then `ls`. The previously created **reports** sub-directory is present.
    One way to remove it is to enter: `rmdir reports`, then `ls` again to confirm
    it''s not there.


    ![](img/5019375da05cbf0090115165d80772a1_58_1.png)


    - **STEP 9** A quick warning: removing a directory in the Terminal doesn''t place
    it in the Mint **Rubish Bin**, via Nemo file manager. The same goes for any files,
    too. If you remove a directory from the Terminal command then it''s gone for good.


    ![](img/5019375da05cbf0090115165d80772a1_58_3.png)


    - **STEP 10** **Rmdir** will only remove empty directories. To remove directories
    containing sub-directories, or even files, you''ll need to use the **rm** command
    with the **-R** option. For example, on the **Temp** page directories, use `rm
    -R Temp`. A quick `ls` reveals that the parent folder and all of its contents
    are removed. Careful when using this command.


    ![](img/5019375da05cbf0090115165d80772a1_58_5.png)


    # Fun Things to do in the Terminal


    Despite the seriousness of an operating system, the Linux community are certainly
    no strangers to a bit of fun. The developers over the years have created and inserted
    all manner of fun and odd elements into the Terminal.


    ## TERMINAL FUN


    You''ll be working exclusively in the Terminal for these next two sections, so
    start warming up your fingers. After all, all work and no play... as the saying
    goes.


    - **STEP 1** The first command we''re going to use is **sl**. It''s not installed
    by default so enter: `sudo apt-get install sl`. The command can be run with **sl**
    and when executed will display a Steam Locomotive travelling across the screen
    (hence ''sl''). Entering **LS**, note the upper case, also works.


    ![](img/5019375da05cbf0090115165d80772a1_59_0.png)


    - **STEP 2** Fans of Star Wars even get a fix when it comes to the Terminal. By
    linking to a remote server via the telnet command, you can watch Episode IV: A
    New Hope being played out, albeit in ASCII. To view this spectacle, enter: `telnet
    towel.blinkenlights.nl`.


    ![](img/5019375da05cbf0090115165d80772a1_59_1.png)


    - **STEP 3** If you''ve ever fancied having the computer read a random fortune
    out to you, then you''re in luck. Most distros require you to install the fortune
    app, however Linux Mint differs somewhat by having it already pre-loaded. All
    you need to do is enter the command **fortune** into the Terminal, and enjoy.


    ![](img/5019375da05cbf0090115165d80772a1_59_2.png)


    - **STEP 4** The **rev** command is certainly interesting, and at first what seems
    a quite useless addition to the OS. However, it can be used to create some seemingly
    unbreakable passwords. Enter: **rev**, now type some text; when you press **Enter**
    next, everything you typed in will be reversed. Press **Ctrl+C** to exit.


    ![](img/5019375da05cbf0090115165d80772a1_59_3.png)


    - **STEP 5** If you''re stuck trying to work out all the possible factors for
    any particular number, simply enter **factor** followed by the number. For example,
    **factor 7** doesn''t offer much output, whereas **factor 60** displays more.


    ![](img/5019375da05cbf0090115165d80772a1_60_0.png)


    - **STEP 6** There’s a fine line between the rather cool and really-quirky vibe.
    Having an ASCII cow repeat text to you could potentially fall in the latter. Enter
    **cowsay** followed by any text you want, such as **cowsay Linux Mint is ace!**.
    In fact, you can even output the **ls** command through the cow, by entering `ls
    | cowsay`.


    ![](img/5019375da05cbf0090115165d80772a1_60_1.png)


    - **STEP 7** To further the cow element, there’s even a graphical, ie, non-terminal,
    cow available. Install it with `sudo apt-get install xcowsay`, then when it’s
    installed enter something similar to cowsay, such as **xcowsay BOM Publications**.


    ![](img/5019375da05cbf0090115165d80772a1_60_2.png)


    - **STEP 8** If you really want to expand the whole cow thing, for whatever reason,
    then pipe the fortune command through it with `fortune | cowsay` and for the graphical
    cow equivalent: `fortune | xcowsay`. Plus, there’s always **cowthink**. Try: **cowthink
    ... This book is awesome.**


    ![](img/5019375da05cbf0090115165d80772a1_60_3.png)


    - **STEP 9** The command **toilet** doesn’t inspire much confidence, we’ll admit.
    However, it’s not as bad as it first sounds. Start by installing it with `sudo
    apt-get install toilet`. Then when installed, type something along the lines of
    **toilet David**. Or perhaps list the contents of the current folder through it,
    with `ls | toilet`.


    ![](img/5019375da05cbf0090115165d80772a1_60_4.png)


    - **STEP 10** Expanding the **toilet** command, you can actually generate some
    decent looking graphics through it. For example, try this `toilet -F monolid -F
    metal David`. You can enter `toilet -help`, for a list of the command line arguments
    to expand further.


    ![](img/5019375da05cbf0090115165d80772a1_60_5.png)

