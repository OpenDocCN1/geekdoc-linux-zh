    \ install oneko`, then type `oneko` to have the cat appear. Move your 'mouse'\
    \ cursor around the screen and the cat will chase it. Use `Ctrl+C` to exit the\
    \ action.\n\n![](img/5019375da05cbf0090115165d80772a1_61_1.png)\n\n- **STEP 4**\
    \ This entry is a little more serious than the previous. It's called the **Fork\
    \ Bomb** and what it does, basically, is continually replicate itself until it\
    \ has used up all the available system resources, thus causing your computer to\
    \ crash. You don't have to try it but it's interesting nonetheless. Simply enter:\
    \ `:(){ :|:& };:`; and be prepared to reboot.\n\n![](img/5019375da05cbf0090115165d80772a1_61_3.png)\n\
    \n- **STEP 5** Stringing several commands and piping them through can be what\
    \ makes scripting such a powerful element to an OS. Using the `while` command,\
    \ for example, together with `toilet`, can yield some impressive results. Enter:\n\
    \  ```bash\n  while true; do echo \"$(date '+%d %T')\" | toilet -f term -F border\
    \ -f metal; sleep 1; done\n  ```\n\n![](img/5019375da05cbf0090115165d80772a1_62_0.png)\n\
    \n- **STEP 6** Talking computers were the craze of the 80s, enter: `speak \"Hello,\
    \ this is Linux Mint\"` to have the computer repeat the text inside the quotes\
    \ to you. Make sure your volume is turned up and try the following: `ls > folders.txt\
    \ && speak -f folders.txt`. This will have Mint read back the contents of the\
    \ `ls` command.\n\n![](img/5019375da05cbf0090115165d80772a1_62_2.png)\n\n- **STEP\
    \ 7** A roaring ASCII fire isn't the most useful command to have at your disposal,\
    \ but it's fun. Install it with: `sudo apt-get install libaa-bin`, then when installed\
    \ use: `aafire`. It's not exactly warming but you get the idea. To expand the\
    \ above, enter: `sudo apt-get install bb caca-utils`, then, `caca-fire`.\n\n![](img/5019375da05cbf0090115165d80772a1_62_4.png)\n\
    \n- **STEP 8** Used as a music demo from the old Amiga and DOS days, the `bb`\
    \ command reminds us of getting hold of three and a half inch floppies crammed\
    \ with all manner of dosmode goodies. We've already installed `bb` from the previous\
    \ step, so just enter `bb`. Follow the on-screen instructions, and turn up your\
    \ volume.\n\n![](img/5019375da05cbf0090115165d80772a1_62_1.png)\n\n- **STEP 9**\
    \ This entry is in two parts. First you need to get hold of the necessary packages:\
    \ `sudo apt-get install libcurses-perl`. When that's done enter:\n  ```bash\n\
    \  cd Downloads/ && wget http://search.cpan.org/CPAN/authors/id/K/KB/KBALCOM/Term-Animation-2.4.tar.gz\
    \ && tar -xf Term-Animation-2.4.tar.gz && cd Term-Animation-2.4/\n  ```\n  Then:\n\
    \  ```bash\n  perl Makefile.PL && make && make test && sudo make install\n  ```\n\
    \n![](img/5019375da05cbf0090115165d80772a1_62_3.png)\n\n- **STEP 10** With that\
    \ little lot done, onto the next:\n  ```bash\n  cd ~ && wget http://www.rorobunny.com/projects/asciiarium/asciiarium.tar.gz\
    \ && tar -xf asciiarium.tar.gz && cd asciiarium-1.1/ && chmod +x asciiarium\n\
    \  ```\n  Providing all went well, enter `./asciiarium` and enjoy your very own\
    \ ASCII-based aquarium.\n\n![](img/5019375da05cbf0090115165d80772a1_62_5.png)\n\
    \n# Linux Tips and Tricks\n\nAs you've seen, the Linux Terminal is quite an exceptional\
    \ environment. With a few extra apps installed, and a smidgen of command knowledge,\
    \ incredible, and often quite strange, things can be accomplished.\n\n## TAKING\
    \ COMMAND\n\nThere are countless Linux tips, secrets, hacks and tricks out there.\
    \ Some are very old, originating from Linux's Unix heritage, while others are\
    \ recent additions to Linux lore. Here's our favourite ten tips and tricks.\n\n\
    ### EASTER EGGS\n\nEmacs, the text editor, is a great piece of software; however,\
    \ did you know it also contains a hidden Easter Egg? With Emacs installed (`sudo\
    \ apt-get install emacs25`), drop to a Terminal session and enter:\n\n```bash\n\
    emacs --batch -l dunnet\n```\n\nDunnet is a text adventure written by Ron Schell\
    \ in 1982, and hidden in Emacs since 1994.\n\n![](img/5019375da05cbf0090115165d80772a1_63_0.png)\n\
    \n### TERMINAL BROWSING\n\nEver fancied being able to browse the Internet from\
    \ the Terminal? While not particularly useful, it is quite a fascinating thing\
    \ to behold. To do so, enter:\n\n```bash\nsudo apt-get install elinks\n```\n\n\
    Enter the website you want to visit.\n\n![](img/5019375da05cbf0090115165d80772a1_63_1.png)\n\
    \n### MOON BUGGY\n\nBased on the classic 1982 arcade game, Moon Patrol, Moon Buggy\
    \ appeared on the home computers of 1985 amid much praise. It's a cracking Atari\
    \ game, and it's available in the Linux Terminal by entering:\n\n```bash\nsudo\
    \ apt-get install moon-buggy\n```\n\nThen:\n\n```bash\nmoon-buggy\n```\n\nEnjoy.\n\
    \n![](img/5019375da05cbf0090115165d80772a1_63_2.png)\n\n### LET IT SNOW\n\nSnowing\
    \ in the Terminal console isn't something you come across every day. If you're\
    \ interested, however, enter:\n\n```bash\nwget https://gist.githubusercontent.com/sentek/1505483/raw/7d024716e057e69fb52632fee09f42753631c4d2/snowjob.sh\n\
    chmod +x snowjob.sh\n./snowjob.sh\n```\n\n![](img/5019375da05cbf0090115165d80772a1_63_3.png)\n\
    \n### MEMORY HOGS\n\nIf you need to see what apps are consuming the most memory\
    \ on Linux, simply enter:\n\n```bash\nps aux | sort -rnk 4\n```\n\nThis sorts\
    \ the output by system memory use.\n\n![](img/5019375da05cbf0090115165d80772a1_64_0.png)\n\
    \n### BBS\n\nBack in the days of dial-up connections, the online world was made\
    \ up of Bulletin Board Systems. These remote servers provided hang-outs for users\
    \ to chat, swap code, play games and more. Using `telnet` in Linux, we can still\
    \ connect to some active BBSes:\n\n```bash\ntelnet battlebbs.tarballs.dynnds.org\n\
    ```\n\nThere are countless operable BBSes available, check out https://www.telnetbbsguide.com/bbslist/detail/,\
    \ for more.\n\n![](img/5019375da05cbf0090115165d80772a1_64_1.png)\n\n### SHREDDER\n\
    \nWhen you delete a file, there’s a chance of someone with the right software\
    \ being able to retrieve it. However, to securely and permanently delete a file,\
    \ use Shred:\n\n```bash\nshred -zvu NAMEOFFILE.txt\n```\n\nReplace `NAMEOFFILE`\
    \ with the name of the file to delete.\n\n![](img/5019375da05cbf0090115165d80772a1_64_2.png)\n\
    \n### DIRECTORY TREES\n\nIf you want to create an entire directory (or folder)\
    \ tree with a single command, you can use:\n\n```bash\nmkdir -p New-Dir/{subfolder1,subfolder2,subfolder3,subfolder4}\n\
    ```\n\nThis creates a `New-Dir` with four sub folders within.\n\n![](img/5019375da05cbf0090115165d80772a1_64_3.png)\n\
    \n### ASCII ART\n\nASCII art can be quite striking when applied to some images.\
    \ However, it’s often difficult to get just right. You can create some great ASCII\
    \ art from the images you have by using `img2txt`:\n\n```bash\nimg2txt NAMEOFIMAGEFILE.png\n\
    ```\n\nReplace `NAMEOFIMAGEFILE` with the actual name of the image file on your\
    \ system. If `img2txt` is not installed, use:\n\n```bash\nsudo apt-get install\
    \ caca-utils\n```\n\n![](img/5019375da05cbf0090115165d80772a1_64_4.png)\n\n###\
    \ FORGOTTEN COMMANDS\n\nIt’s not easy trying to remember all the available Linux\
    \ commands. Thankfully, we can use `apropos` to help us. Simply use it, along\
    \ with a description of the command:\n\n```bash\napropos \"copy files\"\napropos\
    \ \"rename files\"\n```\n\n![](img/5019375da05cbf0090115165d80772a1_64_5.png)\n"
  mdcn: "\n\n# 在终端里玩点更多有趣的东西\n\n如果前面列举的那些在终端里既有趣又相当古怪的操作让你意犹未尽，那你运气不错。我们整理了一些实用（也有些不太实用）的命令供你尝试。\n\
    \n## 更多乐趣，耶\n\n既然终端会话已经打开，且你的数字键也热身完毕，这里还有两页终端“无厘头”操作。\n\n- **步骤 1** 还记得早期的 ZX\
    \ Spectrum 计算机时代吗？那时候你可以输入 `10 print \"Hello\", 20 goto 10`，屏幕就会不断打印 Hello。在 Linux\
    \ Mint 中，你也能实现同样的效果。只需输入 `more`，然后回车并跟着输入一些文本，例如 `yes Linux ts ace`。它会一直运行，直到你按下\
    \ `Ctrl+C` 停止。\n\n![](img/5019375da05cbf0090115165d80772a1_61_0.png)\n\n- **步骤\
    \ 2** 《黑客帝国》（The Matrix）是有史以来视觉特效被模仿最多的电影之一；甚至在 Linux Mint 上也有一个 Matrix 代码雨版本。使用以下命令安装它：`sudo\
    \ apt-get install cmatrix`。安装完成后，输入 `cmatrix`，然后跟随那只白兔（Neo）。不过与真正的 Matrix 不同，你可以按下\
    \ `Ctrl+C` 退出。\n\n![](img/5019375da05cbf0090115165d80772a1_61_2.png)\n\n- **步骤\
    \ 3** 让一只小白猫在桌面上追逐你的鼠标指针，听起来似乎是在浪费生命。但奇怪的是，其实挺好玩。输入 `sudo apt-get install oneko`，然后输入\
    \ `oneko` 让猫咪出现。移动屏幕上的“鼠标”光标，猫就会追踪它。使用 `Ctrl+C` 退出该操作。\n\n![](img/5019375da05cbf0090115165d80772a1_61_1.png)\n\
    \n- **步骤 4** 这一项比之前的稍微“严肃”一点。它被称为**Fork Bomb（Fork 炸弹）**，其基本作用是不断自我复制，直到耗尽所有可用的系统资源，从而导致你的计算机崩溃。你不必真的去试，但了解它还是挺有意思的。只需输入：`:(){\
    \ :|:& };:`，并准备好重启电脑。\n\n![](img/5019375da05cbf0090115165d80772a1_61_3.png)\n\n\
    - **步骤 5** 将多个命令串联并通过管道传递，正是脚本语言对操作系统如此强大的原因之一。例如，使用 `while` 命令配合 `toilet`，可以产生令人印象深刻的效果。输入：\n\
    \  ```bash\n  while true; do echo \"$(date '+%d %T')\" | toilet -f term -F border\
    \ -f metal; sleep 1; done\n  ```\n\n![](img/5019375da05cbf0090115165d80772a1_62_0.png)\n\
    \n- **步骤 6** 会说话的计算机是 80 年代的潮流。输入 `speak \"Hello, this is Linux Mint\"`，让计算机朗读引号内的文本。请确保音量已调大，并尝试以下命令：`ls\
    \ > folders.txt && speak -f folders.txt`。这将让 Mint 朗读 `ls` 命令的输出内容。\n\n![](img/5019375da05cbf0090115165d80772a1_62_2.png)\n\
    \n- **步骤 7** 轰鸣的 ASCII 火焰并不是最实用的命令，但挺好玩的。使用以下命令安装：`sudo apt-get install libaa-bin`，安装完成后使用：`aafire`。虽然它并不暖人，但你懂我的意思。为了扩展上述功能，输入：`sudo\
    \ apt-get install bb caca-utils`，然后运行 `caca-fire`。\n\n![](img/5019375da05cbf0090115165d80772a1_62_4.png)\n\
    \n- **步骤 8** 在早期的 Amiga 和 DOS 时代，`bb` 命令常被用作音乐演示。它让我们想起当年往 3.5 英寸软盘里塞满各种 DOS 模式软件的场景。由于我们在上一步已经安装了\
    \ `bb`，所以只需输入 `bb`。按照屏幕上的说明操作，并调高音量。\n\n![](img/5019375da05cbf0090115165d80772a1_62_1.png)\n\
    \n- **步骤 9** 这一项分为两部分。首先，你需要获取必要的软件包：`sudo apt-get install libcurses-perl`。完成后，输入：\n\
    \  ```bash\n  cd Downloads/ && wget http://search.cpan.org/CPAN/authors/id/K/KB/KBALCOM/Term-Animation-2.4.tar.gz\
    \ && tar -xf Term-Animation-2.4.tar.gz && cd Term-Animation-2.4/\n  ```\n  然后：\n\
    \  ```bash\n  perl Makefile.PL && make && make test && sudo make install\n  ```\n\
    \n![](img/5019375da05cbf0090115165d80772a1_62_3.png)\n\n- **步骤 10** 搞定那个小玩意儿后，接着下一步：\n\
    \  ```bash\n  cd ~ && wget http://www.rorobunny.com/projects/asciiarium/asciiarium.tar.gz\
    \ && tar -xf asciiarium.tar.gz && cd asciiarium-1.1/ && chmod +x asciiarium\n\
    \  ```\n  如果一切顺利，输入 `./asciiarium`，享受你专属的基于 ASCII 的水族箱。\n\n![](img/5019375da05cbf0090115165d80772a1_62_5.png)\n\
    \n# Linux 技巧与窍门\n\n如你所见，Linux 终端是一个非常出色的环境。只需安装几样额外的应用程序，并具备一点点命令知识，你就能完成一些惊人甚至相当古怪的任务。\n\
    \n## 掌控命令\n\n那里有无数 Linux 技巧、秘诀、黑科技和窍门。有些非常古老，源于 Linux 的 Unix 传统；而有些则是 Linux 传奇中的新近添加。以下是我们最喜欢的十个技巧与窍门。\n\
    \n### 隐藏彩蛋\n\nEmacs，这款文本编辑器，是一款出色的软件；不过你知道吗，它还包含一个隐藏的彩蛋？安装 Emacs（`sudo apt-get\
    \ install emacs25`）后，进入终端会话并输入：\n\n```bash\nemacs --batch -l dunnet\n```\n\nDunnet\
    \ 是 Ron Schell 于 1982 年编写的文本冒险游戏，自 1994 年起就隐藏在 Emacs 中。\n\n![](img/5019375da05cbf0090115165d80772a1_63_0.png)\n\
    \n### 终端浏览\n\n你是否有过想在终端里浏览互联网的想法？虽然实用性不强，但这确实是一件相当迷人的事情。要这样做，请输入：\n\n```bash\n\
    sudo apt-get install elinks\n```\n\n然后输入你想访问的网站。\n\n![](img/5019375da05cbf0090115165d80772a1_63_1.png)\n\
    \n### 月球探路者（Moon Buggy）\n\n基于经典的 1982 年街机游戏《月行者》（Moon Patrol），《Moon Buggy》于 1985\
    \ 年登上家用电脑，并广受赞誉。它是一款出色的 Atari 游戏，你可以通过在 Linux 终端输入以下命令来游玩：\n\n```bash\nsudo apt-get\
    \ install moon-buggy\n```\n\n然后：\n\n```bash\nmoon-buggy\n```\n\n尽情享受。\n\n![](img/5019375da05cbf0090115165d80772a1_63_2.png)\n\
    \n### 让雪飘落\n\n在终端控制台里下雪并不是每天都能见到的景象。如果你感兴趣，请输入：\n\n```bash\nwget https://gist.githubusercontent.com/sentek/1505483/raw/7d024716e057e69fb52632fee09f42753631c4d2/snowjob.sh\n\
    chmod +x snowjob.sh\n./snowjob.sh\n```\n\n![](img/5019375da05cbf0090115165d80772a1_63_3.png)\n\
    \n### 内存大户\n\n如果你想查看 Linux 上哪些应用程序消耗了最多的内存，只需输入：\n\n```bash\nps aux | sort -rnk\
    \ 4\n```\n\n这会按系统内存使用情况对输出进行排序。\n\n![](img/5019375da05cbf0090115165d80772a1_64_0.png)\n\
    \n### BBS（电子公告板）\n\n在拨号上网的年代，在线世界由电子公告板系统（Bulletin Board Systems）组成。这些远程服务器为用户提供了聊天、交换代码、玩游戏和其他活动的场所。使用\
    \ Linux 中的 `telnet`，我们仍然可以连接到一些活跃的 BBS：\n\n```bash\ntelnet battlebbs.tarballs.dynnds.org\n\
    ```\n\n有无数可用的 BBS，访问 https://www.telnetbbsguide.com/bbslist/detail/ 查看更多。\n\n\
    ![](img/5019375da05cbf0090115165d80772a1_64_1.png)\n\n### 碎纸机（Shredder）\n\n当你删除一个文件时，拥有正确软件的人可能还有恢复它的机会。然而，若要安全且永久地删除文件，请使用\
    \ Shred：\n\n```bash\nshred -zvu NAMEOFFILE.txt\n```\n\n将 `NAMEOFFILE` 替换为要删除的文件名。\n\
    \n![](img/5019375da05cbf0090115165d80772a1_64_2.png)\n\n### 目录树\n\n如果你想用一条命令创建一个完整的目录（或文件夹）树，你可以使用：\n\
    \n```bash\nmkdir -p New-Dir/{subfolder1,subfolder2,subfolder3,subfolder4}\n```\n\
    \n这会在 `New-Dir` 中创建四个子文件夹。\n\n![](img/5019375da05cbf0090115165d80772a1_64_3.png)\n\
    \n### ASCII 艺术\n\n将 ASCII 艺术应用于某些图像时，效果可能相当惊艳。然而，要调整得恰到好处往往很困难。你可以使用 `img2txt`\
    \ 将手中的图像制作成精美的 ASCII 艺术：\n\n```bash\nimg2txt NAMEOFIMAGEFILE.png\n```\n\n将 `NAMEOFIMAGEFILE`\
    \ 替换为你系统中图像文件的实际名称。如果未安装 `img2txt`，请使用：\n\n```bash\nsudo apt-get install caca-utils\n\
    ```\n\n![](img/5019375da05cbf0090115165d80772a1_64_4.png)\n\n### 被遗忘的命令\n\n记住所有可用的\
    \ Linux 命令并不容易。幸运的是，我们可以使用 `apropos` 来帮助我们。只需配合命令的描述使用它：\n\n```bash\napropos \"\
    copy files\"\napropos \"rename files\"\n```\n\n![](img/5019375da05cbf0090115165d80772a1_64_5.png)\n\
    \n"
