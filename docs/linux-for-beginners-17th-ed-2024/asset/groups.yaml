  mdcn: "\n## 创建 Bash 脚本 – 第 3 部分\n\n在前面的页面中，我们介绍了一些非常基础的 Bash 脚本知识，包括向屏幕输出文本、获取用户输入并存储该输入、将其输出到屏幕，以及使用\
    \ Date 命令包含一个系统变量。现在让我们把目前所学的内容结合起来，并介绍循环（Loops）。\n\n### IF、THEN、ELSE\n\n在大多数编程结构中，迟早会需要循环执行你输入的指令，以创建更好的功能，并最终打造更好的程序。\n\
    \n- **步骤 1** 现在让我们来学习 If、Then 和 Else 语句。当正确执行时，它们会比较一组指令，并简单地确定：如果某事物存在，THEN 做某事，ELSE\
    \ 做另一件事：创建一个名为 greeting2.sh 的新脚本，并将下方截图中的文本输入其中。\n\n- **步骤 2** Greeting2.sh 是\
    \ greeting.sh 的副本，但有一个细微差别。在这里我们添加了一个从 If 语句开始的循环。这意味着，如果输入的变量等于 David，下一行 THEN\
    \ 就是对此的反应，在这种情况下，它会在屏幕上输出“Awesome name”，随后是变量（即 David）。\n\n- **步骤 3** 下一行 ELSE\
    \ 是当变量不等于‘David’时发生的情况。在这种情况下，它只是在屏幕上输出我们现在熟悉的‘Hello...’。最后一行 FI 语句是结束循环的命令。如果你有\
    \ if 命令但没有 FI 命令，就会得到错误。\n\n- **步骤 4** 显然你可以稍微玩玩这个脚本，改变触发响应的姓名变量；或者甚至发出一个响应，让名字和姓氏变量匹配一个特定变量。\n\
    \n```bash\n#!/bin/bash\n\necho -n 'Hello, what is your name? '\nread firstname\n\
    echo -n 'Thank you, and what is your surname? '\nread surname\nclear\nif [ $firstname\
    \ == 'David' ]\nthen\n  echo $firstname\nelse\n  echo Hello $surname\nfi\n```\n\
    \n```bash\n$ mkdir scripts\n$ cd scripts\n$ nano greeting2.sh\n```\n\n```bash\n\
    #!/bin/bash\n\necho -n 'Hello, what is your name? '\nread firstname\necho -n 'Thank\
    \ you, and what is your surname? '\nread surname\nclear\nif [ $firstname == 'David'\
    \ ] && [ $surname == 'Hayard' ]\nthen\n  echo \"Awesome name, $firstname $surname\"\
    \nelse\n  echo \"Hello $firstname $surname, how are you on this fine Wednesday?\"\
    \nfi\n```\n\n```text\ndavid@david-mint ~ \n$ ./scripts/greeting2.sh\nHello, what\
    \ is your name? David\nThank you, and what is your surname? Hayard\nAwesome name,\
    \ David Hayard\n```\n\n## 更多循环\n\n你可以使用 FOR、WHILE 和 UNTIL 语句对数据进行循环。如果你批量命名、复制或运行需要计数器的脚本，这些语句会很有用。\n\
    \n- **步骤 1** 创建一个名为 **count.sh** 的新脚本。输入下方截图中的文本，保存它并使其可执行。这会创建变量 'count'，在脚本开始时等于零。然后开始\
    \ WHILE 循环，只要 count 小于 100（LT 部分），就会在 echo 命令中打印 count 的当前值。\n\n![](img/5019375da05cbf0090115165d80772a1_72_0.png)\n\
    \n- **步骤 2** 执行 count.sh 脚本会导致数字 0 到 99 在终端屏幕上列出；当它达到 100 时，脚本将结束。使用 FOR 语句修改脚本，使其以非常相似的方式工作。要在我们的脚本中使用它，请将截图中的文本输入\
    \ count.sh 脚本中。\n\n![](img/5019375da05cbf0090115165d80772a1_72_1.png)\n\n- **步骤\
    \ 3** 我们在这里添加的是：**for count in {0..100}; do。** 意思是，对于从 0 到 100 的数字中的 'count' 变量，然后开始循环。脚本的其余部分相同。**运行**\
    \ 这个脚本，终端中应该出现相同的输出。\n\n![](img/5019375da05cbf0090115165d80772a1_72_2.png)\n\n\
    - **步骤 4** UNTIL 循环的工作方式与 WHILE 循环非常相似，只是大多数情况下是反向的。所以我们要数到一百；使用 UNTIL，将是：**until\
    \ [ $count -gt 100 ]; do。** 区别在于，只要 UNTIL count 大于 100（gt 部分），就继续循环。\n\n![](img/5019375da05cbf0090115165d80772a1_72_3.png)\n\
    \n- **步骤 5** 你不仅仅局限于数字 0 到 100。在循环中，你可以有任意想要的命令集，并尽可能多次地执行它们。重命名一百万个文件，创建五十个文件夹等等。例如，使用\
    \ FOR 循环，这个脚本将创建十个名为 folder1 到 folder10 的文件夹。\n\n![](img/5019375da05cbf0090115165d80772a1_72_4.png)\n\
    \n- **步骤 6** 再次使用 FOR 语句，我们可以通过操作 (0..100) 部分来执行计数序列。代码的这一部分实际上意味着 {START,END,\
    \ INCREMENT}，如果没有 increment，那么就是到 END 的单个数字。例如，我们可以让循环以 2 为增量数到 1000：**for count\
    \ in {0..1000..2}; do.**\n\n![](img/5019375da05cbf0090115165d80772a1_72_5.png)\n\
    \n## 创建 Bash 脚本 – 第 4 部分\n\n你已经在脚本中遇到了用户交互，例如询问用户的姓名等。你还研究了*在脚本中创建循环*，用于计数或简单地多次执行某些操作。让我们结合并扩展更多。\n\
    \n### 选择和循环\n\n让我们引入另一个命令，**CHOICE**，以及一些嵌套的 IF 和 ELSE 语句。从创建一个名为 mychoice.sh\
    \ 的新脚本开始。\n\n- **步骤 1** mychoice.sh 脚本开始看起来复杂得多。我们在这里有一个包含四个选项的列表，有三个可能的选项。选项：Mint、Is\
    \ 和 Awesome 将在用户按下正确的选项键时显示。如果没有，菜单将重新出现，即第四个选项。\n\n![](img/5019375da05cbf0090115165d80772a1_73_0.png)\n\
    \n- **步骤 2** 如果你跟随脚本执行，很快就会明白发生了什么，基于我们已经涉及的内容：WHILE、IF 和 ELSE，带有 FI 关闭循环语句将遍历选项，如果你选择了错误的选项，它会把你带回到开始。\n\
    \n![](img/5019375da05cbf0090115165d80772a1_73_2.png)\n\n- **步骤 3** 当然，你可以增加选项的数量，但需要确保选项数量与\
    \ IF 语句数量相匹配。脚本可能会迅速变成一个非常繁忙的屏幕。这个冗长的脚本是显示菜单的另一种方式，这次还有一个花哨的颜色方案。\n\n![](img/5019375da05cbf0090115165d80772a1_73_1.png)\n\
    \n- **步骤 4** 你可以使用脚本中的菜单设置里的箭头键和 Enter。每个选项都是一个反馈各种信息的外部命令。玩玩这些命令和选项，看看你能想出什么。这有点超出我们要研究的范围，但它给出了可以达到的效果的一个好例子。\n\
    \n![](img/5019375da05cbf0090115165d80772a1_73_3.png)\n\n### 创建备份任务脚本\n\nBash 脚本使用最广泛的例子之一是创建备份例程，它自动化任务，并沿途添加一些自定义。\n\
    \n- **步骤 1** 非常基本的备份脚本看起来大致像这样：`#!/bin/bash`，然后是，`tar cvfz ~/backups/my-backup.tgz\
    \ ~/Documents/`。这将创建 `~/Documents` 文件夹的压缩文件备份，包括其中所有内容，并将其放入名为 `my-backup.tgz`\
    \ 的 `~/backups` 文件夹中。\n\n![](img/5019375da05cbf0090115165d80772a1_74_0.png)\n\n\
    - **步骤 2** 虽然完全可以接受，但我们可以让简单的脚本更具交互性。让我们从定义一些变量开始。将截图中的文本输入一个新的 backup.sh 脚本中。请注意，我们将\
    \ ‘source’ 错拼为 ‘sauce’，这是因为已经有一个内置命令叫做 ‘source’，因此我们采用了不同的拼写。\n\n![](img/5019375da05cbf0090115165d80772a1_74_2.png)\n\
    \n- **步骤 3** 前面的脚本条目允许你创建一个时间戳，这样你就知道备份是何时进行的。你还创建了一个 ‘dest’ 变量，这是备份文件将创建的文件夹（~/backups）。你现在可以添加一段代码，首先检查\
    \ `~/backups` 文件夹是否存在，如果不存在，则创建一个。\n\n![](img/5019375da05cbf0090115165d80772a1_74_4.png)\n\
    \n- **步骤 4** 一旦创建了 `~/backups` 文件夹，我们现在可以基于我们在开头设置的时间戳变量在其中创建一个新子文件夹。添加 `mkdir\
    \ -p $dest/'\"$day $month $year\"'`。你可以在这里放置与该日/月/年相关的备份文件。\n\n![](img/5019375da05cbf0090115165d80772a1_74_1.png)\n\
    \n- **步骤 5** 一切就绪后，你现在可以输入实际的备份例程，基于步骤 1 中的 `tar` 命令。结合变量，你有：`tar cvfz $dest/'\"\
    $day $month $year\"'/Documents/Backup.tgz $sauce`。在截图中，我们添加了一个方便的“正在备份...” echo\
    \ 命令。\n\n![](img/5019375da05cbf0090115165d80772a1_74_3.png)\n\n- **步骤 6** 最后，你可以添加一个友好的消息：`echo\
    \ \"Backup complete. All done...\"`。完成的脚本并不是过于复杂，可以轻松自定义以包含你主区域内的任何文件夹，以及整个主区域本身。\n\
    \n![](img/5019375da05cbf0090115165d80772a1_74_5.png)\n"
