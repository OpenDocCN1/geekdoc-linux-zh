    ![](img/5019375da05cbf0090115165d80772a1_76_3.png)\n\n- **STEP 9** Whilst we’re\
    \ on making fancy scripts, how about using Zenity to output a graphical interface?\
    \ Enter what you see below into a new script, menu.sh. Make it executable and\
    \ then run it. You should have a couple of dialogue boxes appear, followed by\
    \ a final message.\n\n- **STEP 10** While gaming in a Bash script isn’t something\
    \ that’s often touched upon, it is entirely possible, albeit a little basic. Movement-based\
    \ games are difficult, and sometimes buggy, however a good text adventure, or\
    \ Fighting Fantasy type game is a perfect choice for gaming in the Terminal. Give\
    \ it a go, and let us know how you get on.\n\n![](img/5019375da05cbf0090115165d80772a1_76_4.png)\n\
    \n## Pix Linux = The Perfect Combination\n\nThe Raspberry Pi is a remarkable piece\
    \ of hardware, and to help drive its potential it needs a remarkable operating\
    \ system. Thankfully, Linux is the default and recommended OS of choice for the\
    \ Pi, and together they make a winning team.\n\n![](img/5019375da05cbf0090115165d80772a1_77_0.png)\n\
    \nWhen the Raspberry Pi was in its developmental stages its designers needed to\
    \ ensure that they were creating a piece of hardware that could offer much more\
    \ than simply being a cheap, but small, computer.\n\nThe Pi needed to be flexible\
    \ with what it could do, it needed to have room to grow into more ambitious project\
    \ concepts and ideas, and it needed to do so in as easy to use a fashion as possible.\
    \ The goal was to create a universal learning platform, that students of any age\
    \ could expand on and tinker with, while learning new concepts such as programming,\
    \ electronics, and computing. Naturally, once the hardware was developed, the\
    \ only real choice of operating system was of course, Linux.\n\nThe versatility\
    \ of Linux is legendary. This incredible core OS is so malleable that it can be\
    \ steered toward near any aspect of computing, from supercomputing to robotics,\
    \ the space industry to more terrestrial engineering; education and science, manufacturing\
    \ and the Internet. Think of an industry, and you will likely find a Linux installation\
    \ somewhere in the background keeping it all together.\n\n![](img/5019375da05cbf0090115165d80772a1_77_1.png)\n\
    \nRaspberry Pi OS is the recommended operating system for the Raspberry Pi, a\
    \ customised Debian-based distribution that comes packed with a collection of\
    \ useful tools that cater for coding, electronics, and general desktop computing\
    \ duties. Alongside the apps are pre-loaded modules to help get the most from\
    \ each of the programming languages you decide to learn and use, as well as software\
    \ to hardware modules that will enable you to power and use the hardware specific\
    \ items unique to the Pi. For example, there are Python modules that interact\
    \ with the Raspberry Pi’s 40-pin GPIO, allowing you to create content for any\
    \ of the Hardware Attached on Top devices.\n\nThis combination is what makes the\
    \ Raspberry Pi an excellent base of operations to learn not only coding on, but\
    \ also Linux in general. Raspberry Pi OS, being Debian-based, will be able to\
    \ run any of the Terminal commands listed in this book, as Linux Mint and even\
    \ Ubuntu are also Debian-based. And since the Raspberry is so small, and costs\
    \ very little setup, you’re able to have both your regular, Windows or macOS computers,\
    \ and have a Raspberry Pi as a headless (a powered device that doesn’t need a\
    \ keyboard, mouse or monitor) attached, as you connect to it (remotely) computer\
    \ from which you can connect to and learn how to use Linux and how to code.\n\n\
    ## WHICH PI?\n\nThere are several Raspberry Pi models available, with each offering\
    \ something slightly different from the others. The most recent Pi released is\
    \ the Raspberry Pi 5, and while this model is slightly more expensive than some\
    \ of the other examples, it is the most powerful and feature-rich Pi available.\n\
    \n![](img/5019375da05cbf0090115165d80772a1_78_0.png)\n\n![](img/5019375da05cbf0090115165d80772a1_78_1.png)\n\
    \n![](img/5019375da05cbf0090115165d80772a1_78_2.png)\n\n![](img/5019375da05cbf0090115165d80772a1_78_3.png)\n\
    \n![](img/5019375da05cbf0090115165d80772a1_78_4.png)\n\nOverall, it's probably\
    \ best to start experimenting with the Pi using the Pi 3 Model B+, then moving\
    \ on to one of the other models as you develop your skills and focus on a particular\
    \ project, such as the need to use one of the Pi Zero models, with a smaller footprint\
    \ and WiFi enabled connectivity.\n\n![](img/5019375da05cbf0090115165d80772a1_78_5.png)\n\
    \n![](img/5019375da05cbf0090115165d80772a1_78_6.png)\n\n![](img/5019375da05cbf0090115165d80772a1_78_7.png)\n\
    \n## BEYOND RASPBERRY PI OS\n\nThe flexibility of the Raspberry Pi's ARM processor\
    \ means that it's capable of running other operating systems beyond Raspbian.\
    \ Still keeping with Linux, you can instead install Ubuntu MATE, Pidora (a Fedora-based\
    \ distribution), Lakka, PiPlay (a retro emulation distribution) and Arch Linux\
    \ ARM. There are also systems based loosely on the Linux kernel, such as Android,\
    \ Minibian, and Chromium OS.\n\nThere's Windows 10 IoT Core, FreeBSD, RISC OS,\
    \ Plan 9 and, remarkably, AROS – an Amiga OS clone. Needless to say, that once\
    \ you've finished experimenting with one version of Linux, just as you would with\
    \ a desktop version of Linux, you can hop to another on the Raspberry Pi and see\
    \ how that one works, and whether it will work for you.\n\n![](img/5019375da05cbf0090115165d80772a1_78_8.png)\n\
    \n## PI, LINUX AND CODING\n\nAs previously mentioned, the Raspberry Pi is an excellent\
    \ code base, and with Linux as the backbone you're able to start learning how\
    \ to code in a multitude of different programming languages.\n\nBash scripting\
    \ works perfectly, since Raspberry Pi OS is Linux, and Debian-based, and you can\
    \ easily expand your scripts to encompass much of the Pi's functionality. Aside\
    \ from creating backup scripts, you can also create scripts that can access the\
    \ GPIO pins on the Pi, and so be able to control LEDs, and even more complex HATS.\n\
    \nPython is by far the most popular choice for beginners, and Raspbian comes pre-installed\
    \ with everything you will need to get the most from your Python experience. There\
    \ are countless pre-loaded modules, as well as the most recent stable release\
    \ of the language.\n\nC++ is one of the most powerful programming languages to\
    \ learn. It's used for games, apps, and even entire operating systems. The Raspberry\
    \ Pi comes with a great C++ editor, that's easy to use and can help you develop\
    \ amazing content. Whenever may you decide to take your coding and Linux adventure,\
    \ the Raspberry Pi is an excellent platform from which to begin on.\n\n![](img/5019375da05cbf0090115165d80772a1_78_9.png)\n"
  mdcn: "\n## 创建 Bash 脚本 – 第 5 部分\n\n我们之前查看的备份脚本可以进一步修改，以整合选择功能、关于备份文件将复制到哪里的用户交互等功能。自动化任务是\
    \ Bash 脚本的主要优势之一，一个简单的脚本可以在许多方面帮助你。\n\n### 简单的自动化和实用脚本\n\n逐行输入命令以获取系统信息、查找文件或重命名一批文件？脚本是更好的答案。\n\
    \n-   **步骤 1** 让我们从一个帮助显示 Mint 系统信息的脚本开始；这总是很有用的。创建一个名为 **sysinfo.sh** 的新脚本，并将以下内容输入到\
    \ Xed 或你选择的文本编辑器中。\n\n```bash\n#!/bin/bash\n\n# Display system information\necho\
    \ \" $(dpkg -l | grep linux-generic | tail -n 1 | awk '{print $2}')\"\nlsb_release\
    \ -a\n\necho\necho \"File system disk space usage:\"\ndf -h\n\necho\necho \"Free\
    \ and used memory:\"\nfree -m\n\necho\necho \"System uptime and performance load:\"\
    \nuptime\n\necho\necho \"Users currently logged in:\"\nwho\n\necho\necho \"Top\
    \ five processes being used by the system:\"\nps aux | egrep -e \"sshd\" -e \"\
    sudo\" -e \"sh\" -e \"bash\" -e \"systemd\" --sort=-%cpu | head -n 6\n\necho -n\
    \ \"  \"\n```\n\n-   **步骤 3** 每个部分运行不同的终端命令，在相应的标题下输出结果。你可以包含更多内容，例如系统中当前使用的别名，当前的时间和日期等等。此外，你还可以将所有这些信息通过管道传输到一个方便的\
    \ HTML 文件中，以便在浏览器中查看。\n\n```bash\ndavid@david-mint:~/scripts $\n$ sh sysinfo.sh\
    \ > ~/sysinfo.html\ndavid@david-mint:~/scripts $\n```\n\n-   **步骤 2** 我们在这个脚本中包含了一些额外的命令。第一个是\
    \ **echo** 的 **-e** 扩展，这意味着它将启用对额外换行实例的解释，以及其他特殊字符。前面的 **'31;43m'** 元素启用前景和背景的颜色。\n\
    \n```bash\ndavid@david-mint:~/scripts $ ./sysinfo.sh\n\nStatic Hostname: david-mint\n\
    Icon name: computer-vm\nChassis: vm\nMachine ID: 5ab3c275b7304ad3b8aee9f6fcc37eb4\n\
    Boot ID: 8ccb1bafd934f409c8ac5009aeb7e18\nVirtualization: oracle\nOperating System:\
    \ Linux Mint 18.1\nKernel: Linux 4.4.0-53-generic\nArchitecture: x86 64\n```\n\
    \n-   **步骤 4** 虽然有一些简单的终端命令可以帮助你查找特定的文件或文件夹，但创建一个脚本来帮助你往往更有趣。此外，你还可以将该脚本用于其他非技术用户。创建一个名为\
    \ **look4.sh** 的新脚本，输入下方截图中的内容。\n\n```bash\n#!/bin/bash\ntarget=~/\nread name\n\
    \noutput=$(find $target -iname \"*$name*\" -d 2>/dev/null |)\nif [ [ -e \"$output\"\
    \ ]; then\n    echo \"found\"\nelse\n    echo \"match found\"\nfi\n```\n\n-  \
    \ **步骤 5** 执行时，脚本会等待用户输入，因此在这种情况下是文件扩展名，例如 jpg、mp4 等。但这并不太友好。让我们让它稍微友好一点。在 read\
    \ 命令之前，添加一个 echo，使用 echo -n “Please enter the extension of the file you’re looking\
    \ for: ”。\n\n![](img/5019375da05cbf0090115165d80772a1_76_0.png)\n\n-   **步骤 6**\
    \ 这里有一个使用 espeak 应用的有趣且好玩的脚本。使用 sudo -apt-install espeak 安装 espeak，然后将下方文本输入到名为\
    \ speak.sh 的新脚本中。如你所见，它是我们运行的第一个问候脚本的翻版。只是这次，它使用了 espeak 输出中的变量。\n\n![](img/5019375da05cbf0090115165d80772a1_76_1.png)\n\
    \n-   **步骤 7** 我们简要地看了如何在脚本输出中添加一些颜色。虽然篇幅有限，无法深入探讨颜色选项，但这里有一个输出可用颜色的脚本。创建一个名为\
    \ colours.sh 的新脚本，并将文本（见下文）输入其中。\n\n![](img/5019375da05cbf0090115165d80772a1_76_2.png)\n\
    \n-   **步骤 8** colours.sh 的输出当然可以混合在一起，根据你想要输出的内容带来不同的效果。例如，红色背景上的白色闪烁（或闪动）文本。遗憾的是，闪烁效果并非在所有终端上都有效，因此你可能需要更换不同的终端。\n\
    \n![](img/5019375da05cbf0090115165d80772a1_76_3.png)\n\n-   **步骤 9** 既然我们在做花哨的脚本，为什么不使用\
    \ Zenity 来输出图形界面呢？将下方内容输入到一个新脚本 menu.sh 中。使其可执行然后运行它。你应该会看到出现几个对话框，最后是一条消息。\n\n\
    -   **步骤 10** 虽然在 Bash 脚本中玩游戏并不是经常提及的内容，但这完全是可能的，尽管稍微基础一些。基于移动的游戏很难制作，有时甚至有错误，但一个好的文字冒险游戏或\
    \ Fighting Fantasy 类型的游戏是终端游戏的完美选择。试试看，然后告诉我们你的进展如何。\n\n![](img/5019375da05cbf0090115165d80772a1_76_4.png)\n\
    \n## Pix Linux = 完美组合\n\nRaspberry Pi 是一个非凡的硬件，为了帮助挖掘其潜力，它需要一个非凡的操作系统。幸运的是，Linux\
    \ 是 Pi 的默认且推荐的操作系统选择，两者结合形成了一个获胜的组合。\n\n![](img/5019375da05cbf0090115165d80772a1_77_0.png)\n\
    \n当 Raspberry Pi 处于开发阶段时，其设计者需要确保他们正在创建的硬件能够提供比仅仅是一个廉价但小型计算机更多的功能。\n\nPi 需要在其功能上具有灵活性，它需要有能力成长为更具雄心的项目概念和创意，并且需要尽可能易用。目标是创建一个通用的学习平台，任何年龄的学生都可以在此基础上扩展和折腾，同时学习编程、电子和计算等新概念。自然而然地，一旦硬件开发完成，操作系统的唯一现实选择当然是\
    \ Linux。\n\nLinux 的多功能性是传奇的。这个令人难以置信的核心操作系统如此具有可塑性，它可以被引导至计算的几乎任何方面，从超级计算到机器人，从太空工业到更陆地的工程；教育和科学，制造业和互联网。想想任何一个行业，你很可能会在后台找到一个\
    \ Linux 安装来维持一切运行。\n\n![](img/5019375da05cbf0090115165d80772a1_77_1.png)\n\nRaspberry\
    \ Pi OS 是 Raspberry Pi 的推荐操作系统，是一个定制的基于 Debian 的发行版，内置了一组有用工具，用于编程、电子和一般桌面计算任务。除了应用程序外，还预装了模块，帮助你充分利用你决定学习和使用的每种编程语言，以及软件到硬件模块，这些模块将使你能够使用\
    \ Pi 特有的硬件特定项目。例如，有与 Raspberry Pi 的 40 针 GPIO 交互的 Python 模块，允许你为任何 HAT（Hardware\
    \ Attached on Top，顶层附加硬件）设备创建内容。\n\n这种组合使得 Raspberry Pi 成为学习编程以及一般 Linux 的卓越基地。Raspberry\
    \ Pi OS 基于 Debian，能够运行本书中列出的任何终端命令，因为 Linux Mint 甚至 Ubuntu 也是基于 Debian 的。由于 Raspberry\
    \ Pi 非常小，成本也极低，你可以同时拥有你的常规 Windows 或 macOS 电脑，并连接一个无头 Raspberry Pi（一种不需要键盘、鼠标或显示器的通电设备），作为你可以远程连接并学习如何使用\
    \ Linux 和编程的计算机。\n\n## 哪个 PI？\n\n有几种 Raspberry Pi 型号可供选择，每种都提供与其他型号略有不同的功能。最近发布的\
    \ Pi 是 Raspberry Pi 5，虽然这款型号比其他一些示例稍贵，但它是目前可用最强且功能最丰富的 Pi。\n\n![](img/5019375da05cbf0090115165d80772a1_78_0.png)\n\
    \n![](img/5019375da05cbf0090115165d80772a1_78_1.png)\n\n![](img/5019375da05cbf0090115165d80772a1_78_2.png)\n\
    \n![](img/5019375da05cbf0090115165d80772a1_78_3.png)\n\n![](img/5019375da05cbf0090115165d80772a1_78_4.png)\n\
    \n总体而言，最好从使用 Pi 3 Model B+ 开始实验，然后随着你技能的发展并专注于特定项目，转向其他型号，例如需要使用具有更小占用空间和支持 WiFi\
    \ 连接的 Pi Zero 型号。\n\n![](img/5019375da05cbf0090115165d80772a1_78_5.png)\n\n![](img/5019375da05cbf0090115165d80772a1_78_6.png)\n\
    \n![](img/5019375da05cbf0090115165d80772a1_78_7.png)\n\n## 超越 Raspberry Pi OS\n\
    \nRaspberry Pi 的 ARM 处理器的灵活性意味着它能够运行 Raspbian 以外的其他操作系统。继续坚持 Linux，你可以安装 Ubuntu\
    \ MATE、Pidora（基于 Fedora 的发行版）、Lakka、PiPlay（一个复古模拟发行版）和 Arch Linux ARM。还有一些基于 Linux\
    \ 内核但略有不同的系统，如 Android、Minibian 和 Chromium OS。\n\n还有 Windows 10 IoT Core、FreeBSD、RISC\
    \ OS、Plan 9，以及令人惊讶的 AROS – 一个 Amiga OS 克隆。不用说，一旦你试验完一个版本的 Linux，就像在桌面版本的 Linux\
    \ 上那样，你可以跳转到 Raspberry Pi 上的另一个版本，看看它如何工作，以及是否适合你。\n\n![](img/5019375da05cbf0090115165d80772a1_78_8.png)\n\
    \n## PI、LINUX 和编程\n\n如前所述，Raspberry Pi 是一个优秀的代码基地，以 Linux 为骨干，你可以开始学习多种不同的编程语言。\n\
    \nBash 脚本完美工作，因为 Raspberry Pi OS 是 Linux，并且基于 Debian，你可以轻松扩展你的脚本以涵盖 Pi 的大部分功能。除了创建备份脚本外，你还可以创建能够访问\
    \ Pi 上 GPIO 引脚的脚本，从而控制 LED，甚至更复杂的 HATS。\n\nPython 是初学者最流行的选择，Raspbian 预装了你需要从\
    \ Python 体验中获得最大收益的一切。有无数个预加载模块，以及该语言的最新稳定版本。\n\nC++ 是最强大的编程语言之一，适合学习。它用于游戏、应用程序，甚至整个操作系统。Raspberry\
    \ Pi 带有一个很棒的 C++ 编辑器，易于使用，可以帮助你开发惊人的内容。无论你决定将你的编码和 Linux 冒险引向何处，Raspberry Pi 都是一个开始探索的优秀平台。\n\
    \n![](img/5019375da05cbf0090115165d80772a1_78_9.png)\n\n"
