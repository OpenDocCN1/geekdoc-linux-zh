  - '[PAGE 22]


    # INSTALLING LINUX


    Once the Live Environment has booted, you see the option to install the distro
    to your computer. Have a look around and when you’re ready, look for the Install
    option on the desktop.


    **STEP 1** Providing you’re connected to the internet (if not, then do so now)
    and you’re in the Live Environment, start the installation process by double-clicking
    on the Install Linux Mint icon on the desktop. Other distros display their own
    name, of course, but the process is the same. Click **Continue** when you’re ready.


    ![](img/5019375da05cbf0090115165d80772a1_22_0.png)


    **STEP 4** Before the installation process begins, you’re asked if the choice
    you made regarding the erasure of the hard drive is correct. This is your last
    chance to back off. If you’re certain you don’t mind wiping everything and starting
    again with Linux Mint, click **Continue**. If you need to backup your files remove
    the Linux disc/USB, reboot, backup and start again.


    ![](img/5019375da05cbf0090115165d80772a1_22_1.png)


    **STEP 2** While the installation process is very similar across most Linux distros,
    some offer different questions during the installation. Generally, the questions
    aren’t too difficult, nothing very technical, but some such as ‘Installing third-party
    software…’ can be confusing. In this case you can click **Continue** but if you’re
    unsure, have an Internet-connected device available to ask any questions.


    ![](img/5019375da05cbf0090115165d80772a1_22_2.png)


    **STEP 5** Eventually you are asked to set up your Linux username and password.
    Enter your Name to begin with, then the Computer Name, which is the name it is
    identified on the network as. Next choose a Username, followed by a good Password.
    You can tick the Login Automatically option but leave the Encrypt Home Folder
    option for now.


    ![](img/5019375da05cbf0090115165d80772a1_22_3.png)


    **STEP 3** When installing a new operating system it’s recommended that you wipe
    the old OS, replacing it with the new. When you reach this stage of the installation
    process, ensure the ‘Erase disk and install Linux…’ option is selected. **NOTE:**
    This completely wipes Windows 10 from your computer, so make sure you have backups
    of all your personal files and data.


    ![](img/5019375da05cbf0090115165d80772a1_22_4.png)


    **STEP 6** The installation process can be quick, and there may be more questions
    to answer, or it may simply start installing Linux based on your previous answers.
    Either way, you end up being asked to **Continue Testing the Live Environment**
    or **Restarting** to use the newly installed OS. If you’re ready to use Linux,
    then click **Restart** Now.


    ![](img/5019375da05cbf0090115165d80772a1_22_5.png)'
  - '[PAGE 23]


    # Installing a Virtual

    Environment


    A Virtual Environment is a simulated computer system. Using a Virtual Machine,
    you can mimic a standard PC and install an entire operating system to it without
    affecting the one installed on your computer. It’s a great way to test and use
    Linux, while still having Windows 10 as your main OS.


    # GOING VIRTUAL


    Using a Virtual Machine (VM) takes resources from your computer: memory, hard
    drive space, processor usage and so on. Make sure you have enough of each before
    commencing.


    # STEP 1


    We’re using VirtualBox in this instance, as it’s one of the easiest virtual environments
    to get to grips with. Enter www.virtualbox.org and click on ‘Download VirtualBox’.
    This takes you to the main download page. Locate the correct host for your system:
    Windows or Mac, the Host being the current installed operating system, and click
    the link to begin the download.


    ![](img/5019375da05cbf0090115165d80772a1_23_0.png)


    # STEP 2


    Next, while still at the VirtualBox download page, locate the VirtualBox Extension
    Pack link. The Extension Pack supports USB devices as well as numerous other extras
    that can help make the VM environment a more accurate emulation of a ‘real’ computer.


    ![](img/5019375da05cbf0090115165d80772a1_23_1.png)


    # STEP 3


    With the correct packages downloaded, and before you install anything, you need
    to make sure that the computer you’re using is able to host a VM. To do this,
    reboot the computer and enter the BIOS. When the computer starts up, press the
    Del, F2 or whichever key is necessary to Enter Setup.


    ![](img/5019375da05cbf0090115165d80772a1_23_2.png)


    # STEP 4


    Each BIOS is laid out differently and it’s very difficult to assess where to look
    in each personal example. However, as a general rule of thumb, you’re looking
    for Intel Virtualisation Technology, or simply Virtualisation, found usually within
    the Advanced section of the BIOS. When you’ve located it, Enable it, save the
    settings, exit the BIOS and reboot the computer.


    ![](img/5019375da05cbf0090115165d80772a1_23_3.png)'
  - '[PAGE 24]


    # Installing a Virtual Environment


    **STEP 5**  With the computer back up and running, locate the downloaded main
    VirtualBox application and double-click to begin the installation process. Click
    Next to continue, when you’re ready.


    ![](img/5019375da05cbf0090115165d80772a1_24_0.png)


    **STEP 6**  The default installation location of VirtualBox should satisfy most
    users but if you have any special location requirements click on the ‘Browse’
    button and change the install folder. Then, make sure that all the icons in the
    VirtualBox feature tree are selected, i.e. none of them have a red X next to them.
    Click Next to move on.


    ![](img/5019375da05cbf0090115165d80772a1_24_1.png)


    **STEP 7**  This section can be left alone to the defaults, should you wish. You
    simply makes life a little easier when dealing with VMs, especially when dealing
    with downloaded VMs, which you may encounter in the future. Again, clicking Next
    moves you on to the next stage.


    ![](img/5019375da05cbf0090115165d80772a1_24_2.png)


    **STEP 8**  When installing VirtualBox your network connection is disabled for
    a very brief period. This is due to VirtualBox creating a linked, virtual network
    connection so that any VM installed is able to access the internet; and your home
    network resources; via the computer’s already established network connection.
    Click Yes, then Install to begin the installation.


    ![](img/5019375da05cbf0090115165d80772a1_24_3.png)


    **STEP 9**  You’ll probably be asked by Windows to accept a security notification.
    Click Yes for this and you may encounter a dialogue box asking you to trust the
    installation from Oracle; again, click yes and accept the installation of the
    VirtualBox application. When it’s complete, click finish to start VirtualBox.


    ![](img/5019375da05cbf0090115165d80772a1_24_4.png)


    **STEP 10**  With VirtualBox up and running you can now install the VirtualBox
    Extension Pack. Locate the downloaded add-on and double-click. There may be a
    short pause while VirtualBox analyses the pack but you eventually receive a message
    to install it; obviously click Install to begin the process, scroll down the next
    screen to accept the agreement and click I Agree.


    ![](img/5019375da05cbf0090115165d80772a1_24_5.png)'
  - '[PAGE 25]


    # Installing Linux in a Virtual Environment


    With Oracle’s VirtualBox now up and running, the next task is to create the Virtual
    Machine (VM) environment into which you will install Linux. This process won’t
    affect your currently installed operating system, which is why a VM is a great
    choice.


    # CREATING THE VM


    There are plenty of options to choose from when creating a VM. For now though,
    we’ll setup a VM adequate to run the excellent Linux Mint, and perform well.


    +   **STEP 1**

    +   With VirtualBox open, click on the New icon in the top-middle of the right-hand
    panel of the app. This will open the new VM Wizard.


    ![](img/5019375da05cbf0090115165d80772a1_25_0.png)


    +   **STEP 3**

    +   The next section will define the amount of system memory, or RAM, the VM has
    allocated. Remember this amount will be taken from the available memory installed
    in your computer, so don’t give the VM too much. For example, we have 8GB of memory
    installed and we’re giving 2GB (2048MB) to the VM. When you’re ready, click Next
    to continue.


    ![](img/5019375da05cbf0090115165d80772a1_25_1.png)


    +   **STEP 2**

    +   In the box next to Name type Linux Mint, and VirtualBox should automatically
    choose Linux as the Type and Ubuntu (64-bit) as the Version, if not then use the
    drop-down boxes to select the correct settings (remember Mint’s mainstream is
    based on Ubuntu). Click Next when you’re ready to proceed.


    ![](img/5019375da05cbf0090115165d80772a1_25_2.png)


    +   **STEP 4**

    +   This section is where you’ll start to create the virtual hard disk that the
    VM will use to install Mint on to. The default option, ‘Create a virtual hard
    disk now’, is the one we’re using. Click Create to move on.


    ![](img/5019375da05cbf0090115165d80772a1_25_3.png)'
