  mdcn: "\n\n> “在真正的开源世界里，\n> 你拥有掌控\n> 自己命运的权利。”\n> \n> — 林纳斯·托瓦兹\n> （Linux 内核开发者）\n\
    \n![](img/5019375da05cbf0090115165d80772a1_17_0.png)\n\n# Linux 入门\n\n谈论 Linux\
    \ 有多好是一回事，但如何将其安装到计算机上又是另一回事。安装 Linux 非常简便，但你有多种选择。本节将探讨如何下载 Linux ISO 映像，将其作为主操作系统安装在\
    \ PC 上，以及如何安装虚拟环境。\n\n使用虚拟环境，你可以在继续使用主操作系统（无论是 Windows 还是 macOS）的同时运行 Linux。感兴趣？请继续阅读以了解更多信息。\n\
    \n![](img/5019375da05cbf0090115165d80772a1_18_0.png)\n\n## 在 Windows 上创建 Linux\
    \ 安装介质\n\n在将 Linux ISO 安装到计算机之前，你需要先将其传输到 DVD 或 USB 闪存盘中。这将是一个实时环境，允许你在安装前测试操作系统，但你首先需要创建可启动介质。\n\
    \n### DVD 可启动介质\n\n我们在此使用 Windows 10 PC 将 ISO 传输到 DVD。如果你使用的是 Windows 7 或更高版本，该过程极其简单。\n\
    \n- **步骤 1**\n  首先找到你已下载的 Linux ISO 映像。通常，你可以在 Windows 7、8 和 10 计算机的“下载”文件夹中找到它，除非在保存时你指定了其他位置。\n\
    \n![](img/5019375da05cbf0090115165d80772a1_19_0.png)\n\n- **步骤 2**\n  接下来，将一张可录制\
    \ DVD 光盘插入计算机的光驱。几秒钟后，当光盘被读取时，Windows 会显示一个弹出消息，询问你如何处理新插入的光盘。请忽略此消息，因为我们将使用内置的映像烧录功能。\n\
    \n![](img/5019375da05cbf0090115165d80772a1_19_2.png)\n\n- **步骤 3**\n  右键单击 Linux\
    \ ISO，从菜单中选择“Burn Disc Image”（烧录光盘映像）。根据 PC 的速度，可能需要几秒钟才会发生任何事情。不必过于担心，除非超过一分钟，在这种情况下，重新启动你的\
    \ PC 并再次尝试可能是值得的。如果顺利，Windows 光盘映像烧录器应该会启动。\n\n![](img/5019375da05cbf0090115165d80772a1_19_1.png)\n\
    \n- **步骤 4**\n  在打开的 Windows 光盘映像烧录器对话框中，点击“Verify disc after burning”（烧录后验证光盘）复选框，然后点击“Burn”（烧录）按钮。根据你\
    \ PC 光驱的速度，该过程可能需要几分钟。完成后，它将运行验证阶段，完成时，光驱应该会自动弹出光盘。\n\n![](img/5019375da05cbf0090115165d80772a1_19_3.png)\n\
    \n### USB 可启动介质\n\nUSB 介质比 DVD 更快且通常更方便，因为大多数现代 PC 都没有安装光驱。传输映像的过程很简单，但你首先需要第三方应用和一个\
    \ 4GB 或更大的 USB 闪存盘。\n\n- **步骤 1** 首先打开网页浏览器，访问 www.rufus.akeo.ie/。向下滚动页面一点，你会看到一个“Download”（下载）标题，下面是\
    \ Rufus 的最新版本。左键单击链接以开始下载。\n\n![](img/5019375da05cbf0090115165d80772a1_20_0.png)\n\
    \n- **步骤 2** 双击下载的 Rufus 可执行文件，对 Windows 安全询问点击“Yes”（是），对检查更新点击“Yes”（是）。Rufus\
    \ 启动后，它应该已经识别了你插入的 USB 闪存盘；如果没有，只需拔出并重新插入。\n\n![](img/5019375da05cbf0090115165d80772a1_20_1.png)\n\
    \n- **步骤 3** 乍一看，Rufus 界面可能有点令人困惑，但别担心，它其实相当简单。首先，点击“Disk or ISO Image (Please\
    \ select)”（磁盘或 ISO 映像（请选择））下拉菜单旁边的“SELECT”（选择）按钮。这将启动一个 Windows 资源管理器窗口，你可以在其中定位并选择\
    \ Linux ISO。\n\n![](img/5019375da05cbf0090115165d80772a1_20_2.png)\n\n- **步骤 4**\
    \ 当你准备好时，点击 Rufus 应用底部的“Start”（开始）按钮。这可能会打开另一个对话框，询问你是否下载并使用新版本的 SysLinux。SysLinux\
    \ 是一组引导加载程序，用于允许现代 PC 访问并从 USB 闪存盘引导。这是必需的，因此如果询问，请点击“Yes”（是）以继续。\n\n> This image\
    \ uses Syslinux 6.03/20151222 but this application only includes the installation\
    \ files for Syslinux 6.03/2014-10-06.\n\n由于新版本的 SysLinux 彼此不兼容，且 Rufus 无法包含所有版本，必须从\
    \ Internet 下载两个额外文件（“ldlinux.sys”和“ldlinux.bin”）：\n\n- 选择“Yes”（是）以连接 Internet\
    \ 并下载这些文件\n- 选择“No”（否）以取消操作\n\n> Note. The files will be downloaded to the current\
    \ application directory and will be reused automatically if present.\n\n- **步骤\
    \ 5** 下一步询问你希望以哪种映像模式将 Linux ISO 写入 USB 闪存盘。两种方法在不同情况下均可行，但通常推荐的 ISO 映像模式更为流行。请确保预先选择了此模式，点击\
    \ Ok（确定）继续，然后再次点击 Ok（确定）以确认操作。\n\nIf the image you have selected is an ‘ISO9660’\
    \ image. This means it can be written either in ISO Image (file mode), copy mode\
    \ or DD Image (disk image) mode. Rufus recommends using ISO Image mode, so that\
    \ you always have full access to the drive after writing it. However, if you encounter\
    \ issues during boot, you can try writing this image again in DD mode.\n\nPlease\
    \ select the mode that you want to use to write this image:\n- Write in ISO Image\
    \ mode (Recommended)\n- Write in DD Image mode\n\n- **步骤 6** Linux 映像现在正在从 ISO\
    \ 传输到 USB 闪存盘。该过程不应花费太长时间，具体取决于 USB 设备和 PC 的速度。你可能会发现 Rufus 在过程中会自动在 Windows 资源管理器中关闭\
    \ USB 驱动器；别担心，如果你想的话可以最小化或关闭它。当过程完成时，点击“Close”（关闭）按钮。\n\n![](img/5019375da05cbf0090115165d80772a1_20_3.png)\n\
    \n# 在 PC 上安装 Linux\n\n大多数 Linux 发行版都作为*实时环境*提供。这意味着你可以直接从刚才创建的 DVD 或 USB 启动到一个实际、完全可用的发行版。让我们看看它是如何工作的，以及如何从中安装\
    \ Linux。\n\n## UEFI BIOS\n\n统一可扩展固件接口（UEFI）用于在 PC 启动过程中识别硬件并保护 PC。它取代了传统的 BIOS，但在安装\
    \ Linux 时可能会引起问题。\n\n- **步骤 1** 将你的 DVD 或 USB 闪存盘插入 PC，如果尚未关闭 Windows，请先关闭它。在这个示例中，我们使用\
    \ USB 引导介质，但过程几乎相同。启动 PC，并在提示时按下相应的键进入 BIOS 或 SETUP，例如：F2、Del 或甚至是 F12。\n\n![](img/5019375da05cbf0090115165d80772a1_21_0.png)\n\
    \n- **步骤 2** UEFI BIOS 有不同的版本，因此涵盖所有版本是不可能的。你要找的是一个详细列出引导顺序或引导模式的区域。在这里，你有选项关闭\
    \ UEFI 并选择 Legacy（传统模式）或 Disable Secure Booting（禁用安全启动）。大多数发行版都支持 UEFI，但启用 UEFI\
    \ 引导可能是一个棘手的过程。\n\n![](img/5019375da05cbf0090115165d80772a1_21_2.png)\n\n- **步骤\
    \ 3** 将 UEFI 设置为 Legacy 模式后，现在有两种方式可以启动进入*实时环境*。第一种是通过你已经在其中的 BIOS。找到引导顺序，将第一个启动设备从其原始设置（通常是内部\
    \ HDD 或类似项）更改为：如果是 USB 介质选项，则改为 USB Storage Device（USB 存储设备）；如果是 DVD 介质选项，则改为\
    \ DVD Drive（DVD 驱动器）。\n\n![](img/5019375da05cbf0090115165d80772a1_21_1.png)\n\n\
    - **步骤 4** 或者，使用 Boot Option Menu（启动选项菜单）。使用此选项，你可以按下 F12（或类似按键）显示一系列启动介质选项；在那里，你可以选择适当的启动介质。无论哪种方式，你都可以通过导航到\
    \ Save & Exit（保存并退出）选项并选择‘Save Changes and Exit’（保存更改并退出）来保存并退出 BIOS。\n\n![](img/5019375da05cbf0090115165d80772a1_21_3.png)\n\
    \n"
