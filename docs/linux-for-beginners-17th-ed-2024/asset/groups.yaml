  mdcn: "\n## 安装 Linux\n\n当 Live Environment（实时环境）启动后，你会看到将发行版安装到计算机的选项。可以先四处查看，等准备就绪时，在桌面上查找“Install（安装）”选项。\n\
    \n### 步骤 1\n前提是你已连接互联网（如果未连接，请立即连接），并且你处于实时环境中。双击桌面上的“Install Linux Mint”图标以开始安装过程。其他发行版当然会显示它们自己的名称，但过程是相同的。准备就绪后，点击**继续**。\n\
    \n![](img/5019375da05cbf0090115165d80772a1_22_0.png)\n\n### 步骤 2\n虽然大多数 Linux\
    \ 发行版的安装过程非常相似，但有些发行版在安装过程中会提出不同的问题。通常，这些问题并不太难，没什么技术性很强的内容，但有些问题，例如“正在安装第三方软件……”可能会让人困惑。在这种情况下，你可以点击**继续**，但如果你不确定，请准备一台连接互联网的设备以便咨询任何问题。\n\
    \n![](img/5019375da05cbf0090115165d80772a1_22_2.png)\n\n### 步骤 3\n安装新的操作系统时，建议清除旧的操作系统，并用新的系统替换它。当安装过程进行到这一步时，请确保选中了“抹盘并安装\
    \ Linux……”选项。**注意：** 这将完全清除计算机上的 Windows 10，因此请务必备份所有个人文件和数据。\n\n![](img/5019375da05cbf0090115165d80772a1_22_4.png)\n\
    \n### 步骤 4\n在安装过程开始之前，系统会询问你关于清除硬盘的选择是否正确。这是你最后反悔的机会。如果你确信不介意清除所有数据并重新开始使用 Linux\
    \ Mint，请点击**继续**。如果你需要备份文件，请移除 Linux 光盘/USB，重启，备份并重新开始。\n\n![](img/5019375da05cbf0090115165d80772a1_22_1.png)\n\
    \n### 步骤 5\n最终，系统会要求你设置 Linux 用户名和密码。首先输入你的姓名，然后是计算机名称，这是该计算机在网络上识别所用的名称。接下来选择一个用户名，然后设置一个好的密码。你可以勾选“自动登录”选项，但暂时保留“加密主文件夹”选项。\n\
    \n![](img/5019375da05cbf0090115165d80772a1_22_3.png)\n\n### 步骤 6\n安装过程可能很快，可能会有更多问题需要回答，或者系统可能仅根据你之前的回答直接开始安装\
    \ Linux。无论哪种情况，最后你都会被要求**继续测试实时环境**或**重启**以使用新安装的操作系统。如果你准备好使用 Linux，请立即点击**重启**。\n\
    \n![](img/5019375da05cbf0090115165d80772a1_22_5.png)\n\n## 安装虚拟环境\n\n虚拟环境是一种模拟计算机系统。使用虚拟机（Virtual\
    \ Machine），你可以模拟标准 PC 并为其安装整个操作系统，而不会影响你计算机上已安装的操作系统。这是一个测试和使用 Linux 的绝佳方式，同时仍保留\
    \ Windows 10 作为主要操作系统。\n\n### 进入虚拟化\n\n使用虚拟机（VM）会占用计算机的资源：内存、硬盘空间、处理器使用率等。在开始之前，请确保你拥有足够的资源。\n\
    \n### 步骤 1\n在此示例中，我们使用 VirtualBox，因为它是最容易掌握的虚拟环境之一。输入 www.virtualbox.org 并点击“Download\
    \ VirtualBox”。这将带你进入主下载页面。定位适用于你系统的正确主机：Windows 或 Mac，主机是指当前已安装的操作系统，然后点击链接开始下载。\n\
    \n![](img/5019375da05cbf0090115165d80772a1_23_0.png)\n\n### 步骤 2\n接下来，在 VirtualBox\
    \ 下载页面，定位到 VirtualBox Extension Pack（扩展包）链接。扩展包支持 USB 设备以及众多其他附加功能，这些功能可以帮助使虚拟机环境更准确地模拟“真实”计算机。\n\
    \n![](img/5019375da05cbf0090115165d80772a1_23_1.png)\n\n### 步骤 3\n在正确下载软件包之后，且在安装任何内容之前，你需要确保你正在使用的计算机能够托管虚拟机。为此，重启计算机并进入\
    \ BIOS。当计算机启动时，按 Del、F2 或必要的键进入设置（Enter Setup）。\n\n![](img/5019375da05cbf0090115165d80772a1_23_2.png)\n\
    \n### 步骤 4\n每个 BIOS 的布局都不同，很难评估在每个具体示例中应该在哪里查找。不过，一般经验法则是，你正在寻找的是 Intel 虚拟化技术（Intel\
    \ Virtualisation Technology），或者简单称为虚拟化（Virtualisation），通常位于 BIOS 的高级（Advanced）部分。找到后，启用它，保存设置，退出\
    \ BIOS 并重启计算机。\n\n![](img/5019375da05cbf0090115165d80772a1_23_3.png)\n\n### 步骤\
    \ 5\n计算机重新启动并运行后，找到已下载的主 VirtualBox 应用程序并双击以开始安装过程。准备就绪后，点击下一步以继续。\n\n![](img/5019375da05cbf0090115165d80772a1_24_0.png)\n\
    \n### 步骤 6\nVirtualBox 的默认安装位置应能满足大多数用户，但如果你有特殊的位置需求，请点击“浏览”按钮并更改安装文件夹。然后，确保 VirtualBox\
    \ 功能树中的所有图标都已选中，即没有图标旁边有红色 X。点击下一步以继续。\n\n![](img/5019375da05cbf0090115165d80772a1_24_1.png)\n\
    \n### 步骤 7\n如果你愿意，可以保持此部分的默认设置不变。这只是在处理虚拟机（VMs）时让事情变得稍微简单一些，特别是在处理下载下来的虚拟机时，你可能会在未来遇到这种情况。再次点击下一步进入下一个阶段。\n\
    \n![](img/5019375da05cbf0090115165d80772a1_24_2.png)\n\n### 步骤 8\n安装 VirtualBox\
    \ 时，你的网络连接会在很短的时间内被禁用。这是因为 VirtualBox 正在创建一个链接的虚拟网络连接，以便任何已安装的虚拟机都能通过计算机已建立的网络连接访问互联网；以及你的家庭网络资源；点击是，然后点击安装以开始安装。\n\
    \n![](img/5019375da05cbf0090115165d80772a1_24_3.png)\n\n### 步骤 9\nWindows 可能要求你接受安全通知。对此点击是，你可能会遇到一个对话框询问你是否信任来自\
    \ Oracle 的安装；再次，点击是并接受安装 VirtualBox 应用程序。完成后，点击完成以启动 VirtualBox。\n\n![](img/5019375da05cbf0090115165d80772a1_24_4.png)\n\
    \n### 步骤 10\n随着 VirtualBox 的正常运行，你现在可以安装 VirtualBox 扩展包了。找到下载的附加组件并双击。在 VirtualBox\
    \ 分析该扩展包时可能会有短暂的暂停，但最终你会收到安装它的消息；显然，点击安装以开始过程，在下一个屏幕向下滚动以接受协议并点击我同意。\n\n![](img/5019375da05cbf0090115165d80772a1_24_5.png)\n\
    \n## 在虚拟环境中安装 Linux\n\n随着 Oracle 的 VirtualBox 正常运行，接下来的任务是创建虚拟机（VM）环境，你将在其中安装\
    \ Linux。此过程不会影响你当前安装的操作系统，这就是为什么虚拟机是一个绝佳选择的原因。\n\n### 创建虚拟机\n\n创建虚拟机时有很多选项可供选择。不过暂时，我们将设置一个足以运行出色的\
    \ Linux Mint 且性能良好的虚拟机。\n\n- **步骤 1**\n  在 VirtualBox 中，点击应用右侧面板顶部中间的“新建”图标。这将打开新虚拟机向导。\n\
    \n![](img/5019375da05cbf0090115165d80772a1_25_0.png)\n\n- **步骤 2**\n  在名称旁边的框中输入\
    \ Linux Mint，VirtualBox 应自动将类型选择为 Linux，版本选择为 Ubuntu (64-bit)，如果没有，请使用下拉框选择正确的设置（请记住\
    \ Mint 的主流版本基于 Ubuntu）。准备继续时，点击下一步。\n\n![](img/5019375da05cbf0090115165d80772a1_25_2.png)\n\
    \n- **步骤 3**\n  下一部分将定义分配给虚拟机的系统内存（或 RAM）数量。请记住，这部分内存将从你计算机中安装的可用内存中扣除，因此不要给虚拟机分配过多。例如，我们安装了\
    \ 8GB 的内存，我们给虚拟机分配 2GB（2048MB）。准备就绪后，点击下一步以继续。\n\n![](img/5019375da05cbf0090115165d80772a1_25_1.png)\n\
    \n- **步骤 4**\n  在此部分，你将开始创建虚拟机将用于安装 Mint 的虚拟硬盘。默认选项“立即创建虚拟硬盘”是我们正在使用的。点击创建以继续。\n\
    \n![](img/5019375da05cbf0090115165d80772a1_25_3.png)\n\n"
