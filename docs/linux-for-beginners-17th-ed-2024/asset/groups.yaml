    # 桌面环境


    Linux Mint 提供多种不同的版本，或称为“风味”：Cinnamon、MATE 和 Xfce；这些版本也都有 32 位和 64 位之分。但这究竟意味着什么？在安装时，你应该选择哪个版本？


    # 选择哪种 Mint？


    桌面环境是你用来与核心 Linux 系统进行交互的图形界面。就像 Windows 10 的图形桌面也被称为 Fluent Design（流畅设计）一样。


    Linux Mint 为用户提供发行版的多个版本选择：Cinnamon、MATE 和 Xfce。虽然这听起来可能会让新手有些困惑，但本质上，每个可用的版本都包含相同的
    Linux 核心结构和内核；内核是操作系统的核心，负责处理软件与硬件之间的所有指令。


    每个版本仅仅是不同的桌面环境，即你用来与操作系统交互的图形用户界面 (GUI)。每种桌面环境使用不同的应用程序来访问或使用系统，例如使用文件管理器浏览操作系统的文件结构，或以不同的方式启动其他应用程序。不过，可供使用的核心生产力、视频和图形套件都是相同的，并且工作方式也一致。


    那么，为什么还要费劲使用不同的桌面环境呢？简单来说，这取决于个人口味。一些用户更喜欢 MATE，因为 MATE 是经典 GNOME 2 环境的分支，采用更多基于菜单的设计，并且在旧计算机上表现良好。另一些用户更喜欢
    Cinnamon，它是一个更现代的环境，在最新硬件上运行得更好，并具有一些前沿的桌面代码。另一方面，Xfce 是一个轻量级桌面环境，由于其对可用系统资源的极低占用，在旧硬件上运行良好。


    简而言之，Cinnamon 是 Linux Mint 的旗舰桌面环境。MATE 与更广泛的硬件兼容性更好。例如，Windows 只提供在一个桌面环境中工作，而
    Linux 提供了许多选择。因此，Linux Mint 选择为用户提供丰富的选择。


    ![](img/5019375da05cbf0090115165d80772a1_13_0.png)


    # 一抹 Cinnamon 风味


    Cinnamon 除了其外观和感觉之外还有许多优点，尽管这些都是重要的因素。在这里，我们概述了一些功能，帮助你决定它是否是你理想的桌面环境 (DE)。


    ## FAB 特性 1


    它在较新的系统上表现非常出色，但比以前稳定得多，也不再像过去那样是资源消耗大户。因此，如果你使用旧计算机来安装和测试 Linux Mint，不要因为它是 Cinnamon
    就有所顾虑。


    ![](img/5019375da05cbf0090115165d80772a1_14_0.png)


    ## FAB 特性 2


    Cinnamon 具有可配置的“热角” (Hot Corners) 功能，你可以点击桌面的每个角落来执行特定任务，例如显示工作区、显示所有窗口或运行命令。热角是在不同视图之间切换的极佳方式，有助于使桌面成为一个更高效的环境。


    # 最佳 MATE


    MATE 是一个易于使用且直观的桌面环境，速度快且稳定。与 Cinnamon 相比，它看起来稍微有些过时，但这只是表面现象。MATE 有很多值得喜欢的地方。


    ## FAB 特性 1


    MATE 是旧计算机的优秀桌面环境。与 Cinnamon 通常支持的硬件相比，它能更好地支持更多种类的硬件组件，但同样能够提供外观出色的桌面以及高级自定义功能。


    ![](img/5019375da05cbf0090115165d80772a1_14_1.png)


    ## FAB 特性 2


    由于其高度可配置的特性，MATE 可以被进行精细的自定义。对于要求桌面环境提供更多功能用户来说，有大量的选项可供选择，包括 Compiz 设置，在那里你可以配置各种桌面效果，甚至是一个
    3D 桌面立方体。


    # 无胆固醇桌面


    Xfce 始于 1996 年的通用桌面环境 (CDE)。自那以后，它改变过几次名称，现在 simply 称为 Xfce，绰号为“无胆固醇桌面环境”。


    ## FAB 特性 1


    Xfce 确实是一个快速的桌面，展现了 Linux 作为快速操作系统的一面。事实上，从本页顶部开始，我们只需要几百字就完成了在新电脑上安装它。这是多么糟糕？（注：原文
    "How bad?" 在此语境下可能意为“怎么会这么慢/难？”或反问“有多糟？”，结合上下文指安装过程极其快速，故翻译保留其反问或强调快速之意，直译为“有多糟？”略显不通顺，根据语境意译为“这有多快/轻松？”更贴切，但为忠实原文结构，此处暂译为“这有多糟？”或结合上下文理解为“这速度有多快？”
    此处按直译保留疑问语气，实际意指安装非常快。）

    *修正理解*：原文 "A few hundred words written and we’re using a brand new OS. How bad?"
    这里的 "How bad?" 是反讽或强调，意思是“（写了几百字就装好了）这有多（不）糟？”即“这快得简直不可思议/多棒？”。在中文语境下，翻译为“这有多糟？”并不合适。结合前文“fast
    operating system”，应理解为强调其速度之快。

    *重新调整翻译*：事实上，从本页顶部开始，写了几百字，我们已经在新的计算机上安装并使用了它。这有多糟？（意指：这么快就装好了，这速度有多快/不可思议？） ->
    为了通顺，译为：“事实上，从本页顶部开始，写了几百字，我们已经在新的计算机上安装并使用了它。这有多快？” 但原文是 "How bad?"，直译是“有多糟？”，在英语俚语中有时表示“有多棒/有多酷”（bad
    作俚语解），或者仅仅是反问。鉴于这是技术文档，保持直译“有多糟？”可能让读者困惑。但作为翻译任务，需忠实原文。让我们看上下文，前面说 Linux 是 fast
    OS，Xfce 是 quick desktop。所以这里的意思是安装非常快，还没写完介绍就装好了。所以 "How bad?" 可能是 "How bad is
    that?" -> "That''s not bad" 的反向？或者就是 "That''s cool/good"。

    *决定*：直译为“这有多糟？”并不准确表达原意（原意是夸它快）。但在翻译中，如果不确定俚语，通常直译。不过，这里 "How bad?" 紧接 "A few
    hundred words written... using a brand new OS"，显然是在夸速度快。中文可以说“这速度有多快？”或者“这有多棒？”。为了保持口语感且符合语境，译为“这有多糟？”绝对不行。我会译为“这有多（不可思议/棒）？”。

    *再次修正*：考虑到 "bad" 在俚语中可以是 good/cool。例如 "That''s bad!" = "That''s cool!". 所以 "How
    bad?" = "How cool?". 中文对应“这有多酷？”或“这有多棒？”。


    ![](img/5019375da05cbf0090115165d80772a1_14_2.png)


    ## FAB 特性 2


    仅仅因为它快速且轻量，并不意味着 Linux Mint Xfce 不是一个完整的桌面操作系统。正如其他提供的桌面环境一样，你拥有最新的 Firefox、LibreOffice、VLC、Gimp、聊天应用，甚至是一个
    BitTorrent 客户端。


    # 选择哪种发行版？


    到目前为止，我们主要讨论的是 Linux Mint，但还有其他 Linux 发行版可以尝试。事实上，有数千种 Linux 发行版可供下载和安装，那么你应该决定使用哪一种？


    ## 发行版跳跃


    “发行版跳跃” (Distro Hopping) 是社区用来形容那些从不坚持使用单一发行版的人的术语。相反，他们从一个跳到另一个，再跳回来，测试每一个，使用它们，然后转向另一个或新发布的发行版。


    发行版跳跃并没有错，因为这是一种熟悉当前可用环境并发现某一发行版相较于另一发行版中可能吸引你或不吸引你的元素的好方法。问题当然是，你整体使用哪一个大？


    ![](img/5019375da05cbf0090115165d80772a1_15_0.png)


    虽然发行版跳跃是好事，但它并不是享受 Linux 并从中获益最多的稳定方式。我们并不是说你应该坚持使用一个发行版而永远不看其他地方，因为那样你会错过很多很棒的内容，而是建议你找到几个发行版，并根据你日益增长的
    Linux 技能慢慢深入它们。


    ![](img/5019375da05cbf0090115165d80772a1_15_1.png)


    例如，Linux Mint 是一个理想的起点。它是一款易于安装和使用的发行版，已经预装了你日常通常会使用的所有软件，并温和地将你引入 Linux 的独特世界，以及它是如何工作和运作的。


    Ubuntu 提供类似的体验，但它的方式略有不同。通常，Ubuntu 预装的软件比 Linux Mint 少，因此你需要手动安装它们。另一个值得考虑的是，专门针对
    Linux 用户中 Ubuntu 用户的内容和帮助页面的数量极其庞大。如果你遇到困难，解决方案总是近在咫尺。


    继续前进，当你开始对 Linux 更加自信时，你可以测试 openSUSE、Fedora 或 Debian 等发行版。这些都是非常出色的发行版，每个都为用户提供了对系统运行方式的稍微不同的视角。有些在
    Linux 技能方面要求更高，但本质上，它们每个都有一些有价值的课程供用户学习。


    你可能会发现自己转向某个特定的发行版，因为它提供了与常规截然不同的事物。例如，Tails Linux 是一个专门设计用于在线匿名的发行版。它包含复杂的军用级加密工具，以及旨在帮助你浏览网页而从未被检测、跟踪或监控的工具和浏览器。Kali
    Linux 是为安全专业人员设计的，包含许多不同种类的道德黑客


    ![](img/5019375da05cbf0090115165d80772a1_15_2.png)


    ![](img/5019375da05cbf0090115165d80772a1_16_0.png)


    ![](img/5019375da05cbf0090115165d80772a1_16_1.png)


    预装工具，用户可以使用这些工具对其网络进行渗透测试。曾经甚至有一个 Hannah Montana Linux 发行版，但我们最好少提它。重点是，那里有一个适合你的发行版。


    不用说，一旦你相对精通 Linux，可能达到高级用户的水平，你就会想要扩展你的技能，并基于 Arch、Debian 或众多其他可用发行版之一开始构建你自己的
    Linux 发行版。这样做涉及大量的命令行知识，以及关于 Linux 系统如何工作以及与计算机硬件交互的知识。你需要分区你自己的硬盘，安装一个桌面环境，并最终安装你想要的各种应用程序和程序。这需要时间，而且你需要学习很多技能。


    最终，你可以将自己视为一名技术型 Linux 用户，但永远不要认为自己是专家，毕竟我们总是在学习新东西。你可以从头构建自己的发行版，帮助其他 Linux 用户解决问题，也许甚至可以在某个发行版的测试或构建阶段为改进做出贡献。接下来去哪里？


    奇怪的是，大多数高端技术用户发现自己回到了原点，使用像 Linux Mint 这样的发行版。主要原因通常是它是一个简单的选项，并且是一个稳定的环境。仅仅因为你了解系统的里里外外，并不意味着你总是想修复潜在的问题。我们中的大多数人都更喜欢轻松的生活，尤其是在技术方面，所以合乎逻辑的选择是选择一个简单但仍然足够强大以完成你想要的一切的发行版，因此是
    Linux Mint。


    然而，归根结底，这纯粹是选择，是你个人的选择。你可能发现在阅读本书中的教程后，你不喜欢 Linux Mint 或 Cinnamon 桌面。没关系，你可能更喜欢
    Ubuntu、Debian 或 openSUSE，这就是 Linux 的美妙之处。改变你想要的东西的自由，在没有成本或访问权限缺失的惩罚下，在一个发行版和另一个发行版之间跳跃。


    对于“哪个发行版”这个问题的答案是，你喜欢哪一个就是哪一个！它可以像你需要的那样复杂或简单，只要它做你想要它做的事，它就是完美的。


