    \ Xed, Vi, Nano, Vim, GNU Emacs and so on. In the end it all comes down to personal\
    \ preference. Our use of Xed is purely due to making it easier to read the script\
    \ in the screenshots you see below.\n\n**STEP 3** To begin with, and before you\
    \ start to write any scripts, you need to create a folder where you can put all\
    \ your scripts into. Start with `mkdir scripts`, and enter the folder `cd scripts/`.\
    \ This will be our working folder and from here you can create sub-folders if\
    \ you want of each script you create.\n\n![](img/5019375da05cbf0090115165d80772a1_67_1.png)\n\
    \n**STEP 4** Windows users will be aware that in order for a batch file to work,\
    \ as in be executed and follow the programming within it, it needs to have a .BAT\
    \ file extension. Linux is an extension-less operating system but the convention\
    \ is to give scripts a .sh extension.\n\n![](img/5019375da05cbf0090115165d80772a1_67_2.png)\n\
    \n**STEP 5** Let’s start with a simple script to output something to the Terminal.\
    \ Enter `xed helloworld.sh`. This will launch Xed and create a file called helloworld.sh.\
    \ In Xed, enter the following: `#!/bin/bash`, then on a new line: `echo Hello\
    \ World!`.\n\n![](img/5019375da05cbf0090115165d80772a1_68_0.png)\n\n**STEP 6**\
    \ The `#!/bin/bash` line tells the system what Shell you’re going to be using,\
    \ in this case Bash. The hash (#) denotes a comment line, one that is ignored\
    \ by the system, the exclamation mark (!) means that the comment is bypassed and\
    \ will force the script to execute the line as a command. This is also known as\
    \ a Hash-Bang.\n\n![](img/5019375da05cbf0090115165d80772a1_68_2.png)\n\n**STEP\
    \ 7** You can save this file, clicking **File > Save**, and exit back to the Terminal.\
    \ Entering `ls`, will reveal the script in the folder. To make any script executable,\
    \ and able to run, you need to modify its permissions. Do this with `chmod +x\
    \ helloworld.sh`. You need to do this with every script you create.\n\n![](img/5019375da05cbf0090115165d80772a1_68_4.png)\n\
    \n**STEP 8** When you enter `ls` again, you can see that the helloworld.sh script\
    \ has now turned from being white to green, meaning that it’s now an executable\
    \ file. To run the script, in other words make it do the things you’ve typed into\
    \ it, enter: `./helloworld.sh`.\n\n![](img/5019375da05cbf0090115165d80772a1_68_1.png)\n\
    \n**STEP 9** Although it’s not terribly exciting, the words ‘Hello World!’ should\
    \ now be displayed in the Terminal. The `echo` command is responsible for outputting\
    \ the words after it in the Terminal, as we move on you can make the `echo` command\
    \ output to other sources.\n\n![](img/5019375da05cbf0090115165d80772a1_68_3.png)\n\
    \n**STEP 10** Think of `echo` as the old **BASIC** Print command. It displays\
    \ either text, numbers or any variables that are stored in the system, such as\
    \ the current system date. Try this example: `echo Hello World! Today is $(date\
    \ +%A)`. The `$(date +%A)` is calling the system variable that stores the current\
    \ day of the week.\n\n![](img/5019375da05cbf0090115165d80772a1_68_5.png)\n\n##\
    \ Creating Bash Scripts – Part 2\n\nPreviously we looked at creating your first\
    \ Bash script, Hello World, and adding a system variable. Now you can expand these\
    \ and see what you can do when you start to play around with your own unique variables.\n\
    \n### VARIABLES\n\nJust as in every other programming language a Bash script can\
    \ store and call certain variables from the system, either generic or user created.\n\
    \n- **STEP 1**\n  Let’s start by creating a new script called hello.sh; `xed hello.sh.`\
    \ In it enter: `#!/bin/bash`, then, echo Hello $1. Save the file and exit Xed.\
    \ Back in the Terminal make the script executable with `chmod +x hello.sh.`\n\n\
    ![](img/5019375da05cbf0090115165d80772a1_69_0.png)\n\n- **STEP 2**\n  As the script\
    \ is now executable, run it with `./hello.sh.` Now, as you probably expected a\
    \ simple 'Hello' is displayed in the Terminal. However, if you then issue the\
    \ command with a variable, it begins to get interesting. For example, try `./hello.sh\
    \ David`.\n\n![](img/5019375da05cbf0090115165d80772a1_69_1.png)\n\n- **STEP 3**\n\
    \  The output now will be Hello David. This is because Bash automatically assigns\
    \ variables for the user, which are then held and passed to the script. So the\
    \ variable '$1' now holds ‘David’. You can change the variable by entering something\
    \ different: `./hello.sh Mint`.\n\n![](img/5019375da05cbf0090115165d80772a1_69_2.png)\n\
