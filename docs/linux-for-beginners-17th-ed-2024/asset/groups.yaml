    # Update Mint via the Terminal


    Up to now you’ve been using the shield icon to launch Mint Update Manager in order
    to update the system and upgrade the currently installed apps, tools and other
    elements. However, you can also accomplish a complete system update and upgrade
    from the Terminal.


    # USING APT-GET


    To update and upgrade via the Terminal you use the APT (Advanced Packaging Tool)
    command. It’s a powerful command and combines different elements depending on
    its use.


    # STEP 1


    Start by opening a new Terminal or if you already have one opened clear its contents
    with the clear command. This starts you off with a clean slate on which to work.


    ![](img/5019375da05cbf0090115165d80772a1_47_0.png)


    # STEP 3


    Apt-get is used to update and upgrade the software in Mint, as well as Ubuntu
    and other Debian-based distros. Using the Update element retrieves new package
    lists and updates the list of source files. Upgrade downloads and performs an
    upgrade to the latest versions of those files. To start the entire Upgrade and
    Update process, enter: `sudo apt-get update`, followed by your password.


    ![](img/5019375da05cbf0090115165d80772a1_47_1.png)


    # STEP 2


    Enter `apt-get` into the Terminal. This brings up a list of the most used apt-get
    commands, along with a brief description of what the command does. It’s worth
    having a look at, even if it doesn’t make a huge amount of sense at this time.


    ![](img/5019375da05cbf0090115165d80772a1_47_2.png)


    # STEP 4


    Notice now the addition of the sudo command. The sudo command once meant Super
    User Do; these days it’s more acceptable as Substitute User Do. It means that
    the administrative user (Super User) uses APT (Advanced Packaging Tool) to Get
    any Updates. Now try this: `sudo apt-get upgrade`.


    ![](img/5019375da05cbf0090115165d80772a1_47_3.png)'
