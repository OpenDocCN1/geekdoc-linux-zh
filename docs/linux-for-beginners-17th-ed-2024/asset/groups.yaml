    \n不过，Linux 并不只关乎 C++、Python 或其他更流行的编程语言。使用 Linux 的命令行（也称为终端），你可以创建 Shell 脚本，这是设计用于从命令行运行的程序，由脚本语言组成。它们主要用于自动化任务，或为特定操作提供某种形式的用户输入和输出。\n\
    \n最后，虽然我们可以列出更多优势，但有成千上万个免费的程序和应用程序涵盖了几乎计算的每一个方面。这些被称为软件包，截至目前，仅在 Linux Mint 上就有超过\
