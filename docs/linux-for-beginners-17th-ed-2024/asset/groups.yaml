    桌面环境作为其旗舰模式；同时也提供 MATE 和 Xfce 模式。


    Cinnamon 是一个图形丰富的桌面环境，MATE 使用的图形效果较为朴素，并且在更广泛的桌面系统上更加稳定，而 Xfce 则是一个极其精简的桌面环境，专为速度和极致稳定性而构建。


    在这本书中，我们将使用 Cinnamon 版本；不过，你可以随心所欲地试用其他任何桌面环境。事实上，建议你花些时间尝试不同的环境，甚至不同的发行版，看看哪个最适合你和你的电脑。


    www.linuxmint.com


    ![](img/5019375da05cbf0090115165d80772a1_9_0.png)


    ### Ubuntu


    ![](img/5019375da05cbf0090115165d80772a1_9_1.png)


    第二受欢迎的发行版是 Ubuntu，这是一个古老的非洲词汇，意为“对他人的博爱”。在 Ubuntu 诞生的十四年里，其受欢迎程度有所波动。曾经，它轻而易举地成为全球使用最多的基于
    Linux 的操作系统，但在其发展过程中，由于界面展示方面的某些错误决策，以及一些涉及隐私的不幸且有争议的事件，它令人遗憾地跌落了下来，失去了第一的位置。


    话虽如此，Ubuntu 随后进行了修正，并正慢慢爬回 Linux 排行榜的顶端。该操作系统的最新版本使用 GNOME 3 桌面环境，这是一个令人印象深刻的环境，尽管对于前
    Windows 用户来说可能有点令人困惑，而且它对系统资源的要求稍高，特别是如果你计划将其安装在较旧的计算机上。


    尽管 Ubuntu 有各种缺点，它仍然是一个适合开始实验 Linux 的良好发行版。它拥有简洁的界面，易于使用和安装，并为用户提供完整的 Linux 体验。


    www.ubuntu.com


    ### Arch


    Arch 是最持久的 Linux 发行版之一，也是许多其他 Linux 版本的基础。既然你可以安装 Arch，为什么还要安装 Mint 或 Ubuntu 呢？许多用户确实会这样做，但它并不适合初学者。Ubuntu
    和 Mint 都提供了更简单的安装路径，并附带软件包帮助你入门。


    ![](img/5019375da05cbf0090115165d80772a1_10_0.png)


    Arch 是当你拥有更多 Linux 经验时才选择的发行版。你从只有命令行开始，然后必须手动分区硬盘，设置安装文件的位置，创建用户，设置操作系统区域设置，最后安装桌面环境以及你想要的软件。


    另一方面，Arch 是一个更“精简”的事务。Arch 致力于自由软件，其仓库包含超过 50,000 个可安装的应用程序，包括多种不同的桌面环境，你可以像使用其他任何发行版一样使用它。


    然而，经过所有这些努力，优势在于你拥有一个由自己创建的发行版。这意味着你的 Arch 发行版不会包含其他人预安装的那些不必要的文件和应用；它是为你量身定制的，由你自己构建。


    www.archlinux.org


    ### RASPBERRY PI DESKTOP（树莓派桌面版）


    毫无疑问，你听说过树莓派（Raspberry Pi），很难没听说，因为自从推出以来的六年里，这款惊人且小巧的计算机已经席卷了科技界。


    树莓派有许多方面使其成为计算世界中备受追捧的部件。首先，它很便宜，本质上是一台完全可工作的计算机，却只需 25 英镑左右。它很小，尺寸比信用卡大不了多少。你可以用它构建电子设备，它拥有完全可编程的接口，并且附带
    Raspbian，这是其专属的、基于 Debian 的定制操作系统，包含办公套件以及多种不同的编程语言和教育资源。


    Raspbian 是树莓派硬件独享的，因为树莓派使用 ARM 处理器供电。不过，树莓派基金会随后发布了 Raspbian 的 PC 版本：Raspberry
    Pi Desktop。


    与树莓派版本一样，Raspberry Pi Desktop 内置了你需要的所有编码、教育及其他应用程序。它快速、稳定且运行出色。如果你对拓展你的 Linux
    体验感兴趣，那么这绝对是值得考虑的顶级发行版之一。


    www.raspberrypi.org/downloads/raspberrypi-pi-desktop


    ![](img/5019375da05cbf0090115165d80772a1_10_1.png)


