  md: "\n## Linux and the Big Bang\n\n![](img/5019375da05cbf0090115165d80772a1_65_0.png)\n\
    \n> Linux is colliding particles, so we can understand how the universe works.\n\
    \n## DID YOU KNOW...\n\nthat Linux is at the heart of the science behind the Large\
    \ Hadron Collider? Using a combination of Red Hat Linux and CentOS (an ultra-stable\
    \ distro built from the Red Hat core) as the base distributions of choice, scientists,\
    \ developers and engineers have created SL – Scientific Linux.\n\nUsing SL as\
    \ the base, the clever people at CERN have developed several different versions\
    \ of their own custom Linux distro to help with all aspects of the LHC. Most notable\
    \ is SLC, or Scientific Linux CERN, also known as CERN6. According to reports,\
    \ there are over 36,000 systems running SL, and over 15,000 running SLC.\n\n![](img/5019375da05cbf0090115165d80772a1_66_0.png)\n\
    \n## Creating Bash Scripts – Part 1\n\nEventually, as you advance with Linux Mint,\
    \ you'll want to start creating your own automated tasks and programs. These are\
    \ essentially scripts. Bash Shell scripts to be exact, and they work in the same\
    \ way as a DOS Batch file does, or any other programming language.\n\n### GET\
    \ SCRIPTING\n\nA Bash script is simply a series of commands that Mint will run\
    \ through to complete a certain task. They can be simple or remarkably complex,\
    \ it all depends on the situation.\n\n**STEP 1** You'll be working within the\
    \ Terminal and with a text editor throughout the coming pages. There are alternatives\
    \ to the text editor, which we'll look at in a moment but for the sake of ease,\
    \ we'll be doing our examples in Xed. Before you begin, however, run through the\
    \ customary update check: `sudo apt-get update && sudo apt-get upgrade.`\n\n![](img/5019375da05cbf0090115165d80772a1_67_0.png)\n\
