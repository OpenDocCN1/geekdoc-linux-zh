    # Getting Started with Linux


    It’s all fine and well talking about how good Linux is but how do you get it on
    your computer? Installing Linux is remarkably simple but there are several options
    available to you. This section looks into how you can download the Linux ISO,
    install it on a PC as your main operating system and even how to install a virtual
    environment.


    With a virtual environment you can run Linux while still using your main operating
    system, be that Windows or macOS. Intrigued? Read on and find out more.


    ![](img/5019375da05cbf0090115165d80772a1_18_0.png)'
  - "[PAGE 19]\n\n# # Creating a Linux Installer on Windows\n\nYou need to transfer\
    \ the downloaded Linux ISO to either a DVD or a USB key before being able to install\
    \ it onto a computer. This will be a live environment, which allows you to test\
    \ the OS prior to installation, but first you need to create the bootable media.\n\
    \n# ## DVD BOOTABLE MEDIA\n\nWe’re using a Windows 10 PC here to transfer the\
    \ ISO to a DVD. If you’re using a version of Windows from 7 onward the process\
    \ is extremely easy.\n\n+   **STEP 1**\n+   \n+   First locate the ISO image of\
    \ Linux you’ve already downloaded. You can usually find it in the Downloads folder\
    \ in Windows 7, 8, 1 and 10 computers, unless you specified a different location\
    \ when saving it.\n\n![](img/5019375da05cbf0090115165d80772a1_19_0.png)\n\n+ \
    \  **STEP 3**\n+   \n+   Right-click the Linux ISO and from the menu select Burn\
    \ Disc Image. Depending on the speed of the PC, it may take a few seconds before\
    \ anything happens. Don’t worry too much, unless it takes more than a minute,\
    \ in which case it might be worth restarting your PC and trying again. With luck,\
    \ the Windows Disc Image Burner should launch.\n\n![](img/5019375da05cbf0090115165d80772a1_19_1.png)\n\
    \n+   **STEP 2**\n+   \n+   Next insert a recordable DVD disc into your computer’s\
    \ optical drive. After a few seconds, while the disc is read, Windows displays\
    \ a pop-up message asking you what to do with the newly inserted disc. Ignore\
    \ this, as we’re going to use the built-in image burning function.\n\n![](img/5019375da05cbf0090115165d80772a1_19_2.png)\n\
    \n+   **STEP 4**\n+   \n+   With the Windows Disc Image Burner dialogue box open,\
    \ click on the 'Verify disc after burning' tick box, then the Burn button. The\
    \ process should take a few minutes, depending on the speed of your PC’s optical\
    \ drive. Once it’s complete it runs through the verification stage and when done\
    \ the optical drive should auto-eject the disc for you.\n\n![](img/5019375da05cbf0090115165d80772a1_19_3.png)"
  - '[PAGE 20]


    # # Creating a Linux Installer on Windows


    # ## USB BOOTABLE MEDIA


    USB media is faster than a DVD and often more convenient, as most modern PCs don’t
    have an optical drive installed. The process of transferring the image is easy
    but you need a third-party app first and a USB flash drive of 4GB or more.


    **STEP 1** First open up a web browser and go to www.rufus.akeo.ie/. Scroll down
    the page a little and you come to a Download heading, under which is the latest
    version of Rufus. Left click the link to start the download.


    ![](img/5019375da05cbf0090115165d80772a1_20_0.png)


    **STEP 2** Double-click the downloaded Rufus executable and click Yes to the Windows
    security question and Yes to checking for Updates. With Rufus launched it should
    have already identified your inserted USB flash drive; if not, just remove and
    reinsert.


    ![](img/5019375da05cbf0090115165d80772a1_20_1.png)


    **STEP 3** At first glance the Rufus interface can look a little confusing but
    don’t worry, it’s really quite simple. To begin with, click on the SELECT button
    next to the “Disk or ISO Image (Please select)” pull-down menu. This launches
    a Windows Explorer window where you can locate and select the Linux ISO.


    ![](img/5019375da05cbf0090115165d80772a1_20_2.png)


    **STEP 4** When you’re ready, click on the Start button at the bottom of the Rufus
    app. This may open up another dialogue box asking you to download and use a new
    version of SysLinux. SysLinux is a selection of boot loaders, used to allow a
    modern PC to access and boot from a USB flash drive. It is necessary, so if asked
    click on “Yes” to continue.


    > > This image uses Syslinux 6.03/20151222 but this application only includes
    the installation files for Syslinux 6.03/2014-10-06.

    > > \*\*\*


    As new versions of SysLinux are not compatible with one another, and it wouldn’t
    be possible for Rufus to include them all, two additional files must be downloaded
    from the Internet (“ldlinux.sys” and “ldlinux.bin”):


    - Select “Yes” to connect to the Internet and download these files

    - Select “No” to cancel the operation


    > > Note. The files will be downloaded to the current application directory and
    will be reused automatically if present.


    **STEP 5** The next step asks which image mode you want the Linux ISO to be written
    to the USB flash drive in. Both methods work for different situations but, generally,
    the recommended ISO Image Mode is the more popular. Make sure this mode is preselected
    and click Ok to continue, followed by Ok again to confirm the action.


    If the image you have selected is an ‘ISO9660’ image. This means it can be written
    either in ISO Image (file mode), copy mode or DD Image (disk image) mode. Rufus
    recommends using ISO Image mode, so that you always have full access to the drive
    after writing it. However, if you encounter issues during boot, you can try writing
    this image again in DD mode.


    Please select the mode that you want to use to write this image:

    - Write in ISO Image mode (Recommended)

    - Write in DD Image mode


    **STEP 6** The Linux transfer to the ISO is now transferred to the USB flash drive.
    The process shouldn’t take too long, again depending on the speed of the USB device
    and the PC. You may find Rufus auto-closes the USB drive in Windows Explorer during
    the process; don’t worry you can minimise or close it if you want. When the process
    is complete, click on the Close button.


    ![](img/5019375da05cbf0090115165d80772a1_20_3.png)'
  - '[PAGE 21]


    # Installing Linux on a PC


    Most Linux distros come as a *Live Environment*. This means you can boot into
    an actual, fully-working distro straight from the DVD or USB that you just created.
    Let’s see how that works and how you go about installing Linux from there.


    # UEFI BIOS


    The Unified Extensible Firmware Interface (UEFI) is used to identify hardware
    and protect a PC during its boot-up process. It replaces the traditional BIOS
    but can cause issues when installing Linux.


    **STEP 1**  Insert your DVD or USB flash drive into your PC and, if you haven’t
    already, shutdown Windows. In this instance we’re using the USB boot media but
    the process is virtually identical. Start the PC and when prompted press the appropriate
    keys to enter the BIOS or SETUP, which could for example be: F2, Del or even F12.


    ![](img/5019375da05cbf0090115165d80772a1_21_0.png)


    **STEP 3**  With UEFI turned to Legacy mode, there are now two ways of booting
    into the *Live Environment*. The first is via the BIOS you’re already in. Locate
    the Boot Sequence and change the first boot device from its original setting,
    usually internal HDD or similar, to: USB Storage Device for the USB media option,
    or DVD Drive for the DVD media option.


    ![](img/5019375da05cbf0090115165d80772a1_21_1.png)


    **STEP 2**  There are different versions of a UEFI BIOS, so covering them all
    would be impossible. What you’re looking for is a section that details the Boot
    Sequence or Boot Mode. Here you have the option to turn off UEFI and choose Legacy
    or Disable Secure Booting. Most distros work with UEFI but it can be a tricky
    process to enable it to boot.


    ![](img/5019375da05cbf0090115165d80772a1_21_2.png)


    **STEP 4**  Alternatively use the Boot Option Menu. With this option you can press
    F12 (or something similar) to display a list of boot media options; from there,
    you can choose the appropriate boot media. Either way, you can now Save and Exit
    the BIOS by navigating to the Save & Exit option and choosing ‘Save Changes and
    Exit’.


    ![](img/5019375da05cbf0090115165d80772a1_21_3.png)'
