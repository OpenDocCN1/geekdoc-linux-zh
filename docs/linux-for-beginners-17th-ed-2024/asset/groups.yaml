  mdcn: "\n# 命令行快速参考\n\n当你开始全职使用 Linux 时，你会很快意识到，Ubuntu、Mint 等系统的图形界面虽然适合许多任务，但并非适用于所有任务。了解如何使用命令行不仅能加深你对\
    \ Linux 的理解，还能提升你整体编程和代码编写的知识。我们的命令行快速参考指南旨在帮助你更快地掌握 Linux。\n\n### 十大常用命令\n\n\
    这些命令可能不是所有用户最常用的，但对于许多 Linux 和命令行用户来说，它们出现的频率 certainly 会非常高。\n\n- **cd** 命令是你在\
    \ Linux 命令行中最常使用的命令之一。它允许你更改当前工作目录。你用它来在文件系统层级中移动。你还可以使用 `cd` 移动到特定目录。\n- **mv**\
    \ 命令将文件移动到其他位置或重命名文件。例如，`mv file sub` 将原始文件重命名为 `sub`。`mv file ~/Desktop` 将文件\
    \ `file` 移动到你的桌面目录，但不会重命名它。你需要指定新的文件名才能重命名文件。\n- **ls** 命令显示当前目录中的文件。配合特定选项使用，它可以显示文件大小、文件创建时间和文件权限。例如，`ls\
    \ -l` 显示你主目录中的文件。\n- **chown** 命令更改每个给定文件的所有者和/或组所有权。如果仅指定所有者（用户名或数字用户 ID），则该用户将成为每个给定文件的所有者，而文件的组不会更改。\n\
    - **cp** 命令用于创建文件和目录的副本。例如，`cp file sub` 会创建一个与你输入名称的文件完全相同的副本，并将副本命名为 `sub`，但原始文件仍会以原名称存在。\n\
    - **chmod** 命令更改列表中文件的权限。权限基于一个相当简单的模型。你可以为用户、组和所有用户（world）设置权限，并设置他们是否可以读取、写入或执行该文件。\n\
    - **pwd** 命令打印当前工作目录的完整路径名（pwd 代表 \"print working directory\"）。请注意，GNOME 终端也在其窗口的标题栏中显示此信息。\n\
    - **rm** 命令删除（移除）文件或目录。删除过程会在文件系统中取消链接文件名，从而移除存储设备上的数据，并标记该空间可供未来写入使用。换句话说，删除文件会增加磁盘上的可用空间。\n\
    - **clear** 命令在可能的情况下清除你的屏幕。它会检查环境中的终端类型，然后在 terminfo 数据库中查找如何清除屏幕的方法。这等价于在使用\
    \ bash shell 时输入 Control-L。\n- \"make directory\" 的缩写，**mkdir** 用于在文件系统中创建目录。如果指定的目录尚不存在，`mkdir`\
    \ 将创建一个工作目录。调用 mkdir 时可以指定多个目录。\n\n![](img/5019375da05cbf0090115165d80772a1_80_0.png)\n\
    \n### 有用的帮助/信息命令\n\n当你在 Linux 中尝试了解有关你正在使用的系统或程序的更多详细信息时，以下命令非常有用。你可能不需要每天使用它们，但当你需要时，它们将\
    \ invaluable（极其宝贵）。\n\n- **free**：free 命令显示系统中已用和空闲的物理内存和交换内存的总量。例如，`free -m`\
    \ 使用兆字节显示信息。\n- **sed**：sed 命令打开一个流编辑器。流编辑器用于对输入流执行文本转换：文件或管道输入。\n- **df**：df\
    \ 命令显示所有分区的文件系统磁盘空间使用情况。命令 `df -h` 可能最有用（-h 表示人类可读格式）。\n- **adduser**：adduser\
    \ 命令向系统添加新用户。同样，addgroup 命令向系统添加新组。\n- **top**：top 程序提供运行系统的动态实时视图。它可以显示系统摘要信息，以及进程列表。\n\
    - **deluser**：deluser 命令从系统中移除用户。要移除用户的文件和主目录，你需要添加 `--remove-home` 选项。\n- **uname\
    \ -a**：带有 -a 选项的 uname 命令打印所有系统信息，包括机器名称、内核名称、版本和一些其他详细信息。\n- **delgroup**：delgroup\
    \ 命令从系统中移除组。你不能移除任何用户的主组。\n- **ps**：ps 命令允许你查看机器上运行的所有进程。每个操作系统版本的 ps 略有不同，但功能都相同。\n\
    - **man man**：man man 命令显示 man 命令的手册条目，这是使用 man 命令时的绝佳起点。\n- **grep**：grep 命令允许你在多个文件中搜索特定的搜索模式，然后打印匹配的行。例如：`grep\
    \ -R blah *file*`\n- **man intro**：man intro 命令特别有用。它显示用户命令的简介，这是对 Linux 命令行编写良好且相当简短的介绍。\n\
    \n### Linux 命令 A-Z\n\nLinux 命令有成千上万，因此虽然这不是一个完整的 A-Z 列表，但它包含了许多你最可能需要用到的命令。你可能会发现自己反复使用一组较小的命令，但拥有整体知识仍然非常有用。\n\
    \n- **A**\n  - **adduser**：添加新用户\n  - **arch**：打印机器架构\n  - **awk**：在文件内查找并替换文本\n\
    - **B**\n  - **bc**：任意精度计算器语言\n- **C**\n  - **cat**：连接文件并在标准输出上打印\n  - **chdir**：更改工作目录\n\
    \  - **chgrp**：更改文件组所有权\n  - **chroot**：更改根目录\n  - **cksum**：打印 CRC 校验和及字节数\n\
    \  - **cmp**：比较两个文件\n  - **comm**：逐行比较两个排序后的文件\n  - **cp**：将一个或多个文件复制到另一位置\n \
    \ - **crontab**：安排命令在稍后时间运行\n  - **csplit**：将文件分割为上下文确定的片段\n  - **cut**：将文件分成几个部分\n\
    \  - **date**：显示或更改日期和时间\n  - **dc**：桌面计算器\n  - **dd**：数据转储，转换并复制文件\n  - **diff**：显示两个文件之间的差异\n\
    \  - **dlrename**：将完整路径名转换为仅路径\n  - **du**：估算文件空间使用情况\n  - **echo**：在屏幕上显示消息\n\
    \  - **ed**：一种面向行的文本编辑器（edlin）\n  - **egrep**：在文件中搜索匹配扩展表达式的行\n  - **env**：显示、设置或删除环境变量\n\
    \  - **expand**：将制表符转换为空格\n  - **expr**：计算表达式\n  - **factor**：打印质因数\n  - **fdisk**：Linux\
    \ 分区表操作工具\n  - **fgrep**：在文件中搜索匹配固定字符串的行\n  - **find**：搜索满足特定标准的文件\n  - **fmt**：重新格式化段落文本\n\
    \  - **fold**：将文本换行以适应指定宽度\n  - **format**：格式化磁盘或磁带\n  - **fsck**：文件系统一致性检查和修复\n\
    - **G**\n  - **gawk**：在文件内查找并替换文本\n  - **grep**：在文件中搜索匹配给定模式的行\n  - **groups**：打印用户所属的组名\n\
    \  - **gzip**：压缩或解压命名文件\n- **H**\n  - **head**：输出文件的第一部分\n  - **hostname**：打印或设置系统名称\n\
    - **I**\n  - **id**：打印用户和组 ID\n  - **info**：帮助信息\n  - **install**：复制文件并设置属性\n\
    - **J**\n  - **join**：按共同字段连接行\n- **K**\n  - **kill**：停止进程运行\n- **L**\n  - **less**：每次显示一屏输出\n\
    \  - **ln**：在文件之间创建链接\n  - **locate**：查找文件\n  - **loginame**：打印当前登录名\n  - **lpc**：行式打印机控制程序\n\
    \  - **lpr**：离线打印\n  - **lprm**：从打印队列中移除作业\n- **M**\n  - **man**：查看帮助手册\n  - **mkdir**：创建新文件夹\n\
    \  - **mkfifo**：创建 FIFO（命名管道）\n  - **mknod**：创建块或字符特殊文件\n  - **more**：每次显示一屏输出\n\
    \  - **mount**：挂载文件系统\n- **N**\n  - **nice**：设置命令或作业的优先级\n  - **nl**：对行编号并写入文件\n\
    \  - **nohup**：运行不受挂断影响的命令\n- **P**\n  - **passwd**：修改用户密码\n  - **paste**：合并文件的行\n\
    \  - **pathchk**：检查文件名的可移植性\n  - **pr**：将文本文件转换为打印格式\n  - **printcap**：打印机能力数据库\n\
    \  - **printenv**：打印环境变量\n  - **printf**：格式化并打印数据\n- **Q**\n  - **quota**：显示磁盘使用量和限制\n\
    \  - **quotacheck**：扫描文件系统的磁盘使用情况\n  - **quotactl**：设置磁盘配额\n- **R**\n  - **ram**：RAM\
    \ 磁盘设备\n  - **rcp**：在两台机器之间复制文件\n  - **rm**：移除文件\n  - **rmdir**：移除文件夹\n  - **rpm**：移除包管理器（注：此处原文可能有误，RPM通常指Red\
    \ Hat Package Manager，保留原文翻译）\n  - **rsync**：移除文件副本（同步文件树）（注：此处原文可能有误，rsync通常指远程同步，保留原文翻译）\n\
    - **S**\n  - **screen**：终端窗口管理器\n  - **sdiff**：交互式合并两个文件\n  - **select**：接受键盘输入\n\
    \  - **seq**：打印数字序列\n  - **shutdown**：关机或重启 Linux\n  - **sleep**：延迟指定时间\n  - **sort**：排序文本文件\n\
    \  - **split**：将文件分割为固定大小的片段\n  - **su**：替代用户身份\n  - **sum**：为文件打印校验和\n  - **symlink**：为文件创建新名称\n\
    \  - **sync**：同步磁盘数据与内存\n- **T**\n  - **tac**：反向连接并写入文件\n  - **tail**：输出文件的最后部分\n\
    \  - **tar**：磁带归档器\n  - **tee**：将输出重定向到多个文件\n  - **test**：评估条件表达式\n  - **time**：测量程序资源使用\n\
    \  - **touch**：更改文件时间戳\n  - **top**：列出系统中运行的进程\n  - **traceroute**：跟踪到主机路由\n \
    \ - **tr**：翻译、挤压和/或删除字符\n  - **tsort**：拓扑排序\n- **U**\n  - **umount**：卸载设备\n  -\
    \ **unexpand**：将空格转换为制表符\n  - **uniq**：去重文件\n  - **units**：将单位从一个刻度转换为另一个刻度\n\
    \  - **unshar**：解包 shell 归档脚本\n  - **useradd**：创建新用户账户\n  - **usermod**：修改用户账户\n\
    \  - **users**：列出当前登录的用户\n- **V**\n  - **vd1r**：详细列出目录内容（1-8-0）（注：此命令较少见，保留原文翻译）\n\
    - **W**\n  - **watch**：定期执行或显示程序\n  - **wc**：打印字节、单词和行数\n  - **whereis**：报告命令的所有已知实例\n\
    \  - **which**：在用户路径中定位程序文件\n  - **who**：打印当前登录的所有用户名\n  - **whoami**：打印当前用户 ID\
    \ 和名称\n- **X**\n  - **xargs**：执行实用程序，传递构建的参数字符串\n- **Y**\n  - **yes**：打印字符串直到中断\n\
    \n![](img/5019375da05cbf0090115165d80772a1_82_0.png)\n\n![](img/5019375da05cbf0090115165d80772a1_82_1.png)\n"
