  mdcn: "\n## Linux 与大爆炸\n\n![](img/5019375da05cbf0090115165d80772a1_65_0.png)\n\n\
    > Linux 是碰撞粒子，因此我们可以理解宇宙的运行原理。\n\n## 你知道吗……\n\nLinux 位于大型强子对撞机（LHC）背后科学的核心。科学家、开发人员和工程师使用\
    \ Red Hat Linux 和 CentOS（一种基于 Red Hat 核心构建的超稳定发行版）的组合作为首选基础发行版，创建了 SL – 科学 Linux（Scientific\
    \ Linux）。\n\n以 SL 为基础，CERN 的聪明才智之士开发了多个他们自定义的 Linux 发行版本，以协助 LHC 的各个方面。其中最著名的是\
    \ SLC，即科学 Linux CERN（Scientific Linux CERN），也被称为 CERN6。据报道，有超过 36,000 个系统运行 SL，还有超过\
    \ 15,000 个系统运行 SLC。\n\n![](img/5019375da05cbf0090115165d80772a1_66_0.png)\n\n\
    ## 创建 Bash 脚本 – 第一部分\n\n随着你在 Linux Mint 上的不断进步，你将希望开始创建自己的自动化任务和程序。这些本质上是脚本。准确地说是\
    \ Bash Shell 脚本，它们的工作方式与 DOS 批处理文件或其他任何编程语言相同。\n\n### 开始脚本编写\n\nBash 脚本 simply\
    \ 是一组命令，Mint 将运行这些命令以完成特定任务。它们可以是简单的，也可以是极其复杂的，这取决于具体情况。\n\n**步骤 1** 在接下来的几页中，你将在终端和文本编辑器中工作。文本编辑器还有其他替代方案，我们稍后会查看，但为了方便起见，我们将使用\
    \ Xed 进行示例。不过，在开始之前，请运行常规的更新检查：`sudo apt-get update && sudo apt-get upgrade.`\n\
    \n![](img/5019375da05cbf0090115165d80772a1_67_0.png)\n\n**步骤 2** 我们可以使用几种文本编辑器来创建\
    \ Bash 脚本：Xed、Vi、Nano、Vim、GNU Emacs 等等。归根结底，这取决于个人喜好。我们使用 Xed 纯粹是为了让下方截图中的脚本更易读。\n\
    \n**步骤 3** 首先，在你开始编写任何脚本之前，你需要创建一个文件夹来存放所有脚本。从 `mkdir scripts` 开始，然后进入该文件夹 `cd\
    \ scripts/`。这将作为我们的工作文件夹，从这里你可以为每个创建的脚本创建子文件夹（如果你愿意的话）。\n\n![](img/5019375da05cbf0090115165d80772a1_67_1.png)\n\
    \n**步骤 4** Windows 用户应该知道，为了让批处理文件工作（即执行并遵循其中的编程逻辑），它需要拥有 .BAT 文件扩展名。Linux 是一个无扩展名的操作系统，但惯例是给脚本添加\
    \ .sh 扩展名。\n\n![](img/5019375da05cbf0090115165d80772a1_67_2.png)\n\n**步骤 5** 让我们从一个简单的脚本开始，将某些内容输出到终端。输入\
    \ `xed helloworld.sh`。这将启动 Xed 并创建一个名为 helloworld.sh 的文件。在 Xed 中输入以下内容：`#!/bin/bash`，然后在新的一行输入：`echo\
    \ Hello World!`。\n\n![](img/5019375da05cbf0090115165d80772a1_68_0.png)\n\n**步骤\
    \ 6** `#!/bin/bash` 这一行告诉系统将使用哪个 Shell，在本例中是 Bash。井号 (#) 表示注释行，系统会忽略该注释，感叹号 (!)\
    \ 意味着该注释被绕过，并将强制脚本将该行作为命令执行。这也称为 Hash-Bang（井号惊叹号）。\n\n![](img/5019375da05cbf0090115165d80772a1_68_2.png)\n\
    \n**步骤 7** 你可以保存此文件，点击 **文件 > 保存**，然后退出回到终端。输入 `ls`，将显示文件夹中的脚本。要使任何脚本可执行并能够运行，你需要修改其权限。使用\
    \ `chmod +x helloworld.sh` 来完成此操作。你需要对创建的每个脚本都这样做。\n\n![](img/5019375da05cbf0090115165d80772a1_68_4.png)\n\
    \n**步骤 8** 当你再次输入 `ls` 时，你可以看到 helloworld.sh 脚本的颜色从白色变成了绿色，这意味着它现在是一个可执行文件。要运行脚本，换句话说，让它执行你输入的内容，请输入：`./helloworld.sh`。\n\
    \n![](img/5019375da05cbf0090115165d80772a1_68_1.png)\n\n**步骤 9** 虽然这并不令人兴奋，但“Hello\
    \ World!”这几个字现在应该显示在终端中。`echo` 命令负责在终端中输出其后的文字，随着我们继续，你可以让 `echo` 命令输出到其他目标。\n\
    \n![](img/5019375da05cbf0090115165d80772a1_68_3.png)\n\n**步骤 10** 将 `echo` 想象成旧的\
    \ **BASIC** Print 命令。它显示文本、数字或存储在系统中的任何变量，例如当前系统日期。尝试这个例子：`echo Hello World! Today\
    \ is $(date +%A)`。`$(date +%A)` 调用了存储当前星期的系统变量。\n\n![](img/5019375da05cbf0090115165d80772a1_68_5.png)\n\
    \n## 创建 Bash 脚本 – 第二部分\n\n之前我们看了创建你的第一个 Bash 脚本 Hello World，并添加了一个系统变量。现在你可以扩展这些内容，看看当你开始与自己独特的变量玩耍时能做什么。\n\
    \n### 变量\n\n就像在所有其他编程语言中一样，Bash 脚本可以从系统中存储和调用某些变量，无论是通用的还是用户创建的。\n\n- **步骤 1**\n\
    \  让我们通过创建一个名为 hello.sh 的新脚本开始；`xed hello.sh.` 在其中输入：`#!/bin/bash`，然后，echo Hello\
    \ $1。保存文件并退出 Xed。回到终端，使用 `chmod +x hello.sh.` 使脚本可执行。\n\n![](img/5019375da05cbf0090115165d80772a1_69_0.png)\n\
    \n- **步骤 2**\n  既然脚本现在可执行，用 `./hello.sh.` 运行它。现在，正如你可能预期的那样，终端中显示了一个简单的 'Hello'。然而，如果你随后使用变量发出命令，情况开始变得有趣起来。例如，尝试\
    \ `./hello.sh David`。\n\n![](img/5019375da05cbf0090115165d80772a1_69_1.png)\n\n\
    - **步骤 3**\n  输出现在是 Hello David。这是因为 Bash 自动为用户分配变量，这些变量随后被保存并传递给脚本。所以变量 '$1'\
    \ 现在持有 ‘David’。你可以通过输入不同的内容来改变变量：`./hello.sh Mint`。\n\n![](img/5019375da05cbf0090115165d80772a1_69_2.png)\n\
    \n- **步骤 4**\n  你甚至可以重命名变量。用以下内容修改 hello.sh 脚本：`firstname=$1, surname=$2, echo\
    \ Hello $firstname $surname.` 将每条语句放在新的一行。保存脚本并退出回到终端。\n\n![](img/5019375da05cbf0090115165d80772a1_69_3.png)\n\
    \n- **步骤 5**\n  现在运行脚本时，你可以使用两个自定义变量 ..，/hello.sh David Hayward。当然，可以用你自己的名字改变这两个变量，除非你也叫\
    \ David Hayward。目前我们只是在打印内容，所以让我们稍微扩展一下两个变量的使用。\n\n![](img/5019375da05cbf0090115165d80772a1_70_0.png)\n\
    \n- **步骤 6**\n  创建一个名为 **addition.sh** 的新脚本，使用与 hello.sh 脚本相同的格式，但改变变量名称。这里我们添加了\
    \ **firstnumber** 和 **secondnumber**，并使用 echo 命令进行简单算术运算，通过放置一个整数表达式 **first**\
    \ **number**。 **echo The sum is $(($firstnumber+$secondnumber))**。保存脚本，并使其可执行（**chmod\
    \ +x addition.sh**）。\n\n![](img/5019375da05cbf0090115165d80772a1_70_1.png)\n\n\
    - **步骤 7**\n  现在运行 addition.sh 脚本时，我们可以输入两个数字： **./addition.sh 1 2**。结果希望是 3，终端将显示\
    \ **The sum is 3**。尝试几个不同的数字，看看会发生什么。也看看你是否可以修改脚本并将其重命名以执行乘法和减法。\n\n![](img/5019375da05cbf0090115165d80772a1_70_2.png)\n\
