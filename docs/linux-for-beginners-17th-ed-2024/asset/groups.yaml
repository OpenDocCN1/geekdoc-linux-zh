    安装到虚拟环境中是测试和使用 Linux 发行版的一种常用方法。Linux Mint 在虚拟环境中运行极其良好，但关于这一点我们稍后会更多讨论。市面上有许多不同的虚拟环境应用程序；然而，来自
    Oracle 的 VirtualBox 是最容易使用的一款。你可以在以下地址找到最新版本：www.virtualbox.org。


    ![](img/5019375da05cbf0090115165d80772a1_12_1.png)


    ### 网络连接


    不言而喻，互联网连接对于确保 Linux Mint 拥有最新更新和补丁，以及安装额外软件至关重要。虽然使用 Linux Mint 不需要互联网连接，但你将会错过该发行版可用的众多免费软件世界。


    ### MAC 硬件


    虽然 Linux Mint 可以安装在 Mac 上，但有一派观点建议 Mac 用户可以使用虚拟环境，如 VirtualBox 或 Parallels；何不为之呢，macOS
    本身就是一个出色的操作系统。如果你想让较旧的 Mac 焕发新生，请确保它是 Intel CPU 型号，而不是 PowerPC 型号。但要注意，它并不像安装到
    PC 上那样轻松。


