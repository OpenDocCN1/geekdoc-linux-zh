    if [ $firstname == 'David' ]\nthen\n  echo $firstname\n```\n```\n\n```\n```\n\
    $ mkdir scripts\n$ cd scripts\n$ nano greeting2.sh\n\n#!/bin/bash\n\necho -n 'Hello,\
