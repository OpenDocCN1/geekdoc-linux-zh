- pgno: 37
  md: '# # Creating Users


    When you first install Linux Mint it is configured for use with a single user.
    While sharing a user account with the entire family is fine, there may come a
    time when you need to create separate users with their own unique Home folders.


    # ## NEW USERS


    Having different users means each user has access to his or hers own areas on
    the system. Documents, pictures, videos and so on are separate, as with multiple
    users on other operating systems.


    **STEP 1** Click on the Linux Mint Menu and type ''users'' to begin searching
    for the relevant console. From the search results, choose Users and Groups and
    enter your password. The Users and Groups console is quite basic looking, and
    thankfully easy to use. At first, you can just see your own username from when
    you installed Linux Mint.


    ![](img/5019375da05cbf0090115165d80772a1_37_0.png)


    **STEP 2** To add a new user, click the Add button at the bottom of the console.
    There are two types of user you can create, Standard and Administrator. Unless
    the new user has need to install new apps or access parts of the file system beyond
    their Home folder, then opt for the Standard account type. Otherwise, use the
    Administrator account type.


    ![](img/5019375da05cbf0090115165d80772a1_37_1.png)


    **STEP 3** Enter the new user''s Full Name, followed by the Username they need
    when logging into Linux Mint. Make sure the username is all in lower case, a-z
    and 0-9 characters only. You can have full stops, underscores or hyphens if you
    wish. Click the Add button when you''re ready to continue.


    ![](img/5019375da05cbf0090115165d80772a1_37_2.png)


    **STEP 4** The new user appears in the list of current Linux Mint users, in alphabetical
    order. At present, there''s no password set so click the user in the list of current
    users, then click the No Password Set option under the user''s username.


    ![](img/5019375da05cbf0090115165d80772a1_37_3.png)'
  merge: -1
  img_proc: true
- pgno: 38
  md: '![](img/5019375da05cbf0090115165d80772a1_38_0.png)


    ![](img/5019375da05cbf0090115165d80772a1_38_1.png)


    ![](img/5019375da05cbf0090115165d80772a1_38_2.png)


    ![](img/5019375da05cbf0090115165d80772a1_38_3.png)


    ![](img/5019375da05cbf0090115165d80772a1_38_4.png)


    ![](img/5019375da05cbf0090115165d80772a1_38_5.png)


    # **STEP 5**  You can now enter a password for the new user or click the curled
    arrow at the end of the New Password text box to generate a password for you,
    as well as displaying it. Naturally, it''s a good idea to come up with as strong
    a password as possible. When you''re done, click the Change button.


    # **STEP 7**  Once logged in the new user is required to set up their own desktop
    wallpaper, icons, Panel, Menu and so on. Depending on what Account Type you set
    up for them, Standard or Administrator; they won''t be able to install any new
    apps. This screenshot is from a Standard user account type.


    # **STEP 6**  You can close the Users and Groups console window now, as the new
    user has been created. If you click the Mint Menu, followed by Logout, you are
    presented with the Mint Login Manager. The new user is now present in the list
    of currently available users. Click on him/her to log them in.


    # **STEP 8**  You can create as many new accounts as you need and you''re able
    to switch between them when required. It''s best to have just one account that''s
    capable of installing new software, that way you can keep track of what''s on
    your system.


    # ## COMMAND LINE ACCOUNTS

    Just as you''d expect, you can also create a new user within the command line.
    Open up a Terminal session under the main (yours) Administrator account.


    # **STEP 1**  The process for adding a new user from the command line is relatively
    simple. To begin with, type: `sudo adduser <username>`, where `<username>` is
    the new user''s login name. You''re then asked to create a new password for the
    user, along with their full name and other details. Click *y* to confirm the details
    and create the user account.


    # **STEP 2**  You can check the details and account type for the new user from
    within the Users and Groups console. If you want to delete a user from Mint, you
    can either enter `sudo deluser <username>` in the Terminal or click the Delete
    button in Users and Groups.'
