- pgno: 19
  md: "# # Creating a Linux Installer on Windows\n\nYou need to transfer the downloaded\
    \ Linux ISO to either a DVD or a USB key before being able to install it onto\
    \ a computer. This will be a live environment, which allows you to test the OS\
    \ prior to installation, but first you need to create the bootable media.\n\n\
    # ## DVD BOOTABLE MEDIA\n\nWe’re using a Windows 10 PC here to transfer the ISO\
    \ to a DVD. If you’re using a version of Windows from 7 onward the process is\
    \ extremely easy.\n\n+   **STEP 1**\n+   \n+   First locate the ISO image of Linux\
    \ you’ve already downloaded. You can usually find it in the Downloads folder in\
    \ Windows 7, 8, 1 and 10 computers, unless you specified a different location\
    \ when saving it.\n\n![](img/5019375da05cbf0090115165d80772a1_19_0.png)\n\n+ \
    \  **STEP 3**\n+   \n+   Right-click the Linux ISO and from the menu select Burn\
    \ Disc Image. Depending on the speed of the PC, it may take a few seconds before\
    \ anything happens. Don’t worry too much, unless it takes more than a minute,\
    \ in which case it might be worth restarting your PC and trying again. With luck,\
    \ the Windows Disc Image Burner should launch.\n\n![](img/5019375da05cbf0090115165d80772a1_19_1.png)\n\
    \n+   **STEP 2**\n+   \n+   Next insert a recordable DVD disc into your computer’s\
    \ optical drive. After a few seconds, while the disc is read, Windows displays\
    \ a pop-up message asking you what to do with the newly inserted disc. Ignore\
    \ this, as we’re going to use the built-in image burning function.\n\n![](img/5019375da05cbf0090115165d80772a1_19_2.png)\n\
    \n+   **STEP 4**\n+   \n+   With the Windows Disc Image Burner dialogue box open,\
    \ click on the 'Verify disc after burning' tick box, then the Burn button. The\
    \ process should take a few minutes, depending on the speed of your PC’s optical\
    \ drive. Once it’s complete it runs through the verification stage and when done\
    \ the optical drive should auto-eject the disc for you.\n\n![](img/5019375da05cbf0090115165d80772a1_19_3.png)"
