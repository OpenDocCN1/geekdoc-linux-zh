- pgno: 33
  md: '# 10 Things to do After Installing Linux Mint


    Linux Mint is a polished distro out of the box but, as with most Linux distros,
    there are some tweaks that can be applied to improve the way it works. Although
    these are Mint-specific tweaks, most can be applied to other distros.


    # LINUX TWEAKS


    Some of these post-installation actions are highly recommended, while others are
    just handy additions and simply tweak the system or add a customisation.


    # STEP 1


    The first, and most important, post-installation action is to update the system.
    Click on the shield icon in the Panel, found at the bottom right of the desktop
    next to the time and date. This launches the Update Manager.


    ![](img/5019375da05cbf0090115165d80772a1_33_0.png)


    # STEP 3


    Click the OK button and you can see a couple of updates ready for installation.
    Before you update though, click on the blue bar OK button to switch to a Local
    Mirror. This opens the Software Sources option. In the Mirrors section, click
    on the Main and Base drop-down menus and select a server closest to your current
    location.


    ![](img/5019375da05cbf0090115165d80772a1_33_1.png)


    # STEP 2


    Linux Mint offers the user a three level policy approach to updates: Don''t Break
    My Computer, Optimise Stability and Security and Always Update Everything. The
    recommended option is the Optimise Stability and Security, which only updates
    safe, essential patches that won''t impact critical elements of the core OS. Read
    through the descriptions but choose the middle, and recommended option.


    ![](img/5019375da05cbf0090115165d80772a1_33_2.png)


    # STEP 4


    Click the Update the Cache button and close the Software Sources window. Back
    in the Update Manager, click on the Install Updates icon and enter your password.
    The updates automatically apply themselves and relaunch Update Manager; this time
    with a lot more options. Again, click Install Updates, Ok any messages, and wait
    for them to finish.


    ![](img/5019375da05cbf0090115165d80772a1_33_3.png)'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# 10 Things to do After Installing Linux Mint


    # STEP 5


    The updates are graded by level, 1 being a low to level 3 updates, level 5 being
    a dangerous one. Stick to level 3 updates, if you configure and click Replace
    for any messages regarding overriding a configuration file. With regards to the
    Sofware Rendering issue and lack of drivers for non-VirtualBox users, click the
    Menu and type ‘driver’ into the search box.


    ![](img/5019375da05cbf0090115165d80772a1_34_0.png)


    # STEP 8


    When asked to accept the changes, enter Y and also when asked to configure lsbvd.
    Make sure Ok is highlighted and press Enter, then Yes to any further questions.
    Next up, still in the terminal, enter: `cat /proc/sys/`vm`/swappiness`; the result
    should be 60. If your computer has less than 4GB of RAM/ memory, then enter: `gksudo
    xed /etc/sysctl` conf.


    ![](img/5019375da05cbf0090115165d80772a1_34_1.png)


    # STEP 6


    Click the Driver Manager app that appears as a result of the search and enter
    your password. Mint takes a moment to analyse what’s available and presents you
    with a selection of potential drivers based on your detected hardware. Those with
    graphical problems, such as Sofware Rendering, should opt to use the latest, recommended
    Graphics driver.


    ![](img/5019375da05cbf0090115165d80772a1_34_2.png)


    # STEP 9


    This tweak helps speed up systems with less than 4GB RAM/memory. Scroll down to
    the bottom of the file you just opened and add the following new lines:


    `# Decrease swap usage to a more reasonable level`


    `vm.swapiness=10`


    Click File > Save, then File > Quit. Reboot Linux Mint and you should notice a
    slight hike in performance.


    ![](img/5019375da05cbf0090115165d80772a1_34_3.png)


    # STEP 7


    At this point you’ll probably need to restart Linux Mint, so do that now. After
    a reboot click the Menu button again, followed by the Terminal. The Terminal icon
    is found in the left-hand column, above the Files icon. With the Terminal open,
    enter: `sudo apt-get install libdvd-pkg` press Enter and type in your password.
    This enables encrypted DVD playback.


    ![](img/5019375da05cbf0090115165d80772a1_34_4.png)


    # STEP 10


    Security is always a concern in this modern digital age. While Linux Mint is a
    secure system, it’s advisable to always try and improve it. Click the Menu button
    and search for Firewall; click the Firewall Configuration icon and enter your
    password. In the Firewall window, click the Status slider to On.


    ![](img/5019375da05cbf0090115165d80772a1_34_5.png)'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# # Apollo 11


    **DID YOU KNOW…** July 20th 1969 is remembered as a turning point in human history,
    when mankind first stepped on the moon. The software that helped the crew make
    that pivotal voyage didn’t even exist at the time and had to be developed from
    scratch. Using a new method of storing programs called Rope Memory, the engineers
    at MIT Instrumentation Laboratory populated the memory with a special version
    of assembly.


    Incredibly, that code is freely available to view on GitHub. Uploaded by a researcher
    in 2003, you can view the code by visiting www.github.com/Chai2010/aag/Apollo-11.
    Look out for code snippets, such as Burn_Baby_Burn, in particular line 925 with
    the comment "Goodbye. Come again soon."


    Have a look through, and see what else you can find.


