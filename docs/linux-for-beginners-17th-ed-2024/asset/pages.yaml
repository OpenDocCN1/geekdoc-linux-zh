    ![](img/5019375da05cbf0090115165d80772a1_70_3.png)


    STEP 9  We’ve added a **–n** to the echo command here which will leave the cursor
    on the same line as the question. Instead of a new line. The **read** command
    stores the users’ input as the variables **firstname** and **surname**, so then
    read back later in the last **echo** line. And the **clear** command clears the
    screen.


