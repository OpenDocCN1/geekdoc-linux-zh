- pgno: 29
  md: '# Getting to Know Linux


    # Introduction to the

    Cinnamon Menu


    Now that you have Linux installed it’s time to have a good look around. First
    though, if you’re using Virtualbox you’ll have a notification regarding Software
    Rendering; here’s how to fix it.


    # CINNAMON VIRTUALBOX FIX


    You’ve already looked at some list functions, using .insert, .remove, and .pop
    but there are also functions that can be applied to strings.


    # STEP 1


    Before we begin, we’re assuming you’re having this issue within Virtualbox. The
    Software Rendering message appears in the top right of the desktop. To fix this,
    click on Devices in the Virtualbox window, followed by Insert Guest Additions
    CD image.


    ![](img/5019375da05cbf0090115165d80772a1_29_0.png)


    # STEP 3


    After a moment or two you’re automatically dropped into a command line view, called
    the Terminal in Linux. This details the installation of the new VirtualBox drivers,
    removing any old drivers it has detected, and installing the latest versions.
    It won’t take long and when it’s done you will be asked to hit Return to exit
    the Terminal.


    ![](img/5019375da05cbf0090115165d80772a1_29_1.png)


    # STEP 2


    The Guest Additions CD contains drivers for Virtualbox, including the virtual
    video hardware. When it’s loaded in, you get a “software needs running” notification
    box with two options, Cancel and Run. Click the Run button and enter your Linux
    user password.


    # The Virtualbox Additions CD icon is on the desktop, so right-click it and then
    scroll icon the menu to click Eject. You can now restart Linux Mint by clicking
    the Menu, the bottom icon in the strip to the left, then the Restart button. This
    reboots Mint and the problem is fixed.


    ![](img/5019375da05cbf0090115165d80772a1_29_2.png)


    The Virtualbox Additions CD icon is on the desktop, so right-click it and then
    scroll icon the menu to click Eject. You can now restart Linux Mint by clicking
    the Menu, the bottom icon in the strip to the left, then the Restart button. This
    reboots Mint and the problem is fixed.


    ![](img/5019375da05cbf0090115165d80772a1_29_3.png)'
