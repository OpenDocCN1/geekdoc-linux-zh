- pgno: 82
  md: '# A-Z of Linux Commands


    ![](img/5019375da05cbf0090115165d80772a1_82_0.png)


    +   1.  **L**

    +       *   **loginame** Print current login name

    +       *   **lpc** Line printer control program

    +       *   **lpr** Off line print

    +       *   **lp rm** Remove jobs from the print queue

    +   2.  **M**

    +       *   **man** See Help manual

    +       *   **mkdir** Create new folder(s)

    +       *   **mkfifo** Make FIFOs (named pipes)

    +       *   **mknod** Make block or character special files

    +       *   **more** Display output one screen at a time

    +       *   **mount** Mount a file system

    +   3.  **N**

    +       *   **nice** Set the priority of a command or job

    +       *   **nl** Number lines and write files

    +       *   **nohup** Run a command immune to hangups

    +   4.  **P**

    +       *   **passwd** Modify a user password

    +       *   **paste** Merge lines of files

    +       *   **pathchk** Check file name portability

    +       *   **pr** Convert text files for printing

    +       *   **printcap** Printer capability database

    +       *   **printenv** Print environment variables

    +       *   **printf** Format and print data

    +   5.  **Q**

    +       *   **quota** Display disk usage and limits

    +       *   **quotacheck** Scan a file system for disk usage

    +       *   **quotactl** Set disk quotas

    +   6.  **R**

    +       *   **ram** Ram disk device

    +       *   **rcp** Copy files between two machines

    +       *   **rm** Remove files

    +       *   **rmdir** Remove folder(s)

    +       *   **rpm** Remove Package Manager

    +       *   **rsync** Remove file copy (synchronous file trees)

    +   7.  **S**

    +       *   **screen** Terminal window manager

    +       *   **sdiff** Merge two files interactively

    +       *   **select** Accept keyboard input

    +       *   **seq** Print numeric sequences

    +       *   **shutdown** Shutdown or restart linux

    +       *   **sleep** Delay for a specified time

    +       *   **sort** Sort text files

    +       *   **split** Split a file into fixed-size pieces

    +       *   **su** Substitute user identity

    +       *   **sum** Print a checksum for a file

    +       *   **symlink** Make a new name for a file

    +       *   **sync** Synchronise data on disk with memory

    +   8.  **T**

    +       *   **tac** Concatenate and write files in reverse

    +       *   **tail** Output the last part of files

    +       *   **tar** Tape Archiver

    +       *   **tee** Redirect OUTPUT to multiple files

    +       *   **test** Evaluate a conditional expression

    +       *   **time** Measure Program Resource Use

    +       *   **touch** Change file timestamps

    +       *   **top** List processes running on the system

    +       *   **traceroute** Trace Route to Host

    +       *   **tr** Translate, squeeze and/or delete characters

    +       *   **tsort** Topological sort

    +   9.  **U**

    +       *   **umount** Unmount a device

    +       *   **unexpand** Convert spaces to tabs

    +       *   **uniq** Uniquify files

    +       *   **units** Convert units from one scale to another

    +       *   **unshar** Unpack shell archive scripts

    +       *   **useradd** Create new user account

    +       *   **usermod** Modify user account

    +       *   **users** List users currently logged in

    +   10. **V**

    +       *   **vd1r** Verbosely list directory contents (1-8-0)

    +   11. **W**

    +       *   **watch** Execute or display a program periodically

    +       *   **wc** Print byte, word, and line counts

    +       *   **whereis** Report all known instances of a command

    +       *   **which** Locate a program file in the user''s path

    +       *   **who** Print all usernames currently logged in

    +       *   **whoami** Print the current user id and name

    +   12. **X**

    +       *   **xargs** Execute utility, passing constructed argument list(s)

    +   13. **Y**

    +       *   **yes** Print a string until interrupted


    ![](img/5019375da05cbf0090115165d80772a1_82_1.png)'
