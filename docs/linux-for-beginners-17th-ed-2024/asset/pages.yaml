- pgno: 74
  md: '# CREATING A BACKUP TASK SCRIPT


    One of the most well used examples of Bash scripting is the creation of a backup
    routine, one that automates the task as well as adding some customisations along
    the way.


    # STEP 1


    A very basic backup script would look something along the lines of `#!/bin/bash`,
    then, `tar cvfz ~/backups/my-backup.tgz ~/Documents/`. This will create a compressed
    file backup of the `~/Documents` folder, with everything in it, and put it in
    a folder called `~/backups` with the name `my-backup.tgz`.


    ![](img/5019375da05cbf0090115165d80772a1_74_0.png)


    # STEP 4


    Once the `~/backups` folder is created, we can now create a new subfolder within
    it based on the Time Stamp variables we set up at the beginning. Add `mkdir -p
    $dest/''"$day $month $year"''`. It’s in here that you can put the backup file
    relevant to that day/month/year.


    ![](img/5019375da05cbf0090115165d80772a1_74_1.png)


    # STEP 2


    While perfectly fine, we can make the simple script a lot more interactive. Let’s
    begin with defining some variables. Enter the text in the screenshot into a new
    backup. sh script. Notice that we’ve misspelt ‘source’ as ‘sauce’, this is because
    there’s already a built-in command called ‘source’ hence the different spelling
    on our part.


    ![](img/5019375da05cbf0090115165d80772a1_74_2.png)


    # STEP 5


    With everything in place, you can now enter the actual backup routine, based on
    the `tar` command from Step 5. Combined with the variables, you have: `tar cvfz
    $dest/''"$day $month $year"''/Documents`Backup.tgz $sauce. In the screenshot,
    we added a handy ‘Now backing up...’ echo command.


    ![](img/5019375da05cbf0090115165d80772a1_74_3.png)


    # STEP 3


    The previous script entries allowed you to create a Time Stamp, so you know when
    the backup was taken. You also created a ‘dest’ variable, which is the folder
    where the backup file will be created (~/backups). You can now add a section of
    code to first check if the `~/backups` folder exits, if not, then it creates one.


    ![](img/5019375da05cbf0090115165d80772a1_74_4.png)


    # STEP 6


    Finally, you can add a friendly message: `echo "Backup complete. All done..."`.
    The completed script isn’t too over-complex and it can be easily customised to
    include any folder within your Home area, as well as the entire Home area itself.


    ![](img/5019375da05cbf0090115165d80772a1_74_5.png)'
  merge: -1
  img_proc: true
- pgno: 75
  md: "# # Creating Bash Scripts – Part 5\n\nThe backup script we looked at previously\
    \ can be further amended to incorporate choices, user-interaction with regards\
    \ to where the backup file will be copied to and so on. Automating tasks is one\
    \ of the main benefits of Bash scripting, a simple script can help you out in\
    \ many ways.\n\n# ## EASY AUTOMATION AND HANDY SCRIPTS\n\nEntering line after\
    \ line of commands to retrieve system information, find a file or rename a batch\
    \ of files? A script is a better answer.\n\n**STEP 1**  Let's start by creating\
    \ a script to help display the Mint system information; always a handy thing to\
    \ have. Create a new script called **sysinfo.sh** and enter the following into\
    \ Xed, or the text editor of your choice.\n\n```\n```\nsysinfo.sh\n\n#!/bin/bash\n\
    \n#  Dishtn system information\necho \" $(dpkg -l | grep linux-generic | tail\
    \ -n 1 | awk '{print $2}')\"\nlsb_release -a\n\necho\necho \"File system disk\
    \ space usage:\"\ndf -h\n\necho\necho \"Free and used memory:\"\nfree -m\n\necho\n\
    echo \"System uptime and performance load:\"\nuptime\n\necho\necho \"Users currently\
    \ logged in:\"\nwho\n\necho\necho \"Top five processes being used by the system:\"\
    \nps aux | egrep -e \"sshd\" -e \"sudo\" -e \"sh\" -e \"bash\" -e \"systemd\"\
    \ --sort=-%cpu | head -n 6\n\necho -n \"  \",\n\necho -n \"  \",\n```\n\n```\n\
    \n**STEP 3**  Each of the sections runs a different Terminal command, outputting\
    \ the results under the appropriate heading. You can include a lot more, such\
    \ as the current aliases being used in the system, the current time and date and\
    \ so on. Plus, you could also pipe all that information into a handy HTML file,\
    \ ready to be viewed in a browser.\n\n```\n```bash\ndavid@david-mint:~/scripts\
    \ $\n$ sh sysinfo.sh > ~/sysinfo.html\ndavid@david-mint:~/scripts $\n```\n\n```\n\
    \n**STEP 2**  We've included a couple of extra commands in this script. The first\
    \ is the **-e** extension for **echo**, this means it'll enable **echo** interpretation\
    \ of additional instances of a new line, as well as other special characters.\
    \ The preceding **'31;43m'** element enables colour for foreground and background.\n\
    \n```\n```bash\ndavid@david-mint:~/scripts $ ./sysinfo.sh\n\nStatic Hostname:\
    \ david-mint\nIcon name: computer-vm\nChassis: vm\nMachine ID: 5ab3c275b7304ad3b8aee9f6fcc37eb4\n\
    Boot ID: 8ccb1bafd934f409c8ac5009aeb7e18\nVirtualization: oracle\nOperating System:\
    \ Linux Mint 18.1\nKernel: Linux 4.4.0-53-generic\nArchitecture: x86 64\n```\n\
    \n```\n\n**STEP 4**  Although there are simple Terminal commands to help you look\
    \ for a particular file or folder, it's often more fun to create a script to help\
    \ you. Plus, you can use that script for other non-technical users. Create a new\
    \ script called **look4.sh**, entering the content from the screenshot below.\n\
    \n```\n```bash\nlook4.sh\n\n#!/bin/bash\ntarget=~/\nread name\n\noutput=$(find\
    \ $target -iname \"*$name*\" -d 2>/dev/null |)\nif [ [ -e \"$output\" ]; then\n\
    \    echo \"found\"\nelse\n    echo \"match found\"\nfi\n```\n\n```"
