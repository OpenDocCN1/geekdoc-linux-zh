- pgno: 20
  md: '# # Creating a Linux Installer on Windows


    # ## USB BOOTABLE MEDIA


    USB media is faster than a DVD and often more convenient, as most modern PCs don’t
    have an optical drive installed. The process of transferring the image is easy
    but you need a third-party app first and a USB flash drive of 4GB or more.


    **STEP 1** First open up a web browser and go to www.rufus.akeo.ie/. Scroll down
    the page a little and you come to a Download heading, under which is the latest
    version of Rufus. Left click the link to start the download.


    ![](img/5019375da05cbf0090115165d80772a1_20_0.png)


    **STEP 2** Double-click the downloaded Rufus executable and click Yes to the Windows
    security question and Yes to checking for Updates. With Rufus launched it should
    have already identified your inserted USB flash drive; if not, just remove and
    reinsert.


    ![](img/5019375da05cbf0090115165d80772a1_20_1.png)


    **STEP 3** At first glance the Rufus interface can look a little confusing but
    don’t worry, it’s really quite simple. To begin with, click on the SELECT button
    next to the “Disk or ISO Image (Please select)” pull-down menu. This launches
    a Windows Explorer window where you can locate and select the Linux ISO.


    ![](img/5019375da05cbf0090115165d80772a1_20_2.png)


    **STEP 4** When you’re ready, click on the Start button at the bottom of the Rufus
    app. This may open up another dialogue box asking you to download and use a new
    version of SysLinux. SysLinux is a selection of boot loaders, used to allow a
    modern PC to access and boot from a USB flash drive. It is necessary, so if asked
    click on “Yes” to continue.


    > > This image uses Syslinux 6.03/20151222 but this application only includes
    the installation files for Syslinux 6.03/2014-10-06.

    > > \*\*\*


    As new versions of SysLinux are not compatible with one another, and it wouldn’t
    be possible for Rufus to include them all, two additional files must be downloaded
    from the Internet (“ldlinux.sys” and “ldlinux.bin”):


    - Select “Yes” to connect to the Internet and download these files

    - Select “No” to cancel the operation


    > > Note. The files will be downloaded to the current application directory and
    will be reused automatically if present.


    **STEP 5** The next step asks which image mode you want the Linux ISO to be written
    to the USB flash drive in. Both methods work for different situations but, generally,
    the recommended ISO Image Mode is the more popular. Make sure this mode is preselected
    and click Ok to continue, followed by Ok again to confirm the action.


    If the image you have selected is an ‘ISO9660’ image. This means it can be written
    either in ISO Image (file mode), copy mode or DD Image (disk image) mode. Rufus
    recommends using ISO Image mode, so that you always have full access to the drive
    after writing it. However, if you encounter issues during boot, you can try writing
    this image again in DD mode.


    Please select the mode that you want to use to write this image:

    - Write in ISO Image mode (Recommended)

    - Write in DD Image mode


    **STEP 6** The Linux transfer to the ISO is now transferred to the USB flash drive.
    The process shouldn’t take too long, again depending on the speed of the USB device
    and the PC. You may find Rufus auto-closes the USB drive in Windows Explorer during
    the process; don’t worry you can minimise or close it if you want. When the process
    is complete, click on the Close button.


    ![](img/5019375da05cbf0090115165d80772a1_20_3.png)'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Installing Linux on a PC


    Most Linux distros come as a *Live Environment*. This means you can boot into
    an actual, fully-working distro straight from the DVD or USB that you just created.
    Let’s see how that works and how you go about installing Linux from there.


    # UEFI BIOS


    The Unified Extensible Firmware Interface (UEFI) is used to identify hardware
    and protect a PC during its boot-up process. It replaces the traditional BIOS
    but can cause issues when installing Linux.


    **STEP 1**  Insert your DVD or USB flash drive into your PC and, if you haven’t
    already, shutdown Windows. In this instance we’re using the USB boot media but
    the process is virtually identical. Start the PC and when prompted press the appropriate
    keys to enter the BIOS or SETUP, which could for example be: F2, Del or even F12.


    ![](img/5019375da05cbf0090115165d80772a1_21_0.png)


    **STEP 3**  With UEFI turned to Legacy mode, there are now two ways of booting
    into the *Live Environment*. The first is via the BIOS you’re already in. Locate
    the Boot Sequence and change the first boot device from its original setting,
    usually internal HDD or similar, to: USB Storage Device for the USB media option,
    or DVD Drive for the DVD media option.


    ![](img/5019375da05cbf0090115165d80772a1_21_1.png)


    **STEP 2**  There are different versions of a UEFI BIOS, so covering them all
    would be impossible. What you’re looking for is a section that details the Boot
    Sequence or Boot Mode. Here you have the option to turn off UEFI and choose Legacy
    or Disable Secure Booting. Most distros work with UEFI but it can be a tricky
    process to enable it to boot.


    ![](img/5019375da05cbf0090115165d80772a1_21_2.png)


    **STEP 4**  Alternatively use the Boot Option Menu. With this option you can press
    F12 (or something similar) to display a list of boot media options; from there,
    you can choose the appropriate boot media. Either way, you can now Save and Exit
    the BIOS by navigating to the Save & Exit option and choosing ‘Save Changes and
    Exit’.


    ![](img/5019375da05cbf0090115165d80772a1_21_3.png)'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# INSTALLING LINUX


    Once the Live Environment has booted, you see the option to install the distro
    to your computer. Have a look around and when you’re ready, look for the Install
    option on the desktop.


    **STEP 1** Providing you’re connected to the internet (if not, then do so now)
    and you’re in the Live Environment, start the installation process by double-clicking
    on the Install Linux Mint icon on the desktop. Other distros display their own
    name, of course, but the process is the same. Click **Continue** when you’re ready.


    ![](img/5019375da05cbf0090115165d80772a1_22_0.png)


    **STEP 4** Before the installation process begins, you’re asked if the choice
    you made regarding the erasure of the hard drive is correct. This is your last
    chance to back off. If you’re certain you don’t mind wiping everything and starting
    again with Linux Mint, click **Continue**. If you need to backup your files remove
    the Linux disc/USB, reboot, backup and start again.


    ![](img/5019375da05cbf0090115165d80772a1_22_1.png)


    **STEP 2** While the installation process is very similar across most Linux distros,
    some offer different questions during the installation. Generally, the questions
    aren’t too difficult, nothing very technical, but some such as ‘Installing third-party
    software…’ can be confusing. In this case you can click **Continue** but if you’re
    unsure, have an Internet-connected device available to ask any questions.


    ![](img/5019375da05cbf0090115165d80772a1_22_2.png)


    **STEP 5** Eventually you are asked to set up your Linux username and password.
    Enter your Name to begin with, then the Computer Name, which is the name it is
    identified on the network as. Next choose a Username, followed by a good Password.
    You can tick the Login Automatically option but leave the Encrypt Home Folder
    option for now.


    ![](img/5019375da05cbf0090115165d80772a1_22_3.png)


    **STEP 3** When installing a new operating system it’s recommended that you wipe
    the old OS, replacing it with the new. When you reach this stage of the installation
    process, ensure the ‘Erase disk and install Linux…’ option is selected. **NOTE:**
    This completely wipes Windows 10 from your computer, so make sure you have backups
    of all your personal files and data.


    ![](img/5019375da05cbf0090115165d80772a1_22_4.png)


    **STEP 6** The installation process can be quick, and there may be more questions
    to answer, or it may simply start installing Linux based on your previous answers.
    Either way, you end up being asked to **Continue Testing the Live Environment**
    or **Restarting** to use the newly installed OS. If you’re ready to use Linux,
    then click **Restart** Now.


    ![](img/5019375da05cbf0090115165d80772a1_22_5.png)'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Installing a Virtual

    Environment


    A Virtual Environment is a simulated computer system. Using a Virtual Machine,
    you can mimic a standard PC and install an entire operating system to it without
    affecting the one installed on your computer. It’s a great way to test and use
    Linux, while still having Windows 10 as your main OS.


    # GOING VIRTUAL


    Using a Virtual Machine (VM) takes resources from your computer: memory, hard
    drive space, processor usage and so on. Make sure you have enough of each before
    commencing.


    # STEP 1


    We’re using VirtualBox in this instance, as it’s one of the easiest virtual environments
    to get to grips with. Enter www.virtualbox.org and click on ‘Download VirtualBox’.
    This takes you to the main download page. Locate the correct host for your system:
    Windows or Mac, the Host being the current installed operating system, and click
    the link to begin the download.


    ![](img/5019375da05cbf0090115165d80772a1_23_0.png)


    # STEP 2


    Next, while still at the VirtualBox download page, locate the VirtualBox Extension
    Pack link. The Extension Pack supports USB devices as well as numerous other extras
    that can help make the VM environment a more accurate emulation of a ‘real’ computer.


    ![](img/5019375da05cbf0090115165d80772a1_23_1.png)


    # STEP 3


    With the correct packages downloaded, and before you install anything, you need
    to make sure that the computer you’re using is able to host a VM. To do this,
    reboot the computer and enter the BIOS. When the computer starts up, press the
    Del, F2 or whichever key is necessary to Enter Setup.


    ![](img/5019375da05cbf0090115165d80772a1_23_2.png)


    # STEP 4


    Each BIOS is laid out differently and it’s very difficult to assess where to look
    in each personal example. However, as a general rule of thumb, you’re looking
    for Intel Virtualisation Technology, or simply Virtualisation, found usually within
    the Advanced section of the BIOS. When you’ve located it, Enable it, save the
    settings, exit the BIOS and reboot the computer.


    ![](img/5019375da05cbf0090115165d80772a1_23_3.png)'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Installing a Virtual Environment


    **STEP 5**  With the computer back up and running, locate the downloaded main
    VirtualBox application and double-click to begin the installation process. Click
    Next to continue, when you’re ready.


    ![](img/5019375da05cbf0090115165d80772a1_24_0.png)


    **STEP 6**  The default installation location of VirtualBox should satisfy most
    users but if you have any special location requirements click on the ‘Browse’
    button and change the install folder. Then, make sure that all the icons in the
    VirtualBox feature tree are selected, i.e. none of them have a red X next to them.
    Click Next to move on.


    ![](img/5019375da05cbf0090115165d80772a1_24_1.png)


    **STEP 7**  This section can be left alone to the defaults, should you wish. You
    simply makes life a little easier when dealing with VMs, especially when dealing
    with downloaded VMs, which you may encounter in the future. Again, clicking Next
    moves you on to the next stage.


    ![](img/5019375da05cbf0090115165d80772a1_24_2.png)


    **STEP 8**  When installing VirtualBox your network connection is disabled for
    a very brief period. This is due to VirtualBox creating a linked, virtual network
    connection so that any VM installed is able to access the internet; and your home
    network resources; via the computer’s already established network connection.
    Click Yes, then Install to begin the installation.


    ![](img/5019375da05cbf0090115165d80772a1_24_3.png)


    **STEP 9**  You’ll probably be asked by Windows to accept a security notification.
    Click Yes for this and you may encounter a dialogue box asking you to trust the
    installation from Oracle; again, click yes and accept the installation of the
    VirtualBox application. When it’s complete, click finish to start VirtualBox.


    ![](img/5019375da05cbf0090115165d80772a1_24_4.png)


    **STEP 10**  With VirtualBox up and running you can now install the VirtualBox
    Extension Pack. Locate the downloaded add-on and double-click. There may be a
    short pause while VirtualBox analyses the pack but you eventually receive a message
    to install it; obviously click Install to begin the process, scroll down the next
    screen to accept the agreement and click I Agree.


    ![](img/5019375da05cbf0090115165d80772a1_24_5.png)'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Installing Linux in a Virtual Environment


    With Oracle’s VirtualBox now up and running, the next task is to create the Virtual
    Machine (VM) environment into which you will install Linux. This process won’t
    affect your currently installed operating system, which is why a VM is a great
    choice.


    # CREATING THE VM


    There are plenty of options to choose from when creating a VM. For now though,
    we’ll setup a VM adequate to run the excellent Linux Mint, and perform well.


    +   **STEP 1**

    +   With VirtualBox open, click on the New icon in the top-middle of the right-hand
    panel of the app. This will open the new VM Wizard.


    ![](img/5019375da05cbf0090115165d80772a1_25_0.png)


    +   **STEP 3**

    +   The next section will define the amount of system memory, or RAM, the VM has
    allocated. Remember this amount will be taken from the available memory installed
    in your computer, so don’t give the VM too much. For example, we have 8GB of memory
    installed and we’re giving 2GB (2048MB) to the VM. When you’re ready, click Next
    to continue.


    ![](img/5019375da05cbf0090115165d80772a1_25_1.png)


    +   **STEP 2**

    +   In the box next to Name type Linux Mint, and VirtualBox should automatically
    choose Linux as the Type and Ubuntu (64-bit) as the Version, if not then use the
    drop-down boxes to select the correct settings (remember Mint’s mainstream is
    based on Ubuntu). Click Next when you’re ready to proceed.


    ![](img/5019375da05cbf0090115165d80772a1_25_2.png)


    +   **STEP 4**

    +   This section is where you’ll start to create the virtual hard disk that the
    VM will use to install Mint on to. The default option, ‘Create a virtual hard
    disk now’, is the one we’re using. Click Create to move on.


    ![](img/5019375da05cbf0090115165d80772a1_25_3.png)'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Installing Linux in a Virtual Environment


    **STEP 5** The pop-up window that appears after clicking Create is asking you
    what type of virtual hard disk you want to create. We''re going to use the default
    VDI (VirtualBox Disk Image) in this case, as the others are often used to move
    VMs from one VM application to the next. Make sure VDI is selected, and click
    Next.


    ![](img/5019375da05cbf0090115165d80772a1_26_0.png)


    **STEP 6** The question of whether to opt for Dynamically or Fixed sized virtual
    hard disks may come across as being somewhat confusing to the newcomer. Basically,
    a Dynamically Allocated virtual hard disk is a more flexible storage management
    option. It won''t take up much space within your physical hard disk to begin with
    either. Ensure Dynamically Allocated is selected, and click Next.


    ![](img/5019375da05cbf0090115165d80772a1_26_1.png)


    **STEP 7** The virtual hard disk will be a single folder, up to the size you state
    in this section. Ensure the location of the virtual hard disk, on your computer,
    has enough free space available. For example, we''ve used a bigger storage option
    on our D\ drive, named it Linux Mint, and allocated 25.50GB of space to the virtual
    hard disk.


    ![](img/5019375da05cbf0090115165d80772a1_26_2.png)


    **STEP 8** After clicking Create the initial setup of the VM is complete; you
    should now be looking at the newly created VM within the VirtualBox application.
    Before you begin though, click the Settings button from the top of the right-hand
    panel, and within the General section click the Advanced tab. Using the pull-down
    menus, choose ''Bidirectional'' for both Shared Clipboard and Drag''n''Drop.


    ![](img/5019375da05cbf0090115165d80772a1_26_3.png)


    **STEP 9** Follow that by clicking on the System section, then the Processor tab.
    Depending on your CPU allocate as many cores as you can without detriment to your
    host system; we''ve opted for two CPUs. Now click on the Display section, slide
    the Video Memory up to the maximum, and tick ''Enable 3D Acceleration''. Click
    OK to commit the new settings.


    ![](img/5019375da05cbf0090115165d80772a1_26_4.png)


    **STEP 10** Click on the Start button and use the explorer button in the ''Select
    Start-up Disk'' window; the explorer button is a folder with a green arrow. Click
    Add in the new pop-up window, to locate the downloaded ISO of Mint; and click
    Open to select the ISO. Now click the Start button to boot the VM with the Linux
    Mint Live Environment. You can now install Linux as per the standard PC installation
    requirements.


    ![](img/5019375da05cbf0090115165d80772a1_26_5.png)'
