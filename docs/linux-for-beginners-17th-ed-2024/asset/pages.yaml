- pgno: 11
  md: '# Equipmnt You Will Need


    The system requirements for successfully installing Linux Mint on to a PC are
    surprisingly low, so even a computer that’s several years old will happily run
    this distro. However, it’s worth checking you have everything in place before
    proceeding.


    # MINTY INGREDIENTS


    Before we start working our way through this book, here’s what you need to install
    and run Linux Mint. You have several choices available, so take your time and
    see which works best for you.


    # SYSTEM REQUIREMENTS


    The minimum system requirements for Linux Mint are as follows:


    **CPU** – 700MHz

    **RAM/Memory** – 512MB

    **Hard Drive space** – 9GB (20GB recommended)

    **Display** – 1024 x 768 resolution


    Obviously the better the system you have, the better the experience will be and
    quicker too.


    ![](img/5019375da05cbf0090115165d80772a1_11_0.png)


    # USB INSTALLATION


    You can install Linux Mint onto your computer via USB or DVD. We look into each
    a little later on but if you’re already familiar with the process, or thinking
    of USB and just gathering the hardware you need, then you’re going to need a minimum
    4GB USB flash drive to store the Linux Mint ISO.


    ![](img/5019375da05cbf0090115165d80772a1_11_1.png)


    # DVD INSTALLATION


    DVD installation of Linux Mint simply requires a blank DVD-R disc. Of course,
    you also need an optical drive (a DVD Writer drive) before you’re able to transfer
    or burn the ISO image to the disc.


    ![](img/5019375da05cbf0090115165d80772a1_11_2.png)'
  merge: -1
  img_proc: true
- pgno: 12
  md: '![](img/5019375da05cbf0090115165d80772a1_12_0.png)


    # VIRTUAL ENVIRONMENT


    Installation to a virtual environment is a favourite method of testing and using
    Linux distros. Linux Mint works exceedingly well when used in a virtual environment
    but more on that later. There are many different virtual environment apps available;
    however, VirtualBox, from Oracle, is one of the easiest to inzo. You can find
    the latest version at: www.virtualbox.org.


    ![](img/5019375da05cbf0090115165d80772a1_12_1.png)


    # INTERNET CONNECTION


    It goes without saying really, that an Internet connection is vital for making
    sure that Linux Mint is up to date with the latest updates and patches, as well
    as the installation of further software. Although you don''t need an Internet
    connection to use Linux Mint, you''ll miss out on a world of free software available
    for the distro.


    # MAC HARDWARE


    Although Linux Mint can be installed onto a Mac, there''s a school of thought
    that recommends Mac owners use a virtual environment, such as Virtualbox or Parallels;
    and why not, macOS is already a splendid operating system. If you''re wanting
    to breathe new life into an older Mac, make sure it''s an Intel CPU model and
    not the Power PC models. Beware though, it''s not as pain free as installing on
    to a PC.


    ![](img/5019375da05cbf0090115165d80772a1_12_2.png)'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Desktop Environments


    Linux Mint comes in several different versions, or Flavours: Cinnamon, MATE and
    Xfce; there are 32-bit and 64-bit versions of these too. What does it all mean
    though and which version should you choose for your installation?


    # WHICH MINT?


    A Desktop Environment is the graphical interface which you use to interact with
    the core Linux system. Just as the graphical desktop for Windows 10 is also called
    Fluent Design.


    Linux Mint offers the user a choice of versions of the distro: Cinnamon, MATE,
    and Xfce. While that may sound a little confusing for the newcomer, essentially
    each of the versions available contains the same core Linux structure and kernel;
    the kernel is the core of the operating system, that handles all the instructions
    between the software and hardware.


    Each version is simply a different desktop environment, the Graphical User interface
    (GUI) that you use to interact with the operating system. Each of the desktop
    environments uses different apps to access or use the system, such as the file
    manager to browse the operating system''s file structure or the way it launches
    other apps. Again though, the core available productivity, video and graphic suites
    are the same, and function in the same way.


    Why bother then with a different desktop environment? Simply put, it’s down to
    personal taste. Some users prefer MATE, as MATE is a fork of the classic GNOME
    2 environment and is a little more menu-centric, and performs well on older computers.
    Others prefer Cinnamon, which is a more modern environment that works better on
    recent hardware and features some cutting edge desktop code. Xfce, on the other
    hand, is a lightweight desktop environment that works well on older hardware due
    to its extremely low use of the available system resources.


    In short, Cinnamon is the flagship desktop environment for Linux Mint. MATE is
    more compatible with a wider variety of hardware. Where Windows, for example,
    only offers one desktop environment to work in, Linux offers many. Linux Mint
    has therefore opted to bring the user a wealth of choice.


    ![](img/5019375da05cbf0090115165d80772a1_13_0.png)'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# A DASH OF CINNAMON


    Cinnamon has many benefits beyond its look and feel, although they are important
    factors. Here, we outline a couple of features to help you decide if it’s the
    DE for you.


    # FAB FEATURE 1


    It performs excellently on more modern systems but is a lot more stable than it
    used to be, and not quite the resource hog it once was. Therefore, don’t be put
    off Cinnamon if you’re using an older computer to install and test Linux Mint.


    ![](img/5019375da05cbf0090115165d80772a1_14_0.png)


    # FAB FEATURE 2


    Cinnamon features configurable Hot Corners, where each corner of the desktop can
    be clicked to perform a certain task, such as display the Workspaces, Show all
    Windows or Run a Command. The Hot Corners are an excellent way to switch between
    different views and help make the desktop a more efficient environment.


    # BEST MATE


    MATE is a simple to use and intuitive DE that’s fast and stable. In comparison
    to Cinnamon it looks a little antiquated but that’s only on the surface. There’s
    plenty to like with MATE.


    # FAB FEATURE 1


    MATE is an excellent desktop environment for older computers. It works better
    with a larger number of hardware components that Cinnamon generally does but is
    also just as capable of delivering a great looking desktop as well as advanced
    customisations.


    ![](img/5019375da05cbf0090115165d80772a1_14_1.png)


    # FAB FEATURE 2


    Due to its highly configurable nature, MATE can be customised to a fine degree.
    There are plenty of options available to the user who demands a little more from
    their desktop environment, including Compiz Settings, where you’re able to configure
    all manner of desktop effects, even a 3D desktop cube.


    # CHOLESTEROL FREE DESKTOP


    Xfce started life as the Common Desktop Environment (CDE) in 1996. Since then
    it’s changed name a few times and is now simply Xfce, with the nickname ‘Cholesterol
    Free Desktop Environment’.


    # FAB FEATURE 1


    Xfce really is a quick desktop and brings out the best in Linux as a fast operating
    system. In fact, it’s taken us to this point from the top of the page to install
    it onto a new computer. A few hundred words written and we’re using a brand new
    OS. Hot bad.


    ![](img/5019375da05cbf0090115165d80772a1_14_2.png)


    # FAB FEATURE 2


    Just because it’s quick and lightweight doesn’t mean Linux Mint Xfce isn’t a complete
    desktop operating system. Just like the other environments on offer, you get the
    latest Firefox, LibreOffice, VLC, Gimp, chat apps and even a bit torrent client.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# # Which Distro?


    Up to now we''ve looked mainly at Linux Mint but there are other Linux distributions
    out there to try. In truth there are thousands of Linux distros available to download
    and install, so which one should you decide on to use?


    # DISTRO HOPPING


    Distro hopping is a term used by the community for people who never stick to a
    single distribution. Instead, they hop from one to the other and back again, testing
    each, using them, then moving on to another or a newly released distro.


    There''s nothing wrong with distro hopping, as it''s a good way to get to grips
    with what''s out there and discover the elements of one distro over another that
    may or may not appeal to your tastes. The problem of course is which one do you
    use overall?


    ![](img/5019375da05cbf0090115165d80772a1_15_0.png)


    While distro hopping is a good thing, it''s not exactly a stable way to enjoy
    Linux and get the most from it. We''re not saying you should stick to one distro
    and never look elsewhere, as you would be missing a lot of great content out there,
    but instead we recommend you find a handful and slowly progress through them based
    on your increasing Linux skills.


    ![](img/5019375da05cbf0090115165d80772a1_15_1.png)


    For example, Linux Mint is an ideal starting place. It''s an easy to install and
    use distro, has all the software you would normally use on a day-to-day basis
    already installed out of the box and gently eases you into the unique world of
    Linux and how it works and performs.


    Ubuntu offers much the same experience but it does this in a slightly different
    way. There''s generally less preinstalled with Ubuntu than with Linux Mint, so
    you would need to manually install it yourself. Another point worth considering
    is the sheer volume of content and help pages dedicated to Ubuntu users when using
    Linux. If you get stuck, you''re never too far from a solution to the problem.


    Moving on, as you begin to grow more confident with Linux, you may test out the
    likes of openSUSE, Fedora or Debian. These are all excellent distros and each
    offers the user a slightly different perspective on how the system runs. Some
    are more demanding, in terms of Linux skills, than others, but essentially they
    each have some valuable lessons to learn for the user.


    You may find yourself moving to a particular distro because it offers something
    radically different from the norm. Tails Linux, for example, is a distro that''s
    designed purely for online anonymity. It contains complex and military grade encryption
    tools as well as tools and browsers designed to help you browse the web without
    ever being detected, traced or monitored. Kali Linux is designed for security
    professionals and contains many different kinds of ethical hacking


    ![](img/5019375da05cbf0090115165d80772a1_15_2.png)'
  merge: -1
  img_proc: true
- pgno: 16
  md: '![](img/5019375da05cbf0090115165d80772a1_16_0.png)


    ![](img/5019375da05cbf0090115165d80772a1_16_1.png)


    tools preinstalled, that a user can run for penetration testing against their
    network. There was once even a Hannah Montana Linux distribution but the less
    we talk about that the better. The point being, there’s a distro out there for
    you.


    Needless to say, once you’ve mastered Linux to a relatively high degree, probably
    a power user ability, then you will want to expand your skills and begin to build
    your own Linux distro based on Arch, Debian or one of the many other distros available.
    Doing so involves a lot of command line knowledge, as well as knowledge on how
    the Linux system works and interacts with the hardware in the computer. You will
    need to partition your own hard drive, install a desktop environment and eventually
    install the apps and programs you want. Doing so takes time and again there are
    a lot of skills you’re going to need to learn.


    Eventually you can consider yourself a technical Linux user but never consider
    yourself an expert, after all we’re always learning something new. You can build
    your own distro from scratch, help other Linux users out with problems, maybe
    even contribute to the improvement of a distro during its testing phase or build.
    Where next then?


    Oddly enough, most higher-end technical users find themselves back at square one,
    using a distro like Linux Mint. The main reason is usually because it’s an easy
    option, and it’s a stable environment. Just because you know the system inside
    and out, doesn’t mean you always want to be fixing potential issues. Most of us
    would prefer the easy life, especially where technology is concerned, so the logical
    choice would be to choose a distro that’s simple, yet still powerful enough to
    do everything you want it to do, hence Linux Mint.


    However, in the end, it’s purely down to choice, your own personal choice. You
    may find that after going through the tutorials in this title you don’t like Linux
    Mint or the Cinnamon desktop. Fine, you may prefer Ubuntu, Debian or openSUSE
    that’s the beauty of Linux. The freedom to change what you want, to distro hop
    from one to another without being penalised by cost or lack of access.


    The answer to the question, which distro is any which one you like! It can be
    as complex or easy as you need it to be, as long as it does what you want it to
    do, then it’s perfect.


    ![](img/5019375da05cbf0090115165d80772a1_16_2.png)'
