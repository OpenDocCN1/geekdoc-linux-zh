  md: '# Chapter 1


    +   2. Any new code added to the software must be included in the redistribution.


    Despite the intention of these provisions, some software vendors have managed
    to comply with the letter of the license and not its spirit. For example, there
    have been vendors who have provided new source code that thwarts the spirit of
    the GNU GPL by making the new code intentionally unclear through the use of jumbled
