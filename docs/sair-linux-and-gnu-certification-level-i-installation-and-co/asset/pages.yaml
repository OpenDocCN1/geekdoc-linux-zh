- img_proc: true
  md: 'There are a number of media that can be used to install a Linux distribution.
    Each has its respective advantages and disadvantages, considered later. The six
    media types fall into two basic categories: local device installation and net-work
    access installation.


    # Local Device Installation


    CD-ROM. As indicated in the previous chapter, CD-ROM is the preferred installation
    media. Depending on which software release is installed, the 500 MB of archived
    CD-ROM data uncompresses and expands to any-where from 800 MB to 1 GB on the hard
    disk. This dearchiving process usually takes one or more hours with older computers.
    With today''s faster CPUs and CD-ROM drives, it may take less than eight minutes.


    MS-DOS partition. In this scenario, Linux installation archives have been copied
    to the MS-DOS partition. Although this may seem like a strange thing to do, it
    overcomes the “older CD-ROM” problem described in the previous chapter. Once the
    MS-DOS disk archive image is set up, the instal-lation program can be directed
    to the hard disk.


    Floppy. In this case, a minimal system archive is placed on a set of 10–50 floppy
    disks. Each disk contains a fraction of the installation archive. The remainder
    of the distribution is downloaded from a network server.


    # Network Access Installation


    FTP. Using this method, you connect to a server that already has the archives
    stored. One problem that continues to occur when downloading a Red Hat distribution
    is that its download process is not interactive. After specifying the FTP password
    and directory, Red Hat attempts the connection without feedback. Consequently,
    an error as for-geting to specify the FTP root directory /pub/can can prevent
    a successful installation.


    NFS. This method is very similar to the FTP scenario just described. Following-this
    method, the archive has been stored on another Unix or Linux box, and the user
    simply simplifies the NFS host name or address the shared directory path. Once
    set up, NFS works well, but with FTP, there are a number of small configuration
    problems that usually prevent you from setting up a Linux install host and an
    NFS server at the same time.


    SAMBA. With FTP and NFS, SAMBA uses the network to “share” a hard disk with an
    MS-Windows SMB server. Again, little details—such as using the wrong case for
    the password—can prevent establishing a connection.'
