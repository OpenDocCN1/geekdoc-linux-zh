  md: '# Theory of Operation


    # Origins of Open Source and Free Software


    To best appreciate the context from which the software system called Linux arises,
    we must first understand the history of sharing software. Two trends were evident
    back in the 1970s. One trend was the implicit cooperation among manufactures and
    their customers. The other trend began with AT&T''s release of Version 6 Unix
    to universities.


    # Computer Manufacturer-Sponsored User Groups


    Over the years, computer architecture and computer system packaging has gone through
    roughly three stages of evolution that can be characterized as mainframe, minicomputer,
    and microcomputer. Within each of these broad stages, manufacturers brought to
    market many types of computer architectures. Software written for one architecture
    could not be used on another. Consequently, in order to ease the transition to
    new architectures, manufacturers encouraged the sharing of free source code software
    through manufacturer-sponsored user groups. Typically, user groups maintained
    libraries of open source and free'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'software that were shared among group members. Annual or semi-annual meetings
    were also held to discuss software.


    # AT&T’s Free Distribution

    ofof Version 6 Unix


    In the mid and late 1970s, AT&T was prevented by the FCC from competing in the
    computer industry. Here, the company decided to distribute a thenunknown operating
    system Version 6 Unix for study in universities and other four-year colleges.
    Version 6 Unix launched many significant events. Among the most notable is that
    it taught a generation of computer scientists practical OS concepts that otherwise
    would have remained theory for years to come. Version 6 Unix also became the starting
    point for other Unix variants, including BSD Unix.


    Yet, AT&T retained a software license for Unix, which allowed them to control
    and market Unix in the future—so the software was not truly free. Nevertheless,
    the semantics within, and the apparent open-source nature of Version 6 acted to
    further encourage software development and sharing of source code that had begun
    years earlier in the manufacturer-sponsored user groups.


    # Advantages and Disadvantages

    of Free Software


    In spite of AT&T and other software licenses, the idea of sharing source code
    to Unix units continued, and to one degree or another, Unix (and Linux) system
    administrators carry this tradition today by developing their personal archive
    of system programs downloaded from the Internet. This personal archive grows with
    time and is carried by the administrator from job to job, much in the same way
    any tradesman would bring a set of tools to the job site.


    +   - Disadvantage of open source and free software. The requirement of expert
    knowledge to maintain and administer these systems (that is, knowledge about how
    to uncompress, de-archive, compile, configure, and maintain large and complex
    subsystems called packages).


    +   - Advantage of open source and free software. The time invested yields rich
    productivity benefits, allowing the system administrator to get a lot more done
    in the same amount of time than if traditional software products were used.


    To drive this point home, there is an old joke that compares OSs to airline companies.
    A recent view of the joke goes like this:


    Mac Airlines—All the stewards'
