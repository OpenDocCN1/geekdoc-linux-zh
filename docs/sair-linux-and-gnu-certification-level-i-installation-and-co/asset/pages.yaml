    and maximum frequencies that the monitor can accept for each graphic mode. Note
    that exceeding these frequencies will damage the monitor.


    Examination of Table 1.2 reveals three striking features with regard to monitor
    characteristics:


    +   - Advertised monitor size in inches has little to do with the actual display
    area.

    - Monitors accept graphic modes (addressability) approximately 10% greater than
    what can be supported by the number of phosphor units. (In other words, the problem
    is not with a person’s eyes—those high resolution images are really fuzzy!)

    - Graphic mode and refresh frequency are independent. Total display refresh rates
    can be much higher than generally used; these higher refresh rates offer improved
    viewing comfort.


    # Graphic Mode Notes


    Older monitors (from the early 1990s), like the first two entries in Table 1.2,
    would support only one or two graphic modes. Newer monitors were designed with
    the ability to “sync up” with additional modes. Thus, the term “multi-sync monitor”
    came into; however, since all new monitors are multi-sync, the term is now falling
    out of use.


    # **Changing Graphic Modes or Refresh Frequency**


    As the video adapter card switches graphic mode frequencies, many monitors will
    “chirp” or make clicking sounds. The chirp comes from the change in frequency
    which a large capacitor is charged and discharged. The capacitor is used to adjust
    the sweep rate of the electron beam as it paints the screen.


    The first time a monitor “syncs up” with a graphic mode refresh frequency, the
    CRT will have to be adjusted, or fine-tuned, for each frequency. Once tuned, the
    monitor stores these values for later reference. As an aside, every Linux distribution
    uses a default refresh frequency for the same graphic mode. Also, if you switch
    between MS-Windows and X11 using the same graphic mode, the display image may
    still change size or shift position. The reason is that MS-Windows is using one
    refresh frequency while X11 is using another refresh frequency and your monitor
    can only save one frequency for each graphic mode. To fix this, re-adjust the
    X11 refresh frequencies until they match the MS-Windows refresh frequencies.


    # **Is It Possible to Break Your Monitor?


    The short answer to the question is yes. We have had the unique experience of
    observing a student randomly select refresh frequencies and subsequently break
    the raster-scan circuit of a monitor, so it is possible to kill your monitor.'
