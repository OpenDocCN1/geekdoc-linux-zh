  md: '![](img/c572f01d68eb481ab5b032d38aedfe98_128_0.png)


    # # System Utilities


    The preceding chapter described commands; this chapter describes utilities. However,
    it is difficult to be exact when describing the difference between assisting a
    command and a utility. Both types of programs serve similar goals of assisting
    with the general maintenance of the machine, yet system administrators routinely-
    make the distinction between command and utility programs. Some distinctions are
    obvious: the ls program, for example, a command; the tar program is a utility;
    but what about the vi program?


    The distinction between command and utility addresses how the program is used
    as well as its functions. For our purposes, commands tend to be invoked more often
    than utilities, and utilities tend to have more complexity (runtime options) than
    commands. This is not a precise definition and, as a result, we acknowledge that
    it is possible for one person''s command to be another person''s utility.


    # ## Device Driver Utilities


    An obvious set of utilities are the ancillary programs that assist with runtime
    device-driver and logical-driver insertion into the kernel. In addition to the
    programs described next, there is also a kernel daemon, kerneld, which assists'
