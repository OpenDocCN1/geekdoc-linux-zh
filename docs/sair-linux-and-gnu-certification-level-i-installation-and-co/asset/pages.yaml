  md: 'easiest method, Slakware, and press Enter. Now, you need to select the pack-ages
    you want to install. Choose Yes and press Enter on the next screen.


    # Select Package Category


    Next, you will choose the individual packages that you want to install (see Figure
    A.4.7). Make sure that you select at least Base Linux System for the system to
    work. The rest of the categories are optional. To choose a category, move to it
    with the up and down arrow keys and press the space bar to choose that cate-gory.
    After you choose all the software you want on your system, choose OK and press
    Enter. If you have been following all the steps so far, you should be ready for
    actual installation now. Choose Yes and press Enter on the next screen.


    # Select Prompting Mode


    Now you need to choose the type of prompts you want to have during the installation.
    Choose the one you''d like and the installation will begin. Full mode will install
    everything. Newbie mode presents each package by one and prompts to accept it
    or not. Expert and Custom modes are for those who have had Linux experience before
    and know what they really want. Here, choose Full Installation and press Enter.


    Setup will now install all the packages you have chosen to your Target drive from
    your own Media. The installation will take a few minutes; just bear with it some
    time because you are not quite done.


