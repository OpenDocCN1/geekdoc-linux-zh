  md: '# Starting a Display or Window Manager


    The final step in system setup and installation is to launch the graphical user
    interface (GUI). The X Window GUI has three basic components: a display manager
    called xdm (that provides a GUI login), an X server (the device driver for the
    monitor), and desktop (window) managers. Both the X server and the window manager
    are launched with the startx command.


    The console is configured for six virtual terminals, F1 through F6. Starting the
    display manager with the xdm command or launching the window manager GUI with
    the startx command may be done from any of the virtual terminals, but the GUI
    is subsequently displayed on virtual terminal F7.


    Once the display manager is launched with the xdm command, it never terminates.
    Instead, the xdm program presents a graphical login screen, waits for someone
    to login, and starts a desktop (window manager) for the user. Upon session termination,
    the xdm program automatically restarts the login request screen and waits again
    for login. Since the display manager is intended for a multi-user environment,
    only the superuser may execute the xdm command. To begin the display manager automatically
