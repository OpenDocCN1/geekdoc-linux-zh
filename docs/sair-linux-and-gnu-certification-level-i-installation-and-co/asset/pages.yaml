  md: '# xman, xinfo, and tkman


    xman. There are X versions of both the man and info pages. Generally, the X11
    works in the same way as the ASCII versions. An exception to this rule is that
    the xman program builds a table-contents for each section and allows you to click
    on the file name to access the manual page.

    xinfo. The xinfo utility provides additional menu bars at the top of the window
    when compared to the ASCII program, but button positions as the program moves
    from level to level. This means that you must always look back at the menu bar
    to see if the desired button has changed position before clicking what might the
    wrong button.


    tkman. The xman, tkman, offers a true GUI front-end to the man pages. Its main
    improvement is the use of regular expressions in searches; however, tkman will
    not search the body of man pages. Also, tkman offers ease-of-use features, such
    as custom configuration, history list, and hyperlinks among many pages.


    # Online Information Access


    Online information refers to all the Linux information repositories around the
    world, Linux news, and to the Internet search engines. Well-known examples of
    Linux repositories follow.


    # Linux Repository Sites


    The Linux Repository Project (LDP) can be found at www.linuxdoc.org. The LDP provides
    links to a wealth of Linux documentation, including HOWTOs, FAQs, and online books
    (http://www.linuxdoc.org/docs.html).


    The main Linux Web pages (http://www.linux.org and http://www.linux.com) are well-organized
    sites designed for basic information on Linux and for users to keep up on recent
    Linux news.


    There are Linux sites that only link to other sites. Two examples of these sites
    are Linux Links (www.linuxlinks.com/) and Gary’s Linux Encyclopedia (http://members.aa.net/-swear/pedia/).


    # Linux News Sites


    There are many Linux news sites as well as news groups. Here are just a few:


    +   - Linux Today (http://linxtoday.com/), a listing of newswire reports in the
    business community concerning Linux events.'
