    tools.


    +   5. The open source community model leads to superior software. GNU software
    superiority is also, in part, a result of the open source process that collects
    and harnesses the collective IQ of thousands of worldwide software developers
    employing peer-reviewed code, parallel development, and parallel debugging cycles.


    # Other GNU GPL Issues


    The GPL will continue to change with time. But there are no quick answers to these
    questions. As time goes these issues will be addressed and refined as the GNU
    GPL continues to grow in acceptance.


    # GNU GPL Lip Service


    Earlier we noted that the GNU GPL has two important provisions for any free software
    that it covers. Essentially, these are:


    +   1. All code, including source, must be included in redistribution of the software.'
