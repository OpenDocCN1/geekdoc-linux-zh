- img_proc: true
  md: '# Chapter 5


    +   - Linux Weekly News (www.lwn.net/), selects and provides a summary of Linux
    news events for the week.

    - Slash Dot (http://slashdot.com/), selects from submissions of Linux-related
    news stories.

    - Fresh Meat (http://freshmeat.net/), accepts submissions of the latest software
    available for Linux.

    - Linux Games (http://www.linuxgames.com/), accepts submissions of the latest
    games developed for Linux.


    News groups are traditionally accessed via a news reader, but the news reader
    must be reconfigured from a news feed. Feeds have highvolume traffic sites that
    accept over 3 GB of data per day. If properly configured, your news reader can
    provide access to the Linux newsgroups. Simply select the entry point "comp.os.linux.x"
    where x is one of 10 subgroups.


    # Internet Search Engines


    Internet search engines are all helpful in finding Linux-related information.
    Based upon our experience, the search engines have the following feel:


    +   - Yahoo (http://yahoo.com/), best results with a vague query. Yahoo provides
    possible categories to follow and refines the search term(s).

    - Hotbot (http://hotbot.com/), best results with a set of general unrelated terms.
    Hotbot is generally thought to reference the largest number of pages.

    - Altavista (http://altavista.com/), best results with a specific SQL formatted
    terms. Altavista does a good job of finding specific pages, otherwise it tends
    to bring up a lot of unrelated material.

    - Deja (http://deque.com/), formally DejaNews, exploits the adage about knowing
    history ensures that history will be repeated. Deja provides access to old Usenet
    postings where someone most likely has posted a solution or work-around to the
    problem. The key to finding the answer to a problem is to search just if you were
    asking a specific question to a coworker who might know the answer to your question.


    Deja will also provide access to the Linux news groups. Simply enter one of the
    following news group names as a search string and click the search button: comp.os.linux.advocacy,
    comp.os.linux.hardware, comp.os.linux.m68k, comp.os.linux.misc, comp.os.linux.networking,
    comp.os.linux.powerpc, comp.os.linux.setup, or comp.os.linux.x.


    As an aside to using search engines, it should be pointed out that there is evidence
    that any one search engine indexes only about 35 percent of the entire Internet!
    An exhaustive search, therefore, requires combining at least three search engines
    regardless of their feel.'
