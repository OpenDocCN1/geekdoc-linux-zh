  md: '# Preface


    At first glance, this may appear to be a “regular book,” instead, it is a different
    kind of computer text that has evolved over the last few years called a “study
    guide.” In the same way that Cliff Notes help students study for a college test,
    these study guides prepare computer professionals (candidates) to take a test.
    Upon passing a number of tests, these candidates earn a certificate which assists
    with job placement, promotions, and merit increases.


    Compared to many other study guides, this book is also unusual. Other study guides
    focus on one computer vendor where as this book covers many distributions of Linux.
    Other study guides usually focus on one product where we cover free, open source
    software packages (products). Finally, other study guides usually cover point-by-point
    user interaction with a vendor’s product where this one presents the common elements
    that describe all Linux distributions and the key differences among the more popular
    distributions.


    This is too much broad information to absorb? Our experience says “no.” People
    do not want to be told by a vendor that their particular Linux distribution is
    the best. We want to see the “big picture” and how each Linux distribution fits
    into the open source software landscape. They see the benefits of free, open source
    software and they want to maximize its use in their companies.


    Therefore, this study guide contains a compendium of theory, principles and facts
    relate to installation and configuration of Linux on the PC platform. The information
    is organized around a “knowledge array” that carries just the essential concepts
    and facts for installation and configuration. Information is presented in a no-frills
    fashion concept by concept. Chapters 1–6 traverse the first row of the knowledge
    array. Appendix A provides step by step installation instructions for four Linux
    distributions. Appendix B provides sample questions as a review and self-assessment
    guide. And finally, there is a glossary of key terms and phrases that reviews
    concepts described in the text.'
