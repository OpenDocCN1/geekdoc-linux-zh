- img_proc: true
  md: 'address is w.x.y.z, where each letter represents a decimal number from 1 to
    254 and the “dots” act as separators among the four decimal numbers.


    **Network Mask.** The mask has the same format as the IP address, except that
    the least significant bits are zero and represent the size of the subnet to which
    the host is connected. For example, w.x.0.0 is a subnet with 65,534 possible computers.
    The pattern w.x.y.0 represents a subnet with 254 possible computers. Finally,
    the pattern w.x.y.240 represents a subnet with 15 possible computers. Note that
    addresses 0 and 255 are not permitted since they mean “subnet size” and “broadcast
    address” respectively.


    **Gateway.** A gateway (or router, bridge, firewall) is the IP address of a host
    that accepts messages destined for the Internet.


    **Domain Name Service.** The Domain Name Service refers to the IP address of a
    host that accepts a domain name (an ASCII string) and returns its IP address,
    or it will accept the IP address and return the domain name (if there is one).'
