    # Finding More Information


    Success in the use of Linux rests on the ability to research various types of
    documentation. Regardless of how many questions or problems you resolve while
    using Linux, there are ten more questions or problems to replace the one just
    answered, so mastery of documentation is de mastery of Linux. In this section,
    the use of various programs that assist in finding answers to problems will be
    described.


    # Local Documentation


    The overall complexity of the Linux and GNU operating system is truly amazing.
    No one can memorize and keep the vast array of commands, utilities, and applications
    at their fingertips. Instead, we rely on various forms of online documentation
    to assist in using unfamiliar or infrequently used commands. The following series
    of utility assist with discovering more information about the system. Each will
    be considered in its own section.'
