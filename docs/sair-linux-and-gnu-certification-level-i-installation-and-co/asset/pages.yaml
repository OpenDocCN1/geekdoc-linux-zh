  md: '# Linux/Open Source $34.99 USA/$54.50 CAN


    Learn more, earn more with Linux certification!


    # Sair Linux and GNU Certification® Level I: Installation & Configuration


    The Linux and GNU Certification program, developed and designed by the industry-leading
    members of Sair, Inc. and its advisory board, provides you with a clear path for
    improving your Linux skills and knowledge base. This new series of books will
    help you gain the necessary tools to become Linux certified, which can lead to
    more opportunities and a higher salary! I concentrates on the areas of expertise
    that must be mastered to become a Linux Certified Administrator (LCA).


    The first of four guides for the LCA certificate, this book will help you:


    +   * Configure a printer capabilities file and a filter

    * Compare previously open source software licenses

    * PC system architecture configuration issues

    * Explain the Linux device driver log and give examples

    * Install, and navigate two X11 window managers

    * Compare and contrast common shell editing variables

    * Describe and use common shell editing commands

    * Install run-time device drivers

    * Describe Netscape functions, FTP functions, Telnet functions, and mail functions

    * Discuss the role of system logging and how to use it for troubleshooting


    TOBIN MAGGINNIS is an Associate Professor of Computer and Information Science
    at the University of Mississippi. He has used open source, free software to teach
    many systems courses including levels of operating systems and computer networking
    courses over the last 20 years. Since 1992, he has been President of Sair, Inc.


    In this guide, Sair and GNU Certification draws upon your years of experience
    to provide expert advice and guidance on installing and configuring all distributions
    of Linux with walk-throughs for major distributions, including Hat, Caldera, Slack,
    and SUSE. We cover all the areas that you''ll need to know in order to pass the
    LCA exam including theory of operation, base systems, shells and commands, system
    services, and applications. Included are over 100 sample test questions to help
    you prepare for your exam.


    Other books to look for in the Level I:


    +   Sair and GNU Certification® Level I: Networking

    Sair and GNU Certification® Level I: System Administration

    Sair and GNU Certification® Level I: Security, Ethics, & Privacy


