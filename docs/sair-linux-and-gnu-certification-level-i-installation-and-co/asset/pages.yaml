    # Mounting Removable Media


    There are two basic classes of mountable devices—read only and read/write. To
    place a read only disk volume into the directory hierarchy, you must mount the
    volume with the mount command. For example, to mount an ATAPI type CD-ROM drive,
    enter a command such as:


    ```

    mount /dev/hdb /var/src

    ```


    The first parameter on this command is the device name, and the second is the
    name of the mount point within the logical file system. Now, enter the mount command
    again but without arguments. This will show the mount table:


    ```

