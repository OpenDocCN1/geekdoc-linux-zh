    # Role of the BIOS and Device Detection


    All of today''s computers employ firmware, or Read Only Memory (ROM), programs
    that the CPU executes upon power-up. These firmware programs perform diagnostics
    on the CPU, main memory, and installed peripherals. The firmware also allows the
    user to configure basic system functions such as the time of day.


    In the PC system architecture, the firmware is called the Basic Input Output System
    (BIOS). In addition to the motherboard, each adapter contains a ROM-based diagnostic
    routine that is used to ensure the adapter is working on power-up.


    The PC BIOS also contains routines to access the hard disk and other peripherals.
    On power-up and after the BIOS executes various diagnostic routines, the first
    sector of the hard disk (the master boot record or MBR) is read into memory and
    executed. The MBR executes the first stage of the Linux loader (LILO) program.
    LILO, in turn, uses the BIOS service to read other blocks from the hard disk so
    it can boot the Linux kernel (or another OS). Unlike DOS or MS-Windows, the Linux
    kernel does not subsequently use BIOS routines to access hard disks or other peripherals
    (except for the time-of-day clock). There are many reasons for not using the BIOS,
    but the essential problem is that the BIOS design does not use interrupts and,
    therefore, cannot support the preemptive multitasking that Linux requires.


