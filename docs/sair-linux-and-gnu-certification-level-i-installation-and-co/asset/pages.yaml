    # # Base System


    # ## Installation Media


    There is a vast array of open source and free software available. Companies and
    non-profit entities have gathered “chunks” of this software around the Linux kernel.
    Our role here is to describe these chunks and let you decide which one fits your
    needs. To understand and use Linux as a system administrator, you must have experience
    installing several, if not most, of these chunks. And even though there are detailed
    installation walk-through sections in Appendix A, it should be noted that we do
    not test on specific install steps of a given distribution. We will now examine
    the installation process.


    # ## Media Choices


    Linux comes as a “distribution,” meaning that an organization has packaged the
    software and bundled a special install program with the packaged software. Install
    programs are, in fact, stripped down versions of Linux that use RAM disks and
    shell scripts to perform the install operations. Distributions tend to use their
    own set of install programs, which run off of various media. However, several
    distributions use the Red Hat install mechanism.'
  merge: -1
