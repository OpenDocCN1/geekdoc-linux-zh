    Your swap partition will be configured and added to the /etc/fstab. Choose Exit
    and press Enter to continue. On the next screen, choose Yes and press Enter to
    go to the next step of the installation or No to go back to the main menu. The
    next step of the installation is Choosing Target Partition.


    # Set up a Target Partition


    Now that you have chosen and set up your swap partition, you can select the main
    disk where you actually want to install Slackware. Press Yes to choose your target
