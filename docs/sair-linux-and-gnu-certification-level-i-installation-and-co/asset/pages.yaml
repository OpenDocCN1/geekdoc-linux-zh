    # GNU GPL Documentation


    Another gray area concerns documentation. How much documentation should the software
    author provide with the source code? This becomes even more pressing concern when
    confronted with the possibility of developing and information manuals on the software.
    Then the question becomes how much information should the author offer in the
    form of software documentation and how much should be reserved for sale?


    Although the GNU GPL does not address this issue, current practice favors traditional
    style source code commenting combined with the provision of Unix-style manual
    pages, at a minimum.


    # GNU GPL Software Contamination


    Some open source software modules (for example, parts of the X11 system) have
    a copyright but no other restrictions. Thus, the software may be integrated and
    sold as another software product by a number of companies. In this way, each vendor''s
    version of the free software GPL competes for business in the open market.


    It is said that GNU GPL will contaminate or poison X11 software since the use
    of GPL code anywhere in the proprietary product would require releasing any other
    source code that directly uses the GNU GPL code.


    # GNU GPL Copyright Holder


    Copyright plays a key role in copyright but the copyright holder may decide to
    change his mind or re-issue new versions of the software under a different software
    license. What happens if the copyright owner dies and the copyright passes to
    the holder''s estate? What happens if the copyright for a given software system
    is given to a not-for-profit organization and the organization decides to change
    its software licenses? What happens to GPLed software when the copyright expires?
    These and other copyright issues have to be addressed in a general and systematic
