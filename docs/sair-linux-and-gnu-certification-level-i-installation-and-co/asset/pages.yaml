    # Set the Root Password


    Select the root password. Root will be the superuser on your Linux system and
    will have access to everything. Type a password in the Root Password box and then
    retype it below to make sure you have typed it correctly (see Figure A.3.9). Then
    click on Next.


    # Set Login Names


    Now that you have the root setup, you can add individual users on your system.
    Since Linux is a multi-user system, you can add as many users as you want. To
    do so, just type the user''s name in the Real Name Box and the Login Name in the
    appropriate box, then retype the password for that user. Choose the shell you
    want the user to use, and click on Add User. After adding as many users as you
    wish, click on Next.


    # Set Up Networking


    If a network card is installed in your computer and you want to use it for the
    Internet, select Ethernet Configured Statically and fill in the appropriate data
    for your IP address, NameServers, and Gateway (see Figure A.3.10). You can obtain
    this information from your ISP. If your Internet connection dynamically assigns
    IP addresses, you have to choose Ethernet Configured by DHCP. Then post your Hostname
    in the bottom box. If you have no Ethernet card, just choose no Ethernet and click
    on Next.'
