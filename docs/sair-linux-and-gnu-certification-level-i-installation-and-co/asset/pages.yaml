  md: '# Appendix B


    exam and the exam questions are based upon knowledge matrix topics found within
    each cell. Therefore, each question is prefixed with dotted-decimal numbers followed
    by a letter so that the topic may be located for further study and review. For
    each question, the left-most number refers to the first knowledge array row, Installation
    and Configuration. The second dotted-decimal number refers to the knowledge array
    columns: (1) Theory, (2) Base System, (3) Shells and Commands, (4) System Utilities
    and Services, (5) Applications, and (6) Troubleshooting. The third dotted-decimal
    number refers to the topic within that cell. For example, the item number 1.3.40.c
    is the third question with its focus on the cd command.


    As stated in the book''s introduction, passing the S Linux and GNU exams require
    knowledge and experience. It is our educational philosophy to assess both "book"
    knowledge and "experience" by using "naive-subject-plausible answers" for alternative
    answers to questions. Said another way, we use the things that our students would
    do or say as alternative answers to questions. If you have experience with Linux,
    then the alternative answers appear to be silly. If, on the other hand, you do
    not have background experience, the exam questions usually appear to be trick
    questions.


    # The Questions


