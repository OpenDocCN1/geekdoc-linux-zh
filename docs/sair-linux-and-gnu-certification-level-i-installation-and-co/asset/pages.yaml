  md: '# Theory of Operation


    both are generally referred to as the “Halloween Memos.” Following are five of
    the Microsoft conclusions from these memos that are of interest:


    +   1. The GNU GPL is unique. Of nine types of software licenses examined, the
    GNU GPL stood out as the most robust software license.


    +   2. The GNU GPL provides long-term software survivability. GNU GPL free software
    has been able to survive as a long-term product where other forms of free software
    have failed to survive. It is thought that the GPL allows software to flourish
    because (a) anyone may have access to the software, and (b) the GPL prevents the
    software from being subdivided into competing camps of developers. Even though
    this was not a significant consideration in the creation of the GPL license, it
    appears to have a significant effect on keeping developers sharing the same code
    base as the product.


    +   3. GPL open source software possesses superior quality. The GPL software is
    generally superior to Microsoft software.


    +   4. GNU software tools and libraries propel development. The GPL software superiority
    is, in part, a result of the open source community employing a software development
    engine based upon standard GNU software tools and libraries that apply to all
    aspects of the operating system and applications. This is quite different from
