    and employs a “free” software license controlled by Troll Tech. In other words,
    Qt is not GPLd.


    One key to KDE’s success is its default configuration. KDE can be configured to
    give the look and feel of most any design, but in its default configuration, KDE
    looks and feels much like MS-Windows (see Figure 5.2). This initial impression
    gives new users a sense of continuity and the confidence to try other configurations.


    KDE is a window manager plus support utilities. KDE utilities include a complete
    file manager that can access local, remote, and Web-based files. KDE has a sophisticated
    control panel, a task bar with icons, multiple forms of hierarchical pop-up menus,
    and help manuals. Other standard applications and utilities are planned for the
    KDE system. KDE creates a consistent look and feel for applications by specifying
    a standard GUI toolkit and support libraries that all KDE applications use, and
    a Style Guide that KDE authors follow. See www.kde.org for more information.


    In spite of these accomplishments, KDE has critics. In reaction to the Qt license,
    a group Harmony is developing a complete GPled widget set that is a free replacement
    of the Qt library (http://harmony.ruhr.de/).'
