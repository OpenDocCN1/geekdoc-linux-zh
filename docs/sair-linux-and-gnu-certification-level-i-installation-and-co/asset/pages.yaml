    # File System Structure


    The key to using Linux is knowing the ins and outs of its file system structure.
    This means knowing how to use hierarchical file name conventions: convenient placement
    of files, traversing physical volumes, removing media, and understanding file
    system abstractions.


    # Global File System Hierarchy


    Linux follows the Unix tradition of employing hierarchical file names where the
    target file is specified with a path. The path contains a starting point, optional
    directories, and the file name. There are two types of paths: absolute and relative.
    Absolute paths take the form:


    ```

    /var/pool//lpd/lp/lock

    ```


    where the first forward slash (/) means the beginning or root directory. Subsequent
    forward slashes (/) separate directory names and the file name. The double slash
    (//) included to show that Linux, like its predecessors, skips extra slashes when
    looking up file names. Relative paths take the form:


    ```

    mail/freed/letter5

    ```


    where the absence of the first slash means the current directory path should be
    prepended to the relative path in order to create an absolute path. This situation
    takes advantage of the fact that the system remembers the position of the current,
    or working, directory. The command pwd prints the working directory.'
