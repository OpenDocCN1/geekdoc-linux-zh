    instance of the tar command begins reading the current directory (dot), archiving
    the files, and generating the archive (because of the c create switch) to standard.
    Standard output is then directed to another program through the pipe operator
    (|). The second program is actually two commands in sequence, the cd command and
    the second tar command. The cd command switches from the current directory'
