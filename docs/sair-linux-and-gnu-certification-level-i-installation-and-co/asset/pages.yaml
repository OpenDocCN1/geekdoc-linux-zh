  md: '# Command Line


    When working at the command line, you don''t have to wait for a program to finish
    before beginning another command. Programs can be made to execute in the background
    by simply following the command with the & character. For example, the following
    command runs in the background, searching the entire directory structure for the
    file named


    ```

    bash$ find /name filename &

    ```


    After starting a command, if you subsequently realize that it may take longer
    to complete than originally thought, you can suspend that command by pressing
    <Ctrl>Z, and push it to the background by issuing the bg command. For:


    ```

    bash$ find /name filename -print

    <Ctrl>Z

    bash$ bg

    bash$

    ```


    # Virtual Terminals


    Another way that more one task can be accomplished at once is by using the Linux
    virtual terminal feature. By pressing <Ctrl><Alt>F1 to finish F6, different virtual
    terminals may be accessed. For example, you can login on F1 and begin a task,
    switch to F2 to do other work while the job on F1 is finishing.


    # X Window Environment


    In the X window environment, you can, of course, have more than a single program
    (window) open at a time, and you may also have multiple desktops. The multiple-desktop
    feature is dependent on the window manager being used. Most window managers have
    a default of four desktops that are laid out in a two-dimensional array. The Enlightenment
    window manager, however, takes this concept to the extreme. Some default Enlightenment
    configurations provide the ability to have 32 desktops on the horizontal and vertical
    axis, plus an additional 32 desktops on the Z axis!


    # Basic Commands


    The remainder of this chapter will present a subset of commands based upon the
    frequency of use. After each command is presented, examples are provided to show
    how the command is used in context.'
