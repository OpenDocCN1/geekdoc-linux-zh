    In this example, we can see that the appended text to the file has also changed
    the file called original. Notice that the hard link new and the file original
    are both 62 characters in length. Also notice that the number between the file
    permissions and the user account (the number 2) is the hard link count from the
    inode of the file having the names original and new. The disadvantage of using
    a hard link is that the hard link must be within the current mounted disk boundary
    since not whole file system.


    However, the ln command can also create symbolic links using the -s option. A
    symbolic link is a file that contains the full path to another file and can reference
    it anywhere in the file system. Symbolic links behave similarly to hard links
    except they are slower to access hard links. The reason is that once the file
    manager discovers a symbolic link, it must restart the lookup process. A second
    way the symbolic links differ from hard links is that the symbolic file size is
    equal to the length of the file name and the length of the file. Notice that in
    the following example, the new file has a length of eight bytes and the file original
    has a length of 62.


    ```

    ajneel@~:/temp ln -s original new\ajneel@~:/temp ls -l

    total 1

    lrwxrwxr-x 1 ajneel users       8 Aug 24 13:20 new -> original

    -rw-r-r- 1 users       62 Aug 24 12:57 original\ajneel@~:/temp >

    ```


