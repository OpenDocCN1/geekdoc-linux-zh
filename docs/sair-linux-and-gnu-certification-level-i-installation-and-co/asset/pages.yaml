  md: '# Making Boot Disk


    It is recommended that you make a boot disk in case your system crashes. There
    are two types of boot disks: simple boot disk, which is just an image of the kernel
    for minimal bootup so that you can troubleshoot your system, and LILO disk, with
    which you can dual boot your system. That is, when you boot up with diskette,
    LILO will start and prompt you for the operating system on to boot. But first
    of all, you need to format the diskette. Put your floppy in the drive, choose
    Format, and press Enter. The setup program formats the floppy and returns to the
    menu. From menu, choose Simple and press Yes to make a boot disk, and it will
    start to make a copy of the kernel to the formatted disk. After formatting the
    diskette, it will return to the previous screen. Choose continue and press Enter.


    # Modem Configuration


    If you have a modem, you will have to choose it. Choose the appropriate port at
    which your modem is connected. You need to make sure that your modem is not a
    winodem if you plan to use it with Linux. If you plan to use a network card to
    access the net, choose No modem, choose OK, and press Enter.


    On the next screen, if you would like to try some custom screen fonts, choose
    Yes and press Enter. For now, skip this step by choosing No and pressing Enter.


    # Install and Set up LILO


    Now you need to set up LILO, the boot loader, which allows you to boot your computer
    in different operating systems. For those of you who are familiar with LILO, you
    can choose Expert and enter the parameters in the lilo.conf file. For now, go
    with the automatic installation of LILO—choose Simple and press Enter.


    LILO can be installed in different places in your computer: the MBR (Master Boot
    Record), Root, or Floppy. Choose MBR and press Enter. (See Figure A.4.8.)


    # Network Configuration


    Now, setup will to configure your network and set up your TCP/IP. If setup does
    not succeed in configuring your network, you might change the settings. Press
    Enter to continue.


    # Mouse Configuration


    Now you have to choose and set up your mouse. Most common generic mice are usually
    PS/2, so choose PS/2 and press Enter.'
  merge: -1
  pgno: 234
