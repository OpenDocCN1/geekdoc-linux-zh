    # Component Compatibility Issues


    One indication of the acceptance of Linux is the inclusion of Linux device drivers
    with new hardware, such as Ethernet or video adapters. Unfortunately, any adapter
    cards do not come with Linux drivers, which means that system administrators and
    system builders will have to pay close attention to hardware compatibility issues.


    # Configuration Responsibilities


    When purchasing hardware for a new Linux box, it is always tempting to purchase
    the latest expensive clone PC that can be found. Although this strategy works
    sometimes, it seems just the administrator is stuck with incompatible hardware.
    Incompatibilities arise when the appropriate device drivers are not available
    for the new components. Thus, it is the system administrator’s responsibility
    to review the new PC components to ensure there are Linux drivers for all the
    desired peripherals.


    Generally, incompatibilities can be avoided by purchasing a more up-scale PC and
    components. These machines generally do not use short cuts that strip out hardware
    components and replace the hardware with MS-Windows drivers.


    To be completely sure about hardware compatibility, the administrator must compare
    the listed PC components against a compatibility list such as:


    ```

    www.linuxdoc.org/HOWTO/Hardware-HOWTO.html

    ```


    # Unsupported Devices


    Since Linux does not use the BIOS firmware, it is responsible for knowing the
    hardware details of all peripherals. This is generally not a problem with'
