  md: '# The Modular Structure of Linux


    Modularity is the idea that software should be written so that it can run independently
    of other modules, work with other modules to achieve an effect larger than any
    single module. If one module needs a function contained within another module,
    the function is reused as opposed to being recreated. Modules begin as small programs,
    or subroutines, that are grouped to form larger subsystems that, in turn, are
    grouped into larger systems, and so on.


    There are many independent systems, or modules, within Linux. These include: (1)
    the kernel, (2) the network, (3) init, (4) daemons, (5) login, utilities, and
    (6) the X Window System. A short description of each follows.


    ## The kernel''s job is to hide the hardware details of the computer and its peripherals
    from users and programmers. This hiding is accomplished by creating general abstractions
    that refer to hardware. For example, access to the CD-ROM drive is accomplished
    by reading the directory /cdrom. It is the kernel''s responsibility to know what
    type of CD-ROM drive exists and to be read from the drive.


    There are other subsystems within the kernel such as the file manager, data cache,
    memory management, and device drivers. For now, we will treat the kernel as one
    component even though it contains other components. The Linux kernel stands apart
    from other Unix-like kernels in that it has loadable device drivers, file managers,
    and other kernel components. These components are installed at runtime with the
    module or insmod.


    Network accepts both incoming network traffic from the environment and outgoing
    user requests for service, and combines the two data streams in such a way that
    the user has the illusion of being directly connected to other computers. Even
    though the network and kernel coexist in the same memory space (protected mode
    memory), they are independent.


    Init. To understand the init program, you must first understand that the only
    way a Unix-like or Linux program can run is to have another user program start
    it. If this is true, then where does the first program come from? The answer:
    init is a user-level program that is started by the kernel at boot time and is
    responsible for getting the ball rolling. It is the ancestor of all other user
    programs in the system.


    The init program plays a silent but critical role in system operation. After the
    kernel completes its initialization, it runs the init program. The init program
    checks every systemwide file called /etc/inittab which lists other programs to
    execute before other users log into the system. It reads from the /etc/inittab
    file which terminals should be used to accept users for login, and begins the
    program for each terminal'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Theory of Operation 11


    listed. Finally, init waits for signals from any of its programs or other system
    events (such as power failure) and dispatches other programs to handle the event.


    Daemons or system processes. One of the services performed by the init program
    at boot time is to begin a series of programs, called daemons. These programs
    are special in that they do not communicate directly with any user; instead, they
    sleep in the background until needed to provide a service.


    Since these programs provide helpful services, they are referred to as friendly
    spirits, or daemons (pronounced DAY-mons), and not as evil spirits, or demons.
    A typical Linux configuration employs a minimum of 15 daemons running in the background
    and may run 50 or more daemons.


    Two examples of typical daemons are:


    +   bflush moves the contents of the data cache to the hard disk(s) to limit system
    corruption in the event of a system crash.

    Httpd. Hypertext transfer protocol daemon—the Web server.


    Login, shes, and utilities. These are system programs that run as user programs
    (i.e., they run in user mode, not in protected mode as the kernel does). The login
    utility establishes a user ID. Shell accepts and oversees the execution of user
    commands. There are many utilities that provide user-services.


    Linux supports many types of command interpreter shells are available for compatibility
    with other versions of Unix and ease-of-use. However, for purposes of simplicity,
    we use just one shell, the bash shell.


    The X Window System. The X Window System is made up of a series of modules that
    provide services for a graphical user interface (GUI). The X Window System provides
    the foundation for various display managers, window managers, desktop environments,
    graphical utilities, and applications.


    # Preemptive Multitasking Software


    Multitasking operating systems (OSs) such as Linux exploit the fact that most
    programs spend the majority of their time waiting for events to take place. To
    prevent the system from stalling, a multitasking OS will release the CPU from
    these waiting intervals by suspending the waiting program and selecting from a
    list of ready-to-run programs.


    Examples of waiting programs that can be suspended in order to allow the CPU to
    continue execution on a ready program include the following: programs waiting
    for a user to type a character, programs waiting for the hard disk to read a sector,
    or programs waiting for a network packet to arrive.'
  merge: -1
