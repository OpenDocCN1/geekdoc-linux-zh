- img_proc: true
  md: '# A Brief Description of Linux Preemptive Multitasking


    While Linux is running a program, an environmental event may occur, such as a
    clock tick or an interrupt from another device. This event causes the current
    program to be suspended and the interrupt service routine (ISR) to be entered
    for the device in question. The ISR transfers data between the device and the
    computer. Upon completion of the data transfer, the ISR may either (a) return
    to the program it was executing before the environmental event took place, or
    (b) it may preempt this in favor of the program associated with the device event.


    If (a) is the chosen action, then the ISR may change the status of the program
    that was waiting on the device event from a suspended state to a ready-to-run
    state so that the scheduler will eventually select and run the program associated
    with the device in the next few milliseconds. Meanwhile, the CPU returns to, and
    continues to, the original program that was interrupted.


    If (b) is the chosen action, then the ISR may both switch the program to a ready-to-run
    state and increase the priority of the program to guarantee that it will run quickly
    (within a few microseconds), preempting the first program.


    Although you may never see an ISR or a process scheduler, being aware of these
    concepts allows us to understand how Unix-like OSs are able to continue to run
    in spite of a higher-level component crash and how they are allowed to handle
    hundreds of simultaneous users.


    # Single-User versus Multi-User Software


    As the name suggests, single-user systems allow only one user at a time. Single-user
    systems may have special programs that allow two physical users to be connected
    to the machine at the same time, but as far as the operating system is concerned,
    there is only one user. Some single-user systems have login accounts giving the
    impression that they are multi-user operating systems, but these systems still
    support only one user at a time and are referred to as sequential single-user
    systems.


    Just as other Unix-like operating systems, Linux is designed from the bottom up
    as a multi-user operating system. This means that access to the machine must be
    done by logging into a user account that has been previously set up. It also means
    that the machine may be accessed by the same account through multiple ports of
    entry at the same time (that is, a single user may login to the same account,
    or a different account, multiple times).


    The use of the term is intended to convey access to the machine from one or more
    of the virtual consoles (TTY 1-6), from an X11 terminal window,'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Theory of Operation 13


    from serial interfaces (TTYs), from the network (PTYs), or from any combina-

    tion of these devices.


    Users exploit the parallel login feature by switching among these access

    ports. A long-running job can be initiated on one port, followed by a switch

    made to another port where other jobs may be initiated or progress on the first

    job can be viewed.


    Finally, any time a file is created, it must be done within the context of a user

    account. If users switch among access ports and switch user accounts, they

    may not access to files created by the other account.


    # Switching Virtual Terminals

    and Page Scrolling


    The Linux physical console supports a series of virtual console terminals that

    provide access to multiple login sessions. Users may switch among virtual

    consoles regardless of the application or application state (for example, the

    application may be hung up) in any of the virtual consoles.


    Terminal switching works because (a) Linux is preemptive multitasking and

