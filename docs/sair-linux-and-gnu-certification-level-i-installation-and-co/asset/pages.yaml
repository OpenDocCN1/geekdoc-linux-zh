  md: 'From this menu, you can boot a previously installed system and start a rescue
    of a crashed system. However, since you are installing a new SuSE operating system,
    highlight Start installation and press OK.


    After choosing Start installation, you are prompted for a source media, which
    is usually from a CD-ROM. After highlighting it, press Enter and the system mounts
    the CD-ROM and starts YaST (another Setup Tool).


    Next you will be asked for the type of installation; there are four options, shown
    in Figure A.2.6 You can update an existing Linux system, using the expert mode,
    or install Linux from scratch. Choose to do the latter: highlight Linux from scratch
    and press Enter to continue.


    Selecting “Installing Linux from scratch” lets you choose use the partitioning
    tools or not. There are two options. The first is “Do not partition,” which will
    immediately move you to the next screen. However, if you do not have a partition
    on your new hard drive, you will be forced to abort, which sends you back to the
    screen shown in Figure A.2.6. Choosing “Partitioning” will scan for a drive and
    ask if you would like to use the “Whole hard disk” or partition manually with
    the Partitioning selection. Partitioning the entire disk will erase all data on
    the specified drive. After selecting the Partitioning option, press Enter.


    ![](img/c572f01d68eb481ab5b032d38aedfe98_206_0.png)


    Figure A.2.6 Choosing the type of installation.'
