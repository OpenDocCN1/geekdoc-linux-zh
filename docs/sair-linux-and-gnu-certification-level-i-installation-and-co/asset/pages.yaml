- img_proc: true
  md: '# Partitioning the Hard Disk


    To create a partition, press F5. A window pops up, asking whether you would like
    a Primary or Extended partition. Note that you are allowed to create only four
    primary partitions. If you need more partitions, you must specify one of these
    as an Extended partition. This will allow you to assign logical partitions inside
    the extended partition.


    If YaST was the partitioning, you could create a /boot partition of at least 2
    MB so the kernel could reside here. This would be a good idea if you planned on
    running multiple distributions of Linux. The reason is that you could update the
    kernel in one spot rather than in multiple places. Another reason is that in an
    old BIOS, the kernel might need to be placed on the first 500 MB of your disk
    so that it can be accessed.


    For this installation we will first create a swap space—choose Primary partition
    and continue by pressing Enter. The next screen (shown in Figure A.2.7) lets you
    choose your primary partition.


    After selecting /dev/hda and pressing Enter to continue, you will see a "Starting
    cylinder" input box. Generally, a swap partition is twice the size of the RAM
    in your machine, but not more than 128 MB. So in the Starting cylinder box, enter
    1 (for the first cylinder) followed by +128M in the End of partition box. Highlight
    Continue and press Enter.


    ![](img/c572f01d68eb481ab5b032d38aedfe98_207_0.png)'
