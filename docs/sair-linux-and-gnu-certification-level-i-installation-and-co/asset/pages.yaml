    # # Practice Questions


    This Installation and Configuration study guide has been organized into a discussion
    of the knowledge array proper (Chapters 1–6), a glossary of the main points covered
    these first chapters, and now a set of practice questions over the concepts, principles,
    and facts covered in the previous sections.


    These practice questions are designed to help you prepare for the Sylvan Metric
    S GNU Linux and GNU Installation and Configuration exam number 3XO101. A passing
    grade for the Installation and Configuration exam is 74% or more correct answers.
    Fifty questions are randomly selected from an item pool and presented for each
    test. You have 60 minutes to answer the 50 questions. Most test takers complete
    the exam in 20–40 minutes. We recommend that you use your time and the full hour
    to review questions before answering them. All 50 questions will be asked (it
    is not an adaptive test format), and you have the opportunity to go back and change
    an earlier answer if you choose to do so.


    # # About the Practice Questions


    This appendix contains just over 100 practice questions, based upon material presented
    in the earlier sections. Questions presented in the Sylvan Prometric'
