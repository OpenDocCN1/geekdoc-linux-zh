  md: '![](img/c572f01d68eb481ab5b032d38aedfe98_272_0.png)


    $PATH variable. An internal shell variable that contains a list of directories.


    $PATH variable, role. The shell searches the list of directories looking for the
    executable file name image and is, specified in the command.


    /proc directory. Provides access to routines that provide status information about
    the kernel.


    +   / character. Indicates the root directory volume (drive) that is hard-wired
    or built into the kernel image and is, therefore, known by the kernel at boot
    time. Also delimits directory names in a path.


    access port. To begin the login process, you must find a port that is monitored
    by the login program (initially the getty program), which is waiting for input
    from a user. (For purposes of simplicity, we will ignore the role of telnetd,
    which assists with access via the network).


    adapter conflicts. Adapters plugged into the buses may use the same parameter
    as another adapter. This means that both adapters would respond when the CPU attempted
    to communicate with one of them.'
  merge: -1
  pgno: 272
- img_proc: true
  md: 'adduser. Edits the password file, creates the home directory for the account,
    and copies in the default files from /etc/skel into the new directory.


    adduser, augmentation. A small script can be used to duplicate the arguments to
    adduser without setting up the configure file /etc/adduser.conf. In this way,
    adduser can be invoked with just the name of the new user account.


    application history file. Applications may save their state information in the
    initialization files, or other files, so that they may begin execution where they
    left off earlier.


    BIOS. Basic Input and Output System. A ROM-based set of routines that provide
    diagnostics, read/write services to devices, and are used to boot Linux. Unfortunately,
    the read and write routines only poll devices and cannot be interrupted during
    device operation.


    BIOS-based adapter configuration. Some vendors include the diagnostic and configuration
    programs in the ROM on the adapter card and provide the access at boot time by
    prompting the user to type a special combination.


    buses, PC. The IBM PC architecture employs a memory bus, a high speed input output
    (I/O) bus called the PCI bus, and an older backward-compatible I/O bus called
    the ISA bus.


    Case sensitivity. All files (including program names) in a Unix-like operating
    system must be accessed “as is.” The command line interpreter (bash or other shell)
    employs upper- and lowercase characters to differentiate among file and program
    names.


    cd command. Switches the current working directory to the specified directory
    and find relative file names.


    CD-ROM drives, ATAPI IDE. A new standard for IDE controllers. ATAPI IDE CD-ROM
    drives are accessed just like any other IDE drive; however, there often are compatibility
    problems with early ATAPI CD-ROM drives.


    CD-ROM drives, SCSI. Accessed through existing SCSI drives, and work well in the
    Linux environment.


    CD-ROM installation. Works great if Linux has the necessary driver for the particular
    CD-ROM; very fast.'
  merge: -1
  pgno: 273
- img_proc: true
  md: '# Glossary 253


    CLI, advantages. Linux shells offer the ability to perform many repetitive tasks
    with just a few keystrokes. Once the command shortcuts are learned, many users
    prefer a CLI to a GUI when to do similar tasks.


    client-server printer. Unix-like OSs divide the printing process into two parts.
    A client program accepts the print request and submits it to a back-end server.
    The server then takes cares of printing the data. In this way, the destination
    server printer may be local, remote, passed through a gateway, or the server may
    reside within the printer itself.


    configure disk partitions. Administrators most often select the custom install
    option so that they can best utilize the disk space available.


    console switching. Use the <Ctrl><Alt>Fx keys to select a new virtual console.


    copy and paste. Highlight the text to be copied with the left mouse-button, switch
    to the “destination” application, and paste with the middle button.


    copyleft. Refers to the nondraditional use of copyright to keep free software
    and to give the right of use and modification instead of reserving this right
    to a few.


    data cache. The data cache holds data blocks destined for the hard disk. If the
    system is abruptly turned off, then file information is lost and the file system
    becomes inconsistent. To minimize this problem, the daemon bdlush data cache blocks
    out to the hard disk every 30 seconds or so.


    data viewing, off-screen. Use the <Shift>Page Up key to review things that have
    scrolled off of a virtual console terminal.


    Debian attributes. It installs in “chunks,” with a default configuration with
    secure Internet servers, and provides robust package installations and upgrades.


    default file protection. Creating a file as the superuser means that the file
    may not be readable or writable by other user accounts and, therefore, the super-user
    account will have to be used to manipulate the files earlier.


    Deja. A special type of search engine since it specializes in searching all news
    group postings, and thus, quickly finding answers to obscure problems.


    device conflicts, types. The I/O address of the adapter card, the interrupt request
    line of the adapter card, the direct memory access channel, and shared memory
    addresses.'
  merge: -1
  pgno: 274
- img_proc: true
  md: 'device drivers. Map the physical characteristics of a device into a uniform
    logical interface that makes the device accessible by all parts of the kernel.
    Since Linux employs preemptive multitasking, it must provide its own interrupt-driven
    device drivers and avoid using the BIOS routines.


    device section. Tells the X server which parameters to accept and which ones to
    probe for the video adapter in the XF86Config file.


    disk divisions. Linux requires at least two partitions, one for the swap space
    and the other for the file system. If Linux requires the hard disk with another
    OS(s), more partitions may be required.


    disk partitions. Partitions are a means by which the firmware divides up the hard
    disk and presents partitions to one or more operating systems as disk volumes.


    domain name service. Not using the dot character to execute a program in the current
    directory may lead to a security problem where “pretend” system programs request
    and save user passwords.


    facilities. Messages are directed with the use of a facilities label, indicating
    the type of daemon message (mail, telnet, lpr, etc.) and the priority of the message
    (emergency, warning, debug, etc.).


    find, design tradeoff. The find command searches the complete directory structure
    from the specified starting point to each leaf. This requires thousands of file
    manager queries, and as a result, the program runs slowly. Unlike locate, the
    find command will perform an up-to-date search.


    format documentation. The file format section of the man pages describes the role
    of each field in a control or initialization file, and which programs read or
    write each field. A helpful guide when looking for a bigger picture.


    free software. Free software is generally open source and it may be used, modified,
    copied, redesigned and shared with others. Free software carries the built-in
    cost of requiring expert knowledge with regard to administration of the software
    package. The term free software refers to how the software is distributed, and
    not the viewing of the source code. There are forms of free software that are
    binary-only copies that may not be redistributed.'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# Glossary 255


    free software, computer professional use. GPL allows the computer professional
    the ability to exploit a highly evolved set of software tools that can greatly
    improve the productivity of the professionals especially when compared to traditional
    software development environments.


    free software, long-term commercial use. GPL software is just as much an attitude
    as it is an end product. Although it requires thinking “out of the box”, commercial
    users of free software will be able to achieve a much higher level of productivity
    through implicit cooperation in software development.


    free software business model. Businesses do quite well selling GPL software because
    they have switched their focus from a fee-for-product model to a fee-service model.
    The service can be a product in the form of reconfigured, or improved, software
    as well as traditional service. The business should expect that as much, if not
    more, income can be generated through the world-wide distribution of the lower
    cost software, which should lead to an extensive audience for future service.


    free software takes on a life of its own. It creates a community of programmers
    who freely share ideas to improve the software, and the software generally evolves
    into a product of better quality than any one individual or subgroup could have
    created by themselves.


    gateway. Linux distribution term referring to a router, or other host, that has
    a second network interface connected to the Internet.


    global initialization files. Global file settings are found in /etc and affect
    all users, but they have low-priority default settings.


    GNU GPL advantages. GPL software is open to peer review. As a result, faulty assumptions
    are usually identified and corrected. Moreover, tens of thousands of developers
    share the same development environment, allowing quick and easy sharing of ideas
    and implementations over the Internet.


    GNU GPL limitations. The limitations of the GNU GPL include those who provide
    new source code but who attempt to make the code unclear. Another limitation of
    GNU GPL is the question of how much documentation to include with the source code.
    Finally, there are those that feel the GNU GPL restricts the use of free software
    by not allowing it to be embedded into other software products.'
  merge: -1
  pgno: 276
- img_proc: true
  md: 'GNU GPL, uniqueness, GPL stands out from other software licenses because it
    keeps software intact, allows it to mature over many years, and prevents any one
    entity from controlling the software.


    GPL. GNU general public license, also called copyleft, is a detailed document
    describing the freedom to use software.


    GPL, keeping software free. The GNU GPL attempts to keep free software by mandating
    that all code, including source, must be included in any redistribution of the
    software, and any new code added to the software must be included in the redistribution.


    GPL, response to users. Acting from self-interest, many different developers,
    over time, contribute to GPL software. This public process leads to code review,
    fix bugs, and improved features that best meet the needs of all users.


    graphic mode. The organization of video memory in the number of X and Y pixels
    plus the number of colors per pixel.


    graphic mode filters. Printer filters may be attached to the printcap file to
    select PostScript or graphic-mode format for the printer automatically.


    graphic mode printing. In graphic mode printing, the CPU sends over the instructions
    for printing each pixel of an image.


    graphic resolution. The number of X and Y pixels plus the amount of information
    for each pixel (pixel depth).


    GUI, starting. A shell script called startx will run the X server and window mer
    from the command line if xdm is not running.


    GUI utility, tradeoff. Although convenient, these GUI configuration utilities
    perform multistep operations without informing the operator, and which may interfere
    with other configurations.


    help information, paging. Sometimes there is more information than will fit on
    a single screen and information scrolls off the top of the screen. Pipe the output
    to a pager utility, such as more or less.


    hidden window control. Some window managers allow full screen windows, but the
    control element may become hidden under another higher priority window. All is
    not lost—double-click the title bar, and the whole window will come to the surface
    allowing access to the window controls.'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# Glossary 257


    hierarchical menus. In a hierarchical menu, activating one selection causes another
    menu to pop up. Selecting from the second menu causes a third menu to pop up,
    and so on.


    indirect method. Symbolic file names with implicit start and stop commands that
    link (point) to the shell scripts in the rc.d directory.


    info limitations. The info system depends on contributions from individual program
    writers or third-party contributors, and as a result, the amount and quality of
    information varies from subject to subject. Also, some parts of the info system
    have yet to be completed.


    info utility. Designed to provide a broad view of system programs rather than
    the narrow man page format. Information is arranged hierarchically and a cursor-based
    user interface allows the selection of topics from various usage areas.


    init.d directory. Used by various distributions to hold indirect scripts.


    initialization files, X Windows system. The xdm and startx programs use separate
    initialization files to control the same GUI setup. The xinitrc is used by startx,
    and xdm uses the Xsession initialization file. The Xsession contents have higher
    priority over the commands in the startx file.


    insmod. Loads device drivers at runtime.


    insmod, tradeoff. insmod gives the administrator the flexibility to adapt to many
    possible configurations by allowing new device drivers to be added at runtime;
    however, eventually, the drivers should be compiled into the kernel to achieve
    better performance.


    internal commands. Note that some commands appear to be standalone utilities such
    as the cd command, but they are internal to the shell and do not respond to help
    requests.


    Internet installation. Must set up directories, transfer files, and check directory
    structure; very slow and error prone.


    IP address. An Internet protocol logical address assigned by a central authority
    that provides a way for others to reach your computer.


    kill command. The kill command is really a "send signal" command since it can
    send any type of signal to the specified program. One signal (#9) cannot be ignored
    by the program and it causes the program terminate.'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# 258 Glossary


    kill jobs. By switching to another login port, you can identify and terminate
    a program that has locked up, without having to reboot the system.


    LAN Network installation. Using either FTP, NFS, or SAMBA protocols, read the
    Linux software from another Linux box or MS-DOS file system; fast install.


    LILO. The Linux loader uses the BIOS to read from the floppy, hard disk, and CD-ROM
    to boot Linux.


    LILO append field. The append argument allows the system administrator to provide
    custom configuration arguments to the kernel.


    LILO command. By running the LILO program, the configuration information, along
    with the boot program, is copied into the MBR for subsequent system boot.


    LILO label field. The label argument specifies multiple OS images at boot time
    from which the user may select.


    Linux, booting methods. (1) With LILO from the MBR; (2) From a floppy disk; (3)
    From another operating system (loadlin, System Commander).


    Linux, installation steps. (1) Boot install program; (2) Partition hard disk;
    (3) Format partitions; (4) Dearchive software; (5) Configure boot-up sequence;
    (6) Set up X11.


    Linux, shutting down. (1) Type <Ctrl><Alt><Del> at the console to shut down and
    reboot the system; (2) become superuser and use the halt, reboot, or shutdown
    commands; (3) become superuser and shut run levels with init 0 command.


    Linux, user interfaces. Linux is a layered system; GUI programs depend upon lower
    level shells to execute commands. Not all shell commands are implemented with
    a GUI.


    Linux in-house warranty service. Millions of people use Linux without warranty
    service. The key is to develop a staff of qualified individuals who will provide
    the warranty service in-house through skill and use of Internet resources.


    Linux memory requirements. The exact amount of required RAM depends on the mix
    of applications run and can be as little as 4 MB or as much as the motherboard
    can hold.'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# Glossary 259


    Linux origins. Linux is the result of 20 years of GPL software evolution that
    recently has been packaged and configured by various vendors.


    Linux shells. Serves as the command-line interpreter that provides simple command-line
    editing, program execution, and flow control in the execution of shell scripts.


    Linux subsystems. The major Linux subsystems are kernel, network, init, daemmon,
    login, shells, utilities, and the X Window System.


    Linux warranty service. Even though Linux does not come with a warranty, there
    are many companies that will continue providing maintenance service for Linux
    thus, in effect, offering a warranty service.


    local initialization files. Local file setting are found in the user’s home directory
    and override global settings.


    Locate. Interprets its argument as some part of a file name or as a pathname to
    a file, and as a result, it displays all pathnames containing the argument.


    Locate design tradeoff. Locate provides fast response time by reading a database
    of path and file names, but the database will not reflect recent changes made
    to the file system.


    logging out. Use the end-of-file character, <Ctrl>D, or the shell commands exit
    or logout.


    lpc command. Queries the print server for status information on one or more printers.
    The superuser can use lpc to stop and start the server as well as clean the print
    queue.


    lpq command. Queries the local or remote server, depending on the printcap description
    of the printer location, for pending print requests.


    lprm command. Tells the specified print server to remove one or more print requests.


    is command. Displays the file names and permissions of files contained within
    a specified directory.


    magic filter. Converts between DVI and PostScript; also converts PostScript format
    into native graphic format for various types of printers.'
  merge: -1
  pgno: 280
- img_proc: true
  md: 'man k command. Searches only for keywords found in the title of each documentation
    page.


    man pages. Documentation on acceptable arguments for the program and how the arguments
    change the programs. However, the program is discussed in isolation with no consideration
    given to program interaction information.


    mark-up. In word processing programs, text display and text creation are two separate
    processes.


    memory size problem. Older SIMM mainboards tend not to have cache addresses that
    go beyond 64 MB. If this is true, the system will slow to a crawl (around 12 MHz
    with 70 ns memory) when memory references go beyond the 64 MB address range.


    menu disorientation. Unfortunately many menu items repeat in lower level within
    the menu hierarchy. So, for example, the linuxconf program menu selections are
    as follows:


    ```

    Config -> User accounts -> Normal->User accounts,

    ```


    you may become disoriented, and as a result, become confused about where you are
    “located” within the menu hierarchy.


    message direction. Syslog sorts, and if requested, duplicates messages into various
    files based upon directions in the /etc/syslog.conf file.


    modularity, hierarchical. System programs typically provide layers of functionality
    by placing commonly needed functions in lower level modules (programs) that higher
    level programs may use and share the lower level modules when the services of
    the lower level modules are needed.


    modularity, Linux. Linux is made up of many types of programs that are related.
    Although each program may stand alone as a result of being modular, its true value
    is not apparent until it is interacting with other system programs.


    monitor refresh rates, differences. The XF86Setup utility offers a range of approximate
    refresh frequencies only where exact and optimal refresh frequencies can be obtained
    from the “monitor” file.'
  merge: -1
  pgno: 281
- img_proc: true
  md: '# Glossary 261


    monitor section. List possible graphic modes and the refresh rate for each graphic
    mode in the XF86Config file.


    mount point. A directory where the file manager switches from the root file system
    (the hard disk) to another device, such as the CD-ROM or floppy diskette.


    mounted CD-ROMs. A mounted CD-ROM cannot be removed from the drive since the eject
    button is disabled while the CD is mounted. CD-ROMs are mounted as read-only volumes,
    which means that permission-refused error is returned (as opposed to device error)
    to the program that attempts to write on the CD-ROM.


    mounted disks. You would want to mount a disk so that another application, such
    as WordPerfect, can directly access files on the device. Access to an unmounted
    disk is available through the mtools programs as read and write. Accessing the
    disk with mtools avoids the need for mount and unload commands.


    mounted volumes. Access to (physical) volumes is controlled by associating a given
    disk or one of its partitions with a (logical) directory name. Switching to that
    directory provides access to files within that volume.


    mouse interfaces. The two common mouse interfaces are the PS/2 (/dev/psaux) and
    serial port (/dev/ttyS0).


    mouse protocols. The two common protocols are Microsoft two-button and MouseSystems
    three-button.


    multitasking. The ability to save the state of the program, select another program
    to run, restore the state, and run the selected program from the point where it
    was previously suspended.


    multivol. Administrators often configure multiple volumes so that in the event
    of disk overflow, other key system programs are able to continue running.


    named and unnamed volumes. Most OSs name each disk or hard disk partition and
    the name must be known by the user to access files. However, on a Unix-like OS
    there are no names for a given volume.


    nenscript filter. Translates ASCII output into multipage PostScript format.'
  merge: -1
  pgno: 282
- img_proc: true
  md: 'newusers. Adds passwords where the other programs will not, but it also encourages
    the system administrator to leave a plain-text list of passwords somewhere on
    the system.


    nice command. Lowers the specified program''s priority by increasing its priority
    number from 0 to 20.


    odd controllers. Early CD-ROM drives were initially attached to a variety of sound
    cards. These types of controllers required a driver that can access a particular
    CD-ROM model through a particular type of sound card.


    one-at-a-time configuration. This method of configuration is required because
    it lacks with conflicting values were installed, the CPU would be unable to communicate
    with either card. The power should be turned off so as not to damage the cards.
    Once one adapter is configured to a different parameter, the other may be installed.


    online documentation. The Internet provides three types of online documentation.
    One type is made up of Linux repositories HOWTOs, FAQs, and some manuals on Linux
    components. The second type consists of news outlets for business and individuals
    as well as news groups. The third type of documentation results from information
    obtained from search engines such as Altavista, Hotbot, Yahoo, and Deja.


    open source. Open source software usually refers to a software package that contains
    binary and source code that may be used, studied, and modified, but remains under
    the control of the license holder. Open source software carries the built-in cost
    of requiring expert knowledge with regard to administration of the software. This
    term is used to describe the viewing of the source code, and not the distribution
    of the software. There are forms of open source software that do not permit code
    modification and restrict generic viewing of the source code.


    Open free software makes some people nervous. Historically, many companies rely
    upon vendors to support their products. Typically, vendors offer a “no-charge”
    period of support called a warranty period. Linux has no such warranty period.


    P switch. Permits selection of other printers besides the default name 1p. Many
    times a remote printer is available, but access to the printer requires use of
    the P switch.'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# Glossary 263


    password. A secret combination of letters and numbers used to verify the account
    owner.


    PC 100 memory. Newer mainboards use high-speed memory (9–10 ns) that runs faster
    than traditional cache (20 ns) and, therefore, provide high-speed access throughout
    system memory.


    permissions. Each file and its associated directory have access permissions based
    upon the concept of owner, group, and others. Access permissions are read, write,
    and execute. If the file is a directory, then the execute permission is interpreted
    as a search permission for the owner, group, or others.


    port switching. This refers to the use of one of the console virtual terminals,
    the X Window system windows, hardwired TTYs, or the network, to switch among logical
    terminals so that you can establish multiple login sessions using either the same
    account or a new account.


    PostScript printers. PostScript is a middle-level language that describes the
    type of graphic images to be displayed on the printer; however, the printer must
    be able to translate the PostScript descriptions into pixels.


    preemptive scheduling. The ability of the kernel to stop one program and lower
    its priority so that another program may run immediately.


    primary and extended partitions. Only four primary partitions are allowed by the
    BIOS. If more are needed, then one of primary partitions is transformed into an
    extended partition and it contains the necessary additional logical partitions.


    print filters. Print filters translate the content of files between two types
    of format.


    printcap file, four key definitions. At minimum, each printentry should describe
    the logical name of the printer, its spooling directory, its error report file,
    and, if required, a print filter.


    printcap file, role. The printcap file describes the various printers that are
    directly connected to the local machine or to the network.


    printcap server chaining. The remote machine field (rm) on one server may refer
    to a similar (rm) entry on another machine, allowing each machine in the chain
    to pass the print job to the next link in the chain.'
  merge: -1
  pgno: 284
- img_proc: true
  md: 'Priority, message. Syslog messages are directed with the use of facilities
    label indicating the type of daemon message (mail, Telnet, lpr, etc.), and the
    priority of the message (emergency, warning, debug, etc.).


    private protocols. Some hardware vendors will not release the private data communication
    protocols that sit between the CPU and peripheral, thereby preventing others from
    writing device drivers for those devices. These newer devices tend to have less
    hardware and require the CPU to perform more detailed operations.


    probing tradeoff. Probing is quick and easy; however, all features are usually
    not caught in the probe. Thus, manual specification in the XF86Config file will
    override the probe values and enable the extra features.


    program assistance. Most Unix-like programs provide help information in response
    to one or more of three types of queries: "-\?", "-h", or "--help."


    ps command. Displays the number of processes activated by the user.


    pseudo file system. A pseudo file system is an entity that looks like a directory
    but which really provides access to another kernel routine.


    rc.d directory. Used by various distributions to hold the run level scripts.


    Red Hat attributes. The most available, has an easy installation procedure, and
    X window configuration tools.


    refresh rate. The higher the resolution, the faster the CRT must be refreshed.
    However, refresh rates are independent of a particular resolution.


    refresh rate, tradeoff. The more graphic information displayed, the slower the
    monitor refresh rate. Refresh rates of 60 per second or less tend to cause ey
    strain when viewing the CRT.


    restricted account. The login process usually ends with a copy of the shell waiting
    for commands, but an account could be configured to run just one program. Termination
    of the program would also log the user out of the system.


    run levels. A group of programs (shell scripts) run by the init program that determines
    the operating mode of the OS (i.e., single user, multi-user, etc). Two consistent
    run levels over various distributions are (a) run level 0–system shut down and
    (b) run level 6–bring up the system.'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# Glossary 265


    run levels, types of. (1) single-user (shell) at the console; (2) multi-user with
    networking; (3) multi-user with networking and GUI.


    screen section. Lists which graphic modes the X server should try to support (assuming
    the video adapter has the capability) and the size of the virtual desktop.


    scripts. Made up of one or more shell commands located in a file. Syntax differs
    among shells, but all scripts have flow control constructs.


    shell interactivity. The shell provides command history and command completion.
    Command history displays and replays previous commands. Command-completion completes
    the directory name, file name, or command name when the <Tab> key is pressed.


    shepherding software. The GPL revolutions thinking about software changing it
    from protectionist to shepherding perspective. Software is distributed without
    control mechanisms, yet the software creator will watch the news groups to coordinate
    and otherwise maintain the software as it grows and matures in the hands of many.


    spool directory. A spool directory separates the request from the action and allows
    the user to delete a file after the request has been issued but before the printing
    has taken place.


    Stallman, Richard. Invented the idea of using copyright to protect software from
    being controlled by any one person, group, or company.


    STAT column, ps command. Shows the state of each process. The process could be
    sleeping, swapped, or running.


    superuser. Any user account that has the value of 0 as the UID. If the user account
    UID is 0, then the file manager does not enforce permissions before performing
    the requested action.


    SuSE attributes. It is the most complete, provides all software on six CDs, and
    has a robust and easy-to-use configuration tool called YaST and an X11 configuration
    tool called SaX.


    swap drives. Linux uses partitions as swap devices to improve the speed at which
    programs move between the hard disk and main memory (RAM). The disadvantage of
    swap devices is that once allocated, the swap storage cannot be used for files.'
  merge: -1
  pgno: 286
- img_proc: true
  md: 'syslog daemon. Since background programs do not have a controlling terminal
    to report to, they send their status messages to a centralized dispatcher called
    syslog.


    tkman utility. Offers a true GUI front-end to the man pages. Offers significant
    improvement over man by displaying the table of contents for each man section.
    Also provides for detailed regular expression searches within manual pages.


    TTY column, ps command. The TTY column shows which console, direct-terminal, or
    network connection the user is logged into.


    UID. When looking up a name for an account, the first matching UID is used. This
    means that if two users have the same UID, the system programs will show that
    the first name listed in the passwd file is said to own the file.


    user account. Defines the files that a user owns and what access the user may
    have to other files. Unlike Linux, you must enter through an existing user account
    that has been set up by the system administrator. When set up by the superuser,
    the user account associates an ID with file ownership and establishes permissions
    to access files owned by other accounts.


    useradd. Creates new accounts and requires superuser status; useradd has a companion
    program userdel, and has a different configuration file from adduser.


    vendor floppy. Most adapters come with a floppy that has diagnostic and configuration
    programs. Simply boot the machine with an MS-DOS floppy and run the configuration
    directly from the vendor floppy to configure an adapter.


    video controller. Reads data from video memory, and based upon its mode, provides
    a scan rate to the digital-to-analog converter for display on the monitor.


    video memory. Accepts data from the CPU and offers access to the video controller.
    Data is arranged in video memory according to the current graph mode.


    virtual desktop. X11 provides an extra level of control by offering multiple windows
    on a desktop and multiple virtual desktops that are larger than the screen.


    volumes. Partitions seen from the perspective of the OS. A volume could be an
    entire hard disk, a hard disk partition, or a logical partition within an extended
    partition.'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# Glossary 267


    w command. Provides a summary of the system state, on which terminals users are
    logged in, and from which network host they logged in. The w command provides
    more of an overview of the system performance than the who command.


    who command. Displays a list of logged in users and on which terminals logged
    in.


    WYSIWYG. "What You See Is What You Get." In word processing programs, the text
    is displayed as it is entered. Files contain binary control characters that allow
    only the word processor to access the text document.


    X file. A symbolic link to an instance of the X server that matches the video
    adapter.


    X server. The video driver for the X11 system. It accepts logical commands from
    the window manager and transforms these requests into the screen display commands.


    X11 architecture, five components. X server, widget library, themes, window manager,
    GUI applications.


    X11 configuration files. Found in /etc/X11 on newer distributions; otherwise found
    in /usr/local/X11R6.


    X11 programs. Usually found in /usr/X11R6/bin.


    Xconfigurator. Found only on Red Hat systems, and it does not include mouse configuration.
    A separate utility, mouseconfig, must be used to set up the X mouse.


    xdm. Presents a graphic login screen, runs the login program, and starts the X
    server and window manager.


    XF86 VGA16. The "lowest denominator" video driver. Although it works with all
    adapters, its limited 640x480 16-color resolution is not acceptable for typical
    GUI applications.


    xf86config, tradeoff. Generally, users do not use this command-line verbose for
    X configuration. There are many pages of text, lists of items to read, and items
    identified by their numbered position within a list. On the other hand, this program
    reads an external file for the list of available X servers, so it tends to be
    more up-to-date many GUI configuration tools.'
  merge: -1
  pgno: 288
- img_proc: true
  md: 'xf86config.eg file. Provides a template of sections that can be configured
    for system specific options, including the mouse, video adapter, and monitor.


    XF86Setup, tradeoff. GUI setup tool and found on most distributions. Not the easiest
    configuration utility, but generally available for quick re-configuration.


    xinfo utility. X windows version of info; essentially the same program as info.
    A menu bar was added to xinfo, but its buttons change position depending upon
    which level of the hierarchy the program is visiting.


    xman utility. X windows version of man. Offers significant improvement over man
    by displaying the table of contents for each man section.'
  merge: -1
