  md: '# Logging Out


    Logging out of the system depends on how the shell has been configured. By default,
    the shell will accept the end-of-file (EOF) character `Ctrl+D` as the termination
    command and return the user to the Login prompt. Alternatively, some shells may
    be configured to prompt the user to use the built-in shell commands `logout` or
    exit.


    # Data Cache and System Shut Down


    The goal of a data cache is to reduce long I/O delays by saving previously accessed
    disk blocks in main memory so that they are quickly accessible when needed (the
    blocks are flushed to the hard disk when they are no longer needed).


    As an aside, the Linux kernel has a data cache mechanism compared to other Unix-like
    OSs. In Linux, the data cache grows and shrinks in size depending on the amount
    of memory not used by other programs. Approximately 1.5 MB of memory is left unallocated
    for new programs, and the remainder is given to the data cache. As a result, it
    is not uncommon to see the data cache occupy—one to two-thirds of physical memory.
    This is one reason Linux is one of the fastest OSs being used.


    The problem, of course, is what happens in the event of a power failure, or if
    someone turns off the computer? The simple answer is that the disk blocks in main
    memory are lost, and the file system is corrupted and reconstructed. Linux will
    minimize this problem by periodically saving any outstanding modified disk blocks.
    Therefore, to turn off Linux, you must first terminate the system programs that
    reset open files and flush the data cache before termination.


    # Shutting Down Linux


    Linux can be turned off with signals or commands given to the ancestor, or parent,
    of all programs—the `init` program. Anyone can generate the bottom-up I/O signals
    to send to `init`, such as “power failure” or “reboot,” but only the superuser
    may issue commands to the init program. The central program is named “shutdown,”
    and it is called from other programs in various ways:


    +   A direct call to the utility with the English argument "now."


    +   Effectively the same as issuing `shutdown -h now."


    +   Effectively the same as issuing `shutdown -r now;` that is, the shutdown program
    is called with the reboot option indicated via the -switch.'
