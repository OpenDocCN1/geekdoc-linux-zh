  md: "# Number Lock Is Not on Default\n\nUse the setled program to turn on the NUM\
    \ LOCK function. To do this at boot time for all the virtual consoles, put the\
    \ following shell script in /etc/rc.local or one of the /etc/rc.d/* files.\n\n\
    ```\nfor t in 1 2 3 4 5 6\ndoo\n    setleds +num < /dev/tty$ >/dev/null\ndone\n\
    ```\n\nThe shell script employs a for loop controlled by the shell variable t.\
    \ It runs the setleds with the +num argument for virtual terminals 1 through 6\
    \ /dev/tty[123456], turning on the NUM LOCK key, and redirecting any errors to\
    \ the bit bucket /dev/null.\n\n# X Window System Error: Cannot Open Display:0.0\n\
    \nThe shell variable DISPLAY must be configured. Use the command: DISPLAY=localhost:0.0\n\
    \n# Daemons and System Message Logging\n\nOne key to Linux system troubleshooting\
    \ is knowing where to look for runtime error messages. More than not, it is forgotten\
    \ that all background programs (daemons) and many system utilities report general\
    \ status and error information to a message logging called syslog. The syslog\
    \ usually places information into log files in the directory /var/log. Because\
    \ of the rich amount of information contained within these files, generally only\
    \ the superuser may access them. Exact file names depend upon how /etc/syslog.conf\
    \ file was set up by the Linux distribution. Typically, there is a file called\
    \ messages that collects system status reports. There are also files (or types\
    \ of daemons) that direct specific messages to individuals. For the Debian system,\
    \ /var/log files are:\n\n| auth.log daemon.log debug faillog |\n| kern.log lastlog\
    \ lp-acct lp-errors |\n| lpd-errors lpr.log mail.err mail.log |\n| mail.warn messages\
    \ setuid.changes syslog |\n\nFor a Red system, the default /var/log files are:\n\
    \n```\ncron maillog sendmail.st wtmp\n```"
  merge: -1
  pgno: 182
- img_proc: true
  md: '# 162 Chapter 6


    | dmesg | spoole | xdm-error.log |

    | lastlog | secure | uucp | xferlog |


    The number and names of the /var/log files are controlled by the file /etc/syslog.conf.
    Its format looks like this:


    ```

    *=info;*:notice;*=warn:\nauth,authpriv.none;:\ncron,daemon.name:\nmail,news.name

    /var/log/messages

    ```


    This example was extracted from a Debian configuration file. The column at the
    top left shows the priority levels (where facility.level is the format for those
    facilities with a level indicated, such as news.none or user.notice, and where
    facility is the format of those facilities without a level indicated, such as
    lpr). All priority levels are included since the wild character (*) was specified
    to the right side of the doi. (For example, considering the user facility, there
    are messages with priority levels info, notice, and warn so that the format for
    each of the facilities becomes user.info, user.notice, user.warn and all of these
    messages are collected in the log file /var/log/user.log).

    The user may also insert messages into the message log file with the logger command.
    For example, the command:


    ```

    logger "Hi, What''s up"

    ```


    the string "Hi, What''s up" in the messages file.

    So, if something does not seem right, remember to check the most recent additions
    to the messages file with the command:


    ```

    tail -300 /var/log/messages | more

    ```'
