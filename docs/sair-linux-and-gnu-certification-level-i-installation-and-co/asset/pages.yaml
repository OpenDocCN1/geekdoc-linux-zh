    # Five Components of the X Window GUI Architecture


    The X Window System is made up of a series of modules that reside outside of the
    kernel and provide layers of increasing functionality that build into a complete
    GUI. Recently, there have been additions to the Linux kernel, called frame buffers,
    that bring some of the X Window routines into the kernel to provide improved performance.
    The X Window System is easily accessible through the network as well as the system
    console. One note on terminology—the term X server refers to the device driver
    communicate directly with the video adapter; therefore, the X server in a network
    configuration will be running on the client machine. Setting up the X Window System
    is the most demanding aspect of Linux configuration. The reason is that each module
    represents an independent component and each component has its own configuration
    parameters.


    **X Server.** The lowest-level component is the X server, which controls the hardware.
    The X server puts the video adapter into graphics mode (in the same way that a
    printer is used in graphics mode). The X server accepts logical commands from
    higher level software (such as: move the mouse cursor) and translates the commands
    into a series of I/O operations on the video adapter.


    **Display Manager.** The second component is the X Window display manager, or
    xdm. It configures an environment and sets up a graphical login screen. The screen
    can be plain, show system log messages, have animated graphics, show status etc.
    Upon successful login, xdm launches the window manager. However, some parameters
    specified in the xdm initialization file have higher priority than those specified
    in the window manager. Red Hat 6.0 configures the GNOME display manager (gdm)
    by default, which allows the selection of window manager before logging into the
    system.


    **Widgets.** The third component in the X11 system are the widgets, or desktop
    environments. These library routines build and form the components within a window,
    such as scroll bars, menus, task bars, pop-up menus, requester boxes, etc. Example
    widget libraries include LessTif (a open source version of the commercial library
    called Motif), GTK+ (a GPL'
