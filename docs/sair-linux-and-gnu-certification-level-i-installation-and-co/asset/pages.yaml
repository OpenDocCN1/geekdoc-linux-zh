  md: '# Troubleshooting 157


    # Booting Rescue Disks


    If the system was not bootable then a standalone (rescue) boot disk is required.
    Each distribution has its own type of rescue disk. Here is an example technique
    based on the Red Hat 6.0 distribution:


    +   - Boot the install floppy disk or CD-ROM.

    - Type rescue at the boot prompt.

    - Insert the rescue floppy (extended RAM disk) and type <Enter>.


    Once the kernel has booted, one shell runs as the superuser. Mount the hard disk
    into the RAM file system with the following command:


    ```

    mount /dev/hda2 /mnt

    ```


    Next, change directory to the /etc directory on the hard disk with the following
    command:


    ```

    cd /mnt/etc

    ```


    The vi is not on the rescue disk, so invoke the vi editor from the hard disk to
    edit the rescue file and remove the old superuser password.


    ```

    /mnt/bin/vi password

    ```


    After the password has been edited, flush the file to the hard disk with the unmount
    or sync command.


    ```

    umount /dev/hda2 (or sync)

    ```


    Remove the floppy disk and reboot the system. The SuSE 6.1 distribution also offers
    a rescue disk directly off the CD-ROM. To use it, boot up the CD-ROM as if you
    were going to re-install SuSE. After selecting thestart install" menu, select
    "start rescue.

    If you cannot boot the CD-ROM, a rescue disk alternative is Tom''s root boot (rtrbt)
    floppy disk (www.toms.net/rb/). The rescue floppy was created by Tom Oehser has
    a complete Linux OS. Similar to the other rescue images Tom''s rtrbt creates two
    RAM disks of utilities. Tom''s rtrbt also has special tools for checking and repairing
    file systems.


    # Boot and L login Errors


    Following are some of the possible errors, along with suggested solutions, that
    may occur once the Linux distribution is up and running.'
  merge: -1
