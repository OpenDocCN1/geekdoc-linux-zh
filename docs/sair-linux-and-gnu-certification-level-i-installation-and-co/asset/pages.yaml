    # Printer Use


    Linux users have three basic services for printing: the lineprinter request or
    lpr program, the lineprinter queue or lq program, and the lineprinter remove request
    or lprm program. A fourth interactive program, for the superuser, is called the
    lineprinter control or lpc program.


    # Lineprinter Request–lpr


    To print a file, issue the lpr command with several arguments. A typical command
    is:


    ```

    lpr -P laser -h -s filename.ps

    ```


    In this example, the lpr program is directed to the printer as opposed to the
    default printer lp. The -s switch suppresses the job page containing the account
    and host name. The -s switch allows the passing of files greater than one-or-more
    megabytes to the printer (which is usually the case for PostScript files). The
    BSD lpr program would refuse to copy these large files into the spool area. The
    -s switch would create a symbolic link back to the user’s copy of the file, which
    removed the need to copy the file into the spool directory. In the new LPr program,
    the -s switch is not necessary.

    If typing all those characters seems like too much bother, then maybe this shell
    script can help. The executable shell file is called plj and contains the following
    line:


    ```

    lpr -h -s -P laser $1

    ```


    Now, the command plj filename.ps passes the file name to the lpr program with
    the correct arguments.


