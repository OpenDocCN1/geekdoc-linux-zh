  md: '# Installations 207


    For an easy start, just press Enter and Slack should automatically detect your
    hardware and go on to the actual installation

    Slack will minimally boot up for installation, and you’ll have the screen shown
    in Figure A.4.2.

    At this scene, type “root” at the Slack login prompt and press Enter.

    After logging in as root, you can actually start the installation if you have
    already partitioned your hard disk in Linux format. If you have not yet done so,
    you may do so by typing fdisk or cfdisk at the # prompt.


    # fdisk to Partition the Hard Disk


    To use the fdisk program, just type fdisk at the # prompt. If you don’t specify
    any parameters after the fdisk, it will take /dev/hda, which is the first IDE
    device, as the default drive. However, if you want to partition the first SCSI
    disk on your system, you might want to specify that parameter when you start fdisk
    by using the following command:


    ```

    fdisk /dev/sda

    ```


    Or, if you plan to partition a different IDE hard drive other than the first one,
    you can specify it by:


    ```

    fdisk /dev/hdb

    ```


    Once in fdisk, the program will wait for your command at the following prompt:


    ```

    Command (m for help) :

    ```


    ![](img/c572f01d68eb481ab5b032d38aedfe98_228_0.png)


    Figure A.4.2 Install the login screen.'
