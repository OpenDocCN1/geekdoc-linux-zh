    proc on /proc type proc (rw)

    /dev/hdb on /var/src type iso9660 (ro,noexec,nosuid,nodelv)

    ```


    By examining this table data, you can see that the directory /var/src switches
    to the CD-ROM drive. Also, it should be noted that the eject button is disabled
    when the CD-ROM is used. The unmount command (called umount) to unmount the CD-ROM
    and reenable the eject button on the CD-ROM drive. Finally, the CD-ROM is mounted
    “read only,” meaning that when a program attempts to write to the CD-ROM, it is
    refused permission as opposed to receiving a write error from the device.'
