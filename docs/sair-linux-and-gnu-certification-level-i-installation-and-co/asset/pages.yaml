  md: '# Shells and Commands 83


    Unfortunately, aliases are user account specific, and as a system administrator,
    you''ll find yourself continually switching among user accounts and multiple systems.
    Therefore the convenience of aliased commands is overridden by the inconvenience
    of not having aliases available as you move around systems. Also, it should be
    noted that by default Red Hat 6.0 aliases commands cp, mv, and rm with the -i
    or interactive switch. Some users find the question “Are you sure?” every time
    they want to copy, move, or delete a file.


    By the way, if a command behaves in an unexpected fashion, the backslash to escape
    the preceding `!ls $LS_OPTIONS` command and just perform the simpler `!ls` command.


    # I/O Redirection


    In Unix-like systems such as Linux, input and output are handled via three I/O
    channels known as standard input (stdin), standard output (stdout), and standard
    error (stderr). Just as the names imply, input comes from the stdin I/O channel,
    and every output is directed to the stderr I/O channel.


    Normally, the stdin I/O channel is associated with the keyboard and stdout. However,
    there are some special characters that can be used to redirect the input for stdin
    or to redirect the output for stdout. These characters are “>” and “<”. Stderr
    can be redirected as well, should need arise.


    As an example of output redirection, consider the following:


    ```

    bash$ ls > directoryListing.txt

    ```


    If ls were alone, the output would be sent to stdout, which is usually associated
    with the terminal screen. However, in this example, a redirection operator has
    used to send the output of ls to directoryListing.txt. This means that the current
    value (output) of ls has been saved in a file so that it can be viewed again or
    manipulated.


    Standard input, or stdin, works much the same way as standard output does. It
    allows you to redirect a program’s input so that it may come from a source other
    than the keyboard. If, for example, there was a program called printNames, and
    the input was come from a text file called printNames, then the printNames program
    would be executed as:


    ```

    bash$ printNames < names

    ```


    Table 3.1 contains a list of the redirection operators and their functions'
