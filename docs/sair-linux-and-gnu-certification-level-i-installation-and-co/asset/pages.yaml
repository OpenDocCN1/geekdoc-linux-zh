- img_proc: true
  md: '# Theory of Operation 17


    2. Interrupt Request (IRQ). There are only about five IRQ lines and another adapter
    may already have allocated the IRQ line you are trying to configure.


    3. Address area of memory shared by adapter and CPU. Adapters generally offer
    only a few address options and another adapter may already be using the memory
    address range.


    4. Direct Memory Access (DMA) channel. There are only seven DMA channels and another
    adapter may already have allocated the DMA channel you are trying to configure.
    Even though there are four possible parameters, only three of them may be in conflict.
    The reason is that ISA adapters communicate with the CPU either via shared memory
    or via DMA, but not ways.


    # Possible PCI Incompatibilities


    Note that PCI adapters have changed firmware versions since they were first introduced,
    and it is not uncommon for an older PCI adapter to fail in a newer PCI slot. Also,
    note that the PCI modem or Ethernet adapter employs the same ISA interrupt values
    (for backward compatibility), then IRQ conflicts may exist among PCI and ISA adapters,
    not just among the ISA adapters. Finally, be aware that each PCI slot priority
    is based upon its physical location. The lowest priority PCI slot is next to the
    ISA slot and the highest priority slot is towards the CPU. Sometimes high-speed
    small computer interfaces or SCSI PCI adapters may have intermittent problems
    as a result of being placed in a lower priority PCI slot than other PCI adapters.


