    to miss more options than they find. So, if other parameters (such as the amount
    of video memory) are known about the video adapter, select the values as opposed
    to selecting “probe”.


    Monitor. The monitor menu displays 10 types of monitor categories, each with different
    frequency capabilities. Select the horizontal and vertical frequencies that are
    less than or equal to your monitor. Do not select frequencies that exceed the
    monitor specifications.


    Modeselection. The XF86Setup utility presents a column of graphic modes ranging
    from 320 x240 up to 1600 ×1200 pixels. There are also four color-depth buttons
    ranging from one-by-pixel to four-per-pixel.


