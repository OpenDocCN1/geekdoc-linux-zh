    | --- | --- |

    | Synopsis | ln [-s -v -i] source_file dest_file_or_directory |


    Description Creates a link to directories or files.


    +   Options

    -s Creates a symbolic link instead of a hard link (which, ln is the default).

    -v Verbose mode.

    -i Interactive mode.'
