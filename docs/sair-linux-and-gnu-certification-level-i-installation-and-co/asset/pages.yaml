  md: '# Troubleshooting 155


    This floppy will be very important in effecting recovery in situations where the
    system fails to boot or fails to allow anyone access. If such a situation occurs,
    the user files become unreachable, and without the boot diskette a new version
    of Linux would have to be installed, erasing the root partition in the process.(As
    a last resort, before erasing the root partition distributions allow an upgrade
    or expert path through the install program that may reach the section where a
    boot disk can be created.)


    # How the Boot Diskette Works


    A boot diskette consists of two sections: the compressed kernel image and a RAM
    disk image called `initrd`. The boot process reads a compressed system image from
    the floppy disk and stores the files in memory (not on the hard disk) through
    a special device that makes main memory appear to be a RAM disk. Next, the kernel
    is read into main memory and started. The kernel, mounts the RAM disk as the root
    partition. Thus, from one floppy a complete standalone version of Linux is booted.
    Once booted, the hard disk can be mounted, examined, and modified as required.


    # Reasons for Using the Boot Diskette


    Following are three common ways to use the boot diskette.(Creating custom versions
    of boot disks will be covered in a later study guide.)


    # MBR Corruption


    If the `fdisk` program was run improperly or if the first sector (master boot
    record) of the hard disk is changed, the system will not boot. The solution is
    to refresh the MBR with the LILO program, which can be run from the mounted hard
    disk.


    # Password File Corruption


    Through either careless or malicious act, the password file can be deleted and,
    thereby, prevent any login. There are two possible solutions to this dilemma.
    The first approach depends upon whether a backup copy of the password file exists.(If
    your system does not make one automatically for you, for Debian 2.0, hopefully
    the system administrator has done so.)Following this approach, the solution is
    to copy the backup of the password file over the original, now-corrupted password
    file (called `passwd`). However, if the first approach is not enough, the second
    approach is to create a new password file for the root account. This technique
    can also be used to remove the super-user password if it has been forgotten.'
  merge: -1
  pgno: 176
- img_proc: true
  md: '# Lost Dynamic Load Module Library


    Newer versions of Linux use dynamic load modules that have only the name of one
    or more library modules in the executable program, or the ELF binary files. If
    a required library file is corrupted or lost, the ELF binary that needs that library
    will not execute. In other words, the shell that started the program will continue
    to run, as will its internal commands (such as cd), but any other external command
    (such as ls) will not be able to find its runtime library module. The solution
    is to mount the hard disk and copy the backup library file on top of the bad library
    module and reboot the system.


    # Alternate Boot Methods


    There are many ways to boot up an OS and Linux is no exception. As we review these
    methods, you should be aware there is no protection from unauthorized access once
    an experienced user gains physical control of the machine.


    # Booting the Existing Hard Disk


    It may be possible to still boot from the MBR in the latter two cases; if so,
    use the following arguments to LILO to skip the normal initialization process:


    ```

    boot: vmmlinuz init=/bin/bash

    ```


    In this example LILO prompts the user with the boot: message. The user enters
    the name of the kernel (vmlinuz). The argument root is used to specify the root
    device, and the argument init is used to specify the starting program. After booting
    the system, one shell will run as the superuser (UID 0). The superuser then types
    the following mount command to switch the readonly file system to read/write:


    ```

    mount -n -o remount,rw /

    ```


    In the next command, the superuser edits the password (or the superuser could
    copy over a new dynamic load module library, etc.). In this case, the old superuser
    password is deleted by editing the shadow or passwd file.


    ```

    vi /etc/shadow or passwd

    ```


    The command flushes any changes to the disk with the mount command, and the system
    is rebooted.


    ```

    mount -o remount,ro /

    ```'
  merge: -1
