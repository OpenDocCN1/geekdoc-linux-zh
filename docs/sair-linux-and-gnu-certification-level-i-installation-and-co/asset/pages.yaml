  md: '# Applications 137


    the man command searches each of its sections comparing the keyword to the title
    of each man page. Unfortunately, the man command does not search the body of each
    page, and as a result, the search results are usually incomplete.


    # Using Section Five


    One surprising way to get a glimpse of the big picture is to look at the format
    specification of the various initialization and control files. These specifications
    are found in section (5) File Formats. Much of this information goes undetected
    unused since the man -k topic only checks the title of the file, and users rarely
    use the exact file name as a topic. To see how programs interact with each other,
    use the name of the control file and explicitly specify the format section of
    the manual pages with a command like:


    ```

    hostname man 5 passwd

    ```


    The resulting man page will describe each field of the password file in detail
    and list all the programs that use the control file to carry out their activities.


    Two related commands are the apropos command, which is the same as the man -k
    command, and the whatis command, which displays the title of the manual page.


    # The File System Name Database


    Although the locate program does not provide access to documentation, it is, nevertheless,
    an helpful command. Locate can be used to reveal the file system layout, the types
    of configuration files employed in the system, and available programs.


    The locate program is fast, easy to use, and is usually among the first steps
    you would take in trying to discover more information about a file, command, or
    utility. The locate program searches the complete file system and reports any
    entry (directory name, file name, or device name) that matches the sub-string
    as an argument to the locate command. For example, to cover more about the location
    of the X11 system and its associated programs that have been configured for a
    particular distribution, enter the command:


    ```

    locate x11 | more

    ```


    The pager more was invoked since there will be many directory entries that have
    the subtitle X11. Scanning the output reveals where the X11 directories are located
    as well as the X programs and document files available.


    The locate program is fast because it searches a database of directory and file
    names rather than asking the file manager to step through all the file system'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# 138 Chapter 5


    nodes sequentially looking for the file name. Thus, the locate utility also prevents
    ling down Network File System (NFS) configured systems since it avoids the network
    as well as the remote file manager.


    However, one problem with locate is that search results may be incomplete or stale
    if the target file or directory was recently added and the database has not yet
    rebuilt. To locate old files that have been added recently, run the updatedb utility
    before running the locate program.


    # Exhaustive File System Searching


    The program is similar to locate but, unlike locate, it is slow. It differs from
    locate in that it thoroughly searches every branch of the directory hierarchy.
    The find program provides additional options. Two of the most used options are
    (a) the option to find files relative to the creation, access, or modification
    time of another file, and (b) the option to run additional commands upon discovery
    of the search target. Because of this flexibility, find requires a number of arguments.
    For example, the command:


    ```

    find -name "log**" -print

    ```


    tells you to begin searching at the root directory "/" for any file or directory
    name -name containing the string log or having the substring embedded within the
    name. The quotation marks are required to pass the wild card characters to the
    find program without shell interpretation. Finally, the -print argument tells
    the find program to display the results of its search. Newer versions of find
    do not require the -print switch and display the results by default.


    # The info System


    The GNU info program provides an ASCII-based hierarchical view of revised man
    pages. Begin at the root of the tree by typing info. Programs are arranged by
    the usage areas Development, Miscellaneous, Administration, Console Utilities,
    Document Preparation, Games, and General Commands. Individual man pages are accessed
    by positioning the cursor on top of the program name and pressing the <Enter>
    key. Subcategories within the command depend on how the author arranged the material
    and vary depending the type of program being described. In general, info documents
    tend to be more helpful than the old man pages. They have a more general approach
    than the man pages and offer information on the ways in which one program interacts
    with others. On the other hand, the info project is incomplete, and there are
    more man pages than info pages. Also, new GPled software tends to come with a
    man page and not an info page.


    ![](img/c572f01d68eb481ab5b032d38aedfe98_159_0.png)'
