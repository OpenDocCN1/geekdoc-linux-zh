  md: '# Chapter 2


    Part of the original Unix design is the idea that file names could be avenues
    to information other than just hard disk data. These special files can lead directly
    to physical devices or logical constructs called system abstractions. The Linux
    kernel has been able to exploit abstractions with its ability to dynamically load
    file manager back-ends. One of the best examples is a pseudo file system to report
    the status of programs, device drivers, and kernel internal events. Access to
    this pseudo file system, or “system abstraction,” is accomplished by going to
    the directory /proc.


    In other words, displaying the contents of a file within the /proc directory does
    not switch hard volumes, but instead, switches to a kernel routine that shows
    system status as a series of directories, files, and file contents. Here is a
    list of continual abstractions:


    +   - /proc provides direct kernel status routines.

    - /dev/xxx provides access to device xxx.

    - /dev/null returns EOF when read and ignores all input when written.

    - /dev/zero returns any number of characters requested, but they are always the
    null (zero) character.


