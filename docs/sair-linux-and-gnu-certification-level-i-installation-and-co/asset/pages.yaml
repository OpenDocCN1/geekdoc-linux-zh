- img_proc: true
  md: 'well-established hardware interfaces. However, Linux gets into difficulty when
    new hardware products appear with their design details deliberately hidden by
    the manufacturer behind proprietary device drivers that are viewed only for a
    particular OS. Example devices are printers, video cards, and modems. Here are
    a few examples:


    Printers. On some types of ink or bubble printers, a custom communication protocol
    is required between the printer and the device driver. Many other printers handle
    the PostScript language, but some printers require a custom graphic mode protocol.
    Unless a driver for a specific printer is available, it will not be “Linux-friendly.”


    Video Adapters. Video adapters are another problem area. Although the XFree86
    project supports many types of video adapters, new ones are released every few
    months. System resellers tend to configure systems with the most recent and inexpensive
    video adapters. The result is that the Linux system administrator must check in
    advance to see whether Linux supports the video adapter hardware before purchasing
    the new system.


    Modems. One innovation in modem design has been the development of controllerless,
    or “Winmodems.” These devices have fewer components than traditional modems and
    require more operations by the device driver. These additional operations, also
    require a special protocol between the CPU and the adapter modem.


    Since these designs generally attempt to tap into “unused” CPU cycles to do the
    task that the peripheral normally does, it is not clear whether there should be
    Linux drivers developed for this type of minimal hardware since the new drivers
    will, by definition, have to slow the system down to attend to the less functional
    adapter.


    # Nine Linux Distributions


    Here we provide an overview of a “few” of the available Linux distributions. With
    the limited space it impossible to do justice to all Linux distributions. Please
    note that these distributions are specific to the PC architecture.


    All Linux software has version numbers. The kernel and each Linux distribution
    have independent version numbers. The kernel employs three numbers separated by
    decimal points. For example, the kernel number 2.4.10 would mean that it is the
    second major version and it is at the fourth minor version with the tenth place
    in. The middle or minor number has two modes. If the minor number is even, then
    it is considered to be a stable version of the kernel. If the minor number is
    odd, then the kernel is said to contain untested or not-fully tested experimental
    code that appears to work and, therefore, it is an unstable version.'
