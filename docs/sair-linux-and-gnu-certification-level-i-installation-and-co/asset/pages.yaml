  md: '# Setup


    Once you are done with the partitioning and swapping, you can type:


    ```

    #setup

    ```


    and you will get a screen like the one shown in Figure A.4.3.


    # Choosing a Keyboard Type


    You can read the help files by pressing H. The default keyboard map is set to
    the U.S. standard. If you are not in the United States, press K to get a dialog
    box to choose the appropriate keyboard map out of 37 available.


    # Setup a Swap Partition


    If you have a partition to be used as a swap space during your hard disk partitioning,
    you will need to set it up and make it active. Press A to set up the swap partition.
    If you had previously made a swap partition, swap will auto-detect it and display
    it on the screen. See Figure A.4.4.


    Choose Yes and Enter to install the chosen partitions as the swap partition. Press
    Enter to let setup make the swap partition active with mkswap and swap. It will
    format your specified partition as a Linux Swap Partition. After formatting your
    swap partition, setup will add new information to the fstab. Note that if you
    already made any of your swap partitions active using the mkswap command, then
    should press No; otherwise you let setup use mkswap again, some memory pages may
    get corrupted.


    ![](img/c572f01d68eb481ab5b032d38aedfe98_230_0.png)


    A.4.3 Swap setup screen.'
  merge: -1
