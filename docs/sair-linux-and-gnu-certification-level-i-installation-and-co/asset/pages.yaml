  md: '# Example Window Managers


    The window manager runs under X11, and is the program responsible for the look
    and feel of the windows placed on the screen. Everything that is displayed in
    an X session is in the form of a window; thus, a window manager is a program that
    simply manages these windows. Control over the management of these windows allows
    for the X session to be a unique, pleasant, and user-friendly environment. A subset
    of available window managers is described next. The window managers are listed
    alphabetically and they are independent of each other; however, they can also
    be clustered into families upon their starting points. The first generation or
    family of window managers includes TWM, CTWM, FWWM, FVWM2, and FWWM95. These window
    managers focused on virtual desktops, simple icons, and limited configuration
    features. The next family could be called the wharf family and includes Wmaker,
    The NextLevel, Bowman, and Afterstep. A third family that could be labeled the
    themes, task bar, and tools then emerged with members like KDE, Enlightenment,
    and Gnome. There are other window managers that do not easily fit in these three
    clusters. Also, there are window managers that run on Linux, such as the common
    desktop environment (CDE), that require commercial components.


    # Afterstep


    Afterstep evolved from the Bowman Window Manager, which was based on the FVWM
    window. The Afterstep Window Manager was designed to incorporate the look and
    feel of the NextSTEP user interface. TheNextSTEP interface, to many, is one of
    the most useful and instinctive GUIs available. Afterstep employs what is known
    as a “wharf” or a collection of icons that floats upon the desktop and launches
    programs (see Figure 5.1). Also, the wharf can contain folders of more applications.
    Furthermore, Afterstep was the first window manager to employ gradient-filled
    title bars with the NextSTEP- style icon and destroy buttons. The pop-up menus
    are also gradient-filled and can be configured to accommodate different tastes.


    To learn more about Afterstep, visit the team’s homepage at www.aftersteporg.


    # KDE


    The K Desktop Environment, or more simply KDE, with its Qt widget set foundation,
    is perhaps the most functional of all the window managers at the time of this
    writing. The Qt widget set provides a library of graphic functions such as “create
    a pop-up request box,” “draw a window border,” and “draw a scroll bar.” The Qt
    library was developed by Troll Tech AS (// https://www.troll.no/)'
