  md: '# Installations 211


    ![](img/c572f01d68eb481ab5b032d38aedfe98_232_0.png)


    Format partition.


    # Select Inode Density


    The Linux native format uses a default value of 4096 bytes per inode. You might
    want to change this depending on your usage of the system. If you plan to have
    lots of small files, choose inodes with less bytes.


    For this example, choose the default. Click and Choose 4096 as your Inode size
    and press Enter to continue. The setup program will then format your hard disk
    to ext2 format. It might take a few minutes to format your hard drive. Then, press
    Enter on the next screen where it will indicate the new information added to the
    `/etc/fstab`. On the next screen, choose Yes and press Enter to continue with
    the next step of installation, the selection of source media.


    # Select Source Media


    Now that your destination disk has been formatted and is ready for installation,
    you need to choose the source from where the installation will proceed.


    Choose the source medium from where you plan to install Slackware: Choose 1 if
    you have the Slackware CD-ROM, 2 if you plan to install from a hard drive partition
    where you have the installation files, 3 if you plan to install from NFS, 4 if
    you plan to install from a premounted directory, or 5 if you plan to install from
    a floppy. Use CD-ROM install here, so choose 1 and press Enter.


    # Choose Installation Type


    Now, you have to specify the kind of installation you want. Three methods exist.
    If you are on hard disk space, you might want to choose Sklest to run Slackware
    from the CD-ROM. For common installation to the hard disk, choose Slackware. For
    more control over the installation, you can choose custom, in which you can specify
    more parameters for the installation. Choose the'
