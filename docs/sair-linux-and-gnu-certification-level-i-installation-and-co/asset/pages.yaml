  md: "with bringing user-space file system images into kernel space and assists with\n\
    t removal of unused kernel modules.\n\nThe use of runtime modules is a fundamental\
    \ design breakthrough for\nLinux; however, there is a tradeoff. The obvious advantages\
    \ are configurabil-\nity and flexibility. Runtime modules permit the install kernels\
    \ to self-configure\nthemelves for a vast array of hardware configurations. Runtime\
    \ mod-\ns also allow quick reconfiguration in the face of unexpected events. On\
    \ the\nother hand, access to the installed modules must be done via a look-up\
    \ table,\nand a \"safety\" check must be done before the kernel can pass control\n\
    the jump table and onto the module. Of course, all of this checking and indi-\r\
    ection takes time, and these modules slow down the system when compared\ntother\
    \ modules compiled into the kernel.\n\n# Kernel Modules: Ismod,\nismodod, rmmod\n\
    \nA key role of any operating system is the masking of odd physical differences\n\
    among types of devices and the presentation of a uniform logical view of all\n\
    devices to the user. This is accomplished with program modules called device\n\
    drivers, which know the details of how to communicate with a physical device\n\
    , by encapsulating these details in the driver, they present a uniform log-\n\
    cal to the rest of the OS. Generally, there is one device driver per type of\n\
    physical device. Traditionally, these drivers are built into the kernel when it\
    \ is\nconstructed and cannot be changed unless the kernel is recompiled.\n\nLinux,\
    \ however, is unique among Unix-like operating systems because not\ndoes it have\
    \ the traditional \"compiled-in drivers,\" but also the kernel can\nload other\
    \ device drivers at runtime. To see the list of currently installed device\ndrivers,\
    \ type the command /sbin/lsmod\n\n```\nhostname /sbin/lsmod\n```\n\n| Module |\
    \ Pages | Used by |\n|---|---|--|\n| serial | 8 | 1 |\n| wd | 2 | 1 |\n| 8390\
    \ | 2 [wd] | 0 |\n| nfs | 12 | 4 |\n| 3c509 | 2 | 1 |\n| rarp | 1 | 0 |\n\nHere,\
    \ you can see that there are six device drivers loaded, which consume 27\nmemory\
    \ of 4096 bytes each. (Note that some versions of lsmod will\nlist bytes and not\
    \ pages.) You can also see that the 8390 is used by\nanother driver, the Ethernet\
    \ driver. Furthermore, by looking at the \"Used\nby\" column, you can see that\
    \ three of the six device drivers have one program\nusing them, and one driver,\
    \ nfs, has four programs using it."
