    build a complete, user-friendly desktop based entirely on GPLED. The desktop will
    consist of small utilities and larger applications that share a consistent look
    and feel. GNOME uses GTK+ as the GUI toolkit for all GNOME-compliant applications.
    GNOME is discussed here since it receives a lot of attention in the Linux community,
