    The mv command is used to move a file, group of files, or a whole subdirectory
    between two higher level directories. The man pages calls rename files, but most
    people refer to it as move. This command has two syntaxes:


    ```

    mv [Option] <source> <destination>

    mv [Option] <source> <directory>

    ```


    The reason for the rename name comes from the first syntax usage, rename the source
    to the destination. The best way to explain is by example. The first syntactic
    usage is to rename a file, such as:


    ```

    john@sith:~ > ls

    test

    john@sith:~ > mv test this_is_not_a_test

    john@sith:~ > ls

    this_is_not_a_test

    ```


    The file test has been renamed this_is_not_a_test. Note that Red Hat 6.0 aliases
    the mv command to mv -

    In the second form of the mv command, the file may be moved to a directory like
    this:


    ```

    john@sith:~ > ls

