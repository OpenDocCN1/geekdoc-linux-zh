  md: '# Table 3.1 Redirection Operators


    | REDIRECTION CHARACTER | WHAT IT CAN DO |

    | --- | --- |

    | > | Redirects output of the left-side command to the right-side device or file,
    overwriting any file if it already exists. |

    | >> | Has the same effect as the > command, but appends to the end of the file
    if it already exists, rather than overwriting the file. |

    | 2> | Redirects the error output of the left-side command to the right-side device
    or file, overwriting any file if it already exists. |

    | < | Redirects the input of the left-side command to the right-side device or
    file. |


    # Program to Program I/O Channels or Pipes


    When a pipe character ( | ) is used between commands, the pipe connects the output
    of the command on the left-hand side of the pipe to the input of the right-hand
    command. For example, the following command:


    ```

    bash ls -l | more

    ```


    causes the output of the directory listing to become the input of the more command.
    The only limit to the number of commands that can be piped together is the amount
    of system resources.


    Many commands in Unix-like systems as Linux read from standard input and write
    to the standard output. Pipes take advantage of this fact by providing a shorthand
    way to connect the output of one program, or command, to the input of another
    program, or command.


    # Background Program Creation versus Virtual Terminals


    One of Linux''s most powerful features is its ability to do more than one thing
    at a time. This is commonly referred to as multitasking. There are different ways
    you can exploit multitasking in Linux, and some of these are considered.'
