    # Blackbox


    The Blackbox design stands apart from the preceding window managers (see Figure
    5.8). Its design goals are simplicity, speed, and elegance. This, in turn, means
    that it does not support advanced features like multiple image format loading,
    pixmap decorations, and mouseless operation. To improve performance, Blackbox
    images are rendered only when they are needed. Once created, they are also cached,
    saving CPU time in Blackbox and the X server. Blackbox runs in user space, in
    less than 1 MB of memory, and is designed to place only a minimal load on the
    X server, thus making it ideal for network-based X11 displays.'
