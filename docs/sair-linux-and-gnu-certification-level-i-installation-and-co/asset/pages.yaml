    # WYSIWYG versus Mark-Up Word

    Processing


    As part of its Unix heritage, Linux provides a long line of typesetting, or mark-languages,
    (for example, nroff, groff, TeX, LaTeX, and (HTML)). In these word processing
    schemes, text creation and display are two separate processes. During the text
    creation phase, the user writes the information in a plain text file and directs
    how the text is to be displayed by embedding text-based formatting commands for
    use by the subsequent display processor. During the text phase, the display processor
    interprets the embedded commands in order to know how to lay out the text for
    display. The typical PC, on the other hand, usually employs a "What You See Is
    What You Get" process where the text is displayed as it is entered. To accomplish
    this, the WYSIWYG word processor must embed nonprinting binary information into
    the text file.


    The distinction between WYSIWYG and mark-up reflects a fundamental design issue
    for Unix (Linux) users, since Unix is predicated on employing all of its utilities
    (support programs) for processing text files. Embedding binary'
  merge: -1
  pgno: 167
- img_proc: true
  md: '# Applications 147


    information into the text file allows only one program, the word processor that
    created it, to access the text.


    A user that moves between the PC and Unix environments must be aware of this distinction
    and use the programs accordingly. For example, a user familiar with Microsoft
    Word (StarOffice) or Corel''s WordPerfect may continue to use the same WYSIWYG
    environment on Linux. But, if files are to be used elsewhere in the system, they
    must be exported as “text files”.


    Both designs achieve the same end, but a mark-up design offers advantages that
    a WYSIWYG design does not. Mark-up text can be created with any number of editors;
    text files can easily be processed by other applications; and mark-up provides
    more control over the display than that of functions provided inside a given WYSIWYG
    word processor. This process is similar to the transition that experienced users
    when they migrate from mouse-action to keyboard short-cut keys to speed their
    interaction with the machine. On the other hand, mark-up is difficult to learn
    and it is a tedious development cycle, requiring editing and testing to ensure
    that the requested changes were carried out.


