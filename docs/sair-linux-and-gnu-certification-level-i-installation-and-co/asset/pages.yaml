    Grep is a program used to search for patterns or strings within a file, multiple
    files, or standard input. Grep will display the line in which the matching pattern
    appears. New users usually are surprised to see the grep command on a short list
    of frequently used commands; however, once someone begins to use grep they always
    seem to come back for. Let''s say that you have been editing several files (letters,
    invoices, or whatever), and there was a thought that you wanted to return to but
    could not remember which file contained the information. Using grep, you search
    for anything having to do with the thought, “Friday,” by entering the following
    command:


    ```

    fredxwing:~ > grep Friday * is a directory

    MISContract.doc:\par Re-installation services performed outside of

    operating hours (8:00 a.m. to 5:00 p.m. Monday through Friday)

    $500 per location

    clet1:revisions will be completed Friday of this week.

    clet2:revisions will be completed Friday of this week.

    clet3:revisions will be completed Friday of this week.

    jk:06:00 PM Central Time, Monday through Friday.

    jk2:06:00 PM Central Time, Monday through Friday.

    grep: wp: Is a directory

    ```


    Where grep was unable to process a file it reports grep: and a message; otherwise
    grep reports the file name, :, and the line in which the string was found.

    The grep command also accepts metacters as literal strings. For example, you can
    search for all words beginning with an a and ending with b with the arguments
    "[^]*b" :


    ```

    fredxwing:~ > grep "[^]*b" *

    note1: attrib a.out +x

    note2: attrib a.out +x

    ```'
