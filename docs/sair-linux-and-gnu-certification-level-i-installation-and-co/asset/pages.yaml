    of the su command, which changes the current user account effective UID to 0 to
    allow access to files and services. Another form of the su command is the command
    su - useraccount where the dash means switch from the superuser account to that
    user account environment. Said another way, it is just like logging in as that
    user.


    To return to the superuser account, simply log out of the user’s shell to return
    to the original account, then log out of the superuser shell.'
