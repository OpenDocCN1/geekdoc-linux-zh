    john@sith:~ > mv this_is_not_a_test ~/not_a_test/

    john@sith:~ > test

    john@sith:~ > cd ~/not_a_test/

    john@sith:~/not_a_test > ls

    this_is_not_a_test

    ```


    The file this_is_not_a_test under the test directory is now moved to the not_a_test
    directory.

