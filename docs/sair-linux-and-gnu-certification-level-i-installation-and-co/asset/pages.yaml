  md: 'Some of the newer and less debugged X server or window managers may fail after
    several weeks of continuous use and lock up the console. In these cases the X
    Window GUI will not respond and access to the virtual consoles may also lock up.
    However, you can still log in via a network connection and kill jobs or perform
    an orderly reboot.


    # Troubleshooting an Unresponsive Printer


    The following list of steps should be applied in order to troubleshoot an unresponsive
    printer:


    +   - Check the /var/spool/lpd/printer/status file and the /var/log/lpd-errors
    file for error messages. (The path component "printer" refers to the name of the
    printer and its spool directory.)

    - Check for a /var/spool/lpd/printer/lock file and remove, if necessary.

    - Check the /var/spool/lpd/printer/ directory for control and data files. There
    should be at least one cf control file and one df data file.

    - Check the /etc/printcap entry to ensure it has not been modified.

    - Test the printer directly with the command: lptest > /dev/lpl.

    - Check to ensure that the printer can accept the format you are attempting with
    the command: cat file > /dev/lpl.

    - If the printer is a serial printer, check if UUCP has taken ownership of the
    serial port.

    - Finally, check to see if shell environment variables, such as PRINTER, are redirecting
    program output to another printer.


    # The Wrong Time Is Reported


    The PC BIOS employs a CMOS clock which reads for the initial date and time. However,
    CMOS clocks tend to drift. So, to correct the problem of the wrong time being
    reported, simply update the BIOS time regularly or use a time server to update
    the system on the fly. One example is to do this with the following command:


    ```

    host$ ntpdate clock.isc.org

    ```


    This command queries a time daemon on the isc.org timeserver for the correct time.
    Please note that this is just one of many clock servers. If you plan to use ntpdate,
    please check for a clock near you. This is another situation where'
  merge: -1
  pgno: 180
- img_proc: true
  md: 'you must have a trusted source from which to retrieve the correct time. there
    are many time servers that are available on the Internet. For more information
    on time and time servers see: www.eecis.udel.edu/~mills/ntp/.


    # Adding More Memory Has Made thenSystem Very Slow


    In this case, the amount of main memory has exceeded mainboard cache-tag addresses.
    To correct the problem, you must replace the motherboard. Note that this is not
    a problem with newer PC-100 DIMM motherboards.


    # Everything Slows Down when

    X Is Run


    If everything slows down when X is run, this means that there is probably not
    enough memory, and the system is spending more time swapping computing (that,
    it''s thrashing). Here are both minimum and typical values for main memory.


    | APPLICATION | MINIMUM | TYPICAL |

    |---|---||

    | Network gateway | 4 MB | 8 MB |

    | Network server | 8 MB | 16 MB |

    | Network multi-user | 16 MB | 32 MB |

    | X workstation | 32 MB | 64 MB |

    | X with GIMP | 64 MB | 128 MB |


    # Console Screen Has Weird Characters

    Instead of Letters


    When the console screen is displaying weird characters instead of letters, this
    means the terminal emulator has been switched into pseudographics mode and assumes
    the ASCII characters are commands to display character attributes. Either use
    the reset command or switch to another console terminal. Use reset command to
    clear the screen and reset it back to text mode.


    # Keyboard Repeat Rate Is Too Slow


    Some BIOS configure menus not offer a keyboard repeat rate adjustment. If so,
    use the /sbin/kbdrate utility with the arguments -r 30 to get a repeat of 30 characters
    per second.'
  merge: -1
