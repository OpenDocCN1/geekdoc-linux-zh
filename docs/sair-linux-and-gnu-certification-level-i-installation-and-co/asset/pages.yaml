    One of the key files in Linux is the user-account passwd file. Each line of the
    passwd has seven categories (fields) that are written against each other and delimited
    with colons, as follows:


    ```

    AccountName:EncryptedPassword:UserID:GroupID:UserName:HomeDirectory:First

    ```


    # Steps to set up New User Accounts


    New account creation consists of modifying the passwd file according to the following
    steps:


    +   1. Check to see if the shell prompt begins with a # and, if not, issue the
    command to become the superuser.

    2. Edit the /etc/passwd and duplicate the last line, which will look like this:

    jordan:0qyqyTCla8ifGW:501:100:Jordan K.Jones:/usr/home/jordan:/bin/bash

    3. Assuming the new account name is meredith, modify the duplicated line to look
    like this:

    eredith:0qyqyTCla8ifGW:502:100:Meredith M. Smith:/usr/home/merith:/bin/bash


    Note that the account name field changed to meredith, the encrypted password was
    left unchanged, the user ID was incremented to a new value (502) that is unused
    by other accounts, the group remained unchanged, the user''s name was replaced,
    the new home directory was inserted, and the first program to run was left unchanged
    as the bash, or Bourne again (a play on words used to identify the revised version
    of the sh program that was written by Mr. Borne).


    +   4. Change directory (cd) to /usr/home and create the user''s home directory
    with the commands:


    ```

    cd /usr/home

    mkdir meredith

    ```


    +   5. Change the owner of the directory from root to the account name:

    chown meredith'
