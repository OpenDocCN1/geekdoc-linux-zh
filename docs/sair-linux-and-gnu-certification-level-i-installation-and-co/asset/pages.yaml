    # General Distribution Installation Comparisons


    Among the preceding distributions, OpenLinux 2.2 is the most silent with just
    13 user prompts, and Debian 2.1 is the most interactive with 140 user prompts.
    Selecting the full distribution options, some distributions installed as little
    as 623 MB (Slackware) to as much as 4,200 MB (SuSE) of programs and data. The
    other distributions installed approximately 1000 MB each. Installation time ranged
    from approximately 12 minutes for OpenLinux 2.2 to 39 minutes for Debian 2.2.


    Assuming that you have to install several Linux distributions, now is the time
    to begin practising different distributions. Appendix A contains several walk-through
    sections that show step-by-step how to install Debian, OpenLinux, Red Hat, Slackware,
    and SuSE distributions.


    # Start Up and Shut Down Sequence


    After developing the skills to install Linux, the next step is to learn how to
    properly boot up and shut down the system. Also, we will review system initialization
    mechanisms.


    # The Linux Loader


    The Linux loader (LILO) was written by Werner Almesberger. The program resides
    in the first sector or master boot record (MBR) of the hard disk. LILO reads a
    list of internal parameters from the MBR to decide when and which OS image to
    load and execute. For example, assume the following setup from the file `/etc/lilo.conf:`


    ```

    # Tell the kernel we have two Ethernet cards and 128 MB RAM

    append=eth=1,0x280,eth0 ether=5,0x300,eth1=128M

    ```'
