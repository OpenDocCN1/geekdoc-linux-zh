    The tar command is the main archive program for Linux. The tar program combines
    many files into one file, compressing the files if requested. The archiver must
    also preserve critical system information as who owns the files, the permission
    settings, the directory path, as well as hard and symbolic links.


    To create an archive of files in the current directory, enter the following command:


    ```

    tar czf myarchive *

    ```


    To view the archive table of contents, enter the following command:


    ```

    tar tvf myarchive

    ```


    To archive a large amount of disk space and move the files from one part of the
    file system to another part, using the following pair of tar commands:


    ```

    tar cf - . /newplace; tar xvf -

