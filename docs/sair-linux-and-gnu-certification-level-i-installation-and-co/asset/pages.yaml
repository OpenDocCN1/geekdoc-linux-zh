    # The GNU General Public License


    The General Public License (GPL) was the brainchild of Richard Stallman, who came
    up with the GPL as a means for ensuring that free software would remain free and
    not taken over by large companies and restricted from public use. Stallman, referred
    to as the father of free software for this reason, gave birth to the idea of the
    GPL in 1984. He wanted to everyone to be able to participate in the cooperation
    that Version 6 Unix permitted for a relative few. Stallman believed that the GPL
    would contribute to the continued growth of communities of software developers
    and thus'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Chapter 1


    contribute to a more productive software environment, one that encourages the
    free sharing of ideas.


    The GNU GPL, essentially, says that you are free to use the software anyway you
    see it. Moreover, you may include the software in products and services being
    sold, as long as you observe two fundamental restrictions:


    +   1. One verbatim copies of software can be redistributed—this means that all
    source code must be provided with the software.


    +   2. If new software is added to the existing software, it must be prominently
    documented and also included with the original software.


    Disclaimer: Please note that this is a general summary of a precise legal document.
    Any action based upon the GNU GPL requires the license to be studied carefully.


    To date, the GPL, in combination with use of the Internet, has been very successful
    in encouraging the proliferation of communities of software developers who share
    products and ideas. The operating system called Linux arose from this environment,
    thanks to Richard Stallman and the GNU GPL.


    # The Use of Copyright to Enforce Copyleft


    The genius of the GNU GPL is that with its use, free software is accompanied by
    a detailed software license that employs a strict copyright. To prevent the software
    from being taken over and kept from free use, the license states that even though
    the software cannot be integrated and sold as some other software, it can be given
    to others. The use of a copyright in this manner runs counter to the traditional
    use of a copyright; hence, in the case of the GPL, it is referred as copyleft.


    Said another way, copyleft creates a "ball of independent intellectual plasma."
    The plasma may be brought into your home or office to use in any way you wish;
    in fact, not only use, but also improve the GPL software. However, since no one
    can control the plasma, it and any distributed improvements can be used by anyone,
    even your business competitors, for whatever role they may have in mind for the
    software.


    # The Microsoft Memorands


    A Microsoft memo leaked on Halloween eve 1998, referred to as the Halloween Memo,
    provides another perspective on open source and free software in general, and
    on Linux, one of the premiere examples, in particular. Even though there was only
    one memo leaked on Halloween eve, there are actually two lengthy and (one was
    leaked subsequently) detailed memos that describe Linux and the open source community
    and compare them to Microsoft, and


