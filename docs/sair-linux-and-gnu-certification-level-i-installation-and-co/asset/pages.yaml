    among hundreds of different printers, each with their graphic mode commands, Adobe
    Systems developed a midlevel language that interprets general commands and translates
    the commands to PCL or some other graphic-mode format.


    **Types of Printer Drivers.** Historically, Linux has evolved from the midrange
    computer and workstation market. These system administrators have typically picked
    PostScript to avoid integrating various types of printers, printer filters, and
    printer drivers. Most Linux applications generate format or PostScript format
