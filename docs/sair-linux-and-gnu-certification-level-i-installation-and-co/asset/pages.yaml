  md: '# CHAPTER

    6


    # Troubleshooting


    The term *troubleshooting* encompasses an immense landscape of problem analysis
    that engages several higher order faculties, including the ability to discriminate
    between concepts and superficial features, the ability to organize concepts in
    a hierarchical fashion, and the ability to systematically test each concept that
    faults may be isolated and repaired.


    The evaluation of these skills is beyond the scope of this certificate; however,
    it is instructive to consider common troubleshooting scenarios so that the candidate
    may review concepts presented earlier from a new perspective.


    # General Troubleshooting Strategy


    Problem solving goes through two basic phases: the shortcut phase and the analysis
    and test phase. A good troubleshooter understands these phases and will quickly
    move into the analysis phase after all the tips and tricks have been tried.'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# Shortcut Phase


    The most frustrating aspect of troubleshooting is that there is always a simple
    answer to solve the problem at hand, and if you could just have access to that
    bit of helpful information, the problem would be solved and everyone could go
    back to using their time more productively.


    Generally, the shortcut method involves consulting with those around you and using
    the help tools discussed previously. In other words, reading documentation provides
    a wealth of shortcut possibilities that could be applied to problem solving. Again,
    the sequence of documentation reading is (1) use the program help switches (note
    that some programs, like tar, do not have a man page but they do have an extensive
    help switch output), (2) use the man pages including any section applicable file
    formats, (3) use the system info, and (4) use the Deja news groups and search
    for a similar problem.


    Shortcuts provide an efficient strategy for problem solving, and we all use it
    to one degree or another; however, once the local experts and documentation have
    been consulted, and after the news search engine does not turn up an answer, then
    we must stop looking for shortcuts.


    # Analysis Phase


    Probably the best advice to give for serious troubleshooting is not to think of
    the most efficient way to solve a given problem, but instead to think of the most
    systematic way to solve the problem. Complex problems are solved slowly by identifying
    independent components and testing each component for its correct operation. Moreover,
    these components must be checked in relationship to how the system is constructed.
    For example, there is little benefit to checking a failed circuit only to discover
    that it did not have power applied to the circuit. And there is equally benefit
    to checking the power supply or replacing the power supply if the cord extension
    has been unplugged in the next room. Unfortunately, the more you know about a
    system, the better chance that the components will be checked in the wrong sequence.
    If components are unknown, then someone must be found who knows the components
    and they can help you walk through the system checkout procedure.


    # Common Error Situations


    Following is a series of common error or shortcut scenarios found when using Linux.
    The idea is to provide a perspective in problem solving so that when you see these
    situations on the job, you will have a reference point to begin the troubleshooting
    process.'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# Read Error or File Not Found Error when Installing Linux


    Probable causes of Read Errors or File Not Found Errors are poor quality media
    or wrong media format. An example of poor quality media is to recycle one of those
    free floppies you received in the mail and use it as the boot floppy. An example
    of wrong media format is the use of a Macintosh floppy in a PC floppy drive. The
    solution to both of these problems is to reformat the media, or obtain new media,
    and recopy installation images.


    # Archive Errors when Installing Linux


    The following error:


    ```

    Read: read error or gzip: not in gzip format while installing Linux

    ```


    means that the media is OK, but the archive contents have been corrupted. Download
    a new copy (in binary mode) from a different site.


    # Device Full Error Message when Installing Linux


    Unfortunately, there is no quick solution to this problem. The disk partitions
    created at the beginning of the installation process are too small for the Linux
    distribution. You must start over and make new, larger partitions that will hold
    the software you want.


    # Read Interrupt Error Message when Installing Linux


    A common read interrupt message is:


    ```

    Read_intr: 0x10 error

    ```


    If this occurs with general hard disk access, then the disk drive has bad blocks.
    Either use the badblocks command to search the device for bad blocks or reinstall
    Linux; regardless, be sure to check the scan-for-bad blocks options.


    Another possibility is that this error occurs when formatting a new volume with
    mke2fs or mkswap. In these cases, the hard disk stated partition size in blocks
    is probably smaller than the real partition size.


    You may also want to run the badblocks program standalone to the device.'
  merge: -1
  pgno: 174
