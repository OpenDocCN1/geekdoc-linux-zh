  md: '# 202 Appendix A


    # Select Installation


    Now you will have to choose the kind of installation you want. You have four options.
    Minimum set will install all the required minimum files to get Linux running.
    This kind of installation is most appropriate for machines that will be used as
    servers and will not be used for development work. This option will install about
    160 MB of space. The second option, All Recommended Packages, is ideal for a minimal
    workstation and server PC. It will require about 580 MB of space. + Commercial
    will install the same base package as the previous option as well as StarOffice
    5.0 and WordPerfect Version 8.0. This option requires around 780 MB of space.
    The last option, All Packages, installs all available software packages that are
    available at the time of Linux’s release. This option requires the largest space,
    about 1000 MB. Choose the system you want and then Next.


    While choosing other components and configurations for your system, setup will
    already start to install the packages you chose in the previous screen so by the
    time you are done with all configurations, all your software will be very close
    to being installed.


    # Select Keyboard Type


    Now select the kind of keyboard you have (most common keyboards are Generic 101)
    and then choose the appropriate layout. Choose U.S. English for this installation
    and press Next (see Figure A.3.7).


    ![](img/c572f01d68eb481ab5b032d38aedfe98_223_0.png)


    **Figure A.3.7** Select keyboard screen.'
