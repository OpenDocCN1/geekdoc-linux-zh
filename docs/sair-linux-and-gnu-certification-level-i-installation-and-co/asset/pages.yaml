    5. Given how other GPL authors have sold more detailed documentation, tutorials,
    or user manuals, the company may want to offer the more detailed documentation
    as part of the CD or as a separate book(s).


    # Can GPL Software Be Better than Proprietary Software?


    One interesting aspect of this process is that since the business that issued
    the software does not control it, the open source software is now free to follow
