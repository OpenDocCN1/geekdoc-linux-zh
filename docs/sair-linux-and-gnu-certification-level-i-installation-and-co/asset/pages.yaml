  md: '# Base System 49


    ```

    boot = /dev/hda          # Which device to boot from

    root = /dev/hda2         # Which partition contains other boot data

    prompt # Prompt for interaction if key pressed

    timeout = 50             # Wait up to 5 seconds for interaction

    image=/boot/vmlinuz # last boot image on hda2

    label=SUSE6.0 # Name of OS for prompt

    root=/dev/hda2 # Its file system is also on hda2

    read-only

    image=/boot/vmlinuz2.0.36-3.mandrake #2nd boot image on hda2

    label=Mandrake # Name of OS for prompt

    root=/dev/hda3 # Its file system is on hda3

    read-only

    ```


    These parameters, also known as boot stanzas, become fixed in the executable boot
    image and are placed in the MBR. This is accomplished with the LILO command. In
    other words, LILO program is a front-end program that copies its boot code and
    the preceding parameters (from the /etc/lilo.conf) into the MBR.


    In the preceding example, the LILO append parameter has been used to pass parameters
    to the kernel. The first two parameters tell the kernel where to look for Ethernet
    adapters and the logical names of the Ethernet adapters. The third parameter tells
    the kernel that the system has 128 MB of main memory. The timeout parameter tells
    LILO to wait five seconds (of five seconds) for the user to press the <Tab> or
    <Shift> keys. Pressing the <Tab> causes LILO to display OS labels SUSE6.0, Mandrake,
    and the prompt Boot. The user then enters the OS name (label) and presses <Enter>
    to begin the boot process.


    Note that both boot images are on the hda2 partition, and the second OS entry
    (Mandrake) has its file system on hda3.


    # System Boot Up Sequence


    System boot goes through several phases that include LILO, kernel initialization,
    running shell scripts that activate system services, and initializing the login
    process.


    # Steps Common to All Distributions


    All distributions begin the boot sequence in the same way. First, the BIOS runs
    LILO from the MBR. Second, LILO executes and locates the boot file system. Third,
    LILO runs its secondary loader /boot/boot.b which, in turn, loads the Linux kernel
    and runs. As the kernel initializes, many messages are displayed on the console
    screen including messages about the CPU, its speed, type of instructions it can
    execute, the various peripherals it (autoprobed), and the low-level network protocols
    being activated.'
  merge: -1
  pgno: 70
- img_proc: true
  md: '# Chapter 2


    These messages can be reviewed with the dmesg command after the system comes up
    and the user logs into the system.


    After initialization, the kernel runs the first application (user space) program,
    called init. The init program is the ancestor of all other programs and its task
    is to run the various resource control (rc) files, run the background system programs,
    and launch the login programs. Note that messages continue to be displayed on
    the console screen during the boot sequence described later, and that the final
    step in this sequence is the appearance of the Login: prompt.


    # Steps Unique to Distributions


    Linux distributions differ in how the init program reads the resource control
    files and executes the boot programs (shell scripts). This may seem to be a fundamental
    difference between distributions, but in reality the strategies are not only similar,
    but easy to understand and easy to modify. Note that these are the same resource
    control files discussed in the next section.


    As noted, the kernel simply runs ancestor init with a run level as command line
    argument. For the various distributions, the subsequent system boot up sequence
    is as follows:


    +   1. Red Hat and OpenLinux


    +   Both employ a directory /etc/rc.d/ that contains shell programs and names
    of shell programs. The programs are contained in a master directory called /etc/rc.d/init.d/.
    There are other directories named after the run levels, such as /etc/rc0.d for
    run level zero. Each of these /etc/rc?d/ directories (where ? represents a run
    level) contains a list of program names that are in the master directory /etc/init.d/.
    A master program called /etc/rc.d/rc accepts a run level (0,1,2, etc) and runs
    the programs in the specified directory. Finally, the /etc/rc.d/rc program runs
    another program called /etc/rc.d/rc.local, where programs unique to this system
    installation can be.


    +   2. SUSE


    +   The SUSE run-level directory is located in sbin/init.d; however, SUSE links
    to it through the traditional /etc/rc.d/name. SUSE functions in the same way as
    Red Hat and OpenLinux do, except the master directory /etc/rc.d/init.d/ links
    back to the current directory /etc/rc.d/ where all the scripts are held.


    +   3. Debian


    +   Debian functions the same that as Red Hat, except that it employs a master
    directory /etc/init.d that contains all the shell programs. There are other directories
    named after the run levels, such as /etc/rc0.d for run level zero. Each of these
    /etc/rc?d directories'
