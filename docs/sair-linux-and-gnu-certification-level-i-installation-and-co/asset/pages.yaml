  md: '# Theory of Operation


    # 27


    # The Video Controller

    (Video Processor)


    The video controller determines the type of I/O commands required to save, manipulate,
    and display information on the monitor screen. These chips are complex—many times
    exceeding the capacity of the CPU—therefore, video adapters are classified more
    by the type of video controller chip used on the adapter and less by the video
    adapter manufacturer. Controller chips are classified according to chip manufacturer
    and chip family. Trident, Tseng, and S3 are examples of well-known chip manufacturers.
    The Tseng ET6000 series and the S3 VIRGE series are families of video controller
    chips produced by the manufacturer. The S3 VIRGE/DX and S3 VIRGE/GX are two members
    of the VIRGE family.


    # Video Memory (RAM)


    Video memory is shared between the CPU and the video controller chip. The CPU
    places data in video memory and commands the controller chip to process and display
    the data. Also, the amount of video memory determines the maximum amount of information
    that may be displayed. If the video information is “shallow,” such as a black
    and white drawing, then a large amount of information can be displayed. On the
    other hand, if the video information is “deep,” such as a true-color photograph,
    then a much smaller amount of information may be displayed using the same amount
    of video memory. The trade-off between shallow and deep is resolved with the use
    of graphic modes.


    # Graphic Modes


    A graphic mode specifies the number of picture elements and the amount of information
    each element may hold. For example, 4 MB of video memory will be able to hold
    2250x1750 pixel image with 256 colors per pixel, but the same amount of video
    memory will hold only 1280x1024 pixel image with 16 million colors per pixel (or
    two-thirds fewer pixels).


    Many times video controllers are switched to graphic modes that do not use all
    the available video memory. However, the X Window System exploits this situation
    by providing multiple virtual desktops that you may switch among, allowing the
    use of all video memory.


    Based upon the current graphic mode, the video controller establishes a fixed
    number of “scan lines” and a fixed line length. The video controller sends this
    information with the contents of video memory as a series of bytes to the DAC.'
