    The commands head and tail are helpful for quick viewing of log files or other
    types of status files. The head command displays the first 10 lines of a file
    and the tail command displays the last 10 lines of a file. To view more lines,
    use the numeric argument. For example, to view the last 50 lines of a log file
    try this:


    ```

    fred@xwing:~ -> tail -50 /var/log/messages | less

    ```


    In this example, the last 50 lines of the message file is sent to the pager called
    less, which displays the file contents one page at a time. As an aside, only the
    superuser can access the /var/log files.


