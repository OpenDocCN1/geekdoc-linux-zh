    # The Server lpd and the Client lpr


    Printing in Linux is based upon the BSD client/server model, where the client
    and server are implemented with network sockets even when the printing is done
    locally. The client is known as the lineprinter request program, or lpr, and the
    server is referred to as the lineprinter daemon or lpd. The general printing process
    goes like this:


    +   1. The client lpr reads the requested file(s) to be printed from the user''s
    area and writes them into a spooling directory named after the destination printer,
    regardless of whether the printer is local to the user''s machine or is located
    on a remote machine.


    +   2. A control filter describing which files are to be printed is also written
    into the spooling directory by lpr. The client lpr program sends a notification
    message (through a Unix domain socket) to the lpd server and terminates.


    +   3. The lpd server has been scheduled to run as a result of receiving the notification
    message.'
