    # Logging In and Out


    At the virtual consoles and whenever there''s a remote login via the network,
    Linux presents the Login: message. In response, the user enters an account name
    followed by (or ending with) the <Enter> key. This causes the login program to
    run and present the Password: message. Next, the user enters a password followed
    by the <Enter> key. For example:


    ```

    Login:<Enter>

    Password:<Enter>

    ```


    # Successful Login Activates a User Shell


    If an existing account name and valid password is entered, the login program will
    initiate a command line shell program for the user. The shell name comes from
    the idea of encapsulating layers. Back in 1975, it was considered a revolutionary
    idea to move what was then the monitor from the kernel and into user space. In
    this sense, the shell encapsulates kernel services much like the shell of an egg
    encapsulates the embryo and nutrients. Today, of course, the shell itself is encapsulated
    by the GUI.'
