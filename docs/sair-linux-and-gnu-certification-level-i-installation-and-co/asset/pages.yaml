    # Init and Run Levels


    As noted in the previous section, as the kernel completes its initialization,
    it runs the first user space program, called init. The init program is key to
    the whole system and is responsible for starting all the other user system programs.
    A series of resource control files determine which system programs should be run
    or stopped, and an argument or signal to the init program tells it which resource
    control file run.


    Thus, the count of a run level is nothing more than an argument or signal number
    sent to the init program to tell it where to find the list of programs (shell
    scripts) that must be run to switch from one run level to another run level. Here
    is a list of Linux run levels:


    +   0 Shut down--Terminate the programs begun at start up.

    1 (or S) Single-user--Skip the multi-user login sign and just run a command line
    shell on the console terminal. Note that the 5 is allowable since the run level
    argument is a string passed from the kernel to the init program. In the event
    that signals are sent to the init program, then the run level argument is numeric.

    2 (or 1) Multi-user--The normal operating mode (sometimes without network).

    3 Varies among distributions (maybe multi-user with networking).

    4 Varies among distributions.

    5 Varies among distributions.

    6 Reboot--Go to run level 0 to multi-user (run level 2 or 3) depending on the
    distribution).


    As indicated, the middle levels (3–5) vary in function, but more often than one,
    or two of them are unused and the third run level starts the GUI window manager
    or starts the login sequence (the xdm display manager).'
