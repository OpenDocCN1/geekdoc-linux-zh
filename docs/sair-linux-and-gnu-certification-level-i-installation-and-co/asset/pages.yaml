    the other hand, there is some oddball aspect to the printer that requires trial
    and error tinkering before the printer will start up (which means falling off
    a log into an abyss).


    # Printer Modes


    Printers have two basic printing modes—text and graphic. The differences between
    these two modes are outlined here.


    Text-mode. In text, the printer accepts ASCII characters and prints these characters
    using an internal format. The internal printer format is usually a fixed-width,
    Courier typeface that looks old-fashioned.


    Graphic-mode. When the printer is in graphic mode, it accepts separate commands
    and data that direct how each element (pixel) will be drawn. Today''s word processors
    generally put the printer in graphic mode so that many types can be printed anywhere
    on the page, and in many sizes. This strategy also allows graphic images to be
    included with the text.


    Graphic-mode Commands. Printer graphic-mode commands are generally unique to each
    printer manufacturer and sometimes unique across the same manufacturer. For example,
    one common set of graphic'
