  md: '# Chapter 3


    You will see a list of directory paths, where each directory path is separated
    from another by the colon () character. Note that this is the same directory list
    that the shell will search for an executable file when the shell is instructed
    to run a program.


    # The PATH Variable Facilitates Program Execution


    While the home directory, if you wanted to run a program in /usr/bin, there are
    two ways this could be accomplished:


    +   - Explicitly call the program with the full pathname: /usr/bin/myProgram.

    - Have /usr/bin in your path as shown, and then you can type myProgram at the
    command line to have the shell search all the directories contained in $PATH variable
    for the executable.


    Even if the program resides in the current directory, the full pathname must be
    used or it in $PATH variable. However, there is one shortcut that can be used
    if the executable is in the current directory. Simple type ./myProgram to tell
    the shell to look in the current directory for the program.

    The rationale behind the “dot slash” requirement originates from a past security
    problem, and as a result, many distributions do not include the current directory,
    “” in the $PATH variable. The security problem revolves around the access of commands
    and utilities located in the system directories /bin and /usr/bin, such as the
    directory list (ls) command. If the dot is listed in $PATH string before the system
    directories, then a program by the same name in the current directory would be
    executed instead of the command or utility in the system directory. In this way,
    a “Trojan horse” could be planted in the current directory that has the same name
    as a common program, such as the ls command. When the user types ls expecting
    a directory listing, the Trojan horse would execute and display a message similar
    to the one in attempt to gain the user''s password:


    ```

    Session error - terminating program

    Login:

    Password:

    ```


    In response to this message, the naive user would enter the account name and password.
    This would allow the Trojan horse program to acquire the user’s password and easily
    erase itself so the next time the ls command is entered, everything would work
    as expected, leaving the user unaware that his/her password has been stolen. Thus,
    for security reasons, the dot character is not included in the $PATH variable.
    Some distributions do include the dot character in the $PATH string after the
    system directories.'
