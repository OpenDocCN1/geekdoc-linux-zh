    # Routine Tasks as Superuser


    The problem with running as superuser to accomplish routine tasks is that even
    the simplest of mistakes can lead to a catastrophe. Consider, for example, what
    would happen as a result of typing the following commands when running as superuser:


    ```

    rm * .bak

    rm -rf /home/fred/tmp

    ```


    In both examples, the inadvertent extra space results in deleting all files in
    the current directory or in the file system, respectively.


    Moreover, the problem of accidental file deletion is further complicated by the
    design of the Linux file system. With other Unix-like systems, Linux employs a
    fully indexed file system with direct access to the free-block list. When a file
    is deleted, its contents form the first-come-served free blocks of the next created
    file. Thus, once a file has been deleted and a new file has been created, the
    old file blocks have been reused.


    Another unforeseen consequence of working as superuser is to do with the files
    that are created while operating under superuser status. These files will have
    very restricted access permissions associated with them as a result of being created
    by the superuser. This means that there will be a higher probability of having
    to run as superuser in the future to access the files created earlier.


