  md: '# Change the group of the directory from root to the account group:


    ```

    chgrp 100 meredith

    ```


    Note that numbers or names from the file /etc/group work with the chgrp command.
    There is no requirement that group numbers be consistent from computer to computer.
    The number 100 was used because it was copied from the previous user in the password
    file, and the system administrator did not want to look up the group name in the
    group file. The group number 100 is usually associated with the group “users”.


    7. Give the new user a password with the command:


    ```

    passwd meredith

    ```


    The passwd program will prompt for a password for the account. The program will
    also complain about passwords that have too few characters or appear to be too
    obvious, but entering the same password again in response to a second prompt will
    force the program to accept the password. (But only the superuser can insist on
    a poor quality password.)


    8. Change the system administrator’s identity to the new user (this will automatically
    switch to the new user’s home directory) with the command:


    ```

    su - meredith

    ```


    9. Copy the per-user initialization files from the system standard file /etc/skel
    into the new user’s home directory with the command:


    ```

    cp /etc/skel/.*

    ```


    Per-user account initialization files begin with the “.” (dot) character, which
    tells the system utility programs to routinely ignore these files. Thus, to copy
    the files we must explicitly specify the directory. The dot character is also
    the name of the current directory. In this example, the copy command is specifying
    “.*” or all files beginning with the dot character are be copied to “.” or the
    current directory.


    10. Type <Ctrl>D twice—once to log out from the user’s shell and return to the
    superuser environment and a second time to log out from the superuser (root) account.


    11. At the Login: prompt, log in as the first user. From now on, do not log in
