  md: You can determine where the install is hanging by using console screens F3 and
    F4. By switching between these two screens you can determine whether the problem
    is with the floppy drive, the hard disk, the CD-ROM drive or the network connections.
    For example, if the kernel cannot read errors from the floppy drive will show
