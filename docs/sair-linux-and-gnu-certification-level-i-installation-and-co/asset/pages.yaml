    When multi-adapter reconfiguration problems appear, the best general solution
    is to remove all adapters except the video card, and perform a test boot. If successful,
    turn off power and install one more adapter and test boot. Failure to boot or
    failure to detect the adapter indicates a conflict with the adapter just added
    and an existing adapter. Reconfigure the adapter parameters until the conflict
    is removed.


    There are generally two cautions that apply to removing and inserting adapter
    cards and our experiences confirm these cautions! Caution one: Turn off the system
    power before removing and inserting an adapter card. The system must be brought
    down, power turned off, the adapters swapped, power turned on, and the system
    rebooted. All of this time, but it will insure that a screw is not dropped on
    a hot motherboard or that the power connector does not touch a signal lead when
