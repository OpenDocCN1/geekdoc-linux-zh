    library begun by the GNU image manipulation program, and the Qt library (free
    to individuals but proprietary to commercial users).


    **Window Managers.** The fourth component is the window manager, or desktop, that
    provides a general look and feel. There are many possible window managers to select
    from, but most users will accept the default desktop or, perhaps, choose from
    among a few that are offered in the default installation. The main window managers
    are Afterstep, KDE, Window Maker, FVWM, Enlightenment, and Blackbox.


    **Themes.** The highly visible styles of the newer window managers. Style refers
    to the number of colors supported and the artistic quality of bit-mapped graphics
    for window frames, title bars, icons, wallpaper, and background. The XXII window
    managers have a rich set of styles.


    **Applications.** The fifth type of component is made of the applications that
    run within the desktop environment. Even though they each have their own configuration
    (initialization) files, most applications can run under any window manager.


    In spite of the effort that has gone into the number of window managers and styles
    of window managers, there is still room for improvement. The cut-and-paste facilities
    need to be better developed and more needs to be done with typefaces. Window managers
    generally offer a change when clicked; however, there is no feedback on program
    progress. Furthermore, typefaces are not anti-aliased against the background in
    the window managers.


    **Network Access.** The X Window System allows local access and remote access
    via the network. To permit others to your workstation, use the xhost command to
    allow the connection from the specified host. Then set the DISPLAY variable to
    the local host address on the remote machine and launch the X11 system on the
    remote machine with the startx command. The X11 system will then connect with
    the local machine''s X server and begin an X Window session on the remote machine.


    X servers are also available for MS-Window machines in the form of X32 servers.
    These MS–Windows-based servers provide an identical look and feel of being directly
    attached to an X11 console on the machine.


