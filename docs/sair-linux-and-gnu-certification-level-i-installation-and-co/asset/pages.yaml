  md: "# Restricted Accounts\n\nThe login procedure normally runs a command line,\
    \ but other programs may be run instead of the shell. For example, it is possible\
    \ to run just an editor that provides access to a text editor or just Telnet session.\
    \ To do this, you need to place the full pathname of the program (text editor\
    \ or Telnet) in the seventh field of the password file for the particular user.\
    \ In this way, a restricted account could be set up.\n\n# ADDUSER\n\nThere are\
    \ a number of programs that assist with the creation and removal of user accounts.\
    \ Each of these programs assume that the /etc/skel/ directory has the proper default\
    \ initialization files for the new account. Again, only the superuser can add\
    \ or update user accounts.\n\nThe older GNU utility (written by Guy Maor, Ted\
    \ Hajek, and Ian Murdock) for performing automated account creation is adduser.\
    \ It takes a number of arguments, which may be specified in a control file called\
    \ /etc/adduser.conf. However, if the control file seems too much bother, another\
    \ alternative is to create a small shell script (such as the one that follows)\
    \ prompt for each account name and then call adduser to have the account automatically\
    \ set up. The script can be operated actively, with the administrator manually\
    \ redirected to each account, or it may have input from a file to allow for batch\
    \ operation.\n\n```\necho -n \"Enter Account Name: \" *\nread name\nwhile [ $name\
    \ != \"done\" ];\ndo\n  adduser -g users -s /bin/bash -d /home/$name -p $name\
    \ $name\n  echo -n\"Enter account name: \" *\nread name\ndone\n```\n\nIn this\
    \ script:\n\n+   1. The echo command displays a prompt with new line suppressed.\n\
    2. The read command accepts an alphanumeric string into the internal shell variable\
    \ name.\n3. The while command evaluates the string and sets up a loop to continue\
    \ processing the commands in the “do-done” block until the contents of the internal\
    \ variable $name equal the literal string done to be entered at the command line\
    \ or the last line of a batch file). The program may also be terminated by simply\
    \ typing a <Ctrl>C."
