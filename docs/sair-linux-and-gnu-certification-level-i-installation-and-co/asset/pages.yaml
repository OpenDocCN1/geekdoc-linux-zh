  md: '# Select Video Card


    Usually, your Video card and Clock speed should be detected automatically by the
    setup program, but if you find any discrepancies, click on Probe on the lower
    left side of your screen so that OpenLinux detect automatically your clock speed
    and your video card type (see Figure A.3.8). Then select the appropriate amount
    of Video RAM and click Next.


    # Select Monitor


    Now choose the monitor type from the 1700 listed. If you cannot find your monitor
    from the list, take the manual that comes with the monitor, look for the refresh
    rates; fill in the appropriate horizontal and vertical rates and then click Next.


    # Select Video Mode


    Select the Video Mode. All of the modes listed are the modes that the setup program
    has determined to be compatible with the Video Card/Monitor that you have entered
    previously. 1280 × 1024, 18–66 bp is a very common resolution, select it and click
    on Next to see how it actually looks. If you don''t like the way it looks, just
    choose another resolution and test it until you get the one you like. Press Next.


