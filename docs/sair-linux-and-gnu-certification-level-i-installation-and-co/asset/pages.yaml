    # Creating Partitions with Disk Druid


    Disk Druid is Red Hat''s Linux disk management utility. It manages mount points
    for each partition, and can create and delete partitions. Figure A.1.6 shows a
    single 500MB hard disk. To install a partition on this drive, click on Add, which
    then brings up to the screen shown in Figure A.1.7.


    It is generally recommended to double the amount of RAM that you have, but it
    is usually not necessary to exceed 128MB. Click on OK, which will create the desired
    swap partition. Next you need to make a Linux Native partition, where your files
    will be stored. Click on Add as before, and then make the mount point "/", which
    is the standard mount point for a small drive with just one Linux native. The
    size of the partition defaults to 1 MB, so make sure the desired amount has been
    placed on this line (this is shown in Figure A.1.8). The allowable drives that
    you can are shown in the lower left-hand corner. If this box is checked, then
    the partition may be created on this drive; if not, diskid will not write to the
    specified drive.


    Now click on OK, which brings you to the main screen. After all changes have been
    made it is time to write the partitions to your hard drive. Click on OK, which
    takes you to the screen shown in Figure A.1.9, and then choose Yes to write the
    changes to the partition table.'
