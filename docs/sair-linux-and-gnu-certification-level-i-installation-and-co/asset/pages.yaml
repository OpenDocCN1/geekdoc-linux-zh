    The ln command is used to create a link between two files or directories. A link
    is simply a pointer to another file or directory name. By default, ln will create
    a hard link to join two or more files or directory names. Files with only one
    name have a directory entry made up of the file name and an associated inode number
    that points to an inode which describes the contents of the file. Hard links are
    implemented by creating another entry with a new name but the same inode number.
    To track the number of hard links, the inode also contains a link count number.
    Thus, a hard link is a path to another file or directory such that the contents
    of the link are changed when the original file is changed. For example,


    ```

    ajneel@mailul:/tmp > cat original

    This is the original file!

    ajneel@mailul:/tmp > ln original file

    ```


