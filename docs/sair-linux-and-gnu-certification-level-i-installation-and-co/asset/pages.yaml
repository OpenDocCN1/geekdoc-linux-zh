    # Diagnostic and Setup Floppy Disks


    There are many solutions to configuring the ISA bus parameters for a new peripheral,
    but one of the most convenient solutions is to keep an MS-DOS boot floppy and
    copies of the various maintenance programs that vendors offer for their adapters.
    (The most convenient, of course, is when the adapter''s BIOS announces that you
    can enter its configuration program by typing a special character at boot.)


    For example, consider the task of configuring a network firewall with two Ethernet
    adapters (let''s say they are SMC adapters). Plug in the first adapter, power
    up the machine, and boot the MS-DOS floppy. Insert the vendor''s floppy and run
    the configuration program (in this example, it''s “ezstart”). Select the I/O address,
    IRQ number, and shared memory address range (these adapters do not use the DMA
    channels) that do not conflict with other adapters. Also, be sure to note the
    values selected. Next, turn off the power and install the second adapter. Repeat
    the preceding steps but configure the second adapter with unique values for the
    three parameters.


    Note that if you do not have these vendor configuration programs, they can usually
    be found on the vendor’s Internet site and downloaded.


    # Network Configuration


    We will devote a complete text to network configuration and services, but for
    now all we have to do is to tell the machine how to communicate with the local
    network. To accomplish network connectivity, we have to provide parameters for
    the four network concepts describe below.


    # IP Address, Mask, Gateway, Name Server


    An essential part of a Linux installation concerns network access. There are four
    key parameters that hold the answer to providing network access: the IP address,
    the network mask, the gateway, and the name server. Each is described briefly
    here.


    **IP Address.** The IP address is a unique, logical Internet address that identifies
    the geographical location of the computer. This number cannot be guessed—it must
    be assigned by the network administrator. The format of an IP'
  merge: -1
