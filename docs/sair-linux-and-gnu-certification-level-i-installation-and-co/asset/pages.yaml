    ```

    hostname locate --help

    Usage: locate [-d path] [--database=path] [--version] [--help]

    pattern...

    ```


    The program will list its acceptable arguments following the usage banner. Virtually
    all programs are expected to use the usage banner in response to the --help switch
    or in response to wrong or incomplete arguments. Also, note that some commands
    list more than a screen full of options, and therefore, the output must be directed
    to a pager, such as less. For example:


    ```

    hostname$ ls --help | less

    Usage: ls [OPTION]... [FILE]...

    ```


    ```

    -a, --all do not hide entries starting with

    -A, --almost-all do not list implied . and .

    -b, --escape print octal escapes for nongraphic characters

    ```


    Commands, like cd, are internal to the shell. Typing cd --help to bash will result
    in the shell saying that --help is an illegal option (or some other client depending
    on which shell is used)

    The --help listings are perhaps too terse for those who have not used the command.
    Before the next step for those users would be to read the man pages.


    # The man Pages


    The man command is the fastest way to get more information on another command
    or utility, even though it has been demoted by the GNU organization in favor of
    their info system. Some of the Linux manual pages are almost exact copies of the
    same manual pages that appeared 20 years ago in Version 6 Unix, and, unfortunately,
    they narrowly address the behavior of a given program and not the interaction
    of the program with the rest of the system. In fact, it is to say that there is
    no local documentation that provides the big picture with respect to program interactions.
    For example, the man pages have sections: (1) User Commands, (2) System Calls,
    (3) Subroutines, (4) Devices, (5) File Formats, (6) Games, (7) Misc, (8) System
    Administration, and (9) New; yet, there is no man switch that shows the table
    of contents. (Of course, you are free to go to the /usr/doc/man? to see the file
    names of the man pages.


    One way to find information is to enter the man command with the keyword argument
    -k and a keyword that relates to the topic of interest. For example:


    ```

    hostname$ man -k topic

    ```'
