  md: '# Passing Special Characters to the Shell


    There are some characters that have special meaning to the shell. A common example
    of such a character is the * (asterisk). The * is used by the shell as a wild-card
    character. If a situation should arise in which there is a need to use the * as
    a literal argument to a command, you would have to tell the shell not to interpret
    the asterisk as a wild-card character. This can be done by character quoting,
    also known as "escaping the character." There are a couple of ways that the special
    meaning of a character can be turned off just for that instance in the Linux shell.
    These are considered next.


    # Escaping an Individual Character


    To escape a single character, place a backslash immediately before the character.
    For example, if you wanted to list all of the files that had an * in the file
    name, the following command would be used:


    ```

    ls -a \*

    ```


    This would cause the shell to interpret only the first and the third * but not
    the middle *.


    # Escaping Multiple Characters


    To escape an entire string of characters, use either a pair of double quotes ("")
    or a pair of single quotes (''''). The single and double quote delimiters have
    different meanings. When using the single quotes, everything that falls between
    the single quotes will not be shown to the shell for processing. If you use the
    double quotes, the shell will continue to process any shell variables starting
    with the $ sign. You can also use the single quotes to turn off the meaning of
    the double quotes and vice versa.


    For example, to search all files in the current directory for a string containing
    special characters grep:


    ```

    bash$ "I''ll find your $name *

    ```


    Here the single quote in the word "I''ll" will be ignored by the shell (as the
    spaces between words), but the shell variable, $name, will be evaluated to determine
    its value. This value will be placed into the string, replacing this instance
    of the shell variable.


    # Back-Quoting Strings of Characters


    Single back-quote characters (``) can be used in pairs to delimit strings of characters
    in the shell. Placing an item in back-quotes means that anything between'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# 82 Chapter 3


    them will be executed as a separate command and not part of the arguments to the
    original command. Here is an example of back-quoting:


    ```

    echo The exact date is ''date''

    ```


    The output would look like:


    ```

    The exact date is Wed Apr 14 15:07:33 CDT 1999.

    ```


    As you can see, the date command was executed, and the output from it was inserted
    into the string that was subsequently echoed with the echo shell command.


    # Shell Aliases


    ven the experienced Linux-user admits that seemingly easy commands can become
    harder to remember when switches are added to them. This is where the convenience
    of command aliases becomes important. Command aliases provide the ability to make
    an easy-to-remember name for a more complicated command.


    For example, let''s assume that you want to see a full (long) directory listing
    every time you type the ls command. Using an alias, this can be accomplished easily,
    as follows:


    ```

    alias ls=''ls -l''

    ```


    After this alias is created, each time the ls command is typed, you will see the
    output just as if you had entered the ls -1 command. To remove this type:


    ```

    unalias ls

    ```


    Here are some examples of commonly used aliases:


    ```

    alias ..=''cd ..''

    alias ...=''cd ../''

    alias dir=''ls -1''

    alias ls=''ls -aF''

    alias la=''ls -la''

    alias ll=''ls -l''

    alias ls=''ls -l $LS_OPTIONS''

    alias ls-1=''ls -1''

    alias md=''mkdir -p''

    alias o=''less''

    alias rd=''rmdir''

    ```'
  merge: -1
