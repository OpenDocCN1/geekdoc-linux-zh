    # The Personal Computer Bus Architecture


    Figure 1.1 shows the overall PC system architecture. The center of the figure
    shows the central processing units (CPUs). One CPU is what would be contained
    in a 386 chip; one CPU plus the floating point processing unit (FPP) is contained
    in a 486 chip, and the 586, or Pentium class processor, contains two CPUs, the
    FPP, and a high-speed cache memory.


    # System Buses


    Although there is only one physical row of adapter sockets, there are multiple
    physical and logical buses contained on the mainboard. The physical buses are
    the peripheral component interconnect or PCI bus (usually connector sockets),
    the industry standard architecture or ISA bus (usually larger connector sockets),
    advanced graphic port or AGP and the memory bus (the SIMM or DIMM sockets). Each
    bus has its own adapter edge pattern, so only one PCI card can be plugged into
    a PCI connector slot. Access to I/O buses require separate program actions, and
    access to main memory and shared peripheral memory, such as video memory, is through
    the memory bus.


    The main memory bus runs at 66 or 100 MHz on recent mainboards. Access to peripheral
    controllers is done through an input/output or I/O bus. There are two types of
    I/O buses: PCI and ISA. The PCI bus protocol allows its connections (adapters)
    to communicate with the CPU as peers. The ISA bus, on the other hand, employs
    "slave" adapters that must be configured manually at installation time. The AGP
    adapter appears to be on an I/O bus, but it is physically attached to the CPU''s
    local bus for increased access speed to video memory.


    # Possible ISA Adapter Difficulties


    The difficulty with the ISA bus is that each adapter selects values for I/O parameters
    from a small group of possible values and no two adapters use the same values.
    Furthermore, the four parameters must be configured manually. The four parameters
    to be configured are:


    +   1. I/O address. Although there are many possible addresses, adapter hardware
    allows the selection of only a few addresses that may or may not conflict with
    another adapter.


    ![](img/c572f01d68eb481ab5b032d38aedfe98_36_0.png)'
  merge: -1
  pgno: 36
- img_proc: true
  md: '![](img/c572f01d68eb481ab5b032d38aedfe98_37_0.png)'
