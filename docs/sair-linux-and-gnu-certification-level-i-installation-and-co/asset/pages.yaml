  md: '# Introduction


    Welcome to the Level I Installation and Configuration study guide for Sair Linux
    and GNU certification. This is the first of four study guides for the Linux and
    GNU Certified Administrator (LCA) certificate. The other three study guides are
    System Administration, Networking, and Security. The four tests may be taken in
    any order, but the study guide material is organized with the assumption that
    Installation is the first test, followed by System Administration, Network, and
    Security tests.


    Testing is done through Sylvan Prometric at any of their 2400 testing sites. To
    take a test in the United States, simply call the Sylvan Prometric registration
    line at 1-888-895-6717. For test registration of the United States please visit
    www.linuxcertification.com/sylvanphone.php3 on the Web. The customer service will
    answer any test-testing questions, describe available testing centers in your
    area, and if requested, schedule an exam.


    Passing either the 3XO-101 or the 3XO-102 exams will earn the Sair Linux and GNU
    Certified Professional (LCP) certificate. Completion of all four exams (3XO-101,
    3XO-102, 3XO-103, and 3XO-104) will earn the Sair Linux and GNU Certified Administrator
    (LCA) certificate.


    Although the LCA will attest to a certificate-holder''s knowledge and capability
    to administer a Linux system, there are two more certificates, the LCE and MLCE,
    which will confirm knowledge and skills in increasingly difficult Linux topics.


    # Minimum Candidate Requirements


    The Sair Linux and GNU tests were not designed for the novice computer user. We
    assume that the candidate has approximately two years of computer experience and
    has experience in the configuration of one or more operating systems. For example,
    the candidate should be familiar with basic hardware concepts, such as CPU, cache,
    memory, interface adapters, hard disks, and network. The candidate should also
    be familiar with basic operating system concepts such as booting, file system,
    and device drivers. Finally, the candidate should know basic commands and the
    use of a Unix-type editor such as joe, pico, vi, or emacs.'
