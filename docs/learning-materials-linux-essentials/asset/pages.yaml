    To add SGID permissions to a file in symbolic mode, the command would be:


    ```

    $ chmod g+ test.sh

    $ ls -l test.sh

    -rwxr-sr-x 1 carol 33 Dec 11 10:36 test.sh

    ```


    The following example will make you better understand the effects of SGID on a
    directory. Suppose we have a directory called Sample_Directory, owned by the user
    carol and the group users, with the following permission structure:


    ```

    $ ls -ldh Sample_Directory/

    drwxr-xr-x 2 users 4.0K Jan 18 17:06 Sample_Directory/

    ```


    Now, let''s change to this directory and, using the command touch, create an empty
    file inside it. The result would be:


    ```

    $ cd Sample_Directory/

    $ touch newfile

    $ ls -lh newfile

    -rw-r--r-- 1 carol carol @ Jan 18 17:11 newfile

    ```


    As we can see, the file is owned by the user carol and group carol. But, if the
    directory had the SGID permission set, the result would be different. First, let''s
    add the SGID bit to the Sample_Directory and check the results:


    ```

    $ chmod g+s Sample_Directory/

    $ ls -ldh Sample_Directory/

    drwxr-sr-x 2 users 4.0K Jan 18 17:17 Sample_Directory/

    ```


    The s on the group permissions indicates that the SGID bit is set. Now, let''s
    change to this directory and, again, create an empty file with the touch command:


    ```

    $ cd Sample_Directory/

    $ touch emptyfile

    $ ls -lh emptyfile

    -rw-r--r-- 1 carol users 0 Jan 18 17:20 emptyfile

    ```


