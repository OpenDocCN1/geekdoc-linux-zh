    Now let''s verify all files exist in the globs directory:


    ```

    $ cd globs

    $ ls

    question1 question14 question23 star1100 star2013

    question13 question2012 star10 star2002

    ```


    How touch created the files? You can view the contents of a text file with the
    cat command. Try it on one of the files you just created:


    ```

    $ cat question14

    ```


    touch creates empty files, you should get no output. You can use echo > to create
    simple text files. Try it:


    ```

    $ echo hello > question15

    $ cat question15

    hello

    ```


    echo displays text on the command line. The > character instructs the shell to
    write output of a'
