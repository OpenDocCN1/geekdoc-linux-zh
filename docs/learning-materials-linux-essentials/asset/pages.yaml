    # Introduction


    While the terms free software and open source software are widely used, there
    are still some misconceptions about their meaning. In particular, the concept
    of “freedom” needs closer examination. Let’s start with the definition of the
    two terms.


    # Definition of Free and Open Source Software


    # Criteria of Free Software


    First of all, “free” in the context of free software has nothing to do with “free
    of charge”, or as the founder of the Free Software Foundation (FSF), Richard Stallman,
    succinctly puts:


    > > To understand the concept, you should think of “free” as in “free speech,”
    and not as in “free beer”.


    — Richard Stallman, What is free software?'
