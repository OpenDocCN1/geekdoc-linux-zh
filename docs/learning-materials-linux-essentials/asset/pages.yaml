    # # Renaming Files


    Files are moved and renamed with the mv command.


    Set your working directory to the moving directory:


    ```

    $ cd ~/linux_essentials-2.4/moving

    ```


    Create some files to practice with. By now, you should already be familiar with
    these commands:


    ```

    $ touch file1 file2

    $ echo file3 > file3

    $ echo file4 > file4

    $ ls

    file1 file2 file3 file4

    ```


    Suppose file22 is a type and should be file2. Fix it with the mv command. When
    renaming a file, the first argument is the current name, the second is the new
    name:


    ```

    $ mv file22 file2

    $ ls

    file1 file2 file3 file4

    ```


    Be careful with the mv command. If you rename a file to the name of an existing
    file, it will overwrite it. Let''s test this with file3 and file4:


    ```

    $ cat file3

    file3

    $ cat file4

    file4

    $ mv file4 file3

    $ cat file3

    file4

    ```'
