- pgno: 221
  md: '# Linux Professional Institute


    # 3.3 Lesson 1


    | Certificate: | Linux Essentials |

    | Version: | 1.6 |

    | Topic: | 3 The Power of the Command Line |

    | Objective: | 3.3 Turning Commands into a Script |

    | Lesson: | 1 of 2 |


    # Introduction


    We have been learning to execute commands from the shell so far, but we can also
    enter commands into a file, and set that file to be executable. When the file
    is executed, commands are run one after the other. These executable files are
    called scripts, and they are absolutely crucial tool for any Linux system administrator.
    Essentially, we can consider Bash to be a programming language as well as a shell.


    # Printing Output


    Let''s begin by demonstrating a command that you may have seen in previous lessons:
    echo print an argument to standard output.


    ```

    $ echo "Hello World"

    Hello World!

    ```


    Now, we will use file redirection to send this command to a new file called new_script.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# Linux Essentials (Version 1.6) | Topic 3: The Power of the Command Line


    ```

    $ echo "Hello World!" > new_script

    $ cat new_script

    echo "Hello World!"

    ```


    The file new_script now contains the same command as before.


    # Making a Script Executable


    Let''s demonstrate some of the steps required to make this file execute the way
    we expect it to. A user''s first thought might be to simply type the name of the
    script, the way they might type in the name of any other command:


    ```

    $ new_script

    /bin/bash: new_script: command not found

    ```


    We can safely assume that new_script exists in our current location, but notice
    that the error message is not telling us that the file doesn''t exist, it is telling
    us that the command doesn''t exist. It would be useful to discuss how Linux commands
    and executables.


    # Commands and PATH


    When we type the ls command into the shell, for example, we are executing a file
    called ls that exists in our filesystem. You can prove this by using which:


    ```

    $ which ls

    /bin/ls

    ```


    It would quickly become tiresome to type in the absolute path of ls every time
    we wish to look at the contents of a directory, so Bash has an environment variable
    which contains all the directories where we might find the commands we wish to
    run. You can view the contents of this variable by echo.


    ```

    $ echo PATH

    /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/games/games

    ```


    Each of these locations is where the shell expects to find a command, delimited
    with colons (:). You will notice that /bin is present, but it is safe to assume
    that our current location is not.'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'shell will search for new_script in each of these directories, but it will
    not find it and therefore

    will throw the error we saw above.


    There are three solutions to this issue: we can move new_script into one of the
    PATH directories,

    we can add our current directory to PATH, or we can change the way we attempt
    to call the script.

    The latter solution is easiest, it simply requires us to specify the current location
    when calling the

    script using dot slash (./).


    ```

    $ ./new_script

    /bin/bash: ./new_script: Permission denied

    ```


    The error message has changed, which indicates that we have made some progress.


    # Execute Permissions


    The first investigation we should do in this case is to use ls -1 to look at the
    file:


    ```

    $ ls -1 new_script

    -rw-rw-r-- 1 user 20 Apr 30 12:12 new_script

    ```


    We can see that the permissions for this file are set to 664 by default. We have
    not set this file to

    have execute permissions yet.


    ```

    $ chmod +x new_script

    $ ls -1 new_script

    -rwxr-xr-x 1 user 20 Apr 30 12:12 new_script

    ```


    This command has given execute permissions to all users. Be aware that this might
    be a security

    risk, but for now this is an acceptable level of permission.


    ```

    $ ./new_script

    Hello World!

    ```


    We are now able to execute our script.


    # Defining the Interpreter


    As we have demonstrated, we were able to simply enter text into a file, set it
    as an executable, and'
