- pgno: 211
  md: 'The first example is a combination of searching through the file and with regular
    expressions. In order to fully understand regular expressions, it is very important
    to show the difference. The first command searches for the exact string, anywhere
    in the line, whereas the second command searches for sets of characters that contain
    any of the characters between the brackets. Therefore, the results of the commands
    are different.


    ```

    $ grep "ab" text.txt

    aaabb1

    abab2

    $n grep "[ab]" text.txt

    aaabb1

    abab2

    class1

    alien2

    ```


    The second set of examples shows the application of the beginning and the end
    of the line metachar. It is very important to specify the need to put the 2 characters
    at the right place in the expression. When specifying the beginning of the line,
    the meta-character needs to be before the expression, whereas, when specifying
    the end of the line, the meta-character needs to be after the expression.


    ```

    $ grep "^a" text.txt

    aaabb1

    abab2

    alien2

    $ grep "2$\$ text.txt

    abab2

    noone2

    alien2

    ```


    On top of the previous explained meta-characters, regular expressions also have
    meta-characters that enable multiplication of the previously specified pattern:


    +   * Zero or more of the preceding pattern


    +   + One or more of the preceding pattern'
