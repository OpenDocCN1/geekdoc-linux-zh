- pgno: 264
  md: 'Linux (Version 1.6) | Topic 4: The Linux Operating System


    # Using Linux on Servers


    Using Linux as your operating system is common practice in the enterprise sector.
    Servers are maintained by engineers who specialize in Linux. So even with thousands
    of users, the users can remain ignorant of the servers that they are connecting
    to. The server operating system is not important to them and, in general, client
    applications will not differ between Linux and other operating systems in the
    backend. It is also true that as more applications are virtualized or containerized
    within local and remote clouds, the operating system is masked even more and the
    embedded operating system is likely to be Linux.


    # Linux in the Cloud


    Another opportunity to become familiar with Linux is to deploy Linux within one
    of the many public clouds available. Creating an account with one of the many
    others providers will allow you to quickly deploy many different Linux distributions
    quickly and easily.


    # Non Linux Operating Systems


    Yes, incredible as it seems, there are operating systems that are not based on
    the Linux kernel. Of course, over the years there have been many and have fallen
    by the wayside but there are still other choices that are available to you. Either
    at home or in the office.


    # Unix


    Before we had Linux as an operating system there was Unix. Unix used to be sold
    along with hardware and still today commercial Unixes such as AIX and HP-UX are
    available on the market. While Linux was highly inspired by Unix (and the lack
    of its availability for certain hardware), the family of BSD operating systems
    is directly based on Unix. Today, FreeBSD, NetBSD and OpenBSD, with some other
    related BSD systems, are available as free software.


    Unix was heavily used in the enterprise but we have seen a decline in the fortunes
    of Unix with the growth of Linux. As Linux has grown and the enterprise support
    offerings have also grown, we have seen Unix slowly to vanish. Solaris, originally
    from Sun before moving to Oracle, has recently disappeared. This was one of the
    larger Operating Systems used by telecommunication companies, heralded as Telco
    Grade Unix.


    Unix Operating Systems includes:


    +   - AIX


    +   - FreeBSD, NetBSD, OpenBSD


