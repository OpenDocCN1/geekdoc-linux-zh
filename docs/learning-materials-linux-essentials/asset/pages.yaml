    # # Managing ZIP files


    Windows machines often don''t have applications to handle tar balls or many of
    the compression tools found on Linux systems. If you need to interact with Windows
    systems, you use ZIP files. A ZIP file is an archive file similar to a compressed
    tar file.


    The zip and unzip programs can be used to work with ZIP files on Linux systems.
    The example below will be all you need to start using them. First we create a
    set of files:


    ```

    $ cd ~/linux_essentials-3.1

    $ mkdir zip

    $ cd zip/

    $ mkdir dir

    $ touch dir/file1 dir/file2

    ```


    Now we use zip to pack these files into a ZIP file:


    ```

    $ zip -r zipfile.zip dir

    adding: dir/ (stored 0%)

    adding: dir/file1 (stored 0%)

    adding: dir/file2 (stored 0%)

    $ rm -rf dir

    ```


    Finally, we unpack the ZIP file again:'
  merge: -1
