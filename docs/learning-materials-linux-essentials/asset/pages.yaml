- pgno: 362
  md: '# Switching Users and Escalating Privilege


    In an ideal world, users would never need to escalate privilege to complete their
    tasks. The system would always “just work” and everything would be configured
    for various access.


    Luckily for us, Linux — out-of-the-box — works like for most users who are not
    system administrators, despite always following the least privilege security model.


    However, there are commands that allow for privilege escalation when needed. Two
    of the most important ones are su and sudo.


    On most Linux systems today, the su command is only used for escalating privileges
    to root, which is the default user if a username is not specified after the command
    name. While it can be used to switch to another user, it is not good practice:
    users should login from another system, over the network, or physical console
    or terminal on the system.


    ```

    emma ~ su -

    Password:

    root ~#

    ```


    After entering the superuser (root) password, the user has a superuser shell (notice
    the # at the end of the command prompt), and for all intents and purposes, the
    superuser (root).


    Sharing passwords is a very bad security practice, so there should be few, if
    any, need for the su command in a modern Linux system.


    The dollar symbol ($) should terminate the command line prompt for a non-privileged
    user, while the pound symbol (#) should terminate the command line prompt for
    the superuser (root) shell. It is highly recommended that final character of any
    prompt never be changed from this “universally understood” standard, which is
    used in learning materials, including these.


    > Never switch to the superuser (root) without passing the login shell (-) parameter.
    Unless explicitly instructed otherwise by the OS or software vendor when su is
    required, always execute su with extremely limited exceptions. User environments
    may cause undesirable configuration changes and issues when used in full privilege
    mode as superuser.


    What is the biggest issue with using su to switch to the superuser (root)? If
    a regular user’s session has been compromised, the superuser (root) password could
    be captured. That’s where “Switch User Do” or “Switch Do” comes in:'
  merge: -1
  img_proc: true
