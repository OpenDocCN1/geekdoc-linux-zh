    # The Long List Option


    The ls command has many options to change its behavior. Let''s look at one of
    the most commonnoptions:


    ```

    $ ls -l

    -rw-r--i-- 1 user staff 3066 Jan 13 2017 report2018.txt

    ```


    -1 creates a long list. Files and directories will each occupy one line, but additional
    information

    about each file and directory will be displayed.


    -rw-r--r-

    Type of file and permissions of the file. Note that a regular file will begin
    with dash, and

    directory will start with d.


    +   1

    Number of links to the file.


    +   user staff

    Specifies ownership of the file. user is the owner of the file, and the file is
    also associated with

    the staff group.


    +   3066

    Size of the file in bytes.


    +   Jan 13 2017

    Time stamp of the last modification to the file.


    +   report2018.txt

    Name of the file.


    Subjects such as ownership, permissions and links will be covered in future sections.
    As you

    see, the long list version of the 1s is oftentimes preferable to the default.


    # Additional Is Options


    Below are some of the ways that we commonly use the ls 1 command. As you can see,
    the

    user can combine many options together to get the desired output.'
