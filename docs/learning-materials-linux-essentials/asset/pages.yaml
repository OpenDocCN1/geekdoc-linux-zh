  img_proc: true
- pgno: 436
  md: '# Answers to Guided Exercises


    +   1. Imagine a program needs to create a one-use temporary file that will never
    be needed again after the program is closed. What would be the correct directory
    in which to create this file?


    Since we don''t care about the file after the program finishes running, the correct
    directory is /tmp.


    +   2. Which is the temporary directory that must be cleared during the boot process?


    The directory is /run or, on some systems, /var/run.


    +   3. What is the parameter for chmod symbolic mode to enable the sticky bit
    on a directory?


    The symbol for the sticky bit in symbolic mode is t. Since we want to enable (add)
    this permission to the directory, the parameter should be +t.


    +   4. Imagine there is a file named .txt in the directory /home/carol/Documents.
    What is the command to create a symbolic link to it named .txt in the current
    directory?


    ln -s is the command to create a symbolic link. Since you should specify the full
    path to the file you are linking, the command is:


    ```

    $ ln -s /home/carol/Documents/document.txt text.txt

    ```


    +   5. Explain the difference between a hard link to a file and a copy of the
    file.


    A hard link is just another name for a file. Even though it looks like a duplicate
    of the original file, for all purposes both the link and the original are the
    same, they point to the same data on disk. Changes made to the contents of the
    link will be reflected on the original, and vice-versa. A copy is a completely
    independent entity, occupying a different place on disk. Changes to the copy will
    not be reflected on the original, and vice-versa.'
  merge: -1
  img_proc: true
- pgno: 437
  md: '# # Answers to Explorational Exercises


    1. Imagine inside a directory you create a file called recipes.txt. Inside this
    directory, you will also create a hard link to this file, called receitas.txt,
    and a symbolic (or soft) link to this called rezepte.txt.


    ```

    $ touch recipes.txt

    $ ln recipes.txt receitas.txt

    $ ln -s recetas.txt rezepte.txt

    ```


    The contents of the directory should be like so:


    ```

    $ ls -lhi

    total 160K

    538833 -rw-r--r-- 4 carol 77K 17 17:25 receitas.txt

    538833 -rw-r--r-- 4 carol 77K 17 17:25 recipes.txt

    538837 lrwxr-xr-x 1 carol 12 jun 24 10:12 rezepte.txt -> recetas.txt

    ```


    Remember that, as a hard link, receitas.txt points to the same inode as recipes.txt.
    What would happen to the soft link rezepte.txt if the name receitas.txt is deleted?
    Why?


    The soft link rezepte.txt would stop working. This is because soft links point
    to names, inodes, and the name receitas.txt no longer exists, even if the data
    is still under the disk under the name recipes.txt.


    2. Imagine you have a flash drive plugged into your system, and mounted on /media/your/FlashA.
    You want to create in your home directory a link called schematics.pdf, pointing
    to the file schema.pdf in the root directory of the flash drive. So, you type
    the command:


    ```

    $ ln /media/youruser/FlashA/schema.pdf --schematics.pdf

    ```


    What would happen? Why?


    The command would fail. The error message would be Invalid cross-device link,
    and it makes the reason clear: hard links cannot point to a target in a different
    partition or device. The only way to create a link like this is to use a symbolic
    or soft link, adding the -s parameter to ln.


    3. Consider the following output of ls -lah:'
  merge: -1
  img_proc: true
- pgno: 438
  md: '# Linux Essentials (Version 1.6) | Topic 5: Security and File Permissions


    ```

    $ ls -lah

    total 3,1M

    drrwxr-xr-x 2 carol 4,0K jun 17 17:27 .

    drrwxr-xr-x 5 carol 4,0K jun 17 17:29 ..

    -IW-r--I-- 1 carol 2,8M jun 17 15:45 compressed.zip

    -IW-r--I-- 4 carol 77K jun 17 17:25 document.txt

    -IW-r--I-- 1 carol 216K jun 17 17:25 image.png

    -IW-r--I-- 4 carol 77K jun 17 17:25 text.txt

    ```


    +   - How many links point to the file document.txt?


    Every file starts with a link count of 1. Since the link count for the file is
    4, there are 3 links pointing to it.


    +   - Are they soft or hard links?


    They are hard links, since soft links do not increase the link count of a file.


    +   - Which parameter should you pass to ls to see which inode each file occupies?


    The parameter is -i. The node will be shown as the first column in the output
    of ls, like below:


    ```

    $ ls -lahi

    total 3,1M

    538773 drrwxr-xr-x 2 rigues 4,0K jun 17 17:27 .

    5245554 drrwxr-xr-x 5 rigues 4,0K jun 17 17:29 ..

    5388840 -IW-r--I-- 1 rigues 2,8M jun 17 15:45 compressed.zip

    5388833 -IW-r--I-- 4 rigues 77K jun 17 17:25 document.txt

    5388837 -IW-r--I-- 1 rigues 216K jun 17 17:25 image.png

    5388833 -IW-r--I-- 4 rigues 77K jun 17 17:25 text.txt

    ```


    4. Imagine you have in your ~/Documents directory a file named clients, and a
    directory named somired. Inside there is a different file also named clients.txt
    with different names. To replicate this structure, use the following commands.


    ```

    $ cd ~/Documents

    $ echo "John, Michael, Bob" > clients.txt

    $ mkdir somired

    $ echo "Bill, Luke, Karl" > somired/clients.txt

    ```'
  merge: -1
  img_proc: true
- pgno: 439
  md: "You then create a link inside somedir named partners.txt pointing to this file,\
    \ with the commands:\n\n```\n$ cd somedir/\n$ ln -s clients.txt partners.txt\n\
    ```\n\nSo, the directory structure is:\n\n```\nDocuments\n|-- clients.txt\n  somedir\n\
    \    |-- clients.txt\n      |-- partners.txt -> clients.txt\n```\n\nNow, you move\
    \ partners.txt from somedir to ~/Documents, and list its contents.\n\n```\n$ cd\
    \ ~/Documents/\n$ mv somedir/partners.txt\n$ less partners.txt\n```\n\nWill the\
    \ link still work? If so, which file will have its contents listed? Why?\n\nThis\
    \ is a \"tricky\" one, but the link will work, and the file listed will be the\
    \ one in ~/Documents, containing the names John, Michael, Bob.\n\nRemember that\
    \ since you did not specify the full path to the target clients.txt when creating\
    \ the soft link partners.txt, the target location will be interpreted as relative\
    \ to the location of the link, in which case is the current directory.\n\nWhen\
    \ the link was moved from ~/Documents/somedir to ~/Documents, it should stop working,\
    \ since the target was no longer in the same directory as the link. However, it\
    \ just happens that there is a file named clients.txt on ~/Documents, so the link\
    \ will point to this file, instead of the original target inside ~somedir.\n\n\
    To avoid this, always specify the full path to the target when creating a symbolic\
    \ link.\n\n+   5. Consider the following files:\n\n```\n-rw-r--r-- 1 rigues rigues\
    \ 19 Jun 24 11:12 clients.txt\nlrwxrxr-x 1 rigues rigues 11 Jun 24 11:13 partners.txt\
    \ -> clients.txt\n```"
  merge: -1
  img_proc: true
- pgno: 440
  md: '# What are the access permissions for partners.txt? Why?


    The access permissions for partners.txt are rw-r-r--, as links always inherit
    the access permissions as the target.'
  merge: -1
  img_proc: true
