- pgno: 404
  md: '# Linux Essentials (Version 1.6) | Topic 5: Security and File Permissions


    r


    Stands for read and has an octal value of 4. This means permission to read the
    directory''s contents, like filenames. But it does not imply permission to read
    the files themselves.


    w


    Stands for write and has an octal value of 2. This means permission to create
    or delete files in a directory, change their names, permissions and owners. If
    a user has the write permission on a directory, the user can change permissions
    of any file in the directory, even if the user has no permissions on the file
    or if the file is owned by another user.


    x


    Stands for execute and has an octal value of 1. This means permission to enter
    a directory, not to list its files (for that, the r permission is needed).


    The last bit about directories may sound a bit confusing. Let''s imagine, for
    example, that you a directory named Another_Directory, with the following permissions:


    ```

    $ ls -ld Another_Directory/

    --xr-xr-x 2 carol 4.0K Dec 20 18:46 Another_Directory

    ```


    Also imagine inside this directory you have a shell script called hello.sh with
    the following permissions:


    ```

    -rwxr-xr-x 1 carol 33 Dec 20 18:46 hello.sh

    ```


    If you are the user and try to list the contents of Another_Directory, you will
    get an error message, as your users read permission for that directory:


    ```

    $ ls -l Another_Directory/

    ls: cannot open directory ''Another_Directory/'': Permission denied

    ```


    However, the user carol does execute permissions, which means that she can enter
    the directory, as long as she has the correct permissions for the respective file.
    In this example, the user has full permissions for the script .sh, so she can
    run the script, even if she''t read the contents of the directory containing it.
    All that is needed is the complete filename.


    ```

    $ sh Another_Directory/hello.sh

    ```'
  merge: -1
  img_proc: true
- pgno: 405
  md: '# Hello LPI World!


    As we said before, permissions are specified in sequence: first for the owner
    of the file, then for the owning group, and for other users. Whenever someone
    tries to perform an action on the file, the permissions are checked in the same
    fashion. First the system checks if the current user owns the file. Otherwise,
    it checks the current user belongs to the group owning the file. In that case,
    it applies the second set of permissions. In any other case, the system will apply
    the third set of permissions. This means that if the current user is the owner
    of the file, only the owner permissions are effective, even if the group or other
    permissions are more permissive than the owner''s permissions.


    # Modifying File Permissions


    The command chmod is used to modify the permissions for a file, and takes at least
    two parameters: the first describes which permissions to change, and the second
    one points to the file or directory where the change will be made. However, the
    permissions can be described in two different ways, or "modes".


    The first one, called *symbolic mode* offers fine grained control, allowing you
    to add or revoke a single permission without modifying others on the set. The
    other mode, called *numeric mode*, is easier to remember and quicker to use if
    you wish to set all permission values at once.


    Both modes will lead to the same result. So, for example, the commands:


    ```

    $ chmod ug+rw-x,o-rwx text.txt

    ```


    and


    ```

    $ chmod 660 text.txt

    ```


    will produce exactly the same output, a file with the permissions set:


    ```

    -rw-rw---- 1 carol carol 765 Dec 20 21:25 text.txt

    ```


    Now, let''s understand how each mode works.'
  merge: -1
  img_proc: true
- pgno: 406
  md: '# Symbolic Mode


    When describing permissions to change in symbolic mode the first character(s)
    indicate(s) whose permissions you alter: the others for the user (u), for the
    group (g), for others (o) and/or for all the three together (a).


    Then you need to tell the command what to do: you grant a permission (+), revoke
    a permission (-), or set it to a specific value (=).


    Lastly, you specify which permission you wish to affect: read (r), write (w),
    or execute (x).


    For example, imagine we have a file called text.txt with the following permission
    set:


    ```

    $ ls -l text.txt

    -rw-rw-r-- 1 carol 765 Dec 20 21:25 text.txt

    ```


    If you wish to grant permissions to members of group owning the file, you would
    use the g+w parameter. It is easier if you think about it this way: “For the group
    (g), grant (+) permissions (w)”. So, the command would be:


    ```

    $ chmod g+w text.txt

    ```


    Let''s check the result with ls:


    ```

    $ ls -l text.txt

    -rw-rw-r-- 1 carol 765 Dec 20 21:25 text.txt

    ```


    If you want to remove permissions for the owner of the same file, think about
    it as: “For the user (u) revoke permissions (r)”. So parameter is u-r, like so:


    ```

    $ chmod u-r text.txt

    $ ls -l text.txt

    --rw-rw-r-- 1 carol 765 Dec 20 21:25 text.txt

    ```


    What if we to set the permissions exactly as rw- for everyone? Then think of it
    as: “For all (a), set exactly (=), read (r), write (w), and no execute (-). So:


    ```

    $ chmod a=rw- text.txt

    $ ls -l text.txt

    ```'
  merge: -1
  img_proc: true
