  md: '```

    $ chmod 660 text.txt

    $ ls -l text.txt

    -rw-rw---- 1 carol 765 Dec 20 21:25 text.txt

    ```


    Besides this, the syntax in numeric mode is the same as in symbolic mode, the
    first parameter represents the permissions you wish to change, and the second
    points to the file or directory where the change will be made.


    **TIP** If a permission value is odd, the file surely is executable!


    Which syntax to use? The Numeric mode is recommended if you want to change the
    permissions to a specific value, for example 640 (rw-r--).


    The symbolic mode is more useful if you want to flip just a specific value, regardless
    of the current permissions for the file. For example, I can add execute permissions
    for the user using just chmod+x script.sh without regard to, or even touching,
    the current permissions for the group and others.


    # # Modifying File Ownership


    The command ownership is used to modify the ownership of a file or directory.
    The syntax is quite simple:


    ```

    chown username:groupname filename

    ```


    For example, let''s check a file called text.txt:


    ```

    $ ls -l text.txt

    -rw-rw---- 1 carol 1881 Dec 10 15:57 text.txt

    ```


    The user who owns the file is carol, and the group is also carol. Now, let''s
    modify the group owning the file to some other group, like students:


    ```

    $ chown carol:students text.txt

    $ ls -l text.txt

    -rw-rw---- 1 carol 1881 Dec 10 15:57 text.txt

    ```


    Keep in mind that the user who owns a file does not need to belong to the group
    who owns a file. In the example above, user carol does not need to be a member
    of the students group.'
