- pgno: 152
  md: '# Case Sensitivity


    Unlike Microsoft Windows, file and directory names on Linux systems are case sensitive.
    Means that the names /etc/ and /ETC/ are different directories. Try the following
    commands:


    ```

    $ cd /\n$ ls

    bin dev home lib64 mnt proc run srv tmp var

    boot etc lib media opt root sbin sys usr

    $ cd ETC

    bash: cd: ETC: No such file or directory

    $ pwd

    /

    $ cd etc

    $ pwd

    /etc

    ```


    The pwd shows you the directory you are currently in. As you can see, changing
    to /ETC did not work as there is no such directory. Changing into the directory
    /etc which exists, did succeed.


    # Creating Directories


    The mkdir command is used to create directories.


    Let''s create a new directory within our home directory:


    ```

    $ cd ~

    $ pwd

    /home/user

    $ ls

    Desktop Documents Downloads

    $ mkdir linux_essentials-2.4

    $ ls

    Desktop Documents Downloads linux_essentials-2.4

    $ cd linux_essentials-2.4

    $ pwd

    /home/emma/linux_essentials-2.4

    ```


    For the duration of this lesson, all commands will take place within this directory
    or in one of its subdirectories.'
  merge: -1
  img_proc: true
