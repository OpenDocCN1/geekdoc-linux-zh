- pgno: 224
  md: 'run it. new_script is functionally still a normal text file, but we managed
    to have it interpreted by Bash. But what if it is written in Perl, or Python?


    It is very good practice to specify the type of interpreter we want to use in
    the first line of a script. This line is called a bang line or more commonly a
    shebang. It indicates to the system how we want this file to be executed. Since
    we are learning Bash, we will be using the absolute path to our Bash executable,
    once again using which:


    ```

    $ which bash

    /bin/bash

    ```


    Our shebang starts with a hash sign and exclamation mark, followed by the absolute
    path above. Let''s open new_script in a text editor and insert the shebang. Let''s
    also take the opportunity to insert a comment into our script. Comments are ignored
    by the interpreter. They are written for the benefit of other users wishing to
    understand your script.


    ```

    #!/bin/bash


    # This is our first comment. It is also good practice to document all scripts.


    echo "Hello World"

    ```


    We will make one additional change to the filename as well: we will save this
    file as new_script.sh. The suffix "sh" does not change the execution of the file
    in any way. It is a convention that bash scripts are labelled with .sh or .bash
    in order to identify them more easily, the same way that Python scripts are unusually
    identified with the suffix .py.


    # Common Text Editors


    Linux users often have to work in an environment where graphical text editors
    are not available. It is therefore highly recommended to develop at least familiarity
    with editing text files from the command line. Two of the most common text editors
    are vi and nano.


    # vi


    vi is a venerable text editor and is installed by default on almost every Linux
    system in existence. vi spawned a clone called Improved or vim adds some functionality
    but maintains the interface of vi. While working with vi is daunting for a new
    user, the editor is popular and well loved by users who learn its features.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# Linux Essentials (Version 1.6) | 3.3 Turning Commands Into a Script


    The most important difference between vi and applications such as Notepad is that
    vi has three different modes. At startup, the keys H, J, K and L are used to navigate,
    not to type. In navigation mode, you can press I to insert mode. At this point,
    you may type normally. To exit insert mode, you press Esc to return to navigation
    mode. From navigation mode, you can press : to enter command mode. From this mode,
    you can save, delete or quit options.


    While vi has a learning curve, the different modes in time allow a savvy user
    to become more efficient than with other editors.


    # nano


    nano is a newer tool, built to be simple and easier to use than vi. nano does
    not have different modes. Instead, a user on startup can begin typing, and uses
    ctrl to access the tools printed at the bottom of the screen.


    | Welcome to nano. | For basic help, type Ctrl+G . |

    | ^G Get Help | ^O Write Out | ^W Where Is | ^K Cut Text | ^J Justify | ^C Cur
    Pos | M-U Unde |

    | ^X Exit | ^R Read File | \A Replace | ^U Uncut Text | ^T To Spell | ^Go To Line
    | M-E Redo |


    Text editors are a matter of personal preference, and the editor that you choose
    to use will have no bearing on this lesson. Becoming familiar and comfortable
    with one or more text editors will pay off in the future.


    # Variables


    Variables are an important part of any programming language, and Bash is no different.
    When you start a new session from the terminal, the shell already sets some variables
    for you. The PATH variable is an example of this. We call these environment variables,
    because they usually define characteristics of the shell environment. You can
    modify and add environment variables, but for now let''s focus on setting variables
    inside your script.


    We will modify our script to look like this:


    ```

    #!/bin/bash


    # This is our first comment. It is also good practice to comment all scripts.


    username=Carol


    echo "Hello $username"

    ```


