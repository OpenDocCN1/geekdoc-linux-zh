    # Introduction


    Managing users and groups on a Linux machine is one of the key aspects of system
    administration. In fact, Linux is a multi-user operating system in which multiple
    users can use the same machine at the same time.


    Information about users and groups is stored in four files within the /etc/ directory
    tree:


    ```

    /etc/passwd

    ```


    a file of seven colon-delimited fields containing basic information about users


    ```

    /etc/group

    ```


    a file of four colon-delimited fields containing basic information about groups


    ```

    /etc/shadow

    ```


    a file of nine colon-delimited fields containing encrypted user passwords


    ```

    /etc/gshadow

    ```


    a file of four colon-delimited fields containing encrypted group passwords'
  merge: -1
  img_proc: true
- pgno: 381
  md: 'All of these files are updated by a command-line tools for user and group management,
    which we will discuss later in this lesson. They can also be managed by graphical
    applications, which provide simpler and more immediate management interfaces.


    **WARNING** Even though the files are plain text, do not edit them directly. Always
    use the tools provided with your distribution for this purpose.


    # The File /etc/passwd


    /etc/passwd is a world-readable file that contains a list of users, each on a
    separate line:


    ```

    frank:x:1001:1001::home/frank:/bin/bash

    ```


    Each line consists of seven colon-delimited fields:


    # **Username**


    The name used when the user logs into the system.


    # **Password**


    The encrypted password (or an x if shadow passwords are used).


    # **User ID (UID)**


    The ID number assigned to the user in the system.


    # **Group ID (GID)**


    The primary group number of the user in the system.


    # **GECOS**


    An optional comment, which is used to add extra information about the user (such
    as the full name). The field can contain multiple comma-separated entries.


    # **Home directory**


    The absolute path of the user''s home directory.


    # **Shell**


    The absolute path of the program that is automatically launched when the user
    logs into the system (usually an interactive shell such as /bin/bash).'
  merge: -1
  img_proc: true
- pgno: 382
  md: '# The File /etc/group


    /etc/group is a world-readable file that contains a list of groups, each on a
    separate line:


    ```

    developer:x:1002:

    ```


    Each line consists of four colon-delimited fields:


    # Group Name


    The name of the group.


    # Group Password


    The encrypted password of the group (or an x if shadow passwords are used).


    # Group ID (GID)


    The ID number assigned to the group in the system.


    # Member list


    A comma-delimited list of users belonging to the group, except those for whom
    this is the primary group.


    # The File /etc/shadow


    /etc/shadow is a file readable only by root and users with root privileges and
    contains the encrypted passwords of users, each on a separate line:


    ```

    frank:$6$i9gjJM4dMueZ2Cd$7JJa8Cd2bbADDFH4dwftvJLOYCCBf./ybKb1IMy7WhWh4fXRcc2xQUVU2N1gb97yIYaiq.mJJammof2Jfr::1829:0:9999:7::

    ```


    Each line consists of nine colon-delimited fields:


    # Username


    The name used when user logs into the system.


    # Encrypted password


    The encrypted password of the user (if the value is !, the account is locked).


    # Date of last password change


    The date of the last password change, as number of days since 01/01/1970. A value
    of Ø means'
