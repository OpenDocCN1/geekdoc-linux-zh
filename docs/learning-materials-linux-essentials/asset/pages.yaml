  md: '# Linux Essentials (Version 1.6) | Topic 2: Finding Your Way on a Linux System


    The find program is usually used to search for files and directories, but without
    any options, it will show you a listing of all the files, directories, and sub-directories
    of your current directory.


    When listing the contents of a directory with ls, the -t and -r options are particularly
    handy. They sort the output by time (-t) and reverse the sorting order (-r). In
    this case, the newest files will be at the bottom of the output.


    TIP


    # Creating Files


    Typically, files will be created by the programs that work with the data stored
    in the files. An empty file can be created using the touch command. If you run
    touch on an existing file, the file''s contents won''t be changed, but the file
    modification timestamp will be updated.


    Run the following command to create some files for the globbing lesson:


    ```

    $ touch globs/question1 globs/question2012 globs/question23 globs/question13

    globs/question14

    $ touch globs/star10 globs/star1100 globs/star2002 globs/star2013

