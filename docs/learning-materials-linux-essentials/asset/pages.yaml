    # The System Load


    Each process on a system can potentially consume system resources. The so-called
    system load tries to aggregate the overall load of the system into a single numeric
    indicator. You can see the current load with the uptime:


    ```

    $ uptime 22:12:54 13 days, 20:26, 1 user, load average: 2.91, 1.59, 0.39

    ```


    The last three digits indicate the system''s load average for the last minute
    (2.91), the last five minutes (1.59) and the last fifteen minutes (0.39), respectively.


    Each of these numbers indicates how many processes were waiting for CPU resources
    or for input/output operations to complete. This means that these processes were
    ready to run if they had the respective resources.


    # System Logging and System Messaging


    As soon as the kernel and the processes starting execution and communicating with
    each other, a lot of information is produced. Most of it is sent to files — the
    so-called log files, or simply, logs.


    Without logging, searching for an event that happened on a server would give sysadmins
    a headache, hence the importance of having a standardized and centralized way
    of keeping track of any system events. Besides, logs are determinant and telling
    when it comes to troubleshooting and security as well as reliable data sources
    for understanding system statistics and making trend predictions.


    # Logging with the syslog Daemon


    Traditionally, system messages have been managed by the standard logging facility
    — syslog — or any of its derivatives — syslog-ng or rsyslog. The logging daemon
    collects messages from other services and stores them in files, typically under
    /var/log. However'
