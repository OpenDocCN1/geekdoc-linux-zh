    # Industry Uses of Linux


    Linux is heavily used among the software and Internet industries. Sites like W3Techs
    report that about 68% of the website servers on the Internet are powered by Unix
    and the biggest portion of those are known to be Linux.


    This large adoption is given not only for the free nature of Linux (as both in
    free beer and in freedom of speech) but also for its stability, flexibility and
    performance. These characteristics allow vendors to offer their services with
    a lower cost and a greater scalability. A significant portion of Linux systems
    nowadays run in the cloud, either as an IaaS (Infrastructure as a service), PaaS
    (Platform as a Service) or SaaS (Software as a Service) model.


    SaaS is to share the resources of a cloud server by offering access to virtual
    machines that are, in fact, multiple operating systems as guests on a host machine
    over an important piece of software that is called a hypervisor. The hypervisor
    is responsible for making possible for these guest OSs to run by segregating and
    managing the resources available on the host machine to those guests. That''s
    what we call virtualization. In the IaaS model, you only pay for the fraction
    of resources your infrastructure uses.


    Linux has three well known open source hypervisors: Xen, KVM and VirtualBox. Xen
    is probably the oldest of them. KVM ran out Xen as the most prominent Linux hypervisor.
    It is its development sponsored by RedHat and is used by other players, both in
    public cloud and in private cloud. VirtualBox belongs to Oracle since its acquisition
    of Microsystems and is usually used by end users because of its easiness of use
    and administration.


    PaaS, on the other hand, build up on the IaaS model, both technically and conceptually.
    In PaaS instead of a virtual machine, the users have access to a platform where
    it will be possible to deploy and run their application. The goal here is to ease
    the burden of dealing with system administration and operating systems updates.
    Heroku is a common SaaS example where program code can be run without taking care
    of the underlying containers and virtual machines.


    Lastly, SaaS is the model where you usually pay for a subscription in order to
    just use a software without worrying about anything else. Dropbox and Salesforce
