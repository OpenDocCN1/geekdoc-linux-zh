    list all files and directories, including hidden files and directories.


    ```

    $ ls -a ~~

    ..

    .bash_history

    .bash_logout

    .bash_profile

    .bashrc

    Documents

    ```


    Hidden files and directories will always begin with a period (.). By default,
    a user''s home directory will include many hidden files. These are often used
    to set user-specific configuration'
