  md: "# Linux Essentials (Version 1.6) | Topic 3: The Power of the Command Line\n\
    \n```\n$ ./new_script.sh Carol Dave\nHello Carol!\nNumber of arguments: 2.\n```\n\
    \n# Conditional Logic\n\nThe use of conditional logic in programming is a vast\
    \ topic, and won't be covered deeply in this lesson. We will focus on the syntax\
    \ of conditionals in Bash, which differs from most other programming languages.\n\
    \nLet's begin by reviewing what we hope to achieve. We have a simple script which\
    \ should be able to print a greeting to a single user. If there is anything other\
    \ than one user, we should print an error message.\n\n+   * The condition we are\
    \ testing is the number of users, which is contained in the variable $$. We would\
    \ like to know the value of $$ is 1.\n* If the condition is true, the action we\
    \ take is to greet the user.\n* If the condition is false, we will print an error\
    \ message.\n\nNow the logic is clear, we will focus on the syntax required to\
    \ implement this logic.\n\n```\n```!/bin/bash\n\n# A simple script to greet a\
    \ single user\n\nif [ $$ -eq 1 ]\nthen\n    username=$1\n\n    echo \"Hello $username\"\
    \nelse\n    echo \"Please enter only one argument.\"\nfi\necho \"Number of arguments:\
    \ $$.\"\"\n```\n```\n\nThe conditional logic is contained between if and fi. The\
    \ condition to test is located between square brackets [ ]. and the action to\
    \ take the condition should be true identified after then. Note the spaces between\
    \ the square brackets and the logic contained. Omitting this space will cause\
    \ errors."
  merge: -1
