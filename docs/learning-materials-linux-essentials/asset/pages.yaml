- pgno: 83
  md: '# Linux commands soon.


    # Command Behavior Types


    The shell supports two types of commands:


    # Internal


    These commands are part of the shell itself and are not separate programs. There
    are around 30 such commands. Their main purpose is executing tasks inside the
    shell (e.g. cd, set, export).


    # External


    These commands reside in individual files. These files are usually binary programs
    or scripts. When a command is not a shell builtin, the shell uses the PATH variable
    to search for an executable file with same name as the command. In addition to
    programs which are installed with the distribution''s package manager, users can
    create their own external commands as well.


    The command type shows what type a specific command is:


    ```

    $ type echo

    echo is a shell builtin

    $ type man

    man is /usr/bin/man

    ```


    # Quoting


    As a Linux user, you will have to create or manipulate files or variables in various
    ways. This is easy when working with short filenames and single values, but it
    becomes complicated when, for example, spaces, special characters and variables
    are involved. Shells provide a feature quoting which encapsulates such data using
    various kinds of quotes ("", ''\''). In Bash, there are three types of quotes:


    +   * Double quotes

    * Single quotes

    * Escape characters


    For example, the following commands do not act in the same way due to quoting:'
  merge: -1
