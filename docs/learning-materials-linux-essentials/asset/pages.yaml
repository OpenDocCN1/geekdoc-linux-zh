    # A Snapshot of Processes: ps


    Another very useful command to get information about processes ps. Whereas top
    provides dynamic information, that of ps is static.


    If Invoked without options, the output of ps is quite discrete and relates only
    to the processes attached to the current shell:


    ```

    $ ps

    PID TTY             TIME CMD

    2318 pts/0          00:00:00 bash

    2443 pts/0          00:00:00 ps

    ```


    The displayed information has to do with the process identifier (PID), the terminal
    in which the process is run (TTY), the CPU time taken by the process (TIME) and
    the command which started the process (CMD).


    A useful switch for ps is -f which shows the full-format listing:


    ```

    $ ps -f

    UID    PID PPID  C STIME TTY     TIME CMD

    carol 2318 1682  0 08:38 pts/1  00:00:00 bash

    carol 2443 2318  0 08:46 pts/1  00:00:00 ps -f

    ```


    In combination with other switches, -f shows the relationship between parent and
    child processes:


    ```

    $ ps -uf

    USER     PID %CPU %MEM VSZ   RSS TTY     STAT    TIME    COMMAND

