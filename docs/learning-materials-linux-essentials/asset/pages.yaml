- pgno: 21
  md: '# # Answers to Explorational Exercises


    +   1. Considering cost and performance, which distributions are mostly suitable
    for a business that aims to reduce licensing costs, while keeping performance
    at its highest? Explain why.


    One of the most suitable distributions to be used by business is CentOS. This
    is because it incorporates all Red Hat products, which are further used within
    their commercial operating system. Similarly, Ubuntu LTS releases guarantee support
    for a longer period of time. The stable versions of Debian GNU/Linux are also
    often used in enterprise environments.


    +   2. What are the major advantages of the Raspberry Pi and which functions can
    they take in business?


    Raspberry Pi is small in size working as a normal computer. Furthermore, it is
    low cost and can handle web traffic and many other functionalities. It can be
    used as a server, a firewall and can be used as the main board for robots, and
    many other small devices.


    +   3. What range of distributions does Amazon Cloud Services and Google Cloud
    offer? Name at least three common ones and two different ones.


    The common distributions between Amazon and Google Cloud Services are Ubuntu,
    CentOS and Red Hat Enterprise Linux. Each cloud provider also offers specific
    distributions that the other one doesn''t. Amazon has Amazon Linux and Kali Linux,
    while Google offers the use of FreeBSD and Windows Servers.'
