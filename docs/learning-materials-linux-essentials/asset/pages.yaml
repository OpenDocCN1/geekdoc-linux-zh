    # Moving Files


    Files are moved from one directory to another with the mv command.


    Create a few directories to move into:


    ```

    $ cd ~/linux_essentials-2.4/

    $ mkdir dir1 dir2

    $ ls

    dir1 dir2 file1 file2 file3 file5

    ```


    Move file1 into dir1:


    ```

    $ mv file1 dir1

    $ ls

    dir1 dir2 file2 file3 file5

    $ ls dir1

    file1

    ```


    Notice how the last argument to mv is the destination directory. Whenever the
    last argument to mv is a directory, files are moved into it. Multiple files can
    be specified in a single mv command:


    ```

    $ mv file2 file3 dir2

    $ ls

    dir1 dir2 file5

    $ ls dir2

    file2 file3

    ```


    It is also possible to use mv to move and rename directories. Rename dir1 to dir3:'
