  md: 'that the user must change the password at the next access.


    # Minimum password age


    The minimum number of days, after a password change, which must pass before the
    user will be allowed to change the password again.


    # Maximum password age


    The maximum number of days that must pass before a password change is required.


    # Password warning period


    The number of days, before the password expires, during which the user is warned
    that the password must be changed.


    # Password inactivity period


    The number of days after a password expires during which the the user should update
    the password. After this period, if the user does not change the password, the
    account will be disabled.


    # Account expiration date


    The date, as number of days since 01/01/1970, in which the user account will be
    disabled. An empty field means that the user account will never expire.


    # A reserved field


    A field that is reserved for future use.


    # The File /etc/gshadow


    /etc/gshadow is a file readable only by root and by users with root privileges
