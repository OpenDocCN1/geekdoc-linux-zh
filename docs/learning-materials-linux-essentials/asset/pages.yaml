  md: '# TLS


    Transport Layer Security (TLS) is a protocol to offer security over network connections
    by making use of cryptography. TLS is the successor of the Secure Sockets Layer
    (SSL) which has been deprecated because of several flaws. TLS has evolved a couple
    of times in order to adapt itself and become more secure, so it''s current version
    is 1.3. It can provide both privacy, and authenticity by making use of what is
    called symmetric and public-key cryptography. By saying that, we mean that in
    one use, you can be sure that nobody will be able to eavesdrop or alter your communication
    with that server during that session.


    The most important lesson here is recognizing that a website is trustworthy. You
    should look for the "lock" symbol on the browser''s address bar. If you desire,
    you can click on it to inspect the certificate that plays an important role in
    the HTTPS protocol.


    TLS is used in the HTTPS protocol (HTTP over TLS) in order to make it possible
    to send sensitive data (like your credit card number) through the web. Explaining
    how TLS works beyond the purpose of this article, but you can find more information
    on the Wikipedia wiki.


    # File and E-mail Encryption with GnuPG


    There are plenty of tools for securing emails but one the most important of them
    is certainly GnuPG. GnuPG stands for GNU Privacy Guard and it is an open source
    implementation of OpenPGP which is an international standard certified with RFC
    4880.


    GnuPG can be used to sign, encrypt and decrypt texts, e-mails, files, directories,
    and even disk partitions. It works with public-key cryptography and is widely
    available. In a nutshell GnuPG creates a pair of files which contain your public
    and private keys. As the names imply, the public key can be available to anyone
    and the private keys needs to be kept in secret. People will use your public key
    to encrypt data which only your private key will be to decrypt.


    You can also use your private key to sign any file or e-mail which can be validated
    against the corresponding public key. This digital signaturese to the real world
    signature. As long as you are the only one who possesses your private key, the
    receiver can be sure that it is you who authored it. By making use of the cryptographic
    hashing functionality GnuPG will also guarantee no changes have been made after
    the signature any changes to the content would invalidate the signature.


    GnuPG is a very powerful tool and, in a certain extent, also a complex one. You
    can find more information on its website and Archlinux wiki (Archlinux wiki is
    a very good source of information, even though you don''t use Archlinux).'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Disk Encryption


    A good way to secure your data is to encrypt your whole disk or partition. There
    are many open source softwares you can use to achieve such a purpose. How they
    work and what level of encryption they offer also varies significantly. There
    are basic two methods available: stacked and block device encryption.


    Stacked filesystem solutions are implemented on top of existing filesystem. When
    using this method, the files and directories are encrypted before being stored
    on the filesystem and decrypted after reading them. This means the files are stored
    on the host filesystem in an encrypted form (meaning that their contents, and
    usually also their file/folder names, are replaced by random-looking data), but
    other than that, they still exist in filesystem as they would without encryption,
    as normal files, symlinks, hardlinks, etc.


    On the other hand, block device encryption happens below the filesystem layer,
    making everything that is written to a block device is encrypted. If you look
    to the block while it''s offline, it will look like a large section of random
    data and you won''t even be able to tell what type of filesystem is there without
    decrypting it first. This means you can''t tell what is a file or directory; how
    big they are and what kind of data it is, metadata, directory structure and permissions
    are also encrypted.


    Both methods have their own pros and cons. Among all the options available, you
    should take a look at dm-crypt, which is the de-facto standard for block encryption
    for Linux systems, since it''s native in the kernel. It can be used with LUKS
    (Linux Unified Key Setup) extension, which is a specification that implements
    a platform-independent standard for use with various tools.


    If you want a stackable method, you should take a look at EncFS, which is probably
    the easiest way to secure data on Linux because it does not require root privileges
    to implement and it can work on an existing filesystem without modifications.


    Finally, if you need to access data on various platforms, check out Veracrypt.
    It is the successor of a TrueCrypt and allows the creation of encrypted media
    and files, which can be used on Linux as well as macOS and Windows.'
  merge: -1
  img_proc: true
