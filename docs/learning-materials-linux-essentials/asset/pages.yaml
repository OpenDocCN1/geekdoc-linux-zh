    # /etc/shadow


    The following table lists the attributes stored in the file /etc/shadow, commonly
    referred to as the “shadow” file. The file contains fields always delimited by
    a colon (:). Although the file has many fields, most are beyond the scope of this
    lesson, other than the first two.


    The basic syntax for a line on this file is:


    ```

    USERNAME:PASSWORD:LASTCHANGE:MINAGE:MAXAGE:WARN:INACTIVE:EXPDATE

    ```


    Where:


    # USERNAME


