- pgno: 24
  md: 'important to install packages from the correct repository designed to the particular
    distribution. The end user usually doesn''t have to worry about those details,
    as the distribution''s package manager will choose the right packages, the required
    dependencies and future updates. Dependencies are auxiliary packages needed by
    programs. For example, if a library provides functions for dealing with JPEG images
    which are used by multiple programs, this library is packaged in its own package
    on which all applications using the library depend.


    The commands dpkg and rpm operate on individual package files. In practice, almost
    all package management tasks are performed by the commands apt-get or apt on systems
    that use DEB packages or yum or dnf on systems. These commands work with catalogues
    of packages, can download new packages and their dependencies, and check for newer
    versions of the installed packages.


    # Package Installation


    Suppose you have heard about a command called figlet which prints enlarged text
    on the terminal and you want to try it. However, you get the following message
    after executing the command figlet:


    ```

    $ figlet

    -bash: figlet: command not found

    ```


    That probably means the package is not installed on your system. If your distribution
    works with DEB packages, you can search its repositories using apt-cache search
    package_name or apt search_name. The apt-cache command is used to search for packages
    and to list information about available packages. The following command looks
    for any occurrences of the term "figlet" in the package''s names and descriptions:


    ```

    $ apt-cache search figlet

    figlet - Make large character ASCII banners out of ordinary text

    ```


    The search identified a package called figlet that corresponds to the missing
    command. The installation and removal of a package require special permissions
    granted only to the system''s administrator: the user named root. On desktop systems,
    ordinary users can install or remove packages by prepending the command sudo to
    the installation/removal commands. That will require you to type your password
    to proceed. For DEB packages, the installation is performed with the command apt-get
    install package_name or apt install package_name:


    ```

    $ sudo apt-get install figlet

    ```'
