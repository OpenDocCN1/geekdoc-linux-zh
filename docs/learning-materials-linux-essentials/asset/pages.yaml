    and could be considered a system account as well, even though they are not created
    at system installation. E.g., on Fedora-based (including Red Hat) Linux distributions,
    the user for the Apache Web server has UID (and GID) 48, clearly a system account,
    despite having a home directory (usually at /usr/share/httpd or /var/www/html/).


    > From the standpoint of the LPI Essentials, system accounts are UIDs <1000, and
    regular user accounts are UIDs >1000. Since the regular user accounts are >1000,
    these UIDs can also include service accounts.


