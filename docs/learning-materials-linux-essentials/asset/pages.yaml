- pgno: 287
  md: '# Answers to Guided Exercises


    +   1. Describe these terms:


    Processor


    A general term that applies to any type of processor. Often used incorrectly as
    a synonym for CPU.


    CPU


    A Central Processing Unit. A processing unit providing support for general purpose
    computational tasks.


    GPU


    A Graphical Processing Unit. A processing unit optimized for supporting activities
    relating to the presentation of graphics.


    +   2. If you are primarily running video editing applications (a computationally
    intensive activity) which components and characteristics would you expect to have
    the most impact on system usability:


    CPU cores


    Yes. Multiple cores support the concurrent presentation and rendering tasks required
    by video editing.


    CPU speed


    Yes. Video rendering requires a significant amount of computational activity.


    Available system memory


    Likely. The uncompressed video used in editing is large. General purpose systems
    often come with 16 or even 32 gigabytes of memory allows the system to handle
    more frames of uncompressed video making activities much efficient.


    Storage system


    Yes. Video files are large. The overhead of SSD drives supports more efficient
    transfer. Slower network drives are likely to be counterproductive.


    GPU


    No. GPU primarily impacts the presentation of the rendered video.'
  merge: -1
  img_proc: true
