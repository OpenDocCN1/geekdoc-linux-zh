  md: '# 4.2 Lesson 1


    | Certificate: | Linux Essentials |

    | --- | --- |

    | Version: | 1.6 |

    | Topic: | 4 The Linux Operating System |

    | Objective: | 4.2 Understanding Computer Hardware |

