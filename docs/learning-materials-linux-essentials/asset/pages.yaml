    the computer boots up and constantly reflects the current state of the system.
    /proc includes information about:


    +   - Running processes

    - Kernel configuration

    - System hardware


    Besides all data concerning processes that we will see in the next lesson, this
    directory also stores files with information about the system''s hardware and
    the kernel''s configuration settings. Some of these files include:


    # /proc/cpuinfo


