- pgno: 182
  md: '# Archiving Tools


    The tar program is probably the most widely used archiving tool on Linux systems.
    In case you are wondering why it is named how it is, as is an abbreviation for
    "tape archive". Files created with tar are often called tar balls. It is very
    common for applications distributed as source code to be in tar.


    The GNU version of tar that Linux distributions ship with has a lot of options.
    This lesson is going to cover the most commonly used.


    Let''s start off by creating an archive of the files used for compression:


    ```

    $ cd ~/linux_essentials-3.1

    $ tar cf archiving/3.1.tar compression

    ```


    The c option instructs tar to create a new archive file and the f option is the
    name of the file to create. The argument immediately following the options is
    going to be the name of the file to work on. The rest of the arguments are to
    any files or directories you wish to add, list, or extract from the file. In the
    example, we are adding the directory compression and all of its contents to the
    archive.


    To view the contents of a tar ball, use the t option of tar:


    ```

    $ tar -tf 3.1.tar

    compression/

    compression/bigfile-xz.1

    compression/bigfile-gz9.gz

    compression/hosts.gz

    compression/bigfile2

    compression/bigfile

    compression/bigfile-gz1.gz

    compression/bigfile-xz9.xz

    compression/bigfile3

    compression/bigfile4

    ```


    Notice how the options are preceded with - . Unlike most programs, with tar, the
    - isn''t required when specifying options, although it doesn''t cause any harm
    if it is used.


    You can use the -v option to let tar output the names of files it operates on
    when creating or extracting an archive.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'Now let''s extract the file:


    ```

    $ cd ~/linux_essentials-3.1/archiving

    $ ls

    3.1.tar

    $ tar xf 3.1.tar

    $ ls

    3.1.tar compression

    ```


    Suppose you only need one file out of the archive. If this is the case, you can
    specify it after the archive''s file name. You can specify multiple files if necessary:


    ```

    $ cd ~/linux_essentials-3.1/archiving

    $ rm -rf compression

    $ ls

    3.1.tar

    $ tar xvf 3.1.tar compression/hosts.gz

    compression/

    compression/bigfile-xz1.xz

    compression/bigfile-gz9.gz

    compression/hosts.gz

    compression/bigfile2

    compression/bigfile

    compression/bigfile-gz1.gz

    compression/bigfile-xz9.xz

    compression/bigfile3

    compression/bigfile4

    $ ls

    3.1.tar compression

    $ ls compression

    hosts.gz

    ```


    With the exception of absolute paths (paths beginning with /), tar files preserve
    the entire path to files when they are created. Since the file 3.1.tar was created
    with a single directory, that directory will be created relative to your current
    working directory when extracted. Another example should clarify this:


    ```

    $ cd ~/linux_essentials-3.1/archiving

    $ rm -rf compression

    $ cd ../compression

    $ tar cf ..../tar/3.1-nodir.tar *

    ```'
