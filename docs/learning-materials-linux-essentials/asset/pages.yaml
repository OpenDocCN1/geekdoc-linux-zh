    # CC BY-NC (“Attribution-NonCommercial")


    The work may be edited and distributed by naming the author, but only under non-commercial
    conditions.


    # CC BY-NC-SA (“Attribution-NonCommercial-ShareAlike")


    As BY-NC, except that the work may only be shared under the same conditions (i.e.
    a copyleft-like license).


    # CC BY-NC-ND (“Attribution-NonCommercial-NoDerivatives")


    The most restrictive license: the distribution is allowed with attribution of
    the author, but only unchanged and under non-commercial conditions.


    # Business Models in Open Source


    In retrospect, the triumph of FLOSS acts as a grassroots movement of technophile
    idealists who, independent of economic constraints and free of monetary dependencies,
    put their work at the service of the general public. At the same time, companies
    worth billions have been created in the FLOSS environment; to name just one, the
    US company Red Hat founded in 1993 with annual sales of over 3 billion USD (2018),
    was taken over by the giant IBM in 2018.


    So let''s take a look at the tension between the free and mostly free-of-charge
    distribution of high-quality software and the business models for its creators,
    because one thing should be clear: the countless highly qualified developers of
    free software must also earn money, and the originally purely-commercial FLOSS
    environment must therefore develop sustainable business models in order to preserve
    its cosmos.


    A common approach, especially for larger projects in the initial phase, is the
    so-called crowdfunding, i.e the collection of money donations via a platform like
    Kickstarter. In return, the donors receive a pre-defined bonus from the developers
    in the event of success, i if previously defined goals are achieved, it has unlimited
    access to the product or special features.


    Another approach is dual licensing: free software is offered in parallel under
    a more restrictive or even proprietary license, in turn guarantees the customer
    more extensive services (response times in the event of errors, updates, versions
    for certain platforms, etc.). One example among many is ownCloud, which is being
    developed under the GPL and offers customers a “Business Edition” under a proprietary
    license.


    Let us also ownCloud as an example of widespread FLOSS business model: professional
    services. Many companies lack the necessary in-house technical knowledge to set
    up and operate complex and critical software reliably and, above all, securely.
    That''s why they buy professional services such as consulting, maintenance or
    helpdesk directly from the'
