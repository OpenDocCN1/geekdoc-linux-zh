    # Deleting Files and Directories


    The rm command can delete files and directories, while the rmdir command can only
    delete directories. Let''s clean up the moving directory by deleting file5:


    ```

    $ cd ~/linux_essentials-2.4/

    $ ls

    dir2 dir3 file5

    $ rmdir file5

    rmdir: failed to remove ''file5'': Not a directory

    $ rm file5

    $ ls

    dir2 dir3

    ```


    By default rmdir can only delete empty directories, therefore we had to use rm
    to delete a regular file. Try to delete the deleting directory:


    ```

    $ cd ~/linux_essentials-2.4/

    $ ls

    copying creating deleting globs moving

    $ rmdir deleting

    rmdir: failed to remove ''deleting'': Directory not empty

    $ ls -d deleting

    total 0

    drwxr-xr-x. 2 emma Mar 26 14:58 directories

    drwxr-xr-x. 2 emma Mar 26 14:58 files

    ```


    By default, rmdir refuses to delete a directory that is not empty. Use rmdir to
    remove one of the empty subdirectories of the deleting directory:'
