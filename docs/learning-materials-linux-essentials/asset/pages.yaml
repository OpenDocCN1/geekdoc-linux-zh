    ```

    $ TWOWORDS="two words"

    $ touch $TWOWORDS

    $ ls -l

    -IW-r--r-- 1 carol carol      @ Mar 10 14:56 two

    -IW-r--r-- 1 carol carol      @ Mar 10 14:56 words

    $ touch ''$TWOWWORDS''

    $ ls -l

    -IW-r--r-- 1 carol carol      @ Mar 10 14:56 two

    -IW-r--r-- 1 carol carol      @ Mar 10 14:58 ''two words''

    -IW-r--r-- 1 carol carol      @ Mar 10 14:56 words

    $ touch ''$TWOWORDS''

    $ ls -l

    -IW-r--r-- 1 carol carol      @ Mar 10 15:00 ''$TWOWORDS''

    -IW-r--r-- 1 carol carol      @ Mar 10 14:56 two

    -IW-r--r-- 1 carol carol      @ Mar 10 14:58 ''two words''

    -IW-r--r-- 1 carol carol      @ Mar 10 14:56 words

    ```


    The line with TWOWORDS= is a Bash variable that we have created ourselves. We
    will introduce variables later. This is just meant to show how quoting affects
    the output of variables.


    # Double Quotes


    Double quotes tell the shell to take the text in between the quote marks ("...")
    as regular characters. All special characters lose their meaning, except the $
    (dollar sign), \ (backslash) and ` (backquote). This means variables, command
    substitution and arithmetic functions can still be used.


    For example, the substitution of the $USER variable is not affected by the double
    quotes:


    ```

    $ echo I am $USER

    I am tom

    $ echo "I am $USER"

    I am tom

    ```


    A space character, on the other hand, loses its meaning as an argument separator:


    ```

    $ touch new file

    $ ls -l

    -IW-IW-I-- 1 tom students 0 Oct 8 15:18 file

    -IW-IW-I-- 1 tom students 0 Oct 8 15:18 new

    ```'
