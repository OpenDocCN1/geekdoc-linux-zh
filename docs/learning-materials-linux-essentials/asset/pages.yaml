    $ tar -cjf bzip2.tar.bz bigfile2 bigfile3 bigfile3

    $ tar -cf xz.tar.xz bigfile2 bigfile3

    $ ls -l | grep tar

    -rw-r--r-- 1 emma 450202 Jun 27 05:56 bzip2.tar.bz

    -rw-r--r-- 1 emma 548656 Jun 27 05:56 gzip.tar.gz

    -rw-r--r-- 1 emma 147068 Jun 27 05:56 xz.tar.xz

    ```


    Notice how the .tar files have different sizes. This shows that they were successfully
    compressed. If you create compressed .tar archives, you should always add a file
    extension denoting the algorithm you used. They are .xz, .bz, and .gz for xz,
    bzip2, and gzip, respectively. Sometimes shortened extensions such as .tar are
    used.


    It is possible to decompress already uncompressed archives. Use the u option to
    decompress. If you attempt to add a u archive, you will get an error.


