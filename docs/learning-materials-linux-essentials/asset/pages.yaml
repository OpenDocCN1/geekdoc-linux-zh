    # # Introduction


    The Unix operating system was originally designed for mainframe computers in the
    mid-1960s. These computers were shared among many users, who accessed the system''s
    resources through terminals. These fundamental ideas carry through to Linux systems
    today. We still talk about using "terminals" to enter commands in the shell, and
    every Linux system is organized in such a way that it is easy to create many users
    on a single system.


    # # Home Directories


    This is an example of a normal file system in Linux:


    ```

    $ tree -L 1 / /

    |├── bin

    ├── boot

    ├── cdrom

    ├── dev

    └── etc

    ```'
