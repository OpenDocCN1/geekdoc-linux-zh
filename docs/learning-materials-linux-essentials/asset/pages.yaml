- pgno: 46
  md: '# Linux Essentials (Version 1.6) | Topic 1: The Linux Community and a Career
    in Open Source


    Regardless of whether you have to pay for the software or not, there are four
    criteria which constitute free software. Richard Stallman describes these criteria
    as “the four essential freedoms”, the counting which he starts from zero:


    +   - The freedom to run the program as you wish, for any purpose (freedom 0).


    Where, how and for what purpose the software is used can neither be prescribed
    nor restricted.


    +   - The freedom to study how the program works, and how it does your computing
    as you wish (freedom 1). Access to the source code is a precondition for this.


    Everyone may change the software according to their ideas and needs. In this turn
    presupposes that the so-called source code, i.e all files of a software consists,
    must be available in a format readable by programmers. And, of course, this right
    applies to a single user who may want to add a single feature, as well as to software
    companies that build complex systems like smartphone operating systems or router
    firmware.


    +   - The freedom to redistribute copies so you can help others (freedom 2).


    This freedom explicitly encourages each user to share the software with others.
    It is therefore a matter of the widest possible distribution and thus the widest
    community of users and developers who, on the basis of these freedoms, further
    develop and improve the software for the benefit of all.


    +   - The freedom to distribute copies of your modified versions to others (freedom
    3). By doing this you can give the community a chance to benefit from your changes.
    Access to the code is a precondition for this.


    This is not only about the distribution of free software, but about the distribution
    of modified free software. Anyone who makes changes to free software has the right
    to make the changes available to others. If they do so, they are obliged to do
    so freely as well, i. they must not restrict the original freedoms when distributing
    the software, even if modified or extended it. For example, if a group of developers
    has different ideas about the direction of a specific software than the original
    authors, it can split off its own development branch (called a fork) and continue
    it as a new project. But, of course, all obligations associated with these freedoms
    remain.


    The emphasis on the idea of freedom is also consistent insofar as every freedom
    movement is directed against something, namely an opponent who suppresses the
    postulated freedoms, who regards software as property and wants to keep it lock
    and key. In contrast to free software, such software is proprietary.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Open Source Software vs. Free Software


    For many, free software and open source software are synonyms. The frequently
    used abbreviation FOSS for Free and Open Source Software emphasizes this commonality.
    FLOSS for Free/Libre and Open Source Software is another popular term, which unmistakably
    emphasizes the idea of freedom also for other languages than English. However,
    if one considers the origin and development of both terms, a differentiation is
    worthwhile.


    The term free software with the definition of the described four freedoms goes
    back to Richard Stallman and the GNU project founded in 1985 — almost 10 years
    before the emergence of Linux. The name “GNU is not Unix” describes the intent
    with a wink of the eye: GNU started an initiative to develop a technically convincing
    solution — namely the operating system Unix — from scratch, to make it available
    to the general public and to improve continuously with the general public. The
    openness of the source code was a technical and organizational necessity for this,
    but in its self-image the software movement is a social and political — some also
    say ideological—movement.


    With the success of Linux, the collaborative projects of the Internet, and the
    thousands of projects and companies that emerged in this new software cosmos,
    the social aspect increasingly receded into the background. The openness of the
    source code itself changed from a technical requirement to a defining feature:
    as soon the source code was visible, the software was considered “open source”.
    The social motives gave to a more pragmatic approach to software development.


    Free and open source software work on the same thing, with the same methods and
    in a worldwide community of individuals, projects and companies. But since they
    come together from different directions — one social and one pragmatic—technical—
    there are sometimes conflicts. These conflicts arise when the joint work does
    not correspond to the original goals of both movements. This happens especially
    when software reveals its sources but does not respect the four freedoms of free
    software at the same time, for example there are restrictions on disclosure, change,
    or connections with other software components.


    The license under which the software is available determines which conditions
    a software is subject to with regard use, distribution and modification. And because
    requirements and motives can be very different, countless licenses have been created
    in the FOSS area. Due to the much more fundamental approach of the free software
    movement, it is not surprising that it does not recognize many open source licenses
    as “free” and therefore rejects them. Conversely, this is hardly the case due
    to the much more pragmatic open source approach.


    Let’s take a brief look at the actually very complex area of licenses.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Linux Essentials (Version 1.6) | Topic 1: The Linux Community and a Career
    in Open Source


    # Licenses


    Unlike a refrigerator or a car, software is not a physical product, but a digital
    product. Thus, a company cannot actually transfer ownership of such a product
    by selling it and changing the physical possession — rather, it transfers the
    rights of use to that product, and the user contractually agrees to those of use.
    Which rights of use are allowed and all are not recorded in the software license,
    and thus becomes understandable how important the regulations contained therein.


    While large vendors of proprietary software, such as Microsoft or SAP, have their
    own licenses that are precisely tailored to their products, the advocates of free
    and open source software have from the outset strive for clarity and general validity
    of their licenses, because after all, every user should understand them and, if
    necessary, use himself for his own developments.


    However, it should not be conceded that this ideal of simplicity can be achieved
    because too many specific requirements and internationally not always compatible
    legal understandings stand in the way of this. give one example: German and American
    copyright law are fundamentally different. According to German law there is one
    person as author (more precisely: Urheber), whose work is his intellectual property.
    The author can grant permission to use his work, he can not assign or give up
    his authorship. The latter is to American law. Here, too, there is an author (who,
    however, can be a company or an institution), but he has only exploitation rights
    which can transfer in part or in full and thus completely detach from his work.
    An internationally valid licence must be interpreted with respect of different
    legislation.


    The consequences are numerous and sometimes very different FOSS licenses. Worse,
    still, are different versions of a license, or a mix of licenses (in a project,
    or even connecting multiple projects) which can cause confusion or even legal
    disputes.


    Both representatives of free software and the advocates of the clearly economically
    oriented open source movement created their own organizations, which today are
    decisively responsible for the formulation of software licenses according to their
    principles and support their members in their enforcement.


    # Copypeleft


    The already mentioned Free Software Foundation (FSF) has formulated the GNU General
    Public License (GPL) as one of the most important licenses for free software,
    which is used by many projects, e.g the Linux kernel. In addition, it has released
    licenses with case-specific customizations, such as the GNU Lesser General Public
    License (LGPL), which governs the combination of free software with modifications
    to code where the source code for the'
