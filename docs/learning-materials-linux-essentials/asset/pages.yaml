- pgno: 193
  md: '# Answers to Explorational Exercises


    1. When extracting files, does tar support globs in the file list?


    Yes, you would use the --wildcards option. --wildcards must be placed right after
    the tar file using the no dash style of options. For example:


    ```

    $ tar xf tarfile.tar --wildcards dir/file*

    $ tar --wildcards -xf tarfile.tar dir/file*

    ```


    2. How can you make sure a decompressed file is identical to the file before it
    was compressed?


    You don''t need to do anything with the tools covered in this lesson. All three
    of them include checksums in their file format that is verified when they are
    decompressed.


    3. What happens if you try to extract a file from a tar archive that already exists
    on your filesystem?


    The file on your filesystem is overwritten with the version that is in the tar
    file.


    4. How would you extract the file archive.tgz without using the tar z option?


    You would decompress it with gunzip first.


    ```

    $ gunzip archive.tgz

    $ tar xf archive.tar

    ```'
