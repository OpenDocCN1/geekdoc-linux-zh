- pgno: 420
  md: '# Answers to Explorational Exercises


    1. Try this on a terminal: create an empty file emptyfile with the command touch
    emptyfile. “zero out” the permissions for the file with chmod 000 emptyfile. What
    will happen if you change the permissions for emptyfile by passing only one value
    for chmod in numeric notation, such as chmod 4 emptyfile? What if we use two,
    such as chmod 44 emptyfile? What can we learn about the way chmod reads the numerical
    value?


    Remember that we “zeroed out” the permissions for emptyfile. So, its initial state
    would be:


    ```

    1 carol carol      0 Dec 11 10:55 emptyfile

    ```


    Now, let''s try the first command, chmod 4 emptyfile:


    ```

    $ chmod 4 emptyfile

    $ ls -1 emptyfile

    ----r--r 1 carol carol 0 Dec 11 10:55 emptyfile

    ```


    The permissions for others were changed. And what if we try two digits, such as
    chmod 44 emptyfile?


    ```

    $ chmod 44 emptyfile

    $ ls -1 emptyfile

    ----r--r 1 carol carol 0 Dec 11 10:55 emptyfile

    ```


    Now, the permissions for group and others were affected. From this, we can conclude
    that in numeric notation chmod reads the value “backwards”, from the least significant
    digit (others) to the most significant one (user). If you pass one digit, you
    modify the permissions for others. With two digits you modify group and others,
    and with three you modify user, group and others and four digits you modify user,
    group, others and the special permissions.


    2. Can you execute a file for which you have execute, but not read permissions
    (- -x)? Why why not?


    At first, the answer seems obvious: If you execute permission, the file should
    run. This applies to programs in binary format that are executed directly by the
    kernel. However, there are programs (e.g shell scripts) that must first be read
    and interpreted, so in these cases the read permission (r) must also be set.'
  merge: -1
  img_proc: true
- pgno: 421
  md: '# 3. Consider the permissions for the temporary directory on a Linux system,
    /tmp:


    ```

    $ ls -l /tmp

    drwxrwxrwt 19 root root 16K Dec 21 18:58 tmp

    ```


    User, group and others have full permissions. But a regular user delete any files
    inside this directory? Why is this?


    /tmp is what we call a world writeable directory, meaning that any user can write
    to it. But we don''t want one user modifying files created by others, so the sticky
    bit_is set (as indicated by the t on the permissions for others). This means that
    a user can delete files in /tmp, but only if they created them.


    # 4. A file named test.sh has the following permissions: -rwsr-xr-x, meaning the
    SUID bit is set. Now, run the following commands:


    ```

    $ chmod u-x test.sh

    $ ls -l test.sh

    -rwSr-xr-x 1 carol 33 Dec 11 10:36 test.sh

    ```


    What did we do? What does the uppercase $ mean?


    We removed execute permissions for the user who owns the file. The s (or t) takes
    the place of the x on the output of ls -1, so the system needs a way to show if
    the user has execute permissions or not. It does by this by changing the case
    of the special character.


    A lowercase s on the first group of permissions means the user who owns the file
    has execute permissions and the SUID bit is set. An uppercase S means that the
    user who owns the file lacks (-) execute permissions and that the SUID bit is
    set.


    The same can be said for SGID. A lowercase s on the second group of permissions
    means the group who owns the file has execute permissions and the SGID bit is
    set. An uppercase S means that the group who owns the file lacks (-) execute permissions
    and that the SGID bit is set.


    This is also true for the sticky bit, represented by the t in the third group
    of permissions. Lowercase t means the sticky bit is set and others have execute
    permissions. Upper T means the sticky bit is set and that others do not have execute
    permissions.


    # 5. How would you create a directory named Box where all the files are automatically
    owned by the group users, and can only be deleted by the user who created them?'
  merge: -1
  img_proc: true
- pgno: 422
  md: '# Linux Essentials (Version 1.6) | Topic 5: Security and File Permissions


    This is a multi-step process. The first step is to create the directory:


    ```

    $ mkdir dir Box

    ```


    We want every file created inside this directory to be automatically assigned
    to the group users. We can do this by setting the owner of the directory, and
    then by setting the SGID bit on it. We also need to make sure that any member
    of the group can write to that directory.


    Since we do not care about what the other permissions are, and want to “flip”
    only the special bits, it makes sense to use the symbolic mode:


    ```

    $ chown :users Box/

    $ chmod g+wxs Box/

    ```


    Note that if you current user does not belong to the group users, you will have
    to use the command sudo before the commands above to do the change as root.


    Now for the last part, making sure that only the user who created a file is allowed
    to delete it. This is done by setting the sticky bit (represented by a t) on the
    directory. Remember that it set on the permissions for others (o).


    ```

    $ chmod o+t Box/

    ```


    The permissions on the directory Box should appear as follows:


    ```

    drwxwxrxr-t 2 carol users 4.0K Jan 18 19:09 Box

    ```


    Of course, you can specify SGID and the sticky bit using only one chmod command:


    ```

    $ chmod g+wxs,o+t Box/

    ```


    Bonus points if you thought of that.'
  merge: -1
  img_proc: true
