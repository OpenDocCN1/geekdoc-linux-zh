    # # Introduction


    Without hardware, software is nothing more than another form of literature. Hardware
    processes the commands described by the software and provides mechanisms for storage,
    input, and output. Even the cloud is ultimately backed by hardware.


    As an operating system, one of Linux'' responsibilities is providing software
    with interfaces to access a system''s hardware. Most configuration specifics are
    beyond the scope of this lesson. Users are often concerned with the performance,
    capacity, and other factors of system hardware since they impact the ability of
    a system to adequately support specific applications. This lesson discusses hardware
    as physical items using standard connectors and interfaces. The standards are
    relatively static. But the form factor, performance, and capacity characteristics
    of hardware are constantly evolving. Regardless of how changes may blur physical
    distinctions the conceptual aspects of hardware described in this lesson still
    apply.


    > NOTE: At various points within this lesson command line examples are used to
    demonstrate ways to access information about hardware. Most examples are from
    a Raspberry Pi B+ but should apply to most systems. Understanding these commands
    is not required to understand this material.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# Power Supplies


    All of the active components in a computer system require electricity to operate.
    Unfortunately, most sources of electricity are not appropriate. Computer system
    hardware requires specific voltages with relatively tight tolerances. This is
    what is available from your local wall outlet.


    Power supplies normalize available sources of power. Standard voltage requirements
    allow manufacturers to create hardware components that can be used in systems
    anywhere in the world. Desktop power supplies tend to use the electricity from
    wall outlets as a source. Server power supplies tend to be more critical so they
    can often connect to multiple sources to assure that they continue operating if
    one source fails.


    Consuming power generates heat. Excessive heat can cause system components to
    operate slowly or even fail. Most systems have some form of fan to move air for
    efficient cooling. Components such as processors generate heat that air flow cannot
    dissipate. These hot attach special fins known as heat sinks to help dissipate
    the heat they generate. Heat sinks often have their own small local fan to ensure
    adequate air flow.


    # Motherboard


    All of a system''s hardware needs to interconnect. A motherboard normalizes that
    interconnection using standardized connectors and form factors. It also provides
    support for the configuration and electrical needs of those connectors.


    There are a large number of motherboard configurations. They support different
    processors and memory systems. They have different combinations of standardized
    connectors. And they adapt to the different sizes of the packaging that contains
    them. Except perhaps for the ability to connect external devices, motherboard
    configuration is effectively transparent to users. Administrators are mostly exposed
    to motherboard configuration when there is a need to identify specific devices.


    When power is first applied there is motherboard hardware that must be configured
    and initialized before the system can operate. Motherboards use programming stored
    in nonvolatile memory known as firmware to deal with motherboard specific hardware.
    The original form of motherboard firmware was known as BIOS (Basic Input/Output
    System). Beyond basic configuration settings BIOS was mostly responsible for identifying,
    locating, and transferring operation to an operating system such as Linux. As
    hardware evolved, firmware expanded to support larger disks, diagnostics, graphical
    interfaces, networking, and other advanced capabilities independent of any operating
    system. Early attempts to advance firmware beyond basic BIOS was often specific
    to a motherboard manufacturer. Intel defined a standard for advanced firmware
    known as an EFI (Extensible Firmware Interface). Intel defined EFI'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Linux Essentials (Version 1.6) | Topic 4: The Linux Operating System


    standards organization to create UEFI (Unified Extensible Firmware Interface).
    Today, most motherboards use UEFI. BIOS and EFI are almost never seen on recent
    systems. Regardless, most people still refer to motherboard firmware as BIOS.


    There are very few firmware settings of interest to general users or only individuals
    responsible for system hardware configuration typically needed to deal with firmware
    and its settings. One of the few commonly changed options is enabling virtualization
    extensions of modern CPUs.


    # Memory


    System memory holds the data and program code of currently running applications.
    When they talk about computer memory most people are referring to this system
    memory. Another common term used for system memory is the acronym RAM (Random
    Access Memory) or some variation of that acronym. Sometimes references to the
    physical packaging of the system memory such as DIMM, SIMM or DDR are also used.


    Physically, system memory is usually packaged on individual circuit board modules
    thatat plug into the motherboard. Individual memory modules currently range in
    size from 2 GB to 64 GB. For most general purpose applications 4 GB is the minimum
    system memory people should consider. For individual workstations 16 GB is typically
    more than sufficient. However even 16 GB might be limiting for users running gaming,
    video, or high-end audio applications. Servers often require 128 GB or even 256
    GB of memory to efficiently support user loads.


    For the most part Linux allows us to treat system memory as a black box. An application
    is started and Linux takes care of allocating memory for other applications when
    an application completes. But if an application requires more than the available
    system memory? In this case, Linux moves idle applications from system memory
    into a special disk area known as swap space. Linux moves idle applications from
    the disk swap space back to system memory when they need to run.


    Systems without dedicated video hardware often use a portion of the system memory
    (1 GB) to act as video display storage. This reduces the effective system memory.
    Dedicated video hardware typically has its own separate memory that is not available
    as system memory.


    There are several ways to obtain information about system memory. As a user, the
    total of memory available and in use are typically the values of interest. One
    source of information would be to run the command free with -m to megabytes in
    your output:


    | | total | used | free | shared | buff/cache | available |

    |---|---|---|---|---|---||

    | Mem: | 748 | 37 | 51 | 14 | 660 | 645 |


