    # Introduction


    This lesson will focus on the basic terminology of the accounts, access controls
    and security of local Linux systems, the command line interface (CLI) tools in
    a Linux system for basic security access controls and the basic files to support
    user and group accounts, including those used for elementary privilege escalation.


    Basic security in Linux systems is modeled after Unix access controls that, despite
    being nearly fifty years-old, are quite effective in comparison to some popular
    consumer operating systems of much newer lineage. Even some other, popular, Unix-based
    operating systems tend to “take liberties” that are focused on “ease-of-access,”
    while Linux does not.


    Modern Linux desktop environments and interfaces simplify the creation and management
    of users and even automate the assignment of access controls when user logs in—
    e.g., the display, audio and other services—requiring virtually no manual system
    administrator intervention. However, it is important to understand the basic concepts
    of an underlying Linux operating system.


    348 | learning.lpi.org | Licensed under CC-BY-ND-4.0 | Version: 2023-04-14'
