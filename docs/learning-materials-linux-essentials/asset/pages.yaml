    # Arguments


    You are already familiar with using arguments in the Linux core utilities. For
    example, rm testfile contains both the executable rm and one argument testfile.
    Arguments can be passed to the script upon execution, and will modify how the
    script behaves. They are easily implemented.


    ```

    #!/bin/bash


    # This is our first comment. It is also good practice to comment all scripts.


    username=$1


    echo "Hello $username!"

    ```


    Instead of assigning a value to username directly inside the script, we are assigning
    it the value of a new variable $1. This refers to the value of the first argument.


    ```

    $ ./new_script.sh Carol

    Hello Carol!

    ```


    The first nine arguments are handled in this way. There are ways to handle more
    than nine arguments, but that is outside the scope of this lesson. We will demonstrate
    an example using nine'
