- pgno: 306
  md: '# Summary


    In this lesson you have learned about the location of programs and their configuration
    files in a Linux system. Important facts to remember are:


    +   - Basically, programs are to be found across a three-level directory structure:
    /, usr /usr/local. Each of these levels may contain bin and sbin directories.


    +   - Configuration files are stored in /etc and ~.


    +   - Dotfiles are hidden files that start with a dot (.).


    We have also discussed the Linux kernel. Important facts are:


    +   - For Linux, everything is a file.


    +   - The Linux kernel lives in /boot together with other boot-related files.


    +   - For processes to start executing, the kernel has to be loaded into a protected
    area of memory.


    +   - The kernel job is that of allocating system resources to processes.


    +   - The /proc virtual (or pseudo) filesystem stores important kernel and system
    data in a volatile random.


    Likewise, we have explored hardware devices and learned the following:


    +   - The /dev directory stores special files (aka nodes) for all connected hardware
    devices: block devices or character devices. The former transfer data in blocks;
    the latter, one character at time.


    +   - The /dev directory also contains other special files such as /dev/zero,
    /dev/null or /dev/random.


    +   - The /sys directory stores information about hardware devices arranged into
    categories.


    Finally, we touched memory. We learned:


    +   - A program runs when it is loaded into memory.


    +   - What RAM (Random Access Memory) is.


    +   - What Swap is.


    +   - How to display the use of memory.


    Commands used in this lesson:'
