    The glob file[:digit:]a, matches file followed by a digit or a a.


    The character classes supported depends on your current locale. POSIX requires
    the following character classes for all locales:


    [:alnum:]


    Letters and numbers.


    [:alpha:]


    Upper or lowercase letters.


    [:blank:]


    Spaces and tabs.


    [:cntrl:]


    Control characters, e.g. backspace, bell, NAK, escape.


    [:digit:]


    Numerals (0123456789).


    [:graph:]


    Graphic characters (all characters except ctrl and the space character).


    [:lower:]


    Lowercase letters (a-z).


    [:print:]


    Printable characters (alnum, punct, and the space character).


    [:punct:]


    Punctuation characters, i.e. !, &, ".


    [:space:]


    Whitespace characters, e.g tabs, spaces, newlines.'
