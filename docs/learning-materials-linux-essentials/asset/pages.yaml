    Introduction

    In this lab we will be focusing on redirecting or transmitting information from
    one source to another with the help of specific tools. The Linux command line
    redirects the information through specific standard channels. The standard input
    (stdin or channel 0) of the command is considered to be the keyboard and the standard
    output (stdout or channel 1) is considered the screen. It is also another channel
    that is meant to redirect error output (stderr or channel 2) of a command or a
    program''s error messages. The input and/or output can be redirected.


    When running a command, sometimes we need to transmit certain information to the
    command or redirect the output to a specific file. Each of these functionalities
    will be discussed in the next two sections.


    # I/O Redirection


    I/O redirection enables the user to redirect information from or to a command
    by using a text file. As described earlier, the standard input, output and error
    output can be redirected, and the information can be taken from text files.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# Redirecting Standard Output


    To redirect standard output to a file, instead of the screen, we need to use the
    > operator followed by the name of the file. If the file doesn''t exist, a new
    one will be created, otherwise, the information will overwrite the existing file.


    In order to see the contents of the file that we just created, we can use the
    cat command. By default, this command displays the contents of a file on the screen.
    Consult the manual page to find out about its functionalities.


    The example below demonstrates the functionality of the operator. In the first
    instance, a new file is created containing the text "Hello World!"


    ```

    $ echo "Hello World!" > text

    $ cat text

    Hello World!

    ```


    In the second invocation, the same file is overwritten with the new text:


    ```

    $ echo "Hello!" > text

    $ cat text

    Hello!

    ```


    If we want to add new information at the end of the file, we need to use the >>
    operator. This operator also creates a new file if it cannot find an existing
    one.


    The first example shows the addition of the text. As it can be seen, the new text
    was added on the following line:


    ```

    $ echo "Hello to you too!" >> text

    $ cat text

    Hello!

    Hello to you too!

    ```


    The second example demonstrates that a new file will be created:


    ```

    $ echo "Hello to you too!" >> text2

    $ cat text2

    Hello to you too!

    ```'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# Redirecting Error


    In order to redirect the error messages, a user will need to employ the 2> operator
    followed by the name of the file in which the errors will be written. If the file
    does not exist, a new one will be created, otherwise the file will be overwritten.


    As explained, the channel for redirecting the standard error is channel 2. When
    redirecting the standard error, the channel must be specified, contrary to the
    other standard output where channel 1 is set by default. For example, the following
    command searches for a file or directory named games and only writes the error
    into the text-error file, while displaying the standard output on the screen:


    ```

    $ /usr games 2> text-error

    /usr

    /usr/share

    /usr/share/misc

    ------Ommitted output------

    /usr/lib/libmagic.so.1.0

    /usr/lib/libdns.so.81

    /usr/games

    $ cat text-error

    find: `games`: No such file or directory

    ```


    > For more information about the find command, consult its man page.


    For example, the following command will run without errors, therefore no information
    will be written in the file text-error:


    ```

    $ sort /etc/passwd 2> text-error

    $ cat text-error

    ```


    As well as the standard output, the standard error can also be appended to a file
    with the 2>> operator. This will add the new error at the end of the file. If
    the file does not exist, a new one will be created. The first example shows the
    addition of the new information into the file, whereas the second example shows
    that the command creates a new file where an existing one can''t be found with
    the same name:


    ```

    $ sort /etc/passwd 2>> text-error

    $ cat text-error

    sort: read failed: /etc: Is a directory

    ```'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# Linux Essentials (Version 1.6) | Topic 3: The Power of the Command Line


    ```

    $ sort /etc/shadow >> text-error

    $ cat text-error2

    sort: open failed: /etc/shadow: Permission denied

    ```


    Using this type of redirection, only the error messages will be redirected to
    the file, the normal output will be written on the screen or go through standard
    output or stdout.


    There is one particular file that technically is a bit bucket (a file that accepts
    input and doesn''t do anything with it); /dev/null. You can redirect any irrelevant
    information that you might not want displayed or redirected into an important
    file, as shown in the example below:


    ```

    $ sort /etc 2 /dev/null

    ```


    # Redirecting Standard Input


    This type of redirection is used to input data to a command, from a specified
    file instead of a keyboard. In this case the < operator is used as shown in the
    example:


    ```

    $ cat < text

    Hello!

    Hello to you too!

    ```


    Redirecting standard input is usually used with commands that don''t accept arguments.
    the tr command is one of them. This command can be used to translate file contents
    by modifying the characters in a file in specific ways, deleting any particular
    character from a file, the example shows the deletion of the character 1:


    ```

    $ tr -d "1" < text

    Heo!

    Hello to you too!

    ```


    For more information, consult the man page of tr.


    # Here Documents


    Unlike the output redirection, the << operator acts in a different way compared
    to the other operators. This input stream is also called here document. Here document
    represents the block of code or text which can be redirected to the command or
    the interactive program. Different types'
  merge: -1
