    Notice again now the compressed file is deleted once it is decompressed.


    Some compression tools support different compression levels. A higher compression
    level usually requires more memory and CPU cycles, but results in a smaller compressed
    file. The opposite is true for a lower level. Below is a demonstration with xz
    and gzip:


    ```

    $ cp bigfile-gz1

    $ cp bigfile-gz9

    $ gzip -1 bigfile-gz1

    $ gzip -9 bigfile-gz9

    $ cp bigfile-xz1

    $ cp bigfile-xz9

    $ xz -1 bigfile-xz1

    $ xz -9 bigfile-xz9

    $ ls -1h bigfile-gz9-* * *

    total 3.5M

    -rw-r--r-- 1 ema 712K Jun 23 08:08 bigfile

    -rw-r--r-- 1 ema 205K Jun 23 13:14 bigfile-gz1

    -rw-r--r-- 1 ema 178K Jun 23 13:14 bigfile-gz9

    -rw-r--r-- 1 ema 156K Jun 23 08:08 bigfile-xz1.xz

    -rw-r--r-- 1 ema 143K Jun 23 08:08 bigfile-xz9

    ```


    It is not necessary to decompress a file every time you use it. Compression tools
    typically come with special versions of tools used to read text files. For example,
    gzip has a version of cat, grep, diff, less, more, and a few others. For gzip,
    the tools are prefixed with a z, while the prefix b exists for bzip2 and x exists
    for xz. Below is an example of zcat to read display a file compressed with gzip:


    ```

    $ cp /etc/hosts ./

    $ gzip hosts

    $ zcat hosts.gz

    127.0.0.1 localhost

    ```


