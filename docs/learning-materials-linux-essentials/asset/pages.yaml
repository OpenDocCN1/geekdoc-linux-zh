  md: '# Exit Codes


    +   - All scripts should include comments to describe their use.

    - This particular script works with an *argument*, which is passed to the script
    when it is called.

    - This script contains an *if statement*, which tests the conditions of a built-in
    variable$. This variable is set to the number of arguments.

    - If the number of arguments passed to the script equals 1, then the value of
    the first argument is passed to a new variable username and the script echoes
    a greeting to the user. Otherwise, an error message is displayed.

    - Finally, the script echoes the number of arguments. This is useful for debugging.


    This is a useful example to begin explaining some of the other features of Bash
    scripting.


    You will notice that our script has two possible states: either it prints "Hello
    user>" or it prints an error message. This is quite normal for many of our core
    utilities. Consider *cat*, which you are no doubt very familiar with.


    Let''s compare a successful use of cat with a situation where it fails. A reminder
    that our example above is a script called `new_script.sh`.


    ```

    $ cat -n new_script.sh


    1 #!/bin/bash

    2

    3 # A simple script to greet a single user.

    4

    5 if [ $@ -eq 1 ]

    6 then

    7 username=$1

    8

    9 echo "Hello username"

    10 else

    11 echo "Please enter only one argument."

    12 fi

    13 echo "Number of arguments: $#"

    ```


    This command stands, and you will notice that the -n flag also has printed line
    numbers. These are very helpful when debugging scripts, please note that they
    are *not* part of the script.


    Now we are going to check the value of a new built-in variable$? For now, just
    notice the output:'
  merge: -1
  img_proc: true
- pgno: 243
  md: '```

    $ echo $?

    0

    ```


    Now let''s consider a situation where cat will fail. First we will see an error
    message, and then check the value of $?.


    ```

    $ cat -n dummyfile.sh

    cat: dummyfile.sh: No such file or directory

    $ echo $?

    1

    ```


    The explanation for this behaviour is this: any execution of the cat utility will
    return an exit code. An exit code will tell us if the command succeeded, or experienced
    an error. An exit code of zero indicates that the command completed successfully.
    This is true for every Linux command that you work with. Any other exit code will
    indicate an error of some kind. The exit code of the last command to run will
    be stored in the variable $.


    Exit codes are usually not seen by human users, but they are very useful when
    writing scripts. Consider a script where we are copying files to a remote drive.
    There are many ways the copy task may have failed: for our local machine might
    not be connected to the network, or the remote drive might be full. By checking
    the exit code of our copy utility, we can alert the user to problems when running
    the script.


    It is very good practice to implement exit codes, so we will do this. We have
    two paths in our script, a success and a failure. Let''s use zero to indicate
    success, and one to indicate failure.


    ```

    1 #!/bin/bash

    2

    3 # A simple script to greet a single user.

    4

    5 if [ $# -eq 1 ]

    6 then

    7 username=$1

    8

    9 echo "Hello $username!"

    10 exit 0

    11 else

    12 echo "Please enter only one argument."

    13 exit 1

    14 fi

    ```'
  merge: -1
  img_proc: true
