    # Globbing


    What is commonly referred to as globbing is a simple pattern matching language.
    Command shells on Linux systems use this language to refer to groups of files
    whose names match a specific pattern. POSIX.1-2017 specifies the following pattern
    characters:


    +   * Matches any number of any character, including no characters


    +   * Matches any one character


    +   * [] Matches a class of characters


    In English, this means you can tell your shell to match a pattern instead of a
    literal string of text. Usually Linux users specify multiple files with a glob
    instead of typing out each file name.


    ```

    $ cd ~/linux_essentials-2.4/globs

    $ ls

    question1 question14 question2012 star10 star2002

    question13 question15 question23 star1100 star2013

    $ ls star*

    star10 star1100

    $ ls star*

    star10 star1100 star2002 star2013

    $ ls star2*

    star2002 star2013

    $ ls star2*2

    star2002

    $ ls star2013*

    ```'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# Linux Essentials (Version 1.6) | Topic 2: Finding Your Way on a Linux System


    star2013


    The shell expands * to any number of anything, so your shell interprets star*
    to mean anything

    in the relevant context that starts with star. When you run the command ls star*,
    your shell

    does''t run the ls program with an argument of star*, it looks for files in the
    current directory

    that match the pattern star* (including just star), and turns each file matching
    the pattern into

    an argument to ls:


    ```

    $ ls star*

    ```


    as far as ls is concerned is the equivalent of


    ```

    $ ls star10 star1100 star2002 star2013

    ```


    The * character doesn''t mean anything to ls. To prove this, run the following
    command:


    ```

    $ ls star*\nls: cannot access star*: No such file or directory

    ```


    When you precede a character with a \, you are instructing your shell not to interpret
    it. In this

    case, you want ls to have an argument of star* instead of what the glob star*
    expands to.


    The ? expands to any single character. Try the following commands to see for yourself:


    ```

    $ ls

    question1 question14 question2012 star10 star2002

    question13 question15 question23 star1100 star2013

    $ ls question?

    question1

    $ ls question1?

    question13 question14 question15

    $ ls question3?

    question13 question23

    $ ls question3?

    ls: cannot access question3?: No such file or directory

    ```


    The [] brackets are used to match ranges or classes of characters. The [] brackets
    work like

    do in POSIX regular expressions except where the ^ is used instead of !.'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'Create some files to experiment with:


    ```

    $ mkdir brackets

    $ cd brackets

    $ touch file1 file2 file3 file4 fileb filec file5 file6 file7

    ```


    Ranges within [] brackets are expressed using a -:


    ```

    $ ls

    file1 file2 file3 file4 file5 file6 file7 fileb filec

    $ ls file[1-2]

    file1 file2

    $ ls file[1-3]

    file1 file2 file3

    ```


    Multiple ranges can be specified:


    ```

    $ ls file[1-25-7]

    file1 file2 file6 file7

    $ ls file[1-35-6a-c]

    file1 file2 file3 file5 file6 fileb file

    ```


    Square brackets can also be used to match a specific set of characters.


    ```

    $ ls file[1a5]

    file1 file5 filea

    ```


    You can use the ^ character as the first character to match everything except
    certain characters.


    ```

    $ ls file[^]

    file1 file2 file3 file4 file5 file6 fileb filec

    ```


    The last thing we will cover in this lesson is character classes. To match a character
    class, you would use [:classname:]. For example, to use the digit class, which
    matches numerals, you would do something like this:


    ```

    $ ls file[:digit:]]

    ```'
