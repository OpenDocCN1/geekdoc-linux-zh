    different exit codes to indicate different errors; in this way, a savvy user can
    use these exit codes to troubleshoot.


    ```

    $ ./friendly2.sh Carol Dave Henry

    Hello Carol!

    Hello Dave!

    Hello Henry!

    $ ./friendly2.sh 42 Carol Dave Henry

    ERROR: Names must only contains letters.

    $ echo $?

    2

    ```'
