- pgno: 189
  md: '# # Summary


    Linux systems have several compression and archiving tools available. This lesson
    covered the most common ones. The most common archiving tool is tar. If interacting
    with Windows systems is necessary, zip and unzip can create and extract ZIP files.


    The tar command has a few options that are worth memorizing. They are x for extract,
    c for create, t for view contents, and u to add or replace files. The v option
    lists the files which are processed by tar while creating or extracting an archive.


    The typical Linux distribution''s repository has many compression tools. The most
    common are gzip, bzip2, and xz. Compression algorithms often support different
    levels that allow you to optimize for speed and file size. Files can be decompressed
    with gzip, bunzip2, and unxz.


    Compression tools commonly have programs that behave like common text tools, with
    the difference they work on compressed files. A few of them are zcat, bzcat, and
    xzcat. Compression tools typically ship with programs with the functionality of
    grep, more, less, diff, and cmp.


    Commands used in the exercises:


    +   **bunzip2**

    Decompress a bzip2 compressed file.


    +   **bzcat**

    Output the contents of a bzip compressed file.


    +   **bzip2**

    Compress files using the bzip2 algorithm and format.


    +   **gunzip**

    Decompress a gzip compressed file.


    +   **gzip**

    Compress files using the gzip algorithm and format.


    +   **tar**

    Create, update, list and extract tar archives.


    +   **unxz**

    Decompress a xz compressed file.'
  merge: -1
  img_proc: true
