- pgno: 279
  md: '# Clock speed


    Often expressed in megahertz (MHz) or gigahertz (GHz). This relates to how fast
    a processor processes instructions. But processor speed is just one of the factors
    impacting system response times, waits and throughput. Every active multi-tasking
    user rarely keeps a CPU of a common desktop PC active for more than 2 or 3 percent
    of the time. Regardless, if you use computationally intensive applications involving
    activities such as encryption or video rendering then your CPU speed may have
    a significant impact on throughput and wait time.


    # Cache


    CPUs require a constant stream of both instructions and data in order to operate.
    The cost and power consumption of a multi-gigabyte system memory could be accessed
    at CPU clock speeds would be prohibitive. CPU-speed cache memory is integrated
    into the CPU chip to provide a high-speed buffer between CPUs and system memory.
    Cache is separated into multiple layers, commonly referred as L1, L2, L3 and even
    L4. In the case of cache, more is often better.


    # Cores


    Cores refer to an individual CPU. In addition to core representing a physical
    CPU, HyperThreading Technology (HTT) allows a single CPU to concurrently process
    multiple instructions thus virtually acting as multiple single processor CPUs.
    Most typically, multiple cores are packaged as a single processor chip. However,
    there are motherboards that support multiple physical processor chips. In theory
    having more cores to tasks would always seem to yield better system throughput.
    Unfortunately, desktop applications often keep CPUs busy by 2 or 3 percent of
    the time, adding more idle CPUs is likely to result in minimal improvement to
    throughput. More cores are best suited to running applications that are written
    to have multiple independent threads of operation such as video frame rendering,
    web page rendering, or multi-user virtual machine environments.


    # Storage


    Storage devices provide a method for retaining programs and data. Hard Disk Drives
    (HDDs) and Solid State Drives (SSDs) are the most common form of storage device
    for servers and desktops. USB memory sticks and optical devices such as DVD are
    also used but rarely as a primary device.


    As the names imply, a hard drive stores information on one or more rigid physical
    disks. The physical disks are covered with magnetic media to make storage possible.
    The disks are contained within a sealed package since dust, small particles, and
    even finger prints would interfere with the ability of the HDD to read and write
    the magnetic media.


    SSDs are effectively more sophisticated versions of USB memory sticks with significantly
    larger'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# Linux Essentials (Version 1.6) | Topic 4: The Linux Operating System


    capacity. SSDs store information in microchips so there are no moving parts.


    Although the underlying technologies for HDDs and SSDs are different, there are
    important factors that can be compared. HDD capacity is based on scaling physical
    components while SSD capacity depends on the number of microchips. Per gigabyte,
    SSD cost between 3 and 10 times what an HDD costs. To read or write, an HDD must
    wait for a location on a disk to rotate to a known location while SSDs are random
    access. SSD access speeds are typically 3 to 5 times faster than HDD devices.
    Since they have no moving parts SSDs consume power and are more reliable than
    HDDs.


    Storage capacity is constantly increasing for HDDs and SSDs. 5 terabyte HDDs and
    1 terabyte SSDs are commonly available. Regardless, large storage capacity is
    not always better. When a storage device fails the information it contained is
    no longer available. And of course, backup takes longer when there is more information
    to back up. Applications which read and write a lot of data, latency and performance
    may be more than capacity.


    Modern systems use SCSI (Small Computer System Interface) or SATA (Serial At Attachment)
    to connect with storage devices. These interfaces are typically supported by the
    appropriate connector on the motherboard. Initial load comes from a storage device
    attached to the motherboard. Firmware settings define the order in which devices
    are accessed for this initial loading.


    Storage systems known as RAID (Redundant Array of Independent Devices) are a common
    implementation to avoid loss of information. A RAID array consists of multiple
    physical devices containing duplicate copies of information. If one device fails
    the information is still available. Different RAID configurations are referenced
    as 0, 1, 5, 6, and 10. Each designation has different storage size, performance
    characteristics and ways to store redundant data or checksums for data recovery.
    Beyond some administrative configuration overhead, the existence of RAID is effectively
    transparent to users.


    Storage devices commonly read and write data as blocks of files. The lsblk command
    can be used to list the block devices available to a system. The following example
    was on a Raspberry Pi using an SD card as a storage device. The details of the
    output are covered by information in the Partitions and drivers that follows that:


    ```

    $ lsblk

    NAME      MAJ:MIN RM SIZE TYPE MOPOINT

    mmcblk0   179:0  0  29.7G disk

    └mmcblk0p1 179:1  0  43.9M part /boot

    └mmcblk0p2 179:2  0  29.7G part /

    ```'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# Partitions


    A storage device is effectively a long sequence of storage locations. Partitioning
    is the mechanism that tells Linux if it is to see these storage locations as a
    single sequence or multiple independent sequences. Each partition is treated as
    if it is an individual device. Most of the time partitions are created when a
    system is first configured. If change is needed, administrative tools are available
    to manage device partitioning.


    Why would multiple partitions be desirable? Some examples for partitions would
    be managing available storage, isolating encryption overhead, or supporting multiple
    file systems. Partitions make it possible to have a single storage device that
    can boot under different operating systems.


    While Linux can recognize the storage sequence of a raw device a raw device cannot
    be used as is. To use a raw device it must be formatted. Formatting writes a file
    system to the device and prepares it for file operations. Without a file system
    a device cannot be used for file-related operations.


    Users see partitions as if they are individual devices. This makes it easy to
    overlook the fact that they''re still dealing with a single physical device. In
    particular, to device operations that are actually partition to partition operations
    will not have the expected performance. A single device is one physical mechanism
    with one set of read/write hardware. More importantly, you can''t use partitions
    of a single physical device as a fault tolerant design. If the device fails, all
    partitions fail so there would be no fault tolerance.


    > Logical Volume Manager (LVM) is a software capability that allows administrators
    to combine individual disks and partitions and treat them as if they are a single
    drive.


    # Peripherals


    Servers and গ্রহণের need a combination of CPU, system memory, and storage to operate.
    These fundamental components do not directly interface with the external world.
    Peripherals are the devices that provide systems with input, output, and access
    to the rest of the world.


    Most motherboards have built-in external connectors and firmware support for common
    legacy peripheral interfaces supporting devices as keyboard, mouse, sound, video,
    and network. Recent motherboards typically have an Ethernet connector to support
    networks, HDMI connector supporting basic graphical, and one or more USB (Universal
    Serial Bus) connectors for mostly everything else. There are several versions
    of USB with different speed and physical characteristics. Several versions of
    USB ports are on a single motherboard.


    ![](img/1669a3de8a1d745f1aaf167b3eba581e_281_0.png)'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# The Linux Operating System


    Motherboards may also have one or more expansion slots. Expansion slots allow
    users to add special circuit boards as expansion cards that support custom, legacy,
    and non-standard Graphics. Expansion cards also support RAID, special legacy interfaces
    interfacing serial and parallel connections.


    System on a Chip (SoC) configurations achieve power, performance, space, and reliability
    advantages over motherboard configurations by packaging processors, system memory,
    SSD, and hardware to control peripherals as a single integrated circuit package.
    The peripherals supported by SoC configurations are limited by the components
    packaged. Thus, SoC configurations tend to be developed for specific uses. Phones,
    tablets, and other portable devices are often based on SoC technology.


    Some systems incorporate peripherals. Laptops are similar to workstations that
    incorporate default display, keyboard, and mouse peripherals. All-In-One systems
    are similar to laptops that require mouse and keyboard peripherals. Motherboard
    or SoC controllers are often packaged with integral peripherals appropriate to
    a specific use.


    # Drivers and Device Files


    So far, this lesson has presented information about processors, memory, partitioning,
    formatting and peripherals. By requiring general users to deal with the specific
    details for each of the devices in their system would make those systems unusable.
    Likewise, software developers would need to modify their code for every new or
    modified device they need to support.


    The solution to "dealing with the details" problem is provided by a device driver.
    Device drivers accept a standard set of requests then translate these requests
    into the device appropriate control activities. Device drivers allow you and the
    applications you run to read from the file /home/*/stuff without worrying about
    whether file is on a hard drive, solid state memory stick, encrypted storage,
    or some other device.


    Device files are found in the /dev directory and identify devices, device access,
    and supported drivers. By, modern systems using SCSI or SATA storage devices the
    specification filename starts with the prefix sd. The prefix is followed by a
    letter such as a or b indicating a partition within the physical device. So, /dev/sda3
    would reference partition 3 in the first storage device. The device file for each
    type of device has a naming convention appropriate to the device. While covering
    all of the possible naming conventions is beyond the scope of this lesson it is
    important to remember that these conventions are critical to making system administration
    possible.'
  merge: -1
  img_proc: true
