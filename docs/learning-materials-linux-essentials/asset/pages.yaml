    # DNS


    IP addresses are difficult to remember and dont exactly have a high coolness factor
    if you''re trying to market a service or product. This is where the Domain Name
    System comes into play. In its simplest form DNS is a distributed phone book that
    maps rememberable domain names such as example.com to IP addresses. When, for
    example, a user navigates to a website, they enter the DNS hostname as part of
    the URL. The web browser sends the DNS name to whichever DNS resolver has been
    configured. That DNS resolver will in turn return the address that correlates
    to the domain. The resolver replies with that address and the web browser tries
    to reach the web server at that address.


    The resolvers that Linux uses to look up DNS data are configured in the /etc/resolv.conf
    configuration file:


    ```

    $ cat /etc/resolv.conf

    search lpi

    nameserver 192.168.0.1

    ```'
