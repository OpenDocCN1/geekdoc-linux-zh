    # Where Kernels are Stored: /boot


    The kernel resides in /boot — together with other boot-related files. Most of
    these files include the kernel version number components in their names (kernel
    version, major revision, minor revision and patch number).


    The /boot directory includes the following types of files, with names corresponding
    to the kernel version:


    ```

    config-4.9.0-9-amd64

    ```


    Configuration settings for the kernel such as options and modules that were compiled
    along with the kernel.


    ```

    initrd-img-4.9.0-9-amd64

    ```


    Initial RAM disk image helps in the startup process by loading a temporary root
    filesystem into memory.


    ```

    System-map-4.9.0-9-amd64

    ```


    The System-map (on some systems it will be named System.map) file contains memory
    address locations for kernel symbol names. Each time a kernel is rebuilt the file''s
    contents change as the memory locations could be different. The kernel uses this
    file to lookup memory address locations for a particular kernel symbol, or vice-versa.


    ```

    vmlinuz-4.9.0-9-amd64

    ```


    The kernel proper in a self-extracting, space-saving, compressed format (hence
    the z in vmlinuz; vm stands for virtual memory and started to be used when the
    kernel first got for virtual memory).


    ```

    grub

    ```


    Configuration directory for the grub2 bootloader.


    > Because it is a critical feature of the operating system, more than one kernel
    and its associated files are kept in /boot in case the default becomes faulty
    and we have to fall back on a previous version to — at least — be able to boot
    the system up and fix it.


    # The /proc Directory


    The /proc directory is one of the so-called virtual or pseudo filesystems since
    its contents are not'
