  md: '# Linux Professional Institute


    # 3.2 Lesson 1


    | Certificate: | Linux Essentials |

    | --- | --- |

    | Version: | 1.6 |

    | Topic: | 3 The Power of the Command Line |

    | Objective: | 3.2 Searching and Extracting Data from Files |

