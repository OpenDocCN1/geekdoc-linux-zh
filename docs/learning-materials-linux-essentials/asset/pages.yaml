- pgno: 29
  md: '# Linux Essentials (Version 1.6) | 1.2 Major Open Source Applications


    formats commonly used in an office environment. These applications are usually
    organised in collections called office suites.


    For a long time, the most used suite in Linux was the OpenOffice suite. OpenOffice.org
    was an open source version of the StarOffice suite released by Sun Microsystems.
    A few years later Sun was acquired by Oracle Corporation, which in turn transferred
    the project to the Apache Foundation and OpenOffice.org was renamed to Apache
    OpenOffice. Meanwhile, another office suite based on the same source code was
    released by the Document Foundation, which named it LibreOffice.


    The two projects have the same basic features and are compatible with the document
    formats from Microsoft Office. However, the preferred document format is the Open
    Document Format, a fully open and standardized file format. The use of ODF files
    ensures that documents can be transferred between operating systems and applications
    from different vendors, such as Microsoft Office. The main applications offered
    by OpenOffice/LibreOffice are:


    # Writer


    +   * Text editor


    # Calc


    +   * Spreadsheets


    # Impress


    +   * Presentations


    # Draw


    +   * Vector drawing


    # Math


    +   * Math formulas


    # Base


    +   * Database


    Both LibreOffice and Apache OpenOffice are open source software, LibreOffice is
    licensed under LGPLv3 and Apache OpenOffice is licensed under Apache License 2.0.
    The licensing distinction implies that LibreOffice can incorporate improvements
    made by Apache OpenOffice, but Apache OpenOffice cannot incorporate improvements
    made by LibreOffice. That, and a more active community of developers, are the
    reason most distributions adopt LibreOffice as their default office suite.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Web Browsers


    For most users, the main purpose of a computer is to provide access to the Internet.
    Nowadays, web pages can act as a featured app, with the advantage of being accessible
    from anywhere, without the need of installing extra software. That makes the web
    browser the most important application of the operating system, at least for the
    average user.


    > One of the best sources for learning about web development is the MDN Docs,
    available at https://developer.mozilla.org/. Maintained by Mozilla, the site is
    full of tutorials for beginners and reference materials on most modern web technologies.


    The main web browsers in the Linux environment are Google Chrome and Mozilla Firefox.
    Chrome is a web browser maintained by Google but is based on the open source browser
    Chromium, which can be installed using the distribution''s package manager and
    is fully compatible with Chrome. Maintained by Mozilla, a non-profit organization,
    Firefox is a browser whose origins are linked to Netscape, the first popular web
    browser to adapt the open source model. The Mozilla Foundation is deeply involved
    with the development of the open standards underlying the modern web.


    Mozilla also develops other applications, like the e-mail client Thunderbird.
    Many users opt to use webmail instead of a dedicated email application, but a
    client like Thunderbird offers extra features and integrates with other applications
    on the desktop.


    # Multimedia


    Compared to the available web applications, desktop applications are still the
    best option for the creation of multimedia content. Multimedia related activities
    like video rendering often require high amounts of system resources, which are
    best managed by a local desktop application. Some of the most popular multimedia
    applications for the Linux environment and their uses are listed below.


    # Blender


    A 3D renderer to create animations. Blender can also be used to export 3D objects
    to be printed by a 3D printer.


    # GIMP


    A full-featured image editor, which can be compared with Adobe Photoshop, but
    has its own concepts and tools to work with images. GIMP can be used to create,
    edit and save most bitmap files, like JPEG, PNG, GIF, TIFF and many others.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Inkscape


    A vector graphics editor, similar to Corel Draw or Adobe Illustrator. Inkscape''s
    default format is SVG, which is an open standard for vector graphics. SVG files
    can be opened by any web browser, and due to its nature as a vector graphic, it
    can be used in flexible layouts of web pages.


    # Audacity


    An audio editor. Audacity can be used to filter, to apply effects and convert
    between different audio formats, like MP3, WAV, OGG, FLAC, etc.


    # ImageMagick


    ImageMagick is a command line tool to convert and edit most image file types.
    It can also be used to create PDF documents from image files and vice versa.


    There are many applications dedicated to multimedia playback. The most popular
    application for video playback is VLC, but some users prefer other alternatives,
    like smplayer. Local music playback also has many options, like Audacious, Banshee
    and Amarok, which can also manage a collection of local sound files.


    # Server Programs


    When a web browser loads a page from a website, it actually connects to a remote
    computer and asks for a specific piece of information. In that scenario, the computer
    running the web browser is called the client and the remote computer is called
    the server.


    The server computer, which is an ordinary desktop computer or specialized hardware,
    needs a specific program to manage each type of information it will provide. Regarding
    serving web pages, most servers around the world deploy open source server programs.
    This particular program is called an HTTP server (HTTP stands for Hyper Transfer
    Protocol) and the most popular ones are Apache, Nginx and lighttpd.


    Even simple pages require many requests, which can be binary files — static content
    or dynamic content rendered from various sources. The role of an HTTP server is
    to collect and send all the requested data back to the browser, which arranges
    the content defined by the reactive HTML document (HTML for Hyper Text Markup
    Language) and other supporting files. Therefore, the rendering of a web page involves
    operations performed on the server side and operations performed on the client
    side. Both sides can use custom scripts to accomplish specific tasks. On the HTTP
    server side, it is common to use the PHP scripting language. JavaScript is the
    scripting language used on the client side (the web browser).


    Server programs can provide all kinds of information. It is uncommon to have a
    server'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Linux Essentials (Version 1.6) | Topic 1: The Linux Community and a Career
    in Open Source


    program requesting information provided by other server programs. That is the
    case when an HTTP server requires information provided by a database server.


    For instance, when a dynamic page is requested, the HTTP server usually queries
    a database to collect all the required pieces of information and sends the dynamic
    content back to the client. In a similar way, when a user registers on a website,
    the HTTP server gathers the data sent by the client and stores it in a database.


    A database is an organized set of information. A database server stores contents
    in a formatted fashion, making it possible to read, write and link large amounts
    of data reliably and at great speed. Open database servers are used in many applications,
    not only on the Internet. Even local applications can store data by connecting
    to a local database server. The most common type of database is the relational
    database, where the data is organized in predefined tables. The most popular source
    relational databases are MariaDB (originated from MySQL) and PostgreSQL.


    # Data Sharing


    In local networks, the ones found in offices and homes, it is desirable that computers
    not only be able to access the Internet, but also be able to communicate with
    each other. Sometimes a computer acts as a server, sometimes the same computer
    acts as a client. It is necessary when one wants to access files on another computer
    in the network—for instance, a file stored on a desktop computer from a portable
    device—without the hassle of copying it to a USB drive or the link.


    Between Linux machines, NFS (Network File System) is often used. The NFS protocol
    is the standard way to share file systems in networks equipped with Unix/Linux
    machines. With NFS, a computer can share one or more of its directories with specific
    computers. NFS can even be used to share an entire operating system''s directory
    tree with clients that it will use to boot. From these, called thin clients, are
    often used in large networks to avoid the maintenance of each individual operating
    system on each machine.


    If there are other types of operating systems attached to the network, it is recommended
    to use a data sharing protocol that can be understood by all of them. This requirement
    is fulfilled by Samba. Samba implements a protocol for sharing files over the
    network originally made for the Windows operating system, but today is compatible
    with all major operating systems. With Samba, computers in the local network not
    only share files, but also printers.


    On some local networks, the authorization upon login on a workstation is granted
    by a central server, called the domain controller, which manages the access to
    local and remote resources. The domain controller is a service provided by Microsoft''s
    Active Directory. Linux'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Linux Essentials (Version 1.6) | 1.2 Major Open Source Applications


    workstations can associate with a domain controller using Samba or an authentication
    subsystem called SSSD. As of version 4, Samba can also work as a domain controller
    over heterogeneous networks.


    If the goal is to implement a cloud computing solution to provide various methods
    of web data sharing, two alternatives could be considered: owncloud and Nextcloud.
    The two projects are very similar because Nextcloud is a spin-off of owncloud,
    which is not unusual among open source projects. Spin-offs are usually called
    a fork. Both provide the same basic features: file sharing and sync, collaborative
    works, calendar, contacts and mail, all through desktop, mobile and web interfaces.
    Nextcloud also provides private audio/video conferencing, whilst owncloud is more
    focused on file sharing and integration with third-party software. Many more features
    are provided as plugins which can be activated later.


    Both owncloud and Nextcloud offer a paid version with extra features and extended
    support. What makes them different from other commercial solutions is the ability
    to install Nextcloud or owncloud on a private server, free of charge, avoiding
    keeping sensitive data on an unknown server. As all the depend on HTTP communication
    and are written in PHP, the installation must be performed on a previously configured
    server, like Apache. If you consider installing owncloud or Nextcloud on your
    own server, make sure to also enable HTTPS to encrypt all connections to your
    cloud.


    # Network Administration


    Communication between computers is only possible if the network is working correctly.
    Normally, the network configuration is done by a set of programs running on the
    router, responsible for setting up and checking the network availability. In order
    to achieve this, basic network services are used: DHCP (Dynamic Host Configuration
    Protocol) and DNS (Domain Name System).


    DHCP is responsible for assigning an IP address to the host when a network is
