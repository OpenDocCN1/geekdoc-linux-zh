    As it can be seen, the nano executable is located within the /usr/bin directory.
    Let''s remove the directory from the variable and check to see if the command
    still works:


    ```

    $ PATH=$usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin/games

    $ echo $PATH

    ```'
