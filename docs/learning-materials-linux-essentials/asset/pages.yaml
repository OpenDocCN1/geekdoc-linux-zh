- pgno: 149
  md: '# # Answers to Explorational Exercises


    +   1. Run the ls -lh command in a directory that contains subdirectories. Note
    the listed size of these directories. Do these file sizes correct to you? Do they
    accurately represent the contents of all files inside that directory?


    No, they do not. Each directory has a listed file size of 4096 bytes. This is
    because directories here are an abstraction: they don''t exist as a tree structure
    on the disk. When you see a directory listed, you are seeing a link to a list
    of files. The size of these links is 4096 bytes.


    +   2. Here is a new command to try: du -h. Run this command and describe the
    output that it gives you.


    The du command will generate a list of all files and directories, and indicate
    the size of each. For example, du -s will display the file size of all files,
    directories, and subdirectories for a certain location.


    +   3. On many Linux systems, you can type in 11 and get the same output as you
    would if you typed ls -l1. Please note however that 11 is not a command. For example,
    man 11 will give you the message that no manual entry exists for it. What does
    this suggest to you about a feature of the command line?


    11 is an alias -1. In Bash, we can use aliases to simplify commonly-used commands.
    11 is often defined for you in Linux, but you can create your own as well.'
