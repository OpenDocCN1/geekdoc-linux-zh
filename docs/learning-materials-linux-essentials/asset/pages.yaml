  md: '# Linux Essentials (Version 1.6) | Topic 5: Security and File Permissions


    # WARN


    Warning period before password expiration, in days.


    # INACTIVE


    Maximum password age past expiration, in days.


    # EXPDATE


    Date of password expiration, days since the “epoch”.


    In the example below you can see a sample entry from the /etc/shadow file. Note
    that some values, like INACTIVE and EXPDATE are undefined.


    ```

    emma:$66$NP532JDQOGYZF8$bFJnh9Eet1txpb9/n6pmjlIwgu7hGj/eytsttbmBv0M1yTMGFIXESFNUmTo9EgxxH1OT1HGZQr8so4nIbe0:18064:0:99997:::

    ```


    The “epoch” of Unix is midnight (0000), Universal Coordinate Time (UTC), on Thursday,
    January 1, 1970. Most POSIX dates and times are in seconds since “epoch”, or in
    the case of the file /etc/shadow, days since “epoch”.


    > The shadow file is designed to be only readable by the superuser, and select
    core system authentication services that check the one-way password hash at login
    or other authentication-time.


    # NOTE


    Although different authentication solutions exist, the elementary method of password
    storage is the one-way hash function. This is done so the password is never stored
    in clear-text on a system, as the hashing function is not reversible. You can
    turn a password into a hash, but (ideally) not possible to turn a hash back into
    a password.


    At most, a brute force method is required to hash all combinations of a password,
    until one matches. To mitigate the issue of a password hash being cracked on one
    system, Linux systems will use a random “salt” on each password for a user. So
    the hash for a user password on one Linux system will not be the same as another
    Linux system, even if the password is the same.


    In the file /etc/shadow, the password may take several forms. These forms typically
    include the following:


    !!


    This means a “disabled” account (no authentication possible), with no password
    hash stored.


    # !S012345675ABC...


    A “disabled” account (due to the initial exclamation mark), with a prior hash
    function, salt hash'
