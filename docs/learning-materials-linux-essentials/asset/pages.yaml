    # Introduction


    An application is a computer whose purpose is not directly tied to the inner workings
    of the computer, with tasks performed by the user. Linux distributions offer many
    application options to perform a variety of tasks, such as office applications,
    web browsers, multimedia players and editors, etc. There is often more than one
    application or tool to perform a particular job. It is up to the user to choose
    the application which best fits their needs.


    # Software Packages


    Almost every Linux distribution offers a pre-installed set of default applications.
    Besides those pre-installed applications, a distribution has a package repository
    with a vast collection of applications available to install through its package
    manager. The various distributions offer roughly the same applications, several
    different package management systems exist for various distributions. For instance,
    Debian, Ubuntu and Linux Mint use the dpkg, apt-get and apt tools to install software
    packages, which generally referred to as DEB packages. Distributions such as Red
    Hat, Fedora and CentOS use the rpm, yum and dnf commands instead, which in install
    RPM packages. As the application packaging is different for each distribution,
    it is'
  merge: -1
