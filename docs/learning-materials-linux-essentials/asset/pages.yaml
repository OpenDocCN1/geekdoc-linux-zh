    # Introduction


    After exploring programs and their configuration files, in this lesson we will
    learn how commands are executed as processes. Likewise, we will be commenting
    on the system messaging, the use of the kernel ring buffer and how the arrival
    of systemd and its journal daemon — changed the ways things had been done so far
    regarding system logging.


    # Processes


    Every time a user issues a command, a program is run and one or more processes
    are generated.


    Processes exist in a hierarchy. After the kernel is loaded in memory on boot,
    the first process is initiated — in turn — starts processes which, again, can
    start others. Every process has a unique identifier (PID) and parent process identifier
    (PPID). These are positive integers that are assigned in sequential order.


    # Exploring Processes Dynamically: top


    You can get a dynamic listing of all running processes with the top command:'
  merge: -1
