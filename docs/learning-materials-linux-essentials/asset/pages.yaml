    # Handling Many Arguments


    So far our script can handle a single username at a time. Any number of arguments
    besides one will cause an error. Let''s explore how we can make this script more
    versatile.


    A user''s first instinct might be to use more positional variables as $2, $3 and
    so on. Unfortunately, we can''t anticipate the number of arguments that a user
    might choose to use. To solve this issue, it will be helpful to introduce built-in
    variables.


    We will modify the logic of our script. Having zero arguments should cause an
    error, but any other number of arguments should be successful. This new script
    will be called friendly2.sh.


    ```

    1 #!/bin/bash

    2

    3 # a friendly script to greet users

    4

    5 if [ $# -eq 0 ];

    6 then

    7 echo "Please enter at least one user to greet."

    8 exit 1

    9 else

    10 echo "Hello @!"

    11 exit 0

    12 fi

    ```


