  md: '# Linux (Version 1.6) | Topic 5: Security and File Permissions


    Another_Directory picture.jpg text.txt


    But there is much more information available for each file, including type, size,
    ownership and more. To see this information you must ask ls for a "long form"
    listing, using the -l parameter:


    ```

    $ ls -l

    total 536

    drwxrxr-x 2 carol carol 4096 Dec 10 15:57 Another_Directory

    --rw-r--r-- 1 carol carol 539663 Dec 10 10:43 picture.jpg

    --rw-r--r-- 1 carol carol 1881 Dec 10 15:57 text.txt

    ```


    Each column on the output above has a meaning:


    +   * The *first* column on the listing shows the file type and permissions.


    For example, `drwxrwxr-x`:


    +   * The first character, d, indicates the file type.

    * The next three, `rwx`, indicate the permissions for the owner of the file, also
    referred to as *user* or u.

    * The next three, `rwx`, indicate the permissions of the *group* owning the file,
    also referred to as g.

    * The last three, `r-x`, indicate the permissions for anyone else, also known
    as *others* or o.

    * The *second* column indicates the number of hard links pointing to that file.
    For a directory, this means the number of subdirectories (.) and the parent directory
    (..).

    * The *third* and *fourth* columns show ownership information: respectively the
    user and group that own the file.

    * The *fifth* column shows the filesize, in bytes.

    * The *sixth* column shows the precise date and time, or *timestamp*, when the
    file was last modified.

    * The *seventh* and last column show the file name.


    If you wish to see the filesizes in "human readable" format, add the -h parameter
    to ls. Less than one kilobyte in size will have the size in bytes. Files with
    less than one megabyte will have a K added after the size, indicating the size
    is in kilobytes. The same for filesizes in the megabyte (M) and gigabyte (G) ranges:'
