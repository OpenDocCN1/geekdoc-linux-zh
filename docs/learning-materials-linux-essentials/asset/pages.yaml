- pgno: 151
  md: 'Linux Essentials (Version 1.6) | 2.4 Creating, Moving and Deleting Files


    ![](img/1669a3de8a1d745f1aaf167b3eba581e_151_0.png)


    # 2.4 Lesson 1


    | Certificate: | Linux Essentials |

    | Version: | 1.6 |

    | Topic: | 2 Finding Your Way on a Linux System |

    | Objective: | 2.4 Creating, Moving and Deleting Files |

    | Lesson: | 1 of 1 |


    # # Introduction


    This lesson covers managing files and directories on Linux using command line
    tools.


    A file is a collection of data with a name and set of attributes. If, for example,
    you were to transfer some photos from your phone to a computer and give them descriptive
    names, you would now have a bunch of image files on your computer. These files
    have attributes such as the time the file last accessed or modified.


    A directory is a special kind of file used to organize files. A good way to think
    of directories is like the file folders used to organize files in a cabinet. Unlike
    file folders, you can easily put directories inside of other directories.


    The command line is the most effective way to manage files on a Linux system.
    The shell and command line tools have features that make using the command line
    faster and easier than a graphical file manager.


    In this section you will use the commands \ls, mv, cp, pwd, find, touch, rm, rdir,
    echo, cat, and mkdir to manage and organize files and directories.


    Version: 2023-04-14 | Licensed under CC BY-NC-ND 4.0. | learning.lpi.org | 143'
