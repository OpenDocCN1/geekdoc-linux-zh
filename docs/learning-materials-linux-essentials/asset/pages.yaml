- pgno: 410
  md: '# Special Permissions


    Besides the read, write and execute permissions for user, group and others, each
    file can have three other special permissions which can alter a directory works
    or how a program runs. They can be specified either in symbolic or numeric mode,
    and are as follows:


    # Sticky Bit


    The sticky bit, also called the restricted deletion flag, has the octal value
    1 and in symbolic mode is represented by a t within the other''s permissions.
    This applies only to directories, and on Linux prevents users from removing or
    renaming a file in a directory unless they own that file or directory.


    Directories with the sticky bit show a t replacing the x on the permissions for
    others the output of ls -1:


    ```

    $ ls -ld Sample_Directory/

    drwxr-xr-t 2 carol 4096 Dec 20 18:16 Sample_Directory/

    ```


    In numeric mode, the special permissions are specified using a “4-digit notation”,
    with the first digit representing the special permission to act upon. For example,
    to set the sticky bit (value 1) for the directory Another_Directory in numeric
    mode, with permissions 755, the command would be:


    ```

    $ chmod 1755 Another_Directory

    ls -ld Another_Directory

    drwxr-xr-t 2 carol 4,0K Dec 20 18:16 Another_Directory

    ```


    # Set GID


    Set GID, also known as SGID or Set Group ID, has the octal value 2 and in symbolic
    mode is represented by an s on the group permissions. This can be applied to executable
    files or directories. On executable files, it will grant the process running from
    executing the file access to the privileges of the group who owns the file. When
    applied to directories, it will make every file directory created under it inherit
    the group from the parent directory.


    Files and directories with SGID show an s replacing the x on the permissions for
    the group on the output of ls -1:


    ```

    $ ls -1 test.sh

    ```'
  merge: -1
  img_proc: true
- pgno: 411
