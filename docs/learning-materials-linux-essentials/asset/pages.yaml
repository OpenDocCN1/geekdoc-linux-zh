- pgno: 387
  md: '# Adding and Deleting Groups


    As for group management, you can add or delete groups using the groupadd and groupdel
    commands.


    If you want to create a new group named developer, you can run the following command
    at root:


    ```

    # groupadd -g 1090 developer

    ```


    The -g option of this command creates a group with a specific GID.


    If you want to delete the developer group, you can run the following:


    ```

    # groupdel developer

    ```


    > WARNING

    Remember when you add a new user account, the primary group and the secondary
    groups to which it belongs must exist before launching the useradd command. Also,
    you cannot delete a group if it is the primary group of a user account.


    # The passwd Command


    This command is primarily used to change a user''s password. Any user can change
    their password, but only root can change any user''s password.


    Depending on the passwd option used, you can control specific aspects of password
    aging:


    +   -d

    Delete the password of a user account (thus setting an empty password, making
    it a passwordless account).


    +   -e

    Force the user account to change the password.


    +   -l

    Lock the user account (the encrypted password is prefixed with an exclamation
    mark).


    +   -u

    Unlock the user account (it removes the exclamation mark).'
