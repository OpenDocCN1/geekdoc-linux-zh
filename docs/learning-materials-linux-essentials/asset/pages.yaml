    # Desktop Environments


    Linux has a modular approach where different parts of the system are developed
    by different projects and developers, each one filling a specific need or objective.
    Because of that, there are several options of desktop environments to choose from
    and together with package managers, the default desktop environment is one of
    the main differences among the distributions out. Unlike proprietary operating
    systems like Windows and macOS, where the users are restricted to the desktop
    environment that comes with their OS, there is the possibility to install multiple
    environments and pick the one that adapts to the most and to your needs.


    Basically, there are two major desktop environments in the Linux world: Gnome
    and KDE. They are both very complete, with a large community behind them and aim
    for the same purpose but slightly divergent approaches. In a nutshell, Gnome tries
    to follow the KISS ("keep it stupid") principle, with very streamlined and clean
    applications. On the other hand, KDE has another perspective with a larger selection
    of applications and giving the user the opportunity to change every configuration
    setting in the environment.


    While Gnome applications are based on the GTK toolkit (written in the C language),
    KDE applications made use of the Qt library (written in C++). One of the most
    practical aspects of writing applications with the same graphical toolkit is that
    applications tend to share a similar look and feel, which is responsible for giving
    the user a sense of unity during their experience. Another important characteristic
    is having the same shared graphical library for many frequently used applications
    may save some memory at the same time that it will speed up loading time when
    the library has been loaded for the first time.


    # Getting to the Command Line


    For us, one of the most important applications is the graphical terminal emulator.
    They are called terminal emulators because they really emulate, in a graphical
    environment, the old style terminals (often Teletype machines) that were in fact
    clients used to be connected to a remote machine where the computing actually
    happened. These machines were really simple computers with no graphics at all
    that were used on the first versions of Unix.


    In Gnome, such an application is called Gnome Terminal, while in KDE it can be
    found as Konsole. But there are many other choices available, as Xterm. Those
    applications are a way for us to have access to a command line in order to interact
    with a shell.'
