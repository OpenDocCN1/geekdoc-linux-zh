    Linux these are typically files located under the /etc directory, where is system
    configuration files should be stored. By default, this directory is readable by
    every user on the system, but writable only by root.


    The main files related to user accounts, attributes and access control are:


    /etc/passwd


    This file stores basic information about the users on the system, including UID
    and GID, directory, shell, etc. Despite the name, no passwords are stored here.


    /etc/group


    This file stores basic information about all user groups on the system, like group
    name and GID and members.


    /etc/shadow


    This is where user passwords are stored. They are hashed, for security.


    /etc/gshadow


    This file stores more detailed information about groups, including a hashed password
    which lets users temporarily become a member of a group, of users who can become'
