- pgno: 326
  md: 'Linux Essentials (Version 1.6) | Topic 4: The Linux Operating System


    # Summary


    In the context of data storage, the following topics have been discussed in this
    lesson: process management and system logging and messaging.


    Regarding process management, we have learned the following:


    +   - Programs generate processes and processes exist in a hierarchy.

    - Every process has a unique identifier (PID) and a parent identifier (PPID).

    - top is a very useful command to dynamically and interactively explore the running
    processes of the system.

    - ps can be used to obtain a snapshot of the current running processes in the
    system.

    - /proc directory includes directories for every running process in the system
    named after their PIDs.

    - The concept of system load average — which is very useful to check on CPU utilization/overloading.


    Concerning system logging, we must remember that:


    +   - A log is a file where system events are recorded. Logs are invaluable when
    it comes to troubleshooting.

    - Logging has traditionally been handled by special services such as syslog, syslog-ng
    or rsyslog. Nevertheless, some programs use their own logging daemons.

    - Because logs are large data, they are kept in /var and —sometimes—their names
    can give you a clue about their content (kern.log, auth.log, etc).

    - Most logs are written in plain text and can be read with any text editor as
    long as you have the right permissions. However, a few of them are binary and
    must be read using special commands.

    - To avoid problems with disk space, log rotation is carried out by logrotate
    utility.

    - As for the kernel, it uses a circular data structure — the ring buffer — where
    messages are kept (old messages fade away over time).

    - The system and service manager systemd replaced System V in virtually all distros
    by becoming the standard logging service.

    - To read systemd''s journal, the journalctl utility is needed.


    Commands used in this lesson:


