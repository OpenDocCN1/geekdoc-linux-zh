- pgno: 209
  md: '# -i


    the search is case insensitive


    # -r


    the search is recursive (it searches into all files within the given directory
    and subdirectories)


    # -c


    the search counts the number of matches


    # -V


    invert the match, to print lines that do not match the search term


    # -E


    turns on extended regular expressions (needed by some of the more advanced meta-characters
    like |, , * + ?)


    grep has many other useful options. Consult the man page to find out more about
    it.


    # Regular Expressions


    The second tool is very powerful. It is used to describe bits of text within files,
    also called regular expressions. Regular expressions are extremely useful in extracting
    data from text files by constructing patterns. They are commonly used within scripts
    or when programming with high level languages, such as Perl or Python.


    When working with regular expressions, it is very important to keep in mind that
    every character counts and the pattern is written with the purpose of matching
    a specific sequence of characters, known as a string. Patterns use the normal
    ASCII symbols, such as letters, digits, punctuation or other symbols, but it can
    also use Unicode characters in order to match any other type of text.


    The following list explains the regular expressions meta-characters that are used
    to form the patterns.


    .


    Match any single character (except newline)


    # [abc]


    Match any one character within the brackets'
