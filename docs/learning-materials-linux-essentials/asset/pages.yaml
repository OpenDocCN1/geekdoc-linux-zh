    # NOTE


    # The System Journal: systemd-journald


    As of 2015, systemd replaced SysV Init as a facto system and service manager in
    most major Linux distributions. As a consequence, the journal daemon—journal—has
    become the standard logging component, superseding syslog in most aspects. The
    data is no longer stored in plain text but in binary format. Thus, the journalctl
    utility is necessary to read the logs. On top of that, journal is syslog compatible
    and can be integrated with syslog.


    journalctl is the utility to read and query systemd''s journal. If invoked without
    options, it prints the entire journal:


    ```

    # journalctl

    -- Logs begin at Tue 2019-06-04 17:49:40 CEST, and at Tue 2019-06-04 18:13:10
    CEST. -

    Jun 04 17:49:40 debian systemd-journal[339]: Runtime journal (/run/log/journal/)
    is 8.0M, max 159.6M, 159.6M free.

    Jun 04 17:49:40 debian kernel: microcode updated to revision 0xccc, date = 2019-04-01

    Jun 04 17:49:40 debian kernel: Linux version 4.9.0-8-amd64 (debian-kernel@lists.debian.org)

    (gcc version 6.3.0-20170516 (Debian 6.3.0-18+deb9u1)) 1 SMP

    Jun 04 17:49:40 debian kernel: Command line: BOOT_IMAGE=/boot/vmlinuz-4.9.0-8-amd64

    root=/dev/sda ro quiet

    (...)

    ```


    If invoked with the -k or --dmesg switches, it will be equivalent to using the
    dmesg command:


    ```

    # journalctl -k

    [ 0.000000] Linux version 4.9.0-8-amd64 (debian-kernel@lists.debian.org) (gcc
    version

