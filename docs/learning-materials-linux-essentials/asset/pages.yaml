    ```

    $ TZ=EST date

    Thu 31 Jan 10:07:35 EST 2019

    $ TZ=GMT date

    Thu 31 Jan 15:07:35 GMT 2019

    ```


    You can display all environment variables using the env command.


    # The PATH Variable


    The PATH variable is one of the most important environment variables in a Linux
    system. It stores a list of directories, separated by a colon, that contain executable
    programs eligible as commands from the Linux shell.


    ```

    $ echo PATH

    /home/user/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/bin:/usr/games

    ```'
