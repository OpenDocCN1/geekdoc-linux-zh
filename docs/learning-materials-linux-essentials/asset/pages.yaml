- pgno: 357
  md: '# Accounts


    Security involves many concepts, one of the most common being the general concept
    of access controls. Before one can tackle file access controls such as ownership
    and permissions, one must understand the basic concepts of Linux user accounts,
    which are broken out into several types.


    Every user on a Linux system has an associated account besides login information
    (like username and password) also defines how, and where, the user can interact
    with the system. Privileges and access controls define the “boundaries” within
    which each user can operate.


    # Identifiers (UIDs/GIDs)


    The User and Group Identifiers (UIDs/GIDs) are the basic, enumerated references
    to accounts. Early implementations were limited 16-bit (values 0 to 65535) integers,
    but 21st century systems support 64-bit UIDs and GIDs. Users and groups are enumerated
    independently, so the same ID can stand for both a user and group.


    Every user has not only a UID, but also a primary GID. The primary GID for a user
    can be unique to that user alone, and may end up not used by any other users.
    However, this group could also be a group shared by numerous users. In addition
    to these primary groups, each user can be member of other groups, too.


    By default on Linux systems, every user is assigned to a group with the same name
    as their username, and GID as their UID. E.g., create a new user named newcomer
    and, by default, its default group is newcomer as.


    # The Superuser Account


    On Linux the superuser account is root, which always has UID 0. The superuser
    is sometimes called the system administrator, and has unlimited access and control
    over the system, including other users.


    The default group for the superuser has the GID 0 and is also named root. The
    home directory for the superuser is a dedicated, top level directory, /root, only
    accessible by the root user himself.


    # Standard User Accounts


    All accounts other than root are technically regular user accounts, but on a Linux
    system the colloquial term user account often means a “regular” (unprivileged)
    user account. They typically have the following properties, with certain exceptions:


    +   - UIDs starting at 1000 (4 digits), although some legacy systems may start
    at 500.'
  merge: -1
  img_proc: true
- pgno: 358
  md: '# Linux Essentials (Version 1.6) | Topic 5: Security and File Permissions


    +   - A defined home directory, usually a subdirectory of /home, depending on
    the site-local configuration.

    - A defined login shell. In Linux the default shell is usually the Bourne Again
    Shell (/bin/bash), though others may be available.


    If a user account does not have a valid shell in their attributes, the user will
    not be able to open an interactive shell. Usually /sbin/nologin is used as an
    invalid shell. This may be purposeful, if the user will only be authenticated
    for services other than console or SSH access, e.g., Secure FTP (sftp) access
    only.


    > NOTE To avoid, the term user account will only apply to standard or regular
    user accounts going forward. E.g., system account will be used to explain a Linux
    user account that is of the system account type.


    # System Accounts


    accounts are typically pre-created at system installation time. These are for
    facilities, programs and services that will not run as the superuser. In an ideal
    world, these would be all operating system facilities.


    The system accounts vary, but their attributes include:


    +   - UIDs are usually under 100 (2-digit) or 500-1000 (3-digit).

    - Either no deðdicted home directory or a directory that is usually not under
    /home.

    - No valid login shell (typically /sbin/nologin), with rare exceptions.


    Most system accounts on Linux will never log in, and do not need a defined shell
    in their attributes. Many processes owned and executed by system accounts are
    forked into their own environment by the system management, running with the specified,
    system accounts. These accounts usually have limited or, more often than, no privileges.


    > NOTE From the standpoint of the LPI Linux Essentials, system accounts are UIDs
    <1000, with 2 or 3 UIDs (and GIDs).


    In general, the system accounts should not have a valid login shell. The opposite
    would be a security issue in most cases.


    # Service Accounts


    accounts are typically created when services are installed and configured. Similar
    to system accounts, these are for facilities, programs and services that will
    not run as the superuser.'
  merge: -1
  img_proc: true
- pgno: 359
  md: 'In much documentation, system and service accounts are similar, and inter often.
    This includes the location of home directories typically being outside /home,
    if defined at all (service accounts are more likely to have one, compared to system
    accounts), and no valid login shell. Although there is no strict definition, the
    primary difference between system and service accounts breaks down to UID/GID.


    # System account


    UID/GID <100 (2-digit) or <500-1000 (3-digit)


    # Service account


    UID/GID >1000 (4+ digit), but not a “standard” or “regular” user account, an account
    for services, with an UID/GID >1000 (4+ digits)


