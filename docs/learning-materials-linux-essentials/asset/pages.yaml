- pgno: 424
  md: '![](img/1669a3de8a1d745f1aaf167b3eba581e_424_0.png)


    # # 5.4 Lesson 1


    | Certificate: | Linux Essentials |

    |---|---|

    | Version: | 1.6 |

    | Topic: | 5 Security and File Permissions |

    | Objective: | 5.4 Special Directories and Files |

    | Lesson: | 1 of 1 |


    # # Introduction


    On Linux, everything is treated as a file. However, some files get a special treatment,
    because of the place they are stored, such as temporary files, or the way they
    interact with the filesystem, such as links. In this lesson, we will learn where
    such files are located, how they work and how to manage them.


    # # Temporary Files


    Temporary files are used by programs to store data that is only needed for a short
    time. This can be the data of running processes, crash logs, scratch files from
    an autosave, intermediary files used during a file conversion, cache files and
    so on.


    # # Location of temporary files


    Version 3.0 of the Filesystem Hierarchy Standard (FHS) defines standard locations
    for temporary files on Linux systems. Each location has a different purpose and
    behavior, and it is recommended that developers follow the conventions set by
    the FHS when writing temporary data to disk.'
  merge: -1
  img_proc: true
- pgno: 425
  md: '/tmp

    According to the FHS, programs should not assume that files written here will
    be preserved between invocations of a program. The recommendation is that this
    directory be cleared (all files erased) during system boot-up, although this is
    not mandatory.


    /var/tmp

    Another location for temporary files, but one should not be cleared during the
    system boot, i.e. files stored here will usually persist after reboots.


    /run

    This directory contains run-time variable data used by running processes, such
    as process identifier files (.pid). Programs that need more than one run-time
    file may create subdirectories. This location must be cleared during system boot-up.
    The purpose of this directory was once served by /var/run, and on some systems
    /var/run may be a symbolic link to /run.


    Note that there is nothing that prevents a program to create temporary files elsewhere
    in the system, but it is good practice to follow the conventions set by the FHS.


    # Permissions on temporary files


    Having system-wide temporary directories on a multiuser system presents some challenges
    regarding access permissions. At first thought one might think that such directories
    would be “world-writable”, i.e. any user could write or delete data in it. But
    if this were to be true, how could we prevent a user from erasing or modifying
    files created by another?


    The solution is a special permission called the sticky bit, which applies to directories
    and files. However, for security reasons, the Linux kernel ignores the sticky
    bit when it is applied to files. When this special bit is set for a directory,
    it prevents users from removing or renaming a file within directory unless they
    own the file.


    Directories with the sticky bit show a t replacing the x on the permission for
    others in the output of ls -l. For example, check the permissions for the /tmp
    and /var/tmp directories:


    ```

    $ ls -ldh /tmp /var/tmp /var/tmp/

    drwxrxrwt 25 root 4.0K Jun 7 18:52 /tmp/

    drwxrxrwt 16 root 4.0K Jun 7 09:15 /var/tmp/

    ```


    As you can see the t replacing the x on the permission for others, both directories
    have the sticky bit set.'
  merge: -1
  img_proc: true
- pgno: 426
  md: '# Linux Essentials (Version 1.6) | Topic 5: Security and File Permissions


    Set the sticky bit on a directory using chmod in numeric mode, use the four-digit
    notation and 1 as the first digit. For example:


    ```

    $ chmod 1755 temp

    ```


    will set the sticky bit for the directory named temp and the permissions as rwx-xr-t.


    When using the symbolic mode, use the parameter t. So, +t to set the sticky bit,
    and -t to disable it. Like so:


    ```

    $ chmod +t temp

    ```


    # Understanding Links


    We have already said on Linux everything is treated as a file. But there is a
    special kind of file, called a link, and there are two types of links on a Linux
    system:


    # Symbolic links


    Also soft links, they point to the path of another file. If you delete the file
    link points to (called target) the link will still exist, but it “stops working”,
    as it now points to “nothing”.


    # Hard links


    Think of a hard link as a second name for the original file. They are not duplicates,
    but instead are an additional entry in the file system pointing to the same place
    (inode).


    > An inode is a data structure that stores attributes for an object (a file or
    directory) on a filesystem. Among those attributes are the filename, permissions,
    ownership and on which blocks of the disk for the data is stored. Think of it
    as an entry on an index, hence the name, which comes from “index node”.


    # Working with Hard Links


    # Creating Hard Link


    The command to create a hard link on Linux is ln. The basic syntax is:


    ```

    $ ln TARGET LINK_NAME

    ```


    The TARGET must already exist (this is the file link will point to), and if the
    target is not the'
  merge: -1
  img_proc: true
- pgno: 427
  md: 'current directory, or if you want to create the link elsewhere, you must specify
    the full path to it. For example, the command


    ```

    $ ln target.txt /home/carol/Documents/hardlink

    ```


    will create a file named hardlink on the directory /home/carol/Documents/, linked
    to the file target.txt on the current directory.


    If you leave out the parameter (LINK_NAME), a link with the same name as the target
    will be created in the current directory.


    # Managing Hard Links


    Hard links are entries in the filesystem which have different names but point
    to the same data on disk. All names are equal and can be used to refer to a file.
    If you change the contents of the names, the contents of all other names pointing
    to that file change since all these names point to the same data. If you delete
    one of the names, the others will still work.


    This happens when you “delete” the file is not actually erased from the disk.
    The system simply deletes the entry on the filesystem table pointing to the inode
    corresponding to the data on disk. If you have a second entry pointing to the
    same inode, you can still get to the data. Think of it as two roads converging
    on the same point. If you block or redirect one of the roads, you can still reach
    the destination using the other.


    You can check this by using the -i parameter of ls. Consider the following contents
    of a directory:


    ```

    $ ls -li

    total 224

    3806696 -r--r--r-- 2 carol 111702 Jun 7 10:13 hardlink

    3806696 -r--r--r-- 2 carol 111702 Jun 7 10:13 target.txt

    ```


    The number before is the inode number. Note that both the file hardlink and the
    file target.txt have the same number (3806696)? This is because one is a hard
    link of the other.


    But which one is the original and which is the link? You can''t really tell, as
    for all practical purposes they are the same.


    Note that every hard link pointing to a file increases the link count of the file.
    This is the number right after the permissions of the output of ls -1. By default,
    every file has a link count of 1 (directories have a count of 2), and every hard
    link it increases the count by one. So, that is the reason for the link count
    of 2 on the files in the listing above.'
  merge: -1
  img_proc: true
- pgno: 428
  md: '# Linux Essentials (Version 1.6) | Topic 5: Security and File Permissions


    In contrast to symbolic links, you can only create hard links to files, and both
    the link and target must reside in the same file system.


    # Moving and Removing Hard Links


    Since hard links are treated as regular files, they can be deleted with rm and
    renamed or moved around the filesystem with mv. And since a hard link points to
    the same inode of the target, it can be moved freely, without fear of “breaking”
    the link.


    # Symbolic Links


    # Creating Symbolic Links


    The command used to create a symbolic link is also ln, but with the -s parameter
    added. Like so:


    ```

    $ ln -s target.txt /home/carol/Documents/softlink

    ```


    This will create a file named softlink in the directory /home/carol/Documents/,
    pointing to the file target.txt in the current directory.


    As hard links, you can omit the link name to create a link with the same name
    as the target in the current directory.


    # Managing Symbolic Links


    Symbolic links point to another path in the filesystem. You can create soft links
    to files and directories, even on different partitions. It is pretty easy to spot
    a symbolic link on the output of ls:


    ```

    $ ls -lh

    total 112K

    -rw-r--r-- 1 carol 110K Jun 7 10:13 target.txt

    lrwxrwxr-wx 1 carol 12 Jun 7 10:14 softlink -> target.txt

    ```


    In the example, the first character on the permissions for the file link is l,
    indicating a symbolic link. Furthermore, after the filename we see the name of
    the target link points, to the file target.txt.


    Note that on file and directory listings, soft links themselves always show the
    permissions rwx for the user, the group and others, but in practice the permissions
    for them are the same as those for the target.'
  merge: -1
  img_proc: true
- pgno: 429
  md: '# Moving and Removing Symbolic Links


    Like hard links, symbolic links can be removed using rm and moved around or renamed
    using mv. However, special care should be taken when creating them, to avoid "breaking"
    the link if it is moved from its original location.


    When creating symbolic links you should be aware that unless a path is fully specified
    the location of the target is interpreted as relative to the location of the link.
    This may create problems if the link, or the file it points to, is moved.


    This is easier to understand with an example. Say that we have a file named original.txt
    in the current directory, and we want to create a symbolic link to it called softlink.
    We could use:


    ```

    $ ln -s original.txt softlink

    ```


    And apparently all would be well. Let''s check with ls:


    ```

    $ ls -lh

    total 112K

    -r--r--r-- 1 carol Jun 7 10:13 original.txt

    lrwxrwxwx 1 carol 12 Jun 7 19:23 softlink -> original.txt

    ```


    See how the link is constructed: softlink points to (...) original.txt. However,
    let''s see what happens if we move the link to the parent directory and try to
    display its contents using the command:


    ```

    $ mv softlink ../

    $ ls ../softlink

    softlink: No such file or directory

    ```


    Since the path to original.txt was not specified, the system assumes that it is
    in the same directory as the link. When this is no longer true, the link stops
    working.


    The way to prevent this is to always specify the full path to the target when
    creating the link:


    ```

    $ ln -s /home/carol/Documents/original.txt softlink

    ```


    This way, no matter where you move the link it will still work, because it points
    to the absolute location of the target. Check with ls:'
  merge: -1
  img_proc: true
