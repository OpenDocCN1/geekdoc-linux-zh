    # # Introduction


    For an operating system, everything is **considered** data. For Linux, everything
    **is considered** a file: programs, regular files, directories, block devices
    (hard disks, etc.), character devices (consoles, kernel processes, sockets, partitions,
    links, etc. The Linux directory structure, starting from the *root* /* is a collection
    of files containing data. The fact that everything is a file is a powerful feature
    of Linux it allows for tweaking virtually every aspect of the system.


    In this lesson we will be discussing the different locations in which important
    data is stored as established by Linux Filesystem Hierarchy Standard (FHS). Some
    of these locations are real directories which store data persistently on disks,
    whereas others are pseudo filesystems loaded in memory which we access to kernel
    subsystem data as running processes, of memory, hardware configuration and so
    on. The data stored in these virtual directories is used by a number of commands
    that allow us to monitor and handle it.


    # # Programs and their Configuration


    Important data on a Linux system are — no doubt— programs and their configuration
    files. The former are executable files containing sets of instructions to be run
    by the computer''s'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# Linux Essentials (Version 1.6) | Topic 4: The Linux Operating System


    processor, whereas the latter are usually text documents that control the operation
    of a program. Executable files can be binary files or text files. Executable text
    files are called scripts. Configuration data on Linux is traditionally stored
    in text files, although there are various styles of representing configuration
    data.


    # Where Binary Files are Stored


    Like any other file, executable files live in directories hanging ultimately from
    /. More specifically, programs are distributed across a three-tier structure:
    the first tier (/) includes programs that can be necessary in single-user mode,
    the second tier (/usr) contains many multi-user programs and the third tier (/usr/local)
    is used to store software that is not provided by the distribution and has been
    compiled locally.


    Typical locations for programs include:


    +   /sbin

    It contains essential binaries for system administration such as parted or ip.


    +   /bin

    It contains essential binaries for all users such as ls, mv or mkdir.


    +   /usr/sbin

    It stores binaries for system administration as deluser, or grouppadd.


    +   /usr/bin

    It includes most executable files — as free, pstree, sudo or man — that can be
    used by all users.


    +   /usr/local/sbin

    It is used to store locally installed programs for system administration that
    are not managed by the system''s package manager.


    +   /usr/local/bin

    It serves the same purpose as /usr/local/sbin for regular user programs.


    Recently some distributions started to replace /bin and /sbin with symbolic links
    to /usr/bin and /usr/sbin.


    +   NOTE The /opt directory is sometimes used to store optional third-party applications.


    Apart from these directories, regular users can have their own programs in:'
  merge: -1
  img_proc: true
