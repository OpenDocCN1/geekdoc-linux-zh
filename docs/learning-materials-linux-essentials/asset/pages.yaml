- pgno: 199
  md: 'of scripting languages, like bash, sh and csh are able to take input directly
    from the command

    line, without using any texts.


    As can be seen in the example below, the operator is used to input data into the
    command, while

    the word after doesn''t specify the file name. The word is interpreted as the
    delimiter of the input

    and it will not be taken in consideration as content, therefore cat will not display
    it:


    ```

    $ cat << hello

    > hey

    > ola

    > hello

    hey

    ola

    ```


    Consult the man page of the cat command to find more information.


    # Combinations


    The first combination that we will explore combines the redirection of the standard
    output and

    standard error output to the same file. The & and && operators are used, representing
    the

    combination of channel 1 and channel 2. The first operator will overwrite the
    existing contents of

    the file and the second one will append or add the new information at the end
    of the file. Both

    operators will enable the creation of the new file if it doesn''t exist, just
    like in the previous

    sections:


    ```

    $ find /usr admin & newfile

    $ cat newfile

    /usr

    /usr/share

    /usr/share/misc

    ---Omitted output---

    /usr/lib/libmagic.so.1.0.0

    /usr/lib/libbdns.so.81

    /usr/games

    find: ''admin'': No such file or directory

    $ find /etc/calendar >> newfile

    $ cat newfile

    /usr

    /usr/share

    /usr/share/misc

    ---Omitted output---

    /usr/lib/libmagic.so.1.0.0

    ```'
