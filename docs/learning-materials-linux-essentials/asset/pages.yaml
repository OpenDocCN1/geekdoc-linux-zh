- pgno: 97
  md: 'To append a directory to the variable, you will need to use the colon sign
    (:).


    ```

    $ PATH=$PATH:new_directory

    ```


    Here an example:


    ```

    $ echo $PATH

    /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    $ PATH=$PATH:/home/usr/bin

    $ echo $PATH

    /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/home/usr/bin

    ```


    As you see, PATH is used in the new value assigned to PATH. This variable is resolved
    during the command execution and makes sure that the original content of the variable
    is preserved. Of course, you can use other variables in the assignment as well:


    ```

    $ mybin=/opt/bin

    $ PATH=$PATH:$mybin

    $ echo $PATH

    /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/home/usr/bin:/opt/bin

    ```


    The PATH variable needs to be handled with caution, as it is crucial for working
    on the command line. Let''s consider the following PATH variable:


    ```

    $ echo $PATH

    /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

