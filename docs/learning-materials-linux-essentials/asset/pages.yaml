- pgno: 289
  md: '# # Answers to Explorational Exercises


    1. Run the `lsblk` command on your system. Identify the parameters below. If a
    system is not immediately available, consider the `lsblk -f` listing for the Raspberry
    Pi system mentioned in the "Storage" section above:


    | NAME | FSTYPE | UUID | MOUNTPOINT |

    |---|---|---|---|---|

    | mmblk0 | | | | |

    | +-mmblk0p1 | vfat | boot | 9304-D9FD | /boot |

    | +-mmblk0p2 | ext4 | rootfs | 29075e46-f0d4-44e2-a9e7-55ac02d66cc | / |


    Answers that follow are based the `lsblk -f` listing for the Raspberry Pi system
    above. Answers may differ:


    # The type of devices and how many


    There is one device: `mmblk0`. You know by convention that the `mmblk0` would
    be an SD memory card.


    # The partition structure of each device


    There are two partitions: `mmblk0p1` and `mmblk0p2`.


    # The type of file system and mount for each partition


    Partition 1 uses the vfat file system. It is used to boot the system and is mounted
    as /boot. Partition 2 uses the ext4 file system. It is used as the primary file
    system and is mounted as /.'
