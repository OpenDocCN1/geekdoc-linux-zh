- pgno: 386
  md: '# Linux Essentials (Version 1.6) | Topic 5: Security and File Permissions


    UID, GID and the groups to which it belongs.


    ```

    # id frank

    uid=1000(frank) gid=1000(frank) groups=1000(frank)

    # groups frank

    frank : frank

    ```


    Remember to check and eventually edit the /etc/login.defs file, which defines
    the configuration parameters that the creation of users and groups. For example,
    you can set the set of UIDs and GIDs that can be assigned to new user and group
    accounts, specify that you don''t need to use the -m option to create the new
    user''s home directory and if the system should create a new group for each user.


    TIP


    If you want to delete a user account, you can use the userdel command. In particular,
    this command updates the information stored in the account databases, deleting
    all entries referring to the specified user. The -r option also removes the user''s
    home directory and all of its contents, along with the user''s mail pool. Other
    files, located elsewhere, must be searched for and deleted manually.


    ```

    # userdel -r frank

    ```


    As before, you need root authority to delete user accounts.


    # The Skeleton Directory


    When you add a new user account, even creating its home directory, the newly created
    directory is populated with files and folders that are copied from the skeleton
    directory (by default /etc/skeleton). The idea behind this is simple: a system
    administrator wants to add new users using the same files and directories in their
    home. Therefore, if you want to customize the files and folders that are created
    automatically in the home directory of the new user accounts, you must add these
    new files and folders to the skeleton directory.


    > Note the profile files that are usually found in the skeleton directory are
    hidden files. Therefore, if you want to list all the files and folders in the
    skeleton directory, which will be copied to the home dir of the newly created
    users, you must use the ls -A command.


    TIP'
