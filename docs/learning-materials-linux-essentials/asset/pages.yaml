    To find more about the cut command, consult it its main page.


    # Command Line Pipes


    Redirection is mostly used to store the result of a command, to be processed by
    a different command. This type of intermediate process can become very tedious
    and complicated if you want the data to go through multiple processes. In order
    to avoid this, you can link the command directly via pipes. In other words, the
    first command''s output automatically becomes the second command''s input. This
    connection is made using the | (vertical bar) operator:


    ```

    $ cat /etc/password | less

    root:x:0:0:root:/bin/bash

    daemon:x:1:1:daemon:/usr/bin:/bin/sh

    bin:x:2:2:/bin:/bin/sh

    :

    ```


