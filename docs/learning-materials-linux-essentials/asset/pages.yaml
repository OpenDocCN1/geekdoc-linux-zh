  md: 'two arguments:


    ```

    #!/bin/bash


    # This is our first comment. It is also good practice to comment all scripts.


    username=$1

    username2=$2

    echo "Hello $username $username!"

    ```


    ```

    ./new_script.sh Carol Dave

    Hello Carol and Dave!

    ```


    There is an important consideration when using arguments: In the example above,
    there are two arguments Carol and Dave, assigned to $1 and $2 respectively. If
    the second argument is missing, for example, the shell will not throw an error.
    The value of $2 will simply be null, or nothing at all.


    ```

    ./new_script.sh Carol

    Hello Carol and !

    ```


    In our case, it would be a good idea to introduce some logic to our script so
    that different conditions will affect the output that we wish to print. We will
    start by introducing another helpful variable and then move on to creating if
    statements.


    # Returning the Number of Arguments


    While variables such as $1 and $2 contain the value of positional arguments, another
    variable # contains the number of arguments.


    ```

    #!/bin/bash


    # This is our first comment. It is also good practice to comment all scripts.


    username=$1


    echo "Hello $username"

    echo "Number of arguments: $#"

    ```'
