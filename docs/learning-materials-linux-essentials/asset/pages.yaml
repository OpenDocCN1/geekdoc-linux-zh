    # Process Information in the /proc Directory


    We have already seen the /proc filesystem. /proc includes a numbered subdirectory
    for every running process in the system (the number is the PID of the process):


    ```

    carol@debian:~# ls -l /proc

    1 108 13 17 21 37 41 665 8 9

    10 109 14 173 22 28 355 42 7 804 915

    103 111 14 180 23 29 356 428 749 810 918

    104 111 14 181 24 3 367 432 75 811

    105 112 14 199 25 244 340 433 768 83

    106 115 15 195 25 350 371 5 797 838

    107 102 17 26 353 404 507 798 899

    (...)

    ```


    Thus, all the information about a particular process is included within its directory.
    Let us list the contents of the first process — that PID is 1 (the output has
    been truncated for readability):


    ```

    # ls /proc/1/

    attr      cmdline        environ mem     ns

    autogroup comm           exe        limits   mountinfo numa_maps

    auxv       coredump_filter fd         loginuid counts  oom_adj

    ...

    ```


    You can check — for instance — the process executable:


    ```

    # cat /proc/1/cmdline; echo

    ```'
