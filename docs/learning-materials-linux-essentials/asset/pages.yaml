    # Adding and Deleting User Accounts


    In Linux, you add a new user account with the useradd command, and you delete
    a user account with the userdel command.


    If you want to create a new user account named frank with a default setting, you
    can run the following:


    ```

    # useradd frank

    ```


    After creating the new user, you can set a password using passwd:


    ```

    # passwd frank

    Changing password for user frank.

    New UNIX password:

    Retype new UNIX password:

    passwd: all authentication tokens updated successfully.

    ```


    Both of these require root authority. When you run the useradd command, the user
    and group information stored in password and group databases are updated for the
    newly created user account, and if specified, the home directory of the new user
    is created as well as a group with the same name as the user account.


    > Remember that you can always use the grep utility to filter the password and
    group databases, displaying only the entry that refers to a specific user or group.
    For the above example you can use'
