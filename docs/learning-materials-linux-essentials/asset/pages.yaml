- pgno: 412
  md: '# Linux Essentials (Version 1.6) | Topic 5: Security and File Permissions


    As we can see, the group who owns the file is users. This is because the SGID
    bit made the file inherit group owner of its parent directory, which is users.


    # Set UID


    SUID, also known as Set User ID, the octal value 4 and is represented by an s
    on the user permissions in symbolic mode. It only applies to files and its behavior
    is similar to the SGID bit, but the process will run with the privileges of the
    user who owns the file. Files with the SUID bit show an s replacing the x on the
    permissions for the user on the output of ls -1:


    ```

    $ ls -ld test.sh

    -rwsr-xr-x 1 carol 33 Dec 11 10:36 test.sh

    ```


    You can combine multiple special permissions in one parameter by adding them together.
    So, to set SGID (value 2) and SUID (value 4) in numeric mode for the script test.sh
    with permissions 755, you would type:


    ```

    $ chmod 6755 test.sh

    ```


    And the result would be:


    ```

    $ ls -lh test.sh

    -rwsr-xr-x 1 carol 66 Jan 18 17:29 test.sh

    ```


    > If your terminal supports color, and these days most of them do, you can quickly
    see if these special permissions are set by glancing at the output of ls -1. For
    the sticky bit, the directory name might be shown in a black font with blue background.
    The same applies to files with the SGID (yellow background) and SUID (red background)
    bits. Colors may be different depending on which Linux distribution and terminal
    settings you use.'
