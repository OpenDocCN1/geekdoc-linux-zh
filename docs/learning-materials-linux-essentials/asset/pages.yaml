    # Where Configuration Files are Stored


    # The /etc Directory


    In the early days of Unix there was a folder for each type of data, such as /bin
    for binaries and /boot for the kernel(s). However, /etc (meaning et cetera) was
    created as a catch-all directory to store any files that did not belong in the
    other categories. Most of these files were configuration files. With the passing
    of time more and more configuration files were added so /etc became the main folder
    for configuration files of programs. As said above, a configuration file usually
    is a local, plain text (as opposed to binary) file which controls the operation
    of a program.


    In /etc we can find different patterns for config files names:


    +   - Files with an ad hoc extension or no extension at all, for example


    group

    System group database.


    hostname

    Name of the host computer.


    hosts

    List of IP addresses and their hostname translations.


    passwd

    System user database — made up of seven fields separated by colons providing information
    about the user.'
  merge: -1
  img_proc: true
