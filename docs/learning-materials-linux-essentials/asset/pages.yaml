  md: '```

    $ touch "new file"

    $ ls -l

    -rw-rw-r-- 1 tom students 0 Oct 8 15:19 new file

    ```


    As you can see, in the first example, the touch command creates two individual
    files, the command interprets the two strings as individual arguments. In the
    second example, the command interprets both strings as one argument, therefore
    it only creates one file. It is, however, best practice to avoid the space character
    in filenames. Instead, an underscore (_) or a dot (.) could be used.


    # Single Quotes


    Single quotes don''t have the exceptions of the double quotes. They revoke any
    special meaning from each character. Let''s take one of the first examples from
    above:


    ```

    echo I am $USER

    I tom

    ```


    When applying the single quotes you see a different result:


    ```

    echo ''I am $USER''

    I am USER

    ```


    The command now displays the exact string without substituting the variable.


    # Escape Characters


    We can use escape characters to remove special meanings of characters from Bash.
    Going back to the $USER environment variable:


    ```

    echo $USER

    carol

    ```


    We see that by default, the contents of the variable are displayed in the terminal.
    However, if we were to precede the dollar sign with a backslash character (\)
    then the special meaning of the dollar sign will be negated. In turn will not
    let Bash expand the variable''s value to the username of the person running the
    command, but will interpret the variable name literally:'
