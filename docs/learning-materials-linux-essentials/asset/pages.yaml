  img_proc: true
- pgno: 49
  md: 'modifications do not have to be released to the public, the GNU Affero General
    Public License (AGPL), which covers selling access to hosted software, or the
    GNU Free Documentation License (FDL), extends freedom principles to software documentation.
    In addition, the FSF makes recommendations for or against third-party licenses,
    and affiliated projects such as GPL-Violations investigate suspected violations
    of free licenses.


    The FSF calls the principle against which we free license also applies to variants
    of the software copyleft—in contrast to the principle of restrictive copyright
    which it rejects. The idea, therefore, is to transfer the liberal principles of
    a free license as restrictively as possible to future variants of the software
    in order to prevent subsequent restrictions.


    What sounds obvious and simple, however, leads to considerable complications in
    practice, which is critics call the copyleft principle "viral", since it is transmitted
    to subsequent versions.


    From what has been said it, for example, two software components that are licensed
    under different licenses might not be compatible with each other, since both licenses
    cannot be transferred to the subsequent product at the same time. This can even
    apply to different versions of the same license!


    For this reason, newer licenses or license versions no longer grasp the copyleft
    so rigorously. Already mentioned GNU Lesser General Public License (LGPL) is in
    this sense a concession to be able to connect free software with "non-free" components,
    as it is frequently called libraries. Libraries contain subroutines or routines,
    which in turn are used by various other programs. This leads to the common situation
    where proprietary software calls such a subroutine from a free library.


    Another way to avoid license conflicts is dual licensing, where one software is
    licensed under different licenses, e.g. a free license and a proprietary license.
    A typical case is a free version of software which might only be used when respecting
    the copyleft restrictions and the alternative to obtain the software under a different
    license which frees the licensee from certain restriction in return for a fee
    which could be used to find the development of the software.


    It should therefore become clear that the choice of license for software projects
    should be made with much caution, since the cooperation with other projects, the
    compatibility with other components and also the future design of the product
    depend on it. The copyleft presents developers with special challenges in this
    respect.'
  merge: -1
  img_proc: true
