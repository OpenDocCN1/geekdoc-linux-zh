    # # Introduction


    Modern Linux distributions have a wide range of graphical user interfaces but
    an administrator will always need to know how to work with the command line, or
    **shell** as it is called. The shell is a program that enables text based communication
    between the operating system and the user. It is usually a text mode program that
    reads the user''s input and interprets it as commands to the system.


    There are several different shells on Linux, these are just a few:


    +   - Bourne-again shell (Bash)

    - C shell (csh or tcsh, the enhanced csh)

    - Korn shell (ksh)

    - Z shell (zsh)


    On Linux the most common one is the Bash shell. This is also the one that will
    be used in examples or exercises here.


    When using an interactive shell, the user inputs commands at a so-called prompt.
    For each Linux'
