    # Using Regular Expressions to Perform Error Checking


    It''s possible that we want to verify all arguments that the user is entering.
    For example, perhaps we must ensure that all names passed to friendly2.sh contain
    only letters, and special characters or numbers will cause an error. To perform
    this error checking, we will use grep.


    Recall that we can use regular expressions with grep.


    ```

    $ echo Animal | grep "^\[A-Za-z]*$\$

    ```


