- pgno: 226
  md: '# Linux Essentials (Version 1.6) | Topic 3: The Power of the Command Line


    In this case, we have created a variable called username and we have assigned
    the value of Carol. Please note that there are no spaces between the variable
    name, the equals sign, or the assigned value.


    In the next line, we have used the echo command with the variable, but there is
    a dollar sign ($) in front of the variable name. This is important, since it indicates
    to the shell that we wish to treat username as a variable, and not just a normal
    word. By entering $username in our command, we indicate that we want to perform
    a substitution, replacing the name of a variable with the value assigned to that
    variable.


    Executing the new script, we get this output:


    ```

    $ ./new_script.sh

    Hello Carol!

    ```


    +   * Variable names must contain only alphanumeric characters and underscores,
    and are case sensitive. Username and username will be treated as separate variables.

    * Variable substitution may also have the form ${username}, with the addition
    of the { }. This is also acceptable.

    * Variables in Bash have an implicit type, and are considered strings. This means
    that performing functions in Bash is more complicated than it would be in other
    programming languages such as C/C++.


    ```

    #!/bin/bash


    # This is our first comment. It is also good practice to comment all scripts.


    username=Carol

    x=2

    y=4

    z=$x+$y

    echo "Hello $username!"

    echo "$x + $y"

    echo "$z"

    ```


    ```

    $ ./new_script.sh

    Hello Carol!

    2 + 4

    2+4

    ```'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# Using Quotes with Variables


    Let''s make the following change to the value of our variable username:


    ```

    #!/bin/bash


    # This is our first comment. It is also good practice to comment all scripts.


    username=Carol Smith


    echo "Hello $username!"

    ```


    Running this script will give us an error:


    ```

    $ ./new_script.sh

    ./new_script.sh: line 5: Smith: command not found

    Hello !

    ```


    Keep in mind that Bash is an interpreter, and as such it interprets our line-by-line.
    In this case, it correctly interprets username=Carol to be setting a variable
    username with the value Carol. But then it interprets the space as indicating
    the end of assignment, and Smith as being the name of a command. In order to have
    the space and the name Smith included as the new value of our variable, we will
    put double quotes ("") around the name.


    ```

    #!/bin/bash


    # This is our first comment. It is also good practice to comment all scripts.


    username=Carol Smith


    echo "Hello $username!"

    ```


    ```

    $ ./new_script.sh

    Hello Carol Smith!

    ```


    One important thing to note in Bash is that double quotes and single quotes ('')
    behave very differently. Double quotes are considered "weak", because they allow
    the interpreter to perform substitution inside the quotes. Single quotes are considered
    "strong", as they prevent any substitution from occurring. Consider the following
    example:'
  merge: -1
  img_proc: true
