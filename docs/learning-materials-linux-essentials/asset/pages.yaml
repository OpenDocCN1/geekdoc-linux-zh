- pgno: 201
  md: 'In the example, the less command after the pipe operator modifies the way that
    the file is displayed. The less command displays the text file allowing the user
    to scroll up and down a line at a time. less is also used by default to display
    the man pages, as discussed in the previous lessons.


    It is possible to use multiple pipes at the same time. The intermediate commands
    that receive input change and produce output are filters. Let''s take the ls -1
    command to count the number of words from the first 10 lines of the output. In
    order to do this, we will have to use the head command by default displays the
    first 10 lines of a file and then count the words using the wc command:


    ```

    $ ls -1 | head | wc -w

    10

    ```


    As mentioned earlier, by default, head only displays the first 10 lines of the
    text file specified. This behaviour can be modified by using specific options.
    Check the command''s man page to find more.


    There is another command that displays the end of a file: tail. By default, this
    command selects the last 10 lines and displays them, but as head the number can
    also be modified. Check tail''s man page for more details.


    > NOTE The -f option can show the lines of a file while it''s being updated. This
    feature can become very useful when monitoring a file like syslog for ongoing
    activity.


    The wc (word count) command counts by default the lines, words and bytes of a
    file. As shown in the exercise, the -w option causes the command to only count
    the words within the selected lines. The most common options that you can use
    with this command are: -1, which specifies to the command to only count the lines,
    and -c, which is used to count only the bytes. More variations and options of
    the command, as well as more information about wc can be found within the command''s
    man page.'
  merge: -1
  img_proc: true
