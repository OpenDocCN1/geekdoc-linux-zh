    Deleting large numbers of files or deep directory structures with many subdirectories
    may seem tedious, but it is actually easy. By default, rm only works on regular
    files. The -r option is used to override this behavior. Be careful, rm -r is an
    excellent foot gun! When you use the -r option, rm will not only delete any directories,
    but everything within that directory, including subdirectories and their contents.
    See for yourself how rm -r works:


    ```

    $ ls

