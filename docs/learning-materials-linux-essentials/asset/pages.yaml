  md: 'this, there were numerous attempts to convert the specific requirements from
    scientific work to digitized works of “art in the spirit of open source” into
    similarly hardy licenses.


    By the far most important initiative of this kind today Creative Commons (CC),
    which summarizes its concerns as follows:


    +   - Creative Commons is a global nonprofit organization that enables sharing
    and reuse of creativity and knowledge through the provision of free legal tools.

    - [https://creativecommons.org/faq#what-is-creative-commons-and-what-do-you-do](https://creativecommons.org/faq#what-is-creative-commons-and-what-do-you-do)


    With Creative Commons, the focus of rights assignment goes back from the distributor
    to the author. In traditional publishing, an author usually transfers all publishing
    rights (printing, translation, etc.) to a publisher, who in turn ensures the best
    possible distribution of the work. The significantly changed distribution channels
    of the Internet now put the author in a position to exercise many of these publishing
    rights herself and decide for how her work may be used. Creative Commons gives
    the opportunity to determine this simply and legally reliably, but Creative Commons
    wants more: authors are encouraged to make their works available as a general
    process of exchange and cooperation. Unlike traditional copyright, which gives
    the author all the rights that they can transfer to others as needed, the Creative
    Commons approach takes the opposite approach: the author makes her work available
    to the community, but can choose from a set of features that need to be considered
    when using the work — the more features she chooses, the more restrictive the
    license.


    And so the “Choose a License” principle of CC asks an author answer step by step
    for the individual properties and generates the recommended license, which the
    author can assign to the work as text and icon.


    For a better understanding, here is an overview of the six possible combinations
    and licenses offered by CC:


    # CC BY (“Attribution”)


    The free license allows anyone to edit and distribute the work as long as they
    name the author.


    # CC BY-SA (“Attribution-ShareAlike”)


    As CC BY, except that the modified work may only be distributed under the same
    license, the principle remains “inherited” here as well.


    # CC BY-ND (“Attribution-NoDerivatives”)


    Like CC BY, except that the work may only be passed on unmodified.'
