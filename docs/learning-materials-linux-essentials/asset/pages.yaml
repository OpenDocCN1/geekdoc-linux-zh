  md: '# Linux Essentials (Version 1.6) | 4.1 Choosing an Operating System


    develop what they think Linux should look like. As such we have hundreds of distributions.
    To view more Linux distributions you may choose to visit the Distro Watch Web
    Site, the maintainers of the website list the top 100 downloads of Linux distributions,
    allowing you to compare and see what is currently popular.


    # Linux Support Lifecycle


    As you might expect, enterprise Linux distributions have a longer support life
    than consumer or community editions of Linux. For example Red Hat Enterprise Linux
    has support for 10 years. Red Hat Enterprise 8 was launched in May 2019, while
    software updates and support are available until May 2029.


    Consumer editions will only have community support via forums. Software updates
    are often available for 3 releases. If we take Ubuntu as an example, at the time
    of writing 19.04 is the latest having updates through the release of 19.10 and
    stopping in January 2020. Ubuntu also supplies edition with long term support,
    known as LTS editions, which have 5 years of support from the original release.
    The current LTS version is 18.04 which will have software updates until 2023.
    These LTS versions make Ubuntu a possible option for enterprise with commercial
    support available from Canonical (the company behind the Ubuntu brand) or independent
    consulting firms.


    > NOTE Ubuntu distributions use date-based version numbers in the format YY.MM:
    For example, version 19.04 was released April 2019.


    # Linux as Your Desktop


    Using Linux as your desktop system may be more challenging in an enterprise where
    desktop support focuses on commercial operating system offerings. However it is
    not only the support that may prove challenging. An enterprise customer may also
    have made large investments in software solutions that tie them into specific
    desktop operating systems. Having said this, there are many examples of Linux
    desktops being integrated into large organizations with companies like Amazon
    even having their own Linux distribution Amazon Linux 2. This is used on their
    AWS cloud platform internally for both servers and desktops.


    Using Linux in a smaller business or at home becomes lot easier and can be a rewarding
    experience, removing the need for licensing and opening your eyes to the wealth
    of free and open source software that is available for Linux. You will also find
    that there are many different desktop environments available. The most common
    being Gnome and KDE, however many others exists. The decision comes down to personal
    preference.'
