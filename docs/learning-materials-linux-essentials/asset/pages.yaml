  md: '# Linux Essentials (Version 1.6) | 4.4 Your Computer on the Network


    When the resolver performs a name lookup, it first checks the /etc/hosts file
    to see if it contains an address for the requested name. If it does, it returns
    that address and does not contact the DNS. This allows network administrators
    to provide name resolution without having to go through the effort of configuration
    a complete DNS server. Each line in that file contains one IP address followed
    by one or more:


    ```

    127.0.0.1       localhost.localdomain localhost

    ::1              localhost.localdomain localhost

    192.168.0.10    server

    2001:db8:0abcd::f server

    ```


    To perform a lookup in the DNS, use the command host:


