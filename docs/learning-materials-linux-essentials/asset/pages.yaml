    # Open Source Definition and Permissive Licenses


    On the open source side, it is the Open Source Initiative (OSI), founded in 1998
    by Eric S Raymond and Bruce Perens, which is mainly concerned with licensing issues.
    It has also developed a standardized procedure for checking software licenses
    for compliance with its Open Source Definition. More than 80 recognized open source
    licenses can currently be found on the OSI website.


    Here they also list licenses “OSI-approved” that explicitly contradict the copyleft
    principle, especially the BSD licenses group. The Berkeley Software Distribution
    (BSD) is a variant of the Unix operating system originally developed at the University
    of Berkeley, which later gave rise to free projects such as NetBSD, FreeBSD and
    OpenBSD. The licenses underlying these projects are often referred to as permissive.
    In contrast to copyleft licenses, they do not have the aim of establishing the
    terms of use of modified variants. Rather, the maximum freedom should help the
    software to be as widely distributed as possible by leaving the editors of the
    software alone to decide how to proceed with the edits — whether, for example,
    they release or treat them as closed source and distribute them commercially.


    The 2-Clause BSD License, also called Simplified BSD License or FreeBSD License,
    proves how reduced such a permissive license can be. In addition to the standardized
    liability clause, which protects from liability claims arising from damage caused
    by the software, the license consists of only the following two rules:


    Redistribution and use in source and binary forms, with or without modification,
    are permitted that the following conditions are met:


    +   1. Redistributions of source code must retain the above copyright notice,
    this list of conditions and the following disclaimer.

    2. Redistributions in binary form must reproduce the above copyright notice, this
    list of conditions and the following disclaimer in the documentation and/or other
    materials provided with the distribution.


