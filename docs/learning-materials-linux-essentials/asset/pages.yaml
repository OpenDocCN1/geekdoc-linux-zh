- pgno: 81
  md: 'distribution, the default prompt may look a little different, but it usually
    follows this structure:


    ```

    username@hostname current_directory shell_type

    ```


    On Ubuntu or Debian GNU/Linux, the prompt for a regular user will likely look
    like this:


    ```

    carol@mycomputer:~$

    ```


    The superuser''s prompt will look like this:


    ```

    root@mycomputer:~#

    ```


    On CentOS or Red Hat Linux, the prompt for a regular user will instead look like
    this:


    ```

    [dave@mycomputer ~]$

    ```


    And the superuser''s prompt will look like this:


    ```

    [root@mycomputer ~]#

    ```


    Let''s explain each component of the structure:


    # username


    Name of the user that runs the shell


    # hostname


    Name of the host on which the shell runs. There is also a hostname, with which
    you can show or set the system''s host name.


    # current_directory


    The directory that the shell is currently in. A ~ means that the shell is in the
    current user''s home directory.


    # shell_type


    $ indicates the shell is run by a regular user.


    # indicates the shell is run by the superuser root.'
