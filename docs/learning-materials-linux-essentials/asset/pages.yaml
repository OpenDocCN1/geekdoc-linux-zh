    | Topic: | 1 The Linux Community and a Career in Open Source |

    | Objective: | 1.1 Linux Evolution and Popular Operating Systems |

    | Lesson: | 1 of 1 |


    # # Introduction


    Linux is one of the most popular operating systems. Its development was started
    in 1991 by Linus Torvalds. The operating system was inspired by Unix, another
    operating system developed in the 1970s by AT&T Laboratories. Unix was geared
    towards small computers. At the time,"small" computers were considered machines
    that don''t need an entire hall with air conditioning and cost less than one million
    dollars. Later, they were considered as machines that can be lifted by two people.
    At that time, an affordable Unix system was not readily available on computers
    such as office computers, which tended to be based on the x86 platform. Therefore
    Linux, who was a student by that time, started to implement a Unix-like operating
    system which was supposed to run on this platform.


    Mostly, Linux uses the same principles and basic ideas of Unix, but Linux itself
    doesn''t contain Unix code, as it is an independent project. Linux is not backed
    by an individual community but by an international community of programmers. As
    it is freely available, it can be used by anyone without restrictions.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Distributions


    A Linux distribution is a bundle that consists of a Linux kernel and a selection
    of applications that are maintained by a company or user community. A distribution''s
    goal is to optimize the kernel and the applications that run on the operating
    system for a certain use or user group. Distributions often include distribution-specific
    tools for software installation and system administration. This is why some distributions
    are mainly used for desktop environments where they need to be easy to use while
    others are mainly used on servers to use the available resources as efficiently
    as possible.


    Another way to classify distributions is by referring to the distribution family
    they belong to. Distributions of the Debian distribution family use the package
    manager dpkg to manage the software that is running on the operating system. Packages
    that can be installed with the package manager are maintained by voluntary members
    of the distribution''s community. Maintainers use the deb package format to specify
    how the software is installed on the operating system and how it is configured
    by default. Like a distribution, a package is a bundle of software and a corresponding
    configuration and documentation that makes it easier for the user to install,
    update and use the software.


    The Debian GNU/Linux distribution is the biggest distribution of the Debian family.
    The Debian GNU/Linux Project was launched by Ian Murdock in 1993. Today thousands
    of volunteers are working on the project. Debian GNU/Linux aims to provide a very
    reliable operating system. It also promotes Stallman''s vision of an operating
    system that respects the freedoms of the user to run, study, distribute and improve
    the software. This is why it provides any proprietary software by default.


    Ubuntu is another Debian-based distribution worth mentioning. Ubuntu was created
    by Mark Shuttlesworth and his team in 2004, with the mission to bring ease of
    use to Linux desktop environment and to cut the cost of professional services.
    The distribution has a scheduled release every six months with a long-term support
    release every 2 years.


    Red Hat is a Linux distribution developed and maintained by the identically named
    software company, which was acquired by IBM in 2019. The Red Hat Linux distribution
    was started in 1994 and re-branded in 2003 to Red Hat Enterprise Linux, often
    abbreviated as RHEL. It is provided to companies as a reliable enterprise solution
    that is supported by Red Hat and comes with software that to ease the use of Linux
    in professional server environments. Some of its components require fee-based
    subscriptions or licenses. The CentOS project uses the freely available source
    code of Red Hat Enterprise Linux and compiles it to a distribution which is available
    completely free of charge, but in return does not come with commercial support.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'Both RHEL and CentOS are optimized for use in server environments. The Fedora
    project was founded in 2003 and creates a Linux distribution which is aimed at
    desktop computers. Red Hat initiated and maintains the Fedora distribution ever.
    Fedora is very progressive and adopts new technologies very quickly and is sometimes
    considered a test-bed for new technologies later might be introduced in RHEL.
    All Red Hat distributions use the package format rpm.


    The company SUSE was founded in 1992 in Germany as a Unix service provider. The
    first version of SUSE Linux was launched in 1994. Over the years SUSE Linux became
    mostly known for its YaST configuration tool. This tool allows administrators
    to install and configure software and hardware, set up servers and networks. Similar
    to RHEL, SUSE releases Linux Enterprise Server, which is its commercial edition.
    This is less frequently released and suitable for enterprise and production deployment.
    It is deployed as a server as well as a desktop environment, with fit-for-purpose
    packages. In 2004, SUSE released the openSUSE project, which opened opportunities
    for developers and users to test and further develop the system. The openSUSE
    distribution is freely available to download.


    Independent distributions have been delev over the years. Some of them are based
    on Red Hat or Ubuntu, which are designed to improve a specific property of a system
    or hardware. There are distributions built with specific functionalities like
    Qubes, a very secure environment, or Kali Linux, which provides an environment
    for exploiting software vulnerabilities, mainly used by penetration testers. Recently
    very small Linux distributions are designed to specifically run in Linux containers,
    such as Docker. There are also distributions built specifically for components
    of embedded systems and even smart devices.


    # Embedded Systems


    Embedded systems are a combination of computer hardware and software designed
    to have a specific function within a larger system. Usually they are part of other
    devices and help control these devices. Embedded systems are used in automotive,
    medical and even military applications. Due to its wide variety of applications,
    a variety of operating systems based on the Linux kernel was developed in order
    to be used in embedded systems. A significant part of smart devices have a Linux
    kernel based system running on it.


    Therefore, with embedded systems come embedded software. The purpose of this software
    is to access the hardware and make it usable. The major advantages of Linux over
    any proprietary embedded software include cross vendor platform compatibility,
    development, support and no license fees. Two of the most popular embedded software
    projects are Android, which is mainly used on mobile phones across a variety of
    vendors and Raspian, which is mainly on Raspberry Pi.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Linux Essentials (Version 1.6) | Topic 1: The Linux Community and a Career
    in Open Source


    # Android


    Android is mainly a mobile operating system developed by Google. Android Inc.
    was founded in 2003 in Palo Alto, California. The company initially created an
    operating system meant to run on digital cameras. In 2005, Google bought Android
    Inc. and developed it to be one of the biggest operating systems.


    The base of Android is a modified version of the Linux kernel with additional
    open source software. The operating system is mainly developed for touchscreen
    devices, but Google has developed versions for TV and wrist watches. Different
    versions of Android have been developed for game consoles, digital cameras, as
    well as PCs.


    Android is freely available in open source as Android Open Source Project (AOSP).
    Google offers a series of proprietary components in addition to the open source
    core of Android. These components include applications such as Google Calendar,
    Google Maps, Google Mail, the Chrome browser as the Google Play Store which facilitates
    the easy installation of apps. Most users consider these tools integral part of
    their Android experience. Therefore all mobile devices shipped with Android in
    Europe and America include proprietary Google software.


    Android on embedded devices has many advantages. The operating system is intuitive
    and easy to use with a graphical user interface, it has a very wide developer
    community, therefore it is easy to help for development. It is also supported
    by the majority of the hardware vendors with Android driver, therefore it is easy
    and cost-effective to prototype any system.


    # Raspbian and the Raspberry Pi


    Raspberry Pi is a low cost, credit-card sized computer that can function as a
    full-functionality desktop computer, but it can be used within an embedded Linux
    system. It is developed by the Raspberry Pi Foundation, which is an educational
    charity based in UK. It has the purpose to teach young people to learn and understand
    the functionality of computers. The Raspberry Pi can be designed and programmed
    to perform desired tasks or operations that are part of a much more complex system.


    The specialties of the Raspberry Pi include a set of General Purpose Input-Output
    (GPIO) pins which can be used to attach electronic devices and extension boards.
    This allows using the Raspberry Pi as a platform for hardware development. Although
    it was intended for educational purposes, Raspberry Pis are used today in various
    DIY projects as for industrial prototyping developing embedded systems.


    The Raspberry Pi uses ARM processors. Various operating systems, including Linux,
    run on the Raspberry Pi. Since the Raspberry Pi does not contain a hard disk,
    the operating system is started from an SD memory card. One of the most prominent
    distributions for the Raspberry Pi is'
