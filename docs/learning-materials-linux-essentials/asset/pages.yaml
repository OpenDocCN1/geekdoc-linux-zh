    # Introduction


    No matter if you are using your computer system at home, at the university or
    within an enterprise, there still has to be a decision made on the operating system
    that you will use. This decision may be made by you, especially if it is your
    computer, but you may also be responsible for making the choice across systems
    in your business. As always, being well-informed about the choices available will
    aid you in making a responsible decision. In this lesson we aim to keep you informed
    of the operating system choices that you may be considering.


    # What is an Operating System


    One of the first things that we must be sure before we begin our journey in choosing
    an operating system is to understand what we mean by the term. The operating system
    lies at the heart of your computer and allows applications to run within and on
    top of it. Additionally, the operating system will contain drivers to access the
    computer''s hardware such as disks and partitions, screens, keyboards, network
    cards and so on. We often abbreviate operating system to simplify the OS. Today
    there are many operating systems available for both business usage as well as
    those looking for home. If we want to simplify the selection available to us,
    we can group selections as follows:'
