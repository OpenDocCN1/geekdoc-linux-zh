    # Introduction


    Compression is used to reduce the amount of space a specific set of data consumes.
    Compression is commonly used for reducing the amount of space that is needed to
    store a file. Another common way is to reduce the amount of data sent over a network
    connection.


    Compression works by replacing repetitive patterns in data. Suppose you have a
    novel. Some words are extremely common but have multiple characters, such as the
    word “the”. You could reduce the size of the novel significantly if you were to
    replace these common multi-character words and patterns with single character
    replacements. E.g., replace “the” with a greek letter that is not used elsewhere
    in the text. Data compression algorithms are similar to this but more complex.


    Compression comes in two varieties, lossless and lossy. Things compressed with
    a lossless algorithm cannot be decompressed back into their original form. Data
    compressed with a lossy algorithm are often used for images, video and audio where
    the quality loss is imperceptible to humans, irrelevant to the context, or the
    loss is worth the saved space or network throughput.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# Linux Essentials (Version 1.6) | 3.1 Archiving Files on the Command Line


    Archiving tools are used to bundle files and directories into a single file. Some
    common uses are backups, bundling software code, and data retention.


    Archive and compression are commonly used together. Some archiving tools even
    compress their contents by default. Others can optionally compress their contents.
    A few archive tools must be used in conjunction with stand-alone compression tools
    if you wish to compress the contents.


    The most common tool for archiving files on Linux systems is `tar`. Most Linux
    distributions ship with the GNU version of tar, so it is the one that will be
    covered in this lesson. tar on its own manages the archiving of files but does
    not compress them.


    There are lots of compression tools available on Linux. Some lossless ones are
    bzip2, gzip, and xz. You will find all three on most systems. You may encounter
    an odd or very minimal system where xz or bzip is not installed. If you become
    a regular Linux user, you will likely encounter files compressed with all of three.
    All of them use different algorithms, so some have a trade off. If you use a high
    compression ratio, it will take longer to compress and decompress the file. This
    is because higher compression requires more work finding more complex patterns.
    All of these tools can but not create archives containing multiple files.


    Stand-alone compression tools aren''t typically available on Windows systems.
    Windows archiving and compression tools are usually bundled. Keep this in mind
    if you have Linux and Windows systems that need to share files.


    Linux systems also have tools for handling .zip files commonly used on Windows
    systems. They are called zip and unzip. These tools are not installed by default
    on all systems, so if you need to use them you may have to install them. Fortunately,
    they are typically found in distributions package repositories.


    # Compression Tools


    How much disk space is saved by compressing files depends on a few factors. The
    nature of the data you are compressing, the algorithm used to compress the data,
    and the compression level. Not all algorithms support different compression levels.


    Let''s start setting up some test files to compress:


    ```

    $ mkdir ~/linux_essentials-3.1

    $ cd ~/linux_essentials-3.1

    $ mkdir compression archiving

    $ cd compression

    ```


