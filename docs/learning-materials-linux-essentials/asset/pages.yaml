    # 2.2 Lesson 1


    | Certificate: | Linux Essentials |

    | --- | --- |

    | Version: | 1.6 |

    | Topic: | 2 Finding Your Way on a Linux System |

    | Objective: | 2.2 Using the Command Line to Get Help |

