    # # File and Directory Names


    File and directory names in Linux can contain lower case and upper case letters,
    numbers, spaces and special characters. However, since many special characters
    have a special meaning in the Linux shell, it is good practice to not use spaces
    or special characters when naming files or directories. Spaces, for example, need
    the escape character \ to be entered correctly:


    ```

    ``` cd Mission Statements ```

    ```


    Also, refer to the filename report2018.txt. Filenames can contain a suffix which
    comes after the period (.). Unlike Windows, this suffix has no special meaning
    in Linux; it is for human understanding. In our example .txt indicates to us that
    this is a plaintext file, although it could technically contain any kind of data.


    # # Navigating the Filesystem


    # # Getting Current Location


    Since Linux shells such Bash are text-based, it is important to remember your
    current location when navigating the filesystem. The command prompt provides this
    information:


    ```

    ``` user@hostname ~/Documents/Reports $ ```

    ```


    Note that information such as user and hostname will be covered in future sections.
    From the prompt, we now know our current location is in the Reports directory.
    Similarly, the command pwd will print working directory:


    ```

    ``` user@hostname ~/Documents/Reports $ pwd /home/user/Documents/Reports ```

    ```'
