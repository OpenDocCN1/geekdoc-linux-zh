    creating: dir/

    extracting: dir/file1

    extracting: dir/file2

    $ find

    ./zipfile.zip

    ./dir

    ./dir/file1

    ./dir/file2

    ```


    When adding directories to ZIP files, the -r option causes zip to include a directory''s
    contents. Without it, you would have an empty directory in the ZIP file.'
