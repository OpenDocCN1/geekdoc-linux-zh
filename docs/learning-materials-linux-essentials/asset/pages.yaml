    \ systems are either 32-bit or 64-bit. If an application needs access to more\
    \ than 4 gigabytes of memory it must run on a 64-bit system since 4 gigabytes\
    \ is the maximum address that can be represented using 32 bits. While 32-bit applications\
    \ can typically run on 64-bit systems, 64-bit applications cannot run on 32-bit\
    \ systems."
