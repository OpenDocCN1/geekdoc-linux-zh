    # Log Rotation


    Log files can grow large over a few weeks or months and take up all free disk
    space. To tackle this, the utility logrotate is used. It implements log rotation
    or cycling which implies actions such as moving files to a new name, archiving
    and/or compressing them, sometimes emailing them to the sysadmin and eventually
    deleting them as they grow. The conventions used for naming rotated log files
    are diverse (adding a suffix with the date, for example); however, simply adding
    a suffix with an integer means:


    ```

    # 1 ls /var/log/apache2/

    access.log error.log error.log.1 error.log.2 other_vhosts_access.log

    ```


    Note error.log.2 has already been compressed with gzip (hence the .gz suffix).


    # The Kernel Ring Buffer


    The kernel ring buffer is a fixed-size data structure that records kernel boot
    messages as well as any kernel messages. The function of this buffer—a very important
    one—is that logging all the kernel messages produced on boot—when syslog is not
    available. The dmesg command prints the ring buffer (which could also be stored
    in /var/log/dmesg). Because of the extension of the ring buffer, this command
    is normally used in combination with the text utility grep or a pager as such.
    For instance, to search for boot messages:


    ```

    $ dmesg | grep boot

    [ 0.000000] Command line: BOOT_IMAGE=/boot/mlinux-4.9.0-amd64 root=UUID=5216e1e4-4ae0-

    441f-b8f5-0061c034c74 ro riot

    [ 0.000000] Swapping: 1 CPUs, 0 hotplug CPUs

    ```


