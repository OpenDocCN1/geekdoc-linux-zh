- pgno: 409
  md: 'However, she does have to member of the group in order to transfer the file''s
    group ownership to

    that group.


    User or group can be omitted if you do not wish to change them. So, to change
    just the group

    owning a file you would chown :students text.txt. To change just the user, the
    command

    would be chown carol text.txt. Alternatively, you could use the command chgrp
    students

    text.txt to change only the group.


    Unless you are the system administrator (root), you cannot change ownership of
    a file owned by

    other user or a group that you don''t belong to. If you try to do this, you will
    get the error

    message Operation not permitted.


    # Querying Groups


    Before changing the ownership of a file, it might be useful to know which groups
    exist on

    tystem, which users are members of a group and to which groups a user belongs.
    Those tasks can

    be accomplished with two commands, groups and groupmems.


    To see which groups exist on your system, simply type groups:


    ```

    $ groups

    carol students cdrom sudo dip plugdev ladmin sambashare

    ```


    And if you want to know which groups a user belongs, add the username as a parameter:


    ```

    $ groups carol

    carol : carol students cdrom sudo dip plugdev ladmin sambashare

    ```


    To do the reverse, displaying which users belong to a group, use groupmems. The
    parameter -g

    specifies the group, and -l will list all of its members:


    ```

    $ sudo groupmems -g cdrom -l

    carol

    ```


    groupmems can only be run as root, the system administrator. If you are not currently

    logged in as root, add sudo before the command.'
