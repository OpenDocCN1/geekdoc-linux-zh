  md: '# Linux Essentials (Version 1.6) | Topic 4: The Linux Operating System


    # Sockets


    A socket is a communication endpoint for two programs talking to each other. If
    the socket is connected over a network, the programs can run on different devices,
    such as a web browser running on a user''s laptop and a web server running in
    a company''s data center.


    There are three main types of sockets:


    # Unix Sockets


    Which connect processes running on the same device.


    # UDP (User Datagram Protocol) Sockets


    Which connect applications using a protocol which is fast but not resilient.


    # TCP (Transmission Control Protocol) Sockets


    Which are more reliable than UDP sockets and, for example, confirm the receipt
    of the data.


    Unix sockets can only connect applications running on the same device. TCP and
    UDP allow for a stream of data that always arrives in the exact order it was sent.
    UDP is more fire and forget; the packet is sent but its delivery at the other
    end is not guaranteed. UDP does offer lack the overhead of TCP, making it perfect
    for low latency applications such as online video.


    TCP and UDP both use ports to address multiple sockets on the same IP address.
    While the source port for a connection is usually random, target ports are standardized
    for a specific service. HTTP is, for example, usually hosted at port 80, HTTPS
    is run on port 443. SSH, a protocol to securely log into a remote Linux system,
    on port 22.


    The ss command allows an administrator to investigate all of the sockets on a
    Linux computer. It shows everything from the source address, destination address
    and type. One of its best features is the use of filters so a user can monitor
    the sockets in whatever connection state they would like. It can run with a set
    of options or as a filter expression to limit the information shown.


    When executed without any options, the command shows a list of all established
    sockets. Using the -p option includes information on the process using each socket.
    The -s option shows a summary of sockets. There are many more options available
    for this but the last set of ones are -4 and -6 for narrowing down the IP protocol
    to either IPv4 or IPv6, -t and -u allow the administrator to select TCP or UDP
    sockets and -1 to show only socket which listen for new connections.


    The following command, for example, lists all sockets currently in use:'
