    The tar program can also manage compression and decompression of archives on the
    fly. tar does so by calling one of the compression tools discussed earlier in
    this section. It is as simple as adding the option appropriate to the compression
    algorithm. The most commonly used are j, z, and for bzip2, xz and gzip, respectively.
    Below are examples using the aforementioned algorithms:


    ```

    $ cd ~/linux_essentials-3.1/compression

