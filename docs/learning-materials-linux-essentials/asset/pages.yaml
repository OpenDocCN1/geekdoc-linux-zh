- pgno: 124
  md: 'The relationship of directories is represented with a forward slash (/). We
    know that Reports is a subdirectory of Documents, which is a subdirectory of user,
    which is located in a directory called home. home doesn not seem to have a parent
    directory, but that is not true at all. The parent of home is called root, and
    is represented by the first slash (/). We will discuss the root directory in a
    later section.


    Notice that the output of the pwd command differs slightly from the path given
    on the command prompt. Instead of /home/user, the command prompt contains a tilde
    (~). The this is a special character that represents the user''s home directory.
    This will be covered in more detail in the next lesson.


    # Listing Directory Contents


    The contents of the current directory are listed with the ls command:


    ```

    user@hostname ~/Documents/Reports $ ls

    report2018.txt

    ```


    Note that ls provides no information about the parent directory. Similarly, by
    default ls does not show any information about contents of subdirectories. ls
    can only “see” what is in the current directory.


    # Changing Current Directory


    Navigation in Linux is primarily done with the cd command. This changes directory.
    Using the pwd command from before, we know our current directory is /home/user/Documents/Reports.
    We can change our current directory by entering a new path:


    ```

    user@hostname ~ cd /home/user/Documents

    user@hostname ~/Documents $ pwd

    /home/user/Documents

    user@hostname ~/Documents $ ls

    Mission-Statement.txt Reports

    ```


    From our new location, we can “see” Mission-Statement.txt and our subdirectory
    Reports, but not the contents of our subdirectory. We can navigate back into Reports
    like this:


    ```

    user@hostname ~/Documents cd Reports

    user@hostname ~/Documents/Reports $ pwd

    /home/user/Documents/Reports

    ```'
