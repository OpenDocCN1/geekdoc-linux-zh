- pgno: 248
  md: '# Linux Essentials (Version 1.6) | Topic 3: The Power of the Command Line


    ```

    Animal

    $ echo $?

    0

    ```


    ```

    $ echo 4n1 | grep "^[A-Za-z]*$"

    $ echo $?

    1

    ```


    The ^ and the $ indicate the beginning and end of the line respectively. The [A-Za-z]
    indicates a range of letters, upper or lower case. The * is a quantifier, and
    modifies our range of letters so that we are matching zero to many letters. In
    summary, our grep will succeed if the input is only letters, and false otherwise.


    The next thing to note is that grep is returning exit codes based on whether there
    a match or not. A positive match returns 0, and a no match returns 1. We can use
    this to test our arguments inside our script.


    ```

    1 #!/bin/bash

    2

    3 # a friendly script to greet users

    4

    5 if [ #-eq 0 ]

    6 then

    7 echo "Please enter at least one user to greet."

    8 exit 1

    9 else

    10 for username in $@

    11 do

    12 echo $username | grep "^[A-Za-z]*$" /dev/null

    13 if [ $ -eq 1 ]

    14 then

    15 echo "ERROR: Names must contain only letters."

    16 exit 2

    17 else

    18 echo "Hello $username"

    19 fi

    20 done

    21 exit 0

    22 fi

    ```


    On line 12, we are redirecting standard output to /dev/null, which is a simple
    way to suppress it.'
  merge: -1
  img_proc: true
