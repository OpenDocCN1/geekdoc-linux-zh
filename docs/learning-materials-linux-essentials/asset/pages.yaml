- pgno: 210
  md: '# [^abcABC]


    Match any one character except the ones in the brackets


    # [a-z]


    Match any character in the range


    # [a-z]


    Match any character except the ones in the range


    # sun |moon


    Find either of the listed strings


    # ^


    Start of a line


    # $


    End of a line


    All functionalities of the regular expressions can be implemented through grep
    as well. You can see in the example above, the word is not surrounded by double
    quotes. To prevent the shell from interpreting the meta-character itself, it is
    recommended that the more complex pattern be between double quotes (""). For the
    purpose of practice, we will be using double quotes when implementing regular
    expressions. The other quotation marks keep their normal functionality, as discussed
    in previous lessons.


    The following examples emphasize the functionality of the regular expressions.
    We will need data within the file, therefore the next set of commands appends
    different strings to the .txt file.


    ```

    $ echo "aaabb1" > text.txt

    $ echo "abab2" >> text.txt

    $ echo "noone2" >> text.txt

    $ echo "class1" >> text.txt

    $ echo "alien2" >> text.txt

    $ cat text.txt

    aaabbb1

    abab2

    noone2

    class1

    alien2

    ```'
