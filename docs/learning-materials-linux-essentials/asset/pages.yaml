    services take care of their own logs (take — example — the Apache HTTP web server).
    Likewise, the Linux kernel uses an in-memory ring buffer for storing its log messages.


    # Log Files in /var/log


    Because logs are data that varies over time, they are normally found in /var/log.


    If you explore /var/log, you will realize that the names of logs are —to a certain
    degree —quite self-explanatory. Some examples include:


    # /var/log/auth.log


    It stores information about authentication.


    # /var/log/kern.log


    It stores kernel information.


    # /var/log/syslog


    It stores system information.


    # /var/log/messages


    It stores system and application data.


    > NOTE

    The exact name and contents of log files may vary across Linux distributions.


