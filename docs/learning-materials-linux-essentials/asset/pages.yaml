- pgno: 169
  md: '# Summary


    The Linux command line environment provides tools to manage files. Some commonly
    used ones are cp, mv, mkdir, rm, and rmdir. These tools, combined with globs,
    allow users to get a lot of work done very quickly.


    Many commands have a -i option, which prompts you before doing anything. Prompting
    save you a lot of hassle if you mistyped something.


    A lot of commands have a -r option. The -r option usually means recursion. In
    mathematics and computer science, a recursive function is a function using itself
    in its definition. When it comes to command lines, it usually apply the command
    to a directory and everything in it.


    Commands used in this lesson:


    +   cat

    Read and output the contents of a file.

    cp

    Copy files or directories.

    echo

    Output a string.

    find

    Traverse a file system tree and search for files matching a specific set of criteria.

    ls

    Output properties of files and directories and list a directory''s contents.

    mkdir

    Create new directories.

    mv

    Move or rename files or directories.

    pwd

    Output the current working directory.

    rm

    Delete files or directories.'
