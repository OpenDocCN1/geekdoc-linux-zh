    # Introduction


    The command line is a very complex tool. Each command has its own unique options,
    documentation is key when working with a Linux system. Besides the `/usr/share/doc/`
    directory, which stores most of the documentation, other various tools provide
    information on using Linux commands. This chapter focuses on methods to access
    that documentation, with the purpose of getting help.


    There are a multitude of methods to get help within the Linux command line. `man`,
    `help` and `info` are just a few of them. For Linux Essentials, we will be focusing
    on `man` and `info` as they are the most commonly used tools for obtaining help.


    Another topic of this chapter will be locating files. You will mainly work with
    the `locate` command.


    # Getting Help on the Command Line'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# Built-in Help


    When started with the --help parameter, most commands display some brief instructions
    about their usage. Although not all commands provide this switch, it is still
    a good first try to learn about the parameters of a command. Be aware that the
    instructions from --help often rather brief compared to the other sources of documentation
    which we will discuss in the rest of this lesson.


    # Man Pages


    Most commands provide a manual page or “man” page. This documentation is usually
    installed with the software and can be accessed with the man command. The command
    whose man page should be displayed is added to man as an argument:


    ```

    $ mkdir

    ```


    This command opens the man page for mkdir. You can use the up and down arrow keys
    or the space bar to navigate through the man page. To exit the man page, press
    q.


    Each man page is divided in maximum of 11 sections, though many of these sections
    are optional:


    | Section | Description |

    | --- | --- |

    | NAME | Command name and brief description |

    | SYNOPSIS | Description of the command''s syntax |

    | DESCRIPTION | Description of the effects of the command |

    | OPTIONS | Available options |

    | ARGUMENTS | Available arguments |

    | FILES | Auxiliary files |

    | EXAMPLES | A sample of the command line |

    | SEE ALSO | Cross-references to the related commands |

    | DIAGNOSTICS | Warning and Error messages |

    | COPYRIGHT | Author(s) of the command |

    | BUGS | Any known limitations of the command |


    In practice, most man pages don''t contain all of these parts.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Linux Essentials (Version 1.6) | Topic 2: Finding Your Way on a Linux System


    Man pages are organized in eight categories, numbered from 1 to 8:


    | Category | Description |

    | 1 | User command |

    | 2 | System calls |

    | 3 | Functions of the C library |

    | 4 | Drivers and device files |

    | 5 | Configuration files and file formats |

    | 6 | Games |

    | 7 | Miscellaneous |

    | 8 | System administrator commands |

    | 9 | Kernel functions (not standard) |


    Each man page belongs to exactly one category. However, multiple categories can
    contain pages with the same name. Let''s take the `passwd` command as an example.
    This can be used to change a user''s password. Since `passwd` is a user command,
    its man page resides in category 1. In addition to the `passwd` command, the database
    file `/etc/passwd` also has a page which is called `passwd`, too. As this file
    is a configuration file, it belongs to category 5. When referring to a man page,
    the category is often added to the name of the man page, as in `passwd(1)` or
    `passwd(5)` to identify the respective man page.


    By default, man `passwd` displays the first available man page, in this case `passwd(1)`.
    The category of the desired man page can be specified in a command such as `man
    1 passwd` or `man 5 passwd`.


    We have already discussed how to navigate through a man page and how to return
    to the command line. Internally, man uses `less` to display the page''s content.
    `less` lets you search for text within a man page. To search for the linux you
    can just use `/` for forward searching from the point that you are, or `?` to
    start a backward search. This action highlights the matching results and moves
    the page to the first highlighted match. In both cases you can type `n` to jump
    to the next match. In order to find more information about these additional features,
    press `h` and a menu with all the information will be displayed.


    # Info Pages


    Another tool that will help you working with the Linux system is the info pages.
    The info'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'pages are usually more detailed than the man pages and are formatted in hypertext,
    similar to web pages on the Internet.


    The info pages can be displayed like so:


    ```

    $ info mkdir

    ```


    For each info page, info reads an info file that is structured into individual
    nodes within a tree. Each node contains hyperlinks and the info command contains
    that can help you move from one to the other. You can access the link by pressing
    while placing the cursor on one of the leading asterisks.


    Similar to man, the info tool also has page navigation commands. You can find
    out more about these commands by pressing while being on the info page. This tool
    contains you. These tools will help you navigate the page easier as well as understand
    how to access the nodes and move within the node tree.


    # The /usr/share/doc/ directory


    As mentioned before, the /usr/share/doc/ directory stores most documentation of
    the commands that the system is using. The name of the directory is usually the
    name of the package and occasionally its version. These directories include a
    README or readme.txt file that contains the package''s basic documentation. Alongside
    the README file, the folder can also contain other documentation files, such as
    the changelog which includes the history of the program in detail, or examples
    of configuration files for the specific package.


    The information in the README file varies from one package to another. All files
    are written in plain text, therefore they can be read with any preferred text
    editor. The exact kind and number of files depend on the package. Check some of
    the directories to get an overview of their contents.


    # Locating files


    # The locate command


    A Linux system is built from numerous directories and files. Linux has many tools
    to locate a particular file within a system. The quickest one is the command locate.


    locate searches within a database and then outputs every name that matches the
    given string:


    ```

    $ locate note

    ```'
  merge: -1
  img_proc: true
- pgno: 110
  md: '```

    /lib/udev/keymaps/zepto-znote

    /usr/bin/zipnote

    /usr/share/doc/initramfs-tools/maintainer-notes.html

    /usr/share/man/man1/zipnote.1.gz

    ```


    The locate command supports the usage of wildcards and regular expressions as
    well, therefore the search string does not have to match the entire name of the
    desired file. You will learn more about regular expressions in a later chapter.


    By default, locate behaves as if the pattern would be surrounded by asterisks,
    so locate PATTERN is the same as locate *PATTERN*. This allows you to provide
    substrings instead of the exact filename. You can modify this behavior with the
    different options that you can find explained in the locate man page.


    Because locate is reading from a database, you may not find a file that you recently
    created. The database is managed by a program named updatedb. Usually it is run
    periodically, but if you have root privileges and you need the database to be
    updated immediately, you can run updatedb yourself at any time.


    # The find command


    find is another very popular tool that is used to search for files. This command
    has a different approach, compared to the locate command. find command searches
    a directory recursively, including its subdirectories. find does such search at
    every invocation, it does not maintain a database like locate. Similar to locate,
    find also supports wildcards and regular expressions.


    find requires at least the path it should search. Furthermore, so-called expressions
    can be added to provide filter criteria for which files to display. An example
    is the -name expression, which looks for files with a specific name:


    ```

    $ cd Downloads

    ~/Downloads

    $ find -name thesis.pdf

    ./thesis.pdf

    ~/Downloads

    $ find ~ -name thesis.pdf

    /home/carol/Downloads/thesis.pdf

    ```


    The first find command searches for the file within the current Downloads directory,
    whereas the second one searches for the file in the user''s home directory.'
  merge: -1
  img_proc: true
