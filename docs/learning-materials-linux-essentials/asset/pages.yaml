    # Configuration Files in HOME (Dotfiles)


    At user level, programs store their configurations and settings in hidden files
    in the user''s home directory (also represented ~). Remember, hidden files start
    with a dot (.).—hence their name: dotfiles.


    Some of these are Bash scripts that customize the user''s shell session and are
    sourced as soon as the user logs into the system:


    # .bash_history


    It stores the command line history.


    # .bash_logout


    It includes commands to execute when leaving the login shell.


    # .bashrc


    Bash''s initialization script for non-login shells.


    # .profile


    Bash''s initialization script for login shells.


    > NOTE Refer to the lesson on “Command Line Basics” to learn more about Bash and
    its init files.


    Other user-specific programs'' config files get sourced when their respective
    programs are started .gitconfig, .emacs.d, .ssh, etc.


    # The Linux Kernel


    Before any process can run, the kernel must be loaded into a protected area of
    memory. After that, the process with PID 1 (often not than systemd nowadays) sets
    off the chain of processes, that is to say, one process starts other(s) and so
    on. Once the processes are active, the Linux kernel is in charge of allocating
    resources to them (keyboard, mouse, disk, memory, network interfaces, etc).


    > NOTE Prior to systemd, /sbin/init was always the first process in a Linux system
    as part of the System V Init system manager. In fact, you still find /sbin/init'
