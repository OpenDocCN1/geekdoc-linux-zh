    browser are tracked and analyzed by various parties. Securing access to internet
    services and preventing tracking is an important aspect of parties using the internet
    in a safe manner.


    # Cookie Tracking


    Let''s assume you have browsed an e-commerce website, selected a product you wanted
    and placed in the shopping cart. But at the last second, you have decided to give
    it a second thought and think a little longer you really needed it. After a while,
    you start seeing ads of that same product following you around the web. When clicking
    on the ads, you are immediately sent to the product page of that store shopping
    cart are still there, waiting for you to decide to check them out. Have you ever
    wondered how they do? How they show you the right ad at another web page? The
    answer for these questions is called cookie tracking.


    Cookies are small files a website can save on your computer in order to store
    and retrieve some kind of information that can be useful for your navigation.
    They have been in for many years and are one of the oldest ways to store data
    on the client side. One good example of this is unique shopping cart IDs. That
    way, if you come back to the same website in a few days, the store can remember
    the products you''ve placed in your cart during your last visit and save you the
    time to find them.


    That''s usually okay, since the website is offering you useful feature and not
    sharing any data with third parties. But what about the ads that are shown to
    you while you surf on other web pages? That''s where the ad networks come in.
    Ad networks are companies that offer ads for ecommerce sites like the one in our
    example on one side, and monetization for websites, on the other side. Content
    creators like bloggers, for example, can make some space available for those ad
