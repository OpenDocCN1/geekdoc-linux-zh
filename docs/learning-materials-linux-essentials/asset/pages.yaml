    # Understanding Permissions


    In the output of ls -l the file permissions are shown right after the filetype,
    as three groups of three characters each, in the order r, w and x. Here is what
    they mean. Keep in mind that a dash represents the lack of a particular permission.


    # Permissions on Files


    r


    Stands for read and has an octal value of 4 (don''t worry, we will discuss octals
    shortly). This means permission to open a file and read its contents.


    w


    Stands for write and has an octal value of 2. This means permission to edit or
    delete a file.


    x


    Stands for execute and has an octal value of 1. This means that the file can be
    run as an executable or script.


    So, for example, a file with permissions rw- can be read and written to, but cannot
    be executed.


    # Permissions on Directories'
