    # # Introduction


    In this lesson, we are going to look at tools that are used to manipulate text.
    These tools are frequently used by system administrators or programs to automatically
    monitor or identify specific recurring information.


    # # Searching within Files with grep


    The first tool that we will discuss in this lesson is the grep command. grep is
    the abbreviation of the phrase "global regular expression print" and its main
    functionality is to search within files for the specified pattern. The command
    outputs the line containing the specified pattern highlighted in red.


    ```

    $ grep bash /etc/passwd

    root:x:0:0:root:/bin/bash

    user:x:1001:1001:User,,,,/home/user:/bin/bash

    ```


    grep, as commands, can also be tweaked using options. Here are the most common
    ones:'
  merge: -1
