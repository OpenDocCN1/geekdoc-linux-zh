    ```


    > NOTE unset requires the name of the variable as an argument. Therefore you may
    not add $ to the name, as this would resolve the variable and pass the variable''s
    value to unset instead of the variable''s name.


    # Working with Global Variables


    To make a variable available to subprocesses, turn it from a local into an environment
