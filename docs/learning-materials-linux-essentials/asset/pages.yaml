- pgno: 399
  md: '# Linux Professional Institute


    # 5.3 Lesson 1


    | Certificate: | Linux Essentials |

    |---|---|

    | Version: | 1.6 |

    | Topic: | 5 Security and File Permissions |

    | Objective: | 5.3 Managing File Permissions and Ownership |

    | Lesson: | 1 of 1 |


    # Introduction


    Being a multi-user system, Linux needs some way to track who owns each file and
    whether or not a user is allowed to perform actions on that. This is to ensure
    the privacy of users who might want to keep the content of their files confidential,
    as well as ensure collaboration by making certain files accessible to multiple
    users.


    This is done through a three-level permissions system: every file on disk is owned
    by a user and a user group and has sets of permissions: one for its owner, one
    group who owns the file and one for everyone else. In this lesson, you will learn
    how to query the permissions for a file and how to manipulate them.


    # Querying Information about Files and Directories


