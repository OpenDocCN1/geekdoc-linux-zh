- pgno: 141
  md: '# ls -lh


    Combining long list with human readable file sizes will give us useful suffixes
    such as M for megabytes or K for kilobytes.


    # ls -d */


    The -d option will list directories but not their contents. Combining this with
    /* will show only subdirectories and no files.


    # ls -lt


    Combines long list with the option to sort by modification time. The files with
    the most recent changes will be at the top, and files with the oldest changes
    will be at the bottom. This order can be reversed with:


    # ls -lrt


    Combines long list with sort by (modification) time, combined with -r reverses
    the sort. Now files with the most recent changes are at the bottom of the list.
    In addition to sorting by modification time, files can also be sorted by access
    time or by status time.


    # ls -lx


    Combines long list with the option to sort by file extension. This will, for example,
    group all files with .txt together, all files with .jpg together, and so on.


    # ls -S


    The -S sorts by file size, much in the same way as -t and X sort by time and extension
    respectively. The largest files come first, and smallest last. Note that the contents
    of subdirectories are not included in the sort.


    # ls -R


    The -R option will modify the ls command to display a recursive list. What does
    this mean?


    # Recursion in Bash


    Recursion refers to a situation where "something" is defined in terms of itself


    ```

    $ ls ~~

    Documents

    ```


    We know from before that user has a home directory, and in this directory there
    is one'
