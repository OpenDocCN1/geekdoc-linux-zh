    Some accounts have a login shell, while others do not for security purposes they
    require interactive access. The default shell on most Linux distributions is the
    Bourne Again Shell, or bash, but other shells may be available, like the C Shell
    (csh), Korn shell (ksh) or Z shell (zsh), to name a few.


