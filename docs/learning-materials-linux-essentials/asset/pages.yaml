- pgno: 369
  md: 'and hash string stored.


    # $S$0123456789ABC$012...


    An “enabled” account, with a hash function, hash salt and hash string stored.


    The hash function, hash salt and hash string are preceded and delimited by a dollar
    symbol ($). The hash salt length must be between eight and sixteen (8-16) characters.
    Examples of the three most common are as follows:


    # $S$012345675ABC...


    A hash function of MD5 (1), with an example hash length of eight.


    # $S$01234567ABCDS$012...


    A hash function of SHA256 (5), with an example hash length of twelve.


    # $S$01234567ABCDS$012...


    A hash function of SHA512 (6), with an example hash length of twelve.


    > The MD5 hash function is considered cryptographically insecure with today’s
    (2010s and later) level of ASIC and even general computing SIMD performance. E.g.,
    the US Federal Information Processing Standards (FIPS) does not allow MD5 to be
    used for any cryptographic functions, only very limited aspects of validation,
    but not the integrity of digital signatures or similar purposes.


    NOTE


    From the standpoint of the LPI Essentials objectives and exam, just understand
    the password hash for a local user is only stored in the file /etc/shadow which
    only select, authentication services can read, or the superuser can modify via
    other commands.'
