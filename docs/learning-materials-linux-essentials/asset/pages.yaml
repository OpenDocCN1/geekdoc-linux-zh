    # The /dev Directory


    The device directory /dev contains device files (nodes) for all connected hardware
    devices. These device files are used as an interface between the devices and the
    processes using them. Each device file falls into one of two categories:


    # Block devices


    Are those in which data is read and written in blocks which can be individually
    addressed. Examples include hard disks (and their partitions, like /dev/sda1),
    USB flash drives, CDs, DVDs, etc.


    # Character devices


    Are those in which data is read and written sequentially one character at a time.
    Examples include keyboards, the text console (/dev/console), serial ports (such
    as /dev/ttyS0) and so on, etc.


    When listing device files, make sure you use ls with the -1 switch to differentiate
    between the two. We — for instance — check for hard disks and partitions:


    ```

    # ls -1 /dev/sd*

    brw-rw---- 1 root disk 8, 0 may 25 17:02 /dev/sda

    brw-rw---- 1 root disk 8, 1 may 25 17:02 /dev/sda1

    brw-rw---- 1 root disk 8, 2 may 25 17:02 /dev/sda2

    (...)

    ```


    Or for serial devices (TeleTYwriter):


    ```

    # ls -1 /dev/tty*

    cw-rw-rw- 1 root tty 5, 0 may 25 17:26 /dev/tty

    cw--w---- 1 root tty 4, 0 may 25 17:26 /dev/tty0

    cw--w---- 1 root tty 4, 1 may 25 17:26 /dev/tty1

    ...

    ```


    Notice how the first character b is for block devices and c for character devices.


    > The asterisk (*) is a globbing character than means 0 or more characters. Its
    importance in the ls -1 /dev/sd* and ls -1 /dev/tty* commands above. To learn
    more about these special characters, refer to the lesson on globbing.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Linux Essentials (Version 1.6) | Topic 4: The Linux Operating System


    Furthermore, /dev includes some special files which are quite useful for different
    programming purposes:


    /dev/zero


    It provides as many null characters as requested.


    /dev/null


    Aka bit bucket. It discards all information sent to it.


    /dev/urandom


    It generates pseudo-random numbers.


    # The /sys Directory


    The sys filesystem (sysfs) is mounted on /sys. It was introduced with the arrival
    of kernel 2.6 and meant a great improvement on /proc/sys.


    Processes need to interact with the devices in /dev and the kernel needs a directory
    which contains information about these hardware devices. This directory is /sys
    and its data is ordered into categories. For instance, to check on the MAC address
    of your network card (enp0s3), you would cat the following:


    ```

    $ cat /sys/class/net/enp0s3/address

    08:00:27:02:b2:74

    ```


    # Memory and Memory Types


    Basically, for a program to start running, it has to be loaded into memory. By
    and large, we speak of memory we refer to Random Access Memory (RAM) and — compared
    to mechanical hard disks — it has the advantage of being a lot faster. On the
    down side, it is volatile (i.e., once the computer shuts down, the data is gone).


    Notwithstanding the aforementioned — when it comes to memory — we can differentiate
    main types in a Linux system:


    # Physical memory


    Also known as RAM, comes in the form of chips made up of integrated circuits containing
    millions of transistors and capacitors. These, in turn, memory cells (the basic
    block of computer memory). Each of these cells has an associated hexadecimal code
    — a memory address — so that it can be referenced when needed.'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# Swap


    Also known as swap space, it is the portion of virtual memory that lives on the
    hard disk and is used when there is no more RAM available.


    On the other hand, there is the concept of virtual memory which is an abstraction
    of the total amount of usable, addressing memory (RAM, but also disk space) as
    seen by applications.


    free passes /proc/meminfo and displays the amount of free and used memory in the
    system in a very clear manner:


    | $ free | total | used | free | shared | buff/cache | available |

    |---|---|---|---|---|---|--|

    | Mem:| 4050960 | 1474960 | 1482260 | 96900 | 1093740 | 2246372 |

    | Swap: | 4192252 | 0 | 4192252 | | | |


    Let us explain the different columns:


    # total


    +   - Total amount of physical and swap memory installed.


    # used


    +   - Amount of physical and swap memory currently in use.


    # free


    +   - Amount of physical and swap memory currently not in use.


    # shared


    +   - Amount of physical memory used — mostly — by tmpfs.


    # buff/cache


    +   - Amount of physical memory currently in use by kernel buffers and the page
    cache and slabs.


    # available


    +   - Estimate of how much physical memory is available for new processes.


    By default free shows values in kibibytes, but allows for a variety of switches
    to display its units in different units of measurement. Some of these options
    include:


    # -b


    +   - Bytes.'
  merge: -1
  img_proc: true
