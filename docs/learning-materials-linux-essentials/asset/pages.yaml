  md: '# Linux Essentials (Version 1.6) | 5.3 Managing File Permissions and Ownership


    ```

    -rw-rw-rw- 1 carol 765 Dec 20 21:25 .text.txt

    ```


    Of course, it is possible to modify multiple permissions at the same time. In
    this case, separate them with a comma (,);


    ```

    $ chmod u+rwx,g-x text.txt

    $ ls -lh text.txt

    -rw-rw-rw- 1 carol 765 Dec 20 21:25 .text.txt

    ```


    The example above can be read as: "For the user (u), grant (+) read, write and
    execute (rwx) permissions, for the group (g) revoke (-), execute permissions (x)".


    When run on a directory, chmod modifies only the directory''s permissions. chmod
    has a recursive mode, useful when you want to change the permissions for “all
    files inside a directory and its subdirectories”. To use this, add the parameter
    -R after the command name and before the permissions to change, like so:


    ```

    $ chmod -R u+rwx Another_Directory/

    ```


    This command can be read as: "Recursively (-R), for the user (u), grant (+) read,
    write and execute (rwx permissions)".


    > Be careful and think twice before using the -R switch, it is easy to change
    permissions on files and directories which you do not want to change, especially
    on directories with a large number of files and sub-directories.


    # Numeric Mode


    In numeric mode, the permissions are specified in a different way: as a three-digit
    numeric value over octal notation, a base-8 numeric system.


    Each permission has a corresponding value, and they are specified in the following
    order: first comes read (r), which is 4, then write (w), which is 2 and last is
    execute (x), represented by 1. If there is no permission, use the value zero (0).
    So, a permission of rwx would be 7 (4+2+1) and r-x would be 5 (4+0+1).


    The first of the three digits on the permission set represents the permissions
    for the user (u), the second for the group (g) and the third for the others (o).
    If we wanted to set the permissions for a file to rw------, the octal value would


