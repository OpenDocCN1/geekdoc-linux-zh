- pgno: 82
  md: 'As we not need any special privileges, we will use an unprivileged prompt in
    the following examples. For brevity, we will just use the $ as prompt.


    # Command Line Structure


    Most commands at the command line follow the same structure:


    ```

    command [option(s)/parameter(s)...] [argument(s)...]

    ```


    Take the following command as an example:


    ```

    $ ls -1 /home

    ```


    Let''s explain the purpose of each component:


    # Command


    Program that the user will run - 1s in the above example.


    # Option(s)/Parameter(s)


    A "switch" that modifies the behavior of the command in some way, such as -1 in
    the above example. Options can be accessed in a short and in a long form. For
    example, -l is identical to --format=long.


    Multiple options can be combined as well and for the short form, the letters can
    usually be typed together. For example, the following commands all do the same:


    ```

    $ ls -al

    $ ls -a -l

    $ ls --all --format=long

    ```


    # Argument(s)


    Additional data that is required by the program, like a filename or path, such
    as /home in the above example.


    The only mandatory part of this structure is the command itself. In general, all
    other elements are optional, but a program may require certain options, parameters
    or arguments to be specified.


    Most commands display a short overview of available options when they are run
    with the --help parameter. We will learn additional ways to learn about'
  merge: -1
