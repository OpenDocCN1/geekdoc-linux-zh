    enterprises tend to also choose mature hardware components and build their services
    on stable software versions.


    # Consumer Grade Linux


    Distributions such as Ubuntu are more targeted for small business or hobbyist
    users. As such, they are also likely to be using the latest hardware found on
    consumer grade systems. These systems will need the latest drivers to make the
    most of the new hardware and the maturity of both the hardware and the drivers
    is unlikely to meet the needs of larger enterprises. For the consumer market,
    however, the latest kernel is exactly what is needed with the most modern drivers
    even if they are little tested. The newer kernels will have the latest drivers
    to support the very latest hardware that are likely to be in use. Especially with
    the development we see with Linux in the gaming market it is tremendously important
    that the latest drivers are available to these users.


    Some distributions like Ubuntu provide both consumer grade versions that contain
    recent software and receive updates for a shorter period of time, as well as so-called
    Long Term Support versions, LTS for short, which are more suited for enterprise
    environments.


    NOTE


    # Experimental and Hacker Linux Distributions


    Distributions such as Arch Linux or Gentoo Linux live on the cutting edge of technology.
    They contain the most recent versions of software, even if these versions contain
    bugs and untested features. In return, these distributions tend to use a releasing
    model which allows them to deliver updates at any time. These are used by advanced
    users who want to always receive the most recent software and are aware that functionality
    can break at any time and are able to repair their systems in such cases.


    In short, when considering Linux as your operating system, if you are using enterprise
    grade hardware on your servers or desktops then you can make use of either enterprise
    grade or consumer grade Linux distributions. If you are using consumer grade hardware
    and need to make the most of the latest hardware innovations then you are likely
    to need a similar Linux distribution to match the needs of the hardware.


    Some Linux distributions are related to each other. Ubuntu, for example, is based
    on Debian Linux and uses the same packaging system, DPKG. Fedora, as another example,
    is tested for RedHat Enterprise Linux, where potential features of RHEL versions
    can be explored ahead of their availability in the enterprise distribution.


    As well the distributions we have mentioned here there are many other Linux distributions.
    One advantage that we come with Linux being open source is that many people can'
