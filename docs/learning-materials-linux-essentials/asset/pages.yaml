    # Introduction


    All shells manage a set of status information throughout the shell sessions. This
    runtime information may change during the session and influences how the shell
    behaves. This data is also used by programs to determinate aspects of the system''s
    configuration. Most of this data is stored in so-called *variables*, which we
    will cover in this lesson.


    # Variables


    Variables are pieces of storage for data, such as text or numbers. Once set, a
    variable''s value can be accessed at a later time. Variables have a name which
    allows accessing a specific variable, even when the variable''s content changes.
    They are a very common tool in most programming languages.


    In Linux shells, there are two types of variables:


    # Local variables


    These variables are available to the current shell process only. If you create
    a local variable and then start another program from this shell, the variable
    is not accessible to that program'
  merge: -1
