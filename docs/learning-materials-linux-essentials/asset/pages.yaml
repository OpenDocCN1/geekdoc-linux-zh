- pgno: 94
  md: '# Linux Essentials (Version 1.6) | Topic 2: Finding Your Way on a Linux System


    anymore. Because they are not inherited by sub processes, these variables are
    called local variables.


    # Environment variables


    These variables are available both in a specific shell session and in sub processes
    spawned from that shell session. These variables can be used to pass configuration
    data to commands which are run. Because these programs can access these variables,
    they are called environment variables. The majority of the environment variables
    are in capital letters (e.g. PATH, DATE, USER). A set of default environment variables
    provide, for example, information about the user''s home directory or terminal
    type. The complete set of all environment variables is referred to as the environment.


    > NOTE: Variables are not persistent. When the shell where they were set is closed,
    all variables and their contents are lost. Shells provide configuration files
    that contain variables which are set whenever a new shell is started. Variables
    that should be set permanently must be added to one of these configuration files.


    # Manipulating Variables


    As a system administrator, you will need to create, modify or remove both local
    and environment variables.


    # Working with Local Variables


    You can set up a local variable by using the = (equal) operator. A simple assignment
    will create local variable:


    ```

    $ greeting=hello

    ```


    > NOTE: Don''t put any space before or after the = operator.


    You can display any variable using the echo command. The command usually displays
    the text in the argument section:


    ```

    $ echo greeting

    greeting

    ```


