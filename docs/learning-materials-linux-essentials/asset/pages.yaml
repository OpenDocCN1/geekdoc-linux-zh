    hostname. This option to w better matches the default output of the last command.


    +   3. Which file is the file that stores a user account''s one-way password hash?


    The file /etc/shadow stores a user account''s one-way password hash, since it
    is not readable by a regular, unprivileged user account, unlike file /etc/passwd.


    +   4. Which file contains the list of groups a user account is a member of? What
    logic could be used to compile a list of groups a user account is a member of?


    The file /etc/group is a CSV list of usernames in the last field, “members”, of
    any line for a group.


    Any line in the /etc/group where the user is listed in the final field, “members”,
    would mean the user is a member of that group—assuming it is correctly formatted
    (CSV delimited). Additionally, the user’s primary group membership in the /etc/passwd
    file will also have a matching entry in the /etc/group file for both the group
    name and GID.


