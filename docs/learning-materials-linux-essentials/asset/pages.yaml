- pgno: 138
  md: '# Linux Essentials (Version 1.6) | Topic 2: Finding Your Way on a Linux System


    Consider now what we know about Linux: it is similar to an apartment building,
    with many users residing in /home. So user ''s home will be different from user
    michael ''s home. To demonstrate this, we will use the command to switch user.


    ```

    user@hostname ~ $ pwd

    /home/user

    user@hostname ~ su - michael

    Password:

    michael@hostname ~ $ pwd

    /home/michael

    ```


    The meaning of ~ changes depending on who the user is. For michael, the absolute
    path of ~ is /home/michael. For lara, the absolute path of ~ is /home/lara, and
    so on.


    # Relative-to-Home File Paths


    Using ~ for commands is very convenient, provided that you do not switch users.
    We will consider the following example for user, who has begun a new session:


    ```

    $ ls

    Documents

    $ cd Documents

    $ ls

    Mission-Statement

    Reports

    $ cd Reports

    $ ls

    report2018.txt

    $ cd ~

    $ ls

    Documents

    ```


    Note that users will always begin a new session in their home directory. In this
    example, user has traveled into their Documents/Reports subdirectory, and with
    the cd ~ command they have returned to where they started. You can perform the
    same action by using the cd command with no arguments:


    ```

    $ cd Documents/Reports

    $ pwd

    /home/user/Documents/Reports

    ```'
