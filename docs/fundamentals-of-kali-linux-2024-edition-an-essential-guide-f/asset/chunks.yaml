    # 第 1 章


    ## Kali Linux 简介


    ***


    在第一章中，我们将深入 Kali Linux 的世界。它是网络安全和渗透测试领域最强大且广泛使用的 Linux 发行版之一。我们将涵盖从安装的基本要求到使用系统的第一步的所有内容，探索用户界面以及文件和目录的结构。准备好开启激动人心的网络安全之旅吧！


    ### Kali Linux 安装


    在开始探索 Kali Linux 的所有精彩功能之前，我们需要在系统中安装它。安装 Kali Linux 相对简单，根据你的需求和偏好可以通过多种方式完成。


    #### 硬件和软件要求


    在开始安装之前，检查硬件是否符合最低系统要求至关重要。Kali Linux 是一个强大的 Linux 发行版，需要足够的资源才能正常运行。基础硬件要求包括：


    - 处理器：`Intel i5` 或更高版本，或 AMD 对应。

    - 内存：`4GB RAM`（建议 8GB 或更多以获得最佳性能）。

    - 存储：至少 `20GB` 空闲磁盘空间。

    - 显卡：支持 `OpenGL 3.3` 或更高版本。


    此外，确保在安装过程中拥有稳定的互联网连接，因为某些步骤可能需要你下载额外的包。


    #### 安装方法


    有多种方法可以在你的系统中安装 Kali Linux：


    1. **在虚拟机 (VM) 上安装：** 安装 Kali Linux 最常用的方法之一是通过虚拟机。这允许你在虚拟化环境中运行 Kali Linux，而不会干扰你的主操作系统。`VirtualBox`、`VMware`
    和 `Hyper-V` 是创建虚拟机的流行软件。

    2. **裸机安装（主系统）：** 如果你想直接在硬件上安装 Kali Linux，可以在“裸机”系统上进行。这意味着 Kali Linux 将成为你电脑或笔记本电脑的主操作系统。这种方法更高级，可以完全替换现有的操作系统。

    3. **从 Live USB 运行：**另一种选项是创建一个 Kali Linux Live USB，它允许你直接从 USB 驱动器运行操作系统而无需安装。这对于快速测试或在不想永久安装的系统上使用
    Kali Linux 非常有用。


    选择最适合你的需求和技术水平的安装方法。


    ### 开始使用 Kali Linux


    现在 Kali Linux 已在你的系统中，是时候迈第一步并探索它的功能了。让我们从了解用户界面和理解文件与目录的基本结构开始。


    #### 用户界面导航


    当你启动 Kali Linux 时，会看到它的图形界面，这取决于安装期间选择的桌面环境。常见的桌面环境包括 `GNOME`、`KDE`、`Xfce` 和 `MATE`。


    在用户界面中，你会发现熟悉的元素，如任务栏、应用程序菜单和桌面图标。探索这些元素并熟悉界面布局以便于导航。


    #### 基础文件和目录结构


    与其他 Linux 系统一样，Kali Linux 遵循标准的文件和目录结构。以下是一些重要的目录及其用途：


    - `/bin`：包含系统启动和基本操作期间必需的可执行文件。

    - `/etc`：存储系统配置文件和已安装的应用程序。

    - `/home`：用户目录，每个用户都有自己的主文件夹。

    - `/var`：包含变量文件，如系统日志、打印队列和临时文件。

    - `/usr`：包含大多数系统文件，包括应用程序和共享库。

    - `/root`：root 用户（系统超级用户）的主目录。


    熟悉 Kali Linux 的文件和目录结构将对你导航和管理系统非常有帮助。


