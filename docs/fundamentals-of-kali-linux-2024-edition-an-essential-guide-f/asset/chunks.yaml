    ## Chapter 13


    Web Application Testing


    * * *


    In the vast field of cybersecurity, web application testing is a fundamental skill
    for students and professionals. Web applications are frequent targets of attacks
    due to their exposure on the internet and the criticality of the data they handle.
    This chapter provides a comprehensive overview of web application architecture,
    underlying protocols, essential testing tools, and methodologies for identifying
    and mitigating common vulnerabilities.


    Web Application Architecture


    The architecture of a web application is made up of several components that work
    together to provide functionality to end users. Understanding this architecture
    is crucial to performing effective security testing.


    Main Components


    1\. Cliente (Front-End):  The user interface of a web application, typically running
    in a browser, built using HTML, CSS, and JavaScript. The front end interacts with
    users and sends requests to the server.


    2\. Web Server:  Responsible for receiving customer requests and serving static
    or dynamic content. Examples of web servers include Apache, Nginx and Microsoft
    IIS.'
