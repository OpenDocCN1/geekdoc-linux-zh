    ## 3. Application Server: It processes business logic and can execute code in
    multiple languages, such as `PHP`, `Python`, `Java`, or `Node.js`. This server
    interacts with the database to store and retrieve data.


    ## 4. Database: Stores persistent application data, such as user, product, and
    transaction information. Examples of database management systems include `MySQL`,
    `PostgreSQL`, `MongoDB`, and `Oracle`.


    ## 5. API (Application Programming Interface): Allows communication between different
    parts of the application or with external services. APIs can be `RESTful`, `SOAP`,
    `GraphQL`, among others.


    ## Data flow


    When a user interacts with a web application, the data flow generally follows
    this path:


    1. `HTTP/HTTPS Request`: The client sends a request to the web server, using the
    `HTTP` or `HTTPS` protocol for secure communication.

    2. `Server Processing`: The web server forwards the request to the application
    server, which executes the business logic.

    3. `Interaction with the Database`: The application server queries or updates
    data in the database as needed.

    4. `Resposta HTTP/HTTPS`: The application server returns a response to the web
    server, which then sends it back to the client.


    ## HTTP/HTTPS Protocols and Web Application Framework


    ### HTTP/HTTPS


    `HTTP` (Hypertext Transfer Protocol) is the fundamental protocol used in communication
    between browsers and web servers. `HTTPS` is the secure version of `HTTP`, which
    uses `SSL/TLS` to encrypt communication, ensuring data confidentiality and integrity.


    ### HTTP Components


    - `HTTP Methods`: Indicators of the action to be performed on the request, such
    as `GET` (retrieve data), `POST` (send data), `PUT` (update data) and `DELETE`
    (remove data).

    - `URLs` (Uniform Resource Locators): Web resource identifiers.

    - `HTTP headers`: Contains metadata about the request or response, such as authentication
    information, content type, and cache settings.

    - `Message Body`: Transports the request or response data, used in methods such
    as `POST` and `PUT`.


    ### Web Application Framework


    Web applications are structured in a modular way to facilitate maintenance, scalability,
    and security. Common elements include:


    - `MVC` (Model-View-Controller): An architectural pattern that separates the application
    into three components: `Model` (data), `View` (user interface) and `Controller`
    (control logic).

    - `Microservices Architecture`: Divides the application into independent services,
    each responsible for a specific functionality. This improves scalability and makes
    it easier to implement security across each service in isolation.


    ## Tools and Methodologies


    To carry out security testing on web applications, it is essential to use the
    appropriate tools and follow structured methodologies.


    ### Tools


    #### Burp Suite


    Burp Suite is one of the most popular tools for web application security testing.
    It offers a range of features, including:


    - `Proxy Interceptador`: Allows you to capture and modify `HTTP/HTTPS` traffic
    between the browser and the server.

    - `Vulnerability Scanner`: Automates the detection of common vulnerabilities in
    web applications.

    - `Intruder`: Performs automated attacks, such as brute force and fuzzing.

    - `Repeater`: Allows you to manually submit and modify requests for specific tests.


    #### OWASP ZAP


    `OWASP ZAP` (Zed Attack Proxy) is a free and open source tool for security testing
    web applications. Features include:


    - `Proxy Interceptador`: Similar to Burp Suite, it allows you to capture and modify
    `HTTP/HTTPS` traffic.

    - `Spidering`: Automates web application navigation and mapping to identify entry
    points.

    - `Passive and Active Scanner`: Detects vulnerabilities without user interaction
    (passive) or by performing automated tests (active).

    - `Add-Ons`: Supports extensions that increase its capabilities, such as parsing
    `REST` and `SOAP` APIs.


    ### Methodologies


    Following a structured methodology is crucial to ensure that all areas of the
    application are tested and that vulnerabilities are identified and mitigated effectively.


    #### OWASP Testing Guide


    The `OWASP Testing Guide` is a fundamental reference that offers a complete framework
    for performing security testing on web applications. It covers several areas,
    including:


    - `Information Gathering`: Collection of information about the application and
    its environment.

    - `Configuration and Deployment Management Testing`: Verification of secure configurations
    and implementations.

    - `Identity Management Testing`: Authentication and identity management tests.

    - `Authentication Testing`: Verification of the security of authentication mechanisms.

    - `Authorization Testing`: Ensuring that access controls are correctly implemented.

    - `Session Management Testing`: Assessment of session management to identify vulnerabilities.

    - `Input Validation Testing`: Validation check and sanitation of user inputs.

    - `Error Handling`: Assessment of how the application handles errors and failures.

    - `Business Logic Testing`: Tests to identify flaws in the application''s business
    logic.

    - `Client-Side Testing`: Client-side security assessment, including scripts and
    validations.


    #### `NIST SP 800-115`


    `NIST SP 800-115` is a comprehensive guide to penetration testing published by
    the National Institute of Standards and Technology. It offers a framework for
    conducting penetration testing in a methodical manner, including:


    - `Planning`: Definition of objectives, scope and rules of engagement.

    - `Discovery`: Collection of information and identification of possible vulnerabilities.

    - `Attack`: Exploitation of identified vulnerabilities.

    - `Reporting`: Documentation of results and recommendations.


    ## Testes Comuns: SQL Injection, XSS, CSRF


    ### SQL Injection


    `SQL Injection` is a vulnerability that allows an attacker to interfere with SQL
    queries that the application makes to the database. A successful attack could
    result in unauthorized access to sensitive data, modification or destruction of
    data, or even complete compromise of the database server.


    #### Examples of SQL Injection Attacks


    1. `Vulnerability Detection`:


    ```sql

    '' OR ''1''=''1

    ```

    Entering `'' OR ''1''=''1''` into an input field can result in a query that is
    always true.


    2. `Data Extraction`:


    ```sql

    '' UNION SELECT username, password FROM users --

    ```

    Using the union technique (`UNION`), an attacker can extract sensitive data from
    the user table.


    ### XSS (Cross-Site Scripting)


    `XSS` is a vulnerability that allows an attacker to inject malicious scripts into
    web pages viewed by other users. There are three main types of `XSS`:


    1. `Reflected XSS`: The malicious script is reflected back to the user via a request.

    2. `Stored XSS`: The malicious script is stored on the server and displayed to
    all users who access the compromised page.

    3. `DOM-based XSS`: The malicious script runs on the client side, manipulating
    the Document Object Model (`DOM`).


    #### Examples of XSS Attacks


    1. `Reflected XSS`:


    ```html

    <script>alert(''XSS'');</script>

    ```

    Entering the above script into an input field may result in an alert being displayed
    to the user.

    2. `Stored XSS`: Inserting the malicious script into an input field that stores
    the value in the database and later displays it to other users.


    ### CSRF (Cross-Site Request Forgery)


    `CSRF` is a vulnerability that forces an authenticated user to perform unwanted
    actions in a web application in which they are authenticated. A `CSRF` attack
    can result in unauthorized actions such as money transfers, altering data, or
    changing settings.


    #### Examples of CSRF Attacks


    1. `Malicious Form`:


    ```html

    <form action="http://vulnerable-site.com/change-email" method="POST">

    <input type="hidden" name="email" value="attacker@example.com">

    <input type="submit">

    </form>

    ```

    The above form may be automatically submitted upon page load, resulting in the
    user''s email address changing.


    ## Best Practices for Mitigation


    ### SQL Injection


    - `Uso de Prepared Statements`: Use parameterized queries instead of concatenating
    SQL strings directly.

    - `Validation and Sanitation of Inputs`: Validate and sanitize all user input
    to prevent injection of malicious SQL commands.

