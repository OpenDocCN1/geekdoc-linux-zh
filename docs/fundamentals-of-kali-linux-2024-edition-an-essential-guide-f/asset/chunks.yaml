    ## 攻击示例：WEP, WPA/WPA2 破解


    ### 攻击 WEP 网络


    尽管 WEP 已经过时，但在某些网络中仍然可见。对 WEP 网络的典型攻击涉及以下步骤：


    1. 将接口设置为监听模式：

