    # 第 12 章


    ## 无线攻击


    在网络安全领域，理解并能够对无线网络进行攻击是识别和缓解漏洞的基本技能。本章将涵盖无线网络的基础，讨论 Wi-Fi 标准和协议，探索常见的漏洞，并介绍用于执行攻击的工具和技术。还将涵盖实际攻击示例，例如
    WEP 和 WPA/WPA2 破解。


    ### 无线网络基础


    无线网络（或 Wi-Fi）允许在不需要电缆的情况下通过无线电波传输数据。这些数据由配备 Wi-Fi 天线的设备发送和接收。无线网络无处不在并提供了极便利，但也带来了新的漏洞和安全挑战。


    ### 无线网络组件


    典型的无线网络包括以下组件：


    - **接入点 (AP)**：将无线设备连接到有线网络的设备，作为通信的中心。

    - **Wi-Fi 客户端**：连接到 AP 的设备，如笔记本电脑、智能手机和平板电脑。

    - **路由器**：它可能包含集成的 AP，在无线网络和互联网之间路由流量。


    ### 运行模式


    无线网络主要以两种模式运行：


    - **基础模式 (Infrastructure)**：客户端连接到 AP，由 AP 促进与其他设备和其他网络的通信。

    - **自性模式 (Ad-hoc)**：设备直接连接，没有中间 AP。


    ### Wi-Fi 标准和协议


    无线网络遵循由 `IEEE`（电气电子工程师学会）定义的标准和协议，特别是 `802.11` 系列。这些标准决定了设备如何通信，并确保了不同制造商之间的兼容性。


    #### 主要 Wi-Fi 标准


    - **802.11a**：在 5 GHz 频段工作，提供高达 54 Mbps 的速度。

    - **802.11b**：在 2.4 GHz 频段工作，提供高达 11 Mbps 的速度。

    - **802.11g**：同样在 2.4 GHz 频段工作，但速度提高到高达 54 Mbps。

    - **802.11n**：被称为 Wi-Fi 4，在 2.4 GHz 和 5 GHz 频段工作，使用 `MIMO`（多输入多输出）速度可达 600 Mbps。

    - **802.11ac**：被称为 Wi-Fi 5，主要在 5 GHz 频段工作，速度可以超过 1 Gbps。

    - **802.11ax**：被称为 Wi-Fi 6，在速度、容量和效率方面有显著改进，在 2.4 GHz 和 5 GHz 频段均运行。


    ### Wi-Fi 网络安全


    Wi-Fi 网络的安全性一直在演变，开发了多种协议来保护传输数据的完整性和机密性。


    - **WEP (有线等隐私)**：于 1997 年引入，是 Wi-Fi 的第一个安全协议。尽管这是安全性的首次尝试，但很快被发现存在许多加密缺陷，使其容易受到攻击。

    - **WPA (Wi-Fi 保护访问)**：于 2003 年引入作为 WEP 的改进，WPA 使用临时密钥完整性协议 (TKIP) 来修复 WEP 的一些关键漏洞。

    - **WPA2**：于 2004 年发布，WPA2 将 `TKIP` 替换为 `AES`（高级加密标准），提供了更稳健安全的加密。在 WPA3 出现之前，它是
    Wi-Fi 网络的安全标准。

    - **WPA3**：于 2018 年引入，WPA3 包含了多项安全改进，例如防止暴力破解攻击以及针对开放网络的个性化加密。WPA3 还提供了向前安全性，确保捕获的流量无法被解密。


    ## 无线网络常见漏洞


    尽管安全有所进步，无线网络仍然受到各种形式攻击的威胁。一些常见的包括：


    - **WEP 破解**：由于其加密缺陷，可以使用 `Arack-ng` 等工具快速破解 WEP。

    - **暴力破解和字典攻击**：如果密码较弱，WPA/WPA2 网络可以通过暴力破解或字典攻击被破解。

    - **WPS (Wi-Fi 保护设置)**：一种简化设备连接的方法，容易受到暴力破解攻击，允许攻击者获取网络访问权限。

    - **恶意接入点**：用于欺骗用户并捕获传输数据的假接入点。

    - **去认证攻击 (Deauth Attacks)**：强制设备从网络断开的去认证攻击，以便捕获 WPA/WPA2 握手。这些攻击通常用于对捕获的身份密钥发起暴力破解。


    ## 工具与技术


    为了对无线网络执行攻击，Kali Linux 提供了一系列强大的工具。最常用的包括：


    ### Aircrack-ng 套件


    `Arack-ng` 套件是一组允许你评估 Wi-Fi 安全性的工具。主要工具包括：


    - `airmon-ng`：将无线网络接口设置为监听模式。

    - `airodump-ng`：捕获数据包并显示无线网络的信息。

    - `aircrack-ng`：从捕获的数据包中破解 WEP 和 WPA-PSK 密钥。


