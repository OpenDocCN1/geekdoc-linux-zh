- fmt: "\nIt shouldn’t surprise you because I told you that at the beginning of the\
    \ chapter.\n\nI’m saying `ctrl+s` here, knowing full well that my mac using brethren\
    \ are all saying “it’s COMMAND s, thank you so much.” Relax friend. I’m writing\
    \ this on a MacBook Pro, I agree with you. But we’re still a minority, so just..just\
    \ be cool, okay?\n\nNot mine; Bram Moolenar (the guy who created `vim`) coined\
    \ that phrase as a way to understand the `vim` way. Most people who work with\
    \ text on a regular basis can touch type: they can find all the letters without\
    \ looking as long as their index fingers can find the small marks on `j` and `f`.\
    \ Touch editing means that you can do all the things you would would when you’re\
    \ editing a program by just finding those two keys and never looking at the keyboard.\
    \ \n\nHog Bay Software’s [Quick Cursor](http://www.hogbaysoftware.com/products/quickcursor)\
    \ makes it very quick and easy to jump from any of the above editors into `vim`\
    \ and back, so that I have the touch-editing power of `vim` in addition to whatever\
    \ feature I was using in the other editor.\n\nWith great power comes great responsibility.\n\
    \nBut *seriously* don’t do that. It’s just an example. \n\nIt’s worth noting that\
    \ you can map the Alt key in a similar way: the pattern is `<M-`n>`, where `n`\
    \ is whatever letter you want to press along with the alt key. However, we’re\
    \ going to stick with `vim` tradition and avoid the alt key as much as possible,\
    \ lest people think we are emacs users.\n\nSome of you may have noticed that it’s\
    \ as quick or quicker to just type `ea` as it is to type `,e`. That’s part of\
    \ why I told you not to map this one.\n\nI don’t have wallpaper either, but you’re\
    \ probably familiar with the image: you push down a bubble in one place and it\
    \ pops up somewhere else. Also, in general, wallpaper is *really ugly*. \n\nI’ve\
    \ rewritten this sentence approximately thirty times and can’t think of a better\
    \ way to say that.\n\nNormally four spaces. But you can change it by adding a\
    \ line like `set shiftwidth=2` to your `.vimrc` file.\n\nYes, technically it’s\
    \ a `buffer`, not a real `file`, but we’re going to gloss right over that point.\n\
    \n*rimshot* Thank you, thank you, I’ll be here all week.\n\nI give. It’s more\
    \ or less a mode, and it’s easier to talk about as a mode.\n\nA book entitled\
    \ *Painless Tmux*, perhaps? I wonder if that will ever be a thing? (This is a\
    \ thing we authors call *forshadowing!*)\n\nContrast that with Google Chrome,\
    \ which is about 5 years old and is on version 30.\n\nTechnically one `shiftwidth`,\
    \ but who’s counting?\n\nI know that’s not really a word, but it’s easier to say\
    \ than “reduces the indentation level” the entire region by one tab.\n\nRemember,\
    \ in unix land when we say something “sources” a file we mean it “reads that file\
    \ and does what it says.”\n\nAnd take up your entire day as you find new settings\
    \ you want to add to your `.vimrc`.\n\nTechnically they were added to a `struct`\
    \ that mapped an integer to a standard color name, but you only care about that\
    \ if you’re a C developer who wants to create a new shell that implements the\
    \ ANSI colors.\n\nI’m not sure why `:an` is in there. I like to believe that someone\
    \ just kept hitting the wrong key and finally decided to map the command so that\
    \ it would work.\n\nyou can see this list in the help text by using `:h menu-priority`.\n\
    \nSee the [About] section for more information on other tools used in the creation\
    \ of this book.\n\nWe’re converting it to HTML first for two reasons: 1.) it’s\
    \ the easiest and 2.) because you’ll quickly see just how *not* ready for primetime\
    \ the output is.\n\nNo, it probably isn’t a word, but I’m sticking with it.\n\n\
    I’ll get to the difference between a lower case word and an upper case WORD very\
    \ soon.\n"
