  trans: "\n你完全可以像在其他程序中使用标签页一样使用 `vim` 标签页（tab pages）：只需在每个标签页中打开单个窗口即可。但这样限制自己将会错失标签页的功能。一个\
    \ `vim` 标签页可以包含你想要的任意数量的窗口，并以你喜欢的方式进行布局，且与你打开的任何其他标签页都相互独立。因此，你可以在一个标签页中拥有两个并排的高宽窗口，在另一个标签页中拥有三个水平划分的窗口。你有充分的自由来按照自己的方式行事。\n\
    \n### 如何使用标签页 `:h tabpage`\n\n好了，讲座结束了。一旦你知道标签页的存在，它们就会非常简单。要创建一个新标签，只需输入 `:tabnew`，一个新标签就会打开。如果你想打开一个带有特定文件的新标签，只需包含文件名：`:tabnew\
    \ file.txt`。\n\n一旦你创建了新标签，就可以像你一直以来做的那样将其拆分为多个窗口。每个标签页都像一个完整版本的 `vim`。\n\n出于某种原因，标签页是\
    \ `vim` *爆发*出许多实现同一事情的冗余方法的地方。我总是倾向于完成目标的最短方法，因此我会先列出这些方法，列出其他可能的方法以备参考。\n\n*\
    \   打开新标签：\n    *   `:tabnew` `filename`\n    *   `:tabe` `filename`\n*   关闭当前标签：\n\
    \    *   `:tabc`\n    *   `:tabclose`\n        *   注意，上述两种方法都可以带有 `!` 来强制关闭标签页，即使缓冲区中有未保存的更改。\n\
    *   关闭*所有* 标签：\n    *   `:qa`（如果有未保存的更改则会失败）\n    *   `:qa!`（强制关闭所有标签）\n*   关闭其他标签：\n\
    \    *   `:tabo` 关闭所有其他标签。\n*   跳转到下一个标签 - `gt` - `:tabn`\n*   跳转到上一个标签 - `gT`\
    \ - `:tabp`\n*   跳转到特定标签 - `:tabfir` 跳到**第一个**标签 - `:tabl` 跳到**最后一个**标签 - `tabNumber``gt`\
    \ 跳到指定的标签数字 - `tabNumber``gT` 跳到指定的标签数字\n*   重新排序标签 - `:tabm`*number* 将标签移动到指定标签数字**之后**。使用\
    \ 0 将当前标签置于第一。 - `:tabm +`*number* 将标签向**右**移动 *number* 位 - `:tabm -`*number*\
    \ 将标签向**左**移动 *number* 位\n*   列出所有已打开的标签 - `:tabs` \n\n我想对这个主题多说一些，但它非常简单易懂。如果你喜欢标签页，就应该尝试这些内容。如果你乐于在一个标签页中完成所有工作，那么你可以安全地忽略这些内容。但很容易用，而且在终端中操作它时，你就像一个真正的超酷超级极客。几乎和使用\
    \ [tmux](http://tmux.sourceforge.net/) 的人一样酷，但那是另一本书的话题 ^(65)。\n\n## 22. 间歇：回顾视图（Views）\n\
    \n值得花几分钟回顾一下 `vim` 会话中出现内容的层级结构，以便在脑海中理清它们并休息一下。快速回顾如下：\n\n1.  一个*文件*是磁盘上的一组数据。\n\
    2.  当你告诉 `vim` 编辑一个文件时，它会创建一个该文件所有数据的*缓冲区*（buffer），并让你编辑它。\n3.  一个*窗口*（window）让你查看缓冲区中的文本。如果你愿意，可以打开多个窗口查看同一个缓冲区的不同部分，也可以在同一个屏幕上打开多个窗口查看不同的缓冲区。\n\
    4.  一个*标签*（tab，或者更准确地说是*标签页*，tab page）是你同时看到的所有窗口的集合。你可以打开很多标签，并在它们之间切换非常简单。\n\
    \n让我们从下往上来看，为了好起见，我们将采用半问答的形式。\n\n### 文件\n\n**Q:** 那么，`vim` 并不编辑文件吗？\n\n**A:**\
    \ 是的。当你在 `vim` 中打开一个文件时，它会被复制到*缓冲区*中，你编辑的是缓冲区。有趣的是，缓冲区会每隔保存到*交换文件*（swap file）中，其目的是防止你丢失工作。但我们先暂时忽略这一点。`vim`\
    \ 的缓冲区完全在内存中，只有当你给 `vim` 输入 `:write` 命令时，它才会被写回实际磁盘。\n\n**Q:** 同一个文件可以有多个缓冲区吗？\n\
    \n**A:** `vim` 努力防止这种情况发生。当 `vim` 打开一个文件时，它会创建上述的交换文件。如果你打开另一个 `vim` 副本并告诉它编辑同一个文件，它会看到现有的交换文件并变得非常紧张。在让你开始编辑文件之前，它会询问你是否想创建一个副本，或者以只读模式打开文件，基本上会做任何*除了*让两个\
    \ `vim` 副本争抢交换文件以外。在单个文件上有多个作者是一项最好由专门为此设计的软件处理的任务，而 `vim` 并不是那种软件。\n\n当你保存文档时，`vim`\
    \ 会将交换文件的内容复制到当前文件。当你关闭 `vim` 时，它会删除交换文件。我会更详细地介绍这一点。\n\n**Q:** 那么为什么交换文件存在呢？\n\
    \n**A:** 因为它们是为了让你工作……,,,,,,,,,,,,....\n\n（注：此处后续文本中存在大量重复和乱码字符，已根据要求仅翻译有意义的文本部分）\n"
- fmt: "\n**A:** I’m not saying that you have to have multiple windows on each tab;\
    \ I often use tabs for a single buffer. I just want people to remember that you’ve\
    \ got more options and not get stuck thinking that one tab always equals one buffer.\n\
    \nThe other pitfall comes with plugins like `NERDTree`. People get used to having\
    \ their file explorer open on the side of the screen, and having it be persistent\
    \ across all tabs. Vim doesn’t work like that. You can make it work like that\
    \ with scripting and whatnot, but by default that’s not how things work in vimworld.\
    \ Just remember that all the windows you can see exist on a tabpage, and you’ll\
    \ be fine.\n\n## 23. How Vim Thinks\n\nThis chapter has a few little odds and\
    \ ends, useful bits of advice and insight into your new favorite editor. You can\
    \ certainly read this chapter through, beginning to end, but the sections mostly\
    \ stand on their own.\n\n### You Don’t Edit *Files*, you Edit *Buffers*\n\nThis\
    \ is nothing new: When you open a file in vim it creates a copy of the file in\
    \ memory and all your changes are made to that copy. When you save the file your\
    \ changes are all written back to disk. Pretty much every editor does that. But\
    \ it’s worth knowing that a lot of vim terminology has to do with buffers. Okay,\
    \ that’s the short answer. If you want more, keep on reading. If that’s good enough\
    \ for you then we’re done here.\n\nSo, as I said, vim writes your changes to memory\
    \ until you tell it to save them, because writing every character to the disk\
    \ the moment you pressed it would be crazy slow and inefficient. So instead, vim\
    \ waits until you’ve entered 200 characters, or sat around doing nothing for four\
    \ seconds before writing anything to disk.\n\nYou see, when you open a file in\
    \ vim, it creates a “swap” file that holds your changes while you edit. So if\
    \ you’re editing the file `swap.txt` vim will create a hidden file called `.swap.txt.swp`.\
    \ Once you start making changes vim will stash your changes away in this swap\
    \ file whenever you’ve entered 200 characters or haven’t done anything for four\
    \ seconds.\n\nWhy is vim doing this? Because it’s got your back, friend. If your\
    \ computer crashes while you’re in the middle of a big project you’ll never lose\
    \ more than 200 characters’ worth of work. When you re-open the file vim will\
    \ notice that there’s a `.swp` file sitting around and ask if you want to recover\
    \ your changes from that file. In most cases this will get you right back up to\
    \ speed.\n\nOn the other hand, if you decide all the changes you’ve made during\
    \ this editing session are pure garbage, you can just ditch them by typing `:q!`\
    \ and the `.swp` file is destroyed, no questions asked. Nothing will be saved\
    \ to your file at all.\n\n### Updating Vim\n\nDo the math: Vim is over twenty\
    \ two years old, and is (at time of this writing) on version 7.4. This means that\
    \ you get a major vim upgrade once every 3.14 years. You don’t need to worry about\
    \ updates all that much.\n\nBut Bram and company are making improvements all the\
    \ time, and it’s worth it to stay up to date with the latest and greatest, even\
    \ if most of the patch-level updates aren’t going to rock your world. Depending\
    \ on your OS the upgrade instructions are a little different.\n\nLinux/Unix folk\
    \ have the easiest time of it. Your system’s package manager will most likely\
    \ always include the latest version of vim, so as long as you run regular updates\
    \ you’ll be fine.\n\nOn Windows you pretty much just need to watch the website\
    \ for announcements of new versions. If you’re using Cygwin to get your vim fix,\
    \ you can use the Cygwin package manager which will keep you up to date. As with\
    \ the linux people just run your package manager’s update functions every so often\
    \ and you’re golden.\n\nOn OSX you’ve got two choices, both of them…okay. OSX\
    \ does ship with a version of vim, but as of 10.8 it was version 7.3, when the\
    \ current version is 7.4. You can wait for Apple to update their system vim, or\
    \ you can use homebrew. Getting up and running with homebrew is quick and easy,\
    \ but beyond the scope of this book. For those who don’t know, homebrew is a package\
    \ manager for OSX that builds open source projects on your system from source.\
    \ Once you’ve got homebrew installed you can just type `brew install vim` and\
    \ you’re up to date with the latest and greatest. To keep it up to date you need\
    \ to update homebrew every once in a while (`brew update`), which gets the latest\
    \ package information, and then upgrade your installed packages (`brew upgrade`).\
    \ Do this once every couple of weeks and you’re in good shape.\n\nIn all cases\
    \ you have the option of compiling vim yourself. You can set all manner of flags\
    \ and options and compile things in or out of your vim install, but the process\
    \ is definitely not painless, so I’m going to follow my usual pattern of pointing\
    \ you to a decent resource on the topic and quietly move on to the next chapter.\n\
    \n## 24. Visual (Mode) Basics `:h visual-mode`\n\nVisual Mode is simple and useful\
    \ once you get into it, but it can take some getting into. This is partially because\
    \ there are separate visual modes that have commonalities, but aren’t identical.\
    \ Let’s cover the similarities.\n\nThe whole point of visual mode is that it lets\
    \ you select a block of text, and apply an action to that block. There are a number\
    \ of times it can be a more intuitive. Let’s start with the most basic form.\n\
    \n### Characterwise Visual Mode `:h characterwise-visual`\n\nTo enter this mode\
    \ you simply press `v` in normal mode. As you probably guessed, it’s called “characterwise”\
    \ because it lets you increase or decrease the size of your region one character\
    \ at a time. Once you’re in this mode you can use all the movement keys to add\
    \ or subtract from the selection. As you might also suspect, you can start visual\
    \ mode with a count before the `v`, like this: `5v`.\n\n### Linewise Visual Mode\
    \ `:h linewise-visual`\n\nThere are few surprises here. As you would expect, in\
    \ linewise visual mode you can select entire lines instead of individual characters.\
    \ This mode is useful when you want to grab a block of text all at once. You’ll\
    \ be able to tell that you’re in linewise mode because the status board on the\
    \ bottom will say `-- VISUAL LINE --` instead of just `-- VISUAL --`. As with\
    \ characterwise visual, you can start linewise with a numerical argument and it\
    \ will select that many lines: `5V` will select five lines, just as `5v` selects\
    \ five characters.\n\n### Blockwise Visual Mode `:h blockwise-visual`\n\nIn this\
    \ mode you can select a block of text. Blocks are special: they can be expanded\
    \ both *horizontally* (along a line) and *vertically* (across lines). There are\
    \ a number of good reasons to use this functionality, but it does take more skill\
    \ to handle than the other types of visual mode.\n\nYou enter blockmode with `ctrl+v`,\
    \ and the status line will read `-- VISUAL BLOCK --` when you do it. Once you’re\
    \ in visual block mode you can select a rectangular region with all the standard\
    \ motions, searches, etc, just as characterwise visual mode.\n\nA common use for\
    \ block mode is prepending something to a bunch of lines at once. Let’s say you’re\
    \ writing javascript and you realize you wrote this:\n\n```javascript\nfunction\
    \ someThing(data){\n\ta = 1\n\tb = 2\n\tc = 3\n\td = \"hi bob\"\n\t…\n}\n```\n\
    \nAnd you realize two things: one: your variable names are terrible, and two,\
    \ you forgot to put a `var` before them, which will fail if you enable the `use\
    \ strict` option on this file. Block mode can’t help you with the first problem,\
    \ but your second problem is so common there is a special shortcut to fix it.\
    \ Here’s how it works:\n\n1.  Enter visual block mode with `<ctrl>v`\n"
