    ## 2. Select the first column of each row by positioning your cursor before the
    first variable declaration and pressing `j` three times


    3. Type `I` (that’s a capital I, or `<shift>I`)


    4. Type `var`


    5. Press `Esc` (or `<ctrl>[`)


    Vim will prepend your `var` declaration to each line you selected in visual block
    mode. Now go fix your variable names.


    And before you ask, yes, you can use `A` in visual mode to append something to
    the end of each line in a block mode selection. There’s no way vim would forget
    something that fundamental. In fact there are a number of very intelligent and
    useful visual-block-only commands that make common programmer formatting tasks
    much easier. You can find a full list in the help topics by entering `:h blockwise-operators`,
    but I’m going to mention one more. Well, two more, but they’re mirror opposites,
    so it’s basically one more…


    **ANYWAY**


    when you’ve selected a region in visual block mode you can use `>` to indent the
    region by one “tab”. Similarly, pressing `<` while in visual block mode “outdents”
    the entire region by one tab.


    ### Common Visual Mode Commands


    Block mode’s Prepend feature is great, but there are a lot of other features that
    all the visual modes share. here’s a quick highlight list:


    When you’re in a visual mode, you can use `o` to jump between the beginning and
    end of your selected region. This is helpful if you want to expand the selected
    region to include a few characters you missed at the beginning, then jump back
    to the end of the selection and grab a few more characters there.


    In normal mode `gv` will re-select your previously selected area, which is useful
    if you…want to select the same area again. If you’ve recently done a search `gn`
    will highlight everything between your cursor and the next occurrence of the search
    term, while `gN` will select everything between your cursor and the previous occurrence,
    much like `n` and `N` move your cursor between occurrences of a search term.


    Again, this is not a complete list. If you want to see all the commands and text
    objects you can use while in Visual mode you can check out the help document in
    vim by using `:h visual-operators`.


    ## 25. Vim GUIs


    There are a lot of good reasons to use vim from the terminal: it’s fast, light
    on your system, and when paired with tmux it lets you keep all your command line
    eggs in one basket. But there are good reasons to use the graphical versions of
    vim as well: they’ve usually got better system integration, buttons, tabs, and
    all the things you thought you were losing forever when you started on this vim
    adventure. Let’s spend a little time exploring the graphical side of vim.


    There are (more or less) three different graphical versions of vim: `gvim`, MacVim,
    and Windows Vim. But all of them will start if you call `gvim` at the command
    line, so we’re going to call all of them “gvim” for the sake of simplicity. Installing
    them is beyond the scope of this book, because the process varies so much from
    system to system. A search engine is your friend in this case.


    ### Setting Expectations, Then Setting Some Settings


    First off, let’s clarify what we mean when we say “graphical” vim. You’re not
    getting a full on IDE like IntelliJ or Visual Studio. In general what you get
    is system chrome around a regular vim session, and a few other perks. If you use
    tab pages they will be rendered as actual, clickable tabs, just like in an IDE.
    There can be a few buttons on the screen. You can play with menus, if that’s your
    thing. We’ll get to all these things in a minute. But first, let’s talk about
    settings.


    Throughout this book I’ve been showing you changes you can make to your `.vimrc`
    file, the all-powerful settings file that tells vim how to behave. And if you
    want, you can just keep using that file to hold all of your gvim-specific settings.
    But there’s a better way. You see, when you start up `gvim` it sources your `.vimrc`
    file first and then looks for a file called `.gvimrc`. If it finds that file it
    will source it as well. If you don’t have a `.gvimrc` file then it’s done. There
    are two benefits to this approach. The first is that you can keep your gvim settings
    all in one place and not have to wade through them when you’re working on your
    regular vim stuff. The second is that vim doesn’t have to wade through them when
    you’re just loading up terminal vim. The third (okay, there are three main benefits
    to this approach) benefit is that you can override settings from terminal vim
    when you run gvim.


    If you don’t already have a `.gvimrc` file set up you can simply start editing
    it and put all your gui-specific stuff in the new file. And what kind of stuff
    would that be, you ask? You can find an exhaustive list of all options you can
    set by going into vim and typing `:h option-list` as you might expect. As you
    might also expect, this list will give you a slight headache if you try to process
    it all at once.


    ### Setting the Font in gvim


    Most of these are things you won’t worry about, but we’re talking about `guifont`.


    #### Step 1: Use the Font Picker


    Open gvim and type


    ```

    :set guifont=

    ```


    on the command line. It should open your system’s font picker.


    #### Step 2: Find out Vim Thinks Your Font Is


    Instead of figuring out how to tell vim what font you want by trial and error
    you can type


    ```

    :set guifont?

    ```


    And it will tell you what you’re currently using. My gvim at the moment would
    say


    ```

    Andale Mono:h14

    ```


    The `h14` part, as you might expect, is the size in points.


    #### Step 3: Set the font in .gvimrc


    Okay, so now all you have to do is open `.gvimrc` and paste in what you got back
    from the `:set guifont?` command, right? Well, almost right. If there is a space
    in the font name (like, say “Andale Mono”) you need to escape that space with
    a slash, like so:


    ```

    :set guifont=Andale\ Mono:h14

    ```


    And you’re set. Save the file, source it (`:so %` will still work, but will do
    anything if you’re using gvim) and you should see your new font in all its glory.
    This gives you a pattern to follow for any other gui-only settings you want to
    change. If you want to see a bunch of useful settings see `:h gvim`. There are
    a lot of *useful* things you can play with, but in the next chapter we’re going
    to play with a fun one instead.


    ## 26. Menus Everywhere! :h menus


    This isn’t *strictly* a gvim thing, but vim does give you the ability to make
    your very own menus. They work *better* in gvim than they do in terminal vim,
    but they *can* work in both places. Be aware, though, that this is a less painless
    topic than just anything I have covered in this book.


    First off, gvim loads a standard set of menus when you start it. You don’t need
    to mess with them. You can if you want to; but you’re on your own there. I’m going
    to cover the basics of creating a brand new menu, and then show you how to make
    it pop up when you want it, wherever you want it.

    '
