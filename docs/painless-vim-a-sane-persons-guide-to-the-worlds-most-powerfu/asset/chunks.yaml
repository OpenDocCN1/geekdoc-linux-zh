    Which is nice and all, but what does that have to do with “normal” mode not being
    “insert” mode? To answer that (here we go again) think of how an artist draws.
    They don’t sit there, staring at the paper with their pencil pressed against it.
    Nor do they drag their pencil across the page when they want to work on a different
    corner of the drawing.


    And so it is with vim. Your “pencil” is your cursor, and for the most part it
    shouldn’t be sitting on the “paper” of your text file. You should be able to move
    it around without worrying about changing things along the way. This is the intent
    of “normal” mode. In normal mode you can move your cursor around and do quite
    a bit of very useful editing, but you won’t be adding new pencil strokes to the
    masterpiece that is your document.


    ## `--INSERT--` Means You Are Free to Type Normally.


    Insert mode was also very carefully named. You can do a `lot` of editing from
    normal mode, but you can’t really add new text. To do that you need to have your
    keyboard turn back into a standard press-letter-keys-and-letters-appear keyboard,
    and that’s what insert mode is all about.


    It still has a few tricks up its sleeve, though. We’ll get into some insert mode
    commands that let you make intelligent changes to the text without going back
    to normal mode. Since most of the heavy lifting is done in normal mode, insert
    mode is pretty light on commands, but there are a few. We’ll get into the fancier
    ones in the chapter on [Fancy Insert Mode Commands](#chap20.xhtml_ins-mode-commands)
    and a little bit in the chapter on [Registers](#chap14.xhtml_registers). For now
    we’ll just do two simple ones: `<ctrl>t` and `<ctrl>d`. These two commands are
    incredibly simple: `<ctrl>t` indents the current line by one tab (more or less)
    and `<ctrl>d` outdents it by the same.


    The application of this should be pretty obvious, especially if you work with
    structured code, like Python or HTML. lining up statements in a block makes them
    easier to read. But these two commands also show off an important point about
    insert mode commands: they all start with `<ctrl>` and a letter. See, this is
    the value of *Painless Vim.* Gems like that. In fact, I’m going to put it into
    a fancy tip block, just to reemphasize the point:


    Okay, Let’s move on.


    ## Command Mode: The One You’ve Been Secretly Using all This Time.


    So, technically, every time you press `:` in normal mode, you’re entering a brand
    new mode called `command mode`. You’ve been using command mode ever since page
    1, where you typed `:q!` to get out of vim. And this demonstrates the majority
    of uses you’ll have for command mode. In general it’s used to issue commands to
    vim that have little or nothing to do with the text you’re editing. `:q` is a
    perfect example: quitting the editor is a `vim` command, not a `text` command.


    We’re not going to deep-dive on command mode right now, just know that when you
    see a command with a `:` in front of it you’re probably looking at a system command.


    ## Visual Mode: Marking Text


    Now we’re getting into new territory. Visual mode is one we haven’t hit on before
    at all. Visual mode is often fairly neglected, which is too bad because it’s also
    very useful. In Visual mode, you `visually` select an area of text to edit, instead
    of counting or searching or what have you. Basically visual mode lets you mark
    the beginning of a section of text, move the cursor to the end of the section,
    and then enter an operator to operate on that chunk of text. There are three ways
    to enter visual mode:


    *   `v` enters “characterwise” visual mode. In this version you can edit an area
    as small as a single character, up to the entire document.

    *   `V` enters “line-wise” visual mode. In this mode you can operate on one or
    more `lines` all at the same time.

    *   `<ctrl>v` enters “block-wise” visual mode. In this mode you can edit a `block`
    of characters that can span rows and lines and can be pretty much any dimensions
    you choose.


    All three types of visual mode have their uses, and we’ll go more into depth in
    the chapter on [Visual (Mode) Basics](#chap25.xhtml_visual-basics). But for now
    we’re just going to acknowledge that visual mode lets you select ranges of text
    visually and move on.


    ## …And all the Rest


    There are other modes, of course. According to vim’s [built-in help](#chap17.xhtml_help)
    there are six “basic” modes and six “additional” modes, which are variants of
    the basic modes. But for the most part they’re not super useful, and `definitely`
    not painless, so we’re going to blithely ignore them, after pointing you to a
    reference where you can learn a whole lot more. [Here it is.](http://vimdoc.sourceforge.net/htmldoc/intro.html#vim-modes-intro)


    ## 10. Plugins


    Vim is a great editor, but there is always room for expansion and improvement.
    Unfortunately, a small open source team can’t possibly keep up with every new
    language, technology, coding style, and theme needed to keep every developer happy.
    Fortunately, vim was designed so that developers can create plugins that extend
    functionality.


    ### What a Plugin Is


    In the simplest possible terms, a plugin is a set of new functions, shortcuts,
    and scripts that make vim better in some way. It may be something as simple as
    syntax highlighting rules for the latest language to come, or it could be an entire
    repository management system. If you’ve ever added a new theme or extension to
    your browser you can think of plugins the same way.


    There are a few ways to install plugins for vim, but we’re only going to cover
    two of them: the hard way (meaning the totally manual way) and the easy way. Since
    this book is called *Painless Vim* I would be remiss if I didn’t give you a nice
    link to the easy way](#chap11.xhtml_easy-way) right here.


    ### Plugins the Hard Way


    Wow, you actually decided to read through this section. Okay! Well, that’s probably
    for the best, because even doing things the easy way you’ll have to go through
    these steps at least once.


    Fortunately, the hard way isn’t really that hard; it’s just very manual. It involves
    moving files around by hand and whatnot. Since I’m still shooting for a Painless
    type book I’m going to choose a simple plugin as our example. [Show Marks](http://www.vim.org/scripts/script.php?script_id=152)
    is a plugin that makes your marks visible, hence the name. To install it you have
    to do the following:


    1.  Download the `.zip` file from the link above

    2.  Unzip the file

    3.  Copy the unzipped file into your `$HOME/.vim` folder

    4.  Restart vim


    Man! Dang, sorry about *all the hard work* there! Whew! I’m sweating from all
    that hard hard work!


    Okay yeah it’s not that hard at all. But like I said, that’s an easy one. There
    are plugins that are significantly more complex, requiring you to copy `several`
    files into `several` locations…okay, it’s not ever all *that* difficult, but if
    you’ve got a lot of plugins it can get confusing to keep them all straight, and
    should you decide to get rid of one it can be a pain to clean up after that plugin
    and get rid of all the files it brought down with it. Fortunately, there is a
    (**much**) better way.


    ### And Now, the Easy Way

