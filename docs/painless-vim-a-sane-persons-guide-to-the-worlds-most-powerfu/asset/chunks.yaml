    bordered by a line ending or period. In general, vim works hard to match its concepts
    of borders to what humans think of as borders.


    If you tell vim to operate on an *inner* text object it will leave the borders
    alone. For example, if I do a `diw` on the word “Galt” in the sentence `Who is
    John Galt?` we are left with `Who is John ?` Which isn’t grammatical, with that
    question mark floating around by itself at the end. However, if I were doing a
    `ciw` instead it would preserve the space between `John` and whatever new last
    name I want to give to Ayn Rand’s character:


    ```

    1 Who is John Punchfist?

    ```


    Much better.


    However, when you’re straight up deleting text, you often want to modify *all*
    of a text object, spare whitespace included. To do this change the `i` in the
    previous commands to an `a`. If I had said `daw` on John’s last name in the example
    above the resulting sentence would have read `Who is John?` which is perfectly
    grammatical, if a bit vague, and nowhere near as awesome as asking who John Punchfist
    is.


    You can no doubt see why I wouldn’t want to do `caw` there, because then I would
    have to *type* that space between “John” and “Punchfist” back in *all by myself*.
    Can you even *imagine*?


    But `i` and `a` can do more than that. The “Inner” and “All” commands operate
    on just about any text object, including some fairly clever ones. Vim is smart
    enough to know that some symbols, like parentheses and quotation marks, wrap text
    objects that you may want to operate on as a whole. So it’ll let you! For example,
    consider the following sentence:


    ```

    1 "Hello there! (He| lied)". Ted was always cheerful.

    ```


    Not only is it terrible writing, it’s terrible grammar. But it’s a fun sentence
    to play with. Let’s say we want to get rid of the whole `(he lied)` bit. Easy!
    We’re going to tell vim to “Delete everything inside these parentheses, and take
    the parentheses with it.” It’s easier in vim speak, just type `da(`


    Just like that you’ve got


    ```

    1 "Hello there! |". Ted was always cheerful.

    ```


    Now let’s say we want to change Ted’s greeting. Since your cursor is already inside
    the quotation marks you can change the text between quotes and leave the quotes
    alone. `ci"` is your command of choice, and you can make Ted say whatever you
    want:


    ```

    1 "| ". Ted was always cheerful.

    ```


    Vim is smart about these enclosures, and there are quite a few you can use. Here
    are a few of the more obvious ones:


    Enclosures


    | Enclosure | Meaning |


    | --- | --- |


    | `{` | Everything between two curly braces |


    | `[` | Everything between two square brackets |


    | `<` | Everything between two angle brackets |


    | `t` | Everything inside the closest XML or HTML tags |


    These all give you an easy way to modify exactly the text you want to change and
    nothing else.


    ### Move by Counting


    We’ve already seen the beginning of this concept in the [Using Counts](#chap08.xhtml_counts)
    section, but let’s flesh it out a bit here. Motion commands are still commands,
    and you can tell vim to repeat them just like anything else. This means that you
    can move five words right by simply typing `5w`, or you can move six lines down:
    `6j`. This is often a faster way to get where you’re going than hitting `j j j
    j j j`.


    But not always. The reason for this is the human ability called *[subitizing](https://en.wikipedia.org/wiki/Subitizing)*.
    Simply put, we as humans can easily recognize groups of things up to about three
    or four without counting them, but once you get above four we slow down considerably.
    In vim terms this means that if you look at a sentence and see that you have to
    move three words right you will just hit `3w` without thinking about it. But if
    you have to move six words right you’re probably counting those words, then entering
    the command, and that’s often slower than just mashing the `w` key six times,
    or (even better) just searching for the exact spot where you need to make your
    changes. More on that coming [soon](#chap16.xhtml_searching).


    ### (Book)marks'
