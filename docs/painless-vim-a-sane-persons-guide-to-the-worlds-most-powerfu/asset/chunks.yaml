- fmt: '

    I’m here to help you get started, not to be the only book you’ll ever buy on the
    subject. The main reason for this isn’t laziness, thank you very much. Well, okay,
    it kind of is. There are a ton of books, websites, wikis, and other documentation
    out there that will help you along, once you get over the initial learning curve.
    I’m here to help you over that first curve.


    ### A list of tips


    A lot of the stuff in the later chapters won’t make a ton of sense if you haven’t
    been through the earlier chapters. The chapters are laid out iteratively, starting
    with small changes that build up to a final configuration that should work well.
    Then you’ll have a good jumping-off point for your further modifications.


    ### A deep dive


    The goal here is to give you enough information to be comfortable, but not all
    the underlying technologies and line editor commands and other such things. Again,
    these are available online and in many other reference guides all over the place.
    When you decide that you want to know more about something you’ll be able to find
    it. I have faith in you.


    ### Who am I?


    I’m Nate Dickson, it says so right on the cover.


    But beyond that, I’m a professional programmer by day, blogger, writer, and daddy
    by night. You can check out a fairly large amount of my writing on my personal
    blog, or my less-maintained Apple blog. You can also check me out on Twitter,
    or Github.


    In terms of my vim credentials, I don’t have many. I use vim in my day job and
    I’m a command line junky, with the `.zshrc` and `.tmux.conf` files to prove it.


    But my quasi newbie status is part of why I’m writing this book right now. I’ve
    spent the last few months combing blogs and websites, buying or borrowing books
    on vim and grabbing onto the arm of anyone I know who uses vim and begging them
    to help me fix whatever mess I’ve most recently gotten myself into. Now that I’m
    fairly comfortable, I’d like to pass what I’ve learned along to ease the learning
    curve for everyone else.


    ### References


    I will refer you to a lot of other books, posters, blogs, wikis, etc. etc. over
    the course of this book. For the most part these are things I’ve used extensively
    myself, and can heartily recommend. Again, I’ll try to provide reasons for my
    references and let you decide if it sounds like something you’d like to investigate
    on your own.


    ### Sample Documents


    Throughout the book there will be exercises to try out. For convenience, I have
    created a repository of sample documents for use with these exercises. They are
    stored on [Github](https://github.com/PogiNate/Painless-Vim-Samples), and the
    readme file has instructions for how to get them in place, if you’re not familiar
    with git and Github.


    ### The Obligatory “Conventions Used in This Book” Section


    First off, regarding the actual word “vim”. In general I will write it all lowercase,
    because that’s how most people think of it, like “perl” or “ruby”. That’s the
    command you enter to start the editor, and that’s really the name of the program.


    However, when it’s in a book, chapter, or section title I will capitalize it,
    just as I would any other word in a title: *Painless Vim*


    Ironically, even though it’s probably the most correct, I will never write it
    as “VIM”, even though it is a acronym (kinda) for “Vi IMproved”


    Other than that, I use the same conventions everyone else uses. Code appears in
    `a monospaced font`, and longer blocks of code will appear


    ```

    1 in a large block

    2 of monospaced text.

    ```


    Special keys like `<shift>`, `<enter>`, `<esc>`, will have angle brackets around
    the name to make it real obvious that you shouldn’t be typing that word, you should
    be pressing that key. If you need to press `<ctrl>` and another key at the same
    time (and you *will* need to do this, quite frequently) I’ll just write them like
    so: `<ctrl>d`.


    Vim uses both upper- and lower-case characters, so remember that “`S`” is `<shift>s`
    and “s” is just `s`.


    Those are the only two times you should ever need to press two keys at the same
    time: either to hit `<ctrl>` and a character, or to press `<shift>` and a character
    to make something upper-case.


    Which is good, because there will be a lot of times where you have to hit multiple
    characters in sequence. For example, let’s say you need to delete the next character
    after your cursor. You would press `d` (for delete) and then `l` (for the next
    character. Don’t worry about it now; we’ll get into it later). When I write this
    out in the book I will just write the two letters in a row, like so :


    ```

    1 dl

    ```


    I realize that looks exactly the same as my “type them at the same time” notation.
    Just remember that you’ll only ever need to press `<ctrl>` or `<shift>` at the
    same time as another character. In all other situations, two characters in sequence
    means type them one after the other.


    Okay, got it? It’s pretty natural, I promise. Let’s move on.


    From time to time I will need to show you *exactly* where your cursor needs to
    be when you perform a command. In these cases I will put a pipe symbol where the
    cursor resides, like so:


    ```

    1 The cursor is in the middle of the word pi|pe

    ```


    Again, this will all make more sense in a bit. For now let’s get moving.


    ## 1. Get In, Get Out, Get Comfortable


    Okay, you’ve gotten through the introduction. Good for you. I’d like to say that
    the style will settle down at this point, but I can’t promise that.


    Here’s where we get started on the real meat of learning vim. We’re going to start
    simple: *open the editor*. For now I’d recommend doing things from the command
    line, not because I have some big problem with GUI’s, but because the graphical
    versions of vim tend to make little changes that can get in the way of the things
    we’re trying to do here. So, open a Terminal and enter the following:


    ```

    1 $ vim

    ```


    ![I have been here before. I don’t like it.](images/vim_intro.png)


    I have been here before. I don’t like it.


    There! That’s not so scary, is it? Just a bunch of tildes and some version information!
    Not scary at all!


    Well, okay, yeah it is. You’re in this editor with no discernible way out. So
    let’s cut straight to the quick and talk about how to get back out. For now we’re
    going to use the absolute “oh crap let me out” method. Type `:q!<enter>` and you
    should be right back to the command prompt, which looks like this:


    ```

    1 $

    ```


    Okay, breathe. This time we’re going to go in armed a little better. Before you
    dive back in, find a file you’ve been working on lately. HTML files work well,
    but pretty much anything that is structured text or code will work just fine.
    If you don’t have anything that springs easily to mind you can use `sample.html`
    from my sample repository. Switch to the directory where that file is kept:


    ```

    1 cd /path/to/where/the/file/lives

    ```


    And do this:


    ```

    1 vim file1.html

    ```


    And you should see…a boring representation of your file. But we’re going to fix
    that right now. Enter the following:


    ```

    1 :syntax on<enter>

    ```


    And the file should brighten up a bit. We’ll talk more about colorful files in
    a bit, but for now let’s get back out of vim, because it’s still scary:


    ```

    1 :q!<enter>

    ```


    Okay, you’re safe. Let’s take a minute out here in the real world to formalize
    what we’ve just learned:


    1. When you start vim, the keyboard makes things happen instead of making letters
    appear.

    2. When you want to send a command to vim, you preface it with a colon (`:`).

    3. `:q!<enter>` gets you back out of vim without saving any changes.


    Cool.


    ### Line numbers and Moving Around


    All right, now that we’ve had a breather, let’s dive back into vim. Open your
    test file again with


    ```

    1 $ vim file1.html

    ```


    And you’ll see you’re right back to boring plain ol’ text. You can tell vim to
    color it again with


    ```

    1 :syntax on<enter>

    ```

