    掌握了这些新知识后，让我们来看看窗口命令模式^(64) 下可以进行的一些操作。第一个是在打开的窗口之间跳转。要做到这一点，你只需按下 `<ctrl>w` 进入窗口命令模式，然后使用移动键从一个窗口跳转到另一个。正如你预期的那样，`<ctrl>wk`
    会让你向上移动一个窗口，`<ctrl>wj` 会让你向下移动一个窗口。你可以自己发现如何左右移动。


    操作就这么简单，没错，你这群自以为聪明的小天才，你也可以在中间加上数字。如果你有三个窗口像煎饼一样叠在一起，你想从最底层的“煎饼”跳到最顶层，你可以使用 `<ctrl>w
    2k` 直接跳到顶部的窗口。或者跳到“煎饼”。随你的便。在此记录一下，如果你有三个窗口叠在一起，并输入 `<ctrl>w 15k`，它并不会循环五次；它只会到达顶部的窗口，并默默地忽略掉你告诉它做某件蠢事的事。Vim
    就是这么体贴。


    ### 调整窗口大小 `h: window-resize`


    有许多调整窗口大小的方法，它们带给你不同程度的便利和控制力。让我们从简单的开始。默认情况下，当你创建一个新窗口时，vim 会将你的当前窗口分成等份。如果你想调整该窗口的大小，你面临一个选择：你是想让它变高、变短、变宽还是变窄？取决于你如何拆分窗口，其中某些操作可能并不适用；例如，如果你将整个屏幕拆分为两个水平窗口，你就无法让窗口变宽或变窄；它被固定在
    100% 的宽度上。但你可以让它变高或变短，所以我们先做这个。


    要让窗口变高，你输入 `<ctrl>w +`。在这种情况下，`+` 是一个真正的加号，因为你正在向窗口添加了一行。你可以通过在 `<ctrl>w` 和 `+`
    之间指定数字来添加多行，例如：`<ctrl>w 4+`。


    要让窗口变短，你可以做同样的操作，只是用减号 `-` 代替加号。所以，这是一个减号，看到了吧？`<ctrl>w -` 会给你一个短一行的窗口；数字技巧也同样有效：`<ctrl>w
    4-` 会让窗口短四行。


    如果你一直在杂乱无章地更改窗口大小，并想让它们恢复相同的大小，可以通过输入 `<ctrl>w =` 来实现。这里的助记应该是显而易见的。


    好了，让窗口变高或变短是显而易见的，那么让它们变宽或变窄呢？也很简单。你输入 `<ctrl>w >` 让窗口变宽（把它想象成将窗口右侧向外推）。要让它变窄，你执行相反：`<ctrl>w
    <`。同样，你可以在这两个命令的中间使用数字。


    所以，让我们总结一下：要更改窗口大小，你从窗口命令模式进入快捷键（`<ctrl>w`）开始，按下以下之一来更改窗口：


    *   `+`: 让窗口变高

    *   `-`: 让窗口变短

    *   `>`: 让窗口变宽

    *   `<`: 让窗口变窄


    我们将在 `windows.txt` 中尝试这些命令，那是一个专门为窗口娱乐设计的特殊文档。


    ### 移动窗口 `:h: window-moving`


    这不是我经常使用的功能，但偶尔会派上用场。假设你正在处理一个文件，并打开了帮助文档。默认情况下，它会在你的当前窗口上方打开。假设你想保持帮助窗口打开，但你更喜欢让代码窗口在顶部。要将你的当前窗口（记住，当你打开帮助窗口时，光标会跳转到那里，并变成你的当前窗口）移动到底部，你只需要按下
    `<ctrl>w J`（大大写的 `J`）将该窗口发送到屏幕底部。使用 `<ctrl>w K` 将它移动到屏幕顶部，正如你预期的那样。


    大多数时候，这些是你唯一需要的窗口移动命令，因为你可能只打开了两个 vim 窗口。但也许你就是那种一直打开各种窗口的人之一。如果你打开了很多窗口，并想进行一些不那么剧烈的跳转，请继续往下看。其他人可以直接前往下一章。


    #### 让窗口跳舞


    以下命令只有在你打开了三个或更多窗口时才有用。我并不知道你为什么要打开三个或更多窗口，但我不会在这里评判。也许你有一个巨大的显示器，并且大脑比我好用，所以你可以同时关注三个或更多事情。随便吧。开始吧。


    你可以使用 `<ctrl>w r` 和 `<ctrl>w R` 旋转窗口。小写版本向下旋转窗口，这意味着顶部的窗口变成第二个窗口，第二个变成第三个，依此类推。底部的窗口跳到顶部。当你移动大家时，你的光标会停留在你开始这段小跳舞时所在的窗口中。


    命令的大写版本方向则相反；顶部的窗口跳到底部，第二个变成第一个，依此类推。此命令的两个版本都可以接受数字，因此它会让窗口旋转 *N* 次，而不是仅仅一次。


    如果你只想交换两个窗口，但留下其他窗口，可以使用 `<ctrl>w x`。假设你有如下布局：


    ```

    +-----------+

    |     1     |

    +-----------+

    |     2     |

    |     3     |

    +-----------+

    ```


    你想交换 1 和 2，但把 3 留在底部。你只需按下 `<ctrl>w x`，现在你得到了：


    ```

    +-----------+

    |     2     |

    +-----------+

    |     1     |

    |     3     |

    +-----------+

    ```


    如果你光标在窗口 1，并按下`<ctrl>w 3x`，你会得到：


    ```

    +-----------+

    |     3     |

    +-----------+

    |     2     |

    |     1     |

    +-----------+

    ```


    如果这就是你想要的乐趣。与旋转命令不同，窗口交换命令会将光标移动到新窗口。换句话说，当你交换窗口 1 和 3 时，光标会停留在顶部的窗口。Vim 对窗口进行编号，所以顶部的窗口是
    1，而不是 0。


    ### 21 标签页不是浏览器标签


    任何应用程序中最有功能之一都是打开多个标签查看多个文件或网页。vim 也有这个功能！但它并不像你认为的那样，直到你习惯 vim 处理标签的方式，否则它会看起来很奇怪、敌对，甚至带有攻击性。我们将在下一个间插
    中详细讨论 vim 的术语问题，但现在让我们快速浏览一下。


    如今，当我们说你在桌面上打开了一个窗口（我在整个计算术语中最喜欢的比喻之一）时，指的是操作系统使用的图形界面。当你打开浏览器，或者像 Sublime Text、IntelliJ
    或 Visual Studio 这样的现代 IDE 时，你可以在单个*窗口*中打开多个*标签*。而 vim 反而允许你在单个*标签页*中放置多个*窗口*。


