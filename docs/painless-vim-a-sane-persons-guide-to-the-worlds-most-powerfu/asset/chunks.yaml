    \ your changes take effect, or you can do some vim awesomeness. Instead of exiting\
    \ vim, enter the following:\n\n```\n1 :so %\n```\n\nNow, before you close this\
    \ book, feeling all hurt that I’m going to spring terrible surprises on you like\
    \ `.vimrc` files and arcane `:so %` commands, hear me out. What you just did is\
    \ tell vim to *source* ^([16](#chap35.xhtml_fn-read)) the current file. The `so`\
    \ command is a shortcut for `source`, and `%` is a shortcut for “the current file”.\
    \ See? Nothing scary happened here. This is a useful command to know while you’re\
    \ getting your vim setup just right, and it makes you feel cool as well.\n\n###\
    \ I Was Promised Color Schemes!\n\nOkay, look, all of this was just ground work\
    \ we had to get through to get you your colors on a permanent basis. Adding a\
    \ color scheme to vim is a two step process:\n\n1.  Install a color scheme.\n\n\
    2.  Tell vim to use it.\n\nAnd the easiest way to accomplish step 2 is in your\
    \ `.vimrc` file.\n\n#### Picking a Color Scheme\n\nThere are a ton of pre-built\
    \ color schemes out there for vim. After all, people have been using it for more\
    \ than 20 years, and everybody loves colors. There are many places to go to peruse\
    \ available schemes and find one that fits your own personal style, a few of which\
    \ are listed in [Appendix 1](#chap30.xhtml_color-schemes) .\n\nFor the purpose\
    \ of this section, we’re going to install the [Tomorrow Theme](https://github.com/chriskempson/tomorrow-theme/tree/master/vim),\
    \ because it comes with a few nice and elegant variations, and because it’s the\
    \ one that I use right now. More specifically, I use “Tomorrow Night Eighties,”\
    \ and therefore–at least for a little while–so will you. I’m all opinionated,\
    \ remember?\n\nSo, to install the scheme, download the contents of the `colors`\
    \ folder in the github repository. You should see a list of files, all of which\
    \ have a `.vim` extension. Now it’s time to do some diving.\n\nIn your home directory\
    \ there’s a hidden folder called `.vim`, which is where vim keeps all of its configuration\
    \ stuff. Inside that directory is a folder called “colors,” and that’s where you\
    \ want to put the color schemes you just downloaded. We’re going to discuss a\
    \ better way to do this [soon](#chap11.xhtml_plugins), but for now just move those\
    \ files from wherever you downloaded them to `~/.vim/colors`. On OSX I would do\
    \ this:\n\n```\n1 $ mv ~/Downloads/colors/*.vim ~/.vim/colors\n```\n\nBut however\
    \ you get the files in place, you’ll want to end up in a situation where the output\
    \ of `ls ~/.vim/colors` looks like this:\n\n```\n1 Tomorrow-Night-Blue.vim\n2\
    \ Tomorrow-Night-Bright.vim \n3 Tomorrow-Night-Eighties.vim\n4 Tomorrow.vim\n\
    ```\n\nYou get the idea. Once that’s done it’s time to edit your `.vimrc` file\
    \ some more. Open it up in vim and add this line:\n\n```\n1 colorscheme Tomorrow-Night-Eighties\n\
    ```\n\nAnd then hit `<esc>` to go back to normal mode. Save your work (`:w`),\
    \ and then call on our old friend `:so %` to see your new color scheme in all\
    \ its glory.\n\n### Using Keymaps to Get Unlost\n\nLet’s add one more line to\
    \ your `.vimrc`, both as instruction and because it’s useful.\n\nFrom time to\
    \ time your cursor can get lost on screen. It’s nobody’s fault, screens these\
    \ days are large and cursors are small. Therefore a lot of people like having\
    \ their editor highlight the line where the cursor is sitting. Given vim’s line-editing\
    \ abilities, this isn’t a terrible idea. There are definitely times where I want\
    \ my cursor line highlighted, but not *all* the time. So let’s add a keymap to\
    \ `.vimrc` that allows us to highlight and un-highlight the current line at will.\
    \ Paste the following into your `.vimrc` file:\n\n```\n1 nnoremap <silent> <F4>\
    \ :set cursorline!<CR>\n```\n\nThe heart of this line is the command\n\n```\n\
    1 `:set cursorline!`\n```\n\nAll of that stuff before the command is simply a\
    \ way to tell vim that we want it to do something when we press the `<F4>` key.\
    \ Let’s examine the command in excruciating detail.\n\n*   As we’ve learned before,\
    \ if you type `:` at the beginning of something it tells vim that you’re sending\
    \ it a command.\n\n*   The `set` command tells vim that we’re going to, well,\
    \ *set* an option. If we set things from the command line in vim it will be set\
    \ for this session, if we set them in `.vimrc` they will be set for every vim\
    \ session.\n\n*   The `cursorline` option tells vim to highlight the line where\
    \ the cursor is right now.\n\n*   The `!` at the end of the option tells vim to\
    \ toggle the `cursorline` option. If it’s currently on, turn it off and vice versa.\n\
    \n*   The `<CR>` at the end tells vim to simulate pressing the `<enter>` key.\
    \ Remember, if a command begins with a colon it has to end with an `<enter>`.\n\
    \n## 4. Interlude: The Joy of a Good Cheat Sheet\n\nWhile you’re learning vim\
    \ it can be hard to remember all the commands and controls and letters and combinations\
    \ and stuff, and sometimes no matter how much you ask your brain to pull up the\
    \ one you need it’s just not going to do it.\n\nWhich is why it’s a good idea\
    \ to have someone help you out. A simple memory prompt hung up on the wall behind\
    \ your computer can spur your brain back into activity.\n\nThere are a lot of\
    \ cheat sheets out there, most of which are the product of a lot of time and effort\
    \ on the part of the creator, who was usually trying to create the “perfect” cheat\
    \ sheet, meaning the one that works best for the way they think.\n\nIn fact, since\
    \ I first wrote this “interlude” I have created my own cheat sheet, which is included\
    \ in your *Painless Vim* download. And hey, you spent the money on a vim book,\
    \ you deserve a cheat sheet to go along with it. My cheat sheet is a distillation\
    \ of all the commands and actions that I find myself using most frequently.\n\n\
    But if you’re overburdened with cash, or just don’t particularly care for the\
    \ *Painless Vim* cheat sheet then read on, my friend. I won’t be offended, I promise.\n\
    \nFor my money ^([17](#chap35.xhtml_fn-money)) the best one out there is the [“Beautiful”\
    \ Vim Cheat Sheet](http://vimcheatsheet.com/), because it’s clean, well laid out,\
    \ and informative. When you start out you can just focus on the movement arrows\
    \ that dominate the top left corner, and after a while you will start to see that\
    \ the whole thing is packed with things you can use.\n\nThere are a number of\
    \ [other good choices](#chap30.xhtml_cheat-sheets). The point of this interlude\
    \ is to spend a little time finding one that makes sense to you. But the “Beautiful”\
    \ one has earned itself a permanent spot on the wall behind my monitor. ^([18](#chap35.xhtml_fn-Until))\n\
    \n## 5. Moving Around in Vim: Grown Up Steps\n\nOkay, now that the *serious business*\
    \ of getting a color scheme set up is taken care of, let’s get back to moving\
    \ around.\n\nIt’s often said that programming is roughly 90% thinking and 10%\
    \ typing ^([19](#chap35.xhtml_fn-programmers)). While this may be true, I would\
    \ add that a fair amount of time is also spent getting the cursor where you need\
    \ it to be. Let’s say you made a change on line 15, and from there you need to\
    \ move the end of the file to add a new method. In a regular editor you have a\
    \ few choices: you can either press the down arrow a bunch of times, or take one\
    \ hand off the keyboard entirely and click on the last line of the file. Vim has\
    \ a better idea:\n\n```\n1 G\n```\n\nThat’s it! Upper-case `G`, all by itself,\
    \ will move your cursor to the last line of the file. Want to get back to the\
    \ top of the file?\n\n```\n1 gg\n```\n\nAnd you’re there. The point is that moving\
    \ around is supremely easy in vim, once you get the hang of it. So, let’s take\
    \ a look at some of the most used *motions*^([20](#chap35.xhtml_fn-motions)) in\
    \ vim:\n\nsimple motions\n\n| Keystroke | Motion |\n\n| --- | --- |\n\n| h | move\
    \ right |\n\n| j | move down |\n\n| k | move up |\n\n| l | move left |\n\n| b\
    \ | previous word |\n\n| e | end of word |\n\n| ctrl+d | move down by 1/2 screen\
    \ |\n\n| ctrl+f | move down by 1 screen |\n\n| ctrl+u | move up by 1/2 screen\
    \ |\n\n| ctrl+b | move up by 1 screen |\n\n| gg | jump to the start of the file\
    \ |"
