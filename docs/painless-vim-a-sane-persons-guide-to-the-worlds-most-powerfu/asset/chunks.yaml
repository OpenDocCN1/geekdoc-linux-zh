    \ want everything in the whole buffer unfolded you can power up your *reduce*\
    \ command by shifting to uppercase: `zR`.\n\nThe opposite is `zm` and `zM`. Lowercase\
    \ folds up the innermost folds all across the document, uppercase folds up *everything*.\n\
    \nOkay, that was a lot of commands interspersed with a lot of words, so we’re\
    \ going to go for the big bad table o’ commands now for easy reference. (This\
    \ table is also included in the [Appendix](#chap31.xhtml_Appendix-2))\n\nFolding\
    \ Commands\n\n| Command | Option |\n\n| --- | --- |\n\n| `zc` | Close current\
    \ fold |\n\n| `zo` | Open current fold |\n\n| `za` | Toggle current fold |\n\n\
    | `zC` | Close all possible folds at cursor |\n\n| `zO` | Open all possible folds\
    \ at cursor |\n\n| `zA` | Toggle all possible folds at cursor |\n\n| `zr` | Reduce\
    \ folding by one level throughout the document |\n\n| `zm` | Increase folding\
    \ by one level throughout the document |\n\n| `zR` | Open all folds |\n\n| `zM`\
    \ | Fold everything |\n\n## 15. Searching and (More Importantly) Finding\n\nVim\
    \ wouldn’t be what it is without a good search function built in to the editor.\
    \ Vim’s search functionality is super powerful and surprisingly intuitive…once\
    \ you get used to it.\n\nBefore we get started, I want to point out that vim searches\
    \ come in two flavors: **forward** and **backward**. For each *type* of search,\
    \ you can do that search from your cursor to the *end* of the document (which\
    \ is the **forward** style) or from your cursor to the *beginning* of the file\
    \ (which is the **backward** style). In most cases, searches will wrap when they\
    \ hit the end (or beginning) of the document. I’ll list the search commands with\
    \ the **forward** style first and then the **backward** style.\n\n### Whole File\
    \ Searches: `/` and `?`\n\nOne of the most common types of searches you’ll do\
    \ is searching the entire document for a word or term. To start this kind of search\
    \ hit `/` or `?` and your cursor will jump down to the command line on the bottom\
    \ of the screen. Type what you’re searching for and press `<enter>`. Vim will\
    \ highlight all the occurrences of the word you typed, and position the cursor\
    \ at the occurrence of the word closest to your cursor. You can then jump to the\
    \ next match using the `n` button. Remember that if you started the search using\
    \ `?` the “next” match will be the match closer to the *beginning* of the document,\
    \ not the *end*.\n\nBut what if you want to *reverse* the direction of your search?\
    \ Let’s say you hit `?` when you started your search, but you want to start moving\
    \ toward the *end* of the file now? No problem. Pressing `N` (that’s an uppercase\
    \ N instead of a lowercase n) will jump to the *previous* match, meaning the closest\
    \ match *against* your direction of search.\n\nConfused yet? I strongly encourage\
    \ you play with these searches for a few moments in the `searching.txt` file,\
    \ looking for the [Illuminati’s secret mind control word](https://en.wikipedia.org/wiki/Fnord#Definition_and_usage).\n\
    \n### Find Me Another One of These: `*` and `#`\n\nSometimes you want to find\
    \ the next instance of the word you’re on. This is especially useful in programming,\
    \ where you might be trying to find all the places where a certain function is\
    \ called or some such tomfoolery. In `searching.txt` you might want to find another\
    \ copy of a word like “fnord”. In Vim this is simple: position your cursor on\
    \ the word you want to find and press `*` or `#`. You can jump between matches\
    \ using `n` and `N`, just like with the whole file searches.\n\n### Line Searching:\
    \ `t/T` and `f/F`\n\nThere are times where you just want to jump a few words forward\
    \ or back along a line without hitting `w` or `b` over and over again. Once again,\
    \ vim is ready, this time with not one but *two* types of searches.\n\nIf you\
    \ type `t`*x* (or `T`*x*, for a reverse search) your cursor will jump “to” the\
    \ closest occurrence of *x* in the line you’re on. However, this might not work\
    \ the way you were expecting. This “to” search will drop your cursor one character\
    \ *before* the letter you searched for, like so:\n\n```\n1  | I'll Be There For\
    \ You/When the Rain Starts To Fall \n2 -> tF \n3  I'll Be There| For You/When\
    \ the Rain Starts To Fall\n```\n\nI don’t know *why* vim does this, it just does.\
    \ It’s worth noting that when you do a reverse search using `T` your cursor will\
    \ be positioned one character *ahead* of the letter you typed. Again, I don’t\
    \ know why. But at least it’s consistent.\n\nFortunately, you’ve also got the\
    \ `f`*x* search method, which works the way you would expect:\n\n```\n1 | I'll\
    \ Be There For You/When the Rain Starts To Fall   \n2 ->fF \n3 I'll Be There |For\
    \ You/When the Rain Starts To Fall\n```\n\nIn both cases, you use `;` to jump\
    \ to the next match and `,` to jump to the previous match, unless you’ve [remapped\
    \ the comma key](#chap19.xhtml_what-map), but we won’t get to that for a couple\
    \ more chapters yet.\n\n### R…R…Regular Expressions?!?\n\nIf you are already a\
    \ fan of regular expressions for text manipulation then this is a good section\
    \ for you. If you’re not sure what a `/reg(ular)\\s?ex(p|pression)/` is than I\
    \ would point you to some [excellent](http://www.amazon.com/gp/product/0596528124/ref=as_li_ss_tl?ie=UTF8&camp=1789&creative=390957&creativeASIN=0596528124&linkCode=as2&tag=httpnatedicco-20)\
    \ [resources](http://www.regular-expressions.info/) on the topic, and probably\
    \ suggest that you skip the rest of this chapter. It’s not that I don’t want you\
    \ here! It’s just that *learning* regular expressions isn’t exactly *painless*.\
    \ It’s *valuable*, but it takes time and effort."
