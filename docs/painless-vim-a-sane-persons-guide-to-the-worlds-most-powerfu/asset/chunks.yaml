  trans: "\n\n每当你剪切（yank）或删除文本时，它们并不会消失在宇宙中。就像现代操作系统一样，vim 将这些文本保留在一个操作系统称为 `clipboard`（剪贴板）的区域，但\
    \ vim 称 `register`（寄存器）。然而，与大多数操作系统不同，vim 提供了**许多** `registers` 供你使用，而不仅仅是一个。当你输入\
    \ `dd` 或 `yy` 时，vim 会将你的文本复制到它的默认寄存器，这个寄存器矛盾地命名为“无命名寄存器”（the unnamed register）。同样，当你按下\
    \ `p` 时，vim 会直接从这个无命名 `register` 中粘贴文本，而不会问任何愚蠢的问题。\n\n### 向命名寄存器问好\n\n不过，你也可以许多其他寄存器，并使用你已经熟悉并喜欢的各种操作来访问这些寄存器。例如，如果我们从下面这个极其迷人的句子中剪切单词“cat”：\n\
    \n```\n1 I have a cat bed.\n```\n\n我们想要确保在下次剪切或复制东西时不会覆盖这个猫，所以我们将将其存储到一个`named\
    \ register`（命名寄存器）。vim 中的每个寄存器都以双引号 `\"\"` 为前缀。命名寄存器每个用英语字母表中的小写字母命名。所以你有 `\"\
    a\"`、`\"b\"`、`\"c` 等，我们将其读作 `register a`、`register b`、`register c` 等。由于我们要存储的是一只猫，让我们把它放在\
    \ `register c` 吧。我们通过告诉 vim 使用哪个寄存器以及执行什么操作来实现。因此，将光标置于 cat 中字母 c 之前，并输入：\n\n\
    ```\n1 \"cdw\n```\n\n在 vim 语言中，这意味着：“你知道寄存器 c 吗？好的，很好。剪切这个词并放进去。”就这样，你的文本被存储在\
    \ `\"c\"` 中，我们把它读作 `register c`。现在，如果我们想把这只猫重新粘贴到文本的其他地方，只需要输入：\n\n```\n1 \"cp\n\
    ```\n\n你就大功告成了。\n\n但无命名寄存器呢？你知道的，就是*所有*东西都会被剪切或复制进去的寄存器。如果我们想从那个寄存器中粘贴东西怎么办？\n\
    \n嗯，我们只需像往常一样按下 `p` 即可。但如果你想*显式*粘贴无命名寄存器中的任何内容，你可以连续使用两个双引号直接访问无命名寄存器，如下所示：\n\n\
    ```\n1 \"\"p\n```\n\n### 小变化，大影响\n\n当你复制或剪切文本时，它会被存储在两个地方。第一个是无命名寄存器。然而，第二个取决于你对文本所做的更改。如果你只是用\
    \ `y` *复制*（yank）了一些文本，那么第二个副本将存储在复制寄存器（yank register）中，我们称之为 `0`。如果你剪切了几个单词而不是整行，你的第二个副本就在“小范围删除”寄存器中：`-`。但当你剪切一行或多行时，情况就变得更有趣了。\n\
    \n记住 vim 是程序员的文本编辑器，因此它意识到代码行非常重要。所以，每当你剪切一行或多行时，你刚刚剪切的文本就会存储到寄存器 `1` 中。如果你剪切另一整行，它不会覆盖存储在\
    \ `1` 中的内容，而是将其推送到 `2`，而存储在寄存器 `2` 中的文本会移动到寄存器 `3`，以此类推，直到寄存器 `9`。通过这种方式，你可以在编辑文本时携带九个主要的代码片段。更好的是，这些寄存器在关闭\
    \ vim 时不会被清除。\n\n为了更好地掌握这一点，让我们在 `registers.txt` 文件中尝试剪切行并在文件中移动它们。在文件开头有四行顺序错的行，如下所示：\n\
    \n```\n1 - Four\n2 - Two\n3 - Three \n4 - One\n```\n\n我们可以通过使用 `dd` 删除每一行来轻松地让它们恢复顺序。这会将它们推入大范围删除寄存器栈（large\
    \ delete register stack）。但如果你不记得它们存储的顺序怎么办？Vim 会为你解决后忧。如果你在普通模式下输入 `:reg`，会弹出一个窗口，列出所有当前寄存器以及它们存储的内容。你甚至可以从这个界面输入命令（例如，`\"\
    1p`）。否则，你只需要查看行的顺序，并按正确的顺序将它们粘贴回文本中。\n\n### 真正的删除操作\n\n但如果你想去掉某些东西，同时又不覆盖无命名寄存器，也不将其添加到大范围删除栈中呢？有一个特殊的寄存器，被亲切地称为“黑洞寄存器”（the\
    \ black hole register），可以专门用于该目的。你无法从这个寄存器中*提取*文本，就像无法从真正的黑洞中提取物质一样。当你只想让某物消失时，它非常有用，你使用\
    \ `_` 来访问它。所以如果你有这样一行文本：\n\n```\n1 I hate everything!\n```\n\n并且你想让它彻底消失，只需将光标置于该行的任何位置并输入\n\
    \n```\n1 \"_dd\n```\n\n即可让它在旋涡中消失，而不会触碰你任何寄存器中的任何内容。\n\n一次性吸收这么多信息很大，所以让我们用一个漂亮的表格来总结一下：\n\
    \n命名寄存器 (Named Registers)\n\n| 寄存器 快捷键 | 名称 | 存储的内容 |\n| --- | --- | --- |\n|\
    \ `\"\"` | 无命名寄存器 (The Unnamed Register) | 你想要的任何内容 |\n| `\"_` | 黑洞寄存器 (The Black\
    \ Hole Register) | 你想掉任何内容 |\n| `\"\\` | 上一个寄存器 (Last Register) | 上一次搜索的内容 |\n\
    | `\"-` | 删除寄存器 (Delete Register) | 上一次少于一行的剪切或复制 |\n| `\"1\"` | 删除寄存器 (Delete\
    \ Register) | 上一次一行或多行的剪切或复制 |\n| `\"2\"` | 大范围删除寄存器 (Big Delete Register) | 上一次一行或多行的剪切或复制\
    \ |\n| `\"3\"` | 大范围删除寄存器 (Big Delete Register) | 删除操作运行栈 |\n| `\"\"+\"` | 系统剪贴板\
    \ (System Clipboard) | 上一次剪切或复制 |\n| `\"a\"` | 命名寄存器 (Named Registers) | 你想要的任何内容\
    \ |\n| `\"A\"` | 追加寄存器 (Append Registers) | 覆盖 |\n\n## 14. 文本折叠. :h folding\n\n\
    这不是一个复杂的课题，也不是巨大的课题。但了解如何处理 vim 中的文本折叠（folding）是值得的，因为它可以让你。\n\n如果你只是想玩玩折叠，可以从命令行运行\
    \ `:set foldmethod=indent`。这将给你一个简单的折叠方案供你尝试，并决定是否要保留它。如果你喜欢，始终可以在 `.vimrc` 文件中将其永久化。`indent`\
    \ 折叠方法只需查看行首的空白字符，并折叠所有缩进程度相同或更多的内容。所以如果你有像这样的段落：\n\n```\n1 <html>\n2   <head>\n\
    3     <title>Old School Simple HTML!</title>\n4   </head>\n5   <body><body>\n\
    6     <p> I am a simple paragraph!</p>\n7   </body>\n8 </html>\n```\n\n那么，你可以将光标置于\
    \ `<head>` 标签的开头并触发折叠机制。这样做之后，你将得到：\n\n```\n1   <html>\n2   +--- 6 行: <head>-------------------------\n\
    3   </html>\n```\n\n这可能不是你完全预期的，但这是你告诉 vim 要做的。与该行缩进相同的所有内容都会被很好地折叠起来。如果你只是想隐藏\
    \ `<head>...</head>` 部分的内容，你可以将光标移动到下一行并从那里开始折叠，或者你可以尝试使用*语法*（syntax）折叠。\n\n"
- fmt: "\nRun `:set foldmethod=syntax` to make the switch. While syntax folding is\
    \ more or less what you would expect, there are some new caveats involved in it’s\
    \ use.\n\nThe first is that foldable areas in a language are defined by the same\
    \ module that `vim` uses to determine syntax coloring. If that module doesn’t\
    \ have information on what constitutes a foldable area you won’t be able to use\
    \ syntax folding. This isn’t a problem in languages like, C/C++, Java, ruby, python,\
    \ etc. which all have large, active communities that have ensured the language\
    \ modules are complete. But if you’re using a more uncommon or unsupported language\
    \ the support is somewhat hit and miss. Still, it’s a little closer to what you\
    \ were probably expecting.\n\n### Okay, But How Do I Fold Things?\n\nIt’s a fair\
    \ question. Let’s go back to indent-style folding quick and work through some\
    \ basic scenarios from there. In this mode you can position your cursor at the\
    \ beginning of a line and fold all the lines in that region with `zc`. To reopen\
    \ a folded region you type `zo` (The “o” is “open”). The cool kids use `za` to\
    \ toggle a section between its open and closed states, but it’s worth knowing\
    \ all three commands, just in case.\n\nBut wait, there’s more! (There’s always\
    \ more). Using commands that operate on a single fold is such a drag, no? If you\
    \ want to operate on entire passages all at once there are a set of commands that\
    \ do that too. Let’s say you’ve got some python-esque code like the following:\n\
    \n```\n1 friends = ['Monique', 'Rachelle', 'Toby', 'Russ', 'Francis', 'Regina']\n\
    2 for name in friends:\n3 \t if name != 'bob':\n4   \t\tprint \"Hello {name}!\"\
    .format(name=name)\n```\n\nOkay, I’m not a python genius. But that’s not the point.\
    \ The point is that you can fold the entire `for` loop as well as the sub-folds\
    \ within using the `zC` command. Yep, using a capital letter makes the folding\
    \ commands work recursively instead of individually. `zO` and `zA` work as you\
    \ would expect them to.\n\nBut let’s say you don’t care where your cursor is and\
    \ you just want to see a lot more of your file than you can at present. That’s\
    \ where `zr` comes in. When you type `zr` you reduce folding by one level document-wide.\
    \ So if you have a fold inside a fold you will now only have one fold. If you\
    \ want everything in the whole buffer unfolded you can power up your reduce command\
    \ by shifting to uppercase: `zR`.\n\nThe opposite is `zm` and `zM`. Lowercase\
    \ folds up the innermost folds all across the document, uppercase folds up everything.\n\
    \nOkay, that was a lot of commands interspersed with a lot of words, so we’re\
    \ going to go for the big bad table o’ commands now for easy reference. (This\
    \ table is also included in the [Appendix](#chap31.xhtml_Appendix-2))\n\n####\
    \ Folding Commands\n\n| Command | Option |\n| --- | --- |\n| `zc` | Close current\
    \ fold |\n| `zo` | Open current fold |\n| `za` | Toggle current fold |\n| `zC`\
    \ | Close all possible folds at cursor |\n| `zO` | Open all possible folds at\
    \ cursor |\n| `zA` | Toggle all possible folds at cursor |\n| `zr` | Reduce folding\
    \ by one level throughout the document |\n| `zm` | Increase folding by one level\
    \ throughout the document |\n| `zR` | Open all folds |\n| `zM` | Fold everything\
    \ |\n\n## 15. Searching and (More Importantly) Finding\n\nVim wouldn’t be what\
    \ it is without a good search function built in to the editor. Vim’s search functionality\
    \ is super powerful and surprisingly intuitive…once you get used to it.\n\nBefore\
    \ we get started, I want to point out that vim searches come in two flavors: forward\
    \ and backward. For each type of search, you can do that search from your cursor\
    \ to the end of the document (which is the forward style) or from your cursor\
    \ to the beginning of the file (which is the backward style). In most cases, searches\
    \ will wrap when they hit the end (or beginning) of the document. I’ll list the\
    \ search commands with the forward style first and then the backward style.\n\n\
    ### Whole File Searches: `/` and `?`\n\nOne of the most common types of searches\
    \ you’ll do is searching the entire document for a word or term. To start this\
    \ kind of search hit `/` or `?` and your cursor will jump down to the command\
    \ line on the bottom of the screen. Type what you’re searching for and press `<enter>`.\
    \ Vim will highlight all the occurrences of the word you typed, and position the\
    \ cursor at the occurrence of the word closest to your cursor. You can then jump\
    \ to the next match using the `n` button. Remember that if you started the search\
    \ using `?` the “next” match will be the match closer to the beginning of the\
    \ document, not the end.\n\nBut what if you want to reverse the direction of your\
    \ search? Let’s say you hit `?` when you started your search, but you want to\
    \ start moving toward the end of the file now? No problem. Pressing `N` (that’s\
    \ an uppercase N instead of a lowercase n) will jump to the previous match, meaning\
    \ the closest match the end.\n\n### Find Another One of These: `*` and `#`\n\n\
    Sometimes you want to find another instance. This is especially useful in programming:\
    \ position your cursor on the word you want to find and press `*` or `#`. You\
    \ can jump between matches using `n` and `N`.\n\n### Line Searching: `t/T` and\
    \ `f/F`\n\nThere are times where you just want to jump a few words forward or\
    \ back along a line without hitting `w` or `b` over and again. Once again, vim\
    \ is ready, this time with not one but two types.\n\nIf you type `t`*x* (or `T`*x*,\
    \ for a reverse search) your cursor will jump to the closest occurrence of x in\
    \ the line. However, this might not work the way you were expecting. Like so:\n\
    \n```\n1 | I'll Be There For You/When the Rain To Fall \n2 -> tF \n3  I'll Be\
    \ There| For You/When the Rain To Fall\n```\n\nThis “to” search will drop your\
    \ cursor one character before the letter you searched for. Again, I don’t know\
    \ why. But at least it’s consistent.\n\nFortunately, you’ve also got the `f`*x*\
    \ search method, which works the way you would expect:\n\n```\n1 | I'll Be There\
    \ For You/When the Rain To Fall   \n2 ->fF \n3 I'll Be There |For You/When the\
    \ Rain To Fall\n```\n\nIn both cases, you use `;` to jump to the next match and\
    \ `,` to jump to the previous match, unless you’ve remapped the comma key (#chap19.xhtml_what-map),\
    \ but we won’t get to that for a couple more chapters yet.\n\n### R…R…Regular\
    \ Expressions?!?\n\nIf you are already a fan of regular expressions for text manipulation\
    \ then this is a good section for you. If you’re not sure what `/reg(ular)\\s?ex(p|pression)/`\
    \ is than would point you to some resources on the topic, and probably suggest\
    \ that you skip the rest of this chapter. It’s not that I don’t want you here!\
    \ It’s just that *learning* regular expressions isn’t exactly *painainless*. It’s\
    \ *valuable*, but it takes time and effort.\n"
