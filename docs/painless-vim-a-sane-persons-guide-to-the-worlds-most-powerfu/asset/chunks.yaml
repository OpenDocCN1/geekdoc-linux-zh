- fmt: '

    Every once in a while you want to get from place to place quickly and easily without
    counts, without searches, without doing anything but telling vim where you would
    like to go, thank you so very much. Kind of like a bookmark in your browser, but
    for a text file. That’s what `marks` are for.


    A mark is just a pointer to a line in a file. If you set a mark at line seven
    of a file that’s where it will stay, giving you an easy way to return to line
    seven. But vim wouldn’t leave anything that boring or underdeveloped.


    The marks are roughly divided into two groups: `lowercase` marks and `uppercase`,
    or `file`, marks. The obvious difference between the two is how you refer to the
    mark. The important difference is that lowercase marks are limited to lines inside
    a single file, while uppercase marks can jump freely to any line of `any` file.
    The two types of marks work in much the same way with slight differences. Let’s
    look at how to use lowercase marks first.


    To set a mark you type `m` followed by a letter in normal mode. That’s all there
    is to it! Unless of course you want to get `back` to that mark later. Then there’s
    a little more. There are two ways to return to a mark. If you want to return to
    the exact character on the exact line where you set the mark you type a back tick
    (usually the same key as `~`, right next to the number 1 on your keyboard) and
    the letter. So if you set mark `a` on line 5 you could then go anywhere else you
    want in the file and jump back to line 5 by typing


    ```

    1 `a

    ```


    If you only want to get to the `line` where you set the mark you can use a straight
    single quote (same key as double quotes, next to enter) and the letter. To get
    back to line 5 at the beginning you can just type


    ```

    1 ''a

    ```


    And you’re good. But wait, there’s more! (There’s always more.) Whenever you jump
    to a mark, vim remembers where you jumped *from*, and stores it as a special mark
    `’`. So you can jump to line 5 with your `a` mark, make your change, and then
    just hit the single-quote key twice and you’re back where you started.


    Naturally, you can do this with any letter from `a` to `z`, meaning you’ve got
    twenty-six marks you can set in any file you’re working on. But what about when
    you’re working on a bunch of files? That’s where the uppercase marks come in.


    Uppercase marks behave the same way as lowercase marks, with one notable exception:
    they allow you to jump from one file to another with the greatest of ease. Like
    the lowercase marks, uppercase marks are set on a specific character of the file,
    meaning not only can you get from `sample.c` to `sample.h` in a single motion,
    you can get to line 471 of `sample.h` from anywhere with a single motion. But
    as much fun as it is to write c code, let’s talk about an uppercase mark that
    is instantly useful to every vim user everywhere. This is an exercise that you’ll
    definitely want to do.


    *   Open your `.vimrc` file in vim.

    *   Type `mV`

    *   Open any other file in vim.

    *   Type `''V`


    Boom! You can now get to your `.vimrc` configuration file from anywhere at any
    time. While it’s true that you will eventually stop playing around with your configuration
    on a daily basis, when you’re first learning and configuring vim to work for you
    instead of against you this particular mark can save you a lot of time.


    ## 9. Modes at Last


    Given that modes are an integral part of vim, given that an understanding of modes
    is integral to using vim well, why did I decide to put off the chapter on vim’s
    modes until way into the text?


    There are a couple of reasons. The first one is that I believe in learning by
    doing. By now switching between normal mode and insert mode should be fairly familiar,
    so the concept doesn’t seem so foreign. So now you’re ready to learn a bit more.
    So, without further ado, let’s get into vim’s modal nature. This is often the
    thing that scares people off, so we’re going to take it easy, and remember to
    breathe. Remember: you’ve already been using this stuff, we’re just putting names
    to things you’ve already been doing.


    ### What Modes Are


    The simplest way to think about modes is that they change your keyboard. In `insert`
    mode the keys put letters on the screen, just like in a regular ol’ word processor.
    But when you switch into a different mode your keys change from letter-putters
    into command-makers. The `h j k l` keys go from being four letters to being arrow
    keys, `.` changes from a full stop into the “do it again” button, and so forth.
    So far so good. You’ve been using both of these modes for a while now, and none
    of this is much of a surprise. What you don’t know is that you’ve been using a
    couple of other modes as well, and now that I’ve mentioned them I’m maddeningly
    going to go back to discussing normal mode and insert mode before I talk about
    two other modes that you never knew you were using.


    ### What is Normal, Anyway?


    In *Mostly Harmless*, the fifth book in Douglas Adams’ *Hitchhiker’s Guide* Trilogy,
    there are animals called “Perfectly Normal Beasts” that suddenly appear out of
    nowhere on one side of the plain. They’re called “Perfectly Normal Beasts” because
    someone was wise enough to realize that calling them would help people accept
    their impossible behavior as something that just *happens*.


    Normal mode in vim is almost entirely unlike that, but there’s a similar concept
    at work. As you know, `normal` mode is where you issue commands, not where you
    edit text. Most newcomers to vim find this ironic in the extreme. After all, vim
    is a `text` editor, not a `command` editor. Shouldn’t editing text be the “normal”
    mode and “doing weird stuff with counts and motions” be the “special” mode?


    The answer, in vim’s mind, is “no”. And if you think about how you write you’ll
    see why. In software development, you don’t just sit down, pound out code at 80
    words per minute for 8 hours and then go home, a job well done. Software is *incrementally*
    and *iteratively*, with a lot of time being spent looking at the interconnectedness
    of your various methods and variables and whatnot. You write a function header,
    give it some space between curly braces for the function body, realize you forgot
    a needed parameter, add that, write some function code, realize you’ll need to
    call a new function you haven’t written yet, dummy that one up, and so forth.
    Coding isn’t as much like *writing* as it is like *drawing*.


    When you draw, you start with some guide lines, an oval for a face, with crossed
    lines to give you dimensions. Rough outlines of background and scenery get sketched
    in, and little by little, line by line, the rough outlines are added unto, refined
    and turned into a finished product. It’s hard to say where they made the jump,
    but out of all those seemingly disconnected lines a work of art emerges.


    Code is the same way. We add line upon line, sometimes putting in scaffolding
    code that will only be there for a little while, then be discarded when the logic
    it was supporting can stand on its own. It’s hard to say when, but somewhere in
    the process that seemingly random collection of lines of code turns into a finished
    product.

