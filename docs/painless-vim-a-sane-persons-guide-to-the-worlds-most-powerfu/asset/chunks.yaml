  trans: "\n\n所以，现在你有两个选择。你可以退出 vim 并重新启动以让你的更改生效，或者可以使用一些 vim 的奇妙操作。不需要退出 vim，输入以下命令：\n\
    \n```\n1 :so %\n```\n\n现在，在你合上这本书之前，如果你觉得由于我要给你抛出一些糟糕的惊喜（比如 `.vimrc` 文件和晦奥的 `:so\
    \ %` 命令）感到难过，请听我慢慢道。你刚刚所的操作是告诉 vim `source`（源）当前文件。`so` 命令是 `source` 的缩写，而 `%`\
    \ 是“当前文件”的缩写。看到了吗？这里并没有发生什么可怕的事情。在你配置好 vim 的过程中，这是一个非常实用的命令，而且能让你觉得自己很酷。\n\n##\
    \ 我承诺过会有配色方案！\n\n好了，听着，这一切只是我们为了让你永久地使用颜色而必须完成的准备工作。为 vim 添加配色方案是一个分两步的过程：\n\n\
    1. 安装配色方案。\n2. 告诉 vim 使用它。\n\n完成第 2 步最简单的方法是在你的 `.vimrc` 文件中进行。\n\n### 选择配色方案\n\
    \nvim 有大量的预构建的配色方案。毕竟，人们使用它已经超过 20 年了，而且每个人都喜欢颜色。有很多地方可以查阅可用的方案并找到一个适合你个人风格的，其中几个列在附录\
    \ 1 中。\n\n为了本节的目的，我们将安装 [Tomorrow Theme](https://github.com/chriskempson/tomorrow-theme/tree/master/vim)，因为它带有几个漂亮且优雅的变体，而且这也是我现在正在使用的。具体来说，我使用的是“Tomorrow\
    \ Night Eighties”，因此——至少在一段时间内——你也会使用。记得吗，我很有主见的人。\n\n所以，要安装该方案，请下载 github 仓库中\
    \ `colors` 文件夹的内容。你应该看到一个文件列表，所有文件的扩展名都是 `.vim`。现在是时候进行一些深入操作了。\n\n在你的主目录下，有一个名为\
    \ `.vim` 的隐藏文件夹，这是 vim 存放所有配置信息的地方。在该目录下有一个名为“colors”的文件夹，这就是你想把刚刚下载的配色方案放在那里。我们很快会讨论一种更好的方法，但现在只需将这些文件从你下载的任何地方移动到\
    \ `~/.vim/colors` 即可。在 OSX 上，我会这样做：\n\n```\n1 $ mv ~/Downloads/colors/*.vim ~/.vim/colors\n\
    ```\n\n但无论你如何将文件就位，你最终希望看到 `ls ~/.vim/colors` 的输出如下所示：\n\n```\n1 Tomorrow-Night-Blue.vim\n\
    2 Tomorrow-Night-Bright.vim \n3 Tomorrow-Night-Eighties.vim\n4 Tomorrow.vim\n\
    ```\n\n你明白我的意思了。一旦完成，就是该再次编辑你的 `.vimrc` 文件了。在 vim 中打开它并添加这一行：\n\n```\n1 colorscheme\
    \ Tomorrow-Night-Eighties\n```\n\n然后按下 `<esc>` 回到普通模式。保存你的工作（`:w`），然后调用我们的老朋友\
    \ `:so %` 来尽情欣赏新配色方案的华丽风采。\n\n### 使用快捷键映射防止迷失\n\n让我们在你的 `.vimrc` 中再添加一行，既作为一种说明，也因为它很有用。\n\
    \n偶尔你的光标可能会在屏幕上迷失。这不是任何人的错，现在的屏幕很大，而光标很小。因此，许多人喜欢让编辑器高亮光标所在的行。考虑到 vim 的行编辑能力，这并不是一个坏主意。确实有些时候我想高亮光标行，但并不是一直如此。所以，让我们在\
    \ `.vimrc` 中添加一个键映射，允许我们随时高亮和取消高亮当前行。将以下内容粘贴到你的 `.vimrc` 文件：\n\n```\n1 nnoremap\
    \ <silent> <F4> :set cursorline!<CR>\n```\n\n这一行的核心是命令\n\n```\n1 `:set cursorline!`\n\
    ```\n\n命令之前的所有内容只是告诉 vim 当我们按下 `<F4>` 键时想要让它执行某些操作。让我们仔细检查一下这个命令。\n\n* 正如我们之前学过的，如果你在开头输入\
    \ `:`，它会告诉 vim 你正在向它发送一个命令。\n* `set` 命令告诉 vim 我们将要……嗯，`set`（设置）一个选项。如果在 vim 命令行中设置，它将在当前会话中生效；如果我们在\
    \ `.vimrc` 中设置，它们将在每个 vim 会话中生效。\n* `cursorline` 选项告诉 vim 高亮光标当前所在的行。\n* 末尾的 `!`\
    \ 告诉 vim 切换 `cursorline` 选项。如果它目前开启，则关闭它，反之亦然。\n* 末尾的 `<CR>` 告诉 vim 模拟按下 `<enter>`\
    \ 键。记住，如果命令以冒号开头，它必须以 `<enter>` 结尾。\n\n## 4. 间歇：优秀备查表的快乐\n\n当你学习 vim 时，要记住所有的命令、控制键、字母、组合之类的是很的，有时候无论你如何要求大脑调出你需要的内容，它就是不听。\n\
    \n这就是为什么找人帮你是个好主意。在电脑后面的墙上挂一个简单的记忆提示就能让你的大脑重新活跃起来。\n\n有很多查询表，其中大多数是作者投入大量时间和精力的产物，他们通常试图创建一个“完美”的备查表，即最符合他们思维方式的那个。\n\
    \n事实上，自从我第一次写这个“间歇”以来，我就创建了自己的查询表，它包含在你的 *Painless Vim* 下载包中。嘿，你花钱买了本 vim 书，你值得拥有配套的查询表。我的查询表是我发现自己最频繁的所有命令和动作的精炼。\n\
    \n但如果你金钱充裕，或者只是不太在意 *Painless Vim* 的查询表，那么请继续读下去，朋友。我不会被冒意的，我保证。\n\n在我看来，市面上最好的是这个“漂亮的一个](http://vimcheatsheet.com/)，因为它整洁、布局良好且信息丰富。当你刚开始时，只需关注占据顶角的移动箭头，过了一段时间，你会发现整张表都满了你可以用的东西。还有许多其他不错的选择。这个间歇的目的是花一点时间找到一个对你有意义的表。\n\
    \n## 5. 在 Vim 中移动：上阶\n\n好了，现在设置配色方案这件正事已经处理完了，让我们回到移动操作。\n\n人们经常说，编程大约是 90% 的思考和\
    \ 10% 的打字。虽然这可能是事实，但我补充说，相当的时间也花在了将光标移动到你需要去的地方。假设你在第 15 行做了更改，从那里你需要移动到文件末尾添加一个新方法。在普通编辑器中，你有几种选择：你可以多次按下向下箭头，或者完全松开一只离开键盘，点击文件的最后一行。Vim\
    \ 有一个更好的主意：\n\n```\n1 G\n```\n\n就是这样！大写的 `G` 单独使用就会将光标移动到文件的最后一行。想回到文件顶部？\n\n\
    ```\n1 gg\n```\n\n你就到了。关键点在于，一旦你掌握了它，在 vim 中移动是极其轻易的。所以，让我们来看看 vim 中最常用的动作：\n\n\
    简单动作\n\n| 击键 | 动作 |\n| --- | --- |\n| h | 向右移动 |\n| j | 向下移动 |\n| k | 向上移动 |\n\
    | l | 向左移动 |\n| b | 上一个单词 |\n| e | 单词末尾 |\n| ctrl+d | 向下移动 1/2 屏幕 |\n| ctrl+f\
    \ | 向下移动 1 屏幕 |\n| ctrl+u | 向上移动 1/2 屏幕 |\n| ctrl+b | 向上移动 1 屏幕 |\n| gg | 跳到文件开头\
    \ |\n\n"
- fmt: "\n| Key | Description |\n| --- | --- |\n| G | jump to the end of the file\
    \ |\n| `^` | first non-whitespace character of the line |\n| $ | last non-whitespace\
    \ character of the line |\n| `0` | beginning of the line |\n\nThere are quite\
    \ a few more, but this will give us enough to get on with. Let’s play around with\
    \ these actions for a moment. Open a file and jump around a bit, moving to the\
    \ start and end of lines, bouncing around between words, etc.\n\nThe “screen”\
    \ motions are a little harder to pin down, but once you get used to them they\
    \ make sense. A “screen” consists of the number of lines that fit in your current\
    \ terminal window. So if your terminal window is 80 rows tall a screen is probably\
    \ 79 rows (one row is taken up for the status line), and a half screen is around\
    \ 40. But if you resize your terminal window the size of a “screen” changes accordingly.\
    \ Still, take some time getting used to “scrolling” through the file quickly using\
    \ the `1/2` and full screen motions, and getting a feel for how fast you can get\
    \ around.\n\nThese motions are useful by themselves, and the better you get at\
    \ them the more fun you’ll have in vim. But they get even better when combined\
    \ with the *operators* and *counts* we’ll meet in the next two chapters.\n\n##\
    \ 6. Operators 1: Changing Letters and Lines\n\nOkay so, you’ve got line numbers,\
    \ colors, and a basic idea of how to get your cursor from place to place. If you\
    \ wanted, you could stop here, move the cursor around in normal mode, press `i`\
    \ to go into insert mode, and make all your changes like you would in any other\
    \ editor. But vim has a better idea. You can make a lot of the most common changes\
    \ right from normal mode. For now we’re going to focus on the three most common\
    \ commands: Cut, copy, and paste.\n\nOnly they have different names in vim. Remember\
    \ that `vi` has been around since before the whole “clipboard” metaphor was ubiquitous.\
    \ So instead of “cut, copy, paste” it’s “delete, yank, put.” Let’s use a table\
    \ to introduce the commands for some of the most common operators:\n\n### basic\
    \ commands\n\n| Keystroke | Command |\n| --- | --- |\n| d | delete |\n| c | change\
    \ (delete and enter insert mode) |\n| y | yank (copy) |\n| u | undo |\n| p | put\
    \ (paste) |\n| r | replace (with whatever character you press next) |\n\nTo play\
    \ with these three commands, let’s open up a sample document that we don’t mind\
    \ really, *really* messing up. The sample documents folder has a file called `operators.txt`\
    \ that would be perfect for this purpose.\n\n### Operators Alone: Changing Single\
    \ Characters\n\n#### Killing Text\n\nFor the most part, operators by themselves\
    \ work on a single character. The first section in `operators.txt` has words with\
    \ duplicated letters like “ddoctor”, a not-uncommon mistake to make while typing.\
    \ Getting rid of the extra letter is easy. Just position your cursor on the duplicated\
    \ character and hit `d` (for delete) or `x` (for…a mnemonic that is supposed to\
    \ simulate striking something out on a typewriter. I’m guessing the majority of\
    \ people reading this book have never put in any serious time on a typewriter,\
    \ so that little mnemonic is kind of obsolete now).\n\n#### Resurrecting Text\n\
    \nOnce you’ve deleted text it’s not actually gone, it’s in a *register*, or a\
    \ special place in memory where vim can bring it back quickly if needed. In normal\
    \ mode, pressing `p` will “put” whatever text was most recently yanked or deleted\
    \ before the cursor.\n\n#### Two Fun Ones\n\nThere are two operators that are\
    \ useful in specific situations: `~` and `r`\n\n`~` Changes the case of a single\
    \ letter, while `r` lets you replace a single character with the next letter you\
    \ type.\n\nYou can use both of these to correct line 13 of `operators.txt`, which\
    \ reads:\n\n```\n1 \"you can't grep a fred tree\" --larry wall\n```\n\nUsing the\
    \ `~` operator three times and the `r` operator once you have a well formatted\
    \ quote, even if the attribution may be a bit suspect.\n\n### Operating on a Line\n\
    \nChanging single letters is fun and all, but sometimes you need to overhaul a\
    \ line of text instead of a single letter. Vim includes shortcuts for changing\
    \ a line into a more pleasing shape, like a shorter line, two of the same line,\
    \ or no line at all.\n\nBefore we dive in, we should take a look at how vim defines\
    \ what a “line” is and isn’t. Vim “lines” are everything between one press of\
    \ the `<enter>` key and the next, even if that spans several visible “lines” on\
    \ the screen. If word wrap is turned on vim will continue a line of text, like\
    \ so:\n\n```\n1 8 This is the eighth line of text in this document.\n2    It just\
    \ rambles on and on. You'll notice that even though \n3    there are several sentences\
    \ in this line, it still counts as a \n4    single \"line\" in vim, and there\
    \ isn't a new line number until \n5    I press enter.\n6 9 Okay, this is a new\
    \ line, because I pressed enter. Which is why\n7    there's a new line\n```\n\n\
    #### The End of the Line\n\nSometimes you need to cut the end of a line. In vim,\
    \ the uppercase versions of commands operate on the line from your cursor to the\
    \ end of the line. Find the following line in `operators.txt`:\n\n```\n1 Emacs\
    \ is a great system, it just needs\n\n```\n\nBut then we’re left with a sentence\
    \ search of a period. We can do better than that. Press `u` to restore the text\
    \ you deleted. Okay, this time we’re going to combine two commands: Move your\
    \ cursor one space right of the comma and press `D` to delete the text. Your cursor\
    \ should now be the comma, and you can just press `r.` to replace it with a period,\
    \ all without leaving normal mode.\n\nPut is a little different: lowercase `p`\
    \ will put the most recently yanked or deleted text *after* the cursor, while\
    \ uppercase `P` will put the text *before the cursor. Here’s a demonstration:\
    \ We’re going to say we cut the word `seven` from one line and want to paste it\
    \ into the next line:\n\n```\n1 four score and |years ago...\n```\n\nIn this situation,\
    \ pressing `p` to paste would result in:\n\n```\n1 four score and yseven\n```\n\
    Wait, no:\n```\n1 four score and yseven ears ago...\n```\n\nBecause the cursor\
    \ is “on” the letter y. But “yseven ears” isn’t what we want. but if you use `P`\
    \ then you get the expected result:\n\n```\n1 four score and seven years ago...\n\
    ```\n\n#### A Whole New Line\n\nTo make the `d/y/c` operators affect an entire\
    \ line simply duplicate the operator. So `yy` copies (or “yanks”) an entire line,\
    \ `dd` deletes the line, and `cc` “changes” the line. (That is: deletes the line\
    \ and puts you in insert mode). You can play with these as well in `operators.txt`,\
    \ starting on line 31.\n"
  raw: "| G | jump to the end of the file |\n\n| ^ | first non-whitespace character\
    \ of the line |\n\n| $ | last non-whitespace character of the line |\n\n| `0`\
    \ | beginning of the line |\n\nThere are quite a few more, but this will give\
    \ us enough to get on with. Let’s play around with these actions for a moment.\
    \ Open a file and jump around a bit, moving to the start and end of lines, bouncing\
    \ around between words, etc.\n\nThe “screen” motions are a little harder to pin\
    \ down, but once you get used to them they make sense. A “screen” consists of\
    \ the number of lines that fit in your current terminal window. So if your terminal\
    \ window is 80 rows tall a screen is probably 79 rows (one row is taken up for\
    \ the status line), and a half screen is around 40\\. But if you resize your terminal\
    \ window the size of a “screen” changes accordingly. Still, take some time getting\
    \ used to “scrolling” through the file quickly using the 1/2 and full screen motions,\
    \ and getting a feel for how fast you can get around.\n\nThese motions are useful\
    \ by themselves, and the better you get at them the more fun you’ll have in vim.\
    \ But they get even better when combined with the *operators* and *counts* we’ll\
    \ meet in the next two chapters.\n\n## 6\\. Operators 1: Changing Letters and\
    \ Lines\n\nOkay so, you’ve got line numbers, colors, and a basic idea of how to\
    \ get your cursor from place to place. If you wanted, you could stop here, move\
    \ the cursor around in normal mode, press `i` to go into insert mode, and make\
    \ all your changes like you would in any other editor. But vim has a better idea.\
    \ You can make a lot of the most common changes right from normal mode. For now\
    \ we’re going to focus on the three most common commands: Cut, copy, and paste.\n\
    \nOnly they have different names in vim. Remember that vi^([21](#chap35.xhtml_fn-veeeye))\
    \ has been around since before the whole “clipboard” metaphor was ubiquitous.\
    \ So instead of “cut, copy, paste” it’s “delete, yank, put.” Let’s use a table\
    \ to introduce the commands for some of the most common operators:\n\nbasic commands\n\
    \n| Keystroke | Command |\n\n| --- | --- |\n\n| d | delete |\n\n| c | change (delete\
    \ and enter insert mode) |\n\n| y | yank (copy) |\n\n| u | undo |\n\n| p | put\
    \ (paste) |\n\n| r | replace (with whatever character you press next) |\n\nTo\
    \ play with these three commands, let’s open up a sample document that we don’t\
    \ mind really, *really* messing up. The sample documents folder has a file called\
    \ `operators.txt` that would be perfect for this purpose.\n\n### Operators Alone:\
    \ Changing Single Characters\n\n#### Killing Text\n\nFor the most part, operators\
    \ by themselves work on a single character. The first section in `operators.txt`\
    \ has words with duplicated letters like “ddoctor”, a not-uncommon mistake to\
    \ make while typing. Getting rid of the extra letter is easy. Just position your\
    \ cursor on the duplicated character and hit `d` (for delete) or `x` (for…a mnemonic\
    \ that is supposed to simulate striking something out on a typewriter. I’m guessing\
    \ the majority of people reading this book have never put in any serious time\
    \ on a typewriter, so that little mnemonic is kind of obsolete now).\n\n#### Resurrecting\
    \ Text\n\nOnce you’ve deleted text it’s not actually gone, it’s in a *register*,\
    \ or a special place in memory where vim can bring it back quickly if needed.\
    \ In normal mode, pressing `p` will “put” whatever text was most recently yanked\
    \ or deleted before the cursor.\n\n#### Two Fun Ones\n\nThere are two operators\
    \ that are useful in specific situations: `~` and `r`\n\n`~` Changes the case\
    \ of a single letter, while `r` lets you replace a single character with the next\
    \ letter you type.\n\nYou can use both of these to correct line 13 of `operators.txt`,\
    \ which reads:\n\n```\n1 \"you can't grep a fred tree\" --larry wall\n```\n\n\
    Using the `~` operator three times ^([22](#chap35.xhtml_fn-threeTildes)) and the\
    \ `r` operator once ^([23](#chap35.xhtml_fn-roperator)) you have a well formatted\
    \ quote, even if the attribution may be a bit suspect.\n\n### Operating on a Line\n\
    \nChanging single letters is fun and all, but sometimes you need to overhaul a\
    \ line of text instead of a single letter ^([24](#chap35.xhtml_fn-words)). Vim\
    \ includes shortcuts for changing a line into a more pleasing shape, like a shorter\
    \ line, two of the same line, or no line at all.\n\nBefore we dive in, we should\
    \ take a look at how vim defines what a “line” is and isn’t. Vim “lines” are everything\
    \ between one press of the `<enter>` key and the next, even if that spans several\
    \ visible “lines” on the screen. If word wrap is turned on vim will continue a\
    \ line of text, like so:\n\n```\n1 8 This is the eighth line of text in this document.\n\
    2    It just rambles on and on. You'll notice that even though \n3    there are\
    \ several sentences in this line, it still counts as a \n4    single \"line\"\
    \ in vim, and there isn't a new line number until \n5    I press enter.\n6 9 Okay,\
    \ this is a new line, because I pressed enter. Which is why\n7    there's a 9\
    \ over there in the line number column.\n```\n\nThis is a useful way to think\
    \ in programming, because you usually put a single statement on a line by itself.\
    \ It’s less useful when you are working with long-form text ^([25](#chap35.xhtml_fn-longform)).\
    \ When you’re writing prose in vim, it’s helpful to think “paragraph” instead\
    \ of “line”.\n\n#### The line must be drawn here! This far! No further!\n\nSometimes\
    \ you need to cut the end off of a line, either to replace it with something else,\
    \ or just to get rid of it. In vim, the uppercase versions of commands operate\
    \ on the line from your cursor to the end of the line. Find the following line\
    \ in `operators.txt`:\n\n```\n1 Emacs is a great operating system, it just needs\
    \ a good editor.\n```\n\nYou can make this sentence slightly less snide by positioning\
    \ the cursor right before the comma, then pressing `D`:\n\n```\n1 Emacs is a great\
    \ operating system\n```\n\nBut then we’re left with a sentence fragment in search\
    \ of a period. We can do better than that. Press `u` (for “undo) to restore the\
    \ text you just deleted and let’s try again. If you press `C` vim will remove\
    \ the same text as before, but this time it puts you in insert mode, ready for\
    \ you to write something new here. All we want to do is add a period and then\
    \ get back to normal mode, which seems a little wasteful. Press `<esc>` to get\
    \ back into normal mode and let’s try one more thing. Press `u` to restore the\
    \ text one last time. Okay, this time we’re going to combine two commands: Move\
    \ your cursor one space right of the comma and press `D` to delete the text. Your\
    \ cursor should now be *on* the comma, and you can just press `r.` to replace\
    \ it with a period, all without leaving normal mode.\n\nPut is a little different:\
    \ lowercase `p` will put the most recently yanked or deleted text *after* the\
    \ cursor, while uppercase `P` will put the text *before* the cursor. Here’s a\
    \ demonstration: We’re going to say we cut the word `seven` from one line and\
    \ want to paste it into the next line:\n\n```\n1 four score and |years ago...\n\
    ```\n\nIn this situation, pressing `p` to paste would result in:\n\n```\n1 four\
    \ score and yseven ears ago...\n```\n\nBecause the cursor is “on” the letter y.\
    \ But “yseven ears” isn’t what we want. but if you use `P` then you get the expected\
    \ result:\n\n```\n1 four score and seven years ago...\n```\n\nThe way you’ve always\
    \ remembered it. And let’s be honest, that’s all of the speech you *can* remember.\n\
    \n#### A Whole New Line\n\nTo make the `d/y/c` operators affect an entire line\
    \ simply duplicate the operator. So `yy` copies (or “yanks”) an entire line, `dd`\
    \ deletes the line, and `cc` “changes” the line. (That is: deletes the line and\
    \ puts you in insert mode). You can play with these as well in `operators.txt`,\
    \ starting on line 31."
