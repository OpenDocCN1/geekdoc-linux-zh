    在 `counts.txt` 中有一个设计得非常巧妙的例子：简单的童谣《杰克和吉尔》，但不知为何“吉尔”被替换成了“杰克”。这意味着第一行的内容是：


    ```

    1 Jack and Jack went up the hill to fetch a pail of water

    ```


    这招玩得不错，杰克！让我们用修改操作符来修复第二个“Jack”。将光标移动到字母 J 之后：


    ```

    1 J|ack

    ```


    然后输入 `cw`（意思是“修改从光标处到单词末尾的所有内容”）。你现在应该看到：


    ```

    1 J|

    ```


    并处于插入模式。输入 `ill` 并按下 `<esc>`。现在第二个 Jack 变成了 Jill，你可以阅读诗歌的其余部分并寻找任何其他错误。在第三行写着：


    ```

    1 And Jack came tumbling after.

    ```


    这完全不通。像上次一样把光标移动到那里，但你不需要输入 `cw`，只需要按一下句号键，砰！你的上一次修改就会通过一个按键重复执行。如果你曾经需要修改文件中所有的变量名，你就能轻易体会到这有多么有用。当它与搜索结合使用时效果更好，不过这一点稍后会详细介绍。


    点命令是让你在插入模式下选择性操作、以及在返回普通模式之间执行多少操作的一个很好的理由。


    ## 8. 在 Vim 中移动：舞步


    现在让我们把已经学到的关于移动的所有知识进行最后的几次微调，使其变得真正超级有用。有两个文本对象看起来完全一样，但并非如此。它们之间的区别可能会给你带来麻烦，也让你的生活变得美好。这两个文本对象是
    `words` 和 `WORDS`。


    ### Words 和 WORDS


    描述 `WORD` 最简单的方法是它是两个空白字符之间的所有字符。因此，`http://I.am.a.frog.com` 是一个 `WORD`，尽管你我都会将其解析为六个单词^(#chap35.xhtml_fn-not-counting)。小写的“word”文本对象是任何不连续的字母序列。因此，`http://I.am.a.frog.com`
    由六个“word”对象组成，由标点符号分隔。


    当你组合 vim 命令时，正如你预期的那样，你会用 `W` 指定要操作一个“WORD”，用 `w` 指定操作一个“word”。如果你想尝试这些差异，可以查看
    `motion3.txt` 并看看那里的练习。使用上面的 URL，你可以将光标置于单词 `frog` 的开头，并使用 `cw` 命令仅修改该单词。如果你想将整个字符串更改为其他内容，可以将光标置于行首并输入
    `cW`。


    但总是将光标移动到文本对象的开头来对其操作是件很痛苦的事。Vim 是聪明的，即使你的光标在单词中间，它也能确定单词边界在哪里。你只需要告诉它你正在寻找什么样的边界。你可以通过“inner”（内部）和“all”（全部）命令命令修饰符来实现这一点。


    ### Inner 和 All


    如你所知，文本对象命令 `w s l` 从你的光标位置到结束操作当前文本对象（分别是单词、句子或行。如果你需要快速复习，请查看表格）。但如果你有一个很长的单词，比如“Omphaloskepsis^(32)”，而你的光标在第一个
    s 附近怎么办？为了删除这个单词而必须将光标移回初始的 `O` 是愚蠢的，vim 有一种更好的方法。


    你只需要告诉 vim 如何处理所选文本对象的边界，以及对该文本对象做什么。什么构成边界取决于你使用的文本对象类型。“一个 WORD”的两侧由空白字符包围。“一个
    word”的两侧由任何非字母字符包围。句子边界由行尾或句号包围。通常，vim 会努力使它的边界概念与人类认为的边界相匹配。


    如果你告诉 vim 操作一个内部（inner）文本对象，它将忽略边界。例如，如果我在句子 `Who is John Galt?` 中对单词“Galt”执行
    `diw`，剩下的就是 `Who is John ?`。这不符合语法，因为问号孤零地悬浮在结尾。然而，如果我改用 `ciw`，它将保留 `John` 和我想要给安妮·兰德的角色起的新姓氏之间的空格：


    ```

    1 Who is John Punchfist?

    ```


    好得多。


    然而，当你直接删除文本时，通常想修改整个文本对象，包括空格。要实现这一点，将前述命令中的 `i` 改为 `a`。如果我在上面的示例中对 John 的姓氏说
    `daw`，结果句子将是 `Who is John?`，这完全符合语法（虽然有点模糊），但远不如询问谁是 John Punchfist 那么酷炫了。


    你无疑能理解为什么我不想在那里执行 `caw`，因为那样我就必须输入“John”和另一个“John”之间的那个空格。


    ### 按计数移动


    我们已经在使用计数章节中见过这个概念的开头了，但让我们在这里再详细充充一下。移动命令仍然是命令，你可以像对待其他命令一样告诉 vim 重复它们。这意味着你可以通过简单的输入
    `5w` 向右移动五个单词，或者向下移动六行：`6j`。这通常比连续按 `j j j j j j` 到达目的地更快的方法。


    但并不总是如此。这种现象的原因是人类的一种被称为*[视直计数](https://en.wikipedia.org/wiki/Subitizing)*的能力。简单来说，我们人类可以很容易识别多达三个或四个的物体组而无需计数，但一旦超过四个，我们的速度就会大大减慢。在
    vim 术中，这意味着如果你看一眼句子发现需要向右移动三个单词，你会直接输入 `3w` 而无需思考。但如果你需要向右移动六个单词，你可能正在数这些单词，然后输入命令，这通常比连按六次
    `w` 键，或者（更好）直接搜索你需要修改的的确切位置要慢。

