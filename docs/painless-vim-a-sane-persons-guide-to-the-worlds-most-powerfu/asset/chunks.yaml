    \ tabs\n\n    *   `:tabo` Close all other tabs.\n\n*   Go to the next tab - `gt`\
    \ - `:tabn`\n\n*   Go to the previous tab - `gT` - `:tabp`\n\n*   Go to a specific\
    \ tab - `:tabfir` goes to the **first** tab - `:tabl` goes to the **last** tab\
    \ - *tabNumber*`gt` Goes to the tab number given - *tabNumber*`gT` Goes to the\
    \ tab number given\n\n*   Reorder tabs - `:tabm`*number* places a tab **after**\
    \ the given tab number. Use 0 to make the current tab first. - `:tabm +`*number*\
    \ move a tab *number* places **right** - `:tabm -`*number* move the tab *number*\
    \ places **left**\n\n*   List all open tabs - `:tabs`\n\nI’d like to say more\
    \ about this topic, but it’s pretty straightforward. If you like tabs you should\
    \ play around with this stuff. If you’re happy doing everything in one tab then\
    \ you can safely ignore this stuff. But it’s easy to use and when you do it in\
    \ the terminal you look like one of the truly awesome uber-nerds. Almost as cool\
    \ as someone who uses [tmux](http://tmux.sourceforge.net/), but that’s a topic\
    \ for another book ^([65](#chap35.xhtml_fn-another_book)).\n\n## 22. Interlude:\
    \ Reviewing Views\n\nIt’s worth taking a few moments here to go back over the\
    \ hierarchy of things that show up in a vim session, just to get them all straight\
    \ in our minds and to take a breather. The quick rundown looks like this:\n\n\
    1.  A *file* is a bunch of data on a disk.\n\n2.  When you tell vim to edit a\
    \ file, it creates a *buffer* of all the data from that file and lets you edit\
    \ that.\n\n3.  A *window* lets you view the text in a buffer. You can have multiple\
    \ windows open to different parts of the same buffer, if you so desire, or you\
    \ can have multiple windows looking at different buffers on the same screen.\n\
    \n4.  A *tab* (or, more accurately, *tab page*) is a collection of all the windows\
    \ you can see at the same time. You can have a bunch of tabs open, and it’s super\
    \ simple to switch between them.\n\nLet’s work from the bottom up, and just for\
    \ fun we’ll do this in a semi-Q&A format.\n\n### Files\n\n**Q:** So, vim doesn’t\
    \ edit files?\n\n**A:** No. When you open a file in vim it is copied into a *buffer*,\
    \ which is what you edit. Interestingly, the buffer is saved off at intervals\
    \ into a *swap file*, which is there to keep you from losing your work. But we’re\
    \ going to ignore that for a minute. Vim’s buffer is entirely in memory, and is\
    \ only written back to the actual disk when you give vim the `:write` command.\n\
    \n**Q:** Can you have multiple buffers for the same file?\n\n**A:** Vim works\
    \ hard to prevent this from happening. When vim opens a file it creates the aforementioned\
    \ swap file. If you open another copy of vim and tell it to edit the same file\
    \ it will see the existing swap file and get very nervous. Before it lets you\
    \ start editing the file it will ask if you want to make a copy, or perhaps open\
    \ the file in read-only mode, basically do anything *other* than have two copies\
    \ of vim fighting over the swap file. Having multiple authors on a single file\
    \ is a task best handled by software specifically designed with that in mind,\
    \ and vim isn’t that software.\n\nWhen you save a document vim copies the contents\
    \ of the swap file into the current file. When you close vim it deletes the swap\
    \ file. I cover this in a little more detail in the [next chapter](#chap24.xhtml_files-vs-buffers)\
    \ so you can skip ahead if you like.\n\n**Q:** So why does the swap file even\
    \ exist?\n\n**A:** Because things don’t always happen perfectly. The swap file\
    \ exists for occasions where vim (or your computer) crashes without saving the\
    \ changes you made to the buffer back into the file. Which is part of why you\
    \ only have one swap file per file: it keeps the history clean and makes it easy\
    \ to restore your changes.\n\nThat said, you can have more than one view into\
    \ the same buffer, by having that buffer open in multiple *windows*.\n\n### Windows\n\
    \n**Q:** What’s the difference between a buffer and a window?\n\n**A:** That’s\
    \ easier to show than tell. Do the following:\n\n1.  Open vim without specifying\
    \ a file.\n\n2.  Type `:sp` to split your screen into two windows\n\n3.  Start\
    \ typing in either window.\n\nYou should see your text showing up in the other\
    \ window. Both windows are looking at the same buffer, so your changes are reflected\
    \ in both places. Having multiple windows into a single buffer is useful for reasons\
    \ other than boring party tricks. You can have one window showing a method you’re\
    \ referencing and the other showing the method you’re writing, for example. But\
    \ windows are usually better used when they’re looking at different buffers.\n\
    \n**Q:** How many windows can you have on a screen at once?\n\n**A:** That depends\
    \ on how big your screen is. If you have more than three open I suggest opening\
    \ a new *tab*.\n\n### Tabs\n\n**Q:** Okay then, how many *tabs* can I have open\
    \ at once?\n\n**A:** By default you can have ten tabs. I don’t know why. I *also*\
    \ don’t know why you would want to *change* this number, but if you’re so inclined\
    \ you can add a statement like `set tabpagemax=15` to your `.vimrc` file and then\
    \ you can have 15 tabs open. It’s up to you. If you’re working on 15 sets of files\
    \ at once then you’re far better at multitasking than I am.\n\n**Q:** Why did\
    \ you make a huge deal about the difference between *tabs* and *tabpages* earlier,\
    \ but now you’re just calling them all *tabs*?\n\n**A:** Because *tab* is way\
    \ shorter than *tabpage*, both to type and to say. Once you got the idea that\
    \ you weren’t getting a one-tab-to-one-file correspondence like you’re probably\
    \ used to from your browser we could settle down and simplify the language. It’s\
    \ true, however, that a lot of people will still use vim to open a tab for every\
    \ file they’re editing, and that’s fine. I just wanted to remind you that you\
    \ can do more with a vim tab than you can with a browser tab.\n\n**Q:** Is there\
    \ an easy way to open all the files you’re working on in separate tabs?\n\n**A:**\
    \ I don’t know about “easy” but if you want to open vim with a bunch of tabs you\
    \ can call it like so:\n\n```\n1 vim -p file1 file2 file3\n```\n\nAnd you’ll have\
    \ your files all in their own little tabs. I guess if you have a good programmatic\
    \ way to build that command that would be “easy”, but I generally just use NERDTree\
    \ to open files from within vim.\n\n**Q:** Why are you so against using a tab\
    \ for a single file –or *buffer*, if you insist– and so adamant that you need\
    \ to have multiple windows open on each tab?"
