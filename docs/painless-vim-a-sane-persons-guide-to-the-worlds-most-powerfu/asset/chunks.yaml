  trans: "\n\n**A:** 我不是说你必须在每个标签页上开启多个窗口；我经常一个标签页只对应一个缓冲区（buffer）。我只是想让大家记住你们有更多选项，不要陷入“一个标签页永远等于一个缓冲区”的思维误区中。\n\
    \n另一个陷阱来自于像 `NERDTree` 这样的插件。人们习惯了在屏幕侧边打开文件管理器，并让它在所有标签页中保持显示。Vim 并不是这样运行的。你可以通过脚本等手段让它变成那样，但在默认情况下，Vim\
    \ 世界里并不是这样工作的。只需记住，你看到的所有窗口都存在于标签页（tabpage）上，你就没问题了。\n\n## 23. Vim 的思考方式\n\n这一章包含了一些琐碎的内容、实用的建议以及对你这款新宠编辑器的见解。你完全可以从头到尾读完这一章，但大部分章节都是独立的。\n\
    \n### 你不是在编辑*文件*，你是在编辑*缓冲区*（Buffers）\n\n这并不是什么新鲜的：当你在 vim 中打开一个文件时，它会在内存中创建该文件的副本，你所有的更改都是在这个副本上进行的。当你保存文件时，所有的更改都会写回磁盘。几乎每个编辑器都是这样做。但值得知道的是，vim\
    \ 的很多术语都与缓冲区（buffers）有关。好了，这是短答案。如果你想了解更多，请继续读下去。如果这对你来说已经足够，那我们到此为止。\n\n所以，正如我所说，vim\
    \ 会将你的更改写入内存，直到你告诉它保存，因为在你按下每个字符的瞬间就将其写入磁盘会慢得离谱且低效。因此，vim 会等到你输入了 200 个字符，或者你闲置\
    \ 4 秒钟后才会向磁盘写入任何内容。\n\n你要知道，当你在 vim 中打开一个文件时，它会创建一个“交换”文件（swap file），在你编辑期间保存你的更改。所以，如果你正在编辑文件\
    \ `swap.txt`，vim 会创建一个名为 `.swap.txt.swp` 的隐藏文件。一旦你开始进行更改，每当你输入 200 个字符或 4 秒内没有任何操作时，vim\
    \ 就会将你的更改存入这个交换文件中。\n\nvim 为什么要这么做？因为我在为你撑腰，朋友。如果你在执行一个大项目时电脑崩溃了，你永远不会丢失超过 200\
    \ 个字符的工作。当你重新打开文件时，vim 会注意到那里有一个 `.swp` 文件存在，并询问你是否要从该文件中恢复更改。在大多数情况下，这能让你立刻回到工作状态。\n\
    \n另一方面，如果你认为在这次编辑期间所做的更改都是垃圾，你只需要输入 `:q!` 就可以丢弃它们，`.swp` 文件就会被销毁，无需任何解释。你的文件中完全不会保存任何内容。\n\
    \n### 更新 Vim\n\n算算数学账：Vim 已经超过二十二年了，而且（在写作时）版本是 7.4。这意味着你每隔 3.14 年就能获得一次主要的 vim\
    \ 升级。你不需要太担心更新。\n\n但 Bram 和他的团队一直在不断改进，保持最新、最强大的功能是值得的，尽管大多数大多数补丁级别的更新并不会彻底改变你的世界。根据操作系统的不同，升级指令略有不同。\n\
    \nLinux/Unix 用户过得最轻松。你系统的包管理器极可能总是包含最新版本的 vim，所以只要你定期运行更新就没问题。\n\n在 Windows 上，你基本上只需要关注网站上的新版本公告。如果你使用\
    \ Cygwin 来获取 vim，可以使用 Cygwin 包管理器来保持更新。和 Linux 用户一样，你只需要偶尔运行一次包管理器的更新函数即可。\n\n\
    在 OSX 上，你有两个选择，两个都……还可以。OSX 确实附带了一个版本的 vim，但截至 10.8 版本时，它还是 7.3 版本，而当前版本是 7.4。你可以等待\
    \ Apple 更新他们的系统自带的 vim，也可以使用 homebrew。使用 homebrew 运行起来快速又简单，但这超出了本书的范围。对于那些不知道的人来说，homebrew\
    \ 是 OSX 的包管理器，它可以从源码在你的系统上构建开源项目。一旦你安装了 homebrew，你只需要输入 `brew install vim` 就能用上最新版本。为了保持其最新状态，你需要定期更新\
    \ homebrew（`brew update`）以获取最新的包信息，然后升级已安装的包（`brew upgrade`）。每隔几周执行一次，状态就会良好。\n\
    \n在所有情况下，你都有自己编译 vim 的选项。你可以设置各种标志和选项，并将某些功能编译进你的 vim 安装中，但这个过程绝对并不轻松，所以我将遵循惯常做法，向你推荐一个关于该主题的优秀资源，然后安静地进入下一章。\n\
    \n## 24. 可视（模式）基础 `:h visual-mode`\n\n可视模式一旦学会就非常简单且实用，但可能需要一些时间来适应。这部分部分是因为存在几种不同的可视模式，它们有共同点但并不完全相同。让我们来看看它们的相似之处。\n\
    \n可视模式的核心在于它允许你选择一段文本，并对该段应用操作。在很多时候，这种方式会更直观。让我们从最基础的形式开始。\n\n### 字符级可视模式 `:h\
    \ characterwise-visual`\n\n进入这种模式只需在普通模式下按下 `v`。正如你可能猜想的，它被称为“字符级”，是因为它可以让你逐个字符地增加或减少区域的大小。一旦进入此模式，你可以使用所有的移动键来调整。正如你可能可能到的，你可以在\
    \ `v` 之前加上计数，例如：`5v`。\n\n### 行级可视模式 `:h linewise-visual`\n\n这种模式没什么惊喜。正如你预期的，在行级可视模式下，你可以选择整行而不是单个字符。当你想要一次获取一个文本块时，这种模式非常有用。你会发现自己处于行级模式，因为底部的状态栏会显示\
    \ `-- VISUAL LINE --` 而不是 `-- VISUAL --`。与字符级可视一样，你可以在行级模式前加上数字参数来选择行数：`5V` 会选择五行，就像\
    \ `5v` 选择五个字符一样。\n\n### 块级可视模式 `:h blockwise-visual`\n\n在此模式下，你可以选择一个块。块是特殊的：它们可以沿*水平*方向（沿行）和*垂直*方向（跨行）扩展。使用此功能有很多很好的理由，但处理它比其他类型的可视模式需要更多技巧。\n\
    \n你通过 `<ctrl>v` 进入块模式，操作时状态栏会显示 `-- VISUAL BLOCK --`。一旦进入块级可视模式，你可以使用所有的标准移动、搜索等命令来选择矩形区域，就像字符级可视一样一样。块模式的一个常见用途是一次性在多行开头添加内容。假设你正在写\
    \ javascript，然后发现你写成了这样：\n\n```javascript\nfunction someThing(data){\n\ta = 1\n\
    \tb = 2\n\tc = 3\n\td = \"hi bob\"\n\t…\n}\n```\n\n然后你意识到两点：第一，你的变量名太糟糕了；第二，你忘记在它们前面加上\
    \ `var` 了，如果你在这个文件中开启了 `use strict` 选项，将会报错。块模式无法解决第一个问题，但你的第二个问题太常见了，所以有一个特殊的快捷键可以修复。工作原理如下：\n\
    \n1.  通过 `<ctrl>v` 进入可视块模式\n\n"
