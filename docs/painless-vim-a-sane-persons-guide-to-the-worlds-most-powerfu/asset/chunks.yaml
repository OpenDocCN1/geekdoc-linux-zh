    \ 试图在文本方面将几乎任何内容转换为任何任何内容。如果你想为 `literary.md` 创建一个 Microsoft Word 文档，你只需要这样做（当然是在安装了\
    \ `pandoc` 之后）：\n\n```\n1 pandoc -f markdown_mmd -t docx -o literary.docx literary.md\n\
    ```\n\n我们在这里使用的开关参数是：\n\n*   `-f` 输入格式\n*   `-t` 目标格式\n*   `-o` 输出文件名\n\n最后是你想要转换的文件名。值得注意的是，`pandoc`\
    \ 并不支持 PDF 输出。然而，Microsoft Word 支持。\n\n但如果你不想在命令行中写这些内容呢？如果你想实时预览文本呈现后的效果，*并且*\
    \ 能够最终从你的文本实际创建 PDF 呢？\n\n嗯，有应用程序可以实现。我在 OSX 上最喜欢的应用是 [Marked](http://marked2app.com)。Marked\
    \ 让你看到所有格式化后的效果，内置了许多样式表，还可以添加你自己的新样式表，对你的文本进行出惊讶的广泛的健康和写作检查，并且它可以导出你文件的 PDF。它基本上是作者的最好朋友。\n\
    \n## 28. 结语\n\n好了，我们已经来到了这一切《Painless and Vimish》^(76) 的终点。我们度过了一些良好的时光，学会了如何在编辑器中完成很多事情，而这个编辑器已被（其他人）证明在高手手中是快速快速且用户友好的。我希望你已经发现自己拥有一件非常棒的工具，而且它并不像几个章节前你刚开始时看起来那么可怕。\n\
    \n但还有很长的路要走，还有很多东西要学。我们还没有涵盖 `vim` 能做到的所有事情，远未如此。我甚至还没有触及如使用 `vim script` 编写自己的插件等话题，这很有道理：我完全不知道怎么做。但希望到此时，你觉得这些话题并不太可怕，你觉得你可以无恐惧地处理好整个\
    \ `vim` 事情，而且你可以跳到任何人的电脑上使用这个世界上最内置的文本编辑器，而不是找借口。\n\n正如我所说，还有很长的路要走。幸运的是，如果你的目标是达到真正的\
    \ `vim` 精通，整个互联网都有大量的资源可以帮助你实现这一目标。如果你只是想*使用* `vim`，那么你可能已经到那里了。我建议在你日常使用 `vim`\
    \ 的过程中，偶尔小量地回顾一下这些材料。也许你很久以前读过某些内容并想要尝试一下，而现在你变得更从容了，可以向你的武器库中添加几条新命令。如果你想在本文这里读到的内容之外进行扩展，我建议买一本更进阶的书；附录中列出了几本。如果你想开始编写\
    \ `vim` 插件，现在是学习 `vim script` 的最好时机。\n\n最后，我想感谢你。写这本书对我来说是一场冒险。在这个过程中，我学了大量关于\
    \ `vim` 以及关于写作的知识。所有的正面评论和建议我都深有感触并感激。而你通过实际掏出辛苦赚的钱并*购买这本书*所表达的信心简直太思议了。再次，感谢你。\n\
    \n–Nate Dickson\n\n## 附录 1：参考文献链接\n\n此附录是用于那些在正文中未能顺畅呈现的长篇参考文献讨论的汇总。\n\n### 配色方案参考\n\
