    And so on for a bunch of lines. Now, I could have entered each of these lines
    by hand, but that’s just stupid and painful and pointless. Vim made it much faster.
    The nice thing is that there are a couple of fast ways to do this, depending on
    how much thinking ahead you were able to do. Let’s look at some repetitive editing
    tasks, from the least forethought to the most.


    #### Least Forethought: Copy this line


    So, let’s say I typed the first line, and realized that I’m going to add another
    line just like it. I start out with this:


    ```

    1 grunt.loadNpmTasks(''grunt-contrib-jade'');

    ```


    And with my cursor at any point on that line I type `yyp`. In other words “yank
    the entire line and paste it.” Now I have


    ```

    1 grunt.loadNpmTasks(''grunt-contrib-jade'');

    2 grunt.loadNpmTasks(''grunt-contrib-jade'');

    ```


    Which is close to what I want. I can get my cursor to the word `jade` in the second
    line, type `ciw` and replace it with the word `watch`. There! I’ve added a new
    line. What’s more, I can just type `p` and I’ll have a third line that I can modify
    in the same way. I can keep doing this until I’ve got all the modules I need listed
    in my `Gruntfile`.


    #### Slightly More Forethought: Copy this line. **A LOT**.


    Okay, so let’s go back to square one: I’ve got the first line written, and I realize
    that I’m going to need more than one copy of the line. No problem. But since I’m
    thinking ahead this time I’m not going to copy the word `jade` because I’m just
    going to change it in all of the copies. So I’ll delete the word right now, giving
    me


    ```

    1 grunt.loadNpmTasks(''grunt-contrib-'');

    ```


    This has the added side-benefit of throwing an error if I try to run grunt, since
    that’s not a real module. A little added error checking is a good thing, I say.


    I’m thinking ahead, so instead of just hitting `p` to give myself a new copy I
    hit `7p` and have seven new lines ready for me to edit. Not bad! Now, I realize
    that sometimes you don’t *know* how many nearly-identical lines you’ll need, but
    we’ll pretend it’s more common than it is, because otherwise the next section
    is *entirely* pointless.


    #### Uncanny Levels of Forethought: Knowing how many copies you want *Before you
    start typing*


    Let’s say that you know, right this moment, that you’ll need 8 copies of a line
    that you haven’t even typed. Good for you! You can do this all in one step, and
    here’s how. Ready? Watch close, this’ll go by fast:


    ```

    1 8i grunt.loadNpmTasks(''grunt-contrib-'');<enter><esc>

    ```


    And you’re there. You can see that all we did was put a count (namely, *8*) before
    the “enter insert mode” operator `i`. So we told Vim to re-do anything we do in
    insert mode eight times. This is awesome, no?


    Again, I realize that it’s not always what you want to do, nor is it even OFTEN
    something you want. But knowing about it is useful for two reasons: one, you can
    pull this trick when you need it, and two, you can figure out what just happened
    when you pull a trick like missing the `G` key and instead of *going* to line
    55 and typing something you type something right where you are, then copy it 55
    times. Not that I’ve ever done that. Today. In this chapter.


    *Cough*


    What?


    #### The Triumphant Return Of The Almighty Dot


    Okay, but here’s the most useful edit-by-motion command you’ll ever see *ever*.
    Let’s say you’ve got a file where the indentation is all messed up, and there
    are entire methods that are over-indented. In the old days (assuming you weren’t
    using Sublime Text in the old days) fixing this involved using the *mouse* to
    *highlight* all those lines and then hit `shft-tab` to un-indent that method.
    Vim can do you one step better. If you can quickly count all the lines you want
    to operate on at once, you can just put that number in front of the `<<` command
    and all your lines are moved back one tab, all together.


    “But Nate,” you’re saying, “The dot command wasn’t in there *at all*”. You’re
    right, grasshopper. I was just easing you in. What’s the other most common thing
    you have to do to a whole freaking boatload of lines all at once? That’s right,
    it’s *indenting* them. ^([38](#chap35.xhtml_fn-Kidding)) Let’s say you make the
    edit to a single line and realize that you’re going to have to do this over and
    *over*. Don’t. Move your cursor to the first line in the set that still needs
    edited and type `8.`


    In other words “make that last change on the next 8 lines.” Suddenly anything
    you can do once you can do over and over again, without even thinking about it
    all that hard. It’s kinda fun.


    It’s also a good reminder about our advice earlier about making *small* changes.
    The smaller a change is the easier it is to repeat and the more likely it is to
    be worth repeating.


    ## 12\. Interlude: How to Back Off Without Giving Up


    Let’s face it, there are going to be times where you are sick to the *eye teeth*
    of vim and all its stupid weird commands and modes and just want to do some actual
    *work*. I get that. Even now I do that from time to time. Sometimes it’s nice
    to feel like you’re back in control instead of the student of some crazy workaholic
    teacher.


    There are two ways to make yourself feel better in moments like this. The first
    is to just go ahead and fire up your favorite editor and get to work. Use the
    arrow keys, all those other shortcut keys that are integrated into your OS, and
    just live the good life of a person who has a tool they like.


    Just don’t blame me if moving around using the arrow keys suddenly feels *intensely*
    awkward, or if you keep typing `jjkj` in your text trying to move up and down.
    It happens. It can be a little disappointing, but it’s part of growing up. In
    a way it feels kind of nice. You’re getting good at vim and starting to see the
    power there, and starting to realize how limiting other editors can be.


    The second way to help yourself feel better is to see if your favorite editor
    has a “vim compatible” or “vim emulation” mode. Many of them do. Once you enable
    this mode you can use as much or as little of the vim stuff as you want while
    still being well and truly productive in an editor you’ve already learned how
    to use. This way you’re not really giving up on learning vim, you’re just using
    what you’ve learned to make you more productive in, say, IntelliJ or Sublime Text.


    Sublime Text, by the way, does a good job of implementing pretty much all of vim’s
    commands ^([39](#chap35.xhtml_fn-noO)), and as an added bonus to people who are
    tired of starting up in “normal” mode, it always starts you into insert mode.
    So, you still have access to all the quick motion features of vim, all the shortcuts
    and easy editing methods, with all the added bonuses of a modern editor and even–glory
    be– *mouse support*.


    Coincidentally, if you decide that vim isn’t your cup of tea, you could do far
    worse than using [Sublime Text](http://www.sublimetext.com/) as your new editor
    of choice. Its built-in ^([40](#chap35.xhtml_fn-disabled)) “Vintage Mode” does
    a great impression of vim, and it takes a lot of vim-like ideals (quick motion,
    mouse-free *everything*, text-only configuration, nearly infinite extensibility
    and configuration) into the modern era, and adds on a metric ton of good ideas
    all its own. In fact, my quest to learn vim started as a desire to use Sublime
    Text more efficiently.


    And no, nobody is paying me to say any of this.


