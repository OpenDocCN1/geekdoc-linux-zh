- fmt: "\nFor starters, copy line 33, then paste it twice below to give three cheers\
    \ for your vim knowledge. This can be accomplished by yanking the entire line,\
    \ then putting it twice. This can be done in four simple keystrokes, once your\
    \ cursor is on the line that says `- Hip Hip, Hooray!`. Simply hit `yy` to yank\
    \ the entire line, then press `p` twice to paste it two times. Since copying an\
    \ entire line also copies the invisible line break character, you don’t even need\
    \ to move your cursor.\n\n## Single Caps vs. Double Taps\n\nOkay, we’ve introduced\
    \ two ways to operate on a line instead of a single character. Let’s sum them\
    \ up one more time.\n\nTo operate on an entire line you *double* the command,\
    \ like `cc` to change an entire line, `dd` to delete an entire line, `yy` to yank\
    \ an entire line, and so forth.\n\nTo operate on a line from your cursor to the\
    \ end you *capitalize* the command instead. So `C` removes the line from your\
    \ cursor onward and puts you in insert mode, `Y` yanks all the words from your\
    \ cursor forward, and so forth. Here’s a quick example. Let’s say we want to get\
    \ rid of half of the following line, because it’s backwards:\n\n```\n1 Four score\
    \ and seven years ago years seven and score four\n```\n\nWe would just put our\
    \ cursor after the word “ago” and press `<shift>C` to get this:\n\n```\n1 Four\
    \ score and seven years ago|\n```\n\nType out the rest of the real sentence and\
    \ life gets better quickly.\n\nNow a slightly more complex scenario:\n\nTake the\
    \ three somewhat muddled lines and put them in the right order. This can be done\
    \ by deleting the line that is in the wrong place (which, again, removes the line-ending\
    \ character, effectively moving the following line up a notch) with `dd` and putting\
    \ it back where it fits with `p`.\n\n### How to Instantly Make Your Life Easier\
    \ with `cc` (or `C`)\n\nThere’s a common scenario in programming. You are declaring\
    \ a new function and you want to make sure all your braces are matched from the\
    \ get-go. So you set up your declaration, put an empty line in the middle, and\
    \ set up your closing braces. Something like this:\n\n```\n1 $scope.awesome =\
    \ function(arg){\n2 \n3 };\n```\n\nAnd then you move your cursor up to that middle\
    \ line and… it’s right up against the left border, where you *don’t* want it:\n\
    \n```\n1 $scope.awesome = function(arg){\n2 |\n3 };\n```\n\nYou want your cursor\
    \ to start properly indented, and you have probably developed a million ways to\
    \ make that happen. When I was first starting my coding career I would position\
    \ my cursor on that empty line, hit `<enter>` to create a new line, because that\
    \ new line was usually properly indented by the IDE I was using, then go back\
    \ and delete the improperly-indented line. And that trick will work in vim as\
    \ well, but that’s no way to live.\n\nFortunately there’s a better way: just position\
    \ your cursor on that empty line and hit `cc` (or `C` if you like that better).\
    \ Think about what you just did: you told vim “delete everything on this line,\
    \ and put me in edit mode.” Vim does that, takes a look at the lines above and\
    \ below and does you one better: it puts you in insert mode with your cursor properly\
    \ indented, all ready to write nicely formatted code:\n\n```\n1 $scope.awesome\
    \ = function(arg){\n2 \t|\n3 };\n```\n\nThis is just another way that vim demonstrates\
    \ its love for you. Note that this trick only works if you added the\n\n```\n\
    1 Filetype indent plugin on\n```\n\nLike I suggested a few chapters back. I told\
    \ you it would be good for something!\n\nSo, with all that under your belt go\
    \ ahead and mess up the rest of the file moving and removing lines. When you’re\
    \ feeling fairly comfortable with the process let’s move on to the fascinating\
    \ topic of repetition.\n\n## 7 Doing Things More Than Once\n\nOne of the great\
    \ things about vim is that it has been built for the way programmers work. We\
    \ often want to jump to a specific word or symbol in the text without moving there\
    \ line by line, or we want to replace the next four words with four new words,\
    \ or other such silliness. It’s part of our job, and as I’ve said before, vim\
    \ is all about making our jobs easier. It’s good at it!\n\nPart of how it makes\
    \ our job easier is by letting us *repeat* our actions as many times as we need\
    \ to accomplish what we’re doing.\n\n### Using Counts\n\nThis is usually accomplished\
    \ by typing a number before you give vim a command. For example, let’s say you\
    \ wanted to move the cursor four characters to the right. You could do this by\
    \ typing `llll` or you could type `4l` and you just saved yourself *two whole\
    \ keystrokes!* That’s money in the bank, friend. But as useful as it is to save\
    \ two whole keystrokes, you can apply this concept to a lot of other motions and\
    \ actions as well. Open up `counts.txt` in the sample documents and find this\
    \ line\n\n```\n6 I am so incredibly stupid, useless, and talented.\n```\n\nNow,\
    \ reading this, you realize that you need to get rid of the words `stupid, useless\
    \ and`. You could delete those three words individually by putting your cursor\
    \ before a word and typing `dw`. But why waste the time? Instead, put your cursor\
    \ before the word “stupid” and type `3dw`. BAM!\n\n```\n6 I am so incredibly.\n\
    ```\n\n### Using Text Objects\n\nSometimes you don’t want to manually count how\
    \ characters you need to operate on. You want to delete the next word without\
    \ counting how letters are in it. But vim also gives us shortcuts for a number\
    \ of common text objects: In vim terms, a text object is a set of characters.\
    \ It can be a single character, a few characters, a word, an entire line—all the\
    \ way to the entire document. You’ve already been using text objects in the last\
    \ section. When you tell vim `d5l` what you are telling it is “the five characters\
    \ to the right of the cursor make up a text object. Delete it.” If you told it\
    \ `d5j` you’d be telling it that the next five *lines* constitute a text object.\n\
    \n| Shortcut | Text Object |\n| --- | --- |\n| w | from the cursor to the end\
    \ of the word |\n| W | from the cursor to the end of the WORD |\n| s | the current\
    \ sentence |\n| ’ or “ | a string surrounded in quotes |\n| l | from the cursor\
    \ to the end of the line |\n\nThere are many *many* others, but this will get\
    \ us going. When you combine an *operator* with a *count* and a *motion* you have\
    \ a *command*.\n\nFor now let’s practice a bit. Open the file `counts.txt` and\
    \ go to line 9\\. There are four lines here that are just *begging* to be deleted.\
    \ Let’s fulfill their wish, with three keystrokes. Using the **operator-count-motion**\
    \ syntax you can just type `d4j` and those lines are *gone*.\n\nOnly they’re not.\
    \ You can use counts with `p` as well. We’re not sure when you’d want to paste\
    \ multiple lines multiple times, but it’s worth playing with at the very least.\n\
    \n### Behold The All-Powerful Dot\n\nThis particular trick doesn’t have anything\
    \ to do with counting, but it will be used with counted actions a *lot*. The `.`\
    \ character, that simplest of all characters, is one of your best friends in vim.\
    \ It’s meaning is simple: it repeats the last change you made to the text, but\
    \ at your current position.\n"
