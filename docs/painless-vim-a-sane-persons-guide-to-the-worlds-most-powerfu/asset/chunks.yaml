    这导致了 `portability`（移植性）问题。学习 vim 的主要原因之一是，几乎每一个非 Windows 计算机都默认安装了它，一旦你学会了如何使用
    vim，你就可以通过任何 SSH 连接快速编辑文件，或者跳到任何人的机器上并立即开始工作。但虽然 `vim` 无处不在，但你的 `.vimrc` 文件只存在于你自己的机器上。这意味着每当你连接到一台不属于你的电脑时，你都得重新尝试记忆如何常规地使用
    vim。你的肌肉记忆会误导你，因为你会下意识地寻找自定义快捷键而不是标准键。你可以养成在任何工作的地方随身携带 `.vimrc` 文件的习惯，但这会减慢你的速度。


    另一方面是当你通过 SSH 或使用 `tmux` 与他人协作时。任何 vim 用户在发现尝试的每一个按键执行的都是完全错误的操作，都会立即感到无比不可自拔的愤怒。这就像当你习惯了
    QWERTY 布局却尝试使用别人的 Dvorak 键盘时（反之亦然）。


    总的来说，对内置标准命令的任何重映射都应该保持谨慎态度。为你经常执行的操作`添加`键位可能并不糟糕，但它仍然让你依赖于使用自己的个人终端。`覆盖`标准函数的键位，只有在你知道没有更好的选择时才应该这样做。


    ### 映射什么


    那么你应该映射什么呢？我的建议似乎是让 vim 保持原始状态，不做更改，并盲目信任 Bram 及其团队的智慧。


    嗯，并非完全如此。有很多是你应该映射的内容，这些内容让 vim 更加实用，而不会让你在其他机器上束手无策。不出，其中大部分与插件有关。插件非常棒。它们扩展了你的功能，并成为任何优秀文本编辑器的核心。当你将它们添加到
    vim 时，找到插件中最用的部分并将这些功能映射到你喜欢的内容是有意义的。


    例如，让我们看看 Pope 的 [fugitive](https://github.com/tpope/vim-fugitive) 插件。Fugitive
    是一个 git 管理插件，通过 `:Gstatus` 命令暴露了大量功能。你可以在每次想使用该插件时直接从命令行输入 `:Gstatus`，也可以给它设置一个漂亮且易记的键位。让我们选择第二种方案。由于这是一个
    git 插件，字母 `g` 似乎很合适，但我们不想覆盖它当前的功能。让 `<Leader>` 来救场！我们在 `.vimrc` 中添加以下内容：


    ```

    1 nmap <Leader>g :Gstatus<CR>

    ```


    现在（如果你已经将 leader 映射为逗号键），我们只需按下 `,g` 就能用两个字符获取所有的 git 状态信息，而且这一切是在没有损害 vim 核心功能的情况下完成的。


    这里的另一个好处是你可以去任何其他机器上使用 vim 并工作，而不会牺牲对基础操作的肌肉记忆。很有可能，如果你在别人的电脑上工作，你并不会使用 git，因为……那种感觉总觉得不对。你会以他们的身份登录，而你的提交将显示在他们的名字下……这就像穿了别人的内衣一样。在这个愉快的话题上，让我们聊一个实用的、甚至说是`必不可少`的必须在
    vim 本身`之外`完成的键位。


    ### `<Plug>`


    好了，还有一个不在键盘上的键需要我们处理。与 `<Leader>` 不同，你永远不需要将按键映射到 `<Plug>`，但你偶尔会看到它，所以我们将从高层面上来说过一下它。


    在不涉及细节的情况下，`<Plug>` 是插件的一种方式，方便你为它们的功能创建快捷键。例如，假设你有一个拥有名为 `awesome_feature` 超棒功能的插件。插件开发者可以在插件中添加以下内容：


    ```

    1 noremap <unique> <Plug>awesome :awesome_feature <CR>

    ```


    然后你就可以通过向 `.vimrc` 添加以下内容将其映射到你想要的内容：


    ```

    1 nmap <Leader>a <Plug>awesome

    ```


    从以后就可以使用他们的超棒功能了。


    ### 递归映射以及如何避免它们


    vim 键位映射的一个特性是它们可以包含递归执行的`其他`键位映射。像任何功能一样，这可以被误用，也可以被良好使用。


    #### 糟糕的键位递归


    让我们考虑一下“Bob”的情况，这是一个完全为了在示例中做出糟糕选择而存在的人。


    Bob 决定想用 `F2` 来复制一行。于是，他在 `.vimrc` 中添加了这一行：


    ```

    1 map <F2> yy

    ```


    Bob 忘记了你不应该重映射标准命令，但那是因为他还没读过这本书。快来给他买一本！尽管这个主意很糟糕，但它仍然有效；bob 现在可以按 `F2` 而不是输入
    `yy` 来复制整行，如果你觉得这是件乐事的话。但他还没完！


    Bob（一个巨大的《星球大战》粉丝）正在写一本关于 Wookiee 文化的开基性著作，想为 Wookiee 的家园 Kashyyyk 创建一个缩写。Bob
    也是过度花哨映射的忠实粉丝，所以他创建了以下缩写：


    ```

    1 abbr kk Kash<F2>

    ```


    你能猜到当 Bob 输入 `kk` 时会发生什么吗？等等，我看到发生了什么。Bob 的缩写使用了 `F2`，而他将其重映射为了 `yy`。这创建了一个无限循环！当
    Bob 输入 `kk` 时，它展开为 `Kash<F2>`，从而触发 `F2`，然后展开为 `yy`。等等，如果他将 `F2` 重映射为 `yy`，那么 `kk`
    就会展开为 `Kashyy`，然后 `yy` 触发 `F2`，展开为 `yy`……以此此类推。这就是为什么我们应该对递归映射保持谨慎。


    #### 一个更有用的示例


    所以，让我们利用从 Bob 身上学到的教训并更智能地使用它们。让我们从你可能想要映射的内容开始：


    ```

    1 imap <F5> <C-R>=strftime("%H:%M")<CR>

    ```


    不用太担心那个命令（但如果你想了解更多，可以查看 [vim wiki](http://vim.wikia.com/wiki/Insert_current_date_or_time)）。它以“小时:分钟”的格式插入当前时间。所以如果我现在按下
    `F5`，它会在光标位置之前直接输入“12:58”。


    现在，假设我们需要一个简单的缩写来写日志条目。我们会在 `.vimrc` 中添加另一行这样的内容：


    ```

    1 iabbr logt <F5>:Entry

    ```


    现在当我们在写日志时，只需输入 `logt` 就会创建一个带时间戳的日志条目。假设我们想更改时间戳格式。我们需要更改的只是 `imap` 行：


    ```

    1 imap <F5> <C-R>=strftime("%c")<CR>

    ```


    我们的日志条目就从


    ```

    1 12:58: Entry

    ```


    变为


    ```

    1 Sat Jun 29 12:58:32 2013: Entry

    ```


    #### 彻底避免递归


    但当你创建一个键位映射并递归另一个你不想要或意料到的键位映射时，它们也可能令人困惑。幸运的是，你可以轻松地告诉键位映射*不要*让它解析它遇到的任何键位，只需直接输入你输入的字符即可。要做到这一点，只需将映射从这样改为：


    ```

    1 imap <Leader> d dd

    ```


    改为：


    ```

    1 inoremap <Leader> d dd

    ```


