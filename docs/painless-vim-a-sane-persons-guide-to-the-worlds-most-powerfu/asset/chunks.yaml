- fmt: "\nBut it seems like a bummer to have to do this by hand every time you start\
    \ `vim`. You’re right. Don’t worry, we’ll fix that.\n\nBut there’s more. We’ve\
    \ learned that when you send commands to `vim` that start with a `:` you have\
    \ to press `<enter>` at the end. This is useful information, because I’m going\
    \ to stop putting `<enter>` after every command from here on out. Remember that\
    \ if you start a `vim` command with a colon it always ends with an `<enter>`.\
    \ There are other commands that don’t need an `<enter>` at the end. We’ll get\
    \ to them in time. For now let’s look around this file.\n\n## 2. Moving Around\
    \ in Vim: Baby Steps\n\nNow that you’re in a file, it’s time to move around a\
    \ little bit. If you’ve ever played with `vim` before, you’ve probably seen something\
    \ that looks like this:\n\n```\n1 \tk\n2 h\t\tl\n3 \tj\n```\n\nThis is a super-unintuitive\
    \ way of telling you which keys will move your cursor which directions. In English\
    \ it goes like this:\n\n*   `h` moves your cursor one space `left`\n*   `l` moves\
    \ your cursor one space `right`\n*   `k` moves your cursor one line `up`\n*  \
    \ `j` moves your cursor one line `down`\n\nSo play with those four keys for a\
    \ while. The layout is weird at first, I’ll grant you, but it serves the purpose\
    \ of keeping your hand firmly on home row, and after a while you’ll start to just\
    \ believe that `h j k l` should always move your cursor around. This is great\
    \ when you’re using a program that understands `vim` keys. It also means that\
    \ you’ll end up in an instant message conversation with someone, and you’ll inadvertently\
    \ send them a message that says “jjjkl” as you try to figure out why you can’t\
    \ move your cursor. It’s a curse.\n\nOkay, moving on. Once you’ve gotten comfortable\
    \ moving your cursor around, it’s time to edit something. Use the movement keys\
    \ to get your cursor where you want it and press `i`.\n\nAt the bottom of the\
    \ screen you should see a message appear:\n\n```\n1 --INSERT--\n```\n\nThis is\
    \ `vim`’s way of telling you that pressing keys now will make things change in\
    \ your text. In vim parlance, you have just entered insert mode. Type something\
    \ witty in the document. I would put “So long, and thanks for all the fish” because\
    \ it’s better than “hello world”. But I know it doesn’t matter what I tell you\
    \ to enter; you’ll put whatever you want. That’s just how you are. You’re independent\
    \ and I respect that.\n\nOnce your witticism is entered it’s time to save it up.\
    \ Hit `<esc>` and the `--INSERT--` message at the bottom of the screen should\
    \ disappear. This means that the keyboard is back to issuing commands to `vim`\
    \ instead of changing the text on the screen. `vim` calls this normal mode, but\
    \ don’t worry too much about that yet. Type\n\n```\n1 :w\n```\n\nAnd your changes\
    \ are saved, friend. Now let’s do something a little more daring and, dare I say\
    \ it, useful. Moving around with your fingers on home row is nice and all, but\
    \ it’s not worth all this hassle and bother. Let’s look at some slightly larger\
    \ jumps in the text.\n\nPosition your cursor somewhere on a line of text–anywhere\
    \ is fine– and make sure the `-- INSERT --` thingy is gone by pressing `<esc>`\
    \ a bunch of times until `vim` starts beeping and/or flashing at you. Now press\
    \ `A`. Note that was an uppercase `A`, not a lowercase `a`. This handy little\
    \ shortcut moves you to the end of the line and puts you back into insert mode,\
    \ all at once. Think of it as “append” or “add”. Nifty, huh? Okay, press `<esc>`\
    \ again and let’s do another one. Press `o`. (Again, note the case.) `vim` adds\
    \ an empty line, right under the line you were on, and once again you’re in Insert\
    \ mode, ready to enter new text into the file. Write something if you want, and\
    \ then press `<esc>` again to get out of Insert mode.\n\nWe’re going to talk more\
    \ about moving the cursor around later, but for now look how awesome you already\
    \ are! Since you don’t need to worry about changes this time, you can just type\n\
    \n```\n1 :q!<enter>\n```\n\nTo exit `vim`.\n\n### Zoom!\n\nLet’s go back into\
    \ `vim` and play with three simple (but useful) commands that I call the zoom\
    \ commands. To enter `vim` this time type\n\n```\n1 $ vim sample1.html own```\n\
    \nSo that we’ve got a document to play with. Press `j` repeatedly to move your\
    \ cursor down a few lines, it doesn’t matter where it ends up. What we’re going\
    \ to do is tell `vim` to scroll the window so that the line the cursor is on is\
    \ positioned where we want it.\n\nThe first “zoom” command is `zt`, which (I say)\
    \ stands for “zoom top.” When you press `zt` in command mode it will move your\
    \ current line to (you guessed it) the top of the screen. So, if your cursor is\
    \ on line 15 and is one third of the way down the screen it will now be at the\
    \ top of the screen.\n\nNext up is `zb`, or “zoom bottom.” As you can guess, it\
    \ moves your current line to the bottom. The third and arguably most useful command\
    \ is `zz`, which positions your cursor in the middle of the screen. I use all\
    \ three commands frequently.\n\nAll right, we’ve done some good. You’ve started\
    \ `vim` and gotten around, and more importantly, you made it pretty. In the next\
    \ chapter we’ll get down to choosing a color scheme.\n\n## 3. Your .vimrc File\n\
    \nOkay, let me start by saying I didn’t lie. To do that we need to talk about\
    \ how to save settings from session to session. And the way to do this is through\
    \ a `.vimrc` file. For now, we’re going to start very simply and just add a few\
    \ lines to it. On a Unix-based machine it’s found at `~/.vimrc`.\n\nFrom the command\
    \ line open `vim` for editing with your `.vimrc` file as the subject:\n\n```\n\
    1 $ vim ~/.vimrc\n```\n\nAnd, if you’re using a fresh install, you should see\
    \ a completely empty file. Go into insert mode by pressing `i` and enter the following:\n\
    \n```\n1 set nocompatible\n2 syntax on\n3 set nu\n4 filetype indent on\n```\n\n\
    I realize this all looks like witchcraft at the moment, but it’s really just telling\
    \ `vim` a few things about how you want to behave. Let’s go through it line by\
    \ line and you’ll see how simple it is:\n\n*   What’s that `nocompatible` thing?\
    \ That line tells `vim` to be `vim` instead of being `vi`. It’s a good way to\
    \ turn off all the old, weird, useless things that are holdovers from `vim`’s\
    \ even older and more arcane predecessor. Just set that line and forget all about\
    \ it. All it’s doing is protecting you.\n*   `syntax on` is what we’ve been talking:\
    \ this tells `vim` to do syntax highlighting. This is what turns on your pretty\
    \ colors for good.\n*   Okay, so, what about this `nu`? That tells `vim` to display\
    \ line numbers down the left-hand side of the screen. You could (temporarily)\
    \ do the same thing by typing `:nu` while in normal mode, but since `vim` is a\
    \ programmer’s editor we’re going to make it a part of your everyday setup. If\
    \ you hate line numbers you can omit it.\n*   The last one–the last one is a bit\
    \ magic. In a nutshell we’re telling `vim` to figure out what kind of file it’s\
    \ looking at and load the appropriate filetype plugin. This has a lot of benefits\
    \ for programmers, and even if you don’t fully understand it I would recommend\
    \ setting it. Some of the great tricks you’ll learn later on this book depend\
    \ on it.\n\nPress `<esc>` to get out of insert mode and save the file by typing\n\
    \n```\n1 :w\n```\n"
