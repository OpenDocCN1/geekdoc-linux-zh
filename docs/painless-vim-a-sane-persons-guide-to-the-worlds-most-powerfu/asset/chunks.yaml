    虽然你可能没有刻意识地注意到寻找特殊按键或鼠标时花费的时间，但你正在浪费时间，更重要的是，你大脑的一部分正从你正在做的事情中分离开出来；你正在丢失*上下文*。vim
    模式的核心在于让你对文本进行“触碰编辑”^(53)。为此，vim 几乎完全基于三个特殊键：


    * `<esc>`

    * `<ctrl>`

    * `:`


    你在 vim 中做的几乎其他所有操作都是普通的字母或数字键。在使用 `vim` 时，你几乎可以完全忽略那些“特殊键贫民窟”的居民。你可以让手指停留在主行键上，而无需离开键盘上的起始位置。


    现在，你观察后发现 `<esc>` 和 `<ctrl>` 并不是完全符合人体工程学的按键布局。许多人也发现了这一点。下一章将更详细介绍如何解决这个问题，但这里有一个抢先：重映射大写锁定键
    作为一个额外的 `<ctrl>` 键。一旦你这样做，你就不再需要将手移动到最后一行，那只会降低你的速度。此外，`vim` 将 `<ctrl>` 解析为 `<esc>`，一旦你知道了这一点，就再也不需要去够那个位置极其糟糕的
    `<esc>` 键了。你的手现在可以一直悬停在主行键上方，无论你在编辑时需要做什么，你都不再需要打破你在工作时建立的物理或心理上下文。


    这些并不是说你必须永远再也不使用任何其他编辑器。即使在写这本书时，除了 `vim`，我还使用了 `Scrivener`、`Multimarkdown Composer`、`Sublime
    Text` 和 `Ulysses`，这取决于我正在做什么以及处于写作和编辑过程的哪个阶段。你应该始终为任务选择正确的工具。但通过一点练习，你会发现 `vim`
    会成为大多数文本编辑任务的正确工具.^([54)


    # 18. 键映射 (Mapping Keys)


    `vim` 的优点之一是它有*许多*命令，而且几乎每一个插件 都会带来更多。`vim` 的缺点之一是它有*许多**难以输入*的命令，而且几乎每一个插件都会带来更多。幸运的是，为这些命令创建键盘快捷键（或者术语中的“键映射”）是很容易的，从而释放你的大脑空间，并将你需要输入的内容减少到仅几个字符。


    然而，这绝对是一个适用于“蜘蛛侠警告”的话题^(55)，因为如果你不加思考就更改太多内容，你可能会陷入麻烦。我们将介绍在 `vim` 中映射按键的一些常识策略，并设置几个可以帮助你工作得更快、更快乐的映射。在
    `vim` 中添加新的键映射只需向 `.vimrc` 中添加一行，一旦你熟悉了这种语法，它并不算困难。问题在于语法。像 `vim` 中的许多事物一样，它是简洁、紧凑且具有侵略性的晦涩，除非有人告诉你如何使用它。这就是我在这里的原因！


    ## 所有的键映射命令


    由于 `vim` 是一个模式编辑器，它允许你为每个模式单独创建键映射。结果是，你可以让（这**仅仅是一个示例**。请不要这样做）`<ctrl>s` 在普通模式下表示“保存”，在插入模式下表示“搜索”，在可视模式下表示“全选”^(56)。


    你通过 `map` 命令的首字母来指定键映射的目标模式：


    * `nmap` : 普通模式

    * `vmap` : 可视模式

    * `imap` : 插入模式


    让我们看看在现实生活中如何使用这些命令。


    新映射的模式是 *map-模式* *键* *命令*。假设你想在跳转到单词末尾时*始终*在末尾添加文本。在默认的 `vim` 中，你只需在普通模式下按 `e`
    即可跳转到单词末尾。为了进入插入模式，我们在 `.vimrc` 中添加此行：


    ```

    1 nmap e ea

    ```


    然后重启 `vim` 或使用我们旧的 `:so %` 技巧立即重新加载设置。现在，当你按下 `e` 时，光标会直接跳到单词末尾并进入插入模式，这一切一次完成。但假设我们不想覆盖内置的
    `vim` 命令（明智之举！稍后会详细介绍）。假设我们想把 `<ctrl>e` 变成我们的“跳转到末尾并添加”命令。在这种情况下，我们需要让 `vim` 知道我们在键映射在使用
    `<ctrl>`，为了这样做，我们将要按的键封装在角括号中，如下：


    ```

    1 nmap <C-e> ea

    ```


    在 `vim` 中，在角括号内将字母 `C` 与连字符和其他任何字符一起表示“我将同时按住 Ctrl 和其他这个字符”^(57)。如果你只是输入


    ```

    1 nmap C-e ea

    ```


    你必须按顺序输入大写的 `C`、一个连字符和一个小写的 `e` 来激活该键。


    ## 映射 Leader 键 (Mapping Leader Key)


    这是因为 `vim` 允许你决定使用哪个键作为前缀。在我们的示例中，我们写了


    ```

    1 nmap <Leader>ea

    ```


    这样就可以了！但 `<Leader>` 到底？


    默认情况下，`<Leader>` 被映射为反斜杠 (`\`)。对于大多数人来说这是一个非常难按的键。所以多年来人们在 `.vimrc` 中添加了以下行：


    ```

    1 let mapleader=","

    ```


    这把逗号键设置为 `<Leader>`。一旦你完成设置，只需按 `,e` 即可完成这一切^(58)。


    ## 映射什么 (What to map)


    `vim` 的特性意味着你可以自由将喜欢的任何函数映射到你喜欢的任何键盘操作，让 `vim` 完全按照你一直想要的方式运行。你可以决定自己不喜欢 `h j
    k l`，并将它们映射到你喜欢的键上，比如 `w a s`（因为你是个玩家，经常使用这些键）。但如果你这样做，你就得考虑如何处理以下四个命令：


    * 下一个单词 (**w**)

    * 添加 (**a**)

    * 替换字符 (**s**)

    * 删除 (**d**)


