  trans: "\n\n| `c` | `change` (删除并进入插入模式) |\n| `y` | `yank` (复制) |\n| `u` | `undo`\
    \ (撤销) |\n| `p` | `put` (粘贴) |\n| `r` | `replace` (替换为下一个按下的字符) |\n\n### 文本对象\
    \ (Text Objects)\n\n#### 文本对象快捷键\n\n| 快捷键 | 文本对象 |\n| --- | --- |\n| `w` | 从光标到单词结束\
    \ |\n| `W` | 从光标到 `WORD^(77)` 结束 |\n| `s` | 当前句子 |\n| `l` | 从光标到行尾 |\n| `’` 或\
    \ `“` | 引号包围字符串 |\n| `{` | 两个大括号之间的内容 |\n| `[` | 两个方括号之间的内容 |\n| `<` | 两个角括号之间的内容\
    \ |\n| `t` | 最近的 XML 或 HTML 标签内部内容 |\n\n### 寄存器 (Registers)\n\n#### 命名寄存器\n\n\
    | 寄存器按键 | 名称 | 属性 |\n| --- | --- | --- |\n| `\"\"` | 无名寄存器 | 每次剪切或复制 |\n| `\"\
    _` | 黑洞寄存器 | 任何你想丢弃的内容 |\n| `\"\\` | 上次匹配模式寄存器 | 上次搜索内容的副本 |\n| `\"-` | 小删除寄存器\
    \ | 上一次短于一整行的剪切或复制 |\n| `\"1` | 大删除寄存器 | 上一次长度为 1 行或以上的剪切或复制 |\n| `\"2-\"9` |\
    \ 大删除寄存器栈 | 运行中的大删除栈。`\"1` 会被推入 `\"2` 等，依此类推 |\n| `\"+` | 系统剪贴板 | 如果有效的话。它并不总是有效\
    \ |\n| `\"a-\"z` | 命名寄存器 | 你想要的任何内容 |\n| `\"A-\"Z` | 追加寄存器 | 使用 `\"A` 将*追加*到寄存器\
    \ `\"a` 中，而不是*覆盖*它 |\n\n### 折叠 (Folding)\n\n#### 折叠命令\n\n| 命令 | 选项 |\n| --- |\
    \ --- |\n| `zc` | 关闭当前折叠 |\n| `zo` | 打开当前折叠 |\n| `za` | 切换当前折叠状态 |\n| `zC` | 关闭光标处所有可能的折叠\
    \ |\n| `zO` | 打开光标处所有可能的折叠 |\n| `zA` | 切换光标处所有可能的折叠 |\n| `zr` | 整个文档的折叠减少一级 |\n\
    | `zm` | 整个文档的折叠增加一级 |\n| `zR` | 打开所有折叠 |\n| `zM` | 折叠所有内容 |\n\n### 菜单 (Menus)\n\
    \n#### 菜单命令\n\n| 命令 | 模式 |\n| —— | —— |\n| `:menu` | 普通模式、插入模式、操作等待模式 |\n| `:nmenu`\
    \ | 普通模式 |\n| `:vmenu` | 视觉模式 |\n| `:omenu` | 操作等待模式 |\n| `:menu!` | 插入模式、命令行\
    \ |\n| `:menu` | 命令行 |\n| `:amenu` | 所有 |\n\n#### 标签页命令 (Tab Commands)\n\n*  \
    \ 打开新标签页：\n    *   `:tabnew` *filename*\n    *   `:tabe` *filename*\n*   关闭当前标签页\n\
    \    *   `:tabc`\n        *   `:tabclose`\n        *   注意上述两种方法都可以带有 `!` 来强制关闭标签页，即使缓冲区中有未保存的更改。\n\
    *   关闭其他标签页\n    *   `:tabo` 关闭所有其他标签页。\n*   进入下一个标签页 - `gt` - `:tabn`\n*   回到上一个标签页\
    \ - `gT` - `:tabp`\n*   进入特定标签页 - `:tabfir` 跳到**第一个**标签页 - `:tabl` 跳到**最后一个**标签页\
    \ - *tabNumber*`gt` 跳到指定的标签页 - *tabNumber*`gT` 跳到指定的标签页\n*   重新排列标签页顺序 - `:tabm`*number*\
    \ 将标签页移动到指定标签编号**之后**。使用 0 将当前标签页置顶。 - `:tabm +`*number* 将标签页向**右**移动 *number*\
    \ 个位置 - `:tabm -`*number* 将标签页向**左**移动 *number* 个位置\n*   列出所有打开的标签页 - `:tabs`\n\
    \n## 附录 3：示例 `.vimrc` 文件\n\n本节提供了几个简单（但有效）的 `.vimrc` 文件，并附有注释。请注意这些并不是*我的* `.vimrc`\
    \ 文件，尽管它们在很大程度上是*基于*我的配置。这些文件旨在作为简单的起点，让你从中获得灵感。你可以使用它们一段时间，对其进行调整，并随着时间的推移得到让你满意的配置。\n\
    \n如果你想看我现在使用的配置，可以在 [GitHub](https://github.com/PogiNate/dots/blob/master/home/.vimrc)\
    \ 查看。我尝试定期备份它。理论上你可以你可以直接复制我的文件，但里面有很多你可能不需要的内容，除非你是地球上另外五个职业从事 XQquery 开发的人员之一。\n\
    \n就此如此，如果你还没有将 `.vimrc` 和其他文件备份在在线服务上，现在是一个开始的好时机。没有什么比发现所有自定义设置无影无息地消失更令人沮丧了。\n\
    \n好了，话话长说，这是我实际使用的最简单的基础示例文件：\n\n* *\n\n```vim\n1 \"告诉 vim 只以 VIM 模式运行，而不是 vi\"\
    \n2 set nocompatible\t\t\n3 \"记住它必须放在 ~/.vim/colors 目录下\"\n4 colorscheme jellybeans\t\
    \n5 \"在屏幕左侧显示行号\"\n6 set nu\t\t\t\t\n7 \"将 <leader> 键改为逗号而不是反斜杠\n8 let mapleader=\"\
    ,\"\t\t\n9 \"启用语法高亮\"\n10 syntax on\t\t\t\t\n11 \"智能处理缩进和插件\"\n12 filetype plugin\
    \ indent\t\n13 \n14 \"让退格键正常工作\"\n15 \"vim 默认的退格很奇怪\"\n16 \"让它按照你预期的方式运行\"\n17\
    \ set backspace=2\n18 \"更健康的退格设置\"\n19 set backspace=indent,eol,start \n20 \n\
    21 \"Pathogen 设置\"\n22 \"这一行告诉 vim 加载所有 Pathogen 安装的插件\"\n23 \"当然，需要先安装 Pathogen\
    \ 才能生效\"\n24 execute pathogen#infect() \n```\n\n```vim\n1 \"告诉 vim 只以 VIM 模式运行，而不是\
    \ vi\"\n2 set nocompatible\t\t\n3 \"记住它必须放在 ~/.vim/colors 目录下\"\n4 colorscheme\
    \ jellybeans\t\n5 \"在屏幕左侧显示行号\"\n6 set nu\t\t\t\t\n7 \"将 <leader> 键改为逗号而不是反斜杠\n\
    8 let mapleader=\",\"\t\t\n9 \"启用语法高亮\"\n10 syntax on\t\t\t\t\n11 \"智能处理缩进和插件\"\
    \n12 filetype plugin indent\t\n13 \n14 \"让退格键正常工作\"\n15 \"vim 默认的退格很奇怪\"\n16 \"\
    让它按照你预期的方式运行\"\n17 set backspace=2\n18 \"更健康的退格设置\"\n19 set backspace=indent,eol,start\
    \ \n20 \n21 \"Pathogen 设置\"\n22 \"这一行告诉 vim 加载所有 Pathogen 安装的插件\"\n23 \"当然，需要先安装\
    \ Pathogen 才能生效\"\n24 execute pathogen#infect() \n```\n\n```vim\n1 \"告诉 vim 只以\
    \ VIM 模式运行，而不是 vi\"\n2 set nocompatible\t\t\n3 \"记住它必须放在 ~/.vim/colors 目录下\"\n\
    4 colorscheme jellybeans\t\n5 \"在屏幕左侧显示行号\"\n6 set nu\t\t\t\t\n7 \"将 <leader>\
    \ 键改为逗号而不是反斜杠\n8 let mapleader=\",\"\t\t\n9 \"启用语法高亮\"\n10 syntax on\t\t\t\t\n\
    11 \"智能处理缩进和插件\"\n12 filetype plugin indent\t\n13 \n14 \"让退格键正常工作\"\n15 \"vim\
    \ 默认的退格很奇怪\"\n16 \"让它按照你预期的方式运行\"\n17 set backspace=2\n18 \"更健康的退格设置\"\n19 set\
    \ backspace=indent,eol,start \n20 \n21 \"Pathogen 设置\"\n22 \"这一行告诉 vim 加载所有 Pathogen\
    \ 安装的插件\"\n23 \"当然，需要先安装 Pathogen 才能生效\"\n24 execute pathogen#infect() \n```\n\
    \n稍微长一点的 .vimrc\n\n```vim\n1 \"告诉 vim 只以 VIM 模式运行，而不是 vi\"\n2 set nocompatible\t\
    \t\n3 \"记住它必须放在 ~/.vim/colors 目录下\"\n4 colorscheme jellybeans\t\n5 \"在屏幕左侧显示行号\"\
    \n6 set nu\t\t\t\t\n7 \"将 <leader> 键改为逗号而不是反斜杠\n8 let mapleader=\",\"\t\t\n9 \"\
