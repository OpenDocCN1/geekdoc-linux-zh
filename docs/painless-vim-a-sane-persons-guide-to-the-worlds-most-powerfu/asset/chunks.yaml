    While you may not consciously think about the time you spend reaching for special
    keys or the mouse, you are losing time, and more than that, at least a part of
    your brain is distracted from what you’re doing; you’re losing *context*. The
    whole point of the vim way is to let you “touch edit” your text^([53](#chap35.xhtml_fn-touch-edit)).
    To that end vim is based almost entirely on three special keys:


    * `<esc>`

    * `<ctrl>`

    * `:`


    Pretty much everything else you do in vim will be a a regular ol’ letter or number
    key. While you’re using `vim` you can almost totally ignore the denizens of special
    key ghetto. You can just keep your fingers on home row without ever moving your
    hands from their resting position on the keyboard.


    Now, you’re looking and have realized that `<esc>` and `<ctrl>` aren’t exactly
    ergonomically placed keys. Many others have realized this as well. The next chapter
    will go into a little more detail about how to fix this problem, but here’s a
    sneak preview: [remap the caps lock key](#chap19.xhtml_clmd) to be an extra `<ctrl>`
    key. Once you do that you’ve removed any need to move your hands down to the bottom
    row, which just slows you down. Also, `vim` interprets `<ctrl>[` as `<esc>`, and
    once you know that you never have to reach for that insanely placed `<esc>` button
    again. Your hands are now free to always hover right over home row, regardless
    of what you have to do in your editing, and you no longer have to break the physical
    or mental context you’ve built up while working.


    None of this is intended to say that you must never use any other editor again.
    Even while writing this book I’ve used `Scrivener`, `Multimarkdown Composer`,
    `Sublime Text` and `Ulysses` in addition to `vim`, depending on what I was doing
    and where I was in the writing and editing process. You should always use the
    right tool for the job. But with a little practice you’ll find that `vim` becomes
    the right tool for most text editing jobs. ^([54](#chap35.xhtml_fn-Quickcursor))


    # 18. Mapping Keys


    One of the good things about `vim` is that it has a *lot* of commands, and pretty
    much every [plugin](#chap11.xhtml_plugins) brings a bunch more. One of the bad
    things about `vim` is that it has a *lot* of *hard to type* commands, and pretty
    much every plugin brings a bunch more. Fortunately, it’s easy to create keyboard
    shortcuts (or “key maps” in the vernacular) for these commands, thus freeing up
    your brain space and cutting down what you have to type into just a few characters.


    However, this is definitely a topic where the Spider-Man warning applies^([55](#chap35.xhtml_fn-spiderMan)),
    because you can get yourself into trouble changing too much without thinking ahead.
    We’re going to go over some common-sense strategies for mapping keys in `vim`,
    and set up a few maps that will help you work faster and more happily. Adding
    a new key map in `vim` is a matter of adding a single line to `.vimrc`, and once
    you get used to the syntax it’s not terribly difficult. The problem is the syntax.
    Like many things in `vim`, it’s concise, compact, and aggressively opaque unless
    someone tells you how to use it. That’s why I’m here!


    ## All the Key map Commands


    Since `vim` is a modal editor, it allows you to create key maps for each mode
    individually. The upshot is that you could have (this is **just an example**.
    Don’t do this) `<ctrl>s` mean “save” in normal mode, “search” in insert mode,
    and “select all” in visual mode ^([56](#chap35.xhtml_fn-butdont)).


    You specify the target mode for your key map with the first letter of the `map`
    command:


    * `nmap` : normal mode

    * `vmap` : visual mode

    * `imap` : insert mode


    Let’s take a look at how you would use these in real life.


    The pattern for new mappings is *map-mode* *keys* *command*. Let’s say that you
    want to *always* append text to the end of a word when you jump to the end of
    a word. In stock `vim` you jump to the end of a word by just pressing `e` in normal
    mode. To enter insert mode we would add this line to `.vimrc`:


    ```

    1 nmap e ea

    ```


    And then either restart `vim` or do our old `:so %` trick to reload our settings
    immediately. Now, when you press `e` your cursor jumps to the end of the word
    and enters insert mode, all at once. But let’s say we didn’t want to overwrite
    a built-in `vim` command (smart move! But more on that soon). Let’s say we want
    to turn `<ctrl>e` into our “jump to the end and append” command. In that case
    we need to let `vim` know that we’re using `<ctrl>` in our keymap, and to do that,
    we wrap the keys we’re going to press in angle brackets, like so:


    ```

    1 nmap <C-e> ea

    ```


    In `vim`, putting the letter `C` with a dash and any other character inside angle
    brackets says “I’ll hold down Ctrl and this other character at the same time”^([57](#chap35.xhtml_fn-mappingAlt)).
    If you just typed


    ```

    1 nmap C-e ea

    ```


    You would have to type an uppercase `C`, a dash, and a lowercase `e` in that order
    to activate the key.


    ## Take me to `< to>




    ,,,,,,,,,,,,,,,,,, to to to..


    ## Take me to `<Leader>`




    ,, this is because `vim` allows you to decide what key to use as a preface. In
    our example we have written


    ```

    1 nmap <Leader>ea

    ```


    And all we we’ good!! But what heck is `<Leader>`?


    By default, `<Leader>` is mapped to backslash (`\`). For most people this is super
    annoying key to press. So for years people have added the following line to `.vimrc`:


    ```

    1 let mapleader=","

    ```


    Which sets the comma key as `<Leader>`. Once you’ve done that you can just press
    `,e` and edit it all once^([58](#chap35.xhtml_fn-justasquick)).


    ## What to map


    `vim` being what it is, you’re free to map any function you like to any keyboard
    action you like, and make `vim` work exactly the way you’ve always wanted. You
    could decide that you don’t like `h j k l` and map them to some keys you like,
    like say, `w a s` (because you’re a gamer and use those all the time). But if
    you do that you’ve got to figure out what to do about the following four commands:


    * Next word (**w**)

    * Append (**a**)

    * Substitute character (**s**)

    * Delete (**d**)


    You could map them over to `h j k l`, but what sense does that make? `w` for “next
    word” is an natural and well crafted mnemonic. `k` makes far less sense. So you
    could try to map “Next word” to `n`, but then you’ve got to find a place for “find
    next”, and so forth.

