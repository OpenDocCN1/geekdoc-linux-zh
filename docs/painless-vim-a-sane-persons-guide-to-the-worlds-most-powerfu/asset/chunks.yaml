  raw: "While you may not consciously think about the time you spend reaching for\
    \ special keys or the mouse, you are losing time, and more than that, at least\
    \ a part of your brain is distracted from what you’re doing; you’re losing *context*.\
    \ The whole point of the vim way is to let you “touch edit” your text^([53](#chap35.xhtml_fn-touch-edit)).\
    \ To that end vim is based almost entirely on three special keys:\n\n*   `<esc>`\n\
    \n*   `<ctrl>`\n\n*   `:`\n\nPretty much everything else you do in vim will be\
    \ a regular ol’ letter or number key. While you’re using vim you can almost totally\
    \ ignore the denizens of special key ghetto. You can just keep your fingers on\
    \ home row without ever moving your hands from their resting position on the keyboard.\n\
    \nNow, you’re looking and have realized that `<esc>` and `<ctrl>` aren’t exactly\
    \ ergonomically placed keys. Many others have realized this as well. The next\
    \ chapter will go into a little more detail about how to fix this problem, but\
    \ here’s a sneak preview: [remap the caps lock key](#chap19.xhtml_clmd) to be\
    \ an extra `<ctrl>` key. Once you do that you’ve removed any need to move your\
    \ hands down to the bottom row, which just slows you down. Also, vim interprets\
    \ `<ctrl>[` as `<esc>`, and once you know that you never have to reach for that\
    \ insanely placed `<esc>` button again. Your hands are now free to always hover\
    \ right over home row, regardless of what you have to do in your editing, and\
    \ you no longer have to break the physical or mental context you’ve built up while\
    \ working.\n\nNone of this is intended to say that you must never use any other\
    \ editor again. Even while writing this book I’ve used Scrivener, Multimarkdown\
    \ Composer, Sublime Text and Ulysses in addition to vim, depending on what I was\
    \ doing and where I was in the writing and editing process. You should always\
    \ use the right tool for the job. But with a little practice you’ll find that\
    \ vim becomes the right tool for most text editing jobs. ^([54](#chap35.xhtml_fn-Quickcursor))\n\
    \n## 18. Mapping Keys\n\nOne of the good things about vim is that it has a *lot*\
    \ of commands, and pretty much every [plugin](#chap11.xhtml_plugins) brings a\
    \ bunch more. One of the bad things about vim is that it has a *lot* of *hard\
    \ to type* commands, and pretty much every plugin brings a bunch more. Fortunately,\
    \ it’s easy to create keyboard shortcuts (or “key maps” in the vernacular) for\
    \ these commands, thus freeing up your brain space and cutting down what you have\
    \ to type into just a few characters.\n\nHowever, this is definitely a topic where\
    \ the Spider-Man warning applies^([55](#chap35.xhtml_fn-spiderMan)), because you\
    \ can get yourself into trouble changing too much without thinking ahead. We’re\
    \ going to go over some common-sense strategies for mapping keys in vim, and set\
    \ up a few maps that will help you work faster and more happily. Adding a new\
    \ key map in vim is a matter of adding a single line to `.vimrc`, and once you\
    \ get used to the syntax it’s not terribly difficult. The problem is the syntax.\
    \ Like many things in vim, it’s concise, compact, and aggressively opaque unless\
    \ someone tells you how to use it. That’s why I’m here!\n\n### All the Key map\
    \ Commands\n\nSince vim is a modal editor, it allows you to create key maps for\
    \ each mode individually. The upshot is that you could have (this is **just an\
    \ example**. Don’t do this) `<ctrl>s` mean “save” in normal mode, “search” in\
    \ insert mode, and “select all” in visual mode ^([56](#chap35.xhtml_fn-butdont)).\n\
    \nYou specify the target mode for your key map with the first letter of the `map`\
    \ command:\n\n*   **nmap** : normal mode\n\n*   **vmap** : visual mode\n\n*  \
    \ **imap** : insert mode\n\nLet’s take a look at how you would use these in real\
    \ life.\n\nThe pattern for new mappings is *map-mode* *keys* *command*. Let’s\
    \ say that you want to *always* append text to the end of a word when you jump\
    \ to the end of a word. In stock vim you jump to the end of a word by just pressing\
    \ `e` in normal mode. To enter insert mode we would add this line to `.vimrc`:\n\
    \n```\n1 nmap e ea\n```\n\nAnd then either restart vim or do our old `:so %` trick\
    \ to reload our settings immediately. Now, when you press `e` your cursor jumps\
    \ to the end of the word and enters insert mode, all at once. But let’s say we\
    \ didn’t want to overwrite a built-in vim command (smart move! But more on that\
    \ soon). Let’s say we want to turn `<ctrl>e` into our “jump to the end and append”\
    \ command. In that case we need to let vim know that we’re using `<ctrl>` in our\
    \ keymap, and to do that, we wrap the keys we’re going to press in angle brackets,\
    \ like so:\n\n```\n1 nmap <C-e> ea\n```\n\nIn vim, putting the letter C with a\
    \ dash and any other character inside angle brackets says “I’ll hold down Ctrl\
    \ and this other character at the same time”^([57](#chap35.xhtml_fn-mappingAlt)).\
    \ If you just typed\n\n```\n1 nmap C-e ea\n```\n\nYou would have to type an uppercase\
    \ C, a dash, and a lowercase e in that order to activate the key map.\n\nOkay,\
    \ so, we’ve got the basic idea of keymaps: Tell vim where to use our new shortcut,\
    \ what the shortcut is, and what it should do. Simple, right? Right. But we’re\
    \ not going to leave it that way for long. Normal mode is a busy place, and there\
    \ are very few keys on the keyboard you can map with impunity. Fortunately, Vim\
    \ has provided a way for us to extend the number of keys we can use without stepping\
    \ on any currently mapped commands, using the `<Leader>` key.\n\n### Take me to\
    \ your `<Leader>` Key!\n\nYou’re right, if you look at any keyboard you won’t\
    \ find a key with “leader” written on it. This is because vim allows you to decide\
    \ what key you want to use as a preface to your custom keymaps. In our example\
    \ above we mapped `<C-e>` to a command, but that’s already got a function in vim.\
    \ What we could have done is written our mapping like this\n\n```\n1 nmap <Leader>e\
    \ ea\n```\n\nAnd all we have to do is press… something and then e and we’re good!\
    \ But what the heck is `<Leader>`?\n\nBy default, `<Leader>` is mapped to backslash\
    \ (`\\`). For most people this is a super annoying key to press and makes your\
    \ “shortcuts” irritating. So for years people have added the following line to\
    \ `.vimrc`:\n\n```\n1 let mapleader=\",\"\n```\n\nWhich sets the comma key as\
    \ `<Leader>`. Once you’ve done that you can just press `,e` and you have a simple\
    \ way to jump to the end of a word and edit it all at once^([58](#chap35.xhtml_fn-justasquick)).\n\
    \nIf you forget what keys you have mapped you can type `:map` in normal mode and\
    \ be utterly overwhelmed with text. We’ll get back to that in a while. For now\
    \ let’s talk about things we *shouldn’t* map.\n\n### What not to map\n\nVim being\
    \ what it is, you’re free to map any function you like to any keyboard action\
    \ you like, and make vim work exactly the way you’ve always wanted. You could\
    \ decide that you don’t like `h j k l` and map them to some keys you like better,\
    \ like, say, `w a s d`. But as my dad always told me when I was growing up:\n\n\
    > Just because you can doesn’t mean you should.\n\n> \n\n> –*Nate’s Dad*\n\nThere\
    \ are a few excellent reasons why you *shouldn’t* remap any of the basic commands.\
    \ The first one is what I call the *wallpaper effect*^([59](#chap35.xhtml_fn-wallpaper)).\
    \ As we have already stated, just about every key on the keyboard has a pre-defined\
    \ job in normal mode. Let’s stick with the terribly bad example above and say\
    \ that you want to remap the movement keys `h j k l` (because those are hard to\
    \ remember) to `w a s d` (because you’re a gamer and use those all the time) .\
    \ But if you do that you’ve got to figure out what to do about the following four\
    \ commands:\n\n*   Next word (**w**)\n\n*   Append (**a**)\n\n*   Substitute character\
    \ (**s**)\n\n*   Delete (**d**)\n\nYou could map them over to `h j k l`, but what\
    \ sense does that make? `w` for “next word” is an natural and well crafted mnemonic.\
    \ `k` makes far less sense. So you could try to map “Next word” to `n`, but then\
    \ you’ve got to find a place for “find next”, and so forth."
