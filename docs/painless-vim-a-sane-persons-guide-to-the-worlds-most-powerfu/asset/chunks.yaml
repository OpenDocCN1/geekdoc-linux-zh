  trans: "\n然而，它们绝对*不是*无痛的。比如“到目前为止，我还没有用 MacVim 的菜单命令添加新的菜单项”。你可以使用之前列出的普通菜单命令，但分配\
    \ Mac 特有的键盘快捷键到目前我还未搞定。正如我已经提到的，你无法在 MacVim 中隐藏菜单；它们将始终显示在菜单栏上，即使你在名称前加上了 `]`\
    \ 符号。所以，如果你想学习如何制作 OSX 特有的菜单，请查看 MacVim 中的 `:h macvim-menus`，并告诉我你发现了什么。\n\n#\
    \ 27. 文学类 Vim：在 Vim 中编写散文\n\n首先，我必须向大家坦白：这本书有极少的内容是在 `vim` 中编写的。在大多数情况下，我是在 `Scrivener`\
    \ 中编写、审阅和编辑这本书的，偶尔切换到 `Multimarkdown Composer` 来处理如表格之类的花哨 Markdown 特性。^(74) 这并不是因为\
    \ `vim` 是编写散文的坏选择，更多是因为多年来我非常熟悉并喜欢 `Scrivener`，我发现它非常适合我编写散文的方式。\n\n但那是我个人的习惯。许多人问我我如何使用\
    \ `vim` 写作而不是编码。这是一个很好的问题，而且并不意外的是，`vim` 确实擅长成为作者的首选编辑器。只需稍微努力，你就能让 `vim` 的全部威力助力你的博客、论文或关于使用\
    \ `Scrivener` 的书籍。毕竟，有情回报是公平的。\n\n## 设置写作工作流\n\n当我写散文时，我几乎无一例外使用 [Markdown](http://daringfireball.net/projects/markdown/)，或者具体地说\
    \ [MultiMarkdown](http://fletcherpenney.net/multimarkdown/)，而不是在 `Word`、`Pages`、`LibreOffice`\
    \ 等文字处理器中编写。在本章中，我假设你也在这样做。\n\n所以，为了写散文，我们需要一个（多）标记语言语法文件，这样 `vim` 就能帮助我们完成所有的语法高亮以及它非常擅长的其他功能。到目前为止，我发现最好的是由你猜对了）Tim\
    \ Pope 提供的，可以在 [GitHub](https://github.com/tpope/vim-markdown) 上找到。请查看插件章节以复习如何安装它。\n\
    \n稍后我们将讨论如何实际上将你的 Markdown 风格的文本导出为美观且完全格式化的内容，既然我们已经开始上手了，现在就来安装所需的软件吧。\n\n[MultiMarkdown](http://fletcherpenney.net/multimarkdown/)\
    \ 是我的首选转换器。它运行在任何桌面操作系统上，能精辟地将 `Markdown` 和 `MultiMarkdown` 转换为各种格式，并且免费且频繁更新。\n\
    \n一旦你运行了 `mmd`，就是将 `vim` 设置为写作模式而不是编码模式了。\n\n## 写作友好的 Vim 设置\n\n使用 `vim` 作为主要写作工具的巨大好处之一是它是原始的无干扰写作程序之一。全屏打开\
    \ `vim`，你除了写作别无他事。但我们需要微调一些设置才能开始。\n\n第一个是折行（line wrapping）。当你编程时，通常希望每一行都保持独立，这样可以确保内容对齐等。当你写散文时，情况就不如此。坦率地说，`vim`\
    \ 有折行功能，而且非常易用。但你需要提前做出一些决定。\n\n主要的决定是你是想一直开启折行，还是偶尔开启。如果你主要将 `vim` 作为代码编辑器，你可能希望默认关闭折行。如果你将其作为文本编辑器，你可能希望开启它。由于我们现在谈论的是文学类\
    \ `vim`，我们将选择开启折行，然后讨论如何方便地切换。\n\n为了让 `vim` 智能地处理折行，你需要在 `.vimrc` 中设置几个标记：\n\n\
    ```\n1 set wrap\n2 set linebreak\n3 set nolist\n```\n\n第一个是显而易见的：我们希望它折行。第二个告诉\
    \ `vim` 在换行符列表中的某一个处断行，而不是仅仅说“好！！那里有 80 列！下一个字符跳到下一行！”。这者之间的区别在于：\n\n```\n1 Here\
    \ I am on line one. This is a good line. I wo\n2 nder when I will hit line two?\n\
    ```\n\n与这个区别：\n\n```\n1 Here I am on line one. This is a good line. I \n2 wonder\
    \ when I will hit line two?\n```\n\n你可以查看 `:h linebreak` 以获取更多关于哪些字符触发换行以及其内部工作原理的信息。但目前我们只需坚持标准答案：它效果非常好。\n\
    \n关于 `wrap` 和 `linebreak` 的下一个要点是，它们插入的是软换行（soft line breaks）而不是硬换行（hard line\
    \ breaks）。硬换行相当于实际按下 `<enter>` 键，而软换行仅在视觉上将文本移动到下一行。如果你加宽 `vim` 窗口，文本将重新流到新宽窗口的末。如果你在写\
    \ `Markdown`，你绝对想要软换行，因为 `Markdown` 解析器会在运行时恰当地地格式化你的文本。\n\n那么，`nolist` 呢？我们关闭它是因为\
    \ `list` 会破坏折行和换行。你可以在帮助文件中阅读更多信息：`:h list`，但现在先把它关闭。\n\n好了，现在 vim 已经准备好写作了！但如果我们突然讨厌了折行怎么办？让我们在\
    \ `.vimrc` 中再添加一行，以便：\n\n```\n1 nnoremap <F7> :set wrap<CR>\n```\n\n这条命令的目的是显而易见的。如果你愿意，可以将其映射到类似`<leader>w`\
    \ 之类的键，但我发现这对我有效。\n\n## 传播信息：如何让你的话传出去\n\n终有一天，你的文字将离开电脑的温暖怀抱，在现实世界中自谋生存。这是一个既自豪又恐惧的时刻。如果你通过某些很棒的支持\
    \ Markdown 的网站（例如 [Leanpub](http://leanpub.com））发布你的杰作，那么你的工作基本上完成了。按照他们的指令将文本上传到他们的服务器，然后静静享受吧，工作得很漂亮。\n\
    \n然而，如果你使用任何其他方法，我们还有一些工作要做。我们用 `Markdown` 写作是因为你的文本现在可以转换为你需要的任何格式。这就是 `mmd`\
    \ 发挥用场的地方。让我们从最简单的开始。你可以在示例仓库的 `literary.md` 文件进行练习。\n\n```\n1 mmd literary.md\n\
    ```\n\n就这样，你可以在 markdown 文件旁边有了一个新的 HTML 页面。如果你在浏览器中打开该页面，你会发现所有的文本格式化（如表格、斜体、粗体、脚注等）都在那里，但几乎没有其他格式化设置。\n\
    \n这是因为我们还没有告诉 `MultiMarkdown` 使用什么字体、颜色、对齐方式等。虽然你*可以*通过提供一个想要与输出一起使用的样式表来实现，但我建议不要这样做。一旦你拥有了基础格式化的文本版本，你有几个选择：\n\
    \n*   交给出版社并使用他们的格式\n*   使用文字处理器或其他可以处理自定义文本格式的程序对你的文本进行处理。\n\n### 更多格式！我需要更多格式！\n\
    \n官方的 MultiMarkdown 程序可以将你的文本转换为一系列令人印象深刻的格式，但如果你像大多数人一样，你会注意到几个明显的遗漏。例如，创建 Word\
    \ 的 `.docx` 文件或 `PDF` 文件的选项在哪里？\n"
- fmt: "\nThe short answer is that `mmd` can turn your markdown into `LaTeX`, and\
    \ you can turn `.tex` files into just about anything, if you want. But that’s\
    \ probably not the answer you were looking for. Learning the mysteries of `LaTeX`\
    \ formatting is probably not what you set out to do. Fortunately there are ways\
    \ around that.\n\n[Pandoc](http://johnmacfarlane.net/pandoc/installing.html) is\
    \ one such way. Pandoc seeks to turn just about anything into just about anything\
    \ else, text-wise. If you wanted to make a Microsoft Word document out of `literary.md`\
    \ all you would have to do is this: (after installing `pandoc`, of course)\n\n\
    ```\n1 pandoc -f markdown_mmd -t docx -o literary.docx literary.md\n```\n\nThe\
    \ switches we’re using here are:\n\n*   `-f` incoming format\n*   `-t` target\
    \ format\n*   `-o` output file name\n\nAnd finally the name of the file you want\
    \ to convert. It’s worth noting that `pandoc` also doesn’t do PDF output. Microsoft\
    \ Word, however, does.\n\nBut what if you don’t want to write all this stuff on\
    \ the command line? What if you want live previews of what your text is going\
    \ to look like, *and* the ability to actually finally create a PDF from your text?\n\
    \nWell, there are apps for that. My favorite app on OSX is [Marked](http://marked2app.com).\
    \ Marked lets you see how all your formatting is going to look, has a number of\
    \ built-in stylesheets as well as the ability to add new stylesheets of your own,\
    \ does a surprisingly wide array of sanity and writing checks on your text, and\
    \ it can export a PDF of your file. It’s basically a writer’s best friend.\n\n\
    ## 28. Conclusion\n\nWell, here we are at the end of all things Painless and Vimish^([76](#chap35.xhtml_fn-Vimish)).\
    \ We’ve had some good times, we’ve learned how to do a lot of things in an editor\
    \ that has been proven (by other people) to be fast and user friendly in the right\
    \ hands. I hope you’ve seen that you’ve got a great tool at your disposal, and\
    \ that it isn’t as scary as it looked all those chapters ago when you were first\
    \ starting out.\n\nBut there’s still a long way to go, a lot more to learn. We\
    \ haven’t covered everything you can do with `vim`, not by a long chalk. I haven’t\
    \ even touched topics like writing your own plugins using `vim script`, and for\
    \ good reason: I have no idea how to do that. But hopefully at this point you\
    \ are feeling like those topics aren’t too scary, you’re feeling like you can\
    \ handle this whole `vim` thing without fear, and you can hop onto anybody’s computer\
    \ and use the world’s most built-in text editor instead of making excuses.\n\n\
    Like I said, there’s still a long way to go. Fortunately there is an entire internet\
    \ full of resources out there to help you reach true `vim` mastery, if such is\
    \ your goal. If you just want to *use* `vim` you’re probably just about there.\
    \ I’d recommend going back over this material in small bites from time to time\
    \ as you settle into using `vim` on a daily basis. Perhaps there was something\
    \ you read about a while ago that you wanted to try, and now that you’re more\
    \ comfortable you can add a few new commands to your arsenal. If you want to expand\
    \ beyond what you’ve read here I’d recommend picking up a more advanced book;\
    \ there are a few listed in the Appendices. If you want to start writing `vim`\
    \ plugins there’s no better time than the present to start learning `vim script`.\n\
    \nLast of all, I would like to thank you. Writing this book has been an adventure\
    \ for me. I’ve learned a ton about `vim`, and about writing, in this process.\
    \ All the positive comments and suggestions have been deeply felt and appreciated.\
    \ And your confidence, expressed in the form of actually dipping into your own\
    \ hard-earned cash and *buying this book* is simply amazing. Again, I thank you.\n\
