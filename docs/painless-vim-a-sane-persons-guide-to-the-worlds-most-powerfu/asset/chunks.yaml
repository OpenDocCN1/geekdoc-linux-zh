    ## 几个月前


    根据我的观点，请看上面关于“观点性”（Opinionated）的内容。


    [`natedickson.com`](http://natedickson.com)


    [`crazyapplenews.com`](http://crazyapplenews.com)


    [@poginate](https://twitter.com/poginate)


    [`github.com/PogiNate`](http://github.com/PogiNate)


    我会经常使用像“终端”（Terminal）这样最通用的词汇。如果你的操作系统称它为其他名称，比如 shell、命令行（command line）或（愿上天保佑你）`cmd.exe`，那么在脑海中把它替换掉即可。


    之后你会想知道这是“退出且不保存任何内容”的退出方法。还有其他退出 vim 的方法，但我们以后会再说。


    记住，以冒号 `:` 开头的命令需要按下 `<enter>` 才能执行。好了，这绝对是我最后一次重复这句话了。


    我听过有人把普通模式（Normal Mode）称为“哔哔模式”（Beep Mode），因为你会尝试切换回它，结果终端会向你发出哔哔声，然后你发现自己已经在里面了。我不知道是否真的有人这么这么叫它，但由于我正在写一本
    vim 书，我有义务把这个信息传给你们。就像如果我在写一本《初学者计算机事实大全书》，我有义务提到 4 个比特被称为“nibble”（半字节，因为是半个字节（byte），而“byte”听起来像“bite”！懂了吗？懂了没？？），尽管我很确定这只是几年前放进某本教科书里的一个笑话，后来就演过头。


    “做事情不止一种方法”（There is more than one way to do it）通常读音为“Tim-Toady”。


    这里有两个退出 vim 的秘密额外方法，你们在学会如何打开多个文件之前不需要知道：`:qa` 关闭所有已打开的文件并退出 vim，而 `:qa!` 即使文件有未保存的也会执行相同的操作。别担心，当我们讨论打开多个文件时会再次回顾它们。


    在 Windows 上情况稍微复杂一点。我们将假设你在一台类 Unix 机器上进行操作，因为这样比较简单。


    或者对于那些用 Markdown 写 vim 书的人来说。


    这在 Unix 术语中是指[读取文件并执行其内容](http://stackoverflow.com/questions/9326695/what-does-it-mean-to-source-a-file-in-unix-linux-context)


    这实际上花了我一些现钱，但并不多。


    直到我创建了自己的，我是。


    至少对程序员来说是。经理们会认为，那 90% 的时间至少有一部分是花在偷偷看技术博客和漫画上的。


    我特意使用“动作”（motions）这个词“命令”（commands）或“操作”（actions）。现在先不用担心，留到以后用吧。


    我只会讲这一次，因为这很烦人。vi 的粉丝们会坚持要求你把“vi”读成“vee eye”而不是“vie”，理由是：闭嘴吧。谢天地，“vim”的读音就是“vim”。这是你永远、永远不要使用未改进版
    vi 的又另一个原因。


    在句子的第一个单词上一次，在“Larry”上一次，在“Wall”上一次。


    为了让“fred”变成“dead”。


    我们很快就会涉及到修改单词和句子的内容。别担心，我不会让你们悬空的。


