    \ moving your cursor around, it’s time to *edit* something. Use the movement keys\
    \ to get your cursor where you want it and press `i`.\n\nAt the bottom of the\
    \ screen you should see a message appear:\n\n```\n1 --INSERT--\n```\n\nThis is\
    \ vim’s way of telling you that pressing keys now will make things change in your\
    \ text. In vim parlance, you have just entered *insert mode*.\n\nType something\
    \ witty in the document. I would put “So long, and thanks for all the fish” because\
    \ it’s better than “hello world”. But I know it doesn’t matter what I tell you\
    \ to enter; you’ll put whatever you want. That’s just how you are. You’re independent\
    \ and I respect that.\n\nOnce your witticism is entered it’s time to save it up.\
    \ Hit `<esc>` and the `--INSERT--` message at the bottom of the screen should\
    \ disappear. This means that the keyboard is back to issuing commands to vim instead\
    \ of changing the text on the screen. Vim calls this *normal mode*, but don’t\
    \ worry too much about that yet. Type\n\n```\n1 :w\n```\n\nAnd your changes are\
    \ *saved*, friend.^([10](#chap35.xhtml_fn-lastWarning))\n\nNow let’s do something\
    \ a little more daring and, dare I say it, *useful*. Moving around with your fingers\
    \ on home row is nice and all, but it’s not worth all this hassle and bother.\
    \ Let’s look at some slightly larger jumps in the text.\n\nPosition your cursor\
    \ somewhere on a line of text–anywhere is fine– and make sure the `-- INSERT --`\
    \ thingy is gone by pressing `<esc>` a bunch of times until vim starts beeping\
    \ and/or flashing at you. ^([11](#chap35.xhtml_fn-Beep)) Now press `A`. Note that\
    \ was an uppercase `A`, not a lowercase `a`. This handy little shortcut moves\
    \ you to the end of the line and puts you back into insert mode, all at once.\
    \ Think of it as “append” or “add”. Nifty, huh? Okay, press `<esc>` again and\
    \ let’s do another one. Press `o`. (Again, note the case.) Vim adds an empty line,\
    \ right under the line you were on, and once again you’re in Insert mode, ready\
    \ to enter new text into the file. Write something if you want, and then press\
    \ `<esc>` again to get out of Insert mode.\n\nWe’re going to talk more about moving\
    \ the cursor around later, but for now look how awesome you already are! Since\
    \ you don’t need to worry about changes this time, you can just type\n\n```\n\
    1 :q!<enter>\n```\n\nTo exit vim.\n\n### Zoom!\n\nLet’s go back into vim and play\
    \ with three simple (but useful) commands that I call the *zoom* commands. To\
    \ enter vim this time type\n\n```\n1 $ vim sample1.html\n```\n\nSo that we’ve\
    \ got a document to play with. Press `j` repeatedly to move your cursor down a\
    \ few lines, it doesn’t matter where it ends up. What we’re going to do is tell\
    \ vim to scroll the window so that the line the cursor is on is positioned where\
    \ we want it.\n\nThe first “zoom” command is `zt`, which (I say) stands for “zoom\
    \ top.” When you press `zt` in command mode it will move your current line to\
    \ (you guessed it) the top of the screen. So, if your cursor is on line 15 and\
    \ is one third of the way down the screen it will now be at the top of the screen.\n\
    \nNext up is `zb`, or “zoom bottom.” As you can guess, it moves your current line\
    \ to the bottom of the screen, letting you see everything that came before.\n\n\
    The third and arguably most useful zoom command is `zz`, which positions the line\
    \ your cursor is on in the *middle* of the screen, so that you can see that line\
    \ in context. I use all three commands fairly frequently, but I find this is the\
    \ one I like the best. It’s my secret favorite child.\n\nAll right, we’ve done\
    \ some good work here. You’ve started vim and gotten around a bit, and more importantly,\
    \ you made your code all pretty. In the next chapter we’ll get down to the single\
    \ most important thing you ever have to do with an editor: choose your color scheme.\n\
    \n## 3\\. Your `.vimrc` File And You\n\nOkay, let me start by saying I didn’t\
    \ lie to you. This chapter *is* about choosing a color scheme. But to do that\
    \ we need to talk about how to save your settings from session to session. And\
    \ the way to do this is through a `.vimrc` file.\n\nFor now, we’re going to start\
    \ very *very* simply and just add a few lines. In general, any command that you\
    \ can send to vim by typing `:` and then hitting enter can be put in your `.vimrc`\
    \ file. We’re going to add two lines right now to solve a problem we had in the\
    \ last chapter. Start by telling vim to open your `.vimrc` file. On a Unix-based\
    \ machine it’s found at `~/.vimrc` ^([14](#chap35.xhtml_fn-WinVim))\n\nFrom the\
    \ command line open vim for editing with your `.vimrc` file as the subject:\n\n\
    ```\n1 $ vim ~/.vimrc\n```\n\nAnd, if you’re using a fresh install, you should\
    \ see a completely empty file. Go into insert mode by pressing `i` and enter the\
    \ following lines:\n\n```\n1 set nocompatible\n2 syntax on\n3 set nu\n4 filetype\
    \ indent plugin on\n```\n\nI realize this all looks like witchcraft at the moment,\
    \ but it’s really just telling vim a few things about how you want it to behave.\
    \ Let’s go through it line by line and you’ll see how simple it really is:\n\n\
    *   What’s that “nocompatible” thing? That line simply tells vim to be *vim* instead\
    \ of being *vi*. It’s a good way to turn off all the old, weird, useless things\
    \ that are holdovers from vim’s even older and more arcane predecessor. Just set\
    \ that line and forget all about it. All it’s doing is protecting you.\n\n*  \
    \ ‘Syntax on` is what we’ve been talking about: this tells vim to do syntax highlighting.\
    \ This is what turns on your pretty colors for good.\n\n*   Okay, so, what about\
    \ this `nu` thing? That tells vim to display line numbers down the left-hand side\
    \ of the screen. You could (temporarily) do the same thing by typing `:nu` while\
    \ in normal mode, but since vim is a programmer’s editor we’re going to make it\
    \ a part of your everyday setup. If you hate line numbers you can omit it.\n\n\
    *   The last one…the last one is a bit magic. In a nutshell we’re telling vim\
    \ to figure out what kind of file it’s looking at and load the appropriate filetype\
    \ plugin. This has a lot of benefits for programmers^([15](#chap35.xhtml_fn-OrMarkdownUsers)),\
    \ and even if you don’t fully understand it I would recommend setting it. Some\
    \ of the great tricks you’ll learn later on in this book depend on it.\n\nPress\
    \ `<esc>` to get out of insert mode and save the file by typing\n\n```\n1 :w\n\
    ```"
