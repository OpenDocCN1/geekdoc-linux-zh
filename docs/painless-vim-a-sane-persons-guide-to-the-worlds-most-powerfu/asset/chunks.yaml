  trans: "\n但似乎每次启动 `vim` 都要手动做这些操作感觉很麻烦。你说得对。别担心，我们会解决这个问题的。\n\n不过不仅如此。我们还了解到，当你向\
    \ `vim` 发送以 `:` 开头的命令时，你必须在最后按下 `<enter>`。这是一个非常有用的信息，因为从现在起，我将不再在每个命令后面都加上 `<enter>`。请记住，如果你以冒号开始一个\
    \ `vim` 命令，它总是以 `<enter>` 结尾的。还有其他命令在末尾不需要 `<enter>`，我们稍后会讨论它们。现在，让我们先看看这个文件。\n\
    \n## 2. 在 Vim 中移动：起步阶段\n\n现在你已经进入了一个文件，是时候稍微移动一下了。如果你以前玩玩过 `vim`，你可能看到过类似这样的界面：\n\
    \n```\n1 \tk\n2 h\t\tl\n3 \tj\n```\n\n这是一种非常不直观的方式，告诉你哪些键会将光标移动到哪个方向。在英语中，它的含义是：\n\
    \n*   `h` 将光标向 `left` 移动一格\n*   `l` 将光标向 `right` 移动一格\n*   `k` 将光标向 `up` 移动一行\n\
    *   `j` 将光标向 `down` 移动一行\n\n所以，花点时间在这四个键上玩玩。我承认，起初这种布局很奇怪，但它的目的是让你的手稳稳地留在主按键（home\
    \ row），过了一段时间，你会开始认为 `h j k l` 本就应该一直用来移动光标。当你使用支持 `vim` 键的程序时，这太棒了。这也意味着当你和某人进行即时消息聊天时，由于试图弄清楚为什么光标无法移动，你会无意中给他们发一条全是“jjjkl”的消息。这是一种诅咒。\n\
    \n好了，继续。一旦你习惯了移动光标，就是时候编辑某些内容了。使用移动键将光标移动到你想去的地方，然后按下 `i`。\n\n在屏幕底部你应该能看到一条信息：\n\
    \n```\n1 --INSERT--\n```\n\n这是 `vim` 在告诉你，现在按键将使你的文本发生变化。在 vim 的术语中，你刚刚进入了插入模式（insert\
    \ mode）。在文档中输入一些幽默的话。我会写“再见，感谢你们所有的鱼”，因为这比“hello world”要好。但我知道我让你输入什么并不重要；你会输入任何你想输入的内容。你就是这样的人。你是独立的，我尊重这一点。\n\
    \n一旦输入了你的幽默语，就是时候保存它了。按下 `<esc>`，屏幕底部的 `--INSERT--` 信息应该消失。这意味着键盘已经恢复到向 `vim`\
    \ 发送命令，而不是更改屏幕上的文本。`vim` 将此称为普通模式（normal mode），但先不用太担心它。输入\n\n```\n1 :w\n```\n\
    \n你的更改已经保存了，朋友。现在让我们来点稍微更大胆一些、我敢说更有用的事情。手指留在主按键上进行移动固然不错，但并不值得费这么多麻烦和困扰。让我们看看文本中稍微大一点的跳转。\n\
    \n将光标置在某行文本的任意位置——哪里都可以——并多次按下 `<esc>` 以确保 `-- INSERT --` 那个东西消失，直到 `vim` 开始向你响或或/闪烁。现在按下\
    \ `A`。注意是大大写的 `A`，而不是小写的 `a`。这个方便的小快捷键一次性让你移动到行尾并让你回到插入模式。把它想象为“追加”（append）或“添加”（add）。很神奇吧？好了，再次按下\
    \ `<esc>`，我们再来一个。按下 `o`。（再次，注意大小写。）`vim` 在你所在行的正下方添加一个空行，你再次进入了插入模式，准备好在文件中输入新文本。如果你愿意可以写点什么，然后再次按下\
    \ `<esc>` 退出插入模式。\n\n我们以后会更多更多关于移动光标的内容，但现在看看你已经有多么棒了！由于这次你不需要担心更改，你可以直接输入\n\n\
    ```\n1 :q!<enter>\n```\n\n退出 `vim`。\n\n### 缩放！\n\n让我们回到 `vim`，玩玩三个简单（但有用）的命令，我称之为“缩放命令”。这次进入\
    \ `vim` 时输入\n\n\n\n```\n1 $ vim sample1.html own\n```\n\n这样我们就有了一个文档可以玩了。反复按下\
    \ `j` 让光标向下移动几行，停留在哪里并不重要。我们要告诉 `vim` 滚动窗口，使光标所在的行位于我们想要的位置。\n\n第一个“缩放”命令是 `zt`，它（我说的）代表“缩放至顶部”（zoom\
    \ top）。当你在命令模式下按下 `zt` 时，它会将当前行移动到（你猜得的）屏幕顶部。所以，如果你的光标在第 15 行，且位于屏幕的三分之一处，它现在将位于屏幕顶部。\n\
    \n接下来是 `zb`，或者说是“缩放至底部”（zoom bottom）。正如你猜的，它将当前行移动到底部。第三个也是可能最有用的命令是 `zz`，它将你的光标置于屏幕中间。我经常使用这三个命令。\n\
    \n好了，我们已经做得不错了。你启动了 `vim` 并学会了移动，更重要的是，你让它变漂亮了。在下一章中我们将选择配色方案。\n\n## 3. 你的 .vimrc\
    \ 文件\n\n好了，让我先说我没撒谎。为了做到，我们需要讨论如何在不同会话之间保存设置。这种方法是通过一个 `.vimrc` 文件。现在，我们将从非常简单开始，只需向其中添加几行。在基于\
    \ Unix 的机器上，它位于 `~/.vimrc`。\n\n从命令行打开 `vim` 并以你的 `.vimrc` 文件作为编辑对象：\n\n```\n1\
    \ $ vim ~/.vimrc\n```\n\n而且，如果你使用的是全新安装的版本，你应该会看到一个完全空的文件。按下 `i` 进入插入模式并输入以下内容：\n\
    \n```\n1 set nocompatible\n2 syntax on\n3 set nu\n4 filetype indent\n```\n\n我意识到目前这些看起来都像巫术，但实际上只是在告诉\
    \ `vim` 一些关于你希望它如何运行。让我们逐行检查，你会发现它是多么简单：\n\n*   那个 `nocompatible` 是什么？那一行告诉 `vim`\
    \ 做为 `vim` 而不是 `vi`。这是一个关闭所有来自 `vim` 更老、更神秘的前身遗留的古旧、奇怪且无用功能的好方法。只需设置那行并忘记它吧。它只是在保护你。\n\
    *   `syntax on` 是我们一直在讨论的：这告诉 `vim` 进行语法高亮。这是永久开启漂亮颜色的关键。\n*   好了，那么这个 `nu` 是什么？它告诉\
    \ `vim` 在屏幕左侧显示行号。你可以（临时地）在普通模式下通过 `:nu` 执行相同的操作，但由于 `vim` 是程序员的编辑器，我们让它成为你日常设置的一部分。如果你讨厌行号，可以省略它。\n\
    *   最后一行——最后一行有一点魔法色彩。简而言之，我们正在告诉 `vim` 识别它正在查看什么类型的文件并加载相应的文件类型插件。这对程序员来说有很多好处，即使你并不完全理解它，我也建议设置它。你在这本书后面学到的很多很棒的技巧都取决于它。\n\
    \n按下 `<esc>` 退出插入模式，通过输入以下命令保存文件：\n\n```\n1 :w\n```\n\n"
- fmt: "\nSo, now you have two choices. You can exit vim and start it again to have\
    \ your changes take effect, or you can do some vim awesomeness. Instead of exiting\
    \ vim, enter the following:\n\n```\n1 :so %\n```\n\nNow, before you close this\
    \ book, feeling all hurt that I’m going to spring terrible surprises on you like\
    \ `.vimrc` files and arcane `:so %` commands, hear me out. What you just did is\
    \ tell vim to `source` the current file. The `so` command is a shortcut for `source`,\
    \ and `%` is a shortcut for “the current file”. See? Nothing scary happened here.\
    \ This is a useful command to know while you’re getting your vim setup just right,\
    \ and it makes you feel cool as well.\n\n## I Was Promised Color Schemes!\n\n\
    Okay, look, all of this was just ground work we had to get through to get you\
    \ your colors on a permanent basis. Adding a color scheme to vim is a two step\
    \ process:\n\n1. Install a color scheme.\n2. Tell vim to use it.\n\nAnd the easiest\
    \ way to accomplish step 2 is in your `.vimrc` file.\n\n### Picking a Color Scheme\n\
    \nThere are a ton of pre-built color schemes out there for vim. After all, people\
    \ have been using it for more than 20 years, and everybody loves colors. There\
    \ are many places to go to peruse available schemes and find one that fits your\
    \ own personal style, a few of which are listed in Appendix 1.\n\nFor the purpose\
    \ of this section, we’re going to install the [Tomorrow Theme](https://github.com/chriskempson/tomorrow-theme/tree/master/vim),\
    \ because it comes with a few nice and elegant variations, and because it’s the\
    \ one that I use right now. More specifically, I use “Tomorrow Night Eighties,”\
    \ and therefore–at least for a little while–so will you. I’m all opinionated,\
    \ remember?\n\nSo, to install the scheme, download the contents of the `colors`\
    \ folder in the github repository. You should see a list of files, all of which\
    \ have a `.vim` extension. Now it’s time to do some diving.\n\nIn your home directory\
    \ there’s a hidden folder called `.vim`, which is where vim keeps all of its configuration\
    \ stuff. Inside that directory is a folder called “colors,” and that’s where you\
    \ want to put the color schemes you just downloaded. We’re going to discuss a\
    \ better way to do this soon, but for now just move those files from wherever\
    \ you downloaded them to `~/.vim/colors`. On OSX I would do this:\n\n```\n1 $\
    \ mv ~/Downloads/colors/*.vim ~/.vim/colors\n```\n\nBut however you get the files\
    \ in place, you’ll want to end up in a situation where the output of `ls ~/.vim/colors`\
    \ looks like this:\n\n```\n1 Tomorrow-Night-Blue.vim\n2 Tomorrow-Night-Bright.vim\
    \ \n3 Tomorrow-Night-Eighties.vim\n4 Tomorrow.vim\n```\n\nYou get the idea. Once\
    \ that’s done it’s time to edit your `.vimrc` file some more. Open it up in vim\
    \ and add this line:\n\n```\n1 colorscheme Tomorrow-Night-Eighties\n```\n\nAnd\
    \ then hit `<esc>` to go back to normal mode. Save your work (`:w`), and then\
    \ call on our old friend `:so %` to see your new color scheme in all its glory.\n\
    \n### Using Keymaps to Get Unlost\n\nLet’s add one more line to your `.vimrc`,\
    \ both as instruction and because it’s useful.\n\nFrom time to time your cursor\
    \ can get lost on screen. It’s nobody’s fault, screens these days are large and\
    \ cursors are small. Therefore a lot of people like having their editor highlight\
    \ the line where the cursor is sitting. Given vim’s line-editing abilities, this\
    \ isn’t a terrible idea. There are definitely times where I want my cursor line\
    \ highlighted, but not all the time. So let’s add a keymap to `.vimrc` that allows\
    \ us to highlight and un-highlight the current line at will. Paste the following\
    \ into your `.vimrc` file:\n\n```\n1 nnoremap <silent> <F4> :set cursorline!<CR>\n\
    ```\n\nThe heart of this line is the command\n\n```\n1 `:set cursorline!`\n```\n\
    \nAll of that stuff before the command is simply a way to tell vim that we want\
    \ it to do something when we press the `<F4>` key. Let’s examine the command in\
    \ excruciating detail.\n\n* As we’ve learned before, if you type `:` at the beginning\
    \ of something it tells vim that you’re sending it a command.\n* The `set` command\
    \ tells vim that we’re going to, well, `set` an option. If we set things from\
    \ the command line in vim it will be set for this session, if we set them in `.vimrc`\
    \ they will be set for every vim session.\n* The `cursorline` option tells vim\
    \ to highlight the line where the cursor is right now.\n* The `!` at the end of\
    \ the option tells vim to toggle the `cursorline` option. If it’s currently on,\
    \ turn it off and vice versa.\n* The `<CR>` at the end tells vim to simulate pressing\
    \ the `<enter>` key. Remember, if a command begins with a colon it has to end\
    \ with an `<enter>`.\n\n## 4. Interlude: The Joy of a Good Cheat Sheet\n\nWhile\
    \ you’re learning vim it can be hard to remember all the commands and controls\
    \ and letters and combinations and stuff, and sometimes no matter how much you\
    \ ask your brain to pull up the one you need it’s just not going to do it.\n\n\
    Which is why it’s a good idea to have someone help you out. A simple memory prompt\
    \ hung up on the wall behind your computer can spur your brain back into activity.\n\
    \nThere are a lot of cheat sheets out there, most of which are the product of\
    \ a lot of time and effort on the part of the creator, who was usually trying\
    \ to create the “perfect” cheat sheet, meaning the one that works best for the\
    \ way they think.\n\nIn fact, since I first wrote this “interlude” I have created\
    \ my own cheat sheet, which is included in your *Painless Vim* download. And hey,\
    \ you spent the money on a vim book, you deserve a cheat sheet to go along with\
    \ it. My cheat sheet is a distillation of all the commands and actions that I\
    \ find myself using most frequently.\n\nBut if you’re overburdened with cash,\
    \ or just don’t particularly care for the *Painless Vim* cheat sheet then read\
    \ on, my friend. I won’t be offended, I promise.\n\nFor my money the best one\
    \ out there is the [“Beautiful” one](http://vimcheatsheet.com/), because it’s\
    \ clean, well laid out, and informative. When you start out you can just focus\
    \ on the movement arrows that dominate the top corner, and after a while you will\
    \ see that the whole thing is packed with things you can use. There are a number\
    \ of other good choices. The point of this interlude is to spend a little time\
    \ finding one that makes sense to you.\n\n## 5. Moving Around in Vim: Up Steps\n\
    \nOkay, now that the serious business of getting a color scheme set up is taken\
    \ of, let’s get back to moving around.\n\nIt’s often said that programming is\
    \ roughly 90% thinking and 10% typing. While this may be true, I would add that\
    \ a fair amount of time is also spent getting the cursor where you need it to\
    \ be. Let’s say you made a change on line 15, and from there you need to move\
    \ the end of the file to add a new method. In a regular editor you have a few\
    \ choices: you can either press the down arrow a bunch of times, or take one hand\
    \ off the keyboard entirely and click on the last line of the file. Vim has a\
    \ better idea:\n\n```\n1 G\n```\n\nThat’s it! Upper-case `G`, all by itself, will\
    \ move your cursor to the last line of the file. Want to get back to the top of\
    \ the file?\n\n```\n1 gg\n```\n\nAnd you’re there. The point is that moving around\
    \ is supremely easy in vim, once you get the hang of it. So, let’s take a look\
    \ at some of the most used motions in vim:\n\nsimple motions\n\n| Keystroke |\
    \ Motion |\n| --- | --- |\n| h | move right |\n| j | move down |\n| k | move up\
    \ |\n| l | move left |\n| b | previous word |\n| e | end of word |\n| ctrl+d |\
    \ move down by 1/2 screen |\n| ctrl+f | move down by 1 screen |\n| ctrl+u | move\
    \ up by 1/2 screen |\n| ctrl+b | move up by 1 screen |\n| gg | jump to the start\
    \ of the file |\n"
