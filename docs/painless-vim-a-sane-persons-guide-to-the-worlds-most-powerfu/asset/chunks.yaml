  trans: "\n运行 `:set foldmethod=syntax` 来进行切换。虽然语法折叠（syntax folding）在很大程度上符合你的预期，但在使用时会有一些需要注意的地方。\n\
    \n第一点是语言中的可折叠区域是由 `vim` 用来确定语法高色的同一个模块定义的。如果该模块没有关于什么构成可折叠区域的信息，你将无法使用语法折叠。这在\
    \ C/C++、Java、ruby、python 等语言中并不是问题，因为这些语言都拥有庞大且活跃的社区，确保了语言模块的完整性。但如果你使用一种不冷门或不支持的语言，其支持程度可能会参差不齐。尽管如此，它已经比较接近你预期的效果了。\n\
    \n### 好了，但我如何折叠内容呢？\n\n这是一个很好的问题。让我们回到缩进风格折叠（indent-style folding），并从那里开始介绍基本场景。在这种模式下，你可以将光标置于行首，并使用\
    \ `zc` 折叠该区域内的所有行。要重新打开折叠区域，你输入 `zo`（“o”代表“open”，打开）。酷玩家使用 `za` 在区域的打开和关闭状态之间进行切换，但为了万一起见，了解这三个命令都是值得的。\n\
    \n等一下，还有更多！（总是有更多）。使用针对单个折叠操作的命令太费劲了，不是吗？如果你想一次性操作整个段落，有一组命令也可以实现这一点。假设你有一段如下类似\
    \ python 风格的代码：\n\n```\n1 friends = ['Monique', 'Rachelle', 'Toby', 'Russ', 'Francis',\
    \ 'Regina']\n2 for name in friends:\n3 \t if name != 'bob':\n4   \t\tprint \"\
    Hello {name}!\".format(name=name)\n```\n\n好了，我并不是什么 python 天才。但这并不是重点。重点在于，你可以使用\
    \ `zC` 命令折叠整个 `for` 循环以及内部的子折叠。是的，使用大写字母会让折叠命令递归生效，而不是逐个生效。`zO` 和 `zA` 的作用正如你预期的那样样。\n\
    \n但假设你不在乎光标在哪里，你只想比现在看到更多的文件内容。这就是 `zr` 派上用场的地方。当你输入 `zr` 时，它会将整个文档的折叠层减少一级。所以，如果你在一个折叠内部还有一个折叠，现在你将只有一个折叠。如果你想让整个缓冲区中的所有内容都展开，可以通过切换到大写来增强你的减少命令：`zR`。\n\
    \n相反的操作是 `zm` 和 `zM`。小写折叠整个文档中最内层的折叠，大写则折叠所有内容。\n\n好了，这么多命令夹杂着大量的文字，所以我们现在来列出一份大大的命令表，方便查阅。（此表也包含在附录中）\n\
    \n#### 折叠命令\n\n| 命令 | 选项 |\n| --- | --- |\n| `zc` | 关闭当前折叠 |\n| `zo` | 打开当前折叠\
    \ |\n| `za` | 切换当前折叠 |\n| `zC` | 关闭光标处所有可能的折叠 |\n| `zO` | 打开光标处所有可能的折叠 |\n| `zA`\
    \ | 切换光标处所有可能的折叠 |\n| `zr` | 将整个文档的折叠层减少一级 |\n| `zm` | 将整个文档的折叠层增加一级 |\n| `zR`\
    \ | 打开所有折叠 |\n| `zM` | 折叠所有内容 |\n\n## 15. 搜索与（更重要的）查找\n\n如果没有内置良好的搜索功能，Vim 就不会是现在的样子。Vim\
    \ 的搜索功能非常强大而且异常直观……一旦你习惯了它。\n\n在我们开始之前，我想指出 vim 的搜索有两种类型：正向和反向。对于每种类型的搜索，你可以从光标搜索到文档末尾（正向样式），或从光标搜索到文件开头（反向样式）。大多数情况下，搜索在遇到文档末尾（或开头）时会回绕。我会先列出正向式的搜索命令，然后是反向式的。\n\
    \n### 全文件搜索：`/` 和 `?`\n\n你最常用的搜索类型之一是在整个文档中搜索单词或术语。要开始这种搜索，按下 `/` 或 `?`，光标将跳转到屏幕底部的命令行。输入你要搜索的内容并按\
    \ `<enter>`。Vim 将高亮你输入的单词的所有出现处，并将光标置于距离光标最近的单词出现处。然后你可以使用 `n` 键跳转到下一个匹配项。记住，如果你使用\
    \ `?` 开始搜索，那么“下一个”匹配将是靠近文档开头的匹配项，而不是末尾。\n\n但如果你想反转搜索方向呢？假设你开始搜索时按的是 `?` 但现在你想向文件末尾移动？没问题。按下\
    \ `N`（大写的 N 而不是小写的 n）将跳转到上一个匹配项，即距离末尾最近的匹配项。\n\n### 查找另一个相同的：`*` 和 `#`\n\n有时你想找到另一个实例。这在编程中特别用用：将光标置于你想查找的单词上，然后按下\
    \ `*` 或 `#`。你可以使用 `n` 和 `N` 在匹配项之间跳转。\n\n### 行内搜索：`t/T` 和 `f/F`\n\n有时你只想在行内向前或向后跳转几个单词，而不用反复按\
    \ `w` 或 `b`。再次，vim 准备就绪，这次不仅有两种类型。\n\n如果你输入 `t`*x*（或用于反向搜索的 `T`*x*），你的光标将跳转到该内距离\
    \ x 最近的出现处。然而，这可能不像你预期的那样工作。如下：\n\n```\n1 | I'll Be There For You/When the Rain\
    \ To Fall \n2 -> tF \n3  I'll Be There| For You\n```\n\n这种“到（to/t）”搜索会将你的光标落在你搜索字符的前一个。再次，我不知道为什么。但至少它是一致的。\n\
    \n幸运的是，你还有 `f`*x* 搜索方法，它的工作正如你预期的那样：\n\n```\n1 | I'll Be There For You/When the\
    \ Rain To Fall   \n2 ->fF \n3 ... |For You\n```\n\n在这两种情况下，你都使用 `;` 跳转到下一个匹配项，使用\
    \ `,` 跳转到上一个匹配项，除非你重新映射了逗号键（chap19.xhtml_what-map），但我们要几章之后才会讲到那里。\n\n### 正……正……正则表达式？！\n\
    \n如果你已经是文本处理正则表达式的粉丝，那么这一节非常适合你。如果你不确定 `/reg(ular)\\s?ex(p|pression)/` 是什么，它会引导你查看该主题的一些资源，并可能建议你跳过本章的剩余部分。并不是不想让你在这里！只是*学习*正则表达式并不完全*无痛苦*的。它*很有价值*，但需要时间和精力的。\n\
    \n"
- fmt: '

    Vim does let you search and replace using regular expressions, or “regexes” as
    they’re called by people who can never figure out how to pronounce “regexp”. So,
    that’s the good news. The bad news is that vim uses a regular expression engine
    unlike any you’ve ever seen.


    It starts out normal enough. If you want to search and replace a word you simply
    type `:s` followed by the usual regular expression replacement syntax:


    ```

    1 :s/old/new

    ```


    And the next instance of the world `old` will be replaced with the word `new`.
    Simple, right? Okay. Let’s go one step further. Now you don’t want the word `old`
    anywhere on the current line. In this case just put the letter `g` at the end
    of the string, which makes it a “global” search, although in this case a “globe”
    means “one line of text.” Don’t ask me. The point is you can remove all occurrences
    of the word “old” from a single line using this command:


    ```

    1 :s/old/new/g

    ```


    So far, no big deal, right? Okay. Let’s say that you don’t want the word `old`
    anywhere in your document at all. Okay, no problem. We’ll tell vim to search the
    *entire* document and sub in `new` for `old`:


    ```

    1 :%s/old/new/g

    ```


    What is that percent sign doing there, you ask? Remember clear back in the beginning
    of the book where we re-loaded our `.vimrc` file using the command `:so %`? Then,
    as now, the percent sign means “this here current file”. So in this case we’re
    telling vim to replace every instance of `old` in this here current file.


    Okay, now let’s get tactical about it. Let’s say that the word “old” is only *persona
    non grata* between lines 25 and 50 of the document. You can tell vim what range
    you want to search using the following `start,end` syntax:


    ```

    1 :s 25,50 /old/new/g

    ```


    “Wait,” you say. “I’m scared! I’m afraid that the changes I made are wrong and
    will ruin the world!” Vim understands. Sometimes you don’t want vim to change
    every instance of the word `old` without getting your stamp of approval first.
    You can do that. All you have to do is add the letter `c` (for “confirm”) to the
    end of the command, like so:


    ```

    1 :%s/old/new/gc

    ```


    When you hit `Enter` Vim will jump to each instance of “old” and ask if you want
    to change it. If you press `n` it will leave the word alone. If you *confirm*
    the change by pressing `y` it will make the change. Handy, no?


    ### Where it Gets Ugly


    “This,” you are no doubt saying to yourself, is no big deal. This is just regular
    old *regular expressions*, not something to be worrying about. Well, I was just
    easing you in. Here’s where it gets ugly.


    If you are a fan of the expressions most regular, you don’t waste too much time
    before you start putting parts of your search in groups and using those search
    groups to make your life better. Let’s say you want to do something simple like
    find a string of six hexadecimal characters. In most modern regular expression
    parsers you would type something like:


    `[0-9a-f]{6}`


    In other words “Match any character between 0 and 9, or a-f six times”. This is
    basic stuff.


    And here’s what vim does odd. Instead of letting you just wrap a section in parentheses,
    you have to *escape* the parentheses, or else vim will search for them. **I know.**
    So if you wanted to run the search above using vim, you would write it thus:


    `\[0-9a-f\]\{6\}`


    And that’s a *fairly simple* regular expression. When you start having nested
    brackets and “or” clauses (which use the pipe symbol `|` ) you can reach a point
    where it feels like half of your regex is backslashes.


    ### You Have to Believe Vim is Magic!


    Fortunately, there’s hope. Vim hasn’t been static in all the years since vi, and
    while the old vi regex syntax is still the norm, you can override it without too
    much work. Vim has two special search modes called `magic` and `very magic`. Magic
    searches behave a lot more like POSIX style regular expressions, while **Very
    Magic** searches are more or less what you’re used to if you learned regular expressions
    using Perl, Ruby, Python etc.


    To access the “magic” or “very magic” search modes, you just prefix your search
    with `\m` (for magic) and `\v` (for *very* magic) mode. As you might expect, both
    magic and very magic modes have their opposites, which are triggered by using
    an uppercase `M` and `V` respectively. It’s worth knowing exactly what you’re
    getting into with each search mode, which means it’s just about time to break
    out a fancy ol’ table.


    #### Vim Regex Modes


    | Mode | `\v` | `\m` | `\M` | `\V` |

    | --- | --- | --- | --- | --- |

    | Name | Very Magic | Magic | *Not* Magic | *Very* Not Magic |

    | End of line | `$` | `$` | `$` | `\$` |

    | Parentheses | `( )` | `\( \)` | `\( \)` | `\( \)` |

    | Alternates | `|` | `\|` | `\|` | `\|` |

    | Repeats | `*` | `\*` | `\*` | `\*` |

    | Any Character | `.` | `\.` | `\.` | `\.` |

    | Literal dot | `\.` | `\.` | `\.` | `\.` |


    As you can see, magic mode is an odd mix of not-magic and very magic, which makes
    it kind of an annoying set of rules. Before we get into any suggestions, here’s
    a basic rundown of how each works, in descending order of magicality:


    - **Very Magic**: In this mode every character other than letters, numbers and
    underscores are special.

    - **Magic**: In this mode some characters are special and others aren’t.

    - **Not Magic**: In this mode few characters are special.

    - **Very Not Magic**: In this mode only backslash is special.


    ## 16. Using Vim’s Help System


    So, clear back in the introduction I spoke about how the help system is a pain
    to use. And for a newcomer it kinda is. But like everything in vim it’s only irritating
    while you’re learning to use it. Once you’ve mastered it you’ll find the help
    system incredibly useful and almost *intuitive* even.


    Okay, the basics: When you type `:help` in normal mode you’ll suddenly have your
    vim screen split in half, the top half showing you a help file, the bottom half
    showing whatever you were working on. Your cursor is up in the help window, and
    all your motion commands work like they always have: you can go up and down by
    half or whole pages, jump to the top or the bottom, the works. Which is nice and
    all, but the first question that most people have when faced with this screen
    is “how do I make it go away?” That’s a good question. Without any fancy wordplay,
    here’s the answer: press `:q` and it’s gone. You’re back to your editor.

