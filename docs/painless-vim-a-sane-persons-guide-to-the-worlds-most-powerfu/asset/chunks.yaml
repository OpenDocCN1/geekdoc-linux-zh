    Armed with this new knowledge let’s look at some of the things you can do in window
    command mode^([64](#chap35.xhtml_fn-wcm)). The first one is jumping between your
    open windows. To do this you simply press `<ctrl>w` to enter window command mode
    and then use your movement keys to jump from one window to the next. So `<ctrl>wk`
    will move you one window up, `<ctrl>wj` will move you one window down, as you
    would expect. You can figure out how to move from side to side.


    It is that simple, and yes, smartypants, you can put counts in the middle there
    too. If you have three windows stacked up like pancakes and you want to get from
    the bottom pancake to the top pancake you can use `<ctrl>w 2k` to jump straight
    to the top window. Or Pancake. Whichever you want. For the record, if you have
    three windows stacked up and you enter `<ctrl>w 15k’ it’ won’t wrap around five
    times; it’ll just go to the top window and tacitly ignore the fact that you told
    it to do something stupid. Vim is thoughtful like that.


    ### Resizing Windows `h: window-resize`


    There are a lot of ways to resize windows, which give you varying degrees of ease
    and control. Let’s start simple. By default, when you create a new window vim
    will split your current window into even sections. If you want to resize that
    window you’ve got a choice to make: do you want to make it taller, shorter, wider,
    or thinner? Depending on how you split out your windows some of these may not
    be relevant; if you’ve split the entire screen into two horizontal windows, for
    example, you can’t make your window wider or narrower; it’s stuck at 100% width.
    But you can make it taller or shorter, so let’s do that first.


    To make a window taller you type `<ctrl>w +`. In this case that `+` is an actual
    plus sign, because you’re adding a line to the window. You can add several lines
    by specifying the count between `<ctrl>w` and the plus, like so: `<ctrl>w 4+`.


    to make a window shorter you can do the same thing, only with a dash: `-` instead
    of a plus sign. So, it’s a minus sign, see? `<ctrl>w -` gives you a window that
    is one line shorter; the count trick works as well: `<ctrl>w 4-` will make the
    window four lines shorter.


    If you have been changing window sizes somewhat haphazardly and want to go back
    to having them all be the same size you can pull that off by typing `<ctrl>w =`.
    The mnemonic here should be obvious.


    Okay, so making windows taller or shorter is obvious, what about making them wider
    or skinnier? It’s also pretty straightforward. You type `<ctrl>w >` to make the
    window wider (think of it as pushing the right side of the window out farther).
    To make it thinner you do the opposite: `<ctrl>w <`. Again, you can use counts
    in the middle of both of these commands.


    So, let’s sum up: to change the sizes of windows, you start out with the Windows
    Command Mode Entry Access Key (`<ctrl>w`) and press one of the following to change
    the window:


    *   `+`: Make the window taller

    *   `-`: Make the window shorter

    *   `>`: Make the window wider

    *   `<`: Make the window narrower


    We’ll play with these commands in `windows.txt`, the special word document designed
    just for window funtimes.


    ### Moving Windows Around `:h: window-moving`


    This is not something I use all that often, but it can come in handy from time
    to time. Let’s say that you were working on a file, and you opened the help documentation.
    By default it opens above your current window. Let’s say you want to keep the
    help window open, but you prefer having your code window on the top. To move your
    current window (remember, when you open a help window your cursor jumps to it,
    and it becomes your current window) to the bottom all you have to do is press
    `<ctrl>w J` (that is an uppercase `J`) to send that window to the bottom of your
    screen. Move it to the top of your screen with `<ctrl>w K`, as you would expect.


    Most of the time these are the only window moving commands you’ll need, because
    you’ll probably only ever have two vim windows open. But maybe you’re one of those
    people who have all kinds of windows open all the time. If you have lots of windows
    open and want to do some less drastic jumps then read on. Everyone else can just
    go to the [next chapter](#chap22.xhtml_tab-pages).


    #### Making Windows Dance


    The following commands are only useful if you have three or more windows open.
    I don’t know why you would have three or more windows open, but I’m not here to
    judge. Maybe you’ve got a huge monitor and a better brain than I have, so you
    can focus on three or more things. Whatever. Here we go.


    You can rotate windows using `<ctrl>w r` and `<ctrl>w R`. The lowercase version
    rotates windows down, meaning the top window becomes the second window, second
    becomes the third, and so on. The bottom window jumps to the top. When you move
    everybody around your cursor stays in the window you were in when you started
    the little dance.


    The uppercase version of the command goes the other way; the top window jumps
    to the bottom, the second becomes the first, etc. Both versions of this command
    take a count as well, so it will spin the window by *N* instead of just one.


    If you just want to swap two windows, but leave everyone else you can use `<ctrl>w
    x`. Let’s say you have the following layout:


    ```

    +-----------+

    |     1     |

    +-----------+

    |     2     |

    +-----------+

    |     3     |

    +-----------+

    ```


    And you want to trade 1 and 2 but leave three on the bottom. You just hit `<ctrl>w
    x` and you now have


    ```

    +-----------+

    |     2     |

    +-----------+

    |     1     |

    +-----------+

    |     3     |

    +-----------+

    ```


    If you have your cursor in window 1 and you hit `<ctrl>w 3x` you will get


    ```

    +-----------+

    |     3     |

    +-----------+

    |     2     |

    +-----------+

    |     1     |

    +-----------+

    ```


    If that’s your idea of a good time. Unlike the rotation commands, the window swapping
    command will move your cursor to the new window. Put another way, when you swap
    windows 1 and 3 your cursor will stay in the topmost window, but the windows will
    move. Vim numbers the windows like a human, so the topmost window is 1, not 0.


    ### 21. Tab Pages Are Not Browser Tabs


    One of the more useful features in just any app is the ability to have multiple
    tabs open, looking at multiple files or web pages or whatever. And vim has that
    too! But it’s not exactly what you think it is, and until you get used to how
    vim thinks about tabs it’s going to seem weird, hostile, possibly even aggressive.
    But in reality vim just wants to help you out; it wants to do whats best for you,
    if you would just let it. Vim worries.


    Okay, Let’s get into this. In a browser, a “tab” is your view of a single web
    page. If you want to view multiple tabs in a single window you open multiple tabs.
    And here is where we get into linguistic trouble. We’ll get more into the business
    of vim terminology in the [next interlude](#chap23.xhtml_interlude-3), but let’s
    skim through it right now.


    These days, when we say you have a window open on your desktop (one of my favorite
    mixed metaphors in all of computing lingo) we are talking about the graphical
    interface your OS uses. When you open a browser, or a modern IDE like Sublime
    Text or IntelliJ or even Visual Studio, you can have multiple *tabs* inside a
    single *window*. Vim, on the other hand, allows you to put multiple *windows*
    in a single *tab page*.

