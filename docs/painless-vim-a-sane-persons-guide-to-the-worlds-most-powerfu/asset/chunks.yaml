    意乎意料，还有其他人查看了 `vim` 插件的安装步骤，并认为那里有改进空间。虽然有很多插件可以帮助你管理其他插件，但我将深入讨论其中一个。在附录中提供了其他插件管理器的链接（以及对它们的一些评论）。我将介绍
    [Pathogen](https://github.com/tpope/vim-pathogen)，因为它是我个人最喜欢的一个。


    Pathogen 的设置要求非常少，其主页上有关于如何安装它的清晰说明。“复制并粘贴”指令完全按照预期方式工作。一旦你安装了 Pathogen，你就可以简单地将其他插件克隆到你的
    `~/.vim/bundle` 目录来开始安装其他插件，Pathogen 会确保在当你启动 vim 时它们都被正确加载。这部分非常好且易于理解，但这仅占了一半的价值。Pathogen
    被设置为将每个插件放在它自己的目录中，这意味着如果你不再喜欢某个插件，删除它也轻而易举。你只需从 bundle 目录中删除该插件文件夹并重启 vim 即可。


    一旦你安装了一些喜欢的插件，只需重启 vim，它们就应该准备就绪了。但等等，还有更多！（总是有更多的）。Pathogen 为你提供单一命令，可以将你安装的每个插件的帮助文件集成到
    Vim 的帮助系统中。你只需要在 vim 命令行中运行 `:Helptags`，它就会扫描所有插件并设置好帮助系统。只需一步，没有任何问题。你可以把 `Helptags`
    命令放在你的 `.vimrc` 文件中，但插件作者并不推荐。


    ## 我们来安装插件吧！


    好了，让我们付诸行动。我假设你已经按照 Github 上的说明安装了 Pathogen。完成后我们就可以继续。去吧，我会等。


    好了！让我们安装 [Commentary](https://github.com/tpope/vim-commentary) 插件。这个插件让你通过一些预设快捷键对许多类型的文件进行行注释和块注释变得异常简单，并且对于我们所有程序员来说都超级有用。如此，请按照以下步骤安装
    Commentary：


    *   打开命令行

    *   在命令行中输入以下内容：


    ```bash

    cd ~/.vim/bundle

    git clone https://github.com/tpope/vim-commentary.git

    ```


    *   启动 vim 并输入 `Helptags`


    好了！插件现在已经安装好了！要了解更多关于 Commentary 如何工作的信息，只需输入 `:h commentary`，vim 就会启动帮助查看器向你展示你需要知道的一切。如果你仍然担心帮助系统，那是可以理解的。你可以等到帮助文件章节。它马上就来。


    ## Nate 喜欢的插件


    还记得引言中提到的那个“有主见”的话题吗？好了，这里有一波意见扑面而。。这些是我每天喜欢并使用的插件。欢迎随意查看它们，看看它们是否对你有用。


    ### CtrlP


    [CtrlP](https://github.com/kien/ctrlp.vim) 为你提供了类似于 SublimeText 或 Textmate 的模糊匹配文件查找功能。如果你不知道这意味着什么，只需按下
    `<ctrl>p` 并开始输入你记得路径或文件名的任何部分，插件就会找到你想要的文件。它太棒了。


    ### NERDTree


    ![运行中的 NERDTree](img/NERDTree.jpg)


    [NERDTree](https://github.com/scrooloose/nerdtree) 为 vim 提供了一个非常好的侧边栏，为你提供了一个文件管理器，就像你在其他文本编辑器中看到的那样。这让你很容易找到想要处理的文件。如果你决定使用
    NERDTree，我建议在你的 `.vimrc` 中添加如下一行：


    ```vim

    1 noremap <Leader>n :NERDTreeToggle<CR>

    ```


    不要担心那里在发生什么（我们将在快捷键映射或标签页中编辑文件。


    ### Fugitive


    如果你在任何项目中使用 git，[Fugitive](https://github.com/tpope/vim-fugitive) 将是 vim 发生的最棒的事情之一。它为你提供了一种简单清晰的方法，在无需离开
    vim 的情况下执行你需要的所有 git 命令。你可以简单快速地暂存或取消暂存文件，在同一个窗口中提交它们，然后回到编辑你的源代码。（关于（窗口的更多介绍见[#windows]。）Fugitive
    的用处之一是它内置了许多键盘快捷键，让你通常做的所有事情变得更容易；例如暂存一个文件（将光标置于该行并提交）。


    ### Zen Coding


    [Zen Coding](https://github.com/mattn/zencoding) 为 [Emmet](http://emmet.io/) 提供支持。如果你还没有玩过
    Emmet，它是快速编写类似内容的方法：


    ```html

    <html><head><title>这是一个网页</title></head><body><p>一些文本!</p></body></html>

    ```


    ### Vim Colorsmes


    [Vim Colorsmes](https://github.com/flazz/vim-colorsmes) 将百个流行的配色方案封装在一个插件中。一旦安装，你只需更改
    `colorsme` 行即可切换到任何你方案。


    ## 11. 运算符：同时移动和更改


    现在，既然你已经了解了计数、运算符以及移动光标的所有细微差别，我们将巩固对动作和运算符如何协同工作的理解。


    ### 移动并编辑命令；或“Vim 命令 202”


    好了，我们在这里回顾一下。一个 vim *命令*由以下部分组成：


    *   一个*运算符*

    *   一个计数*

    *   一个*动作*


    根据情况，这三者都是可选的。如果你单独输入 `4`，vim 会等待你告诉执行四次操作。你可以给它一个动作，比如 `j`，它会将光标向下移动四行。或者你可以给它一个运算符，如
    `p` 粘贴四次。或者你可以同时给它一个运算符和一个动作，如 `dl` 删除接下来的四个字符。


    最后一个是*通过动作编辑*的例子。一次性删除多行只是冰山一角。学习这种编辑方式的奇妙之处在于，一旦你掌握了它，你就可以组合命令来完成你想要的任何更改。让我们来看看我目前正在工作中做的事情：为
    [Grunt](http://gruntjs.com) 自动化系统编写 `Gruntfile.js` 配置脚本。


    Grunt 的作用对讨论并不重要；目前我们只需要知道有这样一段内容：


