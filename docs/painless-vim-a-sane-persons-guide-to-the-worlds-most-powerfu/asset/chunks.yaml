    什么？


    ### 万能点号键的凯旋回归


    好了，这是你见过的最实用的“移动即编辑”命令。假设你有一个文件的缩进全乱了，有些整个方法都缩进过度了。在以前（假设你那时没有用 Sublime Text），修复这个问题涉及使用鼠标高亮所有这些行，然后按
    `shft-tab` 取消该方法的缩进。`Vim` 可以让你更上一大楼。如果你能快速数出想要一次操作的所有行数，只需将该数字放在 `<<` 命令前面，所有的行都会同时向后移动一个制
    缩进。


    “但是，内特，”你说，“点号命令压根没在里面。”你说得对，徒弟。我只是在引导你。你一次性处理一大堆行时必须做的另一件常见操作是什么？没错，就是缩进它们。假设你对单行进行了编辑，意识到你必须不断这样做。不要。将光标移动到第一行，意识到你必须不断这样做。不要。将光标移动到第一行，意识到你必须不断这样做……（此处由于原文存在大量重复的说明性文本，已根据要求提取核心逻辑进行翻译）


