    Which leads to the problem of `portability`. One of the main reasons for learning
    vim is that it’s installed by default on just about every non-Windows computer
    ever, and once you know how to use vim you can use it edit files quickly over
    any SSH connection, or hop on anyone else’s machine and be productive almost immediately.
    But while `vim` is everywhere, your `.vimrc` file is only on your machines. This
    means that any time you connect to a computer that you don’t own you’re going
    to be trying to remember how to use vim the regular way all over again. Your muscle
    memory is going to trip you up, because you’ll be reaching for your custom keys
    instead of the standard ones. You could just get in the habit of hauling your
    `.vimrc` file everywhere you ever work, but this slows you down.


    The other side of that is having other people collaborate with you via SSH or
    using `tmux`. Any vim users will be instantly and inconsolably furious when all
    the keystrokes they try do the entirely wrong things. It’d be like when you try
    to use someone’s Dvorak keyboard when you’re used to QWERTY or vice versa.


    In general, you should approach any remapping of built-in, standard commands with
    caution. `Adding` a keymap for something you do regularly is probably not terrible,
    but it still makes you reliant on being at your own personal terminal. `Overwriting`
    a keymap for a standard function should only be done if you know there is no better
    option.


    ### What to Map


    So what do you map? It seems like my advice is to leave vim in a pristine state,
    unchanged and trusting blindly in the wisdom of Bram and crew.


    Well, not entirely. There are a lot of things that you should map, things that
    make vim more useful without crippling you on other machines. Most of these, unsurprisingly,
    have to do with plugins. Plugins are awesome. They extend your functionality and
    have become the core of any good text editor. And when you add them to vim it
    makes sense to find the most useful parts of the plugin and map those functions
    to something you like.


    For example, let’s take the [fugitive](https://github.com/tpope/vim-fugitive)
    plugin by Tim Pope. Fugitive is a git management plugin, and exposes a lot of
    its functionality through the `:Gstatus` command. You could just type `:Gstatus`
    from the command line every time you wanted to use this plugin, or you could give
    it a nice, memorable keymap. Let’s choose the second option. Since this is a git
    plugin, the letter `g` seems appropriate, but we don’t want to overwrite it’s
    current functionality. `<Leader>` to the rescue! We’ll add the following to `.vimrc`


    ```

    1 nmap <Leader>g :Gstatus<CR>

    ```


    And now (if you’ve remapped leader to the comma key) we can just press `,g` and
    get all that git status goodness in two characters, and we did it all without
    harming vim’s central functionality.


    The other benefit here is that you can go to vim on any other machine and do your
    work without having compromised your muscle memory for the basics. Chances are
    that if you’re working on someone else’s computer you’re not using git, because…that
    just feels wrong somehow. You’d be signed in as them and your commit would show
    up under their name…it’s like wearing someone else’s underwear. And on that pleasant
    note let’s talk about a useful, nay `essential` keymap that has to be done `outside`
    of vim itself.


    ### `<Plug>`


    Okay, so there’s one more not-on-the-keyboard key that we have to deal with. Unlike
    `<Leader>`, you’ll never have to map a key to `<Plug>`, but you’ll see it come
    up from time to time, so we’re going to go over it in a high-level fashion.


    Without getting into the details, `<Plug>` is a way for plugins to make it easy
    for you to create shortcuts for their functions. For example, let’s say you have
    a plugin with an awesome feature called `awesome_feature`. The plugin developer
    could add the following to their plugin:


    ```

    1 noremap <unique> <Plug>awesome :awesome_feature <CR>

    ```


    And then you could map that to something you want by adding this to `.vimrc`:


    ```

    1 nmap <Leader>a <Plug>awesome

    ```


    To use their awesome feature from there on out.


    ### Recursive Mappings, and How to Avoid Them


    One feature of vim keymaps is that they can include `other` keymaps that are recursively
    executed. Like any feature, this can be used poorly, or used well.


    #### Terrible Keymap Recursion


    Let’s consider the case of “Bob”, a person who exists entirely to make poor choices
    in examples.


    Bob decides that he wants to use `F2` to copy a line. So he adds this line to
    `.vimrc`:


    ```

    1 map <F2> yy

    ```


    Bob is forgetting that you shouldn’t remap standard commands, but that’s because
    he hasn’t read this book yet. Someone buy him a copy, quick! But as bad as this
    idea is, it still works; bob can now press `F2` instead of typing `yy` to copy
    entire lines, if that’s your idea of a good time. But he’s not done yet!


    Bob (who is a huge Star Wars fan) is writing the seminal work on Wookiee culture,
    and wants to create an abbreviation for the name of the Wookiee home world, Kashyyyk.
    Bob is also a huge fan of overly fancy mappings, so he creates the following abbreviation:


    ```

    1 abbr kk Kash<F2>

    ```


    Can you guess what will happen when Bob types `kk`? Our friend Bob is also a huge
    fan of overly fancy mappings, so he creates the following abbreviation:


    ```

    1 abbr kk Kash<F2>

    ```


    Can you guess what will happen when Bob types `kk`? Our friend Bob is also a huge
    fan of overly fancy mappings, so he creates the following abbreviation:


    ```

    1 abbr kk Kash<F2>

    ```


    Can you guess what will happen when Bob types `kk`? Our friend Bob is also a huge
    fan of overly fancy mappings, so he creates the following abbreviation:


    ```

    1 abbr kk Kash<F2>

    ```


    Can you guess what will happen when Bob types `kk`? Our friend Bob is also a huge
    fan of overly fancy mappings, so he creates the following abbreviation:


    ```

    1 abbr kk Kash<F2>

    ```


    Can you guess what will happen when Bob types `kk`? Our friend Bob is also a huge
    fan of overly fancy mappings, so he creates the following abbreviation:


    ```

    1 abbr kk Kash<F2>

    ```


    Can you guess what will happen when Bob types `kk`? Our friend Bob is also a huge
    fan of overly fancy mappings, so he creates the following abbreviation:


    ```

    1 abbr kk Kash<F2>

    ```


    Can you guess what will happen when Bob types `kk`? Our friend Bob is also a huge
    fan of overly fancy mappings, so he creates the following abbreviation:


    ```

    1 abbr kk Kash<F2>

    ```


    Wait, I see what''s happening. Bob''s abbreviation uses `F2`, which he has remapped
    to `yy`. This creates an infinite loop! When Bob types `kk`, it expands to `Kash<F2>`,
    which triggers `F2`, which expands to `yy`. But wait, if he remapped `F2` to `yy`,
    then `kk` expands to `Kashyy`, and then `yy` triggers `F2`, which expands to `yy`...
    and so on. This is why we should be careful with recursive mappings.


    Actually, the text provided has a bit of repetition in the middle. Let me re-clean
    that specific part based on the instructions.


    #### A More Useful Example


    So let’s take the lessons we learned from Bob and use them more intelligently.
    Let’s start with something you might want to map:


    ```

    1 imap <F5> <C-R>=strftime("%H:%M")<CR>

    ```


    Don’t worry too much about that command (but if you want to know more you can
    check [the vim wiki](http://vim.wikia.com/wiki/Insert_current_date_or_time)).
    It inserts the current time in “hour:minute” format. So if I pressed `F5` right
    now it would put “12:58” right before cursor position.


    Now let’s say we want a simple abbreviation to write log entries. We would add
    another line like this to `.vimrc`


    ```

    1 iabbr logt <F5>:Entry

    ```


    And now when we’re typing in the log we can just type `logt` and a timestamped
    log entry will be created. Now let’s say we want to change the timestamp format.
    All we have to change is our `imap` line:


    ```

    1 imap <F5> <C-R>=strftime("%c")<CR>

    ```


    And our log entry goes from


    ```

    1 12:58: Entry

    ```


    To


    ```

    1 Sat Jun 29 12:58:32 2013: Entry

    ```


    #### Avoiding Recursion Altogether


    But they can also be somewhat confusing when you create a keymap that recurses
    into another keymap that you didn’t want or expect. Fortunately you can easily
    tell a keymap that you *don’t* want it to parse any keymap it comes across and
    just type the characters you typed, thank you very much. To do this you just change
    your map from this:


    ```

    1 imap <Leader> d dd

    ```


    To this:


    ```

    1 inoremap <Leader> d dd

    ```

