- fmt: '

    Unsurprisingly, there have been other people who have looked at the `vim` plugin
    installation procedure and decided that there is room for improvement there. While
    there are a number of plugins that help you manage other plugins, I’m just going
    to talk about one of them in depth. There are links to (and a few comments about)
    other plugin managers in the [appendix](#chap30.xhtml_plugin-managers). I’ll be
    covering [Pathogen](https://github.com/tpope/vim-pathogen) because it’s the one
    that I personally happen to like best.


    Pathogen requires very little by way of setup, and the homepage has clear instructions
    on how to install it. The “copy and paste” instructions work exactly as they should.
    Once you’ve installed Pathogen, you can start installing other plugins simply
    by cloning them into your `~/.vim/bundle` directory and Pathogen will make sure
    they’re all loaded correctly when you start vim. That part is nice and easy to
    understand, but that’s only half of the value. Pathogen is set up to put each
    plugin in it’s own directory, meaning it’s trivial to remove a plugin should you
    decide you don’t like it any more. You just delete the plugin’s folder from the
    bundle directory and restart vim.


    Once you have installed some favorite plugins just restart vim and they should
    be ready to go. But wait, there’s more! (there’s always more). Pathogen gives
    you a single command to integrate the help files from each of the plugins you’ve
    installed into Vim’s [help](#chap17.xhtml_help) system. All you have to do is
    run `:Helptags` from the vim command line and it will scan all the plugins and
    get the help system set up. One step, no problems. You could put the `Helptags`
    command in your `.vimrc` file, but the author of the plugin doesn’t recommend
    it.


    ## Let’s Install a Plugin!


    Okay, let’s put the rubber to the road. I’m going to operate under the assumption
    that you have already installed Pathogen following the instructions on the Github
    site. Once that’s done we can move on. Go ahead. I’ll wait.


    Okay! Let’s install the [Commentary](https://github.com/tpope/vim-commentary)
    plugin. This plugin makes it trivial to do line and block comments in many types
    of files using some pre-set keystrokes, and is super-useful for all of us programmer
    types. So, all that said, follow the steps below to install Commentary:


    *   Open a command line

    *   Enter the following at the command line:


    ```bash

    cd ~/.vim/bundle

    git clone https://github.com/tpope/vim-commentary.git

    ```


    *   Start up vim and type `Helptags`


    Okay! The plugin is all kinds of installed now! To learn more about how Commentary
    works just type `:h commentary` and vim will start up its help viewer to show
    you everything you need to know. If you’re still afraid of the help system, that’s
    understandable. You can wait until the chapter on [Help Files](#chap17.xhtml_help).
    It’s coming right up.


    ## Nate’s Favorite Plugins


    Remember that whole “opinionated” thing from the introduction? Well, here comes
    a whole wave o’ opinions. These are plugins that I like and use on a daily basis.
    Feel free to check them out and see if they work for you.


    ### CtrlP


    [CtrlP](https://github.com/kien/ctrlp.vim) gives you fuzzy matching file finding,
    a la SublimeText or Textmate. If you don’t know what that means, you just hit
    `<ctrl>p` and start typing any part of the path or filename you can remember and
    the plugin will find the file you mean. It’s wonderful.


    ### NERDTree


    ![The NERDTree in action](images/NERDTree.jpg)


    [NERDTree](https://github.com/scrooloose/nerdtree) provides a nice sidebar to
    vim that gives you a file explorer, much like you’d see in any other text editor.
    This makes it easy to find the file you want to work on. If you decide to use
    NERDTree I would recommend adding a line to your `.vimrc` like the following:


    ```vim

    1 noremap <Leader>n :NERDTreeToggle<CR>

    ```


    Don’t worry about what all is going on there (we’ll cover it more in the chapter
    about [Key Maps](#chap19.xhtml_mapping-keys), but the upshot is that you can type
    `\n` and have the NERDTree sidebar pop up. Then you can choose a file to edit
    and dismiss the sidebar with the same `\n` keystroke. When you get a little more
    comfortable with vim you can also use single key commands in NERDTree to edit
    files in their own [window](#chap21.xhtml_windows) or [tab](#chap22.xhtml_tab-pages).


    ### Fugitive


    If you use git in any of your projects [Fugitive](https://github.com/tpope/vim-fugitive)
    is one of the best things to happen to vim. It gives you a simple and clear way
    to perform all the git commands you need without leaving vim. You can stage or
    unstage files simply and quickly, commit them from the same window, then go back
    to editing your source code. (More on (windows soon)[#windows].) One of the nice
    things about Fugitive is that it comes with a lot of keyboard shortcuts built
    in to make doing all the things you would normally do even easier; things like
    staging a file (position your cursor on the line and commit).


    ### Zen Coding


    [Zen Coding](https://github.com/mattn/zencoding) provides support for [Emmet](http://emmet.io/).
    If you haven’t played with Emmet yet, it’s a way to quickly write something like


    ```html

    <html><head><title>This is a webpage</title></head><body><p>Some text!</p></body></html>

    ```


    ### Vim Colorsmes


    [Vim Colorsmes](https://github.com/flazz/vim-colorsmes) packs a hundred of the
    most popular colorsmes into a single plugin. Once installed you can switch to
    any of them by just changing the `colorsme` line to whatever scheme you want.


    ## 11. Operators: Moving and Changing at the Same Time


    So, now that you know all about counting and Operators and all the nuances of
    moving the cursor around, we’re going to solidify our understanding of how motions
    and operators can work together.


    ### Move-and-Edit Commands; or “Vim Commands 202”


    Okay, we’re going to re-hash a little here. A vim *command* consists of:


    *   An *operator*

    *   A *count*

    *   A *motion*


    Depending on the situation, all three are optional. If you type `4` by itself
    vim will wait for you to tell it what to do four times. So you can give it a motion,
    like `j`, and it will move the cursor down four lines. Or you can give it an operator
    like `p` to paste something four times. Or you can give it both an operator and
    a motion, like `dl` to delete the next four characters.


    The last one is an example of *editing by motion*. Deleting a bunch of lines at
    once is just the tip of the iceberg. The great thing about learning to edit in
    this way is that once you’ve got the hang of it you can combine commands to make
    any change you want. Let’s take a look at something I’m doing at work right now:
    Writing a `Gruntfile.js` configuration script for the [Grunt](http://gruntjs.com)
    automation system.


    What Grunt does is immaterial to the discussion; for now all we need to know is
    that there’s a section that looks like this:

