    \ at any point on that line I type `yyp`. In other words “yank the entire line\
    \ and paste it.” Now I have\n\n```\n1 grunt.loadNpmTasks('grunt-contrib-jade');\n\
    2 grunt.loadNpmTasks('grunt-contrib-jade');\n```\n\nWhich is close to what I want.\
    \ I can get my cursor to the word `jade` in the second line, type `ciw` and replace\
    \ it with the word `watch`. There! I’ve added a new line. What’s more, I can just\
    \ type `p` and I’ll have a third line that I can modify in the same way. I can\
    \ keep doing this until I’ve got all the modules I need listed in my `Gruntfile`.\n\
