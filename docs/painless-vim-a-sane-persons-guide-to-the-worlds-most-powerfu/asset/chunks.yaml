    \ - `:tabm +`*number* move a tab *number* places **right** - `:tabm -`*number*\
    \ move the tab *number* places **left**\n\n*   List all open tabs - `:tabs`\n\n\
    ## Appendix 3: Sample `.vimrc` files\n\nThis section gives you a look at a couple\
    \ of simple (but functional) `.vimrc` files, with annotations. Note that these\
    \ aren’t *my* `.vimrc` file, although they are more or less *based* on mine. These\
    \ are intended to be simple starting points from which you can get ideas. You\
    \ could use these for a while, tweak them, and get to where you’ve got something\
    \ you’re happy with over time.\n\nIf you want to see what I’m using right now\
    \ you can view it on [GitHub](https://github.com/PogiNate/dots/blob/master/home/.vimrc).\
    \ I try to back it up regularly. You could theoretically copy mine directly, but\
    \ it’s got a lot of things in it that you don’t need, unless you’re one of the\
    \ five other people on Earth who do XQquery development for a living.\n\nFor that\
    \ matter, if you’re not keeping your `.vimrc` and other files backed up on an\
    \ online service, now would be a good time to start. There are few things more\
    \ frustrating than realizing all your customizations have just disappeared without\
    \ a trace.\n\nOkay, without further ado, the absolute simplest, most basic sample\
    \ file that I would actually use:\n\n* * *\n\n```\n 1 \"This tells vim to only\
    \ run as VIM, not as vi\"\n 2 set nocompatible\t\t\n 3 \"Remember that it has\
    \ to be in your ~/.vim/colors folder\"\n 4 colorscheme jellybeans \t\n 5 \"Displays\
    \ line numbers down the left side of the screen\"\n 6 set nu\t\t\t\t\n 7 \"Change\
    \ the <leader> key to comma instead of \\ \"\n 8 let mapleader=\",\"\t\t\n 9 \"\
    enable syntax highlighting\"\n10 syntax on\t\t\t\t\n11 \"Handle things like indents\
    \ and plugins intelligently.\" \n12 filetype plugin indent on\t\n13 \n14 \"Make\
    \ the Backspace Sane\"\n15 \"The Backspace in vim is weird by default.\"\n16 \"\
    This makes it behave the way you expect.\"\n17 set backspace=2\n18 \"More backspace\
    \ sanity\"\n19 set backspace=indent,eol,start \n20 \n21 \" Pathogen settings\"\
    \n22 \" This line tells vim to load all your Pathogen-installed plugins.\"\n23\
    \ \" Naturally, Pathogen needs to be installed before this works.\"\n24 execute\
    \ pathogen#infect() \n```\n\nA sample .vimrc file\n\n```\n 1 \" This tells vim\
    \ to only run as VIM, not as vi\"\n 2 set nocompatible\n 3 \n 4 \" Any color scheme\
    \ in your ~/.vim/colors folder\"\n 5 colorscheme jellybeans \t\n 6 \n 7 \" Displays\
    \ line numbers down the left side of the screen.\"\n 8 set nu\t\t\t\t\n 9 \n10\
    \ \"Change the <leader> key to comma instead of \\ \"\n11 let mapleader=\",\"\t\
    \t\n12 \n13 \"Turn tabs into spaces when saving.\"\n14 \"I prefer this, as it\
    \ keeps things orderly.\"\n15 set expandtab    \t\t          \n16 \n17 \" Wrap\
    \ long lines.\"\n18 set wrap                                    \n19 \n20 \" Enable\
    \ syntax highlighting\"\n21 syntax on\t\t\t\t\n22 \n23 \"Handle things like indents\
    \ and plugins intelligently.\"\n24 filetype plugin indent on\t \n25 \n26 \"Make\
    \ the Backspace Sane\"\n27 set backspace=2\t\t \t\n28 set backspace=indent,eol,start\n\
    29 \n30 \" Pathogen settings\"\n31 \" Use pathogen with it's pun-filled method\
    \ names.\"\n32 execute pathogen#infect()\t\n33 \n34 \"Folding\"\n35 \" You can\
    \ set this to 'indent' or 'syntax' if you like;\" \n36 \" I prefer manual\"\n\
    37 set foldmethod=manual \n38 \" This tells vim to only fold one level at a time.\"\
    \n39 set foldlevel=1 \n```\n\nA slightly longer .vimrc file\n\n## About This Book\n\
    \n### About the Text\n\n*Painless Vim* is by Nathanial Ellsworth Dickson, but\
    \ you can call me Nate.\n\nIt was written using an unwieldy combination of (in\
    \ alphabetical order):\n\n*   [Marked](http://markedapp.com/)\n\n*   [MultiMarkdown\
    \ Composer](http://multimarkdown.com/)\n\n*   [Scapple](http://www.literatureandlatte.com/scapple.php)\n\
    \n*   [Scrivener](http://www.literatureandlatte.com/scrivener.php)\n\n*   [Ulysses](http://www.ulyssesapp.com/)\n\
    \n*   [vim](http://www.vim.org/) (of course)\n\nIt was written on an unlikely\
    \ number of macs.\n\n### About the cover\n\nThe cover features an illustration\
    \ by [Callihan](http://www.shutterstock.com/pic.mhtml?id=94462300). Used with\
    \ permission. The typefaces used on the cover are:\n\n*   **Matchbook Serif**\
    \ (*title*)\n\n*   **Aleo Light** (*subtitle*)\n\n*   **Caviar Dreams** (*by line*)\n\
    \nThe cover was designed by Nate Dickson using [iDraw](http://www.indeeo.com/idraw/)\
    \ and [Pixelmator](http://www.pixelmator.com/)\n\n## Special Thanks\n\nI would\
    \ like to thank, first and foremost, my dear Libbie, for her support, kind words,\
    \ encouragement, proofreading, spell checking, questions, and love. I’m the luckiest\
    \ husband ever.\n\nSlightly less mushy thanks also go out to my team of underpaid\
    \ (indeed *un*paid) proof readers:\n\n*   Holly McNeil\n\n*   Jesse Booth\n\n\
    *   Joanna Noall\n\n*   Josh English\n\n## Notes\n\n1You and I aren’t the only\
    \ ones that feel this way. Even [very smart people](http://yehudakatz.com/2010/07/29/everyone-who-tried-to-convince-me-to-use-vim-was-wrong/)\
    \ can get caught by the “throw the newbie in the deep end” problem.[↩︎](#chap00.xhtml_fnref-Katz)"
