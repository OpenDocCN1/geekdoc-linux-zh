  raw: 'The short answer is that mmd can turn your markdown into LaTeX, and you can
    turn `.tex` files into just about anything, if you want. But that’s probably not
    the answer you were looking for. Learning the mysteries of LaTeX formatting is
    probably not what you set out to do. Fortunately there are ways around that.


    [Pandoc](http://johnmacfarlane.net/pandoc/installing.html) is one such way. Pandoc
    seeks to turn just about anything into just about anything else, text-wise. If
    you wanted to make a Microsoft Word document out of `literary.md` all you would
    have to do is this: (after installing pandoc, of course)


    ```

    1 pandoc -f markdown_mmd -t docx -o literary.docx literary.md

    ```


    The switches we’re using here are:


    *   `-f` incoming format


    *   `-t` target format


    *   `-o` output file name


    And finally the name of the file you want to convert. It’s worth noting that pandoc
    also doesn’t do PDF output. Microsoft Word, however, does.


    But what if you don’t want to write all this stuff on the command line? What if
    you want live previews of what your text is going to look like, *and* the ability
    to actually finally create a PDF from your text?


    Well, there are apps for that. My favorite app on OSX is [Marked](http://marked2app.com).
    Marked lets you see how all your formatting is going to look, has a number of
    built-in stylesheets as well as the ability to add new stylesheets of your own,
    does a surprisingly wide array of sanity and writing checks on your text, and
    it can export a PDF of your file. It’s basically a writer’s best friend.


    ## 28\. Conclusion


    Well, here we are at the end of all things Painless and Vimish^([76](#chap35.xhtml_fn-Vimish)).
    We’ve had some good times, we’ve learned how to do a lot of things in an editor
    that has been proven (by other people) to be fast and user friendly in the right
    hands. I hope you’ve seen that you’ve got a great tool at your disposal, and that
    it isn’t as scary as it looked all those chapters ago when you were first starting
    out.


    But there’s still a long way to go, a lot more to learn. We haven’t covered everything
    you can do with vim, not by a long chalk. I haven’t even touched topics like writing
    your own plugins using vim script, and for good reason: I have no idea how to
    do that. But hopefully at this point you are feeling like those topics aren’t
    too scary, you’re feeling like you can handle this whole vim thing without fear,
    and you can hop onto anybody’s computer and use the world’s most built-in text
    editor instead of making excuses.


    Like I said, there’s still a long way to go. Fortunately there is an entire internet
    full of resources out there to help you reach true vim mastery, if such is your
    goal. If you just want to *use* vim you’re probably just about there. I’d recommend
    going back over this material in small bites from time to time as you settle into
    using vim on a daily basis. Perhaps there was something you read about a while
    ago that you wanted to try, and now that you’re more comfortable you can add a
    few new commands to your arsenal. If you want to expand beyond what you’ve read
    here I’d recommend picking up a more advanced book; there are a few listed in
    the Appendices. If you want to start writing vim plugins there’s no better time
    than the present to start learning vim script.


    Last of all, I would like to thank you. Writing this book has been an adventure
    for me. I’ve learned a ton about vim, and about writing, in this process. All
    the positive comments and suggestions have been deeply felt and appreciated. And
    your confidence, expressed in the form of actually dipping into your own hard-earned
    cash and *buying this book* is simply amazing. Again, I thank you.


    –*Nate Dickson*


    ## Appendix 1: Links to References


    This appendix is the catch-all for long-form reference discussions that didn’t
    flow properly in the main text.


    ### Color Scheme References


    (Linked from [Picking a Color Scheme](#chap04.xhtml_picking-color))


    *   [Vim Color Scheme Test](https://code.google.com/p/vimcolorschemetest/) has
    a lot of color schemes listed, with links to the files, and full previews of the
    scheme rendering different types of files.


    *   The [vim-colorschemes](https://github.com/flazz/vim-colorschemes) plugin installs
    a *ton* of color schemes for you to peruse and sample from the comfort of your
    own terminal.


    *   [Vivify](http://bytefluent.com/vivify/) lets you choose one of *many* color
    schemes and edit it to your heart’s content.


    ### Cheat Sheets


    *   [Beautiful Vim Cheat Sheet](http://vimcheatsheet.com/): Born on Kickstarter,
    now out in the wild, this is the cheat sheet that I have pinned up prominently
    behind my laptop at all times.


    ### Great Books on vim


    *   [Practical Vim](http://pragprog.com/book/dnvim/practical-vim): Presented as
    a series of tips, *Practical Vim* is a peek into the vim mindset, and a way to
    make the jump from user to power user. Every time I dip into it I come away with
    something that extends my vim skills and makes vim just that much more useful
    for me.


    *   [Learning the Vi and Vim Editors](http://amzn.to/16ELAeG) :This is the “everything
    and the kitchen sink” book on vim. As the title suggests, it also spends a fair
    amount of time in vi world, and even dives deeper into the underlying `ed` and
    `ex` editors upon which vim is built. If you want to know it all, this is the
    book for you.


    ### Great Sites to Learn more Vim


    *   [Vim Adventures](http://vim-adventures.com/): This is a fun site that teaches
    vim as a video game. You can play a few levels for free, which will help you with
    the basic motion keys, or pay to get access to the more advanced levels as well.


    *   [The Vim Tips Wiki](http://vim.wikia.com/wiki/Vim_Tips_Wiki): What better
    place to find information about an open source project than a community-maintained
    wiki? There is a lot of good information on this site for when you’re ready to
    move beyond the basics and get into some true vim black magic.


    ### More About Expressions


    *   It’s always good to stop in at [Stack Overflow](http://stackoverflow.com/questions/7027741/what-is-the-purpose-of-the-expression-register)
    for a simple, clear, and concise answer to a question.


    *   Andreas Grech has a simple explanation of how to [use the expression register
    to run ruby files](http://blog.dreasgrech.com/2010/06/extending-vim-with-expression-register.html)


    *   *Use Vim* tiptoes into using [VimScript in the Expression Register](http://usevim.com/2013/06/28/expression-syntax/)


    ### Bundle Managers


    In the chapter on [Plugins](#chap11.xhtml_plugins) I covered the Pathogen manager
    fairly thoroughly, but there are other great options. Here are a couple more that
    you might want to check out:


    *   [Vundle](https://github.com/gmarik/vundle) is a popular plugin manager for
    vim. You tell it which bundles you want in your `.vimrc` file and it downloads
    and installs them for you. This is the mirror opposite of how Pathogen works,
    but it makes it easy to move your entire configuration with you wherever you go.


    *   [NeoBundle](https://github.com/Shougo/neobundle.vim) is similar to Vundle
    in use and in aims, but seeks to improve on some of Vundle’s features.


    All of these bundle managers perform more or less the same functions, it’s just
    a matter of which one works best for you.


    ## Appendix 2: Quick Reference Charts


    ### Motions


    simple motions


    | Keystroke | Motion |


    | --- | --- |


    | h | move right |


    | j | move down |


    | k | move up |


    | l | move left |


    | b | previous word |


    | e | end of word |


    | ctrl+d | move down by 1/2 screen |


    | ctrl+f | move down by 1 screen |


    | ctrl+u | move up by 1/2 screen |


    | ctrl+b | move up by 1 screen |


    | gg | jump to the start of the file |


    | G | jump to the end of the file |


    | ^ | first non-whitespace character of the line |


    | $ | last non-whitespace character of the line |


    | `0` | beginning of the line |


    ### Commands


    basic commands


    | Keystroke | Command |


    | --- | --- |


    | d | delete |'
