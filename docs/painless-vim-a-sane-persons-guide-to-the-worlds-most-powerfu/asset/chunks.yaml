  raw: '2A few months ago[↩︎](#chap01.xhtml_fnref-1)


    3According to me, see the whole “Opinionated” thing up above.[↩︎](#chap01.xhtml_fnref-2)


    4[http://natedickson.com](http://natedickson.com)[↩︎](#chap01.xhtml_fnref-3)


    5[http://crazyapplenews.com](http://crazyapplenews.com)[↩︎](#chap01.xhtml_fnref-4)


    6[@poginate](https://twitter.com/poginate)[↩︎](#chap01.xhtml_fnref-6)


    7[http://github.com/PogiNate](http://github.com/PogiNate)[↩︎](#chap01.xhtml_fnref-7)


    8I’m going to use lowest common denominator words like “Terminal” a lot. If your
    OS calls it something different like a shell or a command line or (heaven help
    you) `cmd.exe` then just substitute that in your head.[↩︎](#chap02.xhtml_fnref-term)


    9Later on you’ll want to know that this is the “quit and don’t save anything”
    way of getting out. There are a few other ways to exit vim, but we’ll get there
    later.[↩︎](#chap02.xhtml_fnref-out)


    10Remember that commands that start with a colon `:` require you to press `<enter>`
    to make them execute. Okay, this is definitely the *last* time I’m going to repeat
    that. [↩︎](#chap03.xhtml_fnref-lastWarning)


    11I’ve heard it said that some people call Normal Mode “Beep Mode” because you’ll
    try to switch back to it and the terminal will beep at you and you’ll realize
    you’re already in it. I don’t know if I believe that anybody actually calls it
    that, but since I’m writing a vim book I’m honor bound to pass this bit of information
    on to you. Just like if I were writing *Beginner’s Big Book o’ Computer Facts*
    I would feel obligated to mention that four bits is called a “nibble” (because
    it’s *half a byte* and “byte” sounds like “bite”! Get it? *GET IT???*), even though
    I’m pretty sure that’s just a joke that got put in some textbook years ago and
    has since gotten out of hand.[↩︎](#chap03.xhtml_fnref-Beep)


    12“There is more than one way to do it” usually pronounced “Tim-Toady”[↩︎](#chap03.xhtml_fnref-timtowtdi)


    13Here are two secret bonus ways to exit vim that you won’t need to know about
    until you know how to open multiple files: `:qa` closes all open files and quits
    vim, and `:qa!` does the same thing even if any file has unsaved changes. Don’t
    worry, we’ll review them again when we talk about [opening multiple files](#chap22.xhtml_tab-pages).[↩︎](#chap03.xhtml_fnref-SecretBonus)


    14On windows the situation is a [little more complicated](http://superuser.com/questions/86246/where-should-the-vimrc-file-be-located-on-windows-7).
    We’re going to proceed as if you’re on a Unix-ish machine, because it’s easier.
    [↩︎](#chap04.xhtml_fnref-WinVim)


    15Or people who write vim books in Markdown. [↩︎](#chap04.xhtml_fnref-OrMarkdownUsers)


    16which is unix-speak for “[read a file and do what it says](http://stackoverflow.com/questions/9326695/what-does-it-mean-to-source-a-file-in-unix-linux-context)”[↩︎](#chap04.xhtml_fnref-read)


    17And it actually cost me some cash money, but not a ton.[↩︎](#chap05.xhtml_fnref-money)


    18Until I created my own, that is.[↩︎](#chap05.xhtml_fnref-Until)


    19By programmers at any rate. Managers would suggest that at least a portion of
    that 90% is *actually* spent furtively reading tech blogs and web comics.[↩︎](#chap06.xhtml_fnref-programmers)


    20I use the name “motions” instead of “commands” or “actions” quite intentionally.
    For now don’t worry about it, just remember it for later.[↩︎](#chap06.xhtml_fnref-motions)


    21I’m only going to cover this once, because it’s annoying. Fans of vi will insist
    that you pronounce “vi” like “vee eye” instead of like “vie” because shut up.
    “vim”, thankfully, is pronounced “vim”. This is yet another reason to never ever
    use non-improved vi.[↩︎](#chap07.xhtml_fnref-veeeye)


    22Once on the first word of the sentence, once on “Larry” and once on “Wall”.[↩︎](#chap07.xhtml_fnref-threeTildes)


    23to make “fred” “dead”.[↩︎](#chap07.xhtml_fnref-roperator)


    24We’ll get to things like changing words and sentences soon enough. Don’t worry,
    I won’t leave you hanging.[↩︎](#chap07.xhtml_fnref-words)


    25Like, say, a book about how vim works.[↩︎](#chap07.xhtml_fnref-longform)


    26If you know it. Or you can just type three periods (which you can call an ellipsis,
    if you know that) and call it good.[↩︎](#chap07.xhtml_fnref-IfYouKnow)


    27You would think that I would repeat myself here, wouldn’t you? I know. I’m just
    as surprised as you are.[↩︎](#chap07.xhtml_fnref-Repeating_myself)


    28Wondering what that `w` means? Good eye. We will be getting to that right after
    the aside. [↩︎](#chap08.xhtml_fnref-shortly)


    29I’ll get to the difference between a lower case word and an upper case WORD
    very soon. [↩︎](#chap08.xhtml_fnref-wordvsWORD)


    30There is a lot of discussion about what this is actually called. I’ll let you
    dive into that fun world of terminology on your own some other time. I believe
    my nomenclature for things like *motions, counts, operators* and *commands* makes
    sense, and won’t get you lost when you start diving into vim’s [help system](#chap17.xhtml_help).[↩︎](#chap08.xhtml_fnref-count_terminology)


    31Or possibly five words and a protocol specification.[↩︎](#chap09.xhtml_fnref-not-counting)


    32Contemplation of your navel as an aid to meditation. [Really.](http://en.wikipedia.org/wiki/Omphaloskepsis)[↩︎](#chap09.xhtml_fnref-omph-def)


    33Sorry about the super-technical jargon there.[↩︎](#chap10.xhtml_fnref-letter-command)


    34For that matter, writing *prose* isn’t usually a linear process anywhere other
    than junior high either. But we’ll stick with the metaphor for now. It’s probably
    worth pointing out that I don’t know anything about art, so the following analogy
    may be a bit odd.[↩︎](#chap10.xhtml_fnref-write-draw)


    35See what I did there?[↩︎](#chap10.xhtml_fnref-seethere)


    36Technically they both move the cursor by one `shiftwidth`, which is *usually*
    four spaces and is *usually* the same as one tab.[↩︎](#chap10.xhtml_fnref-indentoutdent)


    37technically a page from vim’s official help system, which we will get to [soon](#chap17.xhtml_help).[↩︎](#chap10.xhtml_fnref-vim-help-modes)


    38I’m just kidding. Kind of. You could also be adding a comma to the end of every
    line in an array or list of attributes.[↩︎](#chap12.xhtml_fnref-Kidding)


    39With the odd exception of `O` to open a new line above your current line. [↩︎](#chap13.xhtml_fnref-noO)


    40but disabled by default[↩︎](#chap13.xhtml_fnref-disabled)


    41From this point on I’m going to omit the double quotes before register names,
    because they look *really weird* in text. Just remember that if I write “register
    b” that what you should enter in vim is `"b`. [↩︎](#chap14.xhtml_fnref-regnames)


    42Unless you name a register. Then it gets stored *three* places.[↩︎](#chap14.xhtml_fnref-ThreeReg)


    43they’re stored, along with quite a few other things, in a file called `.viminfo`.
    But that’s a topic for a different book. [↩︎](#chap14.xhtml_fnref-Viminfo)


    44It’s not really *really* gone, of course. if you just hit `u` it’ll spring back
    to life. It’s really hard to get rid of things in vim.[↩︎](#chap14.xhtml_fnref-notforever)


    45I am using one called [Jellybeans](https://github.com/nanotech/jellybeans.vim).
    Because it’s awesome, that’s why.[↩︎](#chap15.xhtml_fnref-current-theme)


    46The “c” stands for “close”. I’m not sure why “z” stands for “fold”.[↩︎](#chap15.xhtml_fnref-cIsClose)


    47This is not because I’m a terrible writer. I hope.[↩︎](#chap16.xhtml_fnref-badwriter)


    48Because you are good at regular expressions and feeling pretty good at vim as
    well right now.[↩︎](#chap16.xhtml_fnref-good_at_regex)


    49Generally called `PCRE` or “Perl Compatible Regular Expression” parsers.[↩︎](#chap16.xhtml_fnref-pcre-parsers)


    50This should remind you that `:q` isn’t `quit` the way you would normally think
    of that verb. In fact, this is (yet another) good reason to use `ZZ` instead of
    `:qs` and `ZQ` instead of `:q!`; it breaks the mental link between the command
    and the thought of “quitting” vim. [↩︎](#chap17.xhtml_fnref-q_is_not_quit)'
