    我来到这里是为了帮助你入门，而不是为了成为你关于这个主题买的唯一本书。之所以这样做，主要原因并不是因为懒惰，非常感谢。嗯，好吧，某种程度上确实是这样。这个世界上有大量的书籍、网站、维基和其他文档，一旦你度过了最初的学习曲线，它们都会在你的学习道路上提供帮助。我来到这里是为了帮助你度过第一道曲线。


    ### 技巧列表


    如果你没有学过前面的章节，后面章节中的很多内容将变得毫无意义。这些章节的布局是迭代的，从微小的变化开始，最终积累成一个可以良好运行的最终配置。然后，你将在进一步的修改中获得一个很好的起点。


    ### 深度解析


    这里的目标是给你提供足够的信息让你感到舒适，而不是提供所有的底层技术、行编辑器命令以及此类内容。再次强调，这些内容可以在网上以及遍世界各地的许多其他参考书中找到。当你决定想更多地了解某些内容时，你将能够找到它。我对你有信心。


