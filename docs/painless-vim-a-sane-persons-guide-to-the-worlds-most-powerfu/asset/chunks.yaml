  trans: '


    | 键 | 说明 |

    | --- | --- |

    | G | 跳到文件末尾 |

    | `^` | 行首第一个非空白字符 |

    | $ | 行尾非空白字符 |

    | `0` | 行首 |


    还有很多其他命令，但这些足够我们开始操作了。让我们花点时间尝试一下这些动作。打开一个文件并来回跳动，移动到行的开头和末尾，在单词之间来回跳跃等。


    “屏幕”移动稍微难掌握一点，但一旦你习惯了，它们就很有意义了。一个“屏幕”由你当前终端窗口能够容纳的行数组成。所以，如果你的终端窗口高度为 80 行，那么一个屏幕可能就是
    79 行（留出一行作为状态栏），半个屏幕大约是 40 行。但如果你缩放了终端窗口，“屏幕”的大小也会随之改变。尽管如此，还是花些时间习惯如何使用 `1/2`
    和全屏移动来快速“滚动”文件，并感受一下你能移动有多快。


    这些移动本身就很有用，你掌握得越好，在 vim 中就会玩得越开心。但当你将它们与接下来两个章节中将遇到的*操作符*和*计数器*结合时，效果会变得更出色。


    ## 6. 操作符 1：修改字母和行


    好了，你已经有了行号、颜色，以及如何让光标从一个地方移动到另一个地方的基本概念。如果你愿意，可以停在这里，在普通模式下移动光标，按下 `i` 进入插入模式，像在任何其他编辑器中那样进行所有更改。但
    vim 有更好的主意。你可以直接在普通模式下完成许多最常见的更改。现在，我们将关注最常见的三个命令：剪切、复制和粘贴。


    只是它们在 vim 中有不同的名称。记住，`vi` 在整个“剪贴板”概念普及之前就已经存在了。所以，它不是“剪切、复制、粘贴”，而是“删除（delete）、取用（yank）、放置（put）”。让我们用表格来介绍一些最常用操作符的命令：


    ### 基础命令


    | 按击键 | 命令 |

    | --- | --- |

    | d | 删除 (delete) |

    | c | 修改 (删除并进入插入模式) |

    | y | 取用 (复制，yank) |

    | u | 撤销 (undo) |

    | p | 放置 (粘贴，put) |

    | r | 替换 (用下一个输入的任何字符) |


    为了尝试这三个命令，让我们打开一个我们并不介意真的*真的*弄乱的示例文档。示例文档文件夹中有一个名为 `operators.txt` 的文件，非常适合这个。


    ### 单独操作符：修改单个字符


    #### 删除文本 (Killing Text)


    大部分情况下，操作符本身作用于单个字符。`operators.txt` 的第一部分有一些重复字母的单词，如“ddoctor”，这是在打字时并不常见的错误。去掉多余的字母很容易。只需将光标置于重复的字符上，按下
    `d`（代表 delete）或 `x`（代表……一种记忆法，模拟在打字机上划掉某东西。我猜读这本书的大多数人可能没有在打字机上花过长时间，所以这个小记忆法现在已经过时了）。


    #### 复生文本 (Resurrecting Text)


    一旦你删除了文本，它并没有真正消失，而是在一个*寄存器*中，即内存中的一个特殊位置，如果需要，vim 可以快速将其找回。在普通模式下，按下 `p` 会将光标之前最近被取用或删除的任何文本“放置”到此处。


    #### 两个有趣的命令


    有两个操作符在特定情况下非常有用：`~` 和 `r`


    `~` 切换单个字母的大小写，而 `r` 让你用下一个输入的字母替换掉单个字符。


    你可以使用这两种命令来修正 `operators.txt` 的第 13 行，该行内容是：


    ```

    1 "you can''t grep a fred tree" --larry wall

    ```


    使用三次 `~` 操作符和一次 `r` 操作符，你就能得到一个格式良好的引用，即使引言处可能有点可疑。


    #### 对行进行操作


    修改单个字母很有趣，但有时你需要重构整行文本而不是单个字母。vim 包含了了一些快捷键，可以将一行文本修改为更理想的形状，例如更短的行、两个相同的行，或者完全删除行。


    在我们深入之前，我们应该看看 vim 是如何定义什么是“行”、以及什么不是行的。vim 的“行”是指两次按下 `<enter>` 键之间的所有内容，即使它跨越了屏幕上的几行可见的“行”。如果开启了自动换行，vim
    会继续某行文本，如下所示：


    ```

    1 8 这是本文档中的第八行文本。

    2    它一直延伸下去。你会发现，尽管

    3    这一行里有几个句子，但在 vim 中仍然被视为一个

    4    单“行”，在我按下

    5    回车键之前，它不会出现新的行号。

    6 9 好的，这是一个新行，因为我按了回车键。这就是为什么

    7    出现了一行新内容

    ```


    #### 行尾


    有时你需要剪切一行的末尾。在 vim 中，命令的大写版本作用于从光标到行尾的行。在 `operators.txt` 中找到以下行：


    ```

    1 Emacs is a great system, it just needs


    ```


    但这样我们就只留下了一个带句点的句子。我们可以做得更好。按下 `u` 恢复你删除的文本。好了，这次我们将组合两个命令：将光标移动到逗号右侧一个空格，按下 `D`
    删除文本。现在光标应该是逗号，你可以按下 `r.` 将其替换为句号，全程无需离开普通模式。


    放置（Put）稍有不同：小写的 `p` 将最近取用或删除的文本放置在光标*之后*，而大写的 `P` 将文本放置在光标*之前*。这里有一个演示：假设我们从一行剪切了单词
    `seven` 并想将其粘贴到下一行：


    ```

    1 four score and |years ago...

    ```


    在这种情况下，按下 `p` 粘贴的结果是：


    ```

    1 four score and y

    ```

    不对，应该是：

    ```

    1 four score and yseven ears ago...

    ```


    因为光标位于字母 y 上。但“yseven ears”并不是我们。但如果你使用 `P`，就能得到预期的结果：


    ```

    1 four score and seven years ago...

    ```


    #### 整行


    要让 `d/y/c` 操作符作用于整行，只需复制操作符。因此 `yy` 复制（或“取用”）整行，`dd` 删除整行，`cc` “修改”整行。（即：删除该行并让你进入插入模式）。你也可以在
    `operators.txt` 中尝试这些命令，从第 31 行开始。


