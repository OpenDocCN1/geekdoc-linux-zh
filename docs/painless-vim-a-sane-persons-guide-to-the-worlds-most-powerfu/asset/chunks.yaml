  raw: 'This is true of all the other modes as well: `vnoremap`, `nnoremap` work in
    exactly the same way. As you probably guessed, the `nore` stands for “no recursion”,
    and ensures that anything in the expansion side of the remap is left un-evaluated.
    In general, it’s a recommended practice to use the no recursion versions, because
    they’re “protected” against accidental remaps from new plugins or other keymaps
    you may add later.


    ## 19. Fancy Insert Mode Tricks


    Back in the chapter about [Modes](#chap10.xhtml_modes) I mentioned that insert
    mode is fairly light on commands, because that’s the mode where you’re supposed
    to be, you know, *inserting* stuff. But “light on commands” is definitely relative,
    as there are a *lot* of things that you can do in insert mode, once you find out
    about them. That’s where I come in. I guess I could also mention that vim’s built-in
    help system has a lot to say on the subject: just type `:h insert.txt` to find
    out more. And by “more” I mean “**everything**” The help system is thorough, to
    say the least.


    In the [last section](#chap19.xhtml_mapping-keys) I briefly mentioned the fact
    that vim uses the `<ctrl>` key for just about everything. This is especially true
    in insert mode, where all the regular keys are doing their regular stuff. Vim
    uses the `<ctrl>` key to give you access to useful functions such as the following:


    | Command | result |


    | —— | —— |


    | `<ctrl>w` | Delete the *word* before the cursor |


    | `<ctrl>u` | Delete the *line* before the cursor. |


    | `<ctrl>t` | *Increase* line indent by `shiftwidth`^([61](#chap35.xhtml_fn-shiftwidth))
    |


    | `<ctrl>d` | *Decrease* the line indent by shift width |


    | `<ctrl>n` | Find next completion suggestion |


    | `<ctrl>x` | Hoo boy. I’ll get to `^x` in a moment. |


    | `<ctrl>r` | Insert the contents of a register. More on what that means soon.
    |


    ### `<ctrl>x` Adventures


    Technically, `<ctrl>x` moves you into a sub-mode called, appropriately, “CTRL-X”
    mode. Most of the commands available in this mode are *completion* commands; vim’s
    version of autocomplete. We’re going to play around with some of these, but CTRL-X
    mode isn’t the purview of a “painless” book like this one. Instead of diving too
    deeply I’m going to refer you to some experts on the subject.


    For now, though, let’s play with a couple of simple commands in CTRL-X mode. The
    first one is the awesome-sounding “omni complete” which you access by typing `<ctrl>x
    <ctrl>o`.


    ### `<ctrl>r` Funtimes


    The `<ctrl>r` command gives you an easy way to paste in information from any of
    your [registers](#chap14.xhtml_registers). Just type `<ctrl>r` and the name of
    the register you want to paste in. So `<ctrl>r a` gives you the contents of `"a`
    right where your cursor is sitting. In essence all this does is save you a trip
    back to normal mode.


    For the most part this is a simple concept, and we mostly covered it in the chapter
    on registers. But `<ctrl>r` has a few other tricks up its sleeves. Well, okay,
    one other trick that we’re going to play with here, which is pasting from the
    *expression register*.


    The expression register is pretty much what it sounds like: you can give it an
    expression and when you paste it it gives you the result of that expression. What’s
    even better is that vim will let you do both in a single step, all from within
    insert mode. All you have to do is type `<ctrl>r=` and the expression you want
    to evaluate. You can do simple expressions like `<ctrl>r=40+2` and it’ll drop
    the expected result right where your cursor is sitting. But wait, there’s more!
    (There’s always more.) The expression register doesn’t just deal with *mathematical*
    expressions. You can also have it deal with *programmatic* expressions!


    But not in this book. Expressions are powerful and interesting, but certainly
    not painless. So instead I’m going to point you at some [other resources](#chap30.xhtml_more-expressions)
    to check out if you want to enhance your expression knowledge.


    ### Completions!


    This is one of those places where vim tries hard, bless its heart, but it’s not
    the best. I realize that saying that will get me skewered by people who know vim
    far better than I do, but here’s the skinny.


    Vim looks through the open files and finds words that you’ve written, making up
    a nice index. When you press `<ctrl>n` in insert mode it does it’s best to figure
    out what word you have already entered in the document that you might be typing
    again. If there’s more than one possibility it’ll give you a list of all potential
    matches. Press `<ctrl>n` again to go down to each new item in the list, and then
    start typing again when you’ve found the item that you want.


    This is super-helpful when you have variables or methods with long names that
    you have to enter over and over again. Usually you can type the first few letters
    and then just hit `<ctrl>n` to finish it. This is another way to help sanitize
    your code. Dynamic languages like JavaScript have no problem inventing a new variable
    on the fly if you happen to spell your current variable wrong once or twice, through
    no fault of your own. If you always use the completion function to put your variable
    names into code after the first time you can be assured that you’re spelling it
    the same way each time.


    Like I said a second ago, Completions are one place where other editors (and here
    I’m talking specifically about Sublime Text, but frankly Visual Studio is also
    great at this) have eclipsed vim (Eclipse is pretty bad at it, though; for the
    most part). However, one tiny rough patch amidst all the goodness of vim is hardly
    worth considering, right?


    ## 20. Vim Windows Are Not Microsoft Windows


    Okay, it’s time to see just how not-scary vim’s help system really is. The problem
    most first-time vim-trier-outers have is that they type `:help` and then the screen
    is split in half and they have no real way to jump from the help text back to
    the editor. If you’re feeling adventurous you might try `:q` and notice that you
    can kill the help window, but you’re still kind of at it’s mercy. Let’s talk about
    how vim windows work and how much of a non-issue they are.


    Note that in this chapter I’m going to start putting the command to look at the
    corresponding section in the official vim documentation. It might be super helpful.
    We’ll see.


    ### Opening and Closing Windows `:h opening-window`


    We already mentioned how you can get *rid* of a window: just “quit” it with the
    `:q` command (remember, `ZZ` and `ZQ` work just as well). But what if you *want*
    a new window? That’s easy too. You can “split” your current editor window into
    two windows with the `:sp` command. When you do this you’ll see that both windows
    are viewing the same file ^([62](#chap35.xhtml_fn-file-buffer-redux)). The thing
    is that you can change the file being edited in either window with all the usual
    commands: `:e` works just fine, and if you installed NERDTree in the plugins chapter
    then the NERDTree will let you navigate and edit files in whichever window was
    most recently in use. As you’ve probably guessed, NERDTree itself opens a long
    tall window.


    Which leads to more interesting possibilities: can you open windows that are different
    shapes and sizes? Can you change the size of an already opened window? The answers
    to your questions are yes and yes, but we’ll get there in a moment. For now we
    need to look at how you jump from one window to the other.


    ### Window Commands begin with `<ctrl>w`


    Pretty much everything you want to do with a window other than opening or closing
    it can be done by pressing `<ctrl>w` and then entering your desired command. The
    obvious mnemonic for this command is “control windows!”, something Microsoft has
    been trying to do for years^([63](#chap35.xhtml_fn-rimshot)).


    You could probably say that `<ctrl>w` enters a new mode called “window command
    mode” but that’s not an official name. And anyway we already did the modes chapter.


    ### Moving Between Windows `:h window-move-cursor`'
