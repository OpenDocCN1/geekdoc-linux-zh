    在菜单方面有很多注意事项：部分功能可以跨平台工作，部分则不行，因此我们将涵盖一个仅包含几个选项的基础菜单。此菜单将提供访问 Tim Pope 的 [fugitive](https://github.com/tpope/vim-fugitive)
    插件的接口，让你无需离开 vim 的情况下运行 git 命令。如果你想完全跟随操作，需要先安装该插件。请查看关于 plugins 的章节以快速回顾如何使用
    Pathogen 添加内容。


    好了！让我们开始吧。Fugitive 为你提供了大量实用的 git 特性，带有参数、范围以及一些强大且直观的功能，而这些我们将完全忽略。目前，我们将仅提供三个功能的访问：


    * Git Status (Git 状态)

    * Git Blame (Git 溯)

    * Git Remove (Git 移除)


    现在回来看，这可以作为我们菜单的一个很好的布局！


    Fugitive 的 `Gstatus` 命令让你能够访问极其广泛的函数；例如暂存或取消暂存文件，以及提交你的更改。理所当然，这将是我们最想要添加到菜单中的第一项。所以，嘿，我将从这里开始。


    ## 添加菜单


    添加菜单与添加快捷键（keymap）类似：你可以设置菜单仅在某些模式下工作，或在所有模式下工作。你可以设置为递归的或非递归的等等。而且和快捷键映射一样，你可以在将其添加到
    `.gvimrc` 文件之前测试你的新菜单。让我们现在测试一下：打开一个受 git 控制的文件并输入以下内容：


    ```

    1 :menu Git.Status :Gstatus<CR>

    ```


    然后按 `<enter>`。你应该看到菜单栏中出现了一个新的“Git”菜单项。点击它，你会看到一个“Status”菜单项。点击它，你应该就能看到极其强大的状态屏幕在新窗口中弹出。很棒对吧？在这个示例中，我们只使用了
    `:menu` 选项，它会在 Normal、Visual 和 Operator-pending 模式下启用菜单。还有其他选项，见下表：


    ### 菜单命令


    | 命令 | 模式 |

    | :--- | :--- |

    | `:menu` | Normal, Insert, Operator-Pending |

    | `:nmenu` | Normal |

    | `:vmenu` | Visual |

    | `:omenu` | Operator-pending |

    | `:menu!` | Insert, Command-line |

    | `:menu` | Command-line |

    | `:amenu` | All |


    在这个表中，我把最好的留在了最后。大多数时候，你可能会使用 `:amenu` 选项。事实上，如果你只是在测试菜单而还没有放入配置中，你有两个快捷键可以使用！命令
    `:an` 和 `:am` 都是 `:amenu` 的别名。


    好了！让我们回到菜单定义。在选择了你希望菜单激活的位置后，你将为菜单命名。你会注意到我们将其中一个命名为 `Git.Status`。中间的点定义了一个子菜单，如果你厌恶自己的生活并想要继续下去，你可以一直写：


    ```

    1 :menu Git.Should.Be.Easier.To.Use.Than.This.Status :Gstatus<CR>

    ```


    你将得到类似这样的东西：


    ![求你了，求你千万不要这样做](img/bad_menu.jpg)


    求你了，求你千万不要这样做


    但现在我们已经玩够了，该回到理性的菜单了，嗯吗？


    ## 保持秩序


    除非你是某种波西米亚人，否则你会定义菜单出现的顺序。你通过在菜单定义中添加优先级来实现这一点。优先级数字越小，菜单出现的位置越靠左。默认菜单如下：


    * File: 10

    * Edit: 20

    * Tools: 40

    * Syntax: 50

    * Buffers: 60

    * Window: 70

    * Help: 9999


    通常情况下，建议不要将菜单优先级设置为高于 999，但没有人能阻止你。要创建一个带优先级的菜单，只需将优先级放在菜单命令之前，如下所示：


    ```

    1 :80menu Git.Status :Gstatus<CR>

    ```


    这会将你的菜单放在 Window 菜单之后。如果你不提供优先级，vim 将为你的菜单分配 500 的优先级。如果你想为子菜单设置优先级，可以在菜单命令后以点分隔的列表列出优先级：


    ```

    1 :menu 80.100 Git.Status :Gstatus<CR>

    ```


    这将 Git 菜单放在 window 之后，并在列表中较靠前设置 Status 菜单（因为任何没有设置优先级的菜单都将默认为 500）。


    好了，有了这些信息，让我们为我们的三个 git 命令创建菜单。以下内容适合放在你的 `.gvimrc` 文件中：


    ```

    1 :menu 80.1 Git.Status :Gstatus<CR>

    2 :menu 80.2 Git.Blame :Gblame<CR>

    3 :menu 80.4 Git.Remove :Gremove<CR>

    ```


    保存文件，加载它（source），你就应该有一个非常棒的 git 菜单准备就绪了。


    ## 让菜单主动找上你


    vim 的核心要点之一是你不需要离开键盘就能完成操作。这让菜单变成了一个问题。你必须松开一只手，将鼠标一直移动到屏幕顶部点击某些内容，然后把手回到位置。好吧，我们将去掉这些步骤之一。


    Vim 提供了 `:popup` 命令，让你可以将特定菜单调到光标位置。假设你想要你的 git 菜单。只需进入命令行输入


    ```

    1 :popup Git

    ```


    Git 菜单应该出现在……离鼠标近的地方。popup 选项的行为并不完全可靠，它可能会在某个时刻消失，但目前看起来超级酷。如果你映射一个快捷键，它看起来会更酷，如下所示：


    ```

    1 nmap <Leader>g :popup Git<CR>

    ```


    现在，有了这些知识，我们可以继续下去了。问题是从这里开始有两个不同的路径。Linux 或 Windows 上的 Vim 工作方式几乎相同，而 MacVim
    对此有自己的一些见解。选择最适合你的部分。


    ### Linux 和 Windows


    如果你查看 Linux 或 Windows 下 gvim 上的 `File` 菜单，你会注意到某些菜单项带有带下划线的字母，并在菜单项旁边列出了快捷键。你可能在其他所有程序中对它们非常熟悉。如果在
    File 菜单打开时按下 `<alt>o`，将打开一个新文件。如果我们想将 `<alt>g` 定义为打开 Git 菜单的命令，我们会在字母 G 之前设置一个和符号
    (&) 如下：


    ```

    1 :menu 80.1 &Git.&Status :Gstatus<CR>

    ```


    我们还将 `<alt>s` 设置为状态菜单项的加速键。但假设我们想完全放弃菜单。我们可以让菜单告诉我们如果我们想避免菜单，可以运行什么命令。你只需要在字面字符串
    `<Tab>` 之后右对齐放置你想要的文本，如下：


    ```

    1 :menu 80.1 &Git.&Status<Tab>:Gstatus<CR>

    ```


    #### 隐藏菜单


    如果你想变得超级酷，可以设置一个不会出现在菜单栏中的菜单，一个只能作为弹出窗口（popup）访问的菜单。再次，这是一个简单的更改：你的菜单名称需要在开头有一个字符
    `]`，如下所示：


    ```

    1 :menu ]Git.Status<Tab>:Gstatus :Gstatus<CR>

    ```


    一旦你这样定义了它，你需要记得使用方括号来调用它：


    ```

    1 nmap <Leader>g :popup ]Git<CR>

    ```


    搞定！你拥有了一个像魔法一样从空处出现的菜单！这，我的朋友，就是美好的生活。


    ### MacVim 是个异类！


    MacVim 处理菜单的方式不同，这并不令人意外，因为 OSX 处理菜单的方式也不同。如果你正在设置一个预期在 MacVim 中使用的 `.gvimrc`，你有两个新命令可以尝试，以使你的菜单完全兼容
    Mac。


    '
- fmt: "\nHowever they’re definitely *not* painless. As in “so far I haven’t been\
    \ able to add a new menu item using the MacVim menu commands.” You can use the\
    \ regular menu commands listed before, but assigning mac-specific keyboard shortcuts\
    \ so far eludes me. And as I already mentioned, you can’t hide menus in MacVim;\
    \ they’ll always show up on the menubar, even if you preface the name with `]`.\
    \ So, if you want to learn how to make OSX specific menus check out `:h macvim-menus`\
    \ from MacVim and let me know what you find.\n\n# 27. Literary Vim: Writing Prose\
    \ in Vim\n\nFirst of all, I have a confession to make: I wrote very little of\
    \ this book in `vim`. For the most part I wrote, reviewed, and edited this book\
    \ in `Scrivener`, occasionally switching to `Multimarkdown Composer` for fancy\
    \ markdown features like tables and such. ^([74](#chap35.xhtml_fn-OtherTools))\
    \ This isn’t because `vim` is a bad choice for prose writing, it more because\
    \ I have grown quite familiar with and fond of `Scrivener` over the years, and\
    \ I find it works well for the way I write prose.\n\nBut that’s me. I have had\
    \ a number of people ask me how to use `vim` for writing instead of coding. It’s\
    \ a fair question, and not surprisingly, `vim` is quite adept at being a writer’s\
    \ editor of choice. With just a little work you can put the full power of `vim`\
    \ behind your blog, thesis, or book about using `Scrivener`. Turnabout is fair\
    \ play after all.\n\n## Setting up the Writing Workflow\n\nWhen I write prose\
    \ I almost universally use [Markdown](http://daringfireball.net/projects/markdown/),\
    \ or, more specifically [MultiMarkdown](http://fletcherpenney.net/multimarkdown/)\
    \ instead of writing in a word processor like `Word`, `Pages`, `LibreOffice` etc.\
    \ In this chapter I’m going to go ahead and assume you’re doing the same.\n\n\
    So, to write prose we need a (multi)markdown syntax file, so that `vim` can help\
    \ us do all the syntax highlighting and other helpful things it does so well.\
    \ So far the best I have found is by (you guessed it) Tim Pope, and is available\
    \ on [GitHub](https://github.com/tpope/vim-markdown). See the chapter on [plugins](#chap11.xhtml_plugins)\
    \ for a refresher on how to install it.\n\nLater on we’re going to talk about\
    \ actually exporting your markdown-style text to something pretty and fully formatted,\
    \ so let’s install the software we need for that now, while we’ve already got\
    \ our hands dirty.\n\n[MultiMarkdown](http://fletcherpenney.net/multimarkdown/)\
    \ is my converter of choice. It runs on any desktop OS, adeptly converts `Markdown`\
    \ and `MultiMarkdown` into a variety of formats, and is free and frequently updated.\n\
    \nOnce you’ve got `mmd` up and running it’s time to set `vim` up in writing mode\
    \ instead of coding mode.\n\n## Writer-Friendly Vim Settings\n\nOne of the great\
    \ benefits of using `vim` as your main writing tool is that it is one of the original\
    \ distraction free writing programs. Open `vim` full screen and you have nothing\
    \ to do but write. But there are a few settings we need to tweak to get started.\n\
    \nThe first is line wrapping. When you’re programming you usually want each line\
    \ to stay on its own line, so you can make sure things line up or whatever. When\
    \ you’re writing prose, not so much. Frankly, `vim` has a line-wrapping feature,\
    \ and it’s easy to use. But you’ll need to make some decisions ahead of time.\n\
    \nThe main decision is if you want wrapping on all the time or only occasionally.\
    \ If you are using `vim` primarily as a code editor you probably want line wrapping\
    \ off by default. If you’re using it as a text editor you probably want it on.\
    \ Since we’re talking about literary `vim` right now we’ll go with line wrapping\
    \ on, and then talk about how to toggle it easily.\n\nIn order for `vim` to handle\
    \ line wrapping intelligently you need to set a few flags in your `.vimrc`:\n\n\
    ```\n1 set wrap\n2 set linebreak\n3 set nolist\n```\n\nThe first one is obvious:\
    \ we want it to wrap. The second one tells `vim` to break lines at one of a list\
    \ of line break characters instead of just saying “okay! That’s 80 columns! Next\
    \ character goes on the next line!”. It’s the difference between this:\n\n```\n\
    1 Here I am on line one. This is a good line. I wo\n2 nder when I will hit line\
    \ two?\n```\n\nAnd this:\n\n```\n1 Here I am on line one. This is a good line.\
    \ I \n2 wonder when I will hit line two?\n```\n\nYou can check out `:h linebreak`\
    \ for more information on what characters trigger a line break and how it all\
    \ works. But for now we’ll just stick with the stock answer: it works very well.\n\
    \nThe next thing to say about `wrap` and `linebreak` is that they insert soft\
    \ line breaks instead of hard line breaks. A hard line break is like actually\
    \ hitting the `<enter>` key, a soft line break only visually moves your text onto\
    \ the next line. If you make your `vim` window wider the text will re-flow to\
    \ the end of the new wider window. If you’re writing in `Markdown` you absolutely\
    \ want soft line breaks, as the `Markdown` parser will format your text appropriately\
    \ when you run it.\n\nSo, what about `nolist`? We turn it off is because `list`\
    \ breaks wrap and line break. You can read more about it in the help file: `:h\
    \ list`, but for now let’s just turn it off.\n\nOkay, so now vim is all ready\
    \ to write! But what if we suddenly hate line wrapping? Let’s add one more line\
    \ to `.vimrc` to let us:\n\n```\n1 nnoremap <F7> :set wrap<CR>\n```\n\nThe purpose\
    \ of this command should be obvious. You could map it to something like `<leader>w`\
    \ if you wanted, but I find that works for me.\n\n## Spreading the Word: How to\
    \ Get Your Message Out\n\nAt length, it will be time for your words to leave the\
    \ warm embrace of your computer and fend for themselves out the real world. It’s\
    \ a proud and terrifying time. If you’re publishing your opus via some awesome\
    \ markdown-aware site like say, [Leanpub](http://leanpub.com) then your work is\
    \ pretty much done. Follow their instructions for getting your text on their servers\
    \ and sit back, a job well.\n\nHowever, if you’re using any other method of we’ve\
    \ still got some work to do. The reason we wrote in `Markdown` is because your\
    \ text can now be converted into whatever format you need. This is where `mmd`\
    \ comes into play. Let’s take this very simply to begin with. You can practice\
    \ on the `literary.md` file in the sample repository.\n\n```\n1 mmd literary.md\n\
    ```\n\nAnd just like that you’ve got a new HTML page right next to your markdown\
    \ file. If you pop that page open in a browser you will see that all your text\
    \ formatting, like tables, italics, bolds, footnotes etc. are there, but precious\
    \ little other formatting is.\n\nThis is because we haven’t told `MultiMarkdown`\
    \ what fonts, colors, justifications etc. to use. And while you *could* do that\
    \ by giving it a stylesheet you want used with your output, I would recommend\
    \ against doing so. Once you’ve got a basic formatted version of your text you\
    \ have a couple of options:\n\n*   Turn it over to a publisher and use their formatting\n\
    *   Take a pass at your text with a word processor or other program that handles\
    \ customizable text formatting.\n\n### More Formats! I Need More Formats!\n\n\
    The official MultiMarkdown program can convert your text into a list of formats\
    \ that is impressive, but if you’re like most people you’re going to notice a\
    \ couple of glaring omissions. Where, for example, is the option to create a `.docx`\
    \ file for Word, or a `PDF` file?\n"
