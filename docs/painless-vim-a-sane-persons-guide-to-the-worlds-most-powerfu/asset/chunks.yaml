- fmt: "\n## A few months ago\n\nAccording to me, see the whole “Opinionated” thing\
    \ up above.\n\n[http://natedickson.com](http://natedickson.com)\n\n[http://crazyapplenews.com](http://crazyapplenews.com)\n\
    \n[@poginate](https://twitter.com/poginate)\n\n[http://github.com/PogiNate](http://github.com/PogiNate)\n\
    \nI’m going to use lowest common denominator words like “Terminal” a lot. If your\
    \ OS calls it something different like a shell or a command line or (heaven help\
    \ you) `cmd.exe` then just substitute that in your head.\n\nLater on you’ll want\
    \ to know that this is the “quit and don’t save anything” way of getting out.\
    \ There are a few other ways to exit vim, but we’ll get there later.\n\nRemember\
    \ that commands that start with a colon `:` require you to press `<enter>` to\
    \ make them execute. Okay, this is definitely the last time I’m going to repeat\
    \ that. \n\nI’ve heard it said that some people call Normal Mode “Beep Mode” because\
    \ you’ll try to switch back to it and the terminal will beep at you and you’ll\
    \ realize you’re already in it. I don’t know if I believe that anybody actually\
    \ calls it that, but since I’m writing a vim book I’m honor bound to pass this\
    \ bit of information on to you. Just like if I were writing Beginner’s Big Book\
    \ o’ Computer Facts I would feel obligated to mention that four bits is called\
    \ a “nibble” (because it’s half a byte and “byte” sounds like “bite”! Get it?\
    \ GET IT???), even though I’m pretty sure that’s just a joke that got put in some\
    \ textbook years ago and has since gotten out of hand. \n\n“There is more than\
    \ one way to do it” usually pronounced “Tim-Toady”\n\nHere are two secret bonus\
    \ ways to exit vim that you won’t need to know about until you know how to open\
    \ multiple files: `:qa` closes all open files and quits vim, and `:qa!` does the\
    \ same thing even if any file has unsaved changes. Don’t worry, we’ll review them\
    \ again when we talk about opening multiple files.\n\nOn windows the situation\
    \ is a little more complicated. We’re going to proceed as if you’re on a Unix-ish\
    \ machine, because it’s easier. \n\nOr people who write vim books in Markdown.\n\
    \nwhich is unix-speak for [read a file and do what it says](http://stackoverflow.com/questions/9326695/what-does-it-mean-to-source-a-file-in-unix-linux-context)\n\
    \nAnd it actually cost me some cash money, but not a ton.\n\nUntil I created my\
    \ own, that is.\n\nBy programmers at any rate. Managers would suggest that at\
    \ least a portion of that 90% is actually spent furtively reading tech blogs and\
    \ web comics.\n\nI use the name “motions” instead of “commands” or “actions” quite\
    \ intentionally. For now don’t worry about it, just remember it for later.\n\n\
    I’m only going to cover this once, because it’s annoying. Fans of vi will insist\
    \ that you pronounce “vi” like “vee eye” instead of like “vie” because shut up.\
    \ “vim”, thankfully, is pronounced “vim”. This is yet another reason to never\
    \ ever use non-improved vi.\n\nOnce on the first word of the sentence, once on\
    \ “Larry” and once on “Wall”.\n\nto make “fred” “dead”.\n\nWe’ll get to things\
    \ like changing words and sentences soon enough. Don’t worry, I won’t leave you\
    \ hanging.\n[/content] (注：由于用户提供的文本包含大量重复脚注和错乱逻辑，此处我将针对您提供的第一个 `[content]` 块内容进行排版)\n\
