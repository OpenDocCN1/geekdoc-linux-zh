    ## 2. 将光标移动到第一个变量声明之前，连续按三次 `j`，以选择每行的第一列


    3. 输入 `I`（大大写的 I，或者按 `<shift>I`）


    4. 输入 `var`


    5. 按 `Esc`（或 `<ctrl>[[`）


    Vim 将将你的 `var` 声明插入到你在可视块模式下选中的每一行前面。现在去修复你的变量名吧。


    在你提问之前，是的，你完全可以在可视模式下使用 `A` 在块模式选择的每行末尾添加内容。vim 绝不会忘记如此基础的功能。事实上，有很多非常智能且实用的仅限可视块的命令，它们让程序员常用的格式化任务变得变得容易得多。你可以通过输入
    `:h blockwise-operators` 在帮助主题中找到完整列表，但我还要再提一个。嗯，是两个，但它们是互为镜像的反向操作，所以基本上还是多了一个……


    **无论如何**


    当你在可视块模式下选择了一个区域后，可以使用 `>` 将该区域缩进一个“制表”。同样，在可视块模式下按 `<` 可以将整个区域取消缩进一个 tab。


    ### 常用可视模式命令


    块模式的插入（Prepend）功能非常棒，但还有许多所有可视模式共有的功能。这里有一份快速亮点列表：


    当你处于可视模式时，可以使用 `o` 在所选区域的开头和结尾之间跳转。如果你想扩展所选区域以包含你在开头漏掉的几个字符，然后跳回选择的结尾并在那里再获取几个字符，这非常有帮助。


    在普通模式下，`gv` 将重新选择你之前选过的区域，这在你……想再次选择相同区域时非常有用。如果你最近进行过搜索，`gn` 将高亮光标和下一个搜索词出现处之间的所有内容，而
    `gN` 将选择光标和上一个出现处之间的所有内容，就像 `n` 和 `N` 让光标在搜索词的出现处之间移动一样。


    再次，这不是一个完整的列表。如果你想查看在可视模式下可以使用的所有命令和文本对象（text objects），可以使用 `:h visual-operators`
    查看 vim 的帮助文档。


    ## 25. Vim GUI


    有很多理由让你从终端使用 vim：它很快，对系统资源占用低，而且与 tmux 配合使用时，它可以让你所有的命令行鸡蛋都放在一个篮子里。但也有很好的理由使用
    vim 的图形化版本：它们通常具有更好的系统集成、按钮、标签，以及你认为开始这段 vim 冒险之旅时认为会永远失去的所有东西。让我们花点时间探索 vim 的图形化界面。


    有（多或）三种不同的图形化版本 vim：`gvim`、MacVim 和 Windows Vim。但只要你在命令行中调用 `gvim`，它们都会启动，所以为了简单起见，我们将所有它们统称为“gvim”。安装它们超出了本书的范围，因为安装过程在不同系统之间差异巨大。在这种情况下，搜索引擎是你的好朋友。


    ### 设定预期，然后进行一些设置


    首先，让我们明确一下当我们说“图形化”vim 时是指什么。你并不会得到一个像 IntelliJ 或 Visual Studio 那样完整的 IDE。通常情况下，你得到的是普通
    vim 会话周围的系统外壳（chrome），以及一些其他福利。如果你使用标签页（tab pages），它们将被渲染为真实的、可点击的标签，就像在 IDE 中一样。屏幕上可能会有几个按钮。如果你喜欢的话，可以玩玩菜单。我们稍后会提到这些内容。但首先，让我们聊聊设置。


    在整书中，我一直在向你展示你可以对 `.vimrc` 文件所做的更改，这是一个功能强大的设置文件，告诉 vim 如何运行。如果你愿意，可以继续使用该文件来存放所有的
    gvim 特有设置。但有一个更好的方法。你看，当你启动 `gvim` 时，它首先加载你的 `.vimrc` 文件，然后寻找名为 `.gvimrc` 的文件。如果找到了该文件，它也会加载它。如果你没有
    `.gvimrc` 文件，那就结束。这种方法有两个好处。第一，你可以将所有的 gvim 设置放在一个地方，而在处理普通的 vim 工作时无需翻阅它们。第二，当你只加载终端
    vim 时，vim 不必翻阅它们。第三个（好吧，这种方法有三个主要好处）好处是，当你运行 gvim 时，你可以覆盖终端 vim 的设置。


    如果你还没有设置好 `.gvimrc` 文件，可以简单地开始编辑它，并将所有针对 GUI 的特定内容放在新文件中。你问那是什么样的内容呢？正如你预期的那样，你可以进入
    vim 并输入 `:h option-list` 来找到可以设置的所有选项的尽列表。正如你可能预到的，如果你尝试一次处理所有内容，这个列表会让你头疼。


    ### 在 gvim 中设置字体


    这些内容中的大部分是你不需要关心的，但我们要说的是 `guifont`。


    #### 第 1 步：使用字体选择器


    打开 gvim 并在命令行中输入


    ```

    :set guifont=

    ```


    它应该打开你系统的字体选择器。


    #### 第 2 步：找出 Vim 认为的字体


    与其通过尝试错误来让 vim 使用你想要的字体，你可以输入


    ```

    :set guifont?

    ```


    它会告诉你当前使用的是什么字体。我的 gvim 目前显示


    ```

    Andale Mono:h14

    ```


    `h14` 部分正如你预期的，是字体大小。


    #### 第 3 步：在 .gvimrc 中设置字体


    好了，现在你只需要打开 `.gvimrc` 并粘贴你从 `:set guifont?` 命令得到的内容，对吗？嗯，差不多。如果字体名称中有空格（例如，“Andale
    Mono”），你需要用斜杠转义该空格，如下所示：


    ```

    :set guifont=Andale\ Mono:h14

    ```


    搞定了。保存文件，加载它（`:so %` 仍然有效，但如果你在使用 gvim，它可以执行任何操作），你应该看到你的新字体尽显风采了。这为你修改任何其他 GUI
    专用的设置提供了一个模式。如果你想查看许多实用的设置，请查看 `:h gvim`。但在下一章中，我们将玩一个更有有趣的。


    ## 26. 处处菜单！：h menus


    这并不严格来说是 gvim 的东西，但 vim 确实允许你创建自己的菜单。它们在 gvim 中的运行效果比在终端 vim 中*更好*，但它们*可以*在两个地方工作。不过要注意，这比我涵盖过的任何话题都不要那么轻松。


    首先，gvim 在启动时会加载一组标准菜单。你不需要动这些菜单。如果你想动它们，也可以；但那方面你需要自自生。我将涵盖创建一个新菜单的基础知识，然后教你如何在你想的地方、任何地方让它弹出。


