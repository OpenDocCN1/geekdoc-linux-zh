  trans: "\n\n首先，复制第 33 行，然后在下方粘贴两次，以此为你的 vim 知识欢呼三声。这可以通过复制（yank）整行，然后粘贴（put）两次来实现。只要你的光标位于写有\
    \ `- Hip Hip, Hooray!` 的那一行上，这只需四个简单的按键即可完成。只需按下 `yy` 复制整行，然后按两次 `p` 即可粘贴两次。由于复制整行也会复制不可见的换行符，因此你甚至不需要移动光标。\n\
    \n## 单字母大写 vs. 双击模式 (Single Caps vs. Double Taps)\n\n好了，我们已经介绍了两种操作行而非单个字符的方法。让我们再次总结一下。\n\
    \n若要对整行进行操作，你需要将命令*双倍*，例如使用 `cc` 修改整行、`dd` 删除整行、`yy` 复制整行等等。\n\n若要对从光标到行尾的行进行操作，则需要将命令*大写*。因此，`C`\
    \ 删除从光标开始到行尾的内容并让你进入插入模式，`Y` 复制光标之后的所有单词，等等。这里有一个简单的例子。假设我们想去掉下面这一行的半部分，因为它是反序的：\n\
    \n```\n1 Four score and seven years ago years seven and score four\n```\n\n我们只需要将光标放在“ago”一词之后，按下\
    \ `<shift>C` 即可得到：\n\n```\n1 Four score and seven years ago|\n```\n\n输入完句子的剩余部分，生活就会很快好起来。\n\
    \n现在是一个稍微复杂一点的场景：\n\n将这三行有些混乱的文本按正确的顺序排列。这可以通过使用 `dd` 删除位置错误的行（再次强调，这会移除行尾字符，实际上让下一行向上移动一个位置），然后使用\
    \ `p` 将其放回合适的位置。\n\n### 如何通过 `cc`（或 `C`）瞬间让你的生活变得更轻松\n\n编程中有一个常见的场景：你正在声明一个新函数，并想确保所有的大括号从一开始就是匹配的。因此，你设置了声明，在中间留了一个空行，并设置了闭合括号。像这样所示：\n\
    \n```\n1 $scope.awesome = function(arg){\n2 \n3 };\n```\n\n然后你将光标移动到中间那一行……它紧贴着左边界，而这正是你*不*希望它所在：\n\
    \n```\n1 $scope.awesome = function(arg){\n2 |\n3 };\n```\n\n你希望光标从正确的缩进开始，你可能已经开发了数百万种方法来实现这一点。当我刚开始职业生涯时，我会将光标置于那个空行上，按下\
    \ `<enter>` 创建新行，因为那个新行通常会由我使用的 IDE 自动进行正确的缩进，然后回去删除那行缩进不当的行。这个技巧在 vim 中同样有效，但那不是长久之计。\n\
    \n幸运的是，有一个更好的方法：只需将光标置于那个空行上并按下 `cc`（如果你更喜欢的话，也可以用 `C`）。想想你刚刚做了什么：你告诉 vim “删除这一行上的所有内容，并让我进入编辑模式”。vim\
    \ 做到了，它查看上方和下方的行，并且比你做得更好：它让你进入插入模式，且光标已处于正确的缩进位置，准备好编写格式良好的代码：\n\n```\n1 $scope.awesome\
    \ = function(arg){\n2 \t|\n3 };\n```\n\n这只是 vim 展示它对你的爱的另一种方式。注意，这个技巧仅在你开启了以下内容时有效：\n\
    \n```\n1 Filetype indent plugin on\n```\n\n正如我在几个章节前建议过的那样。我告诉过你这会有用处的！\n\n所以，在掌握了这些之后，尽管去弄乱文件的其他部分的移动和删除操作吧。当你对这个过程感到相当熟悉时，让我们进入关于重复这一迷人的话题。\n\
    \n## 7 重复执行操作\n\nvim 的伟大之处之一是，它是为了程序员的工作方式而构建的。我们经常想要跳转到文本中的特定单词或符号，而不是逐行移动；或者我们想用四个新单词替换接下来的四个单词，或其他类似的琐事。这是我们工作的一部分，正如我之前所说过的，vim\
    \ 的核心就是让我们的工作变得轻松。它非常擅长此！\n\n它让工作变得轻松的方法之一，是让我们根据需要*重复*操作，以完成正在进行的任务。\n\n### 使用计数\
    \ (Using Counts)\n\n这通常通过在给 vim 命令之前输入一个数字来实现。例如，假设你想将光标向右移动四个字符。你可以通过输入 `llll`\
    \ 实现，也可以输入 `4l`，这样你就省下了*整整两个按键！*朋友，这可是真金白银。虽然节省两个按键很有用，但你也可以将这个概念应用到许多其他动作和操作上。在示例文档打开\
    \ `counts.txt` 并找到这一行：\n\n```\n6 I am so incredibly stupid, useless, and talented.\n\
    ```\n\n现在，读到这里，你意识到你需要去掉 `stupid, useless and` 这几个词。你可以通过将光标置于单词之前并输入 `dw` 来逐个删除这些单词。但为什么要浪费时间呢？相反，将光标置于“stupid”一词之前并输入\
    \ `3dw`。砰！\n\n```\n6 I am so incredibly.\n```\n\n### 使用文本对象 (Using Text Objects)\n\
    \n有时你不想手动数需要操作的字符数量。你想删除下一个单词，而不需要数它包含多少字母。但 vim 也为许多常见的文本对象提供了快捷键：在 vim 的术语中，文本对象是一组字符。它可以是单个字符、几个字符、一个单词、整行——一直到整个文档。你在上一节中已经在使用文本对象了。当你告诉\
    \ vim `d5l` 时，你是在说：“光标右侧的五个字符构成一个对象。删除它。”如果你告诉它 `d5j`，你是在告诉它接下来的五行构成一个文本对象。\n\n\
    | 快捷键 | 文本对象 |\n| --- | --- |\n| w | 从光标到单词结束 |\n| W | 从光标到单词结束 |\n| s | 当前句子\
    \ |\n| ’ 或 “ | 引号内的字符串 |\n| l | 从光标到行尾 |\n\n还有*很多*其他的，但这些足够让我们开始了。当你将一个*操作符*与*计数*和*动作*结合时，你就有了一个*命令*。\n\
    \n现在让我们练习一下。打开 `counts.txt` 文件并进入第 9 行。这里有四行正*渴望*被删除。让我们完成它们的愿望，只需三个按键。使用**操作符-计数-动作**\
    \ 语法，你只需要输入 `d4j`，这些行就*消失*了。\n\n其实它们并没有消失。你也可以对 `p` 使用计数。我们不确定你什么时候需要多次粘贴多行，但至少值得尝试一下。\n\
    \n### 见证全能的点 (Behold The All-Powerful Dot)\n\n这个特定的技巧与计数毫无关系，但它会经常与计数操作一起使用。`.`\
    \ 字符，这个最简单的字符之一，是你 vim 中最好的朋友之一。它的含义非常简单：它重复你对文本所做的最后一次修改但位于你当前的位置。\n\n"
- fmt: '

    In `counts.txt` there’s a wonderfully contrived example: The simple “Jack and
    Jill” nursery rhyme, but somehow “Jill” got replaced with “Jack”. Which means
    the first line reads


    ```

    1 Jack and Jack went up the hill to fetch a pail of water

    ```


    That’s a good trick, Jack! Let’s fix up the second “Jack” using the change operator.
    Position your cursor after the letter J:


    ```

    1 J|ack

    ```


    And type `cw` (that’s “change everything from where the cursor is to the end of
    the word”). You should now have


    ```

    1 J|

    ```


    And be in insert mode. Type `ill` and hit `<esc>`. Now that the second Jack is
    a Jill, you can read through the rest of the poem and find any other mistakes.
    On the third line it says


    ```

    1 And Jack came tumbling after.

    ```


    Which makes no sense. Slap your cursor down like last time, but instead of typing
    `cw` you can just hit the period button and bam! Your last change is repeated
    with a single keystroke. If you’ve ever had to change all instances of a variable
    name in a file you can readily appreciate how useful this can be. It’s especially
    great when combined with [searches](#chap16.xhtml_searching), but more on that
    later.


    The dot command is a good reason to be selective about what you do in insert mode,
    and how much you do between returns to normal mode.


    ## 8. Moving Around in Vim: Dance Steps


    Now let’s take everything we’ve learned about motion and give it a few last tweaks
    to make it really super useful. There are two text objects that look like they’re
    the same thing but aren’t. The difference between them can either cause you problems
    or make your life better. These text objects are `words` and `WORDS`.


    ### Words and WORDS


    The easiest way to describe a `WORD` is that it’s every character between one
    whitespace and the next. Thus `http://I.am.a.frog.com` is a single `WORD`, even
    though you and I would parse it as six words^(#chap35.xhtml_fn-not-counting).
    The lowercase “word” text object is any uninterrupted series of letters. Thus
    `http://I.am.a.frog.com` is made up of six “word” objects, separated by punctuation
    marks.


    When you compose vim commands, you’ll specify that you want to operate on a “WORD”
    with a `W` and a “word” with a `w`, as you might expect. If you want to play with
    the differences you can check out `motion3.txt`, and have a look at the exercises
    there. Using the url above, you could position the cursor at the beginning of
    the word `frog` and change just that word with the `cw` command. If you wanted
    to change the entire string into something else you could put your cursor at the
    beginning of the line and type `cW` instead.


    But always moving your cursor to the beginning of a text object to operate on
    it is a pain. Vim is smart, and can figure out where word boundaries are even
    if your cursor is in the middle of the word. You just need to tell it what boundaries
    you’re looking for. You can do that with the “inner” and “all” command modifiers.


    ### Inner and All


    As you know, the text object commands `w s l` operate on the current text object
    (either a word, a sentence or a line, respectively. Check the [table](#chap31.xhtml_text-object-table)
    if you need a quick refresher) from your cursor position to the end. But what
    if you’ve got a long word like “Omphaloskepsis^([32](#chap35.xhtml_fn-omph-def))”
    and your cursor is somewhere around the first s? It’s silly to have to move cursor
    back to the initial `O` just to be able to delete the word, and vim has a much
    better way.


    You simply tell vim how to handle the borders of the text object in question and
    what to do with the text object. What constitutes a border depends on the kind
    of text object you’re using. A “WORD” is bordered by whitespace on both sides.
    A “word” is bordered by whatever isn’t a letter on either side. A sentence is
    bordered by a line ending or period. In general, vim works hard to match its concepts
    of borders to what humans think of as borders.


    If you tell vim to operate on an inner text object it will leave the borders alone.
    For example, if I do a `diw` on the word “Galt” in the sentence `Who is John Galt?`
    we are left with `Who is John ?` Which isn’t grammatical, with that question mark
    floating around by itself at the end. However, if I were doing a `ciw` instead
    it would preserve the space between `John` and whatever new last name I want to
    give to Ayn Rand’s character:


    ```

    1 Who is John Punchfist?

    ```


    Much better.


    However, when you’re straight up deleting text, you often want to modify all of
    a text object, spare whitespace included. To do this change the `i` in the previous
    commands to an `a`. If I had said `daw` on John’s last name in the example above
    the resulting sentence would have read `Who is John?` which is perfectly grammatical,
    if a bit vague, and nowhere near as awesome as asking who John Punchfist is.


    You can no doubt see why I wouldn’t want to do `caw` there, because then I would
    have to type that space between “John” and “John”.


    ### Move by Counting


    We’ve already seen the beginning of this concept in the [Using Counts](#chap08.xhtml_counts)
    section, but let’s flesh it out a bit here. Motion commands are still commands,
    and you can tell vim to repeat them just like anything else. This means that you
    can move five words right by simply typing `5w`, or you can move six lines down:
    `6j`. This is often a faster way to get where you’re going than hitting `j j j
    j j`.


    But not always. The reason for this is the human ability called *[subitizing](https://en.wikipedia.org/wiki/Subitizing)*.
    Simply put, we as humans can easily recognize groups of things up to three or
    four without counting them, but once you get above four we slow down considerably.
    In vim terms this means that if you look at a sentence and see that you have to
    move three words right you will just hit `3w` without thinking about it. But if
    you have to move six words right you’re probably counting those words, then entering
    the command, and that’s often slower than just mashing the `w` key six times,
    or (even better) just searching for the exact spot where you need to make your
    changes.

