    \ methods listed for good measure.\n\n*   Opening a new tab:\n\n    *   `:tabnew`\
    \ *filename*\n\n    *   `:tabe` *filename*\n\n*   Close current tab\n\n    * \
    \  `:tabc`\n\n        *   `:tabclose`\n\n        *   Note that both of the above\
    \ methods can take a `!` to force the tab to close even if there are unsaved changes\
    \ in a buffer.\n\n*   Close *all* tabs:\n\n    *   `:qa` (will fail if there are\
