    # Painless Vim


    ### A Sane Person’s Guide to the World’s Most Powerful Editor


    #### Nate Dickson


    This book is for sale at [http://leanpub.com/painless_vim](http://leanpub.com/painless_vim)


    This version was published on 2018-07-30


    ![publisher''s logo](images/leanpub-logo.png)


    * * * * * *


    This is a [Leanpub](http://leanpub.com) book. Leanpub empowers authors and publishers
    with the Lean Publishing process. [Lean Publishing](http://leanpub.com/manifesto)
    is the act of publishing an in-progress ebook using lightweight tools and many
    iterations to get reader feedback, pivot until you have the right book and build
    traction once you do.


    * * * * * *


    © 2013 - 2018 Nate Dickson


    # Table of Contents


    ## Guide


    1. [Begin Reading](#chap00.xhtml)


    # Preface


    ### Why? Why This?


    Look, we’ve all been through this: someone says, “You should learn vim. I did,
    and now I’m 10000% faster at everything and people like me more.” So you download
    the latest version for your OS and start it up and, hey look, there’s that screen
    with a bunch of tildes down the side asking you to donate to kids in Uganda. Just
    like the last time you tried this. You know from experience that typing `:help`
    isn’t going to be super helpful, because you’ll get stuck in the help window and
    you’ll never be able to get it to go away. You start typing and the terminal beeps
    at you or says it’s in some weird mode now or –if you’re lucky– starts putting
    letters on the screen at some point. Then it’s a quick trip to Google to figure
    out how to get back out of `vim`, and you shudder, vowing not to go back.


    It doesn’t have to be this way.


    At its heart, Vim is about making life easier for developers. But most of the
    “beginners” advice you get sounds like there’s a big trial by fire initiation
    that you have to pass before you can get to that programmer’s nirvana. People
    tell you that the “only way” you’ll ever get good at using the power of `vim`
    is to throw your mouse out the window, disable all the hotkeys you’re used to,
    and just spend a few months doing nothing but learning how to use an editor.


    Bless their pointy little heads. It’s true that once you’re good at `vim` you
    will start to see all the system shortcuts and mouse shortcuts as inefficient.
    But when you’re starting out they make it feel like you’re suddenly in a foreign
    country where you don’t speak the language. They mean well, but that sort of initiation
    is exactly wrong for a newcomer. It’s advice like that that is impeding `vim`,
    keeping it from being the editor that everyone uses^([1](#chap35.xhtml_fn-Katz)).


    ### I’m a Stranger Here, Myself


    The fact is, you can learn `vim` at your own pace and be fairly productive with
    it right out of the box. And that’s what this book is about. If `vim` were a foreign
    country, I would be the guy who walks up to you in the hotel lobby and says, “Hey,
    how’s it going? Just get here? I’m a stranger here myself.” And then I would show
    you all the good restaurants and stuff, because I understand what you’re going
    through.


    So instead of lecturing you on learning all the underlying `ex` and `vi` commands
    that you “have to know to truly experience the raw power of `vim` I’m going to
    show you how to get in, get comfortable, and start branching out into bigger and
    better things. I’m going to take it as read that you’re not 100% committed to
    leaving all other text editors behind. Heck, I’d strongly suggest having a copy
    of Sublime Text (more on that later) available for the times where you’re just
    sick to the eye teeth of `vim`. It happens! But come back to `vim`, because I
    plan to show you that `vim` isn’t that hard, and that learning it can be painless.


    # Introduction


    ### Why Learn Vim


    `Vim`, for all its eccentricities, is designed to be fast and developer friendly.
    Smart people have been using and improving it for decades and it’s gotten to the
    point that it’s pretty darn good in the right hands. As a former vim critic who
    has started using it, I can tell you that it is that fast when you get going.
    You can make a surprising number of changes quickly and efficiently in `vim`,
    and once you start navigating, making changes, and issuing commands using just
    the home row keys using anything else will feel clunky by comparison.


    #### It is that fast


    `Vim`, used well, is a speed demon. Once you get used to the slightly weird controls
    every other text editor will feel unwieldy. `Vim` was designed to keep your hands
    where they belong, without using the mouse or the arrow keys.


    Now, like I said before, if you want to use the mouse and arrow keys while you
    get used to `vim`, go right ahead! You’re not being productive if all you’re doing
    is trying to remember how to edit the third character in the line below your cursor.
    But the promise is that eventually you’ll get comfortable with the `vim` way of
    doing things and be much happier. There are other reasons, too:


    #### Vim commands get around


    A lot of unix-y things use the `vim` keybindings for moving around. Even web services
    like gmail use the `h j k l` magic keys to move between emails. If you get comfortable
    with `vim` idioms you’ll be more comfortable with a lot of other tools as well.


    #### Vim itself gets around


    Let’s face it, `vim` is everywhere. If you install git on windows `vim` comes
    along for the ride. If you have a Linux box or a Mac you’ve already got `vim`.
    And if you’re like me^([2](#chap35.xhtml_fn-1)) it’s always slightly bugged you
    that there was this editor on your machine that you don’t like or know how to
    use. If you get comfortable with `vim` then you don’t have to panic when you have
    to enter a commit message from the command line in git.


    ### What This Book Is


    This book aims to be:


    #### Short


    You’ve got better things to do than read books about editors. The main goal of
    this book is to get you comfortable with the editor and feeling like you’re ready
    to move on, bending vim to your wishes. If you’re like me, you get annoyed at
    changes someone forced on you, and you just want to strike out and do it yourself.
    I’ll let you do just that.


    #### Cheap


    `vim` is free. While I don’t want to sell my work for nothing, I’m coming darn
    close. This is a beginner’s book, and my goal is to lower the bar to entry. To
    start with, I’ll price it low and hope that helps you along.


    #### Easy to understand


    `vim` is complex; this book shouldn’t be. My main goal here is to help you build
    confidence and get your feet under you. If you’re reading this during the beta
    period and you’ve got suggestions, please send them on over to me! I’m more than
    willing to listen and change.


    #### Friendly!


    My high horse died a while back, and I never bothered to buy myself a soapbox,
    so I won’t be doing any preaching. Remember that friendly face in the hotel who
    shows you all the great spots in town? That’s this book. I’m not here to judge.


    #### Opinionated (but in a good way)


    I’ll keep the tone friendly, but I got opinions people. There are things I think
    are good and things I think aren’t so good. But I’ll let you know *why* I think
    some things are good or not so good and let you make up your mind on your own.


    #### Lighthearted, but serious


    The tone of the book is meant to be light and approachable, but the advice is
    meant to be rock solid. I’m not going to have you do things to your configuration
    files that I wouldn’t do, even temporarily, or to prove a point. The goal is to
    make it easy for you to get things right ^([3](#chap35.xhtml_fn-2)) the first
    time.


    ### What This Book Isn’t


    This book definitely is not:


    #### The end-all-be-all reference on vim

