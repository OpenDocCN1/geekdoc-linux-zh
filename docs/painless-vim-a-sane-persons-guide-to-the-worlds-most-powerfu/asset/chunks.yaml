    \ done by deleting the line that is in the wrong place (which, again, removes\
    \ the line-ending character, effectively moving the following line up a notch)\
    \ with `dd` and putting it back where it fits with `p`.\n\n### How to Instantly\
    \ Make Your Life Easier with `cc` (or `C`)\n\nThere’s a common scenario in programming.\
    \ You are declaring a new function and you want to make sure all your braces are\
    \ matched from the get-go. So you set up your declaration, put an empty line in\
    \ the middle, and set up your closing braces. Something like this:\n\n```\n1 $scope.awesome\
    \ = function(arg){\n2 \n3 };\n```\n\nAnd then you move your cursor up to that\
    \ middle line and… it’s right up against the left border, where you *don’t* want\
    \ it:\n\n```\n1 $scope.awesome = function(arg){\n2 |\n3 };\n```\n\nYou want your\
    \ cursor to start properly indented, and you have probably developed a million\
    \ ways to make that happen. When I was first starting my coding career I would\
    \ position my cursor on that empty line, hit `<enter>` to create a new line, because\
    \ that new line was usually properly indented by the IDE I was using, then go\
    \ back and delete the improperly-indented line. And that trick will work in vim\
    \ as well, but that’s no way to live.\n\nFortunately there’s a better way: just\
    \ position your cursor on that empty line and hit `cc` (or `C` if you like that\
    \ better). Think about what you just did: you told vim “delete everything on this\
    \ line, and put me in edit mode.” Vim does that, takes a look at the lines above\
    \ and below and does you one better: it puts you in insert mode with your cursor\
    \ properly indented, all ready to write nicely formatted code:\n\n```\n1 $scope.awesome\
    \ = function(arg){\n2 \t|\n3 };\n```\n\nThis is just another way that vim demonstrates\
    \ its love for you. Note that this trick only works if you added the\n\n```\n\
    1 Filetype indent plugin on\n```\n\nLike I suggested a few chapters back. I told\
    \ you it would be good for something!\n\nSo, with all that under your belt go\
    \ ahead and mess up the rest of the file moving and removing lines. When you’re\
    \ feeling fairly comfortable with the process let’s move on to the fascinating\
    \ topic of repetition. ^([27](#chap35.xhtml_fn-Repeating_myself))\n\n## 7\\. Doing\
    \ Things More Than Once\n\nOne of the great things about vim is that it has been\
    \ built for the way programmers work. We often want to jump to a specific word\
    \ or symbol in the text without moving there line by line, or we want to replace\
    \ the next four words with four new words, or other such silliness. It’s part\
    \ of our job, and as I’ve said before, vim is all about making our jobs easier.\
    \ It’s good at it!\n\nPart of how it makes our job easier is by letting us *repeat*\
    \ our actions as many times as we need to accomplish what we’re doing.\n\n###\
    \ Using Counts\n\nThis is usually accomplished by typing a number before you give\
    \ vim a command. For example, let’s say you wanted to move the cursor four characters\
    \ to the right. You could do this by typing `llll` or you could type `4l` and\
    \ you just saved yourself *two whole keystrokes!* That’s money in the bank, friend.\
    \ But as useful as it is to save two whole keystrokes, you can apply this concept\
    \ to a lot of other motions and actions as well. Open up `counts.txt` in the sample\
    \ documents and find this line\n\n```\n6 I am so incredibly stupid, useless, and\
    \ talented.\n```\n\nNow, reading this, you realize that you need to get rid of\
    \ the words `stupid, useless and`. You could delete those three words individually\
    \ by putting your cursor before a word and typing `dw`^([28](#chap35.xhtml_fn-shortly))\
    \ three times, but why waste the time? Instead, put your cursor before the word\
    \ “stupid” and type `3dw`. BAM! Just like that your sentence is much more indicative\
    \ of you as a person:\n\n```\n6 I am so incredibly talented.\n```\n\n### Using\
    \ Text Objects\n\nSometimes you don’t want to manually count how many characters\
    \ you need to operate on. You want to delete the next word without counting how\
    \ many letters are in it. Vim is here for you.\n\nWe’ve already covered part of\
    \ this in a sneaky way in the “[Operating on an Entire Line](#chap07.xhtml_OoaL)”.\
    \ If you double an operator you’re (usually) telling vim to apply it to the line\
    \ as a whole. In this case, “the line as a whole” is what vim calls a *text object*.\n\
    \nIf you’re a programmer you’re probably already familiar with the concept of\
    \ objects: they’re the building blocks of most of the programming we’ve done since\
    \ 1980\\. But I’m going to go ahead and explain objects anyway.\n\nIn vim terms,\
    \ a text object is a set of characters. It can be a single character, a few characters,\
    \ a word, an entire line…all the way up to the entire document. Clever person\
    \ that you are, you’ve already been using text objects in the last section. When\
    \ you tell vim `d5l` what you are telling it is “the five characters to the right\
    \ of the cursor make up a text object. Delete it.” If you told it `d5j` you’d\
    \ be telling it that the next five *lines* constitute a text object whose presence\
    \ is no longer required. But vim also gives us shortcuts for a number of other\
    \ common text objects:\n\nText Object Shortcuts\n\n| Shortcut | Text Object |\n\
    \n| --- | --- |\n\n| w | from the cursor to the end of the word |\n\n| W | from\
    \ the cursor to the end of the WORD^([29](#chap35.xhtml_fn-wordvsWORD)) |\n\n\
    | s | the current sentence |\n\n| ’ or “ | a string surrounded in quotes |\n\n\
    | l | from the cursor to the end of the line |\n\nThere are many *many* others,\
    \ but this will get us going. When you combine an *operator* with a *count* and\
    \ a *motion* you have a *command* ^([30](#chap35.xhtml_fn-count_terminology)).\n\
    \nFor now let’s practice a bit. Open the file `counts.txt` and go to line 9\\\
    . There are four lines here that are just *begging* to be deleted. Let’s fulfill\
    \ their wish, with three keystrokes. Using the **operator-count-motion** syntax\
    \ you can just type `d4j` and those lines are *gone*.\n\nOnly they’re not. You\
    \ can use counts with `p` as well. Go down a few lines and paste them back two\
    \ or three times. We’re not sure when you’d want to paste multiple lines multiple\
    \ times, but it’s worth playing with at the very least.\n\n### Behold The All-Powerful\
    \ Dot\n\nThis particular trick doesn’t have anything to do with counting, but\
    \ it will be used with counted actions a *lot*. The `.` character, that simplest\
    \ of all characters, is one of your best friends in vim. It’s meaning is simple:\
    \ it repeats the last change you made to the text, but at your current position."
