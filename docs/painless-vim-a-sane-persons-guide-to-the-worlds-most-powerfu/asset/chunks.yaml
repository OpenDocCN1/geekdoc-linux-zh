    对于所有其他模式也是如此：`vnoremap` 和 `nnoremap` 的工作方式完全相同。正如你可能猜到的那样，`nore` 代表“无递归”（no recursion），它确保重映射扩展侧的任何内容都不会被求值。通常情况下，建议使用无递归版本，因为它们可以“保护”你免受新插件或你之后添加的其他键位产生意外重映射的影响。


    ## 19. 华丽的插入模式技巧


    在关于模式的章节中，我提到过插入模式的命令较少，因为那是你应该待在的模式——你知道的，就是在那里*插入*东西。但“命令少”绝对是相对的，因为一旦你发现了它们，在插入模式中其实可以做*很多*事情。这就是我大显身场的地方。我想我也可以提一下，vim
    的内置帮助系统对这个主题有很多话可说：只需输入 `:h insert.txt` 即可了解更多。我所说的“更多”是指“**一切**”。至少可以说，帮助系统非常详尽。


    在最后一节中，我简要提到 vim 几乎对所有操作都使用 `<ctrl>` 键。这在插入模式下为为，因为所有的普通键都在执行它们的常规功能。Vim 使用 `<ctrl>`
    键为你提供某些有用函数，例如：


    | 命令 | 结果 |

    | —— | —— |

    | `<ctrl>w` | 删除光标之前的*单词* |

    | `<ctrl>u` | 删除光标之前的*行*。 |

    | `<ctrl>t` | 按 `shiftwidth` *增加*行缩进^([61]](#chap35.xhtml_fn-shiftwidth)) |

    | `<ctrl>d` | *减小*行缩进 |

    | `<ctrl>n` | 查找下一个补全建议 |

    | `<ctrl>x` | 噢。我等会儿会介绍 `^x`。 |

    | `<ctrl>r` | 插入寄存器的内容。稍后会介绍这意味着什么。 |


    ### `<ctrl>x` 冒险


    从技术上讲，`<ctrl>x` 将你带入一个恰好被称为“CTRL-X”模式的子模式。该模式下可用的命令大部分是*补全*命令；即 vim 版自动补全。我们将尝试其中一些命令，但
    CTRL-X 模式并不是像这本书这种“无痛”书籍的范畴。我不会深入探讨，而是会将你引导向该领域的专家。


    不过，现在让我们在 CTRL-X 模式下玩玩几个简单的命令。第一个是听起来很酷的“全补全”（omni complete），你通过输入 `<ctrl>x <ctrl>o`
    来访问它。


    ### `<ctrl>r` 乐趣


    `<ctrl>r` 命令提供了一种简单的方法，从你的任何寄存器中粘贴信息。只需输入 `<ctrl>r` 和你想粘贴的寄存器名称即可。所以 `<ctrl>r
    a` 就会在你光标所在的位置提供 `"a` 的内容。本质上，这一切只是节省了你回到普通模式的旅程。


    在大多数情况下，这是一个简单的概念，我们主要在寄存器章节中涵盖了它。但 `<ctrl>r` 还有其他压箱底的技巧。好吧，我们在这里还要玩的另一个技巧是在是从*表达式寄存器*中粘贴。


    表达式寄存器基本上顾名其实义：你可以给它一个表达式，当你粘贴它时，它会给你该表达式的结果。更棒的是，vim 会让你在单一步内完成所有操作，且完全在插入模式下进行。你只需要输入
    `<ctrl>r=` 和你想要求值的表达式。你可以执行像 `<ctrl>r=40+2` 这样简单的表达式，它会将预期的结果直接落在你光标所在的位置。但等等，还有！（总是有更多。）表达式寄存器不仅处理*数学*表达式。你还可以让它处理*程序化*表达式！


    但本书里不如此。表达式是强大且有趣的，但绝对不无痛。因此，如果你想增强表达式知识，我将引导你通过其他资源来查看。


    ### 补全！


    这是 vim 努力尝试的地方之一，保佑它的灵魂吧，但它并不是最好的。我知道说这样会被比我懂得多的 vim 高人戳穿，但事实就是如此。


    Vim 会遍历打开的文件并找到你写过的单词，建立一个很不错的索引。当你在插入模式下按下 `<ctrl>n` 时，它会尽力弄清楚你已经在文档中输入过哪些你可能正在再次输入的单词。如果有多种可能，它会给你一个所有潜在匹配项的列表。再次按下
    `<ctrl>n` 移动到列表中的每个新项目，当你找到想要的项目时，再次开始输入。


    当你必须反复输入长长的变量或方法名时，这超级有用。通常你可以输入前几个字母，然后只需按 `<ctrl>n` 即可完成输入。这是帮助你清理代码的另一种方法。像
    JavaScript 这样的动态语言则没有这种帮助。


    ## 20. Vim 窗口并不微软


    好了，是时候看看 vim 到底有多不可怕了。注意，在本章中我将开始使用查看 `:help` 的命令并注意到你可以关闭帮助窗口，但你仍然某种程度上听命于它的安排。让我们聊聊
    vim 窗口是如何工作的，以及它们有多么不是问题。


    ### 打开和关闭窗口


    我们已经提到过如何*去掉*一个窗口：只需用 `:q` 命令“退出”它（记住 `ZZ` 和 `ZQ` 同样有效）。但如果你*想要*一个新窗口呢？也很简单。你可以使用
    `:sp` 命令将当前的编辑器窗口“拆分”为两个窗口。当你这样做时，你会发现两个窗口都在查看同一个文件 ^([62]](#chap35.xhtml_file-buffer-redux)).关键在于，你可以使用所有常规命令在任何窗口中更改编辑的文件：`:e`
    完全正常，如果你在插件章节安装了 NERDTree，那么 NERDTree 将让你在最近使用的窗口中导航和编辑文件。正如你可能猜到的，NERDTree 本身打开了一个长窗口。


    这引出了更有趣的可能性：你可以打开不同形状和大小的窗口吗？你可以更改已经打开窗口的大小吗？这些问题的答案都是肯定的，但我们稍后会讨论。现在我们需要查看如何在窗口之间跳转。


    ### 窗口命令以 `<ctrl>w` 开始


    除了打开或关闭窗口外，你想对窗口做的几乎任何操作都可以通过按下 `<ctrl>w` 然后输入所需的命令来实现。这个命令明显的逻辑记忆法是“控制窗口！”，这是微软一直试图做的事^([63]](#chap35.xhtml_fn-rimshot)).


    ### 移动窗口 `:h window-move-cursor`


