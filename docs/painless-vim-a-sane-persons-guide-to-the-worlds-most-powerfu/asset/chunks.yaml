    偶尔你可能想要快速轻松地从一个地方到另一个地方，而不需要计数、不需要搜索，不需要做任何事情，只需告诉 vim 你想去哪里，并说声“非常感谢”。这就像浏览器中的书签，但它是针对文本文件的。这正是
    `marks`（标记）的用处。


    标记只是指向文件中某一行的指针。如果你在文件的第七行设置了一个标记，它就会停留在那里，为你提供了一个快速返回第七行的方便方法。但 vim 不会留下那种无聊或未开发的东西。


    标记大致分为两类：`lowercase`（小写）标记和 `uppercase`（大写）或 `file`（文件）标记。两者之间明显的区别在于你引用标记的方式。重要的区别在于，小写标记局限于单个文件内的行，而大写标记可以自由跳转到`any`
    文件的任何一行。这两种类型的标记工作方式非常相似，只有细微的。让我们先来看看如何使用小写标记。


    在普通模式（normal mode）下，输入 `m` 后跟一个字母即可设置标记。就是如此！除非你以后想`back`（回到）那个标记。那样就需要多做一点。返回标记有两种方法。如果你想回到设置标记时所在的精确字符和精确行，输入反引号（通常与
    `~` 键同源，就在键盘上数字 1 的旁边）和字母。所以，如果你在第 5 行设置了标记 `a`，你就可以去文件中的任何地方，然后通过输入以下命令跳回第 5
    行：


    ```

    1 `a

    ```


    如果你只想到达设置标记的那个`line`（行），你可以使用单引号（与双引号同键，在回车键旁边）和字母。要回到文件开头的的第 5 行，你只需要输入：


    ```

    1 ''a

    ```


    这样就搞定了。但等一下，还有更多！（总会有更多。）每当你跳转到一个标记时，vim 都会记住你从*from*（从哪里）跳转过来，并将其存储为特殊标记 `’`。所以你可以用
    `a` 标记跳转到第 5 行，进行修改，然后只需按两次单引号键，你就回到了起点。


    自然地，你可以对 `a` 到 `z` 之间的任何字母执行此操作，这意味着你可以在处理的任何文件中设置二十六个标记。但当你正在处理一组文件时呢？这就是大写标记大显身手的地方。


    大写标记的行为与小写标记相同，但有一个显著的例外：它们允许你轻松地从一个文件跳转到另一个文件。和小写标记一样，大写标记设置在文件的特定字符上，这意味着你不仅可以一动作完成从
    `sample.c` 到 `sample.h` 的跳转，还可以从任何地方直接跳转到 `sample.h` 的第 471 行。虽然写 C 代码很有趣，但让我们来聊一个对世界上每个
    vim 用户都立即有用的大写标记。这是一个你绝对会想做的练习。


    *   在 vim 中打开你的 `.vimrc` 文件。

    *   输入 `mV`

    *   在 vim 中打开任何其他文件。

    *   输入 `''V`


    砰！你现在可以随时随地从任何地方进入你的 `.vimrc` 配置文件。虽然你最终会停止每天折腾你的配置，但在最初学习并配置 vim 让它为你服务而不是反对你时，这个特定的标记可以为你节省大量时间。


    ## 9. 终于谈到了模式


    鉴于模式是 vim 的不可分割的一部分，鉴于理解模式对于用好 vim 至关重要，为什么我决定把关于 vim 模式的章节推到文本后后部分呢？


    有几个原因。第一个原因是我相信在做中学习。到目前，在普通模式和插入模式之间切换应该已经相当熟悉了，所以这个概念看起来并不陌生。现在你准备好学习更多了。那么，废话不多说，让我们进入
    vim 的模式化本质。这通常是让人们望而却步的东西所以我们会轻松一点，记得呼吸。记住：你已经在使用这些东西了，我们只是在给你已经正在做的事情命名。


    ### 什么是模式


    认为模式最简单的思考方式是，它们改变了你的键盘。在`insert`（插入）模式下，按键在屏幕上显示字母，就像普通的文字处理器一样。但当你切换到不同的模式时，你的按键就从“字母输入器”变成了“命令制造器”。`h
    j k l` 键从四个字母变成了箭头键，`..` 从句号变成了“重做”按钮，依此类推。到目前为止一切都好。你已经使用这两种模式一段时间了，这些都不太意外。你不知道的是，你其实也在使用其他一些模式，现在既然我提到了它们，我将抓狂地先回到讨论普通模式和插入模式，然后再谈论另外你从未知道自己正在使用的两种模式。


    ### 到底什么是普通模式？


    在道格拉斯·亚当斯的《银河系漫游指南》系列第五本书《宇宙无害》（Mostly Harmless）中，有一种被称为“完全正常的野兽”的动物，它们会突然出现在平原的一侧。它们被称为“完全正常的野兽”，是因为有人足够聪明，意识到称呼它们有助于人们接受它们不可能的行为只是某种*happens*（发生）的事情。


    vim 的普通模式几乎完全不同，但有一个相似的概念在起。如你所知，`normal`（普通）模式是你发布命令的地方，而不是编辑文本的地方。大多数 vim 新手觉得这极其讽刺。毕竟，vim
    是一个`text`（文本）编辑器，而不是`command`（命令）编辑器。编辑文本不应该是“正常”模式，而“通过计数和动作做怪事”应该是“特殊”模式吗？


    在 vim 的逻辑里，答案是“不”。如果你思考你是如何写作的就会明白为什么。在软件开发中，你并不只是坐下来，以每分钟 80 字的速度敲 8 小时代码然后回家，就算工作出色了。软件开发是*增量地*（incrementally）和*迭代地*（iteratively），大部分时间花在观察各种方法和变量之间的关联性上。你写一个函数头，在大括号之间留出一些空间作为函数体，发现你忘记了一个需要的参数，加上它，写一些函数代码，发现你需要调用一个尚未编写的新函数，给它写个占位符（dummy），然后依此类推。编码并不那么像*writing*（写作），而更像*drawing*（绘画）。


    当你画画时，你从一些引导线开始，用椭圆表示脸，并带有交叉线提供维度。背景和景致的粗略轮廓被勾勒出来，然后一点一点，一行一行，这些粗略轮廓被不断添加、完善并变成成品。很难说它们是在哪里完成飞跃的，但在你所有那些看似互不关联的线条中，一件艺术品诞生了。


    代码也是一样。我们一行又一行添加代码，有时会放入只会存在一会的脚架代码，当它们支撑的逻辑可以独立存在时，就会被丢弃。很难说是什么时候，但在过程的某个时刻，那堆看似随机的代码行变成了一个成品。


