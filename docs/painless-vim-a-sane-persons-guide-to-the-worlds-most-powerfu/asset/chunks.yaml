    ![](img/title_page.png)


    ![无痛 Vim](img/title_page.png)


    # 无痛 Vim (Painless Vim)


    ### 给理智人士的最强大编辑器指南


    #### Nate Dickson


    本书可在 [`leanpub.com/painless_vim`](http://leanpub.com/painless_vim) 购买


    此版本发布于 2018-07-30


    ![出版商标志](img/leanpub-logo.png)


    * * * * * *


    这是一本 [Leanpub](http://leanpub.com) 的书。Leanpub 通过精益出版（Lean Publishing）流程为作者和出版者赋能。[精益出版](http://leanpub.com/manifesto)
    是使用轻量级工具和多次迭代来出版进行中的电子书，以获取读者反馈，不断调整直到你拥有正确的书籍，并在之后建立吸引力。


    * * * * * *


    © 2013 - 2018 Nate Dickson


    # 目录


    ## 指南


    1. 开始阅读


    # 前言


    ### 为什么？为什么是这个？


    听着，我们都经历过这种：有人说，“你应该学 vim。我学了，现在我做任何事情都快了 10000%，人们更喜欢我。”于是你为你的操作系统下载了最新版本并启动它，然后嘿，看，出现了一个满是波浪号的屏幕，要求你向乌干达的孩子捐款。就像你上次尝试时一样。你凭经验知道输入
    `:help` 并不会有多大帮助，因为你会卡在帮助窗口里永远无法让它消失。你开始打字，终端对你鸣叫，或者说它现在处于某种奇怪的模式，或者如果你运气好的话——某个时刻开始在屏幕上显示字母。然后你快速奔向
    Google 寻找如何退出 `vim`，你打了个冷颤，发誓再也不回去了。


    情况没必如此。


    Vim 的核心是让开发者的生活更轻松。但大多数给“初学者”的建议听起来就像你必须通过一场重大的火火入礼仪式，才能到达那个程序员的涅槃境界。人们告诉你，想要真正掌握
    `vim` 力量的“唯一方法”就是把鼠标扔出窗外，禁用你习惯的所有热键，然后只花几个月时间学习如何使用编辑器，什么都不做。


    保佑他们的小脑袋脑袋吧。确实，一旦你精通了 `vim`，你就会觉得所有的系统快捷键和鼠标快捷都是低效的。但当你刚开始时，它们让你觉得突然进入了一个你听不懂语言的异国。他们的本意是好的，但那种仪式对于新手来说完全是错误的。正是这种建议阻碍了
    `vim`，使其无法成为所有人使用的编辑器^(1)。


    ### 我也是个陌生人


    事实是，你可以按照自己的节奏学习 `vim`，并且开箱即用就能相当高效。这正是本书的主题。如果 `vim` 是一个异国，我就是那个在酒店大堂走向你并说，“嘿，怎么样？刚到这？我自己也是个陌生人。”然后我会向你展示所有的好饭馆之类的，因为我理解你正在经历什么。


    所以，我不会教训你学习所有底层的 `ex` 和 `vi` 命令（你认为“为了真正体验 `vim` 的原始力量你必须知道它们”），我将向你展示如何进入、如何适应并开始向更大、更好的领域扩展。我会假定你并没有
    100% 致力于放弃所有其他文本编辑器。老实，我强烈建议准备一份 Sublime Text 的副本（稍后会详述），以备在某些你对 `vim` 厌恶骨底的时候。这种情况会发生！但请回到
    `vim` 上，因为我计划向你证明 `vim` 并没有那么难，学习它是可以无痛的。


    # 引言


    ### 为什么要学 Vim


    `Vim` 尽管有很多怪癖，但它的设计初衷是快速且对开发者友好。聪明人已经使用并改进了它十年，它已经到了在对的人手里变得非常棒的地步。作为一名开始使用它的前
    `vim` 批评者，我可以告诉你，一旦你进入状态，它确实那么快。你可以在 `vim` 中快速高效地完成惊人数量的修改，一旦你开始仅使用主行键进行导航、修改和发布命令，相比之下使用任何其他工具都会显得笨拙。


    #### 它确实那么快


    用得好的 `Vim` 是一个速度魔。一旦你习惯了这种略微奇怪的控制，其他任何文本编辑器都会显得笨重。`Vim` 的设计是为了让你的手留在它们该在的地方，而不使用鼠标或方向键。


    现在，正如我之前所说，如果你在习惯 `vim` 的期间想使用鼠标和方向键，尽管去用！如果你只是在试图记住如何编辑光标下方一行的第三个字符，你并没有在提高生产力。但承诺是，最终你会习惯
    `vim` 的做事方式，并变得快乐得多。还有其他原因：


    #### Vim 命令无处可见


    很多 Unix 风格的东西使用 `vim` 键绑定进行移动。甚至像 Gmail 这样的 Web 服务也使用 `h j k l` 魔法键在邮件之间进行切换。如果你熟悉了
    `vim` 的惯用法，你对许多其他工具也会更加熟悉。


    #### Vim 本身无处可见


    面对吧，`vim` 无处不在。如果你在 Windows 上安装 git，`vim` 会随之而来。如果你有一台 Linux 设备或 Mac，你已经有了 `vim`。如果你像我一样^(2)，这总会稍微困扰你，你的机器上有一个你不喜欢或不知道如何使用的编辑器。如果你熟悉了
    `vim`，那么当你需要在 git 命令行中输入提交信息时，你就不必恐慌了。


    ### 这本书关于什么


    本书的目标是：


    #### 简短


    你有比读编辑器的书更重要的事情要做。本书的主要目标是让你熟悉这个编辑器，并觉得你准备好进入下一步，让 `vim` 服从你的意愿。如果你像我一样，你会对别人强加给你的改变感到恼恼，只想亲力而为。我会让你如愿。


    #### 廉价


    `vim` 是免费的。虽然我不想白卖我的作品，但我已经快做到这一点了。这是一本给初学者的书，我的目标是降低入门门槛。首先，我会把它定价得很低，希望这对你有所帮助。


    #### 易于理解


    `vim` 是复杂的；但这本书不应该是。我在这里的主要目标是帮助你建立信心并站稳脚跟。如果你在测试期间阅读此书并有建议，请发送给我！我非常愿意听取并改进。


    #### 友好！


    我的高架子早就死掉了，我也从没忙过给自己买个讲台，所以我不会进行任何说教。记得酒店里那个向你展示城市里所有棒地点的友好面孔吗？那就是这本书。我不是来评判的。


    #### 有观点（但是从好的角度出发）


    我会保持友好的语气，但我确实有观点。有些事情我觉得是好的，有些事情我觉得没那么好。但我会告诉你*为什么*我认为某些事情好或不好，并让你自己做主。


    #### 轻松但严肃


    本书的语调旨在是轻松且平易近人的，但建议应该是坚如磐石的。我不会让你在配置文件中做任何我不会做的事情（即使是暂时的），或者为了证明某个观点。目标是让你第一次就做对^(3)。


    ### 这本书不是什么


    本书绝对不是：


    #### 关于 vim 的终极参考


