    \ 3: Sample `.vimrc` files\n\nThis section gives you a look at a couple of simple\
    \ (but functional) `.vimrc` files, with annotations. Note that these aren’t *my*\
    \ `.vimrc` file, although they are more or less *based* on mine. These are intended\
    \ to be simple starting points from which you can get ideas. You could use these\
    \ for a while, tweak them, and to get where you’ve got something you’re happy\
    \ with over time.\n\nIf you want to see what I’m using right now you can view\
    \ it on [GitHub](https://github.com/PogiNate/dots/blob/master/home/.vimrc). I\
    \ try to back it up regularly. You could theoretically copy mine directly, but\
    \ it’s got a lot of things in it that you don’t need, unless you’re one of the\
    \ five other people on Earth who do XQquery development for a living.\n\nFor that\
    \ matter, if you’re not keeping your `.vimrc` and other files backed up on an\
    \ online service, now would be a good time to start. There are few things more\
    \ frustrating than realizing all your customizations have just disappeared without\
    \ a trace.\n\nOkay, without further ado, the absolute simplest, basic sample file\
    \ that I would actually use:\n\n* * *\n\n```\n 1 \"This tells vim to only run\
    \ as VIM, not as vi\"\n 2 set nocompatible\t\t\n 3 \"Remember that it has to be\
    \ in your ~/.vim/colors folder\"\n 4 colorscheme jellybeans \t\n 5 \"Displays\
    \ line numbers down the left side of the screen\"\n 6 set nu\t\t\t\t\n 7 \"Change\
    \ the <leader> key to comma instead of \\ \"\n 8 let mapleader=\",\"\t\t\n 9 \"\
    enable syntax highlighting\"\n10 syntax on\t\t\t\t\n11 \"Handle things like indents\
    \ and plugins intelligently.\" \n12 filetype plugin indent on\t\n13 \n14 \"Make\
    \ the Backspace Sane\"\n15 \"The Backspace in vim is weird by default.\"\n16 \"\
    This makes it behave the way you expect.\"\n17 set backspace=2\n18 \"More backspace\
    \ sanity\"\n19 set backspace=indent,eol,start \n20 \n21 \" Pathogen settings\"\
    \n22 \" This line tells vim to load all your Pathogen-installed plugins.\"\n23\
    \ \"Naturally, Pathogen needs to be installed before this works.\"\n24 execute\
    \ pathogen#infect() \n```\n\n```\n 1 \"This tells vim to only run as VIM, not\
