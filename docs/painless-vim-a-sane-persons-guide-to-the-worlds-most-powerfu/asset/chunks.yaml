    \ on [GitHub](https://github.com/tpope/vim-markdown). See the chapter on [plugins](#chap11.xhtml_plugins)\
    \ for a refresher on how to install it.\n\nLater on we’re going to talk about\
    \ actually *exporting* your markdown-style text to something pretty and fully\
    \ formatted, so let’s install the software we need for that now, while we’ve already\
    \ got our hands dirty.\n\n[MultiMarkdown](http://fletcherpenney.net/multimarkdown/)\
    \ is my converter of choice. It runs on any desktop OS, adeptly converts Markdown\
    \ and MultiMarkdown into a variety of formats, and is free and frequently updated.\n\
    \nOnce you’ve got mmd up and running it’s time to set vim up in writing mode instead\
    \ of coding mode.\n\n### Writer-Friendly Vim Settings\n\nOne of the great benefits\
    \ of using vim as your main writing tool is that it is one of the original distraction\
    \ free writing programs. Open vim up full screen and you have nothing to do but\
    \ write. But there are a few settings we need to tweak to get started.\n\nThe\
    \ first is line wrapping. When you’re programming you usually want each line to\
    \ stay on its own line, so you can make sure things line up or whatever. When\
    \ you’re writing prose, not so much. Fortunately, vim has a line-wrapping feature,\
    \ and it’s easy to use. But you’ll need to make some decisions ahead of time.\n\
    \nThe main decision is if you want wrapping on all the time or only occasionally.\
    \ If you are using vim primarily as a code editor you probably want line wrapping\
    \ off by default. If you’re using it as a text editor you probably want it on.\
    \ Since we’re talking about literary vim right now we’ll go with line wrapping\
    \ on, and then talk about how to toggle it easily.\n\nIn order for vim to handle\
    \ line wrapping intelligently you need to set a few flags in your `.vimrc`:\n\n\
    ```\n1 set wrap\n2 set linebreak\n3 set nolist\n```\n\nThe first one is obvious:\
    \ we want it to wrap. The second one tells vim to break lines at one of a list\
    \ of line break characters instead of just saying “okay! That’s 80 columns! Next\
    \ character goes on the next line!”. It’s the difference between this:\n\n```\n\
    1 Here I am on line one. This is a good line. I wo\n2 nder when I will hit line\
    \ two?\n```\n\nAnd this:\n\n```\n1 Here I am on line one. This is a good line.\
    \ I \n2 wonder when I will hit line two?\n```\n\nYou can check out `:h linebreak”\
    \ for more information on what characters trigger a line break and how it all\
    \ works. But for now we’ll just stick with the stock answer: it works very well.\n\
    \nThe next thing to say about `wrap` and `linebreak` is that they insert *soft*\
    \ line breaks instead of *hard* line breaks. A *hard* line break is like actually\
    \ hitting the `<enter>` key, a *soft* line break only visually moves your text\
    \ onto the next line. If you make your vim window wider the text will re-flow\
    \ to the end of the new wider window. If you’re writing in Markdown you absolutely\
    \ want soft line breaks, as the Markdown parser will format your text appropriately\
    \ when you run it.\n\nSo, what about `nolist`? We turn it off is because `list`\
    \ breaks wrap and line break. You can read more about it in the help file: `:h\
    \ list`, but for now let’s just turn it off.\n\nOkay, so now vim is all ready\
    \ to write! But what if we want to go back to coding? What if we suddenly hate\
    \ line wrapping? Good question. Let’s add one more line to our `.vimrc` to let\
    \ us turn line wrapping off anytime we want:\n\n```\n1 nnoremap <F7> :set wrap!<CR>\n\
    ```\n\nThe purpose of this command should be fairly obvious. You could map it\
    \ to something like `<leader>w` if you wanted, but I find that using the `<Fn>`\
    \ keys for toggling vim behaviors works for me.\n\n### Spreading the Word: How\
    \ to Get Your Message Out Into the World\n\nAt length, it will be time for your\
    \ words to leave the warm embrace of your computer and fend for themselves out\
    \ in the real world. It’s a proud and terrifying time. If you’re publishing your\
    \ opus via some awesome markdown-aware self publishing site like, say, [Leanpub](http://leanpub.com)\
    \ then your work is pretty much done. Follow their instructions for getting your\
    \ text on their servers and sit back, a job well done.\n\nHowever, if you’re using\
    \ *any other method* of publication we’ve still got some work to do. The reason\
    \ we wrote in Markdown is because your text can now be converted into whatever\
    \ format you need, be it PDF, HTML, DOCX, or some other combination of letters.\
    \ This is where `mmd` comes into play. Let’s take this very simply to begin with.\
    \ You can practice on the `literary.md` file in the sample files repository.\n\
    \nOkay, let’s say you need to convert your text into an HTML page^([75](#chap35.xhtml_fn-whyhtml)).\
    \ All we have to do is this:\n\n```\n1 mmd literary.md\n```\n\nAnd just like that\
    \ you’ve got a new HTML page right next to your markdown file. If you pop that\
    \ page open in a browser you will see that all your text formatting, like tables,\
    \ italics, bolds, footnotes etc. are there, but precious little other formatting\
    \ is.\n\nThis is because we haven’t told MultiMarkdown what fonts, colors, justifications\
    \ etc. to use. And while you *could* do that by giving it a stylesheet you want\
    \ used with your output, I would recommend against doing so. Once you’ve got a\
    \ basic formatted version of your text you have a couple of options:\n\n*   Turn\
    \ it over to a publisher and use their formatting\n\n*   Take a pass at your text\
    \ with a word processor or other program that handles customizable text formatting.\n\
    \nWhile you were writing it was time to get your words out into the open, get\
    \ them down in bits so that you wouldn’t forget them. Now it’s time to polish\
    \ them up, make them look as good as possible for whatever format you choose,\
    \ and you should really take the time to do that by hand.\n\n### More Formats!\
    \ I Need More Formats!\n\nThe official MultiMarkdown program can convert your\
    \ text into a list of formats that is impressive, but if you’re like most people\
    \ you’re going to notice a couple of glaring omissions. Where, for example, is\
    \ the option to create a `.docx` file for Word, or a PDF file?"
