    好的，就像我们之前做的那样，让我们再次启动帮助程序，看看它能用做什么。当你输入 `:h` 时，你会注意到有很多词被高亮了，比如从文本某部分到另一部分的 `links`（链接），或者说所谓的“超链接”。你说得对，它们确实就是如此。将光标置于其中一个链接上并输入
    `<ctrl>]`，即可跳转到该链接引用的部分。实际上，帮助查看器只是向你显示一个特殊格式的文本文件，根据 vim 帮助文件的晦涩规则对内容进行着、居中和链接。如果你以后编写
    vim 插件，那么最好学习这种语言，但现在我们先忽略它。帮助魔术的另一半在于它打开了一个新的 `window`（窗口），这个概念我们很快就会介绍。现在，你只需要知道，可以通过输入
    `<ctrl>w` 和方向从一个窗口跳转到另一个窗口。由于帮助窗口在你的编辑器窗口上方打开，你输入 `<ctrl>w j`，光标就会跳转到你的编辑器窗口。输入
    `<ctrl>w k` 你就回到了帮助窗口。


    ### 获取你需要的帮助


    Vim 的帮助系统只有在你知道如何向它提问时才能变得 `helpful`。vim 文档的维护者根据你可以使用它的 `mode`（模式）贴心地将帮助主题分离开来，而
    vim 让这种搜索变得非常简单。我可以列出查看帮助文档各个部分所需的前缀列表，但何必重造轮子呢？Vim 可以自己完成这一切；事实上，如果你之前在查看帮助文档时稍微移动一下，你可能已经看到了我们正在寻找的文档。


    如果没有，让我们现在进入文档。在普通模式下按下 `:h`，找到显示“get specific help”（获取特定帮助）的那一行，并将光标置在该行上。现在输入
    `zt`，你应该能看到`exactly` 正我们要找的内容：一个你可以用于查看插入模式、可视模式、选项以及其他所有命令的前缀列表。让我们查一个插入模式命令，就因为我们可以这样做。帮助搜索功能是不区分大小写的；所以你可以输入全小写，它也能正常工作。让我们查一下
    `<ctrl>-r`，因为它是一个功能强大的插入模式函数。在普通模式下只需输入：


    ```

    1 :h i_ctrl-r

    ```


    你就会得到一些关于如何在插入模式下使用 registers 的有用信息。按下 `ZZ` 关闭帮助窗口，让我们继续吧！


    ### 帮助系统相对浅显的秘密


    vim 帮助文件仅仅是纯文本文件的集合^(51)，这并不意外。当你输入 `:h [something]` 时，你正在启动 vim 内置的帮助文件搜索引擎。它（默认情况下）并不进行全文搜索；而是根据每个章节开头的特殊格式标签进行搜索。但你也可以用其他方式使用它。


    例如，你可以使用全名搜索 vim 帮助文件。输入 `:h insert.txt`，你将看到完整的插入模式帮助文档，带有它自己的目录等一切。值得注意的是，`sometimes`
    你可以在不带扩展名的情况下搜索内容并到达相同的地方。例如，如果你输入 `:h cmdline`，你会得到 `cmdline.txt` 文件，就像你输入了 `h:cmdline.txt`
    一样。然而，对“insert”尝试同样的操作，你会得到不同的结果。试试看：输入不带 `.txt` 扩展名的 `:h insert`，你仍然会进入插入模式帮助文件，但你不会位于目录处，而是进入“第
    8 章：插入模式命令”。这通常是你只想寻找关于“insert”的帮助时想要的，但它说明了一个点：如果你使用 `.txt` 文件扩展名搜索，你会被带到文件顶部；如果你不带文件扩展名搜索，你会被带到
    vim 认为与你的搜索词最匹配的内容。


    vim 帮助文件的开放性质使得插件很容易包含自己的帮助文件，而且大多数插件都是如此。如果你在 Plugins 中安装了 pathogen，你可以输入 `:h
    pathogen<enter>` 并查看该插件的帮助文件。


    所以，这些都很好。但如果你并不`know` 你在找什么呢？别担心。你只需要输入 `:h` 和你想找的单词，然后不要按 `<enter>`，而是按下 `<ctrl>d`，你会得到一个与你目前输入的内容匹配的主题列表。一旦你找到了看起来是你想要的，只需完成术语的输入即可继续你的操作。


    例如，假设你正在寻找 `yank` 命令的帮助，但你不记得它叫什么了。你只知道它以“y”开头。好的，我们可以处理这个。输入 `:h y<ctrl>d`，vim
    将给你列出一个包含字母 y 的主题列表。这是一个极其庞大的列表。如果你能记住下一个元音（那是为了接下来的 home 说的），你就可以缩小范围。好吧，那不是最好的例子。但当你尝试搜索某些东西（因此输入
    `:h git<ctrl>d`）或某些路径（因此输入 `:h path<ctrl>d`）时，这会带你到达你想去的地方。


    ## 17. 以 Vim 的速度做事


    我知道我在开始时承诺过不进行讲座，所以为了给我自己辩护，我要说这不是讲座。这是一次 `explanation`（解释）。完全不同。这里绝对不是在说教。


    有人问过我：“‘这种方法’为什么比我习惯的方法要好？为什么 `:w` 比 `<ctrl>s` ‘更好’呢？”


    这是一个合理的问题。如果你想按照你习惯的方式做事，你可以轻松地使用 gvim、MacVim 或任何其他图形克隆版本；它们都倾向于使用操作系统的默认设置，所以你完全不需要改变记忆。


    那么为什么要学习一种新方法呢？答案只有一个词：**Ergonomics**（人体工程学）。大多数键盘上的特殊键很难用，因为它们在我们开始使用计算机时是额外附加在标准打字机键盘上的。因此，当你必须使用它们时，它们往往会慢你的速度。让我们看看上面提到的经典例子：`<ctrl>s`^(52)
    与 `:e`。从按键次数来看，`<ctrl>s` 胜了。它只需要两个键就能保存文件，而 `:e` 则是：


    1. `<shift>`

    2. `;`

    3. `e`

    4. `<enter>`


    你必须按下四个不同的键，而不是只有两个！这简直太浪费了！


    除了一外：这四个键都在键盘正中央，你不需要移动手就能触到；而 `<ctrl>` 键在下方的特殊键贫民窟，迫使你移动手去触碰。如果一个命令需要多个那些特殊键，你就得玩起“键盘扭曲游戏”，才能够到像
    `<alt><ctrl>5` 这样的键。


    鼠标更糟。每当你去拿鼠标，你的手至少要移动六英寸，然后找到光标，将其定位在某些字符上或之间，尝试用肉眼观察位置，然后伸手按某些键盘快捷键（仅限左手）执行某些操作，最后把手收回键盘并重新找到位置，然后继续。


    而你，这个优秀又有才华的人，每天都这样做几十次，快速且高效，通常甚至没有察觉。但 vim 的承诺是，*你不再需要这样做了*。


