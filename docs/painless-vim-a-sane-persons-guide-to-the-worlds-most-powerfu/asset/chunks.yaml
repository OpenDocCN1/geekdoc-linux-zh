    Vim 确实允许你使用正则表达式（或者用那些永远没法搞清楚“regexp”该怎么读的人口中称呼的“regexes”）来执行搜索和替换。所以，这是一个好消息。坏消息是，vim
    使用的正则表达式引擎与你见过的任何引擎都不一样。


    它的开始看起来很正常。如果你想搜索并替换一个单词，只需输入 `:s`，后面跟上常用的正则表达式替换语法：


    ```

    1 :s/old/new

    ```


    然后行中的下一个 `old` 单词就会被替换为 `new`。很简单，对吧？好的，让我们再进一步。现在，你不希望在当前行的任何地方出现 `old` 单词。在这种情况下，只需在字符串末尾加上字母
    `g` 即可，这就变成了一个“全局”（global）搜索，尽管在这种情况下“globe”指的是“一行文本”。别问我为什么。重点是，你可以使用这个命令从单行中删除单词“old”的所有出现处：


    ```

    1 :s/old/new/g

    ```


    到为止还没大问题，对吧？行。假设你不希望在整个文档的任何地方出现 `old` 单词。好的，没问题。我们会告诉 vim 搜索*整个*文档并将 `old` 替换为
    `new`：


    ```

    1 :%s/old/new/g

    ```


    你可能会问那个百分号是起什么作用的？记得在书开头，我们使用命令 `:so %` 重新加载 `.vimrc` 文件吗？那时和现在一样，百分号意味着“当前文件”。所以在这种情况下，我们是在告诉
    vim 替换当前文件中每一个 `old` 实例。


    好了，现在我们来点战术性的。假设单词“old”只在文档的第 25 到 50 行之间是*不受欢迎的（persona non grata）。你可以使用以下 `start,end`
    语法告诉 vim 你想要搜索的范围：


    ```

    1 :s 25,50 /old/new/g

    ```


    “等一下，”你说，“我害怕！我担心我做的修改是错误的，会毁掉这个世界！”Vim 理解你。有时候，你不希望 vim 在没有获得你的许可的情况下就更改单词 `old`
    的每一个实例。你可以做到这一点。你只需要在命令末尾加上字母 `c`（代表“confirm”），如下所示：


    ```

    1 :%s/old/new/gc

    ```


    当你按下 `Enter` 时，Vim 会跳转到每个“old”实例处并询问你是否要更改它。如果你按 `n`，它就会保持单词不变。如果你通过按 `y` *确认*更改，它就会执行更改。很好用，对吧？


    ### 变得糟糕的地方


    “这儿，”你无疑在对自己说，“没什么大不了的。这只是普通的*正则表达式*，不是什么需要担心的事情。”好吧，我只是在让你热热身。这里开始变得糟糕了。


    如果你是最常用表达式的爱好者，你不会花费太多时间就会开始将搜索的一部分放入分组，并使用这些搜索组来让你的生活变得更好。假设你想做一些简单的操作，比如找到一个六位的十六进制字符字符串。在大多数现代正则表达式解析器中，你会输入类似的内容：


    `[0-9a-f]{6}`


    换句话说，“匹配 0 到 9 之间的任何字符，或 a-f，六次”。这是基础知识。


    而 vim 的奇特之处在于：它不让你直接用括号包裹一个区域，你必须*转义*括号，否则 vim 会搜索它们本身。**我懂。** 所以如果你想用 vim 运行上面的搜索，你得这样写：


    `\[0-9a-f\]\{6\}`


    这是一个*相当简单*的正则表达式。当你开始有嵌套括号和“或”子句（使用管道符号 `|`）时，你可能会达到一个点，让你感觉你的正则表达式有一半半都是反斜杠。


    ### 你必须相信 Vim 是魔术！


    幸运的是，还有希望。自从 vi 之后的这些年来，Vim 一直没有停滞，虽然旧的 vi 正则语法仍然是标准，但你不需要太多工作就可以覆盖它。Vim 有两个特殊的搜索模式，称为
    `magic` 和 `very magic`。`magic` 搜索的行为更像 POSIX 风格的正则表达式，而 **Very Magic** 搜索在很大程度上与你使用
    Perl、Ruby、Python 等学习正则表达式时所熟悉的模式无异。


    要访问“magic”或“very magic”搜索模式，你只需要在搜索前加上 `\m`（代表 magic）或 `\v`（代表 *very* magic）模式即可。正如你所料的，magic
    和 very magic 模式都有它们的相反模式，分别通过使用大写的 `M` 和 `V` 触发。确切了解每种搜索模式情况是有用的，这意味着是时候列出一个华丽的老表格了。


    #### Vim 正则表达式模式


    | 模式 | `\v` | `\m` | `\M` | `\V` |

    | --- | --- | --- | --- | --- |

    | 名称 | Very Magic | Magic | *非* Magic | *极非* Magic |

    | 行尾 | `$` | `$` | `$` | `\$` |

    | 括号 | `( )` | `\( \)` | `\( \)` | `\( \)` |

    | 分支 | `|` | `\|` | `\|` | `\|` |

    | 重复 | `*` | `\*` | `\*` | `\*` |

    | 任意字符 | `.` | `\.` | `\.` | `\.` |

    | 字面点 | `\.` | `\.` | `\.` | `\.` |


    正如你所见，magic 模式是非 magic 和 very magic 的奇特混合，使得它变成了一套烦人的规则。在我们给出任何建议之前，这里是每种模式工作的基本概述，按魔法程度从高到低排序：


    - **Very Magic**: 在这种模式下，字母、数字和下划线以外的所有字符都是特殊的。

    - **Magic**: 在这种模式下，某些字符是特殊的，而其他不是。

    - **Not Magic**: 在这种模式下，少数字符是特殊的。

    - **Very Not Magic**: 在这种模式下，只有反斜杠是特殊的。


