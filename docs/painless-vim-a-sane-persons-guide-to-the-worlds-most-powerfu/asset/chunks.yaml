- fmt: "\nWhenever you yank or delete text it doesn’t just disappear into the universe.\
    \ Just like modern operating systems, vim keeps that text around in an area that\
    \ your OS probably calls a `clipboard`, but vim calls a `register`. Unlike most\
    \ operating systems, however, vim gives you a **lot** of `registers` to play with,\
    \ instead of just one. When you just type `dd` or `yy` vim copies your text into\
    \ its default register, which is paradoxically named “the unnamed register”. Likewise,\
    \ when you hit `p` vim just pastes the text from this unnamed `register` without\
    \ asking any stupid questions.\n\n### Say Hi to the Named Registers\n\nHowever,\
    \ you can use a lot of other registers as well, and access those registers using\
    \ all the operators you already know and love. For example, if we cut the word\
    \ “cat” from the following absolutely fascinating sentence:\n\n```\n1 I have a\
    \ cat bed.\n```\n\nWe want to make sure that our cat doesn’t get clobbered the\
    \ next time we cut or copy something, so we’ll store it to a `named register`.\
    \ Every register in vim is prefixed by a double quote: `\"\"`. And the named registers\
    \ are each named after a lower-case letter of the English alphabet. So you’ve\
    \ got `\"a\"`, `\"b\"`, `\"c` and so forth, which we read as `register a`, `register\
    \ b`, `register c` and so on. Since we’re storing a cat, let’s put it `register\
    \ c`. We do that by telling vim which register to use and what to do. So put your\
    \ cursor before the letter c in cat and type:\n\n```\n1 \"cdw\n```\n\nWhich, in\
    \ vim speak, means “You know register c? Okay, good. Cut this word and put it\
    \ there.” And just like that, your text is stored in `\"c\"`, which we pronounce\
    \ `register c`. Now if we want to paste the cat back into our text somewhere else\
    \ we just type\n\n```\n1 \"cp\n```\n\nAnd you’re golden.\n\nBut what about the\
    \ unnamed register? You know, the one that *everything* gets cut or yanked into?\
    \ What if we want to paste something from that register?\n\nWell, we’d just press\
    \ `p` like we always do. But if you wanted to *explicitly* paste whatever is in\
    \ the unnamed register, you can contact the unnamed register directly using two\
    \ double quotes in a row, like this:\n\n```\n1 \"\"p\n```\n\n### Little Changes,\
    \ Big Changes\n\nWhen you yank or cut text, it gets stored in two places. The\
    \ first is the unnamed register. The second, however, depends on what change you\
    \ made to the text. If you just *yanked* some text using `y` then a second copy\
    \ is stored in the yank register, which we call `0`. If you cut a few words but\
    \ not a whole line your second copy is in the “small delete” register: `-`. But\
    \ it gets more interesting when you cut one or more lines.\n\nRemember that vim\
    \ is a programmer’s text editor, and as such is aware that lines of code are important.\
    \ So every time you cut an one or more lines the text you just cut gets stored\
    \ to register `1`. If you cut another entire line the it doesn’t overwrite what\
    \ was stored in `1`, it just bumps it to `2`, and the text that was stored in\
    \ register `2` moves to register `3`, and so on to register `9`. In this way you\
    \ can be carting around nine major code snippets as you edit your text. Even better,\
    \ these registers aren’t erased when you close vim.\n\nTo get a better handle\
    \ on this, let’s play with cutting lines and moving them around in the file `registers.txt`.\
    \ Near the beginning of the file there are four lines that are out of order like\
    \ so:\n\n```\n1 - Four\n2 - Two\n3 - Three \n4 - One\n```\n\nWe can put them back\
    \ in order pretty easily by just deleting each line using `dd`. This pushes them\
    \ onto the large delete register stack. But what if you can’t remember what order\
    \ they were stored in? Vim has you covered. If you enter `:reg` in normal mode\
    \ you’ll get a screen popup that lists all the current registers and what they’re\
    \ storing. You can even enter a command (like, say, `\"1p`) from this screen.\
    \ Otherwise you can just look at the order your lines are in and paste them back\
    \ into the text in the right order.\n\n### Really Actually Deleting Stuff\n\n\
    But what if you want to get rid of something without clobbering the unnamed register\
    \ or adding it to the large delete stack? There’s a special register, affectionately\
    \ called “the black hole register” that can be used for just that purpose. You\
    \ can’t pull text *from* this register any more than you can pull matter out of\
    \ a real black hole. It’s useful when you just want something gone, and you access\
    \ it using `_`. So if you have a line of text like this:\n\n```\n1 I hate everything!\n\
    ```\n\nAnd you want it gone for good, just put your cursor anywhere on that line\
    \ and enter\n\n```\n1 \"_dd\n```\n\nto send it spiraling out of existence without\
    \ touching anything in any of your registers.\n\nThat was a lot to take in all\
    \ at once, so let’s sum it all up in a fancy table:\n\nNamed Registers\n\n| Register\
    \ Keystroke | Name | What Goes In It |\n| --- | --- | --- |\n| `\"\"` | The Unnamed\
    \ Register | Anything you want |\n| `\"_` | The Black Hole Register | Anything\
    \ you want to get of |\n| `\"\\` | Last Register | The last thing you searched\
    \ |\n| `\"-` | Delete Register | The last cut or copy less than one line |\n|\
    \ `\"1\"` | Delete Register | The last cut or copy one or more lines |\n| `\"\
    2\"` | Big Delete Register | The last cut or copy one or more lines |\n| `\"3\"\
    ` | Big Delete Register | Running stack of deletes |\n| `\"\"+\"` | System Clipboard\
    \ | The last cut or copy |\n| `\"a\"` | Named Registers | Anything you want |\n\
    | `\"A\"` | Append Registers | Overwriting |\n\n## 14. Text Origami. :h folding\n\
    \nThis isn’t a complex topic, nor a huge one. But it’s worth knowing how to handle\
    \ text folding in vim, because it lets you.\n\nIf you just want to play with folding\
    \ for a while you can run `:set foldmethod=indent` from the command line. This\
    \ will give you a simple folding scheme to play with, and decide if you want to\
    \ keep it. If you like it you can always make it permanent in your `.vimrc` file.\
    \ The `indent` folding method just looks at the whitespace at the beginning of\
    \ a line and folds everything indented that much or more. So if you have a passage\
    \ like this:\n\n```\n1 <html>\n2   <head>\n3     <title>Old School Simple HTML!</title>\n\
    4   </head>\n5   <body>\n6     <p> I am a simple paragraph!</p>\n7   </body>\n\
    8 </html>\n```\n\nThen you can position your cursor at the beginning of the `<head>`\
    \ tag and trigger the folding mechanism. Do that and you’ll have this:\n\n```\n\
    1   <html>\n2   +--- 6 lines: <head>-------------------------\n3   </html>\n```\n\
    \nThis may not be exactly what you’re expecting, but it’s what you told vim to\
    \ do. Everything at the same indentation level as the line is folded away nicely.\
    \ If you just wanted to hide stuff in the `<head>...</head>` section you can either\
    \ move your cursor to the next line down and fold from there, or you can try to\
    \ use *syntax* folding.\n"
