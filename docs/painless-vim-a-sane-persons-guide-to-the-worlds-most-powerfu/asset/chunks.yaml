    这不应该让你感到意外，因为在章节开头我就告诉过你了。


    我在这里写的是 `ctrl+s`，我很清楚我那些用 Mac 的兄弟们都在说：“那是 COMMAND s，非常感谢。”放轻松点，朋友。我是在用一台 MacBook
    Pro 写这些的，我同意你的观点。但我们仍然是少数派，所以……就淡定一点，好吗？


    这话不是我提的；Bram Moolenar（`vim` 的创建者）创造了这个短语，用来理解 `vim` 的操作方式。大多数经常处理文本的人都能盲打：只要他们的食指能找到
    `j` 和 `f` 键上的小凹槽，他们就能在不看键盘的情况下找到所有字母。盲操编辑意味着你只需要找到这两个键而完全不看键盘，就能完成你在编辑程序时所会做的所有操作。


    Hog Bay Software 的 [Quick Cursor](http://www.hogbaysoftware.com/products/quickcursor)
    让你能够非常快速方便地从上述任何一个编辑器跳转到 `vim` 并返回，这样我在使用其他编辑器中任何功能的同时，还能拥有 `vim` 的盲操编辑能力。


    能力越大，责任越大。


    但*说真的*，不要那样做。那只是个例子。


