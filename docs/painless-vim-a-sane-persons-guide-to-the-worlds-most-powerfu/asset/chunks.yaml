- fmt: '

    There are a lot of caveats in the menu stuff: parts of it work cross platform,
    parts don’t, so we’re going to cover a basic menu with just a few options. This
    menu will provide access to Tim Pope’s [fugitive](https://github.com/tpope/vim-fugitive)
    plugin, letting you run git commands without leaving vim. If you want to follow
    along exactly you’ll need to install that plugin first. Checkout the chapter on
    [plugins](#chap11.xhtml_plugins) for a quick refresher on how to add stuff using
    Pathogen.


    Okay! Let’s get started. Fugitive gives you access to a plethora of useful git
    features with parameters and ranges and powerful, intuitive features that we’re
    going to ignore completely. For now we’re going to provide access to exactly three
    features:


    * Git Status

    * Git Blame

    * Git Remove


    Which, now that we look at it, would make a pretty good layout for our menu!


    Fugitive’s `Gstatus` command gives you access to a surprisingly wide array of
    functions; things like staging or un-staging files, and committing your changes.
    So naturally it would be the first thing we would want to add to our menu. So
    hey, I’ll start there.


    ## Adding a Menu


    Adding a menu is similar to adding a keymap: you can set the menu to only work
    in certain modes, or all modes. You can make it recursive or non-recursive, etc.
    etc. And, like keymapping, you can test your new menus before adding them to `.gvimrc`
    file. Let’s test it now: Open a file that is under git control and enter the following:


    ```

    1 :menu Git.Status :Gstatus<CR>

    ```


    And then hit `<enter>`. You should see a new “Git” menu item appear in your menu
    bar. If you click it you’ll see a “Status” menu item. Click that and you should
    see the awesome status screen pop up in a new window. Nice, right? In this example
    we just used the `:menu` option, which enables your menu in Normal, Visual and
    Operator-pending. There are other options, which leads to a looking table:


    ### Menu Commands


    | Command | Modes |

    | :--- | :--- |

    | `:menu` | Normal, Insert, Operator-Pending |

    | `:nmenu` | Normal |

    | `:vmenu` | Visual |

    | `:omenu` | Operator-pending |

    | `:menu!` | Insert, Command-line |

    | `:menu` | Command-line |

    | `:amenu` | All |


    In this table I kinda saved the best for last. Most of the time you’ll probably
    use the `:amenu` option. In fact, there are two shortcuts you can use if you’re
    just testing menus haven’t put into your config yet! The commands `:an` and `:am`
    are both aliases for `:amenu`.


    Okay! Let’s get back to the menu definition. After you choose where you want the
    menu to be active you name the menu. You’ll notice that we called one `Git.Status`.
    The period in the middle defines a sub menu, and you can keep going, if you hate
    your life and want to keep:


    ```

    1 :menu Git.Should.Be.Easier.To.Use.Than.This.Status :Gstatus<CR>

    ```


    And you get something a little like this:


    ![Please, please don''t do this](images/bad_menu.jpg)


    Please, please don’t do this


    But now that we’ve had our fun we’re going to back to sane menus, hmm?


    ## Keeping Things In Order


    Unless you’re some kind of bohemian, you’re going to define the order in which
    your menus appear. You do this by adding a priority to the menu definition. The
    lower the priority number, the closer to the left the menu will appear. The default
    menus have the following:


    * File: 10

    * Edit: 20

    * Tools: 40

    * Syntax: 50

    * Buffers: 60

    * Window: 70

    * Help: 9999


    In general they suggest not setting the priority of your menu higher than 999,
    but nobody’s stopping you. To create a menu with a priority you just put the priority
    before the menu command, like so:


    ```

    1 :80menu Git.Status :Gstatus<CR>

    ```


    Which will put your menu after the Window menu. If you don’t give a priority vim
    will assign your menu a priority of 500. If you want to set priorities for sub
    menus you put the priorities in a dot-separated list after the menu command:


    ```

    1 :menu 80.100 Git.Status :Gstatus<CR>

    ```


    Will put the Git menu after window, and set the Status menu fairly early on the
    list (because any menu without a set priority will default to 500).


    Okay, so, armed with this information, let’s create the menu for our thee git
    commands. The following would go well in your `.gvimrc` file:


    ```

    1 :menu 80.1 Git.Status :Gstatus<CR>

    2 :menu 80.2 Git.Blame :Gblame<CR>

    3 :menu 80.4 Git.Remove :Gremove<CR>

    ```


    Save your file, source it, and you should have a pretty git menu all ready to
    go.


    ## Making the Menu Come to You


    One of the whole points of vim is that you don’t have to move your hands from
    the keyboard to do things. Which makes menus a problem. You have to pull one hand
    off of the keyboard, move the mouse all the way to the top of the screen to click
    on some stuff, and then get your hands back into position. Well, we’re going to
    get rid of one of those steps.


    Vim provides a `:popup` command that lets you call a specific menu to the position
    of your cursor. So, let’s say you want your new git menu. Just go to the command
    line and type


    ```

    1 :popup Git

    ```


    And the Git menu should show up… somewhere close to your mouse. The behavior of
    the popup option isn’t totally reliable, and it may go away at some point, but
    for now it looks super awesome. It looks even cooler if you map a shortcut, like
    so:


    ```

    1 nmap <Leader>g :popup Git<CR>

    ```


    So, armed with this knowledge, we can move on. The problem is that there are two
    divergent paths from here. Vim on Linux or Windows works pretty much the same,
    while MacVim has some of its own ideas about life. Choose the section that works
    best for you.


    ### Linux and Windows


    If you look at the `File` menu on gvim under Linux or Windows you’ll notice that
    some menu items have underlined letters, and shortcuts listed to the side of the
    menu item. You’re probably familiar with these from every other program. If you
    press `<alt>o` when the File menu is open it’ll open a new file. If we want to
    define `<alt>g` as the command to open the Git menu, we would set it up with an
    ampersand (&) before the letter G:


    ```

    1 :menu 80.1 &Git.&Status :Gstatus<CR>

    ```


    We also set `<alt>s` to be the accelerator key for the status menu item. But let’s
    say we want to get off menus altogether. We can have the menu tell us the command
    we could run if we wanted to avoid the menu. You just put the text you want right-aligned
    after the literal string `<Tab>`, like so:


    ```

    1 :menu 80.1 &Git.&Status<Tab>:Gstatus<CR>

    ```


    #### Hidden Menus


    If you want to be super cool you can set up a menu that won’t appear in the menu
    bar, a menu that is only accessible as a popup. Again, this is a simple change:
    the name of your menu needs to have the character `]` at the beginning of its
    name, like so:


    ```

    1 :menu ]Git.Status<Tab>:Gstatus :Gstatus<CR>

    ```


    And once you’ve defined it this way you need to remember to call it with the square
    bracket:


    ```

    1 nmap <Leader>g :popup ]Git<CR>

    ```


    And viola! You’ve got a menu that appears as if by magic from nowhere! This, my
    friend, is the good life.


    ### MacVim is a Special Snowflake!


    MacVim handles menus differently, which shouldn’t be surprising, because OSX handles
    menus differently. If you’re setting up a `.gvimrc` that is expected to be used
    in MacVim you’ve got two new commands to play with to make your menus fully Mac
    compatible.

    '
