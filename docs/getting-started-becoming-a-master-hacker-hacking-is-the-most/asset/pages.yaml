    **Google Hacking Summary Google hacking is a key skill that every hacker should
    be aware of and master. In many cases, it can yield information on our target
    that may save us hours, or even days, in exploiting a target.**


    As we continue to expand on information-gathering techniques, keep in mind that
    you are **unlikely** to use all of these techniques on one project. Each project
    is unique, and you will need to customize your information-gathering techniques
    to the target. It is also important to note here that we are using publicly available
    information that does not require we "touch" the domain or website of the potential
    target and, thereby, trigger some alert by an Intrusion Detection System (IDS)
    or other security devices as we are gathering information.


    In this chapter, I''ll introduce you to more techniques for gathering information
    on your target from publicly available sources.


    # Netcraft


    Netcraft is a project out the United Kingdom that began as an effort to track
    data about web servers and websites. It is a very reliable source for data on
    the market share of web server technologies. For instance, if you want to know
    what percent of web servers are running Apache (38.77%), or the most reliable
    hosting companies (Lightcrest) or the most widely used hosting companies (Softlayer),
    Netcraft is the authoritative source. As it does this task of gathering information,
    it has garnered a remarkable amount of information on millions of websites and
    servers that we can'
  merge: -1
  img_proc: true
