    # ## Shodan HQ


    John Matherly developed Shodan in 2009. Shodan collects and indexes information
    from the banners collected from all over the world on web interfaces on ports
    80 (HTTP), 21 (FTP), 22 (Telnet), 23 (SSH), 161(SNMP) and 5060 (SIP).


    Let''s navigate to www.shodan.io.When we do so, we should see a screen like the
    one below.'
