- pgno: 391
  md: '![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_391_0.png)


    In the very next packet, you see a **Session Setup** and the user " **anonymous**
    " .


    This is followed two packets later where you should see "**Tree Connect**" and
    Path: \\<br>\\**192.168.198.203**\IPC$. This is the hacker attempting to connect
    to an IPC share on the target machine.


    You can also see the IPC share attempt and the IP address in the lower window.


    **Create a Filter for SMB Only Traffic** Rather than viewing all the packets,
    let’s focus on just the SMB packets. In the filter window, enter "**SMB**," and
    now you should only see SMB packets in the live window at the top. This should
    make our further analysis much more straightforward.'
