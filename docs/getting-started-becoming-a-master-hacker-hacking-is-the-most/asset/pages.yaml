- pgno: 37
  md: '# Introduction to Master Hacker


    > “The journey of a thousand miles begins with the first step”


    *LaoTzu*


    **Welcome back, my aspiring master hackers!** I was inspired to write this book
    to follow on my unexpectedly successful *Linux Basics for Hackers*. So many of
    you wrote and asked when I would write another to help them continue their journey
    from novice to master hacker. So here we are. I hope you enjoy and gain from reading
    this book.


    **I had a wonderful time writing it !**


    In my previous book, *Linux Basics for Hackers*, I began by saying, “Hacking is
    the most important skill set of the 21st century.” Today—two years later—I want
    to re-emphasize that this statement is even more true. Each and every day—in our
    increasingly digitized world—our privacy, our safety, our national security, our
    identity, and our hard-won earnings are at risk. Hacking--once the realm of a
    few geeky computer enthusiasts--has now grown up to **become one of the most sought-after
    skill sets in the world**. From national governments, espionage agencies and militaries,
    to information security firms and, of course, cybercrime enterprises—all are seeking
    highly-skilled hackers. This book is designed to guide and train you toward that
    profession, whatever your end goal might be.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'Before we embark upon this journey, let’s examine few areas to help us gain
    perspective on this industry and profession, namely; 1. Legitimate professions
    open to hackers; 2. The history of hacking, to give you some appreciation and
    perspective of our discipline; 3. The legal consequences of hacking, to help keep
    you out of the harm’s way.


    **Professions for Hackers Initially, hacking was thought to be the profession
    of a few antisocial, geeky individuals who did it for fun, lulz or profit. By
    2019, it has become a legitimate profession widely sought-after by many organizations
    and governments. Here are just a few of the legitimate employment opportunities
    for master hackers as you plan your future.**


    **National Security Nearly each and every national security agency from around
    the world use hackers. Obviously, the United States, China, Israel, Russia, United
    Kingdom, and Iran are the most active, but nearly every national government has
    an offensive cyber security element. These national security agencies are desperately
    seeking well-trained hackers to protect their nations and attack their adversaries.
    This particularly applies to the field of SCADA/ICS (Supervisory Control and Data
    Acquisition/Industrial Control Systems) hacking, where nations can disable or
    destroy industrial plants and infrastructure in time of cyberwar, such as petroleum
    plants or the electrical grid (see Russia’s attacks against the Ukrainian electrical
    grid at www.hackers-arise/scada-hacking).**


    **National Espionage In the past, every government employed scores of “cloak and
    dagger” spies, but in**'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'this digital age, spying via hacking is cheaper, safer, and more reliable.
    Don’t get me wrong, there are still thousands of spies plying their craft around
    the world, but more and more national espionage agencies are relying on the much
    cheaper, safer, and reliable digital spying. Of course, to do so they need good
    hackers.


    # Military


    In an era where even the troops in the field are using sophisticated digital equipment,
    national militaries are using hackers in the field and on the frontline. I’m proud
    to say that I trained the U.S. Army’s first 2｜P a g e field hacker unit (for the
    Special Forces at Ft. Campbell, Kentucky) several years ago. They and every other
    government will be using hackers in the field in military operations to knock
    out or control the adversaries’ communications and other digital equipment.


    **Penetration Testing or Pentesting** Now that companies and institutions around
    the world are increasingly aware and concerned about cyber threats, they are hiring
    firms to test the security of their systems. Conducting a penetration test, or
    pentest, is one of the best ways to make certain these systems are safe and secure.
    A pentest is essentially a form of legal hacking. The company hires these hackers
    or pentesters to try to hack into their systems to determine how secure they are.
    The general idea is to have the good-guy hackers hack your systems before the
    bad guys. At the end of the pentest, these hackers then provide a report to the
    organization detailing the weaknesses in their network and systems so that they
    can be repaired or'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'hardened. This field has grown rapidly over the last decade and continues to
    grow.


    **Bug Bounty Hunting** One of the newest areas of hacking is known as bug bounty
    hunting.


    **Corporations, organizations, and websites are now offering rewards (bounties)
    to hackers who can find vulnerabilities (bugs) in their software before the general
    public becomes aware of them. Some of these bounties are as large as $1** million.
    Many of the largest organizations in the United States now offer bug bounties,
    including Microsoft, Google, Facebook and the U.S. Department of Defense. In 2019,
    it was announced that an Argentinian teenager, Santiago Lopez, was the first bug
    bounty hunter to earn $1 million.


    **Zero-Day Developer** Probably at the top of the hacker pyramid are the zero-


    Zero-day exploits are exploits or day developers Some hackers develop zero-days
    and hacks that have never seen before then sell them to cyber crime gangs or national
    hence the information security espionage agencies such as NSA (the U.S. National
    industry has had zero days to respond Security Administration) or GCHQ (British’s
    with defenses. Zero-days are the Government Communications Headquarters). These
    “Holy Grail” of hackers zero-day exploits can sell for millions of dollars as
    they enable national espionage agencies to spy on their adversaries and their
    own citizens. There are even companies who specialize in developing and selling
    zero-days such as Germany’s Gamma Group, France’s Zupen, IsraeI’s NSO Group, or
    Italy’s Hacking Team. In addition, the EternalBlue exploit that was stolen from
    the NSA in 2017 and became a critical element of such ransomware as WannaCry and
    Petya (both'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'of which led to the shuttering of many organizations and the paying of millions
    of dollars in ransom) was likely developed by one of these zero-day developers
    for the NSA.




    **Information Security (Infosec) Engineers Hackers make the best information security
    engineers. Not everyone who studies hacking will be breaking into a foreign power’s
    state secrets. Many newly minted hackers will become the people guarding state
    secrets. In brief, the people who are best at protecting any digital resource
    are those who know how others can break in. That’s just common sense, but unfortunately
    that common sense isn’t always reflected by the hires of CISOs (Chief Information
    Security Officer) and others in charge of information security engineers. But
    that is changing.**


    I think the wisdom of hiring hackers as information security engineers might be
    reflected in military or sports strategy. Can you imagine a general whose task
    it was to guard the nation’s capital not being familiar with the offensive tactics
    of the adversary? Of course not! The same analogy can be applied to sports. How
    about a basketball coach who doesn’t understand the opposing team’s plays and
    strategies to score? How effective of a defense could they mount? I think it goes
    without saying that you need to understand the offense of the opposition (hacking)
    to mount an effective defense (information security).


    For more on why hackers make better information security engineers, see my article
    “Why Hackers Make the Best Information Security Engineers” at www.hackers-arise.com.


