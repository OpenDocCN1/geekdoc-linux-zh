    # Shodan


    All of us have used (in most cases, several times per day) Google, Bing, or Yahoo
    to search for relevant material on the Internet. Earlier in this chapter, we learned
    some basics of using Google hacking to find information that might not be readily
    visible in Google''s enormous database of web material. In this section, I''ll
    introduce you to another web search engine, Shodan. Shodan is often referred to
    as the "world''s most dangerous search engine" because of the data it indexes
    and reveals.


    Shodan is a different type of search engine. Instead of crawling all the world''s
    web pages and indexing the information on those pages for search, Shodan crawls
    the Internet and pulls the banners on web servers, then indexes the information
    found in those banners. If you are unfamiliar with pulling web banners, check
    out the banner-grabbing script in Chapter 16.


    Now that nearly every new device has a web interface—from webcams to refrigerators
    to security systems—each of these devices also have a tiny web server embedded,
    as well. These web interfaces are often enabled to allow remote administration,
    such as in a Cisco router or a home security system. These web interfaces mean
    that we can connect to those web servers and pull their banners to find out information
    about the device and its web server. Fortunately, we don''t have to do that as
    Shodan has done this for us and nicely indexed all that information.'
  merge: -1
  img_proc: true
