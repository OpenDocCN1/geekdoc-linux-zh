- pgno: 314
  md: 'A word about terminology, before we start. In Metasploit terminology, an **exploit**
    is a module that takes advantage of a system or application vulnerability. It
    cracks open a door or window. The exploit then usually attempts to place a **payload
    (rootkit, listener)** on the target system. This payload can be a simple command
    shell or the all-powerful **Meterpreter** . In other environments these payloads
    might be termed **listeners or rootkits** . To a beginner, exploit and payload
    modules are the most important, but we will use auxiliary modules later in this
    chapter and post modules in Chapter 11 (Post-Exploitation).


    Metasploit was designed with “modules.” These modules are seven (7) types.'
  merge: -1
  img_proc: true
