    # 1 3


    # Evading AV and Shellcode Fools talk. The wise listen .


    Master OTW


    When exploiting the target as we did in Chapter 9 with Metasploit, you are likely
    to encounter an anti-virus program running on the target system . It is a rare
    target that’s


    not protected with an anti-virus application. As such, we need to examine how
    we might evade such protection.'
  merge: -1
  img_proc: true
- pgno: 460
  md: 'Often, the best way to avoid AV detection is to use a memory corruption exploit
    and load the payload directly into memory without ever writing to the hard drive.
    This is what we did with the EteranlBlue exploit. Unfortunately, that''s not always
    possible with every exploit.


    233 | P a g e


    In the past, the msfvenom module of Metasploit from Chapter 9, was capable of
    creating payloads that could evade AV detection, but the AV developers didn''t
    sit idle. These software companies soon developed techniques for detecting nearly
    any payload developed by msfvenom, but not all (recently, some advanced persistent
    threat (APT) malware from a nation-state effectively evaded AV using the shikata-ga_nai
    encoder). This means that to have a reasonable chance of success at evading detection
    by anti-virus software, we will need to turn to other software to help us re-encode
    our payloads.


    # **Metasploit''s New Evasion Module**

    Recognizing the limitations of msfvenom to evade AV detection, the developers
    of Metasploit began a new project to aid in the evasion of anti-virus. When Rapid7
    released Metasploit 5 in October 2018, it contained two new evasion modules. These
    modules were a departure for Metasploit, as there had not been any new module
    types in quite a few years.


    When the new modules were released, they were very effective at evading Windows
    Defender in Windows 10. Unfortunately, in the ongoing chess game between attackers
    and defenders, the folks at Microsoft added detection of these payloads developed
    by these new modules shortly thereafter. Despite this, we must give kudos to Rapid7
    for putting time and effort toward this crucial'
  merge: -1
  img_proc: true
- pgno: 461
  md: 'issue (for more on the new Metasploit evasion modules, read <https://www.hackers-arise.com/post/2019/03/27/metasploit-basics-for-hackers-part-24-the-new-evasion-modules-in-metasploit-5>).


    # How Antivirus Software Works Before we begin to work toward an undetectable
    payload, we need to understand how anti-virus software works. Most AV software
    can detect malicious code by comparing signatures (code snippets and other artifacts)
    of known malware against software that is entering the system (for more on how
    antivirus software works, go to <https://www.hackers-arise.com/single-post/2016/10/28/Evading-AV-Anatomy-of-


    <ClamAV>. Although some software developers have begun to use heuristic techniques
    (detecting known malicious behavior) this is still not widespread among AV applications
    as it requires significant CPU


    cycles to incorporate this approach. The result of using heuristics is slower
    scanning and system lag.


    It is also important to note that not all AV software is created equal. Not every
    AV application will catch all known malware. VirusBulletin is an independent AV
    software testing laboratory. According to their results, commercial AV software
    is capable of detecting between about 60-98 percent of known malware.


    Most of the major AV software developer results are clustered in the 95 percent
    range. Even with these, 95- percent detection means 1 in 20 known malware will
    go undetected by these applications. Of course, a zero-day--by'
  merge: -1
  img_proc: true
- pgno: 462
  md: 'definition, unknown malware-- is likely to sail right past **all** of these
    applications.




    ![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_462_0.png)


    ![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_462_1.png)


    This perspective is key because to compromise a target, you may not need to be
    undetectable by **ALL** AV


    applications. You only need to be undetected by the target’s AV software. If you
    know what AV software the target is'
  merge: -1
  img_proc: true
- pgno: 463
  md: 'using, you can focus on making your payload undetectable by that application
    (see my article [https://www.hackers-arise.com/single-post/2016/05/23/How-to-Use-Reconng-to-Determine-the-Targets-](https://www.hackers-arise.com/single-post/2016/05/23/How-to-Use-Reconng-to-Determine-the-Targets-)
    [AV-SoftWare-1](https://www.hackers-arise.com/single-post/2016/05/23/How-to-Use-Reconng-to-Determine-the-Targets-AV-SoftWare-1/)
    on using recon-ng to determine the target’s AV software).


    # **Tools for Making Payloads Undetectable Among the tools available to create
    payloads/shellcode capable of going undetected by (AV) software such as veilevasion
    ([https://www.hackers-arise.com/evading-av-with-veilevasion](https://www.hackers-arise.com/evading-av-with-veilevasion))
    or shellter**


    ([https://www.hackers-arise.com/evading-av-with-shellter](https://www.hackers-arise.com/evading-av-with-shellter)),
    OWASP-ZSC (**Z** ero-day **S** hell**C** ode) may be the most versatile. OWASP-ZSC
    is a project of OWASP (the venerable Open Web Application Security project of
    the OWASP Top 10 fame and OWASP-ZAP, among other things), continues under development,
    but has some useful features not found in some of the other applications in this
    category. In this chapter, I will attempt to demonstrate some of the most important
    features of OWASP-ZSC and how they can be used to create shellcode/payloads that
    will go undetectedby AV software.


    # What is Shellcode?


    Shellcode is simply a set of instructions (code) that, when executed into a running
    application such as SMB (like EternallBlue does) or other vulnerable services,
    gives the attacker control of the system. This code is written in assembler language
    (for more on assembler language, see [https://www.hackers-arise.com/single-post/2017/02/27/Reverse-Engineering-Malware-Part-2-Assembler-Language-Basics](https://www.hackers-arise.com/single-post/2017/02/27/Reverse-Engineering-Malware-Part-2-Assembler-Language-Basics)
    ).'
  merge: -1
  img_proc: true
- pgno: 464
  md: 'When a stack or heap-based buffer overflow is executed, the shellcode is then
    injected and often gives the attacker a way to control the target system through
    such things as a command shell (hence its name).


