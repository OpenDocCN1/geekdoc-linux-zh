- pgno: 214
  md: 'Notice in the fifth column that it begins by scanning port 1, then port 2,
    then port 3…It will continue to scan all 65535 ports until it reaches the end
    or you hit Ctrl+C.


    **Fragmenting Packets** As I mentioned in the introduction on hping3, you can
    sometimes bypass security devices such as IDSs and firewalls by fragmenting the
    packets. We can do this with hping3 by using the -f switch such as; kali > hping3
    -S -f 192.168.1.116 -p 445


    Since the packet is broken into many small fragments of the original packet, in
    some cases the IDS or firewall’s attack signature won’t match these fragmented
    packets.




    ```

    root@kali:-# hping3 -Q 0 google.com -p 80

    HPING google.com (eth0 74.125.239.130): S set, 40 headers + 0 data bytes

    229375066 +229375066

    141258272 +4206850501

    2288187613 +2146929341

    849247683 +2856027365

    1247146679 +397898996

    3673440894 +2426294215

    1072409767 +1693936168

    2485301374 +1412891607

    2770603782 +285302408

    3069831418 +299227636

    ```


    ![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_214_0.png)


    **Predicting Sequence Number s** Sequence numbers are used by TCP/IP to make certain
    that packets that'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'don’t arrive in the proper sequence can be reordered at the target in the same
    sequence they were sent. Since all packets do not necessarily take the same path,
    they may not arrive in the same order they are sent. This mechanism is an element
    of what gives the TCP protocol its robustness.


    A Man-in-the-Middle attack (MiTM) must set these sequence numbers properly. To
    protect against MiTM attacks, operating system developers no longer use sequence
    numbers that follow serially (1,2,3...). Instead, they now use algorithms to generate
    sequence numbers to make it harder to conduct a MiTM attack. Hping3 enables us
    to collect the sequence numbers so that we can later predict them for MiTM and
    other attacks.


    Let’s scan google.com and gather some sequence numbers. We can do this by using
    the -Q switch, which will collect and echo back only the sequence numbers of the
    returned packets.


    ```

    kali > hping3 -Q -S google.com -p 80

    ```


    As you can see, hping3 was able to return to us the sequence numbers that the
    operating system TCP/IP stack generated. Given enough of these, we can determine
    the algorithm and then predict the sequence numbers for an effective MiTM attack.


    Using Hping3 to get the System Uptime One of the really interesting things we
    can do with hping3 is to check how long the system has been up and running. Generally,
    this means how long it’s been since the system has been rebooted and, of course,
    that is usually an indication of how long since the system has been patched with
    security updates.'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'The TCP protocol has a field named “timestamp” that calculates the seconds
    since the operating system was last booted up. We can retrieve that value by using
    the “-tcp-timestamp” switch in hping3. It will go out to the target system and
    retrieve this field, and then convert it into days, hours, minutes, and seconds.
    Let’s try it on google.com.


    kali > hping3 -tcp-timestamp -S google.com -p 80




    ```

    root@kali:~# hping3 -tcp-timestamp -S google.com -p 80

    HPING google.com (eth0 216.58.192.14): S set, 40 headers + 0 data bytes

    len=56 ip=216.58.192.14 ttl=54 id=17905 sport=80 flags=SA seq=0 win=42540 rtt=38.2
    ms

    TCP timestamp: tcpts=857981190

    len=56 ip=216.58.192.14 ttl=54 id=14118 sport=80 flags=S seq=1 win=42540 rtt=38.1
    ms

    TCP timestamp: tcpts=858100827

    HZ seems hz=1000

    System uptime seems: 9 days, 22 hours, 21 minutes, 40 seconds

    ```


    ![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_216_0.png)


    As you can see, when I ran this command against the Google server, it returned
    a message that this server’s timestamp was 858100827 and it then converted that
    to 9 days, 22 hours, 21 minutes, and 40 seconds.'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'As a hacker/pentester, this can be invaluable information! It means that this
    system was last rebooted nine days ago. If a recent patch has been released for
