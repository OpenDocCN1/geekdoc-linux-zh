    # Range -


    At the legal limit of .5 watt, most Wi-Fi APs are accessible up to 300ft (100m)
    but with high gain antennas can be accessible up to 20 miles.


    # Frequency -


    Wi-Fi is designed to operate at 2.4GHZ and 5GHZ. Most modern systems now use both.


    # 802.11 Security Protocols


    There have been several security protocols to protect and encrypt Wi-Fi, and your
    strategy will depend upon which has been implemented.


    # WEP


    The initial security protocol to secure 802.11 was named WEP or Wired Equivalent
    Privacy. By 2001, hackers discovered that--through statistical techniques--they
    could crack the user’s password in minutes due to improperly implemented RC4 encryption.
    The IEEE had to quickly find a replacement as all the Wi-Fi APs were left without
    security at that point. Few of these access points are still in use today (you
    will find some, though) WPA


    In 2003, IEEE created a short-term fix they called Wi-Fi Protected Access, or
    WPA. The key part of this new security protocol was that it did not require replacing
    the existing hardware, but rather it relied upon firmware upgrades. WPA also relied
    upon the RC4 encryption algorithm but added'
  merge: -1
  img_proc: true
- pgno: 494
  md: 'some additional features making the PSK more difficult and time-consuming to
    crack.


    These features included: 1. Making the Initialization Vector longer from 48 to
    128 bits 2. TKIP which generates different keys for each client 3. Message Integrity
    Check to make certain the messages have not been altered in route WPA2


    The WPA2 802.11i standard was finalized in June 2004. WPA2 uses the counter mode
    with Cipher Block Chaining Message Authentication Protocol, more commonly known
    as CCMP. This new protocol was based upon Advanced Encryption Standard (AES, see
    Appendix A for more on Cryptography) algorithm 257 | P a g e


