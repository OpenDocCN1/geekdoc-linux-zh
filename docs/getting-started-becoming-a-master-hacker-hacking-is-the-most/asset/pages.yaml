    ```

    root@kali-2019:-# crunch

    crunch version 3.6

    Crunch can create a wordlist based on criteria you specify. The output from crunch
    can be sent to the screen, file, or to another program.

    Usage: crunch <min> <max> [options]

    where min and max are numbers

    Please refer to the man page for instructions and examples on how to use crunch.

    root@kali-2019:-#

    ```


    ```

    CRUNCH(1)                General Commands Manual                CRUNCH(1)

    NAME

    crunch - generate wordlists from a character set

    SYNOPSIS

    crunch <min-len> <max-len> [<charset string>] [options]

    DESCRIPTION

    Crunch can create a wordlist based on criteria you specify. The output from crunch
    can be sent to the screen, file, or to another program. The required parameters
    are:

    min-len

    The minimum length string you want crunch to start at. This option is required
    even for parameters that won''t use the value.

    max-len

    The maximum length string you want crunch to end at. This option is required even
    for parameters that won''t use the value.

    charset string

    You may specify character sets for crunch to use on the command line or if you
    leave it blank crunch will use the default character sets. The order MUST BE lower
    case characters, upper case characters, numbers, and then symbols. If you don''t
    follow this order you will not get the results you want. You MUST specify either
    values for the character type or a plus sign.

    NOTE: If you want to include the space character in your character set you must
    escape it using the \ character or enclose your character set in quotes i.e. "abc
    ". See the examples 3, 11, 12, and 13 for examples.

    OPTIONS

    -b number[type]

    Specifies the size of the output file, only works if -o START is used, i.e.: 60MB
    The output files will be in the format of starting letter-ending letter for example:
    ./crunch45-b 20mb -o START will generate 4 files: aaaa-gfved.txt, gfzee-omgbw.txt,
    omgbz-wcydu.txt, wcydu-zzzzz.txt valid values for type are kb, mb, gb, kib, mib,
    and gib. The first three types are based on 1000 while the last three types are
    based on 1024. NOTE There is no space between the number and type. For example
    500mb is correct 500 mb is NOT correct.

    ```


    ```

    -t @%,$"

    Specifies a pattern, eg: @@@@@@@%@@@ where the only the @/s, ,/s, $/s, and ^/s
    will change.

    @ will insert lower case characters

    , will insert upper case characters

    % will insert numbers

    " will insert symbols

    ```'
