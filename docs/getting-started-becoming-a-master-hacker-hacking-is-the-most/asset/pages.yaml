  md: '# ## 10. Web Applications


    Web applications are probably the most fertile ground for hackers in recent years.
    The more you understand about how web applications work and the databases behind
    them, the more successful you will be as a hacker. In addition, you will likely
    need to build your own website for phishing and other nefarious purposes. Check
    out my series on Web App Hacking at [www.hackers-arise.com/web-app-hacking](https://www.hackers-arise.com/web-app-hacking)
    .


    # ## 11. Forensics


    To become a good hacker, you must not be caught! You can’t become a pro hacker
    sitting in a prison cell for five years (see my section on Legal Stuff in Chapter
    1). The more you know about digital forensics, the better you can become at avoiding
    and evading detection. In Chapter 14, we look at ways to Cover Your Tracks. Also,
    check out my series on Digital Forensics and Network Forensics at [www.hackers-arise.com/network-forensics-1](https://www.hackers-arise.com/network-forensics-1)
    .


    # ## 12. Advanced TCP/IP


    The beginner hacker must understand TCP/IP basics, but to rise to the intermediate
    level, you must understand the intimate details of the TCP/IP protocol stack and
    fields. These include how each of the fields (flags, window, df, tos, seq, ack,
    etc.) in both the TCP and IP packet can be manipulated and used against the victim
    system to enable man-in-the-middle (MitM) attacks, among other things.'
