    # ## Creating a Custom Password List


    If we had not been successful with our password lists, we might want to consider
    building our own password list. In this section, I''ll show you three tools for
    creating a custom password list, ceWL, crunch and cupp.


    # ### ceWL


    Although human beings tend to create and use similar passwords, many people use
    obscure or little-known words from their industry or hobby to create passwords.
    In this way, they believe their password is secure because no one outside their
    industry or hobby would think of it.


    The concept behind **cewl** is to harvest these specialized words to create specialized
    password lists. ceWL'
