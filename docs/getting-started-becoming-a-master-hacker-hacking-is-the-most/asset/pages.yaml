  md: 'Although one doesn''t need to be a cryptographer to be a good hacker, the more
    you understand the strengths and weaknesses of each cryptographic algorithm, the
    better the chances of defeating it. In addition, cryptography can be used by the
    hacker to hide their activities and evade detection. For some basics of cryptography
    and cryptographic concepts, refer to Appendix A "Cryptography Basics for Hackers."


    # ## 14. Reverse Engineering


    Reverse engineering enables you to open a piece of malware and rebuild it with
    additional features and capabilities. Just like in software engineering, no one
    builds a new application from scratch. Nearly every new exploit or malware uses
    components from other existing malware.


    In addition, reverse engineering enables the hacker to take an existing exploit
    and change its signature so that it can fly past Intrusion Detection Systems (IDS)
    and antivirus (AV) software detection.


