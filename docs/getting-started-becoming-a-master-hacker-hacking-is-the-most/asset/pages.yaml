    **Hping3 for Active Reconnaissance** Previously, we used the ubiquitous and powerful
    nmap for port scanning in this active reconnaissance stage of our pentest/hack.
    Although lesser-known and lesser- utilized, hping3 is a powerful and versatile
    scanning tool for doing active reconnaissance. In this section, we will explore
    some of the wide-ranging capabilities of hping3 to find key information about
    our target that could prove useful at later stages.


    Hping3 is often referred to as a "packet crafting tool ." That’s because it has
    the capability of creating just about any type of packet , both RFC (Request for
    Comment. These are the specifications of how protocols are supposed to work) compliant
    and non-RFC compliant. If you can imagine a packet, hping3 can create it!'
  merge: -1
