- pgno: 330
  md: 'This means that if you use an exploit ranked “excellent”, it will likely work
    90% of the time. Not 100%.


    On the other hand, if you use a module ranked “manual” you can probably expect
    it to be effective less than 40% of the time. The others work on gradations between
    90% and < 40%.


    **Reconnaissance with Metasploit In chapters 5 and 6, we used quite a few tools
    to conduct reconnaissance on our targets. Right now, we know quite a bit about
    our target including; its open ports, services, technologies, operating system,
    browser and more. Most of this information can also be garnered using auxiliary
    modules in Metasploit.**


    Auxiliary modules in Metasploit are modules that don’t fit into any of the other
    categories of modules.


    Auxiliary-- in other words-- is a “grab bag” of modules.


    Many of the auxiliary modules are reconnaissance tools, and there are many scanners.
    Besides, this category has some password cracking tools, vulnerability scanning
    tools, and many others.




