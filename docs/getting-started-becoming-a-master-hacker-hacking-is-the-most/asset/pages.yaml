    # Basic UDP Scan


    Now, let''s see if we can find the open UDP ports. The nmap command to find UDP
    ports is nearly identical, except we replace the T in the command with U (UDP).


    ```

    81 | Page

    root@kali-2019:~# nmap -sU 192.168.0.157

