    \ purchased a used car, you will likely recognize some of these. Successful sales\
    \ people are often the best social engineers. They are successful because they\
    \ get you to do something they want you to do , buy their product.\n\n308 | P\
    \ a g e\n\nReciprocity— People want to behelpful, so if the attacker offers something\
