- pgno: 392
  md: '# NT Trans Request


    Next, the exploit sends out **NT Trans Request** with a considerable payload (see
    the middle window) and a large number of NOPs (No Operation). You can see the
    NOP’s in the lower window of Wireshark.


    NOPs are No Operations, where the CPU cycles are expended, but nothing is done.
    NOPs are common among buffer overflow exploits (for more on buffer overflows,
    see [https://www.hackers-arise.com/post/2017/05/26/exploit-development-part-1-anatomy-of-buffer-overflows](https://www.hackers-arise.com/post/2017/05/26/exploit-development-part-1-anatomy-of-buffer-overflows)
    ). The attack is preparing the SMB for the specially crafted packet necessary
    to exploit the system.




    ![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_392_0.png)'
  merge: -1
  img_proc: true
