    # 5


    > **Passive Reconnaissance** ***“ Listen” closely and intently to your enemy;
    they will tell you everything you need to know to defeat them*** **Master OTW**


    **Many on this path to becoming a master hacker** tend to


    discount the need to do information gathering or reconnaissance. These newbies
    (I don''t use that as a term of disparagement, but as a descriptor. We all began
    as newbies) want to rush right into attacking a target system. The master hacker
    understands that the more they know about the target, the better their chances
    of success. As I mentioned earlier in Chapter 3 on the “Hacker Process,” reconnaissance
    may take up to 90 percent of the entire project time and, in some cases, may take
    months.




    This chapter will focus on gathering information about our target from publicly
    available sources. These techniques are'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'often termed "passive reconnaissance" because the hacker gathers information
    without interacting with the target. Some people also refer to this as open-source
    intelligence (OSINT). All of the information comes from third-party sources who
    have already gathered the information about our target.


    The information you gather in this stage depends upon the target. If the target
    is a website, you want to know as much about the technologies behind the web site
    as possible. If the target is a domain, you want to know as much about the domain
    as possible. If the target is a person, you want to know as much as possible about
    the person.


    It would be impossible to include all the passive- reconnaissance techniques,
    so we will limit ourselves to just a few here: 1. Google Hacking 2. Netcraft


    +   3. Shodan


    +   4. DNS


    # ## 5. p0F


    For additional passive reconnaissance techniques, go to www.hackers-arise.com/osint.


    # ### Hacking Google


    As we all know, Google operates the most widely used Internet search engine on
    the planet. Google crawls nearly every web page of every web site, and builds
    a massive database of all the information it gathers. Most people then use Google''s
    database to search by **keywords** for articles relevant to the subject of their
    inquiry. Google then retrieves the most relevant web sites based upon its algorithm
    (the'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'PageRank algorithm, named for Larry Page, one of Google’s founders), which
    prioritizes the articles.


    What few know is that Google has particular keywords and operators that can assist
    you in extracting precise information from this extraordinary database. As a hacker,
    that Google database may yield information about potential targets that could
    prove invaluable, including passwords.


    Let''s take a look at a few of those keywords and what they do.


    **Google Hacking Keywords** Please note that **Google''s keywords require a colon(:)
    between the keyword and the search terms**, such as *intitle:hackers-arise*.


    Although far from an exhaustive list, here are some of the more widely used Google
    keywords: **allinanchor**


    If you use the allinanchor keyword, Google restricts your search to those web
    pages that have ALL


    of the terms you are looking for in the anchor of the page.


    **allintext**


    If you use the allintext keyword, Google restricts your search to those pages
    that have ALL of the search terms you specify in the text of the page.


    **allintitle**


    If you use the allintitle keyword, Google restricts your search to those pages
    that have ALL of the search terms you specify in the title of the page **allinurl**'
  merge: -1
  img_proc: true
