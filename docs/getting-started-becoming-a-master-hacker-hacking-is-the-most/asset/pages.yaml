    # **Using Msfvenom When We Have Physical Access**


    **Msfvenom is great for creating custom malicious files that can be used with
    social engineering (see Chapter 17), but it is also terrific for creating a payload
    that can be used to control the target system when we have physical access.**


    Let’s assume you are a spy and have been able to get access to the target’s office
    and computer. It’s imperative for the survival of your nation’s government that
    they find out what is on that computer!


    With msfvenom, we can create a simple file that we can execute on the target’s
    system that will give us complete control. This is even simpler than creating
    a malicious file.


    In this case, we only need to specify the payload with its LHOST and LPORT, then
    the format (exe) and finally the name of the file we want to create. Here, I have
    used the file'
