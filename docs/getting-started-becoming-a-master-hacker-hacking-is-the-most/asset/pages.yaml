- pgno: 46
  md: '**steered clear of breaking any laws and eventually advised President Bill
    Clinton on cyber security.**


    He then took a job as project manager of a Defense Advanced Research Projects
    Agency (DARPA) project focused on directing research in cyber security. As of
    2017, he is the head of security at credit card processor Stripe (in 2019, it
    was revealed that US presidential candidate Beto O’Rourke was also a member of
    the cult of the Dead Cow).


    # ### In the Beginning...


    There really is no clear-cut beginning, unlike the Bible. Almost as soon as there
    were electronic computers (ENIAC was developed for military ballistics work in
    1946), there were hackers. Most of these hacks were minor, without major dollar
    losses or legal implications. Many people point to one event that may have marked
    the beginning of awareness of the risks and significance of computer hacking.


    Lawrence Livermore National Laboratory in Berkeley, CA was developed during WWII
    to do research on atomic weapons. After the war and up to the present, it continued
    to work on nuclear weapons development. During the Cold War between the US and
    USSR, this lab was the target and focus of espionage, as it held secrets that
    could give either nation an upper hand in any conflict.


    In 1986, at the height of the Cold War, Clifford Stoll, an astronomer working
    in IT at the lab, was asked to resolve a $0.75 accounting error on the timeshare
    (back then, many people shared time on one large mainframe computer) system. In
    his research, Stoll discovered that there was an unauthorized user on the system.
    Stoll was able to trace the new, unauthorized user back to Germany.'
