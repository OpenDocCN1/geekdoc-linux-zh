  md: '![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_254_0.png)


    # Website Vulnerability Scanning with OWASP ZAP


    Nessus is a great tool for finding system and application vulnerabilities, but
    if we want to test a website and web applications for vulnerabilities, we probably
    want to use a tool designed specifically for that purpose. In Chapter 6, we used
    the whatswweb tool to fingerprint websites and it provided us with significant
    information on the site such as: 1. The nation the site is served from; 2. The
    CMS;'
  merge: -1
  img_proc: true
- pgno: 255
  md: '+   3. The web server; and 4. The technologies employed to build the site.


    At this stage, we want to know more. We want to know what potential vulnerabilities
    the website may have that we can exploit. There are a number of excellent commercial
    tools for this purpose, but fortunately the OWASP (Open Web Application Security
    Project) project has one of the best and it’s free!


    From the Kali GUI, you can go to applications, Web Application Analysis and then
    click on OWASP


    ZAP or, if you prefer the command line, just enter **OWASP ZAP** at the command
    line.'
  merge: -1
  img_proc: true
