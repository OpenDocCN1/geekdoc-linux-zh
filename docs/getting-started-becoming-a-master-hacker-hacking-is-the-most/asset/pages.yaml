    an executable file of some type such as a Windows .exe or a Linux .elf. Executable
    Formats are the type we will focus on here. These create an executable file that--when
    opened--will trigger a payload. Transform formats create a payload into a different
    format such as C or Java. Transform Formats are used in creating your own exploit
    (we''ll cover these in my upcoming book focusing just on Metasploit, “Metasploit
    Basics for Hackers”).


