    Nmap scan report for 192.168.0.157

    Host is up (0.00075s latency).

    Not shown: 993 closed ports

    PORT STATE SERVICE

    53/udp open domain

    68/udp open|filtered dhcpc

    69/udp open|filtered tftp

    111/udp open rpcbind

    137/udp open netbios-ns

    138/udp open|filtered netbios-dgm

    2049/udp open nfs

    MAC Address: 08:00:27:9A:19:5F (Oracle VirtualBox virtual NIC)

    Nmap done: 1 IP address (1 host up) scanned in 1089.42 seconds

    ```


    Now our UDP scan looks so: kali > nmap -sU 192.168.0.157


    Generally, UDP scans take much longer than TCP scans, as the mechanism that UDP
    uses for signaling a closed port is slightly different than TCP, and is more ambiguous.
    In my case, the TCP scan took 13.61


    seconds, while the UDP scan took 1089.42 seconds, a factor of nearly 100x longer
    .


    Be patient with UDP.'
