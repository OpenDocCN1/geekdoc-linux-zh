  md: '# **Wi-Fi or 802.11**


    Wi-Fi is also sometimes referred to as “Wireless Local Area Network” or WLAN,
    which basically sums up what this technology is all about. In technical terms,
    Wi-Fi (or wireless networking) is known as IEEE 802.11 technologies. Without getting
    into too much detail, IEEE 802.11 is a set of standards created and maintained
    by the Institute of Electrical and Electronics Engineers (IEEE), that are used
    to implement WLAN communication in select frequency bands.


    Initially, Wi-Fi was secured with Wired Equivalent Privacy or WEP. This proved
    flawed and easily hacked, so the industry developed WPA as a short-term fix. Eventually,
    the industry implemented WPA2, which has proven relatively resilient to attack,
    but does have its flaws. The industry is presently rolling out WPA3 due to these
    vulnerabilities in WPA2.


    # **Terminology**


    This chapter contains a lot of new terminology and acronyms, so let’s pause a
    moment to review some terminology.


    # **AP**


    This is the access point, or the place where the clients connect to the Wi- Fi
    and get Internet access.


    # **PSK -**


    Pre-Shared-Key:his is the password used to authenticate to the AP'
  merge: -1
  img_proc: true
