- pgno: 42
  md: 'To begin, if you haven’t read my *Linux Basics for Hackers*, I suggest you
    pause now, pick it up and study it. Read it and do the exercises. It’s a good
    starting point in your journey from novice to master hacker. In this book, I will
    assume you have some basics Linux skills that covered in that book.


    # A Word about Black Hat v. White Hat


    Nearly every “hacking” book discusses the concept of white hat hacker vs. black
    hat hacker. In our modern world, the distinctions have become blurred. For instance,
    Russia, the United States, and China are hacking each other 24/7 for geopolitical
    advantage. From the perspective of the United States, the Russian hacker might
    be considered a black hat, while in Russia they would be celebrated as heroes.
    Of course, the same applies in reverse. U.S. hackers intruding upon China are
    well-paid and well-respected members of the military or intelligence community
    with nice homes in the suburbs and 2.5 children, but are considered criminal or
    black hats in China. I hope you get the idea. Context and perspective are critical
    in making the distinction, one I prefer not to make. I maintain the terms are
    anachronistic in 2020.


    In the old days—meaning way back to 2010—there were basically two types of hackers,
    but today there are many types and many motivations. As a result, I will avoid
    the distinction and if I refer to any hat at all, I will call them white hats.


    # History of Hacking


    Before you begin this journey to becoming a Master Hacker, let’s take a look back
    at the history of hacking.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_43_0.png)


    ![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_43_1.png)


    Hacking has a long and storied history in the United States and around the world.
    It did not begin yesterday—or even at the advent of the twenty-first century—but
    rather dates back nearly forty years. Although there was little hacking activity
    in the 1980s, once the Internet migrated to commercial use in the 1990s, hacking
    went into hyper-drive.


    To those of you unaware of our long and proud history, I want to dedicate the
    following to provide you with some of the highs and lows of this nearly 40-year
    history. It would be impossible to list every hack or hacker over the last 40
    years, even if this were a 500-page book, so I will limit myself to a brief history
    and only try to touch upon the most significant hacks over that period of time.


    It’s important to note that we are limited in this history to only discussing
    hacks that were made public. Those that were not reported by their victims (national
    governments and large corporations are reluctant to report intrusions for fear
    of embarrassment and damage to their reputation) or were never discovered, cannot
    be included for obvious'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'reasons. So, of course, that biases this exposition to only those who were
    caught.


    # Famous People Who Were Hackers


    Before we delve into this history of hacking, let’s take a look at some prominent
    people who were once hackers. In reality, there are many respectable people in
    IT and IT security that have a hacker background, but few are willing to admit
    it. I personally know CIOs (Chief Information Officers) and CTOs (Chief Technology
    Officers) of major corporations in the United States who have admitted to me that
    they were once hackers, but they won’t say so on the record and really don’t want
    their employers to know.


    # Steve Jobs


    Before there was an Apple computer, Mac, iPod, iPad, or iPhone, Steve Jobs and
    his partner, Steve Wozniak, were developing a tool that became known as the “Blue
    Box” in 1972. This tool was capable of replicating the audio tones used by the
    telephone company (Yes, once upon a time there was just one telephone company
    in the United States) to enable long-distance calls— without paying for them.


    # Julian Assange


    Long before WikiLeaks, Julian Assange was an infamous teenage hacker in Australia.
    As a sixteen-year-old in Australia, Assange, aka Mendax, was hacking into the
    US Department of Defense, NASA, the US Navy, MILNET, Citibank, and Lockheed Martin,
    among many others. By 1991, Assange was caught hacking Nortel and was arrested
    and charged with thirty-one counts of computer crimes. In 5


    | Page'
  merge: -1
  img_proc: true
- pgno: 45
  md: '![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_45_0.png)


    1996, he plead guilty to twenty-five counts and paid a minimal fine with no jail
    time .


    # Kev in Poulsen


    Now known as an author and astute tech writer for WIRED magazine, Kev in Poulsen,
    was first a hacker. He is best known for hacking the phone system of KIIS-FM in
    Los Angeles to make certain he was the 102nd caller, which won him the prize of
    a new Porsche 944. Poulsen was caught by the FBI and sentenced to five years in
    the federal penitentiary with a three-year ban on using the Internet.


    Mudge (aka Peiter Zatko) Mudge was the most prominent member of the hacker super
    group, Cult of the Dead Cow (cDc) that was responsible for the development of
    BackOrifice (one of early exploits of Windows 95 and 98 giving the attacker complete
    control of the remote system) and a heightening awareness of information security
    in the early days of the Internet (see the History of Hacking later in this chapter).
    In addition, Mudge was a leading member of the L0pht Heavy Industries and developed
    the widely used password cracker, Lophtcrack (it’s still in Kali). Unlike some
    other hackers, Mudge'
