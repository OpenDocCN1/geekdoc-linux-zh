- pgno: 48
  md: 'Stoll contacted the FBI, CIA, and other law enforcement agencies but received
    little or no help.


    Eventually, he set up fake files containing "national secrets" that the attacker
    found and stole. This is probably the first reported use of a virtual honeypot
    in history . Eventually, the trail led to a hacker in Germany named Markus Hess.
    He was stealing these nuclear secrets and passing them to the Soviet Union for
    compensation.


    This event, probably more than any other, triggered the national consciousness
    to the risks of hacking and started the process of developing a legal framework
    to prohibit hacking.


    # ## Morris Worm - 1988


    In November 1988, the young Internet almost came crashing down. A twenty-two-year-old
    Cornell University graduate student by the name of Robert Tappan Morris unleashed
    a worm that infected nearly 25 percent of the computers on the Internet (admittedly,
    there were few computers on the Internet back then). This was particularly embarrassing
    for his father, who was a prominent NSA scientist and, at the time, head of IT
    security for the world''s largest computer company, IBM.


    Eventually, Morris became the first person to be prosecuted under the Computer
    Abuse and Fraud Act of 1986 (Title 18, Section 1030 of the U.S.C. see Legal Stuff
    below). This same law is still used to prosecute most hacking crimes in the United
    States. Morris was sentenced to three-years probation and 400 hours of community
    service. Dr. Morris is now a tenured professor at the Massachusetts Institute
    of Technology (MIT).


    # ## Melissa Virus - 1999'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'The Melissa virus was a milestone in virus development as it was a macro virus.
    This means that it used macros embedded in MS Office documents to do its dirty
    work. This may have been the most successful virus in computing history, reportedly
    infecting up to one in every five computers worldwide.


    Eventually, the developer of the Melissa virus, David L. Smith, was caught and
    prosecuted.


    Authorities tracked the GUID (Global Unique ID) of the Microsoft Office documents
    containing the virus to catch Smith. He plead guilty and was sentenced to ten
    years in prison.


    # ## Back Orifice and BackOrifice 2000-1998-1999


    Back Orifice debuted in 1999 as a rootkit and remote administration tool (RAT)
    for Windows 95 and Windows 98 systems. Developed by the hackivist group Cult of
    the Dead Cow (Mudge was the most famous member and it now turns out that US


    presidential candidate, Beto O’Rourke also), it did much to heighten the awareness
    of the vulnerabilities of Windows systems to malware and spurred Microsoft to
    take security seriously.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_50_0.png)


    This malware with an easy-to-use GUI, enabled the hacker to control nearly any
    Windows system from a remote location.


    # ## DMCA &Elcomsoft - 2001


    The Digital Millenium Copyright Act (DMCA) of 2001 made it illegal to pirate copyrighted
    material and contained severe penalties for doing so. Still, almost as soon as
    the ink was dry on this law, the FBI arrested Dmitry Sklyarov of Elcomsoft as
    he came to the United States to attend Defcon (one of the most famous information
    security conferences) in Las Vegas. The FBI claimed that Sklyarov and Elcomsoft
    were trafficking software programs that could circumvent copyright protections,
    which made Sklyarov the first person arrested and prosecuted under this new law.


    Elcomsoft is a Russian company that sells digital forensics software that can
    also be used for hacking. For instance, they produce one of the best password-cracking
    tools available anywhere. It was this password cracking software that the FBI
    considered illegal that lead to his arrest. Eventually, the FBI dropped the charges
    against Sklyarov and he was allowed to return to Russia. Elcomsoft, the company,
    was then prosecuted under this law and was found not guilty.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Anonymous Formed - 2003


    Anonymous, the loosely organized hacking collective, made its first appearance
    in 2003. An outgrowth of the 4chan image boards, this group would gain greater
    fame than any other hacker organization.


    It conducted numerous widely reported hacks including; Operation Chanology, an
    attack on the Church of Scientology''s website; Operation Payback, the DDoS attacks
    against MasterCard, Discover, Visa, and PayPal after they refused to allow people
    to use their services to send contributions to WikiLeaks; Operation Paris, in
    response to the 2015 terrorist attacks in Paris; Operation ISIS, an attempt to
    nullify ISIS recruiting efforts on the Internet; Operation Trump, an effort to
    keep Donald Trump from being elected president; and many others.


    Several members, contributors, and readers of, Hackers- Arise.com, are also members
    of Anonymous.


    # TJX - 2007


    TJX, the holding company of the off-price retailers such as TJ Maxx and Marshalls,
    lost nearly 45


    million customer records and credit cards numbers when hackers were able to compromise
    their network through an unsecured wireless network. It was the largest data security
    breach up to that time.




    The hackers found one of its stores had an unsecured wireless network that they
    were able to access from the parking lot. From there, they traversed the company
    network to the database servers holding the customer'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'accounts and credit card numbers. TJX held all this data unencrypted, making
    the hacker''s task extraordinarily easy.


    # Carder Market & Max Butler - 2007


    An American hacker, Max Ray Butler, aka Max Vision, took over the world''s largest
    black market for stolen credit cards numbers, Carders Market. Eventually, in 2007,
    Butler (also the founder of the Arachnids vulnerability database) was caught and
    sentenced to thirteen years in prison, the stiffest sentence imposed upon a hacker
    yet. Butler is cooperating with the Computer Emergency Response Team (CERT) and
    is likely to be released early as a result of his cooperation.


    # The Nation of Georgia and South Ossetia - 2008


    Often marked as a milestone in the history of cyber warfare, Georgia, the former
    Soviet republic, was attacked with a massive DDoS attack against its internet
    architecture. As a result, all of the government and military internet-based communications
    were disabled, while Russian tanks and troops rolled into the Georgia province
    of South Ossetia. The DDoS attack was instigated by civilian hackers in Russia,
    probably at the direction of the Kremlin.


    # Conficker Worm - 2009


    First detected in November 2008, the Conficker Worm struck fear into nearly every
    Windows user and their IT departments in 2009 and 2010. The worm used the vulnerability
    in Windows systems that became known as MS08-067 (Metasploit now has an exploit
    that tests for this vulnerability). The Conficker worm created one of the largest
    botnets in history, maybe as large as 15 million computer systems around the globe.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'This worm gave the developer access to the personal information of the computer
    user while adding them to a massive worldwide botnet that could be used for DDoS
    (Distributed Denial of Service) attacks, password cracking, and spamming, among
    many other malicious activities. Despite concerted international efforts, no one
    is certain who was responsible for Conficker and what its ultimate purpose was.


    # Operation Aurora - 2010


    In 2010, Google was the victim of a massive attack, presumably from Chinese state-sponsored
    hackers. These attacks were undertaken to compromise Google''s Gmail service.
    Google speculated that Chinese authorities were seeking information on dissidents
    in their country that used Gmail to communicate. As a result, Google made a strategic
    decision to withdraw from the Chinese market, the world''s largest.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# **Software Sabotage**


    How Stuxnet disrupted Iran''s uranium enrichment program


    ![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_54_0.png)


    +   1. The malicious computer worm probably entered the computer system – which
    is normally cut off from the outside world – at the uranium enrichment facility
    in Natanz via a removable USB memory stick.

    2. The virus is controlled from servers in Denmark and Malaysia with the help
    of two Internet addresses, both registered to false names. The virus infects some
    100,000 computers around the world.

    3. Stuxnet spreads through the system until it finds computers running the Siemens
    control software Step 7, which is responsible for regulating the rotational speed
    of the centrifuges.

    4. The computer worm varies the rotational speed of the centrifuges. This can
    destroy the centrifuges and impair uranium enrichment.

    5. The Stuxnet attacks start in June 2009. From this point on, the number of inoperative
    centrifuges increases sharply.


    Iranian centrifuges for uranium enrichment


    ![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_54_1.png)


    ![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_54_2.png)


    # ### Stuxnet - 2010


    This was probably the most sophisticated hack of all time. Undoubtedly, this malware
    was developed by the NSA, probably in collaboration with Israel. Its intention
    was to slow Iranian nuclear development efforts and it accomplished that goal.


    This worm was first released in the wild in 2009'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'and traveled around the world. It was soon discovered by security researchers,
    but its goal was unknown. Eventually, it found its way to the offline uranium-enrichment
    facility in Natanz, Iran, where it infected the Siemens PLC controllers on the
    centrifuges used to enrich uranium. It did not disable them, but rather made them
    operate at speeds that were inadequate to properly enrich the uranium, all the
    while reporting to the control room that all was well.


    This bit of malware was sophisticated and unique. First, it was very specific;
    it only infected the Siemens-produced controllers used on that enrichment facility.
    Second, it was harmless on all other infected computers. Only when it detected
    the target PLCs did it "phone home" for an upgrade.


    Third, it used a hash collision likely generated by NSA''s supercomputers to bypass
    Microsoft''s software-signing certificate authentication process. In all, the
    world has never seen such sophisticated malware, but I am sure that won''t last
    for long. For more on Stuxnet, see [https://www.hackers-arise.com/post/2019/11/01/scada-hacking-anatomy-of-the-stuxnet-attack](https://www.hackers-arise.com/post/2019/11/01/scada-hacking-anatomy-of-the-stuxnet-attack)


    # PlayStation Network - 2011


    The PlayStation Network of Sony Corp. was hacked in April 2011, and over 77 million
    users''


    personally identifiable information (PII) was compromised. It was one of the largest
    data security breaches in history. Sony blamed Anonymous, but Anonymous denied
    involvement.


    # Aaron Swartz - 2011'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'Aaron Swartz was an icon and martyr for the cause of information freedom. Swartz
    is known for his development of the web syndication format RSS, and his involvement
    in the organization Creative Commons as well as partner in Reddit. In January
    2011, Swartz was arrested by MIT police for connecting a computer to the MIT network
    and downloading academic journal articles.


    Federal prosecutors charged him with wire fraud and 10 | P a g e


    eleven violations of the Computer Fraud and Abuse Act, US Title 18 Section 1030.
    These charges


    could have meant up to thirty-five years in prison for Swartz.


    Distraught over the heavy-handed grandstanding by the federal prosecutor that
    would place him behind bars, Swartz took his own life, hanging himself in his
    Brooklyn apartment.


    In August 2013, Aaron Swartz was inducted into the Internet Hall of Fame.


    # Jeremy Hammond - 2013


    Jeremy Hammond was a computer hacker and hacktivist who was convicted and sentenced
    in November 2013 to ten years in federal prison for hacking Stratfor, the private
    foreign intelligence firm, and releasing the information and emails to WikiLeaks.
    Interestingly, the presiding judge at his trial, Loretta Preska, had ties to Stratfor
    through her husband, yet refused to recuse herself.


    Hammond founded the website www.hackthissite.com at just age 18. Hammond had long
    been a staple in the information security community and is a good example of'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'someone using their skills for the common good, despite being labeled as criminal
    by the US justice system.


    # Mt. Gox - 2011-2014


    Mt. Gox, based in Tokyo, was one of the first bitcoin (digital cryptocurrency)
    exchanges and probably the most widely used. Started in 2010, it closed its website
    and exchange in 2014. During that time, over 850,000 bitcoins ($450 million at
    the time and over $41 billion presently) went missing from its exchange.


    It was eventually revealed that Mt. Gox had been hacked numerous times over the
    years by various hackers. The CEO of Mt. Gox, Mark Karpeles, was arrested in 2015
    for falsifying the account records to cover the losses.


    # Target / Home Depot Hack - 2013


    In December 2013, Target revealed that its database servers had been hacked and
    millions of customers'' data had been compromised. The hackers apparently exploited
    the point-of-sale (POS) systems that were running Windows XP to enter the network,
    then traveled to the database servers from there to extract the data.


    Evidence points to a Russian cybercrime organization that purchased the exploit
    from a Russian teenager for $1,700. Soon after the Target hack, major retailers
    across the U.S. experienced the same attack, most notably Home Depot. This attack
    was probably responsible for one of the largest data breaches in history, compromising
    over 100 million credit card numbers. It had a significant impact upon these retailers''
    reputation for information security and led to US credit card issuers to finally
    begin the transition to the more secure, chip-based credit cards, something the
    European issuers had done over a decade before.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Yahoo - 2013


    In the largest data breach yet, hackers breached Yahoo''s email service and stole
    3 billion email account passwords. This breach haunted Yahoo for years and eventually
    led to it being acquired by Verizon.


    # Sony - 2014


    Just before Christmas of 2014, Sony Entertainment''s computer systems were hacked,
    presumably by the North Korean government, in response to a movie that Sony was
    about to release. This movie did not reflect well on the North Korean dictator,
    Kim Jong-un. The hackers were able to copy movies, emails, and confidential corporate
    documents that were very embarrassing to Sony.


    Independent researchers found evidence that the attack was likely an inside job
    by former employees who had a grudge against the corporation.


    # Hacking Team - 2015


    In 2015, a company in Italy known as "Hacking Team" was hacked and had the contents
    of its email and file server posted online. What makes this hack so significant
    is that it clearly shows how hacking has become a legitimate business. Emails
    from their servers show that Hacking Team, like Vupen (the French exploit developer),
    developed zero-day exploits and sold them to governments around the world. These
    exploits are largely used by governments to watch and monitor their citizens''
    online activities.


    # Panama Papers Hack - 2016'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'Wealthy individuals around the world were exposed for evading taxes by using
    shell corporations set up in Panama by the shadowy law firm, Mossack Fonesca in
    2016. Although no one went to prison due these revelations, the Prime Minister
    of Iceland, David Gunnlaugsson, was forced to resign for hiding assets in Panama
    and the UK prime minister, David Cameron, had to issue an apology for his family''s
    use of the tax evasion methods (evenetually he did resign over Brexit, but these
    revelations did not help his case).


    Estimates of the total tax revenue evaded by those involved exceeded $200 billion!
    Those implicated by this hack included those two prime ministers, and also include;
    Vladmir Putin, the prime minister of Georgia, the prime minister of Ukraine, the
    Spanish royal family, the Saudi royal family, Lionel Messi, Tiger Woods, Simon
    Cowell and many others. For more on this hack, go to [https://www.hackers-arise.com/post/2018/08/01/confessions-of-a-professional-hacker-how-hackers-obtained-the-secrets-of-of-the-panama-paper](https://www.hackers-arise.com/post/2018/08/01/confessions-of-a-professional-hacker-how-hackers-obtained-the-secrets-of-of-the-panama-paper)


    # The Presidential Election of 2016


    The 2016 USpresidential election will likely go down as one of the most significant
    hacks in history.


    Presumably, the Russian state and Russian state-sponsored entities (GRU) endeavored
    to influence the election in favor of Donald Trump. These activities included
    posting divisive and false information on social media sites such a Facebook and
    Twitter and hacking the emails of Trump''s opponent, Hillary Clinton,and her campaign
    manager, John Podesta. These emails were then transferred to WikiLeaks, where'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'they were released by Julian Assange and his comrades at WikiLeaks. In addition,
    the Russian hackers attempted to infiltrate the software of some voting machines,
    but were apparently unsuccessful. For more on how the Russian GRU compromised
    the 2016 US Presidential election, see [https://www.hackers-arise.com/post/2018/07/15/confessions-of-a-professional-hacker-how-russian-hackers-compromised-the-2016-us-president](https://www.hackers-arise.com/post/2018/07/15/confessions-of-a-professional-hacker-how-russian-hackers-compromised-the-2016-us-president)


    # EternalBlue 2017


    In late 2016 and early 2017, a shadowy organization appropriately named the ShadowBrokers,
    was trying to sell exploits on the Internet that they said had been stolen from
    the US spy agency, NSA.


    When they were unable to sell them for their asking price, they released them
    on the web on April 14, 2017. These exploits were real, stolen exploits from the
    NSA and could effectively give their owner access to nearly any Windows 7 and
    earlier computer system with system administrator privileges. This exploit (hack)
    was known as EternalBlue and Eternal Romance. Within days, Microsoft released
    a patch known as MS17-010 in the spring of 2017. Unfortunately, not everyone patched
    their systems and this exploit was responsible for millions of computers being
    compromised in the next few months including the WannaCry, Petya and NotPetya
    ransomware (see below).


    Evidence would seem to indicate that the Shadow Brokers was an operation of Russian
    espionage agencies and associated bodies.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# WannaCry 2017


    Nearly as soon as the Etern alBlue exploit was released by the ShadowBrokers,
    someone used it to build the ransomware (ransomware encrypts the target''s files
    and demands ransom to decrypt hem) known as WannaCry. The first attack began on
    Friday May 12, 2017 (29 days from the release of EtermalBlue) and quickly spread
    to hundreds of thousands of computer systems around the world.


    This ransomware entered the computer system via SMB (Server Message Block protoc
    ol port 445.


    For more on SMB, see [www.hackers-arise.com/network- fundamentals](www.hackers-arise.com/network-
    fundamentals) using Etern alBlue and then encrypted all the key files on the computer
    system including Microsoft Office documents (doc, xls, ppt) as well as graphic
    files and database files. The attackers demanded ransom for the decryption key
    to be paid via the crypto-currency, bitcoin. The damages from this ransomware
    are estimated in the billions of US dollars. Many believe that this ransomware
    was the work of North Korean state-sponsored hackers and may have been used to
    fund that economically isolated country''s national budget needs.


    # NotPetya Ransomware 2017


    Having first appeared in the Ukraine and generally attributed to the Sandworm
    hacking unit in Russia, the ransomware spread throughout the world in days crippling
    businesses around the globe.


    This ransomware caused over $10 billion in damage as businesses could not function
    without their data files, most notably the global shipping business Maersk. NotPetya
    also used NSA''s Etern alBlue to exploit the systems and then'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'providing access to the files for encryption. This was probably the most devastating
    ransomware attack to date.


    13 | Page


    # ## Starwood Hotels 201 8


    In November 2018, the US hotel chain Marriott revealed that one of their subsidiaries’,
    Starwood Hotels, reservation system had been breached. Nearly half a billion (yes,
    that’s billion, meaning 7 percent of this planet’s human population) of their
    guests’ records had been stolen. Apparently, the hacker had been embedded in their
    systems for over four years before being detected. It is suspected that this was
    a state-sponsored attack and that the state in question is simply stockpiling
    data on potential targets in the West.


    I hope this brief history of hacking clearly demonstrates to you its importance
    and significance of over the last 40 years or so. As more and more of our lives
    become digital, hacking and IT security will become even more important, making
    them the [most valuable and critical skills of the twenty-first century](https://).


    # ## Legal Stuff


    Before we begin training to become master hackers, let’s look at the law. So many
    of my readers have asked me “what is legal and illegal in hacking/pentesting”
    that I decided it was time to address it directly in this book. In our discipline,
    we may WANT to ignore the legal consequences (until they slap us upside the head)
    but that’s not a prudent strategy. It may very well cut your hacking career short.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# **The Cyber Crime Law Enforcement In the United States, most hacking is investigated
    and prosecuted by federal law enforcement.**


    Surprisingly, the Secret Service is the lead agency, but they are primarily involved
    in coordinating the response, usually not in investigating. They delegate the
    investigation to one of the numerous federal agencies, but the FBI''s Cyber Crime
    Task Force is the agency most often involved.


    There are cybercrime task forces in each locality. They are generally assigned
    the smaller local cases as the local FBI special agents have limited training
    and background in hacking and forensics. They often rely on good-old detective
    work to solve these cases. I can''t tell how many times hackers have been tracked
    down because they bragged about their exploits. You don''t have to be a techno-genius
    to track down a bragging hacker who suddenly is a wash in money.


    Although federal law makes it a felony to do more than $5,000 damage, the general
    rule is the FBI won''t even get involved in cases that comprise less than $100,000
    in damages. Note that the key word here is "damages."This has nothing to do with
    how much the hacker takes, but rather how much damage is done to the individual
    or business. For instance, Amazon does $230 billion per year in revenue or $630
    million per day or $26 million per hour. If a hacker were to create a Denial of
    Service (DoS) against Amazon for one hour, the losses would be $26million plus
    mitigation costs, legal costs and reputation loss. Good luck making that restitution
    after you are caught and found guilty!'
  merge: -1
  img_proc: true
- pgno: 64
  md: "![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_64_0.png)\n\n+   - (2) intentionally\
    \ accesses a computer without authorization or exceeds authorized access, and\
    \ thereby obtains—\n    - (A) information contained in a financial record of a\
    \ financial institution, or of a card issuer as defined in section 1602(n) of\
    \ title 15, or contained in a file of a consumer reporting agency on a consumer,\
    \ as such terms are defined in the Fair Credit Reporting Act (15 U.S.C. 1681 et\
    \ seq.);\n    - (B) information from any department or agency of the United States;\
    \ or\n    - (C) information from any protected computer;\n\nFederal agencies in\
    \ the United States prosecute cases using two primary federal statutes; **USC\
    \ Title 18 Sections 1029 and 1030** . These two statutes are so broad and ambiguous\
    \ that many things not intended to be hacking could very well be found to be illegal.\n\
    \nUSC Title 18 Section 1029 or **The Access Device** statute, was designed to\
    \ criminalize the possession or use of"
  merge: -1
  img_proc: true
- pgno: 65
  md: 'counterfeit access devices, unauthorized access devices for the unauthorized
    access to money, goods or services. When this statute was written, it was designed
    primarily to criminalize the devices used by phone "phreakers" such as Steve Jobs
    and Steve Wozniak of Apple fame. Back then, phone phreakers used these devices
    that enabled them to get free long distance access.


    The second of these two, **USC Title 18 Section 1030**, is most often used to
    prosecute hacking in the United States. That being the case, let''s have a look
    at it. I have reprinted the key section that defines what activity is illegal
    below. I know there is a lot of legalese here, but let''s try to stay focused
    and examine the critical sections closely.


    # USC Title 18 Section 1030


    Please note the sections I have highlighted above to get your attention that among
    other things, prohibits accessing "information from any protected computer." Since
    the courts have ruled that a"protected computer" can be a computer with as little
    protection as a password, this means essentially that EVERY computer is covered
    in this section.'
