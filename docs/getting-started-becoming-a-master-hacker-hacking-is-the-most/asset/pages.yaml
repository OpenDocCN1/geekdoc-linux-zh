- pgno: 291
  md: "Although this displays some basic information on crunch, we really need to\
    \ view the man page to understand how to use crunch.\n\nkali > man crunch Here\
    \ we see all the key options to make efficient use of crunch. If we scroll down\
    \ a bit, we can see the pattern-specifying wildcards to use with the -t option.\n\
    \n129 | P a g e\n\n```\nEXAMPLES\nExample 1\ncrunch 1 8\ncrunch will display a\
    \ wordlist that starts at a and ends at zzzzzzzz\n\nExample 2\ncrunch 1 6 abcdefg\n\
    crunch will display a wordlist using the character set abcdefg that starts at\
    \ a and ends at gggggg\n\nExample 3\ncrunch 1 6 abcdeg\\\ncrunch 1 6 abcdeg\\\n\
    there is a space at the end of the character string. In order for crunch to use\
    \ the space you will need to escape it using the \\ character. In this example\
    \ you could also put quotes around the letters and not need the \\\", i.e. \"\
    abcdefg\". Crunch will display a wordlist using the character set abcdefg that\
    \ starts at a and ends at (6 spaces)\n\nExample 4\ncrunch 1 8 -f charset.lst mixalpha-numeric-all-space\
    \ -o wordlist.txt\ncrunch will use the mixalpha-numeric-all-space character set\
    \ from charset.lst and will write the wordlist to a file named wordlist.txt. The\
    \ file will start with a and end with \"                \"\n\nExample 5\ncrunch\
    \ 8 8 -f charset.lst mixalpha-numeric-all-space -o wordlist.txt -t @dgg@@@ -s\
    \ cbdogaaa\ncrunch should generate a 8 character wordlist using the mixalpha-number-all-space\
    \ character set from charset.lst and will write the wordlist to a file named wordlist.txt.\
    \ The file will start at cbdogaaa and end at \" dog \" \n\nExample 6\ncrunch 2\
    \ 3 -f charset.lst walpha -s BB\ncrunch with start generating a wordlist at BB\
    \ and end with ZZZ. This is useful if you have to stop generating a wordlist in\
    \ the middle. Just do a tail wordlist.txt and set the -s parameter to the next\
    \ word in the sequence. Be sure to rename the original wordlist BEFORE you begin\
    \ as crunch will overwrite the existing wordlist.\n```\n\n```\nroot@kali-2019:~#\
    \ crunch 9 9 -t dylan%%%% -o customwordlist.txt\nCrunch will now generate the\
