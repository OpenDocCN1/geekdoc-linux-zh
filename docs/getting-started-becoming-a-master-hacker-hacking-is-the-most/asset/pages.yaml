- pgno: 212
  md: '# Using Hping3 in Default Mode for Port Scanning


    At its most basic level, hping3 is a port scanner similar to nmap. The syntax
    is similar, but the output is dissimilar. Unlike nmap, hping3 does not return
    a consolidated output, but instead returns the specifications of the response
    packet. Let’s take a look what happens when we try to hping3 a Windows 7 system
    on port 80. Here, let’s use the SYN (-S) flag. This scan is similar to the nmap
    -sS <IP> -p 80 scan.


    ```

    kali > hping3 -S 192.168.1.116 -p 80

    ```


    Use the Ctrl+C to terminate hping3.


    As you can see in the sixth column, the flags field returns RA. This indicates
    that the RST and ACK flags are set. The RST flag being returned is the standard
    way TCP communicates that the port is closed. On this Windows 7 system, we can
    then conclude that port 80 is closed. Unusual, but not unknown.


    Since this is a Windows machine, it is likely to have SMB is enabled or port 445.
    Let’s try that port.


    ```

    kali > hping3 -S 192.168.1.116 -p 445

    ```


    As you can see in the above screenshot, when we scan port 445 on this system,
    it returns a packet with the SA flags set or SYN (S) and ACK (A) indicating it
    is open.


    Finally, if we want to scan all the ports, we can use the increment syntax or
    ++1 and form a command like this;


    ```

    kali > hping3 -S 192.168.1.116 -p ++1

    ```'
  merge: -1
  img_proc: true
