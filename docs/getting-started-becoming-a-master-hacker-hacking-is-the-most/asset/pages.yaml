    # Cupp


    Sometimes we may want to create potential password list that is tailored to the
    individual target. People often use their names, their children’s names, their
    partner’s names, their pet’s names, their favorite musician’s names as their password
    often combining them with special characters and numbers (admit it.


    You’ve done it!). We have a special tool that can create tailored password lists
    based upon some key info on the target. It’s called cupp or Common User Password
    Profiler.


    Cupp is not built into Kali, so you will need to download it from github.com.


    ```

    kali > git clone https://github.com/Mebus/cupp

    ```


    Next, we need to change directory to our new cup directory.


    ```

    kali > cd cupp

    To run cupp’s help screen , we simply need to enter; kali > ./cupp.py 131 | P
    a g e

    ```'
