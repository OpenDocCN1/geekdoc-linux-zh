- pgno: 311
  md: 'Metasploit is a standardized framework for used primarily in offensive security
    or penetration testing (legal hacking to find vulnerabilities before the bad guys
    do). Before Metasploit, exploits and shellcode would be developed by various coders,
    in various languages, for various operating systems. The pentester had to rely
    upon the trustworthiness of the developer that the code wasn’t laden with malware
    and learn how the developer intended the exploit/shellcode/tool to function. With
    the advent of Metasploit, the pentester has a standardized framework to work from
    where tools work similarly and all are written in the same language, making things
    much simpler and easier.


    Originally developed by HD Moore as an open-source project, Rapid7 purchased Metasploit
    (Rapid7 also owns the vulnerability scanner, Nexpose). Although originally developed
    as an open-source project, Rapid7 has now developed a Pro version of Metasploit
    with a few more "bells and whistles" (bells and whistles can be good and save
    time and money). Fortunately, the open-source, community-edition of Metasploit
    is still available to the rest of us without the thousands of dollars to spend
    on the Pro version (if you are a professional pentester, the efficiency and time
    savings accrued by using the Pro version make it a good investment).


    **Metasploit Interfaces** Metasploit has multiple interfaces including; (1) msfconsole
    - an interactive command-line like interface (2) msfcli - a literal Linux command
    line interface (3) Armitage - a GUI-based third party application (4) msfweb -
    browser based interface


    Undoubtedly, the most common way to use Metasploit is through Metasploit''s interactive
    shell, **msfconsole** . In this chapter on Metasploit, we will be using the msfconsole.'
  merge: -1
  img_proc: true
- pgno: 312
  md: 'In recent years, Metasploit has integrated additional tools to make it more
    than just an exploitation framework. Tools, such as nmap , Nessus and Nexpose,
    are now integrated into Metasploit, so that the entire process from port scanning,
    vulnerability scanning, exploitation, and post-exploitation, can all be done from
    one single tool. In addition, Metasploit has now integrated a postgresql (postgresql
    s a popular enterprise-level, open-source database management system) database
    to store the data collected from your scans and exploits.


    # Getting Started with Metasploit


    Before we start Metasploit, its good idea to start the postgresql database in
    the background. This enables Metasploit to store data in the familiar relational
    database model. This enables easy and seamless access to your data. Metasploit
    will work without postgresql, but this database enables Metasploit to run faster
    searches and store the information you collect while scanning and exploiting.


    ```

    kali > systemctl start postgresql 14 3 | P a g e

    ```'
  merge: -1
  img_proc: true
- pgno: 313
  md: '![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_313_0.png)


    Now, it’s time to start using Metasploit. You can either start it from the GUI
    Applications-


    >Exploitation Tools -> msfconsole Or you can start it by entering msfconsole from
    the terminal kali > msfconsole Within a few seconds, you will be greeted by the
    familiar--if sometimes offbeat--Metasploit splash screen (yours may appear different).
    If you have been using Metasploit 4, you will immediately notice the welcome speed
