    \ to the attacker when asked.\n\nObligation—\n\nThe attacker creates a feeling\
    \ of obligation to themselves by giving or offering something, often just kindness\
    \ or friendliness.\n\nConcession— This is similar to reciprocity but the attacker\
    \ asks for more than they need and settle for what they want (ask for $200 when\
    \ you only want $100 and get the target to concede to $100).\n\nScarcity—\n\n\
    The attacker creates a false scarcity to get the target to act before they all\
