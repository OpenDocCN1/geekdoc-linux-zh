- pgno: 289
  md: 'Note that it’s important to precede the URL of the target website with http
    or https. Without this preface, ceWL will be unable to scrape the target URL.
    Depending upon the size of the website, this could take several hours.


    When ceWL has completed its scraping of potential passwords, it will place all
    the potential passwords in a file I have named cewlpasswords (you can name it
    anything you desire). We can view the contents of this file by using the cat command
    kali > cat cewlpasswords ceWL was able to find several hundred potential passwords
    **on www.hackers-arise.com,** some very specialized to our industry such as Metasploit,
    exploits, vulnerability, scripting, and others.


    To now use that password list in john, we can enter;


    ```

    ```

    kali > john -

    wordlist=/root/cewlpasswords -rules passwordhashes

    ```

    ```


    john will now use the list of words scraped from the target’s website (cewlpasswords)
    and apply rules to mangle(-rules) them with character substitution, thereby increasing
    the chance of cracking the target’s passwords.


    # Crunch


    Sometimes, to crack a password, we may need to create a specialized list that
    meets certain known parameters. For instance, maybe we know that the passwords
    all end in four numbers (eg. password1234) or we know the target’s birthday and
    suspect they use it in their password. If the target’s birthday were February
    29, they might create a password such as “password0229”. Crunch is our tool to
    create such lists!'
