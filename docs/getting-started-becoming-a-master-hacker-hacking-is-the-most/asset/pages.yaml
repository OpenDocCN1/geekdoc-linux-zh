    # ## Nessus Vulnerability Scans The nmap script used above was effective at identifying
    that single vulnerability in our unpatched Windows 7 system. It was effective
    for that one vulnerability, but far from comprehensive. What if we wanted or needed
    to scan for ALL known vulnerabilities? This is exactly what a vulnerability scanner
    like Nessus can do. Although there are many effective vulnerability scanners on
    the market, Nessus is my favorite and the favorite of 44 percent of security engineers
    Nessus began as an open-source project by Renaud Deraison in 1998 (just like Snort,
    Metasploit, and many other information security projects). In 2005, Deraison’s
    company, Tenable Network Security, converted this software to proprietary and
    closed source. Lucky for us, it still'
