  md: 'Like any programming language, Python has the capability to add comments. Comments
    are simply text that is added to your code to help explain what you are trying
    to do. These comments are NOT executed by the interpreter. The Python interpreter
    sees the comments and simply skips over it until it comes to another line of executable
    code.


    Comments are not required in your scripts but are highly advisable. Imagine coming
    back to your script six months or six years from now and trying to determine what
    you were trying to accomplish. Moreover, imagine another programmer trying to
    decipher your code five years from now. In both cases, comments are mighty helpful
    and will save you both significant time and frustration.


    Python uses the “#” symbol to designate a single line of comment. When you want
    to write multiline comments, you can use three double quotation marks (‘‘‘) to
    begin the comment and three double quotation marks at the end.


    As you can see below, I have enhanced our secondpythonscript.py with some comments
    that help explain what we were trying to do with this code.




