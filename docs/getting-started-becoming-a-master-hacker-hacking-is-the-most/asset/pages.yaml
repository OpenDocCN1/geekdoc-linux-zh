    # 8


    # Cracking Passwords Usernames and passwords are an idea that came out of 1970’s
    mainframe architectures.


    They are not built for 2016


    Alex Stamos


    # Passwords are still the most common form of authentication used in our digital
    world. We use


    passwords to log into our computers, our domain, our bank account, our Facebook
    account, and maybe even our phone. In recent years, security administrators have
    made a big effort to get people to use longer and more complex passwords. This
    makes password cracking more time consuming, but it can still be the hacker’s
    best entry point to an account or network.'
