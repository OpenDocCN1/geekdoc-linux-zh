    legitimate users and their systems into the administrator interface of the AP.
    This means that these MAC addresses are allowed to connect, and the AP rejects
    everyone else. Unfortunately, this technique fails miserably in the face of some
    simple techniques.


    The hacker can use airodump-ng to find the MAC addresses of clients that have
    authenticated to the AP.


    kali > airodump-ng -c 11 -a -bssid <mac> Once the hacker knows the MAC address
    of the authenticated client, they can simply “spoof” that MAC address. This requires
    that we take down the interface: kali> ifconfig wlan0 down Then, use macchanger
    to spoof the MAC address making it the same as the connected client’s MAC.


    kali > macchanger -m <mac> wlan0


    Now, bring back up the interface, and it will have the same MAC address as one
    of the systems that are allowed to connect to the AP. Simple!


    kali > ifconfig wlan0 up 262 | P a g e'
