  md: 'Although there are many programming languages, Python is the choice for most
    hackers. If you take a look at the tools in your Kali Linux, most are written
    in Python, including sqlmap, p0F, recon-ng, wpscan, and many others. Furthermore,
    well-known applications such as YouTube, Dropbox, Instagram, and Spotify are all
    written in Python. This is likely because Python is simple, efficient, and has
    innumerable third-party libraries (small pieces of reusable code). These libraries
    provide Python functionality like no other scripting language. You can build hacking
    tools in other languages, but Python’s modules make it much faster and easier.


    Before we move into writing our Python scripts, let’s address some important preliminaries:
    1. Python Modules 2. Pip


    # ### 3. Object-Oriented Programming


    # ## Python Modules


    When you install Python, you also install its set of standard libraries and modules
    that provide you with an extensive range of capabilities. These include built-in
    data types, exception handling, numeric and math modules, file handling, cryptographic
    services (critical to hacker and information security pros), internet data handling,
    and interaction with internet protocols.


    Despite all the power offered by these standard libraries and modules, you may
    need additional third-party modules. In Python, third-party modules are extensive
    and one of the primary reasons hackers prefer Python to other programming languages.
    You can find a comprehensive list of third party-modules at PyPI (the Python Package
    Index, shown below) Pip'
