    intext


    If you use the intext keyword, Google restricts your search to those pages that
    have the search terms you specify in the text of the page.


    intitle


    If you use the intitle keyword, Google restricts your search to those pages that
    have the search terms you specify in the title of the page.


    inurl


    If you use the inurl keyword, Google restricts your search to those pages that
