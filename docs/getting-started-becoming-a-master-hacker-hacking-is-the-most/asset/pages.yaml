- pgno: 573
  md: '# **Social Engineering: The Art of Human Hacking**, by Christopher Hadnagy.


    # **Elicitation**


    Elicitation is the ability to draw out the information or behavior you are seeking
    from the target. This a technique used by spies the world over to get what they
    want. In the US National Security Agency’s training manual, the NSA defines elicitation
    as *"the subtle extraction of information during a normal and innocent conversation."*
    Perfect! That is exactly what we are trying to do.


    These conversations can take anyplace and often are most effective when they seem
    to be part of the normal course of the day or work. This can be in the lunchroom,
    restaurant, café, restroom, just about anywhere.


    Elicitation is effective because people like to talk about themselves and their
    work. Elicitation works well because:

    1. People want to be helpful; 2. People take pride in themselves and their work;
    3. People want to appear intelligent and important; 4. People are vulnerable to
    flattery.


    The key to elicitation is to get people to talk. There are at least four strategies
    to get people to talk: 1. Appeal to their ego; 2. Show mutual Interest; 3. Volunteer
    information about yourself or your work; 4. Assume knowledge.




    # **Pretexting**


    Another excellent social engineering strategy is known as pretexting. In this
    strategy, you pretend to be someone else'
  merge: -1
  img_proc: true
- pgno: 574
  md: 'with an entirely different background and story. Ever wanted to be an actor?
    This may be your chance!


    Pretexting is more than just telling a lie; it usually involves creating an entirely
    new identity and back story. It’s important to note that to be effective, the
    pretext must be tailored to the target. There is no one-size-fits-all.


    Pretexting is common in many professions, but probably most importantly in sales.
    The whole concept is to create a scenario and trust where the target is willing
    to give up information they would not otherwise relinquish.


    # ### Planning the Pretext

    Before engaging in a pretext attack, it is worthwhile to do a bit of planning.


    +   1. Gather as much information about the target as possible.

    2. Try to find an area where your actual interests overlap those of the target.

    3. Plan the pretext to appear to be as spontaneous as possible.


    # ## Influence


    If the attacker wants to persuade someone to do or say something we want, their
    best strategy is to appeal to the target’s interests and avoid an intellectual
    appeal. Persuasion most often involves human beliefs and emotions, not their intellect.


    The key here is to get someone else to **want** to do or think what you want them
    to do. They must believe that it is something THEY want to do or say.'
  merge: -1
  img_proc: true
