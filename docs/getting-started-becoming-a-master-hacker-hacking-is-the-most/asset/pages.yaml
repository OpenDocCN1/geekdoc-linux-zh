- pgno: 381
  md: 'As you can see above, it only found two packets with the word Facebook in the
    payload, and we can see the word Facebook in the ASCII display in the #3 pane.


    **Creating Filters with the Expression Window** If we aren''t sure what field
    we want to filter for or how to create the necessary filter, we can click on the
    Expression tab to the far right. This opens the Expression window like below.


    To the left of this window is the long list of fields available to us to create
    filters. These are hundreds of protocols and the protocols'' fields. You can expand
    a protocol and find all of its fields and select the field of interest.


    The upper right-hand window includes the **Relation** choices. These include:


    +   - Operator

    - Description

    - ==

    - Equal To

    - !=

    - Not Equal To

    - >

    - Greater Than

    - <'
