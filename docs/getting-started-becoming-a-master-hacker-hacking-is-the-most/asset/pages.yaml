  md: 'The keylogger in Metasploit is a little different.


    It’s a software keylogger. The advantage is that it can be installed remotely.
    The disadvantage is that it can only record keystrokes on one process at a time
    (conceivably, you could have multiple meterpreters, keylogging multiple processes
    such as MS


    Word, Notepad, Chrome, and Firefox, all at the same time).


