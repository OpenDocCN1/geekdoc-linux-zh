    Intel or AMD CPU. To determine what type of CPU is on your system, go to Control
    Panel > System and Security System, and it should be listed. If you’re a 64-bit
    system, download and install the 64-bit version of the full Kali (not Light or
    Lxde, or any of the alternatives).


