  md: 'scrapes words from a targeted website and then creates a password list from
    those words. In this way, you can create specialized password lists for an industry
    or individual.


    For instance, let’s assume the target works in the biopharmaceutical industry.
    Many of the words they use in their everyday work would be unfamiliar to the average
    hacker. As such, they may use them as passwords, believing that they are very
    unlikely to be on a password list used by a hacker, and they are probably right.
    Words such as *revereDNAtranscription* , *polymerasechainreaction* , and others
    are unlikely to be in any hacker’s password list. At the same time, they ARE likely
    to be among the words found on the company or industry website. ceWL is able to
    take those specialized words and create a custom wordlist for password cracking
    of those in that industry.


    Let’s take a look at ceWL for creating a custom password list.


    ceWL is built into Kali, so no need to download and install anything. Simply enter
    ceWL to get started or even better cewl -h to pull up the help screen.


    ```

    kali > cewl -h 126 | P a g e

    ```'
