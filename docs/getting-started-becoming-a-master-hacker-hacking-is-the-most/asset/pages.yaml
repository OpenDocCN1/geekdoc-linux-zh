    # 17


    Social Engineering Understanding human psychology, motivation, and behavior is
    one of the hacker''s most important tools.


    *Master OTW*


    As institutions, companies, and individuals become more security conscious, sometimes
    the only way to penetrate a system or network is through social engineering. Some
    novice hackers tend to downplay the importance of social engineering and instead
    hold out for that “single silver bullet” that will enable them to *pwn* the target
    (such as EternalBlue). I need to point out that some of the most important hacks
    in history have been a result of social engineering, including the most famous
    305 | P a g e hack in history: Stuxnet (the US hack of the Iranian nuclear enrichment
    facility at Natanz in 2010, see'
  merge: -1
  img_proc: true
- pgno: 570
  md: 'https://www.hackers-arise.com/post/2019/11/01/scada-hacking-anatomy-of-the-stuxnet-attack)..


    +   Some of the other famous hacks in history that were the result of social engineering
    include: 1. Democratic National Committee hack during 2016 election; 2. Target
    Point of Sale (POS) hack; 3. Sony Pictures hack; 4. 2011 RSA SecurID hack; 5.
    Yahoo’s multiple security breaches.


    6. Russia’s Blackenergy3 Hack of the Ukraine electrical grid

    There is an often-repeated adage in cybersecurity that says, “The weakest link
    in any information security system is the end user.” If the attacker can fool
    a single user, the entire network—or even entire institution—may be taken down
    (one user clicking on a malicious link almost took down RSA and similarly cost
    the US retailer, Target, billions of dollars).


    # What is Social Engineering in Cyber Security?


    Social engineering has been a part of the human dynamic from the beginning of
    time. People have always social engineered each other to get them to do what they
    want. How else would they get young, healthy men and women to fight in senseless
    wars?


    Social engineering is simply the art of manipulating people to get them to do
    what you want or give up the information you need. In the field of cybersecurity,
    the “do something” is often to open an email attachment or click on a malicious
    link, while the “give up information” is often a password. Both of these examples
    are social engineering, but there are so many other as well.


    # Social Engineering Vectors Social engineering is a separate skill set from hacking,
    but just as important. Many hackers don’t take the time and effort to understand
    and master this field. It is just as'
  merge: -1
  img_proc: true
- pgno: 571
  md: "much a science as hacking, but also includes an artistic/creative element.\
    \ It requires an understanding of human motivation, human wants, and human needs.\n\
    \nAlthough social engineering—the art of getting people to do what you want—is\
    \ varied, the vectors to engineer the attacks are well-known.\n\nSome of the most\
    \ common social engineering vectors in information technology are:\n\n+   1. \
    \ \n\n**Phishing** —The practice of sending out large amounts of email trying\
    \ to get a few random people to click on a link or open an attachment or other\
    \ malicious act. This is probably the most common social engineering attack, but\
    \ increasingly less effective.\n\n+   2.  \n\n**Spear Phishing** —Targeting a\
    \ single individual with email attacks. This can often be done by spoofing email\
    \ addresses or phone numbers. It usually is preceded by a significant amount of\
    \ open-source intelligence gathering to determine the interests, needs and motivating\
    \ factors of the target. This can be VERY effective if done properly.\n\n\n\n\
    +   3 .\n\n**Whaling** —An email targeting a very powerful person. In some cases,\
    \ this might be the CEO or another person in the organization with the power to\
    \ access significant resources."
