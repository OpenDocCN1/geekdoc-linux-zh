- pgno: 318
  md: 'exploit, it will show you ALL payloads, a VERY long list (over 500).


    As you see in the screenshot above, the show payloads command listed all the payloads
    that will work with this exploit.


    msf > show options This command is also very useful in running an exploit. It
    will display all of the options (variables) that need to set before running the
    module. These options include such things as IP addresses, URI path, the port
    number, etc.


    In most exploits, you will see the following options (variables).


    RHOSTS - this is the remote host or target IP (RHOST in Metasploit 4) LHOST -
    this is the local host or attacker IP


    RPORT - this is the remote port or target port LPORT - this is the local port
    or attacker port These can all be set by using the SET command followed by the
    variable name (RHOST, for instance) and then the value, such as; msf5 > SET RHOST
    192.168.1.101


    A less commonly used command is " show targets ." Each exploit has a list of the
    targets it will work against. By using the "show targets" command, we can get
    a list of these. In this case, targeting is automatic, but some exploits have
    as many as 100 different targets, and success will often depend upon you selecting
    the correct one. These targets can be defined by the target operating system,
    service pack, language, among other factors.


    msf5 > show targets 147 | Page'
