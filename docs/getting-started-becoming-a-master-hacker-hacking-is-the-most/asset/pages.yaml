- pgno: 180
  md: 'I’ve included this technique not because of its practicality, but for its ingenuity
    and creativity—two essential attributes of a master hacker.


    As a hacker, it is often critical to know what antivirus software the target is
    running. Unless you have created or bought a zero-day exploit, it will likely
    be detected and quarantined by the antivirus software.


    As a result, your days, weeks, or months of work will be lost.


    Not all antivirus software isthe same! Some are good, and some are bad. Some detect
    certain malware, and some detect others. As a result, an attack may work against
    one antivirus and no against another. If we can know ahead of time what antivirus
    the target is using, we can tailor an attack that evades that software.


    When firms have their own DNS server, that server caches every DNS query from
    every employee. If we can examine the DNS cache, we can see every domain that
    has been queried. This means if we can examine the DNS cache, we can determine
    which AV software domain (Symantec, McAfee, Kaspersky, etc.) has been queried
    and which has not. The target company will be using one or all of the AV domains
    in the list. We don''t know which, but we do know that AV companies not on the
    list are NOT being used.


    That information alone can help us determine which attack works.


    As this is more of an intermediate-to-advanced reconnaissance technique, I will
    simply leave you with a link where you can learn more ([https://www.hackers-arise.com/single-post/2016/05/23/How-to-Use-Reconn
    g-to-Determine-the-Target s-AV-Software-1].)'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# **Summar y**


    The DNS system can be a repository of a significant amount of information about
    a target, including the nameserver, mail server, and many subdomains. Many of
    these subdomains may not be obvious, and the target company may believe that they
    are unviewable because there are no links to them. In many cases, these subdomains
    may contain confidential and valuable information to the hacker.


    **p0F or Passive Operating System Detection** As part of the reconnaissance of
    our targets, one of the most critical pieces of information we need is the target
    operating system. I hope it is apparent that a MacOS exploit does not work against
    a Windows system and vice versa. What may not be obvious is that a Windows Vista
    exploit may not work against a Windows 7 system. In many cases, a Windows 7 SP1
    exploit may not work against a Windows 7 SP2.


    The point I am trying to make is that knowing the operating system of the target
    is critical to our success.


    Without this information, we are likely wasting our time and effort.


    In this lesson, we look at a tool known as p0F. The name is an acronym for passive
    operating system fingerprinting.p0F relies upon an understanding of how each of
    the operating system TCP/IP stacks implement and build their packets to determine
    the OS of the sender. In this way, it is totally passive. We don''t need to touch
    the target system with packets or anything else. This tool enables us to determine
    the target operating system without sending any packets or probes to the target.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# TCP/IP Basics


    There are many ways to determine the operating system of a target. For instance,
    specific ports and services are only open on Windows systems (1433 for SQL Server
    and 137 for NetBios) and some ports only on Linux systems (631 for IPP). This
    kind of fingerprinting will at least divide the world into those two broad camps
    (Windows v. Linux), but it is a pretty limited method. First, some Windows systems
    don''t have those ports (1433 and 137) open, and some Linux systems don''t have
    that port (631) open.


    Second, sometimes knowing the broad camp of the OS is not enough information.
    We need a more refined understanding of the OS version, sometimes down to the
    service pack (SP) level.


    Some tools throw many probes at the system and then gauge the response to determine
    the operating system. These tools are very noisy and not very stealthy, but in
    general, work well if their fingerprints are up-to-date. What if we wanted to
    determine the OS without ever touching the system and risking being detected?
    Can we do that?


    The answer is a definitive “Yes”! A few years back, Michal Zalewski developed
    the tool p0F or the passive operating system fingerprinting.


    p0F and other passive fingerprinting tools rely upon the fact that different operating
    systems have different TCP/IP stacks and therefore create these packets slightly
    differently. This means that we can take any packet traveling around the Internet
    and if we know what we are looking for, determine what operating system sent it.


    The four critical fields of the TCP/IP headers that are crucial for OS identification
    are: 71 | P a g e'
  merge: -1
  img_proc: true
