- pgno: 518
  md: 'Denial of Service (DoS) Attack As we have seen, there is a Wi-Fi protocol frame
    known as the de-authentication (death) frame. It can be used to knock users off
    the AP. We used it above to de-authenticate users forcing them to re-authenticate
    in the WPA2-PSK attack and knock out the legitimate AP in the Evil Twin hack.
    We can also use that frame and aircrack-ng suite to create a Denial of Service
    (DOS) against the AP.


    We can simply use this command to knock users off the AP. As I mentioned earlier,
    in some older AP''s this will knock out the AP entirely and forcing the admin
    to reboot the AP.


    To do so, we simply need to enter: `kali > aireplay-ng -deauth 100 -a <BSSID>
    wlan0`mon This will knock everyone off the AP during the duration of the sending
    of the deauth frames. They can reconnect then afterward. What if we wanted to
    keep the AP offline indefinitely? We could keep running this command over and
    over again OR we could summon up our BASH scripting skills (for BASH


    scripting, see *Linux Basics for Hackers* ) to create a simple script that kept
    running this command at regular intervals.


    This simple BASH script periodically sends these de-authenticate (death) frames
    to the AP, thereby knocking all the clients off and disrupting their Internet
    access. Then, we put our attack to “sleep” for a period of time and restart the
    attack, knocking everyone off again.


    To do so, open Leafpad or any text editor and enter the following; `273 | Pa ge`'
  merge: -1
  img_proc: true
- pgno: 519
  md: '```

    *De Auth Script

    File Edit Search Options Help

