- pgno: 375
  md: 'Finally, Window **#3 , Packet Bytes Pane** , provides payload information in
    both hexadecimal format to the left and ASCII format to the right.


    **Creating Filters in Wireshark** In general, there is way too much information
    here to do an effective analysis. Packets are flying by, hundreds or thousands
    per minute. To use Wireshark effectively, we need to filter the traffic to see
    only those packets of interest . Wireshark has a simple filtering language that
    you should understand to use it effectively and efficiently in any investigation
    or analysis.


    ![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_375_0.png)'
  merge: -1
  img_proc: true
- pgno: 376
  md: '![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_376_0.png)


    The packets flying by our interface are of many different protocols. Probably
    the first filter we want to apply is a protocol filter. Remember, TCP/IP is a
    suite of protocols, and we probably want to focus our analysis to just a few.


    In the filter window, type "tcp." You notice that it turns green, indicating that
    your syntax is correct (it remains pink while your syntax is incorrect). Now,
    click the arrow button to the far right of the filter window to apply the filter.


    When you do, Wireshark filters out all traffic, except the TCP traffic. You can
    do the same for just about any protocol such as “http,” “smtp,” “udp,” “dns,”
    and many others. Try out a few and see what kind of traffic is passing your interface.


    If we want to see traffic only from a particular IP address, we can create a filter
    that only shows traffic coming or going from that address. We can do that by entering
    into the filter window: ip.addr==<IP address> Note the double equal sign (==)
    in the Wireshark filter syntax (similar to C assignment operator). A single “=”
    **does not work** in this syntax.


    In my case here, I want to see traffic coming or going to IP address 192.168.1.107,
    so I create a filter like so: ip.addr'
