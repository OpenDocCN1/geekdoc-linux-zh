  md: '![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_116_0.png)


    The first item it asks for is the name of your host. You can name it anything
    you please, but I left mine with the default “Kali.”


    Next, you will asked for the domain name. It’s not necessary to enter anything
    here. Click **Continue** . The next screen, is very important. Here, you are asked
    for the password you want to use for the *root* user.


    The root user in Linux is the all-powerful system administrator (sysadmin). You
    can use anything you feel secure with. If this were a physical system that we
    are using on the Internet, I would suggest that you use a very long and complex
    password to limit the ability of an attacker'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'cracking it. Since this is a virtual machine that people can’t access without
    accessing your host operating system, password authentication on this virtual
    machine is less important, but still, choose wisely.


    Click **Continue**, and you will be asked to set your timezone. Do so and then
    continue.


    The next screen asks about partition disks. Choose **Guided – use entire disk**,
    and Kali will detect your hard drives and set up a partitioner automatically.


    Kali will then warn you that all data on the disk you select will be erased… but
    don’t worry! This is a virtual disk, and the disk is new and empty, so this won’t
    actually do anything. Click **Continue**.


    Kali will now ask you if you want all files in one partition (a partition is just
    what it sounds like—a portion or segment of your hard drive) or if you want to
    have separate partitions. If this was a production system, you probably would
    select separate partitions for /home, /Var and /tmp, but considering that we will
    be using this as a learning system in a virtual environment, you should simply
    select **All files in one partition**.


    Now you be will asked whether to write your changes to disk. Select **Finish Partitioning
    and write changes to disk**. Kali will prompt you once more to see if you want
    to write the changes to disk; select **Yes** and click **Continue**.'
  merge: -1
