  md: 'completes the do


    The script will then send deauth frames to the AP every 60 seconds for 5000 iterations
    or about three days! Of course, for shorter or longer periods of time, simply
    adjust the second number in the for clause (5000).


    # ## PMKID Attack


    In August 2018, the developers of hashcat announced they had found a new attack
    against WPA2-


    PSK. As we saw above, the cracking of WPA2-PSK involves temporarily disconnecting
    a client from the AP in order to get them to reconnect, where we then capture
    the hash in the 4-way handshake. The good folks at hashcat found that they could
    get the password hash **without** the need for a client to connect, saving us
    one step and significant time and trouble.


    The PMKID attack is capable of getting the information for the WPA2-PSK brute
