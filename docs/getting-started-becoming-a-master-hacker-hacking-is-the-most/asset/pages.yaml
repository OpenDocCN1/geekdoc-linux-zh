    # ## Timestomp


    In some cases, your post-exploitation activities may include accessing or altering
    documents, reading emails, and other file access. In all of these cases, you will
    leave evidence behind for a skilled investigator. Every operating system and file
    system timestamps files. These timestamps include the last Modify, Access, and
    Creation (MAC) dates and times. They are a staple of the forensic investigator
    looking for evidence of compromise and recreating a timeline of events.


