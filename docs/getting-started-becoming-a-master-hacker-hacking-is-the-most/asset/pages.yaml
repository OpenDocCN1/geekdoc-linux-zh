    All of this traffic is susceptible to interception and alteration.




    Before we begin this chapter, please note the title of this chapter is “Web Hacking.”
    Unlike many books on hacking and penetration testing, it is not “Web App Hacking.”
    The reason is that there are **innumerable** ways to hack Web traffic and not
    all of them are attacking the web application or web app.


    To begin this chapter, let’s begin by thinking strategically about web hacking.
    There are many strategies for hacking web traffic, and rather than focus on just
    one, let’s look at the range of possibilities and then focus on just a few. A
    single chapter in a book about hacking can barely scratch the surface, so instead,
    we will focus on strategy and a few examples.


    If you are new to web technologies or need to brush up on the fundamentals, take
    a look at my article on Hackers-Arise covering the basics of web technologies
    at https://www.hackers-arise.com/single-post/2018/07/22/Web-App-Hacking-Web-Application-Technologies-Part-1.


