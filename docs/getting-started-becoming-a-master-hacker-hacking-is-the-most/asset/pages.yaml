  md: 'crack these passwords with john or hashcat. Let’s do it with john.


    ```

    kali > john -format=LM --wordlist=/root/top1000passwords -rules /root/Desktop/passwordhashes.txt

    ```


    Note that we are using **format=LM** . This is informing john that the password
    hashes are in the LM


    (LanMan, this format was first developed by IBM in the 1980’s) format.


    # Remote Password Cracking Online password cracking on remote systems is whole
    different animal from offline password cracking.


    Although they both share a process of guessing the password or brute forcing it,
    on remote systems we likely will encounter lockouts. In other words, after so
    many failed attempts, the account will be locked.


    This limits how many attempts you can make. On some systems this lockout may come
    after just three attempts, on others it may come after thousands of attempts (in
    some cases, there are ways to bypass the lockout). The important point is that
    when cracking online passwords we often do not have unlimited attempts like we
    do with offline cracking.


    Another key issue with online password cracking is that the username and password
    tests (guesses) must be sent in a format that the application expects them. Each
    application uses slightly different formats for their username and password requests.
    In some cases, we may need to capture and analyze that format in order to format
    our requests properly (see Chapter 12, Web Hacking).


    In this section of Password Cracking, we will be using a lightweight, command-line
    password cracker named'
