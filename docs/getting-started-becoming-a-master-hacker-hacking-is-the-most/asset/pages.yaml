    In this chapter we will discuss methods of cracking passwords and some tools to
    do so. There is no single tool or technique that will work on every password,
    so it’s important to think **strategically** when trying to crack passwords.


    We can break down password cracking into several categories, but probably the
    most important distinction is **offline vs. online**. On nearly every modern system
    and application, passwords are stored as hashes (see Appendix A on Cryptography
    Basics for Hackers). This is one-way encryption. An algorithm takes the plain-text
    password and creates a unique indecipherable cipher (hash) of it and stores it.
    When you log in again, the system takes the password you enter, encrypts it again,
    and checks to see whether that encrypted password matches the one it has stored.
    Far and away the most effective method for cracking passwords is to (1) locate
    and grab those hash files, (2) take them offline, and (3) commit the resources
    to cracking them.


    To see what these hashes look like, log into your Kali system as root and go to
    the /etc directory and display that file **shadow** with the cat command.'
  merge: -1
  img_proc: true
