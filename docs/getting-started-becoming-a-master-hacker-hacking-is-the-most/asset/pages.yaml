- pgno: 510
  md: 'accounts, credit card numbers, or confidential meetings and plans. One way
    of doing that is to create an Evil Twin AP. The Evil Twin is an AP with the same
    SSID as the target AP. If the attacker can get the target to connect to their
    Evil Twin AP, then all the traffic will traverse the attacker’s computer. This
    enables the attacker to eavesdrop (listen) to the target’s traffic and even alter
    the messages.


    Build our Evil Twin Let’s start building our Evil Twin. To do so, we need another
    tool from the aircrack-ng suite, airebase-ng. It converts our Wi-Fi adapter into
    an AP, broadcasting, and accepting client connections. We will also need two network
    interfaces. Here, I will be using my Alfa card as an AP and Ethernet connection
    (eth0) to connect to the Internet.


    ```

    kali > airebase-ng -a aa:bb:cc:dd:ee:ff --essid hackers-arise -c 6

    wlan0mon

    268 | Page

    ```


