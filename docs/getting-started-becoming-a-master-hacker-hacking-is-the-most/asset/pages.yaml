  md: 'Less Than


    >=

    Greater than or Equal To <=


    Less Than or Equal To contains


    Protcol or Field Contains a Value matches


    Protcol or Text Field Matches a Regular Expression


    We can now create a filter by simply selecting a field in the left window; select
    a relatication in the upper right window; and select a value in the lower right
    window (values are very often 1 or 0 meaning they exist or do not). For instance,
    if we want to find all tcp packets with the RST flag set, we would enter: tcp.flags.rst==1


    **Following Streams It some cases, rather than examine all the packets of a particular
    protocol or traveling to a particular port or IP, you want to follow a stream
    of communication. Wireshark enables you to do this with little effort.**


    This technique can be useful if you are trying to follow, for instance, the conversation
    of a rogue, disgruntled employee who is trying to do damage to your network.


    To follow a stream, select a packet by clicking on it and then right-click.'
