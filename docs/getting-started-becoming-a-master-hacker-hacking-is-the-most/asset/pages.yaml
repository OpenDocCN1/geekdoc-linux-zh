- pgno: 421
  md: 'After exploiting the target, the attacker usually wants to do **something**
    on the system. This is often referred to as post-exploitation. Using Metasploit,
    we have numerous options with Metasploit commands and post-exploitation modules
    that enable us to: 1. Extract password hashes; 2. Snap or stream the webcam; 3.
    Activate and record from the microphone; 4. Scan the network; 5. Keylog all the
    keystrokes of the target.




    On the MySQL database, because the administrator had used a weak password, we
    are able to extract or dump all the data in the database to our remote system.


    # Exercises


    +   1. Search for all the post-exploitation modules in Metasploit.

