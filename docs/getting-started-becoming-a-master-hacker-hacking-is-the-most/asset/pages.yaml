    # # 6

    ## Active Reconnaissance Only a fool goes to battle without adequate reconnaissance
    Master OTW


    In the Chapter 5 on passive reconnaissance, we gathered vast amounts of information
    about potential targets . In this next phase of reconnaissance, we use active
    techniques to acquire even more information about a specific target.


    In the active reconnaissance phase, we try to determine what ports are open on
    the target (open ports are an indication of services running on the system, such
    as port 445 for SMB) and the firewall. In some 77 | P a g e cases, certain ports
    must be open for an exploit to work on a system. In addition, by scanning the
    ports we can not only determine what ports are open, closed, and filtered (a firewall
    is filtering), but often determine the operating system (ports 135, 139, and 1433
    almost invariably indicate a Windows operating system, for instance) and the'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'applications on the system (ports 1433, SQL Server; port 3306, MySQL; port
    1521, Oracle database; for example).


    Active reconnaissance uses specially crafted packets that we send to the target
    to illicit a response.


    Depending upon how the target responds, our tools can determine: 1. Whether a
    port is open, closed or filtered; 2. Which services and what version is installed;
    3. What operating system is installed; 4. The time since the last reboot (uptime).


    # Nmap


    Whether you are an aspiring master hacker, network engineer, or security engineer,
    there is one tool you need to be familiar with:nmap. Nmap began as a simple, modest
    port-scanning tool with the ability to send TCP, UDP, or ICMP packets to a host
    and its ports to elicit a response. Then, based upon the host’s response, nmap
    determines whether the port is open. Over the years, it has evolved to become
    a powerful scanning tool with even some exploitation capabilities. For instance,
    nmap can be used for: (1) OS detection, (2) service and version detection, (3)
    determining the OS uptime, (4) evading firewalls, (5) doing DNS queries and subdomain
    search, (6) conducting a Denial of Service (DoS) attack, or (7) scanning for vulnerabilities
    and a whole host of other reconnaissance tasks.


    **Nmap in the Mass Media Matrix fans (who isn''t a Matrix fan?) may remember in
    *Matrix Reloaded* that Trinity used to find TCP**


    Port 22 open on the power plant''s computer system (SCADA) and crack the password
    to give Neo physical access.'
