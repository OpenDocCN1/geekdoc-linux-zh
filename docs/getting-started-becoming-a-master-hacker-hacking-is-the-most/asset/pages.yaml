- pgno: 445
  md: 'We have successfully narrowed down our search to just 1.9 million sites.


    As we saw in Chapter 5, Google dorks can also serve as an exploitation strategy
    as well, if our dork can find a data leak with passwords. For instance, many WordPress
    sites automatically make a backup of their database commands and store them on
    the site. These backups often have passwords stored in plain text.


    Let''s look for one.


    inurl:wp-config-backup.txt This Google dork will seek backup files in WordPress
    sites. When we run this Google Dork, we find 108


    results. Let''s click on one.


    As you can see, this site leaked its critical data when it made a backup. Next
    to the first arrow, we see the database name. Next to the second arrow, we find
    the username, and finally, next to the last arrow, we find the user password!


    When people leave their passwords in their websites, the hacking becomes very,
    very simple.'
  merge: -1
  img_proc: true
