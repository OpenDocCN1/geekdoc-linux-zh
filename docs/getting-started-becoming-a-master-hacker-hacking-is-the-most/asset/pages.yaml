    Before we examine SQL injection attacks, we need first to understand a bit of
    SQL. SQL is a simple language that is forgiving on syntax, but demanding on logic.
    The most basic SQL query looks something like this; SELECT <columnns> FROM <table>
    WHERE <conditions> In the SELECT clause, the coder is looking to return data from
    certain **columnns** in tables. In the FROM


    clause, the coder is defining the **table** the columns should be extracted from.
    The WHERE defines the **conditions** that data should meet, such as **city=Detroit
    .**


    This basic query can be used for authentication purposes as well. Imagine a database
    that has every user with their username and password in a table named "USERS."
    We could authenticate our users by asking them for their username and password
    in a form and then checking the database table to see if those two match for a
    single user. Such a query would look like this when the user entered the data
    into the authentication form.'
