  md: '![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_387_0.png)


    As you can see above, Wireshark has listed every IP address with activity and
    some basic statistics for each IP address.


    Now that we understand the basics of using a packet analyzer like Wireshark, let’s
    apply it to a real-world problem —the NSA’s EternalBlue exploit that we used in
    Chapter 9 to exploit the Windows 7 system.


    # ### Using Wireshark To Analyze the NSA’s EternalBlue Exploit


    Throughout this book, we have been focusing on the notorious EternalBlue exploit
    that was stolen from the NSA, possibly by Russian hackers. In this section, we
    want to see what Eternal Blue looks like from a packet-level inspection in Wireshark.
    This analysis can help us to understand how EternalBlue works, which can lead
    to better security to prevent it (creating an anti-virus or IDS’s signature) and
    possibly the development of exploits similar to it.'
  merge: -1
  img_proc: true
- pgno: 388
  md: 'In April 2017, a nefarious group known only as the ShadowBrokers released a
    group of exploits that were stolen from the US National Security Agency (NSA).
    The NSA is charged with protecting US citizens from terrorist and other threats
    to security, but has also been known to spy on US citizens. In this capacity,
    the NSA develops and purchases zero-day exploits. Someone at the NSA in Ft. Mead,
    MD, stole some of the exploits and provided them to this shadowy group, which
    then tried to sell them on the Internet. When no one stepped up to purchase these
    at the minimum asking price (of course, priced in Bitcoin), the Shadow Brokers
    released the exploits to anyone who wanted them.


    Among this group of exploits, there was one known as EternalBlue. This exploit
    took advantage of a vulnerability in Server Message Block (SMB) protocol on port
    445. This protocol enables file, drive, and printer sharing on local area networks,
    among other things. When the exploit works properly, it enables the attacker to
    execute their code (RCE) with system administrator privileges on the target system.
    The exploit is similar to an earlier (but NOT the same, as some have reported)
    exploit against SMB known as MS08-067. Microsoft designated this EternaIBlue vulnerability
    MS17-010 and patched it March 2017'
  merge: -1
  img_proc: true
- pgno: 389
  md: '![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_389_0.png)


    (apparently, the NSA, knowing that the exploits were stolen and would soon be
    released, notified Microsoft and the patch was available before the exploit was
    released).


    Despite Microsoft''s patch, later that same year, both the WannaCry, Petya and
    NotPetya ransomware (see the History of Hacking in Chapter 1 for more on this
    ransomare) attacks utilized the EternalBlue exploit for their malicious purposes
    and wreaked havoc around the world. All told, EternalBlue and its offspring were
    responsible for billions of dollars of damage.


    Given the severity of this exploit and its consequences, it is worth studying
    it—not only to recognize this singular attack, but also to become familiar enough
    with this type of attack'
  merge: -1
  img_proc: true
- pgno: 390
  md: 'to recognize the next variant that is certainly coming in the future.


    You can download a .pcap capture of the EternalBlue exploit here on Dropbox.


    Download eternalblue-success-unpatched-win7-1.pcap from Dropbox here .


    If you are unfamiliar with the Microsoft implementation of SMB (even most experts
    are not) and want to learn more, Microsoft has an excellent reference here.


    Once the pcap file loads into Wireshark, go to packets 6 and 7. Here you see the
    protocol (SMB) negotionation. You should see a **Negotiate Protocol Request**
    and **Negotiate Protocol Response packets** .


    These two packets are initiating the SMB protocol communication.




    ![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_390_0.png)'
