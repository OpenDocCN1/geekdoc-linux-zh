  md: 'Insecure Information Security Firms I always find it a bit amusing how many
    security firms do a poor job of securing their own websites. Most famously, in
    2011, the widely-known and well-regarded US-based information security firm, HBGary,
    228 | P a g e


    ![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_453_0.png)


    had its website hacked. HBGary had been attacking the loosely organized hacking
    group, Anonymous, when Anonymous decided to hack back. Thousands of documents
    and emails were released on the Web that were both embarrassing to the firm and
    its clients (many of the most powerful firms in the United States). I’m not sure
    how their clients felt, but I would be reluctant to pay someone to secure my information
    who can’t secure their own.


    We may have a modern-day HBGary in our midst. The information security firm [www.cybrary.it](www.cybrary.it)


    has a website built on WordPress. Let’s see if their website is secure.


    To scan cybrary.it, let’s use the standard command as we used above, but let’s
    add another option to enumerate the users. This option will attempt to identify
    the users with access to update and alter the site, essentially webmaster rights.
    This option is --enumerate u and we can simply'
  merge: -1
  img_proc: true
- pgno: 454
  md: 'append to our command, such as; kali > wpscan -url [https://www.cybrary.it](https://www.cybrary.it)
    -en umerate u


    When the command is run, it returns an error that the site is NOT running WordPress.
    That’s curious, as I’m quite certain it is running WordPress.


    Sometimes websites have load balancers and DoS protection technologies that limit
