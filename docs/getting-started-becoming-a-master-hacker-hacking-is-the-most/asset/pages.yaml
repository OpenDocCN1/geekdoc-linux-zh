- pgno: 504
  md: 'WPA2-PSK is the most widely used security protocol among Wi-Fi routers. Although
    WPA3 has just been released, it has not yet been widely deployed. As a result,
    let’s focus on WPA2 cracks.


    Unlike some earlier Wi-Fi hacking techniques such as WEP (where you could crack
    the password in minutes using statistical techniques), the strategy with WPA2
    is similar to our password cracking techniques in Chapter 8. With WPA2-PSK, we
    first capture the hash of the password and then we apply a wordlist in a hash
    cracking program such as hashcat to find a match.


    The key is to grab the password hash as it is transmitted through the air. WPA2-PSK
    has what is known as the four-way handshake where the password hash is transmitted
    across the air between the client and the AP. We can capture it there and then
    apply our familiar techniques and resources for password hash cracking.




    ```

