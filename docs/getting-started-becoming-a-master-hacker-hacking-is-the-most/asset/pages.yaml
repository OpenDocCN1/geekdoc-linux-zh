    With modern systems, the password cracking process is to (1) generate a potential
    password; (2) encrypt it with the same algorithm the system used to generate the
    hash; and then (3) compare that hash to the one recovered from the system. If
    they match, you have cracked the password! If they do not, try the next potential
    password until one matches or you reach the end of your list.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '**Cracking Passwords** Although many hacker resources talk about the types
    of password-cracking approaches, I prefer to think of just two of them. The first
    approach is to use a list of potential passwords. These might include: 1. Dictionary;
    2. Dictionary with special characters and numbers; 3. List of commonly used passwords;
    4. Custom wordlist developed by the hacker.


    In any of these cases, the hacker is attempting to automate the guessing of passwords
    (I must say that on many occasions, I have been successful simply manually guessing
    the user’s password). The password-cracking tools take the password candidate
    from the wordlist, encrypt it with the appropriate encrypting algorithm (hashing)
    and then compare the hashes. If they match, then the cleartext password from the
    list that was entered into hashing algorithm is THE password.


    The other approach is to **brute force** the password. A brute-force attack attempts
    all the possibilities until it finds the right password. In other words, if the
    password is eight characters, a brute-force attack would try every combination
    of letters, special characters, and numbers until it arrives at the right password
    (this would be seventy-five characters per position raised to the eighth power,
    or about 1 quadrillion possibilities). This can be very time- and resource-consuming,
    but all passwords are susceptible to brute force attacks. This is not a prudent
    approach (except in the case of short passwords) without using exceptional resources
    such as GPU farm, a botnet, or a supercomputer.


    For the hacker, the most effective approach is to grab those hash files inside
    the system or as they travel outside the'
  merge: -1
  img_proc: true
