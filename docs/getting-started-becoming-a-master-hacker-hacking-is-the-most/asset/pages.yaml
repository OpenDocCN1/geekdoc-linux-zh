    # Msfvenom


    Msfvenom is a standalone payload generator that is capable of creating a custom
    payload, embed it into a file and obscure its function from prying eyes.


    Msfvenom is relatively new to the Metasploit framework. Previously, one had to
    use both the msfpayload and the msfencode functions in Metasploit to create custom
    files and payloads. Now, all that can be done with a single function, msfvenom.


    Let’s begin by looking at some of the options in creating a custom payload/malicious
    file with msfvenom by looking at the help screen.


    ```

    kali > msfvenom -h

    ```


    The key options in using msfvenom are; -p


    the Metasploit payload you want to use -f


    the format of the payload 167 | P a g e


    -e


    the encoder for obscuring the nature of the payload -a


    the architecture you are targeting (x86, x64, Linux, etc. default is x86) -x'
