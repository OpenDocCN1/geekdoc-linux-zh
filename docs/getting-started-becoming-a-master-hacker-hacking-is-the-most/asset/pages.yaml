    # Strategy for Finding the Proper Module As a newcomer to Metasploit, the "search"
    command might be the most useful. When Metasploit was small and new, it was relatively
    easy to find the right module you needed. Now, with over 3000 modules, finding
    just the right module can be time-consuming and problematic. Rapid7 added the
    search function starting with version 4, and it has become a time- and life-saver.
    For the novice hacker to be able to use Metasploit effectively, understanding
    the search function is crucial.'
