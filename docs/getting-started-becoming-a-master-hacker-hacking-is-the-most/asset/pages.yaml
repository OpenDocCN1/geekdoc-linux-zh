- pgno: 416
  md: 'In that case, we have another tool that can grab passwords. This tool, mimikatz,
    was developed by Benjamin Delpy, aka gentilkiwi.


    Mimikatz is capable of extracting and parsing information from RAM. Among the
    most important information we are seeking are the password hashes on the local
    system. When the system boots up, it loads these hashes into RAM, and with a tool
    like mimikatz, we can extract them. Mimikatz has been part of some of the most
    significant hacks in history, including NotPetya and Blackenergy3


    (https://www.hackers-arise.com/post/2018/10/10/scada-hacking-anatomy-of-a-scada-malware-blackenergy-3
    ).


    The first step is, from the meterpreter prompt, to load kiwi (if your target is
    a 32-bit system, you will load mimikatz).


    meterpreter> load kiwi Once kiwi has loaded, we can simply run the following command
    to extract the hashes out of the running system’s SAM file: meterpreter> mimikatz_command
    -f samdump::hashes 207 | P a g e'
