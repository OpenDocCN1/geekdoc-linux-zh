    Created


    These timestamps can be evidence of accessing and alteration of files. A thorough
    and skilled forensic investigator can use these timestamps to recreate the events
    on the system, including any alteration of files. To cover your tracks, you will
    need to alter these timestamps if you have “touched” any files.


    Luckily, altering timestamps is not difficult to do. If you plan to access or
    alter any files, first record the original timestamps. Once you have accessed
