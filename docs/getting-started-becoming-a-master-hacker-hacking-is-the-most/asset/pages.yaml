  md: 'While many hackers hammer away on cracking the WPA2 hash, some find it more
    effective to simply social engineer the password from the target. That''s where
    wifiphisher comes in. This tool is designed to:


    +   1. Create a clone of the target AP; 2. Deauthenticate the user from their
    actual AP; 3. Associate them with the fake AP; 4. Present the user with an authentic-looking
    firmware update screen and ask them to provide their password to continue.


    You and I are unlikely to give up our password so easily, but my experience is
    that most others will.


