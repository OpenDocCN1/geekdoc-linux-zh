    By contrast, the following tools ARE effective and useful: 1. BeEF or the Browser
    Exploitation Framework; 2. Wi-Fiphisher;


    3. Spoof SMS;


    4. Fileformat vulnerabilities; Social Engineering Techniques and Tools There are
    many tools that are useful for social engineering, but in this section, I want
    to demonstrate just a few.


    **BeEF or Browser Exploitation Framework The Browser Exploitation Framework or
    BeEF, for short, enables you to take control of the target’s browser. It relies
    upon your ability to get the target to click on a malicious Javascript link, and
    once they do, you are inside their browser! Once inside, there is considerable
    mischief you can do, including: 1. Resetting or DoSing their router; 2. Social
    engineering them to give up their passwords; 3. Send their browser to other malicious
    web sites; 4. Social Engineer them to give you access to their webcam.**


    Depending upon the version of Kali you are using, BeEF may not be installed by
    default but is in the Kali repository. If'
