    23 | Page


    # Wireshark


    Wireshark is one of those fabulous tools with which nearly everyone in the IT
    industry should be familiar.


    Wireshark is a sniffer that enables us to examine every packet, and thereby analyze
    what is wrong with our network or what the intruder was trying to do.


    Wireshark enables you to interactively browse the data, develop display filters,
    and view a reconstructed stream of a TCP session. It can interpret hundreds of
    different protocols and each of their structures.


    Unfortunately, Wireshark has had its own issues with security vulnerabilities
    in recent years.'
