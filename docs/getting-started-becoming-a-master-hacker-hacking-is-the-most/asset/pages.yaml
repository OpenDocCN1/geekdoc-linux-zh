  md: '![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_167_0.png)


    What if we were looking for only Cisco routers? Remember, Shodan indexes the information
    it pulls from the web interface, so if the interface announces to the world that
    it is a Cisco device (vigilant security administrators can suppress the banners
    or even put in a fake banner), Shodan indexes it as such, and we can search for
    that keyword. For instance, if we put the word Cisco in the search engine, we
    pull up over three million devices!


    Because Shodan indexes the IP address of every web interface it pulls, and IP
    addresses are distributed to geographically specific locations, we can search
    Shodan by location. If we only wanted to find Cisco devices in India, we could
    search Shodan with: Cisco country:IN


    When we do so, Shodan narrows our search down to just 71,147 devices. Still, a
    pretty unwieldy amount, but more workable than 3 million.


