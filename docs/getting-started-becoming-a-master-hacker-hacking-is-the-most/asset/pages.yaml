- pgno: 4
  md: 'I want to thank everyone from the Hackers-Arise community who offered their
    comments and questions during the early stages of developing this manuscript.
    In particular, I want to thank Artur Zeilinski for his diligent assistance and
    comment throughout this process. In addition, I want to thank a hacker known only
    to me as “Locke” for his assistance.


    iv | Page


    # Preface


    # My Friends:


    Thank you for picking up this book. I hope you find it informative and enlightening.
    It is


    intended to help guide you into the most exciting career in the 21st Century!


    Before you begin, I want to point out a few elements of this book that I hope
    you will enjoy.


    # Hacking Process and Strategy


    Hacking is a process. It is not just learning a bunch of technologies and tools.
    The master hacker must be strategic and analytical in their approach. Unfortunately,
    I don''t believe this has been emphasized enough among other introduction to hacking
    books. To that end, I hope you find this


    emphasis here useful and enlightening.


    # Keep it Brief'
  merge: -1
  img_proc: true
- pgno: 5
  md: 'Knowing that few will read and study a 1000-page tome, I have tried to keep
    this book to a


    manageable size with the thought that those that want to learn more, there are
    many resources.


    There are a multitude of web sites (I tried to give you links to more in-depth
    information on


    hackers-arise.com) and innumerable books. This book is designed to get you started,
    not make


    you a master hacker. That is long journey, but this is the first step.


    # Case Study of the NSA''s EternalBlue


    To demonstrate key principles throughout this book, I have focused upon a case
    study of the


    NSA''s EternalBlue exploit. This two year old exploit was stolen from the US espionage
    agency


    in 2017 and it was responsible for wreaking havoc around the world. It was integrated
    into many


    attacks including most famously the WannaCry, Petya, and NotPetya ransomware.
    In this book,


    I use it as a case study in vulnerability assessment in Chapter 7, exploitation
    in Chapter 9,


    sniffing for exploit analysis in Chapter 10, and Python in Chapter 16. I hope
    you find this


    approach informative and enlightening.


    Happy Hacking,'
