    Hping3 can create TCP, UDP, ICMP, and RAW IP packets. This enables us to create
    an almost infinite variety of packets that we can use to get past IDSs, firewalls
    and scan systems behind them.


    Unlike nmap, though, hping3 requires a bit more user input to be effective. For
    instance, when we scan with nmap, nmap will interpret the results for us. On the
    other hand, hping3 will give us raw packet responses and we need to do the interpretation
    ourselves. This is probably one of the primary reasons hping3 is not as popular
