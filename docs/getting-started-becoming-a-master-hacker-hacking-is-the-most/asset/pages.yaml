    # Dedication


    This book is dedicatcd to my three exquisite daughters who mean the world to me...


    ...and Laura, who offered emotional support and encouragement throughout.


    Thank you


    ii | P a g e


    # About the Author


    Occupytheweb is the *nom de guerre* of a security researcher and forensic investigator
    with over 20 years in the industry. He is a former university professor who now
    offers hacker and information security courses at [www.hackers-arise.com](http://www.hackers-arise.com).


    Occupytheweb has trained hackers at every one of the US military branches and
    the national intelligence agencies.


    To learn more about Occupytheweb and listen to interviews with him, go to www.hackers-arise.com/otw-in-the-news


    iii | P a g e


