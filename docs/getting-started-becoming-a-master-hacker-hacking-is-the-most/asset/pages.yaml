- pgno: 320
  md: 'I usually run this command after selecting my exploit. It simply helps me understand
    the key features of an exploit before using it.


    ```

    msf5 > set

    ```


    This command is used to set options within the module you selected. For instance,
    if we look above at 148 | P a g e the **show options** command, we can see numerous
    options that must set, such as, **URIPATH , SVRHOST** , and **SVRPORT** . We can
    set any of these variables with the set command such as; msf5 > set SRVPORT 80


    This changes the default SVRPORT (server port) from 8080 to 80.


    ```

    msf5 > unset

    ```


    This command, as you might expect, **unsets** the option that was previously set.
    Such as; msf5 > unset SRVPORT


    As you can see, we first set the SRVPORT variable to 80 and then unset it. It
    then reverted to the default value of 8080 that we can see when we typed show
    options again.


    msf5 > exploit Once we have loaded our exploit and set all the necessary options,
    the final action is "**exploit** ." This sends the exploit to the target system
    and, if successful, installs the payload.


    The exploit starts and is running as backgound job with a reverse handler on port
    4444. This exploit then started a web server on host 0.0.0.0 on port 80 with a
    randomized URL (F5pmyl9gCHVGw90). We could have chosen a specific URL and **set**
    it by changing the URIPATH variable with the set command.'
