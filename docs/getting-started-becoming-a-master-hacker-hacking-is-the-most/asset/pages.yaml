    \ in the IP header (TOS, TTL, and DF) and theTCP header (Window Size).\n\nLet’s\
    \ take a look at each of these fields.\n\nFirst, the Type of Service in the IP\
    \ header or **TOS** . That field can have four (4) different values: \n* Minimize\
    \ Delay\n* Maximize Throughput \n* Maximize Reliability \n* Minimize Monetary\
    \ Cost Second, the **Flags** field. This field shouldn't be confused with the\
    \ TCP flags (S,A,F,U,P,R). The TCP"
  merge: -1
