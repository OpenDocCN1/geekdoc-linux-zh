  md: 'section, as it will likely make your journey into Python a bit

    easier.


    In the figure below, we illustrate the concept of the OOP

    model. As you might surmise, OOP revolves around the

    concept of an object. The object has properties in the form

    of attributes and states, as well as methods that are actions

    performed by or on the object.


    The idea behind OPP programming is to create objects that

    act like things in the real world. For example, a car is an

    object that has properties, such as its wheels, color, size,

    and an engine. That same car has methods, which are the

    actions the car takes, such as accelelerating, starting,

    stopping, and locking. From the perspective of natural

    language, an object is a noun, a property is an adjective,

    and a method is a verb.


    Objects then are members of a class, which is like a

    template for creating objects with shared initial variables,

    properties, and methods. For example, if we have a class

    called cars, our car (Audi) would be amember of the class of

    cars. This class would also include other objects/cars, such

    as Toyota and BMW.'
  merge: -1
  img_proc: true
- pgno: 531
  md: '![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_531_0.png)


    Classes can also have subclasses. Our car class has an Audi subclass, and an object
    of that subclass might be an Audi A8.


    Each object would have properties (make, model, year, and color) and methods (start,
    lock, drive, and park).


    In OOP languages such as Python, objects inherit the characteristics of their
    class; the AudiA8 would inherit the methods (start, lock, drive, and park) from
    its class “car.”


    These OOP concepts are critical to understanding how Python works, as you will
    see as you progress through this chapter, and your Python skills develop.


