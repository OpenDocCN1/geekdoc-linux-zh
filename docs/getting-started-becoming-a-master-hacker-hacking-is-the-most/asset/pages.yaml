    # Scanning the Internal Network


    Very often, the ultimate target of our attack is different from the system we
    compromised. The ultimate target may be another system on the network, such as
    the database or domain controller on the same network. Now that we have a foothold
    inside the network, we may be able to leverage that foothold to compromise the
    entire network!


    The first step to compromising other systems on the network is to scan to see
    what is available on the network. Ultimately, we want to pivot from the compromised
    system to other computers and devices on the same network.


    To find out what other systems are on the network, the meterpreter has a post-exploitation
    command, arp scanner. Address Resolution Protocol is used to map MAC addresses
    to IP addresses on the LAN.


    This tool emulates this process to get the systems on the network to give up their
    IP and MAC addresses.


    Now we know each of the systems on the network!


    ```

    meterpreter > shell

