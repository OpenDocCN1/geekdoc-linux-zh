- pgno: 400
  md: '# **Summary**


    Detecting and preventing network attacks is a crucial responsibility of the network
    and information security engineers. Without knowing what the attack looks like
    from the packet-level makes that task challenging, if not impossible. Here, by
    analyzing the EternalBlue attack packet-by-packet, we can be better prepared to
    prevent this or similar type attack on our network.


    Wireshark is an essential tool in the toolbox of any information security engineer
    or hacker. This tool can provide us insights into what is happening in our network
    and even analyze network attacks to prevent them or re-engineer new ones. Tcpdump
    is an excellent tool for network traffic analysis when the a GUI is not available
    or the system is remote.


    # **Exercises**


    +   Create the following Filters in Wireshark on your live traffic;

    (1) TCP IP address (2) TCP destination IP address (3) TCP flag RST

    (4) IP DF flag

    (5) Filter for all traffic leaving your IP address (6) Filter for the term “hackers-aris
    e”


    # **11**'
  merge: -1
  img_proc: true
- pgno: 401
  md: '![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_401_0.png)


    ![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_401_1.png)


    # 1 1


    # Post Exploitation Never become predictable Master OTW


    **Once we have successfully exploited the target system, like we did in Chapter
    9, our job has just begun! We didn’t exploit the**


    system just to get inside and send a greeting. We exploited the system for a purpose.
    That purpose is often called post exploitation in the hacking/penetration testing
    world. In the nonpenetration testing world,it’s called “getting the goodies.”'
  merge: -1
  img_proc: true
- pgno: 402
  md: 'An exploit gets us inside the target system, and the payload enables us to
    connect to, and operate inside, the target system. Now that we are inside, we
    need to decide what we want to do there. Do we want to: 1. Grab the passwords?


    +   2. Listen to their conversations?


    +   3. Place a keylogger on the system to record all their keystrokes?


    +   4. Turn on their webcam, take snapshots or stream video?




    ![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_402_0.png)


    +   5. Scan the network to find a particular system such as the database server?


    +   6. Or simply use the target system as a foothold to take over the entire network?


    In this chapter, we will assume a scenario where we are working for our national
    espionage/intelligence agency and have been charged with obtaining information
    from the target for national security purposes.


    We will attempt to do each of the tasks enumerated above on the target system.'
  merge: -1
  img_proc: true
- pgno: 403
  md: "**Post-Exploitation Capabilities Once we are inside the system, our capabilities\
