    **Information Gathering** Before attempting a social engineering attack, it’s
    best to gather as much information about the target as possible. This will enable
    you to design an attack that is tailored to the individual’s needs and wants.
    For instance, if you had discovered through social networking sites and other
    sources that the individual is an avid golfer, emails and URLs tailored to that
    person will likely have a greater chance of success. In addition, information
