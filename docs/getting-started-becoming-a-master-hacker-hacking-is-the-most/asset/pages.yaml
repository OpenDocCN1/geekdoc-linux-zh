  md: '# The if Statement


    The if control structure in Python is very similar to the if control statements
    in other programming languages, including BASH (for more on BASH see *Linux Basics
    for Hackers*). An if statement is used to check whether a statement is TRUE or
    FALSE and then run different code based upon the results of that condition.. The
    syntax looks similar to this: if <a conditional statement that evaluates to TRUE
    or False> <code to run if statement above is TRUE> The if statement contains a
    condition that might be something like: if variable < 10


    If the condition evaluates to TRUE, then the code that follows is executed. If
    the statement evaluates to FALSE, then the next statements are skipped and not
    executed.


    The statement (s) that follow the if statement are referred to as the control
    block, and in Python, the control block must be indented. It is the indentation
    that identifies the control block. The next statement NOT indented is outside
    the control block and not part of the if statement. This is how Python knows what
    lines of code to execute when the if evaluates to TRUE and where to go to if it
    evaluates to FALSE.


    # If...else


    In Python, the if...else structure looks like this; if <conditional statement
    that evaluates to TRUE or FALSE> <statements to run if TRUE> else


    <statements to run if FALSE> As with the if statement, the Python interpreter
    checks to see whether the condition following the if statement evaluates to TRUE
    or FALSE. If it'
  merge: -1
  img_proc: true
- pgno: 551
  md: 'evaluates to TRUE, the statements in the control block are executed. If it
    evaluates to FALSE, the statements in the control block after the else are executed
    instead.




    # **elif**


    A variation on the if...else statement is the **elif** statement. While the if...else
    statement allows you to execute **one** statement or block of code, there are
    times when you may have many possible clauses to execute. The **elif** enables
    you to nest multiple cases of possible outcomes and execute the appropriate statement
    or block of code to the circumstance.


    An **elif** follows an if or another elif. **Elif** is short for “else if.” In
    simpler terms, the **elif** enables you to provide another condition to evaluate
    if all the previous conditions have evaluated to FALSE. It’s important to note
    that only one block of code will be executed, so order matters!


    ```

    ```

    if port==22

    print("This open port is running SSH")


    elif port==25

    print("This open port is running SMTP")


    elif port==53

    print("This open port is running DNS")


    elif port==80

    print("This open port is running HTTP")

    ```

