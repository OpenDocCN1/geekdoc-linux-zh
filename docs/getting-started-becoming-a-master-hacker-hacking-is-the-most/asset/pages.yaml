    information about themselves and their company. This information can include the
    nameserver, registrar, contact name, address, phone number, and email address.
    All of this information may be useful to the attacker.


    This information is maintained by the registrar and a central registry is maintained
    by InterNIC. We can query (port 43) these databases for this basic information
    by using the'
