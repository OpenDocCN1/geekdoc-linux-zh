    In no particular order, my choices are; Nmap


    This is an essential tool for port scanning and much more. Among the very first
    port scanners developed, Nmap is still going strong after over twenty years. Its
    primary purpose was to probe target systems for open ports and services, but in
    recent years Fyodor and the nmap community have added additional capabilities,
    including nmap scripts that expand this tool in many new directions. See Chapter
