    (4) knowingly and with intent to defraud, ac-cesses a protected computer without
    author-ization, or exceeds authorized access, and by means of such conduct furthers
    the intended fraud and obtains anything of value, unless the object of the fraud
    and the thing obtained consists only of the use of the computer and the value
    of such use is not more than $5,000 in any 1-year period;


    +   (5)(A) knowingly causes the transmission of a program, information, code,
    or command, and as a result of such conduct, intentionally causes damage without
    authorization, to a protected computer;

    (B) intentionally accesses a protected computer without authorization, and as
    a result of such conduct, recklessly causes damage; or

    (C) intentionally accesses a protected computer without authorization, and as
    a result of such conduct, causes damage and loss.


    # USC Title 18 Section 1030


    This section is key as well. It defines ways that a computer might be damaged
    such as "transmission of a program, information, code or command" or "accesses
    a protected'
