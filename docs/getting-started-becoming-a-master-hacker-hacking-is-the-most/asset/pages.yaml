    **BSSID -**


    Basic Service Set Identifier: this is the unique identifier for every AP.


    It’s the same as the MAC address of the AP.


    **Channels -**


    Wi-Fi operates on channels 1-14 but is limited to 1-11 in the United States.


    **Power -**


    The closer you are to the AP, the stronger the signal. The signal in the United
