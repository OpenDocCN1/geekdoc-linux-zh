- pgno: 172
  md: 'Shodan enables us to search for the world for vulnerable web interfaces and,
    with the help of just a few keywords, narrow our search to a specific type and
    location of web interfaces.


    # Information Gathering using DNS


    As you know, the Domain Name System, or DNS, is a protocol used by the Internet
    to translate domain names into IP addresses and vice versa. It stores information
    on every domain, enabling us to type in a domain name (microsoft.com) to access
    their website, versus remembering thousands of IP addresses. This database of
    domain names and URLs can be used to gather information on our target without
    ever having to touch the target’s computers or networks. It can reveal a surprising
    amount of information that we can then feed back into our attack. By querying
    the DNS database, we can gather information while appearing to be a typical DNS


    query and not alerting security devices or admins of our activities (for more
    on DNS, see https://www.hackers-arise.com/single-post/2019/05/20/Network-Basics-for-Hackers-Domain-Name-Service-DNS-and-BIND-Theory-Vulnerabilities-and-Implementation
    ) **Querying DNS about the target** As most of you know, DNS can be queried directly
    by using the **nslookup** and **dig** commands. Working from Linux, we can use
    either; but if we are working from Windows we are limited to **nslookup** . I’m
    assuming that most of you have used these utilities, so I won’t go into great
    detail here, but I’ll instead provide a brief review for those who are new to
    this subject.'
  merge: -1
  img_proc: true
- pgno: 173
