  md: 'later in this chapter we will add a module to our Metasploit framework and
    we will need to know where to place it.


    # A Word About Exploitation Success Hacking, or exploitation, is NOT simply choosing
    an exploit and “throwing it against a system” and...


    Voila!...you are inside the system (although I wouldn’t blame you for believing
    that based upon the millions of YouTube videos that depict hacking that way).
    Hacking is a process; sometimes a tedious process. Even when you have selected
    the right exploit, it still doesn’t work.


    If I depicted hacking as easy and always successful, I would be doing you a disservice.
    Often hacks fail.


    You are trying to make a system do something it was NOT supposed to do. In some
    cases, you are breaking a service or system to gain access. This is very unlike
    the work of a system or network administrator who is trying to get the system
    to work as it was intended to work.


    If you run into difficulty performing the hacks I display in this book, consider
    it a reflection of the real world. Hacking is not easy or always successful. As
    I point out in Chapter 2, two of the key qualities of hackers are persistence
    and creativity .'
  merge: -1
  img_proc: true
- pgno: 329
  md: '![](img/ae0bf680ecd2ea15f7b4172e1f4a3412_329_0.png)


    Having said all that, Metasploit exploits are well tested to work against the
    systems they are targeting.


    Even with that, they do NOT always work. To illustrate this point, enter the show
    exploits command again from the msfconsole.


    msf5 > show exploits You will see hundreds of exploits. Please note the 5th column.
    In this column, the good folks at Rapid7


    give us an indication of the probable success of the exploit module. These rankings,
    in order of their likely success, are;


    +   1. Excellent


    +   2. Great


    +   3. Good


    +   4. Average


    # 5. Manual'
