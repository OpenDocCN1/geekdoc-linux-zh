- pgno: 595
  md: '# Summary


    Social engineering is often the most overlooked technique by the novice hacker,
    but some of the most important hacks, by some of the most sophisticated hackers
    (NSA, GRU, and others) in history have been the result of effective social engineering.
    Social engineering requires that the attacker study the target to understand their
    interests, needs, and wants to prepare an effective approach. This research and
    study often involves open-source intelligence and then combines that with a bit
    of psychology. Even the most secure organizations are susceptible to social engineering
    attacks.




    # Exercises


    +   1. Practice trying to get a friend to do what you want. Try using each of
    the concepts (1) elicitation (2) pretexting or (3) influence. Try out different
    scripts to see what works best.


    +   2. Set Up Wiffiphisher in your home and see whether you can fool family members,
    roommates, or friends with the Netgear firmware update.


    +   3. Create a fileformat exploit with Metasploit and try sending it to a friend
    or associate.


    +   4. Go to SMS Spoof and try sending a spoofed SMS message to yourself froma
    friend''s phone number.'
