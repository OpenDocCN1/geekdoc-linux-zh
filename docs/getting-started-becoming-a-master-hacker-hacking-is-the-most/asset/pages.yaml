    **Controversial Use of Sniffers** For over twenty years, the Federal Bureau of
    Investigation (FBI) in the United States has used a tool they term “Carnivore.”
    This tool is used to sniff and analyze the traffic of people suspected of committing
    crimes. It is very controversial, but legal, as it allows the FBI to eavesdrop
    on network traffic without a warrant.


    **Prerequisitites to Sniffing** It’s critical to point out that to effectively
    use a network sniffer, your network interface card (NIC) should be in promiscuous
    mode. This means that your NIC picks up ANY packet traversing the network.


    Usually, NICs only pick up packets that are intended for its particular MAC (globally
    unique physical) address.


    The other critical point to understand with network sniffing is that the standard
    file format for sniffing is .pcap (packet capture). This means your system must
    have a library (a bit of reusable code) to put the packets into this format. These
    libraries are libpcap on your Linux system or Winpcap on your Windows system.


    **tcpdump in Action** Before we examine the powerful GUI-based snifferWireshark,
    let’s take a brief look at the command line sniffer, tcpdump. Tcpdump was among
