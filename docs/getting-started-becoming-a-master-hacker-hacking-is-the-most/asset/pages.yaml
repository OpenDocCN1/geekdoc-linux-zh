- pgno: 424
  md: 'One of the most popular areas of web hacking is attacking the client-side controls.


    # ## 2. Hacking Authetication


    Hacking authentication can include bypassing authentication such as capturing
    tokens and replaying them, client-side piggybacking, cross-site request forgery,
    and of course, cracking usernames and passwords (see the section below on harvesting
    usernames from WordPress sites and brute-forcing their passwords).


    # ## 3. Hacking Session Management


    Session management enables an application to identify a user across multiple requests
    uniquely.


    When a user logs in, session management enables the user to interact with the
    Web app without having to reauthenticate for every request. Due to its key role,
    if we can break the application''s session management, we can bypass the authentication.
    In this way, we won''t need to crack the username and password to gain access.


    # ## 4. Hacking Access Controls & Authorization In this area, the hacker fingerprints
    access control lists (ACL) and attacks the ACLs in ways that will allow a hacker
    to violate the ACLs.


    # ## 5. Hacking Back End Components


    Hacking back end components includes SQL injection with tools such as sqlmap (see
    the section below on SQL injection), but also includes attacks and injection against
    XPATH and LDAP.'
