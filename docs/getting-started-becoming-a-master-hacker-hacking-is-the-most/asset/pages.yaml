    # ## The Hacker Process Hacking is a process, not a technology or tool.


    Master OTW


    In reality, hacking shares few similarities to the hacking portrayed in movies
    and television shows .


    To keep it attractive to the masses of lay and technically challenged viewers,
    these shows usually portray hackers with swiriling geometric objects and animations
    on their computer screens. Then, in a matter of seconds, the hacker has access
    to all of the computer’s resources.


    28 | P a g e


    In real life, hacking can be a long, tedious process that sometimes can take days,
    weeks, or even months.


    There are cases in the annals of hacking (for instance, the Carbanak Hack) where
    the attackers patiently worked for six to twelve months before compromising a
    highly valuable system such as a bank or national security system. Successful
    hackers spend a great deal of their time on reconnaissance of the systems, the
    network, and the users.


    There was a time when a hacker could use a single exploit to enter just about
    any Windows system (Conficker worm, MS08-067) and occasionally a similar exploit
    still appears in the modern era (such as EternalBlue; we’ll be working with the
    EternalBlue exploit through this book). As systems have become more and more secure,
    exploits have had to become more and more specialized. For instance, you may need
    to know the following to successfully exploit a system: 1. The operating system;
    2. The service pack of the'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'operating system; 3. What ports are open on the target system; 4. What services
    are running on the target system; 5. What applications are running on the target
    system; and 6. What language is used on the target system.


    Sometimes, even more information is necessary. This specificity is why reconnaissance
    is so critical. You need to determine all this information before even beginning
    the game. In some cases, reconnaissance may take up to 90 percent of the time
    of the entire operation.


    Reconnaissance is not as sexy as popping shell on the target system, but it is
    supremely critical in this era.


    If your reconnaissance is inadequate, all of your efforts will likely go for naught.


    Although hacking is NOT a cookbook activity (a great hacker is creative and analytical.
    See Hacker Essentials in Chapter 2), we can generalize and say that you should
    take the following steps in your hacking process.


    # ## Fingerprinting


    Fingerprinting is the process of enumerating the following attributes of a target:
    1. Users

    2. Hosts

    3. Network Topology 4. Operating Systems


    # # 5. Services


    The hacker can gather all of this information in a multitude of ways. Generally,
    our discipline categorizes these as either active or passive. Let''s take a look
    at each of these below.'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'Passive Reconnaissance Passive reconnaissance is the process of learning about
    the target without ever directly interacting with it.


    In other words, you can gather information about the target from third-party sources,
    such as DNS, Shodan, Netcraft, Google, social networking sites, and others. The
    key to passive reconnaissance is to gather as much information about the target
    as you can without ever interacting with it and alerting the target of your interest.
    All the information comes from sources that have gathered the information previously.
    All we do is then harvest that information. In some circles, these techniques
    are known as open-source intelligence or OSINT (for more on OSINT, see www.hackers-arise.com/osint
    ). In some cases, finding key information about the target can be critical to
    effective and efficient password cracking (see Chapter 8).


    Active Reconnaissance Active reconnaissance, as you probably already guessed,
    is information gathered while actively interacting with the target. Active reconnaissance
    is risky, but usually provides the attacker with more reliable and accurate information.
    Very often, this is through port scanning with tools such as nmap, hping3 or banner
    grabbing (see Chapter 6). Much more specific information can be gathered in the
    active reconnaissance phase, but it risks detection by the target, as every packet
    and probe has the signature of the sender. This phase of reconnaissance also risks
    triggering security devices such as firewalls and intrusion detection systems
    (IDS).'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Password Cracking


    Password cracking is a specialty that—when successful—can render significant rewards
    to the practitioner. In 2019, most systems are still protected by a single password
    and not the two-factor authentication (2FA) that would make them so much safer.
    If you can crack the password, you gain all the user’s permissions and rights.


    As security has become more and more important, passwords have become more and
    more difficult to crack. A password from the dictionary or other common alphanumeric
    combinations (qwerty, 12345678, etc.) can be broken in seconds. On the other hand,
    a ten-character password containing upper- and lower-case letters, numbers, and
    special characters would require a brute-force attack to attempt 56,000,000,000,000,000,000
    possibilities! Depending upon the tool the hacker uses, such a brute-force attack
    can take a very, very long time. Despite this—from the captured password dumps
    on the dark web—we know that the favorite passwords are:


    +   1. 123456

    2. password

    3. 123456789

    4. 12345678

    5. 12345

    6. 111111

    7. 1234567

    8. sunshine

    9. qwerty'
