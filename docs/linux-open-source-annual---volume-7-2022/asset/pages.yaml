    Kubernetes is a powerful tool, and is complex. To get an overview, we need to
    introduce some terms with Kubernetes. Kubernetes runs applications which are grouped
    into pods. A pod is a group of closely linked containers that are deployed on
    the same host and share resources. The containers in a pod can interact and perform
    functions, such as an application and a logging container with specific settings
    for the application.


    For Kubernetes components are the API Server, the Scheduler, the Controller Manager
    and the database etcd. The API Server is the heart of Kubernetes, and acts as
    the primary management interface which may be generated by a variety of sources
