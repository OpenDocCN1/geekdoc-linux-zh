    # ## Grav Designer 8/10


    Promotional literature for Grav commonly shows artistic design applications, which
    hints at the fact that it has more advanced drawing facilities than most vector
    editing packages. However, we''re in favor that the more sophisticated features
    won''t normally be needed for technical applications, so they''ll generally be
