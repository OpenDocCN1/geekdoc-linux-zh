  md: '# Communication


    Chat securely or set up your own social network. In your face, Facebook!


    # JITSI


    An all-in-one messaging app, Jitsi has an impressive set of audio and video-referencing
    features. As a VoIP client, it allows you to make calls using the Session Initiation
    Protocol (SIP). It has all the features you would expect from a softphone that
    it can put, on hold, and record calls. It can also register-SIP calls to other
    Jitsi users on the local network.


    You can use Jitsi to make video calls to one user or others on both SIP and XMPP
    networks, while using Jitsi Videobridge, you can host multi-user video calls.
    A capable client with unique features including the ability to share and share
    the desktop of both ends of the call at the same time. https://jitsi.org/


    ![](img/77609ebc8773ced089e75787331e1931_171_0.png)


    # ROCKET.CHAT


    Billing itself as the ''ultimate'' chat platform, Rocket.Chat is filled with useful
    features. In addition to essentials like threaded conversations and the ability
    to edit and delete messages, the collaborative communications servers offer several
    interesting things such as Rocket.Chat to share conversations with your visitors.


    You can roll out Rocket.Chat on snap-distributed with a single command and deployments
    over Docker and a wide range of PaaS. You can import your data from any other
    service like Slack or Discord and the Slack plugin also import messages received
    in a Slack channel or private group into Rocket.Chat. In real time.


    # TOX


    If regular clients are not secure enough for you, use the Tox protocol which encrypts
    all chats with the NaCl encryption and identity of a central server, routes over
    direct P2P connections between users. It uses Tox IDs, which are little bits of
    peers for greater anonymity. https://tox.chat


    ![](img/77609ebc8773ced089e75787331e1931_171_1.png)


    There are several apps that can use the Tox protocol and the most popular of ones,
    which works on several platforms.


    Rocket.Chat also enables you to have a video conference with your team. You can
    also record and send voice messages publicly or a private conversation. https://rocket.chat/


    # BEEBEEP


    An IM client with a difference, BeeBeep is designed to connect directly with your
    peers on network. It will automatically detect the BeeBeep users on the network
    and provides all the features of a modern chat app and encrypted text messages,
    share files. http://beebeep.org/


    # OPENFIRE


    There are several XMPP servers available but Openfire is one of the easiest to
    manage. It implements many of the common functions used by the XMPP protocol.
    You can use any XMPP-compatible client to chat with Openfire. It works with its
    own Spark client. https://ignfire.org/projects/openfire


    ![](img/77609ebc8773ced089e75787331e1931_171_2.png)


    # SIGNAL


    The messaging app helps secure communications over the mobile network. It is endorsed
    by security experts and uses end-to-end encryption to secure all text and video
    calls. https://signal.org/


    # RIOT.IM


    The Matrix protocol enables users registered with one provider to seamlessly communicate
    with users of any other provider. It is one of the best clients based on the Matrix
    protocol. http://riot.im/


    # RETROSHARE


    A P2P communication and file sharing platform, Retroshare creates encrypted connections
    between friends. You can share your private keys privately or exchange them via
    a chat server. http://retroshare.net


    # SOGO


    One of the best alternatives to MS Exchange, Sogo has all the necessary functions
    with native mobile clients. Try the online demo before deploying it on your server.
    https://sogo.nu


    # HUMHUB


    With HumHub you can deploy your own network on the internet. It has the standard
    network features you''d expect and the project''s website hosts an online demo
    as well. https://www.humhub.org


    ![](img/77609ebc8773ced089e75787331e1931_171_3.png)


    ![](img/77609ebc8773ced089e75787331e1931_171_4.png)'
