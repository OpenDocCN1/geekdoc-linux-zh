    Borg is a system that manages containers in Google''s data clusters and keeps
    Google''s applications, both production and running, enduring despite hardware
    failure, resource exhaustion or other issues that might have otherwise caused
    an outage. It is by handling the thousands of nodes that make up a Borg cell and
