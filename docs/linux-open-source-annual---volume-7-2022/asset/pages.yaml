  md: '# # Productivity


    Put some order into your life with these features, web filtering and admin tools.


    # ## OSMO


    A personal information manager (PIM) helps you keep track and organise the information
    coming from various sources. Osmo is a lightweight PIM that manages appointments,
    tasks, contacts and notes. The app has a straightforward and integrated interface
    with four tabs on the Calendar, Tasks, Contact and Notes. The program lacks action-linked
    buttons at the top of which you switch between


    components. The Calendar provides a simple functional calendar with some related
    information such as the number of days to the end of the year. You can double-click
    to add notes or right-click to delete them.


