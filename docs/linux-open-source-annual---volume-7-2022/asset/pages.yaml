    # Roundup


    Alexander Tolstoy

    likes nothing better than rolling up his metaphorical sleeves and seeing what
    new gems the open source community has to offer.


    Gimp >> Rawtherapee >> Darktable >>nLightzone >> Pixeluvo


    # Photo editors


    Keen photographer Alexander Tolstoy keeps his imperfect snaps, for fixing later,
    using some of the best photo editors available for Linux.


    # HOW WE TESTED...


    Editing photos isn''t the same as editing general images.

    Therefore we decided to compare some of the photo editors for Linux with a focus
    on common faults, enhancing colours and lost details that might be considered
    for good.

    The aim here is to help you select the most feature-packed and practical software
    that can bring dull images back to life. We''ll take a closer look at their advanced
    features, such as automatic enhancements, the ability to fix blur, dinner, or
    over-exposed images, of course, whether or not we handle RAW files.

    It''s not the first time we''ve run a Roundup on image or photo editors, but this
    current group includes a different selection of software.

    out of the five open source tools four had been a proper application in the past.
    The fifth is a commercial option, which is perhaps not for the reader, but should
    be of interest to photo-editing enthusiasts. To find out more!


    ![](img/77609ebc8773ced089e75787331e1931_159_0.png)


    hen comes to select a photo editor, there''s plenty of choice. There are general-purpose
    editors like Gimp and Pinta, image library managers such as Digicam or Shotwell,
    and finally those that solve the problem of fixing and processing RAW files, so
    we gathered (with Krita). Gimp with its set of built-in, Uraw plugin, and lots
    of third-party plugins from FX Foundry and GMIC. Then we included


    Darktable and Rawtherapee -- two classic darkroom editors with tools for dragging
    out these two programs, but has a more consumer-friendly interface. Last but not
    Pinta, also has a program with a limited set of editing features. Gimp is the
    only one that doesn''t use a dark theme by default. A dark theme adds a ''pro''
    feel to the program, we won''t hide the truth in our Roundup!


