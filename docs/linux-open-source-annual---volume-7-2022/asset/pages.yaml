  md: '# # Disk tools


    Keep your hard drive in tip-top shape, recover lost data or delete it safely.


    # ## FOG


    The constant barrage of repetitive tasks such as running checks, troubleshooting
    errors, swapping out dead hard drives, fresh installations over and again can
    save the energy of any system admin of the size of the network. FOG can image
    and clone machines from the forests of the admin HQ. FOG is a complex piece of
    software and offers plenty of options, with


    various fields to describe the images. It can also arrange them into groups for
    easier management. There are several options to schedule the imaging process.
    FOG can be used to debug computers, recover wiped hosts and more. The server handles
    tasks such as installing software and can manage many printers on the network.
    The FOG server is scalable and spread large networks across multiple locations
    in the same building or


    on the other side of the plane. One of the most useful features of the FOG server,
    especially for admins of larger networks, is the multicast ability. Using this
    feature you can deploy multiple machines in one go. To support it on networks,
    you can have multiple FOG installations configured as storage servers that take
    the load of the main FOG server when imaging computers. https://fogproject.org/


    # ## DUPLICATE


    An easy-to-use back-up application. Duplicate enables you to fine-tune the list
    of locations you want to preserve by either filtering or ignoring filter options
    to exclude certain types of files. You can manage the tool via a browser-based
    interface. The program breaks down clone records and also exposes the right justify
    for the job in hand, with advanced options are just a pull-down


    Files are encrypted with AES-256 and you can also use GPG before sending the backups
    to your destination. Duplicate compresses all data before it''s encrypted. It
    uses Zip and 7z compression, and can compress files into .zip and .jpg. https://www.duplicate.com/


    # ## PHOTOREC


    Photorec is a little command line tool that can recover deleted files. When you
    delete a file, the file system marks the space it occupies as free files. Photorec
    recovers files that are still marked with metadata such as the file name. Despite
    its size, the utility can sniff files in various formats. https://www.cgsecurity.org/wiki/Photorec


    # ## GPARTED


    One of the best graphical tools to manage partitions, you can use Gparted to delete,
    resize, move and copy partitions while preserving the data they hold. The program
    works with all disks, SSDs, and RAID devices and supports all filesystems in vogue.
    https://gparted.org/


    # ## SECURE-DELETE


    The secure delete package contains utilities to securely delete files and wipe
    all traces of data in the free space on the disk. There''s that that makes it
    impossible to recover deleted files, srm to wipe all data from the free disk,
    and wipe data from the swap partition. https://secure-delete.org/


    ![](img/77609ebc8773ced089e75787331e1931_169_0.png)


    # ## CDUEM


    The CDUEM tools allows you to mount disk images in various formats, including
    ISO, bin, and IMG. The tool is also a spectacular front-end for GOME and KDE desktops.
    https://cdemu.org/


    # ## DUC


    If you''re looking to free up some disk space, this tool helps to get a better
    idea of the files occupying your disk. Much better job in inspecting your disk
    than the file manager https://duc.zeev.net/


    # ## DRESCUE


    Try a failing drive with ddrescue before attempting recovery. The utility doesn''t
    write to bad sectors and works without wiping out the data already. https://www.gnu.org/software/ddrescue


    # ## PYDF


    A replacement for df is a Python script that highlights the different types of
    files. It has a set of parameters and various options to control its output. https://pydf.org/project/pydf/


    # ## SMARTTOOLS


    Built as part of the system, the smarttools utility controls and monitors the
    SMART system built into hard drives. tool to periodically run assessment health
    checks on the disks. https://www.smarttools.org/


    170'
