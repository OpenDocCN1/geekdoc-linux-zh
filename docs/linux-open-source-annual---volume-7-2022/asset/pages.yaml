  md: '# NEXT-GEN DISTROS


    Step right up – LXF''s greatest showman Jonny Bidwell is here to unveil the finest
    Linux distros around!


    Cast your mind back 15 years


    Well, Windows may not have been wiped out by Ubuntu. But Linux has been developed
    in loops and bands. It''s more


    usable than ever and finest players to key industry players have taken it much
    more seriously now. From Valve and Vulkan, we can play thousands of games on Linux.
    More companies than ever are shipping-Linux on consumer hardware. Your wireless
    hardware works perfectly with it.


    Best of all, many distros to choose from. Ubuntu has always been a great place
    to start, but it''s up to everyone''s taste. Here, we present our pick of distros
    making Linux easy or very difficult, we''ve got a section on easy distros, including
    long-time favourite for beginners: Linux Mint.


    Next, we''ll explore some of the best-looking distros out there that will give
    you a truly modern desktop. In particular elementary OSs making Linux simple,
    powerful, and – dare we say – it all a little bit Mac OS.


    Finally, well Linux is leveraging new technologies. You might not want these technologies
    (or as it seems by the number of complaints online, Wayland, Systemd et al.).
    Or you might not be able to use your favourite software with them easily, but
    these will shape desktop Linux in the years to come.'
