  md: '# # Welcome to Linux & Open Source Annual 2022


    Free and Open Source Software (FOSS) has become an international phenomenon in
    recent years. The FOSS philosophy of protecting user freedoms sets it apart from
    many commercial software providers. And by constantly updating and improving,
    it pushes the boundaries of what can be achieved with software, allowing you freedom
    in other ways: to create, to hack (in the tinkering sense; behave yourself!),
    to explore new ways of doing things. We''ve crammed as much exciting information
    as we possibly can into this annual, including the hottest stories and FOSS for
    a wide range of fun and practical applications. This collection is truly an abundance
    of Linux and open source knowledge, ready for you to jump right into. So, what
    are you waiting for?'
