    Shashank Sharma

    By day Shashank is a New Delhi trial lawyer, but by night he''s an open source
    vigilante!


    # Lightweight desktops


    With his gym membership going unused. Shashank Sharma decides to cut down the
    flab on his desktop instead.


    # HOW WE TESTED...


    ![](img/77609ebc8773ced089e75787331e1931_33_0.png)


    We installed all the desktops inside an Arch installation. Most of them are in
    of the officially supported repositories, some are in the community-powered Arch
    User Repository (AUR). We''ve rated the desktops on various fronts, such as their
    usability and cache of default apps. Maintainability is also another important
    criteria when choosing a desktop; an environment with loads of tweakable settings
    will score higher than one that has a limited number of parameters, people usually
    swap their DEs because of a rigid configuration.


    As just as important is the usability of plugins. We give you the option to extend
    your environment depending on your interests.


    The most important criteria for this Roundup, however, is the usability of the
    desktop. Any desktop we find well in this test won''t be of much use, despite
    achieving high scores on fronts.


    Natinally at least, it''s counterintuitive that one would want to change the desktop
    environment (DE) of their distribution. After all, leading distributions provide
    a sense of familiarity, like the user experience. We are even actively involved
    in the development of the DE to ensure that it meets their requirements.


    Despite their refinements and functionality, especially for tasks that need the
    last


    amount of graphical overhead. Then there are those who have interacted with computers
    all with a DE that conforms to the traditional desktop metaphor, and don''t really
    see the advantages of new desktop shells. Another group of users disrupted with
    the default DE are those computing on machines which lack the resources to meet
    their needs.


    If you use any of the cases we''ve just outlined, this Roundup is for you. We''ll
    look at some desktops that have a minimum footprint but will still enable you
    to get along with your tasks.


