    don''t be able to stream games via Steam or watch movies via Netflix, but we can
    play multimedia, browse the web, do processing and without unexpected errors,
    we test various parameters such as installation and setup, with the intent of
    helping you find an open OS that takes us out of our zone of familiarity – but
