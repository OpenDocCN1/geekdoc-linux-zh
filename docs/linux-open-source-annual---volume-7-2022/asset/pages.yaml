    or export it in a suitable format. For example, if you want to work on a drawing
    that will be recreated, or perhaps a line image in your drawing, the range of
    formats becomes important.


    Nearly all the software uses a primary format for drawing, which isn''t enough
    – except in the case of LibreOffice, where native format is based on rectify or
