  md: '# Cloning flexibility


    Do they offer enough to meet your cloning requirements?


    Clonezilla offers a lot of control over the cloning process. You can use it to
    clone individual partitions or disks, which can then be saved to another attached
    disk, or a removable drive. One can also clone the disk or partitions to an image
    — Clonezilla can directly clone a partition while it is running. This process
    is very useful for cloning live disks, we wouldn''t recommend it and I would rather
    suggest using the imaging route, which is a lot safer and offers more flexibility
    than the direct disk to disk cloning. Clonezilla has a very verbose interface,
    which gives you several options to fine-tune settings when cloning and restoring
    images. Like Clonezilla, you can use G4L in separate modes, with the RAW mode
    that can clone all types of disks and also save the images over the network via
    FTP, SSH, SMB or NTFS. For the G4L, it also offers the option to directly clone
    a drive while it is running. Unlike Clonezilla, Fog Project does not work as a
    Live CD and has a different cloning mechanism. When you use Fog to image a computer,
    it offers plenty of options, with various fields to describe the hosts. It can
    also arrange the images into groups for easier management. There are also several
    options to schedule the imaging process, if


    ```

    Partion /dev/sda1.32 http://partitions.org/

    File copy from /dev/sda1 to device /dev/sdb1

    Please wait...

    File system: ext4

    Size: 39321000 blocks

    Used: 23800000 blocks

    Free: 15.5 GB 472565 blocks

    Disk size: 40% byte

    Completed: 00:05:02 00:03:17 2.048GB/min

    Block 809406 Total: 6801252

    Rate:

    Total Process: 17.28

    ```


    ![](img/77609ebc8773ced089e75787331e1931_132_0.png)


    | CLONEZILLA | 8/10 | 8/10 |

    | DEEP CLONE | 5/10 | WERESYNC |

    | FOG PROJECT | 8/10 | 6/10 |


    # VERDICT


    Direct-to-disk cloning is faster than going with the same flexibility, but with
    certain amount of risk and does not offer.

    You don''t want to image everything. WereSync, meanwhile, is a Python script that
    has a graphical interface and is designed for regular users. The only offers direct
    drive-to-disk cloning, making the process much more popular than drive-to-image
    cloning offered by the others.

    Deep Clone''s option is also a direct clone from one disk to another, although
    it offers the option to clone and restore an image. The app allows you to clone
    basic disks as well as individual partitions. However note that Clonezilla can
    only clone the partition that it is cloning. It also does not offer any options
    to compress, split or encrypt the cloned image.


