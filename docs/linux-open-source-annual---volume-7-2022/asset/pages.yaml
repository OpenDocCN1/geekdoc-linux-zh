    0 to understand what''s possible today, it''s helpful to look at how technology
    projects have been traditionally implemented. In the old days – more than 10 years
    ago – businesses would buy or lease hardware to run all of their applications.
    Even relatively simple applications, such as a website, have multiple components.
    In the case of WordPress, MySQL database is needed along with a web server, and
    any of handling PHP code. So, they''d build it up Apache, PHP and MySQL, install
    WordPress and be off today.


    By large and that lately, it''s well enough that there are still a huge number
    of servers configured in every today. But it wasn''t perfect, and yet of the bigger
    problems were resilience and scalability. Lack of resilience meant that any significant
    issue on the server would result in a loss of service. Clearly a catastrophe would
    mean no website, but there was no room to carry out scheduled maintenance without
    impacting the event. Even activating a routine could meant seconds of outage for
    the website.


    The resilience problem was solved by building "high availability clusters". The
    principle was to have servers running, so that the failure didn''t bring the whole
    down. The service was provided resilient if the individual servers were not.


    # The Slashdot


    The scalability problem is a bit tricky. Let''s say your website gets 1000 visitors
    a month. One day, you get mentioned on Radio 4 or breakfast TV. So suddenly, you
    have more than an hour worth of visits in 20 minutes. In this case all of your
    servers are "crashing"; and that''s why a lack of scalability is deadly. The Slashdot
    effect is a classic example of this.


    You''d have to manage a workload more than one alone could, but that''s still
    limited. You''d be paying for 20 servers at 100 percent of the time and both of
    the time were working, but that''s not what you need for your site. John Humphrys
    mentions you on Today and you''re left with 10 servers to handle the load – but
    only for a few hours.


    The solution to both resilience and scalability problem is to cluster. If you
    have a server instance or two that then run your applications – Amazon Web Services
    (AWS) or similar, when one of them fails for some reason, it would be reset. So
    scaling correctly and when the workload on your web server adapts to rapid increase,
    you''re able to share the load. As, as interests does today, that additional instances
    are needed, and you only pay for what you need. ... or is it?


    Kubernetes is much more flexible than the traditional standalone server, there
    are still issues. Upgrading all the running instances is not straightforward.
    Developing for the cluster has challenges too: the laptop your developers may
    be similar to the cluster, but it''s not it.


