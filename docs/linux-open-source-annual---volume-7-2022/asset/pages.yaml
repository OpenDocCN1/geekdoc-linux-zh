    of measuring hardware performance in more interesting problems, just to get a
    better Top500 score.


    # Plotting the results


    What is a benchmark without a set of colours to show off? If you can copy the
    results to PDF and paste them into Excel, it makes a tool you could use specifically
    for text-based data, so let''s get started with ggplot.


    For the first thing, you''ll need to transform the results logs into a more tabular
    format. You can do this easily with the following command:


    ```

    $ sombrero-results.txt -s | awk ''BEGIN {printf "%s\t%s\n"} END {print $1, $2}''
    >> results.dat

    ```


    This will append one line to the end of results.dat, with columns separated by
    tabs. The first column will contain the label and the second with the remaining
    columns from ggplot output.


    You can repeat this for various configurations by using editfiletxt – parsing
    by itself by label and for comparison, you can change the label value for each
    line accordingly.


    Now that your results contain a file of tables, you''re ready to generate a plot.
    Start with ggplot:


    ```

    $ ggplot

    ```


    This puts you into the ggplot prompt that looks like ggplot. Then you''re going
    to generate a bar chart, with bars and a legend.


    ```

    ggplot> set data histogram

    git> set style cluster gap 1

    git> set fill solid border="black"

    ```


    Next we will scale the horizontal axis, but make sure the vertical one starts
    at zero. Bar charts starting from zero are generally used as the tool of those
    who want to mislead you about the data they are presenting!


    ```

    ggplot> set auto x

    git> set yrange ["0,10"]

    git> set datafile "sombrero.dat"

    using(col(1+1)):xtic(1)

    title "SOMBRERO":

    ```


    Graphs aren''t particularly useful unless they tell you some information themes.
    Add one with:


    ```

    ggplot> set label "GFLOP/s"

    ```


    Finally, you''re ready to make a use of ggplot, so you don''t have to type the
    same thing over again for each column:


    And there you''re done! A plot appears in your window, showing a labeled of different
