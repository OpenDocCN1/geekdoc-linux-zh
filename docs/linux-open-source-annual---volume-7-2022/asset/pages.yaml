    # 6/10


    Inkscape is commonly compared favourably to Adobe Illustrator, a fully featured
    commercial offering with a hefty annual licence fee. It has an impressive range
    of features which means that it will appeal to Graphic Design designers as well
    as those with down-to-earth approaches. We are not aware of any drawing tools
    provided by other software that aren''t as useful. The demining feature for drawing
    is provided by extension, but this is not an issue as support for extensions is
    one of Inkscape''s significant features.

    The last added features include: some of the most significant support for generalised
    polygons and stars, spirals, Boolean operations, and calligraphy for drawing filled
    paths.


    Compared to our basic set of drawing tools, LibreOffice Draw''s main extensions
    are in the areas of layers and pages, 3D objects, connectors, and dimensioning.
    Its support for 3D objects is provided by shapes can be extruded, alongside a
    library of ready-made 3D objects is also available. You can select any 3D object
    on screen, you can apply transformations.

    The concept of connectors simplifies the editing of diagrams such as flow charts
    or organisational charts, where you can connect objects using a special type of
    line called a connector, whose connecting lines stay to their associated objects
    and re-route accordingly. Finally, dimensioning labels are available for engineering
    applications.


    Vectr offers more than basic drawing tools, but not by a huge margin. First, there''s
    support for layers and pages. Layers enable you to assign objects to different
    layers, which can then be dragged above or below layers, locked or hidden.

    The concept of pages is fundamental to word processors, but it''s not universal
    in the realm of graphics editors. However, it means you can have all elements
    in a multi-page element together unlike some of the others. Here you benefit most
    because you can only export one page at a time.

    Another feature is filters. For example, you can export both a solid colour and
    the fill as object with different backgrounds. Although this isn''t on most people''
    must-have list.


