  md: '# TAMING THE CLOUD


    Tiger Computing''s Keith Edmunds reveals how Kubernetes can be used to build a
    secure, resilient and scalable Linux infrastructure.


    If you want to use Linux to provide services to a business, those services will
    need to be secure, resilient and scalable.

    Nice words, but what do we mean by them?

    ''Security'' means that users can access the data they require, that read-only
    access or write. At the same time, no data is exposed to any party that''s not
    authorized to see it. ''Resilience'' means you can think you have everything protected
    only to find out that there are holes. Designing in security from the start of
    a project is easier than trying to retrofit it

    ''Resilient'' means your services tolerate failures within the infrastructure.
    A failure might be a disk controller that can no longer access disks, rendering
    the data unreachable. The failure might be a network


    switch that no longer enables two or more systems to communicate. In this context,
    a ''single point of failure'' or SPOF is a failure that adversely affects service
    availability. A resilient infrastructure is one with no SPOFs.

    ''Scalable'' describes the ability of systems to handle spikes of demand gracefully.
    It dictates how easily changes may be made to systems. For example, adding a new
    user, increasing the storage capacity or moving an infrastructure from Amazon
    Web Services to Google Cloud – or moving it in place.

    As your infrastructure expands beyond one server, there are lots of options for
    increasing the security, resilience and scalability. We''ll look at how these
    problems have been solved traditionally, and what new technology is available
    that changes the face of big application computing.


    ![](img/77609ebc8773ced089e75787331e1931_77_0.png)'
