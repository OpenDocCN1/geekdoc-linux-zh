    most valuable feature is its extensibility. There''s a range of useful editing
    scripts and plugins for Gimp, from motion blur (Refocus) to get some great photos
    from FX Foundry (PhotoX). It turns Gimp into the most versatile and at the same
    time a feature-rich editor for Linux.


    Darktable enjoys benefits too, from OpenCL support (Gimp has this), to easy lens
    correction and print-to-pdf presets. RawTherapie has its own workflow, but we
    really liked its powerful filter that can carry out processing and editing all
    profiles at once; this feature in RawTherapy is much easier than using copy and
    pasting.


    Lightzone contains a beautiful set of ready-to-use presets called Styles. Each
    style is a preconfigured filter or effect that you can easily find to your liking.
    Lightzone outbeats Darktable in terms of usability. You can have many effects
    applied to the image at once as you like, with one of the best effects being right.


    Moving to Pixelpea we noticed the Quick Color feature, which is basically a set
    of one-click import-like effects. The


    ![](img/77609ebc8773ced089e75787331e1931_163_0.png)


    > We liked the powerful print preview and electronic tools in Darktable.


    Warp tool was also a unique tool for creating instant and fun distortion effects.
    Definitely not a tool for professionals, Pixelpea has all the necessary functions
    for a photo processing and retouching pipeline, and for many people this would
    be.


