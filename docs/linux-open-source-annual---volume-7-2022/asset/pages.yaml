  md: '# FOSS


    # FLATPAK


    # # Get hold of up-to-date software with Flatmaks


    Aaron Peters went all in on Debian and Ubuntu''s .deb format years ago, and have
    never looked back. That said, there''s always time for a second opinion...


    ![](img/77609ebc8773ced089e75787331e1931_109_0.png)


    OUR EXPERT

    Aaron Peters wishes he was a programmer, but is just settling for better. What
    do we do in the form of software documentation.


    **Flatpak (flatpak.org)** is a rising contender. Mayank Sharma reviewed it in
    LFX224, and it''s got a lot to offer. In this article we examine Flatpak, explore
    how to use it, and take a look at two important


    # ### Mode of operation


    Flatpak is both a package, a tool to install and manage those packages. Many Linux
    package formats work on the concept of definitions, which means a developer can
    define what a Flatpak package is on package B. When a user tries to install a
    Flatpak package A, the system will recognise the definition and install Flatpak
    B with it. This is how you install an application, and end up with all the dependencies
    downloaded.


    In contrast, Flatpak provides both the application and everything needed to run
    in a distro-independent environment. This approach has its pros and cons:


    ![](img/77609ebc8773ced089e75787331e1931_109_1.png)


    QUICK TIP

    Flatpaks are identified by a unique source URL: the scheme you might use when
    naming code packages. The top-level domain comes first, then the sub-domain, and
    so on.


    | Pros | Cons |

    |---|---|

    | Uses extra data to duplicate file | Installation requires root or non-root users
    |

    | No conflicts with local system | Server applications |


    The great idea behind Flatpak is attractive. Download a program, install it and
    run it without worrying about what else on your system might be using an incompatible
    version of the same library. Furthermore, installing applications as Flatpak enables
    you to match and match programs in versions you can''t with your native package
    system, such as:


    A Flatpak file contains all the information necessary to find an application,
    its dependencies, and install everything.


    +   - Using the bleeding-edge version of an application, while keeping the standard
    version as is.

    - LibreOffice in the same screen (see page 70) running versions 5 and 6 at the
    same.

    - You have security concerns, and feel better with running a program in a sandbox:
    Adobe''s way.

    - To use a more recent, and/or more featured version of an application than your
    distribution provides.


    And as seen in LFX224, there are other formats that provide similar advantages.
    These Ubuntu''s Snap (https://snapcraft.io) and AppImage all perform similar functions.
    Flatpak also has a leg up on the race in packaging:


    +   - Snap is a Canonic project, and it''s a first-class choice of Ubuntu. If
    you use another distro, or just prefer a software system that isn''t connected
    to your local,


    commercial entity, Flatpak is a better choice than Snap.

    AppImage takes the approach of bundling everything and running a single file.
    This is straightforward, but not necessarily easy, especially for new users. First
    off, you''ll need to download the AppImage file to execute it, and there isn''t
    a built-in tool to update your applications. The project offers an external tool
    to do so, but you will need to download and configure that yourself.

    Despite all this talk of pros and cons, you can use any (or all) of the formats
    on your machine


    110'
