    since we can add an .htaccess file to make custom rules, browser caching, and
    so on. Meanwhile, Openspeed has to migrate our .htaccess from Apache into its
    own system and use the server rewrite rules, which brings transition from Apache
    server.


    Lighttpd has its own way of creating custom files in its lighttpd.conf. With Nginx
    and Lighttpd, most custom rules take place in configuration files.


