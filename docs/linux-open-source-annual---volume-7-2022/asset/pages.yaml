    # Disk cloning tools


    Need to provision a lab full of PCs? The ever lethargic Shashank Sharma tests
    the best tools to get the job without breaking into a sweat.


    A disk cloning tool requires quite a bit of hardware to be tested effectively;
    particularly hard disks. This is why virtual hardware is ideal for testing its
    capabilities. For this Roundup we''re using multiple virtual machines with hard
    disks of various sizes. We''ll use them to manage a small disk to a large one,
    which is one of the most popular uses of a disk cloning tool. Second, we''ll clone
    a large disk with lots of empty space to a smaller one with enough room to accommodate
    the sectors of the larger disk. The Clonezilla, G4L and FOG Project were tested
    on Manjaro and Ubuntu. The network installed on Manjaro and Deepin Clone was tested
    atop Deepin 15.9 for installation results. The project was installed on Ubuntu
    Server installation as per its documentation.


    managing network of computers is an involved process. The constant barrage of
    tasks such as running checks, troubleshooting errors, replacing hard disks and
    doing install can cap the output of any system to the size of the realm. Even
    before you take the trouble of monitoring the machines to install a system on
    each of them. This is a time-consuming task even for a small network with 10 computers.
    Computer online involves setting up the operating systems, software and data


    on one computer, and then replicating the same setup on other computers. The technique,
    also known as ghosting or imaging, is used by system admins for rolling out multiple
    machines over the network. The cloning tools we tested are a blessing for hurried
    admins who want to put their feet up and now. With these tools you can image a
    server without breaking into a sweat. We''ll look at tools that, besides cloning,
    will also help take the pain out of everyday tasks such as installing software,
    and scale up to over large networks and multiple locations.'
