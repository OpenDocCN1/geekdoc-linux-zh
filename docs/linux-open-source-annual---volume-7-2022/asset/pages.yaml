  md: '# Protect your network


    Firewall your home with IPFire, a dedicated to keeping your network ports safe.


    We created firewalls last issue, so check that out again if you want to learn
    the ins and outs of packet-filtering on Linux. We''re going to cover this time
    there''s time for a more practical approach to IPFire, a dedicated to firewalls
    or other networking. You don''t need any particular hardware to run it, an old
    machine or a Raspberry Pi is enough (we''ve included ISO images for 32-bit x86
    machines as well as USB/SD card images), but note that at least two network adapters
    will be required. Be aware that you may also run in a virtual machine (which you
    can add as any virtual adapters) to hardware and software this network will perform
    fine, if the host cannot be compromised then you can save the virtual, but lose
    some security points along the way.


    If you want to use IPFire for your home, use the 32-bit ISO from the IPFire directory.
    If you really want to grab, get the 64-bit image from our website. It''s unlikely
    to make any


    difference – memory requirements are low. For a larger or more complex installation
    you probably won''t want to run a virtual IPFire appliance, thanks to virtio networking
    and other bits of virtiooodoo (see our https://virtualfeature.com/archives/ this
    will work for linux). Virtual encryption requires a bit of CPU power, so you can
    avoid data-hungry access to your IPFire. Be aware of this, and you will find instructions
    on how to set up a virtual client-cloud on the IPFire website.


    # Routing through IPFire


    You can run your entire home through IPFire (by setting it as the gateway on your
    home router and DHCP settings) or you can avoid using other users of your home
    network. Installation (real or virtual) is simple, but note that the only target
    device will be default – the installer provides no means to install the installation
    media and reboot to perform system setup. Everything is standard – and what you
    have is the final network setup.


    If you have at least two networks, there is no way around this. If you''re running
    a VM you can just add a second one with the first bridge and reboot to continue
    the setup. If you''re using a Raspberry Pi 3B or other device with wireless networking
    you will need some function (to set up your access with hostapd). For a two-adapter
    setup, you must assign one device the Green network and the other device the Red
    network. You can use up to four and everything gets even more colourful if you
    would like. The first option if you need to set up more adapters, and the second
    option is to assign colours to your hardware. The Green network will be your


    ![](img/77609ebc8773ced089e75787331e1931_55_0.png)


    # >>ADDONS


    IPFire has more than you need to run an advanced firewall solution. Its functionality
    can be extended beyond what''s in the box. For now it''s tied down with its own
    package manager (IPFire), which can be used to extend or shrink the tools available
