  md: '# # Audio and Video


    Edit your videos with minutes of their lives, and organize your music.


    # ## U


    This streaming server will transform your Linux desktop into the ultimate media
    streaming station to broadcast to other computers, smartphones, tablets, gaming
    consoles and even more. UMS streams via the Universal Plug and Play (UPnP) protocols
    to DLNA-compliant device. You''ll have to roll-out UMS, although the procedure
    is fairly simple.


    The first time you launch it, UMS takes you through a basic three-step configuration
    wizard. After starting without further configuration, UMS does highly customised
    options and tips to guide new users. It also includes a minimal web interface
    for streaming your content. www.universalmediaserver.com


    # ## EMBY


    This is an all-inclusive media server that comes with plenty of features. Emby
    is a one-stop shop for accessing and viewing all your media on any device: from
    your computers and mobile phones to Android TV, Chromecast, Xbox and more. Besides
    local shares, which you can add to network shares on different computers, the
    Network server is available as a pre-packaged library and website installation
    instructions for all popular distributors including Arch, CentOS, Fedora and Ubuntu.
    You have right-click items to reveal useful such as downloading them, adding to
    playlists and collections, or editing metadata. You can change stream quality
    during playback and split-screen. Emby also enables you to set parental controls,
    and can block items with a rating higher than the maximum you''ve defined. //emby.media


    # ## MPV


    A resource-conscious video player that also looks good on modern machines. Based
    on mplayer, MPV continues the tradition of CLI by introducing optimised and cleaned-up
    code options and features. It offers a minimal user interface that stays out of
    the way, allowing you to watch your videos in peace. //mpv.io


    # ## CURLE


    Powered by the ffmpeg library, Curse is an easy-to-use media converter. It has
    the ability to clip and video and convert only specific parts of files. Select
    from many presets for various devices and formats and you''ll be able to preview
    the file before conversion. //curse.sourceforge.org


    ![](img/77609ebc8773ced089e75787331e1931_168_0.png)


    ![](img/77609ebc8773ced089e75787331e1931_168_1.png)


    Emby can connect to TV tuner cards and DVR devices to stream live


    # ## AIRSONIC(3)


    Based on the now-closed project, the Airsonic audio streamer makes your music
    important. It does not require conversion and can stream files in any format to
    many players simultaneously. //airsonic.github.io


    # ## TUPITIPE


    A set of tools to encourage kids to create 2D animations. Tupitipe has an easy-to-use
    interface with pictures and a host of text and video documentation to get started.


    # ## PICARD


    A powerful little tool, will get your music collection back into shape. The program
    can rename named files and identify incomplete albums. //picard.musicbrainz.org


    # ## MIXXXX


    If you need to DJ at an event, run your music library with mixxx and use scratchable
    waveform to tempo of tracks and change their pitch to create your own. //mixxx.org'
