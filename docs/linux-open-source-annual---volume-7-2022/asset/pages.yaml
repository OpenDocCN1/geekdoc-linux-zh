    The Verdict


    he choice of Roundup subjects over the past several issues left to clarify that
    one application might not cater to all your needs. This is true for both image
    and video editors, office suites aren''t exception. If you can share resources,
    you might find yourself preparing presentations on one suite''s application, relying
