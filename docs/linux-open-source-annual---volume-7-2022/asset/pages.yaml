  md: '# Security tools


    Ensure ne''er-doells don''t get their hands on your system and files.


    # # ZULCRYPT


    While you can control access to the data on your computer using accounts and file
    permissions, they aren''t enough to prevent a determined intruder from gaining
    access to your private files. The only reliable mechanism for securing your personal
    data to yourself is to encrypt it. Working with encrypted data is an involved
    process, it''ll go a long way in reinforcing your security and insulating your
    data.


    ZuluCrypt is a graphical encryption tool that has an intuitive, easy-to-follow
    interface. The program lets you create an encrypted device within a file and even
    USB disk. It can encrypt every file with GPG. ZuluCrypt can protect your entire
    device, which means it can encrypt everything written to a cipher device. The
    device can be a whole disk, or a file mounted as a loopback device. With block
    device


    encryption, the user creates the system on the block device, and the encryption
    layer transparently encrypts the data before writing it to the lower block device.
    While encrypted storage appears just like a large holds of data, it won''t even
    reveal its directory structure. All functions are more and accessed via the excellent
    user interface. http://momononggithub.io/zuluCrypt


    ![](img/77609ebc8773ced089e75787331e1931_175_0.png)


    # # GUFW


    GUFW is the graphical unconfigured firewall, which is one of the easiest front-end
    tools for iptables. This tool has a simple interface and provides effortless configuration
    regulating incoming and outgoing traffic. You can store the incoming and outgoing
    policies of the profiles as you prefer. You can use GUFW to define specific rules
    for traffic for individual apps and services. http://gufw.org


    # # BITWARDEN


    The Bitwarden password manager end-to-end encryption and uses 256-AES as block
    to secure your data. It does not trust your little because it stores it in a remote
    Microsoft Azure cloud account. It can also import passwords from 24 sources. https://bitwarden.com


    # # STEGOSOGRAPHY


    Steganography is the art of concealing inside seemingly harmless message or image.
    The most common mechanism for concealing it is by replacing unused data in graphical
    file with bits of information that isn''t visible when viewing the image of data.
    Steganography is mostly used to complement encryption.


    Stegola is a great tool that can hide text as well as any type of file inside
    an image. You pick the tool, select an image, point to the files you want to hide
    and enter a secret key for the image. The tool will extract from the image once
    again and use the Extract button with the secret key to get the hidden files and
    messages from. https://stegola.com


