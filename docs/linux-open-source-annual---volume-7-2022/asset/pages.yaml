  md: '# # Fixing colours and shades and more


    Want to give your photos a natural look?


    # ## Gimp


    10/10


    # ## Darktable


    6/10


    We may prefer one tool over subjective practices, but there are others that expose
    the real value of each photo program.


    When it comes to correcting colours, Gimp shines thanks to that GEGL engine. We
    didn''t need any third-party plug-ins for fixing the colours of our test photo.
    The Color-Levels tool was used to fix the white balance (look for three tickers
    for checking grey, black and white), and we also managed to remove the unwanted
    green tint from areas of the image using Gimp''s standard features for turning
    up levels and curves


    Darktable has some advanced tools for working with colours, including a dedicated
    White Balance section. The neutral Color Picker tool was used under the Levels,
    but it is not quite intuitive enough to fix the white balance. Gimp works very
    well in Darktable. We achieved acceptable results by adjusting the colour temperature
    and all RGB sliders


    For this Roundup we used five images as tests showing our five programs. One was
    shot with inadequate light, fine grain and insufficient exposure; another was
    an unprocessed RAW shot of an urban environment which was also deexposed.


    Darktable has too many tools, which overlap, so the most program likely to help
    you achieve artistic effects without making rookie mistakes.


    The aim was to achieve the best possible results in both shots of our five programs.
    We paid special attention to the white balance and any colour adjustment sliders,
    well as the shadows, highlights and colour levels.


    The positive of Darktable is working with RAW files. The application offers the
    original algorithm for exposure development which resulted in a pleasing image
    with less noise and better local contrast. Darktable-only is like which boosts
    saturation in brighter parts of the image.


    In the end, a good program is to fix everything using automatic algorithms, or
    by offering tools without saying that the only acceptable editing is a non-destructive
    one, where the user can roll back to the original image without losing anything.


    When editing RAW files, Gimp can integrate with RAWtable. Rawtherape offers similar
    tools. The result depends on how well a user can handle the many tools of a RAW
    processor.


    ![](img/77609ebc8773ced089e75787331e1931_161_0.png)


    # ## How are these programs for eliminating noise and restoring detail?


    processing RAWs with high ISO, Rawtherape has the edge because it produces much
    smoother JPEGs compared to those processed by Darktable.


    the reason we equipped Gimp with third-party plug-ins is because they grant the
    program advantage for correcting colour and removing grain.


    In other RAW programs, Lightroom has just one tool with only two sliders for colour
    and grain. Finally,


    Repair costly inside the GIMP interface contains some adjustments, some of which
    are better than Phase''s Noise Reduction.


    The Reduce Noise function in PixelOne is only a primitive filter for the sale-of-box.
    It works when removing noise with preserves details. It''s best used unless you
    want to change the nature of your original photo.


    We have achieved reasonable results by combining several filters. In Darktable
    we preferred to reduce noise and grain in Darktable


    # ## VERDICT


    | GIMP | 8/10 |

    | DARKTABLE | 5/10 |

    | RAWTHERAPE | 10/10 |


    Choose Gimp for old photos and go Rawtherape for creating perfect JPEGs of your
    RAW shots.


