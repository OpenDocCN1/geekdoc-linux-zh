    Licence: GPL v1.0

    Works as advertised but currently caters only to users of Deepin.


    +   ## 5th WereSync 4/10

    Web: https://github.com/DormyM/WereSync

    Licence: Apache License 2.0 Version: 1.0

    Can clone disks and back basic features intact.


    # # ALSO CONSIDER


    Two of the tools listed in the past, but not mentioned this time around due to
    not showing any signs of life, are Boot Backup & Recovery and Monde Resource.
    They are by far the best-metal cloning option we''ve run into. The downside, is
    that it takes away a lot of control over the cloning process in for convenience.


    The only real alternatives for cloning disks are the ones we''ve already covered
    in the Roundup and the command-line tools that do the work in the background.
    These two are really worth mentioning Partone and Farchiver. They support a large
    number of filesystems and can quickly clone disks and partitions into movable
    archives. The real CLI users, don''t need anything else besides the venerable
    dd tool, which can be used to effortlessly clone a disk or partition with a single
    command. You''ll need to know what you''re doing!


    ![](img/77609ebc8773ced089e75787331e1931_136_1.png)'
