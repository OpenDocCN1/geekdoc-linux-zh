    them to your vector-based editor. Gravity is partially


    strong, enabling you to adjust brightness and contrast, and even fine-tune colours
    and remove noise. Inkscape doesn''t offer this, the raster extension adds all
    to bitmap editing capabilities and a lot more. LibreOffice Draw also has support
    in this area - mostly though.

    Another useful feature is bitmaps with connected to these vectors. It is also
    worth worth tracing, vectơ, or converting to polygons. When converted to vectors
    or polygons, all the usual vector editing features become available. This functionality
