  md: '# Roundup


    Arteros >> ArchLabs >> KaOS >> Manjaro >> Netrunner Rolling


    # Arch-based distros


    Ever more distros are built upon Arch Linux. Once Jonny Bidwell would have called
    this sacrilege, but now he finds it a glorious development.


    # HOW WE TESTED...


    We installed each distro on a Dell XPS13, which enabled us to test HIDPI and touchscreen
    support. We checked that the distros happily installed alongside operating systems
    without breaking them. Further testing was done in virtual machines (limited to
    3GB of RAM), which gave us some idea of how the distros would run on older hardware.
    We looked at each with an out-of-the-box install, and whether this struck the
    right balance between usefulness and bloat. Since we focused on distros providing
    a desktop we looked at how stylish and effective those desktops were.


    We compared repositories to Arch Linux, renowned for offering the software and
    making minimal changes to upstream releases. In particular, we looked at the desktops
    by each distribution. We also checked each distro integrated with the Arch Repository
    (AUR).


    > Few would disagree that Arch is a fine distribution: customisable and possessed
    of an enthusiastic community and excellence. It''s not for everyone. Many find
    the lack of an installer having to manually partitions disks and chmod into a
    bootstrapped install where things doesn''t go easily for any user-friend. That
    obstacle is met with a new challenge: namely, the minimal install into something
    useful. If you''re installing for desktop use, you''ll find that getting desktop
    up and look is non-trivial.


    In short, it really makes appreciate the efforts that other distros go to, to
    have all set up of the box.


    But the greatness of Arch can be merged with the convenience of other. Imagine
    ever having to add a PA to obtain new custom versions of packages, and then no
    more. We are focusing on distros varieties giving particular attention to modern
    desktop innovations, but people have used Arch for all base of kinds of things
    (Raspberry Pi, 32-bit hardware, the list goes on), like its flexibility.


    ![](img/77609ebc8773ced089e75787331e1931_17_0.png)


    Jonny Bidwell required judicious application of Jura whisky to fend off the germs
    that tried to interfere with this Roundup.'
