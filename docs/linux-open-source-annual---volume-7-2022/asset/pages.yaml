    # # Performance


    Do they actually perform better than the fledged defaults?


    It''s very difficult to measure performance in terms of absolute numbers to a
    lot of factors. Since we can''t separate the desktop environment from the apps,
    we can''t measure their exact draw on resources. This means may go up or down
    depending on the number of installed.


    Also, there is no single point of measurement. For instance, an environment could
    be fast to load, but its resource consumption could be that it''s fetching unexpectedly
    idle while loading components in the background.


    On our test machine, LXDE is at about 150MB. The figures go up when opened and
    then drop back when we close the app. A noted it, it''s fast at launching apps,
    with LibreOffice timed at 4.3 seconds.


    There''s LXQT, which isn''t for Linux - and probably will its startup takes three
    times longer than EDE. around at 210MB, but app launches are only


    slightly faster than EDE. Its memory consumption also mirrors EDE, with highs
    recorded at the initial launch of apps. Moksha is just as light as EDE but its
