  md: '# # INSTALLING POP!OS ALONGSIDE WINDOWS


    ![](img/77609ebc8773ced089e75787331e1931_48_0.png)


    ![](img/77609ebc8773ced089e75787331e1931_48_1.png)


    # ## Write an install medium

    If you have an Nvidia graphics card you will want to fetch the Nvidia by build
    from https://system76.com/pop and boot it to a DVD or write it to a USB stick.
    If you have trouble booting Pop! OS from the LFXUPD (or no DVD drive), you should
    write the ISO file from the Pop directory (or the link above) to a USB.


    # ## Make space

    Start windows and open the Disk Management tool. The easiest way to find it is
    by opening the start menu and typing the first few letters of ''disk management''.
    Right-click the C drive and choose Shrink Volume. Some Pop recommends at least
    60GB, but if you can space it, use it.


    ![](img/77609ebc8773ced089e75787331e1931_48_2.png)


    ![](img/77609ebc8773ced089e75787331e1931_48_3.png)


    # ## Boot Pop!

    Boot Pop!OS and start the installer. After answering some location questions choose
    the Custom (Advanced) option, unless you are happy to get rid of everything on
    the target drive. Select ''Modify partitions'', right-click the Unallocated Space
    and click New. Go with the defaults and click Add and finally Apply changes.


    # ## Select partitions

    Exit the partitioning tool and click next. Click the ''Use partition'' switch,
    leaving the defaults. Click the EFI partition (it''s usually second from the left
    in a Windows install and is FAT32-formatted) and use it as a Boot partition, but
    please don''t format it as that will break Windows.


    ![](img/77609ebc8773ced089e75787331e1931_48_4.png)


    ![](img/77609ebc8773ced089e75787331e1931_48_5.png)


    # ## Lift off

    Hit Erase and install to begin the fun. Either watch the progress bar intently
    or make a cup of tea. When the installer does hit Reboot and do some final steps.
    You can enable location services and connect online services. Finally, set up
    a user and password, then click the tick to start Pop!_OS.


    # ## Update and augment

    Updates will probably be available. When prompted, switch from the installed tab
    to the Home tab. Here you can peruse the multitude of applications paying your
    attention in the Pop!Shop. Pop is relatively lean out of the box, so you may want
    to install some worthwhile applications at this point.'
