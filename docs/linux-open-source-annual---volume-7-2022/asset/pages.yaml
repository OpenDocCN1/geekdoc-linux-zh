  md: "same time. That defies logic, doesn't it? How did the developers accomplish\
    \ this? Let's explain the Flatpak a bit more clearly to you.\n\n# # Unpacking\
    \ Flatpak\n\nLike most open source projects, Flatpak stands on the shoulders of\
    \ giants to accomplish its goals. Two key technologies Flatpak uses are atomic\
    \ and bubblewrap.\n\nWhen you install a Flatpak, you are installing a runtime\
    \ \"bundle\" containing the application. The project describes itself as something\
    \ like \"git for operating systems\". In addition to other benefits, it allows\
    \ for atomic updates, which is a fancy way of saying that only what needs to get\
    \ updated gets updated. It also provides a rollback mechanism.\n\nSuppose you\
    \ have a program with file 1 and 2. An app needs a newer version of file 2, which\
    \ is actually designated file 3. The program will operate quite fine using file\
    \ 1 and file 3 until you want to roll back.\n\nThe other helper is bubblewrap,\
    \ a software that in turn uses the Linux kernel's namespaces feature to enable\
    \ non-root users as root accounts in containers. When you run a Flatpak application\
    \ it will start in a container consisting of the Flatpak runtime and a select\
    \ number of runtimes. The Flatpak works via GitHub (https://)\n\n![](img/77609ebc8773ced089e75787331e1931_110_0.png)\n\
    \nThe results of the flatpak search command give you the home-part, reverse-demand\
    \ ID that you'll need to install.\n\n# # ANATOMY OF A FLATPAK\n\nInstalling a\
    \ Flatpak will create a file structure for the program and its runtimes, as well\
