    # ## ALSO-CONSIDER


    There aren''t any other source suites to consider for the ones already featured
    in this Roundup. If none of our solutions work for you, check out the Apache Office
    suite. LibreOffice is based on it, but whereas the latter has continued to innovate,
    OpenOffice has started in recent years. Softmaker Office 2018 is another free
