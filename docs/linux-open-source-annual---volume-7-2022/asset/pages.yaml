    Groups can be ungrouped, if necessary, for manipulating their individual constituents.


    # ## Google Drawings 5/10


    Google Drawings offers the basic drawing tools and little more, but just saying
    that it doesn''t justify it. For example, while working with just a handful of
    shapes - commonly rectangles, rounded and circles - Google Drawings offers a vast
    number, under the headings of shapes, arrows, calls and equation. This emphasis
    is not really suggested for the application, which is intended for simple design
