  md: '# # Image tools


    # ## PENCIL 2D


    You can use Pencil 2D to create static and animated drawings. A comprehensive
    program that will help digital designers create professional cartoons and animations
    in multiple layers. The intuitive tool is well complemented by the video tutorials
    on its website: www.pencil2d.org


    ![](img/77609ebc8773ced089e75787331e1931_167_0.png)


    # ## FOTOXX


    A comprehensive image-manipulation program with a rich set of retouch and edit
    functions that go beyond brightness, contrast and colour. Most dedicated image
    editors, Fotox allows you to select any object or area within an image with free
    outline. Follow edges and select matches another.


    unique feature of the tool is that it makes possible to edit images without using
    layers. You can also use Fotox to create HDR and panoramic images, reduce noise
    and remove dust spots, create collections, mapsaps, and slideshows with animations.
    There are also artistic features that can convert a photo to a drawing, sketch,
    painting, cartoon, dot image, or mosaic.


    On the initial launch, it starts its quick guide in the web browser with a dialog
    to index your image library. This process can save you some time depending on
    the number of images you have in your library. All its features can be clearly
    labelled in the left-side panel. Check it out: http://fotox.html


    # ## DARKTABLE


    If you work with RAW images, darktable will help you create a professional darkroom
    to process them. The tool interface gives you access to a full gamut of image
    processing and editing with professional heavyweights from the likes of Adobe
    and Apple.


    ![](img/77609ebc8773ced089e75787331e1931_167_1.png)


    > You can use Fotox for resource-strained projects and the magazine can be renewed
    with liberty.


    # ## RAPID PHOTO DOWNLOADER


    This program might seem redundant considering that most management tools import
    photos. PhotoDown, however, is designed for transferring photos and videos. It
    offers a lot more that makes it a perfect tool for processing and organising photos.


    The tool gives you control how it processes and sets the downloaded photos. The
    program''s default rules automatically translate the downloaded based-suffices...


    You can also define custom rules for your requirements. For example, you can sort
    photos by date, which comes handy if you import both RAW and JPEGs. In fact case
    you can create complex filters by defining naming rules based on exif data size
    and so on. You can also specify an external storage drive as the backup-destination,
    and the program will automatically back up the photos downloading from the camera.


    https://photodownloader.net/


    # ## CONVERSEEN


    Converseen is a straightforward friend to command-line users that can capture
    images and format, rotate and flip them, change dimensions, and rename in a fraction
    of the time it would take to perform these tasks manually.


    http://converse.faster.net/


    ![](img/77609ebc8773ced089e75787331e1931_167_2.png)


    Manipulate any number of images within the Action panel.


    # ## FROG


    Use this tool to click on Flickr and access its basic upload features such as
    the ability to describe image sets, categorize them into sets and group pools.


    https://mlarspr.org/category//


    # ## NOMACS


    This image viewer can display images in all popular format. In addition to the
    features it has, some users come with the ability to view between multiple network
    interfaces.


    https://nomacs.com


    # ## FLAMESHOT


    Use this to tell and control your camera from the computer. Enter will also help
    you set the shot by tweaking the exposure, ISO and other settings and then download
    the images.


    https://github.com/lupoDharks/flameshot


    # ## LYCHEE


    Lychee has a simple user interface, and is a platform for sharing photos. You
    can run it from an SBC (like the Raspberry Pi) and use it to upload, manage and
    share photos.


    https://lychee.org'
