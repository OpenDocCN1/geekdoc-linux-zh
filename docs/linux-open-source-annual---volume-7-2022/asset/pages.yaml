    Besides addressing long-standing bugs (Morrowind received its last official patch
    in 2003), the new engine adds new features and fixes issues, enabling the game
    to be played natively in Linux. The original assets are required, but since you
    find you can get hold of a DRM-free copy of Morrowind (the full-priced Game of
    the Year edition) from gog.com for £13. It''s on special offer too to add it if
    you''re short of cash.


    OpenMW modernises the original game by making distances shorter (increasing the
    draw distance more visibly), uses True fonts and works with all the multimedia
    third-party formats supported by FFmpeg. Many mods that relied on the original
    engine or deMorrowind will work with OpenMW, but this is not the goal of the project.
    It also makes assumptions about undocumented queries.


    OpenMW also comes with OpenVR, which makes it easier for users to create their
    own assets: characters, quests, ... the whole thing. This enables users to form
    entire bases based on Morrowind. Skilled 3D sculpters can use Blender to create
    models, dungeons, and landscapes, and export them using NIF (a format supported
    by many other games or OS OpenMW''s open format format).


