    \ in YAML files, and we need persistent storage for the MySQL database.\n\n```\n\
    apiVersion: v1\nkind: PersistentVolumeClaim\n```\n\nmetadata:\n\nname: mysql-pv-claim\n\
    \nlabels:\n\napp: wordpress\n\nspec:\n\naccessModes:\n  ReadWriteOnce\n\nrequests:\n\
    \nstorage: 2Gi\n\nThe specification should be self-explanatory. The name and labels\
    \ are used to refer to this storage from other pods, in this case, the WordPress\
    \ pod.\n\nOnce we've defined the database, we define a MySQL instance, pointing\
    \ to the prefetched storage. By defining the database itself, we give it a name\
    \ and label for easy reference within Kubernetes.\n\nNow we need another container\
    \ to run WordPress.\n\n```\nkind: Deployment\n```\n\nmetadata:\n\nname: wordpress\n\
    \nlabels:\n\napp: wordpress\n\nspec:\n\ntype: Deployment\n\nstrategy:\n\ntype:\
    \ Recreate\n\nThe strategy Recreate means that if any of the code application\
    \ is running, then running instance will be deleted and restarted. Other options\
    \ include adding new instances before removing existing ones, which would allow\
    \ for the service to continue running during deployment of an update. Finally,\
    \ we create a recipe for WordPress, including the PHP code and Apache. Part of\
    \ the YAML file describes this:\n\nmetadata:\n\nname: wordpress\n\nlabels:\n\n\
    app: wordpress\n\nspec:\n\nports:\n\n- port: 80\n\nselector:\n\napp: wordpress\n\
    \ntier:\n\ntype: LoadBalancer\n\nAnd that Kubernetes will use those YAML files\
    \ as a declaration of what is wanted, and will set up pods, connections and so\
    \ on to get the cluster into the \"desired\" state. This has never been only a\
    \ high-level overview of Kubernetes, but many details and features of the system\
    \ have been implemented. We will oversee autoscaling (both pods and the nodes\
