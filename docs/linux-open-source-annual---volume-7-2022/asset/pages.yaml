  md: '# Email clients


    # The Verdict


    ![](img/77609ebc8773ced089e75787331e1931_124_0.png)


    Mailspring is the email tool featured in this Roundup. All the others we have
    received over delivery, and we''ve discussed them at over the past few pages.
    In a break from tradition at Roundups, we will spend some time going over the
    pros and cons of the winners, this time we''ll spend more time on the features
    of the last place than the other tools.


    This is because we''ve rarely come across an application that has so thoroughly
    impressed us. At the same time, we have a few speedy features and the lack of
    interest in key features that makes it one of the best tools available.


    Judging by the quality of its tests, you can see that Mailspring lags behind the
    other tools only in the add-ons and near-configuration features. In a digital
    age, an application that doesn''t encrypt your emails or has multiple ways to
    filter spam is unimaginable. It is for that Mailspring finishes last. Otherwise,
    we were stunned by the speedy performance, the clean interface and the how simple
    everything you must experience yourself, as words don''t cut it here. Even though
    the project relies on funding through the provider it runs, it still feels generous
    to offer some of its delivery to the free users, which is much appreciated.


    Granted, some of these features, such as delivery notification are also available
    on Thunderbird, but it isn''t neatly tied into the Mailspring integration with
    Thunderbird, which is a bit more convenient than the link we shared.


    Clauw makes some improvements since we last looked at it. Clauw, meanwhile, is
    not close to the style of Thunderbird and Evolution, but if you''re looking for
    a low-spec machine, we would recommend using it instead. Evolution is a close
    second, but Thunderbird wins on account of its default features, sheer prowess
    and numerous extensions.


