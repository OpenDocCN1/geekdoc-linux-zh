  md: "The Controller manager monitors the state of the cluster, via the API Server\
    \ to start or stop nodes as needed. It also manages internal connections and security\
    \ tokens.\n\nEach node runs kubelet, which communicates with the API server and\
    \ manages containers—generally using Docker and kube-Proxy, with network routing\
    \ and load balancing within the cluster.\n\nThe etcd distributed database system\
    \ is used to store all cluster configuration information; the suffix '+' is used\
    \ to denote a daemon process. The goals of etcd are to store key-value data in\
    \ a distributed, consistent and fault tolerant way.\n\nThe API server keeps all\
    \ the state in etcd and runs many instances concurrently. The scheduler and controller\
    \ manager can have only one active instance but uses a lease system to determine\
    \ which running instance is master. This means that Kubernetes can run highly\
    \ Available with no single points of failure.\n\n![](img/77609ebc8773ced089e75787331e1931_80_0.png)\n\
    \nUse the dashboard to view an al-a-glance summary of Kubernetes in action\n\n\
    # Putting it all together\n\nHow do we use these components in practice? What\
    \ is an example of setting up a WordPress website using Kubernetes? If you wanted\
    \ to do this for real, you would probably use a recipe called a helm chart. Helm\
    \ charts are available for a number of components, but here we'll look at the\
    \ steps needed to set up a WordPress site and run it on Kubernetes.\n\nThe first\
    \ task is to define a database for MySQL: kubectl create secret generic mysql-pass\
    \ --from-literal=password=password kubectl will talk to the API Server, which\
