    # Customisation


    And adding and enabling modules using .htaccess options.


    Since most websites use a server-side language, such as a WordPress installation
    or basic code to handle a contact form from HTML, let''s have a look at how to
    implement.


    Extending web servers is easier than others. However, from a simple standpoint,
    Apache and Lighttpd make it very easy to configure modules and enable them. For
    example, one module that is not enabled by default in Apache or Nginx can be enabled
    from the first, so which commands to enable and disable are not part of the problem.
    With Nginx, adding and configuring modules runs without issue.


    Nginx is not as straightforward as Apache or Lighttpd, either they can be enabled
    to somewhat with simple commands for intermediate users. Aside from adding modules
    to a server, there will come a time when we need to edit the server configurations
    or add folders to files which we can make custom configurations,


