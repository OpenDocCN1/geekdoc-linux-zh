  md: '# # Chapter 16

    # High performance assembly


    In this chapter we discuss some strategies for writing efficient x86-64 assembly
    language. The gold standard is the efficiency of implementations written in C
    or C++ and compiled with a good optimizing compiler. The author uses gcc to have
    it produce an assembly language file. Studying this generated code may give you
    some ideas about how to write efficient assembly code.


    # ## 16.1 Efficient use of cache


    One of the goals in high performance computing is to keep the processing units
    of the CPU bus. A modern CPU like the Intel Core i7 operates at a clock speed
    around 3 GHz while its main memory maxes out at about 21 GB/sec. If your application
    strictly from data and instructions in memory using no cache, then there would
    be roughly 7 bytes available per cycle. The CPU has 4 cores which need to share
    the 21 GB/sec, so we''re down to 2 bytes per cycle per memory. Yet each of these
    cores can have instructions being processed in 3 processing sub-units and 2 processing
    sub-units. Each CPU can complete 4 instructions per cycle. The same is true for
    the AMD Bulldozer CPUs. It requires more than 2 bytes per cycle to keep instructions
    flowing in a modern CPU. To keep these CPUs requires 3 levels of cache.


    I performed a short test to illustrate the effect of main memory access versus
    cache on a Core i7 CPU. The test consisted of executing 10 billion exclusive or
    operations on quad-words in memory. In the plot below you can see that the time
    depends heavily on the array size. With an array of size 8000, the time is 1.5
    seconds. The time steadily grows through the use of the 8 MB cache. When the size
    is 80 million bytes the cache is nearly useless and a maximum of about 5.7 seconds
    is reached.'
