- pgno: 207
  md: "# # Chapter 17\nCounting bits in an array\n\nIn this chapter we explore several\
    \ solutions to the problem of counting all the 1 bits in an array of quad-word\
    \ integers. For each test we use the same C main program and implement a different\
    \ function counting the number of 1 bits in the array. All functions implement\
    \ the same prototype:\n\n```\nlong popcnt_array ( long *a, int size );\n```\n\n\
    #  17.1 C function\n\nThe first solution is a straightforward C solution:\n\n\
    ```\nlong popcnt_array ( long *a, int size )\\n{\n    int w, b;\n    long word;\n\
    \    long n;\n\n    n = 0;\n    for ( w = 0; w < size; w++) {\n        word =\
    \ a[w];\n        n += word & 1;\n        for ( b = 1; b < 64; b++) {\n       \
    \     n += (word >> b);\n        }\n    }\n    return n;\n}\n```\n\nThe testing\
    \ consists of calling popcnt_array 1000 times with an array of 100000 longs (800000\
    \ bytes). Compiling with optimization level zero (option -o0) the test took 14.63\
    \ seconds. 5.29 seconds, with level 2 it took 5.29 seconds again, and with level\
    \ 3 it took 5.37 seconds. Finally adding -funroll-all-loops, it took 4.74 seconds."
  merge: -1
  img_proc: true
- pgno: 208
  md: "The algorithm can be improved by noticing that frequently the upper bits of\
    \ the quad-words being tested might be 0. We can change the inner loop for a while\
    \ loop:\n\n```\nlong popcnt_array ( unsigned long *a, int size ) {\n  int w, b;\n\
    \  unsigned long word;\n  long n;\n\n  n = 0;\n  for ( w = 0; w < size; w++) {\n\
    \    word = a[w];\n    while ( word != 0 ) {\n      n += word & 1;\n      word\
    \ >>= 1;\n    }\n  }\n  return n;\n}\n```\n\nUsing the maximum optimization options\
    \ the version takes 3.34 seconds. This is an instance of using a better algorithm.\n\
    \n# 17.2 Counting 1 bits in assembly\n\nIt is not too hard to unwind the loop\
    \ for working on 64 bits into 64 steps of working on 1 bit. In the assembly code\
    \ which follows one fourth of the bits of each word are placed in rbx, one fourth\
    \ in rcx and one fourth in rdx. Then each fourth of the bits are accumulated using\
    \ different registers. This allows considerable freedom for the computer to use\
    \ out-of-order execution with the loop.\n\n```\nsegment .text\nglobal popcnt_array\n\
    popcnt_array:\n  push rbx\n  push rbp\n  push r12\n  push r13\n  push r14\n  push\
    \ r15\n  xor eax, eax\n  xor ebx, ebx\n  xor ecx, ecx\n  xor edx, edx\n  xor r12d,\
    \ r12d\n  xor r13d, r13d\n  xor r14d, r14d\n  xor r15d, r15d\ncount_words:\n \
    \ mov r8, [rdi]\n  mov r9, r8\n  mov r10, r8\n```"
  merge: -1
  img_proc: true
