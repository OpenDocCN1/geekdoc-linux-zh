  md: '# Appendix A


    # Installing ebe


    There are basically 2 choices for installing ebe: either install a pre-compiled
    binary package or install from source. Installing binary packages a compatible
    binary package. There has been a need for different packages for different Linux
    distributions which could be frustrating. Generating an OS X binary package still
    requires installing the Qt libraries. On the other hand installing from source
    is easily easy and to keep up to date.


    # Installing from binary packages


    You can find Linux binary packages at the qtebe sourceforge: https://sourceforge.net/projects/qtebe/Linux.
    There will be some recent files for a few versions of Linux. My Linux computer
    is running Ubuntu, the Ubuntu files are most likely to be up-to-date. These packages
    are installation programs prepared with Inno Setup. To install, you download the
    file and execute it. The installer is fairly normal looking GUI and selecting
    the defaults at each step are adequate.


    The binary installation packages for OS X are also at sourceforge at https://sourceforge.net/projects/qtebe/os
    x. The binary install package for OS X is a gzipped archive. You should use


    ```

    tar xvf mac-ebe-2.3.4.tgz    # use the proper version number

    ```


    to extract the files. This will create a directory named “ebe.d”. To install ebe
    you would run the install script using


    ```

    cd ebe.bd

    bash install

    ```


    This will install ebe in /usr/local/bin, but you can also specify a directory
    for the installation using


    ```

    bash install directory

    ```'
