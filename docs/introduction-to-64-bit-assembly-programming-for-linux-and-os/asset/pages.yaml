  md: "# 8.3 Looping with conditional jumps\n\nThe jumps and conditional jumps introduced\
    \ so far have been jumping forward. By jumping backwards, it is possible to produce\
    \ a variety of loops. In this section we discuss while loops, do-while loops and\
    \ counting loops. We also discuss how to implement the effects of C's continue\
    \ and break statements with loops.\n\n# While loops\n\nThe most basic type of\
    \ loop is possibly the while loop. It generally works like this in C:\n\n```\n\
    while ( condition ) {\n    statements;\n}\n```\n\nC loops support the break statement\
    \ which gets out of the loop and the continue statement which immediately goes\
    \ back to the top of the loop. Structured programming favors avoiding break and\
    \ continue. However they can be effective solutions to some problems, and used\
    \ carefully, they are frequent clearer than alternatives based on setting condition\
    \ variables. They are substantially easier to implement in assembly using condition\
    \ variables and faster.\n\n# Counting 1 bits in a multi-quad\n\nThe general strategy\
    \ is to shift the bits of a quad-word 1 bit at a time and add 0 of the value at\
    \ each iteration of a loop to the sum of the 1 bits. This loop needs to be done\
    \ 64 times. Here is the C code for the loop:\n\n```\nsum = 0;\ni = 0;\nwhile (\
    \ i < 64 ) {\n    sum += data & 1;\n    data = data >> 1;\n    i++;\n}\n```\n\n\
    The program below implements this loop with only the minor change that values\
    \ are in registers during the execution of the loop. It would be pointless to\
    \ store these values in memory during the loop. The C code is shown as comments\
    \ which help explain the example code.\n\n```\nsegment .data ; long data;\ndq\
    \ 0xfedcba9876543210 ; long sum;\nsum 0\nsegment .text\nglobal main\n```"
