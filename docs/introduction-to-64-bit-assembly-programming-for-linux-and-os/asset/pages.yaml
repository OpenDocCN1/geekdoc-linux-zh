  md: 'remarkable results. A good example is the Atlas (Automatically Tuned Linear
    algebra Software) library which can achieve over 95% of the possible CPU performance.
    The Atlas matrix multiplication function is probably at least 4 times as efficient
    as similar code written in C. So, while it is true that assembly language can
    offer performance benefits, it is unlikely to outperform C++ for most purpose
    tasks. Furthermore it takes intimate knowledge of the CPU to achieve these gains.
    In this book we will point out some general strategies for writing efficient assembly
    programs.


    One advantage of assembly language is that it can do things not possible in high
    level languages. Examples of this include handling hardware interrupts and managing
    memory mapping features of a CPU. These features are essential in an operating
    system, though not required for application programming.


    So we have seen that assembly language is much more difficult to use than higher
    level languages and only offers benefits in special cases to well-trained programmers.
    What benefit is there for most people?


    The primary reason to study assembly language is to learn how a CPU works. This
    helps when programming how the compiler implements the features of a high level
    language can aid in selecting features for efficiency. More importantly understanding
    the translation from high level language to machine language is fundamental in
    understanding why bugs behave the way they do. Without studying assembly language,
    a programming language is primarily a mathematical concept obeying laws. Beneath
    this mathematical exterior the computer executes machine instructions which have
    limits and can have unexpected behavior. Assembly language skills can help in
    understanding this unexpected behavior and improve one''s debugging skills.


    # 1.2 What is a computer?


    A computer is a machine for processing bits. A bit is an individual unit of computer
    storage which can take on 2 values: 0 and 1. We use computers to process information,
    but all the information is represented as bits. Collections of bits can represent
    characters, numbers, or any other information. Humans interpret these bits as
    information, while computers simply manipulate the bits.


    The memory of a computer (ignoring cache) consists mainly of a relatively large
    amount of "main memory" which holds programs and data while programs are executing.
    There is also a relatively small collection of memory within the CPU chip called
    "register set" of the computer.'
