  md: '# Chapter 9


    # Functions


    In this chapter we will discuss how to write assembly functions which can be called
    from C or C++ and how to call C functions from assembly. Since the C or C++ compiler
    generally does a very good job of code generation, it is usually not important
    to write complete programs in assembly. There might be a few algorithms which
    are best done in assembly, so we might write 90% of a program in C or C++ and
    write a few functions in assembly language.


    It is also useful to call C functions from assembly. This gives your assembly
    programs full access to all C libraries. We will use scanf to input values from
    stdin and we will use printf to print results. This will allow us to write more
    useful programs.


    # 9.1 The stack


    So far we have had little use for the run-time stack, but it is an integral part
    of using functions. We stated earlier that the stack extends to the highest possible
    address: 0x7ffffffff. This is not quite true. Inspection of the memory map using
    "cat /proc/$maps" shows the top stack address is 0x7ffff6b79000 for bash process
    and for other processes always matching the pattern 0x7ffffxxxx0. Perhaps this
    is a result of "stack randomization" which is an attempt to avoid rogue code which
    modifies stack values.


    Items are pushed onto the stack using the push instruction. The effect of push
    is to subtract 8 from the stack pointer rsp and then place the value pushed at
    that address. Initially the stack pointer will be set to 0x7fffffff00 (or some
    address ending in 000) by the operating system when a process is started. On the
    first push, rsp would be decreased to 0x7fffffe8 and an 8 byte value would be
    placed in bytes 0x7fffffe8 through 0x7fffffeff.'
  merge: -1
  img_proc: true
- pgno: 123
  md: "Many different values are pushed onto the stack by the operating system. These\
    \ include things like the environment (a collection of variable names and defining\
    \ things like the search path) and the command line parameters for the program.\n\
    \nValues can be removed from the stack using the pop instruction. pop operates\
    \ in the reverse pattern of push. It moves the value at the location specified\
    \ by the stack pointer (rsp) to a register or memory location and then adds 8\
    \ to rsp.\n\nYou can push a word and smaller values than 8 bytes, at some peril.\
    \ It works as long as the stack remains bounded appropriately for the current\
    \ operation. So if you push a word and then push a quad-word, the quad-word push\
    \ may fail. It is simpler to push and pop only 8 byte quantities.\n\n# 9.2 Call\
    \ instruction\n\nThe assembly instruction to call a function is call. A typical\
    \ use would be like\n\n```\ncall\tmy_function\n```\n\nThe operand my_function\
    \ is a label in the text segment of a program. The effect of the call instruction\
    \ is to push the address of the instruction following the call onto the stack\
    \ and transfer control to the address associated with my_function. The address\
    \ pushed onto the stack is called the “return address”. Another way to implement\
    \ a call would be\n\n```\npush\tnext_instruction\njmp\tmy_function\nnext_instruction:\n\
    ```\n\nWhile this does work, the call has more capability which we will generally\
    \ ignore.\n\nEbe shows the top of the stack (normally 6 values) as your program\
    \ executes. Below are the top 3 quad-words on the stack upon to enter main in\
    \ an assembly program. Immediately preceding this register display was a call\
    \ instruction to main.\n\n| Name | Type | Value |\n|---|---|---|n| global | stack\
    \ unsi... | 0x0002aaaff5ec5 0x0000000000000000 0x00007ffffffeb38... |\n| locals\
    \ | | |\n\nThe first item on the stack is the return address, 0x2aaaaff5ec5. Normal\
    \ text segment addresses tend to be a little past 0x400000 in Linux programs as\
    \ illustrated by rip in the register display below taken from"
