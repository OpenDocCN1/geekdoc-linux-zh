  md: "# A good hash function for strings\n\nA good hash function for strings is to\
    \ treat the string as containing polynomial coefficients and evaluate p(n) for\
    \ some prime number n. In the code we use the prime number 191 in the evaluation.\
    \ After evaluating the polynomial value, you can perform a modulus operation using\
    \ the table size (100000 in the sample code).\n\n```\nint hash ( unsigned char\
    \ *s ) {\n    unsigned long h = 0;\n    int i = 0;\n    while ( s[i] ) {\n   \
    \     h = h*191 + s[i];\n        i++;\n    }\n    return h % 100000;\n}\n```\n\
    \n# Hash table node structure and array\n\nIn the sample hash table the table\
    \ size is 256, so we need an array of 256 NULL pointers when the program starts.\
    \ Since this is quite small, it is implemented in the data segment. For a more\
