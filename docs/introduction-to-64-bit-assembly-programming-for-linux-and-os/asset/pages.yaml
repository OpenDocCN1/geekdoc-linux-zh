- pgno: 210
  md: "# # 17.3 Precomputing the number of bits in each byte\n\nThe next algorithmic\
    \ improvement comes from recognizing that we can precompute the number of bits\
    \ in each possible bit pattern for a byte and use an array of 256 bytes to store\
    \ the number of bits in each possible byte. Then counting the number of bits in\
    \ a quad-word consists using the 8 bytes of the quad-word as indices to the array\
    \ of bit counts and adding them up.\n\nHere is the C function for adding the number\
    \ of bits in the array without the initialization of the count array:\n\n```\n\
    long popcnt_array ( long *a, int size ) {\n    int b;\n    long n;\n    int word;\n\
    \n    n = 0;\n    for (b = 0; b < size*8; b++) {\n        word = ((unsigned char*)a)[b];\n\
    \        n += count[word];\n    }\n    return n;\n}\n```\n\nThis code took 0.24\
    \ seconds for the test, so we have a new winner. I tried to beat this algorithm\
    \ using assembly language, but managed only a tie.\n\n# # 17.4 Using the popcnt\
    \ instruction\n\nA new instruction included in the Core i series processors popcnt\
    \ which gives the number of 1 bits in a 64 bit register. So on the right computers,\
    \ we can employ the technique of using a specialized instruction:\n\n```\n.text\n\
    global popcnt_array\npopcnt_array:\n    xor eax, eax\n    xor r8d, r8d\n    xor\
    \ ecx, ecx\ncount_more:\n    popcnt rdx, [rdi]+rcx*8]\n    add rax, rdx\n    popcnt\
    \ r9, [rdi]+rcx*8]\n    add r8, r9\n    add rcx, 2\n    cmp rcx, rsi\n    jl .count_more\n\
    ```"
  merge: -1
  img_proc: true
