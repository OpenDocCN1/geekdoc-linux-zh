    # # Binary multiplication


    Binary multiplication is also much like decimal multiplication. You multiply one
    bit at a time of the second number by the top number and write these products
    down staggered to the left. Of course "products" are trivial. You are multiplying
    either 0 or 1. In the case of 0, you just skip it. For 1 bits, you simply copy
    the top number in the correct columns.

    After copying the top number enough times, you add all the partial products. Here
    is an example:


    ```

    1010101

    x 10101

    1010101

    1010101

    1010101

    11101111101

    ```


