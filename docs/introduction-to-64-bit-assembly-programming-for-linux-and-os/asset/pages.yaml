- pgno: 118
  md: '```

    lea rsi, [source]

    lea rdi, [destination]

    mov ecx, 1000000

    more: lodsb

    cmp al, 13

    je skip

    stosb

    skip: sub ecx, 1

    repe jnz more

    ```


    # Scan


    The scabs instruction searches through an array looking for a byte matching the
    byte in al. It uses the rdi register. Here is an implementation of the C strlen
    function:


    ```

    segment .text

    global strlen

    strlen:

    ncld : prepare to increment rdi

    mov rcx, -1 ; maximum iterations

    xor al, al ; will scan for 0

    repne scabs ; repeatedly scan for 0

    mov rax, -2 ; start at -1

    end the past

    sub rax, rcx


    ```


    The function starts by setting rcx to -1, which would allow quite a long repeat
    loop since the code uses repe to loop. It would decrement rcx after 2^64 times
    in order to reach 0. Memory would run out.


    It so happens that the Linux ABI places the first parameter to a function in rdi,
    so strlen starts with the proper address set for the scan. The standard way to
    return a value is to place it in rax, so we place the length there.


    # Compare


    The cmps instruction compares values of 2 arrays. Typically it is used with repe
    which will continue to compare values until either the count in ecx reaches 0
    or two different values are located. At this point the comparison is complete.


    This is almost good enough to write a version of the C strcmp function, but strcmp
    expects strings terminated by 0 and lengths are not usually known for strings.
    It is good for memcmp:


    ```

    segment .text

    global memcmp

    memcmp: mov rcx, rdx

    repe cmpsb ; compare until end or difference

    cmp rcx, 0 ; reached the end

    jz equal :

    movzx eax, byte [rdi-1]

    movzx ecx, byte [rsi-1]

    ```'
