  md: '# 2.3 Integers


    On the x86-64 architecture integers are 1 byte, 2 bytes, 4 bytes, or 8 bytes in
    length. Furthermore for each length the numbers can be either signed or unsigned.
    Below is a table listing minimum and maximum values for each type of integer.


    | Variety | Bits | Bytes | Minimum | Maximum |

    | --- | --- | --- | --- | --- |

    | unsigned | 8 | 1 | 0 | 255 |

    | signed | 8 | 1 | -128 | 127 |

    | unsigned | 16 | 2 | 0 | 65535 |

    | signed | 16 | 2 | -32768 | 32767 |

    | unsigned | 32 | 4 | 0 | 4294967295 |

    | signed | 32 | 4 | -2147483648 | 2147483647 |

    | unsigned | 64 | 8 | 0 | 1844674407309551616 |

    | signed | 64 | 8 | -9223372036854775808 | 9223372036854775807 |


    Let''s consider the unsigned 16 bit integer. This maximum number is 16 bits all
    equal to 1 or 1111111111111111. The leftmost bit is 15 so its value is $2^{15}$.
    Now suppose we add 1 to 1111111111111111. It is pretty clear that we will get
    a carry in every position and the result is 10000000000000000. This new number
    has 17 bits and the first bit position is 16, so we get


    > 1111111111111111 + 1 = $2^{16}$


    Phrasing this more conveniently

    1111111111111111 - 1 = $2^{16} - 1 = 65535$


    Similarly the maximum unsigned 64 bit integer is $2^{64} - 1$ and the maximum
    signed 64 bit integer is $2^{63} - 1$. The range of 64 bit integers is large enough
    for most needs. Of course there are exceptions, like $20! = 5109094217179400000$.


    Unsigned integers are precisely the binary numbers discussed earlier. Signed integers
    are stored in a binary format "two’s complement”. The first bit of a signed integer
    is the sign bit. If the sign bit is 0, the number is positive. The most obvious
    way to store negative numbers would be to use the remaining bits to store the
    absolute value of the number.


    | sign bit | value |

    | --- | --- |

    | 31 | 0 |'
  merge: -1
  img_proc: true
