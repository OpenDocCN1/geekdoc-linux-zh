- pgno: 166
  md: 'The lseek system allows you to set the current position for reading or writing
    in a file. Its prototype is


    ```

    long lseek(int fd, long offset, int whence);```

    ```


    The offset parameter is frequently simply the byte position in the file, but the
    meaning of offset depends on the value of whence. If whence is 0, then offset
    is the byte position. If whence is 1, offset is relative to the current position.
    If whence is 2, then offset is relative to the end of file. The return value from
    lseek is the position of the next read or write for the file.


    Using lseek with offset 0 and whence equal to 2, lseek will return a byte position
    1 greater than the last byte of the file. This is an easy way to determine the
    file size. Knowing the size, you could allocate an array and read the entire file
    (as long as you have RAM).


    ```

    mov rdi, [fd]

    xor esi, esi      ; set offset to 0

    mov edx, 2              ; set whence to 2

    call lseek              ; determine file size

    mov rdi, [size],rax

    call malloc            ; allocate array

    mov [data], rax

    mov rdi, [fd]

    xor esi, esi          ; set offset to 0

    xor edx, edx            ; whence to 0

    call lseek              ; seek to start of file

    mov rdi, [fd]

    mov rsi, [data]

    mov rdx, [size]

    call read              ; read the entire file```

    ```


    With both 64 bit Linux and OS X, lseek uses a 64 bit integer for the offset parameter
    and makes it possible to seek to positions greater than 232. Doing the same with
    32 bit Linux would require using lseek64.


    # close system call


    When you are done reading or writing a file you should close it. The only parameter
    for the close system call is the file descriptor for the file to close. If you
    exit a program without closing a file, it will be closed by the operating system.
    Data read or written using file descriptors is not buffered in the user program,
    so there will not be anywritten data which might be lost. This is not true for
    using FILE pointers which can result in loss data if there is no close. The biggest
    advantages of closing files are that it reduces overhead in the kernel and avoids
    running into the per-process limit on the number of open files.


    ```

    mov edi, [fd]

    call close```

    ```'
