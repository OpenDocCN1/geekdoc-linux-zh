    itit is necessary to explicitly add new-line (0x0a) and 0 bytes.


    Here is a C printf call


    ```

    char name[64];

    int value;

    printf ("The value of %s is %dn", name, value \);

    ```


    Here is the same printf call in assembly


    ```

    segment .data

    value times 64 db 0

    name df      0

    fmt db      "The value of %s is %d",0x0a,0

    segment .text

    lea rdi, [fmt]

    lea rsi, [name]

    mov edx, [value]

    xor eax, eax

    call printf

    ```


    printf can have floating point parameters, so be careful to count them

    and set rex appropriately.'
