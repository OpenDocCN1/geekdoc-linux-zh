- pgno: 228
  md: '# # Installing from source on Linux


    Installing from source on Linux is not too difficult. The basic idea is to install
    the programs and libraries required to compiler ebe, download the source code
    and compile. The examples are for Qt 4, but ebe is also compatible with Qt 5.


    # # Installing the required packages for Ubuntu


    The required packages (as defined by Ubuntu 14.04) are astyle, g++, gfortran,
    git, qt4-dev-tools and yasm. These can be installed under Ubuntu


    ```

    sudo apt-get install astyle g++ gfortran git qt4-dev-tools

    yasm

    ```


    It is also possible to install them using separate git commands for each package.
    Many of these packages will depend on other packages which will also be downloaded
    and installed with the ones listed. The package names may differ on another version
    of Linux and the contents and dependencies may also differ. It may be necessary
    to install gdb which was installed along with g++.


    You could use GUI tools to install these packages, by Muon and the Ubuntu Software
    Center will not make the task any easier. It is far simpler to just type in the
    apt-get command.


    # # Installing the required packages for Fedora


    With Fedora the tool to install packages is yum and the required packages have
    different names. Use


    ```

    sudo yum install astyle

    sudo yum install gcc-c++

    sudo yum install gcc-gfortran

    sudo yum install git

    sudo yum install qt-devel

    sudo yum install qtwebkit-devel

    sudo yum install qtwebkit-devel

    ```


    The names of the tools we all need have "qt4" appended to them in /usr/bin so
    you can have Qt 4 and Qt 5 on the same computer. The simplest alternative is to
    place the directory where these tools are installed into the PATH variable. This
    can be done on the command line or in your .bash_profile file in your home directory:


    ```

    export PATH=/usr/lib64/qt4/bin:$PATH

    ```'
