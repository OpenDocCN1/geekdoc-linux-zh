  md: 'Next let''s convert the hexadecimal value 0FA13 from a 16 signed integer to
    a decimal value. Start by converting to binary: 1111 1010 0001 0011. Invert the
    bits: 0000 0101 1110 1100. Add 1 to get the 2''s complement: 0000 0101 1110 1101.
    Convert this to decimal: 1024 + 256 + 128 + 64 + 32 + 8 + 4 + 1 = 1517, so 0FA13
