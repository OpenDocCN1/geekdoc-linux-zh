  md: "# # Chapter 19\nComputing Correlation\n\nThe final example of optimization\
    \ is computing the correlation between two variables x and y given n sample values.\
    \ One way to compute correlation is using\n\n```\n$$r_{xy} = \\frac{\\sum_{i=1}^{n}(x_i\
    \ - \\bar{x})(y_i - \\bar{y})}{\\sqrt{\\sum_{i=1}^{n}(x_i - \\bar{x})^2 \\sum_{i=1}^{n}(y_i\
    \ - \\bar{y})^2}}$$$\n```\n\nBut this formula requires two passes the data one\
    \ pass to compute averages and a second pass to complete the formula. There is\
    \ a less intuitive formula which is more amenable to computation:\n\n```\n$$r_{xy}\
    \ = \\frac{n\\sum_{i=1}^{n}x_iy_i - \\sum_{i=1}^{n}x_i\\sum_{i=1}^{n}y_i}{\\sqrt{n\\\
    sum_{i=1}^{n}x_i^2 - (\\sum_{i=1}^{n}x_i)^2 \\n\\sum_{i=1}^{n}y_i^2 - (\\sum_{i=1}^{n}y_i)^2}}$$$\n\
    ```\n\nThe computational formula requires computing 5 sums when you scan the data:\
    \ the sum of $x_i$, the sum of $y_i$, the sum of $x_i^2$, the sum of $y_i^2$ and\
    \ the sum of $x_iy_i$. After computing these 5 sums there is a small amount of\
    \ time required for implementing the computational formula.\n\n# ## 19.1 implementation\n\
    \nThe C computation is performed in the corr function given below:\n\n```\n#include\
    \ math.h\n\ndouble corr ( double x[], double y[], long n )\n{\n    double sum_x,\
    \ sum_y, sum_xx, sum_yy, sum_xy;\n    long i;\n    sum_x = sum_y = sum_xx = sum_yy\
    \ = sum_xy = 0.0;\n    for (i = 0; i < n; i++) {\n        sum_x += x[i];\n   \
    \     sum_y += y[i];\n        sum_xx += x[i]*x[i];\n        sum_yy += y[i]*y[i];\n\
    \        sum_xy += x[i]*y[i];\n    }\n```"
