  md: '# Register window


    The register window provides a live display of the 16 general purpose registers,
    the instruction pointer and the CPU flags. Here is a sample


    | | | | | | |

    |---|---|---|---|---||

    | rax | 480 | rsi | 07ffffeb38 | r8 | 0x400cca |

    | rbx | 0x0 | rdi | 0x1 | r9 | 0x0 |

    | rcx | 0xffffffff | rbp | 0xfffffea50 | r10 | 0x1 |

    | rdx | 0xfffffeb48 | rsp | 0xfffffea40 | r11 | 0x246 |

    | rip | 0x400c33 | eflags | IF |


    Registers r12-r15 have been left out that the rest of the registers could be used
    using larger characters. You can change the format of a register (other than rip)
    by right clicking on its name. This will pop up a form allowing you to choose
    decimal or hexadecimal for that register or for all the registers. The flags which
    are currently set are displayed. In the sample the interrupt flag is set. Some
    interrupts can be ignored IF it is set while there are other non-maskable interrupts
    which are beyond software control.


    # Floating point register window


    The floating point registers are displayed in a separate dockable window. Here
    is an example


    | | | | |

    |---|---|---||

    | xmm0 | 3.25 | xmm8 | 0 |

    | xmm1 | 10.53 | xmm9 | 0 |

    | xmm2 | 13.78 | xmm10 | 0 |

    | xmm3 | 0 | xmm11 | 0 |

    | xmm4 | 2.34181e-38 | xmm12 | 0 |

    | xmm5 | 0 | xmm13 | 0 |

    | xmm6 | 0 | xmm14 | 0 |

    | xmm7 | 0 | xmm15 | 0 |


    The floating point registers can be used to hold floats, doubles, packed floats,
    packed doubles and variety of packed integers of various sizes. Using AVX instructions
    doubles the number of packed floats or doubles in each register. This makes it
    important to be select the format for the floating point registers. Right clicking
    on a register or its content will pop up a menu for selecting formatting one register
    or all. Then you get to select from all the possible interpretations of the registers.'
