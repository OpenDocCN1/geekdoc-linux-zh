  md: '# # Chapter 11

    Floating point instructions


    The 8086 CPU used a floating point coprocessor called the 8087 to perform floating
    point arithmetic. Many early personal computers lacked the 8087 chip and performed
    floating point operations internally. This arrangement continued until the 486
    which contained a coprocessor internally. The 8087 used instructions which manipulated
    a stack of 80 bit floating point values. These instructions are still part of
    modern CPUs, though there is a completely separate floating point facility available
    which has sixteen twelve bit registers (256 bits for the Intel Core i series)
    in 64 bit mode. We will study the newer instructions.


    If you study the Intel 64 and IA-32 Architectures Software''s Manual, you will
    find many instructions such as madd which work with registers named ST0, ST1,
    ... These instructions are for the math coprocessor. There are newer instructions
    such as addsd which work with Streaming SIMD Extensions (SSE) registers xmm0,
    xmm1, ..., xmm15. SIMD is an acronym for “Single Instruction - Multiple Data”.
    These instructions are the focus of this chapter.


    # ## 11.1 Floating point registers


    There are 16 floating point registers which serve multiple purposes holding either
    1 or multiple values. The names for these registers are xmm0, xmm1, ..., xmm15.
    These registers can be used with instructions operating on a single value in each
    register or on a vector of values. When used as a vector XMM register can be used
    as either 4 floats or 2 doubles. The registers can also be used for collections
    of integers of various sizes, though the SSE integer instructions are basically
    ignored in this book.


    The Core i series of computers introduced the Advanced Vector Extensions (AVX)
    which doubled the size of the floating point registers and added some new instructions.AVX
    To use the full 256 bits (8 floats'
