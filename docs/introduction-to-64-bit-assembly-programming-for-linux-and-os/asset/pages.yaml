    # 7.4 Exclusive or operation


    The final bit-wise operation is exclusive-or. This operation matches the everyday
    concept of 1 or the other but not both. The C exclusive-or operator is “A”.

    Here is a truth table for the exclusive-or operation:


    | | 0 1 |

    |---|--|

    |0 | 0 1 |

    |1 | 1 0 |


    From examining the truth table you can see that exclusive-or could also be called
    “not equals”. In my terminology exclusive-or is a “flipper”. Consider the right
    operand as a mask which selects which bits to flip in the left operand. Consider
    these examples:


    ```

    00010001b ^ 00000010b = 00010011b

    01010101b ^ 11111111b = 10101010b

    01101111b ^ 00001111b = 01110000b

    0axaaaaaaaa ^ 0xffffffff = 0x55555555

    0x12345678 ^ 0x12345678 = 0x00000000

    ```


    The x86-64 exclusive-or instruction is named xor. The most use of xor is an idiom
    for setting a register to 0. This is because moving 0 into a register requires
    7 bytes for a 64 bit register, while xor requires 3 bytes. You can get the same
    result using the 32 bit of the intended register which requires only 2 bytes for
    the instruction.

    Observe some uses of xor:


    ```

    mov   rax, 0x1234567812345678

    or   eax, eax            ; set to 0

    mov   rax, 0x1234

    xor   rax, rmf             ; change to 0x123b

    ```


    You can use xor to form the symmetric difference of 2 sets. The symmetric difference
    of 2 sets is the elements which are in one of the 2 sets but not both. If you
    don''t like exclusive-or, another way to compute this would be using ΔB = (A ∪
    B) ∩ A ∩ B. Surely you like exclusive-or.


