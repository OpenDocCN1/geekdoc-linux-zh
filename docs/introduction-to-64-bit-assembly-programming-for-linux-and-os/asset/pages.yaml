    # Printing the keys in order


    Printing the keys of a binary tree in order is easily performed by using recursion.
    The basic idea is to print the keys in the left sub-tree, print the keys of the
    root node and print the keys of the right sub-tree. The use of a special tree
    structure means that there needs to be a different function to recursively print
    sub-trees starting with the pointer to the root. The main function is named print
    and the recursive function is rec_print.


    ```

    rec_print:

    t equ 0

    push rbp

    mov rbp, rsp

    sub rsp, 16

    cmp rdi, 0

    je :done

    mov [rsp+t], rdi

    mov rdi, [rdi+n_left]

    call rec_print

    mov rdi, [rsp+t]

    mov rsi, [rdi+n_value]

    segment .data

    .print db "%ld\n",0

    segment .text

    lea rdi, [.print]

    call printf

    mov rdi, [rsp+t]

    mov rdi, [rdi+n_right]

    call rec_print

    .done leave

    ret

    ```


