    # # 1.5 Assembling and linking


    We use the yasm assembler to produce an object file from an assembly source code:


    ```

    yasm -f elf64 -P ebe.inc -g dwarf2 -l exit.ist exit.asm

    ```


    The yasm assembler is modeled after the nasm assembler. Yasm produces object code
    which works properly with the gdb and ddd debuggers, while nasm did not produce
    acceptable code for debugging testing. The -f elf64 option selects a 64 bit output
    format which is compatible with Linux and gcc. The -P ebe.inc option tells yasm
    to prefix exit.asm with ebe.inc which handles the naming differences between Linux
    and OS X. Ebe will prepare a copy of ebe.inc in the same directory as each assembly.
    The -g dwarf2 debugging format, which is essential for use with a debugger. For
    OS X the equivalent option is -g macho64. The -l exit.ist option asks for a listing
    file which shows the generated code in hexadecimal.


    The yasm command produces an object file exit.o, which contains the generated
    instructions and data in a form ready to link with other code from other object
    files or libraries. In the case of an assembly program with the start function
    the linking needs to be done with ld:


    ```

    ld -o exit.o

    ```


    The -o exit option gives a name to the executable file produced by ld. Without
    that, ld produces a file named a.out. If the assembly'
