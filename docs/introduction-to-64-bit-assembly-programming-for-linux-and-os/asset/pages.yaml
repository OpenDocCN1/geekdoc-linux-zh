    mov rex, [sample] : move qword into rex

    shl rex, 12 : wipe out higher bits

    shr rex, 35 : align the bit field

    mov [field], rex : save the field

    ```


    Now suppose we wish to fill in bits 51-23 of sample with the bits in field. The
    easy method is to rotate the value to align the field, shift right and then left
    the field back into bits 23-51. Here is the code:


    ```

    mov rex, [sample] : move qword into rex

    ror rex, 23 : align bit 23 at 0

    shr rex, 29 : wipe out 29 bits

    shl rex, 29 : align bits again

    or rex, [field] : trust field is 29 bits

    rol rex, 23 : realign the bit fields

    mov [sample], rex : store fields in memory

    ```'
