    # 7.6 Bit testing and setting


    It takes several to extract or insert a bit field. Sometimes you need to extract
    or insert a single bit. This can be done using masking and shifting as just illustrated.
    However it can be simpler and quicker to use the bit test instruction (bt) and
    either the bit test set instruction (bts) or the bit test reset instruction (btr).


    The bt instruction has 2 operands. The first operand is a 16, 32 or 64 bit word
    in memory or a register which contains the bit to test. The second operand is
    the number from 0 to the number of bits minus 1 for the word size set the carry
    flag (CF) to the value of the bit being tested.


    The bts and btr instructions operate similarly. Both instructions set the current
    bit in the same fashion as bt. They differ in bts sets the bit to 1 and btr resets
    (or clears) the bit to 0.


    One possibility for using these instructions is to implement a set of fairly large
    size where the members of the set are integers from 0 to n-1 where n is the universe
    size. A membership test translates into determining a word and bit in memory and
    testing the correct bit in the word. Following the bt instruction set instruction
    can be used to store the carry flag into an 8 bit register. There are setCC instructions
    for each of the condition flags in the eflags register. Insertion into the set
    translates into determining the word and bit number using bts to set the correct
    bit. Removal of an element of the set translates into using btr to clear the correct
    bit in memory.


