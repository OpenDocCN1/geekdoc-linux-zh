  md: '# Chapter 14


    # Using the C stream I/O

    functions


    The functions callable from C include a wide variety of functions in many areas
    including process management, file handling, network communications, string processing
    and graphics programming. Studying much of these capabilities would lead us too
    far afield from the study of assembly language. The stream input and output facilities
    provide an example of a higher level library which is also quite useful in many
    programs.


    In the chapter on system calls we called open, read, write and close which are
    merely wrapper functions for system calls. In this chapter we will focus on a
    similar collection of functions for buffered I/O. Buffered I/O means the application
    maintains a data buffer for each open file.


    Reading a buffered I/O system can be more efficient. Let''s suppose you asked
    the buffered I/O system to read 1 byte. It will attempt to read 1 byte from the
    buffer by already read data. If it must, then it reads enough bytes to fill its
    buffer - typically 8192 bytes. This means that 8192 bytes of 1 byte are satisfied
    by 1 actual system call. Reading a byte from the buffer is very fast. In fact
    reading a large file is over 20 times as fast as reading 1 byte at a time using
    the C stream getchar function compared to reading one byte at a time using read.


    You should be aware when you call read 1 byte, the operating system is forced
    by the disk drive to read complete sectors, so it must read at least 1 sector
    (probably 512 bytes). Most likely the operating system reads 4096 bytes and saves
    the data which has been read in order to make use of the data in subsequent reads.
    If the operating system did not use buffers, reading 1 byte at a time would require
    interacting with the disk for each byte which would be perhaps 10 to 20 times
    slower than using the buffer.'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'The net result from this discussion is that if your program needs to read or
    write small quantities of data, it will be faster to use the stream I/O facilities
    rather than using the system calls. It is generally possible to use the system
    calls and do your own buffering which is tailored for your needs saving time.
    You will of course pay for this improved efficiency by working harder. You must
    weigh the importance of improved performance versus increased labor.


    # 14.1 Opening a file


    The function to open a file using the stream I/O functions is fopen. Like the
    other stream I/O functions, begins with the letter “f” to make the name distinct
    from the system call wrapper function it resembles. The prototype for fopen is


    ```

    *fopen ( char *pathname, char *mode );

    ```


    The file to be opened is named in the first parameter and the mode is named in
    the second parameter. The mode can be any of the values from this table below


    | mode | meaning |

    | r | read-only |

    | r+ | read and write, truncates or creates |

    | w | write-only, truncates or creates |

    | w+ | read and write, truncates or creates |

    | a | write only, appends or creates |

    | a+ | read and write, appends or creates |


    The return value is a pointer to a FILE object. This is an opaque pointer in the
    sense that you never need to know the components of the FILE object. Most likely
    a FILE object is a struct which contains a pointer to the buffer for the file
    and various “house-keeping” data items about the file. This pointer is used in
    the other stream I/O functions. In assembly language it is sufficient to store
    the pointer in a quad-word and use that quad-word for function calls. Here is
    some code to open a file:


    ```

    segment .data

    db "Customers.dat",0

    mode db "*",0

    fp dq 0

    segment .text

    global fopen

    lea rdi, [name]

    lea rsi, [mode]

    ```'
