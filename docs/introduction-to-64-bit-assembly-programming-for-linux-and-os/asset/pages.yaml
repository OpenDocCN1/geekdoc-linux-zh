- pgno: 238
  md: 'replace the program with another by editing “.ebe.ini” or using the “Edit settings”
    option under the Edit menu.


    # Indent/unindent


    After marking a group of lines you can indent it one tab stop at a time using
    Control-> which resembles the C right shift operator (>>). You can shift the text
    left (unindent) using Control<. There are also menu options for indent/unindent
    and edit toolbar icons.


    # Comment/uncomment


    Control-K will comment the current line or a range of lines if some text is selected.
    Control-U will uncomment either the current line or a range of lines. Ebe will
    use comment syntax for the appropriate language.


    # Word/number completion


    Ebe keeps track of words and numbers to simplify entering/re-entering longer words.
    It starts with a collection of keywords and adds words and numbers as you edit.
    When you enter some text ebe will pop up a list of words to the right of where
    you are editing. Simply select the desired word (or number) and press “Enter”
    to accept the suggested completion or enter additional characters to narrow down
    the choices.


    # Editing multiple files


    It is possible to maintain several open files in ebe. You can open multiple times
    using the File menu or possibly you could use a project which consists of multiple
    files. The various files will be accessible as tabbed windows in the source subwindow
    of ebe.


    If you are not using a project ebe will compile or assemble only the currently
    selected file from those opened. This might be useful if you are working on a
    few similar projects or if you want to prepare a file for your program to access.
    If you are using a project, then ebe will build the program using the source files
    in the project. Once again it is possible to have a data file as part of a project.'
