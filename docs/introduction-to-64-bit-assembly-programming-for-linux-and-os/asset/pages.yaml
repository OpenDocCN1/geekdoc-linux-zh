  md: 'The registers primarily function as a place to store intermediate values during
    calculations based on values from main memory.


    # Bytes


    Modern computers access memory in 8 bit chunks. Each 8 bit quantity is called
    "byte". The main memory of a computer is effectively an array of bytes with each
    byte having a separate memory address. The first byte address is 0 and the last
    address depends on the hardware and software in use.


    A byte can be interpreted as a binary number. The binary number 01010101 equals
    the decimal number 85 (64+16+4+1). If this number is interpreted as a machine
    instruction the computer will push the value of the rbp register onto the run-stack.
    The number 85 can also be interpreted as the upper case letter "U". The number
    85 could be part of a larger number in the computer. The letter "U" could be part
    of a string in memory. It''s all a matter of interpretation.


    # Program execution


    A program in execution occupies a range of addresses for the instructions of the
    program. The following 12 bytes constitute a very simple program which simply
    exits (with status 5):


    | Address | Value |

    | 400080 | 184 |

    | 400081 | 60 |

    | 400082 | 0 |

    | 400083 | 0 |

    | 400084 | 0 |

    | 400085 | 191 |

    | 400086 | 5 |

    | 400087 | 0 |

    | 400088 | 0 |

    | 400089 | 0 |

    | 40008a | 15 |

    | 40008b | 5 |


    The addresses are listed in hexadecimal though they could have started with the
    equivalent decimal number 4194432. The hexadecimal values are more informative
    in this case, since there are numerous 0 values in the hexadecimal representation.
    This gives a clue to the way the operating system maps a program into memory.
    Pages of memory begin'
