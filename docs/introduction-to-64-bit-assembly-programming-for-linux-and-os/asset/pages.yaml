- pgno: 181
  md: "The list is referenced using the pointer stored at the memory location labeled\
    \ list. The nodes on the list are not identified with specific labels in the code\
    \ which maintains and uses the list. The only way to access these nodes is by\
    \ using the pointers in the list.\n\n# List node structure\n\nOur list node will\
    \ have 2 fields: a data value and a pointer to the next node. The yasm structure\
    \ definition is\n\n```\nstruct      node\nn_value  resq    1\nn_next    resq \
    \   1\n                 align   8\nendstruct\n```\n\nThe alignment instruction\
    \ is not needed with 2 quad-words in the structure, but it may protect us from\
    \ confusion later.\n\n# Creating an empty list\n\nThe first decision in designing\
    \ a container structure is how to represent an empty container. In this linked\
    \ list design we will take the simplest choice of using a NULL pointer as an empty\
    \ list. Despite this simplicity it may be advantageous to a function to create\
    \ an empty list.\n\nnewlist:\n\n```\nxor      eax, eax\nret\n```\n\n# Inserting\
    \ a number into a list\n\nThe decision to implement an empty list as a NULL pointer\
    \ leaves a small issue for insertion. Each insertion will be at the start of the\
    \ list which means there will be a new pointer stored in the list start pointer\
    \ for each insertion. There are 2 possible ways to cope with this. One way is\
    \ to pass the address of the pointer into the insertion function. A second way\
    \ is to have the insertion pointer return the new pointer and leave it to the\
    \ insertion code to assign the new pointer upon return. It is confusing to dodge\
    \ the address of a pointer problem. Here is the insertion code:\n\n```\n; list\
    \ = insert ( list, k );\ninsert:\n.list equ      0\n.k   equ      8\n        push\
    \ rbp\n        mov  rbp, rsp\n        sub  rsp, 16\n        mov  [rsp.+list],\
    \ rdi   ; save list pointer\n```"
