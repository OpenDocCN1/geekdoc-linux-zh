- pgno: 236
  md: 'Arrow keys Moving 1 character at a time is done using the left and right arrow
    keys on the keyboard. Up and down arrows move up or down one line at a time.


    Control + Arrow keys Control-Right moves 1 word to the right. Control-Left moves
    1 word to the left.


    Home/End Home moves to column 1 on the current line. End moves to the end of the
    current line.


    Control + Home/End Control-Home moves to column 1 of line 1. Control-End moves
    to the end of the file.


    PageUp/PageDown These keys move up/down one screenful at a time.


    Control-T/Control-B Control-T (top) moves to column 1 of the top line currently
    on the screen. Control-B (bottom) moves to column 1 of the last line currently
    on the screen.


    Control-M Control-M scrolls the screen until the current line is at the middle
    of the screen.


    Control-L Control-L will pop up a dialog where you can enter a line number to
    go.


    # Cut, copy and paste


    The first step in cutting or copying is to select the text to copy or cut.


    Left mouse Dragging with the left mouse button held down can be used to mark a
    section of text. Double clicking with the left mouse button will select a word
    of text.


    Select all You can select all of the text using Control-A or the Edit menu option.


    Select none You can cancel any select using Control-0 (zero) or the Edit menu
    option.


    Selected text can be cut, copied and pasted using either options in the Edit menu
    or the normal shortcuts: Control-X for cut, Control-C for copy, or Control-V for
    paste. The edit toolbar also has buttons for cut, copy and paste.


    # Undo/redo


    Control-Z will undo an edit operation. Insertions will be undone basically one
    line at a time. Shift-Control-redo will redo an edit operation. You can also do
    undo/redo using the menu system or the edit toolbar. The editor keeps'
