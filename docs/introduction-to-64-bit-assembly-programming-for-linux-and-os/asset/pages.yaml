    # 6.6 Conditional move instructions


    There are a collection of conditional move instructions which can be used profitably
    rather than using branching. Branching causes the CPU to perform branch prediction
    which will be correct sometimes and incorrect other times. Incorrect predictions
    slow down the CPU dramatically by interrupting the instruction pipeline, so it
    is worthwhile to learn conditional move instructions to avoid branching in simple
    cases.


    The conditional move instructions have operands much like the mov instruction.
    There are a variety of them which all have the same 2 operands as mov, except
    that there is no provision for immediate operands.


    | instruction | effect |

    |---|---|

    | cmovz | move if result was zero |

    | cmovnz | move if result was not zero |

    | cmovl | move if result was negative |

    | cmovle | move if result was negative or zero |

    | cmovg | move if result was positive |

    | cmovege | move if result was positive or zero |


    There are lot more symbolic patterns which have essentially the same meaning,
    but these are an adequate collection. All operate by testing for combinations
    of the sign flag (SF) and the zero flag (ZF).


    The following code snippet converts the value in rax to its absolute value:


    ```

    mov rbx, rax      ; save original value

    neg rax           ; negate rax

    cmovl rax, rbx ; replace rax if negative

    ```


    The code below loads a number from memory, subtracts 100 and replaces the difference
    with 0 if the difference is negative:


    ```

    mov rbx, 0      ; set rbx to 0

    mov rax, [x]    ; get x from memory

    ```'
