    # ## 7.7 Extracting and filling a bit field


    To extract a bit field you need to shift the bit so that its least significant
    is in position 0 and then mask the field with an operation with the appropriate
    mask. Let''s suppose we need to extract bits 51-23 from a quadword stored in a
    memory location. Then, after loading the quad, we need to shift 23 bits to get
    the least significant bit into the proper position. The bit field is of length
    29. The simplest way to get a proper mask (29 bits all 1) is using the value 0x1fffffff.
    Seven f is 28 bits and the 1 gives a total of 29 bits. Here is the code to do
    the work:


    ```

    mov rax, [sample]    ; move quad into rax

    shr rax, 23             ; align bit 23 at 0

    and rax, 0x1fffffff ; select 29 low bits

    mov [field], rax      ; save the field

    ```


    Of course it is possible that the field width is not a constant. In case you need
    an alternative. One possibility is to generate a string of 1 bits based on knowing
    that 2ⁿ1 is a string of n bits. You can generate 2ⁿ by shifting to the left n
    times or uses bits. You can then construct 1 using dec.


    Another way to extract a bit field is to shift left enough bits to clear the bits
    of the field and then shift right enough bits to wipe out the bits to the right
    of the field. This will be simpler when if the field position and width are variable.
    To extract bits 51-23, we start by shifting left 35 bits. Then general if the
    field is m through n where m is the higher bit number, we shift left 63 - m and
    then shift right n + (63 - m).'
  merge: -1
  img_proc: true
