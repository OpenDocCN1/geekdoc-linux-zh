    # 10.2 General pattern for memory references


    So far we have used array references in sample code without discussing the options
    for memory references. A memory reference can be expressed as


    [label] the value contained at label


    [label+2*ind] the value contained at the memory address obtained by adding the
    label and index register times 2


    [label+4*ind] the value contained at the memory address obtained by adding the
    label and index register times 4


    [label+8*ind] the value contained at the memory address obtained by adding the
    label and index register times 8


    [reg] the value contained at the memory address in the register


    [reg+k*ind] the value contained at the memory address obtained by adding the register
    and index register times k


    [label+reg+k*ind] the value contained at the memory address obtained by adding
    the label, the register and index register times k'
