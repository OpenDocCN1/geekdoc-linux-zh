  md: 'Let''s consider 8 bit signed integers and what we would get if we used the
    existing circuitry to add 2 such integers. Let''s add -1 and 1. Well, if we store
    -1 with a sign bit and then the value we would get


    ```

    -1 = 10000001

    1 = 00000001

    -1+1 = 10000010

    ```


    Oops! We end up with -2 rather than 0.

    Let''s try storing 8 bit numbers as a sign bit and invert the bits for the absolute
    value part of the number:


    ```

    -1 = 11111110

    1 = 00000001

    -1+1 = 11111111

    ```


    Now this is interesting: the result is actually -0, rather than 0. This sounds
    somewhat hopeful. Let''s try a different pair of numbers:


    ```

    -1 = 11111111

    4 = 00000100

    -1+4 = 00000010 = 2

    ```


    Too bad! It was close. What we need is add one to the complemented absolute value
    for the number. This is referred to as "two''s complement" arithmetic. It works
    out using the same circuitry as for unsigned numbers and is mainly a matter of
    interpretation.

    Let''s convert -1 to its two''s complement format.


    ```

    00000000 for the absolute value

    11111110 for the complement

    11111111 after adding 1

    -11111111

    ```


    Using two''s complement numbers the largest negative 8 bit integer is 10000000.
    To convert this back, complement the number and add 1. This gives 01111111 + 1
    = 10000000 = 128, so 10000000 = -128. We have noticed in the table of minimums
    and maximums that the minimum were 1 larger in absolute value than the maximum.
    This is due to complementing and adding 1. The complement yields a string of 1''s
    and adding 1 to that yields a single with a bunch of 0''s. The result is that
    the largest value for an n-bit signed integer is $2^{n-1} - 1$ and the smallest
    value is $-2^{n-1}$.

    Now let''s convert -750 to a signed binary number.


    ```

    750 = 512 + 128 + 64 + 32 + 8 + 4 + 2 = 1011110110b

    ```


    Now expressing this as a 16 bit binary number (with spaces to help track of the
    bits) we get 0000 1011 1101 1010. Next we invert the bits to get 1111 0100 0001
    0101. Finally we add 1 to -750 = 1111 0101 0001 0010 = 0FD12.'
  merge: -1
