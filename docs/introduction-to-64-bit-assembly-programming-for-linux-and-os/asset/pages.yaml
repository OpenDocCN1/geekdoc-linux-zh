  md: "# # Chapter 12\n\n# # System calls\n\nA system call is essentially a function\
    \ call which changes the CPU into kernel mode and executes a process on Linux\
    \ which means it is part of the kernel. When you run a program it runs in user\
    \ mode which that it is limited to executing only \"safe\" instructions. It can\
    \ move data within the program, do arithmetic, do branching, call functions, ...,\
    \ but there are instructions your program can't do directly. For example it would\
    \ be unsafe to allow any user or write directly to the disk device, so this is\
    \ avoided by preventing user programs from executing input or output instructions.\
    \ Another prohibited action is directly setting page mapping registers.\n\nWhen\
    \ a user program needs to do something like open a disk file, makes a system call.\
    \ This changes the CPU's operating mode to kernel mode where the CPU can execute\
    \ input and output instructions. The kernel open call will verify that the user\
    \ program has permission to open the file and then open it, performing any input\
    \ or output instructions required on behalf of the program\n\nThe Linux system\
    \ call interface is defined for 32 bit and 64 bit mode. Under 64 bit Linux the\
    \ 32 bit interface is still available to support 32 bit applications and this\
    \ will work to some extent for 64 programs.\n\n# ## 12.1 32 bit Linux system calls\n\
    \nEach system call is defined in `/usr/include/asm/unist_32.h`. To execute the\
    \ system call you must place the system call number in register eax and use the\
    \ software interrupt instruction to effect the call: `0x80`. System calls have\
    \ parameters which are placed in registers ebx, ecx, edx, esi, edi, and ebp. Return\
    \ values are placed in eax.\n\nHere is a system call to write to stdout:\n\n```\n\
    hello:\n  segment .data\n```"
