- pgno: 233
  md: 'window and can be dismissed in the normal manner for windows on your computer.


    # Menu


    The menu system contains nearly everything which can be done in the program. Nearly
    all the menu options have keyboard shortcuts. Use the menu to figure out what
    all can be done and learn some keyboard tricks as you progress. A few things like
    using control with the arrow keys, home and end are not in the menu, so experiment.


    # Movable toolbars


    There are a collection of 4 toolbars in ebe: the file toolbar, the edit tool bar,
    the debug toolbar and the template toolbar. Each of these icons to perform common
    actions and each has a "grab point" on the left or top which can be used with
    a left click to move the toolbar. You can move a toolbar out of the program to
    make it a separate window. You can also right click on the grab point to select
    which toolbars are visible. Below the debug toolbar is shown as it appears as
    a separate window.


    Ebe remembers the configuration of the ebe main window, the toolbars and its subwindows
    using the file “ebe.ini", so you can relocate the toolbars as you wish to make
    using ebe more convenient. There is a separate “ebe.ini” in each directory where
    you use ebe, so you can customize the appearance for different languages or projects.


    # Movable subwindows


    In addition to movable toolbars ebe has a collection of movable or dockable subwindows:
    data, register, floating register, terminal, project, toy box, bit bucket, backtrack
    and console windows. Ebe keeps track of the visibility and location of these subwindows
    in “ebe.ini" to make it easy to customize. Below we see ebe with a few of the
    windows in their “docked” location.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '![](img/a81fe45f331f8cec874684a58e65cf74_234_0.png)


    Between each of the docked windows is a "resize bar" which can be used with a
    left click to adjust the division of space allotted to the docked windows. There
    is also a resize bar between the docked windows and the source window which can
    be used to adjust the width of the docked windows.


    Each docked window has a "title bar" at the top. There are 2 tiny icons on the
    right of each title bar which can be used to make the window standalone or to
    make the window disappear. You can also use a right click on a title bar to pop
    up a menu allowing you to select which dock windows and toolbars are visible.
    Visibility can also be controlled using the View menu.


    You can use a left click on a dock title bar to drag it around. You can drag it
    out of ebe to make it stand alone or to a different vertical position in the dock
    area. You will notice a gray area in the dock area where the window will drop
    when you release the left button. You can drag a dock window to the right of the
    ebbe or to the bottom to use 2 dock areas. Finally you can drag a dock window
    on top of another to create a collection of tab dock windows. Perhaps you would
    like to be able to easily switch between the data, register and floating point
    register windows. Below we see a dock window with 3 tabs at the bottom for these
    3 windows and the terminal window below.'
