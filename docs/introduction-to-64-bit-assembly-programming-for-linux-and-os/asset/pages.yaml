- pgno: 5
  md: '# Acknowledgements


    No book is created in isolation. This book is certainly no exception. I am indebted
    to numerous sources for information and assistance with this book.


    Dr. Paul Carter''s PC assembly language book was used by this author to study
    32 bit assembly language download downloadable from his web site. This is a 195
    page book which covers the basics of assembly language and is a great start at
    32 bit assembly language.


    While working on this book, I discovered a treatise by Drs. Bryant and O''Hallaron
    of Carnegie Mellon how gcc takes advantage of the x86-64 architecture to produce
    efficient code. Some of their observations have helped me understand the CPU better
    which assists with writing assembly code. Programmers interested in efficiency
    should study their work.


    I found the Intel manuals to be an invaluable resource. They provide details on
    all the instructions of the CPU. Unfortunately the documents cover 32 bit and
    64 instructions together, along with the huge number of instructions, makes it
    difficult to learn assembly programming from these manuals. I hope that reading
    this book will make a good starting point, but a short book cannot cover many
    instructions. I have selected what I consider the most important instructions
    for general use, but an assembly programmer will need to study the Intel manuals
    (or equivalent manuals from AMD).


    I thank my friends Maggie and Tim Hampton for their editing contributions to the
    book.


    I am indebted to my CSC 203 - Assembly Language class at the University of Southern
    Mississippi Teaching 64 bit assembly language has uncovered a few mistakes and
    errors in the original Create Space book from July 2011. In particular I wish
    to thank Chris Greene, Evan Stuart, Brandon Wolfe and Zachary Dillon for locating
    errors in the book.


    Thanks to Ken O''Brien for helping locate mistakes in the book. Thanks go to Christian
    Korn and Markus Bohm of Germany who have'
  merge: -1
  img_proc: true
- pgno: 6
  md: 'assisted with “debugging” this book. Thanks also to Francisco Perdom of the
    Canary Islands for assistance. Carsten Hansen of Sweden has also assisted with
    debugging the book. David Langer has contributed some code repairs.


    Thanks to Quentin Gouchet for locating several typos which had persisted for several
    years.


    Thanks for Keiji Omori for pointing out that the stack size limits for Linux processes
    are now quite generous. At some point there was a hard kernel limit which could
    be changed by recompiling the kernel. Now it can be changed in `/etc/security/limits.conf`.


    Thanks to Wendell Xe for offering suggestions for improving the book and also
    suggestions for ebe.


    Last I thank my wife, Phyllis, and my sons, David and Adam, for their encouragement
    and assistance. Phyllis and Adam are responsible for the cover design for both
    this and the Create Space book.'
