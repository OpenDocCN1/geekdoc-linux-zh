- pgno: 200
  md: '# 16.2 Common subexpression elimination


    Common subexpression eliminations is generally performed by optimizing compilers.
    If you are to have any hope of beating the compiler, you must do the same thing.
    Sometimes it may be hard to locate common subexpressions. This might be a good
    time to study the compiler''s generated code to discover what it found. The compiler
    is tireless and efficient at its tasks. Humans tend to overlook things.


    # 16.3 Strength reduction


    Strength reduction means using a simpler mathematical technique to get an answer.
    It is possible to compute x³ using pow, but it is properly faster to compute x
    * x * x. If you need to compute x⁴, then do it in stages:


    ```

    x2 = x * x;

    x4 = x2 * x2;

    ```


    If you need to divide or multiply an integer by a power of 2, this can be done
    more more quickly by shifting. If you need to divide more than one floating point
    number by x, compute 1/x and multiply.


    # 16.4 Use registers efficiently


    Place commonly used values in registers. It is nearly always better to place values
    in registers. I once wrote a doubly nested loop in 32 bit mode where I had all
    my values in registers, gcc generated faster code by using the stack for a few
    values. These stack value probably remained in the level 1 cache and were almost
    as good as being in registers. Testing tells the truth.


    # 16.5 Use fewer branches


    Modern CPUs make branch predictions and will prepare the pipeline with some instructions
    from one of the 2 possibilities when there is a conditional branch. The pipeline
    will stall when this prediction is wrong, so it will help to try to make fewer
    branches. Study the generated code from your compiler. It will frequently reorder
    the assembly code to reduce'
  merge: -1
  img_proc: true
- pgno: 201
  md: "the number of branches. You will learn some general techniques from the compiler.\n\
    \n# 16.6 Convert loops to branch at the bottom\n\nIf you code a while loop as\
    \ written, there will be a conditional jump to the top of the loop to branch past\
    \ it and an unconditional jump at the bottom of the loop to get back to the top.\
    \ It is always possible to transform the loop have a conditional branch at the\
    \ bottom. You may need a one-time use conditional jump before the top of the loop\
    \ to handle cases where the loop body should be skipped.\n\nHere is a C for while\
    \ loop converted to a do-while loop. First for the loop:\n\n```\nfor ( i = 0;\
    \ i < n; i++) {\n    x[i] = a[i] + b[i];\n}\n```\n\nNow the do-while loop with\
    \ an additional if:\n\n```\nif ( n > 0 ) {\n    i = 0;\n    do {\n        x[i]\
    \ = a[i] + b[i];\n        i++;\n    } while ( i < n);\n}\n```\n\nPlease do not\
    \ adopt this style of coding in C or C++. The compiler will handle loops quite\
    \ well. In fact the simplicity of the loop might allow the compiler to generate\
    \ better code. I presented this in C simply to get the point across more simply.\n\
    \n# 16.7 Unroll loops\n\nUnrolling loops is another technique used by compilers.\
    \ The primary advantage is that there will be fewer loop control instructions\
    \ and more instructions doing the work of the loop. A second advantage is that\
    \ the CPU will have more instructions available to fill its pipeline with a longer\
    \ loop body. Finally if you manage to use registers with little or no dependencies\
    \ between the separate sections of unrolled code, then you open up the possibility\
    \ for a super-scalar CPU (most modern CPUs) to execute multiple original iterations\
    \ in parallel. This is considerably easier with 8 registers than with 8.\n\nLet's\
    \ consider code to add up all the numbers in an array of words. Here is the assembly\
    \ code for the simplest version:"
