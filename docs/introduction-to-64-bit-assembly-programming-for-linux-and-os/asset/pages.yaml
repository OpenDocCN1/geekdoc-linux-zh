  md: "# Chapter 2\nNumbers\n\nAll information in a computer is stored as collections\
    \ of bits. These bits can be interpreted in a variety of ways as numbers. In this\
    \ chapter we will discuss binary numbers, hexadecimal numbers, integers and floating\
    \ point numbers.\n\n# 2.1 Binary numbers\n\nWe are used to representing numbers\
    \ in the decimal place-value system. In this representation, a number like 1234\
    \ means $10^3 + 2 * 10^2 + 3 * 10 + 4$. Similarly binary numbers are represented\
    \ in a place-value system using 0 and 1 as the 'digits' and powers of 2 rather\
    \ than powers of 10.\n\nLet's consider the binary number 1010111. This is an 8\
    \ bit number so the highest power of 2 is $2^7$. So this number is\n\n```\n1010111\
    \ = 2^7 + 2^5 + 2^3 + 2^2 + 2 + 1\n          = 128 + 32 + 8 + 4 + 2 + 1\n    \
    \      = 175\n```\n\nThe bits of an 8 bit number are numbered from 0 to 7 with\
    \ the least significant bit and 7 being the most significant bit The number 175\
    \ has its bits defined below.\n\n| bit value | 1 | 0 | 1 | 0 | 1 | 1 | 1 | 1 |\n\
    |---|---|---|---|---|---|---|---||\n| bit position | 7 | 6 | 5 | 4 | 3 | 2 | 1\
    \ | 0 |\n\nThe conversion from binary to decimal is straightforward. It takes\
    \ a little ingenuity to convert from decimal to binary. Let examine the number\
    \ 741. The highest power of 2 less than (or equal to) 741 is $2^9 = 512$. So we\
    \ have\n\n```\n741 = 512 + 229\n      = 2^9 + 229\n```"
