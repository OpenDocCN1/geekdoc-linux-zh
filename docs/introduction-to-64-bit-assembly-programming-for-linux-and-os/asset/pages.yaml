- pgno: 187
  md: 'The simplest way to cope with collisions is to use a linked list for each location
    in the hash array. Consider the illustration below:


    ![](img/a81fe45f331f8cec874684a58e65cf74_187_0.png)


    In this table, keys 12, 4, 16 and 9 all have hash values of 1 and are placed on
    the location 1 of the hash array. Keys 13 and 8 both have hash values 3 and are
    placed on the location 3 of the array. The remaining keys are mapped to 5 and
    7.


    One of the critical issues with hashing is to develop a good hashing function.
    A hashing function should appear almost random. It must compute the same value
    for a particular key each time it is called for the key, but the hash values aren''t
    important it''s the distribution of keys onto lists which matters. We want alot
    of short lists. This means that the array size should be at least as large as
    the number of keys expected. Then, with a good hash function, the chains will
    generally be short.


    # A good hash function for integers


    It is generally recommended that a hash table size be a prime number. However
    this is not very important if there is no underlying pattern to the numbers used
    as keys. In that case you can simply use n mod t where n is the key and t is the
    array size. If there is a pattern like many multiples of the same number, then
    using a prime number for t makes sense.


    Here is the hash function for the example code:


    ```

    i = hash ( n );

    mov rax, rdi

    and ra, 0xff

    ret

    ```


    The table size is 256 in the example, so using and gives n mod 256.'
