    \     edi, edi\n    mov     [rax+t_root], rdi\n    mov     [rax+t_count], rdi\n\
    \    leave\n    ret\n```\n\n# Finding a key in a tree\n\nTo find a key in a binary\
    \ search tree you start with a pointer to the root node and compare the node's\
    \ key with the key being sought. If it's a match you're done. If the target is\
    \ less than the node's key you change your pointer to the node's left child. If\
    \ the target is greater than the node's key you change the pointer to the node's\
    \ right child. You then repeat these comparisons with the new node. If you ever\
    \ reach a NULL pointer, the key is not in the tree. Below is the code for finding\
    \ a key in a binary tree. It returns a pointer to the correct tree node or NULL\
    \ if not found.\n\n```\n; p = find ( t, n );\n; p = 0 if not found\nfind:\n  \
    \  push    rbp\n    mov     rbp, rsp\n    mov     rdi, [rdi+t_root]\n    xor \
    \    eax, eax\n    mov     rdi, 0\n.more   cmp     .done\n    cmp     rsi, [rdi+n_value]\n\
    \    j1      .goleft\n    jg      .gight\n    mov     rax, rsi\n    jmp     .done\n\
    .goleft:\n    mov     rdi, [rdi+n_left]\n    jmp     .more\n.gight:\n    mov \
    \    rdi, [rdi+n_right]\n    jmp     .more\n.done:\n    leave\n    ret\n```"
