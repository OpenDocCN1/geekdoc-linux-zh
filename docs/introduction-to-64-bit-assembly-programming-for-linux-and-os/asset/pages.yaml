    It is possible to Control-D or Control-Z in the Input box to send an end of file
    indication into the program. However this only works if the EOF is signaled before
    the input operation is performed. This is abnormal, but it works if you are single-stepping.
    Then you enter Control-D prior to executing the scanf call (or another form of
    read).'
