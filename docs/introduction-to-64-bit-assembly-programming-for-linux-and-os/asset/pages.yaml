- pgno: 230
  md: 'Next you should install the Xcode command line tools using

    xcode-select -install


    Most likely you will get a message telling you that the package doesn''t

    exist. You can ignore that message. Apparently Xcode now includes the

    command line tools. You can verify this by entering "g++" and "gdb -v"

    from the command line. Those are the tools you need.


    # Installing MacPorts


    For the MacPorts installation guide, you need to download the proper

    package file for your operating system. For my computer running

    Mavericks was MacPorts-2.3.0-10.9-Mavericks.pkg. Click on this

    package file after it downloads to install MacPorts.


    MacPorts is a command line tool which gives you access to thousands

    of free programs. To search for versions of vim you enter


    ```

    sudo port search gimp |

    ```


    You should see gimp listed with a first of optional features after it. You

    can install gimp using


    ```

    sudo port install gimp

    ```


    This is meant as an example and gimp is not needed to run obe.


    # Installing tools needed by ebe


    Having MacPorts installed you can then use MacPorts to install the tools

    needed to build and run ebe


    ```

    sudo port install astyle

    sudo port install g95 # substitute for gfortran

    sudo port install git

    sudo port install qt4-mac

    sudo port install yasm

    ```


    It is not necessary to install g95 if you don''t want to use FORTRAN,

    but if you want to use FORTRAN it is simplest to link g95 as gfortran

    using


    ```

    sudo ln -s /opt/local/bin/g95 /opt/local/bin/gfortran

    ```


    After installing these tools the steps for downloading, building and

    installing are similar to those for Linux.'
