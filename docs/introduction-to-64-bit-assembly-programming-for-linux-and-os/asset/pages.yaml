- pgno: 151
  md: '# 11.2 Moving floating point data


    SSE registers are 128 bits on x86-64 CPUs (256 bits for the AVX registers). These
    registers can be used to do 1 operation at a time and multiple operations at a
    time. There are instructions for moving 1 data value and instructions from moving
    multiple data items, referred to as "packed" data.


    # Moving scalars


    There are two instructions for moving scalar (1 value) floating point values to/from
    SSE registers: movss moves 32 bit floating point values (floats) and movsd which
    moves 64 bit floating point values (doubles). These two instructions move a floating
    point value from/to the lower part of a XMM register or from one XMM register
    to another. There is no implicit conversion - after movss a 32 bit value exists
    in the destination. Here is a sample:


    ```

    movss xmm0, [x] : xmm0 = value at x

    movsd [y], xmm1 : move xmm1 to y

    mmov xmm2, xmm0 : xmm2 = xmm0

    ```


    # Moving packed data


    There are instructions for loading integer packed data and floating point packed
    data. We will concentrate on packing floating point data. You can move packed
    floats or packed doubles. There are instructions for moving aligned or unaligned
    packed data. The aligned instructions are movaps for moving four floats and movapd
    for moving doubles using XMM registers. The unaligned versions are movups and
    movdup.


    Aligned data means that it is on a 16 byte boundary in memory. This can be arranged
    by using align 16 for an array in the data section. The alignb pseudo-op for an
    array in the bss section does not do the job properly. Arrays allocated by malloc
    will be on 16 byte boundaries. Your program will fail with a segmentation fault
    if you attempt to use an aligned move to an unaligned address. Frequently on the
    Core i series of CPUs the unaligned moves are just as fast as the aligned moves
    when the data is aligned. Note that the instructions using AVX registers begin
    with "V". Here is a sample:


    ```

    movups xmm0, [x] : move 4 floats to xmm0

    vmovups ymm0, [x] : move 8 floats to ymm0

    movupd ymm1, [x] : move 4 doubles to ymm1

    movd [a], xmm15 : move 2 doubles to a

    ```'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# 11.3 Addition


    The instructions for adding floating point data come in scalar and packed varieties.
    The scalar add instructions are addss to add two floats and addsd to add two doubles.
    Both operate on a scalar operand and destination operand. The source can be in
    memory or in an XMM register while the destination must be in an XMM register.
    Unlike the integer add floating point add instructions do not set any flags, testing
    must be done using a compare instruction.


    The packed add instructions are addps which adds 4 floats from the source to the
    destination and addpd which adds 2 doubles from the source to 2 doubles in the
    destination using XMM registers. Like the scalar adds can be either memory or
    an XMM register, while the destination must be an XMM register. Using packed adds
    vaddps and vaddpd with YMM registers adds 8 pairs of floats or 4 pairs of doubles.


    ```

    movss xmm0, [a]    : load a

    addss xmm0, [b]    : add b to a

    movss [c], xmm0    : store sum in c

    movapd xmm0, [a] : load 2 doubles from a

    addpd xmm0, [b]    : a[0]+b[0], a[1]+b[1]

    movapd [c], xmm0    : store 2 sums in c

    vmovupd ymm0, [a]  : load 4 doubles from a

    vaddpd ymm0, [b]    : add 4 pairs of doubles

    vmovupd [c], ymm0   : store 4 sums in c

    ```


    # 11.4 Subtraction


    Subtraction operates like addition on either scalar floats or doubles or packed
    floats or doubles. The scalar subtract instructions are subss which subtracts
    the source float from the destination float and subsd which subtracts the source
    double from the destination double. The source can be in memory or in an XMM register,
    while the destination must be an XMM register. No flags are affected by the floating
    point subtraction instructions.


    The packed subtract instructions are subps which subtracts 4 floats from 4 floats
    in the destination and subpd which subtracts 2 source doubles from 2 doubles in
    the destination using XMM registers. Again the source can be in memory or in an
    XMM register, while the destination must be an XMM register. Using packed subtracts
    (vsubps or vsubpd) with YMM registers subtracts 8 pairs of floats or 4 pairs of
    doubles.'
  merge: -1
  img_proc: true
