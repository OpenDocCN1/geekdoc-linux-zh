    # 6.5 Division


    Division is different from the other mathematics operations in that it returns
    2 results: a quotient and a remainder. The idiv instruction behaves like the inverse
    of the single operand imul instruction that it uses rdx:rax for the 128 bit dividend.


    The idiv instruction uses a single source operand which can be either a register
    or a memory reference. The unsigned division operates similarly on unsigned numbers.
    The dividend is the two registers rdx and rax with rdx holding the most significant
    bits. The quotient is stored in rax and the remainder is stored in rdx.'
