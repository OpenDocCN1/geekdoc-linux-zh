    # # 14.2 fcanf and fprintf


    You have encountered scanf and printf in previous code. scanf is a function that
    calls fscanf with a FILE pointer named stdin as its first parameter, while printf
    is a function which calls fprintf with FILE pointer stdout as its first parameter.
    The only difference between these pairs of functions is that fscanf and fprintf
    can work with any FILE pointer. Their prototypes are


    ```

    int fscanf( FILE *fp, char *format, ... );

    int fprintf( FILE *fp, char *format, ... );

    ```


    For simple use consult Appendix B which discusses scanf and printf. For more information
    use "man scanf" or "man fprintf" consult a C book.


    # # 14.3 fgetc and fputc


    If you need to process data by character, it can be convenient to use fgetc to
    read characters and fputc to write characters. Their prototypes are


    ```

    int fgetc( FILE *fp );

    int fputc( int c, FILE *fp );

    ```


    The return value of fgetc is the character which has been read, except for end
    of line or errors when it returns the symbolic value EOF which is -1. The function
    put writes the character provided in c to the file. It returns the same character
    it has written unless there is an error when it returns EOF.


    Often it is convenient to get a character and do something which depends on the
    character read. For some characters you may need to give control over to another
    function. This can be simplified by giving the character back to the file stream
    using ungetc. You are guaranteed only 1 pushed back character, but having 1 character
    of look-ahead can be quite useful. The prototype for ungetc


    ```

    int ungetc( int c, FILE *fp );

    ```


    Below is a loop copying of a file from one stream to another using fgetc and fputc.'
