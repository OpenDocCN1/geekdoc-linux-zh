    # Two and three operand imul


    Quite commonly 64 bit products are sufficient and either of the other forms will
    allow selecting any of the general purpose registers as the destination register.


    The two-operand form allows specifying the source operand as a register, a memory
    reference or an immediate value. The source is multiplied the destination register
    and the result is placed in the destination.


    ```

    imul rax, 100      ; multiply rax by 100

    imul r8, [x]       ; multiply r8 by x

    imul r9, r10       ; multiply r9 by r10

    ```


    The three-operand form is the only one where the destination register is not one
    of the factors in the operand. Instead the second operand, which is either a register
    or a memory reference, is multiplied by the third operand which must be an immediate
    value.


    ```

    imul rbx, [x], 100  ; store 100*x in rbx

    imul rdx, rbx, 50    ; store 50*rbx in rdx

    ```'
