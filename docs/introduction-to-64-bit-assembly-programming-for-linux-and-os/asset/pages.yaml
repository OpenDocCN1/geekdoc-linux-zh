- pgno: 2
  md: '# Preface


    The Intel CPU architecture has evolved over 3 decades from a 16 bit CPU with no
    memory protection, through a period with 32 bit processors with sophisticated
    architectures to the current series of processors which support all the old modes
    of operation in addition to a greatly expanded 64 bit mode of operation. Assembly
    textbooks tend to focus on the history and generally conclude with a discussion
    of the 32 bit mode. Students are introduced to the 32 bit CPUs with segment registers
    allowing access to 1 megabyte of internal memory. This is an unnecessary focus
    on the past.


    With the x86-64 architecture there is almost a complete departure from the past.
    Segment registers are essentially obsolete and register usage is completely general
    purpose, with the glaring exception of the repeat-string loops which use specific
    registers and have no operands. These changes contribute to simpler assembly language
    programming.


    There are now 16 general purpose integer registers with a few specialized instructions.
    The archaic register stack of the 8087 has been superseded by a well-organized
    model providing 16 floating point registers with floating point instructions along
    the SSE and AVX extensions. In fact the AVX extensions allow a three operand syntax
    which can simplify coding even.


    Overall x86-64 assembly language programming is simpler than its predecessors.
    The dominant mode of operation will be 64 bits within a few years. Today most
    personal computers ship with 64 bit operating systems. In fact the latest versions
    of the Apple OS operating system are only available in 64 bits, though Linux and
    Microsoft Windows still have 32 and 64 bit versions. The era of 32 bit CPUs and
    operating systems is nearly over. Together these trends indicate that it is time
    to teach 64 bit assembly programming.


    The focus in this textbook is on early hands-on use of 64 bit assembly programming.
    There is no 16 or 32 bit programming and the discussion of the history is focused
    on explaining the origin of the old register names and the few non-orthogonal
    features of the instruction set.'
  merge: -1
  img_proc: true
- pgno: 3
  md: 'The first version of this book discussed the yasm assembler and the gdb debugger
    directly. Now the author provides a free integrated development environment "ebe",
    which automates the process of using yasm. The ebe environment is a GUI program
    written in C++ using the Qt system and supports C, C++ and FORTRAN in addition
    to assembly language, though its purpose is to support assembly programming. There
    was a previous version of ebe in Python, but the newer version offers many more
    features. The Qt version of ebe is available at http://qtebe.sourceforge.net.


    This version of the book discusses assembly programming for both the Linux and
    OS operating systems. Frequently these two operating systems use the same function
    call protocol and discussing them is convenient in one book. There is a companion
    book discussing assembly programming for Windows which uses a different function
    call interface. There is a discussion of the function call protocol differences
    for Linux, OS X and Windows, so having one of the two books should be sufficient
    for someone interested in programming on multiple operating systems.


    Due to costs this book is printed in black and white. The pictures captured from
    ebe would have been prettier and perhaps more useful in color, but the cost of
    the book would have been roughly the cost of a black and white version. The added
    utility of color is certainly not worth the extra cost. Generally the highlighted
    text in ebe is shown with a colored background while the printed version presents
    this text with a light gray background.


    Most of the sample code execution in the first edition was illustrated using gdb.
    This function has largely been superseded with screen captures from ebe, though
    some use of gdb is still shown. It might be that some people would prefer using
    a text interface and blind programmers in particular might find a GUI interface
    to be a real inconvenience.


    There are assignments using the computer from the very first chapter. Not every
    statement will be fully understood at this time, but the assignments are still
    possible.


    The primary target for this book is beginning assembly language programmers, students
    should study chapters 1, 2, 3, 5, 6, 7, 8, 9, 10 and 11. Chapter 4 on memory mapping
    is not critical to the rest of the book and can be skipped if desired.


    Chapters 12 through 15 are significantly more in depth. Chapter 15 is about data
    structures in assembly and is an excellent adjunct to studying data structures
    in C/C++. The subject will be much clearer after exposure in assembly language.


    The final four chapters focus on high performance programming, including discussion
    of SSE and AVX programming.'
  merge: -1
  img_proc: true
