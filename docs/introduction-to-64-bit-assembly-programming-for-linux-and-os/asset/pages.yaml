  md: 'pointer register (rip) which contains the address of the next instruction to
    execute. There is also a 64 bit flags register (rflags). There are additional
    registers which we probably won''t use. Having 16 registers means a register’s
    “address” is only 4 bits. This makes instructions using registers much smaller
    than instructions using only memory addresses.


    The 16 general purpose registers are 64 bit stored within the CPU. Software can
    access the registers as 64 bit values, 32 bit values, 16 bit values and 8 bit
    values. Since the CPU evolved from the 8086 CPU, the registers have evolved from
    16 bit registers to 32 bit registers and finally to 64 registers.


    The 8086 registers were more special purpose than general purpose:


    +   - ax accumulator for numeric operations

    - bx base register (array access)

    - cx count register (string operations)

    - dx data register item si - source index

    - di destination index

    - bp base pointer (for function frames)

    - sp stack pointer


    In addition the 2 halves of the first 4 registers can be accessed using al for
    the low byte of ax, ah for the high byte of ax, and bl, bh, cl, ch, d1 and dh
    for the halves of bx, cx and dx.


    When the 80386 CPU was designed the registers were expanded to 32 bits and renamed
    eax, ebx, ecx, edx, esi, edi, ebp, and esp. Software could also use the original
    names to access the lower 16 bits of each of the 8 registers were were retained
    without allowing direct access to the upper halves of the registers.


    For the x86-64 architecture the registers were expanded to 64 bits and 8 additional
    general purpose registers were added. The names used to access the 64 bit registers
    are rax, rbx, rcx, rdx, rsi, rdi, rbp, and rsp for the compatible collection and
    r8-r15 for the 8 new registers. As you might expect you can still use ax to access
    the lowest word of the register along with eax to access the lower half of the
    register. Likewise the other 32 bit and 16 bit register names still work in 64
    bit. You can also access registers r8-r15 as byte, word, or double word registers
    by appending b, w or d to the register name.


    The rflags register is a 64 bit register, but currently only the lower 32 bits
