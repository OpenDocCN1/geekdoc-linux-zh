    \nAs with to binary we can perform division and build the number by keeping the\
    \ remainders.\n\n| division quotient remainder hexadecimal |\n| 40007/16 | 2500\
    \ | 0x7 |\n| 2500/16 | 156 | 0x47 |\n| 156/16 | 9 | 0x94 |\n| 12/16 | 0 | 0xc94\
    \ |\n\nConverting back and forth between decimal and binary or decimal and hexadecimal\
