  md: "statements it might be advantageous to build an array of locations to jump\
    \ to.\n\n# 8.2 Conditional jump\n\nTo use a conditional jump we need an instruction\
    \ which can set some flags. This could be an arithmetic or bit operation. However\
    \ doing a subtraction just to learn whether 2 numbers are equal might wipe out\
    \ a needed value in a register. The x86-64 CPU provides a compare instruction\
    \ (cmp) which subtracts its second operand from its first and sets flags without\
    \ storing the difference.\n\nThere are quite a few conditional jump instructions\
    \ with the general pattern:\n\n```\njcc      label      ; jump to location\n```\n\
    \nThe CC part of the instruction represents any of a wide variety of condition\
    \ codes. The condition codes are based on specific flags in eflags such as the\
    \ zero flag, the sign flag, and the carry flag. Below are some useful conditional\
    \ jump instructions.\n\n| instruction | meaning | aliases | flags |\n|---|---|---|-|\n\
    | jz | jump if zero | je | ZF=1 |\n| jnz | jump if not zero | jne | ZF=0 |\n|\
    \ jg | jump if > 0 | jnl | ZF=0 and SF=0 |\n| jge | jump if ≥ 0 | jns | SF=1 |\n\
    | jl | jump if < 0 | jn1 | - |\n| jle | jump if ≤ 0 | jng | ZF=1 or SF=1 |\n|\
    \ jc | jump if carry | j jae | CF=1 |\n| jnc | jump if not carry | jnb | jae |\n\
    \nIt is possible to generate \"spaghetti\" using jumps and conditional jumps.\
    \ It is probably best to stick with high level coding structures translated to\
    \ assembly language. The general strategy is to start with C code and translate\
    \ it to assembly. The rest of the conditional jump section discusses how to implement\
    \ C statements.\n\n# Simple if statement\n\nLet’s consider how to implement the\
    \ equivalent of a C simple statement. Suppose we are implementing the following\
    \ C code:\n\n```\nif ( a < b ) {\n  temp = a;\n  a = b;\n```"
