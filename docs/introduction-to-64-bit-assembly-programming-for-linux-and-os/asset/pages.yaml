  md: '# 6.3 Subtraction


    Integer subtraction is performed using the sub instruction. This instruction has
    2 operands: a destination and a source. It subtracts the contents of the source
    from the destination and stores the result in the destination.


    The operand follows the same pattern as add. The source operand can be an immediate
    value (constant) of 32 bits, a memory reference or a register. The destination
    can be either a memory reference or a register. Only one of the operands can be
    a memory reference.


    The sub instruction sets or clears the overflow flag (OF), the sign flag (SF),
    and the zero flag (ZF) like add. Some other flags are set related to performing
    binary-coded-decimal arithmetic.


    As with addition there is no special subtract for signed numbers versus unsigned
    numbers.


    There is a decrement instruction (dec) which can be used to decrement either a
    register or a value in memory.


    Below is a program with some sub instructions. You can see that the program has
    a breakpoint on line 8 and that gdb has stopped execution just after establishing
    the stack frame. Near the end this program uses `xor rax, rax` as an alternative
    method for setting ra (the return value for the function) to 0. This instruction
    is a 3 byte instruction. The same result can be obtained using `xor eax, eax`
    using 2 bytes which can reduce memory using. Both alternatives will execute in
    1 cycle, but using fewer bytes may be faster due using fewer bytes of instruction
    cache.'
