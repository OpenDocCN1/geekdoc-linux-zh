- pgno: 156
  md: '# Minimum and maximum


    The minimum and maximum scalar instructions are minss and maxss to compute minimums
    and maximums for floats minds and maxsd to do the same for doubles. The first
    operand (destination) must be an XMM register, while the second operand (source)
    can be either an XMM register or a memory location. The result is placed in the
    destination register.


    There are packed versions of the minimum and maximum instructions: minps, maxps,
    minpd and maxpd which operate on either 4 floats (the ps versions) or 2 doubles
    (the pd versions). The packed instructions require an XMM register for the first
    operand and either an XMM register or memory for the secret. The floats compute
    4 results while the double versions compute 2 results.


    ```

    movss xmm0, [x] ; move x xmm0

    maxss xmm0, [y] ; xmm0 has(x,y)

    movapd xmm0, [a] ; move a[0], a[1] to xmm0

    minpd xmm0, [b] ; xmm0[0] = min(a[0],b[0])

    minpd xmm0, [1] = min(a[1],b[1])

    ```


    # Rounding


    The SSE instructions include 4 instructions for rounding floating point numbers
    to numbers: roundss which rounds 1 float, roundps which rounds 4 floats, roundsd
    which rounds 1 double and roundpd which rounds 2 doubles. The first operand must
    be an XMM register, while the second operand can be either an XMM register or
    a memory location. There is a third operand which selects a rounding mode. A simplified
    view of the possible rounding modes is in the table below:


    | mode | meaning |

    |---|---|

    | 0 | round, giving ties to even numbers |

    | 1 | round up |

    | 2 | round toward 0 (truncate) |


    # Square roots


    The SSE instructions include 4 square root instructions: sqrtss which computes
    1 float square root, sqrtps which computes 4 float square roots, sqrtsd computes
    1 double square root and sqrtpd which computes 2 double square roots. Normal as
    the first operand (destination) must be an XMM register, and the second operand
    can be either an XMM register or a memory location. Bounding to 16 byte boundaries
    is required for a packed instruction with a memory reference.'
