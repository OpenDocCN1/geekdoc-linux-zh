    ```\n\nYou will notice that the compiler eliminated one jump instruction by shifting\
    \ the test to the end of the loop. Also the compiler did not do a compare instruction.\
    \ If it discovered that the counting up to 64 of i was not important. Only the\
    \ number of iterations mattered, so it decremented down from 64 to 0. Thus it\
    \ was possible to do a conditional jump after the decrement. Overall the compiler\
    \ generated a loop with 6 instructions, while the hand-written assembly loop used\
    \ 8 instructions.\nAs stated in the introduction a good compiler is hard to beat.\
    \ You can learn a lot from studying the compiler's code. If you are interested\
    \ in efficiency you may be able to do better than the compiler. You could certainly\
    \ copy the generated code and do the same, but if you can't improve on the compiler's\
    \ code then you should stick with C.\n\nThere is one additional compiler option,\
    \ -funroll-all-loops which tend to speed up code considerably. In this case the\
    \ compiler used more registers and did 8 iterations of a loop which added 8 bits\
    \ in each iteration. The compiler added 8 bits in 24 instructions before it did\
    \ 1 bit in 6 instructions. This is about twice as fast. In addition the instruction\
    \ pipeline is used more effectively in the unrolled version, so perhaps this is\
    \ 3 times as fast.\n\nOptimization issues like loop unrolling are highly dependent\
    \ on the CPU architecture. Using the CPU in 64 bit mode gives 66 general-purpose\
    \ registers while 32 bit mode gives only 8 registers. Loop unrolling is much easier\
    \ with more registers. Other details like the Intel Core i processors' use of\
    \ a queue of micro-operations might eliminate most of the effect of loops interrupting\
    \ the CPU pipeline. Testing is required to see what works best on a particular\
    \ CPU.\n\n# Do-while loops\n\nWe saw in the last section that the compiler converted\
    \ a while loop into a do-while loop. The while structure translates directly into\
