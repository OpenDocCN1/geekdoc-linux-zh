    # # 15.4 Binary trees


    A binary tree is a structure with possibly many nodes. There is a single root
    node which can have left or right child nodes (or both). Each node in the tree
    can have left or right child nodes (or both).


    Generally binary trees are built with an ordering applied to keys in the nodes.
    For example you could have a binary tree where every node divides keys into those
    less than the node''s key (in the left sub-tree) and those greater than the node''s
    key (in the right sub-tree). Having an ordered binary tree, often called a binary
    search tree, makes possible to do fast searches for a key while maintaining the
    ability to traverse the nodes in increasing or decreasing order.


    Here we will present a binary tree with integer keys with the ordering lower keys
    on the left and greater keys on the right. First are the structures used for the
    tree.


    # # Binary tree node and tree structures


    The nodes in the binary tree have an integer value and two pointers. The structure
    definition below uses a prefix convention in naming the value field as n_value
    and the left and right pointers as n_left and n_right.


    ```

    struct node

    n_value resq 1

    n_left resq 1

    n_right resq 1

    align 8

    endstruct

    ```


    It would be possible to use a pointer to the root node to represent the tree.
    However we could add features to the tree, like deletion or balancing, which could
    change the root of the tree. It seems logical to store the root in a structure
    insulating it from future changes in a tree. We have also included in the tree
    structure a count of the number of nodes in the tree.


    ```

    struct tree

    t_count resq 1

    t_root resq 1

    align 8

    endstruct

    ```


