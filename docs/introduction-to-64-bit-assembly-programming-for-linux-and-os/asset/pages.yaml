    # 3.3 Process memory model in OS X


    The layout of an OS X process is similar to a Linux process with one big difference.
    In OS X the lower 4 GB of a process virtual address space is mapped to what is
    called a "zero page". This covers the address range from 0x0 to 0xffffffff. The
    effect of this mapping is that any memory reference to a location in the zero
    page results in a segmentation fault. The purpose behind this decision is to limit
    the effect of truncated pointers, which might arise from the lower half of a 64
    bit pointer into a register. It is better to have the the program fail than to
    continue to execute after accessing the wrong section of memory.


    This means that all addresses in the program are too big to fit in 32 bits. In
    particular this impacts assembly programming since function addresses are locations
    to branch to memory won''t fit in 32 bits. This matters since the address field
    for such instructions is 32 bits. To get around this problem coding in OS X is
    done using "rip relative" addressing. This means that addresses stored in instructions
    are relative to the current value of the instruction pointer register, rip.


    It is generally possible for all the instructions and static data for a program
    to fit in less than 2GB of memory. This allows Linux to essentially use 32 bit
    addressing for code and static data and OS X to use 32 bit relative addressing
    for the same purposes.


