    a line with a breakpoint, it will stop and will highlight the line using a pastel
    blue-green background. The highlighted line will be the next line to execute.


    # Terminal window


    The terminal window is one of the dock windows which supports terminal input and
    output. It does not include a real terminal emulator. Instead all input is done
