    0xf8. This yields a final physical address of 0x579fa8.


    # 4.6 Large pages


    The normal size page is 4096 bytes. The CPU designers have added support for large
    pages using three levels of the existing translation tables. By using 3 levels
    of tables, there are 9 + 2^12 = 21 bits for the within page offset field. This
    makes large pages 2^21 = 2097152 bytes.


    Some of the latest CPUs support pages 2 levels of page tables which results in
    having pages of 2^30 which is 1 GB. These huge pages will be popular for applications
    requiring large amounts of RAM like database management systems and virtual machine
    emulators.


    # 4.7 CPU Support for Fast Lookups


    This process would be entirely too slow if every time by traversing all these
    tables. Instead whenever a page translation has been performed, the CPU adds this
    translation into a cache called "Translation Lookaside Buffer" or TLB. Then hopefully
    this page will be used times without going back through the lookup process.


    A TLB operates much like a hash table. It is presented with a virtual page address
    and produces a physical page address or failure within roughly 1/2 of a clock
    cycle. In the case of a failure the memory search takes from 10 to 100 cycles.
    Typical miss rates are from 0% to 1%.


    Clearly there is a limit to the number of entries in the TLB for a CPU. The Intel
    Core 2 series has a total of 16 entries in a level 1 TLB and 256 entries in a
    level 2 TLB. Core i7 has has64 level 1 TLB entries and 512 level 2 entries. The
    AMD Athlon II CPU has 1024 TLB entries.


    Given the relatively small number of TLB entries in a CPU it seems like would
    be a good idea to migrate to allocating 2 MB pages for'
