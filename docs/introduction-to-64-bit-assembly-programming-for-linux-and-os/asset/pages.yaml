  md: '# #6.4 Multiplication


    Multiplication of unsigned integers is performed using the mul instruction, while
    multiplication of signed integers is done using imul. The mul instruction is fairly
    simple, but we will skip it in favor of imul.


    The imul instruction, unlike add and sub, has 3 different forms. One form has
    1 operand (the source operand), a second has 2 operands (source and destination)
    and the third form has 3 operands (destination and 2 source operands).


    # #One operand imul


    The 1 operand version multiplies the value in rdx:rax by the source operand and
    stores the result in rax. The source could be a register or a memory reference.
    The reason for using 2 registers is that multiplying two 64 bit integers yields
    a 128 bit result. Perhaps you using large 64 bit integers and need all 128 bits
    of the product. Then you need this instruction. The lower bits of the answer are
    in rax and the high bits are in rdx.


    ```

    ```

    mul gword[data]; multiply rax by data

    mov [high], rdx; store top of product

    mov [low], rax; store bottom of product

    ```

    ```


    > Note that yasm requires the quadword attribute for the source for the single
    operand version which uses memory. It issued a warning during testing, but did
    do the correct operation.


    Here is a sample program which uses the single operand version of imul to illustrate
