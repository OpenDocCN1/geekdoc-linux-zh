- pgno: 55
  md: '# # Chapter 4

    Memory mapping in 64 bit mode


    In this chapter we discuss the details of how virtual addresses are translated
    to physical addresses in the x86-64 architecture. Some of the data for translation
    is stored in the CPU and some of it is stored in memory.


    # ## 4.1 The memory mapping register


    The CPU designers named this register "Control Register 3" or just CR3. A simplified
    view of CR3 is that it is a pointer to the top level of a hierarchical collection
    of tables in memory which define the translation from virtual addresses (the addresses
    your program sees) to physical addresses. The CPU retains quite a few page translations
    internally, but let''s consider first how the CPU starts all this translation
    process.


    Somewhere in the kernel of the operating system, an initial hierarchy of the translation
    tables is prepared and CR3 is filled with the address of the top level table in
    the hierarchy. This table is given the illustrious name "Page Map Level 4" or
    PML4. When the CPU is switched to using memory mapping on the next memory reference
    it uses CR3 to fetch entries PML4.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# # 4.2 Page Map Level 4


    A virtual address can be broken into fields like this:


    | 63 | 48 | 47 | 39 | 38 | 30 | 29 | 21 | 20 | 11 | 0 |

    |---|---|---|---|---|---|---|---|---|---|---||

    | unused | PML4 index | | page directory | page index | page table | | page offset
    |

    | | | | pointer index | | | | | |


    Here we see that a virtual or logical address is broken into 6 fields. The top-most
    16 bits are ignored. They are supposed to be a sign extension of bit 47, but they
    are not part of the address translation. In fact bit 47 is left as 0 in user processes
    Linux and OS so bits 47-63 are all 0. In both operating systems bits 47-63 are
    all 1 for user process memory management. Following the unused bits are four bits
    which undergo translation and a 12 bit page offset. The result of the translation
    will be a physical address like 0x7ff8808000 which is combined with the offset
    0x7ff8808 (let''s say it is 0x1f0) to yield a physical address of 0x7ff88081f0.


    Pages of memory are $2^{12} = 4096$ bytes, the 12 bit offset makes sense. What
    about those 9 bits field? They are 8 bits so you can store 512 addresses in a
    page and $512 = 2^9$, so 9 bits allow storing each of the 4 types of mapping tables
    in a page of memory.


    Bits 47-39 of a virtual address are used as an index into the PML4 table. The
    PML4 table is essentially an array of 512 pointers (256 would be enough for user
    processes since bit 47 is 0). These pointers point to pages of memory, so the
    right 12 bits of each pointer can be used for other purposes like indicating whether
    an entry is valid or not. Generally not all entries in the PML4 will be valid.


    Let''s suppose CR3 has the physical address 0x4ffff. Then let''s suppose that
    bits 47-39 of our sample address are 0x001, and we would have an array in memory
    at 0x4ffff and we access the second entry (index 1) to get the address of a page
    directory pointer table: 0x3467000.


    | PML4 at 0x4ffff |

    |---||

    | 0 | 0x3466000 |

    | 1 | 0x3467000 |

    | 2 | 0x3468000 |

    | ... | ... |

    | 511 | unused |'
