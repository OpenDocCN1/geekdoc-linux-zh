- pgno: 203
  md: "# 16.8 Merge loops\n\nIf you have 2 loops iterating over the same sequence\
    \ of values and there is no dependence between the loops, it seems like a no-brainer\
    \ to merge the loops. Consider the following 2 loops:\n\n```\nfor ( i = 0; i <\
    \ 1000; i++) {\n  a[i] = b[i] + c[i];\n}\nfor ( j = 0; j < 1000; j++) {\n  d[j]\
    \ = b[j] - c[j];\n}\n```\n\nThis can easily be merged to get:\n\n```\nfor ( i\
    \ = 0; i < 1000; i++) {\n  a[i] = b[i] + c[i];\n}\n```\n\nIn general merging loops\
    \ can increase the size of a loop body, decreasing the overhead percentage and\
    \ helping to keep the pipeline full. In this case there is additional gain from\
    \ loading the values of b and c once rather than twice.\n\n# 16.9 Split loops\n\
    \nWe just got through discussing merging loops was a good idea. Now we are going\
    \ to learn the opposite well for some loops. If a loop is operating on 2 independent\
    \ sets of data, then it could be split into 2 loops. This can improve performance\
    \ if the combined loop exceeds the cache capacity. There is a trade-off between\
    \ better cache usage and more instructions in the pipeline. Sometimes merging\
    \ is better and sometimes splitting is better.\n\n# 16.10 Interchange loops\n\n\
    Suppose you wish to place 0's in a 2-dimensional array in C. You have 2 choices:\n\
    \n```\nfor ( i = 0; i < n; i++) {\n  for ( j = 0; j < n; j++) {\n    x[i][j] =\
    \ 0;\n}\n```\n\nor"
  merge: -1
  img_proc: true
- pgno: 204
  md: "```\nfor ( j = 0; j < n; j++) {\n    for ( i = 0; i < n; i++) {\n        x[i][j]\
    \ = 0;\n    }\n}\n```\n\nWhich is better? In C the second increments faster than\
    \ the first. This means that x[0][1] is immediately after x[0][0]. On the other\
    \ hand x[1][0] is n elements after x[0][0]. When the CPU fetches data into the\
    \ cache it fetches more than a few bytes and writes to memory behave similarly,\
    \ the first loop makes more sense. If you have the extreme misfortune of having\
    \ an array which is too large for your RAM, then you may experience virtual memory\
    \ thrashing with the second version. This could turn into a disk access for each\
    \ array access.\n\n# 16.11 Move loop invariant code outside loops\n\nThis might\
    \ be a fairly obvious optimization to perform. It's another case where studying\
    \ the compiler's generated code might point out some loop invariant code which\
    \ you have overlooked.\n\n# 16.12 Remove recursion\n\nIf it is easy to eliminate\
    \ recursion then it will nearly always improve efficiency. Often it is easy to\
    \ eliminate \"tail\" recursion where the last action of a function is a recursive\
    \ call. This can generally be done by branching to the top of the function. On\
    \ the other hand if you try to eliminate recursion for a function like quicksort\
    \ which makes 2 non-trivial recursive calls, you will be forced to \"simulate\"\
    \ recursion using your own stack. This may make things slower. In any case the\
    \ effect is small, since the time spent making recursive calls in quicksort is\
    \ small.\n\n# 16.13 Eliminate stack frames\n\nFor leaf functions it is not necessary\
    \ to use stack frames. In fact if you have non-leaf functions which call your\
    \ functions and no others you can omit the frame pointers from these two. The\
    \ only reason for frame pointers is for debugging. There is a requirement for\
    \ leaving the stack on 16 byte boundaries, but this only becomes an issue with\
    \ functions which have local variables (on the stack) which participate in aligned\
    \ 16"
  merge: -1
  img_proc: true
- pgno: 205
  md: 'or 32 byte accesses which can either fail or be slower. If you know that your
    code is not using those instructions, then neither frame pointers nor frame alignment
    are important other than for debugging.


    # 16.14 Inline functions


    As part of optimization compilers can inline small functions. This reduces the
    overhead significantly. If you wish to do this, you might be interested in exploring
    macros which can make your code easier to read and write and operate much like
    a function which has been inlined.


    # 16.15 Reduce dependencies to allow super-scalar execution


    Modern CPUs inspect the instruction stream looking ahead for instructions which
    do not depend on results of earlier instructions. This is called "out of order
    execution". If there is less dependency in your code, then the CPU can execute
    more instructions out of order, allowing multiple independent instructions to
    execute at one (super-scalar) and your program can run more quickly.


    As an example of this I modified the previous add_array function with unrolled
    loops to accumulate all 4 values in the loop into rax. This increased the time
    from 2.44 seconds to 2.75 seconds.


    # 16.16 Use specialized instructions


    For far we have seen the conditional move instruction which is fairly specialized
    and also the packed floating point instructions. There are many specialized instructions
    in the x86-64 architecture which are more difficult for a compiler to apply. A
    human can reorganize an algorithm to add the elements of an array somewhat like
    I did with loop unrolling except to keep 4 partial sums in AVX register. Combining
    the 4 parts of the AVX register can be done after the loop. This can making the
    adding even faster, since 4 adds can be done in one instruction. This technique
    can also be combined with loop unrolling for additional performance. This will
    be explored in detail in subsequent chapters.'
  merge: -1
  img_proc: true
