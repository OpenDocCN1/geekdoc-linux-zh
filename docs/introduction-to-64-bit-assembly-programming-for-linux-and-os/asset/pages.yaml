    # 1.3 Machine language


    Each type of computer has a collection of instructions it can execute. These instructions
    are stored in memory and fetched, interpreted and executed during the execution
    of a program. The sequence of bytes (like the previous 12 byte program) is called
    a "machine language" program. It would be quite painful to use machine language.
    You would have to know the correct bytes for each instruction of your program
    and you would need to know the addresses of all data used in your program. A more
    realistic program would have branching instructions. The address to branch depends
    on where the computer loads your program into memory when it is executed. Furthermore
    the address to branch can change when you add, delete or change instructions in
    your program.


    The very first computers were programmed in machine language, but people soon
    figured out how to use words to make the task easier. The first improvement is
    to use words mov to indicate the selection of a particular instruction. In addition
    people started using symbolic names to represent addresses of instructions and
    data in a program. Using symbolic names prevents the need to calculate addresses
    and insulates the programmer from changes in the source code.


    # 1.4 Assembly language


    Very early in the history of computing (1950s), programmers developed symbolic
    assembly languages. This rapidly replaced the use of machine language, eliminating
    a lot of tedious work. Machine languages are considered "first-generation" programming
    languages, while assembly languages are considered "second-generation".


    Many programs continued to be written in assembly language after the invention
    of FORTRAN and COBOL ("third-generation" languages) in the late 1950s. In particular
    operating systems were typically nearly 100% assembly until the creation of C
    as the primary language for the UNIX operating system.


