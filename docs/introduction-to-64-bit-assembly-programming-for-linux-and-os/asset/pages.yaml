- pgno: 131
  md: "Frequently these smaller problems can be solved by the same function. So you\
    \ break the problem into smaller problems repeatedly and eventually you reach\
    \ a small problem that is easy to solve. The easy to solve problem is called a\
    \ \"base case\". Recursive functions typically start by testing if you have reached\
    \ the base case or not. If you have reached the base case, then you prepare the\
    \ easy solution. If not you break the problem into sub-problems and make recursive\
    \ calls. As you return from recursive calls you assemble solutions to larger problems\
    \ from solutions to smaller problems.\n\nRecursive functions generally require\
    \ stack frames with local storage for each stack frame. Using the complete stack\
    \ frame protocol can help in debugging.\n\nUsing the function call protocol it\
    \ is easy enough to write recursive functions. As usual, recursive functions test\
    \ for a base case prior to making a recursive call.\n\nThe factorial function\
    \ can be defined recursively as\n\n```\nf(n) = { 1 if n<=1, n*f(n-1) if n<1 }\n\
    ```\n\nHere is a program to read an integer, count n! recursively and print n!\n\
    \n```\nsegment .data\n x 0\ndscanf_format:\n  db \"%ld\",0\nprintf_format:\n \
    \ db \"Fact(%ld) = %ld\",0x0a,0\n```\n\n```\nsegment .text\nglobal main      :\
    \ tell world about main\nglobal fact      : tell world about fact\nextern scanff\
    \    : resolve scanf and\nextern printf    : printf from libc\nmain:\npush   rbp\n\
    mov    rbp, rsp\nlea    rdi,[scanf_format]; ; set arg 1\nlea    rsi,[x]      \
    \    ; set arg 2 for scanf\nxor    eax, eax         ; set rax to 0\ncall   scanf\n\
    mov    rdi,[x]          ; move x for fact call\ncall   fact\nlea    rdi,[printf_format];\
    \ ; set arg 1\nmov    rsi,[x]          ; set arg 2 for printf\nmov    rdx, eax\
    \         ; set arg 3 to be x!\nxor    eax, eax         ; set rax to 0\ncall \
    \  printf\nxor    eax, eax         ; set return value to 0\nleave\nret\n```\n\n\
    ```\nfact:\nequ   1      ; recursive function\npush   rbp\n```"
