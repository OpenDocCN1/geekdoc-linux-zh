    ```


    Now these by themselves don''t preserve 16 byte stack alignment, so perhaps a
    better choice would be needed for some functions. Maybe you could combine the
    creation of a stack frame with pushing the rest of the registers and subtracting
    from the stack pointer to achieve alignment and room for local variables.


    # Preprocessor variables


    Yasm allows defining preprocessor variables which can be used in macros using
    %assign. You could assign a variable i in one spot and modify it later:


    ```

    %assign i 1

    %assign i+1

    ```


    For more information about yasm macros visit the yasm web site at http://www.tortall.net/projects/yasm/manual/html/index.html
    which discusses topics like looping and string length.'
