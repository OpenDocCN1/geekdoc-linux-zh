    # Converting decimal numbers to floats


    Let''s work on an example to see how to do the conversion. Let''s convert -121.6875
    to its binary representation.


    First let''s note the sign is 1. Now we will work on 121.6875.


    It''s fairly easy to convert the integer portion of the number: 121 = 1111001.
    Now we need to on the fraction.


    Let''s suppose we have a binary fraction x = 0.abcdefgh, where the letters indicate
    either a or 1. Then 2x=0.abcdefgh. This indicates that multiplying a fraction
    by 2 will expose a bit.


    We have 2 *0.6875 = 1.375 so the first bit to the right of the binary point is
    1. So our number is 1111001.lb.


    Next multiply the next fraction: 2 * 0.375 = 0.75, so the next bit is 0. We now
    have 1111001.10b.


    Multiplying again: 2 * 0.5 = 1, so the last bit is 1 leaving the final 1111001.11b.


    Our number -121.6875 = -1111001.1011b. We need to get this into exponential notation
    with a power of 2.


    ```

    121.6875 = -1111001.1011

    = -1.1110011011 * 2^6

    ```


    We have all the pieces. The sign bit is 1, the fraction (without the implied 1)
    is 11100110110000000000 and the exponent field is 127+6 = 133 = 1000001. So our
    number is


