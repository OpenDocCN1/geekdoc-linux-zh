    # # Printing the array


    Printing the array is done with printf. The print function, just like fill, needs
    to save 3 values on the stack since it calls another function. The code is somewhat
    similar to fill, except that array values are loaded into a register rather than
    being stored in array. You will notice that the data segment is used to store
    the printf format in a spot near the printf call. You will also notice that I
    have reused several local labels.


    ```

    ; print ( array, size );

    .array equ 0

    .size equ 8

    .i equ 16

    push rbp

    mov rbp, rsp

    mov rsp, 32

    mov [rsp+.array], rdi

    mov [rsp+.size], rsi

    xor ecx, ecx

    mov [rsp+.i], rcx

    segment .data

    format:

    db "%10d", 0x0a,0

    segment .text

    lea rdi, [rsp+.array]

    mov rdx, [rsp+.size]

    mov rcx, [rsp+.i]

    mov esi, [rdi+rcx*4]

    mov [rsp+.i], rcx

    call printf

    mov rcx, [rsp+.i]

    inc rcx

    mov [rsp+.i], rcx

    cmp rcx, [rsp+.size]

    jj .more

    leave

    ret

    ```'
