- pgno: 158
  md: '# Polynomial evaluation


    The evaluation of a polynomial of 1 variable could be done at least 2 ways.

    First is the obvious definition:


    $P(x) = p_0 + p_1x + p_2x^2 + \dots + p_nx^n$


    A more efficient way to compute the value is using Horner’s Rule:


    $b_n = p_n$

    nb_{n-1} = p_{n-1} + b_nx$

    nb_{n-2} = p_{n-2} + b_{n-1}x$

    $\dots = \dots$

    nb_0 = p_0 + b_1x$


    $P(x) = b_0$.

    Written as a function with an array of double coefficients as the first parameter
    (rdi), a value for x as the second parameter (xmm0) and the degree of the polynomial
    as the third parameter (rsi) we have:


    ```

    movsd xmm1, xmm0      ; use xmm1 as x

    movsd xmm0, [rdi+rsi*8] ; xmm0 = b_k

    cmp esi, 0             ; is the degree 0

    jz done

    ```


    ```

    sub esi, 1

    mulsd xmm0, xmm1      ; b_k * x

    addsd xmm0, [rdi+rsi*8] ; add p_k

    njnz more

    ```


    done:

    ret'
  merge: -1
  img_proc: true
