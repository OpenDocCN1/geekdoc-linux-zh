- pgno: 239
  md: '# Debugging


    The debug toolbar is shown below. There are 4 icons or buttons which are used
    to control debugging. Each time you click on the Run button the program saves
    your source code, runs the compiler and/or assembler and starts running your program
    in the debugger. Most likely you will want to set a breakpoint before clicking.
    Run by clicking the left of a source code line where you would like to have the
    program stop and inspect things. Then you can click Next/Step to step through
    your program 1 line at a time. Use Next to stay within the same function or subroutine.
    Use Step if you wish to debug inside a function or subroutine. You can skip past
    a bunch of statements using Continue which will execute until it reaches the next
    breakpoint. The Stop button will end the debugging process.


    ![](img/a81fe45f331f8cec874684a58e65cf74_239_0.png)


    # Breakpoints


    A breakpoint is a point in your source code which will cause the debugger to stop
    your program when it runs your program. If you set a breakpoint on line 10 of
    your code, the debugger will execute all lines up to line 10 when you click the
    Run button. Line 10 will not be run until you take another action using one of
    the Next, Step or Continue buttons.


    Every line of source code has a line number in the numbers column to the left
    of the source code. A breakpoint is visually identified in the source code window
    by using a red background for the line number with a breakpoint.


    You set or clear a breakpoint using a left click on a line number. The first click
    set the breakpoint and the second will clear it. A right click will pop up a menu
    allowing management of breakpoints including an option to delete them all.


    # Running a program


    The first step is to set a breakpoint on the line where you want your program
    to stop. Left click on the line number and you will see the line'
