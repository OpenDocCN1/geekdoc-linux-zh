    movss xmm0, [a] : load a

    subss xmm0, [b] : subtract b from a

    movapd [c], xmm0 : store a-b in c

    movd xmm0, [a] : load 2 doubles from a

    subpd xmm0, [b] : a[0]-b[0], a[1]-b[1]

    movd [c], xmm0 : store 2 results in c

    vmovapsd ymm0, [a] : load 4 doubles from a

    vmovapsd [c], ymm0 : store 4 results in c

    ```


    # # 11.5 Multiplication and division


    Multiplication and division follow the same pattern as addition and subtraction
    in that they operate on memory or register operands. They support floats and doubles
    they support scalar and packed data. The basic mathematical instructions for floating
    point data are


    | instruction | effect |

    |---|---|n| addsd | add scalar double |

    | addss | add scalar float |

    | adddp | add packed double |

    | addps | add packed float |

    | subsd | subtract scalar double |

    | subss | subtract packed double |

    | subps | subtract scalar float |

    | mulsd | multiple scalar double |

    | mulss | multiply scalar float |

    | muldp | multiple packed double |

    | mulps | multiple packed float |

    | divsd | divide scalar double |

    | divss | divide scalar float |

    | divdp | divide packed double |

    | divps | subtract packed float |


    # # 11.6 Conversion


    It is relatively common to need to convert numbers from one length integer to
    another, from one length floating point to another, from integer to floating point
    or from floating point to integer. Converting from one length integer to another
    is accomplished using the various move instructions presented so far. The other
    operations take special instructions.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Converting to a different length floating point


    There are 2 instructions to convert floats to doubles: cvtss2sd which converts
    one float to a double and cvtsps2d which converts 2 packed floats to 2 packed
    doubles. The source can be a memory location or an XMM register where the destination
    must be an XMM register.


    Similarly 2 instructions convert doubles to floats: cvtsd2ss which converts a
    double to a float and cvtpd2ss which converts 2 packed doubles to 2 packed floats.
    It has the same restriction that the destination must be an XMM register.


    ```

    cvtss2sd xmm0, [a] ; convert to a double in xmm0

    addsd xmm0, [b]      ; add double to a

    cvtsd2ss xmm0,xmm0 ; convert to float

    movss    [c],xmm0 ; move float sum to c

    ```


    # Converting floating point/to integer


    There are 2 instructions which convert floating point to integers by rounding:
    cvtss2si which converts a float to a double or quad word integer and cvtsd2si
    which converts a double to a double or quad word integer. The source can be an
    XMM register or a memory location, where the destination must be a general purpose
    register. There are 2 instructions which convert by truncating: cvtss2si and cvttsi.


    There are 2 instructions which convert integers to floating point: cvtsi2ss which
    converts a double or quad word integer to a float and cvtsi2sd which converts
    a double or quad word integer to a double. The source can be a general purpose
    register or a memory location, where the destination must be an XMM register.
    When using a register for the source the size is implicit in the register name.
    When using a memory location you need to add "dword" or "qword" to the instruction
    to specify the size.


    ```

    cvtss2si eax,xmm0      ; convert to int

    cvtsi2sd xmm0,rax      ; long to double

    cvtsi2sd xmm0, dword [x] ; dword to double

    ```


