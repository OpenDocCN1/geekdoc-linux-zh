- pgno: 202
  md: '```

    segment .text

    global add_array

    add_array:

    xor eax, eax

    .add_words:

    add rax, [rdi]

    add rdi, 8

    dec rsi

    jg .add_words

    ret

    ```


    Here is a version with the loop unrolled 4 times:


    ```

    segment .text

    global add_array

    add_array:

    push r15

    push r14

    push r13

    push r12

    push rbp

    push rbx

    xor eax, eax

    mov rbx, eax

    mov rcx, rbx

    mov rdx, rax

    .add_words:

    add rax, [rdi]

    add rbx, [rdi+8]

    add rcx, [rdi+16]

    add rdx, [rdi+24]

    add rdi, 32

    sub rsi, 4

    jg .add_words

    add rcx, rdx

    add rax, rbx

    add rax, rcx

    pop rbx

    pop rbp

    pop r12

    pop r13

    pop r14

    pop r15

    ret

    ```


    May have been some way to use fewer callee-save registers, but the choices I made
    simplifying the coding. In the unrolled code I am accumulating partial sums in
    rax, rbx, rcx and rdx. These partial sums are combined after the loop. Executing
    a test program with 1000000 calls to add up an array of 10000 quad-words took
    3.9 seconds for the simple version and 2.44 seconds for the unrolled version.
    There is so little to do per data element that the 2 programs start becoming memory
    bandwidth limited with large arrays, so I tested a size which fit easily in cache.'
