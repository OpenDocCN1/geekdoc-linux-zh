    Floating point comparisons are considered to be "ordered" or "unordered". An ordered
    comparison causes a floating point exception if either operand is a QNaN or SNaN.
    An unordered comparison causes an exception for only an SNaN. The gcc compiler
    uses unordered comparisons, so I will do the same.


    The unordered floating point comparison instructions are uncommonly for comparing
    doubles. The first operand must be an XMM register, while the second operand can
    be memory or an XMM register. They set the zero flag, parity flag and carry flag
    to indicate the type of result: unordered (at least 1 operand is NaN), less than,
    or greater than. A conditional jump seems like a natural choice after a comparison,
    but we need different instructions for floating point conditional jumps. It will
    look good to use an instruction like jge (jump if greater than equal) but the
    effect is from jae (jump if above or equal).


    | instruction | meaning | aliases | flags |

    |---|---|---||

    | jb | jump < | jnc | CF=1 |

    | jbe | jump <= | jna | CF=1 or ZF=1 |

    | ja | jump > | jne | ZF=0 and CF=0 |

    | jae | jump >= | jnc jnb | CF=0 |


    Here is an example

    movss xmm0, [a]

    mulss xmm0, [b]

    ucomiss xmm0, [c]

    jbe      less_eq ; jmp if a*b <= c


    # 11.8 Mathematical functions


