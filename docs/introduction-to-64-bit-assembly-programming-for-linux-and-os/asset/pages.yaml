    |---|---|---|---|

    | 19 | | 00000000000000010001 | a &ffff copied into column 3 |

    | 2 17 | | 00000000000000010001 | b ^0ffff copied into column 3 |

    | 3 | | 00000000000000010001 | << 4 |

    | 4 | | 00000000000000010000 | |

    | 5 | | 0000000000000000100111001 | Product |'
