- pgno: 73
  md: '# # Chapter 6

    A little bit of math


    So far the only mathematical operations we have discussed are integer addition
    and subtraction. With negation, addition, subtraction, multiplication and division
    it is possible to write some interesting programs. For now we will stick with
    integer arithmetic.


    # ## 6.1 Negation


    The neg instruction performs the two’s complement of its operand, which can be
    either a general purpose register or a memory reference. You can precede a memory
    reference with a size specifier from the following table:


    | Specifier | Size in bytes |

    |---|---|

    | byte | 1 |

    | word | 2 |

    | dword | 4 |

    | qword | 8 |


    The neg instruction sets the sign flag (SF) if the result is negative and the
    zero flag (ZF) if the result is 0, so it is possible to do conditional operations
    afterwards.


    The following code snippet illustrates a few variations of neg:


    ```

    neg rax       ; negate the value in rax

    neg dword [x] ; negate 4 byte int at x

    neg byte [x] ; negate byte at x

    ```'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# 6.2 Addition


    Integer addition is performed using the add instruction. This instruction has
    2 operands: a destination and a source. As is typical for the x86-64 instructions,
    the destination operand is first and the source operand is 0. It adds the contents
    of the source and the destination and stores the result in the destination.


    The source operand can be an immediate value (constant) of 32 bits, a memory reference
    or a register. The destination can be either a memory reference or a register.
    Only one of the operands may be a memory reference. This restriction to at most
    one memory operand is another typical pattern for the x86-64 instruction set.


    The add instruction sets or clears several flags in the rflags register based
    on the results of the operation. These flags can be used in conditional statements
    following the add. The overflow flag (OF) is set if the addition overflows. The
    sign flag (SF) is set to the sign bit of the result. The zero flag (ZF) is set
    if the result is 0. Some other flags are related to performing binary-coded-decimal
    arithmetic.


    There is no special add for signed versus unsigned numbers since the operations
    are the same. The same is true for subtraction, though there are special signed
    and unsigned instructions for division and add

    multiplication.


    There is a special increment instruction (inc), which can be used to add 1 to
    either a register or a memory location.


    Below is a sample program with some add instructions. You can see that there is
    a breakpoint on line 8. It is a little surprising that when you click on the “Run”
    button, the next line to execute is line 10. The reason for this is that lines
    8 and 9 establish a “stack frame” which is used in gdb to keep track of which
    function is being executed. Gdb doesn''t want to break in the middle of the instructions
    which establish the stack frame for a function, since commands related to local
    variables would be incorrect until the frame is complete. Line 10 is a fairly
    common operation to prepare some space for local variables on the stack. These
    3 instructions are so common that there is a leave instruction which can undo
    the effect of them to prepare for returning from a function.'
  merge: -1
  img_proc: true
