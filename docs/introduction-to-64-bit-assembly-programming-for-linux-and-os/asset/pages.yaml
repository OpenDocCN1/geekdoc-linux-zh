- pgno: 117
  md: 'a specific value. Resister rsi is the source address register and rdi is the
    destination address. None of the string instructions need operands.


    All of the string operations working with 1, 2 or 4 byte quantities are encoded
    in 1 byte, while the 8 byte variants are encoded as 2 bytes. Combined with a 1
    byte repeat instruction, this effectively encodes some simple loops in 2 or 3
    bytes. It is hard to beat a repeat.


    The string operations update the source and/destination registers after each use.
    This updating is managed by the direction flag (DF). If DF is 0 then the registers
    are increased by the size of the data item after each use. If DF is 1 the registers
    are decreased after each use.


    # Move


    The movsb instruction moves the byte from the address specified by rdi. The other
    mov instructions move 2, 4 or 8 byte elements from [rsi] to [rdi]. The data moved
    is not stored in a register and no flags are affected. After each data item is
    moved, the rdi and rsi registers are advanced 1, 2, 4 or 8 bytes depending on
    the size of the item.


    Below is some code to move 100000 bytes from one array to another:


    ```

    lea rsi, [source]

    lea rdi, [destination]

    mov rcx, 100000

    rep movsb

    ```


    # Store


    The stos instruction moves the byte in register al to the address specified by
    rdi. The other variants move data from ax, eax or ra to memory. No flags are affected.
    A repeated store can fill an array with a single value. You could also use stosb
    non-repeat loops taking advantage of the automatic destination register updating.


    Here is some code to fill an array with 100000 double words all equal to 1:


    ```

    mov eax, 1

    mov ecx, 100000

    lea rdi, [destination]

    rep stosd

    ```


    # Load


    The lodsb instruction moves the byte from the address specified by rsi to the
    al register. The other variants move more bytes of data into ax, eax or rex. No
    flags are affected. Repeating loops seems to be of little use. However you can
    use lod in other loops taking advantage of the automatic source register updating.


    Here is a loop which copies data from 1 array to another removing characters equal
    to 13:'
