    of each pair of bits in 2 variables &- in C. We will stick with the single & notation,
    since the assembly language and instruction matches the C bit-wise and operation.


    Here is a truth table for the operation:


    | | 0 | 1 |

    |---|---|--|

    | 0 | 0 | 0 |

    | 1 | 0 | 1 |


    Applied to some bits we get:


