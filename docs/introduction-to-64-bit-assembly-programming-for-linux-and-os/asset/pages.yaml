- pgno: 157
  md: '# # 11.9 Sample code


    Here we illustrate some of the instructions we have covered in some fairly practical
    functions.


    # ## Distance in 3D


    We can compute distance in 3D using a function which accepts 2 float arrays with
    x, y and z coordinates. The 3D distance formula is


    ```

    d = (x_1 - x_2)^2 + (y_1 - y_2)^2 + (z_1 - z_2)^2

    ```


    Here is assembly code for 3D distance:


    ```

    distance3d:

    movss xmm0, [rdi] : x of first point

    subss xmm0, [rsi] : - x of second point

    mulss xmm0, (x1-x2)^2

    movss xmm1, [rdi+4] : y of first point

    subss xmm1, [rsi+4] : - y of second point

    mulss xmm1, (y1-y2)^2

    movss xmm2, [rdi+8] : z of first point

    subss xmm2, [rsi+8] : - z of second point

    mulss xmm2, xmm2 : (z1-z2)^2

    addss xmm0, xmm1 : add x and y parts

    addss xmm0, xmm2 : add z part

    sqrtss xmm0, xmm0

    ret

    ```


    # ## Dot product of 3D vectors


    The dot product of 3D vectors is frequently used in graphics and is computed by


    $X_1X_2 + Y_1Y_2 + Z_1Z_2$


    Here is a function computing the dot product of 2 float vectors as 2 arrays


    ```

    dot_product:

    movss xmm0, [rdi] : get x1

    mulss xmm0, [rsi] : times x2

    movss xmm1, [rdi+4] : get y1

    mulss xmm1, [rsi+4] : times y2

    addss xmm0, xmm1 : x1*x2+y1*y2

    movss xmm2, [rdi+8] : get z1

    mulss xmm2, [rsi+8] : times z2

    addss xmm0, xmm2 : dot product

    ret

    ```'
  merge: -1
