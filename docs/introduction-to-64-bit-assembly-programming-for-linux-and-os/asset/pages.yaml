  md: '# Next and step


    Both the Next and Step buttons will step through your code, line by line. The
    difference is that Next will stay in the current function or subroutine, while
    Step will step into a function if one is called on the highlighted line. You generally
    only want to use the Step button to step into a function in the same source file
    or another file in the project.


    # Continue


    The Continue button will resume normal execution of the program and it will only
    stop if it encounters a breakpoint. You probably would use this to rapidly pass
    past some debugged code to reach a breakpoint in code which currently has an error.


    # Data window


    The data window displays variables in your program. For high level language this
    includes global variables, parameters to functions, local variables and user-defined
    variables. The globals includes a stack display by default shows the top 6 values
    on the stack.

    For assembly language the variables must be user-defined. The debugger is aware
    of the address of static variables, but not their type makes it impossible to
    display them properly as globals. Below is a picture of the data window while
    debugging a program.


