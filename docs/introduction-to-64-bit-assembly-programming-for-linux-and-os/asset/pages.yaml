- pgno: 61
  md: '# Chapter 5


    # Registers


    Computer memory is essentially an array of bytes which software uses for instructions
    and data. While the memory is relatively fast, there is a need for a small amount
    of faster data to permit the CPU to execute instructions faster. A typical computer
    executes at 3 GHz and many instructions execute in 1 cycle. However for an instruction
    to execute the instruction and any data required must be fetched from memory.
    One fairly common form of memory has a latency of 6 nanoseconds, meaning the time
    lag between requesting the memory and getting the data. This 6 nanoseconds would
    equal 18 CPU cycles. If the instructions and data were all fetched from memory
    there would probably be about 18 nanoseconds required for common instructions.
    18 nanoseconds is time enough for 54 instructions at 1 instruction per cycle.
    There is clearly a need to avoid using the relatively slow main memory.


    One type of faster memory is cache memory, which is perhaps 10 times as fast as
    main memory. The use of cache memory can help address the problem, but it is not
    enough to reach the target of 1 instruction per CPU cycle. A second type of faster
    memory is the CPU''s registers. Cache might be several megabytes, the CPU has
    only a few registers. However the registers are accessible in roughly half of
    a CPU cycle or less. The use of registers is essential to achieving high performance.
    The combination of cache and registers provides roughly half a modern CPU''s performance.
    The rest is achieved with pipelining and multiple execution units. Pipelining
    means dividing instructions into multiple steps and executing several instructions
    simultaneously though each at different steps. Pipelining and these features are
    not part of general assembly language programming, while registers are a central
    feature.


    The x86-64 CPUs have 16 general purpose 16 modern floating point registers. These
    floating point registers are either 128 or 256 bits depending on the CPU model
    and can operate on multiple integer or floating point values. There is also a
    floating register stack which we will not use in this book. The CPU has a 64 bit
    instruction'
