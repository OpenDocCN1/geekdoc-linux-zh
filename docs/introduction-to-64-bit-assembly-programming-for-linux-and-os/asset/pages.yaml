    We ignore the leading 1 bit (a result of a carry). The 16 bit is 1111 0010 0101
    0010, which is negative. Inverting: 0000 1101 1010 1101. Next adding 1 to get
    the two''s complement: 0000 0000 1011 1011. So the number is 2048 + 128 + 64 +
    16 + 8 + 2 + 1 = 2267. So have -750 + -2267.


    # Binary addition


    Performing binary addition is a lot like decimal addition. Let''s add 2 binary
    numbers


    ```

    10001111

    + 01011010

    1

    ```


    The first pair of bits was easy. Adding the second pair of bits gives a value
    of 2, but 2 = 10b, so we place a 0 on the bottom and carry a 1


    ```

    1

