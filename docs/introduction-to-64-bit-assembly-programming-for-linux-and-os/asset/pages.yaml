  md: 'track of a large number of editing steps which allows undoing a lot of changes.


    # Find and replace


    Use Control-F to pop up the Find/Replace dialog. There is a text entry box for
    entering a string to find. The focus is ready for you to type the search string
    when the dialog starts. If you simply want to find, then enter Enter, Control-F
    or the Find button as many times as you wish. If you wish to change the string,
    use Tab to move to the text entry box for the replacement field and enter a string.
    To replace the string, use Control-R or the Replace button. You can end the Find/Replace
    dialog using the Cancel button.


    # Deleting text


    Backspace will delete the character to the left of the cursor while Delete will
    delete the character to the right of the cursor. Control-Backspace will delete
    the word to the left of the cursor and Control-Delete will delete the word to
    the cursor.


    # Using tabs


    Entering a tab character will enter enough spaces to move to the next tab stop.
    Tabs are at columns 5, 9, 13, ... indenting 4 characters for each tab. Control-Tab
    will delete space characters to the left of the cursor to position to the previous
    tab column. The tab spacing value can be changed by editing “.ebe.ini” or using
    “Edit settings” from the Edit menu.


    # Auto-indent


    The editor will automatically enter spaces so that a new line will be indented
    the same as the previous line. Ebe will indent the next line after a line ending
    in “{”. Likewise it will unindent when a line begins with “}”. Adjusting indentation
    for a new line can be done using Tab or Control-Tab.


    # Prettyify


    Ebe will call the external program style to format C and C++ programs if you use
    the “Prettyify” option under the Edit menu or the “magic wand” icon on the edit
    toolbar. You can change the options used for astyle or even'
  merge: -1
