  md: '# # Chapter 7


    # # Bit operations


    A computer is a machine to process bits. So far we have discussed using bits to
    represent numbers. In this chapter we will learn about a handful of computer instructions
    which operate on bits without any implied meaning for the bits like signed or
    unsigned integers.


    Individual bits have the values 0 and 1 and are frequently interpreted as false
    for 0 and true for 1. Individual bits could have other interpretations. A bit
    might mean male or female or any assignment of an entity to one of 2 mutually
    exclusive sets. A bit could represent an individual cell in Conway''s game of
    Life.


    Sometimes data occur as numbers with billions of numbers in the range of 0 to
    15. Then each number could be stored in 4 bits. Is it worth to store your numbers
    in 4 bits when 8 bytes are readily available in a language like C++? Perhaps not
    if you have access to a machine with sufficient memory. It might be nice to store
    the numbers on disk in half the space. So you might need to operate on bit fields.


    # 7.1 Not operation


    The not operation is a unary operation, meaning that it has only 1 operand. The
    everyday interpretation of not is the opposite of a logical statement. In assembly
    language we apply not to all bits of the word. C has two versions of not, “!”
    and “~”. !” is used for the opposite of a true or false value, while “~” applies
    to all bits of the word. It is common to distinguish the two not by referring
    to “!” as the “logical” and “~” as the “bit-wise” not. We will use “~” since the
    assembly language not inverts each bit of a word. Here are some examples, illustrating
    the meaning of not (pretending the length of each value is as shown).'
