  md: '# Chapter 8


    # Branching and looping


    So far we have not used any branching statements in our code. Using the conditional
    move instructions added a little flexibility to the code while preserving the
    CPU''s pipeline contents. We have seen that it can be tedious to repeat instructions
    to process each byte in a quad-word or each bit in a byte. In the next chapter
    we will work with arrays. It would be fool-hardy to process an array of 1 million
    elements by repeating the instructions. It might be possible to do this, but it
    would be painful coping with variable sized arrays. We need loops.


    In many programs you will need to test for a condition and perform one of 2 actions
    based on the results. The conditional move is efficient if the 2 actions are fairly
    trivial. If each action is several instructions, long, then we need a conditional
    jump statement to branch to one alternative while allowing the CPU to handle the
    second alternative by not branching. After completing the second alternative we
    will typically need to branch around the code for the first alternative. We need
    conditional and unconditional branch statements.


    # 8.1 Unconditional jump


    The unconditional jump instruction (jmp) is the assembly version of the goto statement.
    However there is clearly no shame in using jmp. It is a necessity in assembly
    language, where goto can be avoided in higher level languages.


    The basic form of the jmp instruction is


    ```

    jmp

    label

    ```


    where label is a label in the program''s text segment. The assembler will generate
    a rip relative jump instruction, meaning that the flow of control will transfer
    to a location relative to the current value of the instruction pointer. The simplest
    relative jump uses an 8 bit signed immediate value'
  merge: -1
  img_proc: true
- pgno: 107
  md: "and is encoded in 2 bytes. This allows jumping forwards or backwards about\
    \ 127 bytes. The next variety of relative jump in 64 bit mode uses a 32 bit signed\
    \ immediate value and requires a total of 5 bytes. Fortunately the assembler figures\
    \ out which variety it can use and chooses the shorter form. The programmer simply\
    \ specifies a label.\n\nThe effect of the jump statement is that the CPU transfers\
    \ control to the instruction at the loaded address. This is generally not too\
    \ exciting except when used with a conditional jump. However, the jump instruction\
    \ can jump to an address contained in a register or memory location. Using a conditional\
    \ move one could manage to use an unconditional jump to an address contained in\
    \ a register to implement a conditional jump. This isn't sensible, since there\
    \ are conditional jump statements which handle this more efficiently.\n\nThere\
    \ is one more possibility which is more interesting - implementing a switch statement.\
    \ Suppose you have a variable i which is known to contain a value from 0 to 2.\
    \ Then you can form an array of instruction addresses and use a jump instruction\
    \ to jump the correct section of code based on the value of i. Here is an example:\n\
    \n```\nsegment .data\nswitch:\n  dq main.case0\n  dq main.case1\n  dq main.case2\n\
    i:\n  dq 2\n  segment .text\nglobal main\nmain:\n  mov ra, [i]      ; move i to\
    \ rax\n  jmp [switch+rax*8]; switch (i)\ncase0:\n  mov rbx, 100    ; go here if\
    \ i == 0\n  jmp .end\ncase1:\n  mov rbx, 101    ; go here if i == 1\n  jmp .end\n\
    case2:\n  mov rbx, 102    ; go here if i == 2\nend:\n  xor eax, eax\n  ret\n```\n\
    \nIn this code we have used a new form of label with a dot prefix. These are referred\
    \ to as \"local labels\". They are defined within the range of enclosing regular\
    \ labels. Basically the local labels could be used for all labels inside a function\
    \ and this would allow using the same local labels in multiple functions. We also\
    \ used main.case0 outside of main to refer to the .case0 label inside main.\n\n\
    From this example we see that an unconditional jump instruction can be used to\
    \ implement some forms of conditional jumps. Though conditional jumps are more\
    \ direct and less confusing, in larger switch"
