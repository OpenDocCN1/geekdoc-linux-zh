  md: "# 15.2 Doubly-linked lists\n\nA doubly-linked list has 2 pointers for each\
    \ node: one points to the next node and one points to the previous node. It becomes\
    \ quite simple to manage a doubly-linked list if you make the list circular and\
    \ if you retain an unused cell at the start of the list. Here is an example list\
    \ with 4 data nodes:\n\n![](img/a81fe45f331f8cec874684a58e65cf74_184_0.png)\n\n\
    We see that the variable list points to the first node of the list, called the\
    \ “head node”. The head node has a value, but we never use the value. The top\
    \ pointer in each node points to the next node in the list and the bottom pointer\
    \ points to the previous node in the list. The previous pointer of the head node\
    \ is the last node in the list. This makes this list capable of implementing a\
    \ stack (last-in-first-out), a queue (first-in-first-out) or a double-ended queue\
    \ (deque). The primary advantage of this design is that the list is never empty\
    \ · it can be logically empty but the head node remains. Furthermore, once a list\
    \ is created, the pointer to the head node never changes.\n\n# Doubly-linked list\
    \ node structure\n\nOur list will have 3 fields: a data value, a pointer to the\
    \ next node and a pointer to the previous node. The yasm structure definition\
    \ is\n\n```\nstruct          node\nn_value  resq    1\nn_next   resq    1\nn_prev\
    \   resq    1\n                align   8\nendstruct\n```\n\n# Creating a new list\n\
    \nThe code for creating a new doubly-linked list allocates a new node and sets\
    \ its next and previous pointers to itself. The calling function receives a pointer\
    \ which does not change during the execution of the program. Here is the creation\
    \ code:\n\n```\n;      list = newList();\nnewlist:\n        push rbp\n```"
