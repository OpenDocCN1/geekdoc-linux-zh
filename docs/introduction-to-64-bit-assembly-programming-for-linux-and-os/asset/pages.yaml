    mov   rdx, 15     ; will divide by 15 (0xf)

    mov   rbx, 15     ; unsigned divide

    div   rbx          ; rax == 0x1111111111111111


    not   rax          ; rax == 0xeeeeffffff

    ```


    Let''s assume that you need to manage a set of 64 items. You can associate each
    possible member of the set with 1 bit of a quad-word. Using not will give you
    the complement of the set.


