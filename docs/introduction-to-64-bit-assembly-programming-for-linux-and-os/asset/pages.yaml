- pgno: 140
  md: '# 10.3 Allocating arrays


    The simplest way to allocate memory in assembly is probably to use the C library
    malloc function. The prototype for malloc is


    ```

    void *malloc( long size );

    ```


    On success malloc returns a pointer to the allocated memory, while failure results
    in malloc returning 0. The returned memory by malloc is bounded on 16 byte boundaries,
    which is useful as an address for any type of object (except for arrays needing
    to be on 32 byte boundaries for AVX instructions). The memory can be returned
    for potential reuse by calling the free function with the pointer returned by
    malloc


    ```

    void free ( void *ptr );

    ```


    Here is an assembly segment to allocate an array of 100000000 bytes


    ```

    mov rdi, 100000000

    call malloc

    mov [pointer], rex

    ```


    There are several advantages to using allocated arrays. The most obvious one is
    that you can have arrays of exactly the right size. Frequently you can compute
    the size of array needed in your code and allocate an array of the correct size.
    If you use statically defined arrays either in the data or bss segment, you have
    to know the size needed before running the program (or guess).


    Another obvious reason for using allocated arrays is to size limitations imposed
    on the data and bss sections by the assembler, linker or operating system. Yasm
    reports “FATAL: out of memory” when you try to allocate an array of much more
    than 2 billion bytes. It succeeds with an array of 2 billion bytes in the bss
    segment. It takes approximately 104 seconds on a 2.4 GHz Opteron to assemble and
    link a program with a 2 GB array. In addition both the object file and the executable
    exceeded 2 billion bytes in size. It is much faster (less than 1 second) to assemble
    and link a program using malloc and the executable size was about 10 thousand
    bytes.


    The program using malloc was modified to allocate 20 billion bytes and still assembled
    and linked in than 1 second. It executed in 3 milliseconds. There is no practical
    way to use large amounts of memory using allocated memory.


    The user should be cautioned not to attempt to assemble programs with large static
    memory needs on a computer with large RAM required. This will cause disk thrashing
    while assembling and linking, far more than 100 seconds and nearly crippling the
    computer during'
