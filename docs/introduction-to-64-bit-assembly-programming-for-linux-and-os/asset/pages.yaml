- pgno: 258
  md: '# # Appendix E


    # # Using macros in yasm


    Yasm provides both single line macros and multi-line macros. Both of these can
    be used to provide abbreviations with meaningful names for commonly used instructions.
    While these might obscure the mechanisms of assembly language while learning the
    language they can be of significant utility in practical situations.


    # ## Single line macros


    A single line macro uses the %define preprocessor command. Let''s suppose you
    are tired of seeing 0x0a for the new-line character. You could define a macro
    for this as


    ```

    %define newline 0x0a

    ```


    From that point forward you could simply use newline and get 0x0a inserted in
    replacement for the macro.


    Single line macros can have parameters. Let''s suppose you wanted to define a
    while loop macro. You might wish to compare a value in a register against a value
    and if a condition is satisfied jump to the top of the loop. Here is a possible
    while macro:


    ```

    %define while(cc,label) jmp+cc label

    ```


    The %+ allows concatenation of tokens. After this definition we could use code
    like


    ```

    cmp rax, 20

    while(1,.more)

    ```'
  merge: -1
  img_proc: true
- pgno: 259
  md: "# Multi-line macros\n\nUsing a multi-line macro can simply our while macro\
    \ to include the required cmp instruction:\n\n```\n%macro while 4\n    cmp %1,\
    \ %3\n    j%2 %4\n%endmacro\n```\n\nThe number 4 on the %macro line suggests that\
    \ 4 parameters are expected. You can access each parameter as %1, %2, etc. You\
    \ can also access the number of parameters as %0.\n\nNow this definition leaves\
    \ the fairly pleasant feeling of creating an instruction, since the macro invocation\
    \ does not use parentheses:\n\n```\nwhile rax, 1, 20, .more\n```\n\nAdmittedly\
    \ this creates an instruction with 4 parameters which must be learned, but it\
    \ simplifies things a little.\nHow about the standard production of a stack frame:\n\
    \n```\n%macro function 2\n    global %1\n    %1: push rbp\n    mov rbp, rsp\n\
    \    sub rsp, %2\n%endmacro\n```\n\nWe may well simplify the ending of the function:\n\
    \n```\n%macro return 1\n    mov rax, %1\n    leave\n    ret\n%endmacro\n```\n\n\
    Now we can write a simple program using both macros:\n\n```\nfunction main, 32\n\
    \    xor eax, eax\n    inc eax\n.loop:\n    while rax, 1, 10, .loop\n    return\
    \ 0\n```\n\nA fairly useful pair of macros from the yasm manual are multipush\
    \ and multipop. These were used earlier in the Sobel example. It makes sense to\
    \ have a pair of macros to push and pop all callee-save registers in use register\
    \ intensive functions.\n\n```\n%macro pushedsaved\n    push rbp\n    push rbx\n\
    \    push r12\n    push r13\n    push r14\n    push r15\n```"
  merge: -1
  img_proc: true
