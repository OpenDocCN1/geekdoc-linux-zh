  img_proc: true
- pgno: 229
  md: '# Downloading the source code


    The git program is used to copy the source code from sourceforge using

    git clone git://git.code.sf.net/p/qtebe/code ebe


    This will create a directory named ebe which contains all the source code.

    Git is a source code management system which makes it possible to\update the source
    code using `git pull` from the ebe directory in the

    future. It will download only the changes.


    # Compiling ebe and installing


    There is a shell script in the ebe directory named “rebuild” which performs

    al the commands needed to build ebe. You can invoke it using


    ```

    cd ebe

    bash rebuild

    ```


    This will compile dozens of C++ files. After building ebe you need to

    install it by


    ```

    sudo cp ebe *.qm /usr/local/bin

    ```


    The *.qm files are used to allow you to select a different language for

    the ebe GUI. You can choose from Chinese, French and several other

    languages. If you change the language you will need to exit ebe and

    restart it to see the effect.


    # Installing from source on OS X


    To build ebe on OS X requires getting g++, gdb, astyle, gfortran, git, yasm

    and Qt on the computer. The Xcode package provides g++ and gdb. The

    MacPorts package provides the rest.


    # Installing Xcode from the Apple App Store


