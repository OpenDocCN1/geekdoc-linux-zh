    multiplying by a power of 2 is same as shifting the bits to the left, in this
    case by 8 bits. This will take the top 8 bits of rax to be placed in rdx and 8
    zeros will be introduced in the right of rax.


    Here are the registers:


    | rax 922337236854775807 | rsi 0x7fffffeb38 | r8 0x400caa |

