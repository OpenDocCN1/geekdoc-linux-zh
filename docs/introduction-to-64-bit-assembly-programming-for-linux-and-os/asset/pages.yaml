  md: '# Inserting a key into the tree


    The first step in inserting a key is to use the find function to see if the key
    is already there. If it is, then there is no insertion. If not, then a new tree
    node is allocated, its value is set to the new key value and its left and right
    child pointers are set to NULL. Then it''s time to find where to place this in
    the tree.


    There is a special case for inserting the first node in the tree. If the count
    of nodes in the tree is 0, then the count is incremented and the tree''s root
    pointer is set to the new node.


    If the tree is non-empty then you start by setting a current pointer to the root
    node. If the new key is less than the current node''s key, then the new node belongs
    to the left sub-tree. To handle this you inspect the left child pointer of the
    current node. If it is null, you have found the insertion point, so set the left
    pointer to the pointer of the new node. Otherwise update your current pointer
    to be the left pointer and start comparisons with this. If the key is not less
    than the current node''s key, it must be greater than. In that case you inspect
    the current node''s right child pointer or either set the new pointer or advance
    your current pointer to the right child and repeat the comparison


    ```

    insert ( t, n );

    insert:

    .n equ 0

    .t equ 8

    push rbp

    mov rbp, rsp

    sub rsp, 16

    mov [rsp+], rdi

    mov [rsp+n], rsi

    call find ; loop for n

    cmp rax, 0 ; if in the tree

    jne .done ; don''t insert it

    call malloc ; p = new node

    mov rsi, [rsp+n]

    mov [rax+n_value], rsi ; p->value = n

    xor edi, edi

    mov [rax+n_left], rdi ; p->left = NULL

    mov [rax+n_right], rdi ; p->right = NULL

    mov rdx, [rdx+t_count] ; get tree size

    cmp rdi, 0 ; count == 0 ?\jne .findparent

    inc word [rdx+t_count] ; count = 1

    mov [rdx+t_count], rax ; root = new node

    jmp .done

    .findparent:

    cword [rdx+t_root] ; count++

    mov rdx, [rdx+t_root] ; p = root

    .repeatfind:

    cmp rsi, [rdx+n_value] ; p->value < n ?

    ```'
