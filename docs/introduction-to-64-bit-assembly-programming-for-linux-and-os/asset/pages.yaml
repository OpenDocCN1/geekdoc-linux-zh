    | parameters | | |

    | user-defined | | |

    | a | long | 160 |

    | b | long | 310 |

    | sum | long | 480 |


    You can see that 3 local variables have been defined with type long and their
    values are displayed.


    # Defining variables


    You can define variables using either the name of a variable in the editor or
    using the address of a variable shown in the data window or the'
