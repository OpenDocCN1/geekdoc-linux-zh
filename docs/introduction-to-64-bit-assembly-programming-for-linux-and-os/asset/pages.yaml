    to load 2 more values for x and to load 2 more values from y. These values were
    used times to form accumulations into 5 registers: xmm8-xmm12.


    After completing the loop, it was time to add the 4 parts of each required sum.
    The first step of this process was using addpd to add the registers xmm8-xmm12
    to registers xmm-x4. Following this the "horizontal packed double", hadpd, instruction
    was used to add the upper and lower halves of each of the summation registers
    to get the final sums. Then the code implemented the formula presented earlier.


    When tested on 1 million correlations of size 10000, this program used 6.74 seconds
    which is approximately 11.8 GFLOPS. This is now pretty impressive since the CPU
    operates at 3.4 GHz. It produced about 3.5 floating point results per cycle. This
    means that more than one SSE instructions were completing at once. The CPU is
    performing out-of-order execution and completing more than one SSE instruction
    per cycle.


    # 19.3 Implementation using AVX instructions


    The Core i7 CPU implements a new collection of instructions called "Advanced Extensions"
    or AVX. For these instructions an extension of the XMM registers named ymm0 through
    ymm15 is provided along with new instructions. The YMM registers are 256 bits
    each and can hold 4 double precision values in each one. This allowed a fairly
    easy adaptation of the SSE function to operate on 4 values at once.


    In addition to providing the larger registers, the AVX added versions of existing
    instructions which allowed using 3 operands and a destination which did not participate
    as a source (unless you named the same register). The AVX versions of instructions
    are prefixed with the letter "v". Having 3 operand instructions reduces the register
    pressure and allows using two registers as sources in an instruction while preserving
    their values.


    Here is the AVX version of the corr function:


    ```

    segment .text

    global corr


    rdi: x array

    rsi: y array

    rcx: loop counter

    rx: n


    ymm0: 4 parts of sum_x

    ymm1: 4 parts of sum_y

    ymm2: 4 parts of sum_xx

    ymm3: 4 parts of sum_yy

    ```'
