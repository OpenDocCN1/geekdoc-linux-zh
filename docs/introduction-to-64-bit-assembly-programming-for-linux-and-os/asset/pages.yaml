- pgno: 16
  md: '# # Chapter 1

    Introduction


    This book is an introduction to assembly language programming for the x86-64 architecture
    of CPUs like the Intel Core processors and the AMD Athlon and Opteron processors.
    While assembly language is no longer widely used in general purpose programming,
    it is still used to produce maximum efficiency in core functions in scientific
    computing and in other applications maximum efficiency is needed. It is also used
    to perform some functions which cannot be handled in a high-level language.


    The goal of this book is to teach general principles of assembly language programming.
    It targets people with some experience in programming in a high level language
    (ideally C or C++), but with no prior exposure to assembly language.


    Assembly language is inherently non-portable and this text focuses on writing
    code for the Linux and OS operating systems, due to the free availability of excellent
    OS compilers, assemblers and debuggers. The variants of the BSD operating system
    use the same function call protocol which makes it likely that this book would
    be adequate for BSD systems. (Minor alterations would be needed in the exe for
    BSD). The instructions are the same on x86-64 systems regardless of the operating
    system, though Windows uses a different function call protocol which is the reason
    for having a separate book. Differences between programming for Windows systems
    will be detailed as the text unfolds


    The primary goal of this text is to learn how to write functions callable from
    C or C++ programs. This focus should give the reader an increased understanding
    of how a compiler implements a high level language. This understanding will be
    of lasting benefit in using high level languages.


    A secondary goal of this text is to introduce the reader using SSE and AVX instructions.
    The coming trend is for the size of SIMD (Single Instruction Multiple Data) registers
    to increase and it generally requires assembly language to take advantage of the
    SIMD capabilities.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# 1.1 Why study assembly language?


    In a time when the latest fads tend to be object-oriented high-level languages
    implemented using byte-code interpreters, the trend is clearly to write portable
    programs with high reliability in record time. It seems worrying about memory
    usage and CPU cycles is a relic from a by-gone era. So would anyone want to learn
    assembly programming?


    Assembly language programming has some of the worst "features" known in computing.
    First, assembly language is the poster child for non-portable code. Certainly
    every CPU has its own assembly language and many of them have more than one. The
    most common example is the Intel CPU family along with the quite similar AMD CPU
    collection. The latest versions of these chips can operate in 16 bit, and 64 bit
    modes. In each of these modes there are differences in the assembly language.
    In addition the operating system imposes additional differences. Further the function
    call interface employed in x86-64 Linux and OS X systems OS X Windows systems.
    Portability is difficult if not impossible in assembly language.


    An ever issue with assembly language programming is reliability. In modern languages
    like Java the programmer is protected from many possible problems like pointer
    errors. In Java, the programmer can be blissfully unaware of them. Contrast this
    to assembly language where every variable access is essentially a pointer access.
    Furthermore high level syntax resembles mathematical syntax, while assembly language
    is a sequence of individual machine instructions which bears no syntactic resemblance
    to the problem being solved.


    Assembly language is generally accepted to be slower than higher level languages.
    While experience can increase one''s speed, it is probably twice as slow even
    for experts. This makes it more expensive to write assembly code and adds to the
    cost of maintenance.


    # What is good about assembly language?


    The typical claim is that assembly language is more efficient than high level
    languages. A skilled assembly language coder can write code which uses less CPU
    time and memory than that produced by a compiler. However modern C and C++ programmers
    do excellent optimization and beginning assembly programmers are no match for
    a good compiler. The compiler writers understand the CPU architecture quite well.
    On the other hand an assembly programmer with similar skills can achieve'
  merge: -1
