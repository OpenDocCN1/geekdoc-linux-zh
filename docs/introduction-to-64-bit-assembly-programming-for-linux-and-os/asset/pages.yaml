  md: '# 64 bit machine level programming


    Drs. Bryant and O''Hollar of Carnegie Mellon have provided an excellent treatise
    dissecting how gcc takes advantage of the x86-64 architecture in a document located
    at www.cs.cmu.edu/~{}fp/courses/15213-s07/misc/asm64-handout.pdf


