- pgno: 235
  md: '![](img/a81fe45f331f8cec874684a58e65cf74_235_0.png)


    # # Editing


    Editing in ebe uses the mouse and keyboard in mostly normal ways for editors.
    Special keys like Delete and Enter work as expected. For many of these normal
    keys an additional action is invoked using the Control key and the normal key.
    Most editing actions are available in the menu system which will also show the
    shortcut keys for the actions.


    For simplicity the discussion of editing in ebe refers to using the Control key
    to invoke shortcuts. On OS X this is usually done using the Apple key. Fortunately
    the menu system displays the proper shortcuts. In addition the shortcuts are based
    on normal editing shortcuts obtained from Wikipedia:


    http://en.wikipedia.org/wiki/Table_of_keyboard_shortcuts.


    # # Navigation


    Scrollbars There are vertical and horizontal scrollbars which can scroll through
    the file. Scrolling can also be done using the mouse wheel.'
