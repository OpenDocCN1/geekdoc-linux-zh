- pgno: 244
  md: '# Projects


    A program in ebe is generally managed using a project file to keep track of the
    source code files in the program. The name of a project is the name of the program
    with ".ebe" appended to the name. Thus to build a program named "hello", you would
    use a project file named "hello.ebe".


    It is not necessary to use a project file with programs consisting of a single
    source code file. Ebe starts execution with no known project name (if not given
    on the command line). As long as there is no known project name, it is assumed
    that there is only 1 source file. Creating a project or opening a project will
    change the state so that ebe will be aware of having a project file. After that
    point ebe will keep track of the files using the project file.


    # Viewing the project window


    You may need to check the Project checkbox in the View menu in order to display
    the project window. The project window is one of several optional windows which
    are initially placed to the left of the source window. You can see an empty window
    below. You can move the window to be a "floating" window by left clicking in the
    title bar of the project window and dragging it until it is outside of the main
    window of ebe.


    ![](img/a81fe45f331f8cec874684a58e65cf74_244_0.png)


    For the project window right clicking will allow you to add or delete files from
    the project.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# Creating a new project


    You can create a new project using the “New project” option under the File menu.
    This option will allow you to navigate to a new directory and specify the name
    of the new project file. After creating the project file, any open source files
    will be closed and the project will be empty. Any changes to the project will
    be written automatically so there is no need to save the project file.


    # Opening a project


    You can open an existing project using the “Open project” option under the File
    menu. This option will allow you to navigate to a new directory and open a file
    with the “ebe” extension. After opening the project file, any open source files
    will be closed and the first file in the project will be opened in the editor.


    # Adding files to a project


    A right click in the project window will pop up a menu which will allow you to
    remove the selected file from the project, open the selected file in the ebe editor,
    or add a file to the project. A project is simply a file with a collection of
    file names – one per line, so it is also possible to edit a project file with
    a text editor.


    # Closing a project


    If you close the active project ebe will return to the default mode of not using
    a project. It will close all open files.


    # Toy box


    The ebe toy box is a dockable subwindow which allows experimentation with expressions
    in C/C++ or Fortran. The basic idea is to place variable definitions in one table
    and expressions in a second table. A variable definition includes a name, a type
    and a value. The types are selected from a list of simple types in the language.
    The names and values must be entered.


    The second table has expressions in the first column. After you enter an expression
    you click on the “do it” button to the right and ebe generates'
  merge: -1
  img_proc: true
