    # # 9.4 Function parameters and return value


    Most function have parameters which might be integer values, floating point values,
    addresses of data values, addresses of arrays, or any other type of data or address.
    The parameters allow us to use a function to operate on different data with each
    call. In addition functions have a return value which is commonly an indicator
    of success or failure.


    X86-64 Linux uses a function call protocol called the "System V Binary Interface"
    or System V ABI. The Mac OS/X using x86-64 processing also uses the System V ABI,
    so the information in this book applies to Linux and to the Mac. Unfortunately
    Windows uses a different protocol called the "Microsoft x64 Calling Convention".
    In both protocols some of the parameters are passed in registers. Linux allows
    the first 6 integer parameters to be passed in registers, while Windows allows
    the first 4 (using different registers). Linux and OS X allow the first 8 floating
    point parameters to be passed in floating point registers xmm0-xmm7, while Windows
    allows the first 4 floating point parameters to be passed in registers xmm0-xmm3.


    Linux, OS X and Windows use register rex for integer values and register xmm0
    for floating point value.


    Both Linux and Windows expect the stack pointer to be maintained on 16 byte boundaries
    in memory. This means that the hexadecimal value for rsp should end in 0. The
    reason for this requirement is to allow local variables in functions to be placed
    at 16 byte alignments for SSE and AVX instructions. Executing a call would decrement
    rsp leaving it with an 8. Conforming functions should either push something or
    subtract from rsp to get it back on a 16 byte boundary. It is common for a'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'function to push rbp as part of establishing a stack frame which re-establishes
    the 16 byte boundary for the stack. If your function calls any external function,
    it seems wise to stick with the 16 byte bounding requirement.


    The first 6 integer parameters in a function under Linux and OS X are passed in
    registers rdi, rsi, rdx, rcx, r8 and r9, while Windows uses rcx, rdx, r8 and r9.
    If a function requires more parameters, they are pushed onto the stack in reverse
    order.


    Functions like scanf and printf which have a variable number of parameters pass
    the number of floating point parameters in the function using the lax register.


    For 32 bit programs the protocol is different. Registers r8-r15 are not available,
    so there is not much value in passing function parameters in registers. These
    programs use the stack for all parameters.


    We are finally ready for "Hello World!"


    ```

    .data

    msg: db "Hello world!", 0x0a,0

    section .text

    global main

    extern printf

    main:

    npush rbp

    mov rdi, rsp

    lea eax, [msg] ; parameter 1 for printf

    xor eax, eax ; 0 floating point parameters

    call printf

    xor eax, eax ; return 0

    pop rbp

    ret

    ```


    We use the "load effective address" instruction (lea) to load the effective address
    of the message to print with printf rdi. This could also be done with mov, but
    lea allows specifying more items in the brackets so that we could load the address
    of an array element. Furthermore, over OS mov will not allow you to move an address
    into a register. The problem is that static addresses for data have values which
    exceed the capacity of 32 bit pointers and the constant field of the mov instruction
    is 32 bits. The easy assessment is to use lea to load addresses.


    Interestingly when the system starts a program in _start (or simply in OS X) the
    parameters to start are pushed onto the stack. However, the parameters to main
    are in registers like any other C function.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# 9.5 Stack frames


    One of the most useful features of the gdb debugger is the ability to trace backwards
    through the stack functions which have been called using `bt` or `backtrace`.
    To perform this each function must keep a pointer in rbp to a 2 quad-word object
    on the stack identifying the previous value of rbp with the return address. You
    might notice the sequence `push rbp; mov rbp; rsp` in the hello world program.
    The first instruction pushes rbp immediately below the return address. The second
    instruction makes rbp point to that address.


    Assuming all functions obey this rule of starting with the standard 2 instructions,
    there will be a linked list of objects on the stack - one for each function invocation.
    The debugger can traverse the list to identify the function (based on the location
    of the return address) and use other information stored in the executable to identify
    the line number for this return address.


    These 2 quad-word objects are simple examples of “stack frames”. In functions
    that do not call other functions (leaf functions), the local variables for the
    function might fit all in registers. There are too many local variables or if
    the function calls other functions, there might need to be some space on the stack
    for these local variables. To allocate space for the local variables, you simply
    subtract from rsp. For example to leave 32 bytes for local variables in the stack
    frame do this:


    ```

    push    rbp

    mov     rbp, rsp

    sub     rsp, 32

    ```


    Be sure to subtract a multiple of 16 bytes to avoid possible problems with stack
    alignment.


    To establish a stack frame, you use the 2 instructions at the start of a function:


    ```

    push    rbp

    mov     rbp, rsp

    ```


    The effect of these 2 instructions and a possible subtraction from rsp can be
    undone using


    ```

    leave

    ```


    just before a `ret` instruction. For a leaf function there is no need to do the
    standard 2 instruction prologue and no need for the `leave` instruction. They
    can be omitted in general though it will prevent gdb from being able to trace
    backwards though the stack frames.


    When you have local variables in the stack frame it makes sense to access these
    variables using names rather than adding 8 or 16 to rsp. This'
  merge: -1
  img_proc: true
