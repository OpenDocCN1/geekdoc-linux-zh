  md: '# # Chapter 3

    # Computer memory


    In this chapter we will discuss how a modern computer performs memory mapping
    to give each process a protected address space and how the Linux system manages
    the memory for a process. A practical benefit of this chapter is a discussion
    of how to examine memory using the gdb debugger and ebe.


    # ## 3.1 Memory mapping


    The memory of a computer can be considered an array of bytes. Each byte of memory
    has an address. The first byte is at address 0, the second byte at address 1,
    and so on until the last byte of the computer''s memory.


    In modern CPUs there are hardware mapping registers which are used to give each
    process a protected address space. This means that multiple people can each run
    a program which starts at address 0x4004c8 at the same time. These processes perceive
    the same “logical” addresses, while they are using memory at different “physical”
    addresses.


    The hardware mapping registers on an x86-64 CPU can map pages of 2 different sizes
    - 4096 bytes and 2 megabytes. Linux, OS X and Windows use all 2 MB pages for the
    kernel and 4 KB pages for most other users. Some operating systems allow users
    to use 2 MB pages. In some of the most recent CPUs there is also support for 1
    GB pages.


    The operation of the memory system is to translate the upper bits of the address
    from a process''s logical address to a physical address. Let''s consider only
    4 KB pages. Then an address is translated based on the page number and the address
    within the page. Suppose a reference is made to logical address 0x4000002220.
    Since 4096 = 2¹¹², the offset within the page is the right-most 12 bits (0x220).
    The page number is the rest of the bits (0x40000002). A hardware register (or
    multiple registers) translates this'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'page number to a physical address, let''s say 0x780000000. Then the two addresses
    are combined to get the physical address 0x780000020.


    Amazingly the CPU generally performs the translations without slowing down this
    benefits the users in several ways. The most obvious benefit is memory protection.
    User processes are limited to reading and writing only their own pages. This means
    that the operating system is protected from malicious or poorly coded user programs.
    Also each user process is protected from other user processes. In addition to
    protection from writing, users cannot read other users'' data.


    There are instructions used by the operating system to manage the hardware mapping
    registers. These instructions are not discussed in this book. Our book is on programming
    user processes.


    So why bother discuss paging, if we are not discussing the instructions to manage
    paging? Primarily this improves one''s understanding of the computer. When you
    write software which accesses data beyond the end of an array, you get a segmentation
    fault. However you only get a segmentation fault when your logical address reaches
    far past the end of the array to cause the CPU to reference a page table entry
    which is not mapped into your process.


    # 3.2 Process memory model in Linux


    In Linux memory for a process is divided into 4 logical regions: text, data, heap
    and stack. The stack is mapped to the highest address of a process and on x86-64
    Linux this is 0x7ffffffffffff or 13 TB. This address is selected based on the
    maximum number of bits allowed in logical addresses being 48 bits. This is 47
    bits of all 1 bits. The decision was made to not use bit 47, since canonical addresses
    have to extend bit 47 through bits 48-63.


    In Figure 3.1 we see the arrangement of the various memory segments. At the lowest
    address we have the text segment (.text for yasm). This segment is shown starting
    at 0, though both start and main'
