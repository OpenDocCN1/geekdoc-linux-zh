    # Inserting at the front of the list


    To insert a new node at the front of the list you need to place the head node''s
    next pointer in the new node''s next slot and place the head pointer into the
    new node''s previous slot. After doing that you can make the head node point forward
    to the new node and make the head''s former next point backwards to the new node.
    These steps are illustrated in the diagram below. The old links are in dashed
    lines and the new links are numbered, with bold lines.


    ![](img/a81fe45f331f8cec874684a58e65cf74_185_1.png)


    One of the elegant features of the doubly-linked circular list is the elimination
    of special cases. Inserting the first node is done with exactly the same code
    as inserting any other node.


    The code for insertion is


    ```

    ; insert ( list, k );

    insert:

    .list equ 0

    .k equ 8

    push rbp

    mov rbp, rsp

    sub rsp, 16

    mov [rsp+.list], rdi : save list pointer

    mov [rsp+.k], rsi : and on stack

    mov edi, node_size

    call malloc

    mov r8, [rsp+.list] : get list pointer

    mov r9, [r8+n_next] : get head''s next

    mov [rax+n_next], r9 : p->next = h->next

    mov [rax+n_prev], r8 : p->prev = h

    mov [r8+n_next], rax : p

    mov [r9+n_prev], rax : p->next->prev = p

    ```'
