    \ in a decimal. Enter hexadecimal...\n\nA hexadecimal number is a number in base\
    \ 16. We need \"digits\" from 0 to 15. The digits from 0-9 are just like decimal.\
    \ The digits from 10-15 are represented by the letters 'A' through 'F'. We can\
    \ also use lower case letters. Fortunately yasm and C/C++ represent hexadecimal\
