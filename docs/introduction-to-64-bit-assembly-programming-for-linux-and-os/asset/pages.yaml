    The pathname is a C string (character array terminated with a 0 byte). The flags
    are a set of bit patterns which are or''ed together to define how the file is
    to be opened: read-only mode, write mode or read-write mode and other characteristics
    whether the file is to be created. If the file is to be created the mode parameter
    defines the permissions to assign to the new file.


    The flags are defined in the table:


    | bits | meaning |

    | --- | --- |

    | 0 | read-only |

    | 1 | write-only |

    | 2 | read and write |

    | 0x40 | create if needed |

    | 0x200 | truncate the file |

    | 0x400 | append |


    The basic permissions are read, write and execute. A process must have permission
    to read an object, write permission to write it, and execute permission to execute
    it. Execute permission for a file means that the file (either a program or a script)
    can be executed. Execute permission for a directory allows traversal of the directory.


    These three permissions are granted or denied for 3 categories of accounts'' user,
    group and other. When a user logs in a Linux system the user''s shell is assigned
    the user''s user-id which is an integer identifying the user. In addition the
    user has a group-id (also an integer) which identifies the user as being in a
    particular group of users. A user can belong to multiple groups though only one
