    This code is possibly a good candidate for 2 conditional statements, but simplicity
    is bliss. Here is the assembly code for this:


    ```

    if (a < b) {

    mov rex, [a]

    m rbx, [b]

    cmp rex, rbx

    jnl else_if

    result = 1;

    jmp endif

    } else if (a > c) {

    mov rcx, [c]

    cmp rex, rcx

    jng result = 2;

    mov qword [result], 2

    jmp endif

    } else {

