  md: '# # Chapter 15


    # # Data structures


    Data structures are widely used in application programming. They are frequently
    used for algorithmic purposes to implement structures like stacks, queues and
    heaps. They are also used to implement data storage based on a key, referred to
    as a "dictionary". In this chapter we discuss implementing linked lists, hash
    tables, doubly-linked lists and binary trees in assembly.


    One common feature of data structures is the use of a structure called a "node"
    which contains data and one or more pointers to other nodes. The memory for these
    nodes will be allocated using malloc.


    # ## 15.1 Linked lists


    A linked list is a structure composed of a chain of nodes. Below is an illustration
    of a linked list:


    ![](img/a81fe45f331f8cec874684a58e65cf74_180_0.png)


    You can see that the list has 4 nodes. Each node has a data value and a pointer;
    to another node. The last node of the list has a NULL pointer (value 0), which
    is illustrated as a filled circle. The list itself is represented as a pointer.
    We can illustrate the list more completely by placing the list''s first pointer
    in a box and giving it a name:


    ![](img/a81fe45f331f8cec874684a58e65cf74_180_1.png)


    This list has no obvious order to the data values in the nodes. It is either unordered
    or possibly ordered by time of insertion. It is very easy to insert a new node
    at the start of a list, so the list could be in decreasing time of insertion order.'
