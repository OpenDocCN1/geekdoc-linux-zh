- pgno: 182
  md: "```\nmov [rsp+.k], rsi ; and k on stack\nmov edi, node_size ; rax = node pointer\n\
    call malloc\nmov r8, [rsp+.list] ; get list pointer\nmov [rsp+n_next], r8 ; save\
    \ list pointer in new node\nmov r9, [rsp+.k] ; get k\nmov [rsp+n_value], r9 ;\
    \ save k in node\nleave\nret\n```\n\n# # Traversing the list\n\nTraversing the\
    \ list requires using an instruction like\nmov rbx, [rbx+n_next]\nto advance from\
    \ a pointer to one node to a pointer to the next node. We start by inspecting\
    \ the pointer to see if it is NULL. If it is not then we enter the loop. After\
    \ processing a node we advance the list and repeat the loop if the pointer is\
    \ not NULL. The print function below traverses the list and prints each data item.\
    \ The code shows a good reason why it is nice to have a few registers protected\
    \ in calls. We depend on rbx being preserved by printf.\n\n```\nprint:\n segment\
    \ .data\n.print_fmt:\n\td \"%1d\",0\n.newline:\n\td 0xa,0\n\tsegment .text\ntrbx\
    \ equ 0\npush rbp\nmov rbp, rsp\nsub rsp, 16\nmov [rsp+.rbx], rbx ; save old rbx\n\
    cmp rdi, rsp ; skip the loop if\nje .done ; list pointer == 0\nmov rbx, rdi ;\
    \ get first node\n.more:\n lea rdi, [.print_fmt]\nmov rsi, [rbx+n_value]\nxor\
    \ eax, eax ; print node value\ncall printf\nmov rbx, [rbx+n_next] ; p = p->next\n\
    cmp rbx, 0 ; end the loop if\njne .more ; node pointer == 0\ndone:\n lea rdi,\
    \ [.newline]\nxor eax, eax\ncall printf ; print a new-line\nmov rbx, [rsp+.rbx]\
    \ ; restore rbx\nleave\nret\n```"
