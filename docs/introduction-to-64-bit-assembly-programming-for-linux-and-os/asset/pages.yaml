  md: '# 4.3 Page Directory Pointer Table


    The next level in the memory translation hierarchy is the collection of page directory
    pointer tables. Each of these tables is also an array of 512 pointers. Let''s
    assume that our sample address has the value 0x002 for bits 38-30. Then the computer
    will fetch the third entry of the page directory pointer table to lead next to
    a page directory table at address 0x3588000.


    | Page Directory Pointer

    Table at 0x3467000

    |---|---|

    | 0 | 0x3587000 |

    | 1 | unused |

    | 2 | 0x3588000 |

    | ... | ... |

    | 511 | unused |


    # 4.4 Page Directory Table


    The third level in the memory translation hierarchy is the collection of page
    directory tables. Each of these tables is an array of 512 pointers, which point
    to page tables. Let''s assume that our sample address has the value 0x000 for
    bits 29-21. Then the computer will fetch the first entry of the page directory
    table to lead next to a page table at address 0x3678000


    | Page Directory

    Table at 0x3588000

    |---|---|

    | 0 | 0x3678000 |

    | 1 | 0x3679000 |

    | 2 | unused |

    | ... | ... |

    | 511 | unused |


    # 4.5 Page Table


    The fourth and last level in the memory translation hierarchy is the collection
    of page tables. Again each of these tables is an array of 512 pointers to pages.
    Let''s assume that our sample address has the value 0x1ff for bits 20-12. Then
    the computer will fetch the last entry of the page table to lead next to a page
    at address 0x57990000.'
