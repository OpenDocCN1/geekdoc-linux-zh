    # Testing for a Pythagorean triple


    Below is a program which uses imul, add and sub to test whether 3 integers, a,
    b, and c, form a Pythagorean triple. If so, $a^2 + b^2 = c^2$.


    ```

    ```pythagorean.asm

    1      This program tests the numbers a, b and c to

    2      see if they can be the legs and hypotenuse of

    3      a right triangle: a^2 + b^2 = c^2

    4

    5              segment .data

    6      dq             246             ; one leg of a triangle

    7      dq             328             ; another leg

    8      dq             410             ; hypotenuse?

    9              segment .text

    10     global main

    11 main:

    12     mov      rax, [a]      ; move a into ra

    13     imul     rax, rax      ; a squared

    14     mov      rbx, [b]      ; move into rbx

    15     imul     rbx, rbx      ; b squared

    16     mov      rcx, [c]      ; move into rcx

    17     imul     rcx, rcx      ; c squared

    18     add      rax, rbx      ; rax has a^2+b^2

    19     sub      rax, rcx      ; is ra 0?

    20     xor      rax, rax

    21     ret

    ```

