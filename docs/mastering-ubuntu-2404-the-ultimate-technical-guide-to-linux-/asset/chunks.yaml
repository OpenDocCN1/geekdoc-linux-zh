    # Setting Up Database Servers


    Database servers provide the backbone for data storage and management in web applications
    and enterprise environments.


    ## Installing MySQL Database Server


    `MySQL` is a popular relational database management system.


    Install the MySQL package: `sudo apt install mysql-server`


    Secure the installation: `sudo mysql_secure_installation`


    Follow the prompts to set a root password and secure the database.


    ### Creating a Database and User


    Log into the MySQL shell: `sudo mysql`


    Create a new database and user:


    ```sql

    CREATE DATABASE example_db;

    CREATE USER ''example_user''@''localhost'' IDENTIFIED BY ''password'';

    GRANT ALL PRIVILEGES ON example_db.* TO ''example_user''@''localhost'';

    FLUSH PRIVILEGES;

    ```


    Exit the MySQL shell: `EXIT;`


    ## Installing PostgreSQL Database Server


    `PostgreSQL` is a robust and feature-rich relational database system.


    Install the PostgreSQL package:


    ```bash

    sudo apt install postgresql postgresql-contrib

    ```


    ### Creating a Database and User


    Log into the PostgreSQL shell:


    ```bash

    sudo -u postgres psql

    ```


    Create a new database and user:


    ```sql

    CREATE DATABASE example_db;

    CREATE USER example_user WITH ENCRYPTED PASSWORD ''password'';

    GRANT ALL PRIVILEGES ON DATABASE example_db TO example_user;

    ```


    Exit the PostgreSQL shell: `\q`


    # Setting Up Other Essential Services


    Apart from web and database servers, other essential services are commonly required.


    ## Mail Servers


    Mail servers manage email delivery and reception. `Postfix` and `Dovecot` are
    popular mail server options.


    ### Installing Postfix


    Install the Postfix package: `sudo apt install postfix`


    Configure Postfix: `sudo dpkg-reconfigure postfix`


    ### Installing Dovecot


    Install the Dovecot package:


    ```bash

    sudo apt install dovecot-core dovecot-imapd dovecot-pop3d

    ```


    Configure `Dovecot` by editing `/etc/dovecot/dovecot.conf`.


    ## DNS Servers


    DNS servers resolve domain names to IP addresses. `BIND` is a popular DNS server.


    ### Installing BIND


    Install the BIND package:


    ```bash

    sudo apt install bind9 bind9utils bind9-doc

    ```


    Configure `BIND` by editing `/etc/bind/named.conf`.


    # Conclusion


    Setting up server components like web servers, databases, and essential services
    is a vital part of server administration in Ubuntu 24.04. By understanding and
    mastering the installation and configuration processes for each component, you
    can build a robust and efficient server environment tailored to your needs.


    # 9.2 Configuring Virtualization: Installing and Managing Virtual Machines


    Virtualization enables you to run multiple operating systems simultaneously on
    a single physical machine, allowing for efficient resource utilization, testing
    environments, and workload isolation. In Ubuntu 24.04, configuring and managing
    virtual machines (VMs) is straightforward, thanks to powerful tools like `KVM`
    (Kernel-based Virtual Machine), `QEMU`, and `Virt-Manager`.


    ![](image_rsrc3FS.jpg)


    ## Understanding Virtualization and its Benefits


    Virtualization separates computing environments from the physical hardware, providing
    benefits like:


    - **Resource Efficiency**: Share hardware resources between multiple VMs.

    - **Testing and Development**: Test software across other operating systems without
    additional hardware.

    - **Isolation and Security**: Isolate applications in separate VMs for enhanced
    security.

    - **Scalability**: Create, clone, or destroy VMs as needed.


    ## Types of Virtualization


    - **Full Virtualization**: Virtual machines have complete hardware emulation (e.g.,
    `KVM/QEMU`).

    - **Paravirtualization**: VMs share the host OS kernel for better performance
    (e.g., `Xen`).

    - **Containerization**: Isolated applications share the host OS (e.g., `Docker`).


    ## Setting Up KVM/QEMU


    `KVM`, combined with `QEMU` (Quick Emulator), provides a powerful virtualization
    solution.


    ### Checking Hardware Virtualization Support


    Ensure your system supports hardware virtualization.


    Check CPU virtualization support:


    ```bash

    egrep -c ''(vmx|svm)'' /proc/cpuinfo

    ```


    A value greater than 0 indicates support. Ensure virtualization is enabled in
    the BIOS/UEFI.


    ### Installing KVM/QEMU and Virt-Manager


    Install `KVM`, `QEMU`, `Virt-Manager`, and related packages:


    ```bash

    sudo apt install qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils virt-manager

    ```


    Verify `KVM` installation:


    ```bash

    sudo systemctl status libvirtd

    ```


    ### Configuring User Permissions


    Add your user to the `libvirt` and `kvm` groups for VM management.


    ```bash

    sudo usermod -aG libvirt,kvm $USER

    ```


    Log out and log back in for the changes to take effect.


    ### Creating Virtual Networks


    Virtual networks connect VMs to the host and the external network.


    1. Open `Virt-Manager` and navigate to "Edit > Connection Details."

    2. Click on the "Virtual Networks" tab.

    3. Click "New" to create a new network and follow the wizard.

    4. Assign the network a name, choose a network mode (NAT, Routed, etc.), and set
    the IP range.


    ## Creating and Managing Virtual Machines


    `Virt-Manager` provides a graphical interface for creating and managing VMs.


    ### Creating a New VM


    Open `Virt-Manager` and click "Create a new virtual machine." Choose the installation
    method (e.g., ISO image, network boot). Provide the path to the installation media
    or choose an existing volume. Configure the VM''s CPU, memory, and storage.


    - Select the virtual network to connect the VM.

    - Review the settings and click "Finish."


    ### Managing VM Resources and Settings


    - Select the VM in `Virt-Manager`.

    - Click the "Open" button to view the console or the "Details" button for settings.

    - Adjust CPU, memory, network, and disk settings as required.

    - Start, stop, pause, or reset the VM using the toolbar buttons.


    ### Installing Guest Tools


    Install guest tools for better performance and integration.


    #### Linux Guests

    For Ubuntu-based guests, install the `qemu-guest-agent` package:


    ```bash

    sudo apt install qemu-guest-agent

    ```


    #### Windows Guests

    For Windows guests, install the `VirtIO` drivers and `SPICE` guest tools.


    1. Download the `VirtIO` drivers ISO from Fedora''s website.

    2. Mount the ISO in the VM and install the drivers via the Windows Device Manager.

    3. Download and install the `SPICE` guest tools for better display and input support.


    ## Managing Virtual Machines with CLI Tools


    For advanced users, command-line tools like `virsh` provide comprehensive VM management.


    ### Listing and Controlling VMs


    - List all VMs: `virsh list --all`

    - Start a VM: `virsh start <vm-name>`

    - Shutdown a VM: `virsh shutdown <vm-name>`

    - Reboot a VM: `virsh reboot <vm-name>`

    - Suspend a VM: `virsh suspend <vm-name>`

    - Resume a VM: `virsh resume <vm-name>`


    ### Creating a New VM with virt-install


    `virt-install` creates new VMs from the command line.


    ```bash

    virt-install \

    --name <vm-name> \

    --ram 2048 \

    --vcpus 2 \

    --disk path=/var/lib/libvirt/images/<vm- name>.qcow2,size=20 \

    --os-type linux \

    --os-variant ubuntu20.04 \

    --network network=default \

    --graphics vnc \

    --cdrom /path/to/ubuntu-24.04.iso

    ```


    Replace `<vm-name>` with the desired VM name and adjust the parameters accordingly.


    ### Snapshot Management


    VM snapshots capture the state of a VM for backup or rollback purposes.


    #### Creating a Snapshot

    ```bash

    virsh snapshot-create-as <vm-name> <snapshot-name>

    ```


    #### Listing Snapshots

    ```bash

    virsh snapshot-list <vm-name>

    ```


    #### Reverting to a Snapshot

    ```bash

    virsh snapshot-revert <vm-name> <snapshot-name>

    ```


    # Conclusion


    Virtualization in Ubuntu 24.04, powered by `KVM/QEMU` and `Virt-Manager`, provides
    a flexible and efficient environment for managing virtual machines. Whether you''re
    setting up test environments, optimizing resource usage, or securing applications
    in isolated VMs, mastering virtualization will significantly enhance your server
    management capabilities.

