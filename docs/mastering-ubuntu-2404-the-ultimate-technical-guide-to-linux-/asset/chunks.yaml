- fmt: '

    To clone or image a disk with Clonezilla, boot your system from the `Clonezilla`
    USB drive and choose "device-image" for imaging or "device-device" for cloning.
    Follow the on-screen prompts to select the source and destination disks.


    # Recovery Solutions


    Having a reliable recovery solution in place is crucial for minimizing downtime
    and restoring functionality quickly.


    ## Live USB Recovery

    A Live USB is a bootable USB drive containing an operating system that allows
    you to access and repair your system even if the internal drive has failed. To
    create a Live USB, download the Ubuntu 24.04 ISO file from the official Ubuntu
    website. Create a bootable USB drive using `Rufus`, `Balena Etcher`, or `Startup
    Disk Creator`. Boot your system from the Live USB and choose "Try Ubuntu." Use
    the file manager to access your internal drives and recover data to an external
    drive.


    ## System Restore from Backup

    Restoring your system from backup depends on the backup tool used.


    - In `Deja Dup`, open the `Backups` application from a Live USB or fresh Ubuntu
    installation. Click "Restore," select the backup location and date, and follow
    the prompts to restore data.

    - In `Timeshift`, install `Timeshift` on a Live USB or fresh installation. Open
    `Timeshift`, select the backup location and desired snapshot, and click "Restore."

    - For `Rsync`, use the `rsync` command to restore files from a backup location.

    - In `Clonezilla`, boot from the `Clonezilla` USB drive and follow the on-screen
    prompts to restore the disk image.


    # Conclusion

    System backups and recovery are crucial practices that can save you from data
    loss and prolonged downtime. By implementing comprehensive backup strategies with
    tools like `Deja Dup`, `Timeshift`, and `rsync`, you''ll be prepared to restore
    your system efficiently in case of failure. Additionally, having a reliable recovery
    solution like a Live USB or `Clonezilla` disk image ensures you can always access
    and repair your data.


    # Chapter 6: Networking and Connectivity


    In today''s interconnected world, reliable networking and seamless connectivity
    are crucial for productivity, entertainment, and collaboration. Ubuntu 24.04 brings
    a comprehensive suite of tools and features to ensure users can connect effortlessly
    to local and global networks, whether via Ethernet, Wi-Fi, or other methods. In
    this chapter, we''ll explore the essentials of networking and connectivity in
    Ubuntu, helping you harness the full potential of your system''s networking capabilities.


    ![](image_rsrc3FA.jpg)


    ## The Evolution of Networking in Ubuntu

    Over the years, networking in Ubuntu has evolved from a relatively manual process
    to an intuitive and automated experience. This transformation has been driven
    by the integration of modern networking tools, the improvement of graphical user
    interfaces, and robust support for diverse network hardware.


    Ubuntu 24.04 builds on this legacy by incorporating cutting-edge features like
    `NetworkManager`, which simplifies the management of network connections, and
    improved support for Wi-Fi and VPN connections. Whether you''re connecting to
    your home network, setting up a VPN for work, or managing servers remotely, Ubuntu
    provides the tools you need.


    ## NetworkManager: Central Hub for Network Management

    `NetworkManager` is the backbone of network management in Ubuntu 24.04. It provides
    a unified framework for handling network connections and simplifies the process
    of connecting to different networks, be it wired, wireless, or mobile broadband.


    `NetworkManager` handles a variety of tasks, including automatically detecting
    network hardware, managing IP addressing, and providing secure Wi-Fi connections.
    With `NetworkManager`, you can easily switch between networks, prioritize connections,
    and configure advanced settings.


    ### Graphical Network Management with Network Settings

    For users who prefer a graphical interface, Ubuntu 24.04 offers `Network Settings`,
    a user-friendly tool that integrates seamlessly with `NetworkManager`.


    Accessing `Network Settings` is straightforward. Open the "Settings" application
    from the Applications menu and navigate to the "Network" tab. Here, you''ll find
    a comprehensive overview of your network connections and the ability to configure
    each one.


    #### Wired and Wireless Connections

    In `Network Settings`, you can manage both wired (Ethernet) and wireless (Wi-Fi)
    connections. For Ethernet connections, simply plug in your network cable, and
    `NetworkManager` will automatically configure the connection.


    For Wi-Fi connections, click on "Wi-Fi" in the Network Settings panel, enable
    it if necessary, and select your desired network from the list. Enter the network
    password if required, and you''ll be connected.


    #### VPN and Mobile Broadband

    If you need secure access to a remote network, `Network Settings` also provides
    options for configuring VPN connections. Click on "VPN," then "Add VPN," and choose
    from the supported protocols (`OpenVPN`, `PPTP`, etc.).


    Mobile broadband connections are equally easy to manage. Connect your USB modem
    or mobile device, and `NetworkManager` will guide you through the setup process.


    ### Command-Line Network Management with NMCLI

    For those who prefer the command line, `NMCLI` (NetworkManager Command-Line Interface)
    provides a powerful way to manage network connections. `NMCLI` allows you to control
    almost every aspect of `NetworkManager`, from listing and configuring connections
    to troubleshooting network issues.


    To list all available connections:

    ```

    nmcli connection show

    ```

    To activate a connection:

    ```bash

    nmcli connection up <connection-name>

    ```

    To create a new Wi-Fi connection:

    ```bash

    nmcli device wifi connect <SSID> password <password>

    ```


    ## Managing Network Interfaces with IFCONFIG and IP

    While `NetworkManager` handles most network management tasks, traditional tools
    like `ifconfig` and `ip` are still valuable for specific tasks.


    ### IFCONFIG

    `ifconfig` is used to configure and display network interfaces. To list all network
    interfaces:

    ```bash

    ifconfig -a

    ```

    To bring up an interface:

    ```bash

    sudo ifconfig <interface-name> up

    ```


    ### IP Command

    `ip` is a modern alternative to `ifconfig` and provides more advanced features.


    To display IP addresses and routing information:

    ```bash

    ip address show

    ip route show

    ```

    To assign an IP address to an interface:

    ```bash

    sudo ip address add <IP-address>/<netmask> dev <interface-name>

    ```


    ## Troubleshooting Network Issues

    Network issues can arise due to various factors, including hardware problems,
    misconfigurations, and software bugs. Ubuntu 24.04 provides several tools to diagnose
    and resolve these issues.


    ### Ping and Traceroute

    The `ping` command checks the connectivity between your system and another device.
    For example:

    ```bash

    ping google.com

    ```

    `traceroute` shows the path packets take to reach a destination, identifying where
    connectivity breaks down.

    ```bash

    traceroute google.com

    ```


    ### NetworkManager Logs

    `NetworkManager` logs often provide valuable insights into network issues. View
    the logs with:

    ```bash

    journalctl -u NetworkManager

    ```


    ### Checking DNS Configuration

    DNS (Domain Name System) resolves domain names into IP addresses. Misconfigured
    DNS can lead to connectivity issues. Check your DNS configuration with:

    ```bash

    systemd-resolve --status

    ```


    ## Advanced Networking: Setting Up Servers and Sharing Connections

    For advanced users, Ubuntu 24.04 offers powerful networking features, from setting
    up servers to sharing internet connections.


    ### DHCP and DNS Server with Dnsmasq

    `Dnsmasq` is a lightweight tool that provides DNS, DHCP, and TFTP services. Install
    it using:

    ```bash

    sudo apt install dnsmasq

    ```

    Configure `Dnsmasq` to assign IP addresses by editing `/etc/dnsmasq.conf`.


    ### Internet Connection Sharing

    Ubuntu allows you to share your internet connection with other devices. In `Network
    Settings`, configure one network interface to provide an IP address to other devices
    (e.g., via Ethernet), while the other interface connects to the internet (e.g.,
    via Wi-Fi).

