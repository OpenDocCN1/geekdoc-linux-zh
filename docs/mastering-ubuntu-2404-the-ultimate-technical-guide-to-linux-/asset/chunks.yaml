  raw: 'Web Server: Hosts websites and web applications, often using software like
    Apache or Nginx.


    Database Server: Manages databases with software like MySQL, PostgreSQL, or MongoDB.


    File Server: Provides shared storage for files and directories using protocols
    like NFS or Samba.


    Mail Server: Handles email delivery and reception, using software like Postfix
    or Dovecot.


    DNS Server: Resolves domain names to IP addresses, managed with software like
    BIND.


    Proxy Server: Acts as an intermediary between clients and servers to enhance security
    and performance.


    Choosing the Right Server Edition


    Ubuntu offers multiple editions suitable for different server environments:


    Ubuntu Server: The standard edition, ideal for most server roles.


    Ubuntu Cloud: Optimized for cloud computing with OpenStack support.


    Ubuntu Core: A lightweight edition designed for IoT devices and containers.


    Initial Server Setup


    Proper initial setup lays the foundation for secure and efficient server management.


    Basic Configuration


    Update the System: Keep the system updated to ensure it has the latest security
    patches and features.


    sudo apt update && sudo apt upgrade


    Set the Hostname: Set a recognizable hostname for the server. sudo hostnamectl
    set-hostname <new-hostname>


    Configure Time Zone and NTP: Ensure accurate time synchronization with NTP.


    sudo timedatectl set-timezone <time-zone>


    sudo apt install ntp


    sudo systemctl enable ntp


    Secure SSH Access


    Secure Shell (SSH) provides remote access to servers. Securing SSH access is crucial.


    Change the Default SSH Port: Modify the default port (22) to a less common port.


    sudo nano /etc/ssh/sshd_config


    Change Port 22 to a port like 2200 and restart SSH:


    sudo systemctl restart ssh


    Disable Root Login: Prevent direct root login via SSH.


    sudo nano /etc/ssh/sshd_config


    Change PermitRootLogin to no and restart SSH.


    Enable Public Key Authentication: Use SSH keys instead of passwords for authentication.


    ssh-keygen -t rsa -b 4096


    Add the public key to ~/.ssh/authorized_keys on the server.


    Setting Up a Web Server


    A web server is one of the most common server roles. Ubuntu 24.04 supports Apache
    and Nginx as popular web server options.


    Installing Apache


    Install Apache with: sudo apt install apache2


    Enable and start the Apache service:


    sudo systemctl enable apache2 sudo systemctl start apache2


    Configuring Virtual Hosts


    Apache uses virtual hosts to serve multiple websites from a single server.


    Create a virtual host configuration file:


    sudo nano /etc/apache2/sites-available/example.com.conf


    Add the following content:


    <VirtualHost *:80>


    ServerAdmin [admin@example.com](mailto:admin@example.com)


    ServerName example.com


    DocumentRoot /var/www/example.com


    ErrorLog ${APACHE_LOG_DIR}/error.log


    CustomLog ${APACHE_LOG_DIR}/access.log combined


    </VirtualHost>


    Enable the virtual host:


    sudo a2ensite example.com.conf


    sudo systemctl restart apache2


    Create the document root directory:


    sudo mkdir -p /var/www/example.com


    Installing Nginx


    Install Nginx with: sudo apt install nginx


    Enable and start the Nginx service:


    sudo systemctl enable nginx


    sudo systemctl start nginx


    Configuring Server Blocks


    Server blocks are the Nginx equivalent of Apache virtual hosts.


    Create a server block configuration file:


    sudo nano /etc/nginx/sites-available/example.com


    Add the following content:


    server {


    listen 80;


    server_name example.com;


    root /var/www/example.com;


    index index.html index.htm;


    location / {


    try_files $uri $uri/ =404;


    }


    error_log /var/log/nginx/example.com_error.log; access_log /var/log/nginx/example.com_access.log;


    }


    Enable the server block:


    sudo ln -s /etc/nginx/sites-available/example.com /etc/nginx/sites-enabled/


    sudo systemctl restart nginx


    Create the document root directory:


    sudo mkdir -p /var/www/example.com


    Setting Up a Database Server


    Database servers store and manage data efficiently. MySQL and PostgreSQL are popular
    choices.


    Installing MySQL


    Install MySQL with: sudo apt install mysql-server


    Secure the installation: sudo mysql_secure_installation


    Creating a Database and User


    Log into the MySQL shell: sudo mysql


    Create a new database and user:


    CREATE DATABASE example_db;


    CREATE USER ''example_user''@''localhost'' IDENTIFIED BY ''password'';


    GRANT ALL PRIVILEGES ON example_db.* TO ''example_user''@''localhost'';


    FLUSH PRIVILEGES;


    Installing PostgreSQL


    Install PostgreSQL with:


    sudo apt install postgresql postgresql-contrib


    Creating a Database and User


    Log into the PostgreSQL shell:


    sudo -u postgres psql


    Create a new database and user:


    CREATE DATABASE example_db;


    CREATE USER example_user WITH ENCRYPTED PASSWORD ''password'';


    GRANT ALL PRIVILEGES ON DATABASE example_db TO example_user;


    Conclusion


    Setting up and managing servers is a critical task for advanced system administrators.
    Whether you''re configuring a web server, database server, or any other service,
    mastering server management in Ubuntu 24.04 requires careful planning, security
    best practices, and a deep understanding of server roles.


    9.1 Installing Server Components: Setting Up Web Servers, Databases, and Other
    Essential Services


    Server components form the backbone of any networked environment, providing essential
    services like web hosting, data storage, and application management. In Ubuntu
    24.04, the process of installing and configuring these components is streamlined
    and flexible, allowing you to tailor your server environment to meet specific
    needs.


    ![](image_rsrc3FR.jpg)


    Setting Up Web Servers


    A web server hosts and delivers websites and web applications to clients over
    the internet. Apache and Nginx are the two most popular web servers available
    in Ubuntu.


    Installing Apache Web Server


    Apache is a powerful and widely-used web server known for its flexibility and
    feature-rich modules.


    Installation and Basic Configuration


    Install the Apache package: sudo apt install apache2


    Enable and start the Apache service:


    sudo systemctl enable apache2


    sudo systemctl start apache2


    Verify that Apache is running by accessing http://localhost or the server''s IP
    address in a web browser.


    Configuring Virtual Hosts


    Apache uses virtual hosts to serve multiple websites from a single server.


    Create a virtual host configuration file:


    sudo nano /etc/apache2/sites-available/example.com.conf


    Add the following content:


    <VirtualHost *:80>


    ServerAdmin [admin@example.com](mailto:admin@example.com)


    ServerName example.com


    DocumentRoot /var/www/example.com


    ErrorLog ${APACHE_LOG_DIR}/error.log


    CustomLog ${APACHE_LOG_DIR}/access.log combined


    </VirtualHost>


    Enable the virtual host:


    sudo a2ensite example.com.conf


    sudo systemctl restart apache2


    Create the document root directory and set appropriate permissions:


    sudo mkdir -p /var/www/example.com


    sudo chown -R $USER:$USER /var/www/example.com


    Add an index page to the document root:


    nano /var/www/example.com/index.html


    Add basic HTML content to the file.


    Test the configuration by accessing http://example.com in a web browser.


    Installing Nginx Web Server


    Nginx is a lightweight and high-performance web server known for its speed and
    ability to handle many concurrent connections.


    Installation and Basic Configuration


    Install the Nginx package: sudo apt install nginx


    Enable and start the Nginx service:


    sudo systemctl enable nginx


    sudo systemctl start nginx


    Verify that Nginx is running by accessing http://localhost or the server''s IP
    address in a web browser.


    Configuring Server Blocks


    Nginx uses server blocks (similar to Apache virtual hosts) to serve multiple websites.


    Create a server block configuration file:


    sudo nano /etc/nginx/sites-available/example.com


    Add the following content:


    server {


    listen 80;


    server_name example.com;


    root /var/www/example.com;


    index index.html index.htm;


    location / {


    try_files $uri $uri/ =404;


    }


    error_log /var/log/nginx/example.com_error.log; access_log /var/log/nginx/example.com_access.log;


    }


