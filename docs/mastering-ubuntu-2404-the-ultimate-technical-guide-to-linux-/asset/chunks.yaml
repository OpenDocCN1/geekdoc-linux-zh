    User account security revolves around ensuring that each user has appropriate
    access to system resources based on their role. It involves creating strong passwords,
    assigning the correct user roles, and managing file permissions.


    # Creating and Managing User Accounts


    Ubuntu 24.04 provides both graphical and command-line tools for managing user
    accounts.


    ## Using the Graphical Interface

    The graphical User Accounts tool makes it easy to create, modify, and delete user
    accounts.


    1. Open "Settings" from the Applications menu and navigate to "Users."

    2. Click "Unlock" at the top-right corner and authenticate.

    3. Click the "+" button to add a new user.

    4. Select the account type (Standard or Administrator) and provide the `username`,
    full name, and password.

    5. Click "Add" to create the new account.

    6. To modify an existing account, select it from the list and adjust the settings
    as needed.


    ### Using the Command Line

    The `adduser` and `useradd` commands can also be used to create and manage user
    accounts.


    #### Add a New User

    Create a new user account with:

    ```bash

    sudo adduser <username>

    ```

    Follow the prompts to set the password and provide additional information.


    #### Modify User Information

    Modify user account information with:

    ```bash

    sudo usermod -c "Full Name" <username>

    ```

    Change a user''s shell:

    ```bash

    sudo usermod -s /bin/bash <username>

    ```

    Add a user to a group:

    ```bash

    sudo usermod -aG <groupname> <username>

    ```


    #### Delete a User

    Remove a user account with:

    ```bash

    sudo deluser <username>

    ```

    Delete a user account and their home directory:

    ```bash

    sudo deluser --remove-home <username>

    ```


    # Managing Password Security

    Passwords are the first line of defense for user accounts. Implementing strong
    password policies is essential.


    ### Creating Strong Passwords

    Encourage users to create strong passwords that include a mix of uppercase and
    lowercase letters, numbers, and special characters. Passwords should be at least
    12 characters long.


    ### Changing Passwords

    Users can change their passwords using the `passwd` command:

    ```bash

    passwd

    ```

    Administrators can change other users'' passwords with:

    ```bash

    sudo passwd <username>

    ```


    ### Password Expiration Policies

    Set password expiration policies to force users to change their passwords periodically.


    #### Set Password Expiration Time

    To set a maximum password age of 90 days:

    ```bash

    sudo chage -M 90 <username>

    ```


    #### Require Password Change on First Login

    Require a user to change their password on first login:

    ```bash

    sudo chage -d 0 <username>

    ```


    #### Lock and Unlock Accounts

    Lock an account to prevent access:

    ```bash

    sudo usermod -L <username>

    ```

    Unlock an account:

    ```bash

    sudo usermod -U <username>

    ```


    # Monitoring and Auditing User Accounts

    Monitoring user activity and auditing accounts help detect unauthorized access
    and policy violations.


    ### System Logs

    System logs record login attempts and user activity.

    View recent login attempts with:

    ```bash

    sudo less /var/log/auth.log

    ```


    ### Last and Lastlog Commands

    The `last` command shows a history of user logins:

    ```bash

    last

    ```

    The `lastlog` command shows the last login time for each user:

    ```bash

    lastlog

    ```


    # Managing User Roles and Permissions

    User roles and permissions determine what actions users can perform on the system.


    ### User Roles

    In Ubuntu, user roles are primarily divided into standard users and administrators.


    #### Standard Users

    Standard users have limited permissions and cannot make system-wide changes.


    #### Administrators

    Administrators can make system-wide changes, install software, and manage other
    user accounts.

    Assign administrative privileges by adding a user to the `sudo` group:

    ```bash

    sudo usermod -aG sudo <username>

    ```


    ### File Permissions

    File permissions control who can read, write, or execute files and directories.


    #### Understanding File Permission Syntax

    File permissions are displayed as a combination of symbols: `-rwxr-xr--`

    The first character indicates the type of file:

    - `-` for a regular file

    - `d` for a directory

    - `l` for a symbolic link


    The next nine characters are grouped into sets of three:

    - Owner permissions (`rwx`)

    - Group permissions (`r-x`)

    - Others permissions (`r--)`)


    #### Changing File Permissions

    Change file permissions with the `chmod` command.

    Set read, write, and execute permissions for the owner only:

    ```bash

    chmod 700 <filename>

    ```

    Set read and execute permissions for the owner and group:

    ```bash

    chmod 750 <filename>

    ```


    #### Changing File Ownership

    Change the ownership of files and directories with the `chown` command.

    Change the owner of a file:

    ```bash

    sudo chown <username> <filename>

    ```

    Change the group ownership of a file:

    ```bash

    sudo chgrp <groupname> <filename>

    ```


    # Conclusion

    User account security is a fundamental aspect of system protection. By effectively
    managing passwords, user roles, and permissions, you can significantly reduce
    the risk of unauthorized access and data breaches. Ubuntu 24.04 provides robust
    tools and features that make managing user accounts intuitive and secure.


    # 7.2 Firewalls and Security Policies: Configuring Firewall Rules and Understanding
    Default Security Policies


    Firewalls are an essential component of system security, acting as barriers that
    control traffic entering and leaving a network or computer. In Ubuntu 24.04, configuring
    firewalls and understanding security policies are crucial steps in protecting
    your system from unauthorized access and potential cyber threats. This sub-chapter
    will guide you through the process of configuring firewall rules and understanding
    security policies to enhance your system''s defense.


    ![](image_rsrc3FG.jpg)


    ## The Role of Firewalls and Security Policies

    Firewalls prevent unauthorized access to your computer or network by filtering
    traffic based on predefined rules. Security policies define how different components
    of the system should interact and set the baseline for securing applications,
    user accounts, and data.


    ### Types of Firewalls

    There are different types of firewalls, each serving a specific purpose.


    #### Network Firewalls

    Network firewalls are hardware-based devices that filter traffic between different
    network segments. They are typically used to protect entire networks.


    #### Host-Based Firewalls

    Host-based firewalls are software applications that run on individual computers.
    They filter traffic entering and leaving the specific device.


    ## Configuring the Uncomplicated Firewall (UFW)

    The Uncomplicated Firewall (UFW) is Ubuntu''s default firewall tool. It provides
    an easy-to-use command-line interface for managing firewall rules.


    ### Enabling and Disabling UFW

    To enable UFW:

    ```bash

    sudo ufw enable

    ```

    To disable UFW:

    ```bash

    sudo ufw disable

    ```


    ### Checking UFW Status

    Check the current status of UFW with:

    ```bash

    sudo ufw status

    ```

    If UFW is active, this command will display a list of the current rules.


    ### Allowing or Denying Traffic

    Allow or deny traffic based on specific ports, services, or IP addresses.

    Allow incoming traffic on a specific port:

    ```bash

    sudo ufw allow 22

    ```

    Deny incoming traffic on a specific port:

    ```bash

    sudo ufw deny 80

    ```

    Allow traffic for a specific service:

    ```bash

    sudo ufw allow http

    ```

    Deny traffic from a specific IP address:

    ```bash

    sudo ufw deny from 192.168.1.100

    ```


    ### Logging and Monitoring

    Enable logging to monitor firewall activity:

    ```bash

    sudo ufw logging on

    ```

    View the logs in the `/var/log/` directory. The log file is typically named `ufw.log`.


    ### Advanced UFW Configuration

    For more advanced configurations, edit the UFW configuration files directly.

    Edit `/etc/ufw/ufw.conf` to change global settings. Modify `/etc/ufw/before.rules`
    and `/etc/ufw/after.rules` to define rules that apply before and after user-defined
    rules.


    ## Graphical Interface with GUFW

    GUFW is a graphical front-end for UFW, making firewall management more accessible.


    ### Installing GUFW

    Install GUFW with:

    ```bash

    sudo apt install gufw

    ```


    ### Using GUFW

    Open GUFW from the Applications menu and provide your password to access the settings.
    The interface allows you to easily enable or disable the firewall, add new rules,
    and adjust logging levels.


    ## Mandatory Access Control with AppArmor

    AppArmor is a Linux security module that enforces mandatory access control policies
    on applications. It restricts what applications can do based on predefined profiles.


    ### Understanding AppArmor Profiles

