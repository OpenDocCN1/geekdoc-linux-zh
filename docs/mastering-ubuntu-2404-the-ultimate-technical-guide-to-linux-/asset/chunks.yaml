- fmt: '

    Once the bootable USB drive has been created, it''s important to test it to ensure
    it works correctly. This will help identify any potential issues before starting
    the actual installation.


    Insert the USB drive into your computer and restart it. Enter the BIOS/UEFI settings
    by pressing the appropriate key (usually `F2`, `F10`, `Delete`, or `Esc`) as soon
    as the computer starts. In the `Boot Order` or `Boot Priority` section, set the
    USB drive as the first boot device. Save the settings and exit. Your computer
    should restart and boot into the Ubuntu 24.04 Live environment.


    If everything works correctly, you''ll see the Ubuntu welcome screen, where you
    can choose to "Try Ubuntu" or "Install Ubuntu."


    ## Common Issues and Troubleshooting


    If your computer doesn''t boot from the USB drive or you encounter errors, try
    the following:


    Ensure that the USB drive is properly inserted and recognized by your computer.
    Check the `Boot Order` in `BIOS/UEFI` settings and confirm that the USB drive
    is set as the first boot device. Verify that the `ISO` file was downloaded correctly
    and is not corrupted. Try using a different USB drive or port. Recreate the bootable
    USB drive using a different application.


    ## Final Thoughts


    Creating a bootable USB drive is a crucial first step toward experiencing the
    power and flexibility of Ubuntu 24.04. By following this step-by-step guide, you''ll
    have a reliable installer that can be reused for future installations or system
    recovery. With your bootable USB ready, the next chapter will guide you through
    the installation and initial setup of Ubuntu 24.04, unlocking a world of possibilities
    in open-source computing.


    ## 2.2 Installing Ubuntu 24.04: Comprehensive Instructions for Installation


    Installing Ubuntu 24.04 is a gateway to a world of open-source computing, where
    you''ll find an elegant and modern user experience combined with the stability
    and flexibility that Ubuntu is renowned for. This guide provides comprehensive
    instructions to ensure a smooth and successful installation.


    ![](image_rsrc3EW.jpg)


    ### Getting Started: Preparing Your System


    With your bootable USB drive ready, it''s time to install Ubuntu 24.04. Begin
    by inserting the USB drive into your computer and restarting it. As your computer
    powers on, enter the `BIOS/UEFI` settings by pressing the appropriate key, usually
    `F2`, `F10`, `Delete`, or `Esc`, depending on your computer''s manufacturer.


    In the `BIOS/UEFI` settings, navigate to the `Boot Order` or `Boot Priority` section
    and set the USB drive as the first boot device. Save the settings and exit the
    `BIOS/UEFI`. Your computer will restart and boot into the Ubuntu 24.04 installer.


    ### Language Selection and Installation Options


    The first screen you''ll see is the Ubuntu welcome screen, where you''ll choose
    your preferred language. This will set the default language for your new Ubuntu
    system and the installation process itself.


    After selecting your language, you''ll be presented with two options: "Try Ubuntu"
    and "Install Ubuntu." Trying Ubuntu allows you to explore the system without making
    any changes to your computer, but for a full installation, click on "Install Ubuntu."


    ### Keyboard Layout and Updates


    Next, you''ll be asked to select your keyboard layout. The "Detect Keyboard Layout"
    option will guide you through finding the right layout, or you can choose one
    manually from the list. Most users will find the default option suitable.


    After confirming your keyboard layout, you''ll have the option to download updates
    while installing Ubuntu and to install third-party software for graphics, Wi-Fi,
    and multimedia support. It''s recommended to enable both options to ensure your
    system is fully updated and equipped with all necessary drivers and codecs.


    ### Installation Type: Defining Your Setup


    The installation type step is crucial as it defines how Ubuntu will coexist with
    any existing operating system or data on your computer.


    For a clean installation with no data to preserve, select "Erase Disk and Install
    Ubuntu." This will format your entire drive and install Ubuntu as the sole operating
    system. If you''re planning to dual-boot Ubuntu alongside another operating system,
    such as Windows, choose "Install Ubuntu Alongside Another OS." The installer will
    automatically resize partitions to accommodate both systems.


    Advanced users who want to manually partition their disks can use the "Something
    Else" option for maximum flexibility. This allows you to create, resize, and delete
    partitions according to your specific requirements.


    Once you''ve made your choice, click "Install Now" and confirm your selection.


    ### Time Zone and User Account Setup


    After partitioning your disk, you''ll be prompted to select your time zone by
    clicking on a map or choosing from a list. This step ensures that your system
    clock and calendar applications are accurate.


    Next, you''ll create your user account. Enter your name, a username, and a strong
    password. You can choose to log in automatically or require a password each time
    you log in, and there''s also an option to encrypt your home folder for added
    security.


    ### Installation Progress and Final Steps


    With your preferences set, the installer will copy files to your system and configure
    everything according to your choices. This process can take anywhere from 10 to
    30 minutes, depending on your hardware and the installation options selected.


    During installation, you''ll see informative slides highlighting some of the new
    features and improvements in Ubuntu 24.04. These slides offer a glimpse into the
    exciting possibilities with your new system, from productivity applications to
    gaming and multimedia capabilities.


    Once the installation is complete, you''ll be prompted to remove your installation
    media and restart your computer. On the first boot, you''ll be greeted by the
    Ubuntu login screen. Enter your credentials and step into your freshly installed
    Ubuntu 24.04 environment.


    ## First Boot and Welcome Screen


    The initial login will present a Welcome screen designed to help you get started
    quickly. This screen offers options to connect to your online accounts, enabling
    seamless access to your emails, calendars, and files from Google, Microsoft, and
    Nextcloud accounts.


    You can also enable Canonical''s Livepatch service, which applies critical kernel
    security updates without requiring a reboot. This is particularly useful for those
    needing continuous uptime, like developers and system administrators.


    The Welcome screen also provides guidance on adjusting privacy settings, allowing
    you to control how much information your system shares, such as location and usage
    data. Additionally, it explains how to find and install new applications through
    the Ubuntu Software and Snap Store.


    ## System Customization and Software Installation


    After completing the initial setup, it''s time to make Ubuntu 24.04 truly your
    own. Start by customizing the desktop environment, configuring network settings,
    and installing additional software.


    Ubuntu 24.04 uses the GNOME desktop environment, which is highly customizable.
    To personalize your experience, you can change the wallpaper by right-clicking
    on the desktop and selecting "Change Background." Choose from a range of beautiful
    wallpapers or use your own images. The dock, which appears on the left side of
    the screen, can be moved to the bottom or right, resized, or hidden altogether.
    GNOME Extensions and themes let you radically alter the look and feel of your
    desktop, offering limitless possibilities for customization.


    Network settings can be adjusted via the "Settings" menu, ensuring you''re connected
    and secure. Most Ethernet and Wi-Fi connections will be detected automatically,
    but you can manually configure network options if needed.


    Ubuntu 24.04 comes with a comprehensive suite of pre-installed software, including
    Firefox for browsing, LibreOffice for productivity, and Thunderbird for email.
    If you need additional software, you can easily find and install applications
    through the Ubuntu Software and Snap Store.

