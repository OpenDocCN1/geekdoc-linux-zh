  trans: '


    缩略图缓存存储了图像、视频和文档的预览，以便在文件管理器中快速访问。随着时间的推移，此缓存可能会增大。使用以下命令清理缩略图缓存：


    ```bash

    rm -rf ~/.cache/thumbnails/*

    ```


    # 管理日志和临时文件


    系统日志和临时文件也会占用磁盘空间。日志轮转和手动清理有助于管理这些文件。


    ## 使用 Logrotate 进行日志转


    `logrotate` 是一个内置工具，通过轮转、压缩和存档日志系统日志。`logrotate` 通过文件 `/etc/logrotate.conf` 和目录
    `/etc/logrotate.d/` 进行配置。确保你的日志轮转设置适用于你的系统。


    ## 手动清理日志文件


    也可以手动清除日志。注意不要删除故障所需的所需的日志。要清理系统日志，请使用：`sudo rm -rf /var/log/*.log`


    ## 管理临时文件


    临时文件存储在 `/tmp` 目录下。如果这些文件未使用，可以安全地删除。要清理临时文件，请使用：`sudo rm -rf /tmp/*`


    # 优化系统性能


    除了磁盘清理外，性能优化可以显著提升你的计算体验。


    ## 管理启动应用


    自动启动的应用会增加启动时间并消耗系统资源。使用 `Stacer` 或内置的“启动应用程序”工具管理启动应用。


    从应用程序菜单打开“启动应用程序”，并通过取消勾选来禁用不需要启动应用。


    ## 调整 Swappiness


    `swappiness` 控制系统将内存页交换到磁盘的激进程度。较低的 swappiness 值可以减少交换的使用，从而提高性能。


    要调整 swappiness，请使用以下命令检查当前值：`cat /proc/sys/vm/swappiness`


    使用以下命令临时将值更改为 `10`（桌面用户推荐）：`sudo sysctl vm.swappiness=10`


    要使更改永久生效，请在 `/etc/sysctl.conf` 中添加或编辑以下行：`vm.swappiness=10`


    使用以下命令应用更改：`sudo sysctl -p`


    ## 使用 Preload 加速应用启动


    `preload` 是一个守护进程，它分析你的应用使用模式并将经常使用的程序预加载到内存中，从而缩短启动时间。


    使用以下命令安装并启动 `preload`：


    ```bash

    sudo apt install preload

    sudo systemctl enable preload

    sudo systemctl start preload

    ```


    # 监控系统资源


    监控系统资源有助于识别性能瓶颈并优化资源使用。


    ## GNOME 监器


    GNOME 监器提供了系统资源使用的图形概览。从应用程序菜单打开 GNOME 监器，并探索“资源”标签以监控 CPU、内存和网络使用。“进程”标签显示活动进程及其资源消耗。


    ## Top 和 Htop


    对于终端用户，`top` 和 `htop` 提供了系统进程的实时监控。打开终端并使用以下命令启动 `top`：`top`


    或者，如果安装了 `htop`：`htop`


    # 结语


    磁盘清理和系统优化对于维持高性能和流畅的计算至关重要。通过利用磁盘使用分析器、`Stacer` 和 `APT` 命令等内置工具，你可以回收宝贵的磁盘空间并提高系统效率。


    优化启动应用、调整 swappiness 以及使用 `preload` 可以进一步增强性能，确保你的 Ubuntu 24.04 系统保持响应迅速且易于使用。


    # 5.3 系统备份与恢复：创建备份以及在故障时恢复系统


    创建系统备份并实施可靠的恢复计划是保护数据和确保业务连续性的基本实践。在 Ubuntu 24.04 中，你可以利用多种内置和第三方工具创建全面的备份，并在发生故障时高效地恢复系统。本节将探索创建备份的不同方法，并为需要时恢复系统提供分步说明。


    ![](img/image_rsrc3F9.jpg)


    ## 系统备份与恢复的重要性


    数据丢失可能由于硬件故障、软件损坏、误删或网络攻击引起。拥有可靠的备份和恢复计划有助于降低这些风险并提供若干关键优势。保护数据完整性可确保关键文件和系统配置可以被恢复。业务连续性可以尽量减少停机时间和生产力损失。安心可以减少与潜在数据丢失相关的焦虑。


    ## 备份策略


    不同的备份策略提供不同级别的保护。考虑你的数据恢复需求并实施适当的策略。全备创建整个系统或指定目录的完整备份。增量备份捕自上次全备或增量备份以来的更改，节省存储空间。差异备份备份自上次全备以来的更改，在全备和增量备份之间提供折中方案。


    ## 内置备份工具


    Ubuntu 24.04 包含了用于创建备份和恢复数据的强大内置工具。


    ### Deja Dup：简单的备份工具


    `Deja Dup` 也称为“备份”，是一个用户友好的工具，通过计划备份、加密以及对本地和云存储的支持来简化备份过程。


    从应用程序菜单打开“备份”应用程序。点击“要备份的文件夹”并添加你想备份的目录。点击“要忽略的文件夹”从备份中排除特定目录。点击“存储位置”选择备份位置（例如：本地文件夹、外部驱动或云存储）。启用“计划”以设置备份频率（每天、每周或每月）。点击“概览”然后点击“立即备份”开始初始备份。


    ## 使用 Deja Dup 恢复备份


    使用 `Deja Dup` 恢复备份非常简单。打开“备份”应用程序并点击“恢复”。从你想恢复的位置和日期中选择备份。选择要恢复的文件或目录。点击“恢复”并确认数据恢复的位置。


    ### Timeshift：系统快照工具


    `Timeshift` 创建增量系统快照，允许你在发生故障时将系统恢复到之前的状态。它对于从系统升级、配置更改和应用安装中恢复特别有用。


    使用以下命令安装 `Timeshift`：`sudo apt install timeshift`


    要配置 `Timeshift`，从应用程序菜单打开它并选择快照类型（`RSYNC` 或 `BTRFS`）。选择存储快照的位置（推荐外部驱动）。配置快照计划（每天、每周或每月），然后点击“完成”完成设置。


    ### 使用 Timeshift 创建和恢复快照


    要手动创建快照，打开 `Timeshift` 并点击“创建”。`Timeshift` 将根据上次备份创建一个增量快照。恢复快照涉及打开 `Timeshift`、选择所需的快照并点击“恢复”。


    ## 高级备份工具


    对于高级用户和系统管理员，可以使用 `rsync` 和 `Clonezilla` 等工具。


    ### Rsync：灵活的命令行备份工具


    `rsync` 是命令行工具，为创建备份和在目录或网络位置之间同步文件提供了灵活选项。将你的主目录完整备份到外部驱动：`rsync -avh --delete
    /home/username/ /media/username/ExternalDrive/Backup/`


    该命令将你的主目录的内容同步到外部驱动，删除目标位置在源中已不存在的文件。


    ### Clonezilla：磁盘复制与镜像


    `Clonezilla` 是一种磁盘复制工具，可以创建磁盘镜像，适用于裸机恢复和磁盘迁移。从官方网站下载 `Clonezilla` 并使用 `Rufus`
    或 `Balena Etcher` 等工具创建可启动 USB 盘。


