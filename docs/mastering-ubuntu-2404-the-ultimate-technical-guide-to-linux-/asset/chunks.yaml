    ## 3.3 管理扩展：安装、配置和删除 GNOME 扩展


    作为 Ubuntu 24.04 核心的 GNOME 桌面环境以其灵性和可定制性闻名，这很大程度上源于其强大的扩展系统。GNOME 扩展是由社区编写的小段代码，用于增强和扩展
    GNOME 桌面的功能。本节深入探讨管理这些扩展的细节——安装、配置和删除它们——以便让 Ubuntu 体验完全符合你的需求和喜好。


    ![](img/image_rsrc3F1.jpg)


    ### GNOME 扩展的作用


    GNOME 扩展可以将你的桌面从一个整洁、极简的界面转变为一个针对你特定需求的丰富工作站。无论你是需要更好的工作空间管理、额外的系统监器，还是仅仅是一些美学调整，可能都有相应的符合要求的扩展。


    ### 开始使用 GNOME 扩展


    在开始使用 GNOME 扩展之前，你需要设置系统来处理它们。这涉及安装几个工具并熟悉 GNOME Extensions 网站，大多数扩展都在那里托管和维护。


    ### 安装 GNOME 扩展管理工具


    要通过图形化界面管理 GNOME 扩展，你需要安装 GNOME Extensions 应用程序。该工具允许你在无需使用浏览器的情况下开启或关闭、配置或卸载扩展。你可以直接从
    Ubuntu 软件中心或终端安装此工具：


    ```

    sudo apt install gnome-shell-extensions gnome-shell-extension-prefs

    ```


    ### 访问 GNOME Extensions 网站


    虽然 GNOME Extensions 应用程序很有用，但 GNOME Extensions 网站 (extensions.gnome.org)是你通往可用扩展海量库的门户。在使用网站安装和管理扩展之前，你需要安装浏览器集成，允许你的网络浏览器直接与你的
    GNOME 桌面交互。


    1. **安装浏览器集成**：打开你的浏览器并访问 GNOME Extensions 网站。系统将提示你安装一个浏览器插件或扩展，以促进网站与你的 GNOME
    桌面之间的通信。

    2. **安装原生主机连接器**：某些浏览器可能需要你安装原生主机连接器来与 GNOME 环境通信。你可以通过终端安装此组件：


    ```

    sudo apt install chrome-gnome-shell

    ```


    ### 探索并安装扩展


    设置完成后，你就可以探索琳众多的 GNOME 扩展了：


    - **浏览 GNOME Extensions 网站**：使用搜索框按名称或功能查找扩展。每个扩展页面都提供了如描述、用户评论和版本兼容性等详细信息。

    - **安装扩展**：点击扩展页面上的开关以进行安装。你可能需要确认你的选择或输入系统密码进行验证。


    ### 配置扩展


