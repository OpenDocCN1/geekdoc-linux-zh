    用户账户安全围绕确保每个用户根据其角色对系统资源具有适当的访问。这涉及创建强密码、分配正确的用户角色以及管理文件权限。


    # 创建和管理用户账户


    Ubuntu 24.04 提供了图形界面和命令行工具来管理用户账户。


    ## 使用图形界面

    图形化的“用户账户”工具可以轻松地创建、修改和删除用户账户。


    1. 从应用程序菜单中打开“设置”并导航到“用户”。

    2. 点击右上角的“解锁”并进行身份验证。

    3. 点击“+”按钮添加新用户。

    4. 选择账户类型（标准或或 管理员）并提供 `username`（用户名）、全名和密码。

    5. 点击“添加”创建新账户。

    6. 若要修改现有账户，请从列表中选择该账户并根据需要调整设置。


    ### 使用命令行

    也可以使用 `adduser` 和 `useradd` 命令来创建和管理用户账户。


    #### 添加新用户

    使用以下命令创建新用户账户：

    ```bash

    sudo adduser <username>

    ```

    按照提示设置密码并提供额外信息。


    #### 修改用户信息

    使用以下命令修改用户账户信息：

    ```bash

    sudo usermod -c "Full Name" <username>

    ```

    更改用户的 shell：

    ```bash

    sudo usermod -s /bin/bash <username>

    ```

    将用户添加到用户组：

    ```bash

    sudo usermod -aG <groupname> <username>

    ```


    #### 删除用户

    使用以下命令删除用户账户：

    ```bash

    sudo deluser <username>

    ```

    删除用户账户及其主目录：

    ```bash

    sudo deluser --remove-home <username>

    ```


    # 管理密码安全

    密码是用户账户的第一道防线。实施强密码策略至关重要。


    ### 创建强密码

    鼓励用户创建强密码，应包含大写字母、小写字母、数字和特殊字符的混合。密码长度至少为 12 个字符。


    ### 修改密码

    用户可以使用 `passwd` 命令更改密码：

    ```bash

    passwd

    ```

    管理员可以使用以下命令更改其他用户的密码：

    ```bash

    sudo passwd <username>

    ```


    ### 密码过期策略

    设置密码过期策略以强制用户定期更改密码。


    #### 设置密码过期时间

    要设置密码最长有效期为 90 天：

    ```bash

    sudo chage -M 90 <username>

    ```


    #### 要求首次登录时更改密码

    要求用户在首次登录时更改密码：

    ```bash

    sudo chage -d 0 <username>

    ```


    #### 锁定和解锁账户

    锁定账户以防止访问：

    ```bash

    sudo usermod -L <username>

    ```

    解锁账户：

    ```bash

    sudo usermod -U <username>

    ```


    # 监控和审计用户账户

    监控用户活动和审计账户有助于检测未经授权的访问和违反策略。


    ### 系统日志

    系统日志记录登录尝试和用户活动。

    使用以下命令查看最近的登录尝试：

    ```bash

    sudo less /var/log/auth.log

    ```


    ### last 和 lastlog 命令

    `last` 命令显示用户登录历史：

    ```

    last

    ```

    `lastlog` 命令显示每个用户的最后登录时间：

    ```

    lastlog

    ```


    # 管理用户角色和权限

    用户角色和权限决定了用户可以在系统上执行的操作。


    ### 用户角色

    在 Ubuntu 中，用户角色主要分为标准用户和管理员。


    #### 标准用户

    标准用户拥有有限权限，无法进行系统级的更改。


    #### 管理员

    管理员可以进行系统级的更改、安装软件并管理其他用户账户。

    通过将用户添加到 `sudo` 组来分配管理员权限：

    ```bash

    sudo usermod -aG sudo <username>

    ```


    ### 文件权限

    文件权限控制谁可以读取、写入或执行文件和目录。


    #### 理解文件权限语法

    文件权限显示为符号的组合：`-rwxr-xr--`。

    第一个字符表示文件类型：

    - `-` 表示普通文件

    - `d` 表示目录

    - `l` 表示符号链接


    接下来的九个字符分为三一组：

    - 所有者权限 (`rwx`)

    - 组权限 (`r-x`)

    - 其他人权限 (`r--`)


    #### 修改文件权限

    使用 `chmod` 命令更改文件权限。

    仅为所有者设置读取、写入和执行权限：

    ```bash

    chmod 700 <filename>

    ```

    为所有者和组设置读取和执行权限：

    ```bash

    chmod 750 <filename>

    ```


    #### 修改文件所有权

    使用 `chown` 命令更改文件和目录的所有权。

    更改文件的所有者：

    ```bash

    sudo chown <username> <filename>

    ```

    更改文件的组所有权：

    ```bash

    sudo chgrp <groupname> <filename>

    ```


    # 结论

    用户账户安全是系统保护的基本方面。通过有效管理密码、用户角色和权限，你可以显著降低未经授权访问和数据泄露的风险。Ubuntu 24.04 提供了强大的工具和功能，使用户账户管理变得直观且安全。


    # 7.2 防火墙与安全策略：配置防火墙规则和理解默认安全策略


    防火墙是系统安全的重要组成部分，作为屏障控制进入网络或计算机的流量。在 Ubuntu 24.04 中，配置防火墙和理解安全策略是保护系统免受未经授权访问和潜在网络威胁的关键步骤。本节将引导你完成配置防火墙规则和理解安全策略的过程，以增强系统的防御。


    ![](img/image_rsrc3FG.jpg)


    ## 防火墙和安全策略的作用

    防火墙通过根据定义的规则过滤流量，防止对你的计算机或网络的未经授权访问。安全策略定义了系统不同组件之间应如何交互，并为保护应用程序、用户账户和数据设定基准。


    ### 防火墙类型

    有不同类型的防火墙，每种都有特定的用途。


    #### 网络防火墙

    网络防火墙是基于硬件的设备，过滤不同网络段之间的流量。通常用于保护整个网络。


    #### 基于主机的防火墙

    基于主机的防火墙是运行在单独计算机上的应用程序。它们过滤进入和离开特定设备的流量。


    ## 配置简单防火墙 (UFW)

    Uncomplicated Firewall (UFW) 是 Ubuntu 的默认防火墙工具。它提供了一个易于使用的命令行界面来管理防火墙规则。


    ### 启用和禁用 UFW

    启用 UFW：

    ```bash

    sudo ufw enable

    ```

    要用 UFW：

    ```bash

    sudo ufw disable

    ```


    ### 检查 UFW 状态

    使用以下命令检查 UFW 的当前状态：

    ```bash

    sudo ufw status

    ```

    如果 UFW 已激活，此命令将显示当前规则列表。


    ### 允许或拒绝流量

    根据特定的端口、服务或 IP 地址允许或拒绝流量。

    允许特定端口的入站流量：

    ```bash

    sudo ufw allow 22

    ```

    拒绝特定端口的入站流量：

    ```bash

    sudo ufw deny 80

    ```

    允许特定服务的流量：

    ```bash

    sudo ufw allow http

    ```

    拒绝来自特定 IP 地址的流量：

    ```bash

    sudo ufw deny from 192.168.1.100

    ```


    ### 日志和监控

    启用日志以监控防火墙活动：

    ```bash

    sudo ufw logging on

    ```

    在 `/var/log/` 目录下查看日志。日志文件通常命名为 `ufw.log`。


    ### 高级 UFW 配置

    对于更高级的配置，直接编辑 UFW 配置文件。编辑 `/etc/ufw/ufw.conf` 修改全局设置。修改 `/etc/ufw/before.rules`
    和 `/etc/ufw/after.rules` 以定义在用户定义规则之前之后应用的规则。


    ## 使用图形界面 GUFW

    GUFW 是 UFW 的图形前端，使防火墙管理更加易用。


    ### 安装 GUFW

    使用以下命令安装 GUFW：

    ```bash

    sudo apt install gufw

    ```


    ### 使用 GUFW

    从应用程序菜单打开 GUFW 并提供密码以访问设置。该界面允许你轻松地启用或禁用防火墙、添加新规则并调整日志级别。


    ## 使用 AppArmor 进行强制性访问控制

    AppArmor 是一个 Linux 安全模块，对应用程序实施强制性访问控制策略。它根据预定义的配置文件限制应用程序可以的操作。


    ### 理解 AppArmor 配置文件


