- fmt: '

    Profiles define the permissions and capabilities of an application. They can operate
    in two modes:


    - **Enforcing Mode**: Fully enforces the security policy.

    - **Complain Mode**: Logs policy violations without enforcing them.


    ## Checking AppArmor Status


    Check the status of AppArmor and its profiles with: `sudo aa-status`


    ## Managing AppArmor Profiles


    Enable or disable specific profiles with: `sudo aa-enforce /etc/apparmor.d/usr.bin.firefox`
    and `sudo aa-disable /etc/apparmor.d/usr.bin.firefox`


    ## Creating Custom Profiles


    Create custom profiles with the `aa-genprof` command.


    Put an application in complain mode: `sudo aa-complain /usr/bin/myapp`


    Run the application to generate logs.


    Create a new profile using `aa-genprof`:


    ```bash

    sudo aa-genprof /usr/bin/myapp

    ```


    Follow the prompts to define the permissions for the application.


    ## Default Security Policies in Ubuntu


    Ubuntu 24.04 includes several default security policies designed to protect your
    system out of the box.


    ### Secure Defaults


    Default settings are configured to provide a secure environment without extensive
    modifications.


    ### Password Policies


    Passwords must be at least six characters long and contain a mix of character
    types. Password expiration policies can be set to enforce periodic password changes.


    ### Automatic Updates


    Regular updates and patches are provided to fix vulnerabilities promptly. Automatic
    updates can be enabled for unattended security updates.


    ### Firewall Rules


    `UFW` is pre-installed and ready to configure firewall rules quickly.


    ## Conclusion


    Configuring firewalls and understanding security policies are critical steps in
    securing your Ubuntu 24.04 system. By leveraging tools like `UFW`, `GUFW`, and
    `AppArmor`, and following secure defaults, you can effectively protect your system
    against unauthorized access and potential threats.


    # 7.3 System Monitoring Tools: Using Built-In Tools for Real-Time Security Monitoring


    System monitoring plays a crucial role in maintaining the security and performance
    of any computer system. Ubuntu 24.04 comes with a variety of built-in tools that
    help you monitor system activity in real time, identify security threats, and
    maintain optimal system health. This sub-chapter will guide you through these
    tools and how to use them effectively for security monitoring.


    ![](image_rsrc3FH.jpg)


    ## The Importance of System Monitoring


    Proactive system monitoring allows you to detect security breaches, identify performance
    bottlenecks, and ensure that your system remains secure and efficient. Real-time
    monitoring tools offer insights into CPU usage, memory consumption, disk activity,
    network traffic, and more.


    ## Key Areas of Monitoring


    To ensure comprehensive security monitoring, consider the following key areas:


    - **Processes**: Monitor running processes to detect unauthorized or malicious
    activities.

    - **System Logs**: Analyze system logs for security events and policy violations.

    - **Network Activity**: Monitor network connections and traffic for suspicious
    activity.

    - **File System Changes**: Track changes to critical files and directories.


    ## Using Graphical Monitoring Tools


    Ubuntu 24.04 provides graphical tools that make it easy to monitor your system
    visually.


    ### GNOME System Monitor


    GNOME System Monitor provides a graphical overview of system resource usage and
    running processes.


    #### Opening System Monitor

    Open "System Monitor" from the Applications menu.


    #### Monitoring Processes

    The "Processes" tab displays all running processes and their resource consumption.
    Sort the processes by CPU, memory, or disk usage to identify resource-intensive
    processes.


    #### Monitoring System Resources

    The "Resources" tab provides graphs for CPU, memory, and network usage. Monitor
    these graphs in real time to identify performance bottlenecks or unusual activity.


    #### Monitoring File Systems

    The "File Systems" tab displays the usage of mounted file systems. Monitor disk
    space usage to ensure that your system doesn''t run out of storage.


    ### Using System Logs


    System logs contain valuable information about system events, login attempts,
    and security violations.


    #### GNOME Logs

    GNOME Logs is a graphical tool for viewing system logs.


    #### Opening GNOME Logs

    Open "Logs" from the Applications menu.


    #### Viewing System Logs

    The "Important" tab displays critical events and errors that need immediate attention.

    The "All" tab shows all system logs, including application logs, security events,
    and hardware issues.


    #### Filtering Logs

    Use the search bar to filter logs based on specific keywords, making it easier
    to find relevant information.


    ## Using Terminal-Based Monitoring Tools


    For those who prefer the terminal, Ubuntu 24.04 offers several powerful command-line
    tools for system monitoring.


    ### HTOP for Process Monitoring


    `htop` is an interactive process viewer that provides detailed information about
    running processes.


    #### Installing HTOP

    Install `htop` with:

    ```bash

    sudo apt install htop

    ```


    #### Using HTOP

    Start `htop` by typing `htop` in the terminal.


    #### Monitoring Processes

    The main interface displays a list of running processes and their resource consumption.

    Use the arrow keys to navigate and `F6` to sort processes by different criteria.

    Press `F3` to search for specific processes and `F9` to kill a process.


    #### Monitoring System Resources

    The bars at the top display CPU and memory usage in real time. Monitor these bars
    to identify performance bottlenecks.


    ### IFTOP for Network Monitoring


    `iftop` is a real-time network bandwidth monitoring tool.


    #### Installing IFTOP

    Install `iftop` with:

    ```bash

    sudo apt install iftop

    ```


    #### Using IFTOP

    Start `iftop` by typing `sudo iftop` in the terminal.


    #### Monitoring Network Traffic

    The main interface displays a list of active network connections and their bandwidth
    usage.

    Use the arrow keys to navigate and `h` for help.

    Monitor inbound and outbound traffic to identify unusual network activity.


    ### Audit Logs with Auditd


    `auditd` is a powerful tool for monitoring system activity and generating audit
    logs.


    #### Installing Auditd

    Install `auditd` with:

    ```bash

    sudo apt install auditd

    ```


    #### Configuring Auditd

    The configuration file is located at `/etc/audit/auditd.conf`.

    Define audit rules in `/etc/audit/rules.d/`.


    #### Monitoring Audit Logs

    View audit logs with:

    ```bash

    sudo ausearch -m avc

    ```

    Generate a summary report with:

    ```bash

    sudo aureport

    ```


    ### Inotifywait for File System Monitoring


    `inotifywait` is a command-line tool for monitoring file system changes.


    #### Installing Inotifywait

    Install `inotifywait` with:

    ```bash

    sudo apt install inotify-tools

    ```


    #### Using Inotifywait

    Monitor a directory for changes with:

    ```bash

    inotifywait -m /path/to/directory

    ```

    Track file creation, deletion, and modification events to detect unauthorized
    changes.


    ### Security Event Monitoring with Fail2Ban


    `fail2ban` protects your system by banning IP addresses that show malicious behavior.


    #### Installing Fail2Ban

    Install `fail2ban` with:

    ```bash

    sudo apt install fail2ban

    ```


    #### Configuring Fail2Ban

    The main configuration file is located at `/etc/fail2ban/jail.conf`.

    Create a copy of the file in `/etc/fail2ban/jail.local` and modify the settings
    as needed.


    #### Monitoring Fail2Ban Logs

    View Fail2Ban logs with:

    ```bash

    sudo cat /var/log/fail2ban.log

    ```

    Check the status of banned IP addresses with:

    ```bash

    sudo fail2ban-client status

    ```


    ## Conclusion


    System monitoring tools in Ubuntu 24.04 provide a comprehensive solution for real-time
    security monitoring. By leveraging graphical tools like GNOME System Monitor and
    command-line utilities like `htop` and `auditd`, you can proactively detect and
    address security threats, ensuring that your system remains secure and efficient.


