- fmt: '

    Networking and connectivity are at the core of the modern computing experience.
    Ubuntu 24.04 provides robust tools and features to ensure seamless network management,
    whether you''re connecting to Wi-Fi, managing a VPN, or troubleshooting connectivity
    issues. By understanding how to use `NetworkManager`, `NMCLI`, and traditional
    networking tools, you''ll be well-equipped to handle any networking challenge.


    # 6.1 Wired and Wireless Networking: Configuring Network Settings for Different
    Types of Connections


    Networking has become an integral part of our digital lives, enabling us to connect,
    collaborate, and access vast amounts of information. Ubuntu 24.04 simplifies networking
    through intuitive tools and flexible configurations, making it easy to set up
    both wired and wireless networks. In this sub-chapter, we''ll explore how to configure
    network settings for different types of connections, helping you establish reliable
    and secure network connections.


    ![](image_rsrc3FB.jpg)


    ## Understanding Network Connections in Ubuntu


    Ubuntu 24.04 leverages `NetworkManager` to manage wired and wireless connections,
    providing a unified framework for handling Ethernet, Wi-Fi, VPN, and mobile broadband
    connections. `NetworkManager` automatically detects network hardware and manages
    IP addressing, making it easier to connect to various networks.


    ## Graphical Network Management with Network Settings


    `Network Settings` is a graphical tool that integrates seamlessly with `NetworkManager`.
    It offers a user-friendly interface for configuring network connections, ensuring
    that both beginners and advanced users can connect effortlessly.


    ### Configuring Wired Networking


    Wired networking, also known as Ethernet, is often preferred for its speed and
    reliability, especially in environments where Wi-Fi signals may be weak or unstable.


    To connect via Ethernet cable, plug an Ethernet cable into your computer''s network
    port. `NetworkManager` will automatically detect the connection and configure
    it using `DHCP` (Dynamic Host Configuration Protocol).


    Access Network Settings by opening "Settings" from the Applications menu and navigating
    to the "Network" tab. Click on the gear icon next to the "Wired" connection. In
    the "IPv4" tab, configure the IP address manually by selecting "Manual" and entering
    the IP address, netmask, and gateway. Alternatively, select "Automatic (DHCP)"
    to obtain an IP address automatically. In the same "IPv4" tab, specify custom
    DNS servers or leave it on "Automatic." Click on the "IPv6" tab and configure
    the settings as needed. Options include "Automatic," "Manual," and "Link-Local
    Only."


    ### Creating Wired Network Profiles


    `NetworkManager` allows you to create multiple profiles for wired connections,
    useful for switching between different networks. Click "Add Profile" in the Network
    Settings panel. Set a name for the profile and configure IP addressing, DNS, and
    other parameters. Apply the profile settings and switch to it whenever necessary.


    ### Configuring Wireless Networking


    Wireless networking, or Wi-Fi, provides flexibility and mobility, making it a
    preferred option for most users. Ubuntu 24.04 simplifies wireless configuration
    with a graphical interface and support for modern Wi-Fi standards.


    Access Network Settings by opening "Settings" from the Applications menu and navigating
    to the "Network" tab. Click on "Wi-Fi" to view available wireless networks. Toggle
    the Wi-Fi switch to "On" if it is disabled. Select your desired network from the
    list of available Wi-Fi networks. Enter the network password if required, and
    you''ll be connected. Click on the gear icon next to the connected Wi-Fi network
    to access the settings. In the "IPv4" tab, select "Manual" to configure the IP
    address manually, or "Automatic (DHCP)" to obtain an IP address automatically.
    In the "IPv4" tab, specify custom DNS servers or leave it on "Automatic." Click
    on the "IPv6" tab and configure the settings as needed.


    ### Managing Wi-Fi Networks


    `NetworkManager` makes it easy to manage multiple Wi-Fi networks. By default,
    `NetworkManager` remembers Wi-Fi networks you''ve connected to, and they will
    appear in the "Known Networks" list. To forget a Wi-Fi network, click on the gear
    icon next to the network name and select "Forget." `NetworkManager` automatically
    connects to the strongest known network, but if you want to prioritize a specific
    network, remove or forget other networks.


    ## Command-Line Network Management with NMCLI


    `NMCLI` (NetworkManager Command-Line Interface) provides a powerful alternative
    for configuring network connections via the terminal.


    To list all available connections:

    ```

    nmcli connection show

    ```


    To activate a wired or wireless connection:

    ```

    nmcli connection up <connection-name>

    ```


    To create a new Ethernet connection manually:

    ```

    nmcli connection add type ethernet con-name <name> ifname <interface-name>

    ```


    To create a new Wi-Fi connection:

    ```

    nmcli device wifi connect <SSID> password <password>

    ```


    ## Network Troubleshooting and Diagnostics


    Network issues can arise due to various factors, and Ubuntu provides several tools
    to diagnose and resolve these issues.


    `ping` checks connectivity between your system and another device. For instance:

    ```

    ping google.com

    ```


    `traceroute` shows the path packets take to reach a destination, helping identify
    where connectivity breaks down:

    ```

    traceroute google.com

    ```


    `NetworkManager` logs often provide valuable insights into network issues. View
    the logs with:

    ```

    journalctl -u NetworkManager

    ```


    ## Conclusion


    Wired and wireless networking are fundamental components of a modern computing
    experience. Ubuntu 24.04 provides intuitive tools like `Network Settings` and
    `NMCLI` to ensure seamless network management. By understanding how to configure
    network settings for different types of connections, you''ll be well-equipped
    to establish reliable and secure network connections.


    # 6.2 VPN and Remote Desktop: Setting up Secure VPNs and Accessing the Desktop
    Remotely


    In an increasingly connected world, Virtual Private Networks (VPNs) and remote
    desktop access are vital tools for secure networking and remote work. Ubuntu 24.04
    offers a suite of built-in tools and third-party applications to help you establish
    secure VPNs and access your desktop from anywhere. This sub-chapter provides comprehensive
    guidance on setting up VPNs and accessing your desktop remotely in Ubuntu 24.04.


    ![](image_rsrc3FC.jpg)


    ## Understanding VPNs and Remote Desktop


    A VPN creates a secure, encrypted tunnel between your device and a remote server,
    masking your IP address and securing your internet connection. It''s essential
    for accessing corporate networks, protecting data on public Wi-Fi, and circumventing
    regional restrictions.


    Remote desktop tools enable you to control a computer from another device over
    the network. Whether you need to assist someone remotely or access your files
    and applications while traveling, remote desktop solutions provide the flexibility
    and convenience you need.


    ## Setting Up VPNs in Ubuntu 24.04


    Ubuntu 24.04 includes built-in support for VPNs through `NetworkManager` and also
    supports third-party VPN clients.


    ### Using NetworkManager for VPNs


    `NetworkManager` is the primary network management tool in Ubuntu and simplifies
    VPN configuration.


    Open "Settings" from the Applications menu and navigate to the "Network" tab.
    Click on "VPN" and then "Add VPN." Choose the desired VPN protocol (OpenVPN, PPTP,
    etc.) or import a VPN configuration file. Fill in the required information like
    gateway, username, and password. Click "Add" to save the configuration and then
    "Connect" to activate the VPN.


    ### OpenVPN


    `OpenVPN` is a popular open-source VPN protocol known for its flexibility and
    security.


    To set up an OpenVPN connection using `NetworkManager`, install the OpenVPN plugin
    for `NetworkManager` with:

    ```

    sudo apt install network-manager-openvpn-gnome

    ```

    '
