- fmt: '

    Before making significant changes to your system, always back up your important
    files. This will prevent data loss in case of accidental formatting or partitioning
    errors. Use an external hard drive or cloud storage service to back up critical
    documents, photos, and other personal files. If you''re currently using another
    operating system, utilize its native backup tool to create a full system image.


    # Creating Installation Media


    To install Ubuntu 24.04, you''ll need a bootable USB drive or DVD with the installation
    image.


    First, visit the official Ubuntu website and download the latest Ubuntu 24.04
    `ISO` file. Ensure you''re downloading the correct version, whether it''s the
    desktop or server edition.


    Next, use software like `Rufus` (Windows) or `Etcher` (Windows, macOS, Linux)
    to create a bootable USB drive. Insert a USB drive with at least 4 GB of space,
    select the Ubuntu `ISO` file, and follow the software''s prompts to write the
    image to the USB.


    If you prefer using a DVD, burn the `ISO` file to a blank DVD using burning software
    like `ImgBurn` (Windows) or `Disk Utility` (macOS).


    # Configuring BIOS/UEFI Settings


    To boot from your installation media, you''ll need to adjust your system''s BIOS/UEFI
    settings.


    Restart your computer and press the BIOS/UEFI access key, often `F2`, `F10`, `Delete`,
    or `Esc`, as soon as the manufacturer''s logo appears. In the BIOS/UEFI settings,
    find the `Boot Order` or `Boot Priority` section. Set `USB` (or `DVD`) as the
    first boot device to ensure the system boots from the installation media.


    Some systems may require `Secure Boot` to be disabled to boot from external media.
    This is common with certain UEFI systems. Look for the `Secure Boot` option and
    disable it if necessary. Save your changes and exit the BIOS/UEFI settings. Your
    computer will restart.


    # Testing the Installation Media


    Before proceeding with a full installation, it''s wise to test your installation
    media to confirm that it''s working correctly.


    Insert your USB or DVD installation media and restart the computer. The system
    should boot into the Ubuntu Live environment, allowing you to try Ubuntu without
    installing it. Ensure that your keyboard, mouse, and other peripherals work as
    expected, and test internet connectivity and graphics compatibility.


    During boot-up, you''ll have the option to verify the installation media. This
    step helps ensure the `ISO` file was downloaded and written correctly.


    # Partitioning and Disk Space Allocation


    If you''re planning a dual-boot setup, installing Ubuntu alongside another OS,
    you''ll need to partition your disk appropriately.


    Use your current OS''s disk management tool to shrink the existing partition,
    freeing up unallocated space for Ubuntu. During the Ubuntu installation process,
    you''ll be able to create partitions manually.


    The recommended partitioning scheme involves a root partition (`/`) that holds
    the OS files and applications, requiring at least 15 to 20 GB of space. The home
    partition (`/home`) stores user files and settings, and you should allocate as
    much space as possible. Swap space acts as virtual memory and should be sized
    according to your RAM (equal to or double the RAM size).


    If you''re dual-booting, ensure that `GRUB`, Ubuntu''s boot loader, is installed
    on the correct drive, typically the primary hard drive.


    # Installation Choices and Options


    When you''re ready to install Ubuntu 24.04, you''ll be guided through various
    installation choices and options.


    Choose between "Erase Disk and Install Ubuntu" for a clean installation or "Install
    Ubuntu Alongside" for a dual-boot setup. Create a username and password for your
    new Ubuntu system, and choose whether to encrypt your home directory for additional
    security.


    Enable automatic updates and select any third-party software, such as proprietary
    drivers and multimedia codecs, to install during the setup. Choose your preferred
    language and keyboard layout before proceeding.


    # Final Installation Steps


    After you''ve made your selections and clicked "Install Now," Ubuntu will begin
    the installation process. The duration depends on your system''s speed and the
    selected options.


    Monitor the progress bar and review the tips and information provided during the
    installation. Once the installation is complete, you''ll be prompted to remove
    the installation media and reboot your system.


    On first boot, you’ll be greeted by the Ubuntu login screen. Enter your credentials
    and start exploring Ubuntu 24.04.


    By following these steps, you''re well-prepared for a successful installation
    of Ubuntu 24.04, ensuring your system is ready to experience the full potential
    of this cutting-edge operating system.


    # Chapter 2: Installation and Initial Setup


    The installation and initial setup of Ubuntu 24.04 mark the beginning of an exciting
    journey into the world of open-source computing. Whether you''re transitioning
    from another operating system or diving into Ubuntu for the first time, this chapter
    will guide you through the entire process, ensuring you have a solid foundation
    for your new digital environment.


    ![](image_rsrc3EU.jpg)


    ## The Joy of Discovery


    There''s something exhilarating about setting up a new operating system. It''s
    like moving into a new home—unfamiliar yet full of potential. Ubuntu 24.04 offers
    a modern, clean interface that immediately invites exploration, whether you''re
    configuring your desktop layout or customizing system settings. But before reaching
    that point, you''ll need to navigate the installation process.


    ## A Welcoming First Step


    Ubuntu is known for its user-friendly installation process. The Ubuntu 24.04 installer
    is designed to be intuitive and accessible, guiding you through each step with
    clarity and simplicity. This ensures that even those unfamiliar with Linux will
    find the process straightforward and stress-free.


    ## A Walkthrough of the Installation


    After creating your bootable USB or DVD and configuring your system''s BIOS/UEFI
    settings to boot from it, the installation process begins. As soon as you see
    the purple Ubuntu loading screen, you''re on your way.


    ### Language Selection and Welcome Screen


    The first screen you''ll encounter lets you choose your preferred language. This
    isn''t just for the installer but will also set the default language for your
    new Ubuntu system. The welcome screen provides two options: "Try Ubuntu" and "Install
    Ubuntu." Trying Ubuntu allows you to explore the system without making any changes
    to your computer, which is great for testing compatibility and familiarizing yourself
    with the interface. However, to install Ubuntu, click on "Install Ubuntu."


    ### Keyboard Layout and Updates


    Next, you''ll select your keyboard layout. If you''re unsure, you can use the
    "Detect Keyboard Layout" option, but most users will find the default option suitable.


    The installer will then offer the option to download updates while installing
    Ubuntu and to install third-party software for graphics, Wi-Fi, and multimedia
    support. It''s highly recommended to enable both options to ensure your system
    is fully updated and equipped with all necessary drivers and codecs.


    ### Installation Type: Making Crucial Choices


    This step is critical as it defines how Ubuntu will coexist with any existing
    operating system or data on your computer.


    For a clean installation with no data to preserve, choose "Erase Disk and Install
    Ubuntu," which will format your entire drive and install Ubuntu as the sole operating
    system. For dual-boot setups, "Install Ubuntu Alongside Another OS" will install
    Ubuntu alongside your current operating system, automatically resizing partitions
    to accommodate both systems. Advanced users can manually partition their disks
    using the "Something Else" option, offering maximum flexibility.


    Once you''ve made your choice, click "Install Now" and confirm your selection.


    ### Time Zone and User Account Setup


    After partitioning your disk, you''ll be prompted to select your time zone, ensuring
    your system clock and calendar applications are accurate.

