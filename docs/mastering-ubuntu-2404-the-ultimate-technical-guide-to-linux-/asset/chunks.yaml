    在系统设置的“无障碍”（Accessibility）部分，你可以开启高对比度主题、屏幕放大镜和屏幕键盘。“大字体”（Large Text）选项会全局增大字体大小以提高可读性。


    自定义键盘导航和粘滞键，为有运动障碍的用户简化打字。启用屏幕阅读器进行听觉导航，或调整音频反馈设置以获得更具包性的体验。


