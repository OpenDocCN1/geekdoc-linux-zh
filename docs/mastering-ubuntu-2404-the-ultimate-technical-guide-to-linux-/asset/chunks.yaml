    在对系统进行重大更改之前，请务必备份您的重要文件。这可以防止在意外格式化或分区错误时导致数据丢失。使用外部硬盘或云存储服务备份关键文档、照片和其他个人文件。如果您目前正在使用其他操作系统，请利用其原生备份工具创建完整的系统映像。


    # 创建安装介质


    要安装 Ubuntu 24.04，您需要一个带有安装镜像的可启动 USB 驱动器或 DVD。


    首先，访问 Ubuntu 官方网站并下载最新的 Ubuntu 24.04 `ISO` 文件。请确保您下载的是正确的版本，无论是桌面版还是服务器版。


    接下来，使用 `Rufus`（Windows）或 `Etcher`（Windows、macOS、Linux）等软件创建可启动的 USB 驱动器。插入一个空间至少有
    4 GB 的 USB 驱动器，选择 Ubuntu `ISO` 文件，并按照软件提示将镜像写入 USB 驱动器。


    如果您倾向于使用 DVD，请使用 `ImgBurn`（Windows）或磁盘 Utility（macOS）等刻录软件将 `ISO` 文件刻录到空白 DVD
    上。


    # 配置 BIOS/UEFI 设置


    要从您的安装介质启动，您需要调整系统的 BIOS/UEFI 设置。


    重启电脑，并在厂商标志出现后立即按下 BIOS/UEFI 访问键，通常为 `F2`、`F10`、`Delete` 或 `Esc`。在 BIOS/UEFI 设置中，找到“Boot
    Order”（启动顺序）或“Boot Priority”（启动优先级）部分。将 `USB`（或 `DVD`）设置为第一个启动设备，确保系统从安装介质启动。


    某些系统可能需要禁用“Secure Boot”（安全启动）才能从外部介质启动。这在某些 UEFI 系统上很常见。寻找 `Secure Boot` 并在必要时禁用它。保存更改并退出
    BIOS/UEFI 设置。您的电脑将重启。


    # 测试安装介质


    在进行完整安装之前，测试安装介质以确认其运行正常是明智之举。


    插入您的 USB 或 DVD 安装介质并重启电脑。系统应启动到 Ubuntu Live 环境，让您可以在不安装系统的情况下尝试 Ubuntu。确保您的键盘、鼠标和其他外围设备工作正常，并测试网络连接和显卡兼容性。


    在启动过程中，您将获得验证安装介质的选项。此步骤有助于确保 `ISO` 文件已正确下载并写入。


    # 分区与磁盘空间分配


    如果您计划建立双系统环境（即在另一个操作系统旁边安装 Ubuntu），您需要对磁盘进行适当分区。


    使用您当前操作系统的磁盘管理工具缩小现有分区，为 Ubuntu 释放出未分配空间。在 Ubuntu 安装过程中，您可以手动创建分区。


    推荐的分区方案包括一个根分区（`/`），用于存放操作系统文件和应用程序，至少需要 15 到 20 GB 的空间。主目录分区（`/home`）存储用户文件和设置，您应该尽可能分配空间。交换空间（Swap
    space）作为虚拟内存，应根据您的 RAM 大小进行设置（等于或双于 RAM 大小）。


    如果您运行的是双系统，请确保 `GRUB`（Ubuntu 的引导加载程序）安装在正确的驱动器，通常是主硬盘。


    # 安装选择与选项


    当您准备好安装 Ubuntu 24.04 时，系统将引导您完成各种安装选择和选项。


    请选择“擦除磁盘并安装 Ubuntu”以进行全新安装，或选择“在磁盘旁边安装 Ubuntu”以进行双系统设置。为您的新 Ubuntu 系统创建用户名和密码，并选择是否加密您的主目录以增加安全性。


    启用自动更新，并选择在设置期间安装的任何第三方软件（例如专有驱动程序和多媒体解码器）。在继续之前，选择您偏好的语言和键盘布局。


    # 最终安装步骤


    在您做出选择并点击“现在安装”后，Ubuntu 将开始安装过程。持续时间取决于系统速度和所选选项。


    监控进度条，并查看安装过程中提供的提示和信息。安装完成后，系统会提示您移除安装介质并重启系统。


    在首次启动时，您将看到 Ubuntu 登录界面。输入您的凭据开始探索 Ubuntu 24.04。


    通过遵循这些步骤，您已为成功安装 Ubuntu 24.04 做好了充分准备，确保您的系统准备好体验这款尖端操作系统的全部潜力。


    # 第 2 章：安装与初始设置


    Ubuntu 24.04 的安装和初始设置标志着通往开源计算世界兴奋之旅的开始。无论您是从另一个操作系统迁移，还是第一次尝试 Ubuntu，本章都将引导您完成整个过程，确保为您的新数字环境打下坚实基础。


    ![](img/image_rsrc3EU.jpg)


    ## 发现的快乐


    设置一个新的操作系统是一件令人兴奋的事。这就像搬进新家——陌生却充满潜力。Ubuntu 24.04 提供了一个现代、整洁的界面，能够立即吸引人们探索，无论您是在配置桌面布局还是自定义系统设置。但在到达那一步之前，您需要完成安装过程。


    ## 亲切的第一步


    Ubuntu 以其用户友安装过程而闻名。Ubuntu 24.04 安装程序设计得直观且易于使用，以清晰简单的方式引导您完成每一步。这确保即使是不熟悉 Linux
    的人也会发现该过程简单且无压力。


    ## 安装过程详解


    在创建了可启动的 USB 或 DVD 并配置了系统的 BIOS/UEFI 设置从其启动后，安装过程便开始了。一旦您看到紫色的 Ubuntu 加载界面，就说明已经上路。


    ### 语言选择与欢迎界面


    您遇到的第一个界面让您选择偏好的语言。这不仅用于安装程序，也将作为您新 Ubuntu 系统的默认语言。欢迎界面提供了两个选项：“尝试 Ubuntu”和“安装
    Ubuntu”。尝试 Ubuntu 允许您在不对电脑进行任何更改的情况下探索系统，这对于测试兼容性和熟悉界面非常有帮助。然而，要安装 Ubuntu，请点击“安装
    Ubuntu”。


    ### 键盘布局与更新


    接下来，您将选择键盘布局。如果您不确定，可以使用“检测键盘布局”选项，但大多数用户会发现默认选项适用。


    安装程序随后会提供在安装 Ubuntu 的同时下载更新并安装图形、Wi-Fi 和多媒体第三方软件的选项。建议启用这两个选项，以确保系统完全更新并配备了所有必要的驱动程序和解码器。


    ### 安装类型：关键选择


    此步骤至关重要，因为它定义了 Ubuntu 如何与计算机上的任何现有操作系统或数据共存。


    对于无须保留数据的全新安装，选择“擦除磁盘并安装 Ubuntu”，这将格式化整个磁盘并将 Ubuntu 作为唯一的操作系统。对于双系统设置，“在其他操作系统旁边安装
    Ubuntu”将在您的当前操作系统旁边安装 Ubuntu，自动调整分区以容纳两个系统。高级用户可以使用“其他”选项手动对磁盘进行分区，提供最大的灵活性。


    一旦做出选择，点击“现在安装”并确认您的选择。


    ### 时区与用户账户设置


    分区磁盘后，系统将提示您选择时区，以确保系统时钟和日历应用程序准确无误。


    '
- fmt: '

    Next, you''ll create your user account. Enter your name, a username, and a strong
    password. You can choose to log in automatically or require a password each time
    you log in, and there''s also an option to encrypt your home folder, providing
    an additional layer of security for your files.


    # The Installation Process


    With your preferences set, the installer will now copy files to your system and
    configure everything according to your choices. This process can take anywhere
    from 10 to 30 minutes, depending on your hardware and the installation options
    selected.


    During this time, you''ll see informative slides showcasing some of the new features
    and improvements in `Ubuntu 24.04`. These slides offer a glimpse into what''s
    possible with your new system, from productivity applications to gaming and multimedia
    capabilities.


    ## First Boot and Welcome Screen


    Once the installation is complete, you''ll be prompted to remove your installation
    media and restart your computer. On the first boot, you''ll be greeted by the
    Ubuntu login screen. Enter your credentials and step into your freshly installed
    `Ubuntu 24.04` environment.


    The initial login will present a Welcome screen designed to help you get started
    quickly. It offers options to connect to your online accounts, integrate your
    `Google`, `Microsoft`, or `Nextcloud` accounts for seamless access to emails,
    calendars, and files. You can enable `Canonical`''s `Livepatch` service to apply
    critical kernel security updates without rebooting, and adjust privacy settings
    to control how much information your system shares, such as location and usage
    data. The Welcome screen also provides guidance on software management, explaining
    how to install new applications through `Ubuntu Software` and `Snap Store`.


    ## Customizing Your System


    Once you''ve completed the initial setup, it''s time to make Ubuntu your own.
    This involves customizing the desktop environment, configuring network settings,
    and installing additional software.


    `Ubuntu 24.04` uses the `GNOME` desktop environment, which is highly customizable.
    You can tweak your desktop for a personalized experience by changing the wallpaper,
    resizing and moving the dock, and using `GNOME Extensions` and themes to radically
    alter the look and feel of your desktop.


    Configuring your network settings ensures you''re connected and secure. Most Ethernet
    and Wi-Fi connections will be detected automatically, but you can manually configure
    network options via the "Settings" menu. `Ubuntu 24.04` comes with a comprehensive
    suite of pre-installed software, including `Firefox` for browsing, `LibreOffice`
    for productivity, and `Thunderbird` for email. However, you may want to install
    additional software to meet your specific needs. `Ubuntu Software` provides a
    curated selection of applications and updates, while the `Snap Store` offers universal
    Linux packages that include all dependencies, making them ideal for cross-platform
    applications. Advanced users can use the terminal to access `APT`, `Ubuntu`''s
    package manager, the quickest way to install software and manage updates.


    # Final Thoughts


    The installation and initial setup of `Ubuntu 24.04` are designed to be smooth
    and user-friendly, reflecting Ubuntu''s commitment to accessibility. Once completed,
    you''re free to explore the full potential of your new system, whether that''s
    developing software, managing servers, or simply enjoying a modern and secure
    computing environment.


    `Ubuntu 24.04` provides a stable foundation with endless possibilities for customization
    and innovation. Take your time to explore, customize, and embrace the freedom
    of open-source computing.


    # 2.1 Creating a Bootable USB: Step-by-step Guide to Create a USB Installer


    The journey to installing `Ubuntu 24.04` begins with creating a bootable USB drive.
    This USB installer will be your gateway to the new Ubuntu experience, allowing
    you to install or try Ubuntu without affecting your current operating system.
    In this sub-chapter, we''ll walk through the process of creating a bootable USB
    drive step by step, ensuring you have everything ready for a smooth installation.


    ![](image_rsrc3EV.jpg)


    ## Understanding the Importance of a Bootable USB


    A bootable USB drive is essentially a portable storage device that contains all
    the files necessary to install an operating system. Unlike older installation
    media like CDs and DVDs, USB drives offer faster read/write speeds and are more
    portable. By creating one for `Ubuntu 24.04`, you''ll have a reusable tool for
    future installations or system recovery.


    ## What You''ll Need


    Before diving into the creation process, ensure you have the following:


    - A computer with an active internet connection.

    - A USB drive with a capacity of at least 4 GB (preferably 8 GB or more).

    - Access to software for creating a bootable USB drive.

    - The `Ubuntu 24.04` ISO file.


    ## Downloading the Ubuntu 24.04 ISO File


    The first step in creating your bootable USB is to download the official `Ubuntu
    24.04` ISO file. Visit the official Ubuntu website, navigate to the Downloads
    section, and select the version you need. Ensure you''re downloading the correct
    version, whether it''s the desktop or server edition.


    Click on the download link and save the ISO file to a convenient location on your
    computer. The file size is around 3 GB, so the download may take some time depending
    on your internet speed.


    ## Choosing the Right Software for Creating a Bootable USB


    Depending on your current operating system (`Windows`, `macOS`, or `Linux`), you''ll
    need different software to create your bootable USB.


    ### For Windows Users


    Windows users can use `Rufus`, a lightweight and user-friendly application designed
    specifically for creating bootable USB drives. It''s open-source and doesn''t
    require installation, making it a convenient choice.


    Download `Rufus` from its official website and launch the application. You''ll
    see a simple interface with options for selecting your USB drive, the ISO file,
    and other settings.


    ### For macOS Users


    On `macOS`, `Balena Etcher` is a popular and straightforward tool. It''s also
    available for `Windows` and `Linux`, making it versatile if you work across multiple
    platforms.


    Download `Balena Etcher` from its official website, install it, and open the application.
    Its clean, intuitive interface will guide you through the bootable USB creation
    process.


    ### For Linux Users


    If you''re already using `Linux`, you can create a bootable USB directly from
    the terminal or use GUI tools like `Startup Disk Creator` (included with Ubuntu)
    or `Balena Etcher`.


    ## Creating the Bootable USB with Rufus (Windows)


    Insert your USB drive into your computer and launch `Rufus`. In the "Device" section,
    select your USB drive from the drop-down list. Click the "Select" button next
    to "Boot selection" and locate the `Ubuntu 24.04` ISO file you downloaded. Leave
    the "Partition scheme" and "File system" options at their default settings (`MBR`
    and `FAT32`, respectively). Click "Start." `Rufus` will prompt you to download
    additional files if needed. Accept and proceed. Confirm that you want to format
    the USB drive, which will erase all existing data on it. `Rufus` will create the
    bootable USB drive. The process may take several minutes.


    ## Creating the Bootable USB with Balena Etcher (macOS and Linux)


    Insert your USB drive into your computer and launch `Balena Etcher`. Click "Flash
    from file" and select the `Ubuntu 24.04` ISO file. Click "Select target" and choose
    your USB drive. Click "Flash" to begin the process. If prompted, enter your system
    password to authorize the operation. `Balena Etcher` will create the bootable
    USB drive, which may take several minutes.


    ## Creating the Bootable USB with Startup Disk Creator (Ubuntu)


    Insert your USB drive into your Ubuntu system. Open `Startup Disk Creator` from
    the Applications menu. Click "Other" and select the `Ubuntu 24.04` ISO file. Ensure
    your USB drive is selected as the "Disk to use." Click "Make Startup Disk" to
    start the process. Confirm the format warning and proceed.


    ## Testing the Bootable USB

    '
