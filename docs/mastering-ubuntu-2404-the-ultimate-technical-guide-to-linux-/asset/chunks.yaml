  trans: "\n网络和连接性是现代计算体验的核心。Ubuntu 24.04 提供了强大的工具和功能，以确保无缝的网络管理，无论您是连接 Wi-Fi、管理 VPN\
    \ 还是排排除连接性问题。通过了解如何使用 `NetworkManager`、`NMCLI` 和传统的网络工具，您将能够从容地应对任何网络挑战。\n\n#\
    \ 6.1 有线和无线网络：为不同类型的连接配置网络设置\n\n网络已成为我们数字生活中不可或的一部分，使我们能够连接、协作并访问海信息。Ubuntu 24.04\
    \ 通过直观的工具和灵活的配置简化了网络设置，使得设置有线和无线网络变得简单。在本节中，我们将探索如何为不同类型的连接配置网络设置，帮助您建立可靠且安全的网络连接。\n\
    \n![](img/image_rsrc3FB.jpg)\n\n## 理解 Ubuntu 中的网络连接\n\nUbuntu 24.04 利用 `NetworkManager`\
    \ 来管理有线和无线连接，为处理以太网、Wi-Fi、VPN 和移动宽带连接提供了统一的框架。`NetworkManager` 会自动检测网络硬件并管理 IP\
    \ 地址，使得连接到各种网络变得更加容易。\n\n 使用 使用“设置”进行图形化网络管理\n\n`Network Settings` 是一个与 `NetworkManager`\
    \ 无缝集成的图形化工具。它为配置网络连接提供了一个用户友界面，确保初学者和高级用户都能轻松地连接。\n\n### 配置有线网络\n\n有线网络（也称为以太网）通常因其速度和可靠性而被青睐，特别是在\
    \ Wi-Fi 信号可能微弱或不稳定的环境中。\n\n要通过以太网线连接，请将以太网线插入电脑的网络端口。`NetworkManager` 将自动检测连接并使用\
    \ `DHCP`（动态主机配置协议）进行配置。\n\n通过从应用程序菜单打开“设置”并导航到“网络”选项卡访问网络设置。点击“有线”连接旁齿轮图标。在“IPv4”选项卡中，通过选择“手动”并输入\
    \ IP 地址、子网掩码和网关来手动配置 IP 地址。或者选择“自动 (DHCP)”自动获取 IP 地址。在同一个“IPv4”选项卡中，指定自定义 DNS\
    \ 服务器或保持“自动”。点击“IPv6”选项卡并根据需要配置设置。选项包括“自动”、“手动”和“仅本地链路”。\n\n### 创建有线网络配置文件\n\n\
    `NetworkManager` 允许您为有线连接创建多个配置文件，适用于在不同网络之间切换。在网络设置面板中点击“添加配置”。为配置设置名称，并配置 IP\
    \ 地址、DNS 和其他参数。应用配置设置并在必要时切换到该配置。\n\n### 配置无线网络\n\n无线网络（或 Wi-Fi）提供了灵活性和移动性，是大多数用户的首选。Ubuntu\
    \ 24.04 通过图形化界面和对现代 Wi-Fi 标准的支持简化了无线配置。\n\n通过从应用程序菜单打开“设置”并导航到“网络”选项卡访问网络设置。点击“Wi-Fi”查看可用的无线网络。如果\
    \ Wi-Fi 开关已禁用，请将其切换到“开启”。从可用的 Wi-Fi 网络列表中选择您所需的网络。如果需要，输入网络密码，您即可完成连接。点击已连接 Wi-Fi\
    \ 网络旁边的齿轮图标以访问设置。在“IPv4”选项卡中，选择“手动”来手动配置 IP 地址，或选择“自动 (DHCP)”自动获取 IP 地址。在“IPv4”选项卡中，指定自定义\
    \ DNS 服务器或保持“自动”。点击“IPv6”选项卡并根据需要配置设置。\n\n### 管理 Wi-Fi 网络\n\n`NetworkManager`\
    \ 能够轻松地管理多个 Wi-Fi 网络。默认情况下，`NetworkManager` 会记住您连接过的 Wi-Fi 网络，它们将出现在“已知网络”列表中。要忘记某个\
    \ Wi-Fi 网络，请点击网络名称旁边的齿轮图标并选择“忘记”。`NetworkManager` 会自动连接到最强的已知网络，但如果您想优先考虑某个特定网络，请删除或忘记其他网络。\n\
    \n## 使用 NMCLI 进行命令行网络管理\n\n`NMCLI`（NetworkManager 命令行界面）为通过终端配置网络连接提供了一个强大的替代方案。\n\
    \n列出所有可用连接：\n```\nnmcli connection show\n```\n\n激活有线或无线连接：\n```\nnmcli connection\
    \ up <connection-name>\n```\n\n手动创建一个新的以太网连接：\n```\nnmcli connection add type\
    \ ethernet con-name <name> ifname <interface-name>\n```\n\n创建一个新的 Wi-Fi 连接：\n\
    ```\nnmcli device wifi connect <SSID> password <password>\n```\n\n## 网络故障排除和诊断\n\
    \n网络问题可能由于各种因素引起，Ubuntu 提供了多种工具来诊断和解决这些问题。\n\n`ping` 检查系统与另一个设备之间的连接性。例如：\n```\n\
    ping google.com\n```\n\n`traceroute` 显示数据包到达目的地经过的路径，帮助识别连接在哪里中断：\n```\ntraceroute\
    \ google.com\n```\n\n`NetworkManager` 日志通常提供有关网络问题的价值见解。通过以下命令查看日志：\n```\njournalctl\
    \ -u NetworkManager\n```\n\n## 结论\n\n有线和无线网络是现代计算体验的基础组成部分。Ubuntu 24.04 提供了如 `Network\
    \ Settings` 和 `NMCLI` 等直观工具来确保无缝的网络管理。通过了解如何为不同类型的连接配置网络设置，您能够建立可靠且安全的网络连接。\n\n\
    # 6.2 VPN 和远程桌面：设置安全的 VPN 并远程访问桌面\n\n在日益连接的世界中，虚拟专用网络 (VPN) 和远程桌面访问是安全网络和远程工作的重要工具。Ubuntu\
    \ 24.04 提供了一系列内置工具和第三方应用程序，帮助您建立安全的 VPN 并从任何地方访问您的桌面。本节提供了关于在 Ubuntu 24.04 中设置\
    \ VPN 和远程访问桌面的全面指南。\n\n![](img/image_rsrc3FC.jpg)\n\n## 理解 VPN 和远程桌面\n\nVPN 在您的设备和远程服务器之间建立一个安全的加密隧道，掩盖您的\
    \ IP 地址并保护您的互联网连接。它对于访问公司网络、保护公共 Wi-Fi 上的数据以及绕过区域限制至关重要。\n\n远程桌面工具允许您通过网络从另一个设备控制计算机。无论您是需要远程协助他人还是在旅行期间访问文件和应用程序，远程桌面解决方案都能提供您所需的灵活和便利。\n\
    \n## 在 Ubuntu 24.04 中设置 VPN\n\nUbuntu 24.04 通过 `NetworkManager` 对 VPN 的内置支持，并支持第三方\
    \ VPN 客户端。\n\n### 使用 NetworkManager 使用 VPN\n\n`NetworkManager` 是 Ubuntu 中主要的网络管理工具，并简化了\
    \ VPN 配置。\n\n从应用程序菜单打开“设置”并导航到“网络”选项卡。点击“VPN”然后点击“添加 VPN”。选择所需的 VPN 协议（OpenVPN、PPTP\
    \ 等）或导入 VPN 配置文件。填写必要信息，如网关、用户名和密码。点击“添加”保存配置，然后点击“连接”激活 VPN。\n\n### OpenVPN\n\
    \n`OpenVPN` 是一种流行的开源 VPN 协议，以其灵性和安全性著称。\n\n要使用 `NetworkManager` 设置 OpenVPN 连接，请通过以下命令安装\
    \ `NetworkManager` 的 OpenVPN 插件：\n```\nsudo apt install network-manager-openvpn-gnome\n\
    ```\n"
- fmt: '

    Download the OpenVPN configuration file from your VPN provider. Open "Settings"
    and navigate to "Network." Click "VPN," then "Add VPN," and select "Import from
    file." Choose the downloaded OpenVPN configuration file. Fill in the required
    details like username and password. Click "Add" to save the configuration and
    then "Connect."


    ## Third-Party VPN Clients


    While `NetworkManager` supports many VPN protocols, some users prefer third-party
    clients for specific VPN services.


    ### ProtonVPN


    ProtonVPN is a popular privacy-focused VPN service that offers a native client
    for Linux.


    To install and use the ProtonVPN client, add the ProtonVPN repository to your
    system with:

    ```

    sudo add-apt-repository ''deb https://repo.protonvpn.com/debian stable main''

    ```


    Download and install the ProtonVPN client:

    ```bash

    sudo apt install protonvpn

    ```


    Launch the ProtonVPN client from the terminal with:

    ```

    protonvpn

    ```


    Log in with your ProtonVPN credentials and connect to a server.


    ### NordVPN


    NordVPN is another leading VPN service that provides a native client for Linux.


    To install and use the NordVPN client, download the NordVPN installation package
    from their website. Install the package with:

    ```bash

    sudo apt install ./nordvpn-release_1.0.0_all.deb

    ```


    Update the package list and install NordVPN:

    ```bash

    sudo apt update

    sudo apt install nordvpn

    ```


    Launch the NordVPN client from the terminal with:

    ```

    nordvpn

    ```


    Log in with your NordVPN credentials and connect to a server.


    ## Accessing the Desktop Remotely


    Ubuntu 24.04 supports several remote desktop protocols and applications, making
    it easy to access your desktop from anywhere.


    ### Remote Desktop Protocol (RDP)


    RDP is a proprietary protocol developed by Microsoft but is widely supported in
    Linux through third-party clients.


    ### Using Remmina for RDP


    Remmina is a powerful remote desktop client that supports RDP, VNC, SSH, and more.


    Install Remmina using:

    ```

    sudo apt install remmina remmina-plugin-rdp

    ```


    Launch Remmina from the Applications menu. Click "New Connection" and choose "RDP"
    as the protocol. Fill in the server address, username, and password. Click "Save
    and Connect."


    ### Virtual Network Computing (VNC)


    VNC is an open-source remote desktop protocol that allows you to control another
    computer''s desktop.


    ### Using Vino for VNC


    Vino is the built-in VNC server in Ubuntu.


    Open "Settings" from the Applications menu and navigate to "Sharing." Enable "Screen
    Sharing." Set a password for secure access and take note of the IP address or
    hostname to connect remotely.


    ### Connecting to a VNC Server with Remmina


    Launch Remmina from the Applications menu. Click "New Connection" and choose "VNC"
    as the protocol. Fill in the server address and password. Click "Save and Connect."


    ### SSH for Remote Desktop Access


    Secure Shell (SSH) provides command-line access to remote servers but can also
    forward graphical applications over the network.


    ### Enabling SSH Access


    Install the OpenSSH server:

    ```bash

    sudo apt install openssh-server

    ```


    Start and enable the SSH service:

    ```bash

    sudo systemctl start ssh

    sudo systemctl enable ssh

    ```


    Connect to the server using an SSH client:

    ```

    ssh <username>@<server-ip-address>

    ```


    ### X11 Forwarding


    X11 Forwarding allows graphical applications to be displayed over an SSH connection.


    Enable X11 Forwarding in the SSH server configuration file:

    ```bash

    sudo nano /etc/ssh/sshd_config

    ```


    Uncomment and set the following line to "yes":

    ```

    X11Forwarding yes

    ```


    Restart the SSH service:

    ```bash

    sudo systemctl restart ssh

    ```


    Connect to the server with X11 Forwarding enabled:

    ```

    ssh -X <username>@<server-ip-address>

    ```


    Run graphical applications like `gedit` or `nautilus` from the command line.


    ## Conclusion


    Setting up secure VPNs and accessing your desktop remotely in Ubuntu 24.04 is
    straightforward, thanks to the built-in tools and third-party applications available.
    Whether you''re protecting your data with a VPN or managing a server via remote
    desktop, Ubuntu provides a comprehensive suite of solutions that cater to various
    needs.


    ## 6.3 Troubleshooting Network Issues: Diagnosing and Resolving Common Networking
    Problems


    Network connectivity issues can arise from a multitude of factors, ranging from
    hardware failures to software misconfigurations. Diagnosing and resolving these
    issues is crucial for maintaining productivity and a seamless online experience.
    Ubuntu 24.04 offers a variety of tools and techniques to help you identify and
    fix common networking problems. This sub-chapter will guide you through the steps
    of troubleshooting network issues effectively.


    ![](image_rsrc3FD.jpg)


    ### Understanding the Nature of Network Issues


    Before diving into specific tools and commands, it''s essential to understand
    the nature of network issues. Some of the most common networking problems include
    no network connectivity, intermittent connectivity, slow network speeds, and the
    inability to access specific websites or services.


    ### Initial Diagnostics and Checks


    Start with basic diagnostic checks to quickly identify the problem''s scope and
    nature.


    ### Check Network Connections and Hardware


    Ensure that all cables are securely connected if you''re using a wired connection.
    For wireless connections, verify that Wi-Fi is enabled and that you''re within
    range of your access point. Restart your router and modem to rule out temporary
    connectivity issues. Additionally, check if other devices connected to the same
    network are experiencing similar problems.


    ### Restart Network Services


    Restarting network services can resolve many common issues.


    Restart `NetworkManager` using this command:

    ```bash

    sudo systemctl restart NetworkManager

    ```


    Alternatively, restart the networking service directly using:

    ```bash

    sudo systemctl restart networking

    ```


    ### Check IP Address Assignment


    Verify that your computer has obtained an IP address from the router. Run the
    following command to display IP address information:

    ```bash

    ip address show

    ```


    Look for the network interface connected to the network and confirm it has an
    IP address assigned.


    ### Testing Network Connectivity with Ping


    The `ping` command tests basic network connectivity between your computer and
    another device or website.


    Ping your router to ensure local network connectivity:

    ```bash

    ping -c 4 <router-ip-address>

    ```


    Ping an external website like Google to confirm internet connectivity:

    ```bash

    ping -c 4 google.com

    ```


    If the `ping` command returns "Destination Host Unreachable" or "Request Timed
    Out," there might be an issue with your network configuration or internet connection.


    ### Traceroute for Network Path Analysis


    `traceroute` displays the path packets take to reach a destination, helping identify
    where connectivity breaks down.


    Install `traceroute` if it''s not already installed:

    ```bash

    sudo apt install traceroute

    ```


    Run a `traceroute` to a website to identify potential network bottlenecks:

    ```bash

    traceroute google.com

    ```


    Examine the output to see where packets are being dropped or delayed.


    ### Checking DNS Configuration


    Domain Name System (DNS) translates domain names into IP addresses. Misconfigured
    or unavailable DNS servers can lead to an inability to access specific websites.


    Verify your DNS configuration with:

    ```bash

    systemd-resolve --status

    ```


    Ensure that your DNS servers are correctly listed under "DNS Servers." You can
    also edit the DNS settings in `NetworkManager` or manually modify the `/etc/resolv.conf`
    file.


    ### NetworkManager Logs and Diagnostics


    `NetworkManager` manages most network connections in Ubuntu. Reviewing its logs
    can provide valuable insights into networking problems.


    View `NetworkManager` logs with:

    ```bash

    journalctl -u NetworkManager

    ```


    Examine the output for errors or warnings related to network connections.


    ### Diagnosing with NMCLI


    `NMCLI` (NetworkManager Command-Line Interface) provides a powerful tool for diagnosing
    network issues.


    List all network connections and their status:

    ```bash

    nmcli connection show

    ```


    Check the status of network devices:

    ```bash

    nmcli connection show <connection-name>

    ```


    Display detailed information about a specific connection:

    ```bash

    nmcli connection show <connection-name>

    ```


