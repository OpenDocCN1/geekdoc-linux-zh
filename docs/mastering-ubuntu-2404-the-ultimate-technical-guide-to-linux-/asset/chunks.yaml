- fmt: "\n# Server Roles Overview\n\n- **Web Server**: Hosts websites and web applications,\
    \ often using software like `Apache` or `Nginx`.\n- **Database Server**: Manages\
    \ databases with software like `MySQL`, `PostgreSQL`, or `MongoDB`.\n- **File\
    \ Server**: Provides shared storage for files and directories using protocols\
    \ like `NFS` or `Samba`.\n- **Mail Server**: Handles email delivery and reception,\
    \ using software like `Postfix` or `Dovecot`.\n- **DNS Server**: Resolves domain\
    \ names to IP addresses, managed with software like `BIND`.\n- **Proxy Server**:\
    \ Acts as an intermediary between clients and servers to enhance security and\
    \ performance.\n\n# Choosing the Right Server Edition\n\nUbuntu offers multiple\
    \ editions suitable for different server environments:\n\n- **Ubuntu Server**:\
    \ The standard edition, ideal for most server roles.\n- **Ubuntu Cloud**: Optimized\
    \ for cloud computing with `OpenStack` support.\n- **Ubuntu Core**: A lightweight\
    \ edition designed for IoT devices and containers.\n\n# Initial Server Setup\n\
    \nProper initial setup lays the foundation for secure and efficient server management.\n\
    \n## Basic Configuration\n\n### **Update the System**: Keep the system updated\
    \ to ensure it has the latest security patches and features.\n```\nsudo apt update\
    \ && sudo apt upgrade\n```\n\n### **Set the Hostname**: Set a recognizable hostname\
    \ for the server.\n```bash\nsudo hostnamectl set-hostname <new-hostname>\n```\n\
    \n### **Configure Time Zone and NTP**: Ensure accurate time synchronization with\
    \ `NTP`.\n```bash\nsudo timedatectl set-timezone <time-zone>\nsudo apt install\
    \ ntp\nsudo systemctl enable ntp\n```\n\n## Secure SSH Access\n\nSecure Shell\
    \ (`SSH`) provides remote access to servers. Securing SSH access is crucial.\n\
    \n### **Change the Default SSH Port**: Modify the default port (`22`) to a less\
    \ common port.\n```bash\nsudo nano /etc/ssh/sshd_config\n```\nChange Port `22`\
    \ to a port like `2200` and restart SSH:\n```bash\nsudo systemctl restart ssh\n\
    ```\n\n### **Disable Root Login**: Prevent direct root login via SSH.\n```bash\n\
    sudo nano /etc/ssh/sshd_config\n```\nChange `PermitRootLogin` to `no` and restart\
    \ SSH.\n\n### **Enable Public Key Authentication**: Use SSH keys instead of passwords\
    \ for authentication.\n```bash\nssh-keygen -t rsa -b 4096\n```\nAdd the public\
    \ key to `~/.ssh/authorized_keys` on the server.\n\n# Setting Up a Web Server\n\
    \nA web server is one of the most common server roles. Ubuntu 24.04 supports `Apache`\
    \ and `Nginx` as popular web server options.\n\n## Installing Apache\n\nInstall\
    \ Apache with:\n```bash\nsudo apt install apache2\n```\nEnable and start the Apache\
    \ service:\n```bash\nsudo systemctl enable apache2\nsudo systemctl start apache2\n\
    ```\n\n## Configuring Virtual Hosts\n\n`Apache` uses virtual hosts to serve multiple\
    \ websites from a single server.\n\nCreate a virtual host configuration file:\n\
    ```bash\nsudo nano /etc/apache2/sites-available/example.com.conf\n```\nAdd the\
    \ following content:\n```apache\n<VirtualHost *:80>\n    ServerAdmin admin@example.com\n\
    \    ServerName example.com\n    DocumentRoot /var/www/example.com\n    ErrorLog\
    \ ${APACHE_LOG_DIR}/error.log\n    CustomLog ${APACHE_LOG_DIR}/access.log combined\n\
    </VirtualHost>\n```\nEnable the virtual host:\n```bash\nsudo a2ensite example.com.conf\n\
    sudo systemctl restart apache2\n```\nCreate the document root directory:\n```bash\n\
    sudo mkdir -p /var/www/example.com\n```\n\n## Installing Nginx\n\nInstall Nginx\
    \ with:\n```bash\nsudo apt install nginx\n```\nEnable and start the Nginx service:\n\
    ```bash\nsudo systemctl enable nginx\nsudo systemctl start nginx\n```\n\n## Configuring\
    \ Server Blocks\n\nServer blocks are the `Nginx` equivalent of `Apache` virtual\
    \ hosts.\n\nCreate a server block configuration file:\n```bash\nsudo nano /etc/nginx/sites-available/example.com\n\
    ```\nAdd the following content:\n```nginx\nserver {\n    listen 80;\n    server_name\
    \ example.com;\n    root /var/www/example.com;\n    index index.html index.htm;\n\
    \    location / {\n        try_files $uri $uri/ =404;\n    }\n    error_log /var/log/nginx/example.com_error.log;\
    \ \n    access_log /var/log/nginx/example.com_access.log;\n}\n```\nEnable the\
    \ server block:\n```bash\nsudo ln -s /etc/nginx/sites-available/example.com /etc/nginx/sites-enabled/\n\
    sudo systemctl restart nginx\n```\nCreate the document root directory:\n```bash\n\
    sudo mkdir -p /var/www/example.com\n```\n\n# Setting Up a Database Server\n\n\
    Database servers store and manage data efficiently. `MySQL` and `PostgreSQL` are\
    \ popular choices.\n\n## Installing MySQL\n\nInstall MySQL with:\n```bash\nsudo\
    \ apt install mysql-server\n```\nSecure the installation:\n```bash\nsudo mysql_secure_installation\n\
    ```\n\n## Creating a Database and User\n\nLog into the `MySQL` shell:\n```bash\n\
    sudo mysql\n```\nCreate a new database and user:\n```sql\nCREATE DATABASE example_db;\n\
    CREATE USER 'example_user'@'localhost' IDENTIFIED BY 'password';\nGRANT ALL PRIVILEGES\
    \ ON example_db.* TO 'example_user'@'localhost';\nFLUSH PRIVILEGES;\n```\n\n##\
    \ Installing PostgreSQL\n\nInstall PostgreSQL with:\n```bash\nsudo apt install\
    \ postgresql postgresql-contrib\n```\n\n## Creating a Database and User\n\nLog\
