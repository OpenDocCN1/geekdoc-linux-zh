    ## 第三方 VPN 客户端


    虽然 NetworkManager 支持许多 VPN 协议，但某些用户更倾向于使用特定的 VPN 服务第三方客户端。


    ### ProtonVPN


    ProtonVPN 是一种流行的注重隐私的 VPN 服务，为 Linux 提供了原生客户端。


    要安装并使用 ProtonVPN 客户端，请通过以下命令将 ProtonVPN 存储添加到你的系统：

    ```

