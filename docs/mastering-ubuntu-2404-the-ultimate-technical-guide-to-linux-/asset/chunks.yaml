    目录下找到额外的软件源信息。


    # 基本 APT 命令


    要在终端中开始使用 APT，你需要了解一些基础命令。


    ### 更新软件包列表


    在安装或升级软件包之前，请更新软件包列表以确保你获取的是最新版本：


    ```bash

    sudo apt update

    ```


    ### 升级已安装的软件包


    将所有安装的软件包升级到最新版本：


    ```bash

    sudo apt upgrade

    ```


    若要仅更新关键系统组件，请使用：


    ```bash

    sudo apt dist-upgrade

    ```


    ### 安装软件包


    使用 `install` 命令安装特定软件包。将 `<package-name>` 替换为所需软件包的名称：`sudo apt install <package-name>`


    例如，安装 GIMP 图像编辑器：


    ```bash

    sudo apt install gimp

    ```


    你也可以通过在同一命令中列出所有软件包来同时安装多个程序：`sudo apt install gimp vlc firefox`


    ### 移除软件包


    使用 `remove` 命令卸载软件包：


    ```bash

    sudo apt remove <package-name>

    ```


    例如，移除 GIMP：`sudo apt remove gimp`


    如果你想将软件包及其配置文件一起删除，请使用 `purge` 命令：`sudo apt purge <package-name>`


    ### 搜索软件包


    使用 `search` 命令通过名称或关键词查找软件包：`apt search <keyword>`


    例如，搜索视频编辑器：`apt search video editor`


    # 高级 APT 命令与技巧


    一旦你熟悉了基础操作，就可以探索更高级的 APT 命令来于软件包管理。


    ### 锁定与取消锁定软件包


    有有时，你可能希望防止软件包被更新。如果由于兼容性或稳定性原因需要特定版本，这种方法会非常有用。


    锁定软件包：`sudo apt-mark hold <package-name>`


    取消锁定软件包：`sudo apt-mark unhold <package-name>`


    ### 清理未使用的软件包


    随着软件的安装和删除，未使用的软件包可能会积累。可以安全地删除这些残留软件包以释放磁盘空间。


    要移除不需要的软件包及其依赖，请使用 `autoremove` 命令：`sudo apt autoremove`


    要清除缓存的软件包文件，请使用 `clean` 命令：


    ```bash

    sudo apt clean

    ```


    ### 管理 PPA 和第三方软件源


    个人软件包存档 (PPAs) 和第三方软件源提供了 Ubuntu 官方仓库中未提供的软件访问。


    #### 添加 PPA


    要添加 PPA，请使用 `add-apt-repository` 命令：


    ```bash

    sudo add-apt-repository ppa:<ppa-name>

    sudo apt update

    ```


    例如，添加 LibreOffice PPA：


    ```bash

    sudo add-apt-repository ppa:libreoffice/ppa

    sudo apt update

    ```


    #### 移除 PPA


    要移除 PPA，请配合 `add-apt-repository` 使用 `--remove` 标记：`sudo add-apt-repository --remove
    ppa:<ppa-name>`


    #### 列出已安装的软件源


    要列出所有已安装的软件源，请使用 `apt policy` 命令：`apt policy`


    # 使用脚本自动化软件包管理


    使用终端进行软件管理的最大优势之一是通过脚本自动化任务。


    ### 创建简单的安装脚本


    创建一个脚本来安装一系列软件包：


    1. 创建一个以 `.sh` 扩展的新文件：`nano install-software.sh`

    2. 在文件中添加以下行：

    ```bash

    #!/bin/bash

    sudo apt update

    sudo apt install -y gimp vlc firefox

    ```

    3. 保存并关闭文件（Ctrl+O，然后 Ctrl+X）。

    4. 赋予脚本可执行权限：`chmod +x install-software.sh`

    5. 运行脚本：`./install-software.sh`


    # 结语


    在 Ubuntu 24.04 中通过终端安装软件为高效且强大的软件包管理开启了可能。通过掌握 APT 命令和高级技巧，你将对系统拥有更大的控制力，实现任务并维护优化的软件环境。


    # 4.3 Snap 和 Flatpak 应用程序：使用 Snap 和 Flatpak 安装和管理应用程序


    Ubuntu 24.04 与之前的版本一样完全采用了通用 Linux 打包格式的概念，使用户可以在不同的 Linux 发行版中一致地安装应用程序。Snap
    和 Flatpak 是两种主要的通用打包格式，旨在解决依赖管理和发行碎片化的挑战。


    ![](img/image_rsrc3F5.jpg)


    ## 理解 Snap 和 Flatpak


    在深入安装和管理 Snap 和 Flatpak 应用程序之前，理解它们各自独特的特性至关重要。


    ### Snap 应用程序


    Snap 由 Canonical（Ubuntu 背后的公司）开发，是一种包含所有必要依赖的打包格式，允许应用程序在多个 Linux 发行版上一致运行。Snap
    应用程序（也称为 Snaps）具有：


    - **自包含性**：Snap 包含了所有所需的库，确保跨发行版的行为一致性。

    - **沙箱化**：每个 Snap 运行在隔离的环境中，增强了安全性并防止对系统文件的干扰。

    - **自动更新**：Snap 直接从 Snap Store 接收自动更新。


    ### Flatpak 应用程序


    Flatpak 由 Free Desktop 项目开发，旨在为通用打包提供类似的解决方案。与 Snap 类似，Flatpak 应用程序封装了它们的依赖并运行在沙箱环境中。Flatpak
    的主要特性包括：


    - **跨发行兼容性**：Flatpak 包（也称为 Flatpaks）在多个 Linux 发行版上运行一致。

    - **运行时环境**：Flatpak 使用公共运行时环境，减少了冗余和下载大小。

    - **沙箱化**：Flatpak 与系统文件隔离以提高安全性。


    ## 在 Ubuntu 24.04 上设置 Snap 和 Flatpak


    Ubuntu 24.04 预装了 Snap，使其能够开箱即用。Flatpak 需要一次性的安装和设置。


    ### 安装 Snap


    Snap 已经集成到 Ubuntu 中，但通过更新 `snapd` 软件包确保你拥有最新版本：


    ```bash

    sudo apt update

    sudo apt install snapd

    ```


    你可以通过检查版本来确认安装：


    ```bash

    snap version

    ```


    ### 安装 Flatpak


    Ubuntu 未预装 Flatpak，因此你需要手动安装它。使用以下命令安装 Flatpak 并添加 Flathub 仓库（Flatpak 应用程序的主要来源）：


    ```bash

    sudo apt install flatpak

    sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

    ```


    通过检查版本验证安装：


    ```bashflatpak --version

    ```


    ## 查找和安装 Snap 和 Flatpak 应用程序


    Snap 和 Flatpak 都有大量的仓库，包含从生产力工具到游戏的数千个应用程序。


    ### 使用 Snap Store


    Snap Store 以 Ubuntu 软件中心的图形界面形式存在，但你也可以通过终端访问它。


    #### 搜索 Snap 应用程序


    使用 `snap find` 命令通过名称或关键词搜索 Snap 应用程序：


    ```bash

    snap find <keyword>

    ```


    例如，搜索视频编辑器：`snap find video editor`


    #### 安装 Snap 应用程序


    使用 `snap install` 命令安装 Snap 应用程序：`sudo snap install <application-name>`


    例如，安装 VLC 媒体播放器：


    ```bash

    sudo snap install vlc

    ```


    #### 探索推荐 Snap


    要直接从终端浏览推荐的 Snap，请使用 `snap info` 命令：`snap info <application-name>`


    ### 使用 Flathub 仓库


    Flathub 是 Flatpak 应用程序的中央仓库，提供了跨类别的广泛软件。


    #### 搜索 Flatpak 应用程序


    直接在终端中使用 `flatpak search` 命令搜索 Flatpak 应用程序：`flatpak search <keyword>`


    例如，搜索图像编辑器：`flatpak search image editor`


    #### 安装 Flatpak 应用程序


    使用 `flatpak install` 命令安装 Flatpak 应用程序：`flatpak install flathub <application-id>`


    例如，安装 GIMP（一种流行的图像编辑器）：


    ```bash

    flatpak install flathub org.gimp.GIMP

    ```


    #### 浏览 Flathub 网站


