    系统性能问题可能由高 CPU 或内存占用、磁盘 I/O 瓶颈以及网络拥塞引起引起。


    ## 使用 GNOME 系统监控器


    GNOME 系统监控器提供了系统资源使用的图形化概览。


    - 从应用程序菜单打开“系统监控器”（System Monitor）。

    - 在“资源”（Resources）选项卡中查看 CPU、内存和网络使用。

    - 在“进程”（Processes）选项卡中识别资源密集型进程。


    ## 使用 HTOP


    `htop` 是一个监控资源使用的交互式进程查看器。


    使用以下命令安装 `htop`：

    ```

    sudo apt install htop

    ```


    启动 `htop` 并识别资源密集型进程：

    ```

    htop

    ```


    ## 结论


    理解系统日志和精通诊断技术是高级系统管理员至关重要的技能。通过有效分析系统日志并使用 `journalctl`、`logwatch` 和 `htop` 等工具，你可以快速诊断并解决常见的系统问题，确保系统的最佳性能和安全性。


    ## 8.3 进程与资源管理：监控和管理运行进程


    进程和资源管理是高级系统管理不可或缺的一部分。高效地管理运行进程可以确保你的系统运行流畅、应用程序性能最优，并且资源得到有效分配。Ubuntu 24.04
    提供了一系列图形化和命令行工具，用于监控和管理进程及资源。


    ![](img/image_rsrc3FN.jpg)


    ### 进程与资源管理的重要性


    监控和管理进程对于以下任务至关重要：


    - 识别影响系统性能的资源密集应用程序

    - 解决由挂起或无响应进程引起的问题

    - 优化系统资源，确保 CPU、内存和磁盘使用的平衡

    - 维护系统的稳定性和安全性


    ### 理解进程和系统资源


    进程是运行程序的一个实例。每个进程都有关联的进程 ID（`PID`）、一个父进程以及一组资源分配（CPU、内存等）。


    #### 关键系统资源


    - **CPU 使用率**：衡量每个进程使用的处理器时间。

    - **内存使用率**：包括运行进程使用的 RAM 和交换空间（swap space）。

    - **磁盘 I/O**：衡量对磁盘的读写操作。

    - **网络使用率**：跟踪通过网络发送和接收的数据。


    ### 使用图形化工具监控和管理进程


    Ubuntu 24.04 提供了易于用户的图形化工具，简化了进程管理。


    #### GNOME 系统监控器


    GNOME 系统监控器提供了一个全面的图形化界面，用于监控和管理系统资源。


    **打开 GNOME 系统监控器**

    从应用程序菜单打开“系统监控器”。


    **监控进程**

    在“进程”（Processes）选项卡中，你可以查看所有运行进程并按 CPU、内存或磁盘使用率对它们进行排序。


    要杀死进程：

    - 右键点击该进程并选择“杀死”（Kill）。

    - 确认操作以终止进程。


    **监控系统资源**

    “资源”（Resources）选项卡显示 CPU、内存和网络使用的实时图表。监控这些图表以识别资源密集型应用程序。


    **监控文件系统**

    “文件系统”（File Systems）选项卡提供了挂载文件系统磁盘使用的概览。监控磁盘空间使用情况以防止存储瓶颈。


    ### 使用 HTOP 进行进程管理


    `htop` 是一个交互式进程查看器和系统监控器，比默认的 `top` 命令提供更详细的信息。


    **安装 HTOP**

    使用以下命令安装 `htop`：

    ```

    sudo apt install htop

    ```


    **使用 HTOP**

    在终端中输入 `htop` 启动 `htop`。


    **导航 HTOP**

    - 使用方向键在进程列表中导航。

    - 按 `F6` 按 CPU 或内存使用率等标准对进程排序。

    - 按 `F3` 按名称或 `PID` 搜索特定进程。

    - 按 `F9` 杀死进程。


    **在 HTOP 中监控系统资源**

    在屏幕顶部，你可以监控实时 CPU、内存和交换空间的使用。进程列表显示了每个运行进程的资源消耗。


    ### 使用命令行工具进行进程管理


    对于高级系统管理员，命令行工具提供了管理运行进程和资源的强大方法。


    #### 使用 ps 命令


    `ps` 命令列出运行中的进程并提供有关它们状态的信息。


    **列出所有运行进程**

    使用以下命令列出所有运行进程：

    ```

    ps aux

    ```


    **按名称过滤进程**

    使用以下命令查找匹配特定的进程：

    ```

    ps aux | grep <process-name>

    ```

    将 `<process-name>` 替换为你搜索的进程名称。


    #### 使用 top 命令


    `top` 命令提供对运行进程和资源使用的实时监控。


    **启动 top**

    在终端中输入 `top` 启动 `top`。


    **导航 top**

    - 使用方向键在进程列表中导航。

    - 按 `M` 按内存使用率对进程排序。

    - 按 `P` 按 CPU 使用率对进程排序。

    - 按 `K` 通过输入其 `PID` 来杀死进程。


    #### 使用 kill 命令


    `kill` 命令通过向进程发送特定信号来终止进程。


    **终止进程**

    使用 `PID` 终止进程：

    ```

    kill <PID>

    ```


    **发送特定信号**

    向进程发送特定信号：

    ```

    kill -s SIGTERM <PID>

    ```

    将 `<PID>` 替换为进程 ID，并将 `SIGTERM` 替换为所需的信号。


    常用信号包括：

    - `SIGTERM`：优雅地终止进程。

    - `SIGKILL`：强制终止进程。


    #### 使用 pkill 和 killall


    `pkill` 和 `killall` 是按名称终止进程的方便命令。


    **使用 pkill 按名称终止进程**

    ```

    pkill <process-name>

    ```


    **使用 killall 终止所有匹配名称的进程**

    ```

    killall <process-name>

    ```


    #### 使用 nice 和 renice 进行优先级


    `nice` 和 `renice` 用于调整运行进程的优先级，允许你控制它们获取 CPU 时间。


    **以特定优先级启动进程**

    使用 `nice` 以特定优先级启动进程：

    ```

    nice -n <priority> <command>

    ```

    将 `<priority>` 替换为 -20（最高优先级）到 19（最低优先级）之间的值。例如：

    ```

    nice -n 10 tar -czf /backup/my_backup.tar.gz /home/username

    ```


    **更改现有进程的优先级**

    使用 `renice` 更改现有进程的优先级：

    ```

    renice <priority> -p <PID>

    ```


    ### 监控资源


    除了进程，有效的系统管理还需要监控 CPU、内存、磁盘和网络使用。


    **使用 IOTOP 监控磁盘 I/O**


    `iotop` 是一个监控进程磁盘 I/O 的命令行工具。


    **安装 IOTOP**

    安装 `iotop`：

    ```

    sudo apt install iotop

    ```


    **使用 IOTOP**

    启动 `iotop`：

    ```

    sudo iotop

    ```

    监控每个运行进程的磁盘读写活动。


    **使用 IFTOP 监控网络使用**


    `iftop` 监控实时网络流量并显示带宽使用。


    **安装 IFTOP**

    安装 `iftop`：

    ```

    sudo apt install iftop

    ```


    **使用 IFTOP**

    启动 `iftop`：

    ```

    sudo iftop

    ```

    监控活动连接的网络流量并识别高带宽进程。


    ## 结论


    进程和资源管理是高级系统管理员的必备技能。通过精通 GNOME 系统监控器、`htop`、`ps`、`top`、`iotop` 和 `iftop` 等工具，你可以有效地监控和管理运行进程，确保系统稳定高效运行。


    ## 第 9 章：服务器设置与管理


    在数字领域，服务器是在线服务和企业网络的骨干。无论是托管网站、管理数据库还是提供关键应用程序，服务器都需要仔细的设置和管理以确保可靠性、安全性和性能。Ubuntu
    24.04 凭借其强大的服务器版本和丰富的功能，为服务器部署和管理提供了理想平台。


    本章提供了在 Ubuntu 24.04 中进行服务器设置和管理的全面介绍。通过掌握这里讨论的概念和工具，你将能够构建、配置和维护高效的服务器。


    ![](img/image_rsrc3FP.jpg)


    ### 理解服务器角色和架构


    服务器的角色决定了它提供的特定服务。常见的服务器角色包括：


