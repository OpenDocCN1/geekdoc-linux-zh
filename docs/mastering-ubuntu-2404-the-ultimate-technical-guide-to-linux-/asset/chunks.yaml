    ```\n\n## 创建数据库和用户\n\n登录 `PostgreSQL` 壳：\n```bash\nsudo -u postgres psql\n```\n\
    创建一个新数据库和用户：\n```sql\nCREATE DATABASE example_db;\nCREATE USER example_user WITH\
    \ ENCRYPTED PASSWORD 'password';\nGRANT ALL PRIVILEGES ON DATABASE example_db\
    \ TO example_user;\n```\n\n# 结论\n\n设置和管理服务器是高级管理员的一项关键任务。无论是在配置 Web 服务器、数据库服务器还是其他服务，在\
    \ Ubuntu 24.04 中精通服务器管理都需要周密的规划、安全实践以及对服务器角色的深入理解。\n\n"
