    The thumbnail cache stores previews of images, videos, and documents for quick
    access in file managers. Over time, this cache can grow significantly. Clear the
    thumbnail cache using the following command:


    ```bash

    rm -rf ~/.cache/thumbnails/*

    ```


    # Managing Logs and Temporary Files


    System logs and temporary files can also contribute to disk usage. Log rotation
    and manual cleanup help manage these files.


    ## Log Rotation with Logrotate


    `logrotate` is a built-in tool that manages system logs by rotating, compressing,
    and archiving them. `logrotate` is configured through the file `/etc/logrotate.conf`
    and the directory `/etc/logrotate.d/`. Ensure your log rotation settings are appropriate
    for your system.


    ## Manual Cleanup of Log Files


    Logs can also be cleared manually. Be careful not to delete essential logs required
    for troubleshooting. To clear system logs, use: `sudo rm -rf /var/log/*.log`


    ## Managing Temporary Files


    Temporary files are stored in the `/tmp` directory. These files can be safely
    removed if not in use. To clear temporary files, use: `sudo rm -rf /tmp/*`


    # Optimizing System Performance


    In addition to disk cleanup, performance optimization can significantly improve
    your computing experience.


    ## Managing Startup Applications


    Applications that start automatically can increase boot time and consume system
    resources. Manage startup applications using `Stacer` or the built-in "Startup
    Applications" tool.


    Open "Startup Applications" from the Applications menu and disable unnecessary
    startup applications by unchecking them.


    ## Adjusting Swappiness


    `swappiness` controls how aggressively the system swaps memory pages to disk.
    A lower swappiness value reduces swap usage, which can improve performance.


    To adjust swappiness, check the current swappiness value with: `cat /proc/sys/vm/swappiness`


    Temporarily change the value to `10` (recommended for desktops) using: `sudo sysctl
    vm.swappiness=10`


    To make the change permanent, add or edit the following line in `/etc/sysctl.conf`:
    `vm.swappiness=10`


    Apply the changes using: `sudo sysctl -p`


    ## Using Preload to Speed Up Application Launches


    `preload` is a daemon that analyzes your application usage patterns and preloads
    frequently used applications into memory, reducing startup times.


    Install and start `preload` with the following commands:


    ```bash

    sudo apt install preload

    sudo systemctl enable preload

    sudo systemctl start preload

    ```


    # Monitoring System Resources


    Monitoring system resources helps identify performance bottlenecks and optimize
    resource usage.


    ## GNOME System Monitor


    GNOME System Monitor provides a graphical overview of system resource usage. Open
    GNOME System Monitor from the Applications menu and explore the "Resources" tab
    to monitor CPU, memory, and network usage. The "Processes" tab shows active processes
    and their resource consumption.


    ## Top and Htop


    For terminal users, `top` and `htop` provide real-time monitoring of system processes.
    Open a terminal and start `top` using: `top`


    Or, if `htop` is installed: `htop`


    # Final Thoughts


    Disk cleanup and system optimization are essential for maintaining high performance
    and a smooth computing experience. By leveraging built-in tools like Disk Usage
    Analyzer, `Stacer`, and `APT` commands, you can reclaim valuable disk space and
    improve system efficiency.


    Optimizing startup applications, adjusting swappiness, and using `preload` further
    enhance performance, ensuring your Ubuntu 24.04 system remains responsive and
    enjoyable to use.


    # 5.3 System Backups and Recovery: Creating Backups and Restoring the System in
    Case of Failure


    Creating system backups and implementing a solid recovery plan are essential practices
    for safeguarding your data and ensuring business continuity. In Ubuntu 24.04,
    you can leverage several built-in and third-party tools to create comprehensive
    backups and restore your system efficiently in case of failure. This sub-chapter
    will explore various methods for creating backups and provide step-by-step instructions
    for restoring your system when needed.


    ![](image_rsrc3F9.jpg)


    ## The Importance of System Backups and Recovery


    Data loss can occur due to hardware failure, software corruption, accidental deletion,
    or cyber-attacks. Having a reliable backup and recovery plan helps mitigate these
    risks and provides several key benefits. Protecting data integrity ensures that
    critical files and system configurations can be recovered. Business continuity
    minimizes downtime and productivity loss. Peace of mind reduces anxiety associated
    with potential data loss.


    ## Backup Strategies


    Different backup strategies offer varying levels of protection. Consider your
    data recovery requirements and implement the appropriate strategy. Full backups
    create a complete backup of the entire system or specified directories. Incremental
    backups capture changes made since the last full or incremental backup, saving
    storage space. Differential backups back up changes since the last full backup,
    offering a middle ground between full and incremental backups.


    ## Built-In Backup Tools


    Ubuntu 24.04 includes powerful built-in tools for creating backups and restoring
    data.


    ### Deja Dup: Simple Backup Tool


    `Deja Dup`, also known as "Backups," is a user-friendly tool that simplifies the
    backup process with scheduled backups, encryption, and support for local and cloud
    storage.


    Open the Backups application from the Applications menu. Click "Folders to Save"
    and add the directories you want to back up. Click "Folders to Ignore" to exclude
    specific directories from the backup. Select the backup location (e.g., local
    folder, external drive, or cloud storage) by clicking "Storage Location." Enable
    "Scheduling" to set the backup frequency (daily, weekly, or monthly). Click "Overview"
    and then "Back Up Now" to start the initial backup.


    ### Restoring Backups with Deja Dup


    Restoring backups with `Deja Dup` is straightforward. Open the Backups application
    and click "Restore." Select the backup location and date from which you want to
    restore. Choose the files or directories to restore. Click "Restore" and confirm
    the location where the data will be restored.


    ### Timeshift: System Snapshot Tool


    `Timeshift` creates incremental system snapshots, allowing you to restore your
    system to a previous state in case of failure. It’s particularly useful for recovering
    from system upgrades, configuration changes, and application installations.


    Install `Timeshift` using the following command: `sudo apt install timeshift`


    To configure `Timeshift`, open it from the Applications menu and select the snapshot
    type (`RSYNC` or `BTRFS`). Choose the location where the snapshots will be stored
    (external drive recommended). Configure the snapshot schedule (daily, weekly,
    or monthly), then click "Finish" to complete the setup.


    ### Creating and Restoring Snapshots with Timeshift


    To create a snapshot manually, open `Timeshift` and click "Create." `Timeshift`
    will create an incremental snapshot based on the last backup. Restoring a snapshot
    involves opening `Timeshift`, selecting the desired snapshot, and clicking "Restore."


    ## Advanced Backup Tools


    For advanced users and system administrators, consider using tools like `rsync`
    and `Clonezilla`.


    ### Rsync: Flexible Command-Line Backup Tool


    `rsync` is a command-line tool that provides flexible options for creating backups
    and synchronizing files between directories or network locations. To create a
    full backup of your home directory to an external drive: `rsync -avh --delete
    /home/username/ /media/username/ExternalDrive/Backup/`


    This command synchronizes the contents of your home directory to the external
    drive, removing any files in the destination that no longer exist in the source.


    ### Clonezilla: Disk Cloning and Imaging


    `Clonezilla` is a disk cloning tool that creates full disk images, suitable for
    bare-metal recovery and disk migration. Download `Clonezilla` from the official
    website and create a bootable USB drive using tools like `Rufus` or `Balena Etcher`.

