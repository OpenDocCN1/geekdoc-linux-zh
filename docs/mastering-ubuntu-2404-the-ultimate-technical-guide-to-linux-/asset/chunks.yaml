    # 10.2 系统性能问题：识别性能瓶颈与优化资源使用


    系统性能问题可能以多种形式出现，例如应用响应时间缓慢、CPU 或内存占用率高以及服务无响应等。识别性能瓶颈并优化资源使用对于维护 Ubuntu 24.04
    系统的稳定与高效至关重要。


    ![](img/image_rsrc3FW.jpg)


    ## 理解系统资源与性能指标


    系统性能依赖于关键资源的有效利用：


    - **CPU 使用率**：衡量处理器消耗的时间所占百分比。

    - **内存占用率**：跟踪物理 RAM 和交换分区（swap）的使用情况。

    - **磁盘 I/O**：测量对磁盘的读写操作。

    - **网络流量**：监控通过网络发送和接收的数据。


    ### 关键性能指标


    - **负载平均（Load Average）**：表示运行和等待状态的进程平均数量。

    - **CPU 使用率**：在用户、系统和空闲模式下消耗 CPU 时间百分比。

    - **内存占用率**：RAM 和交换空间的使用百分比。

    - **磁盘 I/O**：到磁盘设备的读写速度。

    - **网络带宽**：网络接口进出的数据传输率。


    ## 诊断性能瓶颈


    ### 使用 HTOP 监控系统性能


    `htop` 提供了一个交互式的实时系统性能视图。


    安装 `htop`：

    ```bash

    sudo apt install htop

    ```


    启动 `htop`：

    ```bash

    htop

    ```


    #### HTOP 中的关键指标


    - **负载平均**：显示在屏幕左上角。

    - **CPU 使用率**：可视化的 CPU 使用进度条。

    - **内存占用率**：RAM 和交换分区的使用进度条。

    - **进程列表**：按 CPU 或内存占用率排序。


    ### 优化 CPU 使用率


    - 识别 CPU 使用率高的进程及其进程 ID (`PIDs`)。

    - 如有必要，停止或重启资源密集型进程。

    ```bash

    sudo kill -9 <PID>

    ```

    - 使用 `renice` 调整进程的优先级：

    ```bash

    sudo renice <priority> -p <PID>

    ```


    ### 优化内存占用率


    - 识别内存占用率高的进程。

    - 重启内存密集型应用程序或服务。

    ```bash

    sudo systemctl restart <service-name>

    ```

    - 清除缓存内存：

    ```bash

    sudo sysctl -w vm.drop_caches=3

    ```


    ### 使用 IOTOP 监控磁盘 I/O


    `iotop` 帮助识别导致高磁盘活跃的进程。


    安装 `iotop`：

    ```bash

    sudo apt install iotop

    ```


    启动 `iotop`：

    ```bash

    sudo iotop

    ```


    - 监控每个进程的磁盘读/写活动。

    - 如有必要，停止导致过度磁盘 I/O 的进程。


    ### 使用 IFTOP 监控网络流量


    `iftop` 提供实时的网络流量监控。


    安装 `iftop`：

    ```bash

    sudo apt install iftop

    ```


    启动 `iftop`：

    ```bash

    sudo iftop

    ```


    - 监控入站和出口的网络流量。

    - 停止或限制导致过度网络流量的进程。


    ### 使用系统监器进行图形化监控


    GNOME 系统监器（System Monitor）提供了系统性能的图形化概览。


    - 从应用程序菜单打开“系统监器”。

    - 在“资源”选项卡中查看实时的 CPU、内存和网络使用。

    - 在“进程”选项卡中识别资源密集型进程。


    ## 优化系统性能


    ### 调整系统交换倾向（Swappiness）


    Swappiness 决定了系统使用交换分区的积极程度。


    检查当前的 swappiness 值：

    ```bash

    cat /proc/sys/vm/swappiness

    ```


    降低该值以减少交换分区的使用（例如 10）：

    ```bash

    sudo sysctl -w vm.swappiness=10

    ```


    通过编辑 `/etc/sysctl.conf` 使更改永久生效：

    ```bash

    sudo nano /etc/sysctl.conf

    ```

    添加行：

    ```text

    vm.swappiness = 10

    ```


    ### 启用磁盘写入缓存


    磁盘写入缓存可以提高磁盘写入性能。


    检查是否启用写入缓存：

    ```bash

    sudo hdparm -W /dev/sda

    ```

    将 `/dev/sda` 替换为您的磁盘设备。


    如有必要，启用写入缓存：

    ```bash

    sudo hdparm -W1 /dev/sda

    ```


    ### 优化网络性能


    #### 调整网络缓冲区大小


    增加 TCP 缓冲区大小以提高网络吞吐量。


    编辑 `/etc/sysctl.conf`：

    ```bash

    sudo nano /etc/sysctl.conf

    ```

    添加以下行：

    ```text

    net.core.rmem_max = 16777216 net.core.wmem_max = 16777216 net.ipv4.tcp_rmem =
    4096 87380 16777216 net.ipv4.tcp_wmem = 4096 65536 16777216

    ```


    应用更改：

    ```bash

    sudo sysctl -p

    ```


    #### 禁用未使用的网络接口


    禁用未使用的网络接口以减少资源消耗。


    列出网络接口：

    ```bash

    ip link show

    ```


    禁用接口：

    ```bash

    sudo ip link set <interface-name> down

    ```

    将 `<interface-name>` 替换为要禁接口名称。


    ### 优化应用程序和服务的性能


    #### 使用 systemd 管理服务


    `systemd` 允许您管理和优化系统服务。


    列出所有运行的服务：

    ```bash

    systemctl list-units --type=service --state=running

    ```


    停止不需要的服务：

    ```bash

    sudo systemctl stop <service-name>

    ```


    禁用服务以防止其在启动时启动：

    ```bash

    sudo systemctl disable <service-name>

    ```


    #### 配置应用程序缓存


    启用应用级缓存以减少磁盘和网络 I/O。


    - **Web 服务器**：为 Apache 启用 `mod_cache` 模块或为 Nginx 启用 `proxy_cache`。

    - **数据库**：对频繁访问的数据使用内存中缓存。


    ## 结论


    系统性能问题会显著影响生产力和用户体验。通过理解关键性能指标、诊断瓶颈并应用优化技术，您可以确保您的 Ubuntu 24.04 系统保持稳定、高效和响应迅速。


    # 10.3 常见错误与解决方案：通过实用方案解决常见问题


    Ubuntu 24.04 像任何复杂的操作系统一样，偶尔可能会出现干扰正常运行的错误或问题。理解这些错误的性质并知道如何高效解决它们可以节省时间并减少挫败感。


    ![](img/image_rsrc3FX.jpg)


    ### 损坏包或依赖错误


    问题：由于依赖关系损坏无法安装或更新包。


    解决方案：


    更新包列表：

    ```bash

    sudo apt update

    ```


    尝试修复损坏的包：

    ```bash

    sudo apt --fix-broken install

    ```


    移除软件包：

    ```bash

    sudo apt remove <package>

    ```


    清理包缓存和配置文件：

    ```bash

    sudo apt clean

    sudo apt autoremove

    ```


    ### apt-get 锁


    问题：`apt-get` 因其他进程持有锁而返回“无法获取锁”。


    解决方案：


    识别持有锁的进程：

    ```bash

    ps aux | grep apt

    ```


    杀死该进程：

    ```bash

    sudo kill -9 <PID>

    ```


    如有必要，删除锁文件：

    ```bash

    sudo rm /var/lib/dpkg/lock

    sudo rm /var/lib/apt/lists/lock

    ```


    ### GRUB 引导加载程序错误


    问题：GRUB 显示“找不到文件”或“找不到分区”。


    解决方案：


    进入恢复模式或使用 Live USB。


    挂载根分区：

    ```bash

    sudo mount /dev/sda1 /mnt

    ```

    将 `/dev/sda1` 替换为您的根分区。


    进入文件系统：

    ```bash

    for i in /dev /dev/pts /proc /sys /run; do sudo mount -B $i /mnt$i; done sudo
    chroot /mnt

    ```


    重新安装 GRUB：

    ```bash

    grub-install /dev/sda

    update-grub

    ```


    退出 chroot 并重启：

    ```bash

    exit

    sudo reboot

    ```


    ### 网络连接问题


    问题：无法连接互联网或本地网络。


    解决方案：


    检查网络接口：

    ```bash

    ip link show

    ```


    重启网络服务：

    ```bash

    sudo systemctl restart NetworkManager

    sudo systemctl restart networking



    验证 DNS 配置：

    ```bash

    systemd-resolve --status

    ```


    使用 ping 测试连接：

    ```bash

    ping -c 4 google.com

    ```


    ### 无声音或音频问题


    问题：没有声音输出或未识别音频设备。


    解决方案：


    使用 `alsamixer` 检查音频设备和音量设置：

    ```bash

    alsamixer

    ```


    确保选择了正确的音频设备：

    ```bash

    pavucontrol

    ```


    重启 PulseAudio 服务：

    ```bash

    pulseaudio -k;pulseaudio --start

    ```


    重新安装 ALSA 和 PulseAudio：

    ```bash

    sudo apt reinstall alsa-base pulseaudio

    ```


    ### 应用程序崩溃或错误


    问题：应用程序频繁崩溃或显示错误。


    解决方案：


    检查 `/var/log/` 或应用程序目录下的日志。

    ```bash

    less /var/log/apache2/error.log

    ```


    以调试模式启动应用程序获取详细错误信息。


    重新安装或更新应用程序：

    ```bash

    sudo apt update

    sudo apt install --reinstall <application-name>

    ```


    确保有足够的系统资源：

    ```bash

    htop

    ```


    ### 显示问题（分辨率或多显示器）


    问题：显示分辨率错误或未检测到外部显示器。



