    接下来，你将创建用户账户。输入你的姓名、用户名和强密码。你可以选择自动登录，或在每次登录时需要密码，此外还有一个加密主文件夹的选项，这为你的文件提供了额外的安全层保护。


    # 安装过程


    设置好偏好后，安装程序现在会将文件复制到你的系统，并根据你的选择配置所有内容。此过程可能需要 10 到 30 分钟不等，取决于你的硬件配置和选择的安装选项。


    在此期间，你将看到一些信息介绍性的幻灯片，展示 `Ubuntu 24.04` 的一些新功能和改进。这些幻灯片将让你一览你的新系统可以实现的功能，从生产力应用到游戏和多媒体功能应有有。


    ## 首次启动与欢迎界面


    安装完成后，系统将提示你移除安装介质并重启电脑。在首次启动时，你将看到 Ubuntu 登录界面。输入凭据进入你新安装的 `Ubuntu 24.04` 环境。


    初始登录将显示一个欢迎屏幕，旨在帮助你快速上手。它提供了连接在线账户的选项，可以集成你的 `Google`、`Microsoft` 或 `Nextcloud`
    账户，以便无缝访问电子邮件、日历和文件。你可以启用 `Canonical` 的 `Livepatch` 服务，无需重启即可应用关键内核安全更新，并调整隐私设置以控制系统共享的信息量（例如位置和使用数据）。欢迎屏幕还提供了软件管理指南，解释了如何通过
    `Ubuntu Software` 和 `Snap Store` 安装新应用程序。


    ## 自定义你的系统


    一旦完成初始设置，就是时候让 Ubuntu 变得属于你自己了。这涉及自定义桌面环境、配置网络设置以及安装额外的软件。


    `Ubuntu 24.04` 使用 `GNOME` 桌面环境，它具有高度的可定制性。你可以通过更改壁纸、调整大小并移动 dock，以及使用 `GNOME Extensions`
    和主题来彻底改变桌面的外观和感受，从而获得个性化的体验。


    配置网络设置可确保你的连接安全可靠。大多数以太网和 Wi-Fi 连接将自动检测，但你可以通过“设置”菜单手动配置网络选项。`Ubuntu 24.04` 自带有一套全面的预装软件，包括用于浏览的
    `Firefox`、用于办公的 `LibreOffice` 和用于电子邮件的 `Thunderbird`。然而，你可能需要安装额外的软件以满足特定需求。`Ubuntu
    Software` 提供了精选的应用和更新，而 `Snap Store` 提供了包含所有依赖的通用 Linux 软件包，使其非常适合跨平台应用。高级用户可以使用终端访问
    `APT`（Ubuntu 的包管理器），这是安装软件和管理更新的最快方法。


    # 最后的结语


    `Ubuntu 24.04` 的安装和初始设置设计得流畅且易用，反映了 Ubuntu 对无障碍的承诺。完成后，你就可以自由地探索新系统的全部潜力，无论是开发软件、管理服务器，还是仅仅享受现代且安全的计算环境。


    `Ubuntu 24.04` 提供了一个稳定的基础，拥有无限的自定义和创新可能。花时间去探索、自定义并拥抱开源计算的自由。


    # 2.1 创建可启动 USB 盘：创建 USB 安装程序的分步指南


    安装 `Ubuntu 24.04` 的之旅从创建一个可启动的 USB 盘开始。这个 USB 安装程序将成为你通往新 Ubuntu 体验的大门，允许你在不影响当前操作系统的情况下安装或尝试
    Ubuntu。在本小节中，我们将逐步引导创建可启动 USB 盘的过程，确保你为顺畅安装做好一切准备。


    ![](img/image_rsrc3EV.jpg)


    ## 理解可启动 USB 盘的重要性


    可启动 USB 盘本质上是一个便携式存储设备，包含安装操作系统所需的所有文件。与 CD 和 DVD 等旧版安装介质不同，USB 盘具有更快的读写速度且更易便携。通过为
    `Ubuntu 24.04` 创建一个盘，你将拥有一个用于未来安装或系统恢复的可重复工具。


    ## 你需要什么


    在开始创建过程之前，请确保你拥有以下物品：


    - 一台连接了互联网的电脑。

    - 一个容量至少为 4 GB 的 USB 盘（最好是 8 GB GB）。

    - 创建可启动 USB 盘的软件。

    - `Ubuntu 24.04` ISO 文件。


    ## 下载 Ubuntu 24.04 ISO 文件


    创建可启动 USB 盘的第一步是下载官方的 `Ubuntu 24.04` ISO 文件。访问 Ubuntu 官方网站，导航到“下载”部分并选择你需要的版本。确保你下载的是正确的版本，无论是桌面版还是服务器版。


    点击下载链接并将 ISO 文件保存到电脑上方便的位置。文件大小约为 3 GB，因此取决于你的网络速度，下载可能需要一些时间。


    ## 选择创建可启动 USB 盘的正确软件


    根据你当前使用的操作系统（`Windows`、`macOS` 或 `Linux`），你需要不同的软件来创建可启动 USB 盘。


    ### 对于 Windows 用户


    Windows 用户可以使用 `Rufus`，这是一款轻量级且用户友应用程序，专门为创建可启动 USB 盘而设计。它是开源的且不需要安装，是一个方便的选择。


    从其官方网站下载 `Rufus` 并启动程序。你将看到一个简单的界面，带有选择 USB 盘、ISO 文件的选项。


    ### 对于 macOS 用户


    在 `macOS` 上，`Balena Etcher` 是一款流行且直观的工具。它也适用于 `Windows` 和 `Linux`，如果你跨平台工作，它非常通用。


    从官方网站下载 `Balena Etcher`，安装并打开应用程序。它整洁直观的界面将引导你完成 USB 创建过程。


    ### 对于 Linux 用户


    如果你正在使用 `Linux`，可以直接从终端创建可启动 USB，或者使用 `Startup Disk Creator`（Ubuntu 自带）或 `Balena
    Etcher` 等图形工具。


    ## 使用 Rufus 创建可启动 USB 盘 (Windows)


    将 USB 盘插入电脑并启动 `Rufus`。在“设备”部分，从列表中选择你的 USB 盘。点击“启动选择”旁边的“选择”按钮，找到你下载的 `Ubuntu
    24.04` ISO 文件。将“分区方案”和“文件系统”选项保持默认设置（分别为 `MBR` 和 `FAT32`）。点击“开始”。`Rufus` 会提示你需要下载额外的文件。接受并继续。确认要格式化
    USB 盘，这将擦除盘上的所有现有数据。`Rufus` 将创建可启动 USB 盘。此过程可能需要几分钟。


    ## 使用 Balena Etcher 创建可启动 USB 盘 (macOS 和 Linux)


    将 USB 盘插入电脑并启动 `Balena Etcher`。点击“从文件烧录”并选择 `Ubuntu 24.04` ISO 文件。点击“选择目标”并选择你的
    USB 盘。点击“烧录”开始过程。如果提示，输入系统密码以授权操作。`Balena Etcher` 将创建可启动 USB 盘，这可能需要几分钟。


    ## 使用 Startup Disk Creator 创建可启动 USB 盘 (Ubuntu)


    将 USB 盘插入你的 Ubuntu 系统。从应用程序菜单打开 `Startup Disk Creator`。点击“其他”并选择 `Ubuntu 24.04`
    ISO 文件。确保你的 USB 盘被选为“要使用的磁盘”。点击“制作启动盘”开始过程。确认格式化警告并继续。


