    从 GNOME Extensions 网站安装扩展，你需要通过安装 `gnome-shell-extension-prefs` 软件包来启用浏览器集成：


    ```

    sudo apt install gnome-shell-extension-prefs

    ```


    然后，访问 GNOME Extensions 网站，按照提示启用浏览器集成，并开始浏览和安装扩展。


    ## 布局与工作空间


    布局和工作空间是创建高效且井然有序的工作流的关键。Ubuntu 24.04 允许你调整桌面布局以适应你的需求，并轻松管理多个虚拟桌面（工作空间）。


    ### 定制布局


    “Dash to Panel”和“Vertical Overview”等 GNOME 扩展允许你更改 GNOME 桌面的默认布局。Dash to Panel
    将 dock 和顶栏合并为单个任务栏（类似于 Windows），而 Vertical Overview 则将活动概览垂直对齐。


    ### 管理工作空间


    工作空间允许你在多个虚拟桌面之间组织工作，减少混乱并提高生产力。在 Ubuntu 24.04 中，工作空间根据需要动态创建。


    通过按下 `Super + Page Up/Page Down` 或在活动概览中点击它们来切换工作空间。通过将窗口拖放到目标桌面可以在工作空间之间移动窗口。


    在系统设置中，可以在“多任务”（Multitasking）部分配置静态工作空间或启用动态工作空间。


    ## 提高效率的快捷键


    快捷键可以显著增强导航并提高工作流效率。在系统设置的“键盘”部分自定义快捷键。


    为常用的操作分配快捷键，例如启动特定应用程序或控制音量和亮度等系统功能。发现并掌握这些快捷键将改变你与桌面的交互方式。


    ## 所有用户的无障碍功能


