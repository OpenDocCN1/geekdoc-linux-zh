    # File Systems


    When it comes to file systems, MS Windows is the 24-flavors ice cream shop of
    operating systems. Popular flavors include FAT, FAT16, FAT32, OS/2 HPFS, NTFS,
    and DFS. Then there are the UNIX interoperability flavors: NFS and Samba. Windows
    provides a great deal of functionality in supporting legacy and contemporary file
    systems. This capability is especially useful in heterogeneous environments, regardless
    of whether there are multiple versions of Windows or a mixture of Windows and
    other operating systems.


    # FAT


    The file allocation table (FAT) file system represents the basic common denominator
    for file and directory support across the family of Windows platforms. The FAT
    architecture is essentially an indexed table that references data containers called
    clusters within a partition of contiguous space on a disk. A cluster represents
    the smallest unit of storage on a disk. Cluster size ranges from 512 to 32K bytes
    depending on disk size and format.


    Because cluster size represents the smallest container for a file or directory,
    it may be important to tailor the file system and drive format to meet the file
    size profile for a particular data set.


    FAT file systems are defined by four control areas. The first or reserve area
    contains the boot sector, bootstrap program, and partition table. The next area
    is the FAT index of clusters, followed by the root directory table, which is a
    directory of files and top level directories. The fourth area is the file area
    collection of clusters where data are stored.


    FAT architecture has evolved over the years in keeping with the availability of
    larger disks and the demand for larger file sizes. Basically, this has meant an
    increase in the number of bits in the FAT used to index clusters. More index bits
    means more clusters can be'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'addressed. Originally the FAT architecture used 12 bits as a cluster index.
    In DOS 4.0 the index size was increased to 16 bits. In the second release of Windows
    95, the FAT index grew once again to 32 bits in *FAT32*.


    # NTFS


    Windows NT introduced another player in the suite of Windows file systems, the
    *New Technology File System (NTFS)*. In keeping with NT''s role as a workgroup
    or domain server, NTFS provides a scalable and recoverable file system environment
    to better support and secure server data. NTFS again extended the cluster index
    to 64 bits. This allows NTFS to address large RAID-based data sets that span multiple
    disk drives. The structural contents and state of NTFS is tracked and maintained
    in a relational database called the *master file table (MFT)*. MFT information,
    along with redundant copies of critical file system data and optional file system
    mirroring, improves NTFS fault tolerance over FAT file systems and enables automated
    recovery in the event of a system failure. NTFS also provides enhanced data security
    over FAT. Access controls can be applied at the individual file level. FAT file
    systems only apply access controls at the directory level.


    # DFS


    It is often difficult to locate directory shares in medium to large domains. Microsoft''s
    *Distributed File System (DFS)* was introduced to simplify locating directory
    shares and to provide users with a consistent hierarchical view of available resources.
    Under DFS, shares residing on a number of servers can be organized into a single
    directory tree called a *DFS tree*. As client computers traverse the directory
    tree, they are automatically directed to the server providing the share which
    makes up that portion of the DFS tree. Alternate directory paths can be defined
    within DFS to load-balance access to popular shares by replicating the share across
    multiple servers. When used in conjunction with Windows 2000, LDAP services in
    Active Directory can be used to identify DFS tree servers for clients. DFS is
    an add-on service for Windows NT share servers and a client add-on for Windows
    9x.


    # Printing


    Windows printers can be network-shared with other computers in a workgroup or
    domain in much the same way that directories are shared. A physical printer is
    first defined on the server via a simple Add Printer Wizard. The new printer is
    associated with the appropriate device driver and is then represented in the system
    by a virtual printer object and queue. Note that multiple physical print devices
    called a *printer pool* may be referenced by a single queue name. Once the printer
    definition is complete, the printer can be assigned a share name and made available
    for remote access.


    The remote client uses the same printer definition wizard and selects "network
    printer" as the target. If the target server installed the network client driver
    for the particular printer, the driver will be automatically downloaded from the
    server and installed on the client. After installation is complete, the network
    printer can be used by applications just as if it were a local device.


    For the local application or user, there is little discernible difference between
    a local or remote printer. Documents to be printed on a particular device are
    routed into the associated queue name and processed by the print server process
    (Figure 3.11). If the destination is a remote share, the document is transferred
    to the remote site by the network redirector, otherwise it is routed to the local
    device.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '![](img/7684008b1d7775727df27d44aed5b3f0_51_0.png)


    Figure 3.11: Printer queue listing


    # Access Control


    In the previous section on domains we talked about how domain user and group credentials
    and rights are stored in the domain controller''s Security Account Manager (SAM)
    database. Rights are rules that govern access to all the resources in the domain.
    Rights can be defined per individual or to groups of individuals that share similar
    needs (Figure 3.12). Group rights have both local and global scope. Membership
    in a global group permits access to resources that reside in multiple domains.
    Global group rights are governed by the interdomain trust relationships. Local
    groups are restricted to resources within a single domain. Access may also be
    limited by local SAM information that exists on nondomain controllers and NT workstations.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '![](img/7684008b1d7775727df27d44aed5b3f0_52_0.png)


    Figure 3.12: User Manager for domains


    The *Local Security Authority (LSA)* and Net Login service are responsible for
    verifying access rights to resources and authenticating login requests respectively.
    The LSA validates each request by checking the user''s *Resource Identifier (RID)*
    and the domain''s *Security Identifier (SID)* against the access permissions of
    the requested resource. Resource permissions are defined by *Access Control Lists
    (ACLs)*.


    # Kerberos


    Windows 2000 enhances the SAM/LSA mechanism by integrating Kerberos 5.0 for network
    authentication. This third-party authentication system described in the previous
    chapter on UNIX, is a component of Windows 2000 Active Directory. Kerberos provides
    additional interoperability between Windows and a number of other vendor operating
    systems and applications that support the MIT Kerberos specification. Note that
    Kerberos is an authentication system and does not normally indicate authorization
    information. Microsoft has enhanced Kerberos by incorporating Windows access control
    information into an unused field within the Kerberos ticket. The field is ignored
    by MIT Kerberos systems and does not affect overall interoperability. Windows
    2000 clients can be configured to use an MIT Kerberos security server for authentication.
    Under this configuration, authorization information is collected from Windows
    2000 servers via Kerberos transitive trust relationships.


