    # Summary


    +   - Work through a problem one subsystem at a time beginning with the lowest
    common denominator.

    +   - Verify network connectivity using `ifconfig`, `winipcfg`, `netstat`, and
    `ping`.

    +   - Check Samba daemon operation using `ps`, `netstat`, `smbstatus`, and `smbclient`.

    +   - Test connectivity from Windows clients by using the NET command or **Windows
    Explorer → Tools→ Map a Network Drive**.

    +   - Use `nmblookup` to confirm name service operation.'
