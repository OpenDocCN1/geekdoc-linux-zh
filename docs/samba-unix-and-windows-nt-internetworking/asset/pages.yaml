    ```

    hosts allow = 192.168. except 192.168.0.10

    hosts deny = frodo, bilbo

    hosts allow = 149.125.10.0/255.255.255.0

    ```


    You may also restrict access to an individual or a group of users using the username,
    only user, valid users, and invalid users parameters (Example 6.5). Depending
    on the parameter used, the client-supplied user name and/or password is checked
    against the list of user names before granting access. If the user name is prefixed
    with an "@" sign or a "&" sign it is assumed to correspond to an NIS netgroup.
    If prefixed with a "+" sign is checked against the UNIX group file.


    # Example 6.5 Restricting Access by User Name


    ```

    invalid users = root system +wheel

    only user = fred

    ```


    Sometimes you will want to make shares available to anyone. This is accomplished
    by specifying guest ok or only guest parameter in the share section definition.
    Note that even though you are granting public access to a resource, you will still
    want to restrict rights by mapping guest access to a known UNIX user name by using
    the guest account parameter (Example 6.6). This way guest rights are governed
    by the privileges owned by the specified account name.


    # Example 6.6 Restricting Guest Access


    ```

    guest ok = true

    guest account = nobody

    ```


    Additional access controls may be specified for each share using the parameters
    listed in Table 6.6. In general, the following rules are applied when a client
    requests access to a share or service.


