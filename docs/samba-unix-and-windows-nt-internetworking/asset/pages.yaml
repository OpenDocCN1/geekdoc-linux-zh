  md: 'For environments with significant disparity in existing UNIX and Windows namespaces,
    Samba provides a means of mapping dissimilar usernames between systems. User name
    mapping can also be used to map multiple user names into a single user name. The
    many-to-one mapping simplifies file-sharing activities among group members. User
    name mapping is enabled by specifying the UNIX path name of a file that contains
    client-to-server user name assignments as a value to the username map global parameter:


    ```

    username map = </path/Filename>

    ```


    Each line in the named mapping file assigns a valid server user name as a match
    to one or more client user names using an "=" sign character (Example 7.2). A
    list of client user names which are members of a UNIX group can be designated
    on the right side of the equation using @groupname syntax. An "*" character can
    be used as a wildcard to indicate that any user name will match. Lines in the
    file can be up to 1,023 characters in length. Lines beginning with an "#" or ";"
    characters are ignored by the parser.


    # Example 7.2. Username Mapping


    ```

    Syntax: username = username1 username2 ... usernameN

    root = Administrator

    wheel = @system

    !guest = *

    ```


    Parsing of the map file includes all lines in the file. Any line that begins with
    an "!" character will terminate parsing if a match was made. Failing a valid match,
    parsing will continue until the end of the file.


    # Passwords


    Passwords are the backbone of most UNIX and Windows computer security systems.
    Therefore, most of us spend a great deal of time fine-tuning and hardening the
    password infrastructure. This usually means regularly checking password databases
    for easily guessed passwords, periodically updating password rules and dictionaries,
    keeping clear-text passwords off the network, schooling users on proper password
    use, and wrestling with users over general password policy issues. For most, it''s
    a never-ending, thankless job.


    None of us wants to increase the complexity of maintaining password services or
    undermine the security we''ve worked so hard to put in place. Unfortunately, UNIX
    and Windows systems don''t play by the same rules when it comes to passwords.
    First, they employ different one-way algorithms for encrypting passwords. LAN
    Manager servers hash the uppercased password, Windows NT4 stores an MD4 hash of
    a Unicode version of the password, and UNIX uses crypt(), a modified DES algorithm
    to encrypt the password with a random salt. To further complicate matters, older
    Windows systems present uppercased clear-text passwords during session setup.
    Fortunately, Samba provides a number of options for dealing with the disparity
    between UNIX and Windows password schemes.


    # Clear-Text Passwords


    Assuming your network is secure from password sniffing (whose is?), authorizing
    clear text passwords at SMB session setup time is probably the simplest method
    for managing'
