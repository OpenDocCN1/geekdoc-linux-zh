  md: 'namespace and maintained as a set. Host tables work well for small collections
    of networked machines and in situations where you want to enforce a different
    view of the namespace on particular machines.


    Larger networks require automated name service mechanisms to guarantee that namespace
    uniqueness remains consistent over large populations of computers. Automation
    is also required to ensure that namespace updates can be administered in a distributed
    manner and that changes are quickly reflected in all participating machines. In
    the Internet world, automated name service methodology is provided by the Domain
    Name Service (DNS). Windows supports a similar NetBIOS based name service known
    as Windows Internet Name Service (WINS).


    Before diving into the details of Samba Name Service configuration, I want to
    stress the importance of having a firm understanding of the NetBIOS naming, registration,
    and query mechanisms. This background will help you better understand how the
    various smb.conf parameters affect Samba''s role as client, server, or proxy agent.
    The topic of NetBIOS name service was discussed earlier in Chapter 3. I would
    suggest reviewing the pertinent sections of Chapter 3 before proceeding with the
    following sections. We''ll also briefly review NetBIOS naming in the following
    section.


    # NetBIOS Names


    You may recall that all NetBIOS resources are branded by a 16-byte identifier
    that represents the resource''s unique name or group name (Example 8.1). The first
    15 characters represent the alphanumeric name that identifies the resource. The
    16th byte is a hexadecimal number that designates the type of resource (Table
    8.1).


    # Example 8.1 NetBIOS Name


    ```

    \\<15byte_NetBIOS_name>{00h}

    ```


    # Table 8.1 NetBIOS Resource Types


    # Unique Resource Type


    | Code | Description |

    |------|-------------|

    | <00> | Workstation service name |

    | <03> | Messenger service name |

    | <06> | RAS server |

    | <1B> | Domain master browser |

    | <1F> | NetDDE service |

    | <20> | Server service |'
  merge: -1
  img_proc: true
- pgno: 112
  md: '<21> RAS client


    <BE> Network monitor agent


    <BF> Network monitor utility


    # Group Resource Type


    <1C> Domain group name


    <1D> Master browser name


    <1E> Group name for elections


    <20> Internet group


    In the NetBIOS over TCP/IP (NBT) world supported by Samba, NetBIOS names are registered
    and resolved in one of three ways. The first and simplest method is to use a host
    table that manually maps NetBIOS names to IP addresses. This table is affectionately
    known as the LAN Manager Hosts (LMHOSTS) table. Each line in the LMHOSTS table
    matches a NetBIOS resource name to its home IP address (Example 8.2).


    # Example 8.2 Sample Windows LMHOSTS Table


    ```

    149.110.5.12    Wizard    #PRE    #DOM:EYRIE

    149.110.5.11    Dragon

    149.110.5.2     Dhyana

    149.110.5.1     Tao

    149.110.5.5     Rose

    ```


    The second method registers and resolves NetBIOS names using network broadcasts
    (Figure 8.1). To make its presence known, a machine broadcasts its name over the
    network on UDP port 137. This usually occurs at system boot time when network
    services are starting. The machine then awaits a response indicating whether its
    chosen name is accepted or rejected as being already in use by another machine
    (Figure 8.2). The process may be repeated a number of times, because broadcast
    delivery is not guaranteed. Upon successful registration, the NetBIOS name and
    address are cached in a collaborative manner by the workgroup of machines. NetBIOS
    name resolution queries are handled in a similar fashion. This method can break
    down quickly on large, complex networks due to routing problems and/or heavy broadcast
    traffic.'
  merge: -1
  img_proc: true
