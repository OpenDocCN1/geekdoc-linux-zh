    # Windows 2000 Name Service


    Windows 2000 departs from the WINS track in that it relies on DNS for resolving
    names. The Active Directory component of Windows 2000 uses Internet-style domain
    names for naming objects in the directory. Internet domain names are translated
    into domain component entries when resolving object names in the directory (Example
    8.5). WINS integration support is included in Windows 2000 for backward compatibility
    with older clients and servers. Two special DNS resource record types, WINS and
    WINS-R, are used to designate WINS servers to be used when resolving NetBIOS names.
    The WINS servers are consulted when a local DNS lookup fails. This facility can
    also be used to set up a WINS-only DNS zone for referrals using an explicit subdomain.
    For example, you might define a DNS subdomain called wins. Any DNS queries for
    domain names that include this subdomain would be referred to the DNS server that
    resolves WINS NetBIOS names. Refer to “Using WINS Lookup” in Windows 2000 help
    for more information. Windows NT 4.0 WINS/DNS integration can also be used to
    map WINS NetBIOS names into DNS as a transition bridge between WINS environments
    and Windows 2000.


    # Example 8.5 DNS to Domain Component Name


    ```

    DNS: opus.cac.washington.edu

    DC: DC=opus,DC=cac,DC=Washington,DC=edu,o=Internet

    ```


