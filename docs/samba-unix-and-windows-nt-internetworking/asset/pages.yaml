    # smbclient Interactive Mode Commands


    When smbclient has connected and authenticated with the service the user is presented
    with a command prompt.


    ```

    smb: \>

    ```


    Once the prompt is displayed, you can interact with the service using the following
    list of commands. Interactive behavior is similar to FTP. Commands are case-insensitive
    single words that may be followed by one or more space-delimited arguments.


    +   - **? [command]** Display help information for the indicated command. If a
    command is not specified, a list of available commands will be displayed.

    +   - **! [shell command]** This will temporarily escape back to the UNIX shell.
    If a command is specified, it will be executed on the local machine.

    +   - **cd [directory name]** This will change the working directory on the server
    to the indicated location. If no directory name is specified, the current working
    directory name is displayed.

    +   - **del <mask>** Delete all files that match the specified "mask."

    +   - **dir <mask>** List all files in the working directory that match the specified
    "mask."

    +   - **exit** Terminate the server connection and exit smbclient.

    +   - **get <remote file name> [local file name]** Copy the specified remote file
    from the server to the local system. If the "local file name" option is given,
    then rename the file using the designated name. No content translations are performed
    (binary mode transfer).

    +   - **help [command]** See ?[command] above.

    +   - **lcd [directory name]** Change the local working directory to the specified
    "directory name." If a directory name is not specified, the name of the current
    local working directory is displayed.

    +   - **lowercase** Toggles whether file names copied by a get or mget command
    are converted to lower case (ON by default).

    +   - **ls <mask>** See the dir command above.

    +   - **mask <mask>** Defines a file name match pattern that will be used with
    recursive mget and mput operations. For example, a mask of "* .c" would collect
    all C source files from the directory tree.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '+   - **md <directory name>** See the mkdir command.

    +   - **mget <mask>** Copy all files matching the mask pattern from the remote
    file share to the local working directory. Note that the mask is interpreted differently
    during recursive operation (see mask and recurse commands).

    +   - **mkdir <directory name>** Create the specified directory name on the server
    file share.

    +   - **mput <mask>** Copy all files matching mask pattern from the local working
    directory to the working directory on the remote file share. Note that the mask
    is interpreted differently during recursive operation (see mask and recurse commands).

    +   - **print <file name>** Print the specified local file to a printable service
    on the remote server per print mode settings.

    +   - **printmode <graphics or text>** Set the print mode to graphics (binary)
    or text.

    +   - **prompt** Toggle mget and mput prompting for filenames during file copy
    processing.

    +   - **put <local file name> [remote file name]** Copy the specified file from
    the local system to the remote server file share. If the "remote file name" option
    is given, then rename the file using the designated name. No content translations
    are performed (binary mode transfer).

    +   - **queue** Display print queue jobs by ID, name, size, and status.

    +   - **quit** See the exit command.

    +   - **rd <directory name>** See the rmdir command.

    +   - **recurse** Toggle mput and mget directory recursion. When toggled on, these
    commands will walk the source directory tree collecting files that match the mask
    pattern. See also the mask command.

    +   - **rm <mask>** Remove files that match the mask pattern from the current
    working directory on the server file share.

    +   - **rmdir <directory name>** Remove the specified directory from the server
    file share.

    +   - **tar cjx [IXbgNa]** Create or extract a tar archive. See the -T command
    line option above. See also blocksize and tarmode commands.

    +   - **blocksize <blocksize>** Causes the tar file to be written out per the
    specified blocksize multiplied by TBLOCK (TBLOCK is set a compile time, default
    512).

    +   - **tarmode <full|inc|reset|noreset>** Sets tar behavior per file archive
    bit settings.

    +   - **full**—all files added to archive.

    +   - **inc**—only include files with archive bit set.'
