    file operations. |

    | SMBread | TID, FID, offset, and number of bytes to read. |

    | SMBclose | Close file FID in share TID. |

    | SMBtdis | Disconnect from share TID. |


    The initial negotiation of SMB dialect in the example is required due to extensions
    in the protocol that have occurred over its development history. The base level
    SMB version is known as the "core protocol." Other dialects are listed in Table
