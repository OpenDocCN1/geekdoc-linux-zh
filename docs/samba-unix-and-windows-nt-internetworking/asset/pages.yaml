    # Domain Authentication


    Rather than have Samba do the work of maintaining the password space, you can
    pass this task on to a remote server. The remote server is identified using the
    `password server` parameter. Interactions with the remote server can be either
    in user-level authentication or domain-level authentication modes as designated
    by a `security` parameter value of `server` or `domain` respectively. Domain-level
    authentication offers some additional functionality that you''ll want to consider
    when choosing a remote authentication method. Under domain-level authentication,
    there is no need to duplicate NTLM and UNIX accounts. The Samba server can also
    participate in domain trust relationships.


    To join Samba with an exiting domain, begin by stopping the `smbd` and `nmbd`
    daemons on the server. Add the server''s NetBIOS name to the domain using Server
    Manager for Domains on the domain controller (Figure 7.2). On the Samba server,
    create a server account password for the domain using the `smbpasswd` command
    (Example 7.8). The password will be stored in the `/usr/local/samba/private` directory
    as file named `<Domain Name>.<Samba Name>.mac`. The `mac` file name suffix stands
    for `machine account`. Lastly, update the `smb.conf` configuration file with the
    parameters and values listed in Table 7.3. The `machine password timeout` parameter
    specifies a time value in seconds that causes `smbd` to periodically regenerate
