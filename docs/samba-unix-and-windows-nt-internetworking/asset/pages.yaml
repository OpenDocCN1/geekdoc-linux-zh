    # What Samba Can Do For You


    We have already talked about how Samba represents a UNIX implementation of the
    SMB protocol that facilitates UNIX file system and printer sharing with Windows
    and LAN Manager clients. What we have not yet discussed is just how tightly Samba
    integrates UNIX into these environments.


    Samba implements Windows domain and workgroup functionality through two UNIX service
    daemons, nmbd and smbd. The nmbd daemon fills a dual role as NetBIOS Name Service
    and NetBIOS Browser Service. The smbd daemon provides the bulk of the SMB protocol
    implementation for sharing resource. These two daemons along, with ancillary administrative
    tools and client commands, provide:


    +   - NBNS, WINS, and DNS gateway services

    +   - Routed network browser service

    +   - Authentication and authorization gateway between UNIX and Windows domains

    +   - CIFS-compliant UNIX file sharing in Windows and LAN Manager networks

    +   - Unicode character sets and name mapping

    +   - Opportunistic locking visible to network file system services

    +   - UNIX printer sharing in Windows and LAN Manager networks, including automated
    driver installation for Windows 9x clients

    +   - UNIX access to Windows file systems

    +   - UNIX acting as a full domain client

    +   - UNIX acting as a minimal primary domain controller.


    # Future


    The Samba Team is actively improving and refining the Samba code base, whose quality
    has recently been substantiated by a series of benchmarks performed by Sm@rt Reseller
    in January and April 1999. System test staff at Sm@rt Reseller ran the Ziff-Davis
    NetBench benchmark against Samba 2.0 running on Red Hat Linux 5.2 and on Pacific
    Hitech TurboLinux 3.0.1. The results were compared against Windows NT 4.0 and
    Novell NetWare 5.0 running on similar hardware. In both tests, the Samba/Linux
    combination'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'outperformed NT and NetWare. Samba 2.0 running on an SGI Origen 200 has also
    been shown to outperform the custom network storage architecture implemented in
    the Network Appliance F760.


    Windows 2000 likely represents the most immediate challenge for the Samba Team.
    New features in Windows 2000 like LDAP-based Active Directory services, Kerberos
    5.0 authentication, Dynamic DNS, and file system modifications are dramatic departures
    from the legacy SMB NetBIOS architecture. Windows 2000 will provide backward compatibility
    for NTLM-style operations, thus ensuring interoperability with older Windows and
    LAN Manager clients and servers. Technologies like Kerberos and LDAP are already
    widely used in the UNIX community and there are subtle differences in the way
    that they are implemented in Windows 2000. There is certainly an opportunity here
    for Samba to continue playing a role in tightly integrating both the old and new
    UNIX and Windows worlds. In the remaining chapters on Samba installation and configuration,
    we will take a closer look at issues regarding Samba and Windows 2000 coexistence.


    # Summary


    +   - Samba is a UNIX implementation of the SMB protocol for sharing UNIX files
    and printers in Windows and LAN Manager-based networks.

    +   - Samba was created by Andrew Tridgell of Australian National University by
    reverse engineering the SMB protocol.

    +   - Samba development is a collaborative process whose primary contributors
    are known as the Samba Team.

    +   - Samba is an "open source" software suite available to anyone for use under
    the GNU General Public License (GPL).

    +   - The bulk of Samba functionality is provided by the nmbd and smbd daemons.

    +   - Samba provides NBNS, WINS, and DNS gateway services.

    +   - Samba provides NetBIOS Browser services for single subnet and routed networks.

    +   - Samba implements the full NT domain client protocol.

    +   - Samba can emulate the basic functionality of an NT primary domain controller.


