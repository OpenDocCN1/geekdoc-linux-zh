- pgno: 187
  md: '# SWAT


    For those more accustomed to the ease of use and error checking provided by a
    GUI configuration tool, Samba Version 2.x provides a Web-based configuration and
    administration tool aptly named the Samba Web Administration Tool (SWAT) (Figure
    14.1). Being Web based, SWAT can be invoked from a remote networked workstation.
    This is a handy capability when you are administering a number of geographically
    disparate Samba servers or making those late-night configuration changes over
    a dialup link from the comfort of your home. SWAT provides HTML forms for the
    various section types represented in the smb.conf file (Figure 14.2). SWAT simplifies
    general configuration tasks and allows the system administrator to focus on the
    section definition of interest. Refer to Chapter 6 "Samba Configuration, smb.conf"
    and the swat(8) man page for details on installing and using SWAT.


