- pgno: 160
  md: '# Global Print Parameters


    First and foremost when you are configuring Samba as a print server, identify
    the operating system type. This enlightens Samba about the nature of the commands
    and configuration files that will be used in interoperation with the print spooling
    system. The operating system type is identified by the global printing parameter.
    Supported operating systems include AIX, BSD, HPUX, LPRNG, PLP, QNX, SOFTQ, and
    SYSV.


    ```

    printing = <os type>

    ```


    Once the operating system type is known, Samba needs to know the location of the
    printer configuration file. The path name of the printer configuration file is
    specified by the global printcap name parameter. Samba matches client printer
    access requests against the queue names listed in the configuration file. Valid
    targets for a match include all printer aliases defined in the printer database.
    Default values for printcap name, based on the specified operating system type,
    include /etc/printcap for BSD systems, /etc/qconfig for AIX, and lpstat for SYSV
    systems. In the case of SYSV systems, Samba invokes the lpstat command to obtain
    the list of available printers:


    ```

    printcap name = <printer config file>

    ```


    If you don''t want to make all the printers listed in your printer configuration
    file available for client access, consider using an alternate configuration file
    for your workgroup or domain. Make a copy of the default printer configuration
    file using a different file name or path. Remove those printer definitions to
    which you wish to restrict access. Use the copy configuration file as the value
    of the printcap name parameter. Don''t forget that you''ll need to keep synchronized
    the printer configurations that reside in each file.


    To make the set of available printers visible to browsing, enable the global load
    printers parameter. The default setting, yes, will add all printers listed in
    the printer configuration file to the browse list.


    ```

    load printers = <yes, no>

    ```


