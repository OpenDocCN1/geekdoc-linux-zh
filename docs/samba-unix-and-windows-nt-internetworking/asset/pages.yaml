    You can also turn off oplock support in Windows 9x and Windows NT by modifying
    the system registry. This isn''t a recommended procedure, because disabling all
    oplock support may adversely affect some Windows applications. If you choose to
    disable oplocks on the client side, refer to the Samba distribution document File-Caching.txt.
    A registry update file is also available in the Samba distribution for Windows
