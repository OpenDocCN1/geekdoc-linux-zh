    # Groups


    Groups provide a coarse mechanism for sharing information between users. Similar
    to the /etc/passwd file, the /etc/group file is a table that identifies all the
    group names on the system, the associated GID, and a comma-separated list of the
    account names that make up the group membership (Example 2.11). UNIX assumes a
    limited group set to implement default access privileges. The system administrator
    can add users to these default groups or create new ones to facilitate additional
    collaborations. If the user base is small, this can be done relatively easily.
    For large numbers of users, managing GID sets can be a big chore.


    # Example 2.11 /etc/group


    ```

    system::!0:root,ops

    daemon::!1:

    bin::!2:root,bin

    sys::!3:root,bin,sys

    adm::!4:bin,adm,kenm,root

    uucp::!5:uucp

    mail::!6:

    security::!7:root

    cron::!8:root

    staff::!10:root,ren,stimpy,daffy,huey,dwewy

    user::!30:luge,acadmus,gwyneira,bungi

    ```


    # Network Information Service


    The Network Information Service (NIS) is an administrative tool that can be used
    to distribute common system configuration information between machines. NIS and
    NIS+ are what was commonly known as "Yellow Pages (YP)." NIS is a real boon to
    system administrators charged with maintaining a large number of machines in a
    lab or distributed network. The collection of participating machines is called
    the NIS domain. Each file in the distribution set is converted into ndm database
    format and stored as an NIS map file on the server. The collection of NIS maps
    makes up the NIS database which is distributed periodically to the machines in
    the NIS domain.


    As you may have guessed, two files commonly distributed using NIS are the /etc/passwd
    and /etc/group files. NIS provides a convenient method for synchronizing account
    information across multiple machines. In cases where only a portion of the full
    set of accounts and groups need to be kept common between machines, NIS allows
    for segregating the accounts and groups into local and distributed categories
    (Table 2.10). Local information is unique to each machine. Distributed information
    is configuration information administered on the master NIS server and pushed
    to participating machines for the sake of uniformity. Local data override conflicting
    distributed data.


    # Table 2.10 NIS Password and Group Files'
