    that the TCP protocol is installed and that NetBIOS over TCP support is enabled.
    Click **Start ➔ Settings ➔ Control Panel ➔ Network**. Locate or add TCP/IP for
    your network adapter and select the **NetBIOS** tab from the TCP/IP properties
    panel (Figure 13.1).'
