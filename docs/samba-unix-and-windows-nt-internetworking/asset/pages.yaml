- pgno: 43
  md: 'One of the features of newer versions of the SMB protocol is that it supports
    opportunistic locking or oplocks. By acquiring an oplock on a file an SMB application
    can read ahead and buffer data locally for updates, thus improving performance.
    There are three types of oplocks. Acquisition of an Exclusive oplock means that
    no other application can read or modify the target file. The lock holder has exclusive
    control over the file. A Batch oplock allows an application to maintain a lock
    on the file through successive opens and closes, thus reducing network traffic
    between the client and server. A Level II oplock permits multiple applications
    to read a file but not update it.


    # Common Internet File System (CIFS)


    As mentioned earlier, CIFS is an enhanced version of the SMB protocol. Along with
    being backwards-compatible with SMB, CIFS provides a means for sharing resources
    between multiple OS platforms across the Internet. This is accomplished through
    the use of HTTP URL-like resource location semantics and Internet DNS. In regard
    to scalability and fault tolerance, CIFS supports multiple writers to a single
    file through aggressive locking and caching algorithms. With its intent to support
    resource sharing in a larger community, CIFS can adapt to a wide range of network
    speeds. This includes everything from slow dial-up modern bit rates to gigabit
    backbone connections. Unicode character sets are also employed with the wider
    Internet audience in mind.


    # Peers, Workgroups, Domains, Forests


    One of the first things that comes to mind when planning a networking infrastructure
    for resource sharing is how to control access to those resources.


    # Workgroups


    In a small homogenous MS Windows environment, it might be possible to operate
    on a friendly peer-to-peer basis. You let me play with your toys and I''ll think
    about letting you play with mine. This type of environment is usually implemented
    as a workgroup (Figure 3.6). Workgroups provide a means of grouping together users
    and resources that share a common work profile. Workgroups also simplify the task
    of locating resources in the network. It may not be necessary to browse for a
    particular resource on each and every workstation on the network, because it may
    be that the resource is known to reside in a particular workgroup, thus reducing
    the number of systems to be checked.


    ![](img/7684008b1d7775727df27d44aed5b3f0_43_0.png)


    Figure 3.6: Workgroup model


    Each user in the workgroup usually has autonomous control over the resources on
    the'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'desktop. A user can assign passwords to local resources to limit access under
    *share-level security* (Figure 3.7). Share-level security regulates access by
    requiring knowledge of the appropriate password. Access control by user and group
    is called *user level*. This requires the presence of a Windows NT computer that
    acts as a security server. The absence of a security server in the workgroup model
    means that each user must have an account and password stored locally on each
    of the workgroup computers used. It also means that each user must know all the
    passwords required to access the various resources available in the local or remote
    workgroups. Workgroups may seem like an administrative nightmare, but it is possible
    for a system administrator to exert some level of control over resource sharing
    through the use of system policies and profiles. Password management will most
    likely remain problem.


    ![](img/7684008b1d7775727df27d44aed5b3f0_44_0.png)


    Figure 3.7: Setting share level passwords


    # Domains


    Centralized management of accounts, passwords, and shares can be more easily realized
    by implementing a Windows *domain* model for the network. A Windows domain is
    a logical collection of users and computers that share a common security policy
    and namespace. In each domain, one or more Windows NT computers, called *domain
    controllers*, act as a locus for administering and resolving access to all the
    resources located in the domain. The *Primary Domain Controller (PDC)* maintains
    a directory of all the account, group, and password information for the domain.
    This directory is called the *Security Accounts Manager (SAM)*. To log in to a
    computer or access a resource in the domain, the domain controller is first consulted
    to validate user credentials before access'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'is granted to the resource (Figure 3.8).


    ![](img/7684008b1d7775727df27d44aed5b3f0_45_0.png)


    Figure 3.8: Simple domain model


    SAM information can be replicated on one or more additional domain controllers
    called Backup Domain Controllers (BDC). The presence of a BDC assists in ensuring
    fault tolerance for the SAM directory. A BDC will also respond to a validation
    request at times when the PDC is busy or unavailable due to a system or network
    failure. The existence of a BDC is not required, but it should be carefully considered
    for large, geographically distributed domains.


    # Trust


    In instances when an organization''s business rules, administrative structure,
    or geographic layout doesn''t neatly fit the single domain model, multiple domains
    can be set up and logically connected through trust relationships. Users in a
    trusted domain are allowed to access resources and participate in group membership
    in the local domain without having to duplicate SAM directory entries in both
    domains. This feature provides a means for distributing namespace administration
    functions in large enterprises.


    Trust relationships can be broken down into three models, one-way trust, two-way
    trust, and complete trust. In a one-way trust model, domain A permits access to
    local resources by domain B, but domain B does not return the favor by permitting
    access to its resources. In a two-way trust environment, access to resources in
    domains A and B are permitted in both directions. In the complete-trust model,
    all domains have access to all resources, no matter where they are located. Complete
    trust or combinations with the other models are very difficult to manage.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Domain Models


    The ability to replicate the SAM directory and define trust relationships between
    domains provides a great deal of flexibility in designing a robust and scalable
    infrastructure. In reality, the sky is the limit concerning domain topologies.
    However, there are three common domain models that may be useful in planning an
    environment.


    The simplest model is the *single domain* infrastructure described previously.
    All participating resources are members of a single domain. The domain has one
    PDC and may have one or more computers acting as BDCs. This model is the easiest
    to administer but may be awkward for large numbers of users or machines.


    To facilitate management of large populations of users and resources, yet maintain
    a single domain for the user namespace, it is possible to separate administration
    of the SAM directory and resources into separate domains. This model is called
    the *master domain* model, and it maintains the SAM directory. One or more *resource
    domains* are defined to manage shares. A one-way trust relationship is defined
    to allow users in the master domain to access the shares in the resource domains.
    This model supports central administration of the user namespace and allows for
    local administration of shares in the resource domains.


    In large distributed organizations, it may make more sense to partition the namespace
    to support localized administration of user accounts and resources. This *multi-master
    domain* model represents the opposite end of the spectrum from the single domain
    model. The namespace is broken up into administrative units, each with its own
    security policy and definitions. Trust relationships are established as needed
    to facilitate interoperability between domains. As mentioned in the discussion
    on trust, this model is the most difficult to manage and requires close coordination
    between domain administrators.


    # Trees and Forests


    Windows 2000 builds upon the domain model by organizing domains into a hierarchical
    tree structure supporting both central and distributed administration (Figure
    3.9). It also increases the maximum namespace size to 10,000,000 objects. Windows
    NT 3.5 only supports 10,000 objects and Windows NT 4.0 supports 40,000. The collection
    of domains and administrative policies is managed by *Windows 2000 Active Directory*,
    a combination of the legacy NT domain security architecture augmented with a set
    of open technologies that include *Lightweight Directory Access Protocol (LDAP)*,
    *Kerberos Version 5.0*, and *Internet-style Domain Name Service (DNS)*. Active
    Directory supports a mixed environment of Windows 2000 and Windows NT 4.0 domain
    controllers. Back-level clients can still log in using NT LAN Manager challenge/response
    authentication.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '![](img/7684008b1d7775727df27d44aed5b3f0_47_0.png)


    Figure 3.9: Active Directory domain tree


    An Active Directory tree is a hierarchy of domains that represents a contiguous
    namespace with a common LDAP schema and Kerberos transitive trust relationships.
    A schema defines the attributes associated with each object in the namespace.
    Kerberos trust is similar to the domain trust relationships we have already described.
    A group of trees which share common schema and trust relationships can be grouped
    into a larger administrative unit called a forest. Like domains, Active Directory
    tree and forest information, called the global catalog, is replicated across multiple
    servers, but in a multi-master topology versus the primary and backup model used
    by domains.


    Active Directory augments the domain trust model by overlaying a domain tree with
    an independent structure called an Organizational Unit (OU) tree. An OU is a container
    that holds network objects including users, groups, shares, and other OUs. Individual
    OU security attributes are defined by the Active Directory schema. OUs provide
    a finer degree of administrative authority that is independent of domain boundaries.
    An individual domain might implement an OU tree within the domain to distribute
    administrative functions to subgroups in the domain. A central IT department might
    define a global OU that covers all domains to centralize administration of the
    namespace.


    # Browsing


    Workstations locate shares by browsing. Basically, browsing is akin to window
    shopping in a large mall or shopping center. We go from one network computer store
    to the next, looking to see what resources might be available for use (Figure
    3.10). There are two categories of browsers, browser clients and browser servers.
    Clients query browser servers to locate resources. Grouping resources by domain
    or workgroup limits browsing scope and simplifies the task of locating the desired
    resource.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '![](img/7684008b1d7775727df27d44aed5b3f0_48_0.png)


