    +   - NetBIOS broadcasts provide an automated registration and resolving service
    but may result in a significant amount of broadcast traffic in large networks
    and may be limited by subnet.

    +   - Windows Internet Name Service (WINS) uses point-to-point communication with
    designated WINS servers to register and resolve names. WINS services reduce broadcast
    traffic and can span subnets.

    +   - Samba supports LMHOSTS, broadcast, WINS and hybrid WINS operation.

