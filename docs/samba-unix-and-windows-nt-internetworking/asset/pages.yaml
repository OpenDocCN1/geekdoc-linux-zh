  md: '# Building Samba


    Compiling and installing Samba is a simple, automated process conducted using
    the UNIX make command. Version 2.x further simplifies the task by including GNU
    autoconf to tailor Makefile parameters to match operating system type and configuration.
    Pre-version 2 distributions require a bit of administrative housekeeping in that
    Makefile parameters must be set by hand. Parameters include compiler flags, install
    paths, and authentication methods. The Makefile is well documented and includes
    examples of common settings for most operating systems. See Table 5.3 for a listing
    of some of the common variables and flags. To build and install Samba, move to
    the top-level source distribution directory and follow the steps listed in Example
    5.3.


    # Example 5.3 Samba Build Process


    +   1. $ configure    Version 2.x and newer only.

    +   2. $ make    Compile and load step.

    +   3. $ make install    Install binaries in target directories.


    If you are upgrading from a previous release and are using the same source distribution
    directory, the old release binaries are copied into a .old directory. You can
    recover the previous release by invoking make revert. Note that if you execute
    make install twice, the old release binaries will be overwritten.


    ```

    $ make revert    Restore old release binaries.

    ```


    # Table 5.3 Sampling of Pre-Version 2.0 Makefile Variables


    # OS Flags (see Makefile)


    ```

    FLAGS = -D<OS Type> -DSHADOW_FWD    Shadow Passwords

    LIBSM = -lshadow

    CC = gcc    C Compiler

    INSTALLPERMS = 0755    Permissions

    ```


    # Install Directories


    ```

    BASEDIR = /usr/local/samba

    BINDIR = $(BASEDIR)/bin    Binaries

    SBINDIR = $(BASEDIR)/bin    Binaries

    LIBDIR = $(BASEDIR)/lib    Libraries

    VARDIR = $(BASEDIR)/var    Spool dir

    MANDIR = $(BASEDIR)/man    Man pages

    ```


    # Logs & Locks


    ```

    SMBLOGFILE = $(VARDIR)/log.smb    smbd log file

    NMBLOGFILE = $(VARDIR)/log.nmb    nmbd log file

    LOCKDIR = $(VARDIR)/locks    Lock files

    ```'
  merge: -1
  img_proc: true
