    # Shares Section


    The **shares sections** define the explicit resources that Samba will make available
    to workgroup and domain clients. Two predefined sections, designated **[homes]**
    and **[printers]**, are provided to grant users access to their UNIX `$HOME` directories,
    and any printers listed in the UNIX printcap file. Other shares can be defined
    to grant or restrict access to individual directories and printers, or to specify
    a location for storing roaming profiles. The full set of share section parameters
    is listed in Table 6.5. See the `smb.conf` manpage for a description of each parameter.


    If a **[homes]** section is defined in `smb.conf`, it becomes the default target
    when no match is found for a requested share name. The share name is then assumed
    to be a valid user account on the server. The password file is scanned for a new
    match. If the user name is found, the supplied password is verified against the
    user''s entry in the server''s password file. Once validated, a new share name
    is created by cloning the default parameters specified in the **[homes]** section
    and associated with the user''s `$HOME` directory. See Chapter 11 for additional
    information on sharing directories.


    If a **[printers]** section is defined in the Samba configuration file, the server
    attempts to match the requested share name against the set of printers listed
    in the `printcap` file. If a match is found, a new share is created by cloning
    the [printers] section parameters. Refer to Chapter 12 for details on defining
    and sharing printers.'
