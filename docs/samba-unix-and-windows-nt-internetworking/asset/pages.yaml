- pgno: 3
  md: '# What Is Samba?


    Samba is an Open Source software suite of UNIX services that enable MS Windows
    and other desktop clients to access UNIX file systems and printers via Microsoft''s
    Server Message Block (SMB) and Common Internet File System (CIFS) protocols. Since
    its inception in 1991, Samba has continued to evolve and incorporate new features.
    The latest versions of Samba offer much of the functionality provided by the Windows
    NT Domain system. Originally used primarily within academia and research institutions,
    Samba has grown in popularity and is now supported by over 100 commercial vendors
    worldwide. Samba is readily available, including source code, for most UNIX platforms
    under the GNU General Public Licensing agreement. A sampling of supported clients
    include DOS, Windows for Workgroups 3.11, Windows 95/98, Windows NT OS/2, Macintosh,
    VMS, and MVS.


    # Audience


    The target audience for this work includes systems programmers and administrators
    who are looking for assistance in implementing Samba in new and existing Windows
    and UNIX environments. A basic overview of both UNIX and Windows system and network
    architectures is provided to assist those readers whose primary background may
    be in one or the other of these operating environments. The general narrative
    of the text focuses on how to install and configure Samba to facilitate various
    authentication models favoring either UNIX or Windows as a primary security authority.
    This includes how Samba can be configured to act as an NT Primary Domain Controller
    and how Samba coexists with Windows 2000. The subject matter is partitioned by
    function to facilitate quick access to topics of interest. Advanced topics are
    integrated into each of the functional chapters to reduce having to move back
    and forth between general and advanced chapters. Sections on operation and client
    tools will benefit end users who want a better understanding of how to tailor
    and optimize their use of Samba services.


    # Chapter Tour


    Chapter 1 begins with an overview of the problems and challenges of internetworking
    computing resources in a mixed UNIX and Windows environment. Trouble spots include
    maintaining application preference consistency for mobile users, resource scaling
    and naming in large enterprises, and password synchronization between dissimilar
    operating systems. The intent is to assist the reader in identifying their own
    requirements for planning an infrastructure to facilitate resource sharing under
    Samba.


    Chapter 2 is for those administrators and users who are unfamiliar with the UNIX
    operating system and its network services. Since Samba runs as a UNIX based service,
    the focus of discussion centers on those UNIX subsystems important to the care
    and feeding of Samba. The chapter also includes an overview of the various UNIX
    naming, authentication, and authorization services referenced in later chapters
    regarding resource identification and access control.


    Chapter 3 is similar to Chapter 2 in that it presents an overview of the various
    Windows implementations and architectures. Special attention is devoted to the
    NETBIOS, SMB, and CIFS protocols upon which Samba is based. Other topics include
    name service, authentication and access controls, browsing, and Windows 2000 Active
    Directory.


    Chapter 4 introduces Samba, its history, and its evolution. The chapter follows
    from the previous discussions of UNIX and Windows architectures by outlining how
    Samba facilitates authentication, authorization, and resource sharing between
    the two operating systems. The chapter also covers licensing and distribution,
    and concludes with a brief overview of Samba NT Primary Domain Controller emulation.'
  merge: -1
  img_proc: true
- pgno: 4
  md: 'Chapter 5 provides further detail on the Samba distribution package, supported
    platforms, documentation, and the installation process. Installation trade offs
    related to the binary and source distribution formats are presented, along with
    a step by step procedure for building Samba from source code. The chapter closes
    with an introduction to Samba configuration, system startup, and operation.


    Chapter 6 begins the advanced section of the text by further detailing Samba configuration
    options. This chapter is intended to be a base reference of stanzas, variables,
    and parameters which will be used in configuring the services presented in subsequent
    chapters. This section also includes a discussion of the use of Samba macros which
    can be used to automate administration and operation tasks.


    Chapter 7 focuses on authentication and access control mechanisms. Alternative
    schemes for mapping accounts, groups, and permissions are presented along with
    techniques for integrating Samba with the more advanced authentication mechanisms
    provided by NDIS, Kerberos, LDAP, and Windows 2000. The chapter also covers password
    security and name space scaling for large enterprises.


    Chapter 8 describes the various name service mechanisms supported by Samba to
    identify and locate resources in a domain or workgroup. Approaches include the
    use of host files, names servers like WINS and DNS, and interoperating with Windows
    2000 Active Directory.


    Chapter 9 follows the previous discussion on resource identification with a description
    of how to setup the browse service to manage resource visibility by Windows clients
    in the network. Topics include the use of browse lists, the browser election process,
    and browsing over local and routed subnets.


    Chapter 10 explains how to configure Samba to emulate an NT Primary Domain Controller
    (PDC). The discussion covers the features and limitations in the PDC implementation,
    defining trust relationships with other domains, setting up user profiles, policies
    and login scripts, and interoperability issues with Windows 2000 domains, trees,
    and forests.


    Chapter 11 describes how files and directories are shared between UNIX and Windows
    via Samba. The chapter presents a number of problem areas that must be considered
    when configuring Samba file shares. Areas requiring special consideration include
    mapping file name structures and character sets, support for symbolic links, and
    file locking mechanisms.


    Chapter 12 covers the configuration of printer shares in Samba. The discussion
    covers configuration for various styles of UNIX printing, driver support, and
    queuing controls. This section also describes printing from UNIX to Windows managed
    printers.


    Chapter 13 switches focus from the server side of Samba to its various clients.
    Step by step instructions are provided for configuring Windows, UNIX, and other
    desktop clients to authenticate and access the resources managed by Samba.


    Chapter 14 outlines administrative tasks and tools which will help the reader
    maintain a reliable and available Samba service. This includes descriptions of
    graphical and Web-based tools which simplify Samba administration.'
  merge: -1
  img_proc: true
