    # Figure 8.2: NetBIOS broadcast name already in use


    The third method for managing the namespace is similar to the preceding broadcast
    method, but instead of using broadcasts, it employs point-to-point communication
    with a designated name server (Figure 8.3). Name registration and IP address resolution
    requests are directed to a NetBIOS Name Server (NBNS) in a manner similar to Internet
    dynamic DNS. NetBIOS point-to-point name service protocol is defined in RFC 1001
    and RFC 1002, and is implemented by Microsoft as WINS. WINS automates the process
    of registering and resolving NetBIOS names, reduces NetBIOS broadcast traffic
    on the network and enables multi-subnet browsing. Multiple NT WINS servers can
    be deployed and configured to synchronize their NetBIOS data periodically to ensure
    availability and redundancy.'
