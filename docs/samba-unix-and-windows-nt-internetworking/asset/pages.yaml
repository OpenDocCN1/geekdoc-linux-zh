- pgno: 75
  md: "# Tailoring smb.conf\n\nThe smb.conf file is a flat ASCII text file that can\
    \ be modified with any text editor. The general format of the file is similar\
    \ to that of Windows .INI files. Configuration information is broken down into\
    \ sections and delineated by a section name (Table 6.1). Each section designates\
    \ a service. A special global section defines overall system and administrative\
    \ default, and the roles the server will assume in the workgroup or domain. The\
    \ remaining sections in the file designate the resource shares the server will\
    \ make available to network clients. Sets of well-defined parameters are used\
    \ to specify the properties of each section. Note that some parameters only apply\
    \ to the global section while others only apply to \"shares\" sections.\n\n# Table\
    \ 6.1 smb.conf Sections\n\n|  |  |\n|---|---|\n|[Global] | System roles and defaults\
    \ |\n|[Homes] | Home directory shares |\n|[Printers] | Printer shares |\n|[Name]\
    \ | User defined share |\n\n# Syntax and Semantics\n\nEach stanza in the smb.conf\
    \ file represents either a section name, parameter = value pair, or comment. A\
    \ section begins with a section name enclosed in square brackets. The section\
    \ name is followed by a collection of parameters and values, one per line, which\
    \ describes the section's role and attributes (Example 6.1). Section and parameter\
    \ names are not case sensitive, although case is preserved for string values.\
    \ Parameter arguments are either Boolean values or character strings (Table 6.2).\
    \ Each line is terminated by a newline character. Continuations are indicated\
    \ by a \"\\\" character in traditional UNIX manner. Comment lines begin with either\
    \ a \"#\" or a \";\" character. White space is generally ignored except when found\
    \ within a string value. Quotes are not required for strings containing white\
    \ space and are ignored if discovered by the parser. White space is used to separate\
    \ individual string entries in values represented as lists.\n\n# Example 6.1 Sample\
    \ smb.conf Section\n\n```\n#\n# A publicly accessible directory, read/write to\
    \ all users.\n#\n[public]\n    path = /usr/somewhere/else/public\n    public =\
    \ yes\n    only guest = yes\n    writable = yes\n    printable = no\n```"
  merge: -1
  img_proc: true
- pgno: 76
  md: '# Table 6.2 smb.conf Syntax


    | Syntax | Description |

    |---|---|

    | "#", ";" | Designates a comment |

    | "\" | Continue on next line |

    | "$" | Variable prefix |

    | "[name]" | Section name |

    | "parameter = value" | Designates a configuration option |

    | "1/0", "yes/no", "true/false" | Boolean values |


    When making changes to your smb.conf file, use the testparm command to verify
    correctness. testparm will not guarantee that a particular share or service will
    work as you expect; rather it will validate the syntax and options you have specified
    for each section. If a host name or IP address is supplied as an option, it will
    check the access rights of the specified host.


    ```

    $ testparm <-s configfilename> <hostname hostIP>

    ```


    # SWAT


    For those more accustomed to the ease of use and error checking provided by a
    GUI configuration tool, Samba Version 2.x provides a Web-based configuration and
    administration tool aptly named the Samba Web Administration Tool (SWAT) (Figure
    6.1). Being Web based, SWAT can be invoked from a remotely networked workstation.
    This is a handy capability for those administering a number of geographically
    disparate Samba servers or making late-night configuration changes over a dialup
    link from the comfort of home. SWAT provides HTML forms for the various section
    types represented in the smb.conf file (Figure 6.2). SWAT simplifies general configuration
    tasks and allows the system administrator to focus on the section definition of
    interest.'
