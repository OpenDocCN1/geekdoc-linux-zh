    string value is passed to C library system() routine which then forks and executes
    sh (command language interpreter) to parse and execute the passed string. The
    command string value will likely include instances of Samba substitution variables
    (Table 12.2). Variable values will be resolved before passing the string to the
    system() routine. It is a good idea to use the full path name for any command
    or script in a command parameter value. This avoids problems associated resolving
    paths during execution. Sample command strings are listed in Example 12.3.


    # Table 12.2 Printer Share Substitution Variables


    | Variable | Description |

    |---|---|

    | `%p` | printer name |

    | `%j` | integer job number |

    | `%s` | spool file name |

    | `%f` | spool file name without full path prefix |


