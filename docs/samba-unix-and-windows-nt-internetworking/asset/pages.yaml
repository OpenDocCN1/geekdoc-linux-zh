  md: '![](img/7684008b1d7775727df27d44aed5b3f0_203_0.png)


    Figure 15.2: SWAT


    # Authentication


    There are many things that can go wrong when setting up authentication mechanisms.
    Here are a few suggestions for ferreting out bugs in the standard Samba authentication
    schemas.


    +   - Check the `encrypt passwords` parameter for plain-text or NTLM-encrypted
    password format.

    +   - If they are plain-text passwords, confirm that the UNIX `passwd` file path
    is correct or that the remote authentication server is identified.

    +   - You may need to fine-tune string guessing permutations to correctly guess
    uppercased user names and passwords.

    +   - If there are encrypted passwords, then verify that the `smbpasswd` file
    exists, is populated with users, and is correctly formatted, or that the remote
    authentication'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'server is identified.


    +   - For Samba domain controllers, check to see that the `netlogin` share has
    been defined. Validate using `smbclient -U` to test authentication.


    # Shares


    Assuming that authentication problems aren''t keeping you from accessing a share,
    the most likely culprit is access control. Carefully substantiate that you haven''t
    blocked client access due to global `hosts deny` restrictions. Are read-write
    permissions being applied the way you expect?


    To verify general access, use `smbclient` to connect a common share like a home
    directory defined by the `[homes]` section in `smb.conf` (Example 15.13). Any
    share will do. Invoke `smbclient` with the share name. If the share requires authentication,
    you should be prompted for a password. Once the share is authenticated, you should
    have access to it.


    # Example 15.13 Samba Home Share Access


    ```

    $ smbclient //wizard/deroest

    Password:

    Domain = [EYRIE] OS = [Unix] Serve r= [Samba 2.0.5a]

    Smb: \>

    ```


    Also try connecting the share from a Windows client using the **NET USE** command
    or **Windows Explorer → Tools → Map a Network Device** (Figure 15.3).


    ```

    C:\NET USE J: \\ <server NetBIOS name>\<share name>

    ```


    In the case of printer shares, make sure that you have correctly identified `printcap`
    printers and that they are marked as `printable`. Next confirm that the `printing
    os` type is set and that it corresponds to the `print command` and `lpq command`
    parameters.


    If you are providing downloadable Windows 9x printer drivers, verify that the
    `printer driver name` and `printer driver location` directory are correct and
    readable. The `printer driver name` is case sensitive and must exactly match the
    name expected by the Windows driver install procedure. Always print a test page
    as part of the Windows network printer driver install to make sure features like
    fonts and colors are working as expected.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '![](img/7684008b1d7775727df27d44aed5b3f0_205_0.png)


    Figure 15.3: Windows Explorer – map network device


    Use testprns to quickly determine whether a given printer name is valid for use.
    It is a good idea always to specify the printcap file as a command argument when
    testing access. Supply the full path name of the printcap file as an argument
    to limit confusion.


    ```

    $ testprns <printer name> [<printcap-file>]

    ```


    # Performance


    When it comes to tweaking additional cycles out of Samba, one of the first suggestions
    is to dedicate one or more computers to the service. This allows you to tune and
    tailor the operating system to meet Samba''s resource demands. It also limits
    the number of things that go wrong. It is not uncommon in UNIX to have one service
    severely influence or interrupt another service if they are running on the same
    hardware.


    You might also consider setting up a "cluster" of Samba servers and distributing
    load across the cluster. Clusters often require the use of hybrid name services
    that map a service name to multiple IP addresses.


    Use OS native performance monitoring tools to gauge the general wellness of the
    server platform. Again, this will be much easier if Samba is the only service
    running on the machine. Look for problems indicated by high CPU activity, large
    amounts of spawned processing, long scheduling queues, large memory usage, and
    high paging rates.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'System sluggishness related to IO can be monitored using the UNIX iostat command.
    Use the -d option to display disk IO activity. For each disk, statistics include
    the number of transfers per second, bytes transferred per second and milliseconds
    per average seek. Note that not all drive types will report seek times. You can
    also specify a time interval and count for recording activity snapshots over time.


    ```

    # iostat -d [drive ...] [interval] [count]

    ```


    Take a close look at Samba locking options. For shares that require locking, it
    is a good idea to make sure that opportunistic locking (oplock) parameters are
    enabled. oplocks allow clients to use aggressive caching and can achieve performance
    improvements over standard locking by as much as 30%. Also consider disabling
    strict locking. When enabled, strict locking directs the server to check lock
    status on every file access.


    The majority of network tuning should be handled at the OS level. Samba does provide
    a socket option parameter for adjusting tcp and socket settings like buffer size
    and keep alive time (Table 15.5). The tcp_nodelay value is the only one enabled
    by default. Any value adjustments made with these parameters need to fit corresponding
    OS level settings.


    ```

    socket option = <value list>

    ```


    ```

    socket option = tcp_nodelay so_reuseaddr

    ```


    # Table 15.5 Samba Socket Option Values


    +   - so_keepalive

    +   - so_reuseaddr

    +   - so_broadcast

    +   - tcp_nodelay

    +   - iptos_lowdelay

    +   - iptos_throughput

    +   - so_sndbuf=<integer>

    +   - so_rcvbuf=<integer>

    +   - so_sndlowat=<integer>

    +   - so_rcvlowat=<integer>


    # Logging


    It is always nice to have help when debugging a problem. One of the best ways
    to get help is by setting verbose logging and diagnostic options. You''ll need
    to make tradeoffs between performance hits due to generous logging activity and
    the problem state. Turn diagnostics up during incident sleuthing and down during
    normal operation.


    Log file and general diagnostic behavior is determined by the log file, max log
    size, and debug level parameters. Log files normally reside in the /usr/local/samba/var
    directory. By using substitution variables in the log file name, it is possible
    to generate logs by user, client NetBIOS name, or architecture. By default both
    smbd and nmbd generate logs named log.smb and log.nmb. The max log size'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'parameter is used to indicate when a log should be closed out, renamed to log.old,
    and a new log started. Message verbosity is controlled by the debug level value.
    Values range upward from 0. A special value of 100 combined with the passwd chat
    debug setting will record passwords in the log file.


    ```

    log file = /usr/local/samba/var/log.%m

    max log size = 10000

    debug level = 3

    ```


    Another option is to use the syslog and syslog only parameters to send Samba messages
    to the syslogd daemon. The syslog parameter indicates how Samba debug levels are
    mapped to corresponding syslog levels. You direct Samba only to log messages via
    syslogd. This might be useful when using syslogd to send logs to a common collection
    site either on the local machine or at a remote log server.


    # Backups


    If you don''t have backups then none of the rest of this information is going
    to do you much good. Every good system administrator knows that system recovery
    and resumption capability is only as robust as the backup strategy. For a Samba
    server, this primarily means maintaining backup copies of system configuration
    files like smb.conf, password databases like smbpasswd, and critical share data.


    You can also use the Samba smbtar command to back up and restore remote directory
    shares (Example 15.14). The target share may be owned by a Windows client or another
    Samba server. smbtar can be incorporated into UNIX shell scripts to automate backup
    operations using timed batch services like cron.


    # Example 15.14 smbtar - Dump & Restore


    # Incremental Dump


    ```

    Smbtar -s <NetBIOS name> -p <password> -x <Share Name> \\device> -I

    ```


    # Restore Share


    ```

    Smbtar -s <NetBIOS name> -p <password> -x <Share Name> \\device> -r

    ```


    # Help


    There is always a time in each system administrator''s career when outside assistance
    is required. This is not something we often talk about, but it does happen from
    time to time. It goes without saying that you''ve thoroughly perused all the documentation
    provided in the distribution samba-<version>/docs directory and the ancillary
    text on the Samba web site, http://samba.org (Figure 15.4). When you need that
    extra configuration tip or just want to commiserate with the rest of the Samba
    world check the mail lists and news groups listed in Table 15.6.'
  merge: -1
  img_proc: true
