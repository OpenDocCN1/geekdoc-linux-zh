    rather than Windows NT. Whatever the reason, you''ll find that Samba will perform
    adequately as a domain controller in the Windows 9x context. Domain control for
    Windows NT clients entails additional undocumented protocol support and still
    lies in the realm of the experimental Samba PDC effort.


