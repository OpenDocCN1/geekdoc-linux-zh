    # Server Message Block (SMB)


    Thus, far, we have taken a brief look at MS Windows network services and protocols
    at the network, transport, and to a limited degree, the session layer. Now we
    are ready to move higher in the stack and probe the Server Message Block (SMB)
    protocol, which is where Samba lives and breathes (Figure 3.2). SMB is a session-,
    presentation-, and application-layer protocol that provides a means for remotely
    sharing files, printers, and various communication resources between networked
    computers. The SMB protocol was first defined in a joint Microsoft and Intel document
    titled Microsoft Networks/OpenNET-File Sharing Protocol in 1987. Early SMB implementations
    included MS LAN Manager in 1987 and OS/2 LAN Server in 1988. In 1992 SMB became
    an Open Group interoperability standard, "Protocols for X/Open PC Interworking:
    SMB, Version 2,'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'X/Open CAE Specification C209." Microsoft, in collaboration with a number of
    computing and networking vendors, defined an enhanced version of SMB under a new
    title, the Common Internet File System (CIFS) protocol. CIFS version 1.0 has been
    submitted as a draft to the Internet Engineering Task Force (IETF) for consideration
    as an informational RFC.


    SMB is a connection-oriented protocol implemented on the NetBIOS API. The protocol
    provides a mechanism for Windows consumer and server applications to communicate
    in a request/response manner over a virtual circuit. The internal structure of
    each server message block is represented as a string of Intel format multi-byte
    values ordered least significant byte first. Each block begins with a fixed-length
    header, followed by a variable set of parameter fields, and finishes with a data
    buffer. The SMB command protocol can essentially be broken down into four types
    of operations; session, file, printer, and message. SMB session commands are used
    to set up a virtual circuit and validate access. File and printer commands permit
    an application to operate on files and spool jobs to remote printers. Message
    commands provide a means for passing alert, control, and informational messages
    between the consumer and server applications. The simplified SMB session described
    in Example 3.3 will give a feel for how SMB sessions are set up and released.


    # Example 3.3 SMB Session


    | Command | Description |

    |---|---|

    | SMBnegprot | Initial message listing dialects supported by the consumer application.
    Server responds with selected dialect. |

    | SMBsesssetup | The application''s credentials are passed for verification. Server
    responds with UID. |

