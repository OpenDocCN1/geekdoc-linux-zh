    It is still a bit early to tell how Samba can participate in the Windows 2000
    domain, tree, and forest model. Keep an eye on the Samba discussion archives concerning
    the latest Windows 2000 and Samba interoperability issues.


    # Summary


    +   - Domains are similar to workgroups but provide additional functionality and
    security via a shared security policy.

    +   - Samba supports full domain client compatibility and domain controller services
    for Windows 9x environments.

    +   - To configure Samba as a domain client:


