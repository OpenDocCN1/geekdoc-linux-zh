    # Chapter 9: Browsing


    # Overview


    In Chapter 8 we looked closely at the underpinnings of how Samba interoperates
    with WINS NetBIOS name service. Specifically, we learned how to configure Samba
    to operate as a WINS client, server or proxy agent. Now that we have the means
    for resolving the network address of a system from its NetBIOS name, how do we
    discover the full set of NetBIOS resource names that are available in a workgroup
    or domain?


    Like vendor product advertisements in shopping catalogs, workgroup and domain
    computers publicize their file and print shares in lists that are made available
    to perspective clients. This practice is known as browsing and is exclusive to
    Microsoft network architecture. A hierarchical set of browser servers (Table 9.1)
    collects and synchronizes the lists of shares called browse lists. The servers
    make the browse lists available to browser clients on request. A common browser
    client is the Windows Network Neighborhood client (Figure 9.1). The browsing scope
    of available shares is grouped by workgroup or domain. This simplifies the task
    of locating desired resources in large networks comprised of multiple workgroups
    and domains.'
