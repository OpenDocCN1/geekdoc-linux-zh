    # smbwrapper


    Samba doesn''t natively support mounting CIFS/SMB file shares on a UNIX client.
    There is some support for mounted file shares with operating system-specific implementations
    like Linux smbfs. What Samba does offer is an experimental tool called smbwrapper
    that allows UNIX clients limited file operations on CIFS/SMB services.


    smbwrapper exploits a capability in some UNIX implementations that support dynamic
    loading of shared libraries. It is based on a loadable library, smbwrapper.so,
    that distinguishes between CIFS/SMB file operations and standard UNIX file operations.
    As of this writing the code has been tested on the following operating systems:
    Linux 2.0 with glibc2 (RH5.1), Linux 2.1 with glibc2, Solaris 2.5.1 with gcc,
    Solaris 2.6 with gcc, SunOS 4.1.3 with gcc, IRIX 6.4 with cc, and OSF1 with gcc.'
  merge: -1
  img_proc: true
