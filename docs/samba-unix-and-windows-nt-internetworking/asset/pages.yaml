    +   - Minimum definition of a file share will include the share name enclosed
    in square brackets and a directory `path` parameter. A `comment` parameter describing
    the share is also desirable.

    +   - Special `[homes]` file share section allows users to access their UNIX `$HOME`
    directory from and SMB client.

    +   - Access control parameters can be applied to a file share restricting access
    by host, user, and privilege.

    +   - Non-browseable and hidden file parameters remove visibility of a share or
    file but do not restrict access if the share or file name is known by the client.

    +   - File access mode and mask parameters must honor the underlying UNIX permissions.

    +   - DOS/Windows `archive`, `system`, and `hidden` attributes can be mapped into
    UNIX `owner`, `group`, and `world` execute bits with the `map archive`, `map system`,
    and `map hidden` parameters.

    +   - Samba file name mangling is used to convert case sensitive UNIX long file
    names into DOS 8.3 format. Conversion mapping can be tailored per file share.

    +   - Automatic CRLF/LF file text conversion is not supported because Samba cannot
    accurately determine when a file should be converted. A CRLF/LF tool is available
    for allowing clients to convert files as needed: `ftp://samba.org/pub/samba/contributed/fixcrlf.zip`

    +   - Samba supports two basic locking mechanisms. DOS `share mode` locking and
    `windows opportunistic locking (oplocks)`.

    +   - Samba provides access to UNIX symbolic linked files by enabling the `follow
    symlinks` parameter. Link targets that reside outside a share''s scope can be
    made accessible using the `wide links` parameter.


