  md: 'for Windows 9x environments and start the server. The first time the server
    is invoked it will create a file in the /usr/local/samba/private directory to
    identify the domain SID. The file name is <domain name>.SID.


    With the server up and running, set up machine trust accounts for each member
    of the domain. The machine trust accounts are similar to user accounts with the
    exception that a "$" character is appended to the account name. First add a <machine
    client name>$ entry in the UNIX /etc/passwd file using the following format:


    ```

    <NetBIOS-name>$:*: <uid>:<gid>:<Client Description>: \

    /dev/null:/bin/false

    ```


    Once the account has been added to UNIX, add the account to Samba''s password
    file:


    ```

    $ smbpasswd -a -m <NetBIOS-name>$

    ```


    Finally, map Windows accounts and groups to their UNIX counterparts. This is done
    by specifying the location of mapping files with the domain user map, domain group
    map, and local group map parameters. Table 10.2 lists each parameter with the
    associated format for pairing the UNIX and Windows accounts and groups.


    # Table 10.2 UNIX/Windows Account and Group Maps


    domain user map = <path>

    Format:    UNIXuser = \\domain\\NTuser


    domain group map =

    Format:    UNIXgroup = NTgroup


    local group map =

    Format:    UNIXgroup = \\BUILTIN\\NTgroup

    *BUILTIN indicates default NT groups like "Administrator".


    # Windows 2000


    Windows 2000 builds upon the Windows domain model by organizing domains into a
    hierarchical tree structure supporting both central and distributed administration
    (Figure 10.7). The collection of domains and administrative policies is managed
    by Windows 2000 Active Directory. Active Directory is a combination of the legacy
    NT domain security architecture augmented with a set of open technologies that
    include Lightweight Directory Access Protocol (LDAP), Kerberos Version 5.0, and
    Internet-style Domain Name Service (DNS). Active Directory supports a mixed environment
    of Windows 2000 and Windows NT 4.0 domain controllers. Back-level clients can
    still log on using NT LAN Manager challenge/ response authentication.'
  merge: -1
  img_proc: true
