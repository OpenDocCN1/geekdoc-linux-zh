    # Summary


    +   - If you are upgrading from a previous release, verify your version using
    the `smbstatus` or `smbclient` commands and back up your current environment.

    +   - Download Samba distributions from the Samba Web site at http://samba.org.

    +   - Verify the distribution version from the package file name, `samba-<version>.tar.gz`.
    A version of "latest" indicates the current production release.

    +   - Decide whether to use a binary or source distribution.

    +   - If you will be making local modifications to the source, consider using
    the GNU Concurrent Versions System (CVS). Refer to http://samba.org/cgi-bin/cvs-web
    for read-only Web-based access to Samba CVS distributions.

    +   - Extract the distribution package in your source maintenance directory:

    +     ```

    +     $ gzip -dc samba-<version>.tar.gz | tar -xvf -

    +     ```

    +   - If you will be building a pre-version 2.x distribution, edit the Makefile
    to reflect your operating system configuration.

    +   - Build and install the distribution.

    +     1. `$ configure` Version 2.x and newer only.

    +     2. `$ make` Compile.

    +     3. `$ make install` Install binaries.

    +   - Install a copy of the Samba configuration file `smb.conf` in `/usr/local/samba/lib`.
    A sample `smb.conf` file can be found in the `./examples` subdirectory of the
    distribution tree.

    +   - Configure Samba `smbd` and `nmbd` startup either as running daemons or under
    `inetd` control.

    +   - Start the service and verify with the `nmblookup` and `smbclient` commands.


