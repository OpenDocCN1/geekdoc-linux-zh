- pgno: 97
  md: 'explore various Samba authentication and access control mechanisms. We''ll
    look at how Samba can be used to integrate and synchronize UNIX and Windows account
    information, interact with alternative authentication services, and reduce the
    use of clear-text passwords on the network.


    # Authentication Mechanisms


    Samba supports four basic ways to regulate a network client''s access rights to
    a particular resource share. First, Samba can allow or deny connection requests
    based on the client''s IP address. This provides a coarse level of security. Any
    user with an account on a client computer that has an authorized IP address will
    be permitted to access the share. Second, Samba can check the client''s proffered
    clear-text username and/or password against a UNIX authentication resource like
    `/etc/passwd`, NIS, or Kerberos. Clear-text passwords are encrypted by Samba using
    the associated UNIX cipher before verifying the credentials against the authentication
    resource. Third, Samba can negotiate NTLM style encryption with the client and
    validate the hashed password against a separate `/usr/local/samba/private/smbpasswd`
    file. This option requires the maintenance and possibly the synchronization of
    both the server''s UNIX `passwd` database and the `smbpasswd` database. Lastly,
    Samba can pass the client''s credentials to a third-party authentication server
    for validation. The remote authentication server might be another Samba server
    or an NT domain controller. Once the credentials have been validated by the remote
    server, access is granted to the requested resource.


    # Authentication by IP Address


    In the "Security and Access Control" section of Chapter 6, we discussed restricting
    access to shares by client IP address using the `hosts allow` and `hosts deny`
    parameters. Specify trusted or forbidden computers as parameter values by NetBIOS
    name, by IP address, or by using a subnet mask. The `except` keyword can be used
    in conjunction with a subnet mask or IP number wild card format to include or
    exclude individual machines from a group (Example 7.1).


    # Example 7.1 Restricting Access by Host Name or Host IP Address


    ```

    hosts allow = 192.168. except 192.168.0.10

    hosts deny = frodo, bilbo

    hosts allow = 149.125.10.0/255.255.255.0

    ```


    # Authentication Level


    The modus operandi for user-level authentication is determined by the global `security`
    parameter setting. Although the `security` parameter accepts one of four predefined
    values, `share`, `user`, `server`, and `domain`, in reality Samba only supports
    two levels of user authentication, `share` and `user`. The `server` and `domain`
    options are effectively extensions of user-level authentication. This setting
    dictates what credentials are required when a client attempts to connect to a
    shared resource. Generally, if you will be synchronizing user names and passwords
    between your Samba server and your client workstations, you will want to specify
    `user-level` security. If your client user names and passwords don''t match those
    on the Samba server and you will be supporting older Windows for Workgroups clients,
    designate share-level security.


    ```

    security = <share, user, server, domain>

    ```'
