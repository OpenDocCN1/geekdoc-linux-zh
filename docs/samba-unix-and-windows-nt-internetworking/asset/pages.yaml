    into play. When started, lpd digests printer and queue definitions listed in the
    /etc/printcap file (Example 2.9). The printcap file specifies all the attributes
    associated with each printer and queue. This includes whether banner and/or trailer
    pages are printed, if special back-end drivers or filters are required for the
    device, what access controls are in force, and whether accounting information
    should be logged. In the case of a remote queue, the remote site is identified.


