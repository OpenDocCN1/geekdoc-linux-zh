    # Access Control


    The /etc/passwd and /etc/group files form the foundation of access control in
    UNIX. In general the right to operate on an object is governed by ownership or
    membership in a group associated with the object. Newer versions of UNIX have
    augmented access control mechanisms by including support for Access Control Lists
    (ACL). ACLs allow finer granularity than do operations allowed on an object and
    permit the end-user to set up and control custom groups. On the downside, ACLs
    are not easily mapped between environments and may not work over remote file shares.


    # Passwords


    The UNIX password file, /etc/passwd, is a table which identifies all users permitted
    to log-in to the system (Example 2.10). Each user account is assigned a text string
    Account Name and a numeric identifier, called a UID, which is unique to the individual
    computer. Another numeric identifier associated with the user is a default group
    identifier, GID. Basically the UID and GID tags are used by the system in managing
    access control. The password file may or may not include the encrypted password
    for the user population. Because the password file is visible to all users, some
    systems have moved the encrypted passwords into a restricted access file called
    the shadow password file. This defeats the ability to use the visible password
    file easily by password cracking programs. When shadow passwords are in effect
    a place holder character, !, is inserted into the password field in /etc/passwd
    indicating that the associated encrypted password can be found in the shadow password
    file. Other information in the password file may include personal name and address
    data in the gecos field, the user''s home directory, and the default shell. Each
    field in the password file is separated by a colon.


    ```

    Accout Name::UID:GID:<Gecos strings>:<Home Directory>:<Shell>

    ```


    # Example 2.10 /etc/passwd


    ```

    root::0:0:System Overseer::/bin/ksh

    daemon::1:1::/etc:

    bin::2:2::/bin

    sys::3:3::/usr/sys:

    adm::4:4::/usr/adm

    uucp::5:5::/usr/lib/uucp:

    stimpy::4084:30:Stimson Cat:/ul/stimpy:/bin/ksh

    ```


    Parsing large password files can cause significant delays in command response
    time. To improve response time some UNIX implementations support mirroring /etc/passwd
    information in an indexed set of dbm databases. The mkpasswd command reads /etc/passwd
    and creates the keyed directory file, /etc/passwd.dir, and a data file, /etc/passwd.pag.
    Password dbm support is not required, but is provided as an option'
  merge: -1
  img_proc: true
- pgno: 30
