    +   - An unrestricted client passes a user name and password that maps to a permitted
    UNIX account name.

    +   - A client previously registered a user name with the server and follows up
    by supplying a valid password.

    +   - The client''s NetBIOS name and previously used user name are checked against
    the supplied password.

    +   - A client has a previously validated user name/password pair and supplies
    a validation token to the server.

    +   - The share is configured with user list parameter and the client supplies
    a valid'
