    ```

    deroest:1004:NO PASSWORDXXXXXXXXXXXXXXXXXXXX: \

    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXX: [U ]: \

    LCT-00000000:Jim DeRoest:/home/deroest:/usr/bin/ksh

    ```


    # smbpasswd Command


    The smbpasswd command is used to set and update the two 32-byte fields in the
    smbpasswd file. Note that, unlike the UNIX passwd command, smbpasswd should not
    have setuid root permission for Samba releases as of version 1.9.18p4. This version
    of smbpasswd acts as a client requesting that the authoritative Samba smbd daemon
    or NT domain PDC update the password on behalf of the end-user. Like its UNIX
    counterpart, the smbpasswd command first requests the existing password and then
    prompts twice for the new password (Example 7.6). Users with root permissions
    can include the -u <username> option to set the indicated users password.


    # Example 7.6 smbpasswd Command


    | Command | Description |

    |---|---|

    | $ smbpasswd <-u username> | Add -u if root. |

    | old password > | Old value if not root. |

    | New SMB password: | New value. |

    | Repeat New SMB Password: | New value again. |


    # Migrating from Clear-Text to Encrypted Passwords


    For sites that started out using clear-text passwords and wish to migrate to encrypted
    passwords, Samba can automate this process by setting the update encrypted parameter.'
