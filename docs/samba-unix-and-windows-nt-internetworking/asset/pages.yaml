- pgno: 19
  md: '```

    #

    127.0.0.1      localhost

    128.95.135.13  daffy

    128.95.135.24  louie

    128.95.142.30  huey

    140.27.133.4   donald

    ```


    To address the scaling problem, a hierarchical namespace methodology was adopted
    for the Internet community which enforces uniqueness and supports timely distribution
    of updates. This namespace system is a client/server protocol called BIND Domain
    Name Service (DNS).


    Computers and organizations in DNS are identified by a domain name. The domain
    name is a string tuple delimited by "."s which represents the administrative hierarchy
    of the namespace (Table 2.3). Domain names are usually represented in two to four
    levels. Note that there is no implied mapping of domain names to IP number octets
    or subnets.


    # Table 2.3 Domain Names


    Format: hostname.subdomain.subdomain.topdomain


    Examples:

    - microsoft.com

    - vnet.ibm.com


    A hierarchical name resolving protocol called BIND is used to recursively query
    domain name servers until a domain name is resolved to an IP number. In the DNS
    hierarchy (Figure 2.3), upper-level domain servers need only record the names
    of the next lower level of the name tuple along with the IP numbers of the name
    servers that resolve addresses for that level. All name servers must know the
    addresses of the top level Internet name servers which maintain a set of well-known
    top-level domain names (Table 2.4). The DNS system supports local management of
    the namespace and ensures timely information to the network at large.


    # Table 2.4 Top Level Domains


    |  |  |

    |---|---|

    | edu | Education |

    | gov | Government |

    | mil | Military |

    | org | Organizations |'
