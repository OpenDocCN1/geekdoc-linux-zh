    # Chapter 10: Domains


    # Overview


    Thus far, we''ve generalized our Samba configuration discussions so that they
    would apply equally well in either a workgroup or a domain network model. Samba
    services like WINS and master browser work equally well for workgroups and domains.
    In this chapter we''ll depart from the generalized track and focus specifically
    on integrating Samba in a Windows domain.


    # Domains vs. Workgroups


    Windows domains are similar to workgroups in that they represent a group of users,
    services and computers that collectively share a common namespace. Domains differ
    from workgroups, in that a domain enforces a common security policy and management
    structure across its membership. Account directory information is stored in a
    secure central repository called the Security Accounts Manager (SAM). The SAM
    database is maintained on the primary domain controller and replicated on each
    of the backup domain controllers (see Chapter 3). What this means for the system
    administrator is that there is a central location for managing the accounts, passwords,
    access controls and policies for the entire domain. End-users benefit from the
    domain model in by gaining access to all domain resources via a single logon.


    Domains improve access security over workgroups because client authentication
    is performed only once using a secure communication channel with the PDC during
    domain logon. Once authenticated, client access to resources is governed by applying
    access controls based on the client''s group memberships. Domain groups are a
    means of categorizing users with similar needs and work profiles.


    In contrast, each workgroup client maintains a persistent local cache of accounts
    and passwords required to access network resource. A separate credential cache
    is created for each active user and stored in the \windows directory as <username>.PWL.
    Windows opens the cache file using the associated user''s logon password as a
    key. During connection to a network resource, each entry in the user''s credential
    cache is tried until authentication is either accepted or denied. Credentials
    stored in these cache files are extremely vulnerable to security threats due to
    the weak encryption employed and their persistent nature across logons by different
    workstation users.'
