    # Running Daemons


    If you are confident that all network communication paths are functioning correctly,
    then the next step is to certify that the Samba smbd and nmbd daemons are running
    and listening for connections. Display the process status of smbd and nmbd with
    the ps command (Example 15.4).


    Review inetd configuration (see "Configuration Files" section) to verify that
    the daemons will be spawned when SMB services are requested. Check the smb.log
    and nmb.log files in /usr/local/samba/var for diagnostic messages indicating any
    startup or communication anomalies.


    # Example 15.4 ''ps'' Check Daemon Process Instance


    ```

    # ps -ef | grep smbd

    root 448 1 0 07:25 ? 00:00:00 /usr/local/samba/bin/smbd -D


    # ps -ef | grep nmbd

    root 446 1 0 07:25 ? 00:00:00 /usr/local/samba/bin/nmbd -D

    ```


    Assuming that the smbd and nmbd daemons are up and running, next look to see if
    they are listening for incoming connection requests. Invoke netstat with the -a
    option to list the set of port listening services on the server. You can thin
    the list down to just the NetBIOS services by piping the command into grep (Example
    15.5).


    # Example 15.5 Samba Listing to NetBIOS Ports


    ```

    $ netstat -a | grep netbios

    ```'
