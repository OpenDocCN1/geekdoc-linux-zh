    The list of available shares on each computer in a workgroup or domain is broadcast
    by the owning system out to the network community. Because the announcement is
    via a network broadcast, a local master browser server is required on each subnet
    to collect and collate the set of shares into a browse list. The local master
    browser is elected from a set of computers on the subnet that is capable of maintaining
    and serving browse lists. The election process is a network-bidding feud where
    the ante is based on the contender''s OS level and revision, and its desire to
    be a master browser. This ante or'
