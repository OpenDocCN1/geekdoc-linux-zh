- pgno: 16
  md: 'It will be helpful to understand a few of the columns displayed in the list
    of running processes when managing execution resources in a running system. The
    COMMAND and CMD columns represent the program being run in the process address
    space. Along with its PID, each process records the integer ID of its Parent Process
    Identifier (PPID). Process short-term CPU usage, execution priority, and nice
    value are displayed in the PRI, C, and NI fields in the SYSV display. The BSD
    %CPU field represents the percentage of CPU resources that a process has used
    in its life time.


    In every process universe there is a special set of processes called daemons.
    A daemon is not some miscreant process spawned by some evil hacker to wreck havoc
    on a system, but a collection of one or more processes that provide some well-defined
    service. For example, the sendmail daemon manages and distributes electronic mail
    on behalf of the UNIX user community. In the case of Samba, the smbd daemon manages
    access to shared resources. The Samba nmbd daemon provides name service to assist
    clients in locating resource shares.


    # Init


    I''ve already mentioned the special role that init plays as the ancestor of all
    processes on the running system. Init is responsible for spawning some of the
    important system daemons at system startup and "respawning" processes that may
    have exited due to some unforeseen event. These processes are identified in a
    configuration file called /etc/inittab. Entries in the inittab configuration file
    take the form:


    ```

    <identifier>:<runlevel>:<action>:<command>

    ```


    The identifier field uniquely identifies the service. The runlevel corresponds
    to the running system state which will cause the action to be invoked on the command.
    Runlevels are represented as numbers 0 through 9 and indicate various system states.
    An example inittab entry for the cron daemon which time schedules batch jobs on
    UNIX would look like:


    ```

    cron:2:respawn:/usr/sbin/cron      Inittab cron process entry

    ```


    As we shall see in a following section, there are other mechanisms available for
    spawning service daemons. In the case of network-based services like Samba, it
    is often desirable to initiate an instance of a service daemon only at the actual
    time when its services are requested by a client.


    # Networking


    Understanding UNIX TCP/IP network configuration and administration is important
    in this context because it is used as the transport for Samba NetBIOS services.
    NetBIOS over TCP/IP (NetBT) is defined in RFCs 1001 and 1002. We will take a closer
    look at NetBT in the Windows networking section of the following chapter.


    # TCP/IP


    When we talk about TCP/IP we are referring to a larger set of protocols that comprise
    the general functionality associated with service (Table 2.2). In the TCP/IP stack
    model, these protocols are bundled into a smaller number of layers than defined
    in the OSI model.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Table 2.2 Common Lower-Layer Internet Protocols


    |  |  |

    |---|---|

    | IP | Internet Protocol |

    | ICMP | Internet Control Message Protocol |

    | ARP | Address Resolution Protocol |

    | RARP | Reverse Address Resolution Protocol |

    | TCP | Transmission Control Protocol |

    | UDP | User Datagram Protocol |


    ![](img/7684008b1d7775727df27d44aed5b3f0_17_0.png)


    # Figure 2.2: TCP/IP and OSI stack


    The Physical layer represents a conglomeration of hardware interfaces and protocols
    that interoperate via the conduit defined in the upper layers. These interfaces
    employ a wide range of data speeds and physical architectures.


    The Internetwork layer combines the OSI data-link layer and a portion of the OSI
    network layer. The layer is comprised of two protocols, Internet Protocol (IP)
    and Internet Control Message Protocol (ICMP). IP and ICMP are connectionless protocols
    that provide the basic data buckets and control in the network.


    The Transport layer defines two protocols, Transmission Control Protocol (TCP)
    and User Datagram Protocol (UDP). TCP ensures a reliable ordered transport whereas
    UDP service is unreliable and does not ensure delivery.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'The Application layer in the TCP/IP suite, like the OSI model, implements the
    user interface. Client/server protocols are most often defined at the application
    layer.


    # Addressing


    A unique IP address is assigned by the network administrator to represent each
    computer in the network. The IP address abstracts the hardware address to a more
    general use. At this address level we are not concerned with the adapter interface
    type used on a particular machine. Each IP address is a 32-bit number represented
    as four octets. Each octet is a number in the range of 0 through 255:


    ```

    <0-255>.<0-255>.<0-255>.<0-255>

    ```


    In large networks, it is often desirable to group and partition computers to localize
    traffic patterns, hide internal network structure, simplify information routing,
    and enforce security policy. This is done using a system called subnets. A subnet
    mask is used to mask out a portion of the IP address to determine how traffic
    from the particular computer will be routed to other computers in the network.
    When a machine within the organization wants to send a packet to another system,
    it applies the subnet mask to the destination address to see if the address is
    on the local network or if it must send it to a router for delivery.


    The subnet mask is a four-octet number that indicates which bits in the address
    are to be masked as the network and subnet portion of the address. The low-order
    bits of the mask designate the host portion of the address.


    ```

    netmask 0xffffffff0 14 hosts per subnet (0 and 15 excluded)

    netmask 0xffffffff8 6 hosts per subnet (0 and 7 excluded)

    ```


    Understanding the subnet structure of the network will be important when you begin
    defining resources to be shared between systems which may exist on different subnets.


    # Domain Name Service


    Although IP addresses uniquely identify computers and associated resources on
    the network, they are not easily remembered by human beings when trying to find
    those computers and resources. The simple solution to this kind of brain fault
    is to map easily remembered text strings to the associated IP numbers. A table
    of machine names and IP addresses can be installed on each computer to act as
    a directory of known systems. Under UNIX this directory of host name and IP number
    pairs is called the /etc/hosts table (Example 2.2).


    Host tables work well for small networks but immediately break down as we scale
    up to large numbers of systems. Mapping host names to IP numbers for a large set
    of networks like the Internet is subject to the same scaling problems encountered
    when mapping personal and business names to phone numbers for all the cities in
    a particular country. There are far too many name collisions and the phone book
    is too large for timely incorporation and distribution of updates.


    # Example 2.2 /etc/hosts


    ```

    #

    # IP Number      Host Names

    ```'
