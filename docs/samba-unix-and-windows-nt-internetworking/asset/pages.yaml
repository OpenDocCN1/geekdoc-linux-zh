  md: "At this point, we've completed the installation and must now decide how we\
    \ want to run the service. The two Samba service daemons, smbd and nmbd, may either\
    \ be started as running daemons at system boot time or be invoked when needed\
    \ by inetd. The latter method will conserve system resources in environments where\
    \ Samba services are lightly used. For high-demand environments, it may be faster\
    \ to have the services already up and running when they are required.\n\nTo start\
    \ Samba services as always-active daemons at system boot time, add the stanzas\
    \ listed in Example 5.4 to your /etc/rc.local startup script for BSD UNIX installations\
    \ or as part of your /etc/rc.d/init.d functions under SYSV UNIX. The commands\
    \ can also be entered from the command line as root for testing.\n\n# Example\
    \ 5.4 Samba Daemon Startup\n\n```\n```\n/usr/local/samba/bin/smbd -D\n/usr/local/samba/bin/nmbd\
    \ -D\n```\n```\n\nTo invoke Samba services under inetd, first add the service\
    \ ports to /etc/services (Example 5.5). Then add the startup stanzas to /etc/inetd.conf\
    \ (Example 5.5). Note the use of tcpwrappers /usr/sbin/tcpd parameter. It is a\
    \ good idea to restrict access to the service using a tool like tcpwrappers. Remember\
    \ that you will have to send a HUP signal to the inetd process to activate these\
    \ changes in the running system.\n\n# Example 5.5 Samba inetd Startup\n\n# /etc/services\n\
