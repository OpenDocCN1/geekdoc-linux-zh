    # smbprint


    Samba supports UNIX client printing to remote Windows printers via a spooling
    input filter, **smbprint**. The **smbprint** filter is another script wrapper
    for the `smbclient` command. **smbprint** pipes input into **smbclient** which
    handles the connect session with the remote Windows spooling service. Two versions
    of the **smbprint** script are provided, `smbprint` (BSD) and `smbprint.sysv`
    (SYSV). The scripts are located in the Samba distribution subdirectory `./examples/printing`.
    Refer to the "Windows Printers" section of Chapter 12 for details on using the
    **smbprint** interface.


    # Windows 9x and Windows NT


    In the preceding chapters, I discussed Windows client configuration as it related
    to the various CIFS/SMB services provided by Samba. I''ll briefly cover the basics
    of Windows client configuration again here, but will refer you to those chapters
    that specifically address topics like NetBIOS over TCP, name service, workgroups,
    and domains for detailed information. I''ll illustrate Windows 9x setup because
    Windows NT platforms are quite similar.


