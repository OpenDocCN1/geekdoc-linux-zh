  md: 'Domains also offer a means for authorizing access to resources residing in
    separate domains through trusts. A trust relationship is a link that logically
    combines two domains into an administrative unit. The trust relationship may be
    applied one way (domain A trusts domain B, but domain B does not trust domain
    A) or two ways (domain A and domain B trust each other).


    # Samba and Domains


    Unlike its extensive WINS and browser implementations, Samba''s domain functionality
    is not quite as feature-inclusive. This is not to say that Samba can''t play a
    part as a client or controller in a domain environment.


    A Samba server can participate fully as a client in an NT domain. Samba can also
    operate as a domain controller within limits. Acting as a domain controller in
    a Windows 9x environment Samba can support domain logons, logon scripts, user
    profiles, and system policies. Samba doesn''t support SAM database replication
    nor does it "officially" support remote management via Windows NT domain administration
    tools. Work is under way to provide Samba PDC functionality in a Windows NT client
    environment. This effort includes support for interoperation with selected Windows
    NT domain tools. You will find more about Samba PDC development and the availability
    of experimental source code later in the chapter.


    # Domain Client


    To add a Samba server as a domain member we must create a machine account and
    password for the server and register it with the domain''s PDC. Begin by stopping
    the smbd and nmbd daemons on the Samba server. Next, update the server''s smb.conf
    file to reflect the attributes of the target domain (Table 10.1). The security
    parameter should be set to a value of domain. The netbios name and workgroup parameters
    must identify the server''s NetBIOS name and the domain name respectively. The
    password server parameter should list the name of the PDC as well as any BDC''s
    for the domain. Because domain logon will require the use of an encrypted password,
    enable the encrypt passwords parameter. Set the machine password timeout interval
    to indicate how often smbd should change the machine password. The default value
    is once a week.


    # Table 10.1 Samba Domain Member Parameters


    ```

    ```

    security = domain

    netbios name = <NetBIOS name>

    workgroup = <domain name>

    password server = <PDC BDC1 ... BDCn>

    encrypt passwords = true

    machine password timeout = <seconds>

    ```

    ```


