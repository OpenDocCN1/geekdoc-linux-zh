    # Summary


    +   - Workgroup and domain clients view available shares via *browser client*
    tools that request *browse lists* from *master browser* servers.

    +   - Master browsers for each subnet are elected based on *OS level* and *desire*
    from the set of machines capable of maintaining and serving browse lists. The
    election losers become *backup browsers* for availability purposes.

    +   - Basic configuration required for Samba participation in a browser environment
    include designating the *netbios name*, *workgroup name*, *announce as* Windows
    operating system type, and the *announce version*. The *guest account* parameter
    must also map to a valid UNIX account for $IPC service.

