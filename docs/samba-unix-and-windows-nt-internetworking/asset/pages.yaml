    # Macintosh


    The DAVE toolkit distributed by Thursby Software Systems, Inc., brings the CIFS/SMB
    world onto the Macintosh desktop. DAVE implements all services defined by the
    CIFS protocol, as well as WINS support and Windows domain logins. A DAVE client
    can act as both CIFS/SMB client and CIFS/SMB server. Other features include support
    for WinPopup messages and network printing.


    DAVE clients access CIFS/SMB services using the standard Macintosh chooser interface
    (Figure 13.6). From the chooser, users can interact with Windows workgroup and
    domain services just as they would if they resided in a local Appletalk network.
    Windows clients interact with resources residing on a Macintosh server using standard
    browse interfaces like Network Neighborhood.


