  md: '+   - Domain account can be viewed using the "User Manager for Domains."

    +   - Viewing resources on the Samba PDC via Server Manager from an NT client

    +   - Windows 95 clients will allow user-level security to be set, but will not
    currently allow browsing of accounts.

    +   - Machine account password updates

    +   - Changing of user passwords from an NT client

    +   - User name <-> RID mapping

    +   - Some tools work with this such as the NT Sec tools from Pedestal software.

