    # Summary


    +   - UNIX has a three-tiered architecture: kernel, shell, and command layers.

    +   - Executing tasks and programs are called *processes* and are identified by
    *PID* number.

    +   - Server processes are called *daemons*.

    +   - *Init*, PID 1, is responsible for spawning system processes, which are identified
    in the `/etc/inittab` file.

    +   - TCP/IP is a network protocol with four layers: *physical*, *internetwork*,
    *transport*, and *application*.

    +   - Each computer on the network is identified by a four-octet IP number.

    +   - Groups of networked computers are partitioned using *subnets* to isolate
    and manage traffic and to enforce security policies.

    +   - A hierarchical dynamic network name service called the *Domain Name Service
    (DNS)* resolves domain name to IP numbers.

    +   - The UNIX DNS server is called *named*.

    +   - DNS server addresses are identified in `/etc/resolv.conf`.

    +   - The *inetd* server starts network servers when requested by a client defined
    as `/etc/inetd.conf`.

    +   - Well-known service name-to-port mapping is recorded in `/etc/services`.

    +   - UNIX file systems are contained in collections of disk blocks called *partitions*.

    +   - File system structure within a partition is represented as the *superblock*,
    *inode table*, and *data blocks*.

    +   - File systems contain a hierarchical collection of *files* and *directories*,
    each of which is recorded in an inode.

    +   - All UNIX objects are abstracted as files.

    +   - File and directory access controls are recorded in the inode indicating
    *read*, *write*, and *execute* permissions for *owner*, *group*, and *world*.

    +   - NFS is a stateless networked file system for sharing files and directories.'
  merge: -1
  img_proc: true
