    # Security and Access Control


    In the following chapters, we''ll investigate the specific access controls and
    defenses on hand for hardening security and access rights to Samba shares and
    services. In preparation, it will be helpful to take a brief overview of some
    of the general access management parameters and facilities provided by Samba.
    As the saying goes, "An ounce of prevention is worth a pound of cure."


    The first step in securing your resources is to welcome your friends and deny
    your enemies. Use the `hosts allow` and `hosts deny` parameters in the global
    and share sections to restrict access to those hosts that are trusted members
    of your workgroup or domain. You can specify computers by name, IP number, or
    by using a subnet mask. The `except` keyword can be used in conjunction with a
    subnet mask or IP number wild card to exclude individual or groups of machines
    (Example 6.4).'
