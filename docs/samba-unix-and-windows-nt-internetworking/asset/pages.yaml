    +   - **-s smb.conf path** indicates an alternate path name for the Samba configuration
    file.

    +   - **-B IP addr** specifies the broadcast address for a NetBIOS name service
    request.

    +   - **-O socket options** lists the set of TCP socket options to be used on
    the client socket. The set of supported socket options is listed in the smb.conf
    (5) man page. The syntax is option=value. Any options used should correspond to
    those supported by the operating system.

    +   - **-R name resolve order** designates the order in which the various name
    service resources will be queried in order to resolve a NetBIOS name to network
    address. Options include lmhosts (check lmhosts file), hosts (check DNS, NIS or
    /etc/hosts), wins (check WINS), and bcast (broadcast query).

    +   - **-M NetBIOS name** allows you to send a WinPopup message to the designated
    server. The message text can be piped into smbclient or entered interactively
    after a connection is established. Enter a control-d to terminate and send the
    message.

    +   - **-i scope** identifies the NetBIOS scope to be used when generating NetBIOS
    names. The option is rarely used.

    +   - **-N** will inhibit prompting for a password. This is useful when the target
    service does not require an access password. The option is assumed if a password
    was supplied on the command line.

    +   - **-n NetBIOS name** indicates an alternative NetBIOS name for the local
    machine. If it is not supplied, smbclient will use the local machine''s host name.

    +   - **-d debug level** sets the value, 0-10 or "A," to indicate the verbosity
    of messages and warnings for debugging purposes. The higher the value, the more
    output. If the level is set to a value of "A," all output messages will be printed.
    The default value is "0."

    +   - **-P** indicates that the target service should be treated as a printer.
    This option is no longer used in Samba version 2.0 and newer.

    +   - **-p port** is used to indicate an alternate server TCP port number. The
    default well-known port number for a CIFS/SMB server is 139.

    +   - **-l log base name** indicates the base text string to be used for the activity
    log. The default is specified at compile time.

    +   - **-h** requests display of the usage information for smbclient.

    +   - **-I dest IP** indicates the destination IP address of the target server
    ID dotted decimal form. Use of this option circumvents a name service lookup.

    +   - **-E** reroutes messages from stdout to stderr.'
