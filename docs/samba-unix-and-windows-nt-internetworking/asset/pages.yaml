    # Binary or Source


    Once you have navigated to an archive site, you need to decide whether to download
    a binary or source code distribution. Precompiled packages are available for a
    number of popular operating systems including AIX, BSDI, Digital UNIX, Linux,
    SCO, Solaris, and many others. The binary distributions can save time and trouble
    for those who don''t want to roll their own Samba configuration. If you like that
    warm and fuzzy feeling you get from compiling your own software, then select the
    source distribution. You''ll want source if you''re interested in playing with
    the latest alpha and beta releases. Building Samba from a source distribution
    is very easy with the GNU `autoconf` available in version 2.x. There is more about
    `autoconf` later in the chapter.


    Note that if you are building a Samba version prior to 1.9.81 and need to support
    SAM-encrypted password authentication for Windows 9x and Windows NT, you will
    need to obtain a copy of the `libdes` library. `libdes` is used in older versions
    of Samba to enable DES (Data Encryption Standard) encrypted passwords. DES technology
    was derived from work done by IBM in the early 1970s. Distribution of DES algorithms
    is governed in the United States by the International Traffic and Arms Regulations
    (ITAR). The good news is that as of version 1.9.18, Samba contains a modified
    DES algorithm that can be distributed without violating ITAR or raising the hackles
    of the U.S. National Security Agency.


    # CVS


    Another reason for choosing a source code distribution is the ability to add your
    own modifications. One of the most common modifications is integrating Samba with
    unsupported authentication and authorization mechanisms. If you need to modify
    the source code, consider using GNU Concurrent Versions System (CVS). CVS is a
    multiuser source code control system that allows developers to check out snapshots
    of source code and concurrently integrate their modifications into the source
    tree. Using CVS makes it easy for you to reapply local modifications into new
    releases of Samba. Read-only CVS access to the Samba source tree is available
    via the Web at http://samba.org/cgi-bin/cvsweb/ (Figure 5.4). The CVS client software
    and CVS information can be obtained from http://download.cyclic.com.'
