  md: 'Enable domain logons in Windows 9x by selecting Start ➔ Settings➔ Control Panel➔
    Network from the desktop. Make sure that Client for Microsoft Networks is installed.
    Open the properties tab. Set the "Logon to Windows NT domain" box and enter the
    name of the domain (Figure 10.6). Apply the changes and restart. The Windows Logon
    box should now display user, password, and domain options. The first time each
    user logs on to the domain he/she will be asked about saving the user profile.
    Each user should select Yes. Check the Samba roaming profiles store to verify
    that a profile was created for the new user.


    ![](img/7684008b1d7775727df27d44aed5b3f0_140_0.png)


    Figure 10.6: Client for Microsoft Networks Properties


    # Primary Domain Controller


    In the chapter introduction I mentioned the Samba PDC development project. This
    idea is to extend Samba''s domain controller capability to include Windows NT
    PDC functionality. A fair amount of work has already been completed. Unsupported
    versions of the Samba PDC-enabled code are available from the Samba download sites
    for evaluation and testing. According to the latest Samba NT Domain FAQ, here
    is information on which PDC features are available and which are not.


    Currently included features are:


    +   - The ability to act as a PDC for Windows NT 3.51 Service Pack 5 and Windows
    NT 4.0 Service Pack 4 clients. This includes adding NT machines to the domain
    and authenticating users logging into the domain.'
