  md: '# NFS


    A common way of sharing files and directories between networked UNIX systems is
    Sun''s Network File System (NFS). NFS is a stateless file sharing protocol based
    on a set of Remote Procedure Calls (RPCs) and an External Data Representation
    (XDR) specification to trap, reroute, and communicate file operations and attributes
    between machines. NFS is based on a client/server architecture that enables applications
    to interoperate seamlessly on remote files and directories without regard to their
    locale. Sun placed this architecture in the public domain and it became a de facto
    standard for distributed file systems under UNIX. NFS is also supported on many
    other operating systems including Windows. Again, it is important to understand
    NFS and its relationship to Samba directory shares in mixed environments.


    NFS servers rely on a number of daemons to manage distributed file system services
    (Table 2.9). I/O requests from multiple clients are multiplexed through a configurable
    number of nfsd and biod daemons. The nfsd daemons manage file I/O operations and
    the biod daemons control block I/O services. NFS servers register themselves with
    the portmap daemon which maintains the list of RPC applications on a particular
