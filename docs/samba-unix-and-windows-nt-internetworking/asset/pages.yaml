    # Debugging Print Shares


    To debug a print share:


    +   - Verify that the printer name is a valid entry in the printer configuration
    file with the testprns command:

    +     ```

    +     $ testprns <printer name> <printcap file>

    +     ```

    +   - Try setting the print command parameter to do a simple cp of the incoming
    print file into a temporary file. You can then verify the output using and editor:

    +     ```

    +     print command = cp %s /tmp/print.tmp

    +     ```

    +   - Make sure /dev/null is world writeable. Samba uses /dev/null to discard
    messages and extraneous output from the designated print command.

    +   - Make sure that all the commands and scripts used in the various printer
    command parameters include absolute path names or are in Samba''s $PATH environment.

    +   - Check for problems in the /etc/printcap definition.

    +   - Try connecting to the printer using smbclient. Once you have successfully
    connected, try printing a file:

    +     ```

    +     smbclient ''\\server\printer'' -P

    +     ```


