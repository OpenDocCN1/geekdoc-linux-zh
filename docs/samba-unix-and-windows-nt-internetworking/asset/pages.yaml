- pgno: 58
  md: 'The *Open Source Initiative (OSI)* represents the next level in the evolution
    of grassroots, open software organizations. Like its predecessors, OSI sprang
    up from the collective conscience of an Internet community of users whose firm
    belief is that the lifeblood of the Internet is the open sharing of ideas and
    software. An OSI branding indicates a commitment by the technology provider that
    it, too, adheres to these same ideals by providing source code and specifications
    and encourages further development of the technology by the community at large.


    The idea for an open-source branding emerged from a meeting of a few like-minded
    champions of a *gospel of open technology*, in February 1998 (see http://www.opensource.org/history.html).
    Participants included Todd Anderson, Chris Peterson (Foresight Institute), John
    Hall and Larry Augustin (Linux International), Sam Ockman (Silicon Valley Linux
    Users Group), and Eric S. Raymond. The catalyst for the discussion was the recent
    announcement by Netscape that it would make the source code to its browser available
    free of charge. The intent of the meeting was to set specifications that characterized
    an open technology, and to find a suitable name for this initiative. Chris Peterson
    proposed *Open Source* as an appropriate cognomen for the project. The *Debian
    Free Software Guidelines* also known as the *Debian Social Contract* was chosen
    as a basis for the *Open Source Definition* of certification (Table 4.3). Bruce
    Perens and Eric S. Raymond launched the OSI Website, Linus Torvalds, father of
    Linux, gave the initiative his blessing, and, OSI began showing up in the press
    and vendor product announcements, not to mention in documents like the infamous
    *Microsoft Halloween Document*.


