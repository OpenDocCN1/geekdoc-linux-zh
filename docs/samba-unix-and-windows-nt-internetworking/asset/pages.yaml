    # File Systems


    A UNIX file system is a partition of blocks on one or more disks that acts as
    a container for a directory and file tree. The primary structures which make up
    the file system are the super block, inodes, and data blocks.


    The super block describes the overall structure of the file system. It contains
    the file'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'system name, the size, pointer to the inode and free block lists, etc. The
    super block is used to keep track of the file system state during operation which
    may later be used to verify the integrity of the file system as part of the boot
    process and in the event of a failure.


    Each directory and file in the file system is represented by an inode. The inode
    can be thought of as an index entry. Each inode is sequentially numbered from
    1 up to the maximum number of inodes defined for the file system. The inode identifies
    the attributes of the file or directory it represents (Table 2.6).


    # Table 2.6 Inode File Attributes


    +   - File Mode

    +   - File Type

    +   - Owning UID and GID

    +   - Date and Time Stamps

    +   - Number of Links

    +   - Pointer to Data Blocks

    +   - Size in Bytes

    +   - Size in Blocks


    Data blocks are used to store the actual file data in the file system. Generally
    each inode contains 13 data block address slots. The first eight address slots
    point at the first eight file data blocks of the file. The ninth address points
    to an incore inode structure. The disk inode information is copied to this structure
    when the file is opened. The 10th through 13th addresses point to indirect data
    blocks that are used to address data blocks for large files. Each indirect block
    supports 1024 addresses. Newer UNIX file systems may incorporate additional structures
    to represent much larger files and file systems.


    # Directory Structure


    The UNIX directory and file structure is organized such that it resembles an inverted
    tree, beginning with the root directory at the top and subdirectory branches proceeding
    down from the root. Each directory level in the tree may contain files or additional
    subdirectories. Directories also act as mount points for connecting additional
    file systems to the tree. The root-level directory, designated "/", acts as the
    base mount point for the full tree structure. A listing of mounted file systems,
    their mount points and attributes can be displayed using the df command (Example
    2.6). When perusing the mount information on various systems you may recognize
    a set of common directory names. There is a somewhat standard set of directories
    used to house various types of files.'
  merge: -1
  img_proc: true
