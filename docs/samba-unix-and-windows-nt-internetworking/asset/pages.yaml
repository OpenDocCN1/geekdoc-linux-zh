    # CRLF/LF Conversion


    Another problem when translating file attributes between UNIX and DOS/Windows
    involves CRLF/LF conversion. Unfortunately there is no reliable way to determine
    which files need conversion and which do not. You cannot rely on file name extensions
    like TXT or DOC. Samba operates on the premise that files are not to be modified
    automatically to ensure that files are not mistakenly damaged by erroneous conversions.
    Note that some operating systems like Linux may automatically convert CD-ROM files
    based on file type. Use the conv=binary mount option to disable conversions for
    CDROM shares managed by Samba.


    Jim Barry has written an excellent drag-and-drop CRLF/LF converter for Windows
    called fixcrlf that can be used to convert files as needed. To covert a file just
    drag the file from Windows Explorer onto the fixcrlf icon. You can download a
    copy of fixcrlf from one of the Samba archive sites: ftp://samba.org/pub/samba/contributed/fixcrlf.zip


