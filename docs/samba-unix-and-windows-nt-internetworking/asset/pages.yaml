- pgno: 145
  md: '# Chapter 11: Sharing Files


    # Overview


    > "Rumors of my assimilation have been greatly exaggerated."


    Picard


    It is Samba''s job to act as arbiter when *assimilating* UNIX and Windows resources.
    Samba''s melding of the OS protocol psyches constructs a logical communication
    channel for sharing files and printers residing in each of the two architectures.
    Samba resource sharing services augment simple data transfer by incorporating
    features like name and attribute mapping, locking and caching, and multiple levels
    of access control. As with all the service definitions we''ve discussed thus far,
    Samba share service behavior is directed through parameters specified in the `smb.conf`
    configuration file.


    # File Shares


    Probably the most common form of resource sharing under Samba is providing Windows
    client access to UNIX files and directories. File shares are defined in the services
    section of `smb.conf`. With the exception of the special `[homes]` share, each
    file share is uniquely identified by a share name enclosed in square brackets,
    `[share name]`. The share name is minimally followed by a path parameter defining
    the shared directory path. It is also a good idea to include a short description
    of the share specified by the `comment` parameter.


    ```

    [share name]

    comment = <text description>

    path = <directory path>

    ```


    Additional parameters may be added to each file share section to tailor file name
    mapping preferences, set read/write permissions, enforce access control and specify
    special locking options. Parameters like `preexec` and `postexec` can be used
    in a file share definition to induce special pre and post connect processing.
    For example, you might use `root preexec` to request a mount for removable media
    when a share is accessed (Example 11.1). An un-mount would follow at disconnect
    time using the `root postexec` parameter.


    # Example 11.1 Removable Media File Share


    ```

    [cdrom]

    path = /mnt/cdrom

    comment = Removable CDROM Share

    browseable = yes

    read only = yes

    root preexec = /usr/sbin/mount -o ro /dev/cd0 /mnt/cdrom

    root postexec = /usr/sbin/umount /mnt/cdrom

    ```


    # Homes Share'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'The [homes] section is a special share service provided by Samba to allow Windows
    client users to access their UNIX home directories. When an SMB connection setup
    request is received, Samba first scans the set of specifically named shares. If
    a match is not found, it will then scan the passwd database attempting to locate
    a match for the client user name. If a user name match is found and the client
    has supplied the correct password, Samba grants access to a temporary [user name]
    share created by cloning the [homes] section definitions. If a path parameter
    has not been supplied, the user''s home directory path is used as specified in
    the UNIX passwd database.


    A sample [homes] definition is provided in Example 11.2. Take special note of
    the write access parameters used in the example [homes] definition. The use of
    write list = %S versus writable = yes eliminates the possibility that another
    user could gain read access to a home directory set with world read permission.


    # Example 11.2 Sample [homes] Section Definition


    ```

    [homes]

    comment = User Home Directories

    browseable = no

    writable = no

    write list = %S

    ```


    [homes] user directory shares can be accessed by providing the user name as the
    share name or by specifying homes as the share name. In the latter case, the user
    name is derived from the requesting client setup request. This feature is useful
    when configuring a logon script to setup a common desktop environment on a multi-user
    workstation. Be aware that some Windows clients will not unmount the home directory
    share when a user logs out. You may want to force an unmount as part of the logout
    environment clean-up process:


    ```

    C:\ NET USE H: \\<server name>\<user name>

    ```


    ```

    C:\ NET USE H: \\<server name>\homes

    ```


    Other [homes] section considerations include specifying an alternate user directory
    using the path parameter to separate UNIX user directories and Windows client
    user directories (Example 11.3). Also, note that even though the browseable parameter
    is disabled, individual users will still see their home directories listed as
    folders in a browse list.


    # Example 11.3 [homes] Share with Alternate Directory Path


    ```

    [homes]

    comment = User Home Directories

    browseable = no

    writable = no

    write list = %S

    path = /home/samba/%u

    ```'
  merge: -1
  img_proc: true
- pgno: 147
  md: "Sites that use NIS managed directory servers can route [homes] connections\
    \ to the appropriate remote directory server by enabling the nis homedir parameter\
    \ and identifying the NIS map with the homedir map parameter. The remote directory\
    \ server must also be running Samba. The home directory will be mounted directly\
    \ from the directory server:\n\n```\nnis homedir = <true, false>\nhomedir map\
    \ = <NIS map name>\n```\n\n# Access Control\n\nIn Chapter 6, we looked at some\
    \ of the access controls that can be applied to Samba shares. We'll review them\
    \ here, focusing on how they affect access to file shares specifically. Table\
    \ 11.1 lists the set of access control parameters we'll cover in the next few\
    \ sections of the text.\n\n# Table 11.1 Useful Access Control Parameters\n\n**By\
    \ Host**\n\nhosts allow\tAllow/restrict hosts\nhosts deny\n\n**By User and Group**\n\
    \nusername\tRestrict/allow users\nvalid users\ninvalid users\nonly user\nforce\
    \ user\nguest ok\tPublic access\nguest only\nguest account\ngroup\tEnforce named\
    \ group rights\nforce group\n\n**By File Operation**"
  merge: -1
  img_proc: true
- pgno: 148
  md: '| Parameter | Description |

    |---|---|

    | read only | Read-only access |

    | read list | |

    | writeable | Write access |

    | write list | |

    | force security mode | Specify permissions |

    | force create mode | |

    | force directory mode | |

    | force directory security mode | |

    | security mask | |

    | create mask | |

    | directory mask | |

    | directory security mask | |


    # Hide


    | Parameter | Description |

    |---|---|

    | veto files | Hide/restrict specified files |

    | hide files | |

    | hide dot files | |

    | delete veto files | |

    | dont descend | |


    # Browse Rights


    The least-effective method of access control is security by obscurity. I mention
    this because many sites will use the browseable parameter to hide a share and
    assume that is sufficient to protect it from unauthorized access. They subscribe
    to a cyber philosophical twist on old sayings like, "What your users don''t know
    can''t hurt you" and "User ignorance is system administrator bliss". There are
    certainly good reasons for making a share nonbrowseable. Just remember that although
    a share doesn''t show up in a browse list, users can still access it if they know
    the name a priori:


    ```

    ```

    browseable = <yes, no>

    ```

    ```


    # Host Access


    The most basic form of Samba access control is by host name or IP address. Use
    the hosts allow and hosts deny parameters in the global and share sections of
    smb.conf to restrict access to those hosts that are trusted members of your workgroup
    or domain. You can specify computers by name, IP number, or IP group by using
    an IP class value or subnet mask. The except keyword can be used in conjunction
    with group values like a subnet mask to exclude individual or groups of machines
    (Example 11.4).'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# Example 11.4 Restricting Access by Host


    ```

    hosts allow = 192.168. except 192.168.0.10


    hosts deny = frodo, bilbo


    hosts allow = 149.125.10.0/255.255.255.0

    ```


    # User and Group Access


    A finer level of access restraint can be applied at the user level. Samba allows
    you to limit right of entry to specific individuals through the `username`, `only
    user`, `valid users`, and `invalid users` parameters (Example 11.5). Per the particular
    parameter employed, the client-supplied user name is checked against the associated
    user list before access is granted or denied. If the user name is prefixed with
    an "@" sign, or an "&" sign it is assumed to correspond to an NIS netgroup. If
    it is prefixed with a "+" sign, the name is checked against the UNIX group file.


    # Example 11.5 Restricting Access by User Name


    ```

    invalid users = root system +wheel


    only user = fred

    ```


    The following rules are applied when a client requests access to a share or service.

    Access is granted if:


    +   - An unrestricted client passes a user name and password that maps to a permitted
    UNIX account name.

    +   - A client previously registered a user name with the server and follows up
    by supplying a valid password.

    +   - The client''s NetBIOS name and previously used user name are checked against
    the supplied password.

    +   - A client with a previously validated user name/password pair supplies a
    validation token to the server.

    +   - The share is configured with the `user list` parameter and the client supplies
    a valid password for one of the usernames in the list.

    +   - A share is configured with a `guest account` parameter and the client supplies
    a valid guest account name.


    Sometimes you will want to make a share available to anyone. Adding the `guest
    ok` or `guest only` parameters to a share section definition will accomplish this.
    Note that even though you are granting public access to the resource, you will
    still want to restrict operation privileges on the share by mapping guest access
    to a valid UNIX account. Indicate the desired user account name as a value to
    the `guest account` parameter. A'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'good candidate account with limited privileges is the nobody account which
    is commonly used for UNIX anonymous access services (Example 11.6).


    # Example 11.6 Restricting Guest Access


    ```

    guest ok = true


    guest account = nobody

    ```


    # Privileges and Permissions


    Now that we''ve narrowed connection rights down to an explicit community of client
    users and machines, we''ll want to bind the set of operations permitted on file
    and directory objects contained within the share. This is accomplished by indicating
    whether a user has read or write privileges based on effective UNIX user and group
    identifiers, and how UNIX owner, group and world permissions are specified for
    manipulating files and directories. Keep in mind that Samba must honor UNIX permissions
    regardless of the parameter specifications designated for the share in smb.conf.


    Read/write permissions can be specified at the share level or user level using
    the readable, read list, writeable, and write list parameters. If the user name
    is prefixed with an "@" sign or a "&" sign it is assumed to correspond to an NIS
    netgroup. If it is prefixed with a "+" sign, the name is checked against the UNIX
    group file. The "+" and "@"&" characters can be combined to indicate that a check
    be made against both UNIX groups file and NIS netgroups.


    ```

    writeable = <yes, no>


    write list = <comma separated user list>


    readonly = <yes, no>


    read list = <comma separated user list>

    ```


    Due to the wide range of access control attributes employed by DOS, LAN Manger,
    Windows 9x and Windows NT clients, Samba requires a set of mechanisms to ensure
    that these attributes are reflected in corresponding UNIX file and directory permissions.
    This is carefully achieved through a set of mask or mode (synonym for mask) parameters
    that guarantee appropriate application of UNIX permissions.


    There are two levels of masking that can be applied when a client creates a file
    or directory within a Samba file share. The first set of mask parameters are bit-wise
    AND''ed with the UNIX permission bits resulting from the mapping of DOS modes
    or NT access control attributes. Any bit not matching the mask will be removed
    from the resulting UNIX permission bits when the file or directory is created.
    The first-level mask parameters include create mask (DOS), directory mask (DOS),
    security mask (NT), and directory security mask (NT). Values for each of these
    parameters are designated as an octal mask:


    ```

    create mask = <default=0744>


    directory mask = <default=0755>

    ```'
  merge: -1
  img_proc: true
- pgno: 151
  md: '```

    security mask = <default=create mask>

    ```


    ```

    directory security mask = <default=directory mask>

    ```


    The next level of file and directory permission parameters allows you to force
    the setting of permission bits through bit-wise OR''ing with the results of the
    first level parameters. This ensures that certain owner, group and world permission
    bits will always be applied when a file or directory is created. Second-level
    parameters include force create mode (DOS), force directory mode (DOS), force
    security mode (NT), and force directory security mode (NT). Refer to the smb.conf
    (5) man page for additional information.


    ```

    force create mode = <default=000>

    ```


    ```

    force directory mode = <default=000>

    ```


    ```

    force security mode = <default=force create mode>

    ```


    ```

    force directory security mode = <default=force directory mode>

    ```


    In some instances you may want to force the assignment of a particular effective
    UNIX user or group to be used when operating on objects in the share. This is
    useful when multiple users are sharing access to a file share. By specifying a
    UNIX user name and group name as values to the force user and force group parameters,
    you can ensure that all file operations on the service will be performed using
    the named user and group for permissions checking and assignment:


    ```

    force user = <user name>

    ```


    ```

    force group = <group name>

    ```


    As of Samba 2.0.5, the force group parameter allows a "+" character to be added
    as a prefix to the group name value. What this means is that a connecting user
    only operates under the specified effective group if it is already listed as a
    member of that group in the /etc/groups file (Example 11.7). All other users will
    operate under their own default primary UNIX groups.


    # Example 11.7 2.0.5 Force Group Enhancement


    ```

    force group = +sys

    ```


    Power users that require full administrative privileges for a share are designated
    with the admin users parameter. This basically gives these users root privileges
    when operating on files and directories within the share.


    ```

    admin users = <user list>

    ```


    # Hiding Files & Directories'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'Another form of security by obscurity is facilitated through Samba''s ability
    to hide files and directories from SMB clients. For practical purposes it may
    be prudent to hide things like UNIX dot files in [homes] shares. UNIX dot files
    can be hidden by enabling the hide dot files parameter. Other UNIX files and directories
    can be hidden using the hide files and dont descend parameters. The hide files
    parameter accepts a list of "/" separated file names or file patterns. File patterns
    use the "?" and "*" characters to wild-card single characters or filename/extension
    similar to the way they are used in DOS (Example 11.8). The dont descend parameter
    accepts a list of comma-separated directory names that are off-limits to connected
    clients. The dont descend parameter is also useful in eliminating recursive directory
    lookup loops caused by symbolic links:


    ```

    hide dot files = <yes, no>

    ```


    ```

    hide files = <file pattern / file pattern / ...>

    ```


    ```

    dont descend = <directory list>

    ```


    # Example 11.8 Hide Files by Pattern


    ```

    hide files = *.mbx / pine.*

    ```


    Hiding files and directories does not restrict access if the client user already
    knows the hidden file or path name. To restrict access to hidden files and directories
    use the veto files parameter. Like the hide files parameter, veto files accepts
    a list of "/" separated file/directory names or file/directory patterns with support
    for "?" and "*" wild card characters. To allow clients the ability to delete a
    directory that contains files restricted by a veto files parameter, enable the
    delete veto files parameter:


    ```

    veto files = <file pattern / file pattern>

    ```


    ```

    delete veto files = <yes, no>

    ```


    # DOS and Windows File Attributes


    UNIX owner, group, and world execute permission bits don''t have a counterpart
    in the DOS and Windows world. This is because execute permission is implied by
    a file name extension of EXE. Likewise, UNIX file attributes don''t include anything
    like the archive, system, and hidden attributes used by DOS and Windows. Samba''s
    solution to this dilemma is to allow mapping of the DOS/Windows archive, system,
    and hidden attributes to the UNIX owner, group, and world execute bits. Attribute
    mapping is switched on or off by the map archive, map system, and map hidden parameters.


    ```

    map archive = <yes, no>    UNIX owner execute bit

    ```


    ```

    map system = <yes, no>    UNIX group execute bit

    ```


    ```

    map hidden = <yes, no>    UNIX world execute bit

    ```


    Windows NT Access Control Lists (ACLs) are mapped into UNIX permission bits by
    enabling the nt acl support parameter.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# File Name Mangling


    Along with the mapping of access control attributes and permissions, Samba also
    translates file and path names into their respective UNIX, DOS, and Windows forms
