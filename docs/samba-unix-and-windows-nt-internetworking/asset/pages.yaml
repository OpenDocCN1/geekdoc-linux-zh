    # Kerberos


    There are a number of authentication systems available for UNIX, which augment
    the functionality and security of the basic password and group architecture. One
    such system is the *Kerberos* authentication developed at M.I.T., which is based
    on the *Trusted Third-Party* authentication model. The original design is described
    in a series of papers presented at the 1988 USENIX Winter Conference. Kerberos
    is an important technology regarding UNIX and NT coexistence, because it is the
    network authentication system in Windows 2000.


    Kerberos assumes that everything in the network is untrustworthy except the Kerberos
    authentication server itself. The Kerberos authentication server is called the
    *Key Distribution Center (KDC)*. The KDC acts as an intermediary between the client
    and the desired services. The client must authenticate itself to the KDC to obtain
    a ticket, which grants the rights to access distributed services (Figure 2.5).
    This ticket is called a *Ticket Granting Ticket (TGT)*. It is only necessary to
    validate yourself once to the KDC rather than once for each service you wish to
    access. The various Kerberos tickets are also only valid for a given period of
    time. The Kerberos ticket mechanism eliminates the need to transmit passwords
    over the network in clear text. The client and server passwords are known and
    stored by the KDC.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '![](img/7684008b1d7775727df27d44aed5b3f0_32_0.png)


    +   1. Request authentication for user and service.

    +   2. Return TS session key and identifiers.

    +   3. Request ticket using sealed authenticator.

    +   4. Return ticket for requested service.

    +   5. Connect to service with authenticator ticket.


    Figure 2.5: Kerberos ticket exchange


    Whenever access to services is requested by an unauthenticated client, a message
    is sent to the KDC that contains client name and the Kerberos ticket-granting
    service name. The KDC looks up the names and obtains the encryption key for the
    client and the ticket server. The encryption key is known only to the owning agent
    and the KDC. A message is then constructed by the KDC containing the client and
    ticket server names, address, and a random session key, which it encrypts using
    the client''s encryption key. The message is called a ticket and is sent to the
    client. The client uses its encryption key to decrypt the ticket and stores the
    ticket for the duration for which it is valid. The session key is used to encrypt
    ticket communication with the Kerberos ticket service to gain access to other
    services and resources.


    When access to a service is requested, the ticket service provides a new session
    key along with a ticket encrypted with the services encryption key from the KDC''s
    database. The client uses the new session key to create an authenticator ticket,
    which identifies the client, and sends it along with the encrypted service ticket
    to the new service. The service decrypts the ticket using its encryption key.
    The service ticket contains the session key, which is then used to decrypt the
    authenticator ticket. Now the client and service know about each other and real
    work can begin.'
