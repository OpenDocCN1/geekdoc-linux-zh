  md: '+   - *Sections* are delimited by a section name enclosed in square brackets.

    +   - Section attributes are specified from a set of predefined *parameters*.

    +   - *Parameters* are represented as *parameter* = *value* pairs. Values are
    either text strings or boolean values.

    +   - *Substitution variables* may be used to assign parameter values at runtime.

    +   - The `include` and `copy` parameters can be used to insert or clone sections
    in the configuration file.

    +   - The `preexec` and `postexec` parameters can be used to invoke commands or
    scripts when a client connects and releases a share respectively.

    +   - Modifications to the `smb.conf` file can be validated using the `testparm`
    command.

    +   - SWAT is a Web-based `smb.conf` configuration tool that can be used from
    remote workstations.

    +   - SWAT service and port information must be defined `/etc/services` and `/etc/inetd.conf`.

    +   - The **[global]** section defines the server''s roles in the workgroup or
    domain, section defaults, and administrative limits.

    +   - Share sections describe individual services and associated access rights.

    +   - There are two predefined share sections: **[homes]** and **[printers]**.

    +   - **[homes]** section permits connection to `$HOME` directories by providing
    the owning user name as the requested share.

    +   - **[printers]** section permits access to printers defined in printcap file.

    +   - Share access rights can be applied at the host, user and UNIX permission
    levels.


