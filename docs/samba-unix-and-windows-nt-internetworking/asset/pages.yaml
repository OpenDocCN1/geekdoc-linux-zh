  md: 'Thus far in the text we have focused on Samba''s role as a CIFS/SMB server.
    On one hand, Samba is a CIFS/SMB server, but on the other, it is also a CIFS/SMB
    client. In this chapter we''ll look at how Samba can facilitate UNIX client access
    to shares managed by Windows as well as other Samba servers. We''ll also review
    Windows client setup and CIFS/SMB options for other non-Windows platforms.


    # UNIX Client


    Samba is not a CIFS/SMB one-way street. Along with its role as a CIFS/SMB server,
    Samba also provides UNIX client access to remote shares via its smbclient, smbwrapper,
    smbtar, and smbprint applications.


    # smbclient


    smbclient is an extremely useful tool for testing Samba and Windows server configurations.
    In essence, smbclient is an ftp-like CIFS/SMB command line client application.
    Capabilities include moving files to and from file shares, creating and removing
    files and directories, printing files on remote printers, and exercising NetBIOS
    name-to-address resolution.


    As you might imagine, a wide range of features also leads to a wide range of command
    parameters. It turns out that the parameter set is larger than we might think.
    What follows is a synopsis of available smbclient parameters and a few commonly
    used examples (Example 13.1).


    When experimenting with the following parameters, keep in mind that Samba must
    interact with a wide range of CIFS/SMB platforms. This means varying degrees of
    protocol compliance. Some platforms can be a bit stubborn when it comes to parameter
    combinations and character case. If at first you don''t succeed, try repeating
    the request using uppercased user names, passwords, NetBIOS names, and service
    names.


    ```

    smbclient <service name> [password] [-s smb.conf path] [-B IP addr] \ [-O socket
    options] [-R name resolve order] [-M NetBIOS name] \ [-i scope] [-N] [-n NetBIOS
    name] [-d debug level] [-P] [-p port] \ [-l log base name] [-h] [-I dest IP] [-E]
    [-U user name] \ [-L NetBIOS name] [-t terminal code] [-m max protocol] \ [-W
    workgroup] [-T c|x|IXPggbNan] [-D directory] [-c command string]

    ```


    # smbclient Options


    +   - **Service Name** represents the full NetBIOS name of the requested service,
    \\server\\share. Note that UNIX uses the backslash character as an escape. That
    means you''ll need to quote the service name string or use double backslashes,
    ''\\server\\share'' or \\\\server\\\\share. An alternative is to use the Universal
    Network Convention (UNC) format, which substitutes a forward slash in place of
    a backslash, //server/share.

    +   - **Password** is the access password for the service. The password can also
    follow the user name if the -U option is used. If a password is supplied, smbclient
    assumes a -N'
  merge: -1
