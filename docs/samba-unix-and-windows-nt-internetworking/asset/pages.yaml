  md: "# UNIX Tools\n\n+   - `ifconfig`\n+   - `netstat`\n+   - `ping`\n+   - `ps`\n\
    +   - `iostat`\n\n# Windows Client Tools\n\n+   - `NET`\n+   - `NBTSTAT`\n+  \
    \ - `WINIPCFG`\n\n# Network Connectivity\n\nBegin troubleshooting by examining\
    \ network connectivity between clients and servers.\n\nCan everybody talk to each\
    \ other over the wire? Is everyone configured to support NetBIOS over TCP/IP?\
    \ Are the assigned IP addresses and subnets correct? Use the `ifconfig` command\
    \ on each UNIX client and server (Example 15.1) and the `winipcfg` command on\
    \ Windows clients and servers (Figure 15.1) to verify network interface configuration.\
    \ These commands will display network adapter status, assigned IP address and\
    \ subnet mask, and the broadcast address.\n\n# Example 15.1 ifconfig – UNIX Network\
    \ Interface\n\n```\n# ifconfig en0\nen0: flags=0x080863<UP,BROADCAST,NOTRAILERS,RUNNING,SIMPLEX,\n\
    \    MULTICAST,GROUPRT>\ninet 145.142.210.20 netmask 0xffffffff broadcast\n  \
    \  145.142.210.255\n```"
