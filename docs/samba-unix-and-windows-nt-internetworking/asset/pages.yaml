    # Chapter 3: Windows Overview


    # Overview


    In the last chapter, we looked at various pieces of the UNIX system and networking
    framework to assist in developing a model for sharing UNIX resources with Windows
    clients using Samba. In Chapter 3, we continue this discussion thread by examining
    the corresponding Windows system and networking subsystems. In particular, we
    will look closely at Windows networking protocols, domains and workgroups, file
    systems, and access controls. Samba is an implementation of Windows file-and-print
    sharing services and also provides basic NT Primary Domain Controller (PDC) functionality.
    Thus a sound understanding of Windows networking protocols and domain services
    will be critical in successfully deploying Samba in the enterprise.


    # Windows NT Architecture


    The Windows NT operating system is similar to UNIX in that processes interact
    with CPU, memory, and hardware via an executive system services layer. NT employs
    preemptive multitasking to manage the execution of process threads in much the
    same way UNIX schedulers work. This allows NT to suspend some tasks to provide
    resources for higher priority tasks. NT is also multithreaded, giving it the capability
    of running on symmetric multiprocessing platforms. This seems quite a bit like
    UNIX. The NT development team spent a fair amount of time reviewing and borrowing
    ideas from UNIX and other computing architectures, and ultimately used Carnegie
    Mellon''s Mach microkernel as the foundation for the operating system.


    Windows NT is implemented as a layered subsystem architecture and supports'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'applications from a number of different operating system environments (Figure
    3.1). In contrast to the previous chapter''s bottom-up discussion of the UNIX
    OS layers, we will view Windows NT from the top down. At the top layer of the
    NT architecture stack reside user mode services. These include a Virtual DOS Machine
    (VDM) for running legacy DOS applications, a 16-bit Windows subsystem for Windows
    3.x programs, a POSIX subsystem, an OS/2 subsystem, and the Win32 subsystem. Applications
    executing within a particular subsystem are managed as separate protected virtual
    memory spaces. User mode services interact with lower-level kernel-mode services
    through the executive services buffer. This buffer is a code section that partitions
    and protects user-mode and kernel-mode operations. Immediately below this buffer
    are the NT Executive Managers, which regulate object and process life cycles;
    virtual memory; procedure calls; I/O functions; and monitor access security. A
    small fixed microkernel sits below the executive manager layer. The microkernel''s
    role is limited to dispatching and synchronizing threads and managing system interrupts.
    The base of the operating system is made up of the Hardware Abstraction Layer
    (HAL), whose job is to hide hardware and device-driver dependencies from the rest
    of the operating system. This simplifies, secures, and generalizes the API for
    developing applications that use hardware services.


    | Layer |

    |---|

    | VDM, Win 3.x, OS/2, Posix, Win32 |

    | Executive Services Buffer |

    | Executive Services Manager |

    | NT Microkernel |

    | Hardware Abstraction Layer |

    | Physical Hardware |


    Figure 3.1: Windows NT layered architecture


    # Networking


    Windows NT comes complete with almost all the network protocols and interfaces
    one could ask for (Figure 3.2). The usual suspects include TCP/IP, NetBIOS/NetBEUI,
    and IPX/SPX. The base protocols and interfaces are augmented by additional communication
    services to support Virtual Private Networking (VPN) and Routing and Remote Access
    Services (RRAS), as well as gateway support among Microsoft LAN Manager, OS2 LAN
    Manager, Banyan Vines, Novell, and the Internet. For our purposes, we will narrow
    the set down to NetBIOS and TCP/IP, which provide the transport for the Server
    Message Block (SMB) protocol between Samba and Windows clients and servers.'
