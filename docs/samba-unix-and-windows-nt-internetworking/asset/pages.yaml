    is not guaranteed, the client may have to retransmit its request a number of times
    before it is resolved. This method works in small networks but quickly breaks
    down on large networks due to heavy broadcast traffic.


    The second method for managing the namespace uses point-to-point communication.
    Name registration and IP address resolution requests are directed to a NetBIOS
    Name Server (NBNS) in a manner similar to Internet dynamic DNS. NetBIOS point-to-point
    name service is defined in RFC 1001 and RFC 1002 and implemented as Microsoft''s
    Windows Internet Name Service (WINS) (Figure 3.5).


