    # Print Share


    Print shares are defined either with an explicit share name enclosed in square
    brackets or by using the special [printers] share (next section). A minimal print
    share definition will include a path parameter designating the location of a world
    writable spooling directory. It must also be set printable or the server will
    not load the configuration. Set the writeable parameter to no in order to restrict
    non-spooling related writes to the share. If you want to allow public access to
    the printer, enable the guest ok parameter and verify that guest account is set
    to a known UNIX account. If the chosen share name does not match an entry in the
    UNIX printer configuration file, use the printer parameter to designate a valid
    printer name.


    ```

    [print share name]

    comment = <text description>

    printer = <printcap printer name>

    path = <spooling directory>

    writeable = no

    ```'
