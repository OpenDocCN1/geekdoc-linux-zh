    the server NetBIOS name and the printer name. You can use the browse tab to select
    a printer from the browse list if the printer is set browseable on the server
    (Figure 12.3). If the server has the target printer driver available for download
    and the client is a Windows 9x box, the driver will be automatically installed.
    After installation is complete, the Samba network printer can be used by applications
    just as if it were a local Windows print device.'
