    +   - PDC <=> BDC integration.

    +   - Network printing (see FAQ question 2.5 for a workaround).

    +   - Windows NT ACLs (on the Samba shares).


    # Obtaining the Source


    The best way to get the latest information about which features have been implemented
    is to obtain the latest source code from the HEAD branch of the CVS code tree.
    To download a copy of the Samba Domain Controller source code, you''ll need a
    copy of cvs (http://download.cyclic.com). Use cvs to log in to the Samba CVS source
    server and update your copy of the Samba source code.


    ```

    $ cvs -d :pserver:cvs@samba.org:/cvsroot login password: cvs

    $ cvs -d :pserver:cvs@samba.org:/cvsroot co samba

    $ cvs update -d -P

    ```


    # Configuration


    Build and install the source as you would a standard distribution (see Chapter
    5). It''s a good idea to install the binaries using an alternate directory tree
    for testing and evaluation purposes. Configure Samba as outlined in the previous
    section describing domain control'
