  md: "```\nswat stream tcp nowait.400 root\n/usr/local/samba/bin/swat swat\n```\n\
    \n# Variable and File Substitution\n\nA powerful Samba feature that will assist\
    \ in simplifying smb.conf configuration is variable substitution. Samba provides\
    \ a fixed set of variables, prefixed by a \"%\" sign, that take on values during\
    \ runtime processing. Variable substitution can be used anywhere within the smb.conf\
    \ file where a string value is valid. For example, the \"%m\" variable is often\
    \ used to associate the requesting client's NetBIOS name to a local server resource\
    \ like a log file.\n\n```\nlog file = /usr/local/samba/var/%m.log\n```\n\nGiven\
    \ a client NetBIOS name of WIZARD, /usr/local/samba/var/%m.log becomes /usr/local/samba/var/WIZARD.log.\n\
    \nSome variables may only be within the context of a share section. These would\
    \ include variables like the requested service name or the validated client UNIX\
    \ account name. The remaining set of variables may be used in all sections. Table\
    \ 6.3 lists the set of predefined variables in Samba Version 2.0.5a. Share section\
    \ variables are listed at the bottom of the table.\n\n# Table 6.3 smb.conf Defined\
    \ Variables\n\n+   %G = primary group name of %u\n+   \n+   %I = the IP address\
    \ of the client machine\n+   \n+   %L = the NetBIOS name of the server. This allows\
    \ you to change your config based on what the client calls you. Your server can\
    \ have a dual personality.\n+   \n+   %M = the internet DNS name of the client\
    \ machine\n+   \n+   %N = the name of your NIS home directory server. This is\
    \ obtained from your NIS auto.map entry. If you have not compiled Samba with the\
    \ automount option then this value will be the same as %L.\n+   \n+   %R = the\
    \ selected protocol level after protocol negotiation. It can be one of CORE, COREPLUS,\
    \ LANMAN1, LANMAN2, or NT1.\n+   \n+   %T = the current date and time\n+   \n\
    +   %U = session user name (the user name that the client wanted, not necessarily\
    \ the same as the one they got—i.e. UNIX user name that was actually used).\n\
    +   \n+   %a = the architecture of the remote machine. Only some are recognized,\
    \ and those may not be 100% reliable. It currently recognizes Samba, WfWg, WinNT,\
    \ and Win95. Anything else will be known as \"UNKNOWN\". If it gets it wrong,\
    \ then sending a level 3 log to mailto:samba-bugs@samba.org should allow it to\
    \ be fixed."
