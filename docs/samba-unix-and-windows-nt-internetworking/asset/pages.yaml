    # Roaming Profiles


    Most of us spend too much time artistically tailoring our Windows desktops. Our
    chosen display background, text fonts, application shortcuts, icons, and screen
    saver all reflect a bit of our cyber persona. Everything has to be in its proper
    place on the screen. After putting in so much effort, we all get a little irked
    when our carefully crafted desktop world doesn''t automatically follow us as we
    move from one workstation to the next.


    There is a solution to this dilemma called a roaming profile, a Windows desktop
    profile that has been stored on a network drive and copied to the local workstation
    at logon time. The profile itself is a collection of Windows environment settings
    used in concert with installed applications and folders to create the user''s
    working desktop. Profiles are cached copies of the Windows Registry key HKEY_CURRENT_USER
    and stored as a file named user.DAT under Windows 9x and NTuser.DAT for Windows
    NT. The HKEY_CURRENT_USER structure reflects the desktop preferences set by the
    current logged in user.


    The collection of user profiles is commonly stored by user name in a PROFILES
    directory residing under the system root on the domain controller. When a user
    logs on to the domain, Windows checks the time stamp of the remote profile stored
    on the domain controller against a local copy stored on the workstation. The most
    recent copy is then used to setup the user''s initial desktop environment. When
    the user logs out, the profile is copied back onto the domain controller. Assuming
    no problems have occurred during domain logout, the most recent copy of the profile
    will reside on the domain controller and will be available when the user logs
    on from any domain workstation.


    Profiles also provide the system administrator a means for configuring common
    or default desktop rules for users. If the file extension of the profile file
    is changed from DAT to MAN, the profile becomes a mandatory profile and will be
    used to set the initial desktop environment. The end-user can modify the desktop
    during the session, but those changes will not be reflected in the mandatory profile
    stored on the domain controller.


    Roaming profiles are designated in Samba by the logon path parameter. The default
    path is to store the profile in the user''s home directory. Due to the problem
    that Windows clients may leave the home directory mounted after user logout, it
    is recommended to specify an alternate repository for storing roaming profiles.
    A simple solution is to create a'
