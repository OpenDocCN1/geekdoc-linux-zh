- pgno: 194
  md: '*the wrong remedies.*


    **Groucho Marx**


    Computers are somewhat like politics. Sooner or later trouble always shows up.
    It usually happens when you''re making one small late-night change to a production
    service. You know the kind. It''s always some preventative service patch for a
    problem you''ve never seen; one the vendor advises needs to be applied, assuring
    that it is only a benign software update. You apply the patch and dream of sleeping
    in late the following morning. Just as you''re ready to call it a night, problem
    symptoms start showing up from multiple subsystems. SNMP monitor alerts are popping
    up everywhere announcing server failures all across the network. In a nervous
    adrenalin rush you rapidly try to back out the patch before it''s too late. Halfway
    through, the uninstall task fails, your screen goes blank, and the phone begins
    to ring off the hook.


    Gruesome isn''t it? You can''t avoid computer and network problems, but you can
    limit the scope of disaster. The trick is to always have a good selection of diagnostic
    tools at hand, and to have a sound fallback plan. When installing a new system,
    try it out first in an isolated test environment. When problems emerge in production
    systems, address them as a series of validation stages. Begin with the lowest-level
    subsystems. In turn, examine each higher-level service eliminating possibilities
    as you proceed. This process will assist in diagnosing events rooted in complex
    subsystem interrelationships.


    # Sleuthing Samba


    Samba is an excellent example of a network service comprised of tightly coupled
    subsystems. It is therefore often helpful to address Samba problems in the stepwise
    manner described in the previous paragraph. Begin by verifying network connectivity
    from both the server and client end of a circuit. Next confirm that the smbd and
    nmbd are running and listening for connection requests. Ensure that the configuration
    files correctly reflect the role Samba is playing in the workgroup or domain.
    When all else fails, make sure you know where to go for help.


    In the following sections we''ll look closely at validating Samba services at
    the network, daemon and configuration levels. Table 15.1 lists the set of tools
    we''ll use as we analyze each component of the system.


    # Table 15.1 Troubleshooting Tools


    # Samba Tools


    ```

    smbclient

    nmblookup

    testparm

    testprns

    ```'
  merge: -1
  img_proc: true
