    The Microsoft Windows success story can be easily attributed to its point-and-click
    user interface and low-cost hardware platform. The widespread familiarity with
    the Windows interface, its rich set of productivity tools, and its commodity hardware
    component base have quickly made it the predominant world standard in single user
    desktop computing. This is pretty impressive feat considering it is little more
    than half the age of UNIX. Microsoft has done a very good job of embracing networking
    technologies, standards, and enhancing the user interface to extend productivity
    from the desktop to the workgroup and most recently the Internet. This began with
    peer-to-peer networking in Windows for Workgroups. Next came interoperability
    with Novell-based networks, client/server networking with Windows NT and UNIX,
    and strong Internet connectivity with tools such as Internet Explorer.


    On the server side, the Microsoft story is still relatively new. Windows NT (New
    Technology) is only a little over five years old, yet in this short time it has
    captured a significant portion of the database client/server market. Windows NT
    incorporated bits and pieces of UNIX, VMS, OS/2, Netware, and existing Windows
    architectures to provide a multitasking networking service designed for tighter
    integration of and administer workgroup LANs under a new structure called domains.
    NT version 4.0 provided Windows-based networks closer ties with the Internet by
    including common Internet services like DNS, FTP, web, and SMTP-based electronic
    mail. Windows 2000 will extend this functionality by including additional internetworking
    tools like LDAP directory services, Kerberos authentication, and public-key services,
    each of which is closely linked to existing Windows networking and security services.'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'Although touted as the UNIX-killer, Windows NT has yet to fully replace UNIX
    services in the back room. Likewise UNIX does not provide the tight desktop support
    services and friendly user and administration interfaces that have been the hallmark
    of Windows. The result is that both operating systems are common fixtures in most
    shops. The challenge, then, for the system administrator is how best to simplify
    the administrative and management tasks of maintaining both operating systems,
    and how to facilitate seamless user access to the resources that reside in each
    world. This is where services like Samba become essential tools to smoothing the
    rough edges of UNIX''s and Windows'' coexistence.


    # Planning


    Before we jump into the nuts and bolts of Samba installation and configuration,
    we need to look carefully at the existing infrastructure, identify the problem
    areas and inconsistencies to be resolved, and develop an architecture that will
    allow incorporation of new technologies such as Windows 2000. Most architecture
    upgrades are not complete replacements for existing systems, so we need an implementation
    strategy that permits coexistence of older services alongside new development.
    Begin by asking questions like:


    +   - Is the existing OS base primarily UNIX or Windows?

    +   - Are in-house systems administration skills predominantly UNIX or Windows?

    +   - What resources need to be accessible in both OS worlds?

    +   - Is the focus for resource sharing directed at desktops, servers, or both?

    +   - What desktop clients need to be supported?

    +   - Is user mobility an issue?

    +   - Will there be an impact on existing business models?

    +   - Is scaling an issue concerning number of users, desktops, and/or servers?

    +   - What level of availability is required?

    +   - Will resource sharing require changes in namespace?

    +   - Is it necessary to synchronize accounts and passwords?

    +   - What level of access controls is required?

    +   - Is the setup domain, workgroup- or realm-based?

    +   - Will network topology affect browsing and access control?


    These are only a few of the issues that will require scrutiny before adding Samba
    to an environment. Since there are underlying complexities to each of these, we''ll
    look closer at a few of them in the next sections of this chapter.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Desktop Issues


    Almost everyone has a computer these days. Most of us have access to more than
    one: palmtop, handheld, laptop, home PC, office workstation, and network server,
    the list goes on and on. We spend much of our time computer hopping from one network
    island to the next. The boundaries between the machines, networks, and services
    we use have blurred to the point where it is difficult to pinpoint where particular
    resources reside. We find ourselves wondering if we left that memo on the office
    workstation or on the PC in the den at home?


    The challenge then for the system administrator is in providing an environment
    which assists mobile computer users in maintaining consistent access to documents,
    mail folders, address books, web certificates, bookmarks, and other application-preference
    data as they move from machine to machine. The task of synchronizing state is
    complicated by variations in data formats and network protocols when the set of
    machines includes both UNIX and Windows operating systems.


    A twist on the problem of maintaining individual state between multiple computers
    is how to manage state on a single computer used by multiple people. Consider
    the public computers in airports, libraries, university labs, and cyber cafes.
    What level of environment personalization should be allowed, if any? How will
    environment state be maintained and reset after each use to ensure both privacy
    and security? If personal environment profiles are going to be maintained, what
    are the scaling issues regarding account management and storage?


    # Enterprise Computing Issues


    The evolution of bringing legacy information services to the Internet community
    has seen most enterprises move away from proprietary, restricted access, and network
    computing architectures to more open distributed computing models. This has most
    often been facilitated by incorporating UNIX servers into the network to mitigate
    the information flow between data warehouse systems and the Internet. The result
    is increased operating system heterogeneity in the data center, which must be
    managed by systems administration and operations staff.


    The addition of new operating systems usually includes additional complexity in
    maintaining a consistent namespace of users, machines and services. For example,
    differences in supported character sets require the formulation of intricate character
    mappings between the various systems. Large user populations may require duplicating
    and managing the user account and password spaces on each platform. Users may
    also be required to login and logout repeatedly as they access resources that
    reside on various systems.


    # Domains and Realms


    In many organizations the authentication, authorization, and trust models built
    into the computing and networking infrastructure closely match those represented
    in organizational structure and processes. Trust between machines is as critical
    as trust between employees. A new operating system can often throw a kink into
    day-to-day operation when it does not fit within the existing structure. Transitive
    trust rules that follow organizational administrative roles usually work well
    between like operating systems as, for example, trust between UNIX Kerberos realms
    or trust between Windows NT'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'domains. The same capability is not always as seamless when one is trying to
    map access control and group relationships between dissimilar architectures. Windows
    2000 brings additional complexity into these trust mechanisms with its hybrid
    authentication and authorization framework. Incorporating Windows 2000 into existing
    NT domain topologies requires careful planning for how domain relationships will
    be migrated into the new domain tree and forest model. There are also a number
    of issues which must be resolved regarding two-way synchronization between Windows
    2000 and UNIX Kerberos namespaces.


    # Passwords


    An additional side effect of the mobility problem just described is that when
    one uses multiple computers, there tend to be multiple accounts and passwords
    corresponding to each platform. It can be a real challenge for users and administrators
    to attempt to keep accounts and passwords synchronized between diverse operating
    systems. There is also an additional security exposure in that encryption algorithms
    used on one system may not be supported on the other. The result may mean transmitting
    clear-text passwords over unsecured networks or maintaining password lists on
    unsecured workstations.


    # Sharing Resources with Samba


    Most of the issues described above can be resolved through the use of mutually
    supported software tools like Sun''s Network File System (NFS) or Novell Netware,
    which provide a means for sharing files, printers and access controls between
    UNIX and Windows. A robust and cost-effective alternative is Samba, developed
    by Andrew Tridgell. Samba is a drop-in replacement for the file- and print-sharing
    services normally provided by Windows NT- or LAN Manager-based systems. Samba
    augments these services by also encompassing UNIX file systems and printers in
    the mix of shared resources. Other Samba services include NetBIOS name service
    for browsing and limited NT Primary Domain Controller emulation. Since its inception
    in 1991 Samba has grown in popularity; it is now supported by over 100 commercial
    vendors worldwide. It has been ported to most flavors of UNIX as well as proprietary
    operating systems like VMS and MVS.


    In the next two chapters we will review the protocols and system services in UNIX
    and Windows that are critical to understanding and maintaining Samba. These chapters
    will benefit those system administrators and programmers who may be unfamiliar
    with one or the other of these operating systems. The remainder of the text will
    focus on Samba architecture, installation, configuration, and support tasks.


    # Chapter 2: UNIX Overview


    # Overview


    In the ''60s the adage was never to trust anyone over 30. UNIX is quickly approaching
    the age of 30-something, but contrary to this adage, I believe we can continue
    to rely on UNIX''s consistent, open and portable computing architecture well into
    its next decade. Over the years UNIX has evolved into a robust cross-platform,
    multi-tasking, multi-processing, multi-user operating system complete with a rich
    application and programming base. In this chapter we will focus on the UNIX tools
    and services required to support Samba. We will also cover general networking
    concepts important in internetworking UNIX and Windows resources. Those readers
    who have already earned their UNIX wizard''s merit badge may want to skip this
    chapter and go right to the next chapter, on Windows.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'Architecturally, UNIX can best be visualized as a tiered set of services and
    interfaces (Figure 2.1). At the foundation of the structure resides the kernel,
    which is responsible for managing the interfaces between all hardware components
    and the execution environment. This includes scheduling work, allocating memory,
    moving data, and informing tasks when various system events occur. On top of the
    kernel layer resides the shell. The shell, of which there is more than one, is
    essentially a command interpreter that accepts input, provides context, and requests
    services of the kernel on behalf of the user. The penthouse level of the UNIX
    tier comprises the user interface. Here reside all the commands, scripting languages,
    graphical interfaces, and utilities that enable the end-user to interoperate with
    the resources provided by the operating system. An important concept to remember
    when working with UNIX is that the general interface between all the system objects
    is that every object is abstracted as a file. This means that all operations are
    file operations regardless of whether the target is hardware, data, memory, or
    running tasks.


    ![](img/7684008b1d7775727df27d44aed5b3f0_14_0.png)


    Figure 2.1: UNIX Command, shell, kernel structure


    # Services and Daemons


    Each running task, along with its associated address space, is called a process.
    The group of active processes running under UNIX is analogous to the generations
    of a family tree. Child processes are begotten by parent processes. Processes
    are born, live out their lives, and then pass away. Occasionally they may even
    run away. The first process to run on every UNIX system is called init. Init is
    the great-grandparent from which all process generations owe their existence.
    Like any loving grandparent, init even takes in orphan processes that have lost
    their immediate parents. During the course of its life, each process wants to
    take a turn on the CPU. Just like children, processes the guidance of a scheduler
    to ensure that every process receives its fair share of CPU time. The system administrator
    acts as the grand overseer of the process universe, wielding ultimate control
    over the lives of all processes.


    Every process in the UNIX universe is christened with a positive integer number
    called the Process Identifier (PID). The PID is a vector index in the process
    table maintained by the kernel. PIDs are unique and are allocated in a somewhat
    random fashion. Process table entries point to per-process kernel data structures
    which define the attributes and values associated with the given process (Table
    2.1). The attributes of active processes can be interrogated from the command
    line by using the ps command (Example 2.1).


    Table 2.1: Sampling of Process Attributes'
