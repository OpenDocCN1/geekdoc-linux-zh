    # Table 11.5 Samba Share Modes


    | DENY_DOS | DOS compatibility mode. Additional opens by the same client are allowed.
    |

    | DENY_FCB | File compatibility mode. DENY_DOS open then set open to read/write.
    If first open client is writing then no other client reads are allowed. If first
    client is read-only, then additional client reads are allowed. |

    | DENY_ALL | All other open requests are denied. |

    | DENY_READ | Write-only opens are allowed. |

    | DENY_WRITE | Read- only opens are allowed. |

    | DENY_NONE | Additional open requests are allowed. |


    Opportunistic locking is a locking method that allows Windows clients aggressively
    to cache file data blocks on the local client. Three types of oplocks might be
    requested by a LAN Manager or Windows client. The first is called an exclusive
    oplock. This permits a client to obtain exclusive access to a file. The second
    type is a batch oplock. A file locked with a batch oplock allows the client to
    keep a file open on the server even though a local application on the client may
    have closed the file. The third type of oplock is a level II oplock and permits
    multiple client read access to a file with no writers. Enabling Samba oplock support
    (default) can realize file IO performance improvements of up to 30 percent. See
    the smb.conf (5) man page for details on lock parameters.


    ```

    oplocks=<yes, no>

    ```


    Samba release 2.0.5 introduced support for level II oplocks. The level2 oplocks
    allow a read/write client to downgrade its oplock to readonly when additional
    clients request access to a file.


    ```

    level2 oplocks = <yes, no>

    ```


    For specific instances when you want to allow multiple clients to request oplocks
    on the same file, you can direct Samba to permit multiple oplock request by enabling
    the fake oplocks parameter. Keep in mind that if this option is permitted on writeable
    shares, you'
