  md: '# Hybrid Cross-Subnet Browsing


    In some instances you may need to force announcements or browse list synchronization
    between subnets for topologies that don''t quite fall into the configurations
    we''ve examined thus far. There are any number of reasons for doing this, but
    note that the capability is not available in a native Windows environment.


