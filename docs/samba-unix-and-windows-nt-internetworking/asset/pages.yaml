    # Windows Printers


    Samba also supports UNIX printing to remote Windows printers via a spooling input
    filter, smbprint. The smbprint filter is basically a script wrapper for the smbclient
    command. smbprint pipes input into smbclient, which handles the connect session
    with the remote Windows spooling service. Two versions of the smbprint script
    are provided, smbprint (BSD) and smbprint.sysv (SYSV). The scripts are located
    in the Samba distribution subdirectory ./examples/printing.


    # smbprint (BSD)


    To enable access to Windows-managed printers from a BSD UNIX system, begin by
    installing the smbprint script into the Samba binary directory. Create an /etc/printcap
    entry for the remote Windows printer similar to Example 12.7. Select a printer
    name, one or more aliases, and a spooling directory location. Create the spool
    directory per the location identified by the /etc/printcap :sd option for the
    new network printer entry.


    # Example 12.7 BSD smbprint printcap Entry


    ```

    <printer name>: <printer alias>: \

    :cm=<printer description> \

    :sd=/var/spool/lpd/<printer name> \

    :af=/var/spool/lpd/<printer name>/<accounting file> \

    :if=/usr/local/samba/bin/smbprint \

    :mx=0 \

    :lp=/dev/null

    ```


    Within the designated printer spool directory create a file named .config which
    will be used by the smbprint script to identify the remote server, service, and
    password (Example 12.8).


    # Example 12.8 /var/spool/samba/<printer name>/.config


    ```

    server=<server NetBIOS name>

    service=<printer name>

    password="<printer share password>"

    ```


    Start the printer and validate access. smbprint will log activity messages to
    /tmp/smb-print.log. This file is quite useful for configuration debugging and
    testing. When you are certain the configuration is working as expected, edit the
    smbprint script and set the logfile parameter to /dev/null.


    ```

    logfile=/tmp/smb-print.log

    ```


    # smbprint (SYSV)'
