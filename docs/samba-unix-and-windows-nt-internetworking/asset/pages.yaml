    Problems can occur if the data are accessed via non-Samba controlled interfaces.
    The Samba client holding the oplock isn''t aware of access by the non-Samba application.
    Support for oplocks can be turned off for specific files by specifying one or
    more file-matching patterns as values to the veto oplocks files parameter.


