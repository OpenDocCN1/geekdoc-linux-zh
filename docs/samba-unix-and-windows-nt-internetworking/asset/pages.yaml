    \ mechanism for making all the printers identified in the UNIX printer configuration\
    \ file available for use. The `[printers]` share is a special `smb.conf` section\
    \ similar to the `[homes]` share discussed in Chapter 11. When an SMB connection\
    \ setup request is received by the server, Samba first scans `smb.conf`, attempting\
    \ to match the request to one of the specifically named shares. If a match is\
    \ not found, it will then scan the `passwd` database, attempting to locate a match\
    \ based on the client user name. If no match is found and a `[printers]` share\
    \ is defined in the configuration file, it will then scan the UNIX printer configuration\
    \ file to find a match. If a printer name match is found, Samba grants access\
    \ to a temporary `[printer name]` share created by cloning the `[printers]` section\
    \ definitions. A sample `[printers]` share is listed in Example 12.1.\n\n# Example\
    \ 12.1 Sample [printers] Share\n\n```\n[printers]\n    path = /var/spool/samba\n\
