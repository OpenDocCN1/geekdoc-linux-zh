    # LMHOSTS and WINS


    In some instances it may be helpful to have Samba resolve its own NetBIOS name
    queries using both the LMHOSTS table and WINS service. For example you might want
    to override WINS registrations for a particular name by setting an explicit entry
    in the LMHOSTS file. Using the name resolve order parameter you can instruct Samba
    to check LMHOSTS before trying WINS. Note that this feature is not supported for
    resolving remote queries when Samba is operating as a WINS server or proxy.


    ```

