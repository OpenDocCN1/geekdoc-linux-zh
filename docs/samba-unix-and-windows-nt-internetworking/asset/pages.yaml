    Initially, all users have password entries consisting of 32 "X" characters. This
    effectively denies access to the account until the password is changed by the
    administrator. You can allow users to change their own passwords by overwriting
    the first 10 "X" characters with the string NO PASSWORD (Example 7.5). You will
    also need to enable the null passwords parameter so that the smbpasswd command
    can connect to the smbd daemon without a password. Note that this presents a security
    risk in that users aren''t prompted for an existing password before setting the
    new password value.


