  md: '|  |  |

    |---|---|

    | com | Commercial |

    | net | Other networks |

    | Country Code | Two-character international identifier |


    On the server side, DNS is implemented under UNIX by the `named` daemon. Usually
    only a pair of DNS servers, primary and secondary, are configured for a given
    organization. It is not necessary to run named on each machine in a network. The
    named daemon obtains configuration information from the set of configuration files
    listed in Table 2.5. The full scope of the format and syntax of these tables is
    often complex and beyond the purpose of this text. The reader is directed to documentation
    regarding DNS setup and configuration for the given UNIX platform.


    ![](img/7684008b1d7775727df27d44aed5b3f0_20_0.png)


    Figure 2.3: Sample Internet domain hierarchy


    # Table 2.5 Named Configuration Files


    |  |  |

    |---|---|

    | named.boot | Default domain, zone and authority |

    | named.ca | Domain root cache prime information |

    | named.data | Local domain information |

    | named.rev | Reverse query information |


    All the machines in the organization which will be using DNS need to know where
    to find the primary and secondary name servers. This information is recorded in
    a `resolv.conf` file on each machine (Example 2.3). When a domain name is resolved
    to an IP address, a query is sent to the first name server in the `resolv.conf`
    list. If timeout period expires before an answer is received from the first name
    server, then the second name server is queried.'
