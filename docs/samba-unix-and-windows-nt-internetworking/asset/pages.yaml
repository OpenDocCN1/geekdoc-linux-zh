    UNIX has been around for about 30 years. Initially found primarily in academia
    and research environments, it is a powerful multi-user, multitasking operating
    system suitable for a wide range of applications. It is easily scalable from small
    single-user workstations to very large mainframe, multiprocessor, and cluster
    computing architectures supporting thousands of simultaneous users and processes.
    Because of the availability of source code, built-in programming environment,
    and a solid focus on standard interfaces and protocols, UNIX is easily ported
    to most hardware platforms. This has resulted in a rich set of public and vendor
    implementations. Yet general access to source code has also kept UNIX somewhat
    vendor independent. When we use the term "UNIX" we are usually referring to the
    full array of public and vendor versions available in the marketplace. It is true
    that each rendition of UNIX tends to have its own nuances, add-on features, and
    variations on the basic theme, but in general functionality has remained quite
    consistent across platforms over its long development history. In fact, the collective
    expertise of this large development community has greatly contributed to the overall
    maturity, interoperability, and robustness of the operating system.'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'On the down side, the most prominent complaint concerning UNIX is directed
    at its character-based command-line user interface. Although the rich set of commands,
    interpretive shells, and scripting languages provide a great deal of functionality
    for the programmer and systems administrator, their use and existence are not
    easy for the novice user. Most commands are cryptic shorthand strings and often
    derive context from the shell under which they are invoked. This can be quite
    confusing to all but experienced users. A graphical user interface called X Windows
    can be added to the operating system, but it does not entirely shield the user
    from the intricacies of the command interface. Another criticism is that although
    most applications can be easily ported between the various versions of UNIX, they
    are generally not binary-compatible from one vendor platform to another. This
    has tended to limit the availability of some products across all UNIX platforms.


    UNIX has found a home in many businesses because of its open interfaces and tight
    integration with Internet technologies. UNIX and the Internet grew up together.
    As specifications for internetworking protocols like TCP/IP were developed, they
    were quickly interwoven into the networking fabric of UNIX. Most of what we have
    come to expect concerning basic information-sharing services over the Internet
    were developed under UNIX. This has enabled UNIX to be used as a protocol and
    server Swiss Army knife for quickly and cost effectively connecting legacy proprietary
    computing infrastructures to the Internet.


