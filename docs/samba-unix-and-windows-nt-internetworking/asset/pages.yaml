- pgno: 201
  md: '# Configuration Files


    # Startup


    If you discovered by means of a ps process check, that one or both of the Samba
    smbd and nmbd daemons weren''t running verify that your daemon startup configuration
    is correct. Remember that the Samba daemons may be started either as persistent
    processes by init during system initialization or automatically when a service
    request is received by inetd (Example 15.11).


    # Example 15.11 Samba Daemon Startup Configuration


    ```

    init boot-time startup - /etc/rc<file>


    /usr/local/samba/bin/smbd -D

    /usr/local/samba/bin/nmbd -D


    -or-


    inetd service startup - /etc/inetd.conf


    netbios-ssn _stream tcp nowait root /usr/sbin/tcpd \

    /usr/local/samba/bin/smbd smbd

    netbios-ns _dgram udp wait root /usr/sbin/tcpd \

    /usr/local/samba/bin/nmbd nmbd

    ```


    # Service Ports


    Server connection problems may be related to missing or invalid port numbers in
    /etc/services. Make sure that udp port 137 and tcp port 139 are reserved by the
    netbios-ns and netbios-ssn services respectively (Example 15.12).


    # Example 15.12 Samba Port Configuration


    ```

    /etc/services


    netbios-ns      137/udp

    netbios-ssn     139/tcp

    ```


    # smb.conf


    Overall behavior of Samba is proscribed by the smb.conf file. The global section
    of smb.conf should include parameters that identify the server''s NetBIOS name,
    the workgroup/domain name, the security type, and whether passwords will be encrypted
    or in plain text (Table 15.4).


    # Table 15.4 Important Global Section Parameters'
  merge: -1
  img_proc: true
- pgno: 202
  md: '```

    security = <share, user, server, domain>

    netbios name = <server NetBIOS name>

    workgroup = <workgroup/domain name>

    password server = < >

    encrypt passwords = true

    ```


    Next check the parameters that identify Samba''s role in services like WINS, browsing
    and domains. Refer to the chapters regarding each of these services in order to
    confirm whether Samba is acting as a client or server. Verify that access control
    parameters in the global and service sections of smb.conf are reflecting the desired
    access permissions for the server and each share. For example, you may be blocking
    access due to improperly configured hosts allow and hosts deny parameters.


    The smb.conf file can become unwieldy for complex sites with large numbers of
    servers, services and/or users. Tools like testparm and SWAT can be used to assist
    in certifying correctness. testparm validates the syntax and options you have
    specified for each section of smb.conf. If a host name or IP address is supplied
    as an option, it will check the access rights of the specified host.


    ```

    $ testparm < -s configfilename> <hostname hostIP>

    ```


    SWAT is a system administration tool that provides html forms for each section
    in smb.conf (Figure 15.2). SWAT can be used to simplify general configuration
    tasks allowing the system administrator to focus on the section parameter definitions
    of interest.'
  merge: -1
  img_proc: true
