    Each subnet within a domain has a local master browser to localize browsing traffic.
    Servers within the domain register their shares with the local master. The subnet
    local master is elected from the candidate computers within a domain, via a dynamic
    bid process. Each computer bids by announcing its operating system level, revision,
    and desired browser role as a four-byte string called its election criteria (Table
    3.4). The computer with the highest election criteria wins the election and announces
    its claim to victory. Other contenders are demoted to backup browser status to
    support redundancy and load sharing. The election process is called when a client
    believes that the local master has failed or is unavailable.


