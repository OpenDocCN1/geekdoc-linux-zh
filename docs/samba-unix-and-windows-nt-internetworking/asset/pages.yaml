    # Samba History


    Samba is the brainchild of Andrew Tridgell. It all started in December 1991, while
    he was working as a graduate student in the Computer Sciences Laboratory at Australian
    National University. According to his own account (see http://us3.samba.org/samba/ftp/docs/history/)
    Andrew came up with the idea of trying to reverse-engineer the file-sharing protocol
    used in Digital Equipment Corporation''s Pathworks network for DOS while testing
    a beta copy of DEC''s eXcursion software. eXcursion provides X Windows services
    for PCs. Testing eXcursion required that he abandon PC-NFS for file sharing and
    mount disk space using Pathworks. The problem was that Pathworks limited his network
    file service options to DEC platforms running Ultrix or VMS.


    Being an open systems-minded fellow, Andrew decided to eavesdrop on Pathworks
    network traffic to see if it might be possible to port the protocol to other platforms.
    This required an extra bit of research on network programming and the building
    of a software tool to capture network packets off the wire. After poring over
    the bits and bytes of Pathworks'' packet data, he was able to prototype a few
    basic file operations on a Sun computer he used as a development platform. Additional
    investigations in the protocol ultimately led him to the NBT RFC literature. Although
    apparently uncertain how the NBT specification related to his SMB implementation,
    he continued to refine the code and in January 1992, "Server 0.1" was born.


    Over the next few months, Andrew continued porting the software to other non-DEC
    platforms. This work also included a smattering of bug fixes and additional improvements.
    The time had come to brand the software with a real version number. "Server 1.0"
    was ready and subsequently released to the Internet community. Then like any good
    software development project, the code was left to ferment for a couple of years
    under public scrutiny.


    The project was brought back out of the cobwebs after receiving a note of interest
    concerning the software from Linux aficionado Dan Shearer. There was also a request
    from DEC to include the software on their Alpha-contributed works CD. A bit of
    Linux-to-PC home networking and the discovery of the full Microsoft SMB specification
    gave the development effort an additional push. In December 1993, the project
    resurfaced as "NetBIOS for UNIX." "Server" was temporarily recoined as "smbserver"
    however, the name'
  merge: -1
  img_proc: true
