  - 5.2 附加登录选项
- - '###'
  - 你登录并启动 X 窗口后，GNOME 没有启动，你需要配置 X 使其同时也启动。具体方法取决于你使用的 Linux 发行版。通常情况下，你需要在目录下放置一个可执行的配置文件（.xirc），包含命令
    `exec gnome-session`。具体细节取决于你使用的 Linux 或版本。
