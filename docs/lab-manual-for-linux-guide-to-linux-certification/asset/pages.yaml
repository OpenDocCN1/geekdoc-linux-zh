    # Lab 13.5 DETECTING AND REPLACING MISSING PACKAGE FILES


    # Objectives


    Sometimes files are erased from a hard disk. This can be because of a mistake
    or an attack. If these files are part of a package, the programs in the package
    might not run or might not run properly. You need some way to detect when files
    are missing and means to replace them. Package managers can do that for you. This
    lab exercise shows how the Red Hat Package Manager (RPM) performs these functions.


    # Materials Required


    This lab requires the following:


    +   * Access as a root user to a computer running Linux


    +   * Red Hat Linux CD-ROMs


