  md: '# Chapter 1 Introduction to Linux


    Estimated completion time: 30 minutes


    # ACTIVITY


    ![](img/3bd24ceeed5983554c0123729814a2d6_13_0.png)


    +   1. Start your Web browser.

    2. Type http://www-ibm.com/linux/ in the Address bar of the browser, and then
    press Enter. The Linux at IBM Web page appears.

    3. Click the WebSphere link. The page gives you details about IBM''s WebSphere
    product. WebSphere can run on Linux and the Apache Web server—another popular
    open-source software package. By basing their for-profit products on nonprofit
    open-source software, IBM can bring high-quality products to market quickly without
    the many security holes you find in popular commercial software. Now click your
    browser''s Back button to go back to the home page. Now click the e-business software
    for Linux link. The page appears has a section called Application solutions with
    links for accounting, commerce, and finance. Click these links You''ll see there
    are numerous accounting and financial packages for Linux. One the common ACCPAC
    software that is popular on the DOS and Windows platforms.

    5. Click your browser''s Back button to go back to the home page. Now click the
    DB2 link. The page appears tells you that IBM''s high-end SQL database product
    runs on Linux. IBM now considers Linux to be one of the primary platforms for
    DB2. If you go to the Oracle Web site (http://www.oracle.com) you''ll see that
    Oracle has ported its SQL database product to Linux as well. Most high-end SQL
    servers, such as Informix, run on Linux, with the exception of Microsoft SQL Server.

    6. Type http://www.novell.com in the Address bar of the browser, and then press
    Enter. The Novell home page appears. Click the Search link in the upper-right
    corner. Enter Linux and click on the Search button. The next screen has several
    to Novell products that either run on Linux or use opensource software or both.
    The open-source Apache Web server is now. Novell''s official Web server and a
    few Novell products are based on it.

    7. Note that there are several pages of links to Linux-related content on Novell''s
    Web page. You can review the pages on Novell''s ZENWorks, iFolder, and iCh products.
    Like IBM, Novell has opted to save its engineering resources by using secure software
    that''s already been written and debugged by the open-source community. Rather
    treating the open-source community as the enemy or claiming that open-source software
    is un-American or stifles innovation. IBM and Novell have recognized the win-win
    possibilities and have exploited them.'
  merge: -1
