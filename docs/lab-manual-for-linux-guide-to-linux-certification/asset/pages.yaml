    but not a lot. That''s because it is configured to allow the Gnome desktop to
    have most of control. Other window managers are more functional when you won''t
    be running a graphical desktop environment on top of the window manager.


    +   8. The twm (Tabbed Window Manager) window manager is a basic window manager
    intended to be the entire graphical user interface. You don''t run a graphical
    desktop, such as KDE or Gnome, on top of them. Run it by entering twm & You see
    the screen change almost immediately; twm is a small program and loads quickly.


    +   9. Note that twm has no maximize and minimize buttons. Instead, there is a
    single button in the upper-right corner that resizes the screen. Click the button
    and hold it down. You see a grid that divides the window into six equal pixels.
    Move the mouse cursor slowly outside the window Once the mouse cursor leaves the
    window, the window grows in that direction. If you reverse the mouse direction,
    the window shrinks. Change the mouse direction by 90 degrees and you resize the
    window''s other axis.


    +   10. You can move the window by clicking the title bar, holding the mouse button
    down, and moving the mouse just as you did with Sawfish. Release the mouse button.


    +   11. Move the mouse away from the xterm windows onto the screen background.
    Click the left mouse button. A menu appears. Unless you''configured the twm menu
