  md: '# LAB 7.5 BUILDING A RAID-5 ARRAY


    # Objectives


    The goal of this lab is to build a RAID-5 drive array using Linux. RAID arrays
    are best implemented using either hardware-based RAID controllers or using SCSI
    drives if software-based. Chances are that your computer has neither hardware
    nor SCSI drives. You use your IDE drives to create a RAID-5 drive array on your
    computer. However, this should be considered a simulation because it''s pointless
    to create a RAID array with only one hard disk.


    # Materials Required


    This lab requires the following:


    +   - A computer running Linux

    - A Linux kernel with RAID support

    - One or two hard disks with four available partitions (you have this if you completed
    Lab 7.3)


    Estimated completion time: 45 minutes


    # Activity Background


    A RAID-5 drive array consists of at least three hard drives, though there are
    possible there are people who argue that a two-drive RAID-5 array is possible.
    You are free to use more than three hard drives in a RAID-5 drive array. There
    is no specified maximum number of drives. You''re limited to the number of physical
    drives you can connect to your computer, but there are reasons why you''d want
    to restrict the number, such as overloading a SCSI bus and thus creating a performance
    problem.


    If you use hard drives of unequal sizes, the RAID-5 drive array uses the smallest
    size for all drives. For example, if you build a RAID-5 drive array with three
    drives that have capacities of 4, 6 and 8 GB, only 4 GB of space are used on all
    three drives. It''s best that you use the same size drives in a RAID-5 drive array.
    The only downside to using unequally sized drives is wasting disk space.'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# Lab 7.5 Building a RAID-5 Array 101


    The size of a RAID-5 drive is (n-1)*s, where n is the number of drives in the
    array and s is the size of each drive. For example if you use four drives and
    each is 8 GB, the capacity of the array is 24 GB ((4-1)*8). The missing 8 GB is
    used to store parity information, which is used to keep the array operating if
    one drive fails.


    ![](img/3bd24ceeed5983554c0123729814a2d6_110_0.png)


    # ACTIVITY


    +   1. Log in as the root user on a computer running Linux. If you are at the
    graphical desktop, press Ctrl+Alt+F2 to go to a text console. This computer should
    have at least four available Linux partitions with which you can experiment. The
    data on these partitions will be destroyed. You have these partitions if you completed
    Lab 7.3.

    2. The computer must be running a Linux kernel that RAID functionality built in.
    Most Linux distributions install a kernel with RAID support. You can tell whether
    your running kernel has RAID support by checking to see if /proc/mdstat exists.
    If it does exist, you can continue on this lab exercise. If it does not exist,
    you cannot complete this lab exercise.


    ![](img/3bd24ceeed5983554c0123729814a2d6_110_1.png)


    If your Linux kernel does not support RAID, you may have to recompile the kernel.


    3. The /proc/mdstat file contains information about your computer''s RAID status.
    Enter cat /proc/mdstat You see this if your kernel has support for RAID but you
    have no RAID arrays configured:


    > Personalities :

    read_ahead not set

    unused devices: <none>


    4. The first line in the above example shows that no RAID personalities are loaded.
    This means that the kernel has general RAID support built in but does not have
    RAID-5 support configured. This is typical of Red Hat Linux and perhaps, a few
    other distributions. You need to load the RAID-5 personality. Enter insmod raid5
    Enter cat /proc/mdstat You should now see:


    > Personalities [:raid5]

    read_ahead not set

    unused devices: <none>


    5. To configure a RAID-5 drive array, use your favorite text editor and create
    a file /etc/raidtab. It should contain the following lines if you have completed
    Lab 7.3. You need to adjust the names of the partitions if your Linux partitions
    differ from the names that are in below:


    ```

    raiddev  dev/md0      5

    nr-raid-disks  4

    ```


    ![](img/3bd24ceeed5983554c0123729814a2d6_110_2.png)'
