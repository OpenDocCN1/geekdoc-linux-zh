  md: '# LAB 9.1 SETTING THE INITIAL RUN-LEVEL


    # Objectives


    The purpose of this lab is to learn how to change the default run-level at startup.
    Many Linux distributions, including Red Hat Linux, set the initial run-level to
    5, which automatically sets the graphical user interface. Some users don''t want
    this and prefer that the system boots up to a command prompt (such as run-level
    3). This is easy to configure by modifying the /etc/initab file. In this lab you
    experiment with initial run-levels, not specifying a run-level at all.


    # Activity Background


    The common run-levels and their meanings are:


    +   0 - Halt the system

    1 - Single user mode

    2 - Multiuser mode but no networking support

    3 - Multiuser mode with full networking support

    5 - Multiuser mode with full networking support and start the graphical user interface

    6 - Reboot the system


    # Materials Required


    This lab requires the following:


    +   Access as a root user to a computer running Linux


    Estimated completion time: 30 minutes


    # ACTIVITY


    +   1. Switch to a command-line terminal (tty2) by pressing Ctrl+Alt+F2, and log
    in to the terminal as root.

    2. Using your favorite text editor, edit the /etc/initab file.

    3. Locate the statement that looks similar or identical to this:

    id:5:initdefault:

    This statement tells the init program that it should start Linux in run-level
    5 when you boot your computer. This loads the graphical subsystem before you''re
    prompted to log in. Change this so your computer boots to run-level 3 (a command
    line).


    ![](img/3bd24ceeed5983554c0123729814a2d6_133_0.png)'
  merge: -1
  pgno: 133
- img_proc: true
  md: '# Lab 9.1 Setting the Initial Run-level


    4. Modify the line so it looks like this:


    ```

    id:3:initdefault

    ```


    5. Save the file and exit the editor.


    6. Reboot the computer by pressing Ctrl+Alt+Del. When the kernel program is loading
    itself, it begins running the init program. The init program reads the /etc/inittab
    file and begins performing actions it finds there. The statement you modified
    tells it to start up in run-level 3. It does not start the graphical user interface.
    You can use a text-mode login prompt. Log in as root.


    7. Using your favorite text editor, edit the /etc/inittab file again. See what
    happens if you do not tell the init what run-level to use. You can do this by
    commenting the line. Add a number sign (#) at the start of the line. The line
    should look like this:


    ```

    #id:3:initdefault

    ```


    8. Save the file and exit the editor.


    9. Reboot the computer by pressing Ctrl+Alt+Del. When the kernel is loading, the
    init program reads the /etc/inittab file and begins performing the actions it
    finds there. Because you removed the line that tells init the initial run-level,
    init doesn''t know what to do. It prompts you for the run-level, as shown here:


    ```

    Enter run-level:

    ```


    10. To start the system in run-level 3, type 3 and press Enter. The system finishes
    booting in run-level 3. You see a text-mode login prompt.

    If you don''t want to be prompted for the run-level every time you boot Linux,
    restore the /etc/inittab file by editing it to remove the number sign at the start
    of the line that specifies the initial run-level. If you''re running your computer
    as a desktop, it probably makes sense to set the initial run-level to 5. If you''re
    running your computer as a server, it probably makes sense to set the initial
    run-level to 3. If you want to choose the run-level every time you boot the computer,
    remove the line from the /etc/inittab file or comment it out.


