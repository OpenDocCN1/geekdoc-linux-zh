  md: "# Chapter 6 Linux Filesystem Administration\n\nYou might see an error message\
    \ such as \"Problem reading cylinder 27, expected 18432, read 10240.\" This generally\
    \ means that your floppy disk is bad. Try a different or new floppy disk. Floppy\
    \ disks can't be trusted after 10 years, and can generally be unreliable. Don't\
    \ save critical data on floppy disks, and don't expect data saved on floppy disks\
    \ to be readable many years later.\n\n![](img/3bd24ceeed5983554c0123729814a2d6_83_0.png)\n\
    \n4. You've just low-level formatted the floppy disk to the same capacity as DOS\
    \ and Microsoft Windows does. Place an ext2 file system on the floppy disk by\
