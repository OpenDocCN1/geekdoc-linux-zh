  md: '# Lab 7.4 Building a RAID-0 Array


    Estimated completion time: 45 minutes


    # ACTIVITY


    +   1. Log in as the root user on a computer running Linux. If you''re at the
    graphical desktop, press Ctrl+Alt+F2 to go to a console. This computer should
    have at least two available Linux partitions with which you can experiment. (You
    created such partitions in Lab 7.3.) This means the data on these partitions will
    be destroyed.


    +   2. The computer must be running a Linux kernel that has RAID functionality
    built. Most Linux distributions install a kernel with RAID support. You can tell
    whether your running kernel has RAID support by checking to see if /proc/mdstat
    file exists. If it does exist, you can continue on this lab exercise. If it does
    not exist, you cannot complete this lab exercise.


    +   3. If your Linux kernel does not support RAID, you may have to recompile the
    kernel.


    +   3. If /proc/mdstat file contains information about your computer''s RAID status.
    Enter cat /proc/mdstat. You see the following if your kernel has support for RAID
    and no RAID arrays configured:


    Personalities :

    read ahead not set

    Unused devices: <none>


    The first line in the above example shows that no RAID personalities are loaded.
    This means the kernel has general RAID support built in but does not have RAID-0
    support configured. This is typical of Red Hat Linux and perhaps, few other distributions.
    You need to load the RAID-0 personality. Enter insmod raid0 /proc/mdstat. You
    should now see this:


    Personalities [:raid0]

    read ahead not set

    Unused devices: <none>


    +   5. To configure a RAID-0 drive if you have one hard disk, use your favorite
    text editor and create a file called /etc/raidtab. It should contain the following
    lines if you have partitioned the drives as described in Lab 7.3. You need to
    adjust the names of the partitions if your available Linux partitions differ from
    the device names that are in bold below:


    ```

    raidev /dev/md0 0

    raid-level nr

    raid-disks 2

    pistent-superblock 1

    ```'
