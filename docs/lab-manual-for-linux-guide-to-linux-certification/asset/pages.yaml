    12. You can run your own programs. They can run once when the system starts up
    or can be respawned just like getty. Edit the /etc/inittab file by having init
    run the sleep program for 60 seconds. After 60 seconds, the sleep program terminates
    and init launches a new copy of it. Add this line to the end of the file:


    ```

    sl::respawn:sleep 60

    ```


    In theory, you could run your entire system startup (scripts and all) with inittab.


    13. Tell the init program that you changed its configuration file, and have it
