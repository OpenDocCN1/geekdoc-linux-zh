    # LAB 10.3 Using REMOTE X SERVERS


    # Objectives


    One benefit of the X Window System is that programs (X client applications) running
    on one computer can use the display, keyboard, and mouse of another computer running
    on an X server, as illustrated in Figure 10-3


    ![](img/3bd24ceeed5983554c0123729814a2d6_159_0.png)


    Figure 10-3 X servers allow X client applications to run on remote computers


    This lab shows how an X client can be connected to an X server running on another
    computer connected to the network. This is normally a simple thing to do. It involves
    setting the DISPLAY environment variable at the X client side of the connection
    and allowing the client connection at the X server side. There are numerous methods
    to secure this'
