  md: '# Chapter 11 Managing Linux Processes


    9. Change the scheduling priority by typing r When you see the PID to rename:
    prompt, enter the PID number of the primes process, and press Enter When you see
    the Renice PID x to value: prompt, enter -10 and you see an error message says
    "Renice of PID x to 01 failed: Permission denied." Other negative values between
    -1 and -20. The result should occur. Nonroot users are not allowed to change the
    scheduling priority to negative values They cannot make their processes run faster
    than the nominal value.


    10. Switch to the fourth virtual console (tty4) by pressing Alt+F4 Type to and
    press Enter you see the processes that was started by your nonroot user also see
    two processes in the second virtual console. One process is running as root and
    the other is running as nonroot user.


    Notice that one process is running (R) while the other is stopped (S). You can
    never have more than one process running at the same time. This is why you were
    asked not to use the i command.


    ![](img/3bd24ceeed5983554c0123729814a2d6_187_0.png)


    11. To change the scheduling priority of the primes process to a negative value.
    Type r When you see the PID to renice prompt, enter the PID number of the primes
    process, and press Enter When you see the Renice PID x to value: prompt, enter
    -10 and press Enter. This should succeed because you are using a top program that
    running as root. This proves that the root user can change the scheduling priority
    of any process running as a nonroot user.


    12. Switch to the third virtual console (tty3) by pressing Alt+F3 The top process
    should still be running there is the nonroot user. Let''s see if the nonroot user
    can change the scheduling priority of a process running as root Type r When you
    see the PID to renice prompt, enter the PID of that process''s running as root,
    and press Enter When you see the Renice PID x to value: prompt, 10 and press Enter.
    This should fail with a "Renice of PID x to 0: Operation not permitted" message.
    The same thing happens if you specify a negative value This proves that a nonroot
    user cannot change the scheduling priority of a process running as root regardless
    of the scheduling priority value.


    Everything you''ve done here with top works the same way when you use the renice
    process.


    ![](img/3bd24ceeed5983554c0123729814a2d6_187_1.png)


