    # LAB 9.2 MODIFYING CTRL+ALT+DEL


    # Objectives


    In this exercise, you learn to reconfigure the "shutdown" key sequence (Ctrl+Alt+Del)
    to halt the computer rather than reboot it (the usual configuration). Rebooting
    your computer may be a common thing to do in Windows, but it''s rare to reboot
    in Linux, because rebooting is not required after most configuration changes in
    Linux, and Linux is a more stable operating system. After you define the Ctrl+Alt+Del
    sequence to halt the computer rather than reboot it, you change the key combination
    that causes the shutdown process to occur. To do this, you modify the keyboard
    map file.


    # Activity Background


    The keyboard map is a text file that has a standard format, but the location of
    the file is not the same for all Linux distributions. Red Hat Linux places the
    file in the /lib/kbd/keymaps/i386/qwerty/ directory if you''re using a PC. Slackware
    places it in /usr/share/kbd/keymaps/i386/qwerty/ directory. Other distributions
    may place it in other directories. The program that reads the keyboard map file,
    loadkeys, has this directory compiled into it so you don''t have to specify the
    directory, though you could.'
