- img_proc: true
  md: '# Lab 6.1 Mounting and Ejecting CD-ROMs


    If you have more than one removable media device in your computer, such as a CD-ROM
    drive and a Zip drive, the eject -t command may affect the wrong device. If this
    is the case, you must specify the device with a command such as eject -t /dev/cdrom.


    +   6. The drive tray closes, but the CD-ROM does not mount. Enter mount to see
    that the CD-ROM is not mounted.


    +   7. To eject the CD-ROM, enter eject or eject /dev/cdrom. The CD-ROM drive
    opens because the CD-ROM is not mounted.


    +   8. Close the drive tray by entering either eject -t or eject -t /dev/cdrom.


    +   9. Mount the CD-ROM by entering:

    nmount -t iso9660 /dev/cdrom/mnt/cdrom

    or the shorthand notation: mount /dev/cdrom.


    You can only use the shorthand notation if you have an entry in the /etc/fstab
    file such as:

    /dev/cdrom /mnt/cdrom iso9660 defaults 0 0


    +   10. Check that the CD-ROM is mounted by entering mount and looking for this
    line in the output:

    /dev/cdrom on /mnt/cdrom type iso9660 (ro,default)


    +   11. Make the CD-ROM mount your current directory by entering cd /mnt/cdrom
    and press Enter.


    +   12. Try to eject the CD-ROM by entering either eject or eject /dev/cdrom.
    The drive should should not open because the drive is mounted and the drive''s
    mount point is your current directory. You should see an error message.


    +   13. Try to open the drive tray by pressing the button on the front panel of
    the CD-ROM drive.The drive tray should not open because it is still mounted.


    +   14. You can make the eject command automatically unmount the CD-ROM and it
    if your current directory is not the CD-ROM mount point. Type cd and press Enter
    to go to your home directory. Type eject and press Enter. The CD-ROM will be unmounted
    and the drive door will open.


    +   15. You can enable the autoject mode for the CD-ROM, which will automatically
    close the drive tray when you mount the CD-ROM and open the drive tray when you
    unmount the CD-ROM. Turn on autoject eject -a on /dev/cdrom.


    +   16. Unmount the CD-ROM and notice that the drive tray opens by entering mount
    /dev/cdrom.


    +   17. Mount the CD-ROM and notice that the drive tray closes by entering either
    mount /dev/cdrom or mount -t iso9660 /dev/cdrom/mnt/cdrom.'
