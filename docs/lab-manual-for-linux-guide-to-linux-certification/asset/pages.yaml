  md: '# Chapter 3 Linux Installation & Usage


    "tty" is an abbreviation for teletype, an obsolete electromechanical terminal
    popular in the early days of computing. Linux and UNIX use this abbreviation to
    refer to modern-day consoles. To refer to a tty, Linux requires that you pre-
    the name with /dev/.


    Switch to tty5 by pressing Alt+F5 You see the string "Hello from tty2" appear
    on this terminal screen as in this example:


    ```

    Red Hat Linux Release 7.2 (Enigma)

    Kernel 2.4.7-10 on an i686

    merryl login:Hello from tty2

    ```


    Because you wrote a message to tty5 and it happened to appear next to a login
    prompt does not mean you''ve now told the system that you want to log in as user
    "Hello from tty2." Any running program that happens to be using tty5 (in this
    case, the login program) is unaware that you just wrote to its.


    From tty5, write to tty2 with this command:


    ```

    echo "Hello yourself" > /dev/tty2

    ```


    Press Alt+F2 to go back to tty2. Notice the string "Hello yourself" appears here.


    In case you are wondering why using tty1 was avoided for this exercise, press
    Alt+F1 to find out. This screen is filled with messages from the graphical subsystem
    that supports your graphics desktop! Your graphics subsystem is currently using
    this screen, so you can''t use it. Leave it to its business and Alt+F2 to go to
    tty2.


    So far you''ve sent text messages to other terminals. You can also copy one device
    to another. One interesting device is the random number generator, called /dev/urandom.
    Copy random numbers to tty5 with this command:


    ```

    cat /dev/urandom > /dev/tty5

    ```


    You''ll likely hear your computer''s beeping. This is normal.


    Switch to tty5 by pressing Alt+F5 Your screen should be rapidly filling with characters
    and scrolling as random numbers are displayed.


    The random numbers from /dev/urandom do not appear as normal decimal numbers.
    They are binary numbers that the tty interprets as characters.


    +   10. Stop the random numbers from being displayed on tty5 by pressing Ctrl+C
    when you''re in either tty5 or tty2.


    +   11. To go back to your graphical desktop, press Alt+F7.'
