  md: '# LAB 15.3 INSTALLING AND CONFIGURING NcFTPd


    # Objectives FTP is a popular method of transferring files over a network. The
    most popular FTP server for Linux is WuFTP. It is included with nearly all Linux
    distributions. However, it can be difficult to configure and has security issues.
    Experienced Linux users and administrators often use other FTP server software.
    One such alternative is NcFTPd. In this exercise you download, install, and configure
    NcFTPd.


    # Materials Required


    This lab requires the following:


    +   - Access as a root user to a computer running Linux that also has an ordinary
    user account

    - A Web browser and access to the Internet


    Estimated completion time: 40 minutes


    # ACTIVITY


    +   1. Start your Web browser and enter http://www.neftpd.com/neftpd in your Web
    browser''s URL line.

    2. Read the home page to see the benefits of using this FTP server. Pay attention
    to the fact that NcFTPd does not use inetd (or xinetd in recent versions of Red
    Hat Linux), which results in,higher performance. NcFTPd also does not have to
    call other programs, such as /bin/ls, to do its job.

    3. Click the security link to learn how NcFTPd is more secure than WuFTP.

    4. Go back to the home page, and click the Download Now!

