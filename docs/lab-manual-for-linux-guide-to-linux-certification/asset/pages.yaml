  md: '# LAB 2.1 BOOTING FROM A LINUX ROOT/BOOT DISK


    # Objectives


    The goal of this lab is to learn to create a Linux root boot disk that you can
    use to discover details about your computer''s hardware. You can use this disk
    on computers that do not already have a Windows operating system installed.


    # Materials Required


    +   This lab requires the following:

    - An Internet connection and any Web browser operating on a computer capable of
    running DOS programs, such as DOS, Windows 95, or Windows 98

    - A program that decompresses and unarchives zip files such as Kunzip or WinZip

    - A high-density 3.5-inch disk


    # Activity Background


    In the main text, you use Windows to discover the details of the hardware in the
    computer you''re going to install Linux. However, if you don''t already have Windows
    installed, you can boot the computer with a Linux root/boot disk and have Linux
    tell you what hardware is in your computer.


    A Linux root boot disk allows you to boot Linux from a floppy disk and run it
    without using your computer''s hard disk. It does this by using some of your system''s
    memory as a virtual disk. One of the most popular Linux root boot disks is Tomsrtbt,
    available from www.toms.net/rb.


    Estimated completion time: 35 minutes


    ![](img/3bd24ceeed5983554c0123729814a2d6_23_0.png)


    # ACTIVITY


    +   1. Start your Web browser.

    2. Enter www.toms.net/rb in the Address bar of the browser, and then press Enter.
    The Tomsrtbt Web page appears.

    3. Click the link to download Tomsrtbt.

    4. Click on a mirror site close to you. You should now see a list of files.

    5. Click on the link Current version is: 2.0.103 Download Tomsrtbt and click on
    the mirror site to start the download. When prompted, save the file on your hard
    disk and note the location where you saved it.

    6. Uncompress the file you just downloaded. Read the Tomsrtbt FAQ file and note
    the installation instructions.'
  merge: -1
