    # Activity Background


    Any operating system will fail to work reliably if the computer''s memory is faulty.
    Linux is no exception. Before installing Linux, it''s a good idea to check your
    computer''s memory. The memory test that conducted each time you start up your
    computer is not a comprehensive one, and some memory problems may escape detection.
    It''s best to run a comprehensive memory testing program such as Memtest86.


