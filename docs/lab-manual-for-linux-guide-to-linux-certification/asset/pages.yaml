  md: '# Lab 6.2 Low-level Formatting of Floppy Disks


    # Materials Required


    This lab requires:


    +   - Access as the root user to a computer running Linux. The computer must have
    a 3.5-inch, high-density floppy disk drive installed.

    - One 3.5-inch, high-density floppy disk


    # Activity Background


    Linux doesn''t restrict you to 1.44 MB...


    **Table 6-1** Device names and capacities for 3.5-inch floppy disks


    | Device Name | Capacity |

    |---|---|n| /dev/fd0u1600 | 1600 KB |

    | /dev/fd0u1680 | 1680 KB |

    | /dev/fd0u1722 | 1722 KB |

    | /dev/fd0u1743 | 1743 KB |

    | /dev/fd0u1760 | 1760 KB |

    | /dev/fd0u1840 | 1840 KB |

    | /dev/fd0u1920 | 1920 KB |


    To format these higher-capacity disks, you use the device name with the `fdformat`
    program as Step 3 of the Activity shows. Note that these higher-capacity formats
    are not usable with Windows, which has a maximum capacity of 1440 KB for floppy
    disks.


    Estimated completion time: **30 minutes**


    ![](img/3bd24ceeed5983554c0123729814a2d6_82_0.png)


    # ACTIVITY


    +   1. Switch to a command-line terminal (tty2) by pressing **Ctrl+Alt+F2** and
    log in to the terminal using the root user account.

    2. Insert a 3.5-inch, high-density floppy disk into the floppy drive: If the floppy
    disk has data on it, it will be destroyed by this exercise.

    3. Perform a low-level format by entering `fdformat /dev/fd0u1440`. You see this
    appear:


    Double-sided, 88 tracks, 18 sec/track. Total capacity 1440 KB.

    Formatting ... done

    Verifying ... done'
