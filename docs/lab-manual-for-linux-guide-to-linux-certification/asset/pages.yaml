  md: '# Chapter 12 Common Administrative Tasks


    You can recover disk space by deleting old files that are no longer needed or
    moving files onto other media (tape, optical media, etc.). To identify old files
    as such, you look to the date and time stamps on files. Each file has three date
    and time stamps, and administrators should know how they work if they''re to identify
    old files with precision.


    # Materials Required


    This lab requires the following:


    +   - Access as a root user to a computer running Linux


    # Activity Background


    Linux files have three date and time stamps:


    +   - The creation time or ctime

    - The access time or atime

    - The modification time or mtime


    The modification time is automatically set to the current time and date when the
    file or directory is created. It is also changed to current time when a file''s
    permissions, attributes, owners or contents change. The access time is automatically
    changed to the current time and date when the file is opened. The modification
    time is changed when the file is written to closed.


    Estimated completion time: 45 minutes


    # ACTIVITY


    +   1. Switch to a command-line terminal (tty2) by pressing Ctrl+Alt+F2, and log
    in to the terminal using any username.

    2. Go to Betty''s home directory that you created in Lab 12.3. Type cd/home/betty
    and press Enter.

    3. Remove all files in this directory. Type rm * and press Enter. Answer y if
    you''re prompted with an rm: remove filename message.

    4. Create a new file named file1. Type touch file1 and press Enter.

    5. Normally, the ls command displays mtime. Type ls and press Enter. Notice the
