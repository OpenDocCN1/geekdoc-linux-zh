    | USER | TTY | FROM | LOG IN | IDLE | JCPU | PCU | WHAT |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | root | tty1 | | 12:37pm | 35:06 | 0.14s | - | -bash |

    | root | tty2 | | 1:21pm | 36:11 | 8.75s | 8.69s | top |

