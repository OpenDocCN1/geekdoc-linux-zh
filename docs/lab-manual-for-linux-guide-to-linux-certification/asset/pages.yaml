    # # Activity Background


    The hdparm program can be used to change many of the settings relating to your
    hard disk. Some of these settings were determined when you installed Linux on
    your computer, or may be controlled by your computer''s BIOS. The hard disk settings
    may already be optimized for your computer, or you may be able to improve the
    performance of your hard disk by adjusting these settings. In this lab exercise,
    you change hdparm settings so you can see the effects these settings have on performance
    as measured by the bonnie program. You can easily restore your original settings
    by rebooting Linux.


    In this exercise, the results of testing using the bonnie program are shown for
    a sample computer. Your results will likely be different.


    ![](img/3bd24ceeed5983554c0123729814a2d6_236_0.png)


    # # ACTIVITY


    +   1. Switch to a command-line terminal (tty2) by pressing Ctrl+Alt+F2, and log
    in to the terminal as the root user.

    2. Use the hdparm program to change your hard disk settings to ensure minimum
    hard disk performance. Your computer is not likely to be set like this: Assume
    that your hard disk is /dev/sda. If it''s not, substitute the correct device name
    for hda. hdparm -c0 -d0 -m0 /dev/sda The -c0 parameter sets sixteen-bit data transfers.
    Most modern EIDE disks support 32-bit transfers. The -d0 parameter turns off DMA
    transfers, thus requiring your processor to get more involved with the multiple-sector
    I/O. The -m0 parameter turns off I/O, also called IDE Block Mode. Refer to the
    hdparm man page for more detail on the available

    3. Run the bonnie program with a 400 MB test file by entering bonnie -s 400. This
    is appropriate for a computer with 128 MB of memory or less. If you have more
    memory, you should choose a larger test file. For example, if you have 256 MB
    of memory, the results for your computer show that the Sequential Output Per Block
    is 3461 KB/s (3.4 MB/s), and 97.3% of the CPU was used during that test. The number
    of Random Seeks is 49.3 and 20.8% of CPU time was used. These are poor results
    for any modern computer.

    4. Now run the hard disk using 32-bit data transfers by entering hdparm -c3 /dev/sda.
    Run the bonnie program again by entering bonnie -s 400 The results show that the
    Sequential Output Per Block is 5051 KB/s (5.1 MB/s), and that 34.9% of the CPU
    was used during that test. The number of Random Seeks is 53.1 and 11.6% of CPU
    time was used. This is a significant'
