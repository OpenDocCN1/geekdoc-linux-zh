  md: '# LAB 10.1 RUNNING AN X SERVER


    # Objectives


    Gnome and KDE are Linux graphical desktop environments that have rich features
    as those found in the Macintosh OS and Windows. These environments are complex
    as there are layers of software and configuration for each layer. In order to
    really understand this complexity, in this lab you run only one of these layers—the
    X server. You see what functionality an X server provides and how you interact
    with the X server to run application programs.


    In case you think that this is not a practical exercise, running an X server without
    the other layers of a graphical desktop environment can be used to reduce system
    resource requirements, lock down a desktop so that users can only run authorized
    applications, and help users from altering their desktop functionality and appearance.


    After completing this lab you will be able to:


    +   * Start and stop an X Server

    * Run X application programs from a command line

    * Specify command-line options to set the window properties


    # Materials Required


    This lab requires the following:


    +   * Access as a root user to a computer running Red Hat Linux 7.3 on a PC. These
    labs should work on any Intel-based PC, running any Linux distribution as long
    as it uses the XFree86 X server.


    Estimated completion time: 40 minutes


    # ACTIVITY


    +   1. This lab exercise is best conducted with your computer configured for run-level
    3. Using a text editor, modify the /etc/init/initabb file so the initdefault line
    is set to 3. Here''s what the line should look like:

    id:3:initdefault:

    2. Save the file to disk and exit the editor.

    3. Reboot your computer. When the computer reboots, you eventually see a text-mode
    login prompt. Log in as root.

    4. You''re going to start the X server. The X server program is located in the
    /usr/X11R/bin directory. If there is a file called XFree86, but there''s also
    a symbolic link to it called X. The screen should turn blank, and in a few seconds,
    the screen should have a shaded background and a blinking cursor displayed.'
