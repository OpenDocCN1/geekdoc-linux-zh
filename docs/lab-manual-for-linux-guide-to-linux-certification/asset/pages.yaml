  md: '4. Using your favorite text editor, edit the /etc/ntp.conf file. Add three
    server lines to the file that contain the names or IP addresses of the time servers
    selected in Step 3. Here''s an example of these three lines:


    ```

    server montpelier.caltech.edu

    server bigben.cac.washington.edu

    server tick.u.edu

    ```


    You can specify the IP addresses instead of their names.\

    This saves a DNS lookup each time your time server needs to contact the remote
    time servers. However, if the IP address of a remote time server changes, your
    server will not be able to contact it.


    5. Save the file and exit the editor.


    6. The ntp daemon does not work properly if your computer''s time is off by more
    than 1000 seconds (about 17 minutes). Check to see that your computer''s time
    is within this limit. Enter date to display the current date and time. If the
    time is not within the 1000-second limit, you can change your system time with
    the date program. Set your computer''s time to 12 noon, date -s 12:00.


    7. Start the ntp daemon by entering /etc/rc.d/init.d/ntpd start You should see
    the following line:


    Starting ntpd:


    8. When the ntp daemon starts, it writes messages to the /var/log/messages file.
    Enter tail -f /var/log/messages. You see lines similar to this:


    ```

    Nov 19 23:59:33 ntpd[2071]: ntpd 4.1.0 Wed Sep 5 06:54:30 EDT 2003

    Nov 19 23:59:33 ntpd: ntpd startup succeeded

    Nov 19 23:59:33 ntpd[2071]: precision = 9 use

    Nov 19 23:59:33 ntpd[2071]: kernel time discipline status 0040

    Nov 19 23:59:33 ntpd[2071]: frequency initialized -24.206 from

    etc/ntp/drift

    ```


    9. It takes several minutes before ntpd synchronizes to the remote time servers
    you have specified. You can tell when synchronization occurs with the ntptrace
    program. Before synchronization occurs, you see lines similar to this:


    ```

    red stratum 16, offset 0.000083, synch distance 0.00003

    0.0.0.0.

    *Not Synchronized*

    ```


    After synchronization occurs, you see lines similar to this:


    ```

    red stratum 3, offset 0.000083, synch distance 0.11951

    igor.alpcpress.com: stratum 2, offset 0.000869, synch distance 0.053373

    usno.pax.dec.com: stratum 1, offset 0.001123, synch distance 0.01474,

    refid "USNO"

    ```'
  merge: -1
