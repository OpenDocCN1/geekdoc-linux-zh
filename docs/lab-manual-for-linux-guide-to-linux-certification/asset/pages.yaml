  md: '# Lab 7.2 Understanding Why SCSI Software RAID Is Best


    Estimated completion time: 30 minutes


    # ACTIVITY


    +   1. Launch a Web browser and enter this into the browser''s URL line:

    `http://www.tldp.org`

    2. You''re looking at The Linux Documentation Project Web Site. Select the HOWTOs
    link.

    3. Scroll down until you see the alphabetical index link. Click the link.

    4. Scroll down until you see the Software-RAID-HOWTO link. Click the link.

    5. You''re looking at the Table of Contents. Click the Hardware issues link.

    6. Read Section 3.1 IDE Configuration. It tells you that it is important that
    you use only one IDE disk per bus. The IDE interface does not perform well if
    more than one device must be accessed simultaneously on the same IDE bus. Most
    computers have two IDE interfaces mounted on the motherboard. This means you can
    build a RAID array using only two drives, unless you plug additional IDE interfaces
    into the PCI bus.

    7. Read Section 3.2 Hot Swap. If you are not familiar with the term “hot swap,”
    it means the ability to change a hard drive with the system running and the power
    applied. The power connectors on hard drives are not designed for hot swapping.
    During the process of inserting or removing the power connector, unusually high
    voltages can cross across the pins. This can damage the hard disk. This is true
    for either IDE or SCSI hard disks.


    > If you need to hot swap failed hard disks, there are products that allow you
    to do this, but they tend to be expensive RAID systems.


    # Certification Objectives


    Objectives for the Linux+ exam:

    This lab does not directly map to a certification objective; however, it gives
    background information that helps you master the objectives and understand why
    SCSI drives are preferred to IDE drives for RAID arrays.'
