    Server 2.7.1 for Linux 2.x (x86) or whatever the latest version is.

    6. You''re downloading a compressed file (tarball). Save this file to your home
    directory.

    7. Switch to the second virtual console (tty2) by pressing Ctrl+Alt+F2, and log
    in as root.

    8. Go to your home directory by entering cd.'
