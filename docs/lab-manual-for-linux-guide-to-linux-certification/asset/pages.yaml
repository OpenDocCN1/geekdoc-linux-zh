  md: '# Lab 7.5 Building RAID-5 Array 103


    11. Make the mount point your current directory by typing cd /mnt/raid5.


    12. Enter ls -l to see that your new file system on your newly created RAID array
    has a lost+found directory. Congratulations! You''ve created a software RAID-5
    drive array.


    If you want to have your RAID-5 drive array automatically mounted when you start
