  md: '# LAB 8.1 USING THE BASH HISTORY FEATURE


    # Objectives


    The goal of this lab is to acquaint you with the BASH command history. The idea
    of the history feature is to reduce the number of keystrokes you need to type
    to get something.


    After completing this lab you will be able to:


    +   Use the BASH command history feature to recall previous commands with the
    Up arrow key, by specifying historic command numbers, by searching for historic
    commands that contain a certain string, and by replacing words in the most recent
    command


    # Materials Required


    This lab requires the following:


    +   Access as an ordinary user to a computer running Linux


    | Estimated completion time: 15 minutes |


    # ACTIVITY


    ![](img/3bd24ceeed5983554c0123729814a2d6_115_0.png)


    +   1. Switch to a command-line terminal (tty2) by pressing Ctrl+Alt+F2, and log
    in to the terminal using any username.

    2. The BASH shell keeps a history of the commands you''ve entered in the past.
    You can access this history in a few ways. The easiest way is to use the Up arrow
    key Press the Up arrow key now. Your most recent command appears. Press the Up
    arrow key again to see the next most recent command.

    3. Next, give BASH some commands to remember. Enter the following lines, pressing
    Enter after each line:


    ```

    cd

    ls -l /etc

    ls -l

    whoami

    who

    ```


    +   4. Next, check to see if these commands were added to the history command.
    Type history and press Enter. The screen will likely scroll, but the commands
    entered in Step 3 will now be visible. You can see that each historic command
    is numbered, like this:


    ```

    779 cd

    780 ls -l /etc

    ```'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# Lab 8.1 Using the BASH History Feature 107


    781 ls -l

    782 whoami

    783 who


    +   5. You can select any of the historic commands by stepping back through history
    with the Up arrow key, but this is more troublesome as the age of the command
    increases (it''s further back in history). An easier way is to either specify
    the number of the historic command or search for it. To execute a command by number,
    you enter an exclamation point (!) followed by the number of the command. Type
    !780 and press Enter. You see a long list of the /etc directory.


    +   6. Referring to a historic command by number requires that you first list
    the history to get the number. This is inefficient. You can search for the command
    you want instead. Type !etc? and press Enter. Once again, you see the long listing
    of the /etc directory, BASH searched for the most recent command that contained
    the string "etc" and executed it.


    +   7. Type ! and press Enter. You see the second to last historic command is
    -1 /etc, not !etc?. BASH saves only historic commands, not searches for commands.


    +   8. Type !wombat99 and press Enter. Since the string "wombat99" is not likely
    to be in your command history, BASH can''t find it. It will produce the error
    message:


    ```

    bash: !wombat99?: event not found

    ```


    +   9. If you want to search for commands in which the string you are searching
    for is at the start of the command line, you can eliminate the question mark around
    the string. Type !who and press Enter. The whoami is found and executed.


    +   10. Suppose you wanted the whoami command to run instead. You''d have to enter
    just one more keystroke because the whoami is a more recent historic command than
    the whoami command. Type !who and press Enter. The whoami command runs.


    +   11. The BASH feature also allows substitution of strings in the most recent
    historic command. Experiment with this by entering cat /bin/bash | strings | grep
    shell | less and pressing Enter. This lists all the strings in /bin/bash file
    that contain the word "shell". Since there are likely to be a lot of them, the
    output is piped through the less filter. Press the q key to exit.


    +   12. If you now want to display the strings that contain the word "alias,"
    you don''t have to type another lengthy command. Type ^alias and press Enter.
    This replaces the word "shell" with the word "alias" in the most recent historic
    command and executes the alias command.


    Many of the examples in this lab are simple and short. Clearly, the BASH feature
    is more useful as the length of the commands increase.'
