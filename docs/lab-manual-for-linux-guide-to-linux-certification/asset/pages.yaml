    8. Enter several commands like the one in Step 6 with different names and numbers.
    Do not enter the names in alphabetical order. Now **cat list** and press **Enter**.
    You see that the file is alphabetized even though you did not enter the names
    in alphabetical order. The file was sorted each time BASH displayed the PS1 prompt.


    9. It''s unlikely you''ll want BASH to alphabetize files all the time, so you
