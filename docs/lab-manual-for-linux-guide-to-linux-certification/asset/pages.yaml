    /dev/fd0 /mnt/floppy ext2 defaults 0 0\n\n![](img/3bd24ceeed5983554c0123729814a2d6_83_1.png)\n\
    \n6. Since you have just formatted the floppy disk, press ls -l /mnt/floppy and\
