  md: '# 44 Chapter 4 Exploring Linux Filesystems


    # Materials Required


    This lab requires the following:


    +   - Access as an ordinary user to a computer running Linux


    Estimated completion time: 30 minutes


    # Activity Background


    It''s necessary to search through binary files to locate text strings. The text
    string might tell you the version number of a program or data file. It may be
    easier to view the binary file directly rather than using the program with which
    you''d normally access the file. Whenever you need to view binary data, the tools
    that you use sometimes convert the binary data into a form that is convenient
    to use, but sometimes not. The od program is such a tool. Normally, od assumes
    that the binary data you want to view is a program rather than just binary data.
    The problem with this assumption is that it may swap bytes around so the first
    byte of the file appears after the second byte, the fourth before the third, etc.


    This is a reasonable thing to do if you''re a programmer looking at a dump of
    a program running on a computer that stores a program''s bytes in memory this
    way. It''s the wrong thing to do if you just want to look at simple binary data.
    This lab exercise uses examples that display bytes in the same order as they appear
    in the file. Chances are good that this is the way you prefer to see it.


    ![](img/3bd24ceeed5983554c0123729814a2d6_53_0.png)


    # ACTIVITY


    +   1. Switch to a command-line terminal (tty2) by pressing Ctrl+Alt+F2, and log
    in to the terminal using any username.

    2. Go to your home directory. You can do this from anywhere by typing cd ~.

    3. You''ll need a small file containing binary data. You can create one by borrowing
    data from a program file Enter dd count=1 bs=65 if=/bin/sh of=bindata This creates
    a file called bindata in your home directory. The file contains the first 65 bytes
    of data from the file /bin/sh, which is usually the Bash shell on most Linux systems.
    Check out the man page for the dd command (man dd) if you want to see exactly
    how the dd command works.

    4. The default for od program is supposed to display data in decimal format, according
    to the man page. However, it seems that the od program included with Red Hat Linux
    7.2 doesn''t do that. Enter od bindata. You may see-similar to this:


    ```

    000000 042577 043114 000401 000001 000000 000000 000000 000000

    000020 000002 000003 000001 000000 111600 000405 000064 000064

    000040 165467 000007 000000 000006 000064 000040 000006 000050

    000060 000031 000030 000006 000000 000064 000000 100064 000004

    000100 000064

    000101

    ```'
