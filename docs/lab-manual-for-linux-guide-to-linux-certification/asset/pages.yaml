- img_proc: true
  md: '7. Following the instructions in the tomsrtbt.FAQ file, type install at a DOS
    prompt and follow the on-screen instructions to install the program.


    8. Insert the floppy disk you want to use for the root/boot disk into the computer
    on which you will install Linux, and boot up the computer. At the boot prompt,
    press Enter. The Linux operating system loads and you will see a login prompt.


    9. Log in as root. The on-screen instructions tell you that a password is needed
    and what the password is. (Yes, this seems silly to require a password but to
    show you it is on the screen.)


    10. You''re now logged in to a real Linux operating system running on your computer.
    The entire operating system and all the programs you''re about to run are now
    in memory—not on your computer''s hard disk.


    11. Type cd /proc and press Enter.


    12. Type ls and press Enter. You''ll see many file and directory names (some of
    them numeric). Some of these files de-scribe your computer''s hardware.


    ![](img/3bd24ceeed5983554c0123729814a2d6_24_0.png)


