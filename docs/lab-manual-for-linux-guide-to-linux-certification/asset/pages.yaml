  md: 'Read Section 1. This tells you that HOWTO document is limited to installing
    RAID on Red Hat Linux 7.2 systems. RAID can be used with any Linux distribution.
    This document just tells you about installing RAID on Red Hat Linux 7.2.


    It''s typical for authors and vendors to focus on Red Hat Linux even though there
    are many other Linux distributions available. In most cases, instructions for
    Red Hat Linux are similar or identical to those for other distributions.


    Take a look through the remaining sections of this HOWTO document to get an idea
    of what it takes to set up hardware-based RAID on a Linux system. This is probably
    quite a bit more complicated than thought it would be, but the result is a RAID
    array that performs well and does not burden the Linux kernel with having to perform
    the RAID function. Once configured, there is little maintenance required.


    Enter this into your Web browser''s URL line:


    ```

    http://www.tldp.org

    ```


    Click the HOWTOs link.


    Scroll down until you locate the first alphabetical index link. Click the link.


    Scroll down until you locate the Software-RAID-HOWTO link. Click the link.


    This HOWTO document discusses software-based RAID, where the RAID functions are
    handled by the Linux kernel, not by hardware RAID. Click the Why RAID link?


    Read the Device and filesystem support section. It tells you Linux software-based
    RAID works with IDE or SCSI drives or a mixture of the two. You can, for example,
    create a RAID array using an IDE drive and a SCSI drive. It''s critical that you
    read and understand the entire second paragraph. It warns about overloading a
    bus with more drives than the bus can handle. It also warns about using both the
    master and slave drives on a single IDE interface in a RAID array. Doing so results
    in significant performance problems.


    Read the RAID Levels section. Note that Linear mode and RAID-0 are not fault tolerant.
    You would not use these RAID levels if you want the drive to survive a drive failure.
    Since they are not fault tolerant, the practical application for them is to create
    a file system that spans drives.


    # Certification Objectives


    Objectives for the Linux+ exam:


    This lab does not directly map to a certification objective; however, it gives
    background information that helps you master the objectives and understand how
    hardware-based and software-based RAID work with the Linux operating system.'
