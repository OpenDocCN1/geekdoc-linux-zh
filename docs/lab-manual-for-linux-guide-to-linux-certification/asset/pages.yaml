  md: '# LAB 15.2 CREATING IP ALIASES


    # ### Objectives


    Lab 15.1 showed you how to use the basic functions of the ifconfig program, such
    as setting the IP address, subnet mask, and broadcast address of an Ethernet interface.
    This lab covers a more advanced use of ifconfig, creating IP aliases (assigning
    more than one IP address to a single physical interface). You also examine the
    ifconfig status display in a little more detail.


    # ### Materials Required


    This lab requires the following:


    +   - Access as a root user to a computer running Linux

    - An Ethernet card installed in your computer

    - Your computer set up as you left it at the end of Lab 15.1


    # ### Activity Background


    Each physical interface in your computer can have more than one IP address assigned
    to it. When you assign another IP address to a physical interface, you are creating
    an IP alias. You can create up to 256 IP aliases for each physical interface in
    your computer. IP aliases are often useful for hosting multiple Web sites on a
    single machine, for example. (Detailed coverage of this feature is beyond the
    scope of this book.)You can also assign IP aliases to the Local Loopback interface
    The Local Loopback (lo) interface is a special logical device (it doesn''t exist
    physically) used to move network packets within a single host. The Loopback interface
    can be useful in testing networking functions without having to have network access
    to another computer. Creating IP aliases for the Local Loopback interface can
    be very useful in advanced networking applications, such as building an Internet
    server.


    | Estimated completion time: 30 minutes |


    # ### ACTIVITY


    ![](img/3bd24ceeed5983554c0123729814a2d6_249_0.png)


    +   1. Switch to the second virtual console (tty2) by pressing Ctrl+Alt+F2, and
    log in the root user.

    2. You''re going to create an IP alias. To do this, you must create an interface
    based on the name of the physical interface. Your first Ethernet interface is
    called eth0 by default, so you create an IP alias called eth0:0. Enter ifconfig
    eth0:0 1.1.1.1'
