  md: '# LAB 3.1 LOCATING THE KERNEL FILE


    # Objectives


    The goal of this lab is to learn how to find the kernel file on your hard disk.


    # Materials Required


    +   * A working Linux system

    * Access to the root account


    Estimated completion time: 15 minutes


    # Activity Background


    The kernel is typically stored on your hard disk in an ordinary directory. There
    are a few reasons why you should know where this file is located. You might want
    to create a boot diskette, as you''ll do in Lab 3.2, or you may need to modify
    your boot loader (I.L.O or Grub) configuration file, and knowing the kernel file''s
    name and location is required for each task.


    ![](img/3bd24ceeed5983554c0123729814a2d6_33_0.png)


    # ACTIVITY


    +   1. If your computer is currently displaying a graphical desktop, such as Gnome
    or KDE, use the Ctrl+Alt+F2 key sequence to go to a command prompt.

    2. Most Linux distributions place the kernel file in the /boot directory. Go to
    the /boot directory by entering the cd /boot command.

    3. Display the files in the directory by entering ls -lS. This tells the program
    to do a long directory listing (-l), to suppress printing the (g) owner, and to
    reverse sort the files by file size (-S). The first file displayed (the largest)
    is most likely the kernel file. In this example from a Red Hat Linux 7.2 system,
    the kernel file is vmlinuz-2.4.7-10.


    ```

    total 2576

    -rw-r--r-- 1 root 802068 Sep 6 2001 vmlinuz-2.4.7-10

    -rw-r--r-- 1 root 435039 Sep 6 2001 System.map-2.4.7-10

    -rw-r--r-- 1 root 330510 Mar 28 15:56 initrd-2.4.7-10.img

    -rw-r--r-- 1 root 231038 Jun 24 2011 message

    -rw-r--r-- 1 root 135998 Sep 6 2001 module-info-2.4.7-10

    -rw-r--r-- 1 root 5824 Jun 24 2001 boot.b

    drwxr-xr-x 2 root 4096 Mar 28 16:12 grub

    -rw-r--r-- 1 root 640 Jun 24 2001 os2_d.b

    -rw-r--r-- 1 root 612 Jun 24 2001 chain.b

    -rw-r--r-- 1 root 405 Mar 28 15:56 kernel.h-2.4.7

    lrwxrwxrwx 1 root 20 Mar 28 15:56 module-info -> vmlinuz-2.4.7-10

    lrwxrwxrwx 1 root 19 Mar 28 15:56 System.map -> System.map-2.4.7-10

    lrwxrwxrwx 1 root 16 Mar 28 15:56 vmlinuz -> vmlinuz-2.4.7-10

    lrwxrwxrwx 1 root 14 Mar 28 15:56 kernel.h -> kernel-2.4.7

    ```'
