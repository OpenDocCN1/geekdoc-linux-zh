  md: 'top program by pressing q. You use the renice program with the -u option to
    specify the user. Enter renice 10 -u john. This sets the scheduling priority on
    all of john''s processes to 10, which causes them to run slower.


    There''s no way to ask top to change the scheduling priority on more than one
    job at a time.


    ![](img/3bd24ceeed5983554c0123729814a2d6_240_0.png)


    +   Enter top. You see that the three primes processes running as john are now
    down to 20% of CPU time, and the primes process running as root is up to 40%.


    +   Suppose that you want the primes process running as root to have very little
    CPU time. You want to allow other processes run by any user to have much higher
    priority. You can set its scheduling priority to 19 (the lowest possible). At
    the "PID to renice" prompt, enter the PID of the primes process running as root.
    At the "Renice PID x to value" prompt, enter 19. Wait a few seconds for the top
    to display. Notice that the process is now running at ~4% CPU time and the three
    primes processes running as john are all running at 31% CPU time.


    +   Enter the top by pressing q. Enter renice 0 -u john. You''ve changed the scheduling
    priority on all of john''s processes back to 0, the nominal value. Enter top.
    Notice that all the processes running as john are now running at 32% and the primes
    process running as root is down to 2%.


    +   Stop all of john''s primes processes. Press k. At the "PID to kill:" prompt,
    enter the PID of one of john''s primes processes. Press Enter at the "Kill PID
    x with signal [15]" prompt. Notice that the remaining two primes processes running
    as john are up to about 48% CPU time, and the primes process running as root is
    down to about 3.


    +   Press k. At the "PID to kill:" prompt, enter the PID of one of john''s primes
    processes. Press Enter at the "Kill PID x with signal [15]" prompt. Notice that
    the remaining primes process running as john is up to about 94% CPU time and the
    primes process running as root is up to about 6%.


    +   Press k. At the "PID to kill:" prompt, enter the PID of the remaining primes
    process running as john. Press Enter at the "Kill PID x with signal [15]" prompt.
    Notice that the primes process running as root shoots up to about 99% CPU time.
    By setting the scheduling priority for a process to 19, you ensure that it runs
    fast when no other processes are running, but it allows any other processes to
    steal its CPU time for more important jobs.'
