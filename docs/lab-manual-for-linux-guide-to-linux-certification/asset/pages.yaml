  md: '# LAB 11.2 Customizing PS Output


    # Objectives


    The goal of this lab is to show you how you use ps commands to produce customized
    process display formats. The standard display formats are designed for general
    use. More information is presented than needed in most cases. You can use command-line
    options to display any information you like.


    # Materials Required


    This lab requires the following:


    +   - Access as an ordinary user to a computer running Linux


    Estimated completion time: 30 minutes


    # ACTIVITY


    ![](img/3bd24ceeed5983554c0123729814a2d6_174_0.png)


    +   1. Switch to a command-line terminal (tty2) by pressing Ctrl+Alt+F2, and log
    in to the terminal using any username.

    2. Type ps -e|more and press Enter. The -e option tells ps to display all processes.
    Notice that there are four columns: PID, TTY, TIME, and CMD. Here''s what the
    first few lines of output look like:


    ```

    PID TTY      TIME CMD

    1 ?         00:00:04 init

    2 ?         00:00:02 kentevd

    3 ?         00:00:00 kapm-idled

    4 ?         00:00:00 ksoftirqd_CPU

    5 ?         00:00:02 kswapd

    6 ?         00:00:00 kreclaim

    7 ?         00:00:00 bdflush

    8 ?         00:00:00 updated

    9 ?         00:00:00 mdrecovery_d

    ```


    +   3. If the page is full and you see a --More-- prompt at the bottom of the
    screen, press q to get back to the command prompt.

    4. Type ps ax|more and press Enter. The x option tells ps to display all processes
    that were launched by a terminal (TTYs). The x option tells ps to display all
    processes that were not launched by a terminal. This is the logical equivalent
    of the -e option. Notice that there are five columns: PID, TTY, STAT, TIME, and
    COMMAND. There are also subtle differences in how data in the columns is displayed.
    Here''s what the first few lines of output look like:


    ```

    PID TTY      STAT    TIME COMMAND

    1 ?         S       0:04 init [3]

    2 ?         SW      0:02 [kentevd]

    ```'
