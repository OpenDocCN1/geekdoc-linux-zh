    process, enter X & The X server screen appears.


    15. Go to virtual console 1 by pressing Ctrl+Alt+F1. Press Enter once. You should
    see a command prompt. This tells you that the X server is running in the background.
    To confirm that it is running, type ps ax | grep X and press Enter. You should
    see something similar to this:


    ```

    2333 ?  S  0:02 X

    ```


    16. You can further confirm that the X server is running by pressing Alt+F7 to
    go to the X server.


    17. It''s time to see how to run graphical programs when you only have an X server
    running. Recall from Steps 6, 7, and 8 that using the mouse buttons did not bring
    up a menu or any other way of choosing. When you only have an X server running,
    you must launch programs from a virtual console. Press Ctrl+Alt+F1 to go to the
    first virtual console.


    18. Run the graphical program by entering xclock -display :0 &. Something similar
    to [2] 2408 appears on the screen and the command prompt appears.


    ![](img/3bd24ceeed5983554c0123729814a2d6_153_0.png)


    You must specify the -display option because the DISPLAY environment variable
    does not exist (yet). The DISPLAY variable determines which X server and on which
    computer the program''s window should appear. The DISPLAY variable will be covered
    in more detail in following lab exercises.


    19. Switch to the X server screen by pressing Alt+F7. You see the clock displayed
    in the upper-left corner of the screen. Note that there''s no title bar. Nothing
    happens if you position the mouse cursor over the clock and click the left or
    right mouse buttons. You have no control of it. The control is back at the virtual
    console.


    20. Suppose you want the clock to appear somewhere else on the X server screen.
    How do you do this? Use the -geometry command-line option. Go back to virtual
    console 1 by pressing Ctrl+Alt+F1. Start another copy of the xclock program with
    the -geometry option to set its size and position. Enter xclock -display :0 -geometry
    96x96-0-0 & This shows that the clock will be 96 pixels wide by 96 pixels high
    and should be in the lower-right corner (-0) of the screen.


    21. Go to the X server screen by pressing Ctrl+Alt+F7. You see the X server screen
    with the clock in the lower-right corner.


    22. Go back to virtual console 1 by pressing Alt+F1. To stop both of the xclock
    processes with one command, enter killall xclock. Go back to the X server screen
    by pressing Alt+F7 and notice that the clocks are gone.'
