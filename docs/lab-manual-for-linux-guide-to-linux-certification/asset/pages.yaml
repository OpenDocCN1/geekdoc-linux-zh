  md: '12. When you run bonnie with no command-line parameters, as you did in

    previous step, it uses a 100 MB file for its testing. This is bad if your computer

    128 MB of memory, because the test does not fest true disk speed if

    your computer caches some or all of the 100 MB file. The size of the test file

    should be several times larger than the amount of memory in your computer.

    If you have the space, run the test again, but this time use a larger file to

    reduce the effects of the disk cache. For example, use a 400 MB file by entering

    ./bonnie -s 400. You should see results similar to:


