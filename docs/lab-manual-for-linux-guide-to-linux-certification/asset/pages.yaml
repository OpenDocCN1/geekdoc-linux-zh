  md: '# # LAB 1.1 BECOME FAMILIAR WITH SQUID PROXY SERVER


    # ## Objectives


    The goal of this lab is to become familiar with a useful software package that
    runs on Linux. The Squid proxy server is a great example of a high-quality software
    package that is free, well-supported, and runs on many different hardware and
    software platforms.


    # ## Materials Required


    This lab requires the following:


    +   - An Internet connection and a Web browser


    # ## Activity Background


    There are hundreds of software packages available for Linux. The Squid proxy server
    is a particularly useful one because it allows you to dramatically reduce the
    internet bandwidth for Web browsing and improve performance of FTP file transfers
    as well. Squid serves as a good example of the support available for opensource
    software.


    Estimated completion time: 30 minutes


    # ## ACTIVITY


    ![](img/3bd24ceeed5983554c0123729814a2d6_11_0.png)


    +   1. Start your Web browser.

    2. Type http://www.squid-cache.org in the Address bar of the browser, and press
    Enter. The Squid Web Proxy Cache Web page appears.

    3. Check the FAQ link on the left side of the screen. Spend some time reviewing
    the wealth of information available here. It''s not important if you don''t yet
    understand what you''re reading. Understanding will come in time and when you
    need to use Squid in your network.

    4. Click the Back button to go back to the home page, and then click the Users
    link on the left side of the screen. The next screen you see contains a Table
    of Contents that leads to massive amounts of information about Squid. Note that
    all of this documentation was written by volunteers who are Squid users.

    5. Click the Choosing an Operating System link and read the new page that is displayed.
    You''ll likely see one or more places where the author intended to include information
    but has not yet gotten to it. In the world of opens software, volunteer sometimes
    means that information may be missing or incomplete. Fortunately, missing information
    does not usually prevent you from installing and using the software. Most often,
    the information you really need is there for you. Miscellaneous additional information
    sometimes comes later.'
  merge: -1
  pgno: 11
