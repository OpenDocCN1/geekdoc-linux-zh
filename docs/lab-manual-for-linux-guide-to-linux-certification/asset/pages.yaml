    ![](img/3bd24ceeed5983554c0123729814a2d6_157_0.png)


    +   1. Move the mouse cursor over one of the xterm windows so the window has the
    focus.

    2. Run the Sawfish window manager by entering sawfish & After a few seconds, the
    xterm windows should change their appearance. Now they have title bars, a border,
    minimize and maximize buttons, and an X button in the upper-right corner so you
    can terminate the window.

    3. Move the mouse cursor into the title bar. Click the left mouse button and hold
    it down while moving the mouse. This moves the window. Release the mouse button.

    4. Slowly move the cursor to the border that surrounds the window until the mouse
    cursor changes into an arrowhead that points to a short line. Click the mouse
    button and hold it down while moving the mouse. This changes the size of the window.
    If you move the mouse to one of the corners, you can change the size of the window
    in both directions at once.

    5. Click the maximize button. This is the button in the upper right of the window
    to the left of the X button. The window grows to fill the screen. Click the maximize
    button again. The window reverts back to its original size and location.


    > If you click the minimize button (the one to the left of the maximize button),
