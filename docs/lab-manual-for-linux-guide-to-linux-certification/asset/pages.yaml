    # LAB 6.4 ADJUSTING THE MOUNT COUNT


    # Objectives


    The goal of this lab is to learn how to use the tune2fs and dumpe2fs programs
    to adjust the mount count on ext2 or ext3 file systems. This may be important
    because the mount count determines when Linux automatically checks the integrity
    of the file system. The default value of the mount count may cause your system
    to check its file system far too infrequently.


