  md: '# LAB 12.1 CONFIGURING VIRTUAL CONSOLES


    ### Objectives


    The goal of this lab is to become familiar with running a Linux computer via its
    command-line interface and not using graphical desktops such as Gnome or KDE.
    Using a command-line interface is desirable when the computer functions as a server.
    In this exercise you learn how to:


    +   - Start the computer in run level 3 (instead of run level 5)

    - Increase the number of virtual consoles

    - Move between virtual consoles

    - Change the size of the virtual consoles (number of lines and number of characters
    per line)


    ### Materials Required

    This lab requires the following:


    +   - Access as a root user to a computer running Linux


    Estimated completion time: 30 minutes


    ![](img/3bd24ceeed5983554c0123729814a2d6_191_0.png)


    # ACTIVITY


    +   1. Switch to a command-line terminal (tty2) by pressing Ctrl+Alt+F2, and log
    in to the terminal as root.

    2. Configure the computer so it starts up in run level 3 instead of run level
    5.

    Type vi /etc/inittab and press Enter You should be looking at the contents of
    the file: Use the down arrow key to move the cursor down to the line with the
    id:5:initdefault: statement. Press i. Notice that the bottom line changes to INSERT,
    telling you that you''re in insert mode.

    3. Delete the 5 in the id:5:initdefault: statement and replace it with a 3. The
    line should now read id:3:initdefault:. Press the Escape key. Notice that INSERT
    is removed from the bottom line. You''re back in command mode. Type :wq and press
    Enter to save the file and exit the editor.

    4. Log out and restart the computer.'
