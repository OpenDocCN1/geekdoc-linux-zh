  md: '# Lab 12.3 Using Named Pipes with Logging


    3. Create the files that you''re going to log SMTP and POP3 messages to. Type
    touch /var/log/smtp and press Enter. Type touch /var/log/pop3 and press Enter.
    Is -l /var/log and press Enter. Notice that the two files have been created and
    are of zero length.


    4. Now you need to create a named pipe that you can use for your own program to
    filter the output of syslog. type mkfifo /var/log/mailpipe p and press Enter.
    Type Is -l /var/log/mail* and press Enter. You should see the mailpipe entry in
    file of lists. Note that the first character in the line is a p. which stands
    for pipe.


    5. Add this line to the syslog.conf file syslog knows to output to the named pipe:mail.*
    | /var/log/mailpipe. You can use your text editor program to do this or type echo
    "mail.*" /var/log/mailpipe >> /etc/syslog.conf and press Enter does not automatically
    detect this change. You must tell it its configuration file has changed by typing
    killall -HUP syslog and pressing Enter.


    ![](img/3bd24ceeed5983554c0123729814a2d6_200_0.png)


    > Note that when you specify a named pipe in the syslog.conf file, you must precede
    the log file path and name with a vertical bar ().


    6. Syslog now logs messages of mail to the named pipe. However, nothing is listening
    to the pipe.You need to build a program to accept messages from the pipe, decide
    whether they''re from the SMTP or POP3 daemons, and send the messages to the appropriate
    file. Enter the following shell script into a file called mailscript and place
    it in the /usr/local/bin directory. The next few steps show how to do this with
    the vi editor.


    ```

    while [ true ];

    read </var/log/mailpipe

    if echo $REPLY | grep "pop3" > /dev/null

    then

    echo $REPLY > /var/log/pop3

    else

    echo $REPLY > /var/log/smtp

    fi

    done

    ```


    ![](img/3bd24ceeed5983554c0123729814a2d6_200_1.png)


    > Note This program is simple and may need some refinement if you want to use
    it on a real server. You can write your program in any language, such as Perl
    or C.


    7. Type vi /usr/local/bin/mailscript and press Enter. Press i. Now enter the program
    shown in Step 6. When you''re finished, press the Esc key Type :wq and press Enter.'
