  md: '# # Lab Manual for Linux+ Guide to Linux+ Certification


    The Lab Manual for Linux+ Guide to Linux+ Certification provides students with
    the hands-on instruction they''ll need for Linux administrators. The text can
    also be used to prepare for CompTIA''s Linux+ Certification Exam. Utilizing Red
    Hat Linux 7.2 or higher, users gain real-world practice installing, managing,
    and administering the Linux operating system. Key topics include detailed installation
    instructions, filesystem management and administration, working with the BASH
    shell, Linux networking, and troubleshooting tips. Whether the reader is preparing
    for the CompTIA exam or looking for additional practice using Linux, the Lab Manual
    for Linux+ Guide to Linux+ Certification will provide the information needed to
    succeed!


    ![](img/3bd24ceeed5983554c0123729814a2d6_267_0.png)


    Linux+ Guide to Linux+ Certification

    ISBN: 0-619-13004-0

    By Jason W. Eckert and M. John Schitka


    # ## Key Features of Lab Manual for Linux+ Guide to Linux+ Certification:


    +   - More than 70 hands-on labs map to CompTIA''s Linux+ exam objectives

    - Each lab offers specific exam objectives covered, materials required, estimated
    completion time, and clear, step-by-step instructions

    - Review questions in each exercise reinforce your mastery of each chapter''s
    topics


    ![](img/3bd24ceeed5983554c0123729814a2d6_267_1.png)


    Guide to Linux+ Installation and Administration, Second Edition

    ISBN: 0-619-13095-4

    By Nicholas Wells


    # ## About the Author


    Ed Sawicki is President of the Accelerated Learning Center where he conducts training
    classes and consults on Linux-related subjects. He has 29 years of experience
    in the computer industry and holds the Linux+ and LPIC certifications.


    ![](img/3bd24ceeed5983554c0123729814a2d6_267_2.png)


    Guide to UNIX+ Using Linux+, Second Edition

    ISBN: 0-619-12147-5

    By Michael Palmer, Jack Dent, and Tony Gaddis


