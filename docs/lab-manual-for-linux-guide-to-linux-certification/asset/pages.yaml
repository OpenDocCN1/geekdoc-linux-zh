    13. If you change a file''s permissions, does the date and time change? If so,
    which of the three times are changed? Type chmod 700 file and press Enter. Type
    dir and press Enter. You see that only the ctime changes:


    ```

    -rwx------ 1 root root 0 Oct 23 09:04 file

    -rwx------ 1 root root 0 Oct 23 08:50 file

    -rwx------ 1 root root 0 Oct 23 08:50 file

    ```


    14. If you change the file''s owners? Type chown nobody file and press Enter.
    inner dir. Again, only the ctime changes:


    ```

    -rwx------ 1 nobody root 0 Oct 23 09:06 file

    -rwx------ 1 nobody root 0 Oct 23 08:50 file

    -rwx------ 1 nobody root 0 Oct 23 08:50 file

    ```


    15. If you change the file''s attributes? Type 채팅 +d file and press Enter. Enter
    dir. As expected, only the atime changes:


    ```

    -rwx------ 1 nobody root 0 Oct 23 09:08 file

    -rwx------ 1 nobody root 0 Oct 23 08:50 file

    -rwx------ 1 nobody root 0 Oct 23 08:50 file

    ```


    16. There is an attribute that does affect time and date. It''s the A attribute,
    which affects the file''s atime. When the attribute is set, the file''s atime
    is not updated even though the file is accessed. Set the attribute by typing 채팅
    +A file and press Enter. Enter dir and press Enter You see that atime has not
    changed:


    ```

    -rwx------ 1 nobody root 0 Oct 23 09:08 file

    -rwx------ 1 nobody root 0 Oct 23 08:50 file

    -rwx------ 1 nobody root 0 Oct 23 08:50 file

    ```


    The practical application for the A attribute is where files are accessed frequently
    and you don''t care about the atime being updated. This saves a little of processing
    time and disk I/O.


