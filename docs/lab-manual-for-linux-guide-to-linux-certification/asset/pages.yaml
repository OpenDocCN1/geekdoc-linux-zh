  md: '# Chapter 11 Managing Linux Processes


    When you need to access an Internet site the URL begins with ftp://, you may use
    your Web browser or any FTP client software.


    2. Switch to a command-line terminal (tty2) by pressing Ctrl+Alt+F2, and log in
    to the terminal using your username.


    3. Make sure that your home directory is your current working directory. If it''s
    not, type cd and press Enter.


    4. Type less primes.cr.c and press Enter You''re looking at the source code for
    a C program. You don''t need to understand the C language to complete this exercise.
    Press q to go back to the command prompt.


    You should be cautious about any programs you download from the Internet. If you
    do not understand programming and the C language, review the code to see if there''s
    any problem putting on your system.


    5. Type gcc -O primes.cr.c -lgmp -o primes and press Enter This runs the gcc compiler,
    tells it to compile the primes.cr.c into an executable program, uses the GNU precision
    math library, and places the compiled program in a file called primes.


    The GNU precision math library is in a file called libmp.so. The so file stands
    for shared object. You can find this file in the /usr/lib directory for Red Hat
    Linux 7.2. Other distributions may place the file in /lib.


    6. The program is ready to run. Type ./primes and press Enter.


    7. The program prompts you with Enter startup to start with generating random
    numbers. Type 1 (the numerical 11) and press Enter. The program continuously generates
    random numbers and displays them on the screen. This is useful in the next exercise.


    8. You can stop the program by pressing Ctrl+C.


    9. The primes program deals with large numbers and takes more time to generate
    random numbers as the size of the number increases. You may find this useful in
    the next lab exercise or later in your Linux career. Type ./primes and press Enter.
    When prompted for a starting number, enter 100000000000000 (one followed by 13
    zeros) and press Enter. You see that it takes much longer to generate random numbers
    like this. Type Ctrl+C to quit the program.


