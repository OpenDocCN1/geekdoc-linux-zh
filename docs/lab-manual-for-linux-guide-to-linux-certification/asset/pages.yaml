  md: '# LAB 6.1 MOUNTING AND EJECTING CD-ROMs


    # Objectives


    The goal of this lab is to become familiar with the various ways of mounting and
    ejecting CD-ROMs. You''ll see that you are unable to unmount a CD-ROM if the mount
    point is not in any user''s current directory.


    # Materials Required


    This lab requires the following:


    +   Access as an ordinary user to a computer running Linux. The computer must
    have a CD-ROM drive installed


    Estimated completion time: 30 minutes


    ![](img/3bd24ceeed5983554c0123729814a2d6_79_0.png)


    # ACTIVITY


    +   1. Switch to a command-line terminal (tty2) by pressing Ctrl+Alt+F2 and log
    in to the terminal using your username

    2. See if the CD-ROM drive is currently mounted by entering mount. If a line similar
    to this appears in the output, your CD-ROM drive is mounted:

    `/dev/cdrom /mnt/cdrom type iso9660 (ro,default)`

    3. If your CD-ROM is currently mounted, unmount it. If it is, you''ll see a "device
    is busy" error message when you try to unmount the CD-ROM. You can''t unmount
    any disk that is part of someone''s current directory. Type `unmount /dev/cdrom`
    and press Enter

    4. Open the CD-ROM tray by pressing the button on the front panel of the CD-ROM
    drive. Insert a data CD-ROM, such as one of the CD-ROMs from your Linux distribution.

    5. You know that you can close the tray by either pushing it or pressing the front
    panel button, but try a different way: Use the `eject` program. Enter `eject -t.


    ![](img/3bd24ceeed5983554c0123729814a2d6_79_1.png)


    > You cannot unmount the CD-ROM if you (or any other user) have the mount point
    directory of the CD-ROM as your current directory.


    ![](img/3bd24ceeed5983554c0123729814a2d6_79_2.png)


    > This step will not work if you are using a network computer with a CD-ROM drive
    that must be closed manually.'
  merge: -1
