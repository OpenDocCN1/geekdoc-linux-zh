  md: '# LAB 13.1 EXPLORING COMPRESSED man PAGES


    # Objectives


    Numerous Linux programs allow you to use compressed or tarred files directly.
    A common example is man pages. The man page program can read pages that are eithercompressed
    or compressed. This lab shows how Linux programs automatically deal with compressed
    files.


    # Materials Required


    This lab requires the following:


    +   Access as the root user to a computer running Linux


    Estimated completion time: 30 minutes


    # Activity


    +   1. Switch to a command-line terminal (tty2) by pressing Ctrl+Alt+F2, and log
    in as root.


    > You do not normally have to be logged in as root to access man pages. However,
    in this lab exercise, you manipulate the man page files, which requires root access.


    +   2. Enter man bash. Notice the delay before the man page displays. The man
    pages are documents written in a format that must be interpreted by a program
    called groff. The man program must uncompress the man page then load and run the
    groff program, which converts the document to text that can be displayed on your
    screen. These processes cause the delay.


    > If your computer is very fast and you don''t notice a delay before the man page
    loads, try running the primes you compiled in Lab 11.3 in another virtual console,
    then try Step 2 again.


    +   3. You can see that the bash man page is compressed by entering where bash.
    The results show you that the bash man page is called bash.1.gz, .gz is the extension
    of a gzip-compressed file:


    ```

    bash: /bin/bash /usr/lib/bash /usr/share/man/man/bash.1.gz

    ```'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# Lab 13.1 Exploring Compressed man Pages


    The man pages are compressed to save disk space. There are thousands of man pages
    and the savings account for tens of megabytes of disk space. Because most man
    pages are accessed infrequently, it’s prudent that man pages are compressed and
    the slight delay in loading them is a small price to pay for the saved storage
    space.


    ![](img/3bd24ceeed5983554c0123729814a2d6_214_0.png)


    +   4. If you can reduce the delay by uncompressing the bash man page so the man
    program does not have to do it each time. Enter


    ```

    gunzip /usr/share/man/man1/bash.1gz

    ```


    +   5. Enter whereis bash. You can see that the man page has been uncompressed:
    /bin/bash /usr/lib/bash /usr/share/man/man1/bash.1


    +   6. If the man page loads faster now Enter man bash. This didn’t have a significant
    effect on the delay. Apparently, uncompressing a man page takes little time. The
    bulk of the delay is having groff format the man page for your screen.


    +   7. Unless compress man pages makes little difference, recompress the bash
    page. Enter gzip /usr/share/man/man1/bash.1.


    +   8. You can configure man so it saves the man page text that is displayed on
    the screen. The next time you want to look at the man page, it’s already in the
    text format and groff does not have to run. The man page loads more quickly. You
    can achieve this by eliminating the NOCACHE statement from the man program’s configuration
    file. Using your favorite text editor, edit the /etc/man.config file. Look for
    the line that starts with NOCACHE, and comment out the line by placing a hash
    mark (#) at the start of the line. When you’re finished, the line should look
    like this:


    ```

    #NOCACHE

    ```


    +   9. Exit the editor


    +   10. Enter man bash. Notice the message “Formatting page, please wait...” before
    the man page appears.


    +   11. Press q to exit the man page. Enter man bash. This time the man page loads
    quickly. The reason it loads quickly is because it’s cached in its on-screen format.


    +   12. The cached man pages are located below the /var/cache/man directory. Because
    the bash man page is in section 1, it’s in the cat1 subdirectory. Make this your
    current directory by entering cd /var/cache/man/cat1. Enter you see a file named
    bash.1.gz. The cached man page is compressed. Because uncompressing is very quick,
    man compresses the on-screen text of the man page to save disk space.'
  merge: -1
  pgno: 214
