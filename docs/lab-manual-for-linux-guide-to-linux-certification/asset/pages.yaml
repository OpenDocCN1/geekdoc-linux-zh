  md: '# LAB 2.2 BOOTING LINUX FROM A CD-ROM


    # Objectives


    Lab 2.1 had you download the Tomsrt program and install it on a floppy disk. This
    may be difficult if your computer runs a version of Windows that doesn''t support
    DOS programs. An alternative approach is to use a version of Linux that boots
    from a CD-ROM. If you''re using a version of Windows that does not support DOS
    programs, such as Windows NT, Windows 2000, and Windows XP, you can burn a CD-ROM
    more easily than you can create a boot disk. In this lab exercise you download
    and install a softare package called Knoppix. Knoppix is a full-featured Linux
    distribution. It includes hundreds of applications including K-Office and Office—two
    popular office suites. Knoppix allows you to boot a full-featured Linux from a
    CD-ROM. It does not require that you use any of your hard disk space You can run
    Knoppix on a computer that has Windows for any other operating system installed
    and all of its disk space already allocated.


    # Materials Required


    +   - A computer with a CD-ROM burner and software installed

    - A Web browser and Internet connection


    | Estimated completion time: 45 minutes |


