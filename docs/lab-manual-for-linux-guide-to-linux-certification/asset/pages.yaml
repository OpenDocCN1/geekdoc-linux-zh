    1:57pm up 1:21, 9 users, load average: 2.07, 2.02, 1.77


    You can have up to 63 virtual consoles (tty1 to tty63). You can select the first
    12 with Alt+Fx, where x is one of the function keys and Alt is the left Alt key.
    You can select the next 12 by using the right Alt key. Beyond 24, you can move
    from one to to the next with Alt+right arrow and Alt+left arrow. From a command
    prompt, you can go to any virtual console by typing tch x, where x is a number
    from 1 to 63


    7/ Virtual consoles are normally 80 columns by 25 lines. You can increase the
    size of virtual consoles so the screen is wider or taller or both. This is useful
    if you have a large monitor. You can do this in two ways. One involves having
    the Linux kernel that when you boot the operating system, you add a vga= line
    to your boot loader configuration file (either lilo.conf or grub.conf). The problem
    with this approach is that some distributions, such as Red Hat Linux, ignore this
    during startup. The kernel sets the video hardware to say, 80 columns by 50 lines,
    but the system script resets it back to 80 columns by 25 lines. You can find where
    this is being reset in your startup scripts and modify the script, but there''s
    a better way. You can download and install a program called SVGETextMode that
    allows you to change the size of your virtual console at any time.


    ![](img/3bd24ceeed5983554c0123729814a2d6_193_0.png)


    SVGETextMode is not on Linux-exam, but the SVGETextMode approach is the best way
    of changing your screen geometry when your Linux distribution overrules your vga=
    statement. It doesn''t require surgery to the system initialization files.


    18. Download the program now. Type cd /tmp and press Enter. Because you''re not
