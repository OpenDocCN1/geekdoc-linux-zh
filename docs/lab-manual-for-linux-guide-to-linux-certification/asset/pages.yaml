  md: '# Chapter 2 Preparing for Linux Installation


    The bogomips number is meant to give you an indication of your processor''s effective
    speed, considering its clock speed, cache size, and other factors. However, it''s
    a grossly inaccurate measure of system performance; hence, the name bogomips (bogus
    MIPS, MIPS stands for millions of instructions per second, a standard of CPU speed).
    It''s best to ignore this number as an indication of your system''s performance.


