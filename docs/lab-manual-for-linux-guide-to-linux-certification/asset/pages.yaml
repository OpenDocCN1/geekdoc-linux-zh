  md: '# LAB 8.2 CUSTOMIZING THE BASH HISTORY FEATURE


    # Objectives


    After completing this lab you''ll be able to:


    +   - Understand when the BASH history file is updated


    +   - Specify the number of historic commands that will be remembered


    +   - Set the HISTSIZE environment variable


    # Materials Required


    This lab requires the following:


    +   - Access as an ordinary user to a computer running Linux


    Estimated completion time: 20 minutes


    # ACTIVITY


    +   1. Switch to a command-line terminal (tty2) by pressing Ctrl+Alt+F2, and log
    in the terminal using an ordinary username (not the root account).


    +   2. Historic commands are remembered even if you log out and log in again.
    This is achieved with the help of a history file stored in your home directory.
    The file is called .bash_history. Ensure you''re in your home directory by entering
    the command cd, and pressing Enter.


    +   3. Look at the last lines in the .bash_history file by typing tail .bash_history
    and pressing Enter. Notice that the last line of the file is not tail .bash_history
    and the previous command is not cd. This means that the .bash_history file is
    not up to date.


    +   4. Type history and press Enter. You see that the last line appears the command
    history. The previous line is tail .bash_history. The history command seems to
    be up to date though the .bash_history file is not. This is because command history
    is kept in system memory. In the next steps, you see when the .bash_history file
    is updated.


    +   5. Type echo ‘This is my command’ and press Enter.


    When you use the echo command, it''s best to use single quotes rather than double
    quotes around the string. Single quotes prevent the shell from trying to interpret
    special characters.'
  merge: -1
  pgno: 118
