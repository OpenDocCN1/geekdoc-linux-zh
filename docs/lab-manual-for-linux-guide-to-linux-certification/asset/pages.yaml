    In this exercise, you will be simultaneously logged in as three users. One is
    the root user and the other two are ordinary users. You will create files as one
    ordinary user and see the effects on the other ordinary user. You will also be
    logged in as the root user because there are things to be done that the ordinary
    users cannot do.


    Estimated completion time: 30 minutes


