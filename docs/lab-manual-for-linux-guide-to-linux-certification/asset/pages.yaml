  md: '# Lab 8.4 Adding Automation to the BASH Prompt


    3. First you create a simple shell script program to sort the list file using
    a simple shell script. You could use a text editor to create the file, but because
    it''s only one line, use the echo command to create the file. Type the following
    and press **Enter:**


    ```

