  md: '# LAB MANUAL FOR

    LINUX+ GUIDE TO LINUX CERTIFICATION

    INTRODUCTION


    Hands-on learning is the best way to master skills necessary for both CompTIA''s
    Linux+ and a Linux-related career. This book contains hands-on exercises that
    apply fundamental Linux concepts as they are applied in the real world. In addition,
    each chapter offers review questions to reinforce your mastery of each chapter''s
    topics. The organization of this book follows the same as Course Technology''s
    Linux+ Guide to Linux Certification and using the two together will provide a
    substantial, effective learning experience. This book is suitable for use in a
    beginning Linux administration course. As a prerequisite, students should have
    a fundamental understanding of general operating system concepts, and at least
    one course in operating systems. This book is best when accompanied by the Course
    Technology textbook Linux+ Guide to Linux Certification, or another Linux+ textbook.


    # FEATURES


    In order to ensure a successful experience for instructors and students alike,
    this book includes the following features:


    +   * **Linux certification objectives**—Each chapter lists the relevant objectives
    from the CompTIA Linux+ Exam

    * **Lab Objectives**—Every lab has a brief description and list of learning objectives

    * **Materials Required**—Every lab includes information on access privileges,
    hardware, software, and other materials you will need to complete the lab

    * **Completion Times**—Every lab has an estimated completion time, so that you
    can plan your activities more accurately

    * **Activity Sections**—Labs are presented in manageable sections; additional
    Activity Background information is provided where appropriate

    * **Step-by-Step Instructions**—Logical and precise step-by-step instructions
    guide you through the hands-on-activities in each lab

    * **Review Questions**—Questions help reinforce concepts presented in the lab


    Note for instructors: Answers to Review Questions are available on the Course
    Technology Web site at www.course.com/irc/. Search on this book''s ISBN, which
    is found on the back cover.'
  merge: -1
  pgno: 8
