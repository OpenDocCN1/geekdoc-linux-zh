  md: '# Chapter 8 Working with the BASH Shell


    6. Type **logout** and press **Enter**. After you''re logged out, you are at a

    prompt.


    7. Log in again as the same ordinary user.


    8. Type **history** and press **Enter**. You see the command echo "**This is my
    command**" near the end of the list.


    9. Type **tail .bash_history** and press **Enter**. You see the command echo "**This
    is my command**" near the end of the list. This means that the\nbash_history file
    was updated when you logged out.


    10. Your history file will be quite large if you''ve used a computer a lot and
    most of it will quickly scroll by the screen. You can use the **more** or **less**
    commands to prevent the scrolling. Type **history | less** and press **Enter**.
    You see the oldest historyc commands on your screen. Press the **spacebar** to
    see more of the file. You can exit at any time by q


    11. You can see exactly how many historic commands are in the file by using the
    **wc** (word count) program and asking to count lines rather than count commands.
    Type **wc -l .bash_history** and press **Enter**. You see something similar to
    this:


    ```

    1000 .bash_history.

    ```


    12. The above output shows that there are 1000 historic commands stored in the
    history file. This is normally the limit set by Red Linux 7.2. The value may be
    different with other Linux distributions. This limit is imposed by an environment
    variable called HISTSIZE. You can see the value of HISTSIZE on your system. Type
    **set HISTSIZE** and press **Enter**. You see this:


    ```

    HISTSIZE=1000

    ```


    13. Suppose you don''t want to be limited to 1000 historic commands. You want
    5000. You have to change the HISTSIZE variable in your startup script. The script
    is called bashrc and is in your home directory. If the HISTSIZE variable was defined
    in this file, use your favorite text editor to change the value. However, with
    Red Linux 7.2, the HISTFILE variable is not set in the bashrc file. Let''s add
    the statement without using a text editor. Type **echo ''HISTSIZE=5000'' >> .bashrc**
    and press **Enter**. This new value will be honored the next time the BASH shell
    rereads the .bashrc file, typically when you log in.


    > If your system does not set the HISTSIZE variable in any of the startup or login
    scripts, BASH typically defaults to 500 commands


    > Red Hat Linux 7.2, the HISTSIZE variable is set in the /etc/profile file. If
    you change it, it will affect every user that logs in to the system.'
