  md: '# Lab 4.5 Working with Unusual File and Directory Names


    Estimated completion time: 45 minutes


    # Activity Background


    If your computing career started with DOS or early versions of Windows, you may
    remember that there were severe restrictions on file and directory names with
    these operating systems. DOS restricted file and directory names to eight characters
    with an option extension that could be up to three characters. Early versions
    of Windows had the same restriction, but Windows 95 changed. Names could be up
    to 256 characters, but there were limitations on the characters that were allowed.


    Later versions of Windows reduced the limitations, but some still remain. Linux
    allows you to create names using any characters you like. You just need to realize
    that some characters may conflict with your system''s shell. Although conflicts
    can result, Linux usually has a way to work around the conflicts.


    ![](img/3bd24ceeed5983554c0123729814a2d6_56_0.png)


    # ACTIVITY


    +   1. Switch to a command-line terminal (tty2) by pressing **Ctrl+Alt+F2**, and
    log in to the terminal using your username.


    +   2. Go to your home directory. You can do this from anywhere by typing `cd
    ~` or `cd`.


    +   3. Change your shell prompt so you can easily see what your current directory
    is at all times. Enter `PS1="%w":` and press the **Enter** key.Your command-line
    prompt now shows the working directory.


    +   4. Chances are good that your current directory is your home directory. If
    so, your command directory is not your home directory, go to your home directory
    by typing `cd ~` or `cd`.


    +   5. The tilde (~) represents your home directory. If you want to see what the
    actual directory, enter `pwd`. If you are logged in as user Betty, your home directory
    most likely is `/home/beth`, though it could be different depending on how the
    administrator set up the system.


    +   6. Create a directory called test, touch, below your home directory by typing
    `mkdir test`. Make this your current directory by typing `cd ~/test`. Your prompt
    is now `~/test/`.


    +   7. Linux has a program, called touch, that allows you to create a file that
    has no contents. You''ll use it to quickly and easily create files. Enter **touch
    abc**. Now enter **ls**. See the abc file.


    +   8. Enter **touch ABC**. Then enter the `ls` command. You will see both the
    abc and ABC files. Linux distinguishes between character case.


    +   9. Use the touch program to create a very long file name. The name must be
    longer than 256 characters. Enter `ls` and see how the long name is displayed.
    Enter `ls -l` and see how the name is displayed.'
