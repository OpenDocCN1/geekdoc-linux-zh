  md: '# Lab 3.1 Locating the Kernel File


    There is also a file called vmlinuz that is an alias (also a symbolic link) for
    the kernel file. You can refer to the kernel as either /boot/vmlinuz-2.4.7-10
    or /boot/vmlinuz.


