  md: '# LAB 14.1 Using the hdparm Program


    # Objectives


    The goal of this lab is to show you how you can use a program called hdparm to
    get detailed technical information about your hard disks and your computer''s
    interface to the hard disks. You can also use it to conduct simple tests of your
    hard disk''s performance.


    # Materials Required


    This lab requires the following:


    +   - Access as a root user to a computer running Linux


    Estimated completion time: 25 minutes


    # ACTIVITY


    ![](img/3bd24ceeed5983554c0123729814a2d6_229_0.png)


    +   1. Switch to a command-line terminal (tty2) by pressing Ctrl+Alt+F2, and log
    in to the terminal as the root user.

    2. Type hdparm and press Enter. You see a usage message and a list of command
    options for the hdparm program. Some of the information may scroll off the top
    of the screen and you''ll likely try something like hdparm|more to stop the screen
    from scrolling. This won''t work because the hdparm program displays its usage
    information to STDERR instead of the STDOUT device. You can solve this problem
    by redirecting STDERR to a file and having the more program read the file. Use
    the command hdparm 2>/tmp/123;more /tmp/123 to do this.


    > Note the word "DANGEROUS" next to a few of the options in the list. You won''t
    be using any of these options in this lab, and you should not practice these options
    on a system that contains critical data.


    ![](img/3bd24ceeed5983554c0123729814a2d6_229_1.png)


    +   3. You can use the hdparm program to check the general settings for your hard
    disk by specifying the device name of your hard disk without command-line options.
    Type hdparm /dev/hda and press Enter. If your hard disk is not /dev/hda, substitute
    the name of your hard disk. You should see something similar to:


    ```

    /dev/hda

    multcount = 16 (on)

    I/O support = 0 (default 16-bit)

    unmaskirq = 0 (off)

    using_data = 1 (on)

    keepsettings = 0 (off)

    nowerr = 0 (off)

    readonly = 0 (off)

    ```'
  merge: -1
  pgno: 229
