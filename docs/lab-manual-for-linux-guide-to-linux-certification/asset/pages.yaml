    Try ''touch -help'' for more information.

    ```


    15. To convince touch to do what you want, enter touch -n followed by ls -l. You
    see this:


    ```

    -rw-r--r-- 1 ed users 0 Jan 24 15:31 -n

    ```


    16. If you want to delete the file with the vi editor, you have a problem if you
    enter vi -n because that -n is an option that tells it not to use a swap file
    and that you didn''t enter a file name. The solution is vi --n, which tells vi
    that no other command-line options follow the -- sequence. How interprets the
    -n as a file name.


    17. If you want to erase the -n file, you also have to use the -- trick. Enter
    rm -- -n followed by y to confirm the deletion. Then enter ls -al to see the file
    has been erased.


    18. If you want to restore your command prompt to what is before you performed
    Step 3, log out and log in again.


