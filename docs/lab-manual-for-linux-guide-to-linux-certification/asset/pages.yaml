- img_proc: true
  md: 'improvement for both tests in two ways. The performance of the operation is
    improved and it takes far less of the CPU''s time, allowing the CPU to do other
    work.


    +   5. Next, enable multiple sector I/O (IDE Block Mode) and use 16 sectors by
    entering hdparam -m16 /dev/hda. Note that you''re still using 32-bit data transfers.
    Run the bonnie program by entering bonnie -s 400. The results show that theSequential
    Output Per Block is 482 KB/s (4.8 MB/s), and 20.8% of the CPU was used during
    that test. The number of Random Seeks is 51.2 and 22% of CPU time was used. This
    reduced the performance of the hard disk a bit, but also reduced the amount of
    work the CPU must perform. The amount of CPU time for Random Seeks was reduced
    substantially while only a minor reduction in performance. If your computer were
    running primarily as a database server with many processes running concurrently,
    this would likely result in substantially improved performance.


    > Interpreting the results of benchmark testing is difficult. Determining how
    the results relate to your system and applications comes with experience, and
    is part and art. The bonnie Web site (www.textuality.com/bonnie) covers these
    considerations to a degree.


    ![](img/3bd24ceeed5983554c0123729814a2d6_237_0.png)


    +   6. Now turn on DMA by entering hdparam -d1 /dev/hda. Note that you''re using
    32-bit data transfers and multiple sector I/O (IDE Block Mode). Run the bonnie
    program again by entering bonnie -s 400. The results show that Sequential Output
    Per Block is 5015 KB/s (5.0 MB/s), and that 7.3% of the CPU was used during that
    test. The number of Random Seeks is 55.2 and 14.4% of CPU time was used. The most
    significant improvement was in the reduction of CPU time for both Sequential Output
    and Random Seeks.


    +   7. And that you''re using DMA, by turning off all hard disk settings performs.
    Turn off multiple sector I/O (IDE Block Mode) by entering hdparam -m 0 /dev/hda.
    Run the bonnie program again by entering bonnie -s 400. The results show that
    Sequential Output Per Block is 4878 KB/s (4.9 MB/s), and that 7.2% of the CPU
    was used during that test. The number of Random Seeks is 57 and 13.3% of CPU time
    was used. There was a slight decrease in CPU time for both tests and a slight
    improvement in Random Seeks but a slight reduction in Sequential Output Per Block
    performance. What would you decide?


    > There are other hdparam parameters you can experiment with, such as the transfer
    mode (-), but the hdparam page says they''re dangerous. Only experiment with these
    parameters on a system where you can live with crashing your hard disk and to
    reinstall Linux.


    ![](img/3bd24ceeed5983554c0123729814a2d6_237_1.png)


    +   8. Restore your original hard disk settings by rebooting your computer. Switch
    to a command-line terminal (tty2) by pressing Ctrl+Alt+F2, and log in to the root
    user. Run the bonnie program with a 400 MB test file by entering bonnie -s 400.
    How do the results compare to those in the earlier steps?'
