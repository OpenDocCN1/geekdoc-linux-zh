  md: '# Chapter 10 The X Window System


    7. On the 10.0.0.2 computer, go to an xterm or virtual console. You need to set
    the DISPLAY environment variable to point to the 10.0.0.1 computer''s X server.

    Type `DISPLAY=10.0.0.1:0; export DISPLAY` and press Enter.


    8. Now that the DISPLAY variable points to the computer running the X server,
    any X program you run on the 10.0.0.1 computer. Type `xboard` and press Enter.
    After a few seconds, the GNU chess program is displayed on the 10.0.0.1 computer.
    Interact with it. Try a few moves. Unless your network is clogged with high levels
    of traffic, it should perform as well as it did in Lab 10.1 when the program was
    running on the same computer as the X server.


    ![](img/3bd24ceeed5983554c0123729814a2d6_161_0.png)


    It''s important that you understand that the board program is running on the 10.0.0.2
    computer, but it''s being displayed on the 10.0.0.1 computer. This arrangement
    requires you to start programs on the 10.0.0.2 computer and the programs displayed
    on the 10.0.0.1 computer.


    9. From the 10.0.0.1 computer establish a SSH link to the 10.0.0.2 computer. SSH
    is a service that allows you to establish a secure remote console. Type `ssh 10.0.0.2`
    and press `Enter` You may see a security-oriented message asking you if you want
    to trust the 10.0.0.2 computer. If you do, answer yes.


    10. You see a password prompt. Enter the password of the root user on the 10.0.0.2
    computer. You should now be at a command prompt. Note that this is the command
    prompt of the 10.0.0.2 computer, you''re looking at it in a window displayed on
    the 10.0.0.1 computer.


    11. Set the DISPLAY environment variable to point to the X server on the 10.0.0.1
    computer. Type `DISPLAY=10.0.0.1:0; export DISPLAY` and press Enter.


    12. You can now run an X application. Type clock appears on the screen of the
    10.0.0.1 computer, the same computer from which you entered the command. You no
    longer need access to the keyboard of the 10.0.0.2 computer to run programs.


    ![](img/3bd24ceeed5983554c0123729814a2d6_161_1.png)


    In this lab, we used IP addresses in the DISPLAY statements. You can also use
    computer (host) names. If the computer running the X server (10.0.0.1 in this
    lab) is given a name, for example "sales," in DNS or in the /etc/hosts file of
    the computers running the X clients, you could use a command as DISPLAY=sales:0.0;
    export DISPLAY.


