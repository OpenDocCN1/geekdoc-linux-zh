  md: '# LAB 13.2 COMPRESSING PROGRAMS WITH gzexe


    # Objectives


    Sometimes it''s useful to make files as small as possible. This may be because
    the files have to reside on a small disk or because they must be transmitted over
    a slow network or modem link. Linux binary program files may be compressed for
    these reasons. In this lab exercise, you learn how to use the gzexe program to
    compress binary programs.


    # Materials Required


    This lab requires the following:


    +   - Access as an ordinary user to a computer running Linux


    Estimated completion time: 20 minutes


    # ACTIVITY


    ![](img/3bd24ceeed5983554c0123729814a2d6_216_0.png)


    +   1. Switch to a command-line terminal (tty2) by pressing Ctrl+Alt+F2, and log
    in to the terminal using your username.

    2. Ensure that you''re in your home directory by entering cd.

    3. Copy the rpm program from the /bin directory into your home directory by entering
    cp /bin/rpm ..

    4. Find the size of the rpm program by entering ls -l rpm. You see that the file
    size is about 1,737,960 bytes.

    5. Compress the program by entering gzexe rpm. This takes a few seconds, and you
    see a line similar to this when it finishes:


    ```

    rpm: 53.4%

    ```


    Linux binary programs tend to compress by about 50%.


    ![](img/3bd24ceeed5983554c0123729814a2d6_216_1.png)


    +   6. The rpm program was compressed by 53.4%. The original was renamed to rpm-
    and the new compressed file is called rpm. Enter ls -l rpm* to see the new compressed
    file and the old uncompressed file. There should be a substantial difference in
    the file sizes, similar to this:

    7. Both files run the same program. Enter ./rpm --version. You see this:


    ```

    -rw-r--xr-x 1 root root 808899 Dec 14 10:23 rpm

    -rw-r--xr-x 1 root root 1737960 Dec 14 10:21 rpm-

    ```


    RPM version 4.0.4'
