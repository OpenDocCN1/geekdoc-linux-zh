    13. Copy some files to your array. Enter cp /etc/* . to copy all files in the
    /etc directory to the array.


    14. Enter ls and notice that you have numerous files in the array.

    You can easily create numerous RAID arrays on your system, as long as you have
    the required number of hard disks. You may, for example, have two hard disks in
    a RAID-0 drive and four hard disks in a RAID-5 array. Both of the arrays would
    need to be defined in the /etc/raidtab file. Here''s an example of the file that
    refers to real SCSI drives:


