  md: '# LAB 4.3 DOING MORE WITH LESS


    # Objectives


    The goal of this lab is to see how programs, such as less, have numerous command-line
    options and interactive commands that allow you to move through text files interactively.


    # Materials Required


    This lab requires the following:


    +   * Access as an ordinary user to a computer running Linux


    # Activity Background


    Most Linux systems have an English word list installed that may be used by system
    utilities or application programs. This word list is a plain text file, called
    words, in the /usr/share/dict directory. The file has one word per line and is
    alphabetized. We''ll use this file for this lab exercise.


    ![](img/3bd24ceeed5983554c0123729814a2d6_51_0.png)


