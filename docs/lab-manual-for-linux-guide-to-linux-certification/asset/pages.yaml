  md: '# Lab 12.1 Configuring Virtual Consoles


    5. When the computer has finished rebooting, you see a text mode login prompt.

    Log in as the root user.


    6. By default, Linux distributions set the number of virtual consoles to six.
    You can easily add more. This lab is going to have a total of nine virtual consoles.
    Type vi /etc/ittab and press Enter. You will see the contents of the /etc/ittab
    file that controls the number of virtual consoles. Using the down arrow key, scroll
    down to this section of the file:


    ```

    # Run gettyys in standard runlevels

    1:2345:respawn:/sbin/mingetty tty1

    2:2345:respawn:/sbin/mingetty tty2

    3:2345:respawn:/sbin/mingetty tty3

    4:2345:respawn:/sbin/mingetty tty4

    5:2345:respawn:/sbin/mingetty tty5

    6:2345:respawn:/sbin/mingetty tty6

    ```


    7. Move the cursor to the line that starts with 6 and press Y. You''ve copied
    that line into a buffer.


    8. Move the cursor down one line and type 3P. Three additional lines appear. All
    are exact copies of the one you copied in Step 7.


    9. You need to change the new numbers at the beginning and end of each line are
    one greater than the previous line. The cursor is already sitting on top of the
    6 for the first line you added in Step 7. Type r7 to change the 6 to a 7. Move
    the cursor down to the next line and type r8. Move to the next line and type r9.


    11. You''re finished making changes to the file. Save the file to disk and exit
    the editor by typing :wq.


    12. You can put this change into effect without having to reboot the operating
    system. Type kill -HUP 1 and press Enter. This causes the init process (always
    process 1) to reread its configuration file (/etc/ittab) and make any needed changes.
    In this case, it makes three more virtual consoles.


    13. Press Alt+F7.You should see a login prompt. Log in as any user.


    14. Press Alt+F8. You should see a login prompt. Log in as any user.


    15. Press Alt+F9. You should see a login prompt. Log in as any user.'
