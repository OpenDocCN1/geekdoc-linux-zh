  md: '# LAB 1.5 INVESTIGATE LINUX SECURITY


    # Objectives


    The goal of this lab is to gain an appreciation for why typical open-source software,
    including Linux, tends to be more secure than other popular operating systems.


    # Materials Required


    This lab requires the following:


    +   - An Internet connection and any Web browser


    Estimated completion time: 30 minutes


    # ACTIVITY


    ![](img/3bd24ceeed5983554c0123729814a2d6_19_0.png)


