    # LAB 10.5 CONFIGURING X PROGRAMS


    # Objectives


    X programs use X libraries. The result is that they tend to understand a common
    set of command-line options. Examples of options are changing the foreground and
    background color of windows as well as setting transparent backgrounds. You can
    launch programs that are automatically minimized, set titles in the title bars,
    and so forth.


    Not all programs implement all of these options, and options may be implemented
    in somewhat different ways. Programs may have options that no other programs have.
    In this lab you try numerous options and see the effects.


