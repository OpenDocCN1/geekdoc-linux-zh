  md: '# ACTIVITY


    +   1. Start your Web browser.


    +   2. Type http://www.netcraft.com/survey/ in the Address bar of the browser,
    and then press Enter. The Netcraft Web Server Survey page appears. This page has
    a graph that shows the market share for the most popular Web servers. Note that
    Apache leads the pack by a significant margin.


    +   3. Spend some time reading the various pages on this Web site to get an idea
    of how the survey information is collected and organized. One factor significantly
    affects the results is a Web server feature called “virtual hosting”. This feature
    allows a single copy of a Web server to host many Internet sites or URLs. An ISP
    running a single Web server with 5000 virtual hosts is seen as 5000 Web servers
    in the Netcraft survey instead of one server.


    +   4. Type http://www.biznix.org/surveys/ in the Address bar of the browser,
    and then press Enter. The next page you see is the result of a Web server survey
    conducted by BizNix—a user group in Portland, Oregon. This survey limits itself
    to well-defined categories of Web server users, such as big companies, government
    agencies, and military departments. It minimizes the effects of virtual hosting
    to get a more accurate picture of Web server popularity. The results are quite
    bit different than the Netcraft surveys.


    +   5. Compare the results of the BizNix and Netcraft surveys. How are they similar?
    How do they differ?


    # Certification Objectives


    Objectives for the Linux+ exam:


    +   Describe the functions, features, and benefits of Linux solutions as compared
    with other operating systems (1.8)


    # Review Questions


    +   1. Why is it that the Netcraft survey may not be an accurate way of determining
    the number of Apache Web servers on the Internet?


    +   a. There’s no way to know what software a Web server is using.


    +   b. A Web server could be using virtual hosting that allows one physical Web
    server to appear as numerous Web servers.


    +   c. Web servers can masquerade as other software. Web server administrators
    may do this to improve compatibility between their servers and popular Web browsers.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '2. Why are the BizNix results likely to give a more accurate picture of Apache
    market share?


    +   a. The big companies, government agencies, and military departments surveyed
    are less likely to use virtual hosting.


    +   b. The BizNix survey knows when a Web server is lying about the software it''s
    using.


    +   c. The BizNix survey knows when Web servers have had their software upgraded.


    +   3. The percentage of Apache usage by big companies in the United States is
    the same as big companies in other parts of the World. True or False?


    +   4. The BizNix survey shows that U.S. military Web sites prefer to use Microsoft''s
    IIS Web server. True or False?


    # # LAB 1.4 SEE HOW LINUX AND WINDOWS CAN BE INTEGRATED


    # ## Objectives


    The goal of this lab is to help you become aware of the many ways that Linux and
    Windows computers can be integrated.


    # ## Materials Required


    This lab requires the following:


    +   - An Internet connection and a Web browser


    Estimated completion time: 30 minutes


    # ## ACTIVITY


    +   1. Start your Web browser.


    +   2. Type http://www.biznix.org/software/samba.html in the Address bar of the
    browser, and then press Enter. The Web page gives a general overview of the Samba
    software. When you run Samba on your Linux computer, it becomes a file and print
    server compatible with Microsoft Windows computers. A more technical way of saying
    this is that Samba is a SMB server or CIFS server. Samba also has a client component
    that allows your Linux computer to access other SMB or CIFS servers.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Chapter 1 Introduction to Linux


    3. Type http://www.winehq.org in the Address bar of the browser, and then press
    Enter. You will see a Web page for WINE; a project that allows Microsoft Windows
    programs to run on your Linux computer.


    4. Click the What is WINE link. This will take you to a Web page with a great
    deal of information about WINE. Note that you will be told that WINE is still
    in development. It has been for many years and its status will likely not change
    soon. Creating a compatibility layer for software as big and complex as Windows
    is a mammoth undertaking. The downside to WINE''s development status is that some
    Windows programs can not run correctly with WINE.


    5. Type http://www.vmware.com in the Address bar of the browser, and then press
    Enter. You will see a Web page for VMware, a commercial product that allows you
    to run Windows programs on your Linux computer or vice versa. VMware takes a different
    approach than WINE. It requires that you install a Windows operating system inside
    of a virtual machine running on your Linux computer (the concept of a virtual
    machine is explained on the Web site). When you run your Windows programs inside
    the virtual machine, they are running on real Windows and, therefore, properly.


    6. Type http://www.rdktop.org in the Address bar of the browser, and then press
    Enter. You will see a Web page for rdesktop, a Windows Terminal server client
    for Linux. Using rdesktop, you can run Windows programs on your Windows NT or
    Windows 2000 Terminal Server but have Linux operate your screen, keyboard, and
    mouse. Your Windows programs are running on a Windows computer but, you''re using
    a Linux computer.


    7. All of the Windows/Linux integration solutions you''ve seen in this lab can
    be used separately or in combination. There are many ways to introduce open-source
    software and Linux into your company without sacrificing Windows functionality.
    These integration solutions allow you to run newer Linux applications on the same
    computers and networks that are running your legacy applications.'
  merge: -1
  pgno: 17
- img_proc: true
