    program, xterm. If you want other programs to appear in the menu you have to configure
    the menu, but this is beyond the scope of this exercise. Refer to the twm man
    page for details.


    +   12. Move the mouse cursor over one of the xterm windows so the window has
    its focus. Killall twm to stop the twm window manager.


