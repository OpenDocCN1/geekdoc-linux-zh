  md: '# LAB 5.1 EXPLORING THE FILESYSTEM HIERARCHY STANDARD


    # Objectives


    The goal of this lab is to learn about the Filesystem Hierarchy Standard (FHS).
    When you understand FHS, you know where files should be placed in the filesystem.You
    will explore the Filesystem Hierarchy Standard (FHS) Web site to learn more about
    this important standard.


    # Materials Required


    This lab requires the following:


    +   - Access as an ordinary user to a computer running Linux


    Estimated completion time: 40 minutes


    ![](img/3bd24ceeed5983554c0123729814a2d6_61_0.png)


    # ACTIVITY


    +   1. Log in to your Linux computer as an ordinary user.

    2. Start up a Web browser and enter the following in the URL line, and press **Enter:
    http://www.pathname.com/fhs/**

    3. Click **FHS2.HTML**, then click the **Table of Contents** link.

    4. Click the link to **The Filesystem** and read the entire page. This page explains
    that the FHS applies to any filesystem that supports the same security features
    found in non UNIX filesystems. This includes Linux but does not include non-UNIX
    operating systems, such as Microsoft Windows. The page also places files into
    two categories shareable versus unshareable and variable versus static.

    5. Click the link to **The Root Filesystem**. Then click the **Purpose** link,
    and read the entire page. Note the caution "Software must never create or create
    special files or subdirectories in the root directory" and the reasons why. Not
    only must software never do this, users should not do this. Of course, the only
    user capable of doing this is the root user if permissions are set correctly.

    6. Go back to the Table of Contents by clicking the **Table of Contents** link.
    Click the **/bin : Essential user command binaries (for use by all users)** link.
    Read the Purpose section. Note that this directory is required for the system
    to run and be administered at a basic level even when other filesystems are mounted.
    This page also tells you the files that must be present in the directory.

    7. Go back to the Table of Contents by clicking the **Table of Contents** link.
    Click the **/etc : Host-specific system configuration** link. Read the Purpose
    and Requirements sections. This directory and any subdirectories'
