    13. The results show that the Sequential performance for block writes was

    100 KB/s or about 4.8 MB/s. This is far lower than the previous results where

    100 MB test file was used. Using a 400 MB test file clearly reduces the effects

    of the disk cache. This tells you that having excess memory that Linux can use
    as

    a disk cache significantly improves disk performance. It also comes closer to
    your

    disk''s true performance.


    When you use a larger file for the test, you obtain accurate results but the test

    runs longer.


