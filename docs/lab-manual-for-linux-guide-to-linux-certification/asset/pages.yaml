    4. You just created a script file called **sorter** in your home directory. Now,
    to make it executable, use **chmod +x sorter** and press **Enter**.


    ![](img/3bd24ceeed5983554c0123729814a2d6_126_0.png)


    Normally, programs of any type should be located in an appropriate directory,
    not your home directory. You studied the Filesystem Hierarchy in a previous chapter,
    so you should have some idea which directories to use. For simplicity in this
    exercise, you put the script in your home directory. We''re also not using the
    hashing (the first line in shell scripts that defines which shell is used). This
    line is also referred to as a shebang line. We''re not using hashing in this exercise
    to keep this as simple as possible.


    5. The next thing to do is to tell BASH to run the sorter program every time BASH
    displays the PS1 prompt. To do this, create an environment variable PROMPT_COMMAND
    whose value is the name of the sorter program by typing **PROMPT_COMMAND=~/sorter**
    and pressing **Enter**.


    6. Type **cat Smith,John:13001>>list** and press **Enter**. If the list file does
