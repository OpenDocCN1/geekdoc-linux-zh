  md: '# LAB 12.3 USING NAMED PIPES WITH LOGGING


    # Objectives


    The goal of this lab is to learn how you can use named pipes and simple scripts
    to add capability to system logging. It''s not uncommon for a Linux server to
    have two or more daemons logging to the same facility. A good example is a server
    used for e-mail that runs a SMTP daemon and a POP3 daemon. Both log to the mail
    facility causing the log messages for both daemons to be written to the same log
    file.


    You can''t configure syslog to write the log messages for the two daemons to separate
    files. However, you can use a named pipe and a simple script to send the messages
    to separate files.


