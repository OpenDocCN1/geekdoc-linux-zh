  md: '# LAB 11.1 DISPLAYING PARENT/CHILD RELATIONSHIPS


    # Objectives


    The goal of this lab is to investigate the various ways that parent/child relationships
    between processes can be displayed.


    # Materials Required


    This lab requires the following:


    +   - Access as an ordinary user to a computer running Linux


    # Activity Background


    Chapter 11 in the main text tells you about parent and child processes and PPID
    values. The PPI is the ps -f command to see the PID and PPID. The PPID is the
    PID of the parent process.


    Using PPID values, you can see the parents of all processes. When child processes
    have children, the relationships are more complex and difficult to see in the
    display. In this activity, you explore other commands that more clearly show the
    relationships between processes.


    Estimated completion time: 30 minutes


    # ACTIVITY


    1. Switch to a command-terminal (tty2) by pressing Ctrl+Alt+F2, and log in to
    the terminal using any username.


    2. Type ps -eH and press Enter. The e option selects all processes and the H option
    produces process hierarchy display. Child processes appear below their parents
    and are indented by two spaces. This allows you to more easily see parent/child
    relationships with nonhierarchical ps displays. Here''s an example taken from
    a Red Hat 7.2 system running the Gnome desktop:


    ```

