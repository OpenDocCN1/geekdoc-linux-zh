  md: '# Lab 5.1 Exploring the Filesystem Hierarchy Standard


    contain files used for configuring the system, daemons, or application programs.
    No executable programs (binaries) may exist in this directory structure, according
    to the FHS.


    +   8. Read the Specific Options section. It tells you that certain subdirectories
    must exist only "if the corresponding subsystem is installed." The best example
    is the X11 directory that must exist only if you''re running the X Windows System
    (the graphics system). If your Linux computer is running as a server and has no
    graphical system installed, the X11 directory may not exist because it''s not
    needed. Some Linux distributions install the X11 directory.


    +   9. Go back to the Table of Contents by clicking the Table of Contents link.
    Click the /home: User directories (optional) link and read the entire page. The
    word "optional" means that the /home directory is not required for a system to
    be FHS compliant. An administrator can devise an alternate method of handling
    home directories.


    User directories do not have to be in the /home directory. You can put them in
    any FHS-compliant place, such as /var/home. If you do this, you have to modify
    the home directory locations in the /etc/passwd file.


    +   10. Click the /lib : Essential shared libraries and kernel modules link. Read
    the Purpose and Specific Options sections. Note that you''ll always have a modules
    subdirectory because most Linux distributions use kernel modules.


    +   11. Click the /lib<>: Alternate format shared libraries (optional) link. Read
    the entire page. In the future, you''re likely to run a 64-bit version of Linux
    on your 64-bit architecture computer. When you do, you''ll likely have directories
    mentioned on this page: /lib32, /lib64, and a /lib symbolic link to one of them.


    +   12. Go back to the Table of Contents by clicking the Table of Contents link.
    Read the /sbin:System binaries link. Read the entire page. Pay attention to footnote
    15, which tells you that "Programs executed after /usr is known to be mounted
    (when there are no problems) are generally placed into /usr/sbin. Locally installed
    system administration programs should be placed into /usr/local/sbin." This should
    be your guide when installing additional system administration-oriented software
    on your computer.


    +   13. Click the /tmp : Temporary files link. Read the entire page. The most
    important concept on this page is that any files placed in this directory are
    not expected to survive a system shutdown and startup. How this is handled is
    a local issue, however. Some Linux distributions erase all the files in the /tmp
    directory on startup and some don''t.


    This completes this lab exercise, but there''s more FHS-related reading to do
    if you have the time. Optionally, you can explore links about the /usr and /var
    directory structures.


