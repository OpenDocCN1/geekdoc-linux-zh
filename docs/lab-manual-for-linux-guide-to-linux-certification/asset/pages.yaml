  md: '# LAB 15.5 CONFIGURING AND USING NTP


    # Objectives


    The NTP protocol allows any computer on the Internet to synchronize time servers.
    The software that makes this possible is the ntpd time server. Most Linux distributions
    include and install ntpd by default. You simply need to configure it. This lab
    shows you how to synchronize your computer with international time servers using
    the nptd daemon, and how to check that your computer is synchronized with the
    ntptrace command.


    # Materials Required


    This lab requires the following:


    +   * Access as a root user to a computer running Linux

    * A Web browser and Internet connection

    * If there is a firewall between your Linux computer and the Internet, it must
    allow TCP port 123 to pass in order to successfully complete this exercise


    Estimated completion time: 45 minutes


    # ACTIVITY


    +   1. Switch to the second virtual console (tty2) by pressing Ctrl+Alt+F2, and
    log in as the root user.


    +   2. Run your Web browser and enter http://www.eeces.udel.edu/~mills/ntp/clock2.html
    in the URL line. The page that appears lists the public NTP time servers that
    you may access.


    +   3. Choose three time servers from the list that are geographically closest
    to you and note their names and IP addresses.'
