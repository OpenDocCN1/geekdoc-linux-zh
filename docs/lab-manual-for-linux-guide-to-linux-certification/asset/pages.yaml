    # Activity Background


    When Linux computers are networked, it''s useful to notify all users when the
    system is shut down. This gives users a chance to save their data and exit their
    applications before the shutdown. The Linux shutdown program can do this automatically
    when you specify a message on the command line.


    Estimated completion time: 20 minutes


    # ACTIVITY


    +   1. If your computer is currently displaying a graphical desktop, such as Gnome
    or KDE, use the Ctrl+Alt+F2 key sequence to go to a command prompt.

    2. Tell Linux to shut down five minutes from now. Enter this command:

    ```

    shutdown -h +5m The system is going down

    ```

    You''ll see the following messages appear on your screen:

    ```

    The system is going down

    The system is going DOWN for system halt in 5 minutes !

    ```


    ```

    shutdown -h +5m The system is going down

    ```


    Typing -5m to imply five minutes in the future seems silly given that Linux can''t
    travel back in time to do a shutdown (it''s not possible to do a -5). You can
    leave off the sign and instead use 5m, which is equivalent. Similarly, the only
    allowed unit of time is minutes (you can''t use s for seconds or h for hours).
    Specifying 5m is the same as 5. To specify one hour, you''d use 60m or, simply,
    60.


    ```

