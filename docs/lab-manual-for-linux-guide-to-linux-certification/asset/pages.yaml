  md: "10. If you want the ntpd daemon to run every time you boot up your system,\
    \ enter chkconfig ntpd on. This starts the ntpd daemon whenever your system enters\
    \ run-levels 3, 4, and 5.\n\nIn the unlikely event you want the ntpd daemon to\
    \ run when you enter run-level 1, enter chconfig -level 1 ntpd on.\n\n11. If you\
    \ decide to run the ntpd daemon as a permanent part of your system, read the Rules\
    \ Of Engagement on the www.cvis.umd.edu/~mills/ntp/servers.html page. It tells\
    \ you how you should notify the administrators of the remote time servers that\
