  md: '# Is the Remote Port Open?


    You can route to the machine but you still can''t access the web server on port
    80. The next test is to see whether the port is even open. There are a number
    of different ways to do this. For one, you could telnet:


    ```

    $ telnet 10.1.2.5 80

    Trying 10.1.2.5...

    telnet: Unable to connect to remote host: Connection refused

    ```


    If you see Connection refused, then either the port is down (likely Apache isn''t
    running on the remote host or isn''t listening on that port) or the firewall is
    blocking your use. If telnet can connect, then, well, you don''t have a networking
    problem at all. If the web server isn''t working the way you suspected, you need
    to investigate Apache configuration on web1. Troubleshooting web server issues
    is covered in Chapter 8.


    Instead of telnet, I prefer to use nmap to test ports because it can often detect
    firewalls. If nmap isn''t installed, use your package manager to install the nmap
    package. To test web1, type the following:


    ```

    $ nmap -p 80 10.1.2.5

    Starting nmap 4.62 ( http://nmap.org ) at 2009-02-05 18:49 PST

    Interesting ports on web1 (10.1.2.5):

    PORT STATE SERVICE

    80/tcp filtered http

    ```


    Aha! nmap is smart enough that it can often tell the difference between a closed
    port that is truly closed and a closed port behind a firewall. Normally when a
    port is actually down, nmap will report it as closed. Here it reported it as filtered.
    What this tells us is some firewall is in the way and is dropping the packets
    to the floor. This means you need to investigate any firewall rules on the gateway
    (10.1.1.1) and on web1 itself to see if port 80 is being blocked.


    # Test the Remote Host Locally


    At this point, we have either been able to narrow the problem down to a network
    issue or we believe the problem is on the host itself. If we think'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# Server A Can''t Talk to Server 77


    the problem is on the host itself, we can do a few things to test whether port
    80 is available.


    # Test for Listening Ports


    One of the first things you should do on web1 test whether port 80 is listening.
    The netstat -lnp command will list all ports that are listening along with the
    process that has the port open. You could run that and parse through the output
    for anything that is listening on port 80, or you could use grep to show only
    things listening on port 80:


    ```

    $ sudo netstat -lnp | grep :80

    tcp 0 0 0.0.0.0:80 0.0.0.0:* LISTEN 919/apache

    ```


    The first column tells you what protocol the port is using. The second and third
    columns are the receive and send queues (both are set to 0 here). The column you
    want to pay attention to is the fourth column, as it lists the local address on
    which the host is listening. Here the 0.0.0.0:80 tells us that the host is listening
    on all of its IPs for port 80 traffic. If Apache were listening on web1''s Ethernet
    address, you would see 10.1.2.5:80 here.


    The final column will tell you which process has the port open. Here you can see
    that Apache is running and listening. If you do not see this in your netstat output,
    you need to start your Apache server.


    # Firewall Rules


    If the process is running and listening on port 80, it''s possible that web1 has
    some sort of firewall in place. Use the iptables command to list all of your firewall
    rules. If your firewall is disabled, your output will look like this:


    ```

    $ sudo /sbin/iptables -L

    Chain INPUT (policy ACCEPT)

    target prot opt source destination

    Chain FORWARD (policy ACCEPT)

    target prot opt source destination

    Chain OUTPUT (policy ACCEPT)

    target prot opt source destination

    ```'
  merge: -1
  pgno: 99
- img_proc: true
