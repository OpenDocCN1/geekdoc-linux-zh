    works on the premise that most spam mail servers have so much spam to send that
    if they are told to try again later, they won''t bother. The first time a mail
    server with greylisting enabled gets a connection from a remote mail server, it
    replies back with the error code 450 and the instructions to try back in a few
    minutes.


    Error codes that start with 5 (501) or other command errors, they can range from
    syntax (501) or all start with 50, codes that start with 55 and denote more common
    errors such as the mailbox being unavailable (550), and the mailbox being full
    (552), and the mailbox name not being allowed (553), and a general transaction
    failure (554).


    # Outbound Mail Server Won''t Allow Relay


    Open relays are mail servers that are configured to accept incoming email from
    any host and relay it to any other mail server. In the days before spam, open
    relays were relatively common, but nowadays any mail server on the open Internet
    relays mail for any other host gets flagged by spam blackhole lists and quickly
    finds itself blocked by mail servers.


    An outbound mail server used to relay mail should either be walled off from incoming
    SMTP traffic from the Internet, or set up with a restricted list of IPs or subnets
    it will accept mail. Even better than that, some mail servers use authentication,
    as as SMTP auth, so that they only relay mail from clients with the right username
    and password. If you find that your mail client is able to connect to the mail
    server but it gets an error back stating relay access is denied, your problem
    is likely with one of the just-mentioned relay safeguards.'
