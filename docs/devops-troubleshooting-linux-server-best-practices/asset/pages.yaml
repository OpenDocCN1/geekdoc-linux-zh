  md: '# Chapter 5 Is the Server Down? Tracking Down the Source of Network Problems


    The following would be used on Red Hat-based systems:


    ```

    $ sudo service network restart

    ```


    On a side note, it''s amazing that these distributions have to differ even on
    something this fundamental.


    Once you have identified the gateway, use the ping command to confirm that you
    can communicate with the gateway:


    ```

    $ ping -c 5 10.1.1.1

    PING 10.1.1.1 (10.1.1.1) 56(84) bytes of data.

    64 bytes from 10.1.1.1: icmp_seq=1 ttl=64 time=31.53 ms

