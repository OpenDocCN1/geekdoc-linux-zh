  merge: -1
  pgno: 159
- img_proc: true
  md: 'would see. For instance, if the user''s mailbox is full, the disk is full in
    general, or there''s some other server problem, you would get an error message
    when you try to send your test email that tells you where to investigate next.


    On, the other hand, the message is accepted, confirm that it ends up in the recipient''s
    mailbox. If the email doesn''t make it in the mailbox, then you have some problem
    between your mail server and POP/IMAP server (or, if it''s on the same machine,
    a problem handling off incoming email to your local mailboxes). If the email does
    make in the mailbox, then you can reasonably sure the mail server is functioning
    correctly at the present time, and it''s time to dig through the logs to find
    out what happened to the original message that wasn''t delivered.


    # Pore Through the Mail Logs


    If your mail server seems to be accepting other email fine, you now need to see
    if you can find evidence that the remote mail server attempted to connect to your
    incoming mail server and deliver the email. If you are responding to a user complaint,
    see if you can find out range of time when the email was supposed to have been
    sent and the FROM email address. Both of these facts will help you when you dig
    through your mail logs.


    For instance, if the user''s email address is jan@example.net and Jan tells you
    that Fred (fred.smith@gmail.com) emailed her around 8:00 am. this morning she
    hasn''t gotten the email yet, that should be enough information to go on get.
    With the first thing you would do is open your current /var/log/mail.log and with
    a program like less, and skip until you got to logs around 8:00 am. You''re not
    necessarily trying to find Jan''s message specifically here, but just performing
    a sanity check to see whether other messages were delivered around that time period.
    The fact is, even if the mail system was down at that time, the message would
    have either been queued in a secondary mail server, or once the mail server came
    back online the message should have gotten delivered shortly afterward.'
