  md: '# Chapter 10 - It''s the Hardware''s Fault! Diagnosing Common Hardware Problems


    smartctl also provides a daemon called smartd that can do this very thing. By
    default it may be turned off, so on a Debian-based system, you would have to edit
    /etc/default/smartmontools uncomment start_smartd=yes, then run service smartmontools
    to start the service. If you''re not using a Debian-based distribution, check
    the documentation for SMART package—it could be that the service is automatically
    started for you. In either case, you may want to check out the /etc/smartd.conf
    configuration to tweak any default settings to suit your system.


    # Test RAM for Errors


    Some of the most irritating types of errors to troubleshoot are those caused by
    bad RAM. Often errors in RAM cause mayhem on your machine with programs crashing
    for no reason, or even random kernel panics. In fact, when a once-stable server
    starts to misbehave, particularly with random crashes, bad RAM is one of the first
    things you should check.


    Most major Linux distributions include an easy-to-use RAM testing called Memtest86+
    that, in some cases, is not installed by default, it''s ready as a boot option
    in distributions like Ubuntu. Otherwise, install the package and you should be
    able to easily add it to your GRUB configuration if it isn''t added automatically.
    Another option is to simply pick just any Linux install disk or rescue tool. Since
    Memtest86+ only takes a little bit of space, most disks offer it a diagnostic
    tool you can select at boot time. No matter how you invoke it at boot time, once
    you start Memtest86+, it will immediately launch and start scanning your RAM,
    as shown in Figure 10-1.


    Memtest86+ runs through a number of exhaustive tests that can identify different
    types of RAM errors. At the top right, you can see which test is currently running
    along with its progress; and in the Pass field, you can see how far you are along
    with the complete test. A thorough memory test can take hours to run, and administrators
    with questionable RAM might want to let the test run overnight or over multiple
    days necessary to If Memtest86+ does find'
  merge: -1
