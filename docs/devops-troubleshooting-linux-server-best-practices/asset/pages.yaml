    Unlike MySQL, with PostgreSQL, even a basic install has multiple processes running
    and being responsible for different tasks. Also, since PostgreSQL lists on a different
    port (5432) by default than MySQL, when you run netstat, you will need to get
    for that:


    ```

    $ netstat -lmp | grep :5432

    tctp 0 0 127.0.0.1:5432 0.0.0.0:* LISTEN 1629/postgres

    tcp6 0 0 ::* LISTEN 1629/postgres

    ```


    Note that the process is listening on the port in the ps output. ID (1629) as
    the first process if you don''t get any output, trying grep for postgres instead
    of the port to see if postgres is listening on any other port (or just look at
    netstat output without the grep command). Also note that in this case PostgreSQL
    is listening only on the localhost (127.0.0.1:5432), so only processes on the
    same server can access the database—a safe default that''s all you need. If you
    need other servers to be able to access the database and PostgreSQL is only listening
    on 127.0.0.1, you will need to reconfigure PostgreSQL to either listen on'
