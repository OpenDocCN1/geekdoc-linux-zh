  md: 'ALTHOUGH MOST OF THE problems you''ll find on a server have some basis in networking,
    a class of issues still involves only the localhost. What makes this tricky is
    that some local and networking problems often create the same set of symptoms,
    and in fact, local problems can create network problems that occur specifically
    on a host and leaves issues that impact the network to Chapter 5.


    Just about everyone in a DevOps team faces problems with a sluggish or unresponsive
    host, whether you are a developer trying to track why their latest check-in is
    running slower than before, a QA engineer trying to perform load tests before
    their code hits production, or a sysadmin needs to figure out whether it''s time
    to buy more RAM, extra CPUs, or faster disks. These same techniques can even help
    you troubleshoot problems on your Linux desktop.


    Probably one of the most common problems you will find on a host is it is sluggish
    to the point of being unresponsive. This can be caused by network issues, but
    this chapter will discuss some local troubleshooting tools you can use to tell
    the difference between a loaded network and a loaded machine.


    When a machine is sluggish, it is often because you have consumed all of a particular
    resource on the system. The main resources are CPU, RAM, disk I/O, and network
    (which I will leave to Chapter 5). Overuse of any of these resources can cause
    a system to bog down to the point that the only recourse is your last resort—a
    reboot. If you can log in to the system, however, there are a number of tools
    you can use to identify the cause.


    # System Load


    System load average is probably the fundamental metric you start from when troubleshooting
    a sluggish system. One of the first commands I run when I''m troubleshooting a
    slow system is uptime:


    ```

    $ uptime

    13:35:03 up 103 days, 8 min, 5 users, load average: 2.03, 20.17, 15.09

    ```'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# System Load 19


    The three numbers after load-average—2.03, 20.17, and 15.09—represent 1-, 5-,
    and 15-minute load averages on the machine, respectively. A system load average
    is equal to the average number of processes in a runnable or uninterruptible state.
    Runnable processes are either currently using the CPU or waiting to do so, and
    uninterruptible processes are waiting for I/O.


    A single-CPU system with a load average of 1 means the single CPU is under constant
    load. If that single-CPU system has a load average of 4, there is four times the
    load on the system than it can handle, so out of four processes are waiting for
    resources. The load average reported on a system is not tweaked by the number
    of CPUs you have, so if you have a two-CPU system with a load average of 1, one
    of your CPUs is loaded at all times—that is, you are 50% loaded. So a load of
    1 on a single-CPU system is the same as a load of 4 on a four-CPU system in terms
    of the amount of available resources.


    The 1, 5-, and 15-minute load averages describe the average amount of load over
    that respective period of time and are valuable when you try to determine the
    current state of a system. The 1-minute load average will give you a good sense
    of what is currently happening on a system, so in the previous example, you can
    see that the server most recently had a load of 2 over the last minute, but the
    load had spiked over the last 5 minutes to an average of 20. Over the last 15
    minutes the load was an average of 15. This tells us that the machine had been
    under high load for at least 15 minutes and the load appeared to increase around
    5 minutes ago, but it appears to have subsided. Let''s compare this with a completely
    different load average:


    ```

    $ uptime 05:11:52 up 20 days, 55 min, 2 users, load average: 17.29, 0.12, 0.01

    ```


    In this case, both the 5- and 15-minute load averages are low, but the 1-minute
    load average is high, so I know that this spike in load is relatively recent.
    Often in this circumstance I will run uptime multiple times in a row (or use a
    tool like top, which I will discuss in a moment) to see whether the load is continuing
    to climb or is on its way back down.'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# What Is a High Load Average?


    A fair question to ask is what load average you consider to be high. The short
    answer is “It depends on what is causing it.” Because the load describes the average
    number of active processes that are using resources, a spike in load could mean
    a few things. It is important to determine whether the load is CPU-bound (processes
    waiting on CPU resources), RAM-bound (specifically, high RAM usage that has been
    moved into swap), or I/O-bound (processes fighting for disk or network I/O).


    For instance, if you run an application that generates a high number of simultaneous
    threads at different points, and all of those threads are launched at once, you
    might see your load spike to 20, 40, or higher as they all compete for system
    resources. As they complete, the load might come back down.


    Typically systems seem to be more responsive under CPU-bound load than under I/O-bound
    load. I have seen systems with loads in the hundreds that were CPU-bound, and
    I could still run diagnostic tools on those systems with pretty good response
    times. On the other hand, I have seen systems with relatively low I/O-bound loads
    on which logging took a minute because the disk I/O was completely saturated.
    A system that runs out of RAM resources often appears to have I/O-bound load,
    since once the system starts using swap storage on the disk, it can consume disk
    resources and cause a downward spiral as processes slow to a halt.


    # Diagnose Load Problems with top


    One of the first tools I turn to when I need to diagnose high load is top. When
    you type top on the command line and press Enter, you will see a lot of system
    information all at once (Figure 2-1). This data will continually update so that
    you see live on the system, including how long the system has been up, the load
    average, how many total processes are running on the system, how much memory you
    have—total, used, and free—and finally a list of processes on the system and how
    many resources they are using. You probably won’t be able to see every process
    that is currently running on your system with top because they wouldn''t all fit
    on'
  merge: -1
