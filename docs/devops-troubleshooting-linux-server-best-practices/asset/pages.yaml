  md: '# DNS Server Troubleshooting


    DNS caching can be quite handy, one problem for DNS administrators is that not
    every DNS server there honors your TTL. In, some ISPs have been known to completely
    disregard TTLs that are too low, to help reduce the load on their DNS servers.
    Because of this, even though you may have a TTL of only a few minutes, a DNS change
    you may take hours to show up on a DNS server that doesn''t obey it.


    The easiest way to see the TTL for a zone, outside of viewing it on the DNS server
    itself, is via the dig command:


    ```

    $ dig web1.example.net

    <>> DIG 9.7.0-P1 <<>> example.net

    ;; global options: +cmd

    ;; Got answer:

    ;; >>HEADER<< opcode: QUERY, status: NOERROR, id: 30750

    ;; flags: qa ra ra; QUERY: 1, ANSWER: 1, AUTHORITY: 2, ADDITIONAL: 2


    ;; QUESTION SECTION:

    web1.example.net.                               IN      A


    ;; ANSWER SECTION:

    web1.example.net.                            300 IN      A       10.1.2.5


