  md: '# Chapter 3 Why Won''t the System Boot? Solving Boot Problems


    If you find that the system does boot correctly once you change to a different
    device, you can edit your GRUB configuration file (/boot/grub/gr.conf or /boot/grub/menu.list;
    most GRUB 2 systems use UUIDs and auto-detect the root partition) and change the
    root= line permanently. By the way, if the device did change, you will probably
    need to change the same entry in /etc/fstab as well.


    For systems that use partitions labels, the inability to mount the root file system
    might be caused either by a disk being that has a partition with the same label,
    or it could be from an administrator who changed the root partition label. The
    best way to diagnose label problems is to edit the root= line, and instead of
    a label, specify the disk device itself. Again, if you don''t know how your disks
    are laid out, boot into a rescue disk and type fdisk -l. If you find that you
    are able to successfully boot once you set root to a disk device instead of a
    label, you can update your GRUB configuration file to use the device instead of
    a label, or you can use the program e2label to change the partition label of your
    root partition back to what it should be. So, for instance, assign a label of
    / /dev/sda2 as, would type


    ```

    e2label /dev/sda2 /

    ```


    In the case of duplicate labels, use the e2label tool as well to rename the duplicate
    root partition to something else. You can type e2label along with just the disk
    device name (like e2label /dev/sda2) to display what the current label is set
    to.


    If your system uses UUIDs and the kernel can''t find the root, it is possible
    that the UUID changed. Normally the UUID should be assigned when a partition is
    formatted, so it is unusual for it to happen to a root partition. That said, it
    often happens when someone clones a system based off one that uses UUIDs. When
    they create a new UUID, yet when they copy over the GRUB configuration files,
    it specifies the old UUID.


    With disk label problems, a quick way to troubleshoot this issue is to edit the
    boot prompt at the GRUB menu and change the root= line to'
  merge: -1
  pgno: 76
- img_proc: true
  md: 'specify a specific device instead of a UUID. If you find you get further along
    the boot process that way, then you can use the blkid command to see the UUID
    that''s assigned to a particular device:


    ```

    $ sudo blkid -s UUID /dev/sda2

    dev/sda2: UUID="528c6527-24bf-42d1-b908-c175f7b6a0f"

