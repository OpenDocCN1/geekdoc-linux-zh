    # Fix GRUB


    The difficulty in identifying and fixing problems with GRUB is in the fact that
    without a functioning boot loader, you can''t boot into your system and use the
    tools you would need to repair GRUB. There are different ways that GRUB might
    be broken on your system, but before you decide, you should understand that in
    the intent of booting quickly, some systems set GRUB with a short timeout of a
    few seconds before they boot the default OS, even on servers. What''s worse, some
    systems hide the initial GRUB prompt from the user, so you have to press a special
    key (Esc for GRUB 1 releases, also known as GRUB legacy, and Shift for GRUB 2,
    also just known as GRUB) within a second or two after your BIOS has passed control
    to GRUB.


    If you don''t know which version of GRUB you have installed, you may have to boot
    the system a few times and try out both Esc and Shift to see if you can get some
    of GRUB window to display. After that, you might still have to deal with a short
    timeout before GRUB boots the default OS, so you''ll need to press a key (arrow
    keys are generally safe) to disable the timeout. The following sections discuss
    few of the ways GRUB might be broken and then follow up some general approaches
    to repair.


    # No GRUB Prompt


    The first way GRUB might be broken on your system is that it could have been removed
    from your MBR. Unfortunately, since GRUB is often hidden from the user even when
    it works correctly, you may not be able to tell whether GRUB is configured wrong
    or not installed at all. Test by pressing either the Esc or Shift keys during
    the boot process to confirm that no GRUB prompt appears.'
