  md: 'so that you could load only the modules needed for your system. Since the disk
    drivers and file system support were split out into modules, we faced with a chicken
    or egg problem. If the modules are on the root file system, but you need those
    modules to read the root file system, how can you mount it? The solution was to
    put all crucial modules into the initrd.


    As the kernel boots, it extracts the initramfs into RAM and then runs a script
    called init in the root of that initramfs. This script is a standard shell script
    that does some hardware detection, creates some mount points, and mounts the root
    file system. The kernel knows where the root file system is, because it was passed
    as one of the boot arguments (root=) by GRUB when it first loaded the kernel.
    The final step for the initramfs after it mounts the real root file system is
