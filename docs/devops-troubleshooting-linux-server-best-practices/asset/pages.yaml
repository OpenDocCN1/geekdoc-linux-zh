    you exactly what the system was doing at any particular moment. Even on server
    installs, many systems default to hiding a lot of valuable debug information.


    If you''ve gotten past the GRUB prompt but the system gives errors along in the
    boot process, you will want to disable any splash screen or other mode that suppresses
    output so you can see any errors. To do this, go to the GRUB menu that displays
    your different options (you may have to hit Esc or Shift at boot to display this
    menu), then press E to edit the boot arguments for specific menu entry. Look for
    the line that contains all of your kernel arguments (it might start with the word
    linux or kernel) and edit it to remove arguments like quiet and splash. Optionally,
    you may add the word splash to make sure any splash screens are disabled. Now
    once you exit the editing mode and boot with these new options, you should be
    able to see debug output as your system boots.


    # Can''t Mount the Root File System


    Apart from GRUB errors, one of the most common boot problems is from being able
    to mount the root file system. After GRUB loads the kernel and initrd into RAM,
    the initrd file is expanded into an initramfs temporary root file system in RAM.
    This file system contains kernel modules and programs the kernel needs to locate
    and mount the root file system and continue the boot process. To best troubleshoot
    problems in which the kernel can''t mount the root file system, it''s important
    to understand how the kernel knows where the root file system is to begin with.'
