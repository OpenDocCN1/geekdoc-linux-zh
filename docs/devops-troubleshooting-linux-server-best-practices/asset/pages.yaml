- img_proc: true
  md: 'IF YOU WERE TO ask a DevOps team to describe what part of a Linux server was
    the source of the most trouble for them, many would point to the hard drive. Not
    only is the hardware most likely to fail on your server (which we''ll cover in
    Chapter 10), it is often also one of the main bottlenecks of your application.
    On top of that, if you are in charge of maintaining the server, you also have
    to deal with disks filling up and file systems corrupted. All of the latter problems
    start with the same symptom: A user or program can''t write data to the disk.


    In a DevOps organization, logging debug data is particularly valuable when you
    are troubleshooting your code. When one of your automated tests fails, you may
    want to know exactly what caused the failure. All logs add up, though, and if
    left to themselves they will eventually fill up the disk. If that happens, you
    may not automatically know which directory is using up all that space, and when
    processes can''t write to disk, they sometimes fail in unusual ways. This chapter
    covers how to diagnose and fix some of the common problems that can prevent you
    from writing to the disk.


    # When the Disk Is Full


    Linux actually makes it pretty obvious when you run out of disk space:


    ```

    $ cp /var/log/syslog syslogbackup

    cr writing `syslogbackup`: No space left on device

    ```


    Of course, depending on how your system is partitioned, you may know which partition
    filled up. The first step is to use the df tool to list all of your mounted partitions
    along with their size, used space, and available space. If you add the -h option,
    it shows you data in human-readable format, instead of in 1K blocks:


    ```

    $ df -h

    Filesystem      Size Used Avail% Mounted on

    /dev/sda1       7.8G 7.4G 60M 100% /\nnone            245M 192K 245M 1% /dev

    none            249M 0 249M 0% /dev/shm

    none            249M 36K 249M 1% /var/run

    ```'
  merge: -1
  pgno: 80
- img_proc: true
