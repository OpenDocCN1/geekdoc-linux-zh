- img_proc: true
  md: 'TROUBLESHOOTING IS A SKILL. As with all skills, whether it’s juggling, playing
    the guitar, cooking, or programming, some people naturally have a knack for troubleshooting
    and others don’t. If a skill comes naturally to you, you might assume comes naturally
    to everyone else. After all, if you rode a bike on your first trip, you may take
    for granted how much work other people have to put into it.


    Some people are naturally good at troubleshooting. When faced with a problem,
    they automatically snap into action and instinctively pick steps that further
    isolate the problem until they have the root cause. When you take a car to a good
    mechanic, one who is good at troubleshooting, right after you describe your symptoms
    you can see the gears turning; he’s already isolated the problem to a handful
    of causes and has a “hunch” about the root cause. After a few tests he will confirmed
    his hunch and be well on his way fixing your car. On the other hand when you take
    your car to a mechanic who’s bad at troubleshooting, you can expect high repair
    bills and trip after trip to the shop as one after another part of your car is
    replaced.


    Troubleshooting is a skill that anyone can learn. With many skills, certain techniques
    are involved in troubleshooting that, whether they come naturally or not, can
    become second nature through practice. You not only want to be a better troubleshooter,
    you also want to be faster. This is especially when you work in an environment
    where downtime is measured in dollars. After all, both the good mechanic and the
    bad mechanic will eventually fix your car, but which one would you prefer on it?


    In a DevOps organization, everyone on the team is responsible for some level of
    troubleshooting. A developer sysadmin troubleshoots problems on hardware, and
    the QA team spends a great majority of their time first finding problems and trying
    to locate the root cause. When everyone on the DevOps team uses the same proven
    troubleshooting techniques, the whole team benefits.


    This chapter describes some troubleshooting best practices you can apply to just
    about any problem. Most of these practices are fairly common-sense'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Divide the Problem Space


    once you read them, but you might be amazed how many people skip them when faced
    with a problem.


    # Divide the Problem Space


    If I asked you to guess a number I was thinking of 1 to 100, what number would
    you guess? Let''s say the number is 73, and after every guess I will tell you
    whether the number is higher or lower than your guess. Some people start randomly
    guessing numbers, start with 1 and work your way up. Anyone who is good at troubleshooting
    would probably guess something like: 50 (higher), 75 (lower), 63 (higher), 69
    (higher), 72 (higher), 73. With each guess, the number of possibilities was cut
    in half. In this example it took 6 guesses to find the right answer, whereas if
    you started from 1 and went up, it would take 73. If you just guessed randomly
    you might go through all the numbers before you lucked into the right one.


    This same approach applies to all troubleshooting. When faced with a problem,
    just start at the bottom of the list of possible causes and work your up; others
    choose random tests until they luck into the cause. A good troubleshooter chooses
    each test so that the result will rule out a class of causes, not just a single
    cause. Divide and conquer. When you divide the problem space, even if a test doesn''t
    reveal the root cause, the results rule out more than one cause.


    For instance, if I tried to load a website in my browser and the request timed
    out, and I wanted to test whether the problem was with my site or my Internet
    connection, I wouldn''t immediately go to the back of my computer to make sure
    the Ethernet cable was plugged in. Instead I would probably try to load one or
    two websites I know are stable. If those other websites came up, I would know
    my Internet connection was fine and would have just ruled out an entire set of
    local networking tests.


    When you are problem solving with a team of people, you will also want to divide
    the problem space between members of the team. Nothing is worse than tracing down
    a problem only to find out your teammate has been'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Chapter 1 Troubleshooting Best Practices


    working on the same exact test. When you set out to solve a problem in a team
    setting, assign different tests to each person and once someone has ruled out
    a cause, the result is communicated to everyone else.


    # Practice Good Communication When Collaborating


    One of the biggest challenges when troubleshooting with a team is establishing
    good methods of communication. Without good communication, two people work on
    the same problem without realizing it, people go down troubleshooting paths that
    someone else has already ruled out, or worse, people misunderstand instructions
    and make the problem worse. The following sections go over some of the different
    communication methods used for collaboration and describe what works and what
    doesn''t in each.


    # Conference Calls


    Conference calls are one of the most common and one of the absolute ways to communicate
    for problem solving. The biggest problem is that only one person can talk on a
    conference call at a time. Even if you are fortunate and only have people who
    are directly working an an issue on the call, anyone who has new information,
    a breakthrough, a warning, or anything else has to wait their turn to speak. When
    they do their turn, there''s no guarantee everyone will understand what they said
    the first time between interruptions, bad cell signals, and background noise from
    speaker users who forgot to mute. It is especially difficult to communicate command-line
    commands, IP addresses, log output, or anything else that''s remotely technical.


    If solving a problem quickly is important, then conference calls put a number
    of obstacles in your way. First and foremost is the time you spend to look up
    the conference call number and access code, everything in, and wait while the
    “moderator” joins the conference. Once the conference call is connected, you can
    expect the first five to ten minutes to be a complete wash as your conversation
    goes like:


    +   *BEEP* “____ just joined the conference.

    Fred: “Who just joined?”'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Practice Good Communication When Collaborating 5


    Ted: “It’s Ted. So the website is down! What do you think the problem is?”


    Fred: “Well I’m not sure yet . . I just logged into the . . .”


    *BEEP* “Mary just joined the conference.”


    Mary: “Hey so the website is down? What do you think the problem is?”


    Fred: “I just logged into the web server and I’m looking at the . . .”


    *BEEP* “Bob just joined the conference.”


    Bob: (highway noises in the background) “Hey the website is down!”


    The fact is, most problem-solving teams aren’t alone on the conference call. Many
    managers love conference calls as a way to be involved in the troubleshooting
    process and as a central command to “manage” the issue if they can’t directly
    contribute. This inevitably results in frequent requests for a progress report,
    which means someone (likely the team lead who you want to work the issue) stops
    what they are doing to explain. Since only one person can talk on the call at
    once, during the explanation no other member of the team can communicate.


    Essentially all of the other communication methods listed below are preferable
    to conference calls, while I’m not throwing away your conference call number,
    I am saying you should make it your last resort.


    # Direct Conversation


    It’s common for offices to seat teams together in the same area, yet when every
    team member is within earshot, often people turn to a conference call to communicate
    during a crisis. If everyone is within ear there are many advantages to discussing
    an issue out. For one, it’s generally easier to understand what someone says,
    and secondly, it’s easier for multiple conversations to occur at one time.


    The downside to direct conversations for problem solving is that it is still difficult
    to share any relatively technical information, much less long entries or URLs.
    On top of that, usually conversations aren’t recorded, so there’s no record of
    your troubleshooting steps for a later postmortem,'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Chapter 1 Troubleshooting Best Practices


    and anyone who joins the conversation late needs to be brought up to speed. Plus
    if everyone doesn''t work in the same location, or the problem occurs after-hours,
    then you are back to the conference call. For me, direct conversations are a good
    supplement for some of the other, better communication methods.


    # Email


    Email can be a good way to collaborate on a problem, especially if it isn''t time
    sensitive. You can see examples of this in the public bug-tracking systems for
    popular open source projects. The advantages of email over voice communication
    are


    +   - Multiple conversations can occur at once.

    - Side conversations are also easy.

    - It''s easy to paste in IP addresses, URLs, or commands.

    - You can attach screenshots or logs.

    - Someone who joined in the problem late can read the email thread and get up
    to speed by themselves.

    - You automatically have a time-stamped log of the troubleshooting process that
    might include pasted command output and other data that might not get logged other
    way.


    That said, a number of problems still exist with email communication. For one,
    email isn''t real-time and interactive, so there is always a lag you wouldn''t
    have when talking to someone in person, and that can really slow down the troubleshooting
    process. Secondly, long email chains can be difficult to parse and read, especially
    when people have different philosophies when it comes to top-posting versus bottom-posting
    replies. It''s very easy to overlook critical information that might be nested
    between comments or posted output. If you are an administrator and have monitoring
    software installed, you likely use email for one of the notifications. During
    an issue, your inbox might be filled with alerts, so it could be difficult to
    find the conversation in the middle of so many'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'other emails. Finally, what if the problem you were trying to solve is why
    the email server was down?


    # Real-Time Chat Rooms


    Real-time chat rooms are one of the best ways for a team to collaborate when troubleshooting.
