  md: 'THE DOMAIN NAME SYSTEM, or DNS, is one of the most important systems on the
    Internet. Every host on the Internet is assigned an IP address, but most of us
    don''t have the IP addresses of our favorite websites memorized. Instead, we type
    in a hostname that DNS translates into an IP address behind the scenes. You can
    also use DNS to convert IP addresses to hostnames. When DNS fails, you end up
    with an effect much like a failed network connection—you can''t reach a website
    or server you want to reach, but unlike with a failed network connection, your
    computer and the server are still on the network.


    In a DevOps organization, you might be presented with DNS troubleshooting from
    a number of different areas of responsibility. At the most basic level, you may
    have no direct control over your DNS system at, however, you notice you can no
    longer reach a server you are responsible for or that you develop on, or you may
    notice your automated tests are timing out when they try to resolve a server name.
    Ultimately else on your team may have to fix the problem, but you want to approach
    them with solid data first. Beyond that, perhaps you manage DNS for a website,
    but through a registrar or other third party and you only change records in a
    web GUI. Now some record you changed didn''t update, and you want to sanity-check
    things before you file a ticket with your DNS provider. Finally, maybe you are
    a full-fledged DNS administrator running your own DNS server, so when there''s
    a DNS problem, the buck stops with you. No matter where you fit on your DevOps
    team, DNS troubleshooting skills are valuable to have.


    Although understanding how DNS works really helps with troubleshooting, this chapter
    assumes that your understanding might be a bit hazy. That''s OK, because in the
    process of troubleshooting DNS problems step-by-step in this chapter, we will
    end up tracing a request all the way through the stack and back. The chapter is
    split into two distinct parts. The first part talks about how to troubleshoot
    DNS problems from the client side, and the second part talks about troubleshooting
    DNS server problems. The client-side troubleshooting will help you with the basic
    troubleshooting steps to know whether the problem is on your end or the DNS server''s.
    If you find that the problem is on the server'
  merge: -1
  pgno: 116
- img_proc: true
  md: '# DNS Client Troubleshooting 95


    end, the server troubleshooting section will help you trace down some common DNS
    server issues.


    # DNS Client Troubleshooting


    The first place to troubleshoot DNS problems is on your local host. You will find
    that even if the problem is on the DNS server side, you can trace down the cause
    of many DNS server issues from any client with nslookup and dig installed. Both
    the nslookup and dig tools can be used to troubleshoot DNS issues, but for basic
    testing, start with nslookup. For this-shooting step, we''ll borrow a scenario
    from the Chapter 5 where the client has an IP address of 10.1.1.7 and we have
    a server named web1 that has an IP address of 10.1.2.5 that we want to resolve.
    Here is an example of a successful nslookup request that resolves web1:


    ```

    $ nslookup web1

    Server: 10.1.1.3

    Address: 10.1.1.3#53

    Name: web1.example.net

    Address: 10.1.2.5

    ```


    In this DNS is working. The web1 host expands into web1.example net and resolves
    to the address 10.1.2.5. One of the first things to confirm, of course, is that
    this IP matches the IP that web1 is supposed to have! If web1 has the wrong IP
    address, then you can move to the DNS server troubleshooting section of this chapter
