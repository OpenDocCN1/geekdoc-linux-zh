    ```

    Monitor v5.78

    Pass 0

    Intel Core Cache 800MHz Test 21s #######

    L1 Cache 64K 1311MB/s Test #1 (Address test, own address)

    L2 Cache 2048K 7843MB/s Testing: 120K - 384M 384M

