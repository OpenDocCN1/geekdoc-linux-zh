    When you tell your email client to send it, it is configured to talk to a specific
    outbound mail server that might be entirely different from the machine it talks
    to when it receives email. This mail server is not required to be listed in DNS
    with an MX record, although that might help it pass spam tests on the remote mail
    server. Essentially the outbound mail server just needs to be listening on some
    incoming port (usually TCP port 25, or possibly port 465 for SMTP over SSL, although
    that''s more rare), it needs to be configured to allow certain hosts (hopefully
    not all) to relay email through it, and it needs to be able to communicate with
    other mail servers on the Internet.


    A few issues can prevent you from sending email. First, your client can''t communicate
    with the outbound mail server. Second, the mail server won''t allow you to relay
    through it. Third, the mail server can''t communicate with the destination mail
    server or the mail server can communicate with the remote mail server, but the
    email is rejected for a number of reasons.


