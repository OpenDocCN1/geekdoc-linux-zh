  md: 'pick the remote mail server with the lowest priority (in this case that

    would be gmail-smtp-in.l.google.com, which has a priority of 5). Once

    it has selected the mail server to contact, it initiates an SMTP connection

    with other port 25.


    For some reason the first server doesn''t respond, mail.example.net

    pick from the remaining list of gmail.com mail servers based on what has

    t lowest priority. If none of the mail servers are available, mail.example.

    net requue the email and try again later. Most mail servers will con-

    t try to deliver an email for a few days before giving up. When the

    mail server gives up, it will send you a bounce letter you know

    that the message was unable to be delivered. This is an important point

    because if all the remote mail servers for a remote domain are unavailable

    (or your mail server network problems of its one and is unable to

    reach them), it may take days before the emails. Generally this is

    a good thing because you want your mail server to keep trying to deliver

    messages, but so many users are accustomed to being deliv-

    ered almost instantaneously, a lag of even an hour might be a problem.


    Let''s assume that the first gmail.com mail server is up. When mail.example.

    net makes its SMTP connection, it tells gmail.com who it is, who is the

    from, and who the email is to. Since the gmail.com mail server isn''t an opennrelay,
    it will only accept email that is destined to be delivered on it (email

    sent to gmail.com and any other domains it is responsible for). Although

    mail.example.net is connected to it, at a minimum it examines the

    email is addressed to and makes sure it is for a domain it accepts. The

    mail server may also check we the email is addressed to and confirm it''s a

    valid account. If either of these checks fail, it will reject the message with

    an error code and mail.example.net will send us a bounce email.


    Spam is a big concern for mail administrators, so the gmail.com mail

    server might perform some extra checks while mail.example.net is con-

    ected. For instance, it might check to see if mail.example.net is listed in

    one of the many spam blackhole lists as a spammer. It might also perform

    a number of other checks against the mail server to make sure it is valid. If

    any of these initial spam checks fail, it will reject the message with an

    code and we will get a bounce email.'
