    # Out of Inodes


    Another less but tricky situation in which you might find yourself is the case
    of a file system that claims it is full, yet when you run df, you see that there
    is more than enough space. If this ever happens to you, the first thing you should
    check is whether you have run out of inodes (an inode is a data structure that
    holds information about a file). When you format a file system, the mkfs tool
    decides at that point the maximum number of inodes to use as a function of the
    size of the partition.


    Each new file that is created on file system gets its own unique inode, and once
    you run out of inodes, no new files can be created. Generally speaking, you never
    get close to that maximum; however, certain servers store millions of files on
    a particular file system, and in those you'
  merge: -1
