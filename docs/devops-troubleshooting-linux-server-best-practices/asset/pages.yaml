  md: '# Find What Is Using Your Bandwidth with iftop


    Sometimes your network is slow not because of some problem on a remote server
    or router, but just because something on the system is using all the available
    bandwidth. It can be tricky to identify what process is using up all the bandwidth,
    but there are some tools you can use to help identify the culprit.


    top is such a great troubleshooting tool that has inspired a number of similar
    tools like iftop to identify what processes are consuming the most disk I/O. It
    turns out there is a tool called iftop that does something similar with network
    connections. Unlike top, iftop doesn''t concern itself with processes but lists
    the connections between your server and a remote IP that are consuming the most
    bandwidth (Figure 5-1). For instance, with iftop you can quickly see if your backup
    job is using up all your bandwidth by seeing the backup server IP address at the
    top of the output.


    iftop is available in a package of the same name as both Red Hat- and Debian-based
    distributions, but in the case of Red Hat-based distributions,


