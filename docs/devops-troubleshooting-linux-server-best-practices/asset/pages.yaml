- img_proc: true
  md: '# DNS Server Troubleshooting


    The last problem we''ll discuss that can cause a DNS change to not take is due
    to zone transfer issues. In your average DNS infrastructure, one DNS server is
    treated as the master for a particular zone and the rest are configured as slaves.
    Any changes are made to the master and then pushed out to any slaves that are
    configured. Zone transfer problems can be tricky to detect immediately because
    your master name server will report the new record; however, any queries to one
    or more slaves may report the old record. As a result, different clients may see
    different IP addresses at different times.


    The fastest way to identify a zone transfer issue is perform a DNS query using
    a tool like dig against all of the name servers configured for a zone. If you
    see that some name servers have the changes and others don''t, wait a minute or
    two and try again to see if the changes still aren''t transferred. After a few
    minutes, the next step is to identify the master DNS server is configured in a
    special record. The master DNS server record called the Start of Authority, SOA,
    record. This record lists what is considered to be the authoritative DNS server
    for the zone and, like with other dig requests for specific record types, simply
    query the domain and SOA to the end of the query:


    ```

    $ dig example.net SOA


    ; << DIG 9.7.0-P1 example.net SOA

    ; global options: +cmd

    ; Got answer:

    ; >>HEADER<< opcode: QUERY, status: NOERROR, id: 62609

    ; flags: qr aa rd ra; QUERY: 1, ANSWER: 1, AUTHORITY: 2, ADDITIONAL: 2


    ;; QUESTION SECTION:

    ;example.net. IN SOA


    ;; ANSWER SECTION:

    ;example.net. 300 IN SOA ns1.example.net. admin.example.net.

    →2011062300 10800 2000 604800 7200

    ```'
  merge: -1
