  md: '# Chapter 6 Why Won''t the Hostnames Resolve? Solving DNS Server Issues


    take. Even if you aren''t responsible for the DNS server, knowing how to troubleshoot
    update problems is a handy skill to have in your arsenal. After all, if you ask
    your administrator to make the change, or if you make the change via some DNS
    hosting service and you keep getting the old record, it is better to know how
    to figure out where the problem is.


    Most DNS update problems fall into three camps: updates you don''t (yet) because
    of DNS caching, updates the DNS server rejects because of syntax errors, and problems
    due to the changes made to the master DNS server making it to its slave hosts.
    This section discusses how to identify each type of problem using the same DNS
    troubleshooting tools we used so far.


    DNS Caching and TTL The fact is that your average DNS record might stay for weeks,
    months, or even years. Because many DNS records are so stagnant, it doesn''t make
    sense for any DNS query to have to follow that same path we covered in the tracing
    section of this chapter. Instead, as a DNS server does a query, it caches its
    results so that if you make the same request afterward, it can return an answer
    more quickly.


    Of course the problem with caching is, how does the DNS server you use know how
    long to cache results? The answer is that each DNS record contains a Time To Live,
    or TTL, value measured in seconds. When you perform a DNS request, the server
    checks its cache, and any results that are newer than their respective TTLs are
    returned to you from the cache, even if they have changed on the host. Once the
    TTL of a record expires, the DNS server goes through its regular steps to resolve
    the IP; however, note that each DNS server queries along the way also has a TTL
    of its own, and if those TTLs haven''t expired, it will just use the IPs in cache.
    This is why you often hear the refrain,"it may take two days to see your change
    in DNS." In particular, the root and top domain name servers have long TTLs, so
    when you register a new domain, it may take some time for those changes to propagate.
    Although your average TTL is a few hours, TTLs can range from as little as a minute
    to multiple days, and depending on the kind of change, it might take quite some
    time for all the related caches to expire.'
