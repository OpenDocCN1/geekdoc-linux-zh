    10.1.2.3 - - [04/Jul/2012:12:04:05 -0700] "GET /HTTP/1.1" 200 303 "curl/7.19.7"
    - (x86_64-pc-linux-gnu) libcurl/7.19.7 OpenSSL/0.9.8 zlib/1.2.33/1.15

    ```


    Alternatively, if you wanted to know how many requests you received from that
    IP, you could pipe the data to wc -1, which will count the number of lines in
    the output:


    ```

    $ grep ''^10.1.2.3'' /var/log/apache2/access.log | wc -1

    37

    ```


    Of course, if your log file contains logs from multiple days, you may be interested
    in the logs from a particular day:


    ```

    $ grep ''^10.1.2.3.*[04/Jul/2012'' /var/log/apache2/access.log

    ```'
