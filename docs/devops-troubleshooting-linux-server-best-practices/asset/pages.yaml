  md: '# Solve Common Web Server Problems


    Although it is difficult to document how to solve any and all web server problems,
    you are likely to run into a few general classes of problems that have identifiable
    symptoms. This section will highlight some of the common types of problems you
    may find, their symptoms, and how to remedy them.


    # Configuration Problems


    One common and relatively simple problem to identify in a web server is a configuration
    problem. Since web servers need to be reloaded to take on changes in their configuration,
    it can be tempting to make many changes without reloading the web server; however,
    if you do so, you are likely to find out during a server maintenance (or when
    you need to restart the server to load new SSL certificates) that there''s some
    syntax error in your configuration files and your server will refuse to start.


    Both Apache and Nginx validate their configuration files when you start, restart,
    or reload the service, so that one one way to find configuration errors—unfortunately,
    it also means that in the case of a problem, the server is down while you fix
    the errors. Fortunately, both web servers provide means to test configuration
    syntax and highlight any syntax errors while the server is still running.


    In the case of Apache, the command is apache2ctl config. Be sure to run this command
    as a user who can read all of the configuration files (prob-root user). A successful
    run looks like this:


    ```

    $ sudo apache2ctl config

    Syntax OK

    ```


    When there is a syntax error, this command will identify the file and number of
    the error so it''s easy to find:


    ```

    $ sudo apache2ctl config

    apache2: Syntax error on line 233 of /etc/apache2/apache2.conf: Could not open
    configuration

    → file /etc/apache2/conf/: No such file or directory

    ```'
  merge: -1
  pgno: 185
- img_proc: true
  md: 'In this case, the configuration file had a typo—the directory you wanted to
    include was /etc/apache2/conf.d.


    Nginx also provides a syntax check by running nginx -t:


    ```

    $ sudo nginx -t

    t configuration file /etc/nginx/nginx.conf syntax is ok

    configuration file /etc/nginx/nginx.conf test is successful

    ```


    As Apache, when Nginx detects an error, it tells you the file and line number:


    ```

    $ sudo nginx -t

    [emerg]: unknown directive "included" in /etc/nginx/nginx.conf:13

    configuration file /etc/nginx/nginx.conf test failed

    ```


    # Permissions Problems


    A common headache, especially for new web server administrators, is per-mission
    problems on the web server. Although both Apache and Nginx''s initial processes
    run as root, all subprocesses that actually do the work of serving content run
    as a user with more restricted permissions—usually a user like www-data or apache.
    If you are, for instance, uploading web pages as a different user, you may initially
    run into permissions problems until you make sure that each file you want to serve
    is readable by the www-data or apache user.


    What does a permissions problem look like from the outside? This example takes
    a basic Nginx setup and changes the permissions on the main index.html file so
    that it is no longer readable by them. Then it uses curl to attempt to load the
    page:


    ```

    $ curl http://localhost/

    <html>

    <head><title>403 Forbidden</title></head>

    <body bgcolor="white">

    <center><h1>403 Forbidden</h1></center>

    <hr><center>nginx/0.7.65</center>

    </body>

    </html>

    ```'
