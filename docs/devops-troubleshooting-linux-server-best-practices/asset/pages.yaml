    # Filtering Tcpdump Output Since by default tcpdump captures all of the packets
    it sees, it usually bombards you with a lot of noise that doesn''t help with your
    troubleshooting. What you want to do is pass tcpdump some filtering rules so it
    only shows packets that you are interested in. For instance, if you were troubleshooting
    problems between your host and a server with a hostname of web1, you could tell
    tcpdump to only show packets from or to that web


    ```

    $ sudo tcpdump -n host web1

    ```


    If you wanted to do the opposite, that is, show all traffic except anything from
    web1, you would say


    ```

    $ sudo tcpdump -n not host web1

    ```


    You can also filter traffic to and from specific ports. For instance, if you wanted
    to just see DNS traffic (port 53) you would type


    ```

    $ sudo tcpdump -n port 53

    ```


    If you wanted to capture all of your web traffic on either port 80 or port 443,
    you would type


    ```

    $ sudo tcpdump -n port 80 or port 443

    ```


    You can actually get rather sophisticated with tcpdump filters, but it''s easier
    to just capture a certain level of tcpdump output to a file and then use grep
    or other tools to filter it further. To save tcpdump output to a file, you can
    use a command-line redirect:


    ```

    $ sudo tcpdump -n host web1 > outputfile

    ```'
  merge: -1
  pgno: 108
- img_proc: true
  md: '# Packet Captures 87


    If you want to view the packets on the command line while they are being saved
    to a file, add the -l option to tcpdump so it buffers the output, and then use
    tee to both display the output and save it to a file:


    ```

    $ sudo tcpdump -n -1 host web | tee outputfile

    ```


    **Raw Packet Dumps** Although you might think that tcpdump already provides plenty
    of difficult-to-parse output, sometimes all that output isn''t enough—you want
    to save complete raw packets. Raw packets are particularly useful since they contain
    absolutely all of the information about communication between hosts, and a number
    of tools (such as Wireshark, which we''ll discuss momentarily) can take these
    raw packet dumps as input and display them in a much-easier-to-understand way.


    The simplest way to save raw packet dumps is to run tcpdump with the -w option:


    ```

    $ sudo tcpdump -w output.pcap

    ```


    Like other tcpdump commands, hit Ctrl-C to stop capturing packets. You can also
    use all of the same filtering options we''ve discussed so far when capturing raw
    packets. With raw packet dumps, you are getting the complete contents of the packets
    as best as tcpdump and your disk can keep up. So if someone is transferring a
    1GB file from your server, you might just capture the whole file in your packet
    dump. You may want to open up a second command-line session just so you can keep
    an eye on the size of the output file.


    tcpdump provides a few options you can use to manage the size of output files.
    The first option, -C, lets you specify the maximum size of the output file (in
    millions of bytes) before it moves on to a second one. So, for instance, if you
    wanted to rotate files after they grow past ten megabytes, you can type


    ```

    $ sudo tcpdump -C 10 -w output.pcap

    ```'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# Chapter 5 Is the Server Down? Tracking Down the Source of Network Problems


    The first output file will be named output.pcap.1, and once it gets to megabytes,
    tcpdump will close and start writing to output.pcap.2, and so on, until you kill
    tcpdump or you run out of disk space. If you want to be sure that you won''t run
    out of disk space, you can also add the -W option, which lets limit the number
    of files tcpdump will ultimately create. Once tcpdump reaches the last file, it
    will start from the beginning and overwrite the first file in the set. So, for
    instance, if you want tcpdump to rotate to a new file after ten megabytes and
    want to make sure tcpdump only fifty megabytes of disk space, you could limit
    it to five rotated files:


    ```

    sudo tcpdump -C 10 -W 5 -output.pcap

    ```


    Once you have these packet captures, you can use tcpdump to replay them as though
    they were happening in real time with the -r option. Just specify your raw packet
    output file as an argument. You can specify filters and other options like -n
    just if you were running tcpdump against a live stream of traffic:


    ```

    sudo tcpdump -n -r output.pcap

    ```


    The tcpdump program is full of useful options and filters beyond what I''ve mentioned
    here. The man page (type man tcpdump) not only goes over all of these options
    and filters, but also provides a nice primer on TCP packet construction, so it''s
    worth looking through if you want to go deeper into tcpdump''s abilities.


    # Use Wireshark


    Although tcpdump is a handy tool for packet capture, when you actually need to
    parse through and analyze raw packets, the -r option sometimes doesn''t cut it.
    Luckily some tools make the process simpler. One of the best tools for raw packet
    analysis is Wireshark. It is a desktop application that provides a lot of sophisticated
    tools for packet analysis that are way beyond the scope of this book. At a basic
    level, though, Wireshark provides you with a much easier way to view your raw
    packet dumps and pinpoint obvious problems.'
  merge: -1
  pgno: 110
- img_proc: true
  md: '# Packet Captures 89


