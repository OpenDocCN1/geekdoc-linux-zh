  md: '# Understand Email Headers 123


    If the email makes it through all of these checks, the gmail.com mail server will
    send a success response to mail.example.net, disconnect from it, and then add
    the email to the queue for delivery. Of course at this point mail servers will
    also run additional spam filtering on the message based on the body, but if it
    does flag the message as spam, it won''t send a bounce message or otherwise notify
    mail.example.net at all. From the perspective of mail.example.net the mail was
    delivered successfully.


    If the mail server that accepted the message is not the primary mail server with
    the lowest priority, it will add the email to the spool and attempt to deliver
    it to the primary mail server for the next few days. After that point, if it is
    unable to deliver, it will remove the email and send a bounce message. Once the
    email is successfully on the primary mail server, it will either deliver the email
    to a local mailbox if it also acts as the POP and IMAP server, or it will be configured
    to forward the messages to a different mail server where it will ultimately end
    up in your inbox.


    # Understand Email Headers


    Now that we''ve traced an email through the system, the headers in an email make
    a lot more sense. By default when you view email, a lot of the headers are left
    out and you are left with To, From, Subject, and the body of the message. There
    are extra headers at the top of the email that provide valuable troubleshooting
    data specifically related to how the email got from the sender to the recipient.
    Although most mail clients hide these headers by default, there should be an option
    to view the hidden headers in your mail client. For instance, in Gmail, the option
    appears in a dropdown menu when you view the message and is named Show Original.


    As an example, we could send a test email from kyle@example.net to a Gmail account,
    you@gmail.com, to simulate the email tracing mentioned earlier. In a normal mail
    client, here is what you might see:


    ```

    Date: 11 Apr 2012 19:55:43 -0700

    From: Kyle Rankin <kyle@example.net>

    To: you@gmail.com

    Subject: Test Subject

    ```


    Test Body'
