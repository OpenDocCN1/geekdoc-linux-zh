  md: "# Trace an Email Request 121\n\nsent is still pretty much the same, when you\
    \ trace an email, you'll want\nbase it on a simple, average case.\n\nFor this\
    \ example, let's assume that we want to send an email from our\ncorporate email\
    \ account, kyle@example.net, using some desktop email client\nlike Thunderbird\
    \ or Outlook, and let's assume this is all hosted on a\nmail server called mail.example.net\
    \ controlled by the company. We want\nto send the email to our personal Gmail\
    \ account, you@gmail.com, and\nsince we don't know the inner workings of Google's\
    \ mail servers, we will\ntreat the mail servers as a normal mail server on the\
    \ Internet.\n\nFirst, when we click Send, our email client communicates with the\
    \ outbound mail server it is configured to use over SMTP. In this case, it would\n\
    likely be a local mail server inside the office and when using IMAP it may even\
    \ be the sameachine we use to retrieve email over (but it doesn't have to be).\n\
    This outbound mail server (here called mail.example.net) should be configured\
    \ to allow us to relay email through it. Mail servers that allow anyone\nrelay\
    \ mail through them are called open relays, and ever spammers started finding\
    \ and using open relays to send spam, most mail servers\nrestrict who can relay\
    \ mail through them. Some servers restrict this based on IP address whereas others\
    \ require the client to authenticate with login\npassword first.\n\nOnce mail.example.net\
    \ accepts my email, it puts it in the mail spool\n any other email that needs\
    \ to be delivered. When it is ready to send\nthe message, it scans the FROM address\
    \ for the destination domain in\nthis case gmail.com). Then it performs a DNS\
    \ query to find out of all\nMX records for gmail.com (similar to dig gmail.com\
    \ MX) and gets back results\nlike the following:\n\n```\n5 mail-smtp-in.1.google.com.\n\
    10 alt1.gmail-smtp-in.1.google.com.\n20 alt2.gmail-smtp-in.1.google.com.\n30 alt3.gmail-smtp-in.1.google.com.\n\
    40 alt4.gmail-smtp-in.1.google.com.\n```\n\nIn this case, there are five different\
    \ mail servers to choose from and each\nmail server has a priority assigned to\
    \ it. The mail.example.net server will"
