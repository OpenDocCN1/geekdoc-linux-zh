  md: '# Troubleshoot High Load after the Fact


    NOTE You will probably run iostat one time to get an accurate sense of the current
    I/O on your system. If you specify a number on the command line as an argument
    iostat will continue to run and give you new output after many seconds. For instance,
    if you wanted to see iostat output every 2 seconds, you could type sudo iostat
    2. Another useful argument to iostat if you have any NFS shares is -n. When you
    specify -n, iostat will give you I/O statistics about all of your NFS shares.


    In addition to iostat, we have a much simpler tool available in名为 iotop. In effect,
    it is a blend of top and iostat in that it shows you all the running processes
    on the system sorted by their I/O statistics. The software uses a somewhat new
    feature of the Linux kernel and requires the 2.6.20 kernel or later. If the program
    is not installed by default, you will find it in the aptly named iotop package.
    It is included in Debian-based distributions, but for Red Hat-based distributions,
    you will need to track down and install a third-party RPM from the web or via
    a third-party repository. Once the package is installed, you can run iotop and
    see the following:


    ```

    $ sudoop

