    The output from the web page tells us the HTTP error event without having to tell
    curl to display it: a 403 Forbidden error. Unfortunately, although we can see
    the page is forbidden, from this output, we''re not sure why. At this point, we
    turn to the Nginx error logs and see


    ```

    2012/07/07 16:13:37 [error] 547*: =2 open() "/var/www/nginx-default/index.html"
    failed

    --(13: Permission denied), client: 127.0.0.1, server: localhost, request: "GET
    /

    --HTTP/1.1", host: "localhost"

    ```


    This error lets us know that Nginx attempted to open /var/www/nginx-default/index.html,
    but permission was denied. At this point, we could check out the permissions of
    the file and confirm that it wasn''t readable by the www-data user Nginx runs
    as:


    ```

    $ ls -l /var/www/nginx-default/index.html

    -rw-r-- 1 root 151 2006-08-30 03:39 00:00 nginx: master process /usr/sbin/nginx

    www-data 545 545 00:00 nginx: worker process

    ```


    In this case, you could fix this permission problem with the chmod o+r command,
    which would add read permissions to the file. Alternatively, you could also change
    the group ownership of the file so it was owned by the www-data group (or by a
    group that was member of).


    Although some administrators sidestep permissions problems by making all files
    readable and writable by everyone, the security risks of doing so aren''t worth
    the easy fix. Instead, creating a group on the system whose membership includes
    both www-data and apache users (depending on what user your web server runs as)
    and the users you upload files as. If you do try the "chmod 777" method of making
    the file readable by everyone, use it only as a sanity check to confirm that the
    problem truly is a permissions issue. Be sure after you have solved the problem
    to change permissions back to something more secure.'
