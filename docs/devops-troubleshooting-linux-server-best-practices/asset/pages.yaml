  md: '# Chapter 6 Why Won''t the Hostnames Resolve? Solving DNS Server Issues


    In this case, you are being warned that the serial number did not change even
    though the zone did. If you see a message like this, simply re-edit your zone
    file and make sure the serial number is incremented (many DNS administrators use
    the YYYYMMDD format followed by two more numbers to allow them to update a zone
    up to 100 times in a day while letting them easily the last time the zone was
    updated). If the notify out and the serial number is larger than what is on the
    slaves, you should see entries like the following in the log file on your master:


    ```

    Mar 27 21:47:16 nsl named[25967]: client 10.1.1.4#338239: transfer of ''example.net/IN:

    →AXFR-style IXFR started

    Mar 27 21:47:16 nsl named[25967]: client 10.1.1.4#338239: transfer of ''example.net/IN:

    →AXFR-style IXFR ended

    ```


    You see here that the transfer for the zone that was changed by the client 10.1.1.4
    and then ended. You should see an entry like for each name server configured for
    this zone, and if you don''t, while you are on the master, make sure that all
    of the name servers that need updates are either configured in the zone itself
    with their own NS entry or in your named.conf file in the also-notify directive
    (if configured).


    If the logs and configuration on the master seem correct but you don''t see that
    a zone transfer was initiated, the next step is to go to a slave name server.
    You should be able to see entries in the /var/log/syslog or /var/log/messages
    file on the slave name server that received a notify that a zone has changed:


    ```

    Mar 27 21:58:44 ns2 named[22774]: client 10.1.1.3#50946: view external: received
    notify for

    →zone ''example.net''

    Mar 27 21:58:44 ns2 named[22774]: zone example.net/IN/external: Transfer started.

    Mar 27 21:58:44 ns2 named[22774]: transfer of ''example.net/IN/external'' from
    10.1.1.3#53: connected

    using 10.1.1.3#38239

    Mar 27 21:58:44 ns2 named[22774]: zone example.net/IN/external: transferred serial

    →2012032700

    Mar 27 21:58:44 ns2 named[22774]: transfer of ''example.net/IN'' from 10.1.1.3#53:
    end of

    →transfer

    ```'
