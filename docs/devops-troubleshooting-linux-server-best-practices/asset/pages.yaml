    Then again, if you see a scoreboard like the one shown earlier, notice

    that your web server seems quite responsive, it could be that each web

    request is having to wait on something on the back end. Behavior like

    is can happen when an application server is overloaded with waiting

    requests (sometimes because, ultimately, the database server it depends on

    is overloaded), so although all the web server processes are busy, adding

    more wouldn''t necessarily help the issue—they would also still be waiting

    off the back end to respond.'
