  md: '# Chapter 2 Why is the Server So Slow? Running Out of CPU, RAM, and Disk I/O


    If you wanted to store that information into a file named top_output,


    ```

    $ top -b -n 1 > top_output

    ```


    If you wanted to view the top output and output to a file at the same time,

    you could use the handy command-line tool like:


    ```

    $ top -b -n 1 | top_output

    ```


    # Make Sense of top Output


    When you use to diagnose load, the basic steps are to examine the top

    output to identify what resources are running out of (CPU, RAM, disk

    I/O). Once you have figured out that, you can try to identify what pro-

    cess are consuming the most resources. First, let''s examine some

    standard output from a system:


    ```

    top - 14:08:25 38 days, 8:02, 1 user, load average: 1.70, 1.77, 1.68

