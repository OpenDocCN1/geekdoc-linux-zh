    ```


    From this log you could see if there were any emails from that domain at all during
    the general time period Jan laid out. If this point you still don''t see anything
    in the logs, feel confident going back to Jan and saying you simply don''t see
    the email attempt and to have the sender send it again. Ultimately you might end
    up working with the administrator in charge of the remote site and compare log
    entries. It all might depend on how important these emails are. Even if the problem
    doesn''t appear to be on your end, you might still be on the hook to track down
    the root cause of the problem, even if it''s another administrator''s fault.'
