- img_proc: true
  md: 'OF ALL THE THINGS that can go wrong with a Linux system, one of the most stressful
    might be a system that won''t boot. After all, if you can''t boot a system, it
    means any services it provides are completely down until you can fix it. What''s
    more, any data you need to retrieve might depend on your ability to get the system
    back up and running.


    It turns out a number of different problems can prevent a system from booting.
    To best troubleshoot why your computer won''t boot, this chapter will first describe
    the boot process. Once you can observe your own system and see at what point in
    the process it gets stuck. After describing the boot process, this chapter will
    highlight each major class of problem along with how to diagnose and fix it.


    Troubleshooting boot issues is a domain traditionally for sysadmins; however,
    any member of a DevOps team might be responsible for keeping packages on a system
    up to date. When a kernel or distribution update goes badly, it''s good to have
    all the skills you need to bring the system back up yourself.


    # The Linux Boot Process


    Chapter 1 mentioned that if you want to be good at troubleshooting, it''s important
    that you understand how systems work. That philosophy definitely applies to troubleshooting
    boot problems, especially since they can have so many different causes.


    # The BIOS


    The very first system involved in the boot process is the BIOS (Basic Input Output
    System). This is the first screen you will see when you boot, and although the
    look varies from system to system, the BIOS initializes your hardware, including
    detecting hard drives, USB disks, CD-ROMs, network cards, and any other hardware
    it can boot. The BIOS will then step-by-step through each boot device based on
    the boot device order it is configured to follow until it finds one it can successfully
    boot from. In the case of a Linux server, that usually means reading the MBR (master
    boot'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'record: the first 512 bytes on a hard drive) and loading and executing the
    boot code inside the MBR to start the boot process.


    # GRUB and Linux Boot Loaders


    After the BIOS initializes the hardware and finds the first device to boot, the
    boot loader takes over. On a normal Linux server this will be the GRUB program,
    although in the past a different program called LILO was used. GRUB is normally
    what is used when you boot from a hard drive, while systems that boot from USB,
