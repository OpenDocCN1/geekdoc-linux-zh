    This is a server that has many processes to spare, both ones that are loaded into
    RAM and ones that are waiting to be loaded. If your server is sluggish but your
    scoreboard looks like this, then you are going to need to dig into your web server
    logs and try to identify which pages are currently being loaded. Ultimately you
    will want to identify which pages on your site are taking so long to respond,
    and then you''ll need to dig into that software to try to find the root cause.
