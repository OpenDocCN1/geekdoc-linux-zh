  md: '# Preface


    DevOps describes a world where developers, Quality Assurance (QA) and systems
    administrators work more closely together than in many traditional environments.
    Although DevOps is already recognized as a boon to rapid software deployment and
    automation, an often-overlooked benefit of DevOps is the rapid problem solving
    that the whole team can collaborate to troubleshoot a problem on a system. Unfortunately,
    developers, QA, and sysadmins have gaps in their troubleshooting skills that they
    often resolve by blaming each other for problems on the system. This book aims
    to bridge those gaps and guide all groups through a standard set of troubleshooting
    practices that they can apply as a team to some of the most common Linux server
    problems.


    Although the overall topics covered in the book are traditionally the domain of
    sysadmin, in a DevOps environment, developers and QA also find themselves troubleshooting
    network problems, setting up web servers, and diagnosing high load, even if they
    may not have a background in Linux administration. What makes this book more than
    just a sysadmin troubleshooting guide is the audience and focus. This book assumes
    the reader may not be a Linux sysadmin, but instead is a talented developer or
    QA engineer in a DevOps organization who may not have much Linux experience. That
    said, if you are a sysadmin, you will not be left out either. Included are troubleshooting
    techniques that can supplement the skills of even senior sysadmin—written in an
    accessible way.


    In a traditional enterprise environment where DevOps principles, troubleshooting
    is dysfunctional as development. When there is a server problem, if you can get
    developers and sysadmin on the same call, you can expect everyone to fall into
    their traditional roles—the sysadmin will only look at server resources and logs;
    the developers will wait for'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'the inevitable blame to be heaped on them for their “bloated” or “buggy” code,
    at which point they will complain about the unstable, underpowered server; or
    maybe everyone will redirect the blame at QA for not finding the problem before
    it hit production. All the while, the actual problem is not any closer to being
    solved.


    In a DevOps organization, cooperation between all the teams is stressed, but when
    it comes to troubleshooting, often people still fall into their traditional roles
    even if there’s no blame game. Why? Well, if everyone wants to work together,
    without the same troubleshooting skills and techniques, everyone may still be
    waiting on everyone else to troubleshoot their part. The goal of this book is
    to get every member of DevOps team on the same page when it comes to Linux troubleshooting.
    When everyone has the same Linux troubleshooting skills, the QA team will be able
    to diagnose problems before they hit production, developers will be better at
    tracking down why that latest check-in doubled the load on the system, and sysadmins
    can be more confident in their diagnoses, or when a problem strikes, everyone
    can pin it to.


    This book is broken into ten chapters based on some of the common problems you’ll
    face on Linux systems, and the chapters are ordered so that techniques you learn
    in some of the earlier chapters (particularly about how to diagnose high load
    and how to troubleshoot network problems) can be helpful as you get further into
    the book. That said, I realize you may not read this book cover-to-cover, but
    instead you will probably just turn to the chapter that’s relevant to your particular
    problem. So topics in other chapters are helpful, I will point you to.


    +   - Chapter 1: Troubleshooting Best Practices Before you learn how to troubleshoot
    specific problems, it may best to learn an overall approach to troubleshooting
    that you can apply to just any about problem, even outside of Linux systems. This
    chapter talks about general troubleshooting principles that you will use when
    you specific troubleshooting steps throughout the rest of the book.


    +   - Chapter 2: Why Is the Server So Slow? Running Out of CPU, RAM, and Disk
    I/O This chapter introduces troubleshooting principles that you will apply to
    one of the most common problems you’ll'
  merge: -1
  pgno: 14
