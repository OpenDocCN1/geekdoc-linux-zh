- img_proc: true
  md: '# Problems Receiving Email 139


    After you''ve convinced the mail server was functioning around that time, next
    you''d attempt to filter out all of Jan''s incoming mail out of the mail log today
    into a different file so it can be a bit easier to pore through:


    ```

    $ grep ''to=@example.net'' /var/log/mail.log > /tmp/jans_incoming_emails

    ```


    If Jan had told you that the email was sent a few days ago instead of today, you
    would replace /var/log/mail.log with the archived mail log that has entries for
    that day. In either case, you can open /tmp/jans_incoming_emails with a text editor
    and see first, if Jan got any other messages, and second, what kind of messages
    she got around 8:00 a.m. If you wanted to get fancy, you could run another grep
    that filtered messages out of a time range, but just to be safe look messages
    from an hour before and an hour after 8:00 a.m. at least. In the process of going
    through this file if you find any that fits that period, you''ll need to pull
