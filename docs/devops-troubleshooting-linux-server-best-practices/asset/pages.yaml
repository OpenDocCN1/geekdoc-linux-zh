- img_proc: true
  md: '# Chapter 2 Why Is the Server Slow? Running Out of CPU, RAM, and Disk I/O


    you can rule disk I/O. If I/O wait is low, then you can look at the idle percentage.
    If I/O wait is high, the next step is to diagnose what is causing high I/O, which
    I will monitor momentarily. If I/O wait and idle times are low, then you will
    likely see a high user percentage, so you must diagnose what is causing high user
    time. If the I/O wait is low and the idle percentage is high, then you know that
    sluggishness is not because of CPU resources, and you will have to start troubleshooting
    elsewhere. This might mean looking for network problems, or in the case of a web
    server, looking at queries to MySQL, for instance.


    # Diagnose High User Time


    A common and relatively simple problem to diagnose is high load due to a high
    percentage of user CPU time. This is common since the services on your server
    are likely to take the bulk of the system load and they are user processes. If
    you see user CPU time but low I/O wait times, you simply need to identify which
    processes on the system are consuming the most CPU. By default, top will sort
    all of the processes by their CPU:


    | PID USER | PR VIRT SHR S %CPU %MEM | TIME+ COMMAND |

    | 9463 mysql | 16 0 6866 111m 3328 S | 53 5.5 | 569:17.64 mysql |

    | 18749 nagios | 1 0 1460 1868 S | 12 6.6 | 1345:01 nagios2db_status |

    | 24636 nagios | 17 0 34660 712 S | 8 0.5 | 1195:15 nagios |

    | 22442 nagios | 24 0 6048 2024 1452 S | 8 0.1 | 00:00:04 check_time_pl |


    In this example, the mysql process is consuming 53% of the CPU and the nagios2db_status
    process is consuming 12%. Note that the percentage of a single CPU, if you have
    a four-CPU machine, you could possibly see more than one process consuming 99%
    CPU.


    The most common high-CPU load situations you will see are all of the CPUs being
    consumed either by one or two processes or by a large number of processes. Either
    case is easy to identify since in the first case process or two have a very high
    percentage of CPU and the rest will be relatively low. In that case, to solve
    the issue you could simply kill the process that is using the CPU (hit K and then
    type in the PID number for the process).'
  merge: -1
