    The System V init process is defined by different system states known as runlevels.
    Runlevels are labeled by numbers ranging from 0 to 6, and each number can potentially
    represent a completely different system state. For instance, runlevel 0 is reserved
    for a halted system state. When you enter runlevel 0, the system shuts down all
    running processes, unmount all files, and powers off. Likewise, runlevel 6 is
    reserved for rebooting the machine. Runlevel 1 is reserved for single-user mode—a
    state where a single user can log in to the system. Generally, few processes are
    started in single-user mode, so it is a very useful runlevel for diagnostics when
    a system won''t fully boot. In the default GRUB menu you will notice a recovery
    mode option that boots into runlevel 1.


    Runlevels 2 through 5 are left for the distribution, and finally, to define. The
    idea behind having many runlevels is to allow you to create different modes the
    server could enter. Traditionally a number of Linux distributions set one runlevel
    for a graphical desktop (in Red Hat, this was runlevel 5) and another runlevel
    for a system with no graphics (Red Hat used runlevel 3 for this). You could define
    other runlevels too—for instance, one that starts up a system without network
    access. When you boot, you could pass an argument to the boot prompt to override
    the default runlevel with the of your choice. Once the system is booted, you can
    also change the current runlevel with the init command followed by the runlevel.
    So, to change to single-user mode, you might type sudo init 1.


    In addition to /etc/inittab, a number of other important files and directories
    for a System V init system organize start-up and shutdown scripts, init scripts,
    for all of the major services on the system:


    +   - /etc/init.d


    This directory contains all of the start-up scripts for every service at runlevel.
    Typically these are standard shell scripts, and they conform to a basic standard.
