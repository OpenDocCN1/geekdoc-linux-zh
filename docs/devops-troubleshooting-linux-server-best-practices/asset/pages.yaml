    Here you can see the number of total transactions per second (tps) plus how many
    of those transactions were reads and writes (rtps and wps, respectively). The
    bread/s column doesn''t measure read I/O, it tells you the average number of bytes
    read per second. Similarly, the bwrtn/s tells you bytes written per second.


    There are tons of individual arguments you can pass to sar to output specific
    sets of data, but sometimes you just want to see everything at once. For that,
    use the -A option. That will output all of the statistics from load average, CPU
    load, RAM, disk I/O, network I/O, and all sorts of interesting statistics. This
    can give you a good idea of what sorts of statistics can output, so you can read
    the sar manual (type man sar) to see what flags to pass to sar to see particular
    statistics.'
