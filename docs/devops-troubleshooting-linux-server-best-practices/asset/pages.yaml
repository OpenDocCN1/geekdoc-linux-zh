    # High Server Load


    Before we get into database-specific steps, if you are trying to troubleshoot
    a slow database server that has high load, particularly if that server does more
    than just run database software, check out the tips in Chapter 2 for how to diagnose
    the cause of high load. The steps in that chapter should not only help you determine
    whether'
  merge: -1
  pgno: 195
- img_proc: true
  md: '# Chapter 9 Why Is the Database Slow? Tracking Down Database Problems


    database is the real cause of the load, but also help you figure out whether the
    load is CPU-, RAM-, or IO-bound.


    If a database is generating high CPU-bound load, then you might be facing a bad
    query that is using much more processing than it should; if this is the case,
    you''ll start tracking down slow queries, which are covered later in this chapter.
    If your load is RAM-bound, then you will want to tune your database to take on
    fewer simultaneous queries or attempt to locate particularly expensive SQL queries
    that tie up RAM (or stop your database on your RAM disk). If the load is IO-bound,
    then use iot to identify which specific process, and sysstat to locate storage,
    is getting hit the most. Of course, in all of these cases, you may just need to
    upgrade your hardware or add another server to your cluster.


    # Is the Database Running?


    One of the very first things you will want to check if the database is running
    and listening on the right port. Although you can test whether the port is available
    remotely, the best way to truly test whether the database process is running and
    listening on the right port is from the server itself. That said, refer to Chapter
    5 for more information on how to perform network troubleshooting if you suspect
    a network issue may prevent you from connecting to your database. Both MySQL and
    PostgreSQL have quite different sets of processes, and they both listen on different
    ports.


    # MySQL


    There are a few different ways to test whether MySQL is running. First, you can
    use its init script as it supports the status command. The benefit is that you
    don''t really need to know what the name of the process is, just the name of the
    init script located in /etc/rc.d/init.d/ or /etc/init.d/. In the case of a Debian-based
    system, the service is called mysql, so you can pull the status with


    ```

    $ sudo service mysql status

    mysql start/running, process 735

    ```'
