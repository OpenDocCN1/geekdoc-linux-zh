  md: 'The extended-status command will give you all of the information from the status
    command plus a huge number of other metrics that you can use to help build a baseline
    for your database so that you can see when things fall outside of the norm.


    # PostgreSQL


    PostgreSQL collects and lists performance statistics in a much different way than
    MySQL. You first need to edit your postgresql.conf file (for example, on an Ubuntu
    system, this is located at /etc/postgresql/8.4/main/) and make sure that the track_activities
    and track_counts options are set to on. They likely default to on, but if you
    need to change these variables, you will need to restart PostgreSQL afterward
    for the changes to effect.


    Once statistics collection is enabled, the data will be stored in special tables
    in the database. Unlike MySQL, you will use SQL commands to pull this data out
    of those tables. The complete list of statistics tables is documented in the official
    PostgreSQL documentation, but the following sections will list a few of the particularly
    useful tables. First though, be sure to become the postgres user (or another user
    who has superuser permissions on the database) so you can run your queries:


    ```

    # su - postgres

    $ psql

    pgsql (8.4,12)

    Type "help" for help.

    ```


    **pg_stat_activity** The pg_stat_activity table displays information about each
    currently running server process including which database it is accessing, which
    system process it uses, which user is accessing it, the current query, and data
    about how long the query has been running. This table is particularly valuable
    when you know a particular database process is using a lot of CPU time and you
    want to know what query it is'
