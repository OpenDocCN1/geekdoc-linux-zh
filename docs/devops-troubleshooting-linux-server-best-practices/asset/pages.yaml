    # Test a Web Server from the Command Line


    Once you are convinced that the web server is actually listening on the correct
    port, the next troubleshooting step is to confirm that the web server actually
    responds to requests. Although it''s true that you can use a web browser to test
    this, if you know how to troubleshoot a web server with a command-line tool like
    curl or telnet, you can test your web server from just any host (and more importantly,
    over an ssh connection). After all, most servers don''t have a GUI web browser
    installed, and you may not be able to guarantee that command-line tools like curl,
    links, or w3m are installed, but telnet almost certainly will be. Because of this,
    this chapter will show you how to test your web server both with curl and telnet
    as a fallback.


    # Test Web Servers with Curl


    Curl is a relatively straightforward command-line tool that can speak the HTTP
    and HTTPS protocols, among others. If you check out its man page (by typing curl
    on the command line), you''ll see that it supports all sorts of different options.
    In fact, a number of command-line tools used to interface with web APIs use curl
    exclusively. Curl has an advantage over telnet for web server troubleshooting
    in that it takes care of the HTTP protocol for you and makes things like testing
    authentication, posting data, using SSL, and other functions we take for granted
    in a GUI web browser much easier. With telnet, we will be typing in HTTP commands
    directly.'
