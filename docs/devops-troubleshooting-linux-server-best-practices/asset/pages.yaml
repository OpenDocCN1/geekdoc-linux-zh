    tions. First, the request came from the IP 10.1.2.3. Second, we can identify a
    date stamp for the request. After that, we can see the exact HTTP request processed
    (GET / HTTP/1.1) and the following 200 in the log corresponds to the HTTP return
    code. Finally, and at the end of the log is the User-Agent string the client passed
    to the server; in this case, it identifies the client.


    NOTE If you are a user like me, you probably use to open just about any text file
    including log files. Unfortunately, we likes to store a complete copy of any text
    file into temp space (sometimes /tmp, other times in the user''s home directory).
    Although this practice is fine for small text files, web server logs can grow
    to gigabytes in size. I can''t tell how many times I went to troubleshoot a web
    server that ran out of disk space only to find someone had opened up a multi-gigabyte
    web log file and filled the /tmp directory. Since we didn''t want to edit the
    web logs anyway—we just want to view them—use a command-line tool like less to
    view logs instead of it.


    Each web server allows you to customize your log output so you can get even more
    information about each request, the default log format configured in Apache configuration
    files looks like this:


    ```

    LogFormat "%h %l %u \%r" %s %b "%{Referer}i" "%{User-Agent}i" combined

    ```


    Each of the symbols preceded by % represents some value to store in the logs.
    The complete list of these options is in the Apache documentation, but here is
    the description of each of these strings:


    +   %h The remote host (hostname or IP)

    - %l The remote logname (usually returns - unless IdentCheck is on)

    - %u The remote user (if the page required authentication, otherwise returns -)

    - %t The time the request was received'
