- img_proc: true
  md: 'ALTHOUGH DNS AND EMAIL are important Internet services that we interact on
    a daily basis, web services tend to get much more of our direct attention. You
    may or may not immediately notice when someone''s email server or DNS server is
    down, but if your favorite website is down, you will know almost instantly. Many
    applications have moved from being run on local systems to being run on a web
    server accessed from your web browser instead. With so much riding on the health
    of web servers, you are likely to be responsible for one in some way, and it''s
    more important than ever to be able to troubleshoot web problems.


    Everyone in a DevOps organization is likely to troubleshoot web server problems
    at some point in time. On the QA side, many of the automated testing and build
    tools you use on a daily basis via a web front-end, not to mention in this day
    and that it''s likely you performing some level of automated testing on a web-based
    application. When a web server is unresponsive, you''ll want the tools to trace
    down why. Of the developer end, it''s more likely than ever that you will be developing
    software that has at least some level of front-end, if not already entirely from
    the web. Plus, in a DevOps team, developers often take on more of a role in web
    server configuration than traditional teams, and they hold more responsibility
    over troubleshooting sluggish or unavailable web servers. Of course, if you are
    a sysadmin, it''s quite likely you will be responsible for at least some web servers
    in your environment, and you will likely be one of the first people to answer
    that dreadful question: "Is the website down?”


    In a chapter about web server troubleshooting, it is easy to get bogged down in
    troubleshooting steps for particular frameworks, content management systems, plugins,
    or blogging platforms that would turn this chapter into a full book in its own
    right and still not necessarily help you with your custom web app. Instead, this
    chapter will provide general, basic troubleshooting steps you can apply to the
    health of two popular web servers: Apache and Nginx. The idea here is to give
    you overall tools and techniques you can apply to most web server problems so
    that no matter what specific web server software you run, there is a problem,
    you can get closer to narrowing it down.'
  merge: -1
  pgno: 164
- img_proc: true
  md: '# Is the Server Running?


    One of the first web server problems to troubleshoot is a web server that''s completely
    unavailable. This is such common set of troubleshooting steps that it was already
    used as the primary example throughout Chapter 5 to diagnose networking issues.
    After all, one of the first questions you want to answer when you cant reach a
    web server is whether the problem is on your end or the remote end. For a complete
    set of troubleshooting steps, I highly recommend you go through Chapter 5 first;
    however, this chapter assumes that the problem is not on the network, so it will
    repeat some of the web-server specific troubleshooting steps from Chapter 5. In
    this example, the server is named web1 and has an IP address of 10.1.2.5, so be
    sure to change your changes to match the hostname and IP for your web server.


    # Is the Remote Port Open?


    So you route to the machine, but you cant access the web server on port 80. The
    next test is to see whether the port is open. There are a number of different
    ways to do this. For one, you could try telnet:


    ```

    $ telnet 10.1.2.5 80

    Trying 10.1.2.5...

    telnet: Unable to connect to remote host: Connection refused

    ```


    If you see Connection refused, then either the port is down (likely Apache isn''t
    running on the remote host or isnt listening on that port) or the firewall is
    blocking your access. If telnet can connect, then, well, you don''t have a networking
    problem at all. If the web service is up but just isn''t working the way you expect
    it to, you need to investigate your Apache configuration on the web server.


    Instead of telnet, I prefer to use nmap to test ports because it can often detect
    firewalls. If nmap isnt installed, use your package manager to install the nmap
    package. To test web1, you would type the following:


    ```

    $ nmap -p 80 10.1.2.5

    Starting Nmap 4.62 ( http://nmap.org ) at 2009-02-05 18:49 PST

    ```'
  merge: -1
