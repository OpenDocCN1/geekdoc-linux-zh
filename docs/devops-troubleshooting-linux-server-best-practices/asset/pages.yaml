  md: '# View Statistics from Previous Days


    Course, so far I''ve just listed how to pull all of the statistics for the entire
    day. Often you want data from only a portion of the day. To pull out data for
    a certain time range, use the -s and -e arguments to specify the starting time
    and ending time you are interested in, respectively. For instance, if you wanted
    to pull CPU data from 8:00 p.m. to 8:30 p.m., you would type


    ```

    $ sar -s 20:00:00 -e 20:30:00

    Linux 2.6.24-22-server (kicksed) 01/07/2012

    08:05:01 PM CPU %user %system %iowait %idle 0.49 0.00 1.12 0.62 0.00 97.77

    08:05:01 PM all 0.49 0.00 2.15 1.21 0.00 96.16

    Average: all 0.49 0.00 1.63 0.91 0.00 96.96

    ```


    If you want to pull data from a day other than today, just use the -f option followed
    by the full path to the particular statistics file stored under /var/log/sysstat
    /var/log/sa. For instance, to pull data from the statistics on the sixth of the
    month you would type


    ```

    $ sar -f /var/log/sysstat/sa06

    ```


    You can combine any of the other sar options as normal to pull out types of statistics.'
