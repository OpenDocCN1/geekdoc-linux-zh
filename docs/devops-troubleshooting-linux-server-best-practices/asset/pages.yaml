    **Figure 10-1** Memest86+ testing some RAM


    any errors, they will be reported in the results output at the bottom of the screen.


    If you find an error in your RAM, you may not automatically be able to identify
    which DIMM has the error. At this point, you will have to use the process of elimination
    to take out all but the minimal amount of RAM your system needs to boot (often
    a pair of DIMMs) and run Memtest86+ to see if that has an error. If the pair passes,
    put them in the good pile and continue until you find a pair that has an error.
    Once you do, you can split the DIMM pair so you run Memtest86+ with one unknown
    DIMM and one known good DIMM until you find which specific DIMM is bad. Of course,
    don''t be lazy, and be sure to test every DIMM before you put the server back
    together. I have seen circumstances where two different DIMMs in the same server
    had problems at the same time.


    # Network Card Failures


    When a network card starts to fail, it can be rather unnerving as you try all
    sorts of network troubleshooting steps to no avail. Often when a'
  merge: -1
  pgno: 213
- img_proc: true
  md: 'network card or some other network component to which your host is connected
    to start to fail, you can see it in packet errors on your system. ifconfig command
    you may have used for network troubleshooting before can also tell you about TX
    (transmit) or RX (receive) errors for a card.

    Here''s an example from a healthy card:


    ```

    $ ifconfig eth0

    eth0 Link enc:Ethernet Hwaddr00:17:42:1f:18:be

    addr:10.1.1.1 Broadcast:10.1.1.255 Mask:255.255.255.0

    in6 addr:fe00::217:42ff:fe1b:64 State:Link

    UP BROADCAST MULTICAST MTU:1500 Metric:1

    RX packets:1 errors:0 dropped:0 overflows:0 frame:0

    TX packets:11 errors:0 dropped:0 overflows:0 carrier:0

    collisions:229 txqueuel:1000

    RX bytes:229 (22.0 B) TX bytes:2178 (2.1 KB)

    Interrupt:

    ```


    The lines you are most interested in


    ```

    RX packets:1 errors:0 dropped:0 overflows:0 frame:0

    TX packets:11 errors:0 dropped:0 overflows:0 carrier:0

    collisions:229 txqueuel:1000

    ```


    The lines will tell you about any errors on the device. If you start to see a
    lot of errors here, then it''s worth troubleshooting your physical net-work components.
    It''s possible a network card, cable, or switch port is going bad. Start with
    the easiest-to-test component by swapping out the network cable with a new or
    known good cable, and if you continue to get errors, move the cable to a new,
    hopefully known, good switch port. Finally, if neither of those solutions help,
    try swapping the net-work card (or switching to a different port if your server
    has multiple Ethernet ports).


    # The Server Is Too Hot


    Servers, especially busy servers, generate a lot of heat. Although ideally your
    server is colocated in a facility with good active cooling, it might just be shoved
    under someones''s desk, or it may sit at the top of a rack in'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# The Server Is Too Hot


    a poorly cooled datacenter. A poorly cooled server can cause premature hard drive
    failure and premature failure in the rest of the server components as well. If
    that''s not enough, modern motherboards often throttle the CPU when it detects
    it is close to overheating, even if your server doesn''t fail completely, it may
    slow down to the point of being unusable. Other times, overheated components may
    cause processes to randomly crash.


    If you suspect your datacenter may be running a bit too hot, one solution may
    be to purchase a rackmount thermometer that can monitor temperature for you. Rackmount
    thermometers work, but even if the ambient air is cool enough, a thermometer may
    not help you if your server is still too hot. Linux provides tools that allow
    you to probe CPU and motherboard temperatures, and even fan speeds. All of this
    support is provided by the lm-sensors package-u lm-sensors package, which should
    be available for just about any distribution.


    Once the lm-sensors package is installed, run the sensors-detect program as root:


    ```

    $ sudo sensors-detect

    ```


    This interactive script will probe the hardware on your system so it knows how
    to query for temperature. If you don''t know how to respond to some of the questions
    it asks, just hit Enter to accept the default. Once the sensors-detect script
    is completed, you can pull data about your server by running the command sensors:


    ```

    $ sensors

    ktemp-pci-00c3

    Adapter: PCI adapter

    Core0 Temp: +34.0°C

    Core1 Temp: +38.0°C


    ktemp-pci-00cb

    Adapter: PCI adapter

    Core0 Temp: +32.0°C

    Core1 Temp: +36.0°C

    ```'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# Chapter 10 It''s the Hardware''s Fault! Diagnosing Common Hardware Problems


    Different hardware will display different temperature readings. For instance,
    the previous code is from an HP ProLiant server whereas the following output is
    from a ThinkPad laptop:


    ```

    $ sensors -f

    acpitz-virtual-0

    Adapter: Virtual device

    temp1: +134.6°F (crit = +260.0°F)

    temp2: +132.8°F (crit = +219.2°F)

    thinkpad-isa-0000

    Adapter: ISA adapter

    fan1: 3756 RPM

    temp1: +134.6°F

    temp2: +122.0°F

    ```


    As you can see in the second output, we not only got a fan speed, we also were
    able to see what temperatures were considered critical for a device. This example
    added the -f option as well, which will convert temperatures into Fahrenheit for
    you.


    So, what do you do if your server is running too hot? For starters, ensure the
    airflow around the server and make sure the vents in and out of the servers aren''t
    clogged with dust. If the servers are in a datacenter that forces cool air from
    the bottom of the rack, to the floor (even if the servers aren''t in such a datacenter,
    the air is likely to be cooler than the floor). You may want to consider moving
    particularly hot servers down closer to the floor if you have room in your rack,
    also consider spacing your servers more so not stacked on each other. If you have
    the bad habit of not mounting your servers but instead installing a shelf and
    stacking servers on top of the other, that will also contribute to poor airflow
    and overheating.


    # Power Supply Failures


    The final hardware failure this chapter will briefly cover the power supply failure.
    Most modern server hardware has the option of having redundant power supplies
    so that if a power supply fails, the server stays up. Although complete power
    supply failures can be a problem, there really'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# Power Supply Failures 195


    isn''t that much to troubleshoot there—the power supply shuts off and stops working.
    The power supply briefly mentioned in this section is one in which the power supply
    still technically works but can''t supply enough power.


    When a power supply can''t supply adequate power either due to being underpowered
    or because it is going to fail soon, it can cause strange problems on the server.
    In fact, the symptoms are much like RAM errors, but bad power supplies can also
    cause temporary failures in hard drives. In yours, you may see either SMART errors
    or possibly you may experience a file system error that causes your system to
    remount in read-only mode (Chapter 4 covers this type of error in more detail),
    yet when you do a RAM check or a follow-up SMART check, things come up clean.
    Many administrators assume the motherboard or some other core component is starting
    to fail, and they will toss out the whole server!


    So how do you tell when problems like this are caused by a bad power supply and
    not by bad RAM or failing drives? Generally, when a power supply starts to fail
    and can''t supply sufficient power, you''ll notice problems are more common when
    a system is under heavy load. For instance, you may notice you start getting more
    frequent file system errors when your build server is in the middle of a big build
    (although this may also point to a cooling issue as well). The simplest way to
    diagnose this kind of problem is basic troubleshooting: Swap out the power supply
    with a new one (or one from a known good system) and see if you can re-create
    the issue.'
  merge: -1
