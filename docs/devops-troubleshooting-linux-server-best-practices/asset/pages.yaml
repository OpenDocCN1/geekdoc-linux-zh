    | none | 249M | 0 0% /var/lock |

    | none | 249M | 0 0% /lib/init/rw |


    Here you can see there is only one mounted partition, /dev/sda; it has 7.8Gb of
    total space of which 7.4Gb is used, and it says it''s 100% full with 60Kb available.
    Of course, with a full file system, how are you supposed to log in and fix anything?
    As you''ll see later in the chapter, one of the common ways to free up space on
    a file system is to compress uncompressed logs, but if the disk has no free space,
    how are you expected to do that?


    # Reserved Blocks


    If you look at df numbers closely, though you may say, wait a minute, Linux really
    that bad at math? 7.4Gb divided by 7.8Gb is closer to 95% full.


    What''s happening here that Linux has set aside a number of blocks on the file
    system, known as reserved blocks, for just such an emergency (and also to avoid
    fragmentation). Only the root user can write to reserved blocks, so if the file
    system gets full, the root user still has space left on the file system to log
    in and move around some files. Most servers with ext-based file systems, 5% of
    the total blocks are reserved, but this is something you can check with tune2fs
    tool if you have root permissions. For instance, here is how you would check the
    reserved block count on your /dev/sda partition:


    ```

    $ sudo tune2fs -l /dev/sda | grep -i "block count"

    Block count: 2073344

    Reserved block count: 103667

    ```


    If you divide 103667 by 2073344, you''ll see that it works out about 5%, or, in
    this case, it means the root user has about 400Mb to play with try to fix the
    problem.


    # Track Down the Largest Directories


    The df command lets you know how much space is used by each file system, but after
    you know that, you still need to figure out what is consuming'
