  md: '# Repair Corrupted File Systems


    So what do you do if this happens to you? If the file system is not the root partition
    and you can completely unmount it, you can try to unmount it completely then remount
    it. If it''s the root partition, or remounting doesn''t work, unfortunately you
    will have to reboot the system so it can check and remount the file system cleanly.
    After a reboot the file system still won''t mount cleanly, move on to the next
    section.


    # Repair Corrupted File Systems


    There are a number of scenarios in which a file system might get corrupted through
    either a hard reboot or some other error. Linux will automatically run a file
    system check (called fck) at boot to attempt to repair the file system. Often
    the default fck is enough to repair the file system, but every now and then a
    file system gets corrupt enough that it needs manual intervention. What you will
    often see is the boot process drop out after a fck fails, hopefully to a rescue
    which you can use to run fck manually. Otherwise, track down a rescue disk you
    can boot from (many distribution install disks as rescue disks nowadays), open
    up a terminal window, and make sure you have root permissions (on disks that use
    sudo, you may have to type sudo -s to get root).


    One warning before you start fcking the file system: Be the file system is unmounted
    first. Otherwise fck could potentially damage your file system further. You can
    run the command devountname to unmount anything that is mounted (except the root
    file system). Since this file system is preventing you from completing the boot
    process, and probably not mounted, in this example let''s assume that your /home
    directory is mounted on a separate partition /dev/sda5. To scan and repair any
    file system errors on this file system, type


    ```

    # fsck -y -C /dev/sda5

    ```


    The -y option will automatically answer Yes to repair file system errors. Otherwise,
    if you have any errors, you will find yourself hitting Y over and over again.
    The -C option gives you a nice progress bar so you can see'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# Chapter 4 Why Can''t I Write to the Disk? Solving Full or Corrupt Disk Issues


    how far along fsck is. A complete fsck can take some time on a large file system,
    so the progress bar can be handy.


    Sometimes file systems are so corrupted that the primary superblock cannot be
    found. Luckily, file systems create backup superblocks in case this happens, so
    you can tell fsck to use this superblock instead. You aren''t likely to automatically
    know the location of your backup superblock. For ext-based file systems you can
    use the mk2fs tool with the -n option to list all of the superblocks on a file
    system:


    ```

    # mk2fs -n /dev/sda5

    ```


    > Be sure to use the -n option here! Otherwise, mk2fs will simply format your
    file system and erase all of your old data.


    Once you see the list of superblocks in the output, choose one and pass it as
    an argument to the -b option for fsck:


    ```

    # fsck -b 8193 -y -c /dev/sda5

    ```


    When you specify an alternate superblock, fsck will automatically update your
    primary superblock after it completes the file check.


    # Repair Software RAID


    The hard drive is one of the pieces of hardware most likely to break on your server,
