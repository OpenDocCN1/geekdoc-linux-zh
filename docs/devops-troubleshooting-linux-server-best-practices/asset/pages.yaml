    # Recursive Name Server Problems


    Now that we''ve gone over how DNS requests generally work, we will discuss problems
    in the next link in the chain: recursive name servers. Most computers don''t have
    a DNS server installed on; instead, all DNS queries go to a recursive name server.
    On Linux machines these name servers are configured in /etc/resolv.conf. Although
    that DNS server might host some zones it itself, as a recursive name server, it
    will receive DNS queries from clients and then perform recursive resolution (the
    steps discussed in the tracing section) to resolve them.


    When a recursive name server has a problem, all clients using that name server
    have a problem. Since we all rely on DNS to translate hostnames to IPs, without
    your recursive name server, you won''t be able to look up addresses for your favorite
    websites, and unless you have IPs memorized, the Internet will, in effect, be
    for you.


    Because recursive DNS resolution is so important, ISPs provide their clients with
    more than one name server to use, and offices and other organizations should as
    as well. In those cases, when the first name server in your list has a problem,
    one of the first symptoms you might see is DNS resolution taking about 30 seconds.
