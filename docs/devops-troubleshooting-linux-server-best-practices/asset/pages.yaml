    Say, for instance, that you have a database server and the database itself is
    stored on /dev/sda3. If you see that the bulk of the I/O is coming from there,
    you have a good clue that the database is likely consuming the I/O.


    Once you figure out, the next step is to identify whether the I/O is mostly from
    reads or writes. Let’s say you suspect that a backup job is causing the increase
    in I/O. Since the backup job is mostly concerned with reading files from the file
    system and writing them over the network to the backup server, you could possibly
    rule out if you see that the bulk of the I/O is due to writes, not reads.'
