    # Parse Web Server Logs


    One of the primary ways you will troubleshoot web server problems is via the logs.
    Each request that goes to a web server gets logged in a standard format that may
    look a bit odd at first, but each line packs a lot of useful information for troubleshooting.
    Both Apache and Nginx store their logs in custom directories under /var/log/apache2
    (or apache httpd depending on your distribution) and /var/log/nginx, respectively.
    Both web servers default to similar log formats and both store request logs under
    access.log and errors under errors.log. Beyond that, most administrators configure
    their servers so that each site (virtual host) has its own log, thus the access
    log might end up quite empty whereas your www.example.org.log ends up containing
    most of your data.


    To demonstrate the sorts of information you can get from web server logs, let''s
    take a curl command used earlier in the chapter and look at the response log:


    ```

    $ curl -w "%{http_code}\n" http://www.example.net

    <html><body>It works!</h1>

    <p>This is the default web page for this server.</p>

    <p>The web server software is running but no content has been added, yet.</p>

    </body></html>

    200

    ```


    10.1.2.3 -- [04/Jul/2012:12:08:05 -0700] GET /HTTP/1.1 "-" 200 303 - "curl/7.19.7"

    (x86_64-linux-gnu) libcurl/7.19.7 OpenSSL/0.9.8k zlib/2.2.3.33/1.15


    Log entries are split into a number of different fields, and where a field has
    no data or isn''t applicable, it is replaced with a -. In this example, without
    knowing much about the log format, we can make a few emphas-'
