    In the case where 100% of your inodes are used, only a few options

    are at your disposal. You can try to identify a large number of files that you

    delete or move to another file system; you can possibly archive a group

    of files into a tar archive; or you can back up the files to your current file

    system, reformat it with more inodes, and copy the files back.


    # The File System Is Read-Only


    Every now and then you may encounter a file system that isn''t full, but it

    won''t let you write to it all the same. When you try to copy a file or save

    a file, you get an error that the file system is read-only. The first step is

