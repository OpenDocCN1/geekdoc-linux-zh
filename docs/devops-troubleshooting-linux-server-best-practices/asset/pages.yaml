  md: '# 74 Chapter 5 Is the Server Down? Tracking Down the Source of Network Problems


    Address: 10.1.1.3#53

    ** server can''t find web1: NXDOMAIN


    Here you see that the server did respond, since it gave a response: server can''t
    find web1. This could mean two different things. One, it could mean web1''s domain
    name is not in your DNS search path. This is set in /etc/resolv.conf in the line
    that begins with search. A good way to test this is to perform the same nslookup
    command, use only the fully qualified domain name (in this case, web1.example.com).
    If it does resolve, then either always use the fully qualified domain name, or
    if you want to be able to use just the hostname, add the domain name to the search
    path in /etc/resolv.conf.


    If even the fully qualified domain name doesn''t resolve, then the problem is
    on the name server. The complete method for troubleshooting all DNS issues is
    covered in Chapter 6, but here are some basic pointers. If the name server is
    supposed to respond, then that zone''s configuration needs to be examined. If
    it is a recursive name server, then you will have to test whether or not recursion
    is working on the name server by looking up some other domain. If you can look
    up other domains, you must check if the problem is on the remote name server that
    contains the zones.


    # Can I Route to the Remote Host?


    After you have ruled out DNS issues and that web1 is resolved into its IP 10.1.2.5,
    you must test whether you route to the remote host. Assuming ICMP is enabled on
    your network, one quick test might be to ping web1. If you can ping the host,
    you know your packets are being routed there and you can move to the next section,
    Is Remote Port Open? If you can''t ping web1, try to identify another host on
    the network and see if you can ping it. If you can, then it''s possible web1 is
    down or blocking your requests, move to the next section. If you can''t ping any
    hosts on the remote network, packets aren''t being routed correctly. One of the
    best tools to test routing issues is traceroute. Once you provide traceroute with
    a host, it will test each hop between you and the host. For example, successful
    traceroute between dev1 and web1 would look like this:'
  merge: -1
  pgno: 96
- img_proc: true
  md: '# Server A Can''t Talk to Server B 75


    ```

    $ traceroute 10.1.2.5

    troute to 10.1.2.5 (10.1.2.5), 30 hops max, 40 byte packets

    1 10.1.1.1 (10.1.1.1) 5.432 ms 5.206 ms 5.472 ms

    2 web1 (10.1.2.5) 8.039 ms 8.348 ms 8.643 ms

    ```


    Once you can see that packets go from dev1 to the gateway (10.1.1.1), and then
    the next hop is web1. This means it''s likely that 10.1.1.1 is the gateway for
    both subnets. On your network you might see a slightly different output if there
    are more routers between you and your host. If you can ping web1, your output
    would look more like the following:


    ```

    $ traceroute 10.1.2.5

    traceroute to 10.1.2.5 (10.1.2.5), 30 hops max, 40 byte packets

    1 10.1.1.1 (10.1.1.1) 5.432 ms 5.206 ms 5.472 ms

    2 * * *

    3 * * *

    ```


    Once you start seeing asterisks in your output, you know that the problem is on
    your gateway. You will need to route and investigate why it can''t route packets
    between the two networks. Instead you might see something like


    ```

    $ traceroute 10.1.2.5

    traceroute to 10.1.2.5 (10.1.2.5), 30 hops max, 40 byte packets

    1 10.1.1.1 (10.1.1.1) 5.432 ms 5.206 ms 5.472 ms

    1 10.1.1.1 (10.1.1.1) 3006.47 ms IH 3006.779 ms !H 3007.072 ms

    ```


    In this case, you know that the ping timed out at the gateway, so the host is
    likely down or inaccessible even from the same subnet. At this point, if you haven''t
    tried to access web1 from a machine on the same subnet as web1, try pings and
    other tests now.


    > NOTE If you have one of those annoying networks that block ICMP, don''t worry,
    you can still troubleshoot routing issues. You just need to install the tcptroute
    package (sudo apt-get install tcptroute), then run the same commands as for traceroute,
    only substitute tcptroute for traceroute.'
  merge: -1
