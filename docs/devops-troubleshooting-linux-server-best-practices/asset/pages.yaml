    \ what domain visitor is coming from? It's a common mistake to enable this option\
    \ when tweaking your settings. When your server gets hit with a lot of traffic,\
    \ everything slows down prematurely (or your DNS load spikes). What's happening\
    \ is that every request that comes requires a DNS request to go out to resolve\
