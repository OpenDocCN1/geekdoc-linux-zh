  md: '# DNS Server Troubleshooting 111


    When you query a name server directly, bypass any caching from your local DNS
    server and get the current up-to-date record, so if the IP you get from your direct
    query is still the old IP, you know that the cache hasn''t propagated to that
    name server. At that point, query the rest of the name servers in the list directly
    see if any of them have the correct record.

    If you find that none of the DNS servers have the update, you may have a syntax
    error in your zone file. If some DNS servers have the update and others don''t,
    you might have a cache issue.


    If you do find that the name servers have the correct record but your local DNS
    server has the old record cached, you have a few recourses. The simplest recourse
    is to just wait until the local cache expires. Ideally, if you know in advance
    that you need to make a DNS change and your TTL is long, many DNS administrators
    lower the TTL a few days before the change so all DNS servers out there have a
    chance to pull down the new shorter TTL. Then, once the change goes through, they
    increase the TTL back to its old value.


    If you can''t wait until the local cache expires, you can also flush your respective
    DNS caches. The first cache to flush would be the cache located on your operating
    system. Yes, even your OS will cache DNS requests so it doesn''t have to query
    your name server every time a record needs to be resolved. On Linux the nscd daemon
    (if it''s installed) handles this caching, so to flush the cache just type


    ```

    $ sudo /etc/init.d/nscd restart

    ```


    If you are on a Windows system, you can open a command prompt and type


    ```

    ipconfig /flushdns

    ```


    On a Mac, you would open a terminal and type


    ```

    lookupd -flushcache

    ```


    or the following, depending on your version of Mac OSX:


    ```

    dscacheutil -flushcache

    ```'
  merge: -1
  pgno: 133
- img_proc: true
  md: '# Chapter 6 Why Won''t the Hostnames Resolve? Solving DNS Server Issues


    If it''s your recursive DNS server that holds the cache, you will need to have
    administrative access to it to flush its cache. To flush the DNS cache of a BIND
    name server, you simply restart the service. On Red Hat-based systems this might
    be


    ```

    $ sudo /etc/init.d/named restart

    ```


    # Zone Syntax Errors


    If you have made a change to a DNS record and notice that the update hasn''t made
    it to any of the name servers for zone, a likely cause is a syntax error in the
    zone file. When you make a change to a zone file and reload BIND, if it notices
    a syntax error in the file, it will simply disregard any changes to that particular
    zone file and stick to the records it has. Unless you pay you may not even realize
    it happened. If you updated a zone, reloaded the BIND service, and the name server
    reports the old record, check /var/log/syslog or /var/log/messages on your system
    for error messages from BIND.


    Here''s an error message as a result of a syntax error:


    ```

    Mar 27 21:07:26 ns1 named[25967]: /etc/bind/db.example.net:20: #ns2.example.net:
    bad owner

    ->name (check-names)

    Mar 27 21:07:26 ns1 named[25967]: zone example.net.IN: loading from master file
    /etc/bind/

    ->db.example.net failed: bad owner name (check-names)

    Mar 27 21:07:26 snowball named[25967]: zone example.net.IN: not loaded due to
    errors.

    ```


    In this case, the first line in the error message is enough to tell you that the
    error is in line 20 of /etc/bind/db.example.net. What happened here is a classic
    mistake: Almost all configuration files support # to comment out a line except
    BIND, which uses a semicolon. Instead of using the semicolon to comment out a
    line in the zone file, the administrator accidentally used # and BIND rejected
    the zone.'
  merge: -1
