- img_proc: true
  md: 'MOST SERVERS ARE ATTACHED to some sort of network and generally use the network
    to provide some sort of service. Many different problems can creep up on a network,
    so network troubleshooting skills become crucial for anyone responsible for servers
    or services on those servers. Linux provides a large set of network troubleshooting
    tools, and this chapter discusses a few common network problems along with how
    to use some of the tools available for Linux to track down the root cause.


    Network troubleshooting skills are invaluable for every member of a DevOps team.
    It''s almost a given that software will communicate with the network in some way,
    and in many applications, network connectivity is absolutely vital for the software
    to function. When there is a problem with the network, everyone from the sysadmin
    to the QA team, to the entire development staff will probably take notice. Whether
    your networking department is a separate group, or when your entire DevOps team
    work together on diagnosing networking problems, you will get a better overall
    view of the problem. Your development team will give you the deep knowledge of
    how your software operates on the network; your QA team will explain how the application
    behaves under unusual circumstances and provide you with a backlog of networking
    bug history; and your sysadmin will provide you with an overall perspective of
    how networked applications work under Linux. Together you will be able to diagnose
    networking problems faster than any team can individually.


    # Server A Can''t Talk to Server B


    Probably the most common network troubleshooting scenario involves one server
    being unable to communicate with another server on the network. This section will
    use an example in which a server dev1 can''t access the web service (port 80)
    on a second server named web1. Number of different problems could cause this,
    so we''ll run step by step through tests you can perform to isolate the cause
    of the problem.


    Normally when troubleshooting a problem like this, you might skip a few of these
    initial steps (such as checking the link), since tests further down the line will
    also rule them out. For instance, if you test and confirm that DNS works, you''ve
    proven that your host can communicate on the local'
  merge: -1
  pgno: 90
- img_proc: true
  md: '# Server A Can''t Talk to Server 69


    network. For this example, though, we''ll walk through each intermediary step
    to illustrate how you test each level.


    # Client or Server Problem


    One quick test you can perform to narrow down the cause of the problem is to go
    to another host on the same network and try to access the server. In this example,
    you would find another server on the same network as dev1, such as dev2, and try
    to access web1. If dev2 can also access web1, then you know the problem is more
    likely on web1, or on the network between dev1, dev2, and web1. If dev2 can access
    web1, then you know the problem is more likely on dev2. To start, let''s assume
    that dev2 can access web1, so we will focus our troubleshooting on dev1.


    # Is It Plugged In?


    The first troubleshooting steps to perform are on the client. You first want to
    verify that your client''s connection to the network is healthy. To do this you
    can use the ettool program (installed via the ettool package) to verify that your
    link is up (the Ethernet device is physically connected to the network). If you
    aren''t sure what interface you use, run the /sbin/ifconfig command to list all
    the available network interfaces and their settings. So your Ethernet device is
    at eth0


    ```

    $ sudo etht eth0

    Settings for eth0:

    Supported ports: [ TP ]

    Supported link modes: 10baseT/Half 10baseT/Full

    100baseT/Half 100baseT/Full

    1000baseT/Half 1000baseT/Full

    Supports auto-negotiation: Yes

    Advertised link modes: 10baseT/Half 10baseT/Full

    100baseT/Half 100baseT/Full

    1000baseT/Half 1000baseT/Full

    Advertised auto-negotiation: Yes

    Speed: 1000Mb/s

    Duplex: Full

    Port: Twisted Pair

    PHYAD: 0

    Transceiver: internal

    ```'
  merge: -1
  pgno: 91
- img_proc: true
  md: '# Chapter 5 Is the Server Down? Tracking Down the Source of Network Problems


    Auto-negotiation: on

    Supports Wake-on: pg

    Wake-on: d

    Current message level: 0x00000ff (255)

    Link detected: yes


    Here, on the final line, you can see that Link is detected to yes, devl is physically
    connected to the network. If this was set to no, you would need to physically
    inspect devl''s network connection and make sure it was connected. Since it is
    physically connected, you can move on.


    ethtool has beyond simply checking for a link. It can also be used to diagnose
    and correct duplex issues. When a Linux server connects to a network, it typically
    autonegotiates with the network to see what speeds it can use and which the network
    supports full duplex. The speed and Duplex lines in the example ethtool output
    what a 100Mb/s, full duplex should report. If you notice slow network speeds on
    a host, its speed and duplex settings are a good place to look. Run ethtool as
    in the previous example, and if you notice duplex set to Half, then run


    ```

    $ ethtool -s autoneg off duplex full

    ```


    Replace eth0 with your Ethernet device.


    # Is the Interface Up?


    Once you have established that you are physically connected to the network, the
    next step is to confirm that the network interface is configured correctly on
    your host. The best way to check this is using the ifconfig command with your
    interface as an argument. To test eth0''s settings, you would run


    ```

    $ ifconfig eth0

    Link encap:Ethernet HWaddr 00:17:42:1f:18:be

    addr:10.1.1.7 Mask:255.255.255.0

    net6 e80:fe21:427:fe1f:18be/64 Scope:Link

    UP BROADCAST MULTICAST MTU:1500 Metric:1

    RX packets:1 errors:0 dropped:0 overflows:0 frame:0

    TX packets:11 errors:0 dropped:0 overflows:0 carrier:0

    collisions:0 txqueuelen:1000

    RX bytes:229 (229.0 B) TX bytes:2178 (2.1 KB)

    Interrupt:10

    ```'
