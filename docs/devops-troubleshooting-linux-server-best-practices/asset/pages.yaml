- img_proc: true
  md: 'IT''S A RARE DevOps team that never encounters databases. An application that
    reaches a certain level of complexity will certainly store its data in some sort
    of database. Due to the prevalence of database wrapper libraries, the ease of
    installation some of the more popular databases, and the general familiarity developers
    have with SQL, often even relatively simple applications store data in a database
    and retrieve it via SQL commands. It''s rare website that is mostly static data.
    Most provide some of dynamic content to the user, and many, including the popular
    blogging platforms, all of the relevant content in a database. Whether your company
    has dedicated database administrators or not, everyone on the DevOps team can
    benefit from some database troubleshooting skills. After all, your DBA (database
    administrator) may not be responsible for the database backing your wiki, your
    build environment, or the test environment run on your laptop.


    It''s true that in the modern DevOps world, traditional SQL-based databases are
    not nearly as popular as they once were. It seems like there''s a new NoSQL-style
    database coming out every week. Discussing how to troubleshoot all of the popular
    SQL-based databases and the NoSQL databases would fill a complete book (or two);
    so instead, this chapter is going to simply cover the two most popular Open Source
    SQL-based databases you are most likely to run into: MySQL and PostgreSQL. Each
    section of this chapter will introduce a particular troubleshooting technique
    and describe how it applies to MySQL and then PostgreSQL. By the end of the chapter,
    you should be able to identify whether a database is running and listening on
    the right ports, pull performance metrics, and identify slow queries in a database.


    # Search Database Logs


    One of the places you should look when troubleshooting a database issue is the
    error log for that database, particularly if there is a problem with the database
    starting. The error log also provides information about successful startup and
    syntax errors in queries sent to the database; these are particularly useful when
    you are debugging applications.'
  merge: -1
  pgno: 194
