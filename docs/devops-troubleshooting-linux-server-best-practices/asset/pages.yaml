- img_proc: true
  md: 'THE WORLD OF DevOps is largely a world of software, but ultimately that software
    needs to run on a physical machine and that physical machine can have its own
    host of problems. Although if you are a developer or work in QA, you may think
    that hardware is the sysadmin''s domain; since every-one in DevOps organizations
    works much closer together, having hardware troubleshooting skills is invaluable.
    After all, no matter who is responsible for the hardware, if you could find out
    ahead of time that the hard drive on an important server is about to fail, wouldn''t
    you want to know? If you know your network application was failing because of
    bugs in your code, but because the network card was faulty, you might save yourself
    hours or days of debugging. If your application crashes randomly, your code may
    be fine and it could be a bad stick of RAM.


    This chapter will cover some of the more common hardware failures you might run
    into, with steps to troubleshoot and confirm them. It starts with some of the
    more common pieces of hardware that fail—hard drives and RAM—and then continues
    with how to troubleshoot some other hardware problems.


    # The Hard Drive Is Dying


    Many different components make up a server, but consistently the hard drives seem
    to be the weakest link. If any piece of hardware is going to fail before its time,
    it will likely be a hard drive. That''s why many servers have some sort of redundancy
    in the form of RAID. Although hard drive manufacturers all have their own hard
    drive testing tools, modern hard drives should also support SMART, which monitors
    the overall health of the hard drive and can alert you when the drive will fail
    soon. With a lot of vendor tools, you can check the health of your hard drive
    via SMART without rebooting.


    SMART tools should be available for any major Linux distribution, so just use
    your package manager and search for the keyword “smart.” Under Debian-based distributions,
    for instance, the package is called smartmontools. Once the package is installed,
    you should have a smartctl program you can'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# The Hard Drive Is Dying 187


    run as root to scan your drives. Pass the -H option to smartctl to check the health
    of a drive:


    ```

    $ smartctl -H /dev/sda

    smartctl version 5.37 [x86-pc-linux-gnu] Copyright (C) 2002-6 Bruce Allen

    Home page is http://smartmontools.sourceforge.net/

    SMART Health Status: OK

    ```


    In this example, the hard drive is healthy, but smartctl may also either failures
    or warnings about a drive:


    ```

    $ sudo smartctl -H /dev/sda

    smartctl version 5.38 [x86_64-unknown-linux-gnu] Copyright (C) 2002-8 Bruce Allen

    Home page is http://smartmontools.sourceforge.net/

    ```


    ```

    === START OF SMART self-assessment result: PASSED

    Please note the following marginal Attributes:

    ID ATTRIBUTE_NAME FLAG VALUE WORST THRESH UPDATED WHEN_FAILED RAW_VALUE

    190 Airflow_Temperature_Col 0x022 056 037 045 Old_age In_past 44

    →(Lifetime Min 20/50)

    ```


    In this case, the drive passed but returned a warning about airflow temperature
    for the drive (it''s in an enclosure that probably could use better airflow).
    Both examples pointed smartctl /dev/sda, the first drive in the system, so you
    may need to change to /dev/sdb or another device to check all of your drives.
    If you are unsure of the drives in your system, look at the output of sudo fdisk
    -l. It will list all the disks and partitions it can detect, but keep in mind
    that it will also show virtual drives like any software RAID partitions (/dev/mdX
    devices) you have set up.


    You can pull much more information about a hard drive using smartctl with the
    -a option. That option will pull out all of the SMART information about the drive
    in one fell swoop:


    ```

    $ sudo smartctl -a /dev/sda

    smartctl version 5.38 [x86_64-unknown-linux-gnu] Copyright (C) 2002-8 Bruce Allen

    Home page is http://smartmontools.sourceforge.net/

    ```'
