    # HTTP Status Codes


    When you are troubleshooting web server issues, the HTTP status code the

    web server returns with is invaluable. In the earlier examples,'
  merge: -1
  pgno: 171
- img_proc: true
  md: 'the web server returned the status code 200, which is the standard code you
    will see when everything is working—200 OK means the request you succeeded. There
    are a number of other status codes, each in their own numerical class; so, for
    instance, every status code that starts with 2 denotes a success and every code
    that starts with a 4 denotes a client error. This section talks each of the status
    code classes and highlights some of the more common codes you might run into.


    # # 1xx Informational Codes


    Status codes that start with 1 denote some sort of informational response. This
    status code range is for HTTP/1.1 and shouldn''t be sent to HTTP/1.0 clients.
    Here are the main responses you will see in this class:


    +   - 100 Continue

    tells the client to continue with the rest of its request.

    - 101 Switching Protocols

    icates that the server will switch to an updated HTTP version in response to a
    client request to do so.


    # # 2xx Successful Codes


    A status code that starts with 2 denotes a successful request. Ideally, if you
    are troubleshooting a web server, these codes is the kind of response you want
    to see. The most common of these status codes are 200 OK, which indicates a successful
    request. Here are some of the status codes you may see:


    +   - 200 OK

    The request was successful.

    - 201 Created

    your request was successful and resulted in a new resource being created.

    - 202 Accepted

    your request was accepted for processing; however, it may not have yet been processed.'
  merge: -1
  pgno: 172
- img_proc: true
  md: '+   203 Non Authoritative Information

    The information returned to you is not from the original source may be from a
    third party or be a subset of the original information.


    +   204 No Content

    The request was successful but the response results is in no content.


    +   205 Reset Content

    The client should reset the document view.


    +   206 Partial Content

    The server fulfilled the partial GET request.


    # 3xx Redirection Codes


    When the status code starts with 3, it denotes some sort of redirection message
    from the server to the client. Administrators often use this sort of response
    when they have moved content from one URL to another, move you from one domain
    to another, or even to redirect you to use HTTPS Here are some common status codes
    in this family:


    +   300 Multiple Choices

    The reply from the server will contain multiple resources the client can choose
    to redirect to.


    +   301 Moved Permanently

    This code is used when a resource will never again be available at the previous
    URI and has been moved to the new resource. Administrators use this code when
    they want to indicate that a client should point all future requests to the new
    URI.


    +   302 Found

    Unlike the 301 status, this code denotes a resource that is only temporarily redirected.
    In the future, the client should still use the original URI.


    +   303 See Other

    This is commonly a response to a POST request, where the response can be obtained
    via a GET request to a different URI.'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# Chapter 8 ■ Is the Website Down? Tracking Down Web Server Problems


    +   * 304 Not Modified

    This response is used when the client sends a GET request conditional on the document
    being modified. This response lets the client know that the document has not changed.


    +   * 305 Use Proxy

    The server will provide a proxy in its response URI that must be followed to access
    the requested data.


    +   * 306 Unused

    Status code is not yet used.


    +   * 307 Temporary Redirect

    This is similar to a 302 code and is used when the resource the client is requesting
    can be found under a different URI temporarily, but in the future, the client
    should use the original URI.


    # 4xx Client Error Codes


    When you are troubleshooting server problems, you are likely to run into some
    error codes that start with 4. This status code family deals with errors the server
    believes are on the client side. The most common of these errors is 404, which
    is returned when a client requests a page that doesn''t exist. Here are some common
    error codes in this class:


    +   * 400 Bad Request

    This code is used in response to bad syntax on the client side.


    +   * 401 Unauthorized

    This request requires authentication from the user, so the client should repeat
    the request with proper authentication.


    +   * 403 Forbidden

    Unlike a 401, this request is not allowed from the user and the client should
    not attempt to repeat the request with authentication. This error code is often
    indicative of permissions errors.


    +   * 404 Not Found

    The server couldn''t find the client requested. This error code often comes up
    when the user had a typo in their request, or'
  merge: -1
  pgno: 174
- img_proc: true
  md: 'the request is for a page that has moved without a redirection put in

    place, or the file used to exist but has been deleted.


    +   - 408 Request Timeout

    The client took too long to produce a request. You may see this when

    you are experimenting with web server troubleshooting over telnet.


    +   - 410 Gone

    Unlike a 3xx redirection request, this code is used when the resource

    used to exist but is now forever gone.


    # 5xx Server Error Codes


    Like 4xx status codes, 5xx status codes deal with errors, only in this case

    er error is likely on the server side. If you are the web server administrator

    and see these kinds of error codes, you will want to dig into your web

    server error logs for more information on the causes of the errors. Here are

    some example codes from this class:


    +   - 500 Internal Server Error

    The server received some internal error when it was processing the

    request. You may see this when you have a bug in a CGI or PHP script

    that causes the file to error out when it is run.


    +   - 501 Not Implemented

    The server doesn''t support the feature the client is requesting.


    +   - 502 Bad Gateway

    The error shows up when the server is configured as a gateway or

