  md: '# Chapter 3 Why Won''t the System Boot? Solving Boot Problems


    changed. We''ll start with how to fix the boot order since it is the simplest
    and fastest fix. Often this can occur when someone tweaks the BIOS order they
    can boot off of other media, such as a USB key, a CD-ROM, or over the network,
    and then they forget to change things back when they are.


    The BIOS provides a method to change its settings as the system powers on—by hitting
    a special key on the keyboard. Many BIOSes allow you to press a different key
    and choose what device to boot from. Unfortunately, manufacturers can''t seem
    to agree on which keys you should press to get either option, but fortunately
    most BIOSes display the keys they use on your monitor as the system powers on.
    Of course the emphasis is on fast times, so many BIOSes flash this screen quickly.
    If you are lucky, your BIOS will show a quick notice on the screen (often around
    the time your monitor starts showing something) that prompts you to press a key
    (often Del, F1, F2, or Esc) to configure the BIOS. You might also get a prompt
    to press a different key (often F11 or F12) to change the BIOS boot order or to
    select the boot device for this boot.


    Since to rule out whether the BIOS boot order is the cause of our problems, if
    your BIOS allows you to choose the boot order on the fly, choose that option first.
    Otherwise, press the key to configure your BIOS and go to the screen that allows
    you to edit your boot order (often labeled Boot, or if not, you''ll find it under
    Advanced). Manufacturer''s BIOS is a bit different, so you may have to look around
    a bit to the right options.


    Whether you select a one-time boot device or are in the BIOS config, you should
    be presented with a list of possible devices you can boot from. On most servers
    this will be some sort of hard disk, so find the first hard disk option and select
    it. If that drive boots properly you''ve found the right drive, otherwise reset
    the system and try each of the boot devices until you find the one that works.
    If you are able to find a drive that does boot, don''t forget to go back to your
    BIOS configuration screen and confirm that the boot order puts that drive before
    others.'
