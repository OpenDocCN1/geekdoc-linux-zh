  md: '# Chapter 1 = Troubleshooting Best Practices


    The point is that this instinct to blame the technology you understand least applies
    to you the troubleshooter as well as anyone else. You will be a much more effective
    problem solver if you understand how the system works. From the perspective of
    solving Linux systems, this means having a good understanding of TCP/IP, DNS,
    Linux processes, programming, and memory management. This book will help explain
    many of these subjects in the context of troubleshooting, but the fact is they
    are good subjects to know even outside of troubleshooting.


    You''ll discover that the more you understand how a system works, the faster you
    will be able to solve its problems. You will find you can trust your hunches about
    a problem more. It also will help you avoid goose chases. You''ll be able to rule
    out categories of root causes without having to perform many tests.


    # Use the Internet, but Carefully


    The Internet can be a very valuable resource when troubleshooting. You probably
    aren''t the first person in the world to see a particular error message. It is
    not likely that someone else has seen the same symptoms as you, there''s a good
    chance in your search you''ll find a working solution.


    The challenge with using the Internet for troubleshooting is that you must have
    a good, clear understanding of the problem before you search the Internet. If
    your server is not on the network and you type "server not on network" into a
    search engine, you probably won''t get very helpful results. When you do some
    troubleshooting steps on your own to narrow down the issue and have a clearer
    understanding of the problem, you''ll be able to use specific, targeted search
    queries that very well could help you solve your problem.


    I''ve found the Internet to be most useful when troubleshooting problems that
    include a very specific error code or phrase. Error codes that describe a specific
    issue can be handy because they if you don''t understand what the error code means.
    Usually you''ll find a helpful person on a forum or knowledge base that explains
    the error code means and what to do when you see it. Error messages in'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'output, if they are specific enough, can also be a good source for help when
    you are trying to resolve a problem.


    The danger with Internet searches is that if you don''t have a good understanding
    of the problem or don''t use specific search queries, you can end up with a lot
    of bad information and bad troubleshooting steps that take you further away from
    the root cause. You can also find a lot of advice from people who frankly don''t
    know what they are talking about. Always consider the source, and be sure you
    understand any commands or code before you copy and paste them.


    # Resist Rebooting


    Back in the Windows 95 days, rebooting was often the best way to fix just any
    problem. We aren''t in the Windows 95 days anymore, nor are we even using Windows
    here, yet some people are still stuck in that, so the moment a problem arises,
    their first action is to restart a service or reboot hardware.


    The most dangerous thing about rebooting to fix a problem isn''t that it won''t
    work, but sometimes it actually fixes the problem. What''s dangerous is that if
    it fixes the problem you are no closer to identifying the root cause, and, since
    the problem is no longer to test again, you may never isolate the cause. It is
    really difficult if not impossible to troubleshoot the cause of a problem when
    the problem no longer exists. If you don''t isolate the root cause, you are almost
    guarantee you will see the problem again at a later date.


    Don''t get me wrong, I''m not saying that you should never reboot hardware or
    restart a service when troubleshooting. What I am saying is that you should always
    use a reboot as an absolute last resort, and try to capture all of the troubleshooting
    data you can beforehand in case the problem goes away. This can be a tricky policy
    to have, especially if the problem is costing real money and your boss or a customer
    is screaming at you to just reboot and see if it fixes things. Stick to your guns,
    though. If you think your boss or customer is upset now, wait until the same problem
    happens again.'
