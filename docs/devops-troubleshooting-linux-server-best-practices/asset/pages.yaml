- img_proc: true
  md: '# DNS Issues


    Although DNS is blamed more often than it should be for network problems, when
    DNS does have an issue, it can often result in poor network performance. For instance,
    if you have two DNS servers configured for a domain and the first one you try
    down, your DNS requests wait 30 seconds before they time out and go to the secondary
    DNS server. Although this will be noticeable when you run tools like dig or nslookup,
    DNS issues can cause apparent network slowdowns in unexpected ways; this is because
    so many services rely on DNS to resolve hostnames to IP addresses. Such issues
    can even affect your network troubleshooting.


    Ping, traceroute, route, netstat, and iptables are great examples of troubleshooting
    tools that can degrade during DNS issues. By default, all of these tools will
    attempt to resolve IP addresses into hostnames if you can. If there are DNS problems,
    the results from each of these commands might still wait while they attempt to
    look IP addresses and fail. In the case of ping or traceroute, it might seem like
    your ping replies are taking a long time, when they finally come through, the
    round-trip time is relatively low. In the case of route, netstat, and iptables,
    the results might still wait for some time before you get output. The system is
    waiting for DNS requests to time out.


    In all of the cases mentioned, it''s easy to bypass DNS so your troubleshooting
    results are accurate. All of the commands we discussed earlier accept an -n option,
    which disables any attempt to resolve IP addresses into hostnames. I''ve just
    become accustomed to adding -n to all of the commands I introduced you to in the
    first part of this chapter unless I really want IP addresses resolved.


    Although we get into this in Chapter 8, DNS resolution can also affect your web
    server''s performance in an unexpected way. Some web servers are configured to
    resolve every IP address that accesses them into a hostname for logging. Although
    that can make the logs more readable, it can also dramatically slow down your
    web server at the worst times—when you have a lot of visitors. Instead of sending
    traffic, your web server can get busy trying to resolve all of those IPs.'
  merge: -1
  pgno: 101
- img_proc: true
  md: '# Find the Network Slowdown with traceroute


    When your connection seems slow between your server and a host on a different
    network, sometimes it can be difficult to track where the real slowdown is. Especially
    in situations where the slowdown is in latency (the time it takes to get a response)
    and not overall bandwidth, it is a situation traceroute made for. Traceroute was
    mentioned earlier in the chapter as a way to test overall connectivity between
    you and a server on a remote network, but traceroute is also useful when you need
    to diagnose where a network slowdown might be. Since traceroute outputs the reply
    times for every hop between you and another machine, you can trace down servers
    that might be on a different continent or gateways that might be overloaded and
    causing network slideshows. For instance, there''s part of a traceroute between
    a server in the United States and a Chinese Yahoo server:


    ```

    $ traceroute yahoo.cn

    traceroute to yahoo.cn (202.165.182.205), 30 hops, 60 byte packets

    1 64-52-56-169.static.sonic.net (64.142.56.169) 1.666 ms 2.351 ms 3.038 ms

    2 2-ge1-1-0.gw.sonic.net (202.204.191.136) 1.241 ms 1.243 ms 1.229 ms

    3 265-ge7-1-0.paol.sonic.net (64.142.018.85)) 6.464 ms 6.607 ms 6.642 ms

    4 xe-1-6-4.arel1.paol.us.nlayer.net (69.222.138.853) 6.464 ms 3.612 ms 3.592 ms

    5 ae0-80g.cr1.paol.us.nlayer.net (69.222.153.138) 3.220 ms 3.404 ms 3.496 ms

    6 ael-50g.cr1.sjcl.us.nlayer.net (69.222.143.165) 4.335 ms 3.955 ms 3.957 ms

    7 ael0-402.cr1.art2.s.sjcl.us.nlayer.net (69.222.143.118) 8.748 ms 5.500 ms 7.657
    ms

    8 as4837-xe-4-0-2.art2s.sjcl.us.nlayer.net (69.222.153.169) 3.864 ms 3.863 ms
    3.865 ms

    9 219.158.30.177 (219.158.30.177) 275.648 ms 275.702 ms 275.687 ms

    10 219.158.97.117 (219.158.97.117) 284.506 ms 284.552 ms 262.416 ms

    11 219.158.97.933 (219.158.97.933) 263.538 ms 270.178 ms 270.121 ms

    12 219.158.49.265 (219.158.49.265) 303.441 ms = 303.465 ms

    13 202.96.12.198 (202.96.12.198) 306.968 ms 306.971 ms 307.052 ms

    14 61.148.143.110 (61.148.143.110) 295.916 ms 295.798 ms 295.860 ms

    ```


    Without knowing about the network, you can assume just that at the round-trip
    times once you get to hop 9 (at 219.158.30.177 IP), you have left the continent,
    and the round-trip time jumps from 3 milliseconds to 275 milliseconds.'
