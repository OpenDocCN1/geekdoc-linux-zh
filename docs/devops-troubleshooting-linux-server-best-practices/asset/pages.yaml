    Wireshark has a ton of features, including the ability to capture packets in its
    own right, and is a complicated and powerful-enough tool that it could be a subject
    for its own book. Since this is a book about troubleshooting and not TCP/IP itself,
    this section just mentions a few features that will help you with troubleshooting.


    Along the top toolbar you''ll see an input box and a button labeled Filter. With
    tcpdump, you filter packet dumps so you only see packets that match your criteria.
    Unlike tcpdump, Wireshark uses a completely different syntax for filters. For
    instance, if you want to see only packets related to host 192.168.0.1, type this
    in the filter and press Enter:


    ```

    ip.addr === 192.168.0.1

    ```


    To display only packets related to DNS (port 53), type


    ```

    tcp.port == 53 || udp.port == 53

    ```


    The filtering syntax for Wireshark is pretty extensive, but if you click on the
    button labeled Filter, a window pops up that gives you a good list of examples
    to get yourself started. From there you can also click a Help button that gives
    you more complete documentation on how to construct your own filter rules.


    Another useful feature in Wireshark is the ability to pick a complete stream of
    communication between two hosts out of a large number of packets. Although you
    can certainly do this by hand, you can also select one sample packet you are interested
    in, then click Analyze → Follow TCP Stream. If it''s a UDP or SSL stream, those
    options will be visible instead. Once you select that menu, a new window pops
    up (Figure 5-3),'
