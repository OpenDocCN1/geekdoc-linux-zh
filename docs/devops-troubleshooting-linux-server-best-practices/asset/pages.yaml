- img_proc: true
  md: 'In the case of multiple processes, you might have one system doing too many
    things. You might, for instance, a large number of Apache processes running on
    a web server along with some log parsing scripts that run from cron. All of these
    processes might be consuming more or less the same amount of CPU. The solution
    to problems like this can be trickier for the long term. As in the web server,
    you need all of Apache processes to run, you might need the log parsing programs
    as well. In the short term, you can kill (or wisely postpone) some processes until
    the load comes down, but in the long term, you might need to consider increasing
    the resources on the machine or splitting some of the functions across more than
    one server.


    # Diagnose Out-of-Memory Issues


    The next two lines in the top output provide valuable information about RAM usage.
    Before diagnosing specific system problems, it''s important to be able to rule
    out memory issues.


    | Mem: 102476k total, 99748k used, 26768k free, 8552k buffers |

    | Swap: 1004052k total, 4368k used, 999692k free, 28604k cached |


    The first line tells us how physical RAM is available, used, free, and buffered.
    The second line gives us similar information about swap usage, along with how
    much RAM is used by the Linux file cache. At first glance it might look as if
    the system is almost out of RAM since the system reports that only 26,768k is
    free. A number of troubleshooters are misled by the used and free lines in the
    output of the Linux file cache. Once Linux loads a file into RAM, it doesn''t
    remove it from RAM when a program is done with it. If there is RAM available,
    Linux will cache the file that if a program accesses the file again, it can do
    so much more quickly. If the system needs RAM for active processes, it won''t
    cache as many files. Because of the file cache, it''s common for a server that
    has been running for a fair amount of time to report a small amount of RAM free
    with the remainder residing in cache.


    Find out how much RAM is really being used by processes, you must subtract the
    file cache from the RAM. In the example code you just'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# Chapter 2 Why Is the Server Slow? Running Out of CPU, RAM, and Disk I/O


    looked out, of the 997,408 RAM RAM is used, 286,040k is being used by the Linux
    file cache, so that means only 711,368k is actually being used. In this example,
    the system still has plenty of available memory and is barely using any swap at.
    If you do see some swap being used, it is not necessarily an indicator of a problem.
    If a process becomes idle, Linux will often page its memory to free up RAM for
    other processes. A good way to tell whether you are running out of RAM is to look
    at the file cache. If your actual used memory minus the file cache is high, and
    the swap usage is also high, you probably do a memory problem.


    If you do find you a memory problem, the next step is to identify which processes
    are consuming RAM. Top sorts by their CPU usage by default, so you will want to
    change this sort by RAM usage. To do this, keep top open and hit the M key on
    your keyboard. This will cause top to sort all of the processes on the page by
    RAM usage:


    | PID USER | PR | NT | VIRT RES SHR S %CPU %MEM | TIME+ | COMMAND |

    |---|---|---|---|---|---|---|---|---|---|

    | 18749 nagios | 16 | 0 | 140m 1368M S | 12 | 6.6 | 1345:01 | nagios2db_status
    |

    | 9463 mysql | 16 | 0 | 688m 11M 332 | 53 | 5.5 | 569:17 | mysql |

    | 24636 nagios | 17 | 0 | 34660 10m 712 | 8 | 0.5 | 1195:15 | nagios |

    | 22442 nagios | 24 | 0 | 6048 2024 1452 | 6 | 0.1 | 00:00:04 | check_time.pl
    |


    Look at the MEM column and see if the top processes are consuming a majority of
    the RAM. If you do find the processes are causing high RAM usage, you can decide
    to kill them, or depending on the program, you might need to perform specific
    troubleshooting to find out why they use so RAM.


    top can actually sort its output by any of the columns. To change top sorts by,
    hit the F key to a screen where you can choose the sort column. After you press
    a key that corresponds to a particular column (for instance, K for the CPU column),
    you can hit Enter to return to the main top screen.


    The Linux kernel also has an out-of-memory (OOM) killer that can kill if the system
    runs dangerously low on RAM. When a system is almost out of RAM, the OOM killer
    will start killing processes. In some cases'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# Diagnose Load Problems with top 27


    might be the process that is consuming all of the RAM, but this isn''t guaranteed.
    The OOM killer could end up killing programs like ssh or other processes instead
    of the real culprit. In many cases, the system is unstable even after one of these
    events that you find to reboot it to ensure that all of the system processes are
    running. If the OOM killer kicks in, you will see lines like the following in
    /var/log/syslog:


    ```

    122849127.3253_1704.hostname:2,S:Out of Memory: Killed process 21389 (java).

    122849127.3253_1710.hostname:2,S:Out of Memory: Killed process 21389 (java).

    ```


    # Diagnose High I/O Wait


    When you see high I/O wait, the first things you should check is whether the machine
    is using a lot of swap. A hard drive is much slower than RAM, when a system runs
    out of RAM and starts using swap, the performance of almost any machine suffers.
    Anything that wants to access the disk has to compete with swap disk I/O. So first
    diagnose whether you are out of memory and, if so, manage the problem there. If
    you have plenty of RAM, you will need to figure out which program is consuming
    the most I/O.


    It can sometimes be difficult to figure out exactly which process is using the
    I/O, but if you have multiple partitions on your system, you can narrow down by
    figuring out which partition most of the I/O is. To do this, you will need the
    iostat program, which is provided by the sysstat package in both Red Hat- and
    Debian-based systems; if it isn''t installed, you can install it with your package
    manager.


    Preferably you will have this program installed before you need to diagnose an
    issue. Once the program is installed, you can run iostat without any arguments
    to see an overall glimpse of your system:


    ```

    $ sudo iostatnLinux 2.6.24-19-server (hostname) 01/31/2009

    ```


    ```

    avg-cpu: %user %nice %system %iowait %steal %idle

    5.73 0.07 2.03 0.53 0.00 91.64

    ```'
