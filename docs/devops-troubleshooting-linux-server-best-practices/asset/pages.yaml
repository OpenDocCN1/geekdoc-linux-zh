  md: '# DNS Server Troubleshooting


    servers are configured to know their master or masters are and will disregard
    this notification if it doesn''t come from the list of masters. Along with the
    notification the master will send a serial number configured in the zone file
    that is supposed to be incremented each time the zone changes. If the serial number
    on the master is larger than the serial number on the slave, the slave will request
    either a full or partial zone transfer so it gets the updates. That zone transfer
    request goes back to the master from an IP address that allows it to have zone
    transfers by default all of the configured name servers for the zone are allowed),
    the master will start the zone transfer. A problem with any of the above steps
    can cause an update to fail, so we''ll discuss how to identify each problem.


    Once you make a change to a zone and reload BIND, the master should show that
    the zone was detected and what notification was sent:


    ```

    Mar 27 21:47:16 nsl named[25967]: zone example.net/IN: loaded serial 2012032700

    Mar 27 21:47:16 nsl named[25967]: zone example.net/IN: sending notifications (serial
    2012032700)

    ```


    If you don''t see evidence in the logs that notifies were sent, then it''s time
    to troubleshoot the configuration on your master. First, use commands like this
    to see if the named process is running:


    ```

    $ ps -ef | grep named

    ```


    If it is not, start the service. You may also have to resort to restarting the
    BIND daemon if it didn''t reload properly. Finally, check your BIND nameof.conf
    and the rest of the zone configuration files, and confirm that this particular
    zone is configured to be a master and not a slave of this server.


    One of the most common reasons a zone transfer fails is simply that the serial
    number wasn''t updated. When you reload BIND on the master you might see an error
    in the logs like the following:


    ```

    Mar 27 21:09:52 nsl named[25967]: zone example.net/IN: zone serial (2012011301)
    unchanged.

    ➡ zone may fail to transfer to slaves.

    Mar 27 21:09:52 nsl named[25967]: zone example.net/IN: loaded serial 2012011301

    Mar 27 21:09:52 nsl named[25967]: zone example.net/IN: sending notifications (serial
    2012011301)

    ```'
