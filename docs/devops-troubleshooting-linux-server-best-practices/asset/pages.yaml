    --- 10.1.1.1 ping statistics ---

    5 packets transmitted, 4 received, 20% packet loss, time 420ms

    rtt min/avg/max/mdev = 1.436/1.966/3.132/0.686 ms

    ```


    As you can see, we were able to successfully ping the gateway, which means that
    we can at least communicate with the 10.1.1.0 network. If you couldn''t ping the
    gateway, it could mean a few things. It could mean that your gateway is blocking
    ICMP packets. If so, tell your network administrator that blocking ICMP is an
    annoying practice with negligible security benefits and then try to ping another
    Linux host on the same subnet. If ICMP isn''t blocked, it''s possible that the
    switch port on your host is set to the wrong VLAN, so you will need to further
    inspect the switch to which it is connected.


    # Is DNS Working?


    Once you have confirmed that you can speak to the gateway, the next thing to test
    is DNS functions. But since nslookup and dig tools can be used to troubleshoot
    DNS issues, but at this point, just use nslookup to see if you can resolve web1
    into an IP:


    ```

    $ nslookup web1

    Server: 10.1.1.3

    Address: 10.1.1.3#53

    ```'
