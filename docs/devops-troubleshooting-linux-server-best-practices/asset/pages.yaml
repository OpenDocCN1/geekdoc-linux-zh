    \ would need to modify the firewall rules to allow port 80 traffic from the host.\n\
    \n# # Troubleshoot Slow Networks\n\nIn a way, it's easier to troubleshoot network\
    \ problems when something doesn't work at all. When a host is unreachable, you\
    \ can perform the troubleshooting steps discussed earlier until the host is reachable\
    \ again. When the network is just slow, however, sometimes it can be a bit tricky\
    \ to track down why. This section discusses a few techniques you can use to track\
    \ down the cause of slow networks."
  merge: -1
