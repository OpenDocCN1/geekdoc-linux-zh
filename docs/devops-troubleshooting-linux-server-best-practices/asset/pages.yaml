    8169 be/4 root 189.52 K/s 0.00 B/s 0.00 % 0.00 % rsync --server --se

    4243 be/4 kyle 0.00 B/s 3.79 K/s 0.00 % 0.00 % cli /usr/lib/gnome-

    4244 be/4 kyle 0.00 B/s 3.79 K/s 0.00 % 0.00 % cli /usr/lib/gnome-

    1 be root 0.00 B/s 0.00 B/s 0.00 % 0.00 % init

    ```


    In this case, you can see that there is rsync process tying up your read I/O.


    # Troubleshoot High Load after the Fact


    So far this chapter has talked about how to find the cause of high load while
    the system is loaded. Although top and iostat are great tools, we aren''t always
    fortunate enough to be on the system when it has problems. I can tell you how
    many times I''ve been notified of a slow server, only to have'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Chapter 2 Why Is the Server So Slow? Running Out of CPU, RAM, and Disk I/O


    the load drop before I log in. With only a little effort, you can install tools
    on your server to log performance data throughout the day.


    We''ve already discussed how to use the tool iostat included in the sysstat package
    to troubleshoot high IO, but sysstat includes tools that can also report on CPU
    and RAM utilization. Although it''s true you can already do this with top, what
    makes sysstat even more useful is that it provides a simple mechanism to log system
    statistics like CPU load, RAM, and I/O stats. With these statistics, when someone
    complains that a system was slow around noon yesterday, you can play back logs
    and see what could have caused the problem.


    # Configure sysstat


    The first step is to install the sysstat package using your package manager. On
    a Debian-based system like Ubuntu, sysstat won''t be enabled automatically, so
    edit /etc/default/sysstat and change


    ```

    ENABLED="false"

    ```


    to


    ```

    ENABLED="true"

    ```


    On a Red Hat-based system, you may want to edit the /etc/sysconfig/sysstat file
    and change the HISTORY option so it logs more than 7 days of statistics. On both
    distributions types, statistics will be captured every 10 minutes and a daily
    summary will be logged.


    Once enabled, sysstat gathers system stats every 10 minutes and stores them under
    /var/log/sysstat or /var/log/sa. In addition, it will rotate the statistics file
    every night before midnight. Both of these actions are run in the /etc/cron.d/sysstat
    script, so if you want to change how frequently sysstat gathers information, you
    can modify it from that file.


    # View CPU Statistics


    As sysstat gathers statistics, it stores them in files beginning with sa followed
    by the current day of the month (such as sa3). This means that you'
