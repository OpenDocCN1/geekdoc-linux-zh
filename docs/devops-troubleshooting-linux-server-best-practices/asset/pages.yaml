  md: '# Chapter 4 Why Can''t I Write to the Disk? Solving Full or Corrupt Disk Issues


    all of that disk space. The similarly named du command is invaluable for this
    purpose. This command, with the right arguments, can scan through a file system
    and report how much disk space is consumed by each directory. If you pipe to a
    sort command, you can then easily see which directories consume the most disk
    space. What I like to do is save the results in /tmp (if there is enough free
    space, that is) so I can refer to the multiple times and not have to rerun du.
    I affectionately call this the `duck command:


    ```

    $ cd /

    $ sudo -ckx | sort -n > /tmp/duck-root

    ```


    This command won''t output anything to the screen but creates a sorted list of
    which directories consume the most space and outputs the list to /tmp/duck-root.
    If you then use tail on that file, you can see the top directories you use space:


    ```

    $ sudo tail /tmp/duck-root

    67872 /lib/modules/2.6.24-server

    67876 /lib/modules

    69892 /var/cache/apt

    69448 /var/cache

    76924 /usr/share

    82832 /lib

    124164 /usr

    484168 /

    484168 total

    ```


    In this case, you can see that /usr takes up the most space, followed by /lib,
    /usr/share, and then /var/cache. Note that the output separates /var/cache/apt
    and /var/cache, so you can tell that /var/cache/apt is the subdirectory that consumes
    the most space under /var/cache. Of course, you might have to open the duck-root
    file with a tool like less or a text editor so that you can see more than the
    last directories.


    What can you do with this output? In some cases the directory that takes up the
    most space can''t be touched (as with /usr), but often when the free space disappears
    quickly, it is because of log files growing out of control. If you do see /var/log
    consuming a large percentage of your disk, you could'
  merge: -1
  pgno: 82
