    Along with each record dig reports back, it also includes the TTL, not just for
    the main record requested, but also for any additional information it may return.
    In this case, the TTLs for all the records happen to be 300 seconds. This tells
    us that if we make a change to the web1.example.net record, we can expect it to
    take up to 5 minutes for an ordinary DNS server to return the new record.'
