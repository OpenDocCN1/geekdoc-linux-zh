  md: '# Chapter 3 Why Won''t the System Boot? Solving Boot Problems


    It''s rather rare for GRUB to disappear from the MBR, but it often happens on
    dual-boot systems where you might load both Linux and Windows. The Windows install
    process has long been known to wipe out the boot code in the MBR, in which case
    you would get no GRUB prompt at all and instead boot directly into Windows. Dualboot
    setups are fairly rare on servers, however, most likely if GRUB was completely
    removed from your MBR, your only clue would be some error from the BIOS stating
    it couldn''t find a suitable boot device. If you have already gone through the
    steps listed earlier to test your boot device order in your BIOS and still get
    this error, somehow GRUB was erased from the MBR.


    This error might also occur on systems using Linux software RAID the primary disk
    may have died. While some modern installs of GRUB can automatically install themselves
    to the MBR on all disks involved in RAID, if your install doesn''t default to
    that mode (or you are using an old version of GRUB and didn''t manually install
    GRUB to the MBR of the other disks in your RAID array), when the primary disk
    dies there will be no other instance of GRUB on the remaining disks you can use.


    # Stage 1.5 GRUB Prompt


    Another way GRUB can fail is that it can still be installed in the MBR, however,
    for some reason it can''t locate the rest of the code it needs to boot the system.
    Remember that GRUB''s first stage has to fit in only 446 bytes inside the MBR,
    so it contains the code it needs to locate and load the rest of the GRUB environment.
    GRUB normally loads what it calls stage 1.5 (GRUB 2 calls this `core.img`), which
    contains the code that can read Linux file systems and access the final GRUB stage,
    stage 2. Once stage 2 or core.img is loaded, GRUB can read its configuration file
    from the file system, load any extra modules it needs, and display the normal
    GRUB menu. When GRUB can''t find the file system that stage 2 or its configuration
    files, you may be left with a message that reads "loading stage 1.5" followed
    by either an error or a simple grub> prompt.


    If you get an error that loading stage 1.5 failed, move on to the section that
    talks about how to repair GRUB. If you get as far as a grub> prompt, that'
