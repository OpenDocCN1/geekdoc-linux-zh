    # No Name Server Configured or Inaccessible Name Server If you see the following
    error, it could mean either that you have no name servers configured for your
    host or they are inaccessible:


    ```

    $ nslookup web1

    ;; connection timed out; no servers could be reached

    ```


    In either case you will need to inspect /etc/resolv.conf and see if any name servers
    are configured there. If you don''t see any IP addresses configured there, you
    will need to add a name server to the file. Otherwise, if you see something like
    the following, you need to start troubleshooting your connection with your name
    server, starting off with ping:


    ```

    search example.net

    nameserver 10.1.1.3

    ```


    If you can''t ping the name server and its IP address is in the same subnet (in
    this case, 10.1.1.3 is within the subnet), the name server itself could be completely
    down. If you can''t ping the name server and its IP address is in a different
    subnet, skip ahead to the Can Route to the Remote Host? section, but only apply
    those troubleshooting steps to the name server''s IP. If you can ping the name
    server but it isn''t responding, skip ahead to the Remote Port Open?


    # Missing Search Path or Name Server It It is also possible that you will get
    the following error for your nslookup command:


    ```

    $ nslookup web1

    Server: 10.1.1.3

    ```'
