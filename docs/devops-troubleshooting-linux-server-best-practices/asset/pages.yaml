    Name: web1.example.net

    Address: 10.1.2.5


    In this example DNS is working. The web1 host expands into web1.example.net and
    resolves to the address 10.1.2.5. Of course, make sure that this IP matches the
    IP that web1 is supposed to have! In this case, DNS works, we can move on to the
