- img_proc: true
  md: '# Packet Captures 83


    you can also hit S or D to toggle between displaying ports only from the source
    or only from the destination host, respectively. Showing only source ports can
    be useful when you run iftop on a server, for many services, the destination host
    uses random high ports that don''t necessarily identify what service is being
    used, but the ports on your server are more likely to correspond to a service
    on your machine. You can then follow up with netstat -nlp command referenced earlier
    in this chapter to find out what service is listening on that port.


    Like with most Linux commands, iftop has an advanced range of options. What we
    covered should be enough to help with most troubleshooting efforts, but in case
    you want to dig further into iftop''s capabilities, just type man iftop to read
    the manual included with the package.


    # Packet Captures


    Although the techniques mentioned in this chapter should help you troubleshoot
    a wide range of networking problems, some problems are so subtle or low-level
    that the only way to track them down is dig into the protocol itself and examine
    individual packets as they go back and forth. Because of the low-level and tedious
    nature of analyzing packet dumps, you should try to use it as a last resort. That
    said, this type of troubleshooting can be quite effective, particularly to identify
    hosts on your local network that are misbehaving, hosts with misconfigured network
    settings, or debugging communications between your client and server software.
    Packet dumps are less effective for troubleshooting if you are unfamiliar with
    the protocols or if you allow yourself to get buried in volumes of packets and
    can''t see the problem for all of the normal traffic.


    When you capture packets, it''s most effective if you capture them on both sides
    of a communication, especially if there is a router or firewall between two hosts.
    If a machine between the two hosts is the cause of the problem, you''re more likely
    to detect it when you can see whether packets sent from host A arrive on host
    B exactly as they are. For instance, if you see host B send a reply back to host
    A that never gets, you can be confident that the problem is somewhere between
    the two hosts.'
  merge: -1
  pgno: 105
- img_proc: true
  md: "# Chapter 5 Is the Server Down? Tracking the Source of Network Problems\n\n\
    A great example of where packet captures come into play occurred time back when\
    \ I was troubleshooting a host that seemed to have trouble communicating with\
    \ a different server. Connections would sometimes just die out, yet at other times\
    \ seemed relatively fine, if slow. Nothing can be trickier to troubleshoot than\
    \ an intermittent problem. After a series of different troubleshooting steps,\
    \ we captured packets from both the problem host and the destination server.\n\
    \nWhat we discovered in the packet dump was a misconfigured router had been trying\
    \ to apply NAT (Network Address Translation) rules to our destination server incorrectly\
    \ and had sent packets back to our host while the destination server was trying\
    \ to reply us directly. Our host was seeing the same twice, but from two different\
    \ MAC addresses. What happened was a race each time we tried to set up a TCP handshake,\
    \ sometimes the destination server won the race and replied back, but others times\
    \ the router replied first; upon seeing that reply, our host tried to re-initiate\
    \ the handshake. Depending on who won, the communication would continue or get\
    \ reset. If we weren't able to analyze the individual packets going back and forth,\
    \ we may have never discovered the duplicate packets.\n\n# Use the tcpdump Tool\n\
    \nThe main packet capture tool we will discuss is tcpdump. This is an old and\
    \ proven command-line packet capture tool, and although there are more modern\
    \ tools out there, tcpdump is a program that you should be able to find on any\
    \ Linux system. Because of how tcpdump works, you will need to run it with root\
    \ privileges on your machine. By default, it will scan your network interfaces\
    \ and choose the first suitable one; then it will capture, parse, and output information\
    \ about the packets it sees. Here's some example from tcpdump with the -n option\
    \ (so it doesn't convert IP addresses to hostnames and slows down):\n\n```\n$\
    \ tcpdump -n\ntcpdump: verbose output suppressed, use -v or -vv for full protocol\
    \ decode\nlistening on eth0,link-type EN10M (Ethernet), capture size 96 bytes\n\
