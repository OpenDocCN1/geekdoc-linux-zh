  md: '# Stuggish or Unavailable Web Server


    Although configuration and permission problems are pretty well defined, probably
    one of the more common web server problems you will trouble-shoot is nice and
    vague—the server seems slow to the point it may be temporarily unavailable. Although
    a large number of root causes cause this kind of problem, this section will guide
    you through some common causes for sluggish web servers along with their symptoms.


    High Load Of the first things I check when a server is sluggish or temporarily
    unavailable is its load. If you haven''t already read through Chapter 2, read
    it to learn how to determine whether the server is suffering from high load, and
    if so, whether high load is the result of your web server processes; CPU, RAM,
    or I/O bound.


    Once you have identified the load is high and that your web server processes are
    the issue, if the load is CPU-bound, then you will likely need to troubleshoot
    your CGIs, PHP code, and so on, that your web server executes dynamic content.
    Go through your web server logs and attempt to identify which pages are being
    accessed longer during this high load period; then attempt to load them yourself
    (possibly on a test server if your main server is overloaded) to gauge how much
    CPU dynamic pages consume.


    If the load seems RAM-bound and you notice are using more and more swap storage
    and may even completely run out of RAM, then you may be facing the dreaded web
    server swap death spiral. This shows up commonly in Apache prefork servers but
    could potentially show up in Apache worker or Nginx servers in the right conditions.
    Essentially, when you configure your web server, you can configure the maximum
    number of web instances the server will spawn in response to traffic. In Apache
    prefork, this is known as the MaxClient setting. When a server gets so much traffic
    that it spawns more web processes than can fit in RAM, processes end up using
    the much slower swap space instead. This causes those processes to respond much
    more slowly than processes residing in RAM, which causes the requests to take
    longer, in which turns'
  merge: -1
  pgno: 188
- img_proc: true
  md: '# Solve Common Web Server Problems 167


    more processes to be needed to handle the current load until, ultimately, both
    RAM and swap are consumed.


    To solve this issue, you will need to calculate how many web processes can fit
    into RAM. First calculate how much RAM an individual web server process will take,
    then take your total RAM and subtract your operating system overhead. Then figure
    out how many Apache processes you currently can fit into the remaining RAM without
    going into swap. You should then configure your web server so it never launches
    more processes than it can fit into RAM.


    Of course, with modern dynamically generated web pages, setting this value can
    be a bit tricky. After all, some PHP scripts, for instance use little RAM whereas
    others may use a bit. In circumstances like this, the best tactic is to look at
    all of the web server processes and attempt to gauge the maximum, minimum, and
    average amount of a process consumes. You can decide whether to set the number
    of web servers according to the worst case (maximum amount of RAM) or the average
    case.


    If your load is I/O bound, and the web server has a database back-end on the same
    machine, you might simply be saturating your disk I/O with database requests.
    Of course, if you followed the load troubleshooting guide from Chapter 2, you
    should have been able to identify processes as the culprit instead of web server
    processes. In either case, you may want to consider putting your database on a
    separate server, upgrading your storage speed, or going to Chapter 9 for more
    information on how to troubleshoot database issues. Even if the database is on
    a separate machine, each web server process is waiting on a response from the
    database over the network may still generate a high load average.


    Otherwise, if the server is I/O bound but the problem seems to be coming from
    the web server itself and not the database, it could be that the software that
    powers your website running on the machine is simply saturating disk I/O with
    requests. Alternatively, if you have reverse DNS resolution in your logs so that
    IP addresses are converted to hostnames,'
  merge: -1
  pgno: 189
- img_proc: true
  md: 'your web server processes could simply have to wait on each DNS query to

    resolve before it finishes its request.


    **Server Status Pages** One of the other main places to look when diag-

    nosing servers, other than troubleshooting high load on the sys-

    tem, is in the server status page. Earlier in the chapter we talked about

    how to enable and view the server status page in your web server. In cases

    of slow or unavailable web servers, this status page gives a nice overall

    view of the health of your web server. You not only see system load-

    ages, you can also see how many processes are currently busy and what

    they are doing.


    If, for instance, you see something like this,


    ```

    $ curl http://localhost/server-status?auto

    ```


