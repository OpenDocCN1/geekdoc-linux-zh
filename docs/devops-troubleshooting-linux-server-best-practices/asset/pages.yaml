    # Identify Slow Queries


    When debugging problems with a database, one of the most common

    questions you''ll have to answer is “Why is the database slow?” To answer

    that question, you''ll want to be able to identify any slow queries—database

    queries that take longer than a certain threshold. When you can identify

    slow queries, you can then work on optimizing them to run faster on your

    database. Both MySQL and PostgreSQL have mechanisms in place to log

    slow queries so that you can view them later.


    # MySQL


    To enable query logging in MySQL, you will need to set two variables:

    log_slow_queries and long_query_time. The log_slow_queries variable should be

    set to the file you want to log all of your slow queries to (make sure the

    user MySQL runs as can write to this location), and long_query_time should be

    set to the threshold in seconds for how long a query needs to take

    be considered a slow query. In the default my.cnf file that came with the

    MySQL installation, these settings were already present in the file; they

    were commented out:


    ```

    # Here you can see queries with especially long duration

    log_slow_queries = /var/log/mysql/mysql-slow.log

    long_query_time = 2

    ```


    Once you set both of these values, you will need to restart the MySQL pro-

    cess. When you do, notice that it creates the slow query log for when it

    restarts; the contents look like this:


    ```

    /usr/sbin/mysqld, Version: 5.1.63-ubuntu10.04.1-log ((Ubuntu)). started with:

    Tcp port: 3306 Unix socket: /var/run/mysqld/mysql.sock

    Time Id Command Argument

    ```'
  merge: -1
  pgno: 204
- img_proc: true
  md: 'As queries come up that take longer than your threshold, you will be able to
    see them in this log along with information about the query, such as the user
    who executed it, the query and lock times, how many rows were sent, and how many
    were examined. You can then use this information to go back to your application,
    identify where query originates, and find ways to optimize it.


    Another way to identify problem MySQL queries is via the mysqlprocesslist command,
    which lists information about all the currently active MySQL processes. Here''s
    some sample output from a relatively inactive WordPress install that had one client
    (a local mysql client connection) connected with this mysqladmin command:


    ```

    $ mysqladmin -u root -p processlist

    ```


    | Id | User | Host | db | Command | Time | State | Info |

    |---|---|---|---|---|---|---||}{

    | 2663 | root | localhost | wordpress | Sleep | 80 | | |

    | 2686 | root | localhost | | Query | | show processlist |


    You can also add the -i option along with the number of seconds; when you do,
    this command will execute over and over with that number of seconds gap in between.
    You can then monitor commands as they come in and identify any queries that are
    taking much longer than they should. If you do identify a query that is slowing
    down the system and you to kill it, make a note of the process ID in the output
    of the processlist command, and use the kill command along with that process ID
    to kill the process. For instance, if you wanted to kill the above connection
    to the WordPress DB that had been connected for 80 seconds, you would type


    ```

    $ mysqladmin -u root -p kill 2663

    ```


    # PostgresSQL


    PostgreSQL gives you the option to log all queries, not just those that are above
    a certain threshold with the log_min_duration_statement setting. If this'
  merge: -1
  pgno: 205
- img_proc: true
  md: 'value is set to -1, then no queries are logged. If it is set to 0, then all
    queries are logged. If it is set to anything greater than zero, then it will log
    all queries that take longer than that number in milliseconds. So, for instance,
    to log all queries that take longer than 100 milliseconds, you would set the value
    like this:


    ```

    log_min_duration_statement = 100

    ```


    Once, restart the PostgreSQL service so the settings take effect. You should then
    start to see any queries that take longer than your threshold to show up in the
    logs. Remember that unlike MySQL, PostgreSQL expects this value to be in milliseconds,
    not seconds. Be careful not to set the threshold too low, though, unless you want
    to slow down your database by logging everything. For instance, setting the value
    to 1 will even pick up statistics-gathering queries in the log:


    ```

    2012-07-12 11:02:00 PDT LOG: duration: 28.964 ms statement: select * from

    →pg_stat_activity;

    2012-07-12 11:02:12 PDT LOG: duration: 39.845 ms statement: select * from

    →pg_stat_all_tables;

    ```'
