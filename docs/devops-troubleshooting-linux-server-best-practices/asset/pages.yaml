    example.net.      300 IN SOA ns1.example.net. admin.example.net.

    →2011062300 10800 2000 604800 7200

    ```


    Here you see that the authoritative DNS server is ns1.example.net. The next record
    after that, admin.example.net, isn''t another name server but instead is actually
    the email address to the administrative contact for this domain. The first period
    is to be replaced by an @, so in this case the administrative contact is admin@example.net.


    Once you know name server is authoritative for a zone, that''s the server that
    should be configured as the master. If we suspect there is a zone transfer issue,
    the next step is to log in to the master DNS server directly and check its configuration.


    The way that zone transfers in BIND is that any time record is updated on the
    master, BIND scans the zone for the NS records and notifies each of those name
    servers that there is an update. If BIND is configured with an extra list of name
    servers it notifies in addition to name servers configured in the zone, it notifies
    those as well. The slave name'
