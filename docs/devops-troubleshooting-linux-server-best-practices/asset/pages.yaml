    you might have to find it from a third-party repository. Once you have it installed,
    just run the iftop command on the command line (it will require root permissions).
    Like with the top command, you can hit Q to quit.


    At the very top of the iftop screen is a bar that shows the overall traffic for
    the interface. Just below that is a column with source IPs followed by a column
    with destination IPs and arrows between them so you can see whether the bandwidth
    is being used to transmit packets from your host or receive them from the remote
    host. After those columns are three columns that represent the data rate the two
    hosts over 2, 10, and 40 seconds, respectively. Much like with load averages,
    you can see whether the bandwidth is spiking now, or has some time in the past.
    At the very bottom of the screen, you can see statistics for transmitted data
    (TX) and received data (RX) with totals. Like with top, the interface updates
    periodically.


    The iftop command with no arguments is all you need for your troubleshooting,
    but every now and then, you may want to take advantage of some of its options.
    The iftop command will show statistics for the first interface it can find by
    default, but on some servers you may have multiple interfaces, if you wanted to
    run iftop against your Ethernet interface (eth1), type iftop -i eth1.


    By default iftop attempts to resolve all IP addresses to hostnames. One downside
    to this is that it can slow down your reporting if a remote DNS server is slow.
    Another downside is all DNS resolution adds extra network traffic that might show
    up in iftop! To disable network resolution, just run iftop with the -n option.


    Normally iftop displays bandwidth used between hosts, to help you narrow down
    things, you might want to see what ports each host is using to communicate. After
    all, if you knew a host was consuming most of your bandwidth over your web port,
    you would perform different troubleshooting than if it was connecting to an FTP
    port. Once iftop is launched, press P to toggle between displaying all ports and
    hiding them. One thing you''ll notice, though, is that sometimes displaying all
    the ports can cause hosts you are interested in to fall off the screen. If that,'
  merge: -1
