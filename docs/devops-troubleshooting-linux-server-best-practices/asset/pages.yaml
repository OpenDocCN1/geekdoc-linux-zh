- img_proc: true
  md: '# Test a Web Server from the Command Line


    Since we just want to test basic web server functionality, we don’t necessarily
    need to get into any of curl’s more sophisticated command-line options. In fact,
    testing a web server from curl can be as simple as typing curl and then the URL
    to load:


    ```

    $ curl http://www.example.net

    <html><body>It works!</h1>

    <p>This is the default web page for this server.</p>

    <p>The web server software is running but no content has been added, yet.</p>

    </body></html>

    ```


    In this example, you can see the default web page created by an Apache web server.
    If for some reason the web server were unreachable, you would see something like
    this


    ```

    $ curl http://www.example.net

    curl: (7) couldn''t connect to host

    ```


    By default, curl will just output the contents of the web page you requested,
    but often when you troubleshoot web servers you’ll need to get extra data, such
    as the HTTP status code (more on that later), how long the request took, how much
    data was transferred, and so on. Curl offers a -w option that lets you pull additional
    data about the request and display it on the screen. So, for instance, if you
    wanted to see the HTTP status code for a request, you could type


    ```

    $ curl -w "%{http_code}" http://www.example.net

    <html><body>It works!</h1>

    <p>This is the default web page for this server.</p>

    <p>The web server software is running but no content has been added, yet.</p>

    </body></html>

    200

    ```


    The extra information gets posted at the end of the request. In this case, the
    HTTP status code is 200, which is what we want. The curl man page (type man curl)
    lists a number of extra options for the -w argument that you can chain together
    in your output. Here’s an example of how you might'
  merge: -1
  pgno: 169
- img_proc: true
  md: '# Chapter 8 = Is the Website Down? Tracking Down Web Server Problems


    use that to get the status code, how long the request took, the size of the data
    downloaded, and the content type:


    ```

    $ curl -w "%{http_code} %{time_total} %{size_download}\

    %{content_type}\

    " http://www.example.net

    <html><body>-It works!</html>

    <p>This is the default web page for this server.</p>

    <p>The web server software is running but no content has been added, yet.</p>

    </body></html>

    200 0.014 177 text/html

    ```


    # ## Test Web Servers with Telnet


    Although curl is a handy and simple tool for testing web servers on the command
    line, sometimes you might need to test a web server from a host that doesn''t
    have curl installed, or you may just need to see lower-level HTTP calls. In either
    case, that''s where telnet comes in. Just about any Linux system should have telnet
    installed, and as long as you can get a lot of valuable diagnostic data from a
    web server.


    To run, telnet with the host you want to connect to as an argument, followed by
    port 80, or whatever your web server is listening on:


    ```

    $ telnet www.example.net 80

    Trying 10.1.2.5...

    Connected to www.example.net.

    Escape character is ''^''

    ```


    If for some reason you can''t connect, then you will need to go back to the initial
    network troubleshooting section in this chapter. Once you are connected, you will
    type in some basic HTTP:


    ```

    GET / HTTP/1.1

    host: www.example.net

    ```


    This example uses a basic GET request (GET /) that requests the default index
    page for the site followed by what HTTP protocol you''re using (HTTP/1.1). If
    you wanted to test the /admin/inventory.cgi page, for instance, you would say
    GET /admin/inventory.cgi HTTP/1.1. Then you press Enter and'
