  md: 'An alternate approach while looking through the mail logs is that instead of
    looking for email to Jan, you could look for email from Fred. After all, what
    if he misspelled Jan''s email address somehow, the email bounced, but Fred did
    not notice. To do that, just pull out any messages from his address instead:


    ```

    $ sudo grep ''from=.fred.smith@gmail.com'' /var/log/mail.log > /tmp/freds_incoming_emails

