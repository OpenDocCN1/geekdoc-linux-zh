  md: '# The Root Kernel Argument


    The kernel knows the root file system is because of the root option passed to
    it by GRUB. If you look in a GRUB configuration for the lines that contains kernel
    arguments, you might see something like root=/dev/sda, root=LABEL=/, or root=UUID=528c6527-24bf-42d1-b9b8-c157fb7b8a0af.
    In the first example, the kernel is given an explicit partition, /dev/sda2. This
    method of specifying the root device is most common in older systems and has been
    replaced with either disk labels or UUIDs, because any time a disk is added or
    repartitioned, it''s possible that what was once /dev/sdb2 or /dev/sda3.


    To get around the problem of device names changing around, started labeling partitions
    with their mount point, so the root partition might labeled / root and the /home
    partition might be labeled home or /home. Then, instead of specifying the device
    label such as root=LABEL=/. That way, the actual device names changed around,
    the labels would still remain the same and the kernel would be able to find the
    root partition.


    Labeled seemed to solve the problem of device names changing around but introduced
    a different problem—what happens when two partitions are labeled the same? What
    started happening is that someone would add a second disk to a server that used
    to be in a different system. This new disk might have its own / /home label already,
    and when added to the new system, the kernel might not end mounting the labels
    you thought it should. To get around this issue, some distributions assigned partitions
    UUIDs (Universal Unique Identifiers). The UUIDs are long strings of characters
    that are guaranteed to be unique across all partitions in the world, so you could
    add any disk to your system and feel confident that you will never have the same
    UUID twice. Now instead of specifying a disk at the boot point, you would specify
    a UUID like root=UUID=528c6527-24bf-42d1-b9b8-c157fb7b8a0af.


    # The Root Device Changed


    One of the most common reasons a kernel can’t mount the root partition is because
    the root partition was given has changed. When this happens'
