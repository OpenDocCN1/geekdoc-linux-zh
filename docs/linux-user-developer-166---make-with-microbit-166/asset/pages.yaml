    # ## Use the timeline


    Once your clips are on the timeline and you begin to manage your projects and
    timings, the timeline provides tools for editing video, moving back and forward,
    markers and cuts to capture a shot. A button labelled Effects will be given you
    quick access to a transition of Quick mixes, but this is a little master of what
    is offered, which also includes filters and titles.


    # ## Add effects, and export


    Further effects can be brought by right-clicking a clip on the timeline and selecting
    Effects. This is available here quite conveniently, putting those of other applications
    to shame. Here is how to select the top clips to your project. Your finished video
