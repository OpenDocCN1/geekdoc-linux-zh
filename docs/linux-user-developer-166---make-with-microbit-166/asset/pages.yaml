  md: "# Learn Go\n\n# # Learn Go Data Types\n\n# ## Get to grips programming composite\
    \ types of go\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_47_0.png)\n\nMihalis\
    \ Tsoukalos is a UNIX administrator, a programmer, UNIX enthusiast, and a self-taught\
    \ mathematician. He has been programming since 1993. You can reach him at @mactouhow\
    \ and mtsoukalos.com.\n\n# ### Resources\n\nA text editor such as Emacs or vi\n\
    \n# The Go compiler\n\nGo is an open source programming language that makes it\
    \ easy to build reliable and efficient software. Part of its greatness comes from\
    \ the fact that it supports many data types. Those that do not belong to the basic\
    \ types are called composite data types.\n\nCombining basic data types generates\
    \ composite data types. A composite type can also contain another composite type.\
    \ Although composite data types look simple, they are powerful with enhanced features.\
    \ One day, every programmer has to deal with variables, and data structures—all\
    \ three depend on data types.\n\nThis tutorial will cover arrays, maps, pointers\
    \ and structures. It will illustrate how to convert an array into a map. Go also\
    \ supports concurrent variables; a channel is a special type of array. You will\
    \ learn about array elements, which we take about concurrent-programming in Go.\n\
    \n```\nlength := len(myArray)\nfor i := 0; i < length; i++ {\n  fmt.Printf(\"\
    %d\\n\", myArray[i])\n}\n\n```\n\nThere is another way to access all elements,\
    \ and that is by using iteration:\n\n```\nfor _, number := range otherArray {\n\
    \  fmt.Printf(\"%d\\n\", number)\n}\n\n```\n\nThe convenient thing is that you\
    \ do not need to calculate the length of the array because the compiler does it\
    \ for you.\n\nAn array with two dimensions can be defined as follows:\n\n```\n\
    two := [3]int{{1, 2, 3}, {4, 5, 6}, {7, 8, 9}}\n\n```\n\nLast, an array with three\
    \ dimensions can be defined as follows:\n\n```\nthree := [3][3]int{{{1, 2, 3},\
    \ {4, 5, 6}, {7, 8, 9}}}\n\n```\n\nYou can access array elements from twoD and\
    \ threeD similarly.\n\n# ### Arrays\n\nArrays are a popular data type due to their\
    \ simplicity and speed. All programmers use arrays for storing data of the same\
    \ size. Any array can be defined as:\n\n```\nmyArray := [4]int{1, 2, 3, 4}\n\n\
    ```\n\nThe previous notation also defines the elements of the array. The indices\
    \ of myArray go from 0 to 3. The first element is myArray[0] and the last one\
    \ is myArray[3].\n\nYou can also define an array without specifying the number\
    \ of its elements:\n\n```\notherArray := []int{2, 4, 5, 6, 7, 8}\n\n```\n\nYou\
    \ can find the length of an array using the len() function. This is pretty useful\
    \ when you want to access the elements of an array using a loop:\n\n```\ntwo :=\
    \ [3]int{12, 13}\n\n```\n\nIterating over an array with two dimensions is tricky\
