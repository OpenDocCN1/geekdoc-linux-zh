  md: "# # Tutorial Debugfiles\n\nGNU Make built-in functions and GMSL\n\ninstead,\
    \ this not only applies to variables but built-in rules (in Make jargon, they\
    \ are called implicit rules). Now, get rid of the target in our original makefile,\
    \ so that only two targets remain: hold and clean. Running Make clean will delete\
    \ the hold and, execute Make with the -p flag;\n\nUsing built-in functions, you\
    \ can write powerful makefiles. Make ships with just a few functions, like the\
    \ ones used in this tutorial. If you need more functionality, just use them in\
    \ your own makefile.\n\n```\nmake -p debug\nAs you can clearly see, the hold target\
    \ is still created with no errors. The make.database will tell you why:\n```\n\
    \n```\nMAKEFILE+=\nGMSL=\nSHELL=/bin/sh\nTARGET=hold\n```\n\nIf you know GNU well\
    \ enough, and you like to write complex user-defined functions and targets, you\
    \ can even leverage its features to create some sort of debugger. No need to reinvent\
    \ the wheel, of course! Someone has already done it: it is the GMSL library building\
    \ process for any target, inspect variables and list more breakpoints.\n\n```\n\
    hold: owld\n# Implicit search has been done.\n```\n\n#  Tooling with GMD\n\nFirst,\
    \ download the GNU Standard Library (GMSL) and GMD (See References). Decompile\
    \ the two files and copy GMSL.gmd to GMD to set your first breakpoints. Finally,\
    \ add these lines to the makefile:\n\nAccording to the make.database, a target\
    \ hold.owld has been successfully created by executing the commands for implicit\
    \ rule. What rule could possibly be? Search for implicit rule.%o to see in the\
    \ make.database.\n\n```\ninclude gmd\ninclude gnd\n```\n\nThis implicit rule tells\
    \ make how to build any target .a from a bunch of pre-requisites and in other\
    \ words how to compile C code and create the object file. Dumping the make database\
    \ will reveal all the variables and them. But sometimes you do not need to be\
    \ that dramatic; maybe getting only the variables are defined in your makefile\
    \ will suffice. So you can leverage built-in functions and create another _PHONY\
    \ target. Open our first makefile and add a new target focus:\n\nLet's set a GMD\
    \ breakpoint for the hold target. To do so, the $(BREAKPOINT) variable to change\
    \ others.\n\n```\n$(TARGET)=owld\n# $(BREAKPOINT)\n$(CC) $(CFLAGS) = - $\n```\n\
    \n```\npvars:\n$(foreach VAR,$(VARIABLES)),\n  $(VAR)\n$(filter-out environment,$(origin\
    \ VAR)),\n  $(info $(VAR)=$(value VAR)))\n```\n\nRun the make command and will\
    \ get you a prompt, if you use gdb(of):\n\n```\n- make\nMakefile:9: GNU Make Debugger\n\
    Makefile:9: Building 'hold' from 'hold.owld'\nMakefile:9: First prerequisite is\
    \ 'hold.owld'\nMakefile:9: Prequisites 'hold.owld' are newer than 'hold'\n```\n\
    \nDon't forget to add this to the .PHONY list:\n\nYou want to know the value for\
    \ a particular variable, let's say CC, and where it comes from? GMD, it's:\n\n\
    ```\n# _PHONY pvars\n\t\t\tmake pvars\n  .DEFAULT_GOAL=hold\n  CC=\n  CFLAGS=-gcc\
    \ -O0\n  CURDIR=./Makefile/examples\n  MAKEFILELIST= Makefile\n```\n\n```\ni >\
    \ cc\nMakefile:9: CC has value 'gcc'\nz = cc\nMakefile:9: CC come from file\n\
    ```\n\nNow, if you run your makefile, you will get all the variables that do not\
    \ belong to the environment, or automatic ones:\n\nFinally, when you think everything\
    \ is just, you can tell the debugger to continue to the target and finish:\n\n\
    ```\n > 0\ncc -gdb -O0 hold -o hold\n```\n\n# Makesfiles born of the-system\n\n\
    As previously stated, makefiles can be leveraged to more than just building targets.\
