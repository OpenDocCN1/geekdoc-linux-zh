    # # Managing editing timelines in Lightworks


    Enjoy industry-standard editing management with Lightworks


    Lightworks is an example of how video editing on Linux – this application has
    been used in award-winning movies such as The King''s Speech and Martin Scorsese''s
    Hugo, and the software reports no sign of lagging. While you may have to purchase
    a license to use some of the high-end tools like 4K support, chromakey, etc.,
    Lightworks'' strength – its evolutionary approach to editing – remains in the
    free version.


    Put yourself in the position of a movie director. You have a 90-minute to create
    from several hours of footage, different takes of different scenes. Putting all
    of that together with a standard linear editing tool is going to be tough; this
    is why Lightworks uses multiple timelines, enabling you to view and edit two or
    more scenes at once, alongside “room” approach, which essentially gives you as
    many screens as you need – an extended desktop.


    # ## Import video


    Getting started with OpenShot 2.0 means importing video and finding clips, importing
    them onto the timeline. With support for all video, audio and image formats that
    you choose, everything can be added without problems. In the event that you find
    something that cannot be imported, first check that it is a valid file type, then
