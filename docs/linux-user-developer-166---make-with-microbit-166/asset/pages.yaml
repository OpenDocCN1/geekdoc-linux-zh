  md: '# # Feature Make with microbit


    # # micro:bit vs VS Raspberry Pi


    How does the BBC''s board compare to the-leading SBCs?


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_17_0.png)


    # ## Raspberry Pi 2


    CPU: 800MHz 32-bit quad-core ARM Cortex-A7

    GPU: Broadcom VideoCore IV

    RAM: 1GB (shared with GPU)

    Networking: 10/100 Mbit/s Ethernet adapter

    Ports: USB x4, HDMI, composite video, 3.5mm audio jack

    Programming languages: Python, BBC BASIC, C++, Java, Perl, Ruby, Squeak, Smalltalk

    Extras: SPI, DPI


    # ## Raspberry Pi 3


    CPU: 1.2 GHz 64-bit quad-core ARM Cortex-A53

    GPU: Broadcom VideoCore IV

    RAM: 1GB (shared with GPU)

    Networking: 10/100 Mbit/s Ethernet, 802.11n

    GPIO: 17

    Ports: USB x4, HDMI, composite video, 3.5mm audio jack

    Storage: MicroSD

    Programming languages: Python, BBC BASIC, C++, Java, Perl, Ruby, Squeak, Smalltalk

    Extras: SPI, DPI


    # ## Raspberry Pi Zero


    CPU: 1 GHz ARMv6-28S1 single-core

    GPU: Broadcom VideoCore IV

    RAM: 512 MB (shared with GPU)

    Networking: n/a

    GPIO: 0

    Ports: microUSB x1, mini-HDMI, composite video/audio

    Storage: MicroSD

    Programming languages: Python, BBC BASIC, C++, Java, Perl, Ruby, Smalltalk

    Extras: SPI, DPI


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_17_1.png)


    # ## micro:bit


    CPU: 16 MHz ARM Cortex-M0

    GPIO: n/a

    RAM: 16KB

    Networking: 2.4 GHz Bluetooth wireless networking

    GPIO: 17

    Storage: 256 KB flash memory

    Programming languages: Python, JavaScript, micro:bit Editor, Make Touch Designer

    Extras: Accelerometer, magnetometer, LED


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_17_2.png)


    # ## VERDICT


    On the paper the microbit is lower-powered across most areas than even the Raspberry
    Pi Zero, in some cases it can do more out of the box, which makes it ideal for
    kids like this. The magnetometer on the board itself has extra features (which
    don''t have to be added to) for those new to electronics. Programs are easily
    completed and flashed to its state memory to be executed, while its edge connection
    is connected to a variety of peripherals (which rather makes up for its lack of
    standard ports). While all of Pi will be better in a straight benchmarking competition,
    its low speed and power consumption are perfect for beginners as it''s not overly
    complicated. But it''s a surprisingly little machine that can do more than a Pi
    can find - in fact, the microbit has enough of a features to be a rival to the
    market as a leader. Inspired by what they can create on it, the microbit is lately
    like picking up Pi but de-limited and escalated projects with the BBC''s microcontroller.


    18'
