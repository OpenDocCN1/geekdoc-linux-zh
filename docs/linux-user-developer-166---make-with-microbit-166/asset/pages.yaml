  md: "# Debug Makefiles\n\nIn a world full of pre-compiled binary packages, sometimes\
    \ you still need to face the intricacies of the GNU Make build-system\n\nAny GNU/Linux\
    \ Flavour has a package manager, full of compiled binaries, which makes installing\
    \ new software a no-box affair; yet sometimes we do to compile from sources, so\
    \ the package manager does not have a particular piece of software in its repository,\
    \ to use a different compiler, we need to set different compilers to generate\
    \ the binary, and so on. More than that, the compilation order becomes something\
    \ like CMake, Cmake or among others. GNU Make is a powerful build-system that\
    \ is necessary if you need to debug your executables.\n\n```\n$$(TARGET): hworld.o\n\
    $(CC) $(FLAGS) $? -o $@\n\nhworld: hworld.c\n$(CC) $(FLAGS) -c $?\n\n.PHONY: clean\n\
    clean:\n\rm -rf $(TARGET)\n```\n\nToni Castigli Girona is a software engineer\
    \ who provides research support in Barcelona, Spain. He writes about debugging,\
    \ performance, and more at debuguxes.org.\n\nGNU Make is a powerful build-system\
    \ that is necessary if you need to debug your executables. Projects are all about\
    \ a good understanding of writing and debugging makefiles. Targets, files, that\
    \ must be created so that other targets can be successfully generated. Generally\
    \ speaking, most compilation errors are due to badly written makefiles. There\
    \ are some remarkable out-of-the-box that can help us with these annoying issues.\
    \ But GNU Make is not to blame for compilation; a poorly written Makefile.\n\n\
    # Use GNU Makefileft functionalities for debugging\n\nThe following is a simple\
    \ makefile in charge of building a Hello World C-program:\n\n+   Resources\nGNU\
    \ Make http://www.gnu.org/software/make/\nGNU Debugger http://www.gnu.org/gdb/\n\
    GNU Make Standard Library http://www.gnu.org/software/remake/\n\n```\nTARGET =\
    \ hworld\nCC = gcc\nFLAGS = -Wall -g\n\nhworld: hworld.o\n\t$(CC) $(FLAGS) -o\
    \ $(TARGET) $?\n\nPHONY clean\nclean:\n\trm -f $(TARGET)\n```\n\nIf you run make\
    \ command, two targets will be created:\n\n```\nmake\ngcc -g hworld.c -o hworld\n\
    gcc -g hworld.o -o hworld\n```\n\nSo far our simple makefile is not going to give\
    \ you much trouble. But what if we have a more complex makefile? Imagine one consisting\
    \ of hundreds of commands for dozens of targets (libraries, binaries, documentation)...\
    \ Don't worry, the following\n\nwrite the simple makefile that looks like this:\n\
    \n```\nTARGET = hworld\nCC = gcc\nFLAGS = -gg0\n\n$$(Running Make: $(MAKE_VERSION))\n\
    $$(TARGET): $(TARGET).hworld\n```\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_39_0.png)\n\
    \n![](img/765b68b6c1fdb1413feedf2dc3295bc6_39_1.png)\n\n```\nTARGET = hworld\n\
    CC = gcc\nFLAGS = -Wall -g\n\nhworld: hworld.o\n\t$(CC) $(FLAGS) -o $(TARGET)\
    \ $?\n\n.PHONY clean\nclean:\n\trm -f $(TARGET)\n```\n\n```\nPING = ping\nPATH\
    \ = /bin:/sbin\n\n# This will be used as the CMD is used, but\n$(CMD) = $(PING)\
    \ -c 1\n\n# This target does not do anything, it performs the\ncheck:\n\t$(CMD)\
    \ google.com\n\n# Error message: a ping.fake host\nif [ $? -ne 0 ]; then\n\techo\
    \ \"host is not reachable\"\nelse\n\techo \"host is reachable\"\nfi\n```\n\nRight\
    \ complex targets by using built-in functions (the left), and using make as a\
    \ scripting language to learn a language to ping (the right).\n\n```\nclean:\n\
    \tDEFAULT_GO=hworld\n\tCFLAGS=-gg0\n\tMAKEFILE LIST=Makefile\n\tmake $(DEFAULT_GO)\n\
    \trm -f *\n```\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_39_2.png)\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_39_3.png)\n\
    \n```\nHOST=google.com\nping -c 2 $HOST\nThe www.google.com is up\nping -c 2 host.nodomain.org\n\
