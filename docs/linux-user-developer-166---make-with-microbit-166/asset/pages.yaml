  md: '# ## ss -t4 a


    If you use the following variation, then tcp connections in the LISTENING state
    will be shown:


    +   - ss -t4


    Using ss with the -o option displays useful statistics about the current connections:


    +   - ss -o


    # 04 Filter by TCP state


    A TCP connection can have many different states, so you may want to filter by
    state or exclude keywords found by identifier. The state filter displays output
    that matches the identifier, while the exclude keyword excludes the output that
    does not match.


    The available states are: syn-sent, syn-recv, fin-wait-1, fin-wait-2, time-wait,
    closed, close-wait, last-ack and closing. So, for viewing all established IPv4
    connections you should execute the:


    +   - ss -t4 state established


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_32_0.png)


    Left ss displays IPv4 and IPv6 protocols and will show both unless you specify
    one


    Across with it is simpler to use ss without command line parameters, this will
    result in a longer and more popular list of connections


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_32_1.png)


    The more you filter the output of ss, the more you have the data it shows


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_32_2.png)


    Other utilities that can help you monitor and test network connections including
    nmap, netstat.


    So, the question is: the general principle is to choose the one that has all the
    features you need. If you have to choose between two tools, ss is the more recent
    one because it accesses features of the Linux kernel.


    # 05 Filter by IP address and port number


    To specifically exclude TCP connections in the LISTENING state,


    +   - ss -t6 state established


    As more you filter the output of ss, the more you get information and the less
    you have to check connections from certain IP addresses and port numbers. The
    following command shows with a source or destination port of:


    ```

    # ss -at (dport = :80 or sport = :80)

