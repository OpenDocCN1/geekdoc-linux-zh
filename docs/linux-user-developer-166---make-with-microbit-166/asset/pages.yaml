    # Defrag or not


    Hi I''m new to Linux but I''ve worked with Windows machines for years I''m so
    comfortable with most things. The only thing that is really confusing me is whether
    or not defrag my system. Some websites say yes and some say


    However, fragmentation can be an issue on the size of your hard drive and the
    files you program on. There are a few defragmenters called e-defrag a most likely
    if your system already today. To find out if your system needs defrag use terminal
    and type:


    +   - sudo defrag - /location


    To defrag the system, make sure you use all partitions and run.


    +   - sudo defrag /dev/


    To defrag individual files, type:


    +   - sudo defrag


    Followed by the full name and path of the file.


