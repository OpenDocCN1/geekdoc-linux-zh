  md: "# GMD will allow you to\nbreak the building process\nfor any target, inspect\n\
    variables and list or remove\nbreakpoints\n\n```\nPING :== /bin/ping\nPING_OPTS\
    \ := -c4\n\nPING_CMD = $(shell $(PING) ($PING_OPTS))\n$(HOST) \\>/dev/null 2>&1;\
    \ echo $$7$\n\n#PHONY: pinghost\nifneq HOST\n  $(Error usage: make -f pinghost.make)\n\
    fi # PING_CMD=$(PING_CMD)\nif [ \"$(PING_CMD)\" != \"\" ]; then\n  $(Info host\
    \ $(HOST) is UP)\nelse\n  $(Info the host $(HOST) is DOWN)\nfi\n```\n\n```\nmake\
    \ clean\nmake -p > make.database\n```\n\nAny target not built due to an error\
    \ will be reported in the make.database. Search for the string \"Failed to be\
    \ updated\",\n\nNow make this datafile, save it as ping.make, and execute the\
    \ command like this:\n\n```\nmake -f pinghost\nping.make:18 *** Usage: make -f\
    \ pinghost.make\nHOST.\n```\n\n```\ngrep -n \"Failed to be updated\" make.database\n\
    1058: Failed to be updated.\n```\n\nIt seems fairly obvious that Make is expecting\
    \ a variable called HOST be passed as a command argument. We have implemented\
    \ the proper way to expect a parameter from the CLI. So, re-type the command but\
    \ add HOST: with any valid name you want to use:\n\nGo to line 658 and you will\
    \ see which target has failed to build:\n\n```\ncompwin:o misc ... /config/config.h\
    \ defines h.globals l motif.h\n# Failed to be updated.\n```\n\n```\nmake HOST=google.co\
    \ -f ping.make\nThe host google.co.uk is UP\n# PING_CMD = =\n```\n\nSo it is compris.\
    \ Reading through the make.database will show that this target is a prerequisite\
    \ of the xmrgr target:\n\n```\nxmgr: main o misc ...\n```\n\nAnd so, the xmrgr\
    \ target has not been built because this prerequisite has not been built either!\
    \ So you need to find out why xmrgr.cannot be built:\n\n```\nmake comprwin\ngcc\
    \ \"-O2 \" -I.\" -DMG_HOME=\"/usr/local/xmgr\"\n-DPRINT_DIR=\"/lpr\" -c comprwin.o\
    \ comprwin\ncomprwin.c:119: fatal error: Xm/h. No file ornor directory found\n\
    compilation terminated.\n```\n\nIf the host does not respond to the ping command,\
    \ you will get another result:\n\n```\nmake HOST=novdomain.org -f ping.make\n\
    The host novdomain.org is down\n# PING_CMD = =\n```\n\nCrystal: the Xm/h file\
    \ is missing! In plain English: you need the Motif (or leastif2) libraries:\n\n\
    We have leveraged make to create a simple tool to test whether a host is up and\
    \ running. And this is just the beginning. Some projects have plenty of such functionalities.\
    \ For complex projects, making use of the techniques you could use to some point:\n\
    \n```\n# apt install lestif2-dev\n```\n\nLet's put all the test to this scenario:\
    \ Suppose we want to build an old piece of software called XMRGR on a modern system.\
    \ After running /configure and make, the building process ends without showing\
    \ any errors. And yet, the xmr binary has not been built, only its non-graphical\
    \ counters fail.\n\n```\nmake comprwin\ngcc \"-O2 \" -I.\" -DMG_HOME=\"/usr/local/xmgr\"\
    \n-DPRINT_DIR=\"/lpr\" -c comprwin.o comprwin\nis comprwin\ncomprwin.c\n```\n\n\
    First of run, make the clean target to start afresh, then make the Make database\
    \ to file:\n\nOnce the first-requisite for xmrgr has been successfully built,\
    \ re-run the Make command. This, the xmr target is built without any issues, and\
    \ the xmr binary will show up in the script report..Job done"
