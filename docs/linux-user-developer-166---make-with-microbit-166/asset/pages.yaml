  md: '# # Composite effects in Flowblade composite tools


    For a more advanced take on transitions, you might prefer to look at Flowblade,
    Ostensibly another video editing app. Flowblade brings a superiority to the world
    of mixes and transitions with a more mature approach to switching between them.


    There are several composite tools available, while the degree to which they can
    be tweaked individually, bringing a distinct veneer of polish to finish your video
    projects. The composite effects are remarkable, and you can adjust the position
    of the two clips in window before right-clicking on the first and selecting Add
    Composer. For settings the chosen effect will be listed in the Compositor.


    Flowblade also offers a number of filters, which can be applied to both video
    and audio tracks of your projects. These can be applied individually, or in conjunction.
    If you wanted to get a vintage look, you could select the video to Add Filter
    > Artistic > Old Film, and then adjust the sound with Add Filter > Audio Filter
    > Vinyl Effect. Filters can be toggled on and off in the Flowblade Tabs.


