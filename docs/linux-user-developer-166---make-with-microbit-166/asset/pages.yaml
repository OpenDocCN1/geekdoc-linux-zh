  md: '# Review


    # Image editors


    # In brief: compare and contrast our verdicts


    | Tool selection | Krita | RawTherape | ShowFOTO | GIMP |

    |---|---|---|---|---|

    | User interface | An amazing lineup of tools on offer that will amaze and frighten
    new users | Provides all the tools you need, with little else to help it stand
    out from the rest | There''s a great mix of both beginner and advanced tools to
    cater to everyone | New updates continue to expand and easy-to-use GIMP''s toolset
    and offer even more options |

    | Import options | Not as deep as Krita''s, but GIMP offers to import third-party
    brushes | One of the best programs for raw files that are often forgotten about
    | Some deoptions compete with the rest of the digikam but little | GIMP is the
    best for importing third-party fonts, brushes and tools part of its arsenal |

    | Extra features | Krita''s management tool is second-to-none, leaving you total
    in control | Tools are easy to find and the layout is easy on the eye for sure
    | Who needs a built-in project that would be as useful as this here | While aimed
    at advanced users, scripting options in GIMP are useful |

    | Overall | An amazing tool for digital art and design that really exceeded expectation
    | Good and easy to use, but does it stand up to the competition? | Best used with
    the rest of the digikam, but worth a look | No longer a pauper than Photoshop
    but a design weight in its own right |


    # AND THE WINNER IS…


    # Krita


    Krita requires something different from an image editor, but no matter if you''re
    a beginner or an editing enthusiast, there is no denying that Krita beats the
    rest of the competition. Admittedly, when launching Krita for the first time,
    the plethora of tools can be overwhelming, but there''s help on wherever you get
    stuck. Essentially it can be tailored to your own needs.

    In addition, Krita is far more customise than the competition it here. Both the
    editing window and sidebar have various elements applied when you want their tools
    to be moved and depending on your tastes. It is free available on the web whenever
    you need. Once you set up your perfect palette of tools that are just a quick
    click away, you should find it impossible to fail.

    When we went in-depth with the tools on offer we found it hard to find anything
    wrong. Brushes offer great preview menus that are much better than theirs, while
    the text tool has also been simplified to make it easier to apply words and numbers
    to your


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_83_0.png)


    Krita''s palette of brushes open up to some fantastic artistic techniques

    Images. Similar to Krita''s optimisation options, tools are adjustable to your
    needs. Dont need every brush on? No worries, you can remove them. Want to add
    colors to the existing palette? Import them in matter of seconds. It''s a level
    of control we''re not


    used to seeing in Linux programs and we help Krita. For GIMP it was a close second
    in this group and we intend to return to this group near the end of the year if
    anything has changed.


    +   - Oliver Hill


