  md: '# Tutorial Google AMP


    # # Improve website load time with Google Accelerated Mobile Pages


    # Learn how to use this in your website to improve the site''s load time and user
    experience


    Accelerated Mobile Pages, aka AMP, is a Google initiative that makes sure your
    website is optimised for mobile content and can load instantly. AMP is a way to
    build web pages for static content that renders fast. AMP uses several tags to
    achieve this: AMP HTML, JS, and AMP Cache.


    rules. First of all, an AMP HTML document should start with the `<!doctype html>`.
    The document should contain a top-level amp tag and body tags. While these are
    tags in HTML, AMP mandates that you should also add a `<link rel="canonical">`
    to the head that points to the original version of the page, if such a version
    exists. You must also include `<meta charset="utf-8">` and `<meta name="viewport"
    content="width=device-width,initial-scale=1">` tags in the head of the page. Also,
    add a `<script src="https://cdn.ampproject.org/v0.js"></script>` tag as the last
    element in the head which includes the AMP JS library. Make sure to add the boilerplate
    tag before the body tag. Here is how it works:


    Nitish Tiwari is a software developer with passion, who has high interest in open-source
    software. He also works as a moderator and author. In publications, he helps organizations
    adopt technology to meet their business needs.


    +   01 Introduction

    Tags in AMP HTML are regular HTML tags, with a few replaced with AMP tags to make
    patterns easy to implement in a performance-optimised way. For example, amp-img
    provides full script support in browsers that don''t support it. The script helper
    helps the browser decide the best usable size of image to load.


    # Resources


    https://ampproject.org/


    ```

    <amp-img src="small.jpg" srcset="medium.jpg 1000w, ..."

    ```


    Coming to JS, it allows a lot of performance optimizations too — among the best
    optimizations for the fact that it makes everything from external resources asynchronous,
    nothing in the page can block anything from rendering. Other performance techniques
    include the pre-calculation of the layout of every element on the page before
    resources are loaded and delaying CSS selectors.


    The last component is AMP cache. A proxy-based content delivery network for serving
    valid AMP documents. It fetches AMP pages and caches them to improve performance
    accurately.


    +   02 Create your AMP HTML page

    There are a few rules that dictate whether a document qualifies as AMP or not.
    Let us show you what


    ```

    <style is-amp-boilerplate body-webkit-animation:

    amp-start steps(1,end) and 1 normal;

    moz-animation:amp-start steps(1,end) and 1 normal;

    web-animation:amp-start steps(1,end) and 1 normal;

    keyframes-amp:from(visibility:hidden)to(visibility:visible);

    keyframes-moz:from(visibility:hidden)to(visibility:visible);

    keyframes-web:from(visibility:hidden)to(visibility:visible)}

    @supports-not(:is-amp-boilerplate) {

    webkit-animation:none;

    web-animation:none;

    animation:none;

    }

    style>

    <script>

    ```


    The accelerated mobile pages project provides only HTML specifications but cache
    support to help them render very fast


