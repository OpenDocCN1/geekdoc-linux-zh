  md: "Make sure there's only one of these style tags on your page, or more than one\
    \ is allowed in AMP. You can also style AMP custom elements using CSS:\n\n```\n\
    <style amp-custom>\namp-img {\n  border: 5px solid black;\n}\namp-img.placeholder\
    \ {\n  background-color: grey;\n}\n</style>\n```\n\n# 08 Configure analytics\n\
    \nAMP-analytics is also available as a custom AMP element. You can use the element\
    \ and start tracking your website traffic. The analytics element is used to measure\
    \ activity on an AMP document. The details concerning what is measured in JSON\
    \ and how data is sent to an analytics service is via a POST request. It comes\
    \ pre-configured to support many analytics vendors out of the box.\n\nFor example,\
    \ the following amp-analytics element configured to send a request to your example\
    \ when the document is loaded, and each time an amp-page tag is clicked:\n\n```\n\
    <amp-analytics>\n<script type=\"application/json\">\n  \"requests\": {\n    \"\
    pageview\": \"https://example.com/analytics?url=$url&title=${event.title}&account=$account\"\
    ,\n    \"event\": \"https://example.com/analytics?id=$eventId&label=${event.label}&account=$account\"\
    \n  },\n  \"vars\": {\n    \"account\": \"AC123\",\n    \"triggers\": {\n    \
    \  \"pageview\": {\n        \"on\": \"visible\",\n        \"event\": \"pageview\"\
    \n      },\n      \"trackerClicks\": {\n        \"on\": \"click\",\n        \"\
    selector\": \"a\",\n        \"event\": \"event\",\n        \"eventId\": \"42\"\
    ,\n        \"eventLabel\": \"clicked on a link\"\n      }\n    }\n  }\n</script>\n\
    </amp-analytics>\n```\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_46_0.png)\n\n\
    You can also add a name of analytics with the type attribute. This will help you\
    \ configure amp-analytics to the respective respect.\n\n# 09 Validation\n\nThe\
    \ AMP validation service detects that something is wrong with your page, it is\
    \ not discovered and distributed by third-party caches. So not only will you lose\
    \ the benefits of the cache, it's likely that your page will not be seen in search\
    \ results. You must validate your AMP pages before you publish and audit it. Finally,\
    \ the key to fast speed is in a way that can be validated using the Chrome browser.\n\
    \nTo validate AMP pages, open it from the file system using a local server like\
    \ Apache or Nginx. Once the page is loaded, go to the URL, open Chrome DevTools\
    \ console and check for validation errors. If you get some validation error, it\
    \ is easy to fix it with a Google search.\n\n# 10 How it works\n\nAMP pages only\
    \ allows asynchronous scripts. AMP pages cannot include any other JavaScript.\
    \ Interactive features are handled by custom AMP elements. The custom elements\
    \ may use JavaScript under hood, but they must be carefully designed to make sure\
    \ they don't cause degradation.\n\nAMP pages allow third-party JavaScript through\
    \ iframes. By restricting them we block the execution of the main page. Even if\
    \ they trigger multiple calculations, their tiny iframes have very little DOM.\
    \ Also, AMP resources are loaded so that the most important resources are downloaded\
    \ first. Images and ads are only downloaded if they are likely to be seen by the\
    \ user, above the fold, or if the user is to quickly scroll to them.\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_46_1.png)\n\
    \n* With the\n\nwww.linuxuser.com 47"
