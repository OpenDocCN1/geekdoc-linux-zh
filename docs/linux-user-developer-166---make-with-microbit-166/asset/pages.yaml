    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_7_0.png)


    **Gray Girling**

    Dr Gray Girling is a software systems designer and communications consultant now
    for Broadcom, Acme Computers and the Research Lab in Cambridge, UK. He has been
    involved with the Raspberry Pi since its inception, he''s the author of Raspberry
    Pi 2: Owner''s Handbook.


    > What was it like working in technology at a time when computers were transforming
    so radically?


    I don''t really think that transformation has come to a halt; it''s not like that
    happened 30 years ago, stopped! Today''s technology is still more exciting than
    it was only a few years ago, and it has always been. I notice that the wheel gets
    invented so often, but perhaps that''s not really either.


    So when did you start using the Raspberry Pi - yourself, and when did you become
    involved with the Raspberry Pi Foundation devices?


    I started using it early on, one of the small number of engineers at Broadcom
    in Cambridge who wanted to make new chips for people who buy them. This usually
    involves testing new bits of IP just so we can build and debug it. Raspberry Pi
    was one of these tools, the BCM2835, and the job of making it was substantial
    than usual because it was our first chip


    with an ARM in it. Interestingly the inclusion of the ARM was nearly an afterthought.


    This means I myself realized very early on: (when it was an FPGA, not a chip)
    brought up Linux, and ported drivers for both that myself, and it was so well
    documented the way that other engineers could use our new chip in development
