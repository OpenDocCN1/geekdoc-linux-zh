  md: '# Using Padlock


    Padlock takes a minimalistic approach to password management yet has all the very
    important features. Moreover the Padlock UI is minimalist so all the options are
    nearly hidden behind a sleek UI. As you launch Padlock via the Chrome app launcher,
    you will be asked to enter your password. If it is your first time, you will be
    directed to the re-enter password.


    Once the password is confirmed, you''ll be taken to the home vault. Here you have
    options to import your passwords, create a new entry, manage backups and restore
    them. The sync option lets you sync all your data devices if you create a free
    Cloud account. You can also create Record so you can use your user ID to add password
    to Padlock on device.


    While adding passwords, you can also use the password generator. Auto generates
    a fine tuned strong password with a specific number of special, numeric and capital
    characters. Padlock also comes with the ''Lock App'' feature that lets you lock
    Padlock with one click.


    # Password Safe


    Password Safe is a Windows-based standalone tool to help manage your passwords
    with ease. It allows you to store your passwords in a safe i.e. password database,
    create multiple databases for different purposes for one or several people. It
    is important to note that each database is independent and can be moved and used
    on different computers Password Safe is installed on the systems. The passwords
    are encrypted with an encryption key derived from the master password. However,
    the master password is not kept in the database.


    Password Safe installation is a Windows exe file double-click installation. During
    the install process you will be asked whether you like to go for Regular installation
    or Green Regular means just that— Green installation means the software makes
    use of a separate USB flash media device to ensure the passwords are portable,
    and does not use the Windows Registry. This helps make sure you are completely
    secure against any registry-related hacks. If you are not a Windows


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_30_0.png)


    # Using Password Safe


    After you open Password Safe, you''ll see a text field labelled ''Open Database'',
    which can be used to create passwords. The first time it is executed, you will
    need to create a password database. To start process, click the "New... button
    in the bottom-right corner. You will then be shown a dialog asking for the new
    password database entering a name, or accepting the default, click the Save button
    to go to the Combination setup.


    Once you choose to set a master password it will be used to access the passwords
    you will store in Password Safe encrypted database. Enter the same strong password
    twice, once in the Combination setup and once in Password Safe. Click OK button
    to set the master password for your new database. If password is simple, Password
    Safe will pop up and if you want to edit your entry or something else entering
    the database using the "Add New Entry" button. The entry forms


    contain information like username, passwords hidden notes and the URL, emails.


