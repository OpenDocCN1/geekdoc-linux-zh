  md: '# Python imaging library

    A complex imaging library works behind the scenes. The 4-Bot identifies the colours
    and location of each piece. Based on these calculations, it can work with the
    Max-Bot to provide the optimal move for that turn


    # Second hand claw

    The rail from a disassembled 3D printer helps move the on-board claw into different
    positions. It works in tandem with the Python interface designed by David, and
    has been aligned to make sure counters aren''t dropped in the wrong columns


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_65_0.png)


    # Complete servo control

    The primary servos used to control the various arm movements are powered by a
    PIXI board; one of the key benefits of this board is that it can support up to
    50 individual servos, allowing for more fluid movements from a-Bot


    # Minimax algorithm

    Every move that 4-Bot makes is based around the Minimax algorithm, which is ideal
