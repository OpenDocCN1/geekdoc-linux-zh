  md: "# Most of the tags in AMP HTML are HTML tags, few of the tags replaced with\
    \ AMP specific tags to make patterns easy to implement in a performance-optimised\
    \ way\n\nCustom fonts\nYou may include style sheets for custom fonts in AMP which\
    \ can be done via two ways: by linking to a web font provider or using the @font-face\
    \ inclusion, if your server supports CORS.\n\n# 03 Adding media to AMP HTML\n\n\
    We already looked at the script tag, and know that AMP HTML provides the element\
    \ amp-img to add images. There are several elements available to help you display\
    \ media types. Let us take a look at others, starting with images. amp-img requires\
    \ a width and height. It could look like this:\n\n```\n<amp-img src=\"responsive.jpg\"\
    \ height=\"193\" responsive=\"\"></amp-img>\"\n```\n\nTo add audio, include the\
    \ script:\n\n```\n<script async-custom=\"amp-audio\" src=\"https://cdn.amp.project/v0/amp-audio-0.1.js\"\
    ></script>\n```\n\nThe AMP runtime efficiently manages images, choosing to priority\
    \ resource loading based on the viewport position, system resources, connection\
    \ bandwidth, or other factors.\n\nThen use the amp-element:\n\nTo added images,\
    \ you can use the amp-anim element. It is similar to the amp-img element with\
    \ additional support for handling and playing of animated image formats as GIFs.\
    \ To include amp-anim in your page, first include the script:\n\n```\n<script\
    \ async-custom=\"amp-anim\" src=\"https://cdn.amp.project/v0/amp-anim-0.1.js\"\
    ></script>\n```\n\n```\n<amp-audio src=\"https://yourhost.com/myaudio.mp3\">\n\
    \  <div fallback>\n    <p>Your browser doesn't support HTML5 audio</p>\n  </div>\n\
    \  <source type=\"audio/mpeg\" src=\"foo.mp3\">\n</amp-audio>\n```\n\nThen we\
    \ have added image:\n\n# 04 Using video in AMP HTML\n\n```\n<amp-video width=\"\
    380\" height=\"300\" poster=\"my-gif.jpg\">\n  <source type=\"video/mp4\" src=\"\
    https://yourvideo.com/my-video.mp4\">\n  <div fallback>\n    <p>Your browser doesn't\
    \ support HTML5 video</p>\n  </div>\n</amp-video>\n```\n\nVideo is one of the\
    \ most common ways to monetise the web. AMP HTML takes care of this with its custom\
    \ element called amp-ad. With this custom element, ads are loaded like other resources\
    \ in AMP HTML. Here, no network is provided; JavaScript is allowed to run in-an\
    \ iframe from a different origin (iframe sandbox) as the AMP document and executes\
    \ JS inside that sandbox. Here is how it works:\n\nSimilarly, using the amp-video\
    \ element:\n\n```\n<amp-video width=\"380\" height=\"300\"\ndata-aspect-size=\"\
    300x258\"\ndata-pause-test=\"test123\"\ndata-src=\"ad-src\"></amp-ad>\n```\n\n\
    AMP requires width and height values to be specified for all resources. The AMP\
    \ ad type identifies the attributes that are automatically passed as arguments\
    \ to the code that eventually renders the ad. These attributes are required for\
    \ a given type of network. These attributes are and should be documented with\
    \ the ad network.\n\nwww.luxuker.com 45"
