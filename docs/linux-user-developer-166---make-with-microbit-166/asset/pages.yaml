    # # Project Four


    # # Make and code a simple LED torch


    **01 Connect the wires**nTake your microbit and remove it from any device that
    may be attached. Erase also the battery pack. Take two wires and attach one to
    the Pin Hole located above the hole and ensure it is secure. Now click the script
    so that the second wire is on the pin marked GND.


    **02 Connect the LED to the wires**nWhen connecting your LED to the wires, it
    is important to connect the LED to the ground. This is also known as the ''positive
    leg'' - attach this wire to the Pin 2 using the crocodile clip to hold the LED
    in place. Now select the GND pin and write the script to control.


    **03 Create the code**nStart a new script and change it to a more suitable (memorable)!
    Button A is used to turn the LED on. When the button is pressed, it writes to
    the pin, sending a small current through the attachment to the LED.


    **04 Turning the LED off**nClick the ''pin'' block, which brings up the ''digital
    write'' option. Then, enter the number of the pin that to be written: change the
    value from P0 to P2. Select Pin 2. The value after the number represents the state
    of the pin (0 represents Off and 1 represents On). Changing the value to 1 will
    trigger the current when Button A is pressed.


    **05 Turning the LED off**nTo turn it off, use the same block structure as above
    but replace the value with ''0''. First select the ''input'' block and click on
    ''button pressed'', which brings up the ''digital write'' pin option. Select this
    to enter the number of the pin to be written. Change the value from P0 to Pin
    2.


    **06 Compile and test**nRun the script to check for any issues. There is no LED
    indicator on the simulation, so you are check for syntax errors. Then compile
    and download the code, plug your microbit into the computer and copy the downloaded
    file over. Once written to your device, press Button A to see if it is working
    as expected.'
