  md: '# Feature Ultimate FOSS


    # # DESIGN AND ANIMATE VEX+ IN BLENDER


    GET IT IN UBUNTU STUDIO


    You may know about Blender already, perhaps as a tool for creating 30 figures,
    or titles... but it can do so much more than that. A quick visit to YouTube will
    see the software filling in the role of professional modelwork, as CGI! TARDIS
    or more traditional spaceships, weapons, and more. You can create complex elements,
    adding smoke or explosions or other VFX to a project, and producing design items
    that are too expensive to


    physically this issue. Unlike most of the other creative tools we''ve featured,
    however, Blender has a steep learning curve. While it is relatively simple to
    get started and find your way, it requires focus to translate into usable results.
    Short effects can be built, and they can be saved and reused later, this intensive
    aspect of Blender can prove challenging. Still, the high quality makes it worth
    it.


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_61_0.png)


    # ## Familiarise yourself with the interface


    # ## Tweak with Python


    Blender is likely to any application you''ve used, so familiarising with the UI
    is a vital step in getting results. To begin, with the standard toolbar menu split
    into two: half in the upper-left portion of the application, the other half at
    the bottom. Note, the positions of the various panels, like Object Tools and Dimensions,
    which can be docked or undocked, very high-resolution monitor will be needed to
    view all menus in expanded mode.


    A secret ingredient in Blender is its Python support, something that allows granular,
    script-level manipulation of objects. To get an idea of what is possible here,
    use the Add menu and have a look at the various entries. Here you will find Mesh,
    Lattice, Curve, and many objects and their various types, each of which has a
    labelled Python property. You can read this by hovering the mouse pointer over
    each item. Keep a pen and paper handy, just in case


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_61_1.png)


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_61_2.png)


    # ## Use the design


    # ## Give objects detail


    For visual effects, you can get started very quickly by taking advantage of the
    default tools on offer – the cube that''s presented to you when you open a new
    Blender project. By repositioning this cube on the horizon axis and resizing it,
    you can use it as the space for, say, an explosion to take place within. This
    is where Blender is at its most flexible. Rather than then building a 3D object
    from shapes, you''re creating the effect within an existing shape.


    With 3D model creation, whether you''re building an explosion or a laser blast,
    you''ll need to add detail, or the end product will be just a bland, opaque series
    of frames. Textures can be introduced using a model preset or custom brushes,
    and using the Texture Paint view. How the textures are applied depends on the
    brush and how the model is built: objects are repeated throughout a model, and
    it is possible to repeat patterns across linked areas.'
