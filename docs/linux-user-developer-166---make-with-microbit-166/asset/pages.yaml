    H6 octa-core-system-on-chip (SoC) used in mobile devices.


    Originally designed for smartphones and tablets, the Allwinner H6 is an implementation
    of ARMv8 LITTLE architecture. In mobile devices, using lower-power cores for day-to-day
    tasks extends battery life when computational power is needed — something that
    requires a clever scheduler to accomplish.


    to end up with your more important tasks running on the slower cores. In the bundled
    Android release, preset installed on the 8GB of eMMC flash, this isn''t a problem.
    The Linux version provided by CubieTech, however, is more than enough to benefit
    from the extra cores.


    The CubieTruck Plus scores the Sysbench CPU benchmark in 178 seconds to run eight
    simultaneous threads across the H6 cores, and just 25.38 seconds when all are
    assigned to a Raspberry Pi 3 Cortex-A53 chip, which is an impressive result: the
    Pi 3 is slightly slower — 182 seconds for the same test at 49.02 seconds.


    Other benchmarks confirm: the CubieTruck Plus scores 523 MFLOPS at the Linpack
    single-precision benchmark to the Pi 3''s 49.18 MFLOPS, with a memory bandwidth
    of 346.2MB/s and 402.3MB/s for the Pi 3.


