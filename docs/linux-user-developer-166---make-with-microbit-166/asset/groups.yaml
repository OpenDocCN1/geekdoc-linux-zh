    # # Raspberry Pi


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_70_0.png)


    # ## Which camera?


    Raspberry Pi projects that run on camera can easily work with any USB webcam if
    you don''t have to install drivers. However, the Pi''s camera will work without
    much trouble—you may have difficulties with USB webcam if the drivers aren''t
    easily available on the Pi. It''s the easiest development, you''ll enjoy more
    flexibility with a USB webcam with a long cable.


    # ## Test the camera


    You don''t need to set this project to find that the camera doesn''t actually
    work. Whether you''re using a USB webcam on the Pi, you''ll need to run a command
    to test it


    To confirm, use the GUI to /home/pi and view the image.jpg file. This is preferable
    to checking in the command line, as you can ensure the image is not corrupt.


    # ## Install motion


    The motion software, can be installed after update or using the Raspberry OS.


    # ## Auto-motion


    By beginning the motion configuration,


    +   - sudo nano /etc/motion.conf


    Here, we need to edit the software to start the camera Pi. By finding the value
    "daemon" and changing it to:


    +   - daemon on


    CTRL+X to exit, tapping Y to confirm you wish to save the file, and enter.


    Next, confirm the motion daemon works by restarting the raspberry Pi.


    +   - sudo reboot


    # ## Configure motion


    The next step is to configure the motion software. This means setting the frame-rate
    (how often an image is captured), resolution (larger images will take up resources,
    thereby slowing the motion) and the video bitrate.


    How you configure motion depends on model of Raspberry Pi you will be using for
    your project. First generation will have low-resolution images for a high-res
    best, you should probably use the Raspberry3.


    ```

    sudo apt-get update

    sudo apt-get upgrade

    sudo apt-get install motion

    ```


    Older versions of the "Starting motion daemon" error might not start automatically.
    To avoid this, you will need to run the update and upgrade. If you''re using the
    Pi camera, you will need another driver.


    ```

    motion version 3.2.4

    sudo nano /etc/motion/motion.conf


    # This distribution contains example file for motion.conf

    # This config file was generated by motion 3.2.12-1(20140202)


    ####################################################################################

    # Set daemon mode (0=off, 1=daemon) (default: 0)

    demon 1

    ####################################################################################

    # Set width and height of the image stream (default: 640-x 480)

    width 640

    height 480

    ####################################################################################

    # Set the rate at which frames are captured (default: 30 fps)

    fps 30

    ####################################################################################

    # Set the quality of the video stream (default: 1-63)

    quality 60

    ####################################################################################

    # Set the number of frames to be buffered per second (default: 0=unlimited)

    buffer 5

    ####################################################################################

    # Set the output directory (default: /var/lib/motion)

    output_dir /var/lib/motion

    ####################################################################################

    # Set the filename prefix for saved images (default: motion-)

    filename_prefix motion-

    ####################################################################################

    # Set the filename suffix (default: %Y-%m-%d-%H%M%S)

    filename_suffix %Y-%m-%d-%H%M%S

    ####################################################################################

    # Set the image output format (default: jpg)

    output_format jpg

    ####################################################################################

    # Set the stream resolution (default: 640)

    stream_resolution 640

    ####################################################################################

    # Set the stream bitrate (default: 2000)

    stream_bitrate 2000

    ####################################################################################

    # Set the stream codec (default: h264)

    stream_codec h264

    ####################################################################################

    # Set the stream port (default: 8001)

    stream_port 8001

    ####################################################################################

    # Set the stream encryption (default: 0)

    stream_encryption 0

    ####################################################################################

    # Set the stream password (default: none)

    stream_password none

    ####################################################################################

    # Set the stream username (default: none)

    stream_username none

    ####################################################################################

    ```


