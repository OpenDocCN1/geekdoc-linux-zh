    # Tutorial


    # Get alerts with the Raspberry Pi baby monitor


    Keep an eye on your little while they sleep, thanks to your Raspberry Pi!


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_69_0.png)


    Christian Cawley

    A A former IT and software engineer who has provided advice and instruction to
    computer and mobile users online. He covers the Raspberry Pi and Linux at makedof.com.


    While you''re setting down to enjoy your latest boxed, there''s always a nagging
    feeling at the back of your mind – is the baby asleep, or crying during hours?
    Surround sound tends to get in the way, which means we need to rely on baby monitors.


    While baby monitors are useful, the trend these days is more towards video baby
    monitors, in those cases that display footage on an app or by mobile browser.
    Throw in and you''ve got an incredibly useful tool – which you''ll be surprised
    to learn, the Raspberry Pi can do for a fraction of the cost.


    All you''ll need is a Raspberry Pi (the newer the better), and a USB webcam or
    the PiCam (the NoIR infrared version is recommended) and a device to view the
    streamed footage. Now you don''t need to be worried about baby again – just check
    your phone to see what they''re up!


    spend the necessary time planning the Pi''s position in relation to power sources
    and network connectivity.


    # 02 Enable the camera


    If you''re using the PiCam, this will be disabled by default. You can enable this
    in the raspi-config menu -> Preferences > Raspberry Pi Configuration. You should
    select the Interfaces tab and switch Camera to Enabled.


    Alternatively, run sudo raspi-config and choose option 6, Enable Camera. For USB
    webcams, use


    And test with:


    ```

    sudo apt-get install webcam

    ```


    # 01 Survey the bedroom


    Before you start installing and configuring your Pi, head to the baby''s bedroom
    and look around. Where will the Pi be? Is it within reach? Do you need to connect
    an Ethernet cable, or is the wireless signal strong enough? It''s vital at this
    stage to


