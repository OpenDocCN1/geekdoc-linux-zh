    ### GET IT IN UBUNTU STUDIO


    You may know about Blender already, perhaps as a tool for creating 3D figures,
    or titles... but it can do so much more than that. A quick visit to YouTube will
    see the software filling in the role of professional modelwork, as CGI! TARDIS
    or more traditional spaceships, weapons, and more. You can create complex elements,
    adding smoke or explosions or other VFX to a project, and producing design items
    that are too expensive to physically create. Unlike most of the other creative
    tools we''ve featured, however, Blender has a steep learning curve. While it is
    relatively simple to get started and find your way, it requires focus to translate
    into usable results. Short effects can be built, and they can be saved and reused
    later; this intensive aspect of Blender can prove challenging. Still, the high
    quality makes it worth it.


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_61_0.png)


    ### Familiarise yourself with the interface


    ### Tweak with Python


    Blender is likely similar to any application you''ve used, so familiarising with
    the UI is a vital step in getting results. To begin, with the standard toolbar
    menu split into two: half in the upper-left portion of the application, the other
    half at the bottom. Note, the positions of the various panels, like Object Tools
    and Dimensions, which can be docked or undocked; a very high-resolution monitor
    will be needed to view all menus in expanded mode.


    A secret ingredient in Blender is its Python support, something that allows granular,
    script-level manipulation of objects. To get an idea of what is possible here,
    use the Add menu and have a look at the various entries. Here you will find Mesh,
    Lattice, Curve, and many objects and their various types, each of which has a
    labelled Python property. You can read this by hovering the mouse pointer over
    each item. Keep a pen and paper handy, just in case.


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_61_1.png)


