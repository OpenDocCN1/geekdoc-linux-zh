  mdcn: "\n\n## 调试文件教程\n\nGNU Make 内置函数与 GMSL\n\n相反，这不仅适用于变量，还适用于内置规则（在 Make 术语中，它们被称为隐式规则）。现在，从我们的原始\
    \ makefile 中删除目标，只剩下两个目标：hold 和 clean。运行 `make clean` 将删除 hold，并使用 `-p` 标志执行 make；\n\
    \n使用使用内置函数，你可以编写强大的 makefiles。Make 随带的只包含了几个函数，就像本教程中使用的那些。如果你需要更多功能，只需在你自己的 makefile\
    \ 中使用它们即可。\n\n```\nmake -p debug\n```\n\n如你清楚看到的，hold 目标仍然被创建了且没有错误。`make.database`\
    \ 会告诉你原因：\n\n```makefile\nMAKEFILE+=\nGMSL=\nSHELL=/bin/sh\nTARGET=hold\n```\n\
    \n如果你对 GNU 足够熟悉，并且喜欢编写复杂的用户自定义函数和目标，你甚至可以利用它的特性来创建某种调试器。当然，不需要造轮子！已经有人做过了：它是针对任何目标的\
    \ GMSL 库构建过程，检查变量并列出更多断点。\n\n```makefile\nhold: owld\n# 隐式搜索已完成。\n```\n\n## 使用\
    \ GMD 工具链\n\n首先，下载 GNU 标准库 (GMSL) 和 GMD（参见参考文献）。反编译这两个文件并将 `GMSL.gmd` 复制到 GMD\
    \ 设置你的第一个断点。最后，将这些行添加到 makefile 中：\n\n根据 `make.database`，通过执行隐式规则命令，目标 `hold.owld`\
    \ 已成功创建。可能是什么规则？在 `make.database` 中搜索 `implicit rule.%o`。\n\n```makefile\ninclude\
    \ gmd\ninclude gnd\n```\n\n这条隐式规则告诉 make 如何从一组先决条件构建任何 .a 目标，换句话说就是如何编译 C 代码并创建对象文件。导出\
    \ make 数据库将显示所有变量和它们。但有时你不需要搞得那么大动作；也许只需获取 makefile 中定义的变量就足够了。因此，你可以利用内置函数创建另一个\
    \ `.PHONY` 目标。打开我们的第一个 makefile 并添加一个新目标 `focus`：\n\n为 hold 目标设置一个 GMD 断点。为了做到这一点，通过\
    \ `$(BREAKPOINT)` 变量改变其他。\n\n```makefile\n$(TARGET)=owld\n# $(BREAKPOINT)\n$(CC)\
    \ $(CFLAGS) = - $\n```\n\n```makefile\npvars:\n$(foreach VAR,$(VARIABLES)),\n\
    \  $(VAR)\n$(filter-out environment,$(origin VAR)),\n  $(info $(VAR)=$(value VAR)))\n\
    ```\n\n运行 make 命令，如果你使用 gdb(of)，将会得到一个提示符：\n\n```\n- make\nMakefile:9: GNU Make\
    \ Debugger\nMakefile:9: Building 'hold' from 'hold.owld'\nMakefile:9: First prerequisite\
    \ is 'hold.owld'\nMakefile:9: Prequisites 'hold.owld' are newer than 'hold'\n\
    ```\n\n不要忘记将此添加到 `.PHONY` 列表中：\n\n你想知道特定变量（例如 CC）的值以及它来自哪里吗？使用 GMD，结果是：\n\n```makefile\n\
    # .PHONY pvars\n\t\t\tmake pvars\n  .DEFAULT_GOAL=hold\n  CC=\n  CFLAGS=-gcc -O0\n\
    \  CURDIR=./Makefile/examples\n  MAKEFILELIST= Makefile\n```\n\n```bash\ni > cc\n\
    Makefile:9: CC has value 'gcc'\nz = cc\nMakefile:9: CC come from file\n```\n\n\
    现在，如果你运行你的 makefile，你将获得所有不属于环境或自动的变量：\n\n最后，当你认为一切正常时，你可以告诉调试器继续执行目标并结束：\n\n\
    ```\n > 0\ncc -gdb -O0 hold -o hold\n```\n\n## 系统而生的 Makefiles\n\n如前所述，makefiles\
    \ 的用途不仅限于构建目标。有时，makefiles 会包含一些不是为了创建的目标，而是为了某些目的。通过结合宏和用户自定义函数，这些目标在某种程度上将作为子程序的一部分。考虑下一个\
    \ makefile：\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_41_0.png)\n\n### GMD 允许中断任何目标的构建过程，检查变量并列出或删除断点\n\
    \n```makefile\nPING :== /bin/ping\nPING_OPTS := -c4\n\nPING_CMD = $(shell $(PING)\
    \ ($PING_OPTS))\n$(HOST) \\>/dev/null 2>&1; echo $$$\n\n# .PHONY: pinghost\nifneq\
    \ HOST,\n  $(Error usage: make -f pinghost.make)\nfi # PING_CMD=$(PING_CMD)\n\
    if [ \"$(PING_CMD)\" != \"\" ]; then\n  $(Info host $(HOST) is UP)\nelse\n  $(Info\
    \ the host $(HOST) is DOWN)\nfi\n```\n\n```bash\nmake clean\nmake -p > make.database\n\
    ```\n\n任何由于错误未构建的目标都将在 `make.database` 中报告。搜索字符串 \"Failed to be updated\"：\n\n\
