    > Haynes 保留将奖品更换为替代材料或特别优惠的权利。如果您没有收到，请与我们联系。


    他们仍然是“日常”体验：卧室里的一个青少年在交流方面完全没有任何选择。


    游戏也许是现在最相关的程序类型，但各种软件现在都曾被使用。为了获得新创作的回报，新程序员需要跨越的障碍高得多，而且无法实现我们认为的平常之事会令人沮丧。


    在本书中，我们采用食谱的方法来解释书中的项目如何相互构建，并让人们能够为使用 Pi 创建他们自己的“食谱”/餐计划。为什么要采用这种方法？


    显然，这与“树莓派”的计划有关，但更多时候它只是生产环境的一个良好比喻。我完全不知道在 176 页的书里对树莓派 2 做什么，所以我认为这是一种不同的方式，通过“食谱”帮助读者完成许多树莓派可以帮助他们做的任何事情（附带一个“餐计划”）。为了避免一本要么太技术或没有提供任何内容的书带来的沮丧感，我增加了更多的餐计划（Pi
    Web 服务器、YouTube Twitter 和其他在线项目）。


    在最前面，我放了一个关于组装新树莓派的章节。这是最基础的。


