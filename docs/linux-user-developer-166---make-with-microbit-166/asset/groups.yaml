    ### 图像编辑器


    Linux 社区拥有大量的免费和开源图像编辑器，但哪一个值得你投入时间呢？


    ### Krita


    通过多次更新，Krita 已经培养了一个日益扩大的狂热用户社区，成为全球最大、支持支持最好的图像编辑器之一。可扩展的颜色编辑器和创作工具只是今年发布的最新更新中两个突出的特性。


    ### RawTherapy


    在涉及到图像编辑的高级处理过程时，RawTherapy 被认为是市场上最优秀的工具之一。它的功能很大程度上围绕着 RAW 编辑展开，允许用户在对原始图像进行确认编辑之前查看编辑的预览。


