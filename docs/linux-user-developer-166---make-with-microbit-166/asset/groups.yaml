  - '[PAGE 53]


    # Ultimate FOSS


    # # ULTIMATE FOSS TOOLKIT


    Are you an artist, musician or director? Forget closed-source applications from
    Adobe — everything you need is free and open source on Linux!


    Linux doesn''t have its own version of Adobe Creative Suite, but that doesn''t
    mean you cannot complete creative video editing, image illustration or audio recording
    and editing projects on your Linux PC. Over the years, software has been released
    on Linux, almost all open source, and each being a realistic alternative to its
    closed source, well known brethren.


    For instance, GIMP has long been used as an open source alternative to Photoshop,
    and various video and audio editors can be found on Linux. On the whole, however,
    the world hasn''t really had a good run on Linux, until now.


    So, forget looking wistfully at your colleague or competitor''s Mac or Windows
    machine, discard the Wine and its occasional uselessness; limit your use of the
    Windows 10 you have stored on SSD. Now is the time to unleash your creativity
    on Linux, which offers powerful photos and altering images, to create your own
    digital art, to record and master multi-track music, to edit audio and video,
    and create digital animations and visual effects.


    However, if you are looking for a specific application, you might prefer to take
    a look at one of these seven distros, each put together to aid artists and musicians
    to focus on specific roles, which you find available in this month''s cover:


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_53_0.png)'
