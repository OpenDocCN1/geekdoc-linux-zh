    ## Flowblade 复合工具中的复合效果


    如果你想尝试更高级的转场效果，你可能更喜欢尝试 Flowblade。它表面上是另一个视频编辑应用，但 Flowblade 在处理混合和转场方面通过更成熟的方法，为这一领域带来了优越体验。


    这里有多种复合工具可用，它们可以进行不同程度的单独微调，为你的视频项目增添一种独特的润色感。复合效果非常出色，你可以在窗口中右键点击第一个片段并选择“添加合成器（Add
    Composer）”，在此之前调整两个片段的位置。所选效果的设置将列在合成器（Compositor）中。


    Flowblade 还提供了许多过滤器，可以应用于项目的视频和音频轨道。这些过滤器可以单独应用，也可以结合使用。如果你想获得复古效果，可以选择视频，然后点击“添加过滤器（Add
    Filter） > 艺术（Artistic） > 旧电影（Old Film）”，最后通过“添加过滤器（Add Filter） > 音频过滤器（Audio Filter）
    > 黑胶片效果（Vinyl Effect)”来调整声音。可以在 Flowblade 的标签页（Tabs）中切换过滤器的开启与关闭。


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_60_0.png)


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_60_1.png)


    ## 在 Lightworks 中管理编辑时间线


    使用 Lightworks 享受行业标准的编辑管理


    Lightworks 是 Linux 上进行视频编辑的范例——该应用曾用于《国王的演讲》和马丁·斯科斯塞斯的《星际幻迹》等获奖电影，且软件没有出现卡顿迹象。虽然你可能需要购买许可证才能使用如
    4K 支持、色度抠等高阶工具，但 Lightworks 的优势——其进化的编辑方法——仍然保留在免费版本中。


    将自己想象成一名电影导演。你需要从几个小时的素材、不同场景的不同拍摄 Take 中，创作出一部 90 分钟的作品。使用标准的线性编辑工具将这一切整合将非常困难；这就是为什么
    Lightworks 使用多条时间线，让你能够同时查看和编辑两个或多个场景，并配合“房间（room）”方法——这本质上给了你所需的任意屏幕——一个扩展桌面。


    ### 导入视频


    开始使用 OpenShot 2.0 意味着导入视频并寻找片段，将它们导入到时间线上。由于支持你选择的任何视频、音频和图像格式，所有内容都可以无问题地添加。如果发现无法导入的内容，首先检查它是否为有效文件类型，然后可以以不同的文件格式添加。


    ### 使用时间线


    一旦你的片段进入时间线并你开始管理项目和时机，时间线就提供了编辑视频、前后移动、标记以及用于捕捉镜头的剪辑（cuts）工具。一个标记为“效果（Effects）”的按钮可以让你快速访问转场或快速混合（Quick
    mixes），但这只是其提供功能的一小部分，其中还包括过滤器和标题。


    ### 添加效果并导出


    可以通过右键点击时间线上的片段并选择“效果（Effects）”引入更多效果。这在这里非常方便，让其他应用程序显得形形见��。以下是选择项目顶部的片段的方法。你完成的视频项目通常是一项简单的任务，但请确保你接触了所有的编辑选项！导出选项支持非标准帧率和高达
    1080p 的分辨率，可以导出文件或直接上传到 Vimeo。


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_60_2.png)


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_60_3.png)


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_60_4.png)


