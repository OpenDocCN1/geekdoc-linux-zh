    Vault）。点击库以显示存储的所有卡片。


    Padlock 是一个极简的开源密码管理器。作为 Chrome 应用、iOS 和 Android 应用，Padlock 只提供了最核心的功能。你可以在 Chrome
    商店中找到“Padlock”。


    Padlock 还可以作为 padlock Cloud 服务提供，允许你跨多个设备方便地同步密码数据。当你通过云端连接到 Padlock 时，只需输入你的电子邮件地址。每当你想要将设备连接到
