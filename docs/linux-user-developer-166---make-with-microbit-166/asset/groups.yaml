    can install it on Raspberry Pi to enable you to get around the fact that your
    ISP won''t give you a dedicated IP address without paying a hefty monthly. By
    installing a client that enables you to view the baby monitor outside your home
    network. Head to www.noip.com and check their base for details.


    ## Turn a Pi into a router using Raspberry Pi as a router


    Controlling the interconnects between various devices is paramount to keeping
    systems secure and safe. Sadly, most operating systems are closed - finding vulnerabilities
    in them is impossible. Running dedicated open-source operating systems is not
    for the average user, as they tend to demand high-end hardware. OpenWRT is an
    affordable and decent alternative that forgoes some of the complexities found
    in traditional operating systems. The community has ported the system to various
    routers: with a few hours to transform it into a lean configuration - even capable
    of controlling real-world hardware.


    ## What you''ll need


    - Raspberry Pi (V2B, V1B recommended)

    - Decent USB power supply

    - MicroSD Card + reader

    - USB Ethernet adapter

    - Optional, but recommended: Ethernet switch


    ## Set up


    Deploying an operating system to be in possession of a suitable image: due to
    differences in hardware, Pi 1 and 2 are targeted with different files which can
    be downloaded from http://raspberrypi.com/software/. For the Raspberry Pi 2 Model
    B+ or Pi 3, download the image-raspi2-bcm27.img. Once flashed, insert the SD card,
    connect the RP''s port to your PC and power up. Interested individuals can connect
    an HDMI monitor in order to see the boot process "live" after the host, and configure
    it to use a static IP address via the settings shown in the figure. Be aware that
    192.168.1.1 is a popular address for routers: if your Wi-Fi uses it, the network
    needs to be disabled during the following steps.


    ## Telnet or SSH


    The Telnet service is on by default. The first bit of work involves connecting
    to the Telnet client: the password is raspberry. Complaints about password strength
    could be ignored: it is not mandatory to change the password to whatever you want.
    Once the password is set, the Telnet service is disabled. From now on, your Open
    can only be controlled via ssh. On paper, the Embedded Wi-Fi would make a perfect
    access point. This is not the case. Reasons for it are the module has shown issues
    in latest tests. Because of the released driver code, going to trips, using OpenWRT
    is unsupported.


    ## Get connected


    Starting OpenWRT on a Raspberry Pi 2 will take about a half minute: the message
    shown in the figure will appear. Then, the ethernet port of the Raspberry Pi 2
    will be set to a fixed IP address of 192.168.1.1 and will allow connections from
    other networks.


