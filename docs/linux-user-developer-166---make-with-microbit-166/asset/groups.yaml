    # 评测


    ## CubieTruck Plus


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_85_0.png)


    CubieTruck Plus 在基准测试中胜过许多竞争对手


    ## 电脑


    ## CubieTruck Plus


    凭借八核处理器，CubieTruck Plus 是否值得上它比竞争对手单板电脑更高的溢价？


    | 特性 | 详情 |

    | :--- | :--- |

    | 处理器 | 全志 H6 八核 (4x 2GHz; Cortex-A53, 4x 1.9GHz; Cortex-A7) |

    | CPU | - |

    | GPU | PowerVR SGX544 |

    | 存储 | 8GB eMMC, SATA USB 2.0, micro-SD 卡槽 |

    | 内存 | DDR3L |

    | 网络 | 千兆以太网，2x4GHz; 802.11n Wi-Fi, 蓝牙 |

    | 接口 | 70 针接口，包括 HDMI, UART, GPIO, I2C, SPI, Audio, 微克风 |

    | 尺寸 | 111.6mm x 84mm x 19.92mm |

    | 额外端口 | 4x USB 2.0, 1x USB, DisplayPort, IRTo, ToA, I2C, Audio, 微克风 |

    | 购买渠道 | newcit.com (作为 CubieCube) |

    | 价格 | £199.95 |


    嵌入式设备专家 CubieTech 发布的最新开源硬件 CubieTruck Plus（也称为 Cubie 5）旨在改进其同名前身（已于 2014 年 8
    月评测）。CubieTruck Plus 采用了用于移动设备中更快的全志 H6 八核系统级芯片（SoC）。


    全志 H6 最初为手机和平板电脑设计，是 ARMv8 LITTLE 架构的实现。在移动设备中，使用低功耗核心处理日常任务，可以在需要计算能力时延长电池寿命——这需要一个聪明的调度器来完成，从而让你更重要的任务运行在较慢的核心上。在捆绑的
    Android 版本中（预装在 8GB eMMC 闪存上），这并不是问题。然而，CubieTech 提供的 Linux 版本完全足以从额外的核心中受益。


    CubieTruck Plus 在 Sysbench CPU 基准测试中耗时 178 秒在 H6 核心上运行八个并行线程，而当所有线程分配给树莓派 3 Cortex-A53
    芯片时，仅需 25.38 秒，这是一个令人印象的结果：Pi 3 的速度略慢——相同测试下为 182 秒对比 49.02 秒。


    其他基准测试证实了这一点：CubieTruck Plus 在 Linpack 单精度基准测试中得分为 523 MFLOPS，而 Pi 3 为 49.18 MFLOPS，内存带宽分别为
    346.2MB/s 和 402.3MB/s（对应 Pi 3）。


    全志 H6 允许使用多功能四核性能托管操作系统。然而，没有简单的方法可以区分高功耗和低功耗核心——这意味着完全可能。高性能硬件意味着高功耗。


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_86_0.png)


    四个高功率处理器核心与四个低功耗引擎相结合，以减轻任务负载并延长日常使用中的电池寿命。缺少内置散热片意味着板子摸起来仅微热


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_86_1.png)


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_86_2.png)


    ## 优点


    - 多线程软件性能出色，存储扩展方便，附带散热片以保持冷却，支持 Android

    - 价格几乎是树莓派 3 的四倍，而性能仅提供其左右；GPU 差异在使用中


    ## 缺点


    CubieTruck Plus 在网络基准测试中领先并不意外


    CubieTruck Plus 在网络基准测试中领先也不意外，除了仅支持 2.4GHz 和 5GHz Wi-fi 外，该设备的以太网端口——虽然受到 SoC
    的严重瓶颈限制——在 1000 USB 连接下表现最佳，达到 79.14MB/s 到 80.98MB/s。遗憾的是，它不能说网络至少有一个影响 SATA 端口的重大缺点。CubieTruck
    的 SATA 端口直接连接到 A20 SoC，而 H8 缺少 SATA——导致 Cubie 依赖其 USB 2.0 驱动器，增加了 CPU 开销并产生性能瓶颈。如果你选择光纤
    RAID 板，这会特别令人失望，该板允许两个 SATA 设备共享单个板载 SATA 端口。其他失望的还包括高功耗，板子在负载下电流为 1.32a，而树莓派
    3 为 0.58a，且高价很少通过额外配件得到证明，这些配件包括 USB 线、带 2.5 英寸硬盘的亚烯外壳、SATA 数据线和电源线，而且摸起来可能是热。更大的问题包括捆绑了过时的
    Android 4.2.2 版本，以及在评测进行时 Linux 缺少 GPIO 输出，这应该很快得到解决。


    - Gareth Helforth


    ## 总结


    CubieTruck Plus 比其前身更好，板子性能仅微热。价格不到 120 英镑，提供了足够的功能，除非你需要快速网络或 SATA 连接。


    ## 评测


    ## Parsix GNU 8.5


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_87_0.png)


    ## Parsix GNU 8.5


    Parsix 的最新更新能否证明它仍然能跟上节奏？


    Parsix GNU 是一个成功跟上时代的发行版之一，不断改进其功能集以满足用户群。尽管面临许多其他版本的竞争，其最新的 8.5 更新再次证明了为什么它值得用户尝试。


    - 硬盘 1.2GB

    - 存储 4GB

    - CPU 至少双核

    - 购买渠道 www.parsix.org


    尽管安装程序对新手并不友好，但基于文本的 Xialog 菜单可以很好地完成任务。还包含了根选项和分区硬盘。当然，文本安装程序并不容易上手，所以某些用户最初可能需要额外的帮助。但除此之外，安装速度很快，且没有冗余使得速度降到最低。GOME
    桌面通常非常耗内存，因此看到 Parsix 对内存的影响如此其微令人惊讶。系统在峰值时仅使用 75MB 内存，它运行非常流畅


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_88_0.png)


    ## 优点


    - 其极简的方法为用户提供了一个绝佳的画布，没有复杂的菜单干扰。


    ## 缺点


    - 虽然功能齐全，但捆绑的一些软件并不吸引眼球。你可能会发现它并不适合你。


    ## 总结


    如果你以前用过 Parsix 的任何版本，你会感到宾如归。但如果你是 Linux 新手，你可能会觉得它平平无奇。www.linuxuser.com


    '
