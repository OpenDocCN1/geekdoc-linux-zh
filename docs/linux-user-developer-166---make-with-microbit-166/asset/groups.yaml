    ## 免费软件评


    ## 音乐播放器

    Clementine 1.3.1


    弃用你发行版默认的播放器可能会有所帮助。


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_89_0.png)


    Clementine 一直以来持续改进；变得更加稳定，并仔细地改进功能。Amarok 项目一直以来因其快速方便的集合管理而成为理想选择，因为开发者们专注于通过简单界面播放数字音乐的核心优先事项。


    由于提供了 Fedora 和 Ubuntu 版本的软件包，很容易就能在任何基于 Red Hat 或 Debian 的发行版上安装最新版本。启动过程非常简单：打开程序后，创建一个新的播放列表并添加文件。虽然你可以拥有多个播放列表，但只需点击几次即可执行默认操作，而且界面直观。


    最后，关于集成、播放列表、播客发现，因此对于那些喜欢这些艺术家和歌曲作曲家的人，Clementine 添加了新的歌词支持，以及一些进一步的完善——你也可以对其进行完善（我们建议这样做），你会发现它的胜出之处是简单和响应迅速，你可以尽情享受音乐。


    例如，在下载 Haskell 的程序或 MP3 时，默认行为仍然存在旧 Bug，尽管不再像过去那样容易崩溃。它不具备竞争对手插件的功能。


    ## 非常适合...

    当你想要简单地处理音乐时。

    clementine-player.org/


    ## 编程语言

    Idris 0.1.1


    欢迎来到依赖类型的世界！


    Idris 是一种带有依赖类型的通用编程语言。类型可以依赖于值；作为一种一类语言结构，它们可以像其他值一样被操作。这在官方教程中得到了实践验证，作为任何解释器的示例，其中可以对类型进行注释。


    ## 优点

    比 Agda 更实用，并且有相当的文档支持。支持多次备份。


    虽然是一门相对新的语言，但还有其他几种替代方案，大多数人对 Haskell 或 OCaml熟悉。在这样的起点下，Idris 迅速证明了自己作为一种语言的价值。虽然目前：当今的功能性编程语言正在为未来可能的独立奠定基础，因为我们正努力让程序适应解耦的、处理器（或多机器）世界，例如
    Idris 通过对代码签名进行类型检查，作为代码正确性的保证。


    安装简单，使用 `haskell cabal && install idris`。从任何使用精密算术库 (GMP) 的项目，你都可以编译 Idris，或者通过交互式提示符尝试，它可以检查类型并生成字节码以实现快速编码。尚未准备好投入生产，但比
    Agda 等依赖类型语言功能更多，值得一看。


    ## 缺点

    对于不熟悉 Haskell 或 OCaml 的人来说很新奇。不支持自托管，仍在开发中。


    ## 非常适合...

    任何对功能编程前沿感到感兴趣的人

    idris-lang.org/


    ## AV 文件数据显示


    ## MediaInfo 0.785


    AV 文件的技术、格式、音频和编码、比例和标签数据。


    音频和视频文件包含了大量关于它们的信息、编码和容器格式，不需要播放即可获取文件名和 MediaInfo。


    支持的视频格式包括 MPEG-1/2 Video、H.263、MPEG-4（包括 DivX, Xvid, H.264/AVC, HEVC 和 Fv1）。音频格式
    MP3、AAC、DTS 和 FLAC 支持字幕格式，以及大多数容器——包括未保护的蓝光，MediaInfo 涵盖了这些媒体。重型工作由 mediainfo
    完成，同时提供了命令行和 GUI 版本的 MediaInfo，libznfo 也已在项目网站上针对所有主要的 GNU/Linux 集合进行了预包处理，我们在
    Debian Jesse 结束时看到的某些速率让我们感到惊讶。


    该应用的 GUI 版本可以打开文件或目录并显示所有信息。如果你需要快速扫描大型集合以检查质量或控制、按格式查找并以各种格式报告，而 GUI 包含了带有每项可用信息的列表，并有自定义其他输出格式的机会。


    ### 优点

    可以快速洞察音频视频的标签和技术格式


    ### 缺点

    如果内容值得一读，它不会让你付出代价！落后于


    ## 非常适合...

    处理媒体的播客主

    mediaarea.net/en/MediaInfo


    ## 棋类


    ## gShogi 0.5.0


    准备好接受新挑战了吗？

    学习象棋（Shogi）。


    象棋——日本象棋，或将棋的游戏——与国际象棋有关，但在元素上有所不同，这使其在初期就能快速进展，例如棋子的升格，以及将被捕获的棋子返回棋盘供对方使用的能力——这可以改变游戏的平衡。


    网上有很多非常好的示例，但如果你想开始，你还需要一个棋盘对手——Shogi 在这两个方面都能为你提供帮助。事实上，它为你提供了对手选择——不是在等级方面，而是允许你选择使用内置的基于
    GNU/Shogi 的引擎，还是使用你自己的 Shogi 引擎。


    这个新版本是 Python 3 和 PyGo 的一部分，具有新的棋子和配色方案。棋子有许多颜色可选，并且可以加载自定义主题。另一个对新手友好的功能是让赛——针对
    AI 的先发优势。如果你真的想知道是如何做的，可以从 Shogiview 网站以 GSN 格式记录游戏——从我们的 Shogi 页面链接——并在内部进行学习。


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_90_0.png)


    '
