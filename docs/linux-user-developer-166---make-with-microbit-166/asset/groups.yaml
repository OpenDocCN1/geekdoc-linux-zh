    ## digikam 的内置编辑器与其他软件相比如何？


    # GIMP


    ## 这位备誉已久的开源图像编辑之王一如既往


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_82_0.png)


    - 使用属性部分可以更详细地查看特定图片的细节

    - 尝试 GIMP 令人惊叹的色板，为你当前正在编辑的图片寻找合适的组合


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_82_1.png)


    ### 工具选择


    手头既有适合初学者也有高级用户的工具，组合非常好，这里的工具恰好让这两类读者都感到满意。有些工具的功能非常基础，可以说可以与其他工具结合使用，而不是对它们进行个性定制。我本希望能看到更多预览工具，但它使用起来非常快速。


    ### 工具选择


    随着每次更新，GIMP 的工具库不断扩充，受益最多的是用户。其提供的选择范围是无与伦比的，虽然提供的功能对某些用户有所益，但还有一些需求尚未满足。不过，这是一个很好的工具，是
    GIMP 诚意呈现的。


    ### 用户界面


    这是另一个采用极简主义处理 UI 并使其运行良好的例子。你的照片库位于左侧，编辑工具位于右侧，一切都一目了然，真的没有什么复杂的地方。这是我们在一些正在测试的程序中也能看到的风格。


    ### 用户界面


    尽管功能众多，GIMP 很好地保持了内容的井井有序且相对容易查找。虽然没有直接的工具来定制布局，但可以删除和添加部分以让界面适应你的需求。然而，一个小小的遗憾是缺乏对某些工具制作内容的自定义。


    ### 导入选项


    作为 digikam 套件的一部分在一定程度上扩展了 ShowFOTO 的功能集。然而，导入编辑工具的选项直接指向程序本身。我们完全预期随着 digikam
    的持续增长，ShowFOTO 将变得更加强大。


    ### 导入选项


    无论你想向 GIMP 导入什么类型的工具，它可能都支持支持。我们特别欣赏它处理文件导入的方式，允许用户在项目中添加各种格式（OpenType 和 Type！）。初学者应该查看
    GIMP 网站上的指南列表以获取简单的教程。


    ### 特色功能


    如果你真的想深入处理图片，ShowFOTO 的属性系统值得检查一下。它包含了图片类型和深度的所有信息，还可以编辑拍摄图片时的精确细节。如果你是从零开始创建图像，则将用不到这些功能。


    ### 特色功能


    对于 Linux 用户来说，可以通过各种形式的脚本访问 GIMP 的核心功能是一个巨大的加分项。目前脚本环境的选择相对有限，新版本的 GIMP 拥有部分 API，允许访问可以添加到你的项目中的广泛模块。


    ### 总体评价


    > 作为一个独立产品，ShowFOTO 落后于竞争对手，但当与 digikam 套件结合使用时，它表现良好。如果你追求极简界面，它绝对值得尝试。


    ### 总体评价


    GIMP 拥有忠实的追随者并不意外——它持续提供高质量的工具，并有足够的空间来对你决定加载的任何图像进行转换处理。


