    # 开源你的 Linux 新闻与观点来源


    自从 ICT（信息通信技术）大纲改变以来，情况不会变糟，但我担心我对方面的经验较少，因此批评者的意见可能不像我写第一版时那样针对性。


    如今，孩子们已经有了手机，可能还有一台游戏机和一台笔记本电脑——他们不需要另一台电脑了。但问题是，他们并不真正知道自己的笔记本电脑和手机是如何编程的。事实上，游戏在他们生活中的地位已经根深蒂固，这与编程并没有太大关系。


    树莓派 Zero 极其便宜，甚至一个孩子都能买得起（如果他们能买到的话）。树莓派将占据孩子们在编程和控制一切方面的大，如果他们需要，会有大量的支持。对于那些有爱好并想要独立开发
    IT 技能的人来说，大门已经敞。只要你有一台树莓派，开始开发自己的 IT 技能就足够入门了，这也是我热爱树莓派的原因。


    你曾为 Actors 工作，他在 20 世纪 80 年代与 BBC 的教育合作而闻名。你为什么认为我们的节目会改变你当时提到的大纲？


    自 BBC Micro 以来发生了许多变化，这在本质上是财务上第一次可以在家里拥有一台电脑的时候。最初提出 BBC Micro 的体验与今天在电脑伴随下成长截然不同。那时有了新的一代，但现在只有对从众的接受。


    简单来说，家里有一台电脑永远不足以详细理解；但超越任何人的目标是，如果我们想教育下一代，我们必须邀请他们*现在*就开始玩；现在我们必须邀请所有人来玩其中的一些。对于所有这些，制作一些引人入胜的东西并不可能引导他们使用电脑、平板电脑、手机甚至更多（如手机应用）。与此同时，为了这样做的回报，我们付出了。


    从以前，人们玩的游戏是平台——接蛇蛇或乒乓球——这是对那种体验的基础复制。那是普通可以实现的。现在，最好的游戏提供了沉浸式的体验，却像单作者或小镇规模的专家在声音、动作、特效、音乐、游戏性、图形等领域创作的莱坞电影一样丰富。


    书中的一个项目解释了如何创建一个对手机推文反应的聊天机器人。这本身就是一个有趣的项目，但由于树莓派页面充满了大量手工标注的截图，它更加先进，这些截图证明了各种教育成就。例如，作者能够检测并纠正
    Microsoft Word 中显示的错误信号。一个显示红色波浪线；一个显示建议框；另一个显示更后的文本。


    这项工作是枯燥的，在专有软件上进行，并以一种神秘的方式开发，完全与 IT 行业脱节……但是，这门课程最关键的方面是这些孩子们渴望了几个小时的机会；孩子们现在会知道编程吗？理解操作系统或编译器如何工作吗？或者对通信有初步了解吗？他们将拥有一个在学校里被避开的话题，并将那些对计算感兴趣的人视为奇怪的外星人。


    ## 赢取五本《树莓派 2 所有者工作手册》之一


    我们将向五位开始接触编程和计算世界的幸运读者送出一本 Haynes 出版的最新新书：《树莓派 2 所有者工作手册》包含了让你自己的自己的小型电脑启动并运行的逐步指南。


    该手册涵盖了树莓派 2 的所有方面，介绍了各种型号以及 Zero 型号。通过引导读者完成硬件配置和编程的全过程，该手册提供了一系列“食谱”，展示了树莓派 2
    的多功能性。


    为了获得机会，请将您的姓名和联系方式发送至 hello@raspberry.co.uk，并附上对以下问题的回答：


