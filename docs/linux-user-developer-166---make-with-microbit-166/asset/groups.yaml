    ## 04 Filter by TCP state


    A TCP connection can have many different states, so you may want to filter by
    state or exclude keywords found by identifier. The state filter displays output
    that matches the identifier, while the exclude keyword excludes the output that
    does not match.


    The available states are: syn-sent, syn-recv, fin-wait-1, fin-wait-2, time-wait,
    closed, close-wait, last-ack and closing. So, for viewing all established IPv4
    connections you should execute the:


