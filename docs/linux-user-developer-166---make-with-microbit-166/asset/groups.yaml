    ### 在 UBUNTU STUDIO 中获取


    你可能已经了解 Blender 了，也许是作为一个创建 3D 模型或标题的工具……但它的功能远不止于此。快速访问一下 YouTube 就会发现该软件承担着专业模型
    制作（CGI）的角色！如 TARDIS（奇异博士中的时光梭机）或更传统的飞船、武器等。你可以创建复杂的元素，为项目添加烟雾、爆炸或其他特效，并制作出物理上制作过于昂贵的设计物品。然而，与我们介绍的大其他创意工具不同，Blender
    的学习曲线非常陡峭。虽然起步和找到方向相对简单，但需要集中精力才能转化为可用的结果。短特效可以被构建，并且可以被保存并在稍后重用；Blender 的这种密集性方面可能具有挑战性。尽管如此，高品质使得它值得投入。


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_61_0.png)


