    \ piece of software in its repository, to use a different compiler, we need to\
    \ set different compilers to generate the binary, and so on. More than that, the\
    \ compilation becomes something like CMake, or among others. GNU Make is a powerful\
    \ build-system that you need to debug your executables.\n\n```\n$(TARGET): hworld\n\
    $(CC) $(FLAGS) -o $@\n\nhworld: hworld.c\n$(CC) $(FLAGS) -c\n\n.PHONY: clean\n\
    clean:\n\trm -f $(TARGET)\n```\n\nCastigli is a software engineer who provides\
    \ research in Spain. He writes about debugging, and more at debug.org. GNU Make\
    \ is a powerful build-system that you need to debug your executables. Projects\
    \ are all about a good understanding of writing and debugging makefiles. Targets,\
    \ files, must be created so that other targets can be generated. Generally speaking,\
    \ most errors are due to badly written makefiles. There are some remarkable out-of-the-box\
    \ that can help us with these annoying issues. But GNU Make is not to blame for\
    \ compilation; a poorly written Makefile. Use GNU Makefile functionalities for\
    \ debugging\n\nThe following is a simple Makefile in charge of building a Hello\
    \ World program:\n\n### Resources\n- GNU Make http://www.gnu.org/software/make/\n\
    - GNU Debugger http://www.gnu.org/gdb/\n- GNU Make Standard Library http://www.gnu.org/software/make/\n\
    \n```\nTARGET = hworld\nCC = gcc\nFLAGS = -Wall -g\n\nhworld: hworld.o\n$(CC)\
    \ $(FLAGS) -o $(TARGET)\n\n.PHONY: clean\nclean:\n\trm -f $(TARGET)\n```\n\nIf\
    \ you run make command, two targets will be created:\n\n```\nmake\ngcc -g hworld.c\
    \ -o hworld\ngcc -g\n\n```\n\nSo far our simple Makefile is not going to give\
    \ you much trouble. But what if we have a more complex Makefile? Imagine one consisting\
    \ of hundreds of commands for dozens of targets (libraries, binaries, documentation)...\
    \ Don't worry, the following simple Makefile looks like this:\n\n```\nTARGET =\
    \ hworld\nCC = gcc\nFLAGS = -Wall -g\n\nMAKE: $(MAKE_VERSION)\n\n$(TARGET): $(TARGET).hworld\n\
    \t$(CC) $(FLAGS) - $@\n\n.PHONY: clean\nclean:\n\trm -f $(TARGET)\n```\n\nRight\
    \ targets by using built-in functions (the left), and using make as a scripting\
    \ language to learn the language (the right).\n\n```\nclean:\n\tDEFAULT_GO=hworld\n\
    \tCFLAGS=-g0\n\tMAKEFILE=Makefile\n\tmake $(DEFAULT_GO)\n\trm -f *\n```\n\n###\
    \ Remake\n\nMakefile looks more like a debugger than GMD. Instead of using Make\
    \ capabilities for debugging, it uses its own representation. On GNU/Linux distributions\
    \ you can install it via your package manager. For example, on Debian you can\
    \ install with apt-get. To debug with remake, run `make --target=debug`.\n\n```\n\
    $(TARGET): hworld\n$(CC) $(FLAGS) -o\n\nRunning commands for clean\nrm -rf $(TARGET).o\n\
    ```\n\nAs you can see, we have added different calls to the build function. This\
    \ function allows us to put a message when we make the same. Now makefile.debug\
    \ and re-run with the -F flag so that\n\n```\nmake -F Makefile.debug\nMakefile.debug:6:\
    \ Target: hworld\nMakefile.debug:11: Target: hworld\nMakefile.debug:11: Target\
    \ clean\nMakefile.debug:12: Target: hworld\ngcc -ggdb -o hworld.c\nMakefile.debug:13:\
    \ Commands for hworld\ngcc -ggdb -o hworld\n```\n\nThis is quite a simple command,\
    \ but you will not be that lucky sometimes. Because the shell will be parsing\
    \ and executing commands, the way it interprets the special character # which\
    \ is parsed as a comment, to actually expand the command that will finally be\
    \ executed. Get back to your previous make and comment out the clean target:\n\
    \n```\n# rm -rf $(TARGET)\n```\n\nOnce this is done, call Make to clean the target:\n\
    \n```\n# make clean\n# rm -rf hworld\n```\n\nThese changes allow you to follow\
    \ the Make way during the building process, but it updates the targets. If you\
    \ are interested in knowing what sort without actually performing the commands,\
    \ a dry-run like `make -n` will also help you.\n\nNow you have the hworld and\
    \ hworld targets on, run Make with the target as a parameter by another execution\
    \ of the target with the -F flag.\n\nSo now, instead of running the command, the\
    \ variable $(TARGET has been expanded and the line it was parsed by the shell.\
    \ The target has not actually been executed yet.\n\nGNU Make uses an internal\
    \ database to parse the makefile and build the targets. Using the -F flag from\
    \ the command line, you can see this internal representation. This can be helpful\
    \ to debug what is happening sometimes. For example, comment out CC = gcc in the\
    \ first make and then make the command to make sure the targets hworld have not\
    \ been already made this way.\n\n```\n# make\ngcc -ggdb -o hworld.c\ngcc -ggdb\
    \ -o hworld\n```\n\nIf you look inside the directory where the makefile resides,\
    \ the hworld and hworld targets are nowhere to be seen. Now Make will show you\
    \ the commands that will be executed in order to create them. For each target,\
    \ several commands will be executed to create that target. For our particular\
    \ target, named in the sample, the shell will\n\n```\n# make -p database\n```\n\
    \nThis will enter the GNU Make database file. Open it with your favourite ASCII\
    \ editor. Look without ever setting your preferred compiler in the makefile, the\
    \ targets have been built anyway, this time using the CC command (which, in turn,\
    \ is a link to the gcc compiler):\n\n```\n# rm -rf $(TARGET).o\n```\n\n```\nCC\
    \ -ggdb -o hworld.c\nCC -ggdb -o hworld\n```\n\n> GNU Make sets default values\
    \ for variables, like $(CC). Using the search facilities of your, look for the\
    \ string $(CC):\n\nSo by omitting the variable in makefile, we have not overridden\
    \ its value and the default one has been\n\n```\n# default\nCC = cc\n```"
  mdcn: "\n安装好 Linux 后，你可以使用 `mkswap` 命令创建它。让我们通过一些示例来说明这一点。这将 `sda6` 格式化为交换分区：\n\n\
    如果我们需要将 `/dev/sdb1` 挂载到现有的目录 `/mnt/my_mount`，则可以使用以下命令：\n\n```\n$ pswayam@pswaysam-VirtualBox:~$\
    \ sudo mkswap\n/dev/sda5\n```\n\n```\n$ pswayam@pswaysam-VirtualBox:~$ sudo mount\n\
    /dev/sdb1 /mnt/my_mount\n```\n\n这将检查你的交换数据中是否存在坏块：\n\n```\n$ pswayam@pswaysam-VirtualBox:~$\
    \ sudo mkswap -c\n/dev/sda5\n```\n\n我们可以使用 `-t` 选项来指定要挂载的文件系统类型，如下命令所示：\n\n```\n\
    $ pswayam@pswaysam-VirtualBox:~$ mount -t ext4\n/dev/sdb1 /mnt/my_mount indicates\
    \ that we need to mount an ext4 file system /dev/sdb1 /mnt/my_mount\n```\n\n一旦你创建了交换分区或交换文件，你就需要使用\
    \ `mount` 命令使用你创建的交换区域。\n\n为了卸载文件系统，我们使用 `umount` 命令。你可以使用设备名或挂载点来挂载文件系统。让我们考虑通过设备名卸载的示例：\n\
    \n```\n$ pswayam@pswaysam-VirtualBox:~$ sudo umount\n/dev/sda5\n```\n\n通过挂载点卸载：\n\
    \n```\n$ pswayam@pswaysam-VirtualBox:~$ sudo umount -v\n/dev/sda1\n```\n\n```\n\
    $ pswayam@pswaysam-VirtualBox:~$ sudo mount -v\n/mnt/my_mount\n```\n\n这将在 `/dev/sda1`\
    \ 分区开启交换。\n\n需要注意的是，如果设备正忙忙，则卸载将失败。在 Linux 环境中，当另一个进程完成并释放文件系统后，你可以使用懒卸载（lazy）命令强制执行，并使用特定命令扫描文件系统。\n\
    \n系统会提供更详细的信息。从文件系统管理的角度来看，理解一个文件非常重要：`/etc/fstab`。当你创建或格式化文件系统时，该文件会自动设置并更新。其他文件系统也可以设置为在启动时挂载或手动挂载。\n\
    \n我们正在展示使用这些特定命令的一些示例。\n这将扫描磁盘以查找：\n\n当你想要为硬盘或分区创建任何条目时，你需要编辑 `/etc/fstab`。远程文件系统（如\
    \ NFS 和 Samba）可以添加到 `/etc/fstab`，以便在启动时或之后自动挂载文件系统。以下列表描述了 `/etc/fstab` 中的一些文件：\n\
    \n```\n$ pswayam@pswaysam-VirtualBox:~$ sudo badblocks\n/dev/sda1\n```\n\n- 设备名\
    \ - 文件系统\n- 文件系统检查 - 此字段中的数字表示是否需要使用命令对文件系统进行检查\n- 挂载点 - 可与 `mount` 命令配合使用的各种选项\n\
    - 挂载点 - 包含从挂载点到目录树结构的所有数据。\n\n与 `mkfs` 似的，`badblocks` 命令是系统特定工具的前端。通过简单地向分区添加磁盘设备名，你可以使用如下所示命令按分区检查\
    \ ext4 文件系统。\n\n理解我们如何使用 `mount` 命令挂载文件系统至关重要的。以下命令将仅列出特定文件系统的挂载条目：\n\n```\n$\
    \ pswayam@pswaysam-VirtualBox:~$ sudo badblocks -v\n/dev/sda1\n```\n\n```\n$ pswayam@pswaysam-VirtualBox:~$\
    \ mount -t ext4\n```\n\n如果你不需要用更详细的信息显示 fs 版本号，请使用 `-T` 和 `+options`\n\n```\n\
    $ pswayam@pswaysam-VirtualBox:~$ mount -TV fs\n/dev/sdb1\n```\n\n正在使用的文件系统详情\n\
    空间不足是一种令人恼的体验，在你的服务器上也可能是一个问题。要获取有关文件系统的更多详细信息，我们可以使用 `df` 命令来了解可用空间和使用空间。命令显示了特定分区消耗了多少空间。挂载的文件系统提供了更多信息。\n\
    \n## 调试 Makefile\n\n在一个充斥预编译二进制包的世界里，有时你仍然需要面对 GNU Make 构建系统的复杂性。\n\n任何 GNU/Linux\
    \ 发行版都有包管理器，里面充满了编译好的二进制文件，这使得安装新软件成为轻而易举的事；然而，有时我们需要从源码编译，因为包管理器的仓库中没有某个特定的软件，或者为了使用不同的编译器，我们需要设置不同的编译器来生成二进制文件等等。不仅如此，编译变得类似于\
    \ CMake 或其他工具。GNU Make 是一个强大的构建系统，你需要它来调试你的可执行文件。\n\n```\n$(TARGET): hworld\n\
    $(CC) $(FLAGS) -o $@\n\nhworld: hworld.c\n$(CC) $(FLAGS) -c\n\n.PHONY: clean\n\
    clean:\n\trm -f $(TARGET)\n```\n\nCastigli 是在西班牙提供研究的软件工程师。他编写关于调试的内容，更多请见 debug.org。GNU\
    \ Make 是一个强大的构建系统，你需要它来调试你的可执行文件。项目取决于如何良好理解编写和调试 Makefile。目标（Targets）和文件必须被创建，以便生成其他目标。通常情况下，大多数错误都是由于\
    \ Makefile 写得不好。\n"
