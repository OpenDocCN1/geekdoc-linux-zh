- md: "\n# Languages and editors\n\nChoose a programming language that meets your\
    \ needs.\n\n# Code Kingdoms\nJavaScript\n\nwww.microsoft.co.uk/its\n\nA drag-and-drop\
    \ editor where you select blocks of code and drag them wherever you want. Building\
    \ up your program. You can switch between blocks and plain text in order of development\
    \ of programs as you started. This makes this the most suitable for beginners.\n\
    \n# Microsoft Block Editor\n\nBlock editor\n\nhttp://github.com/spfx72\n\nThe\
    \ block editor is an advanced visual, drag-and-drop interface where you snap code\
    \ lines together. It allows the creation of functions and properties, which enables\
    \ you to create more complex and controls. You can also convert the code into\
    \ fully compatible Touch Developers.\n\n# Microsoft Touch Developer\n\nTouch Developer\n\
    \nwww.microsoft.co.uk/td/contents\n\nTouch Developer is both a text-based editor\
    \ and designed for touchscreens. It works across a range of devices including\
    \ phones and tablets. It also supports keyboard and mouse inputs and lasts a wide\
    \ range of functions and code.\n\n# Connectivity at a glance\n\n# Python\n\n#\
    \ MicroPython\n\nhttp://github.com/micropython\n\nMicroPython is a text-based\
    \ editor designed for microcontrollers and is ready to push your coding skills\
    \ further. There is a wide range of code 'snippets' and libraries that will help\
    \ you develop your project.\n\n# Bluetooth\n\n# MicroUSB\n\n# Battery Pack\n\n\
    Built-in Bluetooth Smart Technology enables you to connect to other devices such\
    \ as your phone, laptop or tablet. You can connect the microcontroller to create\
    \ your own Internet of Things.\n\nUse MicroUSB to connect to your board when connected\
    \ to a Windows or Mac computer. This enables you to download or \"flash\" programs\
    \ onto your microcontroller and retrieve from your device to the computer.\n\n\
    This socket allows you to connect an external battery pack containing two AA batteries\
    \ to the board. This makes your microcontroller easy to run programs externally.\n\
    \nwww.linuxuser.co.uk 17\n\n# Feature Make with microbit\n\n# micro:bit vs VS\
    \ Raspberry Pi\n\nHow does the BBC's board compare to the leading SBCs?\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_17_0.png)\n\
    \n## Raspberry Pi 2\n\n- CPU: 800MHz 32-bit quad-core ARM Cortex-A7\n- GPU: Broadcom\
    \ VideoCore IV\n- RAM: 1GB (shared with GPU)\n- Networking: 10/100 Mbit/s Ethernet\
    \ adapter\n- Ports: USB x4, HDMI, composite video, 3.5mm audio jack\n- Programming\
    \ languages: Python, BBC BASIC, C++, Java, Perl, Ruby, Squeak, Smalltalk\n- Extras:\
    \ SPI, DPI\n\n## Raspberry Pi 3\n\n- CPU: 1.2 GHz 64-bit quad-core ARM Cortex-A53\n\
    - GPU: Broadcom VideoCore IV\n- RAM: 1GB (shared with GPU)\n- Networking: 10/100\
    \ Mbit/s Ethernet, 802.11n\n- GPIO: 17\n- Ports: USB x4, HDMI, composite video,\
    \ 3.5mm audio jack\n- Storage: MicroSD\n- Programming languages: Python, BBC BASIC,\
    \ C++, Java, Perl, Ruby, Squeak, Smalltalk\n- Extras: SPI, DPI\n\n## Raspberry\
    \ Pi Zero\n\n- CPU: 1 GHz ARMv6-28S1 single-core\n- GPU: Broadcom VideoCore IV\n\
    - RAM: 512 MB (shared with GPU)\n- Networking: n/a\n- GPIO: 0\n- Ports: microUSB\
    \ x1, mini-HDMI, composite video/audio\n- Storage: MicroSD\n- Programming languages:\
    \ Python, BBC BASIC, C++, Java, Perl, Ruby, Smalltalk\n- Extras: SPI, DPI\n\n\
    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_17_1.png)\n\n## micro:bit\n\n- CPU: 16\
    \ MHz ARM Cortex-M0\n- GPIO: n/a\n- RAM: 16KB\n- Networking: 2.4 GHz Bluetooth\
    \ wireless networking\n- GPIO: 17\n- Storage: 256 KB flash memory\n- Programming\
    \ languages: Python, JavaScript, micro:bit Editor, Make Touch Designer\n- Extras:\
    \ Accelerometer, magnetometer, LED\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_17_2.png)\n\
    \n## VERDICT\n\nOn the paper the microbit is lower-powered across most areas than\
    \ even the Raspberry Pi Zero, in some cases it can do more out of the box, which\
    \ makes it ideal for kids like this. The magnetometer on the board itself has\
    \ extra features (which don't have to be added to) for those new to electronics.\
    \ Programs are easily completed and flashed to its state memory to be executed,\
    \ while its edge connection is connected to a variety of peripherals (which rather\
    \ makes up for its lack of standard ports). While all of Pi will be better in\
    \ a straight benchmarking competition, its low speed and power consumption are\
    \ perfect for beginners as it's not overly complicated. But it's a surprisingly\
    \ little machine that can do more than a Pi can find - in fact, the microbit has\
    \ enough of the features to be a rival to the market as a leader. Inspired by\
    \ what they can create on it, the microbit is lately like picking up Pi but de-limited\
    \ and escalated projects with the BBC's microcontroller.\n\n# Five projects with\
    \ microbit\n\nEach project shows you how to use the microbit in a different way.\n\
    \n![](img/765b68b6c1fdb1413feedf2dc3295bc6_18_0.png)\n\n## 01 Set up microbit\n\
    \nOur program shows you how to use the microbit in a different way. Open your\
    \ web browser and navigate to microbit.org. At the top of screen select Editor.\
    \ You can select different programming languages.\n\n## 02 Add button press\n\n\
    Our program shows you how to use the microbit in a different way. Select the input\
    \ input block.\n\nOur program shows you how to use the microbit in a different\
    \ way. Each project has been designed to teach you new skills.\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_18_1.png)\n\
    \n## 03 Code the face\n\nNext, code what you want the microbit to do when Button\
    \ A is pressed. This triggers a face to be displayed on the LED matrix. The 400ms\
    \ refers to the length of time the image is displayed.\n\n```javascript\nfunction\
    \ main() {\n\n\tinput.onButton(Button.A, function () {\n\t\tled.showString(\"\
    HELLO\")\n\t\tpause(4000)\n\t})\n\n}\n```\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_18_2.png)\n\
    \n## 04 Test it\n\nNow run your script and test that it works. At the top of screen\
    \ select the run button. This prepares your script for the microbit emulator,\
    \ which is on the right of the screen. When it is finished loading, press \"Button\
    \ A\" it will display the image you made in step 3 on the LED matrix.\n\n## 05\
    \ Compile\n\nOur program shows you how to compile the script to run on microbit.\
    \ Converting the script from a high-level programming language into machine code,\
    \ making it compatible with the processor. Click the compile button at the bottom\
    \ of the screen, begins the compiling and downloads your file.\n\n## 06 Transfer\
    \ to your microbit\n\nConnect your microbit to computer using the USB cable and\
    \ open the folder on the microbit; drag the compiled code into the folder (The\
    \ code is normally saved to your download folder). On the back of the microbit\
    \ LED indicator will flash as the program is written to your device. It is ready\
    \ to use; just press button A.\n"
  mdcn: "\n\n# 语言与编辑器\n\n选择一种符合你需求的编程语言。\n\n# 代码王国\nJavaScript\n\nwww.microsoft.co.uk/its\n\
    \n这是一种拖放式编辑器，你可以选择代码块并将它们拖到任何你想要的地方，用此构建你的程序。你可以根据程序的开发进度，在代码块和纯文本之间切换。这使得它最适合初学者。\n\
    \n# 微软块编辑器\n\n块编辑器\n\nhttp://github.com/spfx72\n\n块编辑器是一个高级的可视化拖放界面，你可以在其中将代码行吸附在一起。它允许创建函数和属性，让你能够创建更复杂的逻辑和控制。你还可以将代码转换为完全兼容的\
    \ Touch Developer。\n\n# 微软 Touch Developer 开发者\n\nTouch 开发者\n\nwww.microsoft.co.uk/td/contents\n\
    \nTouch Developer 既是一种基于文本的编辑器，专为触摸屏设计。它适用于包括手机和平板电脑在内的一系列设备。它还支持键盘和鼠标输入，并支持广泛的功能和代码。\n\
    \n# 连接性概览\n\n# Python\n\n# MicroPython\n\nhttp://github.com/micropython\n\nMicroPython\
    \ 是一种为微控制器设计的基于文本的编辑器，准备好让你的编程技能更进一步阶。有大量的代码“片段”和库可以帮助你开发项目。\n\n# 蓝牙\n\n# MicroUSB\n\
    \n# 电池包\n\n内置蓝牙智能技术允许你连接手机、笔记本电脑或平板电脑等其他设备。你可以连接微控制器创建自己的物联网。\n\n连接到 Windows 或\
    \ Mac 电脑时，使用 MicroUSB 连接板。这允许你将程序下载或“烧录”到微控制器，并从中检索电脑。\n\n此接口允许你将包含两个 AA 电池的外部电池包连接到板上。这使得你的微控制器可以外部运行程序。\n\
    \nwww.linuxuser.co.uk 17\n\n# 使用 microbit 功能\n\n# micro:bit 对比树莓派\n\nBBC 的开发板与领先的单板计算机（SBC）相比如何？\n\
    \n![](img/765b68b6c1fdb1413feedf2dc3295bc6_17_0.png)\n\n## 树莓派 2\n\n- CPU: 800MHz\
    \ 32位四核 ARM Cortex-A7\n- GPU: 博通 VideoCore IV\n- RAM: 1GB（与 GPU 共享）\n- 网络: 10/100\
    \ Mbit/s 以太网适配\n- 端口: USB x4、HDMI、复合视频、3.5mm 音频接口\n- 编程语言: Python, BBC BASIC,\
    \ C++, Java, Perl, Ruby, Squeak, Smalltalk\n- 额外功能: SPI, DPI\n\n## 树莓派 3\n\n-\
    \ CPU: 1.2 GHz 64位四核 ARM Cortex-A53\n- GPU: 博通 VideoCore IV\n- RAM: 1GB（与 GPU\
    \ 共享）\n- 网络: 10/100 Mbit/s 以太网、802.11n\n- GPIO: 17\n- 端口: USB x4、HDMI、复合视频、3.5mm\
    \ 音频接口\n- 存储: MicroSD\n- 编程语言: Python, BBC BASIC, C++, Java, Perl, Ruby, Squeak,\
    \ Smalltalk\n- 额外功能: SPI, DPI\n\n## 树莓派 Zero\n\n- CPU: 1 GHz ARMv6-28S1 单核\n-\
    \ GPU: 博通 VideoCore IV\n- RAM: 512 MB（与 GPU 共享）\n- 网络: 无\n- GPIO: 0\n- 端口: microUSB\
    \ x1、mini-HDMI、复合视频/音频\n- 存储: MicroSD\n- 编程语言: Python, BBC BASIC, C++, Java, Perl,\
    \ Ruby, Smalltalk\n- 额外功能: SPI, DPI\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_17_1.png)\n\
    \n## micro:bit\n\n- CPU: 16 MHz ARM Cortex-M0\n- GPIO: 无\n- RAM: 16KB\n- 网络: 2.4\
    \ GHz 蓝牙无线网络\n- GPIO: 17\n- 存储: 256 KB 闪存\n- 编程语言: Python, JavaScript, micro:bit\
    \ 编辑器, Make Touch Designer\n- 额外功能: 加速度计、磁力计、LED\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_17_2.png)\n\
    \n## 结论\n\n从纸面参数来看，microbit 在大多数领域的功率甚至低于树莓派 Zero，但在某些情况下，它可以开箱即用完成更多任务，这使得它非常适合像这样的孩子。板载的磁力计对于电子初学者来说具有额外功能（这些功能不需要额外添加）。程序可以轻松完成并烧录到其状态存储器中执行，而其边缘连接可以到各种外围设备（这在很大程度上弥补了它标准端口的缺失）。虽然所有的树莓派在直接的基准测试中中都会更好，但它的低速度和低功耗非常适合初学者，因为它并不复杂。但它是一台令人惊讶的微型机器，能够做到的事情比树莓派能做的更多——事实上，microbit\
    \ 拥有足够的功能来作为市场领导者进行竞争。受它们在上面可以创造出内容的启发，最近 microbit 就像是使用 BBC 的微控制器来开展那些受到受限且升级的树莓派项目。\n\
    \n# 使用 microbit 的五个项目\n\n每个项目都向你展示如何以不同的方式使用 microbit。\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_18_0.png)\n\
    \n## 01 设置 microbit\n\n我们向你展示如何以不同的方式使用 microbit。打开浏览器并导航到 microbit.org。在屏幕顶部选择编辑器。你可以选择不同的编程语言。\n\
    \n## 02 添加按钮按下\n\n我们向你展示如何以不同的方式使用 microbit。选择输入 块。\n\n我们向你展示如何以不同的方式使用 microbit。每个项目都旨在教你新技能。\n\
    \n![](img/765b68b6c1fdb1413feedf2dc3295bc6_18_1.png)\n\n## 03 编写表情\n\n接下来，编写你希望按下按钮\
    \ A 时让 microbit 执行的操作。这将在 LED 矩阵上显示一个脸部。400ms 指的是显示图像的时间。\n\n```javascript\nfunction\
    \ main() {\n\n\tinput.onButton(Button.A, function () {\n\t\tled.showString(\"\
    HELLO\")\n\t\tpause(4000)\n\t})\n\n}\n```\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_18_2.png)\n\
    \n## 04 测试\n\n现在运行你的脚本并测试它是否正常工作。在屏幕顶部选择运行按钮。这将为屏幕右侧的 microbit 模拟器准备你的脚本。当加载完成后，按下“按钮\
    \ A”，它将显示你在第 3 步中创建的图像。\n\n## 05 编译\n\n我们向你展示如何编译脚本以便在 microbit 上运行。将脚本从高级编程语言转换为机器码，使其与处理器兼容。点击屏幕底部的编译按钮，开始编译并下载文件。\n\
    \n## 06 传输到你的 microbit\n\n使用 USB 线将 microbit 连接到电脑并打开 microbit 文件夹；将编译后的代码拖入该文件夹中（代码通常保存到你的下载文件夹）。microbit\
    \ 背面的 LED 指示灯在程序写入设备时会闪烁。它已准备好使用；只需按下按钮 A 即可。\n\n"
