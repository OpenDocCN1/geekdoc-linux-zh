    ### Feeling twitch


    Dear LU&D,

    i have a PC that I''m turning into an OBS box because I want to stream games on
    Twitch. I have a list of info distros to use for gaming, but that''s not a concern
    for me. What I want to know which is the best for the OBS box itself. I''m not
    recording anything, just streaming video and audio from the game I''m playing
    and myself commenting on it.

    Ideally I''d like to use a distro that has everything I need in one package, and
    ideally that I can live boot, in case I want to use the PC for other things too.
    I''ve checked the mic and webcam I have drivers, so I think I''m all good to go
