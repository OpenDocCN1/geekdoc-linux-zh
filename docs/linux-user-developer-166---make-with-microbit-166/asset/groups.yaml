    \ head 中的单个 `style-custom` 标签为 AMP 页面添加样式。\n\n```html\n<style amp-custom>\n{\n\
    \  /* 任何自定义样式在这里 */\n  background-color: gray;\n}\n</style>\n```\n\n> 如果你的页面有问题，它不会被第三方网站发现，也不会出现在\
    \ Google AMP Cache 中\n\n确保页面上只有一个这样的样式标签，AMP 允许多个。你也可以使用 CSS 为 AMP 自定义元素建模：\n\n\
    ```html\n<style amp-custom>\namp-img {\n  border: 5px solid black;\n}\namp-img.placeholder\
    \ {\n  background-color: grey;\n}\n</style>\n```\n\n## 08 配置分析\n\n`amp-analytics`\
    \ 也可以作为自定义 AMP 元素。你可以使用该元素并跟踪你的网站流量。分析元素用于测量 AMP 文档上的活动。关于 JSON 中测量内容的细节以及如何将数据发送到分析服务是通过\
    \ POST 请求实现的。它预先配置为支持许多分析供应商。\n\n例如，以下 `amp-analytics` 元素配置在文档加载以及每次文档加载时向你的示例发送请求：\n\
    \n```html\n<amp-analytics>\n<script type=\"application/json\">\n  \"requests\"\
    : {\n    \"pageview\": \"https://example.com/analytics?url=$url&title=${title}&account=$account\"\
    ,\n    \"event\": \"https://example.com/analytics?id=$eventId&label=$label}&account=$account\"\
    \n  },\n  \"vars\": {\n    \"account\": \"AC123\",\n    \"triggers\": {\n    \
    \  \"pageview\": {\n        \"on\": \"visible\",\n        \"event\": \"pageview\"\
    \n      },\n      \"trackerClicks\": {\n        \"on\": \"click\",\n        \"\
    selector\": \"a\",\n        \"event\": \"event\",\n        \"eventId\": \"42\"\
    ,\n        \"eventLabel\": \"clicked on link\"\n      }\n    }\n  }\n</script>\n\
    </amp-analytics>\n```\n\n"
