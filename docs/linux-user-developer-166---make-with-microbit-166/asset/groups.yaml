    # OpenSource Your source of Linux news & views


    Since the ICT syllabus has changed, it can''t be for the worst, but I''m afraid
    I''ve had little experience of it so critics may not be as relevant as when I
    wrote the first edition.


    Today, kids already have a phone, probably a game machine, and a laptop - they
    don''t need another computer. But the thing is, they don''t really know how their
    laptop and phone can be programmed. Actually the place of games in their lives
    is firmly established in their minds - it doesn''t really have anything to do
    with programming.


    Raspberry Pi Zero is so cheap that even a child could buy one (if they could get
    one). The Raspberry Pi will occupy a child''s mind for programming and controlling
    everything, and there''s a huge amount of support for them if they want it. The
    door is open for those who have hobbies, and for developing IT skills solo. Once
    you have a Raspberry Pi, start developing your own IT skills is just enough to
    get going, and that''s what I love about Raspberry Pi.


    You have worked for Actors, famous for his educational partnership with the BBC
