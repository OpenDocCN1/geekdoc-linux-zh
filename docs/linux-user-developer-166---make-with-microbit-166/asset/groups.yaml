    # 教程


    你应该能够在移动浏览器中输入树莓派的 IP 地址来访问视频流。这通常看起来所示：


    ```

    daemon on

    framerate 2

    width 640

    height 480

    ffmpeg_codec_mpeg264

    stream_localhost off

    control_localhost off

    ```


    ```

    192.168.0.10:8081

    ```


    在网络中的多台设备上检查此项以确保其工作正常。


    如果你在黑暗的房间内录制，可能需要调整一些亮度和对比值。

    更改后，按下 CTRL+X 确认，然后输入 Y 并回车。


    ```

    000 base 7.2.4               File: /etc/motion/motion.conf

    # 下一步操作之前跳过的帧数（默认值: 1）

    buffer off


    ################################################################

    # 图像和视频的目标目录

    # 设置保存运动文件的目录

    output_dir /var/lib/motion

    image_dir /var/lib/motion

    video_dir /var/lib/motion

    # 将流输出设置为旧版模式

    # 如果自动选择 0，则不包含在流

    stream_output 0

    # 使用 ffmpeg 进行流输出

    ffmpeg_output /dev/video0,h264

    ffmpeg_output_type off


    ################################################################

    # 触发检测的图像变化像素数量阈值（默认值: 150）

    threshold 600

    ```


    ## 运动检测


    你的运动检测不太可能立即生效。为了调整你的树莓派显示器设置环境，你可能会发现摄像头在短时间后存储图像。这是一个权限问题，导致在整个超时之前，屏幕上会出现几张图像。


    分配到目标目录


    你会发现许多可以调整的值，例如 `threshold` 和 `area_delete`。这些值可能需要一些测试以获得最佳效果。你可以为运动使用自定义路径。找到它并根据需要进行更改。完成后记得保存文件并重启
    motion。


    如果我们在等待检测，可以在检测到声音时启用睡眠模式。这样的项目需要一些校准来获得最佳结果，这是一个非常有用的功能。再次，在“quiet”中找到并更改设置以返回。记住当你对动作捕捉感到满意时，要撤销此操作。


    ```

    quiet off

    ```


    ## SSH 和 VNC


    对于任何此类项目，请忘记设置键盘或使用 VNC。SSH 是默认的，并让连接到树莓派的命令行变得简单得多。同时，VLC 是通过主电脑查看树莓派桌面的方法之一。


    ## 启动你的婴儿监器


    我们现在有一个完全可以工作的婴儿监器。要让监控运行，请启动：


    `sudo service motion start`


    ## 调整质量


    虽然你可以更改树莓派捕捉的图像尺寸，但小心数字非常重要。尺寸需要是 4 的倍数。例如，使用 1280x800 或 1920x1080。较大的图像不仅会影响带宽，还会生成的
    AVI 文件更大。


    ##不同的 USB 摄像头有自己的电源要求。有些可以在设备上运行，但需要通过 USB 端口提供电源。如果你将婴儿监器放置在电源之外，充电电池应该能够提供 12
    小时的电源。


    ## 检查保存的图像


    我确认了树莓派监控器捕捉的质量，进入 GUI（或使用远程连接）并浏览到 `~/lib` 查看它们的工作情况。这让你能够自由调整捕捉图像的尺寸。


    ```

    2023-10-27 12:31:45  -rw       466000 B  remote_0.jpg

    2023-10-27 12:31:45  -rw       115113 B  remote_1.jpg

    2023-10-27 12:31:45  -rw      20794203 B  remote_2.jpg

    2023-10-27 12:31:45  -rw      20986753 B  remote_3.jpg

    2023-10-27 12:31:45  -rw       322100 B /home/pi/frame10.jpg waiting for frame
    creation

    2023-10-27 12:31:45  -rw       322100 B /home/pi/frame11.jpg waiting for frame
    creation deleted

    ```


    ## 命名你的图像


    软件收集的图像可以配置特定的命名规范，并根据日期和时间进行。


    你可以在 motion.conf 的 "base directory" 下找到这些列表。如果你想根据日期为图像创建一个：


    ```

    %Y-%m-%d_%H-%M-%S.jpg

    ```


    日期和图像的 "-" 都将按日期命名，图像将带有时间戳标签。


    ## 排除摄像头连接的故障


    如果没有找到图像，或者无法连接到流（或两者都有），无法保证它会立即工作。值得运行：


    ```

    tail -f /var/log/syslog

    ```


    ## 跨越你的网络


    如果通过 No-IP 软件绕过你孩子的睡眠限制难道不是很棒吗？你可以在树莓派上安装它，让你能够避开 ISP 不给你提供专用 IP 地址的问题。


