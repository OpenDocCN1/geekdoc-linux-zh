  - '[PAGE 55]


    # Feature Ultimate FOSS


    # MAKE MUSIC AND AUDIO


    Creating music can be as simple as banging a box, or as complex as recording an
    orchestra...


    # Record multi-channel audio by Jokosher


    A simple, powerful, multi-track studio Editor may not have the ring to it as Cakewalk
    or GarageBand, but in features and usability, it can


    What you''ve got with Jokosher is a tool that is just as capable as, say Audacity
    at editing music, but is better at recording music thanks to enhanced recording
    capabilities.


    Getting started is simple, with a sensitive, intuitive user interface inviting
    you to start a new project or open an old one. Type editor/recorder features allow
    you to edit and move notes more easily than, say, Audacity. Meanwhile, extensions
    free for their features, and preset audio tracks are available for different instruments
    to ensure they''re recorded at their optimum quality.


    Jokosher is a great tool, but comes with a couple of issues. One is the ''Gstreamer''
    that often works without crashing. This can be avoided by opening File -> Preferences
    and adjusting the audio settings to your own PC. Also, note that short samples
    cannot be extended or repeated - drum loops will have to be manually extended
    in a second application.


