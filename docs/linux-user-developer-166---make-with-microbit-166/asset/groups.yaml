    Alphabet 旗下手机子公司开放其协议以加速物联网的采用


    上方：OpenThread 的初始版本由 Nest 在 GitHub 上发布：https://github.com/openthread/openthread


    自从被 Google收购（2014年）以来，Nest Labs 已迅速定位为智能家居和物联网领域的领导者。Apple 的 Tony Fadel 和 Matt
    Rogers 制造了各种设备，包括传感器驱动的恒温器、熏烟机和安全摄像头。Nest Labs 发现，任何客户都会将其产品与其他产品集成，作为智能家居网络的一部分。这意味着
