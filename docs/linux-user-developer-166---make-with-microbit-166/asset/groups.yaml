    # # Tutorial Learn Go


    This image presents the Go code of structures, where you can understand how structures
    are defined and used in Go


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_49_0.png)


    # # Slices


    Slices can be found in many programming languages yet they are a smart and handy
    concept. A slice, which is similar in nature to an array, allows you to overcome
    the shortcomings of arrays. You can define a slice as follows:


    ```

    slice := []int{2, 4, 5, 6, 7, 8}

    ```


    Note that you are writing if you define a slice with [...] and you can verify
    this by printing the elements of the slice. Alternatively, you can define a slice
    with three elements of int type:


    ```

    anotherSlice := make([]int, 3)

    ```


    The make function initializes all elements of a slice; or you can use append.


    As slices are passed by reference to functions, any modifications made to a slice
    inside a function will not be lost after the function ends. You can add one or
    more elements to a slice with the help of append() function:


    ```

    slice = append(slice, -10)

    ```


    This is a complex technique that can show you the advanced capabilities of Go.
    Please keep in mind that if any of the fields of the structure contains a letter,
    you will get an error when you try to call reflect.Interface().


    > panic: reflect.Interface: cannot return value obtained from unnamed or method


    This happens because fields are not exported and therefore cannot be used by the
    reflect.Value.Interface().


    You can see the Go code of structures in Figure 2 and of the following:


    ```

    go run slices.go

    Before changeOne

    2 4 5 6 7 8

    After changeOne

    2 4 5 6 7 8

    Before cap: 6, len: 6

    After cap: 12, len: 7

    0 0

    ```


    ```

    go run structs.go

    S := (* Another Point)

    P1 := (23) A Point

    P2 := (* Another Point)

    X int = 1

    Y int = 2

    Label: string = A Point

    P3 := (23) A Point

    P4 := (* Another Point)

    ```


    Creating an array with pointer structures is possible and can be convenient when
    you need to manage many point structures:


    +   - manypoints := [4]*point{


    The reason for mentioning anonymous functions in this tutorial is because anonymous
    function is a special kind of variable. Anonymous functions can be defined without
    a name and used for implementing functions that require a small amount of code.
    In Go, you can return an anonymous function or take as one of its arguments


    Slices have a capacity and a length. The length of a slice is the same as the
    length of the array with the number of elements and the capacity is the slice
    function.


    The capacity of a slice is the current room that the slice can hold. Slices are
    dynamic, so if a slice runs out of its capacity its capacity is doubled to make
    room for more elements. You can see the source code of slices, in slices.go, which
    illustrates slices, in Figure 3. slices generating the following output:


    As you can see, at the time of definition, the capacity and the length of a slice
    are the same - after adding elements to the slice with append() if it goes from
    6 to 7 its capacity doubles and becomes 12. The advantage you get from doubling
    the capacity of a slice is better, as you do not have to worry about reallocating
    space in time.


    Please note that passing an array as input to a function expects a slice will
    generate an error message and your code will not:


    ```

    slices.33: cannot use x (type [6]int) as type []int in int argument to printSlice

    ```


