    Perhaps more geared towards the composition and arrangement of audio from MIDI-compatible
    devices, Rosegarden is a surprisingly versatile tool, holding a wealth of features
    that might inspire you to compose music. Note that in some cases, a standalone
    version of the application will not work without the MIDI support that you''re
    expecting; in this case, you will also need to install a third-party library like
    FluidSynth or Timidity.


    Rosegarden is a multi-track editor, effortlessly displaying your MIDI track arrangement
    with editing tools to drag and cut tracks in a matrix, where notes and chords
    can be moved or removed completely. If you have experienced this kind of software,
    it will be reassuringly familiar.


    Perhaps most so is Rosegarden''s mastery of notation. Simply hit the MIDI track,
    question and select the Editor (or hit N to view the visual musical map). This
    tool doesn''t simply present a collection of notes on a staff, however; like the
    MIDI matrix, you''re able to drag notes into new positions, changing both the
    pitch and the rhythm of the music. Arguably Rosegarden''s most powerful feature,
    it brings professional-standard desktop music composition to the open world.


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_55_2.png)'
  - '[PAGE 56]


    # # Edit sound files in Audacity


    Build podcasts, soundtracks and soundscapes with open source software


    It''s probably fair to say that Audacity is one of the most widely-used open source
    applications in use today, across all operating systems, whether Linux or Windows
    or Mac.


    The heart of many projects is this tool capable of rendering audio to pro quality.
    Furthermore, its adherence to open source means tools that are usually available
    for upwards of £500 can be in your hands without paying for a licence.


    Audacity can improve your podcast creation, however. Need to crop a demo mp3 down
    to size? Want to tidy up audio from an old LP or tape? Fancy creating an audio
    landscape of effects, ideal for theatres or even an audiobook?


    The ease with which Audacity lets you cut, paste, drag and fix audio makes all
    of this possible, and much more too. You''ll find that MP3s cannot be encoded
    natively, but this can be added using the LAME MP3 encoder tool, as explained
    in Audacity itself.


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_56_0.png)


    GET IT IN UBUNTU STUDIO


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_56_1.png)


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_56_2.png)


    # Navigate Audacity


    Audacity has a simple, uncluttered user interface, which means it shouldn''t take
    too long to get started. It''s worth loading an MP3 music file from your collection
    if you don''t have any projects ready (WAV). You can import new audio to start
    cutting, pasting and dragging. By using the "I" selection tool is your main tool,
    and selections can be made by left-clicking and dragging. Using editing options
    are also available, either via traditional keyboard shortcut of the Edit Toolbar.


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_56_3.png)


    # Move and zoom


    Audacity projects can be quickly navigated using the slider at the bottom of the
    screen, which is useful for longer tracks; note that you can also hold <Ctrl>,
    while scrolling your mouse to zoom in and out of tracks. The time shift tool is
    particularly useful for moving audio back, forth and into new tracks, while the
    Meter Tool gives an idea of your project; Track volume (sample rate) can be adjusted
    in the track header.


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_56_4.png)


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_56_5.png)


    # Change audio sources and outputs


    To change input and outputs, use the Output Device and Input Device drop downs,
    in the Device Toolbar. Any audio device connected to your Linux PC can be selected
    as an output or input source, even audio playing on your computer. It''s worth
    knowing the Transport menu for all the recording beyond Play, Pause, Stop, etc
    as Sound activated recording.


    # Encode an MP3


    In order to export your audio project as an MP3 file, you need Export ... and
    select the MP3 option in the file type drop-down. However, without installing
    the LAME encoding script, there will be no MP3 file in the terminal.


    ```

    sudo apt-get install lame

    ```


    Once installed, you will need to restart Audacity before restarting the export
    procedure. Note that any ID3 details are required (it''s worth saving an ID3 template
    to save time), and you can also specify the bitrate for the exported MP3.


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_56_6.png)'
