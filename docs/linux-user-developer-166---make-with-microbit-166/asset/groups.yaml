    t UK and our favourites Linux and open source magazine. We''re really excited
    about the BBC''s microbit and in this issue we explain exactly what it is,what
    it does and how it compares against the Raspberry Pi,

    we give you five great projects to make for sooner,

    from simple LEDs to building your own town, and dive even

    a compass. Check it out on p14!

    We have also looked at Raspberry Pi in this issue

    extxcitement about the microbit. This issue explains

    how you can use the Raspberry Pi as the heart of a web radio,

    motion-sensing video baby-monitor, a web router and even a

    game-playing robot. Our Practical Raspberry Pi starts on

    page 6 with a project and description.

    And if you are still hankering after another creative or project to get

    your teeth into, lock up your free drive - it''s jam-packed with the

    Ultimate OS ToolKit, including two live-booting distributions of

    free and open-source software. We show out our feature on p54

    art and graphics, how to compose, record and edit audio, design

    dan and animate with your own VFX.

    Enjoy the issue!

