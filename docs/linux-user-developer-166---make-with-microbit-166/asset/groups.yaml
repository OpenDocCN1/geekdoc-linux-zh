    # 项目


    ## 为编码人员和 Linux 粉丝推出了新开发板


    新设备让我们能够引导孩子们构建自己的基于 Linux 的项目。


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_6_0.png)


    Above Maker Kit 甚至会吸引年幼儿童，而 TIPP 则适用于更高级的项目。两款为创制者准备的新套件即将到来，已准备好让编码人员和 Linux
    粉丝感到惊喜。


    Say Us 是 BBC (microbit) 设计的设计者，已设立 Maker Kit 的启动，该套件基于板载卡来构建他们自己的设备。自 microbit
    时代以来，Maker Kit 最低只要四岁的儿童就可以使用。


    “我们希望参与到那些被遗忘的数字技术制造中，”TWSU 联合创始人兼首席执行官 Beth Colby 说，“我们的使命是利用技术激发孩子的创造性想象。我们屡获殊荣的制作套件和数字辅助工具让他们能够进行创作和学习。在投稿时，我们的第一个项目距离资金目标还差
    4000 美元，并将持续到 6 月 18 日，网址为 http://stack.st/X1gG1U。”


    Meason：Carver Tinker 宣布其 Linux Tinker Pro PCB (TIPP3) 基于德州仪器强大的 1GB: Cortex-A8
    Sitara CPU，拥有 512MB RAM 和 512MB 闪存，新的 TIFF3 板运行着基于 RedHat 的入门级 Linux。TI Tinker
    Blocks 允许你像乐高一样堆叠，并兼容大多数微控制器。你不需要为开发板购买单独的外壳，它可以以多种方式构建，这意味着所需的钻孔、布线和焊接工作更少。


    此外，Tibbo OS (TISB05) 今日也到来，你可以将其作为 Linux 桌面运行。开发环境也集成其中，可以通过 USB 和 WiFi 访问数据、外部设备和系统。它包含一个专门设计的中端
    C 板，还可以通过在板座上安装 Tibbo 模块来访问板载功能。你现在可以在 http://tibbo.com/store/tips/tibb 获取。


    # 发行版动态


    ## 前 10 名


    （每日平均访问量，2 月 19 日 – 3 月 16 日）


    | 排名 | 发行版 | 访问量 |

    | :--- | :--- | :--- |

    | 1. Linux Mint | 3,055 |

    | 2. Ubuntu | 2,357 |

    | 3. Debian | 1,974 |

    | 4. openSUSE | 1,118 |

    | 5. Fedora | 1,156 |

    | 6. Manjaro | 1,142 |

    | 7. Ubuntu MATE | 1,004 |

    | 8. elementary | 872 |

    | 9. Zorin | 852 |

    | 10. CentOS | 827 |


    ## 稳定版


    开发中 (6)


    Mint 位居首，Ubuntu 正在更新，但 Linux 在上个月没有支持，新月份带来了


    # 亮点


    ### elementary


    这个基于 Ubuntu 的桌面发行版为开发环境提供了顶级功能，非常适合 Linux 初学者。它包含了一系列应用程序，包括照片、音乐、游戏等，以及其他像 Manjaro
    一样的应用。


    ### Fedora


    Fedora 具有带有特定类型软件包的自定义桌面环境，提供了可选的桌面环境，或针对安全、科学计算和计算等特定兴趣。


    ### Zorin


    Zorin 设计旨在为 Windows 用户提供替代方案，并且在许多让 Linux 变得熟悉的功能上，它带有一个类似 Wine 的界面，感觉就像来自各种 Windows
    发行版。


    ### 最新可用发行版：


    filesilo.co.uk

    www.linuxux.com


    # 开源


    ### 采访 GRAYLING


    ## 关于 Grayling 的获取


    让人们参与编程


    Grayling 的观点，通过 Raspberry Pi 几乎一切皆可行。我们采访了他以了解更多


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_7_0.png)


    **Grayling**

    Grayling 博士是德州仪器的系统设计师和通信顾问，自 Raspberry Pi 诞生以来就一直参与其中。他是《Raspberry Pi 拥有者手册》的作者。


    > 在技术发生剧变的那个时代，在那里工作是什么感觉？


    > 我很早就开始使用它了，当时是参与树莓派的少数工程师之一。


    > 那么你什么时候开始使用树莓派的？你什么时候开始参与树莓派的？


    > 我从那时就开始使用了，是德州仪器那些想要制造新芯片的工程师之一。这通常涉及到构建和调试。


    “当 Grayling 参与树莓派时，它是设备的核心”


    # 开源的重要性


    ### 开源的性


    > 一个重要的方面仅仅是民主化的功能选择。开源软件不受商业利益驱动这一事实是革命性的。


    “可能大量的贡献者意味着有许多人在阅读代码。虽然这并不是提高代码质量的唯一方法，但它改进得非常快，而且至少任何人都可以纠正。免费软件的一个大问题是它太容易使用，以至于质量不会下降，而且使用产品总是有成本的。但开发和维护有一些小技巧。一旦投资增长到足以激励用户，当该产品消失时，你将损失资金（无论它是否让你陷入困境），这并不值得相信它能持续良好……这可能是我倾向于尽可能使用
    Linux 或其他开源软件的主要原因——因为开源软件是如此容易变得更好。”


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_8_0.png)


    “指令和信息。就在我意识到申请了……”


    在你们的书的序言中，Eben 和 Liz Upton 提到了当时 ICT 课程造成的 ICT 技能缺口。你是如何应对这些技能的？促使你写这本书的原因是什么？


    一旦开始，我确实列了一份我想做的清单。我认为如果我能鼓励那些从未考虑过将计算视为创造性机会的人，那就太好了——我还可以鼓励女孩进入这一领域——我可以就此多说一会儿，并谈谈开源软件在世界中极其重要的地位。我会把这本书写得足够详尽，可以作为教材使用，是的，我遗憾我所看到的国家课程在该领域的潜在状态，同时也试图满足那些显而易见的预期。你已经注意到这两个版本都是献给我的孩子的（‘并对此表示歉意’），这直接源于他们的经历……学生交付物包括一个
    100% 的”


    "> 我遗憾我所看到的国家课程在该领域的潜在状态”


    '
