    ## SSH and VNC


    As any project like this, forget about setting up keyboard or using VNC. SSH is
    default and makes connecting to the Raspberry Pi''s command line much easier.
    Meanwhile, VLC is one of ways to view the Raspberry Pi desktop through the main
    computer.


