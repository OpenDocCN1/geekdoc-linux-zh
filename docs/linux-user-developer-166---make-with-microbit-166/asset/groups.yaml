    # 终极 FOSS 特性


    ## 设计美术与图形


    无论你是在插图、编辑还是管理图像，Linux 都有你所需的 FOSS 工具


    ### 使用 GIMP 编辑照片


    Photoshop 的开源替代方案。

    GIMP（即 GNU 图像处理程序）几乎可以完成 Photoshop 能做的任何任何工作。作为一种开源工具，GIMP 可用于各种项目，从在照片上添加虚假涂鸦到添加移轴倾斜微缩模型效果。像
    Photoshop 一样，GIMP 支持照片增强，涵盖了从自定义预设到调整色调、饱和度、引入过滤器等所有功能。此外，通过 GIMP 还可以制作动画。


    与 Photoshop 类似，GIMP 的魔法通过图层实现，这允许你能够在不实际损坏源图像的情况下更改它。使用新名称来保留原始图像和数字绘画是一个极佳的主意。

    虽然其他软件也被认为是 Photoshop 的直接替代品，但它在 FOSS 环境中提供了大量的核心功能选择，更易使用，硬盘占用更小，并且没有受到近年来困扰
    Photoshop 的软件臃肿负担。在 GIMP 中，重复操作比在 Photoshop 中简单得多。如果你还没有


    ### 滤包模拟


    - 整个图像

    - 仅选择区域

    - 上下文选择

    - 阴影

    - 色调

    - 高光


    - 在 UBUNTU 中

    - Windows

    - 饱和度

    - 数值

    - 高级


    | 原始 | 当前： |

    | --- | --- |


    ### 使用 Inkscape 绘制矢量图


    需要比目前使用的更好的绘画工具吗？学习使用 Inkscape 在 Linux 中绘画


    “自由绘制”是它的口号，Inkscape 确实让这变得简单。它提供了绘画工具、对许多文件格式兼容性以及绘制位图和矢量图形的能力。凭借对 SVG 矢量工作格式的完全支持以及手绘或使用形状绘制的能力，Inkscape
    还具有构建路径的工具和功能。


    但 Inkscape 可被认为是可行的 Adobe Illustrator 替代方案已经存在很了，关于它的传闻被夸大了。它只是提供此类软件的少数竞争者之一。然而，最新版本在保持传统
    Inkscape 简单性的同时，对速度进行了改进，使其成为流行的 Illustrator 值得竞争的对手。

    它不仅适用于那些喜欢处理色块和疯狂渲染想法的人。通过新版本，你可以正常指定变换（或通过移动鼠标），Inkscape 的进化代表了任何数字插画师的改变。想要更多？Inkscape
    可以导入 Adobe Illustrator AI 格式文件（版本 8），以及所有基于 PDF 的文件（版本 9 及以上）。它的上手和使用也简单得惊人。


    ### 使用 Scribus 布局图形


    从你的 Linux PC 进行桌面出版


    寻找 InDesign 的替代方案吗？LibreOffice Writer 并不是为桌面出版需求设置的，所以如果没有 Scribus 你能去哪里呢？这个桌面出版工具延迟、满足并许多匹配其他你可以拿起并阅读（物理上，或你的平板电脑上），Scribus
    设计用于在布局和排版方面提供完全的灵活性，超越静态打印项目，它还可以用于设计和创建交互媒体。


    凭借位图和支持从其他应用程序创建项目（包括来自 Inkscape 的矢量图），Scribus 支持 CMYK 和 ICC 色彩管理，以及 postscript
    驱动和导入格式。Scribus 导出可用于迁移项目，包括 PDF、SVG 和 EPS 以及图像格式，并支持 DTP 的标准“主页”方法以及导入样式。Scribus
    拥有 100% 的色彩色板，尽管标准的 Pantone 色彩匹配系统不是。


    ### 综合培训


    我们的团队随时准备解答关于你项目的任何问题。我们提供质量。


