    # 欢迎

    Linux User & Developer 第 166 期


    # 本期内容

    - 使用 micro:bit 制作

    - 制作网络电台

    - 锁定你的在线安全


    欢迎阅读 Linux User & Developer 最新期，这本英国最爱的 Linux 和开源杂志。我们对 BBC 的 microbit 感到非常兴奋，在本期中，我们将详细解释它是什么、能做什么，以及它与树莓派的对比。我们还提供了五个可以尽早制作的精彩项目，从简单的
    LED 到构建你自己的小镇，甚至深入研究了指南针。


    microbit 特辑解释了你如何将树莓派作为网络电台、运动感应视频婴儿监视器、网络路由器甚至游戏机器人的核心。我们的“实用树莓派”栏目从第6 页开始介绍一个项目及其描述。


    如果你仍然渴望另一个创意项目来大展身手，请锁定好你的免费驱动器——它装满了终极操作系统工具箱，包括两个免费开源软件的光启动发行版。我们展示了第54页关于艺术和图形的专题，如何合成、录制和编辑音频，使用你自己的特效进行设计和动画制作。


    阅读愉快！

    April Madden，编辑


