    ## Motion detection


    It''s unlikely that your motion detection works right away. In order to adjust
    your environment your Raspberry Pi monitor set up, you may find that the camera
    stores images after a short time. This is a permissions issue that causes a few
    images to appear on the screen before the whole time times out.


    Assignment to target directory


    You''ll find various values that you can adjust, such as threshold and area_delete.
    These may require some testing for the best results. You can use a custom path
    for motion. Look for it and change as necessary. Remember to save the file and
    restart motion when you''re done.


    If we wait on detection, you can enable sleep when sound is detected. Project
    like this will need some calibration to get the best results, this is a useful
    feature. Again, finding in "quiet" and change the setting to return. Remember
    to undo this when you''re happy with movement capture.


