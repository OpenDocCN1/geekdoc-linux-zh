    \n# 欢迎来到 Go 之旅 (Tour of Go)\n\n编程语言之旅涵盖了 Go 语言的基础知识。欢迎！学习如何使用此教程：包括如何在不同章节和练习之间导航。\n\
    \n# 基础\n\n教程涵盖了 Go 语言的基础。解码变量、循环以及入门所需的一切。\n\n# 变量、包和函数\n\n学习 Go 中任何程序的的基础。\n\n\
    # 控制流：if, for 和 switch\n\n学习如何用条件、switch 和 defer 控制代码的执行流。\n\n# 方法、切片和映射\n\n学习如何在\
    \ Go 中定义和使用方法、切片和映射。\n\n# 方法和接口\n\n学习关于方法、接口以及实现它们的结构体。\n\n# 并发\n\nGo 并发特性是语言的核心。数组的源代码展示了如何处理数组。\n\
    \n```go\ntype point struct {\n\tx int\n\ty int\n\tlabel string\n}\n```\n\n然而，当你实际上定义一个新类型时，你将学习如何通过以下方式创建该类型的变量：\n\
    \n```go\np1 := point{12, 2, \"Point\"}\np2 := point{} // 将所有字段初始化为零值\n```\n\n\
    你可以使用以下内容访问结构体的个别字段：\n\n```go\np2.label = \"Another Point\"\n```\n\n你可以按照如下方式遍历结构体的字段：\n\
    \n```go\np1 := point{12, 2, \"Point\"}\ns1 := reflect.ValueOf(p1).Elem\ntypeOff\
    \ := s1.Type\nfor i := 0; i < s1.NumField(); i++ {\n\tfield := s1.Field(i)\n\t\
    fmt.Printf(\"%s: %v\\n\", field.Name, typeOff.Field(i).Interface())\n}\n```\n\n\
    请记住，Go 中的数组具有固定大小且不能更改。但是，如果你想为一个没有空间的数组创建一个额外元素的数组，你可以创建一个切片（slice），并将数组中的所有元素复制到新切片中。当你想要在函数中使用数组时，你将获得数组的拷贝；然而，你对数组的任何更改都不会影响该函数。向函数传递大数组可能会很慢。解决所有问题的方法是使用切片而不是数组。\n\
    \n# 网络\n\n虽然数组非常有用，但它们只能持有固定数量的变量。当你需要各种变量时，可以使用结构体。结构体的元素如下所示：\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_49_0.png)\n\
    \n# 教程学习 Go\n\n这张图片展示了关于结构体的 Go 代码，你可以在此了解如何定义和使用结构体\n\n# 切片\n\n切片在许多编程语言中都可以找到，但它们智能且方便的概念。切片在本质上类似于数组，允许你克服数组的缺点。你可以这样定义切片：\n\
    \n```go\nslice := []int{2, 4, 5, 6, 7, 8}\n```\n\n注意，当你定义切片时使用的是 `[]`（OCR 说 `[...]`，但在\
    \ Go 中是 `[]`），你可以通过打印切片元素来验证。或者，你可以定义一个包含三个 int 类型元素的切片：\n\n```go\nanotherSlice\
    \ := make([]int, 3)\n```\n\n`make` 函数初始化切片的所有元素；或者你可以使用 `append`。\n\n由于切片是通过引用传递给函数的，函数内部对切片的任何修改在函数结束后都不会丢失。你可以通过\
    \ `append()` 函数向切片添加一个或多个元素：\n\n```go\n// 此处省略代码\n这是一种展示 Go 高级能力的复杂技术。请记住，如果结构的任何字段包含一个未导出的字母，当你尝试调用\
    \ `reflect.Interface()` 时会得到错误。\n\n> panic: reflect.Interface: cannot return value\
    \ obtained from unnamed or method\n\n这是因为字段未写出，因此无法被 `reflect.Value.Interface()`\
    \ 使用。\n\n你可以从图 3 中看到切片的源代码以及输出：\n\n```go\ngo run slices.go\nBefore changeOne\n\
    2 4 5 6 7 8\nAfter changeOne\n2 4 5 6 7 8\nBefore cap: 6, len: 6\nAfter cap: 12,\
    \ len: 7\n```\n\n```go\ngo run structs.go\nS: (*Another Point)\nP1: {x:12 y:2\
    \ label:Point}\nP2: {x:0 y:0 label:Another Point}\nP3: {x:23 y:2 label:Point}\n\
