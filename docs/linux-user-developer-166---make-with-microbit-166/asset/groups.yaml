    ad-src\"></amp-video>\n```\n\nAMP 要求为所有资源指定 `width` 和 `height` 值。这些属性会自动作为参数传递给渲染广告的\
    \ own。这些属性是针对广告网络文档的。\n\n## Google AMP 教程\n\n![](img/765b68bc1fdb1413feed2dc295bc6_45_0.png)\n\
    \n运行时运行在每个 AMP 文档中的 JavaScript 代码。它为 HTML 资源加载和优化提供了实现。\n\n## 05 追踪像素\n\n追踪像素是嵌入在\
    \ HTML 页面或电子邮件中的 1px 图像，用于跟踪页面访问。AMP HTML 提供了作为追踪像素使用的自定义元素 `<amp-pixel>`。该元素可以加载任何图像，通过单个\
    \ URL 允许在制作它时被组件字符串替换。它还允许标准的 URL 变量。\n\n同样，嵌入 Facebook 帖子：\n\n```html\n<amp-facebook\
