    ## Feature Make with micro:bit\n\n## Project Three Create an electronic die\n\n\
    ### 01 Shake it\nThis project utilises the accelerometer sensor, which is used\
    \ to measure the movement of your microbit. It focuses on identifying the shaking\
    \ and movement and displaying a randomly generated number on the LED screen. Create\
    \ a new script and rename as appropriate. Use the 'input' block to select 'on\
    \ shake' to set the LED for 150 milliseconds and respond with an action when you\
    \ shake it.\n\n### 02 A random number\nIt needs to be able to select a random\
    \ number between one and six. Click the number '1' in the brackets, then from\
    \ the blocks click 'maths' and then 'random'. Assuming you choose to enter the\
    \ value 6, '0' (for other games where a die fails) is left as a selection to which\
    \ a die does not land straight.\n\n### 03 Show a number\nOn the line below select\
    \ 'basic' and 'show number'. The code will default to showing the number on the\
    \ LED for 150 milliseconds. You can test this by clicking the Run button and using\
    \ the emulator on the right of the screen.\n\n### 04 Run, test and collect\nYour\
    \ program works by clicking 'Run' to load the emulator. You will notice the option\
    \ to 'shake' the microbit is enabled. Use this to test the code is correctly.\
    \ Then compile, download and drag the file to your microbit. Once loaded, shake\
    \ the microbit to roll a number.\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_21_0.png)\n\
    \n```\nfunction shake () {\n  input on shake {\n    show number (random range\
    \ 1 to 6)\n  }\n}\nfunction start ()\n```\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_22_0.png)\n\
    \n## Project Four\n\n## Make and code a simple LED torch\n\n**01 Connect the wires**\n\
    Take your microbit and remove it from any device that may be attached. Erase also\
    \ the battery pack. Take two wires and attach one to the Pin Hole located above\
    \ the hole and ensure it is secure. Now click the script so that the second wire\
    \ is on the pin marked GND.\n\n**02 Connect the LED to the wires**\nWhen connecting\
    \ your LED to the wires, it is important to connect the LED to the ground. This\
    \ is also known as the 'positive leg' - attach this wire to the Pin 2 using the\
    \ crocodile clip to hold the LED in place. Now select the GND pin and write the\
    \ script to control.\n\n**03 Create the code**\nStart a new script and change\
    \ it to a more suitable (memorable)! Button A is used to turn the LED on. When\
    \ the button is pressed, it writes to the pin, sending a small current through\
    \ the attachment to the LED.\n\n**04 Turning the LED off**\nClick the 'pin' block,\
    \ which brings up the 'digital write' option. Then, enter the number of the pin\
    \ that to be written: change the value from P0 to P2. Select Pin 2. The value\
    \ after the number represents the state of the pin (0 represents Off and 1 represents\
    \ On). Changing the value to 1 will trigger the current when Button A is pressed.\n\
    \n**05 Turning the LED off**\nTo turn it off, use the same block structure as\
    \ above but replace the value with '0'. First select the 'input' block and click\
    \ on 'button pressed', which brings up the 'digital write' pin option. Select\
    \ this to enter the number of the pin to be written. Change the value from P0\
    \ to Pin 2.\n\n**06 Compile and test**\nRun the script to check for any issues.\
    \ There is no LED indicator on the simulation, so you are checking for syntax\
    \ errors. Then compile and download the code, plug your microbit into the computer\
    \ and copy the downloaded file over. Once written to your device, press Button\
    \ A to see if it is working as expected.\n\n## Feature Make with micro:bit\n\n\
    ## Project Five Use micro:bit as a compass\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_23_0.png)\n\
    \n```\nfunction main() {\n  while (true) {\n    let degree = microbit.compass.heading();\n\
    \    if (degree < 45) {\n      degree += 360;\n    } else if (degree > 315) {\n\
    \      degree -= 360;\n    }\n    microbit.showNumber(degree);\n  }\n}\n```\n\n\
    ### 01 Calibration\nThe first step is to calibrate the micro:bit. This ensures\
    \ it starts accurately. Use the 'input' block to select 'calibrate' and follow\
    \ the instructions on the screen, which involves rotating the micro:bit in a figure\
    \ eight.\n\n### 02 Looping and variables\nUse the 'forever' block to constantly\
    \ check the heading. Inside the loop, create a variable to store the degree.\n\
    \n### 03 Adding data to the variable\nNow that you have the variable, store the\
    \ heading. Use the 'input' block to set the variable to the value of the compass\
    \ heading.\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_23_1.png)\n\n```\nfunction\
    \ main() {\n  while (true) {\n    let degree = microbit.compass.heading();\n \
    \   if (degree < 45) {\n      degree += 360;\n    } else if (degree > 315) {\n\
    \      degree -= 360;\n    }\n    microbit.showNumber(degree);\n  }\n}\n```\n\n\
    ### 04 Finding North\nNow create the response to being less than 45 degrees. You\
    \ can then display an N for North or an image showing the direction.\n\n```\n\
    if (degree < 45) {\n  degree += 360;\n}\n```\n\n### 05 Show text or image\nNext,\
    \ add an 'else' block to the 'if' statement. Select the 'basic' block and use\
    \ the 'text' block and type \"N\". Run the program, and you will see an N displayed\
    \ when you move the micro:bit.\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_23_2.png)\n\
    \n### 06 East and South\nThe next two projects follow the same logic as step 5\
    \ but instead of 'if'. Use an 'if' statement to show \"E\" for East. Use another\
    \ 'else if' statement, adding the 'if' statement and the angle.\n\n```javascript\n\
    if (degree < 135) {\n  microbit.showString(\"E\");\n} else if (degree < 225) {\n\
    \  microbit.showString(\"S\");\n}\n```\n\n### 07 West\nThe final project, West,\
    \ does not need to be measured because the angle is not any of the first three\
    \ before. Use West, use the ‘else’ conditional as before; at this time do not\
    \ need to add an ‘if’ block. Test your code, then compile and download to your\
    \ microbit.\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_23_3.png)\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_23_4.png)\n"
  mdcn: "\n\n## 项目二\n\n## 让你的 micro:bit 动起来\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_20_0.png)\n\
    \n```\nscript text and animation\nfunction main() {\n  input on button pressed(A)\
    \ do\n    basic -> show string\n    show number(150)\n  end\nend\n```\n\n```\n\
    script text and animation\nfunction main() {\n  input on button pressed(A) do\n\
    \    basic -> show string\n    show number(150)\n  end\nend\n```\n\n## 01 添加一些文本\n\
    \n像你在上一个项目中一样设置一个新脚本，并为第三个脚本命名。接下来选择“按按钮按下？”（input on button pressed?）。会显示默认按钮\
    \ A。接着下一行，选择“基础”（basic）模块，这将允许你选择“显示字符串”（show string）选项。添加你的句子，例如，“我能写按钮代码”。\n\
    \n## 02 添加动画\n\n现在添加按钮 B，其代码结构与步骤 1 相同。但在添加此内容之前，请确保使用“end”代码关闭了之前的代码。最简单的方法是选择加号来添加新行。点击“输入”（input）模块和“按按钮按下”，但现在选择“按钮\
    \ B”。然后点击“基础”（basic）和“显示动画”（show animation）；这将打开窗口。\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_20_1.png)\n\
    \n```\nscript text and animation\nfunction main() {\n  input on button pressed(A)\
    \ do\n    basic -> show string\n    show number(150)\n  end\nend\n```\n\n```\n\
    script text and animation\nfunction main() {\n  input on button pressed(A) do\n\
    \    basic -> show string\n    show number(400)\n  end\n  input on button pressed(B)\
    \ do\n    basic -> show string\n    show number(120)\n  end\nend\n```\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_20_2.png)\n\
    \n## 03 创建你的动画\n\n使用界面通过开启和关闭 LED 来构建你的动画。选择屏幕上的模块以添加另一帧，然后编辑 LED。你将看到 micro:bit\
    \ 的 LED 发生变化，绘制出该帧。这类似于翻书，每一帧都构成了最终的运动图像的幻象。界面在右上角还提供了你动画的预览。更改时间值可以使动画变慢或变快。\n\
    \n## 04 运行、测试和下载\n\n可以通过 B 添加另一个按钮，并添加另一个进行响应。项目的最后部分是使用“运行”（Run）功能将你的程序加载到 microbit\
    \ 模拟器上。你现在可以排列按钮并确保它们工作正常。通过 USB 连接将你的 microbit 连接到电脑。这将向 micro:bit 加载设备；将步骤 5\
    \ 中编译好的代码拖到下载文件夹（代码通常保存在你的下载文件夹中）。回到 micro:bit，当程序被写入设备时，LED 指示器将闪烁。\n\nwww.luxuser.co.uk\
    \ | 21\n\n## 使用 micro:bit 制作特性\n\n## 项目三创建一个电子骰子\n\n### 01 摇一摇\n该项目利用加速度传感器，该传感器用于测量\
    \ microbit 的运动。它侧重于识别摇晃和移动，并在 LED 屏幕上显示随机生成的数字。创建一个脚本并根据需要重命名。使用“输入”（input）模块选择“摇晃”（on\
    \ shake），设置 LED 持续 150 毫秒，并在摇晃它时做出响应。\n\n### 02 随机数\n它需要能够选择一个一到六之间的随机数。点击括号中的数字“1”，然后从模块中点击“数学”（maths），然后点击“随机”（random）。假设你选择输入值\
    \ 6，则留下“0”（用于骰子没有落正的其他游戏）作为选择选项，即骰子没有落在正面上。\n\n### 03 显示数字\n在下方的一行选择“基础”（basic）和“显示数字”（show\
    \ number）。代码将默认在 LED 上显示该数字 150 毫秒。你可以通过点击“运行”按钮并使用屏幕右侧的模拟器来测试这一点。\n\n### 04 运行、测试和收集\n\
    你的程序通过点击“运行”加载模拟器来工作。你会发现“摇晃”microbit 的选项已启用。使用它来测试代码是否正确。然后编译、下载并将文件拖到你的 microbit\
    \ 中。加载完成后，摇动 microbit 来掷点数。\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_21_0.png)\n\
    \n```\nfunction shake () {\n  input on shake {\n    show number (random range\
    \ 1 to 6)\n  }\n}\nfunction start ()\n```\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_22_0.png)\n\
    \n## 项目四\n\n##制作并编写简单的 LED 手电\n\n**01 连接线**\n拿起你的 microbit，将其从任何连接的设备上取出。同时也删除电池盒。取两根线，将一个连接到上方的引脚孔并确保连接牢固。现在点击脚本，使第二根线连接在标记为\
    \ GND 的引脚上。\n\n**02 将 LED 连接到线**\n在将 LED 连接到线时，将 LED 连接到地是非常重要的。这也被称为“正极”——使用鳄鱼夹将此线连接到引脚\
    \ 2，以固定 LED 位置。现在选择 GND 引脚并编写脚本进行控制。\n\n**03 创建代码**\n开始一个新脚本并将其改为更合适的（容易记忆的）！按钮\
    \ A 用于开启 LED。当按下按钮时，它会写入引脚，通过连接到 LED 的附件发送一小电流。\n\n**04 关闭 LED**\n点击“引脚”（pin）模块，这将调出“数字写入”（digital\
    \ write）选项。然后，输入要写入的引脚编号：将值从 P0 更改为 P2。选择引脚 2。数字后的值代表引脚的状态（0 表示关闭，1 表示开启）。将值更改\
    \ 1 将在按下按钮 A 时触发电流。\n\n**05 关闭 LED**（注：此处原文可能为误，应为关闭，但根据文意是将值替换为 0）\n要关闭它，使用与上面相同的模块结构，但将值替换为“0”。\n\
    \n**06 编译并测试**\n编译、下载并查看 micro:bit。加载后，确保工作正常。\n\n## 使用 micro:bit 制作特性\n\n## 项目五\
    \ 使用 micro:bit 作为指南针\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_23_0.png)\n\n\
    ```javascript\nfunction main() {\n  while (true) {\n    let degree = microbit.compass();\n\
    \    if (degree < 45) {\n      degree += 360;\n    } else if (degree > 315) {\n\
    \      degree -= 360;\n    }\n    microbit.showNumber(degree);\n  }\n}\n```\n\n\
    ### 01 校准\n第一步是校准 micro:bit。使用“输入”（input）模块进行校准。\n\n### 02 循环和变量\n使用“循环”（forever）模块持续检查。创建一个变量来存储角度。\n\
    \n### 03 为变量添加数据\n在循环中获取指南针角度。\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_23_1.png)\n\
    \n```javascript\nfunction main() {\n  while (true) {\n    let degree = microbit.compass();\n\
    \    if (degree < 45) {\n      degree += 360;\n    } else if (degree > 315) {\n\
    \      degree -= 360;\n    }\n    microbit.showNumber(degree);\n  }\n}\n```\n\n\
    ### 04 寻找北极\n现在对小于 45 度的情况做出响应。\n\n```\nif (degree < 45) {\n  degree += 360;\n\
    }\n```\n\n### 05 显示文本或图像\n接下来，在“if”语句中添加一个“否则”（else）模块。选择“基础”（basic）模块并使用“文本”（text）模块输入“N”。运行程序，当你移动\
    \ micro:bit 时将显示 N。\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_23_2.png)\n\n\
    ### 06 东方和南方\n接下来的两个项目逻辑与步骤 5 相同，但不是“if”。使用“if”语句显示“E”代表东方。使用另一个“else if”语句，添加“if”语句和角度。\n\
    \n```javascript\nif (degree < 135) {\n  microbit.showString(\"E\");\n} else if\
    \ (degree < 225) {\n  microbit.showString(\"S\");\n}\n```\n\n### 07 西方\n最后一个项目西方不需要测量，因为该角度不是之前的三个之一。使用西方，像之前一样使用“否则”（else）判断；此时不需要添加“if”模块。测试你的代码，然后编译并下载到你的\
    \ microbit。\n\n"
