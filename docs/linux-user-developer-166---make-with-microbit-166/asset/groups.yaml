    # Review


    ## CubieTruck Plus


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_85_0.png)


    Left The CubieTruck Plus beats many of its rivals in benchmarking tests


    ## COMPUTER


    ## CubieTruck Plus


    With an eight-core processor, does the CubieTruck Plus justify its premium pricing
    over rival single-board computers?


    | Feature | Details |

    | :--- | :--- |

    | Processor | Allwinner H6 Octa-Core (4x 2GHz; Cortex-A53, 4x 1.9GHz; Cortex-A7)
    |

    | CPU | - |

    | GPU | PowerVR SGX544 |

    | Storage | 8GB eMMC, SATA USB 2.0, micro-SD slot |

    | Memory | DDR3L |

    | Networking | Gigabit Ethernet, 2x4GHz; 802.11n Wi-Fi, Bluetooth |

    | Headers | 70 pin header including HDMI, UART, GPIO, I2C, SPI, Audio, Microphone
    |

    | Dimensions | 111.6mm x 84mm x 19.92mm |

    | Additional Ports | 4x USB 2.0, 1x USB, DisplayPort, IRTo, ToA, I2C, Audio, Microphone
    |

    | Available from | newcit.com (as CubieCube) |

    | Price | £199.95 |


    The latest date from embedded specialist CubieTech, the open-hardware CubieTruck
    Plus — also known as the Cubie 5 — aims to improve on its eponymous predecessor
    (reviewed in August 2014). The CubieTruck Plus comes away with much faster Allwinner
    H6 octa-core-system-on-chip (SoC) used in mobile devices.


    Originally designed for smartphones and tablets, the Allwinner H6 is an implementation
    of ARMv8 LITTLE architecture. In mobile devices, using lower-power cores for day-to-day
    tasks extends battery life when computational power is needed — something that
    requires a clever scheduler to accomplish to end up with your more important tasks
    running on the slower cores. In the bundled Android release, pre-installed on
    the 8GB of eMMC flash, this isn''t a problem. The Linux version provided by CubieTech,
    however, is more than enough to benefit from the extra cores.


    The CubieTruck Plus scores the Sysbench CPU benchmark in 178 seconds to run eight
    simultaneous threads across the H6 cores, and just 25.38 seconds when all are
    assigned to a Raspberry Pi 3 Cortex-A53 chip, which is an impressive result: the
    Pi 3 is slightly slower — 182 seconds for the same test at 49.02 seconds.


    Other benchmarks confirm: the CubieTruck Plus scores 523 MFLOPS at the Linpack
    single-precision benchmark to the Pi 3''s 49.18 MFLOPS, with a memory bandwidth
    of 346.2MB/s and 402.3MB/s for the Pi 3.


    The Allwinner H6 allows to host operating systems using versatile quad-core performance.
    However, there is no easy way to distinguish between the high and low-power cores
    — meaning it''s entirely possible Below High-spec hardware means a high power
    draw


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_86_0.png)


    Across Four high-power processor cores combine with four lower-powered engines
    to spare the task load and extend battery life in day-to-day use. Left the built-in
    heatsink means the board is merely warm to the touch


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_86_1.png)


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_86_2.png)


    ## Pros


    - Excellent performance for multi-threaded software, easy storage expansion, heatsink
    included to keep things cool, Android support

    - Almost four times the price of a Raspberry Pi3, while only offering around the
    performance; GPU diff to use


    ## Cons


    It’s no surprise to the CubieTruck Plus leading the networking benchmark


    It''s no surprise to the CubieTruck Plus leading the networking benchmark, either
    in addition to 2.4GHz and 5GHz Wi-fi only, the gadget Ethernet port - while severely
    bottlenecked by the SoC - especially best on 1000 USB-connection measured at 79.14MB/s
    to 80.98MB/s. Sadly, it couldn''t say that the networking has at least one major
    drawback affecting the SATA port. Whereas the CubieTruck has SATA port connected
    directly to the A20 SoC, the H8 lacks on SATA - leaving the Cubie to its USB 2.0
    drive, adding CPU overhead and bottleneck performance. This is particularly disappointing
    if opting for the optical RAID board, which allows two SATA devices to share the
    single-on board SATA port. Other disappoints include high power draw, with the
    board pulling 1.32a at load compared to 0.58a for a Raspberry Pi3, and a high
    price rarely justified by the extras which include USB cables, an acrylic case
    with 2.5-inch hard drive, SATA data and power cable, and can be warm to the touch.
    Bigger issues include the issue of bundling an out-dated Android Android 4.2.2
    build and a lack of GPIO output in Linux at the time the review was conducted,
    that should be fixed in short order via a downloadable de-bug update.


    - Gareth Helforth


    ## Summary


    The CubieTruck Plus is better than its predecessor, and the performance of the
    board is merely warm. With a price just shy £120, offering enough to do, though
    Raspberry Pi3 is not enough, unless you need fast networking or SATA connectivity
    in your project.


    ## Review


    ## Parsix GNU 8.5


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_87_0.png)


    ## Parsix GNU 8.5


    Can Parsix''s latest update prove it can still keep pace with the range of emerging
    distributions?


    Parsix GNU is one of the distributions that has managed to keep up with the times,
    consistently changing its feature set in the quest of satisfying its user base.
    Despite increased competition from a number of others to dazzle, with its latest
    8.5 update once again showing why it deserves users to check it out.


    - Hard drive 1.2GB

    - Storage 4GB

    - CPU Dual-core minimum

    - Available from www.parsix.org


    Despite the installer not being particularly beginner-friendly, the text-based
    Xialog menu system gets the job done nicely. Root options and the ability to partition
    a hard disk is also included. Of course, text-based installers are not the easiest
    to get grips with, so some users might need to seek extra help initially. But
    this aside, installation is fast and the lack of bloat pays well to keep speeds
    down to minimum. GOME desktops tend to be RAM-heavy, so it was a surprise to see
    the minimal impact that Parsix had on memory. With the system only using 75MB
    of RAM at its peak, it is moving virtual


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_88_0.png)


    ## Pros


    - Its minimal approach provides a great canvas for users to build from, without
    overcomplicated menus in the way.


    ## Cons


    - While functional, some of the bundled software does little to catch the eye.
    You might find it not quite for you.


    ## Summary


    If you''ve ever used any of Parsix''s previous versions, you''ll feel right at
    home. But if you are new to Linux, you might find it underwhelming.


    www.linuxuser.com

