    \ AMP HTML\n\nWe already looked at the script tag, and know that AMP HTML provides\
    \ the element amp-img to add images. There are several elements available to help\
    \ you display media types. Let us take a look at others, starting with images.\
    \ amp-img requires a width and height. It could look like this:\n\n```html\n<amp-img\
    \ src=\"responsive.jpg\" height=\"193\" responsive=\"\"></amp-img>\n```\n\nTo\
    \ add audio, include the script:\n\n```html\n<script async custom=\"amp-audio\"\
    \ src=\"https://cdn.amp.project/v0/amp-audio-0.1.js\"></script>\n```\n\nThe AMP\
    \ runtime efficiently manages images, choosing to priority resource loading based\
    \ on the viewport position, system resources, connection bandwidth, or other factors.\n\
    \nThen use the amp-element:\n\nTo added images, you can use the amp-anim element.\
    \ It is similar to the amp-img element with additional support for handling and\
    \ playing of animated image formats as GIFs. To include amp-anim in your page,\
    \ first include the script:\n\n```html\n<script async custom=\"amp-anim\" src=\"\
    https://cdn.amp.project/v0/amp-anim-0.1.js\"></script>\n```\n\n```html\n<amp-audio\
    \ src=\"https://yourhost.com/myaudio.mp3\">\n  <div fallback>\n    <p>Your browser\
    \ doesn't support HTML5 audio</p>\n  </div>\n  <source type=\"audio/mpeg\" src=\"\
    foo.mp3\">\n</amp-audio>\n```\n\nThen we have added image:\n\n## 04 Using video\
    \ in AMP HTML\n\n```html\n<amp-video width=\"380\" height=\"300\" poster=\"my-gif.jpg\"\
    >\n  <source type=\"video/mp4\" src=\"https://yourvideo.com/my-video.mp4\">\n\
