    # Feature Ultimate FOSS


    # # EDIT VIDEO FILES


    Turn your Linux PC into state-of-the-art video editor


    # Edit video in OpenShot


    Transform your video into professional-looking mini-movies


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_59_0.png)


    Linux is not short of video editing options. Avalden, KDELive... by far the most
    flexible is OpenShot 2.0. Suitable for producing videos of all lengths, with some
    additional features (wipes, etc.), OpenShot 2.0 developed with support from a
    Kickstarter campaign, and is becoming the most popular video editor on Linux.


    The reason for this can only be its simplicity. Editing projects relies on three
    elements: visuals, sound, and tracks, and OpenShot 2.0


    offers comprehensive control of all of these. Whether you''re cutting together
    a family video, producing something for college or editing a YouTube video, OpenShot
    2.0 is up to the task.


    Once you''re done, videos can be exported in a number of formats, and you should
    also select a suitable resolution for the finished project. OpenShot can be imported
    into third-party apps, such as Blender.


    # Import your clips


    Getting started with OpenShot 2.0 means finding some clips and importing them,
    just by clicking the green symbol on the toolbar. For all common video, audio
    and image formats that you can use, you can import them without any problems.
    In the event that you find something that cannot be imported, first check if it
    is a valid file, and if so, use a converter so it can be added as a different
    file format.


    # Use the timeline


    OpenShot''s 2.0 timeline is where the heavy lifting is done; this is where, you
    drag your clips around, and it''s also the tool you use to arrange and cut them.


    it''s also where you import images to create slideshows, and videos. All of this
    is easily done using the mouse. Contextual changes to the mouse pointer will indicate
    what tasks can be performed as you move around – if you wish to move or split
    a clip.


    # Easily preview your video


    Another key of the app is the preview window. Here, your project can be viewed
    in the current state, and all. Using the preview window is a good way to see where
    you need to add clips and fades, perhaps to make a cut or insert a short shot.
    The preview window features timeline play/pause buttons for tracks, and furthermore,
    allows for viewing in real-time. For the best performance, sharper is better.


    # Transitions and wipes


    A great selection of transitions and wipes are included with OpenShot 2.0, giving
    everything you need to move between clips in interesting ways. While traditional
    transitions are also an option, transitions can bring their own style and drama
    to a project.


    To use them, position the two clips to be transitioned on the timeline, and drag
    the transition place between them. Check the results in the preview window, and
    adjust as necessary. Effects like blur and colour saturation can be added in the
    same way.


