    # Investigate network sockets with ss


    # # Investigate network sockets with ss


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_31_0.png)


    # Use the ss command line utility to monitor network connections


    The study of UDP and UNIX socket connection is important for every UNIX network
    administrator as ss allows you to see how your Linux system is doing. Many command
    line tools help you to get statistics on your network connections, which have
    been replaced by the more capable ss, the IPROUT2 Utility Suite, which will be
    further investigated in the next issue of Linux User and Developer. However, ss
    can do many things that it deserves.


    # 02 Basic usage


    The simplest way to use ss is without any command line parameters - when ss is
    used with no command arguments, it prints all. UDP and socket connections. As
    you can imagine, it can be huge on busy machines.


    The -p shows TCP connections. The -a makes ss display UNIX domain sockets alone.
    You can use -A for showing TCP connections


    All previous command lines can be combined with the -a option. The -a tells ss
    to display both listening and non-listening sockets. For example, -a will display
    established TCP connections. In other words, it tells ss to include all open ports
    that are just waiting for a connection. The ss -w -a command shows RAW connections.


    # 01 Installing and using ss


    By default, ss is not installed by default. On a Debian Linux system, you can
    find it in iproute2 package. If you cannot find it, you can install iproute2 package
    using your favourite package manager. The fact that normal users do not have privileges
    on a Linux system limits the output of the ss command, especially when you are
    investigating ports that belong to the root user.


    | Socket Type | State | Local Address:Port | Peer Address:Port | Process |

    | --- | --- | --- | --- | --- |

    | tcp | LISTEN | 0.0.0.0:22 | 0.0.0.0:* | users("sshd",pid=1234,fd=3)) |

    | tcp | ESTAB | 192.168.1.5:54321 | 8.8.8.8:443 | users("nginx",pid=5678,fd=12))
    |

    | udp | LISTEN | 0.0.0.0:53 | 0.0.0.0:* | - |


    ```

    $ ss -ltnp

    Netid Rec-Q Send-Q Local Address:Port Peer Address:Port  Process

    tcp   0      0      LISTEN     0.0.0.0:22        0.0.0.0:*       users:(("sshd",pid=1234,fd=3))

    tcp   0      0      LISTEN     0.0.0.0:53        0.0.0.0:*       users:(("systemd-resolve",pid=800,fd=5))

    ```


    ```

    $ ss -ltup

    Netid Rec-Q Send-Q Local Address:Port Peer Address:Port  Process

    tcp   0      0      LISTEN     0.0.0.0:22        0.0.0.0:*       users:(("sshd",pid=1234,fd=3))

    tudp   0      0              0.0.0.0:53        0.0.0.0:*       users:(("systemd-resolve",pid=800,fd=5))

    ```


    The -l flag is used to show listening sockets, following information similar to:


    +   - -l, only listening sockets

    - -p, show process information

    - -a, all sockets

    - -n, extended socket information

    - -m, memory usage


    The -n flag shows sockets using numeric addresses.


    Do not try to resolve service names.


    +   - -l, listening sockets

    - -n, numeric addresses


    Both listening and non-listening sockets are:


    +   - -l, only listening sockets

    - -a, all sockets


    To show all sockets, use:


    ```

    $ ss -an

    ```'
