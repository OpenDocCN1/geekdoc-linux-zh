    # Move passwords with Pass


    You can easily move the passwords from Gmail to a directory named gmail-to-pass
    using the move command. If the destination is specified, it will overwrite entries
    unless the trailing slash is treated as a directory. Note that passwords will
    be re-entered to the keys of their new destination.


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_28_0.png)


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_28_1.png)


    # Using Pass


    Now that you have your password in Gmail, let''s start storing passwords. If you
    were going to store Gmail passwords, use your gmail-type:


    ```

    $ pass edit gmail/User

    ```


    Here (user) using your username in Gmail and the file (user.gpg). Once you enter
    your password, pass will encrypt the file so no one can read it without your GPG.
    If you look under `password-store/gmail/` you''ll see a file user.gpg. The path
    is optional, but it helps to keep track of passwords. If you have pass installed,
    you can create a new password entry, use:


    ```

    $ pass generate gmail/User12

    ```


    12 denotes the length. The auto-generated passwords will include upper and lower
    letters, numbers, and special characters. To read a password, you will need to:


    ```

    $ pass user

    ```


    So Gmail pass user would print the password to the terminal. If you don''t want
    the password to be seen by someone looking over your shoulder, use


    ```

    $ pass -c gmail/User

    ```


    After four seconds, this will copy the password to your clipboard. You can then
    easily paste it on the login form. To get it of a password, use


    # Vaultier


    While Pass is a simple tool, Vaultier is a full-fledged password manager with
    a browser-based GUI. Vaultier comes with many features of the box, like the ability
    to operate within a team. Vaultier also supports PostgreSQL


    It is important to mention that Vaultier uses PostgreSQL as the underlying database
    and nginx as the proxy server for the application. In addition, there are couple
    of other things, the extension, that need to be installed. First of all, let''s
    create the installation directory and vaultier


    ```

    $ mdir -p /opt/vaultier

    $ cd /opt/vaultier

    ```


    Then, install the required system and deployment tools,


    ```

    $ sudo apt install postgresql-contrib

    $ sudo apt install postgresql-server-dev

    $ sudo apt install nginx

    $ sudo apt install supervisor

    $ sudo apt install superuser

    $ sudo apt install weasel

    $ sudo apt install python-3-virtualenv

    $ sudo apt install python-dev

    ```


    Once all of these are successfully installed, create and activate your virtual
    environment.


    ```

    $ virtualenv venv

    $ source /opt/vaultier/venv/bin/activate

    ```


    Finally install Vaultier


    ```

    $ pip install vaultier

    ```


