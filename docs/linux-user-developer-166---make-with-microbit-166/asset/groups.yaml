    # Tutorial Password management


    ## Connect to Padlock Cloud


    Padlock allows you to sync your data across all devices. It is not enabled by
    default. To enable Padlock Cloud, click the sandwich menu icon in Padlock, and
    then select Connect to Cloud. In the form that appears, simply fill in your email
    and device name and click.


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_29_0.png)


    In there are logical containers that store your secrets like passwords, notes
    or files up to 25KB in size. By default there is no card, click on the "Add card"
    button on the right side of the page to add a card to your vault. You can think
    of vaults as folders and cards as sheets where you store your data.


    Once you have data in Vault, you can invite or manage your team using the "Invite"
    and "Team" buttons on the bottom-right side of the page.


    ```bash

    export PADLOCK_PATH="$PATH:/opt/vaultier/usr/local/lib/python2/site-packages/vaultier"

    ```


    Then update your environment variable.


    Let us configure the config file. Change the path to /opt/vaultier directory and
    then run the command


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_29_1.png)


    ## $ vault init


    You''ll be asked you to the PostgreSQL prompt; where you want to place the host,
    the database, and the database type. Now check if everything is set up correctly,


    ## $ vault dbcheck


    Then check the database connection, run


    This should take you to the PostgreSQL prompt; indicating the database connection
    is success. Create the vault by prompting q. Create the database tables by running


    ## $ vault setup


    Then start with Vaultier


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_29_2.png)


    You should be able to access Vaultier at: localhost:8009 in your browser.


    ## Using Vaultier


    You can see the login/signup page to access Vaultier on your browser. Create your
    account to log in to the system. The vaults are logical containers that store
    your cards. Vault lists all your vaults. If you are here for the first time, you''ll
    only see the "Default Vault". Click on the vault to reveal all the cards stored.


    Padlock is a minimalist open source password manager. As a Chrome application,
    iOS and Android app, Padlock provides only the most essential functionality. You
    may be found ''Padlock'' in Chrome Store.


    Padlock is also available as service padlock Cloud that allows you to sync your
    password data across multiple devices and easily. When you connect to Padlock
    through the Cloud, simply enter your email address. This will be used for authentication
    by sending you a confirmation link every time you want to connect your devices
    to Padlock Cloud.


    Padlock creates an encrypted version of your data on your servers, then you can
    decrypt it from any device that has the Padlock installed. Your data is encrypted
    and decrypted offline or whenever you are connected.


    Installing Padlock is easy if you use Chrome, check the Chrome web store and search
    for Padlock. Once you find it, just click install. It is also available on Android
    or iOS devices through their respective app stores. Once installed, launch Padlock
    in Chrome via the app launch.


    # Available as a Chrome application, and on iOS and Android Padlock provides only
    the most essential functionality. There may be features ''missing'' in Padlock
    but this is by design.


    ## Using Padlock


    Padlock takes a minimalistic approach to password management yet has all the very
    important features. Moreover the Padlock UI is minimalist so all the options are
    nearly hidden behind a sleek UI. As you launch Padlock via the Chrome app launcher,
    you will be asked to enter your password. If it is your first time, you will be
    directed to the re-enter password.


    Once the password is confirmed, you''ll be taken to the home vault. Here you have
    options to import your passwords, create a new entry, manage backups and restore
    them. The sync option lets you sync all your data devices if you create a free
    Cloud account. You can also create Record so you can use your user ID to add password
    to Padlock on device.


    While adding passwords, you can also use the password generator. Auto generates
    a fine tuned strong password with a specific number of special, numeric and capital
    characters. Padlock also comes with the ''Lock App'' feature that lets you lock
    Padlock with one click.


    ## Password Safe


    Password Safe is a Windows-based standalone tool to help manage your passwords
    with ease. It allows you to store your passwords in a safe i.e. password database,
    create multiple databases for different purposes for one or several people. It
    is important to note that each database is independent and can be moved and used
    on different computers. Password Safe is installed on the systems. The passwords
    are encrypted with an encryption key derived from the master password. However,
    the master password is not kept in the database.


    Password Safe installation is a Windows exe file double-click installation. During
    the install process you will be asked whether you like to go for Regular installation
    or Green Regular means just that— Green installation means the software makes
    use of a separate USB flash media device to ensure the passwords are portable,
    and does not use the Windows Registry. This helps make sure you are completely
    secure against any registry-related hacks. If you are not a Windows


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_30_0.png)


    ## Using Password Safe


    After you open Password Safe, you''ll see a text field labelled ''Open Database'',
    which can be used to create passwords. The first time it is executed, you will
    need to create a password. To start process, click the "New..." button in the
    bottom-right corner. Once you choose to set master password it will be used to
    access the passwords you will store in Password Safe. Enter the same password
    twice, once in the setup and once in Password Safe. If password is simple, Password
    Safe will pop up and if you want to edit your entry or something else using the
    "Add Entry" button. The entry forms information like username, notes and emails.


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_30_1.png)

    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_30_2.png)

    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_30_3.png)

    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_30_4.png)

    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_30_5.png)

    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_30_6.png)

    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_30_7.png)


    ## Investigate network sockets with ss


    Use the ss command line utility to monitor network connections. The study of UDP
    and socket connection is important for every network administrator as ss allows
    you to see how your system is doing. Many command line tools help you to get statistics
    on your network connections have been replaced by the more capable ss, iproute2
    Suite which will be further investigated in the next issue of Linux User and Developer.
    However, ss can do many things it deserves.


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_31_0.png)


    ## 02 Basic usage


    The simplest way to use ss is without any command line arguments. As you can imagine,
    it can be huge on busy machines. The -p shows TCP connections. The -a makes ss
    display domain sockets alone. All previous command lines can be combined with
    the -a option. -a tells ss to display both listening and non-listening sockets.
    For example, -a will display established TCP connections.


    ## 01 Installing and using ss


    By default, ss is not installed by default. On a Debian Linux system, you can
    find it in iproute2 package. If you cannot find it, you can install iproute2 package
    using your favourite package manager. The fact that normal users do not have privileges
    on a Linux system limits the output of the ss command, especially when you are
    investigating ports that belong to the root user.


    | Socket Type | State | Local Address:Port | Peer Address:Port | Process |

    | :--- | :--- | :--- | :--- | :--- |

    | tcp | LISTEN | 0.0.0.0:22 | 0.0.0.0:* | users("sshd",pid=1234,fd=3) |

    | tcp | ESTAB | 192.168.1.5:54321 | 8.8.8.8:443 | users("nginx",pid=5678,fd=12)
    |

    | udp | LISTEN | 0.0.0.0:53 | 0.0.0.0:* | - |


    ```bash

    $ ss -ltnp

    Netid Rec-Q Send-Q Local Address:Port Peer Address:Port  Process

    tcp   0      0      LISTEN     0.0.0.0:22        0.0.0.0:*       users:(("sshd",pid=1234,fd=3))

    tcp   0      0      LISTEN     0.0.0.0:53        0.0.0.0:*       users:(("systemd-resolve",pid=800,fd=5))

    ```


    ```bash

    $ ss -ltup

    Netid Rec-Q Send-Q Local Address:Port Peer Address:Port  Process

    tcp   0      0      LISTEN     0.0.0.0:22        0.0.0.0:*       users:(("sshd",pid=1234,fd=3))

    tudp   0      0              0.0.0.0:53        0.0.0.0:*       users:(("systemd-resolve",pid=800,fd=5))

    ```


    The -l flag is used to show listening sockets, following information similar to:


    - - -l, only listening sockets

    - -p, show process information

    - -a, all sockets

    - -n, extended socket information

    - -m, memory usage


    The -n flag shows sockets using numeric addresses.


    Do not try to resolve service names.


    - - -l, listening sockets

    - -n, numeric addresses


    Both listening and non-listening sockets are:


    - - -l, only listening sockets

    - -a, all sockets


    To show all sockets, use:


    ```bash

    $ ss -an

    ```

