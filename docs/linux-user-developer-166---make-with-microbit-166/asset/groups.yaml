  - '[PAGE 12]


    > Intel has created a new feature that allows regions of memory to be carved into
    "enclaves" that are private


    produced via several new-post filesystem iterations. On the whole, Stephan''s
    patches have been well received, with the main concern being that they rely upon
    kernel-resolution timers for measurement of random differences in certain events.
    Intel notes, that he isn''t going for perfection on all legacy systems, but merely
    to not regress benefit to users of contemporary hardware.


    # # Ongoing development


    A group of researchers at University of Technology and TU Darmstadt would like
    participating in a research survey concerning the use of kernel tools. The plan
    is to implement an independent dependency-resolution system and evaluate your
    feedback. Your efforts will be greatly appreciated.


    There were many concerns mentioning the posting of enclaves for supports like
    "Security Enclaves". At this point, it is not possible to access the enclave by
    the CPU itself.


    What this means for Intel is that a new feature in its processors allows regions
    of memory to be marked as private and for which using an encryption key that does
    not survive reboot is encrypted at the chip memory interface. It is possible to
    access the enclave region (or modify code) which might also be inside a container
    or a lightweight virtual machine. This feature will allow for improved security
    by allowing enclaves to store cryptographic keys and algorithms in a way that
    is difficult to determine by hackers.


    While SGX is a good feature, there were some concerns raised by members of the
    kernel community as to the current implementation. The current implementation
    in shipping partners (formerly the consensus) does not require that code to be
    signed applications. It is signed by Intel before it can execute inside an enclave.


    This is a restriction that appears gone away in the near future. The introduction
    of a "one for all" Model Specific Register will eventually allow the kernel to
    load a new root of trust into the hardware at boot time. Until then, there was
    great reliance on trust that could only be used by those who have signed it. This
    is feature will be tested by various developers before it is merged upstream.


    Finally, Grant Likely announced that there has been a recent round of elections
    for a new chair for the TAB. Chris Tabor replaced him as chair, and continuing
    member. The TAB represents the kernel community in the Linux Foundation and provides
    a certain level of protection against potential policy changes that the open source
    developers of it might be unaware of. Therefore, it is good to know that Chris
    Tabor is taking over as chair: Chris is author of and also known as responsible
    for Facebook''s kernel team.


    www.linuxuser.com | 13'
  - '[PAGE 13]


    # Feature Make with micro:bit


    # MAKE WITH

    micro:bit


    Learn what the BBC micro:bit is, be inspired by what others have already built,
    and develop your own coding skills with five exciting projects


    # ARM Processor


    At the heart of the micro:bit''s processing power is a small embedded ARM micro-controller
    which has 128KB of flash memory and plenty of RAM memory


    # I/O Pins (input / output)


    Input and Output (I/O) Pins support additional wires and hardware components (such
    as a buzzer) being connected to your micro:bit to extend its functionality


    # Magnetometer


    This sensor detects magnetic fields and uses the readings to calculate the direction
    that the micro:bit is pointing. It can also be used to calculate North and create
    a simple compass.


    # Accelerometer


    When moving the micro:bit, this sensor measures how quickly the speed changes.
    This is used to calculate acceleration and can control player directions in a
    game'
  - '[PAGE 14]


    # Push buttons

    micro:bit projects


    Control user interaction in games and programs using Button A or Button B. Both
    of these buttons can be orchestrated and pressed to give you a third input option,
    A + B


    # 5x5 LED matrix


    25-colour red LEDs used to display simple images, scroll messages and even create
    basic animations


    Four fun and Inspiring projects to show off functionality and features


    # Step Counter


    http://bit.ly/1T9sSwHw


    Keep track and monitor how many steps you take each day by creating your own pedometer.
    Use the built-in accelerometer and LEDs. Attach it to your leg and check the micro-bit''s
    display for the number of steps you have taken.


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_14_0.png)


    # Musical Fruit


    http://bit.ly/273Y77


    Take some fruit and combine them with the micro-bit to create a musical instrument.
    Touch each piece of fruit to trigger a musical note, drum or bass.


    # Scoreboard


    http://bit.ly/1T9S6hs


    Football with micro:bit will help your family create a game where hitting the
    goal triggers a buzzer and displays a winning animation. Use the project to build
    a scoreboard for a football or any game of your choice.


    # Fortune Teller


    http://bit.ly/3Y9W6


    Code the future with this useful project that you predict your future fortune.
    Share with friends to see who has the best future for their personal life. Will
    you be rich and famous?


    The micro:bit is a pocket-sized coder with a vast array of sensor capability including
    motion detection, a built-in compass, and Bluetooth technology. It is the outcome
    of a collaboration with 29 partners with an aim to inspire creativity and develop
    a new generation of coders. Every Steve Student in the UK gets a free micro:bit
    to start them on their first journey of discovery.


    The micro:bit is designed for young people to be creative and develop core skills
    in: technology and engineering, it is equally exciting and fun for adults too.
    The device measures 4cm by 5cm, and is small enough to be fun and easy to use.
    You can code something simple in a few seconds without prior knowledge of coding.


    The micro:bit has been designed to connect to other devices, such as Arduino,
    Raspberry Pi, and Android phones and tablets, enabling you to create more complex
    projects.


    Over the next few pages we will look through the main parts of the micro-bit in
    detail, and how the features enable you to create your own projects. Looking for
    some inspiration? Look to the right to find some fun and creative ideas, such
    as the digital football scoreboard card and other projects that let you predict
    your future with your own fortune teller, or make fruit into a musical instrument
    that will get you stuck into coding and developing with your micro:bit.


    www.linuxus.co.uk 15'
  - '[PAGE 15]


    # Make with micro:bit


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_15_0.png)


    The micro:bit is packed with three connectivity options, making it versatile and
    compatible with a wide range of other devices and hardware. The in-built Bluetooth
    can be used to send and receive data to and from the microbit. Third-party apps
    for Samsung and Apple devices enable you to write and code via your mobile phone
    or tablet. This makes the coding environment mobile. You can code in the car,
    on a train or a plane, and complete and download your script.


    Plus, when connected via Bluetooth you can access the hardware on your device.
    For example, you can use your microbit as a remote for your phone, take selfies
    or trigger the ringtone to find your phone and much more. The microUSB connection


    provides a stable interface and is compatible with most laptops and computers.
    Plug it in and access the microbit as a folder to download your scripts. Transfer
    is quick. This method also gives you a direct hyperlink to the BBC website. To
    make your projects more portable, the microbit can be powered by a small battery
    pack which uses two Triple-A batteries. You may require the microbit to be attached
    to something, such as a caddy toy that makes a sound when picked up, into clothing
    as wearable tech, or onto a bike to measure the distance you have travelled. Note
    that the battery please as download code unless you are connected via Bluetooth,
    this drains the batteries and limits the up time.


