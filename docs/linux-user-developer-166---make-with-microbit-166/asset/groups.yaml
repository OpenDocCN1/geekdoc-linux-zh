    We now have a fully working baby monitor. To get the monitor up and running is
    to launch:


    `sudo service motion start`


    ## Adjust quality


    While you can alter the dimensions of the images captured by the Pi, it is important
    to be careful with figures. Dimension needs to be multiples of 4. For instance,
    use 1280x800 or 1920x1080. Not only larger images impact bandwidth, they''ll make
    the resulting AVI file larger.


    ## Different USB webams have their own power requirement. Some will run off the
    device but require a power source provided via USB port. If you''re positioning
    the baby monitor away from a source, a rechargeable battery should be able to
    provide access for 12 hours.


