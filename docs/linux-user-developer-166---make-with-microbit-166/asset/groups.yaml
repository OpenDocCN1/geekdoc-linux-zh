    \ to understand how space is available and how much is in use. The command shows\
    \ how much space particular partitions are consuming. More information provided\
    \ by your mounted file systems.\n\n## Debug Makefiles\n\nIn a world full of pre-compiled\
    \ binary packages, sometimes you still need to face the intricacies of the GNU\
