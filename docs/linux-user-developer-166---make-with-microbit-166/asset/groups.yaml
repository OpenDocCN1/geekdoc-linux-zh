    \ as, \"first script\".\n\n+   02 Add the button press\nNow select the middle\
    \ line between the function start and end. You will see code blocks at the bottom\
    \ of the screen. Select the \"input\" block; now the word \"input\" appears within\
    \ the block. Drag it to build up the code within the function. By selecting \"\
    button press\", you will see it now added the function. Then drag the word \"\
    do\" to the end of the line; the code now reads when Button A is pressed, do something.\n\
    \n+   03 Code the face\nNext, code what you want the microbit to do when Button\
    \ A is pressed. This triggers a face to be displayed on the LED matrix. To create\
    \ the face, move down one line and select \"show LED\". The LED image appears.\
    \ You can select build a simple face if you prefer another example of your choice.\
    \ Click OK and your image will be saved. The 400ms refers to the length of time\
    \ the image is displayed for. This is measured in milliseconds: 400 four seconds.\n\
    \n```\njavascript ascript\nfunction main() {\n\ninput.onButton(Button.A, function\
    \ () {\n\tled.showString(\"HELLO\")\n\tpause(4000)\n})\n\n}\n```\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_19_2.png)\n\
    \n![](img/765b68b6c1fdb1413feedf2dc3295bc6_19_3.png)\n\n+   04 Test it\nNow run\
    \ your script and test that it works. At the top of screen select the run button.\
    \ This prepares your script for the microbit emulator, which is on the right of\
    \ the screen. When it is finished loading, press \"Button A\" it will display\
    \ the image you made in step 3 on the LED matrix.\n\n+   05 Compile\nOur program\
    \ shows you how to compile the script to run on microbit. Converting the script\
    \ from a high-level programming language into machine code, making it compatible\
    \ with the processor. Click the compile button at the bottom of the screen, begins\
    \ the compiling and downloads your file.\n\n+   06 Transfer to your microbit\n\
    Connect your microbit to computer using the USB cable and open the folder on the\
    \ microbit; drag the compiled code into the folder (The code is normally saved\
    \ to your download folder). On the back of the microbit LED indicator will flash\
    \ as the program is written to your device. It is ready to use; just press button\
    \ A."
