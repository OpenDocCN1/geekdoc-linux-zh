    \ (iframe sandbox) as the AMP document and executes JS inside that sandbox. Here\
    \ is how it works:\n\nSimilarly, using the amp-video element:\n\n```html\n<amp-video\
    \ width=\"380\" height=\"300\"\ndata-aspect-size=\"300x258\"\ndata-pause-test=\"\
    test123\"\ndata-src=\"ad-src\"></amp-ad>\n```\n\nAMP requires width and height\
    \ values to be specified for all resources. The AMP ad type identifies the attributes\
    \ that are automatically passed as arguments to the code that eventually renders\
    \ the ad. These attributes are required for a given type of network. These attributes\
    \ are and should be documented with the ad network.\n\n## Tutorial Google AMP\n\
    \n![](img/765b68b6c1fdb1413feedf2dc3295bc6_45_0.png)\n\nThe runtime is a piece\
    \ of JavaScript that runs inside every AMP document. It provides implementations\
    \ for AMP elements resource loading and optimization and includes a runtime for\
    \ HTML used during development.\n\n## 05 Tracking pixels\n\nA tracking pixel is\
    \ a 1px by 1px image embedded in an HTML page or an email. It is used to track\
    \ visits to the page where it is embedded. AMP HTML provides a custom element\
    \ <amp-pixel> to be used as a tracking pixel. The element can load any image,\
    \ which can be confusing. It takes a single URL, but allows variables that can\
    \ be replaced by the component in the URL string when making it. It also allows\
    \ all standard URL variables for extension.\n\nSimilarly, to embed a Facebook\
    \ post:\n\n```html\n<amp-facebook custom-element=\"amp-facebook\"\nsrc=\"https://cdn.ampproject.org/v8/amp-facebook-0.1.js\"\
    ></script></amp-facebook>\n```\n\nTo include a Video, use the amp-youtube element.\n\
    \n```html\n<amp-youtube width=\"486\" height=\"273\"\nlayout=\"responsive\"\n\
    data-href=\"https://www.youtube.com/watch?v=dQw4w9WgXcQ\"\n></amp-youtube>\n```\n\
    \nThen, pass the video to the amp-youtube element\n\n```html\n<amp-youtube\ndata-videoid=\"\
    GENR8dcQ7\"\nlayout=\"responsive\"\nwidth=\"486\" height=\"270\"\n></amp-youtube>\n\
    ```\n\n## 06 Embed third-party components\n\nWe need to embed several third-party\
    \ components to stay relevant. AMP HTML provides ways to embed third-party components\
    \ like Twitter, Instagram or Facebook posts. You can do this by embedding a tweet\
    \ in your page using the amp-twitter element. To include a tweet in your page,\
    \ first include the following in the head:\n\n```html\n<amp-twitter custom-element=\"\
    amp-twitter\"\nsrc=\"https://cdn.ampproject.org/v8/amp-twitter-0.1.js\"></script></amp-twitter>\n\
    ```\n\nThen use the amp-twitter\n\n```html\n<amp-twitter width=\"300\" height=\"\
    50\"\nlayout=\"responsive\"\ndata-tweet=\"781825186743169\"\n></amp-twitter>\n\
    ```\n\nCurrently tweets are automatically scaled to fit the provided size, but\
    \ this might yield less ideal appearance. Manually tweak the tweet width and height\
    \ or use the media attribute to select the aspect ratio based on screen.\n\n##\
    \ 07 Styling your AMP pages\n\nWith CSS, your AMP pages use external stylesheets\
    \ (with the exception of <https://www.ampproject.org/docs/guides/custom-function/custom-functions.html#custom-font>\
    \ custom fonts) and inline styles only. Note that custom properties and animations\
    \ are disabled due to performance issues.\n\nFinally, the embedded tag must be\
    \ in the head of the page. The power of inline CSS is limited, but there are elements\
    \ that are there to improve the performance of your pages. You might think the\
    \ inline styles adds to every page, but the saved round trip to server would be\
    \ better for performance. In addition\n\nAdd styles to your AMP page using a single\
    \ style-custom tag in the head of the document.\n\n```html\n<style amp-custom>\n\
    {\n  /* any custom style goes here. */\n  background-color: gray;\n}\n</style>\n\
    ```\n\n> If there's something wrong with your page, it won't be discovered by\
    \ third party websites and won't appear in the Google AMP Cache\n\nMake sure there's\
    \ only one of these style tags on your page, or more than one is allowed in AMP.\
    \ You can also style AMP custom elements using CSS:\n\n```html\n<style amp-custom>\n\
    amp-img {\n  border: 5px solid black;\n}\namp-img.placeholder {\n  background-color:\
    \ grey;\n}\n</style>\n```\n\n## 08 Configure analytics\n\nAMP-analytics is also\
    \ available as a custom AMP element. You can use the element and start tracking\
    \ your website traffic. The analytics element is used to measure activity on an\
    \ AMP document. The details concerning what is measured in JSON and how data is\
    \ sent to an analytics service is via a POST request. It comes pre-configured\
    \ to support many analytics vendors out of the box.\n\nFor example, the following\
    \ amp-analytics element configured to send a request to your example when the\
    \ document is loaded, and each time the document is loaded:\n\n```html\n<amp-analytics>\n\
    <script type=\"application/json\">\n  \"requests\": {\n    \"pageview\": \"https://example.com/analytics?url=$url&title=${title}&account=$account\"\
    ,\n    \"event\": \"https://example.com/analytics?id=$eventId&label=$label}&account=$account\"\
    \n  },\n  \"vars\": {\n    \"account\": \"AC123\",\n    \"triggers\": {\n    \
    \  \"pageview\": {\n        \"on\": \"visible\",\n        \"event\": \"pageview\"\
    \n      },\n      \"trackerClicks\": {\n        \"on\": \"click\",\n        \"\
    selector\": \"a\",\n        \"event\": \"event\",\n        \"eventId\": \"42\"\
    ,\n        \"eventLabel\": \"clicked on link\"\n      }\n    }\n  }\n</script>\n\
    </amp-analytics>\n```\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_46_0.png)\n\n\
    You can also add a name of analytics with the type attribute. This will help you\
    \ configure amp-analytics to the respect.\n\n## 09 Validation\n\nThe AMP validation\
    \ service detects that something is wrong with your page, it is not discovered\
    \ and distributed by third-party caches. So not only will you lose the benefits\
    \ of the cache, it's likely that your page will not be seen in search results.\
    \ You must validate your AMP pages before you publish and audit it. Finally, the\
    \ key to fast speed is in a way that can be validated using the Chrome browser.\n\
    \nTo validate AMP pages, open it from the file system using a local server like\
    \ Apache or Nginx. Once the page is loaded, go to the URL, open Chrome DevTools\
    \ console and check for validation errors. If you get some validation error, it\
    \ is easy to fix it with a Google search.\n\n## 10 How it works\n\nAMP pages only\
    \ allows asynchronous scripts. AMP pages cannot include any other JavaScript.\
    \ Interactive features are handled by custom AMP elements. The custom elements\
    \ may use JavaScript under hood, but they must be carefully designed to make sure\
    \ they don't cause degradation. AMP pages allow third-party JavaScript through\
    \ iframes. By restricting them we block the execution of the main page. Even if\
    \ they trigger multiple calculations, their tiny iframes have very little DOM.\
    \ Also, AMP resources are loaded so that the most important resources are downloaded\
    \ first. Images and ads are only downloaded if they are likely to be seen by the\
    \ user, above the fold, or if the user is to quickly scroll to them.\n\n![](img/765b68b6c1fdb1413feedf2dc3295bc6_46_1.png)\n\
    \n* With the\n"
