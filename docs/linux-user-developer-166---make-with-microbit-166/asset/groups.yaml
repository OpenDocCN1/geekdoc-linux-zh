    App）功能，让你只需一键即可锁定 Padlock。


    ## Password Safe


    Password Safe 是一个基于 Windows 的独立工具，帮助你轻松管理密码。它允许你将密码存储在安全的（即密码数据库）中，为一个人或多个人的不同目的创建多个数据库。需要注意的是，每个数据库都是独立的，可以移动并在不同的计算机上使用。Password
    Safe 安装在系统中。密码使用从主密码派生的加密密钥进行加密。然而，主密码并不存储在数据库中。


    Password Safe 安装是一个 Windows exe 文件，双击即可安装。在安装过程中，系统会询问你是否想选择“常规安装”（Regular installation）。“绿色常规”（Green
