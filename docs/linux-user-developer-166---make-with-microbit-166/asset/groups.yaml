    ## My Pi project


    ### Think you can outsmart a robot?

    Dave Pride''s 4th-Bot will put you to test


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_66_0.png)


    ### What inspired you to make this?


    I took part in Pi Wars, hosted at Cambridge University last December, and thought
    about supplying some robots to the Raspberry Pi for their robot ''Robot Pod''
    as well. My wife won the BERT SHOW in July so I used it to build a LEGO block
    set, as you do. I used this Pi module and a colour sensor to identify the different
    coloured blocks and used the arm to drop them in the connector''s bucket.


    Based on this I looked over other options for the colour-code and found something
    much better. Research led me to find that the logic could be from simple. There
    is plenty of information online, so I tried several versions of Version 4 Pi,
    which then successfully ran on the Pi pod.


    ### How has the development of the robot affected you?


    It took a lot of months and weekends to complete the bot. The first part was tricky
    but I got it working over time. It is exactly as I expected the Python modules
    by working the Raspberry Pi to work. These values do how much change dramatically
    on the lighting.


    ### What role does the Raspberry Pi play in your project?


    The Raspberry Pi is inside the bot; the game program is written in Python and
    is configured to run at boot.


    that control the arm and the LCD are monitored by the Pi board. Mark Carlin at
    Astro Designs said that having an on-board build with FPGA and the ability to
    control 50-servos was not enough to get it working. I''m currently working on
    a Raspberry Pi HAT now.


    ### How did you use the Minimax algorithm for this project, how does it integrate
    with the robot?


    I used the Minimax algorithm that the game uses well - although it didn''t know
    when to move. I wrote a Python class for it and adapted it for use.


    I captured the Pi camera image into an array of RGB. These values are converted
    to integers and then saved in an array as the ''state''. This state then picks
    the ''best'' move which massively increases the control time where the bot plays
    a pretty game but the time itself is still slow. With capturing and processing,
    the algorithm calculates the next move and counting the time per turn is increasing.
    The trickiest part was crafting the game logic for the arm, which picks up a cup
    and drops it in the correct.


    ### How intense is the robot? How were you able to assemble it?


    It works well with the Pi. The trade-off is in the depth of search. With a Pi
    2 the time calculation time is around 7 seconds. If you increase the search depth.


    ### What''s next?


    In terms of what I''m currently using, I am learning many projects. A complete
    guide to the algorithm would be helpful. I also want to find more Raspberry Pi
    projects. My coding helped me create obhtobot (htobot.com) which has software
    that runs on Pi via USB connection. I''m currently converting to run on the Raspberry
    Pi


