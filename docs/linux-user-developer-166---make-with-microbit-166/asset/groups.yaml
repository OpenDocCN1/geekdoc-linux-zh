    # # ShowFOTO


    ## How does digikam''s built-in-editor perform against the rest?


    # # GIMP


    ## The long-heraled king of open-source image editing is as good as ever


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_82_0.png)


    +   - Use the properties section to take a closer look at the details of a specific
    image


    +   - Experiment with GIMP''s impressive colour palette to find the right combination
    for the image you''re currently editing


    ![](img/765b68b6c1fdb1413feedf2dc3295bc6_82_1.png)


    # ### Tool selection


    There''s a great mix of both beginner and advanced tools on hand, here is just
    enough to keep both audiences happy. Some tools are a little basic in what they
    do and could arguably be combined with other tools, instead of having to customise
    them. I would have liked to see more preview tools, but it''s quite quick to use.


    # ### Tool selection


    With each update, GIMP''s arsenal of tools continues to grow and it is the users
    who benefit the most. The selection on what is offered is unmatched and while
    of what is on offer will be benefit to some users, there''s a couple of needs
    missing. But it is a good and GIMP-whheartedly delivered.


    # ### User interface


    Another example of how to take a minimal approach to your UI and make it work.
    With your photo library to the left and editing tools to the right, everything
    is easy to find and there is really nothing complicated about. It is something
    we find in some of the programs involved in ongoing test.


    # ### User interface


    Despite the many features, GIMP does a job keeping everything organised and relatively
    easy to find. While there is no direct tool to customise the layout, sections
    can be removed and added to make the interface work for you. A small caveat, however,
    is the lack of what of some tools can be made.


    # ### Import option


    Being part of the digikam suite does help expand ShowFOTO''s feature set somewhat.
    However, the options of importing editing tools is be quite directly to the program.
    We fully expect to see ShowFOTO grow as the digikam continues to grow.


    # ### Import options


    No matter the type of tool you want to import into GIMP, chances are support it.
    We especially appreciate the way it deals with file imports, enabling users to
    add any variety of formats in your project (OpenType and Type!). Beginners should
    check out the guide list on the GIMP-website for a simple tutorial.


    # ### Extras features


    If you really want to get with your images, ShowFOTO''s properties system is worth
    checking out. It includes all the information the type and depth of the image,
    as well as being able to edit the exact detail of the image that may have taken
    of. This course is something you won''t apply if you created the image from scratch.


    # ### Extras features


    For Linux users, the fact that GIMP''s core features can be accessed through various
    forms of scripting will be a massive plus. The current selection of scripting
    environments is relatively limited, the new version of GIMP has part API, giving
    access to a wide view of modules that can be added to your projects.


    # ### Overall


    > As a standalone product, ShowFOTO is left behind the competition, but when used
    in conjunction with the digikam suite, it does the job well. Certainly worth playing
    around if you''re after a minimal interface.


    # ### Overall


    There''s no wonder why GIMP has a dedicated following – it continues to provide
    high-quality tools with enough scope to transform any image that you decide to
    load in.'
