    (There will be a few extra files that don''t correspond to processes, though.
    The above example has been shortened)


    Note that even though it is called a filesystem, no part of the proc filesystem
    touches any disk. It exists only in the kernel''s imagination. Whenever anyone
    tries to look at any part of the proc filesystem, the kernel makes it look as
    if the part existed somewhere, even though it doesn''t. So, even though there
    is a multigabyte /proc/kcore file, it doesn''t take any disk space.


    # Which Filesystem Should Be Used?


    There is usually little point in using many different files. Currently, ext2fs
    is the most popular one, and it is probably the wisest choice. Depending on the
    overhead for bookkeeping structures, speed, (perceived) reliability, compatibility,
    and various other reasons, it may be advisable to use another filesystem. This
    needs to be decided on a case-by-case basis.


    # Creating A Filesystem


    Filesystems are created, i.e., initialized, with the mkfs command. There is actually
    a separate program for each filesystem type. mkfs is a front end that runs the
    appropriate program depending on the desired filesystem type. The type is selected
    with the -t ftype option.


    The programs called by mkfs have slightly different command line interfaces. The
    common and most important options are summarized below; see the manual pages for
    more.


    +   -t ftype-

    Select the type of the filesystem.


    +   -c

    Search for bad blocks and initialize the bad block list accordingly.


    +   -l filename

    Read the initial bad block list from the name file.'
