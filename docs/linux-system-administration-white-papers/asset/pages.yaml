- pgno: 144
  md: '# Various Network Applications


    In TCP/IP networks, the authors of RPC were faced with the problem of mapping
    numbers to generic network services. They chose to have each server provide both
    a TCP and a UDP port for each program and each version. Generally, RPC applications
    will use UDP when sending data, and only fall back to TCP when the data to be
    transferred fits into a single UDP datagram.


    Of course, client programs have a way to find out which program number maps to.
    Using a configuration file for this would be too inflexible; RPC applications
    don''t use reserved ports, there''s no guarantee that a port originally meant
    to be used by our database application hasn''t been taken by some other process.
    RPC applications pick any port they can get, and register it with the so-called
    portmapper daemon. The latter acts as a service broker for all RPC servers running
    on its machine: A client who wishes to contact a service with a given program
    number will first query the portmapper on the server''s host, which returns the
    TCP and UDP ports the service can be reached at.


    This method has the particular drawback that it introduces a single point of failure,
    which the inetd daemon does for the standard Berkeley services. However, this
    is even a little worse, when the portmapper dies, all RPC port information is
    lost; this usually means you have to restart all RPC servers manually or reboot
    the entire machine.


    The portmapper is called rpc.portmap and resides in /usr/sbin.


    > Note

    For Red Hat 6, the portmapper resides in /sbin/portmap.


    # Configuring the r commands


    There are a number of commands for executing commands on remote hosts. These are
    login, rsh, rcp and rcmd. They all spawn a shell on the remote host and allow
    the user to execute commands. Of course, the client needs to have an account on
    the host where the command is to be executed. Thus, all these commands perform
    an authorization procedure. Usually, the client will tell the user''s login name
    to the server, which in turn requests a password that is valid in the usual way.


    ```

    #

    # /etc/rpc - miscellaneous RPC-based services

    #

    portmapper  100000 portmap sunrpc

    rstat       100001 rstat stat svc rup perfmer

    rusersd     100002 rusers

    nfs         100003 nfsprog

    ypserv      100004 ypprog

    mountd      100005 mount showmount

    ypbind      100007

    ```'
  merge: -1
  img_proc: true
- pgno: 145
  md: '```

    walld 100008 rwall shutdown

    ypasswdd 100009 ypasswd

    bootparam 100026

    yupdated 100028 updatedate

    ```


    Sometimes, however, it is desirable to relax authorization checks for certain
    users. For instance, if you frequently have to log into other machines on your
    LAN, you might want to be admitted without having to type your password every
    time.


    Disabling authorization is advisable only on a small number of hosts whose password
    databases are synchronized, or for a small number of privileged users who need
    to access many machines for administrative reasons. Whenever you want to allow
    people to log into your host without having to specify a login ID or password,
    make sure that you don''t accidentally grant access to anybody.


    There are two ways to disable authorization checks for the r commands. One is
    for the super-user to allow certain or all users on all hosts (the latter inevitably
    being a bad idea) to log in without being asked for a password. This access is
    controlled by a file /etc/hosts.equiv. It contains a list of host-and usernames
    that are considered equivalent to users on the local host. An alternative option
    is for a user to grant other users on hosts access to his or her account. These
    may be listed in the file .hosts in the user''s home directory. For security reasons,
    this file must be owned by the user or the super-user, and must not be a symbolic
    link, otherwise it will be ignored. (In an NFS environment, you may need to give
    it protection of 444, because the super-user is often very restricted in accessing
    files on disks mounted via NFS.)


    When a client requests an service, the host and username are searched in the /etc/hosts.equiv
    file, and then in the .hosts file of the user he or she wants to log in. As an
    example, assume Janet is working on Gauss and tries to log into Joe''s account
    on Euler. Through the following, we will refer to Janet as the client and Joe
    as the local user. Now, when Janet types


    ```

    $ login -l joe euler

    ```


    On Gauss, the server will first check hosts.equiv (note that the hosts.equiv is
    not searched when someone attempts to log in as root) if that Janet should be
    granted free access, and if this fails, it will try to lock her up in .hosts in
    Joe''s home directory.


    The hosts.equiv file on Euler looks like this:


    ```

    gauss

    euler

    -public

    quark.physics.groucho.com andres

    ```'
