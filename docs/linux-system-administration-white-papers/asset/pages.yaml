- pgno: 324
  md: '# Using Disks And Other Storage Media


    The mount command takes two arguments. The first one is the device file corresponding
    to the disk or partition containing the filesystem. The second one is the directory
    below which it will be mounted. After these commands the contents of the two filesystems
    look just like the contents of the /home and /usr directories, respectively. One
    would say "dev/hda2 is mounted on /home," and similarly for /usr. To look at either
    filesystem, one would look at the contents of the directory on which it has been
    mounted, as if it were any other directory. Note the difference between the device
    file, /dev/hda2, and the mounted-on directory, /home. The device file gives access
    to the raw contents of the disk, mounted-on directory gives access to the files
    on the disk. The mounted-on directory is the mount point.


    Linux supports many filesystem types. mount tries to guess the type of the filesystem.
    You can also use the -t firstly option to specify the type directly; this sometimes
    is necessary, the heuristics mount does not always work. For example, to mount
    an MS-DOS floppy, you could use the following command:


    ```

    $ mount -t mdos /dev/fd0 /floppy

    ```


    The mounted directory need not be empty, but it must exist. Any files in it, however,
    will be inaccessible by name while the filesystem is mounted. (Any files that
    have already been opened will still be accessible. Files that have hard links
    from other directories can be accessed using those names.) There is no harm done
    with this, and it can even be useful. For instance, some people like to have /tmp
    and /var/tmp synonymous, and make /tmp be a symbolic link to /var/tmp. When the
    system is booted, before the /var filesystem is mounted, a /var/tmp directory
    residing on the root filesystem is used instead. When /var is mounted, it will
    make the /var/tmp directory residing on the root filesystem inaccessible. If /var/tmp
    didn''t exist on the root filesystem, it would be impossible to use temporary
    files before mounting/var/.


    If you don''t intend to write to the filesystem, use the -r switch for mount to
    make it read-only mount. This will make any attempts at writing to the filesystem,
    and will also stop the kernel from updating file times in the inodes. Read-only
    mounts are necessary for unwanted media, e.g., CD-ROMs.


    The alert reader has noticed a slight problem. How is the first filesystem (called
    the root directory) mounted, since it obviously can''t be mounted on another filesystem?
    Well, the answer is that it is done by magic (For more information, see the kernel
    source or Kernel Hackers'' Guide.) The root filesystem is magically mounted at
    boot time, and one can rely on it to be always. If the root filesystem can''t
    be mounted, the system does not boot. The name of the filesystem that is magically
    mounted as root either compiled into the kernel, or set using rdev.


    The root filesystem is usually first readonly. The startup scripts will then run
    LILO to verify its validity, and if there are no problems, they will remount it
    that writes also'
  merge: -1
  img_proc: true
- pgno: 325
  md: '# The Linux System Administrators'' Guide: Chapter 3


    allowed. fsck must not be run on a mounted filesystem, since any changes to the
    filesystem while fsck is running will cause trouble. the root filesystem is mounted
    readonly while it is being checked, fsck can fix any problems without worry, since
    the remount operation will fix any metadata that the filesystem keeps in memory.


    On many systems there are other filesystems that should also be mounted automatically
    at boot time. These are specified in the /etc/fstab file; see the fstab man page
    for details on the format. The details of exactly when the filesystems are mounted
    on many factors, and can be configured by each administrator if needed; see Chapter
    5.


    When a filesystem no longer needs to be mounted, it can be unmounted with unmount.
    (It should of course be, but the "tn" mysteriously disappeared in the 1970s, and
    hasn''t been seen since.) unmount takes one argument: the device file or the mount
    point. For example, to unmount the directories of the previous example, one could
    use the commands


    ```

    $ /dev/hda2

    $ umount

    $

    ```


    The man page for further instructions on how to use the command. It is imperative
    that you always unmount a mounted floppy. Don''t just pop the floppy out of the
    drive! Because of disk checking, the data is not necessarily written to the floppy
    until you unmount it, so removing the floppy from the drive too early might cause
    the contents to become garbled. If you only read from the floppy, this is not
    very likely, but if you write, accidentally, the result may be catastrophic.


    Mounting and unmounting requires super-user privileges, i.e., only root can do
    it. The reason for this is that if any user can use a floppy on any device, then
    it is easier to create a floppy with say, a Trojan horse disguised as /bin/sh,
    or any other often used program. However, it is often necessary to allow users
    to use floppies, and there are several ways to do this:


    +   Give the users root password. This is obviously bad security, but it is the
    easiest solution. It works well if there is no need for security anyway, which
    is the case on many non-networked, personal systems.


    +   Use a program such as sudo to allow users to use mount. This is still bad
    security, but doesn''t give super-user privileges to everyone. (It requires several
    seconds of hard thinking on the users'' behalf.)


    +   Make the users mtools, a package for manipulating MS-DOS filesystems, without
    mounting them. This works well if MS-DOS floppies are all that is needed, but
    is rather awkward otherwise.


    +   List the floppy devices and their allowable mount points together with the
    suitable options in /etc/fstab.'
