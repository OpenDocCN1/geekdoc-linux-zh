    +   organization—Your organization''s name. For example, "Virtual Brewery, Inc."
    On your home machine, "private site," or anything else you like. Most people will
    not call your site properly configured if you''ve customized this file.


    +   mailbox—Your site''s mail name, e.g., vbrew.com.


    +   whoami—Your site''s name for news purposes. Quite often, the UUCP site is
    used, for example, vbrew.


    +   explist—You should probably edit this file to reflect your preferred expiry
    times for special newsgroups. Disk space may play an important role in it. To
    create an hierarchy of newsgroups, obtain an article and a newsgroups file from
    the site that feeds you, and install them in /usr/lib/news, making sure they are
    owned by news and have a mode of 644. Remove all to* from the active file, and
    add tomysite and to.feeds, as well as junk and control. The to* groups are normally
    used for exchanging ihave/sendme messages, but you should create them regardless
    of whether you plan to use ihave/sendme or not. Next, replace all article numbers
    in the second and third field of active using the following command:


    ```

    # cp active active.old

    # sed ''s/[0-9]*\* [0-9]*/000000000 00001/'' active.old active

    # rm active.old

    ```


    The second command is an invocation of sed(1), one of my favorite commands. This
    invocation replaces two strings of digits with a string of zeroes and the string
    000001, respectively.


    Finally, create the news spool directory and the subdirectories for incoming and
    outgoing news:


    ```

    # cd /var/spool

    # mkdir news news/in.coming news/out.going

    # chown -R news.news news

    # chmod -R 755 news

    ```'
