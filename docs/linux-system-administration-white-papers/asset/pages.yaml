    the peer''s hostname. For instance, to use the above entry for authentication
    with c3po, we have to add the following option to pppd''s command:


    ```

    pppd ...domain vbrew.com

    ```


    In the fourth field (and all fields following), you may specify IP addresses are
    allowed for that particular host, just as in the CHAP secrets file. The peer may
    then only request addresses from that list. In the sample file, we require c3po
    to use its real IP address.


    Note that PAP is a weaker authentication method, and it is suggested you use CHAP
    instead whenever possible. We will therefore cover PAP in detail here; if you
    are interested in using PAP, you will find some more PAP features in the pppd
    manual page.


    # Configuring a PPP Server


    Running pppd as a server is a matter of adding the appropriate options to the
    command line. Ideally, you would create a special account, say ppp, and give it
    a script or program as login shell that invokes pppd with these options. For instance,
    you would add the following line to /etc/500/passwd:


    ```

    ppp:*:500:200:Public PAP Account:/tmp:/etc/ppp/0pploglogin

    ```'
