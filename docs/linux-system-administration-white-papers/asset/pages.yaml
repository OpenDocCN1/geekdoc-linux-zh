- pgno: 157
  md: 'Explaining the first command: find everything from the root directory down,
    owned by numeric 9, and on each file or directory you find, change ownership to
    the “news” user (whose uid was just updated in the password file). The reason
    we need to do a find is the usernames and group names are strictly speaking only
    for human consumption; all files and directories are owned by numeric user ID
    (uid) and group ID (gid). When the numbers for uid or gid for a particular user
    change in the password file or group file, the files are still owned by the uid/gid
    of the previous numeric uid/pair. To reclaim ownership of the files, we have to
    recurse through the file system and “chown” to the new uid. The reason why I can
    get away with saying “chown news” is that the password file for the uid that “news”
    corresponds to. The final “\; terminates the command; the backslash escapes the
    semicolon from the shell, which would interpret it as a command separator.


    It is important that you execute these commands with the news passwd installed,
    and you collect all file names before you change the ownership of any of them.
    To update the group ownership of files, you will use a similar command.


    Having done this, the numeric uids and gids on your system will agree with those
    on all hosts in your NIS domain. The next step will be to add configuration lines
    to nsswitch.conf which enables NIS lookups for user and group information. (Refer
    to Listing 9.1 above. Particularly look at the lines for “passwd”, “shadow”, and
    “group”).


    This makes the login command and all its first friends query the NIS maps when
    a user tries to log in, and if this lookup fails, fall back to the local files.
    Usually, you will remove all users from your local files, and only leave entries
    for root and generic accounts like mail in it. This is because some vital system
    tasks may require to map uids to user names or vice versa. For example, administrative
    cron jobs may use the su command to temporarily become news, the UUCP subsystem
    may make a status report. If news and uucp don''t have entries in the local passwd
    file, these will fail miserably under an NIS blowout.


    There are two big caveats in order here: One that the setup as described to here
    only works for login suites that those included in the in-linux package. The intricacies
    of using shadow passwords with NIS will be covered below. Other not, the hand
    command are not the only ones that access the passwd file—look at the Is command,
    we will display the symbolic names for user and group owners of a file; that is,
    for each uid and gid it encounters, it will have to query the NIS server. This
    will slow down things rather badly if your local network is clogged, or even worse,
    when the NIS server is not on the same physical network, so that datagrams have
    to pass through a router.


    Still, this is not the whole story yet. Imagine what happens if a user wants to
    change their password. Usually, this will invoke passwd, which reads the new and
    updates the local passwd file. This is impossible with NIS, since that file isn''t
    available anymore, but having users log into the NIS server whenever theywant
    to change their password is'
