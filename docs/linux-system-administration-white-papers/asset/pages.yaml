- pgno: 192
  md: '# Chapter 12


    # Electronic Mail


    One of the most prominent uses of networking, since the first networks were devised,
    has been electronic mail. It started as a simple service that copied a file from
    one machine to another, and appended it to the recipient''s mailbox file. Basically,
    this is still what email is all about, although an ever-growing load net with
    its complex routing requirements and its ever-increasing load of messages has
    made a more elaborate scheme necessary.


    Various standards of mail exchange have been devised. Sites on the Internet adhere
    to one laid out in RFC-822, augmented by some RFCs that describe a machine-independent
    way of transferring special characters, and the like. Much thought has also been
    given recently to “multimedia mail,\” which deals with including pictures and
    sound in mail messages. Another standard, X.400, has been defined by CCITT.


    Quite a number of mail transport programs have been implemented for systems. One
    of the best known is the University of Berkeley''s sendmail, which is used on
    number of platforms. The original author was Eric Allman, who is now actively
    working on the sendmail team. There are two ports of sendmail 5.56c available,
    one of which will be described in Chapter 14. The sendmail version currently being
    developed is 8.9.3. For more information, see http://send.mail/org and http://sendmail.com.


    The mail agent most commonly used with Linux is small 3.1.28, written and copyrighted
    by Curt Landon Knoll and Ronald S. Starr. This is the one included in most distributions.
    In the following, we will refer to it simply as small, although there are other
    versions of it which are entirely different, and which we don''t describe here.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# 170 The Linux Network Administrators'' Guide: Chapter 12


    Compared to sendmail, mail is rather young. When handling mail for a small site
    without complicated routing requirements, its capabilities are pretty close. For
    large sites, however, sendmail always wins, because its configuration scheme is
    much more flexible.


    Both sendmail and elm support a set of configuration files that have to be customized.
    Apart from the information that is required to make the mail subsystem run (such
    as the local hostname), there are many more parameters that can be tuned. Sendmail''s
    main configuration file is very hard to understand at first. It looks as if you
    had taken a nap on your keyboard with the Shift key pressed. Small configuration
    files are more structured and easier to understand than sendmail''s, but don''t
    give the user as much power in tuning the mailer''s behavior. However, for small
    UUOCP or Internet sites, the work required in setting any of them is roughly the
    same.


    In this chapter, we will deal with what email is and what issues you are as an
    administrator will have to deal with. Chapters 13 and 14 will give instructions
    on setting up mail and sendmail for the first time. The information provided should
    suffice to get smaller sites operational, but there are many more options, and
    you can spend many happy hours in front of your computer configuring the finest
    features.


    Toward the end of the current chapter we will briefly cover up elm, a very common
    mail agent on many Linux systems.


    For more information about issues specific to electronic mail on Linux, please
    refer to the Linux Electronic Mail HOWTO by Guilhem Aznar (guilhem@email.qc.ca)
    at http://metalab.unc.edu/LDP/HOWTO/Mail-HOWTO.html. The source distributions
    of elm, and and sendmail also contain very extensive documentation that should
    answer most of your questions on setting them up. If you are looking for information
    on email in general, there''s a number of RFCs with this topic. They are listed
    in the bibliography at the end of the book.


    # What Is A Mail Message?


    A mail message generally consists of a body, which is the text sender wrote, and
    special data specifying recipients, transport medium, and so on, very much like
    what you see when you look at a letter''s envelope.


    This administrative data falls into two categories; in the first category is any
    data that is specific to the transport mechanism, like the address of sender and
    recipient. It is therefore called the envelope. It may be transformed by the transport
    software as the message is passed along.


    The second variety is any data necessary for handling the mail message, which
    is not particular to any transport mechanism, such as the message''s subject line,
    a list of all recipients, and the date the message was sent. In many networks,it
    has standard to prepend this data to the mail message, forming the so-called mail
    header. It is offset from the mail'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Electronic Mail 17


    body an empty line. (It is customary to append a signature or .sig to a mail message,
    usually containing information on the author, along with a joke or a motto. It
    is offset from the mail message by a line containing "-").


    Most transport software in the world uses a header format outlined in RFC-822.
    Its original purpose was to specify a standard for use on ARPANET, but since it
    was designed to be independent from any environment, it has been easily adapted
    to other networks, including many UUCP-based networks.


    RFC-822, however, is the greatest common denominator. More recent standards have
    been conceived to cope with such growing needs as, for, data encryption, international
    character support, and multipurpose Internet mail extensions (MIME).


    In all these standards, the header consists of several lines, separated by newline
    characters. A line is made up of a field name, beginning in column one, and the
    field itself, offset by a colon and white space. The format and semantics of each
    field vary depending on the field name. A header field may be continued across
    a new line, if the next line begins with a tab. Fields can appear in any order.


    A typical header may look like this:


    ```

    From brewwhq.swb.delora.comlandyo Wed Apr 13 00:17:03 1994

    Return-Path: <brewwhq.swb.delora.comlandyo>

    Received: from brewwhq.swb.de by monad.swb.de with uucp

    (SMail13.1.28.1 #6) id mdpqqqIT-00023a8: Wed, 13 Apr 04:00:17

    Received: from ora.com (ruby.ora.com) by brewwhq.swb.de with smtp

    (SMail13.1.28.1 #28.6) id <mppqq0r-0008bqHc>; Tue, 12 Apr 94 22

    Received: by ruby.ora.com (8/6.8/8.6) id RAA26438: Tue, 12 Apr 94

    Date: Tue, 12 Apr 1994 15:56:-0400

    Message-Id: <199404121956@ruby

    From: andy@ora.com (Andy Orm)

    To: okimonad.swb

    Subject: Your RPC section

    ```


    Generally, all header fields are generated by the mailer interface you use, like
    elk, pine, mush, or mailx. Some, however, are optional, and may be added by the
    user. elm, for, example, all you edit is part of the message header. Others are
    added by the mail transport. A list of common header fields and their meanings
    are given in Table 12.1.


    # Table 12.1 Common header fields and their meanings.


    | From | This contains the sender''s email address, and possibly the “real name.”
    A complete zoo of formats is used here. |

    | To | This is the recipient''s email address. | |

    | Subject | Describes the content of a mail in a few words. At least that''s what
    it should do. |


    (continued)'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# Table 12.1 Common header fields and their meanings (continued).


    | Date | Description |

    | --- | --- |

    | Date | The mail was sent. |

    | Reply-To | Specifies the address the sender wants the recipient''s reply directed
    to. This may be useful if you have several accounts, but want to receive the bulk
    of mail only on the one you use most frequently. This field is optional. |

    | Organization | The organization that owns the machine from which the mail originates.
    If your machine is owned by you privately, either leave this out, or insert "private"
    or some nonsense. This field is optional. |

    | Message-ID | A string generated by mail transport on the operating system. It
    is unique to this message. |

    | Received | Every site that processes your mail (including the machines of sender
    and recipient) inserts such field into the header, giving its site name, a message
    ID, time and date it received the message, which it is from, and transport software
    was used. This is so that you can trace route the message took, and complain to
    the person responsible if something went wrong. |


    X-anything


    No-mailed programs should complain about any header which starts with X-. It is
    used to implement additional features that have not yet made it into an RFC, or
    never will. This is used by the Linux Administrators activating mailing list,
    for example, where the channel is selected by the X-Min-Key: header field.


    The one exception to this is the very first line. It is followed by a blank space
    of a colon. To distinguish it from the ordinary From: field, it is referred referred
    as From_. It contains the route the message has taken in UUCP bang-path style
    (explained below), time and date when it was received by the last machine having
    processed it, and an optional part specifying which host it received from. Since
    this field is regenerated by every system that processes the message, it is sometimes
    times summed under the envelope data.


    The From_ field is for backward compatibility with some older mailers, but is
    not used much anyone, except by mail user interfaces that rely on it to mark the
    beginning of a message in the user''s mailbox. To avoid potential trouble with
    lines in the message body that begin with "From", too, it has become standard
    procedure to escape any such occurrence by preceding it with ".>


    # How Is Mail Delivered?


    Generally, you will compose mail using a mail interface like mailx; or more sophisticated
    ones like elm, mush, or pine. These programs are called mail user agents, and
    MUAs for short. If you send a mail message, the interface program will in most
    cases hit to another program for delivery. This is called the mail transport agent,
    or MTA. On some systems, there are different mail transport agents for local and
    remote delivery; on others, there is only one. The command for remote delivery
    is usually called rmail, the other is called Imail (if it exists).'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'Local delivery of mail is, of course, more than just appending the incoming
    message to the recipient''s mailbox. Usually, the local MTA will understand aliasing
    (setting up recipient addresses pointing to other addresses) and forwarding (redirecting
    a user''s mail to some other destination). Also, messages that cannot be delivered
    must be bounced, that is, returned to the sender with some error message.


    For remote delivery, the transport software used depends on the nature of the
    link. If the mail must be delivered over a network using TCP/IP, SMTP is commonly
    used. SMTP stands for Simple Mail Transfer Protocol, and is defined in RFC-788
    and RFC-821. SMTP usually connects to the recipient''s machine directly, negotiating
    the message transfer with the remote side''s SMTP daemon.


    In UUCP networks, mail will usually not be delivered directly, but rather by a
    number of intermediate systems. To send a message over a UUOCP link, the sending
    MTA will execute rmail on the forwarding system uux, and feed it on standard input.


    Because this is done for each message separately, it may produce a considerable
    workload on a major mail hub, as well as cluster the UUOCP spool queues with hundreds
    of small files taking up an unpropto amount of disk space. (This is because disk
    space is usually allocated in blocks of 1024 bytes. So even a message of at 400
    bytes will eat a few kilobytes.) Some MTAs therefore allow you to collect all
    messages for a remote system in a single batch file. The batch file contains the
    SMTP commands that the host would normally issue if a direct SMTP connection was
    used. This is called BSMTP, or bat SMTP. The batch is then fed to the rsmtp or
    bsmlp program on the remote system, which will process the input as if a normal
    SMTP connection had occurred.


    # Email Addresses


    For electronic mail, an address is made up of the least name of a machine handling
    the person''s mail, and a user identification recognized by this system. This
    may be the recipient''s login name, but may also be anything. Other mail addressing
    schemes, like X.400, make a more general set of "attributes", which are used to
    look up the recipient''s host in an X.500 directory server.


    The way a machine name is interpreted, i.e., at which site your message will finally
    wind up, and how to combine this with the recipient''s user name greatly depends
    on the network you are on.


    Internet sites adhere to the RFC-822 standard, which requires a notation of user@host.domain,
    where host.domain is the host''s fully qualified domain name. The middle thing
    is called an "at" sign. Because this notation does not involve a route to the
    destination host but gives the (unique) hostname instead, this is called an absolute
    address.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# 174 The Linux Network Administrators'' Guide: Chapter 12


    In the UUCP environment, the prevalent form was path!host!user, where path described
    a sequence of UUCP hosts the message had to travel before reaching the destination
    host. This construct is called the bang path notation, because an exclamation
    is loosely called a "bang". Today, many UUCP-based networks have adopted RFC-822,
    and will understand this type of address.


    Now, these two types of addressing do not too well. Assume an address of hostA!
    user@hostB. It is not clear whether the "@" sign takes precedence over the path,
    or versa: Do we have to send the message to hostB, which mails it to hostA!user,
    or should it be sent to hostA, which forwards it to user@hostB?


    Addresses that mix different types of addresses are called hybrid addresses. Most
    notorious is the above example. It is usually resolved by giving the "@" precedence
    over the path. In this example, this means sending the message to hostB.


    However, there is a way to specify routes in RFC-822-conformat variants: <hostA,@hostB:user@hostC>
    denotes the address of user hostC, where hostC is to be reached through hostA
    and B (in that order). This type of address is frequently called a route-adder
    address.


    Then, there is the "% address operator: user%hostB@hostA will first be sent to
    hostA, which expands the rightmost (in this, case) only percent sign to an "@"
    sign. The address is now user@hostB, and the mailer will happily forward your
    message to hostB, which delivers it to user. This type of address is sometimes
    referred to as "Ye Old ARPANET Kludge," and is discouraged. Nevertheless, many
    mail transport agents generate this type of address.


    Other networks still have different means of addressing. DECNet-based networks,
    for example, use two colons as an address separator, yielding an address of host::user:(When
    trying to reach a DECNet from an RFC-822 environment, you may use "host::user@relay,
    where relay is the name of a known Internet-DECNet relay). Last, the X.400 standard
    uses an entirely different scheme, by describing a set of attribute-value pairs,
    like country and organization.


    On FidoNet, each user is identified by a code like 2:320/204.9, consisting of
    four numbers denoting zone (2 is for Europe), net (320 is Paris and Banlieue),
    node (the local hub), and point (the individual user''s PC). FidoNet addresses
    can be mapped to RFC-822; the above would be written as Thomas.Quinot@p9.f204.n320.z2.fidonet.
    Now didn''t I domain names are easy to remember?


    There are some implications to using these different types of addressing, which
    will be described throughout the following sections. In an RFC-822 environment,
    however, you will rarely use anything else absolute addresses like user@host.domain.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# How Does Mail Routing Work?


    The process of directing a message to the recipient''s host is called routing.
    Apart from finding- a path from the sending site to the destination, it involves
    error checking as well as speed and cost optimization.


    There is a big difference between the way UUCP site handles routing and the way
    an Internet site. On the Internet, the main job of directing data to the recipient
    host (once it is known by its IP address) is done by the IP networking layer,
    while in the UUCP zone, the route has to be supplied by the user or generated
    by the mail transfer agent.


    # Mail Routing On The Internet


    On the Internet, it depends entirely on the destination host whether any specific
    mail routing is performed at all. The default is to deliver the message to the
    destination host directly by looking up its IP address, and leave the actual routing
    of the data to the IP transport layer.


    Most sites will want to direct all in-bound mail to a highly available mail server
    that is capable of handling all this traffic, and have it distribute this mail
    locally. To announce this, the site publishes a so-called MX record for their
    local domain in the DNS database. MX stands for Mail Exchanger and basically states
    that the server is willing to act as a mail forwarder for all machines in this
    domain. MX records may also be used to handle traffic for hosts that are not connected
    to the Internet themselves, like UUCP networks or company networks with hosts
    carrying confidential information.


    MX records also have a preference associated with this. This is a positive integer.
    If several mail changers exist for one host, the mail transport agent will try
    to transfer the message to the exchanger with the lowest preference value, and
    only if this fails will it try a host with a higher value. If the local host is
    itself a exchanger for the destination address, it must not forward messages to
    any MX hosts with a higher preference than its own; this is a safe way of avoiding
    loops.


    Suppose that an organization, say Foobar Inc., want all their mail handled by
    their machine called mailhub. They will then have an MX record like this in the
    DNS database:


    ```

    foobar.com IN MX 5 mailhub.foobar.com

    ```


    This announces mailhub.foobar.com as a mail exchanger for foobar.com with a preference
    value of 5. A host that wants to deliver a message to joe@greenhouse.com.com will
    check DNS for foobar.com, and finds the MX record pointing at mailhub. If there''s
    no MX with a preference smaller than 5, the message will be delivered to mailhub,
    which dispatches it to greenhouse.


    The above is really only a sketch of how MX records work. For more information
    on the mail routing over the Internet, please refer to RFC-974.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# Mail Routing In The UUCP World


    Mail routing on UUCP networks is much more complicated than on the Internet, because
    the transport software does not perform any routing itself. In earlier times,
    all had to be addressed using bang paths. Bang paths specified a list of hosts
    through which to forward the message, separated by exclamation marks, and followed
    by the user''s name. To address a letter to Janet User on a machine named Moria,
    you would have used the path eek!swim!moria!. This would have sent the mail from
    your host to Eek, from there to Swim and finally to Moria.


    The obvious drawback of this technique is that it requires you to remember much
    about the network topology, fast links, and so on. Much worse than that, changes
    in the network topology—like links being deleted or hosts being removed—cause
    messages to fail simply because you weren''t aware of the change. And finally,
    in case you move to a different place, you would most likely have to update all
    these routes.


    One thing, however, that the use of source routing necessitated the presence of
    ambiguous hostnames. For instance, assume there are two sites named Moria, one
    in the United States, and one in France. Which site does daniel refer to? This
    can be made clear by specifying what path to reach Moria through.


    The first step in disambiguating the hostnames was the founding of the UUCP Mapping
    Project. It is located at Rutgers University and registers all official UUCP hostnames,
    along with information on their UUCP neighbors and their geographic location,
    making sure no hostname is used twice. The information gathered by the Mapping
    Project is published as the Usenet Maps, which (Maps for sites registered with
    the UUCP Mapping Project are distributed regularly through Usenet. comp.mail.maps;
    other organizations may publish separate maps for their network.) A typical system
    entry in a map (after removing the comments) looks like this.


    ```

    moria

    (bert/2),

    swim(WEEKLY)

    ```


    This entry says that Moria has a link to Bert, which it calls twice a day, and
    Swim, which it calls weekly. We will come back to the Map file format in more
    detail below.


    Using the connectivity provided in the maps, you can automatically generate the
    full paths from your host to any destination site. This information is usually
    stored in the paths file, also called pathalias database sometimes. Assume the
    maps state that you can reach Bert through Ernie, then a pathalias entry for Moria
    generated from the map snippet may look like this:


    ```

    moria

    nernie!bert!moria!%

    ```'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'If you now give a destination address of janet@moria.uucp, the MTA will pick
    the route shown above, and send the message to Ernie with an envelope address
    of bert!morial.janet.


    Building a paths file from the full Usenet maps, however, not a very good idea.
    The information provided in them is usually rather distorted and occasionally
    out of date. Therefore, only a number of major hosts use the complete UUCP world
    maps to build their paths file. Most sites only maintain routing information for
    sites in their neighborhood, and send any mail to sites they don''t find in their
    databases to a smarter host with more complete routing information. This scheme
    is called smart-routing. Hosts that have only one UUCP mail link (so-called leaf
    sites) do not do any routing of their own; they rely entirely on their smart host.


    # Mixing UUCP And RFC-822


    The best cure against the problems of mail routing in UUCP networks is the adoption
    of the domain name system in UUCP networks. Of course, you can''t query a server
    over UUCP. Nevertheless, many UUCP sites have formed small domains that coordinate
    their routing internally. In the maps, these domains announce one or two as their
    mail gateways, so there doesn''t have to be a map entry for each host in the domain.
    The gateways handle all mail flows into and out of the domain. The routing scheme
    inside the domain is completely invisible to the outside world.


    This works well with the smart-routing scheme described above. Global routing
    information is maintained by the gateways only; minor hosts within a domain will
    get along with only a small handwritten paths file that lists the routes inside
    their domain, and the route to the mail hub. Even the gateways do not have routing
    information for every single UUCP host in the world anymore. Beside the complete
    routing information for the domain they serve, they need only have routes to entire
    domains in their databases now. For instance, the pathalias entry shown below
    will route all mail for sites in the sub.org domain to Smurf:


    ```

    .sub.org swimismsurf!%$

    ```


    Any mail addressed to claire@jones.sub will be sent to swim with an envelope address
    of smurf!claire.


    The hierarchical organization of the domain name space allows mail servers to
    mix more specific routes with less specific ones. For instance, a system in France
    may have specific routes for subdomains of "fr", but any mail for hosts in the
    "us" domain towards some system in the United States. In this way, domain-based
    routing (as this technique is called) greatly reduces the cost of routing databases
    as well as the administrative overhead needed.


    The main benefit of using domain names in a UUCP network, however, is that compliance
    with RFC-822 permits easy gateway between UUCP networks and the Internet.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# The Linux Network Administrators'' Guide: Chapter 12


    Many UUCP domains nowadays have a link with an Internet gateway that acts as their
    smart host. Sending messages across the Internet is faster, and routing information
    is much more reliable because Internet hosts can use DNS instead of the Usenet
    maps.


    In order to be reachable from the Internet, UUCP-based domains usually have their
    Internet gateway announce an MX record for them (MX records were described above).
    For instance, assume that Moria belongs to the orcnet.org domain. Gcc2.grouch.org
    acts as its Internet gateway. Moria would therefore use gcc2 as its smart host,
    so that all mail for foreign domains Moria is delivered across the Internet. On
    the other hand, gcc2 would announce an MX record for orcnet.org, and deliver all
    incoming mail for orcnet sites to Moria.


    The only remaining problem is that the UUCP transport programs cannot deal with
    fully qualified domain names. Most UUCP suites were designed to cope with site
    names of up to eight characters, some even less, and using non-alphanumeric characters
    such as dots is completely out of the question for most.


    Therefore, so mapping between RFC-822 names and UUCP hostnames is needed. This
    way mapping is done completely implementation-dependent. One common way of mapping
    FQNs to UUCP names is to use the pathos file for this:


    ```

    moria.orcnet.org ernie!bert!

    ```


    This will produce a UUCP-style path from an address that specifies a fully qualified
    domain name. Some mailers provide a special file for this; sendmail, for instance,
    uses the uucptable for this.


    The reverse transformation (colloquially called domainizing) is sometimes required
    when sending mail from a UUCP network to the Internet. As long as the mail sender
    uses the fully qualified domain name in the destination address, this problem
    can be avoided by removing the domain name from the envelope address when forwarding
    the message to the smart-host. However, there are still UUCP sites that are not
    part of any domain. They are usually domainized by appending the pseudo-domain
    uucp.


    # Pathalias And Map File Format


    The pathalias database provides the main routing information in UUCP-based networks.
    A typical entry looks like this (site name and path are separated by tabs):


    ```

    moria.orcnet.org ernie!bert!%

    moria ernie!bert!%

    ```


    This makes any message to Moria be delivered via Ernie and Bert. Both Moria''s
    fully qualified name and its UUCP name have to be given if the mailer does not
    have a separate way to map between these name spaces.'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'If you want to direct all messages to hosts inside some domain to its mail
    relay, you may also specify a path in the pathalias database, giving the domain
    name as target, preceded by a dot. For example, if all hosts in the sub.org may
    be reached via swim!smurf, the pathalias entry might look like this:


    ```

    \sub.org          swim!smurf!%$

    ```


    Writing pathalias file is acceptable only when you are running a site that does
    not have to do much routing. If you have to do routing for a large number of hosts,
    a better way is to use the pathalias command to create the file from map files.
    Maps can be maintained much easier, because you may simply add or remove a system
    by editing the system''s map entry, and re-create the map file. Although the maps
    published by the Usenet Mapping Project aren''t used for routing very much anymore,
    smaller UUCP networks may provide routing information in their own set of maps.


    A map file mainly consists of a list of sites, listing each site it polls or is
    polled by. The system name begins in column one, and is followed by a comma-separated
    list of links. The list may continue across new lines if the links begin with
    a tab. Each link contains the name of the site, followed by a cost in brackets.
    The cost is an arithmetic expression, made up of numbers and symbolic costs. Lines
    beginning with a hash sign are ignored.


    As an example, consider Moria, which polls swim.twobirds twice a day, and bert.sesame.com
    once per week. Moreover, the link to bert uses only a slow 2,400bps modem. Moria''s
    would publish the following maps entry:


    ```

    moria.orcnet.org

    bert.sesame.com(DAILY/2)

    swim.twobirds.com(WEEKLY+LOW)

    ```


    ```

    moria.orcnet.org = moria

    ```


    The last line would make it known under its UUCP name, too. Note that it must
    be DAILY/2, because calling twice a day actually halves the cost for this link.


    Using the information from such map files, pathalias is to calculate optimal routes
    to any destination site listed in the paths file, and produce a pathalias database
    from this which can be used for routing to these sites.


    pathalias provides a couple of other features like site-hiding (i.e., making sites
    accessible only through a gateway), and so on. See the manual page for pathalias
    for details, as well as a complete list of link costs.


    Comments in the map file generally contain additional information on the sites
    described in it. There is a rigid format to specify this, so that it can be retrieved
    from the maps. For instance, a program uuwho uses a database created from the
    map files to display this information in a nicely formatted way.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# 180 The Linux Network Administrators'' Guide: Chapter 12


    When you register your site with an organization that distributes map files to
    its members, you generally have to fill out such a map entry.


    Below is a sample map entry (in fact, it''s the one for my site):


    ```

    #N monad. monad.swb.de, monad.swb.sub.org

    #S AT 486DX50; Linux 0.99

    #O private

    #C Olaf Kirch

    #E okir@monad.swb.de

    #P Kattreinst. 38, D-64295 Darmstadt, FRG

    #L 49 52 03 N / 08 38 40 E

    #U brewhq

    #W okir@monad.swb.de (Olaf Kirch); Sun Jul 25 16:59:32 MET DST

    #nmonad brewhq(DAILY/2)

    monad = monad.swb.de

    monad = monad.swb.sub.org

    ```


    The white space after the first two characters is a tab. The meaning of most of
    the fields is pretty obvious; you will receive a detailed description from whichever
    domain you register. The L field is the most to find out: It gives your geographical
    position/longitude and is used to draw PostScript maps that show all sites for
    each country, as well as worldwide. (They are posted regularly in news.lists.ps-maps.
    Beware. You''re huge.)


    # Configuring elm


    elm stands for "electronic mail" and is one of the reasonably named tools. It
    provides a full-screen interface with a good help feature. We won''t discuss here
    how to use elm, only dwell on its configuration options.


    Theoretically, you can run elm unconfigured, and everything works well—if you
    are lucky. But there are a few options that must be set, although only required
    on occasion.


    When it starts, elm reads a set of configuration variables from the elm.rc file
    in /usr/lib/elm. Then, it will attempt to read the file .elm/elmrc in your home
    directory. You don''t usually to write this file yourself. It is created when
    you choose Save Options from elm''s menu.


    The set of options for the private elmrc file is also available in the global
    elm.rc file. Most settings in your private elmrc override those of the global
    file.


    # Global elm Options


    In the global elm.rc, you must set the options that pertain to your host''s name.
    For example, by the Virtual Brewery, the file for vlager would contain the following:'
  merge: -1
  img_proc: true
- pgno: 204
  md: '```

    #

    # The local hostname

    hostname = vlager

    # Domain name

    hostdomain = .vbre.com

    #

    # Fully qualified domain name

    hostfullname = vlager.vbre.com

    ```


    These options elm''s idea of the local hostname. Although this information is
    rarely used, you, should set these options nevertheless. Note that these options
    only take effect when giving them in the global configuration file; when found
    in your private elmarc, they will be ignored.


    # National Character Sets


    Recently, there have been proposals to amend the RFC-822 standard to support various
    types of messages, such as plain text, binary data, PostScript files, and so on.
    The set of standards and RFCs covering these aspects are commonly referred to
    as MIME, or Multipur Internet Mail Extensions. Among other things, this also lets
    the recipient know if a character set other than standard ASCII was used writing
    the message, for example, using French accents or German umlauts. This is supported
    by elm to some extent.


    The character set used by Linux internally to represent characters is usually
    referred to as ISO 8859-1, which is the name of the standard it conforms to. It
    is also known as Latin 1. Any message using characters from this character set
    should have the following line in its header:


    Content-Type: text/plain; charset=iso-8859-1


    The receiving system should recognize this field and take appropriate measures
    when playing the message. The default for text/plain messages is a charset value
    of us-ascii.


    To be display messages with character set other than ASCII, elm must know how
    to print these characters. By default, when elm receives a message with a charset
    field other than us-ascii (or a content type other than text/plain, for that),
    it tries to display the message using a command called metamail. Messages that
    require metamail to be displayed are shown with an “M” in the very first column
    in the overview screen.


    Since Linux''s native character set is ISO-8859-1, calling metamail is not necessary
    to display messages using this character set. If elm is told the display understands
    ISO 8859-1, it will not use metamail but will display the message directly instead.
    This can be done by setting the following option in the global elm.rc:


    displaycharset = iso-8859-1'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# The Linux Network Administrators'' Guide: Chapter 12


    Note that you should set these options even when you are never going to send or
    receive any messages that actually contain characters other than ASCII. This is
    because people who do send such messages usually configure their mailer to put
    the proper Content-Type: field into the mail header by default, whether or not
    they are sending ASCII-only messages.


    However, setting this option in elm.rc is not enough. The problem is that when
    displaying the message with its built-in pager, elm calls a library function for
    each character to determine whether it is printable or not. By default, this function
    will only recognize ASCII characters as printable, and display all other characters
    as ”?. You may overcome this by setting the environment variable LC_CTYPE to ISO
    8859-1, which tells the library to accept Latin-1 characters as printable. Support
    for this and other features is available since libc-4.5.8.


    When sending messages that contain special characters from ISO 8859-1, you should
    make sure to set two more variables in the elm.rc file:


    ```

    charset = iso-8859-1

    textencoding = 8bit

    ```


    This makes elm report the character set set as ISO 8859-1 in the mail header,
    and send it as an eight-bit value (the default is to strip all characters instead
    of seven bit).


    Of course, any of these options can also be set in the private elmrc file instead
    of the global one.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# Chapter 13


    # Getting smail Up And Running


    This chapter will give you a quick introduction to setting up smail and an overview
    of the functionality it provides. Although smail is largely compatible with sendmail
    in its behavior, their configuration files are completely different.


    The main configuration file is the /usr/lib/smail/config. You all have to edit
    this file to reflect values specific to your site. If you are only a UUCP leaf
    site, you will have relatively little else to do, ever. Other files that configure
    routing and transport options may also be used; they will be dealt with briefly,
    too.


    By default, smail processes and delivers all incoming mail immediately. If you
    have relatively high traffic, you may instead have smail collect all messages
    in the so-called queue and process it at regular intervals.


    When handling mail within a TCP/IP network, smail is frequently run in daemon
    mode: At system boot time, it is invoked from rc.net2, and puts itself in the
    background where it waits for incoming TCP connections on the SMTP port (usually
    port-25). This is very beneficial whenever you expect to have a significant amount
    of traffic, because smail isn''t started up separately for every incoming connection.
    The alternative would be to have inetd manage the SMTP port and have spawned smail
    whenever there is a connection on this port.


    smail has a lot a flags that control its behavior; describing them in detail here
    wouldn''t help you much. Fortunately, smail supports a number of standard modes
    of operation that are enabled when you invoke it by a special command name, like
    mrail, or smtdp.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# 184 The Linux Network Administrators'' Guide: Chapter 13


    Usually, these aliases are symbolic links to the mail binary itself. We will encounter
    most of them when discussing the various features of smail.


    There are two links to smail you should have under all circumstances: namely,
    /usr/bin/mail and /usr/bin/sendmail. (This is the new standard location of sendmail
    according to the File System Standard. Another common location is /usr/lib.) When
    you compose and send a message with a user agent like elmail, the message will
    be piped into rmail for delivery, with the recipient list given to it on the command
    line. The same happens with coming in via UUCP. Some versions of elm, however,
    invoke /usr/sbin/sendmail instead of rmail, so you need both of them. For example,
    if you keep smail in /usr/local/bin, type the following at the shell prompt:


    ```

    # In -s /usr/local/bin/smail /usr/bin/rmail

    # In -s /usr/local/bin/smail /usr/sbin/sendmail

    ```


    If you want to dig further into the details of configuring smail, please refer
    to the manual pages smail(1) and smail(5). If it isn''t included in your favorite
    distribution, you can get it from the source to smail.


    # ## UUCP Setup


    To use smail in a UUCP-only environment, the basic installation is rather simple.
    First, you must make sure you have the two symbolic links to rmail and sendmail
    mentioned above. If you expect to receive SMTP batches from other sites, you also
    have to make rsmtp a link to smail.


    In Vince Skahan''s mail distribution, you will find a sample configuration file.
    It is named config.sample and resides in /usr/lib/smail. You have to copy it to
    config and edit it to reflect values specific to your site.


    Assume your site is named swim.twobirds.com, and is registered in the UUCP maps
    as swim. Ulysses. Then your config file should look like this:


    ```

    # Our domain names

    visible domain=two.birds:uucp

    #

    # Our name on outgoing mails

    visible name=swim.twobirds.com

    #

    # Use this as uucp-name as well

    uucp name=swim.twobirds.com

    #

    # Our smarthost

    smart host-ullysses

    ```'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'Getting smail Up And Running


    The first statement tells smail about the domains your site belongs to. Insert
    your names here, separated by colons. If your site mail name is registered in
    the UUCP maps, you should also add `uucp`. When being handed a mail message, smail
    determines your host''s name using the hostname(2) system call, and checks the
    recipient''s address against this hostname, taking on all names from this list
    in turn. If the address matches any of these or the unqualified hostname, the
    recipient is considered local, and smail attempts to deliver the message to a
    user or alias on the local host. Otherwise, the recipient is considered remote,
    and delivery to the destination host is attempted.


    visible_mail should contain a fully qualified domain name of your site that you
    want to use on outgoing mail. This name is used when generating the sender''s
    address on all outgoing mail. You must make sure to use a name that smail recognizes
    referring to the local host (i.e., the hostname with one of the domains listed
    in the visible_domain attribute). Otherwise, replies to your mail will bounce
    off your


    The last statement sets the path used for smart-host routing. With this simple
    setup, smail will forward any mail for remote addresses to the smart host. The
    path specified in the smart_path attribute will be used as a route to the smart
    host. Since messages will be delivered via UUCP, the attribute must specify a
    system known to your UUCP software. Please refer to Chapter 11 on making a site
    known to UUCP.


    There''s one option used in the above file that we haven''t explained yet; this
    is uucp_name. The reason to use the option is: By default, smail uses the value
    returned by hostname(2) for UUCP-specific things, such as the return path given
    in the From_ header line. If your hostname is not registered in the UUCP mapping
    project, you should tell smail of your fully qualified domain name instead (The
    reason is: Assume your hostname is Monad, but is not registered in the maps. However,
    there is a site in the maps called Monad, so every mail from a direct UUCP neighbor
    of yours, will wind up on the other Monad. This is a nuisance for everybody.)
    This can be done by adding the uucp_name option to the config file.


    There is another file in /usr/lib/smail, called paths.sample. It is an example
    of what paths might look like. You will not need one unless you have mail links
    to more than one site. If you do, however, you will have to write one yourself,
    or generate one from the Usenet news. The paths file will be described later in
    this chapter.


    # Setup For A LAN


    If you are running a site with two or more hosts connected by a LAN, you will
    have to designate one host that handles your UUCP connection with the outside
    world. Between the hosts on your LAN, you will probably want to exchange mail
    with SMTP over TCP/IP. Assume we''re back at the Virtual Brewery again, and vstout
    is set up as the UUCP gateway.


    In a networked environment, it is best to keep all user mailboxes on a single
    file system, which is NFS-mounted on all other hosts. This allows users to move
    from machine to machine,'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# 186 The Linux Network Administrators'' Guide: Chapter 13


    without having to move their mail (or even worse, check three or four machines
    for newly arrived mail each morning). Therefore, you also want to make sender
    addresses independent of the machine the mail was written on. It is common practice
    to use the domain name by all himself in the sender address, instead of a hostname.
    Janet User, for example, would specify janet@vbrew.com instead of janet@vale.vbrew.com.
    We will explain below how to make the sender recognize the domain name as a valid
    name for your site.


    A different way of keeping all mailboxes on a central host is to use POP or IMAP.
    POP for Post Office Protocol and lets users access their mailboxes over a simple
    TCP/IP connection. IMAP, the Interactive Mail Access Protocol, is similar to POP,
    but more. Both clients and servers for IMAP and POP have been ported to Linux,
    and are available from sunsite.unc.edu below /pub/Linux/system/Network.


    # Writing Configuration Files


    The configuration for the Brewery works as follows: all hosts except the mail
    vstout route all outgoing mail to the server, using smart-host routing. vstout
    itself sends all outgoing mail to the real smart host that routes all of the Brewery''s
    mail; this host is called Moria.


    The standard config file for all hosts other than vstout looks like this:


    ```

    #

    # Our domain:

    visible domain=vbrew.com

    #

    # What we name ourselves

    visible name=vbrew.com

    #

    # Smart-host routing: via SMTP to vstout

    smart path=vstout

    smart transport=smtp

    ```


    This is very similar to what we used for a UUCP-only site. The main difference
    is that the transport used to send to the smart host is, of course, SMTP. The
    visible_domain attribute makes mail use the domain name instead of the local hostname
    on all outgoing mail.


    On the UUCP mail gateway vstout, the config file looks a little different:


    ```

    # Our hostnames:

    hostnames=vbrew.com:vstout.vbrew.com:vstout

    #

    # What we name ourselves

    visible name=vbrew.com

    #

    # in the uucp world, we''re known as vbrew.com

    ```'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# Getting mail Up And Running 17


    ```

    uucp name=vbrew.com

    #

    # Smart transport: via uucp to moria

    smart path=moria

    smart transport=uux

    #

    # we''re authoritative for our domain

    auth domains=vbrew.com

    ```


    This config file uses a different scheme to tell what the local host is. Instead
    of giving it a list of domains and finding it the hostname with a system call,
    it specifies it explicitly. The above list contains both the fully qualified and
    the unqualified hostname and the domain name all by itself. This makes smail recognizeet@vbrew.com
    as a local address and deliver the message to Janet.


    The auth_domains variable names the domains for which vstout is considered to
    be authoritative. That is, if smail receives any mail addressed to host.vbrew.com
    where host does not exist an local machine, it rejects the message and returns
    it to the sender. If this entry isn''t present, any such message will be sent
    to the smart host, who will return it to vstout, and so on until it is discarded
    for exceeding the maximum hop count.


    # Running smail


    First, you have to decide whether to run smail as a separate daemon, or to have
    inet manage the SMTP port and invoke smail whenever whenever an SMTP connection
    is requested from some client. Usually, you will prefer daemon operation on the
    mail server, because this makes the machine far less than spawning mail over and
    over again for each single connection. As the mail server also delivers most incoming
    mail directly to the users, you will need inet operation on all other hosts.


    Whatever mode of operation you choose for each individual host, you have to make
    sure you have the following entry in your /etc/services file:


    ```

    smtp             25/tcp             # Simple Mail Transfer Protocol

    ```


    -This defines the TCP port number that smail should use for SMTP conversations.
    Twenty-five is the standard defined by the Assigned Numbers RFC.


    When run in daemon mode, smail will put itself in the background and wait for
    a connection to occur on the SMTP port. When a connection occurs, it forks and
    conducts a SMTP conversation with the peer process. The smail daemon is usually
    started by invoking it from the rc.inet2 script using the following command:


    ```

    /usr/local/bin/smail -bd q15m

    ```'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'The Linux Network Administrators’ Guide: Chapter 13


    The -bd flag turns on daemon mode, and -q15m makes it process whatever messages
    accumulated in the message queue every 15 minutes.


    If you want to use inetd instead, /etc/inetd.conf file should contain a line like
    this:


    ```

    smtp stream tcp nowait root /usr/sbin/smtpd smtpd

    ```


    smprpd should be a symbolic link to the small binary. Remember you have to make
    inetd read inetd.conf by sending it a HUP signal after making these changes.


    Daemon and inetd are mutually exclusive. If you run smail in daemon mode, you
    should make sure to comment out any line in inetd.conf for the smtp service. Equivalently,
    when having inetd manage smail, make sure that rc.inet2 does not start the smail
    daemon.


    # If You Don’t Get Through...


    If something goes wrong with your installation, there are a number of features
    that may help find what’s at the root of the problem. The first place to check
    is smail’s log files. They are kept in /var/spool/smail/log, and are named logfile
    and paniclog, respectively. The former lists all transactions, while the latter
    is only for error messages related to configuration errors and the le.


    A typical entry in logfile looks like this:


    ```

    04/24/94 07:12:04: [M0puwU8-00023UB] received

    | from: root

    | program: sendmail

    | size: 1468 bytes

    04/24/94 07:12:04: [M0puwU8-00023UB] delivered

    | via: vstout.vbream.com

    | to: root@vstout.vbream.com

    | orig-to: root@vstout.vbream.com

    | router: smart host

    | transport: smtp

    ```


    This shows that a message from root to root@vstout.vbream.com has been properly
    delivered to host vstout over SMTP.


    Messages smail could not deliver generate a similar entry in the log file, but
    with an error message instead of the delivered part:


    ```

    04/24/94 07:12:04: [M0puwU8-00023UB] received

    | from: root

    | program: sendmail

    | size: 1468 bytes

    ```'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# Getting smail Up And Running 19


    04/24/94 07:12:04: [m0puwU8-00023UB] root@vstout.vbrew.com ... defer

    (ERR 148) transport smtp: Connection refused


    The above error is typical for a situation in which smail properly recognizes
    that the message should be delivered to vstout, but was not able to connect to
    the SMTP service over vstout. If this happens, you either have a configuration
    problem, or TCP SMTP is missing from your binaries.


    This problem is not as uncommon as one might think. There have been precompiled
    smail binaries around, even in some distributions, without support for TCP/IP
    networking. If it is the case for you, you have to compile smail yourself. Having
    installed smail, you can check if it has TCP networking support by telnetting
    to the SMTP port on your machine. A successful connection to the SMTP server is
    shown below (your input is marked this):


    ```

    telnet localhost smtp

    Trying 127.0.0.1...

    Connected to localhost.

    Escape character is ''^]''

    220 monad.swb.Smail1.3.28.1 #6 ready at Sun, Jan 24

    19:26 MET

    QUIT

    221 monad.swb.de closing connection

    ```


    If this test doesn''t produce the SMTP banner (the line starting with the 220),
    first make sure that your configuration is really correct before you go through
    compiling smail yourself, which is described below.


    If you encounter a problem with smail that you are unable to locate from the error
    message generates, you may want to turn on debugging messages. You can do this
    using the -d flag, optionally followed by a number specifying the level of verbosity
    (you may not have any space between the flag and the numerical argument). Smail
    will print a report of its operation to the screen, which may give you more hints
    about what is going wrong.


    If nothing else helps, you may want to invoke smail in Rogue mode by giving the
    -bR option on the command line. The manual says on this option: "Enter the hostile
    of giant mail messages, and RFC standard scrolls. Attempt to make it down to protocol
    level 26 and back." Although this option won''t solve your problems, it may provide
    you some comfort and consolation.


    # Compiling smail


    If you know for sure that smail is lacking TCP network support, you have to get
    the source. It is probably included in your distribution, if you got it via CD-ROM,
    otherwise you may get it from the net via FTP at http://ftp.planix.com/pub/Smail/'
