- pgno: 246
  md: 'C-News article batching is performed by /usr/lib/news/bin/batch/sendbatches,
    which takes a list of articles from the site/togo file and puts them into several
    new batches. It should be executed once per hour or even more frequently, depending
    on the volume of traffic.


    Its operation is controlled by the batchparams file in /usr/lib/news. This file
    describes the maximum batch size allowed for each site, the batching and optional
    compression program to be used, and the transport for delivering it to the remote
    site. You may specify batching parameters on a per-site basis, as well as a set
    of default parameters for sites not explicitly mentioned.


    To perform batching for a specific site, you invoke it


    ```

    # news -c "usr/lib/news/bin/batch/sendbatches site"

    ```


    When invoked without arguments, sendbatches handles all batch queues. The interpretation
    of "all" depends on the presence of a default entry in batchparams. If one is
    found, all directories in /var/spool/out.going are checked, otherwise, it cycles
    through all entries in batchparams. Note that sendbatches, when scanning the out.going
    directory, takes only those directories that contain no dot or sign (@) as site
    names.


    When installing C-News, you will likely find a batchparams file in your distribution
    which contains a reasonable default entry, so there''s a good chance that you
    wouldn''t have to touch the file. Just in case, we describe its format nevertheless.
    Each line consists of six fields, separated by spaces or tabs:


    size max muncher transport


    The meaning of these fields is as follows:


    +   * site—is the name of the site entry it applies to. The file for this site
    must reside in out.going/togo below the news spool. A site name of /default/ denotes
    the default entry.


    +   * size—is the maximum size of article batches created (before compression).
    For single articles larger than that, C-News makes an exception and puts them
    in a single batch by themselves.


    +   * max—is the maximum number of batches created and scheduled for transfer
    before batching stalls for this particular site. This is useful in the remote
    site should be down for a long time, because it prevents C-News from cluttering
    your UUCP spool directories with trillions of newsbatches.


    C-News determines the number of queued batches using the queelen script in /usr/lib/news/bin.
    Vince Skahan''s newspak release should contain a script for BNU-compatible UUCPs.
    If you use a different flavor of spool directories, for example, Taylor UUCP,
    you might have to write your own. If you don''t care about the number of spool
    files (because you''re the only person using your computer, and you don''t write
    articles by the megabyte), you may replace the script''s contents by a simple
    exit 0 statement.'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'The batcher field contains the command used for producing a batch from the
    list of articles in the to file. For regular feeds, this is usually batcher. For
    other purposes, alternative batchers may be provided. For instance, the ihave/sendme
    protocol requires the article to be turned into have or send control messages,
    which are posted to the newsgroup site. This is performed by batchih and batchsm.


    The muncher specifies the command used for compression. Usually, this is compcun,
    a script that produces a compressed batch (As shipped with C-News, compcun uses
    compress with the 12-bit option, since this is the least common denominator for
    most sites. You may produce a copy of it, say comp, where you use 16-bit compression.
    The improvement is not too impressive, though.) Alternatively, you might provide
    a muncher that gzip, say gipcun (to clear: you have to write it). You have to
    make sure that you uncompress the remote site is patched to recognize files compressed
    with gzip.


    If the remote site does not have an uncompress command, you may specify nomch,
    which does not do any compression.


    The last field, describes the transport to use. A number of commands for different
    transports are available whose names begin with via. sendbatches parses the destination
    site name on the command line. If the batchparms entry was not /, it derives the
    site name from the site field by stripping of anything after and including the
    first dot or slash. If entry was /, the directory names in out.going used.


    There are two commands that use uux execute on the remote system: viaaux and viauxz.
    The latter sets the -z flag for (older versions of) u to keep it from returning
    success messages for each article delivered. Another command, viamail, sends article
    batches to the user news on the remote system via mail. Of course, this requires
    that the remote system feeds all mail for news to their local news system. For
    a complete list of these transports, refer to the newsbatch(8) manual page.


    All commands from the last three fields must be located in either of out.going/site
    or /usr/lib/news/bin/batch. Most of them are scripts, so that you may easily tailor
    new tools for your personal needs. They are invoked as a pipe. The list of articles
    is fed to the batcher on standard input, which produces the batch on standard
    output. and so on.


    A sample file is given below.


    ```

    # batchparms file for the brewery

    # site | size | max batcher muncher | transport

