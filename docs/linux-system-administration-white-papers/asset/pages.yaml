- pgno: 63
  md: '# The Linux Network Administrators'' Guide: Chapter 3


    them the D-Link pocket adapter allows you to access Ethernet through a parallel
    port. This driver was written by Bjørn Ekwal (bjorn@blox.se). The DEPCA driver
    was written by David C. Davies (davies@wanton.lkg.com).


    # Ethernet Cabling


    If you''re installing an Ethernet for the first time in your life, a few words
    about the cabling may be in order here. Ethernet is very picky about proper cabling.
    The cable must be terminated on both ends with a 50-Ohm resistor, and you must
    not have any branches (i.e., three cables connected in a star shape). If you are
    using a thin coaxial cable with T-shaped BNC junctions, these junctions must be
    twisted on the board''s connector directly; you should not insert a segment.


    If you connect to a thick installation, you have to attach your host through a
    transceiver (sometimes called Ethernet Attachment Unit). You can plug the transceiver
    into the 15-pin UI port on your board directly, but may also use a shielded cable.


    # Supported Boards


    Here''s a list of the more widely known boards supported by Linux. The actual
    list in the HOWTO is about three times longer. However, even if you find your
    board in this list, check the HOWTO first; there are sometimes important details
    about operating these cards. A case in point is some of DMA-based Ethernet boards
    that use the same DMA channel as the Adapas 1542 SCSI controller by default. Unless
    you move either of them to a different DMA channel, you will wind up with the
    Ethernet board writing packet to arbitrary locations on your hard disk.


    +   * 3Com EtherLink Both 3c503 and 3c516 are supported, as are 3c507 and 3c509.
    The 3c501 is supported, too, but is too slow to worth buying.

    * Novel Eagle NE1000 and NE2000, and a variety of clones. NE1500 and NE2100 are
    supported, too.

    * Western Digital/SMC WD8003 and WD8013 (same as SMC Elite and SMC Elite Plus)
    are supported, and the newer SMC Elite 16 Ultra.

    * Packard HP 27252, HP 2724B, and HP J2405A. D-Link DE-60 pocket adapter, DE-200,
    and DE-220-T. There''s also a patch kit for the DE-650-T, which is a PCMIA card.(4)

    * DEC DE00 (32K/64K), DE202, DE100, and DEPCA rev E.

    * Allied Telesis AT1500 and AT1700.


    To use one of these cards with Linux, you may use a precompiled kernel from one
    of the major distributions. These generally have drivers for all of them built
    in. In the long term, however, it''s better to roll your own kernel and compile
    in those drivers you actually need.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Ethernet Autoprobing


    At boot time, the Ethernet code will try to locate your board and determine its
    type. There are two limitations to the autoprobing code. For one, it may not recognize
    all boards properly. This is especially true for some of the cheaper clones of
    boards, but also for some WD80x3 boards. The second problem is the kernel will
    not autoprobe for more than one board at the moment. This is a feature, because
    it is assumed you want to control about which board is assigned which interface.


    If you are using more than one board, or if the autoprobe should fail to detect
    your board, you have to tell the kernel explicitly about the card''s base address
    and name.


    In Net-3, you can use two different schemes to accomplish this. One way is to
    change or add information in the drivers/net/Space.c file in the kernel source
    code that contains all information about drivers. This is recommended only if
    you are familiar with the network code. A better way is to provide the kernel
    with this information at boot time. If you use lilo to boot your system, you can
    pass parameters to the kernel by specifying them through the append option in
    lilo.conf. To inform the kernel about an Ethernet device, you can pass the following
    parameters:


    ```

    ether=irq,base addr,param1,param2,name

    ```


    The first four parameters are numerical, while the last is the device name. All
    numerical values are optional; if they are omitted or set to zero, the kernel
    will try to detect the device by probing for it, or use a default value.


    The first parameter sets the IRQ assigned to the device. By default, the kernel
    will try to autodetect the device''s IRQ channel. The c503 driver has a special
    feature that selects a free IRQ from the 5, 9, 3, 4, and configures the board
    to use this line.


    The base parameter gives the I/O base address of the board; a value of zero tells
    the kernel to probe the addresses listed above.


    The remaining two parameters may be used differently by different drivers. For
    sharedmemory boards such as the WD80x3, they specify start and end addresses of
    the shared memory area. Other commonly use param1 to set the level of debugging
    information that is being displayed. Values of 1 through 7 denote increasing levels
    of verbosity, while 8 turns them off altogether; 0 denotes the default. The c503
    driver uses param2 to select the internal transceiver (default) or an external
    transceiver (a value of 1). The former uses the board''s BNC connector; the latter
    uses the AUI port.


    If you have two Ethernet boards, you can autodetect one board, and pass the second
    board''s parameters with lilo. However, you must make sure the driver doesn''t
    accidentally find the second board first, else the other one won''t be registered
    at all. You do this by passing lilo to reserve an option, which explicitly tells
    the kernel to avoid probing the I/O space taken up by the second board.'
  merge: -1
  img_proc: true
- pgno: 65
  md: "For instance, to make install a second Ethernet board at 0x300 as eth1, you\
    \ would pass thenfollowing parameters to the kernel:\n\n```\nreserve=0x300,32\
    \ eth=0,0x300,eth1\n```\n\nThe reserve option makes no driver accesses the board's\
    \ I/O space when probing for\ns device. You may also use the kernel parameters\
    \ to override autoprobing for eth0:\n\n```\nreserve=0x340,32 ether=0,0x340,eth0\n\
    ```\n\nTo turn off autoprobing altogether, you can specify a base_addr argument\
    \ of -1:\n\n```\neth0=0,-1,eth0\n```\n\n# The PLIP Driver\n\nPLIP stands for Parallel\
    \ Line IP and is a cheap way to network when you want to con-\nect only two machines.\
    \ It uses a parallel port and a special cable, achieving speeds of\n10Kbps to\
    \ 20Kbps.\n\nPLIP was originally developed by Cryryn, Inc. Its design is rather\
    \ ingenious (or, if\nprefer, hackish): For a long time, the parallel ports on\
    \ PCs used to be unidirectional\n ports; for the data lines could only be used\
