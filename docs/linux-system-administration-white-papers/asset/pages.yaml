- pgno: 342
  md: '# Chapter 5


    # Boots And Shutdowns


    Start me up


    Ah... start it up, never, you''ve got to... you''ve got to


    Never, never, never stop


    Start it up


    Ah... start it up, never, never, never


    You make a grown man cry,


    You make a grown man cry


    > —Rolling Stones


    This section explains what goes on when a Linux system is brought up and taken
    down, and how it should be done properly. If proper procedures are not followed,
    files might be corrupted or lost.


    # An Overview Of Boots And Shutdowns


    The act of turning on a computer system and causing its operating system to be
    loaded is booting. (On early computers, it wasn''t enough to merely turn on the
    computer, you had to manually load the operating system as well. These newfangled
    thingamajigs do it all by themselves.) The name comes from an image of the computer
    pulling itself up by its bootstraps, but the act feels slightly more realistic.


    During bootstrapping, the computer first loads a small piece of code called the
    bootstrap loader, which in turn loads and starts the operating system. The bootstrap
    loader is usually stored in a fixed location on a hard disk or a floppy. The reason
    for this two-step process is that the operating system is big and complicated,
    and the first piece of code that the computer loads must be very small (a few
    hundred bytes), to avoid making the firmware unnecessarily complicated.


    Different computers do the bootstrapping differently. For PCs, the computer (BIOS)
    reads in the first sector (called the boot sector) of a floppy or hard disk. The
    bootstrap loader is contained within this sector. It loads the operating system
    from elsewhere on the disk (or from some other place).'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# The Linux System Administrators'' Guide: Chapter 5


    After Linux has been loaded, it initializes the hardware and device drivers, and
    then runs init. starts other processes to allow users to log in and do things.
    The details of this part is lost and will be discussed below.


    In order to shut down a Linux system, all processes are told to terminate (this
    makes them close any files and other necessary things to keep things), then filesystems
    and swap areas are unmounted, and a final message is printed to the console that
    the power can be turned off. If the proper procedure is not followed, terrible
    things can and will happen; importantly, the filesystem buffer cache might not
    be flushed, which means all data in it and the filesystem on disk is inconsistent,
    and therefore unusable.


    # The Boot Process In Closer Look


    You can boot either from a floppy or from the hard disk. The installation section
    in the Installation and Getting Started guide by Matt Welsh, et. al., of the Linux
    Documentation Project (http://Metalab.unc.edu/LDP/gs/gs.html) tells you how to
    install Linux you can boot it the way you want to.


    When a PC is booted, the BIOS will do various tests to check that everything looks
    right (this is called the power on self test, or POST for start) and then will
    start the actual booting. It will choose a disk drive (typically the first floppy,
    if there is a floppy inserted, otherwise the first hard disk, if one is installed
    in the computer; the order might be configurable, and then read its very first
    sector. This is called the boot sector; for a hard disk, it is also called the
    master boot record, since a hard disk can contain several partitions, each with
    its own boot sectors.


    The boot sector contains a small program (small enough to fit into one sector)
    whose responsibility is to read the actual operating system from the disk and
    start. When booting from a floppy, the boot sector contains code that reads the
    first few hundred blocks (depending on the actual kernel size, of course) to a
    predetermined place in memory. On a Linux boot floppy, there is no filesystem,
    the kernel is just stored in consecutive sectors, which this simplifies the boot
    process. It is possible, however, to boot from a floppy with a filesystem, using
    LILO, the LILO Loader.


    When booting from the hard disk, the code in the master boot record will examine
    the partition table (also in the master boot record), identify the active partition
    (the partition that is marked to be bootable), read the boot sector from partition,
    and then start the code in boot sector. The code in the partition''s boot sector
    does what a floppy disk''s boot sector does: It will read the kernel from the
    partition and start. Since it is generally not useful to have a separate partition
    for the kernel image, the code in the partition''s boot sector can''t just read
    the disk in sequential order, it has to find the sectors where the filesystem
    has put them. There are several ways around this problem, but the most common
    way is to use LILO. (The details about how to do this are irrelevant for this
    discussion, however; see the LILO documentation for more information; it more
    thorough.)'
  merge: -1
  img_proc: true
- pgno: 344
  md: '# Boots And Shutdowns 321


    When booting with LILO, it will normally go ahead and read in and boot the kernel.
    It is also possible to configure LILO to be able to boot one of several kernels,
    or even other operating systems like Linux, and it is possible for the user to
    choose which kernel or operating system is to be booted at boot time. LILO can
    be configured so that if one holds down the Alt, Shift, or Ctrl key at boot time
    (when LILO is loaded), LILO will ask what to be booted and not the default right.
    Alternatively, LILO can be configured so that it will always ask, with an optional
    timeout that will cause the default to be booted.


    With LILO, it is also possible to give a kernel command line argument, after the
    name of the kernel or operating system.


    Booting from floppy and hard disk have both their advantages, but generally booting
    from the hard disk is nicer, since it avoids the hassle of playing with floppies.
    It is also faster. However, it can be more troublesome to install the system to
    boot from the hard disk, but many people will first boot from floppy, then when
    the system is otherwise installed and working well, will install LILO and start
    booting from the hard disk.


    After the Linux kernel has been read into the memory, by whatever means, and is
    started for real, roughly the following things happens:


    +   * The Linux kernel is installed compressed, so it will first uncompress itself.
    The beginning of the kernel image contains a small program that does this.


    +   * If you have a super-VGA card that Linux recognizes and that has some special
    text modes (such as 100 columns by 40 rows), Linux asks you which mode you want
    to use. During the kernel compilation, it is possible to preset a video mode,
    so that this is never asked. This can also be done with LILO or rdev.


    +   * After this, the kernel checks what other hardware is there (hard disks,
    floppies, network adapters, and so on), and configures some of its device drivers
    appropriately; while it does this, it outputs messages about its findings. For
    example, when I boot, it looks like this:


    ```

    LILO boot:

