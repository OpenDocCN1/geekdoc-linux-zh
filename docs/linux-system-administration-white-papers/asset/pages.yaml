- pgno: 142
  md: '# Various Network Applications 119


    An RPC server consists of a collection of procedures that clients may call by
    sending an RPC request to the server, along with the procedure parameters. The
    server will invoke the indicated procedure on behalf of the client, handing back
    the return value, if there is. In order to be machine-independent, all data exchanged
    between client and server is converted to a so-called External Data Representation
    format (XDR) by the sender, and converted back to the machine-local representation
    by the receiver.


    Sometimes, improvements to an RPC application introduce incompatible changes in
    the procedure call interface. Of course, simply changing the server would crash
    all application that still expect the original behavior. Therefore, RPC programs
    have version numbers assigned to them, usually starting with 1, and with each
    new version of the RPC interface this counter will be bumped. Often, a server
    may offer several versions simultaneously; clients then indicate by the version
    number in their requests which implementation of the service they want to use.


    The network communication between RPC servers and clients is somewhat peculiar.
    An RPC server offers one or more collections of procedures; each set is called
    a program, and is uniquely identified by a program number. A list of the mapping
    service names for their programs is usually kept in /etc/rpc, an excerpt of which
    is reproduced here:


    ```

    #ident 1.11 95/07/14 SM1                   / SVr4.0 1.2

    */ "(@) rpc

    #

    #

    #

    rpc

    rpcbind 100000 portmap sunrpc rpcbind

    rstat 100001 rstat rup perfmeter

    rursersd 100002 r

    nfs 100003 nfsprog

    ypserv 100004 ypprog

    mountd 100005 mount showmount

    ybind 100007

    wall 100008 wall shutdown

    yppasswdd 100009 yppasswd

    etherstat 100010 etherstat

    rquotad 100011 rquotap quota quota

    spray 100012 spray

    3270_mapper 100013

    rje_mapper 100014

    selection_svc 100015 selnsvc

    database_svc 100016

    rexd 100017 rex

    alis 100018

    sched 100019

    lockmgr 100020

    ```'
