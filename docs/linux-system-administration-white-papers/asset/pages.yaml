- pgno: 222
  md: '# Chapter 14


    # Introduction To Sendmail+IDA


    It''s been said that you aren''t a real Unix system administrator until you''ve
    edited a sendmail.cf file. It''s also said that you''re crazy if you''ve attempted
    to do so twice.


    sendmail is an incredibly powerful program. It''s also incredibly difficult to
    learn and understand for most people. Any program whose definitive reference (Sendmail,
    published by O''Reilly and Associates) is 792 pages long quite justifiably scares
    most people off.


    Sendmail+IDA is different.


    > Note

    Please refer to http://send.mail.com/ or http://send.mail/org/ for the current
    Sendmail version.


    It removes the need to edit the always cryptic sendmail.cf file and allows the
    administrator to define the site-specific routing and addressing configuration
    through relatively easy-to-understand support files called tables. Switching to
    Sendmail+IDA can save you hours of work and stress.


    Compared to the other major mail transport agents, there is probably nothing that
    can''t be faster and simpler with Sendmail+IDA. Typical things that are needed
    to run a normal UUCP or Internet site become simple to accomplish. Configurations
    that are normally extremely difficult are simple to create and maintain.


    At this writing, the current version of Sendmail5.67b+IDA1.5 is available via
    anonymous FTP from vixen.cso.uiuc.edu. It compiles without any patching required
    under Linux.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# The Linux Network Administrators'' Guide: Chapter 14


    All the configuration files required to sendmail+IDA sources to compile, install,
    and run under are included in newspak-2.2.tar.gz, which is available via anonymous
    FTP on sunsite.unc.edu in the directory /pub/Linux/system/Mail.


    # Configuration Files: Overview


    Traditional sendmail is set up by a system configuration file (typically /etc/sendmail.cf
    or /usr/lib/sendmail.cf) that is not anything like any language you''ve seen before.
    Editing the sendmail.cf file to provide customized behavior can be a humbling
    experience.


    Sendmail+IDA makes such pain essentially a thing of the past by having all configuration
    options-driven with rather easy-to-understand syntax. These options are configured
    by running m4 (a macro processor) or dbm (a database processor) on a number of
    data files Makes supplied with the sources.


    The sendmail.cf defines only the default behavior of the system. Virtually all
    special customization is done through a number of optional tables rather than
    by directly editing the sendmail.cf file. Here is a list of recent sendmail files:


    +   /etc/aliases raw data for alias names

    /etc/aliases.db data base of alias names

    /etc/sendmail.cf configuration file

    /etc/sendmail.hf help file

    /var/log/sendmail.st collected statistics

    /var/spool/queue/* temp files

    /var/run/sendmail.pid The process id of the daemon


    # The sendmail.cf File


    The sendmail.cf file for Sendmail+IDA is not directly edited, but is generated
    from an m4 configuration file provided by the local system administrator. In this
    following, we will refer to it as sendmail.m4.


    This file contains a few definitions and otherwise merely points to the tables
    where the real work gets done. In general, it is only necessary to specify:


    +   * the path names and file names used on the local system.

    * the name(s) the site is known by for email purposes.

    * which default mailer (and perhaps relay host) is desired.


    There is a large variety of parameters that can be defined to establish the behavior
    of the local site or to override compiled-configuration items. These configuration
    options are identified in the file ida/cf/OPTIONS in the source directory.


    A sendmail.m4 file for a minimal configuration (UCP or SMTP with all nonlocal
    mail being relayed to a directly connected smart host) can be as short as 10 or
    15 lines excluding comments.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# Typically Used sendmail.m4 Parameters


    A few of the items in the sendmail.m4 file are required all the time; others can
    be ignored if you can get away with defaults. The following sections describe
    each of the items in the example sendmail.m4 file in detail.


    # Items That Define Paths


    LIBDIR defines the directory where Sendmail+IDA expects to find configuration
    files, the various dbm tables, and special local definitions. In a typical binary
    distribution, this is compiled into the sendmail binary and does not need to be
    explicitly set in the sendmail.m4 file.


    # Defining The Local Mailer


    Most operating systems provide a program to handle local delivery of mail. Typical
    programs for many of the major variants of Unix are already built into the sendmail
    binary.


    In Linux, it is necessary to explicitly define the appropriate local mailer since
    a delivery program is not necessarily present in the distribution you''ve installed.
    This is done by specifying LOCAL_MAILER_DEF in the sendmail.m4 file.


    For example, to have the commonly used deliver program provide this service, you
    set LOCAL_MAILER_DEF to maililers.linux.


    # Note


    Deliver was written by Chip Salzenberg (chip%tct@ateng.com). It is part of several
    distributions and can be found in the usual anonymous FTP archives such as ftp.uu.net.


    # Dealing With Bounced Mail


    Many sites find that it is important to ensure mail is sent and received with
    close to a 100 percent success rate. While examining syslog(8) logs is helpful,
    the local mail administrator generally needs to see the headers on bounced mail
    in order to determine if the mail was undeliverable because of user error or a
    configuration error on one of the systems involved.


    Defining POSTMASTERBOUNCE results in a copy of each bounced message set to the
    person defined as Postmaster for the system.


    Unfortunately, setting this parameter also results in the text of the message
    being sent to the Postmaster, which potentially has related privacy concerns for
    people using mail on the system.


    Site postmasters should in general attempt to discipline themselves (or do so
    via technical means through shell scripts that delete the text of bounce messages
    they receive) from reading mail not addressed to them.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# Domain Name Service Related Items


    There are several well-known networks that are commonly referenced in mail addresses
    for historical reasons but are not valid for DNS purposes. Defining PSEUDOMAINS
    prevents DNS lookup attempts that will always fail.


    # Defining Names The Local System Is Known By


    Frequently, systems wish to hide their true identity, serve as mail gateways,
    or receive and process mail addressed to “old” names by which they used to be.


    PSEUDONYMS specifies the list of all hostnames for which the local system will
    accept mail.


    DEFAULT_HOST specifies the hostname that will appear in messages originating from
    the local host. It is important that this parameter be set to a valid value or
    all return mail will be undeliverable.


    # UUCP-Related Items


    Frequently, systems are known by one name for DNS purposes and another for UUCP
    purposes. UUCPNAME permits you to define a different hostname that appears in
    the headers of outgoing UUCP mail.


    UUCPNOD defines the commands that return a list of hostnames for the systems we
    are connected directly to via UUCP connections.


    BANGIMPLIESUCP and BANGLONYUCP ensure that mail addressed with UUCP “bang” syntax
    is treated according to UUCP behavior rather than the more current Name Service
    behavior used today on Internet.


    # Relay Systems And Mailers


    Many system administrators do not want to be bothered by the work needed to ensure
    their system is able to reach all the networks (and therefore systems) on all
    networks worldwide. Instead of doing so, they would rather relay outgoing mail
    to a smart system that is known to be “smart”.


    RELAY_HOST defines the UUCP hostname of a smart neighboring system.


    RELAY_MAILER defines the mailer used to relay the messages.


    It is important to note that these parameters result in your outgoing mail being
    forwarded to this remote system, which will affect the load of their system. Be
    certain to get explicit agreement from the remote Postmaster before you configure
    your system to use another system as a general-purpose relay host.


    # The Various Configuration Tables


    With these macros, you can change the location where Sendmail+IDA looks for the
    various dbm tables that define the system’s “real” behavior. It generally wise
    to leave them in LIBDIR.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# The Master sendmail.mc File


    The authors of Sendmail+IDA provide the sendmail.mc file, which contains the true
    "guts" of what becomes the sendmail.cf file. Periodically, new versions are released
    to fix bugs or add functionality without requiring a full release and recompilation
    of sendmail from sources.


    It is important not to edit this file.


    # So Which Entries Are Really Required?


    When not using any of the optional dbm tables, Sendmail+IDA delivers mail via
    the DEFAULT_MAILER (and possibly RELAY_HOST and RELAY_MAILER) defined in the DEFAULT_MAILER
    m4 file used to generate sendmail.cf. It is easily possible to override this behavior
    through entries in the domtable or ucpcxtable.


    A generic site is on Internet and speaks Domain Name Service, or one that is UICP-only
    and forwards all mail via UUCP through a smart RELAY_HOST, probably not need any
    specific table entries at


    Virtually all systems should set the DEFAULT_HOST and PSEUDONYMS macros, which
    define the canonical site name and aliases it is known by, and DEFAULT_MAILER.
    If you have a relay host and mail relay, you do not need to set these defaults
    if it works automatically.


    UUCP hosts will probably also need to set UUCP to their official UUCP name. They
    will also probably set RELAY_MAILER, and RELAY_HOST, which enable smart-host routing
    through a mail relay. The mail transport to be used is defined in RELAY_MAILER
    and should usually be UUCP-A for UUCP sites.


    If your site is SMTP-only and talks Domain Name Service, you would change the
    DEFAULT_MAILER to TCP-A and probably delete the RELAY_MAILER and RELAY_HOST lines.


    # A Tour Of Sendmail+IDA Tables


    Sendmail+IDA provides a number of tables that allow you to override the default
    behavior of sendmail (specified in the sendmail.m4 file) and define special behavior
    for unique situations, remote systems, and networks. These tables are post-processed
    with dbm using the Makefile provided with the distribution.


    Most sites will need few, if any, of these tables. If your site does not require
    these tables, the easiest thing is probably to make them zero-length files (with
    the touch command) and use the default Makefile in LIBDIR rather than editing
    the Makefile itself.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# mailertable


    The mailertable defines special treatment for specific hosts or domains based
    on the remote host or network name. It is frequently used on Internet sites to
    select an intermediate relay host or gateway to reach a remote network through,
    and to specify a particular protocol (UUCP or SMTP) to be used. UUoUCP sites will
    generally not need to use this file.


    Order is important. sendmail reads the file top-down and processes the message
    according to the first rule it matches. So it is generally wise to place the most
    explicit rules at the top of the file and the more generic rules below.


    There are a number of possible matches. The differences are generally in how they
    treat addresses. Typical matches are TCP-A (TCP/IP with Internet-style addresses),
    TCP-U (IP with UUCP-style addresses), and UUCP-A (UUCP with Internet-style addresses).


    The character that separates the mailer from the host portion on the left-hand
    side of a mailertable line defines how the address is modified by the mailertable.
    The important thing to realize is that this only rewrites the envelope (to get
    the mail into the remote system). Rewriting anything other than the envelope is
    generally frowned upon due to the high probability of breaking the mail configuration.


    # uucptable


    Usually, mail to hosts with fully qualified domain names is delivered via Internet-style
    (SMTP) delivery using Domain Name Service (DNS) or via the relay host. The uucptable
    forces delivery via UUCP routing by converting the domain name into a UUCP-style
    un-domainized remote hostname.


    It is frequently used when you''re a mail forwarder for a site or domain or when
    you wish to send mail via a direct and reliable UUCP link rather than potentially
    multiple hops through the default mail and any intermediate systems and networks.


    UUCP sites that talk to UUCP neighbors who use domainized mail headers would use
    this file to force delivery of the mail through the direct UUCP point-to-point
    link between the two systems rather than using the direct route through the RELAY_MAILER
    and RELAY_HOST or through the DEFAULT_MAIL.


    Internet sites that do not talk UUCP probably would not use uucptable.


    Suppose you provide mail forwarding service to a system called sesame.com in DNS
    and sesame in the UUCP maps. You would need the following uucptable entry to force
    mail for their host to go through your direct UUCP connection.


    # pathtable


    The pathtable is used to define explicit routing to remote hosts or networks.
    The pathtable file should be in patathias-style syntax, sorted alphabetically.
    The two fields on each line must be separated by a tab, debm might complain.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# Introduction To Sendmail+IDA


    Most systems will not need any pathable entries.


    # domainaintable


    The domainable is generally used to force certain behavior after a DNS lookup
    has occurred. It permits the administrator to make shorthand names available for
    commonly referenced systems or domains by replacing the shorthand name with the
    proper one automatically. It can also be used to replace incorrect host or domain
    names with the “correct” information.


    Most sites will not need any domainaintable


    # Aliases


    +   * They provide a shorthand or well-known name for mail to be addressed to
    in order to one or more persons.

    * They invoke a program with the mail message as the input to the program.

    * They send mail to a file.


    All systems require aliases for Postmaster and MAILER-DAEMON to be RFC-compliant.

    Always extremely aware of security when defining aliases that invoke programs
    or write programs since sendmail generally runs set-uid.

    Details concerning mail aliases may be found in the aliases manual page.


    # Installing sendmail


    In this section, we''ll take a look at how to install a typical binary distribution
    of Sendmail+IDA, and walk through what needs to be done to make it localized and
    functional.


    The current binary distribution of sendmail+IDA for be gotten from sunsite.unc.edu
    in /pub/Linux/system/Mail. If you have an earlier version of sendmail, I strongly
    recommend you to use the sendmail5.6b+IDA1.5 version all required Linux-specific
    patches are now in the vanilla sources and several significant security holes
    have been plugged that were in versions prior to December 1, 1993.


    If you are building sendmail from the sources, you should follow the instructions
    in the READMEs. The current Sendmail+IDA source is available from vixen.cs.uiuc.edu.
    To build Sendmail+IDA on, you also need the Linux-specific configuration files
    from newspak-2.2.tar.gz, which is available on sunsite.unc.edu in the /pub/Linux/system/Mail
    directory.


    If you have previously installed smail or another mail delivery agent, you''ll
    probably want to remove (or rename) all the files from sendmail to save.


    ![](img/8036a81002f24881cae710bb74d93a7c_228_0.png)'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# Building sendmail.cf


    To build a sendmail.cf customized for your site, you have to write a sendmail.m4
    file, and with it m4. In /usr/local/lib/mail/cf, you find a sample file called
    sendmail.m4. Copy it to yourhostname.m4, and edit it to reflect the situation
    of your site.


    The sample file is set up for a UUCP-only site that has dominated headers and
    talks to a smart host. Sites like this only need to edit a few items.


    # Testing the sendmail.cf file


    To put sendmail into "test" mode, you invoke it with the -bt flag. The default
    configuration file is the sendmail.cf file that is installed on the system. You
    can test an alternate file by using the -Cfilename option.


    # Putting All Together: Integration Testing sendmail.cf And The Tables


    At this point, you''ve verified that mail will have the desired default behavior
    and that you''ll be able to send and received validly addressed mail. To complete
    the installation, you may be necessary to create the appropriate dbm tables to
    get the desired final results.


    After creating the table(s) that are required for your site, you must process
    them through dbm by putting them in the directory containing the tables.


    If you are UUCP-only, you do not need to create any of the tables mentioned in
    the README.linux file. You''ll just have to touch the files so that the Makefile
    works.


    If you''re UUCP-only and you talk to sites in addition to your smart host, you''ll
    need to add uucptable entries for each (or mail to them will also go through the
    smart host) and run dbm against the revised uucptable.


    First, you need to make sure that mail through RELAY_HOST is sent to them via
    the RELAY_MAILER.


    If you have UUCP neighbors other than your RELAY_HOST, you need to ensure that
    mail to them has the proper behavior. Mail addressed with UUCP-style syntax to
    a host you talk UUCP should go directly to them (unless you explicitly prevent
    it with a domainentry).


    If you have uucptable entries to force UUCP delivery to certain UUCP neighbors
    who send their mail with Internet-style headers, that also needs to be tested.


    # Administrivia And Stupid Mail Tricks


    Now that we''ve discussed the theory of configuring, installing, and testing a
    Sendmail+IDA system, lets take a few moments to look into things that do happen
    routinely in the life of a mail administrator.'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'Remote systems sometimes break. Modems or phone lines fail, DNS definitions
    are set incorrectly due to human error. Networks go down unexpectedly. In such
    cases, mail administrators need to know how to react quickly, effectively, and
    safely to keep mail flowing through alternate routes to the remote systems or
    service providers can restore normal services.


    The rest of this chapter is intended to provide you with the solutions to the
    most frequently encountered "electronic emergencies."


    # Forwarding Mail To A Relay Host


    To forward mail for a particular host or domain to a designated relay system,
    you generally use mailterable.


    # Forcing Mail Into Misconfigured Remote Sites


    Frequently, Internet hosts will trouble getting mail into misconfigured remote
    sites. There are several variants of this problem, but the general symptom is
    that mail is bounced by the remote system or never gets there at all.


    These problems can put the local system administrator in a bad position because
    your users generally don''t care that you personally administer every system worldwide
    (or know how to get the administrator to fix the problem). They just know that
    their mail didn''t get through to the desired recipient on the other end and you''re
    a likely person to complain to.


    A remote site''s configuration is their problem, not yours. In all cases, be certain
    not to break your site in order to communicate with a misconfigured remote site.
    If you can''t get in touch with the Postmaster at the remote site to get them
    to fix their configuration in a timely manner, you have two options.


    +   * It is generally possible to force mail into the remote system successfully,
    although since the remote system is misconfigured, replies on the remote end might
    not work...but then that''s the remote administrator''s problem.


    You can fix the bad headers in the envelope on your outgoing messages only by
    using a domain entry for their host/domain that results in the invalid information
    being corrected in mail originating from your site:


    +   * Frequently, misconfigured sites "bounce" back to the sending system and
    effectively say "that mail is not for this site" because they do not have their
    PSEUDONYMS or equivalent set properly in their configuration. It is possible to
    totally strip off all hostname and domain information from the envelope of messages
    going from your site to them.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# Forcing Mail Be Transferred Via UUCP


    In an ideal world (from the Internet perspective), all hosts have records in the
    Domain Name Service (DNS) and will send mail with fully qualified domain names.


    If you happen to talk via UUCP to such a site, you can force mail to go through
    the point-to-point UUCP connection rather than your default mailer by essentially
    “undomainizing” its hostname through uuxcptail.


    # Preventing Mail From Being Delivered Via UUCP


    The opposite condition also occurs. Frequently, systems may have a number of direct
    UUCP connections that are used infrequently or are not as reliable and always
    available as the default mailer or relay host.


    For example, in the Seattle area there are a number of systems that exchange the
    various distributions via anonymous UUCP when the distributions are released.
    These systems talk UUCP only when necessary, so it is faster and more reliable
    to send mail through multiple reliable hosts and common (and always available)
    relay hosts.


    # Running the sendmail Queue On Demand


    To process queued messages immediately, merely type “usr/lib/runq”. This invokes
    sendmail with the appropriate options to cause sendmail to run through the queue
    of pending jobs rather than waiting for the next scheduled run.


    # Reporting Mail Statistics


    Many site administrators (and the people they work for) are interested in the
    volume of mail passing to, from, and through the local site. There are a number
    of ways to quantify mail traffic.


    +   mail comes with a utility called mailstats that reads a file /usr/local/lib/mail/sendmail.st
    and reports the number of messages and number of bytes transferred by each of
    the mailers used in the sendmail.cf file. This file must be created by the local
    administrator manually for sendmail logging to occur. The running totals are cleared
    by removing and re-creating the sendmail.st file.


    +   best way to do quality reporting regarding who use mail and how much volume
    passes to, from, and through the local system is to turn on mail debugging with
    syslogd(8). Generally, this means running the /etc/syslog daemon from your system
    startup file (which you should be doing anyway), and adding a line to /etc/syslog.conf(5).


    If you use mail.debug and get any medium to high mail volume, the syslog output
    can get quite large. Output files from sysloglog generally need to be rotated
    or purged on a routine basis from cron(8).'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'There are a number of commonly available utilities that can summarize the output
    of mail logging from syslogd. One of the more well-known utilities is syslog-stat.pl,
    a Perl script that is distributed with the Sendmail+IDA sources.


    # # Mixing And Matching Binary Distributions


    There is no true standard configuration of electronic mail transport and delivery
    agents and there is no “one true directory structure."


    Accordingly, it is necessary to ensure that all the various pieces of the system
    (USENET news, mail, TCP/IP) agree on the location of the local mail delivery program
    (Imail, and so on), remote mail delivery program (gmail), and the mail transport
    program (sendmail or small). Such assumptions are not generally documented, although
    use of the strings command help determine what files and directories are expected.
    The following are some problems we’ve seen in the past with some of the commonly
    available binary distributions and sources.


    +   * Some versions of the Net-2 distribution of TCP/IP have services defined
    for a program called umail rather than sendmail.


    +   * There are various ports of elm and mailx that look for a delivery agent
    of /usr/bin/small rather than sendmail.


    +   * Sendmail+IDA has a built-in local mailer for deliver, but expects it to
    be located in /bin rather than the more typical location of /usr/bin.


    Rather than go through the trouble of building all the mail clients from sources,
    we generally fake it with the appropriate soft links.


    # # Where To Get More Information


    There are many places you can look for more information on sendmail. For a list,
    see the MAIL.Howto posted regularly to comp.answers. It is also available for
    anonymous FTP on rtfm.mit.edu. However, the definitive place is in the Sendmail+IDA
    sources. Look in the directory ida/cf below the source directory for the files
    DBM-GUIDE, OPTIONS, and sendmail.mc.'
  merge: -1
  img_proc: true
- pgno: 233
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Chapter 15

    Netnews


    The idea of network news was born in 1979 when two graduate students, Tom Truscott
    and Jim Ellis, thought of using UUCP to connect machines for the purpose of information
    exchange among users. They set up a small network of three machines in North Carolina.


    Initially, traffic was handled by a number of shell scripts (later rewritten in
    C), but they were never released to the public. They were quickly replaced by
    "A" news, the first public release of news software.


    "A" news was not designed to handle more than a few articles per group and day.
    When the volume continued to grow, it was rewritten by Mark Horton and Matt Glickman,
    who called it the "B" release (a.k.a. Bnews). The first public release of Bnews
    version 2.1 in 1982. It was expanded continuously, with several new features added.
    Its current version is Bnews 2.11. It is slowly becoming obsolete, with its last
    official maintainer having switched to INN.


    Another rewrite was done and released in 1987 by Geoff Collier and Henry Spencer;
    this is release "C", or C-News. In the time following there have been a number
    of patches to C-News, the most prominent being the C-News Performance Release.
    On sites that carry a large number of groups, the overhead involved in frequently
    invoking relaynews, which is responsible for dispatching incoming articles to
    other hosts, is significant. The Performance Release adds an option to relaynews
    that allows to run it in daemon mode, in which the program puts itself in the
    background.


    211'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# 212 The Linux Network Administrators'' Guide: Chapter 15


    The Performance Release is the C-News version currently included in most releases.


    All news releases up to “C” are primarily targeted for UUOCP networks, although
    they may be used in other environments as well. Efficient news transfer over networks
    like TCP/IP, DECNet, or required a new scheme. This was the reason why, in 1986,
    the Network News Transfer Protocol, NNTP, was introduced. It is based on network
    connections, and specifies a number of commands to interactively transfer and
    retrieve articles.


    There are a number of NNTP-based applications available from the Net. One of them
    is the nntpd package by Brian Barber and Phil Lasley, which you can use, among
    others, to provide newsreading service to a number of hosts inside a local network.
    Ntpd is designed to complement news packages such as Bnews or C-News to give them
    NNTP features.


    A different NNTP package is INN, or Internet News. It is not merely a front end,
    but a news system by its origin. It comprises a sophisticated news relay daemon
    that is capable of maintaining several concurrent NNTP links efficiently, and
    is there the news server of choice for many Internet sites.


    # # What Is Usenet, Anyway?


    One of the most astounding facts about Usenet is that it is not part of any organization,
    or any sort of centralized network authority. In fact, it is part of Usenet local
    order that except for a technical description, you cannot define what it is, you
    can only say what it isn''t. If you have Brendan Kehoe''s excellent “Zen and the
    Art of the Internet” (available online at www.cs.indiana.edu/docproject/zen/zen-1_0_toc/html);
    or take a look at the author’s home page at www.zen.org/~brendan/) at least, you
    will find the amazing list of Usenet''s nonproperties.


    At the risk of sounding, one might define Usenet as a collaboration of separate
    sites that exchange Usenet news. To be a Usenet site, all you have to do is find
    another Usenet site, and strike an agreement with its owners and maintainers to
    exchange news with you. Providing another site with news is also feeding it, whichever
    common axiom of Usenet philosophy originates: “Get a feed and you are on it.”


    The basic unit of Usenet news is the article. This is a message user writes and
    “posts” to the net. In order to enable news systems to deal with it, it is prepended
    with administrative information, the so-called article header. It is very similar
    to the mail header format down in the Internet mail standard RFC-822, in that
    it consists of several lines of text, beginning with a field name terminated by
    a colon, which is followed by the field''s value.


    > Note The format of Usenet news messages is specified in RFC-1036, “Standard
    For Interchange Of USENET Messages.'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'Netews 213


    Articles are submitted to one or more newsgroups. One may consider a newsgroup
    forum for articles relating to a common topic. All newsgroups are organized in
    a hierarchy, with each group''s name indicating its place in the hierarchy. This
    often makes it easy to see what a group is all about. For example, anybody can
    see from the newsgroup name that comp.os.linux.announce is used for announcements
    concerning a computer operating system named Linux.


    These articles are then exchanged between Usenet sites that are willing to carry
    news from this group. When two sites agree to exchange news, they are free to
    exchange whatever newsgroups they like to, and may add their own local news hierarchies.
    For example, groucho.edu might have a news link to barnard.edu, which is a major
    news feed, and several links to minor sites which it feeds. Now, Barnard College
    might receive all Usenet groups, while GNU only wants to carry a few hierarchies
    like sci, comp, rec, and so on. Some of the downstream sites, a UUUP site called
    brewq, will want to carry even fewer groups, because they don''t have the network
    or hardware resources. On the other hand, brewq might want to receive newsgroups
    from the fj hierarchy, GNU doesn''t want. It therefore maintains another link
    with gableaster.com, which carries all fj groups, and feed to brewq.


    # # How Does Usenet Handle News?


    Today, Usenet has grown to enormous proportions. Sites that carry the whole of
    netews, they typically transfer something along the lines of 3–5GB per day. Of
    course this requires much more than pushing around files. So let''s take a look
    how how systems handle Usenet news.


    > > Note

    If you would like to read about the most recent Usenix conference where they cover
    some highly interesting topics, be sure to check out www.infosys.tuwien.ac/stafi/pooh/papers/NewsCacheHP/


    News is distributed through the net by various transports. The historical method
    used to be UUCP, but the main traffic is carried by Internet sites. The routing
    algorithm used is called flooding. Each site maintains a number of links (news
    feeds) to other sites. Any article generated or received by the local system is
    forwarded to them, unless it has already been seen at that site, in which case
    it is discarded. A site may find out all other sites the article has already traversed
    by looking at the Path: header field. This header contains a list of all sites
    the article has been forwarded by bang path notation.


    To distinguish articles and recognize duplicates'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'The flow between any two sites may be limited by two criteria: For one, an
    article is assigned a distribution (in the Distribution: header field), which
    may be used to confine it to a certain group of sites. On the other hand, the
    newsgroups exchanged may be limited by both the sending or receiving system. The
    set of newsgroups and distributions allowed for transmission to a site are usually
    kept in the sys file.


    The sheer number of articles usually requires improvements to be made to the above
    scheme. With UUCP networks, the natural thing to do is to collect articles over
    a period of time, and combine them into a single file, which is compressed and
    sent to the remote site. This is called batching. (The golden rule of netiquette,
    according to Geoff Collier: "Thou shalt batch articles")


    An alternative technique is the ihave/sendme protocol that prevents duplicate
    articles from being transferred in the first place, thus saving bandwidth. Instead
    of putting all articles in batch files and sending them, only the message IDs
    of articles are combined into a giant "ihave" message and sent to the remote site.
    It reads this message, compares it to its history file, and returns the list of
    articles it wants in a "sendme" message. Only these articles are sent.


    Of course, ihave/sendme makes sense if it involves two sites that receive news
    from several independent feeds each, and poll each other often enough for efficient
    flow of news.


    Sites are on the Internet generally rely on TCP/IP-based software that uses the
    News Transfer Protocol, NNTP. (Described in RFC-977.) It transfers news between
    feeds and provides Usenet access to single users on remote hosts.


    NNTP knows three ways to transfer news. One is a real-time version of ihave/sendme,
    also referred to as pushing news. The second technique is called pulling news,
    in which the client requests a list of articles in a given newsgroup or hierarchy
    that have arrived at the server''s site after a specified date, and those it cannot
    find in its history file. The third method is for interactive newsreading, which
    allows you or your reader to retrieve articles from specified newsgroups, as well
    as posts with complete header information.


    At each site, news are kept in a directory below /var/ spool/news, each article
    in a separate file and each newsgroup in a separate directory. The directory name
    is made up of the newsgroup name, with the components being the path components.
    comp.os.linux.misc articles are kept in /var/ spool/comp/os/misc. Articles in
    a newsgroup are assigned numbers in the order they arrive. These numbers serve
    as the file''s name. The range of articles currently online is kept in a file
    called active, which at the same time serves as a list of newsgroups known at
    your site. Since disk space is a finite resource, one has to start throwing away
    articles after some time. This is called expiring. Usually, articles from certain
    groups and hierarchies are expired at a fixed number of days after they arrive.
    This may be overridden by the poster by specifying a date of expiration in the
    Expires: field of the article header.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# Chapter 16

    C-News


    One of the most popular software packages for Netnews is C-News. You can download
    it from ftp://ftp.cs.toronto.edu/pub/c-news/c-news.tar.Z. It was designed for
    sites that carry news over UUCP links. This chapter will discuss the central concepts
    of C-News and the basic installation and maintenance tasks.


    C-News stores its configuration files in /usr/lib/news, and most of its binaries
    are virtually all in the /usr/lib/news/bin directory. Articles are kept below
    /var/spool/news. You should make sure virtually files in these directories are
    owned by user news, group news. Most problems arise from files being inaccessible
    to C-News. Make it a rule for you to become user news using before you touch anything
    in there. The only exception is setwinds, which is used to set the real user ID
    of news programs. It must be owned by root and must have the setuid bit set.


    In the following, we describe all C-News configuration files in detail and show
    you what you have to do to keep your site running.


    # Delivering News


    Articles may be fed by C-News in several ways. When a local user posts an article,
    the newsreader usually hands it to the inews command, which completes the header
    information. News from remote sites, be it a single article or a whole batch,
    is given to the rnews command, which stores it in the /var/spool/news.in directory,
    from where it will be picked up at a later time by newsrun. With any of these
    two techniques, however, the article will eventually be handed to the relaynews
    command.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# 216 The Linux Network Administrators'' Guide: Chapter 16


    For each article, the relaynews command first checks if the article has already
    been seen at the local site by looking up the message ID in the history file.
    Duplicate articles will be dropped. Then, relaynews looks at the Newsgroup header
    to find out if the local site requests from any of these groups. If it does, and
    the newsgroup is listed in the active file, relaynews tries to store the article
    in the corresponding directory in the news area. If this directory does not exist,
    it is created. The article''s message ID will then be logged to the history file.
    Otherwise, relaynews drops the article.


    If relaynews fails to store an incoming article because a group it has been posted
    to is not listed in your active file, the article will be moved to the junk group.
    (There may be a difference between the groups that exist at your site, and those
    your site is willing to receive. For example, the subscription list may specify
    all, which means all news below the group hierarchy, at your site, only a number
    of groups are listed in the active. Articles posted to those groups will be moved
    to junk.) relaynews will also check for stale or mismatched articles and reject
    them. Incoming batches that fail for any other reason are moved to /var/spool/news/in/coming/bad
    and an error message is logged.


    After this, the article will be relayed to all other sites that request news from
    these groups, using the transport specified for each particular site. To make
    sure it''s not sent to a site that has already been seen, each destination site
    is checked against the article''s Path: Header field, which contains the list
    of sites the article has traversed so far, written in bang path style. Only if
    the destination site''s name does not appear in this list will the article be
    sent to it.


    C-News is commonly used to relay news via UUCP sites, although it is possible
    to use it in a NNTP environment. To deliver news to a remote site—either single
    articles or whole batches—ux is used to execute the rnews command on the remote
    site and feed the article or batch to its standard input.


    When batch is enabled for a given site, C-News does not send any incoming article
    immediately, but appends its path name to a file, usually out.going/site/togo.
    Periodically, a batcher program is executed from a crontab entry (note that this
    should be the crontab of news, in order not to mangle file permissions), which
    puts articles in one or more files, optionally compresses them, and sends them
    to rnews at the remote site.


    # Installation


    To install C-News, untar the files into their proper places if you haven''t done
    so yet, and edit the configuration files listed below in the following bulleted
    list. (They are all located in /usr/lib/news.) Their formats will be described
    in the following sections.


    > Note

    Here is some information on how news flows through relaynews:


    +   1. There may be a difference between the groups that exist at your site, and
    those your site is willing to receive. For example, the subscription list may
    specify'
