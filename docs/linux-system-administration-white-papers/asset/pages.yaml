- pgno: 288
  md: '# Chapter 1


    # Overview Of A Linux System


    > "God looked over everything he had made, and saw that it was very good." — Genesis
    1:31


    This chapter gives an overview of a Linux system. First, the major services provided
    by the operating system are described. Then, the programs that implement these
    services are described with a considerable lack of detail. The purpose of this
    chapter is to give an understanding of the system as a whole, so that each part
    is described in detail elsewhere.


    # Various Parts Of An Operating System


    A Unix operating system consists of a kernel and some system programs. There are
    also some application programs for doing work. The kernel is the heart of the
    operating system. (In fact, it is often mistakenly considered to be the operating
    system itself, but it is not. An operating system provides many more services
    than a plain kernel.) It keeps track of files on the disk, starts programs and
    runs concurrently, assigns memory and sends packets to the network, receives packets
    from and so on. The kernel does very little by itself, but it provides tools with
    which all services can be built. It also prevents anyone from accessing the hardware
    directly, forcing everyone to use the tools it provides. This way the kernel provides
    some protection for users from each other. The tools provided by the kernel are
    used via system calls; see manual page section 2 for more information on this.


    The system programs use the tools provided by the kernel to implement the various
    services required from an operating system. System programs, and all other programs,
    run "on top of the kernel," in what is called the user mode. The difference between
    system'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# 26 The Linux System Administrators’ Guide: Chapter 1


    and application programs is of intent: Applications are intended for getting useful
    done (or for playing, if it happens to be a game), whereas system programs are
    needed to get the system working. A word processor is an application; Telnet is
    a system program. The difference is often somewhat blurry, however, and is important
    only to compulsive categorizers.


    An operating system can also contain compilers and their corresponding libraries
    (GCC and the C library in particular under Linux), although not all programming
    languages need be part of the operating system. Documentation, and sometimes games,
    can be part of it. Traditionally, the operating system has been defined by the
    contents of the installation tape or disks; with Linux it is not as clear as it
    is spread all over the FTP sites of the world.


    # Important Parts Of The Kernel


    The Linux kernel consists of several important parts: process management, memory
    management, hardware device drivers, filesystem drivers, network management, and
    various other bits and pieces. Figure 1.1 shows some of them.


    Probably the most important parts of the kernel (nothing else works without them)
    are memory management and process management. Memory management takes care of
    assigning memory areas and swap space areas to processes, parts of the kernel,
    and for the


    ![](img/8036a81002f24881cae710bb74d93a7c_289_0.png)


    Figure 1.1nSome of the more important parts of the Linux kernel.'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'buffer cache. Process management creates processes and implements multitasking
    by switch- ing the active process on the processor.


    Some services provided by the kernel itself have similar properties, and can ther-
    fore abstracted into classes. For example, the various network protocols have
    been abstracted into one programming interface, the BSD socket library. Another
    example is the virtual filesystem (VFS) layer that abstracts the filesystem operations
    away from their imple-mentation. Each filesystem type provides an implementation
    of each filesystem operation. When some entity tries to use a filesystem, the
    request goes via the VFS, which routes the request to the proper filesystem driver.


    # Major Services In A Unix System


    This section describes some of the more important Unix services, but without much
    detail. They are described more thoroughly in later chapters.


    # init


    The single most important service in a Unix system is provided by init. init is
    started as the first process of every Unix system, as the last thing the kernel
    does when it boots. When init starts, it continues the boot process by doing various
    startup chores (checking and mount- ing filesystems, starting daemons, and so
    on).


    The exact list of things that init depends on which flavor it is; there are several
    to choose from. init usually provides the concept of single user mode, in which
    no one can log in and root uses a shell at the console; the usual mode is called
    multiuser mode. Some flavors generalize this as run levels; single and multiuser
    modes are considered to be two run levels, and there can be additional ones as
    well, for example, to run X on the console.


    In normal operation, init makes itself getty working (to allow users to log in)
    and adopt orphan processes (processes whose parent has died; in Unix all processes
    must be in a single tree, so orphans must be adopted).


    When the system is shut down, it is init that is in charge of killing all other
    processes, unmounting all filesystems and stopping the processor, along with anything
    else it has been configured to do.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# Logins From Terminals


    Logins from terminals (via serial lines) and the console (when not running X)
    are provided by the getty program, it starts a separate instance of getty for
    each terminal for logins are to allowed. getty reads the username and runs the
    login program, which reads the password. If the username and password are correct,
    login runs the shell. When the terminates, i.e., the user logs out, or when login
    terminated because the username and password didn''t match, it notices this and
    starts a new instance of getty. The kernel has no notion of logins, this is all
    handled by the system programs.


    # syslog


    The kernel and many system programs produce error, warning, and other messages.
    It is often important that these messages can be viewed later, even much later,
    so they should be written to a file. The program doing this is syslog. It can
    be configured to sort the messages to different files according to writer or degree
    of importance. For example, kernel messages are often directed to a separate file
    from the others, since kernel messages are often important and need to be read
    regularly to solve problems.


    # Periodic Command Execution: Cron and At


    Both users and system administrators often need to run commands periodically.
    For example, the system administrator might want to run a command to clean the
    directories with temporary files (/tmp and /var/tmp) from old files, to keep the
    disks from filling up, since not all programs clean up after themselves.


    The cron service is set up to do this. Each user has a crontab file, where he
    lists the commands he wants to execute and the times they should be executed.
    The daemon takes care of starting the commands when specified. The at service
    is similar to cron, but it is only once: The command is executed at the given
    time, but it is not repeated.


    # Graphical User Interface


    Unix and Linux do not incorporate the user interface into the kernel; instead,
    they let it be implemented by user-level programs. This applies for both text
    mode and graphical environments.


    This arrangement makes the system more flexible, but has also the disadvantage
    that it is simple to implement a different user interface for each program, making
    the system harder to learn.


    The graphical environment primarily used with Linux is the X Window System (X
    for short). X also does not implement a user interface; it only implements a window
    system, i.e., tools with which a graphical user interface can be implemented.
    The three most popular user interfaces implemented over X are Athena, Motif, and
    Open Look. (Recently there are KDE and Gnome, both of which are user environments
    built on top of X.)'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# Networking


    Networking is the act of connecting two or more computers so that they can communicate
    with each other. The actual methods of connecting and communicating are slightly
    complicated, but the end result is very useful.


    Unix operating systems have many networking features. Most basic services (filesystems,
    printing, backups, and so on) can be done over the network. This can make system
    administration easier, since it allows centralized administration, while still
    reaping in the benefits of microcomputing and distributed computing, such as lower
    costs and better fault tolerance.


    However, this book merely glances at networking; see the Linux Network Administrators''
    Guide for more information, including a basic description of how networks operate.


    # Network Logins


    Network logins work a little differently than normal logins. There is a separate
    physical serial line for each terminal via which it is possible to log in. For
    each person logging in via the network, there is a separate virtual network connection,
    and there can be any number of these (Well, at least there can be many). Bandwidth
    still being a scarce resource, there is still some practical upper limit to the
    number of concurrent logins via one network connection.. It is therefore not possible
    to run a separate getty for each possible virtual connection. There are also several
    different ways to log in via a network, telnet and rlogin the major ones in TCP/IP
    networks.


    Network logins have, instead of a herd of getty, a single daemon per way of logging
    in (telnet and rlogin have separate daemons) that listens for all incoming login
    attempts. When it comes, it starts a new instance of itself to handle that single
    attempt; the original instance continues to listen for other attempts. The new
    instance works similarly to getty.


    # Network Filesystems


    One of the most useful things that can be done with networking services is sharing
    files via a network filesystem. The one usually used is called the network filesystem,
    or NFS, developed by Sun.


    With a network filesystem, any file operations by a program on one machine are
    sent over the network to another computer. This fools the program to think that
    all the files on the other computer are actually on the computer program is running
    on. This makes information sharing extremely simple, since it requires no modifications
    to programs.


    # Mail


    Electronic mail is usually the most important method for communicating via computer.
    An electronic letter is stored in a file using a special format, and special mail
    programs are used to send and read the letters.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '270 The Linux Administrators'' Guide: Chapter 1


    Each user has an incoming mailbox (a file in the special format), where all new
    mail is stored. When someone sends mail, the mail program locates the receiver''s
    mailbox and appends the letter to the mailbox file. If the receiver''s mailbox
    is in another machine, the letter is sent to the other machine, which delivers
    it to the mailbox as it best fits.


    The mail system consists of many programs. The delivery of mail to local or remote
    mailboxes is done by one program (the transfer agent or MTA, e.g., sendmail or
    gmail), while the programs use many and varied (mail user agent or MUA, e.g.,
    pine or elm). The mailboxes are usually stored in /var/spool/mail.


    # Printing


    Only one person can use a printer at one time, but it is uneical to share printers
    between users. The printer is therefore managed by software that implements a
    print queue: All print jobs are put into a queue and whenever the printer is done
    with one job, the next is sent to it automatically. This relieves the users from
    organizing the print queue and fighting over control of the printer. (Instead,
    they form a new queue at the printer, waiting for their printouts, since no one
    ever seems to be able to get the queue software to know exactly when anyone''s
    print is really finished. This is a great boost to intra-office social relations.)


    The print queue software also spools the printouts on disk, i.e., the text is
    kept in a file while the job is in the queue. This allows an application program
    to spit out the print jobs quickly to the print queue software; the application
    does not have to wait until the job is actually printed to continue. This is really
    convenient, since it allows one to print out one version, and not have to wait
    for it to be printed before one can make a completely revised new version.


    # The Filesystem Layout


    The filesystem is divided into many parts; usually along the lines of a root filesystem
    with /bin, /lib, /etc, /dev, and a few others; a /usr filesystem with programs
    and unchanging data; a/var filesystem with changing data (such as log files);
    and a/home filesystem for everyone''s personal files. Depending on the hardware
    configuration and the decisions of the system administrator, the division can
    be different; it can be all in one filesystem.


    Chapter 3 describes the filesystem layout in some detail; the Linux Filesystem
    Standard covers it in somewhat more detail.'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# Chapter 2


    # Overview Of The Directory Tree


    > "Two days later, there was Pooh, sitting on his branch, dangling his legs, and
    there, beside him, were four pots of honey"

    — A. A. Milne


    This chapter describes the important parts of a standard Linux directory tree,
    based on the FSSTND filesystem standard. (Su-perceded by the Filesystem Hierarchy
    Base [fhs] http://www.pathname.com/fhs/. See also: Linux Standard Base (http://www.linuxbase.org/)
    It outlines the normal way of breaking the directory tree into separate filesystems
    with different purposes and gives the motivation behind this particular split.
    Some alternative ways are also described.


    # Background


    This chapter is loosely based on the Linux filesystem standard, FSSTND version
    1.2 (see the bibliography), which attempts to set a standard for how the directory
    tree in a Linux system is organized. Such a standard has the advantage that it
    will be easier to write or port software for Linux and to administer Linux machines,
    since everything will be in their usual places. There is no authority behind the
    standard that forces anyone to comply with it, but it has got the support of,
    if not all, Linux distributions. It is not a good idea to break with the FSSTND
    without compelling reasons. The FSSTND attempts to follow Unix tradition and current
    trends, making Linux systems familiar to those with experience with other Unix
    systems, and vice versa.


    This chapter is not as detailed as the FSSTND. A system administrator should also
    read the FSSTND for a complete understanding.


    This chapter does not explain all files in detail. The intention is not to describe
    every file, but to give an overview of the system'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# /sbin


    Like /bin, but the commands are not intended for normal users, although they may
    use them if necessary and allowed.


    # /etc


    Configuration files specific to the machine.


    # /root


    The home directory for user \text[root].


    # /lib


    Shared libraries needed by the programs on the root filesystem.


    # /lib/modules


    Loadable kernel modules, especially those that are needed to boot the system when
    recovering from disasters (e.g., network and filesystem drivers).


    # /dev


    Device files.


    # /tmp


    Temporary files. Programs running after bootup should use /var/tmp, not /tmp,
    since the former is probably on a disk with more space.


    # /boot


    Files used by the bootstrap loader, e.g., LILO. Kernel images are often kept here
    instead of the root directory. If there are many kernel images, the directory
    can easily grow rather big, and it might be better to keep it in a separate filesystem.
    Another reason would be to make sure the kernel images are within the first 1,024
    cylinders of an IDE disk.


    # /mnt


    Mount point for temporary mounts by the system administrator. Programs aren''t
    supposed to mount on /mnt automatically. /mnt might be divided into subdirectories
    (e.g., /mnt/dosa might be the floppy drive using an MS-DOS filesystem, and /mnt/extra
    might be the same with an ext2 filesystem).


    # /proc, /usr, /var, /home


    Mount points for the other filesystems.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# /etc Directory


    /etc directory contains a lot of files. Some of them are described below. For
    others, you should determine which program belong to and read the manual page
    for that program. Many networking configuration files are in /etc as well and
    are described in the Networking Administrators'' Guide.


    Scripts or directories of scripts to run at startup or when changing the run level.
    See the chapter on init for further information.


    # /etc/passwd


    The user database, with fields giving the username, real name, home directory,
    encrypted password, and other information about each user. The format is documented
    in the \man(passwd) manual page.


    # /etc/fdprm


    Floppy disk parameter table. Describes what different floppy disk formats look
    like. Used by setfdprm. See the setdprm manual page for more information.


    # /etc/fstab


    Lists the filesystems mounted automatically at startup by the mount -a command
    (in /etc/rc or equivalent startup file). Under Linux, also contains information
    about swap areas used automatically by swapon -a. See the section “Mounting And
    Unmounting” in Chapter 3 and the mount manual page for more information.


    # /etc/group


    Similar to /etc/passwd, but describes groups instead of users. See the group manual
    page for more information.


    # /etc/inittab


    Configuration file for init.


    # /etc/issue


    Output by getty before the login prompt. Usually contains a short description
    or welcoming message to the system. The contents are up to the system administrator.'
  merge: -1
  img_proc: true
