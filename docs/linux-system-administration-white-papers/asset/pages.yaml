- pgno: 272
  md: '# Chapter 20

    Sample smail Configuration Files


    This section shows sample configuration files for a UUCP leaf on a local area
    network. They are based on the sample files included in the source distribution
    of smail-3.1.28. Although I make a feeble attempt to explain how these files work,
    you are advised to read the very fine small manual page, which discusses these
    files in great length. Once you''ve understood the basic idea behind smail configuration,
    it''s worthwhile reading. It''s easy!


    The first file shown is the routers file, which describes a set of routers to
    smail. When smail has to deliver a message to an address, it hands the address
    to all routers in turn, until one of them matches it. Matching here means that
    the router finds the destination host in its database, be it the paths file, /etc/hosts,
    or whatever routing mechanism the router interfaces to.


    Entries in smail configuration files always begin with a unique name identifying
    the router, transport, or director. They are followed by a list of attributes
    that define its behavior. This list contains a set of global attributes, such
    as the driver and private attributes that are only understood by that particular
    driver. Attributes are separated by commas, while the sets of global and private
    attributes are separated from each other using a semicolon.


    To make these fine distinctions clear, assume you want to maintain two separate
    pathalias files; one containing the routing information for your domain, and a
    second containing global routing information, probably generated from the UUCP
    maps. With smail, you can now specify two routers in the routers file, both of
    which use the pathalias driver. This driver looks'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'up hostnames in a pathalias database. It expects to be given the name of the
    file in a private attribute.


    The second global attribute given in each of the two routers above defines the
    transport port that should be used when the router matches the address. In our
    case, the message will be delivered using the uux transport. Transports are defined
    in the transports file, which is explained below.


    You can fine-tune which transport message will be delivered if you specify a method
    file instead of the transports attribute. Method files provide a mapping from
    target hostnames to transports. We won''t deal with them here.


    In an environment that mixes UUCP and TCP/IP, you may encounter the problem that
    you have hosts in /etc/hosts file that you have only occasional SLIP or PPP contact
    with. Usually, you will drift to send any mail for them UUCP. To prevent in_hosts
    file from matching these hosts, you have put them into the paths/force file. This
    is another pathalias-style database, and is consulted before small queries the
    resolver.


    The handling of mail for local addresses is configured in the directories file.
    It is made just like the routers file, with a list of entries that define a director
    each. Directors do not deliver a message; they merely perform all the redirection
    that is possible, for instance through aliases, mail forwarding, and the like.


    When delivering mail to a local address, such as Janet, small passes the username
    to all directors in turn. If a director matches, it either specifies a transport
    the message should be delivered by (for instance, to the user''s mailbox file)
    or generates a new address (for instance, after evaluating an alias).


    Because of the security issues involved, directors usually do a lot of checking
    of whether the files they may be compromised or not. Addresses obtained in somewhat
    dubious way (for instance from a world-writable aliases file) are flagged as insecure.
    Some transport drivers will turn down these addresses, for instance, the transport
    that delivers a message to a file.


    Apart from this, small also associates a user with each address. Any write or
    read operations are performed as the user. For delivery to, say, Janet''s mailbox,
    the address is of course associated Janet. Other addresses, such as those obtained
    from the aliases file, have other users associated from them, for instance, the
    nobody user.


    For details of these features, refer to the small manual.


    > Note

    The small manual is in Section 8 of the online manual (system administration commands)
    of the Linux Documentation Project.


    After successfully routing or directing a message, small hands the message to
    the transport specified by the router or director that matched the address. These
    transports are defined in the transports file. Again, a transport is defined by
    a set of global and private options.'
  merge: -1
  img_proc: true
- pgno: 274
  md: "The most important option defined by each entry is driver that handles the\
    \ transport, for the pipe driver, which invokes the command specified in the cmd\
    \ attribute. Apart from this, there are a number of global attributes a transport\
    \ may use, that perform various transformations on the message header, and possibly\
    \ message body. The return_path attribute, for instance, makes the transport insert\
    \ a return_path field in the message header. The unix_from_hack attribute makes\
    \ it precede every occurrence of the word \"From at the beginning of a line with\
    \ a >. A sample /usr/lib/sm/transports file is shown in Listing 20.1.\n\n# Listing\
    \ 20.1 A sample /usr/lib/sm/transports file.\n\n# A sample /usr/lib/sm/transports\
    \ file\n\n+   # local - deliver mail to local users # append message to a file\n\
    \  local: driver=appendfile, # include a Return-Path: field\n    return_path,\
    \ # supply a From_envelope line\n    from, # insert > before From in body\n  \
    \  unix_from_hack, \n    local: # use local forms for delivery\n\n+   file=/var/spool/mail$(lu:user).\
    \ # location of mailbox file\ngroup-mail, # group to own file for System V\nmode=0660,\
    \ # group mail can access\nsuffix=\"\\n\", # append an extra newline\n\n+   #\
    \ pipe - deliver mail to shell commands # pipe message to another program\n  pipe:\
    \ driver=pipe, # include a Return-Path: field\n    return_path, # supply a From_envelope\
    \ line\n    from, # insert > before From in body\n    unix_from_hack, # use local\
    \ forms for delivery\n    local:\n\n+   cmd=\"/bin/sh -c $user\", # send address\
    \ to the Bourne Shell\n  parent_env., # environment info from parent addr\n  pipe_as_user,\
    \ # use user-id associated with address\n  ignore_status, # ignore a non-zero\
    \ exit status\n  ignore_write_errors., # ignore write errors, i.e., broken pipe\n\
    \  umask=0022, # mask for child process\n  -log_output, # do not log stdout/stderr\n\
    \n+   # file - deliver mail to files\n  file: driver=appendfile, # include a Return-Path:\
    \ field\n    return_path, # supply a From_envelope line\n    from, \n    unix_from_hack,\
    \ # insert > before From in body\n    local: # use local forms for delivery"
  merge: -1
  img_proc: true
