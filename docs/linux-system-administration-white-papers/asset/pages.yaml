  img_proc: true
- pgno: 255
  md: '# 232 The Linux Network Administrators'' Guide: Chapter 16


    C-News handles this transparently. When you post an article, your newsreader usually
    invokes news to inject the article into the news system. This command runs a number
    of checks on the article, completes the header, and checks the file server in
    /usr/lib/news. If this file exists and contains a hostname different from the
    local host''s, news is invoked on that server host via rhs. Since the inews script
    use a number of binary commands and support files from C-News, you have to either
    have C-News installed locally or maintain the news software from the server.


    For the rhs invocation to work properly, each user must have an equivalent account
    on the server system, i.e., to one which she can log in without being asked for
    a password.


    Make sure that the hostname in server literally matches the output of the hostname(1)
    command on the server machine, else C-News will loop forever when trying to deliver
    the article.


    # Maintenance Tools And Tasks


    Despite the complexity of C-News, a news administrator''s life can be fairly easy,
    because C-News provides you with a wide variety of maintenance tools. Some of
    these are intended to be run regularly by cron, like newsdaily. Using these scripts
    reduces daily care and feeding requirements of your C-News installation greatly.


    Unless stated otherwise, these commands are located in /usr/lib/news/bin/main.
    Note that you must become user news before invoking these commands. Running them
    as super-user may render these files inaccessible to C-News.


    +   newsdaily—The name already says it: this runs once a day. It is an important
    script that helps you keep log files small, retaining copies of each from the
    last three runs. It tries to sense any anomalies, like state batches in the incoming
    and outgoing directories, postings to unknown or moderated newsgroups, and so
    on. Resulting error messages will be mailed to the newsmaster.


    +   newswatch—This is a script that should run regularly to look for anomalies
    in the news system, once an hour or so. It is intended to detect problems that
    will have immediate effect on the operability of your news system and mail a trouble
    report to the newsmaster. Things checked include state lock files that do not
    get removed, unattended input batches, and disk space shortage.


    +   addgroup—Adds a group to your site locally. The proper invocation is


    ```

    addgroup groupname y|n|m|=realgroup

    ```


    The second argument has the same meaning as the flag in the active file, meaning
    that anyone may post to the group (y), that no one may post to (n), that it is
    moderated (m), or that it is an alias for another group (=realgroup).'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'You might also want to use addgroup when the first articles arrive in a newly
    created group arrive earlier than the newsgroup control message that is intended
    to create it.


    +   - delgroup—Allows you to delete a group locally. Invoke it as


    ```

    delgroup groupname

    ```


    You still have to delete the articles that remain in the newsgroup spool directory.
    Alternatively, you might leave it to the natural course of events (a.k.a. expire)
    to make them go away.


    +   - addmissing—Adds missing articles to the history file. Run this script when
    there are articles that seem to hang around forever.


    +   - newsboot—This should be run at system boot time. It removes any lock files
    left over when news processes were killed at shutdown, and closes and executes
    any batches left over from NNTP connections that were terminated when shutting
    down the system.


    +   - newsrunning—This resides in /usr/lib/news/bin/input, and may be used to
    disable un-batching of incoming news, for instance during work hours. You may
    turn off un-batching by invoking


    ```

    /usr/lib/news/bin/input/newsrunning off

    ```'
