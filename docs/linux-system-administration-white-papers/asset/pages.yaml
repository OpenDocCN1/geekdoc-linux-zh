- pgno: 213
  md: '# 190 The Linux Network Administrators'' Guide: Chapter 13


    When compiling mail, you had best start with the set of configuration files from
    Vince Skahan''s newspak distribution. To compile in the TCP networking driver,
    you have to set the DRIVER_CONFIGURATION macro in the conf/EDITME file to either
    bsd-network or arpa-network. The former is suitable for LAN installations, but
    the Internet requires arpa-network. The difference between these two is that the
    latter has a special driver for BIND service that is able to recognize records,
    which the former doesn''t.


    # Mail Delivery Modes


    As noted above, mail is able to deliver messages immediately or queue them for
    later processing. If you choose to queue messages, mail will store away all mail
    in the messages directory /var/spool/mail. It will not process them until explicitly
    told so (this is also called "running the queue")


    You can select one of three delivery modes by setting the delivery_mode attribute
    in the config file to either foreground, background, or queued. Select delivery
    in the foreground (immediate processing of incoming messages), in the background
    (message is delivered by a child of the receiving process, with the parent process
    exiting immediately after forking), and queued. Incoming mail will be queued regardless
    of this option if the Boolean variable queue_only is set in the config file.


    If you turn on queuing, you have to make sure the queues are checked regularly;
    probably every 10 or 15 minutes. If you run mail in daemon mode, you have to add
    the option -q10m on the command line to process the queue every 10 minutes. Alternatively,
    you can invoke run from cron at these intervals. runq should be a link to mail.


    You can display the current mail queue by invoking mail with the -bp option. Equivalently,
    you can make mailq a link to mail, and invoke mailq:


    ```

    $ mailq -v

    m0pv8lr-00023UB From: root (in /var/spool/mail/input)

    Date: Sun, 24 Apr 94 07:12 MET DST

    Args: oem -oMP sendmail root@vstout.vbre.com

    Log of transactions:

    Xfer: <root@vstout.vbre.com reason: (ERR 148) transport smtp:

    connect: Connection refused

    ```


    This shows a single message sitting in the message queue. The transaction log
    (which is only displayed if you use mailq -v option) may give an additional reason
    why it is still waiting for delivery. If no attempt has been made yet to deliver
    the message, no transaction log will be displayed.


    Even when you don''t use queuing, mail will occasionally put messages into the
    queue when it finds immediate delivery fails for a transient reason. For SMTP
    connections, this may be'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'Getting smail Up And Running 19


    an unreachable host; messages may also be deferred if the file system is found
    to be full. You should therefore put in a queue every hour or so (using runq),
    else any deferred message will stick around the queue forever.


    # Miscellaneous config Options


    There are a number of options you may set in the config file, which, although
    useful, are not essential to running smail and which we will not discuss here.
    Instead, we will only mention a few that you might find a reason to use:


    +   * error copy postmaster—If this Boolean variable is set, any error will generate
    a message to the postmaster. Usually, this is only done for errors that are due
    to a faulty configuration. The variable can be turned on by putting it in the
    config file, preceded by a (+).


    +   * max hop count—If the hop count for a message (i.e., the number of hosts
    already traversed) equals or exceeds it, remote delivery will result in an error
    message being returned to the sender. The hop count is generally computed from
    the number of Received: fields in the mail header, but may also be set manually
    using the -h option on the command line. This variable defaults to 20.


    +   * postmaster—The postmaster''s address. If this address cannot be resolved
    to a valid local address, then this is used as the last resort. The default is
    root.


    # Message Routing And Delivery


    smail splits up mail delivery into three different tasks: the router, director,
    and transport modules.


    The router module resolves all remote addresses, determining which host the message
    should be sent to next and which transport must be used. Depending on the nature
    of the link, different transports such as UUCP or SMTP may be used.


    Local addresses are given to the director task which has any forwarding or aliasing.
    For example, the address may be an alias or a mailing list, or the user might
    want to forward her mail to another address. If the resulting address is, it is
    handled by the router module for additional routing, otherwise it is assigned
    a transport for local delivery. By far the most common case will be delivery to
    a mailbox, but messages may also be piped into a command or appended to some arbitrary
    file.


    The transport module, finally, is responsible for whatever method of delivery
    has been chosen. It tries to deliver the message, and in case of failure it generates
    a bounce message or defers it for a later retry.


    With smail, you have much freedom in configuring these tasks. For each of them,
    a number of drivers are available, from which you can choose those you need. You
    describe them to smail in a couple of files, namely routers, directors, and transports,
    located in /usr/lib/smail.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# The Linux Network Administrators'' Guide: Chapter 13


    If these files do not exist, reasonable defaults are assumed to be suitable for
    many sites that either use SMTP or UUCP for transport. If you want to change small''s
    routing policy or modify a transport, you should get the sample files from the
    small source distribution (the default configuration files can be found in samples/generic
    below the source directory), copy the sample files to /usr/lib/small, and modify
    them according to your needs. Sample configuration files are also given in the
    Appendix.


    # Routing Messages


    When sending a message, small first checks if the destination is the local host
    or a remote site. If the target host address is one of the local hostnames configured
    in config, the message is handed to the router module. Otherwise, small handles
    the destination address to a number of router drivers to find out which to forward
    a message to. They can be described in the routers file; if this file does not
    exist, a set of default routers are used.


    The destination host is passed to all routers in turn, and the finding the most
    specific is selected. Consider a message addressed to joe@foo.bar.com. Then, one
    router might know a default route for all hosts in the bar.com domain, while another
    one has information for foo.bar.com itself. If the latter is more specific, it
    is chosen over the former. If there two routers provide a "best match", the one
    first in the routers file is chosen.


    This router now specifies the transport to be used, for instance, UUCP, and generates
    a new destination address. The new address is passed to the transport along with
    the host to forward the message to. In the above example, small might find out
    that foo.bar.com is to be reached via UUCP using the path ernie! It will then
    generate a new target of bert!foo.bar.com!user, and the UUCP transport uses this
    as the envelope address to be


    When using the default setup, the routers are available:


    +   The destination host address can be resolved by the gethostname(3) or gethostaddr(3)
    library call, the message will be delivered via SMTP. The only exception is if
    the address is found to refer to the local host, it is handed to the director
    module, too. small recognizes IP addresses written as dotted quo as a legal hostname,
    as long as they can be resolved through a gethostaddr(3) call. For example, scro@[149.76.12.4]
    would be a valid address highly unusual mail address for scro@ quark.physics.grouch.com.


    +   If your machine is on the Internet, these routers are not what you are looking
    for, because they do not support MX records. See below for what to do in this
    case.


    +   /usr/lib/small/paths, the pathathias database, exists, small will try to look
    up the target host (minus any trailing .uucp) in this file. Mail to an address
    matched by this router will be delivered using UUCP, using the path found in the
    database.'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'The host address (minus trailing .uucp) will be compared to the output of the
    unname command to check if the target host is in fact a UUCP neighbor. If this
    is the case, the message will be delivered using the UUCP transport.


    If the address has not been matched by any of the above routers, it will be delivered
    to the smart host. The path to the smart host as well as the transport to be used
    are set in the config file.


    These defaults work for simple setups, but fail if routing requirements gets a
    little more complicated. If you are faced with any of the problems discussed below,
    you will have to install your own routers file to override the defaults. A sample
    routers file you might start with is given in the Appendix. Some distributions
    also come with a set of configuration files that are tailored to work around these
    difficulties.


    Probably the worst problems arise when your host lives in a dual universe with
    both dial-up and UUCP links. You will then have hostnames in your hosts file that
    you talk occasionally through your SLIP link, so mail will attempt to deliver
    any mail for these via SMTP. This is usually not what you want, even if the SLIP
    link is activated regularly, SMTP is much slower than sending the mail over UUCP.
    With the default setup, there''s no way of escaping mail.


    You can avoid this problem by having small check the paths file before querying
    the resolver, and put all hosts you want to force UUCP delivery into the paths
    file. If you don''t want to send any messages over SMTP ever, you can also comment
    out the resolver-based routers altogether.


    Another problem is that the default setup does not provide for true Internet mail
    routing, because the resolver-based router does not evaluate MX records. To enable
    full support for Internet mail routing, comment out this, and uncomment the one
    that used BIND instead. There are, however, small binaries included in some distributions
    that don''t have BIND support compiled in. If you enable BIND, but get a message
    in the panic file saying "router inet_hosts: driver not found," then you have
    to get the sources and recompile small.


    Finally, it is not generally a good idea to use the uanner driver. For one, it
    will generate a configuration error when you don''t have UUCP installed, because
    no unname command will be found. The second is when you have more sites listed
    in your UUCP. Systems file than you actually have mail links with. These may be
    sites you only exchange news with, or sites you occasionally download files from
    via anonymous UUCP, but have no traffic with otherwise.


    To work around the first problem, you can substitute a shell script for unname
    which does a simple exit 0. The more general solution is, however, to edit the
    routers file and remove the driver altogether.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '194 The Linux Network Administrators’ Guide: Chapter 13


    # # The Paths Database


    smail expects to find the pathias database in the paths file below /usr/lib/smail.
    This file is optional, so if you don''t want to perform any pathias routing at
    all, simply remove any existing paths file.


    Paths must be a sorted ASCII file that contains entries which map destination
    site names to UUCP bang paths. The file has to be sorted because small uses a
    binary search for looking up a site. Comments are not allowed in this file, and
    the site name must be separated from the path using a tab. Pathias databases are
    discussed in somewhat greater detail in Chapter 12.


    If you generate this file by hand, make sure to include all legal names for a
    site. For example, if a site is known by both a UUCP name and a fully qualified
    domain name, you have have an entry for each of them. The file can be sorted by
    piping it through the sort(1) command.


    If your site is only a leaf site, however, then no paths file should be necessary
    at all: Just set up the smart host attributes in your config file, and leave all
    routing to your mail feed.


    # # Delivering Messages To Local Addresses


    Most commonly, a local address is just a user’s login name, in which case the
    message is delivered to her mailbox, /var/spool/mail/user. Other cases include
    aliases and mailing list names for forwarding by the user. In these cases, the
    local address expands to a new list of addresses, which may be local or remote.


    Apart from these “normal” addresses, smail can handle other types of local message
    destinations, like file names and pipe commands. These are not addresses in their
    own right, so you can''t send mail to, say, /etc they are only valid if they have
    been taken from forwarding or alias files.


    A file name is that begins with a slash (/) or a tilde (~). The latter refers
    to the user’s home directory, and is possible only if the file name was taken
    from a .forward file or a forwarding entry in the mailbox (see below). When delivering
    to a file, amail sends the messages to the file, creating it if necessary.


    A pipe command may be any command preceded by the pipe symbol ( | ). This causes
    smail to hand the command to the shell with its arguments, but without the leading
    “I”. The message itself is fed to this command on standard input.


    For example, to gating a mailing list into a local newsgroup, you might use a
    shell script named gateit, and set up a local alias which delivers all messages
    from this mailing list to the script using “gateit”.'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'Getting mail Up And Running 19


    If the invocation contains white space, it has to be enclosed in double quotes.
    Due to the security issues involved, care is taken not to execute the command
    if the address has been obtained in a somewhat dubious way (for example, if the
    alias file from the address was was writable by everyone).


    # Local Users


    The most common case for a local address is to denote a user''s mailbox. This
    mailbox is located in /var/spool/mail and has the name of the user. It is owned
    by her, with a group of mail, and has mode 660. If it does not exist, it is created
    by smail.


    Note that although /var/spool/mail is currently the standard place to put the
    mailbox files, some mail software may have different paths compiled in, for /usr/spool/mail.
    If delivery to users on your machine fails consistently, you should try if it
    helps to make this a symbolic link to /var/spool/mail.


    There are two addresses smail requires to exist: MAILER-DAEMON and postmaster.
    When generating a bounce message for an undeliverable mail, a carbon copy is sent
    to the postmaster account for examination (in this case might be due to a configuration
    problem). The MAILER-DAEMON is used as the sender''s address on the bounce message.


    If these addresses do not name valid accounts on your system, smail implicitly
    maps MAILER-DAEMON to postmaster, and postmaster to root, respectively. You should
    ideally override this by aliasing the postmaster account to whoever is responsible
    for maintaining the mail software.


    # Forwarding


    A user may redirect her mail by having it forwarded to an alternative address
    using one of two methods supported by smail. One option is to put


    Forward to recipient,...


    in the first line of her mailbox file. This will send all incoming mail to the
    specified list of recipients. Alternatively, she might create a .forward file
    in her home directory, which contains the comma-separated list of recipients.
    With this variety of forwarding, all lines of the file are read and interpreted.


    Note that any type of address may be used. Thus, a practical example of a .forward
    file for vacations might be


    janet, "|vacation"


    The first address delivers the incoming message to Janet''s mailbox nevertheless,
    while the vacation command returns a short notification to the sender.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Alias Files


    smail able to handle alias files compatible with those known by Berkeley''s sendmail.

    Entries in the alias file may have the form


    alias: recipients


    Recipients is a comma-separated list of addresses that will be substituted for
    the alias. The recipient list may be continued across new lines if the next line
    begins with a tab.


    There is a special feature that allows smail to handle mailing lists from the
    alias file: If you specify ":include:filename” as recipient, smail will read the
    file specified and substitute its contents as a list of recipients.


    The main alias file is /usr/lib/aliases. If you choose to make this file world-writable,
    smail will not send any messages to commands given in this file. A sample file
    is shown below:


    ```

    # vbrew.com /usr/lib/aliases

    hostmaster: janet

    postmaster: janet

    usenet: phil

    # The development mailing list.

    development: joe, sue, mark, biff

    /var/mail/log/development

    owner-development: joe

    # Announcements of general interest are mailed to all

    # of the staff

    announce: :include:/usr/lib/smail/staff,

    /var/mail/log/announce

    owner-announce: root

    # gate the foobar mailing list to a local newsgroup

    ppp-list: "/usr/local/lib/gate local.lists.ppf"

    ```


    If an error occurs while delivering to an address generated from alias file, smail
    will attempt to save a copy of the error message to the "alias owner.\ For example,
    if delivery to biff fails when delivering a message to the development mailing
    list, a copy of the error message will be mailed to the sender, as well as postmaster
    and owner-development. If the owner address does not exist, no additional error
    message will be generated.


    When delivering to files or when invoking programs given in the aliases file,
    smail will become the nobody user to avoid any security hassles. Especially when
    delivering to files, this can be a real nuisance. In the file given above, for
    instance, the log files must be owned and writable by nobody, or delivery to them
    will fail.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# Mailing Lists


    Instead of using the aliases file, mailing lists may also be managed by means
    of files in the /usr/lib/lists directory. A mailing list named nag-bugs is described
    by the file lists/nagbugs, which should contain the members'' addresses, separated
    by commas. The list may be given on multiple lines, with comments being introduced
    by a hash sign.


    For each mailing list, a user (or alias) named owner-listname should exist; any
    errors occur when resolving an address is reported to this user. This address
    is also used as the sender''s address in all outgoing messages in the Sender:
    header field.


    # UUCP-Based Transports


    There are a number of transports compiled into email that utilize the UUCP suite.
    In a UUCP environment, messages are usually passed on by invoking rmail on the
    next host, giving the message on standard input and the envelope address on the
    command line. On your host, rmail should be a link to the small command.


    When handling a message to the UUCP transport, smallmail converts the target address
    to a UUCP bang path. For example, user@host will be transformed to hostuser. Any
    occurrence of the "%" address operator is preserved, so user%@gateway will become
    gateway!%user. However, smallmail will never generate addresses itself.


    Alternatively, smallmail can send and receive BSMTP batches via UUCP. One or more
    messages are wrapped up in a single batch that contains the local mailer would
    issue if a real SMTP connection could be established. BSMTP is frequently used
    in store-and-forward (e.g., UUCP-based) networks to save disk space. The transport
    ports file in the Appendix contain a transport dubbed bsmpt that generates partial
    BSMTP batches in a queue directory. They must be combined into the final batches
    later, using a shell script that adds the appropriate HELO and QUIT command.


    To enable the bsmpt transport for specific UUCP links you have to so-called method
    files (please refer to the mail(5) manual page for details). If you have only
    one UUCP link and use the smart router, you are sending SMTP batches by setting
    the smart_transport configuration variable to bsmpt instead of uux.


    To receive BSMTP batches over UUCP, you must make sure that you have the un-batching
    remote site sends its batches to. If the remote site uses small, too, you need
    to make rmail a link to small. If the remote site runs sendmail, you should additionally
    install a shell script named /usr/bin/bsmpt that does "exec rmail" (a symbolic
    link won''t work).


    # SMTP-Based Transports


    small currently supports an SMTP router to deliver mail over TCP connections.
    (The authors call this support "simple". For a future version of small, they advertise
    a complete back end'
  merge: -1
  img_proc: true
