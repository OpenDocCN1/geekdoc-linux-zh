- pgno: 356
  md: '# Logins Via The Network


    Two computers in the same network are usually linked via a single physical cable.
    When they communicate over the network, the programs in each computer that take
    part in the communication are linked via a virtual connection, a sort of imaginary
    cable. As far as the programs at either end of the virtual connection are concerned,
    they have a monopoly on their own cable. However, since the cable is not real,
    only imaginary, the operating systems of both computers can have several virtual
    connections share the same physical cable. By using a single cable, several programs
    can communicate without having to know or care about the other communications.
    It is even possible to have several computers use the same cable; the virtual
    connections exist between two computers, and the other computers ignore those
    connections that do not take part in.


    That''s a complicated and over-abstracted description of the reality. It might,
    however, be enough to understand the important reason why network logins are somewhat
    different from normal logins. The virtual connections are established when there
    are two programs on different computers that wish to communicate. Since it is
    in principle possible to log in any computer in a network to any other computer,
    there is a huge number of potential virtual connections. Because of this, it is
    not practical to start a getty for each potential login.


    There is a single process inset (corresponding to getty) that handles all network
    logins. When it notices an incoming network login (i.e., it notices a new virtual
    connection to some other computer), it starts a new process to handle that single
    login. The original process remains and continues to listen for new logins.


    To make things a bit more complicated, there is more than one communication protocol
    for network logins. The two most important ones are telnet and login. In addition
    to logins, there are many other virtual connections that may be made (for FTP,
    Gopher, HTTP, and other network services). It would be ineffective to have a separate
    process listening for a particular type of connection, so instead there is one
    listener that can recognize the type of connection and can start the correct type
    of program to provide the service. This single listener is called handc(inset);
    see The Linux Network Administrators'' Guide for more information.


    # What login Does


    The login program takes care of authenticating the user (making sure that username
    and password match), and of setting up an initial environment for the user by
    permissions for the serial line and starting the shell.


    Part of the initial setup is outputting the contents of the file /etc/motd (short
    for message of the day) and checking for electronic mail. These can be disabled
    by creating a file called .hlogin in the user''s home directory.'
  merge: -1
  img_proc: true
- pgno: 357
  md: '# The Linux Administrators'' Guide: Chapter 7


    The file /etc/nologin exists, logins are disabled. That file is typically created
    by shutdown and relatives. Login checks for this file will refuse to accept a
    login if it exists. If it does exist, login outputs its contents to the terminal
    before it quits.


    login logs all failed login attempts in a system log (via syslog). It also logs
    all logins by root. Both of these can be useful when tracking intruders.


    Currently logged in people are listed in /var/run/utmp. This file is valid only
    until the system is rebooted or shut down; it is cleared when the system is booted.
    It lists each user and the terminal (network connection) he is using, along with
    some other useful information. The who, w, and other commands look in utmp to
    see who are logged in.


    All successful logins are recorded in /var/log/wtmp. This file will grow without
    limit, so it must be cleaned regularly, for example by having a weekly cron job
    to clear it. (Good Linux distributions this out of the box.) The last command
    browsers wtmp.


    Both utmp and wtmp are in a binary format (see the utmp manual page); it is unfortunately
    inconvenient to examine them without special programs.


    # Access Control


    The user database is traditionally contained in the /etc/passwd file. Some systems
    use shadow passwords,and have moved the passwords to /etc/shadow. Sites with many
    computers that share the accounts use NIS or other method to store the user database;
    they might also automatically copy the database from one central location to all
    other computers.


    The user database contains only the passwords but also some additional information
    about the users, such as their real names, home directories, and login shells.
    This other information needs to be public, so that anyone can read it. Therefore
    the password is stored encrypted. This does have the drawback that anyone with
    access to the encrypted computer can use various cryptographic methods to guess
    it, without trying to actually log into the computer. Shadow passwords avoid this
    by moving the password into another file, which only root can read. However, installing
    shadow passwords later onto a system that does not support them can be difficult.


    With or without passwords, it is important to make sure that all passwords in
    a system are good, is not easily guessed. The crack program can be used to crack
    passwords; any password it can find is by definition not a good one. While crack
    can be run by intruders, it can also be run by the system administrator to avoid
    bad passwords. Good passwords can also be enforced by the passwd command; this
    fact in more effective in CPU cycles, cracking passwords requires a lot of computation.


    The user group database is kept in /etc/group; for systems with shadow passwords,
    there can be a /etc/shadow.group.'
  merge: -1
  img_proc: true
- pgno: 358
  md: 'root usually can''t login via most terminals or the network, only via terminals
    listed in the /etc/security file. This makes it necessary to get physical access
    to one of these terminals. It is, however, possible to log in via any terminal
    as any other user, and use the su command to become root.


    # Shell Startup


    When an interactive login shell starts, it automatically executes one or more
    predefined files. Different shells execute different files; see the documentation
    of each shell for further information.


    Most shells first run some global file, for example, the Bourne shell (/bin/sh)
    and its derivatives execute /etc/profile; in addition, they execute .profile in
    the user''s home directory. /etc/profile allows the system administrator to have
    set up a common user environment, especially by setting the path to include local
    command directories in addition to the normal ones. On the other hand, .profile
    allows the user to customize the environment to his own tastes by overriding,
    if necessary, the default environment.'
  merge: -1
  img_proc: true
