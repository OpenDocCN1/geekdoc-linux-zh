    # The Do''s And Don''ts Of UUCP: Tuning Permissions Command Execution


    UUUCP''s task is to copy files from one system to another and to request execution
    of certain commands on remote hosts. Of course, as an administrator would want
    to control what rights grant other systems—allowing them to execute any command
    on your system is definitely not a good idea.


    By default, the only commands Taylor UUCP allows other systems to execute on your
    machine are email and news, which are commonly used to exchange mail and Usenet
    news over UUCP. The default search path used by uuxat is a compile-time option,
    but should usually contain /bin, /usr/bin, and /usr/local/bin. To change the set
    of commands for a particular system, you can use the commands'' keyword in the
    sys file. Similarly, the search path can be changed with the command-path statement.
    For instance, you may want to allow system Pablo to execute the rmtp command in
    addition to email and news (rmtp is used to deliver mail with batched smtp; this
    is described in the mail chapters)


    # File Transfers


    UUCP also allows you to fine-tune file transfers in great detail. At one extreme,
    you can disable transfers to and from a particular system. Just set request to
    No, and the remote system will not be able to either retrieve files from your
    system or send it any. Similarly, you can prohibit your users from transferring
    files to or from a system by setting transfer to No. By default, users on both
    the local and the remote system are allowed to up and download files.


    In addition, you can configure the directories to and from which files may be
    copied. Usually, you will want to restrict access from remote systems to a single
    directory hierarchy, but still allow your users to send files from their home
    directory. Commonly, remote users will be allowed to receive files only from the
    public UUCP directory, /var/spool/uucpublic. This is the traditional place to
    make files publicly available; very much like FTP servers on the Internet. It
    is commonly referred to using the tilde (~) character.


    Therefore, UUCP provides four different commands to configure the directories
    for sending and receiving files. They are local-send, which specifies the list
    of directories a user may ask UUCP to send files from; local-receive, which gives
    the list of directories a user may ask to receive files to; and remote-send and
    remote-receive, which do the analogous requests for a foreign system.


    The local-send command allows users on your host to send any files below /home
    and from the public UUCP directory to Pablo. The local-receive command allows
    them to receive files either to the world-writable receive directory in the uucpublic,
    or any world-writable'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'directory below /home. The remote-send directive Pablo allows Pablo to request
    files from /var/ spool/uucppublic, except for files below the incoming and receive
    directories. This is signaled to uuicito by preceding the directory names with
    exclamation marks. Finally, the last line allows Pablo to upload any files to
    incoming.


    One of the biggest problems with file transfers using UUCP is that it will only
    receive files to directories that are world-writable. This may prompt some users
    to set up traps for other users, and so on. However, there''s no way escaping
    this except disabling UUCP file transfers altogether.


    # Forwarding


    UUCP provides a mechanism to have other systems execute file transfers on your
    behalf. For instance, this allows you to make seci retrieve a file from uchile
    for you, and send it to your system.


    This technique of passing a job through several systems is called forwarding.
    In the above example, the reason to use forwarding may be seci UUCP access to
    uchile, but your host doesn''t. However, if you run a UUCP system, you would want
    to limit the forwarding service to a few hosts you trust not to run up a horrendous
    phone bill by making down- latest X11R6 source release for them.


    By default, Taylor UUCP disables forwarding altogether. To enable forwarding for
    a particular system, you can use the forward command. This command provides a
    list of sites the system may request you to forward jobs to and from.


    The forward-to-entry for uchile is necessary so that any files returned by it
    are actually passed on to Pablo. Otherwise UUCP would drop them. This entry uses
    a variation of the forward command that permits uchile to only send files to Pablo
    through seci; not the other way around.


    To permit forwarding to any system, use the special keyword ANY (capital letters
    required).


    # Setting Up Your System For Dialing In


    If you want to set up your system for dialing in, you have to permit logins on
    your serial port, and customize some system files to provide UUCP accounts. This
    will be the topic of the current section.


    # Setting Up getty


    If you want to use a serial line as a dial-in port, you have to enable a getty
    process on this port. However, some getty implementations aren''t really suitable
    for this, because you want to use a serial port for dialing in and out. You therefore
    have to make sure you use a getty that is able to share the line with other programs,
    like uuicorp or minipro. One program that does this is ugetty from the getty_
    package. Most distributions have it, check'
