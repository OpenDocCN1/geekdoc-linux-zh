- pgno: 360
  md: '# Chapter 8


    # Managing User Accounts


    > "The similarities of sysadmins and drug dealers: both measure stuff in K''s,
    and both have users."

    —Old, tired computer joke


    This chapter explains how to create new user accounts, how to modify the properties
    of those accounts, and how to remove the accounts. Different Linux systems have
    different tools for doing this.


    # What''s An Account?


    When a computer is used by many people it is usually necessary to differentiate
    between the users, so that their private files can be kept private. This is important
    if the computer can only be used by a single person at a time, as with most microcomputers.
    (It might be quite embarrassing if my sister could read my letters.) Thus, each
    user is given a unique username, and that name is used to log in.


    There''s more to a user than just a name, however. An account is all the files,
    resources, and information belonging to one user. The term hints at banks, and
    in a commercial system each account usually has some money attached to it, that
    money vanishes at different speeds depending on how much the user stresses the
    system. For example, disk space might have a price per megabyte and day, and processing
    time might have a price per second.


    # Creating A User


    The Linux kernel itself treats users as mere numbers. Each user is identified
    by a unique integer, the user ID or uid, because numbers are faster and easier
    for a computer to process than textual names.'
  merge: -1
  img_proc: true
- pgno: 361
  md: '# The Linux System Administrators'' Guide: Chapter 8


    A separate database outside the kernel assigns a textual name, the username, to
    each user ID. The database contains additional information as well.


    To create a user, you need to add information about the user to the user database,
    and create a home directory for him. It may also be necessary to educate the user,
    and set up a suitable initial environment for him.


    Most Linux distributions come with a program for creating accounts. There are
    several such programs available. Two command line alternatives are aduser and
    usermadd; there may be a GUI tool as well. Whatever the result, there is that
    less if any manual work to be done. If the details are many and intricate, these
    programs make everything trivial. However, the section called "Creating A User
    By Hand" describes how to do it by hand.


    # /etc/passwd And Other Information Files


    The basic user database in a Unix system is the text file, /etc/passwd (called
    the password file), which lists all usernames and their associated information.
    The file has one line per username, and is divided into seven colon-delimited
    fields:


    +   * Username

    * Password, in an encrypted format

    * Numeric user ID

    * Numeric group ID

    * Full name or other description of account

    * Home directory

    * Login shell (program to run at login)


    The format is explained in more detail on the passwd manual page.


    Any user on the system may read the password file, so that they can, for, learn
    the name of another user. This means that the password (the second field) is also
    available to everyone. The password file encrypts the password, so in theory there
    is no problem. However, the encryption is breakable, especially if the password
    is weak (that is, if it is short or it can be found in a dictionary). Therefore
    it is not a good idea to have the password in the password file.


    Many Linux systems have passwords. This is an alternative way of storing the password:
    The encrypted password is stored in a separate file, /etc/shadow, which only root
    read. The /etc/passwd file contains a special marker in the second field. Any
    program that needs to verify a user setuid, and can therefore access the password
    file. Normal programs, which use only the fields in the password file, can''t
    get at his password. (Yes, this means that the password file has all the information
    about a user except his password. The wonder of development.)'
  merge: -1
  img_proc: true
- pgno: 362
  md: '# Picking Numeric User And Group IDs


    On systems it doesn''t matter what the numeric user and group IDs are, but if
    you use the Network Filesystem (NFS), you need to have the same uid and gid on
    all systems. This is because NFS also identifies users with the numeric ids. If
    you aren''t using NFS, you can let your account creation tool pick them automatically.


    If you are using NFS, you''ll have to invent a mechanism for synchronizing account
    information. One alternative is to the NIS system (please refer to the network-admin-guide
    in the first part of this book).


    However, you should try to avoid reusing numeric uids (and textual usernames),
    because the new owner of the uid (or username) may get access to the old owner''s
    files (mail, or whatever).


    # Initial Environment: /etc/skel


    When the home directory for a new user is created, it is initialized with files
    from /etc/ skel directory. The system administrator can create files in /etc/skel
    that will provide a nice default environment for users. For example, he might
    create a /etc/skel/profile that sets the EDITOR variable to some editor that is
    friendly towards new users.


    However, it is usually best to keep /etc/skel as small as possible, since it will
    be next to impossible to update existing users'' files. For example, if the name
    of the friendly editor changes, all existing users would have to edit their .profile.
    The system administrator could try to do it automatically, with a script, but
    that is almost certain going to break someone''s file.


    Whenever possible, it is better to put global configuration into global files,
    such as /etc/ profile. This way it is possible to update it without breaking users''
    setups.


    # Creating A User By Hand


    To create a new account manually, follow these steps:


    +   1. Edit /etc/passwd with vipw and add a new line for the new account. Be careful
    with the syntax. Do not edit directly with an editor! vipw locks the file, so
    that other commands won''t to update it at the same time. You should make the
    password field “*, so that it is impossible to log in.

    2. Similarly, edit /etc/group with vigr, if you need to create a new group as
    well.

    3. Create the home directory of the user with mkdir.

    4. Copy the files from /etc/skel to the new home directory.

    5. Fix ownership and permissions with chown and chmod. The -R option is most useful.
    The correct permissions vary a little from one site to another, but the following
    commands do get the right thing:'
  merge: -1
  img_proc: true
