- pgno: 258
  md: '# Chapter 17


    # A Description Of NNTP


    Due to the different network transport used, NNTP provides for a vastly different
    approach to news exchange from C. NNTP stands for "Network News Transfer Protocol,"
    and is not a particular software package but an Internet Standard (forially specified
    in RFC-977). It is based on a stream-oriented connection—usually over TCP—between
    a client in the network, and a server on a host that keeps netnews on disk storage.
    The stream connection allows the client and server to interactively negotiate
    article transfer with nearly no turnaround delay, with the Internet''s high transfer
    rates, this adds up to a news transport that surpasses the original UUCP networks
    by far. Although some years ago it was not uncommon for an article to take two
    weeks or more before it arrived in the last corner of Usenet, this is now less
    than two days; on the Internet it is within the range of minutes.


    Various commands allow clients to retrieve, send, and post articles. The difference
    between sending and posting is that the latter may involve articles with incomplete
    header information. (When posting an article over NNTP, the server always adds
    at least one header field, which is Nntp-Posting-Host:: It contains the client''s
    hostname.) Article retrieval may be used by news transfer clients as well as newsreaders.
    This makes NNTP an excellent tool for providing news access to many clients on
    a local network without going through the contortions that are necessary when
    using NFS.


    NNTP also provides for an active and a passive way of news transfer, colloquially
    called "pushing" and "pulling." Pushing is basically'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# 236 The Linux Network Administrators'' Guide: Chapter 17


    same as the C-News have/sendme protocol. The client offers an article to the server
    through the IHAVE <varsmid> command, and the server returns a response code that
    indicates whether it already has the article, or if it wants it. If so, the client
    sends the article, terminated by a single dot on a separate line.


    Pushing news has the single disadvantage that it places a heavy load on the server
    system, since it has to search its history database for every single article.


    The opposite technique is pulling news, in which the client requests a list of
    all (available) articles from a group that have arrived after a specified date.
    This query is performed by the NEWNEWS command. From the returned list of message
    IDs, the client selects those articles it does not yet have, using the ARTICLE
    command for each of them.


    The problem with pulling news is that it needs tight control by the server over
    which groups and distributions allows a client to request. For example, it to
    make sure that no confidential material from newsgroups local to the site is sent
    to unauthorized.


    There are also a number of convenience commands for newsletters that permit them
    to retrieve the article header body separately, or even single header lines from
    a range of articles. This lets you keep news on a central host, with all users
    on the (presumably) local network NNTP-based client programs for reading and posting.
    An alternative to exporting the news directories via NFS, which is described in
    Chapter 16.


    An overall problem with NNTP is that it allows the knowledgeable to insert articles
    into the news stream with false sender specification. This is called faking (The
    same problem exists with SMTP, the Simple Mail Transfer Protocol). An extension
    to NNTP allows to require a user authentication for certain commands.


    There are a number of NNTP packages available. One of the most widely known is
    the NNTP daemon, also known as the reference implementation. Originally, it was
    written by Stan Barber and Phil Lanslay to illustrate the details of RFC-977.
    Its most recent version is nntpd 1.5.11, which will be described below. You may
    either get the sources and compile it, or use the nntpd from Fred van Kempen''s
    net-std binary package. No ready-to-go binaries of nntpd are provided, because
    of various site-specific values that must be compiled in.


    Note


    Since the time of this things, have evolved. INN package, mentioned below, is
    now maintained by the ISC (Internet Software Consortium) and is considered the
    current “reference” implementation. The current version number for INN is 2.2.
    Please look here for more information: http://www.isc.org/cgi?products/INN/index.phtml.


    The nntpd package consists of a server and two clients for pulling and pushing
    news, respectively, as well as an in replacement. They live in a Bnews environment,
    but with a little tweaking, they will be happy with C-News, too. However if you
    plan to use NNTP for'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# A Description Of Nntp


    than offering newsreaders access to your news server, the reference implementation
    is not really an option. We will therefore discuss only the NNTP daemon contained
    in the nntpd and leave out the client programs.


    > Note There is also a package called "InterNet News," for short, or INN, that
    was written by Rich Salz. It provides both NNTP and UUCP-based news transport
    and is more suitable for large news hubs. When it comes to news transport over
    NNTP, it is definitely better than nntpd. INN is current at version inn-1.4sec.
    There is a kit for building INN on a machine from Arjan de Vet; it is available
    from sunsite.umc.edu in the system/Mail directory. If you want to set up INN,
    please refer to the documentation that comes along with the source, as well the
    INN-FAQ posted regularly to news.software.b and also news.software.inn.


    # Installing The NNTP Server


    The NNTP server is called nntpd and may be compiled in two ways, depending on
    the expected load on the news system. There are no compiled versions available,
    because of some site-specific defaults that are hard-coded into the executable.
    All configuration is done through micro definitions in common/conf.h.


    nntpd may be configured as either a standalone server that is started at system
    time from rc.inet2, or a daemon managed by inetd. In the latter case you will
    to have the following entry in /etc/inetd.conf:


    ```

    nntp stream tcp nowait news /usr/etc/in.nntpd nntpd

    ```


    If you configure not storing any incoming articles and so, make sure that any
    line in inetd.conf is commented out. In either case, you have to make sure there''s
    the following line in /etc/services:


    ```

    nntp 119/tcp readnews nntp # Network News Transfer Protocol

    ```


    To temporarily store any incoming articles and so, nntpd also needs a .tmp directory
    for your news spool. You should create it using


    ```

    # mkdir /var/spool/news/.tmp

    # chown news.news /var/spool/news/.tmp

    ```


    # Restricting NNTP Access


    Access to NNTP resources is governed by the file nntp_access in /usr/lib/news.
    Lines in the file describe the access rights to foreign hosts. Each line has the
    following format:


    ```

    site read|xfer|both|no post|no [lexgroups]

    ```'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# 238 The Linux Network Administrators'' Guide: Chapter 17


    If a client connects to the NNTP, nntpd attempts to obtain the host''s fully qualified
    domain name from its IP address by reverse lookup. The client''s hostname and
    IP address are checked against the site field of each entry in the order in which
    they appear in the file. Matches may be partial or exact. If an entry matches
    exactly, it applies; if the match is partial, it only applies if there is no other
    match following which is at least as good. The host may be specified in one of
    the following ways:


    +   * Hostname—This is a fully qualified domain name of a host. If this matches
    the client''s canonical hostname literally, the entry applies, and all entries
    are ignored.


    +   * IP address—This is an IP address in dotted quotation. If the client''s IP
    address matches this, the entry applies, and all entries are ignored.


    +   * Domain name—This is a domain name, specified as *.domain. If the client''s
    hostname matches the domain, the entry matches.


    +   * Network name—This is the name of a network as specified in /etc/networks.
    If the network number of the client''s IP address matches the network number associated
    with the network name, the entry matches.


    +   * Default—The default matches any client.


    Entries with a more general site specification should be specified earlier, because
    any matches by these will be overridden by later, more exact matches.


    The second and third field describe the access rights granted to the client. The
    second details the permissions to retrieve news by pulling (read), and transmit
    news by pushing (xfer). A value of enables enables both, no denies access altogether.
    The third field grants the client the right to post articles, that is, deliver
    articles with incomplete header information which is completed by the news software.
    If the second field contains no, the third field is ignored.


    The fourth field is optional, and contains a comma-separated list of groups the
    client is denied access to.


    A sample nntp_access file is shown below:


    ```

    #

    # by default, anyone may transfer news, but not read or post

    default xfer no

    #

    # public.vbrew.com offers public access via modem, we allow

    # them to read and post to any the local.* groups

    public.vbrew.com            post !local

    #

    # all other hosts at the brewery may read and post

    *.vbrew.com      read      post

    ```'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# NNTP Authorization


    When capitalizing the access tokens like xfer or read in the nntp_acces file,
    nntpd requires the authorization from the client for the respective operations.
    For instance, when specifying a permission of Xfer or XFER, nntpd will not let
    the client transfer articles to your site unless it passes authorization.


    The authorization procedure is implemented by means of new NNTP command named
    AUTHINFO. Using this command, the client transmits a username and a password to
    the NNTP server. nntpd will validate it by checking them against the /etc/passwd
    database and verify that the user belongs to the nntp group.


    The current implementation of NNTP authorization is only experimental, and has
    heretofore not implemented very portably. The result of this is that it works
    only with plain-style password databases; shadow passwords will not be recognized.


    # nntpd Interaction With C-News


    When receiving an article, nntpd has to deliver it to the news subsystem. Depending
    on whether it was received as a result of an IHAVE or POST command, the article
    is handled to news or inews, respectively. Instead of invoking news, you may also
    configure it (at compile time) to batch the incoming articles and move the resulting
    batches to /var/spool/news/in.coming, where they are left for relnays to pick
    them up at the next queue run.


    To be able to properly perform the ihave/send protocol, nntpd has to be able to
    access the history file. At compile time, you therefore to make sure the path
    is set correctly. You should also make sure that C-News and nntpd agree on the
    format of your history file. C-News uses dbm hashing functions to access it; however,
    there are quite a number of different and slightly incompatible implementations
    of the dbm library. If C-News has been linked with a different dbm library than
    yours you have to link nntpd with this library, too.


    A typical symptom of nntpd and C-News disagreeing on the database format is error
    messages that nntpd could not open properly, or duplicate articles received via
    NNTP. A good test is to pick an article from your spool area, telnet to the nntpd
    port, and offer it to nntpd as shown in the example below (your input is marked
    like this). Of course, you have to replace <msgid> with the message of the article
    you want to feed to nntpd again.


    ```

    $ telnet localhost nntpd

    Trying 127.0.0.1...

    Connected to localhost

    Escape characters is ''^''

    201 vstout NNTP[auth] server version 1.5.11t (16 November

    1991) ready at Sun Feb 6 16:02:32 1194 (no posting)

    IHAVE <msgid>

    ```'
  merge: -1
  img_proc: true
- pgno: 263
  md: '435 Got it.

    QUIT


    This conversation shows the proper reaction of nntpd; the message “Got it” tells
    you that it already has this article. If you get a message of “335 Ok” instead,
    the lookup in the history file failed for some reason. Terminate the conversation
    by typing Ctrl+D. You can check what has gone wrong by checking the system log;
    nntpd logs all kinds of messages to the daemon facility of syslog. An incompatible
    dbm library usually manifests itself in a message complaining that dbminit failed.'
