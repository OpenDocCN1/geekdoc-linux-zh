- pgno: 330
  md: '# Using Disks And Other Storage Media


    debugfs is a filesystem debugger. It allows direct access to the filesystem data
    structures stored on disk and can thus be used to repair a disk that is broken
    that fsck cannot fix automatically. It has also been known to recover deleted
    files. However, debugfs very much requires that you understand what you''re doing;
    a failure to understand can destroy all your data.


    Dump and restore can be used to back up an ext2 filesystem. They are ext2-specific
    versions of the traditional Unix backup tools. See Chapter 9 for more information
    on backups.


    # Disks Without Filesystems


    Not all disks or partitions are used as filesystems. A swap partition, for example,
    will not have a filesystem on it. Many floppies are used in a tape-drive emulation
    fashion, so that a tar or other file is written directly on the raw disk, without
    a filesystem. Linux boot floppies don''t contain a filesystem, only the kernel.


    Avoiding a filesystem has the advantage of making more of the disk usable, since
    a filesystem always has some bookkeeping overhead. It also makes the disks more
    easily compatible with other systems: for example, the tar file format is the
    same on all systems, while filesystems are different on most systems. You will
    quickly get to use disks without filesystems if you need them. Bootable Linux
    floppies do not necessarily have a filesystem, although that is also possible.


    One reason to use raw disks is to make image copies of them. For instance, if
    the disk contains a partially damaged filesystem, it is a good idea to make an
    exact copy of it before trying to fix it, since then you can start again if your
    fixing breaks things even more. One way to do this is to use dd:


    ```

    $ dd if=/dev/fd0H1440 of=floppy-image

    2880+0 records in

    2880+0 records out

    $ dd if=floppy-image of=/dev/fd0H1440

    2880+0 records in

    2880+0 records out

    ```


    The first dd makes an exact image of the floppy to the file floppy-image, the
    second writes the image to the floppy. (The user has presumably switched the floppy
    before the second command. Otherwise the command pair is of doubtful usefulness.)


    # Allocating Disk Space


    # Partitioning Schemes


    It is not easy to partition a disk in the best possible way. Worse, there is no
    universally correct way to do it; there are too many factors involved.'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# The Linux System Administrators'' Guide: Chapter 3


    The traditional way is to have a (relatively) small root filesystem, which contains
    /bin,/etc /dev,/lib,/tmp, and other stuff that is needed to get the system up
    and running. This way, the root filesystem (in its own partition or on its own
    disk) is all that is needed to bring up the system. The reasoning is that if the
    root filesystem is small and not heavily used, it is less likely to become corrupt
    when the system crashes, and you will find it easier to fix any problems caused
    by the crash. Then you create separate partitions or use separate disks for the
    directory tree below //, the users'' home directories (often under /home), and
    the swap space. Separating the home directories (with the /users/ files) in their
    own partition makes backups easier, since it is usually necessary to back up programs
    (which reside below /usr/). In a networked environment it is also possible to
    share /usr among several machines (e.g., by using NFS), reducing the total disk
    space required by several tens or hundreds of megabytes times the number of machines.


    The problem with having many partitions is that it splits the total amount of
    free space into many small pieces. Nowadays, when disks and (hopefully) operating
    systems are more reliable, many people prefer to have just one partition that
    holds all their files. On the other hand, it can be feel painful to back up (and
    restore) a small partition.


    For a small hard disk (assuming you do not kernel development), the best way to
    go is probably have just one partition. For large hard disks, it is probably to
    have a few large partitions, until case something goes wrong. (Note that "small"
    and "large" are used in a relative sense here; your needs for disk space decide
    what the threshold is.)


    If you have several disks, you might wish to have the root filesystem (including
    /usr) on one, and the users'' home directories on another.


    It is a good idea to prepare a experiment with different partitioning schemes
    (over time, not just while installing the system). This is a bit of work, since
    it essentially requires you to install the system from scratch several times,
    but it is the only way to be sure you do it right.


    # Space Requirements


    The Linux distribution you will install give some indication of how much disk
    space you need for various configurations. Programs installed separately may also
    do the same. This will help you plan your disk space usage, but you should prepare
    for the future and reserve some extra space for things you will notice later that
    you need.


    The amount you need for user files depends on what your users wish to do. Most
    people seem to need as much space for their files as possible, but the amount
    they will live happily with a lot. Some people do only light text processing and
    will survive nicely with a few megabytes, others do heavy image processing and
    will live gigabytes.


    By the way, when comparing file sizes given in kilobytes or megabytes and disk
    space given in megabytes, it can be important to know that the two units can be
    different. Some manufacturers like to pretend that a kilobyte is 1,000 bytes and
    a megabyte is 1,000 kilo-'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# Using Disks And Other Storage Media


    bytes, while all rest of the computing world uses 1,024 for both factors. Therefore,
    my 345MB hard disk was really a 330MB hard disk. (Sic transit mundi).


    Swap space allocation is discussed in the section called "Allocating Swap Space"
    in Chapter 4.


    # Examples Of Hard Disk Allocation


    I used to have 109MB hard disk. Now I am using a 330MB hard disk. I''ll explain
    how and why I partitioned these disks.


    The 109MB disk I partitioned in a lot of ways, when my needs and the operating
    systems I changed; I''ll explain two scenarios. First, I used to run MS-DOS together
    with Linux. For that, I needed 20MB of hard disk, or just enough to have MS-DOS,
    a C compiler, an editor, a few other utilities, the program I was working on,
    and enough free space not to feel claustrophobic. For Linux, I had a 100MB swap
    partition, and I experimented with having separate root, /usr, and /home partitions,
    but there was never enough free space in one piece to do anything interesting.


    When I didn''t need MS-DOS anymore, I repartitioned the disk so that I had a 12MB
    swap partition, and again had the rest as a single filesystem.


    The 330MB disk is partitioned into several partitions, like this:


    +   5MB

    10MB swap partition

    180MB \fn{usr} filesystem

    120MB \fn{home} filesystem

    15MB scratch partition


    The scratch partition is for playing around things that require their own partition,
    e.g., trying different Linux distributions, or comparing speeds of filesystems.
    When not needed for anything else, it is used as swap space (I like to have a
    lot of open windows).


    # Adding More Disk Space For Linux


    Adding more disk space for Linux is easy, at least after the hardware has been
    properly installed (the hardware installation is outside the scope of this book).
    If it necessary, then create the partitions and filesystem as described above,
    and add the proper lines to /etc/fstab so that it is mounted automatically.'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# Tips For Saving Disk Space


    The best tip for saving disk space is to avoid installing unnecessary programs.
    Most Linux distributions have an option to install only part of the packages they
    contain, and by analyzing your needs you might notice that you don''t need most
    of them. This will help save a lot of disk space, since many programs are quite
    large. Even if you do need a particular package or program, you might not need
    all of it. For example, some online documentation might be unnecessary, as some
    of the Elips files for GNU Emacs, some of the fonts for X11, or some of the libraries
    for programming.


    If you cannot uninstall packages, you might look into compression. Compression
    programs such as gzip or zip will compress (and uncompress) individual files or
    groups of files. The gzexe system will compress and uncompress programs invisibly
    to the user (unused programs are compressed, then uncompressed as they are used).
    The experimental DouBle system will compress all files in a filesystem, invisibly
    to the programs that use them. (If you are familiar with products such as Stacker
    for MS-DOS, the principle is the same.)'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# Chapter 4

    Memory Management


    > “Minnet, jag har tappat mitt minne, är jag svensk heller finne, kommer inte
    ihå.”

    —Bosse Österberg


    This section describes the Linux memory management features, i.e., virtual memory
    and the disk buffer cache. The purpose and workings of the things the system administrator
    needs to take into consideration are described.


    # What Is Virtual Memory?


    Linux supports virtual memory, that is, using a disk as an extension of RAM so
    that the effective size of usable memory grows correspondingly. The kernel will
    write the contents of a unused block of memory to the hard disk so that the memory
    can be used for another purpose. When the original contents are needed again,
    they are read back into memory. This is all made transparent to the user; programs
    running under Linux only see the larger amount of memory available and don''t
    notice that parts of them reside on the disk from time to time. Of course, reading
    and writing the hard disk is slower (on the order of a thousand times slower)
    than using real memory, so the programs do not run fast. The part of the hard
    disk that is used as virtual memory is called the swap space.


    Linux can use either a normal file in the filesystem or a separate partition for
    swap space. A swap partition is faster, but it is easier to change the size of
    a swap file (there''s no need to partition the whole hard disk and possibly install
    everything from scratch). When you know how much swap space you need, you should
    go for a swap partition, but if you are uncertain, you can use a swap file first,
    use the system for a while so that you can get a feel for how much swap space
    you need, and make a swap partition when you''re confident about its size.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# The Linux System Administrators’ Guide: Chapter 4


    You should also know that Linux allows one to use several swap partitions and/or
    swap files at the same time. This means that if you occasionally need an unusual
    amount of swap space, you can set up an extra swap file at such times, instead
    of keeping the whole amount allocated all time.


    A note on operating system terminology: Computer science usually distinguishes
    swapping (the whole process out to swap space) and paging (writing only fixed-size
    parts, using a few kilobytes, at a time). Paging is usually more efficient, and
    that’s what Linux does, but traditional Linux terminology talks about swapping
    anyway. (Thus quite annoying a number of computer scientists something horrible.)


    # Creating A Swap Space


    A swap file is an ordinary file; it is in no way special to the kernel. The only
    thing that matters to the kernel is that it has no holes, and that it is prepared
    for use with mkswap. It must reside on a local disk, however; it can''t reside
    in a filesystem that has been mounted NFS due to implementation reasons.


    The bit about holes important: The swap file reserves the disk space so that the
    kernel can quickly swap out a page without having to go through all the things
    that are necessary when allocating a disk sector to file. The kernel merely uses
    sectors that have already been allocated to the file. Because a hole in a file
    means there are no disk sectors allocated (for that place in this), it is not
    good for the kernel to try to use them.


    One way to create the swap file without holes is through the following command:


    ```

    $ dd if=/dev/zero of=extra-swap bs=1024 count=1024

    1024+0 records in

    1024+0 records out

    ```


    where=/extra-swap is the name of the swap file and the size of is given after
    the count=. It is best for the size to be a multiple of 4, because the kernel
    writes out memory pages, which are 4K in size. If the size is not a multiple of
    4, the last count of kilobytes may be unused.


    A swap partition is also not special in any way. You create it like any other
    partition; the only difference is that it is used as a raw partition, that is,
    will not contain any filesystem at all. It is a good idea to mark swap partitions
    as type 82 (Linux swap); this will make the partition listings clearer, even though
    it is not strictly necessary to the kernel.


    After you have created a swap file or a swap partition, you need to write a signature
    to its beginning; this contains some administrative information and is used by
    the kernel. The command to do this is `cmd{mkswap}`, like this:'
  merge: -1
  img_proc: true
- pgno: 336
  md: '```

    $ mkswap /extra-swap 1024

    ```


    Setting up swapspace, size = 1044480 bytes

    $


    Note that the swap space is not still in use yet: it exists, but the kernel does
    not use it to provide virtual memory.


    You should be very careful when using mkswap, since it does not check that the
    file or partition isn''t used for anything else. You can easily overwrite important
    files and partitions with mkswap! Fortunately, you should only need to use mkswap
    when you install your system.


    The Linux memory manager limits the size of each swap space to about 127MB (for
    various technical reasons, (4096-10) * 8 * 4096 = 133890048$ bytes, or 127.6875MB).
    You can, however, use up to 16 swap spaces simultaneously, for a total of 2GB.
    (A gigabyte here, a gigabyte there, soon we start talking about real memory).


    # Using A Swap Space


    An initialized swap space is taken into use with swapon. This command tells the
    kernel that the swap space can be used. The path to the swap space is given as
    the argument, so to start swapping on a temporary swap file one might use the
    following command.


    ```

    $ swapon /extra-swap

    $

    ```


    Swap spaces can be used automatically by listing them in the /etc/fstab file.


    | /dev/hda8 none swap sw 0 0 |

    | /swapfile none swap sw 0 0 |


    The startup scripts will run the command swapon -a, which will start swapping
    on all the swap spaces listed in /etc/fstab. Therefore, the swap command is usually
    used when extra swap is needed.


    You can monitor the use of swap spaces with free. It will tell the total amount
    of swap space used.


    ```

    $ free

    ```


    | total used free shared buffers |

    | Mem: 15152 14896 256 12404 2528 |

    | -/+ buffers: 12368 2784 |

    | Swap: 32452 6684 25768 |


    The first line of output (Mem:) shows the physical memory. The total column does
    not show the physical memory used by the kernel, which is usually about a megabyte.
    The used'
  merge: -1
  img_proc: true
- pgno: 337
  md: '# The Linux System Administrators’ Guide: Chapter 4


    column shows the amount of memory used (the second line does not count buffers).
    The free column shows completely unused memory. The shared column shows the amount
    of memory shared by several processes; the more, the merrier. The buffers column
    shows the current size of the disk buffer cache.


    That line (Swap:) shows similar information for the swap spaces. If this line
    is all zeroes, your swap space is not activated.


    The same information is available via top, or using the proc filesystem in file
    /proc/meminfo. It is currently difficult to get information on the use of a specific
    swap space.


    A swap space can be removed from use with swapoff. It is usually not necessary
    to do it, except for temporary swap spaces. Any pages in the swap space are swapped
    in first; if there is not sufficient physical memory to hold them, then they will
    be swapped out (to some other swap space). If there is not enough virtual memory
    to hold all the pages Linux will start to; after a crash it should recover, meanwhile
    the system is unusus. You should check (e.g., with free) that there is enough
    free memory before removing a swap space.


    All the swap spaces that are used automatically with swapon -a can be removed
    from use with swapoff -a; it looks at the /etc/fstab to find what to remove. Any
    manually used swap spaces will remain in use.


    Sometimes a lot of swap space can be in use even though there is a lot of free
    physical memory. This can happen for instance if at one point there need to swap,
    but later a process that occupied much of the physical memory terminates frees
    the memory. The swapped-out data is not automatically swapped in until it is needed,
    so the physical memory may remain for a long time. There is no need to worry about
    this, but it can be comforting to know what is happening.


    # Sharing Swap Spaces With Other Operating Systems


    Virtual memory is built into many operating systems. Because they need it only
    when they are running, at the same time, the swap spaces of all but the currently
    running one are being wasted. It would be more efficient for them to share a single
    swap space. This is possible, but can require a bit of hacking. The Tips-HOWTO
    contains some advice on how to implement this.


    # Allocating Swap Space


    Some people will tell you that you should allocate twice as much swap space as
    you have physical memory, but this is a bogus rule. Here''s how to do it properly:'
  merge: -1
  img_proc: true
- pgno: 338
  md: '1. Estimate your total memory needs. This is the largest amount of memory you''ll
    probably need at a time, that is the sum of the memory requirements of all the
    programs you want to run at the same time. This can be done by running at the
    same time all the programs you are likely to ever running at the same time.


    For instance, if you want to run X, you should allocate about 8MB for it, gcc
    wants several megabytes (some need an unusually large amount, up to tens of megabytes,
    but usually four should do), and so on. The kernel will use about a megabyte by
    itself, and the usual shells and other utilities perhaps a few hundred kilobytes
    (say a megabyte today). There is no need to try to be exact, rough estimates are
    fine, but you might want to be on the pessimistic side.


    Remember that if there are going to be several people using the system at the
    same time, they are all going to consume memory. However, if two people run the
    same program at the same time, the total memory consumption is not double, since
    code pages and shared libraries exist only once.


    The free and ps commands are useful for estimating the memory.


    +   2. Add some security to the estimate in Step 1. This is because estimates
    of program sizes will be probably wrong, because you''ll probably forget some
    programs you want to run, and make certain that you have some extra space in case.
    A couple of megabytes should be. It is better to allocate much than too little
    swap space, but there''s no need to overdo it and allocate the whole disk, since
    unused swap space is wasted space; also it is nicer to deal with even numbers,
    you can round the value up to the next full megabyte.


    +   3. Based on the computations above, you know how much memory you''ll be needing
    in total. So, in order to allocate swap space, you just need to subtract the size
    of your physical memory from the total memory needed, and you know how much swap
    space you need. (On some versions of Unix, you need to allocate space for an image
    of the physical memory as well, the amount computed in Step 2 is what you need
    and you shouldn''t do the subtraction.)


    +   4. If your calculated swap space is much larger than your physical memory
    (more than a couple times larger), you should probably invest in more physical
    memory, otherwise performance will be too low.


    It''s a good idea to have at least swap space, even if your calculations indicate
    that you need none. Linux uses swap somewhat aggressively, so as much physical
    memory as possible can be kept free. Linux will swap out memory pages that have
    not been used, even if the memory is not yet needed for anything. This avoids
    waiting for swapping when it is needed: The swapping can be divided earlier, when
    the disk is idle.


    Swap space can be divided among several disks. This can sometimes improve performance,
    depending on the relative speeds of the disks and the access patterns of the disks.
    You might want to experiment with a few schemes, but be aware that doing the experiments
    properly'
