  md: '# The Linux System Administrators'' Guide: Chapter 4


    quite difficult. You should not believe claims that any scheme is superior to
    any other, because it won''t always be true.


    # The Buffer Cache


    Reading from a disk (except a RAM disk, for obvious reasons) is very slow compared
    to access-ing (real) memory. In addition, it is common to read the same part of
    a disk several times during relatively short periods of time. For example, one
    might first read an email message, then read the letter to an editor when replying
    to it, then make the mail program read it when copying it to a folder. Or, consider
    how often the Command might be run on a system with many users. By reading the
    information from disk only and then keeping it in memory until longer needed,
    one can speed up all the first read. This is disk buffering, and the memory used
    for the purpose is called the buffer cache.


    Because memory is, unfortunately, a finite, and scarce resource, the buffer cache
    usually cannot be big enough (it can''t hold all the data one wants to use). When
    the cache fills up, the data that has been unused for the longest time is discarded
    and the memory thus freed for the new data.


    Disk buffering works for writes as well. On the one hand, data that is written
    is often read again (e.g, a source code file is saved to a file, then read by
    the compiler), putting data that is written in the cache is a good idea. On the
    other hand, by only putting the data into the cache, the program that writes runs
    quicker. The writes can then be in the background, without slowing down the other
    programs.


    Most operating systems have buffer caches (although they might be called something
    else), but not all of them work according to the above principles. Some are write-through:
    the data is written at once (it is kept in the cache as well, of course). The
    cache is write-back: if the writes are done at a later time. Write-back is more
    efficient than write-through, but also a bit more prone to errors: If the machine
    crashes, or the power is cut at a bad moment, or the floppy is removed from the
    disk drive before the data in the cache waiting to be written changes, are lost.
    This might even mean that the file system (if there is one) is not in fully working
    order, perhaps because the unwritten data held important changes to the bookkeeping
    information.


    Because of this, you should never turn off the power without a proper shutdown
    procedure (see Chapter 5), or removing a floppy from the disk drive until it has
    been unmounted (if it was mounted) or after whatever program is using it has signaled
    that it is finished and the floppy drive light doesn'' shine anymore. The sync
    command flushes the buffer, and that, forces all unwritten data to be written
    to disk, and can be used when one wants to be sure that everything is safely written.
    In traditional Unix systems, there is a program called update running in the background
    which does a sync every 30 seconds, so it is usually not necessary to use sync.
    Linux has an additional daemon, bflush, which does a more imperfect sync frequently
    to avoid the sudden freeze due to heavy disk I/O that sync sometimes causes.'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# Memory Management 317


    Under Linux, bdflush is started by update. There is usually no reason to worry
    about it, but bdflush happens to die for some reason, the kernel will warn about
    this, and you should start it by hand (/sbin/update).


    The cache does not actually buffer files, but blocks, which are the smallest units
    of disk I/O (under Linux, they are usually 1K). This way, also directories, super
    blocks, other file system bookkeeping data, and non-filesystem disks are cached.


    The effectiveness of a cache is primarily decided by its size. A small cache is
    next to useless: it will hold so little data that all cached data is flushed from
    the cache before it is reused. The critical size depends on how much data is read
    and written and how often the same data is accessed. The only way to know is to
    experiment.


    If the cache is of a fixed size, it is not very good to have it too big, either,
    because that might make the free memory small and cause swapping (which is also
    slow). To make the most efficient use of real memory, Linux automatically uses
    all free for buffer cache, but also automatically makes the cache smaller when
    programs need more memory.


    Under Linux, you do not need to do anything to make use of the cache, it happens
    completely automatically. Except for following the proper procedures for shutdown
    and removing floppies, you do not need to worry about it.'
  merge: -1
