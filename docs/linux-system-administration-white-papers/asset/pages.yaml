- pgno: 61
  md: '# The Linux Network Administrators’ Guide: Chapter 3


    To use TCP/IP networking, you must answer this question with “Y”. If you answer
    with “N”, however, you will still be able to compile the kernel with IPX support.


    You have to enable this option if your system acts as a gateway between two Ethernets,
    or between Ethernet and a SLIP link, or so on. Although it doesn''t hurt to enable
    this by default, you may want to disable this for a host as a so-called firewall.
    Firewalls of hosts that are connected to two or more networks, but don’t route
    traffic between them. They are commonly used to provide users from a company network
    with Internet access at a minimal risk to the internal network. Users will be
    allowed to log into the firewall and Internet services, but the company’s machines
    will be protected from outside attacks-cause any incoming connections cannot cross
    the firewall.


    This option works around an incompatibility with some versions of PC/TCP, a commercial
    TCP/IP implementation for DOS-based PCs. If you enable this option, you will still
    be able to communicate with normal machines, but performance may be hurt over
    slow links.


    This function enables RARP, the Reverse Address Resolution Protocol. RARP is used
    by diskless clients and X-terminals to inquire their IP address when booting.
    You should enable RARP only when you plan to serve this sort of clients. The latest
    package of network utilities (net-0.32d) contains a small utility named RARP that
    allows you to add systems to the RARP cache.


    When sending data over TCP, the kernel has to break the stream into several packets
    before giving it to IP. For hosts that can be reached over a local network such
    as an Ethernet, larger packets will be used than for hosts where data has go through
    long-distance links. (This is to avoid fragmentation by links that have a very
    small maximum packet size.) If you don’t enable SNARP, the kernel will assume
    only those networks are local that it actually has an interface. However, if you
    look at the class B network at Groucho Marx University, the whole B network is
    local, but most hosts interface to one or two subsets. If you enable SNARP, the
    kernel will assume all subnets are local and use large packets when talking to
    all hosts on campus.


    If you want to use smaller packet sizes for specific hosts (because, for instance,
    the data goes through a SLIP link), you can do so using the mtu option of route,
    which is briefly discussed at the end of this chapter.


    Nagle’s rule is a heuristic for sending particularly small packets, also called
    tinygrams. Tinygrams are usually created by interactive networking tools that
    transmit single keystrokes, such as telnet or rsh. Tinygrams can become particularly
    wasteful on low-bandwidth links like SLIP. The algorithm works by holding back
    transmission of TCP data briefly under some circumstances. You might only want
    to disable Nagle’s algorithm if you have severe problems with packets getting
    dropped.


    Starting in the 1.1.16 kernel, Linux supports another driver, the dummy driver.
    The following question appears towards the start of the device driver section.'
