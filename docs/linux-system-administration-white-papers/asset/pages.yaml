- pgno: 120
  md: '# Chapter 7

    nThe Point-To-Point Protocol


    Just like SLIP, PPP is a protocol to send datagrams across a serial connection,
    but addresses a couple of deficiencies of the former. It lets the communicating
    sides negotiate options such as the IP address and the maximum datagram size at
    startup time and provides for client authorization. For each of these capabilities,
    PPP has a separate protocol. Below, we will briefly cover these building blocks
    of PPP. This discussion is far from complete; if you want to know more about PPP,
    you are urged to read its specification in RFC-1548, as well as the dozen or companion
    RFCs.


    At the very bottom of PPP is the High-Level Data Link Control Protocol, abbreviated
    HDLC. HDLC defines the boundaries around the individual PPP frames, and provides
    a 16-bit checksum. As opposed to the more primitive SLIP encapsulation, a PPP
    frame is capable of holding packets from other protocols than IP, such as Novell''s
    IPX, or AppleTalk. PPP achieves this by adding a protocol field to the basic HDLC
    frame that identifies the type of packet is carried by the frame.


    LCP, the Link Control Protocol, is used on top of HDLC to negotiate options pertaining
    to the data link, such as the Maximum Receive Unit (MRU), that states the maximum
    datagram size one side of the link agrees to receive.


    An important step in the configuration stage of a PPP link is client authorization.
    Although it is not mandatory, it is really a must for dial-up lines. Usually,
    the called host (the server) asks the client to authorize itself by proving it
    knows some secret key. If the caller fails to produce the correct secret, the
    connection is terminated. With PPP, authorization works both ways; that is, the
    caller may also ask the server to authenticate itself. These authentication procedures
    are'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'totally independent of each other. There are two protocols for different types
    of authorization, which we will discuss further below. They are named Password
    Authentication Protocol, or PAP, and Challenge Handshake Authentication Protocol,
    or CHAP.


    Each protocol that is routed across the data link, like IP, AppleTalk, and so
    forth, is configured dynamically using a corresponding Network Control Protocol
    (NCP). For instance, to send IP datagrams across the link, PPPs must first negotiate
    IP address each of their uses. The control protocol used for this is IPCP, the
    Internet Protocol Control Protocol.


    Besiding standard IP datagrams across the link, PPP also supports Van Jacobson
    header compression of IP datagrams. This is a technique to shrink the headers
    of TCP packets to as little as three bytes. It is also used in CSIP, and is colloquially
    referred to as VJ-header compression. Use of compression can be negotiated at
    startup time through IPCP as well.


    # PPP On


    On Linux, PPP functionality is split into two parts: a low-level HDLC driver located
    in the kernel, and the user space ppp daemon handles the various control protocols.
    At the time of this writing, the current release of PPP is for linux-ppp-1.0.0,
    and contains the kernel PPP module, pppd, and a program named “chat” to dial up
    the remote system.


    > Note

    Currently ppp protocol support is in the kernel proper, support programs like
    the pppd daemon are found at metalab.unc.edu/pub/Linux/system/network/serial/ppp/(current
    is ppp-2.3.4)


    The PPP kernel driver was written by Michael Callahan. pppd was derived from a
    free PPP implementation for Sun and 36BSD machines, which was written by Derek
    Perkins and others, and is maintained by Paul Mackerreras. It was ported to Linux
    by Al Longyear.


    Just like SLIP, PPP is implemented by means of a special line discipline. To use
    some serial line as a PPP link, you first establish the connection over your usual
    modem, and subsequently convert the line to PPP. In this mode, all incoming data
    is passed to the PPP driver, which checks the incoming HDLC frames for validity
    (each HDLC frame carries a 16-bit checksum), and unwraps and dispatches them.
    Currently, it is able to handle IP datagrams, optionally using Van Jacobson header
    compression. As soon as it supports IPX, the PPP driver will be extended to handle
    IP packets, too.


    The kernel driver is aided by pppd, the PPP daemon, which performs the initial
    initialization and authentication phase that is necessary before actual network
    traffic can be seen across the link. pppd’s behavior can be fine-tuned using a
    number of options. As PPP is rather complex, it is impossible to explain all of
    them in a single chapter. This book therefore cannot cover all aspects of pppd,
    but only give you an introduction. For more information, refer to the manual pages
    and READMEs in the pppd distribution, which should'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# The Point-To-Point Protocol 99


    help you sort out most questions this chapter fails to discuss. If your problems
    persist after reading all documentation, you should turn to comp-protocols.ppp
    or linux.dev.ppt for help, which is the place where you will reach most of the
    people involved in the development of pppd.


    # Running pppd


    When you want to connect to the Internet through a PPP link, you have to set up
    basic networking capabilities, such as the loopback device and the resolver. Both
    have been covered in the previous chapters. There are some things to be said about
    DNS over a serial link; please refer to the SLIP chapter for a discussion of this.


    As an introductory example of how to establish a PPP connection with pppd, assume
    you are at vager. You have already dialed the PPP server, c3po, and logged into
    the ppp account. C3po has already fired up the PPP driver. After exiting the communications
    program used for dialing, you execute the following command:


    ```

    # pppd /dev/cua3 38400 crcts defaultroute

    ```


    This will fill the serial line cua3 to p mode and establish an IP link to c3po.
    The transfer speed used on the serial port will be 38400bps. The crcts option
    turns on hardware handshake on the port, which is an absolute must at speeds over
    9600bps.


    The first thing pppd does after starting is to negotiate several link characteristics
    with the remote end, using LCP. The usual default of options pppd tries to negotiate
    will work, so we won''t go into this here. We will return to LCP in more detail
    in some later section.


    For the time being, we assume that c3po doesn''t require any authentication from
    us, so that the configuration phase is completed successfully.


    pppd will negotiate the IP parameters with its peer using IPCP, the IP control
    protocol. Since we didn''t specify any particular IP address to pppd above, it
    will try to use the address obtained by having the resolver look up the local
    hostname. Both will announce their address to each other.


    Usually, there''s nothing wrong with these defaults. Even if your machine is on
    an Ethernet, you can use the same IP address for both the Ethernet and the PPP
    interface. Nevertheless, pppd allows you to use a different address, or even to
    ask your peer to use some specific addresses. These options are discussed in a
    later section.


    After going through the IP setup phase, pppd will prepare your networking layer
    to use the PPP link. It first configures the PPP network interface as a point-to-point
    link, using ppp0 for the first PPP link that is active, for the second, and so
    on. It will set up a routing table that points to the host at the other end of
    the link. In the example shown above, pppd will make the default network route
    point to c3po, because we gave it'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# The Linux Network Administrators'' Guide: Chapter 7


    The defaultroute option. (The default route is only installed if none is present.)
    This causes all datagrams to hosts not on your local network to be sent to c3po.
    There are a number of different routing schemes pppd supports, which we will cover
    in detail later in this chapter.


    # Using Options Files


    Before pppd parses its command line arguments, it scans several files for default
    options. These files may contain any valid command line arguments, spread out
    across an arbitrary number of lines. Comments are introduced by hash signs.


    The first options file is /etc/ppp/options, which is always scanned when pppd
    starts up. Using it to set some global defaults is a good idea, because it allows
    to keep your users from doing several things that might compromise security. For
    instance, to make pppd require some kind of authentication (either PAP or CHAP)
    from the peer, you would add the auth option to this file. This cannot be overridden
    by the user, so it becomes impossible to establish a PPP connection with any system
    that is not in your authentication databases.


    The other option file, which is read after /etc/ppp/options, is .pprc in the user''s
    home directory. It allows each user to specify his or her set of default options.


    A sample /etc/ppp/options file might look like this:


    ```

    # Global options for pppd running on vlager.vbre.com

    auth # require authentication

    usehostname # use local hostname for CHAP

    lock # use UPSC-style device locking

    domain vbream.com # our domain name

    ```


    The first two of these options apply to authentication and will be explained below.
    The lock keyword makes pppd comply to the standard UUCP method of device locking.
    With this convention, each process that accesses a serial device, say /dev/cua3,
    creates a file LCK..cua3 in the UUCP spool directory to signal that the device
    is in use. This is necessary to prevent any other programs, such as minicom or
    uicp, to open the serial device while used by PPP.


    The reason to provide these options in the global configuration file is that options
    such as those above cannot be overridden, and so provide for a reasonable level
    of security. Note, however, that some options can be overridden later; one example
    is the connect string.


    # Dialing Out with chat


    One of the things that may have struck you as inconvenient in the above example
    is that you had to establish the connection manually before you could fire up
    pppd. Unlike dip, pppd does not have its own scripting language for dialing the
    remote system and logging in,'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'but rather relies on some external program or shell script to do this. The
    command to executed can be given to pppd with the connect command line option.
    pppd will redirect the command''s standard input and output to the serial line.
    One useful program for this is Expect, written by Don Libes. It has a very powerful
    language based on Tcl, and was designed exactly for this sort of application.


    The pppd package comes along with a similar program called chat, which lets you
    specify a UUOCP-style chat script. Basically, a chat script consists of an alternating
    sequence of strings that we expect to receive from the remote system, and the
    answers are to send. We will call expect and send strings, respectively. This
    is a typical excerpt from a chat script:


    ```

    ogin: blff s3kr3t

    ```


    This tells chat to wait for the remote system to send the login prompt, and return
    the login name blff. We only wait for ogin: so that it doesn''t matter if the
    login starts with an uppercase or lowercase l, or if it arrives garbled. The following
    string is an expect-string that chat waits for the password prompt and send our
    password in response.


    This is basically all that chat scripts are about. A complete script to dial up
    a PPP server would, of course, also have to include the appropriate modem commands.
    Assume your modem understands the Hayes command set, and the server''s telephone
    number was 318714. The complete invocation to establish a connection with c3po
    would be


    ```

    $ chat -v '''' ATZ OK ATTD318714 CONNECT ogin: pppd GaGarIN

    ```


    By definition, the first string must be an expect, but as the modem won''t say
    anything before we have kicked it, we make chat skip the first by specifying an
    empty string. We go on and wait for ATZ, the reset command for Hayes-compatible
    modems, and wait for its response (OK). The next string sends the dial command
    along with the phone number to chat, and expects the CONNECT message in response.
    This is followed by an empty string again, because we don''t want to send anything
    now, but rather wait for the login prompt. The remainder of the chat script works
    exactly as described above.


    The -v option may log all activities to the syslog daemon''s local2 facility.
    If you edit syslog.conf to redirect these messages to a file, make sure this file
    isn''t world-readable, as chat also logs the entire chat script by default—including
    passwords and all.)


    Specifying the chat script on the command line with the ps command bears a certain
    risk, because users can view a process''s command line. You can avoid this by
    putting the chat script in a file, for example, dial-c3po. You make chat read
    the script from the file instead of command line by giving the -f option, followed
    by the file name. The complete pppd incantation would now look like this:


    ```

    # pppd connect "chat -f dial-c3po" /dev/cua3 38400 -detach crtscts modem defaultroute

    ```'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# The Linux Network Administrators'' Guide: Chapter 7


    Beside the connect option that specifies the dial-up script, we have added two
    more options to the command line: notdetach, which tells pppd not to detach from
    the console and become a background process. The modem keyword makes it perform
    some modem-specific actions on the serial device, like hanging up the line before
    and after the call. If you don''t use this keyword, pppd will not monitor the
    port''s DCD line, and will therefore not detect if the remote hangs unexpectedly.


    The examples shown above were rather simple; chat allows for much more complex
    chat scripts. One very useful feature is the ability to specify strings to abort
    the chat with an error. Typical abort strings are messages like BUSY, or NO CARRIER,
    that your modem usually generates when the number is busy, or doesn''t pick up
    the phone. To make chat recognize these immediately, rather than timing out, you
    can specify them at the beginning of the script using the ABORT keyword:


    ```

    $ chat -v ABORT BUSY ABORT ''NO CARRIER'' ATZ OK ...

    ```


    In a similar fashion, you may change the timeout value for the chat scripts by
    inserting TIMEOUT options. For details, please check the chat manual page.


    Sometimes, you''d also want to have some conditional execution of parts of the
    chat script. For instance, when you don''t receive the remote end''s login prompt,
    you might want to send a BREAK, or a carriage return. You can achieve this by
    appending a subscript to an expect string. It consists of a sequence of send-
    and expect-strings, which the overall script itself, which are separated by hyphens.
    The subscript is executed whenever the expected string are appended or is not
    received in time. In the example above, we would modify the chat script as follows:


    ```

    ogin:-BREAK- login: ppp sword: GaGarIN

    ```


    Now, when chat doesn''t see the remote system send the login prompt, the subscript
    is executed by first sending a BREAK, and then waiting for the login prompt again.
    If the prompt now appears, the script continues as usual, otherwise it will terminate
    with an error.


    # Debugging Your PPP Setup


    By default, pppd will log all warnings and error messages to syslog. daemon facility.
    You have to add an entry to syslog.conf that redirects this to a file, or even
    the console, otherwise syslog simply discards these messages. The following entry
    sends all messages to /var/log/ppp-log:


    ```

    daemon.* /var/log/ppp-log

    ```


    If your PPP setup doesn''t work at once, looking into this log file should give
    you a first hint of what goes wrong. If this doesn''t help, you can also turn
    on extra debugging output using'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'The Point-To-Point Protocol 103


    the debug option. This makes pppd log the contents of all control packets sent
    or received to syslog. All messages will go to the daemon facility.


    Finally, the most drastic feature is to enable kernel-level debugging by invoking
    pppd with the kdebug option. It is followed by a numeric argument that is bitwise
    OR of the following values: 1 for general debug messages, 2 for printing the contents
    of all incoming HDLC frames, and 4 to make the driver print allout HDLC frames.
    To capture kernel debugging messages, you must either run a syslog daemon that
    reads the /proc/kmsg file, or the klogd daemon. Either of them directs kernel
    debugging to syslog''s kernel facility.


    # IP Configuration Options


    IPCP is used to negotiate a couple of IP parameters at link configuration time.
    Usually, each peer may send an IP Configuration Request packet, indicating which
    values it wants to change from the defaults, and to what value. Upon receipt,
    the remote inspects each option in turn, and acknowledges or rejects it.


    pppd gives you a lot of control over which IPCP options it will try to negotiate.
    You can tune this through various command line options we will discuss below.


    # Choosing IP Addresses


    In the example, we had pppd dial up c3po and establish an IP link. No provisions
    were taken to choose a particular IP address on either end of the link. Instead,
    we picked vlager''s address as the local IP address, and let c3po provide its
    own. Sometimes, however, it is useful to have control over what address is used
    on one or the other end of the link. ppp supports several variations of this.


    To ask for particular addresses, generally use pppd with the following option:


    ```

    local_addr:remote_addr

    ```


    where local_addr and remote_addr may be specified either in dotted quotation or
    as hostnames. (Using hostnames in this option has consequences on CHAP authentication.
    Please refer to the section on CHAP below.) This makes pppd attempt to use the
    first address as its own IP address and the second as the peer. If the peer rejects
    each of them during IPCP negotiation, no IP link will be established. (You can
    allow the peer PPP to override your ideas of IP addresses by giving pppd the ipcp-local
    and ipcp-remote options. Please refer to the manual for details.)


    If you want to set only the local address, but accept any the peer uses, simply
    leave out the remote_addr part. For instance, to make vlager the IP address 130.83.4.27
    instead of its own, you would give it 130.83.4.27 on the command line. Similarly,
    to set the remote address only, you would leave the local_addr field blank. By
    default, pppd will then use the address associated with your hostname.'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'Some PPP servers that handle a lot of client sites assign addresses dynamically:
    Addresses are assigned to systems only when calling in, and are claimed after
    they have logged off again. When dialing up a server, you must make sure that
    pppd doesn''t request a particular IP-address from the server, but rather accepts
    the address the server asks you to use. This means you mustn''t specify a local_addr
    argument. In addition, you have to use the nodefault option, makes pppd wait for
    the peer to provide the IP address instead of using the local host'' address.


    # Routing Through A PPP Link


    After setting up the network interface, pppd will usually set up a host route
    to its peer only. If the remote host is on a LAN, you certainly will be able to
    connect to hosts "behind" your peer as well; that, a network route must be set
    up.


    We have already seen that pppd can be asked to set the default route using the
    defaultroute option. This option is very useful if the PPP server you dialed up
    will act as your Internet gateway.


    The reverse case, where your system acts as a gateway for a single host, is also
    relatively easy to accomplish. For example, take some employee at the Virtual
    Brewery whose home machine is called Loner. When connecting to vager through pppd,
    he uses the proxyarp option, which will install a proxy ARP entry for Loner. This
    will automatically make Loner accessible from all hosts at the Brewery and the
    Winery.


    However, things aren''t always easy as that, for instance, when linking two local
    area networks. This usually requires adding a specific network route, because
    these networks may have their own default routes. Besides, having both peers use
    the PPP link as the default route would generate a loop, when packets to unknown
    destinations would ping-pong between the peers until their time-to-live expired.


    As an example, suppose the Virtual Brewery opens a branch in some other city.
    The subsidiary runs an Ethernet of their own using the IP number 191.72.3.0, which
    is subnet 3 of the Brewery''s class B network. They want to connect to the Brewery''s
    main Ethernet via PPP to update customer databases, and so on. Again, vager acts
    as the gateway; its peer is called sub-eth-a and has an IP address of 191.72.3.1.


    When sub-etha connects to vager, it will make the default route point to vager
    as usual. On vager, however, we will have to install a network route for subnet
    3 that goes through sub-etha. For this, we use a feature of pppd not discussed
    so far—the ip-up command. This is a shell script or program located in /etc/ppp
    that is executed after the PPP interface has been configured. When present, it
    is invoked with the following parameters:


    ```

    ip-up if device speed local addr addr

    ```'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# The Point-To-Point Protocol 105


    where iface names the network interface used, device is the pathname of the serial
    device file (/dev/tty if stdin/stdout are used), and speed is the device''s speed.
    Local_addr remote_addr give the IP addresses at both ends of the link in dotted
    quad notation. In our case, the ip-up script may contain the following code fragment:


    ```

    #!/bin/sh

    case $5 in      # this is sub-etha

    191.72.3.1)      route -add net 191.72.3.0 gw 191.72.3.1;

    esac

    exit 0

    ```


    In a similar fashion, /etc/ppp/ip-down is used to undo all actions of ip-up after
    the PPP link has been taken down again.


    However, the routing scheme is not yet complete. We have set up routing table
    entries on both PPP hosts, so far, all hosts on both networks dont know anything
    about the PPP link. This is not a big problem if all hosts at the subsidiary have
    their default route pointing at sub-etha, and all Brewery hosts to vlager by.
    If this is not the case, your only option will usually be to use a routing daemon
    gate. After creating the network route on vlager, the routing daemon would broadcast
    the new route to all hosts on the attached subnets.


    # Link Control Options


    Above, we already encountered LCP, the Link Control Protocol, which is used to
    negotiate link characteristics and to test the link.


    The two most important options that may be negotiated by LCP are the maximum receive
    unit, and the Asynchronous Control Character Map. There are a number of other
    LCP configuration options, but they are far too specialized to discuss here. Please
    refer to RFC-1548 for a description of these.


    The Asynchronous Control Character Map, colloquially called the async map, is
    used on asynchronous lines such as telephone lines to identify characters that
    must be escaped (replaced by a specific two-character sequence). For instance,
    you may want to avoid the XON and XOFF characters used for software handshake,
    because some modem might choke upon receipt of an XOFF. Other candidates include
    Ctrl+| (the Telnet escape character). PPP allows you to escape any of the characters
    with ASCII 0 through 31 by specifying them in the async map.


    The async map is a bitmap 32 bits wide, with the most significant bit corresponding
    to the ASCII NUL character, and the most significant bit corresponding to ASCII
    31. If a bit is set, it signals that the corresponding character must be escaped
    before sending it across the link. Initially, the async map is set to 0xffffff,
    that is, all control characters will be escaped.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# 106 The Linux Network Administrators'' Guide: Chapter 7


    To tell your peer that it doesn''t have to escape all control characters but only
    a few of them, you can specify a new asyncmap using the asyncmapmap option. For
    instance, if only ^S and ^Q (ASCII 17 and 19, commonly used for XON and XOFF)
    must be escaped, use the following option:


    ```

    asyncmap 0x0000a000

    ```


    The Maximum Receive Unit, or MRU, signals to the peer the maximum size of HDLC
    frames we are to receive. Although this may remind you of the MTU value (Maximum
    Transfer Unit), these two have little in common. The MTU is a parameter of the
    kernel networking device, and describes the maximum frame size the interface is
    to handle. The MRU is more of an advice to the remote end not to generate any
    frames larger than the MRU; the interface must nevertheless be able to receive
    frames of up to 1,500 bytes.


    Choosing MRU is therefore not so much a question of what the link is capable of
    buffering, but what gives you the best throughput. If you intend to run interactive
    applications over the link, setting the MRU to values as low as 296 is a good
    idea, so an occasional larger packet (say, from an FTP session) doesn''t make
    your carrier "jump." To tell pppd to request an MRU of 296, small MRUs, however
    only make sense if you don''t have Vj header compression disabled (it is enabled
    by default).


    pppd understands a couple of LCP options that configure the overall behavior of
    the negotiation process, such as the maximum number of configuration requests
    that may be exchanged before the link is terminated. Unless you know exactly what
    you are doing, you should leave these alone.


    Finally, there are two options that allow lcp echo messages. PPP defines two messages,
    Echo Request and Echo Response. pppd uses this feature to check if a link is still
    operating. You can enable this by the lcp-echo-interval option together with a
    time in seconds. If no frames are received from the remote host within this interval,
    pppd generates an Echo Request, and expects the peer to return an Echo Response.
    If the peer does not produce a response, the link is terminated after a certain
    number of requests sent. This number can be set using the lcp-echo-failure option.
    By default, this feature is disabled altogether.


    # General Security Considerations


    A misconfigured PPP daemon can be a devastating security breach. It can be as
    bad as letting anyone plug in their machine into your Ethernet (and that is very
    bad). In this section, we will discuss a few measures that should make your PPP
    configuration safe.


    One problem with pppd is that to configure the network device and the routing
    table, it requires root privilege. You will usually solve this by running it set
    root. However, pppd allows you to set various security-relevant options. To protect
    against any attacks a user may launch by manipulating these options, it is suggested
    you set a couple of default values'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'in the global /etc/ppp/options file, like those shown in the sample file. Some
    of them, as the authentication options, cannot be overridden by the user, and
    provide a reasonable protection against manipulations.


    Of course, you have to protect yourself from the systems you speak PPP, too. To
    fend off hosts posing as someone, you should always some sort of authentication
    from your peer. Additionally, you should not allow foreign hosts to use any IP
    address they choose, but restrict them to at least a few. The following section
    will deal with these topics.


    # Authentication With PPP

    CHAP Versus PAP


    With PPP, each system may require its peer to authenticate itself using one of
    two authentication protocols. These are the Password Authentication Protocol (PAP)
    and the Challenge Handshake Authentication Protocol (CHAP). When a connection
    is established, each end can request the other to authenticate itself, regardless
    of whether it is the caller or the callee. I will loosely take "client" and "server"
    when I want to distinguish between the authenticating system and the authenticator.
    A PAP daemon can ask its peer for authentication by sending another CHAP configuration
    request identifying the desired authentication protocol.


    PAP works basically the same way as the normal login procedure. The client authenticates
    itself by sending a username and an (optionally encrypted) password to the server,
    which the server compares to its secrets database. This technique is vulnerable
    to eavesdroppers who may try to obtain the password by listening in on the serial
    line and to repeated trial and error attacks.


    CHAP does not have these deficiencies. With CHAP, the authenticator (i.e., the
    server) sends a randomly "challenge" string to the client, along with its hostname.
    The client uses the hostname to look up the appropriate secret, combines it with
    the challenge, and encrypts the string using a one-way hashing function. The result
    is returned to the server along with the client''s hostname. The server now performs
    the same computation, and acknowledges the client if it arrives at the same result.


    Another feature of CHAP is that it doesn''t only require the client to authenticate
    itself at startup time, but sends challenges at regular intervals to make sure
    the client hasn''t been replaced by an intruder, for instance just by switching
    phone lines.


    pppd keeps the secret keys for CHAP and PAP in two separate files, called /etc/ppp/chap-secrets
    and pap-secrets, respectively. By entering a remote host in one or the other file,
    you have a fine control over whether CHAP or PAP is used to authenticate ourselves
    with our peer and vice versa.'
  merge: -1
  img_proc: true
- pgno: 131
  md: "# 108 The Linux Network Administrators' Guide: Chapter 7\n\nBy default, pppd\
    \ doesn't require authentication from the remote, but will agree to authenticate\
    \ requested by the remote. As CHAP is so much stronger than PAP, pppd tries to\
    \ use the former whenever possible. If the peer does not support it, or if pppd\
    \ can't find a CHAP secret for the remote system in its chap-secrets file, it\
    \ reverts to PAP. If it doesn't have a PAP secret for the peer either, will refuse\
    \ to authenticate altogether. As a consequence, the connection is closed down.\n\
    \nThis behavior can be modified in several ways. For instance, when the auth keyword,\
    \ pppd will require the peer to authenticate itself. pppd will agree to use either\
    \ CHAP or PAP for this, as it has a secret for the peer in its CHAP or PAP database,\
    \ respectively. There are other options to turn a particular authentication protocol\
    \ on or off, but I won't describe them here. Please refer to the pppd manual page\
    \ for details.\n\nIf all systems use PPP with agree to authenticate themselves\
    \ with you, you should put the auth option in the global /etc/ppp/options file\
    \ and define passwords for each system in the chap-secrets file. If a system doesn't\
    \ support CHAP, add an entry for it to the pap-secrets file. In this way, you\
    \ make sure no unauthenticated system connects to your host.\n\nThe next two sections\
    \ discuss the two PPP secrets files, pap-secrets and chap-secrets. They are located\
    \ in /etc/ppp and contain triples of clients, servers, and passwords, optionally\
    \ followed by a list of IP addresses. The interpretation of the client and server\
    \ fields is different for CHAP and PAP, and also depends on whether we authenticate\
    \ ourselves the peer, or whether we require the server to authenticate itself\
    \ with us.\n\n# The CHAP Secrets File\n\nWhen it has to authenticate itself with\
    \ some server using CHAP, pppd searches the chap-secrets file for an entry with\
    \ the client field equal to the local hostname, and the server field equal to\
    \ the remote hostname sent in the CHAP challenge. When requiring the peer to authenticate\
    \ itself, the roles are simply reversed: pppd will look for an entry with the\
    \ client field equal to the remote hostname (sent in the client's CHAP response),\
    \ and the server field equal to the local hostname.\n\nThe following is a sample\
    \ chap-secrets file for vlager (the double quotes are not part of the password,\
    \ merely to protect the white space within the password):\n\n```\n# CHAP secrets\
    \ for vlager.vbrew.com\n#\n# client               server                  secret\
    \                  addrs\n#-------------------------------------------------\n\
    vlager.vbrew.com   c3po.lucas.com      \"Use The Source Luke\"   vlager.vbr\n\
    c3po.lucas.com     vlager.vbrew.com    \"Firerun, pasteve\"     c3po.lucas\n \
    \                 vlager.vbrew.com    \"VeryStupidPassword\" pub.vbr.\n```\n\n\
    When establishing a PPP connection with c3po, c3po asks to authenticate itself\
    \ using CHAP by sending a CHAP challenge. pppd then scans chap-secrets for an\
    \ entry with"
