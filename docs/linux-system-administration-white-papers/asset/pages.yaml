    \ PLIP works around this by using the port's\nfive status lines for input, which\
    \ limits it to transferring all data as nibbles (half bytes) only.\nThis mode\
    \ of operation is called mode zero PLIP. Today, these unidirectional ports don't\\\
    seem to be used much anymore. Therefore, there is also a PLIP extension mode 1\
    \ that\nuses the full 8-bit interface.\n\nCurrently, PLIP only supports mode 0.\
    \ Unlike earlier versions of the PLIP code, it now\ntempt to compete with the\
    \ PLIP implementations from Cryryn, as well as the PLIP\ndriver in NCSA (NCSA\
