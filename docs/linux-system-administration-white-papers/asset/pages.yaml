- pgno: 306
  md: '# Chapter 3

    Using Disks And Other Storage Media


    > “On a clear disk you can seek forever.”


    When you install or upgrade your system, you need to do a fair amount of work
    on your disks. You have to make filesystems on your disks so that files can be
    stored on them and reserve space for the different parts of your system.


    This chapter explains all these initial activities. Usually, once you get your
    system set up, you won''t have to go through the work again, except for using
    floppies. You''ll need to come back to this chapter if you add a new disk or want
    to fine-tune your disk usage.


    The basic tasks in administering disks are:


    +   * Format your disk. This does various things to prepare it for use, such as
    checking for bad sectors. (Formatting is nowadays not necessary for most hard
    disks.)


    +   * Partition a hard disk, if you want to use it for several activities that
    aren''t supposed to interfere with one another. One reason for partitioning is
    to store different operating systems on the same disk. Another reason is to keep
    user files separate from system files, which simplifies backups and helps protect
    the system files from corruption.


    +   * Make a filesystem (of a suitable type) on each disk or partition. The disk
    means nothing to Linux until you make a filesystem; then files can be created
    and accessed on it.


    +   * Mount different filesystems to form a single tree structure, either automatically,
    or manually as needed. (Manually mounted filesystems usually need to be unmounted
    manually as well.)


    Chapter 4 contains information about virtual memory and disk caching, of which
    you also need to be aware when using disks.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '284 The Linux System Administrators'' Guide: Chapter 3


    # Two Kinds Of Devices


    Unix, and therefore Linux, recognizes two different kinds of device: random-access
    block devices (such as disks) and character devices (such as tapes and serial
    lines), some of which may be serial and random-access. Each supported device is
    represented in the filesystem as a device file. When you read or write a device
    file, the data comes from or goes to the device it represents. This way no special
    programs (and no special application programming methodology, such as catching
    interrupts or polling a serial port) are necessary to access devices; for example,
    to send a file to the printer, one could just


    ```

    $ cat filename > /dev/lp1

    $

    ```


    and the contents of the file are printed (the file must, of course, be in a format
    that the printer understands). However, since it is not a good idea to have several
    people cat their files to the printer at the same time, one usually uses a special
    program to send the files to the printer (lpr). This program makes sure that only
    one file is being printed at a time, and will automatically send files to the
    printer as soon as it finishes with the previous file. Something similar is needed
    for most devices. In fact, one seldom needs to worry about device files at all.


    Since devices show up as files in the filesystem (in the /dev directory), it is
    easy to see what device files exist, using ls or another suitable command. In
    the output of ls -l, the first column contains the type of file and its permissions.
    For example, inspecting a serial device on my system


    ```

    $ ls -l /dev/cua0

    crw-rw-rw- 1 root      ucp       5 64 Nov 30 1993 /dev/cua0

    $

    ```


    The first character in the first column, i.e., "c" in crw-rw-rw-, above tells
    an informed user the type of file, in this case a character device. For ordinary
    files, the first character is "-"; for directories it is "d", and for block devices
    "b"; see the ls page for further information.


    Note that usually all device files exist even though the device itself might be
    installed. So just because you have a file /dev/sda, it doesn''t mean you really
    have a SCSI hard disk. Having all all device files makes the installation programs
    and, and easier to add new hardware (there is no need to find out the correct
    parameters for and create the device files for the new device).


    # Hard Disks


    This subsection introduces terminology related to hard disks. If you already know
    the names and concepts, you can skip this subsection.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# Using Disks And Other Storage Media


    See Figure 3.1 for a schematic picture of the important parts in a hard disk.
    A hard disk consists of one or more circular platters (the platters are made of
    a hard substance, e.g., aluminum, which gives the disk its name), of either or
    both surfaces are coated with a magnetic substance used for recording the data.
    For each surface, there is a read-write head that examines or alters the recorded
    data. The platters rotate on a common axis; a typical rotation speed is 3,600
    rotations per minute, although high-performance hard disks have higher speeds.
    The heads move along the radius of the platters; this movement combined with the
    rotation of the platters allows the head to access all parts of the surfaces.


    The processor (CPU) and the actual disk communicate through a disk controller.
    This relieves the rest of the computer from knowing how to use the drive, since
    the controllers for different types of disks can be made to use the same interface
    toward the rest of the computer. Therefore, the computer can say "hey disk, gimme
    what I want," instead of a long and complex series of electric signals to move
    the head to the proper location and waiting for the correct position to come under
    the head and doing all other unpleasant stuff. (In reality, the interface to the
    controller is still complex, but much less so than it would otherwise be.) The
    controller can also do some other stuff, such as caching or automatic bad sector
    replacement.


    ![](img/8036a81002f24881cae710bb74d93a7c_308_0.png)'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'The above is usually all one needs to understand about the hardware. There
    is also a bunch of other stuff, such as the motor that rotates the platters and
    the heads, and the electronics that control the operation of the mechanical parts,
    but that is mostly not relevant for understanding the working principle of a hard
    disk.


    The surfaces are usually divided into concentric rings, *tracks*, and in turn
    are divided into sectors. This division is used to specify locations on the hard
    disk and to allow disk space to files. To find a place on the hard disk, one might
    say "surface 3, track 5, sector 7." Usually the number of sectors is the same
    for all tracks, but some hard disks put more sectors in all tracks (all sectors
    are of the same size, so more of them fit in the outer tracks). Typically, a sector
    will handle small amounts of data and the disk itself cannot handle amounts of
    data than one sector.


    Each surface is divided into tracks (and sectors) in the same way. This means
    that the head for one surface is on a track, the heads for the other surfaces
    are also on the corresponding tracks. All the tracks taken together are called
    a cylinder. It takes time to move the heads from one track (cylinder) to another,
    by placing the data that is often accessed (say, a file) so that it is within
    one cylinder, it is not necessary to move the heads to read all of it. This improves
    performance. It is not always possible to place files like this; files that are
    stored in several places on the disk are called *fragmented*.


    The number of surfaces (or heads, which is the same thing), cylinders, and sectors
    vary a lot; the specification of each is called the *geometry* of a hard disk.
    The geometry is usually stored in a special, battery-powered memory location called
    the CMOS RAM, from where the operating system can fetch it during booting or initialization.


    Unfortunately, the BIOS (the BIOS is some built-in software on ROM chips; it takes
    care, other things, the initial stages of booting) has a design limitation, which
    makes it impossible to specify a track number that is larger than 1,024 in the
    CMOS RAM, which is too little for a large hard disk. To overcome this, the hard
    disk controller lies about the geometry and translates the addresses given by
    the computer into something that fits reality. For example a disk might have 8
    heads, 2,048 tracks, and 35 sectors per track. (The numbers are completely imaginary.)


    Its controller could lie to the cylinder and claim that it has 1,024 tracks, and
    35 sectors per track, not exceeding the limit on tracks, and translates the address
    that the computer gives by halving the head number and doubling the track number.
    The math can be more complicated in reality, because the numbers are not as nice
    as here (but again, the details are not relevant for understanding the principle).
    This translation distorts the operating system''s view of how the disk is organized,
    making it impractical to use the all-data-on-one-cylinder trick to boost performance.


    The translation is only a problem for IDE disks. SCSI disks use a sequential sector
    number (i.e., the controller translates a sequential sector number to a head,
    cylinder, and sector triplet), and a completely different method for the CPU to
    talk with the controller, so they'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# Using Disks And Other Storage Media


    are insulated from the problem. Note, however, that the computer might not know
    the real geometry of a SCSI disk either.


    Since Linux often will not know the real geometry of a disk, its filesystems dont
    even try to keep files within a single cylinder. Instead, it tries to assign sequentially
    numbered sectors to files, which almost always give similar performance. The issue
    is further complicated by on-controller caches and automatic prefetches by the
    controller.


    Each hard disk is represented by a separate device file. There can (usually) be
    two or four IDE hard disks. These are known as /dev/hda, /dev/hdb, /dev/hdc, and
    /dev/hdd, respectively. SCSI hard disks are known as /dev/sda, /dev/sdb, and so
    on. Similar naming conventions exist for other hard disk types. Note that the
    device files for the hard disks give access to the entire disk, with no regard
    to partitions (which will be discussed below), and it is easy to miss the partitions
    or the data in them if you are careful. The disks'' device files are usually used
    only to get access to the master boot record (which will also be discussed).


    # Floppies


    A floppy disk consists of a flexible membrane covered on one or both sides with
    magnetic substance as a hard disk. The floppy disk itself doesn''t have a read-write
    head, which is included in the drive. A floppy corresponds to one platter in a
    hard disk, but is removable and one drive can be used to access different floppies,
    whereas the hard disk is one indivisible unit.


    Like a hard disk, a floppy is divided into tracks and sectors (the two corresponding
    tracks on each side of a floppy form a cylinder), but there are fewer of them
    on a hard disk.


    A floppy drive can usually use several types of disks; for example, a 35-inch
    disk can use both 720K and 1.44MB. Since the drive has to operate a bit differently
    and the operating system must know how the disk is, there are many device files
    for floppy drives, one per combination of drive and disk type. Therefore, /dev/fdH01440
    is the first floppy drive (fd0), which must be a 35-inch disk, using a 3.5-inch,
    high-density (HD) of size 1440K (1440), i.e., a normal 3.5-inch HD


    The names for floppy drives are complex, and Linux then automatically detects
    the type of disk in the drive. It works by trying to read the first sector of
    a newly inserted floppy using different floppy types until it finds the correct
    one. This naturally requires that the floppy is formatted first. The automatic
    devices are called /dev/fd0, /dev/fd1, and so on.


    The parameters the automatic device uses to access a disk can also be set using
    the program cmd(setfdprm). This can be useful if you need to use disks that do
    not follow any floppy sizes, e.g., if they have an unusual number of sectors,
    or if the autodetecting for some reason fails and the proper device file is missing.'
  merge: -1
  img_proc: true
- pgno: 311
  md: "# The Linux System Administrators' Guide: Chapter 3\n\nLinux can handle many\
    \ nonstandard floppy disk formats in addition to all the standard\\jones. Some\
    \ of these require using special formatting programs. We'll skip these disk types\n\
    now, but in the meantime we can examine the /etc/fdpm file. It specifies the settings\n\
    \ setfdpm recognizes.\n\nThe operating system must know when a disk has been changed\
    \ in a floppy drive, for ex-\\ample, in order to avoid using cached data from\
    \ a previous disk. Unfortunately, the signal\nline that is used for this is sometimes\
    \ broken, and worse, it won't always be noticeable\nwhen using the drive from\
    \ within MS-DOS. If you are experiencing weird problems using\nfloppies, this\
    \ might be the reason. The only way to correct it is to repair the floppy drive.\n\
    \n# CD-ROMs\n\nA CD-ROM drive uses an optically read, plastic-coated disk. The\
    \ information is recorded\non the surface of the disk (that is, the surface of\
    \ the disk, on the metal disk inside the\n(coating) using \"holes\" aligned along\
    \ a spiral from the center to the edge. The drive\ndirects a laser beam the spiral\
    \ to read the disk. When the laser hits a hole, the laser is\nreflected in one\
    \ way; when it hits smooth surface, it is reflected in another way. This makes\n\
    it easy to code bits, and therefore information. The rest is easy, mere mechanics.\n\
    \nCD-ROM drives are slow compared to hard disks. While a typical hard disk will\
    \ have an\naverage seek time less than 15 milliseconds, a fast CD-ROM drive can\
    \ use tenths of a sec-\\ond for. The actual data transfer rate is fairly high\
    \ at hundreds of kilobytes per second.\nThe slowness means CD-ROM drives are not\
    \ as pleasant to use instead of hard disks\n(Linux distributions provide \"live\"\
    \ systems on CD-ROMs, making it unnecessary\nto copy the files to the hard disk,\
    \ making installation easier and saving lot of hard disk\nspace), although it\
    \ is still possible. For installing new software, CD-ROMs are very good,\ns maximum\
    \ speed is not essential during installation.\n\nThere are several ways to arrange\
    \ data on a CD-ROM. The most popular one is specified\by the international ISO\
    \ 9660. This standard specifies a very minimal filesystem,\nis is even more crude\
    \ than the MS-DOS uses. On the other hand, it is so minimal\nthat every operating\
    \ system should be able to map it to its native system.\n\nFor normal Unix, the\
    \ ISO 9660 filesystem is not usable, as an extension to the standard\nh been developed,\
    \ called the Rock Ridge extension. Rock Ridge allows longer file names,\nsymbolic\
    \ links, and a lot of other details, making a CD-ROM look more or less like\n\
    temporary Unix filesystem. Even better, a Rock Ridge filesystem is still a valid\
    \ ISO 9660\nfilesystem, making it usable by non-Unix systems as well. Rock Ridge\
    \ supports both ISO 9660\nd the Rock Ridge extensions, the extensions are recognized\
    \ and used automatically.\n\nThe filesystem is only half the battle, however.\
    \ Most CD-ROMs contain data that requires\na special program to access, and most\
    \ of these programs do not run under Linux (except,\npossibly, under dosemu, the\
    \ Linux MS-DOS emulator."
  merge: -1
  img_proc: true
- pgno: 312
  md: '# Using Disks And Other Storage Media


    A CD-ROM drive is accessed via the corresponding device file. There are several
    ways to connect a CD-ROM drive to the computer: via SCSI, via a sound card, or
    via EIDE. The hardware decking needed to do this is outside the scope of this
    book, but the type of connection decides the device file.


    # Tapes


    A tape drive uses a tape, similar (but completely different, of course) to cassettes
    used for music. A tape is serial in nature, which means that in order to get to
    any given part of it, you first have to go through all the parts in between. A
    disk can be accessed randomly, i.e., you can jump directly to any place on the
    disk. The serial access of tapes makes them slow.


    On the other hand, tapes are relatively cheap to make, since they do not need
    to be fast. They can easily be quite long, and can therefore contain a large amount
    of data. This makes tapes very suitable for things like archiving and backups,
    which do not require large speeds, but benefit from low costs and large storage
    capacities.


    # Formatting


    Formatting is the process of writing marks on the magnetic media that are used
    to mark tracks and sectors. Before a disk is formatted, its magnetic surface is
    a complete mess of magnetic signals. When it is formatted, some order is brought
    into the chaos by essentially drawing lines where the tracks go, and where they
    are divided into sectors. The actual details are not quite exactly like this,
    but that is irrelevant. What is important is that a disk cannot be used unless
    it has been formatted.


    The terminology is a bit confusing: In MS-DOS, the word formatting is used to
    cover also the process of creating a filesystem (which will be discussed below).
    The, the two processes are often combined, especially for floppies. When the distinction
    needs to be, the real formatting is called low-level formatting, while making
    the filesize is called high-level formatting. In Unix circles, the two are called
    formatting and making a filesystem, so that''s what is used in this book as.


    For IDE and SCSI disks the formatting is actually done at the factory and doesn''t
    need to be repeated; most people rarely to worry about it. In fact, formatting
    a hard disk can cause it to work well, for example because a disk might need to
    be formatted in very special way to allow automatic bad sector replacement to
    work.


    Disks that need to or be formatted often require a special program away, because
    the interface to the formatting logic inside the drive is different from drive
    to drive. The formatting program is either one inside the controller BIOS, or
    is supplied as an MS-DOS program; neither of these easily used from within Linux.


    During formatting one might encounter bad spots on the disk, called bad blocks
    or bad sectors. These are sometimes handled by the drive itself, but even then,
    if more of them develop,'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'something needs to be done to avoid using parts of the disk. The logic to do
    this is built into the filesystem; how to add the information into the filesystem
    is described below. Alternatively, one might create a small partition that covers
    the bad part of the disk; this approach might be a good idea if the bad spot is
    very large, since filesystems can sometimes have trouble with very large areas.


    Floppies are formatted with fdformat. The floppy disk file to use is given as
    the parameter. For example, the following command would format a high-density,
    3.5-inch floppy in the first floppy drive:


    ```

    $ fdformat /dev/fd0H1440

    Double-sided, 80 tracks, 18 sec/track. Total capacity 1440 kB.

    Formatting ... done

    Verifying ... done

    $

    ```


    Note that if you want to use an autodetecting device (e.g., /dev/fd0), you must
    set the parameters of the device with setfdpm first. To achieve the same effect
    as above, one would have to do the following:


    ```

    $ setfdprm /dev/fd0 1440/1440

    $ fdformat /dev/fd0

    Double-sided, 80 tracks, 18 sec/track. Total capacity 1440 kB.

    Formatting ... done

    Verifying ... done

    $

    ```


    It is usually more convenient to choose the correct device file that matches the
    type of the floppy. Not is unwise to format floppies to contain more information
    than what they are designed for.


    fdformat will also validate the floppy, i.e., check for bad blocks. It will try
    a bad block several times (you can usually that here, the drive noise charges
    dramatically). If the floppy is only marginally bad (due to dirt on the read-write
    head, some errors are false signals), fdformat will not complain, a real error
    will abort the validation process. The kernel will print log messages for each
    I/O error it finds; these will go to the console, or if syslog is used, to the
    file /usr/log/messages. fdformat itself won''t tell where the error is (one usually
    doesn''t care; floppies are cheap enough that a bad one is automatically thrown
    away).


    ```

    $ fdformat /dev/fd0H1440

