    Also, the way traditional NIS decides if and how to merge NIS information with
    that from the local files deviates from that used by NYS. For instance, to use
    the NIS password maps, you have to include the following line somewhere in your
    /etc/passwd map:


    ```

    +:::::::::

    ```


    This marks the place where the password lookup functions "insert" the NIS maps.
    Inserting a similar line (minus the last two colons) into /etc/group does the
    same for the group.* maps. To use the hosts.* maps distributed by NIS, change
    the order line in the host.conf file. For instance, if you want to use NIS, DNS,
    and the /etc/hosts file (in that order), you need to change the line to:


