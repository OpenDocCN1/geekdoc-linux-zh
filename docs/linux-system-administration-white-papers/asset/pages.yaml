    # Running NIS Server


    After so much theoretical techno-babble, it''s time to get our hands dirty with
    actual configuration work. In this section, we will cover the configuration of
    a NIS server. If there''s already a NIS server running on your network, you won''t
    have to set up your own server; in this case, you may easily skip this section.


    Note

    If you are just going to experiment with the server, make sure you don''t set
    it up for a NIS domain that is already in use on your network. This might disrupt
    the entire network service and make a lot of people very unhappy and very angry.


    There are currently two NIS servers freely available for Linux, one contained
    in Tobias Reber''s yps package, and the other in Peter Eriksson''s yps package.
    It shouldn''t matter which one you use NIS or the standard NIS client code that
    is in libc. At the time of this writing, the code for the handling of NIS slave
    servers seems to be more complete in yps. So if you have to deal with slave servers,
    yps might be a better choice.


    The next section explains how to configure the NIS client code. If your setup
    doesn''t work, you should try to find out any requests arrive at your server or
    not. If you specify the -D command line flag to the NYS server, it prints debugging
    messages to the console about all incoming NIS queries, and the results returned.
    These should give you a hint as to where the problem lies.


    # Setting Up An NIS Client With NYS


    Throughout the remainder of this chapter, we will cover the configuration of an
    NIS client.


    Your first step should be tell NIS which server to use for NIS service, setting
    it in the /etc/yp.conf configuration file. A very simple sample file for a host
    on the Winery''s network may look like this:


    ```

    # /etc/yp.conf - ybind configuration file

    # Valid entries are

    #

    domain NISDOMAIN server HOSTNAME

    ```'
