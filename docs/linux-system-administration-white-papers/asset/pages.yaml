  md: 'release as of writing is version 3.3.7. It has been patched very heavily by
    a number of people, so that you can''t speak of the dip program anymore. These
    different strains of devel-opment hopefully be merged in a future release.


    dip provides an interpreter for a simple scripting language that can handle the
    modem for you, convert the line to SLIP mode, and configure the interfaces. This
    is rather primitive and restrictive, but sufficient for most cases. A new release
    of dip may feature a more versatile-language one day.


    To be able to configure the SLIP interface, dip requires root privilege. It would
    now be tempting to make dip set root, so that all users can dial up some SLIP
    server without giving them root access. This is very dangerous, setting up bogus
    interfaces and default routes with dip may disrupt routing on your network badly.
    Even worse, this will give your users the power to connect to any SLIP server
    and launch dangerous attacks on your network. If you want to allow your users
    to fire up a SLIP connection, small wrapper programs for each prospective SLIP
    server, and have these wrappers dip with the specific script that establishes
    the connection. These programs can then safely be made set root. (diplogin can
    and must be rerun, too. See the section at the end of this chapter.) Listing 6.1
    contains a sample dip script.


    # Listing 6.1 A dip script for dialing cowslip


    ```

    # Sample dip script for dialing cowslip

    # Set local and remote name and address

    get $local vlager

    get $remote cowslip


    port cua3           # choose a serial port

