    names will be introduced. Drivers for IPX (Novell''s networking protocol) and
    AX.25 (used

    by radio amateurs) are under development, but are at alpha stage still.


    During the following sections, we will discuss the details of using the drivers
    described above.


    # Ethernet Installation


    The current network code supports various brands of Ethernet cards. Most drivers
    were

    written by Donald Becker (beckercesdis.gsfc.nasa.gov), who authored a family of
    drivers

    for cards based on the National Semiconductor 8390 chip; these have become known
    as the

    Becker series drivers. There are also drivers for a couple of products from D-Link,
    among'
  merge: -1
