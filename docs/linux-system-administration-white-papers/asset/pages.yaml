- pgno: 248
  md: '# Expiring News


    In Bnews, expired used as arguments, along with a time specification after performed
    by a program called expire, which took a list of newsgroups as arguments, after
    which articles had to be expired. To have different hierarchies expired at different
    times, you had to write a script that invoked expire for each of them separately.
    C-News offers a more convenient solution to this: In a file called explist, you
    may specify newsgroups and expiration intervals. A command called expire is usually
    run once a day from cron, and processes all groups according to this list.


    Occasionally, you may want to retain articles from certain groups even after they
    have been expired; for example, you may want to keep groups posted to comp.sources.unix.
    This is called archiving: explist permits you to mark groups for archiving.


    An entry in explist looks like this:


    ```

    grouplist times archive

    ```


    Grouplist is a comma-separated list of newsgroups to which the entry applies.
    Hierarchies may be specified by giving the group prefix, optionally appended with
    all. For example, for an entry applying to all groups below comp.os, you might
    either enter comp.os or comp.os.all in grouplist.


    When expiring news from a group, the name is checked against all entries in explist
    in the order given. The first matching entry applies. For example, to throw away
    the majority of a group after four days, except for comp.os.linux.announce which
    you want to keep for a week, you simply have an entry for the latter, which specifies
    a seven-day expiration period, followed by that comp, which specifies four days.


    The perm field details if the entry applies to moderated to moderated, unmoderated,
    or any groups. It may take the values m, u, or x, which denote moderated, unmoderated,
    or any type.


    The third field, usually contains only a single number. This is the number of
    days after which articles will be expired if they haven''t been assigned an artificial
    expiration date in an Expires: field in the article header. Note that this is
    the number of days counting from its arrival at your site, not date of posting.


    The times may, however, be more complex than that. It may be a combination of
    up to three numbers, separated from one another by a dash. The first denotes the
    number of days that have to pass before the article is considered a candidate
    for expiration. It is rarely useful to use a value other than zero. The second
    field is the above-mentioned default number of days after which it will be expired.
    The third is the number of days after an article will be expired unconditionally,
    regardless of whether it has an Expires: field or not. If only the middle number
    is given, the other two take default values. These may be specified using the
    special entry /bounds/, which is described below.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# The Linux Network Administrators'' Guide: Chapter 16


    The fourth field, archive, denotes whether the newsgroup is archived and where.
    If no archiving is intended, a dash should be used. Otherwise, you either use
    a full name (pointing to a directory), or a sign (@). The sign denotes the default
    archive directory which must be given to expire using the -a flag on the command
    line. An archive directory should be owned by news. When expire archives an article
    from, say, comp.sources.unix, it stores in the directory comp/sources/unix below
    the archive directory, creating it if not exist. The archive directory itself,
    however, will not be created.


    There are two special entries in your explist file that expire relies on. Instead
    of a list of newsgroups, which has the keywords /bounds/ and /expired/. /bounds/
    entry counts the default values for the three times of the file described above.


    The /expired/ field determines how long C-News will hold on lines in the history
    file. This is needed because C-News will not remove a line from the history file
    once the corresponding article(s) has expired, but will hold on in case a duplicate
    should arrive after this date. If you are fed by only one site, you can keep this
    value small. Otherwise, a couple of weeks is advisable on UUCP networks, depending
    on the delays you experience with articles from these sites.


    A sample explist file with right expiry intervals is reproduced below:


    ```

    # keep history lines for two weeks. Nobody gets more than three mont

    /expired/               x   14

    /bounds/               x   0-1-90


    # groups we want to keep longer than the rest

    comp.sources.announce m   10 -

    comp.sources.linux      x   5 -

    alalt.folklore.computers  u   10 -

    rec.humor.oracle       m   10 -

    soc.feminfism          m   10 -


    # Archive *.sources groups

    comp.sources.alt.sources x   5  @ .


    # defaults for tech groups

    comp.sci                x   7 -


    # enough for a long weekend

    misc.talk               x   4 -


    # throw away junk quickly

    junk                   x   1 -


    # Archive *.sources groups

    comp.sources.alt.sources x   5  @

    ```'
  merge: -1
  img_proc: true
