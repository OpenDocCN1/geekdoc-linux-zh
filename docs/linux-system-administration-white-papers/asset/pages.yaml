- pgno: 100
  md: 'cache—takes a domain and a file name as arguments. This file contains the server
    hints, that is a list of records pointing to the root name servers. Only NS and
    A records will be recognized. The domain argument is generally the root domain
    name “. This information is crucial to named: If the cache statement does not
    occur in the boot file, named will not develop a local cache at all. This will
    severely degrade performance and increase network load if the next server queried
    is not on the local network. Moreover, named will not be able to reach any root
    name servers, and thus won''t resolve any addresses except it is authoritative.
    An exception to this rule is when using forwarding servers (cf. the forwarders
    option below).


    +   forwards—This statement addresses an address list as an argument. The IP addresses
    in this list specify a list of name servers named may query if it fails to resolve
    a query from its local cache. They are tried in order until one of them responds
    to the query.


    +   slave—This statement makes the server a slave server. That is, it will never
    perform recursive queries itself, but only forwards to servers specified with
    the forwards


    There are two options which we will not describe here, sortlist and domain. Additionally,
    there are two directives that may be used inside the zone database files. These
    are $INCLUDE and $ORIGIN. Since they are rarely needed, we will not describe them
    here,


    # The DNS Database Files


    Master files indexed by named, named.hosts, always have a domain associated with
    them commands, which is called the origin. This is the domain name specified with
    the cache and primary commands. Within a master file, you are allowed to specify
    domain and hostnames relative to this domain. A name given in a configuration
    file is considered absolute if it ends in a single dot, otherwise it is considered
    relative to the origin. The origin by itself may be referred to using "".


    All data in a master file is split into resource records, or RRs for them. They
    make up the smallest unit of information available through DNS. Each resource
    record has a type. A records, for instance, map a hostname to an IP address, and
    a CNAME record associates an alias for it with its official hostname. As an example,
    take a look at Listing 5.1 (on page 30), which shows the named.hosts master file
    for the virtual brewery.


    Resource record representations in master files share a common format, which is


    ```

    [domain] [ttl] [class] type data

    ```


    Fields are separated by spaces or tabs. Any entry may be continued across several
    lines if an opening brace occurs before the first new line, and the last field
    is followed by a closing brace. Between a semicolon and a new line is ignored.


    +   domain—This is the domain name to which the RR applies. If no domain name
    is given, the RR is assumed to apply to the domain of the previous RR.'
