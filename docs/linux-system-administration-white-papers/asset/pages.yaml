  md: '# 110 The Linux Network Administrators'' Guide: Chapter 7


    an authenticate request, pppd uses the entry that has a server field equal to
    the local hostname, and a user field equal to the user name sent in the request.
    When authenticating itself with the peer, pppd picks the secret to be sent from
    the line with the user field equal to the local user name, and the server field
