    for

    SLIP becomes sl0; the kernel supports up to four SLIP interfaces.

    - ppp—The n-th PPP interface. Like SLIP interfaces, a PPP interface is associated

    with a serial line once it is converted to PPP mode. At the moment, up to four
    interfaces

    are supported.

    - plip—The n-th PLIP interface. PLIP transports IP datagrams over parallel lines.
    Up to

    three PLIP interfaces are supported. They are allocated by the PLIP driver at
