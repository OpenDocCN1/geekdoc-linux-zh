- pgno: 146
  md: 'An entry consists of a hostname, optionally followed by a username. If a hostname
    appears all by itself, all users from that host will be admitted to their local
    accounts without any checks. In the above example, Janet would be allowed to log
    into her account “janet” when coming from Gauss, and the same applies to any other
    user except root. If Janet wants to log in as Joe, she will be prompted for a
    password as usual.


    If a hostname is followed by a username, as in the last line of the above sample
    file, this user is given password-free access to all accounts except the root
    account.


    The hostname may also be preceded by a minus sign, as in the entry “public”. This
    requires authorization for all accounts on public, regardless of what rights individual
    users grant in their .hosts file.


    The format of the .hosts file is identical to that of hosts.equiv, but its meaning
    is a little different. Consider Joe''s .hosts file on Euler:


    ```

    chomp.cs.grouchou.edu

    gauss

    janet

    ```


    The first entry grants Joe free access when logging in from chomp.cs.grouchou.edu,
    but does not affect the rights of any other account on Euler or Chomp. The second
    entry is a slight variation of this, in that it grants Janet free access to Joe''s
    account when logging in from Gauss.


    Note that the client''s hostname is obtained by reverse mapping the caller''s
    address to a name, so that this feature will fail with hosts unknown to the resolver.
    The client''s hostname is considered to match the hostname in the hosts files
    in one of the following cases:


    +   - The client''s canonical hostname (not an alias) literally matches the hostname
    in the file.

    - If the client''s hostname is a fully qualified domain name (such as returned
    by the resolver when you have DNS running), and it doesn''t literally match the
    hostname in the hosts file, it is compared to that hostname extended with the
    local domain name.


    > Note The r commands are an incredibly bad idea to enable. SSH does strong encryption
    and user authentication, and should almost always be used instead. Unfortunately,
    because of U.S. government crypto policy, U.S. Linux distributions can’t include
    software like SSH on their CDs.'
