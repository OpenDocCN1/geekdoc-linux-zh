    # Article Batching


    News batches follow a particular format which is the same for Bnews, C-News, and
    IN. Each article is preceded by a line like this:


    ```

    # rnews count

    ```


    where count is the number of bytes in the article. When batch compression is used,
    the resulting file is compressed as a whole, and preceded by another line, indicated
    by the message to be used for unpacking. The standard compression tool is compress,
    which is marked by


    ```

    # Cunbatch

    ```


    Sometimes, when sending batches via mail software removes the eighth bit from
    all data, a compressed batch may be protected using what is called c7-encoding;
    these batches will be marked by c7batch.


    When a batch is fed to rnews on the remote site, it checks for these markers and
    processes the batch appropriately. Some sites also use other compression tools,
    like gzip, and precede their gzipped files with zbatch instead. C-News does not
    recognize nonstandard headers like these; you have to modify the source to support
    them.'
