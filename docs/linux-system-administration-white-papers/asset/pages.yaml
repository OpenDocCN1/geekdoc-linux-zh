- pgno: 180
  md: 'The modem chat begins with uucico, the empty string. uucico will thereafter
    send the first command (ATZ) right away. ATZ is the Hayes command to reset the
    modem. It then waits until the modem has sent OK, and sends the next command,
    which turns off local echo, and the like. After the modem returns OK again, uucico
    sends the dialing command (ATDT). The escape sequence T in this string is replaced
    with the phone number taken from the system entry file. uucico waits for the modem
    to return the string CONNECT, which signals that a connection with the remote
    modem has been established successfully.


    Often, the modem fails to connect to the remote system, for instance, if the other
    system is talking to someone else and the line is busy. In this case, the modem
    will return some error message indicating the reason. Modem chats are not able
    to detect such messages; uucico will continue to wait for the expected string
    until it times out. The UUCP log file will therefore only show a bland "timed
    out in chat script" instead of the true reason.


    However Taylor UUCP allows you to tell uucico about these error messages using
    the chatfail command command as shown above. When uucico detects a chat-fail string
    while executing the modem chat, it aborts the call, and logs the error message
    in the UUCP log file.


    The last command in the example shown above tells UUCP to toggle the DTR line
    before starting the modem chat. Most modems can be configured to go on-hook when
    detecting a change on the DTR line, and enter command mode.


    > Note

    You can also configure some modems to reset themselves when detecting a transition
    on DTR. Some of them, however, don''t seem to like this, and occasionally get
    hung.


    # UUCP Over TCP


    Absurd as it may sound at the first moment, using UUCP to transfer data over TCP
    is not that bad idea, especially when transferring large amount of data as Usenet
    news. The TCP-based links, news is generally exchanged using the NNTP protocol,
    where articles are requested and sent individually, without compression or any
    other optimization. This technique is quite unfavorable for small sites with frequent
    newsfeeds, that receive their news over a slow connection, such as ISDN. Sites
    will usually want to combine the qualities of TCP with the advantages of sending
    news in large batches, which can be compressed and transferred with very low overhead.
    A standard way to transfer these batches is to use UUCP over TCP.


    # Using A Direct Connection


    Assume you use a direct line connecting your system vstout to. Very much like
    in the modem case, you have to write a system entry in the sys file. The port
    command identifies the serial port tiny is hooked up to.'
