- pgno: 136
  md: '# Chapter 8


    # Various Network Applications


    After successfully setting up IP and the resolver, you have to turn to the services
    you want to provide over the network. This chapter covers the configuration of
    a few simple network applications, including the inetd server, and the programs
    from the login family. The Remote Procedure Call interface that services like
    the Network File System (NFS) and the Network Information System (NIS) are based
    on will be dealt with briefly, too. The configuration of NFS and NIS, however,
    takes up more room, and will be described in separate chapters. This applies to
    electronic mail and networks as well.


    Of course, we can''t cover all network applications in this book. If you want
    to install one that''s not discussed here, please refer to its manual pages for
    details.


    # the inetd Super-Server


    Frequently, services are performed by so-called daemons. A daemon is a program
    that opens a certain port and waits for incoming connections. If one occurs, it
    creates a child process which accepts the connection, while the parent continues
    to listen for further requests. This concept has the drawback that for every service
    offered, a daemon has to run that listens on the port for a connection to occur,
    which generally means a waste of system resources like swap space.


    Thus, almost all installations run a "super-server" that creates sockets for a
    number of services, and listens on all of them simultaneously using the select(2)
    system call. When a remote host'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# 114 The Linux Network Administrators'' Guide: Chapter 8


    requests one of the services, the super-server notices this and spawns the server
    specified for this port.


    The super-server commonly used is inetd, the Internet Daemon. It is started at
    system boot time, takes the list of services it is to manage from a startup file
    /etc/inetd.conf. In addition to those servers invoked, there are a number of trivial
    services that are performed by inetd itself called internal services. They include
    "chargen" which simply generates a string of characters, and "daytime" which returns
    the system''s idea of time of day.


    An entry in this file consists of a single line made up of the following fields:


    service type protocol user server cmdline


    The meaning of each field is outlined in Table 8.1.


    | Table 8.1 Field definitions. |

    | --- | --- |

    | service | Gives the service name. The service name has to be translated to a
    port number by looking it up in the /etc/services file. This file will be described
    in Chapter 10. |

    | type | Specifies a socket type, either stream (for connection-oriented protocols)
    or dgram (for datagram protocols). TCP-based servers should therefore always use
    stream, while UDP-based servers should use dgram. |

    | protocol | Names the transport protocol used by the service. This may be a valid
    protocol name found in the protocols file, also explained below. |

    | wait | This option applies only to dgram sockets. It may be wait or nowait.
    If wait is specified, inetd will only execute one server for the specified port
    at any time. Otherwise, it will immediately continue to listen on the port after
    executing the server. This is useful for "single-threaded" servers that read all
    incoming datagrams until no more, and exit then. Most RPC servers are of this
    type and should specify wait. The opposite type, "multithreaded", servers, allow
    an unlimited number of instances to run concurrently; this is rarely used. These
    servers should specify nowait. Stream sockets always use nowait. |

    | user | This is the login ID of the process being executed. This will frequently
    be the root user, but some services may use different accounts. It is a very good
    idea to apply the principle of least privilege, which states that you shouldn''t
    run a command under a privileged account if the program doesn''t require it for
    proper functioning. For example, the NNTP server will run as news, while services
    that may pose a security risk (such as tftp or finger) are run as nobody. |

    | server | Gives the full name of the program to be executed. Internal services
    are marked by the kernel internal. |

    | cmdline | This is the command line to be passed to the server. This includes
    argument 0, that is, the command name. Usually, this will be the program name
    of the server, unless the program behaves differently when invoked by a different
    name. This field is empty for internal services. |'
  merge: -1
  img_proc: true
