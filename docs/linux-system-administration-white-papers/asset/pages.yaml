    To protect your UUCP users from callers giving a false system name and snarfing
    all their mail, you should add called-login commands to each system entry in the
    sys file. This is described above.


    # Protecting Yourself against Swindlers


    One of the biggest problems about UUCP is that the calling system can lie about
    its name; it announces itself to the called system after logging in, but the server
    doesn''t have a way to check this. Thus, an attacker could log into his or her
    own UUCP account, pretend to be someone else, and pick up that other site''s mail.
    This is particularly troublesome if you offer login via anonymous UUCP, where
    the password is made public.


    Unless you can trust all sites that call your system to be honest you must guard
    against this sort of impostor. The cure against this disease is to require each
    system to use a particular login name by specifying a called-login in sys.


    The upshot of this is that whenever a system logs in and pretends to be Pablo,
    uucico will check whether it has logged in Upablo. If it hasn''t, the calling
    system will be turned down, and the connection is dropped. You should make it
    a habit to the called-login command to add every system entry to your sys file.
    It is important that you do this for all systems, regardless of whether they will
    ever call your site or not. For those that never call you, you should probably
    set called-login to some totally bogus username, such as neverlogin.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# Be Paranoid: Call Sequence Checks


    Another way to fend off and detect call impostors is to use call sequence checks.
    Call sequence checks help you protect against intruders that somehow managed to
    find out the password you log into your UUCP system with.


    When using call sequence checks, both machines keep track of the number of connections
    established so far. It is incremented with each connection. After logging in,
    the callee sends its sequence number, and the caller checks it against its own
    number. If they don''t match, the connection attempt will be rejected. If the
    initial number is chosen at random, attackers will have a hard time guessing the
    correct sequence number.


    But call sequence checks do more for you than this: Even if some very clever person
    should detect your call sequence number as well as your password, you will find
    this out. When the attacker calls your UUCP feed and steals your mail, this will
    increase the feeds call sequence number by one. The next time you call your feed
    and try to log, the remote uuico will refuse, because the numbers don''t match!


    Next, you have to create the file containing the sequence number identifier. Taylor
    UUCP keeps the sequence number in a file called Sequence. In the remote site''s
    spool directory. It must be owned by uucp, and must be mode 600 (i.e., readable
    and writable only by uucp). It is best to initialize this file with an arbitrary,
    agreed-upon value. Otherwise, an attacker might manage to guess the number by
    trying out all values smaller than, say, 60.


    Of course, the remote site must have enable call sequence checks as well, and
    start by using exactly the same number as you.


    # Anonymous UUCP


    If you want to provide anonymous UUCP access to your system, you first have to
    set up a special account for it as described above. A common practice is to give
    it a login name and a password of uucp.


    In addition, you have to set a few of the security options for unknown systems.
    For instance, you may want to prohibit these parameters from executing any commands
    on your system. However, you cannot set these parameters in a sys file entry,
    the system requires the system''s name, which you don''t have. Taylor UUCP solves
    this dilemma through the unknown command. unknown can be used in the config file
    to specify any command that can usually appear in a system entry.'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'Managing Taylor UUCP 163


    This will restrict unknown systems to downloading files from below the pub directory
    and uploading files to the incoming directory /var/spool/uucpublic. The next line
    will make uucico any request from the remote system to turn on debugging locally.
    The last two lines permit unknown systems to execute *rmail*; the command path
    makes uu own look for the *rmail* command in a private directory named anon-bin
    only. This allows you to provide some special *rmail* that, for instance, all
    mail to the super-user for examination. This allows anonymous users to reach the
    maintainer of the system, but prevents them at the same time from injecting mail
    to other sites.


    To enable anonymous UUCP, you must specify at least one unknown statement in config.
    Otherwise uuucp will reject any unknown systems.


    # UUCP Low-Level Protocols


    To negotiate session control and file transfers with the remote end, uuico uses
    a set of standardized messages. This is often referred to as the high-level protocol.
    During the initialization phase and the hang phase these are simply sent as strings.
    However, during the real transfer phase, an additional low-level protocol is employed
    that is mostly transparent to the higher levels. This is to make error checks
    possible when using unreliable lines, for instance.


    # Protocol Overview


    As UUCP is used over different types of connections, as serial lines or TCP, or
    even X.25, specific low-level protocols are needed. In addition, several implementations
    of UUCP have introduced different protocols that roughly do the same thing.


    Protocols are divided into two categories: streaming and packet-oriented protocols.
    Protocols of the latter vary transfer a file as whole, possibly computing a checksum
    over it. This is nearly free of any overhead, requires a reliable connection,
    because any error will cause the file to be retransmitted. These protocols are
    commonly used over TCP connections, but are not suitable for over telephone lines.
    Although modern modems do quite a good job at error correction, they are not perfect,
    nor is there any error detection between your computer and the modem.


    On the other hand, packet protocols split the file into several chunks of equal
    size. Each packet is sent and received separately, a checksum is computed, and
    an acknowledgment is returned to the sender. To make this more efficient, sliding-window
    protocols were invented, which allow for a limited number (window) of outstanding
    acknowledgments at any time. This greatly reduces the time uuucico has to wait
    for a transmission. Still, the relatively large overhead compared to a streaming
    protocol make packet protocols inefficient for over TCP.


    The width of the path also makes a difference. Sometimes, sending eight-bit characters
    over a serial connection is impossible, for instance, if the connection goes through
    a stupid'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# 164 The Linux Network Administrators'' Guide: Chapter 11


    terminal server. In this case, characters with the eighth-bit set have to to be
    quoted over transmission. When you transmit eight-bit characters over a seven-bit
    connection, they have to be under worst-case assumptions; this doubles the amount
    of data to be transmitted, although compression done by the hardware may compensate
    for this. Lines that can transmit arbitrary eight-bit characters are usually called
    eight-bit clean. This is the case for all TCP connections, as well as for most
    modern connections.


    # Tuning The Transmission Protocol


    All protocols allow for some variation in packet sizes, timeouts, and the like.
    Usually, the defaults worked well under standard circumstances, but may not be
    optimal for your situation. The g protocol, for instance, uses window sizes from
    1 to 7, and packet sizes in powers of 2 from 64 through 4,096. (Most binaries
    in distributions default to a window size of 7 and 128-byte packets.) If your
    phone line is usually noisy that it drops more than 5 percent of all packets,
    you should probably lower the packet size and shrink the window. On the other
    hand, on very good telephone lines the overhead of sending ACKs for every 128
    bytes may prove wasteful, so that you might increase the packet size to 512 or
    even 1,024.


    Taylor UUCP provides a mechanism to suit your needs by tuning parameters with
    the protocol-parameter command in the sys file.


    The tunable parameters and their names vary from protocol to protocol. For a complete
    list of protocols, please refer to the documentation enclosed in the Taylor UUCP
    source.


    # Selecting Specific Protocols


    Not every implementation of uucico peaks and understand each protocol, so during
    the initial handshake phase, both processes have to agree on a common protocol.
    The master uucico offers the slave a list of supported protocols by Pprotlist,
    from which the slave may pick one.


    Based on the type of port used (modem, TCP, or direct), uucico will compose a
    default list of protocols. For modem and direct connections, this list usually
    comprises i, a, g, G, and j. For TCP connections, the list is t, e, i, a, G, j,
    and f. You can override this default list with the protocols command, which may
    be specified in a system entry as well as a port entry.


    This will require any incoming or outgoing connection through this port to use
    i, g, or G. If the remote system does not support any of these, the conversation
    will fail.


    # Troubleshooting


    This section describes what may go wrong with your UUCP connection, and makes
    suggestions where to look for the error. However, the questions were compiled
    off the top of my head. There''s much more that can go wrong.'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'In any case, enable debugging with -x, and take a look at the output in Debug
    the spool directory. It should help you quickly recognize where the problem lies.
    Also, I have always found it helpful to turn on my modem''s speaker when it didn''t
    connect. With Hayes-compatible modems, this is accomplished by adding “ATLIMIT
    OK” to the modem in the dial file.


    The first check always should be whether all file permissions are correctly set.
    uucico should be setuid uucp, and all files in /usr/lib/uucp,/var/spool/uucp,
    and /var/spool/uupublic owned by uucp. There are also hidden files (that is, files
    with names beginning with a d); such files are not normally displayed by the ls
    command) in the spool directory must be owned by uucp as well.


    uuico keeps saying “Wrong time to call”: This probably means that in the system
    entry in sys, you didn''t specify a time command that details how the remote system
    may be called, or you gave one which actually forbids calling at the current time.
    If no call schedule is given, uucio assumes the system may never be called.


    uuico complains that the site is already locked: This means that uuico detected
    a lock file for the remote system in /var/spool/uucp. The lock file may be from
    an earlier caller to the system that crashed or was killed. It''s also likely
    that there''s another uuico process sitting around that is trying to dial the
    remote system and got stuck in a chat script, or so on. If this uuico process
    doesn''t succeed in connecting to the remote system, kill it with a hang signal,
    and remove any lock files it left lying around.


    I connect to the remote system, but the chat script fails: Look at the text you
    receive from the remote site. If it is garbled, this might be a speed-related
    problem. Otherwise, confirm if it really agrees with what your chat script expects.
    Remember, the chat script starts with an expect string. If you receive the login
    prompt, send your name, but never get the password prompt, insert some delays
    before sending it, or even between the letters. It might be too fast for your
    modem.


    My modem does not dial: If your modem doesn''t indicate the DTR line has been
    raised when uuico calls out, you possibly haven''t given the right device to uuico.
    If your modem recognizes DTR, check with a terminal program that you can write
    to. If this works, turn on echoing with E at the start of the modem chat. If it
    doesn''t echo your commands during the modem chat, check if your line speed is
    too high or low for your modem. If you see the echo, check if you have disabled
    modem responses, or set them to number codes. Verify that the chat script itself
    is correct. Remember that you have to write two backslashes to one to the modem.


    My modem tries to dial, but doesn''t get: Insert a delay in the phone number.
    This is especially useful when dialing out from a company''s internal telephone
    net. For people in Europe, who usually dial pulse-tone, try touch-tone. In some
    countries, postal services have been upgrading their nets recently. Touch-tone
    sometimes helps.'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'Log file says I have extremely high packet loss rates: This looks like a speed
    problem. Maybe the link between computer and modem is too slow (remember to adapt
    it to the highest effective rate?) Or is your hardware that is too slow to service
    interrupts in time? With a NSC-16550A chipset on your serial port, 38Kbps are
    said to work reason-well; however, with FIFOs (like 16450 chips), 9,600bps is
    the limit. Also, you should make sure hardware handshake is enabled on the serial
    line.


    Another likely cause is that hardware handshake isn''t enabled on the port. Taylor
    UUCP 1.04 has no provisions for tuning on RTS/CTS handshake.


    I can log in, but handshake fails: Well, there can be a number of problems. The
    output in the log file should tell you what to do. Look at what protocols the
    remote site sends (it sends a string Pprotlist before the handshake). Maybe they
    don''t have any in common (did you select any protocols in size or port?).


    If the remote system sends RLCK, there is a stale lockfile for the remote system.
    If it''s not you''re already connected to the remote system on a different line,
    it has removed.


    If it sends RBADSEQ, the other side has conversation count checks enabled for
    you, but numbers didn''t match. If it sends RLOGIN, you were not permitted to
    login under this ID.


    # Log Files


    When compiling the UUCP suite to use Taylor-style logging, you have only three
    global log files, all of which reside in the spool directory. The main log file
    is named Log and contains all information about connections established and files
    transferred.


    The next important log file is Stats, which lists file transfer statistics.


    The third file is Debug. This is the place where debugging information is written.
    If you use debugging, you should make sure that this file has a protection mode
    of 600. Depending on the debug mode you selected, it may contain the login and
    password you use to connect to the remote system.


    Some UUCP binaries included in distributions have been compiled to HDB-style logging.
    HDB UUCP uses a bunch of log files stored below /var/spool/uucp/Log. This directory
    contains three more directories, named uuicco, uuxqt, and uaxxt. They contain
    the logging output generated by each of the corresponding commands, sorted into
    different files for each site. Thus, output from uuicco when calling site Pablo
    will go into .Log/uuicco/pablo, while the subsequent uuxqt run will write to .Log/uuxqt/pablo.
    The lines written to the various logfiles are, however, the same as with Taylor
    logging.'
  merge: -1
  img_proc: true
- pgno: 190
  md: When you enable debugging output with HDB-style logging compiled in, it will
    go to the .Admin directory below /var/spool/uucp. During outgoing calls, debugging
    information will be sent to .Admin/audit.local, while the output from uucicp when
    someone calls in will go to .Admin/audit.
