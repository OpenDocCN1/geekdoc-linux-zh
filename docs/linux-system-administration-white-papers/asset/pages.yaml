- pgno: 86
  md: '# The PLIP Interface


    When using a PLIP link to connect two machines, things are a little different
    from what you have to do when using an Ethernet. The former are so-called point-to-point
    links, because they involve only two hosts (“points”), as opposed to broadcast
    networks.


    As an example, we consider the laptop computer of some employee at the Virtual
    Brewery that is connected to vager. The laptop itself is called vlite, and has
    only one parallel port. At boot time, this port will be registered as plip1. To
    activate the link, you have to configure the plip interface using the following
    commands:


    ```

    # ifconfig plip1 vlite pointpoint vager

    # route add default gw vager

    ```


    # Note


    Pointoint is not a type. It''s really spelled like this.


    The first command config the interface, telling the kernel that this is a point-to-point
    link, with the remote side having the address of vager. The second installs the
    default route, using vager as gateway. On vager, a similar ifconfig command is
    necessary to activate the link (a route invocation is not needed):


    ```

    # ifconfig plip1 vager pointpoint vlite

    ```


    The interesting point is that the plip1 interface on vager does not have to have
    a separate IP address, but may also be the address 191.72.1.1. Just as a matter
    of caution, you should, however, configure a PLIP or SLIP link only after you
    have completely set up the routing table for your Ethernets. With some other kernels,
    your network route might otherwise end up pointing at the point-to-point link.


    Now, we have configured routing from the laptop to the Brewery''s network; what''s
    missing is a way to route from any of the Brewery''s hosts to vlite. One particularly
    cumbersome is to add a specific route to every host''s routing table that vager
    as a gateway to vlite:


    ```

    # route add vlite gw vager

    ```


    A much better option when faced with temporary routes is to use dynamic routing.
    One way to do so is to use a routing daemon, which you would have to install on
    each host in the network to distribute routing information dynamically. The easiest
    way, is to use proxy.ARP. With proxy ARP, vager will respond to any ARP query
    for vlite by sending its Ethernet address. The effect of this is that all packets
    for vlite will wind up at vager, which then forwards them to the laptop. We will
    come back to proxy ARP in the PLIP section below.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'Future Net-3 releases will contain a tool called plipconfig which will allow
    you to set the IRQ of the printer port to use. Later, this may even be replaced
    by a more general ifconfig command.


    # The SLIP and PPP Interface


    Although SLIP PPP links are only simple point-to-point links like PLIP connections,
    there is much more to be said about them. Usually, establishing a SLIP connection
    involves dialing a remote site through your modem and setting the serial line
    to SLIP mode. PPP is used in a similar fashion. The tools required for setting
    up a SLIP or PPP link will be described in Chapter 6 and Chapter 7.


    # The Dummy Interface


    The dummy interface is really a little exotic, but rather useful nevertheless.
    Its main benefit is standalone hosts, and machines whose only IP network connection
    is a dial-up link. In fact, the latter are standalone hosts of the time, too.


    The dilemma with standalone hosts is that they only have a single network device
    active, the loopback device, which is usually assigned the address 127.0.0.1.
    On some occasions, you may need to send data to the "official" IP address of the
    local host. For instance, consider the laptop vite, that has been disconnected
    from any network for the duration of this example. An application on vite may
    now want to send some data to another application on the same host. Looking up
    vite in /etc/hosts yields an IP address of 192.72.1.65, so the application tries
    to address this. As the loopback interface is currently the only active interface
    on the machine, the kernel has no idea that this address actually refers to itself!
    As a consequence, the kernel discards the datagram and returns an error to the
    application.


    This is where the dummy device steps in. It solves the dilemma by simply serving
    as the alter ego of the loopback interface. In the case of vite, you would simply
    give it the address 192.72.1.65 and add a host route pointing to it. Every datagram
    for 192.72.1.65 would be delivered locally. The proper invocation is:


    ```

    # ifconfig dummy vite

    # route add add vite

    ```


    # All About ifconfig


    There are a lot more parameters to ifconfig that we have described above. Its
    normal invocation is this:


    ```

    ifconfig interface [[-net]-host] address [parameters]

    ```'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Configuring TCP/IP Networking 65


    “Interface” is the interface name, and “address” is the IP address to be assigned
    to the interface. This may either be an IP address in dotted quad quotation, or
    a name ifconfig will look up in /etc/hosts and /etc/networks. The -net and -host
    options force ifconfig to treat the address as network number or host address,
    respectively.


    If ifconfig is invoked with only the interface name, it displays that interface''s
    configuration. When invoked without any parameters, it displays all interfaces
    you configured so far; an option of -a forces it to show the inactive ones as
    well. A sample invocation for the Ethernet eth0 may look like this:


    ```

    # ifconfig eth0

    eth0 encap 100Mbps Ethernet Hwaddr 00:00:C0:90:83:42

    addr 192.71.2.1 Broadcast 192.71.2.255 Mask 255.255.255

    UP BROADCAST RUNNING MTU 1500 Metric 0

    RX packets 3136 errors 21 dropped 7 overrun 26

    TX packets 1752 errors 25 dropped 0 overrun 0

    ```


    The MTU and Metric fields show the current MTU and metric value for that interface.
    The metric value is traditionally used by some operating systems to compute the
    cost of a route.


    The RX and TX lines show how many packets have been received or transmitted error-free,
    how many errors occurred, how many packets were dropped (probably due to low memory),
    and how many were lost because of an overrun. Receiver overruns usually happen
    when packets come faster than the kernel can service the last interrupt. The flag
    printed by ifconfig correspond more or less to the names of its command line options;
    they will be explained below.


    In Table 5.1 is a list of parameters recognized by ifconfig with the corresponding
    flag names given in brackets. Options that simply turn on a feature allow it to
    be turned off by preceding the interface name by a dash (-).


    | Table 5.1 Parameters recognized by ifconfig. |

    | :--- | : |

    | up | This marks an interface “up,” i.e., accessible to the IP layer. This option
    is implied when an address is given on the command line. It may be used to re-enable
    an interface that has been taken down temporarily using the down option. (This
    option corresponds to flags UP RUNNING.) |

    | down | This marks an interface “down,” i.e., inaccessible to the IP layer. Note
