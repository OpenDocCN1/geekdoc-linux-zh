- pgno: 354
  md: '# Chapter 7


    # Logging In And Out


    > "I don’t care to belong to a club that accepts people like me as a member."

    -Grouch Marx


    This section describes what happens when a user logs in out. The various interactions
    of background processes, log files, configuration files, and so on are described
    in some detail.


    # Logins Via Terminals


    Figure 7.1 shows how logins happen via terminals. First, init makes sure there
    is a getty program for the terminal connection (or console); getty listens at
    the terminal and waits for the user to notify that he is ready to log in (this
    usually means that the user must type something). When it notices a user, getty
    outputs a welcome message (stored in /etc/issue), prompts for the username, and
    finally runs the login program. login gets the username as a parameter, and prompts
    the user for the password. If this match, login starts the shell configured for
    the user; otherwise it just exits and terminates the process (perhaps after giving
    the user another chance at entering the username and password). init notices that
    the process terminated, and starts a new getty for the terminal.


    Note that the only new process is the one created by init (using the fork system
    call); getty and login only replace the program running in the process (using
    the exec system call)


    A separate program, for noticing the user, is needed for serial lines, since it
    can be (and traditionally was) complicated to notice when a terminal becomes active.
    getty also adapts to the speed and other settings of the connection, which is
    important especially for dial-in connections, where these parameters may change
    from call to call.'
  merge: -1
  img_proc: true
- pgno: 355
