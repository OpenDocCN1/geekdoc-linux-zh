    # Writing The Master Files


    Listings 5.1, 5.2, 5.3, and 5.4 give sample files for a name server at the brewery,
    located on vlager. Owing to the nature of the network discussed (a single LAN),
    the example is pretty straightforward. If your requirements are more complex,
    and you cannot get named, DNS and BIND by Cricket Liu and Paul Albit.


    The named.ca cache file shown in Figure 5.1 shows sample hints for a root name
    server. A typical cache file usually describes about a dozen name servers or so.
    You can obtain the current list of name servers for the root domain using the
    nslookup tool described toward the end of this chapter.


    > Note

    You can''t query your name server for the root servers if you don''t have any
    root server hints installed: catch-22! To escape this dilemma, you can either
    make nslookup use a different name server, or you can use the sample file in Listing
    5.1 as a starting point, and then obtain the full list of valid servers.


