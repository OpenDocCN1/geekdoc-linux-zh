  md: '# Note


    Note that names in networks must not collide with hostnames from the hosts file,
    or else some programs may produce strange results.


    # Interface Configuration For IP


    After setting up your hardware as explained in the previous chapter, you will
    have to make these devices to the kernel networking software. A couple of commands
    are used to configure the network interfaces, and initialize the routing table.
    These tasks are usually performed from the rc.init script each time the system
    is booted. The basic tools for this are called ifconfig (where “if” stands for
    interface), and route.


    ifconfig is used to make an interface accessible to the kernel networking layer.
    This involves the assignment of an IP address and other parameters, and activating
    the interface, also known as “taking up.\ Being active here means that the kernel
    will send and receive IP datagrams through the interface. The simplest way to
    invoke it is


    ```

    ifconfig interface ip-address

    ```


    which assigns “ip-address” to the interface and activates it. All other parameters
    are set to default values. For instance, the default subnet mask is derived from
    the network class of the IP address, such as 255.255.255.0 for a class B address.(ifconfig
    is described in more detail at the end of this chapter.)


    The second tool, route, allows you to add or remove routes from the kernel routing
    table. It can be invoked as


    ```

    route [add|del] target

    ```


    where the add and del arguments determine whether to add or delete the route to
    target.


    # The Loopback Interface


    The first interface to be activated is the loopback interface:


    ```

    # ifconfig lo 127.0.0.1

    ```


    Occasionally, you will also see the dummy hostname localhost being used instead
    of the IP address. It will look up the name in the hosts file where an entry should
    declare it as the hostname for 127.0.0.1:


    ```

    # Sample /etc/hosts entry for localhost

    localhost 127.0.0.1

    ```'
