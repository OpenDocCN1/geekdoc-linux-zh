    only be used for very small feeds; otherwise the load on both systems will be
    too high.


    The default command is


    ```

    ux -r -z system|rnews

    ```


    which invokes rnews on the remote system, feeding the article on standard input.
    The default search path for commands in this field is /bin:/usr/bin:/usr/lib/bin/batch.
    The latter directory contains a number of shell scripts whose name starts with*:
    they are briefly described later in this chapter.


    If batching is enabled using either of the F or f, or n flags, C News expects
