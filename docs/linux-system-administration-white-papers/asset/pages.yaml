- pgno: 28
  md: '# Chapter 1

    Introduction To Networking


    The idea of networking is probably as old as telecommunications itself. Consider
    people living in the stone age, where drums may have been used to transmit messages
    between individuals. Suppose caveman A wants to invite caveman B for a game of
    hurling rocks at each other, but they live too far apart for B to hear A banging
    his drum. So what are A''s options? He could 1) walk over to B''s place, 2) get
    a bigger drum, or 3) ask C, who lives halfway between them, to forward the message.
    This last option is called networking.


    Of course, we come a long way from the primitive pursuits and devices of our forebears.
    Nowadays, we have computers talk to each other over vast assemblies of wires,
    fiber optics, microwaves, and the like, to make an appointment for Saturday''s
    soccer match. In the following, we will deal with the means and ways by which
    this is accomplished, but leave out the wires, as well as the soccer port.


    We describe two types of networks in this guide: those based on UUCP, and those
    based on TCP/IP. These are protocol suites and software packages that supply means
    to transport data between two computers. In this chapter, we will look at all
    types of networks, and discuss their underlying principles.


    We define a network as a collection of hosts that are able to communicate with
    each other, often relying on the services of a many dedicated hosts that relay
    data between the participants. Hosts are very often computers, but need not be;
    one can also think of X-terminals or intelligent printers as hosts. Small aggregations
    of hosts are also called sites.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# The Linux Network Administrators'' Guide: Chapter 1


    Communication is impossible without some sort of language or code. In computer
    networks, these languages are collectively referred to as protocols. However,
    you shouldn''t think of written protocols here, but rather of the highly formalized
    code of behavior observed when heads state metric, for instance. In a very similar
    fashion, the protocols used in computer networks are nothing but very strict rules
    for the exchange of messages between two or hosts.


    # UUCP Networks


    UUCP is an abbreviation for Unix-to-Unix Copy. It started out as a package of
    programs to transfer files over serial lines, schedule those transfers, and initiate
    execution of programs on remote sites. It has undergone major changes since its
    first implementation in the late seventies, but is still Spartan in the services
    it offers. Its main application is still in wide-area networks based on dial-up
    telephone lines.


    UUCP was first developed by Bell Laboratories in 1977 for communication between
    Unix sites. In mid-1978, this network already connected over 80 sites. It was
    running email as an application, as well as remote printing. However, the system''s
    central was in distributing new software and bug fixes. Today, UUCP is not confined
    to the environment anymore. There are both free and commercial ports available
    for a variety of platforms, including AmigaOS, DOS, Atari''s TOS, and so on.


    One of the main disadvantages of UUCP networks is low bandwidth. On one hand,
    telephone equipment places a tight limit on the maximum transfer rate. On the
    other hand, UUCP links are rarely permanent connections; hosts dial up each other
    at regular intervals. Hence, the more time it takes a mail message to travel a
    UUCP network it sits idle on some host''s disk, awaiting the next time a connection
    is established.


    Despite these limitations, there are still many UUCP networks operating all over
    the world, mainly by hobbyists, who offer user network access at reachable prices.
    The main reason for the popularity of UUCP is that it is cheap compared to having
    your computer connected to The Big Internet Cable. To make your computer a UUCP
    node, all you need is a modem, a working UUCP implementation, and another UUCP
    node that is filling you with mail and news.


    # How To Use UUCP


    The idea behind UUCP is simpler: As its name indicates, it basically copies files
    from one to another, but it also allows certain actions to be performed on the
    remote host.


    Suppose your machine is allowed to access a hypothetical host named Swim, and
    it have execute the lpr print command for you. You could type the following on
    your command line to have this book printed on Swim:


    ```

    $ uux -r swim!lpr !netguide.avi

    ```'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'This makes uux, a command from the UUCP suite, schedule a job for Swim. This
    consists of the input file, netguide.dvi, and the request to feed this file to
    lpr. The -r flag tells uux not to call the remote system immediately, but to rather
    store the job away until a connection is established at a later occasion. This
    is called spooling.


    Another property of UUCP is that it allows to forward jobs and files through several
    hosts, provided they cooperate. Assume that Swim, from the above examples, has
    a UUCP link with Groucho, which maintains a large archive of applications. Download
    the file tripwire-1.0.tar.gz to your site, you may issue


    ```

    $ uux -mr swim!groucho!~/security/tripwire-1.0.tar.gz

    trip.tgz

    ```


    The job will request Swim to fetch the file from Groucho, and send it to your
    site, where UUCP will store it in trip.tgz and notify you via mail of the file''s
    arrival. This will be done in three steps: first, your site sends the job to Swim.
    When Swim establishes connection with Groucho the next time, it downloads the
    file. The final step is the actual transfer from Swim to your host.


    The most important services provided by UUCP networks these days are electronic
    mail and news. We will come back to these later, but we will only give a brief
    introduction here.


    Electronic mail—email for short—allows you to exchange messages with users on
    remote hosts without actually knowing how to access these hosts. The task of directing
    a message from your site to the destination site is performed entirely by the
    mail handling system. In a UUCP environment, mail is usually transported by executing
    the mail command on a neighboring host, passing the recipient address and the
    mail message. rmail will then forward the message to another host, and so, until
    it reaches the destination host. We will look at this in detail in Chapter 12.


    News may be described as a distributed bulletin board system. Most often, this
    term refers to Usenet news, which is by far the most widely news exchange network
    with an estimated number of 120,000 participating sites. The origins of Usenet
    date back to 1979, when after the release of UUCP with the new Unix-V7, three
    graduate students had the idea of a general information exchange within the Unix
    community. They put together some scripts, which became the first news system.
    In 1980, this network connected Duke, UNC, and PHS, at two universities in North
    Carolina. Out of this, Usenet grew rapidly. Although originated as a UUCP-based
    network, it is no longer confined to one single type of network.


    The basic unit of information is the article, which may be posted to a hierarchy
    of newsgroups dedicated to specific topics. Most sites receive only a selection
    of all newsgroups, carry an average of 60MB worth of articles a day.


    In the UUCP world, news is generally sent across a UUCP link by collecting all
    articles from the groups requested, and packing them up in a number of batches.
    These are sent to the'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# The Linux Administrators'' Guide: Chapter 1


    receiving site, where they are fed to the news command for unpacking and further
    processing.


    Finally, UUCP is also the medium of choice for many dial-up archive sites which
    offer public access. You can usually access them by dialing them up with UUCP,
    logging in as a guest user, and download files from a publicly accessible archive.
    These guest accounts often have a login name and password of uucp/nucp or something
    similar.


    # TCP/IP Networks


    UUCP may be a reasonable choice for low-cost dial-up network links, there are
    many situations in which its store-and-forward technique proves too inflexible,
    for local area networks (LANs). These are usually made up of a small number of
    machines located in the same building, or even on the same floor, that are interconnected
    to provide a homogeneous working environment. Typically, you would want to share
    files between these hosts, or run distributed applications on different machines.


    These tasks require a completely different approach to networking. Instead of
    forwarding entire files with a job description, all data is broken up into smaller
    chunks (packets), which are forwarded immediately to the destination host, where
    they are reassembled. This type of network is called a packer-switched network.
    Among other things, this allows running interactive applications over the network.
    The cost of this is, of course, a greatly increased complexity in software.


    The solution that systems—and many non-Linux sites—have adopted is known as TCP/IP.
    In this section, we will have a look at its underlying concepts.


    # Introduction To TCP/IP Networks


    TCP/IP traces its origins to a research project funded by the United States DARPA
    (Defense Advanced Research Projects Agency) in 1969. This was an experimental
    network, the ARPANET, which was converted into an operational one in 1975, after
    it had proven to be a success.


    In 1983, the new protocol suite TCP/IP was adopted as a standard, and all hosts
    on the network were use it. When ARPANET finally passed out of existence in 1990,
    the use of TCP/IP had spread to networks beyond the Internet itself. Most are
    local area networks, but in the advent of fast digital equipment, such as ISDN,
    it also has a promising future as a transport for dial-up networks.


    For something concrete to look at as we discuss TCP/IP throughout the following
    sections, we will consider Grouchlou Marx University (GMU), situated somewhere
    in Fredland, as an example. Most departments run their own local area networks,
    while some share one, and others run several of them. They are all interconnected,
    and hooked to the Internet through a single high-speed link.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Introduction To Networking


    Suppose your box is connected to a LAN of hosts at the Mathematics Department,
    and its name is Erdos. To access a host at the Physics Department named Quark,
    you enter the following command:


    ```

    $ login quark.physics

    Welcome to the Physics Department at GMU

    (tty2) login:

    ```


    At the prompt, you enter your login name, Andres, and your password. You are then
    given a shell on Quark, to which you can type as if you were sitting at the system''s
    console. After you exit the shell, you are returned to your own machine''s prompt.
    You have just used one of the instantaneous, interactive applications that TCP/IP
    provides: remote login.


    While being logged into Quark, you might also want to run an X11-based application,
    like a functioning program, or a PostScript viewer. To tell this application that
    you want to have its windows displayed on your host''s screen, you have to set
    the DISPLAY environment variable:


    ```

    $ export DISPLAY-erdos.maths:0.0

    ```


    If you now start your application, it will call your X server instead of Quark''s,
    and display all its windows on your screen. Of course, this requires that you
    have X11 running on Erdos. The point here is that TCP/IP allows Quark and Erdos
    to send X11 packets back and forth to give you the illusion that you''re on a
    single system. The network is almost transparent.


    Another very important application in TCP/IP networks is NFS, which stands for
    Network File System. It is another form of making the network transparent, because
    it basically allows you to mount directory hierarchies from other hosts, that
    they appear like local file systems. For example, all users'' home directories
    can be on a central server machine, from which all other hosts on the LAN mount
    the directory. The effect of this is that users can log into any machine, and
    find themselves in the same home directory. Similarly, it is possible to install
    applications that require large amounts of disk space (such as TeX) on only one
    machine, and export these directories to other machines. We will come back to
    NFS in Chapter 10.


    We will now have a closer look at the way TCP/IP works. You will need this to
    understand how and why you have to configure your machine. We will start by examining
    the hardware, and slowly work out our way.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Ethernets


    The type of hardware widely used throughout LANs is what is commonly known as
    Ethernet. It consists of a single cable with hosts attached to it connectors,
    taps, or transceivers. Simple Ethernet are quite inexpensive to install, which,
    together with a net transfer rate of 10Mbps, accounts for much of its popularity.


    Ethernet come in three flavors, thick thick and thin width, respectively, twisted
    pair. Thin and thick Ethernet each use a coaxial cable, differing in width and
    the way you may attach a host to this cable. Ethernet uses a T-shaped "BNC" connector,
    which you insert into the cable, and twist onto a plug on the back of your computer.
    Ethernet requires that you drill a small hole into the cable, and attach a transceiver
    using a "vampire tap." One or more hosts can then connect to the transceiver.
    Thin and thick Ethernet cable may run for a maximum of 200 and 500 meters, respectively,
    and are therefore called 10base-2 and 10base-5. Twisted pair uses a cable of two
    copper wires which is also found in ordinary telephone installations, that usually
    requires additional hardware. It is also known as 10base-t.


    Adding a host to a thick Ethernet is a little hairy, it does not bring the network.
    To add a host to a thin installation, you will disrupt network service for at
    least a few minutes before you have to cut the cable to insert the connector.


    Most people prefer Ethernet, because it is very cheap: PC cards form for as little
    as $10, and cable is in the range of a few cents per meter. However, for large-scale
    installations, thick Ethernet is more appropriate. For example, the Ethernet at
    GM''s Mathematics Department uses thick Ethernet, so traffic will not be disrupted
    each time a host is added to the network.


    One of the drawbacks of Ethernet technology is its limited cable length, which
    precludes any use of it other for LANs. However, several Ethernet segments may
    be linked to each other using repeaters, bridges, or routers. Repeaters simply
    copy the signals between two or more segments, so that all segments together will
    act as if it were one Ethernet.


    Ethernet works like a bus system, where a host sends many packets (or frames)
    of up to 1500 bytes to another host is addressed by a 6-byte address coded into
    the firmware of its Ethernet board. These addresses are usually written as a sequence
    of two-digit hex numbers separated by colons, as in aa:bb:cc:dd:ee:ff.


    A frame by one station is seen by all attached stations, but only the destination
    host actually picks it and processes it. If two stations try to send at the same
    time, a collision occurs, which is resolved by the two stations abandoning the
    send, and re-attempting it a few moments later.


    # Other Types Of Hardware


    In larger installations, such as Groucho Marx University, Ethernet is usually
    not the only type of equipment used. At Groucho Marx University, each department''s
    LAN is linked to'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'the campus backbone, which is a fiber optics cable running FDDI (fiber distributed
    data interface). FDDI uses an entirely different approach to transmitting data,
    which basically involves sending around a number of tokens, with a station only
    being allowed to send a frame if it captures a token. The main advantage of FDDI
    is a speed of up to 100Mbps, and a maximum cable length of up to 200 km.


    For long-distance network links, a different type of equipment is frequently used,
    which is based on a standard named X.25. Many so-called Public Data Networks,
    like Tynet in the U.S., or Data-P in Germany, offer this. X.25 requires special
    hardware, a packet assembler/disassembler, or PAD. X.25 defines a set of networking
    protocols of its own right, but is nevertheless frequently used to connect networks
    running TCP/IP or other protocols. Since IP packets cannot simply be mapped onto
    X.25 (and vice versa), they are simply encapsulated in X.25 packets and sent over
    the network.


    Frequently, radio amateurs use their equipment to transfer their computers; this
    is called packet radio or ham radio. The protocol used by ham radios is called
    AX.25, which is derived from X.25.


    Other techniques involve using slow but cheap serial lines. These require another
    protocol for transmission of packets, such as SLIP or PPP, which will be described
    below.


    # The Internet Protocol


    Of course, you wouldn''t want your networking to be limited to one Ethernet. Ideally,
    you would want to be able to use a network regardless of what hardware it runs
    on and how many subunits it is made of. For example, in larger installations such
    as Grouch Marx University, you usually have a number of separate Ethernnets that
    have to be connected in some way. At GMU, the Mathematics Department runs two
    Ethernnets: one network of fast machines for professors and graduates, and one
    with slow machines for students. Both are linked to the FDDI campus backbone.


    This connection is handled by a dedicated host, a so-called gateway, which handles
    incoming and outgoing packets by copying them between the two Ethernets and the
    fiber optics cable. For example, if you are at the Math Department, and want to
    Quark on the Physics Department''s LAN from your box, the networking software
    cannot send packets to Quark directly, because it is not on the same Ethernet.
    Therefore, it has to rely on the gateway to act as a forwarder. The gateway (name
    Sophus) then forwards these packets to its peer gateway Niels in the Physics Department,
    using the backbone, with Niels delivering it to the destination machine.


    This scheme of directing data to a remote host is called routing, and datagram
    are often referred to as datagrams in this context. To facilitate things, datagram
    exchange is governed by a single protocol that is independent of the hardware
    used: IP, or Internet Protocol. In Chapter 2, we will cover IP and the issues
    of routing in greater detail.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'The main benefit of IP is that it turns physically dissimilar networks into
    an apparently homogeneous network. This is called internetworking, and the resulting
    "meta-network" is called an internetwork. Note the subtle difference between an
    internet and the Internet. The latter is the official name of one particular global
    internet.


    Of course, IP also requires a hardware-independent addressing scheme. This is
    achieved by assigning each host a 32-bit number, called the IP address. An IP
    address is usually written as four decimal numbers, for each 8-bit portion, separated
    by dots. For example, Quark might have an IP address of 0x954C0C04, which would
    be written as 149.76.12.4. This format is also called dotted quotation.


    You will notice that there are three different types of addresses: first is the
    host''s name, like Quark; then there are IP addresses; and finally, there are
    hardware addresses, like the 6-byte Ethernet address. All these have to match,
    so when you type login quark, the networking software can be given Quark''s IP
    address; and when IP delivers any data to the Physics''s Ethernet, it has to find
    out what Ethernet address corresponds to the IP address—which is rather confusing.


    We will not go into this, and deal with it in Chapter 2 instead. Now, it''s enough
    to remember that these steps of finding addresses are called hostname resolution,
    for mapping hostnames to IP addresses, and address resolution, for mapping the
    latter to hardware addresses.


    # IP Over Serial Lines


    On serial lines, a "de facto" standard known as SLIP, or Serial Line IP, is frequently
    used. A modification of SLIP is known as CSIP or compressed SLIP, and performs
    compression of IP headers to make use of the relatively low bandwidth provided
    by serial links. A different serial protocol is PPP (see Chapter 7), or Point-to-Point
    Protocol. PPP has many more features than SLIP, including a link negotiation phase.
    Its main advantage over SLIP is, however, that it isn''t limited to transporting
    IP datagrams, but that it was designed to allow for any type of datagrams to be
    transmitted.


    # The Transmission Control Protocol


    Now, of course, sending datagrams from one host to another is not the whole story.
    If you log into Quark, you will have a reliable connection through your login
    process on Erdos and the shell process on Quark. The information sent to and fro
    must be split into packets by the sender, and reassembled as a character stream
    by the receiver. As it seems, this involves a number of hairy tasks.


    A very important thing to know about IP is that, by intent, it is not reliable.
    Assume ten people on your Ethernet subnet downloading the latest release of XFree86
    from GMU''s'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'FTP server: The amount of traffic generated by this might be too much for handle,
    because it''s too slow, and it''s tight on memory. Now if you happen to send a
    packet to Quark, Soph might just be out of buffer space for a moment and therefore
    unable to forward it. IP solves this problem by simply discarding it. The packet
    is irrevocably lost. It is therefore the responsibility of the communicating hosts
    to check the integrity and completeness of the data, and retransmit it in case
    of an error.


    This is performed by another protocol, TCP, or Transmission Control Protocol,
    which builds a reliable service on top of IP. The essential property of TCP is
    that it uses IP to give the illusion of a simple connection between the two processes
    on your host and the remote machine, so that you don''t have to care about how
    and which route your data actually travels. A TCP connection essentially works
    like a two-way pipe that both processes may write to and read from. Think of it
    as a telephone conversation.


    TCP identifies the endpoints of such a connection by the IP addresses of the two
    hosts involved, and the number of so-called ports on each host. Ports may be viewed
    as attachment points for network connections. If we are strain the telephone example
    a little, one might compare IP addresses to area codes (numbers map to cities),
    and port numbers to local codes (numbers map to individual''s phones).


    In the login example, the client application (login) opens a port on Erdos, and
    connects to port 513 on Quark, which the login server is known to listen to. This
    establishes a TCP connection. Using this connection, login performs the authorization
    procedure, and then spawns the shell. The shell''s standard input and output are
    redirected to the TCP connection, so that anything you type to login on your machine
    will be passed through the TCP stream and be given to the shell as standard input.


    # The User Datagram Protocol


    Of course, TCP isn''t the only user protocol in TCP/IP networking. Although suitable
    for applications like login, the overhead involved is prohibitive for applications
    like NFS. It uses a sibling protocol of TCP called UDP, or User Datagram Protocol.
    Just like TCP, UDP also allows an application to contact a service on a certain
    port on the remote machine, but it doesn''t establish a connection for this. Instead,
    you may use it to send single packets to the destination service—hence its name.


    Assume you have mounted the Tex directory hierarchy from the department''s central
    NFS server, Galois, and you want to view a document describing how to use LaTeX.
    You start your editor, who first reads the entry in one file. However, it would
    take too long to establish a TCP connection with Galois, send the file, and release
    it again. Instead, a request is made to Galois, who sends the file in a couple
    of UDP packets, which is much faster. However, UDP was not made to deal with packet
    loss or corruption. It is up to the application—NFS in this case—to take care
    of this.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# More On Ports


    Ports may be viewed as attachment points for network connections. If an application
    wants to offer a certain service, it attaches itself to a port and waits for clients
    (this is also called listening on the port). A client that wants to use this service
    allocates a port on its local host, and connects to the server''s port on the
    remote host.


    An important property of ports is that once a connection has been established
    between the client and the server, another copy may attach to the server port
    and listen for more clients. This permits, for instance, several concurrent remote
    logins to the same host, using all the same port 513. TCP is able to tell these
    connections from each other, because they all come from different ports or hosts.
    For example, if you log into Quark from Erdos, the first login client will use
    the local port 1023, and the second one will use port 1022. Both, however, will
    connect to the same port 513 on Quark.


    This example shows the use of ports as rendezvous points, where a client contacts
    a specific port to obtain a specific service. For a client to know the proper
    port number, an agreement has to be reached between the administrators of both
    systems on the assignment of these numbers. For services that are widely used,
    these numbers have to be administered centrally. This is done by the IETF (or
    Internet Engineering Task Force), which regularly releases an RFC titled Assigned
    Numbers. It describes, among other things, the port numbers assigned well-known
    services. Linux uses a file mapping service names to numbers, called /etc/services.
    It is described in Chapter 8.


    It is worth noting that both TCP and UDP connections rely on ports, these numbers
    do not conflict. This means that TCP port 513, for example, is different from
    UDP port 513. In fact, these ports serve as access points for two different services,
    namely login (TCP) and rwho (UDP).


    # The Socket Library


    In operating systems, the software performing all the tasks and protocols described
    above is usually part of the kernel. The programming interface most common in
    the world is the Berkeley Socket Library. It derives from a popular analogy that
    views ports as sockets, and connecting to a port as plugging in. It provides the
    (bind(2)) call to specify a remote host, a transport protocol, and a service which
    a program can connect to or listen to (connect(2), listen(2), and accept(2)).
    The socket library is, however, somewhat general, in that it provides not only
    a class of TCP/IP-based sockets (the AF_INET sockets), but also a class that handles
    connections local to the machine (the AF_UNIX class). Some implementations can
    also handle other classes as well, like the XNS (Xerox Networking System) protocol,
    or X.25.


    In Linux, the socket library is part of the standard c-library. Currently, it
    only supports AF_INET and AF_UNIX sockets, but efforts are to incorporate support
    for Novel''s networking protocols, so that eventually one or more socket classes
    for these would be added.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Networking


    Being the result of a concerted effort of programmers around the world, Linux
    wouldn''t have been possible without the global network. So it''s not surprising
    that in early stages of development, several people started to work on providing
    it with network capabilities. A UUOC implementation was running almost from the
    very beginning, and work on TCP/IP-based networking started around autumn 1992,
    when Ross Biro and others created what now has become as Net-1.


    After Ros quit active development in May 1993, Fred van Kempen began to work on
    a new implementation, rewriting many parts of the code. This ongoing effort is
    known as Net-2. A first public release, Net-2d, was made in summer 1992 (as part
    of the 0.99.10 kernel), and has since been maintained and expanded by several
    people, most notably Alex Cox, as Net-2Debugged. After heavy debugging and numerous
    improvements to the code, he (Alan Cox) changed its name to Net-3 after 1.0 was
    released.


    Net-3 offers device drivers for a wide variety of Ethernet boards, as well as
    SLIP (for sending network traffic over serial lines), and PLIP (for parallel lines).
    Net-3 has a TCP/IP implementation that behaves very well in a local area network
    environment, showing outtimes that beat some of the commercial PC software makers.


    # Different Streaks Of Development


    In the meanwhile, Fred continued development, going on to Net-2, which features
    a much revised design of the networking layer. At the time of writing, Net-2 is
    still beta software. Most notable about Net-2 is the incorporation of DDI, the
    *device driver interface*. DDI offers a uniform access and configuration method
    to all networking devices and protocols.


    Another implementation of TCP/IP networking comes from Matthias Ulrich, who wrote
    an ISDN driver for Linux and FreeBSD. For this, he integrated some of the BSD
    networking code in the kernel.


    For the foreseeable future, however, Net-3 seems to be here. Alan currently works
    on an implementation of the AX.25 protocol used by ham radio amateurs. Doubtlessly,
    the yet-to-developed "module" code for the kernel will also bring new impulses
    to the networking code. Modules allow you to add drivers to the kernel at run


    Although these different network implementations all strive to provide the same
    service, there are major differences between them at kernel and device level.
    Therefore, you will not be able to configure a system running a Net-2 kernel with
    utilities from Net-2d or Net-3, and vice versa. This only applies to commands
    that deal with kernel internals rather closely; applications and common networking
    commands such as rogin or telnet run on either of them.


    Nevertheless, all these different network version should not worry you. Unless
    you are participating in active development, you will not have to worry about
    which version of the'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Maintaining Your System


    TCP/IP code run. The official kernel releases will always be accompanied by a
    set of networking tools that are compatible with the networking code present in
    the kernel.


    Throughout this book, we will mainly deal with installation and configuration
    issues. Administration is, however, much more than that. After setting up a service,
    you have to keep it running, too. For most of them, only little attendance will
    be necessary, while for mail and news, require that you perform routine tasks
    to keep your system up to date. We will discuss these tasks in later chapters.


    The absolute minimum in maintenance is to check system and per-application log
    files regularly for error conditions and unusual events. Commonly, you will want
    to do this by writing a couple of administrative shell scripts and run them from
    cron periodically. The source distribution of some major applications, like small
    or C-News, contain such scripts. You only have to tailor them to suit your needs
    and preferences.


    The output from your cron jobs should be mailed to an administrative account.
    By default, many applications will send error reports, usage statistics, or logfile
    summaries to your root. This account only makes sense if you log in as root frequently;
    much better idea is to forward root mail to your personal account, setting up
    a mail alias as described in Chapter 13.


    However carefully you have configured your system, Murphy''s law guarantees that
    some problems will surface easily. Therefore, maintaining a system also means
    being available for complaints. Usually, people expect that the system administrator
    can at least be reached via email as ROOT, but there are also other addresses
    that are commonly used to reach the person responsible for a specific aspect of
    maintenance. For instance, complaints about a malfunctioning mail configuration
    will usually be addressed to postmaster; and problems with the news system will
    be reported to newsmaster or Usenet. Mail to hostmaster should be redirected to
    the person in charge of the host''s basic network services, and the DNS name service
    if you run a name server.


    # System Security


    Another very important aspect of system administration in a network environment
    is protecting your system and users from intruders. Carelessly managed systems
    offer malicious people many targets: Attacks range from password gu own to Ethernet
    snooping, and the damage caused range from failed mail messages to data loss or
    violation of your users'' privacy. We will mention some particular problems when
    discussing the context they may occur in, and some defenses against them.


    This section will discuss a few examples and basic techniques in dealing with
    system security. Of course, the topics covered cannot treat all security issues
    you may be faced with exhaustively; they merely serve to illustrate the problems
    that may arise. Therefore, reading'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Introduction To Networking 17


    a good book on security is an absolute must, especially in a networked system.
    Simon Garfinkel''s Practical UNIX Security (O''Reilly) is highly recommendable.
    You can read about this book at www.oreilly.com/catalog/puis/


    System starts with good system administration. This includes checking the owner-ship
    and permissions of all vital files and directories, monitoring of privileged accounts,
    etc. The COPS program (www.cert.org/ftp/tools/cops/), for instance, will check
    your file system and common configuration files for unusual permissions or other
    anomalies. It is also wise to use a password suite that enforces rules on the
    users'' passwords that make them hard to guard. The shadow password, for instance,
    requires a password to have at least five letters, and can contain both upper
    and lowercase numbers and digits.


    When making a service accessible to the network, make sure to give "least privilege,"
    meaning that you only permit it to do things that aren''t required for it to work
    as designed. For example, you should make programs setuid to root or some privileged
    account only when they really need to. Also, if you want to use a service for
    only a very limited application, don''t hesitate to configure it as restrictively
    as your special application allows. For instance, if you allow disk hosts to boot
    from your machine, you must provide the TFTP (file transfer service) so that they
    can download basic configuration files from the /boot directory. However, when
    unrestricted, TFTP allows any user-where in the world to download any world-readable
    file from your system. This is not what you want, so why not restrict TFTP service
    to the /boot directory/


    Along the line of thought, you might want to restrict services to users from certain
    hosts, say from your local network. In Chapter 8, we introduce TCP, which does
    this for a variety of network applications.


    Another important point is to avoid "dangerous" software. Of course, any software
    you use can be dangerous, because software may have bugs that people might exploit
    to gain access to your system. Things like these happen, and there''s no protection
    against this. This problem affects free software and commercial products alike.
    However, programs that require special privilege are inherently more dangerous
    than others, because any loop-hole can have drastic consequences. If you install
    a setuid program for network purposes please be doubly careful that you don''t
    miss anything from the documentation, so that you don''t create a security breach
    by accident.


    You can never rule out that your precautions might fail, regardless of how careful
    you have been. You should therefore make sure you detect intruders early. Checking
    the system log files is a good starting point, but the intruder, there are tools
    like Tripwire (www.cert.org/ftp/tools/tripwire/) that allow you to check vital
    system files to see if their contents or permissions have been changed. Tripwire
    computes various checksums over these files and stores them in a database. During
    subsequent runs, the checksums are recomputed and compared to the stored ones
    to detect any modifications.'
