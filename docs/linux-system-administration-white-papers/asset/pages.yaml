  md: "function accesses these services. This is controlled through the /etc/nsswitch.conf\
    \ file, which stands for Name Switch, but of course isn't limited to the name\
    \ service. For any of the data lookup functions supported by NYS, it contains\
    \ a line naming the services to use.\n\nThe right order of services depends on\
    \ the type of data. It is unlikely that the services.by map will contain entries\
    \ differing from those in the local services file; it may contain more. So good\
    \ choice may be to query the local files first, and check NIS only if the service\
    \ name wasn't found. Hostname information, on the other hand, may change frequently,\
