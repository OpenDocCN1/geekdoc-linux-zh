    It produces the CHAP response from the challenge string and the secret (Use Source
    Luke), and sends it off to c3po.


    At the same time, pppd conducts a CHAP challenge for c3po, containing a unique
    challenge string, and its fully qualified hostname, vlager.vbrew.com. C3po constructs
    a CHAP response in the manner we just discussed, and returns it to vlager. pppd
    now extracts the client hostname (c3po.vbrew.com) from response, and searches
    the c3po-secrets file for a line matching c3po as client, and vlager as the server.
    The second line does this, so pppd combines the CHAP challenge and the secret
    revert, pasteve, encrypts them, and compares the result to c3po''s CHAP response.


    The optional fourth field lists the IP addresses that are acceptable for the clients
    named in the first field. The addresses may be given in dotted notation or as
    hostnames that are looked up with the resolver. For instance, if c3po requests
