- pgno: 20
  md: '# Introduction


    The Linux System Administration White Papers is a printed edition of two online
    books (out of eight) hosted on the Linux Document Pages (LDP) Web site (http://metalab.unc.edu/LDP/).
    The Coriolis Group is exploring various ways to support Linux and the open source
    model of developing software. We felt that one way to accomplish this was to publish
    the LDP in two volumes; this one, and a second to focus on software development
    issues, entitled Linux Programming White Papers. Please be sure to look at the
    LDP for additional Linux resources. As part of this introduction, you will find
    the LDP Manifesto. Please read it, as it will provide you with more information
    on the LDP.


    By the grants outlined in the authors'' copyrights for this material, we are able
    to publish it in paper form. This also means that the material contained in this
    book is freely redistributable as long as the copyright provisions put in place
    by the authors are upheld. Please refer to Appendix A for the Linux Documentation
    Project Copying License that clearly states what these copyright provisions are.
    In addition, please refer to Appendix B for the GNU Public License, the license
    in which Linux is covered under. If you have additional questions, please refer
    to the GNU Project Web site at www.gnu.org.


    While reading this book you will notice that some material is bit outdated and
    some examples may be missing. The reason for this is that respecting the copyright
    provisions governing use of the LDP, we were not permitted to change the authors''
    material, even to correct errors and omissions; however, we did mark those places
    where we found missing or incorrect material. Be sure to refer to the online LDP
    for updated versions of the documentation in this book.


    The Coriolis Group is always looking for ways to further support Linux. If you
    would like to share an idea with us here on how we can do this, please contact
    us directly at ctp@coriolis.com. We look forward to your comments.


    The Coriolis Group'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Linux Revision 21 September 1998, by Michael K. Johnson


    This file describes the goals and current status of the Linux Documentation Project,
    including names of projects, volunteers, FTP sites, and so on.


    # Overview


    The Linux Documentation Project is working on developing good, reliable docs for
    the Linux operating system. The overall goal of the LDP is to collaborate in taking
    care of all of the issues of Linux documentation, ranging from online docs (man
    pages, texinfo docs, and so on) to printed manuals covering topics as installing,
    and running Linux. The LDP is essentially a loose team of volunteers with little
    central organization; anyone who is interested in helping is welcome to join the
    effort. feel that working together and agreeing on the direction and scope of
    Linux documentation is the best way to go, to reduce problems with conflicting
    efforts—two people writing two books on the same aspect of Linux wastes someone''s
    time along the way.


    The LDP is set out to produce the canonical set of Linux online and printed documentation.
    Because our docs will be freely available (like software licensed under the terms
    of the GNU GPL) and distributed on the net, we are able to easily update the documentation
    to stay on top of the many changes in the Linux world. If you are interested in
    publishing any of the LDP works, see the section “Publishing LDP Manuals,” below.


    # Getting Involved


    Send mail to linux-howto@metalab.unc.edu.


    Of course, you''ll also need to get in touch with the coordinator of whatever
    LDP projects you''re interested in working on; see the next section.


    # Current Projects


    For a list of current projects, see the LDP home page at http://metalab.unc.edu/LDP/.
    The best way to get involved one of these projects is to pick up the current version
    of the manual and send revisions, editions, or suggestions to the coordinator.
    You probably want to coordinate with the author before sending revisions so that
    you know you are working together.


    # FTP Sites For LDP Works


    LDP works can be found on metalab.unc.edu in the directory /pub/Linux/docs. LDP
    manuals are found in /pub/Linux/docs/LDP, HOWTOs and other documentation found
    in /pub/Linux/docs/HOWTO.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Documentation Conventions


    Here are the conventions that are currently used by LDP manuals. If you are interested
    in writing another manual using different conventions, please let us know of your
    plans first.


    The man pages—the Unix standard for online manuals—are created with the Unix standard
    nroff man (BSD mdoc) macros.


    The guides—full books produced by the LDP—have historically been done in LaTeX,
    as their primary goal has to be printed documentation. However, guide authors
    have been moving towards SGML with the DocBook DTD, because it allows them to
    create more kinds of output, both printed and online. If you use LaTeX, we have
    a style file you can use to keep your printed look consistent with other LDP documents,
    and we suggest you use it.


    The HOWTO documents are all required to be in SGML format. Currently, they use
    the linux DTD, which is quite simple. There is a move a to switch to the DocBook
    DTD over time.


    LDP documents must be freely redistributable without fees paid to the authors.
    It is not required that the text be modifiable, but it is encouraged. You can
    come up with your own license terms that satisfy this constraint, or you can use
    a previously prepared license. The LDP provides a boilerplate license that you
    can use, some people like to use the GPL, and others write their.


    The copyright for each manual should be in the name of the head writer or coordinator
    for the project. “The Linux Documentation Project” isn''t a formal entity and
    shouldn''t be used to copyright the docs.


    # Copyright And License


    Here is a “boilerplate” license you may apply to your work. It has not been reviewed
    by a lawyer; free to have your own lawyer review it (or your modification of it)
    for its applicability to your desires. Remember that in order for your document
    to be part of the LDP, you must allow unlimited reproduction and distribution
    without fee.


    This manual may be reproduced and distributed in whole or in part, without fee,
    subject to the following conditions:


    +   * The copyright notice above and this permission notice must be preserved
    on all complete and partial copies.


    +   * Any translation or derived work must be approved by the author in writing
    before distribution.


    +   * If you distribute this work in part, instructions for obtaining the complete
    version of this manual must be included, and a means for obtaining a complete
    version provided.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '+   Small portions may be reproduced as illustrations for reviews or quotes
    in other works without this permission notice if proper citation is given.


    Exceptions to these rules may be granted for academic purposes: Write to the author
    and ask. These restrictions are here to protect us as authors, not to restrict
    you as learners and educators.


    All source code in this document is placed under the GNU General Public License,
    available via anonymous FTP from http://prep.ai.mit.edu/pub/gnu/COPYING.


    # Publishing LDP Manuals


    If you''re a publishing company interested in distributing any of the LDP manuals,
    read on. By the license requirements given previously, anyone is allowed to publish
    and distribute verbatim copies of the Linux Documentation Project manuals. You
    don''t need our explicit permission for this. However, if you would like to distribute
    a translation or derivative work based on any of the LDP manuals, you may need
    to obtain permission from the author, in writing, before doing so, if the license
    requires that.


    You may, of course, sell the LDP manuals for profit. We encourage you to do so.
    Keep in mind, however, that the LDP manuals are freely distributable, anyone may
    photocopy or distribute printed free copies of charge, if you wish to do so.


    We do not require you to be paid royalties for any profit earned from selling
    LDP manuals. However, we would like to suggest that if you sell LDP manuals for
    profit, that you either offer the author royalties, or donate a portion of your
    earnings to the author, the LDP as a whole, or to the Linux development community.
    You may also wish to send one or more free copies of the LDP manuals that you
    are distributing to the authors. Your show of support for the LDP and the Linux
    community will be very appreciated.


    We would like to be informed of any plans to publish or distribute LDP manuals,
    so just we know how they''re becoming available. If you are publishing or planning
    to publish any LDP manuals, please send mail to ldp@linux.org.au. It''s nice to
    know who is doing what.


    We encourage Linux software distributors to distribute the LDP manuals (such as
    the Installation And Getting Started Guide) with their software. The LDP manuals
    are intended to be used as the "official" Linux documentation, and we are glad
    to see mail-order distributors bundling the LDP manuals with the software. As
    the LDP manuals mature, hopefully they will fulfill this goal more and more adequately.'
