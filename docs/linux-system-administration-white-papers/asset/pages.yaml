    # Using the passwd And group Maps


    One of the major applications of NIS is in synchronizing user and account information
    on all hosts in a NIS domain. To this end, you usually keep a small local /etc/passwd
    file, to which the site-wide information from the NIS maps is appended. However,
    simply enabling NIS lookups for this service in nswitch.conf is not fast enough.


    When relying on the password information distributed by NIS, you first have to
    make sure that the numeric IDs of users you have in your local passwd file match
    the NIS server''s idea of user IDs. You will want this for other purposes as well,
    making NFS volumes from other hosts in your network.


    If any of the numeric IDs in /etc/passwd or /etc/group deviate from those in the
    maps, you will have to adjust file ownership for all files that belong to that
    user. First you should change all uids and gills in passwd and group to the new
    values; then find all files that belong to the users just changed, and finally
    change their ownership. Assume news used to have a user ID of 9, and okir had
    user ID of 103, which were changed to some other value; you could then issue the
    following commands:


    ```

    # find -uid 9 -exec chown news () \\

    followed by a

    # find -uid 103 -exec chown okir () \\

    ```'
