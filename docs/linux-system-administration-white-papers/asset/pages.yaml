- pgno: 242
  md: '+   site—This is the name of the site entry applies to. One usually chooses
    the site''s UUCP name for this. There has to be an entry for your sys file, too,
    or else you will not receive any articles yourself.


    The special name ME denotes your site. The ME entry defines all groups you are
    willing to store locally. Articles that aren''t matched by the ME line will go
    to the junk group.


    Because C-News checks against the site names in the Path: header field, you have
    to make sure they really match. Some sites use their fully qualified domain name
    in this field or an alias like news.site.domain. To prevent any articles from
    being returned to these sites, you have to add these to the exclusion list, separated
    by commas.


    For the entry applying site moria, the instance field would contain moria/moria.orc.net.


    +   grouplist—This is a comma-separated list of groups and hierarchies for that
    particular site. A hierarchy may be specified by giving the hierarchy''s prefix
    (such as comp for all groups whose name start with this prefix), optionally followed
    by the keyword all (e.g., comp.os.all).


    A hierarchy or group is excluded from forwarding by preceding it with an exclamation
    mark. For example, if a newsgroup is checked against the list, the longest match
    applies.


    ```

    comp,comp.os.linux,comp.folklore.computers

    ```


    no groups from the comp hierarchy except comp.folklore.computers and all groups
    below comp.os.linux will be fed to that site.


    If the site requests to forward all news you receive yourself, enter all as grouplist.


    +   distelist—is offset from the grouplist by a slash, and contains a list of
    distributions to be forwarded. Again, you may exclude certain distributions by
    preceding them with an exclamation mark. All distributions are denoted by all.
    Omitting distelist implies a list of all. For example, you may use a distribution
    list to prevent news for local use from being sent to remote sites.


    There are at least two distributions: world, which is often the default distribution
    used when none is specified by the user, and local. There may be other distributions
    that apply to a certain region, state, country, and so on. Finally, there are
    two distributions used by C-News only; these are sende and ihave, and are used
    for the sende/ihave protocol.


    The use of distributions is a subject of debate. For some, newsreaders create
    bogus distributions by simply using the top-level hierarchy, for example when
    posting to comp.os.linux. Distributions that apply to regions are often questionable,
    too, because news travel outside of your region when sent across the Internet.
    Distributions applying to an organization, however, are very meaningful, for example,
    to prevent'
