    # Control Messages


    The Usenet news protocol knows a special category of articles which evoke certain
    re-

    sponses or actions by the news system. These are called control messages. They
    are recognized

    by the presence of a Control field in the article header, which contains the name
    of the

    control operation to be performed. There are several types of them, all of which
    are handled

    by shell scripts located in /usr/lib/news/ctl.


    Most of these will perform their action automatically at the time the article
    is processed by

    C-News, without notifying the newsmaster. By default, only checkgroups messages
    will be

    handed to the newsmaster (there''s a funny typo in RFC-1036 (p. 12): “Implementers
    and

    administrators may choose to allow control messages to be carried out automatically,
    or to

    queue them for annual processing”), you may change this by editing the scripts.


    # The cancel Message


    The most widely message is cancel, with which a user may cancel an article sent

    erlier. This effectively removes the article from the spool directories, if it
    exists. The can-

    cel message is forwarded to all sites that receive news from the groups affected,
    regardless of

    whether the article has been seen or not. This is to take into account the possibility

    that the original article has been delayed over the cancellation message. Some
    news systems

    allow users to cancel other person''s messages; this is of course a definite no-no.


    # newgroup And rmgroup


    Two messages dealing with creation or removal of newsgroups are the newgroup and
    rmgroup

    message. Newgroups below the “usual” hierarchies may be created only after a discussion

    and voting has been held among Usenet readers. The rules applying to the alt hierarchy

    allow for something close to anarchy. For more information, see the regular postings
    in

    news.announce.users and news.announce.newgroups. Never send a newgroup or rmgroup

    message unless you know that you are allowed to.


    # The checkgroups Message


    checkgroups messages are sent by news administrators to make all sites within
    a network

    synchronize their active files with the realities of Usenet. For example, commercial
    Internet

    service providers might send out such a message to their customers’ sites. Once
    a month,'
