- pgno: 285
  md: '# Introduction


    While this manual is targeted at Linux, a general principle has been that it should
    be useful with other Unix-based operating systems as well. Unfortunately, since
    there is so much variance between different versions of Unix in general, and in
    system administration in particular, there is little hope to cover all variants.
    Even covering all possibilities for Linux is difficult, due to the nature of its
    development.


    There is no official Linux distribution, so different people have different setups,
    and many people have a setup they have built up themselves. This book is not targeted
    at any one distribution, even I use the Debian GNU/Linux system almost exclusively.
    When possible, I have tried to point out differences and explain several alternatives.


    I have tried to describe how things work, rather than just listing "five steps"
    for each task. This means that there is more information here that is not necessary
    for everyone, but those parts are marked as such and can be skipped if you use
    a pre-configured system. Reading everything will naturally, increase your understanding
    of the system and should make using and interpreting it more pleasant.


    Like all other Linux-related development, the work was done on a volunteer basis:
    I did because I thought it would be fun and I felt it should be done. However,
    there is a limit to how much effort I have been able to spend, and also on how
    much knowledge and experience I have. This means that the manual is not necessarily
    as good as it would be if a wizard had paid handsomely to write it and had spent
    a few years to perfect it. I, think, of course, that it is pretty nice, but be
    warned.


    One particular point where I have cut corners is I have not covered thoroughly
    many things that are already documented in other freely available manuals. This
    applies especially to program specific documentation, such as all the details
    of using mkfs. I only describe the purpose of the program, and as much of its
    usage is as necessary for the purposes of this manual. For further information,
    I refer the gentle reader to these other manuals. Usually, all of the referred
    to documentation is part of the full Linux documentation.


    Although I have tried to make this manual as good as possible, I would really
    like to hear from you any ideas on how to make it better. Bad language, factual
    errors, ideas for new areas to cover, rewrite sections, information about how
    various Unix versions do things, I am interested in all of it. My contact information
    is available via the World Wide Web at http://www.iki.fi/liw/mail-to-lasu.html.


    Many people have helped me with this book, directly or indirectly. I would like
    to especially thank Matt Welsh for inspiration and LDP leadership, Andy Orm for
    getting me to work again with much-valued feedback, Olaf Kirch for showing me
    that it can be done, and Adam Richter from Yggdrasil and others for showing me
    that other people can find interest as well.'
  merge: -1
  img_proc: true
