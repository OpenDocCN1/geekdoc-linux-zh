    \ beginning.\n#\nThe entry '[NOTFOUND=return]' means that the search for an\n\
    #entry should stop if the search in the previous entry turned\n#up nothing. Note\
    \ that if the search failed due to some reason\n#(like no NIS server responding)\
    \ then the search continues with the\n#next entry.\n#\n#Legal entries are:\n#\n\
    nisplus or nis+ Use NIS+ (NIS version 3)\nis or yp Use NIS (NIS version 2), also\
