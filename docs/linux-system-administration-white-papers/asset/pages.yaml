- pgno: 366
  md: '# Chapter 9

    Backups


    Hardware is indeterministically reliable. Software is deterministically unreliable.
    People are indeterministically unreliable. Nature is deterministically reliable.


    This chapter explains about why, how, and when to make backups, and how to restore
    things from backups.


    # On The Importance Of Being Backed Up


    Your data is valuable. It will cost you time and effort to re-create it, and costs
    money or least personal grief and tears; times it can''t even be re-created, that
    is, if it is the results of some experiments. Since it is an investment, you should
    protect it and take steps to avoid losing it.


    There are basically four reasons why you might lose data: hardware failures, software
    bugs, human action, or natural disasters. (The fifth reason is "something else.")
    Although modern hardware tends to be quite reliable, it can still break seemingly
    spontaneously. The most critical piece of hardware for storing data is the hard
    disk, which relies on tiny magnetic fields remaining intact in a world filled
    with electromagnetic noise. Modern software doesn''t even tend to be reliable;
    a rock-solid program is an exception, not a rule. Humans are quite unreliable;
    they will either make a mistake, or will be malicious and destroy data on purpose.
    Nature might not be evil, but it can wreak havoc even being good. In all, it is
    a small miracle that anything works at all.


    Backups are a way to protect the investment in data. By having several copies
    of the data, it does not matter as if one is destroyed (the cost is only that
    of the restoration of the lost data from the backup).'
  merge: -1
  img_proc: true
- pgno: 367
  md: 'It is important to do backups properly. Like everything else that is related
    to the physical world, backups will fail sooner or later. Part of doing backups
    well is to make sure they work; you don''t want to notice that your backups didn''t
    work. (Don''t laugh. This has happened to several people.) Adding insult to injury,
    you might have had a bad crash just as you''re making the backup; if you have
    only one backup medium, it might be destroyed as well, leaving you with the smoking
    ashes of hard work. (Been there, done that...) Or you might notice, when trying
    to restore, that you forgot back something important, like the user database on
    a 15,000-user site. Best of all, your backups might be working perfectly, but
    the last known tape driving the kind of tapes you used was the one that now has
    a bucket of water in it.


    When it comes to backups, paranoia is in the job description.


    # Selecting The Backup Medium


    The most important decision regarding backups is the choice of backup medium.
    You need to consider cost, reliability, speed, availability, and usability.


    Cost is important, since you should preferably several times more backup storage
    than what you need for data. A cheap medium is usually a must.


    Reliability is extremely important, since a broken backup can make a grown man
    cry. A backup medium must be able to hold data without corruption for years. The
    way you use the medium affects its reliability as a backup medium. A hard disk
    is typically very reliable, as a backup medium is not very reliable, if it is
    in the same computer as the disk you are backing up.


    Speed is usually not important, if backups can do without interaction. It doesn''t
    matter if a backup takes two hours, as long as it needs no supervision. On the
    other hand, if the backup can''t be done when the computer would otherwise be
    idle, then speed is an issue.


    Availability is obviously necessary, since you can''t use a backup medium if it
    isn''t exist. Less obvious is the need for the medium to be available even in
    the future, and on computers other than yours. Yours may not be able to restore
    your backups after a disaster.


    Usability is a large factor in how often backups are made. The easier it is to
    make backups, the better. A backup medium mustn'' be hard or boring to use.


    The typical alternatives are floppies and tapes. Floppies are very cheap, fairly
    reliable, not very fast, very available, but not very usable for large amounts
    of data. Tapes are cheap to somewhat expensive, fairly reliable, fairly fast,
    quite available, and, depending on the size of the tape, quite comfortable.


    There are other alternatives. They are usually not very good on availability,
    but if that is not a problem, they can be better in other ways. For example, magneto-optical
    disks can have'
  merge: -1
  img_proc: true
- pgno: 368
  md: 'good sides of both floppies (they''re random access, making restoration of
    a single file quick) and tapes (contain a lot of data).


    # Selecting The Backup Tool


    There are many tools that can be used to make backups. The traditional Unix tools
    used for backups are tar, cpio, and dump. In addition, there are large number
    of third-party packages (both freep and commercial) that can be used. The choice
    of backup medium can affect the choice of tool.


    tar and cpio are similar, and mostly equivalent from a backup point of view. Both
    are capable of storing files on tapes, and retrieving them from them. Both are
    capable of using almost any media, since the kernel device drivers take care of
    the low-level device handling and the devices. Some versions of tar and cpio may
    have problems with unusual files (symbolic links, device files, files with very
    long path names, and so on), but the Linux versions should handle all files correctly.


    dump is different in that it reads the filesystem directly and not via the filesystem.
    It is also written specifically for backups; tar and cpio are for archiving files,
    although they work for backups as well.


    Reading the filesystem has some advantages. It makes it possible to back up files
    without affecting their time stamps; for tar and cpio, you would have to make
    the filesystem read-only. Directly reading the filesystem is also more effective,
    if everything needs to be backed up, since it can be done with less disk head
    movement. The major disadvantage is that it makes the backup program specific
    to one filesystem type; the Linux dump program understands the ext2 filesystem
    only.


    dump also supports backup levels (which we''ll be discussing below); with tar
    and cpio this needs to be implemented with other tools.


    A comparison of the third-party backup tools is beyond the scope of this book.
    The Linux Software Map lists the freeware ones.


    # Simple Backups


    A simple backup scheme is to back everything once, then back up everything that
    has been modified since the previous backup. The first backup is a full backup,
    the subsequent are incremental backups. A full backup is often more laborious
    than incremental ones, since there is more data to write to the tape and a full
    backup might not fit onto one tape (or floppy). Restoring from incremental backups
    can be optimized so that you always back up everything since the previous full
    backup; this way, backups are a bit more work, but there should never be a need
    to restore more than a full backup and an incremental backup.'
  merge: -1
  img_proc: true
- pgno: 369
  md: '# The Linux System Administrators'' Guide: Chapter 9


    If you want to make backups every day and have use tape 1 for the first full backup
    (say, on a Friday), and tapes 2 to 5 for the incremental backups (Monday through
    Thursday). Then you make a new full backup on tape 6 (Friday), and start incremental
    ones with tapes 2 to 5. You don''t want to overwrite tape 1 until you''ve got
    a new full backup, let something happens while you''re making the full backup.
    After you''ve made a full backup on tape 6, you want to keep tape 1 somewhere,
    so that when your other backup tapes are destroyed in the fire, you still have
    at something left. When you need to make the next full backup, you fetch tape
    1 and leave tape 6 in its places.


    If you have more than six tapes, you can use the extra ones for full backups.
    Each time you make a full backup, you use the oldest tape. This way you can have
    full backups from several previous weeks, which is good if you want to find an
    old, now deleted file, or an old version of a file.


    # Making Backups With tar


    A backup can easily be made with tar:


    ```

    # tar -create -file /dev/ftape /usr/src

    tar: Removing leading / from absolute path names in the archive

    #

    ```


    The example above uses the GNU version of tar and its long option names. The traditional
    version of tar only understands single character options. The GNU version can
    also handle backups that do not fit on one tape or floppy, and also very long
    paths; not all traditional versions can do these things. (Linux only uses GNU
    tar.)


    If your backup doesn''t fit on one tape, you need to use the multi-volume (-M)
    option:


    ```

    # tar -CMF /dev/fdH1440 /usr/src

    tar: Removing leading / from absolute path names in the archive

    Prepare volume #2 for /dev/fdH1440 and hit return:

    #

    ```


    Note that you should format the floppies before you begin the backup, or use another
    window or virtual terminal and do it when tar asks for a new floppy.


    After you''ve made a backup, you should check that it is OK, using the -compare
    (d) option:


    ```

    # tar -compare -verbose -f /dev/ftape

    usr/src/

    usr/src/linux

    usr/src/linux-1.2.10-includes/

    ...

    #

    ```'
  merge: -1
  img_proc: true
- pgno: 370
  md: 'Failing to check a backup means that you will not notice that your backups
    aren’t working until you''ve lost the original data.


    An incremental backup can be done with tar using the (-N) option:


    ```

    # tar -newer ''8 Sep 1995'' -file /dev/ftape /usr/src -verbose

    tar: Removing leading / from absolute path names in the archive

    usr/src/

    usr/src/linux-1.2.10-includes/

    usr/src/linux-1.2.10-includes/include/

    usr/src/linux-1.2.10-includes/include/linux/

    usr/src/linux-1.2.10-includes/include/linux/modules/

    usr/src/linux-1.2.10-includes/include/asm-generic/

    usr/src/linux-1.2.10-includes/include/asm-i386/

    usr/src/linux-1.2.10-includes/include/asm-mips/

    usr/src/linux-1.2.10-includes/include/asm-alpha/

    usr/src/linux-1.2.10-includes/include/asm-m68k/

    usr/src/linux-1.2.10-includes/include/asm-sparc/

    usr/src/patch-1.2.11.gz

    #

    ```


    Unfortunately, tar can’t notice when a file’s node information has changed, for
    example, that its permission bits have been changed, or its name has been changed.
    This can be worked around using find and comparing current filesystem state with
    lists of files that have been previously backed up. Scripts and programs for doing
    this can be found on Linux ftp sites.


    # Restoring Files With tar


    The -extract (-x) option for tar files:


    ```

    # tar -extract -same-permissions -verbose -file /dev/fd0H1440

    usr/src/

    usr/src/linux

    usr/src/linux-1.2.10-includes/

    usr/src/linux-1.2.10-includes/include/

    usr/src/linux-1.2.10-includes/include/linux/

    usr/src/linux-1.2.10-includes/include/linux/hdreg.h

    usr/src/linux-1.2.10-includes/include/linux/kernel.h

    #

    ```


    You also extract only specific files or directories (which includes all their
    files and subdirectories) by running the following command:


    ```

    # tar xpv /dev/fd0H1440 usr/src/linux-1.2.10-includes/include/linux/hdreg

    usr/src/linux-1.2.10-includes/include/linux/hdreg

    #

    ```'
  merge: -1
  img_proc: true
- pgno: 371
  md: '# The Linux System Administrators'' Guide: Chapter 9


    Use the list (-t) option, if you just want to see what files are on a backup volume:


    ```

    # tar -list -file /dev/fd0H1440

    usr/src/

    usr/src/linux-1.2.10-includes/

    usr/src/linux-1.2.10-includes/include/

    usr/src/linux-1.2.10-includes/include/linux/

    usr/src/linux-1.2.10-includes/include/linux/hdreg.h

    usr/src/linux-1.2.10-includes/include/linux/kernel.h


    ```


    Note that tar always reads the backup volume sequentially, so for large volumes
    it is rather slow. It is not possible, however, to use random-access database
    techniques when using a tape drive or some sequential medium.


    tar doesnt handle deleted files properly. If you need to restore a file system
    from a full and incremental backup, and you have deleted a file between the two
    backups, it will exist again after you have done the restore. This can be a big
    problem, if the file has sensitive data that should no longer be available.


    # Multilevel Backups


    The simple backup method outlined in the previous section is often adequate for
    personal use or small sites. For heavy duty use, multilevel backups are more appropriate.


    The simple method has two backup levels: full and incremental backups. A full
    backup would be level 0, and the different levels of incremental backups levels
    1, 2, 3, and so on. At each incremental backup level you back everything that
    has changed since the previous backup at same or a previous level.


    The purpose for doing this is that it allows a longer backup history cheaply.
    In the example in the previous section, backup history went back to the previous
    full backup. This could be extended by having more tapes, but only a week per
    new tape, which might be too expensive. A longer backup history is useful, because
    deleted or corrupted files are often not noticed for a long time. Even a version
    of a file that is not very up to date is better than no file at all.


    With multilevel backups the backup history can be extended more cheaply. For example,
    if we use ten tapes, could use tapes 1 and 2 for monthly backups (first Friday
    each month), tapes 3 to 6 for weekly backups (other Fridays); note that there
    are five Fridays in one month, so we need four more tapes, and tapes 7 to 10 for
    daily backups (Monday to Thursday). With only four more tapes, we''ve been able
    to extend the backup history from two weeks (after all daily tapes have been used)
    to two months. It is true that we can''t restore every version of each file during
    those two months, but what we can restore is often enough.'
  merge: -1
  img_proc: true
- pgno: 372
  md: 'Backups 349


    | ↓ | | | ↓ | ↓ | ↓ | | | Restorable |

    | 1 | 3 | 4 | 5 | 6 | 2 | 3 | 4 | 5 | Tape number |

    | 02221 | 22221 | 22221 | 22221 | 22220 | 22221 | 22221 | 22221 | 222 | Backup
    level |

    |---|---|---|---|---|---|---|---|---|---||

    | 1 | 8 | 15 | 22 | 29 31 | 8 | 15 | 22 | 29 31 | Day of Month |

    | Mon | Mon | Mon | Mon | Mon | Mon | Mon | Mon | Mon | |


    Figure 9.1


    A sample multilevel schedule.


    Figure 9.1 shows which backup level is used each day, and which backups can be
    restored from the end of the month.


    Backup levels can also be used to keep filesystem restoration time to a minimum.
    If you have many incremental backups with monotonically growing level numbers,
    you need to restore all of them if you need to rebuild the whole filesystem. Instead
    you can use level numbers that are not monotonous, and keep down the number of
    backups to restore.


    To minimize the number of tapes to restore, you could use a smaller level for
    each incremental tape. However, the time to make the backups increases (each backup
    copies everything since the full backup). A better scheme is suggested by the
    dump manual page and described by the Table 9.1 (efficient backup levels). Using
    the following succession of backup levels: 3, 2, 5, 4, 7, 6, 9, 8, 9, and so forth.
    This keeps the backup and restore time low. The most you have to backup is two
    days'' worth of work. The number of tapes for a restore depends on how long you
    keep between full backups, but it is less than in the simple schemes.


    A fancy scheme can reduce the amount of labor needed, but it does mean there are
    more to keep track of. You must decide if it is worth it.


    # Table 9.1 Efficient backup scheme using many levels.


    | Tape | Level | Backup (days) | Restore tapes |

    |---|---|---|---|

    | 1 | 0 | n/a | 1 |

    | 2 | 3 | 1 | 1, 2 |

    | 3 | 2 | 2 | 1, 3 |

    | 4 | 5 | 1 | 1, 2, 4 |

    | 5 | 4 | 2 | 1, 2, 5 |

    | 6 | 7 | 1 | 1, 2, 5, 6 |

    | 7 | 6 | 2 | 1, 2, 7 |

    | 8 | 9 | 1 | 1, 2, 5, 7, 8 |

    | 9 | 8 | 2 | 1, 3, 5, 7, 9 |

    | 10 | 9 | 1 | 1, 2, 5, 7, 9, 10 |

    | 11 | 9 | 1 | 1, 2, 5, 7, 9, 10, 11 |

    | ... | 9 | 1 | 1, 2, 5, 7, 9, 10, 11 |'
  merge: -1
  img_proc: true
- pgno: 373
  md: '350 The Linux Administrators'' Guide: Chapter 9


    dump has built-in support for backup levels. For tar and cpio it must be implemented
    with shell scripts.


    # What To Back Up


    You want to back up as much as possible. The major exception is software that
    can be easily reinstalled (you get to decide what''s easy; some people consider
    installing from dozens of floppies easy), but even they may have configuration
    files that it is important to back up, lest you need to do all the work to configure
    them all over again. Another major exception is the /proc filesystem; since it
    contains only data that the kernel always generates automatically, it is never
    a good idea to back it up. Especially the /proc/kcore file is unnecessary, since
    it is just an image of your current physical memory; it''s pretty large as well.


    Gray areas include the news spool, log files, and many other things in /var. You
    must decide what you consider important.


    The obvious things to back up are user files (home) and system configuration files
    (/etc, but possibly other things scattered all over the filesystem).


    # Compressed Backups


    Backups take a lot of space, which can cost quite a lot of money. To reduce the
    space needed, the backups can be compressed. There are several ways of doing this.
    Some programs have support for compression built in; for example, the -gzip (±)
    option for GNU tar pipes the whole backup through the gzip compression program,
    before writing it to the backup medium.


    Unfortunately, compressed backups can cause trouble. Due to the nature of how
    compression works, if a single bit is wrong, the rest of the compressed data will
    be unusable. Backup programs have some built-in error correction, but no method
    can handle a large number of errors. This means that if the backup is compressed
    the GNU tar does, with the whole output compressed as a unit, a single error makes
    all the rest of the backup lost. Backups must be reliable, and this method of
    compression is not a good idea.


    An alternative way is to compress each file separately. This still means that
    one file is lost, but all other files are unharmed. The lost file would have been
    corrupted anyway, so this situation is not worse than not using compression at
    all. The afio program (a variant of cpio) can do this.


    Compression takes some time, which may make the backup unable to write data fast
    enough for a tape drive. (If a tape drive doesn''t data fast enough, it has to
    stop; this makes backups even slower, and can be bad for the tape and the drive.)
    This can be avoided by buffering the output (either internally, the backup program
    if smart enough, or by using another program), but even that might not work well
    enough. This should only be a problem for slow computers.'
  merge: -1
  img_proc: true
- pgno: 374
  md: '# Chapter 10


    # Keeping Time


    > "Time is an illusion.

    Lunchtime double so."

    —Douglas Adams


    This chapter explains how a Linux system keeps time, and what you need to do to
    avoid causing trouble. Usually, you don''t need to do anything about time, but
    it is good to understand it.


    # Time Zones


    Time measurement is based on mostly regular natural phenomena, such as alternating
    light and dark periods caused by the rotation of the planet. The total time taken
    by two successive periods is constant, but the lengths of the light and dark period
    vary. One simple constant is noon.


    Noon is the time of the day when the sun is at its highest position. Since the
    earth is round (according to recent research), noon happens at different times
    in different places. This leads to the concept of local time. Humans measure time
    in many units, most of which are tied to natural phenomena like noon. As long
    as you stay in the same place, it doesn''t matter that local times differ.


    As soon as you need to communicate with distant places, you''ll notice the need
    for a common time. In modern times, most of the places in the world communicate
    with most other places in the world, so a global standard for measuring time has
    been defined. This time is called universal time (UT or UTC), formerly known as
    Greenwich Mean Time or GMT, since it is used to be local time in Greenwich, England).
    When people with different local times need to communicate, they can express times
    in universal time, so that there is no confusion about when things should happen.'
  merge: -1
  img_proc: true
- pgno: 375
  md: '# 352 The Linux System Administrators'' Guide: Chapter 10


    Each local time is called a time zone. While we geography would allow all places
    that have noon at the same time have the same time zone, politics makes it difficult.
    For various reasons, many countries use daylight savings time, that is, they move
    their clocks to have more natural light while they work, and then move the clocks
    back during winter. Other countries do not do this. That do, do not agree when
    the clocks should be moved, and they change the rules from year to year. This
    makes time conversions definitely nontrivial.


    Time zones are based on the location or by telling the difference between local
    and universal time. In the U.S. and some other countries, the local time zones
    have a name and a three-letter abbreviation. The abbreviations are not unique,
    and should not be used unless the country is also named. It is better to talk
    about the local time in, Helsinki, than before Eastern European time, not all
    countries in Eastern Europe follow the same rules.


    Linux has a time zone package that knows about all existing time zones, and can
    easily be updated when the rules change. All the system administrator needs to
    do is select the appropriate time zone. Also each user can set his own time zone;
    this is important many people work with computers in different countries over
    the Internet. When the rules for daylight savings time change in your local time
    zone, make sure you upgrade at least that part of your Linux system. Other than
    setting the system time zone and upgrading the time data files, there is little
    to bother about.


    # The Hardware And Software Clocks


    A personal computer has a battery-driven hardware clock. The battery ensures that
    the clock will work even if the rest of the computer is without electricity. The
    hardware clock can be set from the BIOS setup screen or whatever operating system
    is running.


    The Linux kernel keeps track of time independently from the hardware clock. During
    the boot, Linux sets its own clock to the same time as the hardware clock. After
    this, both clocks run independently. Linux maintains its own clock because looking
    at the hardware is slow and complicated.


    The kernel clock always shows universal time. This way, the kernel does not need
    to know about time zones at all. The simplicity results in higher reliability
    and makes it easier to update the time zone information. Each process handles
    time zone conversions itself (using standard tools that are part of the time zone
    package).


    The hardware clock can be in local time or universal time. It is usually better
    to have it in universal time, because then you don''t need to change the hardware
    clock when daylight savings time begins or ends (UTC does not have DST). Unfortunately,
    some PC operating systems, including MS-DOS, Windows, and OS/2, assume the hardware
    clock shows local time. Linux can handle either, but if the hardware clock shows
    local time, then it must be modified when daylight savings time begins or ends
    (otherwise it wouldn''t show local time).'
  merge: -1
  img_proc: true
- pgno: 376
  md: '# Showing And Setting Time


    In the Debian system, the system time zone is determined by the symbolic link
    /etc/localtime. This link points at a time zone data file that describes the local
    time. The time zone data files are stored in /usr/lib/zoneinfo. Other Linux distributions
    may do this differently.


    A user can change his private time zone by setting the TZ environment variable.
    If it is unset, the system time zone is assumed. The syntax of the TZ variable
    is described in the tzset manual page.


    The command shows the current date and time. (Beware of the time command, does
    not show the current time.) For example:


    ```

    $ date

    Sun Jul 14 21:53:41 EET DST 1996

    $

    ```


    That time is Sunday, 14th of July, 1996, and at about ten before ten at the evening,
    in the time called "EET DST" (which might be East European Daylight Savings Time).
    date can also show the universal time:


    ```

    $ date -u

    Sun Jul 14 18:53:42 UTC 1996

    Sun Jul 14 18:53:42 UTC 1996

    $

    ```


    date is also used to set the kernel''s software clock:


    ```

    # date 07142157

    Sun Jul 14 21:57:00 EET DST 1996

    # date

    Sun Jul 14 21:57:02 EET DST 1996

    $

    ```


    See the date manual page for more details, the syntax is a bit arcane. Only root
    can set the clock time. Although each user can have his own time zone, the clock
    is the same for everyone.


    date only shows or sets the software clock. The clock command synchronizes the
    hardware and software clocks. It is used when the system boots to read the hardware
    clock and set the software clock. If you need to set both clocks, you first set
    the software clock with date, and then the hardware clock with clock -w.


    The -u option to clock tells it that the hardware clock is in universal time.
    You must use the -u option correctly. If you don''t, your computer will be quite
    confused about what the time is.'
  merge: -1
  img_proc: true
- pgno: 377
  md: 'The clocks should be changed with care. Many parts of a Unix system require
    the clocks to work correctly. For example, the cron daemon runs commands periodically.
    If you change the clock, it can be confused of whether it needs to run the commands
    or not. On one early Unix system, someone set the clock 20 years into the future,
    and cron wanted to run all the periodic commands for 20 years all at. Current
    versions of cron can handle this correctly, but you should still be careful. Big
    jumps or backward jumps are more dangerous than smaller or forward ones.


    # ## When The Clock Is Wrong


    The Linux software clock is not always accurate. It is kept running by a periodic
    timer interrupt generated by PC hardware. If the system has too processes running,
    it may take too long to service the timer interrupt, and the software clock starts
    slipping behind. The hardware clock runs independently and is usually more accurate.
    If you boot your computer (as is the case for most systems that aren''t servers),
    it will usually keep fairly accurate time.


    If you need to adjust the hardware clock, it is usually simplest to reboot; go
    into the BIOS setup screen, and do it from there. This avoids all trouble that
    changing system time might cause. If doing it via BIOS is not an option, set the
    new time with date and clock (in order), and be prepared to reboot, if some part
    of the system starts acting funny.


    A networked computer (even if just over the modem) can check its own clock automatically,
    by comparing it to some other computer''s time. If the other computer is known
    to keep very accurate time, then both computers will keep accurate time. This
    can be done by using the rdate and netdate commands. Both check the time of a
    remote computer (netdate can handle several remote computers), and set the local
    computer''s time to that. By running these commands regularly, your computer will
    keep as accurate time as the remote computer.'
  merge: -1
  img_proc: true
- pgno: 378
  md: '# Glossary


    The Librarian of the Unseen University had laterally decided to aid comprehension
    by producing an Orangutan/Human Dictionary. He''d been working on it for three
    months. It wasn''t easy. He''d got far as ''Oook''...


    > Terry Pratchett, “Men At Arms”


    This is a short list of word definitions for concepts relating to Linux and system
    administration.


    ambition

    The act of writing funny sentences in the hope of getting them into the Linux
    cookie file.


    application program


    Software does something useful. The results of using an application program is
    what the computer was bought for. See also system program, operating system.


    daemon


    A process lurking in the background, usually unnoticed, until something triggers
    it into action. For example, the \cmd[update] daemon wakes every 30 seconds or
    to flush the buffer cache, and the \cmd[sendmail] daemon awakens whenever someone
    sends mail.


    filesystem


    The methods and data structures that an operating system uses to keep track of
    files on a disk or partition; the way files are organized on the disk. Also used
    about a partition or disk that is used to store the files or the type of filesystem.


    glossary


    A list of words and explanations of what they do. Not to be confused with a dictionary,
    which is also a list of words and explanations.'
  merge: -1
  img_proc: true
- pgno: 379
  md: '# 356 The Linux System Administrators’ Guide: Glossary


    # kernel


    Part of an operating system that implements the interaction with hardware and
    the sharing of resources. See also system program.


    # operating system


    Software that shares a computer’s resources (processor, memory, disk space, network
    bandwidth, and so on) between users and the application programs they run. Controls
    access to the system to provide security. See also kernel, system program, application
    program.


    # system call


    The services provided by the kernel to application programs, and the way in which
    they are invoked. See section 2 of the manual pages.


    # system program


    Programs that implement high-level functionality of an operating system, i.e.,
    things that aren’t directly dependent on the hardware. May sometimes require special
    privileges to run (that is, for delivering electronic mail), but often just commonly
    thought of as part of the system (e.g., a compiler). See also application program,
    kernel, operating system.'
  merge: -1
  img_proc: true
