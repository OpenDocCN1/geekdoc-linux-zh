    you have to trick the getty when invoking uucico instead of the usual /bin/login.
    With getty_, you can do this by setting the LOGIN option in the configuration
    file. However, this disables interactive logins altogether. mgetty, on the other
    hand, has a nice feature that you invoke different login commands based on the
    name user provided. For instance, you can tell getty to use uucp for all users
