    # Providing UUCP Accounts


    Next, you have to set user accounts that let remote sites log into your system
    establish a UUCP connection. Generally, you will provide a separate login name
    to each system that polls you. When setting up an account for system Pablo, you
    would probably give it Upablo as the username.


    For systems that dial in the serial port, you will have to add these accounts
    to the system password file, /etc/passwd. A good practice is to put all UUCP logins
    in a special group such as uuget. The account''s home directory should be set
    to the public spool directory /var/spool/uucpublic; its login shell must be uuuc.


    If you have the shadow password suite installed, you can do this with the useradd
    command:


    ```

    # useradd -d /var/spool/uucpublic -G uuget -s /usr/lib/uucp/uuuc

    ```


    If you don''t use the shadow password suite, you will probably have to edit /etc/passwd
    by hand, adding a line like that shown below, where 5000 and 150 are the numerical
    uid and gid assigned to user Upablo and group uuget, respectively.


    ```

    Upablo:x:5000:150:UUCP Account:/var/spool/uucpublic:/usr/lib/uucp

    ```


    After installing the account, you have to activate it by setting its password
    with the passwd command.


    To serve UUCP systems that connect to your site over TCP, you have to set up inetd
    to handle incoming connections on the uucp port. You do this by adding the following
    line to /etc/inetd.conf.


    ```

    uucp stream tcp nowait /usr/sbin/tcpd /usr/lib/uucp/uuuc

    ```


    > NotenUsually, tcpd has mode 700, so you must invoke it as user root, not uucp
    as you would usually do.'
