- pgno: 74
  md: '# Chapter 5

    Configuring TCP/IP Networking


    In this chapter, we will go through all the steps necessary to setting up TCP/IP
    networking on your machine. Starting with the assignment of IP addresses, we will
    slowly work our way through the configuration of TCP/IP network interfaces, and
    introduce a few tools that come quite handy when hunting down problems with your
    network installation.


    Most of the tasks covered in this chapter you will generally have to do only once.
    Afterwards, you have to touch much configuration files only when adding a new
    system to your network, or when you reconfigure your system entirely. Some of
    the commands used to configure TCP/IP, however, have to be executed each time
    the system is booted. This is usually done by invoking them from the system/etc/rc
    scripts.


    > Note There are two "major" schools regarding system initialization scripts:
    BSD-style and SysV init style. Red Hat Linux uses a modified SysV style init process.
    The reference here to the rc scripts, and the naming convention for the same,
    is to a BSD-style init process.


    Commonly, the network-specific part of this procedure is contained in a script
    called rc.net or rc.inet. Sometimes, you will also see two scripts named rc.inet1
    and rc.inet2, where the former initializes the kernel part of networking, and
    the latter starts basic networking services and applications. Throughout the following,
    I will adhere to the latter concept.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# The Linux Network Administrators'' Guide: Chapter 5


    Below, 1 will discuss the actions performed by rc.net1 and applications will be
    covered in later chapters. After finishing this chapter, you should have established
    a sequence of commands that properly configure TCP/IP networking on your computer.
    You should then replace any sample commands in rc.net1 with your commands, make
    sure rc.net1 is executed at startup time, and reboot your machine. The networking
    rc scripts that come along with your favorite distribution give you a good example.


    # Setting Up the proc Filesystem


    Some of the configuration tools of the Net-2 release rely on the proc filesystem
    for communicating with the kernel. (In version 2.2.x, the networking code is referred
    to as Net4.) This is an interface that permits access to kernel run-time information
    through a filesystem-like mechanism. When mounted, you can list its files like
    any other filesystem, or display their contents. Typical items include the loadavg,
    which contains the system load average, or meminfo, which shows current memory
    and swap usage.


    To this, the kernel adds the proc directory. It contains a number of files that
    show things like the kernel ARP tables, the state of TCP connections, and the
    routing tables. Most network administration tools get their information from these
    files.


    The proc filesystem (or profs, as it is also known) is usually mounted on /proc
    at system boot time. The best method is to add the following line to /etc/stab:


    ```

    # procs mount point:

    /proc        proc defaults

    ```


    and execute "mount /proc" from your /etc/rc script.


    The procs is nowadays into most kernels by default. If the procs is not in your
    kernel, you will get a message that reads "mount: fs type proc not supported by
    kernel". You will then have to recompile the kernel and answer "Yes" when asked
    for procs.


    # Installing the Binaries


    If you are using one of the prepackaged distributions, it will probably contain
    the major networking applications and utilities with a coherent set of sample
    files. The only case where you might have to install and install new utilities
    is when you install a new kernel release. As they occasionally involve changes
    in the kernel networking layer, you will need to update the basic configuration
    tools. This at involves recompiling, but sometimes you may also be required to
    obtain the latest set of binaries. These are usually distributed along with the
    kernel, packaged in an archive called net-XXX.tar.gz, where XXX is the version
    number. The release matching -1.0 is 0.32b, the latest kernel as of this writing
    (1.1.12 and later) require 0.32d.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'If you want to compile and install the standard TCP/IP network applications
    yourself, you can obtain the sources from most FTP servers. These are more or
    less heavily patched versions of programs from Net-BSD or other sources. Other
    applications, such as Xmosaic, Xarchie, or Gopher and IRC clients, must be obtained
    separately. Most of them compile out of the box if you follow the instructions.


    # Another Example


    For the remainder of this book, I will discuss a more practical example that is
    less complex than the Grouch Marx University example. Consider the Virtual Brewery,
    a small company that brews beer. To manage their business more efficiently, the
    virtual brewers want to network their computers, which are all PCs running a bright
    and shiny 1.0.


    On the same floor, just across the hall, the Virtual Winery, which works closely
    with the brewery. They run an Ethernet of their own. Quite naturally, the two
    companies can link their networks once they are operational. As a first step,
    they want to set up a gateway host that forwards datagrams between the two subnets.
    Later, they will want to have a UUCP link to the outside world, through which
    they exchange mail and news. In the long run, they also want to set up a SLIP
    connection to connect to Internet on occasion.


    # Setting The Hostname


    Most, if not all, network applications rely on the local host''s name having been
    set to some reasonable value. This is usually done during the boot procedure by
    executing the hostname command. To set the hostname to name, it is invoked


    ```

    # hostname name

    ```


    It is common practice to use the unqualified hostname without any domain name
    for this. For instance, hosts at the Virtual Brewery might be called vale.vbrew.com,
    vlager.vbrew.com, and so on. These are their official, fully qualified domain
    names. Their local hostnames would be only the first component of the name, such
    as vale. However, as the local hostname is frequently used to look up the host''s
    IP address, you have to make sure that the resolver library is able to look up
    the host''s IP address. This usually means that you have to enter the name in
    /etc/hosts (see below).


    Some people suggest to use the domain name to set the kernel''s idea of a domain
    name to the FQDN. In this way you could combine the output from hostname and domain
    name to get the FQDN again. However, this is at best only half correct. Domain
    name is generally used to set the host''s NIS domain, which may be entirely different
    from the DNS domain your host belongs to. NIS is covered in Chapter 9.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# Assigning IP Addresses


    If you configure the networking software on your host for standalone operation
    (for instance, to be able to run the INN networks software), you can skip this
    section because you will need an IP address for the loopback interface, which
    is always 127.0.0.1.


    Things are a little more complicated with real networks like Ethernets. If you
    want to connect your host to an existing network, you will have to ask its administrators
    to give you an IP address on this network. When setting up the network all by
    yourself, you have to assign IP addresses yourself, as described below.


    Hosts within a local network usually share addresses from the same logical IP
    network. Hence, you have to assign an IP network address. If you have several
    physical networks, you either have to assign them different network numbers or
    subnetting to split your IP address range into several subnets.


    If your network is not connected to the Internet, you are free to choose any (legal)
    network address. You only have to make sure to choose one from classes A, B, or
    C, or things will most likely not work. However, if you intend to get on the Internet
    in the near future, you should obtain an official IP address now. The best way
    to proceed is to ask your network service provider to help you. If you want to
    obtain a network number just in case you get on the Internet someday, request
    a Network Address Application Form from hostmaster@internic.net.


    To operate several Ethernets (or other networks, once a driver is available),
    you have to split your network into subnets. Note that subnetting is required
    only if you have more than one broadcast network; point-to-point links don''t
    count. For instance, if you have one Ethernet and one more SLIP links to the outside
    world, you don''t need to subnet your network. The reason for this will be explained
    in Chapter 6.


    To continue our example, the brewery''s network manager applies to the NIC for
    a class B network and is given 191.72.0.0. To accommodate the two Ethernets, she
    decides to use eight bits of the host part as additional subnet bits. This leaves
    another eight bits for the host part, allowing for 254 hosts on each of the subnets.
    She assigns subnet 1 to the brewery and gives the winery 2. Their respective network
    addresses are thus 191.72.1.0 and 191.72.2.0. The subnet mask is 255.255.255.0.


    vlager, which is the gateway between the two networks, is assigned a host number
    of 1 on both of them, which gives it the IP addresses 191.72.1.1 and 191.72.2.1,
    respectively. The following shows the two subnets and the gateway.


    ```

    # Hosts file for Virtual Brewery/Virtual Winery

    # IP        local fully qualified domain name

    ```'
