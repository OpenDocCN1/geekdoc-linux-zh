    PPP link with vlager because matches any hostname. The only requirement is that
    it knows the secret and uses the address of pub.vbrew.com. Entries with wildcard
    hostnames may appear anywhere in the secrets file, because pppd will always use
    the most specific entry that applies to a server/client pair.


    There are words to be said about the pppd runs at the hostnames it looks up in
    the secrets file. As explained before, the remote hostname is provided by the
    peer in the CHAP challenge or response packet. The local hostname will be derived
