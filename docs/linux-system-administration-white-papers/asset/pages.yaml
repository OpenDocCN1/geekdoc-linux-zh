- pgno: 314
  md: '# Using Disks And Other Storage Media


    The badblocks command can be used to search any disk or partition for bad blocks
    (including the floppy). It does not format the disk, so it can be used to check
    even existing filesystems. The example below checks a 3.5-inch floppy with two
    bad blocks.


    ```

    $ badblocks /dev/fd0H1440 1440

    718

    719

    $

    ```


    badblocks outputs the block numbers of the bad blocks it finds. Most systems can
    avoid such bad blocks. They maintain a list of known bad blocks, which is initialized
    when the filesystem is made, and can be modified later. The initial search for
    bad blocks can be done by the mkfs command (which initializes the filesystem),
    but later checks should be done with badblocks and the new blocks should be added
    with fsck. We recommend xcmd(mkfs) and fsck.


    Many modern disks automatically notice bad blocks and attempt to fix them by using
    a special, reserved good block inside. This is invisible to the operating system.
    This feature should be documented in the disk''s manual, if you''re curious if
    it is happening. Even such disks can fail, if the number of bad blocks grows too
    large, although chances are that by then the disk will be rotten as to be unusable.


    # Partitions


    A hard disk can be divided into several partitions. Each partition functions as
    if a separate disk. The idea is that if you have one hard disk, and want to have,
    say, two operating systems on it, you can divide the disk into two partitions.
    Each operating system uses its partition as it wishes and doesn''t touch the other
    one''s. This way the two operating systems can coexist peacefully on the same
    hard disk. Without partitions one would have to buy a hard disk for each operating
    system.


    Floppies are not partitioned. There is no technical reason against this, but since
    they''re small, partitions would be used very rarely. CD-ROMs are usually also
    unpartitioned, since it''s easier to use them as one big disk, and there is seldom
    a need to have several operating systems on one.


    # The MBR, Boot Sectors, And Partition Table


    The information about how a hard disk has been partitioned is stored in its first
    sector (that is, the first sector of the first track on the disk surface). The
    first sector is the master boot record (MBR) of the disk; this is the sector that
    the BIOS reads in and starts when the machine is first booted. The master boot
    record contains a small program that reads the partition table, checks which partition
    is active (that is, marked bootable), and reads the first sector of that partition,
    the partition''s boot sector (the MBR is also a boot sector, but it'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# The Linux System Administrators'' Guide: Chapter 3


    has a special status and therefore a special name). This boot sector contains
    another small program that reads the first part of the operating system stored
    on that partition (assuming it is bootable) and then starts it.


    The partitioning scheme is not built into the hardware, or even into the BIOS.
    It is only a convention that many operating systems follow. Not all operating
    systems do it, but they are the exceptions. Some operating systems support partitions,
    but they occupy one partition on the hard disk, and use their internal partitioning
    method within that partition. The latter type exists peacefully with other operating
    systems (including Linux), and does not require any special measures, but an operating
    system that doesn''t support partitions cannot coexist on the same disk with any
    other operating system.


    As a safety precaution, it is a good idea to write down the partition table on
    a piece of paper, so if it ever corrupts you don''t have to lose all your files.
    (A bad partition table can be fixed with fdisk). The relevant information is given
    by the fdisk -l command:


    ```

    $ fdisk -l /dev/sda

    ```


    Disk /dev/hda: 15 heads, 570 sectors, 790 cylinders

    Units - cylinders of 855 * 512 bytes


    | Device | Begin | Start | End Blocks | System |

    |---|---|---|---|---|---||

    | /dev/hd1 | 1 | 1 | 24 | 10231+ | 82 | Linux swap |

    | /dev/hd2 | 25 | 25 | 48 | 10260 | 83 | Linux native |

    | /dev/hd3 | 49 | 49 | 408 | 153900 | 83 | Linux native |

    | /dev/hd4 | 409 | 409 | 790 | 163305 | 5 | Extended |

    | /dev/hd5 | 409 | 409 | 744 | 143611+ | 83 | Linux native |

    | /dev/hd6 | 745 | 745 | 790 | 196363+ | 83 | Linux native |


    # Extended And Logical Partitions


    The original partitioning scheme for PC hard disks allowed only four partitions.
    This quickly turned out to be too little in real life, because some people wanted
    more than four operating systems (Linux, MS-DOS, OS/2, Minix, FreeBSD, NetBSD,
    or Windows/NT, to a few), but primarily because it is a good idea to have several
    partitions for one operating system. For example, swap space is best put in its
    own partition for Linux instead of the main Linux partition for reasons of speed
    (see below).


    To overcome this design problem, extended partitions were invented. This trick
    allows partitioning a primary partition into subdivisions. The extended partition;
    the subdivisions are logical partitions. They behave like primary (illogical?)
    partitions, but are created differently. There is no speed difference between
    them.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# Using Disks And Other Storage Media 29


    The partition structure of a hard disk might look like that in Figure 3.2. The
    disk is divided into three primary partitions, the second of which is divided
    into two logical partitions. Part of the disk is not partitioned at all. The disk
    as a whole each primary partition has a boot sector.


    # Partition Types


    The partition tables (the one in the MBR and the ones for extended partitions)
    contain one byte per partition that identifies the type of that partition. This
    attempts to identify the operating system that uses the partition, or what it
    uses it for. The purpose is to make it possible to avoid having two operating
    systems accidentally using the same partition. However, in reality, operating
    systems do not really care about the partition type; e.g., Linux doesn''t care
    at all it is. Worse, some of them use it incorrectly; e.g., at least some versions
    of DR-DOS ignore the most significant bit of the byte, while others don''t.


    There is no standardization agency to specify what each byte value means, but
    commonly accepted ones are included in Table 3.1. The same list is available in
    the Linux fdisk program.


    # Partitioning A Hard Disk


    There are many programs for creating and removing partitions. Most operating systems
    have their own, and it can be a good idea to use each operating system''s own,
    just in case it does something unusual that the others can''t. Many of the programs
    are called fdisk, including the


    ![](img/8036a81002f24881cae710bb74d93a7c_316_0.png)


    Figure 3.2 A sample hard disk partitioning.'
  merge: -1
  img_proc: true
