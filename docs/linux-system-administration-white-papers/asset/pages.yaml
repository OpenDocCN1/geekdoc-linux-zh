    protocol names—for example, those used in the services file—to numbers understood
    by the IP layer on other hosts. This is done by looking up the name in the /etc/protocols
    file. It contains one entry per line, each containing a protocol name, and the
    associated number. Having to touch this file is even more unlikely than having
    to meddle with /etc/services. A sample file is given:


    ```

    0 IP # internet protocol, pseudo protocol number

    icmp 1 ICMP # internet control message protocol

    igmp 2 IGMP # internet group multicast protocol

    tcp 6 TCP # transmission control protocol

    pup 12 PUP # PARC universal packet protocol

    udp 17 UDP # user datagram protocol

    idp 22 IDP #WhatThis?

    raw 255 RAW # RAW IP interface

    ```


    # Remote Procedure Call


    A very general mechanism for client-server applications is provided by RPC, the
    Remote Procedure Call package. RPC was developed by Sun Microsystems and is a
    collection of tools and library functions. Important applications built on top
    of RPC are NFS, the Network Filesystem, and NIS, the Network Information System,
    both of which will be introduced in later chapters.'
