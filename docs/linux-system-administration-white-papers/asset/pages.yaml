- pgno: 160
  md: '# Chapter 10


    # The Network File System


    NFS, the network file system, is probably the most prominent network services
    using RPC. It allows to access files on remote hosts in exactly the same way as
    a user would access any local files. This is made possible by a mixture of kernel
    functionality on the client side (that uses the remote file system) and an NFS
    server on the server side (that provides the file data). This is completely transparent
    to the client and works across a variety of server and host architectures.


    NFS offers a number of advantages:


    +   Data accessed by all users can be kept on a central host, with clients mounting
    this directory at boot time. For example, you can keep all user accounts on one
    host, and have all hosts on your network mount /home from that host. If installed
    alongside NIS, users can then log into any system and still work on one set of
    files.


    +   Data consuming large amounts of disk space may be kept on a single host. For
    example, all files and programs relating to LaTeX and METAFONT could be kept and
    maintained in one place.


    +   Administrative data may be kept on a single host. No need to use rcp anywhere
    to install the same stupid file on 20 different machines.


    NFS is largely the work of Rick Sladkey (jrs@world.std.com), who wrote the Linux
    implementation of the NFS kernel code and large parts of the NFS server. The latter
    is derived from the unsfd file NFS server originally written by Mark Hand, and
    the hnfs Harris NFS server written by Donald Becker.


    Let''s have a look at how NFS works: A client may request to mount a directory
    from a remote host on a local directory just the'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'same way it can mount a physical device. However, the syntax used to specify
    the remote directory is different. For example, mount /home from host vlager to
    /users on vale, the administrator would use the following command on vale (note
    that you can omit the -t nfs argument, because mount sees from the colon that
    this specifies NFS volume):


    ```

    # mount vlager:/home /users

    ```


    mount will then try to connect to the mount daemon on vlager via RPC. The server
    will check if vale is permitted to mount the directory in question, and return
    it a file handle. This file handle will be used in all subsequent requests to
    files below /users.


    When someone accesses a file over NFS, the kernel places an RPC call to nfsd (the
    NFS daemon) on the server machine. This call takes the file handle, the name of
    the file to be accessed, and the user''s and group ID as parameters. These are
    used in determining access rights to the specified file. To prevent unauthorized
    users from reading or modifying files, user and group IDs must be the same on
    both hosts.


    On most implementations, the NFS functionality of both client and server are implemented
    as kernel-level daemons that are started from user space at system boot. These
    are the NFS daemon (nfsd) on the server host, and the Block I/O Daemon (bind)
    running on the client host. To improve throughput, bind performs asynchronous
    I/O using read-ahead and write-behind; also, several nfs daemons are usually running.


    The NFS implementation is a little different in that the client code is tightly
    integrated in the virtual file system (VFS) layer of the kernel and doesn''t require
    additional control through bind. On the other hand, the server code runs entirely
    in user space, so running several copies of the server at the same time is almost
    impossible because of the synchronization issues this would involve. (Please note
    that there is a kernel version of NFS under development.) NFS also lacks read-ahead
    and write-behind, but Rick Sladley plans to add this someday. (The problem with
    write-behind is that the kernel buffer cache is indexed by device/inode pairs,
    and therefore can''t be used for NFS-mounted file systems.)


    The biggest problem with the NFS code is that the kernel of version 1 is not able
    to allocate memory in chunks bigger than 4K; the networking code cannot handle
    buffers bigger than 3,500 bytes after subtracting headers and so forth. This means
    that transfers to and from NFS daemons running on systems that use large UDP datagrams
    by default (e.g., 8K on SunOS) need to be downsized artificially. This (As explained
    to me by Alan Cox: The NFS specification requires the server to flush each write
    to disk before it returns an acknowledgment. As BSD kernels are only capable of
    page-sized writes [4K], writing chunks of 1K each to a BSD-based NFS server results
    in four write operations of 4K each.) This limit is gone in late 1.1 kernels,
    and the client code has been modified to take advantage of this.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# Preparing NFS


    Before you can use NFS, be it server or client, you must make sure your kernel
    has NFS support compiled in. Newer kernels have a simple interface on the proc
    file system for this, the /proc/filesystems file, which you can display using
    cat:


    ```

    $ cat /proc/filesystems

    minix

    ext2

    msdsos

    nodev proc

    nodev nfs

    ```


    If NFS is missing from this list, then you have to compile your own kernel with
    NFS enabled. Configuring the kernel network options is explained in the section
    called "Kernel Configuration" in Chapter 3.


    For older kernels prior to 1.1, the easiest way to find out whether your kernel
    has NFS support enabled is to try to mount an NFS file system. For this, you could
    create a directory below /tmp/, and try to mount a local directory on it:


    ```

    # mkdir /tmp/test

    # mount localhost:/etc /tmp/test

    ```


    If this mount attempt fails with an error message saying "If type nfs no supported
    by kernel," you must make a new kernel with NFS enabled. Any other error messages
    are completely harmless, as you haven''t configured the NFS daemons on your host
    yet.


    # Mounting An NFS Volume


    NFS volumes (one doesn''t say file system, because these are not proper file systems)
    are mounted very much the usual file systems are mounted. You invoke mount using
    the following syntax:


    ```

    # mount -t nfs volume local dir options

    ```


    nfs_volume is given as remote_host:remote_dir. Since this notation is unique to
    NFS file systems, you can leave out the -t nfs option.


    There are a number of additional options that you may specify to mount upon an
    NFS volume. These may either be given following the -o switch on the command line,
    or in the fields of the /etc/fstab entry for the volume. In both cases, multiple
    options are separated from each other by commas. Options specified on the command
    line always override those given in the fstab file.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# The Linux Network Administrators'' Guide: Chapter 10


    A sample entry in/fstab might be


    ```

    # volume          mount point type options

    news:/usr/spool/news /usr/spool/news nfs timeout=14,intr

    ```


    This volume may be mounted using


    ```

    # mount news:/user/spool/news

    ```


    In the absence of a fstab entry, NFS invocations look a lot ugl. For instance,
    suppose you mount your users'' home directories from a machine Moonshot, which
    uses a default block size of 4K for read/write operations. You might decrease
    block size to 2K to suit Linux''s datagram size limit by issuing


    ```

    mount:/home -o rsize=2048,wsize=2048

    ```


    The list of all valid options is described in its entirety in the nfs manual page
    that comes with Sladkey''s NFS-aware mount tool, which can be found in Rik Faith''s
    util-linux package. Table 10.1 provides an incomplete list of those you would
    probably need to use.


    Except for rsize and wsize, all of these options apply to the client''s behavior
    if the server become become temporarily. They play together in the following way:
    When the client sends a request to the NFS server, it expects the operation to
    have finished after a given interval (specified in the timeout option). If no
    confirmation is received within this time, a so-called minor timeout occurs, and
    the operation is retried with the timeout interval doubled. After reaching a maximum
    of 60 seconds, a major timeout occurs.


    By default, a major timeout will cause the client to print a message to the console
    and start all over again, with an initial timeout twice that of the previous cascade.
    Potentially, this may go on forever. Volumes that stubbornly retry an operation
    until the server becomes available again as hard-mounted. The opposite variety,
    soft-mounted volumes generates an I/O error for the calling process when a major
    timeout occurs. Because cause of the write-back introduced by the buffer cache,
    this error is not propagated


    | Table 10.1 Some mounting options.

    | Option | Description |

    | rsize=and wsize= | These specify the datagram size used by the NFS clients on
    read and write requests, respectively. They currently default to 1,024 bytes,
    due to the limit on UDP datagram size described above. |

    | timeout=n | This sets the time (in tens of seconds) the client will wait for
    a request to complete. The default values are 0.7 seconds. |

    | Hard | Explicitly mark this volume as hard-mounted. This is by default. |

    | Soft | Soft-mounted the driver (as opposed to hard-mounted).

    | Intr | Allow signals to interrupt an NFS call, Useful for aborting when server
    doesn''t respond. |'
