- pgno: 101
  md: '# 78 The Linux Network Administrators’ Guide: Chapter 5


    +   ttl—In order to force resolvers to discard information after a certain time,
    each RR is associated with a "time to live", or ttl for short. The ttl field specifies
    the time in seconds the information is valid after it has been retrieved from
    the server. It is a decimal number with at most eight digits. If no ttl value
    is given, it defaults to the value of the minimum field of the SOA record.


    +   class—This is an address class, like IN for IP addresses, or HS for objects
    in the Hesiod class. For TCP/IP networking, you have to make this IN. If no class
    field is given, the class of the preceding RR is assumed.


    +   type—This describes the type of the RR. The most common types are A, OA, PTR,
    and NS. The following sections describe the various types of RRs.


    +   rdata—This holds the data associated with the RR. The format of this depends
    on the type of the RR. Below, it will be described for each RR separately.


    The following is an incomplete list of RRs to be used in DNS master files, which
    we will not explain. They are experimental and of little use generally.


    +   SOA—This describes a zone of authority (SOA means "start of authority”). It
    signals the records following the SOA RR authoritative information for the domain.
    Every master file included by a primary must contain an SOA record for this zone.
    The resource data contains the following:


    +   origin—This is the canonical hostname of the primary server for your domain.
    It is usually given as an absolute name.


    +   contact—This is the email address of the person responsible for maintaining
    the domain, with the "@" character replaced by a dot. For instance, if the responsible
    person at the Virtual Brewery is Janet, this field would contain janet.vbrew.com.


    +   serial—This is the version number of the zone file, a decimal number. Whenever
    data is changed in the zone file, this number should be incremented. The serial
    number is used by secondary servers to recognize zone information has changed.
    To stay up to date, secondary servers request the primary server’s SOA record
    at certain intervals, and compare the serial number to that of the cached SOA
    record. If the number has changed, the secondary servers transfer the whole zone
    database from the primary server.


    +   refresh—This specifies the interval in seconds that the secondary servers
    should wait between checking the SOA record of the primary server. Again, this
    is a decimal number with at most eight digits. Generally, the network topology
    doesn''t change too often, so that this number should specify an interval of roughly
    a day for larger networks, and even for smaller ones.


    +   retry—This number determines the intervals at which a secondary server should
    retry contacting the primary server if a request or a zone refresh fails. It must
    not be too low, or a temporary failure of the server or a network problem may
    cause the secondary'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'server to waste network resources. One hour, or perhaps one half-hour, might
    be a good choice.


    +   expire—This specifies the time in seconds after which the server should finally
    discard all zone data if it hasn''t been able to contact the primary server. It
    should normally be very large. Craig Hunt ("hunt-tcpip") recommends 42 days.


    +   minimum—This is the default ttl value for records that do not explicitly specify
    one. This requires other name servers to discard the RR after a certain amount
    of time. It has however nothing to do with the time after a secondary server tries
    to update the zone information. Minimum should be a large value, especially for
    LANs where the network topology almost never changes. A value of around a week
    or a month is probably a good choice. In the case that single RRs may change more
    frequently, you can still assign them different ttls.


    +   A—This associates an IP address with a hostname. The resource field contains
    the address in dotted notation. For each host, there must be only one A record.
    The hostname used in this A is considered the official or canonical hostname.
    All other hostnames are aliases and must be mapped onto the canonical hostname
    using CNAME record.


    +   NS—This points to a master server of a subordinate zone. For an explanation
    why one has to have NS records, see Chapter 3. The resource data field contains
    the hostname of the name server. To resolve the hostname, an additional A record
    is needed, the so-glue record gives the name server''s IP address.


    +   CNAME—This associates an alias for a host with its canonical hostname. The
    canonical hostname is the one master file provides an A record for; aliases are
    simply linked to that name by a CNAME record, but do not have any other records
    of their.


    +   PTR—This type of record is used to associate names in inaddr.domain with hostnames.
    This is used for reverse mapping of IP addresses to hostnames. The hostname given
    must be the canonical hostname.


    +   MX—This RR announces a mail exchanger for a domain. The reasons to have mail
    exchangers are discussed in Chapter 14. The syntax of an MX record is


    ```

    [domain] [ttl] [class] MX preference host

    ```


    where host most the mail exchanger for domain. Every mail exchanger has an integer
    preference associated with it. A mail transport agent who desires to deliver mail
    to domain will try all hosts who have an MX record for this domain until it succeeds.
    The one with the lowest preference value is tried first, then the others in order
    of increasing preference value.


    +   HINFO—This record provides information on the system''s hardware and software.
    Its syntax is


    ```

    [domain] [ttl] [class] HINFO hardware software

    ```'
