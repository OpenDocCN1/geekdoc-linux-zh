- pgno: 349
  md: '/tmp, starting various services, and starting a getty for each terminal and
    virtual console where users should be able to log in (see Chapter 7).


    After the system is properly up, init restarts getty for each terminal after a
    user has logged out (so that the new user can log in); init also adopts orphan
    processes: When a process starts a child process and dies before its child, the
    child immediately becomes a child of init. This is important for various technical
    reasons, but it is good to know it, since it makes it easier to understand process
    lists and process trees (init itself is not allowed to die). You can''t kill it
    with SIGKILL. There are a few variants of init available. Linux distributions
    use sysvinit (written by Mikel van Moorenburg), which is based on the System V
    init. The BSD versions of Unix have a different init. The primary difference is
    levels: System V has them, BSD does not (at least traditionally). This difference
    is not essential. We''ll look at sysvinit only.


    # Configuring init To start getty: The /etc/initab File


    When it starts up, init reads the /etc/initab configuration file. When the system
    is running, it will re-read it, if gets the HUP signal (using the command kill
    -HUP 1 as root, for example). This feature makes unnecessary to boot the system
    to make changes to the init configuration effect.


    The /etc/initab file is a bit complicated. We''ll start with the simple case of
    configuring getty lines. Lines in /etc/initab consist of four colon-delimited
    fields:


    ```

    id:runlevels:action:process

    ```


    The fields are described below. In addition, /etc/initab can contain empty lines,
    and lines that begin with a number sign (#); these are both ignored.


    id


    This identifies the line in the file. For getty lines, it specifies the terminal
    it runs on (the characters after /dev/tty in the device name). For other lines,
    it doesn''t matter (except for length restrictions), but it should be unique.


    runlevels


    The run levels the line should be considered for. The run levels are given as
    single digits, without delimiters. (Run levels are described in the next section.)


    action


    What action should be taken by the line, e.g., respawn to run the command in the
    next field again, when it exits, or once to run it just once.'
  merge: -1
  img_proc: true
- pgno: 350
  md: '# process


    The command to run.


    To start a getty on the first virtual terminal (/dev/tty1), in all the normal
    multiuser run levels (2–5), one would write the following line:


    ```

    1:2345:respawn:/sbin/getty 9660 tty1

    ```


    The first field says that this is the line for /dev/tty1. The second field says
    that it applies to run levels 2, 3, 4, and 5. The third field means that the command
    should be run again, after it exits (so one can log in, log out, and log in again).
    The last field is the command that runs on the first virtual terminal. (Different
    versions of getty are run differently. Consult your manual page, and make sure
    it is the correct manual page.)


    If you wanted to add terminals or dial-in modem lines to a system, you would add
    more lines to /etc/inittab, for each terminal or dial-in line. For more details,
    see the manual init, inittab, and getty.


    If a command fails when it starts, and init is configured to restart it, it will
    use a lot of system resources; init starts it, it fails, init starts it, it fails,
    init starts it, it fails, and so on, infinitum. To prevent this, init will keep
    track of how often it restarts a command, and if the frequency grows to high,
    it will delay for five minutes before restarting again.


    # Run Levels


    A run level is a state of init and the whole system that defines what system services
    are operating. Run levels are identified by numbers, see Table 6.1. There is no
    consensus of how to use the user-defined run levels (2 through 5). Some system
    administrators use run levels to define which subsystems are running, e.g., X
    is running, whether the network is operational, and so on. Others have all subsystems
    always running or start to stop them individually, without changing run levels,
    since run levels are too coarse for controlling their systems. You need to decide
    for yourself, but it might be easiest to follow your way Linux distribution does
    things.


    Table 6.1 Run level numbers.


    | 0 | Halt the system |

    |---|---|

    | 1 | Single-user mode (for special administration) |

    | -2 | Normal operation (user-defined) |

    | 6 | Reboot |'
