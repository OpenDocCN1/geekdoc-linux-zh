    +   flags—This describes certain parameters for the feed. It may be empty, or
    a combination of the following:


    +   F—Flag enables batching.


    +   F—this is almost identical to the F flag, but allows C-News to calculate the
    size of outgoing batches more precisely.


    +   I—This flag makes C-News produce an article list suitable for use by ihave/sendme.
    Additional modifications to the sys and the batchforms file are required to enable
    ihave/sendme.


    +   n—This creates batches for active NNTP clients like nntpxmit (Chapter 19).
    The batch files contain the article''s file name with its message ID.


    +   I—This flag makes C-News produce an article list suitable for use by ihave/sendme.
    Additional modifications to the sys and the batchforms file are required to enable
    ihave/sendme.


    +   n—This creates batches for active NNTP clients like nntpxmit (Chapter 19).
    The batch files contain the article''s file name with its message ID.


    +   L—This tells C-News to transfer only articles posted at your site. This flag
    may be followed by a decimal n, which makes C-News only transfer articles posted
    within n hops from yours. C-News determines the number of hops from the Path:
