- pgno: 326
  md: 'The last alternative can be implemented by adding a line like the following
    to the \fstab/etc/fstab\ file:


    ```

    /dev/fd0  /floppy  msdos user,noauto  0 0

    ```


    The columns are: device file to mount, directory to mount, filesystem type, options,
    backup frequency (used by dump), and fck pass number (to specify the order in
    which filesystems should be checked upon boot; 0 means no check).


    The noauto option sets this mount to be done automatically when the system is
    started (i.e., it stops mount -a from mounting it). The user option allows any
    user to mount the filesystem, and because of security reasons, disallows execution
    of programs (normal or setuid) and interpretation of device files from the mounted
    filesystem. After this, any user can mount a floppy with an msdos filesystem with
    the following command:


    ```

    $ /floppy

    $

    ```


    The floppy can (and needs to,) be unmounted with the corresponding \cmd(umount)
    command.


    If you want to provide access to several types of floppies, you need to give several
    mount points. The settings can be different for each mount point. For example,
    giving access to both MS-DOS and ext2 floppies, you could have the following lines
    in /etc/fstab:


    ```

    /dev/fd0  /dosfloppy msdos user,noauto 0 0

    /dev/fd0  /ext2floppy ext2 user,noauto 0 0

    ```


    For MS-DOS filesystems (not just floppies), you probably want to restrict access
    to it by using the uid, gid, and umask filesystem options, described in detail
    on the manual page. If you are not careful, mounting an MS-DOS filesystem gives
    everyone at least read access to the files in it, which is not a good idea.


    # Checking Filesystem Integrity with fsck


    Filesystems are complex structures, and as such, they tend to be somewhat error-prone.
    A filesystem''s correctness and validity can be checked using the fsck command.
    It is instructed to repair any minor problems it finds. Fortunately, the code
    to implement filesystems is debugged quite effectively, so there are some problems
    at all, and they are usually caused by power failures, failing hardware, or operator
    errors; for example, by not shutting down the system properly.


    Most systems are set to run fsck automatically at boot time, so that any errors
    are detected (and hopefully corrected) before the system is used. Use of a corrupted
    filesystem tends to make things worse: if the data structures are messed up, using
    the filesystem will'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# The Linux System Administrators'' Guide: Chapter 3


    probably mess them up even more, resulting in more data loss. However, fsck can
    take a run on busy filesystems, and errors almost never occur if the system has
    been shut down properly, a couple of tricks are used to avoid doing checks in
    such cases. The first is if the /etc/fastboot exists, no checks are made. The
    second is that the ext2 filesystem has a special marker in its superblock that
    tells the filesystem was unmounted properly after the previous mount. This allows
    efsck (the version of fsck for the ext2 filesystem) to avoid checking the filesystem
    if the flag indicates the unmount was done (the assumption being that a proper
    mount indicates no problems). Whether the /etc/fastboot trick works on your system
    depends on your startup scripts, but the ext2 trick works every time you use efsck.
    It has to be explicitly bypassed with an option to e2fsck to be avoided. (See
    the e2fsck man page for details on how.)


    The automatic checking only for the filesystems that are mounted automatically
    at boot time. Use fsck manually to check other filesystems, e.g., floppies.


    If fsck finds irreparable problems, you need in-depth knowledge of how filesystems
    work and the type of corrupt filesystem in, or good backups. The latter is easy
    (although sometimes tedious) to arrange, the former can be arranged via a friend,
    the Linux newsgroups and mailing lists, or some other source of support, if you
    don''t have the know-how yourself. I''d like to tell you more about it, but my
    lack of education and experience in this regard hinders me. The debugfs program
    by Theodore Ts''s should be useful.


    fsck must only run on unmounted filesystems, never on mounted filesystems (with
    the exception of the read-only root during startup). This is because it accesses
    the raw disk, and can therefore modify the filesystem without the operating system
    realizing it. There will be trouble if the operating system is confused.


    # Checking For Data Errors With badblocks


    It can be a good idea to periodically check for bad blocks. This is done with
    the badblocks command. It outputs a list of the numbers all bad blocks it can
    find. This list can be fed to fsck to be recorded in the filesystem data structures
    so that the operating system won''t try to use the bad blocks for storing data.
    The following example will show how this could done.


    ```

    $ badblocks /dev/fd01440 1440 > bad-blocks

    $ fsck -t ext2 -l /dev/fd01440

    Parallelizing fsck version 0.5a (5-Apr-94)

    e2fsck 0.5a, 5-Apr-94 for EXT2 FS 0.5, 94/03/10

    Pass 1: Checking inodes, blocks, and sizes

    Pass 2: Checking directory structure

    Pass 3: Checking directory connectivity

    Pass 4: Check reference counts.

    Pass 5: Checking group summary information.

    ```'
  merge: -1
  img_proc: true
- pgno: 328
  md: '# Using Disks And Other Storage Media


    /dev/fd0H1440: ***** FILESYSTEM WAS MODIFIED *****

    /dev/fd0H1440: 11/360 files, 63/1440 blocks


    If badblocks reports a block that was already used, e2fsck will try to move the
    block to another place. If the block was really bad, not just marginal, the contents
    of the file may be corrupted.


    # Fragmentation


    When a file is written to disk, it can''t always be written in consecutive blocks.
    A file that is not stored in consecutive blocks is fragmented. It takes longer
    to read a fragmented file, since the disk''s read-write head will have to move
    more. It is desirable to avoid fragmentation, although it is less of a problem
    in a system with a good buffer cache with read-ahead.


    The ext2 filesystem attempts to keep fragmentation at a minimum, by keeping all
    blocks in a file close together, even if they can''t be stored in consecutive
    sectors. ext2 effectively always allocates the block that is nearest to other
    blocks in a file. For ext2, it is there seldom a program for defragmenting an
    ext2 filesystem, see http://fs-11.mit.edu/pub/linux/packages/ext2fs/defrag-0.70.ism
    and http://fsx-11.mit.edu/pub/linux/packages/ext2fs/defrag-0.70.tar.gz.


    There are many MS-DOS fragmentation programs that move blocks around the filesystem.
    For other filesystems, defragmentation must be done by backing up the filesystem,
    re-creating, and restoring the files from backups. Backing up a filesystem before
    defragmenting is a good idea for all filesystems, since many things can go wrong
    during the defragmentation.


    # Other Tools For All Filesystems


    Some other tools are also useful for managing filesystems; df shows the free space
    on one or more filesystems; du shows how much disk space a directory and all its
    files contain. These can be used to hunt down space wasters.


    sync forces all unwritten blocks in the buffer cache (see the section called "The
    Buffer Cache in Chapter 4") to be written to disk. It is seldom necessary to do
    this by hand; the daemon process update does this automatically. It can be useful
    in catastrophes, for example if update or its helper process bdflush does, or
    if you must turn power now and can''t wait for update to run.


    # Other Tools For The ext2 Filesystem


    In addition to the filesystem creator (mke2fs) and checker (e2fsck) accessible
    directly via the filesystem type independent front ends, the ext2 filesystem has
    some additional tools that can be useful.'
  merge: -1
  img_proc: true
