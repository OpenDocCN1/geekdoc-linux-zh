- pgno: 41
  md: '# Outlook On The Following Chapters


    The next few chapters will deal with configuring for TCP/IP networking, and running
    some major applications. Before getting our hands dirty with file editing and
    the like, we will examine IP a in Chapter 2. If you already know the way IP routing
    works, and how address resolution is performed, you might want to skip this chapter.


    Chapter 3 deals with the very basic configuration issues, such as building a kernel
    and setting up your Ethernet board. The configuration of your serial ports is
    covered in a separate chapter, because the discussion does not apply to TCP/IP
    networking only, but is also relevant for UUCP.


    Chapter 5 helps you to set up your machine for TCP/IP networking. It contains
    installation hints for stand-alone hosts with loopback enabled, and hosts connected
    to an Ethernet. It will also introduce you to a few tools you can use to test
    and debug your setup. The next chapter discusses how to configure hostname resolution,
    and explains how to set up a name server.


    This is followed by two chapters featuring the configuration and use of SLIP and
    PPP, respectively. Chapter 6 explains how to establish SLIP connections, and gives
    a detailed reference of Dip, a tool that allows you to automate most of the necessary
    steps. Chapter 7 covers PPP and pppd, the PPP daemon you need for this.


    Chapter 8 gives a short introduction to setting up most of the most important
    network applications, such as login, rcp, and so on. Chapter 8 also covers how
    services are managed by the inetd super, and how you may restrict security-relevant
    services to a set of trusted hosts.


    The next two chapters discuss NIS, the Network Information System, and NFS, the
    Network File System. NIS is a useful tool to distribute administrative information
    such as user passwords in a local area network. NFS allows you to share file systems
    between several hosts in your network.


    Chapter 11 gives you an extensive introduction to the administration of Taylor
    UUCP, a free implementation of the UUCP suite.


    The remainder of the book is taken up by a detailed tour of electronic mail and
    Usenet news. Chapter 12 introduces you to the central concepts of electronic mail,
    like what a mail address looks like, and how the mail handling system manages
    to get your message to the recipient.


    Chapters 13 and 14 cover the setup of sendmail and sendmail. This book explains
    both of them, because small is easier to install for the beginner, while sendmail
    is more flexible.


    Chapter 15 and 16 explain the way news is managed in Usenet, and how you install
    and use C-news, a popular software package for managing Usenet news. Chapter 17
    covers how to set up an NNTP daemon to provide news access for your local network.
    Chapter 18 finally shows you how to configure and maintain various newsreaders.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Chapter 2


    # Issues Of TCP/IP Networking


    We will now turn to the details you''ll come in touch with connecting your machine
    to a TCP/IP network including dealing with IP addresses, hostnames, and sometimes
    routing issues. This chapter gives you the background you need in order to understand
    what your setup requires, while the next chapter will cover the tools to deal
    with these.


    # Networking Interfaces


    To hide the diversity of equipment that may be used in a networking environment,
    TCP/IP defines an abstract interface through which the hardware is accessed. This
    interface offers a set of operations which is the same for all types of hardware
    and basically deals with sending and receiving packets.


    For each peripheral device you want to use for networking, a corresponding interface
    has to be present in the kernel. For example, Ethernet interfaces are called eth0
    and eth1, SLIP interfaces come as sl0, sl1, and so on. These interface names are
    used for configuration purposes when you want to name a particular physical device
    to the kernel. They have no meaning beyond that.


    To be usable for TCP/IP networking, an interface must be assigned an IP address
    which serves as its identification communicating with the rest of the world. This
    address is different from the interface name mentioned above; if you compare an
    interface to door, then the address is like the name-plate pinned on it.


    Of course, there are other device parameters that may be set; one of these is
    the maximum size of datagrams that can be processed'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'by that particular piece of hardware, also called maximum transfer unit, or
    MTU. Other attributes will be introduced later.


    # IP Addresses


    As mentioned in the previous chapter, the addresses understood by the IP networking
    are 32-bit numbers. Every machine must be assigned a number unique to the networking
    environment. If you are running a local network that does not have TCP/IP traffic
    with other networks, you may assign these numbers according to your personal preferences.
    However, for sites on the Internet, numbers are assigned by ICANN, www.iccann.org.


    For easier reading, IP addresses are split into four 8-bit numbers called octets.
    For example, quark.physics.grouchu.edu has an IP address of 0x954CCC004, which
    is written as 149.76.12.4. This format is referred to as the dotted quad quotation.


    Another reason for this notation is that IP addresses are split into a network
    number, which is contained in the leading octets, and a host number, which is
    the remainder.


    Depending on the size of the network, the host part may need to be smaller or
    larger. To accommodate different needs, there are several classes of networks,
    defining different splits of IP addresses (see bullet list below).


    +   * Class A comprises networks 1.0.0.0 through 127.0.0.0. The network number
    is contained in the first octet. This provides for a 24-bit host part, allowing
    roughly 1.6 million hosts.


    +   * Class B contains networks 128.0.0.0 through 191.255.0.0; the network number
    is in the first two octets. This allows for 16,320 nets with 65,024 hosts each.


    +   * Class C ranges from 192.0.0.0 through 223.255.255.0, with the network number
    contained in the first three octets. This allows for nearly 2 million networks
    with up to 254 hosts.


    +   * Classes D, E, and F falling into the range of 224.0.0.0 through 254.0.0.0
    are either experimental, or are reserved for future use and don''t specify any
    network.


    If we go back to the example in the previous chapter, we find that 149.76.12.4,
    the address of Quark, refers to host 12.4 on the class B network 149.76.0.0.


    You may have noticed, in the above list, not all the possible values were allowed
    for each octet in the host part. This is because host numbers with octets all
    O or 255 are reserved for special purposes. An address where all host part bits
    are 0 refers to the network, and one where all of the host part is 1 is a broadcast
    address. This refers to all hosts on the specified network simultaneously. Thus,
    149.76.255.255 is not a valid host address, but refers to all hosts on network
    149.76.0.0.


    There are also two network addresses that are reserved: 0.0.0.0 and 127.0.0.0.
    The first is the default route, the loopback address. The default route has something
    to do with the way IP routes datagrams, which will be dealt with below.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# Issues of TCP/IP Networking 21


    Network 127.0.0.0 is reserved for IP traffic local to your host. Usually, 127.0.0.1
    will be assigned to a special interface on your host, the so-called loopback interface,
    which acts like a closed circuit. Any IP packet handed to it TCP or UDP will be
    returned to them as if it had just arrived from some network. This allows you
    to develop and test networking software without ever using a "real" network. Another
    useful application is when you want to use networking on a standalone host. This
    may not be as uncommon as it sounds; for instance, many UUCP sites don''t have
    IP connectivity at all, but still want to run the INN news system nevertheless.


    # Address Resolution


    Now that you are seeing how IP addresses are made up, you may be wondering how
    they are used on an Ethernet to address different hosts. After all, the Ethernet
    protocol identifies hosts by a six-octet number that has absolutely nothing in
    common with an IP address, does it?


    Right. That is how a mechanism is used to map IP addresses onto Ethernet addresses.
    This is the so-called Address Resolution Protocol, or ARP. In fact, ARP is not
    confined to Ethernets at all, but is used on other types of networks such as radio
    we. The underlying ARP is exactly what people do when they need to find Mr. X.
    Ample in a crowd of 150 people: they go around, calling his name, and that will
    respond if he hears.


    When ARP wants to find out the Ethernet address corresponding to a given IP address,
    it uses a feature of Ethernet called "broadcasting," where a datagram is addressed
    to all stations on the network simultaneously. The broadcast datagram sent by
    ARP contains a query for the IP address. Each receiving host compares this to
    its own IP address, and if it matches, returns an ARP reply to the inquiring host.
    ...


    Of course you might wonder how a host may know on which of the zillions of Ethernets
    throughout the world it is to find the desired host, and why this should even
    be an Ethernet. These questions all involve what is called routing, namely, finding
    out the physical location of a host in a network. This will be the topic of the
    following section.


    For a moment, let''s talk about ARP a little longer. Once a host has discovered
    an Ethernet address, it stores in its ARP cache, so that it doesn''t have to query
    for the next time it wants to send a datagram to the host in question. However,
    it is unwise to keep this information forever; for instance, the remote host''s
    Ethernet card may be replaced because of technical problems, so the ARP cache
    becomes invalid. To force another query for the IP address, entries in the ARP
    cache are discarded after some time.


    Sometimes, it is also necessary to find out the IP address associated with a given
    Ethernet address. This happens when a diskless machine wants to boot from a server
    on the network, which is quite a common location on local area networks. A diskless
    client, however, has virtually no information about itself-except for its Ethernet
    address! So what it basically does is broadcast a message containing a plea for
    boot servers to tell it its IP address. There''s'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'another protocol for this, named Reverse Address Resolution Protocol, RARP.
    Along with the BOOTP protocol, it serves to define a procedure for bootstrapping
    diskless clients over the network.


    # IP Routing


    # IP Networks


    When you write a letter to someone, you usually put a complete address on the
    envelope, specifying the country, state, ZIP code, and so on. After you put it
    into the letter box, the postal service will deliver it to its destination: It
    will be sent to the country indicated, whose national service will dispatch it
    to the proper state and region, and so forth. The advantage of this hierarchical
    scheme is rather obvious: Wherever you post the letter, the local postmaster will
    well know the direction to forward the letter to, but doesn''t have to care which
    way the letter will travel within the destination country.


    IP networks are structured in a similar way. The whole Internet consists of a
    number of proper networks, called autonomous systems. Each such system performs
    any routing between its hosts, so that the task of delivering a datagram is reduced
    to finding a path to the destination host''s network. This means, as soon as the
    datagram is handed to any host that is on that particular network, further processing
    is done exclusively by the network itself.


    # Subnetworks


    This structure is reflected by splitting IP addresses into a host and network
    part, as explained above. By default, the destination is derived from the network
    part of the IP address. Thus, hosts with identical IP network numbers should be
    found within the same network, and vice versa. Autonomous systems are slightly
    more however. They may comprise more than one IP network.


    It makes sense to offer a similar scheme inside the network, too, as it may consist
    of a collection of hundreds of smaller networks itself, with the smallest units
    being physical networks like Ethers. Therefore, IP allows you to subdivide an
    IP network into several subnets.


    A subnet takes over responsibility for delivering datagrams to a certain range
    of IP addresses from the IP network it is part of. As classes A, B, or C, it is
    identified by the network part of the IP addresses. However, the network part
    is now extended to include some bits from the host part. The number of bits that
    are interpreted as the subnet number is given by the so-called subnet mask, or
    netmask. This is a 32-bit number, too, which specifies the bit mask for the network
    part of the IP address.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Issues of TCP/IP Networking 23


    The campus network of Grouch Marx University is an example of such a network.
    It has a class B network number of 149.76.0.0, and its netmask is therefore 255.255.0.0.


    Internally, GMU''s campus network consists of smaller networks, such as the LANs
    of various departments. The range of IP addresses is routed into 254 subnets,
    149.76.1.0 through 149.76.254.0. For example, the Department of Theoretical Physics
    has been assigned 149.76.254.0. The campus backbone is a network by its own right,
    and is given 149.76.1.0. These subnets share the same IP network number, while
    the third octet is used to distinguish between them. Thus, they will use a subnet
    mask of 255.255.0.0.


    It is worth noting that subnetting (as the technique of generating subnets) is
    only an internal division of the network. Subnets are generated by the network
    owner (or the administrators). Frequently, subnets are created to reflect boundaries,
    be physical (between two Enets), administrative (between two departments), or
    geographical, and authority over these subnets is delegated to some contact person.
    However, this structure affects only the network''s internal behavior, and is
    completely invisible to the outside world.


    # Gateways


    Subnetting is not only an organizational benefit, it is frequently a natural consequence
    of hardware boundaries. The viewpoint of a host on a physical network, such as
    an Ethernet, is a very limited one: The only hosts it is able to talk directly
    are those of the network it is on. All other hosts can be accessed only through
    so-called gateways. A gateway is a host that is connected to two or more physical
    networks simultaneously and is configured to switch packets between them.


    For IP to be easily recognize if a host is on a local network, different physical
    networks have to belong to different IP networks. For example the network number
    149.76.4.0 is reserved for hosts on the Mathematics LAN. When sending a datagram
    to Quark, the network software on Erdos immediately sees the IP address, 149.76.12.4,
    that the destination is on a different physical network, and therefore can be
    reached only through a gateway (Sophus by default).


    Sophus itself is connected to two subnets: the Mathematics Department and the
    campus backbone. It accesses each through a different interface, eth0 and fdi0,
    respectively. Now, what IP address do we assign it? Should we give it on subnet
    149.76.1.0, or on 149.76.4.0?


    The answer is both: When talking to a host on the Math Department''s LAN, Sophus
    should use an IP address of 149.76.4.1, and when talking to a host on the backbone,
    it should use 149.76.1.4.


    Thus, a gateway is assigned one IP per network it is. These addresses—along with
    the corresponding netmask—are tied to the interface the subnet is accessed through.
    Thus, the mapping of interfaces and addresses for Sophus would look like Table
    2.1.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# The Linux Network Administrators'' Guide: Chapter 2


    | Table 2.1 Mapping of interfaces and addresses for Sophus.

    | Interface | Address | Netmask |

    | --- | --- | --- |

    | eth0 | 149.76.4.1 | 255.255.255.0 |

    | fdd0 | 149.76.1.4 | 255.255.255.0 |

    | lo | 127.0.0.1 | 255.0.0.0 |


    The last entry describes the loopback interface lo, which was introduced above.
    Notice that the hosts on the remote network at time are with both addresses.


    Generally, you can ignore the subtle difference between attaching an address to
    a host or its interface. For hosts that are on one network only, like Erdos, you
    would generally refer of the host as having this-and-that IP address although
    strictly speaking, it''s the Ethernet interface that has this IP address. However,
    this distinction is only really important when you refer to a gateway.


    # The Routing Table


    We are now focusing our attention on how IP chooses a gateway to use when delivering
    a datagram to a remote network.


    We have seen before that Erdos, when given a datagram for Quark, checks the destination
    address and finds it is not on the local network. It therefore sends it to the
    default gateway, Sophus, which is now basically faced with the same task. Sophus
    recognizes that Quark is not on any of the networks it is connected to, so it
    has to find another gateway to forward it through. The correct choice would be
    Niels, the gateway to the Physics Department. Sophus needs some information to
    associate a destination network with a suitable gateway.


    The routing information IP uses for this is basically a table linking networks
    to gateways that reach them. A catch-all entry (the default route) must generally
    be supplied, too; this is the gateway associated with network 0.0.0.0. All packets
    to an unknown network are sent through the default route. On Sophus, this table
    might look like Table 2.2.


    | Table 2.2 Routing information for Sophus.

    | Network | Gateway | Interface |

    | --- | --- | --- |

    | 149.76.1.0 | | fdd10 |

    | 149.76.2.0 | 149.76.1.2 | fdd10 |

    | 149.76.3.0 | 149.76.1.3 | fdd10 |

    | 149.76.4.0 | | eth0 |

    | 149.76.5.0 | 149.76.1.5 | fdd10 |

    | 0.0.0.0 | 149.76.1.2 | fdd10 |'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'Routes to a network that Sophus is directly connected to don''t require a gateway;
    therefore, they show a gateway entry of “-”.


    Routing tables may be built by various means. For small LANs, it is usually most
    efficient to construct them by hand and feed them to IP using the route command
    at boot time (Chapter 3). For larger networks, they are built and adjusted at
    run time by routing daemons; these run on central hosts of the network and exchange
    routing information to compute “optimal” routes between the member networks.


    Depending on the size of the network, different routing protocols will be used.
    For routing inside autonomous systems (such as Groucho Marx campus), the internal
    routing protocols are used. The most prominent one is RIP, the Routing Information
    Protocol, which is implemented by the BSD routed daemon. For routing between autonomous
    systems, external routing protocols like EGP (External Gateway Protocol), or BGP
    (Border Gateway Protocol) have to be used; these (as well as RIP) have been implemented
    in Cornell University’s gated daemon.


    # Metric Values


    Dynamic routing based on RIP chooses the best route to some destination host or
    network based on number of “hops,” that is, the gateways has to pass before reaching
    it. The shorter a route, the better RIP rates it. Very long routes are regarded
    as unusable, and are discarded.


    To use RIP to manage routing information to your local network, you have to run
    gated on all hosts. At boot time, gated checks for all network interfaces. If
    there is more than one active interface (not counting the loopback interface),
    it assumes the host is switching packets between several networks, and will activate
    and broadcast routing information. Otherwise, it will only passively receive RIP
    updates and update the routing table.


    When broadcasting the information from the routing table, gated computes the length
    of the route from the so-called metric value associated with the routing table
    entry. This metric value is set by the system administrator when configuring the
    route and should reflect the actual cost of using this route. Therefore, the metric
    of a route to a subnet is directly connected to always be zero, while a route
    going through two gateways should have a metric of two. However, note that you
    don''t have to bother about metrics when you don''t use RIP or gated.


    # The Internet Control Message Protocol


    IP has a companion protocol that we haven''t talked about yet. This is the Internet
    Control Message Protocol (ICMP) and is used by the kernel networking to communicate
    error messages and to other hosts. For instance, assume that you are on Erdos
    again and want to telnet to port 12345 on Quark, but there''s no process listening
    on that port. When'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# The Linux Network Administrators'' Guide: Chapter 2


    the first TCP packet for this Quark, the networking layer will recognize this
    and immediately return an ICMP message to Erdos stating "Port Unreachable."


    There are quite a number of messages ICMP understands, many of which deal with
    error conditions. However, there is one very interesting message called the Redirect
    message. It is generated by the routing module when it detects another host is
    using it as a gateway, although there is a much shorter route. For example, after
    booting the routing table of Sophus may be incomplete, containing the routes to
    the Mathematics network, to the FDDI backbone, and the default route pointing
    at the Groucho Computing Center''s gateway (gcc1). Then, packets for Quark would
    be sent to gcc rather than Niels, the gateway to the Physics Department. When
    receiving such aa, gcc will notice that this is a poor choice of route, and will
    return at the same time returning an ICMP Redirect message to Sophus telling it
    of the superior route.


    Now, this seems a clever way to avoid having to set up any of the most basic routes
    manually. However, when relying on routing schemes, whether it is RIP or ICMP
    Redirect messages, is not always a good idea. ICMP Redirect and RIP offer you
    or no choice in verifying that some routing information is indeed authentic. This
    allows malicious good-for-nings to disrupt your entire network traffic, or even
    worse things. For this reason, there are some versions of the networking code
    that treat Redirect messages that affect network routes, as if they were Redirects
    for host routes.


    # The Domain Name System

    Hostname Resolution


    As described, addressing in TCP/IP networking revolves around 32-bit numbers.
    However, you will have a hard time remembering more than a few of these. Therefore,
    hosts are generally known by "ordinary" names such as "gauss" or "strange". It
    is then the application''s duty to find the IP address corresponding to this name.
    This process is called hostname resolution.


    An application that wants to find the IP address of a given hostname does not
    have to provide its own routes for looking up hosts and IP addresses. Instead,
    it relies on a library of functions that do this transparently, called gethostname(3)
    and gethostbyaddr(3). Traditionally, this and a number of related procedures are
    grouped in a standard library called the resolver library; on Linux, these are
    part of the standard libc. Colloquially, this collection of functions are referred
    to as "resolver"


    Now, on a small network like an Ethernet, or even cluster of them, it is not very
    difficult to maintain tables mapping hostnames to addresses. This information
    is usually kept in a file named /etc/hosts. When adding or removing hosts, or
    reassigning addresses, all you have to do is update the hosts on all hosts. Quite
    obviously, this will become burdensome with networks that comprise more than a
    handful of machines.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Issues Of TCP/IP Networking 27


    One solution to this problem is NIS, the Network Information System developed
    by Sun Microsystems, colloquially called YP, or Yellow Pages. NIS stores the hosts
    file (and other information) in a database on a master host, from which clients
    retrieve it as needed. Still, this approach is only suitable for medium-sized
    networks like LANs, because it involves maintaining the entire hosts centrally,
    and distributing it to all servers.


    On the Internet, address information was initially stored in a single HOSTS.TXT
    database, too. This file was maintained at the Network Information Center, or
    NIC, and had to be downloaded and installed by all participating sites. When the
    network grew, several problems with this scheme arose. Beside the administrative
    overhead involved in installing HOSTS.TXT regularly, the load on the servers that
    distributed became too high. Even more severe was the problem that all names had
    to be registered with the NIC, which had to make sure that no name was issued
    twice.


    This is why, in 1984, a new name resolution scheme has been adopted, the Domain
    Name System. DNS was developed by Paul Mockapetris, and addresses both problems
    simultaneously.


    # Enter DNS


    DNS organizes hostnames in a hierarchy of domains. A domain is a collection of
    sites that are related in some sense—be because they form a proper network (e.g.,
    all machines on a campus, or all hosts on BITNET), because they belong to a certain
    organization (like the U.S. government), or because they''re simply geographically
    close. For instance, universities are grouped in the .edu domain, with each university
    or college using a separate subdomain below which hosts are subsumed. Groucho
    Marx University might be given the grousecho.edu domain, with the LAN of the Mathematics
    Department being assigned maths.groucho.edu. Hosts on the departmental network
    would have this domain name tacked onto their hostname; so Erdos would be known
    as erdos.maths.groucho.edu. This is called the fully qualified domain name, or
    FQDN, which uniquely identifies this host worldwide.


    The entry at the root of this tree, which is denoted by a single dot, is quite
    appropriately the root domain, and encompasses all other domains. To indicate
    that a hostname is a fully qualified domain name, rather than a name relative
    to some (implicit) local domain, it is sometimes written with a trailing dot.
    This signifies that the name''s last component is the root domain.


    Depending on its location in the name hierarchy, a domain may be called top-level,
    second-level, or third-level. More levels of subdivision occur, but are rare.
    These are a couple of top-level domains you may see frequently:


    +   * .edu—Mostly U.S.) educational institutions like universities

    * .com—Commercial organizations, companies

    * .org—Noncommercial organizations (often private UUCP networks are in this domain)

    * .net—Gateways and other administrative host on a network

    * .mil—U.S. military institutions'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# The Linux Network Administrators’ Guide: Chapter 2


    +   * .gov—U.S. government institutions


    +   * .uucp—Official, all site names formerly used UUCP without domain having
    been moved to this domain


    Technically, the first four of these belong to the U.S. part of the Internet,
    but you may also see non-U.S. sites in these domains. This is especially true
    of the .net domain. However, .mil and .gov are used exclusively in the U.S.


    Outside the U.S., each country generally uses a top-level domain of its own named
    after the two-letter country code defined in ISO-316. Finland, for instance, uses
    the .fi domain, .fr is used by France, .de by Germany, or .au by Australia, and
    so on. Below this top-level domain, each country’s NIC is free to organize hostnames
    however way they want. Australia, for example, has second-level domain similar
    to the international top-level domains, named com.au, and so on. Others, Germany,
    don’t use this extra level, but rather have slightly long names that refer directly
    to the organizations running a particular domain. For example, it is not uncommon
    to have hostnames like ftp. informatik.uni-erlangen.de. Chuck up to German English.


    Of course, these national domains do not imply that a host below that domain is
    actually located in that country’s NIC. A Swedish manufacturer might have a branch
    in Australia, and still have all its hosts registered with the .se top-level domain.


    Now, organizing the name space in a hierarchy of domain names nicely solves the
    problem of uniqueness; with DNS, a hostname has to be unique within its domain
    to give it a different name from all hosts worldwide. Furthermore, fully qualified
    names are easy to remember. Taken by themselves, these are already very good reasons
    to split a large domain into subdomains.


    But DNS does more than you for this: It allows you to delegate authority over
    a subdomain to its administrators. For the examples, at the Grouch Computing Center
    might create a subdomain for each department; we encountered the math and physics
    subdomains above. When they find the network at the Physics Department too large
    and chaotic to manage from outside (after all, physicists are known to be an unruly
    bunch of people), they may simply pass control over the physics.groucho.edu domain
    to the administrators of this network. They are free to use hostnames they like,
    and assign IP addresses from their network in whatever fashion the like, without
    outside interface.


    To this end, the name space is split into zones, each rooted at a name. The subtle
    difference between a zone and a domain: The domain groucho.edu encompasses all
    hosts at the Grouch Marx University, while the zone groucho.edu includes only
    the hosts that are managed by the Computing Center directly, for example those
    at the Mathematics Department. The hosts at the Physics Department belong to a
    different zone, namely physics.groucho.edu.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Name Lookups With DNS


    At first glance, all this domain and zone fuzz seems to make name resolution an
    awfully complicated business. After all, if no central authority controls what
    names are assigned to hosts, then how is a humble usiper supposed to know?


    Now comes the really ingenious part about DNS. If you want to find out the IP
    address of Erdos, then DNS says ask the people you manage, and they will tell
    you.


    In fact, DNS is a giant distributed database. It is implemented by means of so-called
    name servers that supply information on a given domain or set of domains. For
    each zone, there are at least two, at most few, name servers that hold all authoritative
    information on hosts in that zone. To obtain the IP address of Erdos, all you
    have to do is contact the name server for the groucho.edu zone, which will then
    return the desired data.


    Easier said than done, you might think. So how do I know to reach the name server
    at Groucho Marx University? In case your computer is not equipped with an address-resolving
    oracle, DNS provides for this, too. When your application needs to look up information
    on Erdos, it contacts a local name server, which conducts a so-called iterative
    query for it. It starts by sending a query to a name server for the root domain,
    asking for the address of erdos.maths.groucho.edu. The root name server recognizes
    this name does not belong to its zone of authority, but rather to one below the
    .edu domain. Thus, it tells you to contact an .edu name server for more information,
    and includes a list of all .edu name servers with their addresses. Your local
    name server will then go and query one of those, for instance a.isi.edu. In a
    manner similar to the root name server, a.isi.edu knows that groucho.edu people
    run a zone of their own, and point you to theirs. The local name server will then
    present its query for Erdos and return the corresponding IP address.


    Now, this looks like a lot of traffic being generated for looking up a measly
    IP address, it''s really minuscule compared to the amount of data that would have
    to be transferred if we were still stuck with HOSTS.TXT. But there''s still room
    for improvement with this scheme.


    To improve response time during future queries, the name server will store the
    information obtained in its local cache. So the next time anyone on your local
    network wants to look up the address of a host in the groucho.edu domain, your
    name server will not have to go through the whole process again, but will rather
    go to the groucho.edu name server directly. If it didn''t, then DNS would be as
    bad as any other method, because each query would involve the root name servers.


    Of course, the name server will not keep this information forever, but rather
    discard it after some period. This expiry interval is called the time to live,
    and TTL. Each datum in the DNS database is assigned a TTL by administrators of
    the responsible zone.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Domain Name Servers


    Name servers that hold all information on hosts within a zone are called authoritative
    for this zone, and are sometimes referred to as master name servers. Any query
    for a host within this zone will finally find down at one of these master name
    servers.


    To provide a coherent picture of a zone, its master servers must be fairly well
    synchronized. This is achieved by making one of them the primary server, which
    loads its zone information from data files, and making the secondary servers who
    transfer the zone data from the primary server at regular intervals.


    One reason to have several name servers is to distribute work load; another is
    redundancy. When one name server fails in a benign way, like crashing or losing
    its network connection, all queries will fall back to the other servers. Of course,
    this scheme doesn''t protect you from server malfunctions that produce wrong replies
    to all DNS requests, e.g., from software bugs in the server program itself.


    Of course, you can also think of a name server that is not authoritative for any
    domain. (Well, almost. A name server at the very least has to provide name service
    to localhost and reverse lookups of 127.0.0.1.) This type of server is useful,
    nevertheless, as it is still able to conduct DNS queries for the applications
    running on the local network, and cache the information. It is therefore called
    a caching-only server.


    # The DNS Database


    We have seen that DNS does not only deal with IP addresses of hosts, but also
    changes information on name servers. There are in fact a whole bunch of different
    types of entries the DNS database may have.


    A single piece of information from the DNS database is called a resource record,
    or RR for short. Each record has a type associated with it, describing the sort
    of data it represents, and a class specifying the type of network it applies to.
    The latter accommodates the needs of different addressing schemes, like IP addresses
    (the IN class), or addresses of Hesiod networks (used at MIT), and a few more.
    The prototypical resource record type is the A record which associates a fully
    qualified domain name with an IP address.


    Of course, a host may have more than one name. However, one of these names must
    be identified as the official, or canonical hostname, while the others are simply
    aliases referring to the former. The difference is that the canonical hostname
    is the one with an A record associated, the others only have a record of type
    CNAME which points to the canonical hostname.


    We will not go through all record types here, but save them for a later chapter,
    and give you a brief example here.


    From A and CNAME records, you can see a special record at the top of the file,
    stretching several lines. This is the SOA resource record, signaling the Start
    of Authority,'
  merge: -1
