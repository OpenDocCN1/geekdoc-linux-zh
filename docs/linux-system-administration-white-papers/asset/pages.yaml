    \ local file is only kept as a backup if DNS and NIS should fail. In this case,\
    \ you would want to check the local file last.\n\nCurrently, NYS supports the\
    \ following nsswitch.conf entries: hosts, networks, passwd, group, shadow, services,\
    \ protocols, rpc, and others. More entries are likely to be added.\n\nListing\
    \ 9.1 shows a more complete example which introduces another feature of nsswitch.conf:\
    \ The [NOTFOUND=return] key in the entries tells NIS to return if the desired\
    \ item couldn't be found in the NIS or DNS database. That is, NYS will continue\
    \ and search the local files only if to the NIS and DNS servers failed for some\
    \ other reason. The local files will then be used at boot time and as a backup\
    \ when the NIS server is down.\n\n# Listing 9.1 Example of a Name Service Switch\
    \ config file.\n\n```\n#\n#etc/nsswitch.conf\n#\n example Name Service Switch\
