- pgno: 83
  md: '# 60 The Linux Administrators’ Guide: Chapter 5


    interface) has been set to the maximum value of 1,500 bytes. All these values
    can be over-ridden with special options that will be discussed later.


    Quite similar to the loopback case, you now have to install a routing entry that
    informs the kernel about the network that can be reached through eth0. For the
    Virtual Brewery, you would invoke route


    ```

    # route add -net 191.72.1.0

    ```


    At first, this looks a little like magic, because it''s not really clear how route
    detects which interface to route through. the trick is rather simple: The kernel
    checks inter-faces that have been configured so far and compares the destination
    address (191.72.1.0 in this case) to the network part of the interface address
    (that, is, bitwise and of inter-face address and the mask). The only interface
    matches eth0.


    Now, what''s the -net option for? This is used because route can handle both routes
    to net-works and single to hosts (as you have seen above with localhost). When
    being given an address in dotted code quotation, it attempts to guess whether
    it is a network or a hostname by looking at the host part bits. If the address''s
    host part is zero, route assumes it denotes a network, otherwise it takes it as
    a host address. Therefore, route would think 191.72.1.0 is a host address rather
    than a network number, because it cannot know that we use subnetting. We therefore
    have to tell it explicitly that it denotes a network, giving it the -net flag.


    Of course, the above route command is a little tedious to type, and it''s prone
    to spelling mistakes. A more convenient approach is to use the network names we
    have defined in /etc/ networks above. This makes the command much more readable;
    even the -net flag can now be omitted, because route now knows that 191.72.1.0
    denotes a network.


    ```

    # route add brew-net

    ```


    Now that you''ve finished the basic configuration steps, we want to make sure
    your Ethernet interface is indeed running happily. Choose a host from your Ethernet,
    for instance vlager, and


