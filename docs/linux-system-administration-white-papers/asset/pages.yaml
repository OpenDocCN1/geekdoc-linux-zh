- pgno: 176
  md: '# Managing Taylor UUOCP 153


    Parameters before the very first system set default values used for all systems.
    Usually, you will set protocol parameters and the like in the defaults section.


    Below, the most prominent fields are discussed in some detail.


    # System Name


    The system command names the remote system. You must specify the correct name
    of the remote system, not an alias you invented, because uuucico will check it
    against what the remote system says it is called when you log on. (Older Version
    2 UUOCS don''t broadcast their name when being called; however, newer implementations
    will, and so does Taylor UUCP.)


    Each system name may appear only once. If you want to use several sets of configurations
    for the same system (as different telephone numbers uuucico should try in), you
    can specify alternates. Alternates are described below.


    # Telephone Number


    If the remote system is to be reached over a telephone line, the phone field specifies
    the number whom should dial. It may contain several tokens interpreted by uuucico''s
    dialing procedure. An equal sign means to wait for a secondary dial, and a dash
    generates a one-second pause. For instance, some telephone installations will
    choke when you pause between dialing the prefix code and telephone number. (Don''t
    know the proper English for this—you know, something like a company''s private
    internal installation where you have to dial a 0 or 9 to get a line to the outside)


    Any embedded alphabetical string may be used to hide site-dependent information
    like area codes. Any such string is translated to a dialcode using the dialcode
    file.


    With these translations, you can use a phone number as Bogham7732 in the sys file,
    which makes things probably a little more legible.


    # Port And Speed


    The port and speed options are used to select the device used for calling the
    remote system, and the maximum speed to which the device should be set. (The baud
    rate of the tty option must, at least as high as the maximum transfer speed.)
    A system entry may use either option alone, or both options in conjunction. Looking
    up a suitable device in the port file, only those ports selected that have a matching
    port name and/or speed range.


    Generally, using the speed option should suffice. If you have only one serial
    device defined in port, uuucico will pick the right one anyway, so you only have
    to give it the desired speed. If you have several modals attached to your systems,
    you still don''t want to name a particular port, because if uuucico finds there
    are several matches, it tries each device in turn until it finds an unused one.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# The Login Chat


    Above, we already encountered the login chat script, which tells uucico how to
    log into the remote system. It consists of a list of tokens, specifying strings
    expected and sent by the local uucico system. The intention is to make uucico
    wait until the remote machine sends a login prompt, return the login name, wait
    for the remote system to send the password prompt, and send the password. Expect
    and send strings are given in alternation. uucico automatically appends a carriage
    return (r) to any send string.


    uucico also allows for some sort of conditional execution, for example, in the
    case that the remote machine''s getty needs to be reset before sending a prompt.
    For this, you can attach a subchat to an except string, offset by a dash. The
    subchat is executed only if the main except fails, a timeout occurs. One way to
    use this feature is to set a BREAK if the remote site doesn''t display a login
    prompt. The following example gives an all-around script that would also work
    in case you have to Hit before the login appears. Linux tells UUCP not to wait
    for anything and continue with the next send string immediately.


    # Alternates


    Sometimes it is desirable to have multiple entries for a single system, for instance,
    if the system can be reached on different modern modes. With Taylor UUCP, you
    can do this by defining a so-called alternate.


    An alternate entry retains all settings from the main system entry, and specifies
    only those values that be overridden in the default system entry or added to it.
    An alternate is offset from the system entry by a line containing the keyword
    alternate.


    When calling Pablo, uucico will now first dial 123-456, and if this fails, the
    alternate entry retains all settings from the main system entry, and overrides
    only the telephone number.


    # Restricting Call Times


    Taylor UUCP provides a number of ways you may restrict the times when calls can
    be placed to a remote system. You might do this either of limitations the remote
    host places on its services during business hours, or simply to avoid times with
    high call rates. Note that it is always possible to override call time restrictions
    by giving uucico the -S or -f option.


    By default, Taylor UUCP will allow connections at any time, so you have to use
    some sort of time specification in the sys file. If you don''t care about call
    time restrictions, you can specify the time option with a value of Any in your
    sys file.


    The simplest way to restrict call time is the time entry, which is followed by
    a string made of a day and a time subfield. Day may be any of Mo, Tu, We, Th,
    Fr, Sa, Su combined, or Any, Never, or W for weekdays. The time consists of two
    24-hour clock values, separated by a dash. They specify the range during which
    calls may be placed. The combination'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'Managing Taylor UUCP 155


    these tokens is written without white space in between. Any number of day and
    time specifications may be grouped together with commas.


    The special time strings Any and Never mean what they say: Calls may be placed
    at any or no time, relatively.


    The time command takes an optional second argument that deserves a retry in minutes.
    When an attempt to establish a connection fails, uucico will not allow another
    attempt to dial up the remote host within a certain interval. By default, uucico
    uses an exponential backoff scheme, where the retry interval increases with each
    repeated failure. For instance, when you specify a retry time of 5 minutes, uucico
    will refuse to call the remote system within 5 minutes after the last failure.


    The sometime command allows you to attach a maximum spool grade to a schedule.
    This allows jobs with a spoolgrade of C (usually, queued with grade B or C) to
    be transferred whenever a caller is established, while news (usually queued with
    grade N) will be transferred only during the night and at weekends.


    Just like time, the timegrade command takes a retry interval in minutes as an
    optional third argument.


    However, a caveat about spool grades is in order here: First, the sometime option
    applies only to what your system sends; the remote system may transfer whatever
    it likes. You can use the call-timegrade option to explicitly request it to send
    only jobs above some spool grade; but there''s no guarantee it will obey this
    request. (If the remote system runs Taylor UUCP, it will obey.)


    Similarly, the timegrade field is not checked when a remote system calls in, so
    any jobs queued for the caller will your uucico to restrict itself to a certain
    spool grade.


    # What Devices There Are: The port File


    The port file tells uucico about the available ports. These may be modem ports,
    but other types such as direct lines and TCP sockets are supported as well.


    Like the sys file, port consists of separate entries starting with the keyword
    port, followed by the port name. This name may be used in the sys file''s port
    statement. The name needs not be unique; if there are several ports with the same
    name, uucico will try in turn until it finds one that


    The port command should be immediately followed by the type statement that describes
    what type of port is described. Valid types are modem, direct for direct connections,
    and tcp for TCP sockets. If the port command is missing, the port type defaults
    to modem.'
