    # Writing Hosts And Networks Files


    After you subnetted your network, you should prepare for simple hostname resolution
    using the /etc/hosts files. If you are not using DNS or NIS for address resolution,
    you have to put all hosts in the hosts file.


    Even if you have to run DNS or NIS during normal operation, you want to have some
    subset of all hostnames in /etc/hosts nevertheless. For one, you want to have
    some sort of name resolution even when no network interfaces are running, example
    during boot time. This is not only a matter of convenience but also allows you
    to use symbolic hostnames in your rc.inet scripts. Thus, when changing IP addresses,
    you only have to copy an updated hosts file to all machines and reboot, rather
    than having to edit a large number of rc files separately. Usually, you will put
    all local hostnames and addresses in hosts, those of any gateways and NIS servers
    used. You will need the address of NIS servers if you use Peter Erikson''s NYS.
    Other NIS implementations locate their servers at run-time only by usingbind.


    Also, during testing, you should make sure your resolver uses information from
    the hosts file. Your DNS or NIS software may come with sample files that may produce
    strange results when used. To make all applications use /etc/hosts exclusively
    when looking up the IP address of a host, you have to edit the /etc/hosts.conf
    file. Comment out all lines that begin with the keyword order by preceding them
    with a hash sign, and insert the line


    hosts'
