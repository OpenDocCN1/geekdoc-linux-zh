    # Routing Through A Gateway


    In the previous section, I covered only the case of setting up a host on a single
    Ethernet.

    Frequently however, one encounters networks connected to one another by gate-

    ways. These gateways may simply link two or more Ethernets, but may provide a
    link to the

    outside world, the Internet, as well. In order to use the service of a gateway,
    you have to

    provide additional routing information to the networking layer.


    For instance, the Ethernets of the Virtual Brewery and the Virtual Winery are
    linked through

    a gateway, namely the host vlager. Assuming that vlager has already been configured,

    we only have to add another entry to vstout routing table that tells the kernel
    it can reach

    h hosts on the Winery''s network through vlager. The appropriate incantation of
    route is

    shown below; the gw keyword tells it that the next argument denotes a gateway.


    ```

    # route add wine-net gw vlager

    ```


    Of course, any host on the Winery you wish to talk to must have a corresponding

    routing entry for the Brewery''s network, otherwise you would only be able to
    send data from

    vstout to vbardolino, but any response returned by the latter would go into the
    great bucket.'
