- pgno: 148
  md: '# Chapter 9


    # The Network Information System


    When you are running a local area network, your overall goal is usually to provide
    an environment to your users that makes the network transparent. An important
    stepping stone to this end is to keep vital data stone such as user account information
    synchronized between all hosts. We have seen before that for hostname resolution,
    a powerful and sophisticated service exists, being DNS. For other tasks, there
    is no such specialized service. Moreover, if you manage only a small LAN with
    no Internet connectivity, setting up DNS may not seem worth the trouble for many
    administrators.


    This is why Sun developed NIS, the Network Information System. NIS provides generic
    database access facilities that can be used to distribute information, such as
    that contained in the passwd and groups files to all hosts on your network. This
    makes the network appear just as a single system, with the same accounts on all
    hosts. In a similar fashion, you can use NIS to distribute the hostname information
    from /etc/hosts to all machines on the network.


    NIS is based on RPC, and comprises a server, a client-side library, and several
    administrative tools. Originally, NIS was called Yellow Pages, or YP, which is
    still widely used to informally refer this service. On the other hand, Yellow
    Pages is a trademark of British Telecom, which required Sun to drop that name.
    As things go, some names stick with people, and so YP lives on a prefix to the
    names of NIS-related commands such as ypbind, ybind, and so for forth.


    Today there are free implementations of NIS available. One is from the BSD Net-2
    release, and has been derived from a public domain reference implementation donated
    by Sun. The library client code from this release has been in the GNU libc for
    a long time, while the'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'administrative programs have only recently posted by Swen Thümmler. (He can
    be reached at swen@uni-paderborn.de. The NIS clients are available as yp-linux.tar.gz
    from sunsite.unc in system/Network.) An NIS server is missing from the reference
    implementation. Tobias Reiter has written another NIS package including all tools
    and a server; it calls yps. (The current version [as of this writing] is yps-0.21
    and can be obtained from ftp.lysator.liu.se in the /pub/NYS directory).


    Currently, a rewrite of the NIS code is being done by Peter Erikson (pen@lysator.liu.se),
    and supports both plain NIS and Sun''s revised NYS. NYS does not only provide
    a set of NIS tools and a server but also adds a new set of library functions,
    which will most probably make it into the standard lib eventually. This includes
    a new configuration scheme for hostname resolution that replaces the current scheme
    using host.conf. The features of these functions will be discussed


    This chapter will focus on NYS rather than the other two packages, to I will refer
    as the "traditional" NIS code. If you want to run any of these packages, the instructions
    in this chapter may not be enough. To obtain additional information, please get
    a standard book on NIS, like Hal Stern''s NFS and NIS, or check out the howto
    at www.suse.de/~kukuk/linux/HOWTO/NIS-HOWTO.


    For the time being, NYS is still under development, and therefore standard utilities
    such as the network programs or the login program are not yet aware of the NYS
    configuration scheme. Until NYS is merged into the mainline lib, you will have
    to recompile all binaries. In any of these applications'' Makefiles, specify -lnsl
    as the last option libc to the linker. This links in the relevant functions from
    libns, the NYS library, instead of the standard C-library.


    # Getting Acquainted With NIS


    NIS keeps database information in its so-called maps key-value pairs. Maps are
    stored on a central host running the NIS server, from which clients retrieve the
    information through various RPC calls. Quite frequently, maps are stored in DBM
    files (DBM is a simple database management library that uses hashing techniques
    to speed up operations). There''s a free DBM implementation from the GNU project
    called gdbm, which is part of distributions.


    The maps themselves are usually generated from master text files such as /etc/hosts
    or /etc/passwd. For some files, several maps are created, for each search key
    type. For instance, you may search the hosts file for a hostname as well as for
    an IP address. Additionally, two NIS maps are derived from it, called hosts.dbname
    and hosts.byaddr.


    There are other files and maps you may find support for in some NIS package or
    other. These may contain information for applications not discussed in this book,
    such as the bootparams map that may be used by BOOTP servers, or which currently
    don''t have any function (like the ethers.dbname and ethers.byaddr maps).'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# The Network Information System 127


    For some maps, people commonly use nicknames, which are shorter and therefore
    easier to type. To obtain a full list of nicknames understood by your NIS tools
    (for Red Hat version 6), run the following command:


    ```

    $ cat /var/yp/nicknames

    ```


    The NIS server is traditionally called ypserv. For an average network, a single
    server suffices; large networks may choose to run several of these on different
    machines and different segments of the network to relieve the load on the server
    machines. These servers are synchronized by making one of the master server, and
    the others slave servers. Maps will be created only on the master server''s host.
    From there, they are distributed to all servers.


    You will have noticed that we have been talking about "networks" vaguely all the
    time; of course, a distinctive concept in NIS that refers to such network, that
    is, the collection of all hosts that share of their system configuration data
    through NIS: the NIS domain. Unfortunately, NIS domains have absolutely nothing
    in common with the domains encountered in DNS. To avoid any ambiguity throughout
    this chapter, I will always specify which type of domain I mean.


    NIS domains have a purely administrative function only. They are mostly invisible
    to users, except for the sharing of passwords between all machines in the domain.
    Therefore, the name given to a NIS domain is relevant only to the administrators.
    Usually, any name will do, as long as it is different from any other NIS name
    on your local network. For instance, the administrator at the Virtual Bakery may
    choose to create two NIS domains, one for the Brewery itself, and one for the
    Winery, which she names brewery and winery, respectively. Another quite common
    scheme is to use the DNS domain name for your host, you can use the domaincommand;
    to set the domain name, you must become super-user and type:


    ```

    # domainname <NISDOMAIN>

    ```


    NIS domains determine which NIS server an application will query. For instance,
    the login program on a host at the Winery, of course, only query the NIS server
    (Winery of them, if there were several) for a user''s password information; an
    application on a Brewery host should stick with the Brewery''s server.


    One mystery remains to be solved, how a client finds out which server to connect
    to. The simplest approach would be to have a configuration file that names the
    host on which to find the server. However, this approach is rather inflexible,
    because it doesn''t allow clients to use different servers (from the same domain,
    course), depending on their availability. Therefore, traditional NIS implementations
    rely on a special daemon called ypbind to detect a suitable NIS server in their
    NIS domain. Before being able to perform any NIS queries, any application first
    finds out from ypbind which server to use.'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'ypbind probes for servers by broadcasting to the local IP network; the first
    to respond

    asumed to be the potentially fastest one and will be used in all subsequent NIS
    queries.

    After a certain interval has elapsed, or if the server becomes unavailable, ypbind
    will probe

    for active servers again.


    Now, the arguably point about dynamic binding is that you rarely need it and that
    it introduces a security problem: ypbind blindly believes whoever answers, which
    could be a humble NIS server as well as a malicious intruder. Needless to say
    this becomes especially trouble-some if you manage your password databases over
    NIS. To guard against this, NIS does not-if you use ypbind by default, but rather
    picks the server hostname from a configuration file.


    # NIS Versus NIS+


    NIS and NIS+ share little more than their name and a common goal. NIS+ is structured
    in an entirely different way. Instead of a flat name space with disjoint NIS domains,
    it uses a hierarchical name space similar to that of DNS. Instead of maps, so-called
    tables are used that are made of rows and columns, where each row represents an
    object in the NIS database, while the columns cover the properties of the objects
    NIS knows and cares about. Each table for a given NIS+ domain comprises of its
    parent domains. In addition, any entry in a table may contain a link to another
    table. These features make it possible to structure information in many ways.


    Traditional NIS has an RPC version number of 2, while NIS+ is version 3.


    NIS+ does not seem to be widely used yet, and I don''t really know how much about
    it (well, almost nothing). For this reason, we will not deal with it here. If
    you are interested in learning more about it, please refer to the current howto
    at www.suse.de/~kukuk/linux/HOWTO-NIS.html


    # The Client Side Of NIS


    If you are familiar with writing and porting network applications, you will notice
    that NIS maps listed above correspond to library functions in the C-library. For
    instance, to obtain passwd information, you generally use the getpwnam(3) and
    getpwuid(3) functions, which return the account information associated with the
    given username or numerical user ID, respectively. Under normal circumstances,
    these functions will perform the requested lookup on the standard file, such as
    /etc/passwd.


    A NIS-aware implementation of these functions, however, will modify this behavior
    and place an RPC call to the NIS server look up the username or ID. This happens
    completely transparent to the application. The function may either “append” the
    NIS map or “replace” the original file with it. Of course, this does not refer
    to a real modification of the file, it only means that it appears to the application
    as if the file had been replaced or appended to.'
