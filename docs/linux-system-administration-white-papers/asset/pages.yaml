- pgno: 139
  md: '# 116 The Linux Network Administrators'' Guide: Chapter 8


    (most drastically demonstrated by the RTM Internet worm, or do not distinguish
    between secure hosts from requests for a particular service will be accepted and
    insecure hosts whose requests will be rejected. We already briefly discussed the
    finger and tftp services above. One, thus would want to limit access to these
    services to "trusted hosts", which is impossible with the usual setup, where inetd
    provides to all clients, or not all)


    A useful tool for this is tcpd (written by Wietse Venema, wietse@zw.win.tue.nl),
    a so-called daemon wrapper. For TCP services you want to monitor or protect, it
    is invoked instead of the server program. tcpd logs the requests to the syslog
    daemon, cchecks if the remote host is allowed to use that service, and if this
    succeeds it will execute the real server program. Note that this does not work
    with UDP-based services.


    For example, to wrap the finger daemon, you will have to change the corresponding
    line in inetd.conf


    ```

    # wrap finger daemon

    finger stream tcp nowait root /usr/sbin/tcpdin.fingerd

    ```


    Without adding any access control, this will affect the client just as a usual
    finger setup, except that any requests are logged to syslog''s auth facility.


    Access control is implemented by means of two files called /etc/hosts.allow and
    /etc/hosts.deny. They contain entries allowing and denying access, respectively,
    to certain services and hosts. When tcpd handles a request for a service as finger
    from a client host namediff.foobar.com it scans hosts.allow and hosts.deny (in
    this order) for an entry matching both the service and client host. If a matching
    entry is found in hosts.allow, access is granted, regardless of any entry in hosts.deny.
    If a match is found in hosts.deny, the request is rejected by closing down the
    connection. If no match is found at all, the request is accepted.


    Entries in the access files look like this:


    ```

    servicelist: hostlist [:shellcmd]

    ```


    Servicelist and hotlist are defined in Table 8.2.


    | Table 8.2 | Servicelist and hotlist. |

    |---||

    | servicelist | This is a list of service names from /etc/services, or the keyword
    ALL. To match all services except finger and tftp, "ALL EXCEPT finger, tftp."
    |

    | hotlist | This is a list of hostnames or IP addresses, the keywords ALL, LOCAL,
    or UNKNOWN, ALL matches any host, while LOCAL matches hostnames containing a dot.
    (Usually local hostnames are obtained from lookups in /etc/hosts no dots.) UNKNOWN
    matches any host whose address lookup failed. A name starting with a dot matches
    all hosts whose domain is equal to this name. For example, .foobar.com matches.
    There are also provisions for IP network addresses and subnet numbers. Please
    refer to the hosts_access manual page for details.'
  merge: -1
  img_proc: true
