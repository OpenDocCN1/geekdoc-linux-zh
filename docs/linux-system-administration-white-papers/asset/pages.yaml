- pgno: 168
  md: '# Chapter 11

    Managing Taylor UUCP


    UUCP was designed in the late 1970s by Mike Lesk at AT&T Bell Laboratories to
    provide a simple dial-up network over public telephone lines. Since most people
    that want to have email and Usenet news on their home machine still communicate
    through mediums, UUCP has remained very popular. Although there are many implementations
    running on a wide variety of hardware platforms and operating systems, they are
    compatible to a high degree.


    However, as with most software that has somehow become "standard" over the years,
    there is no UUCP which one would call the UUCP that has undergone a steady process
    of evolution since the first version, which was implemented in 1976. Currently,
    there are two major species, which differ mainly in their support of hardware
    and their configuration. Of these, various implementations exist, varying slightly
    from their siblings.


    One species is the so-called "Version 2 UUCP," which dates back to a 1977 implementation
    by Mike Lesk, David A. Novitz, and Greg Cheesson. Although it is fairly old, it
    is still in frequent use. Recent implementations of Version 2 provide much of
    the comfort of the newer UUCP species.


    The second species was developed in 1983, and is commonly referred to as BNU (Basic
    Networking Utilities), HoneyDanBet UUCP, or HDB for short. The name is derived
    from the authors'' names: P. Honeyman, D. A. Novitz, and B. E. Redman. HDB was
    conceived to eliminate some of Version 2 UUCP''s deficiencies. For example, new
    transfer protocols were added, and the spool directory was split so that now there
    is one directory for each site you have UUCP traffic with.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# The Linux Network Administrators'' Guide: Chapter 11


    The implementation of UUCP currently distributed with is Taylor UUCP 1.04 (written
    and copyrighted by Ian Taylor, 1993), which is the version this chapter is based
    on. Taylor UUCP Version 1.04 was released in February 1993. Apart from traditional
    configuration files, Taylor UUCP may also be compiled to understand the new-style—a.k.a.
    “Taylor”—configuration files.


    At the time of writing, version 1.05 is the latest version and will soon make
    its way into many distributions. The differences between these versions mostly
    affect features you will never use, so you should be able to configure UUCP 1.05
    using the information from this book.


    As included in most distributions, Taylor UUCP is usually compiled for BNU compatibility,
    the Taylor configuration scheme, or both. As the latter is much more flexible,
    and probably easier to understand than the often obscure BNU configuration files,
    I will describe the Taylor scheme below.


    The purpose of this chapter is not to give you an exhaustive description of what
    the command line options for the UUCP commands are and what they do, but to give
    you an introduction on how to set up a UUCP node. The first section gives a hopefully
    gentle introduction about how UUCP implements execution and file transfers.


    We will, assume that you are familiar with the user programs of the UUCP suite.
    These are uucp and uux. For a description, please refer to the online manual pages.


    Besides the publicly accessible programs, uucp and uux, the UUCP suite contains
    a number of commands used for administrative purposes only. They are used to monitor
    UUCP traffic across your node, remove old files, or compile statistics. None of
    these will be described here, because they''re peripheral to the main tasks of
    UUCP. Besides, they''re well documented and easy to understand. However, there
    is a third category, which comprises the actual UUCP “work horses.” They are called
    uasto (where cico stands for copy-in-out), and uuxt, which executes jobs from
    remote systems.


    # More Information On UUCP


    Those who don''t find everything they need in this chapter should read the documentation
    that comes along with the package. This is a set of texinfo files that describe
    the setup using the Taylor configuration scheme. Texinfo can be converted to DVI
    and GNU info files using tex and makeinfo.


    If you want to use BNU or ever (shudder!) Version 2 configuration files, there
    is a very good book, Managing UUCP and Usenet. It is very useful. Another good
    source for information about UUCP on Linux is Guilhem Aznar (guilhem.@.eil.qc.ca)
    UUCP-HOWTO, which is regularly posted at comp.os.linux.announce.


    There''s also a newsgroup for the discussion of UUCP, called comp.mail.uucp. If
    you have questions to Taylor UUCP, you may be better off asking them there, rather
    than on the internet.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# Introduction


    # Layout Of UUCP Transfers And Remote Execution


    Vital to the understanding of UUCP is the concept of jobs. Every transfer a user
    initiates with uucp or uuox is called a job. It is made up of a command to be
    executed on a remote system, and a collection of files to be transferred between
    sites. One of these parts may be missing.


    UUCP does not generally call the remote system immediately to execute a job (or
    else you could make so with kermit). Instead, it temporarily stores the job description
    away. This is called pooling. The directory tree under which jobs are stored is
    therefore located in /var/spool/uuid. In our example, the job description would
    contain information about the remote command to be executed (lpr), the user who
    requested the execution, and a couple of other items. In addition to the job description,
    UUCP has to store the input file, netguide.ps.


    The exact location and naming of pool files may vary, depending on some compile-time
    options. HDR-compatible UUCPs generally store pool files in a directory named
    /var/spool/ uuucp/site, where site is the name of the site. When compiled for
    Taylor configuration, UUCP will create subdirectories below the site-specific
    spool directory for different types of pool files.


    At regular intervals, UUCP dials the remote system. When a connection to the remote
    machine is established, UUCP transfers the files describing the job, plus any
    input files. The incoming jobs will not be executed immediately, but only after
    the connection terminates. This is done by uuxqt, which also takes care of forwarding
    any jobs if they are designated for another site.


    To distinguish between important and less important jobs, UUCP assigns a grade
    to each job. This is a single letter, ranging from 0 through 9, A through Z, and
    a through 2, in decreasing precedence. Mail is customarily spooled with grade
    B or C, while news is spooled with grade N. Jobs with higher grade are transferred
    earlier. Grades may be assigned using the -g flag when using uucp or uuox.


    You can also disallow the transfer of jobs below a given grade at certain times.
    This is also called the maximum spool grade allowed during a conversation and
    defaults to -z. Note the terminological ambiguity here: A file is transferred
    only if it is equal or above the maximum spool grade.


    # The Inner Workings Of uuicco


    To understand why uuicco needs to know certain things, a quick description of
    how it actually connects to a remote system might be in here.


    When you execute uuicco -s system from the command line, it first has to connect
    physically. The actions taken depend on the type of connection to open—e.g., when
    using'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'telephone line, it has to find a modem, and dial out. Over TCP, it calls gethostbyname(3)
    to convert the name to a network address, find out which port to open, and bind
    the address to the corresponding socket.


    After this connection has been established, an authorization procedure has to
    be passed. It generally consists of the remote system asking for a login name
    and possibly a password. This is commonly called the login chat. The authorization
    procedure is performed either by the usual getty/login suite, or over TCP sockets--by
    uucp itself. If authorization succeeds, the remote ends free up uico. The local
    copy of uucp which initiated the connection is referred to as master, the remote
    copy as slave.


    Next follows the handshake phase: The master now sends its hostname, plus several
    flags. The slave checks for permission to log in, send and receive files, and
    so on. The flags describe (other things) the maximum grade of spool files to transfer.
    If enabled, a conversation count, or call sequence number takes place here. With
    this feature, both sites maintain a count of successful connections, which are
    compared. If they do not match, the handshake fails. This is useful to protect
    yourself against impostors.


    Finally, the two uucps try to agree on a common transfer protocol. This protocol
    governs the way data is transferred, checked for consistency, and retransmitted
    in case of an error. There is a need for different protocols because of the differing
    of connections supported. For example, telephone lines require a “safe” protocol,
    which is pessimistic about errors, while TCP transmission is inherently reliable
    and can use a more efficient protocol that forgoes extra error checking.


    After the handshake is complete, the actual transmission phase begins. Both ends
    turn on the selected protocol driver. The drivers possibly perform a protocol-specific
    initialization sequence.


    First, the master sends all files queued for the remote system whose spool grade
    is high enough. When it finishes, it informs the slave that it is done, and the
    slave may now hang up. The slave can either agree to hang up, or take over the
    conversation. This is a change of roles: Now the remote system becomes master,
    and the local one becomes slave. The new master now sends its files. When done,
    both uucps''s exchange termination messages, and close the connection.


    We will not go into this in greater detail. Please refer to the sources or any
    good book about UUCP for this. There is also a reality article floating around
    the net, written by David A. Novitz, who gives a detailed description of the UUCP
    protocol. The Taylor UUCP FAQ also discusses details of the way UUCP is implemented.
    It is posted to comp.mail.uucp regularly.


    # uucico Command Line Options


    This section describes the most important command line options for uucico. For
    a complete list, please refer to the uucico manual page.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# UUCP Configuration Files


    In contrast to simpler file transfers, UUCP was designed to be able to handle
    all transfers automatically. Once it is set up properly, interference by the administrator
    should not be necessary on a day-to-day basis. The information required for this
    is kept in a couple of configuration files that reside in the directory /usr/lib/uucp.
    Most of these are used only when dialing out.


    # Note


    In this chapter you will see multiple instances in which the referred example
    is not available. We''ve left the text reference, but please refer to the LDP
    for the examples when they become available.


    # A Gentle Introduction To Taylor UUCP


    To say that UUCP configuration is hard would be an understatement. It is a hairy
    subject, and the sometimes terse format of the configuration files doesn''t make
    things easier (although the Taylor format is almost easy reading compared to the
    older formats in HDB or Version 2).


    To give a feel of how all these files interact, we will introduce you to the most
    important ones, and have a look at sample entries of these files. We won''t explain
    everything in detail now; a more accurate count is given in separate sections
    below. If you want to set up your machine for UUCP, you had best start with some
    sample files and adapt them gradually. You can pick either those shown below,
    or those included in your distribution.


    All files described in this section are kept in /usr/lib/uucp or a subdirectory
    thereof. Some distributions include UUCP binaries that support for both HDB and
    Taylor configuration, and use different subdirectories for each configuration
    file set. There will usually be a README file in /usr/lib/uucp.


    For UUCP to work properly, these files must be owned by the uucp user. Some of
    them contain passwords and telephone numbers, and therefore have permissions of
    600.


    # Note


    Although most UUCP commands are setuid to uucp, you must make sure the uuckh program
    is not. Otherwise, users will be able to display passwords even they have mode
    600.


    The central UUCP configuration file is /usr/lib/uucp/config, and is used to set
    general parameters. The most important of them (and for now, the only one), is
    your host''s UUCP name.


    The next important configuration file is the sys file. It contains all system-specific
    information of sites you are linked to. This includes the site''s name, and information
    on the link itself, such as the telephone number when using a modem link.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# 150 The Linux Network Administrators'' Guide: Chapter 11


    The port names a port to be used, and time specifies the times at which it may
    be called. That describes the log chat scripts—the sequence of strings that must
    be exchanged between uucico to log into Pablo. We will get back to chat scripts
    later. The port command does not name a device file such as /dev/cu1, but rather
    names an entry in the port file. You can assign these names as you like as long
    as they refer to a valid entry.


    The port file holds information specific to the link itself. For modem links,
    it describes the device special file to be used, the range of speeds supported,
    and the type of dialing equipment connected to the port. The entry below /dev/cu2
    (a.k.a. COM 2), to which a NakWell modem is capable of running at speeds up to
    38,400bps. The entry''s name was chosen to match the port name given in the sys
    file.


    The information pertaining to the dialers itself is kept in another file, called—you
    guessed. For each dial type, it basically contains the sequence of commands to
    be issued to a remote site, give the phone number. Again, this is specified as
    a chat script.


    The line starting with the modem chat, which is the sequence of commands sent
    to and received from the modem to initialize it and make it the desired number.
    The "T" sequence will be replaced with the phone number by uucico.


    The first thing uucico does is look up Pablo in the sys file. From the sys entry
    for Pablo, it should use the serial1 port to establish the connection. The port
    file tells it that this is a modem port, and that it has a NakWell modem attached.


    Uucico searches for the file describing the NakWell modem, and having one, opens
    the serial port /dev/cu1 and executes the dialer chat. That is, it sends "ATZ",
    waits for the "OK" response, and so on. When encountering the string "T", it substitutes
    the phone number (123-4567) extracted from the sys file.


    After the modem returns CONNECT, the connection has been established, and the
    modem is complete. Uucico returns to the sys file and executes the login chat.
    In our example, it would wait for the "login:" prompt, then send its username
    (Neruda), wait for the "password:" prompt, and send its password, "lorca".


    After completing authorization, the remote end is assumed to fire up its own uucico.
    We will then enter the handshake phase described in the previous section.


    # What UUCP Needs To Know


    Before you start writing the UUCP configuration files, you have to get some information
    it needs to know.


    First, you will have to figure out what device your modem is attached to. Usually,
    the (DOS) ports COM1 through COM4 map to the device files /dev/cu0 through /dev/cua3.
    Most distributions, such as Slack, create a link /dev/modem as a link to the appropriate
    cua* device file, and configure kerm, seyon, and so on, to use this generic file.
    In this case, you should either use /dev/modem in your UUCP configuration, too.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# Managing Taylor UUCP 15


    The reason for this is that all dial-out programs use so-called lock files to
    send a signal when a port is in use. The names of these lock files are a concatenation
    of the string LCK.. and the device file name, for instance LCK..CU. If programs
    use different names for the same device, they will fail to recognize each other''s
    lock files. As a consequence, they will disrupt each other''s session when started
    at the same time. This is not an unlikely event when you schedule your UUCP calls
    using a crontab entry. For details of setting your serial ports, please refer
    to Chapter 4.


    Next, you must find out at speed your modem will communicate. You will have to
    set this to the maximum effective transfer rate you expect to get. The effective
    transfer rate may be much higher than the raw physical transfer rate your modem
    is capable of. For instance, many modems send and receive data at 2,400bps (bits
    per second). Using compression protocols as V.42bis, the actual transfer rate
    may climb up to 9,600bps.


    If UUCP is to do anything, you will need the phone number of a system to call.
    Also, you will need a valid login ID and possibly a password for the remote machine.


    # Tip


    If you''re just trying to get out UUCP, get the number of an archive site near
    you. Write down the login and password—they''re public to make anonymous downloads
    possible. In most cases, they seem something like uucp/uucp or nuuc/nuuc.


    You will also have to know how to log into the system. E.g., do you have to press
    the Break before the login prompt appears? Does it display "login." or "user."
    This is necessary for chopping the chat script, which is a recipe telling uuico
    how to log in. If you don''t know, or if the usual chat script fails, try to call
    the system with a terminal program like kit or minimicom, and write down exactly
    what you have to do.


    # Site Name


    As with TCP/IP-based networking, your host has have a name for UUCP networking.
    As long as you want to use UUCP for file transfers to from sites you dial directly,
    or on a local network, this name does not have to meet any standards. The only
    limitation is that it shouldn''t be longer than seven characters, so as not to
    confuse hosts with file systems that impose a narrow limit on file names.


    However, if you use UUCP for a mail or news link, you should think about the name
    registered with the UUCP Mapping Project. The UUCP Mapping Project is described
    in Chapter 12. Even if you participate in a domain, you might consider having
    an official UUCP name for your site.


    Frequently, people choose their UUCP name to match the first component of their
    qualified domain name. Suppose your site''s address is swim.twobirds.com, then
    your UUCP hostname would be Swim. Think of UUCP sites as knowing each other on
    a first-name basis. Of course, you can also use a UUCP name completely unrelated
    to your fully qualified domain name.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# The Linux Network Administrators'' Guide: Chapter 11


    However, make sure not to use the unqualified site name in mail addresses unless
    you have registered it as your official UOCP name. (The UOCP Mapping Project registers
    all UOCP hostnames worldwide and makes sure they are unique. To register your
    UOCP name, ask the maintainers of the site that handles you; they will be able
    to help you.) At the very best, a name to an unregistered UOCP host will vanish
    in some big black bucket. If you use a name already held by some other site, this
    will be routed to that site, and cause its postmaster no end of headaches.


    By default, the UOCP suite uses the name set by hostname as the site''s UOCP name.
    This name is commonly set in the `/etc/rc` script. If your UOCP name is different
    from what you set as your hostname, you have to use the hostname option in the
    config file to tell uucico about your UOCP name. This is described below.


    # # Taylor Configuration Files


    We now return to the configuration files.


    Taylor configuration files are generally made up of lines containing keyword-value
    pairs. A hash sign introduces a comment that indents to the end of the line. To
    use a hash by itself, you may escape it with a backslash.


    There are quite a number of options you can tune with these configuration files.
    We can''t go into all parameters here, but will cover the most important ones.
    They should be able to configure a modem-based UOCP link. Additional sections
    will describe the modifications necessary if you want to use UOCP over TCP/IP
    or over a direct serial line. A complete reference is given in the Textinfo documents
    that accompany the Taylor UOCP sources.


    When you think you have configured your UOCP system completely, you can check
    your configuration using the uucp tool (located in `/usr/lib/uucp`). uucp reads
    your configuration-files, and provides a detailed report of the configuration
    values used for each system.


    # # General Configuration Options: the config File


    You won''t generally use this file to describe besides your UOCP hostname. By
    default, UOCP will use the name you set with the hostname command, but it is generally
    a good idea to set the UOCP name explicitly.


    Of course, there are a number of miscellaneous parameters that may be set here,
    too, such as the name of the spool directory, or access rights for anonymous UOCP.
    The latter will be described in a later section.


    # # How To Tell UOCP About Other Systems: The sys File


    The sys file describes the systems your machine knows about. An entry is introduced
    by the system keyword; the subsequent lines up to the next system detail the parameters
    specific to that site. Commonly, a system entry will define parameters such as
    the telephone number and the login chat.'
