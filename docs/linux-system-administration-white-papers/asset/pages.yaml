- pgno: 68
  md: '# Chapter 4


    # Setting Up The Serial Hardware


    There are rumors that there are some people out there in Nether who only own one
    PC and don''t have the money to spend on a T1 Internet link. To get their daily
    dose of news and mail nevertheless, they are said to rely on SLIP links, UUCP
    networks, and bulletin board systems (BBSes) that utilize public telephone networks.


    This chapter is intended to help all those people who rely on modems to maintain
    their link. However, there are many details that this chapter cannot go into (for
    instance, how to configure your modem for dial-in). All these topics will be covered
    in the HOWTO located at www.redhat.com/mirrors/LDP/HOWTO/Serial-HOWTO.html (written
    by David S. Lawyer, bf347@lanf.org, and originally by Greg Hankins, gregh@cc.gatech.edu).


    # Communication Software For Modem Links


    There are a number of communication packages available for Linux. Many of them
    are terminal programs, which allow a user to dial into another computer as if
    she were sitting in front of a simple terminal. The traditional terminal program
    for Linux is called Kermit. It is, however, somewhat Spartan. There are more comfortable
    programs available that support a dictionary of telephone numbers, script languages
    for calling and logging into remote systems, and so on. One of them is Minicom,
    which is close to some terminal programs former DOS users might be accustomed
    to. There are also X-based communications packages, e.g., Seyon.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'Also, a number of Linux-based BBS packages are available for people that want
    to run a bulletin board system. Some of these packages can be found at sunsite.unc.edu
    in /pub/Linux/system/Network.


    Apart from terminal programs, there is also software that uses a serial noninteractively
    to transport data to or from your computer. The advantage of this technique is
    that it takes much less time to download a few kilobytes automatically than it
    might take you to read your mail online. On the other hand, this requires more
    disk storage because of the loads of useless information you usually get.


    The epitome of this sort of communications software is UUCP. It is a program suite
    that copies files from one host to another, executes programs on a remote host,
    and so on. It is frequently used to transport mail or news in private networks.
    Ian Taylor''s UUCP package, which also runs under Linux, is described in the following
    chapter. Other noninteractive communication software is, for example, used through
    Fidonet. Ports of Fidonet applications like ifmail are also available.


    SLIP, the Serial Line Protocol, is something in between, allowing both interactive
    and noninteractive use. Many use SLIP to dial up their campus network or some
    other sort of public SLIP server to run FTP sessions and so on. SLIP may, however,
    also be used over permanent or permanent connections for LAN-to-LAN coupling,
    although this is really interesting with ISDN.


    # Introduction To Serial Devices


    The devices a kernel provides for accessing serial devices are typically called
    ttys. This is an abbreviation for teletype, which used to be one of the major
    manufacturers of terminals in the early days of Unix. The term is used nowadays
    for any character-based data terminal. Throughout this chapter, we will use the
    term exclusively to refer to kernel devices.


    Linux distinguishes three classes of tty: (virtual) consoles, pseudo-terminals
    (similar to a two-way pipe, used by application as X11), and serial devices. The
    latter are also counted as tttys because they perform interactive sessions over
    a serial connection, be it from a hardwired terminal or a remote computer over
    a telephone line.


    Try have a number of configurable parameters which can be set using the ioctl(2)
    system call. Many of them apply only to serial devices, since need a great deal
    more flexibility to handle varying types of connections.


    Among the most prominent line parameters are line speed and parity. But there
    are also flags for the conversion between upper- and lower-case characters, carriage
    return into line feed, and so forth. The tty driver may also support various line
    disciplines, which make the device driver behave completely different. For example,
    the SLIP driver is implemented by means of a special line discipline.'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'There is a bit of ambiguity about how to measure a line''s speed. The correct
    term is bit rate, which is related to the line''s transfer speed measured in bits
    per second (or bps for short). Sometimes, you hear people refer to it the baud
    rate, which is not quite correct. These two terms are, however, interchangeable.
    The baud rate refers to a physical characteristic of some serial device, namely
    the clock rate at which pulses are transmitted. The bit rate, rather, denotes
    a current state of an existing serial connection between two points, the average
    number of bits transferred per second. It is important to know that these two
    values are usually different, as most devices encode more than one bit per electrical
    pulse.


    # Accessing Serial Devices


    Like all devices in a system, serial ports are accessed through device special
    files, located in the /dev directory. There are two varieties of device files
    related to serial drivers, and for each port, there is one device file from each.
    Depending on the file it is accessed, the device will behave differently.


    The first variant is used when the port is used for dialing; it has a major number
    of 4, and the files are named tty0,tty1, and so on. The second variant is used
    when dialing out through a port; the files are called cua0, cua1, and so, and
    have a major number of 5. (Linux devices have a "major" and "minor" numbers. When
    you do a long directory listing ("ls -l”), the numbers are listed. An example
    of this can be seen below in Listing 4.1. The "major" number is 5 and the "minor"
    numbers are 64–67.)


    Minor numbers are identical for both types. If you have modem on one of the ports
    COM1 COM4, its minor number will be the COM port number plus 63. If your setup
    is different from that, for example when using a board supporting multiple serial
    lines, please refer to the Serial Howto.


    Assume your modem is on COM2. Thus, its minor number will be 65, and its major
    number will be 5 for dialing out. There should be a device cua1 which has these
    numbers. List the serial trys in the /dev directory. Columns 5 and 6 should show
    major and minor numbers, respectively, as shown in Listing 4.1.


    # Listing 4.1 Major and minor numbers in device cua1.


    | crw-rw-rw- | 1 | root | 5 | 64 Nov 30 19:31 | /dev/cua0 |

    | crw-rw-rw- | 1 | root | 5 | 65 Nov 30 22:08 | /dev/cua1 |

    | crw-rw-rw- | 1 | root | 5 | 66 Oct 28 11:56 | /dev/cua2 |

    | crw-rw-rw- | 1 | root | 5 | 67 Mar 19 1992 | /dev/cua3 |


    If there is no such device, you will have to create one: become super-user and


    ```

    # mknod -m 666 /dev/cua 5 65

    # chown root.root /dev/cua1

    ```'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# The Linux Network Administrators'' Guide: Chapter 4


    Some people suggest /dev/modem a symbolic link to your modem device, so that casual
    users don''t have to remember the somewhat unintuitive cui. However, you cannot
    use modem in one program, and the real device file name in another. This is because
    programs use so-called lock files to signal the device. By convention, the lock
    file name for cui, for instance, is Lck.cua. Using different file names for the
    same port means that programs will fail to recognize each other''s lock files
    and will both use the device at the same time. As a result, both applications
    will not work at all.


    # Serial Hardware


    Linux currently supports a wide variety of serial boards which use the RS-232
    standard. RS-232 is currently the most common standard for serial communications
    in the PC world. It uses a number of circuits for transmitting single bits as
    well as for synchronization. Additional lines may be used for signaling the presence
    of a carrier (used by modems) and handshake.


    Although hardware handshake is optional, it is very useful. It allows either of
    the two stations to signal whether it is ready to receive more data, or if the
    other station should pause the receiver until the receiver is processing the incoming
    data. The lines used for this are called "Clear to Send" (CTS) and "Ready to Send"
    (RTS), respectively, which accounts for the colloquial name of hardware handshake,
    namely RTS/CTS.


    In PCs, the RS-232 interface is usually driven by a UART chip derived from the
    National Semiconductor 16450 chip, or a newer version thereafter, the 16550A.
    (There was also a NSC 16550, but its FIFO never really worked.) Some brands (notably
    internal devices equipped with the Rockwell chipset) also use completely different
    chips that have been programmed to behave as they were 16550s.


    The main difference between 16450s and 16550s is that the latter has a FIFO buffer
    of 16 bytes, while the former only has a 1-byte buffer. This makes 16450s suitable
    for speeds up to 9600 baud, while higher speeds require a 16550-compatible chip.
    Linux also supports the 8250 chip, which was the original UART for the PC-AT.


    In the default configuration, the kernel checks the four serial ports COM1 through
    COM4. These will be assigned device minor numbers 64 through 67, as described
    above.


    If you want to configure your serial ports properly, you should install Ted Tso''s
    setserial command with the rc.serial script. This script should be invoked from
    /etc/rc at system boot. It uses setserial to configure the kernel serial devices.
    A typical serial looks like this:


    ```

    # /etc/rc.serial - serial line configuration script.

    # Do will interrupt detection

    # /sbin/setserial -W /dev/cua*

    ```'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Setting Up The Serial Hardware


    ```

    # Configure serial devices

    /sbin/setserial /dev/cua0 auto irq skip test autoconfig

    /sbin/setserial /dev/cua1 auto irq skip test autoconfig

    /sbin/setserial /dev/cua2 auto irq skip test autoconfig

    /sbin/setserial /dev/cua3 auto irq skip test autoconfig

    ```


    ```

    # Display serial device configuration

    /sbin/setserial -bg /dev/cua*

    ```


    Please refer to the documentation that comes along with setserial for an explanation
    of the parameters.


    If your serial card is not detected, the setserial -bg command shows an incorrect
    setting, you will have to force the configuration by explicitly supplying the
    correct values. Users with internal modems equipped with the Rockwell chipset
    are reported to experience this problem. If, for example, the UART chip is reported
    to be an NSC 16450, although in fact it is NSC 16550-compatible, means you have
    to change the configuration command for the ending port


    ```

    /sbin/setserial /dev/cua4 auto irq skip test autoconfig

    uart 16550

    ```


    Similar options exist to force COM port, base address, and IRQ setting. Please
    refer to the setserial(8) manual page.


    If your modem supports hardware handshake, you should make sure to enable it.
    Surprising as it is, most communication programs do not attempt to enable this
    by default; you have to set it manually instead. This is best performed in the
    rc.serial script, using the stty command:


    ```

    $ stty crtscts < /dev/cua1

    ```


    To check if hardware handshake is in effect, use


    ```

    $ stty -a /dev/cua2

    ```


    This gives you the status of all flags for that device; a flag shown with a preceding
    minus, as in -crtscts, means that the flag has been turned off.'
  merge: -1
  img_proc: true
