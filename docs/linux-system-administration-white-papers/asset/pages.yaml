- pgno: 166
  md: '# Table 10.2 Some flags and their values.


    | Flag | Value |

    |---|---|

    | nsecure | Permit nonauthenticated access from this machine.

    Require UNIX-domain RPC authentication from this machine. This simply requires
    that requests originate from a reserved internet port (i.e., the port number to
    be less than 1024). This option is by default. |

    | secure-rpc | Require RPC authentication from this machine. This has not been
    implemented yet. See Sun''s documentation on Secure RPC. |

    | kerberos | Require Kerberos authentication on accesses from this machine. This
    has not been implemented yet. See the MIT documentation on the Kerberos authentication
    system. |

    | root squash | This is a security feature that denies the super-user on the specified
    hosts any special access rights by mapping requests from uid 0 to the client on
    uid 65534 (-2) on the server. This uid should be associated with the user nobody.
    |

    | no root squash | Don''t map requests from uid 0. This option is by default.
    |

    | rw | Mount file hierarchy read-only. |

    link relative | Convert absolute symbolic links (where the link contents start
    with a slash) into relative links by prepending the number of /s to the directory
    containing the link to the root on the server. This option only makes sense when
    a host''s entire file system is mounted, some of the links might point to nowhere,
    or even worse, files they were meant to point to. This option is by default. |

    link absolute | Leave all symbolic links as they are (the normal behavior for
    Sun-supplied NFS servers). map daemon This option tells the NFS server to assume
    that client and server do not share the same uid/gid space. nfsfd will then build
    a list mapping IDs between client and server by querying the client''s uuid daemon.|


    An error parsing the exports file is reported to syslogd daemon facility at level
    notice whenever nfs or mountd is started.


    Note that hostnames are obtained from the client''s IP address by reverse mapping,
    so you have to have the resolver configured properly. If you use BIND and are
    very security-conscious, you should enable spoof checking in your host.conf file.


    # The Automounter


    Sometimes, it is wasteful to mount all NFS volumes users might possibly want to
    access either because of the sheer number of volumes to be mounted, or because
    of the time this would take at startup. A viable alternative to this is a so-called
    automounter. This is a daemon that automatically and transparently mounts any
    NFS volume as needed, and unmounts them after they have not been used for some
    time. One of the clever things about an automounter is that it is able to mount
    a certain volume from alternative places. For'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'instance, you may keep copies of your X-programs and support files on two or
    three hosts, and have all other hosts mount them via NFS. Using an automounter,
    you may specify all three of them to be mounted on /usr/X386; the automounter
    will then try to mount any of these until one of the mount attempts succeeds.


    The automounter commonly used with Linux is called amd. It was originally written
    by Jan-Simon Pendry and has been ported by Rick Sladkey. The current version is
    amd-5.3.


    Explaining amd is beyond the scope of this chapter; for a good manual please refer
    to the sources; they contain a texinfo file with very detailed information.'
