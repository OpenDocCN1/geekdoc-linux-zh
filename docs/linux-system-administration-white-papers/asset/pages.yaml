  md: '# LINUX

    System Administration


    # White Papers


    # Get to the Heart of Linux Administration


    Linux System Administration White Papers is a collection of works by leaders in
    the Linux community—a printed version of the Linux Documentation Project. This
    book presents the theoretical concepts, as well as the architecture, and the Linux
    kernel. The in-depth discussions go to the heart of the support and administration
    tasks of all major Linux subsystems. Topics covered include file systems, directories,
    boots and shutdowns, printing, network compatibility, network applications, network
    security, user accounts, data backups, and more. Discussions on TCP/IP networking,
    electronic media, hardware issues, and network management and configuration are
    also provided.


    This book is written for:


    System and network administrators


    This book will help you understand:


    +   * TCP/IP networking

    * SLIP and PPP

    * inert server and login firstly

    * NFS and NIS configuration

    * UUCP

    * Electronic mail

    * NTTP

    * Newsreader configuration

    * Directory tree

    * Storage media

    * Point-to-point protocol


    # CORIOLISOPEN PRESS


    # Return To The Source™


    Open Source denotes a dazzling new class of software that includes all source
    code—and it''s completely free! CoriolisOpen Press books help you understand products
    like Linux, Apache, Perl, and more.


    # Coriolis White Papers Books Are Written For:


    +   * System and network administrators

    * Programmers and software engineers


    # How Do White Papers Books Help You?


    Free documentation for many Open Source products is online—but you can''t read
    the online manuals while you''re debugging your machine! These well-organized
    and indexed paper editions can be read when you''re offline or away from your
    computer.


    # Look For The CoriolisOpen Press Family:


    +   * The White Papers series provides Open Source documentation in a readable,
    well-indexed format.

    * The Commentary series gives you-indexed source code and annotations for major
    products.

    * Black Books provide immediate solutions to global programming and administrative
    challenges.

    * Little Black Books provide command and syntax summaries and quick explanations
    of Open Source software.


    # RETURN TO THE SOURCE™


    To invest in and show our support for the Open Source, we at The Coriolis Group
    have launched our Return to the Source™ program. Through this program, we will
    return 5% of the net proceeds of the sale of CoriolisOpen™ White Papers books
    to the Open Source community.


    ![](img/8036a81002f24881cae710bb74d93a7c_403_0.png)


    User Level: Intermediate'
