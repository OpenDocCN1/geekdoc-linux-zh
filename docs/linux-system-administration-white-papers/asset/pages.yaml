- pgno: 82
  md: 'If the output you get from ping does not resemble that above, you are in trouble.
    Check any error if they indicate some file hasn''t been installed. Check that
    the ifconfig and route binaries you use are compatible with the kernel release
    you run, and, above all, that the kernel has been compiled with networking enabled
    (you can see this from the presence of the /proc/net directory). If you get an
    error message saying "Network unreachable," then you probably have got the route
    command wrong. Make sure you use the same address as you gave to ifconfig.


    The steps described above are enough for using applications on a standalone host.
    After adding the lines to rc.inet and making both rc.net scripts are executed
    from /etc/rc, you may reboot your machine and try out various applications. For
    instance, "telnet localhost" should establish a telnet connection to your host,
    giving you a login prompt.


    However, the loopback interface is useful not only as an example in networking
    books, or as a test-bed during development, but is actually used by some applications
    during normal operation. For instance, all applications based on RPC use the loopback
    interface to register themselves with the portmapper daemon at startup. Therefore,
    you always have to configure it, regardless of whether your machine is attached
    to a network or not.


    # Ethernet Interfaces


    Configuring an Ethernet interface gets pretty much with the same as the loopback
    interface, it just requires a few more parameters when you are subnetting.


    At the Virtual Brewery, we have submitted the IP network, which was originally
    a class B network. To make the interface recognize this, the ifconfig incantation
    would look like this:


    ```

    # ifconfig eth0 vstout netmask 255.255.255.0

    ```


    This assigns the eth0 interface the IP address of vstout (191.72.1.2). If we had
    omitted the netmask, ifconfig would have deduced the netmask from the IP network
    class, which would have resulted in a mask of 255.255.255.0. Now a quick check
    shows:


    ```

    # ifconfig eth0

    eth0 Link encap 10Mbps Ethernet HWaddr 00:00:90:B3:42

    inet 191.72.1.2 Bcast 191.72.1.25 Mask 255.255.255.0

    UPCAST RUNNING MTU 1500 Metric 1

    RX packets 0 errors 0 dropped 0 overrun 0

    TX packets 0 errors 0 dropped 0 overrun 0

    ```


    You can see that ifconfig automatically set the broadcast address (the Bcast field)
    to the usual value, which is the hosts network number with the host bits all set.
    Also, the message transfer unit (the maximum size of Ethernet frames the kernel
    will generate for'
