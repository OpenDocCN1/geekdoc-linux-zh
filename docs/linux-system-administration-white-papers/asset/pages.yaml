- pgno: 18
  md: '# Foreword


    By Eric Raymond


    long-established folklore in the computing industry has it that true programmers
    hate writing documentation. Not true, as it turns out—many programmers will cheerfully
    write documentation for the programs that they truly care about. No better illustration
    of this could be found than in the book you are about to read.


    Linux is a labor of love for the people who develop it. Its astonishing success,
    taking it from zero visibility to a major contender in three years, demonstrates
    that love can be more powerful than gold for motivating high-quality creative
    work. But it takes gold to print books and press CDs, so the Linux world is evolving
    ways to cooperate with the market and build flourishing distribution industries
    around their OS. This book is also an illustration of that trend.


    The Coriolis Group is exploring ways in which to cooperate with the Linux Documentation
    Project that will help Linux developers specialize in what they do best (coding
    and technical-reference documentation), while Coriolis supplies what it does best
    (editing, production, and marketing). The result should be nice profits for Coriolis
    and a better quality of online documentation for the Linux community. All LDP
    documentation will continue to be distributed under open-content licenses supporting
    free redistribution, and Coriolis''s improvements will be donated back to the
    community.


    This first volume is aimed at Linux system administrators.'
  merge: -1
  img_proc: true
