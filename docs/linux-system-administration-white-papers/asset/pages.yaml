  md: '# 222 The Linux Administrators’ Guide: Chapter 5


    The exact texts are different on different systems, depending on the hardware,
    the version of Linux being used, and how it has been configured.


    +   - Then the kernel will try to mount the root filesystem. The place is configurable
    at compilation time, or any time with or LILO. The filesystem type is detected
    automatically. If the mounting of the root filesystem fails, for example because
    you didn''t remember to include the corresponding filesystem driver in the kernel,
    the kernel panics and halts the system (isn''t much it can do, anyway).


    +   - The root filesystem is usually read-only (this can be set in the same way
    as the place). This is usually possible to check the filesystem while it is mounted;
    it is not a good idea to check a filesystem that is mounted read-write.


    +   - After this, the kernel starts the program init (located in /sbin/init) in
    the background (this will always become process number 1). init does various startup
    chores. The exact things depends on how it is configured; see Chapter 6 for more
    information. It will at start some essential background daemons.


    +   - After this, it switches to multiuser mode, and starts a getty for virtual
    consoles and serial terminals. getty may also start some other programs, depending
    on how it is configured.


    +   - After this, the boot is complete, and the system is up and running normally.


    # More About Shutdowns


    It is important to follow the correct procedures when you shut down a Linux system.
    If you fail to do so, your files probably become trashed and the files probably
    become scrambled. This is because Linux has a disk cache that won''t write things
    to disk at once, but only at intervals. This greatly improves performance, but
    also means that if you just turn off the power at a whim the cache may hold a
    lot of data and what is on the disk may not be a fully working filesystem (because
    only some things have been written to the disk).


    Another reason against just flipping the power switch is that in a multitasking
    system there can be lots of things going on in the background, and shutting the
    power can be quite disastrous. By using the proper shutdown sequence, you ensure
    that all background processes can save their data.


    The command for properly shutting down a Linux system is shutdown. It is usually
    used in one of two ways.


    If you are running a system where you are the only user, the usual way of using
    shutdown is to log out all virtual consoles, log as root as one of them (or logged
    in as root if you already are, but you should change to root''s home directory
    or the root directory, to avoid problems with unmounting), then give the command
    shutdown -h now (substitute now with a plus sign and a number) in minutes if you
    want a delay, though you usually don''t on a single user system).'
