- pgno: 299
  md: '# /etc/magic


    The configuration file for file. Contains the descriptions of various file formats
    based on which file guesses the type of the file. See the magic and file manual
    pages for more information.


    # /etc/motd


    The message of the day, automatically output after a successful login. Contents
    are up to the system administrator. Often used for getting information to every
    user, such as warnings about planned downtimes.


    # /etc/mtab


    List of currently mounted filesystems. Initially set up by the boot scripts, and
    automatically by the mount command. Used when a list of mounted filesystems is
    needed, e.g., by the df command.


    # /etc/shadow


    Shadow password file on systems with shadow password installed. Shadow pass-words
    move the encrypted password from /etc/passwd /etc/shadow; the latter is not readable
    by anyone except root. This makes it harder to crack passwords.


    # /etc/login.defs


    Configuration file for the login command.


    # /etc/printcap


    Like /etc/termcap, but intended for printers. Different syntax.


    # /etc/profile, /etc/csh.login, /etc/csh.crc


    Files executed at login or startup time by the Bourne or C shells. These allow
    the system administrator to set global defaults for all users. See the manual
    pages for the respective shells.


    # /etc/securetty


    Identifies secure terminals, i.e., the terminals from which root is allowed to
    log in. Typically only the virtual consoles are listed, so that it becomes impossible
    (or at least harder) to gain superuser privileges by breaking into a system over
    a modem or a network.


    # /etc/shells


    Lists trusted shells. The csh command allows users to change their login shell
    only to shells listed in this file: ftpd, the server process that provides FTP
    services for a machine, will check that the user''s shell is listed in /etc/shells
    and will not let people log in unless the shell is listed there.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Overview Of The Directory tree 277


    # /etc/termcap


    The terminal capability database. Describes by what "escape sequences" various
    terminals can be controlled. Programs are written so that instead of directly
    outputting an escape sequence that only works on a particular brand of terminal,
    they look up the correct sequence to whatever it they want to do in /etc/termcap.
    As a result, programs work with most kinds of terminals. See the termcap, curs_termcap,
    and terminfo manual pages for more information.


    # /dev Directory


    The /dev directory contains the special device files for all the devices. The
    device files are named using special conventions; these are described in the Device
    list. The device files are created during installation, and later with the /dev/MAKEDEV
    script. The /dev/MAKEDEV.local is a script written by the system administrator
    that creates local-only device files or links (i.e. those that are not part of
    the standard MAKEDEV, such as device files for some nonstandard driver).


    # /usr Filesystem


    The /usr filesystem is often large, since all programs are installed there. All
    files in /usr usually come from a Linux distribution; locally installed programs
    and other stuff below /usr/local. This makes it possible to update the system
    from a new version of the distribution, or even a completely new distribution,
    without having to install all programs again. Some of the subdirectories of /usr
    are listed below (some of the less important directories have been dropped;; see
    the FSSTND for more information).


    # /usr/X11R6


    The X Window System, all files. To simplify the development and installation of
    X, the X files have not been integrated into the rest of the system. There is
    a directory tree below /usr/X11R6 similar to that below /usr itself.


    # /usr/X386


    Similar to /usr/X11R6, but for X11 release 5.


    # /usr/bin


    Almost all user commands. Commands are in /bin or in /usr/local/bin.


    # /usr/sbin


    System administration commands that are not needed on the root filesystem, e.g.,
    most server programs.'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# /usr/man, /usr/info, /usr/doc


    Manual pages, GNU Info documents, and miscellaneous other documentation files,
    respectively.


    # /usr/include


    Header files for the C programming language. This should actually be below /usr/lib
    for consistency, but the tradition is overwhelmingly in support for this name.


    # /usr/lib


    Unchanging data files for programs and subsystems, including some sitewide files.
    The name lib comes from library; originally libraries of programming subroutines
    stored in /usr/lib.


    # /usr/local


    The place for locally installed software and other files.


    # # /var Filesystem


    The /var contains data that is changed when the system is running normally. It
    is specific to each system, i.e., not shared over the network with other computers.


    # /var/catman


    A cache for man pages that are formatted on demand. The source for manual pages
    is usually stored in /usr/man/man*; some manual pages might come with a preformatted
    version, which is stored in /usr/man/man/cat*. Other manual pages need to be formatted
    when they are first viewed; the formatted version is then stored in /var/man so
    that the next person to view the page won''t have to wait for it to be formatted.
    /var/catman is often cleaned in the same way temporary directories are cleaned.


    # /var/lib


    Files that change while the system is running system.


    # /var/local


    Variable data for programs that are installed in /usr/local (i.e., programs that
    have been installed by the system administrator). Note that even locally installed
    programs should use the other /var directories if they are appropriate, e.g.,
    /var/lock.'
  merge: -1
  img_proc: true
- pgno: 302
  md: "# /var/lock\n\nLock files. Many programs follow a convention to create a lock\
    \ file in /var/lock to indicate that they are using a particular device or file.\
    \ Other programs will notice the lock file and won't attempt to use the device\
    \ or file.\n\n# /var/log\n\nLog files from various programs, especially login\
    \ (/var/log/wtmp), which logs all logins and timeouts into the system and syslog\
    \ (/var/log/messages, where all kernel and system program message are usually\
    \ stored). Files in /var/log can grow indefinitely and may require cleaning at\
    \ regular intervals.\n\n# /var/run\n\nFiles that contain information about the\
    \ system that is valid until the system is next booted. For example, /var/run/utmp\
    \ contains information about people currently logged in.\n\n# /var/spool\n\nDirectories\
    \ for mail, news, printer queues, and other queued work. Each different spool\
    \ has its own subdirectory below /var/spool, e.g., the mailboxes of the users\
    \ are in /var/spool/mail.\n\n# /var/tmp\n\nTemporary files that are large or need\
    \ to exist for a longer time than what is allowed for /tmp. (Although the system\
    \ administrator might not allow very old files in /var/tmp either).\n\n# The /proc\
    \ Filesystem\n\n /proc filesystem contains an illusory filesystem. It does not\
    \ exist on a disk. Instead, the kernel creates it in memory. It is used to provide\
    \ information about the system (originally about processes, hence the name). Some\
    \ of the more important files and directories are explained below. The /proc filesystem\
    \ is described in more detail in the proc manual page.\n\n# /proc/1\n\nA directory\
    \ with information about process number 1. Each process has a directory /proc\
    \ with the name being its process identification number.\n\n# /proc/cpuinfo\n\n\
    Information about the processor, such as its type, make, model, and performance."
  merge: -1
  img_proc: true
- pgno: 303
  md: '# /proc/devices


    List of device drivers configured into the currently running kernel.


    # /proc/dma


    Shows which DMA channels are being used at the moment.


    # /proc/filesystems


    Filesystems configured into the kernel.


    # /proc/interrupts


    Shows which interrupts are in use and how many of each there have been.


    # /proc/ioports


    Which I/O ports are in use at the moment.


    # /proc/kcore


    An image of the physical memory of the system. This is exactly the same size as
    your physical memory, but does not really take up that much memory; it is generated
    on the fly programs access it. (Remember: unless you copy it elsewhere, nothing
    /proc takes up any disk space at all.)


    # /proc/kmsg


    Messages output by the kernel. These are also routed to syslog.


    # /proc/ksysym


    Symbol table for the kernel.


    # /proc/loadavg


    The "load average" of the system; three meaningless indicators of how much work
    the system has to do at the moment.


    # /proc/meminfo


    Information about memory usage, both physical and swap.


    # /proc/modules


    Which kernel modules are loaded at the moment.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# /proc/net


    Status information about network protocols.


    # /proc/self


    A symbolic link to the process directory of the program that is looking at /proc.
    When two processes look at /proc, they get different links. This is mainly a convenience
    to make it easier for programs to get at their process directory.


    # /proc/stat


    Various statistics about the system, such as the number of page faults since the
    system was booted.


    # /proc/uptime


    The time the system has been up.


    # /proc/version


    The kernel version.


    Note that while the above files tend to be easily readable text files, they can
    sometimes be formatted in a way that is not easily digestible. There are many
    commands that do little more than read the above files and format them for easier
    understanding. For example, the free program reads /proc/meminfo and converts
    the amounts given in bytes to kilobytes (and adds a little more information, as
    well).'
  merge: -1
