- pgno: 110
  md: '# Chapter 6

    Serial Line IP


    The serial line protocols, SLIP and PPP, provide the Internet connectivity for
    the poor. Apart from a modem and a serial board equipped with a FIFO buffer, no
    hardware is needed. Using it is not much more complicated than a mailbox, and
    an increasing number of private organizations offer dial-up IP at an affordable
    cost to everyone.


    There are both SLIP and PPP drivers available. SLIP has been there for a while
    and works fairly reliably. A PPP driver has been developed recently by Michael
    Callahan and Al Longyear. It will be described in the next chapter.


    # General Requirements


    To use SLIP or PPP, you have to configure some basic networking features as described
    in the previous chapters. At the least, you have to set up the loopback interface
    and provide for name resolution. When connecting to the Internet, you will course
    want to use DNS. The simplest option is to put the address of some name server
    into your resolv.conf file; this server will be queried as soon as the SLIP link
    is activated. The closer this name server is to the point where you dial in, the
    better.


    However, this solution is not optimal, because all name lookups will still go
    through your SLIP/PPP link. If you worry about the bandwidth this consumes, you
    can also set up a caching-only name server. It doesn''t really serve a domain,
    but only acts as a relay for all DNS queries produced on your host. The advantage
    of this scheme is that it builds up a cache, so that most queries'
  merge: -1
  img_proc: true
- pgno: 111
  md: "have to be sent over the serial line only once. A named.boot file for caching-only\
    \ server\nlooks like this:\n\n+   - named.boot file for caching-only server\n\
    \  directory: /var/named\n\n| primary | 0.0.127.in-addr.arpa | db.127.0.0 | loopback\
    \ net |\n| cache | db.cache | root servers |\n\nIn addition to this named.boot.file,\
    \ you also have to set up the db.cache file with a valid list\nof root name servers.\n\
    \n# SLIP Operation\n\nDial-up IP servers frequently offer SLIP service through\
    \ special user accounts. After logging\ninto an account, you are not dropped into\
    \ the common shell; instead, a program or\nshell script is executed that enables\
    \ the server's SLIP driver for the serial line and configures\nthe appropriate\
    \ network interface. Then you have to do the same at your end of the link.\n\n\
    On some operating systems, the SLIP driver is a user-space program; under Linux,\
    \ it is part\nof the kernel, which makes it a lot faster. This requires, however,\
    \ the serial line is\nconverted to SLIP mode explicitly. This is done by means\
    \ of a special try line discipline,\nSLDISPC. While the try is in normal line\
    \ discipline (DISCO), it will exchange data only\nwith user processes, using the\
    \ normal read(2) and write(2) calls, and the SLIP driver is\nunable to write to\
    \ or read from the try. In SLDISPC, the roles are reversed: Now user-\nspaces\
    \ are blocked from writing to or reading from the try, while all data coming in\n\
    the serial port will be passed directly to the SLIP driver.\n\nThe SLIP driver\
    \ itself understands a number of variations on the SLIP protocol. Apart from\n\
    of SLIP, it also understands Jacobson which performs the so-called Jacobson header\n\
    compression on outgoing IP packets. (Van Jacobson header compression is described\
    \ in\nRFC-1441.) This improves throughput for interactive sessions noticeably.\
    \ Additionally, there\nare six-bit versions for each of these protocols.\n\nA\
    \ simple way to convert a serial line to SLIP mode is by using the slattouch.\
    \ Assume you\nhave your modem on /dev/cua3, and have logged into the SLIP server\
    \ successfully. You will\nthen execute:\n\n```\n# slattouch /dev/cua3 &\n```\n\
    \nThis will switch the line discipline of cua3 to SLIPDISC, and attach it to one\
    \ of the SLIP\nnetwork interfaces. If this is your first active SLIP link, the\
    \ line will be attached to s0; the\nsecond would be attached to s1, and so on.\
    \ The current kernels support up to eight simul-\ntaneous SLIP links."
