- pgno: 92
  md: '# Configuring TCP/IP Networking 69


    This shows most servers simply waiting for an incoming connection. However, the
    fourth line shows an incoming SMTP connection from vstout, the sixth line tells
    you there is an outgoing telnet connection to vbardolino. Using the -a flag all
    by itself will display all sockets from all families.


    > Note You can tell whether a connection is outgoing or not from the port numbers
    involved. The port number shown for the calling host will always be a simple integer,
    while on the host being called, a well-known service port will be in use, for
    which netstat the symbolic name found in /etc/services.


    # Checking The ARP Tables


    On some occasions, it is useful to view or even alter the contents of the kernel''s
    ARP tables, for example when you suspect a duplicate Internet address is the cause
    for some intermittent network problem. The ARP tool was made for these things
    like. Command line options are:


    ```

    arp [-v] [-t hwtype] -a hostname

    arp [-v] [-t hwtype] -s hostname hwaddr

    arp [-v] -d hostname [hostname...]

    ```


    All hostname arguments may be either symbolic hostname or IP addresses in dotted
    quad notation.


    The first invocation displays the ARP entry for the IP address or host specified,
    or all hosts if no hostname is given. For example, invoking arp v vlager may yield


    ```

    # arp -a

    IP address HW type HW address

    191.72.1.3 10Mbps Ethernet 00:00:C5A:42:C1

    191.72.1.2 10Mbps Ethernet 00:00:C90:B3:42

    191.72.2.4 10Mbps Ethernet 00:00:C90:69:AA94

    ```


    Using the -t option can limit the display to the hardware type specified. This
    may be either, ax25, or portent, standing for 10Mbps Ethernet, AMPR-AX.25, and
    IEEE-802.5 to ring equipment, respectively.


    The -s option is used to permanently add hostname''s Ethernet address to the ARP
    tables. The hwaddr argument specifies the hardware address, which is by default
    expected to be an Ethernet address, specified as six hexadecimal bytes separated
    by colons. You may also set the hardware address for other types of hardware,
    too, using the -t option.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# The Linux Network Administrators'' Guide: Chapter 5


    One problem which may require you to manually add an IP address to the ARP table
    for some reasons ARP queries for the remote host fail, for instance its ARP driver
    is buggy or there is another host in the network that erroneously identifies itself
    with that host''s IP address. Hard-wiring IP addresses in the ARP table is also
    a (very drastic) measure to protect yourself from your Ethernet as from someone
    else.


    Invoking the -d switch deletes all ARP entries relating to the given host. This
    may be used to force the interface to re-attempt to obtain the Ethernet address
    for the ARP address in question. This is useful when a misconfigured system has
    broadcast wrong information (of course, you have to reconfigure the broken host).


    The -s option may also be used to implement proxy ARP. This is a special technique
    where a host, say, gate acts as a gateway to another host named fnord, by pretending
    that both addresses refer to the same host, gate. It does so by publishing an
    ARP entry for fnord that points to its Ethernet interface. Now when a host sends
    out an ARP query for fnord, gate will return a reply containing its Ethernet address.
    The querying host will then send all datagrams to gate, which dutifully forwards
    them to fnord.


    These contortions may be necessary, for instance, when you want to access fnord
    from a DOS machine with a broken TCP implementation that doesn''t understand routing
    too well. When you use proxy ARP, it will appear as if fnord was on the local
    subnet, it doesn''t have to know how to route through a gateway.


    Another useful application of proxy ARP is when one of your hosts acts as a gateway
    to some other host only temporarily, for instance through a dual-up link. In a
    previous example, we already encountered the laptop vlite, which was connected
    to vlager through a PLIP link from time to time. Of course, this will only work
    if the address of the host you want to provide proxy ARP for is on the same subnet
    as your gateway. For instance, vst could proxy ARP for any host on the Brewery
    subnet (191.72.1.0), but never for a host on the Winery subnet (191.72.2.0).


    The proper invocation to provide proxy ARP for fnord is given below; of course,
    the Ethernet address given must be that of.


    ```

    # arp -s fnord 00:00:c4:a12:e0 pub

    ```


    The proxy ARP entry may be removed by invoking:


    ```

    # arp -d fnord

    ```


    # The Future


    Networking is still evolving. Major changes at the kernel layer will bring a very
    flexible configuration scheme that will allow you to configure the network devices
    at run-time. For instance, the ifconfig command will take arguments that set the
    IRQ line and DMA channel.'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'Another change to come soon is the additional mtu flag to the route command,
    which will set the Maximum Transmission Unit for a particular route. This route-specific
    MTU overrides the MTU specified for the interface. You will typically use this
    option for routes through a gateway, where the link between the gateway and the
    destination host requires a very low MTU. For instance, assume host wanderer is
    connected to vlager through a SLIP link. When sending data from vvout to wanderer,
    the networking layer on wanderer would use packets up to 1,500 bytes, because
    packets are sent across the Ethernet. The SLIP link, on the other hand, is operated
    with an MTU of 296, so the network layer on vlager would have to break up the
    IP into smaller fragments to fit into 296 bytes. If instead, you would have configured
    the route on vvout to use an MTU of 296 right from the start, this expensive fragmentation
    could be avoided:


    ```

    # route add wanderer gw vlager mtu 296

    ```


    Note that the mtu option also allows you to selectively undo the effects of the
    "Subnets Are Local" Policy (SNARL). This policy is a kernel configuration option
    and is described in Chapter 3.


    # Name Service And Resolver Configuraton


    As discussed in Chapter 2, TCP/IP networking may rely on different schemes to
    convert names into addresses. The simplest way, which takes no advantage of the
    name space has been split up into zones, is a host table stored in /etc/hosts.
    This is useful only for small LANs that are run by single administrator and otherwise
    have no IP traffic across the outside world. The format of the hosts file has
    already been described in Chapter 3.


    Alternatively, you may use BIND—the Berkeley Internet Name Domain Service—for
    resolving hostnames to IP addresses. Configuring BIND may be a real chore, but
    once you''ve done it, changes in the network topology are easily made. On many
    other Linux systems, name service is provided through a program called named.
    At startup, it loads a set of master files into its cache and waits for queries
    from remote or local user processes. There are different ways to set up BIND,
    and not all require you to run a name server on every host.


    This chapter can do little but give a rough sketch of how to operate a name server.
    If you plan to use BIND in an environment with more than just a small LAN and
    probably an Internet uplink, you should get a good book on BIND. One good book
    is Crikt''s DNS and BIND (O''Reilly), which is now in its third edition and can
    be found at www.oreilly.com/catalog/dns3/. For current information, you may also
    want to check the release notes contained in the BIND sources. There are also
    two newsgroups for DNS questions you can refer to: comp.protocols.dns and comp.protocols.bind.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# The Resolver Library


    When talking of "the resolver", we do not mean any special application, but rather
    refer to the resolver library, a collection of functions that can be found in
    the standard C library. The central routines are gethostname(2) and gethostbyaddr(2),
    which look up all IP addresses to a host and vice versa. They may be configured
    to simply look up the information in hosts, query a number of name servers, or
    use the hosts database of NIS (Network Information Service). Other applications,
    like small, may include different drivers for this and need care.


    # The host.conf File


    The central file that controls your resolver setup is host.conf. It resides in
    /etc and tells the resolver which services to use and in what order.


    Options in host.conf must occur on separate lines. Fields may be separated by
    white space (spaces or tabs). A hash sign (#) introduces a comment that extends
    to the next new line.


    The following options are available:


    +   order—This determines the order in which the resolving services are tried.
    Valid options are:

    * bind—for querying the name server

    * hosts—for lookups in /etc/hosts

    * nis—for NIS lookups


    Any or all of them may be specified. The order in which they appear on the line
    determines the order in which the respective services are tried.


    +   multi—Takes on or off as options. This determines if a host in /etc/hosts
    is allowed to have several IP addresses, which is usually referred to as being
    "multi-homed." This flag has no effect on DNS or NIS queries.


    +   nospof—As explained in the previous chapter, DNS allows you to find the hostname
    belonging to an IP address by using the inaddr domain. Attempts by name servers
    to supply a false hostname are called "spoofing." To guard against this, the resolver
    may be configured to check if the original IP address is in fact associated with
    the hostname obtained. If not, the name is rejected and an error returned. This
    behavior is turned on by setting nospof.


    +   alert—This option takes on or off as arguments. If it is turned on, any spoof
    attempts (see above) will cause the resolver to log a message to the syslog facility.


    +   trim—This option takes a domain name as an argument, which is useful for hosts
    entries, where you might only want to specify hostnames without local domain.
    A lookup of a host with the local domain name appended will have this removed,
    allowing the lookup in /etc/hosts to succeed. trim options accumulate, making
    it possible to consider your host as being local to several domains.'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'A sample file for vlager is shown below:


    ```

    # /etc/host.conf

    # We have named running, but no NIS (yet)

    order bind hosts

    # Allow multiple addrs

    multi on

    # Guard against spoof attempts

    nspoof on

    # Trim local domain (not really necessary)

    trim vbrew.com.

    ```


    # Resolver Environment Variables


    The settings from host.conf may be overridden using a number of environment variables.
    These are


    +   * RESOLV HOST CONF—This specifies a file to be read instead of /etc/host.conf.

    * RESOLV SERV ORDER—Overrides the order option in host.conf. Services are given
    as hosts, bind, and nis, separated by a space, comma, or semicolon.

    * RESOLV SPOOF CHECK—Determines the measures taken against spoofing. It is completely
    disabled by off. The values warn and allow enable spoof checking, but turn logging
    on and off respectively. A value of * turns on spoof checks, but leaves the logging
    facility as defined in host.conf.

    * RESOLV MULTI—A value on or off may be used to override the multi options tt
    host.conf.

    * RESOLV OVERRIDE TRIM DOMAINS—This environment specifies a list of trim domains
    which override those given in host.conf.

    * RESOLV ADD TRIM DOMAINS—This environment specifies a list of trim domains which
    are added to those in host.conf.


    # Configuring Name Server Lookups—resolver.conf


    When configuring the resolver library to use the BIND name server for lookups,
    you also have to tell it which name servers to use. There is a separate file for
    this, called resolver.conf. If this file does not exist or is empty, the resolver
    assumes the name server is your local host.


    If you run a name server on your local host, you have to set it up separately,
    as will be explained in the following section. If you are on a local network and
    have the opportunity to use an existing name server, this should always be preferred.


    The most important option in resolver.conf is nameserver, which gives the IP address
    of a name server to use. If you specify several servers by giving the nameserver
    option several times, they are tried in the order given. You should therefore
    put the most reliable server first. Currently, up to three name servers are supported.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '74 The Linux Network Administrators'' Guide: Chapter 5


    If no nameserver option is given, the resolver attempts to connect to the name
    server onto the local host.


    Two other options, domain and search, deal with defaults tacked onto a hostname
    that BIND resolves it with the first query. The search option specifies a list
    of domain names to be tried. The list items are separated by spaces or tabs.


    If no search option is given, a default search list is constructed from the local
    domain name using the domain name itself, plus all parent domains up to the root.
    The local domain name may be given using the domain statement; if none is given,
    the resolver obtains it through the getdomainname(2) system call.


    If this sounds confusing to you, consider this sample resolv.conf file for the
    Virtual Brewery:


    ```

    # /etc/resolv.conf

    # Our domain

    domain vbrew.com

    #n# We use vlager as central nameserver:

    nameserver 191.72.1.1

    ```


    When resolving the name vale, the resolver would look up vale, and failing this,
    vale.vbrew.com, and vale.com.


    # Resolver Robustness


    If you are running a LAN inside a larger network, you definitely should use central
    name servers if they are available. The advantage of this is that these will develop
    rich caches, since all queries are forwarded to them. This scheme, however, has
    a drawback: When a fire recently destroyed the backbone cable at our university,
    no work was possible on our department''s LAN, because the resolver couldn''t
    reach any of the name servers anymore. There was no logging in X-terminals, no
    printing, and so on.


    Although it is not very common for campus backbones to go down in flames, one
    might want to take precautions against cases like these.


    One option is to set up a local name server that resolves hostnames from your
    local domain and forwards all queries for other hostnames to the main servers.
    Of course, this is applicable if you are running your own domain.


    Alternatively, you can maintain a backup host table for your domain or LAN in
    /etc/hosts. In /etc/host.conf you would then include "order bind hosts" to make
    the resolver fall back to the hosts file if the central name server is down.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Running named


    The program that provides domain name service on most machines is usually called
    named (pronounced name-dee). This is a server program originally developed for
    BSD providing name service to clients, and possibly to other name servers. The
    version currently used on most installations seems to be BIND 8.2 (8.x is next
    major rev from 4.x series, current 4.x is 4.9.7)


    > Note

    BIND is maintained by the Internet Software Consortium www.isc.org, BIND can be
    found at www.isc.org/bind.html.


    This section requires some understanding of the way Domain Name System works.
    If the following discussion is all Greek to you, you may want to re-read Chapter
    2, which has some more information on the basics of DNS.


    named is usually started at system boot time, and runs until the machine goes
    down again. It takes its information from a configuration file /etc/named.boot
    and various files that contain data mapping domain names to addresses and the
    like. The latter are called zone files. The formats and semantics of these files
    will be explained in the following section.


    To run named, simply enter


    ```

    # /usr/sbin/named

    ```


    At the prompt. named will come up, read the named.boot file and any zone files
    specified therein. It writes its process ID to /var/run/named.pid in ASCII, downloads
    any zone files from primary servers if necessary, and starts listening on port
    53 for DNS queries.


    > Note

    There are various named binaries floating around FTP sites, each configured a
    little differently. Some have their pid file in /etc, some store it in /tmp or
    /var/tmp.


    # The named.boot File


    The named.boot file is generally very small and contains little but pointers to
    master files containing zone information and pointers to other name servers. Comments
    in the boot file start with a semicolon and extend to the new line. Before we
    discuss the format of named.boot in more detail, we will take a look at the sample
    file for vlager:


    ```

    :

    : /etc/named.boot file for vlager.vbrew.com

    ;

    ```'
  merge: -1
  img_proc: true
- pgno: 99
  md: "# 76 The Linux Network Administrators' Guide: Chapter 5\n\n```\ndirectory \
    \     /var/named\n:\n    domain          file\n    cache           named.ca\n\
    primary         vbrew.com       named.hosts\nprimary         0.0.127-in-addr.arpa\
    \ named.local\nprimary         72.191.in-addr.arpa named.rev\n```\n\nThe cache\
    \ and primary commands shown in this example load information into named. This\
    \ information is taken from the master files specified in the second argument.\
    \ They contain textual representations of DNS resource records, which we will\
    \ look at below.\n\nIn this example, we configured named as the primary server\
    \ for three domains, as indicated by the primary statements at the end of the\
    \ file. The first of these, instances named to act as a primary server for named,\
    \ taking the zone data from the file named.hosts. The directory keyword tells\
    \ it that all zone files are located in /var/named.\n\nThe cache entry is very\
    \ special and should be present on all machines running a name server. Its function\
    \ is twofold: it instructs named to enable its cache, and to load the root name\
    \ server hints from the cache file specified (named.ca in our example). We will\
    \ come back to the name server hints below.\n\nHere's a list of the most important\
    \ options you can use in named:\n\n+   **directory**—This specifies a directory\
    \ in zone files resides. Names of files may be given relative to this directory.\
    \ Several directories may be specified by repeatedly using directory. According\
    \ to the Linux filesystem standard, this should be /var/named.\n\n+   **primary**—This\
    \ takes a domain name and a file name as an argument, declaring the local server\
    \ authoritative for the named domain. As a primary server, named loads the zone\
    \ information from the master file. Generally, there will be at least one primary\
    \ entry in every boot file, for reverse mapping of network 127.0.0.0, which is\
    \ the local loopback network.\n\n+   **secondary**—This statement takes a domain\
    \ name, an address list, and a file name as an argument. It declares the local\
    \ secondary master server for the domain specified. A secondary server holds authoritative\
    \ data on the domain, too, but it doesn't gather it from files, but tries to download\
    \ it from the primary server. The IP address of at least one primary must be given\
    \ to the address list. The local server will contact each of them until it successfully\
    \ transfers the zone database, which is then stored in the backup file given as\
    \ the third argument. If none of the primary servers responds, the zone data is\
    \ retrieved from the backup file instead. named will then attempt to refresh the\
    \ zone data at regular intervals. This is explained below, in connection with\
    \ the SOA resource record type."
  merge: -1
