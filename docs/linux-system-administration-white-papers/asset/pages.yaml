  md: 'When you receive a message like this from your system, don''t believe it blindly.
    Depending on who sent the checkgroups message, it may lack a few groups or entire
    hierarchies; so you should be careful removing any groups. If you find groups
    are listed missing that you want to carry at your site, you have to add them using
    the addgroup script. Save the list of missing groups to a file and feed it to
    the following little script:


    # sendsys, version, And senduuname


    Finally, there are three messages that may be used to find out about the network''s
    topology. These are sendsys, version, and senduuname. They cause C-News to return
    to the sender sys file, a software version string, and the output of uname(1),
    respectively. C-News is very laconic over version messages; it returns a simple,
    unadorned "C".


    Again, you should never issue such a message, unless you have made sure that it
    cannot leave your (regional) network. Replies to sendsys messages can quickly
    bring down a UUCP network. (I wouldn''t try this on the Internet, either.)


    # C-News In An NFS Environment


    A simple way to distribute news within a local network is to keep all news on
    a central host, and export the relevant directories via NFS, so that readers may
    scan the articles directly. The advantage of this method over NNTP is that the
    overhead involved in retrieving and threading articles is significantly lower.
    NNTP, on the other hand, in a heterogeneous network where equipment varies widely
    among hosts, or where users don''t have equivalent accounts on the server machine.


    When using NFS, articles posted on a local host have to be forwarded to the central
    machine, because accessing administrative files may otherwise expose the system
    to race conditions that leave the files inconsistent. Also, you might want to
    protect your news spool area by exporting it read-only, which requires forwarding
    to the central machine, too.'
