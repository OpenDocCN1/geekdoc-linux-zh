- pgno: 112
  md: '# Serial Line IP 89


    The default encapsulation chosen by slattach is CSLIP. You may choose any other
    mode using the -p switch. To use normal SLIP (no compression), you would use


    ```

    # slattach -p slip /dev/cua3 &

    ```


    Other modes are cslip, slip6, c6 (for the six-bit version of SLIP), and adaptive
    for adaptive SLIP. The latter leaves it to the kernel to find out which type of
    SLIP encapsulation the remote uses.


    Note that you must use the same encapsulation as your peer does. For example,
    if cowslip uses CIP, you have to do so, too. The symptoms of a mismatch will be
    a ping to the remote host will not receive any packets back. If the other host
    pings you, you may also see messages like "Can''t build ICMP header" on your console.
    One way to avoid these difficulties is to use adaptive SLIP.


    In fact, slattach does not allow you to enable SLIP but also other protocols that
    use the serial line as, like, PPP or KISS (another protocol used by ham radio
    people). For details, please refer to the slattach manual page.


    After turning over the line to the SLIP driver, you have to configure the network
    interface. Again, we do this using the standard ifconfig and route commands. Assume
    that from vlager, we have dialed up a server named cowslip. You would then execute


    ```

    # ifconfig s10 vlager pointoint cowslip

    # route add cowslip

    # route add default gw cowslip

    ```


    The first command configures the interface as a point-to-link to cowslip, while
    the second and third add the route to cowslip and the default route using cowslip
    as a gateway.


    When taking down the SLIP link, you first have to remove all routes through cowslip
    using route with the del option, take the interface down, and send slattach the
    hangup signal. Afterward you have to hang up the modem using your terminal program
    again:


    ```

    # route default

    # route del cowslip

    # ifconfig s10 down

    # kill -HUP 516

    ```


    # Using dip


    Now, that was rather simple. Nevertheless, you might want to automate the above
    steps so that you only have to invoke a simple command that performs all steps
    shown above. This is what dip is. (dip means Dialup IP and it was written by Fred
    van Kempen.) The current'
  merge: -1
  img_proc: true
