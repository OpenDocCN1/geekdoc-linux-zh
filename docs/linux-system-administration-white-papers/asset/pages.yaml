- pgno: 85
  md: '# The Linux Network Administrators'' Guide: Chapter 5


    This example describes only a gateway that switches packets between isolated Ethernets.
    Now assume that vlager also has a connection to the Internet (say, through an
    additional SLIP link). We would want datagrams to any destination network other
    than the Brewery to be handed to vlager. This can be accomplished by making it
    the default gateway for vstout:


    ```

    # route add default gw vlager

    ```


    The network name is a shorthand for 0.0.0.0, which defines the default route.
    You do not have to add this name to /etc/networks because it is built into route.


    When you see packet loss rates when paging a host behind one or more gateways,
    this may hint at a very congested network. Packet loss is not so much due to technical
    deficiencies as to temporary excess loads on forwarding hosts, which makes them
    delay or even drop datagrams.


    # Configuring A Gateway


    Configuring a machine to switch packets between two Ethernets is pretty straightforward.
    Assume we''re back at vlager, which is equipped with two Ethernet boards, each
    being connected to one of the two networks. All you have to do is configure both
    interfaces separately, giving them their respective IP address, and that''s it.


    > Note

    Packet forwarding by default was turned off in the linux-2.0.x series. Packet
    forwarded can be enabled at run-time thus: # echo 1 > /proc/sys/net/ipv4/ip_forward.


    It is quite useful to use additional information on the two interfaces in the
    hosts file the way shown below, so we have handy names for them, too:


    ```

    191.72.1.1   vlager      vlager.brew.com

    191.72.1.1   vlager-if1

    191.72.2.1   vlager-if2

    ```


    The sequence of commands to set up the two interfaces is then:


    ```

    # ifconfig eth0 vlager-if1

    # ifconfig eth1 vlager-if2

    # route add brew-net

    # route add wine-net

    ```'
