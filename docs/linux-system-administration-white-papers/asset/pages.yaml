    Linux one, or variations details. On using the Linux **fdisk** are given on its
    man page. The **cfdisk** command is similar to **fdisk**, but has a nicer (full
    screen) user interface.


    When using IDE disks, the boot partition (the partition with the bootable kernel
    image files) must be completely within the first 1,024 cylinders. This is because
    the disk is used via the BIOS during boot (before the system goes protected mode),
    and BIOS can''t handle more than 1024 cylinders. It is sometimes possible to use
    a boot partition that is only partly within the first 1,024 cylinders. This works
    as long as all the files that are read with the BIOS are within the first 1024
    cylinders. Because this is difficult to arrange, it is a very bad idea to do it;
    you never know when kernel update or disk defragmentation will result in an unbootable
    system. Therefore, make sure your boot partition is completely within the first
    1,024 cylinders.


    Some newer versions of the BIOS and IDE disks can, in fact, handle disks with
    more than 1,024 cylinders. If you have such a system, you can forget about the
    problem; if you aren''t sure of it, put it within the first 1,024 cylinders.


    Each partition should have an even number of sectors, since the Linux filesystems
    are a 1K block size, two sectors. An odd number of sectors will result in the
    last sector unused. This won''t result in any problems, but it is ugly, and some
    versions of **fdisk** will warn about it.


    Changing a partition''s size usually requires backing up everything you want to
    save from that partition (preferably the whole disk, in case), deleting the partition,
    creating new partition, and restoring everything to the new partition. If the
    partition is growing, you may need to adjust the sizes (and back up and restore)
    of the adjoining partitions as well.


    Because changing partition sizes is painful, it is preferable to get the partitions
    right first time, or have an effective and easy to use backup system. If you''re
    installing from a media that does not require much human intervention (say, from
    CD-ROM, as opposed to floppies), it is often easy to play with different configuration
    at risk. Since you don''t already have data to back up, it is not painful to modify
    partition sizes several times.'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# Using Disks And Other Storage Media


    There is a program for MS-DOS, called fips, which resizes an MS-DOS partition
    without requiring the backup and restore, but for other filesystems it is still
    necessary.


    # Device Files And Partitions


    Each partition and extended partition has its own device file. The naming convention
    for these files is that a partition''s number is appended after the name of the
    whole disk, with the convention that 1–4 are primary partitions (regardless of
    how many primary partitions there are) and 5–8 are logical partitions (regardless
    of within which primary partition they reside). For example, /dev/sda1 is the
    first partition on the first IDE hard disk, and /dev/sdb7 is the third extended
    partition on the second SCSI hard disk.


    # Filesystems


    # What Are Filesystems?


    A filesystem is the methods and data structures that an operating system uses
    to keep track of files on a disk or partition; that is, the way files are organized
    on a disk. The word is also used to refer to a partition or disk that is used
    to store the files or the type of the filesystem. Thus, one might say “I have
    two filesystems,” meaning one has two partitions on which one stores files, or
    one is using the “extended filesystem,” meaning the type of the filesystem.


    The difference between a disk or partition and the filesystem it contains is important.
    A few programs (including, reasonably enough, programs that create filesystems)
    operate directly on the raw sectors of a disk or partition; if there is an existing
    filesystem there it it will be destroyed or corrupted. Most programs operate on
    a filesystem, and therefore won''t work on a partition that doesn''t contain one
    (or that contains one of the wrong type).


    Before a partition or disk can be used as a filesystem, it needs to be initialized,
    the bookkeeping data structures need to be written to the disk. This process is
    called making a filesystem.


    Most Unix filesystem types have a similar general structure, although the exact
    details vary quite a bit. The central concepts are superblock, inode, data block,
    directory block, and index block. The superblock contains information about the
    filesystem as a whole, such as its size (the exact information depends on the
    filesystem). An inode contains all information about a file except its name. The
    name is stored in the directory, together with the number of the inode. A directory
    entry contains a name of a file and the number of the inode which represents the
    file. The inode contains the of several data blocks, which are used to store the
    data in the file. There is space only for a few data blocks in the inode, however,
    and if more are needed, more space for pointers to the data blocks is allocated
    dynamically. These dynamically allocated blocks are indirect blocks; the name
    indicates that in order to find the data block, one has to find its number in
    the indirect block.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# 296 The Linux Administrators’ Guide: Chapter 3


    Unix filesystems usually allow one to create a hole (this is done with lseek;
    check the manual page), which means the filesystem just pretends that at a particular
    place in the file there is just zero bytes, but no actual disk sectors are reserved
    for that in the file (this means the file will use a bit less disk space). This
    happens especially often for small binaries, Linux shared libraries, some databases,
    and a few other special cases. (Holes are implemented by storing a special value
    as the address of the data block in the block or inode. This special address means
    that no data block is allocated for that part of the file, ergo, there is a hole
    in the file.)


    Holes are moderately useful. On the author’s system, a simple measurement showed
    a potential for about 4MB of savings through holes of about 200MB total used disk
    space. That system, however, contains relatively few programs and no database
    files.


    # Filesystems Galore


    Linux supports several types of filesystems. As of this writing the most important
    ones are:


    # minix


    The oldest, presumed to be the most reliable, but quite limited in features (some
    time stamps are missing, at most 30-character file names) and restricted in capabilities
    (at most 64MB per filesystem).


    # xia


    A modified version of the minix filesystem that lifts the limits on the file names
    and filesystem sizes, but does not otherwise introduce new features. It is not
    very popular, but is reported to work very well.


    # ext2


    The most featureful of the native Linux filesystems, currently also the most popular
    one. It is designed to be easily upward compatible, so that new versions of the
    filesystem code do not require remaking the existing filesystems.


    # ext


    An older version of ext2 that wasn''t upward compatible. It is hardly ever used
    in new installations any more, and most people have converted to ext2.


    In addition, support for several foreign filesystems exists, to make it easier
    to exchange files with other operating systems. These foreign filesystems work
    just like native ones, except that they may be lacking in some usual Unix features,
    or have curious limitations, or other oddities.


    # msdos


    Compatibility with MS-DOS (and OS/2 and Windows NT) FAT filesystems.'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# Using Disks And Other Storage Media


    Extends msdos filesystem driver to Linux to get long filenames, owners, permissions,
    links, and device files. This allows a normal msdos filesystem to be used as if
    it were a Linux one, removing the need for a separate partition for Linux.


    # iso9660


    The standard CD-ROM filesystem; the popular Rock Ridge extension to the CD-ROM
    standard that allows longer file names is supported automatically.


    # nfs


    A networked filesystem that allows sharing a filesystem between many computers
    to easy access to the files from all of them.


    # hpfs


    The OS/2 filesystem.


    # sysv


    SystemV/386, Coherent, and Xenix filesystems.

    The choice of filesystem to use depends on the situation. If compatibility or
    other reasons make one of the non-native filesystems necessary, then that one
    must be used. If one can choose freely, then it is probably wisest to use ext2,
    since it has all the features but does not suffer from lack of performance.


    There is also the proc filesystem, easily accessible as the /proc directory, which
    is not really a filesystem at all, even though it looks like one. The proc filesystem
    makes it easy to access certain kernel data structures, as the process list (hence
    the name). It makes these data structures look like a filesystem, and that can
    be manipulated with all the usual file tools. For example, to get a listing of
    all processes one might use the command


    ```

    $ ls -l /proc

    total 0

    -dr-xr-xr-x 4 root root      0 Jan 31 20:37 1

    -dr-xr-xr-x 4 lrw users      0 Jan 31 20:37 63

    -dr-xr-xr-x 4 lrw users      0 Jan 31 20:37 94

    -dr-xr-xr-x 4 lrw users      0 Jan 31 20:37 95

    -dr-xr-xr-x 4 root root      0 Jan 31 20:37 98

    -dr-xr-xr-x 4 root root      0 Jan 31 20:37 99

    -r--r--r--r- 1 root root      0 Jan 31 20:37 devices

    -r--r--r--r- 1 root root      0 Jan 31 20:37 dma

    -r--r--r--r- 1 root root      0 Jan 31 20:37 filesystems

    -r--r--r--r- 1 root root      0 Jan 31 20:37 interrupts

    -r--r--r--r- 1 root root 8654848 Jan 31 20:37 kcore

    ```'
