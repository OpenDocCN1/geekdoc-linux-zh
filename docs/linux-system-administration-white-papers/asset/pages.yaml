- pgno: 351
  md: 'Run levels are configured in /etc/inittab by lines like the following:


    ```

    12:2:wait:/etc/init.d/rc 2

    ```


    The first field is an arbitrary label, the second one means that this applies
    for run level 2. The third field means that init should run the command in the
    fourth field once, when the run level is entered, and that init should wait for
    it to complete. /etc/init.d/rc command runs whatever commands are necessary to
    start and stop services over run level 2.


    The command in the fourth field does all the work of setting up a run level. It
    starts services that aren''t already running, and stops services that shouldn''t
    be running in the new run level any more. Exactly what the command is, and how
    run levels are configured, depends on the Linux distribution.


    When init starts, it looks for a line in /etc/inittab that specifies the default
    run level:


    ```

    id:2:initdefault:

    ```


    You can ask init to go to a nondefault run level at startup by giving the kernel
    command argument of single or emergency. Kernel command line arguments can be
    given via LILO, for example. This allows you to choose the single user mode (run
    level 1).


    While the system is running, the telinit command can change the run level. When
    the run level is changed, init runs the relevant command from /etc/inittab.


    # # Special Configuration In /etc/inittab


    The /etc/inittab has some special features that allow init to react to special
    circumstances. These special features are marked by special keywords in the third
    field. Some examples:


    **powerwait**


    Allows init to shut the system down, when the power fails. This assumes the use
    of a UPS, and software that watches the UPS and informs init that the power is
    off.


    **ctrlaltdel**


    Allows init to reboot the system, when the user presses Ctrl+Alt+Del on the console
    keyboard. Note that the system administrator can configure the reaction to Ctrl+Alt+Del
    to be something else instead, e.g., to be ignored, if the system is in a public
    location (or to start nethack).


    **sysinit**


    Command to run when the system is booted. This usually cleans up /tmp, for example.'
  merge: -1
  img_proc: true
- pgno: 352
  md: 'The list above is not exhaustive. See your inittab manual page for all possibilities,
    and for details on how to use the above ones.


    # Booting In Single User Mode


    An important run level is single user mode (run level 1), in which only the system
    administrator is using the machine and as few system services, including logins,
    as possible are running. Single user mode is necessary for a few administrative
    tasks (it probably shouldn''t be used for playing netck), such as running fsck
    on a /usr partition, because this requires that the partition be unmounted, and
    that can''t happen, unless just about all services are killed.


    A running system can be taken to single user mode using telinit to request run
    level 1. At bootup, it can be entered by giving the word single or emergency on
    the kernel command line: kernel gives the command line to init, and init understands
    from that word that it shouldn''t use the default run level. (The kernel command
    line is entered in a way that depends on how you boot the system.)


    Booting into single user mode is sometimes necessary so that one can run fsck
    by hand, before anything mounts or otherwise touches a /usr partition (any activity
    on a broken filesystem is likely to break it more, so fsck should be run as soon
    as possible).


    The bootup scripts init will automatically enter single user mode, if the automatic
    fsck at bootup fails. This is an attempt to prevent the system from using a filesystem
    that is broken that fsck cannot fix it automatically. Such breakage is relatively
    rare, and usually involves a broken hard disk or an experimental kernel release,
    but it''s good to be prepared.


    As a security measure, a properly configured system will ask for the root password
    before starting the shell in single user mode. Otherwise, it would be simple to
    just enter a suitable line to LILO to get in as root. (This will break if /etc/passwd
    has been broken by filesystem problems, of course, and in that case you''d have
    better a boot floppy handy.)'
  merge: -1
  img_proc: true
