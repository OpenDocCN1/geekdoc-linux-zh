- pgno: 347
  md: '# Rebooting


    Rebooting means booting the system again. This can be accomplished by first shutting
    it down completely, turning power off, and then turning it back on. A simpler
    way is to reboot the system, instead of merely halting it. This is accomplished
    by using -r option to shutdown, for example, by giving the command shutdown -r
    now.


    Most Linux systems run shutdown -r now when Ctrl+Alt+Del is pressed on the keyboard.
    This reboots the system. The action on Ctrl+Alt+Del is configurable, however,
    and it might be better to allow for some delay before the reboot on a multiuser
    machine. Systems that are physically accessible to anyone might be configured
    to do nothing when Ctrl+Alt+Del is pressed.


    # Single User Mode


    The shutdown command can also be used to bring the system down to single user
    mode, in which no one can log in, but root can use the console. This is useful
    for system administration tasks that can''t be done when the system is running
    normally.


    # Emergency Boot Floppies


    It is not always possible to boot a computer from the hard disk. For example,
    if you make a mistake in configuring LILO, you might make your system unbootable.
    For these situations, you need an alternative way of booting that will always
    work (as long as the hardware works). For typical PCs, this means booting from
    the floppy drive.


    Most Linux distributions allow one to create an emergency boot floppy during installation.
    It is a good idea to do this. However, some boot disks contain only the kernel,
    and assume you will be using the programs on the distribution''s installation
    disks to fix whatever problem you have. Sometimes those programs aren''t enough;
    for example, you might have to restore some files from backups made with software
    not on the installation disks.


    Thus, it might be necessary to create a custom root floppy as well. The Bootdisk
    HOWTO by Graham Chapman (http://MetaLab.unc.edu/LDP/Bootdisk-HOWTO/HOWTO.html)
    contains instructions for doing this. You must, of course, remember to keep your
    emergency and root floppies up to date.


    You can''t use the floppy drive you use to mount the root floppy for anything
    else. This can be inconvenient if you only have one floppy drive. However, if
    you have enough memory, you can configure your boot floppy to load the root disk
    to a RAM disk (the boot floppy''s kernel needs to be specially configured for
    this). Once the root floppy has been loaded into the ramdisk, the floppy drive
    is free to mount other disks.'
  merge: -1
  img_proc: true
- pgno: 348
  md: '# Chapter 6

    init


    > “Uuno on numero yksi.”

    —Slogan for a series

    of Finnish movies


    This chapter describes the init process, which is the first user-level process
    started by the kernel. init has many important duties, such as getting getty (so
    that users can log in), implementing run levels, and taking care of orphaned processes.
    This chapter explains how init is configured and how you can make use of the different
    run levels.


    # init Comes First


    init is one of those programs that are absolutely essential to the operation of
    a Linux system, but that you can still mostly ignore. A good Linux distribution
    will come with a configuration for init that will work for most systems, and on
    these systems there is nothing you need to do about init. Usually, you only need
    to worry about init if you hook up serial terminals, dial-in (not dial-out) modems,
    or if you want to change the default run level.


    When the kernel has started itself (has been loaded into memory, has started running,
    and has initialized all device drivers and data structures and such), it finishes
    its own part of the boot process by starting a user-level program. Thus, init
    is always the first process (its process number is 1).


    The kernel looks for init in a few locations that have been historically used
    for it, but the proper location for it (on a Linux system) is /sbin/init. If the
    kernel can''t find it, it tries to run /bin/sh, and if that also fails, the startup
    of the system fails.


    When init starts, it finishes the boot process by doing a number of administrative
    tasks, such as checking filesystems, cleaning up'
  merge: -1
