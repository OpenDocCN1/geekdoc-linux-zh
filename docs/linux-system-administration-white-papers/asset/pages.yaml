- pgno: 58
  md: '# Chapter 3

    Configuring The

    Networking Hardware


    Up to now, we''ve been talking quite a bit about network interfaces and general
    TCP/IP issues, but didn''t really cover exactly what happens when "networking
    code" in the kernel accesses a piece of hardware. For this, we have to talk a
    little about the concept of interfaces and drivers.


    First, of course, there''s the hardware itself, for example, an Ethernet board:
    this is a slice of epoxy, cluttered with lots of tiny chips with silly numbers
    on them, sitting in a slot of your PC. This is what we generally call a device.


    For you to be able to use the Ethernet board, special functions have to be present
    in your kernel that understand the particular way device is accessed. These are
    the so-called device drivers. For example, Linux has device drivers for several
    brands of Ethernet boards that are very similar in function. They are known as
    the Becker series drivers, named after their author, Donald Becker. A different
    example is the D-Link driver that handles a D-Link pocket adapter attached to
    a parallel port.


    But what do we mean when we say a driver "handles" a device? Let''s go back to
    that Ethernet board we examined above. The driver has to be able to communicate
    with the peripheral''s on-board logic somehow: It has to send commands and data
    to the board, while the board should deliver any data received to the driver.


    In PCs, this communication takes place through an area of I/O memory that is mapped
    to on-board registers and the like. All commands and data the kernel sends to
    the board have to go through these registers. I/O memory is generally described
    by'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# The Linux Network Administrators'' Guide: Chapter 3


    giving its starting or base address. Typical base addresses for Ethernet boards
    are 0x300, or 0x360.


    Usually, you don''t have to worry about any hardware issues such as the base address
    the kernel makes an attempt at boot time to detect a board''s location. This is
    called autoprobe, which means the kernel reads several memory locations and compares
    the data read with what it sees if a certain Ethernet board was installed. However,
    there may be Ethernet boards it cannot detect automatically; this is sometimes
    the case with cheap Ethernet cards that are not quite clones of standard boards
    from other manufacturers. Also, the kernel will attempt to detect only one Ethernet
    device when booting. If you''re using more than one board, you will have to tell
    the kernel about this board explicitly.


    Another parameter that you might have to tell the kernel is the interrupt request
    channel. Hardware components interrupt the kernel when they need care of them,
    e.g., when data has arrived, or a special condition occurs. In a PC, interrupts
    occur on one of 15 interrupt channels numbered 0, 1, and through 15. The interrupt
    number assigned to a hardware component is called its request number, or IRQ (Qs
    2 and 9 are the same as the PC has two cascaded interrupt processors with eight
    IRQs each; the secondary processor is connected to IRQ 2 of the primary one.)


    As described in Chapter 1, the kernel accesses a device through a so-called interface.
    Interfaces offer an abstract set of functions that is the same across all types
    of hardware, such as sending or receiving a datagram.


    Interfaces are identified by names. These names are defined internally in the
    kernel, and are not device files in the /dev directory. Typical names are eth0,
    eth1, and so on, for Ethernet interfaces. The assignment of interfaces to devices
    usually depends on the order in which devices are created; for instance, the first
    Ethernet board installed will become eth0, the next eth1, and so on. One exception
    to this rule is SLIP interfaces, which are assigned dynamically; that is, whenever
    a SLIP connection is established, an interface is assigned to the serial port.
    When booting, the kernel displays what devices it detects and what interfaces
    it installs.


    # Kernel Configuration


    When running a system, you should be familiar with building a kernel. The basics
    of this are explained in Matt Welsh''s "Installation and Getting Started" guide,
    which is also part of the Documentation Project''s series. (This guide has also
    been published in The Linux System Programming White Papers from the Coriolis
    Group.) In this section, we will discuss only those configuration options that
    affect networking.


    When running make, you will be first asked general configurations, for instance,
    whether you want kernel math emulation or not, and so on. One of these asks whether
    you want TCP/IP networking support. You must answer this with "Y" to get a kernel
    capable of networking.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Kernel Options In 1.0 And Higher


    Note


    This is one section where examples are missing. Please refer to the online version
    for updates.


    After the general option part is complete, the configuration will go on to ask
    you for various features, such as SCSI drivers and so on. The subsequent list
    questions deal with network-ing support. The exact set of configuration options
    is in constant flux because of the ongoing development. A typical list of options
    offered by most kernel versions around 1.0 and 1.1 looks like this (the comments
    are given in italics):


    Despite the macro name displayed in brackets, you must answer this question with
    “Y” if you want to use any type of networking devices, regardless of whether this
    is Ethernet, SLIP, or PPP. When answering this question with “Y”, support for
    Ethernet-type devices is enabled automatically. For other types of network drivers
    must be enabled separately.


    These questions concern the various link layer protocols supported by Linux. SLIP
    allows you to transport IP datagrams across serial lines. The compressed header
    option provides support for CSLIP, a technique that compresses TCP/IP headers
    to as little as three bytes. Note that this kernel option does not turn on CSLIP
    automatically; it merely provides the necessary kernel functions for it.


    PPP is another protocol to send traffic across serial lines. It is much flexible
    than SLIP and is not limited to IP, but also supports IPX. PLIP provides for a
    way to send IP datagrams across a parallel port connection. It is mostly used
    to communicate with PCs running DOS.


    The following questions deal with Ethernet boards from various vendors. As more
    drivers are being developed, you are likely to see questions added to this section.
    If you want to build a kernel you can use a number on many different machines,
    you can enable more than one driver.


    Finally, in the file system, the configuration script will ask you whether you
    want support for NFS, the networking file system. NFS lets you file system to
    several hosts, which makes the files appear as if they were on an ordinary hard
    disk attached to the host.


    # Kernel Options In 1.1.14 And Higher


    Note


    This is another section where examples are missing.


    Starting with 1.1.14, which added Alpha support for IPX, the configuration procedure
    changed slightly. The general options section now asks whether you want networking
    support in general. It is immediately followed by a couple of question on miscellaneous
    networking options.'
