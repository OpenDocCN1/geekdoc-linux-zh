- pgno: 115
  md: '# The Linux Network Administrators'' Guide: Chapter 6


    In dip''s scripting language, keywords prefixed with a dollar symbol denote variable
    names. dip has a predefined set of variables, which will be listed below. $remote
    and $local, for instance, contain the hostnames of the local and remote host involved
    in the SLIP link.


    The first two statements in the sample script are get commands, which is dip''s
    way to set a variable. Here, the local and remote hostname are set to vlogger
    and cowslip, respectively.


    The next five statements set up the terminal line and the modem. The reset sends
    a reset string to mode; for Hayes-compatible modems, this is the ATZ command.
    The next statement flashes forward: it dials chat in the next few lines will work
    properly. This chat is pretty straightforward: it simply dials 41988, the phone
    number of cowslip, and logs into the account using the "Svlager" "hey-jude." The
    wait command makes dip wait for the string as its first argument; the number given
    as second argument makes the wait time out after several seconds if no string
    is received. The if commands interspersed in the login procedure check that no
    error has occurred while executing the command.


    The final commands executed after logging in are default, which makes the SLIP
    link the default route to all hosts, and mode, which enables SLIP mode on the
    line and configures the interface and routing table for you.


    # dip Reference


    Although widely used, dip hasn''t been very documented yet. In this section, we
    will give you a reference for most of dip''s commands. You can get an overview
    of all commands it provides by invoking dip in test mode, and entering the help
    command. To find out about the syntax of a command, you may enter it without any
    arguments; of course this does not work with commands that take no arguments.


    DIP help

    DIP knows about the following commands:


    ```

    databits default dial  echo  flush

    get    goto  help  if    init

    mode   modem parity print port

    reset send   sleep speed stopbits

    term wait

    ```


    ```

    DIP echo

    Usage: echo on off

    DIP

    ```


    Throughout the following, examples that display the DIP> prompt show how to enter
    a command in test mode, and what output it produces. Examples lacking this prompt
    should be taken as script excerpts.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# The Modem Commands


    There is a number of commands dip provides to configure your serial line and modem.
    Some of these are obvious, as port, which selects a serial line, speed, databits,
    stopbits, and parity, which set the common line parameters.


    The modem command selects a modem type. Currently, the only type supported is
    HAYES (capitalization required). You have to provide dip with a modem type, or
    else it will refuse to execute the dial and reset commands. The reset command
    sends a reset string to the modem; the string used depends on the modem type.
    For Hayes-compatible-, this is ATZ.


    The flush code can be used to flush out all responses the modem has sent so far.
    Otherwise a chat script following the reset might be confused, because it reads
    the OK responses from earlier commands.


    The init command selects an initialization string to be passed to the modem before
    dialing. The default for Hayes modems is "ATEQ0 V1 X1", which turns on echoing
    of commands and long result codes selects binds blind dialing (no checking of
    dial tone).


    The dial command finally sends the initialization string to the modem and dials
    the remote system. The default dial command for Hayes modems is ATD.


    # echo And term


    The echo command serves as a debugging aid, in using Echo On dip echo to the console
    everything to the serial device. This can be turned off again by calling Echo
    Off.


    dip also allows you to leave script mode temporarily and enter terminal mode.
    In this mode, you can use dip just like any ordinary terminal program, writing
    to the serial line and reading- from it. To leave this mode, enter Ctrl+].


    # The get Command


    The get command is dip''s way of setting a variable. The simplest form is to set
    a variable to a constant, as used throughout the above example. You may, however,
    prompt the user for input by specifying the keyword instead of a value:


    ```

    dip $local ask

    Enterter the value for $local:

    ```


    A third method is to obtain the value from the remote host. Bizarre as it seems
    first, this is very useful in some cases. Some SLIP servers will not allow you
    to use your IP address on the SLIP link, but will assign you one from a pool of
    addresses whenever you dial in, printing some message that informs you about the
    address you have been assigned. If the message looks like this "Your address:
    193.174.7.202," then the following piece of dip code would let you pick up the
    address:'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'The Linux Network Administrators'' Guide: Chapter 6


    wait address: 10

    get $locip remote


    # The print Command


    This is the command to echo text to the console dip was started from. Any of dip''s
    variables be used in print commands, as as


    DIP using port $port at speed $speed

    Using port cua3 at speed 38400


    # Variable Names


    DIP only understands a predefined set of variables. A variable name always begins
    with a dollar symbol and must be written in lowercase letters.


    The $local and $locip variables contain the local host''s name and IP address.
    Setting the hostname makes dip store the canonical hostname $local, at the same
    time assigning $locip the corresponding IP address. The analogous happens when
    setting the $locip.


    The $remote and $rtmip variables do the same for the remote host''s name and address.

    $mtu contains the MTU value for the connection.


    These five variables are the only ones that may be assigned values directly using
    the get command. A host of other variables can only be set through corresponding
    commands, but may be used as print statements; these are $modem, $port, and $speed.


    $errvl is the variable through which you can access the result of the last command
    executed. An error level of 0 indicates success, while a nonzero value denotes
    an error.


    # The if and goto Commands


    where the expression must be a simple comparison between one of the variables
    $errvl, $locip, and $rtmip. The second operand must be an integer number; the
    operator may be one of =, !=, <, <=, >=..


    The goto command makes the execution of the script continue at the line that bearing
    the label. A label must occur the very first token on the line, and must be followed
    immediately by a colon.


    # send, Wait, And Sleep


    These commands help implement simple scripts in dip. send outputs its arguments
    to the serial line. It does not support variables, but understands all C-style
    backslash character sequences, as n and b. The tilde character (~) is used as
    an abbreviation for carriage/new line.'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'wait takes a word as an argument, and scans all input on the serial line until
    it recognizes this word. The word itself may not contain any blanks. Optionally,
    you may give a timeout as second argument; if the expected word is not received
    within many seconds, the command will return with an $errlv value of 1.


    The sleep statement may be used to wait for a certain amount of time, for instance,
    to wait for any login sequence to complete. Again, the interval is specified in
    seconds.


    # mode And default


    These commands are used to flip the serial line to SLIP mode and configure the
    interface.


    The mode command is the last command executed by dip before going into daemon
    mode. Unless an error occurs, the command does not return.


    mode takes a protocol name as argument. dip currently recognizes SLIP and CSLIP
    as valid names. The current version of dip does not understand adaptive SLIP,
    however.


    After enabling SLIP mode on the serial line, dip executes ifconfig to configure
    the interface as a point-to-point link, and invokes route to set the route to
    the remote host.


    If, in addition, the script executes the default command before mode, dip will
    also make the default route point to the SLIP line.


    # Running In Server Mode


    Setting up your SLIP client was the hard part. Doing the opposite, namely, configuring
    your host as a SLIP server, it is much easier.


    One way to do this is to use dip in server mode, which can be achieved by invoking
    it as diplogin. Its main configuration file is /etc/diphosts, which associates
    login names with the address this host is assigned. Alternatively, you can use
    sliplogin, BSD-derived tool that features a more flexible configuration scheme
    that lets you execute scripts whenever ever connects and disconnects. It is currently
    at default.


    Both programs require that you set up one login account per SLIP client. For instance,
    assume you provide SLIP service to Arthur Dent at dent.beta.com, you might create
    an account named "dent" by adding the following line to your passwd file:


    ```

    dent:*:501:60:Arthur Dent''s SLIP account:/tmp/usr/sbin/diplogin

    ```


    Afterward, you would set your dent password using the password utility.


    Now, when dip logs in, dip will start up as a server. To find out if he is indeed
    permitted to use SLIP, it will look up the username in /etc/diphosts. This file
    details the access rights and connection parameter for each SLIP user. A sample
    entry for dent could look like this:


    ```

    dent:dent.beta.com:Arthur Dent:SLIP,296

    ```'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# The Linux Network Administrators'' Guide: Chapter 6


    The first of the colon-separated fields is the name the user must log in. The
    second field may contain an additional password (see below). The third is the
    hostname or IP address of the calling host. Next comes an informational field
    without any special meaning (yet). The last field describes the connection parameters.
    This is a comma-separated list specifying the protocol (currently one of SLIP
    or CSLIP), followed by the MTU.


    When dent logs in, diplogin extracts the information on him from the diphosts
    file, and, if the second field is not empty, prompts for an “external security
    password.” The string entered by the user is compared to the (unencrypted) password
    from diphosts. If they do not match, the login attempt is rejected.


    Otherwise, diplogin proceeds by flipping the serial line to CSLIP or SLIP mode,
    and sets up the interface and route. This connection remains established until
    the user disconnects and the modem drops the line. diplogin will then return the
    line to normal line discipline, and exit.


    diplogin requires super-user privilege. If you don''t have dip running setuid
    root, you should make diplogin a separate copy of dip instead of a simple link.
    diplogin can then safely be made setuid, without affecting the status of dip itself.'
