  md: '# Configuring TCP/IP Networking


    ```

    # netstat -nr

    Kernel routing table

    Destination    Gateway      Genmask Flags Ref Use

    127.0.0.1       *               255.255.255.255 UH 1 0

    191.72.1.0      *               255.255.255.0  U 1 0

    191.72.2.0      191.72.1.1   255.255.255.0 UGN 1 0

    ```


    The -n option makes netstat print addresses as dotted IP numbers rather than symbolic
    host and network names. This is especially useful when you want to avoid lookups
    over the network (e.g., to a DNS or NIS server).


    The second column of netstat shows the gateway routing points. If no gateway is
    used, an asterisk is printed instead. Column three shows the “generality” of the
    route. When given an IP address to find a suitable route, the kernel goes through
    all routing entries, taking the bitwise AND of the address and the genmask comparing
    it to the target of the route.


    The fourth column displays various flags that describe the route as described
    in the following list:


    +   - G—The route uses a gateway.

    - U—The interface to be used.

    - H—Only a single host can be reached through the route. For example, this is
    the case for the loopback interface 127.0.0.1.

    - D—This is set if the table entry has been generated by an ICMP redirect message
    (see Chapter 3).

    - M—This is set if the table entry was modified by an ICMP redirect message.


    The Ref column of netstat output shows the number of references to this route,
    that is, how many other routes (e.g., through gateways) rely on the presence of
    this route. The last two columns show the number of times the routing entry has
    been used and the interface that datagrams are passed to for delivery.


    # Displaying Interface Statistics


    When invoked with the -i flag, netstat will display statistics for the network
    interfaces currently configured. If in addition, the -a option is given, it will
    print all interfaces in the kernel, not those that have been configured currently.
    On vstout, netstat will look like this:


    ```

    # netstat -i

    Kernel Interface table

    Iface MTU Met RX-OK RX-ERR RX-DRP RX-OVR TX-OK TX-ERR TX-DRP TX-

    lo 0 0 3185 0 0 3185 0 0 0

    eth0 1500 0 972633 17 20 120 628711 217 0

    ```'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# The Linux Network Administrators'' Guide: Chapter 5


    The MTU and Met fields show the current MTU and metric value for that interface.
    The RX and TX columns show how many packets have been received or transmitted
    error-free (RX-OK/TX-OK), damaged (RX-ERR/TX-ERR), how many were dropped (RX-DRP/TX-DRP),
    and how many were lost because of an overrun (RX-OVR/TX-OVR).


    The last column shows the flags that have been set for this interface. These are
    one-character versions of the flag names that are printed when you display the
    interface configuration with ifconfig. This is a description of those flags:


    +   - B—A broadcast address has been set.

    - L—This interface is a loopback device

    - M—All packets are received (promiscuous mode).

    - N—Trailers are avoided.

    - O—ARP is turned off for this interface.

    - P—This is a point-to-point connection.

    - R—Interface is running.

    - U—Interface is up.


    # Displaying Connections


    netstat supports a set of options to display active or passive sockets. The options
    -t, -u, -w, and -x show active TCP, UDP, RAW, or UNIX socket connections. If you
    provide the -a in addition, sockets that are waiting for a connection (i.e., listening)
    are displayed as well. This will give you a list of all servers that are currently
    running on your system.


    Invoking netstat -ta on vlager produces:


    ```

    $ netstat -ta

    Active internet connections

    Proto Recv-Q Send-Q Local       Foreign Address      (State)

    tcp      0 0 *:domain           *: LISTEN

    tcp      0 0 *:time               *: LISTEN

    tcp      0 0 *:smtp              *: LISTEN

    tcp      0 0 vlager:smtp       vstout:1040         ESTABLISHED

    tcp      0 0 *:telnet             *: LISTEN

    tcp      0 0 *:localhost:1046 vbardolino:telnet ESTABLISHED

    tcp      0 0 *:chargen           *: LISTEN

    tcp      0 0 *:daytime           *: LISTEN

    tcp      0 0 *:discard           *: LISTEN

    tcp      0 0 *:echo                *: LISTEN

    tcp      0 0 *:shell              *: LISTEN

    tcp      0 0 *:login              *: LISTEN

    ```'
