- pgno: 264
  md: '# Chapter 18


    # Newsreader Configuration


    Newsreaders are intended to offer the user functionality that allows him or her
    to access the functions of the news system easily, like posting articles or skimming
    the contents of a newsgroup in a comfortable way. The quality of this interface
    is subject of endless flame wars.


    There are a couple of newsreaders available that have been ported to Linux. Below
    I will describe the basic setup for the three most popular ones, namely tin, tm,
    and nn.


    One of the most effective newsreaders is


    ```

    $ find /var/spool/news -name ''[0-9]*'' -exec cat {} \; | more

    ```


    This is the way die-hards read their news.


    The majority of newsreaders, however, are much more sophisticated. They usually
    offer a full-screen interface with separate levels for displaying all groups the
    user has subscribed to, for displaying an overview of all articles in one group
    and for individual articles.


    At the newsgroup level, most newsreaders display a list of articles, showing their
    subject line and the author. In big groups, it is impossible for the user to keep
    track of articles relating to each other, although it is possible to identify
    responses to earlier articles.


    A response usually repeats the original article''s subject, prepending it with
    "Re:". Additionally, the message ID of the article it is a direct follow-up to
    the References: header line. Sorting articles by these two criteria generates
    small clusters (in'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'fact, trees) of articles, which are called threads. One of the tasks in writing
    a newsreader is devising an efficient scheme of threading, because the time required
    for this is proportional to the square of the number of articles.


    Here, we will not dig further into how the user interfaces are built. All newsreaders
    currently available for Linux have a good help function, so you ought to get along.


    In the following, we will only deal with administrative tasks. Most of these relate
    to the creation of threads databases and accounting.


    # Tin Configuration


    The most versatile newsreader with respect to threading is tin. It was written
    by Iain Lane and loosely modeled on an older newsreader named tass (written by
    Rich Skrenta). It does its threading when the user enters the newsgroup, and it
    is pretty fast at this unless you''re doing this via NNTP.


    On an 48DX50, it takes roughly 30 seconds to thread 1,000 articles when reading
    directly from disk. Over NNTP to a loaded news server, this would be somewhere
    above five minutes.


    > Note

    Things improve drastically if the NNTP server does the threading itself and lets
    the client retrieve the threads databases; INN-1.4 does this, for instance.


    You may improve this by regularly updating your index file with the -u option,
    or by invoking with the -U option.


    Usually, tin dumps its threading databases in the user''s home directory below
    .tin/index. This may be costly in terms of resources, so that you want to keep
    a single copy of them in a central location. This may be achieved by making tin
    set to news, for example, or some entirely underprivileged user. (However, do
    not nobody for this. As a rule, no file or commands whatsoever should be associated
    with this user)


    tin will keep all thread databases /var/pool/news/. For any file access or shell
    escape, it will reset its effective uid to the real uid of the user who invoked
    it. (This is the reason why you will get error messages when invoking it as super-user.
    But then, you shouldn''t work as root, anyway).


    A better solution is to install the tin indexing daemon that runs as a daemon
    and regularly updates the index files. This daemon is, however, not included,
    so you would have to pile it yourself. If you are running a LAN with a central
    server, you may have run tin on the server and have all clients retrieve the index
    files via NNTP. This, of course, requires an extension to NNTP. Patches for nntpd
    that implement this extension are included in the tin source.'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'The version of tin included in some distributions has no NNTP support compiled
    in, but most do have it now. When invoked as rtin or with the -r option, tin tries
    to connect to the NNTP server specified in the file /etc/ntmpserver or in the
    NNTPSERVER environment variable. The nntmpserver simply contains the server''s
    name on a single line.


    # trn Configuration


    trn is the successor to an older newsreader, namely rm (which means read news).
    The "t" in its name stands for "threaded." It was written by Wayne Davidson.


    Unlike tin, trn has no provision for generating its threading database at run-time.
    Instead, it uses those provided by a program mthreads that have to be invoked
    regularly from cron to update the index files.


    Not running mthreads, however, doesn''t mean you cannot access new articles; it
    means you will have all those "Novell buys Linux!" articles scattered across your
    selection menu, instead of a single thread you may easily skip.


    To turn on threading for particular newsgroups, mthreads is invoked with the list
    of newsgroups on the command line. The list is made up in exactly the same fashion
    as the one in your sys:


    ```

    mthreads comp,rec,rec.games.go

    ```


    will enable threading for all comp and rec, except for rec.games.go (people who
    play Go don''t need fancy threads). After that, you simply invoke it without any
    option at all to make it thread newly arrived articles. Threading of all groups
    found in your active file can be turned on by invoking mthreads with a group list
    of all.


    If you''re receiving news during the night, you will customarily run mthreads
    once in the morning, but you can also do so more frequently if needed. Sites that
    have very heavy traffic may run mthreads in daemon mode. When it is started at
    boot time using the -d option, it puts itself in the background, and wakes up
    every 10 minutes to check if there are any newly arrived articles, and threads
    them. To run mthreads in daemon mode, put the following line in your rc.news script:


    ```

    /usr/local/bin/rn/mthreads -dev

    ```


    The -a option makes mthreads automatically turn on threading for new groups as
    they are created; -v enables verbose log messages to mthreads'' log file, mt.log
    in the directory where you have trn installed.


    Old articles no longer available must be removed from the index files regularly.
    By default, only articles whose number is below the low water mark will be removed.'
  merge: -1
  img_proc: true
- pgno: 267
  md: "# 244 The Linux Network Administrators' Guide. Chapter 18\n\n> Note\nC-News\
    \ doesn't update this low water mark automatically; you have to run\ndatemin to\
    \ do so. Please refer to Chapter 16.\n\nArticles above this number have been expired\
    \ nevertheless (the oldest article has been assigned an long expiry date by an\
    \ Expires: header field) may be removed by giving mthreads the -e option to for\
    \ an “enhanced” expiry run. When mthreads is running in daemon mode, the -e option\
    \ puts it in such an enhanced expiry run once a day, shortly after midnight.\n\
    \n# nn Configuration\n\nnn, written by Kim F. Storm, claims to be a newsreader\
    \ whose ultimate goal is not to read news. Its name stands for “no news,” and\
    \ its motto is “No news is good news. nn is better.\n\nTo achieve this ambitious\
    \ goal, nn comes along with a large assortment of maintenance tools that not only\
    \ allow generation of threads, but also extensive checks on consistency of these\
    \ databases, accounting, gathering of usage statistics, and access restrictions.\
    \ There is also an administration program called namin, which allows you to perform\
    \ these tasks interactively. It is very intuitive; hence, we will not dwell on\
    \ these aspects, and only deal with the generation of index files.\n\nThe nn threads\
    \ manager is called nmmaster. It is usually run as a daemon, started from the\
    \ rc.news or rc.inet2 script. It is invoked by\n\n```\n/usr/local/lib/nn/nmaster\
    \ -l -r -C\n```\n\nThis enables threading for all newsgroups present in your active\
    \ file.\n\nEquently, you may invoke nmmaster periodically from cron, giving it\
    \ a list of groups to act upon. This is very similar to the subscription list\
    \ in the sys file, except that it uses blanks instead of commas. Instead of the\
    \ fake group name all, an empty argument should be used to denote all groups.\
    \ A sample invocation is\n\n```\n/usr/local/lib/nn/nmmaster !rec.games go comp\n\
    ```\n\nNote that the order is significant here: the leftmost group specification\
    \ that matches ways. Thus, if we have put !rec.games after rec, all articles from\
    \ this group have been threaded nevertheless. \n\nNn offers several methods to\
    \ remove expired articles from its databases. The first is to update the database\
    \ by scanning the newsgroup directories and discarding the entries whose article\
    \ is no longer available. This is the default operation obtained by invoking nnmaster\
    \ with the -E option. It is reasonably fast unless you are doing this via NNTP-"
  merge: -1
  img_proc: true
- pgno: 268
  md: 'Method behaves exactly like a default expiry run of mthreads, in that it only
    removes those entries that refer to articles whose number is below the low water
    mark in the active file. It may be enabled using the -e option.


    Finally, a third strategy is to discard the entire database and recollect all
    articles. This may be done by giving -E3 to nnmaster.


    The list of groups to be expired is given by the -F option in the same fashion
    as above. However, if you have nnmaster running as daemon, you must kill it (using
    -k) before expiry can take place, and to restart it with the original options
    afterward. Thus the proper command to run expire on all groups using method-1
    is:


    ```

    # nnmaster -kF ""

    # nnmaster -lrC

    ```


    There are many flags that may be used to fine-tune the behavior of nn. If you
    are concerned about removing bad articles or digestifying article digests, read
    the nnmaster manual page.


    nnmaster relies on a file named GROUPS, which is located in /usr/local/lib/nn.
    If it does not exist initially, it is created. For each newsgroup, it contains
    a line that begins with the group''s name, optionally followed by a time stamp
    and flags. You may edit these flags to enable certain behavior for the group in
    question, but you may not change the order in which the groups appear. (This is
    because their order has to agree with that of the entries in the (binary) MASTER
    file.) The flags allowed and their effects are detailed in the nnmaster manual
    page, too.'
  merge: -1
  img_proc: true
