- pgno: 179
  md: '# The Linux Network Administrators'' Guide: Chapter 11


    In this section, we will cover all modem ports; TCP ports and direct lines are
    discussed in a later section.


    For modem and direct ports, you have to specify the device for calling out using
    the device directive. Usually, this is the name of a device special file in the
    /dev directory, like /dev/cua1.


    > Note

    People use the ttyS* devices instead, which are intended for dial-in only.


    In the case of a modem device, the port entry also determines what type of modem
    is connected to the port. Different types of modems have to be configured. Even
    modems that claim to be Hayes-capable needn''t be compatible with each other.
    Therefore, you have to tell uucico how to initialize the modem and how to make
    it dial the desired number. Taylor UUCP keeps the descriptions of all dialers
    in a file named dial. To use any of these, you have to specify the dialer''s name
    using the dialer command.


    Sometimes, you will want to use a modem in different ways, depending on what system
    you call. For instance, some older modems don''t understand when a high-speed
    modem attempts to connect at 14,400bps; they simply drop the line instead of negotiating
    a connection at, say, 9,600bps. When you know such drops you have to set your
    modem differently when calling them. For this, you need an additional port entry
    in the port file that specifies a different dialer. Now you can get the new port
    name, such as serial-slow, and use the port directive in drop system sys.


    A better way is to distinguish the ports by the speeds they support. The system
    entry for site drop would now use serial as port name, but request to use it at
    9,600bps only. uucico will then automatically use the second port entry. All remaining
    sites that have a speed of 38,400bps in the system entry will be called using
    the first port entry.


    # How To Dial A Number: the dial File


    The dial file describes the various dialers are used. Traditionally, UUCP talks
    of dialers rather than modems, because in earlier times, it was usual practice
    to have one (expensive) automatic dialing device serve a whole bank of modems.
    Today, most modems have dialing support built in, so this distinction gets a little
    blurred.


    Nevertheless, different dialers or modems may require a different configuration.
    You can describe each of them in the dial file. Entries in dial start with the
    dialer command, which gives the dialer''s name.


    The most important entry is this modem chat, specified by the chat command. Similar
    to the login chat, it consists of a sequence of strings uucico sends to the dialer
    and the responses it expects in return. It is commonly used to reset the modem
    to some known state, and dial the number.'
