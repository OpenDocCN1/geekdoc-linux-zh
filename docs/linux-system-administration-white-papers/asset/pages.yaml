    # mv password passwd.local

    # ln ypppasswd passwd

    ```


    This "replaces" the password command with the ypppasswd command.


    At the same time you have to install rpc.ypppasswd on the server and start it
    from rc.inet2. This will effectively hide any of the contort of NIS from your
    users.


    # Using NIS With Shadow Password


    John F. Haugh, the author of the shadow suite, recently released version of the
    shadow library functions covered by the GNU Library GPL to comp.sources.misc.
    It already has some support for NIS, but it''s not complete and the files haven''t
    been added to the standard C library yet. On the other hand, publishing the information
    from /etc/shadow via NIS defeats the purpose of the shadow suite.


    Although the NIS password lookup functions don''t use byname or anything likewise,
    supports using a local /etc/shadow file transparently. When the NIS implementation
    of getpwnam is called to look up information related to a given login name, the
    facilities provided by the password entry in nsswitch.conf are: The NIS service
    will simply look up the name in the passwd.map on the NIS queried. The files service,
    however, will check if /etc/shadow is present, and if so, try to open it. If none
    is present, or if the user doesn''t have root privilege, it reverts to the traditional
    behavior of looking up the user information in /etc/shadow only. However, if the
    shadow file exists and can be opened, NYS will extract the user password from
    shadow. The getpuid function is implemented accordingly. In this fashion, binaries
    compiled with NYS will deal with a local shadow suite installation transparently.


    # Using The Traditional NIS Code


    If you are using the client code that is in the standard libc currently, configuring
    a NIS client is a little different. On one hand, it uses a ybind daemon to broadcast
    for all servers rather than gathering this information from a configuration file.
    You therefore have to make sure to start ybind at boot time. It must be invoked
    after the NIS domain has been set and the RPC portmapper has been started. Invoking
    ypcat to test the server should then work as shown above.'
