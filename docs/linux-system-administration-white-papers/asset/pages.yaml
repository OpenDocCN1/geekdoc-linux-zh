  md: '# 218 The Linux Network Administrators'' Guide: Chapter 16


    If you''re using a later release of C-News, you may also have to create the out.master
    directory in the news spool directory.


    If you''re using newsreaders from a different distribution than the C-News you
    have running, you may find that some expect the news spool on /usr/spool/news
    rather than in /var/spool/news. If your newsreader doesn''t seem to find any articles,
    create a symbolic from /usr/spool/ news to /var/spool/news.


    Now, you are ready to receive news. Note that you don''t have to create any directories
    other than those above, because each time C-News receives an article from a group
    for which''s no spool directory yet, it will create it.


    In particular, this happens to all groups an article has been cross-posted to.
    So, after a while, you will find your spool cluttered with directories for newsgroups
    you have never subscribed to, like alt.lang.deco. You may prevent this by removing
    all unwanted groups from active, or by regularly running a shell script that removes
    all empty directories below /var/spool/news (except out going.in.coming, of course).


    C-News needs a user to send error messages and status reports. By default, this
    is usenet. If you use the default, you have to set up an alias for which forwards
    all of its mail to one or more responsible persons. (Chapters 13 and 14 explain
    how to do so for free and sendmail.) You may also override this by setting the
    environment variable NEWSMASTER to the appropriate name. You have to do so in
    news''s cronfile, as well every time you invoke an administrative tool manually,
    so installing an alias is possibly easier.


    While you''re hacking /etc/passwd, make sure every user has her real name in the
    pw_gecos field of the password file (this is the fourth field). It is a question
    of Usenet netiquette that the sender''s real name appears in the From: field of
    the article. Of course, you will want to do so anyway when you use mail.


    # The sys file


    The sys file, located in /usr/lib/news, controls which hierarchies you forward
    and receive to other sites. Although there are maintenance tools named''addfeed
    and deelf, I think it''s better to maintain this file by hand.


    The sys file contains entries for each site you forward news to, as well as a
    description of the groups you will accept. An entry looks like


    ```

    site[/exclusions]:grouplist[//distlist][:flags[:cmds]

    ```


    Entries may be continued across newlines using a backslash (\). A hash sign (#)
    denotes a comment. The following are definitions of the sys entry:'
