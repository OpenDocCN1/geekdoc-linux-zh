    # The active File


    The active file is located in /usr/lib/news and lists all groups known at your
    site, and thenarticles currently online. You will rarely have to touch it, but
    we explain it nevertheless for

    sake of completeness. Entries take the following form:


    newsgroup high low perm


    Newsgroup is, of course, the group''s name. low and high are the lowest and highest
    numbersnof articles currently available. If none are available at the moment,
    low is equal high+1.


    At least, that''s what the low field meant to do. However, for efficiency reasons,
    C-News

    dn''t update this file. This wouldn''t be such a big loss if there weren''t newsreadersnthat
    depend on it. For instance, trn checks this file to see if it can purge any articles

    ith thread database. To update the low field, you have to run the updateamin comnmand
    regularly (or, in earlier version of C-News, the upscript).


    Perm is a parameter detailing the access users are granted to the group. It takes
    one of thenfollowing values:


    +   - y-Users are allowed to post to this group.

    - n-Users are not allowed to post to this group. However, the group may still
