  md: '# The Linux Network Administrators'' Guide: Chapter 11


    for uuget in your /bin directory. Another program I am aware of Gert Doering mgetty,
    which supports reception of facemails. You can also obtain the latest versions
    of them from sunsite.nc.edu as either binary or source.


    Explaining the differences in the way uuget and mgetty handle logins is beyond
