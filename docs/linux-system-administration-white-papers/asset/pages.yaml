  md: "# The Network File System 141\n\nto the process itself it calls the write(2)\
    \ function the next time, so a program can never be sure that a write operation\
    \ to a soft-mounted volume has succeeded at all.\n\nWhether you hard- or soft-mount\
    \ a volume is not simply a question of taste but also has to do with what sort\
    \ of information you want to access from this volume. For example, if you mount\
    \ your X-programs by NFS, you would certainly not want your X-session to go berserk\
    \ just because someone brought the network to a grinding halt by filling seven\
    \ copies of xv at the same time or by pulling the Ethernet plug for a moment.\
    \ By hard-mounting these, you make sure your computer will wait until it is reestablish\
    \ contact with your NFS server. On the other hand, noncritical data such as NFS-mounted\
    \ news partitions or FTP archives may be soft-mounted, so it doesn't hang your\
    \ session in the remote machine should be temporarily unreachable, or down. If\
    \ your connection to the server is flaky or goes through a loaded router, you\
    \ may increase the initial timeout using the time option, or hard-mount the volumes,\
    \ but allow for signals interrupting the NFS call so that you may start any hanging\
    \ file connection.\n\nUsually, the mount daemon will be in some way or keep track\
    \ of which directories have been mounted by what hosts. This information can be\
    \ displayed using the showmount program, which is also included in the NFS server\
    \ package. The mount, however, does not do this.\n\n# The NFS Daemons\n\nIf you\
    \ want to provide NFS service to other hosts, you have to run the nfs and mountd\
    \ daemons on your machine. As RPC-based programs, they are not managed by inetd,\
    \ but are started up at boot time, and register themselves with the portmapper.\
    \ Therefore, you have to make sure they start only after rpc.portmapper is running.\
    \ Usually, you include the following lines in your rc.inet2 script:\n\n```\nif\
    \ [ - /usr/sbin/rpc.mount ]; then\n  /usr/sbin/rpc.mount; echo -n \" mount\"\n\
    if [ - /usr/sbin/rpc.nfsd ]; then\n  /usr/sbin/rpc.nfsd; echo -n \" nfsd\"\n```\n\
    \nThe ownership information of files a NFS daemon provides to its clients usually\
    \ contains only numerical user and group IDs. If both client and server associate\
    \ the same user and group names with these numerical IDs, they are said to share\
    \ the same uid/gid space. For example, this is the case when you use NIS to distribute\
    \ the passwd information to all hosts on your LAN.\n\nOn some occasions, however,\
    \ they do not match. Rather than updating the uids and gids of the client to match\
    \ those of the server, you can use the uggid mapping daemon to work"
