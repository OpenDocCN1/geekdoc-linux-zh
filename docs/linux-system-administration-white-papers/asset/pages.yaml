- pgno: 280
  md: '# About The Author


    **Lars Wirzenius** has been involved with Linux almost from the beginning, being
    the second person to have Linux running on his computer. Not having the patience
    for kernel programming, he has concentrated on higher-level issues, such as moderating
    the comp.os.linux.announce newsgroup. In 1992, he helped co-found the Linux Documentation
    Project with Michael K. Johnson and Matt Welsh. The LDP set out to produce a complete
    and free set of documentation for Linux users, programmers, and system administrators.
    It has mostly succeeded. Lars wrote *The Linux System Administrators'' Guide*
    for the LDP.


    Lars continues to doodle with the LDP, and is a developer for the Debian Project,
    one of the Linux distributions. Mostly, he tries to finish even one of his eternal
    hobby projects. For more information, see his home page at http://www.iki.fi/liw.
    He can be reached at http://liw@iki.fi. (Unfortunately, to preserve his free time,
    Lars usually can''t answer generic Linux queions. Questions and suggestions directly
