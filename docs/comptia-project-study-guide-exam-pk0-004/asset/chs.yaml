  \ A, E, F. 项目团队成员为项目贡献专业知识，根据进度贡献交付物，估计任务持续时间并估计成本和依赖关系。\n\n16. A. 项目计划员负责制定和维护项目计划，传达时间表及时间变更，报告进度性能，并从资源处获取任务状态。\n\
  \n17. A. 项目经理应该花时间定义项目请求的问题或需求，并将其记录在高层范围定义中。可能是业务案例没有定义清楚，但其原因也是因为问题或需求没有定义清楚。\n\
  \n18. D. `PMO` 为项目建立治理流程，并提供管理项目所需的工具、模板等。\n\n19. C. 项目描述描述了项目产品、服务或结果的特征。项目描述作为定义高层范围过程的一部分被记录。\n\
  \n\n\n\n\n20. B, D, F, G. 项目基准包含已批准的进度、成本、范围和质量计划及文档，并由项目发助人批准。项目基准随后用于在项目进展过程中衡量绩效。你可以随时查阅项目基准，以确定你是否符合进度、在范围之内且预算范围内，并判断质量标准是否到位。\n\
  \n## 第 3 章：创建项目章程\n\n1. C. `Initiating`启动过程涉及项目的正式验收，并授权项目经理开始项目工作。向项目团队成员分配工作、安排项目活动顺序以及协调资源发生在`Planning`规划过程中。\n\
  \n2. A. 项目发助人授权项目开始，并批准且签署项目章程。\n\n3. D. `Monitoring and Controlling`监控与控制过程处理风险、绩效衡量与报告、质量保证、治理流程、变更控制和预算控制。\n\
  \n4. B. 项目经理的关键角色是通知发助人项目的变更、状态、问题和冲突。项目请求者和利益相关者也应被，但项目经理的主要职责涉及通知发助人并保持其信息更新。\n\
  \n5. B, D, F. `Planning`规划过程中的活动包括：项目进度、工作分解结构、资源、详细风险、需求、沟通计划、采购计划、变更管理计划和预算。项目章程确实包含高层预算，但项目预算是在`Planning`过程中完全开发的，并在项目的剩余时间内进行持续监控。\n\
  \n6. A, B, E. `Closing`结束过程执行集成计划以及将项目产品转移到组织的其他区域。教训总结、项目验收、关闭合同、释放资源和存档文档在此过程中发生。\n\
  \n7. B, C, F. 五大过程组为`Initiating`启动、`Planning`规划、`Executing`执行、`Monitoring and Controlling`监控与控制和`Closing`结束。选项\
  \ A、D 和 E 是知识领域。\n\n8. D. `Executing`执行过程是执行项目工作的地方。\n\n9. C. 项目章程正式批准项目并授权工作开始。项目进度和成本估计在之后的`Planning`过程中制定。\n\
  \n10. A. 在项目章程签署批准后，你应该与关键利益相关者和关键团队成员召开启动会议，讨论项目目标。\n\n11. C. 里程碑是项目中的重大事件，用于衡量进度。它们也可能标记关键交付物的完成和通过。里程碑还用作项目期间的检查点，以确定项目是否准时且符合进度。\n\
  \n12. E. 列出的所有选项都是正确的。如果项目章程已签署，你已经完成了`Initiating`过程，发助人已正式批准项目的资金和资源。如果团队急于立即开始工作，他们正跳到了`Executing`执行过程组。\n\
  \n13. C, D, E. 项目章程不包含高层成本效益分析或业务理由。业务理由是一份独立的文档，不是项目章程的一部分。业务理由是记录成本效益分析的地方。\n\n\
