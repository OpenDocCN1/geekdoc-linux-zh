  \ (WBS)\n        * 资源\n        * 详细风险\n        * 需求\n        * 沟通计划\n        * 采购计划\n\
  \n\n\n\n* 变更管理计划\n* 预算\n* 执行\n    * 交付物\n* 监控与控制\n    * 风险/问题日志\n    * 衡量与报告\n \
  \   * 质量保证/治理\n    * 变更控制\n    * 预算\n* 结束\n    * 转换/整合计划\n        * 培训\n    * 项目验收\n\
  \    * 归档项目文档\n    * 教训\n    * 释放资源\n    * 关闭合同\n\n![](img/correction.jpg) 4.2 给定场景，分析以项目为中心的文档。\n\
  \n* 项目章程\n* 项目管理计划\n* 问题日志\n* 组织结构图\n* 范围说明\n* 沟通计划\n* 项目进度表\n* 状态报告\n* 仪表板信息\n\
  * 行动事项\n* 会议议程/会议纪要\n\n![](img/egeng009.jpg)\n\n# 项目过程组\n\nPMI^® 将项目管理定义为执行一系列过程，通过将知识、技能、工具和技术应用于项目活动，以满足项目需求。这些过程被组织成五个过程组：启动、规划、执行、监控与控制以及结束。每个过程组包含至少两个单独的过程（有些包含更多），它们有自己的过程输入、工具和技术以及输出。例如，`Develop\
  \ Project Charter`（制定项目章程）过程归属于启动过程组。它有五个输入、两个工具和技术和一个输出（项目章程）。\n\n过程组或阶段是紧密关联的。一个组的输出通常会成为另一个组的输入。这些组可能会重叠，或者你可能会发现必须在一个过程组内重复一组过程。例如，当你开始执行项目工作时，可能会发现需要对项目管理计划进行更改。因此，你可能需要重复规划过程组中的某些过程，并在计划更改后重新执行许多执行过程。这被称为\
  \ `iterative`（迭代）方法。图 3.1 显示了各组之间的联系。\n\n![框图显示启动引导至规划，启动控制、规划控制引导至执行、控制，通过规划、执行等。](img/c03f001.jpg)\n\
  \n图 3.1 PMI^® 过程组\n\n当你学习每个组时，请注意过程组（或阶段）与 CompTIA Project+ 考试涵盖领域之间的相关性。这些阶段是项目管理的基础。你需要理解每个组、其特征以及它们如何有助于交付项目的最终产品、服务或结果。\n\
  \n## 启动过程\n\n启动是新项目开始的正式授权，或现有项目继续进入下一阶段的正式授权。启动阶段是 PMI^® 在 `PMBOK Guide`^® 中描述的五个过程组中的第一个。\n\
  \n`Initiating`（启动）过程包括通往项目最终授权的所有活动，从原始项目请求开始。这一过程可以是正式的，也可以是非正式的，取决于组织。启动过程中的关键活动如下：\n\
  \n* 创建项目章程\n* 创建业务案例和合理性说明\n* 定义高级范围\n* 识别高级风险\n\n第 1 章已经涵盖了业务案例。在本章的剩余部分，你将更深入地学习项目章程、高级范围定义和高级风险。\n\
  \n## 规划过程\n\n在 `Planning`（规划）过程中，项目目标、目的和交付物被精炼并分解为可管理的工作单元。项目经理为每项活动创建时间和成本估算，并确定资源需求。规划涉及项目管理的其他几个关键领域，包括沟通、风险、人力资源、质量和采购。\n\
  \n规划过程组的关键活动如下：\n\n* 制定项目进度表。\n* 创建工作分解结构。\n* 确定资源。\n* 识别并规划详细风险。\n* 确定项目需求。\n*\
  \ 编写沟通计划。\n* 如果使用组织外的资源，则制定采购计划。\n* 开发变更管理计划。\n* 定义项目预算。\n\n规划阶段包含许多过程，这些过程通常都会创建计划或文档，这些文档贯穿整个项目，以确保项目目标的实现。表\
  \ 3.1 显示了 CompTIA 在其目标中强调的文档及其目的，以及产生它们的过程组。你将在书的剩余部分学习这里展示的每份项目管理文档。\n\n| 文档名称\
  \ | 文档描述 | 过程组 |\n| --- | --- | --- |\n| 项目章程 | 授权项目启动 | 启动 |\n| 项目管理计划 | 由所有项目规划文档组成，如章程、范围说明、进度表等\
  \ | 规划 |\n| 问题日志 | 问题列表，包含编号、描述和所有者 | 执行 |\n| 组织结构图 | 描述项目团队的组织和汇报结构 | 规划 |\n| 范围说明\
  \ | 记录产品描述、关键交付物、成功和验收标准、关键绩效指标、排除项、假设和约束 | 规划 |\n| 沟通计划 | 记录利益相关者需要的信息类型、何时发布信息以及如何交付信息\
  \ | 规划 |\n| 项目进度表 | 确定项目活动的开始和结束日期，并为活动分配资源 | 规划 |\n| 状态报告 | 向利益相关者汇报项目交付物、进度、风险、问题等状态的报告\
  \ | 执行 |\n| 仪表板信息 | 一种电子报告工具，允许用户选择项目元素来监控项目的健康和状态 | 执行 |\n| 行动事项 | 为了履行交付物而应该解决的项目行动列表\
  \ | 执行 |\n| 会议议程/会议纪要 | 会议议程描述后续会议中要讨论和处理的项目，纪要则回顾会议上讨论的内容和做出的决定。 | 执行 |\n\n表 3.1\
  \ 项目管理文档\n\n## 执行过程\n\n`Executing`（执行）过程是执行项目工作的地方。项目经理必须协调所有团队成员以及分配给项目的其他资源。\n\
  \n执行过程包括项目管理计划的实际执行、团队开发、质量保证、信息分发等。执行过程的关键活动如下：\n\n* 产生并验证交付物。\n\n交付物在此过程中被产生和验证。如果它们不符合预期，则会提交变更请求或采取纠正措施（这两者都在监控与控制过程中发生），以确保交付物符合规范。\n\
  \n在执行过程中，资源管理非常重要。你将在在此过程中获取项目团队成员，确保他们得到适当利用，并开展团队建设活动。该过程还包括与组织外部的供应商和承包商合作。\n\
  \n## 监控与控制过程\n\n\n\n\n`Monitoring and Controlling`（监控与控制）过程是监控项目进度以识别与项目管理计划偏差的活动。项目范围的变更请求包含在此过程组中。该领域也是采取纠正措施以使项目工作与项目计划保持一致的区域。\n\
  \n监控与控制阶段的其他领域还包括范围控制、成本控制、进度控制、质量控制、绩效报告和风险控制。\n\n监控与控制过程中的关键活动如下：\n\n*   监控风险/问题日志\n\
  *   绩效衡量与报告\n*   执行质量保证/治理活动\n*   管理变更控制过程\n*   监控预算\n\n# 收尾过程\n\n`Closing`（收尾）过程的主要目的是对项目工作的正式验收进行记录，并将完成的产品交付给组织进行持续的维护和支持。\n\
  \n收尾过程包括项目签字、项目文档归档、移交给维护小组、释放项目团队成员以及回顾经验教训。\n\n收尾过程中的关键活动如下：\n\n*   向维护/运营团队的过渡/集成计划\n\
  *   对在项目移交给运营部门后将支持该产品、服务或结果的人员进行培训\n*   项目验收与签字\n*   归档项目文档\n*   记录经验教训\n*   释放资源\n\
  *   关闭合同\n\n这一过程组是项目管理中最经常被跳过的阶段。尽管其中一些活动可能看起来非常简单，但该过程组的几个元素值得密切关注。第 10 章“项目工具与文档”将探讨项目的最后阶段。\n\
  \n### 创建项目章程\n\n启动过程的产出是`project charter`（项目章程）。该文档为项目的启动提供了正式批准，并授权项目经理将资源应用于项目中。项目发起人是发布、签署和批准项目章程的人。发布章程是一个重大里程碑，因为它是你批准的项目的第一份正式文档。\n\
  \n组织标准可能会决定项目章程的具体格式及其包含的信息。作为项目经理，你应该向 PMO（项目管理办公室）确认，确定是否有项目章程的模板或要求的格式。\n\n以下应包含在你的项目章程中的关键要素。第\
  \ 1 章讨论了项目的目的或理由。这记录在业务案例中，并可以很容易地复制到项目章程中。下一节将涵盖其余元素。\n\n*   项目的目的或理由\n*   项目目标和目标\n\
  *   项目描述\n*   关键交付物\n*   高层需求列表\n*   高层里程碑\n*   高层预算\n*   高层假设\n*   高层约束\n*   高层风险\n\
  *   项目经理姓名及其权限级别\n*   发起人姓名\n*   项目批准标准\n\n### 目标和目的\n\n章程记录了项目的高层目标和具体目标。项目章程需要包含一个清晰的陈述，说明项目将产生什么最终结果以及如何衡量成功。目标和目的必须清晰，并且表述方式要使最终结果能够相对于目标易于衡量。与其说“建造一条新公路”，不如目标应包含可衡量的结果，例如“在\
  \ 6 月 30 日前在 A 市和 B 市之间建造一条双向三车道的新公路”。\n\n与发起人合作记录可量化和可衡量的目标是项目成功的关键。它让客户、发起人、关键利益相关者、项目经理和团队成员对项目的最终结果有相同的共同理解。\n\
  \n### 项目描述\n\n`project description`（项目描述）记录了项目将创建的产品、服务或结果的关键特征。项目描述还记录了正在创建的产品与驱动项目请求的业务需求之间的关系。该描述需要包含足够的细节，作为规划过程组的基础，规划过程组将在章程签署后开始。\n\
  \n## 关键交付物\n\n`Deliverables`（交付物）是可衡量的产出或结果，或者是为了认为项目完成而必须产生的特定项目。交付物是实形的，并且易于衡量和验证。例如，假设你的项目涉及制造一种新的园艺推车。推车的一个组件是轮子。由于你的推车的设计，轮子的直径必须为\
  \ 12 英寸。这是一个实形的、可验证的交付物，为了项目的成功，必须满足这一要求。\n\n确保交付物和需求正确对于你项目的成功至关重要。无论你应用项目管理技能的能力有多强，如果产生了错误的交付物，或者按照错误的目标管理项目，你将面临一个失败的项目（并且可能需要更新你的简历）。\n\
  \n## 高层需求\n\n`Requirements`（需求）描述了为了满足项目需求而必须满足交付物的特征。需求还可能描述了为了满足合同、规范、标准或其他项目文档（通常是范围说明）而必须产生的结果或成果。需求量化并优先考虑了项目发起人和利益相关者的愿望、需求和期望。\n\
  \n项目章程包含了需求的高层视图。随着项目规划的进行，会有更多信息被发现，需求将变得详细得多。我将在第 4 章“创建工作分解结构”中更多地讨论需求。\n\n##\
  \ 高层里程碑\n\n`Milestones`（里程碑）是项目中的重大事件，用于衡量进度。它们也标志着关键交付物的完成和批准。里程碑还被用项目期间的检查点，以确定项目是否按计划进行。\n\
  \n## 高层预算\n\n详细的项目预算在稍后的规划过程中准备。但对于项目章程而言，你需要对项目成本有一个高层估算。你可以使用与当前项目规模、范围和复杂度相似的过去历史信息。或者你可以要求供应商社区帮助提供项目的高层估算。\n\
  \n## 高层假设\n\n`Assumptions`（假设）是你认为是真并计划考虑的事件、行动、概念或想法。例如，你可能可能需要一个具有高度专业技能的资源。拥有这种技能的人在你维护部门，由于你过去曾与职能部门经理和该资源合作过，你假设他们将参与此项目。你可以对项目的许多许多元素做出假设，包括资源可用性、资金、天气、其他相关事件的时间、供应商的可用性等。始终记录并验证你的项目假设至关重要。\n\
  \n## 高层约束\n\n\n\n\n\n`Constraints`（约束）是指任何限制或规定项目团队行为的因素。例如，你可能有一个无法更改的硬性截止日期。如果你正在开发一个于\
  \ 9 月 25 日行的贸易展活动，那么这个日期就是项目的一个约束，因为你无法移动它。预算、技术、范围、质量以及高层管理的直接指令都是约束的例子。\n\n###\
  \ 高级风险\n风险会对项目构成机会或威胁。在大多数情况下，我们认为风险是有负面影响和后果的。\n\n你应该在项目章程中列出一份高级风险列表。这些风险可能涵盖广泛的可能性，包括预算风险、进度风险、项目管理流程风险、政治风险、法律风险、管理风险等。风险与约束之间的区别在于，约束是当前存在的限制条件，而风险是可能影响项目的未来潜在事件。以\
  \ 9 月 25 日的硬性截止日期启动项目是一个约束；而供应商可能在 9 月 15 日错过重要交付的可能性则是一个风险。\n\n### 其他内容\n你应该在章程中描述的其它元素还包括项目经理的名称和权限级别、项目赞助人的名称，以及你预先承诺投入项目团队的任何团队成员。\n\
  \n### 批准标准\n最后但同样重要的是，项目章程应该概述项目批准的标准。将此理解为项目成功的定义即可。这些标准将用于判断交付物以及项目的最终产品、服务或结果是否可以接受且令人满意。它们可能包括质量标准、性能标准、适用性等项目。此部分还应该描述利益相关者将使用什么流程来表示对交付物的验收。\n\
  \n### 正式批准\n项目赞助人应该审查并签署项目章程。这种签署为项目经理提供了继续推进的权限，并作为项目启动的正式通知。在发布采购订单或职能部门经理承诺提供资源以支持项目之前，通常需要此项批准。\n\
  \n发布项目章程标志着项目从“启动阶段”进入“规划阶段”。确保所有利益相关者都收到了章程的副本，或者可以从你的项目存储库访问它。安排一次会议来审查章程、回顾后续步骤并解决他们可能有的任何问题或疑虑也是一个好主意。\n\
  \n## 召开启动会议\n一旦项目章程获得签署并批准，你的下一次任务就是召开项目启动会议。会议应该包括赞助人、你的关键项目团队成员以及项目上的关键利益相关者。你希望在会议期间处理并讨论章程中的大部分章节。让每个人理解项目的目标和事领、项目描述、高级里程碑以及通用的项目方法至关重要。这份文档和第\
  \ 4 章涵盖的《项目范围说明书》是你当利益相关者试图引导你或团队偏离最初概述的路线时，你会反复参考的两份文档。我不是说利益相关者会故意这样做，但试图偷偷多增加一个功能或进行“就这一个微小改动”往往会出现在我工作过的大多数项目中。这些文档是你的安全网，也是防止失控请求的方法。项目赞助人签署章程，项目关键利益相关者签署项目范围说明书。这样，他们就不能说他们不知道了！\n\
  \n第 6 章“资源规划与管理”将更深入地讨论项目启动会议。\n\n### 总结\n总的来说，项目管理由五个过程组组成：启动、规划、执行、监控和控制以及收尾。每个过程组由各个过程组成，每个过程都有输入、工具和技术以及输出。\n\
  \n启动是项目开始的正式授权。它始于项目请求，该请求包含了业务理由（反过来包含了项目的目的或合理性），并概述了高级范围定义。启动过程的输出是项目章程。这份文档成为更详尽项目规划的基础。它应该包含项目的目的或合理性、项目目标、项目描述、高级需求、高级里程碑、高级预算、假设、约束、高级风险、赞助人名称、项目经理名称以及批准标准。\n\
  \n规划是创建许多项目过程和文档的过程，包括工作分解结构、项目进度表、预算、变更管理计划、沟通计划等。\n\n监控和控制涉及监控项目绩效，以确保交付物符合质量标准，确保风险处于控制之中，确保变更遵循适当的流程，并控制项目成本。\n\
  \n收尾是项目被接受并进行正式签署的地方。项目的最终产品、服务或结果被移交给组织的其他部门以供后续维护。经验教训在此被记录，资源被归还到各自的职能部门，合同被结项。\n\
  \n项目章程为项目的启动提供了正式批准，并授权项目经理将资源应用到项目上。项目赞助人是发布、签署和批准项目章程的人。\n\n## 考试要点\n**能够定义启动阶段。**\
  \ 启动授权项目开始。\n\n**能够定义规划阶段。** 该过程是创建大多数项目文档和过程的地方，包括进度表、工作分解结构、预算、沟通计划、采购计划等。这些文档被用作在剩余过程中管理项目的基础。\n\
  \n**能够定义执行阶段。** 项目的工作在执行过程中完成。这是产出交付物的地方。\n\n**能够定义监控和控制阶段。** 该过程监控项目的工作、交付物和输出，以判断是否存在与项目计划的偏差。在此过程中会采取纠正措施以使项目回到正轨。风险、问题、质量保证、变更和预算是此过程中监控的项目元素。\n\
  \n**能够定义收尾阶段。** 收尾是项目产品、服务或结果被接受并进行正式签署的地方。记录经验教训，释放资源，并结项合同。\n\n**能够描述项目章程并列出关键组件。**\
  \ 项目章程为项目的启动提供了正式批准，并授权项目经理将资源应用到项目上。关键组件包括项目的目的或合理性、项目目标和目的、项目描述、关键交付物、高级需求列表、高级里程碑、高级预算、高级假设、高级约束、高级风险列表、赞助人名称、项目经理名称以及批准标准。\n\
  \n## 关键术语\n在参加考试之前，确保你熟悉以下术语：\n\n*   假设 (assumptions)\n*   收尾 (Closing)\n*   约束\
  \ (constraints)\n*   交付物 (deliverables)\n*   执行 (Executing)\n*   启动 (Initiating)\n\
  *   迭代 (iterative)\n*   里程碑 (milestones)\n*   监控和控制 (Monitoring and Controlling)\n\
  *   规划 (Planning)\n\n\n\n\n\n* `project charter` (项目章程)\n* `project description`\
  \ (项目描述)\n* `requirements` (需求)\n* `triple constraints` (三重约束)\n\n## 复习题\n\n1. `Initiating`（启动）阶段包含哪些任务？\n\
  \    1. 为项目团队成员分配工作\n    2. 安排项目活动的顺序\n    3. 批准项目并授权开始工作\n    4. 协调资源以完成项目工作\n\n\
  2. 此人负责授权项目启动并签署 `project charter`。\n    1. 项目赞助人\n    2. 请求该项目的组织高管\n    3. 项目支持者\n\
  \    4. 项目经理\n\n3. 质量保证、性能衡量与报告以及变更控制都属于哪个过程？\n    1. 收尾\n    2. 计划\n    3. 执行\n\
  \    4. 监控与控制\n\n4. 项目经理的主要职责包括向此人告知有关项目的变更、状态、冲突和问题。\n    1. 项目请求者\n    2. 项目赞助人\n\
  \    3. 项目支持者\n    4. 影响最大的项目利益相关者\n\n5. 以下哪些活动发生在 `Planning`（计划）阶段？选择三个。\n    1.\
  \ 高级范围定义\n    2. 预算\n    3. 业务案例\n    4. 进度表\n    5. 变更控制\n    6. 资源\n\n6. `Closing`（收尾）阶段处理以下哪些内容？选择三个。\n\
  \    1. 项目验收\n    2. 教训总结\n    3. 治理过程\n    4. 变更控制收尾\n    5. 实施集成计划\n    6. 交付物验证\n\
  \n7. 以下哪些选项属于项目管理过程组中的过程？选择三个。\n    1. 风险\n    2. 启动\n    3. 监控与控制\n    4. 采购\n\
  \    5. 范围\n    6. 计划\n\n8. 该阶段是执行项目工作的阶段。\n    1. 计划\n    2. 监控与控制\n    3. 启动\n\
  \    4. 执行\n\n9. 关于 `project charter`，以下哪是正确的？\n    1. 描述项目进度\n    2. 包含每个任务的成本估算\n\
  \    3. 授权项目工作的开始\n    4. 列出项目选择委员会的职责\n\n10. 在 `project charter` 签署后，执行以下哪项操作？\n\
  \    1. 你应该召开项目启动会议。\n    2. 你应该编写项目范围说明书。\n    3. 你应该将请求和 `project charter` 提交给项目选择委员会。\n\
  \    4. 你应该制定项目进度表。\n\n11. 你刚刚定义了项目的重大事件，这些事件将用于确定和衡量整个项目的检查点，并确定项目是否准时。这些是什么？\n\
  \    1. 交付物\n    2. 目标\n    3. 里程碑\n    4. 任务\n\n12. 你的项目赞助人刚刚签署了 `project charter`。你举行了启动会议，团队中的每个人都急于开始项目工作。你发现自己很难阻拦他们，于是告诉他们你需要先开发工作分解结构、进度表和沟通计划作为开始。关于这一场景，以下哪项是正确的？\n\
  \    1. 你刚刚完成了 `Initiating`（启动）过程。\n    2. 你的团队想要直接进入 `Executing`（执行）过程。\n    3.\
  \ 项目生命周期的下一步是开始 `Planning`（计划）过程组。\n    4. 项目赞助人已经为项目批准了资源和资金。\n    5. 以上均对。\n\n\
  13. 识别 *不应* 包含在 `project charter` 中的项目。选择三个。\n    1. 高级预算\n    2. 项目目标\n    3. 高级成本效益分析\n\
  \    4. 需要的设备和资源\n    5. 业务案例\n    6. 项目描述\n    7. 高级风险列表\n\n14. 以下哪项描述了交付物和里程碑之间的区别？选择两个。\n\
  \    1. 里程碑用于衡量性能。\n    2. 交付物用于衡量性能。\n    3. 里程碑是为认为项目完成而必须完成的输出或结果。\n    4. 交付物是为认为项目完成而必须完成的输出或结果。\n\
  \n15. 这些项目在 `Initiating`（启动）阶段开发。选择三个。\n    1. 项目预算\n    2. 采购计划\n    3. 范围说明书\n\
  \    4. 业务案例\n    5. 高级范围定义\n    6. 高级风险\n\n16. Randy 是你项目的关键技术资源。你曾在过去的项目中与 Randy\
  \ 一起工作，并已确定他是将参与该项目的团队成员之一。章程已经发布，大家对这个项目感到非常兴奋。你安排在下周与 Randy 的职能经理面。这描述了哪种情况？\n\
  \    1. 风险\n    2. 假设\n    3. 交付物\n    4. 约束\n\n17. 从以下选项中，选择最能描述交付物定义的项。选择三个。\n\
  \    1. 标记项目阶段的完成\n    2. 具有可衡量的成果或结果\n    3. 是为认为项目完成而必须生产的特定项目\n    4. 描述详细特征\n\
  \    5. 记录在业务案例中\n    6. 是实体的且经过验证的\n\n18. 以下哪项 *不* 描述约束？\n    1. 项目团队的行为是受指令决定的。\n\
  \    2. 它可能涉及预算或进度。\n    3. 项目团队的行为受到限制。\n    4. 项目情况被认为是真实的。\n\n19. `project charter`\
  \ 的哪一个部分描述了产品的特征？\n    1. 里程碑\n    2. 交付物\n    3. 项目描述\n    4. 目标和目的\n\n20. 你的项目将在户外进行。你距离大活动只有四天，而飓风正向岸袭。这是以下哪项的例子？\n\
  \    1. 风险\n    2. 假设\n    3. 交付物\n    4. 约束\n\n# 第 4 章：创建工作分解结构 (WBS)\n\n### 本章涵盖的\
  \ CompTIA Project+ 考试主题\n\n* **1.6 给定场景，执行并开发项目进度表。**\n    * 工作分解结构\n* **2.1 给定场景，预测约束变量和影响因素对整个项目的影响。**\n\
  \    * 常见约束\n        * 预算\n        * 范围\n        * 交付物\n        * 质量\n        *\
  \ 环境\n        * 资源\n        * 需求\n        * 进度\n    * 影响\n        * 变更请求\n     \
  \   * 范围蔓延\n        * 约束重新排序\n        * 约束之间的相互作用\n        * 利益相关者/赞助人/管理层\n   \
  \     * 其他项目\n* **4.1 比较对比各种项目管理工具。**\n    * 图表\n        * 流程图\n\n现在你已经有了批准的项目章程，是时候讨论项目计划了。在很多情况下，我看到一旦项目获得批准，人们就想立即开始开展项目活动。普遍共识是：“谁有时间计划？我们需要启动这个项目！”\n\
  \n作为项目经理，你的职责是编写项目计划并确保每个人都理解该计划。项目协调将协助你准备计划，与参与项目的业务部门进行跨部门协调，并准备时间及资源进度表。\n\n\
  第一个讨论的计划主题是项目范围说明书。\n\n\n\n\n项目范围包含了构成项目产品或服务的所有组件，以及项目预期要产生的结果。范围规划将帮助你理解项目边界内包含哪些内容，哪些内容被排除在之外。\n\
  \n为了完成范围规划，你需要定义并记录三个范围组件：`范围管理计划`、`范围说明`和`工作分解结构`（`WBS`）。`范围管理计划`记录了将如何定义和验证项目范围，以及在整个项目生命周期内如何监控和控制范围。`范围说明`通过记录项目目标和交付物，为项目提供了一个共同理解。范围的最后一个组件是`工作分解结构`，它将项目交付物分解为更小的组件，你可以通过这些组件来估算任务时长、分配资源并估算成本。\n\
  \n## 编写范围管理计划\n\n`范围管理计划`描述了项目团队将如何定义项目范围、验证项目工作以及管理和控制范围。`范围管理计划`应包含以下要素：\n\n*\
  \ 你将用于准备`范围说明`的流程\n* 用于创建、维护和批准`工作分解结构`的流程\n* 关于如何验证交付物准确性的定义以及以及验收交付物的流程\n* 控制范围变更请求的流程描述，包括请求变更的程序以及如何获取变更请求表\n\
  \n`范围管理计划`最重要的要素之一——变更请求流程，将帮助你克服每个项目经理在某个时候都会遇到的噩梦——`范围蔓延`。`范围蔓延`涉及在未获得批准的情况下更改项目或产品范围，并且没有考虑这些对项目进度、预算和资源的影响。该术语通常用于描述那些似乎不断进入项目的变更和增加，以至于你发现自己不再管理同一个项目。`范围蔓延`通常随着时间的推移以小增量的形式发生。这里发生一次微小变化，那里增加一点点新内容，转眼之间你就发现项目的整体目标已经发生了。当然，防止`范围蔓延`的解决方案是拥有一个变更请求计划。\n\
  \n在大多数项目中，范围变更是不可避免的。处理范围变更的关键是在`范围管理计划`中描述你将如何处理它。\n\n如果项目团队在规划过程中早期定义了基本的范围管理框架，那么每个团队成员都有一个参考点，以便与利益相关者进行沟通——当`范围说明`获得批准后，利益相关者可能会带着“他们忘记提到的事情”来找他们。参与项目的每个人都需要理解，在实施阶段设定的规则必须被遵守，才能对项目范围提出任何变更请求。如果没有记录计划，你很快就会发现相关方正在直接与团队成员交流，变更正在你的控制之外发生。可以理解，团队成员会想要尝试满足客户的需求。但如果不对这些变更的影响进行分析，增加\
  \ 10 个或 20 个微小的范围变更可能会让你的进度或预算或两者都面临危险。\n\n### 编写范围说明\n\n`范围说明`包含了构成项目产品或服务的所有组件，以及项目预期要产生的结果。尽管这听起来简单直接，但定义不当的`范围说明`会导致错过截止日期、成本超支、士气低落以及客户不满。良好的范围规划有助于确保完成项目所需的所有工作都得到了定义、一致并清晰的记录。\n\
  \n`范围说明`建立在你在项目章程中记录的高级范围定义之上，并对其增加了详细信息。根据项目启动过程中完成的工作的详细程度，`范围说明`还可能包括对产品更详细的分析、额外的成本效益分析以及对备选方案的审查。你还可能发现，范围规划所需的大部分工作已经在业务计划书和项目章程文件中完成并记录。如果是这样，那么恭喜——你现在领先了一步。\n\
  \n`范围说明`的目的是记录项目目标、交付物以及产生交付物所需的工作。它随后被用于在执行过程中指导项目团队的工作，并作为未来项目决策的依据。`范围说明`是项目团队与项目客户之间的协议，明确说明了项目工作将产生什么。简单来说，`范围说明`告诉所有关注项目的人，在工作完成后他们将具体得到什么。任何未在`范围说明`中记录的重大交付物、特性或功能都不属于项目的一部分。关于`范围说明`中应该包含什么没有硬性规定。它可以根据项目的复杂性达到任何所需的详尽程度。通常情况下，`范围说明`包括项目目标、项目描述、验收标准、关键交付物、成功标准、范围范围排除项、时间和成本估算、项目假设和约束条件。第\
  \ 3 章详细涵盖了其中一些项目。让我们接下来来看其他项目。\n\n### 项目目标\n\n目标描述了项目希望实现的总体目标。目标应该是可衡量且可验证的，并且通常是时间限制的。例如，你可能为整个项目或项目的某些关键目标设定一个最终完成日期。你可以重用在项目章程中记录的目标和目标。如果在撰写章程后获取了关于目标的新的或更详细的信息，请确保将其包含在这里。\n\
  \n### 项目描述\n\n项目描述描述了你通过该项目创建的产品或服务的主要特征。再次，你可以重用在项目章程中记录的项目描述，并在其中添加更多细节。\n\n如果你的项目结果是一个实体产品，你还应该在此处包含产品描述。`产品描述`描述了特性、功能并解释了产品的主要特征。\n\
  \n### 验收标准和关键性能指标\n\n`验收标准`包含了你用于判断交付物是否完成并符合预期的流程和标准。\n\n最终验收标准描述了你如何判断整个项目是否完成并符合预期。\n\
  \n`关键性能指标 (KPI)`帮助你判断项目是否按计划进行，以及交付物是否符合预期。KPI 被定期监控，并提醒你必须采取行动以回到正轨。KPI 的一个示例可能是指定交付物必须符合某些性能吞吐量衡量。\n\
  \n### 关键交付物\n\n正如你记得的，交付物是衡量的成果、可衡量的结果或为了认为项目或项目阶段完成而必须产生的特定事项。范围文档中识别的交付物应该是具体的且可验证的。\n\
  \n### 范围排除项\n\n范围排除项是指任何不属于项目交付物或工作的内容。记录范围排除项是非常重要的，以避免在产品完成后对特性或交付物产生误解。\n\n\n\
  \n\n根据组织的不同，你可能会遇到需要提供时间和成本估的范围说明模板。在本节中，你将提供关于完成所有工作所需时间的估算，以及对项目成本的高级估算。这些将是基于相似项目的实际持续时间和成本，或根据熟悉项目工作的人员的专家判断得出的\
  \ `order-of-magnitude`（数量级）估算。数量级估算通常跨度很大，在项目这一阶段并不要求是精确的估算。\n\n### 假设\n\n你可能在第\
  \ 3 章中记得，假设是一个被认为是真的的、条件或事件。如果这些假设没有被记录并被利益相关者和项目团队成员清晰理解，它们可能会给你带来麻烦。你可能认为某些事情是显而易见的，但如果没有写下来，其他团队成员或利益相关者很可能对该事持有不同意见。假设必须经过记录并验证。\n\
  \n约束和影响因素是范围说明的最后一个元素。它们本身是独立的话题，因此你将在下一节查看它们。\n\n### 约束与影响\n\n范围说明的最后一部分是约束和影响因素列表。记住，约束是指任何限制或规定项目团队行动的因素。影响因素可能会带来约束，或影响现有的约束。每个项目都面临着时间、预算、范围或质量方面的潜在约束。从任何项目的开始，这些领域中至少有一个是受限的。如果你正在开发一个上市窗口很短的新产品，时间将成为你的主要约束。如果你有固定预算，资金将是约束。如果时间和资金都受到限制，质量可能会受到损害。\n\
  \n任何预定义的预算或强制性的完成日期都需要纳入任何关于项目范围的讨论中。如果时间或预算受到限制，范围将受到影响。随着项目的进展和对范围变更的请求，范围可能会变成一种约束，反过来驱动时间、成本或质量的变动。\n\
  \n### 约束\n\n根据 CompTIA 的说法，以下是许多项目中常见的约束：\n\n* 预算\n* 范围\n* 交付物\n* 质量\n* 环境\n* 资源\n\
  * 需求\n* 进度\n\n你接下来将查看这些每一项。\n\n### 预算\n\n我从未经历过预算不是 `not` 约束条件的项目。所有项目都有有限的资金来执行工作或购买完成项目所需的服务。在整个项目过程中，必须监控和控制项目成本，以确保你处于预算之内。与你的赞助人和关键利益相关者合作，在规划过程的尽早确定项目预算。\n\
  \n#### 范围\n\n在章的早期部分，你发现范围描述了项目交付物，并概述了交付物以及项目成功的预期和验收标准。范围是一种约束，因为它规定了项目团队在履行交付物方面的行动。如果你执行了除履行范围说明中列出的交付物之外的其他工作（是的，那个可怕的范围蔓延问题），你就手握了一个失控的项目，并且可能获得成功的结果。\n\
  \n### 交付物\n\n正如之前讨论的，交付物是可衡量的成果、可衡量的结果或为了认为项目（或项目阶段）完成而必须产生的特定。交付物应该是具体的且可验证的。交付物是约束，因为特定的需求或可衡量的结果驱动（或限制）了项目团队的行动。\n\
  \n#### 质量\n\n质量涉及衡量或量化性能、交付物、功能、规格等。质量保证在规划过程中定义，并在整个项目期间进行衡量和控制。例如，如果质量标准要求交付物重量为\
  \ 9 盎司或以上，那么重量为 7.5 盎司的交付物将不符合质量标准。\n\n#### 环境\n\n环境在许多情况下都可以成为一种约束。天气是一个可以作为约束的环境因素，澳大利亚内陆或南极的恶劣条件也是如此。环境约束还可以包括空气质量或水质标准（例如），或排放法规。了解任何可能限制或规定团队行动的环境因素是关重要的。\n\
  \n#### 资源\n\n资源范围从人力资源到材料、设备、资金等等。当资源稀缺、可用性有限或无法按时交付时，资源就会成为一种约束。你的组织可能没有资金、技术、设备或具备所需技能的人力资源来在要求的时间范围内完成交付物；因此，资源变成了一种约束。\n\
  \n### 需求\n\n需求描述了为了满足项目需求而必须满足的目标或交付物的特征。需求还可能描述了为了满足范围说明中记录的交付物而必须产生的结果或成果。\n\n\
  #### 进度\n\n进度是另一个存在于几乎所有项目中的约束。和预算一样，我从未荣幸参与过一个没有时间约束的项目。约束可以采取几种形式。它可以由你的高管理层设置的截止日期。也可能由项目外部力量驱动。例如，夏季奥运会必须在夏季月份举行。也许你项目需要的某种资源在\
  \ 4 月、9 月和 10 月期间不可用。那么进度就变成了一种约束，因为你必须在他们的可用窗口内完成你项目的交付物。再次，与你的项目赞助人和关键利益相关者合作，在项目尽早阶段确定他们对交付物截止日期、项目完成日期以及其他可能被禁止的时间段或日期的预期。\n\
  \n### 影响\n\n影响是指那些可能影响或改变现有约束，或可能带来新约束的因素。根据 CompTIA 的说法，以下是常见的影响：\n\n* 变更请求\n*\
  \ 范围蔓延\n* 约束重新排序\n* 约束之间的相互作用\n* 利益相关者/赞助人/管理层\n* 其他项目\n\n你接下来将查看这些每一项。\n\n### 变更请求\n\
  \n变更请求可能会影响现有的约束或为项目带来新的约束。例如，如果你的项目已经受到时间限制，而利益相关者刚刚批准的变更请求更改了项目截止日期，那么进度约束就受到了影响。\n\
  \n### 范围蔓延\n\n我提了很多范围蔓延。你必须通过建立的变更管理程序来控制范围的变更，以确保项目的成功。你将在第 9 章中学习更多关于变更管理的内容。\n\
  \n#### 约束重新排序\n\n重新排序约束可能会改变它们对项目的影响或作用。例如，假设你项目的首要约束是进度，因为你有一个项目赞助人要求的截止日期。让我们假设公司正经历一些财务困难，你刚刚获知项目预算被削减了。预算的削减如此巨大，以至于它现在变成了你项目的主要约束。\n\
  \n#### 约束之间的相互作用\n\n\n\n\n\n约束之间的交互示例可能发生在你对范围进行更改，而更改反过来影响了进度和/或预算的情况下。范围可以通过正式的变更控制过程或通过范围蔓延（scope\
  \ creep）发生变化。也许你的项目赞助人决定，为了满足项目的总体目标和目的，你需要额外的交付物。这会在正式的变更请求过程中获得批准。然而，范围的变更需要进度的调整，而且通常还需要预算调整。这里的交互就像多米诺骨牌效应，应该重新检查所有约束，以确保它们仍然准确地反映项目状况。这种交互还可能导致约束的重新排序。\n\
  \n### 利益相关者、赞助人和管理层，天呐\n\n项目赞助人和高级管理层以随时改变项目优先级而臭名昭著。今天他们想要交付物 A；明天他们想要交付物 Z。这是一个不断变化的目标！他们有时也会对项目失去兴趣。新项目在组织中的重要性可能会增加（或减少），导致你的项目发生变化，从而带来新的约束或改变现有的约束。例如，如果你的项目受时间限制，而另一个更重要的项目出现，你可能会向新项目失去资源或预算，这将为你的项目带来新的约束。根据我的经验，对项目约束最大的单一影响是赞助人和管理层改变了他们的优先级。\n\
  \n### 范围说明的批准\n\n一旦你完成了范围说明，下一步是与你的项目团队进行评审会议，以确保每个人达成共识，并且没有未解决的问题或缺失的信息。\n\n下一步是将范围说明提交给所有利益相关者，包括项目赞助人和客户。在范围说明的后面附上一份签署和批准表，并留出足够的签名行给赞助人和项目的每个主要利益相关者。他们对该文档的批准确保了他们对项目范围的认可，并且在开展任何项目工作之前应该获得此批准。\n\
  \n## 记录需求\n\n你可能还记得第 3 章，需求描述了为了满足项目需求而必须满足的目标或交付物的特征。需求可能还描述为了为了合同、规范、标准或其他项目文档而必须产生的结果或成果。需求量化并优先考虑了项目赞助人和利益相关者的愿望、需求和期望。\n\
  \n需求定义可以是范围说明的一部分，也可以是一个独立的文档，取决于项目的规模和复杂性。根据我的经验，对于小型项目，使用范围说明来记录需求很好。\n\n接下来你将仔细查看需求。\n\
  \n### 需求分类\n\n需求分为几类。充分理解需求之间的差异对你编写需求文档很有帮助。你的利益相关者并不知道其中的区别，并在讨论期望时会将业务需求与功能性及非功能性需求混淆。在较大的项目中，对需求进行分类是有帮助的，当你构建工作分解结构（WBS）并在之后分配资源时，它们已经有了一定的组织性。\n\
  \n#### 业务需求\n\n组织的`business requirements`是履行项目的宏观结果，以及它们如何满足业务目标、战略和观点。业务结果可以是任何内容，从计划增加收入到减少整体支出、提高市场意识等等。\n\
  \n在记录业务需求时，有时使用流程图会有帮助。它分逐步展示了过程是如何运作的、在哪里需要做出批准或决策等。流程图在绘制业务流程时也有用。例如，`PMO` 可能有一个流程图，记录项目想法如何变成项目。它从一个项目想法开始，提交给选择委员会，然后返回\
  \ `PMO`，要么进入正式项目，要么将该想法归档或置于挂起状态。图 4.1 显示了一个简单的流程图。\n\n![“流程图从想法到项目，引导提交项目请求表单供项目选择委员会审查，由委员会批准或拒绝，最后归档项目请求等。”](img/c04f001.jpg)\n\
  \n**图 4.1` 示例流程图\n\n#### 功能需求\n\n`functional requirements`是产品运行所需的产特性。它们通常是行为性质的或性能导向的，也可能描述颜色、数量和其他规格等元素。例如，如果你正在设计一个新的烤面包机，一个功能需求可能是这样的：按下绿色按钮会将面包吐出，按下红色按钮将开始烤制。\n\
  \n行业或公司标准可能会影响你的功能需求。在我们烤面包机的示例中，也许行业标准规定厨房电器的电源线长度必须为 20 英寸或短。这个需求需要添加到需求文档中。你需要研究任何可能影响你需求的行业标准并记录它们，因为它们可能会影响活动时长或成本估算。\n\
  \n#### 非功能需求\n\n`non-functional requirements`描述了功能需求的特征。它们不是基于性能或行为的。例如，在烤面包机的示例中，一个非功能需求可能规定绿色按钮直径应为\
  \ 1.5 英寸，红色按钮直径应为 2 英寸。\n\n根据我的经验，利益相关者通常更准备好讨论功能需求而非非功能需求，所以请准备好问题列表。如果其他都失败了，问“为什么”和“什么”总是有效的。“为什么绿色按钮会停止烤面包机并弹出面包？”以及，“如果我同时按下绿色按钮和红色按钮会发生什么？”如果你的\
  \ `PMO` 有需求模板或清单，请在与客户小组的会议中使用它。\n\n### 需求文档\n\n正如我之前提到的，需求量化并优先考虑了项目赞助人和利益相关者的愿望、需求和期望，以实现项目目标。需求通常从高层开始，并随着项目的进展进一步定义或逐步演变。你必须能够跟踪、测量、测试和追踪项目的需求。你绝不希望在项目结束时发现自己没有方法验证需求。如果你无法衡量或测试需求是否满足了项目的业务需求，成功的定义将取决于利益相关者和团队成员的主观意见。\n\
  \n你为收集和定义需求付出了努力，你不希望这些努力付诸东。你会将学到的所有内容记录在需求文档或范围说明中。如果你的需求文档是一个独立文档，你应该至少包含以下元素：\n\
  \n*   项目的业务需求以及开展该项目的原因\n*   项目目标\n*   项目交付物\n*   需求\n\n一旦你记录了项目范围和需求，就可以开始制定工作分解结构了。接下来将查看这一点。\n\
  \n## 创建工作分解结构\n\n\n\n\n\n范围规划的最后一个元素是`工作分解结构 (WBS)`。`WBS` 是一个以交付物为导向的层级结构，定义了项目的所有工作。`WBS`\
  \ 的每一层都是对上一层的进一步分解。`分解 (Decomposition)` 是将高层交付物（以及 `WBS` 的后续每个层级）分解为更小、更易管理的工作单元的过程。一旦工作被分解到最低层，就可以建立时间估算、资源分配和成本估算。\n\
  \n`WBS` 是项目规划的基础基石之一。它将作为许多其他规划过程的输入。它也是估算活动持续时间、为活动分配资源、估算工作量以及创建预算的基础。由于 `WBS`\
  \ 通常以图形化形式显示，因此它是视觉化传达项目范围的一种极佳方式。它包含比范围说明更详细的交付物，并有助于进一步明确项目交付物的规模。\n\n## 分解主要交付物\n\
  \n`WBS` 的质量取决于是否有合适的团队成员参与其开发。你并不希望有一个庞大的团队来协助这一过程，但如果你能邀请一些经验丰富的团队成员参与，将会很有帮助。与职能经理合作，确保每个拥有项目主要交付物的业务部门都有代表参与。\n\
  \n`WBS` 通常使用树状结构图或大纲形式创建。树状结构可以使用软件创建、使用白板创建，或者使用画画板纸配合便利签（为 `WBS` 的每一层和每个组件准备便利签）。这允许你在处理过程中不断移动组件，并确保所有内容的顺序正确。\n\
  \n典型的 `WBS` 从项目本身位于顶层开始。下一层由主要交付物、项目阶段或支持主项目的子项目组成。从那里开始，每个交付物被分解成更小、更小的工作单元。任何\
  \ `WBS` 的最低层都被称为`工作包层级 (work package level)`。这是确定资源、时间和成本估算的层级。工作包被分配给团队成员或组织单元，用以完成与该工作相关的活动。\n\
  \n确保所有参与者都已审阅了项目章程、范围说明和需求文档，并对所有交付物都有清晰的理解。准备好这些文档的副本作为参考。在认为 `WBS` 完成之前，团队可能会经历多次构建的迭代。\n\
  \n图 4.2 是会议活动项目 `WBS` 的简略示例。\n\n![框图具有会议活动分支，用于定义会议会议、建立会议场地、建立演讲师征集流程等。](img/c04f002.jpg)\n\
  \n图 4.2 示例 WBS\n\n描述 `WBS` 的第二种方法是大纲形式。无论你如何描绘 `WBS`，`WBS` 中的每一层都应该有一个唯一的标识符。该标识符通常是一个数字，用于汇总和跟踪与\
  \ `WBS` 元素相关的成本、进度和资源。这些数字通常与公司的会计分类相关，用于按类别跟踪成本。这些数字标识符统称为`账户编码 (code of accounts)`。如果你取图\
  \ 4.2 中的示例并使用`账户编码` 将其转换为大纲形式，它看起来会像这样：\n\n```\n会议活动项目\n\n1. 定义会议会议。\n    * 1.1\
  \ 定义主题领域。\n    * 1.2 确定每个主题的会议数量。\n    * 1.3 确定每场会议的预计人数。\n2. 建立会议场地。\n    * 2.1\
  \ 研究可用酒店和会议空间并预留会议日期。\n    * 2.2 定义酒店订房程序。\n    * 2.3 将会议分配到宴会厅。\n3. 建立演讲师征集流程。\n\
  \    * 3.1 编写演讲师合同。\n    * 3.2 编写营销材料。\n4. 管理演讲师合同。\n5. 联系并让赞助商签约。\n```\n\n### 创建\
  \ WBS 的准则\n\n开始创建 `WBS` 有时可能让人感到无从下手。一旦你开始将交付物分解为更小的工作单元，就会忍不住立即将这些工作单元按逻辑顺序排列并开始为它们分配团队成员。你需要不断提醒小组，`WBS`\
  \ 的目的是确保每个交付物都得到识别（通常作为第 2 层元素），并从那里开始分解每个子交付物。这并不是将活动按逻辑顺序排序的过程，也不是确定前置或后续工作的过程。那将在制定项目进度计划时发生。现在，请关注交付物及其分解。\n\
  \n虽然没有完成 `WBS` 的唯一正确方法，但有一些技巧可以帮助你取得更大的成功。以下是在进入 `WBS` 会话之前与项目团队一起审阅的一些有用准则：\n\n\
  **招募知识型资源。** 不要为了节省时间尝试自己完成 `WBS`。如果你不是交付物的专家，你将会遗漏关键元素。你还希望团队成员参与这一过程，以便他们对项目工作产生“认同”，并看到实现成功结论所需的投入。在创建\
  \ `WBS` 时让知识丰富的团队成员参与，在传达项目内容方面比交给某人一个完成的 `WBS`要有效得多。\n\n**低层级的每项内容都是上一层的组件。** 完成\
  \ `WBS` 低层级的所有项目会导致高层级的完成。作为一个检查点，你应该审阅低层的项目，并询问团队完成这些项目是否会导致下一层高层组件的完成。如果这个问题的答案是否定的，那么你还没有识别出所有的低层任务。\n\
  \n**定义工作包层级。** 确保你将 `WBS` 分解到团队感到由于可以分配资源并对完成工作负责、且可以确定估算的层级。这是构建 `WBS` 的主要目标。排序、分配资源和估算都是你在\
  \ `WBS` 完成后将执行的独立活动。\n\n**不要创建待办事项。** 你不应该将工作组件分解为单个活动。否则，你将花费整个项目管理经验来管理工作包的各个清单和活动。被分配到工作包层级的人负责确定和管理组成工作包的所有活动。\n\
  \n**使用适当的层级。** 每个主要交付物可能会有不同的分解级别。`WBS` 的一部分有三层而另一部分有五层，这并不稀奇。你应该关注的是达到可管理的工作包，而不是平衡\
  \ `WBS`。如果你试图强制所有交付物具有相等数量的层级，最终会导致某些交付物分解得不够详细，而另一些则列出了完成简单任务的每个微小活动。\n\n### WBS\
  \ 的好处\n\n`WBS` 经常列为成功项目最重要的部分之一。正如你将在后面的章节看到的，`WBS` 是许多项目管理过程的输入。\n\n\n\n\n\nWBS\
  \ 是团队建设和团队沟通的极佳工具。主要项目交付物及其底层子组件的图形化表示让团队成员能够看到全局，并理解他们负责的部分在项目中的是如何定位的。特定工作包与主要项目交付物之间的直接链接也有助于明确对个人团队成员的影响。此外，当新资源被加入项目项目时，WBS\
  \ 可以帮助这些新团队成员快速进入状态。\n\n详细的 WBS 不仅能防止关键工作被忽略，还能帮助控制变更。如果项目团队对项目目标以及实现这些目标的路线了如如，他们就不可能陷入与项目范围无关的路径。我并不是说\
  \ WBS 会防止变化；在项目生命周期中几乎总是存在变化的。但 WBS 会明确某项请求是变更，而非原始项目范围的一部分。WBS 在讨论人员配置或预算时也有用。\n\
  \nWBS 是与客户和利益相关者沟通的极佳工具。人们在看到项目交付物图以及实现项目目标所需的子组件图之前，并不总是能理解项目的规模。在 WBS 上显示项目工作，将帮助你向项目团队和利益相关者传达在项目各个层面进行沟通、协调工作努力以及遵守项目范围的性。\n\
  \n### WBS 字典\n\nWBS 还有一个组成部分被称为 `WBS 字典`。这是记录 WBS 层级和工作组件描述的地方。这些是你应该在 WBS 字典中列出的某些元素：\n\
  \n* 账户代码标识符\n* 组件工作的描述\n* 负责完成组件的组织\n* 资源\n* 成本估算\n* 验收标准\n\n所有的 WBS 组件都应该列在字典中。这可以作为你和团队关于\
  \ WBS 的参考，并且应该让所有项目成员都能轻松访问。\n\n### 总结\n\n范围规划使用启动阶段的产出物——项目章程，来创建范围说明和范围管理计划。范围管理计划记录了你将使用的用于准备范围说明和\
  \ `WBS` 的过程，定义了如何验证交付物，以及控制范围变更请求的流程描述。\n\n范围说明是许多规划过程和未来变更决策的依据。它也是与客户和利益相关者设定项目边界的依据。范围说明包括产品描述、关键交付物、成功和验收标准、关键绩效指标、排除项、时间和成本估算、假设和约束。\n\
  \n需求描述了交付物的特征。它们可能还描述了交付物必须具备的功能，或交付物为了满足项目目标必须满足特定条件。它们通常是满足项目目标必须满足的条件，或项目产品或服务必须具备的标准。需求量化并优先考虑项目赞助者和利益相关者的想要、需要和期望。它们记录在范围说明或独立的需求文档中。需求类别包括业务、功能和非功能需求。\n\
  \n工作分解结构是通过从范围说明中提取主要交付物并将其分解为更小、更容易管理的组件创建的。这种分解持续通过多个层次，直到组件可以进行估算和分配资源。分解的最底层是工作包级。`WBS`\
  \ 包含了完成项目所需的所有工作。任何未列在 `WBS` 上的交付物或工作都被排除在之外。`WBS` 是项目规划的关键组件。`WBS` 是时间估算、成本估算和资源分配的依据。\n\
  \n`WBS 字典` 应列出 `WBS` 中包含的每一个交付物及其组件。它应该包括组件描述、账户代码标识符、责任方、估算、验收标准以及任何有助于明确交付物和工作组件的信息。\n\
  \n## 考试要点\n\n**描述范围管理计划的目的。** 范围管理计划记录了准备范围说明和 `WBS` 的程序，定义了如何验证交付物，并描述了控制范围变更请求的过程。\n\
  \n**理解范围说明的。** 范围说明是项目与客户之间关于项目工作组成部分的协议的依据。它定义了将实现这些目标的交付物和成功标准。\n\n**能够列出范围说明的组成部分。**\
  \ 范围说明包括项目描述、验收标准、关键交付物、范围排除项、假设和约束。它还可能包含完成项目的高级时间和成本估算。\n\n**能够定义需求。** 需求描述了交付物的特征，或交付物必须具备的功能，或交付物为了满足项目目标必须满足的特定条件。\n\
  \n**知道如何定义和创建工作分解结构。** `WBS` 是一种以交付物为导向的，描述了完成项目所需的工作。`WBS` 是一个多级图表，从项目开始，包括主要交付物，并将主要交付物分解为更小的工作单元，直到可以提供时间和成本估算并分配资源。\n\
  \n**理解 WBS 中的层级。** `WBS` 的最高层是项目名称。主要交付物、项目阶段或子项目组成下一层。`WBS` 的层级随项目而异；但 `WBS` 的最低层是工作包。\n\
  \n**描述 WBS 字典。** `WBS 字典` 描述了每个交付物及其组件，并在账户代码标识符、估算、资源、验收标准以及任何有助于明确交付物的信息。\n\n\
  ## 关键术语\n\n在参加考试之前，确保你熟悉以下术语：\n\n* 验收标准\n* 业务需求\n* 账户代码\n* 关键成功因素\n* 分解\n* 功能需求\n\
  * 关键绩效指标 (KPIs)\n* 非功能需求\n* 数量级\n* 产品范围描述\n* 蔓蔓\n* 范围管理计划\n* 范围说明\n* WBS 字典\n* 工作分解结构\
  \ (WBS)\n* 工作包级\n\n## 复习题\n\n1. 下列哪不是范围规划的关键组成部分？\n    1. 工作分解结构 (WBS)\n    2. 范围说明\n\
  \    3. 项目章程\n    4. 范围管理计划\n\n2. 范围说明提供了以下哪些内容？\n    1. 对项目产生共同理解以及做出未来项目决策的依据\n\
  \    2. 完成项目所需的所有资源的详细列表\n    3. 所有关键项目活动的进度表\n    4. 用于管理变更控制的流程\n\n3. 下列哪项是 WBS\
  \ 的特征？\n    1. 项目的成本中心结构，描述了项目工作以及完成交付物的每个工作组件的成本\n    2. 一个以交付物为导向的项目工作图表，其中分配情况显示了负责工作组件的项目团队\n\
  \n\n\n\n3. 一种以交付为导向的结构，描述了完成交付所需的详细任务\n4. 一种以交付为导向的结构，定义了项目的工作\n\n### 4. 哪些是范围说明的组成部分？请选择三个。\n\
  1. 项目通用方法\n2. 项目描述\n3. 假设和约束\n4. 排除项\n5. 利益相关者列表\n6. 高级里程碑\n7. 变更请求流程\n\n### 5.\
  \ WBS 是使用一种称为 `decomposition` 的技术创建的。什么是分解？\n1. 将资源与交付物匹配\n2. 将项目交付物拆分为更小、更容易管理的组件\n\
  3. 估计每个单独交付物的成本\n4. 为每个工作包创建详细的待办列表\n\n### 6. WBS 的最低层是什么？\n1. 工作包\n2. 第 5 层\n3.\
  \ 里程碑\n4. 活动\n\n### 7. 下列哪个描述了影响？\n1. 影响可以影响、改变或创建一个新的约束。\n2. 范围蔓延是影响的一个例子。\n3.\
  \ 变更请求是影响。\n4. 约束之间的相互作用是影响的一个例子。\n5. 以上所有\n6. A、B、D\n\n### 8. 下列哪个不是 WBS 的益处？\n\
  1. WBS 是团队建设的优秀工具。\n2. WBS 有助于防止关键工作被忽略。\n3. WBS 可以作为未来项目的模板。\n4. WBS 可用于描述如何验证交付物。\n\
  \n### 9. 关于账户代码（code-of-accounts）标识符，以下所有项均正确的，除了哪？\n1. 这些是 WBS 上每个组件的唯一数字。\n2.\
  \ 它们记录在 WBS 字典中。\n3. 它们与组织的会计体系挂钩。\n4. 它们被分配给与工作包层相关的资源。\n\n### 10. 你的团队已经为 ABC\
  \ 产品发布项目创建了 WBS。你正在启动该项目的第 2 阶段，即产品开发阶段。以下哪项可能出现在你项目 WBS 第二层的一个示例？\n1. ABC 产品发布项目\n\
  2. 项目交付物\n3. 项目阶段\n4. 活动\n\n### 11. 哪个元素不是范围管理计划的组成部分或功能？\n1. 描述交付物的验收标准\n2. 描述如何处理范围变更\n\
  3. 描述编制范围说明书的程序\n4. 描述编制 WBS 的程序\n\n### 12. 这涉及在不考虑其对项目进度、预算和资源影响的情况下，改变项目或产品范围。\n\
  1. 变更请求\n2. 范围蔓延\n3. 利益相关者/管理指示\n4. 质量缺陷\n\n### 13. 大多数项目都有三个主要约束。你的客户或项目赞助人将规定这三个中的哪个对他们最重要。大多数项目中常见的三个约束是哪三个？请选择三个。\n\
  1. 预算\n2. 团队成员\n3. 范围\n4. 质量\n5. 时间\n6. 赞助人和利益相关者\n7. 范围管理计划\n\n### 14. 你的项目正在进行，一位关键利益相关者提交了变更请求。经过进一步调查，你发现项目中也发生了一些范围蔓延。这些是哪项的示例？\n\
  1. 约束\n2. 假设\n3. 影响\n4. 依赖关系\n\n### 15. 哪个术语描述了范围规划（或其他规划）过程的特征？\n1. 循环\n2. 迭代\n\
  3. 持续\n4. 重复\n\n### 16. 你的项目接近第一阶段的完成。你该阶段的关键利益相关者提醒你，除非交付物恰好是 3 厘米，否则她将不接受。如果测量偏差，第\
  \ 2 阶段将延迟，整个项目将面临风险。这是哪项的示例？\n1. 验收标准\n2. 变更请求\n3. 范围稳定性\n4. 产品范围描述\n\n### 17. 未列在\
  \ WBS 上的项目元素被认为？请选择两个。\n1. 在项目未来阶段完成的工作\n2. 范围的排除项\n3. 它们被认为是范围蔓延\n4. 它们不被视为项目的一部分\n\
  5. 它们被认为是变更请求\n\n### 18. 你正在为一项客户请求制定范围说明书。客户想要的几个元素中可能很难实现，但在与项目团队协商后，你认为它们可以完成。这些元素没有包含在产品描述中。你应该怎么做？\n\
  1. 将这些元素包含在范围文档中，信任你的项目团队交付。\n2. 将这些元素包含在范围文档中，将其标记为关注点，并记录问题是如何解决的。\n3. 与项目赞助人和客户讨论这些问题元素。获得赞助人的签字。\n\
  4. 在范围说明书的排除项部分注明这些元素，并说明它们将包含在第 2 阶段。\n\n### 19. 当你分解 WBS 时，你发现一个未列在范围说明书需求部分的项。该需求对于项目的成功至关重要，因为它详细说明了你的团队必须遵守以完成交付物的行业标准测量。关于此场景，以下哪项是？\n\
  1. 这是一个约束的示例。\n2. 这是一个影响的示例。\n3. 这是一个假设的示例。\n4. 这是一个依赖关系的示例。\n\n### 20. 你正在为新项目制定范围说明书。你处于哪个项目阶段？\n\
  1. 启动\n2. 计划\n3. 执行\n4. 控制\n\n# 第 5 章\n## 创建项目进度\n\n本章涵盖的 COMPTIA PROJECT+ 考试主题包括\n\
  * **1.6 给定场景，执行并制定项目进度。**\n    * 进度安排\n        * 确定任务。\n        * 确定任务开始/结束日期。\n\
  \        * 确定活动/任务时长。\n        * 确定里程碑。\n        * 设置前置任务。\n        * 设置依赖关系。\n\
  \        * 任务排序。\n        * 任务划分优先级。\n        * 确定关键路径。\n        * 分配资源。\n     \
  \   * 设置基线。\n        * 设置质量门。\n        * 设置治理门。\n            * 客户签字\n          \
  \  * 管理批准\n            * 法律批准\n* **4.1 比较和对比各种项目管理工具。**\n    * 项目进度软件\n    * 图表\n\
  \        * 甘特图\n\n### 进度规划\n\n完成 WBS 后，你要开发的下一个计划文档是项目进度。与 WBS 一样，创建进度没有唯一正确的方法。在这里我概述了创建项目进度时通常遵循的步骤。在小型项目中，你通常会发现所有步骤在一个环节内完成，而较大的项目可能需要为每个步骤单独安排会议来完成进度，而且在从利益相关者和团队成员处收集信息时，你可能需要多次执行某些规划步骤。以下是我构建项目进度时通常遵循的步骤列表。\n\
  \n1. 确定任务。\n2. 任务排序。\n3. 分配资源。\n4. 确定任务时长，包括开始和结束日期。\n5. 确定里程碑。\n6. 构建进度。\n7. 确定关键路径。\n\
  8. 设置基线并获得批准。\n9. 设置质量门。\n\n\n\n\n\n# 10. 建立治理流程。\n\n乍看之下，制定计划似乎非常简单。你只需要将来自 `WBS`\
  \ 的工作包输入项目进度调度软件中，计划就生成了。然而，一个合理的项目计划需要大量的规划。必须识别所有任务，必须按照它们可以完成的顺序对它们进行排序，需要估算完成所需的时间范围和工作量，推导出资源分配，最后必须对所有这些信息进行逻辑组织，以形成整体项目计划。\n\
  \n计划记录了项目中所包含的每项任务的计划开始和结束日期，一旦计划完成，就可以计算出项目的总工期。一旦计划确定，检查计划将成为项目经理每周（甚至每天）例行工作的一部分，直到项目完成。进度将根据计划进行报告，并定期向利益利益相关者提供有关活动的状态更新。\n\
  \n如果你没有在开始阶段花时间创建一个准确的计划，你将在项目执行期间花费大量时间修改计划，并解释为什么交付物未能按预期完成。\n\n你可能需要几位领域专家来帮助你识别和估算任务并创建计划，而且提前告知可能需要多次会议才能最终确定计划是一个好主意。\n\
  \n### 定义任务\n\n开发项目计划的基础是定义完成项目交付物所需的任务列表。这是一个迭代过程，涉及将 `WBS` 工作包进一步分解为单个任务。在小型项目中，由于你正在分解\
  \ `WBS`，将工作包分解为具体的活动是一个自然的发展过程，因为房间里有所有合适的人，而且你正处于势头上。记住，任务不会记录在 `WBS` 上，但它们会列在项目计划中。\n\
  \n让分配到工作包层级的团队成员参与任务定义很有帮助。他们的专业知识不仅可以帮助你定义任务，还可以帮助你分配资源并确定任务估算。我对于大多数项目常用的一个良好经验是：将任务定义完成需要\
  \ 40 到 80 小时的层级。如果你有一个持续时间短于此的关键任务，或者是一个非常小的项目，你可能想对此破例。\n\n你希望将定义的每项活动列在`活动列表`或`任务列表`上。此列表应该包含完成项目工作所需的每项活动，以及一个标识符或代码，以便你独立地跟踪每项任务。列出该活动相关的\
  \ `WBS` 代码以及对工作的简短描述也是良好的做法。\n\n一旦你定义了所有任务，就可以开始按照它们将执行的顺序将它们安排起来了。\n\n## 任务排序\n\
  \n`Sequencing`（排序）是识别项目活动之间的依赖关系并按正确顺序对其排序的过程。首先，你需要识别依赖的类型，然后需要确定活动之间的特定关系。\n\n\
  `Dependencies`（依赖）是活动之间的关系。例如，某活动可能在另一个活动完成之前无法开始，或者可能一个活动依赖于另一个活动先开始才能完成。让我们来看几种类型的依赖关系。\n\
  \n### 依赖的类型\n\n有四类依赖关系：\n\n*   强制性依赖（Mandatory dependencies）\n*   选择性依赖（Discretionary\
  \ dependencies）\n*   外部依赖（External dependencies）\n*   内部依赖（Internal dependencies）\n\
  \n`mandatory dependency`与所执行的工作类型直接相关。例如，电力公用设施小组在挖完沟沟之前无法为新住宅区铺设电缆。\n\n`optional\
  \ dependency`由项目管理团队定义，通常由流程或程序驱动，并可能包含最佳实践技术。例如，在进行项目工作之前，需要对规划文件进行审批和签字的流程。\n\n\
  `external dependency`是项目任务与项目外部某些因素之间的关系，这些因素驱动了该任务的调度。例如，新服务器的安装取决于供应商何时能交付设备。\n\
  \n`internal dependency`是单个项目内部任务之间的关系，因此受项目团队的控制。\n\n了解你正在处理的哪种依赖类型很重要，因为对于选择性依赖，你可能比强制性依赖具有更大的灵活性。这种区别在你以后寻找缩短计划并在更短的时间内完成项目时会变得重要。\n\
  \n### 逻辑关系\n\n仅仅知道两个活动之间存在依赖关系是不够的。你还需要回答其他几个问题：依赖关系如何影响每项活动的开始和结束？是否有一个活动必须先开始？你可以在第一个活动完成之前开始第二个活动吗？所有这些变量都会影响你的整体项目计划的状况。\n\
  \n一旦你确定了两个活动之间的依赖关系，你就需要确定这种逻辑关系是什么，以便正确对活动进行排序。在介绍这些关系之前，我将介绍几个与理解任务依赖的关键术语。\n\n\
  `predecessor`（前置）活动是指位于另一个活动之前的活动。`successor`（后继）活动是指位于问题活动之后的活动。图 5.1 显示了活动 A 和活动\
  \ B 之间简单的前置/后继关系。\n\n![框图显示了活动 A 和活动 B 之间的前置/后继关系。](img/c05f001.jpg)\n\n图 5.1 前置/后继关系\n\
  \n前置活动和后继活动之间可能存在四种`logical relationships`。理解这些关系将帮助你判断是否可以并行安排活动，或者一个活动必须等待前置任务完成。逻辑关系如下：\n\
  \n**完成-开始 (Finish-to-start, FS)**：在完成-开始的关系中，在前置活动完成之前，后继活动无法开始。这是最常用的逻辑关系，也是大多数项目进度调度软件的默认设置。\n\
  \n**开始-结束 (Start-to-finish, SF)**：在开始-结束的关系中，前置活动必须在后继活动结束之前开始。这种关系很少使用。\n\n**完成-完成\
  \ (Finish-to-finish, FF)**：完成-完成的关系是指前置活动必须在后继活动结束之前完成。\n\n**开始-开始 (Start-to-start,\
  \ SS)**：在开始-开始的关系中，前置活动必须在后继活动开始之前开始。\n\n一旦确定了活动依赖关系，你的下一步是创建网络图。\n\n### 创建网络图\n\
  \n项目经理用于活动排序的一种技术是使用网络图。理解活动关系是使用这种技术的基础。`network diagram`描绘了项目活动以及这些活动之间的相互关系。网络图是与项目团队开发的一个极佳工具。使用白板并在每张贴纸上标记一个活动。这将易于查看工作流，而且你可以移动贴纸来做出更改。\n\
  \n\n\n\n\n最常用的网络图绘制方法是`precedence diagramming method (PDM)`。`PDM` 使用框来表示项目活动，并用箭头连接这些框以显示依赖关系。图\
  \ 5.2 显示了一个具有完成-开始依赖关系和任务持续时间的简单 PDM 网络图。\n\n![框图显示：开始指向任务 A：3 天，指向任务 B：2 天，指向任务\
  \ C：10 天，指向任务 D：15 天，指向任务 E：持续 3 天后结束。](img/c05f002.jpg)\n\n**图 5.2** 优先网络图法\n\n\
  现在活动已经根据其逻辑依赖关系进行了排序，你准备好为活动分配资源，并估算完成每个活动所需的时间了。\n\n### 分配资源\n\n项目进度计划中的资源通常指执行任务的人力资源和/或咨询或承包资源。正如我之前提到的，在编制进度计划时，让工作包级的所有者在场是一个好主意，因为他们通常是执行任务的团队的主管。他们应该一眼就能看出将团队中的哪个人分配到任务中。他们通常在自己的领域足够专业，能够确定任务的估算以及以及和结束日期。当一个工作包内有多个任务时，最好让分配给这些任务的资源来确定持续时间的估算。\n\
  \n在分配资源时，另一个有用工具是资源日历。`resource calendar`描述了资源可用的时间范围。它定义了特定的资源或资源组，并可能包括他们的技能、能力、数量以及可用性。可能你的项目需要一名营销人员，而分配到营销活动的人在\
  \ 10 月正在休长假。资源日历将显示此人的休假计划。资源日历还会检查可能影响项目进度的设备和材料资源的数量、能力和可用性。例如，假设你的项目需要一台液压钻，而你的机构仅拥有一台。资源日历将告诉你，在你的项目需要它的同时，它是否已经安排了其他工作。\n\
  \n## 确定任务持续时间\n\n确定任务持续时间是构建项目进度计划的下一步。持续时间估算可以像专家根据经验给出的合理估算那样简单，也可以是一个涉及技术和计算以制定估算的复杂过程——尽管这些估算大部分仍然基于专家意见。\n\
  \n在解释你可以用于完成任务持续时间估算的某些技术之前，让我们确保我们对活动持续时间有共同的理解。\n\n### 定义持续时间\n\n当你估算持续时间时，你需要确保你查看的是完成活动所需的总累计时间。例如，假设你有一个任务，根据每天八小时的工作日计算预计需要五天完成。你为此任务分配了一名全职资源，但他们每天只有四个小时处理该任务。这意味着该任务的实际持续时间估算为\
  \ 10 天。\n\n你还需要意识到工作日和日历日之间的区别。如果你的工作周是周一到周五，而你有一个从周四开始的四天任务，那么该任务的持续时间将是六日历日，因为周六和周日不进行工作。图\
  \ 5.3 说明这种情况。。的概念也适用于假期或休假。\n\n![框图显示从周一到周日的 6 个日历日，其中周一、周二、周四和周五为四个工作日。](img/c05f003.jpg)\n\
  \n**图 5.3** 被周末隔开的四天任务\n\n现在我们对持续时间有了共同理解，我将讨论用于创建持续时间估算的不同技术。\n\n### 估算技术\n\n你可以可以使用技术来确定任务持续时间估算。你将查看最常用的方法。\n\
  \n**类比估算** `Analogous estimating` 也称为`top-down estimating`，是一种使用之前项目中类似任务的实际持续时间的技术。这最常用于项目规划的早期阶段，此时你对项目的信息非常有限。虽然类比估算可以提供任务持续时间的良好近似值，但它通常是获取估算准确性最低的方法。没有两个项目是相同的，而且存在一种风险，即用于获取类比估样的项目并不像看起来与当前项目相似。\n\
  \n如果估算的人熟悉这两个项目，并能够理解可能影响新项目活动持续时间的差异，那么类比估算的结果会更准确。\n\n**专家判断** `Expert judgment`\
  \ 是一项由最熟悉工作的人来确定估算的技术。理想情况下，执行该任务的项目团队成员应该提供估算。如果尚未确定所有的团队成员，请招募对你需要估算的任务具有专业知识的人。请那些在之前的项目中完成过类似任务的人协助对此项目进行估算。\n\
  \n记住，经验更丰富的人对活动给出的估算可能比没有那么多经验的人要短。你应该对估算进行验证，或者让部门的其他专家为你进行验证。\n\n**参数估算** `Parametric\
  \ estimating` 是一种基于定量的估算方法，它将工作量乘以速率。要应用基于定量的持续时间，你必须知道执行任务的资源的生产率，或者有一个可以应用于相关任务的公司或行业标准。持续时间通过产生的工作单位乘以生产率获得。例如，如果一个典型的电缆小组每天可以埋设\
  \ 5 英里的电缆，那么埋设 50 英里的电缆需要 10 天。\n\n**PERT** `Program Evaluation and Review Technique\
  \ (PERT)` 是美国海军在 20 世纪 50 年代开发的一种方法。当时海军正在执行历史上最复杂的工程项目之一——极星导弹计划，需要一种方法以极高可靠性管理项目并预测项目进度。PERT\
  \ 正是为了这一目的而开发的。\n\nPERT 和三点估算是相似的技术。区别在于，三点估算使用平均估算来确定项目持续时间，而 PERT 使用所谓的`expected\
  \ value`（或加权平均值）。期望值使用活动持续时间的三点估算计算，然后找到这些估算的加权平均值。\n\n计算期望值的公式如下：\n\n```\n(乐观 +\
  \ 悲观 + (4 × 最可能)) / 6\n```\n\n使用与三点估算相同的数字会产生以下期望值：\n\n```\n(7 + 14 + (4 × 10))\
  \ / 6 = 10 天\n```\n\nPERT 图是网络图的另一种形式。节点（通常是矩形）表示里程碑，线条表示任务序列，线条附近的数字代表任务的持续时间。图\
  \ 5.4 显示了一个简单的 PERT 图。\n\n![框图显示：开始指向任务 A：3 天，指向任务 B：2 天，指向任务 C：10 天，指向任务 D：15 天，指向任务\
  \ E：持续 3 天后结束。](img/c05f004.jpg)\n\n**图 5.4** 示例 PERT 图\n\n记住，大多数项目经理使用某些估算技术的组合来确定任务持续时间。\n\
  \n\n\n\n\n既然你已经知道了任务的持续时间和依赖关系，就可以为每个任务建立开始日期和结束日期，并构建项目进度。我们接下来将介绍这一点。\n\n## 创建项目进度\n\
  \n创建进度涉及你到目前为止完成的所有工作，包括定义任务、排序任务以及确定持续时间估算。现在，你把这些信息输入进度中，并为每个项目活动建立开始日期和结束日期。让我们来看一个例子。你的项目涉及粉刷房屋。其中一个任务是刮掉墙上的旧漆。另一个任务是在墙上涂新油漆，另一个任务是粉刷装饰线条。在刮漆完成之前，你真的不应该涂新油漆。这意味着刮漆任务是涂漆任务的前置任务。而且涂漆任务必须在刮漆完成后才能开始（FS\
  \ 关系）。根据提供这些任务估算的专家介绍，你知道刮漆任务需要两天，涂漆需要五天。如果刮漆从 6 月 1 日（周三）开始，刮漆应该在 6 月 2 日（周四）结束。6\
  \ 月 1 日和 6 月 2 日整天都用于刮漆。这意味着涂漆可以在 6 月 3 日（周五）开始。油漆工在周六工作，但周日休息。如果这是一个为期五天的任务，涂将在将在\
  \ 6 月 8 日（周三）完成。这两个任务的总持续时间为八天（包括油漆工不工作的周日）。\n\n可能需要多次迭代才能确定最终进度。一旦进度获得批准，它将作为项目的进度基准。一旦你开始项目工作，将使用此基准来跟踪实际进度与计划的对比。\n\
  \n在创建进度之前，让我们重新回顾里程碑以及它们如何与项目进度相互作用。\n\n### 里程碑\n\n里程碑通常是项目的重大成就，标志着主要交付物的完成或项目中的其他关键事件的发生。例如，项目交付物的批准和签字可能被视为里程碑。其他示例可能包括原型的完成、功能测试、合同批准等。在项目进度表中，里程碑通常表示为一个一旦与该里程碑相关的所有交付物完成后即可实现的事件，且其持续时间为零。\n\
  \n里程碑图是显示进度信息的一种方法。里程碑图跟踪主要里程碑的计划日期和实际完成日期。表 5.1 显示了一个里程碑图示例。作为项目经理，你应该密切关注里程碑日期，因为它们也是沟通的触发器。当主要交付物完成或项目成功移动到新阶段时，需要通知利益相关者。如果未能达到这些日期，你需要沟通当前状态、将项目带回正轨的计划以及新的里程碑日期。\n\
  \n| 里程碑 | 计划开始日期 | 实际开始日期 | 计划完成日期 | 实际完成日期 |\n| --- | --- | --- | --- | --- |\n\
  | 范围说明签字 | 12/18 | 12/18 | 12/18 | 12/18 |\n| 合同签字 | 2/02 | 2/02 | 2/02 | 2/02 |\n\
  | 交付物 1 验收 | 3/05 | 3/05 | 5/31 | 6/07 |\n| 交付物 2 验收 | 3/15 | 4/01 | 6/30 | 7/15\
  \ |\n| 测试完成 | 7/01 | 7/16 | 7/31 | 8/16 |\n| 项目验收和签字 | 8/10 | 8/20 | 8/10 | 8/20\
  \ |\n\n**表 5.1**](#c05.xhtml_tableanchor5-1) 示例里程碑图\n\n### 显示进度\n\n项目管理软件是一种可以在你创建进度时为你节省大量时间的工具。你可以输入任务、持续时间和/或开始和结束日期；分配资源；并生成项目的图形化表示。显示项目进度最常见的方法是`甘特图`。\n\
  \n甘特图可以显示里程碑、交付物以及项目的所有活动，包括它们的持续时间、开始和结束日期以及分配给任务的资源。甘特图通常使用跨时间轴的水平条形图格式显示任务。我认识一些项目经理仅使用电子表格就为小项目构建了甘特图。图\
  \ 5.5 显示了一个甘特图示例。\n\n![甘特图，横轴为 4 月至 7 月的 Act 任务，跨时间轴有代表任务的水平条形。](img/c05f005.jpg)\n\
  \n**图 5.5**](#c05.xhtml_figureanchor5-5) 甘特图\n\n如果你在图的框中添加日期和持续时间，网络图也可以用于显示项目进度。\n\
  \n### 关键路径法\n\n进度开发中最广泛使用的技术之一是`关键路径法 (CPM)`。CPM 通过计算每个任务的最早开始日期、最早完成日期、最晚开始日期和最晚完成日期，来确定进度中每个活动的`浮动时间\
  \ (float time)`。浮动时间是你可以推迟活动最早开始时间而不延迟项目结束的时间。具有相同早期/后期开始日期以及相同早期/后期完成日的任务浮动时间为零，被认为是关键路径任务。如果关键路径任务没有按计划完成，项目结束日期将受到影响。\n\
  \n`关键路径`是项目上最长的路径。如果你参考`图 5.2](#c05.xhtml_figure5-2)`，你会发现最长路径的持续时间为 20 天。这是通过相加\
  \ A-B-D 的持续时间得出的。表 5.2 以表格形式显示了项目的开始和结束日期及持续时间。在计算开始和结束日期时，第一天算作第 1 天。任务 A 在 10/6\
  \ 开始，并在 6 号、7 号和 8 号整天进行工作，因为它的持续时间为三天。在这个例子中。\n\n| 任务 | 开始日期 | 结束日期 | 前置任务 | 持续时间（天）\
  \ |\n| --- | --- | --- | --- | --- |\n| A | 10/6 | 10/8 | 无 | 3 |\n| B | 10/9 |\
  \ 10/10 | A | 2 |\n| C | 10/9 | 10/18 | A | 10 |\n| D | 10/11 | 10/25 | B | 15 |\n\
  | E | 10/19 | 10/21 | C | 3 |\n\n**表 5.2**](#c05.xhtml_tableanchor5-2) 寻找关键路径\n\n\
  如果消除 E，关键路径会发生什么？什么都没有改变，因为最长路径（或处于同一路径或具有相同前置任务的最持续时间活动）仍然是 A-B-D，持续时间为 20 天。路径\
  \ A-C-E 的持续时间为 16 天。如果你消除了 B，关键路径将变为 18 天，即沿新路径 A-D。\n\n除了计算完成项目的总时间和识别关键路径上的任务外，CPM\
  \ 还提供了其他有用信息。你将能够确定哪些任务可以推迟开始或花费比计划更长的时间而不影响项目结束日期。在项目执行期间，项目经理可以使用这些信息将注意力放在对项目完成日期影响最大的任务上。\n\
  \n有时当你完成进度、计算出关键路径，发现项目持续时间对项目利益相关者来说是不可接受的。如果你发现自己处于这种情况下，可以使用持续时间压缩技术来帮助缩短进度。你接下来将学习这些技术。\n\
  \n### 持续时间压缩\n\n如果你对项目持续时间的计算超过了目标项目完成日期，会发生什么？\n\n\n\n\n\n这就是 `duration compression`（进度压缩）调度技术大显用场的地方。这些技术可以在计划阶段以缩短项目计划工期，或在项目执行期间帮助解决进度偏差。两种进度压缩技术是：赶工（crashing）和并行跟踪（fast\
  \ tracking）。你接下来将学习这两种技术。\n\n### 赶工（Crashing）\n\n`Crashing` 是一种考虑成本与进度权衡的技术。赶工通常通过在关键路径任务上增加更多资源来实现，以便更快地完成项目。赶工也可以通过要求负责关键路径任务的团队成员进行强制加班，或通过加快团队成员、供应商等的交付时间来实现。\n\
  \n如果使用得当，赶工可以产生预期的结果，但你应该意识到，压缩进度可能会增加风险并影响你的预算。在使用此技术时，务必确保你已经检查了这些对项目的影响。\n\n\
  ### 并行跟踪（Fast Tracking）\n\n`Fast tracking` 是并行执行多个原本计划按顺序开始的任务。\n\n让我们回到画画的例子。刮墙面和刷漆不能同时开始。然而，我们有两个刷漆任务：一个是刷墙壁，另一个是刷装饰线条。目前的进度显示线条在油漆完成后完成后开始（即\
  \ `FS` 关系）。我们可以对这些活动进行并行跟踪，让线条与墙壁同时开始。在逻辑上，施工队必须从建筑的不同点开始工作，以免互相阻碍，但任务可以并行启动。并行跟踪存在巨大的风险。如果你决定使用这种方法压缩项目进度，请务必听取团队成员的意见，了解可能会出现什么问题。记录所有风险，并将它们提交给你的赞助和其他关键利益相关者。不要犯在不沟通任何潜在风险或影响的情况下试图加快项目速度的错误。你需要确保每个人都理解潜在的后果并同意进度的变更。\n\
  \n### 项目调度软件\n\n项目调度软件是一种可以为你节省大量时间的工具。它能够自动计算任务工期、确定关键路径并帮助你平衡资源。它为你提供了显示项目多种不同视图的能力，这是一个极佳的沟通工具，你还可以根据受众的需求定制这些视图。例如，高管人员通常不想看到项目进度表中的每一行。他们感兴趣的是里程碑视图，或者查看主要交付物及其截止日期。软件还允许你保存一个基准计划以供历史参考。让我们来看下一个部分。\n\
  \n### 设定基准并获取批准\n\n`schedule baseline`（进度基准）是项目进度的最终获批版本，包含了基准开始和结束日期以及资源分配。确保你的利益相关者以及为项目提供资源的职能经理对项目进度表签字至关重要。这确保了他们阅读了进度表，理解了日期，并理解了资源承诺。理想情况下，这还能防止他们违背对项目在特定时间所做出的承诺和资源保证。\n\
  \n进度基准将贯穿整个项目，用于监控进度。这并不意味着永远不能对进度进行更改。但我们鼓励你认真考虑任何会改变项目结束日的变更。这将需要修改进度基准并通过变更管理过程获得批准，你将在第\
  \ 9 章中学习相关内容。\n\n### 质量门关（Quality Gates）\n\n项目进度中的 `Quality gates`（质量门关）类似于里程碑。它们本身并不产生产物；它们用于在项目的战略性节点确定质量检查，确保工作准确并符合质量标准。在画画的例子中，你可能在刮墙完成后、刷漆任务开始之前设置一个质量门关。在验证门关之前不应开始刷漆。在这种情况下，质量门关是为了确保工作执行得正确且完整。\n\
  \n你的组织或 PMO（项目管理办公室）可能有用于质量门关的流程、检查清单或模板。与质量门关相关的活动通常不是项目特有的；相反，它们属于产品或服务，可以在多个项目中重复使用。\n\
  \n### 建立治理门关（Governance Gates）\n\n`Governance gates`（治理门关）被用作项目的审批点。在大型项目中，它们还可以用作项目期间额外的审批检查点或“是/否”决策点。\n\
  \nCompTIA 目标列出了三种治理门关：客户签字、管理批准和立法批准。你之前已经学习了赞助和利益相关者的签字。你还希望客户也对项目进度表（以及完成后的项目计划）签字。记住，签字有助于确保遵守进度、对日期的同意以及对资源承诺的。根据我的经验，立法批准实际上发生在项目启动之前。然而，我可以想象，一个非常大且复杂的公共部门项目（例如建造空间站）可能在项目的战略节点需要定期的立法批准和监督。\n\
  \n### 总结\n\n进度规划涉及许多步骤。任务定义是从你的 `WBS`（工作分解结构）提取工作包，并将其分解为可以估算并分配给团队成员的单个任务。排序查看任务之间的依赖关系。这些依赖关系可以是强制的、可选的、内部的或外部的。依赖任务要么是链接任务的后继任务，要么是前序任务。\n\
  \n逻辑关系有四种类型：完成开始（FS）、开始开始（SS）、开始完成（SF）和完成完成（FF）。工期估算通过类比估算（也称为自上而下估算）、参数估算和专家判断获得。\n\
  \n关键路径法 (`CPM`）通过确定浮时间（float time）来创建进度。浮时间是早/晚开始日期与早/晚结束日期之间的差异。关键路径是项目上最长的完整路径。\n\
  \n进度压缩是用于缩短项目进度以满足强制性完成日期的技术。赶工通过向项目增加更多资源来缩短任务工期。并行跟踪是并行启动两个原本计划按顺序开始的任务。\n\n项目进度表可以以里程碑图的形式显示。里程碑标记了项目重大事件，如关键交付物或项目阶段的完成。甘特图也是显示进度数据的常用方法。完成并获批的项目进度表将成为跟踪和报告项目进度的基准。\n\
  \n进度表中可以添加质量门关，以确定目前的工作是否准确并符合质量标准。治理门关包括客户签字、管理批准和立法批准。\n\n## 考试要点\n\n**描述排序过程。**\
  \ 排序（Sequencing）是识别项目活动与调度活动之间依赖关系并按正确顺序安排的过程。\n\n**列出依赖任务之间的两种主要关系。** 前序任务（predecessor）是与另一个任务位于同一路径且发生在所述任务之前的任务。后继任务（successor）是与另一个任务位于共同路径且发生在所述任务之后的任务。\n\
  \n**列出四种逻辑关系类型。** 四种逻辑关系类型是完成开始、开始开始、开始完成和完成完成。\n\n\n\n\n\n### 了解并理解三种最常用的活动持续估算技术。\n\
  专家判断依赖于熟悉任务的人的知识。类比估算或自上而下的估算基于之前项目中类似活动的估算。参数估算是基于定量的估算，通常通过费率乘以数量来计算。\n\n### 定义\
  \ CPM 的目的。\n`CPM` 计算项目中最长的完整路径。这条路径控制着项目的完成日期。关键路径任务的任何延迟都会推迟项目的完成日期。\n\n### 解释网络图。\n\
  网络图用于描述项目活动以及这些活动之间的相互关系和依赖关系。\n\n### 列出显示项目计划的三种常见方式。\n项目计划通常以里程碑图、`PERT` 网络图或\
  \ `Gantt` 图的形式显示；`Gantt` 图是一种条形图。\n\n### 定义质量闸门和治理闸门。\n质量闸门用于检查工作，而治理闸门用于客户签字、管理批准和法律批准。\n\
  \n## 关键术语\n在参加考试之前，请确保你熟悉以下术语：\n\n*   活动列表 (activity list)\n*   类比估算 (analogous\
  \ estimating)\n*   进度赶工 (crashing)\n*   关键路径 (critical path)\n*   关键路径法 (critical\
  \ path method (CPM))\n*   依赖关系 (dependencies)\n*   酌情依赖 (discretionary dependency)\n\
  *   持续时间压缩 (duration compression)\n*   专家判断 (expert judgment)\n*   外部依赖 (external\
  \ dependency)\n*   快速跟踪 (fast tracking)\n*   浮动时间 (float time)\n*   甘特图 (Gantt chart)\n\
  *   治理闸门 (governance gates)\n*   内部依赖 (internal dependency)\n*   逻辑关系 (logical relationship)\n\
  *   强制性依赖 (mandatory dependency)\n*   网络图 (network diagram)\n*   参数估算 (parametric\
  \ estimating)\n*   优先网络法 (precedence diagramming method (PDM))\n*   前置任务 (predecessor)\n\
  *   计划评估与评审技术 (Program Evaluation and Review Technique (PERT))\n*   质量闸门 (quality\
  \ gates)\n*   资源日历 (resource calendar)\n*   计划基线 (schedule baseline)\n*   排序 (sequencing)\n\
