  \n### 本章涵盖的 CompTIA Project+ 考试主题包括\n\n* ![](img/correction.jpg) **1.1 总结项目的属性。**\n\
  \    * 临时性\n    * 有开始和结束\n    * 唯一性\n    * 原因/目的\n    * 作为计划的一部分的项目\n    * 作为投资组合的一部分的项目\n\
  * ![](img/correction.jpg) **1.5 识别常见的项目团队组织结构。**\n    * 职能型\n        * 资源向职能经理报告\n\
  \        * 项目经理权限有限或没有权限。\n    * 矩阵型\n        * 权限在职能经理和项目经理之间共享\n        * 资源从职能部门分配到项目\n\
  \        * 项目经理权限从弱到强不等\n    * 项目型\n        * 项目经理拥有完全权限。\n        * 资源向项目经理报告。\n\
  \        * 临时资源\n\n![](img/egeng009.jpg) 你决定参加 CompTIA Project+ 考试是你职业抱向中重要的一步。认证对于项目经理来说很重要，因为许多雇主在招聘求职者时，除了实际经验和正式教育证明外，还会寻找项目管理认证。这本书旨在为你提供准备\
  \ Project+ 考试所需的概念。这里的大部分信息将基于由项目管理协会（`PMI®`）出版的《项目管理知识体系指南（PMBOK Guide®*`）》中记录的知识领域。书中将包含关于如何准备考试的提示，以及示例和现实场景来说明这些概念。\n\
  \n本章将涵盖项目的定义和特征，提供项目管理的层层概述，描述计划与投资组合之间的区别，并解释组织的结构。\n\n### 定义项目\n\n项目的存在是为了实现或完成组织的目标。大多数项目受益于被称为`项目管理`的一系列流程和标准的应用。让我们从一些基础问题开始。\n\
  \n* 什么让一项新任务成为一个项目？\n* 你如何知道自己正在从事一个项目？\n* 项目与运营活动有何区别？\n\n项目涉及人员团队，日常业务活动也是如此。它们都涉及遵循流程或计划，并且都会产生有助于实现目标的活动。那么，项目到底有什么不同呢？让我们在接下来的章节中探索这些问题。\n\
  \n### 识别项目\n\n`项目`是一个具有明确开始和结束日期的临时性工作，它产生独特的产品、服务或结果。当项目设定的目标得以实现且利益相关者对结果满意时，项目被认为是成功的。\n\
  \n项目还会带来以前不存在过的产品、服务或结果。这可能包括创建实体货物、实施软件、写书、计划和执行员工致谢活动、建造建筑等。只要符合以下标准，什么可以被视为项目就没有限制：\n\
  \n\n\n\n\n# 项目特征\n\n### 独特性\n项目的开展通常是为了实现特定的业务目标。它涉及某些新的工作，这意味着其最终结果应该是一个独特的产品或服务。这些产品可能向他人营销，也可能在内部使用，也可能为持续运营提供支持等。\n\
  \n### 临时性\n项目具有明确的开始和结束日期。完成项目工作所需的时间总长度可能从几周到几年不等，但总会有一个开始日期和一个结束日期。\n\n### 原因或目的\n\
  项目的产生是为了实现某个目的。这可能包括引入新产品、实现业务目标或战略目标、满足社会需求，以及任何数量的其他原因。记录并沟通项目的目的和原因至关重要，以便确保团队成员能够专注于实现项目目标。\n\
  \n### 相关相关者满意度\n一旦确定了项目，并在项目章程中概述了目标，并且相关利益相关者批准了项目计划，项目就启动了。当这些目标达到利益相关者的满意时，项目即结束。\n\
  \n一旦你确定了项目，将对项目进行验证（我们将在本章稍后的“验证项目”部分介绍这一主题），然后编写项目章程并获得章程的批准。我们将在第 3 章“创建项目章程”中详细讨论项目章程。\n\
  \n### 计划组与组合\n\n项目有时作为计划组或组合的一部分进行管理。`program`（计划组）是一组通过协调流程和技术共同管理的相关项目。对一组项目进行集体管理可以带来如果单独管理项目将无法实现的收益。\n\
  \n`Portfolios`（组合）是计划组、子组合和项目的集合，用于支持战略业务目标或目的。与计划组不同，组合可能由互不相关的项目组成。\n\n这里有一个例子可以澄清计划组和组合之间的区别。假设你的公司从事建筑业。该机构有几个业务部门：零售建筑、单户住宅建筑和多户住宅建筑。单独来看，每个业务部门可能包含一个计划组。例如，零售建筑就是一个计划组，因为该计划组内的所有项目都是为了创建新的零售导向建筑。这与单户住宅建设（另一个计划组）不同，也与多户住宅建设（另一个计划组）不同。所有这些部门的计划组和项目共同构组合。该组合中可能还存在其他项目和计划组，例如停车结构、景观等。\n\
  \n组合中的计划组和项目之间并不一定存在直接的联系。项目可以独立存在于组合中（换句话说，项目不属于某个计划组，但属于组合）。然而，组合中任何计划组或项目的总体目标都是满足组合的战略目标，而组合反过来应该满足业务部门或公司的战略目标。\n\
  \n### 理解运营\n\n`Operations`（运营）是持续且重复的。它们没有开始日期或结束日期，除非你正在启动一项新运营或退休一项旧运营。运营通常涉及支持商品或服务生产持续功能。相比之下，项目是为了实现特定的、独特的结果而产生的，随后结束。\n\
  \n重要的是，在许多情况下，项目和运营是紧密相分的。例如，你可能被分配为一家鞋类厂研究并实施先进设备。一旦设备实施完成，项目即结束。随后将交交给运营团队，设备执行的日常任务就变成了一种持续的运营。\n\
  \n让我们来看两个术语的定义。`Project management`（项目管理）汇集了一系列工具和技术——由人员执行——用于描述、组织和监控项目活动的工作。`Project\
  \ managers`（项目经理 PM）是负责将这些工具应用于各种项目活动的人。他们的首要任务是整合项目的所有组件并使其圆满结束。管理项目涉及许多技能，包括处理资源的竞争需求、获得足够的预算、识别风险、管理项目需求、与利益相关者互动、保持进度以及确保产品质量。\n\
  \n## 使用 PMBOK 指南^®\n\n项目管理标准记录在由项目管理协会协会（PMI）出版的《项目管理知识体系指南》（`PMBOK Guide^®`）中。`PMI^()`\
  \ 制定了项目管理的全球事实性标准。它是一个大型组织，拥有来自世界各国 700,000 多成员。\n\n除了出版 `PMBOK Guide^®` 之外，`PMI^()`\
  \ 还为个人项目经理管理两项严谨的认证考试：`项目管理专业业员 (CAPM)^®` 和 `项目管理专业人士 (PMP)*^®`。`PMBOK Guide^®`\
  \ 是 CAPM 和 PMP 认证考试的基础。如果你继续从事项目管理职业，你可能会决定学习并参加 CAPM 或 PMP 认证考试。你为准备 Project+ 考试所学习的材料是构建项目管理知识的极佳基础。\n\
  \n## 理解组织结构\n\n你组织的结构对项目管理的许多方面都有影响，包括项目经理的权限和分配资源的流程。\n\n项目经理往往对推进项目过程中看似障碍的因素感到沮丧，但在许多情况下，根源问题是组织结构本身及其运作方式。后续章节将介绍不同类型的组织结构以及它们如何影响项目的开展。\n\
  \n### 职能组织\n\n经典的组织结构是`functional organization`（职能组织），如图 1.1\n\n[**图 1.1**](#c01.xhtml_figureanchor1-1）职能组织\n\
  \n职能组织通常以孤立的方式进行项目工作。也就是说，项目交付物是在不同部门中独立处理的。这会导致项目经理感到沮丧，因为他们是对项目结果负责的人，但他们没有手段要求其他部门的团队成员完成项目交付物。\n\
  \n\n\n\n\n职能组织中的项目经理应当与职能经理建立稳固的工作关系。职能经理负责向其下属员工分配工作。他们还负责对员工进行绩效评估并决定其加薪或奖金。正如你所想象的，这在员工与职能经理之间建立了强烈的忠诚关系，而不是员工与项目经理之间。然而，这并不意味着项目经理在这种类型的组织中无法取得成功。与职能经理建立关系并保持开放的沟通是这种结构下项目成功的关键。如果你能通过对员工在项目中的工作进行评分，从而为他们的绩效评估做出贡献，也将大有帮助。\n\
  \n职能组织是最常见的组织结构，已经存在了几个世纪。职能组织的优点包括：\n\n*   为员工提供增长潜力和职业发展路径\n*   具备独特技能的人有机会大展身脚\n\
  *   清晰的指挥链（每位员工都只有一名主管——即职能经理）\n\n职能组织的典型缺点包括：\n\n*   项目经理的权限有限或没有权限。\n*   多个项目竞争相同的有限资源。\n\
  *   资源通常是兼职投入项目，而不是全职。\n*   问题解决遵循部门的指挥链。\n*   项目团队成员对职能经理忠诚。\n\n### 矩阵组织\n\n下一个介绍的组织结构是\
  \ `matrix organization`（矩阵组织）。正如稍后讨论的，矩阵组织有三种。图 1.2 显示了平衡矩阵组织。\n\n![平衡矩阵组织的框图，包含\
  \ CEO，其分支至人力资源、财务、市场、信息技术、生产、人员和项目经理。](img/c01f002.jpg)\n\n图 1.2 平衡矩阵组织\n\n矩阵组织通常按照部门划分划分，类似于职能组织，但分配给项目的资源对与项目相关的所有工作向项目经理负责。项目经理通常是职能部门经理的同级。在项目上工作的团队成员通常有两个或多个主管——他们的职能经理以及他们所汇报的项目经理（或多个经理）。\n\
  \n在矩阵组织中工作的项目经理需要向项目团队成员及其各自的职能经理明确关于以下方面的分配和结果：\n\n*   团队成员需要对项目经理负责的成果\n*   团队成员需要对职能经理负责的成果\n\
  \n对于任何给定的结果，团队成员应只对一个人负责，以避免混淆和方向冲突。\n\n矩阵组织中的另一个问题领域是资源的可用性。如果你有一个资源 50% 的时间被分配到你的项目，那么职能经理或其他与该资源合作的其他项目经理意识到该资源分配给你项目的时间投入是非常关重要的。如果这类时间限制问题得不到解决，项目经理可能会发现他们项目的人力资源比最初预期的要少。在项目开始阶段（包括项目前期准备阶段和规划阶段）解决资源承诺，将有助于防止未来出现问题。\n\
  \n以下是矩阵组织的典型特征：\n\n*   项目经理的权限从弱到强不等。\n*   混合了全职和兼职项目资源。\n*   资源由职能经理在其各自的职能范围内分配到项目中。\n\
  *   项目经理和职能经理共享权限级别。\n*   有更好的部门间沟通。\n\n#### 三种矩阵组织\n\n矩阵组织有三种类型：\n\n**强矩阵（Strong\
  \ Matrix）** 强矩阵组织强调项目工作而非职能职责。项目经理在这种类型的组织中拥有大部分权力。\n\n**弱矩阵（Weak Matrix）** 弱矩阵组织强调职能工作而非项目工作，运行方式更像职能层级。职能经理在这种类型的组织中拥有大部分权力。\n\
  \n**平衡矩阵（Balanced Matrix）** 平衡矩阵组织在项目和职能工作之间平分。在这种结构下，项目经理和职能经理共享权力。\n\n了解你所处哪种类型的矩阵组织非常重要，因为组织类型决定了你将拥有的权限水平。但不要误以为在强矩阵环境中你会更容易地随心所欲。与职能经理保持开放的沟通渠道并告知他们状态、员工表现、未来需求、项目进展等仍然是至关重要的。\n\
  \n### 项目化组织\n\n介绍的最后一种组织结构是 `projectized organization`（项目化组织），如图 1.3 所示。这种组织结构比讨论的另外两种少得多。在这种环境中，组织的重点是项目，而不是职能工作单元。\n\
  \n![项目化组织的框图，包含 CEO，其分支至一系列项目经理再到一系列项目团队成员/人员。](img/c01f003.jpg)\n\n图 1.3 项目化组织\n\
  \n项目经理在这种结构中拥有大部分权力。他们负责做出有关项目的决策，并从组织内部或外部获取和分配资源。在项目化环境中，支持人员（如人力资源、行政支持、会计等）通常向项目经理汇报。\n\
  \n这种组织的优点之一是团队成员是 `colocated`（同地办公），这意味着他们在同一个物理位置工作。该结构的其他优点还包括：\n\n*   项目经理拥有管理项目和资源的完全权限。\n\
  *   全职资源被分配到项目中并向项目经理汇报。\n*   与项目经理建立了忠诚关系。\n*   其他临时资源可能向项目经理汇报。\n*   有专门的项目支持人员。\n\
  \n项目化组织最大的缺点之一是项目结束后如何重新分配项目团队成员。这些资源并不总有新项目在等待。再次强调，组织内部项目经理之间进行沟通是关重要的，以便尽可能高效地管理增加或减少资源的复杂时机。\n\
  \n## 验证项目\n\n利益相关者发起项目有很多。大多数组织没有资源或时间执行每个利益相关者希望实施的每个。验证项目涉及两个步骤：准备业务情况书和识别与分析项目利益相关者。但在编写业务情况书之前和之后，你还需要理解其中的某些步骤。首先，组织需要对项目的业务需求或需求有深入。然后，创建业务情况书（包含项目的理由），最后，使用项目选择方法决定组织应该实施哪些项目。\n\
  \n\n\n\n验证项目的第一步是准备和验证业务案例（Business Case）。业务案例通常记录了项目产生的原因。在我们深入探讨业务案例的具体细节之前，我们将涵盖一些引发项目的需求和诉求。\n\
  \n## 项目是如何产生的\n\n项目的产生有许多原因。例如，某些组织的存在是为了产生利润，许多组织为了实现这一目标而创建了专门为此设计的项目。其他组织的存在是为了向他人提供服务，而不考虑利润。它们可能会启动项目以增强其满足服务需求的能力。无论启动项目的原因是什么，大多数项目将属于下文描述的七种需求或诉求之一：\n\
  \n-   **市场需求**：市场的需求可以驱动项目的产生。例如，手持设备的普及产生了对能够持续放电 12 小时或更长时间的可充电电池的需求。\n-   **战略机会/业务需求**：业务需求通常会驱动涉及信息技术解决方案的项目。例如，某个组织的会计系统已经过时，无法再跟上当前的技术。实施一个新系统可以帮助该组织提高效率并更及时地生成报告。\n\
  -   **客户请求**：客户请求可以产生源源不断的潜在项目来源。例如，也许最近一次客户焦点小组的讨论带来了推出新产品的想法。\n-   **技术进步**：技术和业务需求有时在我们看来像是一个“鸡生蛋”的问题。是技术驱动业务认为自己需要新产品或服务，还是业务需求驱动了新技术的开发？这两种情况都存在，并且都会产生对新项目的需求。\n\
  -   **法律要求**：地方、州和联邦法规在每个立法期间都会发生变化，可能会驱动新项目的产生。例如，某市可能会通过一项允许在繁忙路口拍摄红灯违章照片的条例。这时必须采购并安装新设备。对私人数据进行加密和安全存储的联邦法规可能会产生一个满足这些要求的项目。\n\
  -   **环境因素**：如今许多组织正积极参与保护环境的绿色努力。例如，也许新的环境保护署（EPA）指令要求在您的生产装配线上实施额外的设备和流程，以最大地减少污染输出。因此，需要一个项目。\n\
  -   **社会需求**：社会需求或诉求可以通过多种方式引发项目。例如，一个发展中国家可能需要安全清洁的饮用水，因此启动了一个项目来购买和安装新的过滤系统。另一个例子可能是启动一个项目为预测将袭击该国的新流感病毒开发疫苗。\n\
  \n引发项目的需求或诉求通常会在业务案例中说明。接下来你将查看业务案例。\n\n## 业务案例验证与利益相关者识别\n\n项目的验证通过准备业务案例以及识别和分析利益相关者来实现。验证业务案例也有几个步骤。接下你将学习所有这些项目验证步骤。\n\
  \n### 验证业务案例\n\n项目经理在项目启动时可以做的第一件事之一就是理解项目的业务原因。业务案例通常基于上一节讨论的需求或诉求之一，是一份书面文档或报告，帮助执行管理层和关键利益相关者确定项目的利益和回报。它记录了项目的业务需求或合理性，并通常包含有关估计预算和完成项目时间表的高级细节。\n\
  \n-   **合理性（Justification）**：合理性描述了开展项目对组织带来的利益。这些利益包括有形和无形利益，并应该包括启动项目的原因。合理性可以是业务案例中的一个，也可以是一个独立文档。\n\
  -   **与战略计划对齐**：与战略计划的对齐也可以包含在业务案例中，它应该描述项目及其成果如何与组织的整体战略计划保持一致。如果项目的理由不支持战略计划，那么真的没有理由开展该项目。\n\
  -   **替代方案**：这应该包括成本的高级描述、实施每种替代方案可行性、每种替代方案的预期结果，以及该方案对组织产生任何影响的描述。（成本效益分析、回收期和其他财务分析通常包含业务案例的这一部分。）\n\
  -   **推荐方案**：此部分详细说明了推荐的解决方案。\n-   **可行性研究**：出于几个原因，会开展 `feasibility study`。可行性研究可以确定项目是否可行以及是否可能成功。它们检查项目产品、服务或结果的可行性。它们还可能检查与项目相关的技术问题，并确定其是否可行、可靠且易于整合到组织现有的基础设施中。并非所有的业务案例都会或应该包含可行性研究。当提议的项目高度复杂、具有高风险潜力，或是组织从未尝试过的新类型项目时，通常会进行可行性研究。可行性研究可以作为独立项目、子项目或项目前阶段进行。当结果不确定时，最好将此活动视为一个项目。\n\
  \n### 识别和分析利益相关者\n\n利益相关者是任何对项目有切利益的人。利益相关者可以包括个人以及组织，项目赞助人和项目经理都被视为利益相关者。项目赞助者是组织中授权项目启动的执行人员，是有能力和权限为项目分配资金和资源的人。识别利益相关者也是项目章程的一部分。第\
  \ 2 章将更详细地介绍利益相关者，第 3 章将讨论项目章程。\n\n### 项目选择\n\n在创建业务案例之后，你需要一些方法来决定你或项目选择委员会将如何在竞争性项目之间进行选择。\n\
  \n`Project selection methods` 被用于确定哪些提议的项目应该获得批准并推进。这一过程通常还包括高级资金的分配。项目选择可以使用正式的记录在指南进行，也可能是非正式的，只需要某特定级别管理层的批准。\n\
  \n通常，由一个高层委员会或小组将执行项目选择。该委员会在性质上可能是跨部门的，负责全公司范围的项目选择，或者以部门为单位进行选择。公司级别的委员会由所有部门的代表组成，例如信息技术、销售、营销、财务和客户服务。\n\
  \n### 项目选择方法\n\n项目选择委员会使用一组标准来评估和选择提议的项目。选择方法需要在所有项目之间一致应用，以确保公司在战略契合以及以及利用有限资源方面做出最佳决策。\n\
  \n\n\n\n\n项目选择方法将取决于组织的使命、选择委员会的人员、所使用的标准以及项目本身。这些方法可能包括审查市场份额、财务收益、投资回报率、客户满意度和公众认知等因素。具体的标准各不相同，但选择方法通常涉及决策模型和专家判断的结合。\n\
  \n### 决策模型\n\n`decision model`（决策模型）是一种正式的项目选择方法，旨在帮助经理就有限预算和人力资源的使用做出决策。项目请求可能跨越极广泛的需求范围，如果没有比较手段，很难确定优先顺序。用于销售团队的在线订单输入应用是否比为客户支持团队增加在线帮助更重要？对于受影响的部门来说，每个项目可能都被被视为首要任务。问题在于，可能没有足够的预算或人员来完成两项请求，必须做出决策来批准其中一项请求并拒绝另一个。除非你能对这两项请求进行“同类苹果比苹果”（对等比较）的比较，否则决策将非常主观。`decision\
  \ model` 使用项目选择委员会同意的一组固定标准来评估项目请求。通过使用相同的模型评估每个项目请求，选择委员会就有了一个用于比较项目的共同基础，并做出最客观的决策。你可以使用多种决策模型，它们的范围从基础排名矩阵到复杂的数学模型。\n\
  \n决策模型主要分为两类：收益衡量方法和约束优化模型。\n\n### 收益衡量方法\n\n`Benefit measurement methods`（收益衡量方法）提供了一种手段，通过使用相同的标准评估项目请求，来比较从这些请求中获得的收益。收益衡量方法是这两类决策模型中最常用的类型。四种常见的收益衡量方法是成本效益分析、评分模型、投资回收期和经济模型。\n\
  \n#### 成本效益分析\n\n`cost-benefit analysis`（成本效益分析）将生产产品或服务的成本与组织因执行项目而可能获得的财务收益（或利益）进行比较。在计算总成本时，你应该包括产品或服务的开发成本、营销成本、技术成本以及持续支持（如果适用）。\n\
  \n假设你提议的项目涉及开发和营销一种新产品。总成本预计为 300 万美元。根据市场研究，该产品的需求将很高，预计收入将超过组织的目标。在这种情况下，成本效益分析是积极的，这是一个强有力的指标，只要业务案例也能证明其合理性，你就应该应该选择该项目。\n\
  \n如果项目选择决策是基于项目投资通过减少支出或增加收入回收的快慢，那么成本效益模型是一个很好的选择。使用成本效益分析的缺点在于，它没有考虑到其他重要因素，例如战略价值。回本时间最短的项目并不一定是对组织最关键的项目。\n\
  \n#### 评分模型\n\n`scoring model`（评分模型）有一份预定义的标准列表，根据这些标准对每个项目进行评分。每个标准都给出了评分范围和权重。权重考虑了不同标准之间重要性的差异。评分模型可以包括财务数据以及市场价值、完成项目的组织专业知识、创新以及与企业文化的匹配度等项目。评分模型结合了客观和主观标准。单个项目请求的最终得分通过计算每个标准的评分和权重因子获得。有些公司对评分模型有一个最低标准。如果未达到这一最低标准，该项目将从选择过程中被排除。评分模型的益处是，你可以对更重要的标准赋予更重的权重。对创新使用高权重可能会产生这样的结果：一个回本期为两年的项目可能比一个在六个月内收回所有成本的项目被选中。评分模型的缺点是，它产生的排名价值仅取决于其所依据的标准和权重系统。开发一个良好的评分模型是一个复杂的过程，需要执行层大量的跨部门投入。\n\
  \n#### 投资回收期\n\n`payback period`（投资回收期）是一种现金流技术，用于识别组织回收项目所有成本所需的时间。它将初始投资与项目生命周期内的预期现金流入进行比较，并确定在项目回本之前经过多少时间段。投资回收期在本节讨论的所有现金流技术中精确度最低。\n\
  \n你也可以将投资回收期用于没有预期现金流入的项目。例如，你可能会安装一个新的呼叫处理系统，该系统允许呼叫中心在未来几年内增长而无需增加人员，从而提高呼叫中心的运营效率。招聘额外人员的规避成本可以替代预期现金流入来计算投资回收期。\n\
  \n#### 经济模型\n\n`economic model`（经济模型）是一系列财务计算，也称为现金流技术，提供项目整体财务的数据。一整本书都可以专门财务评估，因此在这里你将简要概述在使用经济模型时可能会遇到的一些常用术语：折现现金流、净现值和内部收益率。\n\
  \n- **折现现金流**: `discounted cash flow`（折现现金流）技术将项目预期现金流的未来价值与今天的美元进行比较。例如，如果你预计项目在第\
  \ 1 年带来 450,000 美元，第 2 年 250 万美元，第 3 年 320 万美元，你将计算每年收入的现值，然后将所有年份相加，以确定今天美元的现金流总价值。然后将每个项目的折现现金流与选择列表上的其他项目进行比较。通常，选择折现现金流最高的项目而不是折现现金流较低的项目。\n\
  \n- **净现值**: `Net present value (NPV)`（净现值）是一种现金流技术，计算组织预期在项目生命周期内以今天的美元获得的收入或现金流。例如，假设你的项目预计在未来五年产生收入。你在第\
  \ 2 年、第 3 年收到的收入比你今天收到的价值低。NPV 是一个数学公式，允许你以今天的美元确定每个期间的投资价值。每期产生的今天美元金额相加，然后从总和中减去初始投资，得出项目的总价值。NPV\
  \ 的规则是，如果 `NPV` 大于零，你就应该接受该项目。如果小于零，你就应该拒绝该项目。\n\n\n\n\n\n## 内部收益率\n内部收益率（IRR）是指现金流入现值等于原始投资的贴现率。IRR\
  \ 以投资在整个生命周期内的平均百分比表示投资的盈利能力。通常规则是，IRR 值高的项目被认为比 IRR 值低的项目更好。\n\n## 约束优化模型\n约束优化模型是数学模型，其中一些非常复杂。它们通常用于非常复杂的项目，要求对统计学和其他数学概念有深入的理解。对这些模型的讨论超本书的涵盖范围。\n\
  \n## 专家判断\n专家判断依赖于利益相关者、领域专家或具有以往经验的人的专业知识，以帮助就项目选择做出决策。通常，专家判断与之前讨论过的某个决策模型之一结合使用。\n\
  \n具有非正式项目选择的公司可能仅使用专家判断来做出项目选择决策。虽然仅使用专家判断可以简化项目选择过程，但依赖这种单一技术存在危险。项目选择委员会的成员不太可能都是每个拟议项目的权威。在缺乏对比数据支持的情况下，项目批准决策的制定可能完全取决于谁的幻灯片演示得最好，或者谁是最好的销售人员。\n\
  \n政治影响也可能是专家判断的一部分。具有巨大影响力的执行官可能会说服选择委员会批准特定项目。\n\n一旦你的选择委员会选择了并批准了项目列表，项目经理将推进项目管理流程。在下一节中，你看看这些流程是如何组织的的一种方式。\n\
  \n## 理解项目管理知识领域\n项目经理是使用各种工具和技术监督完成项目所需的所有工作的人员。`PMBOK Guide` 将这些工具和技术分为若干过程。例如，“制定项目章程”过程概述了输入、工具和技术以及输出，用于产生完整的文档项目章程，而章程正是该过程的输出结果。\n\
  \n项目管理知识领域是具有共同元素的个人过程集合。例如，项目人力资源管理领域由四个过程组成，这些过程都用于帮助建立获取和管理项目资源。\n\n根据 `PMBOK\
  \ Guide`，这些是 10 个项目管理知识领域：\n\n* 项目整合管理\n* 项目范围管理\n* 项目时间管理\n* 项目成本管理\n* 项目质量管理\n\
  * 项目人力资源管理\n* 项目沟通管理\n* 项目风险管理\n* 项目采购管理\n* 项目利益相关者管理\n\n当你阅读后续章节时，你将更详细地检查这些领域。请记住，这些知识领域在你的下一个项目中可能没有同等的重要性。例如，如果你正在执行一个使用内部资源的项目，并且项目需要少量的货物或供应，那么在项目规划活动中，项目采购管理领域的重点将低于项目范围管理领域。\n\
  \n## 理解项目经理的角色\n正如本章前面提到的，项目经理负责整合项目的所有组件和产物，并应用各种项目管理工具和技术以使项目圆满结束。项目经理的角色是多样化的，包括诸如管理团队；管理沟通、范围、风险预算和时间；管理质量保证；计划；谈判；解决问题等。\n\
  \n良好的软技能对项目成功的标准与良好的技术技能同样关键。将在将在几章节中检查与项目管理流程相关的许多技术技能，但我不会忘记谈论软技能。这些是任何优秀的经理每天用于管理资源、解决问题、实现目标等的技能。\n\
  \n你可能已经在日常工作活动中使用这些技能中的一些。以下是部分列表：\n\n* 领导力\n* 沟通\n* 倾听\n* 组织能力\n* 时间管理\n* 计划\n\
  * 解决问题\n* 建立共识\n* 解决冲突\n* 谈判\n* 团队建设\n\n让我们更详细地检查这些技能中的一些。\n\n### 领导力\n项目经理也必须是一个优秀的领导者。领导者理解如何让人们围绕愿景聚集，并激励他们取得惊人的成果。他们设定战略目标，确定方向，并启发和激励他人。强大的领导者还知道如何协调和鼓励具有不同背景和经验的群体共同工作以完成项目目标。\n\
  \n领导者对工作和生活充满热情。他们在实现目标时坚持坚持且勤奋。他们并不回避于利用出现的机会来改善他们的团队成员、提高项目结果或完成组织的使命。领导者出现在组织的各个层面，并不一定等同于执行职位上的人。我们见过不少执行人员，他们甚至无法带队走过走廊，更不用说通过复杂的项目管理实践迷宫了。作为项目经理，拥有能够获得的所有技术技能是非常棒的。但如果你还是一个他人信任并愿意跟随的强有力领导者，那就更好。\n\
  \n### 沟通\n大多数项目经理会告诉你，他们一天的大部分时间花在沟通上。`PMI` 建议项目经理将高达 90% 的时间花在沟通上。这是项目成功的首要关键。即使是最详细的项目计划，如果没有充分的沟通也会失败。在你工具箱所有的沟通技能中，倾听是最重要的。理想情况下，你已经精炼了你的领导力技能，并获得了团队成员的信任。当他们信任你时，他们会告诉你他们平时不会说的事情。作为项目经理，你想要知道所有可能影响你努力争取的结果，或任何可能影响你团队成员的因素。\n\
  \n项目经理必须为项目制定一套沟通策略，包括以下关键组件：\n\n* 你想要沟通的内容\n* 你沟通的频率\n* 接收沟通的受众\n* 用于沟通的媒介\n* 监控沟通的结果\n\
  \n在项目早期阶段牢记这些组件并制定一份全面的沟通计划，有助于在项目进展过程中防止误解和冲突。\n\n### 解决问题\n没有没有问题的项目。项目总会有问题。只是有些问题比其他问题更严重。\n\
  \n\n\n\n\n及早识别问题的预警信号将简化解决问题的过程，并使其产生最小的影响。很多时候，预警信号出现在你与利益相关者、团队成员、供应商及他人的交流中。不仅要关注团队成员说了什么，还要关注他们是怎么说的。肢体语言在沟通中起到的作用比语言更大。学会读懂团队成员言语背后的真实含义，并学会何时提出澄清性问题将问题核心摆在水面上。\n\
  \n我们将在第 6 章“资源计划与管理”中讨论你可以用于帮助解决问题和解决冲突的特定技术。\n\n### 谈判\n\n谈判是与个人或小组达成双方认可协议的过程。与沟通和解决问题的技能一样，这项技能贯穿项目的整个生命周期。\n\
  \n取决于你工作的组织结构类型，你可能通过与职能经理谈判资源来启动项目。如果你将从外部供应商采购商品或服务，你很可能会参与合同或其他形式的采购文件的谈判。项目团队成员可能会协商特定的任务分配。项目利益相关者可能会更改项目目标，从而引发关于进度、预算或两者的谈判。当你在执行项目时，变更请求通常涉及复杂的谈判，因为各种利益相关者会提出冲突的要求。在项目的生命周期中，你不缺运用技巧技巧，我们将在后续章节中更详细地学习其中的许多例子。\n\
  \n### 组织与时间管理\n\n正如本章前面所述，项目经理负责监督实现项目目标的所有工作方面。典型项目经理的持续职责包括跟踪进度和预算并提供其状态更新、定期召开团队会议、审查团队成员报告、跟踪供应商进度、与利益相关者沟通、与团队成员进行一对一会面、准备正式演示、管理变更请求等。这需要卓越的组织能力和有效管理时间的能力。我发现大多数项目经理也是优秀的时间管理者，但如果你在这个领域感到挣扎，我强烈建议参加一两门关于该主题的课程。\n\
  \n会议消耗宝贵的项目时间，因此要确保它们是必要且有效的。有效的会议不是凭空产生的——而是良好计划的结果。无论你是举行正式的团队会议还是个人会议，都应该定义会议目的，并制定一个要讨论或涵盖的主题议程。确保每个议程项目都有时间限制是良好的做法，以保持会议顺利进行并准时结束。根据我的经验，比团队成员迟到预定会议更糟糕的事情就是会议超过了规定时间范围。\n\
  \n清晰的文档对于项目的成功至关重要，你需要一个让你随时调取出这些文档的系统。技术在这一任务上提供了帮助。Microsoft SharePoint 是帮助你组织项目文档的极佳工具。你也有其他可用工具。找到一个实用的系统（即使是手动系统），并保持其更新。\n\
  \n### 总结\n\n项目是一个产生独特产品、服务或结果的临时性努力。它有明确的开始和结束日期。项目管理是应用工具和技术来组织项目活动，以成功实现项目目标。项目经理负责项目整合，并应用项目管理的工具和技术，使项目圆满结束。\n\
  \n组织结构影响项目的管理和人员配置方式。主要的结构有职能型、矩阵型和项目型。职能组织中传统的部门层级为项目经理提供的权限最小。光谱的另一端是项目导向型组织，资源围绕项目组织；在这些类型的组织中，项目经理拥有最高权限来对项目采取行动并做出决策。矩阵组织是职能组织和项目导向组织之间的折中。\n\
  \n计划是一组相关项目的集合或小组，通过协调的过程和技术进行管理。对一组项目进行集体管理可以带来如果单独管理项目将无法实现的收益。\n\n投资组合是支持战略业务目标或目标的计划、子投资组合和项目的集合。投资组合可能由不相关的项目组成。\n\
  \n项目选择技术涉及使用决策模型（如成本效益分析和专家判断）将有限的资源分配给最关键的项目。\n\n项目经理是负责从头到尾监督给定项目每个方面的个人。项目经理不仅需要对项目所生产的产品或服务的技术知识，还需要广泛的通用管理技能。关键通用管理技能包括领导力、沟通、解决问题、谈判、组织和时间管理。\n\
  \n## 考试要点\n\n**能够定义项目。** 项目产生独特的产品、服务或结果，并有明确的开始结束日期。\n\n**能够识别项目与日常运营之间的区别。** 项目是创建独特产品或服务的临时性努力。运营工作是持续且重复的。\n\
  \n**能够定义计划和投资组合。** 计划是一组相关项目，通过管理以获得如果独立管理将无法实现的收益。投资组合是支持战略业务目标或目标的计划、子投资组合和项目的集合。投资组合中的计划和项目之间可能不相关。\n\
  \n**列出三种组织结构。** 三种组织结构是职能型、矩阵型和项目型结构。矩阵组织可以结构为强矩阵、弱矩阵或平衡矩阵组织。\n\n**能够定义项目经理的角色。**\
  \ 项目经理的核心功能是项目整合。项目经理领导项目团队，并监督完成项目目标以满足利益相关者需求的所有工作。\n\n**能够识别最常用的项目选择方法。** 最常用的项目选择方法是收益衡量方法，如成本效益分析、评分模型、回收期和经济模型（包括折现现金流、NPV\
  \ 和 IRR），以及专家判断。\n\n**理解除了产品技术知识外，管理项目所需的技能。** 关键通用管理技能包括领导力、沟通、解决问题、谈判、组织和时间管理。\n\
  \n## 关键术语\n\n在参加考试之前，确保你熟悉以下术语：\n\n*   《项目管理知识体系》（PMBOK 指南）®\n\n*   收益衡量方法\n\n*\
  \   同地（colocated）\n\n*   约束优化模型\n\n*   成本效益分析\n\n*   决策模型\n\n*   折现现金流\n\n*   经济模型\n\
  \n*   专家判断\n\n*   可行性研究\n\n*   职能组织\n\n*   内部收益率 (IRR)\n\n*   矩阵组织\n\n*   净现值 (NPV)\n\
  \n*   运营\n\n\n\n\n\n* 投资回收期\n* 项目组合\n* 计划\n* 项目\n* 项目管理\n* 项目管理协会 (`PMI®`)\n* 项目管理知识领域\n\
  * 项目经理\n* 项目选择方法\n* 项目化组织\n* 评分模型\n\n## 复习习题\n\n1. 什么是项目的定义？请选择两个。\n    1. 一组相互关联的活动，旨在为组织创造独特的效益。\n\
  \    2. 通过使用项目管理技术（即可重复的过程），执行一系列操作以多次产生相同的结果。\n    3. 一项为创造独特产品、服务或结果而开展的临时性工作。\n\
  \    4. 一种用于产生利润、提高市场份额或遵守法律要求的过程。\n    5. 一项受时间限制的任务，并分配了资源，负责根据质量标准实现项目目标。\n\n\
  2. 哪个组织被全球公认为制定了项目管理标准？\n    1. PMC\n    2. `PMI®`\n    3. PMP\n    4. CompTIA\n\
  \n3. 以协调方式管理的一组相关项目的术语是什么？\n    1. 生命周期\n    2. 阶段\n    3. 过程组\n    4. 计划\n\n4.\
  \ 关于项目组合，以下哪些是正确的？请选择两个。\n    1. 项目组合中的独立项目可能没有任何共同点。\n    2. 项目组合中的计划彼此是相关的。\n\
  \    3. 项目组合内的计划和项目支持该项目组合的战略目标。\n    4. 组织只有一个项目组合。\n    5. 项目组合由计划组成，不包含独立项目。\n\
  \n5. 项目经理在 90% 的时间里使用以下哪些通用管理技能？\n    1. 编程\n    2. 沟通\n    3. 领导\n    4. 解决问题\n\
  \n6. 你收到客户服务部门的要求，为客户支持人员开发并实施一套桌面管理系统。这是什么类型的项目请求？\n    1. 业务需求\n    2. 市场需求\n\
  \    3. 法律要求\n    4. 技术进步\n\n7. 你在一个矩阵组织中工作。请选择两个描述这种结构的回答。\n    1. 项目资源是另一个业务部门的成员，可能无法无法为你提供全职帮助。\n\
  \    2. 矩阵组织可以结构为强型、弱型或平衡型。\n    3. 项目经理在此类结构中拥有大部分权力。\n    4. 这种组织结构类似于职能组织。\n\
  \    5. 在这种结构中，员工的项目任务由项目经理分配。\n\n8. 项目经理在何种组织结构下拥有最大的权限？\n    1. 项目化\n    2. 职能\n\
  \    3. 平衡矩阵\n    4. 强矩阵\n\n9. 你的项目按今天的价值预计现金流入为 780 万美元。使用哪种现金流技术确定？\n    1. 折现现金流\n\
  \    2. IRR（内部收益率）\n    3. NPV（净现值）\n    4. 成本效益分析\n\n10. 以下哪些是验证项目所需的步骤？请选择两个。\n\
  \    1. 分析可行性。\n    2. 证明项目的合理性。\n    3. 与战略计划对齐。\n    4. 验证业务情况。\n    5. 识别并分析利益相关者。\n\
  \n11. 该通用管理技能涉及与个人或小组达成相互认可的协议。\n    1. 领导力\n    2. 解决问题\n    3. 谈判\n    4. 沟通\n\
  \n12. 营销部总监 Federico 向你提出了一个项目想法。你将在业务情况书中包含哪些元素？请选择四个。\n    1. 项目的业务合理性\n    2.\
  \ 产生该项目的战略机会/业务需求\n    3. 推荐的替代方案\n    4. 关键利益相关者列表\n    5. 替代方案分析\n\n13. 你的项目第一年的预计现金流入为\
  \ 120 万美元，第二年 240 万美元，第三年 460 万美元。项目在 23 个月内收回成本。使用哪种现金流技术确定的？\n    1. IRR\n   \
  \ 2. NPV\n    3. 折现现金流\n    4. 投资回收期\n\n14. 你组织的一位高管给了你一个项目想法。在编写业务情况分析后，你将其提交给高管审查。在阅读业务情况后，他确定该项目对组织构成了巨大的风险。你下一步建议是什么？\n\
  \    1. 继续进入项目选择委员会。\n    2. 根据分析拒绝该项目。\n    3. 继续编写项目计划。\n    4. 进行可行性研究。\n\n15.\
  \ 你是一个负责软件开发项目的项目经理。你与一位系统分析师紧密合作，她被认为是该领域的专家。她在组织工作了多年，不仅理解系统开发，还理解系统将支持的业务领域。应该由谁做项目管理的决策？\n\
  \    1. 项目经理\n    2. 系统分析师\n    3. 项目经理根据系统分析师意见\n    4. 系统分析师根据项目经理意见\n\n16. 项目化组织的缺点是什么？\n\
  \    1. 它不处理任何与项目无关的工作。\n    2. 需要专业技能，导致成本高。\n    3. 职能经理对成员拥有控制。\n    4. 项目完成后，团队可能没有其他项目要做。\n\
  \n17. 以下哪些是启动项目的原因？请选择三个。\n    1. 可行性研究\n    2. 市场需求\n    3. 业务情况证明\n    4. 战略机会\n\
  \    5. 利益相关者需求\n    6. 社会需求\n\n18. 你的项目按今天的价值预计现金流入为 780 万美元。项目的初始投资为 920 万美元。以下哪项是正确的？\n\
  \    1. 折现现金流低于初始投资，因此应拒绝该项目。\n    2. 折现现金流低于初始投资，因此应接受该项目。\n    3. NPV 小于零，因此应拒绝该项目。\n\
  \    4. NPV 大于零，因此应接受该项目。\n\n19. 你组织的的高管通常通过审查业务情况，并根据对类似项目的经验判断哪些可能表现良好，哪些可能不会。这是哪种项目选择方法？\n\
  \    1. 业务情况分析\n    2. 专家判断\n    3. 可行性分析\n    4. 决策模型技术\n\n20. 业务情况分析应始终包含哪些元素？请选择两个。\n\
  \    1. 可行性研究\n    2. 项目选择方法\n    3. 与战略计划对齐\n    4. 合理性\n    5. 确定财务可行性的现金流技术\n\
  \n# 第 2 章\n\n## 项目团队角色与职责\n\n### 本章涵盖的 CompTIA Project+ 考试主题包括\n\n* ![](img/correction.jpg)\
  \ **1.2 分类项目角色和职责。**\n\n    * 赞助人/发起人\n        * 批准权限\n            * 资金\n      \
  \      * 项目章程\n            * 基线\n            * 高级需求\n        * 控制\n        * 市场\n\
  \        * 障碍排除\n        * 业务情况/合理性\n    * 项目经理\n        * 管理团队、沟通、范围、风险、预算和时间\n\
  \        * 管理质量保证\n        * 负责交付物\n\n\n\n\n\n- 项目协调员\n  - 支持项目经理\n  - 跨部门协调\n \
  \ - 文档/行政支持\n  - 时间/资源调度\n  - 检查质量\n- 利益相关者\n  - 既得利益\n  - 提供投入和需求\n  - 项目指导\n \
  \ - 专业知识\n- 进度计划员\n  - 开发和维护项目进度\n  - 传达时间线及变更\n  - 报告进度绩效\n  - 向资源提供方索取任务状态\n-\
  \ 项目团队\n  - 为项目贡献专业知识\n  - 根据进度贡献交付物\n  - 估算任务持续时间\n  - 估算成本和依赖关系\n- 项目管理办公室 (PMO)\n\
  \  - 为组织设定标准和规范\n  - 设定交付物\n  - 提供治理\n  - 关键绩效指标和参数\n  - 提供工具\n  - 概述未履约的后果\n  -\
  \ 标准文档/模板\n  - 协调项目之间的资源\n\n![](img/egeng009.jpg)\n\n## 利益相关者的角色与职责\n\n在项目的整个生命周期中，你将与一群重要的人打交道：你的利益相关者。获得利益相关者的支持对于你项目的成功至关重要。让我们聊聊他们是谁、他们想要什么，以及你作为项目经理与他们互动时的角色。\n\
  \n`stakeholder` 是对你的项目有既得利益的人或组织。换句话说，他们会因为项目的执行而获得或失去某些。他们通常具有很大的影响力。正如你预期的，你的大多数利益相关者首先关注他们自己部门（或组织）的需求。他们将依靠你这个项目经理来帮助他们理解将如何从这个项目中受益。如果你能成功赢得项目关键利益相关者的信任和支持，将对确保项目的整体成功产生巨大帮助。\n\
  \n第 1 章讨论的通用管理技能在处理利益相关者时将大有用，特别是你的沟通和谈判技巧。个人利益相关者对你的项目可能有不同的优先事项，你可能需要与你的利益相关者小组进行谈判，使他们就项目的最终目标达成共识。在观点多元的群体中建立共识，始于项目初始阶段的提前谈判，并贯穿于整个生命周期的持续沟通。在第\
  \ 8 章中，你将详细学习沟通知识，包括如何定义和实施针对个人利益相关者需求的沟通计划。\n\n利益相关者是你合作确定项目需求的人和组织。他们从各自业务领域带来的专业知识将帮助项目经理和项目团队定义需求、评审交付物并确保最终产品或结果符合质量标准。利益相关者在项目的整个生命周期内提供方向，并评审和批准最终的产品、服务或结果。\n\
  \n### 客户\n\n你的客户也是一个利益相关者。`customer` 是项目创建的产品或服务的接收者。在某些组织中，该利益相关者也被称为 `client`。客户通常是一个群体或组织，而不是单个人。客户可以是组织内部或外部的。\n\
  \n遗憾的是，由于各种原因，某些利益相关者可能不支持你的项目。他们可能不喜欢请求项目的人，可能不喜欢项目的目标，项目可能会给他们的业务部门带来重大变化，可能会改变他们的操作程序等等。对操作程序产生重大影响的项目被视为威胁。事实上，任何给组织带来重大变化的项目都会导致恐惧并产生阻力。\n\
  \n关键是要尽快了解你的利益相关者。尽早安排个人会议或面试，以了解他们对项目的观点和担忧。他们的担忧不会消失，如果你忽视了某些利益相关者，随着项目的进行，他们提出的问题将变得越来越难以解决。花时间定期与他们见面。这将帮助你设定和明确预期，并帮助他们看到推进项目的收益。\n\
  \n### 项目赞助人\n\n项目 `sponsor` 通常是组织中的高管，他们有权为项目分配资金和资源。赞助人也可以担任项目在组织内的 `champion`（支持者）。赞助人是项目经理的顾问，当利益相关者之间无法达成共识时担任裁决者。项目经理的主要职责之一是让项目赞助人了解项目的当前状态，包括冲突或潜在风险。\n\
  \n项目赞助人/支持者承担以下职责：\n\n- 提供或获取财务资源\n- 批准项目章\n- 批准项目基准\n- 帮助定义和批准高级需求\n- 定义项目的业务案例和合理性\n\
  - 授权将人力资源分配给项目\n- 指定项目经理并描述其权限级别\n- 担任所有项目问题的最终决策者\n- 与关键利益相关者谈判支持\n- 沟通或推广项目的收益\n\
  - 监控和控制主要里程碑的交付\n- 消除干扰并清除障碍\n\n### 项目经理\n\n第 1 章详细讨论了项目经理。你会记得，此人负责管理与项目相关的工作。以下是项目经理职责的简要列表，并非涵盖所有。本书的剩余章节将更详细地讨论这些每一项。\n\
  \n**管理项目团队**：`project team` 由组织内部有时以及外部的成员组成。你不总是有能力选择你的项目团队。记住，在职能型组织（最常见的组织结构）中，其他经理会为你的团队分配资源。\n\
  \n**与利益相关者和项目团队成员沟通**：让赞助人、利益相关者和团队成员了解当前项目状态、问题和其他信息是项目经理的关键职责。沟通从项目想法形成的那一刻开始，一直持续到项目的结束和验收。\n\
  \n**管理范围**：范围描述了项目的目标、交付物需求。项目经理将在利益相关者团队成员的帮助下捕获并记录范围，并使用变更控制流程监控和管理项目范围。\n\n**管理风险**：风险可能发生并对项目产生影响（正面或负面）的事件，发生时通常会有后果。风险由项目经理进行识别、管理、跟踪和监控。\n\
  \n**管理项目预算**：项目经理负责监控和跟踪项目成本，并在成本超出预期或资金消耗速度快于预期时尽早通知赞助人。\n\n\n\n\n\n## 管理进度\n大多数项目赞助人和执行层利益相关者都喜欢“按时且按预算”这句话，并经常在项目会议上反复强调这一句。除了管理预算外，你还负责管理进度并确保关键交付物按时完成。\n\
  \n## 管理质量保证\n仅仅按时且按预算交付是不够的。你还将负责确保交付物的质量，并确保它们符合质量标准且适用于使用。\n\n## 项目产物\n项目 `artifacts`（产物）是管理项目时使用的文档、模板、议程、图表和其他工作成果。例如，项目章程就是一种产物。项目经理负责维护和存档项目的产物。\n\
  \n项目经理负责项目的许多方面。最重要的职责包括：确保利益相关者对交付物以及项目的最终产品、服务或结果表示满意；整合项目工作；以及与利益相关者进行沟通。\n\n\
  ### 项目协调员\n`project coordinator`（项目协调员）协助项目经理处理各个方面。他们通常在行政支持职上协助项目经理。例如，他们可能协调跨部门团队成员和资源、安排会议、帮助项目经理进行资源调度、监控进度，并检查产品和流程的质量。\n\
  \n对于寻求从事项目管理职业的人来说，项目协调员职位通常是第一步。这是近距离观察项目管理的绝佳方式。\n\n### 项目计划员\n`project scheduler`（项目计划员）负责制定和维护项目进度、沟通时间表和截止日期、报告进度绩效，并向利益相关者和项目团队成员沟通任何进度变更。项目计划员从负责项目工作的团队成员处获取时间线和截止日期状态更新，以便保持进度的实时更新。\n\
  \n通常，项目计划员受雇于大型组织或大型项目。他们也可能为项目管理办公室（我们稍后会讨论这一点）工作，作为一种共享资源，与所有分配给项目管理办公室的项目经理合作。\n\
  \n### 项目团队成员\n项目团队成员是执行与项目相关工作的专家。根据你的组织结构，这些人人员可能直接向项目经理汇报、向组织内的职能经理汇报，或者在矩阵管理团队中工作。\n\
  \n如果你的资源由组织的其他部门提供，那么分配这些资源的职能经理就是关键利益相关者。你需要与职能经理建立良好的关系，并磨炼那些谈判技巧，因为你将需要它们。通常，会有多个项目经理在竞争同一个资源池。因此，最好记录下你与职能经理关于资源可供项目使用的时间，以及他们负责的交付物的协议，以防止未来的误解。你还应该就你对员工年度绩效考核、加薪和奖金机会的投入预先达成一致。\n\
  \n项目团队成员可能是全职或兼职分配到项目中的。大多数项目都有专职资源和兼职资源的组合。如果你有兼职资源，你需要理解他们在项目之外的义务，并确保他们没有被过度分配。\n\
  \n项目团队成员负责项目中的多项活动。他们最重要的职责之一是根据进度提交交付物。其他职责的部分列表可能包括：\n\n*   对他们正在执行的任务的时间和时长估算\n\
  *   对从组织外部购买的交付物或其他项目工作的成本估算\n*   其任务进度的状态更新\n*   与其任务相关的依赖关系\n\n### 项目管理办公室\n许多组织都建立了\
  \ `project management office (PMO)`，用以管理项目和计划计划。PMO 为项目经理提供指导，并帮助在整个组织范围内提供一种一致、可靠的项目管理方法。PMO\
  \ 负责维护与项目管理相关的标准、流程、程序和模板。他们负责识别组织内的各种项目，并在适当的情况下将它们纳入计划中，以利用该计划内所有项目的集体效益。\n\n\
  PMO 可能提供的功能如下：\n\n*   项目管理标准和流程\n*   帮助一致性管理项目的工具、模板和产物\n*   设定交付物\n*   管理项目和设定优先级的治理流程\n\
  *   关键绩效指标和度\n*   绩效标准，包括不履行的后果\n*   项目间的资源协调\n\n利益相关者的完整列表因项目和组织而异。你的项目越大、越复杂，利益相关者就越多。有时，你的利益相关者数量远比你想要的或需要的多，尤其是在高知名项目中。我们建议你定义你认为的项目利益相关者是谁，并与你的项目赞助者一起审查列表。项目赞助者通常更有能力识别组织中具有影响力的利益相关者。这类利益相关者可能会决定你项目的成败，你的赞助者可以协助你识别他们的需求。\n\
  \n如你看到的，你的项目团队成员和利益相关者代表了广泛的职能领域以及相对于项目的多样化和需求。为了跟踪每个人，你可能希望开发一个利益相关者矩阵。我们接下来来看这一点。\n\
  \n### 利益相关者矩阵\n如果你有一个拥有多个利益相关者的大型项目，创建一个利益相关者矩阵可能有助于你跟踪每个人。你可以使用简单的电子表格来创建矩阵。至少，它应该包含所有项目利益相关者的列表，并为每一个人提供以下信息：\n\
  \n*   姓名\n*   部门\n*   联系信息\n*   在项目中的角色\n*   对项目的需求、关注和兴趣\n*   在项目中的参与程度\n*   对项目的影响程度\n\
  *   供你参考的备注，关于未来与该利益相关者的互动、需要注意的政治问题或你想记住的个人特点\n\n由于项目利益相关者可能会不同时间加入或离开项目，项目经理定期审查和更新矩阵是非常关重要的。\n\
  \n## 接收项目请求\n大多数项目始于一个想法。想法产生项目请求，请求通常从业务案例开始，审查和授权项目的流程随之开始。你已经在第一章中学习了识别项目、开发业务案例、验证业务案例以及使用项目选择技术。现在，你将学习项目请求流程，以及记录高层范围定义和高层项目需求。\n\
  \n### 项目请求流程\n\n\n\n\n\n项目请求流程可以是正式的，也可以是非正式的，取决于组织。你可能有一套需要正式书面文档来描述项目目标和合理性的流程，或者你可能会遇到我所称的\
  \ `drive-bys`（临时起意）——即你的老板在通往大堂的 30 秒电梯行程中告诉你的某个项目。无论是谁发起的项目请求或如何发起的，组织都必须对其进行评审并对行动方案做出决策。为了做到这一点，你需要收集足够的信息来充分评估该请求，并确定该项目是否值得追求。\n\
  \n收到请求后，你的下一步是与请求者会面，以澄清并进一步定义项目需求，识别功能和技术需求，并记录高层需求。\n\n## 高层范围定义\n\n高层范围定义描述了项目目标、高层交付物以及项目的立初原因。\n\
  \n该描述解释了项目产品或服务的主要特征，并描述了业务需求与所请求的或或服务之间的关系。在你着手完成高层交付物和需求之前，你需要确保产生项目请求的问题或需求已得到清晰的定义和理解。这意味着你需要与请求项目的人会面，澄清项目目标并理解他们正试图解决什么问题。如果问题不明确，解决方案可能会偏离目标，因此在转向定义需求之前理解问题是至关重要的。\n\
  \n### 定义问题\n\n如果项目经理没有花时间清晰地定义项目请求的问题或需求，项目可能会有一个糟糕的开头。你是否曾经参与过这样的项目：人们为了截止日期而疯狂工作，但似乎没有人知道为什么要做这些工作？然后在项目过半时一切都发生了变化，或者更糟糕，整个项目被取消了？如果这听起来很熟悉，可能是因为在没有澄清问题的情况下就在开发解决方案。\n\
  \n客户并不总是能够清楚地表达问题是什么，他们的请求可能模糊且措辞随意。作为项目经理，你的工作是弄清楚客户的真实含义。我参与过许多 IT 相关项目，这些项目是根据客户的精确需求进行开发和实现的，结果听到他们惊叹道：“你交付了我要求的，但不是我想要的！”\n\
  \n当项目请求以解决方案的形式提出时，也会出现问题。客户带着特定的请求以及他们已经发现的、能够满足该请求的解决方案来找你，并不稀奇。你可能认为这是一个好消息，因为不需要大量的需求征集会议来占用你的日程。问题是，你的客户要求的可能并不是正确的解决方案。作为项目经理，你需要确保在提出解决方案之前问题已经得到了识别。\n\
  \n假设你收到一个关于新计单系统的请求。你应该做的第一件事是与请求者会面以获取更多信息。他们为什么需要新的计单系统？现有系统缺少哪些功能？他们认为这个新系统将解决什么业务需求或机会？这类问题将帮助你理解新计单请求背后的原因。如果你的项目请求者担心与普通计单问题的客户电话过多，最佳解决方案可能不是新系统，而是对费用进行更清晰的解释。如果他们对账单的新外观感兴趣，你处理的需求可能从重新格式化账单数据到使用不同的纸张打印账单不等。许多业务需求可能导致客户想要一个“新的计单系统”，但其中许多与开发完全全新的应用程序无关。这就是为什么优秀的项目经理会提问来揭示请求背后的原因。缺乏前期的澄清和问题定义是许多项目失败的源。在理解业务需求之前，不要假设客户请求的解决方案总是最好的解决方案。\n\
  \n### 记录高层范围定义\n\n一旦你理解了上一节提出的问题的答案，你就应该对项目的目标和目的有良好的理解。你可以记录项目的理由，说明你正试图解决的问题，并对使项目成功所需的某些交付物提供高层描述。这些信息将作为项目章程的基础，你将在下一章学习项目章程。\n\
  \n接下来，你将开始一个贯穿全书剩余部分的案例研究。该案例研究将概述你在本章中学到的概念，并带你完成一个基于虚构企业的模拟项目。\n\n### 总结\n\n项目利益相关者是指任何对项目结果有利益的人。你可能会遇到的一些利益相关者包括项目赞人、团队成员、部门经理和客户（内部和外部）。\n\
  \n项目赞人是组织中的高管，有权为项目分配预算和资源。项目赞人是项目的最终决策者，签署并批准项目章程，并消除障碍以便团队开展工作。项目赞人通常还担任项目的倡导者。他们传播对项目的热情，并对其处进行助威。\n\
  \n项目协调员协助项目经理处理行政职。项目调度员协调并更新项目计划，并向利益相关者告知进度情况。项目经理负责协调和管理项目团队、沟通、范围、风险、预算和时间。他们还管理质量保证并对项目产物负责。PMO（项目管理办公室）为项目管理提供指南、模板和流程。\n\
  \n项目请求流程始于高层范围定义，描述了项目目标、高层交付物以及项目的理由。它还描述了业务需求与所请求的产品或服务之间的关系。\n\n## 考试要点\n\n**能够定义项目经理。**\
  \ 项目经理管理团队、沟通、范围、风险、预算和时间。他们还管理质量保证并对项目产物负责。\n\n**能够定义项目赞人。** 项目赞人是组织中的高管，有权为项目分配资金和资源。赞人批准资金、项目章程、项目基准和高层需求。他们对项目拥有最终决策权，帮助营销项目益处，为团队消除道路障碍，并参与业务案例的合理性论证。\n\
  \n**能够定义项目利益相关者。** 利益相关者是任何对项目有利益并能从项目中获得或失去东西的人。利益相关者包括赞人、项目经理、项目团队成员、部门经理、客户、团队成员以及其他对项目感兴趣的人。\n\
  \n**能够定义项目协调员。** 项目协调员协助项目经理进行跨部门协调、文档编制、行政支持、时间和资源调度以及质量检查。\n\n\n\n\n\n能够定义进度计划员。进度计划员负责制定和维护项目进度、沟通时间表和变更、报告进度绩效，并从团队成员处获取工作状态。\n\
  \n能够定义项目团队。项目团队为项目提供专业知识，根据进度计划开展交付工作，估算任务时长、估算成本并估算依赖关系。\n\n能够定义项目管理办公室。`PMO` 为项目经理提供指导，并帮助在整个组织范围内提供一致、可靠的项目管理方法。`PMOs`\
  \ 负责维护标准、流程、程序和模板。\n\n## 关键术语\n\n在参加考试之前，请确保你熟悉以下术语：\n\n* 产物 (artifacts)\n* 关键倡导者\
  \ (champion)\n* 客户 (client)\n* 顾客 (customer)\n* 项目基线 (project baseline)\n* 项目协调员\
  \ (project coordinator)\n* 项目管理办公室 (PMO)\n* 项目团队 (project team)\n* 进度计划员 (scheduler)\n\
  * 赞助 (sponsor)\n* 利益相关者 (stakeholder)\n\n## 复习题\n\n1. 你已经识别了项目中所有的关键利益相关者。你列出了他们的姓名、部门、对项目的兴趣以及影响力水平。你创建了什么？选择两个。\n\
