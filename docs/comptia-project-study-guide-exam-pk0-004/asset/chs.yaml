  * 变更控制过程\n    * 识别并记录。\n    * 评估影响和合理性。\n        * 回滚计划（撤销变更）\n    * 识别审批权限。\n \
  \   * 获取批准。\n    * 实施变更。\n* 验证变更/质量检查。\n    * 更新文档/审计文档/版本控制。\n    * 根据需要贯穿进行沟通。\n\
  * 常见的项目变更类型\n    * 时间线变更\n    * 资金变更\n    * 风险事件\n    * 需求变更\n    * 质量变更\n    *\
  \ 资源变更\n    * 范围变更\n* ![](img/correction.jpg) 3.5 识别组织变更的类型。\n* 业务合并/收购\n* 业务拆分/分裂\n\
  * 业务流程变更\n* 内部重组\n* 搬迁\n* 外包\n* ![](img/correction.jpg) 4.3 识别常见的以或供应商为中心的文档及其目的。\n\
  * 信息征询 (RFI)\n* 建议请求 (RFP)\n* 报价请求 (RFQ)\n* 具有共同法律约束力的文档\n* 协议/合同\n* 非披露协议 (NDA)\n\
  * 终止函\n* 意向书\n* 工作说明书 (SOW)\n* 谅解备录 (MOU)\n* 服务等级协议 (SLA)\n* 采购订单\n* 保修\n\n![](img/egeng009.jpg)\
  \ 在执行项目工作过程中，你将持续监控工作结果，以确保它们符合项目计划的规范。偏离项目计划的情况可能是可能需要或已经发生变更的警示。对新需求的请求或对交付物、范围的更改将在项目过程中浮现。组织变更也会给项目带来变化。一个健全的变更控制过程将帮助你和团队有效地处理这些请求，我将在本章深入讨论这些流程。\n\
  \n你还将学习采购流程，以及你的项目可能需要的采购文档类型和合作伙伴或供应商为中心的文档。\n\n最后但同样重要的是，你将学习敏捷项目管理方法论。本章涵盖的内容很多，让我们从回顾项目管理计划开始。\n\
  \n### 项目管理计划回顾\n\n在之前的章节中，我讨论了成本基准、进度基准和项目管理计划的概念。你会记得，项目管理计划是最终的、经过批准的文档计划，你将在项目的剩余时间内使用它来衡量项目进度，并最终衡量项目的成功。项目管理计划的关键组件包括以下文档：\n\
  * 范围声明\n* 项目进度\n* 沟通计划\n* 资源计划\n* 采购计划\n* 项目预算\n* 质量管理计划\n* 风险管理计划\n\n这份完成的计划作为项目进的基准。你将在项目的执行阶段和监控控制阶段使用该计划，以确定项目是否在正轨道上，或者你是否需要采取行动使工作与计划保持一致。当请求变更时，也会引用项目管理计划。它有助于确定变更是否已经发生，并用于确定请求的变更是否符合项目的整体目标和目的。\n\
  \n项目管理计划还被用作发起人、利益相关者和管理团队成员的沟通工具，在整个项目期间审查和评估进度。因此，让发起人和关键利益相关者对最终计划进行签字是一个好主意。这有助于确保对项目目标、预算和时间表的共识，并在理想情况下防止在项目工作开始后产生误解。当变更请求开始出现且利益相关者想要“再增加一个小功能”，而该功能可能不符合项目范围时，它也将作为基准。一旦变更请求获得批准，就应该更新项目管理计划。\n\
  \n## 实施变更控制系统\n\n变更发生有很多，大多数项目在项目周期内都会经历变更。项目变更的一些常见原因包括：\n* 时间线变更\n* 资金变更\n* 风险事件\n\
  * 需求变更\n* 质量变更\n* 资源变更\n* 范围变更\n\n这些变更请求可能来自项目发起人、利益相关者、团队成员、供应商等。你将希望了解导致变更的因素（此处列出的这些），以及提议的变更如果实施可能会对项目产生什么影响。\n\
  \n其他人可能请求的变更类型是无限的。此外，变更请求还可能表现为`纠正措施`、`预防措施`或`缺陷修复`。这些通常源于对实际项目工作结果的监控。让我们简要描述一下这些每一项：\n\
  \n**纠正措施** 纠正措施使项目工作与项目管理计划保持一致。\n\n**预防措施** 实施预防措施是为了帮助降低负面风险事件发生的概率。\n\n**缺陷修复**\
  \ 缺陷修复纠正或替换不符合标准或发生故障的组件。\n\n在项目管理方面，变更最重要的方面是建立一个健壮的变更控制系统来处理这些请求。`变更控制系统`是记录的程序，描述了如何控制、更改和批准项目的交付物。它们还描述并管理了请求和跟踪变更所需的文档，以及项目管理计划的更新。\n\
  \n\n\n\n避免混乱的关键在于通过集成的变更控制系统以组织化的方式管理变更，该系统应查看任何变更对项目计划所有方面的影响。变更无论大小，都会对**三重约束**（时间、成本或范围）产生影响，并且可能影响质量或这些因素的任何组合。如果没有一个流程来分析变更的影响，并确定是否值得投入额外的时间、金钱等来实施，将是项目失败的根源。\n\
  \n一个有效的变更管理系统包含几个方面。你将在本节中查看这些元素中的每一个。变更管理过程包括：\n\n*   识别并记录变更请求。\n*   在变更请求日志中中跟踪请求。\n\
  *   评估变更的影响和合理性。\n*   在变更控制委员会（`CCB`）对请求进行处理，并批准或拒绝。\n*   实施变更。\n*   验证变更并进行质量检查。\n\
  *   更新项目管理计划，更新相关的项目文档并应用版本控制。\n*   与相关的利益相关者进行协调和沟通。\n\n### 识别并记录变更请求\n\n在项目管理计划通过后，所有变更请求必须通过变更控制系统提交。变更控制的流程和程序应当记录在案，并方便利益相关者和团队成员查阅。该流程应描述从哪里获取变更请求表、将变更请求提交给谁以及何处进行考虑，以及让请求者知晓状态的沟通流程。\n\
  \n大多数参与项目或与项目相关的人员都可以提交变更请求。变更请求应始终以书面形式提交。这意味着你需要设计一个模板表单，供利益相关者和其他人员记录变更请求、需要变更的原因以及如果不进行该变更将会发生什么。你可以在表单上留出放置其他信息的地方，你认为这些信息有助于评审委员会确定是否应该进行变更。例如，其他信息可能包括额外利润的潜力、市场性的提升、效率的改进、生产力的提高、社会意识或利益、绿色潜力等。\n\
  \n变更请求就像一个微型的业务案例，它描述了变更的合理性、替代方案和影响。通常，请求变更的人员会将请求提交给变更控制委员会。\n\n## 变更请求日志\n\n\
  一旦提交变更请求，应该发生几件事。首先，它应该分配一个识别数字以便跟踪。然后，它应该记录在变更请求日志中。该日志很容易在电子表格文件中构建。表 9.1 显示了变更请求日志示例。\n\
  \n| ID | 日期 | 描述 | 请求者 | 状态 | 处理结果 | 实施或关闭日期 |\n| --- | --- | --- | --- | --- |\
  \ --- | --- |\n| 01 | 11/11 | 在输入界面添加下拉框。 | Nora Smith | 已提交至评审委员会 | 已批准 | 11/13\
  \ |\n| 02 | 11/14 | 为备份实施虚拟带库。 | Brett Whatley | 等待 11/25 评审 | | |\n\n**表 9.1**\
  \ 变更请求日志\n\n根据项目的需求，你可以在此电子表格中添加其他列用于跟踪。例如，你可能想添加委员会决定的日期、实施状态，以及跟踪实施变更所花费成本和工时的列。\n\
  \n在跟踪日志中记录变更请求后，下一步一步是对变更请求进行分析。\n\n### 评估变更的影响和合理性\n\n变更通常由受变更影响的项目领域的领域专家结合项目经理的输入进行评估。以下问题是开始分析过程的良好起点：\n\
  \n* 是否应该实施该变更？\n* 从项目约束（成本、时间、范围和质量）的角度来看，对项目的成本是多少？\n* 实施变更带来的益处会增加还是减少项目完成的机会？\n\
  * 此变更的价值和有效性是什么？\n* 该变更是否可能导致风险的增加或减少？\n\n在回答了这些基本问题后，专家应该进一步分析变更请求的具体元素，例如额外的设备需求、资源工时、成本、处理变更所需的技能或知识、质量影响等。你可以使用我们在前面的章节中讨论过的一些成本和资源估计技术来确定变更请求的估值。\n\
  \n项目经理还将分析进度、预算和资源分配，以确定变更将产生哪些影响。这些信息被记录下来（这里模板也很有用），然后提交给评审委员会（通常称为`变更控制委员会`）进行批准或拒绝。\n\
  \n评估变更请求的影响可能包括 CompTIA 所说的`回归计划`（regression plan）。你可以将其视为`反转变更`或撤销变更并恢复到之前状态的能力。信息技术项目通常有回滚计划（或反变更计划）。如果变更未按预期运行，你可以回到之前已知的正常状态。\n\
  \n请记住，在分析变更时始终存在着机会成本。当你要求领域专家停止手头工作以检查变更请求的影响时，他们在项目上的工作就停止了。这种权衡有时很难平衡。这方面没有硬性规定。你必须密切关注项目进展和提交请求的数量。我有时会跟踪团队分析变更请求花费的时间，并在项目状态会议期间向利益相关者报告。这有助于他们意识到如果变更请求过度会对项目产生的影响；如果你拥有一群精明的利益相关者，他们将开始自律并减少无率的请求。\n\
  \n## 变更控制委员会\n\n在许多组织中，建立了变更控制委员会来审查所有变更请求，并批准、拒绝或推迟请求。CCB 成员可能包括利益相关者、经理、项目团队成员以及可能与当前项目没有联系的人员。某些组织设有永久\
  \ CCB，由全职员工组成，专门管理整个组织的变更，而不只是项目变更。如果组织没有 CCB，你可能希望为你的项目建立一个 CCB。\n\n基础 CCB 将批准权平均分配给项目中的关键利益相关者。复杂的项目或涉及某一业务领域多于其他领域的项目可能需要倾向于该业务部门的批准权。例如，假设你正在为人力资源部门实施一个新的招聘软件程序。提交了一个与招聘业务流程相关的变更请求，该请求主要影响人力资源部门。在这种情况下，人力资源利益相关者在变更请求的决策上应该比其他利益相关者拥有更多发言权。\n\
  \n通常，委员会按定期间隔召开会议。变更请求和影响分析被提交给委员会审查，他们有权批准、拒绝或延迟请求。你应该在表 9.1 所示的变更请求日志中记录他们的决定。\n\
  \n\n\n\n为紧急变更建立单独的程序至关重要。这应该包括对紧急情况的描述和定义、项目经理在这种情况下的权限级别，以及变更实施后报告的流程。这样，当紧急情况发生时，预设的程序允许项目经理现场实施变更。这始终需要向\
  \ `CCB` 进行跟进并完成正式的变更请求，即使是在事后。\n\n### 实施变更\n\n当变更请求获得批准后，你需要实施该变更。这可能涉及进度调整、资源变更或额外的资金。根据变更的复杂程度，你可能需要与项目团队协调活动，并在适当的时间安排变更。如果变更发生在项目的后期阶段，请务必执行风险管理流程，因为变更可能会引入新风险的可能性。你需要识别新风险，将它们记录在风险登记中，确定它们的风险分，并在适当的情况下为它们制定响应计划。\n\
  \n### 验证变更\n\n一旦实施了变更，你需要验证变更是否已经执行，并且符合变更请求的要求。你将检查变更的质量，以确保其执行准确且完整。如果存在问题，你可能需要实施回滚计划并撤销变更，然后评估为什么变更没有按计划运行。\n\
  \n### 更新项目管理计划\n\n项目的变更需要更新受影响的项目文档，包括但不限于项目范围说明、预算、进度表、风险登记表和质量计划。（第 10 章将涵盖更多关于质量的内容。）\n\
  \n更新项目计划文档是一个重要但有时会被忽视的步骤。如果你的项目时间线被延长，如果不对所做的变更进行记录，这些变更在未来可能会被遗忘。多个项目经理可能会继继离任，如果没有变更记录，你可能会让未来的项目经理、项目以及整个组织面临风险。更新项目文档的另一个关键原因是，这样你就能拥有项目的准确记录，并可以将这些文档作为未来性质相似项目的起点。在项目结束时，进行教训总结活动时，你也会使用这些文档。\n\
  \n在更新项目文档时，请务必执行版本控制。这样，你就能确保自己始终在使用最新版本的文档工作。例如，如果进度表之前发生过变更，现在提交了一个会影响进度的新请求，你将希望确保正在更新的是最新版本的进度表。许多项目管理软件和文档存储库程序都会自动为你执行版本控制。如果你的组织没有实现此功能，你可以通过几种方法完成版本控制。在文档名称中包含版本号，例如\
  \ `Schedule_v1`，或者包含日期和时间 `Schedule_2018-02-16`。\n\n### 沟通变更\n\n你的变更流程的一部分应包含沟通计划。变更应该告知赞助人、利益相关者项目团队成员。这可以通过多种方式实现，最有效的方法之一是在项目状态会议上。\n\
  \n项目状态会议通常在执行阶段启动，以让利益相关者了解进展。变更请求应该是这些会议的常规议程项目。还应该审查变更日志，以讨论在上报告期内实施的变更以及计划在下一阶段实施的变更。\n\
  \n## 组织变更类型\n\n范围、进度和成本不是影响项目的唯一变更。组织变更可能对项目产生重大影响。让我们来看看 CompTIA Project+ 考试目标中列出的一些组织变更。\n\
  \n**业务合并/收购** 以合并或收购形式出现的变更可能会导致项目变更，有时甚至会导致项目取消。对于考试来说，理解 `merger`（合并）和 `acquisition`（收购）之间的区别至关重要。合并是指两家企业结合在一起，作为一个组织开展业务。一旦合并完成，它们就变成实体。收购是指一家企业接管另一家企业。执行收购的组织拥有权力和权威，并成为两家组织的决策者。合并或收购可能会改变项目的整体目标和任务。\n\
  \n**业务拆分** `demerger`（拆分）或 `split`（分裂）是合并或收购的反面。合并或被收购的组织决定拆分成独立的实体。拆分或分裂也可能改变项目的整体目标，或者可能导致项目取消。\n\
  \n**业务流程变更** `Business process changes`（业务流程变更）通常发生在组织内部。业务流程变更的示例是将以前通过纸质执行的过程自动化。如果你的项目与此过程有任何关系或受到该过程的影响，那么变更就会向你走来。\n\
  \n**内部重组** `reorganization`（重组）可能会影响分配给你的项目并负责项目的资源。这可能会延迟进度，特别是当你不再拥有原计划用于项目活动的资源时。你需要时间来与新经理协商资源的可用性。\n\
  \n**搬迁** `relocation`（搬迁）涉及组织或组织部分的物理移动，并可能影响你的项目。分配给项目的资源（包括物理资源和人力资源）可能是搬迁的目标。\n\
  \n**外包** `Outsourcing`（外包）是指组织使用外部资源来执行业务流程和任务。外包通常涉及聘请外部公司来执行业务功能或任务，如工资发放、信息技术、安全、清洁服务等。例如，外包项目团队成员（通过引入顾问协助工作）可能会改变团队的构成。当有外部成员时，你应该注意团队的凝聚力，并确保在冲突发生前将其解决。\n\
  \n## 采购规划\n\n`Procurement planning`（采购规划）是识别项目所需的、从组织外部购买的商品和服务的过程。如果你的项目不需要任何外部资源，你就不需要采购计划。\n\
  \n在考虑采购规划过程时，你应该使用的早期技术之一是考虑应该自制还是购买项目所需的商品和服务。`Make-or-buy analysis`（自制或购买分析）决定了内部生产所需资源还是从组织外部采购更具成本效益。在使用自制购买分析技术时，你应该包含直接成本和间接成本。直接成本是直接归属于项目的成本，例如生产资源所需的成本。间接成本是与管理费用、管理和持续维护成本相关的成本。在决定购买设备还是租赁设备更具成本效益时，你也可以使用自制购买分析。自制购买分析中需要考虑的其他因素包括能力、技能组、可用性和公司商业秘密。\n\
  \n\n\n\n采购过程非常复杂，并且通常涉及法律部门。许多组织都设有采购部门，负责管理该流程的所有方面。如果你的组织也是如此，你将需要确保自己理解必须遵循的表格和流程，否则可能会导致重大的进度延误。大多数采购部门都是高度流程驱动的，如果你在过程中漏掉了某些环节，采购人员可能选择（也可能选择）不留情面，伸手帮助你完成表格审批。\n\
  \n作为项目经理，你就是项目货物和服务的买方，因此我将从买方的角度来介绍采购过程。销售商品或服务的组织被称为供应商、卖家、供货商、顾问或承包商。\n\n接下来将讨论你可能需要采购货物或服务的典型领域：\n\
  \n### 设备\n对于某些项目，设备的需求可能相当容易确定。如果你正在开发一个需要新硬件的应用程序，你将需要从公司外部获取硬件。如果你正在从事一个需要你组织通常可以提供的设备的项目，那么你将需要为项目所需的任务和时间段预留这些设备。\n\
  \n### 人员增援\n人员增援的出现可能有多种原因。也许你的组织缺乏某些领域所需的专业知识或技能。或者，可能有其他关键项目预留了你项目所需的相同资源。具有时间限制的项目可能需要比当前可用更多的资源。合同资源可以帮助填补这一空白。\n\
  \n人员增援的范围从聘请供应商运行整个项目，到聘用特定资源来执行某些任务不等。根据我的经验，大型、复杂的项目通常需要人员增援。\n\n### 其他货物和服务\n\
  你的组织通常不生产或不备货的货物和服务是采购的良好候选对象。你可能还会发现，某些项目交付物通过从组织外采购是最好的。\n\n采购规划从决定在组织外采购货物或服务开始。一旦做出了决定，你就需要确定哪种类型的采购工具最适合你所需的购买。一个简单的采购订单可能足够，或者你可能需要一份合同。\n\
  \n### 工作说明书 (SOW)\n如果你正与供应商合作执行项目的部分或全部工作，让他们确切知道你要求他们做什么至关重要。`statement of work\
  \ (SOW)` 详细说明你想要采购的货物或服务。在许多方面，它与项目范围说明相似，但它侧重于被采购的工作。它包含了项目描述、主要交付物、成功标准、假设和约束条件。项目范围说明是编写\
  \ `SOW` 的良好起点。\n\n项目经理应该参与创建 `SOW` 的过程，以确保项目要求的准确性。供应商使用 `SOW` 来确定他们是否有能力生产交付物，并确定他们对竞标你的项目的意向。`SOW`\
  \ 必须非常清晰和精确。`SOW` 中任何模糊之处都可能导致交付物不尽人意。\n\n许多组织都有创建 `SOW` 的模板。这确保了所有要求的项目都得到涵盖，并为供应商提供了一致的信息。一旦\
  \ `SOW` 完成，你就可以邀请供应商对该工作进行招标了。\n\n### 供应商招标\n`Solicitation`（招标）是获取供应商响应以根据 `SOW`\
  \ 记录的文档来完成项目工作的过程。通常，会准备一份采购文件来通知潜在卖家有关即将开展的工作。你可以通过几种方式准备招标通知，最常见的如下：\n\n#### 信息征询\
  \ (RFI)\n当你需要收集有关要采购的货物或服务的更多信息时，使用 `RFI`。这个过程将让你对能够提供这些货物或服务的提供者或承包商的数量有所了解，并了解成本。当你对成本未知且需要对货物或服务进行估算时，使用\
  \ `RFI` 或 `RFQ`。\n\n#### 报价请求 (RFQ)\n`RFQ` 与 `RFI` 类似。它们有相同的目的，大多数组织在确定估算时会使用这两种采购方法中的一种。\n\
  \n#### 方案请求 (RFP)\n当你准备好采购并开始工作时，提交 `RFP`。这个过程包括提交 `SOW`、接收来自供应商和供货的的、评估响应并做出选择。\n\
  \n`RFIs` 和 `RFQs` 可以互换使用，但在不同组织中可能有不同的含义，因此请确保你根据组织的流程理解应该使用哪种文件。无论这些文件称为什么什么，它们都应该包含你的\
  \ `SOW`、关于响应如何格式化和交付的信息，以及必须提交响应的日期。潜在供应商还可能被要求进行正式演示，或者被要求提交标书。\n\n大多数采购流程允许在供应商完成\
  \ `RFP` 之前与潜在供应商举行会议；这被称为 `bidder conference`（投标人会议）。这种会议通常在 `RFP` 发布后立即举行，所有潜在供应商都受邀参加会议，以提问并澄清他们可能在\
  \ `RFP` 中发现的问题。投标人会议有助于确保供应商准备出针对项目要求的响应。\n\n在发放采购文件（或更早）时，你需要开发选择委员会将用于评估你收到的标书、报价或提案的标准。\n\
  \n### 供应商选择标准\n大多数组织都有采购部门来协助你进行供应商招标和选择。他们将就你需要提供的信息为你提供建议，并通常会指派团队成员来管理你项目的供应商选择过程和合同。某些组织有批准的供应商列表，这些供应商已经满足了公司与其开展业务所需的各项基本标准。如果是这样，你的招标和选择过程将变得更容易，因为你将与预先批准的供应商合作，他们已经跨越了继续进行所需的几项采购障碍。\n\
  \n如果你负责供应商选择，你将需要制定在评估供应商标书或提案时使用的标准。提前与赞助人和其他关键利益相关者商定谁将参与供应商提案的评审和选择是有帮助的。这个小组应该作为一个团队制定选择标准，并提前就标准的权重达成共识。以下是你在评估标书和提案时应该考虑的某些标准：\n\
  \n*   供应商对项目需求和要求的的理解\n*   成本\n*   保修期\n*   供应商执行项目工作的技术能力\n*   参考案例\n*   供应商在类似规模和范围类似项目中的经验\n\
  *   供应商的项目管理方法\n*   供应商公司的财务稳定性\n*   知识产权和专有权\n\n\n\n\n\n你可以使用多种技术来评估提案，包括加权评分系统、筛选系统、卖家评分系统、独立估算等。最常用的方法之一是使用加权评分模型或系统。其理念是，你用于评估供应商的每项标准都将被分配一个权重。然后，为供应商的每个评估要素给出分值，并将权重乘以得分以得出总分。表\
  \ 9.2 显示了使用之前提到的某些评估标准的加权评分模型示例。分值范围在 1 到 5 分之间， 5 分是供应商可以获得的最高分。你将每个元素的权重乘以得分，然后求和，以得出每个供应商的总分。使用这种选择方法时，你几乎总是会选择得分最高的供应商。\n\
  \n| 标准 | 权重 | 供应商 A 得 | 供应商 A 总计 | 供应商 B 得 | 供应商 B 总计 |\n| --- | --- | --- | ---\
  \ | --- | --- |\n| 理解需求 | 5 | 2 | 10 | 4 | 20 |\n| 成本 | 3 | 3 | 9 | 4 | 12 |\n|\
  \ 经验 | 4 | 1 | 4 | 2 | 8 |\n| 财务稳定性 | 3 | 4 | 12 | 3 | 9 |\n| 最终加权得分 | | | 35 |\
  \ | 49 |\n\n`表 9.2` 加权评分模型\n\n在这个示例中，供应商 B 的得分最高，是你应该选择的供应商。\n\n### 合同类型\n\n`contract`（合同）是一种法律上的、`相互约束性文件`，描述了将提供的商品或服务、商品或服务的成本以及任何违约行为的罚金。大多数合同属于以下类别之一：固定价格合同、成本报销合同和工时材料合同。让我们在这里详细查看每种类型：\n\
  \n**固定价格合同** `fixed-price contract` 规定了提供商品或服务的固定费用或价格。当产品定义非常明确且工作说明清晰明了时，这种类型的合同效果最好。对于定义不明确或从未做过的产品或服务使用固定价格合同，对买方和卖方都是风险的。这种合同对卖家来说风险最大。如果项目过程中出现问题，且完成任务的时间比预期长，或者他们提供的货物无法及时获得，则卖家将承担支付完成任务所需的额外工资或支付未时交货罚金的负担。\n\
  \n**成本报销合同** `cost-reimbursable contract` 报销卖家与生产合同概述的商品或服务相关的所有允许成本。这种合同对买方来说风险最大，因为在项目完成之前总成本是未。这种合同的优点是买方可以轻松更改范围。\n\
  \n**工时材料合同** `time and materials` `contract` 是固定价格合同和成本报销合同的结合体。买方和双方同意一个单价（例如程序员的小时率），但总成本是未知的，将取决于生产产品或服务所花费的时间。这种合同通常用于人员增补，即引入合同工来执行项目中的特定任务。\n\
  \n## 以合作伙伴和供应商为中心的文档\n\n除了上述提到的文档外，组织可能使用其他类型的文档来管理合作伙伴关系或供应商关系。让我们简要查看每种。\n\n**保密协议**\
  \ `Nondisclosure agreements (NDA)`（保密协议）用于组织聘请外部实体服务，并确保敏感信息或商业机密信息不会在组织外共享。`NDA`\
  \ 确保所讨论、发现或开发的内容保留在组织内部。\n\n**停止函** `cease-and-desist letter`（停止函）通知对方停止（cease）他们正在进行的活动，并且不再这样做（desist）。例如，停止函可能会发送给违反版权法的人员。\n\
  \n**意向书** `letter of intent`（意向书）概述了双方在签订合同或其他相互约束性协议之前的意图或行动。它是一份可以协商的文件，可以被视为就条款和条件达成一致的协议。\n\
  \n**谅解备录 (MOU)** `memorandum of understanding (MOU)`（谅解备录）是一种协议，可能概述两个或多个双方之间特定的性能标准或其他行动。当双方无法建立法律协议时，使用\
  \ `MOU`。例如，两个或多个政府机构可能有一份 `MOU`，描述它们之间的行动、服务或性能标准。政府机构之间不能像你对未按合同条款履供应商那样在法律上追究责任。合同下任何一方的不履约在法院中是可以强制执行的。而\
  \ `MOU` 不具有法律强制执行。\n\n**服务水平协议 (SLA)** `service level agreement (SLA)`（服务水平协议）定义了两个或多个双方之间的服务水平性能预期。例如，技术部门可能建立了\
  \ `SLAs`，概述他们将多快响应关键服务台工单。\n\n**采购订单 (PO)** `purchaser order (PO)`（采购订单）通常由买方编写，描述了所购商品或服务的规格、数量和价格。一旦\
  \ `PO` 被卖家接受，它就是一份具有法律约束力的文件。\n\n**保修** `warranty`（保修）通常与设备、材料、软件或供应品有关。它是产品将符合预期并按照规定运行的保证。`warranty`\
  \ 通常在指定时间内有效，并在结束后过期。\n\n## 敏捷项目管理\n\n`Agile project management`（敏捷项目管理）是一种通过小、增量的工作来管理项目的方法，这些工作可以被轻松分配、管理并在称为\
  \ `iteration` 或 `sprint` 的短时间内完成。迭代或冲刺（术语可以互换）总是时间限制的。通常，一个冲刺是两周的时间，但可以是团队定义并同意的任何短时间。冲刺的目标是在冲刺结束时产生一个交付物，或交付物的实物部分。\n\
  \n敏捷方法有很多优点，其中最大的优点之一是利益相关者的高度参与。这是一种灵活且高度互动的方法。它鼓励团队内部及之间大量的沟通。敏捷团队由几个成员组成：Scrum\
  \ 经理、产品负责人、利益相关者和团队成员。以下是每个人的简要描述。\n\n**Scrum Master** `Scrum master` 协调冲刺的工作。他们还在团队和可能阻碍处理当前工作的干扰因素之间起到隔离作用。Scrum\
  \ Master 是协调者，并帮助他人了解敏捷流程。他们协助产品负责人维护待办列表、确定工作优先级并定义工作何时完成。Scrum Master 是协调者而不是经理。项目团队成员不向\
  \ Scrum Master 汇报。\n\n\n\n\n\n# 产品负责人 (Product Owner)\n`product owner` 代表利益相关者，是利益相关者与\
  \ Scrum 经理之间的联系人。他们代表业务部门、客户或产品的最终用户发言，并被视为“客户的声音”。团队中应该只有一个产品负责人。与利益相关者沟通是产品负责人的项关键责任。他们传达进度和已实现的里程碑。他们确定项目范围、进度表，并申请完成项目工作所需的资金。他们管理并优先处理积压列表（backlog），这本质上是一个任务或工作组件列表。\n\
  \n# 利益相关者 (Stakeholders)\n利益相关者是对项目或项目结果有利益关系的人。他们与产品负责人对接，由负责人告知他们工作进度。\n\n# 团队成员\
  \ (Team Members)\n团队成员负责完成积压项。他们根据工作的优先级和自己的技能选择任务。他们对工作进行估计，并承担足够的任务填充冲刺周期。敏捷团队是自导、自组织和自管理的。\n\
  \n## 冲刺计划 (Sprint Planning)\n冲刺是一个时间限制的工作周期，始终从`sprint planning meeting`开始。在会议期间，团队成员从积压列表中选择在冲刺期间工作的项。`backlog`是项目的需求列表（包括功能性和非功能性需求）。产品负责人根据业务需求、风险和对组织的价值对积压项进行优先级排序。Scrum\
  \ 团队成员将大型需求分解为可以在一个冲刺内完成的可管理工作部分。\n\n在每个冲刺的开始时都会审查积压列表，可以引入新需求、对现有需求进行更改，或者可能完全删除某些需求。产品负责人通常决定是否应从积压列表中添加或移除需求。团队成员选择在冲刺期间处理哪些积压项，以及在冲刺期间可以完成多少工作。每日站会（下文讨论）在冲刺期间的每天举行。\n\
  \n冲刺项目可以通过白板上的便利签进行轻松管理。积压项（也称为用户故事）列在第一列。下一列显示在冲刺期间将处理的积压项，随后是记录工作进度或阶段的列。最后是一列用于已完成的工作。表\
  \ 9.3 是一个 Scrum 板的示例。\n\n| 用户故事 | 本冲刺的任务 | 进行中 | 评审中 | 已完成 |\n| --- | --- | ---\
  \ | --- | --- |\n| 故事 1 | 故事 1.1 | 故事 1.1 |  |  |\n| 故事 1 | 故事 1.2 |  | 故事 1.2 |\
  \  |\n| 故事 2 | 故事 2.1 |  |  | 故事 2.1 |\n| 故事 3 | 故事 3.1 | 故事 3.1 |  |  |\n\n**表\
  \ 9.3**](#c09.xhtml_tableanchor9-3) 示例 Scrum 板\n\n有很多软件可以帮助以更自动的方式管理为下次冲刺选择的积压项。软件还可以创建`burn-down\
  \ chart`（燃尽图）。燃图显示了冲刺剩余的工作量（或剩余时间）。它在横轴显示冲刺的时间段（通常以天表示），在纵轴显示积压项（可以用天或小时表示）。每天结束时，团队成员更新对剩余工作量的估计，从而更新燃图。团队成员和利益相关者可以直观地看到冲刺中剩余的工作量。图\
  \ 9.1 显示了燃图的简化示例。\n\n![图：剩余努力天数（0-10）与冲刺间隔天数（0-10）对比，有一条从 y 轴 10 到 x 轴 10 的曲线，分别代表计划和完成的积压项。](img/c09f001.jpg)\n\
  \n**图 9.1**](#c09.xhtml_figureanchor9-1) 示例燃图\n\n## 每日站会或 Scrum 会议 (Daily Standups\
  \ or Scrum Meetings)\n`Daily standups`或`Scrum meetings`应每天在同一时间、地点举行，并且应限制时间，通常不超过\
  \ 15 分钟。团队成员必须准备好在每次会议上讨论以下三个问题的答案：\n\n* 我昨天完成了什么？\n* 我今天将做什么？\n* 我是否有任何阻碍工作的障碍或问题？\n\
  \n站会是敏捷过程中的重要元素。它们让团队保持信息同步，并提醒 Scrum 经理完成任务的任何障碍。\n\n## Scrum 回顾 (Scrum Retrospective)\n\
  在冲刺结束后，将与团队成员、Scrum 经理和产品负责人举行 Scrum `retrospective`会议，确定以下内容：\n\n* 整体进度\n* 已完成的工作\n\
  * 已计划但未完成的工作\n* 需要转入下一次冲刺的工作\n* 审查经验教训，以确定如何改进下一次冲刺及未来的冲刺\n\n如果在当前冲刺期间未完成积压项，你将将在下一次冲刺计划会议上讨论这些。产品负责人将使用此会议的信息告知项目利益相关者整体进度。\n\
  \n## 其他方法 (Other Methodologies)\n为了考试，你还应该了解其他项目管理方法。Scrum 是用于软件开发项目的原始敏捷形式。它遵循本章讨论的相同流程。\n\
  \n`Waterfall`（瀑布模型）是一种在项目的每个阶段在移动到下一个阶段之前完整完成该阶段的方法。这可能是一种高风险的方法，因为它为添加新需求或功能留下的空间很小，而且在项目结束之前不会对最终产品进行评审或测试。产品的最终验收也发生在所有交付物完成后后的项目结束时。在敏捷或\
  \ Scrum 中，整个过程中都有持续的评审和批准，你会立即知道自己是否偏离了轨道。你可以使用迭代瀑布方法，通过在给定时间范围内完成工作组件来降低风险，但它仍然比敏捷方法效率低且无效。对于考试，你应该知道瀑布方法和敏捷方法各使用迭代方法。\n\
  \n`PRINCE2` 代表受控环境项目版本 2，它将质量管理整合到项目管理过程中。它是一种全面的方法并受到英国政府的支持。它是一种倾向将项目分为多个阶段的方法。\n\
  \n## 总结 (Summary)\n正如我们在本章早期讨论的，情况在变化。变化由于许多原因产生，可能采取纠正措施、预防措施和缺陷修复的形式。集成变更控制系统管理变更请求，确定变更的全局影响，并在发生更改时更新项目计划的所有受影响部分。通常，会建立变更控制委员会来评审并批准、拒绝或延迟变更请求。\n\
  \n集成变更控制查看变更的整体影响，并管理项目计划中所有元素的更新。范围变更控制包括理解范围变更的影响、采取适当行动，并管理一个用于评审和批准或拒绝范围变更请求的过程。\n\
  \n组织变更也会对你的项目以及组织本身产生影响。内部重组、合并收购和外包都可以给项目带来变化。\n\n当你从组织外部为项目购买商品或服务时，将使用采购流程。你可能会使用\
  \ `RFI`、`RFQ`、`RFP` 或 `PO` 来采购商品和服务。有时，你可能还会使用组织其他部分的资源，这些资源对其使用需要正式协议，例如 `MOU`。\n\
  \n\n\n\n\n有多种方法可以用于项目管理。敏捷方法涉及持续的需求收集，具有迭代性质，并且具有高度的交互性。它由自我形成和自我管理的团队组成。\n\n##\
  \ 考试要点\n\n**描述项目管理计划。** 项目管理计划是最终的、经过批准的、记录在案的计划，用于执行以及监控控制阶段衡量项目进度。\n\n**描述变更管理过程的要素。**\
  \ 变更管理过程的要素包括识别和记录变更（使用模板和变更日志）、评估影响、获得 `CCB` 的批准、实施变更、验证变更、更新项目管理计划文档以及根据需要进行沟通。\n\
  \n**解释 CCB 的作用。** `变更控制委员会`负责审查、批准、拒绝或延迟变更请求。\n\n**能够列出常见项目变更的类型。** 项目变更类型包括时间线、资金、风险事件、需求、质量、资源和范围变更。\n\
  \n**能够列出组织变更的类型。** 组织变更类型包括业务合并、收购、拆分、分裂、业务流程变更、内部重组、搬迁和外包。\n\n**能够描述自制自购分析。** 执行自制自购分析是为了确定自制或购买项目所需商品和服务的成本效益。\n\
  \n**能够列出合同的类型。** 合同类型包括固定价格、成本实报和工时与材料合同。\n\n**能够列出以供应商为中心的文档类型。** 供应商文档类型包括保密协议、停止函、意向书、工作说明书、谅解备忘录、服务水平协议、采购订单和保修。**描述敏捷方法。**\
  \ 敏捷是一种管理项目的迭代方法，能够灵活适应新和变化的需求。它提供了持续的需求收集和持续反馈。敏捷团队是自我组织和自我管理的。\n\n**描述敏捷项目管理团队的三个主要角色。**\
  \ 产品所有者是客户的声音，他们决定积压工作（也称为用户故事）并对积压工作进行排序。`Scrum master` 消除碍团队履行职责的障碍，并提供有关敏捷流程的教育。项目团队在冲刺期间处理积压事项，并参与每日站会。\n\
  \n**列出敏捷方法的要素要素。** 敏捷使用每日站会（也称为 `Scrum meetings`）来评估进度。冲刺计划在每个冲刺开始时进行，以确定要处理哪些积压事项。冲刺结束时举行回顾会议，以确定完成了哪些工作，并对冲刺进行教训总结。燃尽图用于直观显示冲刺期间的工作进度。\n\
  \n## 关键术语\n\n在参加考试之前，请确保你熟悉以下术语：\n\n* 收购 (acquisition)\n* 敏捷项目管理 (Agile project\
  \ management)\n* 积压工作 (backlog)\n* 投标人会议 (bidder conference)\n* 燃尽图 (burn-down chart)\n\
  * 业务流程变更 (business process change)\n* 停止函 (cease-and-des letter)\n* 变更控制委员会 (change\
  \ control board)\n* 变更控制系统 (change control systems)\n* 合同 (contract)\n* 纠正措施 (corrective\
  \ actions)\n* 成本实报合同 (cost-reimbursable contract)\n* 每日站会 (daily standups)\n* 缺陷修复\
  \ (defect repairs)\n* 拆分 (demer)\n* 固定价格合同 (fixed-price contract)\n* 迭代 (iteration)\n\
  * 意向书 (letter of intent)\n* 自制自购分析 (make-or-buy analysis)\n* 谅解备忘录 (memorandum of\
  \ understanding (MOU))\n* 合并 (merger)\n* 保密协议 (nondisclosure agreements (NDA))\n\
  * 外包 (outsourcing)\n* 预防措施 (preventive actions)\n* PRINCE2\n* 采购规划 (procurement\
  \ planning)\n* 产品所有者 (product owner)\n* 采购订单 (purchase order (PO))\n* 回归计划 (regression\
  \ plan)\n* 搬迁 (relocation)\n* 重组 (reorganization)\n* 回顾 (retrospective)\n* 逆变更 (reverse\
  \ changes)\n* Scrum Master (Scrum master)\n* Scrum 会议 (Scrum meetings)\n* 服务水平协议\
  \ (service level agreement (SLA))\n* 征求 (solicitation)\n* 分裂 (split)\n* 冲刺 (sprint)\n\
  * 冲刺计划会议 (sprint planning meeting)\n* 工作说明书 (statement of work (SOW))\n* 工时与材料 (time\
  \ and materials)\n* 客户声音 (voice of the customer)\n* 保修 (warranty)\n* 瀑布 (waterfall)\n\
  \n## 复习题\n\n1. 你是一个开发新软件应用程序项目的项目经理。你刚刚获知其中一名程序员正在为其中一个交付物添加几个新功能。采取的最最佳行动是什么？\n\
  \    1. 对进度表和成本基准进行任何必要的调整，并告诉程序员未来的任何变更必须经过你的批准。\n    2. 要求该程序员删除新功能的代码，因为他已经超出了原始范围说明的边界。\n\
  \    3. 联系相关的职能经理，请求更换该程序员。\n    4. 确定新功能请求的来源，并通过变更控制过程处理此变更，以确定变更的影响并获得更改范围的正式批准。\n\
  \n2. 下列哪项不是变更的类型？\n    1. 纠正措施\n    2. 缺陷修复\n    3. 性能纠正\n    4. 预防措施\n\n3. 该实体负责审查变更请求、审查变更影响的分析，并决定变更是否被批准、拒绝或推迟。\n\
  \    1. CAB\n    2. CCB\n    3. CRB\n    4. TRB\n\n4. 如果变更控制委员会 (`CCB`) 无法及时召开会议，以下哪项应作为变更控制系统的一部分而建立？\n\
  \    1. 紧急变更请求程序\n    2. 分析变更影响的程序以及确定哪些变更可以实施的预设标准\n    3. 在变更请求日志中记录变更的过程\n  \
  \  4. 与利益相关者的协调和沟通\n\n5. 变更请求提交后，在由变更控制委员会审查之前，以下所有步骤中，除了哪一个？\n    1. 将变更请求记录在变更日志中。\n\
  \    2. 进行变更影响分析。\n    3. 分析项目的特定要素，例如额外的设备需求、资源小时、质量影响等。\n    4. 更新相应的项目计划文档以反映变更。\n\
  \n6. 利益相关者来找你，他们他们更改范围。在同意变更之前，你应该做哪些事？选择两项。\n    1. 确定哪个项目限制（时间、预算、质量）对利益相关者最。\n\
  \    2. 与赞助人讨论建议的范围变更。\n    3. 询问团队成员他们对范围变更的看法。\n    4. 定义你可以向利益相关者提供的替代方案和权衡。\n\
  \    5. 实施变更。\n\n7. 你刚刚收到了团队的最新状态更新。根据目前的进度，系统测试预计比计划推晚三周。如果发生这种情况，用户验收测试将延迟三周开始，项目将无法在计划结束日期完成。客户提前几周安排了用户验收测试的参与者。最佳行动是什么？\n\
  \    1. 告诉测试团队系统测试必须在预定日期结束，他们对测试结果的准确性负责。\n    2. 与测试团队会面确定延迟的原因。如果你确定在分配的时间内没有足够的测试人员完成所有场景，请与赞助人合作获得额外的测试人员以按计划完成系统测试。\n\
  \    3. 将变更请求提交给 `CCB`，如果获得批准，则重新设定进度基准。\n    4. 将系统测试延迟的问题上交给赞助人，由他们决定采取什么行动。\n\
  \n\n\n\n\n# 8. 在内部生产货物或服务与组织外部采购之间权衡的技术是什么？\n\n1. 成本估算\n2. 供应商选择标准\n3. 人员增援\n4.\
  \ 自制或购买分析\n\n# 9. 你的项目由于组织变更面临取消的危险。尽管你的执行经理反对，你旧公司的几个部门经理已被裁员，并被新组织的管理团队取代。这种场景描述的是哪种情况？\n\
  \n1. 你的公司经历了另一个组织的拆分。\n2. 你的公司与另一个组织合并。\n3. 你的公司被另一个组织收购。\n4. 你的公司从另一个组织分拆。\n\n\
  # 10. 该文档描述了你想要从组织外部采购的货物或服务。\n\n1. RFQ（报价请求）\n2. RFP（征求书）\n3. RFI（信息征询）\n4. SOW（工作说明书）\n\
  \n# 11. 你刚刚发布了 RFP，并邀请供应商参加会议以就项目工作进行提问。这种会议称为什么？\n\n1. RFP 会议\n2. 投标人会议（Bidders\
  \ conference）\n3. 采购沟通会议\n4. 卖家会议\n\n# 12. 这种供应商选择方法权衡了 RFP 和 SOW 中的各种标准，对每个供应商的各项标准进行评分，并确定每个供应商的总分。\n\
  \n1. 加权评分模型\n2. 筛选系统\n3. 卖家评分系统\n4. 独立估算\n\n# 13. 这种类型的合同对买方来说风险最高。\n\n1. 时间和材料\n\
  2. 固定价格\n3. 固定价格加激励\n4. 成本报销制\n\n# 14. 这种类型的合同为工作或货物分配了单价，但总成本是未知。\n\n1. 时间和材料\n\
  2. 固定价格\n3. 固定价格加激励\n4. 成本报销制\n\n# 15. 你知道项目管理计划由若干项目文档组成，一旦获得批准，将作为项目的基线。关于项目管理计划，以下所有描述都是正确的，除了哪一项？\n\
  \n1. 它在执行阶段和监控控制阶段使用，以确定项目是否处于良好运行。\n2. 它在采购过程中用于与供应商进行谈判。\n3. 它是一个通信工具。\n4. 它在请求变更时使用，以确定变更是否符合项目的原始目标和目的。\n\
  \n# 16. 此人负责管理积压列表、优先排序积压列表并向利益者更新团队进度。\n\n1. 产品所有者（Product owner）\n2. Scrum 经理\n\
  3. Sprint 所有者\n4. 项目经理\n\n# 17. 在这种会议中，团队成员各自描述他们昨天完成了什么、今天将要做什么，以及面临了哪些障碍。请选择两个。\n\
  \n1. Sprint 计划会议\n2. 每日站（Standup meeting）\n3. Scrum 会议\n4. 项目状态会议\n5. 利益者会议\n\n\
  # 18. 这两种项目管理方法使用了迭代方法。请选择两个。\n\n1. PRINCE2\n2. 六西格玛（Six Sigma）\n3. 瀑布\n4. 敏捷（Agile）\n\
  5. 关键路径\n\n# 19. 你的项目赞助者指示使用一种允许持续反馈并使用自组织、自导团队的方法论。这描述的是哪种方法论？\n\n1. PMI®\n2. PRINCE2\n\
  3. 敏捷（Agile）\n4. 瀑布\n\n# 20. 什么是积压列表（Backlog）？请选择两个。\n\n1. 积压列表是项目特定阶段待完成的剩余工作。\n\
  2. 积压列表用于敏捷方法论，团队成员在 Sprint 计划会议上选择积列表项。\n3. 积压列表是由产品所有者优先排序的工作列表，但团队成员选择要执行的积列表项。\n\
  4. 积压列表用于敏捷方法论，团队成员在 Sprint 回顾会议上选择积列表项。\n5. 积压列表尚未完成但已安排在特定迭代中的工作。\n\n# 第 10 章\n\
  \n项目工具与文档\n\n### 本章涵盖的 CompTIA Project+ 考试主题包括：\n\n* **4.1 比较和对比各种项目管理工具。**\n  \
  \  * 图表\n        * 直方图（Histogram）\n        * 鱼骨图（Fishbone）\n        * 帕托图（Pareto\
  \ chart）\n        * 运行图（Run chart）\n        * 散点图（Scatter diagram）\n    * 仪表板/状态报告\n\
  \    * 知识管理工具\n        * 内网站点\n        * 互联网站点\n        * Wiki 页面\n        * 供应商知识库\n\
  \        * 协作工具\n    * 性能测量工具\n        * 关键性能指标（KPIs）\n        * 关键性能参数\n      \
  \  * 平衡计分卡\n* **4.2 给定场景，分析以项目为中心的文档。**\n    * 问题日志（Issues log）\n    * 状态报告\n  \
  \  * 仪表板信息\n    * 行动事项\n    * 会议议程/会议纪要\n* **1.3 比较和对比标准项目阶段。**\n    * 收尾\n    \
  \    *过渡/整合计划\n            * 培训\n        * 项目验收\n        * 归档项目文档\n        * 经验教训\n\
  \        * 释放资源\n        * 关闭合同\n\n本章将介绍一些用于告知利益者、记录行动事项和会议纪要，以及分析项目工作性能和结果的项目工具和文档。\n\
  \n随着项目工作的接近尾，你需要回顾经验教训，获得项目的最终批准，归档项目文档，并将项目的最终产品过渡到相应的业务领域。\n\n项目经理遵循流程来正式关闭项目。关于这些额外任务的好消息是，你在项目收尾期间完成的大部分工作将帮助你更好地管理未来的项目。\n\
  \n项目收尾活动无论项目结束的原因是什么，无论你处于项目生命周期的哪一点都适用。即使你的项目被取消，仍然有一个结束流程需要执行。项目收尾的元素之一涉及合同收尾，即对供应商的工作进行正式验收（或拒绝）。\n\
  \n### 项目管理工具\n\n项目经理有许多可用工具帮助分析项目工作并报告进度。根据 CompTIA Project+ 的目标，这些工具包括：\n\n* 项目进度计划软件\n\
  * 图表\n* 仪表板和状态报告\n* 知识管理工具\n* 性能测量工具\n* SWOT 分析\n* RACI 矩阵\n\n我已经讨论了其中几个工具，例如项目进度计划软件、SWOT\
  \ 分析和 RACI 图表。你将在本节中学习剩余的工具。\n\n### 图表\n\n图表在项目管理中用于描述进度、视觉化显示流程流、显示质量值并确定性能问题。CompTIA\
  \ Project+ 考试中列出的图表包括：\n\n* 流程图\n* 直方图\n* 鱼骨图\n* 帕托图\n* 运行图\n* 散点图\n* 甘特图\n\n我在第\
  \ 4 章涵盖了流程图，在第 5 章涵盖了甘特图。接下来是直方图。\n\n#### 直方图\n\n\n\n\n\n`histogram`（直方图）显示变量数据的频率分布。它看起来像柱状图，容易创建和理解。数据可能包括温度、长度、时间、里程、重量、距离等。例如，假设你正在测量生产线上某特定环节的化学水平。你的团队每天测量六次，持续十天。理想范围是每百万部分\
  \ 2 到 4 部分。图 10.1 中的直方图显示了测量的频率及其分布。\n\n![直方图：横轴为 2-20 百万分之一，纵轴为频率 1-7，条形显示了变量数据的频率分布。](img/c10f001.jpg)\n\
  \n**图 10.1 直方图\n\n## 鱼骨图\n\n`fishbone diagram`（鱼骨图）是一种因果图，显示了问题结果与其产生原因之间的关系。该图描绘了问题的每一个潜在原因，以及每个提议解决方案对问题产生的影响。该图也因其开发者石川馨（Kaoru\
  \ Ishikawa）而被称为石川图。头脑风暴会议是构建鱼骨图的极佳方法。参与者可以帮助识别问题的每一个可能原因。假设你的房屋油业务遇到了一些不满意的客户。他们对完工的质量不满意。某些原因可能是材料、执行工作的人、设备故障或工艺问题。图\
  \ 10.2 显示了一个因果图示例。\n\n![鱼骨图显示了材料 A、B、C、设备、人员和工艺导致对油漆工作的不满。](img/c10f002.jpg)\n\n\
  **图 10.2 鱼骨图\n\n## 帕累托图\n\n你可能听过 80/20 法则。意大利经济学家和社会学家维尔弗雷德·帕累托（Vilfredo Pareto）被认为发现了这一规则。他观察到意大利\
  \ 80% 的财富和土地权由 20% 的人口拥有。多年来，其他人证明 80/20 法则适用于许多学科和领域。例如，通常来说，任何金融机构 80% 的存款由其 20%\
  \ 的客户群持有。\n\n适用于问题的 80/20 法则意味着：少数原因（20%）导致了大部分的问题（80%）。你是否在你的项目或部门员工中注意到过这一点？似乎总是只有几个人导致了最大的头疼问题。\n\
  \n`Pareto charts`（帕累托图）以直方图的形式显示，根据随时间变化的对最重要的因素（例如延迟、成本和缺陷）进行频率排序。帕累托的理论是，如果你花费大部分时间解决最重要的问题，就能获得最大的收益。表\
  \ 10.1 中显示的信息绘制在 图 10.3 所示的示例帕累托图中。\n\n| 项目 | 缺陷频率 | 缺陷百分比 | 累计百分比 |\n| --- | ---\
  \ | --- | --- |\n| A | 800 | 33 | 33 |\n| B | 700 | 29 | 62 |\n| C | 400 | 17 |\
  \ 79 |\n| D | 300 | 13 | 92 |\n| E | 200 | 8 | 100 |\n\n**表 10.1 故障频率\n\n![柱状图：缺陷频率为\
  \ 0-1000，纵轴累计百分比为 0-100，横轴为 A-E，条形中 A 最高，并有一条连接 A 和 B 条形点的上升曲线。](img/c10f003.jpg)\n\
  \n**图 10.3 帕累托图\n\n问题根据其频率和缺陷百分比进行排序。图中的缺陷频率以黑色条形显示，缺陷的累计百分比以圆圈的形式绘制。这些问题的排序显示了应该在哪里优先采取纠正措施。你可以从\
  \ 图 10.3 中看到，问题 A 应该受到优先关注，因为解决这个问题将带来最大的收益。\n\n## 运行图\n\n`run chart`（运行图）将随时间观察或收集的数据以折线图的形式显示。随着时间的推移，你将观察到模式和趋势，例如改进（或缺乏改进）。你也可以通过运行图观察积极（或负面）的变化。例如，假设你的组织正在发布一款新产品。他们可能会绘制一段时间内新产品销售金额的图。图\
  \ 10.4 显示了此类数据的示例。\n\n![图：横轴为 1-180 天，纵轴为销售额 10-100 $，有一条带有运行图点的上升曲线。](img/c10f004.jpg)\n\
  \n**图 10.4 运行图\n\n## 散点图\n\n`scatter diagram`（散点图）在图表上绘制两个数值变量，以确定它们之间是否存在相关性。散点图也称为相关性图，通过图上的点显示这两个元素之间的关系。这些变量越接近，它们的关系就越紧密。这种关系通常通过分析来证明或反驳因果关系。例如，也许你的散点图绘制了员工执行某特定任务的能力。他们执行此任务的时间（以月计）作为自变量绘制在\
  \ x 轴上，他们在执行此任务时实现的准确性（以分数表示的因变量）绘制在 y 轴上。散点图可以帮助你确定是否可以证明因果关系（在这种情况下是随时间增加的经验与准确性之间）。散点图还可以帮助你寻找和分析问题的根源。\n\
  \n图 10.5 显示了一个散点图示例。\n\n![散点图：纵轴为分数 25 到 100，横轴为月份，y 轴从 25 开始有散落点，作为散点图的示例。](img/c10f005.jpg)\n\
  \n**图 10.5 散点图\n\n### 仪表板与状态报告\n\n项目经理可以以多种方式分析项目为中心的文档。本节将介绍仪表板、状态报告以及其他项目状态并用更新信息提醒利益相关者的文档。\n\
  \n一旦项目进入执行（Executing）阶段，你就应该定期召开状态会议，并以仪表板报告和状态报告进行补充。`Dashboards`（仪表板）是视觉化项目进度的一种方式，供组织的高管层使用。它们易于阅读，并且通常使用实时信息更新，因此始终保持最新。仪表板通常显示项目最重要的元素，如成本、时间和交付物。信息通常非常简洁且简练。显示这些数据的常见方式是图表、数字和/或状态级指示器（例如红-黄-绿灯）。红色意味着所报告的项目元素出现了问题（可能是预算超支、进度落后等），黄色意味着正向问题方向发展，绿色意味着一切进展按计划进行。\n\
  \n`Status meetings`（状态会议）应在项目期间定期举行。状态会议目的是交换信息并提供有关项目进展的更新信息。你需要定期与利益相关者、赞助人、项目团队成员和客户举行状态会议，以报告项目进展。\n\
  \n\n\n\n\n在每次会议前一或两天发送 `meeting agenda`（会议议程），描述你和其他人将在会议上讨论的话题。议程应列出每个讨论主题、汇报该主题的人员以及每个主题的时间范围。你在这些会议期间报告的内容取决于项目的复杂性以及利益相关者小组的组成。至少，你将需要报告以下项目：\n\
  \n* 项目整体状态\n* 进度更新（包括变更）\n* 里程碑达成情况\n* 预算状态\n* 本期间的变更请求\n* 可能阻碍项目进展的重大问题\n* 主要风险\n\
  * 待办事项\n\n会议期间应记录 `Meeting minutes`（会议纪要），以便记录讨论事项和任何做出的决定。通常，由项目经理主持状态会议，而很难同时主持会议并记录纪要。我建议让团队中的其他人记录会议纪要。`Meeting\
  \ minutes` 应在会议后一或两天内分发给参会人员，并将一份归档在项目文档中。\n\n在状态会议期间记录并报告的另外两个项目是问题和待办事项。让我们接下来查看问题列表。\n\
  \n## 问题列表 (Issues List)\n\n`Issues` 是指可能影响项目、带来风险或延迟或阻止交付物完成而出现的情况。问题应记录在 `issue\
  \ log`（问题日志）中。问题日志的常见元素包括：\n\n* 用于跟踪的标识码\n* 记录问题的日期\n* 问题描述\n* 报告问题的人员\n* 问题负责人（将负责跟进解决的人员）\n\
  * 问题的影响级，通常表示为 `high-medium-low`（高-中-低）\n* 解决问题的行动计划\n* 问题状态\n* 关闭日期\n\n应在问题日志中跟踪问题及其状态和解决方案。请注意，如果不仔细管理，问题日志可能会变成一个难以控制的怪物，每周都会添加新问题，但没有任何问题得到解决。\n\
  \n当你与项目团队一起审查问题日志时，要确保被分配解决问题的人员正在朝着关闭的目标努力。有时项目问题会开放数周甚至几个月，特别是如果你将“我们仍在处理这一项”视为可以接受的进度报告的话。状态应始终包含解决计划和解决问题的目标日期。如果没有进展，可能是责任方需要帮助，或者他们并不理解该问题。可能还需要升级给资助人以克服障碍。\n\
  \n尽管目标是分配所有问题并尽快解决它们，但在某些情况下，你需要对问题进行优先级排序并按顺序处理。如果多个问题需要同一个团队成员或小组，请审查每个问题对项目结果的影响，并建立优先级列表。\n\
  \n## 待办事项 (Action Item)\n\n`Action items`（待办事项）是指通常在项目状态会议上产生、需要跟进或解决的任务。它们通常关于项目，但对项目工作没有直接影响。例如，利益相关者可能会询问在与项目供应商的上一个工作单上花费了多少钱。此待办事项记录在待办事项日志中，其结果将在下一次状态会议上报告。待办事项可以采取多种形式，例如请求额外信息、准备特定主题的简报、联系采购部门人员有关即将进行的招标等。\n\
  \n待办事项日志包含以下元素：\n\n* 标识码\n* 记录行动的日期\n* 待办事项描述\n* 待办事项负责人\n* 待办事项的进度或解决方案\n* 关闭日期\n\
  \n## 状态报告 (Status Reports)\n\n`Status reports`（状态报告）是项目进展的文字总结，比仪表板详细得多。状态报告应根据沟通计划分发，并保留一份在项目记录中。状态报告可能采取几种形式。例如，作为项目经理，你可能要求团队成员向你发送简短的每周状态报告，描述以下事项：\n\
  \n* 自上次报告期以来的进展\n* 本期间预期进展\n* 下报告期预期进展\n* 阻碍工作完成的障碍\n\n这听起来非常像我在敏捷流程中提到的每日站会。根据我的经验，我发现每日站会对于小型项目团队来说更有效，且比书面状态报告提供更多信息。如果你正在管理一个拥有多个项目经理或项目助理及其各自团队的大型项目，书面状态报告更有效，并将帮助你构建利益相关者状态报告。\n\
  \n分发给利益相关者的状态报告应涵盖项目的几个领域。状态报告的某些元素可能包括：\n\n* 自上次报告期以来的进展\n* 本期间预期进展\n* 下报告期的预期进展\n\
  * 项目进度审查（包括计划和实际完成日期）\n* 预算审查\n* 风险审查\n* 进度更新或变更\n* 资源更新或变更\n* 变更请求\n* 高或中等影响问题的审查\n\
  * 注释/评论/公告\n\n在会议结束时留出提问时间。如果你不知道答案，不要装懂。让他们知道你会研究答案并回复他们，然后切实落实。\n\n## 知识管理工具 (Knowledge\
  \ Management Tools)\n\n在整本书中，我讨论了大量的通信、项目文档和其他产物。项目中的文档数量可能让人目应暇，因此我建议建立一种系统的方法来存储和检索这些信息。拥有描述范围、交付物、进度等的项目文档是很好的，但如果你的利益相关者和团队成员不知道在哪里找到这些文档，或不知道如何访问它们，那么它们就像不存在一样。\n\
  \nCompTIA Project+ 目标强调了以下知识管理工具：内网站点、网站、wiki 页面、供应商知识库和协作工具。让我们简要查看每一个。\n\n###\
  \ 内网和外站点 (Intranet and Internet Sites)\n内网是组织内部的，仅供组织内的员工（或授权人员）访问。它们可以在员工内部及之间提供通信机制，并托管存储项目文档的协作站点。\n\
  \n网站是组织外部的，通过防火墙从内网访问。网站为管理项目提供了丰富的信息、协作工具和其他有用项目。\n\n### Wiki 页面 (Wiki Pages)\n\
  Wiki 页面通常是组织内部的。项目文档、变更控制文档和关于项目的通用信息可以发布到 wiki 站点。wiki 站点通常用于特定主题或项目。利益相关者、团队成员和项目经理应获得访问\
  \ wiki 页面的权限以审查内容。某些团队成员根据其角色可能具有更新文档和发布新信息的权限。例如，项目协调员会在项目文档获批后上传并发布。项目进度员将根据已完成的里程碑更新项目进度等。\n\
  \n\n\n\n\n### 供应商知识库\n知识库是关于产品或过程的信息集合，并持续保持更新。供应商知识库包含有关其产品或服务的信息。例如，微软对其产品拥有极其广泛的知识库，允许用户查询“如何做”、产品的各种用途等。\n\
  \n### 协作工具\n协作工具允许项目团队成员在同一份文档上工作，同时进行版本控制，以确保只有最新的文档可供评审。例如，你可能会发布一份工作说明书（SOW），并提醒团队成员你希望他们对文档进行评审并添加内容和修改。协作工具提供了签入和签出流程，以确保团队成员始终在审阅和更新文档的最新版本。\n\
  \n## 使用性能绩效衡量标准\n监控和控制过程组侧重于监控和衡量项目绩效，以识别与项目管理计划的偏差。在这一阶段，你将收集项目数据、对其分析并进行报告。你报告的数据可能包括涉及项目质量、成本、范围、项目进度、采购和风险的信息，并可以以状态报告、进度测量（如关键绩效指标）或预测的形式呈现。\n\
  \n项目管理计划包含了项目管理基准线数据（通常包括成本、进度和范围），你将用这些数据来监控并对比绩效测量。通常，你会在制定计划时建立绩效指标，并在项目工作开始后对其进行衡量。绩效指标以及任何与项目管理计划的偏差都应在项目状态会议上向利益者报告。\n\
  \n### 关键绩效指标\n`key performance indicator (KPI)` 是一个可衡量的值，用于显示项目是否正在实现预期目标。KPI 应该是可衡量的，且适用于项目。例如，你可能有关于项目成本、项目管理流程、供应商绩效等的\
  \ KPI。项目项目中你任何想要衡量的元素几乎都可以成为 KPI。以下是一些更具体的例子：\n\n* 项目成本不得超过预算成本基准线的 5 百比。\n* 质量标准将达到或超过行业标准，偏差控制在\
  \ +/- .03 个标准差以内。\n* 在 6 个月内将新网站的页面访问量增加 10%。\n* 在未来 12 个月内，将社交媒体网站上的共享链接增加 15%。\n\
  * 在未来两年内，使用自助入住的预订数量增加到 70%。\n\n如果你发现 KPI 未能达成，或者发现问题和风险正在升级到失控状态，你需要与项目发起人沟通。没有人喜欢坏消息，但如果你一旦知道事实就尽早呈现出来，情况会好得多。太多的项目经理试图忽略问题并希望项目能够好转——这种情况很少发生。如果你有疑问，请与项目发起人交谈，以便他们在过晚之前干预并提供帮助。\n\
  \n### 关键性能参数\n`Key performance parameters (KPPs)` 与 KPI 类似，但它们用于为系统设定运行目标或性能水平。这些通常表示为系统的最小可接受水平或值。KPP\
  \ 主要由政府实体（如国防部和美国陆军）用于军事系统和设备。\n\n### 平衡计卡\n`balanced score card` 是一种战略管理工具，用于衡量业务为实现其战略目标而使用的活动和过程。它是判断组织绩效是否符合目标的方法。平衡计分卡衡量财务目标、业务流程、创新、客户体验和客户满意度等要素。通常，平衡计分卡方法关注业务的战略领域，并监控少数重要的数据元素。平衡计分卡的衡量结果通常会在整个组织传播，根据我的经验，它们还与个人绩效评估挂钩。\n\
  \n### 项目结束\n你已经到达项目的终点，也到达了项目生命周期的结束。收尾过程是项目生命周期的最后一个阶段，也是最容易忽视的阶段。然而，在收尾阶段你想要完成一些关键活动。在深入这些活动之前，让我们看看结束的特征以及项目结束的原因。\n\
  \n### 收尾的特征\n所有项目在收尾阶段都有一些共同特征。你已经完成了项目的大部分工作——如果不是全部的话——因此未完成项目的概率很低。该过程组的风险也较低，因为工作已经完成。在结束时不太可能发生会导致项目脱离轨道的风险。在收尾过程中，利益者的影响力最小，而项目经理的影响力最大。这一阶段的成本显著降低，因为大部分项目工作和支出已经发生。\n\
  \n所有项目最终都会结束，接下我将介绍几种项目结束的类型。\n\n### 项目结束的类型\n我们通常认为在所有交付物完成后项目就结束了。理想情况下，这是你大多数时候会经历的。项目结束有几个原因，包括但不限于：\n\
  \n* 项目成功完成。\n* 它们演变为持续运营，不再以项目形式存在。\n* 预算被削减。\n* 项目资源被重新分配到其他活动或项目。\n* 客户破产或与另一个实体合并。\n\
  * 在完成之前被取消。\n\n我参与过许多取消结束的项目。这可能由于任何原因引起：项目发起人转向其他任务、预算削减、新管理层上台并改变方向、供应商表现未达到预期等。关于取消，要记住的一点是，当项目被取消时，应该执行所有的项目收尾步骤，以便存档记录并记录取消原因。\n\
  \n我刚才列出的所有项目结束原因（包括取消）都包含四种正式的项目结束类型：\n\n* 增加 (Addition)\n* 饥饿 (Starvation)\n* 整合\
  \ (Integration)\n* 灭绝 (Extinction)\n\n你将在接下来的章节中查看这些结束类型。\n\n#### 增加\n演变为持续运营的项目被认为是由于\
  \ `addition` 而结束的项目；换句话说，它们变成了自己的持续业务部门，或者项目的产物或结果在项目完成之前转入了现有的业务部门。\n\n#### 饥饿\n\
  当资源从项目中被切断或不再提供给项目时，项目在完成所有要求之前就处于“饥饿”状态，你手里留下了一个未完成的项目。`Starvation` 可能由于任何原因发生：\n\
  \n* 其他项目出现并优先于当前项目，从而削减你项目的资金或资源。\n* 客户缩减了订单。\n* 项目预算减少。\n* 关键资源离职。\n\n\n\n\n资源匮乏可能包括削减或扣留人力、设备和物资或资金。在任何情况下，如果你无法获得完成项目所需的人员、设备或资金，项目就会陷入匮乏状态并可能突然终止。\n\
  \n### 集成\n\n当项目的资源——人员、设备和物资——被分配到组织的其他领域或被分配给其他项目时，就会发生 `Integration`（集成）。也许你的组织开始关注其他领域或其他项目，等等你反应过来时，职能经理就会找来取回他们的资源，用于其他更重要的事情。你的项目将因为缺乏资源而结束，因为这些资源被重新分配到了业务的其他领域，或者从你的项目中被抽调并分配到了另一个项目中。\n\
  \n### 终止\n\n这是最好的项目结束类型，因为 `extinction` 意味着项目已经完成并获得了利益者的验收。因此，它不再存在了，因为它有一个确定的结束日期，项目目标已经实现，且项目已经关闭。\n\
  \n现在你已经确定了项目结束的原因，是时候检查项目收尾的步骤并获得对项目的正式书面验收了。\n\n## 项目收尾的步骤\n\n收尾项目涉及几个步骤，如下：\n\n\
  - 获得项目的正式签署和验收\n- 将项目结果移交给运营和维护部门\n- 释放项目资源\n- 关闭合同\n- 执行行政收尾\n- 为未来的项目记录历史信息\n\
  - 进行教训总结\n- 准备项目收尾报告\n\n在赞助者或客户在虚线上签字之前，项目并不算完成。接下我将介绍如何获取签署。\n\n### 获取签署\n\n项目收尾包括验收项目的最终产品或服务，然后将其移交给组织。获取项目的正式书面签署和验收是收尾阶段（Closing\
  \ phase）的关注重点。\n\n记录正式验收是非常重要的，因为它标志着项目的正式关闭，也是你项目已满完成的证明。正式验收包括向利益者分发关于项目结果验收的通知。\n\
  \n理想情况下，获取签署应该只是形式上的。如果你在执行、监控和控制过程中，已经让赞助者和利益者参与了交付物的验证和验收，那么获得项目签署应该是很容易的。\n\n\
  ### 交付项目产品\n\n签署的另一个功能是它启动了保修期的开始和/或产品向维护和运营的转移。有时，项目经理或供应商会在完成项目后一段时间内对他们的工作提供保修。例如，生产软件程序的项目可能会在实施日期或验收日期后的\
  \ 60 天或 90 天内对漏洞提供保修。通常情况下，软件项目中的漏洞在保修期内是免费修复。注意，因为用户会尝试将新需求挤进“漏洞”的范畴中。如果你提供保修，至关重要的是保修条款必须明确说明哪些在涵盖范围内，哪些不涵盖。\n\
  \n你应该编写一份过渡或集成计划，将项目的产品或结果移交给组织。与负责你所交付的产品或结果持续维护的经理建立会议——根据项目的复杂性，可能是一次会议或一系列会议。为他们提供产品的用户文档。\n\
  \n培训是过渡中的一个重要组成部分。记录特殊技能、培训、维护问题和成本、许可费用、保修期等。确保新经理也理解维护该产品的任何特殊要求。\n\n### 释放团队成员\n\
  \n释放团队成员或其他资源可能会在整个项目中发生一次或多次。分为阶段的项目可能会在每个阶段结束时释放团队成员。其他情况下，团队成员是为了某项特定活动而来的，并在活动完成后被释放。无论团队成员何时被释放，你都希望让职能经理或其他项目经理知情。在项目接近完成时，向职能经理提供信息，以便他们充分规划员工的回归。团队成员可能对自己的状态感到焦虑，特别是当人们离开项目时。你应该向团队成员提供尽可能关于释放日期的信息。\n\
  \n在释放团队成员时，你应该进行最后的绩效评估。如果你在职能组织工作，应该与员工的职能经理协调，确保将其纳入年度考核中。\n\n### 关闭合同\n\n关闭合同是结算合同条款并记录验收的过程。这一过程决定了采购文件或合同描述的工作是否准确、满意地完成。\n\
  \n采购文件可能有特定的完成和收尾条款。你应该了解这些条款，以免由于遗漏重要细节导致项目关闭。如果你不是亲自管理采购，一定要询问你的采购部门是否有你需要了解的特殊情况，以免项目团队意外延迟合同或项目的关闭。\n\
  \n采购部门需要向供应商提供交付物已验收且合同已完成的正式书面通知。这将是你对工作的批准。\n\n你应该保留已完成合同的副本并纳入项目存档，我将在以后讨论这一点。\n\
  \n### 行政收尾\n\n行政收尾涉及收集并集中项目文档、进行教训总结以及编写最终项目收尾报告。这是收集和存档项目记录和文件的地方，包括项目计划文档、变更记录和日志、问题日志、教训总结等。你还将收集和存档证明项目已完成且项目产品已移交组织（或负责持续维护和支持的部门）的文档。\n\
  \n### 存档项目文档\n\n在项目过程中你创建了大量文档，特别是在计划阶段。存档这些文档的目的有两个。首先，是为了证明你已经完成了项目工作，并在需要时可以出具签署和其他法律文件。存档项目文档的第二个主要益处是它可以帮助你或其他项目经理处理未来的项目。你的计划文档可以作为未来成本和时间估算的参考，或作为未来规划类似项目的模板。\n\
  \n\n\n\n咨询你的项目管理办公室（PMO），确定他们是否拥有集中的项目存档，例如用于项目文档的内网站点或 wiki 页面。他们将告诉你文档编制的指南以及如何归档、组织和存储文档。\n\
  \n如果你没有 PMO，你需要创建自己的归档解决方案。请咨询你的组织关于标准合规性和文档保留政策。例如，组织可能要求所有文档必须以特定方式进行编号或命名。你的归档过程的一部分将包括保留期。你的组织可能对于何时可以销毁某些类型的文档或必须保留哪些信息拥有指南。法律对某些类型的文档保留也有规定，因此在创建归档站点时，确保你熟悉这些法律。\n\
  \n## 记录教训\n\n在项目结束或结束后不久，应该举行 `lessons learned`（教训）回顾会议。项目的规模和复杂性将帮助你决定是否需要召开一次或多次评审会议。你至少希望包含任何关键项目团队成员、项目赞助人和关键利益相关者。\n\
  \n此次回顾的目的是为了评估项目的优点和不足之处。在会议期间，你将评估项目的每个阶段，以确定哪些地方做得很好，哪些地方可以改进。\n\n教训描述了项目的成功和失败。例如，教训文档记录了采取特定纠正措施的原因、其结果、绩效偏差产生、发生的非计划风险、所犯的且本可以避免的错误等。\n\
  \n教训帮助你评估哪里出了问题以及为什么出现问题，并不是为了让你指责责任方，而是为了让你通过避免在本次项目中遇到的陷阱，来提高下一个项目的绩效。它还帮助你确定哪些做法是正确的，以便在下一个项目中重复这些流程。教训回顾涉及分析项目管理过程、项目团队的优缺点，而且如果你有这种勇气，还包括项目经理的绩效。\n\
  \n遗憾的是，有时项目会失败。你可以从失败的项目也可以从成功的项目中学习教训，并且你应该记录这些信息以备将来参考。然而，大多数项目经理并不记录教训。其原因是员工不想承认犯了错误或从项目期间犯的错误中学习。他们也不希望自己的名字与失败的项目、甚至与成功项目中的意外联系在一起。\n\
  \n你和你的管理团队必须努力营造一种信任和保证的氛围，确保教训不是解雇员工的理由，而是有利于所有项目相关人员的学习机会。教训让你能够从这个项目中获得的知识带到未来要工作的其他项目中。如果你在开展新项目之前花时间审查项目文档和教训，它们还将防止未来再次出现同样的错误。\n\
  \n以下是你在教训回顾会议上应该审查的领域部分列表。这绝不是完整列表，但应该能给你一个良好的起点。你应该记录在这些会议中学会的所有内容。教训将与其他所有项目文档一起包含，并在完成后存入项目存档中。\n\
  \n*   审查每个过程组（启动、计划、执行、监控和控制以及结束）。\n*   审查项目团队的绩效。\n*   记录供应商的绩效。\n*   检查赞助人和关键利益相关者的参与情况。\n\
  *   审查发生的风险以及风险响应计划的有效性。\n*   记录项目期间未被识别的发生风险。\n*   评估用于成本和资源的估算技术。\n*   评估项目预算与实际绩效的对比。\n\
  *   审查进度绩效、关键路径和进度控制。\n*   审查变更管理过程的有效性。\n\n## 准备项目结束报告\n\n需要准备一份最终的项目结束报告，并分发给所有项目利益相关者。这是项目的最终状态报告，应至少包含以下内容：\n\
  \n*   项目原始目标和目标的总结\n*   项目接受或拒绝的声明（以及被拒绝的原因）\n*   项目成本总结\n*   项目进度总结\n*   教训和历史数据\n\
  \n该报告通常在教训回顾会议之后准备，以便将教训和其他历史数据包含在报告中。你将在利益相关者接受并签署项目后将报告分发给他们。\n\n### 总结\n\n本章涵盖了大量内容，从图表开始，这是一种宝贵的项目管理工具。直方图是一种条形图，用于显示随时间分布的数据。它们很容易构建和理解。鱼骨图也被称为石川图，是一种因果图。帕累托图是根据随时间推移的频率对最重要的数据进行降序排列的直方图。运行图将随时间观察或收集的数据以折线图的形式显示。散点图在图表上绘制两个数值变量，以确定它们之间是否存在相关性。这些变量越接近，变量之间的关系就越紧密。这种关系通常通过分析来证明或反驳因果关系。散点图也被相关性图。\n\
  \n仪表板视觉化显示项目最重要元素的状态。它们通常由组织的高管人员使用，因为他们一眼就能看到最新的项目信息。\n\n状态会议和状态报告是让利益相关者了解项目状态的重要沟通工具。会议议程应在会议前几天发送，以便参与者知道预期情况或可以提前阅读材料。会议纪要应在会议结束后不久后分发。\n\
  \n问题日志应定期更新，以反映新问题并记录进行中问题的状态。问题日志应在状态会议上进行审查。行动清单也应在状态会议上进行更新和审查。\n\n知识管理工具（如内网站点、wiki\
  \ 页面和协作工具）对于创建、更新、存储和存档项目文档非常有用。保持文档的更新状态并确保你正在使用的是最新版本的文档是非常重要的。\n\n关键绩效指标（KPIs）是一个可衡量值，用于显示项目是否达到了预定目标。KPI\
  \ 应该是可衡量的且适用于项目的。关键绩效参数（KPPs）是与系统相关的运行或性能目标的可衡量值。平衡分卡是另一种战略管理工具，用于确定是否实现了组织目标。\n\
  \n当项目结束或项目被终止或取消时，应执行项目结束。结束过程组是项目中最常被跳过的阶段，因为项目经理和团队成员急于转向下一个任务。花时间执行结束过程阶段的步骤是非常重要的，这样你可以获得项目签字、将产品移交给组织、释放项目资源、结束合同、记录教训并创建最终项目报告。\n\
  \n\n\n\n项目结束的四类型涵盖了项目结束的大多数原因。它们是：增加（addition）、饥饿（starvation）、整合（integration）和消灭（extinction）。\n\
  \n结束采购涉及完成并结算合同条款，并记录其验收情况。在此进行产品验证，以确定工作是否已准确且满意地完成。\n\n行政结束活动涉及收集并集中所有项目文档、执行教训回顾，并编写最终项目报告。\n\
  \n项目结束中最重要的元素或许是教训文档。这需要识别哪些地方出了问题、哪些地方做得很好，以及在项目执行期间你考虑的替代方案。对于未来的项目来说，教训是极有用的参考，关于哪些方法有效、哪些无效、估算技术、建立模板等。\n\
  \n项目结束报告分发给利益相关者，包含若干个元素，包括项目目标、验收声明、成本和进度数据摘要，以及教训数据。\n\n## 考试要点\n\n- **能够解释直方图。**\
  \ 直方图显示了随时间分布的数据。它是一种条形图。\n- **能够解释鱼骨图。** 鱼骨图是一种因果图，也称为石川图（Ishikawa diagram）。\n\
  - **能够解释帕托图。** 帕托图是一种根据时间频率对数据进行排序排序的直方图。\n- **能够解释运行图。** 运行图将数据作为时间轴上的图点显示出来。\n\
  - **能够解释散点图。** 散点图显示了两个数值变量之间的关系，并确定它们是否相互相关。它也可以用于证明或反驳因果关系。散点图也被称为相关图。\n- **列出用于项目文档的知识管理工具。**\
  \ 这些工具包括内网站点、网站、wiki 页面、供应商知识库和协作工具。\n- **列出三种性能测量工具。** 它们是关键性能指标（KPIs）、关键性能参数（KPPs）和平衡计分卡。\n\
  - **能够描述状态报告。** 状态报告描述了项目目前的进展，通常包括有关范围、成本和预算的信息。\n- **列出以项目为中心的文档类型。** 它们包括问题日志、状态报告、仪表板信息、行动事项、会议议程和会议纪要。\n\
  - **列出项目结束的四个原因。** 它们是增加、饥饿、整合和消灭。\n- **理解关闭项目涉及的步骤。** 步骤包括获得签署和验收、将产品交付给组织、释放项目资源、结束合同、记录教训以及创建项目结束报告。\n\
  - **解释获取正式客户或利益相关者签署确认的目的。** 正式签署文件证明客户接受了项目工作，且项目符合定义的要求。它还标志着项目的正式结束以及项目最终产物向组织的转移。\n\
  - **描述教训。** 教训描述了项目的成功和失败之处。\n\n## 关键术语\n\n在参加考试之前，请确保你熟悉以下术语：\n\n- 行动事项 (action\
  \ items)\n- 增加 (addition)\n- 平衡计分卡 (balanced score card)\n- 仪表板 (dashboards)\n-\
  \ 消灭 (extinction)\n- 鱼骨图 (fishbone diagram)\n- 直方图 (histogram)\n- 整合 (integration)\n\
  - 问题日志 (issue log)\n- 问题 (issues)\n- 关键性能指标 (KPIs)\n- 关键性能参数 (KPPs)\n- 教训 (lessons\
  \ learned)\n- 会议议程 (meeting agenda)\n- 会议纪要 (meeting minutes)\n- 帕托图 (Pareto charts)\n\
  - 运行图 (run chart)\n- 散点图 (scatter diagram)\n- 饥饿 (starvation)\n- 状态会议 (status meeting)\n\
  - 状态报告 (status reports)\n\n## 复习题\n\n1. 你希望确保项目文档的版本控制并为团队成员和利益相关者提供一个审查和更新某些文档的协作平台。你可以使用以下所有知识管理工具来实现，除了哪一个？\n\
  \    1. Wiki 页面\n    2. 内网站点\n    3. 仪表板\n    4. 协作软件\n\n2. 你刚离开一个项目赞助人的会议，被告知你的项目由于预算削减而被取消。你召集了项目团队告知他们情况，并审查了关闭项目的剩余活动。你的几位团队成员对对已取消的项目进行教训回顾是否有益表示怀疑。你的回答应该是？\n\
  \    1. 建议团队，部分回顾时间将用于记录由于客户缺乏明确需求而导致的失败。\n    2. 告诉团队，他们需要这样做以便在寻找新任务期间，在项目工资单上多留一周。\n\
  \    3. 通知团队，无论项目如何结束，最终报告都是项目管理办公室（PMO）的要求。\n    4. 解释说，分析目前已完成的项目阶段对团队和未来项目都有价值，可以记录哪些做得对、哪些做得错，以及你会做哪些改变。\n\
  \n3. 你刚离开一个项目赞助人的会议，被告知你的项目由于预算削减而被取消。你召集了项目团队告知他们情况，并审查了关闭项目的剩余活动。下列哪项描述了该项目经历的项目结束类型？\n\
  \    1. 消灭\n    2. 饥饿\n    3. 增加\n    4. 整合\n\n4. 下列测量工具用于衡量系统的运行或性能目标？\n    1.\
  \ KPIs\n    2. KPPs\n    3. 平衡计分卡\n    4. 运行图\n\n5. 下列哪种是“最好”的项目结束类型？\n    1. 消灭\n\
  \    2. 增加\n    3. 整合\n    4. 饥饿\n\n6. 项目工作结束时正式签署确认的主要目的是什么？\n    1. 签署允许项目经理开始新任务。\n\
  \    2. 签署意味着项目团队不再对项目产物负责。\n    3. 签署是释放团队成员返回职能部门的触发因素。\n    4. 签署表明项目符合记录的要求，且客户已接受项目交付物。\n\
  \n7. 下列哪种图是直方图的一种？\n    1. 散点图\n    2. 鱼骨图\n    3. 帕托图\n    4. 运行图\n\n8. 教训报告的重点是什么？\n\
  \    1. 报告应涵盖项目的正面和负面方面，并提出改进建议。\n    2. 报告应主要总结项目进度、预算和任何批准的范围变更的结果。\n    3. 报告应侧重于项目交付物以及客户产生的任何问题。\n\
  \    4. 报告应涵盖项目期间哪些做得好，并确定哪位团队成员或业务部门对失败或问题负责。\n\n9. 你的项目正在收尾，一些团队成员对自己的状态感到焦虑。处理他们疑虑的最佳方法是什么？\n\
  \    1. 向团队成员解释，他们在项目完成后将被释放。\n    2. 让团队成员知道，你只能与职能经理讨论他们的释放日期。\n    3. 为所有团队成员设定相同的释放日期，即使他们的工作尚未完成。\n\
  \    4. 与职能经理一起审查团队成员释放计划。根据项目进度的状态让团队成员和职能经理随时了解。\n\n\n\n\n\n## 10. 你正处于项目的监控和控制阶段。出现了一些问题，你想知道产生这些结果的本质原因。你与关键团队成员举行了脑风暴会议，并在此类图表上绘制了因果场景。\n\
  \n1. `帕累托图`\n2. `直方图`\n3. `鱼骨图`\n4. `散点图`\n\n## 11. 这份文档记录了状态会议期间通常会出现的项目。这些事项涉及项目，但通常不会直接影响项目工作。该文档包含描述、所有者和状态等项目。\n\
  \n1. `状态报告`\n2. `行动事项`\n3. `问题`\n4. `会议纪要`\n\n## 12. 此项内容用于让利益相关者和团队成员了解最新进展。它通常包含与预算、时间线、交付物和风险相关的信息。`问题日志`和`行动事项`通常随此文档一起发布。\n\
  \n1. `状态报告`\n2. `会议纪要`\n3. `Wiki 页面`\n4. `仪表板信息`\n\n## 13. 你的项目随着时间的推移变成了一项持续运营。这是哪种类型的项目结束？你的下一步是什么？请选择两项。\n\
  \n1. 下一步是撰写项目结束报告。\n2. 下一步是通知项目赞助人和利益相关者项目已经结束。\n3. 项目结束是因为整合。\n4. 项目结束是因为增加。\n\
  5. 下一步是进行事后分析。\n\n## 14. 下列哪些图表是因果图，或用于确定两个数值变量之间是否存在因果相关性？请选择两项。\n\n1. `帕累托图`\n\
  2. `鱼骨图`\n3. `运行图`\n4. `散点图`\n5. `直方图`\n\n## 15. 1. 这份文档在项目结束时产生，并报告项目的最终成果。\n\n\
  1. `教训总结`\n2. `状态报告`\n3. `项目结束报告`\n4. `事后分析`\n\n## 16. 你是一个大型项目的项目经理。你正处于执行阶段的中期。项目赞助人由于意外的成本超支和资源短缺决定取消项目。你的下一步是什么？请选择两项。\n\
  \n1. 更换供应商以获得硬件和软件组件的更低报价。\n2. 准备项目关闭文档。\n3. 进行教训分析并释放资源。\n4. 请求赞助人允许你重新设计项目以减少交付物。\n\
  5. 请求利益相关者与赞助人进行沟通。\n\n## 17. 你的项目进度太慢了，你的执行层利益相关者希望以易于使用的格式获取更及的信息。他们正在监控项目，以决定应该取消项目还是采取进一步行动使其重回正轨。以下哪项是你实施的最优方案？\n\
  \n1. `仪表板`\n2. 更频繁的状态报告\n3. 每日状态状态邮件\n4. 邀请利益相关者参加每日站会，以便让他们亲耳听到最新的状态。\n\n## 18.\
  \ 关于团队成员的释放，以下说法中哪一项是不正确的？\n\n1. 团队成员在记录`教训总结`后被释放。\n2. 当团队成员离开项目时，项目经理应对他们进行最终的绩效评估。\n\
  3. 项目经理应提前通知职能经理团队成员的释放日期。\n4. 项目经理应就即将到来的释放日期与团队成员进行沟通。\n\n## 19. 你的项目经历了一些挫折，利益相关者对进展并不满意。一场飓风摧毁了其中一个供应商的仓库，你正在寻找零件。你与供应商和采购部门合作，寻找可能提供你所需零件的其他供应商。在这种情景下，以下哪项是最佳选择？\n\
  \n1. 取消项目。\n2. 在`会议纪要`中记录情况。\n3. 这是一个应该在`问题日志`中记录并跟踪的`问题`。\n4. 这是供应商未达到的`KPI`。\n\
  \n## 20. 谁负责授权项目关闭？\n\n1. 利益相关者\n2. 项目经理\n3. 执行团队成员\n4. 赞助人\n\n# 附录\n\n 复习题答案\n\n\
  ## 第一章：启动项目\n\n1. C, E. 项目创建了一个独特的产品、服务或结果，并有定义的开始和结束日期。项目必须拥有资源来产生结果，并且必须符合项目计划中概述的质量标准。相互相关的活动不是项目，因为它们不符合项目的标准。项目管理过程是管理项目的手段，而用于产生利润或增加市场份额的过程并不符合项目的定义。过程通常是持续的；项目有开始和结束。\n\
  \n2. B. 项目管理协会(`PMI®`)是领先的专业项目管理协会，在全球范围内有 700,000 多个成员。\n\n3. D. 程序是一组相关的项目，可以从协调管理中获益。生命周期是项目经历的各个阶段，过程组包括启动、计划、执行、监控和控制以及结束。\n\
  \n4. A, C. 投资组合由计划、子组合和独立项目组成，这些项目并不相互相关。一个组织可以拥有任何数量的投资组合。\n\n5. B. 项目经理可以将 90%的时间花在沟通上。这里列出的其他技能也很重要，但本题的线索是\
  \ 90%这个数字，它与项目经理花在沟通上的时间有关。\n\n6. A. 为部门开发产品的需求是业务需求。市场需求由市场驱动，法律要求来自必须遵守的规则或法规，技术进步源于专业知识或设备的改进。\n\
  \n7. B, E. 矩阵组织可以结构为强矩阵、弱矩阵或平衡矩阵。员工由职能经理分配到项目中，项目任务由项目经理分配给他们。项目经理在项目化组织中拥有大部分权力。\n\
  \n8. A. 项目化组织围绕项目工作设计，项目经理在此类结构中拥有最大的权威。项目经理在职能组织中的权限最小；他们在平衡矩阵中拥有某些权限，在强矩阵中拥有稍多权限，但没有在项目化组织中拥有那么大的权限。\n\
  \n9. A. 折现现金流技术将每年预期现金流入的总价值与今天的美元进行比较。`IRR`计算内部收益率，`NPV`确定净现值，`成本效益分析`确定项目的成本与收到的利益对比。\n\
  \n10. D, E. 验证项目所需的步骤是验证业务情况（包括可行性分析、项目合理性和与战略计划的对齐）以及识别和分析利益相关者。\n\n\n\n\n\n12.\
  \ A, B, C, E. 业务案例确立了项目的理由，说明了项目如何与组织的战略目标一致、引发项目的业务需求或机会、替代方案及分析、关于选择何种替代方案的建议，可行性研究或可行性研究结果可能也可能包含在业务案例中。\n\
  \n13. D. 回本期是一种计算随时间预期现金流入的技术，以确定回收原始投资需要多少个周期。`IRR` 计算内部收益率，`NPV` 确定净现值，折现现金流确定现金流在今天价值的金额。\n\
  \n14. D. 在这种情况下应采取的下一步工作是进行可行性研究。可行性研究通常针对具有风险的项目、对组织而言是新的项目或高度复杂的项目进行。对组织具有重大风险的项目在没有先进行可行性研究之前，不应提交给选择委员会，而且此时编写项目计划是没有意义的，因为你不知道项目是否会被选中。你也不能拒绝该项目，因为在可行性研究完成之前，没有足够的信息来判断是否应该拒绝。\n\
  \n15. C. 项目经理最终负责管理项目工作。这并不意味着他们应该在没有他人投入建议的情况下工作。\n\n16. D. 项目型组织的主要问题是，在一个团队成员被释放的项目结束后，可能没有新项目到位。这导致专家“坐在板凳上”无事可做，对组织来说成本高昂。在项目型组织中开展项目是一项优势。这类组织的成本并不一定比其他组织高。成本取决于你所从事的项目类型，而不是组织结构。而且在基于项目的组织中，项目经理对谁参与项目有控制权。\n\
  \n17. B, D, F. 引发项目的需求或要求包括：市场需求、战略机会/业务需求、客户请求、技术进步、法律要求、环境考量和社会需求。进行可行性研究是为了确定项目的可行性，而业务案例则记录了项目的理由和项目的合理性。利益相关者的需求可能会引发项目，但他们的需求会更具体地属于引发项目的七种需求或要求之一。\n\
  \n18. C. `NPV` 的计算方法是从初始投资中减去以今天价值计算的预期现金流入总和。在题中，初始投资高于现金流，因此所得 `NPV` 小于零，应该拒绝该项目。折现现金流告诉你现金流在今天价值的金额。\n\
  \n19. B. 此题描述了专家判断形式的项目选择方法。题目指出高管层已经阅读了业务案例分析。可行性研究是为了确定项目风险和潜在收益而进行的研究，而决策模型是使用不同变量来确定决策的数学模型。\n\
  \n20. C, D. 业务案例分析可能包括可行性研究，但应始终包含项目的理由以及与战略计划的相关性。包含高层时间表和估计预算也是一个好主意。\n\n## 第二章：项目团队角色与职责\n\
  \n1. B, C. 利益相关者矩阵包括利益相关者姓名、部门、联系信息、在项目中的角色、需求、关注点、利益、参与项目的程度、对项目的影响力以及个人参考备注。利益相关者矩阵是一种制品。\n\
  \n2. A. 项目发起人授权项目启动，并批准且签署项目章程。\n\n3. C. 项目协调员协助项目经理处理项目的行政职。\n\n4. B. 项目经理的关键职责之一是告知发起人关于项目的变更、状态、问题和冲突。项目请求者利益相关者也应该被通知，但项目经理角色的一个重要方面涉及告知发起人并保持其信息更新。\n\
  \n5. C, D, F. `PMO` 为组织提供标准和规范，包括工具、模板和治理流程。\n\n6. B. 职能经理提供并分配员工参与项目工作。项目经理负责监督完成项目所需的工作。客户是项目创建的产品或服务的接收者（个人或群体）。项目发起人在整个组织中倡导项目，并担任项目经理的顾问。\n\
  \n7. B, C, E. 项目发起人/拥护者批准资金、批准项目章程、推广项目利益、消除障碍并定义项目的业务合理性。\n\n8. D. 高层范围定义描述了项目的理由、目标和高层交付物。\n\
  \n9. C. 项目协调员负责支持项目经理，提供跨部门协调、文档编制、时间和资源调度，以及检查质量。\n\n10. A. 你必须澄清项目请求，以确定营销人员到底需要什么。你需要理解需要解决的问题，以便定义高层需求并编写项目章程。\n\
  \n11. B. 项目拥护者是理解项目目标的人，并在整个组织中作为项目收益的热情声音。\n\n12. E. 项目发起人是获得授权提供实现项目交付物所需的资金和资源的个人。在题中，没有足够的信息对识别项目发起人做出良好的决策。\n\
