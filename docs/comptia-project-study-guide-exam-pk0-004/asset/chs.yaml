  ## 第 6 章：资源规划与管理\n\n1. A. 当新团队成员加入项目时，团队开发阶段会从形成阶段重新开始，无论团队之前处于哪个阶段。\n2. A. 团队建设活动有助于建立有效高效的团队，提高士气并建立社交纽带。建立信任有助于形成高绩效工作团队，但不会直接导致社交纽带的建立或有效高效团队的形成。\n\
  3. C, E. 这种情况描述了不同的工作风格，这是冲突的常见原因。跨项目资源竞争是指资源在多个项目上工作，并且存在调度问题。低质量资源缺乏技能或能力。谈判冲突技术通常使用第三方来帮助冲突双方达成共识。\n\
  4. B. 团队开发的阶段是形成、风暴、规范、执行和离散。对峙是一项冲突解决技术。\n5. B. 这道题定义了跨项目资源竞争。如果只有一个可用资源或资源稀缺，就会发生资源短缺。由于这道题描述了多个项目，因此它涉及跨项目资源竞争。\n\
  6. D. 平滑冲突解决技术是暂时的，其特征之一是强调共识领域并掩盖真实问题。\n7. C. 谈判是一项涉及听和提问的技术。\n8. B, D, E. 冲突解决技术有平滑、强制、妥协、回避和谈判。离散、规范和风暴是团队开发的阶段。\n\
  9. D. 为了解决这个问题，你需要了解系统工程师当前行为背后的原因。他可能被分配了你未察觉的额外工作，或者他可能误解了项目目标，这只是几种可能性之一。无论这个人有多有价值，情况都不应被忽视，并且应该在私下处理。\n\
  10. A, C, E. `RACI` 是一种基于矩阵的图表，显示负责项目任务的资源（或业务部门）。它代表负责（Responsible）、问责（Accountable）、咨询（Consulted）和知情（Informed）。Accountable\
  \ 的意思是“问责”。\n11. D. 奖励和认可不必涉及金钱，很多时候它们可能包括此类奖励，如感谢、给职能经理写信、在团队会议上公开表扬成就等。\n12. A.\
  \ 这道题指的是资源短缺。你有一个两个任务都需要的资源。资源分配是将具有正确技能和能力的资源的资源分配给任务。跨项目依赖依赖于一个项目完成后上一个项目才能开始，而共享资源通常是部门之间或职能经理与项目经理之间共享的资源。\n\
  13. B. 启动会议是项目团队成员和利益相关者彼此认识的地方，它在 `Executing` 执行过程组的开始举行。\n14. C. `RACI` 图缩写代表负责、问责、咨询和知情。问责（Accountable）的人也是该工作的批准者。\n\
  15. A, B. 每当引入新团队成员时，团队开发阶段都会回到形成阶段，并与新成员一起再次经历所有阶段。\n\n\n\n\n\n17. E. `WBS` 太详细，不适合在项目启动会议上审查，最好在仅有项目成员参加的会议上处理。\n\
  \n18. D. 平滑（Smoothing）是一种双输技术，强制（forcing）是赢输关系，对抗（confronting）是双赢，而回避（avoiding）是双输的。\n\
  \n19. B. 闲置资源对组织来说成本高昂。这些资源目前未分配到项目任务，通常处于项目之间的空隙。这通常发生在项目型组织中。\n\n20. C. 组织分解结构（OBS）根据负责完成工作包的部门或工作单位显示工作。资源分解结构（OBS）显示了所需的资源类型和工作包。项目组织图显示了项目成员的层级结构，而组织架构图显示了组织内部汇报结构的层级。\n\
  \n## 第 7 章：制定项目预算和风险计划\n\n1. D, F. 人工成本为 `$75/hour` 乘以 10 棵树等于 `$750`。这是参数估算法，因为你正在用数量乘以速率。类比估算涉及使用来自相似项目的估算，而三点估算则使用三个估算值的平均值。\n\
  \n2. B. 自顶向下的估算是类比估算的另一种说法。\n\n3. B. 工作量估算或人工小时估算用于开发成本估算。这是从开始到结束任务所需的时间，不考虑工作休息、假期等。工期估算则考虑了假期、工作休息等。自底向上的估算是对单个工作组件的估算，这些估会被汇总到总估算中，而参数估算通常通过数量乘以速率得出的。\n\
  \n4. C. 应急备费用（contingency fund）是分配用于支付可能发生的不利事件成本的金额，项目经理通常有权使用这笔资金。项目经理通常没有权限使用管理备费用（management\
  \ reserve）中的资金。会计科目是对会计总账中列账户的描述，而成本基准是项目的总预期成本。\n\n5. A. 管理备费用不属于项目成本预算或成本基准的一部分。\n\
  \n6. C. 自底向上的估算从 `WBS` 的工作包层级开始。项目第一阶段 `WBS` 上的每个工作包相加，得出该阶段的整体估算。如果你使用类比估算技术，历史数据将很有用。会计科目对这项练习完全没有帮助，范围说明将让你了解\
  \ `WBS` 上详细列出了哪些内容，但它对估算没有帮助。\n\n7. B. 自底向上的估算是最准确的估算，而类比估算是最准确准确。基于专家判断的估算属于类比估算。参数估算的准确性仅取决于你用于参数模型的数据精度。\n\
  \n8. C. 成本基准由项目赞助人批准，而不是项目经理。\n\n9. D, G, H. 三点估算是最可能、乐观和悲观估值的平均值。\n\n10. C. 消耗率（burn\
  \ rate）通常使用成本绩效指数（`CPI`）计算。它告诉你在项目任何时间点所花费资金的效率或效益。\n\n11. B. 为给定资源确定的速率乘以工作量（通常以小时表示）将得出任务的总估算。\n\
  \n12. D. 转移（Transfer）是一种风险策略，将风险的后果转移给另一方。\n\n13. A. `SWOT` 代表优势、劣势、机会和威胁。从这些每个角度审视项目有助于你识别风险。其他选项是成本性能测量。\n\
  \n14. A, B, C. 在风险计划的早期，风险登记表通常包含风险识别码、风险描述、风险事件的概率和影响、风险评分以及风险所有者。你的风险登记表还可以包含风险触发因素和其他关于风险的其他相关信息。\n\
  \n15. D. 接受风险的策略涉及在风险发生时处理其后果。对于计划接受的风险，你不需要准备风险应对计划。\n\n16. B. 计划支出与实际支出之间的差异被称为预算偏差（budget\
  \ variance）。\n\n17. A. 风险触发因素是风险事件即将发生的症状或迹象。\n\n18. C. 共享（Sharing）是一种正向风险策略。负向风险策略是回避、转移、缓解和接受。\n\
  \n19. A. 当项目成本随时间以图表显示时，它们代表 S 曲线。这是因为支出在项目初期开始缓慢，在项目中期加速，并在结束时减缓。\n\n20. C, F.\
  \ 风险评分通过概率乘以影响计算得出。概率是风险事件发生的可能性，用从 `0.0` 到 `1.0` 之间的数字表示。影响是风险事件发生时的后果，也可以用从 `0.0`\
  \ 到 `1.0` 之间的数字表示。\n\n## 第 8 章：沟通计划\n\n1. C, E, F. 制定沟通计划是为了确定谁需要沟通、何时沟通、以什么格式以及沟通的频率。一旦计划制定，它将用于更新利益相关者、团队成员、供应商以及需要项目信息的人员。\n\
  \n2. D. 在发送者-信息-接收者模型中，接收者负责正确理解信息并确保他们收到了所有信息。\n\n3. A. 会议中有四位参与者和六条通信线。其公式为 `4(4\
  \ – 1) ÷ 2 = 6`。\n\n4. C. 闸门审查（Gate reviews）是一种沟通触发因素。语言障碍、文化差异等是影响沟通方法的因素。\n\n\
  5. B. 频率、报告详细程度、沟通类型、保密性限制和定制沟通风格都是利益相关者的沟通需求。\n\n6. A. 启动会议的目的之一是让团队成员相互认识。视频会议是最佳选择，这样团队成员在介绍期间可以互相看到，并听取项目目标等。\n\
  \n7. G. 所有选项都被视为沟通方法。你应该根据受众定制沟通方法。\n\n8. 沟通规划是识别谁需要接收项目信息、他们需要什么信息以及他们将如何获得这些信息的过程。\n\
  \n9. B. 在提供的选项中，列出的影响沟通的唯一因素是个人偏好。所有错误选项都是沟通方法。\n\n10. D. 组织内部差异影响组织中的不同部门。这个问题说明你为\
  \ `PMO` 工作，且财务部门不配合，这意味着你的工作中有两个部门涉及了这种差异。\n\n11. C. 利益相关者的变更是沟通触发因素的一个例子。\n\n12.\
  \ B, E, F. 基本沟通模型是发送者-信息-接收者模型。\n\n13. A. 当你需要讨论敏感信息时，与员工面对面会议是最好的沟通方法。如果员工拒绝改变行为，下一步可能是与职能经理会。然而，你应该始终尝试先与员工解决问题。\n\
  \n14. E. 技术因素是影响沟通方法的因素。\n\n15. D. 非正式沟通包括电子邮件、走廊对话和电话。它们通常是无计划的且具有随意的。\n\n16. C.\
  \ 虚拟会议可以由来自任何地理位置的人参加。它们不是面对面的会议。\n\n\n\n\n17. B. 第一步是根据信息的内容定制沟通方法。问题中提供的信息不足以确定信息的内容，因此我们不知道使用哪种方法最好。\n\
  \n18. A, F. 复杂信息最好通过书面形式交付，然后在面对面的会议上进行解释，这样利益相关者就可以提问，你也能判断他们的肢体语言是否表示他们已经理解了。\n\
  \n19. B, D. 这些都是利益相关者的沟通需求，应该记录在沟通计划中。\n\n20. A. 题目描述了影响沟通方法的各种因素。\n\n## 第 9 章：处理变更请求和采购文件\n\
  \n1. D. 客户或利益相关者可能请求了新功能。如果这些是原始范围说明中遗漏的必要功能，则你需要分析其对项目的影响并获得变更批准。如果你在不进行任何分析的情况下直接对预算和进度进行调整，不仅面临延期和预算超支的风险，还可能影响计划的其他领域或与此变更相关的风险。移除新功能可能会增加进度成本和时间，并可能与客户产生潜在的敌对关系。除非是程序员在批准流程之外反复更改范围，否则请求替代资源并不是适当的回应。\n\
  \n2. C. 纠正措施、缺陷修复和预防措施都是变更的类型。\n\n3. B. 变更控制委员会 (`CCB`) 负责审查并批准、拒绝或延迟变更请求。\n\n4.\
  \ A. 紧急变更请求程序应当记录在案，以便在下一次 `CCB` 会议之前进行必须进行的紧急变更。所有变更都应在下一次 `CCB` 会议上记录并报告。\n\n\
  5. D. 在执行完选项 A–C 后，将变更请求和分析结果提交给 `CCB` 做出决策。在 `CCB` 对变更请求的处理做出决定之前，相应的项目计划文档不会进行更新。\n\
  \n6. A, D. 确定利益相关者认为驱动项目的约束因素，将有助于你确定可以提的权衡或替代方案，以减轻拟议范围变更的影响。\n\n7. C. 在这种情况下采取的正确行动是将变更提交给\
  \ `CCB`。如果获得批准，则需要你重新基准进度以反映新的日期。\n\n8. D. 自制购买分析是确定在组织外采购商品或服务的成本效益的技术。\n\n9. C.\
  \ 收购赋予了接管组织权力。在这种场景下，你的旧公司经历了一些裁员，新组织的经理接管了公司。这描述了收购。\n\n10. D. 工作说明书 (`SOW`) 详细描述了你从组织外购买的商品或服务。\n\
  \n11. B. 供应商会议通常在 `RFP` 发布后不久举行，让供应商获得就项目进行提问的机会。\n\n12. A. 加权评分模型权衡了来自 `RFP` 和\
  \ `SOW` 中的各项标准，允许你对每个供应商的每项标准进行评分，并确定每个供应商确定总分。\n\n13. D. 成本报销合同对买方来说风险最高，因为买方负责报销卖方生产商品或服务的成本。\n\
  \n14. A. 时间和材料合同是固定价格合同和成本报销合同的结合体。它们为工作分配了单价，但在工作完成之前不知道总成本。\n\n15. B. 项目管理计划作为项目进度的基准，贯穿执行阶段和监控控制阶段，用于判断项目是否在轨道上。它用于帮助根据项目的原始目标和目的评估变更，并作为沟通工具。\n\
  \n16. A. 产品所有者负责后台列表以及与项目利益相关者的沟通。\n\n17. B, C. 每天举行站会和 Scrum 会议以建立项目进度。它们通常限制在\
  \ 15 分钟内。\n\n18. C, D. 瀑布模型和敏捷使用迭代方法管理项目。PRINCE2 将项目分为若干阶段，而关键路径法是一种调度方法。\n\n19.\
  \ C. 敏捷允许持续反馈，并利用自组织和自导团队。\n\n20. B, E. 待办列表用于敏捷方法。产品所有者根据业务价值对待办列表进行排序。团队成员在迭代计划会议上选择要工作的待办事项。他们还可以将大型待办事项分解为可以在单个迭代内完成的小型工作组件。\n\
  \n## 第 10 章：项目工具和文档\n\n1. C. 知识管理工具包括内部网站、网站、wiki 页面、供应商知识库和协作工具。仪表板是一种报告工具。\n\n\
  2. D. 从任何项目（甚至是未完成的项目）中都可以获得价值的信息。评估应关注那些已经完成的项目阶段，并查看是否可以采取不同的做法使项目成功。经验教训的目的不是为了指责，即使对于已取消的项目。\n\
  \n3. B. 饥饿（Starvation）是因为资源被切断导致的项目结束。消灭（Extinction）发生在项目工作完成并被利益相关者接受。增加（Addition）发生在项目演变为日常运营，整合（Integration）发生在资源分配到组织的其他领域时。\n\
  \n4. B. 关键性能参数用于衡量系统的性能或运行目标。它们类似于 `KPIs`，用于衡量项目的任何元素或业务运行领域，以确定目标是否正在实现。平衡计分卡是一种管理工具，用于确定是否实现了组织目标。\n\
  \n5. A. 消灭发生在项目工作完成并被利益相关者接受时。这是最好的项目结束类型。饥饿是因为资源被切断导致的项目结束。增加发生在项目演变为日常运营，整合发生在资源分配到组织的其他领域时。\n\
  \n6. D. 签字（Sign-off）是对项目最终产品、服务或结果的正式验收。其主要目的是客户对项目产出的认可。团队成员在签字后释放，但这并不是正式签字的主要目的。项目经理和项目团队成员可能继续参与项目，直到所有结束活动完成。\n\
  \n7. C. 帕累图是直方图的一种，用于衡量数据元素随时间按排序发生的频率。\n\n8. A. 项目的成功和失败都需要记录在经验教训报告中。成功将为未来的项目提供遵循蓝图，而失败将提醒团队需要避免的事项。一份良好的经验教训文档涵盖了所有参与者对项目的各个方面。它应该包含所有项目信息，而不只是进度、预算和变更，并且绝不为发生的错误而指责。\n\
  \n9. D. 当你认为团队成员将离开项目时，团队成员和职能经理都需要提前知道。成员可能在不同的时间离开项目，因此你需要与每个团队成员单独讨论释放事宜。\n\n\
  \n\n\n\n## 10. C. 鱼骨图是一种因果图。头脑风暴会议是构建此类图表并确定哪些原因阻碍结果的极佳方法。\n\n## 11. B. 事项通常产生状态会议期间。它们应该被记录在事项列表中。每个事项都被分配一个识别码、描述和负责人，其状态会在状态会议上进行记录和审查。问题（Issues）通常直接影响项目工作，并可能阻碍进度或带来风险。事项通常是关于项目的“待办事项”或必须回答的问题。\n\
  \n## 12. A. 状态报告向利益相关者通报项目进展。问题日志和事项列表通常随状态报告一起发布。Wiki 页面是发布报告的一种方式。会议纪要记录了会议期间发生的情况和做出的决策，而仪表板则提供了关于项目关键要素状态的最新实时信息。\n\
