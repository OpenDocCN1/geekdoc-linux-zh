  \n# 第 6 章：资源规划与管理\n\n### 本章涵盖的 CompTIA Project+ 考试主题包括：\n\n* ![](img/correction.jpg)\
  \ **1.8 解释人力资源、物理资源和人员管理的重要性。**\n    * 资源管理概念\n        * 共享资源\n        * 专用资源\n\
  \        * 资源分配\n        * 资源短缺\n        * 资源过度分配\n        * 低质量资源\n        * 闲置资源\n\
  \        * 项目间依赖关系\n        * 项目间资源竞争\n    * 人员管理\n        * 团队建设\n        * 信任建立\n\
  \        * 团队选择\n        * 技能组合\n        * 远程 vs. 内部\n        * 人员撤换/更换\n      \
  \  * 沟通问题\n        * 冲突解决\n            * 平滑法\n            * 强制法\n            * 折中法\n\
  \            * 对峙\n            * 回避\n            * 谈判\n* ![](img/correction.jpg)\
  \ **4.1 比较并对比各种项目管理工具。**\n    * 责任、问责、咨询、知会 (RACI) 矩阵\n\n![](img/egeng009.jpg) 项目执行是开展项目工作的地方，这些工作是由人员完成的。成功的项目执行涉及开发项目团队、根据项目计划管理工作以及管理冲突。\n\
  \n在项目的寿命范围内，你将与许多个人和小组建立关系。当你与赞助人、团队成员、供应商、职能经理、客户、用户和其他内部组织谈判时，你所有的人员管理技能都会发挥作用。\n\
  \n如果你向资深项目经理询问是什么让他们的项目成功，大多数人会列出项目团队。理解如何将这个临时小组建设成团队、确保提供适当的培训、管理冲突以及实施有意义的奖励和认可计划，都是你在开发凝聚力团队时将面临的挑战。\n\
  \n在此过程中，你会发现一些道路上的障碍，这需要采取特定行动才能让项目重回正轨。这可能还需要更新项目计划文档。\n\n本章从确定资源需求开始。让我们深入学习。\n\
  \n### 确定资源需求\n\n所有项目都需要资源来完成任务并交付成功的项目。CompTIA 考试将资源概念分为几个大类：资源管理概念、人员管理和冲突管理。首先，你将从资源管理概念开始，探索共享资源与专用资源、资源过度分配以及项目间依赖关系的概念。你将在本章的晚些时候查看人员管理和冲突管理。\n\
  \n### 资源管理概念\n\n让我们关注资源的一些特征以及你可能在考试中遇到的一些管理概念。\n\n首先，记住项目中的资源并不总是意味着人力资源。例如，设备和材料是一种`physical\
  \ resource`。在第 5 章中，我提到过在项目中使用液压钻机，并使用资源日历来确定该资源的可用性。我之前还提到过职能型、矩阵型和项目化组织。在项目化组织中，你会记得资源通常是专用的。`Dedicated\
  \ resources` 对项目经理来说是理想的状况，因为你对资源时间以及他们负责的任务拥有完全的自主权和控制权。你不需要与另一个经理协调进度，也不必担心因为职能部门出现“紧急情况”而导致资源从项目中被抽调。\n\
  \n在职能型或矩阵型组织中，你会发现自己经常必须共享资源。`shared resource`同时为职能经理和项目经理服务。通常情况下，团队成员将效忠于撰写其绩效评估和评审的人员。根据我的经验，共享资源往往在他们的职能工作和项目工作之间挣扎，并发现自己默认选择职能工作，因为业务必须继续运行，而且他们担心在忙于项目任务时工作可能会堆积。与共享资源工作的项目经理应该与职能经理谈判，以确保共享资源有适当的时间处理项目。他们还应该就对团队成员绩效评级的话语权进行谈判。这将帮助你强化项目工作是重要的，需要团队成员进行处理和优先排序。\n\
  \n在与职能经理合作时需要记住的另一个要素是，他们可能会渴望抓住为你的项目分配资源的机会。然而，买者要小心！我经历过过度热情的职能经理有时意味着他们给我的资源是`low-quality\
  \ resources`。这并不意味着他们是坏资源，但通常意味着他们缺乏所需的技能组合，或者更糟，他们可能性格刻薄或与其他团队成员有冲突历史。如果你没有选择，我建议尽快与此类团队成员会面并设定明确的预期。我将在章的“人员管理”部分详细讨论这一概念。此外，注意那些无法承受任务所需消耗的低质量物理资源。\n\
  \n`resource shortage` 也可能导致`resource overallocation`。换句话说，由于短缺，执行你任务所需技能的资源也被分配到了其他项目中。资源短缺并不总是资源过度分配的原因。可能是你安排资源完成的任务多于其可用时间。过度分配的资源将在项目进度表中显示为\
  \ 100%（或更多）分配。实际上，资源永远没有 100% 的时间用于任何任务，因为他们还有需要执行的行政职能，例如填写时间卡、参加员工会议和回答电子邮件。\n\
  \n很遗憾地说，对于过度分配的资源没有简单的答案。这可能意味着你必须与高级管理团队合作以确定项目优先级。如果两个竞争项目所需的唯一资源无法兼顾两个项目，管理层必须决定哪一个具有优先权。\n\
  \n过度分配团队成员的对立面是拥有`benched resources`。闲置资源是指那些通常已经完成项目但尚未被分配到新项目，或者在新项目结束和开始之间有时间隙的人员。闲置资源对组织来说是昂贵的，因为，他们正付钱让他们坐在那里等待下一次任务。这种情况通常发生在项目化组织中。\n\
  \n### 项目间工作\n\n记住，当你分配资源时，需要考虑`interproject dependencies`和`interproject resource\
  \ contention`。\n\n\n\n\n\n当您需要另一个项目的完成交付物来开展当前项目时，就会发生项目间依赖。例如，贵机构可能正在城市中现有的高速公路上新建一条高速公路车道。然而，该项目还有其他关联项目（作为计划的一部分），必须在您完成高速公路车道建设之前完成。其中一个项目是在计划新车道的土地上进行环境研究。另一个项目可能是沿着高速公路挖掘开沟以铺设光电缆。这两个项目都必须在您启动项目之前完成。因此，你就面临着项目间依赖。\n\
  \n与其他项目的项目经理会面并了解他们的进度和风险至关重要。你还应该与他们讨论尽可能消除依赖关系的可能性。确保你收到了其他项目的最新状态报告，以便你能够跟踪关键依赖关系，并保持你的项目按计划进行，或在必要时采取纠正措施。\n\
  \n项目间的资源竞争在性质上与之前讨论的过度分配问题相似。你的资源可能在其他项目中被安排了类似的任务。你需要与其他项目的项目经理协调工作，对资源进行调度，以确保它们在需要时对你们都可用。\n\
  \n### 人员管理\n\n管理项目团队与管理职能工作组不同。项目团队是临时性的，让所有人为了共同目标一起工作可能是具有挑战性的，特别是当你的团队成员是特定领域的专家，且没有广泛的业务背景时。作为项目经理，你必须将这个小组塑造为一个高效的团队，他们能够合作按时、按预算和在范围范围内交付项目，同时产生高质量的结果。这并不总是一项容易的任务，特别是当你考虑到了全职和兼职团队成员、技术人员和非技术人员、组织内部和外部资源，在某些情况下甚至是分散在很大地理区域的团队时。\n\
  \n### 选择团队成员\n\n选择或获得具有正确技能和气质的团队成员对于项目的成功至关重要。项目人员可能来自组织内部（通常称为 `in-house resources`）或组织外部。他们也可能来自\
  \ `remote`（远程）地点。位于公司其他部分或其他世界其他地方的资源有时会感到与项目团队脱节。可能的情况下，你应该对资源进行 `collocate`（同地办公）；即你可以将他们物理上聚集在一起，让他们在同一个地点工作。\n\
  \n你经常会发现自己无法控制团队成员的选择。正如我们之前讨论的样，职能经理可能会根据成员的可用性将团队成员分配到项目中。其他时候，你会知道想要哪些团队成员加入项目并可以请求他们。重要的是，当你不熟悉某个资源或其技能组时，花些时间与职能经理讨论你需要的任务所需的技能和能力。面试被推荐的资源，询问与技能相关的特定问题，以及他们如何处理你分配给他们的任务。如果他们看起来并不合适，或者你对他们的技能和能力表示怀疑，请与职能经理会面，分享你的顾虑，并询问他们是否有其他人可用。\n\
  \n### 组织结构图和职位说明\n\n一旦选定了团队成员，创建一个 `project organization chart`（项目组织图）是一个好主意。我们都见过组织结构图。它通常记录了你的名字、职位、你的老板、老板的老板、老板的老板的老板，等等。它在性质上是层级的，类似于\
  \ WBS。在项目组织图的情况下，你可以以几种不同的方式呈现信息，包括传统的组织图，其中列有项目经理和项目成员的名字，如图 6.1\n\n**图 6.1** 项目组织图\n\
  \n你也可以通过 `organization breakdown structure (OBS)`（组织分解结构）展示项目工作。这种形式的组织结构图显示了组织内的部门、工作单元或团队（而不是个人）及其各自的工作包。\n\
  \n`resource breakdown structure (RBS)`（资源分解结构）是另一种层级图，它根据所需的资源类型来分解项目工作。例如，你可能在\
  \ RBS 上将漆工、木工和电工作为资源类型。\n\n### 矩阵图\n\n`responsibility assignment matrix (RAM)`（责任分配矩阵）是一种基于矩阵的图，将你的\
  \ WBS 元素映射到所需的资源。表 6.1 显示了一个 IT 开发项目 RAM 的示例部分。它列出了 WBS 标识符、所需的资源类型以及每个技能组所需的资源数量。\n\
  \n| WBS 标识符 | 程序员 | 测试员 | 市场 | 技术文档人员 | 服务器 |\n| --- | --- | --- | --- | --- | ---\
  \ |\n| 10–1–1–1 |  |  |  | 1 |  |\n| 10–1–1–2 | 2 |  |  |  |  |\n| 10–1–1–3 |  |\
  \ 3 |  |  | 1 |\n| 10–1–1–4 | 4 |  |  |  |  |\n| 10–1–1–5 |  |  | 1 |  |  |\n\n\
  **表 6.1** 项目责任分配矩阵示例\n\n我喜欢使用的另一种责任分配图称为 RACI 图表。这些图用于显示资源类型以及它们在项目中各自承担的责任。RACI\
  \ 通常被描述为一个图，每行列出资源名称（或团队成员的个人姓名），列列出里程碑或工作包等工作元素。交叉处的指示显示了何时需要这些资源。\n\n表 6.2 显示了一个会议活动项目团队的\
  \ `RACI chart`。在这个例子中，RACI 图显示了每个参与者对项目承担的责任级别。RACI 缩写中的字母是图中所示的标识。\n\n| | Olga\
  \ | Rae | Charlie | Lolita |\n| --- | --- | --- | --- | --- |\n| **酒店会议室** | R |\
  \ A | C | C/I |\n| **食物和零食服务** | C/I | C | I | A/R |\n| **演讲者合同** | C | I | R |\
  \ A |\n\n*R = 负责, A = 解释, C = 咨询, I = 通知\n\n**表 6.2** RACI 图示例\n\n*   R = 负责执行工作\n\
  *   A = 解释者，即负责产出交付物或工作包并对工作进行批准或签字的人\n*   C = 咨询，即对工作或决策提供建议的人\n*   I = 通知，即必须被告知决策或结果的人\n\
  \n在这个例子中，Olga 负责预订和分配酒店会议室，但 Rae 负责解释并且是必须确保这项任务完成并获得批准的人。Charlie 负责聘请演讲者，但 Lolita\
  \ 负责确保这项任务完成。Charlie 还需要在酒店会议室方面进行咨询，以确保演讲者被分配到能够容纳预计人数的房间。Lolita 负责并解释食物和零食服务，并需要被咨询和通知酒店会议室的任务。\n\
  \n这是一个非常棒的工具，因为它一眼就能看出资源在何处工作，还能看出资源在项目中的责任级别。\n\n### 角色与职责\n\n\n\n\n\n角色与职责文档列出了项目中的每个小组或个人团队成员及其职责。但项目团队成员的角色和职责不仅仅是分配的任务。他们还有需要遵守的标准和方法论、需要完成的文档以及时间报告的责任等。因此，除了将任务分配给人员外，开发一个模板来记录任务分配之外的角色和职责也是一个好主意。对于谁负责什么，描述越清晰越好。如果你需要复习特定的项目角色，我们在第\
  \ 2 章中讨论了团队成员的各种角色和职责。你可以将这些信息作为编写角色与职责文档的起点。\n\n## 构建和管理凝聚力团队\n\n每个团队都会经历一系列发展阶段。理解这些阶段非常重要，因为随着阶段推进，团队成员的行为会发生变化，而且他们所处的阶段会影响他们相互互动。\n\
  \n布鲁斯·塔克曼（Bruce Tuckman）博士开发了一个描述团队随时间发展和成熟的模型。根据塔克曼的，所有团队都会经历以下五个发展阶段：形成期、震风期、规范期、执行期和结束期。接下来我们将简单介绍这些阶段：\n\
  \n- **形成期 (Forming)**：`Forming` 是团队形成的起始阶段，此时所有成员汇聚在一起，互相介绍并被告知项目目标。这是团队成员学习他们为什么要一起工作的阶段。在此阶段，团队成员倾向于正式和保守，并采取“全对事公”的态度。\n\
  - **震风期 (Storming)**：`Storming` 是行动开始的阶段。在这个阶段，团队成员开始争夺职位和控制权，彼此产生冲突。他们正在权衡谁拥有最大的影响力，并为了地位进行竞争。\n\
  - **规范期 (Norming)**：`Norming` 是事情开始冷静的阶段。此时，团队成员已经相当了解彼此了。他们对自己在团队中的位置感到舒适，并开始处理项目问题而不是人事问题。在这个阶段，决策是共同做出的，成员表现出相互尊重和熟悉。\n\
  - **执行期 (Performing)**：啊，完美。好吧，至少接近完美。`Performing` 是优秀团队最终到达的阶段。在这个阶段，团队是高效且有效的。团队成员之间的信任水平很高，并取得了巨大的成就。这是成熟的发展阶段。并非所有团队都能进入执行期；许多团队在震风期和规范期之间循环。与一个已经进入执行期的团队工作是一件真正的享受。\n\
  - **结束期 (Adjourning)**：如名称所示，`adjourning`指的是工作完成后解散团队，并将成员返回各自的职能经理和团队。\n\n通过团队建设活动可以增强通过这些阶段的进程。`Team\
  \ building`（团队建设）是一系列旨在让多元化以高效有效的方式合作工作的活动或练习。它帮助他们建立社交纽带并识别共同兴趣，并有助于明确每个团队成员的角色和职责。当团队处于形成期和震风期时，组织的团队建设活动最有效，特别是当他们彼此还不熟悉时。搜索网络或咨询你的人力资源部门，寻找有助于你的新员工更好地了解彼此的团队建设活动。根据我的经验，一旦团队进入规范期及以后，可能不再需要这么多有组织的团队活动；然而，非正式活动在这一阶段非常有益处，特别是如果由团队自行安排的话，例如午餐、披萨之夜、运动活动、下班后的小啤酒等。\n\
  \n如果你的团队正经历性格冲突，或者团队构成发生了变化（老成员离职，新成员加入），你可能发现团队建设活动很有帮助。组织变革是采用团队建设活动的另一个好理由。\n\
  \n## 建立信任\n\n根据我的经验，与团队成员建立以及成员之间建立信任是项目经理确保高效团队能做的最重要的事情。正如古语所，信任是赢来的，而不是给予。\n\n\
  `Trust building`（建立信任）随着时间的推移产生，而不是一夜之间。根据我的经验，建立信任包括：做到你说要做的事、支持你的团队、关心你的团队、做他们的后盾、将组织利益放在个人利益之上并且谦虚。没有多少人愿意为一个首要考虑是自己的人工作或与其合作。\n\
  \n彼此信任以及信任项目经理的团队更愿意表达意见，并对不合理的想法提出反对。这听起来可能违背常理，但能够直抒胸会的团队更容易成功。他们对想法和任务有认同感，因为他们在事情中拥有发言权。\n\
  \n如果项目经理对这种反馈不持开放态度，或者认为自己拥有所有答案而不需要团队的投入，那么他们就不可能看到团队移动到执行期。\n\n花时间了解你的团队成员。问问他们关于业外兴趣的问题，并在他们遇到问题或冲突时表现出真诚的关心。这对于建立信任关系非常有帮助。\n\
  \n## 监控团队绩效\n\n管理团队成员的绩效可能是一项复杂的任务。成功的项目经理明白，当人们被允许执行分配的任务而无需有人预先批准他们采取的每一个行动时，他们的表现最好。只要最终结果按照计划完成，且对范围、进度、预算或质量没有影响，团队成员应该在如何完成任务方面获得自由和选择。\n\
  \n尽管你不应该微管理团队成员，但他们确实需要关于表现如何的反馈。大多数团队成员在某些方面表现良好，而在其他方面需要改进。即使你的组织不要求项目经理进行正式的书面评估，你也应该花时间为团队成员提供反馈，不要忙于管理项目问题而忽视了团队成员。在准备与团队成员讨论绩效时，以下是重点关注领域：\n\
  \n- 明确绩效预期\n- 识别绩效不佳的行为\n- 奖励卓越绩效\n- 批评绩效不佳的行为\n- 为所做的选择提供具体的后果\n\n### 绩效反馈\n\n\
  你与任何新团队成员的第一次会议，以及每个项目开始时的会议，是设定预期的会议。你们讨论以下内容：他们在项目中的角色、截止日期、绩效预期、团队互动、必须遵守的行业标准和法规，以及你对他们工作质量的期望。你希望他们知道联系你的最好方式，并知道你对他们可能提出的任何问题随时待解答。\n\
  \n绩效反馈应该及时给出。对几周或几个月前发生的事情尝试纠正措施几乎没有意义。团队成员可能甚至不记得相关绩效的细节了。最好在负面情况发生时立即处理。对你的观察保持客观，并让团队成员从他们的角度解释问题。最理想的情况是你和团队成员对发生了什么以及如何纠正该行为达成共识。不那么理想的情况是你必须移除该团队成员。\n\
  \n\n\n\n如果团队成员拒绝改正其行为，或者他们没有履行任务的能力，你必须与人力资源部门合作。如果你的团队成员来自职能部门，你需要写下这些问题并将这些信息提供给职能经理。\n\
  \n从项目中移除或更换人员并不是一件乐事。但如果所有其他行动都失败了，且团队成员拒绝改进，你必须采取措施以防止士气严重下降。采取这种行动也能建立对你作为领导者的信任。你的团队将看到你愿意以富有同怀的方式采取必要的行动来处理团队问题。\n\
  \n## 奖励卓越表现\n\n认可和奖励是个人和团队动力的重要元素。它们是认可和促进良好行为的正式方式，而且当由项目经理或管理团队执行时效果最有效。项目团队努力工作，并经常克服众多挑战来交付项目。如果你的公司采用职能型组织结构，项目工作可能得不到职能经理的适当认可。这意味着要由你来认可团队正在做的工作，并实施一套认可和奖励制度。\n\
  \n当你考虑到奖励时，通常会想到金钱奖励。如果你足够幸运有资金来建立奖励体系（无论是作为直接预算项目，还是作为管理储备金的一部分），那太好了。但金钱之外，你还有其他选择可以作为奖励——例如休假、电影票、体育或文化活动、团队晚餐、奖杯等等。我们曾在某些组织中工作过，那里的一件普通物品被指定为表现卓越的“奖杯”。个人团队成员负责相互认可并传递这一奖杯。\n\
  \n另一个零成本的想法是向员工的经理写一封感谢信，并抄送相应的组织高管和项目赞助人。这可以是传达你对卓越表现表示感谢的有力手段。\n\n并不是所有项目经理都有资源来个人或集体地奖励团队成员，但这并不意味着卓越的表现不应该被忽视。你可以做的最简单的事情之一就是直接告诉人们你意识到了他们的成就，并且你感谢他们的努力。一句简单的“谢谢”就能产生奇妙的效果。一封手写的感谢信只需要几分钟时间，而且是员工可以保存在档案里的东西。\n\
  \n确保奖励与成就成正比，并在团队成员之间公平分配。偏袒某个或多次向同一位团队成员颁奖会打击士气，而不是提高它。\n\n此外，要对你的团队成员及其文化背景保持敏感。有些人喜欢在公开场合受到表扬，而另一些人可能会因为这种行为而感到羞愧，而不是感到感激。\n\
  \n你应该制定并记录奖励的标准，特别是金钱奖励。与人力资源部门合作，了解你组织中奖励制度的指南。\n\n关键在于建立一个计划来认可项目团队成员的努力，无论这涉及金钱、奖品、感谢信还是简单的感谢。无论你的奖励和认可计划采取什么形式，你必须确保它一致适用于所有项目团队成员，并且奖励与所付出的努力或取得的结果相匹配。奖励的不一致应用通常被解释为偏袒。\n\
  \n通过培训也可以开发团队并提高整体绩效。我将在下讨论。\n\n### 培训\n\n培训涉及确定团队成员的技能和能力、评估项目需求，并为团队成员执行其活动提供必要的培训。在某些行业或组织中，分配到新项目的福利之一就是扩展技能集或接受新产品或流程培训的机会。\n\
  \n提供项目团队最常见的培训类型之一是项目管理培训。项目管理培训可能包括项目经理开发的、外部公司提供的正式培训，或来自内部 PMO 对所有项目成员均要求使用的标准方法论、工具和模板的培训。\n\
  \n冲突管理是团队建设、沟通和团队凝聚力的重要方面。我们接下来来看这个主题。\n\n## 冲突管理\n\n有一点是肯定的：如果你有人在你的项目上工作，在项目过程中你可能会经历一次，甚至多次冲突。`Conflict`\
  \ 是双方或个人之间欲望、需求或目标的不兼容。这可能导致一方抵制或阻止另一方实现他们的目标。\n\n项目可能由于几个原因之一产生冲突。正如我在书中多个地方讨论过的样，大多数组织的资源需求非常旺盛。资源的竞争可能会导致项目经理、职能经理，甚至项目团队成员之间的冲突，他们可能对选择不那么出色的队友感到不悦。\n\
  \n工作风格有时会导致冲突。例如，我们都曾与这样的团队成员合作：他们的办公桌堆满了纸张、书籍和其他物品，以至于你看不到桌面。当然，我们也见过相反的情况——那些桌上一点纸都没有的成员，只有电话和电脑显示器。有些团队成员是早起型，在太阳升起前就上班，但下午\
  \ 4 点左右就精疲力竭了，而另一些人在下午和傍晚时段表现最好。工作风格有成百上千种变化并导致团队冲突。你应该意识到团队成员的偏好，并尽可能提供合理的解决方案。\n\
  \n约束是导致项目冲突的另一个领域。变更请求、范围蔓延和利益相关者只是可能导致不兼容目标的约束的几个例子。\n\n冲突的另一个常见沟通问题。也许团队成员不理解项目目标，或者他们缺乏过硬的人际技巧，不擅长沟通他们的需求或问题。有时团队成员之间沟通不畅，导致错失截止日期或任务不符合质量标准。沟通在项目管理中是一个如此重要的问题，以至于我专门为这个主题写了一整章。我将在第\
  \ 8 章更多地讨论沟通。\n\n你有几种技术可以处理并理想地解决团队成员之间的冲突。你接下来将查看这些。\n\n### 管理冲突\n\n在我管理数百个项目和人员的职业生涯中，我能分享给你的最重要的概念之一是：冲突不会自动消失。你不能通过希望让它消失并期待最好的结果。遗憾的是，忽视冲突也不会让它消失。我在职业生涯早期尝试过一两次这种策略，结果是彻底失败。你需要在冲突扩大并失控之前正面对它。\n\
  \n根据 CompTIA 的说法，有几种方法可以检测和解决冲突。你接下来将查看每种技术。\n\n\n\n\n## 平滑（Smoothing）\n`Smoothing`\
  \ 是解决冲突的一种临时方法。在这种技术中，强调共识而非差异之处，从而使真实问题被掩盖。这种技术并不会导致永久性的解决方案。当有人试图让冲突看起来比实际没重要时，也会发生平滑行为。平滑是一种双输的冲突解决技术，因为双方都没有获胜。\n\
  \n## 强制（Forcing）\n`Forcing` 名顾其实义。一个人将解决方案强加给其他方。虽然这是一个永久解决方案，但它并不一定是最好的解决方案。人们会顺从，因为……怎么说呢，他们被迫这样做。这并不意味着他们认同该解决方案。在尝试建立团队时，这不是最好的技巧。这是一种赢输的冲突解决技术。强制的一方获胜了，而失败方则被迫接受决定。\n\
  \n## 妥协（Compromising）\n`Compromising` 是指冲突中的每一方都放弃一些东西以达成解决方案。每个参与者都决定自己愿意放弃什么、不放弃什么，最终通过所有的让步达成解决方案。在这种情况下，双方既不赢也不输。结果是双方都没有真正对达成的决策表示认同。然而，如果双方都对结果做出坚定的承诺，那么解决方案就可以变成永久性的。\n\
  \n## 对抗（Confronting）\n`Confronting` 也称为 `problem-solving`（解决问题），是解决冲突的最佳方法。使用这种技术时的一个关键行动是进行事实调查。这里的逻辑是：问题存在一个正确的解决方案，事实将证明该方案。一旦事实被揭露，就会提交给各方，决定将显而易见。因此，解决方案变成了永久性的，冲突随之消失。这是项目经理最常用的冲突解决方法，也是双赢技术的示例。\n\
  \n## 规避（Avoiding）\n`Avoiding` 有时被称为退缩，永远不会产生解决结果。这发生在当一方起身离开并拒绝讨论冲突时。这可能是所有技术中最糟糕的，因为没有任何问题得到解决。这是一种双输的冲突解决技术。\n\
  \n## 谈判（Negotiating）\n`Negotiating`是我之前讨论过的一种技术。它涉及双方的沟通、倾听和提问。有时谈判会使用一个对结果没有利益关系且对解决方案保持中立的第三方。这个第三方帮助所有方达成共识。例如，谈判是集体谈判组织经常使用的技术。取决于谈判如何进行以及结果如何，谈判可以是双赢、赢输或双输的技术。\n\
  \n这些冲突管理风格可以帮助你理解你观察到的行为，并帮助你达成解决。另外两种需要特殊处理的情况是处理团队成员纠纷和处理不满的团队成员，我将在接下来讨论。\n\n\
  ### 团队成员纠纷\n鉴于项目团队成员多元的背景和不同的专业领域，团队成员之间产生分歧并不意外。有时，人们只需要进行对话并解决问题，但在其他时候，纠纷需要项目经理的干预。\n\
  \n你可能倾向于根据任何特定时刻看到的现象做出草率判断，但这可能只会加剧局面。你需要获取事实并理解纠纷背后的原因。访问每个参与的团队成员以获取尽可能多的信息。如果是小纠纷，你可以考虑主持一个由你主持的会议，要求每个人解释他们的问题并提供潜在的解决方案。你可以将其转化为头脑风暴会议，以便让每个人参与，并将寻找解决方案的负担交给他们。\n\
  \n有时，纠纷非常深，或者可能涉及威胁或其他职场问题。一旦发现问题，务必人力资源部门参与。大多数组织对此类纠纷都有严格的政策和指南。他们可能会建议调解、培训、纪律处分或更换一名团队成员。不要尝试自己解决这些类型的问题。如果你这样做了，可能会发现自己陷入了法律问题，特别是当你采取了公司政策之外的行为。\n\
  \n### 不满的团队成员\n很少的情况能比不满的团队成员更快地破坏团队士气。这可能在项目的任何时候发生，并可能涉及团队中的任何人。\n\n不满的团队成员的表现有多种形式。他们可能在会议上变得爱争论，或者不断发表冷嘲热讽的话贬低项目。更糟糕，这个不满的人可能会花时间“串门（cube\
  \ hopping）”，与其他团队成员分享这些对项目的负面情绪。当原本满意的团队成员不断听到关于项目毫无用处、注定失败或正面临被裁撤的言论时，团队整体生产力将受到影响。\n\
  \n作为项目经理，你需要与该员工花一些私下时间来确定不满的原因。可能是这个不开心的成员并不完全理解项目范围，或者不知道他们的贡献将如何导致项目成功。或者，可能这个人从根本就不想要这项任务，觉得被强行分配到一个他们不信的项目中。\n\
  \n最好的方法是从倾听开始。坚持事实，并要求该人员澄清负面言论。如果团队成员在重复错误信息，请纠正记录。如果他们对项目的某个方面感到沮丧并觉得没有人在听，请找出问题所在，并解释在背后诋毁项目并不是解决问题的方法。如果此人真的不想加入项目团队或不想完成他们的任务，请尽快与职能经理或你的赞助人合作以更换此人。\n\
  \n作为项目经理，让团队成员负责是你的责任。一旦你给了他们陈述自己情况的机会，并针对他们的顾虑做了一些积极的改变，请明确表示你期望他们的负面行为能够停止。如果他们没有停止，你就需要让人力资源专家参与并开始纪律处分。\n\
  \n理想情况下，冲突解决不应该占据你与团队的大部分时间。根据我的经验，在大多数项目中，这通常是一个发生一次或两次的问题，取决于项目的长度和复杂性。你可能会投入更多精力在构建和管理凝聚性团队，并使用有效的奖励和认可系统来激励团队。接下来我们将看看奖励和认可系统。\n\
  \n现在团队已经建立并到位，是时候召开项目启动会议了。\n\n### 项目启动会议（Project Kickoff）\n项目启动会议通常在项目章程签署后举行。然而，在某些情况下，那时可能还没有分配所有的项目团队成员。如果是这样，最好推迟启动会议，直到分配了大多数团队成员。\n\
  \n举行两次启动会议以避免这个问题也是常见的。第一次会议在签署项目章程后举行，另一次在所有团队成员分配后举行，以启动项目的执行阶段。\n\n\n\n\n\n项目启动会议是正式介绍团队成员和利益相关者，并同时向所有人传达相同信息的最佳方式。你可能并不认识所有的团队成员，取决于他们是如何被选拔（或任命）参与项目的，你可能甚至没有机会对他们将担任的职位进行面试。正如我讨论过的，有些组织根据职能经理的决定来提供团队成员，项目经理几乎没有参与建议。\n\
  \n你在项目启动会议上定设的基调可能会决定你与团队关系的成败。一个理想的项目启动会议应该是严肃业务与趣味性的结合。你的目标是让团队在项目目标上达成共识，并让团队成员之间感到自在。这是开始“形成阶段（forming\
  \ stage）”的绝佳机会。\n\n组织启动会议的方法有很多。以下是一些你可能选择包含的关键组件：\n\n### 欢迎\n通过欢迎团队成员开始会议，并让他们知道你期待与他们合作，是一个好主意。欢迎环节还为你当天的后续工作奠定基础。花几分钟时间介绍参与者可以从会议中获得什么，以及他们在项目期间将参与哪些活动。\n\
  \n### 自我介绍\n典型的介绍格式可能包括个人的职能领域、简要背景以及在项目中的角色。项目经理应该开始这一流程，为后续设定合适长度和详细程度的范例。对你想让团队成员分享的信息进行深思，以确保投入的时间是值得的。\n\
  \n### 项目赞助人和关键利益相关者\n邀请项目赞助人、客户以及对项目至关重要的其他高管利益相关者。让团队成员认识他们，并直接听到他们对项目的目标和期望是非常重要的。这些人可能可能无法参加整个会议，但请尽力让他们至少出席并向团队发表简言。\n\
  \n你可能需要在这里进行一些辅导，因此在会议之前，花时间与高管利益相关者沟通他们他们应该传达的信息。如果你的赞助人恰好是一位充满活力的演讲者，你可能想为他们留更多时间，让员工对他们正在开展的项目兴奋起来。\n\
  \n### 项目概述\n你从项目目标和目的开始这一部分。你还应该总结每个项目阶段的关键交付物，以及高层进度计划和预算。这一概述将帮助团队成员掌握大局，并理解他们在项目中的定位。它也有助于为项目的目的和目标奠定基础。\n\
  \n### 利益相关者期望\n这一部分是前一个章节的自然过渡。除了解释目标、进度和预算外，让团队理解利益相关者对项目的期望也同样重要。如果存在项目截止日期或预算限制，请解释其原因。确保团队成员意识到与该项目相关的任何质量疑虑、政治问题或市场公告。\n\
  \n### 角色与职责\n从描述你在项目中的角色和职责开始这一部分。许多团队成员可能不认识你，也不熟悉你的管理风格，因此这是你机会沟通你将如何管理项目，以及你对团队运作方式的期望。\n\
  \n根据项目的规模，你可能希望审查每个关键团队成员或技能领域的角色和职责。让他们知道你对项目管理程序、问题报告和升级、团队会议时间表、你对个人进度报告的期望，以及他们将如何被要求为项目进度报告提供意见的期望。\n\
  \n### 问答\n启动会议中最重要的议程项目之一是你预留给团队成员提问的时间。这能让他们投入项目，并且是澄清关于目标、交付物、期望等问题的理想机会。\n\n\
  项目启动会议是让所有人达成共识的绝佳机会。当你开始执行项目时，你可能会有一群既从启动阶段起就参与项目的人，也有对项目来说是新面孔的人。会议是设定期望并提醒所有人他们在项目中所角色的时间。\n\
  \n### 总结\n\n所有项目都需要资源。资源包括人力资源和材料、设备等物理资源。\n\n共享资源为多个经理服务。他们可能同时向职能经理和项目经理汇报。如果你正在与共享资源合作，请确保你在团队成员的绩效评估中拥有发言权。低质量资源可能不具备完成分配任务所需的技能。在低质量物理资源的情况下，请另处寻找。\n\
  \n资源分配识别了所需的资源类型、技能组以及需要这些技能的时间范围。当没有足够的资源具备任务所需的技能时，就会发生资源短。资源过度分配发生在一个资源（或一组资源）被安排同时处理过多任务时。这些任务可能属于同一个项目，也可能是来自不同项目和日常运营工作的任务组合。待命资源（Benched\
  \ resources）是指那些已经离开一个项目并等待下一个项目开始的人。这些对组织来说是昂贵的资源，因此要与其他项目和职能经理协调工作，尽快分配这些资源。\n\
  \n项目间依赖发生在你需要上项目的完成交付物来开始下一个项目的工作时。项目间资源竞争发生在当资源被安排在竞争性项目的相似任务上，并且在需要时可能无法供你的项目使用。\n\
  \n团队成员可能是内部资源、组织外部资源或`remote resources`。尽可能让资源同地办公。\n\n项目组织结构图是一张显示赞助人、项目经理和团队成员的层级图。`RACI`图显示团队成员的角色和职责（也可以描述团队或业务部门）。`RACI`代表负责（responsible）、问责（accountable）、咨询（consulted）和知会（informed）。\n\
  \n所有团队都会经历五个发展阶段：形成（forming）、风暴（storming）、规范（norming）、执行（performing）和结束（adjourning）。\n\
  \n团队建设活动有助于小组以高效的方式合作。建立信任是一项重要活动。与团队成员建立信任需要时间，并且项目项目展现展现、尊重、诚实、正直和开放。\n\n及时向团队成员提供反馈并在负面情况出现时尽快处理。从项目中移除人员应与人力资源部门协调进行。\n\
  \n奖励和认可是个人和团队的重要激励因素。确保奖励与成就相符。还要确保奖励标准和流程已记录在案。\n\n冲突会发生在几乎所有项目中。冲突解决的常用技术包括平滑、强制、妥协、对抗、回避和谈判。对抗（也称为解决问题）是项目经理应该使用的技术。\n\
  \n\n\n\n\n项目启动会议介绍团队成员和利益相关者相互认识，并描述项目的目标和目的。这些会议通常在项目章程签署后举行。\n\n## 考试要点\n\n**理解资源的定义。**\
  \ `Resources` 可以是人力资源或物理资源。它们被用于完成项目工作。资源包括这些类别：共享资源、专用资源、低质量资源、内部资源、闲置资源和远程资源。\n\
  \n**定义资源分配。** `Resource allocation` 是识别资源的可用性及技能组合，并将其分配给项目任务。\n\n**定义资源过度分配和资源短缺。**\
  \ `Resource overallocation` 指资源在给定的时间范围内被分配了过多的任务的情况。`Resource shortage` 指当没有足够的具备所需技能或能力的资源来完成任务时的情况。\n\
  \n**定义项目间依赖关系和项目间资源竞争。** `Interproject dependencies` 指当一个项目必须在另一个项目开始之前完成其交付物时发生的情况。`Interproject\
  \ resource contention` 指当资源被分配给多个项目，导致时间与可用性产生冲突时发生的情况。\n\n**定义 RACI 图并定义其缩写。**\
  \ 这是一个基于矩阵的图表，显示了工作产品对应的资源角色和责任级别。`RACI` 代表负责（responsible）、认可（accountable）、被咨询（consulted）和知情（informed）。\n\
  \n**命名团队发展的五个阶段。** 它们是组建（forming）、风暴（storming）、规范（norming）、执行（performing）和休散（adjourning）。\n\
  \n**描述团队建设和信任建立。** 团队建设由一系列帮助不同群体以高效有效的方式工作的活动组成。信任建立涉及与项目经理以及团队成员之间建立信任。这需要时间，通过言出守信和考虑团队最佳利益来实现。\n\
  \n**列出冲突解决技术以及最适合项目经理的技术。** 它们是平滑（smoothing）、强制（forcing）、折中（compromising）、对抗（confronting）、回避（avoiding）和谈判（negotiating）。`Confronting`\
  \ 也称为 `problem-solving`，是项目经理应该使用的技术。\n\n**说明项目启动会议的目的。** 项目启动会议是为了正式介绍所有项目团队成员、审查项目目标和交付物、讨论角色和职责以及审查利益相关者的预期。\n\
  \n## 关键术语\n\n在参加考试之前，请确保你熟悉以下术语：\n\n*   休散 (adjourning)\n*   回避 (avoiding)\n*  \
  \ 闲置资源 (benched resources)\n*   同地办公 (collocate)\n*   同地 (colocate)\n*   折中 (compromising)\n\
  *   冲突 (conflict)\n*   对抗 (confronting)\n*   专用资源 (dedicated resources)\n*   强制\
  \ (forcing)\n*   组建 (forming)\n*   内部资源 (in-house resources)\n*   项目间依赖关系 (interproject\
  \ dependencies)\n*   项目间资源竞争 (interproject resource contention)\n*   低质量资源 (low-quality\
  \ resources)\n*   谈判 (negotiating)\n*   规范 (norming)\n*   组织分解结构 (OBS)\n*   执行 (performing)\n\
  *   物理资源 (physical resource)\n*   问题解决 (problem-solving)\n*   项目组织图 (project organization\
  \ chart)\n*   RACI 图 (RACI chart)\n*   远程资源 (remote resources)\n*   责任分配矩阵 (RAM)\n\
  *   资源分配 (resource allocation)\n*   资源分解结构 (RBS)\n*   资源短缺 (resource shortage)\n\
  *   资源过度分配 (resource overallocation)\n*   共享资源 (shared resource)\n*   平滑 (smoothing)\n\
  *   风暴 (storming)\n*   团队建设 (team building)\n*   信任建立 (trust building)\n\n## 复习题\n\
  \n1. 你的项目正在进行中，团队成员合作良好，预见到项目需求，并且他们都理解自己在项目中的角色。本周介绍了一个新的团队成员并开始与团队一起。这种情况代表了团队发展的哪个阶段？\n\
  \    1. 组建\n    2. 风暴\n    3. 执行\n    4. 规范\n\n2. 下列哪项有助于建立高效有效的团队、提高士气并建立社交纽带？\n\
  \    1. 团队建设\n    2. 信任建立\n    3. 项目团队中拥有专用资源\n    4. 在正确的时间使用适当的冲突解决技术\n\n3. 一位团队成员来到办公室抱怨，另一位同事在中午前从不参加会议，并且似乎忽略了她遵循正当流程的要求。以下描述的是哪种情况？选择两项。\n\
  \    1. 这描述了项目间资源竞争。\n    2. 这描述了低质量资源。\n    3. 这描述了冲突。\n    4. 这描述了一个应该使用谈判冲突技术的情况。\n\
  \    5. 这描述了不同的工作风格。\n\n4. 下列所有项中哪一个不是团队发展的阶段？\n    1. 休散\n    2. 对抗\n    3. 执行\n\
  \    4. 风暴\n\n5. 一个关键项目团队成员被分配到另外两个项目。项目进度表显示，该资源在另一个项目需要期间也在此需要。这描述了什么？\n    1.\
  \ 资源分配\n    2. 项目间资源竞争\n    3. 资源短缺\n    4. 资源冲突\n\n6. 你的项目正在经历一些困难。你确定主要问题是供应商的表现。一位关键利益相关者坚持问题不在供应商；问题在于项目团队。然而，该关键利益相关者在会议的大部分时间内强调共识领域。这描述了哪种冲突解决技术？\n\
