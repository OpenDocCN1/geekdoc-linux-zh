  \n\n\n\n\n## 提升你的市场竞争力\n如果你花一点时间浏览项目管理职位的招聘公告，你会经常发现证书要么是非常受欢迎的，要么是强制要求的。`CompTIA\
  \ Project+` 认证将帮助你从其他候选人中脱而出，并证明你具备履行项目经理职责所需的技能和知识。\n\n## 提供晋升机会\n你可能会发现，你的 `Project+`\
  \ 认证正是你向职业阶梯更上一层所需的所需的。那些学习并并通过认证考试的人，至少证明了他们具有攻克困难学科的毅力，并通过对该主题的测试证明了他们的理解。\n\n\
  ## 为高级项目管理培训提供先决\n如果你正在考虑从事项目管理职业，`Project+` 考试是一个极佳的开始。学习此考试将让你获得关于项目管理本质的背景知识，而不仅仅是某家公司或组织对它的看法。通过考试后，你应该考虑通过`项目管理协会\
  \ (Project Management Institute)` 获取`注册初级项目管理师 (CAPM®)` 或`项目管理专业人士 (PMP®)` 认证。本学习指南遵循\
  \ `PMI®` 概述的原则和流程，是了解其认证体系的极佳入门。\n\n## 增强客户信心，因为它增强了你的信心\n知道你拥有项目管理认证，并且听到你说话和行动充满自信的客户，会对你所代表的公司更有信心。例如，如果你能够识别并描述项目中需要准备的四类风险，你的客户就会对你产生信任。\n\
  \n## 如何获得 Project+ 认证\n首先，学习书中概述的主题和流程，并务必回答所有章末问题，参加作为 `www.wiley.com/go/sybextestprep`\
  \ 在线题库一部分提供的额外加分考试。\n\n然后访问 `CompTIA` 网站（`www.comptia.org`）查找当前进行考试的考点列表。\n\n到达测试中心时，你需要驾照和其他一种形式的身份证明。测试区域内不允许携带计算器、电脑、手机或其他电子设备。你有\
  \ 90 分钟的时间参加考试，共有 90 道选择题。此考试没有先决条件。在你完成测试后，你将立即收到成绩通知。\n\n## 谁应该买这本书？\n如果你对项目管理感兴趣并想学习更多相关主题的知识，你应该买这本书。`Project+`\
  \ 考试是你接触项目管理概念和技术的理想方式，而这本书将让你沉浸在这些技术的基础知识中。\n\n如果你从未参加过认证考试，你会发现 `Project+` 考试是一个很好的入门方式。测试并不会过于复杂，也不会充斥着陷阱题；它仅仅涵盖了项目管理的基础知识。一旦你通过考试并对自己的项目管理知识和技能获得信心，你就准备好进阶其他认证，并渴望学习项目管理涉及的更深层次的主题。\n\
  \n## 本书涵盖了什么？\n本书遵循 `CompTIA Project+` 考试大纲，分为涵盖主要主题区域的章节。每个部分的解释都足够详细，足以成为一名 `Project+`\
  \ 认证专业人士。某些领域经过了扩展，这些是需要掌握的重要概念，但它们并不直接对应考试目标。\n\n你将在书中学习到以下信息：\n\n*   **第 1 章：启动项目**\
  \ 提供了项目管理的高级概述，介绍了项目管理的基本术语，包括项目经理可能工作的组织结构类型。\n*   **第 2 章：项目团队角色与职责** 概述了参与项目管理的各种角色，从利益相关者、项目支持者/赞助人到项目经理和项目团队成员。\n\
  *   **第 3 章：创建项目章程** 从详细讨论 `PMI®` 定义的过程组开始：启动、计划、执行、监控和控制以及结束。然后检查了项目章程的要素（章程的定义是最重要的`启动`过程），并以启动会议的概述作为结束。\n\
  *   **第 4 章：创建工作分解结构** 进入项目计划阶段，从记录项目范围、理解项目影响和约束开始，以将项目任务分解为工作分解结构结束。\n*   **第\
  \ 5 章：创建项目进度计划** 将计划扩展到创建详细的项目进度计划。它涵盖了整个计划过程，从识别和对要执行的任务进行排序以及分配资源开始。你将学习如何计算任务时长以及通过这些任务计算关键路径，以及确定里程碑、设定基准并获得批准。最后，你将看到如何建立治理流程。\n\
  *   **第 6 章：资源计划与管理** 通过项目团队管理将项目管理延伸到执行阶段。你将学习确定资源需求、人员管理、冲突解决，以及启动会议在团队建设中的作用。\n\
  *   **第 7 章：定义项目预算与风险计划** 涵盖了成本估算、成本预算以及你项目的风险活动和策略。你将学习估算和随后跟踪成本的基本技术，以及风险分析和计划。\n\
  *   **第 8 章：计划沟通** 涵盖了沟通——与利益相关者、团队成员及其他人——在项目管理中的作用。你将学习需要沟通哪些信息以及如何最有效地进行沟通。\n\
  *   **第 9 章：处理变更请求与采购文档** 展示了如何处理不断变化的项目需求，特别关注了为软件开发快速演变的需求而设计的`敏捷 (Agile)` 方法。它还查看了可能影响项目的组织变更类型以及处理供应商时使用的特定文档。\n\
  *   **第 10 章：项目工具与文档** 查看了某些用于告知利益相关者、记录行动事项和会议记录以及分析项目工作性能和结果所需的工具和文档。它还回顾了项目经理结束项目时将采取的步骤。\n\
  \n## 交互式在线学习环境与题库\n我整合了一些非常棒的在线工具帮助你通过 `Project+` 考试。随 `Project+` 认证指南提供的互动在线学习环境提供了题库和学习工具，帮助你准备考试。通过使用这些工具，你可以大大增加第一次尝试就通过考试的几率。\n\
  \n在线部分包括：\n\n**示例测试** 本书和在线提供了许多示例测试，包括你会在本引言末尾找到评估测试，以及包含每章末尾复习题的各章测试。此外，还有两份加分模拟考试。使用这些问题来测试你对学习指南内容的掌握情况。在线题库可在多个设备上运行。\n\
  \n\n\n\n\n**闪片** 在线题库包含 150 多张闪片，专门编写用以直击你的知识弱点，所以如果起初没有完美通关，也不要气馁！它们的存在是为了确保你真的为考试做好了准备。别担心——有了这些复习题、模拟考试和闪片，当考试来临时你将绰绰有余！问题以数字闪片的格式提供（一个问题后跟一个唯一的正确答案）。你可以使用这些闪片来强化学习，并在考前进行最后的冲刺准备。\n\
  \n**其他学习工具** 本书中关键术语的词汇及其定义以完全可搜索的 PDF 格式提供。\n\n## 如何使用本书\n\n如果你想为认真备备 `CompTIA\
  \ Project+` 考试打下坚实的基础，那么就不用别处寻找了。我花了数百个小时来编写这本书，唯一的初衷是帮助你通过考试，并真正学习项目管理这一令人兴奋的领域！\n\
  \n书中充满了价值信息，如果你理解了本书的组织结构，你就能最大限度地利用学习时间。\n\n为了最大化阅读本书的收益，我建议采用学习方法：\n\n1. 完成本引言末提供的评估测试。（答案在测试末尾。）如果你不知道任何答案也没关系，这正是你买这本书的原因！仔细阅读你做错的任何题目的解释，并记录下相关材料所属的章节。这些信息将帮助你制定学习策略。\n\
  \n2. 仔细学习每一章，确保你完全理解了每章开头列出的信息和测试目标。对于任何包含你错题相关材料的章节，要格外关注。\n\n3. 回答与每个章节相关的所有复习题。（答案在\
  \ `Appendix A` 中。）记录下让你困惑的问题，并再次学习它们涵盖的主题，直到概念变得非常清晰。再次强调——不要只是扫一眼这些问题！确保你完全理解每个正确答案的原因。记住，这些不会与你在考试中遇到的题目一模一样，但它们的编写目的是帮助你理解章节内容并最终通过考试！\n\
  \n4. 尝试本书特有的练习题。你可以在 [`www.sybex.com/go/sybextestprep`](http://www.sybex.com/go/sybextestprep)\
  \ 找到这些题目。\n\n5. 使用所有的闪片进行自测，这些闪片也可以在下载链接中找到。这些是全新的更新闪片，旨在帮助你准备 `Project+` 考试，是一个极佳的学习工具。\n\
  \n为了学习书中涵盖的每一部分材料，你必须坚持且有规律地投入精力。尝试每天留出相同的时间来学习，并选择一个舒适安静的地方。我相信，如果你努力工作，你会对自己学习这些材料的速度之快感到惊讶。\n\
  \n如果你遵循这些步骤，并在使用复习题、模拟考试和电子闪片的基础上真正进行学习，那么想要通过 `Project+` 考试实际上很难。但请理解，备考 `CompTIA`\
  \ 考试就像健身——如果你不每天去健身房，目标是不实现的！\n\n### 参加 Project+ 考试的技巧\n\n是一些成功参加考试的通用建议：\n\n* 携带两种身份证明。其中一种必须是带身份证，如驾照。另一种可以是主主信用卡或护照。两种形式都必须有签名。\n\
  \n* 早点到达考试中心，以便放松心情并复习学习材料。\n\n* 仔细阅读题目。不要急于得下结论。确保你完全清楚题目要求的是什么。\n\n* 不要留下任何未回答的问题。未回答的问题会扣你的分。\n\
  \n* 将会有有多个正确答案的问题。当存在多个正确答案时，题目末尾会有一个说明，指示你选择正确数量的答案，例如“选择两个”。\n\n* 在回答你不确定的多选题时，使用排除法先移除错误选项。如果你需要进行有理的猜测，这将增加你的几率。\n\
  \n* 有关考试的最新价格和注册程序的更新，请参阅 `CompTIA` 网站 [`www.comptia.org`](http://www.comptia.org)。\n\
