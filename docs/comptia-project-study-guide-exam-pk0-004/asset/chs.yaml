  \ `PMO`，由行政服务总监管理。IT 部门由 IT 总监管理。电信分段由电信总监管理。谁是项目的赞助人？\n    1. 收款部门经理\n    2. 行政服务总监\n\
  \    3. IT 总监\n    4. 电信总监\n    5. 信息不足\n\n13. 这些人管理质量保证、范围、风险、预算和时间。\n    1. 项目团队成员\n\
