  \n### 本章涵盖的 CompTIA PROJECT+ 考试考点包括：\n\n* ![](img/correction.jpg) **1.4 识别成本控制的基础基础：识别项目成本控制的基础知识。**\n\
  \    * 项目总成本\n    * 支出跟踪\n    * 支出报告\n    * 耗尽率 (Burn rate)\n    * 成本基准/预算\n   \
  \     * 计划与实际\n* ![](img/correction.jpg) **2.2 解释风险策略和活动的重要性。**\n    * 策略\n    \
  \    * 接受 (Accept)\n        * 缓解 (Mitigate)\n        * 转移 (Transfer)\n        *\
  \ 避免 (Avoid)\n        * 利用 (Exploit)\n    * 风险活动\n        * 识别\n        * 量化\n \
  \       * 计划\n        * 评审\n        * 响应\n        * 注册\n        * 优先级排序\n      \
  \  * 沟通\n* ![](img/correction.jpg) **4.1 比较各种项目管理工具。**\n    * SWOT 分析\n\n![](img/egeng009.jpg)\
  \ 本章将涵盖成本估算和成本预算，以及你项目的风险活动和策略。\n\n对于许多项目经理来说，项目计划最重要的部分是范围说明、进度和预算。正如你可能记得的，这些也恰好构成了“三重约束”的经典定义。这并不意味着计划的其他部分不重要。例如，沟通计划和风险管理计划在任何项目中都是重要的。\n\
  \n## 成本估算\n\n现在你已经制定了项目进度并记录了项目资源需求，你可以准备开始估算完成项目工作所需的成本、确定项目预算并估算项目总成本了。\n\n你可以使用多种技术来确定成本估算。我将在本章介绍四种技术，包括类比法（也称为*自上而下*）、参数法、自下向上法和三点估算法。我还会提供一些提示，帮助你完成估算过程。记住，这些估算技术既可以用于估计活动时长，也可以用于估算成本。\n\
  \n### 成本估算技术\n\n你可以使用多种技术来估算项目成本；你可以在项目规划的不同阶段使用这些方法的全部或部分，或者对某些活动使用一种估算方法，对其他活动使用另一种方法。\n\
  \n各种估算方法的准确程度不同，每种方法可能会产生不同的结果，因此在提供成本估算时，说明你正在使用哪种方法是非常重要的。让我们详细查看这些方法并讨论它们是如何工作的。\n\
  \n#### 类比估算 (自上而下估算)\n\n我在第 5 章讨论进度规划时提到过类比估算。记得这种技术使用数学模型来计算成本，通常使用工作量乘以速率。此外，对于复杂项目或在专业行业内执行的项目，还有商业参数建模软件包可用。\n\
  \n参数估算取决于用于创建模型的数据的准确性。如果你的组织使用参数建模，请花些时间了解可用的特定模型，以及该技术是否适用于你的特定项目。\n\n#### 自下向上估算\n\
  \n\n\n\n\n最精确的成本估计技术被称为 `bottom-up estimate`（自下向上估计），它为项目中的每个工作包分配成本估值。`WBS` 和项目资源需求是进行\
  \ `bottom-up estimate` 的关键输入。其核心思想是从 `WBS` 的工作包层级开始，计算分配给该工作包的每个任务的成本。所有工作包估值的总和即提供了项目总成本的估值。\n\
  \n在第 5 章中讨论进度计划时，我提到过计算每个任务的持续时间估算，以确定项目所需的时间。在计算成本估算时，你需要基于 `work effort`（工作量）进行估算，即一个人从开始任务到任务完成，在此期间不从事任何其他事情，完成该任务所需的总时间。例如，假设一项执行技术写作的任务活动持续时间估算为四天。当你进行成本规划时，需要知道执行该任务实际花费的小时数。因此，假设技术写人员在\
  \ 4 天内每天分配 5 小时给该项目。工作量估算为每天 5 小时乘以 4 天，等于 20 小时。\n\n自下而上估计所需的最后一项数据是每个资源的费率。劳动力和租赁设备的费率通常按小时或按天率计算，而材料或设备的购买通常会有固定价格。\n\
  \n决定用于成本估算的正确费率可能是困难的。对于材料或设备，同类物品的当前成本可能是你能获得的最准确的数值。许多项目最大的成本是人力资源或劳动力成本。某人执行工作的实际薪酬，即使在相同的职位下，也会根据教育程度和经验水平而波动。如果你正在采购合同资源，你会得到一份费率表，描述了特定职位的费率以及如果他们来自外地时的差旅费率。\n\
  \n表 7.1 显示了示例项目中每个资源分配的工作量和费率。\n\n| 任务 | 资源 | 工作量 | 费率 |\n| --- | --- | --- | ---\
  \ |\n| 4.1.1 | 技术写作人员 | 20 小时 | $30/小时 |\n| 4.1.2 | 程序员 | 100 小时 | $150/小时 |\n|\
  \ 4.1.3 | 服务器 | 固定费率 | $100,000 |\n| 4.1.4 | 测试员 | 60 小时 | $80/小时 |\n| 4.1.5 | 程序员\
  \ | 200 小时 | $150/小时 |\n| 4.1.6 | 市场 | 30 小时 | $60/小时 |\n\n表 7.1 示例项目资源费率\n\n现在你有了资源需求、工作量估算以及每个任务的费率，你可以通过向表格添加一\
  \ `Total Cost`（总成本）列来完成成本估算。每个任务的成本通过每个资源的工作量乘以该资源的费率来计算。这将为你提供项目总成本估算。表 7.2 显示了示例项目中任务的完成成本估算。\n\
  \n| 任务 | 资源 | 工作量 | 费率 | 总成本 |\n| --- | --- | --- | --- | --- |\n| 4.1.1 | 技术写作人员\
  \ | 20 小时 | $30/小时 | $600 |\n| 4.1.2 | 程序员 | 100 小时 | $150/小时 | $15,000 |\n| 4.1.3\
  \ | 服务器 | 固定费率 | $100,000 | $100,000 |\n| 4.1.4 | 测试员 | 60 小时 | $80/小时 | $4,800\
  \ |\n| 4.1.5 | 程序员 | 200 小时 | $150/小时 | $30,000 |\n| 4.1.6 | 市场 | 30 小时 | $60/小时\
  \ | $1,800 |\n| **总计** | | | | **$152,200** |\n\n表 7.2 示例项目成本估算\n\n### 三点估算法\n\n\
  `Three-point estimates`（三点估算）是最可能估值、乐观估值和悲观估值的平均值。你应该要求团队成员和/或要求熟悉此类采购或咨询工作的领域专家来给你提供估值。他们应该根据过去对类似工作的经验或根据其专业知识的最好猜测来得出这些估值。\n\
  \n最可能估值假设成本将符合预期。如果你用它来估算活动持续时间，那么该估值假设工作按照计划进行，不会有障碍，且团队成员确信有技能完成任务。\n\n乐观估值是一个比预期更好的估值。例如，你可能在内部估计你所要求的咨询工作费用为每小时\
  \ $225。乐观估值可能是每小时 $212，这比你预期的要好。如果你将此估值用于活动持续时间，它是你的资源完成该活动的最快时间范围。这可能假设资源正在进行的其他任务提前完成或不再需要。\n\
  \n悲观估值假设商品或服务的成本将比预期高。如果你将其用于活动持续时间，它假设工作所需的时间比预期的要长。\n\n计算三点估算非常简单。它是估值之和的平均值。例如，假设你的最可能估值是每小时\
  \ $120。乐观估值是每小时 $110，悲观估值是每小时 $150。三点估算的计算方式如下：\n\n```\n(120 + 110 + 150) / 3 =\
  \ 126.67\n```\n\n这项工作的三点估算为每小时 $126.67。根据提供的估值，该估值可能会之间产生很大波动。\n\n### 估算技巧\n\n成本估算可能是复杂的，而且在你获得足够的细节之前，成本估算往往就变成了项目的正式成本。在计算成本估算时，你可能永远无法获得想要的所有信息，但这就是项目管理的常态。在估算过程中，请记住以下几点：\n\
  \n-   **与你的项目团队进行脑风暴**：与你的团队和其他领域专家合作，确保你考虑了可能不那么明显的成本估算。例如，你的项目团队成员是否任何人需要特殊培训以执行他们在项目中的职责？团队成员或顾问是否涉及差旅费用？召集团队一起讨论其他可能的成本是捕捉这些项目的好方法。\n\
  -   **沟通你所提供的估算类型**：确保你的利益相关者意识到你正在使用的估算类型及其提供的准确性水平。如果你正在根据类似项目准备类比估算（analogous\
  \ estimate），请坦诚说明该估值可能偏离项目实际成本的可能性。\n-   **利用任何可用的模板**：许多公司都有成本估算模板或工作表，你可以利用它们让这项工作变得更容易。它们还将帮助你识别可能没有想到的隐藏成本，并可能列出组织签署的供应商协议中的费率。模板也是内部资源费率估算的良好来源。项目中人员的薪资将根据他们的职位和特定经验而异。你的组织可能要求你使用加载费率（loaded\
  \ rate），这通常是员工薪资的百分比，用于支付医疗、残疾或养老计划等福利。个人公司政策将决定是否在项目成本估算中使用加载费率。\n\n\n\n\n\n# 从执行工作的人那里获取估算。\n\
  \n自下而上的估算是最准确的，因为是对每个活动提供工作量估算，然后将其汇总为交付物或项目的整体估算。执行活动的人员应当是制定估算的人。如果你的项目包含了对你的团队来说是新的任务，或使用了未经测试的方法，你可能需要寻求外部协助进行工作量估算。你可以咨询已发布的行业标准或聘请顾问来协助估算过程。\n\
  \n# 记录你所做的所有假设。在进行成本估算时，务必记录你所做的任何假设。例如，你可能需要注明，你假设用于确定承包商成本的率表在项目工作开始后仍然有效。\n\n\
  成本估算将用于创建项目预算，你接下来将学习内容。\n\n## 创建项目预算\n\n当你完成成本估算后，就是时候准备预算了。`Budgeting` 是汇总所有成本估算并为项目建立成本基线的过程。`cost\
  \ baseline` 是项目的预计总成本。一旦获得批准，它将在整个项目的剩余时间内用于衡量整体成本绩效。\n\n项目预算用于跟踪与估算相比的实际产生费用。你将在本章稍后的“支出跟踪与报告”部分更详细地查看跟踪和报告费用。\n\
  \n在学习预算本身的运作机制之前，你应该确保已经理解了组织内部关于预算、权限级别、费用如何审批等流程。以下是一些你可以用来帮助进入起步阶段的问题：\n\n* \
  \  是否所有项目费用都提交给项目经理审批？\n*   项目经理在项目费用方面拥有何种支出权限或审批级别？\n*   项目经理是否批准项目团队成员的工时表？\n\
  *   是否存在某些成本类别或金额阈值需要项目赞助人或客户的批准？\n\n在花钱之前获得这些问题的答案，可以消除项目后期出现的问题和困惑。\n\n在费用产生时跟踪项目费用并不总是项目经理的责任。一旦提供了成本估算并建立了项目预算，实际的费用跟踪可能由会计或财务部门执行。某些组织使用其项目管理办公室（`PMO`）来监督项目预算、批准费用、跟踪所有项目预算等。请确保你知道谁负责预算的哪些行动。\n\
  \n无论实际由谁来跟踪预算支出，作为项目经理，你对资金如何使用以及是否在预算内完成项目工作负责。你需要定期监控预算报告，以便识别任何超支情况并采取纠正措施使预算回到正轨。\n\
  \n现在，让我们看看如何创建项目预算。\n\n### 创建项目预算\n\n项目预算通常按会计部门定义的特定成本类别进行分解。常见成本类别的示例包括薪资、硬件、软件、差旅、培训以及材料和用品。务必获取你组织的成本类别副本，以便理解每项资源应如何被跟踪和分类。\n\
  \n项目预算像项目本身一样多样。虽然不同项目之间的预算格式可能相似，但你使用的费用、预算金额和类别会随每个项目而变化。\n\n大多数通常以电子表格的形式创建，并根据项目的规模和长度分为每月、每季度或更多增量。如果你没有可用的模板来开始预算，请联系你的会计部门获取构建预算所需的科目表信息。科目表列出了你在预算中使用的每类费用的账号和描述。你可能记得，我们在书的前面也曾将科目代码用于\
  \ `WBS` 的工作包层级。\n\n要开始创建预算，列出薪资、合同支出、材料、差旅、培训等类别，并记录你为每项得得出的成本估算。增加一列“截至目前的的实际支出”。你将在项目的监控和控制阶段使用这些信息来确定项目的财务状况。`Table\
  \ 7.3` 显示了一个高层示例预算。\n\n| 账户代码 | 类别 | 估算成本 |\n| --- | --- | --- |\n| 1001 | 合同劳动力\
  \ | $50,000 |\n| 1003 | 材料 | $2,500 |\n| 1005 | 硬件 | $22,700 |\n| 1010 | 培训 | $7,000\
  \ |\n| **总预算** | | $82,200 |\n\n`TABLE 7.3` 项目预算示例\n\n你可能想在项目预算中包含另外两种类型的费用：应急备金和管理备金。务必向你的组织确认分配这些资金的政策以及使用这些资金所需的批准程序。\n\
  \n#### 应急备金\n\n`contingency reserve` 是一笔留出的资金，用于涵盖项目因可能的不的不事件或意外问题产生的成本。这些成本可能由于许多原因产生，包括范围蔓延、风险、变更请求、估算偏差、成本超支等。对于定义应投入应急基金的金额没有固定的规则，但大多数使用此类分配的组织通常将应急基金金额设定为项目总成本的百分比。\n\
  \n注意，利益相关者可能会误解应急备金的含义，将其视为项目增强或额外功能的资金来源。务必确保他们理解这笔资金的目的是涵盖可能的不利事件。除了极小项目外，项目执行期间似乎总是会出现未先计划的支出。应急基金的设计就是为了涵盖这类支出。\n\
  \n#### 管理备金\n\n`management reserve` 是由高层管理备留的一笔资金，用于涵盖无法预测的未来情况。与应急备金一样，管理备金的金额通常基于项目总成本的百分比。\n\
  \n管理备金与应急备金的区别在于支出权限以及它涵盖了不可预见的成本。应急基金通常由项目经理裁量，由项目经理控制这些资金的使用。管理基金通常由高层管理控制，项目经理在没有高层管理批准的情况下无法从该基金中支出资金。管理备金不包含在项目预算或成本基线中。\n\
  \n### 成本基线\n\n项目预算用于创建成本基线，成本基线是在项目执行期间以及监控和控制阶段用于监控项目支出的工具。\n\n\n\n\n\n一旦与项目团队完成了预算审查，就是时候获得项目赞助人的批准并创建成本基线了。成本基线是项目经批准的总预期成本。这应该在任何工作开始之前获得批准。所有未来的支出和差异都将根据此基线进行衡量。\n\
  \n成本基线将在项目的剩余时间内使用，用于跟踪项目实际成本与估计或计划成本之间的比较。它还用于根据迄今的支出预测未来成本，并计算剩余工作的预计成本。\n\n项目经理应该向项目利益相关者传达成本基线。某些利益相关者可能想要项目总预算的副本，而另一些可能只对项目特定阶段的预算感兴趣。你应该在沟通计划记录每个利益相关者对预算信息的需求。\n\
  \n### 支出跟踪与报告\n\n现在预算已建立且基线已批准，你需要跟踪项目支出并向你的利益相关者和赞助人报告预算状况。在项目更新会议期间将预算更新作为议程事项是常见的。\n\
  \n`Expenditure tracking` 包括衡量截至目前的项目支出、确定`burn rate`（或资金消耗速度），以及将支出与成本基线进行跟踪，以便利益相关者可以看到计划情况与项目实际支出的对比。`Expenditure\
  \ reporting` 是你用于报告项目预算当前状态的机制。\n\n项目管理软件在跟踪项目支出方面非常有用。你可以运行报告显示截至目前的支出与计划支出的对比，还可以使用软件通过“假设如果”场景来查看添加新任务或资源的影响。\n\
  \n你也可以使用方便手的电子表格程序进行支出跟踪和报告。表 7.4 是预算报告的示例，显示了估计成本（计划内容）与截至目前的实际成本以及差异（即两者之间的差值）。\n\
  \n| 账户代码 | 类别 | 估计成本 | 报告日的实际成本 | 差异 |\n| --- | --- | --- | --- | --- |\n| 1001\
  \ | 合同劳动力 | $50,000 | $48,500 | $1,500 |\n| 1003 | 材料 | $2,500 | $2,500 | $0 |\n\
  | 1005 | 硬件 | $22,700 | $24,500 | $(1,800) |\n| 1010 | 培训 | $7,000 | $5,000 | $2,000\
  \ |\n| **本期总差异** | | $82,200 | $80,500 | **$1,700** |\n\n**表 7.4** 项目预算报告示例\n\n\
  ## 挣值管理\n\n作为项目经理，你的职责之一是控制和监控项目成本。有几种技术可以实现这一点。`Earned value measurement (EVM)`\
  \ 是一种性能衡量技术，通过监控计划价值、挣值和为产生项目工作所支出的实际成本，将项目产出的内容与已支出的内容进行比较。当发现导致成本基线变更的差异时，应使用项目变更控制系统管理这些变更。如果需要更新预算和/或为项目增加资金，则你需要赞助人对新成本基线的批准和签字。\n\
  \nEVM 分析技术的主要功能是确定并记录差异产生、确定差异的影响，以及确定是否根据结果实施纠正措施。\n\nEVM 结合查看进度、成本和范围项目测量值，并将其与截至目前的实际完成工作进行比较。EVM\
  \ 通常在工作包或其他 WBS 组件上执行。要执行 EVM 计算，你首先需要收集这三个测量值：计划价值、实际成本和挣值。\n\n### 计划价值\n`planned\
  \ value (PV)` 是在给定时间段或阶段内，为特定的进度活动或 WBS 组件（如工作包）获得授权并预算的工作的成本。\n\n### 实际成本\n`Actual\
  \ cost (AC)` 是在给定时间段内完成工作组件的实际成本。实际成本可能包括直接和间接成本，但必须与该活动的预算相对应。例如，如果预算金额不包含间接成本，则不要在此处包含。\n\
  \n### 挣值\n`Earned value (EV)` 是截至目前完成工作的价值，与其该期间的预算金额 (PV) 进行比较。EV 通常以已完成工作占预算的百分比表示。例如，如果我们的预算金额为\
  \ $1,000，而你已经完成了 30% 的工作，那么你的 EV 为 $300。EV 不能超过项目总预算，但如果团队领先于进度（因为他们在测量期间完成了计划在未来期间完成的工作），则\
  \ EV 可能会超过工作组件或绩效期间的 PV。\n\n#### 成本差异\n`Cost variance (CV)` 告诉你的成本是高于预算（结果为负数）还是低于预算（结果为正数）。它衡量目前的实际性能与已支出的对比。\n\
  \nCV 的公式如下：\n\n```\nCV = EV – AC\n```\n\n假设截至 12 月 1 日（测量日），性能测量值如下：\n\n* PV = 75,000\n\
  * AC = 71,000\n* EV = 70,000\n\n现在用这些数字计算 CV：\n\n* 70,000 – 71,000 = –1,000\n\n\
  结果是一个负数，这意味着截至 12 月 1 日完成工作的成本高于计划。这些成本通常是无法收回的。如果结果是正数，则意味着你完成工作的支出少于计划的金额。\n\n\
  #### 进度差异\n`Schedule variance` 是另一种流行的 EVM 差异，它将活动目前的实际进度与预估进度进行比较，并以成本的形式表示。它告诉你进度是领先还是落后于本期间的计划。当你使用关键路径法构建项目进度表时，此公式最有帮助。进度差异\
  \ (SV) 的计算如下：\n\n```\nSV = EV – PV\n```\n\n输入数字：\n\n* 70,000 – 75,000 = –5,000\n\
  \n所得进度差异为负，意味着截至 12 月 1 日你落后于进度，或者落后于你计划的位置。\n\nCV 和 SV 合称为项目效率指标，可用于比较投资组合中所有项目的性能。\n\
  \n#### 绩效指数\n成本和进度性能指数主要用于计算性能效率，通常用于帮助预测未来的项目性能。\n\n`cost performance index (CPI)`\
  \ 衡量测量日已完成工作的价值与实际成本的比较。它是最重要的 EVM 测量指标之一，因为它告诉你是截至目前完成工作或项目结束时工作的成本效率。如果 CPI 大于\
  \ 1，说明你在测量日的支出低于预期。如果 CPI 小于 1，说明你在测量日对于已完成工作的支出高于预期。\n\nindex 成本性能指数 (CPI) 的计算方法如下：\n\
  \n```\nCPI = EV / AC\n```\n\n代入数字查看你的状况：\n\n* 70,000 / 71,000 = .99\n\n由于结果小于 1，意味着成本性能低于预期。\n\
  \n\n\n\n\n`进度计划指数 (SPI)` 衡量的是截至目前的实际进度与计划进度之间的对比。使用此公式应结合对关键路径活动的分析，以确定项目将提前还是落后于完成。如果\
  \ `SPI` 大于 1，说明你的表现优于预期，进度超前。如果 `SPI` 小于 1，则说明你在测量日期落后于计划。\n\n进度计划指数 (`SPI`) 的计算方法如下：\n\
  \n*   `SPI = EV / PV`\n\n再次，让我们通过这个例子看看你目前的情况：\n\n*   `70,000 / 75,000 = .93`\n\n\
  截至 12 月 1 日，进度表现未达到预期。\n\n### 资金消耗率 (Burn Rate)\n\n资金消耗率是你随时间花费资金的速度。例如，如果你有 12,000\
  \ 美元的预算，每月花费 2,000 美元，六个月就会用完资金。如果你运行的是为期五或六个月的项目，那是很棒的；但如果你运行的是为期十二个月的项目，就不太理想了。遗憾的是，支出很少在整个项目过程中均匀分布，因此计算资金消耗率并不像我刚才解释的那么简单。项目的资金消耗率通常使用成本绩效指数\
  \ (`CPI`) 计算法。\n\n另一种确定资金消耗率的方法是使用 `完工预测 (ETC)` 公式。这是对项目剩余工作成本的估算。它通常由实际负责项目活动的团队成员提供。参考前面的例子，项目预算为\
  \ 12,000 美元，截至目前已花费 8,000 美元，`ETC` 为 6,000 美元。你的支出速度已经超过了项目进展速度，除非进行纠正，否则你可能会耗尽资金。\n\
  \n### 支出报告\n\n支出报告有许多不同的形式。如之前的表 7.4 所示，一个显示计划成本与实际成本及其差异的简单电子表格对于大多数小型项目来说足够了。项目管理软件提供了许多跟踪和报告预算的选项。饼图、柱状图以及按工作组件分解预算是报告和显示项目支出的其他方法。你还可以使用更先进的挣值管理（EVM）测量来报告项目支出。\n\
  \n当项目成本随时间以图表形式显示时，它们会形成 S 曲线，如图 7.1 所示。这是因为在项目初期，支出是极的。一旦项目工作开始，支出就会增加，并在项目结束工作收尾时趋于减少。\n\
  \n![图：100-500 美元预算随时间（1 月至 9 月）变化的图形，y 轴 400-500 美元到 x 轴 9 月起呈 S 形曲线。](img/c07f001.jpg)\n\
  \n**图 7.1** S 曲线\n\n关于预算需要知道的重要点是，你有一个预算。花时间定义估算，根据估算创建总预算，然后跟踪实际支出与计划的对比，并向利益相关者报告此状态。一旦预算出现问题迹象，务必尽早通知你的赞助人。你可能采取行动让预算回到正轨，但不要假设这可以或将会发生。赞助人可能对负面的预算消息感到高兴，但你越早让他们意识到，他们就越能协助解决问题。支出超支往往在项目经理的控制之外，但在与赞助人交谈时，你需要文档和预算报告。\n\
  \n## 风险规划\n\n风险是我们日常生活中经常处理的事情。有些人会寻找被认为是高风险的工作或休闲活动。他们可能会从挑战跳伞、登山的挑战，或者从在高压电线上担任线路工的工作中获得快感或巨大的成就感。\n\
  \n`风险`是一个潜在的未来事件，可能对项目产生负面或正面影响。然而，如果你在提到项目时“风险”一词，大多数人会立即想到负面因素。根据我的经验，绝大多数风险事件发生时都有负面后果。但风险并不总是负面的。风险的发生也有产生正面结果的可能性。\n\
  \n`风险规划`涉及你如何管理项目中的不确定领域。风险规划有三个主要组成部分：识别项目的潜在风险、分析每个风险的潜在影响，以及针对那些概率和影响最大的风险制定适当的应对措施。让我们接下来来看每一个内容。\n\
  \n### 风险识别\n\n所有项目都有风险。`风险识别`是确定并记录项目可能发生的潜在风险的过程。\n\n你可以从项目整体角度查看风险，也可以通过分析项目的单个组件（如资源、进度、成本、任务等）来查看风险。风险可以包括此类项目：投入项目的资金水平、核心项目团队的整体经验水平、项目管理实践的使用，或项目的战略意义。风险也可能与项目的特定阶段或某些关键任务相关。\n\
  \n你应该将利益相关者、核心团队成员以及任何可能对该项目有经验或知识的领域专家纳入你的风险识别和分析过程中。你可以使用几种技术来帮助定义初始风险列表，包括头脑风暴、访谈和引导式工作坊。\n\
  \n开始头脑风暴会议的一种方法是回顾常见潜在风险列表：\n\n*   预算或资金\n*   进度\n*   范围\n*   需求变更\n*   合同\n*  \
  \ 硬件\n*   政治考虑\n*   管理风险\n*   法律风险\n*   技术问题\n\n此外，你还可以设计一组问题向小组提出。示例问题包括：\n\n*\
  \   该任务在关键路径上吗？\n*   这是一个复杂任务吗？\n*   任务是否涉及新的或不熟悉的技术？\n*   任务是否具有多个依赖关系？\n*   在之前的项目中，你们在类似任务中遇到过问题吗？\n\
  *   该任务是否受外部影响（许可证、合规性、环境因素等）控制？\n*   是否分配了缺乏经验的资源负责此任务？\n*   分配给该任务的资源是否充足？\n*\
  \   你是否熟悉将要用于任务的硬件或软件？\n\n你可以通过两种方式进行头脑风暴会议。你可以给每个人发一支记号笔和一叠贴纸，让他们在审查风险类型和问题时，每张贴纸写一个风险。你可以将风险贴在白板上并开始分类。你也可以邀请某人参加会议并做记录。无论你使用哪种方法识别风险，在会议结束时你都应该有一份完整的`风险登记`。\n\
  \n这本质上是一份记录在简单电子表格中的风险列表，包括识别编号、风险名称、风险描述、风险所有者和响应计划（或响应计划所在位置）。风险所有者是负责监控项目以确定该潜在风险事件发生的概率是否高，并在发生时实施`风险响应计划`的人员。\n\
  \n一旦你识别了项目所有可能的风险，你就需要分析风险，以确定风险事件发生的可能性以及如果发生它对项目将产生的影响。\n\n### 优势、劣势、机会和威胁 (SWOT)\n\
  \n\n\n\n\n另一种你可以用来识别风险的技巧被称为`SWOT 分析`。这涉及到从以下每个维度对项目进行分析：优势、劣势、机会和威胁。它还需要检查其他要素，例如项目管理流程、资源、组织等。\n\
  \n优势和劣势通常与组织内部的问题有关。优势研究了你的组织做得好的地方，以及你的客户或利益相关者认为你拥有的优势。劣势是组织可以改进的领域。通常情况下，负面风险与组织的劣势相关，而正向风险与其优势相关。\n\
  \n机会和威胁通常是组织外部的。例如，天气、你可能执行项目部分的其他国家的政治气候、金融市场等，都是项目的外部因素，既可能构成机会，也可能构成威胁。`SWOT\
  \ 分析`可以与头脑风暴技术结合使用，帮助发现并记录潜在风险。\n\n## 风险分析\n\n`风险分析`是识别那些发生可能性最大且一旦发生对项目影响最大的风险的过程。在开始分析过程之前，了解你的利益相关者的风险承受水平至关重要。这可能部分取决于你所处的行业类型、企业文化、部门文化或利益相关者的个人偏好。例如，研发行业往往具有较高的风险承受能力，而银行业则倾向于极低的风险承受能力。在为风险事件分配概率和影响之前，确保你理解利益相关者的风险承受能力。\n\
  \n你希望以一种易于理解的方式对风险进行优先级排序和量化，并一眼看出那些一旦发生就需要制定风险响应计划的风险。做到这一点最简单的方法之一是创建一个`概率和影响矩阵`。现在风险列表已经完成，下一步是识别风险发生的概率及其影响。\n\
  \n### 风险概率\n\n`概率`是风险事件发生的可能性。例如，如果你抛掷硬硬币，硬币出现正面的概率为 0.50。概率用 `0.0` 到 `1.0` 之间的一个数字表示，其中\
  \ `1.0` 表示风险事件发生的绝对确定。\n\n确定概率最快的方法是使用专家判断。这通常来自了解项目的项目团队成员、利益相关者或具有类似项目经验的领域专家。要求他们对列表上的每个风险的发生概率进行评分。你也可以回顾与当前项目类似的过去项目的历史数据，以评估风险发生的概率。\n\
  \n### 风险影响\n\n`影响`是风险发生时对项目造成的后果（或机会）。某些风险的影响非常低，即使发生也不会影响项目的整体成功，而另一些风险可能会导致项目完工延迟或预算大幅超支。再次，依靠团队成员的专家知识和判断以及历史数据来评估每种风险的严重性。你可以使用如下简单评分来评估风险影响：\n\
  \n* 高\n* 中\n* 低\n\n接下来，你把高、中、低分转换为 `0.0` 到 `1.0` 之间的一个数字，其中 `1.0` 分对项目的影响最大，这样你就可以将分数代入概率和影响矩阵。例如，高影响的分可能是\
  \ `1.0` 分，中影响可能是 `0.5` 分，低影响可能是 `0.1` 分。\n\n接下来，你将构建一个概率和影响矩阵，为列表中的每个风险计算一个最终风险得分。最终得分由概率乘以影响得出。见表\
  \ 7.5 显示了一个基本的概率和影响矩阵。\n\n| 风险 | 概率 | 影响 | 风险得分 |\n| --- | --- | --- | --- |\n|\
  \ 风险 A | 0.9 | 1.0 | 0.9 |\n| 风险 B | 0.3 | 0.5 | 0.15 |\n| 风险 C | 0.8 | 0.1 | 0.08\
  \ |\n| 风险 D | 0.5 | 0.5 | 0.25 |\n\n**表 7.5** 概率和影响矩阵\n\n风险得分越接近 `1.0`，风险发生的可能性越大，对项目的影响越显著。在表\
  \ 7.5 中，风险 A 的发生概率高且具有重大影响。风险 C 的发生概率高，但一旦发生影响较低。\n\n风险过程的最后一步是为得分最高的风险制定适当的行动方案。\n\
  \n## 风险响应\n\n风险毕竟是不不确定性。你预先对风险及其影响了解得越多，当风险事件发生时处理的能力就越充分。涉及风险的过程涉及平衡。你希望找到一个基于你可能获得的收益，使你和利益相关者对风险感到舒服的平衡。简而言之，你正在平衡承担风险的行为与规避风险事件的后果或影响，或享受其可能带来的收益之间的关系。\n\
  \n`风险响应计划`是审查风险分析并确定应采取哪些行动，以减少风险事件发生带来的负面影响并利用机会的过程。你的你的组织可能有一套预设的公式来识别需要响应计划的风险。例如，他们可能要求所有总风险得分大于\
  \ `0.6` 的风险都必须有响应计划。\n\n在确定负面风险和机会以及制定响应计划时，你将使用几种策略。处理负面风险的策略包括：\n\n* `回避`：完全规避风险或消除风险事件的原因\n\
  * `转移`：通过购买保险、履约保证金等将风险责任转移给第三方\n* `减轻`：降低风险的影响或概率\n* `接受`：选择接受风险的后果\n\n与正向风险或机会相关的策略包括：\n\
  \n* `利用`：寻找机会以利用正向影响\n* `共享`：将风险分配给最能带来机会的第三方\n* `增强`：监控风险事件的概率或影响，以确保收益实现\n* `接受`：选择接受风险的后果\n\
  \n在执行风险分析、分配所有者并确定是否需要响应计划时，你应该将这些信息记录在`风险登记簿`中。表 7.6 显示了一个风险登记簿示例。\n\n| 风险编号 |\
  \ 风险描述 | 概率 | 影响 | 风险得分 | 响应计划 | 风险所有者 | 响应计划 |\n| --- | --- | --- | --- | --- |\
  \ --- | --- | --- |\n| 1 | 天气 | 1.0 | 1.0 | 1.0 | 是 | Peterson | H |\n| 2 | 供应商延迟\
  \ | 0.3 | 0.5 | 0.15 | 否 | Hernandez | H |\n| 3 | 预算超支 | 0.8 | 0.1 | 0.08 | 是 |\
  \ Whatley | H |\n| 4 | 技术问题 | 0.5 | 0.5 | 0.25 | 否 | White | IT |\n\n**表 7.6** 风险登记簿\n\
  \n风险所有者负责监控分配给他们的风险并关注风险触发器。`风险触发器`是指示风险事件即将发生的信号或先兆。如果风险需要响应计划，所有者应该在触发器出现后准备好执行该响应计划。\n\
  \n### 风险监控\n\n你需要在项目的执行阶段和监控与控制阶段持续监控风险。\n\n\n\n\n使用风险登记簿向利益相关者传递项目风险和行动计划。在项目状态会议中包含风险更新，并定期召开风险审查会议，检查风险登记簿中的每项风险，确定它们是否已经发生或可能发生。风险通常随着时间的推移而减少，因此风险排名也应发生变化，以反映项目的当前状态。随着项目的进行，可能会发现新的风险，因此务必将风险审查成为项目管理流程的标准组成部分。\n\
  \n如果你正在从事一个大型项目或周期较长的项目，定期重新评估风险是良好的做法。这涉及重新开始风险识别过程，进行概率和影响分析，并为新识别的风险编写响应计划，同时更新现有风险的响应措施。\n\
  \n### 总结\n\n成本估算在进度制定和项目资源确定后进行。你可以使用多种技术来创建项目估算。类比估计或自上而下估算利用专家判断和历史数据为整个项目、项目阶段或交付物提供高层级估算。参数估算使用数学模型来创建估算，在最简单的形式下，通过项目任务的持续乘以资源率来确定估算。自下而上方法通过累加每个工作包的单独估算来创建项目估算。三点估算是最可能值、乐观和悲观估值的平均值。\n\
  \n成本估算被用于编制项目预算。项目预算通过使用组织的会计科目表建立，然后记录工作量、持续时间、设备和材料成本以及项目实施过程中可能产生的任何成本。成本基线是项目获批准的预期总成本，用于在整个项目期间进行预测和跟踪支出。\n\
  \n风险计划涉及识别项目期间可能发生的潜在风险事件，确定其发生概率，并确定其对项目的影响。概率始终表示为 0.0 到 1.0 之间的数字。对于那些发生概率高、发生后会对项目产生重大影响或整体风险得分高的风险，应该制定风险响应计划。\n\
  \n在项目的剩余时间内，与利益相关者沟通风险和响应计划至关重要。如果你的项目周期较长，请定期重新执行风险过程，以确定你的风险仍然有效并识别新风险。\n\n##\
  \ 考试要点\n\n- **了解类比估计、参数估算和自下而上估算技术的区别。** 类比估计（或自上而下估计）利用专家判断和历史数据为整个项目、项目阶段或交付物提供高层级估算。参数估算使用数学模型来创建估算。自下而上方法从\
  \ `WBS` 的最低级开始，计算工作包内每项的成本，以获得项目或交付物的总成本。\n- **列出项目可能收到的两种裁量资金分配。** 两种类型的裁量资金是应急备金和管理储备。应急备金是留出用于可能发生的不利事件成本的资金。管理储备由高层预留，用于涵盖项目计划期间无法预测的未来情况。\n\
  - **解释成本基线的目的。** 成本基线是项目获批准的预期总成本。它在执行过程以及监控控制过程中，用于监控整个项目期间项目预算的执行情况。\n- **解释风险识别过程。**\
  \ 风险识别是识别和记录项目上可能发生的潜在风险事件的过程。\n- **解释风险分析的目的。** 风险分析评估风险影响的严重程度以及风险实际发生的概率。\n-\
  \ **解释风险响应计划的目的。** 风险响应计划是审查影响项目的潜在风险列表，以确定应该采取哪些行动（如果有的话），然后将其记录在响应计划中。\n- **列出负面风险响应策略。**\
  \ 负面风险响应策略是规避、转移、减轻和接受。\n- **列出正面风险响应策略。** 正面风险响应策略是利用、分享、增强和接受。\n\n## 关键术语\n\n\
  在参加考试之前，请确保你熟悉以下术语：\n\n- 接受 (accept)\n- 实际成本 (AC)\n- 规避 (avoid)\n- 自下而上估计 (bottom-up\
  \ estimate)\n- 预算 (budgeting)\n- 消耗率 (burn rate)\n- 应急备金 (contingency reserve)\n\
  - 成本基线 (cost baseline)\n- 成本绩效指数 (CPI)\n- 成本偏差 (cost variance)\n- 挣值 (EV)\n- 挣值管理\
  \ (EVM)\n- 增强 (enhance)\n- 完完成 (ETC)\n- 支出报告 (expenditure reporting)\n- 支出跟踪 (expenditure\
  \ tracking)\n- 利用 (exploit)\n- 影响 (impact)\n- 管理储备 (management reserve)\n- 减轻 (mitigate)\n\
  - 数量级估计 (order-of-magnitude estimate)\n- 计划价值 (PV)\n- 概率 (probability)\n- 概率影响矩阵\
  \ (probability and impact matrix)\n- 风险 (risk)\n- 风险分析 (risk analysis)\n- 风险识别 (risk\
  \ identification)\n- 风险计划 (risk planning)\n- 风险登记簿 (risk register)\n- 风险响应计划 (risk\
  \ response plan)\n- 风险响应计划 (risk response planning)\n- 风险触发因素 (risk triggers)\n\
  - 进度绩效指数 (SPI)\n- 进度偏差 (schedule variance)\n- 分享 (share)\n- SWOT 分析\n- 三点估算 (three-point\
  \ estimates)\n- 自上而下估计 (top-down estimating)\n- 转移 (transfer)\n- 工作量 (work effort)\n\
  \n## 复习题\n\n1. 你被要求为一个涉及在停车场种植新树的项目准备估算。每棵树的价格为 800 美元，安装人工费每小时 75 美元。你要种植 10 棵新树，每棵树需要一小时的人工来种植、加固和浇水。该项目的预计人工成本是多少？你使用的是哪种技术来确定此估算？选择两个。\n\
  \n    1. $8,000\n    2. 三点估算\n    3. 自下而上方法\n    4. $750\n    5. 类比方法\n    6. 参数方法\n\
  \    7. $8,750\n\n2. 自上而下估计是哪种估算技术的另一种说法？\n\n    1. 参数估计\n    2. 类比估计\n    3. 三点估算\n\
  \    4. 专家判断\n\n3. 一个人从头到尾完成一项任务的总时间，不考虑假期、休息或其他项目工作被称为：\n\n    1. 持续时间估算\n    2.\
  \ 工作量估算\n    3. 自下而上估计\n    4. 参数估算\n\n4. 项目经理用于涵盖项目期间可能发生的不利事件成本的裁量资金被称为以下哪项？\n\
  \n    1. 管理储备\n    2. 会计科目表\n    3. 应急资金\n    4. 成本基线\n\n5. 你正在确定成本基线。以下所有项中哪一项用于成本基线？\n\
  \n    1. 管理储备\n    2. 会计科目表\n    3. 人力成本估算\n    4. 材料和设备估算\n\n6. 你正在为项目的第一个阶段开发自下而上的估算。完成此任务的以下哪项是最重要的输入？\n\
  \n    1. 来自类似项目的历史数据\n    2. 会计科目表\n    3. `WBS`\n    4. 范围说明\n\n7. 什么被认为是最准确的估算？\n\
  \n    1. 类比估计\n    2. 自下而上估计\n    3. 基于专家判断的估算\n    4. 参数估算\n\n\n\n\n**8. 你被要求演示并解释项目成本基准。以下所有项中哪一项不是？**\n\
  1. 基准将用于跟踪实际支出与成本估计的对比。\n2. 基准可用于预测未来的项目成本。\n3. 基准由项目经理计算并批准。\n4. 基准是项目的总预期成本。\n\
  \n9. 你的项目任务非常复杂，你决定使用三点估算法。以下哪些选项决定了三点估值？选择三项。\n1. 数量估算\n2. 工作包级估算\n3. 材料估算\n4.\
  \ 悲观估算\n5. 资源估算\n6. 费率估算\n7. 乐观估算\n8. 可能估算\n\n10. 消耗率通常是如何计算的？\n1. `CV`\n2. 确定随时间的支出率\n\
  3. `CPI`\n4. `AC—PV`\n\n11. 工作量乘以以下哪一项将得出每个任务的总估算？\n1. 工期\n2. 费率\n3. 资源数量\n4. 小时数\n\
  \n12. 你的项目存在未来风险事件的可能性。赞助人告诉你，组织无法承受该风险的后果。你建议购买保险，以便如果发生风险事件，组织可以收回因风险影响产生的支出。这种风险策略被称为？\n\
  1. 规避\n2. 缓解\n3. 接受\n4. 转移\n\n13. 这种技术可以帮助识别风险。\n1. `SWOT`\n2. `CPI`\n3. `EVM`\n\
  4. `CV`\n\n14. 风险注册表通常包含几项信息。你预计会在风险注册表中看到哪些内容？选择三项。\n1. 风险所有者\n2. 风险描述\n3. 风险评分\n\
  4. 应对计划的成本估算\n5. 跟踪风险的资源成本\n6. 风险后果的成本估算\n\n15. 你在项目中识别出了一个风险，团队决定不创建应对计划；如果风险发生，他们将在后果发生时再处理。这是哪种风险策略的示例？\n\
  1. 承认\n2. 规避\n3. 缓解\n4. 接受\n\n16. 计划支出与实际支出之间的差异被称为以下哪项？\n1. 计划价值\n2. 方差\n3. 支出报告\n\
  4. 消耗率\n\n17. 云层在地平线上线上翻滚，风越来越大。你的户外活动即将被雨淋湿。这是什么的示例？\n1. 风险触发因素\n2. 风险分析\n3. 风险概率\n\
  4. 风险响应\n\n18. 以下所有都是处理负面风险的策略，但哪一项不是？\n1. 接受\n2. 转移\n3. 分享\n4. 缓解\n\n19. 项目成本随时间的图表显示代表以下哪些内容？\n\
  1. S 曲线\n2. C 曲线\n3. 均匀分布的支出\n4. 不规律的支出\n\n20. 你正在确定风险注册表中每个风险的风险评分。你需要以下哪些项来确定该评分？选择两项。\n\
  1. 应对计划\n2. 风险所有者\n3. 风险发生的概率\n4. 应急备金\n5. 风险触发因素评分\n6. **风险发生时的影响**\n\n# 第 8 章\n\
  \n## 沟通计划\n\n### 本章涵盖的 CompTIA PROJECT+ 考试主题包括\n\n* **3.1 给定场景，使用适当的沟通方法。**\n  \
  \  * 会议\n        * 启动会议\n        * 虚拟 vs. 线下会议\n        * 计划内 vs. 临时会议\n       \
  \ * 结束会议\n    * 电子邮件\n    * 传真\n    * 即时消息\n    * 视频会议\n    * 语音会议\n    * 面对面\n\
  \    * 短信\n    * 打印介质的分发\n    * 社交媒体\n* **3.2 比较并对比影响沟通方法的因素。**\n    * 语言障碍\n  \
  \  * 时区/地理因素\n    * 技术因素\n    * 文化差异\n    * 组织间差异\n    * 组织内部差异\n    * 个人偏好\n  \
  \  * 建立关系/维护关系\n    * 根据信息内容定制化方法\n    * 关键性因素\n    * 特定的利益相关者沟通需求\n        * 频率\n\
  \        * 报告详细程度\n        * 沟通类型\n        * 保密性限制\n        * 调整沟通风格\n* **3.3 解释常见的沟通触发因素并确定目标受众和理由。**\n\
  \    * 审计\n    * 项目规划\n    * 项目变更\n    * 风险注册表更新\n    * 里碑\n    * 进度变更\n    * 任务启动/完成\n\
  \    * 利益相关者变更\n    * 阶段性评审\n    * 业务连续性响应\n    * 事件响应\n    * 资源变更\n\n沟通是项目成功的关键因素之一。在本章中，你将学习沟通方法、影响沟通的因素以及引发沟通的触发因素。我还将讨论如何管理利益相关者的预期以及利益相关者具有哪些类型的沟通需求。最后，本章将以获取项目管理计划批准和签署的主题作为结束。\n\
  \n那么，让我们从任何项目最重要的方面开始吧：沟通。\n\n### 沟通规划\n\n良好的沟通是项目成功的关键。诚然，你需要一个包含范围说明、进度和预算在内的稳健计划。但如果你无法沟通计划，或者不能让利益相关者的预期与项目目标保持一致，尽管你有一个完美的计划，最终也可能导致项目失败。\n\
  \n良好的沟通远不仅仅是设置分发列表和在茶水间与利益相关者聊天。你需要一个计划来确定在何时向谁传递什么信息。沟通规划是识别哪些个人或群体需要接收有关项目的信息、每个群体需要什么信息以及信息如何分发的过程。沟通系统应该监控项目状态，并满足项目利益相关者的多样化沟通需求。\n\
  \n对良好沟通的需求从项目章程发布以及你被正式任命项目经理的那天开始（如果你一直在非正式地担任项目经理的角色，可能更早）。正如你已经看到的，项目章程是许多需要与利益相关者评审的项目产物中的第一个。范围说明、项目进度、预算和最终项目计划都是应该由利益相关者讨论、评审并批准的文档。但沟通不能在评审和批准后停止。他们会想知道进度和预算的状况，告知他们可能影响项目的潜在风险事件、变更和问题是你的工作。为了做到这一点，你需要一个计划。\n\
  \n你将从回顾信息交换的一些般原则开始。\n\n### 交换信息\n\n沟通行为是你日常生活的一部分。作为项目经理，你工作的每个方面都涉及与他人沟通。沟通是交换信息的过程，涉及以下三个要素：\n\
  \n\n\n\n\n## 发送者\n`sender`（发送者）负责以清晰简洁的方式整合信息并将其传给接收者。信息应该是完整的，并且呈现方式要让接收者能够正确理解。请确保你的信息与接收者相关。垃圾邮件是令人讨厌的，而与接收者无关的信息无非如此。\n\
  \n## 信息\n`message`（信息）是正在发送和接收的内容。信息可以采取多种形式，包括书面、口头、非语言、正式、非正式、内部、外部、水平和垂直。水平沟通是同级人员之间发送和接收的消息。垂直沟通是下属与执行管理层之间发送和接收的消息。\n\
  \n信息应该与接收者适当且相关。不需要或与目标受众的信息被视为噪声，并可能在阅读或听到之前就被丢弃。\n\n## 接收者\n`receiver`（接收者）是信息的预期对象。他们负责正确理解信息并确保接收了所有信息。\n\
  \n发送者在发送消息时应考虑这些过滤器，以便接收者能够清晰地理解发送的消息。\n\n发送者-信息-接收者模型（也称为 `basic communication\
  \ model`，基本通信模型）是所有通信交换发生的方式，无论它采取什么格式。发送者对信息进行编码（通常以书面或口头形式），并通过信息传输给接收者。\n\n传输（Transmitting）是信息从发送者到达接收者的途径。口语、书面文档、备忘录、电子邮件和语音邮件都是传输方法。\n\
  \n解码（Decoding）是接收者获取信息后进行的操作。他们将其转换为易于理解的格式。通常，这意味着他们阅读备忘录、听演讲者说话、阅读书籍等。接收者通过阅读、听演讲者说话等来解码信息。发送者和接收者在这个过程中都承担责任。发送者必须确保信息是清晰、易懂，并且是接收者可以使用的格式。接收者必须确保他们理解了所传达的内容，并在需要时要求澄清。\n\
  \n项目沟通始终涉及多个人。通信网络模型是解释参与沟通的人数与参与者之间实际互动次数之间关系的一种。例如，如果你在会议上有五个人在交换想法，那么所有参与者之间实际上有十条通信线路。图\
  \ 8.1 显示了一个显示成员之间 `lines of communication`（通信线路）的网络模型。\n\n![网络通信模型图显示了包含 1, 2, 3,\
  \ 4 和 5 的六角形之间的箭头连接。](img/c08f001.jpg)\n\n图 8.1 网络通信模型\n\n节点是参与者，线条显示了他们之间的连接。计算通信线路的公式如下：\n\
  \n* (参与人数 × (参与人数 – 1)) ÷ 2\n\n以下是数学术语的计算方式：\n\n* n(n – 1) ÷ 2\n\n图 8.1 显示了五位参与者，让我们代入公式来确定通信线路：\n\
  \n* 5(5 – 1) ÷ 2 = 10\n\n### 倾听\n在发送者-信息-接收者模型中，我们作为接收者都需要具备的一项关键沟通技能，那就是倾听的艺术。倾听并不是在别人说话时你计划自己要说什么的部分。它是你积极与发送者互动并提出澄清性问题以确保你正确理解了信息的部分。\n\
  \n你可以使用几种技巧来提高你的倾听技巧。许多书都致力于这个主题，因此我将在这里强调一些最常见的技巧：\n\n*   表现出对演讲者所说的话感兴趣。这会让演讲者感到放松，对你也有好处。通过表现出兴趣，你真的变得产生了兴趣，从而保留更多所呈现的信息。\n\
  *   与演讲者保持眼神交流是另一种有效的倾听工具。这让演讲者知道你正在关注他们所说的话并感兴趣。\n*   通过提前告诉演讲者你对他们将要讨论的话题感兴趣，并期待听到见解，让他们感到放松。在他们说话时，在适宜的情况下点头、微笑或发表评论，以让演讲者知道你理解了该信息。如果你不理解某些内容且环境恰当，请提出澄清性问题。\n\
  *   另一个在很多情况下都非常好用的妙招是用你自己的话总结演讲者所说的话并转述给他们听。可以这样开头：“让我确保我正确理解了你的意思，你的意思是……”，并请演讲者确认你是否真的理解了。\n\
  *   在别人说话时打断他们是不礼貌的。打断是告诉演讲者你并没有在认真听，而且比起听他们说话，你更感兴趣告诉他们你想说的话。打断会让对方偏离思路，他们可能会忘记自己的观点，甚至可能让他们生气。然而，在某些时间地点偶尔的打断是必要的。例如，如果你在一个项目状态会议上，有人想让会议偏离轨道，有时让会议回到正轨的办法就是打断他们。你可以礼貌地这样做。先说那个人的名字引起他们的注意。然后告诉他们，你乐意在会议之外与他们讨论他们的话题，如果那是大家需要的内容，就将其加入下次状态会议的议程。\n\
  \n## 沟通方法\n古代，有几种沟通方式。主要方法是口头的。你和邻居以及镇上的其他人聊天获取最新消息。你还会确保与那些从其他镇来的人交流，这样你就能听到世界其他地区的新闻。\n\
  \n书面形式的沟通直到 1450 年左右印刷机的发明后才流行。在此之前，抄写员将信息手写在草纸上，而在那时，图像被刻并画在洞穴壁上。对于那些进入洞穴的人来说这是一种有效的沟通形式。但如果你无法到达洞穴，就依靠口头沟通。\n\
  \n今天的技术带给了我们几十种沟通方法。在先深入探讨书面和口头沟通的优势之后，我会触及其中几种。\n\n### 沟通形式\n主要的沟通交换形式包括口头和书面格式。口头沟通比书面更简单、不复杂，而且通常更快。口头沟通的风险是可能会发生误解，除了每个人的记忆外，没有说过的内容的记录。书面沟通适用于详细指令或人们可能需要查看的复杂信息。书面沟通的风险是利益相关者会被电子邮件、备忘录、文档和其他信息淹没，因此你的项目信息可能会丢失在信息过载的海中。\n\
  \n\n\n\n\n决定你的信息应该是口头的还是书面的是一项重要的决策。绝大多数正式的项目信息，如项目章程、范围说明、预算和项目计划，都应该以书面形式呈现。你很可能会通过会议来讨论这些文档的内容，这意味着也会使用口头形式。在说话或写字之前，先思考你要传达的内容以及如何进行沟通，是一种良好的做法。如果你的信息敏感或具有争议，那么在说话或写字之前规划沟通计划尤为关键。如果从一开始就发送正确的信息，事情进展将会顺利得多，而不是在之后进行道歉或撤回。\n\
  \n## 沟通方法\n\n正如我之前所说，今天有几十种沟通方式。让我们重点介绍一下 CompTIA Project+ 考试中涵盖的各出的每种方法。\n\n###\
  \ 会议\n会议在项目期间非常普遍。你需要参加会议来确定需求、批准计划、讨论风险、报告项目状态等。会议可以同时使用口头和书面形式的沟通。例如，你可以与会议参会者分享项目章程，或者提供打印好的预算或进度表副本供审阅，或者你可以在提供书面状态更新的同时，在会议上讨论这些更新。\n\
  \n为你的会议准备议程是一个良好的做法，议程应突出显示将涵盖的主题、谁将汇报以及该主题的时间范围。考试中可能会出现几种会议类型。让我们简要查看每种。\n\n###\
  \ 启动会议\n我们在第 6 章中讨论过项目启动会议。这些会议旨在讨论项目目标、介绍团队成员和利益相关者、介绍项目经理，并对满足项目时间表和预算设定预期。你可能还会在此会议上讨论团队成员的角色和职责。\n\
  \n### 虚拟会议与面对面会议\n面对面会议是面对面进行的。所有会议参会者在会议室或办公室见面，讨论会议的议程事项。\n\n`Virtual meetings`发生在人们没有亲临现场的情况下。这可以通过视频会议或语音会议来实现。视频会议允许参会者看到并听到彼此，取决于你正在使用的软件，你可能还可以共享电脑屏幕，以便他人看到演示文、幻灯片、电子表格或你展示的任何报告。语音会议使用电话进行。它的效果没有视频会议那么，但如果团队成员无法同时处于同一个房间，它的效果就很良好。\n\
  \n### 计划性会议与临时会议\n计划性会议会在会议前提前列在日历上。通常，邀请通过电子邮件发送，并附上议程以及会议的日期、时间和地点。临时会议通常发生在当下，没有提前计划。这在我的项目中经常发生。我会随口问一个团队成员一个问题，结果这个问题演变成邀请另外一两个人加入讨论，等你回过来，我们就在召开临时会议了。有时，这些会议可以是灵感的金矿和头脑风暴的机会。你不会希望所有的会议都是临时的，但在那些自然发生的罕情况下，如果你发现了问题的答案并解决了一些以前困扰你和团队的问题，请不要感到惊讶。\n\
  \n### 结束会议\n结束会议发生在项目结束或项目阶段结束时。这些会议非常重要，因为这是对项目交付进行最终验收的地方。你将获得项目助人的签字，确认项目已完成并符合预期。\n\
  \n### 电子邮件\n电子邮件是一种书面沟通形式。在向许多人快速传达简洁、易懂的信息时非常有用。使用电子邮件时要小心，因为接收者很容易误解你的语气或意图。电子邮件非常会议邀请、共享会议议程和纪要以及提供快速更新。如果你有复杂信息要传达，最好将其放入书面报告中，并面对面或通过视频会议展示该报告。在会议之前发送报告是个好主意，这样每个人都有机会审阅。但对内容的讨论应该在会议上进行，而不是在电子邮件中。最后一个提示：在点击`reply\
  \ all`选项之前，请再次问自己是否每个人都需要知道你的回复。大多数情况下只有发送者需要回复，而不是列表上的所有人。\n\n### 传真\n电子发送文档的能力始于传真机。这些曾经是独立的机器，扫描你文档的每一页并通过电话线发送。今天，你可以通过互联网或电话线发送传真。在大多数情况下，签署后传真给银行、政府机构或供应商的文档原件被认为是具有法律约束力的文件。合同修正和变更单是你可能发送给供应商的文件类型示例。由于你有发送多页文档的能力，因此传真对于简单信息或复杂信息都是适当的。\n\
  \n### 即时消息\n即时消息允许你通过互联网上的短信与他人进行通信。有许多软件程序提供这种功能。只要你使用的软件程序具有该功能，你可以在计算机、平板电脑或手机上使用即时消息。它是传达快速简短信息的绝佳机制。即时消息不适用于会议、复杂信息或同时与与多人通信。\n\
  \n### 视频会议与语音会议\n我们在会议部分简单讨论过视频和语音会议。视频会议是一种即时通信技术，利用互联网和电信技术视觉化显示报告、演示和/或人们的面部。它还提供了音频功能，让你既能看到也能听到会议中的其他人。视频会议是多方通信，两个或多人参与会议。视频会议的参会者可以住在世界上任何地方，并使用他们的网络连接和软件连接会议。某些视频会议需要使用电话进行会议的音频部分，并使用软件程序查看演示者的桌面。如果你打算视觉看到参会者，视频会议需要摄像头。\n\
  \n语音会议也使用电信技术，并允许两个或多人参与会议。如果会议中人很多，语音会议有时会很尴尬，因为很容易无意中打断别人或在别人说话时说话。像视频会议一样，只要参会者可以使用电话线路，语音会议允许他们从世界上任何地方加入会议。\n\
  \n### 面对面会议\n我在本节前面也稍微讨论了面对面会议。面对面会议是两个或多个参会者物理上出现在同一个房间内。在交付复杂材料，或者当你必须讨论负面结果，或面对团队成员讨论不当行为或结果时，这类会议是最好的。\n\
  \n### 短信\n短信与即时消息类似，但短信通常使用手机进行。再次强调，这种方法应用于快速、简短、易于传达的信息，并且通常用于与一个人通信，而不是与群体。短信不适用于传递复杂信息。\n\
  \n\n\n\n## 打印媒体的分发\n\n有时你可能需要提供纸质材料作为一种沟通形式。我通常喜欢打印项目章程、项目范围说明书、项目进度、预算、会议议程、状态报告和风险登记表。项目章程和范围说明书都应该分别审查几次，通常是在草案阶段审查一次，在认为是定稿时审查一次，最后在批准和签署阶段再审查一次。项目进度、预算、风险登记表和会议议程在状态会议上以纸质形式提供会很好。这些材料应该在会议前几天分发，以便参与者有机会提前审阅。我发现会议前两三天是发送此类文档的理想时间。如果你提前一周或更久发送，它们可能会被遗忘而不会被阅读。请记住，如果你发送的是合同文件或长几十页的文件，最好提前一周或更久发送，因为几天的时间不足以阅读所有材料。请根据信息的复杂性判断分发时机。\n\
  \n项目状态报告、会议纪要和行动项等文档可能有固定的分发计划。例如，如果你每周召开一次项目状态会议，计划可能要求在第二天分发纪要。分发计划应与利益相关者共同讨论。你将在下一节中学习这一主题。\n\
  \n## 社交媒体\n\n社交媒体是以电子格式与你的客户群或项目团队成员创建并共享沟通的一种。它实现了互动、内容共享，并让任何与项目相关的人都能提供投入。\n\n\
  接下来的问题是：谁应该获得信息、信息应该是什么格式、以及他们应该什么时候收到？你接下来将查看这些主题。\n\n## 沟通计划\n\n沟通计划可以很简单，你可以使用电子表格或表格格式轻松构建一个模板。\n\
  \n你可以通过以下步骤记录一份整体沟通计划：\n\n*   定义谁需要你的项目信息\n*   定义每个人或每个小组需要的信息类型\n*   识别沟通格式和分发方法\n\
  *   分配交付沟通的责任\n*   确定沟通何时发生以及频率多高\n\n表 8.1 显示了沟通计划的示例。\n\n| 利益相关者名称 | 沟通类型 | 沟通格式\
  \ | 分发方法 | 负责人 | 频率 |\n| --- | --- | --- | --- | --- | --- |\n| 赞助者 | 项目状态报告、每月执行层状态会议\
  \ | 书面和口头 | 电子邮件通知、项目存储库、面对面 | 项目经理 | 每周状态会议、每月执行会议 |\n| 赞助者 | 进度、预算、风险更新 | 书面和口头\
  \ | 电子邮件通知、特别会议、存储在项目存储库中的报告、面对面 | 项目经理 | 进度或预算更新以及中高分风险事件的立即通知 |\n| 利益相关者 A | 项目状态报告、进度更新\
  \ | 书面和口头 | 电子邮件通知、项目存储库、项目会议 | 项目经理 | 每周 |\n| 所有利益相关者 | 项目进度更新 | 书面和口头 | 电子邮件通知、项目存储库\
  \ | 调度员 | 每周 |\n| 利益相关者 B | 项目状态报告 | 书面和口头 | 电子邮件通知、项目存储库、项目会议 | 项目经理 | 每周 |\n\n\
  **表 8.1** 沟通计划示例\n\n你也可以选择在该计划中包含有关如何收集和存储信息、如何在沟通之间获取信息以及如何更新沟通计划的信息。\n\n尽管你可以使用此示例中的模板为所有利益相关者群体创建一个整体沟通计划，但在与你的项目团队沟通时，还有一些额外的考虑因素，你将在接下来学习。\n\
  \n## 与项目团队成员沟通\n\n作为项目经理，你最重要的工作之一就是与项目团队成员进行沟通。你有责任确保所有团队成员都理解项目目标和目的，以及他们的贡献如何融入大局。遗憾的是，这是沟通规划中经常被忽视的领域。\n\
  \n你与项目团队的互动将涉及正式和非正式沟通。*正式沟通*包括项目启动会议、团队状态会议、书面状态报告、团队建设活动或你与团队举办的其他计划性会议。*非正式沟通*包括与团队成员之间的电话和和邮件、走廊里的交谈以及即兴会议。\n\
  \n项目经理面临的挑战是将自己的沟通风格与每个团队成员的风格相匹配。从团队成员处获得投入将有助于你与他们更好地沟通。如果你正在安排启动会议或其他团队建设活动，请就议程项目或需要团队讨论的领域寻求建议。团队成员可能会根据之前的项目经验对团队会议的结构、频率或状态报告的格式提出建议。项目经理可能无法满足所有建议，但花时间考虑意见并审查最终格式对于建立凝聚力团队将非常有帮助。\n\
  \n每个人都有自己最喜欢的沟通方法。你的某些团队成员可能偏好电子邮件，而另一些人可能偏好电话或面对面会议。有些人可能喜欢直接找你分享他们拥有的信息或从你那里获得更新。对于这些非正式的一对一沟通，尽可能尝试配合每个团队成员最舒服的方式。\n\
  \n## 管理利益相关者的预期和沟通需求\n\n管理利益相关者的预期涉及通过与他们沟通来满足其需求、解决问题、通过实施要求的更改提高项目性能，以及预测潜在问题管理担忧。\n\
  \n管理利益相关者的预期是项目经理的责任。通过这样做，你将减少项目失败的可能性。管理利益相关者的预期还将增加实现项目目标的概率，因为问题得到了及时解决，项目期间的干扰被限制了。\n\
  \n利益相关者需要你提供的各种形式的沟通，他们的沟通偏好应记录在沟通计划中。如果你积极与利益相关者接触并与其互动，提供项目状态并解决问题，你项目成功的机会远大于你不做这些事情。与利益相关者的沟通贯穿整个项目。\n\
  \nCompTIA Project+ 考试提到了特定的利益相关者需求。你可以在沟通计划中记录这些需求。让我们简要查看每一个。\n\n**频率** 利益相关者对项目信息可能有不同的要求，包括他们接收信息的频率。关键利益相关者可能比其他人需要更频繁的更新，因此请在沟通计划中注明频率。\n\
  \n\n\n\n\n## 报告细节\n与频率一样，利益相关者所需的详细程度会根据其身份而异异。例如，项目赞助人可能比大多数其他项目利益相关者需要更多方面的细节。代表业务特定领域的利益相关者将希望了解更多与其自身领域相关的任务或风险细节。\n\
  \n### 沟通类型\n务必在沟通计划中注明利益相关者需要的沟通类型。有些人希望获得你生成的每份文档；而另一些人可能只对更新后的状态和进度感兴趣。\n\n###\
  \ 机密性限制\n你应该密切关注敏感或机密信息以及接收人员。例如，你可能不想不小心将一份人事通报发送给发送列表上的所有人。其他机密信息可能包括合同细节、财务状况以及公司特定信息（如商业秘密）。\n\
  \n### 定制沟通风格\n利益相关者像项目团队成员一样，对沟通风格可能有个人偏好。了解你的关键利益相关者，并询问他们偏好的沟通方式、希望接收信息的频率，以及他们希望你如何向他们更新项目信息与关键或紧急类型的信息。\n\
  \n让我们考虑到特定的利益相关者需求，再次查看沟通计划。表 8.1 在沟通计划中列出了以下列标题：\n\n* 利益相关者名称\n* 沟通类型\n* 沟通格式\n\
  * 分发方法\n* 责任方\n* 频率\n\n你可以添加额外的列来描述所需的报告细节级别，并可能使用“高、中、低”等标识，以便一目了然地判断执行摘要级别的信息是否适用，或者你是否需要详细解释某些项目。表\
  \ 8.2 显示了带有上述额外信息的示例沟通计划。\n\n| 利益相关者名称 | 沟通类型 | 沟通格式 | 分发方法 | 责任方 | 频率 | 细节级别 |\
  \ 机密 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| 赞助人 | 项目状态报告，每月执行层状态会议\
  \ | 书面和口头 | 电子邮件通知/项目存储库 | 项目经理 | 每周状态会议，每月执行层会议 | H | 否 |\n| 利益相关者 A-| | 项目计划，项目状态报告\
  \ | 书面 | 报告编写并存储在项目存储库中 | 项目经理 | 每周 | M | 否 |\n\n表 8.2 示例扩展沟通计划\n\n## 参与利益相关者\n\n\
  记住，利益相关者是指任何对项目结果有既得利益的人。在第 2 章中，我识别了一些典型的项目利益相关者：项目赞助人、职能经理、客户、项目团队成员等。\n\n在跨越多个职能领域的大型项目中，你可能会遇到没有积极参与项目或未完全理解其角色的利益相关者。这在实施大型系统或在多个地理区域部署新产品时可能会发生。例如，如果客户服务总监不了解他们的团队是如何参与的，或者对他们小组的总体影响如何，你需要让他们与正在发生的情况联系起来。\n\
  \n制定一个利益相关者参与计划来描述你需要传达的关键点，可能是很有用的。\n\n* 确定需要沟通项目计划的哪些方面。\n* 列出利益相关者已知或可能的收益或疑虑。\n\
  * 确定传达给每个利益相关者的核心信息。\n\n图 8.2 显示了一个使用新产品部署客户运营场景的利益相关者参与计划示例。\n\n![表：沟通计划利益相关者参与示例，包含高级概述（5\
  \ 分钟）、关键点（30 分钟）以及带有原因（我们为什么要开展这个项目？）等内容的行。](img/c08f002.jpg)\n\n图 8.2 利益相关者参与计划\n\
  \n这个特定示例根据你与利益相关者花费的时间使用了三种场景。这种方法有两个主要优点：\n\n* 你仔细考虑了需要说的内容。\n* 你已准备好下一次会议，或者在利益相关者想要更多细节时延长当前的会议。\n\
  \n应该与你的赞助人一起审查沟通计划。如果你的项目需要与执行团队成员沟通，赞助人可以帮助你识别小组所需的信息，以及沟通如何和何时进行。\n\n## 影响沟通的因素\n\
  \n保持团队成员之间的沟通畅通是非常重要的，这样你才能察觉可能正在产生的问题或冲突。在理想的世界里，如果你的团队规模小且所有团队成员的办公室就在你门口，这是很容易实现的。你会认识每个人的名字，并有机会进行非正式聊天，帮助大家更好地互相认识。如果这不可能，请务必在与团队成员以及成员之间建立关系方面多加努力，让他们能够舒适向你及团队其他人汇报问题和信息。\n\
  \n在今天的全球世界中，你更有可能有不同地理位置的团队成员。对于作为项目经理来说，这意味着几点：首先，在安排会议时必须意识到时区问题，以免某些团队成员需要在深夜起床。在某些情况下，必须调整截止日期以考虑不同的时区。沟通偏好和语言障碍也会产生影响。你可能有说不同语言的团队成员。如果是这样，你必须确定最佳沟通方法。根据我的经验，使用二三种形式的沟通效果良好，特别是对于关键信息，这样可以减少误解的概率。\n\
  \n无论团队是协作还是分散，文化差异都可能产生影响。例如，如果你习惯在美国工作，你知道那里文化倾向于重视成就和个人主义。美国公民倾向于非正式，即使是初次见面也会互相称呼名字。在某些欧洲国家，人们倾向于更正式，在商务场合中使用姓氏而不是名字，即使他们彼此很熟悉了。他们的沟通风格也比美国更正式，尽管他们倾向于重视个人主义，但也重视历史、等级和忠诚。在日本文化中，大多数人认为自己是群体的一部分，而不是个体。你应该花时间研究团队成员的文化背景，并了解那些有助于他们成功并帮助你让他们感到像团队一员的习俗和做法。\n\
  \n技术障碍可能会产生意想不到的影响。例如，在某些国家，电力断电数小时或互联网连接无故掉线并不稀见。如果你正在处理交付物或排查故障，这些问题可能会对项目产生重大影响。团队成员对你在项目过程中使用的软件程序和其他技术的熟练程度也可能不相同。请确保在需要的地方提供培训，或者在面试过程中加入有关项目所用技术熟练程度的问题。在计划中增加一些缓冲时间以应对不可预的技术问题并不是一个坏主意。\n\
  \n\n\n\n请记住，组织结构本身也会影响你管理团队的方式以及他们互动的方式。团队内部存在的组织内差异会影响你使用的沟通方法。如果你有一个小团队且成员们共同办公，那么非正式和即时的会议可能效果很好。\n\
  \n组织间的差异也会影响你的沟通方法。例如，本质上是层级制的职能组织会对团队产生影响，因为有其他经理参与他们的职业发展和绩效评估中。他们通常还会指导团队成员的工作分配。这种组织间的差异可能需要正式的沟通，并按照定期的发布计划编制书面报告。\n\
  \n正如我之前讨论过的样，在确定沟通的方法和内容时，请运用你的最佳判断，并针对你的受众量身定制。务必考虑到所有可能影响影响信息的因素，例如文化或语言差异。信息的关键性和信息的时效性是沟通方法中需要考虑的其它因素。\n\
  \n## 沟通触发因素\n\n有几个因素可能导致需要更新利益相关者或向他们传达新信息。这些`沟通触发因素`在所有项目中都很常见，且大多数不言自明，因此我将只花一分钟左右简要介绍每项。\n\
  \n### 审计\n你的组织可能会定期对项目进行审计，以确定所投入资金是否获得了足够的价值，和/或确定是否遵循了适当的流程和程序。审计可以由组织内部或外部的方进行。这是将项目计划文档化并将重要的项目产物保存到项目存储库的众多原因之一。\n\
  \n### 项目规划\n沟通贯穿于整个项目规划过程及之后。正如我在书中一直讨论的那样，只要你处于规划阶段（无论是在制定章程、范围说明、预算等），你都应该与你的利益相关者和团队成员进行积极沟通。\n\
  \n### 项目变更\n每当项目的范围、预算或进度发生变更时，都需要与利益相关者进行讨论和沟通。第 9 章将深入涵盖变更流程。\n\n### 风险登记表更新\n\
  风险在项目早期更有可能发生，且后果也更大。当风险发生或识别出新风险时，应告知利益相关者所采取的行动以及响应计划的结果。\n\n### 里程碑\n里程碑可以成为沟通触发因素，因为按时且预算内完成里程碑是好消息，但未能按时或在预算内完成则不是那么好的消息。这两种情况都需要向利益相关者进行更新。\n\
  \n### 进度变更\n我之前提到过变更，但进度变更如此重要，值得单独提及。进度往往会深刻在项目赞助者和关键利益相关者的脑海中，他们会不断提醒你项目结束日期。他们想知道进度是否因为任何原因发生了滞后，而分享你已提前完成交付物或里程碑通常是令人愉悦的消息。\n\
  \n请记住，进度也是任何项目“三要素约束”中的约束因素之一。\n\n### 任务启动/完成\n这种沟通触发因素通常处于团队层面，而非利益相关者层面。项目团队成员在任务按时完成时，乐于听到“干得好”。启动新任务是项目团队与项目经理沟通的另一个机会。\n\
  \n### 利益相关者变更\n利益相关者有时会要求对项目进行变更。高层利益相关者以认为他们不需要遵守流程而臭名昭著。他们还可能认为由于组织中的地位，他们要求的任何变更都应该被批准。如果你发现自己处于这种情况下，请寻求你的项目赞助者或其他关键利益相关者的帮助，解释与所有利益相关者沟通变更的重要性，并权衡变更请求的利弊。\n\
  \n### 门限评审\n门限评审发生在项目预设的节点。这些节点可以由`PMO`定义，也可以由项目经理指定并经利益相关者同意。门限评审可能发生在每个项目阶段（启动、规划、执行等）结束时，或者实现某些里程碑或交付物之后。\n\
  \n### 业务连续性响应\n业务连续性响应计划概述了在发生灾难的情况下业务如何继续向客户提供服务或产品。它描述了业务如何继续运营，包括如果人们无法在常规地点工作应向谁报告、紧急联系人列表，以及如何从灾难中恢复并恢复运营。显然，在这种情况下沟通应该是频繁、有效且高效的。\n\
  \n### 事件响应\n事件响应与业务连续性响应类似，但仅是在规模更小、更个人化的基础上。例如，洪水可能会影响你仓库的一部分。这需要事件响应来处理该状况。业务仍然可以进行，但必须处理被淹的仓库部分以及任何受损货物。影响你日常运营导致你无法照常进行业务和/或要求你在另一个地点进行业务操作的洪水就是业务连续性响应的示例。\n\
  \n### 资源变更\n你项目的另一个沟通触发因素是资源变更，特别是关键资源受到影响时。每当项目经理变更时，都应该召开会议来宣布变更。可能你某些拥有专业技能的资源已在其他地方就业或正经历需要长期缺的个人情况。这也应尽快向利益相关者传达。资源变更可能产生许多影响，包括进度延误、预算增加以及为项目引入新风险。\n\
  \n如果发生了沟通触发因素，你需要告知相关的利益相关者或项目团队成员，并可能安排会议来讨论其影响。并不是所有的沟通触发因素都需要通知每一个利益相关者。你将根据所发生的信息类型或触发因素来确定目标受众。\n\
  \n你可能考虑将你的触发因素记录在电子表格或类似的程序中，这样当发生沟通触发因素时，你就知道通知谁、何时通知他们以及使用何种方法。表 8.3 显示了一份沟通触发因素计划示例。\n\
  \n| 触发因素 | 利益相关者 | 原因 | 方法 | 通知时机 |\n| --- | --- | --- | --- | --- |\n| 项目规划完成 |\
  \ 所有 | 获取签字。 | 签字会议 | 在规划阶段完成时 |\n| 项目变更 | 赞助者和受影响的利益相关者 | 获取变更的批准/推迟。 | 项目变更管理会议\
  \ | 定期行的变更会议 |\n| 风险登记表更新 | 利益相关者 A、B、C、D | 发生的风险事件更新、响应计划的执行或新风险通知 | 特别风险会议、项目会议\
  \ | 立即以及在定期行的项目会议上 |\n| 资源变更 | 赞助者、受影响的利益相关者 | 告知利益相关者资源变更带来的影响、延误或风险。 | 特别会议、项目会议\
  \ | 立即以及在定期行的项目会议上 |\n\n\n\n\n\n# 表 8.3 沟通触发计划示例\n\n## 摘要\n大多数项目经理的大部分时间花在沟通上。沟通是通过`发送者-信息-接收者模型`进行的。沟通规划是一个过程，你确定谁需要什么类型的沟通、何时沟通、以什么格式沟通，以及这些沟通如何传播。网络通信模型显示了任意项目参与者之间存在的通信线路。倾听是任何项目经理的另一项重要沟通技能。\n\
  \n沟通方法有很多，包括会议（可以采取多种形式，包括面对面、虚拟等等）、电子邮件、传真、视频会议、语音会议、短信、即时消息、面对面、印刷媒体分发和社交媒体。\n\
  \n影响沟通方法的因素包括语言障碍、时区或地理因素、技术因素、文化差异、组织间差异和组织内部差异以及个人偏好。你希望与团队成员建立良好的关系和稳固的关系，以便克服可能影响沟通的任何因素。利益相关者在沟通需求方面有时会有自己的要求，包括沟通频率、报告详细程度、沟通类型和保密性限制。根据利益相关者的偏好调整你的沟通风格也很重要。\n\
  \n## 备考要点\n**描述沟通规划的重要性。** 沟通规划是项目成功的关键。它涉及确定谁需要信息、什么类型、何时、什么格式以及沟通的频率。\n\n**描述会议类型。**\
  \ 会议包括启动会议、虚拟会议、现场会议、计划会议、临时会议和结束会议。\n\n**描述沟通方法。** 沟通方法包括会议、电子邮件、传真、即时消息、视频会议、语音会议、面对面、短信、印刷媒体分发和社交媒体。\n\
  \n**描述影响沟通方法的因素。** 语言障碍、时区/地理因素、技术因素、文化差异、组织间差异、组织内部差异、个人偏好、关系建立、信息内容、关键性因素以及特定的利益相关者沟通需求。\n\
  \n**列出任何项目中常见的沟通触发因素。** 审计、项目规划、项目变更、风险注册表更新、里程碑、进度变更、任务启动/完成、利益相关者变更、阶段评审、业务连续性响应、事件响应和资源变更。\n\
  \n## 关键术语\n在参加考试之前，请确保你熟悉以下术语：\n\n* 基础沟通模型 (basic communication model)\n* 沟通触发因素\
  \ (communication triggers)\n* 正式沟通 (formal communication)\n* 非正式沟通 (informal communication)\n\
  * 沟通线路 (lines of communication)\n* 信息 (message)\n* 接收者 (receiver)\n* 发送者 (sender)\n\
