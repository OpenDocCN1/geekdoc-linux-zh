  \    2. 谈判\n    3. 规范\n    4. 回避\n    5. 折中\n\n9. 你的系统工程师在每周团队会议上开始发表负面言论。他与市场经理发生了激烈的争论，你从各种团队成员那里听说他变得很难相处。你采取的最佳行动方案是什么？\n\
