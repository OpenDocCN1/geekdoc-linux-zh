    ## 射频识别攻击


    ### 本章信息


    - RFID 基础

    - RFID 风险

    - 物理访问控制

    - RFID 遇上密码学


    射频识别（RFID）是一种人人耳熟能详但大多数人并不完全理解的技术。它的名字在谈论商业效率和现代化时被反复提及，同时又与老大哥和隐私侵犯相关联。就安全而言，它是一种才开始成熟的安全技术，但它经常被误解，风险被严重低估，以至于安全常常被完全遗忘。


    大多数现代办公楼已放弃实体钥匙，转而使用 proximity 卡系统。我们都见过它们，挂在挂绳上的卡片在门前的读卡器前挥动，就像现代的魔幻“open sesame”指令。


    在 DEFCON 17 黑客大会上，众所周知，相当数量的与会者是联邦特工，有些以本名出席，有些卧底，但都去学习。今年他们中很多人引起了很大轰动：那些认为自己的
    proximity 卡可能被克隆的人。由 Adam Laurie（major malfunction）和 Zac Franke 发起的旨在提高人们对 RFID
    漏洞认识的项目，收集的数据比预期更多。


    他们的项目由一台 125-kHz RFID 读卡器和一根连接到笔记本电脑的大天线组成。笔记本电脑上还连接了一台网络摄像头。所有这些东西都明目张胆地放在会议区的一张桌子上。任何走近桌子并随身携带兼容
    RFID 卡的人，其卡都会被扫描，摄像头也会拍摄其照片。想法是随后清理数据并将其放在“wall of sheep”上，与在会议网络上使用不安全协议登录的其他与会者一起。


    结果证明他们的项目效果比预期更好，可能捕获了几名联邦特工的门禁卡数据。对于会议组织者来说，这进入了一个灰色地带（对 DEFCON 来说比平常更多），他们认为最好不要鼓励，在“Meet
    the Fed”小组讨论会上，向台上聚集的联邦特工和观众解释了发生了什么以及其影响。此时，Adam Laurie 在仅粗略看了一眼后就销毁了存储数据的存储卡。之后，许多人被听见说，“We
    never thought of that。”


    ## RFID 基础


    RFID 涵盖了多种技术，统归于一个缩写。基本上，任何通过无线电信号识别某物的技术都属于 RFID 范畴。人们通常所知的 RFID 是一种短距离无线识别系统，通常用于建筑物出入、条形码替代以及身份文件和支付卡。你很可能在任何时候身上都有一台或多台启用了
    RFID 的设备。然而，大多数人对这些设备的工作原理知之甚少，就像大多数技术一样，这导致了安全风险和漏洞。


    RFID 设备通常有两个部分：应答器和 reader/interrogator。当读卡器查询标签时，它会回复一些标识符，最基本的是识别号码（可以有更复杂的响应，后面会讨论），读卡器接收该标识符并据此执行某些操作。这可能看起来过于笼统，但标签和读卡器的用途无穷无尽。标签可以放置在几乎任何地方，读卡器可以将标识符传递给后端系统，从而导致几乎任何事情发生，从账户扣款到打开窗户或更新地图。RFID
    标识符应仅被视为更大系统中的输入。


    ## RFID 系统


    最常见的 RFID 系统分为两类：主动式和被动式。这通常表示标签所涉及的电源系统，以及在未被 interrogated 时的行为。RFID 的核心包含一个非常小的处理器，在通电时会执行某些操作；然而，电源方式确实限制了一些用途。


    ### 主动标签


    主动设备通常具有电池或其他电源系统。设备始终处于“on”状态，通常比被动标签的范围更远。这些设备一直在广播信号，可以被附近任何合适的读卡器接收。这方面的主要例子是纽约州和其他美国东北部州的无处不在的
    EZpass 以及世界各地其他收费设备。

