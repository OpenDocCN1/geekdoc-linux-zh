    \ the same key, there is little point in using it as a security token. The logic\
    \ of “Something you have” and of all parts of the authentication triangle is that\
    \ every identifier is unique and thus can be traced back to a specific user, ensuring\
    \ nonrepudiation. A common key among users means that now only one factor (a password,\
    \ or biometric) is all that is left to authenticate."
