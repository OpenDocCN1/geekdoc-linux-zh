    2。”你已经知道答案是 2 × 5 = 10，10² = 100。如果保安回复 100，你们双方就证明了自己知道秘密，可以继续。如果他对你的回复错误，你可以离开而不信任他，或者至少怀疑他的数学技能。如果你的回复对他错误，他可以将你扔到路边并继续下一位排队的人。幸运的是，对于
