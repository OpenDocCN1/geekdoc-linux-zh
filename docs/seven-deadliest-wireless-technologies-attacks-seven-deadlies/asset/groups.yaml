  mdcn: "\n许多商店。此外，VISA（PCI 组织成员之一）让 TJX 通过了合规性检查，条件是他们必须及时改进无线安全。可以肯定的是，这起事件之后，无线安全受到了更加认真的对待。突然之间，原本的升级成本似乎比之后的清理成本和负面报道要小得多。\n\
    \n## 理解 WEP 破解\n\nWEP 是 1997 年 802.11b 无线标准中最初的加密方案。当时，美国国务院将强加密视为一种防御手段（许多制造商的总部设在美国），并且由于存在对外出口限制，密钥长度被限制为\
    \ 40 位。后来这一限制被放宽，允许出口 64 位和 128 位密钥。多年来，这曾是无线网络唯一可用的安全标准。\n\n> **注意**\n> \n> 市场上也有许多专有安全方法。其中一些，如轻量级可扩展认证协议\
    \ (LEAP)，比 WEP 更好，但需要来自思科等单一公司的端到端解决方案。这增加了成本，并破坏了使 802.11 极具吸引力的互操作性，而且除了企业内部的同构网络外，几乎没有流行起来，家庭用户更是几乎无人使用。\n\
    \n早在 2001 年，WEP 加密方案的实现问题就导致了首次真正意义上的破解。问题围绕该方案的初始化向量 (IV) 字段展开，该字段是一个与网络密钥连接的随机数，用于为方案提供一定的随机化。WEP\
    \ 基于 RC4 流密码算法，与任何流密码一样，不能使用相同的密钥。IV 随每个数据包而变化，最终会重复，从而使攻击者获得两个具有相同 IV 的数据包。用于\
    \ IV 的计数器长度为 24 位，这意味着在一个相当繁忙的网络上，在 5000 个数据包之后，IV 有很大可能重复，从而产生 IV 冲突，即两个数据包用相同的密钥加密，这就为密码分析提供了基础。如果遇到更多冲突，攻击成功的几率也会增加。\n\
    \n像 Airsnort 这样的工具开始出现，需要捕获 500 万到 1000 万个数据包进行分析。在一个特别繁忙的网络上，这需要几个小时来收集。在较安静的网络上，则可能需要数天，而且即便如此，也常常是碰运气。这些工具后来被最初的\
    \ Aircrack 工具套件所取代，后者引入了一些新的攻击方法，并将所需的数据量减少到：40 位和 64 位 WEP 需要 20 万到 50 万个数据包，128\
    \ 位 WEP 需要 100 万个数据包，这是一个更容易处理的数据量。\n\n工具的进一步发展使得 IV 数据的利用更快、更高效。ARP 重放攻击的出现真正缩短了执行攻击所需的时间。ARP\
    \ 重放攻击是指从网络中捕获一个加密的 ARP 数据包（即使经过加密，也可以通过其独特的大小识别），然后重新传输回 AP，AP 反过来会发送另一个具有不同\
    \ IV 的 ARP 数据包。这一过程快速且反复地进行，会产生大量可供使用的 IV，并使计数器翻转、发送重复的 IV。这一点，再加上 Aircrack 的改进（此时原作者已放弃该工具，现重新实现为\
    \ Aircrack-ng），将执行攻击的时间从数小时甚至数天缩短到短短 10 分钟。\n\nPychkine–Tews–Weinmann (PTW) 攻击可以说是压垮\
    \ WEP 的最后一根稻草。这种攻击可以利用更多的数据包进行分析，并且只需 2 万到 5 万个数据包即可奏效。与 ARP 重放攻击结合使用时，从头到尾只需\
    \ 60 秒即可执行完毕，从而获得目标网络的十六进制 WEP 密钥。\n\n在 TJX 事件中，首次攻击发生时，WEP 存在问题已是众所周知，而且其中一些工具已经存在了好几年（至少从\
    \ 2005 年起，Aircrack 就已经存在）。只要有一个意志坚定的攻击者，愿意花费必要的时间和精力，再加上一台笔记本电脑、一张无线网卡和犯罪意图，就能在某个命运攸关的夜晚侵入那家商店的无线网络。\n\
    \n## 如何破解 WEP\n\n如今，破解 WEP 实际上是一件容易得令人害怕的事。最初的工具相当缓慢，时灵时不灵，而且通常需要大量数据。经过大约 7 年的发展，这些工具已经达到了相当精密的程度，使得破解\
    \ WEP 成为一种相当可靠的结果。\n\n有很多工具可以破解 WEP，但最流行的是 Aircrack-ng（“ng”代表新版或下一代，与之相对的是 Chris\
    \ Devine 开发的原始 Aircrack，后者已被弃用）。本节将简要介绍破解 WEP 并恢复密钥所需的步骤。\n\n> **警告**\n> 在大多数司法管辖区，任何试图从你不拥有或未经许可的网络中恢复密钥的行为，都很可能构成犯罪。正如\
    \ TJX 攻击事件所示，破解网络会带来非常真实的后果，无论看起来多么容易。\n> 如果你想测试此工具或任何其他安全工具，最好的、最安全的方式是使用自己的设备，或获得所有者明确许可的设备。破解邻居的\
    \ WEP 密钥听起来可能很有趣，但那是重罪。不要这样做。\n\n本指南假定以下几点，因为无法得知你可能使用的具体设备配置。无论使用什么平台，用法都应当类似：\n\
    \n- 运行 Ubuntu 9.04 的笔记本电脑\n- Atheros 802.11b/g 无线网卡\n- 来自 http://madwifi-project.org/\
    \ 的 Madwifi-ng 驱动程序 (0.9.4)\n\n**提示**\n\n任何无线工具包中最重要的部分可能就是兼容的无线网卡。在大多数情况下，基于\
    \ Atheros 的硬件最适合 Linux 和无线渗透测试，因为 Linux 下的驱动程序非常开放，能够完成启用某些攻击所必需的许多特殊操作。\n\n请查看\
    \ Aircrack-ng 网站以获取受支持和推荐的网卡列表：\nwww.aircrack-ng.org/doku.php?id=compatibility_drivers\n\
    \n第一步是获取 Aircrack 软件。该软件可从网站 www.aircrack-ng.com 获取。它提供适用于 Unix 系统和 Windows 的多种不同软件包，以及可引导的\
    \ Linux 发行版和 VMware 镜像。\n\nAircrack 实际上是一个工具套件。其核心是真正执行破解的同名工具。它周围还有许多辅助应用程序，帮助你获取所需的信息。在大多数情况下，你只需关注四个程序：Airmon-ng、Airodump-ng、Aireplay-ng\
    \ 和 Aircrack-ng。\n\n安装或构建好 Aircrack 套件后，你需要开始捕获数据包。要做到这一点，你需要将网卡置于监控模式，以便监听数据包。\n\
    \n**提示**\n\n在创建本指南时使用的 Madwifi 驱动程序中，需要采取一些额外步骤来准备网卡进入监控模式。\n\nMadwifi 驱动程序以一个通常命名为\
    \ wifi0、wifi1 等的“父”设备运行，并创建虚拟接口 (VAP)，而程序实际与之交互的是这些虚拟接口 (ath0、ath1 等)。每个父设备最多可以有四个\
    \ VAP，以不同角色运行，但同时拥有多个设备可能会引发问题。例如，如果一个 VAP 处于监控模式并尝试跳频，而另一个 VAP 处于客户端 (STA) 模式，那么当\
    \ STA-VAP 与 AP 关联时，父设备就无法持续切换信道，从而破坏监控模式的 VAP。\n\n除非你需要多个 VAP，否则最好在创建新的监控模式 VAP\
    \ 之前销毁现有 VAP。这可以通过 wlanconfig 命令轻松完成：\n\n（其中 ath0 是你要销毁的 VAP）。或者，如果你想重新开始，可以卸载并重新加载\
    \ Atheros 驱动程序，并强制它不创建任何 VAP：\n\n```\nwlanconfig ath0 destroy\n```\n\n```\nmodprobe\
    \ -r ath_pci\n```\n\n```\nmodprobe ath_pci autocreate=none\n```\n\n假设你有一张兼容的网卡并准备进入监控模式，Airmon-ng\
    \ 程序可以轻松地配置你的网卡。该程序会识别驱动程序，并知道需要采取哪些步骤来启用监控模式。对于 Madwifi 驱动程序，请将父设备 wifi0 指定为接口：\n\
    \n```\nairmon-ng start wifi0\n```\n\n"
