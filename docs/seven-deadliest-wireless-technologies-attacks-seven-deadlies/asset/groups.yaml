    \n## FIGURE 7.2\nLogging into an iPhone as Root\n\n![](img/fa764b70be0fdcb44b75286d4f8589e2_125_2.png)\n\
    \n## FIGURE 7.3\niPhone Calendar Data File\n\n## FIGURE 7.4\niPhone Mail Folder\n\
    \n![](img/fa764b70be0fdcb44b75286d4f8589e2_126_0.png)\n\n## FIGURE 7.5\niPhone\
    \ Photo Directories\n\n![](img/fa764b70be0fdcb44b75286d4f8589e2_126_1.png)\n\n\
    Photos are probably one of the more interesting targets, particularly as potential\
