    Wireless is a technology with an inherent problem, common to pretty much all standards.
    It’s not really a technical problem, but one of physics. Most wireless gear works
    on radio frequencies, but others work over light spectrum, such as laser and infrared,
    and can be considered wireless as well. Most systems have the inherent security
    problem of a shared medium. Anyone else who is within the range of the signal
    can receive it just as easily as the intended recipient. For an attacker, this
    makes sabotage much, much easier. When eavesdropping on these signals became a
    security issue, the logical and best solution for the problem was to encrypt the
    signal, or at least the message at the heart of what was being communicated. This
    is logical since it now means that the intended recipient will know how to decrypt
    the signal and read the message, but an attacker will just receive an unreadable
    mess that, without the key, will be indecipherable in a reasonable amount of time.


    Given that wireless communications by their nature can be intercepted, protection
    is very important. Throughout this book, encryption has been mentioned as a way
    to keep eavesdroppers from reading wireless communications. However, encryption
    is not an easy thing to implement in products and protocols, and poor implementations
    can leave a false sense of security and really poor implementations can fail spectacularly.


