    Usually, active tags are larger due to their requirements for internal power.
    There is no end of the sizes and shapes available, but they are typically much
    larger than passive tags. The advantage of an active tag is the increased range
    due to the extra power. This is one of the features that make them very attractive
    for toll collection since cars do not need to slow down or get unnecessarily close
    to the reader – the toll can be collected automatically, almost without slowing
    down from highway speeds. This reduces the manpower required for toll collection,
    as well as decreasing bottlenecks and traffic delays caused by manual toll collection.
    It also means that travelers do not have to worry about insufficient change since
    the tag is linked to an account that is billed later via credit card or invoice.


    There is a third type of tag, the battery-assisted passive (BAP) tag. These tags
    require an external signal to “wake up” but once they are, they utilize a battery
    to vastly increase their range. These can be classified as active tags due to
    the use of a battery, but for some uses, it may be useful to consider them separately.
    For the purposes of this chapter, they will be considered in the active tag category.


    # Passive Tags


    Passive devices are the other side of the technology. These devices are unpowered
    until brought into proximity of the reader. The reader powers up the tag through
    a process called induction. A radio signal of a specific frequency is emitted
    by the reader to the tag. The tag’s antenna is tuned so that the readers’ signal
    induces an electrical current in the antenna, supplying electricity to a small
    capacitor. When the capacitor is at full charge, it powers up the chip on the
    tag, which then performs its functions, sending out its reply through the same
    antenna to the reader. This process repeats as long as the reader is in range
    and is energizing the tag. Being that there is no requirement for an external
    power source like a battery, these tags can be extremely small. Some designs are
    just slightly larger than a grain of rice; others are thin enough to be made into
    flexible adhesive labels and attached to just about anything. Some packaging options
    can be embedded in clothing, namely the sewn in tag.^1 There are many packaging
    options available, with the tag itself only taking a very small amount of space
    in the package. Figure 4.1 shows a variety of tags and a small hobby reader.


    Since passive tags are powered up by the reader, this requires that the reader
    be much closer to the tag than in an active system. The signal powering the tag
    from the reader decreases with distance (the attenuation is proportional to the
    inverse square of the distance from the tag), so to increase the read range, one
    needs to increase the power to the reader. However, the tag only has a limited
    range on its capability to send signals back to the reader, so if the reader is
    too far away, it may be able to power the tag, but not able to hear it. This distance
    is usually a few inches to a few feet depending on the specific technologies and
    readers used. This is not a problem for a door access card or a credit card system,
    but is not optimal for a car traveling at 50 mph.'
