    \ parted ways.\n> \n> This also applies later to automated viral and worm attacks.\
    \ Continuous contact in a contained area increases the likelihood of an infection\
    \ spreading to your device, particularly with many airlines now offering onboard\
    \ Wi-Fi capabilities.\n"
  mdcn: "\n应被如此对待。然而，用户尚未完全跟上这一思路。对许多人来说，它们首先仍是简单的手机，而不是通用计算设备。\n\n通过现有无线网络手动执行攻击是相当容易的。唯一的困难在于像\
    \ iPhone 这样的设备通常按需使用，会随着使用和进入待机而进出网络。机场、咖啡店、图书馆以及任何提供免费 Wi-Fi 的场所，都是很可能找到使用无线网络的\
    \ iPhone 和 iPod 的地方。\n\n第一步是识别。由于 iPhone 是网络设备，它们在 Wi-Fi 上工作时需要像网络上任何其他设备一样使用\
    \ Internet 协议（IP）地址。简单的 Nmap 或其他端口扫描即可识别网络上的设备并报告正在运行的服务。iPhone 通常会打开 62078 端口，这是\
    \ iPhone 同步服务，一项用于 iPhone 与其他 Apple 设备共享内容的 UPnP 服务。单个开放端口通常是一个很好的迹象，同时也可以确认媒体访问控制地址与\
    \ Apple 使用的地址相对应。启用了 SSH 的越狱手机会打开 22 端口用于 SSH（SSH 服务的默认端口）。图 7.1 显示了简单的 Nmap 输出。\n\
    \n一旦识别出 iPhone，只需通过 SSH 以 root 身份登录手机，默认密码为“alpine”即可。图 7.2 显示了登录越狱 iPhone 以及\
    \ root 文件夹的情况。\n\n登录后，即为标准的 UNIX 命令提示符。最基本的命令，如“ls”、“cp”和“rm”，以及诸如安全文件传输协议之类的功能都可用。虽然并非所有常见的\
    \ UNIX 命令都可用，但足以在设备上移动数据。\n\n> 注意\n> 在最初的自动化攻击浪潮引发的整个警报期间，大多数新闻网站都在高呼更改 iPhone\
