    \ DNS 重绑定攻击，该攻击将受害者浏览器转变为攻击者访问内部网络的代理服务器（http://events.cc.de/congress/2007/Fahrplan/events/2393.en.html），你就拥有了造成大量损害的配方。\n\
    \n在更基础的层面上，数据注入不必局限于网页浏览器内容。正如长期所推测的那样，使用早期版本的 Airpwn 但从未实现，DNS 也可以被注入。客户端发送对\
    \ mybank.com 的 DNS 请求，攻击者可以将客户端重定向到自己的钓鱼站点。这可以是\n"
