  md: "\nbe treated as such. Users, however, have not quite caught up to this line\
    \ of thinking. To many of them, they are still simple phones first and not general\
    \ computing devices.\n\nA manual version of the attack over an existing wireless\
    \ network is fairly easy to do. The only difficulty is that devices like iPhones\
    \ are usually used on demand and can come and go from the network as they are\
    \ used and put into standby. Airports, coffee shops, libraries, and any other\
    \ locations with free Wi-Fi are likely places to find iPhones and iPods using\
    \ the wireless network.\n\nThe first step is identification. Since iPhones are\
    \ network devices, they require an Internet Protocol (IP) address to work over\
    \ Wi-Fi just like any other device on the network. A simple Nmap or other port\
    \ scan will identify devices on the network and report what services are running.\
    \ iPhones will typically have port 62078 open, which is iPhone sync, a UPnP service\
    \ for the iPhone to share content with other Apple devices. This single open port\
    \ is usually a good indication, but also confirming the media access control address\
    \ corresponds to those used by Apple. Jailbroken phones with SSH enabled will\
    \ have port 22 open for SSH (the default port for the SSH service). A simple Nmap\
    \ output is shown in Figure 7.1.\n\nOnce an iPhone has been identified, it is\
    \ simply a matter of logging in over SSH as root to the phone with the default\
    \ password of “alpine.” Figure 7.2 shows logging in to a jailbroken iPhone and\
    \ the root folder.\n\nOnce logged in, it is a standard UNIX command prompt. The\
    \ most basic commands, “ls,” “cp,” and “rm,” are available along with things like\
    \ Secure File Transfer Protocol. While not every common UNIX command may be available,\
    \ there is plenty enough to move data on and off of the device.\n\n> NOTE\n> During\
    \ the whole alarm at the initial rash of automated attacks, most news sites were\
    \ trumpeting the same line about changing the root password on the iPhone to keep\
    \ out invaders. What many sites failed to mention was that the username “mobile”\
    \ had the same password of “alpine” and had access to most of the same interesting\
    \ things that an attacker would be seeking on a mobile device (contacts, mailbox\
    \ contents, SMSes, photos, and so on).\n> These articles were probably doing more\
    \ of a disservice to their readers by failing to mention the user “mobile” requiring\
    \ a password change as well, since a well-informed attacker would try out user:\
    \ mobile, password: alpine.\n\nOnce in as root, there’s really no limit to what\
