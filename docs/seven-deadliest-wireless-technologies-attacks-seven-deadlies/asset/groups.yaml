    gain my knowledge of wireless and provided me with a fun and interesting hobby
    and career and the opportunity to share that knowledge with others.


    +   - Mike Kershaw (Dragorn) for putting up with my constant feature requests
    and bug reports for Kismet and for making his wonderful tool free to the world.

    +   - Frank Thornton (Thorn) for providing mentorship and camaraderie at many
    a convention and for helping design some great wireless contests to hone my skills.

    +   - Chris Hurley (Roamer) for many of the wireless contests and for years of
    direct and honest opinions and comments on everything wireless.

    +   - Josh Wright for his wonderful work on coWPAtty and the WPA cracking tables
    and for many other tools used by thousands of people on a daily basis.

    +   - Emmanuel Goldstein, 2600 magazine, and the HOPE organizers for another wonderful
    conference full of new ideas and experiences and giving me the opportunity to
    meet my wife.

    +   - Jeff Moss (Dark Tangent) and the DEFCON staff for continually putting on
