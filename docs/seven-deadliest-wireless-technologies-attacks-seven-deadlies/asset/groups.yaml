    的使用已严重降低了护照中可用的安全程度。政府和私人公民对这些弱点的缺乏了解意味着，他们经常会严重高估带有数字组件的文件的安全性，称其为不可克隆且防伪。类似的术语和想法使人们更有可能对这类文件给予更多信任，并且更可能让合理的伪造品以比其非数字对应物更少的审查而通过，从而从一开始就击败了整个系统的目的。


    ## SPEEDPASS


    支付系统显然需要加密。鉴于攻击这些系统的财务动机，在可能的情况下加密支付信息是顺理成章的。支付系统还要求易于使用和快速周转，以对客户、零售商和支付处理商都具有吸引力。为此，多年来许多公司为其商店和服务设立了自己的支付选项，但1997年，事情有了飞跃，当时美孚石油公司创建了Speedpass系统。


    Speedpass是一个小塑料吊坠，挂在钥匙链上，内含德州仪器生产的玻璃胶囊134.2-MHz数字信号应答器（DST）。这些标签体积小、批量购买便宜，可以免费赠送。标签的标识符与客户选择的信用卡或支票账户绑定，只需将标签在加油泵内置的读卡器前一挥即可自动扣款。理论上它更方便，因为购买燃料所需的一切就是标签——无需在车内处理现金或信用卡，你可以在泵上即时付款。标签也利用了品牌忠诚度，因为它的便利性和仅限于一个品牌加油站的排他性意味着客户更有可能返回这些站点。便利性还导致附属便利店的销售额增加，因为人们不处理真钱，因此更倾向于多花钱。


    1999年，美孚石油公司被埃克森收购，成为埃克森美孚，并将该计划扩展到埃克森加油站，使其成为公众使用的首批大规模RFID部署之一。类似技术已推广到其他客户忠诚卡和支付系统，但Speedpass在规模（数百万标签和数千个地点）以及失败方面都最为引人注目，因为它是第一个在外部研究下垮台的主要系统。


    标签采用挑战/响应认证系统运行。 interrogating reader向标签发送40位挑战，标签随后使用包含存储在标签上的唯一40位密钥的加密算法计算出24位响应。标签将该响应连同唯一的24位标识符，即单元序列号一起发送。读卡器使用该标签序列号的预期密钥计算出对挑战的响应。如果读卡器的预期响应与标签发送的内容匹配，则确认标签为真，并继续从后端数据库中与该唯一标签绑定的信用卡或账户中扣款。所有这些在加油泵上的处理和操作所需时间不到一秒。系统还允许将多个标签附加到同一账户，使家庭和企业能够轻松购买，这对车队和家庭来说是非常方便的功能。


    多年来，人们对系统的安全性很感兴趣，但极其微小的应答器对研究人员来说是个谜。使用的加密系统是专有的，并在保密协议和应用程序编程接口后面受到保护。这就是所谓的通过
    obscurity 实现的安全。在不知道内部结构的情况下，攻击者只能看到输入标签的内容和输出内容，但对中间过程一无所知，也不知道如何重现它。


    通过 obscurity 实现的安全根据定义只有在秘密保持秘密时才有效；然而，一旦秘密被知晓，依赖它的系统就会崩溃。通常，只需要时间和努力。对于Speedpass，这时间和努力由约翰霍普金斯大学的一个团队在2005年投入。14


    约翰霍普金斯团队获得了一套评估套件和一些Speedpass标签样本。他们研究的关键部分是德州仪器（TI）工程师在2004年5月于德国波恩举行的AES4会议上的一个演示。1
    在这些幻灯片中，工程师给出了算法内部的大致框图。该图缺少许多重要细节，但为“黑盒”逆向工程算法提供了一个起点。团队使用了自己的DST标签，其功能与Speedpass标签相同，但他们能够指定自己的密钥，从而跟随已知的常量输入并将其与输出进行比较，并利用它来重建算法内部的缺失部分。从那里开始，他们还更改输入密钥的单个位，以查看输出发生了什么变化，从而了解更多细节。


    团队最终得到了算法的工作模型，以软件形式编写，可从提供给真实DST标签的已知输入提供相同的输出结果。这意味着他们已确认了已知密钥的工作模拟器。但对于未知密钥，比如Speedpass上的密钥呢？


    魔鬼在于任何算法的细节以及实现它的技术。RFID标签是非常低功耗的设备，并且由于DST标签由读卡器外部供电，它们用于执行复杂算法所需计算的功率非常有限，而大多数现代密码算法都是CPU密集型的。为了获得适合手头硬件的解决方案，TI工程师设计了自己的算法，而不是使用公开可信的算法。他们还选择了相对较小的40位密钥大小，以在标签上实现最佳安全性和最佳性能之间的平衡。这些决定绝不算错误；问题在于系统的安全性能在升级、更换或淘汰之前维持多久。在这种情况下，它在首次被公开攻破之前持续的时间不到10年。


    研究团队利用了这个弱密钥，应用了系统首次推出时不可用的计算能力。他们知道40位密钥提供了1,099,511,627,776种组合，这看起来很多，但对于计算机在合理的时间范围内计算来说完全在范围内。


    > NOTE

    > 当谈论密码学或密码学家时，“合理”一词可能与普通大众的含义大不相同。在密码学中，穷举搜索预计需要数十亿年，将其降低到几百年的方式已是相当了不起的成就，被认为更合理，尤其是当计算能力的进步可能进一步削减该值时。


    研究人员知道，他们只需使用自己的读卡器用已知挑战对其进行询问，即可捕获未知标签的样本输出。这样，他们就知道算法、挑战，并且可以观察响应。唯一剩下的因素是秘密的40位密钥。恢复该密钥（以便稍后复制）的最简单方法是捕获几次交互，然后测试每种可能的密钥，看看它是否在被测试的标签上给出相同的输入时得到相同的输出。


    团队发现标准3.8-GHz单核PC每秒可计算约200,000个密钥，这将花费一段时间才能完成穷举搜索（约64天）。为加快速度，他们使用现场可编程门阵列（FPGAs）和小型可编程处理器在硬件中实现了破解程序，这些处理器在执行单一任务时通常比通用CPU快得多。他们的实现允许在单个FPGA上每秒测试1600万个密钥，这将时间表缩短到约21小时。他们能够利用这一点恢复之前未知的Speedpass的密钥。然而，将工作负载分散到16张卡上，可以将时间缩短到约1小时（平均）。


    为了验证他们的工作并向德州仪器证明自己，团队要求TI提供五个密钥由TI选定并已知的标签。在2小时内，团队利用其并行破解设置恢复了所有提供标签的密钥，从而确认了其能力。


    将研究更进一步，团队应用了时间-空间权衡，并构建了一个“彩虹表”，其中包含预先计算的输入、输出和秘密密钥数组。大约10Gb的表可用于根据已知挑战的输出查找标签的密钥，将恢复密钥的时间减少到约一分钟，或与计算机搜索正确的挑战/响应一样快。

