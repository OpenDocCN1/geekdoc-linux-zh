    \ the system is doing is taking the unique identifier and granting or denying\
    \ access based on that identifier. This is where the problems creep in – it is\
    \ just granting or denying based on the identifier. There is no mechanism to verify\
    \ who is presenting the identifier.\n\nThere is an old saying within security\
    \ referring to authentication: “Something you have, something you know, something\
    \ you are.”b This describes the different general methods a person has to authenticate\
    \ to any security system, technological or not.\n\n“Something you have” is simply\
    \ a physical token that you must possess to gain access. The most common example\
    \ is a ticket to a concert. You only need to have the ticket to get in; they don’t\
    \ care who is holding the ticket, just that you have it. The computer equivalent\
    \ would be a hardware token like a smart card or a security certificate.\n\n“Something\
    \ you know” is simply a secret that only an authorized user would know. Most people\
    \ know this as a password. From the login password to your computer to a kid’s\
    \ clubhouse or secret handshake to identify membership in a club, it does not\
    \ matter who it is, as long as they know the password, handshake, dance, or whatever\
    \ is being used to authenticate.\n\n“Something you are” refers to biometrics.\
    \ While this can be as complex as fingerprints, or retinal scan, it can be as\
    \ simple as your friend, the club bouncer, recognizing your face and letting you\
    \ in. Some unique element of you as a person is being used to authenticate into\
    \ the system.\n\nGenerally within the security field, any system should integrate\
