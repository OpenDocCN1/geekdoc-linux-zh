    用户通常会坐在“放松区”里，在电脑上做谁知道什么的工作。有一段时间，用户开始注意到他们请求的网页上的图像与预期不符。请求 Google 首页会返回 Google，但主图像与预期不同。同一图像出现在多个用户在多个网站上的多个页面上。当然，鉴于
    Defcon 以及与会者倾向于的幼稚倾向，该图像是相当恐怖的。显然，用户期望看到 Google 的标志性标志却收到恐怖画面，导致一些真正困惑的用户和一些非常有趣的反应（我刚才提到过，“地球上最具敌意的网络”。他们期望什么呢？）


    各种用户开始检查 DNS 设置，检查是否连接到 rogue AP，或甚至启动数据包嗅探器来弄清发生了什么。除了肇事者之外，几乎没有人（如果有的话）在那个周末弄清楚发生了什么，直到肇事者后来宣布了这次相当搞笑的黑客攻击。一个名叫
    Toast 的家伙声称负责并发布了他编写的用于执行此操作的工具，名为 Airpwn。


    要理解正在被攻击的是什么，你必须理解事情正常时是如何运作的。当你请求一个网页时，你的系统会通过基本的 SYN/ACK 握手连接到远程服务器：


    ```

    Client -> Server "GET /foo.html HTTP/1.0" seqno 123 ack 456

    Server -> Client "<HTML...>" seqno 456 ack 145

    ```


    客户端浏览器发送对指定页面的 GET 请求，“GET /foo.html HTTP/1.0”，连同序列号（SEQNO）和前一个数据包的确认号（ACK）。服务器通常返回包含所请求超文本标记语言（HTML）页面的数据包，指定更高的
    SEQNO 和前一个数据包的 ACK。对页面上的每个文件（图像、Java Script 等）重复此过程。


    Airpwn 基于一个简单的原理运作，如下所示：在开放网络上，攻击者可以看到你的数据包通过空中，就像旧的共享介质（基于集线器）有线网络一样。正常网页服务器的请求往返需要一点时间。由于我们同处一室，我们通常可以比远程服务器更快地做出回复。


    攻击看起来是这样的：对文件的正常请求被发出，只是攻击者看到了它。然后他使用适当的 SEQNO 和 ACK 制作响应，伪造源 MAC 地址使其看起来来自接入点，就像合法响应一样，只是响应包含攻击者的内容。只要内容足够小，可以在真实数据包到达之前发送，攻击者就可以通过
    Finish（FIN）数据包关闭连接。原始请求现在将失序并被丢弃。浏览器将接受攻击者的内容并据此渲染，可能涉及对细腻感受的任何损害。在示例配置中，有几种不同的例子。图
    2.1 显示了简单的图像替换，其中图像被替换为“AIRPWNED”图形。图 2.2 显示了 HTML 的替换。

    '
