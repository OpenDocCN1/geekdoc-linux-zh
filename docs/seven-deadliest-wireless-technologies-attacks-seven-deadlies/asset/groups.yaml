    离开后，无线客户端及其所包含和所通信的信息对恶作剧者和窃贼同样具有诱惑力。


    ## 第三章：蓝牙攻击


    蓝牙是第三章的主题。这种常见的协议本意是取代线缆杂乱，但已变得远不止于此。虽然它适用于短距离，但任何距离对攻击者来说都可能是一种便利。现代设备携带大量信息，诱惑着新一代的数字扒手。你可能在不丢失任何东西的情况下失去一切。


    ## 第四章：射频识别攻击


    射频识别是一种大多数人甚至意识不到的技术，尽管每天使用数十亿个标签。作为第四章的主题，RFID 将从其 perceived benefits 实际上可能成为其最大漏洞的角度进行审视，以及它们如何被心怀不轨者所挫败。RFID
    无处不在，了解如何识别它以及如何保护它是一个非常重要但常被许多人忽视的主题。


    ## 第五章：模拟无线设备


    即使是最现代的无线设备，其核心往往仍然只是无线电。这些新设备通常使用古老的无线电技术来实现通信。第五章将向你展示如何识别这些设备，了解其使用相关的风险，以及超过
    100 年前就已显现的漏洞如何仍然存在，使生活变得有趣。


    ## 第六章：糟糕的加密


    无线安全问题的常见解决方案是添加加密。然而无线安全的常见问题却是糟糕的加密。不良的设计选择、硬件限制和成本都可能让一个好的安全想法以创纪录的速度变成失败。第六章通过多个现实案例审视这一问题，并展示本应保护通信的东西如何最终提供的保护少于宣传。


    ## 第七章：手机、PDA 及其他混合设备


    它们无处不在，无法逃避，但手机随处可见。今天的现代智能手机和其他手持小玩意本质上是各自独立的计算机，具有需要考虑的独特安全问题。第七章将审视这些新一代设备，以及它们的小尺寸、可移植性和通信能力如何使它们成为当今和未来的有趣且诱人的目标。


    ## 结论


    无线设备将继续存在，任何从事 IT 或只是日常生活的人几乎每天都会与无线设备互动。它们极不可能消失，随着时间的推移更有可能变得更加普遍和复杂。对在生活中部署和使用无线设备所涉及风险的坚定理解将帮助你抵御攻击，同时在最大限度降低风险的同时享受无线世界的全部好处。


    ## 802.11 无线 – 基础设施攻击


    ### 本章信息


    - 无线网络的工作原理

    - 案例研究：TJX 集团

    - 理解 WEP 破解

    - 如何破解 WEP

    - 情况变得更好也更糟

    - WPA 和 WPA2 简述

    - 如何破解 WPA PSK 和 WPA2 PSK


    无线这个词最近被频繁提及。一切似乎或多或少都是无线的，甚至一些从未预期会成为无线的东西，比如冰箱和其他家电。最常见的是，当谈到计算时，无线这个词指的是 802.11
    网络。


    几乎每台进入市场的全新笔记本电脑今天都内置了 802.11 网卡。这是一种已成为我们生活中无处不在的技术，我们几乎记不起它不在我们日常中的时候。这是一种在速度和范围上不断发展的技术，可提供从家庭或企业任何地方连接互联网的能力。


    这种广泛的技术从安全角度来看也很快成为一个相当大的问题。用户很快要求“剪断电缆”并能够从办公室任何地方访问网络。家用用户也迅速采用该技术在厨房、沙发上或（更奇怪的是）浴室工作。这种强烈的推动导致许多过度劳累、报酬不足的信息技术（IT）管理员和社区电脑通晓者安装无线网络，而没有充分理解所涉及的安全风险。这些早期网络会继续“正常工作”，用户没有意识到安全军备竞赛已经追上他们甚至超越了他们，使他们成为攻击的首要目标。


    2003 年 11 月，多伦多安大略省警方举行了新闻发布会，宣布一起（当时）新颖且不寻常的犯罪。ᴬ 警方报告指出，凌晨约 5:00，一名警官注意到一辆汽车缓慢地逆行在一片住宅区的单行道上。警官拦下了该车，当他走到司机面前时，迎来了几个令人不安的景象。司机首先没有穿裤子，这本身可能就令人不安，但更令人震惊的是，副驾驶座上有一台笔记本电脑，上面明显显示着儿童色情内容。司机一直在利用该地区的开放式无线网络获取互联网访问权限下载儿童色情内容，而网络所有者对此并不知情。所有者本身也是受害者，而且是两次。首先，他们是服务被盗的受害者，因为他们的通信必须与未经授权用户的流量竞争带宽。其次，他们成为受害者，因为从实质上讲，儿童色情内容是通过他们的连接下载的。任何留下的数字痕迹都会追溯到他们身上，可能使他们面临自己下载儿童色情内容的虚假指控，以及该指控可能带来的所有情感和经济损害。结果对嫌疑人的住所进行了搜查，查获了
    10 台电脑和超过 1,000 张 CD 的非法材料。ᴮ


    此案以及多年来的其他案件表明，未经任何客户端设备身份验证运行接入点（AP）是危险的。如果任何人都可以连接，就无法限制这些用户可以从事何种活动。通常，这只是为了查看电子邮件或了解最新新闻，但也可能是有人下载受版权保护的材料、发送威胁信息或做更糟的事情。


    有时，未经授权连接到开放网络甚至可能在某人没有意识到自己正在这样做的情况下发生。Windows XP 在 Service Pack 2 之前臭名昭著，因为它会自动连接到以前连接过的同名网络。一个携带笔记本电脑在街上行走、配置为常见网络名称如
    "linksys" 的人可能会漫无目的地连接到任何同样名为 "linksys" 的网络，并在不知情或未交互的情况下进行未经授权的访问。许多用户注意到这种行为，认为它在获取免费
    Wi-Fi 方面非常有帮助。攻击者也注意到了这一点并开始利用它（更多内容请参见第 2 章，802.11 无线 – 客户端攻击）。


    考虑到将你的 AP 对任何人开放连接是危险的提议令人遗憾。每个人在任何地方都能共享免费互联网访问的想法很诱人，但社会作为一个横截面包含各种各样的人，有些好有些坏，而坏人往往会让所有人失去这种自由。


    电气和电子工程师学会（IEEE）知道他们必须建立某种机制，以在通信广播时保持通信的隐私并限制谁可以连接以及从何处连接。这就是为什么所有出售的 AP 都包含各种保护通信和限制谁可以连接的方法。


