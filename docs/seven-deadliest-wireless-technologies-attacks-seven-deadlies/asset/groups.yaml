  - '[PAGE 56]


    problem for an attacker since the range is limited and your target pool is small.
    You also have to know what site they will visit, but if you’re in a situation
    where you want everything to resolve to a certain site (perhaps with extended
    browser exploits or other malware) or if you are at a conference or some event
    where you know attendees will likely be visiting a site for schedules or such,
    this could be very damaging. The other option would be not to spread malware,
    but disinformation. Imagine targeting a conference of bankers and rewriting all
    new sites DNS requests to show a fake news story about the economy melting down.
    The ensuing panic may be useful to an attacker, or at the very least, humorous
    to someone.


    Injection attacks are limited only by the attacker’s imagination. The potential
    damage can be either overt or subtle. The ability to inject and carry malware
    back to secure networks is probably the most troubling of these subtle attacks.


    Normal methods of preventing these attacks usually come down to "use a VPN."


    The problem with that method is that many public hotspots use a captive portal,
    which you need to enter login information before the VPN tunnel can be established.
    This necessitates connecting to the access point and the captive portal over an
    unencrypted link. Even if the captive portal is SSL enabled, accessing the login
    page is usually done through DNS redirection of any page you view in the browser
    to the domain of the captive portal. This is enough of a gap to inject content
    since the initial connection can be hijacked and the redirect ignored.


    Just as Karma was integrated with Metasploit in 2008, Airpwn is integrated into
    Metasploit as of late 2009. This means that Airpwn is now surrounded by a framework
    that will make it easy to build an inject content and also to utilize existing
    exploits to attack clients. The result of this will hopefully mean increased attention
    that using public hotspots or any unencrypted network could be a significant threat
    to secure networks long after the attacker has left.


    # SUMMARY


    While all this may seem depressing, it is the inevitable cost for the convenience
    of wireless. While indispensable to modern life, wireless networks are far from
    the mature technology of wired networks. It took many years to convince people
    to even hook up a basic firewall to separate them from the Internet; it is not
    unreasonable to think that it will be a while before things improve for wireless
    security. As with most things, when systems were locked down at the access point,
    attackers just switched focus and found another weakness.


    Attention to the dangers of using open networks is the first step in solving the
    problem. Usage of restrictive security policies preventing the use of insecure
    connections, while inconvenient, will help users protect them from themselves.
    As well, moving to more robust and intelligent client managers can also help alert
    users to the dangers and keep them from doing things that are blatantly dangerous.
    The last measure that is obvious but often not done is to turn off wireless and
    just use a wire when you can. It’s a lot harder to screw up a wired connection
    than it is to screw up wireless.'
  - '[PAGE 57]


    In short, the best methods for avoiding attacks on wireless clients are


    +   - Avoid using open access points at any time, particularly in public places.

    +   - If at all possible, opt for a wired connection.

    +   - If you are using a wired connection, disable your wireless adapter.

    +   - Have firewalls in place and set to only allow services that you need.

    +   - Avoid sending personal or financial information over wireless networks.

    +   - Consider a "disposable" laptop for travel, one that gets wiped and reinstalled
    before connecting back to the company network.

    +   - Always be wary that what you are connected to may not be what you think
    it is.


