    # DIGITAL VERSUS ANALOG


    Most people are used to analog communications without knowing it. We''ve used
    it for the past 100 years quite successfully. Analog transmission is where a piece
    of data, be it voice or anything else, is sent with a continuous signal that varies
    in amplitude or frequency, much like wave rolling onto the shore is a continuous
    action. Small changes in the signal are meaningful to the data being transmitted.


    Digital on the other hand is noncontinuous and uses discreet signaling to send
    data. Information is broken down into 1''s and 0''s and sent as discreet states.
    It''s as if the wave rolling onto the beach was out at sea, then the next moment
    it was on the beach, then right back out to sea.


    Analog has the advantage of more accurate representation of complex data such
    as sounds since it''s a smooth transition from high notes to low notes and accurately
    represents the changes in air pressure associated with sound. The problem with
    analog is that noise in the medium can interfere with the subtleties of the transmission
    and the received message is garbled (in the case of sound this is "static"). Digital
    transmissions break down data into a digital representation of the original encoded
    as 1''s and 0''s. It is not as accurate but is much more tolerant of noise in
    the transmission medium. This is why Morse code is so effective. It has two distinct
    and easy to recognize states: dots and dashes, effectively 0''s and 1''s.


    Most often, analog is used in short-range single channel type communications such
    as microphones and headsets since the circuitry is easier to make and the short
    range minimizes potential interference issues. The circuitry is also often cheaper
    than digital as well. Digital allows for more data to be sent in a smaller amount
    of the medium (that is, smaller bandwidth) since it only needs two distinct states
    to represent the data. This allows for more devices to operate in the same medium
    as opposed to analog.


    # Analog Security


    Analog radio is not that easy to secure. Unless you process the signal beforehand
    (encoding it or changing it to another form), it''s pretty easy for anyone to
    intercept the signal. Most people have heard stories about bored people using
    amateur radio gear to transmit their voice onto fast-food drive-through speakers.
    They overpower the employees'' signal and replace it with their own. Usually these
    pranks end up resulting in childish and crude humor laced with expletives and
    some very confused employees and angry customers.


    The most common way of securing data over analog is through methods like frequency
    hopping where the sender rapidly changes what frequency the message is being transmitted
    on and the receiver knows the order of these changes and can'
