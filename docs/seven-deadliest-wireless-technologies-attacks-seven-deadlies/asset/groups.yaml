  - '[PAGE 134]


    In the Android model, the user is the gatekeeper who can make decisions about
    security. In the iPhone model, Apple is the gatekeeper. All apps have to be submitted
    to Apple and pass through a screening process before they are added to the App
    Store. Apple checks the source for obvious things, such as a game accessing the
    microphone or call functions and other things that it should not be doing, but
    given that Apple receives about 10,000 applications and application update submissions
    a weekᴸ and has only 40 full-time reviewersᴹ the possibility of the process being
    overworked and missing something or for overzealousness and unnecessary denials
    happeningᴺ is real and has occurred. Android leaves it up to the user to decide.
    Offensive or unstable applications will simply be uninstalled by the user and
    even then, due to permissions, unstable or malicious applications will be unlikely
    to affect the core of the system and other applications.


    On the iPhone and other platforms, a program with malicious intent or one compromised
    in some way is capable of accessing data and resources from any program running
    under the same user. Once the program breaks out, there is no restriction other
    than Apple''s guidelines in the App Store agreement. This means that a compromised
    mail client can, in theory, access contact lists and issue SMSes, which in turn
    would cost the user money. The only thing stopping this is that Apple will not
    allow such an application to be approved and end up in the App Store.


    # Common Threats


    While Android and iPhones are fairly different in the model they use for application
    security, they share some fundamental similarities that make smartphones and hybrid
    devices as a whole market a much more interesting target for attackers than any
    one device or brand alone.


    A common argument against extra security for smartphones is that the amount of
    any single model or platform of phones in comparison to other targets is relatively
    small. An install base of a few million Android-based phones is not a very large
    target base when compared to the massive number of Windows-based internet connected
    PCs. A vulnerability exploited on Windows PCs has a much higher chance of mass
    success than just a few million smartphones, not all of which are on or connected.


    However, it is worth remembering that these phones are computers in their own
    right and as a whole represent a very large number of devices, even outselling
    laptops in the foreseeable future.ᴼ Put together, smartphones are a sizeable install
    base and as different as they seem, beneath the hood they share more than one
    would think.


    To save costs, increase developer adoption, and other factors, modern smartphones
    are now leveraging existing UNIX platforms instead of writing entirely new'
  - '[PAGE 135]


    OSes. Much of this includes open source tools and libraries. Despite their outward
    appearances, the iPhone, Android OS, and even the Palm Inc''s WebOS, which powers
    the Palm Pre, share a number of common programming underpinnings, which mean that
    there is potential for all devices to be vulnerable.


    One such underpinning is WebKit, the engine used by iPhone for the Safari browser
    and e-mail client; Android uses it in its browser and WebOS uses it heavily throughout
    the OS to render applications. This common engine is a fundamental part of all
    three of these new generation smartphones.


    This creates an interesting situation because, since the engine is used in the
    browsers in all three, there is the potential for an exploit to work on all three
    platforms, greatly increasing the target base and removing much of the need to
    tailor the attack for specific platforms. Usages common between the platforms
    as well make attacks easier. Tools like Google''s Gmail and other Web-based applications
    are very popular with mobile users and are also under considerable attack.


    An exploit in WebKit, like a cross-site scripting bug, could generate an iFrame
    and be used to upload the contents of these Google applications to the attackers
    server of choice on any platform. Since even with Android''s permission structure
    the browser needs access to the network, this sort of action would be allowed.
    Combined with large crowds like at a mall or conference and client attacks like
    using Airpwn to inject malicious scripts into traffic, an attacker can attack
    users across any platform, not just one.


    There are likely more commonalities between platforms than just WebKit, and attackers
    are notoriously creative in leveraging vulnerabilities. Should such vulnerability
    be found, they would certainly love to expand their potential attack base.


    # SUMMARY


    While the future rarely arrives exactly as predicted, some elements of it do make
    it to market. The advance of the mobile phone from simple communications device
    to hybrid mobile computing platform has been amazing to see in a fairly short
    period of time. The resulting drop in cost over the years, allowing everyone to
    own one, has changed our day-to-day behavior in ways most people never expected.


    The threats to and from these devices are a new challenge for society to adapt
    to. While manufacturers can build in security mechanisms to attempt to think ahead
    of attackers and cut them off at the pass, there are still a great many ways that
    things can go wrong. Technological development will not slow down in order for
    society to catch up. Consumers of these devices need to take more forward steps
    to understand the implications of the devices they use and how they can affect
    their daily lives.'
