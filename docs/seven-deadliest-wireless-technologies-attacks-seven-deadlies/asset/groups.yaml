    to the other way around). In their default state, most APs will accept connections
    from any client STA that asks to join the network. While this is convenient for
    users, it is also very convenient for anyone else who wants to connect, for good
    reasons or bad.


    In the early days of wireless, this was seen as something positive. Wireless brought
    out ideas of a brave new world with free Internet access and sharing of a new
    and useful resource. It didn’t take long for the bad guys to figure out that this
    was very useful for them as well.


    ### NOTE


    It’s hard to imagine a world without wireless networking. It’s absolutely everywhere.
    Since 2001, Wigle.net, an online repository of data submitted by users, has collected
    tens of millions of unique network locations with Global Positioning System (GPS)
    coordinates and over a billion points of observations of those networks. The site
    also includes some automatically generated maps of that data that can pretty conclusively
    show wherever there are people and computers, there are wireless networks. Figure
    1.1 shows Wigle.net’s map of North America.


    While this sort of activity may seem odd, companies like Skyhook Wireless (www.skyhookwireless.com)
    have made a business out of wardriving themselves. They map the location of networks
    throughout the world and use that information to provide GPS-like location sensing
    via triangulation of known APs as opposed to satellites, which has the added benefit
    of working indoors in many cases, unlike GPS.


    As you can see, there are wireless networks everywhere. Wherever there is a population
    center, you will be able to find wireless networks there.


    ![](img/fa764b70be0fdcb44b75286d4f8589e2_20_0.png)


    ### FIGURE 1.1


    Wigle.net''s Map of North America


    Wireless is a shared medium. If you remember the bad old days where Ethernet networks
    were all using hubs and not switches, everyone saw everyone else’s traffic. Well,
    wireless brings all the fun of those networks back. In those days, hubs were simple
    rebroadcasters, and they had no real intelligence as to what was connected to
    each port. A client would put a packet onto the wire and the hub would rebroadcast
    that packet to every other computer on the hub. The intended recipient accepts
    the packet, whereas the other simply ignores it. As you can imagine, having many
    clients on the network trying to communicate simultaneously and it gets pretty
    noisy. Network adapters normally filter out packets that come down the wire that
    are not intended for their address. If you disable that filter, you can now listen
    to all the packets, even the ones not intended for that network card. This is
    usually called *promiscuous mode* and has been a fundamental tool of network diagnosis
    since the beginning of networks.


    In a wireless network, promiscuous mode does the same thing if you are associated
    to a network. If you want to listen to other networks without associating or get
    the management traffic at Layers 1 and 2, then you need to remove the filters
    from Layers 1 and 2 and the logical separation of networks. This is where monitor
    mode comes in. Monitor mode is useful as it allows the card to listen to any wireless
    data, from any network on the same channel in range.


    An 802.11 network typically sends out advertising “beacon” frames to announce
    its presence. These frames contain the network BSSID (Media Access Control [MAC]
    address), ESSID (commonly known as SSID, the logical name for the network), and
    various flags about its capabilities (speed, encryption level, and so on). All
    this information is sent in clear text. Since it’s a shared medium, anyone can
    pick up these beacons and this basic information. This is the essence of wardriving.


    Much has been written about wardriving, but the best definition was coined on
    the netstumbler.org forums by a poster named blackwave:


    > Wardriving (v.) – The benign act of locating and logging wireless access points
    while in motion.¹


    Essentially, it is using a wireless-enabled device to search for others. This
    can be as simple as the Wireless Zero Config utility in Windows searching for
    a network to programs like Kismet, a full wireless detector and sniffer. Integrating
    a GPS into the system, and coordinates of those networks can be used to generate
    maps of local areas for reports, or submitted to sites like wigle.net to add to
    a larger community data pool.


    ## CASE STUDY: TJX CORPORATION


    In April 2007, U.S. retail giant TJX, owners of TJ Maxx, Marshalls, and other
    retail store brands, publicly admitted in their annual Securities and Exchange
    Commission filings that their network security had been breached and that customer
    credit card numbers and other information had been available to criminals roaming
    the network for over a year. The fallout for the company is expected to top 1
    billion dollars over 5 years and caused headaches for millions of consumers now
    open to identity theft and credit card fraud, as well as credit card companies
    and financial institutions having to pay millions to replace consumers'' credit
    cards. In May 2008, authorities arrested Albert Gonzalez in Miami, Florida, related
    to another large-scale identity theft. He was eventually charged as the ringleader
    in the TJX attacks and several other large corporate penetrations, and on August
    28, 2009, Gonzalez agreed to a plea bargain and stands to serve 15 to 25 years
    for his role. There are several other outstanding charges related to similar attacks
    on other corporations that, at the time of this writing, are still waiting to
    work their way through the courts.


    ### EPIC FAIL


    An interesting note about Gonzalez is that it appears he began the attacks on
    TJX while working as an informant for the U.S. Secret Service.


    Gonzalez was a member of the Shadowcrew, an online group that ran a Web site with
    over 4,000 members, devoted to the buying, selling, and trading of stolen credit
    card numbers. The group trafficked more than 1.5 million credit card numbers.
    When members of the group began to be arrested, Gonzalez turned informant and
    helped with the indictment of 19 other members of the Shadowcrew.


    As he worked for authorities, he apparently began a new crime spree under the
    noses of his FBI handlers. This included the TJX attacks. An obvious black eye
    for the agency, his ability to hide his activities for so long is a useful lesson
    to future investigators. His usage of remote computers and encryption should be
    viewed as a testament to the creativity of online criminals to hide their activities.


    While many details are not fully known, the seemingly biggest and most well-reported
    entry point was a St. Paul, Minnesota store''s wireless network. The indictment
    of Gonzalez and others indicates that Marshalls and TJX stores were penetrated
    through wireless networks in Miami from their own parking lots. The full extent
    may never be known, but it is clear that wireless networks were a component in
    these attacks.


    Using freely available software, the attackers identified the network and proceeded
    to crack the WEP key used to secure the network. This provided access to the store''s
    network and gave a foothold into the larger corporate network and all the data
