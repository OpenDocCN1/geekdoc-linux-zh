    This is a fairly common sight at most modern offices with employees simply waving
    cards in front of the readers that grant them access. You can usually see a small
    plastic box beside the door with one or more LEDs on it, though not always.


    These systems can work via active or passive tags. Most of the older systems have
    a thicker active card, about the thickness of two credit cards that contains a
    coil antenna, the RFID circuitry, and one or more coin cell batteries. Other systems
    operate on passive tags, powered by the reader, and are often the same thickness
    as a credit card. There is no standard package for a proximity card system; however,
    the “card” format is most popular and is often integrated with the employee’s
    ID badge as well.


    # Proximity Cards


    The use of an RFID proximity system has many advantages over previous methods.
    Since it is a contactless system (wireless), the card and the reader can both
    be sealed against the elements. This allows for exterior readers to put up with
    rain and dirt and not be damaged. It also means that neither the card nor the
    reader can ever really “wear out” through repeated uses.


    The most common and most basic use is through a simple numeric identifier. A card
    is presented to the reader and is queried. The card transmits its identification
    number, and the reader sends this to the back-end system. If the numeric identifier
    is allowed to enter that door, it sends back an approval message to the reader,
    which then opens the latch or door. If the presented numeric identifier is not
    allowed, nothing happens and the door stays shut. All of this takes place in a
    matter of moments and the user just has to wave their card in front of the reader
    to start the process.


    Proximity-card-based systems offer many enhancements to security over earlier
    traditional systems like guards and keys. The biggest of these is the use of unique
    identifiers. In a traditional key-based system, everyone with a key to a door
    had the same key. Short of a secondary method to verification, there was no way
    to tell which key opened the door. This caused issues since everyone with a key
    could point at everyone else and say they were the one who opened the lock. There
    was no way to leave an audit trail of who opened what and when with keys. With
    a proximity card system, each employee’s card has a unique identifier, which is
    tied to their name in the back-end system. This allows for discreet logging of
    a specific employee accesses and provides auditing, in case there are issues later.


    The use of unique identifiers also allows for a high degree of granularity of
    control over what a proximity card can have access to. Traditional keys posed
    the problem, that to have really granular control over access, separate keys had
    to be issued for each lock and properly distributed. This was a real headache
    to manage and keep organized and led to people often having more access than necessary
    since it was easier that way. A proximity card system allows for very granular
    control and can allow you to specify down to individual doors, if you so desired.'
