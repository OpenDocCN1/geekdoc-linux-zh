    \ JavaScript 来攻击安全 VPN 网络。\n\n通过不安全网络注入恶意代码的攻击者可以控制该脚本的缓存时长；攻击者可以强制其永久缓存。其结果是，下次访问该页面时，运行的是缓存版本的脚本，而不是来自远程服务器的版本。如果你对像\
    \ Twitter.com 或 Google.com 这样经常访问的站点这样做，该脚本理论上每天都会运行，无论客户端连接到哪个网络，甚至是安全的 VPN 或办公室的“安全”本地局域网。客户端设备即使只使用一次不安全网络，也足以对安全网络造成漏洞。\n\
