  mdcn: "\n![](img/fa764b70be0fdcb44b75286d4f8589e2_52_0.png)\n\n## 图 2.1\n\nAirpwn\
    \ 对 Google 的图像替换\n\n![](img/fa764b70be0fdcb44b75286d4f8589e2_52_1.png)\n\n## 图\
    \ 2.2\n\nAirpwn 替换 HTML\n\n其核心是一场竞赛。如果攻击者能够击败远程服务器，由于响应是预期的并且其 SEQNO 顺序正确，它会被盲目接受为合法内容并传递给浏览器。\n\
    \n它在 Defcon 首次亮相时，被视为一个有趣的派对小把戏，人们对它还能做什么有些兴趣，但像许多工具和攻击一样，它似乎从未发展起来。随着时间的推移，进行了一些更新以适应新技术和能力，但它在黑客社区中变得有些另类。它可用于展示内容替换和注入，但仅限于在会议上作为玩具，通过在空中数据中插入奇怪或令人困惑的图像来戏弄与会者的心智。\n\
    \nAirpwn 还展示了一种不常见的有趣漏洞。由于它注入的是预期内容，客户端系统上的软件防火墙会毫不犹豫地放行这些 rogue 数据。只要注入的数据不符合已知病毒或可检测的攻击模式，它就会静默通过防火墙到达浏览器，打开了许多滥用的可能性。\n\
    \n## 史诗级失败\n\nAirpwn 一直是很有用的工具，用来向用户强调使用不安全网络的风险。仅靠解释风险是不够的；向数据流中注入替代图像或 HTML\
    \ 并让其在他们自己的屏幕上显示，能更直观地表明他们正处于风险之中。这很有效，因为它不会造成任何永久性损害。进行这些演示的人在选择演示的时间和地点时需要谨慎。\n\
    \n2008 年，在多伦多的 SecTor（www.sector.ca）会议上，RenderMan 正在进行 Wi-Fi 安全诊所，演示各种攻击并帮助与会者在演示接入点上运行攻击。作为其中的一部分，展示了\
    \ Airpwn 注入数据。不幸的是，它在与会议网络同一频道上运行了数小时。Hackers for Charity（www.hackersforcharity.org/）的\
    \ Johnny Long 上前询问为什么网络行为异常。原来 Airpwn 正在注入额外的 HTML，导致 Johnny 无法为回程航班办理登机手续。尴尬的是，RenderMan\
    \ 必须终止 Airpwn 以便 Johnny 完成重要任务，这证实了凡事都有时间地点之分，并且不要忘记你留下了哪些工具在运行！\n\n## 史诗级失败\n\
    \n快进到 2009 年，Kismet 无线嗅探工具的作者 Dragorn 以及其他研究人员开始研究 Airpwn 以及传输控制协议流劫持（这是该攻击的正确名称）实际上能做什么。这一切始于希望替换不仅仅是图像，并能够即时替换\
    \ Flash 视频流。随着 YouTube 和其他基于 Flash 的视频网站的流行和普及，它们自然成为热门目标，人们希望用 “RickRoll” 或其他合适内容替换观看的任何视频。\n\
    \n> 注\n> \n> RickRoll 是一种互联网迷因，人们试图通过诱饵和调包手法 trick 别人观看 1987 年 Rick Astley 的音乐视频\
    \ “Never Gonna Give You Up”。通常是通过缩短链接或重定向进行的，并以指向其他内容的链接形式提供给受害者，最终却让他们到达 Rick\
    \ Astley 的视频，并由肇事者对其进行不可避免的嘲笑。\n> \n> 如果说 RickRolling 有一点好处，那就是其无害的性质和通常适合工作的内容。这种恶作剧很快取代了将受害者导向恐怖或令人震惊图像的做法，并且通常不会违反大多数网页内容过滤器。\n\
    \n初始测试显示，要替换活动流是不可行的，因为这些通常是用户数据报协议（无连接）传输。由于没有 ACK 可伪造，因此无法从服务器静默流以插入自己的内容。客户端会收到两组数据包，不知道该如何处理。最初，这似乎使准确替换内容几乎不可能。此时，在其他视频流上插入\
    \ RickRoll 似乎像是一个失落的梦想。\n\n然而，为了让视频流在浏览器中播放，页面上还有大量其他内容以明文传输，可以被替换并有助于此努力。最可能的目标是\
    \ JavaScript。\n\n## 替换 JavaScript\n\n今天大多数带有任何主动内容（Web 2.0）的网页都包含 JavaScript 来驱动页面并动态生成内容。像\
    \ YouTube 这样的网站推动了 Web 2.0 运动，但许多博客框架和其他用户生成内容网站也是如此，其中大部分都大量使用 JavaScript。\n\n\
    攻击向量发生了变化——与其注入整个视频（这不可行），我们替换页面上的部分 JavaScript，它体积更小、易于注入，并让它为我们完成所有艰难工作。在一次测试中，一个流行的博客\
    \ “failblog.org”，列出各种常识失败的图片和视频，被注入了 JavaScript，该脚本寻找所有指向 Flash 视频文件（.flv 文件）的链接并将其替换为\
    \ RickRoll 视频的链接。包含六个视频的页面被改成每个都显示 Rick Astley 视频。只有嵌入的视频被更改。在理想情况下对 YouTube 的进一步测试中，无论观看哪个视频，每个视频都会播放\
    \ RickRoll，而网站其余部分与预期的视频内容相比保持不变。最好的情况是，恶意 JavaScript 现在将每个 YouTube 视频链接到 RickRoll。最坏的情况是，它将其替换为不那么无害的内容。\n\
    \n替换视频的能力被认为很有趣，但从这一颇为轻浮的研究中开始出现一个更大的问题。JavaScript 可以附加到文件末尾而不是替换现有脚本。Airpwn 所需做的只是监视流量流中的\
    \ </BODY> HTML 标签并尝试击败下一个数据包，该数据包很可能是一个关闭连接的 FIN 数据包。如果 Airpwn 击败了 FIN，连接现在可以无限期保持打开，因为他们劫持了流，攻击者可以注入他或她想要的任何其他内容。\n\
    \n其影响是深远的。由于注入的数据被浏览器假定为来自远程服务器的合法流量，因此会被浏览器渲染。这具有完全控制页面内容以及直接与浏览器交互的优势。\n\n近期揭示了浏览器中大量漏洞。无法在此一一列举，但大多数漏洞公告遵循相同的剧本；如果能让受害者访问带有恶意代码的网页，代码就会运行并发生坏事。这种向量的最常见问题是让受害者访问恶意站点。这不再是问题，因为现在我们可以将恶意站点带给他们，将恶意代码注入他们正在访问的任何站点。此外，由于伪造的流量是“预期”的，防火墙几乎无法阻止它。\n\
    \n这种攻击向量还开启了一种有趣的新攻击向量，可能具有长期影响。2009 年，Robert Hansen（Rsnake）撰写了一篇论文，详细说明了由于常见内部地址空间使用和这些地址的冲突而导致的\
