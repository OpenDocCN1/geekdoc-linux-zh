  mdcn: "\n期望一个ASCII密钥会导致连接失败。更多情况下，这导致许多用户将接入点（AP）设置为最后已知的正常工作状态：无安全保护。\n\n为了解决这一烦恼，IEEE在规范中包含了详细指南，说明如何从更容易记住的密码短语生成十六进制密钥。WPA版本1和版本2在PSK模式下都使用由PBKDF2算法生成的256位十六进制密钥（而不是WEP最高128位）。\n\
    \nPBKDF2算法生成一个称为成对主密钥（PMK）的密钥，随后用于驱动四次握手，以对进入网络的客户端设备进行认证。\n\n该算法的基本原理如下：\n\n\
    PMK = (Passphrase + SSID + SSID Length),* 4096 SHA1 iterations\n\nPMK由用户提供的密码短语（8到63个字符）与网络的SSID（作为盐值）以及SSID长度拼接而成。然后经过4096次SHA1迭代计算，输出一个256位的值，这就是握手中使用的密钥。\n\
    \n这个系统的好处在于，用户只需记住一个简单的密码短语——其余部分都会自动生成，因为SSID已知，SSID长度也已知。再也不必记住那些又长又难看的十六进制字符串了。只要你知道密码短语和SSID，就可以在任何WPA客户端管理器中生成相同的十六进制密钥。\n\
    \n大约在WPA版本1发布时，安全社区注意到规范中一段有趣的陈述：\n\n> > 密码短语通常每字符具有约2.5比特的安全性，因此密码短语映射将一个n字节的密码转换为具有约2.5n\
    \ + 12比特安全性的密钥。因此，它提供的安全级别相对较低，由短密码生成的密钥容易遭受字典攻击。只有在无法使用更强形式的用户认证时，才建议使用密钥哈希。由少于约20个字符的密码短语生成的密钥不太可能阻止攻击。\n\
    \n这一陈述来自802.11i规范，表明任何少于20个字符的密码短语都被认为是弱的，因为更短的密码短语不够随机，可能遭受字典攻击。这促使罗伯特·莫斯科维茨（Robert\
    \ Moskowitz）为wifinetnews.com撰写了一篇文章，解释说由于攻击者知道所攻击网络的SSID和SSID长度，他们就已经掌握了用于组成密钥的几个部分，而密钥的全部安全性都依赖于良好的密码短语选择。从安全社区的角度来看，这并不是一个好前景。\n\
    \n文章还指出，密钥的生成方式毫无秘密可言，密钥的哈希版本会在站点（STA）和接入点（AP）之间传输，并且很容易被捕获。理论上，攻击者可以发动字典暴力攻击：将字典词插入PBKDF2算法，并运行4096次SHA1迭代。将得到的值与捕获到的哈希进行比较，如果匹配，攻击者就知道了明文密钥。\n\
    \n限制在于，可能的密码短语数量大得惊人。密码短语的长度可以是8到63个字符。密码短语的每个字符都有94种可选字符（ASCII字符32到126）——包括键盘上的所有大小写字母、数字和符号，因此可能性非常巨大。SHA1算法也非常消耗CPU资源，计算时间相对较长，因此要进行穷举搜索需要数千年甚至更长时间。\n\
    \n弱点出现的环节正是公式中不属于数学运算的一个元素：人为操作者。由于密钥由用户自行选择，他们往往会选择基于字典单词的、易于记忆的密码短语。这大大减少了攻击者需要搜索的密钥空间。如果攻击者知道将搜索范围限制在字典单词内，就可以将搜索范围限制在几十万个单词，而不是数万亿种可能的组合。真正的麻烦在于，这种攻击只要求攻击者能够获得四次握手，并且他们可以在离线状态下、远离目标的地方花大量时间遍历单词列表。\n\
    \n这一弱点最早由乔希·赖特（Josh Wright）在他的工具coWPAtty中实现。提供一份字典单词列表、你要攻击的网络的SSID，以及一个包含密钥哈希版本的捕获文件，coWPAtty就会遍历字典，对所有单词进行哈希计算，然后检查它们是否与捕获到的哈希匹配。如果匹配，你就得到了密码短语。\n\
    \n该程序的早期版本仅限于一路直接运行攻击，这意味着每次运行时都必须重新计算哈希。如果你在多个具有相同SSID的网络上测试密钥，这就会很烦人。由于重复计算多次，CPU算力被白白浪费。\n\
    \n在coWPAtty版本2发布后不久，一个名为“Wi-Fi教会”（Church of Wi-Fi）的无线研究小组启动了一个项目来加速这一过程。\n\n>\
    \ 注意\n> \n> 在密码哈希破解领域，有一个“彩虹表”的概念。它不是每次都对每个密码单独发起攻击并从头开始计算、每次都承担相应的CPU成本，而只是应用时间/空间权衡的概念，计算每一种可能的字符组合的哈希，并存储结果供以后查找。2005年，Shmoo集团（www.shmoo.com）向公众发布了他们的彩虹表，其中包含用于存储旧版Windows登录密码的LanMan哈希的所有可能密码。\n\
    > \n> 时间/空间权衡更难应用于WPA密码短语。由于SSID和SSID长度被作为种子引入密码短语哈希，这意味着密码短语“password”在SSID为“linksys”的网络上的哈希结果，将不同于在SSID为“default”的网络上的哈希结果。因此，要为所有网络生成所有可能密码短语的穷尽哈希列表，还必须为每个可能的SSID都生成一遍，这显然数量巨大，而且需要海量存储空间，简直需要数千TB甚至更多。\n\
    \nWi-Fi教会采用了另一种方法来加速这一过程。他们认为，如果你针对某个SSID运行过一次攻击，为什么不把生成的测试哈希列表存储下来，以便以后遇到相同SSID时再次使用呢？例如，如果你遇到SSID“wireless”，并针对其密钥运行字典攻击，即使没有成功，也保存输出结果；下次再遇到该SSID时，你就不必花费CPU时间对同一字典重新计算——只需查找之前的输出即可。\n\
    \n这一概念进一步扩展为：如果你知道目标的SSID（也就是说，你正在进行渗透测试），你可以花费数天、数周或数月时间为该SSID生成哈希查找表，以便在现场节省时间。你可以在计划测试前让几台备用机器全天候运行，从而在现场获得时间优势。此外，你还可以将这些表保存下来用于下一次测试。最终成果是在coWPAtty中添加了genpmk程序，无需捕获握手即可生成哈希查找表。\n\
    \n为了展示这一改进，Wi-Fi教会着手制作一套表，以尽可能提高恢复密钥的机会，而不是试图为所有可能的SSID构建所有可能密码短语的穷尽列表——后者在存储或合理时间内计算方面是绝对不可行的。他们的方法是在构建定向列表时运用一些心理学。你看，人们懒惰是可以预见的，他们倾向于选择容易记住的密码短语。此外，人们也会选择相当简单的SSID，或者干脆保留制造商默认值。\n\
    \n他们结合常见且已知使用的密码短语列表，以及wigle.net上排名前1000的SSID列表（该列表约占其数千万网络数据库的50%），为排名前1000的每个SSID计算了约120万个常见单词和密码短语的表，作为概念验证。如果你正在攻击或审计（可以说本质相同只是意图不同）一个配置了这些热门SSID之一的网络，就可以使用这些表：你可以快速查找，并将预哈希表与捕获到的哈希进行比较，比在现场进行CPU计算要快几个数量级。在一台奔腾3、700\
    \ MHz笔记本电脑上的测试显示，当时每秒能测试12个密钥，而仅从表中查找时每秒可测试18,000个密钥。\n\nWi-Fi教会的表通过churchofwifi.org上的BitTorrent链接免费分发，或者对于带宽受限的用户，可通过www.renderlab.net/projects/WPA-tables购买DVD。\n\
    \n在推进这一项目背后的想法时，offensive-security.com的人们（Backtrack可引导Linux安全发行版背后的团队）使用类似方法生成了500\
    \ GB的表。虽然他们从Wi-Fi教会的列表中删除了一些较为多余的SSID，但涵盖了所有非常常见的SSID。每个SSID的表为1.9 GB，使用包含4900万个单词的字典。显然，这有点难以分发，但可以通过BitTorrent在www.offensive-security.com/wpa-tables/获取。\n"
