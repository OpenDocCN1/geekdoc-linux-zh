  mdcn: "\n## 史诗级失败\n\n虽然支持蓝牙的手机在欧洲已十分常见，但在北美的采用率却较慢。早期的许多北美用户并不了解支持蓝牙的手机所具备的全部功能，因为他们从未真正使用过具备全部功能的设备。虽然这并非所有在售型号的代表，但许多销售蓝牙手机的北美移动运营商所售的手机都已禁用了部分功能。例如\
