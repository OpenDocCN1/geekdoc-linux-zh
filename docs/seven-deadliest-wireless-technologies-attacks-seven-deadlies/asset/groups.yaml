    Applying the attack, the team built the next logical thing, a tag simulator, using
    their software implementation of the tag to emulate a legitimate tag in the field
    and use it to make a purchase. The necessary equipment took up most of the back
    seat of the test vehicle, but they succeeded in obtaining a real tag''s secret
    key and then emulating it to commit a "fraudulent" purchase (the tag was owned
    by a researcher, so it wasn''t fraud, but an attacker would not be so discerning).
    The equipment size is just a matter of engineering to reduce to an easier, more
    portable size to allow for sneak attacks.


    The resulting fallout from this research was not mass fraud or a breakdown of
    the entire payment system. The team responsibly kept back details of the algorithm
    and did not make their implementations public. This made it harder for any attacker
    to copy their work but allowed them to prove that the research was correct. In
    addition, Exxon-Mobil was already beginning plans to phase out the older tags
    in favor of newer, more secure tags.


    The conclusion best drawn is that the air interface of the Speedpass allows an
    attacker access to the communications. The security of those communications depends
    entirely on the strength of the algorithm protecting it, and that what was considered
    secure one day, may not be secure the next day.


    ## ADVANCED WPA AND WPA2 CRACKING


    Chapter 1, 802.11 Wireless – Infrastructure Attacks focused on Wi-Fi infrastructure
    attacks and included weaknesses in Wi-Fi Protected Access (WPA) and WPA2. It is
    worth exploring the future of these attack vectors and the security that WPA Pre-Shared
    Key (WPA-PSK) and WPA2-PSK provide.


    Current attacks on WPA and WPA2 in PSK mode depend on the guess-ability (or entire
    lack) of the passphrase used. While an exhaustive search is still out of the realm
    of possibility, if an attacker can guess your passphrase or you use a very common
    one, there is a good chance that you may be compromised. All of this depends on
    the ability to choose a passphrase that is longer and more random than the ability
    of an attacker to muster enough computing power to end up testing that passphrase
    in a reasonable amount of time. The idea was that a sufficiently long and random
    passphrase was enough to thwart most attackers and that the SSID being used as
    a salt made those attacks even more difficult.


    In late 2009, Moxie Marlinspike launched wpacracker.com and the wireless world
    took notice of the availability of cheap processing power and its potential in
    password cracking. The service uses Amazon''s EC2 cloud computing service to allocate
    processing power for cheap as compared to actually building it yourself. For $35,
    the service will test a capture (in the same way coWPAtty does) for a single SSID
    against 135 million word dictionary and return results in about 20 min (no guarantee
    of a success though). There are also options for a dictionary in German, as well
    as an extended English dictionary. The final one-off option is all the dictionaries
    combined for a total of 520 million words against the target network.


    One can imagine that a determined attacker could probably muster more than $35
    to devote to having half billion words tested in a very small amount of time.


    The 802.11i standard allows for a minimum of 8 and a maximum of 64 characters
    with most users falling well below the 20-character mark. Chances are statistically
    significant that the passphrase for many potential targets is in that list and
    security could be compromised in less than an hour for less than a console video
    game.


    When you consider that attackers don’t even have to use the automated service,
    they could just operate their own virtual cracking machine in the cloud where
    money is the only limit or just hire or create a botnet to do something similar
    at their beck and call.


    This availability of cheap processing power should make anyone reconsider “good
    enough” in their security solutions. In the case of WPA-PSK and WPA2-PSK, the
    power available to an attacker should make one pause to think if they are capable
    of coming up with a suitable passphrase or if it’s time to evaluate other solutions
    like WPA2-Enterprise, which uses external authentication and is not subject to
    the same brute force attack vectors.


    ## SUMMARY


    While encryption is a solution to protect wireless communications, it’s not simply
    a matter of bolting it onto an existing product and calling it a day. The selection
    of algorithm, the implementation, and a reasonable expectation of the length of
    time something will last should be considered.


    Algorithms used should be publicly vetted and trusted by the cryptanalysis community.
    Any companies with proprietary or homemade algorithms, while they do work, should
    be considered with a grain of salt as you cannot independently confirm the security
    in place. It’s a matter of “trust us” from the developer.


    Even if a trusted algorithm is used, poor implementation can cause security to
    suffer greatly if the keys are easily discovered or guessed. As well, understanding
    what you are protecting can help you evaluate if the solution will protect your
    secrets for longer than they will be useful.


    Crypto is necessary in our daily lives to keep things private and secret. It’s
    also really hard to do right. Care should be taken to evaluate any products for
    their security implications, even those that seem to take it to heart.


    For any products that use encryption, there are several guidelines that you should
    keep in mind when evaluating their potential effectiveness:


    - Algorithms should be freely available for scrutiny and analysis.

    - Algorithms should have a history of withstanding rigorous attacks.

    - Anything secret, proprietary, or that contains “miracle” marketing claims should
    be treated with skepticism.

    - Assume that the attacker knows the algorithm. This should not help them in any
    meaningful way.

    - Acknowledge that any system can be broken with enough time and resources.

    - Scale those resources appropriately to the length of time something needs to
    remain secret.

    - Encryption should only be part of a larger system of security.


