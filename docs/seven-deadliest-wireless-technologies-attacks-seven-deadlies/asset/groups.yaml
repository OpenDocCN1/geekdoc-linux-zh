    \ -3 -b 00:16:B6:1C:91:91 ath1\n```\n\n上述命令指定 Aireplay-ng 应使用攻击编号 3，即 ARP 重放攻击，目标的\
    \ BSSID，以及用于监听和注入的接口。由于我们未指定 \"-h\" 或主机选项，它默认为使用本地接口 MAC 地址。为了获得更好的结果，如果可以，请指定已关联客户端的\
    \ MAC。注意某些网卡在监控模式下无法注入，可能需要特殊的驱动程序或准备。\n\n> NOTE\n> 无论出于何种原因，Aircrack-ng 开发人员决定对于某些攻击\
    \ \"-a\" 是指定目标 BSSID 的开关，对于其他攻击则是 \"-b\"。如果你使用错误的一个，Aireplay-ng 足够智能，会提醒你应使用哪一个。\n\
    \nAireplay-ng 将在接口上监听 ARP 数据包。ARP 数据包具有特定的大小（68 或 86 字节），即使加密后也十分突出。一旦捕获到一个，它会将其重新传输回\
    \ AP 导致 AP 回复另一个使用不同 IV 加密的 ARP，而 Aireplay-ng 将开始计数 ARP 数据包，如图 1.4 所示。这将开始产生大量数据以供破解。\n\
