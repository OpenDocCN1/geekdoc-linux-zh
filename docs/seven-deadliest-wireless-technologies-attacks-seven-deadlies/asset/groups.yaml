    # SUMMARY


    RFID is a tricky technology to secure. It is wireless, and as such, communications
    can be read at a distance and captured. Due to their small size, the options for
    encryption are limited and often rolled by the manufacturer themselves instead
    of peer-reviewed algorithms, which can lead to them being defeated with ease.


    In the end, any system based on RFID should ask the following questions from the
    beginning: "What do we do if this fails?" "If a tag is cloned, what will the effect
    be?" "Is there another layer of protection that will minimize the impact if this
    occurs?" "What is the organizational structure around the use?" "Is it possible
    to audit its use and monitor for irregularities?" All are tough questions that
    must be answered.


    RFID is a young technology, and developers and society are still adapting to what
    it all means. There is no simple solution and it is up to the integrator/user
    of the system to actively think about what the system’s authentication scheme
    means in a grand sense. Simple authentication with a card may be good at limiting
    access to the front door of a building from the general public, but perhaps not
    the crown jewels. RFID-enabled credit cards may seem convenient, but one must
    weigh the convenience of this against the possibility of a drive by skimming of
    the credit card details. In that particular case (1 factor), physically swiping
    the card and requiring a signature is a better (2 factor) and more secure solution
    to keeping your credit card safe.


