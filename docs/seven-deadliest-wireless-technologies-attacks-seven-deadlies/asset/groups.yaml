    ## 攻击


    2009年11月初，新闻网站和科技博客⁵纷纷热议一起针对苹果 iPhone 的攻击事件。数名荷兰越狱 iPhone 用户报告称其设备遭到攻击，锁屏壁纸上留下一条不祥的提示，指示访问某个网站以了解如何保护设备。该网站要求支付五欧元才能获得保护手机的说明。消息曝光后，攻击者迅速撤除了付款要求，并发布了保护手机的说明以及对受攻击用户的道歉。正如猜测的那样，他主要利用的是越狱手机上的默认
    root 密码。这是该漏洞能力的首次公开演示，但肯定不是它首次被暗中滥用。


    11月晚些时候，澳大利亚⁶也出现了另一起 iPhone 攻击，利用了相同的攻击向量。不同的是，这次攻击是自动化的，可以通过易受攻击设备共享的 Wi-Fi 网络在手机之间自动传播。该蠕虫被称为
    Ikee，是 21 岁学生 Ashley Towns 的创意。该蠕虫通过默认 SSH 密码感染越狱 iPhone，但这次将背景图片改为 Rick Astley，并将铃声改为著名
    RickRoll 歌曲《Never Gonna Give You Up》。随后，蠕虫会尝试将自身上传并对感染设备连接的网络上的其他手机做同样的事情。报告仅显示感染的手机在
    100 台或以下，但考虑到越狱 iPhone 的比例很小，这一数字很有意思。虽然尚不清楚荷兰勒索事件是否启发了 Ikee 蠕虫，但它确实让其作者引起了 iPhone
    应用开发商 Mogeneration 的注意，该公司在得知他的蠕虫后，经过面试流程聘用了 Towns 作为开发者。他们声称这并非因为蠕虫，而是他像任何其他员工一样，以优异成绩通过了他们的
    iPhone 开发者测试。是否聘用他是对负面行为的奖励并树立危险先例，存在很大争议。⁶有人认为这是对负面行为的正向强化，如果有奖励的暗示，其他人会试图模仿这种行为以期获得奖励。最终结果可能是大量人试图为
    iPhone 或其他设备编写蠕虫以期获得工作。有人认为这就像让狐狸看守鸡舍，聘用


    > 备注

    > 尚不清楚该蠕虫是否可以通过 3G 连接传播。许多运营商在向互联网展示设备的方式上存在差异。许多 3G 网关提供商会对无线设备使用的 IP 空间实施严格的防火墙入站连接。他们还可能禁止客户端之间的通信。虽然这阻止了一些攻击向量，但某些提供商可能没有那么严格，允许传播此类恶意软件所需的连接类型。很大程度上取决于设备所连接的运营商的基础设施，并且会因提供商而异。


    最优秀的人才。 这绝对不是一个很快就会结束的争论，甚至可能永远无法解决。


    这两次攻击相当良性，对被攻击设备几乎没有造成损害。然而，它们确实向世界表明，有大量越狱设备很容易被攻破。它还表明用户群体对这些混合设备风险的认识相当不足。


    在前两次攻击后不久，第三个蠕虫出现了，这次具有明确的恶意意图。在荷兰，一个绰号为“Duh”的蠕虫开始传播到具有默认 root 密码的越狱 iPhone，企图窃取银行信息。该蠕虫会建立一个僵尸网络，其中驻留在手机上的僵尸程序会等待来自
    ING 银行的短信和移动交易验证码（mTANs），即发送给网上银行用户的六位数验证码，用户必须在短时间内输入以完成交易。这是一种离线身份验证系统，用于验证账户所有者是否在访问账户。该系统失效，因为短信接收在本质上与访问网上银行门户的同一台计算机上，从而抵消了离线部分及其所暗示的安全性。僵尸程序拦截
    mTAN 短信并将其发送到远程系统，攻击者在其中有短暂的机会窗口，可以在合法用户之前登录并获取其资金。虽然传播范围不大，但任何成功的攻击很可能都会获得足够的资金，使攻击者的努力物有所值，并可能激发未来类似的攻击。


    ## 未来攻击


    攻击的未来绝不局限于 RickRolling 和银行欺诈。这些设备作为其他攻击向量的潜力巨大。安全领域唯一不变的是威胁持续存在且常常出人意料。智能手机和混合设备非常多功能，人们不断想出以令人惊讶的方式应用这些优势的新方法。


    Twitter 创始人 Jack Dorsey 创办了一家名为 Square 的新公司（www.squareup.com）。该公司希望成为移动信用卡支付系统的主要参与者。该公司正在开发一种小型信用卡读卡器，可插入智能手机（如
    iPhone）的音频输入插孔，允许任何人无需传统信用卡授权系统的成本和负担即可接受信用卡付款。


    Motorola 也以其移动支付模块进入该领域（www.motorola.com/Business/US-EN/Business+Product+and+Services/Accessories/Mobile+Computer+Accessories/Snap-ons/Mobile+Payment+Device/Mobile_Payment_Device_US-EN），该模块可夹在运行
    Windows Mobile 的智能手机底部，以便在任何地方接受和处理付款。使用现有的通用设备降低了设备相关的成本。


    虽然这些项目仍处于早期阶段，但这确实引发了一些关于混合设备安全的有趣思考。由于这些设备现在接受信用卡，它们对攻击者来说更具吸引力和价值。攻击者不再只能窃取通讯录和电子邮件——他或她可能能够从这些手持设备中批量获取信用卡信息。


    技术仍在不断发展，但 Square 等公司在一定程度上利用了 iPhone 的普及性和其界面。信用卡是通过手机手动输入或通过连接到手机的读卡器输入的。交易通过
    3G 或 Wi-Fi 路由进行实时授权。虽然这似乎很方便，因为你现在可以在任何地方处理信用卡，但它也为攻击者提供了有趣的角度。iPhone 很容易被像 Karma
    这样的工具诱导连接到 Wi-Fi 网络，并且鉴于它们更倾向于自动连接到已知网络，这将覆盖 3G 连接。只需通过替代回程进行少量网络路由，所有的流量就会通过攻击者路由。将其与安全套接层现有的弱点以及用户处理错误信息的方式结合起来，攻击者就有相当大的机会记录所有交易。iPhone
    的封闭性也在此场景中造成问题，因为应用程序供应商无法“窥探引擎盖下”并对设备进行调整以进一步保护它。


    这仍然是一个理论情况，因为尚未注意到（或至少未被注意到）通过此或其他方法进行的大规模攻击。尽管如此，并没有什么能阻止新漏洞、与手机相关的缓慢修补周期以及机会的“完美风暴”造成一次非常大且有利可图的攻击。


    ## 混合设备的进攻性用途


    对于通过此类移动支付系统付款的人来说，也几乎无法保证设备没有以某种方式被篡改。也许一个不诚实的员工越狱了设备并篡改了设备，使其将交易的第二份副本发送到他或她的个人电子邮件。同样，Ikee
    和 Duh 蠕虫利用越狱权限在未经用户许可的情况下更改系统文件；同样的权限也可能被用户用来篡改系统并在不知情的情况下损害他人。


    另一个鲜少被考虑的角度是使用混合设备作为攻击工具，而非作为攻击目标。带着笔记本电脑和一堆其他设备进入目标地点可能会相当可疑，并引起攻击者不必要的注意，但带着
    iPhone 进入并在屏幕上轻点则极不可能被视为可疑。


    在 2008 年的 Defcon 16 上，Errata Security 的 David Maynor 和 Robert Graham 发表了题为《Bringing
    Sexy Back: Breaking in with Style》的演讲，其中描述了他们在渗透测试期间创造性地入侵公司的多种方法。


    作为演讲的一部分，这对搭档讨论了使用 iPhone 作为特洛伊木马进入设施并评估其内部无线基础设施。受启发

    '
