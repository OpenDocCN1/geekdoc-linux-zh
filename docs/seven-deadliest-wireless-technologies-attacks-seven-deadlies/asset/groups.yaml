    ## 问题的核心


    在有线网络时代，许多攻击都需要攻击者设法将自己置于受害者与正在通信的系统之间以便进行监控。至少，攻击者必须找到办法让自己接入本地 LAN 的一端或另一端。早期在基于集线器的网络中，攻击者可以看到线路上的所有内容；后来，在交换式网络中，则需要像
    ARP 欺骗网关之类的中间步骤才能将流量重定向通过攻击者。这通常被称为 MitM 攻击，因为攻击者冒充对话中的双方参与者，可以按其意愿监控或操纵对话。有了物理限制，你就可以限制攻击者对电缆网络的访问，因为他或她在物理上必须插上网线或对本地
    LAN 中的设备拥有远程控制权。


    对于无线网络，这一障碍就降低了，因为正如你所见，让客户端将所有流量都通过你进行路由非常容易。鉴于 SSL 的最新漏洞，即使加密网页或使用虚拟专用网络（VPN）也可以使用像
    sslsniff 这样的工具（www.thoughtcrime.org/software/ssl sniff/）来击败。在这种情况下最糟糕的情况是用户根本没有打算使用
    Wi-Fi。


    通常用户会自以为聪明，利用非 Wi-Fi 连接来接入互联网或 VPN 回到办公室。一些酒店很容易获得 3G 调制解调器和有线网络连接，使得这种情况很现实。虽然这是解决
    Wi-Fi 问题的一个不错的方案，但在使用其他网络连接时，用户往往不会禁用无线适配器。


    Windows 和其他操作系统通常足够智能，当存在多个网络连接时，只会使用最后、最最近使用的网络，或者至少使用最后连接的网关。出于各种原因，一些系统的网络接口会被桥接在一起（例如
    Windows Internet 连接共享功能）。这可能导致一种有趣的情况，即客户端实际上成为其他网络连接的接入点和网关。如果其中包括 VPN 连接，攻击者就会直接被路由进入企业网络（或互联网），这对企业安全造成明显问题。


