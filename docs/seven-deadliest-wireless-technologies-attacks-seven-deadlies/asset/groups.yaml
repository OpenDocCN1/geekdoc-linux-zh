    card and a password. “Something you are” and “something you know” could be a fingerprint
    scan along with a password. Any system should be built with at least two of these
    things (optimally, all three) required to authenticate to the system. This better
    prevents an attack on the system.


    The corollary to the above saying is “Something I lost, something I forgot, something
    I was.”C This emphasizes the failings of each of the individual authentication
    methods given above and highlights why they should be used in concert.


    “Something I lost” is fairly obvious. If a user is issued a physical device to
    authenticate, he or she can lose it. Losing a key is the most obvious form of
    this that we’ve all dealt with. In the case of a proximity card system, a card
    can be lost or it could be stolen. As an attacker obtaining the card grants you
    access simply by possessing the card, same as if you beat up someone in the concert
    parking lot and took their ticket.


    “Something I forgot” should be very obvious to anyone who has ever worked technical
    support. Users will forget things. Passwords, handshakes – all can be forgotten
    and grind access to a halt. The subtext of this is that passwords can be divulged,
    sometimes innocently shared, written on a sticky note, or just guessed. Other
    times, they can be “discovered” through coercion, blackmail, extortion, or torture.
    Again, if you know the password and that is the only authentication method, then
    there is nothing stopping you once you know the password.


    “Something I was” is something many people don’t think about as much. This concept
    is a bit more of a gray area than the others. If your authentication method involves
    a biometric, it is hard to lose or forget your fingerprint or retina, but it also
    comes with new considerations. What about injury? If a fingerprint biometric is
    used, what if someone injures that finger or loses a whole hand? Are other fingers
    or biometrics enrolled? From an attacker’s perspective, this one is harder since
    it requires physical access to the person they are trying to authenticate as.
    You might try to coerce the user to authenticate for you. You may try to forge
    or copy the biometric such as lifting a fingerprint and making a fake hand. It
    may also mean the more drastic step of amputation of a hand or finger to bypass
    a fingerprint system.


    **WARNING**


    An attacker removing a digit to authenticate as someone has happened. In Malaysia,
    in 2005, an accountant was car-jacked for his Mercedes S-class car. The car was
    outfitted with a fingerprint lockout device, enabling only the owner to start
    the car. After carrying around the owner in the trunk for a while to restart the
    car when needed, the thieves became frustrated and relieved the owner of part
    of his finger before dumping him on the side of the road (http://news.bbc.co.uk/2/hi/asia-pacific/4396831.stm).
    In any system, a determined attacker will find a way to bypass or defeat a security
    system, up to and apparently including amputation.'
  md: "\nThis is a fairly common sight at most modern offices with employees simply\
    \ waving cards in front of the readers that grant them access. You can usually\
    \ see a small plastic box beside the door with one or more LEDs on it, though\
    \ not always.\n\nThese systems can work via active or passive tags. Most of the\
    \ older systems have a thicker active card, about the thickness of two credit\
    \ cards that contains a coil antenna, the RFID circuitry, and one or more coin\
    \ cell batteries. Other systems operate on passive tags, powered by the reader,\
    \ and are often the same thickness as a credit card. There is no standard package\
    \ for a proximity card system; however, the “card” format is most popular and\
    \ is often integrated with the employee’s ID badge as well.\n\n## Proximity Cards\n\
    \nThe use of an RFID proximity system has many advantages over previous methods.\
    \ Since it is a contactless system (wireless), the card and the reader can both\
    \ be sealed against the elements. This allows for exterior readers to put up with\
    \ rain and dirt and not be damaged. It also means that neither the card nor the\
    \ reader can ever really “wear out” through repeated uses.\n\nThe most common\
    \ and most basic use is through a simple numeric identifier. A card is presented\
    \ to the reader and is queried. The card transmits its identification number,\
    \ and the reader sends this to the back-end system. If the numeric identifier\
    \ is allowed to enter that door, it sends back an approval message to the reader,\
    \ which then opens the latch or door. If the presented numeric identifier is not\
    \ allowed, nothing happens and the door stays shut. All of this takes place in\
    \ a matter of moments and the user just has to wave their card in front of the\
    \ reader to start the process.\n\nProximity-card-based systems offer many enhancements\
    \ to security over earlier traditional systems like guards and keys. The biggest\
    \ of these is the use of unique identifiers. In a traditional key-based system,\
    \ everyone with a key to a door had the same key. Short of a secondary method\
    \ for verification, there was no way to tell which key opened the door. This caused\
    \ issues since everyone with a key could point at everyone else and say they were\
    \ the one who opened the lock. There was no way to leave an audit trail of who\
    \ opened what and when with keys. With a proximity card system, each employee’s\
    \ card has a unique identifier, which is tied to their name in the back-end system.\
    \ This allows for discreet logging of a specific employee accesses and provides\
    \ auditing, in case there are issues later.\n\nThe use of unique identifiers also\
    \ allows for a high degree of granularity of control over what a proximity card\
    \ can have access to. Traditional keys posed the problem, that to have really\
    \ granular control over access, separate keys had to be issued for each lock and\
    \ properly distributed. This was a real headache to manage and keep organized\
    \ and led to people often having more access than necessary since it was easier\
    \ that way. A proximity card system allows for very granular control and can allow\
    \ you to specify down to individual doors, if you so desired.\n\nIf a card has\
    \ been copied. If an employee loses a card, it is also easy to simply deactivate\
    \ the old one and issue a new one and apply the same rights as the old one. A\
    \ lost key in the mechanical lock system meant that locks would have to be repinned\
    \ and new keys made and distributed.\n\nDepending on the system, the cards can\
    \ activate more than just doors. Machinery, cabinets, dispensers, vending machines,\
    \ and even computer logins can be integrated with the system to allow a single\
    \ card to perform many different functions.\n\n## Physical Access Control Failures\n\
    \nFor a moment, it's worth looking at the concept of authentication since that\
    \ is what this system is all about and where its failures lie. All the system\
    \ is doing is taking the unique identifier and granting or denying access based\
    \ on that identifier. This is where the problems creep in – it is just granting\
    \ or denying based on the identifier. There is no mechanism to verify who is presenting\
    \ the identifier.\n\nThere is an old saying within security referring to authentication:\
    \ “Something you have, something you know, something you are.”b This describes\
    \ the different general methods a person has to authenticate to any security system,\
    \ technological or not.\n\n“Something you have” is simply a physical token that\
    \ you must possess to gain access. The most common example is a ticket to a concert.\
    \ You only need to have the ticket to get in; they don’t care who is holding the\
    \ ticket, just that you have it. The computer equivalent would be a hardware token\
    \ like a smart card or a security certificate.\n\n“Something you know” is simply\
    \ a secret that only an authorized user would know. Most people know this as a\
    \ password. From the login password to your computer to a kid’s clubhouse or secret\
    \ handshake to identify membership in a club, it does not matter who it is, as\
    \ long as they know the password, handshake, dance, or whatever is being used\
    \ to authenticate.\n\n“Something you are” refers to biometrics. While this can\
    \ be as complex as fingerprints, or retinal scan, it can be as simple as your\
    \ friend, the club bouncer, recognizing your face and letting you in. Some unique\
    \ element of you as a person is being used to authenticate into the system.\n\n\
    Generally within the security field, any system should integrate at least two\
    \ of these things. “Something you have” and “something you know” could be a smart\
    \ card and a password. “Something you are” and “something you know” could be a\
    \ fingerprint scan along with a password. Any system should be built with at least\
    \ two of these things (optimally, all three) required to authenticate to the system.\
    \ This better prevents an attack on the system.\n\n> NOTE\n> \n> A special note\
    \ should be made that while a traditional key is definitely “something you have”,\
    \ if more than one user has the same key, there is little point in using it as\
    \ a security token. The logic of “Something you have” and of all parts of the\
    \ authentication triangle is that every identifier is unique and thus can be traced\
    \ back to a specific user, ensuring nonrepudiation. A common key among users means\
    \ that now only one factor (a password, or biometric) is all that is left to authenticate.\n\
    \nThe corollary to the above saying is “Something I lost, something I forgot,\
    \ something I was.”C This emphasizes the failings of each of the individual authentication\
    \ methods given above and highlights why they should be used in concert.\n\n“Something\
    \ I lost” is fairly obvious. If a user is issued a physical device to authenticate,\
    \ he or she can lose it. Losing a key is the most obvious form of this that we’ve\
    \ all dealt with. In the case of a proximity card system, a card can be lost or\
    \ it could be stolen. As an attacker obtaining the card grants you access simply\
    \ by possessing the card, same as if you beat up someone in the concert parking\
    \ lot and took their ticket.\n\n“Something I forgot” should be very obvious to\
    \ anyone who has ever worked technical support. Users will forget things. Passwords,\
    \ handshakes – all can be forgotten and grind access to a halt. The subtext of\
    \ this is that passwords can be divulged, sometimes innocently shared, written\
    \ on a sticky note, or just guessed. Other times, they can be “discovered” through\
    \ coercion, blackmail, extortion, or torture. Again, if you know the password\
    \ and that is the only authentication method, then there is nothing stopping you\
    \ once you know the password.\n\n“Something I was” is something many people don’t\
    \ think about as much. This concept is a bit more of a gray area than the others.\
    \ If your authentication method involves a biometric, it is hard to lose or forget\
    \ your fingerprint or retina, but it also comes with new considerations. What\
    \ about injury? If a fingerprint biometric is used, what if someone injures that\
    \ finger or loses a whole hand? Are other fingers or biometrics enrolled? From\
    \ an attacker’s perspective, this one is harder since it requires physical access\
    \ to the person they are trying to authenticate as. You might try to coerce the\
    \ user to authenticate for you. You may try to forge or copy the biometric such\
    \ as lifting a fingerprint and making a fake hand. It may also mean the more drastic\
    \ step of amputation of a hand or finger to bypass a fingerprint system.\n\n**WARNING**\n\
    \nAn attacker removing a digit to authenticate as someone has happened. In Malaysia,\
    \ in 2005, an accountant was car-jacked for his Mercedes S-class car. The car\
    \ was outfitted with a fingerprint lockout device, enabling only the owner to\
    \ start the car. After carrying around the owner in the trunk for a while to restart\
    \ the car when needed, the thieves became frustrated and relieved the owner of\
    \ part of his finger before dumping him on the side of the road (http://news.bbc.co.uk/2/hi/asia-pacific/4396831.stm).\
    \ In any system, a determined attacker will find a way to bypass or defeat a security\
    \ system, up to and apparently including amputation.\n"
  mdcn: "\n这在大多数现代办公场所都是相当常见的景象，员工只需将卡片在授予他们进入权限的读卡器前一挥即可。通常你可以在门边看到一个带有一个或多个LED灯的小塑料盒，尽管并非总是如此。\n\
    \n这些系统可通过有源或无源标签工作。大多数较旧的系统使用较厚的有源卡，厚度约为两张信用卡，内含线圈天线、RFID电路以及一个或多个纽扣电池。其他系统则使用由读卡器供电的无源标签，通常与信用卡厚度相同。近距离卡系统没有标准封装；然而，“卡”格式最受欢迎，并且通常也与员工的身份徽章集成在一起。\n\
    \n## 近距离卡\n\n与之前的方法相比，使用RFID近距离系统具有许多优势。由于它是一种非接触式系统（无线），卡片和读卡器都可以密封以抵御外界环境。这使得室外读卡器能够经受雨水和污垢而不受损坏。这也意味着卡片和读卡器都不会因反复使用而真正“磨损”。\n\
    \n最常见也是最基本的使用方式是通过简单的数字标识符。卡片被呈现在读卡器前并被查询。卡片传输其识别号码，读卡器将此号码发送到后端系统。如果该数字标识符被允许进入该门，后端会向读卡器发送批准消息，读卡器随后打开锁舌或门。如果所呈现的数字标识符不被允许，则什么也不会发生，门保持关闭。所有这些过程都在短短几秒钟内完成，用户只需将卡片在读卡器前一挥即可启动流程。\n\
    \n基于近距离卡的系统相比早期传统的保安和钥匙系统提供了许多安全增强功能。其中最大的一项是使用唯一标识符。在传统的基于钥匙的系统中，拥有某扇门钥匙的每个人都使用同一把钥匙。除了二次验证方法外，没有办法判断是哪把钥匙打开了门。这导致了问题，因为拥有钥匙的每个人都可以指着别人说自己是打开锁的人。用钥匙无法留下谁在何时打开了什么的审计轨迹。而在近距离卡系统中，每位员工的卡片都有唯一的标识符，该标识符在后端系统中与其姓名关联。这允许对特定员工的访问进行详细记录并提供审计，以防日后出现问题。\n\
    \n使用唯一标识符还允许对近距离卡的访问权限进行高度精细的控制。传统钥匙存在一个问题：要实现真正精细的访问控制，必须为每把锁发放单独的钥匙并妥善分发。这在管理和组织上是个真正的麻烦，并导致人们往往拥有不必要的更多访问权限，因为那样更简单。近距离卡系统允许非常精细的控制，可以让你指定到单个门，如果你愿意的话。\n\
    \n如果卡片被复制。如果员工丢失卡片，只需将其旧卡停用并发放新卡，并赋予与旧卡相同的权限即可。而在机械锁系统中，丢失钥匙意味着锁芯必须重新配置，并制作和分发新钥匙。\n\
    \n根据系统不同，卡片可以激活的不仅仅是门。机器、柜子、分发器、自动售货机，甚至计算机登录都可以与系统集成，使一张卡能够执行多种不同的功能。\n\n## 物理访问控制故障\n\
    \n值得花一点时间来看一下身份验证的概念，因为这正是该系统的核心所在，也是其故障所在。系统所做的一切只是获取唯一标识符并基于该标识符授予或拒绝访问。这就是问题潜入的地方——它只是基于标识符授予或拒绝访问。没有任何机制来验证是谁在出示该标识符。\n\
    \n在安全领域中，有一句关于身份验证的老话：“你所拥有的，你所知道的，你所是的。”b 这描述了个人用于向任何安全系统（无论是技术性的还是非技术性的）进行身份验证的各种通用方法。\n\
    \n“你所拥有的”仅仅是一个你必须拥有的物理令牌才能获得访问权限。最常见的例子是音乐会门票。你只需要持有门票即可入场；他们不在乎是谁持有门票，只在乎你有它。计算机等价物是硬件令牌，如智能卡或安全证书。\n\
    \n“你所知道的”仅仅是一个只有授权用户才知道的秘密。大多数人称之为密码。从登录你电脑的密码到小孩的俱乐部或用于识别俱乐部成员身份的秘密握手，都无关紧要是谁，只要他们知道密码、握手、舞蹈或用于身份验证的任何东西即可。\n\
    \n“你所是的”指的是生物识别。虽然这可以复杂到指纹或视网膜扫描，也可以简单到俱乐部保安认出你的脸并让你进入。你的个人独特特征被用来对系统进行身份验证。\n\
    \n通常在安全领域，任何系统都应集成其中至少两种。“你所拥有的”和“你所知道的”可以是智能卡和密码。“你所是的”和“你所知道的”可以是与密码配合的指纹扫描。任何系统都应至少要求其中两种（理想情况下全部三种）来对系统进行身份验证。这能更好地防止对系统的攻击。\n\
    \n> NOTE\n> \n> 特别说明一下，虽然传统钥匙绝对是“你所拥有的”，但如果多名用户拥有同一把钥匙，将其作为安全令牌使用就意义不大。“你所拥有的”以及身份验证三角的所有部分的逻辑在于，每个标识符都是唯一的，因此可以追溯到特定用户，确保不可否认性。用户之间共用的钥匙意味着现在只剩下一种因素（密码或生物识别）来用于身份验证。\n\
    \n上述说法的一个推论是“丢失的东西，我忘记的东西，我本来的东西。”C 这强调了上述每种单独身份验证方法的缺陷，并突出了为什么它们应协同使用。\n\n“丢失的东西”相当明显。如果用户被发放物理设备用于身份验证，他或她可能会丢失它。丢失钥匙是我们都遇到过最明显的这种形式。在近距离卡系统的情况下，卡片可能会丢失或被盗。攻击者一旦获得卡片，仅凭持有卡片即可获得访问权限，就像你在音乐会停车场殴打某人并拿走他们的门票一样。\n\
    \n“我忘记的东西”对任何做过技术支持的人来说都应该非常明显。用户会忘记东西。密码、握手——所有这些都可能被遗忘并使访问陷入停滞。其潜台词是密码可能会泄露，有时是无意分享、写在便签上，或只是被猜出。有时，它们还可以通过胁迫、勒索、敲诈或酷刑“发现”。同样，如果你知道密码并且这是唯一的身份验证方法，那么一旦你知道密码，就没有任何东西能阻止你。\n\
    \n“我本来的东西”是很多人不太考虑的东西。这个概念比其他概念更模糊一些。如果你的身份验证方法涉及生物识别，丢失或忘记指纹或视网膜是很难的，但也带来了新的考虑。受伤怎么办？如果使用指纹生物识别，如果某人受伤或整只手丢失怎么办？是否注册了其他手指或生物识别？从攻击者角度来看，这一点更难，因为它需要对试图冒充的人进行物理接触。你可能会试图胁迫用户为你进行身份验证。你也可能尝试伪造或复制生物识别，例如提取指纹并制作假手。这也可能意味着更极端的步骤——切除手或手指以绕过指纹系统。\n\
    \n**WARNING**\n\n攻击者切除手指以冒充他人进行身份验证的情况确实发生过。2005年在马来西亚，一名会计师因其奔驰S级轿车被劫持。汽车配备了指纹锁定装置，只有车主才能启动汽车。在将车主带在后备箱里一段时间以便需要时重新启动汽车后，窃贼变得沮丧，并在将他丢弃在路边之前切除了他部分手指（http://news.bbc.co.uk/2/hi/asia-pacific/4396831.stm）。在任何系统中，决心的攻击者总会找到绕过或击败安全系统的方法，甚至显然包括截肢。\n"
