    \ model of the phone listed as the name of the device when queried in a scan.\
    \ This automatically makes life easier for attackers because they can immediately\
    \ see what device it is and determine if there are any specific procedures needed\
    \ to do bad things to it. Alternatively, when people do change the default settings,\
    \ they very often change them to their name or some other very easy identifier\
    \ like “Bob’s phone” or “Alice’s Blackberry.” If an attacker is specifically looking\
    \ for target Bob, then Bob has made his phone obvious among the others detectable\
    \ in range and thus an easier-to-find target. By the same token, if the attacker\
    \ knows Bob has a Nokia phone and sees only one device named Nokia 6330, then\
    \ it’s pretty obvious which one is Bob’s.\n\nThe BD_ADDR, much like MAC addresses\
    \ for network cards, has a known format to follow. They are 48-bit identifiers\
    \ in a HEX format. The first 3 bytes are assigned to specific manufacturers. Like\
    \ MAC addresses for network cards, the Institute of Electrical and Electronics\
    \ Engineers (IEEE) assigns blocks of addresses to manufacturers to embed in their\
    \ devices. The last 3 bytes are the unique address of the device. Since the assigned\
    \ addresses are public, if the device name is not helpful, the BD_ADDR is not\
    \ hidden and can be used to determine manufacturer. Anyone can query the OUI database\
    \ and see what manufacturer made the device and adjust your attack accordingly.\
    \ The IEEE has a query page up at http://standards.ieee.org/regauth/oui/index.shtml,\
    \ and you can also download a copy of the whole database for integration into\
    \ your own application or for local lookup.\n\n> **NOTE**\n> \n> While manufacturers\
    \ are assigned addresses in blocks that can contain millions of device addresses,\
    \ that doesn’t mean that all of them are used in the real world. Manufacturers\
    \ may only use a few hundred thousand and then move on. The BNAP project aims\
    \ to collect device addresses and see what actual manufacturer prefixes are in\
    \ use. This greatly reduces the number of possibilities if we are searching address\
    \ space since we can eliminate addresses not in use. The BNAP project’s list of\
    \ address prefixes and the manufacturers are available at http://802.15ninja.net/bnapbnap/.\n\
    \nApplications like BTscanner for Linux or Windows (www.pentest.co.uk/cgi-bin/viewcat.cgi?cat=downloads)\
    \ or Bluescanner for Windows (https://labs.arubanetworks.com/) can automate the\
    \ process of scanning for devices, interrogating and cataloging the results. This\
    \ allows attackers to sit and observe the results much like Kismet (www.kismetwireless.net)\
    \ and Netstumbler (www.netstumbler.com/downloads/) did with Wi-Fi networks.\n\n\
    There have been several projects over the years to quantify the number of Bluetooth\
    \ devices in any given area. In early 2006, F-secure along with secure networks\
    \ created the Bluebag, a mobile Bluetooth detecting rig including nine Bluetooth\
    \ adapters built into a hard-sided wheeled suitcase. They wheeled the case through\
    \ airports, shopping malls, and even a security conference. In 23 h of scanning\
    \ at various locations, they discovered 1405 unique discoverable devices, many\
    \ of"
