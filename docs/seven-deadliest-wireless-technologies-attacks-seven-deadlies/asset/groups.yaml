    \ The most likely of these things would be to steal the personal data from the\
    \ iPhone’s owner. The more interesting files on an iPhone are located in the /private/var/mobile\
    \ directory.\n\nThe calendar application stores its data in the /private/var/mobile/Library/Calendar\
    \ directory as shown in Figure 7.3. The mail folder which stores local copies\
    \ of e-mails received is stored in /private/var/mobile/Library/Mail with each\
    \ account having its own mailbox. Figure 7.4 shows an example of a mail folder.\n\
    \n![](img/fa764b70be0fdcb44b75286d4f8589e2_125_0.png)\n\n## FIGURE 7.1\nSample\
