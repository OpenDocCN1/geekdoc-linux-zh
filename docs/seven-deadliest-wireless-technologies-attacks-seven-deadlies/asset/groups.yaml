    \ MAC 和注入接口。一旦此命令运行，Aireplay-ng 将对客户端进行五次去认证，希望当客户端重新连接时，Airodump-ng 会捕获握手。Aireplay\
    \ 显示的输出与图 1.9 相似，当然会替换为你的目标地址。\n\n一旦你拥有有效的四次握手，就可以开始破解过程。这种攻击的好处在于它只需要握手，如果运气好，可以在几秒钟内被动捕获。攻击的其余部分可以在其他地方离线进行，不需要目标网络。\n\
