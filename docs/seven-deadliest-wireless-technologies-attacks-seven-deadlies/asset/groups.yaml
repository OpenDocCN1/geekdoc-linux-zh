- raw:
  - "[PAGE 96]\n\norder back to from the customer. The speaker at the curbside does\
    \ not care about who is transmitting on the same frequency, only which signal\
    \ is the strongest. In the case of pranksters, it's not hard to obtain a radio\
    \ that is powerful enough, and with some modifications, capable of broadcasting\
    \ to drive-through speakers. Sometimes creative, sometimes not, these pranks can\
    \ be entertaining to watch when documented.^A\n\n# SCANNER SELECTION\n\nThere\
    \ are a huge amount of scanners on the market. Some are aimed at very simple users,\
    \ while others are aimed at amateur radio enthusiasts and others for professional\
    \ use. Some of the simplest scanners are aimed at sports fans, namely NASCAR race\
    \ fans, that use them to listen to the radio transmissions between their favorite\
    \ drivers and pit crews. Others are aimed at those with voyeuristic intentions\
    \ and are typically sold as \"police scanner\" in that they focus on frequencies\
    \ in use by law enforcement. One does not even need a scanner in some cases as\
    \ with the advent of the Internet and streaming audio; scanner fans have put their\
    \ scanners online for anyone to listen to online for free.^B There is even an\
    \ application for the iPhone for listening to scanner feeds from many cities around\
    \ North America.^C While these are limited to police bands, they show the kind\
    \ of information that can be heard right out of the air.\n\n> WARNING\n> \n> When\
    \ looking to purchase a scanner, be aware that local laws may ban their possession\
    \ or use by those without special permission or a license (amateur radio). Other\
    \ jurisdictions have bans on some frequencies and others on convicted felons possessing\
    \ them. Some rules also cover handheld scanners as opposed to vehicle-mounted\
    \ units.\n> \n> These rules do not necessarily work to stop the criminal element\
    \ that may use them against you since they won't care about the law anyway. However,\
    \ as a law-abiding citizen wanting to test your own equipment, it is highly recommended\
    \ to familiarize yourself with all the relevant local laws before purchasing or\
    \ using a scanner or else you might find yourself on the business end of the law.\n\
    \nThe most important thing to consider in selecting a scanner is the frequency\
    \ range. A cheaper scanner for the NASCAR crowds may not be capable of the frequencies\
    \ needed to listen in on your target device (but they may be, depending on the\
    \ target), but they will probably not have the range necessary. Some research\
    \ will be needed ahead of time to determine what frequency ranges you require.\
    \ Generally speaking, the wider the range of frequencies supported, the higher\
    \ the cost."
  - '[PAGE 97]


    Another consideration in selecting a scanner is the form. A large tabletop unit
    may have all the features you require, but it is not that easy to transport to
    the client site or use discreetly. Handheld scanners also deserve consideration
    for things like audio output capabilities to record signals, computer control
    capabilities, trunked radio tracking, and even battery life and external power
    options.


    Additional features can be useful to consider as well. The size of the display,
    video capabilities (discussed later), and memory functions are all important to
    consider. There is no single unit that does everything you could ever want (there
    may be, but cost may be a factor), but most times you won’t need all possible
    features, just the ones applicable to the job at hand.


    # EPIC FAIL


    Early analog cell phones were fairly easy to listen in on with commercially available
    radio scanning equipment. Their transmissions were unencrypted and could be easily
    intercepted by anyone with a suitable receiver and listened to by anyone in range
    who was curious.


    Of course, things said on a phone were often more interesting than things said
    around baby monitors leading to users asking questions about security. Regulators
    of different countries reacted quite differently to solve the problem of eavesdropping.


    In the United States, the mobile phone industry, rather than improving the technology
    and adding security (which would add cost to an industry in its infancy), instead
    decided to press the FCC to institute a ban on any scanner capable of monitoring
    analog cell phone frequencies or any device that could be modified to receive
    those frequencies. This did not actually prevent calls from being able to be eavesdropped,
    but just banned the tools to do so. After a certain date, all scanners sold in
    the United States were required to have those frequencies blocked out. Of course,
    the criminal element had no problems continuing to obtain unlocked scanners; the
    law simply prevented Joe Average from doing so. Effectively they were trying to
    jam the genie back in the bottle. This ban and lack of discussion in subsequent
    years about the realities led to many people not realizing that their cell phone
    conversations were vulnerable.


    Canada, by comparison, took a different approach. The Canadian Radio-television
    and Telecommunications Commission (CRTC) says that listening is permitted; however,
    disclosure to others of what you hear, or usage for personal gain, is punishable
    by law. This allows Canada to sell unlocked scanners. Pressure by the telecom
    industry did cause many to be sold with the cell phone frequencies blocked, but
    some were not.


    Neither country’s action prevented someone with nefarious intentions from illegally
    acquiring a capable scanner, listening in on conversations, and doing whatever
    with the acquired information.


    While the move to digital cellular phones added support for encryption technologies,
    it is still up to the providers to enable them and use them. In some circumstances,
    they may choose not to do so, as the additional overhead can mean less users per
    tower and increased costs against their bottom line. For this reason, it is worth
    investigating other security options such as encrypted phones since the continuing
    ban on equipment to monitor cellular phone frequencies is unlikely to deter against
    a determined attacker.'
  - '[PAGE 98]


    # Headsets


    Many cordless headsets in offices today are digital and often not as vulnerable
    as their analog predecessors. That being said, there are still a great many devices
    in use due to the adage “if it ain’t broke, don’t fix it.” These legacy devices
    can be used for years after others have been replaced.


    > NOTE

    > A cordless telephone can be thought of as a headset as well, albeit much more
    bulky, and much of what is discussed in regards to headsets can apply to them
    as well.


    These devices (and the most likely to be vulnerable) will typically operate on
    the 46 to 49 MHz range or the 900 to 948 MHz range. Others operate on 1.2 GHz
    and higher frequencies but are often digital in nature and not subject to the
    same vulnerabilities.


    Eavesdropping on these devices is as simple as obtaining a wireless scanner capable
    of receiving these frequencies and tuning in. Many headsets on those frequencies
    use simple frequency modulation, easily handled by most scanners. From there,
    you can simply listen to what is being spoken at that time.


    Depending on the system, one frequency is used for base station to headset audio,
    and another is used for headset to base station audio. This means that you can
    only receive one half of the conversation. If you are only picking up one side
    of a conversation, try to identify the other frequency in use (usually only a
    few megahertz away).


    Being able to eavesdrop on telephone conversations from the parking lot is a rather
    tantalizing prospect for an attacker. Taking a suitable scanner into the business
    centers of any major city will yield some sort of interesting conversation – conversations
    about upcoming financial filings or business deals, to tech support calls to reset
    passwords on user accounts. There is no limit to the kind of information that
    may be gleaned.


    # WIRELESS MICROPHONES


    While related to wireless headsets for telephones, wireless microphones tend to
    be different enough to warrant separate discussion.


    If you’ve ever been to a conference or presentation, you have probably seen these
    wireless microphones. Usually pinned or clipped to a lapel, there is a cord snaking
    to a transmitter in the pocket or clipped to a belt that sends the speaker’s voice
    to the camera or to the room speakers so everyone can hear clearly. Hardly a presentation
    made to a reasonably sized room occurs without the use of a microphone like this.
    As well, stage productions will often use similar (though higher end) equipment
    to amplify the voices of the performers on stage so the audience can hear clearly.'
