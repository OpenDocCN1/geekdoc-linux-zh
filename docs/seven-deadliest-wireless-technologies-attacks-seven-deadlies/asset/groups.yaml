    ## 摘要


    WPA-PSK（和 WPA2-PSK）相比 WEP 是一种改进，通过为用户记住和输入密码短语创建更简单的方法，IEEE 在其中引入了人为缺陷。WPA-PSK
    拥有 256 位密钥，比 WEP 的 128 位提供更强劲得多，而该密钥的随机性基于用户选择随机密码短语和唯一 SSID 的能力，而一般来说，人们在这方面并不擅长。


    简而言之，一切都取决于选择一个好的密码短语。尚未有 WPA-PSK 密码短语被此类攻击破解的报告；然而，实际上几乎无法检测到此类攻击的发生。不过根据专业渗透测试人员的经验，使用
    Wi-Fi 教会表在 SSID 位于列表中的情况下成功率约为 50%，这意味着攻击者有相当的机会进入现场并破解密码。这只是说明，如果你使用 WPA-PSK，最好遵循
    IEEE 标准中的建议，使用 20 个字符的密码短语，不基于任何字典单词，并由大写和小写字母、数字和一些符号组成，以求稳妥。


    降低 WPA 暴力攻击风险的其他措施：


    - 定期更改密码短语（保持长度和随机性）

    - 定期更改 SSID，从而更改盐值

    - 如果发送敏感或财务数据，请考虑安装和使用无线入侵检测系统（WIDS）

    - 如果可能，迁移到 WPA-Enterprise 解决方案

    - 教育用户复杂密码短语的必要性


