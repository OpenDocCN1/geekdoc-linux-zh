  mdcn: "\n订单退回给客户。路边扬声器不关心谁在同一频率上发射，只关心哪个信号最强。对于恶作剧者来说，获得一台功率足够强的收音机并不困难，经过一些改装后，能够向得来速扬声器广播。有时富有创意，有时并非如此，这些恶作剧在被记录下来时观看起来可能很有趣。^A\n\
    \n## 扫描仪选择\n\n市场上有大量扫描仪。有些针对非常简单的用户，而另一些则针对业余无线电爱好者，还有一些用于专业用途。其中最简单的扫描仪针对的是体育迷，尤其是\
    \ NASCAR 赛车迷，他们用它来收听自己喜爱的车手与维修站之间的无线电传输。其他产品则针对具有窥视意图的人，通常以“police scanner”出售，因为它们专注于执法部门使用的频率。在某些情况下甚至不需要扫描仪，随着互联网和流媒体音频的出现；扫描仪爱好者已将他们的扫描仪上线，供任何人免费在线收听。^B\
    \ 甚至还有一款 iPhone 应用程序，可收听北美各地许多城市的扫描仪音频流。^C 虽然这些仅限于警察频段，但它们展示了可以直接从空中听到的信息类型。\n\
    \n> WARNING\n> \n> 购买扫描仪时，请注意当地法律可能禁止那些没有特殊许可或执照（业余无线电）的人持有或使用它们。\n> \n> 其他司法管辖区对某些频率有限制，或对被定罪的重罪犯持有扫描仪有限制。一些规定还涵盖了手持扫描仪与车载设备的区别。\n\
    > \n> 这些规定不一定能阻止可能对你使用它们的犯罪分子，因为他们反正不会在乎法律。然而，作为一名守法的公民，想要测试自己的设备，强烈建议在购买或使用扫描仪之前熟悉所有相关的当地法律，否则你可能会发现自己正面临法律的制裁。\n\
    \n选择扫描仪时最重要的是考虑频率范围。面向 NASCAR 群体的更便宜的扫描仪可能无法接收监听目标设备所需的频率（但视目标而定，它们可能可以），但它们可能没有必要的范围。需要提前进行一些研究，以确定所需的频率范围。一般来说，支持的频率范围越宽，成本越高。\n\
    \n选择扫描仪的另一个考虑因素是其形态。大型台式机可能具备你所需的所有功能，但将其运送到客户现场或 discreet 使用并不容易。手持扫描仪也值得考虑，例如音频输出能力以记录信号、计算机控制能力、集群无线电跟踪，甚至电池寿命和外部电源选项。\n\
    \n也可以考虑其他有用功能。显示屏大小、视频功能（稍后讨论）和存储功能都很重要。没有一台设备能满足你所有想要的功能（可能有，但成本可能是因素），但大多数时候你不需要所有可能的功能，只需要适用于手头工作的功能即可。\n\
    \n## 彻底失败\n\n早期模拟手机使用市面上可买到的无线电扫描设备相当容易被窃听。它们的传输未加密，任何拥有合适接收器的人都可以轻松截获，范围内好奇的人都可以收听。\n\
    \n当然，电话里说的事情往往比婴儿监视器周围说的事情更有趣，这导致用户对安全提出疑问。不同国家的监管机构对解决窃听问题做出了相当不同的反应。\n\n在美国，移动电话行业没有改进技术并增加安全性（这会增加一个处于起步阶段的行业的成本），而是决定向\
    \ FCC 施压，禁止任何能够监控模拟手机频率的扫描仪或任何可以改装以接收这些频率的设备。这实际上并没有阻止电话被窃听，只是禁止了实现这一目的的工具。从某个日期起，在美国销售的所有扫描仪都必须屏蔽这些频率。当然，犯罪分子继续获取未锁定的扫描仪没有任何问题；法律只是阻止了普通人这样做。实际上他们试图把已经放出的魔鬼再塞回瓶子里。这种禁令和随后几年里对现实情况缺乏讨论导致许多人没有意识到他们的手机通话是脆弱的。\n\
    \n相比之下，加拿大采取了不同的方法。加拿大广播电视和电信委员会（CRTC）表示，收听是被允许的；然而，向他人透露你所听到的内容，或为个人利益使用，则属于违法行为。这使得加拿大可以销售未锁定的扫描仪。电信行业的压力确实导致许多扫描仪在销售时屏蔽了手机频率，但有些并未屏蔽。\n\
    \n两个国家的做法都未能阻止心怀不轨的人非法获取一台功能强大的扫描仪，窃听对话，并对获取的信息为所欲为。\n\n虽然转向数字蜂窝电话增加了对加密技术的支持，但是否启用和使用仍取决于运营商。在某些情况下，他们可能选择不这样做，因为额外的开销可能意味着每座基站的用户减少以及对利润的成本增加。因此，值得研究其他安全选项，例如加密电话，因为对监控手机频率设备的持续禁令不太可能阻止决心坚定的攻击者。\n\
    \n## 耳机\n\n如今办公室中许多无线耳机是数字化的，通常不如其模拟前身那样脆弱。尽管如此，由于“if it ain’t broke, don’t fix\
    \ it.”的说法，仍有大量设备在使用。这些旧设备在其他设备被更换后仍可使用多年。\n\n> NOTE\n> A cordless telephone can\
    \ be thought of as a headset as well, albeit much more bulky, and much of what\
    \ is discussed in regards to headsets can apply to them as well.\n\n这些设备（最可能受攻击的）通常工作在\
    \ 46 至 49 MHz 范围或 900 至 948 MHz 范围。其他设备工作在 1.2 GHz 及更高频率，但通常是数字性质，不受相同漏洞影响。\n\n\
    窃听这些设备就像获取一台能够接收这些频率的无线扫描仪并调谐一样简单。这些频率上的许多耳机使用简单的调频，大多数扫描仪都能轻松处理。从那里，你只需收听当时正在说的内容即可。\n\
    \n根据系统不同，一个频率用于基站到耳机的音频，另一个频率用于耳机到基站的音频。这意味着你只能接收对话的一半。如果你只接收到对话的一方，尝试识别正在使用的另一个频率（通常只相差几兆赫）。\n\
    \n能够从停车场窃听电话对话对攻击者来说是一个相当诱人的前景。将合适的扫描仪带入任何大城市的商业中心都会产生某种有趣的对话——从关于即将到来的财务申报或商业交易，到技术支持呼叫重置用户账户密码。可获取的信息种类没有限制。\n\
    \n## 无线麦克风\n\n虽然与电话无线耳机相关，但无线麦克风通常差异足够大，值得单独讨论。\n\n如果你曾参加过会议或演示，你可能见过这些无线麦克风。通常别在或夹在翻领上，有一根线通向口袋里的发射器或别在腰带上的发射器，将演讲者的声音发送到摄像机或房间扬声器，以便每个人都能清晰听到。几乎没有在合理大小的房间进行的演示不使用这种麦克风。此外，舞台制作通常也会使用类似（尽管更高端）的设备来放大舞台上表演者的声音，以便观众能清晰听到。\n"
