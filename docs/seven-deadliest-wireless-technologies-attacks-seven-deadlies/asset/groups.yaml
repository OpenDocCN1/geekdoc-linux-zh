    \ PIN 码以完成过程。PIN 在两台设备之间的加密方案中充当密码，并用于生成链路密钥。该密钥用于保护设备之间的通信，并在未来对设备进行身份验证。如果设备将来想要重新连接，设备会检查对方的\
    \ BD_ADDR 是否已绑定，如果已绑定，它们会假定双方仍保存着链路密钥，并立即开始通信。这跳过了 PIN 输入过程，并在范围内允许自动重新连接。如果一台或两台设备忘记了链路密钥，则会重新启动配对过程，并需要再次输入\
    \ PIN。\n\n即使在连接之前，设备也会相互通信其功能。正如互联网上的并非每个主机都是 Web 服务器或安全外壳（SSH）服务器一样，并非每个蓝牙设备都使用所有可用的服务。通过一种称为服务发现协议（SDP）的协议，设备会相互宣告其支持的服务。计算机可能支持所有可能的配置文件，如网络、文件传输等，而较小的设备仅支持少数或单一配置文件。例如，耳机不支持网络，仅提供音频配置文件。这种配置文件的宣告使设备能够按功能进行筛选，例如手机只查找耳机，或电脑查找打印机，而不会被不必要的设备淹没。\n\
    \n对最终用户而言，该过程通常相当无痛。有些配置文件可以在不加密的情况下运行，例如如果你想在不使用 PIN 码使事情复杂化的情况下将联系信息从一部手机发送到另一部手机。需要加密的那些只需简单的\
    \ PIN 码即可完成过程。增加记住已绑定设备和自动重连的功能使其更加便捷。\n\n## 攻击蓝牙\n\n随着蓝牙设备的广泛采用和便利性，必然会出现导致意外情况发生的实现问题。\n\
    \n大多数基于蓝牙的攻击都基于一个简单且常见的缺陷。用户在阅读文档、理解风险和威胁以及更改默认设置方面往往非常糟糕。大多数攻击都围绕用户未更改设备的默认设置。这再加上糟糕的用户界面（UI）设计，造成了用户意识不到正在发生或即将发生坏事的情况。此外，直到最近，文档也没有充分解释某些操作的风险。\n\
    \n### 蓝牙发现\n\n与大多数攻击一样，第一步是找到目标。最常见的是，蓝牙攻击针对的是机会目标（即非针对性目标）。在蓝牙的情况下，其设计假设设备偶尔会相互交互（这正是该技术的全部意义所在）。这些设备需要能够轻松找到彼此是这一要求。这使合法用户能够找到他们正在寻找的设备，但也允许附近的攻击者找到同一设备并对其进行静默询问，以判断其是否适合攻击。\n\
    \n蓝牙发现过程涉及配对过程中的双方。寻求连接的设备会向附近区域发送广播。如果区域内的设备设置为可发现，则会用设备的 BD_ADDR 进行响应。从那里，查询设备可以使用\
    \ SDP 来发现设备提供的所有配置文件（即服务），反之亦然。简单来说，手机发出查询，耳机回应说它支持免提配置文件，手机现在知道将此远程设备视为耳机而不是拨号适配器或其他配置文件。\n\
    \n大多数手机、PDA 或其他蓝牙设备都具有扫描可发现设备的 capability。即使使用这种非常简单的界面，你也可以获得一些有趣的信息。许多手机默认在扫描查询时将手机的品牌和型号列为设备名称。这自动使攻击者的生活更轻松，因为他们可以立即看到设备是什么，并确定是否需要任何特定程序对其进行破坏。另一方面，当人们更改默认设置时，他们经常将其更改为自己的姓名或其他非常容易识别的标识符，如“Bob\
    \ 的手机”或“Alice 的 Blackberry”。如果攻击者专门寻找目标 Bob，那么 Bob 就让他的手机在探测范围内与其他手机中变得显而易见，从而成为更容易找到的目标。同理，如果攻击者知道\
    \ Bob 有一部诺基亚手机，并且只看到一台名为 Nokia 6330 的设备，那么很明显哪一部是 Bob 的。\n\nBD_ADDR 与网卡的 MAC 地址类似，有一个已知的格式。它们是十六进制格式的\
    \ 48 位标识符。前 3 个字节分配给特定制造商。与网卡的 MAC 地址类似，电气和电子工程师学会（IEEE）向制造商分配地址块以嵌入其设备中。最后 3\
    \ 个字节是设备的唯一地址。由于分配的地址是公开的，如果设备名称没有帮助，BD_ADDR 并未隐藏，可用于确定制造商。任何人都可以查询 OUI 数据库，查看设备的制造商并据此调整攻击。IEEE\
    \ 在 http://standards.ieee.org/regauth/oui/index.shtml 上提供了一个查询页面，你也可以下载整个数据库的副本以集成到自己的应用程序中或进行本地查找。\n\
    \n> **注意**\n> \n> 虽然制造商被分配的地址块可包含数百万个设备地址，但这并不意味着它们在现实世界中都被使用。制造商可能只使用几十万个然后就不再使用。BNAP\
    \ 项目旨在收集设备地址并查看实际使用的制造商前缀。这大大减少了可能性，如果我们在搜索地址空间，因为我们可以排除未使用的地址。BNAP 项目的地址前缀和制造商列表可在\
    \ http://802.15ninja.net/bnapbnap/ 获取。\n\n像 BTscanner for Linux 或 Windows（www.pentest.co.uk/cgi-bin/viewcat.cgi?cat=downloads）或\
    \ Bluescanner for Windows（https://labs.arubanetworks.com/）这样的应用程序可以自动化扫描设备、询问和编目结果的过程。这使攻击者能够坐下来观察结果，就像\
    \ Kismet（www.kismetwireless.net）和 Netstumbler（www.netstumbler.com/downloads/）对\
    \ Wi-Fi 网络所做的那样。\n\n多年来已有多个项目旨在量化特定区域内的蓝牙设备数量。2006 年初，F-secure 与 Secure Networks\
    \ 合作创建了 Bluebag，这是一款移动蓝牙检测设备，包括九个内置于硬壳轮式手提箱中的蓝牙适配器。他们将该箱子推过机场、购物中心，甚至安全会议。在各个地点的\
    \ 23 小时扫描中，他们发现了 1405 台独特的可见设备，其中许多\n"
