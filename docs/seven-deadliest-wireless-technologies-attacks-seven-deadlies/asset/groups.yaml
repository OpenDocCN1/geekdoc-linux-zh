    \ 文件夹中找到，通常位于名为 100APPLE 或其他类似名称的目录下。文件是简单的 JPEG，可以用大多数图像查看器打开，如图 7.5 所示，它们归用户\
    \ mobile 所有，这进一步强调了更改 mobile 用户密码的重要性。\n\n此时，攻击者可以下载大量私人内容；然而，该攻击依赖于持续连接，并且下载所有有趣内容可能需要时间。显然很多操作可以脚本化以加快速度，但另一个问题是我们的目标可能未连接到机场、酒店或被攻击地点的本地网络。\n\
    \niPhone 有一种有趣的行为。正如第 2 章《802.11 无线 – 客户端攻击》中所述，一些设备在广告和连接其首选列表中的网络方面非常执着。iPhone\
    \ 似乎尤其被设计为几乎强制执行此操作。\n\n在 iPhone 的 Wi-Fi 网络菜单中，菜单底部有一条说明：“已知网络将自动加入。如果没有可用的已知网络，在加入新网络前会询问您。”由于这些是混合设备，它们也可以通过\
    \ 3G 连接接入互联网。这显然会给用户带来费用，出于礼貌，操作系统设计为将 3G 作为最后的连接手段。简单来说，系统会检查之前连接过的 Wi-Fi 是否存在。如果存在，它将自动加入并使用该网络。如果不存在，那么如果周围有网络，用户将被提供连接其中一个网络的机会。如果没有网络或用户无法或拒绝连接，则使用\
    \ 3G 连接。所有这些前提是 Wi-Fi 连接首先已启用。\n\n这为攻击者创造了有趣的情况。由于 iPhone 偏好 Wi-Fi 连接，并且不断搜索家庭网络并会在没有用户提示的情况下自动连接，攻击者可以轻松利用这一点。\n\
    \n使用第 2 章《802.11 无线 – 客户端攻击》中的工具，如 KarMetasploit,³，设置一个对任何探测请求做出响应并模拟 iPhone 首选列表中网络的假接入点是微不足道的。一旦\
    \ iPhone 连接，它会静默获得一个 IP 地址，现在攻击就与设备建立了直接连接，且无需用户交互。无线社区发现，iPhone 是利用这种行为最容易的设备之一。\n\
    \n由于设备进入待机导致连接间歇性的问题，奇怪地被攻击发生的环境所解决了。大多数 iPhone 用户并不持续使用设备。他们只使用短时间然后将其置于待机。然而，在某些地方持续使用几乎是保证的，通常是在人们需要长时间等待的任何地方。最容易利用的地方之一是在飞机上。用户通常会根据联邦航空管理局的规定在飞行前禁用手机的\
    \ 3G 功能，但经常不会禁用 Wi-Fi。飞行数英里后，大多数用户会听音乐或在设备上看电影，浑然不觉他们的设备仍在寻找网络连接。攻击者只需在范围内即可，这在飞机上很容易，然后启动攻击。自动化系统可以使这一过程仅需几秒钟，在其他情况下，如两辆同向行驶的汽车甚至在红灯前停车时，仍有足够的时间使其生效。\n\
    \n> **提示**\n> \n> 虽然大多数情况下，攻击者必须非常有决心才能与目标搭乘同一航班，但存在机会目标。经济舱后排一个非常无聊的人可以制造大量破坏来取乐，而且在航班结束后他们分开很久之前，很不可能被注意到。\n\
    > \n> 这也适用于后来的自动化病毒和蠕虫攻击。在封闭区域内的持续接触增加了感染传播到您设备的可能性，特别是现在许多航空公司都提供机上 Wi-Fi 功能。\n"
