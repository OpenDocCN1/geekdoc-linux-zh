    \n从审计角度来看，像 Bluetooth Stack Smasher (www.secuobs.com/news/05222006-bluetooth10.shtml)\
    \ 这样的工具非常宝贵，因为它们具有模糊测试功能，可以用于发现以前未知的稳定性和安全问题。\n\n## 批发嗅探\n\n2007 年，n.runs 发布了\
    \ Bt crack，这是一款用于破解蓝牙链路密钥的 Windows 程序（www.nruns.com/_en/security_tools_btcrack.php）。这看起来像是蓝牙的死刑判决，但有一个问题。嗅探使破解成为可能的那些数据包比你想象的更难捕获。\n\
    \n与任何无线技术一样，这一切都归结于它是一台无线电，而无线电在共享介质电磁频谱中运行。因此，其存在是不可能隐藏的。为了通信，它必须暴露其存在。就蓝牙而言，这是\
    \ 2.4 GHz 频谱，与 802.11b/g/n 网络相同；然而，其操作与 Wi-Fi 明显不同，这造成了一些独特问题。\n\n与 Wi-Fi 不同，蓝牙没有等效的监控模式，因为它是一套协议，而不是一个连贯的整体。当设备相互连接时，piconet\
    \ 的主设备根据其内部时钟为所有从设备设置跳频方案。蓝牙使用频率跳频扩频（FHSS）在 79 个通道上运行，每个通道宽 1 MHz，并以 1600 hops/s\
    \ 跳频，这意味着如果我们不知道主设备的时钟，就没有简单的方法来跟随 piconet 的跳频序列。我们将无法获取所有数据包。此外，在标准蓝牙设备上不可能同时监听所有通道，也不可能实际拥有\
    \ 79 台蓝牙无线电各自监听一个通道。\n\n> **NOTE**\n> \n> 市场上确实有一些蓝牙协议分析仪可以嗅探所有流量。通常这些设备需要主设备和从设备的\
