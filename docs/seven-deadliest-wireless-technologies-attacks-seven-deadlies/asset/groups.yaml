  - '[PAGE 110]


    In ideal operation, an attacker would be unable to access the contents without
    the 24-bit key to begin transmission; however, situations are rarely ideal. In
    order for efficiently moving travelers through passport control, there had to
    be an easy way to allow border agents to know the key for each passport, short
    of countries constantly exchanging massive databases of individual codes for every
    passport issued. The solution was the machine-readable zone (MRZ) on every passport.
    The MRZ is the jumble of characters at the bottom of the passport photo page.
    This area is meant to be scanned via optical reader and contains things like name,
    passport number, date of expiration, and so on. The passport agent swipes the
    page through an optical reader, saving the agents from having to type all that
    information themselves into their database. The key is generated from this MRZ
    data and automatically used to receive the tag contents and display them for comparison
    to the physical document and the person presenting it. In theory, this means that
    the tag has a 24-character key, which under ideal circumstances would mean 36^24
    possible keys, a daunting task for an attacker using brute force.


    The problem is that since the key is based on set, guessable ranges of values,
    the key space shrinks dramatically. A birth date in the MRZ, for example, is a
    two-digit year, two-digit month, and two-digit day. This means that there are
    only 100 possible years, 12 possible months, and 31 possible days for the key.
    An exhaustive search of that part of the key would be 365 × 100, which equals
    36,500 possibilities. If you know the rough age of your target, you can narrow
    that even more to, say, 10 years, 5 years on either side of a guess for only 3,650
    possibilities or less. Passports are issued for a limited period of usually 5
    to 10 years, depending on the country. This limits the range of the issue/expiration
    date as part of the key and even more so if RFID tags in passports have only been
    available for a short time. Passport numbers are a bit trickier to guess; however,
    some countries have numbering systems based on the date of issue and are sequential.
    The base value jumps a set amount each day by a fixed amount (passports issued
    January 1 would be 00001 and increase incrementally, January 2 would start at
    10001, and so on). Again, this allows an attacker to narrow down the key space
    for the passport number.


    In 2007, Adam Laurie^c proved this with a challenge from a reporter. Taking a
    newly issued passport that had been delivered through the mail, he was able to
    access the RFID tag and read its contents through the envelope using only information
    on the envelope and the public records. The outside of the envelope is distinctive
    as having a passport and includes a postmark and the name and address of the recipient.
    The postmark greatly narrows the date of expiry to within a few days as well as
    the likely passport number in some countries. The name and address allowed for
    a public records search of the target and yielded a birth date, another piece
    of the key. This means that with a simple reader (since it''s a standard interface)
    and some simple software, a thief could steal a new passport, read all the contents,
    and put the original back without the victim even knowing that the passport had
    been read. The information in a passport would allow an identity thief to do all
    sorts of things. This attack'
  - '[PAGE 111]


    also does not have to be limited to new passports in envelopes. Since the interface
    is over the air, an attacker could use a computer in a briefcase and sit next
    to a target on a train or bus and have a reasonable chance of retrieving the tag
    contents. Since there is no limit to the amount of times an attacker can try a
    key (unlike the PIN on your ATM card), it is just a matter of time.


    Some countries have identified these problems and attempted to mitigate some of
    the issues. Some countries have changed the issuing pattern of passport numbers
    to increase the amount of keys an attacker would have to test. The U.S. implemented
    perhaps the best-known defense with their passport book covers being layered with
    a metal foil to act as a Faraday cage to prevent the reader carrier signal from
    powering the tag and thus sending a signal.


    # EPIC FAIL


    When electronic passports were first being considered, the overwhelming majority
    of experts thought it was a bad idea from a privacy and security standpoint. Many
    people questioned the reasoning behind the choice of a radio-based technology
    when contact-based options (smart cards) were available. In general, RFID is considered
    a very suspect technology with many conspiracy theories about clandestine monitoring
    of citizens and the potential for terrorists to use the technology to identify
    targets by nationality.


    Debunking these theories is difficult and was not helped in 2008 at the Hackers
    On Planet Earth conference in New York City. At that conference, one of the keynote
    presentations was by Adam Savage, one of the hosts of Mythbusters on Discovery
    channel. During the Q&A portion of the talk, he was asked by RenderMan about RFID
    and why the show, well known for debunking urban legends and pseudo-science, had
    not tackled many of the conspiracy theories surrounding RFID technologies. His
    answer greatly helped fuel the flames of the conspiracy crowd. He explained that
    they had investigated the subject for the show, but when the fellow host Tory
    Belleci participated in a conference call with Texas Instruments (TI) to get some
    background, also on the line were the chief legal counsels for most of the major
    credit card companies (who use RFID in some payment systems) – the story continued
    that the legal counsels all forcefully pressured the show not to show any vulnerabilities
    in RFID technology. Like many conferences, the presentations were recorded and
    very quickly a clip of the answer found its way to YouTube.


    Shortly afterward, after much media attention, Adam sent out a statement recanting
    the story as him getting the facts very wrong having heard it from the second
    or third person. The call did happen; however, not as Adam thought it did. Host
    Grant Imahara was the team member on the call and there was only one legal representative
    attending. At no time did anyone pressure the show to not pursue the angle (Texas
    Instruments was trying to arrange for it to happen) and it was the show''s decision
    not to go forward with the tests.


    So the epic fail and the lessons learned are twofold. First, asking a simple question
    about the security of a system is a good thing but the answer may be more than
    you bargained for. Second, particularly with security technology, be very aware
    of the facts before making a statement about its positive or negative impacts
    as many people are often dependant on these technologies for their safety and
    security and will fight to set the matter straight if you are wrong in any way,
    leaving you looking foolish.'
  - '[PAGE 112]


    The cryptographic problems get worse once you consider that not all passports
    are created alike. While interoperability was a goal with the ICAO standards,
    not all portions of it were mandatory and countries were allowed to make their
    own decisions in some cases regarding the authentication methods. One method available
    against cloning one chip to another is called active authentication (AA). With
    AA, the legit passport is embedded with a private key that cannot be directly
    read but can be used cryptographically with a public key on the tag to verify
    those tag contents are original to that tag. A cloned tag would not have that
    private key and thus would fail the test. This feature is optional, however, and
    many countries have chosen not to support it, meaning systems have to deal with
    it not being there. Researchers at The Hackers Choice² found that if they copied
    the tag contents, altered them, and deleted the original public key on the tag,
    they could sign the tag contents with their own key from a nonexistent country
    and pass several automated passport control systems (though doubtful any that
    included a guard). The problem was that many of these systems checked to see that
    the contents were signed by the key pair on the tag, but failed to check if those
    keys were trusted and actually came from the country it claimed to be issued from.
    Many countries, systems do not do this and would need to patch or upgrade their
    systems to perform this check.


    # PASSPORT SUMMARY


    While the battle between document issuers and document forgers is a never-ending
    battle, the addition of digital components makes the job just that much harder.
    However, no system is completely safe, and compromises made for ease of implementation


    **WARNING**


    While electronic passports are here to stay for the foreseeable future, many people
    are uncomfortable with them. There are many who advocate damaging the RFID tag
