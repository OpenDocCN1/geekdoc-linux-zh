    as soon as that information was released. Other companies have to make compromises
    due to many factors, such as size, cost, and available computing power, when implementing
    an encryption system, and security by obscurity becomes a necessary part of the
    system. These situations are sometimes more complicated than others for an attacker,
    but they all have the problem that once the genie is out, there is no way to put
    it back in the bottle.


