    最初，Wired Equivalent Privacy（WEP）是唯一可用的选项，但随着时间的推移，在 WEP 被证明存在弱点时，Wi-Fi Protected
    Access（WPA）作为临时解决方案被引入，最终在 802.11i 最终批准时推出了 WPA2。


    与许多安全技术一样，如果你给用户使用它的选项，他们往往不会使用。如果你给他们太多选项，也无法保证他们会保持系统更新。


    ## 无线网络的工作原理


    无线网络通常由两类设备组成：AP 和通常称为站点（STA）的客户端设备。本章重点关注家庭或企业中常见的 AP 的安全性。客户端安全性在第 2 章《802.11
    无线 – 客户端攻击》中讨论。这些网络可以是 802.11a、b、g 或 n，但就本章的大部分内容和讨论目的而言，这并不重要。所需的基础设施相当通用，并且所有这些的安全标准基本相同。


    AP 是 IT 行业的每个人和大多数家庭电脑用户可能都熟悉的东西。它们有各种形状和尺寸，具有不同的功能。它们是有线网络和无线网络之间的网关。如果你家里还没有一个，你通常可以在许多企业或公共场所看到它们被固定在墙上，伸出一个或多个天线。在无线网络中，AP
    是客户端 STA 连接到的对象（而不是相反）。在默认状态下，大多数 AP 会接受任何请求加入网络的客户端 STA 的连接。虽然这对用户来说很方便，但对任何想连接的人来说也很方便，无论出于好意还是恶意。


    在无线技术的早期，这被视为积极的事情。无线带来了勇敢新世界、免费互联网接入以及共享一种新颖且有用的资源的想法。坏人很快就意识到这对他们也非常有用。


    ### 注意


    很难想象一个没有无线网络的世界。它无处不在。自 2001 年以来，Wigle.net 作为一个由用户提交数据的在线存储库，已收集了数千万个具有全球定位系统（GPS）坐标的唯一网络位置，以及超过十亿个对这些网络的观测点。该网站还包括一些自动生成的地图，可以相当明确地显示只要有人和电脑在的地方，就有无线网络。图
    1.1 显示了 Wigle.net 的北美地图。


    这种活动可能看起来很奇怪，但像 Skyhook Wireless（www.skyhookwireless.com）这样的公司已经把自己做成 wardriving
    的生意。他们绘制全球网络的位置，并利用这些信息通过已知 AP 的三角定位提供类似 GPS 的定位感知，而不是通过卫星，这在许多情况下可以在室内工作，而 GPS
    则不行。


    如你所见，无线网络无处不在。只要有人口中心，你就能找到无线网络那里。


    ![](img/fa764b70be0fdcb44b75286d4f8589e2_20_0.png)


    ### 图 1.1


    Wigle.net 的北美地图


    无线电是一个共享介质。如果你还记得以太网网络全部使用集线器而不是交换机的糟糕旧时代，每个人都能看到彼此的流量。好吧，无线网络把这些网络的有趣之处又带回来了。在那个时代，集线器只是简单的重广播设备，对每个端口连接了什么没有任何智能。客户端将数据包放到线路上，集线器会将该数据包重新广播到集线器上的每台其他电脑。预期的接收方接受数据包，而其他电脑则简单地忽略它。可以想象，网络上有许多客户端同时尝试通信会变得相当嘈杂。网络适配器通常会过滤掉不是发往其地址的下行数据包。如果你禁用该过滤器，现在就可以监听所有数据包，即使不是发往该网卡的数据包。这通常被称为
    *混杂模式*，自网络诞生以来一直是网络诊断的基本工具。


    在无线网络中，如果你已关联到网络，混杂模式会做同样的事情。如果你想在不关联的情况下监听其他网络，或获取第 1 层和第 2 层的管理流量，那么你需要移除第 1
    层和第 2 层的过滤器以及网络的逻辑分离。这就是监控模式发挥作用的地方。监控模式很有用，因为它允许网卡监听同一频道范围内任何网络的任何无线数据。


    802.11 网络通常会发送广告“信标”帧来宣布其存在。这些帧包含网络 BSSID（媒体访问控制 [MAC] 地址）、ESSID（通常称为 SSID，网络的逻辑名称）以及关于其功能（速度、加密级别等）的各种标志。所有这些信息都是明文发送的。由于它是一个共享介质，任何人都可以接收这些信标和基本信息。这就是
    wardriving 的本质。


    关于 wardriving 写了很多，但最好的定义是由名为 blackwave 的发帖者在 netstumbler.org 论坛上提出的：


    > Wardriving（动词）——在移动中定位并记录无线接入点的良性行为。¹


    本质上，它是使用无线启用设备来搜索其他设备。这可以像 Windows 中的 Wireless Zero Config 实用程序搜索网络一样简单，也可以像 Kismet
    这样的完整无线检测和嗅探程序。系统集成 GPS 后，这些网络的坐标可用于生成本地区域的地图以供报告，或提交到 wigle.net 等网站以添加到更大的社区数据池中。


    ## 案例研究：TJX 集团


    2007 年 4 月，美国零售巨头 TJX（TJ Maxx、Marshalls 等零售店品牌的拥有者）在其年度证券交易委员会文件中公开承认其网络安全已被入侵，客户信用卡号码和其他信息在一年多时间内可供在网络上游荡的罪犯获取。该公司预计在
    5 年内损失超过 10 亿美元，并给数百万现在面临身份盗窃和信用卡欺诈风险的消费者带来麻烦，同时信用卡公司和金融机构不得不花费数百万美元更换消费者的信用卡。2008
    年 5 月，当局在迈阿密、佛罗里达州逮捕了 Albert Gonzalez，原因是另一起大规模身份盗窃案。他最终被指控为 TJX 攻击以及其他几起大型企业渗透事件的幕后主谋，并在
    2009 年 8 月 28 日同意认罪协议，因其行为可能被判 15 至 25 年监禁。还有几项与对其他公司类似攻击相关的未决指控，在撰写本文时仍在等待法院审理。


    ### 史诗级失败


    关于 Gonzalez 的一个有趣的注记是，他似乎在为美国特勤局担任线人期间开始了对 TJX 的攻击。


    Gonzalez 是 Shadowcrew 的成员，这是一个在线团体，运营着一个拥有超过 4,000 名成员的网站，专门从事被盗信用卡号码的买卖和交易。该团体贩运了超过
    150 万张信用卡号码。当团体成员开始被逮捕时，Gonzalez 成为线人并协助起诉了 Shadowcrew 的另外 19 名成员。


    在他为当局工作期间，他显然在 FBI 监管人员的眼皮底下开始了一场新的犯罪狂潮，其中包括 TJX 攻击。对该机构来说这是明显的污点，他能够长期隐藏自己的活动对未来的调查人员来说是一个有益的教训。他使用远程计算机和加密技术应被视为网络罪犯隐藏其活动的创造力的证明。


    虽然许多细节尚不完全清楚，但似乎最大且报道最广泛的入口点是明尼苏达州圣保罗一家商店的无线网络。Gonzalez 等人的起诉书显示，Marshalls 和 TJX
    商店是通过迈阿密自家停车场的无线网络被渗透的。全部程度可能永远无法得知，但很明显无线网络是这些攻击的组成部分。


    使用 freely available 软件，攻击者识别了网络并继续破解用于保护网络的 WEP 密钥。这提供了对商店网络的访问，并为进入更大的企业网络及其包含的所有数据提供了立足点。无论这是对该特定商店和连锁店的针对性攻击，还是他们只是路过并注意到安全薄弱，我们可能永远不会知道。然而，对肇事者的各种起诉显示，许多不同的公司都被渗透，很可能都是机会目标，而不是特定议程的目标。唯一共同的元素似乎是这些企业位于佛罗里达州美国州际公路
    1 号沿线。同样，攻击者只是沿着州际公路行驶并收集数据，然后稍后返回诱人且薄弱的目标。


    此后各种报告均显示，商店的无线网络使用 WEP 保护。当时 WEP 已被认为存在致命缺陷，并且已被 WPA 加密的引入所淘汰。这些网络通常是为了方便许多商店用于库存控制的条形码扫描枪而安装的；这些设备通过无线方式连接到商店服务器。许多这些系统只能使用
    WEP 并且无法升级，并且鉴于已投入的资金，公司通常升级缓慢。进一步复杂化问题并导致自满的是，当时商店必须满足支付卡行业（PCI）安全标准才能被允许接受信用卡和借记卡。对
    TJX 升级其无线安全至 WPA 提出了建议；然而，从公司电子邮件来看，升级似乎被推迟了，以换取不更换设备所带来的成本节约。

