    Photos are probably one of the more interesting targets, particularly as potential
    blackmail material or as a curiosity. Photos taken with the phone can be found
    in the /private/var/mobile/Media/DCIM folder, usually under a directory named
    100APPLE or another similarly named directory. Files are simple JPEGs and can
    be viewed with most image viewers, and as Figure 7.5 shows, they are owned by
    user mobile, thus reinforcing that changing the password on the mobile user is
    important as well.


    At this point, an attacker can download a great deal of private content; however,
    the attack relies on a persistent connection and can take time to download all
    interesting content. Obviously much can be scripted to speed things up, but there
    is also the other problem that our target may not be connected to the local network
    at the airport, hotel, or wherever he or she is being attacked.


    iPhones have an interesting behavior. As noted in Chapter 2, 802.11 Wireless –
    Client Attacks, some devices are very persistent in advertising for and about
    connecting to networks in their preferred list. iPhones in particular seem to
    have been designed to do this almost forcefully.'
  - "[PAGE 127]\n\nWithin the Wi-Fi networking menu of the iPhone, there is a note\
    \ at the bottom of the menu that states “Known networks will be joined automatically.\
    \ If no known networks are available, you will be asked before joining a new network.”\
    \ Since these are hybrid devices, they have the ability to connect to the Internet\
    \ over a 3G connection as well. This obviously will incur costs to the user and\
    \ as a courtesy, the OS is designed to use the 3G as a connection of last resort.\
    \ Simply put, the system will check if a Wi-Fi connection that it has been connected\
    \ to before is present. If it is, it will automatically join it and use that network.\
    \ If one does not exist, then if there are any around, the user is offered the\
    \ opportunity to connect to one of those networks. If none exist or the user cannot\
    \ or declines to connect, then the 3G connection is used. All of this is provided\
    \ that the Wi-Fi connection is enabled in the first place.\n\nThis creates the\
    \ interesting situation for an attacker. Since the iPhone favors Wi-Fi connections\
    \ and is constantly searching for home networks and will automatically connect\
    \ without user prompt, an attacker can easily take advantage of this.\n\nUsing\
    \ tools from Chapter 2, 802.11 Wireless – Client Attacks, such as KarMetasploit,³\
    \ it is trivial to setup a fake access point that responds to any probe request\
    \ and emulates the networks on the preferred list of the iPhone. Once the iPhone\
    \ connects, it is silently given an IP address and now the attack has a direct\
    \ connection to the device with no user interaction. The wireless community has\
    \ found that the iPhone is one of the easiest devices to exploit this behavior\
    \ on.\n\nThe problem of intermittent connections due to the device being put in\
    \ standby is strangely solved by the environment the attack takes place under.\
    \ Most iPhone users are not using their devices constantly. They use them for\
