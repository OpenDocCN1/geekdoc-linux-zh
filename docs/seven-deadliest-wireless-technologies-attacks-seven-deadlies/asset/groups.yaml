    对攻击者来说是个问题，因为范围有限且目标池很小。你还必须知道他们会访问哪个网站，但如果你处于一种希望所有内容都解析到某个特定网站的情况（也许是利用扩展的浏览器漏洞或其他恶意软件），或者如果你在会议或某些活动中知道与会者很可能会访问某个网站查看日程等，这可能会造成非常大的破坏。另一种选择不是传播恶意软件，而是传播错误信息。想象一下针对银行家会议并重写所有新站点的
    DNS 请求，以显示关于经济崩溃的假新闻故事。由此引发的恐慌可能对攻击者有用，或者至少对某人来说是幽默的。


    注入攻击仅受攻击者想象力的限制。潜在的损害可能是明显的，也可能是微妙的。将恶意软件注入并带回安全网络的能力可能是这些微妙攻击中最令人担忧的。


    防止这些攻击的常规方法通常归结为“使用 VPN”。


    该方法的问题在于，许多公共热点使用访客门户，你需要在建立 VPN 隧道之前输入登录信息。这就需要通过未加密的链接连接到接入点和访客门户。即使访客门户启用了
    SSL，访问登录页面通常也是通过将你在浏览器中查看的任何页面的 DNS 重定向到访客门户的域名来完成的。这足以形成注入内容的漏洞，因为初始连接可能被劫持并且重定向被忽略。


    正如 Karma 在 2008 年集成到 Metasploit 中一样，Airpwn 也在 2009 年底集成到 Metasploit 中。这意味着 Airpwn
    现在被一个框架所包围，该框架将使构建注入内容变得容易，并且还能利用现有漏洞攻击客户端。这一结果希望意味着人们会更加关注，使用公共热点或任何未加密的网络可能对安全网络构成重大威胁，即使在攻击者离开很久之后也是如此。


    ## SUMMARY


    虽然所有这些看起来令人沮丧，但这是无线便利性的不可避免的代价。虽然对现代生活不可或缺，但无线网络远非有线网络那样成熟的技术。说服人们甚至连接一个基本防火墙将它们与互联网隔离开来花了多年时间；认为无线安全在改善之前还需要一段时间并不算不合理。就像大多数事情一样，当系统在接入点被锁定后，攻击者只是转移了重点并找到了另一个弱点。


    关注使用开放网络的危险是解决问题的第一步。虽然使用防止不安全连接的限制性安全策略很不方便，但这将帮助用户保护他们自己。此外，转向更强大和智能的客户端管理器也可以帮助提醒用户注意危险，防止他们做明显危险的事情。最后一种显而易见但经常不被采取的措施是关闭无线，并在可能时使用有线连接。搞砸有线连接比搞砸无线连接要困难得多。


    简而言之，避免对无线客户端进行攻击的最佳方法如下


    - 随时避免使用开放接入点，尤其是在公共场所。

    - 在可能的情况下，选择有线连接。

    - 如果你正在使用有线连接，请禁用你的无线适配器。

    - 设置防火墙并仅允许你需要的服务。

    - 避免通过无线网络发送个人或财务信息。

    - 考虑为旅行使用“一次性”笔记本电脑，在重新连接到公司网络之前对其进行擦除和重新安装。

    - 始终警惕你所连接的内容可能不是你认为的那样。


    ## Endnote


    1. www.wigle.net/gps/gps/main/ssidstats；[检索于 01.12.09]。


    本页特意留空


    ## Bluetooth Attacks


    蓝牙攻击


    ### INFORMATION IN THIS CHAPTER


    本章信息


    - 蓝牙技术

    - 攻击蓝牙

    - 连接

    - 大规模嗅探

    - 蓝牙病毒


    蓝牙是那些变得如此普遍以至于成为我们日常生活一部分的技术之一。它已成为解决诸如开车时使用手机通话等问题的解决方案，并为攻击引入了新的有趣营销机会。


    一种有趣的骗局出现了，它结合了蓝牙攻击和对付费率服务的创造性使用。其有效性最近有所减弱，但其影响很有趣。


    想象一下，一名通勤者每晚乘火车回家。当他或她穿过火车站时，他或她担心的是能否按时回家吃晚饭，而不是担心口袋里的手机被骗。攻击者坐在候车区附近，扫描空中寻找正在广播的蓝牙设备。他或她发现了我们通勤者口袋里的手机，并且由于安全选择不当，能够使用通用或默认
    PIN 码连接到它。从那里，攻击者指示手机静默拨打一个号码，该号码保持连接，直到通勤者注意到电话并将其视为意外，或因电池耗尽或服务中断而中断通话。攻击者在通勤者的手机账单寄来一个月后才赚到钱。被拨打的号码是攻击者拥有的付费线路，每分钟收取高额费用（$3.99
    或类似数字）。受害者的手机拨打了该号码，并在当晚回家的路上按分钟计费。在 45 分钟的火车旅程中，这笔费用可能增长到数百美元，全部进入攻击者的口袋。


    ### BLUETOOTH TECHNOLOGY


    蓝牙技术


    蓝牙最初的需求是作为一种清理桌面和减少线缆的方法，通过成为连接许多设备到计算机所需的常见 RS232 电缆的替代品。能够同时将一个设备连接到多个其他设备以及能够自动重连的能力，对于厌倦了为每台设备处理许多不同线缆的消费者来说是一个非常令人兴奋的前景。需要一种单一的无线方法来清理杂乱。


    蓝牙实际上并不是一种协议，而是一套封装在协议栈中的协议和功能。蓝牙工作在 2.4 GHz ISM 频段，与 802.11b/g/n Wi-Fi 使用同一频段；然而，由于发射功率和范围较低，实质性干扰相对较少。


    蓝牙设备分为三个等级。每个等级都是为特定应用和情况而设的，但在兼容性方面它们都相同。你可以购买的大多数售后蓝牙适配器是 Class 1 或 2。Class
    3 保留给键盘和鼠标等小型设备，这些设备肯定会靠近它们所连接的计算机。表 3.1 显示了每个等级的相对功率和范围。


    蓝牙也经历了一些修订，存在多个版本的协议。蓝牙 1.2 和 2.0 + 增强数据速率（EDR）在市场上最常见，你不太可能遇到 1.0、1.0B 或 1.1
    设备，除非是在某些旧版和早期设备上。


    蓝牙 1.2 支持大约 725 Kbps 的吞吐量，这足以用于鼠标、键盘、打印机、耳机等。 culminating in Bluetooth 2.0 的标准修订包括
    EDR，这将兼容设备的最大吞吐量提高到 3 Mbps，适用于照片或音乐文件等较大数据。


    最近，蓝牙特别兴趣小组（SIG）采用了蓝牙 3.0 的核心规范。该规范可与许多产品中的 802.11 无线电配合使用，最大吞吐量为 24 Mbps。基于该规范的实际产品应在
    2010 年初上市。


    表 3.1 蓝牙适配器等级


    | 类别 | 传输功率 | 有效范围 | 常见于 |

    |---|---|---|---|

    | Class 1 | 100 mW | 100 m | 外部 USB 适配器带外置天线 |

    | Class 2 | 2.5 mW | 10 m | 内部笔记本适配器 |

    | Class 3 | 1 mW | 1 m | 手机、耳机、键盘 |

    '
