  - "[PAGE 48]\n\n> **NOTE**\n> \n> Although improvements to clients, such as Windows\
    \ Zero Config, have made it slightly harder to get completely automated connections\
    \ from modern Windows operating systems (OSes), there are a lot of other devices\
    \ still very vulnerable to this kind of situation. Cell phones now feature Wi-Fi\
    \ capabilities, smart phones, MP3 players – even things as digital picture frames\
    \ and game consoles use Wi-Fi and can be coaxed to connect to an attacker. Threats\
    \ are not always apparent.\n\nAttackers consider one of the best environments\
    \ for these sorts of attacks to be 6 miles in the air. Who has not been on an\
    \ airplane, particularly long-haul flights to business centers, such as London\
    \ or New York, where as soon as the seat belt sign is turned off, laptops come\
    \ out and everyone from corporate executive types to vacationing surfer dudes\
    \ pull out their laptops to do some work, watch a movie, or play games? More often\
    \ than not, they ignore the flight staff and Federal Aviation Administration (FAA)\
    \ warnings about wireless devices in flight and do not disable their Wi-Fi adapters\
    \ (which still drain power from limited batteries) and they continue to probe\
    \ for networks.\n\n> **WARNING**\n> \n> Unless the flight crew specifically allows\
    \ wireless (that is, the flight has in-flight Wi-Fi), it is generally forbidden\
    \ by many countries’ federal laws to use Wi-Fi or any wireless devices in flight.\
    \ Keep that in mind. However, the chances of Wi-Fi interfering with flight systems\
    \ are terribly small. If it was a true danger, in-flight Wi-Fi would not be allowed\
    \ and laptops in general would be banned, since planes falling out of the sky\
    \ because passengers booted Windows and forgot to disable their Wi-Fi cards is\
    \ not a good situation to have. In general, the regulations are in place as a\
    \ precautionary measure and are a good idea because 6 miles above the earth and\
    \ traveling 500 miles an hour is not a normal situation for humans, and gravity\
    \ is a harsh mistress.\n\nWhile a few airlines offer in-flight Wi-Fi service (those\
    \ are ripe for a whole other set of attacks), most do not. The environment of\
    \ a plane is perfect for attacking wireless. Sounds strange, but consider that\
    \ there are no other networks around, so if you bring up your own using Karma\
    \ or a similar tool, you will be the only network they see. Being in a long metal\
    \ tube over an ocean also limits any interference, so you’ll often find that from\
    \ cattle class at the back of the plane, you can catch probing clients in first\
    \ class. Once they have connected to you and you as an attacker hand them an address,\
    \ you now have a direct connection to their computer. You may not be able to provide\
    \ any Internet access, but you can poke and prod at their system for hours on\
    \ end without it seeming strange that you have a laptop open as well.\n\nThe “Hacking\
    \ the Friendly Skies” presentations from Simple Nomad and anecdotal evidence from\
    \ various wireless message boards indicate that a surprisingly large number of\
    \ devices are not running a software firewall or seemingly any protection from\
    \ other clients on the local area network (LAN). Open shares with corporate documents,\
    \ to vulnerable applications ready to be taken over. A well-prepared"
