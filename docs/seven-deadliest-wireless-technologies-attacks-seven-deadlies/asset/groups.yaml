- raw:
  - "[PAGE 82]\n\nThe idea is that the difficulty and an attacker's level of commitment\
    \ to the attack increase with each additional method. A password can be guessed\
    \ remotely, but a password with a hardware token is much harder. Now an attacker\
    \ has to physically interact with the victim, something most common attackers\
    \ have no interest in. Using all three means that the attacker must have the password,\
    \ the hardware token, and the biometric all present to authenticate, a fairly\
    \ daunting proposition for all but the most dedicated attacker.\n\n> TIP\n> \n\
    > Some biometric systems use voice prints to identify a user. A person's voice\
    \ can change over time, be affected by a cold, even by their mood, or by what\
    \ they had for lunch. As such, to avoid high failure rates, these systems often\
    \ have their tolerances tuned down, sometimes to the point where a recording of\
    \ the user's voice will suffice to authenticate with the system. For obvious reasons,\
    \ in high-security situations, this may be undesirable.\n> \n> Any biometric system\
    \ selected should take into consideration the failure rates and issues associated\
    \ with a system and their suitability to the expected application.\n\nProximity\
    \ cards' main failure is that they are usually a single factor form of authentication,\
    \ namely the unique identification number. This means that, barring any other\
    \ methods, an attacker just has to present the unique identifier to the reader\
    \ to gain access. There is nothing that ties the unique identifier to the person\
    \ it was issued to and whose access we are impersonating. There is also nothing\
    \ in this type of system that ties the identifier to the proximity card it is\
    \ expected to be on.\n\n# Cloning RFID\n\nSince RFID proximity cards are wireless\
    \ based, this gives an attacker an advantage over something like a physical key.\
    \ Unlike a physical key that you would need to physically remove from the victim\
    \ to copy. The wireless nature of the proximity cards means that they can be read\
    \ at a distance and do not need to be removed.\n\nA large number of proximity\
    \ card systems in use today, particularly older installations, only use a simple\
    \ numeric identifier to authenticate. There is no encryption or any verification\
    \ done on the card, other than to check the number received against a back-end\
    \ system. This also means that there is no authentication by the card of the reader\
    \ that is interrogating it. It will respond to any compatible reader and present\
    \ its numeric identifier to it. This is very useful for an attacker since they\
    \ can simply wave a reader past a pocket or purse of their victim and the card\
    \ hands off the identifier. The attacker can then take this information and write\
    \ his or her own copy of the card to use as they see fit.\n\nIn 2003, an engineer\
    \ by the name of Johnathan Westhues took to tinkering with proximity cards and\
    \ understanding how they work. Through his efforts, he was able"
  - '[PAGE 83]


    to reverse engineer the protocol of the Motorola flexpass and understand what
    was being transmitted by the card and how it interacted with the reader. He continued
    his efforts and began to build a card simulator in order to interact with readers
    and understand how the cards worked. After a while and after some revisions, he
    built his own combination reader and card simulator, since both share many of
    the same parts. The device, called the proxmark, is not much larger than a credit
    card and only twice as thick and is dead simple to operate. It consists of two
    buttons, one for "reader mode" and one for "card mode." "Reader mode" turns the
    unit into a 125-kHz RFID tag reader that you can hold by any compatible tag and
    it will read its unique identifier and store it in memory. The "card mode" button
    simply replays the stored tag information. This means that he could walk up to
    someone and surreptitiously scan the contents of their proximity card, walk over
    to the secure door and replay their card, whereupon he would be granted access
    as if he had presented the real card.


    Over the next several years, he has revised his device and greatly improved its
    capabilities. As of February 2009, the Proxmark 3 is the latest revision and supports
    most 125-kHz and 13.56-MHz tags (the two most common frequencies) and can read
    and emulate most any ID-only tag out there.


    > **NOTE**

    > All of the schematics, bills of materials, and designs for the Proxmark are
    available on Johnnathan''s Web site at http://cq.cx, if you want to build one
    yourself. If you are not inclined to build one yourself, completed devices are
    for sale at http://proxmark3.com/. A warning though that in most jurisdictions,
    cloning a card that you are not otherwise already authorized to have is probably
    illegal. You should only experiment on systems and cards you own or have express
    permission to experiment on.


    The existence and availability of this device now means that an attacker can now
    clone many common proximity cards and simply replay them to gain access. There
    is still the issue of how to get to where we need to go in a building. If we are
    after secret research or something as valuable, its access is likely to be restricted
    to a few specific employees. This means that we cannot simply clone just anyone''s
    card, we need to be sure to get one that will get us access to the area we need
    to in order to do our dastardly deed.


    Role-based systems that allow granular access to certain areas seem like a decent
    way to limit employee access. They can only have access to where they need to
    be and can even limit access to certain times. However, an attacker can often
    use this to his/her advantage.


    Optimally, these roles would be rigid. Only people with a real need to access
    a certain area would be granted access, and it would be strictly enforced. However,
    most businesses are a bit more political and pragmatic than that. Typically, those
    with legitimate access will have no limits on their access hours in case they
    work late, assistant staff may need to get access to do things on behalf of their
    bosses.


    In a perfect world, Owner/CEO/Head honchos of the business have no real reason
    to go into some areas: their employees report things to them, and they don''t
    need to'
  - '[PAGE 84]


    actually go there themselves. People in these positions, however, tend to not
    like the idea of being locked out of anything or any limits put on them, and as
    such, their access is usually unrestricted and covers most, if not all, of areas
    and times.


    As an attacker, we can use this by targeting the bosses and cloning their identifier.
    It can be as simple as sharing an elevator or in line for coffee. Sometimes, this
    does pose a problem though since the bosses of some organizations are not easy
    to access.


    There is one person, however, who will tend to have complete or nearly complete
    access to a facility: the janitorial staff. Just about any office has a cleaning
    staff who take out the trash, wash floors, and so on, typically at night; these
    people need to have their own access to enter areas to clean them. As an attacker,
    it''s probably a lot easier to bribe or steal a janitor''s identifier than the
    CEO''s. One could walk up to a janitor as he is coming on duty and shaking his
    hand, and thank him for a good job, while your other hand silently clones the
    contents of the proximity card. Later that night, you can return and move about
    the building freely by simply replaying the janitor''s card.


    In either scenario, the audit logs (if any) will show the victim of the cloning
    as the one moving about the building. At worst (as an attacker), this will show
    the path you moved through the building. At best, it will direct the blame for
    your activities to the victim and away from you.


    # Minimizing the Risk


    While it is possible to clone ID-only chips, that is by no means the complete
    end to using them for physical access control, but it did mean that it was not
    reliable as a stand-alone system. Many things can be improved in order to increase
    security of these systems.


    One of the first methods to improve security is to actually audit the logs. Often,
    logs are ignored until something happens and then they are cursed for not being
    complete enough. Taking the time to evaluate if everything is being captured that
    you would need in a crisis will go a long way. In addition, automated auditing
    and alerts of the logs can be very useful in spotting inconsistencies and potential
    problems. If the enforcement of access controls is tight enough (scanning on both
    entrance and exit of a door), you can monitor for unusual activity such as Bob
    entering the building twice, or Bob''s card being used at opposite ends of the
    building when there''s no way he could have traveled that far. You can also look
    for situations where people are deviating from their normal schedules. A secretary
    should generally not be in the building at 3 A.M. Automated monitoring of the
    logs and alerts can help stop something before it starts.


    In addition to auditing the logs, audit the enrolled cards. Periodically verify
    that only current employees are in the system and that access is as it should
    be. Employees who leave the organization should have their access immediately
    disabled but in case that does not always happen, periodic audits will help catch
    those situations. Also audit for test cards, often a new system will have one
    or several test cards issued with full access for the installers and administrators
    to test the system and make sure that readers work, doors open, and so on. Often,
    these identifications are not removed'
  md: "\nThe idea is that the difficulty and an attacker's level of commitment to\
    \ the attack increase with each additional method. A password can be guessed remotely,\
    \ but a password with a hardware token is much harder. Now an attacker has to\
    \ physically interact with the victim, something most common attackers have no\
    \ interest in. Using all three means that the attacker must have the password,\
    \ the hardware token, and the biometric all present to authenticate, a fairly\
    \ daunting proposition for all but the most dedicated attacker.\n\n> TIP\n> \n\
    > Some biometric systems use voice prints to identify a user. A person's voice\
    \ can change over time, be affected by a cold, even by their mood, or by what\
    \ they had for lunch. As such, to avoid high failure rates, these systems often\
    \ have their tolerances tuned down, sometimes to the point where a recording of\
    \ the user's voice will suffice to authenticate with the system. For obvious reasons,\
    \ in high-security situations, this may be undesirable.\n> \n> Any biometric system\
    \ selected should take into consideration the failure rates and issues associated\
    \ with a system and their suitability to the expected application.\n\nProximity\
    \ cards' main failure is that they are usually a single factor form of authentication,\
    \ namely the unique identification number. This means that, barring any other\
    \ methods, an attacker just has to present the unique identifier to the reader\
    \ to gain access. There is nothing that ties the unique identifier to the person\
    \ it was issued to and whose access we are impersonating. There is also nothing\
    \ in this type of system that ties the identifier to the proximity card it is\
    \ expected to be on.\n\n## Cloning RFID\n\nSince RFID proximity cards are wireless\
    \ based, this gives an attacker an advantage over something like a physical key.\
    \ Unlike a physical key that you would need to physically remove from the victim\
    \ to copy. The wireless nature of the proximity cards means that they can be read\
    \ at a distance and do not need to be removed.\n\nA large number of proximity\
    \ card systems in use today, particularly older installations, only use a simple\
    \ numeric identifier to authenticate. There is no encryption or any verification\
    \ done on the card, other than to check the number received against a back-end\
    \ system. This also means that there is no authentication by the card of the reader\
    \ that is interrogating it. It will respond to any compatible reader and present\
    \ its numeric identifier to it. This is very useful for an attacker since they\
    \ can simply wave a reader past a pocket or purse of their victim and the card\
    \ hands off the identifier. The attacker can then take this information and write\
    \ his or her own copy of the card to use as they see fit.\n\nIn 2003, an engineer\
    \ by the name of Jonathan Westhues took to tinkering with proximity cards and\
    \ understanding how they work. Through his efforts, he was able to reverse engineer\
    \ the protocol of the Motorola flexpass and understand what was being transmitted\
    \ by the card and how it interacted with the reader. He continued his efforts\
    \ and began to build a card simulator in order to interact with readers and understand\
    \ how the cards worked. After a while and after some revisions, he built his own\
    \ combination reader and card simulator, since both share many of the same parts.\
    \ The device, called the proxmark, is not much larger than a credit card and only\
    \ twice as thick and is dead simple to operate. It consists of two buttons, one\
    \ for \"reader mode\" and one for \"card mode.\" \"Reader mode\" turns the unit\
    \ into a 125-kHz RFID tag reader that you can hold by any compatible tag and it\
    \ will read its unique identifier and store it in memory. The \"card mode\" button\
    \ simply replays the stored tag information. This means that he could walk up\
    \ to someone and surreptitiously scan the contents of their proximity card, walk\
    \ over to the secure door and replay their card, whereupon he would be granted\
    \ access as if he had presented the real card.\n\nOver the next several years,\
    \ he has revised his device and greatly improved its capabilities. As of February\
    \ 2009, the Proxmark 3 is the latest revision and supports most 125-kHz and 13.56-MHz\
    \ tags (the two most common frequencies) and can read and emulate most any ID-only\
    \ tag out there.\n\n> **NOTE**\n> All of the schematics, bills of materials, and\
    \ designs for the Proxmark are available on Jonathan's Web site at http://cq.cx,\
    \ if you want to build one yourself. If you are not inclined to build one yourself,\
    \ completed devices are for sale at http://proxmark3.com/. A warning though that\
    \ in most jurisdictions, cloning a card that you are not otherwise already authorized\
    \ to have is probably illegal. You should only experiment on systems and cards\
    \ you own or have express permission to experiment on.\n\nThe existence and availability\
    \ of this device now means that an attacker can now clone many common proximity\
    \ cards and simply replay them to gain access. There is still the issue of how\
    \ to get to where we need to go in a building. If we are after secret research\
    \ or something as valuable, its access is likely to be restricted to a few specific\
    \ employees. This means that we cannot simply clone just anyone's card, we need\
    \ to be sure to get one that will get us access to the area we need to in order\
    \ to do our dastardly deed.\n\nRole-based systems that allow granular access to\
    \ certain areas seem like a decent way to limit employee access. They can only\
    \ have access to where they need to be and can even limit access to certain times.\
    \ However, an attacker can often use this to his/her advantage.\n\nOptimally,\
    \ these roles would be rigid. Only people with a real need to access a certain\
    \ area would be granted access, and it would be strictly enforced. However, most\
    \ businesses are a bit more political and pragmatic than that. Typically, those\
    \ with legitimate access will have no limits on their access hours in case they\
    \ work late, assistant staff may need to get access to do things on behalf of\
    \ their bosses.\n\nIn a perfect world, Owner/CEO/Head honchos of the business\
    \ have no real reason to go into some areas: their employees report things to\
    \ them, and they don't need to actually go there themselves. People in these positions,\
    \ however, tend to not like the idea of being locked out of anything or any limits\
    \ put on them, and as such, their access is usually unrestricted and covers most,\
    \ if not all, of areas and times.\n\nAs an attacker, we can use this by targeting\
    \ the bosses and cloning their identifier. It can be as simple as sharing an elevator\
