    Aireplay displays output similar to Figure 1.9, substituting your target addresses,
    of course.


    Once you have a valid four-way handshake, you can start the cracking process.
    The nice part of this attack is that all it requires is the handshake, which can
    be'
  - '[PAGE 37]


    captured passively in a few seconds if you are lucky. The rest of the attack can
    take place offline elsewhere and does not require the target network.


    > TIP

    > Capturing a complete 4-way hash is trickier than it sounds. Differences in client
    managers, AP behaviors, and even being on the edge of range can lead to incomplete
    captures. If you are having trouble in capturing a complete handshake (if coWPAtty
    is reporting so), try adjusting your location relative to the AP and the client
    and try again. All else fails, wait for a client to log in normally as some clients
    behave oddly on reassociation after being deauthenticated.


    CoWPAtty only needs a few pieces of information to begin the attack once the data
    has been collected – in this case, the wpa2psk-linksys.dump capture file:


    ```

    cowpatty -r wpa2psk-linksys.dump -f dict -s linksys

    ```


    In this case the capture file, which is wpa2psk-linksys.dump, the dictionary file,
    dict, and the SSID of the network we are attacking, in this case, linksys. CoWPAtty
    will parse the capture file, and if there is a complete handshake, the crack will
    begin; otherwise, it will report that the handshake is incomplete and you should
    try to reacquire it. If you have a complete handshake, coWPAtty sets about computing
    each word in the dictionary through the PBKDF2 algorithm with the specified SSID
    and comparing the output to the capture. If they match, it reports the successful
    passphrase. If not, it moves on to the next one. Figure 1.10 shows that the PSK
    on this network was dictionary.


    Depending on the CPU you are using and the size of the dictionary, the length
    of time to run through the list will vary. If there is a match, however, coWPAtty


    ![](img/fa764b70be0fdcb44b75286d4f8589e2_37_0.png)


    # FIGURE 1.10


    CoWPAtty Successfully Retrieves the Passphrase'
  - "[PAGE 38]\n\nwill report the dos success. In Figure 1.10, the CPU could work\
    \ through approximately 100 passphrases per second and went through the fairly\
    \ short dictionary (approximately 10,000 words) in 37 s. If this is an SSID that\
    \ you audit regularly, you may not want to spend all the CPU time each time you\
    \ want to run through this same list. In that case, you will want to save the\
    \ output in a lookup table.\n\n> **EPIC FAIL**\n> \n> CoWPAtty expects the dictionary\
    \ to be a simple list of words in UNIX text file format as opposed to DOS formatted.\
    \ DOS-formatted text has a hidden control character at the end of each word, whereas\
    \ the UNIX format does not. If you feed coWPAtty a DOS-formatted list, its parser\
    \ includes the hidden control character as part of the passphrase and is computed\
    \ as such. So the passphrase of \"password\" used in the list will actually be\
    \ computed as \"password.\" and of course, the resulting hash will not match the\
    \ capture for a network using the passphrase \"password.\" The Church of Wi-Fi\
    \ had this happen to them twice in the course of generating their tables, and\
    \ they had to throw out months of work.\n\nThe mathematics behind the lookup table\
    \ is exactly the same as running a \"live\" crack, except instead of comparing\
    \ to a capture file, the hashed version of the word and its plaintext version\
    \ are written to a file. That file can then be looked at later to quickly look\
    \ for matches. To generate your own lookup table, coWPAtty comes up with the program,\
    \ genpmk:\n\n```\n```\ngenpmk -f dict -s linksys -d linksys.hash\n```\n```\n\n\
    Genpmk takes a word list (dict), network SSID (linksys), and outputs the resulting\
    \ hashes to a file (linksys.hash). This process takes just about as long as running\
    \ coWPAtty directly on the capture as the time taken between Figure 1.10 and Figure\
    \ 1.11; however, this file can then be fed back into coWPAtty for much faster\
    \ lookups on subsequent tests.\n\nThe most likely times you will want to compute\
    \ a hash file is if you know the target ahead of time and want to spend off hours\
    \ (night time or other idle CPU time) to give yourself a time advantage onsite\
    \ (spend the time now to save it onsite) or if you repeat the same operations\
    \ over and over and want to save the time by investing it only once and saving\
    \ the output for later use. If it takes you an hour to compute through a word\
    \ list, rather than spend that hour each visit, if you do it once and save the\
    \ output, you can effectively save an hour each time. Once you have a hash file\
    \ generated, you can enter it in place of, or in addition to, a dictionary. CoWPAtty\
    \ will quickly look through the hash file for matches. If none is found, it will\
    \ report the failure, or if you specified a word list, it will begin the CPU intensive\
    \ crack with that list. If you look at the speed of the crack between Figure 1.10\
    \ and Figure 1.12, you will see the marked improvement in speed:\n\n```\n```\n\
    cowpatty -r wpa2psk-linksys.dump -d linksys.hash -s linksys\n```\n```"
