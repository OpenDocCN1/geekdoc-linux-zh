  mdcn: "\n思路是，随着每增加一种方法，攻击的难度和攻击者对攻击的投入程度都会增加。密码可以远程猜测，但带硬件令牌的密码就困难得多。现在攻击者必须与受害者进行物理接触，而大多数普通攻击者对此毫无兴趣。使用全部三种方式意味着攻击者必须同时拥有密码、硬件令牌和生物识别信息才能进行身份验证，这对除最执着的攻击者之外的所有人来说都是相当令人望而却步的提议。\n\
    \n> 提示\n> \n> 一些生物识别系统使用声纹来识别用户。一个人的声音会随时间变化，受感冒影响，甚至受情绪或午餐内容影响。因此，为了避免较高的失败率，这些系统通常会调低其容差，有时甚至调低到用户的声音录音足以通过系统身份验证的程度。显然，在高安全性的情况下，这可能是不可取的。\n\
    > \n> 所选的任何生物识别系统都应考虑系统相关的失败率和问题，以及它们对预期应用的适用性。\n\n近距离卡的主要缺陷是它们通常是一种单因素身份验证形式，即唯一的识别号码。这意味着，除其他方法外，攻击者只需向读卡器出示唯一标识符即可获得访问权限。没有任何东西将唯一标识符与发卡对象以及我们冒充其访问权限的人联系起来。这种类型的系统中也没有任何东西将标识符与其预期的近距离卡绑定。\n\
    \n## 克隆 RFID\n\n由于 RFID 近距离卡基于无线，这使攻击者相比于物理钥匙等具有优势。与物理钥匙不同，复制物理钥匙需要从受害者那里物理取走。近距离卡的无线特性意味着它们可以在远距离读取且无需取下。\n\
    \n目前使用的大量近距离卡系统，特别是较旧的安装，仅使用简单的数字标识符进行身份验证。卡上没有加密或任何验证，除了将接收到的号码与后端系统进行核对。这也意味着卡不会对正在\
    \ interrogate 它的读卡器进行身份验证。它会响应任何兼容的读卡器并向其提供其数字标识符。这对攻击者非常有用，因为他们只需将读卡器在受害者的口袋或钱包旁挥一下，卡就会交出标识符。攻击者随后可以获取这些信息并制作自己的卡副本以供其使用。\n\
    \n2003 年，一位名叫 Jonathan Westhues 的工程师开始研究近距离卡并了解其工作原理。通过他的努力，他能够逆向工程 Motorola flexpass\
    \ 的协议并了解卡传输的内容以及它如何与读卡器交互。他继续努力并开始构建卡模拟器以与读卡器交互并了解卡的工作原理。经过一段时间和多次修改后，他自制了组合读卡器和卡模拟器，因为两者共享许多相同的部件。该设备名为\
    \ proxmark，大小不比信用卡大多少，仅厚两倍，且操作极其简单。它由两个按钮组成，一个用于“reader mode”，一个用于“card mode”。“Reader\
    \ mode”将设备变成 125-kHz RFID 标签读卡器，你可以将任何兼容标签靠近它，它会读取其唯一标识符并将其存储在内存中。“card mode”按钮仅重放存储的标签信息。这意味着他可以走到某人身边暗中扫描其近距离卡的内容，走到安全门前重放该卡，随后就会像出示真卡一样获得访问权限。\n\
    \n在接下来的几年里，他不断修改设备并大幅提升其能力。截至 2009 年 2 月，Proxmark 3 是最新版本，支持大多数 125-kHz 和 13.56-MHz\
    \ 标签（两种最常见的频率），并且可以读取和模拟几乎所有仅 ID 标签。\n\n> **注意**\n> Proxmark 的所有原理图、物料清单和设计都可在\
    \ Jonathan 的网站 http://cq.cx 上获取，如果你想自己制作。如果你不想自己制作，成品设备可在 http://proxmark3.com/\
    \ 购买。不过要警告的是，在大多数司法管辖区，克隆你本无权拥有的卡很可能是非法的。你应仅在自己拥有或已明确获得实验许可的系统和卡上进行实验。\n\n该设备的存在和可用性现在意味着攻击者可以克隆许多常见的近距离卡并简单重放以获得访问权限。仍然存在如何到达建筑物内所需位置的问题。如果我们要获取秘密研究或同样有价值的东西，其访问权限很可能仅限于少数特定员工。这意味着我们不能简单克隆任何人的卡，我们需要确保获取一张能让我们进入所需区域以实施恶行的卡。\n\
    \n基于角色的系统允许对特定区域进行细粒度访问，似乎是限制员工访问的合理方式。他们只能访问所需位置，甚至可以限制访问时间。然而，攻击者通常可以利用这一点为己所用。\n\
    \n理想情况下，这些角色应该是严格的。只有真正需要访问特定区域的人才会被授予访问权限，并且会严格执行。然而，大多数企业比这更政治化、更务实。通常，具有合法访问权限的人在加班情况下不会有访问时间限制，助理员工可能需要获得访问权限以代表其老板处理事务。\n\
    \n在理想世界中，企业的所有者/CEO/高层主管没有理由进入某些区域：他们的员工会向他们汇报，他们本人不需要亲自前往。然而，处于这些职位的人通常不喜欢被锁在任何东西之外或对其施加任何限制，因此他们的访问权限通常是\
    \ unrestricted，涵盖大多数甚至全部区域和时间。\n\n作为攻击者，我们可以通过针对老板并克隆其标识符来利用这一点。这可能简单到共乘电梯或排队买咖啡。不过有时这会带来问题，因为某些组织的领导并不容易接触。\n\
    \n然而，有一个人往往会拥有对设施的完全或几乎完全的访问权限：清洁人员。几乎任何办公室都有清洁人员，他们负责倒垃圾、洗地板等，通常在夜间工作；这些人需要有自己的访问权限以进入区域进行清洁。作为攻击者，贿赂或窃取一名清洁工的标识符可能比\
    \ CEO 的要容易得多。你可以在清洁工上岗时走上前与他握手，感谢他做得好，同时你的另一只手悄悄克隆近距离卡的内容。当晚稍后，你可以返回并通过简单重放清洁工的卡在建筑物内自由活动。\n\
    \n在任何一种情况下，审计日志（如果有）都会显示被克隆的受害者是建筑物内活动的人。最坏的情况下（作为攻击者），这会显示你在建筑物内的移动路径。最好的情况下，这会将你活动的责任指向受害者而远离你。\n\
    \n## 降低风险\n\n虽然可以克隆仅 ID 芯片，但这绝不是使用它们进行物理访问控制的终结，但这确实意味着它们作为独立系统不可靠。许多方面可以改进以提高这些系统的安全性。\n\
    \n提高安全性的首要方法之一就是实际审计日志。日志经常被忽视，直到发生事情后才被诅咒为不够完整。花时间评估在危机中所需的一切是否都被记录下来，将大有裨益。此外，日志的自动审计和警报对于发现不一致和潜在问题非常有用。如果访问控制的执行足够严格（在门的入口和出口都进行扫描），你可以监控异常活动，例如\
    \ Bob 两次进入建筑物，或 Bob 的卡在建筑物两端同时使用，而他不可能在那么远的距离移动。你还可以查找人们偏离正常日程的情况。秘书通常不应在凌晨 3\
    \ 点出现在建筑物内。日志的自动监控和警报可以帮助在事情开始前阻止它。\n\n除了审计日志外，还要审计已注册的卡。定期验证系统中只有当前员工，并且访问权限符合预期。离职员工的访问权限应立即禁用，但在未总是发生的情况下，定期审计有助于发现这些情况。还要审计测试卡，新的系统通常会为安装人员和管理员发放一张或多张具有完全访问权限的测试卡，以测试系统并确保读卡器工作、门打开等。通常，这些标识不会被移除\n"
