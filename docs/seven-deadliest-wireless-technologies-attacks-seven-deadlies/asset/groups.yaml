  mdcn: "\n## 图 1.2\nAirmon-ng 在 Madwifi-ng 卡上的输出\n\n![](img/fa764b70be0fdcb44b75286d4f8589e2_26_0.png)\n\
    \nAirmon-ng 将报告监控模式下接口的名称，看起来类似于图 1.2。\n\n一旦网卡进入监控模式，你就可以收集数据包。套件中用于此目的的程序称为 airodump-ng。可以通过命令行设置许多选项，并在末尾接口名称之前指定：\n\
    \n```\nairodump-ng --channel 3 --write foo ath1\n```\n\n此命令指定 Airodump 在频道 3 上监听（而不是在所有频道之间跳频），将捕获的数据写入以\
    \ \"foo\" 为前缀的文件，并使用接口 ath1，即来自 Airmon-ng 的监控模式接口。如果你对 Airodump 或套件中任何程序的其他选项感兴趣，只需使用\
    \ -help 开关运行它即可。\n\n一旦运行，你应该会看到网络开始填充列，数据包计数开始上升。图 1.3 显示了一个正在被捕获的单个网络；然而，如果你处于嘈杂的环境中，可能会出现更多网络。\n\
    \n如果一切运行正常，你应该会在显示中看到一个或多个网络列出。希望你的目标是其中之一。上部列出了当前活动的 AP 以及关于它们的一些基本信息。下部列出了客户端设备及其关联。\n\
    \n根据网络上已有的流量数量，你可能会开始看到目标的数据列数字开始上升。如果它上升得足够快，在你认为合理的时间内获取 50,000 个数据包，那么就只是等待时间的问题。如果没有流量，或没有客户端，或你只是不耐烦，你可以尝试\
    \ ARP 注入攻击来强制生成更多数据。\n\nAireplay-ng 处理 WEP 的大多数主动攻击。它应与你的捕获程序（如 Airodump-ng）同时运行。它具有许多命令行\n\
    \n![](img/fa764b70be0fdcb44b75286d4f8589e2_27_0.png)\n\n## 图 1.3\nAirodump-ng\
