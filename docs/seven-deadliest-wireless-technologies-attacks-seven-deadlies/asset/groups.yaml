  mdcn: "\n信号强度最高，并且很有可能附近存在一个开放的 Linksys 接入点，客户端会突然发现自己连接到一个与预期不同的网络。\n\n> **NOTE**\n\
    > SSID 是大多数人所称的扩展服务集标识符或 ESSID。它是用户所见的网络的逻辑名称。基本服务集标识符或 BSSID 通常被称为 MAC 地址，因为它与无线接入点的\
    \ MAC 地址相同。\n\nHotspotter 在主模式下监听无线接口。当它听到来自客户端的探测请求时，会检查一份常见的商业热点名称列表，如果找到匹配项，就将自身配置为被请求的接入点，客户端（通常）会自动连接。从此之后，攻击者可以让\
    \ Hotspotter 触发 DHCP 守护进程、端口扫描——他或她想做任何事情。\n\n再次，这种行为一次只能模拟一个目标。如果你攻击的是一个大群体，比如在会议上会遇到的情况，那么你希望能够配置多个被探测的\
    \ SSID，而不仅仅是一个预定的列表。\n\n2004 年，Dino Dai Zovi 和 Shane Macaulay 编写并分发了一个名为 Karma\
    \ 的程序。这正是攻击者长期以来一直在寻找的软件。Karma 的运作方式与 Hotspotter 类似，监听来自客户端的探测广播并作出回复。不同之处在于，他们对\
    \ Linux 下使用的 Madwifi 驱动程序进行了修补，允许动态即时创建对探测的回复。这意味着如果十几个客户端都在探测不同的网络，Karma 就能够动态地对这些探测和关联请求作出回复，无论\
    \ SSID 为何。\n\n对话变得简单如下：\n客户端 1：\"我在找 mycorpnet。你是 mycorpnet 吗？\"\nKarma：\"当然，我就是\
    \ mycorpnet，进来吧。\"\n客户端 2：\"你是 supersecretinjanetwork 吗？我正在找 supersecretninja-network。\"\
    \nKarma：\"为什么不呢？我也是 supersecretinjanetwork，连接到我吧！\"\n一次又一次，等等……\n\nKarma 还附带了一套用于模拟常见服务的工具。如果已连接的客户端正在运行电子邮件客户端，在网络连接建立时它很可能会尝试连接。Karma\
    \ 会看到 POP3 请求并记录登录用户名和密码。如果没有第二张卡提供到互联网的回程，请求就不会通过，但攻击者现在已经获得了你的密码和服务器地址。DNS 请求被重定向、网页请求和其他常见服务也一样。简而言之，攻击者已将自己建立为中间人（也称为\
    \ MitM），可以查看并记录来自多个客户端发送的所有内容，而这些客户端却以为自己在与不同的（真实）网络通信。\n\n> **TIP**\n> \n> 此攻击的成功取决于许多因素，包括信号强度以及网络是否更具吸引力。尝试使用更好的或更定向的天线、更高功率的网卡，或\
    \ simply 靠近目标。经常你会发现自己与房间内的接入点竞争，必须能够压制它。\n> \n> 此外，某些操作系统的最新服务包和更新在连接到开放接入点之前需要用户输入或某种交互，即使它在首选列表中。话虽如此，仍有一些客户端管理器和其他设备在范围内时会自动建立网络连接。\n\
    \n作为对这种新攻击水平的回应，无线客户端厂商收紧了其软件，现在许多设备除非被明确选择（即用户必须“点击连接”）否则不会自动连接。话虽如此，软件仍会列出附近可供选择的网络列表，包括那些被探测过且\
    \ Karma 作出回复的网络，因此粗心的用户可能会看到一个常见的商业热点而认为连接是安全的，却发现自己已连接到一个正在监控其所有通信的攻击者。即使受害者立即意识到有问题并断开连接，损害可能已经造成。今天的许多应用程序，从网页浏览器到电子邮件客户端、Really\
    \ Simple Syndication（RSS）阅读器等，在网络连接时会自动尝试连接，因此一旦受害者连接，这些应用程序就会自动尝试连接，往往在几秒钟内泄露用户名、密码和其他信息。\n\
    \n如果这还不够危险，2008 年 Karma 被集成到 Metasploit 框架中。Metasploit 框架是一种渗透测试工具，可帮助构建和执行漏洞利用，同时还包含数百个现成的漏洞库。该框架通过处理交付机制、有效载荷等的许多常规开销，使这一过程变得简单。撰写本文时，它尚未完全集成，需要一些外部软件运行（用于分配地址的\
    \ DHCP 服务器和用于响应探测的 Airbase-ng），但已处于开发阶段，客户端探测会得到响应，客户端可以连接，框架会记录不安全协议的凭据，如果攻击者愿意，还可以向任何合法请求的网页注入攻击。预计会进一步集成，应能克服需要外部软件的复杂性，提高自动扫描和利用任何连接客户端的能力，从而使这成为攻击者手中极其可怕的工具，但在渗透测试人员手中则是非常有用的工具。\n\
    \n> **NOTE**\n> \n> 尽管客户端的改进，例如 Windows Zero Config，使得从现代 Windows 操作系统（OSes）完全自动连接变得稍微困难，但仍有大量其他设备对这种情况非常脆弱。手机现在具有\
    \ Wi-Fi 功能，智能手机、MP3 播放器——甚至数字相框和游戏机也使用 Wi-Fi，可以被诱导连接到攻击者。威胁并不总是显而易见。\n\n攻击者认为这些攻击的最佳环境之一是在离地\
    \ 6 英里的空中。谁没有坐过飞机，特别是飞往伦敦或纽约等商业中心的长途航班，安全带指示灯一关闭，笔记本电脑就拿出来，从公司高管到度假的冲浪者都在拿出笔记本电脑工作、看电影或玩游戏？更常见的是，他们忽视了机组人员和联邦航空管理局（FAA）关于飞行中无线设备的警告，没有禁用其\
    \ Wi-Fi 适配器（仍会消耗有限的电池电量），并且继续探测网络。\n\n> **WARNING**\n> \n> 除非机组人员明确允许无线（即航班提供机上\
    \ Wi-Fi），一般来说，许多国家的联邦法律都禁止在飞行中使用 Wi-Fi 或任何无线设备。请记住这一点。然而，Wi-Fi 干扰飞行系统的可能性极小。如果这真的是危险，机上\
    \ Wi-Fi 不会被允许，一般笔记本电脑也会被禁止，因为因为乘客启动 Windows 并忘记禁用 Wi-Fi 卡而导致飞机坠落不是一个好情况。总的来说，这些规定是作为预防措施制定的，是一个好主意，因为离地\
    \ 6 英里并以每小时 500 英里的速度飞行对人类来说不是正常情况，而重力是一个严厉的主人。\n\n虽然少数航空公司提供机上 Wi-Fi 服务（那些服务容易受到另一整套攻击），但大多数不提供。飞机的环境非常适合攻击无线。听起来很奇怪，但请考虑一下，周围没有其他网络，所以如果你使用\
    \ Karma 或类似工具建立自己的网络，你将是他们看到的唯一网络。身处长长的金属管中并在海洋上空飞行也限制了任何干扰，因此你经常会发现，从机尾的经济舱可以捕获头等舱的探测客户端。一旦他们连接到你，并且你作为攻击者为他们分配一个地址，你现在就与他们的计算机建立了直接连接。你可能无法提供任何互联网访问，但你可以长时间地探测他们的系统，而不会觉得奇怪你也打开了笔记本电脑。\n\
    \n来自 Simple Nomad 的“Hacking the Friendly Skies”演示以及来自各种无线留言板的轶事证据表明，令人惊讶的大量设备没有运行软件防火墙或似乎没有任何来自本地局域网（LAN）上其他客户端的保护。开放共享包含公司文档，以及易受攻击的、随时可被接管的应用程序。一个准备充分的\n"
