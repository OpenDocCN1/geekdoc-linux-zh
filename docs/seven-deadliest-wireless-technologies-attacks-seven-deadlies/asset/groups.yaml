  - '[PAGE 64]


    which were advertising various profiles such as OBEX file transfer and headset
    capabilities. These devices may be susceptible to various attacks. The final report
    is interesting reading and is available at www.securenetwork.it/bluebag_brochure.pdf.


    Another project to catalog Bluetooth devices has been going on since 2007 in the
    Netherlands. The Bluetooth tracking project (www.bluetoothtracking.org) has set
    up multiple sensors in various parts of the Netherlands and even Paris, France,
    that continually monitor for discoverable devices and record the information in
    a database. Since then, they have collected over 600,000 devices and generated
    some interesting usage statistics. They also have been able to calculate the speed
    at which a device is moving. One sensor detects a device, another a few miles
    away detects it again – from that you can extrapolate the speed at which someone
    was moving and what direction.


    Some devices, as a security measure, do not respond to probes or only have limited
    window of time where the device is discoverable. These devices can cause a bit
    of a problem for the attacker; however, they are not impossible to detect with
    a little coercion and brute force.


    Devices made nondiscoverable still can connect to other devices, except that the
    other device needs to know the BD_ADDR. If Alice wants to connect to Bob and Bob’s
    phone is not discoverable, Alice needs to know Bob’s BD_ADDR before she can connect.
    If she does not know it, Bob needs to make his device discoverable or tell Alice
    his device’s BD_ADDR, and she can enter it (if possible) to specify what to connect
    to. When Bob’s phone sees a directed request to connect to its address, it allows
    the connection to continue.


    From an attacker’s perspective, this makes it much harder to attack Bob’s phone
    since it won’t respond unless the attacker knows the BD_ADDR. It’s unlikely Bob
    would share that with just anyone, but by using some basic information, we can
    potentially find out Bob’s BD_ADDR.


    Programs like Redfang (www.net-security.org/software.php?id=519) written by Ollie
    Whitehouse allow you to force connection requests through a particular address
    space. If we know Bob’s phone make and model, we can either scan a similar model
    to determine its address range or search the IEEE database or BNAP database for
    that manufacturer known addresses. This will get us the likely first 3 bytes of
    the address. The remaining bytes will have to be brute forced sequentially until
    a response is received from Bob’s phone. Since each query can take around 10s
    to be thorough in waiting for a response, the process can take a while, from minutes
    to days depending on the type of device and the address space being searched.


    # CONNECTING


    Once a device has been found, the device can begin connecting. In most cases,
    this involves an encrypted link be established before higher level communications
    begin. While there are variations, most often the device requesting the pairing
    is required to enter the secret PIN code from the other device. The theory is
    that only those who'
  - '[PAGE 65]


    know the PIN of the remote device can connect. This may mean asking the owner
    of the other cell phone or just the fact that you own the device means you set
    its PIN and know it. Other variations include having the second device enter a
    code which has to be entered on the first device as well, thus requiring user
    interaction and avoiding default PINs. Once the PIN is entered, the devices handshake,
    and a link key is established, and now the devices are bonded and trust one another.
    This is an over simplification of the internals of the process, but the main issue
    here is not one of internals but of externals.


    The most common attacks on Bluetooth devices are due to default PIN numbers. Many
    devices come preset from the factory with a PIN that the user is asked to change.
    Usually those instructions are buried in the manual and are ignored by the user.
    Other devices, such as headsets, have no interface in which to change the PIN,
    so their PINs stay static. The most common PINs are 0000, 1234, and 9999. A quick
    Google search for a specific device will turn up the manual, which will usually
    contain the default PIN, right next to instructions on how to change it. This
    situation leaves plenty of room for an attacker to play. The most famous of these
    attacks involving default PINs concerns Bluetooth headsets.


    # Carwhisperer


    It''s hard to escape them. Bluetooth headsets have become incredibly commonplace
    in daily society. The adoption rate has recently skyrocketed due to local laws
    that ban using a hand-held cell phone while driving. For others, they have been
    elevated to fashion accessories. Needless to say, as long as Bluetooth phones
    remain popular, these devices will continue to flourish.


    Headsets are also related to the increasingly popular in-car Bluetooth hands-free
    devices. Occasionally integrated in vehicles by the manufacturer, and also available
    as after-market units, these systems take advantage of the car''s built-in stereo
    system to allow the driver (or passenger, as it may be) to hear the audio from
    the phone while keeping both hands free (hopefully to drive). A small microphone
    is used to relay voice of the driver to the phone and to the other party – essentially,
    the same function as a headset, just not as fashionable, and not the easiest to
    wear on your head. For the remainder of the chapter, both in-car systems (manufacturer
    installed and after market) and wearable headsets will be discussed as the same
    thing since they are functionally identical.


    Early Bluetooth security research noted that the usage of default PINs was going
    to be a problem since users, given the option, often not change a default setting
    unless forced. This led to carwhisperer being developed to exploit this.


    In July 2005, carwhisperer was released by Martin Herfurt of the Trifinite group
    (http://trifinite.org/trifinite_stuff_carwhisperer.html). This software took advantage
    of the default PIN situation to provide a fun and sometimes frightening prank.


    Carwhisperer is a series of scripts along with the actual application. The first
    cw_scanner probes for devices with the device classes common to headsets and hands-free
    devices. Once one has been found, the carwhisperer program initiates a connection'
  - "[PAGE 66]\n\nto the device, and with the help of the cw_pin script, selects the\
    \ appropriate default key based on the manufacturer prefix for the device’s BD_ADDR.\
    \ Once the connection is made, the attacker can record audio from the device’s\
    \ microphone or inject audio of his or her choice into the speaker. One can imagine\
    \ the fun that can be had with the latter.\n\nOnce connected, the attacker can\
    \ continue to listen and inject as long as they remain in range and the device\
    \ connection is not broken. Carwhisperer will not work on devices already paired\
    \ and communicating, as headsets only support one connection at a time. While\
    \ this may seem a problem, really it is not. Many vehicles support the feature,\
    \ but the person driving may not have his or her phone paired at the time. The\
    \ car’s system defaults back into discoverable mode, waiting for a connection.\
    \ With headsets, there are specific places where headsets will be on but not paired.\
    \ Favorite locations are movie theaters and airports since both locations require\
    \ you to turn off phones, but people forget to turn off headsets.\n\n> WARNING\n\
    > Be aware that airports, airlines, and flight crews are very strict about the\
    \ rules regarding mobile devices being used at the wrong time. Some airlines and\
    \ airports allow devices to be used during taxiing after landing, others do not.\
    \ Still depending on the airport and the port of call, mobile devices may be forbidden\
    \ from use until well after leaving the plane. Violating any of those rules can\
    \ bring about fines and legal entanglements with the authorities.\n> \n> The best\
    \ location to do any guerilla Bluetooth auditing is as you wait to get on the\
    \ flight and the passengers from the arriving plane disembark and turn on their\
    \ devices – best not to tempt fate, safety, and fines by scanning while in flight.\n\
    \nWhile carwhisperer’s usage in pranks seems obvious, a more devious use is in\
    \ low-cost industrial espionage. Often in businesses, the policy for high-level\
    \ meetings is to turn off phones, either for security reasons or to avoid distractions.\
    \ Often people will turn off their phone but not their headset. Turning off the\
    \ phone will break the pairing, and the headsets will return to a state seeking\
    \ something to pair with. This allows an attacker to turn the headset into a listening\
    \ device (bug) in the meeting and potentially divulging sensitive information.\n\
    \nThe most obvious and easy solution is to not use Bluetooth headsets at all.\
    \ However, this is not always an option and neither is changing the PIN on the\
    \ headset since there is no interface to do so. The most effective way to avoid\
    \ carwhisperer eavesdropping is to simply turn off the headset when not in use\
    \ and to not wear it when not in a conversation (it’s hard to record audio when\
    \ it’s in your pocket). Hands-free systems, in cars, can disable the feature when\
    \ not in use or not paired.\n\n# Bluebug\n\nThe opening of this chapter described\
    \ an attack involving Bluetooth being used to force other phones to make calls\
    \ to expensive numbers owned by the attackers. Typically these are not one specific\
    \ attack, but more a description of the end result, however"
