    which is likely a FIN packet closing the connection. If Airpwn beats the FIN,
    the connection can remain open indefinitely now that they have hijacked the stream
    and the attacker can inject anything else he or she wants.


    The implications of this were profound. Since the injected data is assumed by
    the browser to be legitimate traffic from the remote server, it is rendered by
    the browser. This has the advantage of giving full control over the contents of
    the page as well as interacting with the browser directly.


    Recent times have revealed a whole host of vulnerabilities in browsers. There
    are too many to enumerate here, but most vulnerability announcements follow the
    same script; if you can get the victim to visit a Web page with the malicious
    code, the code will run and bad things will happen. The most common problem with
    this vector is getting the victim to visit the malicious site. This is no longer
    a problem since now we can bring the malicious site to them, injecting the malicious
    code into whatever site they are visiting. In addition, since the forged traffic
    is "expected," firewalls will do little to stop it.


    This attack vector also opens up an interesting new vector of attack that can
    have long-term implications. In 2009, Robert Hansen (Rsnake) wrote a paper detailing
    some VPN vulnerabilities due to common internal address space usage and collisions
    of those addresses (www.sectheory.com/rfc1918-security-issues.htm). In his paper,
    he noted that one could attack the secure VPN network through the use of Java
    Script obtained from an insecure network.


    An attacker who injects malicious code via an unsecure network has control over
    how long that script is cached; an attacker can force it to be cached permanently.
    The result of this is that the next time that page is visited, the cached version
    of the script runs, not the one from the remote server. If you did this for a
    commonly visited site like Twitter.com or Google.com, the script would conceivably
    run every day, on whatever network the client was connected to, even the secure
    VPN or even the "secure" local LAN at the office. Use of the client device on
    an insecure network, even once, is enough to open a vulnerability to the secure
    network.


    This scenario has some pretty dire implications. Imagine setting up this attack
    at an airport or conference where the audience was full of employees of your target
    companies. Even if you managed to compromise just a few of them, when they go
    back to the office, they bring back the malicious code with them and it is inside
    the secure network doing your bidding. This could be everything from injecting
    a persistent iFrame into every page visited and sending an attacker the form contents,
    to acting as a stager, waiting for the right zero-day vulnerability to come out,
    then downloading and executing it automatically. Combine other attacks like Dan
    Kaminsky''s Socket/Sucket DNS rebinding attack, which turns the victim browser
    into a proxy server for the attacker to access the internal network (http://events.cc.de/congress/2007/Fahrplan/events/2393.en.html)
    and you have a formula for a very large amount of damage.


