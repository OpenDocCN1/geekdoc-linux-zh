- raw:
  - '[PAGE 131]


    by a Saturday Night Live sketch, the pair got the idea of overnight shipping a
    modified iPhone to the target facility in order to gain access past the perimeter.
    In most cases, mail and package deliveries just pass right on into the facility
    and into the mail room, right into range of any wireless infrastructure that is
    present at the facility.


    They first obtained an early generation iPhone (due to lower power requirements)
    and the original box. The original iPhone battery would only power the device
    for a day or so, which means it would already be dead upon arrival. To combat
    this, they installed a battery pack in the bottom of the box and used that to
    power the iPhone for up to five days, more than enough time to do what was needed.
    With a little modification of the box, the battery, charge cord, and iPhone all
    fit snugly in a nonthreatening package.


    The iPhone was jailbroken and additional software installed well beyond anything
    Apple intended to ever have installed. The iPhone, being a UNIX-based system,
    made porting of several popular utilities easy to do over other platforms (like
    Windows Mobile or Symbian). Tcpdump (packet sniffer), Metasploit (exploit framework),
    FERRET (information leakage assessment), and other tools were installed on the
    device. After disabling all the auto power down features of the phone, they setup
    the system to call home. Since most carriers block incoming connections to devices
    on cellular data services, the phone was made once an hour to connect out over
    the cellular data connection to a remote system and establish a shell for the
    penetration testers to use.


    Once everything was set up and charged, they overnight-shipped the box and phone
    to the test facility to the attention of a nonexistent employee name. Presumably,
    the shipment tracking number told them when the package arrived at the destination
    and when they could begin testing. Addressing the package to a nonexistent employee
    was a way that the package would stay in the mail room for a period of time since
    it was undeliverable and (hopefully) be returned to Errata Security after a few
    days to be recharged and used again.


    This attack proved to be very effective and continues to be developed. In the
    hands of a determined attacker, it could be devastating as it also includes a
    level of anonymity that would be highly desirable.


    > **NOTE**

    > Since the iPhone was jailbroken, this removed the digital locks put in place
    to prevent using the phone on other networks. An attacker could then use an anonymous
    prepaid SIM card from some far away land that would be very difficult to track
    down. As well, if the package was opened out of suspicion, there is nothing really
    indicating who sent it (other than a return address which may or may not exist),
    and the attacker is only out a few hundred dollars and is safely far away from
    the facility.


    Once inside the facility, the Errata penetration testers had everything they needed.
    They had remote access to the device that had a wireless interface they could
    listen to traffic on, use to connect to the network, and a UNIX platform with
    tools like Metasploit installed to conduct further tests and attacks on, all while
    this small box sat on a desk or shelf in the mail room.'
  - '[PAGE 132]


    This method of attack was fairly ingenious, as a common defense used by some is
    to have a heavy outer layer of security (guards with guns), assuming that this
    will prevent an attacker getting close enough to take advantage of poor security
    further in.


    The following year, at Defcon 17¹ in 2009, a presentation by Thomas Wilhelm expanded
    on the capabilities of Errata Security by exploring the possibilities of hacking
    with the iPod Touch (similar to the iPhone in capabilities, but without the telephone
    functions). A surprisingly large amount of tools have been ported and are simple
    to install on a jailbroken devices. Some others require manual building installation,
    but all the tools to do so are easily available. He noted that an iPod/iPhone
    is more socially acceptable to bring into a “secure” area than a laptop or other
    obvious computer.


    # Anonymity


    The potential with these devices is not just limited to them being a target of
    attack or a tool of attack, but as intermediaries to do the dirty work through
    or for the attacker, unknown to the user.


    It’s not hard to imagine a day when a remote vulnerability on an iPhone will allow
    an attacker to gain root access to a device over local Wi-Fi connections. Once
    there, all the tools necessary to download and install further malware already
    exist. An attacker could set a scheduled job that can run who-knows-what at a
    later time.


    It is also not unreasonable that an attacker could use the Wi-Fi connection as
    a gateway to access the Internet through the cellular data connection. Previously,
    an attacker trying to hide his/her tracks would need to route their connection
    through compromised computers around the world or an open Wi-Fi access point.
    The problem with these is that connections can be logged and some sort of trail
    left. In the case of a mobile phone, there is no facility to login that kind of
    detail what connections are routed through it leaving the attacker to just have
    to visit a coffee shop in order to do their evil deeds.


    # iPHONE SUMMARY


    As a growing part of the market, iPhones are going to be under greater scrutiny
    by attackers for vulnerabilities, particularly as more and more people put more
    and more personal parts of their lives onto these devices.


    For now, attacks have been limited to jailbroken devices left with default passwords.
    However, we should learn lessons from these experiences because, at some future
    point, a vulnerability may be found in a default application, or even a third-party
    application sanctioned by Apple, that may provide an attacker with a path to the
    rest of the system.'
  - '[PAGE 133]


    The closed nature of the iPhone is a double-edged sword for security. Being that
    it is closed and applications vetted before being offered through the App Store,
    Apple can limit the amount of access applications have and hopefully limit exposure
    to malware. This comes at a cost to the user, though. Because it is closed, the
    user is limited in what sort of proactive steps can be taken to fend off attacks.
    Currently, there are no firewall applications available for the iPhone to filter
    what type of traffic is allowed (incoming or outgoing). Virtual private network
    (VPN) functionality is built in, but it is limited in support for different protocols.
    If you have an existing VPN infrastructure that does not support any of the included
    protocols (Layer 2 Tunneling Protocol, Point-to-Point Tunneling Protocol, or Cisco
    IPSec), you are out of luck. There is also no available option for an antivirus
    scan of the device as that would almost be an admission by Apple that their devices
    were vulnerable in their factory (nonjailbroken) state (something unlikely to
    happen).


    # Android Security


    While iPhones enjoy a growing percentage of the mobile phone market and a certain
    amount of sex appeal, phones based on Google’s Android OS are growing in interest
    and market share. Unveiled in late 2007, the OS, which is based on a Linux kernel
    (as opposed to iPhones FreeBSD-based Darwin kernel), has been built with a different
    security model than that of the iPhone. The open nature of the OS and its attention
    to security is a significant counterpoint to Apple’s closed model.


    Android’s security model is one of openness. This seems to be counterintuitive
    in that security and openness are concepts usually not compatible. Android developers’
    desire was to allow users and application developers to have a greater degree
    of control over the device, and to put in place a model where even if a malicious
    application was installed or a remote bug found, the implications would not be
    as dire.


    On Android, much of the security comes from a unique model for software permissions.
    Each program runs as its own User IdentifierK (UID or simply user), whereas on
    an iPhone, all programs run under a single user (mobile). This acts as a “sand
    box” and limit interprogram communication to specific functions. At the time of
    install, the program can request specific permissions to interact with other programs.
    The user is told of these permissions and has the option of allowing or disallowing
    of these permissions. In this way, the user can decide that, yes, this new contact
    manager should be able to access my phone book and make calls, but not the Wi-Fi
    network or the GPS. The same goes for programs that have no business accessing
    core phone functions. Why does this falling block game need to know my location
    and access my phone book? In this model as well, a potentially malicious program
    can only interact with other programs and data in very specific ways, and as such,
    limits the amount of damage that can be done should they go rogue. Applications
    can also generate their own permission types to allow other programs access.'
