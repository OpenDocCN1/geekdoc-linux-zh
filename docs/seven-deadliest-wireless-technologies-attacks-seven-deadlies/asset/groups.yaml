  - '[PAGE 107]


    selling were available for download from the United States. Charges were eventually
    dropped, but the case remains to this day an example of how far companies will
    go to protect their poor security methods from scrutiny.


    A common and recurring theme throughout technology is that encryption solves everything
    and solves nothing at the same time. Proper usage and implementation is a major
    factor in how security functions overall. The corollary to this is that as you
    add complexity to any system, usability and stability rapidly approach zero. Adding
    too much complexity actually makes systems easier and more prone to breaking.
    In any system, a balance must be found in order to attain the best security for
    the situation.


    # PROPER ENCRYPTION


    In the world of encryption, it is worth explaining what a few common terms actually
    mean as they can differ from their normal everyday uses. The largest of these
    is about the word “security” and how it relates to protecting something secret
    from those who should not have it.


    Security in the crypto world is measured by how long a message can reasonably
    remain secure and unreadable in the hands of a determined attacker. If you have
    a secret, say a muffin recipe, writing it on an index card means anyone can read
    it. In order to protect it from prying eyes of other bakers, you can encrypt the
    message in such a way that it is unreadable to someone unless they know the secret
    (or key) to deciphering it. Now a determined attacking baker who really wants
    the recipe is willing to spend days or weeks to get it. If you only used ROT13
    encryption, the recipe won’t stay hidden for long.


    The defense used by most encryption systems against a brute force attack is key
    size. Much like a combination lock, encryption deals with high numbers of combinations
    to thwart attackers. Brute force attacks involve an attacker performing an exhaustive
    test of every possible key for the encryption system. An example is the ubiquitous
    combination lock. Usually this needs three numbers, entered in sequence, to open
    it. On a lock with 30 numbers, this means that there are 30 × 30 × 30 possibilities
    of combinations, which equals 27,000 combinations. Assuming 10 s to enter and
    try each combination, this totals about 6½ h of constant attack to try every combination
    (though the attacker is likely to discover the correct combination well before
    that). This is more than an attacker can probably do standing in front of a locker
    without looking suspicious. Assuming that an attacker can discover the combination
    on average in about half the key space, security should be built to take that
    into consideration (guard rotations and changing the combination regularly). In
    the digital world, the combination is the key and the length of that key specifies
    the number of combinations possible. These keys can have millions, trillions,
    or even higher numbers of possibilities, meaning that an attacker has a much larger
    number to go through in order to decrypt the message. A well-designed algorithm
    will have a key length and strength sufficient that an attacker would have to
    work for billions of'
  - '[PAGE 108]


    years in order to exhaust all possibilities of keys to recover the secret. The
    idea is that the secret will remain a secret for longer than it is useful, usually
    long after anyone who cares has passed on.


