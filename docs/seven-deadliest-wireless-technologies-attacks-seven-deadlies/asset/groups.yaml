    \ 6 --bssid 00:16:b6:1c:91:94 --write bar ath1\n```\n\nAirodump-ng 在收集用于 WEP 破解的数据包之外，还可以提醒四次握手已被捕获。当捕获到有效的握手时，在\
    \ Airodump 屏幕的右上角会出现“WPA Handshake”，以及它捕获的网络的 BSSID，如图 1.8 所示。\n\n在有效客户端加入网络之前可能需要一段时间，即使如此，完整的握手也可能未被交换或捕获。可能需要通过去认证攻击来强制执行。\n\
    \n去认证攻击（deauth）是指攻击者伪造一条来自 AP 到客户端的消息，要求其断开连接。通常，这用于在 AP 即将关闭或重启时优雅地关闭会话。由于这类管理消息未加密且未经过身份验证，任何人都可以注入它们，客户端会服从并断开连接。几秒钟后，客户端发现网络已恢复（它从未离开），然后重新连接，从而泄露四次握手。\n\
    \nAireplay-ng 有一个选项可以执行此攻击，同时还有其他工具，但 aireplay 的额外优势在于需要指定目标，并避免了对其他网络的非预期断开造成的附带损害：\n\
    \n```\naireplay-ng -0 5 -a 00:16:b6:1c:91:94 -c 00:0e:35:76:53:47 ath1\n```\n\n\
