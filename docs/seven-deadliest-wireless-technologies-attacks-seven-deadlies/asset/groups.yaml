  mdcn: "\n其中广告宣传了各种配置文件，例如 OBEX 文件传输和耳机功能。这些设备可能容易受到各种攻击。最终报告很有趣，阅读起来很有价值，可在 www.securenetwork.it/bluebag_brochure.pdf\
    \ 获取。\n\n另一项用于编目蓝牙设备的项目自 2007 年起在荷兰进行。蓝牙追踪项目（www.bluetoothtracking.org）在荷兰各地甚至法国巴黎都部署了多个传感器，持续监控可发现的设备并将信息记录到数据库中。此后，他们已收集超过\
    \ 600,000 台设备并生成了一些有趣的使用统计数据。他们还能够计算设备移动的速度。一个传感器检测到设备，几英里外的另一个传感器再次检测到它——由此可以推断出某人移动的速度和方向。\n\
    \n出于安全考虑，一些设备不会响应探测，或只有设备可发现的有限时间窗口。这些设备会给攻击者带来一些麻烦；然而，通过一点胁迫和暴力破解，它们并非无法检测。\n\
    \n即使设备设置为不可发现，仍可连接到其他设备，只是其他设备需要知道 BD_ADDR。如果 Alice 想连接到 Bob，而 Bob 的手机不可发现，Alice\
    \ 在连接之前需要知道 Bob 的 BD_ADDR。如果她不知道，Bob 需要使他的设备可发现或告诉 Alice 他的设备的 BD_ADDR，然后她可以输入它（如果可能）来指定要连接的对象。当\
    \ Bob 的手机看到指向其地址的定向连接请求时，它会允许连接继续。\n\n从攻击者的角度来看，这使得攻击 Bob 的手机变得困难得多，因为除非攻击者知道\
    \ BD_ADDR，否则它不会响应。Bob 不太可能与任何人分享该信息，但通过使用一些基本信息，我们有可能查出 Bob 的 BD_ADDR。\n\nOllie\
    \ Whitehouse 编写的 Redfang 等程序（www.net-security.org/software.php?id=519）允许你强制通过特定地址空间发出连接请求。如果我们知道\
    \ Bob 手机的品牌和型号，我们可以扫描类似的型号来确定其地址范围，或在 IEEE 数据库或 BNAP 数据库中搜索该制造商已知的地址。这将得到地址可能的前\
    \ 3 个字节。剩余的字节必须按顺序暴力破解，直到收到 Bob 手机的响应。由于每次查询大约需要 10 秒才能充分等待响应，因此该过程可能需要一段时间，从几分钟到几天不等，具体取决于设备类型和正在搜索的地址空间。\n\
    \n## CONNECTING\n\n一旦找到设备，设备就可以开始连接。在大多数情况下，这需要在更高级别的通信开始之前建立加密链路。虽然存在变体，但最常见的是请求配对的设备需要输入另一设备的秘密\
    \ PIN 码。其理论是只有知道远程设备 PIN 的人才能连接。这可能意味着询问另一部手机的所有者，或者仅仅因为你拥有该设备意味着你设置了其 PIN 并知道它。其他变体包括让第二个设备输入一个代码，该代码也必须在第一个设备上输入，从而需要用户交互并避免默认\
    \ PIN。PIN 输入后，设备进行握手，建立链路密钥，现在设备已绑定并相互信任。这是对该过程内部的过度简化，但这里的主要问题不是内部问题，而是外部问题。\n\
    \n对蓝牙设备最常见的攻击是由于默认 PIN 号码。许多设备出厂时预设了 PIN，要求用户更改。通常这些说明被埋在手册中，被用户忽略。其他设备，如耳机，没有更改\
    \ PIN 的界面，因此其 PIN 保持不变。最常见的 PIN 是 0000、1234 和 9999。快速 Google 搜索特定设备会找到手册，其中通常包含默认\
    \ PIN，正好在如何更改它的说明旁边。这种情况为攻击者提供了充足的空间。涉及默认 PIN 的最著名攻击之一与蓝牙耳机有关。\n\n## Carwhisperer\n\
    \n它们无处不在。蓝牙耳机已在日常社会中变得极为常见。采用率最近飙升，原因是当地法律禁止驾驶时使用手持手机。对其他人来说，它们已被提升为时尚配饰。毋庸置疑，只要蓝牙手机保持流行，这些设备就会继续繁荣。\n\
    \n耳机也与日益流行的车载蓝牙免提设备相关。这些系统有时由制造商集成在车辆中，也可作为售后单元提供，利用汽车内置的立体声音响系统，让驾驶员（或乘客）能够在保持双手自由（希望用于驾驶）的同时收听手机音频。一个小型麦克风用于将驾驶员的声音传输到手机和对方——本质上与耳机功能相同，只是没有那么时尚，也不是最容易戴在头上的东西。在本章剩余部分，车载系统（原厂安装和售后）以及可穿戴耳机将被视为同一事物，因为它们在功能上是相同的。\n\
    \n早期的蓝牙安全研究指出，默认 PIN 的使用将成为一个问题，因为用户在有选择的情况下，往往不会在被强制的情况下更改默认设置。这导致 carwhisperer\
    \ 被开发出来以利用这一点。\n\n2005 年 7 月，carwhisperer 由 Trifinite 集团的 Martin Herfurt 发布（http://trifinite.org/trifinite_stuff_carwhisperer.html）。该软件利用默认\
    \ PIN 的情况提供了一种有趣且有时令人恐惧的恶作剧。\n\nCarwhisperer 是一系列脚本以及实际应用程序的组合。第一个 cw_scanner\
    \ 探测具有耳机和免提设备常见设备类别的设备。一旦找到，carwhisperer 程序会发起与设备的连接，并借助 cw_pin 脚本，根据设备的 BD_ADDR\
    \ 的制造商前缀选择适当的默认密钥。一旦连接建立，攻击者可以从设备的麦克风录制音频，或向扬声器注入其选择的音频。可以想象后者带来的乐趣。\n\n一旦连接，攻击者只要仍在范围内且设备连接未中断，就可以继续监听和注入。Carwhisperer\
    \ 不适用于已配对并正在通信的设备，因为耳机一次只支持一个连接。虽然这似乎是个问题，但实际上并非如此。许多车辆都支持该功能，但驾驶员可能在当时并未将手机配对。汽车系统会默认回到可发现模式，等待连接。对于耳机来说，有特定的地方耳机会打开但未配对。最喜欢的地点是电影院和机场，因为这两个地方都要求你关闭手机，但人们常常忘记关闭耳机。\n\
    \n> WARNING\n> 请注意，机场、航空公司和机组人员对移动设备在错误时间使用规则的执行非常严格。一些航空公司和机场允许在降落后滑行期间使用设备，其他则不允许。仍取决于机场和停靠港，移动设备可能在离开飞机很久之后仍被禁止使用。违反任何这些规则都可能导致罚款和与当局的法律纠纷。\n\
    > \n> 进行任何游击式蓝牙审计的最佳地点是在你等待登机时，抵达航班的乘客下机并打开他们的设备——最好不要在飞行中扫描，以避免挑战命运、安全和罚款。\n\n\
    虽然 carwhisperer 在恶作剧中的用途似乎显而易见，但更阴险的用途在于低成本的工业间谍活动。企业中，高层会议的政策通常是关闭手机，无论出于安全原因还是避免分心。人们常常会关闭手机但不关闭耳机。关闭手机会中断配对，耳机将返回寻求配对的状态。这允许攻击者在会议中将耳机变成窃听设备（窃听器），从而可能泄露敏感信息。\n\
    \n最明显且最简单的解决方案是完全不使用蓝牙耳机。然而，这并不总是可行的，也无法更改耳机的 PIN，因为没有界面可以这样做。避免 carwhisperer\
    \ 窃听最有效的方法就是在不使用时简单地关闭耳机，并且在未通话时不要佩戴（当它在口袋里时很难录制音频）。汽车中的免提系统可以在不使用或未配对时禁用该功能。\n\
    \n## Bluebug\n\n本章开头描述了一种攻击，涉及使用蓝牙强制其他手机拨打攻击者拥有的昂贵号码。通常这些不是一种特定的攻击，而更多是对最终结果的描述，然而\n"
