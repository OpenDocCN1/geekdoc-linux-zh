    ## SUMMARY


    While all this may seem depressing, it is the inevitable cost for the convenience
    of wireless. While indispensable to modern life, wireless networks are far from
    the mature technology of wired networks. It took many years to convince people
    to even hook up a basic firewall to separate them from the Internet; it is not
    unreasonable to think that it will be a while before things improve for wireless
    security. As with most things, when systems were locked down at the access point,
    attackers just switched focus and found another weakness.


    Attention to the dangers of using open networks is the first step in solving the
    problem. Usage of restrictive security policies preventing the use of insecure
    connections, while inconvenient, will help users protect them from themselves.
    As well, moving to more robust and intelligent client managers can also help alert
    users to the dangers and keep them from doing things that are blatantly dangerous.
    The last measure that is obvious but often not done is to turn off wireless and
    just use a wire when you can. It’s a lot harder to screw up a wired connection
    than it is to screw up wireless.


    In short, the best methods for avoiding attacks on wireless clients are


    - Avoid using open access points at any time, particularly in public places.

    - If at all possible, opt for a wired connection.

    - If you are using a wired connection, disable your wireless adapter.

    - Have firewalls in place and set to only allow services that you need.

    - Avoid sending personal or financial information over wireless networks.

    - Consider a "disposable" laptop for travel, one that gets wiped and reinstalled
    before connecting back to the company network.

    - Always be wary that what you are connected to may not be what you think it is.


