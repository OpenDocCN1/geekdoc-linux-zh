  - '[PAGE 121]


    In the early 2000s, the Blackberry took the world by storm as well as other devices
    that combined the functions of a cell phone and a PDA in one device making for
    a more convenient device to carry around. This new generation of devices introduced
    new and interesting communication options not only for the users but also for
    the attackers.


    Today’s communications devices are interesting from an attacker’s perspective.
    Consider a modern Apple iPhone. These popular phones have surprisingly little
    resemblance to the phones of just a few years ago. Previously, phones did one
    thing and one thing only: they made and received calls. They did that very well
    and became indispensable to business people and soccer moms alike. However as
    Apple’s marketing points out, there’s little that the iPhone can’t seem to do.
    These devices are basically portable computers that include making and receiving
    phone calls as one feature rather than as a dominant purpose.


    These devices also exist outside the control of most information technology administration
    functions. Their highly portable nature has them outside the watchful eye of any
    infrastructure setup to protect company data or assets secure inside the workplace.
    Also, these sorts of devices are very popular with nontechnical users who are
    unaware of the risks of using these devices on insecure networks in public places.
    A recent test by Renderlab.net found that, at a large shopping mall, the assembled
    mass of several thousand people had at least 247 devices among them with Wi-Fi
    capability turned on and were attempting to communicate with the Internet. Logins
    and passwords for social networking sites like Twitter and Facebook were plentiful
    and the opportunities to inject data to cause chaos were quite rampant. Walking
    into any busy public with simple tools can reveal hundreds of mobile phones, each
    one potentially vulnerable.


    # ANATOMY OF THE ATTACK


    Late 2009 was an interesting time for Apple and iPhone security in general. The
    iPhone gained more market share, and new models added new and interesting features
    for users to play with. The App Store installed on every phone allows users to
    add software and customize their phones capabilities. New productivity applications,
    food selection, and even applications remembering where you parked are all available.


    A common complaint about the iPhone is that it is a closed system. The iPhone
    is only capable of running software that is purchased and downloaded through the
    App Store, and all of these are subject to review and approval from Apple before
    they are included. Some applications are free while others cost as little as $0.99
    compared to others costing several hundred dollars (though not many do). Apple
    has chosen to restrict what applications can be accessed in terms of the operating
    system (OS) and other core functionalities, such as stored music. The process
    of approval for an application is heavily veiled and mysterious to developers
    who often complain about not knowing why their application was denied.


    Apple’s reasoning behind these restrictions range from copyright and antipiracy
    requirements, to stability and performance reasons. Critics counter that Apple
    is trying to maintain a stranglehold on revenue streams and limiting competition
    to those streams.'
  - '[PAGE 122]


    # EPIC FAIL


    Apple, Google, and AT&T got into a fairly large mess with one another in July
    of 2009. Google had submitted an application for its Google Voice service, a service
    that allowed users to have a single "Google phone number," which could be routed
    to multiple phones simultaneously as well as central voice mail and text messaging
    from multiple devices. The calls would be routed over the Internet using Voice
    over Internet Protocol (VoIP) instead of normal telecom lines, heavily reducing
    costs to the end user. Obviously, this would be a useful service for anyone with
    multiple phone numbers and locations to worry about, and anyone wanting to save
    money by using VoIP for normally expensive long distance calls. Controversy sprung
    up when it was revealed that Apple had rejected the Google Voice application from
    the store and purged all third-party applications that provided an interface to
    the service. A subsequent Federal Communications Commission investigation made
    the situation all the more strange since replies from each company painted different
    stories. Google claims Apple outright rejected the application; Apple claims it
    was still reviewing the application; and AT&T said it had nothing to do with the
    rejection despite its obvious benefit of not seeing such a service exist, and
    older agreements with Apple not to allow some VoIP functionality. AT&T''s insistence
    that they had no part in the situation was despite the potential of reducing their
    existence to a "dumb pipe" that others route call traffic over, obviously restricting
    their ability to offer value-added services and cutting them out of the revenue
    stream.


    In October 2009, AT&T announced that it would allow VoIP functionality over its
    3G connection. Products like Skype previously worked over the Wi-Fi connection
    but were restricted from working over the 3G link. That appears to have changed
    with this announcement. While no specific announcement was made in regards to
    Google Voice specifically, it does seem to indicate that the potential exists
    for it to be approved.


    The controversy is ongoing and certainly not going to be the last, but points
    to a larger epic fail in that hybrid devices are everything and nothing at the
    same time. To AT&T, the iPhone is a mobile phone. To Apple, it is a sales platform
    for music and applications. To Google, it is a sales platform and a computer platform
    portal to its services. Each company is going to treat it differently, and unfortunately,
    the consumers are caught in the middle of these disputes, and in some cases will
    not be able to benefit from the available technology due to these disputes.


    While the AT&T issue seems to have settled and VoIP is allowed, this same problem
    is due to creep up again with other providers offering the iPhone and customers
    wanting to have similar functionality.


    # Jailbreaking


    Because of this closed nature, since moments after the first iPhones were released,
    users had been seeking ways to bypass the restrictions placed on what software
    could be run and from what sources it could be obtained from. These culminated
    in what became known as jailbreaking. Jailbreaking means to break the digital
    locks Apple has put in place and load applications not approved by Apple. This
    could allow other applications to be loaded (an alternate App Store) or for the
    phone to be "unlocked," which means to remove and restrictions put in place to
    lock the handset to a specific carrier, allowing its use on other networks.'
  - '[PAGE 123]


    **WARNING**

    Jailbreaking an iPhone or modifying any manufacturer''s handset beyond methods
    they allow (ringtones, wallpapers, and so on) will most likely void any sort of
    warranty on the device in the eyes of the manufacturer and the carrier, and may
    introduce unforeseen problems.

    The terms of service with the carrier usually spell this out quite clearly and
    may result in termination of service and loss of warranty on the handheld.


    So if you jailbreak your iPhone, and it gets damaged, you are on your own for
    repair/ replacement costs, and considering the nonsubsidized costs of these devices,
    that can be an expensive proposition.


    Initial unlocks required fairly extensive modification (including hardware) to
    perform, but it has been reduced now to a simple point-and-click interface. In
    the end, these applications load an alternate App Store application (in addition
    to the Apple offering) that bootstraps the ability to load further, nonapproved
    software. The most popular of these packages is the PwnageTool from http://blog.iphone-dev.org,
    which loads the Cydia App Store application. Once loaded, the Cydia store allows
    users to load applications that are able to do things beyond what Apple permits
    through their App Store, including much deeper access to the file system and the
    OS, which not only allows more functionality but also more potential for damage
    to critical system files.


    While the jailbreaking process does not specifically introduce any vulnerability,
    it does however introduce some complexity that users may not understand. This
    is what was being exploited by the recent iPhone worms.


    As part of the Cydia App Store, there is an option to install and enable an OpenSSH
    server on the phone itself since some applications available on Cydia are command
    line only and the easiest way to connect is through a local Secure Shell (SSH)
    connection. This is not a major feat for the iPhone, however, since its OS is
    UNIX based it is not available from the default Apple firmware.


    The cause of vulnerability was not in that owners had jailbroken their phones,
    but that they were not understanding what they were doing in the process. In this
    case, many owners installed an OpenSSH server onto the phone without understanding
    the consequences. In this case since the iPhone has a UNIX-based OS, it has users
