    \ MMS 或数据网络在蜂窝网络上上传，这会产生通话时长费用或额外收费。\n\n能够将蓝牙手机与电脑配对，在无需额外付费的情况下下载图片或上传铃声，甚至无线共享网络，对消费者来说极具吸引力。当许多电脑都具备蓝牙功能时，用户已拥有在无需额外付费的情况下传输数据的全部所需。这就是为什么许多手机的功能仅限于操作蓝牙耳机或作为虚拟拨号调制解调器。\n\
