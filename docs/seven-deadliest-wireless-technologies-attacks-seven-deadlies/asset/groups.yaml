    Errata Security 以便重新充电并再次使用。


    这种攻击被证明非常有效，并且仍在不断发展。在一个有决心的攻击者手中，它可能具有毁灭性，因为它还包含一种高度理想的匿名性。


    > **注意**

    > 由于 iPhone 被越狱，这移除了为防止在其他网络上使用手机而设置的数字锁。攻击者随后可以使用来自遥远地方的匿名预付费 SIM 卡，这种卡很难追踪。此外，如果包裹因怀疑而被打开，几乎没有任何信息表明是谁寄出的（除返回地址外，而返回地址可能存在也可能不存在），攻击者只损失几百美元，并且安全地远离设施。


    进入设施内部后，Errata 渗透测试人员拥有了所需的一切。他们可以远程访问该设备，该设备具有可监听流量的无线接口，可用于连接网络，并且是一个安装了 Metasploit
    等工具的 UNIX 平台，以便进行进一步的测试和攻击，而这一切都在这个小盒子安静地放在邮件室的桌子或架子上时进行。


    这种攻击方法相当巧妙，因为一些组织常用的防御手段是设置厚重的外层安全（持枪警卫），假设这会阻止攻击者接近到足以利用内部薄弱安全的地方。


    次年，在 2009 年的 Defcon 17¹ 上，Thomas Wilhelm 的一次演讲通过探索使用 iPod Touch（功能与 iPhone 相似，但没有电话功能）进行黑客攻击的可能性，扩展了
    Errata Security 的能力。令人惊讶的是，有大量工具已被移植，并且在越狱设备上安装非常简单。其他一些工具需要手动编译安装，但完成此操作所需的所有工具都很容易获得。他指出，将
    iPod/iPhone 带入“安全”区域比带笔记本电脑或其他明显的电脑更易被社会接受。


    ## Anonymity


    这些设备的潜力不仅限于成为攻击目标或攻击工具，还可以作为中间人，在用户不知情的情况下为攻击者执行肮脏的工作。


    想象有一天，iPhone 上的远程漏洞会让攻击者通过本地 Wi-Fi 连接获得对设备的 root 访问权限并不难。一旦进入，所有下载和安装更多恶意软件所需的工具都已存在。攻击者可以设置一个定时任务，在稍后运行谁也不知道的东西。


    攻击者利用 Wi-Fi 连接作为网关，通过蜂窝数据连接访问互联网也并非不合理。以前，试图隐藏行踪的攻击者需要将连接路由通过世界各地的受感染计算机或开放的 Wi-Fi
    接入点。这些问题的在于连接可能会被记录并留下某种痕迹。而对于手机而言，没有设施可以登录那种详细记录通过它路由的连接的细节，这使得攻击者只需去一家咖啡店就能进行其邪恶行为。


    ## iPHONE SUMMARY


    作为市场日益增长的一部分，iPhone 将会受到攻击者对漏洞的更大审查，特别是随着越来越多的人将生活中越来越多的个人部分放在这些设备上。


    目前，攻击仅限于使用默认密码的越狱设备。然而，我们应该从这些经验中吸取教训，因为在未来的某个时间点，默认应用程序甚至苹果认可的第三方应用程序中可能会发现漏洞，从而为攻击者提供进入系统其余部分的途径。


    iPhone 的封闭性对安全而言是一把双刃剑。由于它是封闭的，并且应用程序在通过 App Store 提供前会经过审核，苹果可以限制应用程序的访问权限，并希望限制恶意软件的暴露。这对用户来说是有代价的。因为它是封闭的，用户在采取主动防御攻击措施方面受到限制。目前，iPhone
    上没有可用的防火墙应用程序来过滤允许的流量类型（入站或出站）。虚拟专用网络（VPN）功能内置其中，但对不同协议的支持有限。如果您现有的 VPN 基础设施不支持任何包含的协议（第二层隧道协议、点对点隧道协议或思科
    IPSec），您就无能为力了。此外，也没有可用的设备防病毒扫描选项，因为这几乎相当于苹果承认其设备在出厂（未越狱）状态下存在漏洞（这种情况不太可能发生）。


    ## Android Security


    虽然 iPhone 在手机市场中占有日益增长的份额并具有一定的吸引力，但基于谷歌 Android 操作系统的手机在兴趣和市场份额上也在增长。该操作系统于 2007
    年底发布，基于 Linux 内核（与 iPhone 基于 FreeBSD 的 Darwin 内核相对），采用了与 iPhone 不同的安全模型。操作系统的开放性和对安全的关注是对苹果封闭模式的重要反驳。


    Android 的安全模型是开放的。这似乎违反直觉，因为安全和开放通常是不兼容的概念。Android 开发者的愿望是让用户和应用程序开发者对设备有更大的控制权，并建立一个模型，即使安装了恶意应用程序或发现远程漏洞，其影响也不会那么严重。


    在 Android 上，大部分安全来自于独特的软件权限模型。每个程序都以自己的用户标识符（UID 或简称用户）运行，而在 iPhone 上，所有程序都在单个用户（mobile）下运行。这充当“沙箱”，并将程序间通信限制为特定功能。在安装时，程序可以请求特定权限以与其他程序交互。用户会被告知这些权限，并可以选择允许或禁止这些权限。这样，用户就可以决定，是的，这个新的通讯录管理器应该能够访问我的电话簿并拨打电话，但不能访问
    Wi-Fi 网络或 GPS。对于没有业务访问核心手机功能的程序也是如此。为什么这个下落式方块游戏需要知道我的位置并访问我的电话簿？在这个模型中，潜在的恶意程序只能以非常特定的方式与其他程序和数据交互，因此限制了它们失控时可能造成的损害。应用程序还可以生成自己的权限类型以允许其他程序访问。

