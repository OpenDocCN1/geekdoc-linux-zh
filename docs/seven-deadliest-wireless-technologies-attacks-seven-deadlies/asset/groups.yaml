  mdcn: "\n这些设备是窃听和干扰的丰富目标，因为它们通常未加密，而房间可能对攻击者关闭，但无线电信号并不遵守同样的边界。想象一下一家大型公司的首席执行官向聚集的股东做演示，他必须告知他们，他们最新的小玩意不仅按承诺工作，而且还有让顾客头发变蓝的副作用。首席执行官知道他必须向股东披露此事，但正试图将其排除在媒体之外。他开始演示时夹上一个无线麦克风，以便每个人都能清楚地听到他，包括街对面拿着无线电扫描仪的爱管闲事的记者。在闭门演示中使用扫描仪在渗透测试中可以产生非常有趣的结果，并且证明在大多数情况下非常有效。\n\
    \n这些麦克风通常比电话耳机单元需要更高的质量，并在不同的频率上运行，使用更宽的频道（通常为 200 KHz），以便清晰准确地再现声音。大多数现代系统工作在超高频（UHF）波段，但由于这些频率的不同许可和分配，实际范围取决于设备配置的国家。通常，你可以在\
    \ 470 到 854 MHz 之间找到它们（在美国为 698 到 854 MHz）。如果你知道设备的制造商，通常很容易在线搜索设备使用的频率。\n\n##\
    \ 史诗级失败\n\n科幻小说中经常预测的未来是我们的生活因技术而变得更轻松的未来。其中，企业用户经常寻求的发明包括语音识别和语音听写。\n\n虽然语音听写产品已经达到相当准确的程度，但输出质量直接与输入质量相关。所有语音听写软件共同的问题是如何让用户的声音清晰地进入程序，以便其发挥作用。质量差的麦克风会引入太多噪音，因此错误数量会增加。通常这不是一个大问题，因为大多数人可以稍后返回编辑。其他用户没有时间，需要第一次就准确听写。\n\
    \n这些用户的常见解决方案是避免使用消费级麦克风，转而使用高端舞台设备。这通常具有足够的质量来减少听写错误。史诗级的失败发生在那些用户在涉及私密、机密或秘密信息时进行听写。每个人对电脑说的每一个字都可能被第三方接收（甚至可以将其传输到自己的语音听写软件）。有时，这些用户只会在不使用时禁用听写软件，并继续佩戴耳机并整天保持开启状态。其影响是惊人的，因为办公室里每一次电话通话和对话的内容现在都被广播到建筑物之外。一旦注意到这种情况，麦克风的成本就浪费了，因为在那之后没有真正的方法来保护这些通信并继续使用耳机。\n\
    \n使用无线麦克风时，必须考虑所发送音频的内容及其影响。将麦克风视为房间里的陌生人，并问问自己，如果你不会在陌生人面前谈论它，为什么要让麦克风向范围内任何人广播它？\n\
    \n## 视频设备\n\n今天视频监控无处不在。大多数主要城市周围都有数百个摄像头，监视从交通流量到后巷垃圾桶的一切。无论安装摄像头的理由是什么，大多数摄像头的目的都是让某人远程监控一个区域。有时，这些摄像头需要在临时安装或布线不方便或不切实际的地方安装。在这些情况下，无线视频摄像头应运而生以填补空白。许多房主使用这些无线摄像头来监控他们的院子和周边物业，以及临时应用，如建筑工地。甚至出现了一种爱好，即定位并编目这些摄像头的所在地；与\
    \ wardriving 类似，warspying 出现了，试图更好地理解这项新技术及其使用方式。\n\n这些无线视频单元通常由远程摄像头组成，摄像头可由电池或交流电供电，以及接收信号的基站。基本单元通常只是发射器和接收器对，而高端单元可以在单个接收器上连接多个摄像头。\n\
    \n视频由于其更高的带宽需求（比纯音频更高），通常需要更高的频率来运行。虽然一些早期单元在 900 MHz 波段运行，但它们可能受到无绳电话、无线耳机和许多其他设备的干扰，并且通常是最便宜的。更常见的是\
    \ 2.4 GHz 单元，尽管它们会受到 Wi-Fi 网络和其他设备在日益拥挤的免许可 2.4 GHz 范围内的干扰。通常，它们占用大约一半的可用 Wi-Fi\
    \ 频道，并对 Wi-Fi 造成比 Wi-Fi 对视频更大的问题。新单元工作在 5.8 GHz，也存在如新型无绳电话等干扰设备，但更宽的可用频谱意味着干扰远没有\
    \ 2.4 GHz 那么严重。\n\n为了接收此类广播，再次需要兼容的接收器。这可以是目标使用的类似基站，连接到视频监视器。一些扫描仪具有视频显示屏，能够查看这些设备的视频（在盲测中非常方便）。一个不错的扫描仪能够扫描这些模拟视频系统常用的频道并显示它们。其他扫描仪会在扫描过程中自动检测视频信号并为你显示。通过无线电测向和基于摄像头图像的简单推断，人们通常可以确定摄像头的位置及其覆盖范围。\n\
    \n对于攻击者来说，这些摄像头是任何信息收集行动中极具诱惑力的目标。它使他们能够 literally 窥探其视野范围内发生的事情（警卫移动、占用情况，甚至在输入时门锁组合！）。市场上大部分常见设备只是广播其信号，查看它不需要身份验证。\n\
