    # Introduction


    # INFORMATION IN THIS CHAPTER


    +   - Book Overview and Key Learning Points

    +   - Book Audience

    +   - How This Book Is Organized


    Look around any street, business, or home. There is a world of information passing
    in front of us and through us that many people just don’t perceive. Wireless signals
    are everywhere, passing information between sources at incredible speeds just
    beyond our vision. We all use dozens of wireless devices in our daily lives, simple
    things like wireless doorbells that communicate very simple information to modern
    smart phones that have access to all the knowledge of the Internet. It’s when
    you start to realize the amount of information that is flowing freely past our
    eyes and that with the right tools, you can see that information that the need
    for security becomes apparent and the value it has to an attacker.


    If you can see this information, who else may be able to?


    This book attempts to show the implications of this brave new wireless world with
    seven major attacks against them along with how best to protect yourself and your
    private information. From Wi-Fi networks and cordless phones to RFID and good
    old analog, there is no end to the threats from wireless devices.


    # BOOK OVERVIEW AND KEY LEARNING POINTS


    Each chapter in this book covers an example of a failure of wireless technology.
    Sometimes, it is a specific and familiar technology, and others are more about
    specific concepts that cover multiple technologies. It is important to learn the
    implications of deploying wireless devices in your home or business, and each
    chapter starts with an example of a danger associated with wireless. From there,
    workings of the attack works are discussed so that you can see things from an
    attacker’s view, to help you better understand the risks and how best to mount
    a defense. From there, options for defense are discussed with associated strengths
    and possible weaknesses. Wireless security is tricky and, short of not using wireless,
    there is no one single solution to this very complex problem.'
  - '[PAGE 14]


