    ## SPEEDPASS


    Payment systems have an obvious need for encryption. Given the financial incentive
    to attack these systems, it''s a natural fit to encrypt payment information whenever
    possible. Payment systems also demand ease of use and quick turnaround to be appealing
    for customer, retailer, and payment processor alike. To that end, many companies
    have instituted their own payment options for their stores and services over the
    years, but in 1997, things took a leap when Mobil Oil Corp. created the Speedpass
    system.


    The Speedpass was a small plastic fob on a keychain that contained a glass capsule
    134.2-MHz digital signal transponder (DST) from Texas Instruments. These tags
    were small and cheap to purchase in quantity, allowing them to be given away for
    free. The tag''s identifier was tied to a credit card or checking account of the
    customer''s choice and automatically charged the account with just a wave of the
    tag past the reader built into the gas pump. The theory was that it was more convenient
    since all you needed to purchase fuel was the tag – removing the need to deal
    with cash or credit cards inside, you could instantly pay at the pump. The tag
    also played into brand loyalty as the convenience of it and the exclusiveness
    to one brand of service station meant that customers were more likely to return
    to those stations. The convenience also led to an increase in sales at the convenience
    stores attached as people were not handling real money and thus were apt to spend
    more.


    In 1999, Mobil Oil Corp. was purchased by Exxon, which became Exxon-Mobil and
    expanded the program out to the Exxon service stations as well making it one of
    the first large-scale RFID deployments used by the general public. Similar technology
    has been rolled out for other customer loyalty cards and payment systems, but
    the Speedpass was one of the most notable in terms of size (millions of tags and
    thousands of locations) and also in failure, as it was the first major system
    to fall under external research.


    The tag operated with a challenge/response authentication system. The interrogating
    reader sends a 40-bit challenge to the tag, which the tag then uses to calculate
    a 24-bit response, using a cryptographic algorithm incorporating a unique 40-bit
    key stored on the tag. The tag sends that response along with a unique 24-bit
    identifier, the unit''s serial number. The reader computes its own response to
    the challenge using the expected key for that tag''s serial number. If the reader''s
    expected response matches what the tag sent, the tag has confirmed that the tag
    is authentic and proceeds to debit the credit card or account stored in the backend
    database that is tied to that unique tag. All of this takes less than a second
    at the gas pump to process and allow for operation. The system also allows for
    multiple tags to be attached to the same account, allowing families and businesses
    to use them for easy purchases, a very handy feature for fleets and families.


    For many years, there was interest in the security of the system, but the incredibly
    tiny transponders were a mystery to researchers. The cryptographic system in use
    was proprietary and shielded behind nondisclosure agreements and application programming
    interfaces. It was the proverbial security by obscurity. Without knowing the internals,
    an attacker could only see what went into the tag and what came out, but had no
    idea of the intermediary process and no idea how to recreate it.


    Security by obscurity by definition only works so long as the secret remains secret;
    however, once that secret is known, the system that depends on it falls apart.
    Often, all it takes is a matter of time and effort. For Speedpass, that time and
    effort was put in by a team from Johns Hopkins University in 2005.14


    The Johns Hopkins team obtained an evaluation kit and a number of sample Speedpass
    tags. The key piece of their research was a presentation from a Texas Instruments
    (TI) engineer at the AES4 Conference in May, 2004, in Bonn, Germany.1 In these
    slides, the engineer gives a rough block diagram of the internals of the algorithm.
    This diagram was lacking many important details, but it provided a starting point
    for a “black box” approach to reverse engineering the algorithm. The team used
    their own DST tags, identical in function to the Speedpass tags, but they were
    able to specify their own key that allowed them to follow the known constant input
    and compare it to the output and use that to reconstruct the missing pieces of
    the algorithm internals. From there, they also changed individual bits of the
    input key to see what changed on the output to understand further details.


    The team ended up with a working model of the algorithm, written in software that
    provided the same resulting output from the known input provided to a real DST
    tag. This meant that they had confirmed a working simulator for known keys. But
    what about unknown keys, like on the Speedpass?


    The devil is in the details of any algorithm and the technology it is implemented
    on. RFID tags are very low-power devices, and since the DST tags are externally
    powered by the reader, they don’t have much power to work with in order to do
    the necessary computations of a complex algorithm, and most modern cipher algorithms
    are CPU intensive. To get a solution that fit on the hardware at hand, the TI
    engineers designed their own algorithm instead of using a publicly trusted one.
    They also chose the comparatively small key size of 40 bits to find the balance
    between the best security and the best performance on the tag. These decisions
    were not wrong by any stretch; it’s an issue of how long the security of the system
    would be in place before it could be upgraded, replaced, or phased out. In this
    case, it ended up lasting less than 10 years before it was first publicly compromised.


    The research team exploited this weak key, applying computing power that was previously
    unavailable when the system first came out. They knew that the 40-bit key provided
    1,099,511,627,776 combinations, which may seem like a lot, but it''s well within
    the range of a computer to calculate within a reasonable time frame.


    > NOTE

    > The term reasonable when talking about cryptography or cryptographers can have
    a greatly different meaning from that of the general populace. In cryptography,
    where an exhaustive search is expected to take billions of years, finding a way
    to drop that to a few hundred is quite a feat and considered a lot more reasonable,
    especially when advances in computing power may shave that value down even further.


    The researchers knew that they could capture sample output from an unknown tag
    by simply using their own reader to interrogate it with a known challenge. In
    this way, they know the algorithm, the challenge, and they can observe the response.
    The only factor left was the secret 40-bit key. The easiest way to recover that
    key (with the intention of duplicating it later) was to capture a couple of exchanges
    and then test every possible key to see if it obtained the same output given the
    same input at the tag being tested.


    The team found that a standard 3.8-GHz single-core PC could compute about 200,000
    keys per second, which would take a while to accomplish an exhaustive search (about
    64 days). To speed this up, they implemented the cracker program in hardware using
    field-programmable gate arrays (FPGAs) and small-programmable processors that
    are generally much, much faster than general-purpose CPUs at performing single
    tasks. Their implementation allowed 16 million keys to be tested per second on
    a single FPGA, which dropped the timetable down to about 21 h. They were able
    to use this to recover the key on a previously unknown Speedpass. Spreading the
    workload across 16 cards, however, allowed them to drop the time to around 1 h
    (on average).


    To verify their work and prove themselves to Texas Instruments, the team had TI
    provide five tags with keys selected and known by TI. Within 2h, the team recovered
    the keys to all the provided tags with their parallel cracking setup, thus confirming
    its abilities.


    Taking the research a step further, the team applied the time-space trade-off
    and built a “rainbow table” that contained precomputed arrays of inputs, outputs,
    and secret keys. At around 10Gb, the table could be used to simply look up the
    key of a tag based on the output from a known challenge, reducing the time to
    recover a key to about a minute, or as fast as a computer could do a search for
    the right challenge/response.

