- raw:
  - '[PAGE 128]


    # THE ATTACKS


    In early November 2009, news sites and technology blogs⁵ were all abuzz with news
    of an attack on Apple iPhones. Several Dutch users of jailbroken iPhones reported
    that their devices had been attacked and a ominous message left on their lock
    screen wallpaper indicating a Web site to visit to find out how to secure their
    devices. The Web site demanded five euros for instructions on how to secure the
    phones. After news broke, the attacker very quickly removed the demand for payment
    and posted instructions on how to secure the phones as well as an apology to users
    he had attacked. As guessed, his preferred method was default root passwords on
    jailbroken phones. This was the first public demonstration of the capacity for
    this vulnerability, but certainly not the first time it had been quietly abused.


    Later in November, another iPhone attack appeared in Australia⁶ utilizing the
    same attack vector. Except this time, the attack was automated and could spread
    automatically from phone to phone via Wi-Fi networks that vulnerable devices shared.
    The Ikee worm, as it was known, was the brainchild of Ashley Towns, a 21-year-old
    student. The worm infected jailbroken iPhones through default SSH passwords, but
    this time changed the background image to that of Rick Astley and the ringtone
    to that of the song "Never Gonna Give You Up" of RickRoll fame. The worm would
    then attempt to upload itself and do the same to other phones on networks joined
    by the infected device. Reports only indicate 100 phones or less were infected,
    but considering the small percentage of iPhones that are jail-broken, this number
    is interesting. While it is unclear if the actions of the Dutch extortion attempt
    had anything to do with inspiring the Ikee worm, it did bring its author to the
    attention of iPhone application developer Mogeneration who hired Towns as a developer
    after an interview process after hearing about his worm. They claim it was not
    due to the worm and that he passed their iPhone developer test with flying colors
    as any other employee would have to. There is great debate if hiring him is rewarding
    negative behavior and sets a dangerous precedent.⁶ Some see it as positive reinforcement
    of a negative action and that if there is the hint of a reward, others will attempt
    to copy that behavior in hopes being rewarded. The end result may be a great many
    people attempting to write worms for the iPhone or other devices in hopes of landing
    a job. Some see it as asking the fox to guard the hen house, hiring


    > NOTE

    > It is still unclear as to whether or not the worm could spread via 3G connections.
    Many providers differ in how devices are presented to the Internet at large. Many
    providers of 3G gateways heavily fire wall the incoming connections for the IP
    space used by wireless devices. They also may deny interclient communication.
    While this prevents some attack vectors, some providers may not be as restrictive
    and allow the types of connections required to spread this type of malware. Much
    of it depends on the infrastructure of the carrier that the device is connecting
    to and can vary from provider to provider.'
  - '[PAGE 129]


    the best talent possible. It is certainly not a debate that will end soon, nor
    likely ever to be resolved.


    These first two attacks were fairly benign and did little to no damage to the
    attacked devices. However, they defiantly showed the world that there were a significant
    number of jailbroken devices that could be compromised easily. It also showed
    that the user base was fairly un-savvy about the risks to these hybrid devices.


    Shortly after the first two attacks, a third worm showed up, but this time, with
    definite malicious intent. In the Netherlands, a worm nicknamed “Duh” started
    spreading to jailbroken iPhones with default root passwords in attempt to steal
    banking information. The worm would setup a botnet where a bot residing on the
    phone would wait for SMSes from ING bank and mobile transaction authentication
    numbers (mTANs), a six-digit number sent to Web banking users that they must enter
    in a short window of time to complete a transaction. An out-of-band authentication
    system to verify the owner is accessing the account. The system fails since the
    SMS is received on what amounts to the same computer that is accessing the Web
    banking portal, thus negating the out-of-band part and the security it implies.
    The bot intercepts the mTAN SMS and sends it to a remote system where the attacker
    has a small window of opportunity, logging in ahead of the legitimate user and
    gaining access to their funds. Though not widely spread, any successful attacks
    would have likely yielded enough funds to make the effort worthwhile to the attacker
    and likely would inspire similar attacks in the future.


    # FUTURE ATTACKS


    By no means is the future of attacks limited to RickRolling and bank fraud. The
    potential for these devices as vectors for other attacks is huge. The one constant
    within security is that threats are continuous and often will surprise everyone.
    Smartphones and hybrid devices are so very versatile that people are constantly
    coming up with new ways of applying these advantages in some surprising ways.


    Twitter founder Jack Dorsey started a new venture called Square (www.squareup.com).
    The company hopes to become a major player in mobile credit card payment systems.
    The company is developing a small credit card reader that plugs into the audio
    in jack of a smartphone like an iPhone and allows anyone to accept credit cards
    for purchases without the cost and burden of traditional credit card authorization
    systems.


    Motorola is also entering the field with their mobile payment module (www.motorola.com/Business/US-EN/Business+Product+and+Services/Accessories/Mobile+Computer+Accessories/Snap-ons/Mobile+Payment+Device/Mobile_Payment_Device_US-EN),
    which clips onto the bottom of a smartphone running Windows mobile to accept and
    process payments anywhere. Using existing commodity devices, lowers costs are
    associated with the equipment.'
  - '[PAGE 130]


    While these ventures are still in early stages, this does make for some interesting
    thoughts on hybrid device security. Since these devices now accept credit cards,
    they are a more interesting and valuable target for an attacker. No longer would
    an attacker just get away with contact lists and e-mail – he or she may be able
    to retrieve credit card information in bulk from these handheld devices.


    The technology is still evolving but Square and others are leveraging, in part,
    the ubiquity of the iPhone and its interface. Credit cards are entered by hand
    on the phone or through a reader connected to the phone. The transaction is routed
    over 3G or Wi-Fi to be authorized in real time. While this may seem convenient
    since you can now process credit cards from anywhere, it also presents an interesting
    angle for an attacker. iPhones are very easy to coax onto Wi-Fi networks with
    tools like Karma, and given their preference to automatically connect to known
    networks, this would override the 3G connection. It would take a very small amount
    of network routing over an alternate backhaul, and all the traffic would be routed
    through the attacker. Combine that with existing weaknesses in the secure sockets
    layer and how users deal with error messages, and the attacker has a decent chance
    of being able to record all transactions. The closed nature of the iPhone causes
    issues in this scenario, as well, since the application vendor cannot “peek under
    the hood” and make adjustments to the device to secure it further.


    This is still a theoretical situation as no major attacks have been noted (or
    at least noticed) via this or other methods. That said, there is nothing preventing
    a “perfect storm” of new vulnerabilities, slow patching cycles associated with
    cell phones, and opportunities that would not make for a very large and profitable
    attack.


    # Offensive Uses of Hybrid Devices


    There is also little assurance for those paying via such mobile payment systems
    that the devices have not been altered in some way. Perhaps an unscrupulous employee
    jailbroke the device and altered the device to send a second copy of the transaction
    to his or her personal e-mail. In the same way, the Ikee and Duh worms used jailbreak
    access to change system files without the users’ permission; the same access could
    be used by the user to alter the system and compromise others without their knowledge.


    Another angle not often considered is using hybrid devices as a tool for attack,
    rather than as the target. Walking into a target location with a laptop and a
    bunch of other gear may be fairly suspicious and get a fair bit of unwanted attention
    for the attacker, but walking in with an iPhone and tapping at its screen is something
    that is highly unlikely to be considered suspicious.


    At Defcon 16 in 2008, David Maynor and Robert Graham of Errata security gave a
    presentation called Bringing Sexy Back: Breaking in with Style in which they described
    a number of methods they had used to creatively break into companies during penetration
    tests.


    As part of the presentation, the duo discussed using an iPhone as a sort of Trojan
    horse to gain access to a facility and assess its internal wireless infrastructure.
    Inspired'
  md: '

    ## THE ATTACKS


    In early November 2009, news sites and technology blogs⁵ were all abuzz with news
    of an attack on Apple iPhones. Several Dutch users of jailbroken iPhones reported
    that their devices had been attacked and an ominous message left on their lock
    screen wallpaper indicating a Web site to visit to find out how to secure their
    devices. The Web site demanded five euros for instructions on how to secure the
    phones. After news broke, the attacker very quickly removed the demand for payment
    and posted instructions on how to secure the phones as well as an apology to users
    he had attacked. As guessed, his preferred method was default root passwords on
    jailbroken phones. This was the first public demonstration of the capacity for
    this vulnerability, but certainly not the first time it had been quietly abused.


    Later in November, another iPhone attack appeared in Australia⁶ utilizing the
    same attack vector. Except this time, the attack was automated and could spread
    automatically from phone to phone via Wi-Fi networks that vulnerable devices shared.
    The Ikee worm, as it was known, was the brainchild of Ashley Towns, a 21-year-old
    student. The worm infected jailbroken iPhones through default SSH passwords, but
    this time changed the background image to that of Rick Astley and the ringtone
    to that of the song "Never Gonna Give You Up" of RickRoll fame. The worm would
    then attempt to upload itself and do the same to other phones on networks joined
    by the infected device. Reports only indicate 100 phones or less were infected,
    but considering the small percentage of iPhones that are jail-broken, this number
    is interesting. While it is unclear if the actions of the Dutch extortion attempt
    had anything to do with inspiring the Ikee worm, it did bring its author to the
    attention of iPhone application developer Mogeneration who hired Towns as a developer
    after an interview process after hearing about his worm. They claim it was not
    due to the worm and that he passed their iPhone developer test with flying colors
    as any other employee would have to. There is great debate if hiring him is rewarding
    negative behavior and sets a dangerous precedent.⁶ Some see it as positive reinforcement
    of a negative action and that if there is the hint of a reward, others will attempt
    to copy that behavior in hopes of being rewarded. The end result may be a great
    many people attempting to write worms for the iPhone or other devices in hopes
    of landing a job. Some see it as asking the fox to guard the hen house, hiring


    > NOTE

    > It is still unclear as to whether or not the worm could spread via 3G connections.
    Many providers differ in how devices are presented to the Internet at large. Many
    providers of 3G gateways heavily firewall the incoming connections for the IP
    space used by wireless devices. They also may deny interclient communication.
    While this prevents some attack vectors, some providers may not be as restrictive
    and allow the types of connections required to spread this type of malware. Much
    of it depends on the infrastructure of the carrier that the device is connecting
    to and can vary from provider to provider.


    the best talent possible. It is certainly not a debate that will end soon, nor
    likely ever to be resolved.


    These first two attacks were fairly benign and did little to no damage to the
    attacked devices. However, they definitely showed the world that there were a
    significant number of jailbroken devices that could be compromised easily. It
    also showed that the user base was fairly unsavvy about the risks to these hybrid
    devices.


    Shortly after the first two attacks, a third worm showed up, but this time, with
    definite malicious intent. In the Netherlands, a worm nicknamed “Duh” started
    spreading to jailbroken iPhones with default root passwords in an attempt to steal
    banking information. The worm would set up a botnet where a bot residing on the
    phone would wait for SMSes from ING bank and mobile transaction authentication
    numbers (mTANs), a six-digit number sent to Web banking users that they must enter
    in a short window of time to complete a transaction. An out-of-band authentication
    system to verify the owner is accessing the account. The system fails since the
    SMS is received on what amounts to the same computer that is accessing the Web
    banking portal, thus negating the out-of-band part and the security it implies.
    The bot intercepts the mTAN SMS and sends it to a remote system where the attacker
    has a small window of opportunity, logging in ahead of the legitimate user and
    gaining access to their funds. Though not widely spread, any successful attacks
    would have likely yielded enough funds to make the effort worthwhile to the attacker
    and likely would inspire similar attacks in the future.


    ## FUTURE ATTACKS


    By no means is the future of attacks limited to RickRolling and bank fraud. The
    potential for these devices as vectors for other attacks is huge. The one constant
    within security is that threats are continuous and often will surprise everyone.
    Smartphones and hybrid devices are so very versatile that people are constantly
    coming up with new ways of applying these advantages in some surprising ways.


    Twitter founder Jack Dorsey started a new venture called Square (www.squareup.com).
    The company hopes to become a major player in mobile credit card payment systems.
    The company is developing a small credit card reader that plugs into the audio
    in jack of a smartphone like an iPhone and allows anyone to accept credit cards
    for purchases without the cost and burden of traditional credit card authorization
    systems.


    Motorola is also entering the field with their mobile payment module (www.motorola.com/Business/US-EN/Business+Product+and+Services/Accessories/Mobile+Computer+Accessories/Snap-ons/Mobile+Payment+Device/Mobile_Payment_Device_US-EN),
    which clips onto the bottom of a smartphone running Windows mobile to accept and
    process payments anywhere. Using existing commodity devices lowers the costs associated
    with the equipment.


    While these ventures are still in early stages, this does make for some interesting
    thoughts on hybrid device security. Since these devices now accept credit cards,
    they are a more interesting and valuable target for an attacker. No longer would
    an attacker just get away with contact lists and e-mail – he or she may be able
    to retrieve credit card information in bulk from these handheld devices.


    The technology is still evolving but Square and others are leveraging, in part,
    the ubiquity of the iPhone and its interface. Credit cards are entered by hand
    on the phone or through a reader connected to the phone. The transaction is routed
    over 3G or Wi-Fi to be authorized in real time. While this may seem convenient
    since you can now process credit cards from anywhere, it also presents an interesting
    angle for an attacker. iPhones are very easy to coax onto Wi-Fi networks with
    tools like Karma, and given their preference to automatically connect to known
    networks, this would override the 3G connection. It would take a very small amount
    of network routing over an alternate backhaul, and all the traffic would be routed
    through the attacker. Combine that with existing weaknesses in the secure sockets
    layer and how users deal with error messages, and the attacker has a decent chance
    of being able to record all transactions. The closed nature of the iPhone causes
    issues in this scenario, as well, since the application vendor cannot “peek under
    the hood” and make adjustments to the device to secure it further.


    This is still a theoretical situation as no major attacks have been noted (or
    at least noticed) via this or other methods. That said, there is nothing preventing
    a “perfect storm” of new vulnerabilities, slow patching cycles associated with
    cell phones, and opportunities that would not make for a very large and profitable
    attack.


    ## Offensive Uses of Hybrid Devices


    There is also little assurance for those paying via such mobile payment systems
    that the devices have not been altered in some way. Perhaps an unscrupulous employee
    jailbroke the device and altered the device to send a second copy of the transaction
    to his or her personal e-mail. In the same way, the Ikee and Duh worms used jailbreak
    access to change system files without the users’ permission; the same access could
    be used by the user to alter the system and compromise others without their knowledge.


    Another angle not often considered is using hybrid devices as a tool for attack,
    rather than as the target. Walking into a target location with a laptop and a
    bunch of other gear may be fairly suspicious and get a fair bit of unwanted attention
    for the attacker, but walking in with an iPhone and tapping at its screen is something
    that is highly unlikely to be considered suspicious.


    At Defcon 16 in 2008, David Maynor and Robert Graham of Errata security gave a
    presentation called Bringing Sexy Back: Breaking in with Style in which they described
    a number of methods they had used to creatively break into companies during penetration
    tests.


    As part of the presentation, the duo discussed using an iPhone as a sort of Trojan
    horse to gain access to a facility and assess its internal wireless infrastructure.
    Inspired

    '
