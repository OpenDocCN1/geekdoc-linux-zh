  mdcn: "\n在 Android 模式下，用户是守门人，可以对安全做出决策。在 iPhone 模式下，Apple 是守门人。所有应用都必须提交给 Apple\
    \ 并通过筛选流程后才能添加到 App Store。Apple 会检查源代码中明显的事项，例如游戏访问麦克风或通话功能以及它不应该执行的其他事项，但鉴于 Apple\
    \ 每周收到约 10,000 份应用和应用更新提交ᴸ 并且只有 40 名全职审查员ᴹ ，该流程因工作过载而遗漏某些内容或因过度谨慎而发生不必要的拒绝ᴺ 的可能性是真实存在的，并且已经发生。Android\
    \ 将决定权留给用户。冒犯性或不稳定的应用程序只是被用户卸载，即使如此，由于权限限制，不稳定或恶意的应用程序不太可能影响系统的核心和其他应用程序。\n\n\
    在 iPhone 及其他平台上，具有恶意意图或以某种方式被入侵的程序能够访问在同一用户下运行的任何程序的数据和资源。一旦程序突破限制，除了 App Store\
    \ 协议中 Apple 的准则外，没有其他限制。这意味着被入侵的邮件客户端理论上可以访问联系人列表并发送短信，这反过来会让用户花钱。阻止这一切发生的唯一因素是\
    \ Apple 不会允许此类应用程序获得批准并进入 App Store。\n\n## 常见威胁\n\n虽然 Android 和 iPhone 在应用安全所使用的模型上相当不同，但它们共享一些基本相似之处，使得智能手机和混合设备整体市场对攻击者来说比任何单一设备或品牌都更有趣的目标。\n\
    \n反对为智能手机增加额外安全性的一个常见论点是，与其他目标相比，任何单一型号或平台的手机数量相对较小。与庞大的基于 Windows 的联网 PC 数量相比，几百万部基于\
    \ Android 的手机的安装基数并不是一个非常大的目标基数。利用 Windows PC 上的漏洞比仅仅几百万部智能手机——而且并非全部在线或连接——具有更高的大规模成功机会。\n\
    \n然而，值得记住的是，这些手机本身就是计算机，整体上代表着数量非常庞大的设备，甚至在可预见的未来销量将超过笔记本电脑。ᴼ 放在一起，智能手机是一个相当可观的安装基数，尽管它们看起来各不相同，但在内部它们共享的比人们想象的要多。\n\
    \n为了节省成本、提高开发者采用率以及其他因素，现代智能手机现在利用现有的 UNIX 平台，而不是编写全新的操作系统。其中很大一部分包括开源工具和库。尽管外观不同，iPhone、Android\
    \ 操作系统，甚至为 Palm Pre 提供动力的 Palm Inc 的 WebOS，都共享许多共同的编程基础，这意味着所有设备都存在潜在的脆弱性。\n\n\
    其中之一就是 WebKit，即 iPhone 用于 Safari 浏览器和电子邮件客户端的引擎；Android 在其浏览器中使用它，而 WebOS 在整个操作系统中大量使用它来渲染应用程序。这个通用引擎是这三种新一代智能手机的基本组成部分。\n\
    \n这造成了一个有趣的情况，因为该引擎在三者中均用于浏览器，因此存在利用漏洞在三个平台上都生效的可能性，大大增加了目标基数，并减少了为特定平台定制攻击的需求。平台之间共有的使用方式也使攻击更容易。像\
    \ Google 的 Gmail 和其他基于 Web 的应用程序在移动用户中非常受欢迎，也正遭受大量攻击。\n\nWebKit 中的漏洞，例如跨站脚本漏洞，可能生成一个\
    \ iFrame 并被用于将这些 Google 应用程序的内容上传到攻击者在任何平台上的首选服务器。由于即使在 Android 的权限结构下浏览器也需要访问网络，这种操作将被允许。结合商场或会议等大型人群以及使用\
    \ Airpwn 向流量注入恶意脚本等客户端攻击，攻击者可以跨平台攻击用户，而不仅仅是一个平台。\n\n平台之间可能存在比 WebKit 更多的共同点，而攻击者以善于利用漏洞而闻名。如果发现此类漏洞，他们肯定会乐于扩大其潜在攻击范围。\n\
    \n## 摘要\n\n虽然未来很少完全如预测那样到来，但其中一些元素确实进入了市场。手机从简单的通信设备发展到混合移动计算平台，在相当短的时间内取得了令人惊叹的进步。多年来成本的下降，使每个人都能拥有一个，这以大多数人从未预料到的方式改变了我们的日常行为。\n\
    \n这些设备带来的和来自这些设备的威胁是社会需要适应的新挑战。虽然制造商可以内置安全机制来尝试预判攻击者并将其扼杀在萌芽状态，但仍然有许多事情可能出错。技术发展不会放缓以让社会跟上。消费者需要更积极地了解他们使用的设备的含义以及它们如何影响日常生活。\n\
