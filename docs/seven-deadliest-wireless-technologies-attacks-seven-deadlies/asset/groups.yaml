    \ coWPAtty 最初被修改以添加 WPA2 支持时，只需更改解析器中的几行代码；其余代码保持不变即可。\n\n破解 WPA 密钥的能力基于两件事：所用字典的质量和大小，以及攻击者愿意投入的时间。如果使用的密码短语不在提供给\
    \ coWPAtty 的字典中，则无法恢复密钥的机会为零。然而，如果你使用一个巨大的字典或尝试进行穷举搜索，你将会在此世上某处无限期地等待。取决于你的意图，在专业审计中，更容易也更可行的做法是直接索取密码短语并确保它不会出现在攻击者可能使用的字典中。在渗透测试或实际攻击的情况下，手动测试哈希是下一个选择。\n\
    \n你最好的期望是对网络进行审计，并确保密码不在（或在，取决于你的意图）攻击者可获得的任何合理大小的字典中。\n\n第一步是捕获客户端向网络进行身份验证时的四次握手。每个客户端都会执行此操作，在此过程中，密钥的哈希版本会通过空中发送。一旦我们获得它，就可以对其进行攻击。\n\
    \n如何捕获握手由你决定。可以使用的抓包工具如 Wireshark (www.wireshark.org)，但 Aircrack-ng 套件中的 Airodump-ng\
