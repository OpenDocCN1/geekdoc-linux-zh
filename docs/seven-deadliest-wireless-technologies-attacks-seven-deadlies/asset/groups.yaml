    > \n> 有趣的是，其中一些分析仪通常使用与消费级无线电相同的硬件但不同的固件。2007ᵇ 年发现，一些公司在其分析仪的硬件部分中使用了与消费级无线电相同的无线电芯片，唯一的区别是\
    \ USB 标识符上的一位数字和板载固件。人们很快就发现他们可以盗用分析仪的软件部分，修改廉价消费级蓝牙加密狗的固件，并获得分析仪的访问权限。不幸的是，对于研究而言，这帮助不大，因为正如上面所述，为了嗅探所有流量，你需要比随机攻击者多得多关于连接的信息。然而，这确实表明硬件是能够的，其余问题是软件的，并且可能可以构建开源协议分析仪。\n\
    \n为了嗅探蓝牙，我们需要监听原始基带信号并同时监听所有通道，以捕获可能经过的任何流量。这需要超出标准蓝牙适配器所能提供的功能。然而，这并不意味着没有希望。\n\
    \nGNU Radio 项目启动是为了创建一个软件定义无线电，让人们可以自由地破解无线电频谱。与用于在特定频率上发射和接收的专用硬件不同，GNU Radio\
    \ 设计了一个系统，使用可现场编程的门阵列，可以重新配置为任何用途。\n"
