    \n![](img/fa764b70be0fdcb44b75286d4f8589e2_37_0.png)\n\n### 图 1.10\nCoWPAtty 成功检索到密码短语\n\
    \n会报告成功。在图 1.10 中，CPU 每秒可处理约 100 个密码短语，并在 37 秒内遍历了相当短的字典（约 10,000 个词）。如果这是一个你经常审计的\
