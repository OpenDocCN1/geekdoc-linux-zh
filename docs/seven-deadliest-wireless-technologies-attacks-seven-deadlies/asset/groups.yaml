    \ suite of protocols rather than one cohesive package. When devices connect to\
    \ one another, the master device of the piconet sets the hop scheme to all slave\
    \ devices from its internal clock. Bluetooth operates using frequency hopping\
    \ spread spectrum (FHSS) across 79 channels, each 1 MHz wide and hops at 1600\
    \ hops/s, which means that if we don't know the clock of the master, there is\
    \ no easy way to follow the hopping sequence of the piconet. We won't be able\
    \ to get all the packets. As well, it is not possible on a standard Bluetooth\
    \ device to listen to all channels simultaneously, nor is it practical to have\
    \ 79 Bluetooth radios each listening to a single channel.\n\n> **NOTE**\n> \n\
    > There are Bluetooth protocol analyzers on the market that do allow you to sniff\
    \ all traffic. Typically these devices require the BD_ADDR of the master and slave\
    \ devices and must follow the communication from the beginning, and even then,\
    \ they can be tricky to get working right. These devices are not able to just\
    \ walk up and listen in on random Bluetooth conversations like you can with Wi-Fi\
    \ and monitor mode. These devices also cost thousands of dollars and are out of\
    \ reach for most attackers and researchers alike.\n> \n> An interesting thing\
    \ about some of these analyzers, though, is that they often use the same hardware\
    \ as consumer radios but different firmware. It was discovered in 2007ᵇ that some\
    \ companies used the same radio chip in the hardware portion of their analyzer\
    \ as consumer radios, the only difference being a single digit on the USB identifier\
    \ and the firmware on board. It did not take long before people figured out that\
    \ they could pirate the software portion of the analyzer, modify the firmware\
    \ on cheap consumer Bluetooth dongles, and have access to an analyzer. Unfortunately\
    \ for research, this was not of much help since, as noted above, you needed to\
    \ know a lot more about the connection than a random attacker would in order to\
    \ sniff all the traffic. However, this did point out that the hardware was capable,\
    \ that the rest of the issues were software, and that it may be possible to build\
    \ an open source protocol analyzer.\n\nIn order to sniff Bluetooth, we need to\
    \ listen to the raw baseband signaling and all channels simultaneously to capture\
    \ whatever traffic may be going by. This requires more than what a standard Bluetooth\
    \ adapter can do. However, that does not mean that there is no hope.\n\nThe GNU\
    \ Radio project was started to create a software-defined radio to allow people\
    \ to freely hack the radio spectrum. Instead of specialized hardware to transmit\
    \ and receive on a specific frequency, the GNU Radio went about designing a system\
    \ with a field programmable gate array that could be reconfigured to any purpose.\n"
