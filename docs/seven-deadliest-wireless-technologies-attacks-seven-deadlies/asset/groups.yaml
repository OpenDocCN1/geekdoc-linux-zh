    \nAircrack-ng 在此文件上运行并解析各种网络的数据包：\n\n```\naircrack-ng foo-01.cap\n```\n\n如果有多个网络的数据包，你将被提示通过从列表中选择来指定其中一个。完成后，攻击开始运行。首先尝试\
    \ PTW 攻击，然后对数据进行早期分析以尝试检索密钥。\n\n一次成功的攻击应产生类似于图 1.6 的结果，但密钥不同。\n\n## 情况好转又变坏\n\n\
    随着时间的推移，人们慢慢开始明白他们需要保护自己的网络。安全专家和 wardriving 社区抓住每一个机会警告人们运行开放网络的危险。\n\n> **NOTE**\n\
    > 有趣的是，wigle.net 在其从提交的网络中随时间推移的加密使用图表中显示，在 TJX 于 2007 年 4 月宣布出现问题以及随后媒体对无线安全问题的关注期间，出现了几乎\
    \ 1% 的明显“跃升”。图 1.7 显示了 wigle.net 随时间推移的加密使用图表。\n\n![](img/fa764b70be0fdcb44b75286d4f8589e2_30_0.png)\n\
    \n## 图 1.7\nWigle.net 加密使用图表\n\n注意曲线在 2007 年 5 月标记前不久开始的凸起。很能说明问题的是，人们在 TJX 泄露事件宣布后开始更加关注。\n\
    \n自 TJX 渗透事件披露以来，企业和个人的无线安全关注度有所提高。公司和个人不希望成为无线安全问题的下一个典型案例，纷纷努力从 WEP 升级到 WPA\
    \ 和 WPA2 安全。虽然这在安全性上是明显的提升，但并非没有问题。\n\n从密码学角度来看，WPA 和 WPA2 解决了 WEP 的许多问题。IV 计数器现在更大（48\
    \ 位），并且实施了各种对策以防止困扰 WEP 的问题。进一步的改进包括用消息完整性检查（MIC），即 Michael 校验和数据包序列强制执行，取代每个数据包上的简单循环冗余检查（CRC），以防止\
    \ ARP 重放和类似攻击。\n\n有一个问题设计者迄今为止无法消除。计算机安全自始以来就困扰的一个问题：人类的愚蠢。人们在选择难以破解的密码短语方面并不擅长。\n\
    \n## WPA 和 WPA2 简介\n\nWPA 版本 1 是 IEEE 在 WEP 明显走向衰败时创建的临时解决方案。担心大规模过时以及消费者因在不久前投资后被迫购买新设备而产生的反弹，WPA\
    \ 被设计为在为 WEP 设计的 AP 的有限硬件资源上运行。为此，WPA 仍使用 RC4 作为其流密码，这限制了设备负载。WPA2（也称为 802.11i）是\
    \ WPA 的最终且更安全的版本。WPA2 使用高级加密标准（AES）作为其流密码，这要安全得多，但需要仅在新一代 AP 中找到的资源，且在旧设备上不可用。\n\
    \n> **NOTE**\n> \n> WPA 的两个版本都可以在两种模式下运行。这些是预共享密钥（PSK）和企业或 RADIUS 模式。每个模式内有不同的设置，但这些是主要功能。\n\
    > \n> 在 PSK 模式下，AP 本身处理身份验证并包含客户端 STA 和 AP 用于建立安全连接的共享密钥。在企业模式下，连接的客户端的所有流量都被阻止，除非是到身份验证服务器。那里\
    \ AP 可以传递进一步的凭据，如用户名和密码或证书，这些可以集成到更大的身份验证方案中，如 Active Directory。\n> \n> 总体而言，PSK\
    \ 是家庭和小型企业最常见的解决方案。企业模式需要进一步的基础设施和更多复杂性，但具有集中控制和与目录服务集成以实现单点登录等附加好处。\n\n在此过程中，WPA\
    \ 和 WPA2 的设计者设法解决了除安全之外的问题。WEP 的一个问题是密钥本身，虽然不是从安全角度来看，而是从用户感到厌烦并关闭安全的角度来看。\n\n\
    WEP 密钥通常是 26 位十六进制数字（如果使用小于 128 位则更短），必须输入到客户端管理器软件中才能连接。这些密钥很长、复杂且容易输错，导致尝试连接系统时出现无尽的麻烦。此外，它们很难记住，因此几乎总是写在\
    \ AP 附近或用户桌子附近的便签上。更糟糕的是，大多数操作系统（OS）要求你手动输入两次，同时用星号或黑圈遮住你输入的内容。\n\n更糟糕的是，没有关于密钥应如何输入的标准定义。一些设备默认为十六进制使用密钥；其他设备以\
    \ ASCII 格式使用它。并不总是清楚需要哪种格式。这导致了无尽的问题，特别是对于使用不同制造商的 AP 和客户端适配器的人来说。经常有人会购买使用 ASCII\
    \ 密钥的 Apple Airport，并尝试使用其非 Apple 计算机的内置无线连接。另一个操作系统会要求以十六进制提供密钥，而 AP 会\n"
