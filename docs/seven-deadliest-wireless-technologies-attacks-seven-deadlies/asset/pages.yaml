  img_proc: true
- pgno: 102
  md: '# WARNING


    Replacing analog devices with digital devices does increase complexity; however,
    care should be taken that the replacement devices offer actual security. Many
    devices may use digital, but continue to send the data in the clear where anyone
    who receives the signal can decode the binary to the data. Many devices do not
    offer security beyond simple digital encoding. As with any technology, these devices
    should be investigated and understood before being deployed.


    One such example is digital signals from wireless keyboards. Many wireless keyboards
    operate on the 27 MHz band and while convenient, offer very little in terms of
    protection if they use encryptions at all. Remote-exploit.org released a paper⁶
    that detailed vulnerabilities in these systems. Essentially the encryption only
    applied to keystrokes and the encryption consisted of XORing the keystroke byte
    with a single byte random value (acting as the key). This only allows 256 possibilities
    to decrypt, a simple task for even the most low power computers. To demonstrate
    and audit for this, their proof of concept sniffer only required 20 to 50 keystrokes
    to get enough data to do a cryptanalysis by testing keys and looking through the
    decrypted data for common words to verify decryption.


    The Remote-exploit.org team went further and designed a dedicated hardware wireless
    keyboard sniffer that automatically listens for keyboards and decodes keystrokes
    in real time, writing them to an SD card, to a terminal via USB, an LCD display,
    or to the Internet over a GPRS or 3G backhaul. The project is called Keyeriki⁸
    and is open source meaning anyone can download the schematics and software and
    build his or her own sniffer. When one considers the interesting things that are
    typed on a keyboard through the day, this could be a very valuable tool in the
    hands of an attacker. The obvious and simple solution is to use a wired keyboard
    instead.


    the microphone is just muted at the sound board but audio is still being sent
    from the microphone to the base station. This can mean that private, off stage
    conversation is being broadcast, or more hilariously, private moments not meant
    to be heard by anyone (such as the infamous scene in The Naked Gun: From the Files
    of Police Squad! where Lt. Drebin forgets to turn off the wireless microphone
    he is wearing when he goes to use the facilities¹). Obviously turning off the
    radio goes a long way to preventing anything being broadcast that you don’t want
    to be. This also has the benefit of extending battery life which is a common problem
    among these units.


    Another option is encrypted microphones. These are relatively new on the market
    and offer strong encryption (including AES) of the audio from the headset to the
    base station. These units sometimes even offer a unique key distribution method
    to discourage static of default keys and usage of long and strong keys. The headset
    is connected to the base station via a cable (often USB) and the key new pushed
    to the headset over the wire, removing vulnerability of sending the key over the
    air and the'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'problem of manually typing a long key on a device without an interface. The
    major problem associated with these systems is the cost. They are often much more
    expensive, running higher than 10 times to cost for a headset and matching base
    station than their unencrypted cousins. They are common in legislatures and government
    office meeting rooms where security of presentations is paramount, but they are
    not very common outside of those venues, due to cost. Depending on the information
    being sent, it may or may not be necessary to use an encrypted microphone, but
    it is worth considering if the information is sensitive enough.


    Analog video signals are fairly easy to secure, mostly by avoiding the low end
    of the market (anything labeled "spy cam" or sold in those sorts of shops), which
    are almost always analog. Many brands offer connectivity via Wi-Fi or other digital
    links which have greater bandwidth as well as higher security than simple analog
    and leverage existing infrastructure and coverage. The capability to view the
    video from anywhere on the network is also a benefit as is the ability to digitally
    record. The usage of a Wi-Fi or other link also means that video can be viewed
    from anywhere in the world. Many Internet service providers (ISPs) are offering
    installation of Web cameras to monitor your home when away.


    # TIP


    Care should be taken to secure the network interfaces for these Wi-Fi and network-enabled
    cameras. Many are set up on networks with public Internet Protocol addresses.
    This means that unless there is a password or other authentication, anyone can
    connect and view the video stream. There is even quite the community of people
    who utilize online search engines to find cameras via phrases used on the Web
    interfaces. Most often you find a view of a street or lonely hallways, and sometimes
    you find retail stores or other businesses, but that does not stop people from
    searching for the elusive "shower cam."


    # SUMMARY


    For the better part of 100 years, we have been using wireless signals to communication.
    They so permeate the culture that we rarely think about the fact that these devices
    are tiny radio stations, sending out signals in all directions where anyone with
    a capable receiver can tune in and pick up those signals. In the world of security,
    this complacency and lack of understanding can be a great risk when company secrets
    and private details are being broadcast well outside the control of the user.
    Rarely is anyone asking questions about the tools we use every day.


    Care should be taken by everyone, not just businesses or professionals, to understand
    the devices we all use and how they operate, and ask questions about the security
    implications of this device being used in ways not originally conceived. Analog
    wireless devices are only a small piece of this but pose a great danger due to
    the ease at which they can be exploited.'
  merge: -1
  img_proc: true
