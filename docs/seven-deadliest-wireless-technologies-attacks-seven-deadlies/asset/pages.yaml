- pgno: 49
  md: 'attacker is in a prime situation to wreak some havoc. Add in-flight Wi-Fi to
    provide access to vulnerabilities unforeseen ahead of time, and there’s no limit
    to what can happen.


    # THE CRUX OF THE PROBLEM


    In the days of wired networks, many attacks required that the attacker find some
    way to insinuate himself between the victim and the system he was communicating
    with in order to monitor. At the very least, attackers had to find a way to get
    themselves onto the local LAN at one end or the other. Early on with hub-based
    networks, the attacker could see everything on the wire; later, switched networks
    required intermediate steps like arp spoofing the gateway for traffic to be rerouted
    through the attacker. This is generally known as a MitM attack since the attacker
    is impersonating both participants in the conversation and can monitor or manipulate
    the conversation as he or she sees fit. With physical constraints, you can limit
    an attacker’s access to the cable network since he or she physically would have
    to plug in or have remote control over a device in the local LAN.


    With wireless, this hurdle is reduced since, as you can see, it is very easy to
    get clients to route everything through you. With recent vulnerabilities in SSL,
    even encrypting Web pages or using virtual private networks (VPNs) can be defeated
    with tools like sslsniff (www.thoughtcrime.org/software/ssl sniff/). The worst
    case scenario with this situation is where users are not intending on using Wi-Fi
    at all.


    Often users will think themselves clever and utilize a non-Wi-Fi connection to
    connect to the Internet or VPN back into the office. The easy availability of
    3G modems and wired network connections at some hotels make this a realistic situation.
    Although it is a decent solution to the Wi-Fi problem, very often users will not
    disable their wireless adapter when using another network connection.


    Windows and other OSes are often intelligent enough that when multiple network
    connections are present, only the last, most recently used network will be used
    or, at least, the last connected gateway. Some systems, for various reasons, have
    their network interfaces bridged together (such as Windows Internet connection
    sharing capabilities). This can lead to an interesting situation where the client
    effectively becomes an access point and gateway to the other network connection.
    If this includes a VPN connection, the attacker is routed straight through and
    into the corporate network (or the Internet), creating obvious problems for corporate
    security.


    # SOLUTIONS


    With tools like Karma capable of impersonating any open access point, it’s very
    difficult to defend against the possibility of connecting to a fake access point.
    The best defense is to limit what can occur should that situation happen.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'The first countermeasure is to use a software firewall with a policy that passes
    only needed traffic through and denying the rest. Should you find yourself connected
    to a fake access point, at least you aren’t sharing all your files with the attacker.


    The next solution is to just avoid Wi-Fi wherever possible and disable your adapter
    when not in use. If a wired connection is available, choosing that option instead
    and disabling the wireless adapter while ensuring precautions like firewalls are
    in place will greatly reduce threats.


    Be wary of connecting to anything you cannot verify. When you are at an airport
    and can see six access points, how do you know if the airport only has five and
    which is the attacker? Most public hotspots do not publish the BSSID of the access
    points, so there is no way to know which are legitimate. Those that do publish
    the SSID on a sign make it easier for attacker to know what name to impersonate.
    Connecting to public Wi-Fi is a gamble. Even the BSSID for a legitimate AP can
    be easily impersonated (checking the BSSID does reduce the chance of exploit a
    bit as it’s a step that attackers sometimes do not exploit). Using a 3G or other
    cellular Internet connection is probably a safer bet.


    If possible, install an alternate client manager. Due to standards being what
    they are, you are not limited to the client management software included with
    your wireless adapter. Often the manufacturer offerings are simple and cannot
    enforce any rules about what and where to connect. There are many aftermarket
    client managers available, typically from wireless security vendors who can provide
    a bit more logic and sanity to the situation. One example is Airtight Networks
    SpectraGuard (Secure Agent For Endpoints), which can enforce policies to prevent
    insecure behaviors, such as connecting to insecure access points (connections
    must be encrypted), preventing ad hoc connections, and preventing bridging of
    adapters and only allow connections to specific BSSIDs, providing much more granular
    selection of access points than just selecting by SSID. This sort of system has
    obvious benefits for large corporate users who can use existing central management
    tools to push out such software and prevent users from being able to make dangerous
    mistakes. Often, such software can also go beyond controlling just Wi-Fi and enforce
    rules for Bluetooth, WiMax, dial-up, or any other network connections.


    # INJECTION ATTACKS


    In 2004, at Defcon 12, something was strange on the network. Now anyone familiar
    with the annual Defcon Hacker conference each year in Las Vegas knows that the
    network setup for that weekend is probably the most hostile network on the planet.
    You are truly taking your life (or at least your computer’s life) into your own
    hands by connecting since the network is generally known as a free-for-all zone.
    The common joke is that they should just turn the firewalls around and keep the
    Defcon network off the Internet: it’s easier that way. This year, however, something
    that was causing confusion was an odd behavior on the wireless network that no
    one was really able to explain. Given the concentration of intelligence at the
    conference, this was a rare occasion.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'Users typically will sit around the "chill-out" areas and work away on who
    knows what on their computers. At one point, users started noticing that images
    on Web pages they were requesting were not what they were expecting. Requests
    for Google''s home page would return Google, but the main image would be different
    than expected. This same image showed up across multiple pages on multiple sites
    for multiple users. Of course, being Defcon and the juvenile bent that tends to
    inhabit attendees, the image was one of a rather horrific nature. Obviously, users
    expecting Google''s iconic logo and receiving a horror show instead led to some
    truly puzzled users and some amazingly funny reactions (I did mention, "most hostile
    network on the planet". What were they expecting?)


    Various users went about checking DNS settings, checked to see if they were connected
    to a rogue AP, or went as far as to fire up a packet sniffer to figure out what
    was happening. Few, if any people (other than the perpetrators) figured out what
    happened that weekend until the announcement was made later by the perpetrators
    of this rather hilarious hack. A guy going by the name of Toast took credit and
    released the tool he coded to do it, called Airpwn.


    To understand what is being attacked, you must understand how things operate normally.
    When you request a Web page, your system connects to the remote server with the
    basic SYN/ACK handshake:


    ```

    ```

    Client -> Server "GET /foo.html HTTP/1.0" seqno 123 ack 456

    Server -> Client "<HTML...>" seqno 456 ack 145

    ```

    ```


    The client browser sends a GET request for the page specified, "GET /foo.html
    HTTP/1.0", along with a sequence (SEQNO) number and an acknowledgment number (ACK)
    for the previous packet. The server normally returns packets containing the requested
    hypertext markup language (HTML) page, specifying a higher SEQNO and ACK of the
    previous packet. The process is repeated for every file on the page (images, Java
    Script, and so on).


    Airpwn works off of a simple premise that works like this: On an open network,
    an attacker can see your packets go through the air much like an old shared medium
    (hub-based) wired network. A normal Web server''s requests will take a bit of
    time to make the round trip. Since we are in the same room, we can often reply
    faster than the remote server.


    The attack looks like this: A normal request for a file is made, except that the
    attacker sees it. He then crafts a response with appropriate SEQNOs and ACKs,
    forging the source MAC address to appear to be from the access point as if it
    were the legitimate response, except the response contains the attacker''s content.
    Provided the content is small enough to be sent before the real packets arrive,
    the attacker can close the connection with a Finish (FIN) packet. The original
    request will now be out of sequence and be discarded. The browser will accept
    the attacker''s content and render it accordingly to whatever damage to delicate
    sensibilities that may involve. In the sample configurations, there are several
    different examples. Figure 2.1 shows simple image replacement where images are
    replaced with the "AIRPW NED" graphic. Figure 2.2 shows replacement of the HTML.'
  merge: -1
  img_proc: true
