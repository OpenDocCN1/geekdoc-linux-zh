  md: 'know the PIN of the remote device can connect. This may mean asking the owner
    of the other cell phone or just the fact that you own the device means you set
    its PIN and know it. Other variations include having the second device enter a
    code which has to be entered on the first device as well, thus requiring user
    interaction and avoiding default PINs. Once the PIN is entered, the devices handshake,
    and a link key is established, and now the devices are bonded and trust one another.
    This is an over simplification of the internals of the process, but the main issue
    here is not one of internals but of externals.


    The most common attacks on Bluetooth devices are due to default PIN numbers. Many
    devices come preset from the factory with a PIN that the user is asked to change.
    Usually those instructions are buried in the manual and are ignored by the user.
    Other devices, such as headsets, have no interface in which to change the PIN,
    so their PINs stay static. The most common PINs are 0000, 1234, and 9999. A quick
    Google search for a specific device will turn up the manual, which will usually
    contain the default PIN, right next to instructions on how to change it. This
    situation leaves plenty of room for an attacker to play. The most famous of these
    attacks involving default PINs concerns Bluetooth headsets.


    # Carwhisperer


    It''s hard to escape them. Bluetooth headsets have become incredibly commonplace
    in daily society. The adoption rate has recently skyrocketed due to local laws
    that ban using a hand-held cell phone while driving. For others, they have been
    elevated to fashion accessories. Needless to say, as long as Bluetooth phones
    remain popular, these devices will continue to flourish.


    Headsets are also related to the increasingly popular in-car Bluetooth hands-free
    devices. Occasionally integrated in vehicles by the manufacturer, and also available
    as after-market units, these systems take advantage of the car''s built-in stereo
    system to allow the driver (or passenger, as it may be) to hear the audio from
    the phone while keeping both hands free (hopefully to drive). A small microphone
    is used to relay voice of the driver to the phone and to the other party – essentially,
    the same function as a headset, just not as fashionable, and not the easiest to
    wear on your head. For the remainder of the chapter, both in-car systems (manufacturer
    installed and after market) and wearable headsets will be discussed as the same
    thing since they are functionally identical.


    Early Bluetooth security research noted that the usage of default PINs was going
    to be a problem since users, given the option, often not change a default setting
    unless forced. This led to carwhisperer being developed to exploit this.


    In July 2005, carwhisperer was released by Martin Herfurt of the Trifinite group
    (http://trifinite.org/trifinite_stuff_carwhisperer.html). This software took advantage
    of the default PIN situation to provide a fun and sometimes frightening prank.


    Carwhisperer is a series of scripts along with the actual application. The first
    cw_scanner probes for devices with the device classes common to headsets and hands-free
    devices. Once one has been found, the carwhisperer program initiates a connection'
