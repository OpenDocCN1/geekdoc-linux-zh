- pgno: 105
  md: '# Bad Encryption


    # 6


    # INFORMATION IN THIS CHAPTER


    +   - History

    +   - Proper Encryption

    +   - Passports

    +   - Passport Summary

    +   - Speedpass

    +   - Advanced WPA and WPA2 Cracking


    Wireless is a technology with an inherent problem, common to pretty much all standards.
    It’s not really a technical problem, but one of physics. Most wireless gear works
    on radio frequencies, but others work over light spectrum, such as laser and infrared,
    and can be considered wireless as well. Most systems have the inherent security
    problem of a shared medium. Anyone else who is within the range of the signal
    can receive it just as easily as the intended recipient. For an attacker, this
    makes sabotage much, much easier. When eavesdropping on these signals became a
    security issue, the logical and best solution for the problem was to encrypt the
    signal, or at least the message at the heart of what was being communicated. This
    is logical since it now means that the intended recipient will know how to decrypt
    the signal and read the message, but an attacker will just receive an unreadable
    mess that, without the key, will be indecipherable in a reasonable amount of time.


    Given that wireless communications by their nature can be intercepted, protection
    is very important. Throughout this book, encryption has been mentioned as a way
    to keep eavesdroppers from reading wireless communications. However, encryption
    is not an easy thing to implement in products and protocols, and poor implementations
    can leave a false sense of security and really poor implementations can fail spectacularly.


    While it is always a good idea to put crypto into wireless products, it requires
    a great deal of thought as to how these devices may be attacked and how to do
    it right. New electronic passports are being distributed to the citizens of many
    countries,'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'many of which have no idea that the encryption system protecting the digital
    data on them is fairly weak. The intention was admirable but this actually makes
    things less secure since the expectation is that the crypto will protect their
    passport, rather than the citizen taking necessary steps to protect his or her
    own passport.


    Companies are using alternative payment systems to build brand loyalty. Many of
    these technologies have already been found wanting in their security, putting
    the reputation and finances of everyone involved at risk.


    # HISTORY


    Messages have always needed to be protected from prying eyes of others for thousands
    of years. Early forms of this can be seen in the “Caesar shift cipher” so named
    after Julius Caesar who used it to communicate secretly with his armies. The Caesar
    cipher is a substitution cipher that takes the alphabet and replaces each letter
    of the original plain text with a letter of the alphabet a set number of letters
    down the alphabet. So in a Caesar cipher with a shift of three, the letter A becomes
    the letter D, B becomes E, and so on. Once the entire message is encoded like
    this, the message can be sent to the recipient and the process reversed. If the
    message was intercepted in transit, the message was unintelligible to the interceptor.


    Obviously, in modern times, this form of encryption is not considered secure by
    anyone more than small schoolchildren using it to pass secret messages. However,
    despite the obvious reasons not to use it, this form of encryption is still in
    use today in modern systems, more commonly known as ROT encryption. ROT (meaning
    rotate) is followed by the number of places to shift down the alphabet between
    the plain text and the encrypted text. The most common of these is ROT13, which
    means characters are moved 13 places down the alphabet. A becomes N, B becomes
    O, and so on. This system is also its own inverse; you repeat the same process
    to decrypt it. To decrypt, you simply move each letter of the encrypted text down
    13 letters, looping back to the original letter of the plain text. Among the security
    and encryption communities, this is considered the most basic form of encryption
    and should never be used to actually protect something important. It’s little
    more than an exercise in programming and moving bits around. That, however, doesn’t
    stop people from trying to use it.


    In 2001, Dimitri Sklyarov,^a a Russian national, gave a presentation at Defcon
    9 in Las Vegas about E-book security. His presentation pointed out that, among
    other things, one company’s portable document format security product that cost
    about $3,000, simply encrypted the document with ROT13. Adobe was not pleased
    with this information being made public and shortly after the conference was completed,
    his hotel room was raided and he was arrested for violations of the Digital Millennium
    Copyright Act. The case was larger than just the contents of the presentation
    and included charges based on the fact that the software his employer, Elcomsoft,
    was'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'selling were available for download from the United States. Charges were eventually
    dropped, but the case remains to this day an example of how far companies will
    go to protect their poor security methods from scrutiny.


    A common and recurring theme throughout technology is that encryption solves everything
    and solves nothing at the same time. Proper usage and implementation is a major
    factor in how security functions overall. The corollary to this is that as you
    add complexity to any system, usability and stability rapidly approach zero. Adding
    too much complexity actually makes systems easier and more prone to breaking.
    In any system, a balance must be found in order to attain the best security for
    the situation.


    # PROPER ENCRYPTION


    In the world of encryption, it is worth explaining what a few common terms actually
    mean as they can differ from their normal everyday uses. The largest of these
    is about the word “security” and how it relates to protecting something secret
    from those who should not have it.


    Security in the crypto world is measured by how long a message can reasonably
    remain secure and unreadable in the hands of a determined attacker. If you have
    a secret, say a muffin recipe, writing it on an index card means anyone can read
    it. In order to protect it from prying eyes of other bakers, you can encrypt the
    message in such a way that it is unreadable to someone unless they know the secret
    (or key) to deciphering it. Now a determined attacking baker who really wants
    the recipe is willing to spend days or weeks to get it. If you only used ROT13
    encryption, the recipe won’t stay hidden for long.


    The defense used by most encryption systems against a brute force attack is key
    size. Much like a combination lock, encryption deals with high numbers of combinations
    to thwart attackers. Brute force attacks involve an attacker performing an exhaustive
    test of every possible key for the encryption system. An example is the ubiquitous
    combination lock. Usually this needs three numbers, entered in sequence, to open
    it. On a lock with 30 numbers, this means that there are 30 × 30 × 30 possibilities
    of combinations, which equals 27,000 combinations. Assuming 10 s to enter and
    try each combination, this totals about 6½ h of constant attack to try every combination
    (though the attacker is likely to discover the correct combination well before
    that). This is more than an attacker can probably do standing in front of a locker
    without looking suspicious. Assuming that an attacker can discover the combination
    on average in about half the key space, security should be built to take that
    into consideration (guard rotations and changing the combination regularly). In
    the digital world, the combination is the key and the length of that key specifies
    the number of combinations possible. These keys can have millions, trillions,
    or even higher numbers of possibilities, meaning that an attacker has a much larger
    number to go through in order to decrypt the message. A well-designed algorithm
    will have a key length and strength sufficient that an attacker would have to
    work for billions of'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'years in order to exhaust all possibilities of keys to recover the secret.
    The idea is that the secret will remain a secret for longer than it is useful,
    usually long after anyone who cares has passed on.


    The strength of a well-designed encryption system is commonly thought to be in
    the secrecy of the key, not the algorithm. That idea is the basis for most modern
    cryptanalysis. The idea goes that an encrypted message can be obtained by an attacker
    and they can know everything about the algorithm and how it works and that there
    are no shortcuts to the plaintext except knowing the proper key. So long as the
    key remains secure, the message should be as well, even in the hands of an attacker.


    A good cryptography system is open for inspection by everyone and has been vetted
    by experts, and the consensus established that the algorithms used are secure.
    Many companies and products attempt to add security (or make up for poor security)
    by hiding the details of their encryption system behind patents, trade secrets,
    or non-disclosure agreements. This is usually called security by obscurity and
    is generally not considered a very good security system. In security by obscurity,
    if an attacker learns how the system works, usually he or she is able to figure
    a way around it or a shortcut through it. In the case of Dimitri Sklyarov, the
    products being used to secure E-books were hiding behind security by obscurity.
    Once the secret was revealed, there was no way to rescue the system. It was broken
    as soon as that information was released. Other companies have to make compromises
    due to many factors, such as size, cost, and available computing power, when implementing
    an encryption system, and security by obscurity becomes a necessary part of the
    system. These situations are sometimes more complicated than others for an attacker,
    but they all have the problem that once the genie is out, there is no way to put
    it back in the bottle.


    # TIP


    > Anytime you look at products that use encryption, it''s worth looking at their
    descriptions. Terms like million bit key, totally unbreakable, proprietary algorithm,
    or hacker proof, are often signs that the company did not use a publicly vetted
    algorithm and created their own. Further investigation with these companies usually
    terminates in a statement resembling "trust us," which is a big sign that you
    might not want to. A company using the "trust us" defense will often say that
    their own experts say its secure and that it''s been approved by some group or
    another, but almost always, those people are under nondisclosure agreements and
    cannot talk about specifics.


    # PASSPORTS


    After the events of September 11, 2001, security of international travel documents
    was driven to the forefront of everyone''s mind (ignoring the fact that the attackers
    held valid U.S. visas). One of the initiatives was the implementation of additional
    layers of security within passports through the use of electronics to give the
    documents some brains as it were. Until that point, a passport was a paper document
    with many anticounterfeit measures incorporated, but was still just a physical'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'document and a skilled forger could create a reasonable clone of one given
    enough time and materials. The International Civil Aviation Organization¹ (ICAO)
    is the international body that oversees commercial travel standards in most countries.
    The policies and procedures they establish allow planes from pretty much any country
    to be able to fly to any other country safely and without incident. They are also
    the main body for establishing travel document standards. They are the group that
    dictates what information needs to be on a passport, its size, shape, and other
    features. This allows travelers easy passage between countries and streamlines
    the process for border control officials.


    International pressures led the ICAO to issue DOC 9303, entitled "Machine Readable
    Travel Documents."b This laid out the standards for a machine-readable passport
    system that integrated digital biometrics and cryptography into passports. The
    system involved a Radio Frequency Identification (RFID) chip implanted in the
    passport that could be interrogated by border control, in addition to the physical
    document. This standard allowed for any country to verify the authenticity of
    any other country’s passport electronic data.


    Though some countries choose to include biometrics such as fingerprints into the
    tag, the standard only requires that the information contained on the photo page
    of the passport (name, birth date, country, and so on) including the photo be
    incorporated along with appropriate digital cryptographic signatures of the data.
    This effort meant that not only would forgers have to modify or recreate the physical
    document, they would also have to successfully forge the contents of the RFID
    tag as well and have it match the contents of the physical passport and pass cryptographic
    muster. Border guards now had an additional tool to verify the identity of the
    person presenting the passport. The person in front of them should match the photo
    on the passport, as well as the digital version of the photo on the chip, as well
    as the two photos matching each other.


    However, being that this chapter is about bad encryption, you can guess that the
    system has a few problems that were made apparent only after these new advanced
    passports were distributed to the public and they had a chance to evaluate them
    themselves.


    The RFID chip in the passports is a standard ISO 14443 tag, which defines its
    radio interface to the world. They operate on 13.56MHz and are powered by the
    reader like many tags commonly used for inventory control or door access. Unlike
    inventory control tags, passport tag contents are encrypted so they cannot be
    directly read from the device until a special 24-digit code, unique to the passport,
    is sent from the reader letting the passport know that this reader is authorized
    to receive the information stored on the tag. Once authenticated, the tag sends
    over its contents along with a digital signature of those contents, signed by
    the issuing country’s private key. The digital signature allows the border control
    agent to quickly verify that the contents have not been altered and are signed
    by the country of issue using known public keys from all participating countries.'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'In ideal operation, an attacker would be unable to access the contents without
    the 24-bit key to begin transmission; however, situations are rarely ideal. In
    order for efficiently moving travelers through passport control, there had to
    be an easy way to allow border agents to know the key for each passport, short
    of countries constantly exchanging massive databases of individual codes for every
    passport issued. The solution was the machine-readable zone (MRZ) on every passport.
    The MRZ is the jumble of characters at the bottom of the passport photo page.
    This area is meant to be scanned via optical reader and contains things like name,
    passport number, date of expiration, and so on. The passport agent swipes the
    page through an optical reader, saving the agents from having to type all that
    information themselves into their database. The key is generated from this MRZ
    data and automatically used to receive the tag contents and display them for comparison
    to the physical document and the person presenting it. In theory, this means that
    the tag has a 24-character key, which under ideal circumstances would mean 36^24
    possible keys, a daunting task for an attacker using brute force.


    The problem is that since the key is based on set, guessable ranges of values,
    the key space shrinks dramatically. A birth date in the MRZ, for example, is a
    two-digit year, two-digit month, and two-digit day. This means that there are
    only 100 possible years, 12 possible months, and 31 possible days for the key.
    An exhaustive search of that part of the key would be 365 × 100, which equals
    36,500 possibilities. If you know the rough age of your target, you can narrow
    that even more to, say, 10 years, 5 years on either side of a guess for only 3,650
    possibilities or less. Passports are issued for a limited period of usually 5
    to 10 years, depending on the country. This limits the range of the issue/expiration
    date as part of the key and even more so if RFID tags in passports have only been
    available for a short time. Passport numbers are a bit trickier to guess; however,
    some countries have numbering systems based on the date of issue and are sequential.
    The base value jumps a set amount each day by a fixed amount (passports issued
    January 1 would be 00001 and increase incrementally, January 2 would start at
    10001, and so on). Again, this allows an attacker to narrow down the key space
    for the passport number.


    In 2007, Adam Laurie^c proved this with a challenge from a reporter. Taking a
    newly issued passport that had been delivered through the mail, he was able to
    access the RFID tag and read its contents through the envelope using only information
    on the envelope and the public records. The outside of the envelope is distinctive
    as having a passport and includes a postmark and the name and address of the recipient.
    The postmark greatly narrows the date of expiry to within a few days as well as
    the likely passport number in some countries. The name and address allowed for
    a public records search of the target and yielded a birth date, another piece
    of the key. This means that with a simple reader (since it''s a standard interface)
    and some simple software, a thief could steal a new passport, read all the contents,
    and put the original back without the victim even knowing that the passport had
    been read. The information in a passport would allow an identity thief to do all
    sorts of things. This attack'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'also does not have to be limited to new passports in envelopes. Since the interface
    is over the air, an attacker could use a computer in a briefcase and sit next
    to a target on a train or bus and have a reasonable chance of retrieving the tag
    contents. Since there is no limit to the amount of times an attacker can try a
    key (unlike the PIN on your ATM card), it is just a matter of time.


    Some countries have identified these problems and attempted to mitigate some of
    the issues. Some countries have changed the issuing pattern of passport numbers
    to increase the amount of keys an attacker would have to test. The U.S. implemented
    perhaps the best-known defense with their passport book covers being layered with
    a metal foil to act as a Faraday cage to prevent the reader carrier signal from
    powering the tag and thus sending a signal.


    # EPIC FAIL


    When electronic passports were first being considered, the overwhelming majority
    of experts thought it was a bad idea from a privacy and security standpoint. Many
    people questioned the reasoning behind the choice of a radio-based technology
    when contact-based options (smart cards) were available. In general, RFID is considered
    a very suspect technology with many conspiracy theories about clandestine monitoring
    of citizens and the potential for terrorists to use the technology to identify
    targets by nationality.


    Debunking these theories is difficult and was not helped in 2008 at the Hackers
    On Planet Earth conference in New York City. At that conference, one of the keynote
    presentations was by Adam Savage, one of the hosts of Mythbusters on Discovery
    channel. During the Q&A portion of the talk, he was asked by RenderMan about RFID
    and why the show, well known for debunking urban legends and pseudo-science, had
    not tackled many of the conspiracy theories surrounding RFID technologies. His
    answer greatly helped fuel the flames of the conspiracy crowd. He explained that
    they had investigated the subject for the show, but when the fellow host Tory
    Belleci participated in a conference call with Texas Instruments (TI) to get some
    background, also on the line were the chief legal counsels for most of the major
    credit card companies (who use RFID in some payment systems) – the story continued
    that the legal counsels all forcefully pressured the show not to show any vulnerabilities
    in RFID technology. Like many conferences, the presentations were recorded and
    very quickly a clip of the answer found its way to YouTube.


    Shortly afterward, after much media attention, Adam sent out a statement recanting
    the story as him getting the facts very wrong having heard it from the second
    or third person. The call did happen; however, not as Adam thought it did. Host
    Grant Imahara was the team member on the call and there was only one legal representative
    attending. At no time did anyone pressure the show to not pursue the angle (Texas
    Instruments was trying to arrange for it to happen) and it was the show''s decision
    not to go forward with the tests.


    So the epic fail and the lessons learned are twofold. First, asking a simple question
    about the security of a system is a good thing but the answer may be more than
    you bargained for. Second, particularly with security technology, be very aware
    of the facts before making a statement about its positive or negative impacts
    as many people are often dependant on these technologies for their safety and
    security and will fight to set the matter straight if you are wrong in any way,
    leaving you looking foolish.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'The cryptographic problems get worse once you consider that not all passports
    are created alike. While interoperability was a goal with the ICAO standards,
    not all portions of it were mandatory and countries were allowed to make their
    own decisions in some cases regarding the authentication methods. One method available
    against cloning one chip to another is called active authentication (AA). With
    AA, the legit passport is embedded with a private key that cannot be directly
    read but can be used cryptographically with a public key on the tag to verify
    those tag contents are original to that tag. A cloned tag would not have that
    private key and thus would fail the test. This feature is optional, however, and
    many countries have chosen not to support it, meaning systems have to deal with
    it not being there. Researchers at The Hackers Choice² found that if they copied
    the tag contents, altered them, and deleted the original public key on the tag,
    they could sign the tag contents with their own key from a nonexistent country
    and pass several automated passport control systems (though doubtful any that
    included a guard). The problem was that many of these systems checked to see that
    the contents were signed by the key pair on the tag, but failed to check if those
    keys were trusted and actually came from the country it claimed to be issued from.
    Many countries, systems do not do this and would need to patch or upgrade their
    systems to perform this check.


    # PASSPORT SUMMARY


    While the battle between document issuers and document forgers is a never-ending
    battle, the addition of digital components makes the job just that much harder.
    However, no system is completely safe, and compromises made for ease of implementation


    **WARNING**


    While electronic passports are here to stay for the foreseeable future, many people
    are uncomfortable with them. There are many who advocate damaging the RFID tag
    to prevent any reading. While this may sound like a good idea, it is worth becoming
    very familiar with the implications of this for your country.


    In the United States, an electronic passport where the tag fails is still a valid
    document⁶ for travel until its expiration. The U.S. border agents may give you
    more scrutiny than other travelers, but you will not be stopped solely for a broken
    tag since it would be very bad to leave travelers stranded at the border if they
    sat on their passport accidentally. What is not clear is if other countries apply
    the same consideration.


    In some circumstances, it may be also considered tampering with a federal document
    if you intentionally damage the tag, which may have unforeseen consequences when
    attempting to use it to cross a border.


    While protecting your personal security and privacy is important, it should be
    done in accordance with your local laws and the laws and policies of your destination.'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'and use severely lowered the amount of security available in passports. The
    lack of understanding in both government and private citizens about these weaknesses
    mean that very often, they will grossly overestimate how secure a document is
    with digital components, calling it uncloneable and forgery proof. Terms and ideas
    like that make people much more likely to put more trust into such documents and
    likely to let reasonable forgeries pass with less scrutiny that their nondigital
    counterparts, thus defeating the whole purpose of the system in the first place.


    # SPEEDPASS


    Payment systems have an obvious need for encryption. Given the financial incentive
    to attack these systems, it''s a natural fit to encrypt payment information whenever
    possible. Payment systems also demand ease of use and quick turnaround to be appealing
    for customer, retailer, and payment processor alike. To that end, many companies
    have instituted their own payment options for their stores and services over the
    years, but in 1997, things took a leap when Mobil Oil Corp. created the Speedpass
    system.


    The Speedpass was a small plastic fob on a keychain that contained a glass capsule
    134.2-MHz digital signal transponder (DST) from Texas Instruments. These tags
    were small and cheap to purchase in quantity, allowing them to be given away for
    free. The tag''s identifier was tied to a credit card or checking account of the
    customer''s choice and automatically charged the account with just a wave of the
    tag past the reader built into the gas pump. The theory was that it was more convenient
    since all you needed to purchase fuel was the tag – removing the need to deal
    with cash or credit cards inside, you could instantly pay at the pump. The tag
    also played into brand loyalty as the convenience of it and the exclusiveness
    to one brand of service station meant that customers were more likely to return
    to those stations. The convenience also led to an increase in sales at the convenience
    stores attached as people were not handling real money and thus were apt to spend
    more.


    In 1999, Mobil Oil Corp. was purchased by Exxon, which became Exxon-Mobil and
    expanded the program out to the Exxon service stations as well making it one of
    the first large-scale RFID deployments used by the general public. Similar technology
    has been rolled out for other customer loyalty cards and payment systems, but
    the Speedpass was one of the most notable in terms of size (millions of tags and
    thousands of locations) and also in failure, as it was the first major system
    to fall under external research.


    The tag operated with a challenge/response authentication system. The interrogating
    reader sends a 40-bit challenge to the tag, which the tag then uses to calculate
    a 24-bit response, using a cryptographic algorithm incorporating a unique 40-bit
    key stored on the tag. The tag sends that response along with a unique 24-bit
    identifier, the unit''s serial number. The reader computes its own response to
    the challenge using the expected key for that tags serial number. If the readers
    expected response matches what the tag sent, the tag has confirmed that the tag
    as authentic and proceeds'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'to debit the credit card or account stored in the backend database that is
    tied to that unique tag. All of this takes less than a second at the gas pump
    to process and allow for operation. The system also allows for multiple tags to
    be attached to the same account, allowing families and businesses to use them
    for easy purchases, a very handy feature for fleets and families.


    For many years, there was interest in the security of the system, but the incredibly
    tiny transponders were a mystery to researchers. The cryptographic system in use
    was proprietary and shielded behind nondisclosure agreements and programming application
    program interfaces. It was the proverbial security by obscurity. Without knowing
    the internals, an attacker could only see what went into the tag and what came
    out, but had no idea of the intermediary process and no idea how to recreate it.


    Security by obscurity by definition only works so long as the secret remains secret;
    however, once that secret is known, the system that depends on it falls apart.
    Often, all it takes is a matter of time and effort. For Speedpass, that time and
    effort was put in by a team from Johns Hopkins University in 2005.14


    The Johns Hopkins team obtained an evaluation kit and a number of sample Speedpass
    tags. The key piece of their research was a presentation from a Texas Instruments
    (TI) engineer at the AES4 Conference in May, 2004, in Bonn, Germany.1 In these
    slides, the engineer gives a rough block diagram of the internals of the algorithm.
    This diagram was lacking many important details, but it provided a starting point
    for a “black box” approach to reverse engineering the algorithm. The team used
    their own DST tags, identical in function to the Speedpass tags, but they were
    able to specify their own key that allowed them to follow the known constant input
    and compare it to the output and use that to reconstruct the missing pieces of
    the algorithm internals. From there, they also changed individual bits of the
    input key to see what changed on the output to understand further details.


    The team ended up with a working model of the algorithm, written in software that
    provided the same resulting output from the known input provided to a real DST
    tag. This meant that they had confirmed a working simulator for known keys. But
    what about unknown keys, like on the Speedpass?


    The devil is in the details of any algorithm and the technology it is implemented
    on. RFID tags are very low-power devices, and since the DST tags are externally
    powered by the reader, they don’t have much power to work with in order to do
    the necessary computations of a complex algorithm, and most modern cipher algorithms
    are CPU intensive. To get a solution that fit on the hardware at hand, the TI
    engineers designed their own algorithm instead of using a publicly trusted one.
    They also chose the comparatively small key size of 40 bits to find the balance
    between the best security and the best performance on the tag. These decisions
    were not wrong by any stretch; it’s'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'an issue of how long the security of the system would be in place before it
    could be upgraded, replaced, or phased out. In this case, it ended up lasting
    less than 10 years before it was first publicly compromised.


    The research team exploited this weak key, applying computing power that was previously
    unavailable when the system first came out. They knew that the 40-bit key provided
    1,099,511,627,776 combinations, which may seem like a lot, but its well within
    the range of a computer to calculate within a reasonable time frame.


    > NOTE

    > The term reasonable when talking about cryptography or cryptographers can have
    a greatly different meaning from that of the general populous. In cryptography,
    where an exhaustive search is expected to take billions of years, finding a way
    to drop that to a few hundred is quite a feat and considered a lot more reasonable,
    especially when advances in computing power may shave that value down even further.


    The researchers knew that they could capture sample output from an unknown tag
    by simply using their own reader to interrogate it with a known challenge. In
    this way, they know the algorithm, the challenge, and they can observe the response.
    The only factor left was the secret 40-bit key. The easiest way to recover that
    key (with the intention of duplicating it later) was to capture a couple of exchanges
    and then test every possible key to see if it obtained the same output given the
    same input at the tag being tested.


    The team found that a standard 3.8-GHz single-core PC could compute about 200,000
    keys per second, which would take a while to accomplish an exhaustive search (about
    64 days). To speed this up, they implemented the cracker program in hardware using
    field-programmable gate arrays (FPGAs) and small-programmable processors that
    are generally much, much faster than general-purpose CPUs at performing single
    tasks. Their implementation allowed 16 million keys to be tested per second on
    a single FPGA, which dropped the timetable down to about 21 h. They were able
    to use this to recover the key on a previously unknown Speedpass. Spreading the
    workload across 16 cards, however, allowed them to drop the time to around 1 h
    (on average).


    To verify their work and prove themselves to Texas Instruments, the team had TI
    provide five tags with keys selected and known by TI. Within 2h, the team recovered
    the keys to all the provided tags with their parallel cracking setup, thus confirming
    its abilities.


    Taking the research a step further, the team applied the time-space trade-off
    and built a “rainbow table” that contained precomputed arrays of inputs, outputs,
    and secret keys. At around 10Gb, the table could be used to simply look up the
    key of a tag based on the output from a known challenge, reducing the time to
    recover a key to about a minute, or as fast as a computer could do a search for
    the right challenge/response.'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'Applying the attack, the team built the next logical thing, a tag simulator,
    using their software implementation of the tag to emulate a legitimate tag in
    the field and use it to make a purchase. The necessary equipment took up most
    of the back seat of the test vehicle, but they succeeded in obtaining a real tag''s
    secret key and then emulating it to commit a "fraudulent" purchase (the tag was
    owned by a researcher, so it wasn''t fraud, but an attacker would not be so discerning).
    The equipment size is just a matter of engineering to reduce to easily an easier,
    more portable size to allow for sneak attacks.


    The resulting fallout from this research was not mass fraud or a breakdown of
    the entire payment system. The team responsibly kept back details of the algorithm
    and did not make their implementations public. This made it harder for any attacker
    to copy their work but allowed them to prove that the research was correct. In
    addition, Exxon-Mobil was already beginning plans to phase out the older tags
    in favor of newer, more secure tags.


    The conclusion best drawn is that the air interface of the Speedpass allows an
    attacker access to the communications. The security of those communications depends
    entirely on the strength of the algorithm protecting it, and that what was considered
    secure one day, may not be secure the next day.


    # ADVANCED WPA AND WPA2 CRACKING


    Chapter 1, 802.11 Wireless – Infrastructure Attacks focused on Wi-Fi infrastructure
    attacks and included weaknesses in Wi-Fi Protected Access (WPA) and WPA2. It is
    worth exploring the future of these attack vectors and the security that WPA Pre-Shared
    Key (WPA-PSK) and WPA2-PSK provide.


    Current attacks on WPA and WPA2 in PSK mode depend on the guess-ability (or entire
    lack) of the passphrase used. While an exhaustive search is still out of the realm
    of possibility, if an attacker can guess your passphrase or you use a very common
    one, there is a good chance that you may be compromised. All of this depends on
    the ability to choose a passphrase that is longer and more random than the ability
    of an attacker to muster enough computing power to end up testing that passphrase
    in a reasonable amount of time. The idea was that a sufficiently long and random
    passphrase was enough to thwart most attackers and that the SSID being used as
    a salt made those attacks even more difficult.


    In late 2009, Moxie Marlinspike launched wpacracker.com and the wireless world
    took notice of the availability of cheap processing power and its potential in
    password cracking. The service uses Amazon''s EC2 cloud computing service to allocate
    processing power for cheap as compared to actually building it yourself. For $35,
    the service will test a capture (in the same way coWPAtty does) for a single SSID
    against 135 million word dictionary and return results in about 20 min (no guarantee
    of a success though). There are also options for a dictionary in German, as well
    as an extended English dictionary. The final one-off option is all the dictionaries
    combined for a total of 520 million words against the target network.'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'One can imagine that a determined attacker could probably muster more than
    $35 to devote to having half billion words tested in a very small amount of time.


    The 802.11i standard allows for a minimum of 8 and a maximum of 64 characters
    with most users falling well below the 20-character mark. Chances are statistically
    significant that the passphrase for many potential targets is in that list and
    security could be compromised in less than an hour for less than a console video
    game.


    When you consider that attackers don’t even have to use the automated service,
    they could just operate their own virtual cracking machine in the cloud where
    money is the only limit or just hire or create a botnet to do something similar
    at their beck and call.


    This availability of cheap processing power should make anyone reconsider “good
    enough” in their security solutions. In the case of WPA-PSK and WPA2-PSK, the
    power available to an attacker should make one pause to think if they are capable
    of coming up with a suitable passphrase or if it’s time to evaluate other solutions
    like WPA2-Enterprise, which uses external authentication and is not subject to
    the same brute force attack vectors.


    # SUMMARY


    While encryption is a solution to protect wireless communications, it’s not simply
    a matter of bolting it onto an existing product and calling it a day. The selection
    of algorithm, the implementation, and a reasonable expectation of the length of
    time something will last should be considered.


    Algorithms used should be publicly vetted and trusted by the cryptanalysis community.
    Any companies with proprietary or homemade algorithms, while they do work, should
    be considered with a grain of salt as you cannot independently confirm the security
    in place. It’s a matter of “trust us” from the developer.


    Even if a trusted algorithm is used, poor implementation can cause security to
    suffer greatly if the keys are easily discovered or guessed. As well, understanding
    what you are protecting can help you evaluate if the solution will protect your
    secrets for longer than they will be useful.


    Crypto is necessary in our daily lives to keep things private and secret. It’s
    also really hard to do right. Care should be taken to evaluate any products for
    their security implications, even those that seem to take it to heart.


    For any products that use encryption, there are several guidelines that you should
    keep in mind when evaluating their potential effectiveness:


    +   - Algorithms should be freely available for scrutiny and analysis.

    +   - Algorithms should have a history of withstanding rigorous attacks.

    +   - Anything secret, proprietary, or that contains “miracle” marketing claims
    should be treated with skepticism.

    +   - Assume that the attacker knows the algorithm. This should not help them
    in any meaningful way.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '+   - Acknowledge that any system can be broken with enough time and resources.

    +   - Scale those resources appropriate to the length of time something needs
    to remain secret.

    +   - Encryption should only be part of a larger system of security.


    # Endnote


    1. www.icao.int: [accessed 12.09].'
