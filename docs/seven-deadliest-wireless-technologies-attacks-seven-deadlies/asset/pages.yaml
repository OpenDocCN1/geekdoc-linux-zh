    TIP


    Some phones have open RFCOMM ports but are not advertised via SDP. These ports
    are leftovers from diagnostics used by the manufacturer and can be accessed by
    connecting to the channel directly. Depending on the phone, there are 60 channels
    available for simultaneous use. An attacker can just step through all ports to
    see if any respond. This is a time-consuming process, and it is more likely that
    he or she already knows which phones have these back channels open. If you are
    working to assess a Bluetooth device, it is worth stepping through all RFCOMM
    channels, just to be sure.


    It is worth noting that a direct RFCOMM connection is not required to extract
    or abuse a target device. Other Bluetooth profiles can be abused to read information
    from devices. Profiles like OBEX push, typically used to push contacts from one
    device to another, can be exploited since the connection is actually two-way.
    Instead of pushing a contact, an OBEX GET request is made for a known filename.
    Files such as telecom/pb.vcf, which is the device’s phone book, would be most
    useful to extract. This type of connection often does not require authentication.
    Some devices can also be caused to crash by pushing a vcard (a contact) with a
    very long file name, causing a buffer overflow and, possibly, crashing the phone.


    At this point, it must be pointed out that many of these attacks have been mitigated
    through firmware upgrades and improved UI design. From about 2003 to 2007, these
    attacks were widespread as the technologies were new, and the user base was unaware
    of the risks. Many phones now are not discoverable, and most manufacturers have
    improved their implementations so as to not expose users to such risks.


    That being said, there are always new devices coming on the market with Bluetooth
    capability. There may be an occasion where a manufacturer slips up and exposes
    a vulnerability. From the perspective of an IT or security manager, it would be
    a good idea to evaluate all Bluetooth devices and their peripherals for obvious
    vulnerabilities before allowing them in production environments.


    From an auditing standpoint, tools like Bluetooth Stack Smasher (www.secuobs.com/news/05222006-bluetooth10.shtml)
    are invaluable as they have fuzzing capabilities to allow for discovery of previously
    unknown issues of security and stability.


    # WHOLESALE SNIFFING


    In 2007, n.runs released Bt crack, a Windows program to crack Bluetooth link keys
    (www.nruns.com/_en/security_tools_btcrack.php). While this would seem to be a
    death sentence for Bluetooth, there is a problem. Sniffing the packets necessary
    to enable the crack to occur is a lot harder to catch than you would think.'
  merge: -1
  img_proc: true
- pgno: 69
  md: "As with any wireless technology, it all boils down to the fact that it is a\
    \ radio, and radios operate in a shared medium, the electromagnetic spectrum.\
    \ As such, its presence is impossible to hide. In order to communicate, it has\
    \ to betray its presence. In the case of Bluetooth, this is the 2.4 GHz spectrum,\
    \ the same as 802.11b/g/n networks; however, its operation is markedly different\
    \ from Wi-Fi that creates some unique issues.\n\nUnlike Wi-Fi, there is no monitor\
    \ mode equivalent in Bluetooth since it's a suite of protocols rather than one\
    \ cohesive package. When devices connect to one another, the master device of\
    \ the piconet sets the hop scheme to all slave devices from its internal clock.\
    \ Bluetooth operates using frequency hopping spread spectrum (FHSS) across 79\
    \ channels, each 1 MHz wide and hops at 1600 hops/s, which means that if we don't\
    \ know the clock of the master, there is no easy way to follow the hopping sequence\
    \ of the piconet. We won't be able to get all the packets. As well, it is not\
    \ possible on a standard Bluetooth device to listen to all channels simultaneously,\
    \ nor is it practical to have 79 Bluetooth radios each listening to a single channel.\n\
    \n> **NOTE**\n> \n> There are Bluetooth protocol analyzers on the market that\
    \ do allow you to sniff all traffic. Typically these devices require the BD_ADDR\
    \ of the master and slave devices and must follow the communication from the beginning,\
    \ and even then, they can be tricky to get working right. These devices are not\
    \ able to just walk up and listen in on random Bluetooth conversations like you\
    \ can with Wi-Fi and monitor mode. These devices also cost thousands of dollars\
    \ and are out of reach for most attackers and researchers alike.\n> \n> An interesting\
    \ thing about some of these analyzers, though, is that they often use the same\
    \ hardware as consumer radios but different firmware. It was discovered in 2007ᵇ\
    \ that some companies used the same radio chip in the hardware portion of their\
    \ analyzer as consumer radios, the only difference being a single digit on the\
    \ USB identifier and the firmware on board. It did not take long before people\
    \ figured out that they could pirate the software portion of the analyzer, modify\
    \ the firmware on cheap consumer Bluetooth dongles, and have access to an analyzer.\
    \ Unfortunately for research, this was not of much help since, as noted above,\
    \ you needed to know a lot more about the connection than a random attacker would\
    \ in order to sniff all the traffic. However, this did point out that the hardware\
    \ was capable, that the rest of the issues were software, and that it may be possible\
    \ to build an open source protocol analyzer.\n\nIn order to sniff Bluetooth, we\
    \ need to listen to the raw baseband signaling and all channels simultaneously\
    \ to capture whatever traffic may be going by. This requires more than what a\
    \ standard Bluetooth adapter can do. However, that does not mean that there is\
    \ no hope.\n\nThe GNU Radio project was started to create a software-defined radio\
    \ to allow people to freely hack the radio spectrum. Instead of specialized hardware\
    \ to transmit and receive on a specific frequency, the GNU Radio went about designing\
    \ a system with an field programmable gate array that could be reconfigured to\
    \ any purpose."
  merge: -1
  img_proc: true
- pgno: 70
  md: 'The end result was the Universal Software Radio Peripheral (USRP), the companion
    hardware to the GNU Radio software, which allows researchers to reconfigure the
    device to behave like any radio device they need.


    The USRP has some limitations for this end. The USRP2 (second-generation hardware)
    has a maximum receive bandwidth of 25 MHz, meaning that it can only read 25 Bluetooth
    channels at once, so you would need four USRP2s in order to scan all channels
    and capture everything.


    Various projects like the GR-Bluetooth project (http://gr-bluetooth.sourceforge.net/)
    aim to turn the USRP into a baseband receiver capable of scanning all Bluetooth
    channels and capturing all traffic through various techniques. The project is
    ongoing and continually posts new code to its Web site.


    In order to capture the necessary packets to crack the link key (the PIN is unnecessary
    to crack since it''s used to derive the link key, and if you know the link key,
    reconnection is possible without victim interaction), there are a couple of options.
    The first involves impersonating the slave device in the piconet. The attacker
    determines the BD_ADDR of both devices. He or she then changes the BD_ADDR of
    his or her adapter to the BD_ADDR of one of the slave devices. The new slave tells
    the master that it has lost the link key, causing the master to request a new
    link key from the real slave. This is then captured and fed into Btcrack and out
    pops the link key with which can be used to decrypt the traffic captured from
    then on.


    # BLUETOOTH VIRUSES


    Viruses are incredibly common today and are part of the background noise associated
    with the Internet and computing. While news of a new virus on a desktop computer
    rarely gets attention anymore, it is a surprise when it someone''s phone that
    gets infected, particularly through Bluetooth.


    Bluetooth has already been an infection vector for certain Bluetooth-borne viruses.
    The most well known of these viruses was the Cabir worm. In 2004, this worm surprised
    the world since it attacked cell phones instead of desktops. Targeting phones
    using the popular Symbian OS (SymbOS), the virus spread over Bluetooth connections
    automatically. Once a device was infected, no action was needed by the user to
    spread it; however, to be infected required a fairly large amount of user interaction.
    In this case, users would receive a request to transfer a file over Bluetooth
    from an infected device. They would then have to accept the transfer despite some
    devices warning against such actions. Once accepted, they would have to run the
    file, which would install the virus and begin propagation. The virus would then
    seek out other discoverable Bluetooth devices and continue the process.


    Despite this obvious complexity, users still installed the virus and contributed
    to the infection. Often the infected device would repeatedly send transfer requests
    to the targeted device requiring the user to keep hitting "no." Often, the user
    would get frustrated with the incessant requests and would hit "yes" to find out
    what the fuss was'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'about. Fortunately, various errors in the worm''s programming limited its infection
    attempts to only one other device, keeping its propagation small and manageable.


    This virus and others contributed to a small but growing industry for mobile device
    antivirus solutions. While not as common as its Internet-borne cousins, Bluetooth-based
    malware continues to be a potential issue that users have to understand and manage.


    # SUMMARY


    Despite everything that you hear about Bluetooth security and its failings, it
    is not as bad as it seems. Many of the failings were initially due to poor implementations
    by manufacturers. As time has progressed, manufacturers have caught up on how
    to implement Bluetooth devices properly, avoiding these issues. However, with
    so many new devices coming on the market every day, it is very likely that issues
    will potentially creep back in, particularly from manufacturers new to making
    Bluetooth devices.


    Care should be taken in any environment to ensure that users understand the risks
    associated with their Bluetooth devices. At the least, cursory testing should
    be done on any new device to make sure it does not have any glaring holes.


    Ensuring that default PINs are not used and that Bluetooth functionality (at least
    discoverability) is properly configured can go a long way to limiting the impact
    of Bluetooth threats.'
  merge: -1
  img_proc: true
