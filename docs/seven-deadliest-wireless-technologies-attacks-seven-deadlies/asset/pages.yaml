- pgno: 22
  md: '# EPIC FAIL


    An interesting note about Gonzalez is that it appears he began the attacks on
    TJX while working as an informant for the U.S. Secret Service.


    Gonzalez was a member of the Shadowcrew, an online group that ran a Web site with
    over 4,000 members, devoted to the buying, selling, and trading of stolen credit
    card numbers. The group trafficked more than 1.5 million credit card numbers.
    When members of the group began to be arrested, Gonzalez turned informant and
    helped with the indictment of 19 other members of the Shadowcrew.


    As he worked for authorities, he apparently began a new crime spree under the
    noses of his FBI handlers. This included the TJX attacks. An obvious black eye
    for the agency, his ability to hide his activities for so long is a useful lesson
    to future investigators. His usage of remote computers and encryption should be
    viewed as a testament to the creativity of online criminals to hide their activities.


    While many details are not fully known, the seemingly biggest and most well-reported
    entry point was a St. Paul, Minnesota store''s wireless network. The indictment
    of Gonzalez and others indicates that Marshalls and TJX stores were penetrated
    through wireless networks in Miami from their own parking lots. The full extent
    may never be known, but it is clear that wireless networks were a component in
    these attacks.


    Using freely available software, the attackers identified the network and proceeded
    to crack the WEP key used to secure the network. This provided access to the store''s
    network and gave a foothold into the larger corporate network and all the data
    it contained. Whether it was a targeted attack of this specific store and chain,
    or if it was just that they happened by and noticed the weak security, we probably
    won''t know. Various prosecutions of the perpetrators, though, show that many
    different companies were penetrated and were probably all just targets of opportunity
    rather than of a specific agenda. The one common element seems to be the presence
    of these businesses along U.S. interstate 1 in Florida. Likewise, the attackers
    just drove down the interstate and collected data, returning to tempting and weak
    targets later.


    Various reports since then have indicated that the store''s wireless network was
    secured using WEP. At the time, WEP was known to be fatally flawed and was already
    outmoded by the introduction of WPA encryption. These networks are often installed
    for the convenience of bar-code-reading scanner guns used at many stores for inventory
    control; these connect back to the store server over wireless. Many of these systems
    are only capable of WEP and are non-upgradeable, and given the amount already
    invested, companies are often slow to upgrade. Further complicating matters and
    contributing to the complacency was that, at the time, stores had to meet the
    Payment Card Industry (PCI) security standards in order to be allowed to take
    credit and debit cards. Recommendations were made to TJX to upgrade its wireless
    security to WPA; however, it seems from corporate e-mails that upgrades were delayed
    in favor of the cost savings associated with not replacing the equipment in'
  merge: -1
  img_proc: true
- pgno: 23
  md: "many stores. In addition, VISA, one of the members of the PCI group, gave TJX\
    \ a pass on their compliance with the condition they would do something to improve\
    \ their wireless security in time. One can be certain that after the incident,\
    \ wireless security was taken much more seriously. Suddenly, the original costs\
    \ of upgrading seem a lot smaller than the subsequent costs of cleanup and bad\
    \ press.\n\n# UNDERSTANDING WEP CRACKING\n\nWEP was the original encryption scheme\
    \ included in the 802.11b wireless standard from 1997. At the time, strong encryption\
    \ was considered a defense by the U.S. State Department (a lot of manufacturers'\
    \ head offices were located in the United States) and since there were restrictions\
    \ on exportation to foreign countries, the key length was limited to 40 bits.\
    \ This was later relaxed to allow 64- and 128-bit keys to be exported. For many\
    \ years, this was the only security standard available for wireless.\n\n> **NOTE**\n\
    > \n> There have been many proprietary security methods available as well. Some,\
    \ such as Lightweight Extensible Authentication Protocol (LEAP), are better than\
    \ WEP but require end-to-end solutions from a single company like Cisco. This\
    \ increased cost and broke much of the interoperability that made 802.11 so appealing,\
    \ and never caught on outside homogenous networks in corporations and almost never\
    \ for home users.\n\nAs early as 2001, implementation problems with the WEP encryption\
    \ scheme led to the first real break. The problem revolved around the initialization\
    \ vector (IV) field of the scheme, a random number concatenated with the network\
    \ key, used to provide some randomization to the scheme. WEP is based on the RC4\
    \ stream cipher algorithm, and as with any stream cipher, identical keys must\
    \ not be used. The IVs change with each packet and eventually repeat, giving an\
    \ attacker two packets with identical IVs. The counter used for IVs was 24 bits\
    \ long, which on a fairly busy network meant that there was a good chance that\
    \ after 5,000 packets, an IV would be repeated, yielding an IV collision where\
    \ two packets were encrypted with the same key, thus providing a basis for cryptanalysis.\
    \ If more collisions are encountered, this increases the chances of an attack.\n\
    \nTools began to emerge like Aircornᵇ that required 5 to 10 million packets to\
    \ be captured for analysis. On a particularly busy network, this would take a\
    \ couple of hours to collect. On quieter networks, it could take days, and even\
    \ then, it was very much a hit-or-miss situation. These tools were later replaced\
    \ by the original Aircrackᵉ suite of tools, which introduced some new methods\
    \ of attack and reduced the amount of data needed between 200,000 and 500,000\
    \ packets for 40- and 64-bit WEP and a million for 128-bit WEP, a much more manageable\
    \ amount to capture."
  merge: -1
  img_proc: true
- pgno: 24
  md: 'Further development of tools allowed for faster and more efficient use of IV
    data. The advent of the ARP replay attack really shortened the time needed to
    perform an attack. The ARP replay attack is where an encrypted ARP packet (known
    because of its unique size, even when encrypted) is captured from a network and
    retransmitted back to the AP, which in turn sends back another ARP packet with
    a different IV. This is done rapidly and repeatedly and creates a huge amount
    of IVs to be used and the counter to roll over and duplicate IVs to be sent. This,
    along with improvements to Aircrack (by this time abandoned by the original author
    and now reimplemented as Aircrack-ng), reduced the time to execute an attack from
    hours and days to as little as 10 min.


    The Pychkine–Tews–Weinmann (PTW) attack was arguably the final nail in the coffin
    for WEP. This attack was able to use more of the packets for analysis and only
    needed 20,000 to 50,000 packets to work. In combination with the ARP replay attack,
    this could be executed in as little as 60s, start to finish, yielding the hexadecimal
    WEP key for the target network.


    In the case of TJX at the time of the initial attack, it was widely known WEP
    had issues and some of these tools had been around for a few years already (since
    at least 2005 for Aircrack). It was just a matter of a determined attacker to
    spend the necessary time and energy along with a laptop, wireless card, and felonious
    intention to penetrate the wireless network at that fateful store one night.


    # HOW TO CRACK WEP


    Cracking WEP today is actually a frighteningly easy prospect. Original tools were
    fairly slow, hit or miss, and generally required a lot of data. After approximately
    7 years of development, these tools have reached a point of refinement that makes
    breaking WEP a fairly reliable outcome.


    There are many tools available that break WEP, but the most popular is Aircrack-ng
    ("ng" denoting new or next generation as opposed to the original Aircrack by Chris
    Devine that has been since abandoned). This section will be a quick tutorial to
    the steps necessary to break WEP and recover a key.


    > **WARNING**

    > Under most jurisdictions, any attempt to recover a key from a network you do
    not own or have permission to do so is very likely a crime. As noted with the
    TJX attack, there are very real consequences to breaking networks, no matter how
    easy it may seem.

    > If you want to test this or any other security tool, it is the best and safest
    thing to do so with your own equipment or that which you have express permission
    from the owner. Cracking your neighbor''s WEP key may sound like fun, but it''s
    a felony. Don''t do it.


    This guide assumes several things since there is no way to know what exact configuration
    of equipment you might be using. Usage should be similar no matter your platform:


    +   - Laptop running Ubuntu 9.04

    +   - Atheros 802.11b/g wireless card

    +   - Madwifi-ng drivers (0.9.4) from http://madwifi-project.org/'
  merge: -1
  img_proc: true
- pgno: 25
  md: '**TIP**


    Probably the most important part of any wireless tool kit will be a compatible
    wireless card. For the most part, Atheros-based work is the best for Linux and
    wireless penetration testing since the drivers for Linux are very open and capable
    of doing many of the odd things necessary to enable some of these attacks.


    Check the Aircrack-ng Web site for a list of supported and recommended cards:

    www.aircrack-ng.org/doku.php?id=compatibility_drivers


    The first step is to acquire the Aircrack software. This is available from the
    Web site www.aircrack-ng.com. It is available in several different packages for
    Unix systems and Windows along with bootable Linux distros and VMware images.


    Aircrack is actually a suite of tools. The namesake is the actual tool that does
    the cracking. Around it are many helper applications to help you get what you
    need. For the most part, you will only need to worry about four programs: Airmong-ng,
    Airodump-ng, Aireplay-ng, and Aircrack-ng.


    Once you have the Aircrack suite installed or built, you''ll need to start capturing
    packets. To do so, you''ll need to put the card into monitor mode in order to
    listen to packets.


    **TIP**


    For the Madwifi drivers used in making this guide, it was necessary to take some
    additional steps to prepare the card for monitor mode.


    The Madwifi drivers operate as a "parent" device usually named wifi0, wifi1, etc.,
    and make virtual interfaces (VAPs) that are what programs actually interact with
    (ath0, ath1, etc.). You can have up to four VAPs off of any one parent device
    acting in different capacities but having multiple devices can cause issues. For
    instance, if you have one VAP in monitor mode trying to channel hop and another
    in client (STA) mode, if the STA-VAP associates with an AP, the parent device
    cannot keep changing channels, which screws up the monitor mode VAP.


    Unless you need to have multiple VAPs, it''s a good idea to destroy them before
    creating a new one to do monitor mode. This is easily done with the command wlanconfig:


    (where ath0 is the VAP you want to destroy). Otherwise, if you want to start fresh,
    you can unload and reload the Atheros driver and force it not to create any VAPs:


    ```

    wlanconfig ath0 destroy

    ```


    ```

    modprobe -r ath_pci

    ```


    ```

    modprobe ath_pci autocreate=none

    ```


    Assuming in this case that you have a compatible card ready to go into monitor
    mode, the Airmong-ng program makes it easy to set your card. The program identifies
    the driver and knows what steps to take to enable monitor mode. In the case of
    Madwifi drivers, specify the parent device, wifi0, as the interface:


    ```

    airmon-ng start wifi0

    ```'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# FIGURE 1.2


    Airmong-ng''s Output for a Madwifi-ng Card


    ![](img/fa764b70be0fdcb44b75286d4f8589e2_26_0.png)


    Airmong-ng will report the name of the interface in monitor mode and look something
    like Figure 1.2.


    Once the card is in monitor mode, you can collect packets. The program in the
    suite to do this is called airodump-ng. Many options can be set from the command
    line and are specified before the interface name at the end:


    ```

    ```

    airodump-ng --channel 3 --write foo ath1

    ```

    ```


    This command specifies Airodump to listen on Channel 3 (as opposed to hopping
    through all channels), write out the captured data to a file with the prefix "foo,"
    and use interface ath1, which is our monitor mode interface from Airmong-ng. If
    you are interested in the other options for Airodump or any program in the suite,
    just run it with the -help switch.


    Once it is running, you should see networks begin to populate the columns and
    packet counts start to rise. Figure 1.3 shows a single network being captured;
    however, if you are in a noisy area, more networks may show up.


    If everything is running fine, you should see one or more networks listed in the
    display. Hopefully, your target is one of them. The upper portion lists currently
    active APs and some basic information about them. The lower portion lists client
    devices and their associations.


    Depending on the amount of traffic already on the network, you may start seeing
    the data column number for your target that start to rise. If it is rising fast
    enough to acquire 50,000 packets in what you deem a reasonable amount of time,
    then it''s just a matter of time to wait. If there is no traffic, or no clients,
    or you are just impatient, you can try an ARP injection attack to force more data
    to be generated.


    Aireplay-ng handles most of the active attacks for WEP. It should be run at the
    same time as your capture program, such as Airodump-ng. It has many command-line'
  merge: -1
  img_proc: true
- pgno: 27
  md: '![](img/fa764b70be0fdcb44b75286d4f8589e2_27_0.png)


    # FIGURE 1.3


    Airodump-ng''s Output Capturing Data from Our Target Network Named WEP


    switches, but for the purposes of this guide, we will focus on the ARP replay
    as it is the most effective and widespread:


    ```

    aireplay-ng -3 -b 00:16:B6:1C:91:91 ath1

    ```


    The above command is specifying Aireplay-ng should use attack number 3, which
    is the ARP replay attack, the BSSID of the target, and the interface to listen
    and inject on. Since we didn''t specify a "-h" or host option, it defaults to
    using the local interface MAC address. For better results, if you can, specify
    the MAC for an already associated client. Be careful as some cards are incapable
    of injection in monitor mode and may need special drivers or preparation.


    > NOTE

    > For whatever reason, the Aircrack-ng developers decided that for some attacks
    "-a" would be the switch to specify the BSSID of the target, for others it''s
    "-b." If you use the wrong one, Aireplay-ng is smart enough to alert you as to
    which one to use instead.


    Aireplay-ng will listen on the interface for an ARP packet. ARP packets have a
    specific size (68 or 86 bytes) even when encrypted and stand out. Once it captures
    one, it will retransmit it back to the AP causing a reply with another ARP encrypted
    with a different IV and Aireplay-ng will begin counting up ARP packets as demonstrated
    in Figure 1.4. This will start a flood of data to come in to run the crack on.


    Should you be attacking an AP without any clients and using your local MAC for
    injection doesn''t seem to be working, you can sometimes force an ARP packet to
    be generated by faking an association to the AP from your attacking client.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '![](img/fa764b70be0fdcb44b75286d4f8589e2_28_0.png)


    # FIGURE 1.4


    Aireplay-ng''s Output for a Successful ARP Injection


    ![](img/fa764b70be0fdcb44b75286d4f8589e2_28_1.png)


    # FIGURE 1.5


    Aireplay with a Successful Association


    While the ARP attack continues to run, run Aireplay in another terminal but this
    time using attack number 1, the fake association:


    ```

    aireplay-ng -1 3 -a 00:16:B6:1C:91:91 ath1

    ```


    This command specifies attack number 1 (association) with a delay of 3 s between
    attempts against the specified BSSID using interface ath1 to listen and inject
    on. Since no "-h" option was set, the local MAC is used. These will then try and
    associate to the AP and hopefully an ARP packet will be generated to bootstrap
    ARP injection. A successful association looks something like Figure 1.5, including
    the smiley faces.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '![](img/fa764b70be0fdcb44b75286d4f8589e2_29_0.png)


    FIGURE 1.6

    Aircrack-ng Found the Key


    Once Aireplay-ng is injecting, the Airodump data column total for the target should
    start to rise at a great speed. An optimal setup will only take a minute or two
    to approach the necessary starting point of 10 to 20,000 packets. You can collect
    more, but why not start early?


    Airodump continually writes to the specified storage file, which in the guide
    is “foo-01.cap.”


    Aircrack-ng is run against this file and the packets for various networks are
    parsed:


    ```

    aircrack-ng foo-01.cap

    ```


    If there are packets for more than one network, you will be prompted to specify
    which one by selecting it from a list. Once that is done, the attack runs. First
    it tries the PTW attack, then the earlier analysis of the data in an effort to
    retrieve the key.


    A successful attack should yield results like Figure 1.6 but with a different
    key.


    # IT GETS BETTER AND WORSE


    Over time, people have slowly started to get the message that they need to secure
    their networks. Security experts and the wardriving community took every opportunity
    to warn people of the dangers of operating open networks.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '> **NOTE**

    > Interestingly, wigle.net, in their graph of crypto usage over time from submitted
    networks, shows a marked "jump" of almost 1 percent centered on the period of
    April 2007 when TJX announced they had a problem and the subsequent media attention
    to the issue of wireless security. Figure 1.7 shows the graph of encryption usage
    from wigle.net over time.


    ![](img/fa764b70be0fdcb44b75286d4f8589e2_30_0.png)


    # FIGURE 1.7

    Wigle.net Graph of Encryption Usage


    Note the bump in the curve starting just before the marker for May 2007. It is
    pretty telling that people started paying more attention right after the TJX breach
    announcement.


    Since the disclosure of the TJX penetration, corporate and individual attention
    to wireless security has increased for the better. Companies and individuals not
    wanting to be the next poster child for wireless security took efforts to upgrade
    from WEP to WPA and WPA2 security. While this is a definite step up in security,
    it is not without its issues.


    Cryptographically speaking, WPA and WPA2 solve a lot of the issues of WEP. The
    IV counter is now larger (48 bits) and various countermeasures are in place to
    prevent the problems that plagued WEP. Further improvements include replacing
    the simple cyclic redundancy check (CRC) on each packet with the message integrity
    check (MIC), or Michael checksum and packet sequence enforcement, to prevent ARP
    replays and similar attacks.


    There is one problem that designers have so far been unable to engineer away.
    A problem that has been plaguing computer security since the beginning: human
    stupidity. People are just not very good at choosing hard-to-crack passphrases.'
  merge: -1
  img_proc: true
- pgno: 31
  md: "# WPA AND WPA2 IN A NUTSHELL\n\nWPA version 1 was an interim solution created\
    \ by the IEEE when it was clear WEP was on a path to ruin. Fearing mass obsolescence\
    \ and the backlash from consumers feeling they were being forced to buy new equipment\
    \ only a short time after investing in it to achieve security, WPA was designed\
    \ to operate on the limited hardware resources of APs designed for WEP. To do\
    \ this, WPA still uses RC4 as its stream cipher which limits the load on the equipment.\
    \ WPA2 (also known as 802.11i) is the final and more secure version of WPA. WPA2\
    \ uses Advanced Encryption Standard (AES) as its stream cipher, which is vastly\
    \ more secure but requires resources only found on the newer generations of APs\
    \ and is not available on older equipment.\n\n> **NOTE**\n> \n> Both versions\
    \ of WPA can operate in two modes. These are Pre-Shared Key (PSK) and Enterprise\
    \ or RADIUS mode. There are different settings within each mode, but these are\
    \ the major functions.\n> \n> In PSK mode, the AP itself handles the authentication\
    \ and contains a secret key that both the client STA and AP use to set up a secure\
    \ connection. In Enterprise mode, a connecting client has all traffic blocked\
    \ except to the authentication server. There the AP can pass further credentials\
    \ such as usernames and passwords or certificates, which can be integrated with\
    \ a larger authentication scheme such as Active Directory.\n> \n> For the most\
    \ part, PSK is the most common solution for home and small businesses. Enterprise\
    \ mode requires further infrastructure and more complexity but has the added benefit\
    \ of central control and integration with directory services for things like single\
    \ sign on.\n\nIn the process, the designers of WPA and WPA2 set about to solve\
    \ other problems besides security. One of the problems with WEP was the keys themselves,\
    \ though, not from a security standpoint but from a standpoint of users getting\
    \ annoyed and turning off security.\n\nWEP keys are usually 26-digit hexadecimal\
    \ numbers (shorter if you are using less than 128 bits) that had to be typed into\
    \ the client manager software to connect. These keys were long, complicated, and\
    \ easy to mistype causing no end of headaches trying to get a system connected.\
    \ In addition, they were very difficult to remember and thus ended up almost always\
    \ being written on a sticky note somewhere near the AP or the users' desk. To\
    \ make things worse, most operating systems (OSs) made you type it manually twice,\
    \ while masking what you typed behind stars or black circles.\n\nTo make things\
    \ worse, there was no standard definition as to how keys should be entered. Some\
    \ equipment defaulted to using the key in hexadecimal; others used it in ASCII\
    \ format. It was not always apparent which format was needed. This caused no end\
    \ of problems, particularly for people using different manufacturer's APs and\
    \ client adapters. Often someone would buy an Apple Airport, which used an ASCII\
    \ key, and would attempt to use their non-Apple computer with its built in wireless\
    \ to connect. The other OS would request the key in hexadecimal and the AP would"
  merge: -1
  img_proc: true
- pgno: 32
  md: 'expect an ASCII key causing the connection to fail. More often, this leads
    many users to set the AP to the last known working conditions: no security.


    To solve this annoyance, the IEEE included detailed guidance in the specifications
    on generating the hexadecimal key from an easier to remember passphrase. Both
    WPA version 1 and version 2 in PSK mode use 256-bit hexadecimal keys (as opposed
    to WEPs 128-bit maximum) generated with the PBKDF2 algorithm.


    The PBKDF2 algorithm generates a key called the Pairwise Master Key (PMK) that
    is then used to drive a four-way handshake to authenticate client devices to the
    network.


    This algorithm basically works like this:


    PMK = (Passphrase + SSID + SSID Length),* 4096 SHA1 iterations


    The PMK is made up of the user supplied passphrase (from 8 to 63 characters),
    concatenated with the SSID of the network as a salt value and the SSID length.
    This is then run through 4096 iterations of SHA1 and outputs a 256-bit value,
    which is the key used in the handshake.


    The nice part about this system is that all a user has to remember is a simple
    passphrase – the rest is generated for them since the SSID is known and so is
    the length. No more having to remember long and ugly hexadecimal strings. You
    can sit down at any WPA client manager and generate the same hexadecimal key if
    you know the passphrase and SSID.


    Around the time WPA version 1 came out, the security community took note of an
    interesting statement in the specifications:


    > > A passphrase typically has about 2.5 bits of security per character, so the
    passphrase mapping converts an n octet password into a key with about 2.5n + 12
    bits of security. Hence, it provides a relatively low level of security, with
    keys generated from short passwords subject to dictionary attack. Use of the key
    hash is recommended only where it is impractical to make use of a stronger form
    of user authentication. A key generated from a passphrase of less than about 20
    characters is unlikely to deter attacks.


    This statement, from the 802.11i specifications, indicates that any passphrase
    of fewer than 20 characters was considered weak, as anything less was not random
    enough and could be subject to a dictionary attack. This led to Robert Moskowitz
    writing an article for wifinetnews.com that explained that since an attacker knew
    the SSID of the network they were attacking and the SSID length, they had several
    of the parts that are used to make up the key and that the entire security of
    the key rested on good passphrase selection. Not a good prospect from the security
    community view of things.


    The article also pointed out that nothing was secret about how keys were generated
    and that the hashed version of the key is sent between the STA and AP and can
    be easily captured. In theory, an attacker could run a dictionary brute force
    attack where they insert their dictionary word into the PBKDF2 algorithm and run
    it through the 4096 SHA1 iterations. The resulting value is compared to the captured
    hash, and if they match, then the attack knows the plaintext key.'
  merge: -1
  img_proc: true
- pgno: 33
  md: "The limitation is that there are a staggeringly large number of possible passphrases.\
    \ Passphrases can be between 8 and 63 characters long. There are 94 possible characters\
    \ (ASCII characters 32 to 126) that can be used for each character of a passphrase\
    \ – this includes all the upper- and lowercase letters, numbers, and symbols on\
    \ a keyboard, leading to a very large number of possibilities. SHA1 is also very\
    \ CPU intensive and takes a comparatively long time to calculate, so to do an\
    \ exhaustive search would take thousands of years or longer.\n\nWhere the weakness\
    \ enters the picture is the one element of the formula that is not in the math;\
    \ the human operator. Since the key is up to the user to select, they will often\
    \ opt for an easy way to remember passphrase based on dictionary words. This greatly\
    \ reduces the key space needing to be searched by an attacker. If they know to\
    \ limit their search to dictionary words, they can limit the search to a few hundred\
    \ thousand words instead of the trillions of possible combinations. Where the\
    \ real rub occurs is that the attack only requires that the attacker can obtain\
    \ the four-way handshake and they can spend all the time in the world to run through\
    \ world lists offline and away from the target.\n\nThis weakness was first implemented\
    \ by Josh Wright in his tool coWPAtty. Provide a list of dictionary words, the\
    \ SSID of the network you are attacking, and a capture file containing a hashed\
    \ version of the key, and coWPAtty will run through the dictionary and hash all\
    \ the words out and see if they match the capture. If they do, you have the passphrase.\n\
    \nFirst versions of the program were limited to running the attack straight through,\
    \ meaning that the hashes had to be calculated each time it was run. This was\
    \ annoying if you were testing the key on multiple networks with the same SSID.\
    \ The CPU power was being wasted since it was being repeated multiple times.\n\
    \nShortly after the release of coWPAtty version 2, a wireless research group,\
    \ the Church of Wi-Fi, undertook a project to speed up this process.\n\n> NOTE\n\
    > \n> In the world of password hash breaking, there is a concept of a 'rainbow\
    \ table.' This is a situation where instead of attacking each password individually\
    \ each time and starting the process and it's resulting CPU cost each time, you\
    \ simply apply the concept of a time/ space trade-off and calculate the hash for\
    \ every possible character combination and store the results for later lookup.\
    \ In 2005, the Shmoo Group (www.shmoo.com) released their rainbow tables to the\
    \ public that contained every possible password for the LanMan hashes used to\
    \ store older versions of windows login passwords.\n> \n> The time/space trade-off\
    \ is harder to apply to WPA passphrases. Since the SSID and the SSID length are\
    \ seeded into the passphrase hash, this means that the passphrase of \"password\"\
    \ will be hashed differently on a network with the SSID of \"linksys\" then it\
    \ will on a network with the SSID of \"default.\" So in order to generate an exhaustive\
    \ hash list of all passphrases possible for all networks, one also has to do so\
    \ for each SSID possible, which is obviously a lot and would take a huge amount\
    \ of storage, literally thousands of terabytes, if not more."
  merge: -1
  img_proc: true
- pgno: 34
  md: 'The Church of Wi-Fi took a different approach to speed up the process. They
    figured that if you run the attack against an SSID once, why not store the list
    of resulting test hashes to use again later if the same SSID was encountered.
    For example, if you come across the SSID “wireless” and run a dictionary against
    the key, even if you are unsuccessful, save the output, and the next time if you
    encounter that SSID, you don’t have to spend the CPU time redoing the calculations
    for the same dictionary – just look up the previous output.


    This concept was further extended to the idea that if you know the SSID of your
    target (that is, you are doing a penetration test), you can save your time on
    site by spending days, weeks, or months of time generating a hash lookup table
    for that SSID to be used on site. You could set up a few spare machines to work
    24/7 before the scheduled test to give you a time advantage on site. In addition,
    you could save those tables for the next test as well. The result was the addition
    of the genpmk program to coWPAtty to generate hash lookup tables without the need
    for a captured handshake.


    To demonstrate this improvement, the Church of Wi-Fi set about to make a set of
    tables that would give the greatest chance of recovering the key, rather than
    trying to build an exhaustive list of all possible passphrases for all possible
    SSIDs, which would be absolutely prohibitive to store or calculate in a reasonable
    time. Their approach was to apply some psychology to the process to build a targeted
    list. You see, people are predictably lazy and tend to choose easy-to-remember
    passphrases. In addition, people also choose fairly simple SSIDs or just leave
    them at the manufacturers default.


    Taking lists of common and known-used passphrases, along with wigle.net’s list
    of the top 1,000 SSIDs (which accounts for approximately 50 percent of their database
    of tens of millions of networks), they computed tables consisting of approximately
    1.2 million common words and passphrases for each of the top 1,000 SSIDs as a
    proof of concept. These tables can be used if you are attacking or auditing (arguably
    the same thing with different intentions) a network configured with one of the
    top SSIDs – you can quickly do a lookup and compare the pre-hashed tables to your
    captured hash several orders of magnitude faster than doing the CPU calculations
    onsite. Tests on a Pentium 3,700 MHz laptop showed that at the time it could test
    12 keys/s whereas to just do a lookup from a table it could test 18,000 keys/s.


    The Church of Wi-Fi tables are distributed free via bittorrent links on churchofwifi.org
    or by DVD sales from www.renderlab.net/projects/WPA-tables for the bandwidth impaired.


    Furthering the idea behind this project, the folks at offensive-security.com (the
    group behind the Backtrack bootable Linux security distro) generated 500 Gb of
    tables using a similar methodology. While they eliminated some of the more extraneous
    SSIDs from the Church of Wi-Fi list, they cover all the very common ones. Each
    SSID is 1.9 Gb and uses a 49 million word dictionary. Obviously, this is a bit
    hard to distribute, but they are available via bittorrent at www.offensive-security.com/wpa-tables/'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# HOW TO CRACK WPA PSK AND WPA2 PSK


    Since WPA and WPA2 share the same key generation mechanism, the same attack on
    password selection works on both. When coWPAtty was first altered to add support
    for WPA2, it was only a few lines of code in the parser that needed to be changed;
    the rest of the code was fine as it was.


    The ability to crack a WPA key is based on two things: the quality and size of
    the dictionary used and the amount of time an attacker is willing to invest. If
    the passphrase used is not in the dictionary supplied to coWPAtty, there is no
    chance of recovering the key. However, if you use a huge dictionary or try to
    do an exhaustive search, you''ll be sitting there somewhere on this side of forever
    waiting. Depending on your intentions, on a professional audit it may be easier
    and more feasible to simply ask for the passphrase and ensure it would not be
    in a dictionary likely to be used by an attacker. In the situation of a penetration
    test or an actual attack, manually testing the hashes is the next option.


    Your best expectation is to audit a network and make sure that the password is
    not (or is, depending on your intentions) in any reasonable-size dictionary available
    to an attacker.


    The first step is to capture the four-way handshake of a client authenticating
    to the network. Every client does this and in the process, a hashed version of
    the key is sent through the air. Once we have that, we can attack it.


    How you capture the handshake is up to you. Packet capture tools like Wireshark
    (www.wireshark.org) can be used, but the Aircrack-ng suite''s Airodump-ng provides
    probably the simplest interface. See the WEP cracking tutorial in this chapter
    on setting up Airodump-ng to listen to a target:


    ```

    airodump-ng --channel 6 --bssid 00:16:b6:1c:91:94 --write bar ath1

    ```


    Airodump-ng, in addition to collecting packets for WEP cracking, also can alert
    when a four-way handshake has been captured too. When a valid handshake is captured,
    in the upper right-hand corner of the Airodump screen will appear a "WPA Handshake"
    along with the BSSID of the network it caught, as in Figure 1.8.


    It may be a while before a valid client joins the network, and even then the full
    handshake may not be exchanged or captured. It may be necessary to force the issue
    with a deauthentication attack.


    A deauthentication attack (deauth) is where an attacker fakes a message from the
    AP to the client asking it to disconnect. Normally, this is used to gracefully
    close sessions if the AP was going down or rebooting. Since these sorts of administrative
    messages are unencrypted and unauthenticated, anyone can inject them and the client
    will obey and disconnect. A few seconds later the client sees that the network
    is back (it never left) and then reconnects, thus disclosing the four-way handshake.


    Aireplay-ng has an option to perform this attack, along with other tools, but
    aireplay has the added advantage of requiring a specific target and avoids collateral
    damage from unintended disconnects of other networks:


    ```

    aireplay-ng -0 5 -a 00:16:b6:1c:91:94 -c 00:0e:35:76:53:47 ath1

    ```'
  merge: -1
  img_proc: true
- pgno: 36
