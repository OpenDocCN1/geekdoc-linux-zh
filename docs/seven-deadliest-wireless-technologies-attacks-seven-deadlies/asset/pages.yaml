- pgno: 37
  md: 'captured passively in a few seconds if you are lucky. The rest of the attack
    can take place offline elsewhere and does not require the target network.


    > TIP

    > Capturing a complete 4-way hash is trickier than it sounds. Differences in client
    managers, AP behaviors, and even being on the edge of range can lead to incomplete
    captures. If you are having trouble in capturing a complete handshake (if coWPAtty
    is reporting so), try adjusting your location relative to the AP and the client
    and try again. All else fails, wait for a client to log in normally as some clients
    behave oddly on reassociation after being deauthenticated.


    CoWPAtty only needs a few pieces of information to begin the attack once the data
    has been collected – in this case, the wpa2psk-linksys.dump capture file:


    ```

    cowpatty -r wpa2psk-linksys.dump -f dict -s linksys

    ```


    In this case the capture file, which is wpa2psk-linksys.dump, the dictionary file,
    dict, and the SSID of the network we are attacking, in this case, linksys. CoWPAtty
    will parse the capture file, and if there is a complete handshake, the crack will
    begin; otherwise, it will report that the handshake is incomplete and you should
    try to reacquire it. If you have a complete handshake, coWPAtty sets about computing
    each word in the dictionary through the PBKDF2 algorithm with the specified SSID
    and comparing the output to the capture. If they match, it reports the successful
    passphrase. If not, it moves on to the next one. Figure 1.10 shows that the PSK
    on this network was dictionary.


    Depending on the CPU you are using and the size of the dictionary, the length
    of time to run through the list will vary. If there is a match, however, coWPAtty


    ![](img/fa764b70be0fdcb44b75286d4f8589e2_37_0.png)


    # FIGURE 1.10


    CoWPAtty Successfully Retrieves the Passphrase'
  merge: -1
  img_proc: true
- pgno: 38
  md: "will report the dos success. In Figure 1.10, the CPU could work through approximately\
    \ 100 passphrases per second and went through the fairly short dictionary (approximately\
    \ 10,000 words) in 37 s. If this is an SSID that you audit regularly, you may\
    \ not want to spend all the CPU time each time you want to run through this same\
    \ list. In that case, you will want to save the output in a lookup table.\n\n\
    > **EPIC FAIL**\n> \n> CoWPAtty expects the dictionary to be a simple list of\
    \ words in UNIX text file format as opposed to DOS formatted. DOS-formatted text\
    \ has a hidden control character at the end of each word, whereas the UNIX format\
    \ does not. If you feed coWPAtty a DOS-formatted list, its parser includes the\
    \ hidden control character as part of the passphrase and is computed as such.\
    \ So the passphrase of \"password\" used in the list will actually be computed\
    \ as \"password.\" and of course, the resulting hash will not match the capture\
    \ for a network using the passphrase \"password.\" The Church of Wi-Fi had this\
    \ happen to them twice in the course of generating their tables, and they had\
    \ to throw out months of work.\n\nThe mathematics behind the lookup table is exactly\
    \ the same as running a \"live\" crack, except instead of comparing to a capture\
    \ file, the hashed version of the word and its plaintext version are written to\
    \ a file. That file can then be looked at later to quickly look for matches. To\
    \ generate your own lookup table, coWPAtty comes up with the program, genpmk:\n\
    \n```\n```\ngenpmk -f dict -s linksys -d linksys.hash\n```\n```\n\nGenpmk takes\
    \ a word list (dict), network SSID (linksys), and outputs the resulting hashes\
    \ to a file (linksys.hash). This process takes just about as long as running coWPAtty\
    \ directly on the capture as the time taken between Figure 1.10 and Figure 1.11;\
    \ however, this file can then be fed back into coWPAtty for much faster lookups\
    \ on subsequent tests.\n\nThe most likely times you will want to compute a hash\
    \ file is if you know the target ahead of time and want to spend off hours (night\
    \ time or other idle CPU time) to give yourself a time advantage onsite (spend\
    \ the time now to save it onsite) or if you repeat the same operations over and\
    \ over and want to save the time by investing it only once and saving the output\
    \ for later use. If it takes you an hour to compute through a word list, rather\
    \ than spend that hour each visit, if you do it once and save the output, you\
    \ can effectively save an hour each time. Once you have a hash file generated,\
    \ you can enter it in place of, or in addition to, a dictionary. CoWPAtty will\
    \ quickly look through the hash file for matches. If none is found, it will report\
    \ the failure, or if you specified a word list, it will begin the CPU intensive\
    \ crack with that list. If you look at the speed of the crack between Figure 1.10\
    \ and Figure 1.12, you will see the marked improvement in speed:\n\n```\n```\n\
    cowpatty -r wpa2psk-linksys.dump -d linksys.hash -s linksys\n```\n```"
  merge: -1
  img_proc: true
- pgno: 39
  md: '![](img/fa764b70be0fdcb44b75286d4f8589e2_39_0.png)


    # FIGURE 1.11


    Genpmk Computing a Hash File


    ![](img/fa764b70be0fdcb44b75286d4f8589e2_39_1.png)


    # FIGURE 1.12


    CoWPAtty Using a Precomputed Hash File Instead of a Dictionary


    In Figure 1.12, doing a live crack onsite would have been done in about 37 s.
    Using a hash file, which could be computed ahead of time in off hours or down
    time or from one of the publicly available sets, the lookups were done in 0.06
    s. Quite the time savings, if you end up reusing the hash file several times.


    Recent developments have helped improve the process of doing the computationally
    heavy portions of WPA cracking and hash table generation. The usage of'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'Field Programmable Gate Arrays (FPGAs), which are programmable processors,
    has shown a much faster SHA1 implementation than on generic CPUs since the algorithm
    is built into the hardware itself. This means that the FPGA does only one thing
    and it does very fast. Additionally, recent advances in video card Graphics Processing
    Units (GPUs) from companies like Nvidia and ATI have allowed non-video processes
    to be run on their chips. These chips are much better suited for the type of computations
    being performed. A sample implementation is available at http://code.google.com/p/pyrit/


    # SUMMARY


    While WPA-PSK (and WPA2-PSK) is an improvement over WEP, by creating a simpler
    method for users to remember and enter passphrases, the IEEE introduced a human
    flaw into the equation. WPA-PSK has a 256-bit key, much more substantial than
    WEPs 128-bit offering, and the randomness of that key is based on a user''s ability
    to choose a random passphrase and a unique SSID, which in general, people are
    not very good at.


    In short, it''s all down to choosing a good passphrase. There have been no reports
    of WPA-PSK passphrases being cracked with such an attack; however, there''s really
    no way to detect it being done. Anecdotally from professional pen testers though,
    usage of the Church of Wi-Fi tables has enjoyed about a 50 percent success rate
    if the SSID is in the list, meaning that an attacker has a decent chance of being
    able to walk into a situation and being able to crack a password. It just goes
    to show that if you use WPA-PSK, you had better follow the IEEE''s advice from
    the standard and use a 20-character passphrase that is not based on any dictionary
    words, and is made up of uppercase and lowercase letters, numbers, and a few symbols
    for good measure.


    Other measures to reduce your risk of a brute force attack on WPA:


    +   - Periodically changing passphrases (maintaining length and randomness)

    +   - Periodically changing the SSID, thus changing the salt value

    +   - If sensitive or financial data is being sent, consider the installation
    and use of a Wireless Intrusion Detection System (WIDS)

    +   - If at all possible, migrate to a WPA-Enterprise solution

    +   - Educate your users on the need for complex passphrases


    # Endnotes


    1. www.netstumbler.org/t22/faq-legalities-concerning-wardriving-netstumbling-nethugging-6430/#post48649;
    [retrieved 01.12.09].

    2. http://standards.ieee.org/getieee802/download/802.11i-2004.pdf; [retrieved
    01.12.09].'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Wireless – Client Attacks


    # INFORMATION IN THIS CHAPTER


    +   - Public Hotspot Dangers

    +   - How Hotspots Work

    +   - Attacking Public Hotspots

    +   - The Crux of the Problem

    +   - Solutions

    +   - Injection Attacks


    Wireless network security is getting better. When wardriving first hit in 2001,
    statistics showed only about 30% of access points were secured with some sort
    of encryption. Today that number is close to 70%, indicating that people are slowly
    getting better at securing their access points. Since then, wireless client devices
    have become a tempting target for attackers. Workers become increasingly mobile
    and depend on wireless network access at the office and on the road. The availability
    of public hotspots has the general public becoming more and more accustomed to
    Internet access being available at every coffee shop, airport, and hotel they
    might travel to.


    Client security is often overlooked as users often think of it when connecting
    to the "home" network. In reality, clients are sometimes more of a tempting target
    since they can be attacked away from watchful eyes of information technology (IT)
    departments and often can contain just as much valuable information or be useful
    entry points into the network.


    In early 2006, Simple Nomad of the Nomad Mobile Research Center (NMRC) presented
    a talk at Shmoocon in Washington, D.C., outlining his experiences in a talk entitled
    "Hacking the Friendly Skies." In his talk, he detailed the many ways he was able
    to access the private documents and manipulate the information on laptops in use
    at 30,000 ft on cross-country flights. His discoveries and techniques showed that
    he was able to find at least one vulnerable target on every flight he tested on,
    often without any indication or interaction with the user. His actions showed
    that every executive in the first class with a laptop is a potential target, even
    in more unusual'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'environments, far away from the watchful eye of IT administrators (www.nmrc.org/pub/present/shmoocon-2006-sn.ppt).


    Vacationers at hotels are often a tempting target. There is no guarantee that
    the hotel-named hotspot you are connecting to is actually the hotel’s network.
    Take the case of the Defcon 16 hacker conference at the Riviera Hotel and Casino
    in Las Vegas in 2008. Before the convention, there were 12 access points detectable
    from the pool with the hotel’s network Service Set Identifier (SSID). After the
    first day of the three-day conference, there were 130 access points available.
    Some odds at casinos are more in your favor than others, and a hapless traveler
    connecting to a legitimate access point is not one of them.


    # PUBLIC HOTSPOT DANGERS


    Just about everyone is familiar with the idea of public Wi-Fi hotspots. Every
    coffee shop seems to have one, as well as restaurants, bars, grocery stores, airports,
    and hotels. Hotels, in particular, are nearly required to have wireless Internet
    access to stay competitive and, with today’s seemingly endless flight delays,
    airport wireless is probably the only thing keeping business travelers from staging
    a revolt.


    What most people don’t seem to think about are the inherent dangers of bringing
    a computer onto a random network that you have no reason or way to verify or trust.
    Would you haul a desktop computer around and connect it to any random network
    cable that you found lying around? Of course not (for reasons other than the obvious
    hauling problems), yet people connect their mobile wireless devices to seemingly
    random networks all the time without thinking about who else might be on the same
    network.


    From an attacker’s perspective, the neighborhood coffee shop where all the customers
    hang out on sofas with laptops is a prime ground for targeted fraud and abuse
    of wireless clients. Hotels hosting conferences are also a very tempting target.


    # HOW HOTSPOTS WORK


    There is no set standard for public hotspots. They are designed around a business
    model rather than a technical model. Their main purpose is to draw in and get
    customers to stay long enough to order a second (or third) cup of coffee.


    In the early days of wireless, it was as simple as the owner running a digital
    subscriber line (DSL) or other high-speed line into the business and plugging
    in an open access point. This worked great: customers could just connect with
    no issues. Shortly thereafter the inevitable happens and all the neighboring homes
    and businesses notice the new open network and proceed to use it freely without
    purchasing anything from the owner. After a short time, legitimate users complain
    about the slow speed, and the owner figures out that there are a few dozen extra
    users on the system than in the business. They then proceed to enable encryption
    and put up a sign for customers to ask for the password to use the wireless. This
    works for a while until the neighbors figure out that they can go in and buy the
    cheapest thing on the menu and'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'get the network key and proceed to use it as before. The owner again figures
    out why the system has suddenly slowed and starts a regime of changing the key
    each day. After a while, this gets cumbersome and more trouble than it''s worth,
    which leads the owner to finally disable it for everyone.


    This is a classic example of the tragedy of the commons, a game theory^A concept
    where one person taking more than his or her share of a common resource is not
    an issue, except that everyone thinks the same way and the group ends up over-consuming
    that resource, thus destroying it for everyone. The common example is a group
    of shepherders leading the herd to grazing on public land. If one adds an extra
    few sheep, the additional grazing won''t be that conspicuous. The problem arises
    from everyone thinking the same way and expanding their flocks. Soon overgrazing
    means none of their larger flocks get enough food and therefore the shepherders
    won''t profit.


    The eventual solution to this in the wireless world was the captive portal and
    the pay-for-play model. This system is what you will find most often now and has
    been turned into a fairly sizable industry of providing turnkey solutions to our
    hapless coffee shop owner and his ilk.


    Captive portals typically operate as open networks with one difference. Once connected
    to these systems, they block all traffic and redirect all Web requests to a local
    page. That page is usually an authentication page that explains how to access
    the Internet at large. Some of these only require acceptance of a term of service
    to give owners some legal recourse against abusers. Others go a step further and
    require payment for a set amount of timed access. Once payment is made, that particular
    computer is allowed to communicate with the outside world for the prescribed period
    of time.


    This system grew into companies operating large networks of access points around
    the world sharing a common authentication and payment scheme where you can purchase
    a set period of time, say 30 days, and use any of their access points around the
    world. This is typically the system you would have at an airport or hotel, since
    on a long journey you might need Internet access at many different points during
    your travels.


    The growth in use of captive portal and pay-for-play configurations is when attackers
    first started to take notice of these systems (as a target for fraud). Since most
    payments were made via credit card, the opportunity was present to capture those
    card numbers and other interesting information.


    # ATTACKING PUBLIC HOTSPOTS


    Most public hotspots, be they free or for pay, generally are not encrypted. A
    chicken and egg situation exists in how to give the customer an encryption key
    from an automated system without also providing it to noncustomers. Employees
    should be'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'making coffee and not doing technical support. If the network is encrypted,
    then users can’t get a key, and if they can’t get a key, they can’t connect. As
    a result, most common public hotspots are unencrypted.


    > **NOTE**

    > While they are unencrypted, most often the login page or payment page is secure
    sockets layer (SSL) encrypted. This means that under normal operation, credit
    card numbers are not being sent in the clear. If the pages were not encrypted,
    the attacker’s job would be instantly simple. An attacker would just have to use
    a wireless sniffer utility like Kismet (www.kismetwireless.net) or Wireshark (www.wireshark.org)
    to capture the traffic and then set about looking through the packet dumps for
    those page requests and the resulting form submission.


    As an attacker, having access points unencrypted gives an extreme advantage. The
    user has no way of actually verifying that the access point is what it says it
    is since there’s no shared secret. A network’s SSID is merely for organizational
    purposes, it is not an authentication method. Just because you are in a Starbucks
    and your laptop shows a network in the area named Starbucks does not mean it is
    owned nor has anything to do with that Starbucks (though it might be from the
    one across the street or further down the block). Many people assume that the
    SSID is somehow an indication of authenticity. It is far from that. As a simple
    test, set your home access point to “Starbucks” or “t-mobile” or any other pay-for-play
    hotspot name. There is nothing stopping you.


    Many wireless cards on the market are capable of operating in “master” mode, which
    allows them to operate as an access point. This fact, along with people’s trusting
    nature, allowed early attackers to impersonate access points easily. Originally,
    it would take a fair bit of work to set up but later advances would make it simpler
    to execute this type of attack. Most laptops were not designed or intended to
    be used as access points; however, the capability existed since the same card
    that powers the Wi-Fi in your laptop can also run an access point.


    The attack would work like this. An attacker would set up his or her laptop or
    wireless device in master mode and become an access point. The SSID would be set
    to either impersonate an existing access point or appear to be a legitimate access
    point where there was none. In the case of impersonation of an existing access
    point, clients will generally connect to the strongest signal if several of the
    same SSID is seen, so an attacker just has to be closer or have a more powerful
    signal than the legitimate access point. (An alternate method would also include
    a denial of service attack on the real Access Point [AP].) From there, the attacker
    can set up Dynamic Host Configuration Protocol (DHCP), domain name system (DNS),
    and a Web server to emulate the login page of the legitimate captive portal and
    present that to users as if it were the legitimate access point. The attacker
    has control of all network services needed to “surf” and is able to harvest usernames,
    passwords, and credit card numbers. If the'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'attacker wanted to further cloak his or her existence, the addition of a second
    wireless card connected to the legitimate access point could pass the victims’
    information and other traffic to its intended destination, further hiding the
    man in the middle (MitM) (that is, the victim is able to access the Internet and
    receives no indication that an attacker is “listening in”). This type of attack
    opens up other opportunities for data harvesting and abuse, discussed later in
    this book.


    In 2003, to bring some attention to this, the Shmoo group released “Airsnarf”
    (http://airsnarf.shmoo.com), a series of scripts and a tutorial on how to set
    up a system to achieve the above scenario and harvest usernames and passwords
    from a fake captive portal. This version of the attack was somewhat cumbersome
    and hard to pull off surreptitiously. However, the idea was there. The down side
    was that the software could only impersonate one access point at a time and the
    attacker had to wait for clients to connect. There could be times where no one
    was using the network for days and the effort was wasted. There had to be better
    (or worse, depending on which side you were on) methods to get clients to connect
    to the fake network.


    Around the same time as Airsnarf, another program, “Hotspotter” was released that
    partially automated some of the process of luring clients.


    Hotspotter was written in response to an interesting behavior of Windows XP (preservice
    pack 1) where wireless clients could be coaxed from a secure network to an insecure
    network by an attacker simply setting up a network with the same SSID that was
    unencrypted and a stronger signal than the secure network, and then sending a
