  img_proc: true
- pgno: 98
  md: '# Headsets


    Many cordless headsets in offices today are digital and often not as vulnerable
    as their analog predecessors. That being said, there are still a great many devices
    in use due to the adage “if it ain’t broke, don’t fix it.” These legacy devices
    can be used for years after others have been replaced.


    > NOTE

    > A cordless telephone can be thought of as a headset as well, albeit much more
    bulky, and much of what is discussed in regards to headsets can apply to them
    as well.


    These devices (and the most likely to be vulnerable) will typically operate on
    the 46 to 49 MHz range or the 900 to 948 MHz range. Others operate on 1.2 GHz
    and higher frequencies but are often digital in nature and not subject to the
    same vulnerabilities.


    Eavesdropping on these devices is as simple as obtaining a wireless scanner capable
    of receiving these frequencies and tuning in. Many headsets on those frequencies
    use simple frequency modulation, easily handled by most scanners. From there,
    you can simply listen to what is being spoken at that time.


    Depending on the system, one frequency is used for base station to headset audio,
    and another is used for headset to base station audio. This means that you can
    only receive one half of the conversation. If you are only picking up one side
    of a conversation, try to identify the other frequency in use (usually only a
    few megahertz away).


    Being able to eavesdrop on telephone conversations from the parking lot is a rather
    tantalizing prospect for an attacker. Taking a suitable scanner into the business
    centers of any major city will yield some sort of interesting conversation – conversations
    about upcoming financial filings or business deals, to tech support calls to reset
    passwords on user accounts. There is no limit to the kind of information that
    may be gleaned.


    # WIRELESS MICROPHONES


    While related to wireless headsets for telephones, wireless microphones tend to
    be different enough to warrant separate discussion.


    If you’ve ever been to a conference or presentation, you have probably seen these
    wireless microphones. Usually pinned or clipped to a lapel, there is a cord snaking
    to a transmitter in the pocket or clipped to a belt that sends the speaker’s voice
    to the camera or to the room speakers so everyone can hear clearly. Hardly a presentation
    made to a reasonably sized room occurs without the use of a microphone like this.
    As well, stage productions will often use similar (though higher end) equipment
    to amplify the voices of the performers on stage so the audience can hear clearly.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'These devices are a rich target for eavesdropping and disruption as they are
    most often unencrypted, and while the room may be closed to the attacker, the
    radio signals do not respect those same boundaries. Imagine a presentation by
    the CEO of a large company to the assembled stockholders where he has to inform
    them that their latest widget does not only work as promised but also has the
    side effect of turning customer''s hair blue. The CEO knows that he must disclose
    this to the stockholders but is trying to keep it out of the press. He begins
    his presentation by clipping on a wireless microphone so everyone can hear him
    clearly, now including the nosy reporter across the street with a radio scanner.
    Usage of a scanner during closed door presentations can yield very interesting
    results during penetration tests and have proven to be very effective more often
    than not.


    These microphones typically require higher quality than telephone headset units
    and operate on different frequencies and use much wider channels (200 KHz usually)
    so that voices are represented clearly and accurately. Most modern systems operate
    in the Ultra High Frequency (UHF) band, but due to different licensing and allocation
    for those frequencies, the actual range varies depending on what country the device
    is configured for. Typically though, you can find them between 470 and 854 MHz
    (698 to 854 MHz in the United States). If you know the manufacturer of the equipment,
    it is usually fairly easy to search online for the frequencies that the equipment
    uses.


    # EPIC FAIL


    The future that is often predicted by science fiction is one where our lives are
    made easier by technology. Among those inventions often sought by business users
    are voice recognition and voice dictation.


    While voice dictation products have gotten to the point of being fairly accurate,
    the quality of the output is directly related to the quality of the input. The
    common problem shared by all voice dictation software is how to get the user''s
    voice clearly into the program so that it can work its magic. A poor quality microphone
    introduces too much noise and as such, the number of errors increases. Often this
    is not a huge issue as for most people they can go back and edit later. Other
    users do not have the time and require accurate dictation the first time.


    A common solution for these users is to avoid the consumer-level microphones and
    step up to high-end stage equipment. This usually has sufficient quality to reduce
    dictation errors. The epic fail is when those users are in fields where they are
    dictating private, confidential, or secret information. Every word they speak
    to their computer can be received by an outside party (who could even then pipe
    it to their own voice dictation software). Sometimes, these users will only disable
    the dictation software when not in use and continue to wear the headset and leave
    it on throughout the day. The implications of this are staggering as the contents
    of every phone call and conversation around the office are now being broadcast
    outside the walls of the building. Once this situation is noticed, the cost of
    the microphone is now wasted as there is no real way to secure those communications
    after that point and continue using the headset.


    When using a wireless microphone, you must consider the content of the audio being
    sent and what its implications are. Treat the microphone as a stranger in the
    room and ask yourself, if you wouldn''t talk about it in front of a stranger,
    why do you have a microphone broadcasting it to anyone in range?'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# VIDEO DEVICES


    Video surveillance is ubiquitous today. Most major cities have hundreds of cameras
    around watching everything from traffic flows to back alley trash cans. Whatever
    the reason for installing the camera, most cameras have the purpose of allowing
    someone to monitor an area remotely. Sometimes, these cameras need to be installed
    temporarily or in places where cabling is not easy or practical to install. In
    these cases, wireless video cameras are popping up to fill the void. Many homeowners
    use these wireless cameras to monitor their yards and surrounding property, as
    well as temporary applications like construction sites. A hobby has even popped
    up to locate and catalog the locations of these cameras; much like wardriving,
    warspying emerged to attempt to better understand this new technology and how
    it was being used.


    These wireless video units typically consist of a remote camera, either battery
    powered or AC powered, and a base station to receive the signals. Basic units
    are usually just a transmitter and receiver pair, whereas higher end units can
    have multiple cameras on a single receiver.


    Video, due to its higher bandwidth requirements (than that of plain audio), typically
    needs higher frequencies to operate. While some early units operate in the 900
    MHz band, these can suffer interference from cordless phones, wireless headsets,
    and many other devices and are often the cheapest available. More common are 2.4
    GHz units, though these suffer from interference from Wi-Fi networks and other
    devices in the increasingly crowded unlicensed 2.4 GHz range. Often, they take
    up about half of the available Wi-Fi channels and cause more problems for Wi-Fi
    than Wi-Fi does for video. Newer units operate at 5.8 GHz, which is also populated
    with interfering devices like newer cordless phones, but more available spectrum
    means the interference is not nearly as much as it is in 2.4 GHz.


    In order to pick up such broadcasts, once again a compatible receiver is needed.
    This can be a similar base station as the one in use by the target hooked to a
    video monitor. Some scanners have a video display and are capable of viewing video
    from these devices (handy on a blind assessment). A decent scanner will be able
    to scan through the common channels used by these analog video systems and display
    them. Others will automatically detect the video signal during a sweep and display
    it for you. Between radio direction finding and simple deduction based on the
    image from the camera, one can often determine where the camera is and what its
    coverage field is.


    For attackers, these cameras are incredibly tempting targets as part of any information
    gathering operation. It allows them to literally spy on things going on in its
    field of view (guard movements, occupancy, even door lock combinations as they
    are entered!). Much of the common equipment on the market just broadcasts its
    signal, and no authentication is required to view it.


    Much of this equipment is fairly cheap and marketed as "spy gear" in stores and
    online. While there are some legitimate uses ("nanny cams," employee monitoring,
    and so on), the low cost and the ease of use means that the capability to perform
    surveillance by amateurs is a very real and a danger to almost anyone. As a result,
    performing periodic sweeps for these types of devices with a radio'
  merge: -1
  img_proc: true
- pgno: 101
  md: "scanner can ensure that no one has quietly installed one in your home or business.\
    \ Professionally this is known as Technical Surveillance Counter Measures (TSCM),\
    \ which is basically your classic spy bug sweep. Professional TSCM sweeps are\
    \ very thorough and complete and depending on the type of organization, very necessary.\
    \ Performing one on your own is cheaper though less effective, but good for that\
    \ sound piece of mind at the very least, or vastly undervalued if you do discover\
    \ something at the most.\n\n> NOTE\n> \n> The reverse situation is true as well\
    \ when attackers use audio or video equipment that is unencrypted that can work\
    \ against their efforts and make them easier to detect and catch.\n> \n> In August\
    \ 2009, a news report from Oshawa Ontario, Canada, detailed how a 50-year-old\
    \ man who was spying on his stepdaughter with wireless \"spy cams\" was caught\
    \ when a contractor next door who was using similar equipment (for a backup camera\
    \ on a large truck) accidentally intercepted the video signal and determined the\
    \ source and called the authorities.\n> \n> Had more professional, encrypted,\
    \ or digital equipment been used, it is unlikely he would have been caught accidentally.\n\
    \n# DEFENSE\n\nThe simplest defense against analog wireless vulnerabilities is\
    \ simply not using analog wireless devices. With a little searching, most manufacturers’\
    \ products can be easily determined to be analog or digital. Most often the devices\
    \ with the greatest potential for damage can be the smallest. An employee suffering\
    \ neck pains from holding up a phone handset all day with his or her shoulder\
    \ to use both hands to type will often take it upon himself or herself to go to\
    \ the local office supply store and pick up a cordless headset to make his or\
    \ her life easier, usually without the knowledge or approval of anyone else in\
    \ the office. Going from one end of the office to the other and reviewing every\
    \ wireless device found, while time consuming, can ferret out these devices. At\
    \ the same time, educate employees about the risks they may introduce and work\
    \ with staff to find more secure alternatives.\n\nMost digital wireless headsets\
    \ sold today are Bluetooth based (which is encrypted) or even newer units are\
    \ capable of connecting to and interacting with Digital Enhanced Cordless Telecommunications\
    \ (DECT) base stations directly. These devices also offer much higher quality\
    \ audio than older analog units and are a good option for comfort and ergonomics.\n\
    \nWireless microphones are a bit of a trickier issue to secure. Much of the problem\
    \ is that in most people’s minds, it’s not necessary to secure them as the audience\
    \ is meant to hear what is being said. However, it should be noted that sometimes"
