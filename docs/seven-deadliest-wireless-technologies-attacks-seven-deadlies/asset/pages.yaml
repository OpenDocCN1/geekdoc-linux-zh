- pgno: 119
  md: '# Cell Phones, Personal Digital Assistants, and Other Hybrid Devices


    # INFORMATION IN THIS CHAPTER


    +   - Hybrid Devices

    +   - History

    +   - Anatomy of the Attack

    +   - The Attacks

    +   - Future Attacks

    +   - iPhone Summary


    So many devices on the market today have their roots in the visions of the future
    from the past. Mankind has always looked to the future with wonder and hope. Television
    shows like Star Trek and just about every other science fiction show of the 1950s
    and 1960s showed a future full of gadgets to make our lives easier and have knowledge
    at our fingertips.


    There’s no mistaking that the cell phone’s design was driven by the communicators
    in Star Trek, and that devices like the Amazon Kindle have taken on a role resembling
    that of The Hitchhiker’s Guide to the Galaxy, though without the helpful “Don’t
    Panic” inscription (though one user corrected that omission: http://scannreiser.com/content/getting-kindle-etched).
    One aspect of these devices and the predicted future is the security of these
    devices and the risks that they pose to things people generally hold very dear.
    Things like privacy and integrity of the information retrieved and stored on those
    devices are something rarely discussed on those shows, and only now are these
    challenges becoming apparent as issues we have to deal with – something our past
    vision of the future never prepared us for.


    # HYBRID DEVICES


    Hybrid device is a term that means different things to different people. Here,
    they are best defined as those devices that do more than just what their purpose
    is on the surface. An example is a modern cell phone. In addition to making and
    receiving calls over'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'traditional cellular systems like global system for mobile communications (GSM)
    or code division multiple access (CDMA), they also have a host of other features,
    such as Wi-Fi and Bluetooth connectivity, and the ability to access the Internet
    over cellular data networks, such as Enhanced Data Rates for GSM Evolution (EDGE)
    or 3G.


    These devices pose a new set of problems for administrators and users since they
    are capable of doing far more than what they were primarily purchased for, and
    risks may not be apparent.


    One recent example of this was a rash of attacks against Apple iPhones in late
    2009.^A These attacks targeted phones that had been “jailbroken,” an action taken
    by phone owners to run unsigned programs and content on their phones. Many users
    suddenly found themselves locked out of their phones and their lock background
    changed to a message asking for money to be sent to a PayPal account in exchange
    for tips on how to secure their phone. Later, a worm^B was discovered in Australia
    that propagated through jailbroken phones that RickRolled the phone by changing
    the background to a picture of Rick Astley and changed the ringtone to that of
    “Never Gonna Give You Up,” the song of RickRolling fame (or infamy).


    This fairly harmless prank caught the world’s attention to the risk of hybrid
    devices and made them realize that they are more general-purpose computers than
    single-task devices. The threats need to be viewed in context of general computing
    and not as cell phones or whatever they are being sold as.


    # HISTORY


    People in modern society carry a surprising amount of data with them, even if
    they don’t understand or realize that they do. For many years, it was the leather
    organizer stuffed with notes and business cards and calendars. After that, the
    organizer was supplemented by the cell phone and the ability to always be in contact.
    Once cell phones hit the mass market, they became indispensable. These early phones
    did little more than just one function, to send and receive calls. Even just a
    few years ago, a business traveler was hard pressed to be separated from his or
    her monolithic-use cell phone. After a while, computing advanced and the organizer
    was replaced by a personal digital assistant (PDA). Just a few years ago, the
    Palm Pilot was the ubiquitous device among the business set. The amount of information
    that one could now carry far outstripped the previous capability for any one person
    to carry with them, let along in a pocket. This suddenly started presenting a
    more interesting target for attackers. The amount of information present and the
    often sensitive nature was tempting. These devices, however, had very limited
    communications options, and short of assaulting the target and stealing the Palm
    Pilot, the options for an attacker were limited as to how to obtain information
    off of targeted devices. If you are jumping the target anyway, you may as well
    get the information from them directly.'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'In the early 2000s, the Blackberry took the world by storm as well as other
    devices that combined the functions of a cell phone and a PDA in one device making
    for a more convenient device to carry around. This new generation of devices introduced
    new and interesting communication options not only for the users but also for
    the attackers.


    Today’s communications devices are interesting from an attacker’s perspective.
    Consider a modern Apple iPhone. These popular phones have surprisingly little
    resemblance to the phones of just a few years ago. Previously, phones did one
    thing and one thing only: they made and received calls. They did that very well
    and became indispensable to business people and soccer moms alike. However as
    Apple’s marketing points out, there’s little that the iPhone can’t seem to do.
    These devices are basically portable computers that include making and receiving
    phone calls as one feature rather than as a dominant purpose.


    These devices also exist outside the control of most information technology administration
    functions. Their highly portable nature has them outside the watchful eye of any
    infrastructure setup to protect company data or assets secure inside the workplace.
    Also, these sorts of devices are very popular with nontechnical users who are
    unaware of the risks of using these devices on insecure networks in public places.
    A recent test by Renderlab.net found that, at a large shopping mall, the assembled
    mass of several thousand people had at least 247 devices among them with Wi-Fi
    capability turned on and were attempting to communicate with the Internet. Logins
    and passwords for social networking sites like Twitter and Facebook were plentiful
    and the opportunities to inject data to cause chaos were quite rampant. Walking
    into any busy public with simple tools can reveal hundreds of mobile phones, each
    one potentially vulnerable.


    # ANATOMY OF THE ATTACK


    Late 2009 was an interesting time for Apple and iPhone security in general. The
    iPhone gained more market share, and new models added new and interesting features
    for users to play with. The App Store installed on every phone allows users to
    add software and customize their phones capabilities. New productivity applications,
    food selection, and even applications remembering where you parked are all available.


    A common complaint about the iPhone is that it is a closed system. The iPhone
    is only capable of running software that is purchased and downloaded through the
    App Store, and all of these are subject to review and approval from Apple before
    they are included. Some applications are free while others cost as little as $0.99
    compared to others costing several hundred dollars (though not many do). Apple
    has chosen to restrict what applications can be accessed in terms of the operating
    system (OS) and other core functionalities, such as stored music. The process
    of approval for an application is heavily veiled and mysterious to developers
    who often complain about not knowing why their application was denied.


    Apple’s reasoning behind these restrictions range from copyright and antipiracy
    requirements, to stability and performance reasons. Critics counter that Apple
    is trying to maintain a stranglehold on revenue streams and limiting competition
    to those streams.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# EPIC FAIL


    Apple, Google, and AT&T got into a fairly large mess with one another in July
    of 2009. Google had submitted an application for its Google Voice service, a service
    that allowed users to have a single "Google phone number," which could be routed
    to multiple phones simultaneously as well as central voice mail and text messaging
    from multiple devices. The calls would be routed over the Internet using Voice
    over Internet Protocol (VoIP) instead of normal telecom lines, heavily reducing
    costs to the end user. Obviously, this would be a useful service for anyone with
    multiple phone numbers and locations to worry about, and anyone wanting to save
    money by using VoIP for normally expensive long distance calls. Controversy sprung
    up when it was revealed that Apple had rejected the Google Voice application from
    the store and purged all third-party applications that provided an interface to
    the service. A subsequent Federal Communications Commission investigation made
    the situation all the more strange since replies from each company painted different
    stories. Google claims Apple outright rejected the application; Apple claims it
    was still reviewing the application; and AT&T said it had nothing to do with the
    rejection despite its obvious benefit of not seeing such a service exist, and
    older agreements with Apple not to allow some VoIP functionality. AT&T''s insistence
    that they had no part in the situation was despite the potential of reducing their
    existence to a "dumb pipe" that others route call traffic over, obviously restricting
    their ability to offer value-added services and cutting them out of the revenue
    stream.


    In October 2009, AT&T announced that it would allow VoIP functionality over its
    3G connection. Products like Skype previously worked over the Wi-Fi connection
    but were restricted from working over the 3G link. That appears to have changed
    with this announcement. While no specific announcement was made in regards to
    Google Voice specifically, it does seem to indicate that the potential exists
    for it to be approved.


    The controversy is ongoing and certainly not going to be the last, but points
    to a larger epic fail in that hybrid devices are everything and nothing at the
    same time. To AT&T, the iPhone is a mobile phone. To Apple, it is a sales platform
    for music and applications. To Google, it is a sales platform and a computer platform
    portal to its services. Each company is going to treat it differently, and unfortunately,
    the consumers are caught in the middle of these disputes, and in some cases will
    not be able to benefit from the available technology due to these disputes.


    While the AT&T issue seems to have settled and VoIP is allowed, this same problem
    is due to creep up again with other providers offering the iPhone and customers
    wanting to have similar functionality.


    # Jailbreaking


    Because of this closed nature, since moments after the first iPhones were released,
    users had been seeking ways to bypass the restrictions placed on what software
    could be run and from what sources it could be obtained from. These culminated
    in what became known as jailbreaking. Jailbreaking means to break the digital
    locks Apple has put in place and load applications not approved by Apple. This
    could allow other applications to be loaded (an alternate App Store) or for the
    phone to be "unlocked," which means to remove and restrictions put in place to
    lock the handset to a specific carrier, allowing its use on other networks.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '**WARNING**

    Jailbreaking an iPhone or modifying any manufacturer''s handset beyond methods
    they allow (ringtones, wallpapers, and so on) will most likely void any sort of
    warranty on the device in the eyes of the manufacturer and the carrier, and may
    introduce unforeseen problems.

    The terms of service with the carrier usually spell this out quite clearly and
    may result in termination of service and loss of warranty on the handheld.


    So if you jailbreak your iPhone, and it gets damaged, you are on your own for
    repair/ replacement costs, and considering the nonsubsidized costs of these devices,
    that can be an expensive proposition.


    Initial unlocks required fairly extensive modification (including hardware) to
    perform, but it has been reduced now to a simple point-and-click interface. In
    the end, these applications load an alternate App Store application (in addition
    to the Apple offering) that bootstraps the ability to load further, nonapproved
    software. The most popular of these packages is the PwnageTool from http://blog.iphone-dev.org,
    which loads the Cydia App Store application. Once loaded, the Cydia store allows
    users to load applications that are able to do things beyond what Apple permits
    through their App Store, including much deeper access to the file system and the
    OS, which not only allows more functionality but also more potential for damage
    to critical system files.


    While the jailbreaking process does not specifically introduce any vulnerability,
    it does however introduce some complexity that users may not understand. This
    is what was being exploited by the recent iPhone worms.


    As part of the Cydia App Store, there is an option to install and enable an OpenSSH
    server on the phone itself since some applications available on Cydia are command
    line only and the easiest way to connect is through a local Secure Shell (SSH)
    connection. This is not a major feat for the iPhone, however, since its OS is
    UNIX based it is not available from the default Apple firmware.


    The cause of vulnerability was not in that owners had jailbroken their phones,
    but that they were not understanding what they were doing in the process. In this
    case, many owners installed an OpenSSH server onto the phone without understanding
    the consequences. In this case since the iPhone has a UNIX-based OS, it has users
    built in: root and mobile. Root is the super user of the system and can do anything.
    The user "mobile" is a restricted user that most applications run as and the owner
    of most of the interesting user-generated files like the e-mail database, calendars,
    short message services (SMS), and so on. Both of these accounts use the same default
    password of "alpine," which is widely documented around the Internet, along with
    large notes in the Cydia documentation to change those passwords if you enable
    the SSH server.


    Users being users, though, many did not change the passwords and this led to a
    new twist on a very old attack vector.


    Despite the media rhetoric and noise about attacks on jailbroken iPhones through
    SSH, this is far from a new attack. It is probably one of the oldest attack vectors
    known: a user leaving a default password on an administrative account.


    While it may be new and interesting that this applies to a mobile phone, these
    devices are now closer to mobile computers than they are mobile phones and should'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'be treated as such. Users, however, have not quite caught up to this line of
    thinking. To many of them, they are still simple phones first and not general
    computing devices.


    A manual version of the attack over an existing wireless network is fairly easy
    to do. The only difficulty is that devices like iPhones are usually used on demand
    and can come and go from the network as they are used and put into standby. Airports,
    coffee shops, libraries, and any other locations with free Wi-Fi are likely places
    to find iPhones and iPods using the wireless network.


    The first step is identification. Since iPhones are network devices, they require
    an Internet Protocol (IP) address to work over Wi-Fi just like any other device
    on the network. A simple Nmap or other port scan will identify devices on the
    network and report what services are running. iPhones will typically have port
    62078 open, which is iPhone sync, a UPnP service for the iPhone to share content
    with other Apple devices. This single open port is usually a good indication,
    but also confirming the media access control address corresponds to those used
    by Apple. Jailbroken phones with SSH enabled will have port 22 open for SSH (the
    default port for the SSH service). A simple Nmap output is shown in Figure 7.1.


    Once an iPhone has been identified, it is simply a matter of logging in over SSH
    as root to the phone with the default password of “alpine.” Figure 7.2 shows logging
    in to a jailbroken iPhone and the root folder.


    Once logged in, it is a standard UNIX command prompt. The most basic commands,
    “ls,” “cp,” and “rm,” are available along with things like Secure File Transfer
    Protocol. While not every common UNIX command may be available, there is plenty
    enough to move data on and off of the device.


    > NOTE

    > During the whole alarm at the initial rash of automated attacks, most news sites
    were trumpeting the same line about changing the root password on the iPhone to
    keep out invaders. What many sites failed to mention was that the username “mobile”
    had the same password of “alpine” and had access to most of the same interesting
    things that an attacker would be seeking on a mobile device (contacts, mailbox
    contents, SMSes, photos, and so on).

    > These articles were probably doing more of a disservice to their readers by
    failing to mention the user “mobile” requiring a password change as well, since
    a well-informed attacker would try out user: mobile, password: alpine.


    Once in as root, there’s really no limit to what you can do on the system. It’s
    just like any other UNIX-based computer system. The most likely of these things
    would be to steal the personal data from the iPhone’s owner. The more interesting
    files on an iPhone are located in the /private/var/mobile directory.


    The calendar application stores its data in the /private/var/mobile/Library/Calendar
    directory as shown in Figure 7.3. The mail folder which stores local copies of
    e-mails received is stored in /private/var/mobile/Library/Mail with each account
    having its own mailbox. Figure 7.4 shows an example of a mail folder.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '![](img/fa764b70be0fdcb44b75286d4f8589e2_125_0.png)


