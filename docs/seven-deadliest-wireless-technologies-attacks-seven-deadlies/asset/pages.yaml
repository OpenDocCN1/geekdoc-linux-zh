- pgno: 126
  md: '# FIGURE 7.4


    iPhone Mail Folder


    ![](img/fa764b70be0fdcb44b75286d4f8589e2_126_0.png)


    # FIGURE 7.5


    iPhone Photo Directories


    ![](img/fa764b70be0fdcb44b75286d4f8589e2_126_1.png)


    Photos are probably one of the more interesting targets, particularly as potential
    blackmail material or as a curiosity. Photos taken with the phone can be found
    in the /private/var/mobile/Media/DCIM folder, usually under a directory named
    100APPLE or another similarly named directory. Files are simple JPEGs and can
    be viewed with most image viewers, and as Figure 7.5 shows, they are owned by
    user mobile, thus reinforcing that changing the password on the mobile user is
    important as well.


    At this point, an attacker can download a great deal of private content; however,
    the attack relies on a persistent connection and can take time to download all
    interesting content. Obviously much can be scripted to speed things up, but there
    is also the other problem that our target may not be connected to the local network
    at the airport, hotel, or wherever he or she is being attacked.


    iPhones have an interesting behavior. As noted in Chapter 2, 802.11 Wireless –
    Client Attacks, some devices are very persistent in advertising for and about
    connecting to networks in their preferred list. iPhones in particular seem to
    have been designed to do this almost forcefully.'
  merge: -1
  img_proc: true
- pgno: 127
  md: "Within the Wi-Fi networking menu of the iPhone, there is a note at the bottom\
    \ of the menu that states “Known networks will be joined automatically. If no\
    \ known networks are available, you will be asked before joining a new network.”\
    \ Since these are hybrid devices, they have the ability to connect to the Internet\
    \ over a 3G connection as well. This obviously will incur costs to the user and\
    \ as a courtesy, the OS is designed to use the 3G as a connection of last resort.\
    \ Simply put, the system will check if a Wi-Fi connection that it has been connected\
    \ to before is present. If it is, it will automatically join it and use that network.\
    \ If one does not exist, then if there are any around, the user is offered the\
    \ opportunity to connect to one of those networks. If none exist or the user cannot\
    \ or declines to connect, then the 3G connection is used. All of this is provided\
    \ that the Wi-Fi connection is enabled in the first place.\n\nThis creates the\
    \ interesting situation for an attacker. Since the iPhone favors Wi-Fi connections\
    \ and is constantly searching for home networks and will automatically connect\
    \ without user prompt, an attacker can easily take advantage of this.\n\nUsing\
    \ tools from Chapter 2, 802.11 Wireless – Client Attacks, such as KarMetasploit,³\
    \ it is trivial to setup a fake access point that responds to any probe request\
    \ and emulates the networks on the preferred list of the iPhone. Once the iPhone\
    \ connects, it is silently given an IP address and now the attack has a direct\
    \ connection to the device with no user interaction. The wireless community has\
    \ found that the iPhone is one of the easiest devices to exploit this behavior\
    \ on.\n\nThe problem of intermittent connections due to the device being put in\
    \ standby is strangely solved by the environment the attack takes place under.\
    \ Most iPhone users are not using their devices constantly. They use them for\
    \ short periods and then place them in standby. There are places, however, where\
    \ constant usage is almost guaranteed, typically in any place where someone has\
    \ to wait long periods of time. One of the easiest places to exploit this is on\
    \ an airplane. Users will typically disable the 3G functionality of the phone\
    \ before the flight as per Federal Aviation Administration regulations but often\
    \ not disable Wi-Fi. Several miles in the air, most users will be listening to\
    \ music or watching movies on their devices, blissfully unaware that their device\
    \ is still seeking networks to connect to. All an attacker has to do is be in\
    \ range, which is easy on a plane, and then start up the attack. Automated systems\
    \ can make this take only a few seconds, leaving more than enough time for it\
    \ to work in other situations, like two cars traveling the same direction or even\
    \ while stopped at a red light.\n\n> **TIP**\n> \n> While most times, an attacker\
    \ would have to be very determined to get on the same flight as a target, there\
    \ exist targets of opportunity. A very bored person in the back of economy class\
    \ can wreck a great deal of havoc to keep themselves entertained and it is highly\
    \ unlikely that they would be noticed until well after the flight and they had\
    \ parted ways.\n> \n> This also applies later to automated viral and worm attacks.\
    \ Continuous contact in a contained area increases the likelihood of an infection\
    \ spreading to your device, particularly with many airlines now offering onboard\
    \ Wi-Fi capabilities."
  merge: -1
  img_proc: true
- pgno: 128
  md: '# THE ATTACKS


    In early November 2009, news sites and technology blogs⁵ were all abuzz with news
    of an attack on Apple iPhones. Several Dutch users of jailbroken iPhones reported
    that their devices had been attacked and a ominous message left on their lock
    screen wallpaper indicating a Web site to visit to find out how to secure their
    devices. The Web site demanded five euros for instructions on how to secure the
    phones. After news broke, the attacker very quickly removed the demand for payment
    and posted instructions on how to secure the phones as well as an apology to users
    he had attacked. As guessed, his preferred method was default root passwords on
    jailbroken phones. This was the first public demonstration of the capacity for
    this vulnerability, but certainly not the first time it had been quietly abused.


    Later in November, another iPhone attack appeared in Australia⁶ utilizing the
    same attack vector. Except this time, the attack was automated and could spread
    automatically from phone to phone via Wi-Fi networks that vulnerable devices shared.
    The Ikee worm, as it was known, was the brainchild of Ashley Towns, a 21-year-old
    student. The worm infected jailbroken iPhones through default SSH passwords, but
    this time changed the background image to that of Rick Astley and the ringtone
    to that of the song "Never Gonna Give You Up" of RickRoll fame. The worm would
    then attempt to upload itself and do the same to other phones on networks joined
    by the infected device. Reports only indicate 100 phones or less were infected,
    but considering the small percentage of iPhones that are jail-broken, this number
    is interesting. While it is unclear if the actions of the Dutch extortion attempt
    had anything to do with inspiring the Ikee worm, it did bring its author to the
    attention of iPhone application developer Mogeneration who hired Towns as a developer
    after an interview process after hearing about his worm. They claim it was not
    due to the worm and that he passed their iPhone developer test with flying colors
    as any other employee would have to. There is great debate if hiring him is rewarding
    negative behavior and sets a dangerous precedent.⁶ Some see it as positive reinforcement
    of a negative action and that if there is the hint of a reward, others will attempt
    to copy that behavior in hopes being rewarded. The end result may be a great many
    people attempting to write worms for the iPhone or other devices in hopes of landing
    a job. Some see it as asking the fox to guard the hen house, hiring


    > NOTE

    > It is still unclear as to whether or not the worm could spread via 3G connections.
    Many providers differ in how devices are presented to the Internet at large. Many
    providers of 3G gateways heavily fire wall the incoming connections for the IP
    space used by wireless devices. They also may deny interclient communication.
    While this prevents some attack vectors, some providers may not be as restrictive
    and allow the types of connections required to spread this type of malware. Much
    of it depends on the infrastructure of the carrier that the device is connecting
    to and can vary from provider to provider.'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'the best talent possible. It is certainly not a debate that will end soon,
    nor likely ever to be resolved.


    These first two attacks were fairly benign and did little to no damage to the
    attacked devices. However, they defiantly showed the world that there were a significant
    number of jailbroken devices that could be compromised easily. It also showed
    that the user base was fairly un-savvy about the risks to these hybrid devices.


    Shortly after the first two attacks, a third worm showed up, but this time, with
    definite malicious intent. In the Netherlands, a worm nicknamed “Duh” started
    spreading to jailbroken iPhones with default root passwords in attempt to steal
    banking information. The worm would setup a botnet where a bot residing on the
    phone would wait for SMSes from ING bank and mobile transaction authentication
    numbers (mTANs), a six-digit number sent to Web banking users that they must enter
    in a short window of time to complete a transaction. An out-of-band authentication
    system to verify the owner is accessing the account. The system fails since the
    SMS is received on what amounts to the same computer that is accessing the Web
    banking portal, thus negating the out-of-band part and the security it implies.
    The bot intercepts the mTAN SMS and sends it to a remote system where the attacker
    has a small window of opportunity, logging in ahead of the legitimate user and
    gaining access to their funds. Though not widely spread, any successful attacks
    would have likely yielded enough funds to make the effort worthwhile to the attacker
    and likely would inspire similar attacks in the future.


    # FUTURE ATTACKS


    By no means is the future of attacks limited to RickRolling and bank fraud. The
    potential for these devices as vectors for other attacks is huge. The one constant
    within security is that threats are continuous and often will surprise everyone.
    Smartphones and hybrid devices are so very versatile that people are constantly
    coming up with new ways of applying these advantages in some surprising ways.


    Twitter founder Jack Dorsey started a new venture called Square (www.squareup.com).
    The company hopes to become a major player in mobile credit card payment systems.
    The company is developing a small credit card reader that plugs into the audio
    in jack of a smartphone like an iPhone and allows anyone to accept credit cards
    for purchases without the cost and burden of traditional credit card authorization
    systems.


    Motorola is also entering the field with their mobile payment module (www.motorola.com/Business/US-EN/Business+Product+and+Services/Accessories/Mobile+Computer+Accessories/Snap-ons/Mobile+Payment+Device/Mobile_Payment_Device_US-EN),
    which clips onto the bottom of a smartphone running Windows mobile to accept and
    process payments anywhere. Using existing commodity devices, lowers costs are
    associated with the equipment.'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'While these ventures are still in early stages, this does make for some interesting
    thoughts on hybrid device security. Since these devices now accept credit cards,
    they are a more interesting and valuable target for an attacker. No longer would
    an attacker just get away with contact lists and e-mail – he or she may be able
    to retrieve credit card information in bulk from these handheld devices.


    The technology is still evolving but Square and others are leveraging, in part,
    the ubiquity of the iPhone and its interface. Credit cards are entered by hand
    on the phone or through a reader connected to the phone. The transaction is routed
    over 3G or Wi-Fi to be authorized in real time. While this may seem convenient
    since you can now process credit cards from anywhere, it also presents an interesting
    angle for an attacker. iPhones are very easy to coax onto Wi-Fi networks with
    tools like Karma, and given their preference to automatically connect to known
    networks, this would override the 3G connection. It would take a very small amount
    of network routing over an alternate backhaul, and all the traffic would be routed
    through the attacker. Combine that with existing weaknesses in the secure sockets
    layer and how users deal with error messages, and the attacker has a decent chance
    of being able to record all transactions. The closed nature of the iPhone causes
    issues in this scenario, as well, since the application vendor cannot “peek under
    the hood” and make adjustments to the device to secure it further.


    This is still a theoretical situation as no major attacks have been noted (or
    at least noticed) via this or other methods. That said, there is nothing preventing
    a “perfect storm” of new vulnerabilities, slow patching cycles associated with
    cell phones, and opportunities that would not make for a very large and profitable
    attack.


    # Offensive Uses of Hybrid Devices


    There is also little assurance for those paying via such mobile payment systems
    that the devices have not been altered in some way. Perhaps an unscrupulous employee
    jailbroke the device and altered the device to send a second copy of the transaction
    to his or her personal e-mail. In the same way, the Ikee and Duh worms used jailbreak
    access to change system files without the users’ permission; the same access could
    be used by the user to alter the system and compromise others without their knowledge.


    Another angle not often considered is using hybrid devices as a tool for attack,
    rather than as the target. Walking into a target location with a laptop and a
    bunch of other gear may be fairly suspicious and get a fair bit of unwanted attention
    for the attacker, but walking in with an iPhone and tapping at its screen is something
    that is highly unlikely to be considered suspicious.


    At Defcon 16 in 2008, David Maynor and Robert Graham of Errata security gave a
    presentation called Bringing Sexy Back: Breaking in with Style in which they described
    a number of methods they had used to creatively break into companies during penetration
    tests.


    As part of the presentation, the duo discussed using an iPhone as a sort of Trojan
    horse to gain access to a facility and assess its internal wireless infrastructure.
    Inspired'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'by a Saturday Night Live sketch, the pair got the idea of overnight shipping
    a modified iPhone to the target facility in order to gain access past the perimeter.
    In most cases, mail and package deliveries just pass right on into the facility
    and into the mail room, right into range of any wireless infrastructure that is
    present at the facility.


    They first obtained an early generation iPhone (due to lower power requirements)
    and the original box. The original iPhone battery would only power the device
    for a day or so, which means it would already be dead upon arrival. To combat
    this, they installed a battery pack in the bottom of the box and used that to
    power the iPhone for up to five days, more than enough time to do what was needed.
    With a little modification of the box, the battery, charge cord, and iPhone all
    fit snugly in a nonthreatening package.


    The iPhone was jailbroken and additional software installed well beyond anything
    Apple intended to ever have installed. The iPhone, being a UNIX-based system,
    made porting of several popular utilities easy to do over other platforms (like
    Windows Mobile or Symbian). Tcpdump (packet sniffer), Metasploit (exploit framework),
    FERRET (information leakage assessment), and other tools were installed on the
    device. After disabling all the auto power down features of the phone, they setup
    the system to call home. Since most carriers block incoming connections to devices
    on cellular data services, the phone was made once an hour to connect out over
    the cellular data connection to a remote system and establish a shell for the
    penetration testers to use.


    Once everything was set up and charged, they overnight-shipped the box and phone
    to the test facility to the attention of a nonexistent employee name. Presumably,
    the shipment tracking number told them when the package arrived at the destination
    and when they could begin testing. Addressing the package to a nonexistent employee
    was a way that the package would stay in the mail room for a period of time since
    it was undeliverable and (hopefully) be returned to Errata Security after a few
    days to be recharged and used again.


    This attack proved to be very effective and continues to be developed. In the
    hands of a determined attacker, it could be devastating as it also includes a
    level of anonymity that would be highly desirable.


    > **NOTE**

    > Since the iPhone was jailbroken, this removed the digital locks put in place
    to prevent using the phone on other networks. An attacker could then use an anonymous
    prepaid SIM card from some far away land that would be very difficult to track
    down. As well, if the package was opened out of suspicion, there is nothing really
    indicating who sent it (other than a return address which may or may not exist),
    and the attacker is only out a few hundred dollars and is safely far away from
    the facility.


    Once inside the facility, the Errata penetration testers had everything they needed.
    They had remote access to the device that had a wireless interface they could
    listen to traffic on, use to connect to the network, and a UNIX platform with
    tools like Metasploit installed to conduct further tests and attacks on, all while
    this small box sat on a desk or shelf in the mail room.'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'This method of attack was fairly ingenious, as a common defense used by some
    is to have a heavy outer layer of security (guards with guns), assuming that this
    will prevent an attacker getting close enough to take advantage of poor security
    further in.


    The following year, at Defcon 17¹ in 2009, a presentation by Thomas Wilhelm expanded
    on the capabilities of Errata Security by exploring the possibilities of hacking
    with the iPod Touch (similar to the iPhone in capabilities, but without the telephone
    functions). A surprisingly large amount of tools have been ported and are simple
    to install on a jailbroken devices. Some others require manual building installation,
    but all the tools to do so are easily available. He noted that an iPod/iPhone
    is more socially acceptable to bring into a “secure” area than a laptop or other
    obvious computer.


    # Anonymity


    The potential with these devices is not just limited to them being a target of
    attack or a tool of attack, but as intermediaries to do the dirty work through
    or for the attacker, unknown to the user.


    It’s not hard to imagine a day when a remote vulnerability on an iPhone will allow
    an attacker to gain root access to a device over local Wi-Fi connections. Once
    there, all the tools necessary to download and install further malware already
    exist. An attacker could set a scheduled job that can run who-knows-what at a
    later time.


    It is also not unreasonable that an attacker could use the Wi-Fi connection as
    a gateway to access the Internet through the cellular data connection. Previously,
    an attacker trying to hide his/her tracks would need to route their connection
    through compromised computers around the world or an open Wi-Fi access point.
    The problem with these is that connections can be logged and some sort of trail
    left. In the case of a mobile phone, there is no facility to login that kind of
    detail what connections are routed through it leaving the attacker to just have
    to visit a coffee shop in order to do their evil deeds.


    # iPHONE SUMMARY


    As a growing part of the market, iPhones are going to be under greater scrutiny
    by attackers for vulnerabilities, particularly as more and more people put more
    and more personal parts of their lives onto these devices.


    For now, attacks have been limited to jailbroken devices left with default passwords.
    However, we should learn lessons from these experiences because, at some future
    point, a vulnerability may be found in a default application, or even a third-party
    application sanctioned by Apple, that may provide an attacker with a path to the
    rest of the system.'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'The closed nature of the iPhone is a double-edged sword for security. Being
    that it is closed and applications vetted before being offered through the App
    Store, Apple can limit the amount of access applications have and hopefully limit
    exposure to malware. This comes at a cost to the user, though. Because it is closed,
    the user is limited in what sort of proactive steps can be taken to fend off attacks.
    Currently, there are no firewall applications available for the iPhone to filter
    what type of traffic is allowed (incoming or outgoing). Virtual private network
    (VPN) functionality is built in, but it is limited in support for different protocols.
    If you have an existing VPN infrastructure that does not support any of the included
    protocols (Layer 2 Tunneling Protocol, Point-to-Point Tunneling Protocol, or Cisco
    IPSec), you are out of luck. There is also no available option for an antivirus
    scan of the device as that would almost be an admission by Apple that their devices
    were vulnerable in their factory (nonjailbroken) state (something unlikely to
    happen).


    # Android Security


    While iPhones enjoy a growing percentage of the mobile phone market and a certain
    amount of sex appeal, phones based on Google’s Android OS are growing in interest
    and market share. Unveiled in late 2007, the OS, which is based on a Linux kernel
    (as opposed to iPhones FreeBSD-based Darwin kernel), has been built with a different
    security model than that of the iPhone. The open nature of the OS and its attention
    to security is a significant counterpoint to Apple’s closed model.


    Android’s security model is one of openness. This seems to be counterintuitive
    in that security and openness are concepts usually not compatible. Android developers’
    desire was to allow users and application developers to have a greater degree
    of control over the device, and to put in place a model where even if a malicious
    application was installed or a remote bug found, the implications would not be
    as dire.


    On Android, much of the security comes from a unique model for software permissions.
    Each program runs as its own User IdentifierK (UID or simply user), whereas on
    an iPhone, all programs run under a single user (mobile). This acts as a “sand
    box” and limit interprogram communication to specific functions. At the time of
    install, the program can request specific permissions to interact with other programs.
    The user is told of these permissions and has the option of allowing or disallowing
    of these permissions. In this way, the user can decide that, yes, this new contact
    manager should be able to access my phone book and make calls, but not the Wi-Fi
    network or the GPS. The same goes for programs that have no business accessing
    core phone functions. Why does this falling block game need to know my location
    and access my phone book? In this model as well, a potentially malicious program
    can only interact with other programs and data in very specific ways, and as such,
    limits the amount of damage that can be done should they go rogue. Applications
    can also generate their own permission types to allow other programs access.'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'In the Android model, the user is the gatekeeper who can make decisions about
    security. In the iPhone model, Apple is the gatekeeper. All apps have to be submitted
    to Apple and pass through a screening process before they are added to the App
    Store. Apple checks the source for obvious things, such as a game accessing the
    microphone or call functions and other things that it should not be doing, but
    given that Apple receives about 10,000 applications and application update submissions
    a weekᴸ and has only 40 full-time reviewersᴹ the possibility of the process being
    overworked and missing something or for overzealousness and unnecessary denials
    happeningᴺ is real and has occurred. Android leaves it up to the user to decide.
    Offensive or unstable applications will simply be uninstalled by the user and
    even then, due to permissions, unstable or malicious applications will be unlikely
    to affect the core of the system and other applications.


    On the iPhone and other platforms, a program with malicious intent or one compromised
    in some way is capable of accessing data and resources from any program running
    under the same user. Once the program breaks out, there is no restriction other
    than Apple''s guidelines in the App Store agreement. This means that a compromised
    mail client can, in theory, access contact lists and issue SMSes, which in turn
    would cost the user money. The only thing stopping this is that Apple will not
    allow such an application to be approved and end up in the App Store.


    # Common Threats


    While Android and iPhones are fairly different in the model they use for application
    security, they share some fundamental similarities that make smartphones and hybrid
    devices as a whole market a much more interesting target for attackers than any
    one device or brand alone.


    A common argument against extra security for smartphones is that the amount of
    any single model or platform of phones in comparison to other targets is relatively
    small. An install base of a few million Android-based phones is not a very large
    target base when compared to the massive number of Windows-based internet connected
    PCs. A vulnerability exploited on Windows PCs has a much higher chance of mass
    success than just a few million smartphones, not all of which are on or connected.


    However, it is worth remembering that these phones are computers in their own
    right and as a whole represent a very large number of devices, even outselling
    laptops in the foreseeable future.ᴼ Put together, smartphones are a sizeable install
    base and as different as they seem, beneath the hood they share more than one
    would think.


    To save costs, increase developer adoption, and other factors, modern smartphones
    are now leveraging existing UNIX platforms instead of writing entirely new'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'OSes. Much of this includes open source tools and libraries. Despite their
    outward appearances, the iPhone, Android OS, and even the Palm Inc''s WebOS, which
    powers the Palm Pre, share a number of common programming underpinnings, which
    mean that there is potential for all devices to be vulnerable.


    One such underpinning is WebKit, the engine used by iPhone for the Safari browser
    and e-mail client; Android uses it in its browser and WebOS uses it heavily throughout
    the OS to render applications. This common engine is a fundamental part of all
    three of these new generation smartphones.


    This creates an interesting situation because, since the engine is used in the
    browsers in all three, there is the potential for an exploit to work on all three
    platforms, greatly increasing the target base and removing much of the need to
    tailor the attack for specific platforms. Usages common between the platforms
    as well make attacks easier. Tools like Google''s Gmail and other Web-based applications
    are very popular with mobile users and are also under considerable attack.


    An exploit in WebKit, like a cross-site scripting bug, could generate an iFrame
    and be used to upload the contents of these Google applications to the attackers
    server of choice on any platform. Since even with Android''s permission structure
    the browser needs access to the network, this sort of action would be allowed.
    Combined with large crowds like at a mall or conference and client attacks like
    using Airpwn to inject malicious scripts into traffic, an attacker can attack
    users across any platform, not just one.


    There are likely more commonalities between platforms than just WebKit, and attackers
    are notoriously creative in leveraging vulnerabilities. Should such vulnerability
    be found, they would certainly love to expand their potential attack base.


    # SUMMARY


    While the future rarely arrives exactly as predicted, some elements of it do make
    it to market. The advance of the mobile phone from simple communications device
    to hybrid mobile computing platform has been amazing to see in a fairly short
    period of time. The resulting drop in cost over the years, allowing everyone to
    own one, has changed our day-to-day behavior in ways most people never expected.


    The threats to and from these devices are a new challenge for society to adapt
    to. While manufacturers can build in security mechanisms to attempt to think ahead
    of attackers and cut them off at the pass, there are still a great many ways that
    things can go wrong. Technological development will not slow down in order for
    society to catch up. Consumers of these devices need to take more forward steps
    to understand the implications of the devices they use and how they can affect
    their daily lives.'
  merge: -1
  img_proc: true
