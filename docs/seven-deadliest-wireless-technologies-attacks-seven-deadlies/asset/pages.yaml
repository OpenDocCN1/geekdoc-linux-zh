- pgno: 73
  md: '# Radio Frequency Identification Attacks


    # INFORMATION IN THIS CHAPTER


    +   - RFID Basics

    +   - RFID Risks

    +   - Physical Access Control

    +   - RFID Meets Crypto


    Radio Frequency Identification (RFID) is a technology that everyone hears about
    but most people do not fully understand. Its name is thrown about in terms of
    efficiency and modernization of commerce, and at the same time, it is associated
    with Big Brother and privacy invasion. In terms of security, it is a technology
    that is only starting to come into maturity for security, but it is so often misunderstood
    and the risks so underestimated that security is often completely forgotten.


    Most modern office buildings have done away with physical keys in favor of proximity
    card systems. We''ve all seen them, the cards on lanyards being waved in front
    of the readers at doors like some magical "open sesame" command for the modern
    age.


    At the DEFCON 17 hacker conference, it is widely known that a fair number of attendees
    are federal agents, some under their own names and some undercover, but all there
    to learn. There was quite a stir among many of them this year: those who thought
    they may have had their proximity cards cloned. A project, undertaken by Adam
    Laurie (major malfunction) and Zac Franke to raise awareness about RFID vulnerabilities,
    gathered more data than expected.


    Their project consisted of a 125-kHz RFID reader and a large antenna hooked to
    a laptop. The laptop also had a webcam attached to it. All of this was in plain
    sight on a table in the conference area. Anyone walking up to the table with a
    compatible RFID card on their person would have it scanned and their picture taken
    with the webcam. The idea was to then scrub the data and put it on the "wall of
    sheep," joining other attendees who used insecure protocols to login on the conference
    network.'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'It turned out that their project worked better than expected and may have captured
    the data from the door access cards of several federal agents. For conference
    organizers, this was stepping into a gray area (more than the usual for DEFCON)
    that they thought best not to encourage, and during the “Meet the Fed” panel,
    it was explained to the assembled feds on stage and the audience what had happened
    and the implications of this. At which point Adam Laurie destroyed the memory
    card with the data without having given it more than a cursory glance. Afterward,
    many were heard to say, “We never thought of that.”


    # RFID BASICS


    RFID encompasses many technologies under one acronym. Pretty much, any technology
    that is used to identify something via a radio signal fits under the RFID umbrella.
    As most people know it, RFID is a short-range wireless identification system typically
    used for building access, for barcode replacements, and in identity documents
    and payment cards. Chances are that you have one or more RFID-enabled devices
    on you at any given time. Most people, however, have little idea how these devices
    actually work, which like most technologies, leads to security risks and vulnerabilities.


    RFID devices commonly have two parts: the transponder and the reader/interrogator.
    When the reader queries the tag, it replies with some identifier, most basically
    an identification number (there can be more complex responses which are discussed
    later), which is received by the reader and some action is performed with that
    identifier. This may seem overly general, but there is no end as to what can be
    done with a tag and reader. The tag can be placed just about anywhere, and the
    reader can pass the identifier to a back-end system, which can cause just about
    anything to happen, from an account being debited to opening a window or updating
    a map. The RFID identifier should just be treated as input into a larger system.


    # RFID Systems


    Most common RFID systems fall into two categories: active and passive. This usually
    denotes the power system involved with the tag, as well as how it behaves when
    not being interrogated. RFID at its heart contains a very small processor that
    performs some action when powered; however, the method of power does limit some
    uses.


    # Active Tags


    An active device typically has a battery or some other power system. The device
    is always “on” and typically has a longer range than passive tags. These devices
    are broadcasting their signal all the time and can be received by any appropriate
    reader in the vicinity. Major examples of this are the ubiquitous EZpass in New
    York State and other U.S. states in the Northeast and other toll collection devices
    around the world.'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'Usually, active tags are larger due to their requirements for internal power.
    There is no end of the sizes and shapes available, but they are typically much
    larger than passive tags. The advantage of an active tag is the increased range
    due to the extra power. This is one of the features that make them very attractive
    for toll collection since cars do not need to slow down or get unnecessarily close
    to the reader – the toll can be collected automatically, almost without slowing
    down from highway speeds. This reduces the manpower required for toll collection,
    as well as decreasing bottlenecks and traffic delays caused by manual toll collection.
    It also means that travelers do not have to worry about insufficient change since
    the tag is linked to an account that is billed later via credit card or invoice.


    There is a third type of tag, the battery-assisted passive (BAP) tag. These tags
    require an external signal to “wake up” but once they are, they utilize a battery
    to vastly increase their range. These can be classified as active tags due to
    the use of a battery, but for some uses, it may be useful to consider them separately.
    For the purposes of this chapter, they will be considered in the active tag category.


    # Passive Tags


    Passive devices are the other side of the technology. These devices are unpowered
    until brought into proximity of the reader. The reader powers up the tag through
    a process called induction. A radio signal of a specific frequency is emitted
    by the reader to the tag. The tag’s antenna is tuned so that the readers’ signal
    induces an electrical current in the antenna, supplying electricity to a small
    capacitor. When the capacitor is at full charge, it powers up the chip on the
    tag, which then performs its functions, sending out its reply through the same
    antenna to the reader. This process repeats as long as the reader is in range
    and is energizing the tag. Being that there is no requirement for an external
    power source like a battery, these tags can be extremely small. Some designs are
    just slightly larger than a grain of rice; others are thin enough to be made into
    flexible adhesive labels and attached to just about anything. Some packaging options
    can be embedded in clothing, namely the sewn in tag.^1 There are many packaging
    options available, with the tag itself only taking a very small amount of space
    in the package. Figure 4.1 shows a variety of tags and a small hobby reader.


    Since passive tags are powered up by the reader, this requires that the reader
    be much closer to the tag than in an active system. The signal powering the tag
    from the reader decreases with distance (the attenuation is proportional to the
    inverse square of the distance from the tag), so to increase the read range, one
    needs to increase the power to the reader. However, the tag only has a limited
    range on its capability to send signals back to the reader, so if the reader is
    too far away, it may be able to power the tag, but not able to hear it. This distance
    is usually a few inches to a few feet depending on the specific technologies and
    readers used. This is not a problem for a door access card or a credit card system,
    but is not optimal for a car traveling at 50 mph.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '![](img/fa764b70be0fdcb44b75286d4f8589e2_76_0.png)


    # FIGURE 4.1


    A Variety of RFID Tags and a Small Hobby Reader


    Passive tags are by far the most common type of tag and are used in payment systems
    (credit cards), in authentication systems, such as door access cards, in counterfeit
    detection, such as tickets to the Beijing Olympics and passports, and on products
    of all shapes and sizes for inventory control.


    # RFID RISKS


    RFID is often talked about as either a security panacea or a nightmare. It all
    depends on which side of the risk you stand.


    As a panacea, its main benefits revolve around the capability for electronics
    to stand up to attacks by counterfeiters and other nefarious persons. They also
    provide much more potential of an audit trail and granular control in a variety
    of ways for things like inventory tracking and building access.


    As a nightmare, they stand out because society in general has a tendency to trust
    technology. If someone can successfully counterfeit or clone an RFID device, it
    is assumed that it must be legitimate, and often there is no further check beyond
    the existence of a valid-looking tag.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'The benefits of the technology are also its weakness. Since it has the power
    to transform any industry it is used in, it has the effect of people believing
    it to be infallible and as such, not preparing for its possible failure.


    An issue that always seems to come up with regard to RFID systems and security
    is their expected longevity of use. A business investing in a system probably
    expects to use that system for 10 years or more and often it does. Should a vulnerability
    or unforeseen risk emerge in that time, they would most likely have to replace
    most, if not all of the system – something that costs a great deal and they are
    unlikely to do.


    Another issue is complacency: the system has been operating for 10 years and those
    in charge of it may not be aware that there has been a new discovery that destroys
    all their previous conclusions about the system. It was a secure system when they
    installed it and still is as far as they know. Related to this is cost-breeding
    complacency, a business not wanting to opt for a higher-security system because
    they don''t feel at risk (yet!) and can save money opting for the cheaper and
    less secure system.


    In the security world, things can change, literally overnight. A once secure system
    can resemble Swiss cheese with one piece of information. With the speed of information
    dissemination around the Internet, potential attackers can learn of these issues
    in minutes. To correct an issue in the software world, this typically involves
    a patch or simply upgrading the software package to a new version or a reconfiguration.
    In a system where the vulnerabilities are built into hardware, this becomes an
    infinitely more complex problem to solve. RFID solutions are definitely in the
    latter category of a hardware problem.


    In order to alleviate a vulnerability, all readers would have to be upgraded (via
    software if possible, but possibly the hardware too) and every card would have
    to be replaced. In an installation where there are hundreds of readers and thousands
    or millions of RFID-enabled card or devices, this is a huge task that will take
    significant amounts of time and money.


    # PHYSICAL ACCESS CONTROL


    In today''s world, it is a necessity that certain groups of people need to get
    into an area and other people need to be kept out of the same area. This has been
    an issue since the first humans built a wall to keep someone out of their space.
    If you were a pre-historic cave man and you wanted to keep creatures out of your
    cave (and hopefully from eating you), you built a wall of some sort so they could
    not gain access. This caused a problem, however. If critters could not get in,
    that likely meant that neither could you, and you may well become something''s
    lunch without the protection of your cave. So shortly after the first wall was
    built, something resembling the first door was invented. This can be thought of
    as the first access control. The early human knew about the door and how to move
    it to gain access to the cave, but the critters did not. If you were a human,
    you could enter. This is physical access control; one person or group can pass
    through some physical barriers but another cannot. Over the years,'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'this evolved into bigger walls, drawbridges, moats, guards, secret handshakes,
    and eventually to early locks and keys.


    In more modern times, this grew into several different methods, all with advantages
    and drawbacks. Modern keys and locks can be fairly secure; however, granularity
    of access is difficult and may require users to carry multiple keys, which can
    be lost, requiring locks to be changed at great expense to prevent the lost key
    from working if it fell into the wrong hands. Mechanical locks also wear and break,
    requiring specialized maintenance, and in general, require a fair amount of overhead
    to keep the system secure in a large facility.


    Guards are a common method of access control, even today. There are some major
    disadvantages to guards, though. They are expensive, they make mistakes, they
    can be bribed, fall asleep, or become an insider threat themselves. Guards also
    are not very keen on keeping audit logs of every employee''s movements throughout
    a facility. That said, a human guard has some advantages and can greatly compliment
    a technological solution as will be discussed in a bit.


    In 1960, magnetic stripe cards were designed by International Business Machines
    (IBM) and used as access controls by the Central Intelligence Agency (CIA). Mag
    stripe cards (like credit cards) have their identifier number encoded on a magnetic
    strip that is swiped through a reader connected to a computer backend. These systems
    are still in use today but suffer from problems of worn out cards and worn out
    readers. As well, since the read head for the mag stripe needs to be accessible
    and needs to be fairly precise, exterior access was problematic with dirt, rain,
    and other elements fouling the mechanisms. These systems, though, laid the groundwork
    for today''s modern systems.


    Finally it has evolved to what most modern office buildings are equipped with.
    RFID proximity cards (so named because the card and reader activate when in proximity).


    # EPIC FAIL


    In 2006, the United States began issuing passports with RFID tags implanted in
    them as a security measure. The tags, when a proper key was provided, would respond
    with a digital copy of all the information on the photo page of the passport.
    The idea was to make it harder for counterfeiters since they now had to alter
    the physical passport, and the contents of the RFID tag to match the person presenting
    it.


    When the plan was announced, privacy and security advocates were not pleased.
    Public comments were taken in and as a result, some changes were made to alleviate
    some fears, namely of the possibility of the passport being read at any time,
    not just at the border.


    The solution consisted of a layer of metal foil in the cover of the passport acting
    as a shield against the tag sending or receiving any RF energy. This solution,
    on a technical level, works. When the passport is closed, communication with the
    tag is not possible. However, the solution is self-defeating. Due to the thickness
    and rigid nature of the foil and how it is embedded between the layers of the
    cover, the passport naturally wants to "pop" open about 1 inch, rather than stay
    closed like earlier generations. This gap is enough to allow the tag to be read,
    thus defeating the point of the foil in the cover. A passport in a purse or in
    a loose pocket will naturally want to open, potentially revealing data. This has
    lead to the common site at border control of wrapping an elastic band around the
    passport to keep it closed or using a special shielded case with a clasp for the
    passport.'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'This is a fairly common sight at most modern offices with employees simply
    waving cards in front of the readers that grant them access. You can usually see
    a small plastic box beside the door with one or more LEDs on it, though not always.


    These systems can work via active or passive tags. Most of the older systems have
    a thicker active card, about the thickness of two credit cards that contains a
    coil antenna, the RFID circuitry, and one or more coin cell batteries. Other systems
    operate on passive tags, powered by the reader, and are often the same thickness
    as a credit card. There is no standard package for a proximity card system; however,
    the “card” format is most popular and is often integrated with the employee’s
    ID badge as well.


    # Proximity Cards


    The use of an RFID proximity system has many advantages over previous methods.
    Since it is a contactless system (wireless), the card and the reader can both
    be sealed against the elements. This allows for exterior readers to put up with
    rain and dirt and not be damaged. It also means that neither the card nor the
    reader can ever really “wear out” through repeated uses.


    The most common and most basic use is through a simple numeric identifier. A card
    is presented to the reader and is queried. The card transmits its identification
    number, and the reader sends this to the back-end system. If the numeric identifier
    is allowed to enter that door, it sends back an approval message to the reader,
    which then opens the latch or door. If the presented numeric identifier is not
    allowed, nothing happens and the door stays shut. All of this takes place in a
    matter of moments and the user just has to wave their card in front of the reader
    to start the process.


    Proximity-card-based systems offer many enhancements to security over earlier
    traditional systems like guards and keys. The biggest of these is the use of unique
    identifiers. In a traditional key-based system, everyone with a key to a door
    had the same key. Short of a secondary method to verification, there was no way
    to tell which key opened the door. This caused issues since everyone with a key
    could point at everyone else and say they were the one who opened the lock. There
    was no way to leave an audit trail of who opened what and when with keys. With
    a proximity card system, each employee’s card has a unique identifier, which is
    tied to their name in the back-end system. This allows for discreet logging of
    a specific employee accesses and provides auditing, in case there are issues later.


    The use of unique identifiers also allows for a high degree of granularity of
    control over what a proximity card can have access to. Traditional keys posed
    the problem, that to have really granular control over access, separate keys had
    to be issued for each lock and properly distributed. This was a real headache
    to manage and keep organized and led to people often having more access than necessary
    since it was easier that way. A proximity card system allows for very granular
    control and can allow you to specify down to individual doors, if you so desired.'
  merge: -1
  img_proc: true
- pgno: 80
  md: "been copied. If an employee loses a card, it is also easy to simply deactivate\
    \ the old one and issue a new one and apply the same rights as the old one. A\
    \ lost key in the mechanical lock system meant that locks would have to be repinned\
    \ and new keys made and distributed.\n\nDepending on the system, the cards can\
    \ activate more than just doors. Machinery, cabinets, dispensers, vending machines,\
    \ and even computer logins can be integrated with the system to allow a single\
    \ card to perform many different functions.\n\n# Physical Access Control Failures\n\
    \nFor a moment, it's worth looking at the concept of authentication since that\
    \ is what this system is all about and where its failures lie. All the system\
    \ is doing is taking the unique identifier and granting or denying access based\
    \ on that identifier. This is where the problems creep in – it is just granting\
    \ or denying based on the identifier. There is no mechanism to verify who is presenting\
    \ the identifier.\n\nThere is an old saying within security referring to authentication:\
    \ “Something you have, something you know, something you are.”b This describes\
    \ the different general methods a person has to authenticate to any security system,\
    \ technological or not.\n\n“Something you have” is simply a physical token that\
    \ you must possess to gain access. The most common example is a ticket to a concert.\
    \ You only need to have the ticket to get in; they don’t care who is holding the\
    \ ticket, just that you have it. The computer equivalent would be a hardware token\
    \ like a smart card or a security certificate.\n\n“Something you know” is simply\
    \ a secret that only an authorized user would know. Most people know this as a\
    \ password. From the login password to your computer to a kid’s clubhouse or secret\
    \ handshake to identify membership in a club, it does not matter who it is, as\
    \ long as they know the password, handshake, dance, or whatever is being used\
    \ to authenticate.\n\n“Something you are” refers to biometrics. While this can\
    \ be as complex as fingerprints, or retinal scan, it can be as simple as your\
    \ friend, the club bouncer, recognizing your face and letting you in. Some unique\
    \ element of you as a person is being used to authenticate into the system.\n\n\
    Generally within the security field, any system should integrate at least two\
    \ of these things. “Something you have” and “something you know” could be a smart\n\
    \n> NOTE\n> \n> A special note should be made that while a traditional key is\
    \ definitely “something you have”, if more than one user has the same key, there\
    \ is little point in using it as a security token. The logic of “Something you\
    \ have” and of all parts of the authentication triangle is that every identifier\
    \ is unique and thus can be traced back to a specific user, ensuring nonrepudiation.\
    \ A common key among users means that now only one factor (a password, or biometric)\
    \ is all that is left to authenticate."
  merge: -1
  img_proc: true
- pgno: 81
  md: 'card and a password. “Something you are” and “something you know” could be
    a fingerprint scan along with a password. Any system should be built with at least
    two of these things (optimally, all three) required to authenticate to the system.
    This better prevents an attack on the system.


    The corollary to the above saying is “Something I lost, something I forgot, something
    I was.”C This emphasizes the failings of each of the individual authentication
    methods given above and highlights why they should be used in concert.


    “Something I lost” is fairly obvious. If a user is issued a physical device to
    authenticate, he or she can lose it. Losing a key is the most obvious form of
    this that we’ve all dealt with. In the case of a proximity card system, a card
    can be lost or it could be stolen. As an attacker obtaining the card grants you
    access simply by possessing the card, same as if you beat up someone in the concert
    parking lot and took their ticket.


    “Something I forgot” should be very obvious to anyone who has ever worked technical
    support. Users will forget things. Passwords, handshakes – all can be forgotten
    and grind access to a halt. The subtext of this is that passwords can be divulged,
    sometimes innocently shared, written on a sticky note, or just guessed. Other
    times, they can be “discovered” through coercion, blackmail, extortion, or torture.
    Again, if you know the password and that is the only authentication method, then
    there is nothing stopping you once you know the password.


    “Something I was” is something many people don’t think about as much. This concept
    is a bit more of a gray area than the others. If your authentication method involves
    a biometric, it is hard to lose or forget your fingerprint or retina, but it also
    comes with new considerations. What about injury? If a fingerprint biometric is
    used, what if someone injures that finger or loses a whole hand? Are other fingers
    or biometrics enrolled? From an attacker’s perspective, this one is harder since
    it requires physical access to the person they are trying to authenticate as.
    You might try to coerce the user to authenticate for you. You may try to forge
    or copy the biometric such as lifting a fingerprint and making a fake hand. It
    may also mean the more drastic step of amputation of a hand or finger to bypass
    a fingerprint system.


    **WARNING**


    An attacker removing a digit to authenticate as someone has happened. In Malaysia,
    in 2005, an accountant was car-jacked for his Mercedes S-class car. The car was
    outfitted with a fingerprint lockout device, enabling only the owner to start
    the car. After carrying around the owner in the trunk for a while to restart the
    car when needed, the thieves became frustrated and relieved the owner of part
    of his finger before dumping him on the side of the road (http://news.bbc.co.uk/2/hi/asia-pacific/4396831.stm).
    In any system, a determined attacker will find a way to bypass or defeat a security
    system, up to and apparently including amputation.'
  merge: -1
  img_proc: true
- pgno: 82
  md: "The idea is that the difficulty and an attacker's level of commitment to the\
    \ attack increase with each additional method. A password can be guessed remotely,\
    \ but a password with a hardware token is much harder. Now an attacker has to\
    \ physically interact with the victim, something most common attackers have no\
    \ interest in. Using all three means that the attacker must have the password,\
    \ the hardware token, and the biometric all present to authenticate, a fairly\
    \ daunting proposition for all but the most dedicated attacker.\n\n> TIP\n> \n\
    > Some biometric systems use voice prints to identify a user. A person's voice\
    \ can change over time, be affected by a cold, even by their mood, or by what\
    \ they had for lunch. As such, to avoid high failure rates, these systems often\
    \ have their tolerances tuned down, sometimes to the point where a recording of\
    \ the user's voice will suffice to authenticate with the system. For obvious reasons,\
    \ in high-security situations, this may be undesirable.\n> \n> Any biometric system\
    \ selected should take into consideration the failure rates and issues associated\
    \ with a system and their suitability to the expected application.\n\nProximity\
    \ cards' main failure is that they are usually a single factor form of authentication,\
    \ namely the unique identification number. This means that, barring any other\
    \ methods, an attacker just has to present the unique identifier to the reader\
    \ to gain access. There is nothing that ties the unique identifier to the person\
    \ it was issued to and whose access we are impersonating. There is also nothing\
    \ in this type of system that ties the identifier to the proximity card it is\
    \ expected to be on.\n\n# Cloning RFID\n\nSince RFID proximity cards are wireless\
    \ based, this gives an attacker an advantage over something like a physical key.\
    \ Unlike a physical key that you would need to physically remove from the victim\
    \ to copy. The wireless nature of the proximity cards means that they can be read\
    \ at a distance and do not need to be removed.\n\nA large number of proximity\
    \ card systems in use today, particularly older installations, only use a simple\
    \ numeric identifier to authenticate. There is no encryption or any verification\
    \ done on the card, other than to check the number received against a back-end\
    \ system. This also means that there is no authentication by the card of the reader\
    \ that is interrogating it. It will respond to any compatible reader and present\
    \ its numeric identifier to it. This is very useful for an attacker since they\
    \ can simply wave a reader past a pocket or purse of their victim and the card\
    \ hands off the identifier. The attacker can then take this information and write\
    \ his or her own copy of the card to use as they see fit.\n\nIn 2003, an engineer\
    \ by the name of Johnathan Westhues took to tinkering with proximity cards and\
    \ understanding how they work. Through his efforts, he was able"
  merge: -1
  img_proc: true
- pgno: 83
  md: 'to reverse engineer the protocol of the Motorola flexpass and understand what
    was being transmitted by the card and how it interacted with the reader. He continued
    his efforts and began to build a card simulator in order to interact with readers
    and understand how the cards worked. After a while and after some revisions, he
    built his own combination reader and card simulator, since both share many of
    the same parts. The device, called the proxmark, is not much larger than a credit
    card and only twice as thick and is dead simple to operate. It consists of two
    buttons, one for "reader mode" and one for "card mode." "Reader mode" turns the
    unit into a 125-kHz RFID tag reader that you can hold by any compatible tag and
    it will read its unique identifier and store it in memory. The "card mode" button
    simply replays the stored tag information. This means that he could walk up to
    someone and surreptitiously scan the contents of their proximity card, walk over
    to the secure door and replay their card, whereupon he would be granted access
    as if he had presented the real card.


    Over the next several years, he has revised his device and greatly improved its
    capabilities. As of February 2009, the Proxmark 3 is the latest revision and supports
    most 125-kHz and 13.56-MHz tags (the two most common frequencies) and can read
    and emulate most any ID-only tag out there.


    > **NOTE**

    > All of the schematics, bills of materials, and designs for the Proxmark are
    available on Johnnathan''s Web site at http://cq.cx, if you want to build one
    yourself. If you are not inclined to build one yourself, completed devices are
    for sale at http://proxmark3.com/. A warning though that in most jurisdictions,
    cloning a card that you are not otherwise already authorized to have is probably
    illegal. You should only experiment on systems and cards you own or have express
    permission to experiment on.


    The existence and availability of this device now means that an attacker can now
    clone many common proximity cards and simply replay them to gain access. There
    is still the issue of how to get to where we need to go in a building. If we are
    after secret research or something as valuable, its access is likely to be restricted
    to a few specific employees. This means that we cannot simply clone just anyone''s
    card, we need to be sure to get one that will get us access to the area we need
    to in order to do our dastardly deed.


    Role-based systems that allow granular access to certain areas seem like a decent
    way to limit employee access. They can only have access to where they need to
    be and can even limit access to certain times. However, an attacker can often
    use this to his/her advantage.


    Optimally, these roles would be rigid. Only people with a real need to access
    a certain area would be granted access, and it would be strictly enforced. However,
    most businesses are a bit more political and pragmatic than that. Typically, those
    with legitimate access will have no limits on their access hours in case they
    work late, assistant staff may need to get access to do things on behalf of their
    bosses.


    In a perfect world, Owner/CEO/Head honchos of the business have no real reason
    to go into some areas: their employees report things to them, and they don''t
    need to'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'actually go there themselves. People in these positions, however, tend to not
    like the idea of being locked out of anything or any limits put on them, and as
    such, their access is usually unrestricted and covers most, if not all, of areas
    and times.


    As an attacker, we can use this by targeting the bosses and cloning their identifier.
    It can be as simple as sharing an elevator or in line for coffee. Sometimes, this
    does pose a problem though since the bosses of some organizations are not easy
    to access.


    There is one person, however, who will tend to have complete or nearly complete
    access to a facility: the janitorial staff. Just about any office has a cleaning
    staff who take out the trash, wash floors, and so on, typically at night; these
    people need to have their own access to enter areas to clean them. As an attacker,
    it''s probably a lot easier to bribe or steal a janitor''s identifier than the
    CEO''s. One could walk up to a janitor as he is coming on duty and shaking his
    hand, and thank him for a good job, while your other hand silently clones the
    contents of the proximity card. Later that night, you can return and move about
    the building freely by simply replaying the janitor''s card.


    In either scenario, the audit logs (if any) will show the victim of the cloning
    as the one moving about the building. At worst (as an attacker), this will show
    the path you moved through the building. At best, it will direct the blame for
    your activities to the victim and away from you.


    # Minimizing the Risk


    While it is possible to clone ID-only chips, that is by no means the complete
    end to using them for physical access control, but it did mean that it was not
    reliable as a stand-alone system. Many things can be improved in order to increase
    security of these systems.


    One of the first methods to improve security is to actually audit the logs. Often,
    logs are ignored until something happens and then they are cursed for not being
    complete enough. Taking the time to evaluate if everything is being captured that
    you would need in a crisis will go a long way. In addition, automated auditing
    and alerts of the logs can be very useful in spotting inconsistencies and potential
    problems. If the enforcement of access controls is tight enough (scanning on both
    entrance and exit of a door), you can monitor for unusual activity such as Bob
    entering the building twice, or Bob''s card being used at opposite ends of the
    building when there''s no way he could have traveled that far. You can also look
    for situations where people are deviating from their normal schedules. A secretary
    should generally not be in the building at 3 A.M. Automated monitoring of the
    logs and alerts can help stop something before it starts.


    In addition to auditing the logs, audit the enrolled cards. Periodically verify
    that only current employees are in the system and that access is as it should
    be. Employees who leave the organization should have their access immediately
    disabled but in case that does not always happen, periodic audits will help catch
    those situations. Also audit for test cards, often a new system will have one
    or several test cards issued with full access for the installers and administrators
    to test the system and make sure that readers work, doors open, and so on. Often,
    these identifications are not removed'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'from the roles since the cards are destroyed. If the identifiers issued are
    sequential, it may be possible for an attacker to count backwards and generate
    cards from a known low access card to try and find some of the first issued cards.


    As much as there are issues with security guards, they have one advantage in that
    they can think. If they are properly trained, they can add a formidable layer
    of security. Typically, a guard at an employee entrance will get to know the people
    coming in every morning. As an attacker, this is a real problem since we likely
    look nothing like the person whose card we spoofed. Some systems allow a human
    guard to see the logs of who is authenticating at the door and perhaps even an
    employee photo and may be able to spot the inconsistency of our access and detain
    us. This does require that guards not become complacent and be distracted watching
    TV or surfing the Internet, but it is a definite hurdle to overcome. Guards, however,
    are expensive and often their role is that of visible deterrent, rather than an
    active participant in the authentication solution. However, their presence can
    allow for more security than a completely technical solution alone.


    Other ways to improve our fictitious scenario is to issue shielding sleeves for
    employees’ proximity cards. These metallic sleeves block the signals from readers
    and prevent the readers from powering the tags, thus minimizing the risk from
    surreptitious cloning if employees actually use them. Actually explaining to employees
    the risks and implications of having their cards cloned can help get them on your
    side and prevent them from exposing the cards unnecessarily. Explain to staff
    that wearing cards on a clip or lanyard away from the office exposes them to unnecessary
    risk. Removing them and even placing them in a pocket will make them less of an
    obvious target. Other simple things like not leaving their cards in glove boxes
    where they can be easily stolen is common sense that occasionally needs to be
    reinforced by security and IT staff.


    Even after all that, the risk still remains that cards can be cloned and that
    access is fairly easy to obtain. Often, these systems will be installed and in
    place for years and even decades. It’s pretty certain to say that early designers
    and adopters never thought that their systems would ever still be in use when
    attackers gained the sophistication to attack them reliably. If the threat posed
    is great enough, upgrading or replacement of the system is about your only option.


    # RFID MEETS CRYPTO


    One of the more obvious solutions for RFID as authentication is the introduction
    of cryptography into the process. The tag and the reader both have to prove a
    shared secret to one another before they will grant access. Cryptography has been
    used for decades in the computer world for authentication with great success.
    So why is it that it was not there in the first place?


    RFID chips are small – very, very small. They vary depending on the make and model,
    but sometimes the actual silicon chip is smaller than the head of a pin. There
    is also very little processing power available on these chips. They are that way
    partially to make them easy to produce; it makes them cheap, and it also means
    their whole package will be small, which increases their applications.'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'With the diminutive size, it is a challenge to cram solid, known trusted algorithms.
    In the first few generations of tags, this just was not feasible. So manufacturers
    and designers did what they had to do in order to provide for the market demand
    for secure chips and broke a general security understanding, it''s not a good
    idea to make your own crypto.


    The most recent example of these types of system is the MIFARE Classic (http://nxp.com/#!/pip=pip|p|p=53422|jpp=(t=t,p,i=53422)).
    The MIFARE Classic system is a 13.56-MHz tag built by NXP Semiconductor. The low
    cost and availability at the time made it ideal for a great many applications,
    the significant of which were physical access control and fare systems for public
    transit. NXP boasts over 1 billion cards in circulation, accounting for about
    70% of the market worldwide.¹ This, along with its usage as a fare system in London
    (Oyster card) and the Boston Subway (Charlie card) made it a very interesting
    target for research.


    To secure communications, the MIFARE Classic uses a challenge-response authentication
    system. The challenge-response system is like a conversation you would have with
    a bouncer at a door to a club. You want to tell them the secret password number
    "S" to get in, but if you say it out loud, it could be overheard and anyone could
    get in. So you establish a mathematical system to prove that both of you knows
    the key without saying it out loud. This system must be hard for someone to reverse
    the process to get the number themselves. To keep it simple, the algorithm will
    be to take the secret number and the random number, multiply them together, and
    square the result.


    You walk up to the bouncer and he picks a random number and says "My challenge
    number is 6." He has already calculated the expected result using the secret number
    5. You calculate (in your head): 6 × 5 = 30, 30² = 900. You reply to the challenge:
    "900" and issue your own challenge to see if he is actually the bouncer: "My challenge
    is 2." You already know that the answer is 2 × 5 = 10, 10² = 100. If the bouncer
    replies with 100, you have both proven you know the secret and can proceed. If
    his response to you is wrong, you can walk away not trusting him or at the least,
    wondering about his math skills. If your response to him is wrong, he can throw
    you to the curb and move on to the next person in line. Fortunately for RFID,
    the results are less dramatic for failure. This is obviously an over simplified
    example as the encryption algorithms are (usually) much more complex, but the
    process is similar.


    The MIFARE Classic system uses a challenge-response system to authenticate the
    reader to the card and the card to the reader without divulging the secret key
    over the air. The reader sends out a request for the unique identifier. The card
    replies with a 32-bit random number, the challenge. The reader takes this random
    number and computes it with the secret key both the reader and card share and
    the resulting 8-byte response is sent back to the card along with a 32-bit random
    number. The card finally replies with a 4-byte response to the reader and the
    unique identifier is now sent to the reader in an encrypted form. The card knows
    that the reader''s response to the challenge should match with what it calculated
    and the same applies for the reader. This way both devices have authenticated
    to each other and the system can open the door.


    The weakness was that the encryption system, called CRYPTO1, was built by NXP
    to fit on the chips in the tag and was proprietary. NXP made sure to keep the
    algorithm'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'secret so that no one could understand exactly what was occurring. In the above
    example with our bouncer, it is necessary to keep our algorithm secret since someone
    who knows it and overhears the response can simply reverse the process and figure
    out what the key must be (square root of 900 = 30, 30/6 = 5) and then respond
    appropriately to any future challenge and gain access. This is a classic case
    of security by obscurity.


    Originally launched in 1995,¹ the system quickly showed up everywhere and continues
    to be used today. It was not until 2007 that researchers were able to get anywhere
    in cracking the system. At the 24C3 conference in Berlin in December 2007,² Henryk
    Plotz and Karsten Nohl announced that they had successfully reverse engineered
    the CRYPTO1 encryption algorithm.


    Their method was very labor intensive but ultimately successful. They took the
    integrated circuit (IC) from the tag, which measures approximately 1 millimeter
    by 1 millimeter, and very carefully scraped off the outer layers of the chip,
    exposing the transistors within. Then, with the help of a microscope, they photographed
    the chip in very high detail. This process was made even more complex by the fact
    that these chips are multilayered and they had to scrape off each layer individually,
    each only a few microns thick. After they photographed all the layers, they set
    about identifying the area responsible for encryption through some detective work.
    Once they had the proper section of the chip isolated, they used some image recognition
    software to identify the function of each transistor and how it interacted with
    others. After all this, they were able to reconstruct the internal logic at work
    within the chip that handled the encryption and reconstruct the algorithm. This
    breakthrough meant that they now understood the internals of the encryption and
    they could begin looking for potential vulnerabilities.


    One of the interesting vulnerabilities they discovered was that the pseudorandom
    number generator (PRNG) in readers was stateless. Stateless meant that it did
    not keep track of its previous state between power cycles. These allowed them
    to power down and power up the reader and use the same pseudorandom number for
    multiple attempts, a big help in the encryption analysis world. It also showed
    that the random number generator on the tags was 16 bits, which means that it
    was a very small pool of random numbers and they were likely to repeat.


    The reverse engineering of the algorithm was a huge step in being able to clone
    a card. Since compatible cards are easily available (anyone can buy them), it
    was just the matter of determining the key used on a legitimate card and transferring
    that to another card.


    A few months after the presentation by Plotz and Nohl, in March 2008, a team from
    the Digital Security Group of the Radboud University Nijmegen in the Netherlands
    was able to recreate the algorithm themselves and began a cryptanalysis of the
    CRYPTO1 algorithm. It did not take them long to find several critical problems
    that led to the system being well broken. Their Youtube video caused a minor stir
    in the security world (http://www.youtube.com/watch?v=NW3RGbQTLtHE)


    One method involved attacking the reader. Using a modified proxmark3 board, they
    attempt 4096 authentications with the reader and record the results. Those results
    are fed into a 1-terabyte lookup file that contains all of the possible states
    of the algorithm, which also correspond to the keys. The attacker can simply generate'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'this file in an afternoon and use it for any MIFARE Classic system they encounter.
    The results of the queries to the reader are looked up, which reveals the key.


    Another and even simpler method of recovering the key involves no lookup table
    at all – it simply uses a weakness in the algorithm to give the attacker the state
    of part of the algorithm at the end of the transaction (even though it failed)
    and, with a little computing power, this is enough to determine the key for the
    system.


    Once a key is recovered, the attacker can now use a mobile reader configured with
    the key to surreptitiously interact with a users'' card, and since they authenticate
    properly, they can read all the information on the card. Once they have that information,
    they can write it onto another card and it will behave exactly as the cloned user.
    The Netherlands team demonstrated this with their Youtube video demonstration.
    In it, the attacker walks up with a laptop to the reader and using the proxmark3,
    collects a number of authentications and then returns to his accomplices who then
    use that data to recover the key. They then use the proxmark3 again (this time
    configured with the key) to wirelessly sniff the contents of a users'' card. They
    then take that information and write it to a whole stack of cards. Each of those
    cards now authenticates as the cloned user.


    > **NOTE**

    > The cryptanalysis and internals of the attack could be a book in and of itself
    and is glossed over here. The original paper describing these attacks is available
    at http://www.sos.cs.ru.nl/applications/rfid/2008-esarics.pdf


    Considering the number of cards deployed and that many secure facilities use this
    technology, some people were none too happy about this revelation. NXP was certainly
    not happy. The team planned to present their findings at the Esorics 2008 conference
    in Istanbul, only to be challenged in court by NXP who filed an injunction to
    prevent them from presenting their research. The courts eventually found in favor
    of the researchers and allowed the presentation to proceed.


    > **EPIC FAIL**

    > This scenario was later brought to the forefront again at the DEFCON 16 conference
    in 2008. Several students from Massachusetts Institute of Technology (MIT) were
    scheduled to deliver a talk about the Boston area subway system and several vulnerabilities
    they have found throughout, from physical to network, social engineering, and
    ticketing. The Massachusetts Bay Transit Authority (MBTA) took exception to the
    guerilla research done to their RFID payment card, named the Charlie card. The
    students had basically implemented the attack by the Netherlands group and had
    applied the attack to the MBTA readers. The MBTA filed a last-minute federal lawsuit
    against the students barring them from delivering the presentation. The Electronic
    Frontier Foundation (EFF) stepped in and was able to get the lawsuit dismissed,
    but only after the conference was over, which is what the MBTA seemed to want
    in the first place.

    > The students'' slides were posted to the Internet by the MIT student newspaper
    at http://tech.mit.edu/V128/N30/subway/Defcon_Presentation.pdf. The court documents
    are available online through the EFF at http://www.eff.org/cases/mbta-v-anderson'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# SUMMARY


    RFID is a tricky technology to secure. It is wireless, and as such, communications
    can be read at a distance and captured. Due to their small size, the options for
    encryption are limited and often rolled by the manufacturer themselves instead
    of peer-reviewed algorithms, which can lead to them being defeated with ease.


    In the end, any system based on RFID should ask the following questions from the
    beginning: "What do we do if this fails?" "If a tag is cloned, what will the effect
    be?" "Is there another layer of protection that will minimize the impact if this
    occurs?" "What is the organizational structure around the use?" "Is it possible
    to audit its use and monitor for irregularities?" All are tough questions that
    must be answered.


    RFID is a young technology, and developers and society are still adapting to what
    it all means. There is no simple solution and it is up to the integrator/user
    of the system to actively think about what the system’s authentication scheme
    means in a grand sense. Simple authentication with a card may be good at limiting
    access to the front door of a building from the general public, but perhaps not
    the crown jewels. RFID-enabled credit cards may seem convenient, but one must
    weigh the convenience of this against the possibility of a drive by skimming of
    the credit card details. In that particular case (1 factor), physically swiping
    the card and requiring a signature is a better (2 factor) and more secure solution
    to keeping your credit card safe.


    # Endnotes


    +   1. www.nxp.com/#!/pip/pip=[pfp=41863][pp=[t=epfp,is=41863]

    +   2. http://events.ccc.de/congress/2007/Fahrplan/events/2378.en.html'
  merge: -1
  img_proc: true
- pgno: 90
  md: This page intentionally left blank
  merge: -1
