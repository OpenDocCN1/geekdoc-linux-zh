- pgno: 11
  md: '# About the Authors


    **Brad "RenderMan" Haines** Contributing Author to *RFID Security* (ISBN: 978-1-59749-047-4,
    Syngress) and *Kismet Hacking* (ISBN: 978-1-59749-117-4, Syngress), is chief researcher
    of Renderlab.net and co-refounder of "The Church of WiFi" wireless thinktank.
    He currently operates his own consulting company in Edmonton, Alberta, Canada,
    providing wireless performance and security assessment services to a variety of
    clients both large and small.


    A noted expert in the hacker community in the field of wireless security, he has
    spoken at many international conferences such as Black Hat and DEFCON and taught
    several classes on free wireless assessment tools. He has also contributed over
    time to many wireless security tools such as the Kismet wireless sniffer and coWPAtty.


    # Technical Editor


    **Tim Kramer** (CISSP, CEH, GSEC, GCIH, NSA IAM/IEM) recently served as subject
    matter expert (SME) for Information Assurance (IA), Unix systems, and wireless
    technologies for Honeywell Technology Solutions and General Dynamics. Currently,
    he is providing IA and Unix support for various organizations in Portsmouth, Virginia.
    Tim''s background includes positions such as vulnerability analyst at NETWARCOM
    (Naval Network Warfare Command) and roles such as the Navy''s wireless SME, coauthor
    of Navy and Joint Forces wireless policies, and IA review of one of Electronic
    Data System''s wireless solutions.'
