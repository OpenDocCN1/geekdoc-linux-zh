- pgno: 53
  md: 'At its core, it''s a race. If the attacker can beat the remote server, since
    the response is expected and its SEQNO is in order, it''s blindly accepted as
    being the legitimate content and passed to the browser.


    When it made its debut at Defcon, it was viewed as an interesting party trick
    and there was some interest in what else could be done with it, but like many
    tools and attacks, it never seemed to go anywhere. Over time, a few updates were
    made to adjust to new technology and capabilities, but it became an oddity among
    the hacker community. It was useful to show content replacement and injection,
    but not beyond a plaything at conferences to screw with attendees'' minds by inserting
    strange or confusing images into the data in the air.


    Airpwn also showed an interesting vulnerability not normally seen. Since it was
    injecting content that was expected, software firewalls on the client system would
    happily let the rogue data pass without a second thought. Provided the injected
    data did not conform to a known virus or detectable attack pattern, it would pass
    silently through the firewall to the browser, opening many possibilities for abuse.


    # EPIC FAIL


    Airpwn has been a useful tool for driving the point home to users that there are
    risks in using insecure networks. Explaining the risks only goes so far; injecting
    alternate images or HTML into the stream and having it show up on their own screen
    dramatically shows they are at risk. This is effective since it does not do any
    permanent damage. Those performing these demonstrations need to be careful in
    choosing the time and the place to perform these demos.


    In 2008, at the SecTor (www.sector.ca) conference in Toronto, RenderMan was running
    a Wi-Fi security clinic, demonstrating various attacks and helping attendees run
    attacks on demo access points. As part of this, Airpwn was shown injecting data.
    Unfortunately, it was left running for several hours on the same channel as the
    conference network. Johnny Long of Hackers for Charity (www.hackersforcharity.org/)
    came up and asked why the network was misbehaving. Well, it seems Airpwn was injecting
    extra HTML, preventing Johnny from being able to check in for his flight home.
    Sheepishly, RenderMan had to terminate Airpwn to let Johnny finish an important
    task, confirming that there is a time and place for everything, and don''t forget
    what tools you leave running!


    # EPIC FAIL


    Fast forward to 2009 when Dragorn, the author of Kismet, the wireless sniffing
    tool, and other researchers began to look at what one could actually do with Airpwn
    and Transmission Control Protocol stream hijacking (as the attack is properly
    known). This all started with the desire to replace more than images and to have
    the ability to replace flash video streams on the fly. With the popularity and
    prevalence of YouTube and other flash-based video sites, it was only natural that
    they would be a popular target and the desire would bubble up to want to replace
    any video watched with the "RickRoll" or other suitable content.'
  merge: -1
  img_proc: true
- pgno: 54
  md: "> NOTE\n> \n> The RickRoll is an Internet meme where people try and trick others\
    \ in a bait and switch maneuver into viewing the 1987 Rick Astley music video\
    \ for \"Never Gonna Give You Up.\" Usually this is through shortened links or\
    \ redirects, and they are offered to victims as links to other content only to\
    \ have them end up at the Rick Astley video, and the inevitable joke at their\
    \ expense by the perpetrator.\n> \n> If there is one good thing about RickRolling\
    \ it's the innocuous nature and generally safe-for-work content. This prank quickly\
    \ replaced the practice of directing victims to horrific or shocking images and\
    \ generally will not run afoul of most Web content filters.\n\nOriginal testing\
    \ showed that to replace an active stream would be prohibitive as these are generally\
    \ User Datagram Protocol (connectionless) transmissions. There is no way to silence\
    \ the stream from the server to insert your own content since there's no ACK to\
    \ spoof. The client would receive both sets of packets and not know what to do.\
    \ Initially, this seemed to make it nearly impossible to accurately replace content.\
    \ At this point, inserting a RickRoll over other video streams seemed like a lost\
    \ dream.\n\nHowever, in order to get that video stream to play in the browser,\
    \ there are a whole host of other things on the page that are transferred in the\
    \ clear that can be replaced and made to help this effort. The most likely candidate\
    \ is Java Script.\n\n# Replacing Java Script\n\nMost Web pages today with any\
    \ sort of active content (Web 2.0) include Java Script to drive the page and dynamically\
    \ generate the content. Sites like YouTube drove the Web 2.0 movement but so did\
    \ many blog frameworks and other user-generated content sites, most of which involved\
    \ heavy use of Java Script.\n\nThe attack vector changed – instead of injecting\
    \ whole videos, which was prohibitive, we replace some of the Java Script on the\
    \ page, which is much smaller and easy to inject, and have it do all the hard\
    \ work for us. In one test, a popular blog \"failblog.org,\" which lists various\
    \ pictures and videos of failures of common sense, was injected with a Java Script\
    \ that sought out all links to flash video files (.flv files) and replaced the\
    \ link with that of the RickRoll video. A page containing six videos was made\
    \ to show the Rick Astley video for each. Only the embedded video was changed.\
    \ Further tests on YouTube under ideal circumstances had every video, no matter\
    \ which was viewed, play the RickRoll while the rest of the site was unchanged\
    \ from the expected video content. At best, the malicious Java Script now links\
    \ every YouTube video to the RickRoll. At worst, it replaces it with something\
    \ less innocuous.\n\nThe ability to replace videos was deemed fun, but a larger\
    \ issue started to emerge from this rather frivolous line of research. Java Script\
    \ could be appended to the end of a file rather than to replace an existing script.\
    \ All Airpwn had to do was watch the traffic stream for a </BODY> HTML tag and\
    \ the attempt to beat the next packet,"
  merge: -1
  img_proc: true
- pgno: 55
  md: 'which is likely a FIN packet closing the connection. If Airpwn beats the FIN,
    the connection can remain open indefinitely now that they have hijacked the stream
    and the attacker can inject anything else he or she wants.


    The implications of this were profound. Since the injected data is assumed by
    the browser to be legitimate traffic from the remote server, it is rendered by
    the browser. This has the advantage of giving full control over the contents of
    the page as well as interacting with the browser directly.


    Recent times have revealed a whole host of vulnerabilities in browsers. There
    are too many to enumerate here, but most vulnerability announcements follow the
    same script; if you can get the victim to visit a Web page with the malicious
    code, the code will run and bad things will happen. The most common problem with
    this vector is getting the victim to visit the malicious site. This is no longer
    a problem since now we can bring the malicious site to them, injecting the malicious
    code into whatever site they are visiting. In addition, since the forged traffic
    is "expected," firewalls will do little to stop it.


    This attack vector also opens up an interesting new vector of attack that can
    have long-term implications. In 2009, Robert Hansen (Rsnake) wrote a paper detailing
    some VPN vulnerabilities due to common internal address space usage and collisions
    of those addresses (www.sectheory.com/rfc1918-security-issues.htm). In his paper,
    he noted that one could attack the secure VPN network through the use of Java
    Script obtained from an insecure network.


    An attacker who injects malicious code via an unsecure network has control over
    how long that script is cached; an attacker can force it to be cached permanently.
    The result of this is that the next time that page is visited, the cached version
    of the script runs, not the one from the remote server. If you did this for a
    commonly visited site like Twitter.com or Google.com, the script would conceivably
    run every day, on whatever network the client was connected to, even the secure
    VPN or even the "secure" local LAN at the office. Use of the client device on
    an insecure network, even once, is enough to open a vulnerability to the secure
    network.


    This scenario has some pretty dire implications. Imagine setting up this attack
    at an airport or conference where the audience was full of employees of your target
    companies. Even if you managed to compromise just a few of them, when they go
    back to the office, they bring back the malicious code with them and it is inside
    the secure network doing your bidding. This could be everything from injecting
    a persistent iFrame into every page visited and sending an attacker the form contents,
    to acting as a stager, waiting for the right zero-day vulnerability to come out,
    then downloading and executing it automatically. Combine other attacks like Dan
    Kaminsky''s Socket/Sucket DNS rebinding attack, which turns the victim browser
    into a proxy server for the attacker to access the internal network (http://events.cc.de/congress/2007/Fahrplan/events/2393.en.html)
    and you have a formula for a very large amount of damage.


    On an even more basic level, data injection need not be limited to Web browser
    content. As had long been postulated, with early versions of Airpwn but never
    implemented, DNS can also be injected. A client sends a DNS request for mybank.com
    and the attacker can redirect the client to their own phishing site. This can
    be a'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'problem for an attacker since the range is limited and your target pool is
    small. You also have to know what site they will visit, but if you’re in a situation
    where you want everything to resolve to a certain site (perhaps with extended
    browser exploits or other malware) or if you are at a conference or some event
    where you know attendees will likely be visiting a site for schedules or such,
    this could be very damaging. The other option would be not to spread malware,
    but disinformation. Imagine targeting a conference of bankers and rewriting all
    new sites DNS requests to show a fake news story about the economy melting down.
    The ensuing panic may be useful to an attacker, or at the very least, humorous
    to someone.


    Injection attacks are limited only by the attacker’s imagination. The potential
    damage can be either overt or subtle. The ability to inject and carry malware
    back to secure networks is probably the most troubling of these subtle attacks.


    Normal methods of preventing these attacks usually come down to "use a VPN."


    The problem with that method is that many public hotspots use a captive portal,
    which you need to enter login information before the VPN tunnel can be established.
    This necessitates connecting to the access point and the captive portal over an
    unencrypted link. Even if the captive portal is SSL enabled, accessing the login
    page is usually done through DNS redirection of any page you view in the browser
    to the domain of the captive portal. This is enough of a gap to inject content
    since the initial connection can be hijacked and the redirect ignored.


    Just as Karma was integrated with Metasploit in 2008, Airpwn is integrated into
    Metasploit as of late 2009. This means that Airpwn is now surrounded by a framework
    that will make it easy to build an inject content and also to utilize existing
    exploits to attack clients. The result of this will hopefully mean increased attention
    that using public hotspots or any unencrypted network could be a significant threat
    to secure networks long after the attacker has left.


    # SUMMARY


    While all this may seem depressing, it is the inevitable cost for the convenience
    of wireless. While indispensable to modern life, wireless networks are far from
    the mature technology of wired networks. It took many years to convince people
    to even hook up a basic firewall to separate them from the Internet; it is not
    unreasonable to think that it will be a while before things improve for wireless
    security. As with most things, when systems were locked down at the access point,
    attackers just switched focus and found another weakness.


    Attention to the dangers of using open networks is the first step in solving the
    problem. Usage of restrictive security policies preventing the use of insecure
    connections, while inconvenient, will help users protect them from themselves.
    As well, moving to more robust and intelligent client managers can also help alert
    users to the dangers and keep them from doing things that are blatantly dangerous.
    The last measure that is obvious but often not done is to turn off wireless and
    just use a wire when you can. It’s a lot harder to screw up a wired connection
    than it is to screw up wireless.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'In short, the best methods for avoiding attacks on wireless clients are


    +   - Avoid using open access points at any time, particularly in public places.

    +   - If at all possible, opt for a wired connection.

    +   - If you are using a wired connection, disable your wireless adapter.

    +   - Have firewalls in place and set to only allow services that you need.

    +   - Avoid sending personal or financial information over wireless networks.

    +   - Consider a "disposable" laptop for travel, one that gets wiped and reinstalled
    before connecting back to the company network.

    +   - Always be wary that what you are connected to may not be what you think
    it is.


    # Endnote


    1. www.wigle.net/gps/gps/main/ssidstats; [retrieved 01.12.09].'
