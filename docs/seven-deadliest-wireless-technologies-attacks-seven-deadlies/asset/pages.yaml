- pgno: 91
  md: '# Analog Wireless Devices


    # INFORMATION IN THIS CHAPTER


    +   - Analog Devices

    +   - Digital versus Analog

    +   - Cordless and Wireless

    +   - Exploiting Analog Wireless

    +   - Scanner Selection

    +   - Wireless Microphones

    +   - Video Devices

    +   - Defense


    Many people are amazed by the amount of wireless devices available now. From mouse
    and keyboards to telephones, everything is being made wireless. It is common for
    people to interact with wireless devices dozens or hundreds of times a day. We
    hardly stop to think about it anymore (except when batteries fail). We often fail
    to assess the security of these everyday items because they are just that, everyday
    items.


    While most modern digital wireless devices offer some level of security in their
    operation, people often fail to realize that many of the devices they use are
    still using analog signals to transmit data and offer little to no protection
    against outside eavesdropping or interference. Even as the first decade of the
    twenty-first century closes, we continue to use devices using the same technology
    as over 100 years ago and at just about the same level of security as back then
    too.


    Most offices today have two things on every desk, a computer and a telephone.
    The computer usually requires two hands, and the phone at least one. Since humans
    have yet to adapt and grow a third limb, it is easier to adapt the phone. Out
    of convenience and comfort, most modern offices that spend any amount of time
    on the phone will often use headsets instead of awkwardly cradling the handset
    in their shoulder. Modern conveniences have done away with cords and gone wireless,
    reducing cable tangles and leaving both hands free to work the computer.'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'Many of these offices, however, never realize that their convenience is potentially
    bleeding out private, proprietary, or personal information to anyone who cares
    to listen. A penetration test was able to use these headsets to glean enough information
    to accurately impersonate a remote employee “visiting” the office. He or she is
    able to gain full access to the building, bring in accomplices under the guise
    of vendors, and even be assigned a desk with a handy network connection. He or
    she spent the next several days scanning the network for vulnerabilities all while
    consuming the free office coffee, all because of some information gleaned from
    conversations over wireless headsets.


    Often overlooked, analog wireless devices can be a very large gap in the security
    of any office and must be taken into consideration as part of any security effort.


    # ANALOG DEVICES


    A well-timed article in January 2008 on the security Web site, DarkReading.com,
    told a story that many penetration testers are all too familiar with, but it is
    just a sample of what happens every day and the problem of “we didn’t think about
    that” security.


    The article (http://darkreading.com/shared/printableArticle.jhtml?articleID=208803553)
    by Steve Stasiukonis explains a scenario he experienced on a penetration test.
    The client asked his team to test all the radio emissions from the target building,
    including Wi-Fi, Bluetooth, and anything else the author could find. This was
    of interest to them as they were keen to try new things and were very interested
    in the cordless headsets in use by many employees.


    They used a handheld radio scanner to scan through common frequencies for these
    devices and identify headsets in the target office. Once they knew the frequencies,
    they were able to eavesdrop on phone conversations and glean a large amount of
    information in a short period of time. Information they gleaned were things like
    participants in conference calls, employee names, locations, schedules, and other
    office gossip. It was not just phone calls either. Many headsets continued to
    transmit after calls were hung up, broadcasting office conversations as well.
    This information allowed him to impersonate an employee from a remote office visiting
    the target office. The plan worked frighteningly well. He was able to convince
    security that he is the employee with some dropped names of employees and a fake
    business card. He was assigned a desk and given a building access card right away
    with almost no questions asked. His new desk gave him network access and the freedom
    to sniff traffic and scan the network all day long.


    After a couple of days, he was able to book a conference room and invite a “vendor”
    (an accomplice actually) in for a meeting. This allowed them more network access
    and the ability to bring in further attackers past perimeter security. All of
    this was accomplished with just a little insider knowledge gleaned by listening
    to insecure transmissions. The amount of information they learned would have allowed
    them insider knowledge on trade secrets, stock plays, and other very private information.'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'The article caused a fair bit of interest because it was something that should
    be plainly obvious, but something very often overlooked.


    # DIGITAL VERSUS ANALOG


    Most people are used to analog communications without knowing it. We''ve used
    it for the past 100 years quite successfully. Analog transmission is where a piece
    of data, be it voice or anything else, is sent with a continuous signal that varies
    in amplitude or frequency, much like wave rolling onto the shore is a continuous
    action. Small changes in the signal are meaningful to the data being transmitted.


    Digital on the other hand is noncontinuous and uses discreet signaling to send
    data. Information is broken down into 1''s and 0''s and sent as discreet states.
    It''s as if the wave rolling onto the beach was out at sea, then the next moment
    it was on the beach, then right back out to sea.


    Analog has the advantage of more accurate representation of complex data such
    as sounds since it''s a smooth transition from high notes to low notes and accurately
    represents the changes in air pressure associated with sound. The problem with
    analog is that noise in the medium can interfere with the subtleties of the transmission
    and the received message is garbled (in the case of sound this is "static"). Digital
    transmissions break down data into a digital representation of the original encoded
    as 1''s and 0''s. It is not as accurate but is much more tolerant of noise in
    the transmission medium. This is why Morse code is so effective. It has two distinct
    and easy to recognize states: dots and dashes, effectively 0''s and 1''s.


    Most often, analog is used in short-range single channel type communications such
    as microphones and headsets since the circuitry is easier to make and the short
    range minimizes potential interference issues. The circuitry is also often cheaper
    than digital as well. Digital allows for more data to be sent in a smaller amount
    of the medium (that is, smaller bandwidth) since it only needs two distinct states
    to represent the data. This allows for more devices to operate in the same medium
    as opposed to analog.


    # Analog Security


    Analog radio is not that easy to secure. Unless you process the signal beforehand
    (encoding it or changing it to another form), it''s pretty easy for anyone to
    intercept the signal. Most people have heard stories about bored people using
    amateur radio gear to transmit their voice onto fast-food drive-through speakers.
    They overpower the employees'' signal and replace it with their own. Usually these
    pranks end up resulting in childish and crude humor laced with expletives and
    some very confused employees and angry customers.


    The most common way of securing data over analog is through methods like frequency
    hopping where the sender rapidly changes what frequency the message is being transmitted
    on and the receiver knows the order of these changes and can'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'keep up. An outside listener who doesn’t know the order only hears tiny pieces
    of the message and cannot easily reconstruct the whole message. The problem is
    how to ensure that both the sender and the receiver know the hop order and can
    stay in sync while preventing an attacker being able to determine the order and
    following along.


    The other method of securing analog communications is to preprocess the signal,
    adding audio interference or other techniques before broadcast. There are few
    systems like this in current operation. A common example is early premium cable
    channels in the 1980s which inverted and injected content into the signal which
    paying subscribers needed a “descrambler” to view. Most modern systems choose
    to simply convert the original signal to digital and encode/encrypt that before
    transmission.


    # Digital Security


    Digital security allows for a much greater number of options for security. The
    message can be encoded or encrypted before transmission much easier than analog
    systems since all that changes is the order of 1’s and 0’s. This can also be layered
    with analog methods like frequency hopping to further make eavesdropping difficult.
    Again, the difficulty is in making sure that both the sender and the receiver
    know how to encode and decode the information being sent.


    # CORDLESS AND WIRELESS


    Cordless and wireless are terms used every day by most people, yet most don’t
    stop to think about their meaning. Cordless is most often used in reference to
    some home telephones. In this case, cordless refers to the lack of a cord or wire
    between the base station and the handset. It has been replaced in this case, with
    a radio frequency (RF) transmitter. Cordless does not always have to denote a
    radio transmission however. Many people forget that there are other mediums that
    data can be transmitted over. Take the ubiquitous television remote control. It
    is a wireless device that trades cables for infrared transmission (nonvisible
    light energy) of data as opposed to RF signals. Other data transmission systems
    use lasers for line of sight data transmission.


    It is worth pointing out that there is no specific designation as to whether or
    not a device that is labeled cordless or wireless is using analog or digital signals.
    Usually the manufacturer’s datasheets, manuals, or Web sites will give some indication
    as to the transmission method in use.


    # EXPLOITING ANALOG WIRELESS


    Analog wireless devices are usually fairly simple things that do one thing. Often,
    they are used where simplicity and quality are necessary. The complexity of security
    of these devices is often not considered worth it in many contexts; however, problems
    can arise when the technology is used in places it probably shouldn’t.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Audio Vulnerabilities


    Major threats from analog wireless signals come from voice transmissions to and
    from headsets. These headsets are often used for phone calls as a replacement
    for the handset but do not always need to be. Usually situations of performances
    or presentations can also necessitate the use of wireless microphones for amplification
    purposes. Also these may be used where quality is not necessary but ease of use
    is. Rarely is any thought given to the security of things said over these devices.


    If you take an average day at the office and the phone calls made throughout,
    an amazing amount of information is passed via voice. Conversations between employees
    about what seem to be innocuous or minor things about the business could be of
    great interest to an outsider. A secretary receiving instructions from his or
    her boss to make some changes to a financial report could be terribly interesting
    to someone looking for an inside edge on the stock market.


    In order to do business, information has to flow. Given that there is this huge
    flow of information in an office environment, it makes sense that it would be
    a target for attack. On a smaller level, this is why there are offices in the
    first place, for privacy of that information flow. In more extreme cases, this
    is why there are locks on the doors and guards at the front desk, to prevent an
    attacker from entering the area and eavesdropping on that flow.


    Unfortunately the enemy of “security” is very often “convenience.” Given the amount
    of time some people spend on the telephone, it’s not unreasonable that they would
    want a more comfortable way to use it. Enter the headset market.


    Headsets (also called hands free and other names) have been around a fairly long
    time. Photos of early telephone operators show rows upon rows of employees wearing
    headphones and microphones. Given they spent a long time on the phone as that
    was their job, holding a handset up to their head was impractical. The telephone
    operators eventually went away, but the headsets were adopted by call centers,
    secretaries, and anyone involved with heavy usage of telephone. As time moved
    on and radio hardware became cheaper, cordless headsets were introduced to remove
    the clutter of cables from desks. Without realizing it, they had now made it easy
    for any interested party to listen in on conversations, well outside the range
    of locks, guards, and/or other security measures. The use of headsets, while it
    made the employees’ lives easier, it often came at the cost of security.


    Just about anyone who has ever dealt with them knows stories of baby monitors
    picking up conversations of neighbors who have similar units. Usually this is
    accompanied by idle curiosity or some voyeuristic intention to find out more about
    the people being heard. This is the basis of the vulnerability; an unencrypted
    radio does not care about who receives the signal, and anyone with a compatible
    receiver can receive these transmissions and listen in. In the case of baby monitors,
    just having a unit that operated on the same frequencies and being within range
    is enough to listen in on private conversations. The same is true of many fast-food
    restaurant drive-through ordering systems. The employee speaks over an analog
    headset to the speaker at the curbside, and a microphone replays the'
  merge: -1
  img_proc: true
- pgno: 96
  md: "order back to from the customer. The speaker at the curbside does not care\
    \ about who is transmitting on the same frequency, only which signal is the strongest.\
    \ In the case of pranksters, it's not hard to obtain a radio that is powerful\
    \ enough, and with some modifications, capable of broadcasting to drive-through\
    \ speakers. Sometimes creative, sometimes not, these pranks can be entertaining\
    \ to watch when documented.^A\n\n# SCANNER SELECTION\n\nThere are a huge amount\
    \ of scanners on the market. Some are aimed at very simple users, while others\
    \ are aimed at amateur radio enthusiasts and others for professional use. Some\
    \ of the simplest scanners are aimed at sports fans, namely NASCAR race fans,\
    \ that use them to listen to the radio transmissions between their favorite drivers\
    \ and pit crews. Others are aimed at those with voyeuristic intentions and are\
    \ typically sold as \"police scanner\" in that they focus on frequencies in use\
    \ by law enforcement. One does not even need a scanner in some cases as with the\
    \ advent of the Internet and streaming audio; scanner fans have put their scanners\
    \ online for anyone to listen to online for free.^B There is even an application\
    \ for the iPhone for listening to scanner feeds from many cities around North\
    \ America.^C While these are limited to police bands, they show the kind of information\
    \ that can be heard right out of the air.\n\n> WARNING\n> \n> When looking to\
    \ purchase a scanner, be aware that local laws may ban their possession or use\
    \ by those without special permission or a license (amateur radio). Other jurisdictions\
    \ have bans on some frequencies and others on convicted felons possessing them.\
    \ Some rules also cover handheld scanners as opposed to vehicle-mounted units.\n\
    > \n> These rules do not necessarily work to stop the criminal element that may\
    \ use them against you since they won't care about the law anyway. However, as\
    \ a law-abiding citizen wanting to test your own equipment, it is highly recommended\
    \ to familiarize yourself with all the relevant local laws before purchasing or\
    \ using a scanner or else you might find yourself on the business end of the law.\n\
    \nThe most important thing to consider in selecting a scanner is the frequency\
    \ range. A cheaper scanner for the NASCAR crowds may not be capable of the frequencies\
    \ needed to listen in on your target device (but they may be, depending on the\
    \ target), but they will probably not have the range necessary. Some research\
    \ will be needed ahead of time to determine what frequency ranges you require.\
    \ Generally speaking, the wider the range of frequencies supported, the higher\
    \ the cost."
  merge: -1
  img_proc: true
- pgno: 97
  md: 'Another consideration in selecting a scanner is the form. A large tabletop
    unit may have all the features you require, but it is not that easy to transport
    to the client site or use discreetly. Handheld scanners also deserve consideration
    for things like audio output capabilities to record signals, computer control
    capabilities, trunked radio tracking, and even battery life and external power
    options.


    Additional features can be useful to consider as well. The size of the display,
    video capabilities (discussed later), and memory functions are all important to
    consider. There is no single unit that does everything you could ever want (there
    may be, but cost may be a factor), but most times you won’t need all possible
    features, just the ones applicable to the job at hand.


    # EPIC FAIL


    Early analog cell phones were fairly easy to listen in on with commercially available
    radio scanning equipment. Their transmissions were unencrypted and could be easily
    intercepted by anyone with a suitable receiver and listened to by anyone in range
    who was curious.


    Of course, things said on a phone were often more interesting than things said
    around baby monitors leading to users asking questions about security. Regulators
    of different countries reacted quite differently to solve the problem of eavesdropping.


    In the United States, the mobile phone industry, rather than improving the technology
    and adding security (which would add cost to an industry in its infancy), instead
    decided to press the FCC to institute a ban on any scanner capable of monitoring
    analog cell phone frequencies or any device that could be modified to receive
    those frequencies. This did not actually prevent calls from being able to be eavesdropped,
    but just banned the tools to do so. After a certain date, all scanners sold in
    the United States were required to have those frequencies blocked out. Of course,
    the criminal element had no problems continuing to obtain unlocked scanners; the
    law simply prevented Joe Average from doing so. Effectively they were trying to
    jam the genie back in the bottle. This ban and lack of discussion in subsequent
    years about the realities led to many people not realizing that their cell phone
    conversations were vulnerable.


    Canada, by comparison, took a different approach. The Canadian Radio-television
    and Telecommunications Commission (CRTC) says that listening is permitted; however,
    disclosure to others of what you hear, or usage for personal gain, is punishable
    by law. This allows Canada to sell unlocked scanners. Pressure by the telecom
    industry did cause many to be sold with the cell phone frequencies blocked, but
    some were not.


    Neither country’s action prevented someone with nefarious intentions from illegally
    acquiring a capable scanner, listening in on conversations, and doing whatever
    with the acquired information.


    While the move to digital cellular phones added support for encryption technologies,
    it is still up to the providers to enable them and use them. In some circumstances,
    they may choose not to do so, as the additional overhead can mean less users per
    tower and increased costs against their bottom line. For this reason, it is worth
    investigating other security options such as encrypted phones since the continuing
    ban on equipment to monitor cellular phone frequencies is unlikely to deter against
    a determined attacker.'
