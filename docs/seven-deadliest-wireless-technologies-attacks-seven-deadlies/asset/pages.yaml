- pgno: 13
  md: '# Introduction


    # INFORMATION IN THIS CHAPTER


    +   - Book Overview and Key Learning Points

    +   - Book Audience

    +   - How This Book Is Organized


    Look around any street, business, or home. There is a world of information passing
    in front of us and through us that many people just don’t perceive. Wireless signals
    are everywhere, passing information between sources at incredible speeds just
    beyond our vision. We all use dozens of wireless devices in our daily lives, simple
    things like wireless doorbells that communicate very simple information to modern
    smart phones that have access to all the knowledge of the Internet. It’s when
    you start to realize the amount of information that is flowing freely past our
    eyes and that with the right tools, you can see that information that the need
    for security becomes apparent and the value it has to an attacker.


    If you can see this information, who else may be able to?


    This book attempts to show the implications of this brave new wireless world with
    seven major attacks against them along with how best to protect yourself and your
    private information. From Wi-Fi networks and cordless phones to RFID and good
    old analog, there is no end to the threats from wireless devices.


    # BOOK OVERVIEW AND KEY LEARNING POINTS


    Each chapter in this book covers an example of a failure of wireless technology.
    Sometimes, it is a specific and familiar technology, and others are more about
    specific concepts that cover multiple technologies. It is important to learn the
    implications of deploying wireless devices in your home or business, and each
    chapter starts with an example of a danger associated with wireless. From there,
    workings of the attack works are discussed so that you can see things from an
    attacker’s view, to help you better understand the risks and how best to mount
    a defense. From there, options for defense are discussed with associated strengths
    and possible weaknesses. Wireless security is tricky and, short of not using wireless,
    there is no one single solution to this very complex problem.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'Information is a commodity; it can be bought and sold just like any tangible
    product. Attackers are already well aware of the ease and availability at which
    wireless signals can yield valuable information for identity theft, fraud, industrial
    espionage, blackmail, and to facilitate other types of crime, both high and low
    tech.


    # BOOK AUDIENCE


    This book was written with the novice in mind, the small business IT guy who is
    trying to understand how best to secure things when his boss sends down a request
    for some new wireless piece of technology. This book is applicable to anyone in
    a technical role either as the family tech support to corporate IT managers. Since
    wireless affects us all, we all have know how to take steps to protect ourselves.
    While this book only covers seven specific issues, you will hopefully learn the
    tricks and tools needed to assess the security of the potentially millions of
    different wireless devices on the market and how they impact your security.


    This book is assuming some familiarity with basic networking and computer use.
    Knowledge of radio is not required, but certainly worth exploring on your own
    if you find this fascinating.


    # HOW THIS BOOK IS ORGANIZED


    This book contains seven chapters that address different attacks against popular
    wireless protocols and systems. Each chapter includes an example real attack scenario,
    an analysis of the attack, and methods for mitigating the attack. Common themes
    will emerge throughout the book, but each wireless technology has its own unique
    quirks that make it useful to attackers in different ways, making understanding
    all of them important to overall security as rarely is just one wireless technology
    in use at a home or office.


    # Chapter 1: 802.11 Wireless – Infrastructure Attacks


    The ubiquitous 802.11 wireless network is covered first. It’s hard to go anywhere
    without running across this type of network. It has become an invaluable resource
    for both home and office for networking and Internet access. Wireless networking
    is also incredibly valuable to attackers as it gives the attacker opportunity
    to access networks at a safe distance, almost as if they were connected to the
    wired network. Chapter 1 focuses on the infrastructure of these networks and the
    security implications of their use and how to and how to not secure them. They
    may be ubiquitous, but that doesn’t mean they are secure.


    # Chapter 2: 802.11 Wireless – Client Attacks


    Wireless clients, those devices that talk to the rest of the wireless network,
    are covered in Chapter 2. Attackers, stymied by increasing amounts of security
    on the infrastructure side, are changing tactics and attacking client devices
    directly. At home or'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'away, wireless clients and the information they contain and communicate are
    tempting targets for pranksters and thieves alike.


    # Chapter 3: Bluetooth Attacks


    Bluetooth is the subject of Chapter 3. This common protocol was meant to replace
    cable clutter but has become so much more. While it is meant for short range,
    any distance can be a comfort for an attacker. Modern devices carry a great deal
    of information, tempting for a new era of digital pick pockets. You could lose
    everything without losing anything.


    # Chapter 4: RFID Attacks


    RFID is a technology most people are not even aware of despite the billions of
    tags in use everyday. As the subject of Chapter 4, RFID is looked at with an eye
    to how its perceived benefits can actually be their greatest vulnerability and
    how they can be thwarted by those with ill intentions. RFID is all around us,
    and knowing how to identify it and how to protect it is a very important topic
    not often understood by many people.


    # Chapter 5: Analog Wireless Devices


    Even the most modern of wireless devices often at their heart are still just radios.
    Often these new devices are using age-old radio techniques to allow their communication.
    Chapter 5 will show you how to identify these devices and understand the risks
    associated with their use and how vulnerabilities apparent over 100 years ago
    are still around to make life interesting.


    # Chapter 6: Bad Encryption


    A common solution to wireless security problems is to add encryption. The common
    problem though with wireless security is bad encryption. Poor design choices,
    hardware limitations, and cost can all turn a good security idea into a failure
    at record speed. Chapter 6 looks at this problem with a number of real-world examples
    and shows how something that was supposed to protect communications can end up
    providing less security than advertised.


    # Chapter 7: Cell Phones, PDAs, and other hybrid devices


    It’s impossible to escape them, but cell phones are everywhere. Today’s modern
    smart phones and other hand-held gizmo’s are at their heart, computers in their
    own right and have their own unique security issues that need to be considered.
    Chapter 7 will look at these new generation devices and how their small size,
    portability, and communication capacity make them interesting and tempting targets
    for today and the future.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# CONCLUSION


    Wireless devices are here to stay, and anyone involved in IT or just life in general
    will end up interacting with wireless devices almost everyday. They are highly
    unlikely to go away and are more than likely to become more pervasive and more
    complex as time progresses. A firm understanding of the risks involved with deploying
    and using wireless devices in your life will help you protect against attacks
    and allow for all the benefits of the wireless world while minimizing the risk.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# 802.11 Wireless –

    Infrastructure Attacks


    # INFORMATION IN THIS CHAPTER


    +   - How Wireless Networks Work

    +   - Case Study: TJX Corporation

    +   - Understanding WEP Cracking

    +   - How to Crack WEP

    +   - It Gets Better and Worse

    +   - WPA and WPA2 in a Nutshell

    +   - How to Crack WPA PSK and WPA2 PSK


    Wireless is a term thrown about quite a bit lately. Everything seems to be wireless
    to one degree or another, even some things no one ever expected to be, like refrigerators
    and other appliances. Most often, when the term wireless is used in regards to
    computing, it’s to do with 802.11 networks.


    Just about every new laptop that hits the market today has an 802.11 network card
    built in. It’s a technology that has become ubiquitous in our lives, and we can
    hardly remember a time when it wasn’t part of our days. It’s a technology that
    has grown in terms of speed and range to provide the capability to be connected
    to the Internet from anywhere in our homes or businesses.


    This widespread technology would also very quickly become quite an issue from
    a security perspective. Users quickly demanded to “cut the cable” and be able
    to access the network from anywhere in the office. Home users were quick to adopt
    the technology to work from the kitchen, the couch, or (more oddly) the bathroom.
    This intense push led to a lot of overworked and underpaid information technology
    (IT) administrators and neighborhood computer know-it-alls to install wireless
    networks without properly understanding the security risks involved. These early
    networks would continue to “just work” with users not realizing that the security
    arms race caught up with them and even passed them, making them prime targets
    for attack.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'In November 2003, Toronto, Ontario, police held a press conference to announce
    a (at the time) new and unusual crime.ᴬ The police report indicates that at around
    5:00 a.m. an officer noticed a car slowly driving the wrong way down a one-way
    street in a residential neighborhood. The officer pulled the car over, and when
    he walked up to the driver, he was greeted with several disturbing sights. The
    driver was first of all not wearing any pants, which is probably disturbing in
    and of itself, but more alarmingly, on the passenger seat was a laptop clearly
    displaying child pornography. The driver had been using open wireless networks
    in the area to obtain Internet access to download child pornography, unbeknownst
    to the owners of those networks. The owners were victims themselves, twice. First,
    they were victims of theft of service since their communications had to compete
    for bandwidth with the traffic of the unauthorized user. Second, they were victimized
    because, for all intents and purposes, the child pornography was being downloaded
    through their connection. Any digital trail left would lead back to them, potentially
    exposing them to false accusations of downloading child pornography themselves
    and all the emotional and financial damage that accusation can bring. The suspect''s
    home was searched as a result, and 10 computers and over 1,000 CDs worth of illegal
    material were seized.ᴮ


    This case, along with others through the years, has shown that operating an access
    point (AP) without any authentication of client devices is dangerous. If anyone
    can connect, there is no restriction on what sort of activities those users can
    partake in. Often, it''s simply to check an e-mail or catch up on the latest news,
    but it may be someone downloading copyrighted materials, sending threatening messages,
    or doing worse.


    Sometimes, connecting to an open network without authorization can occur even
    without someone realizing he or she is doing it. Windows XP, before Service pack
    2, was notorious for automatically connecting to networks named the same as ones
    it had connected to before. A person carrying a laptop down the street configured
    for a common network name like "linksys" could drift to any network similarly
    named "linksys" and be committing an unauthorized access without knowing or interacting.
    Many users noticed this behavior and thought it more than helpful in gaining access
    to free Wi-Fi. Attackers noticed this and began to exploit it (more on that in
    Chapter 2, 802.11 Wireless – Client Attacks).


    It''s sad to consider that leaving your APs open for anyone to connect to is a
    dangerous proposition. The idea of everyone sharing free Internet access anywhere
    he or she goes is a tempting one, but society, as a cross section, contains all
    sorts of people, some good and some bad, and often the bad ruin such freedoms
    for everyone.


    The Institute of Electrical and Electronics Engineers (IEEE) knew that they had
    to establish some mechanism to maintain privacy of communications as they were
    broadcast and restrict who can connect and from where. This is why all APs sold
    contain various methods of securing communications and limiting who can connect.


    ᴬ www.ctv.ca/servl/ArticleNews/story/CTVNews/1069439746264_64848946?hub=CTVNewsAt


    ᴮ See http://citeseerx.ist.psu.edu/viewdoc/summary?doi=10.1.1.116.850 and click
    on the PDF icon underneath the cached link on the upper-right side of the page.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'Originally, Wired Equivalent Privacy (WEP) was the only option available, but
    as time went on, Wi-Fi Protected Access (WPA) was introduced as an interim solution
    when WEP was shown to be weak, and eventually WPA2 was brought forth with the
    final ratification of 802.11i.


    As with many security technologies, if you give users the option of using it,
    they often won’t. If you give them too many options, there’s no way of guaranteeing
    that they will keep their systems up to date either.


    # HOW WIRELESS NETWORKS WORK


    A wireless network typically is made up of two classes of device: APs and client
    devices, typically called stations (STAs). This chapter focuses on security of
    APs typically found in a home or business. Client security is discussed in Chapter
    2, 802.11 Wireless – Client Attacks. These networks can be 802.11a, b, g, or n,
    but for the most part, and for discussion purposes in this chapter, it doesn’t
    matter. The infrastructure needed is fairly universal, and standards for security
    are pretty much the same for all of them.


    The APs are something everyone in the IT industry and most home computer users
    are probably familiar with. They come in all shapes and sizes and can have varying
    features. They are the gateways between the wired and wireless network. If you
    don’t have one at home already, you can usually see them bolted to the wall at
    many businesses or in public spaces with one or more antennas sticking out of
    them. The AP is what the client STA connects to in a wireless network (as opposed
    to the other way around). In their default state, most APs will accept connections
    from any client STA that asks to join the network. While this is convenient for
    users, it is also very convenient for anyone else who wants to connect, for good
    reasons or bad.


    In the early days of wireless, this was seen as something positive. Wireless brought
    out ideas of a brave new world with free Internet access and sharing of a new
    and useful resource. It didn’t take long for the bad guys to figure out that this
    was very useful for them as well.


    # NOTE


    It’s hard to imagine a world without wireless networking. It’s absolutely everywhere.
    Since 2001, Wigle.net, an online repository of data submitted by users, has collected
    tens of millions of unique network locations with Global Positioning System (GPS)
    coordinates and over a billion points of observations of those networks. The site
    also includes some automatically generated maps of that data that can pretty conclusively
    show where whenever there are people and computers, there are wireless networks.
    Figure 1.1 shows Wigle.net’s map of North America.


    While this sort of activity may seem odd, companies like Skyhook Wireless (www.skyhookwireless.com)
    has made a business out of wardriving themselves. They map the location of networks
    throughout the world and use that information to provide GPS-like location sensing
    via triangulation of known APs as opposed to satellites, which has the added benefit
    of working indoors in many cases, unlike GPS.'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'As you can see, there are wireless networks everywhere. Wherever there is a
    population center, you will be able to find wireless networks there.


    ![](img/fa764b70be0fdcb44b75286d4f8589e2_20_0.png)


    # FIGURE 1.1


    Wigle.net''s Map of North America


    Wireless is a shared medium. If you remember the bad old days where Ethernet networks
    were all using hubs and not switches, everyone saw everyone else’s traffic. Well,
    wireless brings all the fun of those networks back. In those days, hubs were simple
    rebroadcasters, and they had no real intelligence as to what was connected to
    each port. A client would put a packet onto the wire and the hub would rebroadcast
    that packet to every other computer on the hub. The intended recipient accepts
    the packet, whereas the other simply ignores it. As you can imagine, have many
    clients on the network trying to communicate simultaneously and it gets pretty
    noisy. Network adapters normally filter out packets that come down the wire that
    are not intended for their address. If you disable that filter, you can now listen
    to all the packets, even the ones not intended for that network card. This is
    usually called *promiscuous mode* and has been a fundamental tool of network diagnosis
    since the beginning of networks.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'In a wireless network, promiscuous mode does the same thing if you are associated
    to a network. If you want to listen to other networks without associating or get
    the management traffic at Layers 1 and 2, then you need to remove the filters
    from Layers 1 and 2 and the logical separation of networks. This is where monitor
    mode comes in. Monitor mode is useful as it allows the card to listen to any wireless
    data, from any network on the same channel in range.


    An 802.11 network typically sends out advertising “beacon” frames to announce
    its presence. These frames contain the network BSSID (Media Access Control [MAC]
    address), ESSID (commonly known as SSID, the logical name for the network), and
    various flags about its capabilities (speed, encryption level, and so on). All
    this information is sent in clear text. Since it’s a shared medium, anyone can
    pick up these beacons and this basic information. This is the essence of wardriving.


    Much has been written about wardriving, but the best definition was coined on
    the netstumbler.org forums by a poster named blackwave:


    > Wardriving (v.) – The benign act of locating and logging wireless access points
    while in motion.¹


    Essentially, it is using a wireless-enabled device to search for others. This
    can be as simple as the Wireless Zero Config utility in Windows searching for
    a network to programs like Kismet, a full wireless detector and sniffer. Integrating
    a GPS into the system, and coordinates of those networks can be used to generate
    maps of local areas for reports, or submitted to sites like wigle.net to add to
    a larger community data pool.


    # CASE STUDY: TJX CORPORATION


    In April 2007, U.S. retail giant TJX, owners of TJ Maxx, Marshalls, and other
    retail store brands, publicly admitted in their annual Security and Exchange Commission
    filings that their network security had been breached and that customer credit
    card numbers and other information had been available to criminals roaming the
    network for over a year. The fallout for the company is expected to top 1 billion
    dollars over 5 years and caused headaches for millions of consumers now open to
    identity theft and credit card fraud, as well as credit card companies and financial
    institutions having to pay millions to replace consumers, credit cards. In May
    2008, authorities arrested Albert Gonzalez in Miami, Florida, related to another
    large-scale identity theft. He was eventually charged as the ringleader in the
    TJX attacks and several other large corporate penetrations, and on August 28,
    2009, Gonzalez agreed to a plea bargain and stands to serve 15 to 25 years for
    his role. There are several other outstanding charges related to similar attacks
    on other corporations that, at the time of this writing, are still waiting to
    work their way through the courts.'
