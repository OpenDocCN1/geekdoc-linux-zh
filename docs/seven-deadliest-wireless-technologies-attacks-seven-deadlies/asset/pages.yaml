  md: 'highest signal strength, and there was a good chance that there was an open
    linksys access point around and clients would suddenly find themselves connected
    to a different network than they intended.


    > **NOTE**

    > The SSID is what most people call the Extended Service Set Identifier or ESSID.
    It is the logical name of the network as seen by users. The Basic Service Set
    Identifier or BSSID is typically referred to as the MAC address since it is the
    same as the MAC address for the wireless access point.


    Hotspotter listens on a wireless interface in master mode. When it hears probe
    requests from a client, it checks a list of common commercial hotspot names and
    if it finds a match, it configures itself as an access point being sought, and
    the client (often) will automatically connect. From there, it is up to the attacker
    to have Hotspotter trigger a DHCP daemon, port scan – whatever he or she wants
    to do.


    Again, this behavior could only emulate one target at a time. If you were attacking
    a large group, such as you would find at a conference, then you would want to
    be able to configure for multiple-probed SSIDs, and not just a predetermined list.


    In 2004, Dino Dai Zovi and Shane Macaulay wrote and distributed a program called
    Karma. This software was what attackers had been seeking for a while. Karma operated
    similar to Hotspotter in listening to probe broadcasts from clients and replying.
    The difference, however, was their patches to the Madwifi driver used under Linux
    that allowed the dynamic creation of replies to probes on the fly. This meant
    that if a dozen clients were all probing for different networks, Karma would be
    able to dynamically reply to those probes and association requests for any SSID.


    The conversation simply became the following:

    Client 1: "I''m looking for mycorpnet. Are you mycorpnet?"

    Karma: "Sure, I''m mycorpnet, come on in."

    Client 2: "Are you supersecretinjanetwork? I am looking for supersecretninja-network."

    Karma: "Why not? I''m supersecretinjanetwork too, connect to me!"

    and on, and on, and ...


    Karma also came along with a suite of tools to emulate common services. If the
    connected client had an e-mail client running, it would probably try and connect
    when the network connection was established. Karma would see the pop3 request
    and record the login username and password. Without a second card providing a
    back haul to the Internet, the request won''t go through but now the attacker
    has your password and server address. Same goes for DNS requests being redirected,
    Web page requests, and other common services. Quite simply, the attacker has established'
