- pgno: 59
  md: '# Bluetooth Attacks


    # INFORMATION IN THIS CHAPTER


    +   - Bluetooth Technology

    +   - Hacking Bluetooth

    +   - Connecting

    +   - Wholesale Sniffing

    +   - Bluetooth Viruses


    Bluetooth is one of those technologies that have become so common that it has
    become a part of our daily lives. It has become a solution to problems like driving
    and talking on a cell phone and introduced new and interesting marketing opportunities
    for attacks.


    An interesting scam emerged that combined a Bluetooth attack with some creative
    usage of premium rate services. Its effectiveness has diminished recently, but
    the effects are interesting.


    Imagine a commuter is traveling home by train every night. As he or she walks
    through the train station, he or she is concerned about getting home in time for
    dinner, not about getting scammed via the phone in his or her pocket. An attacker
    is sitting near the waiting area, scanning the air for advertising Bluetooth devices.
    He or she spots the phone in our commuter’s pocket and due to poor security choices
    is able to connect to it with a common or default PIN code. From there, the attacker
    instructs the phone to silently call out to a number, which stays connected until
    the commuter notices the phone call and dismisses it as accidental or the call
    is interrupted from a dead battery or service interruption. The attacker makes
    his or her money 1 month later when the commuter’s cell phone bill arrives. The
    number called was a premium rate line owned by the attacker that charges a high
    cost per minute ($3.99 or some such number). The victim’s phone called the number
    and incurred charges by the such number.'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'minute on his or her way home for the night. Over a 45-min train ride, that
    charge can grow to hundreds of dollars that goes into the attacker’s pocket.


    # BLUETOOTH TECHNOLOGY


    The need for Bluetooth was originally as a way to clean up our desks and decable
    our lives by being an alternative to the common RS232 cables that were needed
    to connect many devices to our computers. The ability to connect one device to
    several others simultaneously along with the ability to autoreconnect was a very
    exciting prospect for consumers tired of having to deal with many different cables
    for every device they owned. A single wireless method was needed to clean up the
    clutter.


    Bluetooth is not actually one protocol, but it is actually a suite of protocols
    and functions wrapped up in a stack. Bluetooth operates in the 2.4 GHz ISM band
    along the same as 802.11b/g/n Wi-Fi; however, due to low transmit power and range,
    there is relatively little meaningful interference.


    Bluetooth devices come in three classes. Each one is meant for specific applications
    and situations, but they are all the same in terms of compatibility. Most after-market
    Bluetooth adapters you can buy are Class 1 or 2. Class 3 is reserved for small
    devices like keyboards and a mouse that are sure to be near the computer they
    are connected to. Table 3.1 shows the relative power and range of each class.


    Bluetooth has also undergone some revisions and multiple versions of the protocol
    exist. Bluetooth 1.2 and 2.0 + Enhanced Data Rate (EDR) are the most common in
    the marketplace, and you are unlikely to run into any of the 1.0, 1.0B, or 1.1
    devices except perhaps on some legacy and early devices.


    Bluetooth 1.2 supports approximately 725 Kbps throughput, which is enough for
    things like mouse, keyboards, printers, headsets, and so on. Revisions to the
    standards culminating in Bluetooth 2.0 included EDR, which bumps the maximum throughput
    to 3 Mbps on compatible devices for larger data such as photos or music files.


    Recently, the Bluetooth Special Interest Group (SIG) adopted the core specifications
    for Bluetooth 3.0. This specification works with the 802.11 radios in many products
    for a maximum throughput of 24 Mbps. Actual products based on the specification
    should arrive on the market in the beginning of 2010.


    Table 3.1 Bluetooth adapter classes


    | Class | Transmit power | Effective range | Typically found |

    |---|---|---|---|

    | Class 1 | 100 mW | 100 m | External USB adapters with external antenna |

    | Class 2 | 2.5 mW | 10 m | Internal laptop adapters |

    | Class 3 | 1 mW | 1 m | Cell phones, headsets, keyboards |'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# EPIC FAIL


    While Bluetooth-enabled phones are now commonplace throughout Europe, the adoption
    rate has been slower in North America. Early on, many North Americans were unaware
    of all the capabilities a Bluetooth-enabled phone offered since they have never
    actually had one with all the features. While not indicative of all models sold,
    many North American cellular providers selling Bluetooth phones were selling ones
    that had features disabled. Things like OBEX data transfer are disabled in the
    firmware and unavailable. The official reasoning was as a security precaution
    due to the issues described in this chapter, and some argue though that it is
    meant to preserve a revenue stream.


    Most phones now have a camera built-in and the capability to use custom ring tones.
    These features are a great source of income for cellular providers. If you take
    a picture with your phone, you have to transfer it off if you want to upload it
    to the Web or share it with others. This requires an expensive data cable (sold
    by the provider), expensive removable media (if available on the phone, and sold
    by the provider), or uploading over the cell network via MMS or data, which costs
    airtime or additional charges.


    The ability to pair a Bluetooth phone to a computer and download pictures or upload
    ring tones without additional charge or even wirelessly tether is quite appealing
    to the consumer. When so many computers come with Bluetooth capability, the user
    has everything he or she needs to transfer data without additional charge. This
    is why many cell phones are not capable of more than operating a Bluetooth headset
    or as a virtual dial-up modem.


    In 2004, Verizon released the Motorola V710 phone. It was advertised as Bluetooth
    capable but controversy arose over the fact that Verizon failed to mention that
    most of the Bluetooth profiles were disabled via firmware, and the phone was not
    quite as advertised. A class action lawsuit was launched and eventually settled
    in September 2005.


    The moral of that is if you are buying a Bluetooth-enabled phone, make sure to
    check to see if all profiles are available if you want them.


    Bluetooth devices are connected through a process called pairing. The pairing
    process usually involves one device searching for other devices in the area and
    then selecting the device to partner with based on its BD_ADDR (similar to a computer
    Media Access Control [MAC] address) or a logical name. Once pairing is completed,
    the devices are now considered "bonded."


    Depending on the action being taken, a PIN for the device being connected will
    be required to complete the process. The PIN acts as a password in an encryption
    scheme between the two devices and is used to generate a link key. This key is
    used to secure communications between the devices and also to authenticate devices
    in the future. Should a device want to reconnect in the future, the devices check
    if each other''s BD_ADDR is already bonded, and if it is, they assume that both
    have the link key still stored and will immediately begin communicating. This
    skips the PIN entry process and allows for automatic reconnection when in range.
    If one or both of the devices have forgotten the link key, the pairing process
    is restarted, and the PIN is required to be entered again.


    Even before they are connected, devices communicate their capabilities to each
    other. Just as not every host on the Internet is a Web server or a Secure Shell
    (SSH) server, not every Bluetooth device talks on every service available. Through
    a protocol called Service Discovery Protocol (SDP), the devices announce to each
    other'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'what services they support. A computer may support all possible profiles such
    as networking, file transfer, and others, whereas smaller devices only support
    a few or a single profile. A headset, for example, does not support networking
    and only has the audio profile available. This announcement of profiles allows
    devices to filter by capabilities, such as a phone looking only for headsets or
    a computer looking for a printer rather than being flooded with unnecessary devices.


    Most often, the process is fairly painless to the end user. Some profiles can
    operate without encryption, say if you want to send over contact information from
    one phone to another without complicating matters with PIN numbers. Those that
    require encryption only require simple PIN numbers to complete the process. The
    addition of remembering bonded devices and automatic reconnect makes it even easier.


    # HACKING BLUETOOTH


    With the widespread adoption and convenience of Bluetooth device comes the inevitable
    implementation problems that cause unexpected things to happen.


    Most Bluetooth-based attacks are based on a simple and common flaw. Users often
    are very poor at reading documentation, at understanding risks and threats, and
    generally at changing defaults. Most attacks revolve around users not changing
    the default settings on their devices. That, coupled with poor user interface
    (UI) design, creates situations where users are unaware something bad is happening
    or about to happen. As well, documentation until recently did not fully explain
    the risks of certain actions.


    # Bluetooth Discovery


    As with most attacks, the first thing to do is to find a target. Most often, Bluetooth
    attacks are against targets of opportunity (that is, not targeted). In the case
    of Bluetooth, its design assumes that devices interact with one another occasionally
    (that is the whole point of the technology). The need for these devices to find
    one another easily is a requirement of this. This allows legitimate users to find
    the device they are seeking, but also allows a nearby attacker to find those same
    devices and silently interrogate them to find out if they are suitable for attack.


    The Bluetooth discovery process involves both parties in the pairing process.
    A device seeking to connect sends out a broadcast to the immediate area. Devices
    in the area, if they are set to be discoverable, then respond with the BD_ADDR
    of the device. From there, the querying device can use the SDP to discover all
    the profiles (that is, services) the device is offering (and vice versa). Simply
    put, a cell phone sends out a query, the headset responds saying it supports the
    hands-free profile, and the cell phone now knows to treat this remote device as
    a headset and not a dial-up adapter or some other profile.


    Most cell phones, PDAs, or other Bluetooth devices have the capability to scan
    for discoverable devices. Even with this very simple interface, you can glean
    some'
  merge: -1
  img_proc: true
