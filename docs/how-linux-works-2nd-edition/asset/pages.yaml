    target4=0:0:4:0:3/block/sde

    DEVTYPE=disk

    DISK MEDIA_CHANGE=1

    MAJOR=8

    MINOR=64

    SEQNUM=2752

    SUBSYSTEM=block

    UDEV_LOG=3

    ```


    You can see that there is a change to a device. After receiving the uevent, udev
    knows the sys device path and a number of other attributes associated with the
    properties, and it is now ready to start processing rules.

    The rules are in the files /lib/udev/rules.d and /etc/udev/rules.d directories.
    The rules in /lib are the defaults, and rules in /etc are overridden. A full explanation
