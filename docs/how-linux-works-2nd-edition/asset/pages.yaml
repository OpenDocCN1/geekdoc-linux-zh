  md: '# 5


    # # HOW THE LINUX KERNEL BOOTS


    ![](img/1b61c74a588aedf0032126b8bd0e7422_117_0.png)


    You now know the physical and logical structure of a Linux system, what the kernel
    is, and how to work with processes. This chapter will teach you how the kernel
    starts—or other words, you''ll learn how the kernel moves into memory up to the
    point where the first user process starts.


    A simplified view of the boot process looks like this:


    +   1. The machine''s BIOS or boot firmware loads and runs a boot loader.

    2. The boot loader finds the kernel image on disk, loads it into memory, and starts
    it.

    3. The kernel initializes the devices and its drivers.

    4. The kernel mounts the root filesystem.

    5. The kernel starts a program *init* with a process ID of 1. This point is the
    *user space start.*'
  merge: -1
  pgno: 117
- img_proc: true
  md: '+   6. init sets the rest of the system processes in motion.


    +   7. At some point, init starts a process allowing you to log in, usually at
    the end or near the end of the boot.


    This chapter covers the first four stages, focusing on the kernel and boot loaders.
    Chapter 6 continues with the user space start.


    Your ability to identify each stage of the boot process will prove invaluable
    in fixing boot problems and understanding the system as a whole. However, the
    default behavior in most Linux distributions often makes it difficult, if not
    impossible, to identify the first few stages as they proceed, you''ll probably
    be able to get a good look after they''ve completed and you log in.


    # 5.1 Startup Mesages


    Traditional Unix systems produce many diagnostic messages upon boot that tell
    you about the boot process. The messages come first from the kernel and then from
    processes and initialization procedures that init. However, these messages aren''t
    pretty or consistent, and in some cases they aren''t even informative. Most kernel
    Linux distributions do their best to hide them with splash screens, filler, and
    boot options. Hardware improvements have caused the kernel to start much faster
    than before; the messages flash by so quickly, it can be difficult to see what
    is happening.


    There are two ways to view the kernel''s boot and runtime diagnostic messages:
    You can


    +   Look at the kernel system log. You''ll find this in /var/log/kernel.log, but
    depending on how your system is configured, it might also be lumped together with
    a lot of other system logs in /var/log/messages or elsewhere.


    +   Use the dmes command, but pipe the output to less because there will be much
    more than a screen''s worth. The dmes command uses the kernel ring buffer, which
    is limited of size, but most recent kernels have enough buffer to hold messages
    for a long time.


    Here''s a sample of what you can expect to see from the dmes command:


    ```

    $ dmes

    [ 000000] Initializing cgroup subsys cpu

    [ 000000] Linux version 3.2.0-67-generic-pa (buildd=toyol) (gcc version 4.3 (Ubuntu/Linaro
    4.6.3-1ubuntu5)) #101-Ubuntu SMP Tue Jun 15 18:05:44 UTC 2014 (Ubuntu 3.2.0-67.101-generic-pa
    3.2.0)

    [ 000000] Kernel supported pcs:

    --init---

    [2.98648] sro: 2x/8x writer drive-cd scsi-mc driver cd/rw ia-port cdda c2

    [2.986153] cdrom: Uniform CD-ROM driver Revision: 3.20

