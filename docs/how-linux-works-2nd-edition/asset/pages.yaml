- img_proc: true
  md: '# 6.7 Shutting Down Your System


    init controls how the system shuts down and reboots. The commands to shut down
    the system are the same regardless of which version of init you run. The proper
    way to shut down a Linux machine is to use the shutdown command.


    There are two basic ways to shutdown. If you halt the system, it shuts the machine
    down and keeps it down. To make the machine halt immediately, run this:


    ```

    shutdown -h now

    ```


    On most machines and versions of Linux, a halt cuts the power to the machine.
    You can also reboot the machine. For a reboot, use -r instead of -h.


    In the preceding example, now is the time to shut down. This argument is mandatory,
    but there are many ways to specify the time. For example, if you want the machine
    to shut down sometime in the future, you can use +n, where n is the number of
    minutes shutdown should wait before doing its work. (For other options, see the
    shutdown (8) manual page.)


    To make the system reboot in 10 minutes, enter:


    ```

    shutdown -r +10

    ```


    On Linux, shutdown notifies anyone logged on that the machine is going down, but
    it does little real work. If you specify a time other than now, the shutdown command
    creates a file called /etc/nologin. When this file is present, the system prohibits
    logins by anyone except the superuser.


    When shutdown time finally arrives, shutdown tells init to begin the shutdown
    process. On systemd, it activating the shutdown units; On Upstart, it emitting
    the shutdown events; and On V init, it changes the runlevel to 0 or 6. Regardless
    of the init implementation or configuration, the procedure generally goes like
    this:


    +   1. init asks every process to shut down.

    2. If a process doesn''t respond after a while, init kills it, first trying a
    TERM signal.

    3. If the TERM signal doesn''t work, init uses the KILL signal on any stragglers.

    4. The system locks system files into place and makes other preparations for shutdown.

    5. The system unmounts all filesystems other than the root.

    6. The system remounts the root filesystem read-only.'
  merge: -1
  pgno: 168
- img_proc: true
  md: '7. The system writes all buffered data out to the filesystem with the sync
    program.

    8. The final step is to tell the kernel to reboot or stop with the reboot(2) system
    call. This can be done by init or an auxiliary program such as reboot, halt, or
    poweroff.


    The reboot and halt programs behave differently depending on how they''re called,
    which may cause confusion. By default, these programs call shutdown with the -r
    or -h options. However, if the system is already at a halt or reboot, the programs
    tell the kernel to shut itself off immediately. If you really want to shut your
    machine down in a hurry, regardless of any potential damage from a disorderly
    shutdown, use the -f (force) option.


    # 6.8 The Initial RAM Filesystem


    The Linux boot process is, for the most part, fairly straightforward. However,
    one component has always been somewhat confounding: initramfs, the initial RAM
    filesystem. Think of this as a user-space wedge that in front of the normal user
    mode start. But first, let''s talk about why it exists.


    The problem stems from the availability of many kinds of hardware. Remember, the
    Linux kernel does not talk to the PC BIOS or EFI interfaces to get data from disks,
    so in order to mount its root file system, it needs driver support for the underlying
    storage mechanism. For example, if the root is on a RAID array connected to a
    third-party controller, the kernel needs the driver for that controller first.
    Unfortunately, there are so many storage controller drivers that distributions
    can''t include all of them in their kernels, so if the kernel doesn''t have a
    filesystem mounted in the first place, it can''t load the driver that it needs.


    The workaround is to gather a small collection of driver modules along a few other
    utilities into an archive. The boot loader loads this archive into memory before
    running the kernel. Upon start, the kernel reads the contents of the archive into
    a temporary RAM filesystem (initramfs), mounts it at /, and performs the user-mode
    handshake to the init. The utils included in the initramfs allow the kernel to
    load the necessary driver modules for the real root filesystem. Finally, the utils
    mount the real root filesystem and start init.


    Implementations vary and are ever evolving. On some distributions, the init on
    the initramfs is a fairly simple script that starts a udev to load drivers, then
    mounts the real root and executes the init there. On distributions that use systemd,
    you''ll typically see an entire system installation with no unit configuration
    files and just a few udev configuration files.'
  merge: -1
  pgno: 169
- img_proc: true
  md: 'One basic characteristic of the initial RAM filesystem that has (so far) remained
    unchanged since its inception is the ability to bypass it if you don''t need it.
    That is, if your kernel has all the drivers it needs to mount your root filesystem,
    you can omit the initial RAM filesystem in your boot loader configuration. When
    successful, eliminating the initial RAM systems boot time, usually by a couple
    of seconds. Try it at boot time by using the GRUB menu editor to remove the initrd.
    (It''s best not to experiment by changing the GRUB configuration file, as you
    can make a mistake that will be difficult to repair.) Recently, it has been a
    little more difficult to bypass the initial RAM filesystem because features such
    as mount-by-UUID may not be available with generic distribution kernels.


    It''s easy to see the contents of the initial RAM filesystem because, on most
    modern systems, they are simple gzip-compressed cpio archives (the cpio(1) manual
    page). First find the archive by looking at your boot loader configuration (for
    example, grep for initrd lines in your grub.cfg configuration file). Then use
    cpio to dump the contents of the archive into a temporary directory somewhere
    and peruse the results. For example:


    ```

    $ mkdir /tmp/myinitrd

    $ cd /tmp/myinitrd

    $ zcat /boot/initrd.img-3.2.0-34 | cpio -i --absolute-filenames

    --sparse

    ```


    One particular piece of interest is the "pivot" near the very end of the init
    process the contents of the initial RAM filesystem. This part is responsible for
    removing the contents of the temporary filesystem (to save memory) and permanently
    switching to the root root.


    You won''t typically create your own initial RAM filesystem, as this is painstaking
    process. There are a number of utilities for creating initial RAM filesystem images,
    and your distribution likely comes with one. Two of the most common are dracut
    and mkinitramfs.


    > The initial RAM filesystem (initramfs) refers to the implementation that uses
    the cpio archive as the source of the temporary filesystem. There is an older
    version called the initial RAM disk, or initrd, that uses a disk image as the
    base of the temporary filesystem. This has fallen into disuse because it''s much
    easier to maintain a cpio archive. However, you''ll often see the term initrd
    used to refer to a cpio-based initial RAM filesystem. Often, as in the preceding
    example, the filenames and configuration files will still contain initrd.


    # 6.9 Emergency Booting and Single-User Mode


    When something goes wrong with the system, the first recourse is usually to boot
    the system with a distribution''s “live” image (most distributions'' installation
    images as live images) or with a dedicated rescue image'
