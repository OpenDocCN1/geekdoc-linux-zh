  md: '# 8.13 Further Topics


    One reason there are so many tools to measure resource utilization is that a wide
    range of resource types are consumed in many different ways. In this chapter,
    you''ve seen CPU, memory, and I/O as system resources being consumed by processes,
    threads inside processes, and the kernel.


    The other reason that the tools exists is that the resources are limited and,
    for some, users shared must strive to consume fewer resources. In the past, many
    users shared a machine, so it was necessary to make sure each user had a fair
    share of resources. Now, although a modern desktop computer may not have multiple
    users, it still has processes competing for resources. Likewise, high-performance
    network servers require intense system monitoring.


    Further topics in resource monitoring and performance analysis include the following:


    **sar (System Activity Reporter)** The sar package has the continuous monitoring
    capabilities of vmstat, but it also records resource utilization over time. With
    sar, you can look back at a particular time to see what your system was doing.
    This is handy when you have a system event that you want to analyze.


    **act (Process accounting)** The act package can record the processes and their
    resource utilization.


    **Quotas** You can limit system resources on a per-process or per-user base. See
    /etc/limits.conf for some of the CPU and memory options; there''s also a limits.conf(5)
    manual page. This is a PAM feature, so processes are subject to this if they''ve
    been started from something that uses PAM (such as a login shell). You can also
    limit the amount of disk space that a user can use with the quota system.


    If you''re interested in systems tuning and performance in particular, **Systems
    Performance: Enterprise and the Cloud** by Brendan Gregg (Prentice Hall, 2013)
    goes into much more detail.


    We also haven''t touched on the many, many tools that can be used to monitor network
    resource utilization. To use those, you first have to understand how the network
    works. That''s where we''re headed next.'
  merge: -1
