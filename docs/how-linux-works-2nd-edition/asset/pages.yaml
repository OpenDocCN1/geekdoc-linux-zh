  md: 'For example, to find the libraries required for OpenSSL, you can run this command:


    ```

    $ pkg-config --libs openssl

    ```


    The output should be something like this:


    ```

    -lssl -lcrypto

    ```


    To see all libraries that pkg-config knows about, run this command:


    ```

    $ pkg-config --list-all

    ```


    # How pkg-config Works


    If you look behind the scenes, you will find that pkg-config finds package information
    by reading configuration files that end with .pc. For example, there is OpenSSL.pc
    for the OpenSSL socket library, as seen on an Ubuntu system (located in /usr/lib/i386-linux-gnu/pkgconfig):


    ```

    prefix=

    exec_prefix=${prefix}

    libdir=${exec_prefix}/lib/i386-linux-gnu

    includedir=${prefix}/include

    ```


    ```

    Name: OpenSSL

    Description: Secure Sockets Layer and cryptography libraries and tools

    Version: 1.0.1

    Requires:

    Libs: -${libdir} -lssl -lcrypto

    Libs.private: -Idl -lz

    Cflags: -I${includedir} exec_prefix=${prefix}

    ```


    You can change this file, for example, by adding -Wl,-rpath=${libdir} to the library
    flags to set a runtime linker path. However, the bigger question is how pkg-config
    finds the .pc files in the first place. By default, pkg-config looks in the /lib/pkgconfig
    directory of its installation prefix. For example, a pkg-config installed with
    a /usr/local prefix looks in /usr/local/lib/pkgconfig.


    # Installing pkg-config Files in Nonstandard Locations


    By default, pkg-config does not read any .pc files outside its installation prefix.
    So a .pc file''s in a nonstandard location, such as /opt/openssl/lib/pkgconfig/openssl.pc,
    will be out of the reach of any stock pkg-config installation. There are two basic
    ways to make .pc files available outside of the pkg-config installation:


    +   - Symbolic links (or copies) from the actual .pc files to the central pkg
    directory.


    Introduction to Compiling Software from Source Code 337'
