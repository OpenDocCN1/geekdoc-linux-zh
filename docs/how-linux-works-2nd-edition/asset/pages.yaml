  md: 'The fields are as follows:


    **PID** The process ID.


    **TTY** The terminal device where the process is running. More about this later.


    **STAT** The process status, is, what the process is doing and where its memory
    resides. For example, S sleeping and R means running. (See the ps(1) manual page
    for a description of all symbols.)


    **TIME** The amount of CPU time in minutes and seconds that the process has used
    so far. In other words, the total amount of time that the process has been running
    instructions on the processor.


    **COMMAND** One might seem obvious, but be aware that a process can change this
    field from its original value.


    #  2.16.1 Command Options


    The ps has many options. To make things more confusing, you can specify options
    in three different styles—Unix, BSD, and GNU. Many people find the BSD style to
    the most comfortable (perhaps because it involves less typing), so we''ll use
    the BSD style in this book. Here are some of the most useful combinations:


    +   - ps x Show all of your running processes.

    - ps ax Show all on the system, not just the ones you own.

    - ps u Include more detailed information on processes.

    - ps w Show full command names, not just fits on one line.


    As with other programs, you can combine options, as in ps ax and ps aux. To check
    on a specific process, add its PID to the argument list of the ps command. For
    example, to inspect the current shell, you could use ps $$, because $$ is a shell
    variable that evaluates to the current shell''s PID. (You''ll find information
    on the administration commands top and lsof in Chapter 8. These can be useful
    for locating processes, even when doing something other than system maintenance.)


    #  2.16.2 Killing Processes


    To terminate a process, send it a signal with the kill command. A signal is a
    message to a process from the kernel. When you run kill, you''re asking the kernel
    to send a signal to another process. In most cases, you will need to do this:


    ```

    $ kill pid

    ```


    There are many types of signals. The default is TERM, or terminate. You can send
    different signals by adding an extra option to kill. For example, to freeze a
    process instead of terminating it, use the STOP signal:


    ```

    $ kill -STOP pid

    ```'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'A stopped process is still in memory, ready to pick up where it left off.

    Use the CONT signal to continue running the process again:


    ```

    $ kill -CONT pid

    ```


    Using CTRL-C to terminate a process that is running in the current terminal is
    the same as using kill to end the process with the INT (interrupt) signal.


    The most brutal way to terminate a process is with the KILL signal. Other signals
    give the process a chance to clean up itself, but KILL does not. The operating
    system terminates the process and forcibly removes it from memory. Use this as
    a last resort.


    You should not kill processes indiscriminately, especially if you don''t know
    what they''re doing. You may be shooting yourself in the foot.


    You may see others entering numbers instead of names with kill; for example, kill
    -9 instead of kill -KILL. This is because the kernel uses numbers to denote the
    different signals; you can use kill this if you know the number of the signal
    that you want to send.


    # 2.16.3 Job Control


    Shells support job control, which is a way to send TSTP (similar to TOP) and CONT
    signals to programs using various keystrokes and commands. For example, you can
    send a TSTP signal with CTRL-Z, then start the process again by fg (to foreground)
    or bg (move to background): see the next section). But its utility and the habits
    of experienced users make job control necessary and can be confusing for beginners:
    It''s common for users to press CTRL-Z instead of CTRL-C, forget about what they
    were running, and eventually end up with numerous suspended processes hanging
    around.


    To see if you accidentally suspended any processes on your current terminal, run
    the jobs command.


    If you want to run multiple shells, run each program in a separate terminal window,
    put noninteractive processes in the background (as explained in the next section),
    or learn to use the screen program.


    # 2.16.4 Background Processes


    Normally, when you run a Unix command from the shell, the shell will prompt back
    until the program finishes executing. However, you can detach a process from the
    shell and put it in the "background" with the ampersand (&); this gives you the
    prompt back. For example, if you have a large file you need to decompress with
    gzip (you''ll see this in Section 2.18), and you want to do some other stuff while
    it''s running, run a command like this one:


    ```

    $ gunzip file.gz &

    ```'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'The shell should respond by printing the PID of the new background process,
    and the prompt should return immediately so that you can continue working. The
    process will continue to run after you log out, comes in particularly handy if
    you have to run a program that does a lot of number crunching for a while. (Depending
    on your setup, the shell might notify you when the process completes.)


    The dark side of running background processes is that they may expect to work
    with the standard input (or worse, read directly from the terminal). If a program
    tries to read from the standard input when it''s in the background, it can freeze
    (try bringing it back) or terminate. if a program writes to the standard output
    or standard error, the output can appear in the terminal window with no regard
    for anything else running, meaning that you can get unexpected output when you''re
    working on something else.


    The best way to make sure that a background process doesn''t bother its output
    (and possibly not) as described in Section 2.14.

    spurious output from background processes gets in your way, learn how to redraw
    your terminal window. The shell and most full-screen interactive programs support
    CTRL-L to redraw the screen. If a program is reading from the standard input,
    CTRL-R usually redraws the current line, but pressing the wrong sequence at the
    wrong time can leave you in an even worse situation than before. For example,
    entering CTRL-R at the bash prompt puts you in reverse search mode (press ESC
    to exit).


    # 2.17 File Modes and Permissions


    Every Unix file has a set of permissions that determine whether you can read,
    or run the file. Running `ls -l` displays the permissions. Here''s an example
    of such a display:


    ```

    -rw-r--r-- 1 user somegroup 7041 Mar 26 19:34 endnotes.html

    ```


    The file mode represents the file''s permissions and some extra information. There
    are four parts to the mode, as illustrated in Figure 2-1.


    The first character of the mode is the file type. A dash (-) in this position,
    as in the example, denotes a regular file, meaning that there is nothing special
    about the file. This is by far the most common kind of file. Directories are also
    common and indicated by a d in the file type slot. (Section 3.1 lists the remaining
    file types.)


    | | User permissions | |

    | --- | --- | |

    | Type | Group permissions |

    | -rw-r---- | Other permissions |


    Figure 2-1: The pieces of a file mode'
  merge: -1
  pgno: 57
- img_proc: true
  md: 'The rest of a file''s mode contains the permissions, which break down into
    three sets: user, group, and other, in that order. For example, the rw- characters
    in the example are the user permissions, the r- characters that follow the group
    permissions, and the final r- characters are the other permissions. Each permission
    set can contain four basic representations:


    +   - r Means that the file is readable.

    - w Means that the file is writable.

    - x Means that the file is executable (you can run it as a program).

    - Means nothing.


    The users (the first set) pertain to the user who owns the file. In the preceding
    example, that''s juser. The second set, group permissions, are for the file''s
    group (somegroup). Any user in group can take advantage of these permissions (Use
    the groups command to see what you''re in, and see Section 7.3.5 for more information.)
    Everyone on the system has access to the third set, and other permissions, which
    are sometimes called world permissions.


    > Each read, write, and execute permission slot is sometimes called a permission
    bit. Therefore, you may hear people refer to parts of the permissions as "the
    read bits."


    Some executable files have an n in the user permissions listing instead of an
    x. This indicates that the executable is setuid, meaning that you execute the
    program, it runs as if the file owner is the user of you. Many programs use this
    setuid bit to run as root in order to change the privileges they need to change
    system files. One example is the password program, which needs to change the /etc/passwd
    file.


    # 2.17.1 Modifying Permissions


    To change permissions, use the chmod command. First, pick the set of permissions
    you want to change, and pick the bit to change. For example, to add group (g)
    and world (o, for "other") read (r) permissions to file, you could run these two
    commands:


    ```

    $ chmod g+r file

    $ chmod o+r file

    ```


    > Or you could do it in one shot:


    ```

    $ chmod go+r file

    ```


    To remove these permissions, use go-r instead of go+r.


    > Obviously, you shouldn''t make files world-writable doing so gives anyone on
    your system the ability to change them. But would allow anyone connected to the
    Internet to change your files? Probably, unless your system has a network security
    hole. In that case, file permissions won''t help you anyway.'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'You may sometimes see people changing permissions with numbers, for example:


    ```

    $ chmod 644 file

    ```


    This is called an absolute change because it sets all permission bits at once.
    To understand how this works, you need to know how to represent the permission
    bits in octal form (each numerical represents a number in base 8 and corresponds
    to a permission set). See the chmod(1) manual page or info manual for.

    You don''t really need to know how to construct absolute modes; just memorize
    the modes that you use most often. Table 2-4 lists the most ones.


    # Table 2-4: Absolute Permission Modes


    | Mode | Meaning | Used For |

    |---|---|--|

    | 644 | user: read/write; group, other: read | files |

    | 600 | user: read/write; group, other: none | files |

    | 755 | user: read/execute; group, other: execute | directories, programs |

    | 700 | user: read/execute; group, other: none | directories, programs |

    | 711 | user: read/execute; group, other: execute | directories |


    Directories also have permissions. You can list the contents of a directory if
    it''s readable, you can only access a file in a directory if it is executable.(One
    common mistake people make when setting the permissions of directories is to accidentally
    remove the permission when using absolute modes.)


    Finally, you can specify a set of default permissions with the umask command,
    which applies a predefined set of permissions to any file you create. In general,
    use umask 022 if you want everyone to see all of the files and directories that
    you create, and use umask 077 if you don''t. (You''ll need to put the umask command
    with the desired mode in your startup files to make your new default permissions
    apply to later sessions, as discussed in Chapter 13.)


    # 2.17.2 Symbolic Links


    A symbolic link is a file that points to another file or a directory, effectively
    creating an alias (like a shortcut in Windows). Symbolic links offer quick access
    to directory paths.

    In a long directory listing, symbolic links look like this (notice the 1 as the
    file type in this mode):


    ```

    lrwxrwxrwx 1 ruser 11 Feb 27 13:52 somendir -> /home/origdir

    ```'
  merge: -1
  pgno: 59
- img_proc: true
  md: 'If you access somedir in this directory, the system gives you /home/origdir
    instead. Symbolic links are simply names that point to other names. The names
    and the paths to which they point not have to mean anything. For example, /home/origdir
    does not exist, any program that accesses somedir reports somedir does not exist
    (except for \ls somedir, a command that stupidly informs you that somedir is somedir).
    This can be baffling because you can see named somedir in front of your eyes.


    This is not the only way symbolic links can be confusing. Another problem is that
    you cannot identify the characteristics of a link just by looking at the name
    of the link; you must follow the link to see if it goes to a file or directory.
    Your system may also have links that point to other links, which are called chained
    symbolic links.


    # 2.17.3 Creating Symbolic Links


    To create a symbolic link from target to linkname, use ln -s:


    ```

    $ ln -s target linkname

    ```


    The linkname is the argument of the symbolic link, the target argument is the
    path of the file or directory that the link points to, and the -s flag specifies
    a symbolic link (see the warning that follows).


    When making a symbolic link, check the command before you run it because several
    things can go wrong. If you reverse the order of the arguments (ln -s linkname
    target), you''re in for fun if linkname is a directory already exists. If this
    is the case (and it quite is often), ln creates a named target inside linkname,
    and the link will point to itself unless linkname is a full path. If something
    went wrong when you create a symbolic link to a directory, check that directory
    for symbolic links and remove them.


    Symbolic links can also cause headaches when you don''t know what they exist.
    For example, you can easily edit what you think is a copy of a file but is actually
    a symbolic link to the original.


    > WARNING Don''t forget the -s option when creating a symbolic link. Without it,
    ln creates a hard link, giving an additional filename to a single file. The new
    filename has the status of the old one; it points (links) directly to the file
    instead of another filename as a symbolic link does. Hard links can be even more
    confusing than symbolic links. Unless you understand the material in Section 4.5,
    avoid using them.


    With all of these warnings regarding symbolic links, why would anyone bother to
    use them? Because they offer a convenient way to organize and share files, as
    well as patch problems.'
