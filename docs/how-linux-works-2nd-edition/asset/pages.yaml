    # 2.19.3 Kernel Location


    On Linux systems, the kernel is normally in /vmlinuz or /boot/vmlinuz. A boot
    loader loads this into memory and sets it in motion when the system boots. (You''ll
    find details on the boot loader in Chapter 5).

    Once the boot loader runs and sets the kernel in motion, the main kernel is no
    longer used by the running system. However, you''ll find many modules that the
    kernel can load and unload on demand during the course of normal system operation.
    Called loadable kernel modules, they are located under /lib/modules.


    # 2.20 Running Commands as the Superuser


    Before going any further, you should learn how to run commands as the superuser.
    You probably already know that you can enter the root password to start a root
    shell. This practice works, but it has certain disadvantages:


    +   - You have no record of system-altering commands.

    - You have no record of the users who performed system-altering commands.

    - You don''t have access to your normal shell environment.

    - You have to enter the root password.


    # 2.20.1 sudo


    Most distributions use a package called sudo to allow administrators to run commands
    as root when they are logged in as themselves. For example, in Chapter 7, you''ll
    learn about viwp to edit the /etc/passwd file. You could do it like this:


    ```

    sudo vipw

    ```


    When you run this command, sudo logs this action with the syslog service under
    the local2 facility. You''ll also learn more about system logs in Chapter 7.'
  merge: -1
  pgno: 66
- img_proc: true
  md: '# 2.20.2 /etc/sudoers


    Of course, the system doesn''t let just any user run commands as the superuser;
    you must configure the privileged users in your /etc/sudoers file. The sudo package
    has many options (that you''ll probably never use), which makes the syntax in
    /etc/sudoers somewhat complicated. For example, this file gives user1 and user2
    the power to run any command as root without having to enter a password:


    ```

    User_Alias ADMINS = user1, user2


    ADMINS ALL = NOPASSWD: ALL

    root ALL=(ALL) ALL

    ```


    The first line defines an ADMINS user alias with the two users, and the second
    line grants the privileges. ALL = NOPASSWD: ALL part means that the users in the
    ADMINS alias can use sudo to execute commands as root. The second ALL means "any
    command." The first ALL means "any host." (If you have more than one machine,
    you can set different kinds of access for each machine or group of machines, but
    we won''t cover that feature).

    The root=(ALL) ALL means that the superuser may also run sudo commands on any
    host. The (ALL) means that the superuser may also run commands as any other user.
    You can extend this privilege to the ADMINS users by adding (ALL) to the /etc/sudoers
    line, as shown at 1:


    ```

    ADMINS ALL = (ALL) NOPASSWD: ALL

    ```


    Use the visudo command to edit /etc/sudoers. This command checks for syntax errors
    after you save the file.


    That''s for sudo for now. If you need to use your more advanced features, check
    the sudoers(5) and sudo(8) manual pages. (The actual mechanics of user switching
    are covered in Chapter 7.)


    # 2.21 Looking Forward


    You should now know how to do the following at the command line: run programs,
    redirect output, interact with files and directories, view process listings, view
    manual pages, and generally make your way around the user space of a Linux system.
    You should also be able to run commands as the superuser. You may not yet know
    much about the internal details or what goes in the kernel, but with the basics
    of files and processes under your belt, you''re on your way. In the next chapters,
    you''ll be working with both kernel and user-space system components using the
    command-line tools that you just learned.'
