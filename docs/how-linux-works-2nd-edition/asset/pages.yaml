    hard to categorize what goes into these logs because there are no standards, but
    the most common contents are startup and shutdown messages. Many services produce
    no messages at all because they send everything to syslog or their own logging


    Upstart''s own diagnostic log can contain information about when it starts and
    reloads, as well as certain information about jobs and events. This diagnostic
    log to the kernel syslog utility. On Ubuntu, you will usually find this in the
