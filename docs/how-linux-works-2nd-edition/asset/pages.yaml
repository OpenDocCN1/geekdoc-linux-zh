    # Using the CIFS Filesystem


    If you need frequent, regular access to files on a Windows server, you can attach
    a share directly to your system with mount. The command syntax is shown below.
    Notice the use of SERVER:shazename rather than the normal \SERVER\shazename format.


    ```

    # mount -t cifs SERVER:shazename mountpoint -o user=username,pass=password

    ```


    In order to use mount like this, you must have the Common Internet File System
    (CIFS) utilities available for Samba. Most distributions offer these as a separate
    package.


    # 12.5 NFS Clients


    The standard system for file sharing among Unix systems is NFS; there are many
    different versions of NFS for different scenarios. You can serve NFS over TCP
    and UDP, with a large number of authentication and encryption techniques. Because
    there are so many options, NFS can be a big topic, so we''ll just stick to the
    basics of NFS clients.


    To mount a remote directory on a server with NFS, use the same basis syntax for
    mounting a CIFS directory:


    ```

    # mount -t nfs server:directory mountpoint

    ```


    Technically, you don''t need the -t nfs option because mount should figure out
    for you, but you may want to investigate the options in the nfs(5) manual page.
    (You''ll find different options for security using the sec option. Many administrators
    on small, closed networks host-based access control. However, more sophisticated
    methods, such as Kerberos-based authentication, require additional configuration
    on other parts of your system)


    When you find that you''re making greater use of filesystems over a network, use
    the automounter so that your system will mount the filesystems only when you actually
    try to use them in order to prevent problems with dependencies on boot. The traditional
    automounting tool is called automount, with a newer version called amd, but much
    of this is now being supplanted by the automounter unit type in systemd.'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# 12.6 Further Network File Service Options and Limitations


    Setting up an NFS server to share files other Linux machines is more complicated
    than using a simple NFS client. You need to run the server daemons (mount and
    nfsd) and set up the /etc/exports file to reflect the directories you''re sharing.
    However, we won''t cover NFS servers primarily because shared storage over a network
    is often made much more convenient by simply purchasing a NAS device to handle
    it. Many of these devices are Linux based, so they''ll naturally have NFS server
    support. Vendors add value to their NAS devices by offering their own administration
    tools to take the pain out of tedious tasks as setting up RAID configurations
    and cloud backups.


    Speaking of cloud backups, another network file service option is cloud storage.
    This can be handy when you need the extra storage that comes with automatic backups
    and you don''t mind an extra hit on performance. It''s especially useful when
    you you don''t need the service for a long time or don''t need to access it very
    much. You can usually mount Internet storage as you would NFS.


    Although NFS and other file-sharing systems work for casual use, don''t expect
    great performance. Read-only access to larger files should work well, as when
    you''re streaming audio or video, because you''re reading data in large, predictable
    chunks that don''t require back-and-forth communication between the file server
    and its client. As long as the network is fast enough and the client has enough
    memory, a server can supply data as needed.


    Local storage is much faster for tasks involving many small files, such as compiling
    software packages and starting desktop environments. The picture becomes more
    complicated when you have a larger network with many users accessing many different
    machines, because there are tradeoffs between convenience, performance, and ease
    of administration.'
  merge: -1
  pgno: 310
