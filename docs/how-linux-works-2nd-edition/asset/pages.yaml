- img_proc: true
  md: '+   5. GRUB identifies its boot partition and loads a configuration there.

    6. GRUB gives the user a chance to change the configuration.

    7. After a timeout or user action, GRUB executes the configuration (the sequence
    of commands outlined in Section 5.5.2).

    8. In the course of executing the configuration, GRUB may load additional code
    (modules) in the boot partition.

    9. GRUB executes a boot command to load and execute the kernel identified by the
    configuration''s linux command.


    Steps 3 and 4 of the preceding sequence, where the GRUB loads, can be complicated
    due to the repeated inadequacies of traditional PC boot mechanisms. The biggest
    question is "Where is the GRUB core?" There are three basic possibilities:


    +   * Partially stuffed between the MBR and the beginning of the first partition

    * In a regular partition

    * In a special boot partition: a GPT boot partition, EFI System Partition (ESP),
    or elsewhere


    In all cases except where you have an ESP, the PC BIOS loads 512 bytes from the
    MBR, and that is where GRUB starts. This little piece (derived from boot.img in
    the GRUB directory) isn''t yet the core, but it contains the start location of
    the core and the loads from this point.


    However, if you have an ESP, the GRUB core goes there and directly execute the
    GRUB core or any other operating system loader located there.


    Still, on most systems, this is not the complete picture. The boot loader might
    also need to load an initial RAM filesystem image into memory before loading and
    executing the kernel. That''s what the initrd configuration parameter in Section
    6.8 specifies. But before you learn about the initial RAM filesystem, you should
    learn about the user space start—that''s where the next chapter begins.'
