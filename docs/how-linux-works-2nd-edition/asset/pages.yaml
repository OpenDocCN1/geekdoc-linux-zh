    To understand how boot loaders like GRUB work, let first survey how a PC boots
    when you turn it on. Due to the repeated inadequacies of traditional PC boot mechanisms,
    there are several variations, but there are two main schemes: MBR and UEFI.


    # 5.8.1 MBR Boot


    In addition to the partition information described in Section 4.1, the Master
    Boot Record (MBR) includes a small area (441 bytes) that the PC BIOS loads and
    executes after its Power-On Self-Test (POST). Unfortunately, this is too little
    storage to house almost any boot loader, resulting in what is sometimes called
    a multi-stage boot loader. In the case the initial piece of the MBR does nothing
    other than load the rest of the boot loader code. The remaining pieces of the
    boot loader are usually tucked into the space between the MBR and the first partition
    on the disk.


    Of course, this isn''t terribly secure because although most boot loaders do,
    including most GRUB installations. In addition, this scheme won''t work with a
    GPT-partitioned disk'
  merge: -1
  pgno: 131
- img_proc: true
  md: 'using the BIOS to boot because the GPT table information resides in the area
    after the MBR. (GPT leaves the traditional MBR alone for backward compatibility.)


    The workaround for GPT is to create a small partition called BIOS boot with a
    special UUID to give the full boot loader code to reside. But GPT is normally
    used with UEFI, not the traditional BIOS, which leads us to the UEFI boot scheme.


    #  5.8.2 UEFI Boot


    PC manufacturers and software companies realized that the traditional BIOS is
    severely limited, so they decided to develop a replacement called Extensible Firmware
    Interface (EFI). EFI tool took a while to catch on for most PCs, but now it''s
    finally common. The current standard is Unified UEFI (EFI), which includes features
    such as a built-in shell and the ability to read partition tables and navigate
    filesystems. The GPT partitioning scheme is part of the UEFI standard.


    Booting is radically different on UEFI systems and, for the most part, easier
    to understand. Rather than executable code residing outside of a filesystem, there
    is always a special called the EFI System Partition (ESP), which contains a directory
    named ef. Each boot loader has its own identifier and subdirectory, such as ef/microsoft,
    ef/apple, or ef/grub. A boot loader file has an .efi extension and resides in
    one of these subdirectories, along with other supporting files.


    > The ESP differs from the BIOS boot partition described in Section 5.8.1 and
    has a different UEFI.


    There''s a wrinkle, though: You can''t just put boot loader code into the ESP
    because that code was written for the BIOS. Instead, you must provide a boot loader
    written for UEFI. For example, when using GRUB, you have to install the UEFI version
    of GRUB rather than the BIOS version. In addition, you must "announce" new boot
    loaders to the firmware. And, as mentioned in Section 5.6, we have the "secure
    boot" issue.


    #  5.8.3 How GRUB Works


    Let''s wrap up our discussion of GRUB by looking at how it does its work:


    +   1. The PC BIOS or firmware initializes the hardware and searches its boot-order
    devices for boot code.

    2. Upon finding the boot code, the BIOS/firmware loads and executes it. This is
    where GRUB begins.

    3. The GRUB core loads.

    4. The core initializes. At this point, GRUB can now access disks and filesystems.'
