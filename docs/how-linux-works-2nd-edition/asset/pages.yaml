  md: "# Arithmetic Tests\n\nIt's important to recognize that the equal sign (=) looks\
    \ for string equality, not numeric equality. Therefore, [ 1 = 1 ] returns 0 (true),\
    \ but [ 01 = 1 ] returns false. When working with numbers, use -eq instead of\
    \ the sign: [ 01 -eq 1 ] returns true. Table 11-3 provides the full list of numeric\
    \ comparison operators.\n\n# Table 11-3: Arithmetic Comparison Operators\n\n|\
    \ Operator | Returns True When the First Argument Is ... | the Second |\n|---|---||\n\
    | -eq | Equal to | |\n| -ne | Not equal to | |\n| -lt | Less than | |\n| -gt |\
    \ Greater than | |\n| -le | Less than or equal to | |\n| -ge | Greater than or\
    \ equal to | |\n\n# 11.5.6 Matching Strings with case\n\nThe case keyword forms\
    \ another conditional construct that is exceptionally useful for matching strings.\
    \ The case conditional does not execute any test commands and does not evaluate\
    \ codes. However, it can do pattern matching. This example should tell most of\
    \ the story:\n\n```\n#!/bin/sh\ncase $1 in\nbye)\n  echo Fine, bye.\n  ;\n  hi|hello)\n\
    \  echo Nice to see you.\n  ;\n  what*)\n  echo whatever.\n  ;\n  *)\n  echo 'Huh?'\n\
    \  ;;\nesac\n```\n\nThe shell executes this as follows:\n\n+   1. The script matches\
    \ $1 against each case value demarcated with the ) character.\n2. If a case value\
    \ matches $1, the shell executes the commands below the case until it encounters\
    \ ;;, at which point it skips to the esac keyword.\n3. The conditional ends with\
    \ esac."
