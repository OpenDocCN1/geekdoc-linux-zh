  md: '# ### 9.3.3 Common Subnet Masks and CIDR Notation


    If you''re lucky, you''ll only deal with easy subnet masks like 255.255.255.0
    or 255.255.255.0, but you may be unfortunate and encounter stuff like 255.255.255.192,
    which isn''t quite simple to determine the set of addresses that belong to the
    subnet. Furthermore, it''s likely that you''ll also encounter a different form
    of subnet representation Classless-Inter-Domain Routing (CIDR) notation, where
    a subnet such as 10.23.2.0/255.255.254.0 is written as 10.23.2.0/24.


    To understand what this means, look at the mask in binary form (as in the example
    you saw in the preceding section). You''ll find that all subnet masks are just
    a bunch of 1s followed by a bunch of 0s. For example, you just saw that 255.255.255.0
    in binary is 24 ones followed by 8 zeros. The CIDR notation identifies the subnet
    mask by the number of leading 1s in the subnet mask. Therefore, a combination
    such as 10.23.2.0/24 includes both the prefix and its subnet mask.


    Table 9-1 shows several example subnet masks and their CIDR forms.


    | Long Form | CIDR Form |

    |---|---|

    | 255.0.0.0 | 8 |

    | 255.255.0.0 | 16 |

    | 255.254.0.0 | 12 |

    | 255.255.255.0 | 24 |

    | 255.255.255.192 | 26 |


    > If you aren''t familiar with conversion between decimal, binary, and hexadecimal
    formats, you can use a calculator utility such as bc or dc to convert between
    different radix representations. For example, in bc, you can run the command obase=2;
    240 to print the 240 in binary (base 2) form.


    Identifying subnets and their hosts is the first block to understanding how the
    Internet works. However, you still need to connect the subnets.


    # ## 9.4 Routes and the Kernel Routing Table


    Connecting Internetnets is mostly a process of identifying the hosts connected
    to more than one subnet. Returning to Figure 9-2, think about Host A at IP address
    10.23.2.4. This host can directly reach hosts on that network. To reach hosts
    on the rest of the Internet, it must communicate through the router at 10.23.2.1.'
