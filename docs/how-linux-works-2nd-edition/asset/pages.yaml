    to the Internet layer pieces we''ve already covered, you see the MAC address on
    the physical layer (HWaddr). The lines connecting UP and RUNNING tell that your
    interface is working.


    Although ifconfig shows some hardware information (in this case, some low-level
    device settings like the interrupt and memory used), it''s designed primarily
    for viewing and configuring the software layers attached to the interfaces. To
    dig deeper into the hardware and physical layer behind a network interface, use
    something like the ethtool command to display or change the settings on Ethernet
    cards. (We''ll look briefly at net-works in Section 9.23.)


    # 9.8 Introduction to Network Interface Configuration


    You''ve seen all of the basic elements that go into the lower levels of a net-work
    stack: the physical layer, the network (Internet) layer, and the Linux ker-nel''s
    network interfaces. In order to combine these pieces to connect a Linux machine
    to the Internet, you or a piece of software must do the following:


    +   1. Connect the network hardware and use a driver for it. If the driver is
    present, ifconfig -a displays a kernel network inter-face corresponding to the
    hardware.

    2. Perform any additional physical layer setup, such as choosing a network name
    or password.

    3. Bind an IP address and mask to the network interface so that the kernel''s
    device drivers (physical layer) and Internet subsystems (Internet layer) can talk
    to each other.

    4. Add any additional necessary routes, including the default gateway.'
