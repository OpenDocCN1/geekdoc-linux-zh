    @ IT IS POSSIBLE THAT SOMEONE IS DOING SOMETHING NASTY!


    Someone could be eavesdropping on you right now (man-in-the-middle attack!) It
    is also possible that the RSA key you just has been changed.


    The fingerprint for the key sent by the remote host is 38:c2:f6:00:d9:44:50:55:68:54:2a:2f:83:06:11.


    Please contact your system administrator. Add correct key to /home/user/.ssh/known_hosts
    to get rid of this message.


    Offending key in /home/user/.ssh/known_hosts:12 RSA host key for host has changed
    and you have requested strict connection.


    Host verification failed. This usually means that the remote host''s administrator
    changed the keys (this often happens when replacing hardware), but never hurts
    to check with the administrator if you''re not sure. In any case, the preceding
    message tells you that the bad key is in line 12 of a user''s known_hosts file,
    as shown at ①


    If you don''t suspect foul play, just remove the offending key or replace it with
    the correct public key.


    # SSH File Transfer Clients


    OpenSSH includes the file transfer programs sc and sftp, which are intended as
    replacements for the older, insecure rcp and ftp.'
