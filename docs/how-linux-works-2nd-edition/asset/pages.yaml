    The port known as COM1 on Windows is /dev/ttyS0, COM2 is /dev/ttyS1, and so on.
    Plug-in USB serial adapters show up with USB and ACM with the names /dev/ttyUSB0,/dev/ttyACM0,
    /dev/ttyUSB1,/dev/ttyACM1, and so on.


