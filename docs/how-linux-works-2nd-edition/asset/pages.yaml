- img_proc: true
  md: '# 15.1.1 Multiple Source Files


    Most C programs are too large to reasonably fit inside a single source code file.
    Mammoth files become too disorganized for the programmer, and compilers sometimes
    have trouble parsing large files. Therefore, developers group components of the
    source code together, giving each piece its own file.


    When compiling .c files, you don''t create an executable right away. Instead,
    use the compiler''s -o option on each file to create object files. To see how
    this works, let''s say you have two files, main.c and aux.c. The following two
    compiler commands must do the work of building the program:


    ```

    $ cc -o main.c

    $ cc -o aux.o

    ```


    The preceding commands compile the two source files into the two object files
    main.o and aux.o.


    An object file is a binary file that a processor can almost understand, except
    that there are a few loose ends. First, the operating system doesn''t know how
    to run an object file, and second, you likely need to combine several object files
    and system libraries to make a complete program.


    To build a fully functioning executable from one or more object files, you must
    run the linker, the ld command in Unix. Programmers rarely use ld on the command
    line, as the C compiler knows how to run the linker program. So to create an executable
    called myprog from the two object files, run this command to link them:


    ```

    $ cc -o myprog main.o aux.o

    ```


    Although you can compile multiple source files by hand, the example shows, it
    can be hard to keep track of them all during the compiling process when the number
    of source files multiplies. The make system described in Section 15.2 is the traditional
    Unix standard for managing compilers. This system is especially important in managing
    the files described in the next two sections.


    # 15.1.2 Header (Include) Files and Directories


    C header files are additional source code files that usually contain type and
    library function declarations. For example, stdio.h is a header file (see the
    simple program in Section 15.1).


    Unfortunately, a great number of compiler problems crop up with header files.
    Most glitches occur when the compiler can''t find files and libraries. There are
    even some cases where a programmer forgets to include a required header file,
    causing some of the source code to not compile.'
  merge: -1
  pgno: 335
- img_proc: true
  md: '# Fixing Include File Problems


    Tracking down the correct include files isn''t always easy. Sometimes there are
    several include files with the same names in different directories, and it''s
    not clear which is the correct one. When the compiler can''t find an include file,
    the error message looks like this:


    ```

    badinclude.c:1:22: fatal error: notfound.h: No such file or directory

    ```


    This message reports that the compiler can''t find the notfound.h header file
    that the badinclude.c file references. This specific error is a direct result
    of this directive on line 1 of badinclude.c:


    ```

    #include <notfound.h>

    ```


    The default include directory in Unix is /usr/include; the compiler always looks
    unless you explicitly tell it to. However, you can make the compiler look in other
    include directories (most paths that contain header files have include somewhere
    in the name).


    ![](img/1b61c74a588aedf0032126b8bd0e7422_336_0.png)


    You''ll learn more about how to find missing include files in Chapter 16.


    For example, let''s say you find notfound.h in /usr/junk/include. You can make
    the compiler see this directory with the -I option:


    ```

    $ cc -I/usr/junk/include badinclude.c

    ```


    Now the compiler should no longer stumble on the line of code in badinclude.c
    that references the header file.

    You should also be aware of includes that use double quotes (") instead of angle
    brackets (< >), like this:


    ```

    #include "myheader.h"

    ```


    Double quotes mean that the header file is not in a system include directory but
    the compiler should otherwise search its include path. It often means that the
    include file is in the same directory as the source file. If you encounter a problem
    with double quotes, you''re probably trying to compile incomplete source code.


    # What Is the C Preprocessor (cpp)?


    It turns out that the C compiler does not actually do the work of looking for
    all of these files. That falls to the C preprocessor, a program that the compiler
    runs on your source code before parsing the actual program. The preprocessor rewrites
    source code into a form that the compiler understands; it''s a tool for making
    source code easier to read (and for providing shortcuts).'
  merge: -1
  pgno: 336
- img_proc: true
  md: 'Preprocessor commands in the source code are called directives, and they start
    with the # character. There are three basic types of directives:


    **Include files** An #include directive instructs the preprocessor to include
    an entire file. Note that the compiler''s -I flag is actually an option that causes
    the preprocessor to search a specified directory for include files, as you see
    in the example.


    **Macro definitions** A line like #define BLAH tells the preprocessor to substitute
    for all occurrences of BLAH in the source code. Convention dictates that macros
    appear in all uppercase, but it should come as no shock that programmers sometimes
    use macros whose names look like functions and variables. (Every now and then,
    this causes a world of headaches. Many programmers make a sport of abusing the
    preprocessor).


    NOTE  Instead of defining macros within your source code, you can also define
    macros by passing parameters to the compiler: -DLLAH*


    **Conditionals** You can mark certain pieces of code with #if, #if, and #endif.
    The #ifdef MACRO directive checks to see whether the preprocessor macro MACRO
    is defined, and #if condition tests to see whether condition is nonzero. For both
    directives, if the condition following "statement" is false, the preprocessor
    does not pass any of the program text between the #if and the next #endif to the
    compiler. If you want to look at any C code, you''d get better to use this.


    An example of a conditional directive follows. When the preprocessor sees the
    code, it checks to see whether the macro DEBUG is defined and, if so, passes the
    line containing printf() on the compiler. Otherwise, the preprocessor skips this
    line and continues to process the file after #endif.


    ```

    #ifdef DEBUG

    printf(stderr, "This is a debugging message.\n");

    #endif

    ```


    NOTE  The C preprocessor doesn''t know anything about C syntax, variables, functions,
    and other elements. It understands only its own macros and directives.


    On Unix, the C preprocessor''s name is cpp, but you can also run it with gcc -E.
    However, you''ll rarely need to run the preprocessor by itself.


    # 15.1.3 Linking with Libraries


    The compiler doesn''t know anything about your system to create a usable program
    by itself. You need libraries to build complete programs. A C library is a collection
    of common precompiled functions that you can build into your program. For example,
    many executables use the math library because it provides trigonometric functions
    and the like.'
  merge: -1
  pgno: 337
- img_proc: true
  md: 'Libraries come into play primarily at link time, when the linker program creates
    an executable from object files. For example, if you have a program that uses
    the object library but you forgot to tell the compiler to link against that library,
    you will see link errors like:


    ```

    badobject.o(.text+0x28): undefined reference to ''g_object_new''

    ```


    The most important parts of these error messages are bold. When the linker program
    examined the badobject.o object file, if it couldn''t find the function that appears
    in bold, and as a consequence, it couldn''t create the executable. In this particular
    case, you might suspect that you forgot the object library because the missing
    function is g_object_new().


    Undefined references do not always mean you''re missing a library. One of the
    program''s object files could be missing in the link command. It''s usually easy
    to differentiate between library functions and your object files, though.


    To fix this problem, you must first find the library and then tell the compiler''s
    -l option to link against the library. With include files, libraries are scattered
    throughout the system (/usr/lib is the system default location), though most libraries
    reside in a subdirectory named lib. For the preceding example, the basic generic
    library is libgobject.a, so the library name is gobobject. Putting it all together,
    you would link the program like this:


    ```

    $ cc -o badobject badobject.o -lgobject

    ```


    You must tell the linker nonstandard library locations; the parameter for this
    is -L. Let''s say that the library requires libcrud.a in /usr/junk/lib. To compile
    and create the executable, use a command like this:


    ```

    $ cc -o badobject badobject.o -L/usr/junk/lib -lcrud

    ```


    If you want to search for a library for a particular function, use the nm command.
    Be prepared for a list of output. For example, try this: nm libobject.a. (You
    might need to use the locate command to find libobject.a; many distributions now
    put architecture-specific subdirectories in /usr/lib.)


    # 15.1.4 Shared Libraries


    A library file ending with .a (such as libobject.a) is called a static library.
    When you link a program against a static library, the linker copies machine code
    from the library file into your executable. Therefore, the final executable does
    not need the original library file to run, and furthermore, the executable''s
    behavior never changes after.


    However, library sizes are always increasing, as the number of libraries in use,
    and this makes static libraries wasteful in terms of disk space'
