  md: '# 12

    MOVING FILES

    ACROSS THE NETWORK


    ![](img/1b61c74a588aedf0032126b8bd0e7422_295_0.png)


    This chapter surveys options for moving files and sharing files between machines
    on a network. We''ll start by looking at some ways to copy files other than the
    scp and sftp utilities that you''ve already seen. Then we''ll briefly look at
    true file sharing, where you attach a directory on one machine to another machine.


    This chapter describes some alternative ways to transfer files because not every
    file transfer problem is the same. Sometimes you need to provide quick, temporary
    access to machines that you don''t know much about, sometimes you need to efficiently
    maintain copies of large directory structures, and sometimes you need more constant
    access.'
  merge: -1
  pgno: 295
- img_proc: true
  md: '# 12.1 Quick Copy


    Let''s say you want to copy a file (or files) from your machine to another one
    on your network, and don''t care about copying it back or need to do anything
    fancy. You just want to do it quickly. There''s a convenient way to do this with
    python. Just go to the directory containing the file(s) and run


    ```

    $ python -m SimpleHTTPServer

    ```


    This starts a basic web server that makes the directory available to any browser
    on the network. It usually runs on port 8000, so if the machine you run this on
    is at 10.1.2.4, go to http://10.1.2.4:8000 on the destination and you''ll be able
    to grab what you need.


    # 12.2 rsync


    If you want to move an entire directory structure around, you can do so with scp
    -r—or if you need a little more performance, in a pipeline:


    ```

    $ tar cbvf directory | ssh remote_host tar xbvf

    ```


    These methods get the job done but are not flexible. In particular, after the
    transfer completes, the remote host may not have an exact copy of the directory.
    If directory already exists on the remote machine and contains some extraneous
    files, those files persist after the transfer


    If you need to do this sort of thing regularly (and especially if you plan to
    automate the process), use a dedicated synchronizer system. On Linux, rsync is
    the standard synchronizer, offering good performance and many useful ways to perform
    transfers. We''ll cover some of the essential rsync operation modes and look at
    some of its peculiarities.


    # 12.2.1 rsync Basics


    To rsync working between two hosts, the rsync program must be installed on both
    the source and destination, and you''ll need a way to access one machine from
    the other. The easiest way to transfer files is to use a remote shell account,
    and we''ll assume that you want to transfer files using SSH access. However, remember
    that rsync can be handy even for copying files and directories at locations on
    a single machine, such as from one filesystem to another.


    On the surface, you can run rsync with the same arguments as scp. For example,
    to copy a group of files to your home directory on host, enter


    ```

    $ rsync file1 file2 ... host:

    ```


    On any modern system, rsync assumes that you are using SSH to connect to the remote
    host.'
  merge: -1
  pgno: 296
- img_proc: true
  md: 'Beware of this error message:

    rsync not found

    rsync: connection unexpectedly closed (0 bytes read so far)

    rsync error: error in rsync protocol data stream (code 12) at io.c(165)


    This notice says that your remote shell can''t find rsync on its system. If rsync
    isn''t in the remote path but is on the system, use --rsync-path=to manually specify
    its location.


    If your username is different from the remote host, add user@ the host-name, where
    user is your username on host:


    ```

    $ rsync file1 file2 ... user@host:

    ```


    Unless you supply extra options, rsync copies only files. In fact, if you specify
    the options described so far and you supply a directory dir as an argument, you''ll
    see this message:


    skipping directory dir


    To transfer entire directory hierarchies—complete with symbolic links, permissions,
    modes, and devices—use the -a option. Furthermore, if you want to copy to some
    place other than your home directory on the remote host, post this after the remote
    host, like this:


    ```

    $ rsync -a dir host:destination_dir

    ```


    Copying directories can be tricky, if you''re not exactly sure what will happen
    when you transfer the files, use the -nv option combination. -n option tells rsync
    to operate in "dry run" mode—that is, to run a trial without actually copying
    any files. The -v option is for verbose mode, which shows details about the transfer
    and the files involved:


    ```

    $ rsync -nva dir host:destination_dir

    ```


    The output looks like this:


    ```

    building file list ... done

    l/nftrans/nftrans.html

    [files]

    wrote 2183 bytes read 24 bytes 401.27 bytes/sec

    ```


    # 12.2.2 Making Exact Copies of a Directory Structure


    By default, rsync copies files and directories without considering the contents
    of the destination directory. For example, if you transferred the directory d
    containing the files a and b to a machine that already had a file named d/c, the
    destination would contain d/a, d/b, and d/c after the rsync.'
  merge: -1
  pgno: 297
- img_proc: true
  md: 'To make an exact replica of the source directory, you must delete files in
    the destination directory that do not exist in the source directory, such as d/c
    in this example. Use the --delete option to do that:


    ```

    $ rsync -a --delete dir:destination_dir

    ```


    > WARNING This is dangerous, because you should typically inspect the destination
    directory to see if there''s anything you''ve inadvertently deleted. Remember,
    if you''re not certain about your transfer, use the -n option to perform a dry
    run so you''ll know exactly when rsync wants to delete a file.


    # 12.2.3 Using the Trailing Slash


    Be particularly careful when specifying a directory as the source in rsync command
    line. Consider the basic command that we''ve been working with so far:


    ```

    $ rsync -a dir host:dest_dir

    ```


    Upon completion, you''ll have a directory dir inside dest_dir on host. Figure
    12-1 shows an example of how rsync normally handles a directory with files a and
    b. However, adding a slash (/) significantly changes the behavior:


    ```

    $ rsync -a dir/ host:dest_dir

    ```


    When, rsync copies everything inside dir to dest_dir on host without creating
    a dir on the destination host. Therefore, you can think of a transfer of dir/
    as an operation similar to cp dir/* dir on the local filesystem.


    For example, say you have a directory containing the files a and b (dir/a and
    dir/b). You running the trailing-slash version of the command to transfer them
    to the dest,dest_dir on host:


    ```

    $ rsync -a dir/ host:dest_dir

    ```


    When the transfer completes, dest_dir contains copies of a and b but not dir.
    If, however, you had omitted the trailing / on dir, dest_would have a copy of
    dir with a and b inside. Then, as a result of the transfer, you''d have files
    and directories named dest_dir/dir/a and dest_dir/dir/b on the remote host. Figure
    12-2 illustrates how rsync handles the directory structure from Figure 12-1 using
    a trailing slash.


    When transferring files and directories to a remote host, accidentally adding
    a / after a path would be nothing more than a nuisance; you could go to the remote
    host, add the directory, and put all the transferred items back in dir. Unfortunately,
    you must avoid disaster when combining the trailing / with the --delete option,
    because you can easily remove unrelated files this way.'
  merge: -1
  pgno: 298
- img_proc: true
  md: '![](img/1b61c74a588aedf0032126b8bd0e7422_299_0.png)


    Figure 12-1: Normal rsync copy


    ![](img/1b61c74a588aedf0032126b8bd0e7422_299_1.png)


    Figure 12-2: Effect of trailing slash in rsync


    > NOTE Be wary of your shell''s automatic filename completion feature, GNU readline
    and many other completion libraries tack slashes onto completed directories.


    # 12.2.4 Excluding Files and Directories


    One important feature of rsync is its ability to exclude files and directories
    from a transfer operation. For example, you''d like to transfer a local directory
    called src to host, but you want to exclude anything named .git. You can do it
    like:


    ```

    $ rsync -a --exclude=.git src host:

    ```


    Note that this command excludes all files and directories named .git because --exclude
    takes a pattern, not an absolute filename. To exclude one specific item, specify
    an absolute path that starts with /, as shown here:


    ```

    $ rsync -a --exclude=/src/.git src host:

    ```'
