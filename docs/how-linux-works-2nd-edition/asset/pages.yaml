- img_proc: true
  md: '# 9.9 Boot-Activated Network Configuration


    We''ve discussed ways to manually configure a network, the traditional way to
    ensure the correctness of a machine''s network configuration was to have init
    run a script to run the manual configuration at boot time. It boils down to running
    tools like ifconfig and route somewhere in the chain of boot events. Many servers
    still do this it.


    There have been many attempts in Linux to standardize configuration files for
    boot-networking. The tools ifup and ifdown do—for example, a boot script (in theory)
    run ifup eth0 to run the correct ifconfig and route commands for the eth0 interface.
    Unfortunately, different distributions have completely different implementations
    of ifup and ifdown, and as a result, their configuration files are also completely
    different. Ubuntu, for example, uses the ifupdown with configuration files in
    /etc/network, and Fedora uses its own set of scripts for configuration in /etc/sysconfig/network-scripts.


    You don''t need to know the details of these configuration files, and if you insist
    on doing it all by hand and your distribution''s configuration tools, you can
    just look up the formats in manual pages as ifup(8) and interfaces(5). But it
    is important to know that boot-activated configuration is often not used. You''ll
    most often see it for the localhost (or lo: see Section 9.13) network interface
    but nothing else because it''s too inflexible to meet the needs of modern systems.


    # 9.10 Problems with Manual and Boot-Activated Network Configuration


    Although most systems use to configure the network in their boot mechanisms—and
    many servers still do—the dynamic nature of modern networks means that most machines
    don''t have static (unchanging) IP addresses. Rather than storing the IP address
    and other network information on your machine, yours gets this information from
    somewhere on the local physical network when it first attaches to that network.
    Most network client applications don''t particularly care what IP your machine
    uses, as long as it works. Dynamic Host Configuration Protocol (DHCP, described
    in Section 9.16) tools do the basic network layer configuration on typical clients.


    There''s more to the story, though. For example, wireless networks add additional
    dimensions to interface configuration, such as network names, authentication,
    and encryption techniques. When you step back to look at the bigger picture, you
    see that your system needs a way to answer the following questions:


    +   - If the machine has multiple physical network interfaces (such as a notebook
    with wired and wireless Ethernet), how do you choose which one(s) to use?


    +   - How should the machine set up the physical interface? For wireless networks,
    this includes scanning for network names, choosing a name, and negotiating authentication.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '+   * Once the physical network interface is connected, how should the machine
    set up the software network layers, such as the Internet layer?

    * How can you let a user choose connectivity options? For example, how do you
    let a user choose a wireless network?

    * What should the machine do if it loses connectivity on a network interface?


    Answering these questions is usually more than simple built scripts handle, and
    it''s a real hassle to do it all by hand. The answer is to use a system that can
    monitor physical networks and choose (automatically configuring) the kernel network
    interfaces based on a set of rules that makes sense to the user. The service should
    also be able to respond to requests from users, who should be able to change the
    wireless network they''re on without having to become root just to fiddle around
    with network settings every time something changes.


    # 9.11 Network Configuration Managers


    There are several ways to automatically configure networks in Linux-based systems.
    The most widely used option on desktops and notebooks is NetworkManager. Other
    network configuration management systems are mainly targeted for smaller embedded
    systems, such as OpenWRT''s netif, Android''s ConnectivityManager service, ConnMan,
    and Wcid. We will briefly discuss NetworkManager because it''s the one you''re
    most likely to encounter. We won''t go into a tremendous amount of detail, though
    after you see the big picture, NetworkManager and other configuration systems
    will be more transparent.


    # 9.11.1 NetworkManager Operation


    NetworkManager is a daemon that the system starts upon boot. Like all daemons,
    it does not depend on a running desktop component. Its job is to listen to events
    from the system and users to change the configuration based on a bunch of rules.


    When running, NetworkManager maintains two basic levels of configuration. The
    first is a collection of information about available hardware devices, which it
    normally collects from the kernel and maintains by monitoring udev the Desktop
    Bus (D-Bus). The second level is a more specific list of connections: hardware
    devices and additional physical and network layer configuration parameters. For
    example, a wireless network can be represented as a connection.


    To activate a connection, NetworkManager delegates the tasks to other specialized
    network tools and daemons as client to Internet layer configuration from a locally
    attached physical network. Because network configuration tools and schemes vary
    among distributions, NetworkManager uses plugins to interface with them, rather
    than imposing its own standard. There are plugins for both the Debian/Ubuntu and
    Red Hat–style interface configuration, for example.'
  merge: -1
  pgno: 227
- img_proc: true
  md: 'Upon startup, NetworkManager gathers all available network device information,
    searches its list of connections, and then decides to try to activate one. Here''s
    how it makes that decision for Ethernet interfaces:


    +   1. If a wired connection is available, try using it. Otherwise, try the wireless
    connections.


    +   2. Scan the list of available wireless networks. If a network is available
    that you''ve previously connected to, NetworkManager will try it again.


    +   3. If more than one previously connected wireless networks are available,
    select the most recently connected.


    After establishing a connection, NetworkManager maintains until the connection
    is lost, a better network becomes available (for example, you plug in a network
    cable while connected over wireless), or the user forces a change.


    # 9.11.2 Interacting with NetworkManager


    Most users interact with NetworkManager through an applet on the desktop—it''s
    usually an icon in the upper or lower right that indicates the connection status
    (wired, wireless, or not connected). When you click on the icon, you get a number
    of connectivity options, such as a choice of wireless networks and an option to
    disconnect from your current network. Each desktop environment has its own version
    of this applet, so it looks little different each one.


    In addition to the applet, there are a few tools that you can use to query and
    control NetworkManager from your shell. For a very quick summary of your current
    connection status, use the nm-tool command with no arguments. You''ll get a list
    of interfaces and configuration parameters. In some ways, this is like ifconfig
    that there''s more detail, especially when viewing wireless connections.


    To control NetworkManager from the command line, use the nmcli command. This is
    a somewhat extensive command. See the nmcli(1) manual for more information.


    Finally, the utility nm-online will tell you whether the network is up or down.
    If the network is up, it returns zero as its exit code; it''s nonzero otherwise.
    (For more on how to use an exit code in a shell script, see Chapter 11.)


    # 9.11.3 NetworkManager Configuration


    The general configuration directory for NetworkManager is usually /etc/NetworkManager,
    and there are several different kinds of configuration. The general configuration
    file is NetworkManager.conf. The format is similar to the XDG-style .desktop and
    Microsoft .ini files, with key-value'
  merge: -1
  pgno: 228
- img_proc: true
  md: 'parameters falling into different sections. You''ll find that nearly every
    configuration file has a [main] section that defines the plugins to use.\ Here''s
    a simple example that activates the ifupdown plugin by

    Ubuntu and Debian:


    ```

    [main]

    plugins=ifupdown,keyfile

    ```


    Other distribution-specific plugins are ifcfg-rh (for Red Hat-style

    distributions) and ifcfg-suse (for SuSE). The keyfile plugin that you also

    supports NetworkManager''s native configuration file support.

    When using the plugin, you can see the system''s known connections in

    /etc/NetworkManager/system-connections.

    For the most part, you won''t need to change NetworkManager.conf

    because the most specific configuration options are found in other files.


    # Unmanaged Interfaces


    Although you may want NetworkManager to manage most of your network

    interfaces, there will be times when you want it to ignore interfaces.

    example, there''s no reason why most users would need any kind of dynamic

    configuration on the localhost (lo) interface because the configuration

    never changes. You also want to configure this interface early in the boot

    process because system services often depend on it. Most distributions

    keep NetworkManager away from localhost.


    You can tell NetworkManager to disregard an interface by using

    plugins. If you''re using the ifupdown plugin (for example, in Ubuntu and

    Debian), add the interface configuration to your /etc/network/interfaces

    file and then set the value of managed to false in the ifupdown section of the

    NetworkManager.conf file:


    ```

    [ifupdown]

    managed=false

    ```


    For the ifcfg-rh plugin from Fedora and Red Hat use, look for a line like

    this in the /etc/sysconfig/network-scripts directory that contains the ifcfg-*

    files:


    ```

    NM_CONTROLLED=yes

    ```


    If this is not present or the value is set to no, NetworkManager

    ignores the interface. For example, you''ll find deactivated in the ifcfg-lo

    file. You can also specify a hardware address to ignore, like this:


    ```

    HWADDR=10:78:d2:eb:76:97

    ```'
  merge: -1
