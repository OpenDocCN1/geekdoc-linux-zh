    \ || Logical Constructs\n\nThere are two quick-line conditional constructs that\
    \ you may see from time to time: && (\"and\") and || (\"or\"). The && construct\
    \ works like this:\n\n```\ncommand1 && command2\n```\n\nHere, the shell runs command1,\
