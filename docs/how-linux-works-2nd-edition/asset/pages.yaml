    # Process Tracking and the Upstart expect stanza


    Because Upstart processes in jobs once they''ve started (so that it can terminate
    and restart them efficiently), it wants to know which processes are relevant to
    each job. This can be a difficult task, in the traditional Unix startup scheme,
    processes from forks during startup to become daemons, and the main process for
    a job may start after one or two forks. Without proper process tracking, Upstart
    won''t be able to finalize its job start, or it may track the incorrect PID for
    the job.


