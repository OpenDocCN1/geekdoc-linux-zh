  md: '# 3.6.3 Generic SCSI Devices


    When a user-space process communicates with the SCSI subsystem, normally does
    through the block device layer and/or another kernel service sits on top of a
    SCSI device driver (sd or sr). In other words, most user processes never need
    to know anything about SCSI devices or their commands.


    However, user processes can bypass device drivers and give SCSI protocol commands
    directly to devices through their generic devices. For example, consider the system
    described in Section 3.6, but this time, take a look at what happens when you
    use the -g option to lscsi in order to show the generic devices:


    | | ATA | WDC WD3200AAJS5-2 01.0 | /dev/sda | /dev/sg0 |

    |---|---|---|---|---|

    | 0 | cd/cdv | Slimtype D05BA8SH | /dev/sdi | /dev/sg1 |

    | 2:0:0 | disk | USB2.0 CardReader CF 0100 | /dev/sdb | /dev/sg2 |

    | 2:0:1 | disk | USB2.0 CardReader MX 0100 | /dev/sdc | /dev/sg3 |

    | 2:0:2 | disk | USB2.0 CardReader MS 0100 | /dev/sdd | /dev/sg4 |

    | 2:0:3 | disk | USB2.0 CardReader SD 0100 | /dev/sde | /dev/sg5 |

    | 3:0:0 | disk | FLASH Drive UT USB2 0.00 | /dev/sdf | /dev/sg6 |


    In addition to the block device file, each entry lists an SCSI generic device
    file in the last column. For example, the generic device for the optical drive
    at /dev/sr0 is /dev/sg.


    Why would you want to use a SCSI generic device? The answer is to do with the
    complexity of code in the kernel. It is better to leave them out of the kernel.
    Consider CD/DVD writing and reading. Not only is writing significantly more difficult
    than reading, but no critical system services depend on the action of writing.
    A user-space program might do the writing a little more inefficiently than a kernel
    service, but that will be easier to build and maintain than a kernel service,
    and bugs will not threaten kernel space. Therefore, to write to an optical disc
    in Linux, you run a program that talks to a generic SCSI device, such as /dev/sg1.
    Due to the relative simplicity of reading compared to writing, you can read from
    the drive using the specialized sd optical device.


    # 3.6.4 Multiple Access Methods for a Single Device


    The two points of access (sd and sg) for an optical drive from user space are
    illustrated for the Linux SCSI subsystem in Figure 3-3 (any drivers below the
    SCSI lower layer have been omitted). Process A reads from the drive using the
    sd driver, and process B writes to the drive using the sg driver. However, processes
    such as these two would not normally run simultaneously to the same device.'
