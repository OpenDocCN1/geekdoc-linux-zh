    # 14.3.1 X Events


    X clients get their input and other information about the state of the server
    through a system of events. X events work like other asynchronous interprocess
    communication events such as udev events and D-Bus events: The X server receives
    information from a source such as an input device, and redistributes that input
    as an event to any interested client.'
