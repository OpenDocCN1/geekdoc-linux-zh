    # 4.1 Partitioning Disk Devices


    There are many kinds of partition tables. The traditional table is the one found
    inside the Master Boot Record (MBR). A newer standard starting to gain traction
    is the Globally Unique Identifier Partition Table (GPT).

    Here is an overview of the many Linux partitioning tools available:


    +   - **parted** A text-based tool that supports both MBR and GPT.

    - **gparted** A graphical version of parted.'
