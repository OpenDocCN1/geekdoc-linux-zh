    The same is true of the sending this data. When sending the reply, the server
    didn''t differentiate between header and data sent to the operating system; the
    distinctions happen inside the user-space server program.


    # # 10.2 Network Servers


    Most network servers are like other daemons on your system such as cron, except
    that they interact with network ports. In fact, recall syslog discussed in Chapter
    7; it accepts UDP packets on port 514 when started with the -x option.


    These are some other common network servers that you might find running on your
    system:


    +   - httpd, apache, apache Web servers

    - sshd Secure shell daemon (see Section 10.3)

    - postfix, gmail, sendmail Mail servers

    - cupsd Print server

    - nsfsd, Network filesystem (file-sharing) daemons

    - smbd, nmbd Windows file-sharing daemons (see Chapter 12)

    - rpcbind Remote procedure call (RPC) portmap service daemon


    One feature to most network servers is that they usually operate as multiple processes.
    At least one process listens on a network port, and when a new incoming connection
    is received, the listening process uses fork() to create a new process, which
    is responsible for the new connection. The child, often called a worker process,
    terminates'
  merge: -1
  pgno: 256
- img_proc: true
  md: 'when the connection is closed. Meanwhile, the original listening process continues
    to listen on the network port. This process allows a server to easily handle many
    connections without much trouble.


    There are some exceptions to this model, Calling fork() adds a significant amount
    of system overhead. In comparison, high-performance TCP servers such as the Apache
    server can create a number of worker processes upon startup so that they are already
    there to handle connections as needed. Servers that accept UDP packets simply
    receive data and react to it; they have no connections to listen for.


    # 10.3 Secure Shell (SSH)


    Every server works a bit differently. Let''s take a look at one—the standalone
    SSH server. Of the most common network service applications is the secure shell
    (SSH), the de facto standard for remote access to a Unix machine. When configured,
    SSH allows secure shell logins, program execution, simple file sharing, and replacing
    the old, insecure telnet and login remote-access systems with public-key cryptography
    for authentication and simpler ciphers for session data. Most ISPs and cloud providers
    require SSH for access to their servers, and many Linux-based appliances (such
    as NAS devices) allow access via SSH as well. OpenSSH (http://www.openssh.com/)
    is a free SSH implementation for Unix, and nearly all Linux distributions come
    with it preinstalled. The OpenSSH client is ssh, and the server is sshd. There
    are two main SSH versions: 1 and 2. OpenSSH supports both, but version 1 is rarely
    used.


    Among its many useful capabilities and features, SSH does the following:


    +   - Encrypts your password and all other session data, protecting you from snoopers.


    +   - Tunnels other network connections, including those from X Window Systems
    clients. You''ll learn more about X in Chapter 14.


    +   - Offers clients for nearly any operating system.


    +   - Uses keys for host authentication.


    > Tunneling is the process of packaging and transporting one network connection
    using another one. The advantages of using SSH to tunnel X Window System connections
    are that SSH sets up the display environment for you and encrypts the X data inside
    the tunnel.


    SSH does have its disadvantages. For one, in order to use an SSH connection, you
    need the remote host''s public key, and you don''t necessarily it get in a secure
    (though you can check manually to make sure you''re not spoofed). For an overview
    of how several methods of cryptography work, get your hands on the book Applied
    Cryptography: Protocols, Algorithms, and Source Code in C, 2nd edition, by Bruce
    Schneier (Wiley, 1996).'
  merge: -1
  pgno: 257
- img_proc: true
  md: 'Two in-depth books on SSH are SSH Mastery: OpenTTY, Tunnels and Keys by Michael
    W. Lucas (Tilted Windmill Press, 2012) and SSH, The Secure Shell, 2nd edition,
    by Daniel J. Barrett, Richard E. Silverman, and Robert G. Byrnes (O''Reilly, 2005).


    # 10.3.1 The SSH Server


    Running ssh requires a configuration file and host keys. Most distributions keep
    configurations in the /etc/ssh configuration directory and try to configure everything
    for you if you install the ssh package. (The configuration filename ssh_config
    is easy to confuse with the client''s ssh_config setup file, so be careful.)


    You shouldn''t change anything in sshd_config, but it never hurts to check. The
    first lines of key-value pairs, as shown in this fragment:


    ```

    Port 22

    #Protocol 2,1

    #ListenAddress 0.0.0.0

    #ListenAddress ::

    HostKey /etc/ssh/ssh_host_key

    HostKey /etc/ssh/ssh_host_rsa_key

    HostKey /etc/ssh/ssh_host_dsa_key

    ```


    Lines beginning with # are comments, and many comments in your sshd_config might
    indicate default values. The sshd_config(5) manual page contains descriptions
    of all possible values, but these are the most important:


    +   Key file Uses as a host key. (Host keys are described shortly.)

    Loglevel level Logs messages with syslog level.

    PermRootLogin value Permits the superuser to log in SSH if it is set to value
    to prevent this.

    Sysfacility name Logs messages with syslog facility name.

    X11Forwarding value Enables X11 Window System tunneling if it is set to value.

    XAuthLocation location Provides a path for xauth. X11 tunneling will not work
    without this path. If xauth isn''t in /usr/bin, set path to the full-path for
    xauth.


    # Host Keys


    OpenSSH has three key sets: one for protocol version 1 and two for protocol 2.
    Each has a public key (a .pub file extension) and a private key (with no extension).
    Do not let anyone see your private key, even on your own system, if someone obtains
    it, you are at risk from intruders.


    SSH version 1 has RSA keys only, and SSH version 2 has RSA and DSA keys. RSA and
    DSA are public key cryptography algorithms. The key-names are given in Table 10-1.'
