- img_proc: true
  md: 'The first / /src/.git in this command is not the root directory of your system
    but the base directory of the transfer.


    Here are a few tips on how to exclude patterns:


    +   - You can have as many --exclude parameters as you like.

    - If you use the same patterns repeatedly, place them in a plaintext file (one
    pattern per line) and use --exclude-from=file.

    - To exclude directories named item but include files with this name, use a trailing
    slash: --exclude-item/

    - The exclude pattern is based on a full file or directory name component and
    may contain simple globs (wildcards). For example, t* matches this, but it does
    not match others.

    - If you exclude a directory or filename but find that your pattern is too restrictive,
    use --include to specifically include another file or directory.


    # 2.2.5 Transfer Integrity, Safeguards, and Verbose Modes


    To speed operation, rsync uses a quick check to determine whether any files on
    the transfer source are already on the destination. The quick check uses a combination
    of file size and its last-modified date. The first time you transfer an entire
    directory hierarchy to a remote host, rsync sees none of the files already exist
    at the destination, and it transfers everything. Testing your transfer with rsync
    -n ever verifies this for you.


    After rsync once, run it again with rsync -v. This time you should see that no
    files show up in the transfer list if the file exists on both ends, with the same
    modification dates.


    When the files on the source are not identical to the files on the destination
    side, rsync transfers the source files and overwrites any files. The default behavior
    may be inadequate, though, because you may need additional reassurance that files
    are indeed the same before skipping them in transfers, or you may want to put
    in some extra safeguards. Here are some options to come in:


    +   --checksum (abbreviation: -c) Compute checksums (mostly unique signatures)
    of the files to see if they''re the same. This consumes additional I/O and CPU
    resources during transfers, if you''re dealing with sensitive data or files that
    have uniform sizes, this option is a must.

    --ignore-existing Doesn''t clobber files already on the target side.

    --backup (abbreviation: -b) Doesn''t clobber files already on the target but renames
    these existing files by adding a suffix to their names before transferring the
    new files.

    --suffix=s Changes the suffix used with --backup to s.

    --update (abbreviation: -u) Doesn''t clobber any file on the target that has a
    later date than the corresponding file from the source.'
  merge: -1
  pgno: 300
- img_proc: true
  md: 'With no special options, rsync operates quietly, only producing output when
    there is a problem. However, you can use rsync -v for verbose mode or rsync -vw
    for even more details. (You can tack on as many v options as you like, but two
    is probably more than you need.) For a comprehensive summary after the transfer,
    use rsync --stats.


    # 12.2.6 Compression


    Many users use -z option in conjunction with -a to compress the data before transmission:


    ```

    $ rsync -az dir host:destination_dir

    ```


    Compression can improve performance in certain situations, such as when uploading
    a large amount of data across a slow connection (like the slow upstream link on
    many DSL connections) or when the latency between the two hosts is high. However,
    across a fast local area network, the endpoint machines can be constrained by
    the CPU time it takes to compress and decompress data, so uncompressed transfer
    may be faster.


    # 12.2.7 Limiting Bandwidth


    It''s easy to clog the uplink of connections when uploading a large amount of
    data to a remote host. Even though you aren''t using your (normally large) downlink
    capacity during such a transfer, your connection will still seem quite slow if
    you let rsync go as fast as it can, because outgoing TCP packets will have to
    compete with your transfers for bandwidth on your uplink.


    To get around this, use --bwlimit to give your uplink a little breathing room.
    For example, to limit the bandwidth to 10,000 Kbps you might do something like
    this:


    ```

    $ rsync --bwlimit=10000 -a dir host:destination_dir

    ```


    # 12.2.8 Transferring Files to Your Computer


    The rsync isn''t just for copying files from your local machine to a remote host.
    You can also transfer files from a remote machine to your local host by placing
    the remote host and source path as the first argument on the command line. Therefore,
    to transfer src_dir on the host to dest_dir on your local host, run this command:


    ```

    $ rsync -a host:src_dir dest_dir

    ```


    > As mentioned before, you can use rsync to duplicate directories on your local
    machines if you omit host: entirely.'
  merge: -1
  pgno: 301
- img_proc: true
  md: '# 12.2.9 Further rsync Topics


    Whenever you need to copy numerous files, rsync should be one of the first utilities
    that comes to mind. Running rsync in batch mode is particularly useful, and you''ll
    find a number of options to employ auxiliary files related to command options,
    logging, and transfer state. In particular, the state files make transfers faster
    and easier to resume when interrupted.


    You''ll also find rsync useful for backups. For example, you can attach Internet
    storage, such as Amazon''s S3, to your Linux system and then use rsync `--delete`
    to periodically synchronize a filesystem with the network storage to create a
    very effective backup system.


    There are many command-line options than those described here. For a rough overview,
    run rsync --help. You''ll find more detailed information in the rsync (1) manual
    page as well as at the rsync home page: http://rsync.samba.org/.


    # 12.3 Introduction to File Sharing


    Your Linux machine probably doesn''t live alone on your network, and when you
    have multiple machines on a network, there''s nearly always a reason to share
    files between them. For the remainder of this chapter, we''ll be concerned with
    file sharing between Windows and Mac OS X machines, because it''s interesting
    to see how Linux adapts to completely foreign environments. For the purpose of
    sharing files between Linux machines, or for accessing files from Network Area
    Storage (NAS) device, we''ll briefly talk about using Network File System (NFS)
    as a client.


    # 12.4 Sharing Files with Samba


    If you have machines running Windows, you''ll probably want to permit access to
    your Linux system''s files and printers from those Windows machines using the
    standard Windows network protocol, Server Message Block (SMB). Mac OS also supports
    SMB file sharing.


    The standard file-sharing software for Unix is Samba. Not only Samba allow your
    network''s Windows computers to get to your Linux system, but it works the other
    way around: You can print and access files on Windows servers from your Linux
    machine with the Samba client


    To set up a Samba server, perform these steps:


    +   1. Create an smb.conf file.

    2. Add file-sharing sections to smb.conf.

    3. Add printer-sharing sections to smb.conf.

    4. Start the Samba daemons nmbd and smbd.'
  merge: -1
  pgno: 302
- img_proc: true
  md: 'When you install Samba from a distribution package, your system should perform
    the steps listed above using some reasonable defaults for the server. However,
    it probably won''t be able to determine which particular shares (resources) on
    your Linux machine you offer to.


    The discussion of Samba in this chapter is brief and limited to getting Windows
    machines on a single subnet to see a standalone Linux machine through the Network
    Places browser. There are countless ways to configure Samba, because there are
    many possibilities for access control and network topology. For the gory details
    on how to configure a large-scale server, using Samba, 3rd edition (O''Reilly,
    2007), a much more extensive guide, and visit the Samba website, http://www.samba.org.


    # 12.4.1 Configuring the Server


    The central Samba configuration file is smb.conf, which most distributions place
    in an etc directory such as /etc/samba. However, you may have to hunt around to
    this file, as it may also be in a lib directory such as /usr/local/lib/.


    The smb.conf file is similar to the XDG file you''ve seen everywhere (such as
    system configuration format) and breaks down into several sections denoted with
    square brackets such as [global] and [printers]. The [global] section in smb.conf
    contains general options that apply to the entire server and all shares. These
    options primarily pertain to network configuration and access control. The sample
    [global] section below shows how to set the server name, description, and workgroup:


    ```

    [global]

    # server name

    netbios name = name

    # server description

    server string = My server via Samba

    # workgroup

    workgroup = MYNETWORK

    ```


    These parameters work like this:


    +   - netbios name The server name. If you omit this parameter, Samba uses the
    Unix hostname.

    - server string A short description of the server. The default is the Samba version
    number.

    - workgroup The SMB workgroup name. If you''re on a Windows domain, set this parameter
    to the name of your domain.


    # 12.4.2 Server Access Control


    You can add options to your smb.conf file to limit the machines and users that
    can access your Samba server. The following list includes many options'
  merge: -1
  pgno: 303
- img_proc: true
  md: 'that you can set in your [global] section and in the sections that control
    individual shares (as described later in the chapter):


    interfaces Set this to have Samba listen on the given networks or interfaces.
    For example:


    interfaces = 10.23.2.0/255.255.255.0

    interfaces = eth0


    bind interfaces only Set this to yes when using the interfaces parameter in order
    to access machines that you can reach on those interfaces.


    valid users Set this to allow the given users access. For example:


    valid users = jserer, bill


    guest ok Set this parameter to true to make a share available to anonymous users
    on the network.


    guest only Set this parameter to true to allow anonymous access.

    browseable Set this to no to make shares viewable by network browsers. If you
    set this parameter to no for any shares, you''ll be able to access the shares
    on the Samba server, you''ll need to know their exact names in order to be able
    to access them.


    # 12.4.3 Passwords


    In general, you should allow access to your Samba server with password authentication.
    Unfortunately, the basic password system on Unix is different than that on Windows,
    unless you specify clear-network passwords or authenticate passwords with a Windows
    server, you must set up an alternative password system. This section shows you
    to set up an alternative password system using Samba''s Trivial Database (TDB)
    backend, which is appropriate for small networks.


    First, use these entries in smb.conf [global] section to define the Samba database
    characteristics:


    ```

    # the tdb for Samba to enable encrypted passwords

    security = user

    passdb backend = tbsam

    obey pam restrictions = yes

    smb passwd file = /etc/samba/passwd_smb

    ```


    These lines allow you to manipulate the Samba database with the smbpasswd command.
    The obey pam restrictions ensures that any user changing their password with the
    smbpasswd command must obey any rules that PAM enforces for normal password changes.
    For the passdb backend parameter, you can add an optional pathname for the TDB
    file after a colon; for example, tbsam:tdb:/etc/samba/private/passwd.tdb.'
