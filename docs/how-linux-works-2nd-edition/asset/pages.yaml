- img_proc: true
  md: 'D-Bus itself consists of a library that standardizes interprocess communication
    with a protocol and supporting functions for any two processes to talk each other.
    By itself, this library doesn''t offer much more than a fancy version of normal
    IPC facilities such as Unix sockets. What makes D-Bus useful is a central "hub"
    called dbus-daemon. Processes that need to react to events can connect to dbus-daemon
    and receive certain kinds of events. Processes also create the events. For example,
    the process udisks-daemon listens to ubus for disk events and sends them to dbus-daemon,
    which retransmits the events to applications interested in disk events.


    # 14.5.1 System and Session Instances


    D-Bus has become a more integral part of the Linux system, and now goes beyond
    the desktop. For example, both system and Upstart have D-Bus channels of communication.
    However, adding dependencies on desktop tools inside the core system goes against
    a design rule of Linux.


    To address this problem, there are two kinds of dbus-daemon instances (processes)
    that can run. The first is the system instance, which is started at boot time
    with the --system option. The system instance usually runs as a D-Bus user, and
    your configuration file is /etc/dbus-1/system.conf (though you probably shouldn''t
    change the configuration). Processes connect to the system instance through the
    /var/run/dbus/system_bus_socket Unix socket.


    Independent of the system D-Bus instance, there is an optional session instance
    that runs only when you start a desktop session. Desktop applications you connect
    to this instance.


    # 14.5.2 Monitoring D-Bus Messages


    One of the best ways to see the difference between the system and dbus-daemon
    instances is to monitor the events that go over the bus. By using the dbus-monitor
    utility in system mode like this:


    ```

    $ dbus-monitor --system

    signal sender=org.freedesktop.DBus -> dest=:1.952 serial=2 path=/org/freedesktop/DBus;
    interface=org.freedesktop.DBus; name=Acquired string="1.952"

    ```


    The startup message indicates that the monitor connected and acquired a name.
    You shouldn''t see much activity when you run it like this, because the system
    instance usually isn''t very busy. To see something happy, plugging in a USB storage
    device.


    By comparison, session instances have much more to do. Assuming you''ve logged
    into a desktop session, try this this:


    ```

    $ dbus-monitor --session

    ```'
