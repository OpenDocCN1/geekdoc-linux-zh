    The server is easy to identify on your system. It is called X. Check for it in
    a process list; you will usually see it running with a number of options like
    this:


    ```

    ```

    usr/bin/X :0 -auth /var/lightdm/root/:0 -nolsisten tcp v7 -novswitch

