  md: '# 4.3 Swap Space


    Not every partition on a disk contains a filesystem. It''s also possible to augment
    the RAM on a machine with disk space. If you run out of real memory, the Linux
    virtual memory system can automatically move pieces of memory to and from disk
    storage. This is called *swapping* because pieces of idle programs are swapped
    to the disk in exchange for active programs residing on the disk. The disk area
    used to store memory pages is called *swap space* (or swap for short).


    The free command''s output includes the current swap usage in kilobytes as follows:


    | total | used | free |

    |---|---|---||

    | --snip-- Swap: | 514072 | 189804 | 324268 |


    # 4.3.1 Using a Disk Partition as Swap Space


    To use an entire partition as swap, follow these steps:


    +   1. Make sure the partition is empty.

    2. Run *mkswap dev*, where *dev* is the partition''s device. This command puts
    a swap signature on the partition.

    3. Execute *swapon dev* to register the space with the kernel.


    After creating a swap partition, you can put a new swap entry in your `/etc/fstab`
    file to make the system use the swap space as soon as the machine boots. Here
    is a sample entry for `/dev/sda5` as a swap partition:


    ```

    /dev/sda5 none swap sw 0 0

    ```


    Keep in mind that many systems now use UUIDs instead of raw device names.


    # 4.3.2 Using a File as Swap Space


    You can use a regular file as swap space if you''re in a situation where you would
    be forced to repartition a disk in order to create a swap partition. You shouldn''t
    encounter any problems when doing this.


    Use these commands to create an empty file, initialize it as swap, and add it
    to your swap pool:


    ```

    # dd if=/dev/zero of=swap_file bs=1024 count=num_mb

    # mkswap swap_file

    # swapon swap_file

    ```


    Here, *swap_file* is the name of the new swap file, and *num_mb* is the desired
    size, in megabytes.


    To remove a swap partition or file from the kernel''s active pool, use the *swapoff*
    command.'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# 4.3.3 How Much Swap Do You Need?


    At one time, Unix conventional wisdom said you should always reserve at least
    twice as much as you have real memory. Today, not only do the enormous disk and
    memory capacities available cloud the issue, but so do the ways we use the system.
    On one hand, disk space is so plentiful that it''s tempting to allocate more than
    double the memory size. On the other hand, you may never dip into your swap space
    because you have so much real memory.


    The "double the real memory" rule dated from a time when multiple users would
    be logged into one machine at a time. Not all of them would be active, so it was
    convenient to be able to swap out the memory of the inactive users when an active
    user needed more memory.


    The may still hold true for a single-user machine. If you''re running many processes,
    it''s generally fine to swap parts of inactive processes or inactive pieces of
    processes. However, if you''re constantly using the swap space because many active
    processes want to use the memory at once, you will suffer severe performance problems
    because disk I/O is just too slow to keep up with the rest of the system. The
    only solutions are to buy more memory, terminate processes, or complain.


    Sometimes, the Linux kernel may choose to swap out a process in favor of a little
    more disk cache. To prevent this, some administrators configure systems with no
    swap space at all. For example, high-performance network servers should never
    dip into swap space and should avoid access it at all possible.


    > It''s dangerous to do this on a general-purpose machine. If a machine completely
    runs out of real memory and swap space, the Linux kernel invokes the out-of-memory
    (OOM) killer to kill a process in order to free up some memory. You obviously
    don''t want this to happen to your desktop applications. On the other hand, high-performance
    servers include sophisticated monitoring and load-balancing systems to ensure
    they never reach the danger zone.


    You''ll learn much about how the memory system works in Chapter 8.


    # 4.4 Looking Forward: Disk and User Space


    In disk-related components on a Unix system, the boundaries between user space
    and the kernel can be difficult to characterize. As you''ve seen, the kernel handles
    raw I/O from the devices, and user-space tools can use the block I/O only for
    initializing operations such as partitioning, file-system creation, and swap creation.
    In normal use, user space uses only the filesystem support that the kernel provides
    on top of the block I/O. Similarly, the kernel handles many of the most tedious
    details when dealing with swap space in the virtual memory system.'
  merge: -1
  pgno: 110
