    # # 6.5 Upstart


    The Upstart version of init revolves around jobs and events. Jobs are startup
    and runtime actions for Upstart to perform (such as system services and configuration),
    and events are messages that Upstart receives from itself or other processes (such
    as udev). Upstart works by starting jobs in response to events.


    To get an idea of how this works, consider the udev job for starting the udev
    daemon. Its configuration file is typically /etc/init/udev.conf, which includes
    the following:


    +   - start on virtual-filesystems

    - stop on runlevel [06]


    These lines mean that Upstart starts the udev job upon receiving the virtual-filesystems
    event, and it stops the job upon receiving a runlevel event with an argument of
    0 or 6.


    There are many variations on events and their arguments. For example, Upstart
    can react to events emitted in response to job status, such as the started udev
    event by the udev job above. But before explaining jobs in detail, here''s a high-level
    overview of how Upstart works.


    # ## 6.5.1 Upstart Initialization Procedure


    Upon startup, Upstart does the following:


    +   1. Loads its configuration and the job configuration files in /etc/init.

    2. Emits the startup event.

    3. Runs jobs configured to start upon receiving the startup event.

    4. These init emit their own events, triggering more jobs and events.


    Upon finishing all jobs associated with a normal startup, Upstart continues to
    monitor and react to events during the system uptime. Most Upstart installations
    run like this:


    +   1. The most significant job that Upstart runs in response to the startup event
    is mount. This job attaches all necessary local and virtual filesystems to the
    currently running system so that everything else can run.

    2. The mountjob emits a number of events, including filesystem, virtual-filesystems,
    remote-filesystems, and all-swaps, among others. These events indicate that the
    important filesystems on the system are attached and ready.

    3. In response to these events, Upstart starts a number of essential service jobs.
    For example, udev starts in response to the virtual-filesystems event, and dbus
    starts in response to the local-filesystems event.'
  merge: -1
  pgno: 154
- img_proc: true
  md: '4. Among the essential jobs, Upstart starts the network-interfaces job, usually
    in response to the local-filesystems event and udev being ready.


    5. The network-interfaces job emits the static-network-up event.


    6. Upstart runs the rc-sysinit job in response to the filesystem and static-network-up
    event. This job is responsible for maintaining the system''s current runlevel,
    and when started for the first time without a runlevel, it switches the system
    to the default runlevel by emitting a runlevel event.


    7. Upstart runs most of the other startup jobs on the system in response to the
    runlevel and the new runlevel.


    The process can become complicated because it''s not always clear where events
    originate. Upstart starts only a few and the rest come from jobs. Job configuration
    files usually declare the events that they will emit, but the details of how the
    job emits them are usually not in the Upstart job configuration.


    To get to the bottom of things, you''ll often have to dig. For example, consider
    the static-network-up event. The network-interface.conf configuration file says
    it emits this event, but it doesn''t say where. It turns out the event comes from
    the ifup command, which job runs when initializing the interface in the /etc/network/if-up.d/startup
    script.


    Though all of this is documented (the ifup directory is in the interfaces(5) manual
    page referenced by the ifup(8) manual page), it can be challenging to find out
    how this works by just reading the documentation. It''s faster to grep the event
    name in a lot of configuration files to see what comes up, and then try to piece
    everything back together.


    One issue with Upstart is that there''s currently no clear way to view events.
    You can turn its log to debug, which will cause it to log everything that comes
    in (typically to /var/log/syslog), the copious amount of extraneous information
    in this file makes it difficult to determine an event''s context.


    # 6.5.2 Upstart Jobs


    Each file in the /etc/init configuration directory corresponds to a job, and the
    main configuration file for each job has a .conf extension. For example, /etc/init/mountall.conf
    defines the mountall job.


    There are two kinds of Upstart jobs:


    +   Task jobs These jobs have a clear end. For example, mountall is a task job
    because it terminates when finished mounting files.


    +   Service jobs These jobs have no defined stop. Servers (daemons) such as udev,
    database servers, and web servers are all service jobs.


    A third kind of job is an abstract job. Think of this as a kind of virtual service
    job. Abstract jobs exist only in Upstart and not by'
