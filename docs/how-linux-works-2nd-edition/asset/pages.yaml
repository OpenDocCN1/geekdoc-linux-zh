  md: '# 1.6 Troubleshooting Compiles and Installations


    If you understand the difference between compiler errors, compiler warnings, linker
    errors, and shared library problems described in Chapter 15, you shouldn''t have
    too much trouble fixing many of the glitches that arise when building software.
    This section covers some common problems. Although you''re unlikely to run into
    any of these when building using autoconf, it never hurts to know what these kinds
    of problems look like.


    Before covering specifics, make sure that you can read certain kinds of make output.
    It''s important to know the difference between an error and an ignored error.
    The following is a real error that you need to investigate:


    ```

    make: *** [target] Error 1

    ```


    However, some Makefiles suspect that an error condition might occur but that these
    errors are harmless. You can usually disregard messages like this:


    ```

    make: *** [target] Error 1 (ignored)

    ```


    Furthermore, GNU make calls itself many times in large packages, with each instance
    of the error message marked with [N], where N is a number. You can quickly find
    the error by looking at the make error that comes *directly after* the compiler
    error. For example:


    ```

    [compiler error message file.c]

    make[3]: *** [file.o] Error 1

    make[3]: Leaving directory ''/home/src/package-5.0/src''

    make[2]: *** [all] Error 2

    make[2]: Leaving directory ''/home/src/package-5.0/src''

    make[1]: *** [all-recursive] Error 1

    make[1]: Leaving directory ''/home/src/package-5.0//

    make: *** [all] Error 2

    ```


    The first lines practically give it away: The trouble centers around *file.c*
    in /home/src/package-5.0/src/. Unfortunately, there is so much extra output that
    it can be difficult to spot the details. Learning how to filter out subsequent
    make errors goes a long way digging out the real cause.


    # 16.6.1 Specific Errors


    Here are some common build errors that you might encounter:


    Problem


    ```

    src.c:22: conflicting types for ''item''

    /usr/include/file.h:47: previous declaration of ''item''

    ```'
