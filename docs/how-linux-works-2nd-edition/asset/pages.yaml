    # 2.15 Understanding Error Messages


    When you encounter a problem on a Unix-like system such as Linux, you must read
    the error message. Unlike messages from other operating systems, Unix errors usually
    tell you exactly what went wrong.


    # 2.15.1 Anatomy of a UNIX Error Message


    Most programs generate and report the same basic error messages, but there can
    be subtle differences between the output of any two programs. Here''s an example
    that you''ll certainly encounter in some form or other:


    ```

    $ ls /dsfsda

    ```


    ls: cannot access /dsfsda: No file or directory'
