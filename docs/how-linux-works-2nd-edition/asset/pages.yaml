  md: '# 9.22 Ethernet, IP, and ARP


    There is one interesting detail in the implementation of IP over Ethernet that
    we have yet to cover. Recall that a host must place an IP packet inside an Ethernet
    frame in order to transmit the packet across the physical layer to another host.
    Recall, too, that frames themselves do not include IP address information; they
    use MAC (hardware). The question is: When constructing the Ethernet frame for
    an IP packet, how does the host know which MAC address corresponds to the destination
    IP address?


    We don''t normally think about this question much because networking software
    includes an automatic system of looking up MAC addresses Address Resolution Protocol
    (ARP). A host using Ethernet as its physical layer and the network layer maintains
    a small table called ARP cache that maps IP addresses to MAC addresses. In Linux,
    the ARP cache is in the kernel. To view your machine''s ARP cache, use the -n
    command. With many other network commands, the -n option here disables DNS


    | $ -n Address | Htype | Haddr | Flags | Iface |

    |---|---|---|---|---|n| 10.1.2.141 | ether | 00:11:32:dc:a0:82 | C | eth0 |

    | 10.1.2.1 | ether | 00:24:a5:b3:00:11 | C | eth0 |

    | 10.1.2.50 | ether | 00:0c:41:f6:16:99 | C | eth0 |


    When a machine boots, its ARP cache is empty. So how do the MAC addresses get
    in the cache? It starts when the machine wants to send a packet to another host.
    If a target IP is not in an ARP cache, the following steps occurs:


    +   1. The origin host creates a special Ethernet frame containing an ARP request
    packet for the MAC address that corresponds to the target IP address.

    2. The origin host broadcasts this frame to the entire physical network for the
    target''s subnet.

    3. If one of the other hosts on the subnet knows the correct MAC address, it creates
    a reply packet and frame containing the address and sends it back to the origin.
    Often, the host that replies is the target host and is simply replying with its
    own MAC address.

    4. The origin host adds the IP-MAC address pair to the ARP cache and can proceed.


    > Remember that ARP only applies to machines on local subnets (refer to Section
    9.4 to see your local subnets). To reach destinations outside your subnet, your
    host sends the packet to the router, and it''s someone else''s problem after that.
    Of, your host still needs to know the MAC address for the router, and it can use
    ARP to find it.'
  merge: -1
  pgno: 249
- img_proc: true
  md: 'The only real problem you can have with ARP is that your system''s cache can
    get out-of-date if you''re moving an IP address from one network interface card
    to another because the cards have different MAC addresses (for example, testing
    a machine). Unix systems invalidate ARP cache entries if there''s no activity
    for a while, so there shouldn''t be any trouble other than a small delay for invalidated
    data, but you can delete an ARP cache entry with this command:


    ```

    # arp -d host

    ```


    You can also view the ARP cache for a single network interface with


    ```

    # arp -i interface

    ```


    The arp(8) manual page explains how to manually set ARP cache entries, but you
    shouldn''t need to do this.


    > NOTE Don''t confuse ARP with Reverse Address Resolution Protocol (RARP). RARP
    transforms a MAC address back to a hostname or IP address. Before DHCP became
    popular, some disk workstations and other devices used RARP to get their configuration,
    but RARP is rare today.


    # 9.23 Wireless Ethernet


    In principle, wireless Ethernet ("WiFi") networks aren''t much different from
    wired networks. Like any wired hardware, they have MAC addresses and use Ethernet
    frames to transmit and receive data, and as the Linux kernel can talk to a wireless
    network interface much as it would a wired network interface. Everything at the
    network layer and above is the same; the main differences are additional components
    in the physical layer such as features, network IDs, security, and so on.


    Unlike network hardware, which is very good at automatically adjusting to nuances
    in the physical setup without much fuss, wireless network configuration is much
    more open-ended. To get a wireless interface working properly, Linux needs additional
    configuration tools.


    Let''s take a quick look at the additional components of wireless networks.


    **Network identification** Because more than one network can share the same basic
    medium, you have to be distinguishing between them. The SSID (Service Set Identifier,
    also known as the "network name") is the wireless network identifier.


    **Management** Although it''s possible to configure wireless networking to have
    hosts talk directly to each other, most wireless networks are managed by one or
    more access points that all traffic goes through. Access points often bridge a
    wireless network with a wired network, making both appear as one single network.'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'Authentication You may want to restrict access to a wireless network.

    To so, you can configure access points to require a password or other authentication
    key before they''ll talk to a client.


    Encryption In addition to restricting the initial access to a wireless network,
    you normally want to encrypt all traffic that goes out across radio waves.


    The Linux configuration and utilities that handle these components are spread
    out over a number of areas. Some are in the kernel: Linux features a set of wireless
    extensions that standardize user-space access to hardwar. As far as user space
    groups, wireless configuration can get complicated, so most people prefer to use
    GUI frontends, such as the desktop applet for NetworkManager, to get things working.
    It''s worth looking at a few of the things happening behind the scenes.


    # 9.2.1 iw


    You can view and change kernel space device and network configuration with a utility
    called iw. To use iw, you normally need to know the network interface name for
    the device, such as wlan0. Here''s an example that dumps a scan of available wireless
    networks. (Expect a lot of output if you''re in an urban area).


    ```

    # iw dev wlan0 scan

    ```


    The network interface must be up for this command to work (if it''s not, run ifconfig
    wlan0 up), but you don''t need to configure any network layer parameters, such
    as an IP address.


    If the network interface has joined a wireless network, you can view the network
    details like this:


    ```

    # iw dev wlan0 link

    ```


    The MAC address in the output of this command is from the access point that you''re
    currently talking to.


    The iw command distinguishes between physical device names such as phy0 and network
    interface names such as wlan0 allows you to change various settings for each.
    You can even create more than one network interface for a single physical device.
    However, in nearly all basic cases, you''ll use the network interface name.


    Use iw to connect a network interface to an unsecured wireless network as follows:


    ```

    # iw wlan0 connect network_name

    ```'
  merge: -1
  pgno: 251
- img_proc: true
  md: 'Connecting secured networks is a different story. For the rather insecure Wired
    Equivalent Privacy (WEP) system, you can use the keys parameter with the iw connect
    command. However, you shouldn''t use WEP if you are serious about security.


    # ## 9.2.3 Wireless Security


    For most wireless setups, Linux relies on a daemon wpa_supplicant to manage both
    authentication and encryption for a wireless-network interface. This daemon can
    handle both WPA (WiFi Protected Access) and WPA2 schemes of authentication, as
    well as any kind of encryption technique used on wireless networks. When the daemon
    starts, it reads a configuration file (by default, /etc/wpa_supplicant.conf) and
    attempts to identify itself to an access point and establish communication based
    on a given network name. The system is well documented; in particular, wpa_supplicant(1)
    and wpa_supplicant.conf(5) manual pages are very detailed.


    Running the daemon by every time you want to establish a connection is a lot of
    work. In fact, creating the configuration file is tedious due to the number of
    possible options. To matters worse, all of the work of running iw and wpa_supplicant
    simply allows your system to join a wireless physical network; it doesn''t even
    set up the network layer. And that automatic network configuration managers as
    NetworkManager take a lot of pain out of the process. Although they don''t do
    any of the work on their own, they know the correct sequence and required configuration
    for each step toward getting a wireless network operational.


    # ## 9.24 Summary


    You can now see that understanding the positions and roles of the various network
    layers is critical to understanding how Linux operating and how to perform network
    configuration. Although we''ve covered all the basics, more advanced topics in
    the physical, network, and transport layers bear similarities to what you''ve
    seen. Layers themselves are often subdivided, as you just saw with the various
    pieces of the physical layer in a wireless network.


    A substantial amount of action that you''ve seen in this chapter happens in the
    kernel, with some basic user-space control to utilize the kernel''s internal data
    structures (such as routing tables). This is the traditional way of working with
    the network. However, as many of the topics discussed in this book, some tasks
    aren''t suitable for the kernel due to their complexity and need for flexibility,
    and that''s where user-space utilities take over. In particular, NetworkManager
    monitors and queries the kernel and then manipulates the kernel configuration.
    Another example is support for dynamic routing protocols as Border Gateway Protocol
    (BGP), which is used in large Internet networks.


    But you''re probably a little bored with network configuration by now. Let''s
    turn to using the network—the application layer.'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# 10


    # NETWORK APPLICATIONS

    AND SERVICES


    ![](img/1b61c74a588aedf0032126b8bd0e7422_253_0.png)


    This chapter explores basic network applications—the clients and servers running
    in user space that reside at the application layer. Because this layer is at the
    top of the stack, close to end users, you may find this material more accessible
    than the material in Chapter 9. Indeed, you interact with network client applications
    such as web browsers and email readers every day.


    To do their work, network clients connect to corresponding network servers. Unix
    network servers come in many forms. A server program can listen to a port on its
    own or through a secondary server. In addition, servers have no common configuration
    database and a wide variety of features. Most servers have a configuration file
    to control their behavior (though with no common format), and most use the operating
    system''s syslog service for message logging. We''ll look at some common servers
    as well as some tools that will help you understand and debug server operation.'
  merge: -1
  pgno: 253
- img_proc: true
  md: "Network clients use the operating system's transport layer protocols and interfaces,\
    \ so understanding the basics of the TCP and UDP transport layers is important.\
    \ Let's start looking at network applications by experimenting with a network\
    \ client that uses TCP.\n\n# 10.1 The Basics of Services\n\nTCP services are among\
    \ the easiest to understand because they are built upon simple, uninterrupted\
    \ two-way data streams. Perhaps the best way to see how they work is talk to a\
    \ web server on TCP port 80 to get an idea of how data moves across the connection.\
    \ For example, run the following command to connect to a web server:\n\n```\n\
    $ telnet www.wikipedia.org 80\n```\n\nYou should get a response like this:\n\n\
    ```\nTrying some address...\nConnected to www.wikipedia.org.\nEscape character\
    \ is '^]'\n```\n\nNow enter\n\n```\nGET / HTTP/1.0\n```\n\nPress ENTER twice.\
    \ The server should send a bunch of HTML text as a response and terminate the\
    \ connection.\nThis exercise tells us that\n\n+   - remote host has a web server\
    \ process listening on TCP port 80; and\n telnet is the client that initiated\
    \ the connection.\n\n> NOTE\nnet is a program originally meant to enable logins\
    \ to remote hosts. Although the non-Kerberos telnet remote login server is completely\
    \ insecure (as you will learn later), the client can be useful for debugging remote\
    \ services. telnet does not work with UDP or any transport layer other than TCP.\
    \ If you're looking for a general-purpose network client, consider netcat, described\
    \ in Section 10.5.3.\n\n# 10.1.1 A Closer Look\n\nIn the example above, you manually\
    \ interacted with a web server on the network with telnet, using the Hypertext\
    \ Transfer Protocol (HTTP) application. Although you'd normally use a web browser\
    \ to make this sort of connection, let's take just one step up from telnet and\
    \ use a command-line program that knows how to speak to the HTTP application layer.\
    \ We'll use the curl utility with a special option to record details about its\
    \ communication:\n\n```\n$ curl --trace-ascii trace_file http://www.wikipedia.org/\n\
    ```"
  merge: -1
