    # 10.6 Remote Procedure Call (RPC)


    What about the rbind service that you just saw in the scan in the preceding section?
    RPC stands for *remote procedure call*, a system residing in the lower parts of
    the application layer. It''s designed to make it easier for programmers to access
    network applications by leveraging the fact that programs call functions on remote
    programs (identified by program numbers) and return a result code or message.


    RPC implementations use transport protocols such as TCP and UDP, and they require
    a special intermediary service to map program numbers to TCP and UDP ports. The
    server is called rbind, and it must be running on any machine that wants to use
    RPC services.


    To see what services your computer has run,


    ```

    $ rpcinfo -p localhost

    ```


    RPC is one of those protocols that doesn''t want to die. The Network File System
    (NFS) and Network Information Service (NIS) systems use RPC, but they are completely
    unnecessary on standalone machines. Whenever you think that you''ve eliminated
    all need for rbind, something comes up, such as File Access Monitor (FAM) support
    in GNOME.


    # 10.7 Network Security


    Because Linux is a very popular Unix flavor on the PC platform, because it is
    widely used for web servers, it attracts many unpleasant characters who try to
    break into computer systems. System 9.21 discussed firewalls, but that''s not
    really the whole story on security.


    Network security attracts extremists—who really like to break into systems (for
    fun or money) and those who come up with elaborate protection schemes that *really*
    like to sweat away people trying to break into their systems. (This, too, can
    be profitable.) Fortunately, you don''t need to know very much to keep your system
    safe. Here are a few basic rules of thumb:


    **Run as few services as possible** Intruders can break into systems that don''t
    exist on your system. If you know what a service is and you''re not using it,
    don''t turn it on for the sole reason that you might want to use it "at some later
    point."


    **Block as much as possible with a firewall** Unix systems have a number of internal
    services that you may not know about (such as TCP port 111 for the RPC port-mapping
    service), and no other system in the world should know about them. It can be very
    difficult to track and regulate the services'
