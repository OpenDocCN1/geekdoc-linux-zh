    # 7.9 User Identification and Authentication


    A multiuser system must provide basic support for user security in terms of identification
    and authentication. The identification portion of security answers the question
    of who are. The authentication process asks users to prove they are who they say
    they are. Finally, authorization is used to define and limit what users are allowed
    to do.


    When it comes to user identification, the Linux kernel knows only the numeric
    IDs for process and file ownership. The kernel knows authorization rules for how
    to setuid executables and how user IDs may run the setuid() family of system calls
    to change from one user to another. However, the kernel does not know anything
    about authentication: usernames, passwords, and so on. Practically everything
    related to authentication happens in user space.


    We discussed the mapping between IDs and passwords in Section 7.3; now we will
    explain how user processes access this mapping. We will begin with an oversimplified
    case, in which a user wants to know its username (the name corresponding to the
    user ID). On a traditional Unix system, a process could do something like this
    to get its username:


    +   1. The process asks the kernel for its effective user ID with the getuid()
    system call.

    2. The process opens the /etc/passwd file and starts reading at the beginning.

    3. The process reads a line of the /etc/passwd file. If there''s nothing left
    to read, the process has failed to find the username.

    4. The process parses the line into fields (breaking out everything between the
    colons). The third field is the user ID for the current line.

    5. The process compares the ID from Step 4 to the ID from Step 1. If they''re
    identical, the first field in Step 4 is the desired username, and the process
    can stop searching and use this name.

    6. The process moves on to the next line in /etc/passwd and goes back to Step
    3.


    This is a long procedure that''s usually much more complicated in reality.


