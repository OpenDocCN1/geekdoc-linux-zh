  md: 'When all machines were big stationary boxes wired together, this was relatively
    straightforward: The kernel did step 1, you didn''t step 2, and you''d do step
    3 with the ifconfig command and step 4 with the route command.


    To manually set the IP address and netmask for a kernel network interface, you
    would do:


    ```

    # ifconfig interface address netmask mask

    ```


    Here, interface is the name of the interface, such as eth0. When the interface
    was up, you''d be ready to add routes, which was typically just a matter of setting
    the default gateway, like this:


    ```

    # route add default gw-address

    ```


    The gw-address parameter is the IP address of your default gateway; it must be
    in a locally connected subnet defined by the address and mask settings of one
    of your network interfaces.


    # 9.8.1 Manually Adding and Deleting Routes


    To remove a default gateway, run


    ```

    # route del -net

    ```


    You can easily override the default gateway with other routes. For example, say
    your machine is on subnet 10.23.2.0/24, you want to reach a subnet at 192.168.45.0/24,
    and you know that 10.23.2.44 can act as a router for that subnet. Run this command
    to send traffic bound for 192.168.45.0 to that router:


    ```

    # route add -192.168.45.0/24 gw 10.23.2.44

    ```


    You don''t need to specify the route in order to delete a route:


    ```

    # route del -192.168.45.0/24

    ```


    Now, before you go crazy with routes, you should know that messing with routes
    is often more complicated than it appears. For this example, you also have to
    make sure that the routing for all hosts on 192.168.45.0/24 can lead back to 10.23.2.0/24,
    or the first route you add is basically useless.'
