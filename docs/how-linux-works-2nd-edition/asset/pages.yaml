  md: '![](img/1b61c74a588aedf0032126b8bd0e7422_83_0.png)


    The host adapter communicates with the devices through the SCSI command set in
    a peer-to-peer relationship; the devices respond back to the host adapter. The
    computer is not directly attached to the device chain, so it must go through the
    host adapter in order to communicate with disks and other devices. Typically,
    the computer sends SCSI commands to the host adapter to relay to the devices,
    and the devices relay back through the host adapter.


    Newer versions of SCSI, such as Serial Attached SCSI (SAS), offer exceptional
    performance, but you probably won''t find three SCSI devices in most machines.
    You will often encounter USB storage devices that use SCSI commands. In addition,
    devices supporting ATAAPI (such as CD/DVD-ROM drives) use a version of the SCSI
    command set.


    SATA disks also appear on your system as SCSI devices by means of a translation
    layer libata (see Section 3.6.2). Most SATA controllers (especially high-performance
    RAID controllers) perform this translation in hardware.


    How does this all fit together? Consider the devices on the following system:


    ```

    $ lsscsi

    [0:0:0] disk ATA WDC WD3200AAJS-2 01.0 /dev/sda

    [0:0:1] cd/dvd Slimtype DVD A DS58A5SH X15 /dev/sdr0

    [2:0:0] disk USB2.0 CardReader CF 0100 /dev/sdc

    [2:0:1] disk USB2.0 CardReader SM XD 0100 /dev/dde

    [2:0:2] disk USB2.0 CardReader MS 0100 /dev/sde

    [2:0:3] disk USB2.0 CardReader SD 0100 /dev/sdf

    [3:0:0] disk FLASH UT USB220 0100 /dev/sdg

    ```


    The numbers in brackets are, from left to right, the SCSI host adapter number,
    the device SCSI ID, and the LUN (logical unit number, a further subdivision of
    a device). In this example, there are four attached adapters (scsi0, scsis1, scsi2,
    and scsi3), each of which has a single bus (all with bus number 0), and just one
    device on each bus (all with target 0). The USB card reader at 2:0:0 has four
    logical units—one for each kind of flash card that can be inserted. The kernel
    has assigned a different device file to each logical unit.'
