    # Boot Optimization with Auxiliary Units


    A common style of unit activation in systemd attempts to simplify dependency order
    and speed boot time. It''s similar to on-demand start in that service unit and
    an auxiliary unit represent the service unit offered resource, except that in
    this case systemd starts the service unit as soon as it activates the auxiliary.


    The reasoning behind this scheme is that essential boot-time units such as syslog
    and albus take some time to start, and many other units depend on them. However,
    systemd can offer an essential resource (such as a socket unit) very quickly,
    and then it immediately activate not only the essential unit but also any units
    that depend on the essential resource. Once the essential unit is ready, it takes
    control of the resource.


