  md: 'Fortunately, the system calls available to user space on Unix/Linux systems
    provide enough abstraction for painless file access—you don''t need to know anything
    about the underlying implementation in order to access files. In addition, filenames
    are flexible in format and mixed-case names are supported, making it easy to support
    other hierarchical-style filesystems.


    Remember, specific filesystem support does not necessarily need to be in the kernel.
    In user-space filesystems, the kernel only needs to act as a conduit for system
    calls.


    # 4.5.3 The Evolution of Filesystems


    As you can see, even the simple filesystem just described has many different components
    to maintain. At the same time, the demands placed on filesystems continuously
    increase with new tasks, technology, and storage capacity. Today''s performance,
    data integrity, and security requirements are beyond the offerings of older filesystem
    implementations, so filesystem technology is constantly changing. We''ve already
    mentioned Btrfs as an example of a next-generation filesystem (see Section 4.2.1).


    One example of how filesystems are changing is that new filesystems use separate
    data structures to represent directories and filenames, rather than the directory
    inodes described here. They reference data blocks differently. Also, filesystems
    that optimize for SSDs are still evolving. Continuous change in the development
    of filesystems is the norm, but keep in mind that the evolution of filesystems
    doesn''t change their purpose.'
