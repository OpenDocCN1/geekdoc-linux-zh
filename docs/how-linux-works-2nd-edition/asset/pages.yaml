- img_proc: true
  md: 'The -wl,-rpath option tells the linker to include a following directory into
    the executable''s runtime library search path. However, even if you use -wl,-rpath,
    you still need the -i flag.


    If you have a pre-existing binary, you can also use the patchelf program to insert
    a different runtime library search path, but it''s generally better to do this
    at compile time.


    # Problems with Shared Libraries


    Shared libraries provide remarkable flexibility, not to mention really incredible
    hacks, but it''s also possible to abuse them to the point where your system becomes
    an utter complete mess. Three particularly bad things can happen:


    +   * Missing libraries

    * Terrible performance

    * Mismatched libraries


    The number one cause of all shared library problems is the environment variable
    named LD_LIBRARY_PATH. Setting this variable to a colon-delimited set of directory
    names makes ld.so search before anything else when looking for a shared library.
    This is a cheap way to make programs work when you move a library around, if you
    don''t have the program''s source code and can''t use patchelf, or if you''re
    just too lazy to recompile the executables. Unfortunately, you is what you pay
    for.


    Never set LD_LIBRARY_PATH in startup files when compiling software. When the runtime
    linker encounters this variable, it must often search through the entire contents
    of each specified directory more times than you''d care to know. This causes a
    big performance hit, but more importantly, you can get conflicts and mismatched
    libraries because the runtime linker looks in these directories for every program.


    If you must use LD_LIBRARY_PATH to run some crappy program for which you don''t
    have the source (or an application that you''d rather not compile, like Mozilla
    or some other beast), use a wrapper script. It''s say your example is /opt/crappy/bin/craummy.bin
    and needs some shared libraries in /opt/crappy/lib. Write a wrapper script called
    crummy that looks like this:


    ```

    #!/bin/sh

    LD_LIBRARY_PATH=/opt/crappy/lib

    export LD_LIBRARY_PATH

    exec /opt/crappy/bin/craummy.bin $@

    ```


    Avoiding LD_LIBRARY_PATH prevents most shared library problems. But one other
    significant problem that occasionally comes with developers is that a library''s
    application programming interface (API) may change slightly from one version to
    another, breaking installed software. The best solutions are preventive: Either
    use a consistent methodology to install shared libraries with -wl,-rpath to create
    a runtime link path or simply use the static versions of obscure libraries.'
