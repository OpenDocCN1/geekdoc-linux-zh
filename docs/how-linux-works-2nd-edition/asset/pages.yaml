  md: 'xargs starts a lot of processes, so don''t expect great performance if you
    have a large list of files.


    You may need to add two dashes (--) to the end of your xargs command if there
    is a chance that the target files start with a single dash (-). The double dash
    (-) can be used to tell a program that any arguments follow the double dash are
    filenames, not options. However keep in mind that not all programs support the
    use of a double dash.


    There''s an alternative to xargs using find: the -exec option. However, the syntax
    is somewhat tricky because you need to supply a {} filename and a literal; to
    indicate the end of the command. Here is how to perform the preceding task using
    only find:


    ```

