    Shared libraries counter these problems. When you run a program linked against
    one


    Shared libraries have their own costs: difficult management and a somewhat complicated
    linking procedure. However, you can bring shared libraries under control if you
    know four things:


    +   - How to list the shared libraries for an executable needs

    - How an executable looks for shared libraries

    - How to link a program against a shared library

    - The common shared library pitfalls


    The following sections tell you how to use and maintain your system''s shared
    libraries. If you''re interested in how shared libraries work or if you want to
    know about linkers in general, you can check Linkers and Loaders by John R. Levine
    (Morgan Kaufmann, 1999), “The Inside Story on Libraries and Dynamic Loading” by
    David M. Beazley, Brian D. Ward, and Ian R. Cooke (Computing in Science & Engineering,
    September/2001), or other resources on the Program Library HOWTO (http://dwwheeler/program-library/).
    The ld.so(8) manual page is also worth read.


    # Listed Library Dependencies


    Shared libraries usually reside in the same places as static libraries. The two
    standard library directories on a Linux system are /lib and /usr/lib. The /lib
    directory should not contain static libraries.


    A shared library has a suffix that contains .so (shared object), as in libc-2.15.so
    and libsoc.so.6. To see what shared libraries a program uses, run ldd program
    the executable name. Here is an example for the:


    ```

    $ ld /bin/bash

    linux-gate.so.1 => (0xb7799000)

    libinfo.so.5 => /lib/i386-linux-gnu/libinfo.so.5 (0xb7765000)

    lbd.so.2 => /lib/i386-linux-gnu/libld.so.2 (0xb7760000)

    libc.so.6 => /lib/i386-linux-gnu/libc.so.6 (0xb75b5000)

    /lib-ld-linux.2 (0xb7799000)

    ```


    In the interest of optimal performance and flexibility, executables alone don''t
    usually know the locations of their shared libraries; they know the names of the
    libraries, and a little hint about where to find them. A small program ld.so (the
    runtime linker/loader) finds and loads shared libraries for a program at runtime.
    The preceding output shows the library names on the left—that’s the executable
    knows. The right side shows where ld.so finds the library.'
