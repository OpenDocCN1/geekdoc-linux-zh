- img_proc: true
  md: '# 2.19 Linux Directory Hierarchy Essentials


    Now that you know how to examine files, change directories, and read manuals,
    you''re ready to start exploring your system files. The details of the Linux directory
    structure are outlined in the Filesystem Hierarchy Standard, or FHS (http://www.pathname.com/fhs/),
    but a brief walkthrough should suffice for now.


    Figure 2-2 offers a simplified overview of the hierarchy


    ![](img/1b61c74a588aedf0032126b8bd0e7422_64_0.png)


    Figure 2-2: Linux directory hierarchy


    Here are the most important subdirectories in root:


    +   - **bin** Contains ready-to-run programs (also known as executables), including
    some of the basic Unix commands as ls and cp. Most of the programs in /bin are
    in binary format, were created by a C compiler, but are shell scripts in modern
    systems.

    - **dev** Contains device files. You''ll learn more about these in Chapter 3.

    - **etc** This core system configuration directory (pronounced EHT-see) contains
    the user password, boot, device, networking, and other setup files. Many in /etc
    are specific to the machine''s hardware. For example, the /X11 directory contains
    graph card and window system configurations.

    - **home** Holds personal directories for regular users. Most Unix installations
    conform to this standard.

    - **lib** An abbreviation for library, this directory holds library files containing
    code that executables can use. There are two types of libraries: static and shared.
    The /lib directory should contain only shared libraries, but other directories,
    such as /usr/lib, contain varieties as well as other auxiliary files. (We''ll
    discuss shared libraries in more detail in Chapter 15)

    - **proc** Provides system statistics through a browse-and-file interface. Most
    of the /proc subdirectory structure on Linux is unique, but many other Unix variants
    have similar features. The /proc directory contains information about currently
    running processes as well as some kernel parameters.'
  merge: -1
  pgno: 64
- img_proc: true
  md: '/sys This directory is similar to /proc in that it provides a device and system
    interface. You''ll read more about /sys in Chapter 3.


    /sbin The place for system executables. Programs in /sbin directories relate to
    system management, so regular users do not have /sbin components in their command
    path. Many of the utilities here will not work if you''re not running as root.


    /tmp A storage for smaller, temporary files that you don''t care about. Any user
    may read from and write to /tmp, but the user may not have permission to access
    another user''s files. Many programs use this directory as a workspace. If something
    is extremely important, don''t put it in /tmp because most distributions /tmp
    when the machine boots and even remove its old files periodically. Also, don''t
    fill up with garbage because its space is usually shared with something critical
    (like the rest of /, for example).


    /usr Although pronounced "user", this subdirectory has no user files. Instead,
    it contains a large directory hierarchy, including the bulk of the Linux system.
    Many of the directory names in /usr are the same as in the root directory (/usr/bin
    and /usr/lib), and they hold the same type of files. (Reason that the root directory
    does not contain the complete system is primarily historic—in the past, but was
    to keep space requirements for the root).


    /var The subdirectory, where programs record runtime information. System logging,
    user tracking, caches, and other files that system programs create and manage
    here. (You''ll notice a /var/tmp directory here, but the system doesn''t wipe
    it on boot.)


    # 2.19.1 Other Root Subdirectories


    There are a few interesting subdirectories in the root directory:


    +   - /boot Contains kernel boot loader files. These files pertain only to the
    very first stage of the Linux startup procedure; you won''t find information about
    how Linux starts up its services in this directory. See Chapter 5 for more about
    this.

    - /media A base point for removable media such as flash drives that is found in
    many distributions.

    - /opt This may contain additional third-party software. Many systems don''t use
    /opt.


    # 2.19.2 The /usr Directory


    The /usr directory looks relatively clean at first glance, but a quick look at
    /usr/bin and /usr/lib reveals that there''s a lot here; /usr is where most of
    the user-space programs and data reside. In addition to /usr/bin, /usr/sbin, and
    /usr/lib, /usr contains the following:


    +   - /include Holds header files used by the compiler.

    - /info Contains GNU info manuals (see Section 2.13).'
