  md: '# Listing Devices


    To get a feel for how GRUB refers to the devices on your system, access the GRUB
    command line by pressing C at the boot menu or configuration editor. You should
    get the GRUB prompt:


    ```

    grub>

    ```


    You can enter any command here that you see in a configuration, but to get started,
    try a diagnostic command instead: 1s. Without arguments, the output is a list
    of devices you know to GRUB:


    ```

    grub> 1s

    (hd0) (hd0,msdos1) (hd0,msdos5)

    ```


    In this case, there is one main disk device denoted by (hd0) and the partitions
    (hd0,msdos1) and (hd0,msdos5) prefix on the partitions tells you that the disk
    contains an MBR partition table; it would begin with gpt for GPT. (You will find
    deeper combinations with a third identifier, a BSD disklabel resides inside a
    partition, but you won''t normally have to worry about this unless you''re running
    multiple operations on one machine.)


    To get more detailed information, use ls -l. This command is particularly useful
    because it displays any UUIDs of the partitions on the disk. For example:


    ```

    grub> ls -l

    Device hd0: Not a known filesystem - Total size 426743808 sectors

    Partition hd0,msdos1: Filesystem ext2 - Last modification time 2015-09-18 20:45:00,
    UUID 4898e145-b064-45bd-b7b4-7326b0273b77-

    Partition start at 2048 - Total size 424646808 sectors

    Partition hd0,msdos5: Not a known filesystem - Partition start at 424684704 -
    Total size 20930956 sectors

    ```


    This particular disk has a Linux ext2/3/4 filesystem on the first MBR partition
    and a Linux swap signature on partition 5, which is a fairly configuration. (You
    can''t tell that (hd0,msdos5) is a swap partition from this output, though.)


