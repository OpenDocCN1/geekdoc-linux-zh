- img_proc: true
  md: 'As in previous chapters, there is virtually no networking material because
    the network is a separate building block of the system. In Chapter 9, you''ll
    see where the network fits in.


    # 7.1 The Structure of /etc


    Most system configuration files on a Linux system are found in /etc. Historically,
    each program had one or more configuration files there, and because there are
    so many packages on a Unix system, /etc accumulate files quickly.


    There were two problems with this approach: It was hard to find particular configuration
    files on a running system, and it was difficult to maintain a system configured
    this way. For example, if you wanted to change the system logger configuration,
    you''d have to edit /etc/syslog.conf. After your change, an upgrade to your distribution
    could wipe out your customizations.


    The trend for many years now has been place system configuration into subdirectories
    under /etc, as you''ve already seen for the boot directories (/etc/init for Upstart
    and /etc/system for systemd). There are still a few individual files in /etc,
    for the most part, if you run ls -F /etc, you''ll see that most of the items are
    now subdirectories.


    To solve the problem of overwriting configuration files, you can now place customizations
    in separate files in the configuration subdirectories, such as the ones in /etc/grub.d.


    What kind of configuration files are found in /etc? The basic guideline is that
    customizable configurations for a single machine, such as user information (/etc/passwd)
    and network details (/etc/network), go into /etc. However, general application
    details, such as a distribution''s defaults for a user interface, do not belong
    in /etc. And you''ll often find that noncustomizable system configuration files
    may be found elsewhere, as with the prepackaged system units in /usr/lib/systemd.


    You''ve already seen some of the configuration files that pertain to boot-in.
    Now we''ll look at a typical system service and how to view and specify its configuration.


    # 7.2 System Logging


    Most system programs write their diagnostic output to the syslog service. The
    traditional syslogd daemon waits for messages and, depending on the type of message
    received, funnels the output to a file, the screen, users, or some combination
    of these, or just ignores it.'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# 7.2.1 The System Logger


    The system logger is one of the most important parts of the system. When something
    goes wrong and you don''t know where to start, check the system log files. Here
    is a sample log file message:


    ```

    Aug 19 17:59:48 duplex sshd[484]: Server listening on 0.0.0.0 port 22.

    ```


    Most Linux distributions run a new version of syslog called rsyslog that does
    more than simply write log messages to files. For example, you can use it to load
    a module to send log messages to a database. When starting out with system logs,
    it''s easiest to catch logs normally stored in /var/log. Check out some log files—once
    you know what they look like, you''ll be ready to find out how they got.


    Many of the files in /var/log are not maintained by the system logger. The only
    way to know for sure ones belong to syslog is to look at its configuration file.


    # 7.2.2 Configuration Files


    The rsyslog configuration file is /etc/rsyslog.conf, but you''ll find certain
    configurations in other directories, such as /etc/rsyslog.d. The configuration
    format is a blend of traditional rules and rsyslog-specific extensions. One rule
    of thumb is that anything with a dollar sign ($) is an extension. where to send
    them, respectively.


    A traditional rule has a selector and an action to show how to catch logs and
    where to send them, respectively. For example:


    ```

    kern.* /dev/console

    *.info;authpriv.none /var/log/messages

    authpriv.* /var/log/secure,root

    mail.* /var/log/mailog

    cron.* /var/log/cron

    *.emerg

    local7.* *2 /var/log/boot.log

    ```


    Listing 7-1: syslog rules


    The selector is on the left. It''s the type of information to be logged. The list
    on the right is the action: where to send the log. Most actions in Listing 7-1
    are normal files, with some exceptions. For example, /dev/console refers to a
    special device for the system console, root means send a message to the superuser
    if that user is logged in, and * means message all users currently on the system.
    You can also send messages to another network host with @host.'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# Facility and Priority


    The selector is a pattern that matches the facility and priority of log messages.
    The facility is a general category of message. (See syslog.conf(5) for a list
    of all facilities.)


    The function of most facilities will be fairly obvious from their name. For example,
    the configuration file in Listing 7-1 catches messages carrying the kern, authpriv,
    cron, and local facilities. In this listing, the asterisk * is a wildcard that
    catches output related to all facilities.


    The priority follows the dot (.) after the facility. The order of priorities from
    lowest to highest is debug, info, warning, error, alert, or emerg.


    > Exclude log messages from a facility in syslog.conf, specify a priority of none,
    as shown in Listing 7-1.


    When you put a specific priority in a selector, syslog sends messages with that
    priority and all higher priorities to the destination. Therefore, in Listing 7-1,
    the *.info for the line * actually catches log messages and puts them into /var/log/messages
    because info is a relatively low priority.


    # Extended Syntax


    As previously mentioned, the syntax of syslog extensions extends the traditional
    syslog syntax. The configuration extensions are directives and usually begin with
    a $. One of the most common extensions allows you to load additional configuration
    files. Check your syslog.conf for a directive like this, which causes syslog to
    load all .conf files in /etc/rsyslog.d into the configuration.


    ```

    $IncludeConfig /etc/rsyslog.d/*.conf

    ```


    Most of the other extended directives are fairly self-explanatory. For example,
    these directives deal with users and permissions:


    ```

    $FileOwner syslog

    $FileGroup adm

    $FileCreateMode 0640

    $DirCreateMode 0755

    $Umask 0022

    ```


    > Additional rsyslog configuration file extensions define output templates and
    channels. If you need to use them, the rsyslogd(5) manual page is fairly comprehensive,
    but the web-based documentation is more complete.'
  merge: -1
  pgno: 176
- img_proc: true
  md: '# Troubleshooting


    One of the easiest ways to test the system logger is to send a log message manually
    with the logger command, as shown here:


    ```

    $ logger -p daemon.info something bad just happened

    ```


    Very little can go wrong with rsyslog. The most common problems occur when a configuration
    doesn''t catch a certain facility or priority or when log files fill their disk
    partitions. Most distributions automatically trim the files in /var/log with automatic
    invocations of logrotate or a similar utility, but if many messages arrive in
    a brief period, you can still fill the disk or up with a high system load.


    > The logs caught by rsyslog are not the only recorded by various pieces of the
    system. We discussed the startup log messages captured by systemd and Upstart
    in Chapter 6, you''ll find many other sources, such as the Apache Web server,
    which normally records its own access and error logs. To find those logs, see
    the server configuration.


    # Logging: Post and Future


    The syslog service has evolved over time. For example, there was once a daemon
    called klogd that trapped kernel diagnostic messages for syslog. (These messages
    are the ones you see with the dmesg command.) This capability has been folded
    into rsyslog.


    It''s a near certainty that Linux system logging will change in the future. Unix
    system logging never had a true standard, but efforts are underway change that.


    # 7.3 User Management Files


    Unix systems allow for multiple independent users. At the kernel level, users
    are simply numbers (user IDs), but because it''s much easier to remember a name
    than a number, you''ll normally work with usernames (or login names) instead of
    user IDs when managing Linux. Usernames exist only in user space, so any program
    that works with a username generally needs to map the username to a user ID if
    it wants to refer to a user when talking to the kernel.


    # 7.3.1 /etc/passwd File


    The plaintext file /etc/passwd maps usernames to user IDs. It looks like this:


    ```

    root:x:0:0:root:/root:/bin/sh

    daemon:*:1:1:daemon:/usr/sbin:/bin/sh

    bin*:2:2:bin:/bin/sh

    ```'
  merge: -1
  pgno: 177
- img_proc: true
  md: 'sys*:3:3:dev://bin/sh

    nobody*:65534:65534:nobody:/home/bin/false

    user:x:1119:1000:J. Random User:/home/user:/bin/bash

    beazly*:x:143:1000:David Bezley:/home/beazly:/bin/bash


    Listing 7-2: A list of users in /etc/passwd


    Each line represents one user and seven fields separated by colons. The fields
    are as follows:


    +   * The username.

    * The user''s encrypted password. On most Linux systems, the password is not actually
    stored in the passwd file, but rather, in the shadow file (see Section 7.3.3).
    The shadow file format is similar to that of passwd, but normal users do not read
    permission for passwd or shadow is the encrypted password, and it looks like a
    bunch of unreachable garbage, such as $DCVe5/oppc. (Unix passwords are never stored
    as clear text).

    * An x in the second passwd file indicates that the encrypted password is stored
    in the shadow file. A star (*) indicates that the user cannot log in, and if the
    field is blank (that is, you see two colons in a row, like ::), no password is
    required to log in. (Beware of blank passwords. You should never have a user without
    a password).

    * The user ID (UID), which is the user''s representation in the kernel. You can
    have two entries with the same user ID, but doing this will confuse you, and your
    software may mix them up. Keep the user ID unique.

    * The group ID (GID). This should be one of the numbered entries in /etc/group
    file. Groups determine file permissions and little else. This group is also called
    the user''s primary group.

    * The user''s real name (often called the GECOS field). You''ll sometimes finding
    in this file, denoting room and telephone numbers.

    * The user''s home directory.

    * The user''s shell (the program that runs when the user runs a terminal session).


    Figure 7-1 identifies the various fields in one of the entries in Listing 7-2.


    ![](img/1b61c74a588aedf0032126b8bd0e7422_178_0.png)


    Figure 7-1: An entry in the passwd file'
