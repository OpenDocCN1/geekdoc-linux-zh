    # The Bourne Shell: /bin/sh


    The shell is one of the most important parts of a Unix system. A shell is a program
    that runs commands, like the ones that users enter. The shell also serves as a
    small programming environment. Unix programmers often break common tasks into
    little components and use the shell to manage tasks and pieces together.


    Many important parts of the system are actually shell scripts—text files that
    contain a sequence of shell commands. If you''ve worked with MS-DOS previously,
    you can think of shell scripts as powerful .BAT files because they''re important,
    Chapter 11 is devoted entirely to shell scripts.


    As you progress through this book and gain practice, you''ll add to the best things
    about the shell is that if you make a mistake, you can easily see what you typed
    to find out what went wrong, and try again.


    There are many Unix shells, but dell (/bin/sh) derive all of their features from
    the Bourne shell developed at Bell Labs for early versions of Unix. Every Unix
    system needs the Bourne shell to function correctly, as you will see throughout
    this book.


    Linux uses an enhanced version of the shell called bash or the "Bourne-again"
    shell. The bash shell is the default shell on most Linux distributions, and /bin/sh
    is normally a link to bash on a Unix system. You should use the bash shell when
    running the examples in this book.


    You may not have bash if you''re using this chapter for a Unix account at an organization
    where you''re not the system administrator. You can change your shell with chsh
    or ask your system administrator for help.


    # Using the Shell


    When you install Linux, you should create at least one regular user in addition
    to the root user; this will be your personal account. For this chapter, you should
    log in as the regular user.


    # 2.2.1 The Shell Window


    After logging in, open a shell window (often referred to as a terminal). The easiest
    way to do so from a GUI like Gnome or Ubuntu''s Unity is to open a terminal application,
    which starts a shell inside a new window. Once you''ve opened a shell, it should
    display a prompt at the top'
