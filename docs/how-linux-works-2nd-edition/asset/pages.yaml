    # 7.4 getty and login


    getty is a program that attaches to terminals and displays a login prompt. On
    most Linux systems, getty is unanticipated because the system only uses it for
    logins on virtual terminals. In a process listing, it usually looks something
    like this (for example, when running on /dev/tty1):


    ```

    $ ps ao args | getty

    /sbin/getty 38400 tty1

    ```


    In this example, 38400 is the baud rate. Some getty programs don''t need the baud
    rate setting. (Virtual terminals ignore the baud rate; it''s only there for backward
    compatibility with software that connects to real serial lines).

    After you enter your login name, getty replaces itself with the login program
    which asks for your password. If you enter the correct password, login replaces
    itself (using exec()) with your shell. Otherwise, you get a "Login incorrect"
    message.

    You now know what getty and login do, but you''ll probably never need to configure
    or change them. In fact, you''ll rarely use them, because most users log in either
    through a graphical interface as gdm or remote with SSH, neither of which uses
    getty or login. Most of the login program''s real authentication work is handled
    by PAM (see Section 7.10).


    # 7.5 Setting the Time


    Unix machines depend on accurate timekeeping. The kernel maintains the system
    clock, which is the clock that is consulted when you run commands like date. You
    can also set the system clock using the date command, but it''s usually a bad
    idea to do so because you''ll never get the time exactly right. Your system clock
    should be as close to the correct as possible.

    PC hardware has a battery-backed real-time clock (RTC). The RTC isn''t the best
    clock in the world, but it''s better than nothing. The kernel usually sets its
    time based on the RTC at boot, and you can reset the system clock to the current
    hardware time with hwclock. Keep your hardware clock in Universal Coordinated
    Time (UTC) in order to avoid any trouble with time zone or daylight savings time
    corrections. You can set the RTC to your kernel''s UTC clock using this command:


    ```

    # hwclock --hctys --utc

    ```


    Unfortunately, the kernel is even worse at keeping time than the RTC, and because
    Unix machines often stay for months or years on a single'
  merge: -1
  pgno: 181
- img_proc: true
  md: 'boot, they tend to develop drift. Time drift is the current difference between
    the kernel time and the true time (defined by an atomic clock or another very
    accurate clock).


    You should not try to fix the drift with clock because time-based events get lost
    or mangled. You could run a utility like adjtime to smoothly update the clock,
    but usually it''s best to keep your system time correct with a network time daemon
    (see Section 7.5.2).


    # ### 7.5.1 Kernel Time Representation and Time Zones


    The kernel''s system clock represents the current time as the number of seconds
    since 12:00 midnight on January 1, 1970, UTC. To see this number at any moment,


    ```

    $ date +%

    ```


    To convert this number into something that humans can read, user-space programs
    change it to local time and compensate for daylight savings time and any other
    strange circumstances (such as living in Indiana). The time zone is controlled
    by the file /etc/localtime. (Don''t bother trying to look at it; it''s a binary
    file).


    The time zones on your system are in /usr/share/zoneinfo. You''ll find that this
    directory contains a list of time zones and a list of aliases for them. To set
    your time zone manually, copy one of the files in /usr/share/zoneinfo to /etc/localtime
    (make a symbolic link) or change it with your distribution''s time zone tool.
    (The command-line program tzselect may help you identify a time zone.)


    To use a time zone other than the system default for just one shell session, set
    the TZ environment variable to the name of a file in /usr/share/zoneinfo and test
    the change, like this:


    ```

    $ export TZ=US/Central

    $ date

    ```


    With other environment variables, you can also set the time zone for the duration
    of a single command like:


    ```

    $ TZ=US/Central date

    ```


    # ### 7.5.2 Network Time


    If your machine is permanently connected to the Internet, you can run a Network
    Time Protocol (NTP) daemon to maintain the time using a remote server. Many distributions
    have built-in support for an NTP daemon, but it may not be enabled by default.
    You might need to install an ntpd package to get it to.'
  merge: -1
  pgno: 182
- img_proc: true
  md: 'If you need to do the configuration by hand, you''ll find help on the main
    NTP web page at http://www.ntp.org/, but if you''d rather not read through means
    of documentation there, this does:


    +   - Find the closest NTP time server from your ISP or from the ntp web page.

    - Put time server in /etc/ntpd.conf.

    - Run nptpd server at boot time.

    - Run nptpd at boot time, after the ntpdate command.


    If your machine doesn''t have a permanent Internet connection, you can use a daemon
    like chronyd to maintain the time during discontinuities.

    You can also set your hardware clock based on the network time in order to help
    your system maintain time coherency when it reboots. (Many distributions do this
    automatically.) To do, set your system time from the network with ntpdate (or
    nptpd), then run the command you saw back on page 157:


    ```

    # hwclock --systohc --utc

    ```


    # 7.6 Scheduling Recurring Tasks with cron


    The Unix cron service runs programs repeatedly on a fixed schedule. Most experienced
    administrators consider cron to be vital to the system because it can perform
    automatic system maintenance. For example, cron runs file rotation utilities to
    ensure that your hard drive doesn''t fill up with log files. You should know how
    to use cron because it''s just plain useful.

    You can run any program with whatever times you suit. The program running through
    cron is called a cron job. To install a cron job, you''ll create an entry line
    in your crontab file, usually by running the crontab command. For example, the
    crontab schedules the /home/user/bin/spmake daily at 9:15 AM:


    ```

    15 09 * * * /home/user/bin/spmake

    ```


    The five fields at the beginning of this line, delimited by whitespace, specify
    the scheduled time (see also Figure 7-3). The fields are as follows, in order:


    +   - Minute (0 through 59). The cron job above is set for minute 15.

    - Hour (0 through 23). The job above is set for the ninth hour.

    - Day of month (1 through 31).

    - Month (1 through 12).

    - Day of week (0 through 7). The numbers 0 and 7 are Sunday.'
  merge: -1
  pgno: 183
- img_proc: true
  md: 'Figure 7-3: An entry in the crontab file


    A star (*) in any field means to match every value. The preceding example spake
    daily the day of month, month, and day of week fields are filled with stars, cron
    reads as "run this job every day, of every month, of every week."


    To run spake only on the 14th day of each month, you would use this crontab line:


    ```

    15 09 14 * * /home/juser/bin/spake

    ```


    You can select more than one time for each field. For example, to run the program
    on the 5th and the 14th day of each month, you could enter 5,14 in the third field:


    ```

    15 09 5,14 * * /home/juser/bin/spake

    ```


    If the cron generates standard output or an error or exits abnormally, cron mail
    this information to you. Redirect the output to /dev/null or some other log file
    if you find the entry annoying.


    The crontab(5) manual page provides complete information on the crontab format.


    # 7.6.1 Installing Crontab Files


    Each can have his or her own crontab file, which means that system may have multiple
    crontabs, usually found in /var/spool/cron/crontabs. Normal users cannot write
    to this directory; the crontab command installs, lists, edits, and removes a user''s
    crontab.


    The easiest way to install a crontab is to put your crontab entries into a file
    and use crontab file to install file as your current crontab. The crontab command
    checks the file to make sure that you haven''t made any mistakes. To list your
    cron jobs, run crontab -l. To remove the crontab, use crontab -r.


    However, after you have created your initial crontab, it can be a bit messy to
    use temporary files to make further edits. Instead, you can edit and install your
    crontab in one step with the crontab -e command. If you make a mistake, crontab
    should tell you where the mistake is and ask if you want to try editing again.'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# 7.6.2 System Crontab Files


    Rather than use the superuser''s crontab to schedule recurring system tasks, Linux
    distributions normally have an /etc/crontab file. Don''t use crontab to edit this
    file, because this version has an additional field inserted before the command
    to run—the user that should run the job. For example, this cron job in /etc/crontab
    runs at 6:42 AM as the supervisor (root, shown at :):


    ```

    42 * * * root /usr/local/bin/cleansystem > /dev/null 281

    ```


    Some distributions store crontab files in the /etc/cron.d directory. These files
    may have any name, but they have the same format as /etc/crontab.


    # 7.6.3 The Future of cron


    The cron utility is one of the oldest components of a Linux system; it''s been
    around for decades (predating Linux itself), and its configuration format hasn''t
    changed for many years. When something gets to be this old, it becomes fodder
    for replacement, and there are efforts underway to do exactly.


    The proposed replacements are actually just parts of the newer versions of init:
    For systemd, there are timer units, and for Upstart, the idea is to create recurring
    events to trigger jobs. After all, both versions of init run tasks as any user,
    and they offer certain advantages, as custom logging.


    However, the reality is neither systemd nor Upstart has all of the capabilities
    of cron. Furthermore, when they become capable, backward compatibility will be
    necessary to support everything that relies on cron. For these reasons, it''s
    unlikely that the cron format will go away soon.


    # 7.7 Scheduling One-Time-Tasks with at


    To run a job in the future without cron, use the service. For example, to run
    myjob at 10:30 PM, enter this command:


    ```

    $ at 22:30

    at> myjob

    ```


    Enter the input with CTRL-D. (The at utility reads the commands from the standard
    input.)


    To check that the job has been scheduled, use atq. To remove it, use atm. also
    schedule jobs into the future by adding the date in DD.MM.YY format, for example,
    at 22:30 30.09.15.


    There isn''t much else to the command. Though at isn''t used often, it can be
    handy for that odd time when you need to tell the system to shut down in the future.'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# 7.8 Understanding User IDs and User Switching


    We''ve discussed setuid programs as sudo and su allow you to change users, and
    we''ve mentioned system components like login to control user access. Perhaps
    you''re wondering how these pieces work and what role the kernel plays in user
    switching.


    There are two ways to change a user ID, and the kernel handles both. The first
    is with a setuid executable, which is covered in Section 2.17. The second is through
    the setuid() family of system calls. There are a few versions of this system call
    to accommodate the various user IDs associated with a process, as you''ll learn
    in Section 7.8.


    The kernel has basic rules about what a process can or can''t do, here are the
    three basics:


    +   * A process running as root (userid 0) can use setuid() to become any other
    user.

    * A process not running as root has severe restrictions on how it may use setuid();
    in most cases, it cannot.

    * Any process can execute a setuid program as long as it has adequate permissions.


    > User switching has nothing to do with passwords or usernames. Those are strictly
    user-space concepts, as you first saw in the /etc/passed file in Section 7.3.1.
    You''ll learn more about how this works in Section 7.9.1.


    # 7.8.1 Process Ownership, Effective UID, Real UID, and Saved UID


    Our discussion of user IDs has been simplified. In reality, every process has
    more than one user ID. We''ve described the effective user ID (euid), which defines
    the access rights for a process. A second user ID, the real user ID (ruid), indicates
    who initiated a process. When you run a setuid program, Linux sets the effective
    UID to the program''s owner during execution, but it keeps your original user
    ID in the real user ID.


    On modern systems, the difference between the effective and real user IDs is confusing,
    so much that a lot of documentation regarding process ownership is incorrect.


    Think of the effective user ID as the actor and the real user ID as the owner.
    The real user ID defines the user that can interact with the running process—most
    significantly, which user can kill and send signals to a process. For example,
    if user A starts a new process as B (based on setuid permissions), user A still
    owns the process and can kill it.


    On Linux systems, all processes have the same effective UID and real user ID.
    By default, ps and other system diagnostic programs show both the effective and
    real UIDs on your system, but don''t be surprised if you find that the two user
    ID columns are identical for all processes on your system:


    ```

    $ -eo pid,euser,user,comm

    ```'
  merge: -1
  pgno: 186
- img_proc: true
  md: 'To create an exception just so that you can see different values in the columns,
    try experimenting by creating a setuid of the sleep command, running the copy
    for a few seconds, and then running the ps command in another window before the
    command terminates.


    To add to the confusion, in addition to the real and effective user IDs, there
    is also a saved user ID (which is usually not abbreviated). A process can switch
    its effective user ID to the real or saved user ID during execution. (To make
    things even more complicated, Linux has another user ID: the file system user
    ID [fsuid], which defines the user accessing the filesystem is rarely used.)


    # Typical Setuid Program Behavior


    The idea of the real user ID might contradict your previous experience. Why don''t
    you have to deal with the other user IDs frequently? For example, after starting
    a process with sudo, if you want to kill it, you still use sudo; you can''t kill
    it as your regular user. Shouldn''t your regular user be the real user ID in this
    case, giving you the correct permissions?


    The cause of this behavior is that sudo and many other programs explicitly change
    the effective and real user IDs with one of the setuid() system calls. These programs
    do so because there are often unintended effects and problems when all of the
    user IDs do not match.


    If you''re interested in the details and rules regarding user ID switching, read
    the setuid(2) manual page and check the other manual pages listed in the SEE ALSO
    section. There are many different system calls for diverse situations.


    Some programs do not like to have a real user ID of root. To prevent sudo from
    changing the real user ID, add this line to your /etc/sudoers file (and be aware
    of effects on other programs you want to run as root):


    Defaults stay_setuid


    # Security Implications


