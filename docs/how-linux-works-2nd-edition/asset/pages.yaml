- img_proc: true
  md: '# 9.15 Revisiting a Simple Local Network


    We''re now going to look at additional components of the simple network introduced
    in Section 9.3. Recall that this network consists of one local area network as
    one subnet and a router that connects the subnet to the rest of the Internet.
    You''ll learn the following:


    +   * How a host on the subnet automatically gets its network configuration

    * How to set up routing

    * What a router really is

    * How to know IP addresses to use for the subnet

    * How to set up firewalls to filter out unwanted traffic from the Internet


    Let''s start by learning how a host on the subnet automatically gets its network
    configuration.


    # 9.16 Understanding DHCP


    When you set a network host to get its configuration automatically from the network,
    you''re telling it to use the Dynamic Host Configuration Protocol (DHCP) to get
    an IP address, subnet mask, default gateway, and DNS servers. Aside from having
    to enter these parameters by hand, DHCP has other advantages for a network administrator,
    such as preventing IP address clashes and minimizing the impact of network changes.
    It''s very rare to see use DHCP.


    For a host to get its configuration with DHCP, it must be able to send messages
    to its DHCP server. Therefore, each physical network should have its own DHCP
    server, and on a simple network (such as the one in Section 9.3), the router usually
    acts as the DHCP server.


    > When making an initial DHCP request, a host doesn''t even know the address of
    DHCP server, so it broadcasts the request to all hosts (usually all on its physical
    network).


    When a machine asks a DHCP server for an IP address, it''s really asking for a
    lease on address for a certain amount of time. When the lease is up, a client
    can ask to renew the lease.


    # 9.16.1 The Linux DHCP Client


    Although there are many different kinds of network manager systems, nearly all
    use the Internet Software Consortium (ISC) dhclient program to do the actual work.
    You can test dhclient by the command line, but before doing so you must remove
    any default gateway route. To run the test, simply specify the network interface
    name (here, it''s eth0):


    ```

    # dhclient eth0

    ```'
  merge: -1
  pgno: 238
- img_proc: true
  md: 'Upon startup, dhclient stores its process ID in /var/run/dhclient.pid and lease
    information in /var/state/dhclient.leases.


    # 9.16.2 Linux DHCP Servers


    You can task a Linux machine with running a DHCP server, which provides a good
    amount of control over the addresses that it gives out. However, unless you''re
    administering a large network with many subnets, you''re probably better off using
    specialized router hardware that has built-in DHCP servers.


    Probably the most important thing to know about DHCP servers is that you want
    only one running on the same subnet in order to avoid problems clashing IP addresses
    or incorrect configurations.


    # 9.17 Configuring Linux as a Router


    Routers are essentially just computers with more than one physical network interface.
    You can easily configure a Linux machine as a router.

    For example, say you have two LAN subnets, 10.23.2.0/24 and 192.168.45.0/24. To
    connect them, you have a Linux router machine with network interfaces: two for
    the LAN subnets and one for an Internet uplink, as shown in Figure 9-4. As you
    can see, this doesn''t look very different from the simple network example that
    we''ve used in the rest of this chapter.


    ![](img/1b61c74a588aedf0032126b8bd0e7422_239_0.png)


    Figure 9-4: Two subnets joined with a router'
  merge: -1
  pgno: 239
- img_proc: true
  md: 'The router''s IP addresses for the LAN subnets are 10.23.2.1 and 192.168.45.1.
    When those addresses are configured, the routing table looks something like this
    (the interface names may vary in place; ignore the Internet uplink for now):


    | Destination | Gateway | Genmask | Flags Metric Ref Interface |

    |---|---|---|---|---|---|---||

    | 10.23.2.0 | 0.0.0.0 | 255.255.255.0 | U | 0 | 0 | eth0 |

    | 192.168.45.0 | 0.0.0.0 | 255.255.255.0 | U | 0 | 0 | eth1 |


    Now let''s say that the hosts on each subnet use the router as their gateway (10.23.2.1
    for 10.23.2.0/24 and 192.168.45.1/24). If 10.23.2.4 sends a packet to anything
    outside of 10.23.2.0/24, it passes the packet to 10.23.2.1. For example, a packet
    from 10.23.2.4 (Host A) to 192.168.45.1 (Host E), then the packet goes to 10.23.2.1
    (the router) via its *eth0* interface, then out through the router''s *eth1* interface.


    However, by default, the Linux kernel does not automatically move packets from
    one subnet to another. To enable this basic routing function, you need to enable
    IP forwarding in the router''s kernel with this command:


    ```

    # sysctl -w net.ipv4.ip_forward

    ```


    As soon as you enter this command, the machine should start routing packets between
    the two subnets, assuming that the hosts on those subnets know to send their packets
    to the router you created.

    To make this change permanent upon reboot, on your distribution, you may have
    the option to put it into a file in `/etc/sysctl.conf` or a file in `/etc/sysctl.d`
    so that distribution updates dont overwrite your changes.


    # 9.17 Internet Uplinks


    When the router also has the third network interface with an Internet uplink,
    this setup allows Internet access for all hosts on both subnets because they''re
    configured to use the router as the default gateway. But that''s where things
    get complicated. The problem is that certain IP addresses as 10.23.2.4 are not
    actually visible to the Internet; they''re on so-called *private networks*. To
    provide for Internet connectivity, you must set up a feature called *Network Address
    Translation (NAT)* at the router. The software on nearly all specialized routers
    does this, so there''s nothing of the ordinary here, but let''s examine the problem
    of private networks in a bit more detail.


    # 9.18 Private Networks


    Say you decide to build your own network. You have your machines, router, and
    network ready. Given what you know about a simple network so far, your next question
    is “What IP subnet should I use?”'
  merge: -1
  pgno: 240
- img_proc: true
  md: 'If you want a block of Internet addresses that every host on the Internet can
    see, you can buy one from your ISP. However, the range of IPv4 addresses is very
    limited, this costs a lot and isn''t useful for much more than running a server
    that the rest of the Internet can see. Most people dont really need this kind
    of service because they access the Internet as a client.


    The conventional alternative is to pick a private subnet from the addresses in
    the RFC 1918/6701 standards documents, shown in Table 9-2.


    # Table 9-2: Private Networks Defined by RFC 1918 and 6701


    | Network | Subnet Mask | CIDR Form |

    | 10.0.0.0 | 255.0.0.0 | 10.0.0.0/8 |

    | 192.168.0.0 | 255.255.0.0 | 192.168.0.0/16 |

    | 172.16.0.0 | 255.240.0.0 | 172.16.0.0/12 |


    You can carve up private subnet as you wish. Unless you plan to have more than
    254 hosts on a single network, pick a small subnet like 102.23.0/24, as we''ve
    been using throughout this chapter. (Networks with this mask are sometimes called
    *class C* subnets. Although the term is technically somewhat obsolete, it''s still
    useful.)


    What''s the catch? Hosts on the real Internet know nothing about private subnets
    and will not send packets to them, so without help, hosts on private subnets cannot
    talk to the outside world. A router connected to the Internet (with a true, nonprofit
    address) needs to have some way to fill the gap between connection and the hosts
    on a private network.


    # 9.19 Network Address Translation (IP Masquerading)


    NAT is the most commonly used way to share a single IP address with a private
    network, and it''s nearly universal in home and small office networks. In Linux,
    the variant of NAT that most people use is known as *IP masquerading*.


    The basic idea behind NAT is that the router doesn''t move packets from one subnet
    to another; it transforms them as it moves them. Hosts on the Internet know how
    to connect to the router, but they know about the private network behind it. The
    hosts on the private network need no special configuration; the router is their
    default gateway.


    The system works roughly like this:


    +   1. A host on the internal network wants to make a connection to the outside
    world, so it sends its connection requests through the router.


    +   2. The router intercepts the connection request packet than passing out to
    the Internet (where it would get lost because the public Internet knows nothing
    about private networks).


    +   3. The router determines the destination of the connection request packet
    and opens its own connection to the destination.'
  merge: -1
  pgno: 241
- img_proc: true
  md: '+   4. When the router obtains the connection, it fakes a “connection established”
    message back to the original internal host.

    5. The router is now the middleman between the internal host and the destination.
    The destination knows nothing about the internal host; the connection on the remote
    host looks like one from the router.


    This isn''t quite simple as it sounds. Normal IP routing knows only source and
    destination IP addresses in the Internet layer. However, if the router deals with
    the Internet layer, each host on the internal network could establish only one
    connection to a single destination at one time (among other limitations), because
    there is no information in the Internet layer of a packet to distinguish multiple
    requests from the same host to the same destination. Therefore, NAT must go beyond
    the Internet layer and dissect packets to pull out more identifying information,
    particularly the UDP and TCP port numbers from the transport layers. UDP is fairly
    easy because there are ports no connections, but the TCP transport layer is complex.


    In order to set up a Linux machine to perform as a NAT router, you must activate
    all of the following kernel configuration: network packet filtering (“firewall
    support”), connection tracking, IP tables, full NAT, and MASQUERADE target. Most
    kernels come with this support.


    Next you need to run some complex-looking iptables commands to make the router
    NAT for its private subnet. Here''s an example that applies to an internal Ethernet
    network on eth sharing an external connection at eth0 (you''ll learn more about
    the iptables syntax in Section 9:21):


    ```

    # sysctl -w net.ipv4.forward

    # iptables -P FORWARD DROP

    # iptables -t nat -A PREROUTING -o eth0 -i eth0 -j MASQUERADE

    # iptables -A FORWARD -i eth0 -m state --state ESTABLISHED,RELATED -j ACCEPT

    # iptables -A FORWARD -i eth0 -o eth0 -j ACCEPT -j

    ```


    Although NAT works well in practice, remember that it''s essentially a hack used
    to extend the lifetime of the IPv4 address space. In a perfect world, we would
    all be using IPv6 (the next-generation Internet) and using its larger and more
    sophisticated address space without any pain.


    You will likely need to use the commands above unless you''re developing your
    own software, especially with much special-purpose router hardware available.
    But the role of Linux in a network ends here.


    # 9.20 Routers and Linux


    In the early days of broadband, users with less demanding simply connected their
    machine directly to the Internet. But it didn''t take long'
  merge: -1
  pgno: 242
- img_proc: true
  md: 'for many users want to share a single broadband connection with their own networks,
    and Linux users in particular would often set up an extra machine to use as a
    router running NAT.


    Manufacturers responded to this new market by offering specialized hardware consisting
    of an efficient processor, flash memory, and several network ports—with enough
    power to manage a typical simple network, run important software such as a DHCP
    server, and use NAT.


    When it comes to software, many manufacturers turned Linux to power their routers.
    They added the necessary kernel features, stripped down the user-space software,
    and created GUI-based administration interfaces.


    Almost as soon as the first of these routers appeared, many people interested
    in digging deeper into the hardware. One manufacturer, Lynx, was required to release
    the source code for its software under the terms of the license of one its components,
    and special Linux distributions such as OpenWrt appeared for routers. The “WRT”
    in these names came from the Lynx model number.


    Aside from the hobbyist aspect, there are good reasons to use these distributions:
    they''re often more stable than the manufacturer firmware, especially on older
    router hardware, and they typically offer additional features. For example, to
    bridge a network with a wireless connection, many manufacturers require you to
    buy matching hardware, but with OpenWrt installed, the manufacturer and age of
    the hardware doesn''t really matter. This is because you''re using a truly open
    operating system on the router that doesn''t care what you use as long as your
    hardware is supported.


    You can use much of the knowledge in this book to examine the internals of custom
    Linux firmware, especially when logging in. With many embedded systems, open firmware
    tends to use BusyBox to provide many features. BusyBox is a single executable
    program that offers limited functionality for many Unix commands such as the shell,
    ls, grep, cat, and noe (This saves a significant amount of memory.). In addition,
    the boot-time intent to be very simple on embedded systems. However, you typically
    won''t find these limitations to be a problem, as custom Linux firmware often
    includes a web interface similar to what you''d see from a manufacturer.


    # 9.21 Firewalls


    Routers in particular should always include some kind of firewall to keep undesirable
    traffic out of your network. A firewall is a software and/hard configuration that
    usually sits on a router between the Internet and a smaller network, attempting
    to ensure that “bad” from the Internet harms the smaller network. You can also
    set up firewall features for each machine where the machine screens all of its
    incoming and outgoing data at the packet level (as opposed to the application
    layer, where server programs try to perform some access control of their own).
    Firewalling on individual machines is sometimes called filtering.'
  merge: -1
  pgno: 243
- img_proc: true
  md: 'A system can filter packets when it


    +   - receives a packet,

    - sends a packet, or

    - forwards (routes) a packet to another host or gateway.


    With no firewalling in place, a system just processes packets and sends them on
    their way. Firewalls put checkpoints for packets at the points of data transfer
    identified above. The checkpoints drop, reject, or accept packets usually based
    on some of these criteria:


    +   - The source or destination IP address or subnet

    - The source or destination port (in the transport layer information)

    - The firewall''s network interface


    Firewalls provide an opportunity to work with the subsystem of the Linux kernel
    that processes IP packets. Let''s look at that now.


    #  9.2.1 Linux Firewall Basics


    In Linux, you create firewall rules in a series known as a chain. A set of chains
    makes a table. As a packet moves through the various parts of the Linux networking
    subsystem, the kernel applies rules in certain chains to the packets. For example,
    after receiving a new packet from the physical layer, the kernel activates rules
    in chains corresponding to input.


    All of these data structures are maintained by the kernel. The whole system is
    called iptables, with an iptables user-space command to create and manipulate
    the rules.


    > There is a newer system called nftables that has a goal of replacing iptables,
    but as of this writing, nftables is the dominant system for firewalls.


    Because there are many tables—each with its own sets of chains, of which can contain
    many rules—packet flow can become complicated. However, you will normally work
    primarily with a single named table filter that controls basic packet flow. There
    are three basic chains in the filter table: INPUT for incoming packets, OUTPUT
    for outgoing packets, and FORWARD for routed packets.


    Figures 9-5 and 9-6 show flowcharts where rules are applied to packets in the
    filter table. There are two figures packets can either enter the system from a
    network interface (Figure 9-5) or be generated by a local process (Figure 9-6).
    As you can see, an incoming packet from the network can be consumed by a user
    process and may not reach the FORWARD chain or the OUTPUT chain. Packets generated
    by user processes won''t reach the INPUT or FORWARD chains.'
  merge: -1
  pgno: 244
- img_proc: true
  md: '![](img/1b61c74a588aedf0032126b8bd0e7422_245_0.png)


    Figure 9-5: Chain-processing sequence for incoming packets from a network


    ![](img/1b61c74a588aedf0032126b8bd0e7422_245_1.png)


    Figure 9-6: Chain-processing sequence for incoming packets from a local process


    This gets more complicated because there are many steps along the other way than
    these three chains. For example, packets are subject to PREROUTING and POSTROUTING
    chains, and chain processing can also occur at any of the three lower network
    levels. For a big diagram for everything that''s going on, search the Internet
    for "Linux filter flow," but remember that these diagrams try to include every
    possible scenario for packet input and flow. It often helps to break the diagrams
    by packet source, in Figures 9-5 and 9-6.


    # 9.21.2 Setting Firewall Rules


    Let''s look at how the IP system works in practice. Start by viewing the current
    configuration with this command:


    ```

    # iptables -L

    ```


    The output is usually an empty set of chains, as follows:


    Chain INPUT (policy ACCEPT)          destination

    target prot opt source

    Chain FORWARD (policy ACCEPT)      destination

    target prot opt source

    Chain OUTPUT (policy ACCEPT)      destination

    target prot opt source'
  merge: -1
  pgno: 245
- img_proc: true
  md: 'Each firewall has a default policy that specifies what to do with a packet
    if no rule matches the packet. The policy for all three chains in this example
    is ACCEPT, meaning that the kernel allows the packet to pass through the packet
    filtering system. The DROP policy tells the kernel to discard the packet. To set
    the policy on a chain, use iptables -P like this:


    ```

    # iptables -P FORWARD DROP

    ```


    Don''t do anything rash with the policies on your machine until you''ve read the
    rest of this section.


    Say that someone at 192.168.34.63 is annoying you. To prevent them from talking
    to your machine, run this command:


    ```

    # iptables -A INPUT -s 192.168.34.63 -j DROP

    ```


    - A INPUT parameter appends a rule to the INPUT chain. -s 192.168.34.63 part specifies
    the source IP address in the rule, and -j DROP tells the kernel to discard any
    packet matching the rule. Therefore, your machine will throw out any packet coming
    from 192.168.34.63.

    To see the rule in place, run iptables:


    | Chain INPUT (policy ACCEPT) | | | |

    | :--- | :--- | :--- | :--- |

    | target | prot source | destination | |

    | DROP | -- | -- | |

    | | all | 192.168.34.63 | anywhere |


    Unfortunately, your friend at 192.168.34.63 has told everyone on your subnet open
    connections to your SMTP port (TCP port 25). To get rid of that traffic well,
    run


    ```

    # iptables -A INPUT -s 192.168.34.0/24 -p tcp --destination-port 25 -j DROP

    ```


    This example adds a netmask qualifier to the source address as well as -p tcp
    to specify TCP packets only. A further restriction,--destination-port 25, says
    that the rule should only apply to traffic 25. The IP table list for INPUT looks
    like this:


    | Chain INPUT (policy ACCEPT) | | | | |

    | :--- | :--- | :--- | :--- | :--- |

    | target | prot source | destination | |

    | DROP | all | 192.168.34.63 | anywhere | |

    | | tcp | 192.168.34.0/24 | anywhere | tcp dpt:smtp


    All is well until you hear from someone you know at 192.168.34.37 saying that
    they can''t send you email because they blocked their machine. Thinking that is
    a quick fix, run this command:


    ```

    # iptables -A INPUT -s 192.168.34.37 -j ACCEPT

    ```'
  merge: -1
  pgno: 246
- img_proc: true
  md: 'However, it doesn''t work. To see why, look at the new chain:


    | Chain INPUT (policy ACCEPT) | destination |

    |---|---|

    | target prot opt source all 192.168.34.63 anywhere |

    | DROP all tcp 192.168.34.0/24 anywhere tcp dpt:smtp |

    | ACCEPT all all 192.168.34.37 anywhere |


    The kernel reads the chain from top to bottom, using the first rule that matches.


    The first rule does not match 192.168.34.37, but the second does, because it applies
    to all hosts from 192.168.34.1 to 192.168.34.25 and this second rule says to drop
    packets. When a rule matches, the kernel carries out the action and no further
    down in the chain. (You might notice 192.168.34.37 can send packets to any port
    on your machine except port 25 because the second rule only applies to port 25.)


    The solution is to move the third rule to the top. First, delete the third rule
    with this command:


    ```

    # iptables -D INPUT 3

    ```


    Then insert rule at the top of the chain with iptables:


    ```

    # iptables -I INPUT -s 192.168.34.37 -j ACCEPT

    ```


    To insert rule elsewhere in a chain, put the rule number after the chain name
    (for example, iptables -I INPUT 4 ...).


    # 9.2.1 Firewall Strategies


    Although the tutorial above showed how to insert rules and how the kernel processes
    IP chains, we haven''t seen firewall strategies that actually work. Let''s talk
    about that now.


    There are two basic kinds of firewall scenarios: one for protecting virtual machines
    (where you set rules in each machine''s INPUT chain) and one for protecting a
    network of machines (where you set rules in the router''s FORWARD chain). In both
    cases, you can''t have serious security if you use the default policy of ACCEPT
    and continuously insert rules to drop packets from sources that trust and deny
    bad stuff. You must allow only the packets that you trust and deny everything
    else.


    For example, say your machine has an SSH server on TCP port 22. There''s no reason
    for random host to initiate a connection to any other port on your machine, and
    you shouldn''t give any such host a chance. To set that up, first set the INPUT
    chain policy to DROP:


    ```

    # iptables -P INPUT DROP

    ```'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'To enable ICMP traffic (for ping and other utilities), use this line:


    ```

    # iptables -A INPUT -p icmp -j ACCEPT

    ```


    Make sure that you can receive packets you send to your own network IP address
    and 127.0.0.1 (localhost). Assuming your host''s IP address is my_addr, do this:


    ```

    # iptables -A INPUT -s 127.0.0.1 -j ACCEPT

    # iptables -A INPUT -s my_addr -j ACCEPT

    ```


    If you control every subnet (and trust everything on it), you can replace my_addr
    with your subnet address and subnet mask, for example, 10.23.0/24.


    Now, although you still want to deny incoming connections, you still need to make
    sure that your host can make TCP connections to the outside world. Because all
    TCP connections start with a SYN (connection request) packet, if you let all TCP
    packets through that aren''t SYN packets, you''ll still ok:


    ```

    # iptables -A INPUT -p tcp '' --syn -j ACCEPT

    ```


    Next, if you''re using remote UDP-based DNS, you must accept traffic from your
    name server that your machine can look up names with DNS. Do this for all DNS
    servers in /etc/resolv.conf. Use this command (where the name server''s address
    is ns_addr):


    ```

    # iptables -A INPUT -p udp --source-port 53 -s ns_addr -j ACCEPT

    ```


    And, finally, allow SSH connections from anywhere:


    ```

    # iptables -A INPUT -p tcp --destination-port 22 -j ACCEPT

    ```


    The preceding iptables settings work for many situations, including any direct
    connection (especially broadband) where an intruder is more likely to port-scan
    your machine. You could also adapt these settings for a forwarding router by using
    the FORWARD chain instead of INPUT and using source and destination subnets where
    appropriate. For more advanced configurations, you may find a configuration tool
    such as Shorewall to be helpful.


    This discussion has only touched on security policy. Remember that the key idea
    is to permit only the things that you find acceptable, not to try to find and
    execute the bad stuff. Furthermore, IP firewalling is only one piece of the security
    picture (You''ll see more in the next chapter.)'
