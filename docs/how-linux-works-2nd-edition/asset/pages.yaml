    # 2.3.6 echo


    The echo command prints its arguments to the standard output:


    ```

    $ echo Hello again.

    Hello again.

    ```


    The echo command is very useful for finding expansions of shell globs (“wildcards
    such as *) and variables (such as $HOME), which you will encounter later in this
    chapter.


    # 2.4 Navigating Directories


    Unix has a directory hierarchy that starts at /, sometimes called the root directory.
    The directory separator is the slash (/), not the backslash (\). There are several
    standard subdirectories in the root directory, such as /usr, as you will learn
    in Section 2.19.


    When you refer to a file or directory, you specify a path or pathname. When a
    path starts with / (such as /usr/lib), it''s a full or absolute path.


    A component identified by two dots (..) specifies the parent of a directory. For
    example, if you''re working in /usr/lib, the path .. would refer to /usr. Similarly,
    ..bin would refer to /usr/bin.


    One dot (.) refers to the current directory; for example, if you''re in /usr/lib,
    the path . is still /usr/lib, and /X11 is /usr/lib/X11. You won''t have to use
    . because commands change the current directory if a path does not start with
    / (you could just use XII instead of /X12 in the preceding example).


    A path not beginning with / is called a relative path. Most of the time, you''ll
    work with relative pathnames, because you''ll already be in the directory you
    need to be in somewhere close.


    # 2.4.1 cd


    The current working directory is the directory that a process (such as the shell)
    is currently in. The cd command changes the shell''s current working directory:


    ```

    $ cd dir

    ```'
