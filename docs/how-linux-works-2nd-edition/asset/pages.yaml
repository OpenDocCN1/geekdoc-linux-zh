    terminals. But rather than talk to a real piece of hardware, the kernel presents
    the I/O interface to a piece of software, such as the shell terminal window that
    you probably type some of your commands into.


    Common terminal devices are /dev/tty1 (the first virtual console) and /dev/pts/0
    (the first pseudoterminal device). The /dev/pts directory itself is a dedicated
    filesystem.


    The /dev/tty device is the controlling terminal of the current process. If a program
    is currently reading from and writing to a terminal, this device is a synonym
    for that terminal. A process does not need to be attached to a


