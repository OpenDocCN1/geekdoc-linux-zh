    such as Btrfs, are under development and may be poised to replace the Extended
    series.


    # 4.2.2 Creating a Filesystem


    Once you''re done with the partitioning process described in Section 4.1, you''re
    ready to create filesystems. As partitioning, you''ll do this in user space because
    a user-space process can directly access and manipulate a block device. The mkfs
    utility can create many kinds of filesystems. For example, you can create ext4
    partition on /dev/sdf2 with this command:


    ```

    # mkfs -t ext4 /dev/sdf2

    ```


    The mkfs program automatically determines the number of blocks in a device and
    sets some reasonable defaults. Unless you know what you''re doing and feel like
    reading the documentation in detail, don''t change these.


    When you create a filesystem, mkfs prints diagnostic output as it works, including
    output pertaining to the superblock. The superblock is a key component at the
    top level of the filesystem database, and it''s so important that mkfs creates
    a number of backups in case the original is destroyed. Consider keeping a few
    of the superblock numbers when mkfs runs, in case you need to recover the superblock
    in the event of a disk failure (See 4.2.11).


    Filesystem creation is a task that you should only perform after adding a new
    disk or repartitioning an old one. You should create a filesystem just once for
    each partition that has no preexisting data (or has data that you want to remove).
    Creating a new filesystem on top of an existing filesystem will effectively destroy
    the data.


    It turns out that mkfs is only a frontend for a series of filesystem programs,
    mkfs.fs, where fs is a filesystem type. So when you run mkfs -ext4, in turn runs
    mkfs.ext4.


    And there''s even more inspection. Inspect the mkfs.* files to find the


    ```

    $ ls -1 /sbin/mkfs*

    -rwxr-xr-xr-x 1 root root 17896 Mar 29 21:49 /sbin/mkfs.bfs

    -rwxr-xr-xr-x 1 root root 30280 Mar 29 21:49 /sbin/mkfs.cram

    -lrwxrwxrwx 1 root root 6 Mar 30 13:25 /sbin/mkfs.ext2 -> mkefs2

    -lrwxrwxrwx 1 root root 6 Mar 30 13:25 /sbin/mkfs.ext1 -> mkefs2

    -lrwxrwxrwx 1 root root 6 Mar 30 13:25 /sbin/mkfs.ext4 -> mkefs2

    -lrwxrwxrwx 1 root root 6 Mar 30 13:25 /sbin/mkfs.extdev -> mkefs2

    -rwxr-xr-xr-x 1 root root 26200 Mar 29 21:49 /sbin/mkfs.minix

    -lrwxrwxrwx 1 root root 7 Dec 19 2011 /sbin/mkfs.msdos -> mkdosfs

    -lrwxrwxrwx 1 root root 5 Mar 2012 /sbin/mkfs.ntfs -> mkntfs

    -lrwxrwxrwx 1 root root 7 Dec 19 2011 /sbin/mkfs.vfat -> mkdosfs

    ```'
