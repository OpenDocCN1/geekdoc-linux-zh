    > The traditional syntax for command substitution is to enclose the command in
    backticks (``), and you''ll see this in many shell scripts. The $() syntax is
    a newer form, and it is a POSIX standard and is generally easier to read and write.


    # 11.8 Temporary File Management


    It''s sometimes necessary to create a temporary file to collect output for a later
    command. When making such a file, make sure that the filename is distinct enough
    that no other programs will accidentally write to it.

    Here''s how to use the mkt command to create temporary filenames. This script
    shows you the device interrupts that have occurred in the last seconds:


    ```

    #!/bin/sh

    TMPFILE=$(mktemp /tmp/im1.XXXXX)

    TMPFILE=$(mktemp /tmp/im2.XXXXX)


    cat /proc/interrupts > $TMPFILE1

    sleep 2

    cat /proc/interrupts > $TMPFILE2

    diff $TMPFILE1 $TMPFILE2

    ```


    The argument to mtemp is a template. The command converts the XXX to a unique
    set of characters and creates an empty file with that name. This script uses variable
    names to store the filenames so you only have to change one line if you want to
    change a filename.

    Not all Unix flavors come with mtemp. If you''re having portability problems,
    it''s best to install the GNU coreutils package for your operating system.


    Another problem with scripts that employ temporary files is that if the script
    is aborted, the temporary files could be left behind. In the preceding example,
    pressing CTRL-C before the second cat command leaves a temporary file in /tmp.
    Avoid this problem by Instead, use the trap command to create a signal handler
    to catch the signal that CTRL-C generates and remove the temporary files, in this
    handler:


    ```

    #!/bin/sh

    TMPFILE=$(mktemp /tmp/im1.XXXXX)

    TMPFILE=$(mktemp /tmp/im2.XXXXX)

    trap "rm -f $TMPFILE1 $TMPFILE2; exit 1" INT

    --trap-

    ```'
