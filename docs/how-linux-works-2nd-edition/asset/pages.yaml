- img_proc: true
  md: 'Your distribution may not have the curl package preinstalled, but you should
    have no trouble installing it if necessary.


    You''ll get a lot of HTML output. Ignore it (or redirect it to /dev/null and instead
    look at the newly created trace_file. Assuming that the connection was successful,
    the first part of the file should look something like the following, at the point
    where curl attempts to establish TCP connection to the server:


    ```

    == Info: About connect() to www.wikipedia.org port 80 (HO)

    == Info: Trying 10.80.154.224... == Info: connected

    ```


    Everything you''ve seen so far happens in the transport layer or below. However,
    if this connection succeeds, curl tries to send the request (the "header\ this
    is where the application layer starts:


    ```

    => Recv header, 167 bytes (0xa7)

    0000: GET / HTTP/1.1

    0010: User-Agent: curl/7.22.0 (x86_64-linux-gnu) libcurl/7.22.0

    0050: SL/1.0.1 zlib/1.2.3 libidn/1.23 librtmp/2.3

    007f: Host: www.wikipedia.org

    0098: Accept: */

    00a5:

    ```


    The first line here is curl debugging telling you what it will do next. The remaining
    lines show what curl sends to the server; the text in bold is what you gets; the
    hexadecimal numbers at the beginning are just debugging offsets from curl to help
    you keep track of how much data was sent or received.


    You can see that curl starts by issuing a GET command to the server (as you did
    with telnet), followed by some extra information for the server and an empty line.
    Next, the server sends a reply, first with its own header, as shown here:


    ```

    < Recv header, 17 bytes (0xb11)

    0000: HTTP/1.1 200 OK

    < Recv header, 16 bytes (0x10)

    0000: Server: Apache

    < Recv header, 42 bytes (0x2a)

    0000: X-Powered-By: PHP/5.3.10-ubuntu3.9+wmmf1

    ----

    ```


    Like the previous output, the << lines are debugging output, and precedes the
    lines of output to tell you offsets.

    The header in the server''s reply can be fairly long, but at some point the server
    transitions from transmitting headers to sending the actual requested document,
    like this:


    ```

    < Recv header, 55 bytes (0xd37)

    0000: X-Cache: cp1054 hit (16), cp1054 frontend hit (223844)

    ```'
