    possibilities:


    +   - **No expect stanza** The main job process does not fork. Track the main
    process.

    - **expect fork** The process forks once. Track the forked process.

    - **expect daemon** The process forks twice. Track the second fork.

    - **expect stop** The job''s main process will raise a SIGSTOP signal to indicate
    that it is ready. (This is rare).


    For Upstart and other modern versions of init, such as systemd, the ideal case
    is the first (no expect stanza), because the main job process doesn''t have to
    include any of its startup and shutdown mechanics. In other words, it doesn''t
    need to bother with forking or detaching itself from a current terminal—nuis that
    Unix systems developers have had to deal with years.


