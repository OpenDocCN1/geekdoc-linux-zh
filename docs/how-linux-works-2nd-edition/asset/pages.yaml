  md: '![](img/1b61c74a588aedf0032126b8bd0e7422_90_0.png)


    Figure 4-1: Typical linux disk schematic


    Partitions are subdivisions of the whole disk. On Linux, they''re denoted with
    a number after the whole block device, and therefore have device names such as
    `/dev/sda1` and `/dev/sdb3`. The kernel presents each partition as a block device,
    just as it would invent an entire disk. Partitions are defined on a small area
    of the disk called a *partition table*.


    Multiple data partitions were once common on systems with large disks because
    older PCs could boot only from certain parts of the disk. Also, administrators
    used partitions to reserve a certain amount of space for operating system areas;
    for example, they didn''t want users to be able to fill up the entire system and
    prevent critical services from working. This practice is not unique to Unix; you''ll
    find many new Windows systems with several partitions on a single disk. In addition,
    most systems have a separate swap partition.


    Although the kernel makes it possible for you to access both an entire disk and
    one of its partitions at the same time, you would not normally do so, unless you
    were copying the entire disk.


    The next layer after the partition is the *filesystem*, the database of files
    and directories that you''re accustomed to interacting with in user space. We''ll
    explore filesystems in Section 4.2.


    As you can see in Figure 4-1, if you want to access the data in a file, you will
    need to get the appropriate partition location from the partition table and search
    the filesystem database on that partition for the desired file.

    To access data on a disk, the Linux kernel uses the system of layers shown in
    Figure 4-2. The SCSI subsystem and everything described'
