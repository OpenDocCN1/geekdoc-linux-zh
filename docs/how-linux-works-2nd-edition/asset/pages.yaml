  md: 'Don''t confuse the terms function and action when working with PAM. The function
    is the high-level goal: what the user application wants PAM to (authenticate a
    user, for example). An action is a specific step that PAM takes in order to reach
    that goal. Just remember that the user application invokes the function and that
    PAM takes care of the particulars with actions.


