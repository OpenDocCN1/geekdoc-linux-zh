  md: '# ## 5.4 Boot Loaders


    At the start of the boot process, before the kernel and init start, a boot loader
    starts the kernel. The task of a boot loader sounds simple: it loads the kernel
    into memory, and then starts the kernel with a set of kernel parameters. But consider
    the questions that the boot loader must answer:


    +   - Where is the kernel?

    - What kernel parameters should be passed to the kernel when it starts?


    The answers are (typically) that the kernel and its parameters are usually somewhere
    on the root filesystem. It sounds like the kernel parameters should be easy to
    find, except that the kernel is not running, so it can''t traverse a filesystem
    to find the necessary files. Worse, the kernel device normally used to access
    the BSc (LBA) are also unavailable. Think of this as a kind of “chicken or egg”
    problem.


    Let''s start with the driver concern. On PCs, boot loaders use the Basic Input/Output
    System (BIOS) or Unified Extensible Firmware Interface (UEFI) to access disks.
    Nearly all disk hardware has firmware that allows the BIOS to access attached
    storage with Linear Block Addressing (LBA). Although it exhibits poor performance,
    this mode of access allows universal access to disks. Boot loaders are often the
    programs to use the BIOS for disk access; the kernel uses its own high-performance
    drivers.


    The filesystem question is trickier: Most modern boot loaders can read partition
    tables and have built-in support for read-only filesystems. Thus, they can find
    and read files. This capability makes it far easier to dynamically configure and
    enhance the boot loader. Linux boot loaders have never had this capability; without
    it, configuring the boot loader was more difficult.


    # ### 5.4.1 Boot Loader Tasks


    A Linux boot loader’s core functionality includes the ability to do the following:


    +   - Select multiple kernels.

    - Switch between sets of kernel parameters.

    - Allow the user to manually override and edit kernel image names and parameters
    (for example, to enter single-user mode).

    - Provide support for booting other operating systems.


    Boot loaders have become considerably more advanced since the inception of the
    Linux kernel, with features such as history and menu systems, but the basic need
    has always been flexibility in kernel image and parameter selection. One interesting
    phenomenon is that certain needs have diminished. For example, you can now perform
    an emergency or recovery boot partially or entirely from a USB storage device,
    you probably won''t have to worry about manually entering kernel parameters or
    going'
