  md: '# 2.18 Archiving and Compressing Files


    # 2.18.1 gzip


    The program gzip (GNU Zip) is one of the current standard Unix compression programs.
    A file that ends with .gz is a GNU archive. Use gzip file.gz to uncompress <file>.gz
    and remove the suffix; to compress it again, use gzip file.


    # 2.18.2 tar


    Unlike the zip programs for other operating systems, gzip does not create archives
    of files; that is, it doesn''t pack multiple files and directories into one file.
    To create an archive, tar instead:


    ```

    $ tar cvf archive.tar file1 file2 ...

    ```


    Archives created by tar usually have a .tar suffix (this is by convention; it
    isn''t required). For example, in the command above, file1, file2, and so on are
    the names of the files and directories that you wish to archive in <archive>.tar.
    The c flag create mode. The r and f flags have specific roles.


    The v flag activates diagnostic output, causing tar to print the names of the
    files and directories in the archive when it encounters them. Adding another v
    causes tar to print details such as file size and permissions. If you don''t want
    tar to tell you what it''s doing, omit the v flag.


    The f flag denotes the file option. The next argument after the f flag must be
    the archive file for tar to create (in the preceding example, it is <archive>.tar).
    You must use this option followed by a filename at all times, except with tape
    drives. To use standard input or output, enter a dash (-) instead of the filename.


    # Unpacking files


    To unpack a .tar file with tar use the x flag:


    ```

    $ tar xvf archive.tar

    ```


    In this command, the x flag puts tar into extract (unpack) mode. You can extract
    individual parts of the archive by entering the names of the parts at the end
    of the command line, but you must know their exact names. (To find out for sure,
    see the table-of-contents mode described shortly.)


    > When using extract mode, remember that tar does not remove the archived .tar
    file after extracting its contents.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# Table-of-Contents Mode


    Before unpacking, it''s usually a good idea to check the contents of a .tar file
    with the table-of-contents mode by using the t flag instead of the x flag. This
    mode verifies the archive''s basic integrity and prints the names of all files.
    If you don''t test an archive before unpacking it, you can end up dumping a mess
    of files into the current directory, which can be really difficult to clean up.


    When checking an archive with the t mode, verify that everything is in a rational
    directory structure; that is, all file pathnames in start with the same directory.
    If you''re sure, create a temporary directory, change to it, and then extract.
    (You can use my * if the archive didn''t create a mess.)


    When unpacking, consider using the p option to preserve permissions. Use this
    extract mode to override your umask and get the permissions specified in the archive.
    The p option is the default when working as the superuser. If you''re having trouble
    with permissions and ownership when unpacking an archive as the superuser, make
    sure that you are waiting until the command terminates and you the shell prompt
    back. Although you may only want to extract a small part of an archive, tar must
    run through the whole thing and you must not interrupt the process because it
    sets the permissions only after checking the entire archive.


    Commit all of the tar options and modes in this section to memory. If you''re
    having trouble, make some flash cards. This may sound like grade-school, but it''s
    very important to avoid careless mistakes with this command.


    # 2.18.3 Compressed Archives (.tar.gz)


    Many beginners find it confusing that archives are normally found compressed,
    with filenames ending in .tar.gz. To unpack a compressed archive, work from the
    right side to the left; get rid of the .gz first and then worry about the .tar.
    For example, these two commands decompress and unpack <file>.tar.gz:


    ```

    $ gzip file.tar.gz

    $ tar xvf file.tar

    ```


    Starting out, you can do this one step at a time, first running gzip to decompress
    and unpack. To create a compressed archive, do the reverse; run tar first and
    gzip second. This frequently enough, and you''ll soon memorize how the archiving
    and compression process works. You''ll also get tired of all of the typing and
    start to look for shortcuts. Let''s take a look at those now.'
  merge: -1
  pgno: 62
- img_proc: true
  md: '# 2.18.4 zcat


    The method shown above isn''t the fastest or most efficient way to invoke tar
    on a compressed archive, and it wastes disk space and kernel I/O time. a better
    way is to combine archival and compression functions with a pipeline. For example,
    this command unpacks `<file>.tar.gz:`


    ```

    $ zcat file.tar.gz | tar xvf -

    ```


    The zcat command is the same as gunzip -dc. The -d option decompresses and the
    -c option sends the result to standard output (in this case, to the tar command).

    Because it''s common to use zcat, the version of tar that comes with Linux has
    a shortcut. You can use z an to automatically invoke gzip on the archive; this
    works both for extracting an archive (with the x or t modes in tar) and creating
    one (with c). For example, the following to verify a compressed archive:


    ```

    $ tar zvf file.tar.gz

    ```


    However, you should try to master the longer form before taking the shortcut.


    A .tgz file is the same as a .tar.gz file. The suffix is meant to fit into FAT
    (MS-DOS-based) filesystems.


    # 2.18.5 Other Compression Utilities


    Another compression program in Unix is bzip2, which compresses files with .bz2.
    While marginally slower than gzip, bzip2 often compresses files a little more,
    and it is therefore increasingly popular in the distribution of source code. The
    decompressing program to use is bzip2, and the options of both components are
    close enough to those of gzip that you don''t need to learn anything new. The
    bzip2 compression/decompression option for tar is j.


    A new compression program named xz is also gaining popularity. The corresponding
    decompression program is unxz, and the arguments are similar to those of gzip.


    Most Linux distributions use zip and unzip programs that are compatible with the
    zip archives on Windows systems. They work the usual .zip files as well as self-extracting
    archives ending in .exe. But if you encounter a file that ends in .Z, you have
    found a relic created by the compress program, which was once the Unix standard.
    The gzip program can unpack these files, but gzip won''t create them.'
  merge: -1
