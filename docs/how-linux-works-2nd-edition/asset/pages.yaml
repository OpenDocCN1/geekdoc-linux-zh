    # 6.6.3 run-parts


    The mechanism that System V init uses to run the init.d scripts has its way into
    many Linux systems, regardless of whether they use System V init. It''s a utility
    called run-parts, and the only thing it does is a bunch of executable programs
    in a given directory. You can think of it as almost like a person who runs the
    ls command in some directory and then runs whatever programs they see in the output.


    The default behavior is to run all programs in a directory, but you often have
    the option to select certain programs and ignore others. In some distributions,
    you don''t need control over the programs that run. For example, Fedora has a
    very simple run-parts utility.


    Other distributions, such as Debian and Ubuntu, have a more complicated run-parts
    program. Their features include the ability to run programs based on a regular
    expression (for example, using the [0-9]{2} expression for running "start" scripts
    in /etc/init.d/runlevel directory) and to pass arguments to the programs. These
    capabilities allow you to start and stop System V runlevels with a single command.


    You don''t really need to understand the details of how to use run-parts; in fact,
    most people know run-parts even exists. The main things to remember are that it
    shows up in scripts from time to time and it exists solely to run the programs
    in a given directory.


    # 6.6.4 Controlling System V init


    Occasionally, you''ll need to give init a little kick to tell it to switch runlevels,
    to reread its configuration, or to shut down the system. To control System V init,
    for example, to switch to runlevel 3, enter:


    ```

    # telinit 3

    ```


    When switching runlevels, init tries to kill off all processes not in initab file
    for the new runlevel, so be careful when changing levels.

    When you need to add or remove jobs, or make any other change to the initab file,
    you must tell init about the change and cause it to reload the file.

    The telinit command for this is:


    ```

    # telinit q

    ```


    You can also use telinit s to switch to single-user mode (see Section 6.9).'
