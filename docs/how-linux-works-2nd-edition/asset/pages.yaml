    \ a fair amount of disk activity, as seen the increasing numbers in the bi (blocks\
    \ in) and bo (blocks out) columns.\n\nThe output is quite different when you run\
    \ out of memory. As free space deletes, both the cache and size decrease because\
    \ the kernel increasingly needs the space for user processes. There is nothing\
    \ left, you'll start to see activity in the so (swapped out) column as the kernel\
