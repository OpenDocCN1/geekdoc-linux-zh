  md: 'To mount a filesystem by a UUID, use the UUID= syntax. For example, distinguish
    the first filesystem from the preceding list on /home/extra, enter:


    ```

    # mount UUID=a9011c2b-1c03-4288-b3fe-8ba961ab0898 /home/extra

    ```


    You will typically not manually filesystems by UUID as above, because you''ll
    probably not know the device, and it''s much easier to mount a device by its name
    than its crazy UUID number. It''s important to understand UUIDs. For one thing,
    they''re the preferred way to automatically mount filesystems in /etc/fstab at
    boot time (see Section 4.2.8). In addition, many distributions use the UUID as
    a mount point when insert removable media. In the preceding example, the FAT filesystem
    is on a flash media card. An Ubuntu system with logged in will mount this partition
    at /media/3762-613 upon insertion. The udev daemon described in Chapter 3 handles
    the initial event for the device insertion.


    You can change the filesystem if necessary (for example, if you copied the complete
    filesystem from elsewhere and now need to distinguish it from the original). Use
    the tune2fs(8) manual page for how to do this on ext2/ext3/ext4 filesystem.


    # 4.2.5 Disk Buffering, Caching, and Filesystems


    Linux, unlike other versions of Unix, buffers writes to the disk. This means the
    kernel usually doesn''t immediately write to filesystems when processes requests
    changes. It stores the changes in RAM until the kernel can conveniently make the
    actual change to the disk. This buffering system is transparent to the user and
    improves performance.


    When you unmount a filesystem with unmount, the kernel automatically synchronizes
    with the disk. At any other time, you can force the kernel to write the changes
    in its buffer to the disk by running the sync command. For some reason you can''t
    unmount a filesystem before you turn off the system, be to run sync first.


    In addition, the kernel has a series of mechanisms that use RAM to automatically
    cache blocks from a disk. Therefore, if one or more processes repeatedly accessed
    a file, the kernel doesn''t have to go to the disk again and again—it can simply
    read from the cache and save time


    # 4.2.6 Filesystem Mount Options


    There are many ways to change the mount command behavior, as is often necessary
    with removable media or when performing system maintenance. In fact, the total
    number of mount options is staggering. The extensive mount(8) manual page is a
    good reference, but it''s hard to know where to start and what you can safely
    ignore. You''ll see the most useful options in this section.'
  merge: -1
  pgno: 101
- img_proc: true
  md: 'Options fall into two rough categories: general and filesystem-specific ones.
    General options include -t for specifying the filesystem type (as mentioned earlier).
    In contrast, a filesystem-specific option pertains only to filesystem types.


    To activate a filesystem, use the -o switch followed by the option. For example,
    -o noexec turns off Rock Ridge extensions on an ISO 9660 filesystem, but it has
    no meaning for any other kind of filesystem.


    # Short Options


    The most important general options are these:


    +   -r The -r option mounts the filesystem in read-only mode. This has a number
    of users, from write protection to bootstrapping. You don''t need to specify this
    option when accessing a read-only device such as a CD-ROM; the system will do
    it for you (and will also tell you about the read-only status).


    +   -n The -n option mount does not try to update the runtime mount database,
    /etc/mtab. The mount operation fails when it cannot write to this file, which
    is important at boot time because the root partition (and, therefore, the system
    mount database) is read-only at first. You''ll also find this option handy when
    trying to fix a problem in single-user mode, because the system mount database
    may not be available at the time.


    +   -t The -t type option specifies the filesystem type.


    # Long Options


    Short options like -r are too limited for the ever-increasing number of mount
    options; there are too few letters in the alphabet to accommodate all possible
    options. Short options are also too troublesome because it is difficult to determine
    an option''s meaning based on a single letter. Many general options and all filesystem-specific
    options use a longer, more flexible option format.


    To use long options with mount the command line, start with -o and supply some
    keywords. Here''s a complete example, with the long options following -o:


    ```

    mount -t vfat /dev/hda1 -o ro,conv=auto

    ```


    The two long options here are ro and conv=auto. The ro option specifies read-only
    mode and is the same as the -r short option. The conv=auto option tells the kernel
    to automatically convert text files from the DOS newline format (you''ll see more
    shortly).


    The most useful long options are these:


    +   exec, noexec Enables or disables execution of programs on the filesystem.


    +   suid, nosuid Enables or disables setuid programs.'
  merge: -1
  pgno: 102
- img_proc: true
  md: 'ro Mounts the filesystem in read-only mode (as does the -r short option).


    rw Mounts the filesystem in read-write mode.


    conv-rule (FAT-based filesystems) Converts the newline characters in files based
    on rule, which can be binary, text, or auto. The default is binary, which disables
    any character translation. To treat all files as text, use the auto setting converts
    files based on their extension. For example, a .jpg file has no special treatment,
    but a .txt file does. Be careful with this option because it can damage files.
    Consider using it in read-only mode.


    # 4.2.7 Remounting a Filesystem


    There will be times you may need to reattach a currently mounted filesystem at
    the same mount point when you need to change mount options. The most common such
    situation is when you need to make a read-only-filesystem writable during crash
    recovery.


    The following command remount the root in read-write mode (you need the -n option
    because the mount command can''t write to the system mount database when the root
    is read-only):


    ```

    # mount -n -o remount /

    ```


    This command assumes that the correct device listing for in /etc/fstab (as discussed
    in the next section). If it is not, you must specify the device.


    # 4.2.8 The /etc/fstab Filesystem Table


    To mount filesystems at boot time the command, Linux systems keep a permanent
    list of filesystems and options in /etc/fstab. This is a plaintext file in a very
    simple format, as Listing 4-1.


    ```

    proc /proc nodev,noexec,nosuid 0

    UUID=70ccd6e7-6ae6-44f6-b521-aa8d0836d29 / ext4 errors=remount-ro 0 1

    UUID=592dcfd1-58da-4769-9ea8-5f412a826980 no swap sw 0 0

    /dev/sr0 iso9660 ro,nosuid,naut0 0

    ```


    Listing 4-1: List of filesystems and options in /etc/fstab


    Each line corresponds to one filesystem, each of which is broken into six fields.
    These fields are as follows, in order from left to right:


    **The device or UUID** Most Linux systems no longer use the device in /etc/fstab,
    preferring the UUID. (Notice that the /proc entry has a stand-in device named
    proc.)


    **The mount point** Indicates where to attach the filesystem.


    **The filesystem type** You may not recognize swap in this; this is a swap partition
    (see Section 4.3).'
  merge: -1
