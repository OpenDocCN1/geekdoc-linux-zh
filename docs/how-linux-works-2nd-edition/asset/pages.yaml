    match all files. In the Unix shell, \* matches only files and directories that
    contain the dot (.) character in their names. Unix filenames do not need extensions
    and often do not carry them.


    Another shell character, the question mark (?), instructs the shell to match exactly
    one arbitrary character. For example, b?at matches boat and brat.


    If you don''t want the shell to expand a glob in a command, enclose the glob in
    single quotes (''''). For example, the command echo ''\'' prints a star. You will
    find this handy for a few of commands described in the next section, such as grep
    and find. (You''ll learn more about quoting in Section 11.2.)


    It is important to remember that the shell performs expansions before running
    commands, and only then. Therefore, if a\* makes it to a command without expanding,
    the shell will do nothing with it; it''s up to the command to decide what it wants


