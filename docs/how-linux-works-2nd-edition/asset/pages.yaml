    # 11.10.5 expr


    If you need to use arithmetic operations in your shell scripts, the expr command
    can help (and even do string operations). For example, the command expr 1 + 2
    prints 3. (Run expr --help for a full list of operations.)


    The expr command is a clumsy, slow way of doing math. If you find yourself using
    it frequently, you should probably be using a language like Python instead of
    a shell script.


    # 11.10.6 exec


    The exec command is a built-in shell feature that replaces the current shell process
    with the program you name after exec. It carries out the exec() system call that
    you learned in Chapter 1. This feature is designed for saving system resources,
    remember that when you run exec in a shell script, the script and shell running
    it are gone, replaced by the new command.


    To test this in a shell window, running exec cat. After you press CTRL-D or CTRL-C
    to terminate the cat program, your window should disappear because its child process
    no longer exists.


    # 11.11 Subshells


    Say you want to alter the environment in a shell slightly but you don''t want
    a permanent change. You can change and restore a part of the environment (such
    as the path or working directory) using shell variables, but that is a clumsy
    way to go about things. The easy way around these kinds of problems is to use
    a subshell, an entirely new process that you can create to run a command or two.
    The new shell has copy of the original shell''s environment, and when the new
    shell exits, any changes you made to its shell environment disappear, leaving
    the initial shell to run as normal.


    To use a subshell, put the commands to be executed by the subshell in parentheses.
    For example, the following line executes the command uglyprogram in uglidir and
    leaves the original shell intact:'
