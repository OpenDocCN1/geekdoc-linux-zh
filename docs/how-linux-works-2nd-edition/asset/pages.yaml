    NOTE Each case must end with a double semicolon (;;) or you risk a syntax error.


    # 11.6 Loops


    There are two kinds of loops in the Bourne shell: for and while loops.


    # 11.6.1 for Loops


    The for loop (which is a “for each” loop) is the most common. Here’s an example:


    ```

    #!/bin/sh

    str in one two three four; do

    echo $str

    done

    ```


    In this listing, for, in, do, and done are all shell keywords. The shell does
    the following:


    +   1. Sets the variable str to the first of the four space-delimited values following
    the keyword (one).

    2. Runs the echo command between the do and done.

    3. Goes back to the for line, setting str to the next value (two), runs the commands
    between do and done, and repeats the process until it’s through with the values
    following the in keyword.


    The output of this script looks like this:


    ```

    one

    two

    three

    four

    ```


    # 11.6.2 while Loops


    The Bourne’s while loop uses exit codes, like the if conditional. For example,
    this script does 10 iterations:


    ```

    #!/bin/sh

    FILE=/tmp/whiletest.\$

    echo firstline > $FILE

    ```'
