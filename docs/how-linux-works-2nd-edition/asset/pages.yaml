  md: '# #6


    # # HOW USER SPACE STARTS


    ![](img/1b61c74a588aedf0032126b8bd0e7422_135_0.png)


    The point where the kernel starts its first user-space process, init, is significant—not
    just because that''s where the memory and CPU are finally ready for normal system
    operation, but because that''s where you can see how the rest of the system builds
    up as a whole. Prior to this point, the kernel executes a well-controlled path
    of execution defined by a relatively small number of software developers. User
    space is far more modular. It''s much easier to see what goes into the user space
    startup and operation. For the adventurous, it''s also relatively easy to change
    the user space startup because doing so requires no-level programming.

    User space starts in roughly this order:


    +   1. init

    2. Essential low-level services such as udevd and syslogd

    3. Network configuration'
  merge: -1
  pgno: 135
- img_proc: true
  md: '+   4. Mid- and high-level services (cron, printing, and so on)

    5. Login prompts, GUIs, and other high-level applications


    # 6.1 Introduction to init


    The init program is a user-space program like any other program on the Linux system,
    and you will find it in /sbin along with many of the other system binaries. Its
    main purpose is to start and stop the essential services on the system, but newer
    versions have more responsibilities.


    There are three major implementations of init in Linux distributions:


    +   **System V init** A traditional sequenced init (Sys V, usually pronounced
    "sys-five"). Red Enterprise Linux and other distributions use this version.


    +   **systemd** the emerging standard for init. Many distributions have moved
    to systemd, and most have not yet done so are planning to move to it.


    +   **Upstart** The init on Ubuntu installations. However, as of this writing,
    Ubuntu has also planned to migrate to systemd.


    There are other versions of init as well, especially on embedded platforms. For
    example, Android has its own. The BSDs have their version of init, but you are
    unlikely to see them on a modern Linux machine. Some distributions have modified
    the System V init configuration to resemble the BSD style.


    There are many different implementations of init because System V and other older
    versions relied on a sequence that performed only one startup at a time. Under
    this scheme, it is relatively easy to resolve dependencies. However, performance
    is not terribly good, because two parts of the boot sequence cannot normally run
    at once. Another limitation is that you can only start a fixed set of services
    as defined by init when you plug in new hardware or need a service that isn''t
    already running, there is no standardized way to coordinate the new components
    with init.


    systemd and Upstart attempt to remedy the performance issue by allowing many services
    to start in parallel thereby speeding up the boot process. Their implementations
    are quite different, though:


    +   is goal oriented. You define a target that you want to achieve, along with
    its dependencies, and when you want to reach the target. systemd satisfies the
    dependencies and resolves the target. systemd can also defer the start of a service
    until it is absolutely needed.


    +   is reactive. It receives events, and based on those events, runs jobs that
    can turn into more events, causing Upstart to run more jobs, and so on.


    The systemd and Upstart init systems also offer a more advanced way to start and
    track services. In traditional init systems, service daemons are'
  merge: -1
  pgno: 136
- img_proc: true
  md: 'expected to start themselves from scripts. A script runs a daemon program,
    which detaches itself from the script and runs autonomously. To find the PID of
    a service daemon, you need to use ps or some other mechanism specific to the service.
    In contrast, Upstart and system manage individual service daemons from the beginning,
    giving the user more power and insight into exactly what is running on the system.


    Because the new init systems are not script-centric, configuring services for
    them also tends to be easier. System V init scripts tend to contain many similar
    commands designed to start, stop, and restart services. You don''t need all of
    this redundancy with System and Upstart, which allows you to concentrate on the
    services themselves, rather than their scripts.


    Finally, vastly and Upstart both offer some level of on-demand services. Rather
    than trying to start all the services that may be necessary at boot (as System
    V init would), they start only services when needed. This idea is not really new;
    this was done with the traditional initd, but the new implementations are more
    sophisticated.


    Both system and Upstart offer some System V backward compatibility. For example,
    both support the concept of runlevels.


    # 6.2 System V Runlevels


    At any time on a Linux system, a certain base set of processes (such as crowd
    and udevd) is running. In System V init, this state of the machine is called its
    runlevel, which is denoted by a number from 0 through 6. A system spends most
    of its time in a single runlevel, but when you shut the machine down, it switches
    to a different runlevel in order to terminate the system services in an orderly
    fashion and tell the kernel to stop.


    You can check your system''s runlevel with the who -r command. A system runlevel
    shows something like this:


    ```

    $ who -r

    run-level 2 2015-09-06 08:37

    ```


    This output tells us that the current runlevel is 2, as well as the date and time
    that the runlevel was established.


    Runlevels serve various purposes, but the most common one is to distinguish between
    system startup, shutdown, single-user mode, and console mode. For example, Fedora-based
    systems traditionally used runlevels 2 through 4 for the text console; a runlevel
    of 5 means that the system will start a GUI login.


    But runlevels are becoming a thing of the past. Even though all init versions
    in this book support them, system and Upstart consider obsolete as states for
    the system. To system and Upstart, runlevels exist primarily to start services
    that support only the System V init scripts, and the implementations are so different
    that even if you''re familiar with one type of init, you won''t necessarily know
    what to do with another.'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# 6.3 Identifying your init


    Before proceeding, you need to determine your system''s version of init. If you''re
    not sure, check your system as follows:


    +   - If your system has /usr/lib/systemd and /etc/systemd directories, you have
    systemd. Go to Section 6.4.

    - If you have an /etc/init directory that contains several .conf files, you''re
    probably running Upstart (unless you''re running Debian 7, in which case you probably
    have running System V init). Go to Section 6.5.

    - If neither of the above is true, but you have an /etc/inittab file, you''re
    probably running System V init. Go to Section 6.6.


    If your system has manual pages installed, viewing the init(8) manual page should
    help identify your version.


    # 6.4 systemd


    The systemd is one of the newest init process implementations on Linux. In addition
    to handling the regular boot process, systemd aims to incorporate a number of
    standard Unix services such as cron and inetd. As such, it takes some inspiration
    from Apple''s launch. One of its most significant features is its ability to defer
    the start of services and operating system units until they are necessary.


    There are so many system features that it can be very difficult to know where
    to start learning the basics. Let''s outline what happens when system runs at
    boot:


    +   - systemd loads its configuration.

    - systemd determines its boot goal, which is usually default.target.

    - systemd determines all the dependencies of the default boot goal, dependencies
    of these dependencies, and so on.

    - systemd activates the dependencies and the boot goal.

    - After boot, systemd can react to system events (such as uevents) and activate
    additional components.


    When starting services, systemd does not follow a rigid sequence. As with other
    modern init systems, there is a considerable amount of flexibility in the system
    bootup process. Most systemd configurations deliberately try to avoid any kind
    of startup sequence, preferring to use other methods to resolve strict dependencies.


    # 6.4.1 Units and Unit Types


    One of the most interesting things about systemd is that it does not just operate
    processes and services; it can also mount filesystems, monitor'
  merge: -1
  pgno: 138
- img_proc: true
  md: 'network sockets, run timers, and more. Each type of capability is called a
    unit type, and each specific capability is called a unit. When you turn on a unit,
    you activate it.


    Rather than describe all of the unit types (you''ll find them in the systemd(1)
    manual page), here''s a look at a few of the unit types that perform the boot-time
    tasks required in Unix system:


    +   **Service units** Control the traditional service daemons on a Unix system.

    **Mount units** Control the attachment of filesystems to the system.

    **Target units** Control other units, usually by grouping them.


    The default boot goal is usually a target unit that groups together a number of
    service and mount units as dependencies. As a result, it''s easy to get a partial
    picture of what''s going on when you boot, and you can even create a dependency
    tree with the systemctl command. You''ll find the tree to be quite large on a
    typical system, because many units don''t run by default.


    Figure 6-1 shows a part of the dependency tree for the default.target unit found
    on a Fedora system. When you activate that unit, all of the units below it on
    the tree activate.


    ![](img/1b61c74a588aedf0032126b8bd0e7422_139_0.png)


    Figure 6-1: Unit Dependencies


    Boot-time and operational dependencies are more complicated than they may seem
    at first because strict dependencies are too inflexible. imagine a scenario in
    which you want to display a login prompt after starting a database server, so
    you define a dependency from the login prompt to'
  merge: -1
  pgno: 139
- img_proc: true
  md: 'the database server. However, if the database server fails, the login prompt
    will also fail due to that dependency, and you won''t be able to log in to your
    machine to fix it.


    Unit-boot tasks are fairly fault tolerant and can causing serious problems for
    standard services. For example, if a data disk for a system was removed without
    its /etc/fstab entry remained, the initial file system would fail. However, failure
    typically wouldn''t seriously affect standard operating system.


    To accommodate the need for flexibility and fault tolerance, system offers a myriad
    of dependency types and styles. We''ll label them by their keyword syntax, but
    we won''t go into details about configuration syntax until Section 6.4.3. Let''s
    first look at the basic types:


    +   **Requires** Strict dependencies. When activating a unit with a Requires dependency
    unit, systemd attempts to activate the dependency unit. If the dependency unit
    fails, system deactivates the dependent unit.


    +   **Wants** Dependencies for activation only. When activating a unit, system
    activates the unit''s Wants dependencies, but it doesn''t care if those fails.


    +   **Requisite** Units that must already be active. Before activating a unit
    with a Requisite dependency, systemd first checks the status of the dependency.
    If the dependency has not been activated, system fails on activation of the unit
    with the dependency.


    +   **Conflicts** Negative dependencies. When activating a unit with a Conflict
    dependency, systemd automatically deactivates the dependency if it is active.
    Simultaneous activation of two conflicting units fails.


    > The Wants dependency type is especially significant because it does not propagate
    failures to other units. The system documentation states that this is the way
    you should specify dependencies if possible, and it''s easy to see why. This behavior
    produces a much more robust system, similar to that of a traditional unit.


    You can attach dependencies "in reverse". For example, in order to add Unit A
    as a Wants dependency to Unit B, you don''t have to add the Wants in Unit B''s
    configuration. Instead, you can install it as a WantedBy in Unit A''s configuration.
    The same is true of the RequiredBy dependency. The configuration for (and result
    of) a "By" dependency is slightly more involved than just editing a configuration
    file; see "Enabling Units and the [Install] Section" over page 119.


    You can view your unit''s dependencies with the systemctl command, as long as
    you specify a type of dependency, such as Wants or Requires:


    ```

    # systemctl show -p type unit

    ```'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# Ordering


    None of the dependency syntax you''ve seen so far explicitly specifies order.
    By default, activating a unit with a Requires or Wants causes systemd to activate
    all of these dependencies at the same time as the first unit. It is optimal, because
    you want to start as many services as possible as quickly as possible to reduce
    boot time. However, there are situations when one unit must start after another.
    For instance, in the system that Figure 6-1 is based on, the default.target unit
    is set to start after multi-user.service (this order distinction is not shown
    in the figure).


    To activate units in a particular order, you can use the following dependency
    modifiers:


    +   **Before** The current unit will activate the listed unit(s). For example,
    if Before=bar.target appears in foo.target, systemd activates foo.target before
    bar.target.


    +   **After** The current unit activates after the listed unit(s).


    # Conditional Dependencies


    Several dependency keywords operate on various operation states rather than systemd
    units. For example:


    +   **ConditionPathExists=p**: True if the (file) path p exists in the system.


    +   **ConditionPathIsDirectory=p**: True if p is a directory.


    +   **ConditionFileNotEmpty=p**: True if p is a file and it''s not zero-length.


    If a conditional dependency in a unit is false when systemd tries to activate
    the unit, the unit does not activate, though this applies only to the unit in
    which it appears. Therefore, if you activate a unit that has a conditional dependency
    as well as some other unit dependencies, systemd attempts to activate the unit
    regardless of whether the condition is true or false.


    Other dependencies are primarily variations of the preceding. For example, the
    RequiresOverride dependency is just like Requires when running normally, but acts
    like a Wants dependency if one unit is manually activated. (For a full list, see
    the systemd.unit(5) manual page.)


    Now that you''ve seen some of the few pieces of the systemd configuration, let''s
    look at some actual unit files and how to work with them.


    # 6.4 systemd Configuration


    The systemd configuration files are spread among many directories across the system,
    so you won''t find the files for all of the units on a system in one place. That
    said, there are two main directories for systemd configuration: the *system unit*
    directory (globally configured, usually `/usr/lib/systemd/system/`) and a *system
    configuration* directory (local definitions, usually `/etc/systemd/system/`).'
  merge: -1
  pgno: 141
- img_proc: true
  md: 'To prevent confusion, stick to this rule: Avoid making changes to the system
    unit directory because your distribution will maintain it for you. Make your local
    changes to the system configuration directory. When given the choice between modifying
    system /usr and /etc, always choose /etc.


    # NOTE


    You can check the systemd configuration search path (including precedence) with
    this command:


    ```

    # systemctl -p UnitPath show

    ```


    However, this particular setting comes from a third source: pkg-config settings.
    To see the unit and configuration directories on your system, use the following
    commands:


    ```

    $ pkg-config systemd --variable=systemdunitdir

    $ pkg-config systemd --variable=systemdconfdir

    ```


    # Unit Files


    Unit files are derived from the XDG Desktop Entry Specification (for .desktop
    files, which are very similar to .ini files on Microsoft systems), with section
    names in brackets ([]) and variable and value assignments (options) in each section.

    Consider the example file media.mount in /usr/lib/systemd/system, which is standard
    on Fedora installations. This file represents /media tmpfs, which is a container
    directory for mounting removable media.


    ```

    [Unit]

    Description=Media Directory

    Before=local-fs.target

    ```


    ```

    [Mount]

    What=tmpfs

    Where=/media

    Type=tmpfs

    Options=mode=755,nosuid,nodev,noexec

    ```


    There are two sections here. The [Unit] section gives some details about the unit
    and contains description and dependency information. In particular, this is set
    to activate the local-fs.target unit.

    The [Mount] section details the unit as being a mount unit, and it gives the details
    on the mount point, type of filesystem, and the mount options described in Section
    4.2.6. The What= variable identifies the device or UUID of the device to mount.
    Here, it''s set to tmpfs because this filesystem does not have a device. (For
    a full list of mount unit options, see systemd.mount(5)

    manual page.)'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'Many other unit configuration files are similarly straightforward. For example,
    the service unit file ssh.service ensures secure shell logins:


    ```

    [Unit]

    Description=OpenSSH server daemon

    After=syslog.target network.target auditd.service

    ```


    ```

    [Service]

    EnvironmentFile=/etc/sysconfig/sshd

    ExecStartPre=/usr/bin/sshd-keygen

    ExecStart=/usr/bin/sshd -D $OPTIONS

    ExecReload=/bin/kill -HUP $MAINPID

    ```


    ```

    [Install]

    WantedBy=multi-user.target

    ```


    Because this is a target, you''ll find the details about the service in the [Install]
    section, including how to prepare, start, and reload the service. You''ll find
    a complete listing in the systemd.service (5) manual page (and in systemd.exec(5)),
    as well as in the description of process tracking in Section 6.4.6.


    # Enabling the [Install] Section


    The [Install] section in the sshd.service unit file is important because it helps
    us understand how to use systemd''s WantedBy and RequiredBy dependencies. It''s
    actually a mechanism for enabling units without modifying any configuration files.
    During normal operation


    ```

    ln -s ''/usr/lib/systemd/system/sshd.service'' ''/etc/systemd/system/multi-user.target.wants/sshd.service''

    ```


    Notice that the symbolic link is placed into a subdirectory corresponding to the
    dependent unit (multi-user.target in this case).

    The [Install] section is usually responsible for the .wants and .requires directories
    in the system configuration directory (/etc/systemd/system). However, there are
    also .wants directories in the unit configuration directory (/usr/lib/systemd/system),
    and you may also add links that don''t correspond to [Install] sections in the
    unit files. These manual additions are a simple way to add a dependency without
    modifying a unit file that may be overwritten in the future (by a software upgrade,
    for instance).'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'Enabling a unit is different from activating a unit. When you enable a unit,
    you are installing it into systemd''s configuration, making semipermanent changes
    that will survive a reboot. But you don''t need to explicitly enable a unit. If
    the unit file has an [Install] section, you must enable it with systemctl enable;
    otherwise, the existence of the file is enough to enable it. When you activate
    a unit with systemctl start, you are just turning it on in the current runtime
    environment. In addition, enabling a unit does not activate it.


    # Variables and Specifiers


    The sshd.service unit file also shows variables—specifically, the $OPTIONS and
    $MAINPID environment variables that are passed in systemd. $OPTIONS are options
    that you can pass to sshd when you activate the unit with systemctl, and $MAINPID
    is the tracked process of the service (see Section 6.4.6).


    A specifier is another variable-like feature often found in unit files. Specifiers
    start with a percent (%). For example, the % specifier is the current unit name,
    and the # specifier is the current hostname.


    The unit name can contain some interesting specifiers. You can parameterize a
    single unit file to spawn multiple copies of a service, as get processes running
    on tty1, tty2, and so. For getty, create a unit file named getty@.service. To
    use these specifiers, add the @ symbol to the end of the unit name. getty@tty1
    and getty@tty2. Anything after the @ is called the instance, and when processing
    the unit file, systemd expands the % specifier to the instance. You can see this
    in action with the getty@.service unit files that come with most distributions
    running systemd.


    # 6.4.4 systemd Operation


    You''ll interact with systemd primarily through the systemctl command, which allows
    you to activate and deactivate services, list status, reload the configuration,
    and much more.


    The most essential basic commands for obtaining unit information. For example,
    to view a list of active units on your system, issue a list-units command. (This
    is actually the default command for systemctl, so you don''t really need the list-units
    parts.)


    # $ systemctl list-units


    The output format is typical of a Unix information-listing command. For example,
    the header and the line for media.mount would look like this:


    | UNIT LOAD ACTIVE SUB JOB DESCRIPTION |

    | media.mount loaded active mounted Media Directory |


    This command produces a lot of output, as a typical system has numerous active
    units, but it will still be abbreviated because systemctl'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'truncates any really large unit names. To see the full names of the units,
    use the --full option, and to see all units (not just active), use the --all option.


    A particularly useful systemctl operation is getting the status of a unit. For
    example, here is a typical status command and its output:


    ```

    $ systemctl status media.mount

    media.mount - Media Directory

    Loaded: loaded (/usr/lib/systemd/system/media.mount; static)

    Active: active (mounted) since Wed, 13 May 2015 11:14:55 -0800

    Where: /media

    Type: tmpfs

    Process: 331 ExecMount=/bin/mount tmpfs /media -t tmpfs -o mode=755,noid,nodev,noexec
    (code=exited,status=0/SUCCESS)

    Group: name=systemd:system.mount

    ```


    Notice that there is much more information output than you would see on any traditional
    it system. You get not only the state of the unit but also the command used to
    perform the mount, the PID, and its exit status.


    One of the most interesting pieces of the output is the control group name. In
    the preceding example, the control group does not include any information other
    than the name:system/media.mount because the unit''s processes have already terminated.
    However, if you get the status of a service unit like NetworkManager.service,
    you will also see the process tree of the control group. You can view control
    groups without the rest of the unit status with the systemd-cgroups command. You''ll
    learn more about control groups in Section 6.4.6.


    The status command also displays recent information from the unit''s journal (a
    log that records diagnostic information for each unit). You can view a unit''s
    entire journal with this command:


    ```

    $ journalctl _SYSTEMD_UNIT=unit

    ```


    (This is a bit odd because journalctl can access the logs of more than just a
    system unit.) To activate, deactivate, and restart units, use the systemd start,
    stop, and restart commands. However, if you changed a unit configuration file,
    you can tell systemd to reload the file in one of two ways:


    ```

    systemctl reload unit Reloads just the configuration for unit.

    systemctl daemon-reload Reloads all unit configurations.

    ```


    Requests to activate, reactivate, and restart units are known as jobs in systemd,
    and they are essentially unit state changes. You can check the current jobs with
    system


    ```

    $ systemctl list-jobs

    ```'
  merge: -1
  pgno: 145
- img_proc: true
  md: 'If a system has been running for some time, you can reasonably expect there
    to be no active jobs on it because all of the activations should be complete.
    However, at boot time, you can log in enough to see some units so that they are
    not yet fully active. For example:


    | JOB UNIT | TYPE | STATE |

    | 1 graphical.target | start | waiting |

    | 2 multi-user.target | start | waiting |

    | 71 systemd-nlevel.service | start | waiting |

    | 75 nm-client.service | start | waiting |

    | 76 sendmail.service | start | running |

    | 120 systemd--.-one.target | start | waiting |


    In this case, job 76, the sendmail.service unit startup, is taking a long time.
    The other listed jobs are in a waiting state, most likely because they''re all
    waiting for job 76. When sendmail.service finishes starting and becomes fully
    active, job 76 will complete, the rest of the jobs will also complete, and the
    list will be empty.


    The job can be confusing, especially because Upstart, another init system described
    in this chapter, uses the word job to (roughly) refer to what systemd calls a
    unit. It''s important to remember that although a systemd job associated with
    a unit will terminate, the unit itself can be active and running afterwards, especially
    in case of service units.


    See 6.7 for how to shut down and reboot the system.


    # 6.4.5 Adding Units to systemd


    Adding units to systemd is primarily a matter of creating, activating and possibly
    enabling, unit files. You should normally put your own unit files in the system
    configuration directory /etc/systemd/system so that you won''t confuse them with
    anything that came with your distribution and so that the distribution won''t
    overwrite them when you upgrade.


    Because it''s easy to create target units that don''t activate and don''t interfere
    with anything, you should try it here. Here''s how to create two targets, one
    with a dependency on the other:


    +   1. Create a unit file named test1.target:


    ```

    [Unit]

    Description=test 1

    ```


    +   2. Create a test2.target file with a dependency on test1.target:


    ```

    [Unit]

    Description=test 2

    Wants=test1.target

    ```'
  merge: -1
  pgno: 146
- img_proc: true
  md: '+   3. Activate the test2.target unit (remember that the dependency in test2.target
