  md: '# 6.6.2 The System init Link Farm


    The contents of the rc*d directories are actually symbolic links to files in yet
    another directory, init.d. If your goal is to interact with, add, delete, or modify
    services in the rc*d directories, you need to understand these symbolic links.
    A listing of a directory such as rc5 reveals a structure like this:


    +   - lxrxwxrrw S01syslogd -> ../init.d/syslogd

    - lxrxwxrrw S02kernel -> ../init.d/kernel

    - lxrxwxrrw S15netstd_init -> ../init.d/netstd_init

    - lxrxwxrrw S18netbase -> ../init.d/netbase

    - --snip

    - lxrxwxrrw S99httpd -> ../init.d/httpd

    - --snip


    A large number of symbolic links across several subdirectories like this is called
    a link farm. Linux distributions contain these links so that they can use the
    same startup scripts for all runlevels. This convention is not a requirement,
    but it simplifies organization.


    # Starting and Stopping Services


    To start and stop services by hand, use the script in the init.d directory. For
    example, one way to start the httpd server program manually is to run init.d/httpd
    start. Similarly, to kill a running service, you can use the stop argument (httpd
    stop, for instance).


    # Modifying the Boot Sequence


    Changing the sequence in System init is normally done by modifying the link farm.
    The most common change is prevent running in a particular runlevel. You have to
    be careful how you do this. For example, you might consider removing the symbolic
    link in the appropriate rc*d directory. Beware: If you ever need to put the link
    back, you might have trouble remembering the exact name of the link. One of the
    best ways to do it is to add an underscore (_) at the beginning of the link name,
    like this:


    ```

    # mv S99httpd _S99httpd

    ```


    This changes rc to _S99httpd because the filename starts with S or K, but the
    original name is still obvious.

    To add a service, create a script like those in the init.d directory and then
    create a symbolic link in the correct rc*d directory. The easiest way is to copy
    and modify one of the scripts already in init.d that you understand (see Chapter
    11 for more information on shell scripts).'
  merge: -1
