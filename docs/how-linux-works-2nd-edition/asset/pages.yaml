  md: '# # 9

    # UNDERSTANDING YOUR NETWORK\ AND ITS CONFIGURATION


    ![](img/1b61c74a588aedf0032126b8bd0e7422_213_0.png)


    Networking is the practice of connecting computers and sending data between them.
    That sounds simple enough, but to understand how it works, you need to ask two
    fundamental questions:


    +   - How does the computer sending the data know *where* to send its data?

    - When the destination computer receives the data, how does it know *what* it
    just received?


    A computer answers these questions by using a series of components, with each
    one responsible for a certain aspect of sending, receiving, and identifying data.
    The components are arranged in groups that form *network layers*, which stack
    on top of each other in order to form a complete system. The Linux kernel handles
    networking in a similar way to the SCSI subsystem described in Chapter 3.


    Because each layer tends to be independent, it is possible to build networks with
    many different combinations of components. This is where network configuration
    can become very complicated. For this reason, we''ll'
  merge: -1
  pgno: 213
- img_proc: true
  md: 'begin this chapter by looking at the layers in very simple networks. You''ll
    learn how to view your own network settings, and when you understand the basic
    workings of each layer, you''ll be ready to learn how to configure those layers
    by yourself. Finally, you''ll move on to more advanced topics like building your
    owns networks and configuring firewalls. (Skip over that if your eyes start to
    glaze over; you can always come back.)


    # # 9.1 Network Basics


    Before getting into the theory of network layers, take a look at the simple network
    shown in Figure 9-1.


    ![](img/1b61c74a588aedf0032126b8bd0e7422_214_0.png)


    Figure 9-1: A typical local area network with a router that provides Internet
    access


    This type of network is ubiquitous; most home and small office networks are configured
    this way. Each machine connected to the network is called a *host*. The hosts
    are connected to a *router*, which is a host that can move data from one network
    to another. These machines (here, Hosts A, B, and C) and the router form a local
    area network (LAN). The connections on the LAN can be wired or wireless.


    The router is also connected to the Internet—the cloud in the figure. Because
    the router is connected to both the LAN and the Internet, all machines on the
    LAN also have access to the Internet through the router. One of the goals of this
    chapter is to see how the router provides this access.


    Your initial point of view will be from a Linux-based machine Host A on the LAN
    in Figure 9-1.


    # # 9.1.1 Packets


    A computer transmits data over a network in small chunks called *packets*, which
    consist of two parts: a *header* and a *payload*. The header contains identifying
    information such as the origin/destination hosts and basic protocol. The payload,
    on the other hand, is the actual application data that the computer wants to send
    (for example, HTML or image data).


    Packets allow a host to communicate with others "simultaneously," because hosts
    can send, receive, and process packets in any order,'
  merge: -1
  pgno: 214
- img_proc: true
  md: 'regardless of where they came from or where they''re going. Breaking messages
    into smaller units also makes it easier to detect and compensate for errors in
    transmission.


    For the most part, you don''t have to worry about translating packets and the
    data that your application uses, because the operating system has facilities that
    do this for you. However, it is helpful to know the role of packets in the network
    layers you''re about to see.


    # # 9.2 Network Layers


    A fully functioning network includes a full set of network layers called a network
    stack. Any functional network has a stack. The typical Internet stack, from the
    top to bottom layer, looks like this:


    +   **Application layer** Contains the “language” that applications and servers
    use to communicate; usually a high-level protocol of some sort. Common application
    layer protocols include Hypertext Transfer Protocol (HTTP, used for the Web),
    Secure Socket Layer (SSL), and File Transfer Protocol (FTP). Application layer
    protocols can also be combined. SSL is commonly used in conjunction with HTTP.


    +   **Transport layer** Defines the data transmission characteristics of the application
    layer. This layer includes data integrity checking, source and destination ports,
    and specifications for breaking application data into packets (if the application
    layer has not already done so). Transmission Control Protocol (TCP) and User Datagram
    Protocol (UDP) are the most common transport layer protocols. The transport layer
    is sometimes called the *protocol layer*.


    +   **Network or Internet layer** Defines how to move packets from a source to
    a destination host. The particular packet transit rule set for is known as Internet
    Protocol (IP). Because we''ll only talk about Internet networks in this book,
    we''ll really be talking about the Internet layer. However, because network layers
    are to be hardware independent, we can simultaneously configure several independent
    network layers (such as IP, IPv6, IPX, and AppleTalk) on a single host.


    +   **Physical layer** Defines how to send raw data across a physical medium,
    such as Ethernet or a modem. This is sometimes called the *link layer* or host-to-network
    layer.


    It''s important to understand the structure of a network stack because your data
    must travel through these layers at least twice before it reaches a program at
    its destination. For example, if you''re sending data from Host A to Host B, as
    shown in Figure 9-1, your bytes leave the application layer on Host A and travel
    through the transport and network layers on Host A; then they go down to the physical
    medium, across the medium, and again through the various lower levels to the application
    layer on Host B'
  merge: -1
  pgno: 215
- img_proc: true
  md: 'much the same way. If you''re sending something to a host on the Internet through
    the router, it will go some (but usually not all) of the layers on the router
    and anything else in between.


    The layers sometimes bleed into each other in strange ways because it can be inefficient
    to process all of them in order. For example, devices that historically dealt
    with only the physical layer now sometimes look at the transport and Internet
    layer data to filter and route data quickly. (Don''t worry about this when you''re
    learning the basics)


    We''ll be looking at how your Linux machine connects to the network to answer
    the where question at the beginning of the chapter. This is the lower part of
    the stack—the physical and network layers. We''ll look at the upper layers that
    answer the question.


    # 9.3 The Internet Layer


    Rather than at the very bottom of the network stack with the physical layer, we
    will start at the network layer because it can be easier to understand. The Internet
    as we currently know it is based on the Internet Protocol, version 4 (IPv4), IPv6
    gaining adoption. The most important aspects of the Internet layer is that it''s
    meant to be a software network that places no particular requirements on hardware
    or operating systems. The idea is that you can send and receive Internet packets
    over any kind of hardware, using any operating system.


    The Internet''s topology is decentralized; it''s made up of smaller networks called
    subnets. The idea is that all subnets are interconnected in some way. For example,
    in 9-1, the LAN is more than one single subnet.


    A host can be attached to more than one subnet. As you see in Section 9.1, that
    kind of host is called a router if it can transmit data from one subnet to another
    (another term for router is gateway). Figure 9-2 refines 9-1 by identifying the
    LAN as a subnet, as well as Internet addresses for each host and the router. The
    router in the figure has two addresses, the local subnet 10.2.3.1 and the Internet
    (but this Internet link is not important right now so it''s marked ''Uplink Address'').
    We''ll first look at the addresses and the subnet notation.


    Each host has at least one numeric IP address in the form of a.b.c.d, such as
    10.2.3.27. An address in this notation is called a dotted-quad sequence. If a
    host is connected to multiple subnets, it has at least one IP per subnet. Each
    host''s IP address is unique across the Entire Internet, but as you''ll see later,
    private networks and NAT can make this a little confusing.'
