  md: '# # SYSTEM CONFIGURATION:

    LOGGING, SYSTEM TIME,

    BATCH JOBS, AND USERS


    ![](img/1b61c74a588aedf0032126b8bd0e7422_173_0.png)


    When you first look in the /etc directory, you might feel a bit overwhelmed. Although
    most of the files that you see affect a system''s operations to some extent, a
    few are fundamental.


    The subject material in this chapter covers the parts of the system that make
    the infrastructure discussed in Chapter 4 available to the user-level tools covered
    in Chapter 2. In particular, we''re going to look at the following:


    +   * Configuration files that the system libraries access to get server and user
    information

    * Server programs (sometimes called daemons) that run when the system boots

    * Configuration utilities that can be used to tweak the server programs and configuration
    files

    * Administration utilities'
