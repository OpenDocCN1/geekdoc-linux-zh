    # 11.10.4 xargs


    When to run one command on a huge number of files, the command or shell may respond
    that it can''t fit all of the arguments in its buffer. Use xargs to get around
    this problem by running a command on each filename in its standard input stream.


    Many people use xargs with the find command. For example, the script below can
    help verify that every file in the current directory tree ends with .gif is a
    GIF (Graphic Interchange Format) image:


    ```

    $ find -name ''*.gif'' -print | xargs file

    ```


    In the example above, xargs runs the file command. However, this invocation can
    cause errors or leave your system open to security problems, because filenames
    can contain spaces and newlines. When writing a script, use the following instead,
    which changes the find separator and the xargs argument delimiter from a newline
    to a NULL character:


    ```

    $ find -name ''*.gif'' -print0 | xargs -0 file

    ```'
