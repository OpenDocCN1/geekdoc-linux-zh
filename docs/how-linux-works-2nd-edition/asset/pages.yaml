  md: 'For each value, you can match a single string (like bye in the preceding example)
    or multiple strings with | (hi|hello returns if $1 equals hi or hello), or you
    can use the * or patterns (what?). To make a default case that catches all possible
    values other than the case values specified, use a single * as shown by the final
