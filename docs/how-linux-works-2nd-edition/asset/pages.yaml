  md: 'usually best to let these tools do the work for you, because configuration
    can be complicated. And even if you run into a problem and need to configure manually,
    it''s usually best to create a printer using the graphical tools so that you have
    somewhere to start.


    # 14.6.2 Format Conversion and Print Filters


    Many printers, including nearly all-end models, do not understand PostScript or
    PDF. In order for Linux to support one of these printers, it must convert documents
    to a format specific to the printer. CUPS sends the document to a Raster Image
    Processor (RIP) to produce a bitmap. The RIP almost always uses the Ghostscript
    (gs) program to do most of the real work, but it''s so complicated that the bitmap
    might not fit the format of the printer. Therefore, the printer drivers that CUPS
    consult the PostScript Printer Definition (PPD) file for the CUPS printer to figure
    out settings such as resolution and paper sizes.


    # 14.7 Other Desktop Topics


    One interesting characteristic of the Linux desktop environment is that you can
    generally choose which pieces you want to use and stop using the ones that you
    dislike. For a survey of many of the desktop projects, have a look at the mailing
    lists and project links for the various projects at http://www.freedesktop.org/.
    Elsewhere, you''ll find other desktop projects, such as Ayatina, Unity, and Mir.


    Another major development in the Linux desktop is the Chromium OS source project
    and its Google Chrome OS counterpart found on Chromebook PCs. This is a Linux
    system that uses much of the desktop technology described in this chapter but
    is centered around the Chromium/Chrome web browsers. Much of what''s found on
    a traditional desktop has been stripped away in Chrome OS.'
