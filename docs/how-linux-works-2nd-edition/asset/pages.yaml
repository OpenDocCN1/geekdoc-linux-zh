  md: '# Options Use long options separated by commas.

    Backup information for use by the dump command You should always use a 0 in this
    field.


    The filesystem integrity test order To ensure that fsck runs on the first root,
    always set it to 1 for the root filesystem and 2 for any filesystems on a hard
    disk. Use 0 to disable the boot check for everything else, including CD-ROM drives,
    and the /proc filesystem (the fsck command in Section 4.2.11).


    When mounting, you can take shortcuts if the filesystem you want to work with
    is in /etc/fstab. For example, if you are using Listing 4-1 and mounting a CD-ROM,
    you would simply mount /cdrom.


    You can also try to mount all entries in /etc/fstab that do not contain the noauto
    option with this command:


    ```

    # mount -a

    ```


    Listing 4-1 contains some new options, namely errors, noauto, and user, because
    they don''t apply outside the /etc/fstab file. In addition, you''ll often see
    the defaults option here. The meanings of these options are as follows:


    +   defaults Uses the mount defaults: read-write mode, enable device files, executables,
    the setuid bit, and so on. Use when you don''t want to give the filesystem any
    special options but you want to fill all fields in /etc/fstab.


    +   errors This et2-specific parameter sets the kernel behavior when the system
    has troubling a filesystem. The default is normally errors-continue, meaning that
    the kernel should return an error code and keep running. To have the kernel try
    the mount again in read-only mode (and your system) use errors-remount-ro. The
    errors-panic setting tells the kernel (and your system) to halt when there is
    a problem with the mount.


    +   noauto This option allows a mount -a command to ignore the entry. Use this
    to prevent a boot-time mount of a removable-media device, such as a CD-ROM or
    floppy drive.


    +   user This option allows unprivileged users to run on a particular entry, which
    can be handy for allowing access to CD-ROM drives. Users can put a setuid-root
    file on removable media with another system, this option also sets nosuid, noexec,
    and nodev (to bar special devices).


    # 4.2.9 Alternatives to /etc/fstab


    Although the /etc/fstab file has been the traditional way to represent filesystems
    and their mount points, two new alternatives have appeared. The first is an /etc/fstab.d
    directory that contains individual filesystem configuration files (one file for
    each filesystem). The idea is very similar to many configuration directories that
    you''ll see throughout this book.'
