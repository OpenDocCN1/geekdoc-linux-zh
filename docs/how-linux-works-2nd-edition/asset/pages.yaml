- img_proc: true
  md: 'The /etc/passwd file syntax is fairly strict, allowing for no comments or

    blank lines.


    > A user in /etc/passwd and a corresponding home directory are collectively known
    as

    an account.


    # 7.3.2 Special Users


    You will find a few users in /etc/passwd. The superuser (root) always

    has UID 0 and GID 0, as in Listing 7-2. Some users, such as daemon, have

    login privileges. The nobody user is an underprivileged user. Some-

    cess run as nobody because the nobody user cannot write to anything

    the system.


    The users that cannot log in are called pseudo-users. They can''t

    log in, the system can start processes with their user IDs. Pseudo-users

    as nobody are usually created for security reasons.


    # 7.3.3 The /etc/shadow File


    The shadow file (/etc/shadow) on a Linux system normally contains

    user authentication information, including the encrypted passwords and

    password expiration information that correspond to the users in /etc/passwd.

    The shadow file was introduced to provide a more flexible (and

    secure) of storing passwords. It included a suite of libraries and utili-

    ties, of which were once replaced by pieces of PAM (see Section 7.10).

    Rather than introduce an entirely new set of files for Linux, PAM uses

    /etc/shadow, but certain corresponding configuration files such as

    etc/login.defs.


    # 7.3.4 Manipulating Users and Passwords


    Regular users interact with /etc/passwd using the passwd command. By default,

    pass changes the user password, but you can also use -f to change the user

    real name or -s to change the user''s shell to one listed in /etc/shells.

    (You can also use the commands chfn and chsh to change the real name\and shell).
    The passwd command is a sudo-root program, because only the

    superuser can change the /etc/passwd file.


    # Changing /etc/passwd as the Superuser


    Because /etc/passwd is plaintext, the superuser may use any text editor to

    make changes. To add a user, simply add an appropriate line and create

    home directory for the user; to delete, do the opposite. However, to edit

    the file, you''ll most likely use the vi program, which backs up and

    locks the /etc/passwd while you''re editing it as an added precaution. To edit

    /etc/shadow instead of /etc/passwd, use vi -s. (You''ll likely need to

    do this, though.)'
