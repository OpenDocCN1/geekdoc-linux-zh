  md: '# 6.6.1 System V init: Startup Command Sequence


    You are now ready to learn how System V init starts system services, before lets
    you log in. Recall this inittab line from earlier:


    S5:wait:/etc/rc.d/rc5


    This small line triggers many other programs. In fact, rc starts for run commands,
    which many people refer to as scripts, programs, or services. Where are these
    commands?


    The 5 in this line tells us that we''re talking about runlevel 5. The commands
    are probably either in /etc/rc.d/rc5.d or /etc/rc5.d. (Runlevel 1 uses rc1.d,
    runlevel 2 uses rc2.d, and so on). For example, you might find the following items
    in the rc5.d directory:


    ```

    S10syskdlog   S20init       S99gpm

    S12kernel    S2netstd_nfs  S99httpd

    S1netstd_init S50netstd_misc S99rmnlogin

    S18base      S45pcmcia    S89at

    S20acct      S99ssd

    s20logout    S89cron

    ```


    The rc 5 command starts in the rc5.d directory by executing the following commands
    in this sequence:


    ```

    S10syskdlog start

    12kernel start

    S1netstd_init start

    S18base start

    --snip--

    s99ssd start

    ```


    Notice the start argument in each command. The capital S in command name means
    that the command should run in start mode, and the number (00 through 99) determines
    which in the sequence rc starts the command. rc*.d commands are usually shell
    scripts that start programs in /bin or /usr/bin.


    Normally, you can figure out what a particular command does by viewing the script
    with less or another pager.


    > Some rc directories contain commands that start with K (for "kill," or "stop
    mode"). In this case, rc runs the command with the stop argument instead of start.
    You will most encounter K commands in runlevels that shut down the system.


    You can run these commands by hand. However, you normally want to go through the
    init.d directory instead of the rc*.d directories, which we will now describe.'
