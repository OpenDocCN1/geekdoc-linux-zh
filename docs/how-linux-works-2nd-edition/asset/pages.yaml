    systemd wants a reasonable amount of information and control over every process
    it starts. The main problem that it faces is a service can start in different
    ways; it may fork new instances of itself or ever daemonize and detach itself
    from the original process.


    To minimize the work that a package developer or administrator needs to do in
    order to create a working unit file, systemd uses groups (cgroups), an optional
    Linux kernel feature that allows for finer tracking of a process hierarchy. If
    you''ve worked with Upstart before,'
