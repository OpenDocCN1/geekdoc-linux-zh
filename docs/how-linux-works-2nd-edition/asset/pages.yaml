  md: 'for a high-level view of how the kernel is swapping pages in and out, how busy
    the CPU is, and IO utilization.


    The trick to unlocking the power of vmstat is to understand its output. For example,
    here''s some output from vmstat 2, which reports statistics every 2 seconds:


    | vmstat 2 | ---memory--- | ---swap---| | ---system---| ---cpu--- |

    | r b swpd free buff cache si so bo bo in cs us yd wa |

    | 2 0 320416 302796 198636 0 0 0 1 0 2 15 23 0 8 |

    | 2 0 320416 302728 198636 1 0 0 0 1182 407 636 1 9 9 |

    | 1 0 320416 302679 1027572 0 0 0 0 58 281 541 0 9 9 |

    | 0 0 320493 198648 1074924 0 0 0 0 308 541 0 9 1 |

    | 0 0 320493 198648 1074948 0 0 0 0 208 416 0 9 9 |

    | 0 0 320680 198648 102616 0 0 0 0 207 389 0 100 0 |


    The output falls into categories: processes, for memory usage, swap for the pages
    pulled in and out of swap, disk usage, for the number of times the kernel switches
    to kernel code, and cpu for the time used by different parts of the system.


    The preceding output is typical for a system that isn''t doing much. You''ll start
    looking at the second line of output—the first one is an average for the entire
    uptime of the system. For example, the system has 320416KB of memory swapped out
    to the disk (swp) and around 3250000KB (3 GB) of free memory. Even though zero-valued
    si (swap-in) and so (swap-out) columns report that the kernel is not swapping
    anything in or out of the disk. The buff column indicates the amount the kernel
    is using for disk buffers (see Section 4.2.5).


    On the right, under the CPU heading, you see the distribution of CPU time in the
    us, sy, and wa columns. These list (in order) the percentage of time that the
    CPU is spending on tasks (user, kernel), idle, and waiting for I/O. For example,
    there aren''t many user processes running (they''re using a maximum of 1 percent
    of the CPU); the kernel is doing practically nothing, while the CPU is sitting
    around doing nothing 99 percent of the time.


    Now, what when a big program starts up some later (the first two lines occur right
    before the program runs):


