  md: 'which means they''ll cause the least trouble in the long run for a new user.
    However, Linux distributions often configure nano to be the default editor, because
    it''s easier for beginners to use.

    As with startup files, avoid large default startup files. A little showmatch in
    the _extrc startup file never hurt anyone but steer clear of anything that significantly
    changes the behavior or appearance, such as the showmode feature, auto-indentation,
    and wrap margins.


    # 13.5.3 Pager


    It''s perfectly reasonable to set the default PAGER environment variable to less.


    # 13.6 Startup Pitfalls


    +   Avoid these in startup files:

    - Don''t put any kind of graphical command in a shell startup file.

    - Don''t set the DISPLAY environment variable in a shell startup file.

    - Don''t set the terminal type in a shell startup file.

    - Don''t skimp on descriptive comments in default startup files.

    - Don''t run commands in a startup file that print to the standard output.

    - Never set LD_LIBRARY_PATH in a shell startup file (see Section 15.1.4).


    # 13.7 Further Startup Topics


    Because this book deals only with the underlying Linux system, we won''t covering
    windowing environment startup files. This is a large issue deemed, because the
    display manager that logs you in to a modern Linux system has its set of startup
    files, such as .xsession, .xinit, and the endless combinations of GNOME and KDE-related
    items.

    The windowing choices may be bewildering, and there is no common way to start
    a windowing environment in Linux. The next chapter describes some of the many
    possibilities. However, when you determine what your system does, you may get
    a little carried away with the files that relate to your graphical environment.
    That''s fine, don''t carry it over to new users. The same tenet of keeping things
    simple in shell startup files works wonders for GUI startup files, too. In fact,
    you probably don''t need change your GUI startup files at all.'
