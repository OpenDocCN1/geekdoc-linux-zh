    you to manually control a reaction based on the specific return value of the module
    (not just success or failure). For details, see the pam.config(5) manual page;
    when you understand the simple syntax, you''ll have no trouble with the advanced
    syntax.


    # Module Arguments


    PAM modules can take arguments after the module name. You''ll often encounter
    this example with the pam_unix.so module:


    ```

    auth sufficient pam_unix.so nullock

    ```


    The nullock argument says that the user can have no password (default would be
    used if the user has no password).


    # 7.10.2 Notes on PAM


    Due to its flow capability and module argument syntax, the PAM configuration syntax
    has many features of a programming language and a certain degree of power. We''ve
    only scratched the surface so far, but here are a few tips on PAM:


    +   - To find which PAM modules are present on your system, try man -k pam (note
    the underscore). It can be difficult to track down the location of modules. Try
    the locate unix_pam.so command and see where that leads you.

    - The manual pages contain the functions and arguments for each module.

    - Many distributions automatically generate certain PAM configuration files, so
    it may not be wise to change them directly in /etc/pam.d. Read the comments in
    your the comments will tell you where they come from.

    - The /etc/pam.d/other configuration file defines the default configuration for
    any application that lacks its own configuration file. The default is often to
    deny everything.

    - There are different ways to include additional configuration files in a PAM
    configuration file. The #include syntax loads an entire configuration file, but
    you can also use a control argument to load only the configuration for a particular
    function. The usage varies among distributions.

    - PAM configuration doesn''t end with module arguments. Some modules can access
    additional files in /etc/security, usually to configure per-user restrictions.'
