- img_proc: true
  md: '![](img/1b61c74a588aedf0032126b8bd0e7422_25_0.png)


    # # THE BIG PICTURE


    ![](img/1b61c74a588aedf0032126b8bd0e7422_25_1.png)


    At first glance, a modern operating system such as Linux is very complicated,
    with a dizzying number of pieces simultaneously running and communicating. For
    example, a web server can talk to a database server, which could in turn use a
    shared library that many other programs use. But how does it all work?


    The most effective way to understand how an operating system works is through
    abstraction—a fancy way of saying that you can ignore most of the details. For
    example, when you ride in a car, you normally don''t need to think about details
    such as mounting bolts that hold the motor inside the car or the people who build
    and maintain the road upon which the car drives. If you''re a passenger in a car,
    all you really need to know is what the car does (transports you somewhere else)
    and a few basics about how to use it (how to operate the door and seat belt).'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'But if you''re driving a car, you need to know more. You need to learn how
    to operate the controls (such as the steering wheel and accelerator pedal) and
    what to do when something goes wrong.


    For example, let''s say that the car is rough. Now you can break up the abstraction
    of "a car that rolls on a road" into three parts: a car, a road, and the way you''re
    driving. This helps isolate the problem: If the road is bumpy, you don''t blame
    the car or that you''re driving it. Instead, you may want to find out why the
    road has deteriorated, or if the road is new, when the construction workers did
    a lousy job.


    Software developers use abstraction as a tool when building an operating system
    and applications. There are many terms for abstract division in computer science,
    including subsystem, module, and package—we''ll use the term component in this
    chapter because it''s simple. When building a software component, developers typically
    don''t think much about the internal structure of other components, but they do
    care about what components they can use and how to use them.


    This chapter provides a high-level overview of the components that make up a Linux
    system. Although each one has a tremendous number of technical details in its
    internal makeup, we''re going to ignore these details and concentrate on what
    the components do in relation to the whole system.


    # 1.1 Levels and Layers of Abstraction in a Linux System


    Using abstraction to split computing systems into components makes things easier
    to understand, but it doesn''t work without organization. We arrange components
    into layers or levels. A layer or level is a classification (or grouping) of a
    component according to where that component sits between the user and the hardware.
    Web browsers, games, and such sit at the top layer; at the bottom we have the
    memory in the computer hardware—the OS and Is. The operating system occupies most
    of the layers in between.


    A Linux system has three main levels. Figure 1-1 shows these levels and some of
    the components inside each level. The hardware is at the base, hardware includes
    the memory as well as one more central processing units (CPUs) to perform computation
    and to read and write to memory. Devices as disks and network interfaces are also
    part of the hardware.


    The next level is the kernel, which is the core of the operating system. The kernel
    is software residing in memory that tells the CPU what to do. The kernel manages
    the hardware and acts primarily as an interface between the hardware and any running
    program.


    Processes—the running programs that the kernel manages—collectively make up the
    system''s upper level, called user space. (A more specific term for process is
    user process, regardless of whether a user directly interacts with the process.
    For example, all web servers run as user processes.)'
  merge: -1
  pgno: 26
- img_proc: true
  md: '![](img/1b61c74a588aedf0032126b8bd0e7422_27_0.png)


    # Linux Kernel


    ![](img/1b61c74a588aedf0032126b8bd0e7422_27_1.png)


    # Hardware


    ![](img/1b61c74a588aedf0032126b8bd0e7422_27_2.png)


    Figure 1-1: General Linux system organization


    There is a critical difference between the ways that the kernel and user processes
    run: The kernel runs in *kernel mode*, and the user processes run in *user mode*.
    Code running in kernel mode has unrestricted access to the processor and main
    memory. This is a powerful but dangerous privilege that allows a kernel process
    to easily crash the entire system. The area that only the kernel can access is
    called *kernel space*.


    User mode, in comparison, restricts access to a (usually quite small) subset of
    memory and safe CPU operations. User space refers to the parts of main memory
    that the user processes can access. If a process makes a mistake and crashes,
    the consequences are limited and can be cleaned up by the kernel. This means that
    if your web browser crashes, it won''t take down the scientific computation that
    you''ve been running in the background-for days.


    In theory, a user process gone haywire can''t cause serious damage to the rest
    of the system. It depends on what you consider "serious damage," as well as the
    particular privileges of the process, because some processes are allowed to do
    more than others. For example, can a user process completely wreck the data on
    a disk? With the correct permissions, yes—and you may consider this to be fairly
    dangerous. There are safeguards to prevent this, however, and most processes aren''t
    allowed to wreak havoc in this manner.'
  merge: -1
