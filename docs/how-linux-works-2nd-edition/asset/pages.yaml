  md: '# 13


    # USER ENVIRONMENTS


    ![](img/1b61c74a588aedf0032126b8bd0e7422_311_0.png)


    This book''s primary focus is on the Linux system that normally lies underneath
    server processes and interactive user sessions. But eventually, the system and
    the user have to meet somewhere. Startup files play an important role at this
    point, because they set defaults for the shell and other interactive programs.
    They determine how the system behaves when a user logs in.


    Most users don''t pay close attention to their startup files, only touching them
    when they want to add something for convenience, such as an alias. Over time,
    the files become cluttered with unnecessary environment variables and tests that
    can lead to annoying (or quite serious) problems.


    If you''ve had your Linux machine for a while, you may notice that your home directory
    accumulates a baffling large array of startup files over time. These are sometimes
    called dot files because they nearly always start with a dot (.). Many of these
    are automatically created when you first run a program, and you''ll never need
    to change them. This chapter primarily'
  merge: -1
  pgno: 311
- img_proc: true
  md: 'covers startup files, which are the ones you''re most likely to modify or rewrite
    from scratch. Let''s first look at how much care you need to take when working
    on these files.


    # 13.1 Guidelines for Creating Startup Files


    When designing startup files, keep the user in mind. If you''re the only user
    on a machine, you don''t have to worry about because errors only affect you and
    they''re easy to fix. However, if you''re creating startup files meant to be the
    defaults for all new users on a machine or network, or if you think that someone
    might copy your files for use on a different machine, your task becomes considerably
    more difficult. If you make an error in a startup file for 10 users, you might
    end up fixing this error 10 times.


    Keep two essential goals in mind when creating startup files for other users:


    +   **Simplicity** Keep the number of startup files small, and keep the files
    as small and simple as possible so that they are easy to modify but hard to break.
    Each item in a startup file is just one more thing that can break.


    +   **Readability** Use extensive comments in files so that the users get a good
    picture of what part of a file does.


    # 13.2 When to Alter Startup Files


    Before making a change to a startup file, ask yourself whether you really should
    be making that change. Here are some good reasons for changing startup files:


    +   - You want to change the default prompt.

    - You need to accommodate some critical locally installed software. (Consider
    wrapper scripts first, though.)

    - Your existing startup files are broken.


    If everything in your Linux distribution works, be careful. Sometimes the default
    startup files interact with other files in `/etc`.

    That said, you probably wouldn''t be reading this if you weren''t interested in
    changing the defaults, so let''s examine what''s important.


    # 13.3 Shell Startup File Elements


    What goes into a shell startup file? Some things might seem obvious, as the path
    and a prompt setting. But what exactly should be in the path, and what does a
    reasonable prompt look like? And how much is too much to put in a startup file?


    The next sections discuss the essentials of a shell startup file—from the command
    path, prompt, and aliases through the permissions mask.'
  merge: -1
  pgno: 312
- img_proc: true
  md: '# 13.3.1 The Command Path


    The most important part of any shell startup file is the command path. The path
    should cover the directories that contain every application of interest to a regular
    user. At the very least, the path should contain these components, in order:


    ```

    /usr/local/bin

    /usr/bin

    /bin

    ```


    This order ensures that you can override default programs with site-specific variants
    located in /usr/local.

    Most Linux distributions install executables for all packed software in /usr/bin.
    There are occasional differences, such as putting games in /usr/games and graphical
    applications in a separate location, so check your system''s defaults. And make
    sure that every-use program on the system is available through one of the directories
    listed above. If not, your system is probably getting out of control. Don''t change
    the default path in your user environment to accommodate a new software installation
    directory. A cheap way to separate installation directories is to use symbolic
    links in /usr/local/bin.


    Many users use a **bin** of their own to store shell scripts and programs, so
    you may want to add this to the front of the path:


    ```

    $HOME/bin

    ```


    > A newer convention is to place binaries in $HOME/.local/bin.


    If you''re interested in systems utilities (such as traceroute, ping, and ismod),
    add the sbin directories to your path:


    ```

    /usr/local/sbin

    /usr/sbin

    /sbin

    ```


    # Adding Dot (.) to the Path


    There is one small controversial command path component to discuss: the dot. A
    dot (.) in your path allows you to run programs in the current directory without
    using ./ in front of the program name. This may seem convenient when writing scripts
    or compiling programs, but it''s a bit bad idea for two reasons:


    +   It can be a security problem. You should *never* put a dot at the front of
    the path. Here''s an example of what can happen: An attacker could put a Trojan
    horse named ls in an archive distributed on the Internet. Even if a dot were at
    the end of the path, you''d still be vulnerable to typos such as sl or ks.'
  merge: -1
  pgno: 313
- img_proc: true
  md: '+   It is inconsistent and can be confusing. A dot in a path can mean that
    a command''s behavior will change according to the current directory.


    # 13.3.2 The Manual Page Path


    The traditional manual page path was determined by the MANPATH environment variable,
    but you shouldn''t set it because doing so overrides the system defaults in /etc/manpath.config.


    # 13.3.3 The Prompt


    Experienced users tend to avoid long, complicated, useless prompts. In comparison,
    many administrators and distributions drag everything into the default prompt.
    Your choice should reflect your users'' needs;place the current working directory,
    hostname, and username in the prompt if it really helps.


    Above, avoid characters that mean something significant to the shell, such as
    these:


    ```

    { } = & <

    ```


    > Take extra care to avoid the > character, which can cause erratic, empty files
    to appear in your current directory if you accidentally copy and paste a section
    of your shell-window (recall that $ redirects output to a file).


    Even a shell''s default prompt isn''t ideal. For example, the default bash prompt
    contains the shell name and version number.


    This simple prompt for bash ends with the customary $ (the tra-ditional csh prompt
    ends with %):


    ```

    PS1=''\u\$

    ```


    The u is a substitution for the current username (see the PROMPING section of
    the bash (1) manual page). Other popular substitutions include the following:


    +   - The hostname (the short form, without domain names)

    - The history number

    - The current directory. Because this can become long, you can limit the display
    to just the final component with \.

    - $ if running as a user account, # if root


    # 13.3.4 Aliases


    Among the sticky points of modern user environments is the role of aliases, a
    shell feature that substitutes one string for another before'
  merge: -1
  pgno: 314
- img_proc: true
  md: 'executing a command. These can be efficient shortcuts that save some typing.
    However, aliases also have these drawbacks:


    +   * It can be tricky to manipulate arguments.

    * They are confusing; a shell''s built-in command can tell you something is an
    alias, but it won''t tell you where it was defined.

    * They are frowned upon in subshells and noninteractive shells; they do not work
    in other shells.


    Given these disadvantages, you should probably avoid aliases whenever possible
    it is easier to write a shell function or an entirely new shell script. Modern
    computers can start and execute shells so quickly that the difference between
    an alias and an entirely new command should mean nothing to you.


    That said, aliases do come handy when you wish to alter a part of the shell''s
    environment. You can''t change an environment variable with a shell script, because
    scripts run as subshells. (You can also define functions to perform this task.)


    # 13.3.5 The Permissions Mask


    As described in Chapter 2, a shell''s built-in umask (permission mask) facility
    sets your permissions. You should run umask in one of your startup files to make
    certain that any program you create runs files with your desired permissions.
    The two reasonable choices these are:


    077 This is the most restrictive permissions mask because it doesn''t give any
    other users access to new files and directories. This is often appropriate on
    a multi-user system where you don''t want others to look at any of your files.
    However, when set as the default, it can sometimes lead to problems when users
    want to share files but don''t understand how to set permissions correctly. (Inexperienced
    users have a tendency to set files to a writable-only mode.)


    022 This mask gives others access to new files and directories. This can be important
    on a single-user system because many daemons that run as pseudo-users are not
    able to see files and directories created with the most restrictive 077 umask.


    > Certain applications (especially mail programs) override the umask, changing
    it to 077 because they feel that their files are the business of no one but the
    file owner.


    # 13.4 Startup File Order and Examples


    Now that you know what to put into startup files, it''s time to see some specific
    examples. Surprisingly, one of the most difficult and confusing parts of creating
    startup files is determining which of several startup files to use. The next sections
    cover the two most popular Unix shells: bash and tsh.'
  merge: -1
  pgno: 315
- img_proc: true
  md: '# 13.4.1 The bash Shell


    In bash, you can choose from the startup filenames .bash_profile, .profile, .bash_login,
    and .bashrc. Which one is appropriate for your command path, manual page path,
    prompt, aliases, and permissions mask? The answer is that you should have a .bashrc
    file accompanied by a .bash symbolic link pointing to .bashrc because there are
    a few different kinds of bash shell instance types.


    The two main shell instances are interactive and noninteractive, but of those,
    only interactive shells are of interest because noninteractive shells (such as
    those that run shell scripts) usually don''t run any startup files. Interactive
    shells are the ones you use to run commands from a terminal, such as the ones
    you''ve seen in this book, and they can be classified as login or non-login.


    # Login Shells


    Traditionally, a login shell is what you get when you first log in to a system
    with the terminal using a program such as /bin/login. Logging remotely with SSH
    also gives you a login shell. The basic idea is that login shell is an interactive
    shell. You can tell if a shell is a login shell by running echo $; if the first
    character is a -, the shell''s a login shell.


    When bash runs as login shell, it runs /etc/profile. Then it looks for a user''s
    .bash_profile, .bash_login, and .profile files, running only the first one it
    sees.


    As strange as it sounds, it is possible to run a noninteractive shell as a login
    shell to force it to run startup files. To do so, start the shell with -1 or --login.


    # Non-Login Shells


    A non-login shell is an additional shell that you run after you log in. It is
    simply any interactive shell that''s not a login shell. Windowing system terminal
    programs (xterm, GNOME Terminal, and so on) start non-login shells unless specifically
    ask for a login shell.


    Upon starting up as a non-login shell, bash runs /etc/bashrc and then runs the
    user''s .bashrc.


    # The Consequences of Two Kinds of Shells


    The reason behind the two different startup filesystems is that in the old days,
    users logged through a traditional terminal with a login shell, started non-login
    subshells with windowing systems or the screen program. For the non-login subshells,
    it was deemed a waste to repeat the user environment and run a bunch of programs
    that already been run. With login shells, you could fancy startup commands in
    a file such as .bash_profile, leaving only aliases and other "lightweight" things
    to .bashrc.


    Nowadays, most desktop users log in through a graphical manager (you''ll learn
    more about these in the next chapter). Most of these start with one noninteractive
    login shell in order to preserve the login versus'
