  md: 'On most networks with a netmask of 255.255.255.0, the router is usually at
    address 1 of the subnet (for example, 10.23.2.1 in 10.23.2.0/24). Because this
    is simply a convention, there can be exceptions.


    # 9.5 Basic ICMP and DNS Tools


    Now it''s time to look at some basic practical utilities to help you interact
    with hosts. These tools use two protocols of particular interest: Internet Control
    Message Protocol (ICMP), which can help you root out problems with connectivity
    and routing, and the Domain Name Service (DNS) system, which maps names to IP
    addresses so that you don''t have to remember a bunch of numbers.


    # 9.5.1 ping


    ping (see http://arp.arl.mil/~mike/ping.html) is one of the most basic debugging
    tools. It sends ICMP echo packets to a host that asks it to return the packet
    to the sender. If the recipient host gets the packet and is configured to reply,
    it sends an ICMP response in return.


    For example, say you run ping 10.23.2.1 and get this output:


    ```

    $ ping 10.23.2.1

    P 10.23.2.1 (10.23.2.1) 56(84) bytes of data.

    64 bytes from 10.23.2.1: icmp_req=1 ttl=64 time=1.76 ms

    64 bytes from 10.23.2.1: icmp_req=2 ttl=64 time=2.35 ms

    64 bytes from 10.23.2.1: icmp_req=4 ttl=64 time=1.69 ms

    64 bytes from 10.23.2.1: icmp_req=5 ttl=64 time=1.61 ms

    ```


    The first line says that you''re sending 56-byte packets (84 bytes, including
    the headers) to 10.23.2.1 (by default, one packet per second), and the remaining
    lines indicate responses from 10.23.2.1. The most important parts of the output
    are the sequence number (icmp_req) and the round-trip time (time). The number
    of bytes returned is the size of the packet plus 8. (The content of the packets
    isn''t important to you.)


    A gap in the sequence numbers, such as the one between 2 and 4, usually means
    there''s some kind of connectivity problem. It''s possible for packets to arrive
    out of order, and if they do, there''s some kind of problem because ping sends
    only one packet a second. If a response takes more than a second (1000ms) to arrive,
    the connection is extremely slow.


    The round-trip time is the total elapsed time between the moment that the request
    packet leaves and the moment that the response packet arrives. There''s no way
    to reach the destination


    On a wired LAN, you should expect absolutely no packet loss and very low numbers
    for the round-trip time. (The preceding example output is from a wireless network.)
    You should also expect no packet loss from your network to and your ISP and reasonably
    round-trip times.'
