  md: '# 16.5 Applying a Patch


    Most changes to software source code are available as branches of the developer''s
    online version of the source code (such as a git repository). However, every now
    and then, you might get a patch that you need to apply against source code to
    fix bugs or add features. You may also see the diff as a synonym for the diff
    program produces the patch.

    The beginning of a patch looks like this:


    ```

    --- src/file.c.orig  2015-07-17 14:29:12.000000000+0100

    +++ src/file.c      2015-09-18 10:22:17.000000000+0100

    @@ -2,16 +2,12 @@

    ```


    Patches usually contain alterations to more than one file. Search the patch for
    dashes in a row (--) and always looking at the patch to determine the required
    working directory. Notice that the preceding example refers to src/file.c. Therefore,
    you should change the directory that contains src before applying the patch, not
    to the src directory itself.

    To apply the patch, run the patch command:


    ```

    $ patch -p0 < patch_file

    ```


    If everything goes well, patch exits without a fuss, leaving you with an updated
    set of files. However, patch may ask you this question:


    File to patch:


    This usually means that you are not in the correct directory, but it could also
    identify that your source code does not match the source code in the patch. In
    this case, you''re out of luck: Even if you could identify some of the files to
    patch, others would not be properly updated, leaving you with source code that
    you could not compile.


    In some cases, you might come across a patch that refers to a package version
    like this:


    ```

    --- package-3.42/src/file.c.orig  2015-07-17 14:29:12.000000000+0100

    +++ package-3.42/src/file.c      2015-09-18 10:22:17.000000000+0100

    ```


    If you have a slightly different version (or if you just renamed the directory),
    you can tell patch to strip leading components. For example, say you were in the
    directory that contains src (as before). To tell patch to ignore the package-3.42/
    part of the path (that is, strip one leading component), use -p1:


    ```

    $ patch -p1 < patch_file

    ```'
