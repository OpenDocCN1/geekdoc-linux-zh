- img_proc: true
  md: '| Table 11-1: File Type Operators |

    | Operator | Tests For |

    | -f | Regular file |

    | -d | Directory |

    | -h | Symbolic link |

    | -b | Block device |

    | -c | Character device |

    | -p | Named pipe |

    | -S | Socket |


    **NOTE** The *test* command follows symbolic links (except for the -h test). That
    is, if link is a symbolic link to a regular file, [ -f *link* ] returns an exit
    code of true (0).


    | Table 11-2: File Permissions Operators |

    | Operator | Operator |

    | -r | Readable |

    | -w | Writable |

    | -x | Executable |

    | -u | Setuid |

    | -g | Setgid |

    | -k | "Sticky"


    Finally, three *binary* operators (tests that need two files as arguments) are
    used in file tests, but they''re not terribly common. Consider this command that
    includes -nt (newer):


    ```

    [ *file1 -nt file2* ]

    ```


    This exits if *file1* has a newer modification date than *file2*. The -ot (older
    than) operator does the opposite. And if you need to detect identical hard links,
    -ef compares two files and return true if they share numbers and devices.


    # **String Tests**


    You''ve seen the binary string operator = returns true if its operands are equal.
    The !== operator returns true if its operands are not equal. There are two unary
    string operations:


    +   - -z Returns true if its argument is empty ([ -z "" ] returns 0)

    - -n Returns true if its argument is not empty ([ -n "" ] returns 1)'
