    # 6.4.8 systemd System V Compatibility


    One feature that sets systemd apart from other newer-generation init systems is
    that it tries to do a more complete job of tracking services started by System
    V–compatible init scripts. It works like this:


    +   1. First, systemd activates runlevel=<N>, where N is the runlevel.

    2. For each symbolic link in /etc/rc<N>.d, systemd identifies the script in /etc/init.d.

    3. systemd associates the name with a service unit (for example, /etc/init.d/foo
    would be foo.service).

    4. systemd activates the service unit and runs the script with either a start
    or stop agent, based on its name in rc<N>.d.

    5. systemd attempts to associate any processes from the script with the service
    unit.


    Because systemd makes the association with a service unit, you can use systemctl
    to restart the service or view its status. But don''t expect any miracles from
    System V compatibility mode; it still must run the init scripts serially, for
    example.


    # 6.4.9 systemd Auxiliary Programs


    When starting out with systemd, you may notice the exceptionally large number
    of programs in /lib/systemd. These are primarily support programs for units. For
    example, udev is part of systemd, and you''ll find it there as system-udev. Another,
    the systemd-fsck program, works as a middleman between systemd and fsck.


    Many of these programs exist because they contain notification mechanisms that
    standard system utilities lack. Often, they simply run the standard system units
    and notify systemd of the results. (After all, it would be silly to reimplement
    all of fsck inside systemd.)


    > One interesting aspect of these programs is that they are written in C, because
    one goal of systemd is to reduce the number of shell scripts on a system. There
    is some debate about whether it''s a good idea to do so (after all, many of these
    programs would probably be written as shell scripts), but as long as everything
    works and does so reliably, securely, and reasonably quickly, there''s little
    reason to bother taking sides.


    When you see a program in /lib/systemd that you can''t identify, see the manual
    page. There''s a good chance that the manual page will not only describe the utility
    but also describe the type of unit that it''s meant to augment.'
