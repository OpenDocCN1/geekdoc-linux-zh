  md: 'By default, the nice value is 0. Now, say you''re running a big computation
    in the background that you don''t want to bog down your interactive session. To
    have that process take a backseat to other processes and run only when the other
    tasks have nothing to do, you could change the nice value to 20 with the renice
    command (where pid is the process ID of the process that you want to change):


    ```

    $ renice 20 pid

    ```


    If you''re the superuser, you can set the nice value to a negative number, but
    doing so is almost a bad idea because system processes may not get enough CPU
    time. In fact, you probably won''t need to alter nice values much because many
    Linux systems have only a single user, and that user does not perform much real
    computation.(The nice value was much important back when there were many users
    on a single machine.)


    # 8.8 Load Averages


    CPU performance is one of the easier metrics to measure. The load average is the
    number of processes currently ready to run. That is, it is an estimate of the
    number of processes that are capable of using the CPU at any given time. When
    thinking about a load average, keep in mind that most processes on your system
    are usually waiting for input (the keyboard, mouse, network, or for example),
    meaning that most processes are not ready to run and should contribute nothing
    to the load average. Only processes that are doing something affecting the load
    average.


    # 8.8.1 Using uptime


    The uptime command tells three load averages in addition to how long the kernel
    has running:


    ```

    $ uptime

    ... up 91 days, ... load average: 0.08, 0.03, 0.01

    ```


    The three bolded numbers are the load averages for the past 1 minute, 5 minutes,
    and 15 minutes, respectively. As you can see, this system isn''t busy: An average
    of 0.01 processes have been running across all processors for the past 15 minutes.
    In other words, if you had one processor, it only running user-space applications
    for 1 percent of the last 15 minutes.(Traditionally, most desktop systems would
    exhibit a load average of about 0 when you were doing anything except compiling
    a program or playing a game. A load average of 0 is usually a good sign, because
    it means your processor isn''t being challenged and you''re saving power.)'
  merge: -1
  pgno: 204
- img_proc: true
  md: 'User interface components on current desktop systems tend to occupy more of
    the CPU than those in the past. For example, on Linux systems, a web browser''s
    Flash plugin can be a notorious resource hog, and Flash applications can easily
    occupy much of a system''s CPU and memory due to poor-all implementation.


    If a average goes up to around 1, a single process is probably using the CPU nearly
    all of the time. To identify that, use the top command; the process will usually
    rise to the top of the display.


    Most modern systems have more than one processor core or CPU, multiple processes
    can easily run simultaneously. If you have two cores, a load average of 1 means
    that only one of the cores is actively active at any given time, and a load average
    of 2 means that both cores have enough to do all of the time.


    # 8.8.2 High Loads


    A load average does not necessarily mean that your system is having trouble. A
    system with enough memory and I/O resources can handle many running processes.
    If your load average is high and your system responds well, don''t panic: The
    system just has a lot of processes sharing the CPU. The processes have to compete
    with each other for processor time, and as they were each allowed to use the CPU
    all of the time. Another case where you might see a high load average as normal
    is a web server, where processes start and terminate so quickly that the load
    average mechanism start and terminate so quickly that the load average measurement
    mechanism can''t function effectively.


    However, if you sense that the system is low and the load average is high, the
    system is low on memory, the kernel can start to thrash, or rapidly swap memory
    for processes to and from the disk. When this happens, many processes will become
    ready to run, but their memory might not be available, so they will remain in
    the ready-to-run state (and contribute to the load average) for much longer than
    they normally would.


    We''ll now look at memory in much more detail.


    # 8.9 Memory


    One of the simplest ways to check your system''s memory status is to run the free
    command or view /proc/meminfo to see how much real memory is being used for caches
    and buffers. As we just mentioned, if there isn''t much cache/buffer memory being
    used (and the rest of the real memory is taken), you may need more memory. However,
    it''s too easy to blame shortage of memory for every performance problem on your
    machine.'
  merge: -1
  pgno: 205
- img_proc: true
  md: '# 8.9.1 How Memory Works


    Recall from Chapter 1 that the CPU has a memory management unit (MMU) that translates
    the virtual memory addresses into real ones. The kernel assists the MMU by breaking
    the memory into smaller chunks *pages*. The kernel maintains a data structure,
    like a *page table*, that contains a mapping of the process'' virtual page addresses
    to real page addresses in memory. As a process accesses memory, the MMU translates
    the virtual addresses used by the process into real addresses based on the kernel''s
    page table.


    A user process does not actually need all of its pages to be immediately available
    in order to run. The kernel generally loads and allocates pages as a process needs;
    this system is known as *on-demand paging* or *demand paging*. To see how this
    works, consider how a program starts and runs as a new process:


    +   1. The kernel loads the beginning of the program''s instruction code into
    memory pages.

    2. The kernel may allocate some working-memory pages to the new process.

    3. As the process runs, it might reach a point where the next instruction in its
    code isn''t in any of the pages the kernel initially loaded. At this point, the
    kernel takes over, the necessary pages into memory, and then lets the program
    resume execution.

    4. Similarly, if the program requires more working memory than was initially allocated,
    the kernel handles it by finding free pages (or making room) and assigning them
    to the process.


    # 8.9.2 Page Faults


    If a memory page is not ready when a process wants to use it, the process triggers
    a *page fault*. In the event of a page fault, the kernel takes control of the
    CPU from the process in order to get the page ready. There are two kinds of page
    faults: minor and major.


    # Minor Page Faults


    A minor page fault occurs when the desired page is actually in memory but the
    MMU doesn''t know where it is. This can happen when the process requests more
    memory or when the MMU doesn''t have enough space to store all of the page locations
    for a process. In this case, the kernel tells the MMU about the page and permits
    the process to continue. Minor page faults aren''t such a big deal, and many occur
    as a process runs. Unless you need maximum performance from some memory-intensive
    program, you probably shouldn''t worry about them.


    # Major Page Faults


    A major page fault occurs when the desired page isn''t in memory at all, which
    means the kernel must load it from the disk or'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'some other storage mechanism. A lot of major page faults will bog the system
    down because the kernel must do a substantial amount of work to provide the pages,
    robbing normal processes of their chance to run.


    Some major page faults are unavoidable, such as those that occur when you load
    the code from disk when running a program for the first time. The biggest problems
    happen when you start out of memory and the kernel starts to swap pages of working
    memory out to the disk in order to make room for new pages.


    # Watching Page Faults


    You can drill down to the page faults for individual processes with the ps, top,
    and time commands. The following command shows a simple example of how the time
    command displays page faults. (The output of the cal command doesn''t matter,
    so we are discarding it by redirecting to /dev/null.)


    ```

    $ /usr/bin/time cal > /dev/null

    0.00user 0.00system 0.06elapsed 0%CPU (avgtext+avgdata 3328maxresident)64inputs+0outputs
    (2major+254minor)pagefaults 0swaps

    ```


    As you can see from the bolded text, this are 2 major page faults and 254 minor
    ones. The major page faults occurred when the kernel needed to load the program
    from the disk for the first time. If you run the command again, you probably wouldn''t
    get any major page faults because the kernel would have cached the pages from
    the disk.


    If you''d rather see the page faults of processes as they''re running, use top
    or ps. When running, use f to change the displayed fields and u to display the
    number of major page faults. (The results will show up in a new, nFL column. You
    won''t see the minor page faults.)


    When using ps, you can use a custom output format to view the page faults for
    processes. Here is an example for process ID 20365:


    ```

    $ ps -o pid,min_flt,maj_flt 20365

    PID MINFL MAFL

    20365 83482 23

    ```


    The MINFL and MAFL columns show the number of minor and major page faults. Of
    course, you can combine this with any other process selection options, as described
    in the ps (1) manual page.


    Viewing page faults by process can help you zero in certain problematic components.
    However, if you''re interested in your system performance as a whole, you need
    a tool to summarize CPU and memory action across all processes.


    # 8.10 Monitoring CPU and Memory Performance with vmstat


    Among the many tools available to monitor system performance, the vmstat command
    is one of the oldest, with minimal overhead. You''ll find it handy'
