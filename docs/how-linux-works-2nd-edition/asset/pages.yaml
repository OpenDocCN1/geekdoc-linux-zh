    # 15.5 Scripting Languages


    A long time ago, the average Unix systems manager didn''t have to worry

    much about scripting languages other than the Bourne and awk.

    Shell scripts (discussed in Chapter 11) continue to be an important part

    of Unix, which has faded somewhat with arrived, and many systems programs have

    switched from C to scripting languages (such as the sensible version

    of the which program). Let''s look at some scripting basics.


    The first thing you need to know about any scripting language is that

    t first line of a script looks like the shebang of a Bourne shell script. For

    example, a Python script starts out like this:


    ```

    #!/usr/bin/python

    ```


    Or this:


    ```

    #!/usr/bin/env python

    ```


    In Unix, any executable text file starts with #! is a script. The

    path following this prefix is the scripting language interpreter execut-

    able. When Unix tries to run an executable file that starts with a #! shebang,

    it runs the program with the # with the rest of the file as the standard

    input. therefore, this is a script:


    ```

    #!/usr/bin/tail -2

    This program won''t print this line,

    but it will print this line...

    and this line, too.

    ```


    The first line of a shell script often contains one of the common

    basic script problems: an invalid path to the scripting language interpreter.

    For example, you named the previous script myscript. What if tail were

    actually in /bin instead of /usr/bin on your system? In that case, running\myscript
    would produce this error:


    ```

    bash: ./myscript: /usr/bin/tail: bad interpreter: No such file or directory

    ```


