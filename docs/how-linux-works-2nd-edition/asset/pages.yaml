    # # 10.10 Unix Domain Sockets


    Applications that use network facilities don''t have to involve two separate hosts.
    Many applications are built as client-server or peer-to-peer mechanisms, where
    processes running the same machine use process communication (IPC) to negotiate
    what needs to be done and who does it. For example, recall that daemons as systemd
    and NetworkManager use D-Bus to monitor and react to system events. Use regular
    IP networking over localhost (127.0.0.1) to communicate, but instead, typically
    use a special kind of socket, which will be touched upon in Chapter 3, called
    a Unix domain socket. When a process connects to a Unix domain socket, it behaves
    almost exactly like a network socket: It can listen for and accept connections
    on the socket, and you can even choose between different kinds of socket types
    to make it behave like TCP or UDP.


    > > It is important to remember that a Unix domain socket is not a network socket,
    and there''s no network behind it. You don''t even need networking to be configured
    to use one. And Unix domain sockets don''t have to be bound to socket files. A
    process can create an unnamed Unix domain socket and share the address with another
    process.


