- img_proc: true
  md: '# 1.2 Hardware: Understanding Main Memory


    Of all of the hardware on a computer system, main memory is perhaps the most important.
    In its most raw form, main memory is just a big storage area for a bunch of 0s
    and 1s. Each 0 or 1 is a bit. This is where the running kernel and processes reside—they
    are just collections of bits. All input and output from peripheral devices flows
    through main memory, as a bunch of bits. A CPU is just an operator on memory;
    it reads its instructions and data from the memory and writes back out to the
    memory.


    You''ll often hear the term state in reference to memory, processes, the kernel,
    and other parts of the computer. Strictly speaking, a state is a particular arrangement
    of bits. For example, if you have four bits in your memory, 0111, 0000, and 1011
    represent three different states.


    When you consider that a single process can consist of millions of bits in memory,
    it''s even easier to use abstract terms when talking about states. Instead of
    using a state bits, you describe what something has done or is doing at the moment.
    For example, you might say "the process is waiting for input" or "the process
    is performing Stage 2 of its startup."


    > Because it''s common to refer to the state in abstract terms rather than the
    actual bits, the term memory refers to a particular arrangement of bits.


    # 1.3 The Kernel


    Why are we talking about main memory and states? Nearly everything that the kernel
    revolves around main memory. One of the kernel''s tasks is to split memory into
    many subdivisions, and it must maintain certain state information about those
    subdivisions at all times. Each process gets its own share of memory, and the
    kernel must ensure that each process keeps to its


    The kernel is in charge of managing tasks in four general system areas:


    +   **Processes** The kernel is responsible for determining which processes are
    allowed to use the CPU.


    +   **Memory** The kernel needs to keep track of all memory—what is currently
    allocated to a particular process, what might be shared between processes, and
    what is free.


    +   **Device drivers** The kernel acts as an interface between hardware (such
    as a disk) and processes. It''s usually the kernel''s job to operate the hardware.


    +   **System calls and process** Processes normally use system calls to communicate
    with the kernel.


    We''ll now briefly explore each of these areas.'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'If you''re interested in the detailed workings of a kernel, two good textbooks
    are Operating System Concepts, 9th edition, by Abraham Silbersatz, Peter B. Galvin,
    and Greg Gagne (Wiley, 2012) and Modern Operating Systems, 4th edition, by Andrew
    S. Tanenbaum and Herbert Bos (Prentice Hall, 2014).


    # 1.3.1 Process Management


    Process management describes the starting, pausing, resuming, and terminating
    of processes. The concepts behind starting and terminating processes are fairly
    straightforward, but describing how a process uses the CPU in its normal course
    of operation is a bit more complex.


    On any operating system, many processes run “simultaneously.” For example, you
    might have a web browser and a spreadsheet on a desktop computer at the same time.
    However, things are not as they appear: The processes between these applications
    do not run exactly the same time.


    Consider a system with a one-core CPU. Many processes may be able to use the CPU,
    but only one process may actually use the CPU at any given time. In practice,
    each process uses the CPU for a small fraction of a second, and pauses; then another
    process uses the CPU for another small fraction of a second; and so on. The act
    of one process giving up control of the CPU to another process is called a context
    switch.


    Each piece of time—called a time slice—gives enough time for significant computation
    (and indeed, a process finishes its current task during a slice). However, because
    the slices are so small, humans can''t perceive them, and the system appears to
    be running multiple processes at the same time (a capability known as multitasking).


    The kernel is responsible for context switching. To understand how this works,
    let''s think about a situation in which a process is running in user mode but
    its slice is up. Here''s what happens:


    +   1. The CPU (the actual hardware) interrupts the current process based on an
    internal timer, switches into kernel mode, and hands control back to the kernel.

    2. The kernel records the current state of the CPU and memory, which will be essential
    to resuming the process that was interrupted.

    3. The kernel performs any tasks that might have come up during the preceding
    time slice (such as collecting data from input and output, or I/O operations).

    4. The kernel is now ready to run another process run. The kernel analyzes the
    list of processes that are ready to run and chooses one.

    5. The kernel prepares the memory for this new process, and then prepares the
    CPU.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '+   6. The kernel tells the CPU how long the time slice for the new process
    will last.


    +   7. The kernel switches the CPU into user mode and hands control of the CPU
    to the process.


    The context switch answers the important question of when the kernel runs. The
    is that it runs between time slices during a context switch.


    In the case of a multi-CPU system, things become slightly more complicated because
    the kernel doesn''t need to relinquish control of its current CPU in order to
    allow a process to run on a different CPU. However, to maximize the usage of all
    available CPUs, the kernel typically does so anyway (and may use certain tricks
    to grab a little CPU time for itself).


    # 1.3.2 Memory Management


    Because the kernel must manage memory during a context switch, it has a complex
    job of memory management. The kernel''s job is complicated because the following
    conditions must hold:


    +   - The kernel has its own private area in memory that user processes can''t
    access.


    +   - Each user process needs its own section of memory.


    +   - One user process may not access the private memory of another process.


    +   - User processes can share memory.


    +   - Some memory in user processes can be read-only.


    +   - The system can use more memory than is physically present by using disk
    as auxiliary.


    Fortunately for the kernel, there is help. Modern CPUs include a memory management
    unit (MMU) that enables a memory scheme called virtual memory. When using virtual
    memory, a process does not directly access the memory by its physical location
    in the hardware. Instead, the kernel sets up each process to act as if it had
    an entity itself. When the process accesses some of its memory, the MMU intercepts
    the access and uses a memory address to translate the memory location from the
    process into an actual physical location on the machine. The kernel must still
    initialize and continuously maintain and alter this memory address map. For example,
    during a context switch, the kernel has to change the map from the outgoing process
    to the incoming process.


    The implementation of a memory address map is called a page table.


    You''ll learn more about how to view memory performance in Chapter 8.'
  merge: -1
