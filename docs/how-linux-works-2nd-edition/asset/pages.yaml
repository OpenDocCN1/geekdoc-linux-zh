  md: '# 11.3.1 Individual Arguments: $1, $2, ...


    $1, $2, and all variables named as positive nonzero integers contain the values
    of the script parameters, or arguments. For example, say the name of the following
    script is pshow:


    ```

    #!/bin/sh

    echo First argument: $1

    echo Third argument: $3

    ```


    Try running the script as follows to see how it prints the arguments:


    ```

    ./pshow one two three

    First argument: one

    Third argument: three

    ```


    The built-in shell command shift can be used with argument variables to remove
    the first argument ($1) and advance the rest of the arguments forward. Specifically,
    $2 becomes $1, $3 becomes $2, and so on. For example, assume that the name of
    the following script is shift:


    ```

    #!/bin/sh

    echo Argument: $1

    shift

    echo Argument: $1

    shift

    echo Argument: $1

    ```


    Run it like this to see it work:


    ```

    ./shift one two three

    Argument: one

    Argument: two

    Argument: three

    ```


    As you can see, shifttex prints all three arguments by printing the first, shifting
    the remaining arguments, and repeating.


    # 11.3.2 Number of Arguments: #$


    The # variable holds the number of arguments passed to a script and is especially
    important when running shift in a loop to pick through arguments. When $# is 0,
    no arguments remain, so $1 is empty. (See Section 11.6 for a description of loops)


    # 11.3.3 All Arguments: $@


    The $@ variable represents all of a script''s arguments, and is very useful for
    passing them to a command inside a script. For example, Ghostscript commands (gs)
    are usually long and complicated. Suppose you want a shortcut for rasterizing
    a PostScript file at 150 dpi, using the standard'
  merge: -1
