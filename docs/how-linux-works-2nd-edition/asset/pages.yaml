  md: 'files because the most useful [ tests involve file properties. For example,
    the following line checks whether file is a regular file (not a directory or special
    file):


    ```

    -f file

    ```


    In a script, you might see the -f test in a loop which tests all of the items
    in the current working directory (you''ll learn more about loops in general shortly):


    ```

    for filename in *; do

    if [ -f $filename ]; then

    ls -l $filename

    else

    echo $filename is not a regular file.

    done

    ```


    You can invert a test by placing the ! operator before the test arguments. For
    example, [ ! -f file ] returns true if file is not a regular file. Furthermore,
    the -a and -o flags are logical "and" and "or" operators (for example, [ -f file
    -a file ]).


    > Because the test command is so widely used in scripts, many versions of the
    shell (including bash) incorporate the test command as a built-in. This can speed
    up scripts because the shell doesn''t have to run a separate command for each
    test.


    There are dozens of tests, all of which fall into three categories: file tests,
    string tests, and arithmetic tests. The info manuals complete online documentation,
    but the test(1) manual page is a fast reference. The following sections outline
    the main tests. (I''ve omitted some of the common ones).


    # File Tests


    Most tests, like -f, are called unary operations which require only one argument:
    the file to test. For example, here are two important file tests:


    ```

    -e Returns true if a file exists

    -s Returns true if a file is not empty

    ```


    Several operations inspect a file''s type, meaning that they can determine whether
    something is a regular file, a directory, or some kind of device, as listed in
    Table 11-1. There are also a number of operations that check a file''s permissions,
    as listed in Table 11-2. (See Section 2.17 for an overview of permissions.)'
  merge: -1
