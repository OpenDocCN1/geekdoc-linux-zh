- img_proc: true
  md: 'The Kernel also supports user processes with features other than system calls,
    the most common of which are pseudodevices. Pseuddevices look like devices to
    user processes, but they are implemented purely in software. As such, they don''t
    technically need to be in the kernel, and they are usually there for practical
    reasons. For example, the kernel random number generator device (/dev/random)
    would be difficult to implement without a user process.


    > NOTE Technically, a user process that accesses a pseudodevice still has to use
    a system call to open the device, so processes can''t avoid system calls.


    # # 1.4 User Space


    As mentioned earlier, the main memory that the kernel allocates for user processes
    is called user space. Because a process is simply a state (or image) in memory,
    user space also refers to the memory for the entire collection of running processes.
    You may also hear the informal term used for user space.


    Most of the real action on a Linux system happens in user space. Although all
    processes are essentially equal from the kernel''s point of view, they perform
    different tasks for users. There is a rudimentary service (or level) structure
    to the kind of system components that user processes together and on a Linux system.
    Basic services are at the bottom level (closest to the kernel), utility services
    are in the middle, and applications that users touch are at the top. Figure 1-3
    is a greatly simplified diagram because only six components are shown, but you
    can see that the components at the top are closest to the user (the user interface
    and web browser); the components in the middle level has a mail server that serves
    the web browser; and there are several smaller components at the bottom.


    ![](img/1b61c74a588aedf0032126b8bd0e7422_32_0.png)


    Figure 1-3: Process types and interactions'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'The bottom level tends to consist of small components that perform single,
    uncomplicated tasks. The middle level has larger components such as mail, print,
    and database services. Finally, components at the top level perform complicated
    tasks that the user often controls. Components also use other components. Generally,
    if one component wants to use another, the second component is either at the same
    service level or below.


    Figure 1-3 is only an approximation of the arrangement of user space. In reality,
    there are no rules in user space. For example, most applications and services
    write diagnostic messages as logs. Most programs use the standard syslog to write
    log messages, but some prefer to do all of the logging processes.


    In addition, it''s difficult to categorize some user-space components. Server
    components such as web and database servers can be considered very high-level
    applications because their tasks are often complicated, so you might place these
    at the top level in Figure 1-3. However, user applications may depend on these
    services to perform tasks they''d rather not do themselves, so you could also
    make a case for them at the middle level.


    # Users


    The Linux kernel supports the traditional concept of a Unix user. A user is an
    entity that can run processes and open files. A user is associated with a username.
    For example, a system could have a user named billyjoe. However, the kernel does
    not manage the usernames; instead, it identifies users by numeric identifiers
    called userids.(You''ll learn more about how the usernames correspond to userids
    in Chapter 7.)


    Users exist to support permissions and boundaries. Every user-space process has
    a user owner, and processes are said to run as the owner. A user may terminate
    or modify the behavior of its processes (within certain limits), but it cannot
    interfere with other users'' processes. In addition, users may open files and
    choose whether they share them with other users.


    A Linux system normally has a number of users in addition to the ones that correspond
    to the real beings who use the system. You''ll read about these in more detail
    in Chapter 3, but the most important user to know about is root. The root user
    is an exception to the preceding rules because root may terminate and alter another
    user''s processes and read any file on the local system. For this reason, root
    is known as the superuser. A person who can operate as root is said to have root
    access and is an administrator on a traditional Unix system.'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'Operating as root can be dangerous. It can be difficult to identify and correct
    mistakes because the system will let you do anything, even if what you''re doing
    is harmful to the system. For this reason, system designers constantly try to
    make root access unnecessary as possible, for example, by not requiring root access
    to switch between wireless networks on a notebook. In addition, as powerful as
    the root user is, it is still runs in the operating system''s user mode, not kernel
    mode.


    Groups are sets of users. The primary purpose of groups is to allow a user to
    share file access to other users in a group.


    # 1.6 Looking Forward


    So far, you''ve seen what makes up a running Linux system. User processes make
    up the environment that you directly interact with; the kernel manages processes
    and hardware. Both the kernel and processes reside in memory.


    This is great background information, but you can''t learn the details of a Linux
    system by reading about it alone; you need to get your hands dirty. The next chapter
    starts your journey by teaching you some user-space basics. Along the way, you''ll
    learn about a major part of the Linux system that this chapter doesn''t discuss—long-term
    storage (disks, files, etc.). After all, you need to store your programs and data
    somewhere.'
