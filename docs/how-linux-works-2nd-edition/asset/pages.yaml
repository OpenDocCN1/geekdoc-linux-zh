  md: 'because one of the commands is [ $1 = "hi" ] and the [ character is an actual
    program on a Unix system, not special shell syntax. (This is not quite true, you''ll
    soon learn, but treat it as a separate command in your head for now.) All Unix
    systems have a command called [ that performs tests for shell script conditionals.
    This program is also known as test and careful examination of [ and test should
    reveal that they share an inode, or that one is a symbolic link to the.


    Understanding the exit codes in Section 11.4 is vital, because this is how the
    whole process works:


    +   1. The shell runs the command after the exit code and collects the code of
    that command.

    2. If the exit code is 0, the shell executes the commands that follow the then
    keyword, stopping when it reaches an else or fi keyword.

    3. If the exit code is not 0 and there is an else clause, the shell runs the commands
    after the else keyword.

    4. The conditional ends at fi.


    # 11.5.1 Getting Around Empty Parameter Lists


    There is a slight problem with the conditional in the preceding example: $1 could
    be empty, because the user might not enter a parameter. Without a parameter, the
    test reads [ = hi ], and the [ command allows with an error. You can fix this
    by enclosing the parameter in one of two ways (both of which are common):


    ```

    if [ "$1 = hi ]; then

    if [ x"$1" = x"hi" ]; then

    ```


    # 11.5.2 Using Other Commands for Tests


    The stuff following if is always a command. Therefore, if you want to put the
    keyword on the same line, you need a semicolon (;) after the test command. If
    you skip the semicolon, the shell passes then as a parameter to the test command.
    If you don''t like the semicolon, you can put the keyword on a separate line.


    There are many possibilities for using other commands instead of [ command. Here''s
    an example that you uses grep:


    ```

    ##!/bin/sh

    if grep -q daemon /etc/passwd; then

    echo The daemon user is in the passwd file.

    elelse

    echo There is a big problem. daemon is not in the passwd file.

