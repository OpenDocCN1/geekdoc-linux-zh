- img_proc: true
  md: '# 9.14.4 Characteristics of TCP


    TCP is popular as a transport layer protocol because it requires relatively little
    from the application side. An application process only needs to know how to open
    (or listen for), read from, and close a connection. To the application, it seems
    as if there are incoming and outgoing streams of data; the process is nearly as
    simple as working with a file.


    However, there''s a lot of work to do behind the scenes. For one, the TCP implementation
    needs to know how to break an outgoing data stream from a process into packets.
    However, the hard part is knowing how to convert a series of incoming packets
    into an input data stream for processes to read, especially when incoming packets
    don''t necessarily arrive in the correct order. In addition, a host using TCP
    must check for errors: Packets can get lost or mangled when sent over the Internet,
    and a TCP implementation must detect and correct these situations. 9-3 shows a
    simplification of how a host might use TCP to send a message.


    Likely, you need to know nothing about this mess other than the Linux TCP implementation
    is primarily in the kernel and that utilities that work with the transport layer
    manage kernel data structures. One example is the IP Tables packet-filtering system
    discussed in Section 9.21.


    # 9.14.5 UDP


    UDP is a far simpler transport than TCP. It defines a transport for single messages;
    there is no data stream. At the same time, unlike TCP, UDP won''t connect for
    lost or out-of-order packets. In fact, UDP has ports, it doesn''t even have connections!
    One host sends a message from one of its ports to a server, and the server sends
    back if it wants to. However, UDP does have error detection for data inside a
    packet; a host can detect if a packet gets mangled, but it doesn''t have to do
    anything about it.


    Where TCP is like having a telephone conversation, UDP is like sending a letter,
    or instant message (except that instant messages are more reliable). Applications
    that are concerned with speed—sending a message as quickly as possible. They don''t
    want the overhead between the two hosts is generally reliable. They don''t need
    TCP''s error correction because they have their own error detection systems or
    don''t care about errors.


    One example of an application that uses UDP is the Network Time Protocol (NTP).
    A client sends a simple request to a server to get the current time, and the response
    from the server is equally brief. Because the client wants the answer as quickly
    as possible, UDP suits the application; if the response from the server gets lost
    somewhere in the network, the client can just resent a request or give up. Another
    example is video chat—in which pictures are sent with UDP—and some pieces get
    lost along the way, the client on receiving compensates the best it can.'
  merge: -1
  pgno: 236
- img_proc: true
  md: 'Message to be sent with TCP


    Hi! How are you today?


    Origin host breaks message into packets.


    | Seq: 1 | Seq: 2 | Seq: 3 | Seq: 4 | Seq: 5 |

    |---|---|---|---|---|n| Hi H | ow ar | e you t | oday | ? |


    Internet carries packets to destination.


    Packets arrive at destination host (not necessarily as transmitted)


    | Seq: 1 | Seq: 2 | Seq: 4 | Seq: 3 | Seq: 5 |

    |---|---|---|---|---|n| Hi H | ow ar | oday | e you t | ? |


    Destination host reconstructs message from packets.


    Hi! How are you today?


    Figure 9-3: Sending a message with TCP


    The rest of this chapter deals with more advanced networking topics, such as network
    filtering and routers, as they relate to the lower network layers that we''ve
    already seen: physical, network, and transport. If you like, feel free to skip
    ahead to the next chapter to see the application layer where everything comes
    together in user space. You''ll see processes that actually use the network rather
    than just throwing around a bunch of addresses and packets.


    NOTE'
  merge: -1
