- img_proc: true
  md: 'Most organizations frown on editing passwd directly because it''s too easy
    to make a mistake. It''s much easier (and safer) to make changes to users using
    separate commands available from the terminal or through the GUI. For example,
    to set a user''s password, run passwd user as the superuser. Use useradd to add
    and remove users.


    # 7.3.5 Working with Groups


    Groups in Unix allow you to share files with certain users but deny access to
    all others. The idea is that you can set read or write permission bits for a particular
    group, excluding everyone else. This feature was once important because many users
    shared one machine, but it''s become less significant in recent years as workstations
    are shared often.


    The /etc/group file defines the group IDs (such as the ones found in /etc/passwd).
    Listing 7-3 is an example.


    ```

    root*:0:user

    demon*:1:

    bin*:2:

    sys*:3:

    adm*:4:

    disk*:6:juser,beazly

    nogroup*:*:65534:

    user*:1000:

    ```


    Listing 7-3: A sample /etc/group


    Like the /etc/passwd file, each line in /etc/group is a set of fields separated
    by colons. The fields in each entry are as follows, from left to right:


    +   **The group name** This appears when you run a command like -l.

    The group password** This is hardly ever used, nor should you use it (use sudo
    instead). Use * or any other default value.

    **The group ID (a number)** The GID must be unique within the group file. This
    number goes into a user''s group field in that''s /etc/passwd entry.

    **An optional list of users that belong to the group** In addition to users listed
    here, users with the corresponding group ID in their passwd file also belong to
    the group.


    Figure 7-2 identifies the fields in a group file entry.


    ![](img/1b61c74a588aedf0032126b8bd0e7422_180_0.png)


    Figure 7-2: An entry in the group file


    To set the groups you belong to, run groups.'
