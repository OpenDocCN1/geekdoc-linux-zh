    But there''s still one piece missing: When allocating data blocks for a new file,
    how does the filesystem know which blocks are in use and which are available?
    One of the most basic ways is with an additional data structure called a bitmap.
    In this scheme, the filesystem reserves a series of bytes, with each bit corresponding
    to one block in the data pool. A value of 0 means that the block is free, and
    a 1 means that it''s in use. Thus, allocating and deallocating blocks is a matter
    of flipping bits.


    Problems in a filesystem arise when the inode table doesn''t match the block allocation
    data or when the link counts are incorrect; this can happen when you don''t cleanly
    shut down a system. Therefore, when you check a filesystem, as described in Section
    4.2.11, the fsck program generates a new block allocation map (such as the block
    bitmap), and then compares the newly generated data with the filesystem on the
    disk. If there are mismatches, fsck must fix the link counts and determine what
    to do with any inodes and data that didn''t come up when it traversed the directory
    structure. Most fsck programs make these "orphans" new files in the filesystem''s
    lost-found directory.


    # 4.5.2 Working with Filesystems in User Space


    When working with files and directories in user space, you shouldn''t have to
    worry about the implementation going on below them. You''re expected to access
    the contents of files and directories of a mounted filesystem through kernel system
    calls. Curiously, though, you have access to certain filesystem information that
    doesn''t seem to fit in user space—in particular, the stat() system call returns
    inode numbers and link counts.


    When not maintaining a filesystem, do you have to worry about inode numbers and
    link counts? Generally, no. This stuff is accessible to user mode programs primarily
    for backward compatibility. Furthermore, not all filesystems in Linux have these
    internals. The Virtual File System (VFS) interface layer ensures that system calls
    always return inode numbers and link counts, but these numbers may not necessarily
    mean anything.


    You may not be able to perform traditional Unix operations on nondraditional filesystems.
    For example, you can''t use ln-to create a hard link on a mounted VFAT filesystem
    because the directory structure is entirely different.'
