    ```


    The :0 shown here is the display, an identifier representing one or more monitors
    that you access with a common keyboard/or mouse. Usually, the display corresponds
    to the single monitor you attach to your computer, you can put multiple monitors
    under the same display. When using an X session, the DISPLAY environment variable
    is set to the display identifier.


    Displays can be further subdivided into screens, as :0.0 and :0.1, but this becomes
    increasingly rare because X extensions, such as RandR, can combine monitors into
    one larger virtual screen.


    On Linux, an X server runs on a virtual terminal. In this example, the vt7 argument
    tells us that it''s been told to run on /dev/tty7 (normally, the server starts
    on the first virtual terminal available). You can run more one X server at a time
    on Linux by running on separate virtual terminals, if you do, each server serves
    a unique identifier. You can switch between the servers with the CTRLALT-FN keys
    or the cht command.


    # # 14.2.1 Display Managers


    You normally don''t start the X server with a command line because the server
    doesn''t define any clients that are supposed to run on the server. If you start
    the server by itself, you''ll just get a blank screen. Instead, the most common
    way to start an X server is with a display manager, a program that starts the
    server and puts a login box on the screen. When you log in, the display manager
    starts a set of clients, as a window manager and file manager, so that you can
    use the machine.


    There are many different display managers, such as gdm (for GNOME) and kdm (for
    KDE). The argument list for the X server above is a cross-platform display manager
    meant to be able to start GNOME or KDE sessions.


    To X session from a virtual console instead of using a display manager, you can
    run the startx or xinit command. However, the session you will get will be a very
    simple one that unlike of a display manager, because the mechanics and startup
    files are different.


