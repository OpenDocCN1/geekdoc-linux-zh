    # 4.5 Inside a Traditional Filesystem


    A Traditional Unix filesystem has two primary components: a pool of data blocks
    where you can store data and a database system that manages the data pool. The
    database is centered around the inode data structure. An inode is a set of data
    that describes a particular file, including its type, permissions, and—perhaps
    most importantly—where in the data pool the file data resides. Inodes are identified
    by numbers listed in an inode table.


    Filenames and directories are also implemented as inodes. A directory inode contains
    a list of files and corresponding links to other inodes.

    To provide a real-life example, I created a new filesystem, mounted it, and changed
    the directory to the mount point. Then, I added some files and directories with
    these commands (feel free to do this yourself with a flash drive):


    ```

    $ mkdir dir_1

    $ mkdir dir_2

    $ echo a > dir_1/file_1

    $ echo b > dir_1/file_2

    $ echo c > dir_1/file_3

    $ echo d > dir_2/file_4

    $ ln -s dir_1/file_3 dir_2/file_5

    ```


    Note that I created dir_2/file_5 as a hard link meaning that these two filenames
    actually represent the same file. (On more shortly.)

    If you were to explore the directories in this filesystem, its contents would
    appear to the user as shown in Figure 4-4. The actual layout of the filesystem,
    as shown in Figure 4-5, doesn''t look nearly as clean as the user-level representation.


    ![](img/1b61c74a588aedf0032126b8bd0e7422_111_0.png)


    Figure 4-4: User-level representation of a filesystem'
