    # 11.3.4 Script Name: $0


    The $0 variable holds the name of the script, and it is useful for generating
    diagnostic messages. For example, say your script needs to report an invalid argument
    that is stored in the $BADPARM variable. You can print the diagnostic message
    with the following line so that the script name appears in the error message:


    echo $0: bad option $BADPARM


    All diagnostic error messages go to the standard error. Recall from Section 2.14.1
    that 2>&1 redirects the standard error to the standard output. For writing to
    the standard error, you can reverse the process for the preceding example, use
    this:


    ```

    echo $0: bad option $BADPARM 1>&2

    ```


    # 11.3.5 Process ID: $$


    The $$ variable holds the process ID of the shell.


    # 11.3.6 Exit Code: ?


    The $? variable holds the exit code of the last command that the shell executed.
    Exit codes, which are critical to mastering shell scripts, are discussed next.


    # 11.4 Exit Codes


    When a Unix program finishes, it leaves an exit code for the parent process that
    started the program. The exit code is a number and is sometimes called an error
    code or exit value. When the exit code is zero (0), typically'
