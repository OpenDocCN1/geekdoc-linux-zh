  md: 'on your system because many different kinds of programs listen on various ports.
    To keep intruders from discovering internal services on your system, use effective
    firewall rules, and install a firewall at your router.


    **Track the services that you offer to the Internet** If you run an SSH server,
    Postfix, or similar services, keep your software up-to-date and get appropriate
    security alerts. (See Section 10.7.2 for some resources.)


    **Use “long-term support” distribution releases for servers** Security teams normally
    concentrate their work on stable, supported distribution releases. Development
    and testing releases between Debian and Fedora Rawhide receive much less attention.


    **Don’t give an account on your system to anyone who doesn’t need one** It’s much
    easier to gain superuser access from a local account and it is not to break it.
    In fact, the huge base of software (and the resulting bugs and design flaws) available
    on most systems, can be easy to gain superuser access to a system after you get
    to a shell prompt. Don''t assume that your friends know how to protect their passwords
    (or choose good passwords in the first place).


    **Avoid installing dubious binary packages** They can contain Trojan horses.


    That’s the practical end of protecting yourself. But why is it important to do?
    There are three basic kinds of network attacks:


    **Full compromise** This means gaining superuser access (full control) of a machine.
    An intruder can accomplish this by trying a service attack, such as a buffer overflow
    exploit, or by taking over a poorly protected user account and trying to exploit
    a poorly written gesetzt program.


    **Denial-of-service (DoS) attack** This prevents a machine from carrying out your
    network services or forcing a computer to malfunction in some other way without
    the use of any special access. These attacks are harder to prevent, but they are
    easy to respond.


    **Malware** Linux users are mostly immune to malware as email worms and viruses,
    simply because their clients aren''t stupid enough to actually run programs that
    get in message attachments. But Linux malware exists. Avoid downloading and installing
    binary software from places that you’ve never heard of.


