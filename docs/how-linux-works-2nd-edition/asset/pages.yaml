  md: '# # 14


    # ## A BRIEF SURVEY OF THE LINUX DESKTOP


    ![](img/1b61c74a588aedf0032126b8bd0e7422_321_0.png)


    This chapter is a quick introduction to the components found in a typical Linux
    desktop system. Of all of the different kinds of software that you can find on
    Linux systems, the desktop arena is one of the wildest and most colorful because
    there are so many environments and applications to choose from, and most distributions
    make it relatively easy for you to try them out.


    Unlike other parts of a Linux system, such as storage and networking, there isn''t
    much of a hierarchy of layers involved in creating a desktop structure. Instead,
    each component performs a specific task, communicating with other components as
    necessary. Some components do share common building blocks (in particular, libraries
    for graphical toolkits), and these can be thought of as simple abstraction layers,
    but that''s about as deep as it goes.'
  merge: -1
  pgno: 321
- img_proc: true
  md: 'This chapter offers a high-level discussion of desktop components in general,
    but we''ll look at two pieces in a little more detail: the X Window System, which
    is the core infrastructure behind desktops, and D-Bus, an interprocess communication
    service used in many parts of the system. We''ll limit the hands-on discussion
    and examples to a few diagnostic utilities that, not terribly useful day-to-day
    (most GUIs you enter shell commands in order to interact with them), will help
    you understand the underlying mechanics of the system and perhaps provide some
    entertainment along the way. We''ll also take a quick look at printing.


    # # 14.1 Desktop Components


    Linux desktop configurations offer a great deal of flexibility. Most of the Linux
    users experience (the "look and feel" of the desktop) comes from applications
    or building blocks of applications. If you don''t like a particular application,
    you can usually find an alternative. And if you''re looking for doesn''t, you
    can write it yourself. Linux developers tend to have a wide variety of preferences
    for how a desktop should act, which makes for a lot of choices.


    In order to work together, all applications need to have something in common,
    and at the core nearly everything on Linux desktops is the X (X Window System)
    server. Think of X as sort of the "kernel" of the desktop that manages everything
    from rendering windows to configuring displays to handling input from devices
    such as keyboards and mice. The X server is also the component that you won''t
    easily find a replacement for (see Section 14.4).


    The X is just a server and does not dictate the way anything should act or appear.
    Instead, X client programs handle the user interface. Basic client applications,
    such as terminal windows and web browsers, make connections to the X server and
    ask to draw windows. In response, the X server figures out where to place the
    windows and renders them. The X server also handles input to the client when appropriate.


    # ## 14.1.1 Window Managers


    X clients don''t have to act like window applications; they can act as services
    for other clients or provide other interface functions. A window manager is the
    most important client service because it figures out how to arrange windows on
    screen and provides interactive decorations like title bars that allow the user
    to move and minimize windows. These elements are central to the user experience.


    There are many window manager implementations. Examples such as Mutter/GNOME Shell
    and Compiz are meant to be more or less standalone, while others are built into
    environments such as Xfce. Most window managers included in the standard Linux
    distributions strive for maximum user comfort, but others provide specific visual
    effects or take'
  merge: -1
  pgno: 322
- img_proc: true
  md: 'approach. There''s not likely to ever be a standard Linux window manager because
    user tastes and requirements are diverse and constantly changing; as a result,
    new window managers appear all the time.


    # 14.1.2 Toolkits


    Desktop applications include certain common elements, such as buttons and menus,
    called widgets. To speed up development and a common look, programmers use toolkits
    to provide these elements. On operating systems such as Windows or Mac OS X, the
    vendor provides a common toolkit, and most programmers use that. On Linux, the
    GTK-toolkit is one of the most common, but you''ll also frequently see widgets
    built on the Qt framework and others.


    +   * Toolkits usually consist of shared libraries and support files such as images
    and theme information.


    # 14.1.3 Desktop Environments


    Although toolkits provide the user with a uniform outward appearance, details
    of a desktop require a degree of cooperation between different applications. For
    example, one application may wish to share data with another or update a notification
    bar on a desktop. For these needs, toolkits and other libraries are bundled into
    larger packages desktop environments. GNOME, KDE, Unity, and Xfce are some Linux
    desktop environments.


    Toolkits are at the core of most desktop environments, but to create a unified
    desktop, environments must also include numerous support files, as such icons
    and configurations, that make them up. All of this is bound together with documents
    that describe design conventions, such as how application menus and titles should
    appear and how applications react to certain system events.


    # 14.1.4 Applications


    At the top of the desktop are applications, such as web browsers and the terminal
    window. X applications can range from crude (such as the ancient xclock program)
    to complex (such as the Chrome web browser and LibreOffice suite). These applications
    stand alone, but they use interprocess communication to become aware of pertinent
    events. For example, an application can express interest when you attach a new
    storage device or when you receive new email or an instant message. This communication
    usually occurs over D-Bus, described in Section 14.5.


    # 14.2 A Closer Look at the X Window System


    The X Window System (http://www.x.org/) has historically been very large, with
    the base distribution including the X server, client support libraries, and clients.
    Due to the emergence of desktop environments as'
