- img_proc: true
  md: 'SCSI subsystem passes SCSI commands between its components, the USB subsystem
    passes USB messages between its components. There''s even an isusb command that
    is similar to lscsi.


    The part''re really interested in here is the USB storage driver at the top. The
    driver acts as a translator. On one side, the driver speaks SCSI, and on the other,
    it speaks USB. Because the storage hardware has SCSI commands inside its USB,
    the driver has a relatively easy job: it mostly replicates data.


    With the SCSI and USB subsystems in place, you have almost everything you need
    to talk to the flash drive. The final missing link is the lower-layer driver in
    the SCSI subsystem because the USB storage driver is a part of the USB subsystem,
    not the SCSI subsystem. (For organizational reasons, the two subsystems should
    not share a driver.) To get the subsystems to talk to one another, a simple, lower-layer
    SCSI bridge driver connects to the USB subsystem''s storage driver.


    # 3.6.2 SCSI and ATA


    The SATA hard disk and optical drive in Figure 3-2 use the same SATA interface.
    To connect the SATA-specific drivers of the kernel to the SCSI subsystem, the
    kernel employs a bridge driver, as with the USB drives, but with a different mechanism
    and additional complications. The optical drive speaks ATAPI, a version of SCSI
    commands encoded in the ATA protocol. However, the hard disk does not use ATAPI
    and does not encode any SCSI commands!


    The Linux kernel uses part of a library called libata to reconcile SATA (and ATA)
    drives with the SCSI subsystem. For the ATA-speaking optical drives, this is a
    relatively simple task of packaging and extracting SCSI commands into and from
    the ATA protocol. But for the hard disk, the task is much more complicated than
    the library must do a full command translation.


    The job of the optical drive is similar to typing an English book into a computer.
    You don''t need to understand what the book is about in order to do this job,
    you don''t even need to understand English. But for the hard disk is like reading
    a German book and typing it into the computer as an English translation. In this
    case, you''re need to understand both languages as well as the book''s content.


    Despite this difficulty, libata performs this task and makes it possible to attach
    the SCSI subsystem to ATA/SATA interfaces and devices. (There are typically more
    drivers involved than just the one SATA host driver shown in Figure 3-2, but they''re
    not shown for the sake of simplicity.)'
