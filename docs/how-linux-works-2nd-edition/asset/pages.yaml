- img_proc: true
  md: 'ends with a dollar sign ($). On Ubuntu, prompt should look like name@host:path$,
    and on Fedora, it''s [name@host path]. If you''re familiar with Windows, the shell
    window will look something like a DOS command prompt; the Terminal application
    in OS X is essentially the same as a Linux shell window.


    This book contains many commands that you will type at a shell prompt. They all
    begin with a single $ to delete the prompt. For example, type this command (just
    the part in bold, not the $) and press ENTER:


    ```

    $ echo Hello there.

    ```


    Many shell commands in this book start with #. You should run them as the superuser
    (root). These commands usually require extra caution.


    Now enter this command:


    ```

    $ cat /etc/passwd

    ```


    This command displays the contents of the /etc/passwd system file and returns
    your shell prompt. Don''t worry about what this file does right now; you''ll learn
    all about it later, in Chapter 7.


    # 2.2.2 cat


    The cat command is one of the easiest Unix commands to understand; it simply outputs
    the contents of one or more files. The general syntax of the cat command is as
    follows:


    ```

    $ cat file1 file2 ...

    ```


    When you run this command, cat prints the contents of file1, file2, and any other
    files that you specify (denoted by ...), and then exits. The command is called
    cat because it performs concatenation when it prints the contents of more than
    one file.


    # 2.2.3 Standard Input and Standard Output


    We''ll use cat to explore Unix input and output (I/O). Unix processes use I/O
    streams to read and write data. Processes read data from input streams and write
    data to output streams. Streams are very flexible. For example, the source of
    an input stream can be a device, a terminal, or even the output stream from another
    process.


    To see an input stream at work, enter cat and press ENTER. You won''t get your
    shell prompt back because cat is still running. Now type anything and press ENTER
    at the end of each line. The cat command repeats any line that you type. Once
    you''re sufficiently bored, press CTRL-D on an empty line to terminate cat and
    return to the prompt.'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'The reason cat adopted an interactive behavior has to do with streams. Because
    you did not specify an input filename, cat read from the standard input stream
    provided by the Linux kernel rather than a stream connected to a file. In this
    case, the standard input was connected to the terminal in which you can run.


    > Pressing CTRL-D on an empty line stops the current standard input entry from
    the terminal (often terminates a program). Don''t confuse this with CTRL-C, which
    terminates a program regardless of its input or output.


    Standard output is similar. The kernel gives each process a standard output stream
    where it can write its output. The cat command always writes its output to the
    standard output. When you run cat in the terminal, the standard output was connected
    to that terminal, and that''s where you''ve seen output.


    Standard input and output are often abbreviated as stdin and stdout. Many commands
    often operate as cat; if you do not specify an input file, the command reads from
    stdin. Output is a little different. Some commands (like cat) send output only
    to stdout, but others have the option to send output to files.


    There is a third I/O stream called standard error. You''ll see it in Section 2.14.1.


    One of the best features of standard streams is that you can easily manipulate
    them to read and write to places other than the terminal, as you''ll learn in
    Section 2.14. In particular, you''ll learn how to connect streams to files and
    other processes.


    # 2.3 Basic Commands


    Now let''s look at some more Unix commands. Most of the following programs take
    multiple arguments, and some have so many options and formats that an unabridged
    listing would be pointless. This is a simplified list of the basic commands; you
    don''t need all of the details just yet.


    # 2.3.1 ls


    The ls command lists the contents of a directory. The default is the current directory.
    Use ls -l for a detailed (long) listing and -F to display type information. (For
    more on the file types and permissions displayed in the left column below, see
    Section 2.17.) Here is a sample listing; it includes the owner of the file (column
    3), the group (column 4), the file size (column 5), and the modification date/time
    (between column 5 and the filename):


    ```

    $ ls -l

    -RW-R---- 1 user users 3804 Apr 30 2011 abusive.c

    -RW-R---- 1 user users 4165 May 26 2010 battery.zip

    ```'
