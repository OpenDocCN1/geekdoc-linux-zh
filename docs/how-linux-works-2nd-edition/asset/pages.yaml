  md: 'Although this is a large structure and may look overwhelming at first, the
    data flow in the figure is very linear. Let''s begin dissecting it by looking
    at the SCSI subsystem and its three layers of drivers:


    +   - The top layer handles operations for a class of device. For example, the
    sd (SCSI disk) driver is at this layer; it knows how to translate requests from
    the kernel block device interface into disk-specific commands in the SCSI protocol,
    and vice versa.


    +   - The middle layer routes the SCSI messages between the top and bottom layers,
    and keeps track of all the SCSI buses and devices attached to the system.


    +   - The bottom layer handles hardware-specific actions. The drivers send outgoing
    SCSI protocol messages to specify host adapters and hardware, and they extract
    incoming messages from the hardware. The reason for this separation from the top
    layer is that although SCSI messages are uniform for a device class (such as the
    disk class), different kinds of host adapters have varying procedures for sending
    the same messages.


    The top and bottom layers contain many different drivers, but it''s important
    to remember that, for any device file on your system, the kernel uses one-layer
    driver and one lower-layer driver. For the disk /dev/sda in our example, the kernel
    uses the sd top-layer driver and the ATA bridge lower-layer driver.


    There are times when you might use more than one upper-layer driver for one hardware
    device (see Section 3.6.3). For true hardware SCSI devices, such as a disk attached
    to a SCSI host adapter or a hardware RAID controller, the lower-layer drivers
    talk directly to the hardware below. However, for most hardware that you found
    attached to the SCSI subsystem, it''s a different story.


    # 3.6.1 USB Storage and SCSI


    In order for the SCSI subsystem to talk to confirm USB storage hardware, as shown
    in Figure 3-2, the kernel needs more than just a lower-layer SCSI driver. The
    USB flash drive represented by /dev/sdf understands SCSI commands, but to communicate
    with the drive, the kernel needs to know how to talk through the USB system.


    In the abstract, USB is quite similar to SCSI—it has device classes, buses, and
    host controllers. Therefore, it should be no surprise that the Linux kernel includes
    a three-layer USB subsystem that closely resembles the SCSI subsystem, with device-class
    drivers at the top, a bus management core in the middle, and host controllers
    at the bottom. Much as the'
  merge: -1
