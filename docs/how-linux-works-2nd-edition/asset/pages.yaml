    # 5.6 Secure Boot Problems


    One of the newest problems affecting Linux installations is the secure boot feature
    on recent PCs. When active, this mechanism in UEFI requires boot loaders to be
    digitally signed by a trusted authority in order to run. Microsoft has required
    vendors shipping Windows 8 to use secure boot. The result is if you try to install
    an unsigned boot loader (which is most current Linux distributions), it will not
    load.


    The easiest way around this for anyone with no interest in Windows is to disable
    boot in the EFI settings. However, this won''t work cleanly for dual-boot systems
    and may not be an option for all users. Therefore, Linux distributions are offering
    signed boot loaders. Some solutions are just frontends to GRUB, some offer a fully
    signed loading sequence (from the boot loader to the kernel), and others are entirely
    new boot loaders (some based on efinux).


