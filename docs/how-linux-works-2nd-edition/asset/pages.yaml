  md: '# 3.4.7 Audio Devices: /dev/snd/*, /dev/dsp, /dev/audio, and More


    Linux has two sets of audio devices. There are separate devices for the Advanced
    Linux Sound Architecture (ALSA) system interface and the older Open Sound System
    (OSS). The ALSA devices are in the /dev/snd directory, but it''s difficult to
    work with them directly. Linux systems that use support OSS backward-compatible
    devices if the OSS kernel support is currently-loaded.


    Some rudimentary operations are possible with the OSS dsp and audio devices. For
    example, the computer plays any WAV file that you send to /dev/dsp. However, the
    hardware may not do what you expect due to frequency mismatches. Furthermore,
    on most systems, the device is often busy as soon as you log in.


    > NOTE Linux is a messy subject due to the many layers involved. We''ve just talked
    about the kernel-level devices, but typically there are user-space servers such
    as pulaudio that manage audio from different sources and act as intermediaries
    between the sound devices and other user-space processes.


    # 3.4.8 Creating Devices Files


    In modern Linux systems, you do not create your own device files; this is done
    with devtmp and udev (see Section 3.5). However, it is instructive to see how
    it done once, and on a rare occasion, you might need to create a named pipe.


    The mknod command creates one device. You must know the device name as well as
    its major and minor numbers. For example, creating /dev/sda1 is a matter of using
    the following command:


    ```

    # mknod /dev/sda1 b 8 2

    ```


    The b 8 2 creates a block device with a major number 8 and a minor number 2. For
    character or named pipe devices, use c or p instead of b (omit the major and minor
    numbers for named pipes).


    As mentioned earlier, the mknod command is useful only for creating the occasional
    named pipe. At one time, it was sometimes useful for creating missing devices
    in single-mode user during system recovery.


    In older versions of Unix and Linux, maintaining the /dev directory was a challenge.
    With every significant kernel upgrade or driver addition, the kernel could support
    more kinds of devices, meaning that there would be a new set of major and minor
    numbers to be assigned to device filenames. Maintaining this was difficult, so
    each system had a MAKEDEV program in /dev to create groups of devices. When you
    upgraded your system, you would try to find an update to MAKEDEV and then run
    it in order to create new devices.'
