  md: '# 8.1 Tracking Processes


    You learned how to use ps in Section 2.16 to list processes running on your system
    at a particular time. The ps command lists current processes, but it does little
    to tell you how processes change over time. Therefore it would really help you
    to determine which process is using too much CPU time or memory.


    The top program is often more useful than ps because it displays the current system
    status as well as many of the fields in a ps listing, and it updates the display
    every second. Perhaps most important is that top shows the most active processes
    (that is, those currently taking up the most CPU time) at the top of its display.


    You can send commands to top with keystrokes. These are some of the most important
    commands:


    +   - Spacebar Updates the display immediately.

    - M Sorts by current memory usage.

    - T Sorts by total (cumulative) CPU usage.

    - P Sorts by CPU usage (the default).

    - u Displays only one user''s processes.

    - F Selects different statistics to display.

    - ? Displays a summary for all top commands.


    Two other utilities for Linux, similar to top, offer an enhanced set of views
    and features: atop and htop. From other utilities. For example, htop has many
    of the lsof command described in the next section.


    # 8.2 Finding Files with lsof


    The lsof command lists files and the processes using them. Because Unix places
    a lot of emphasis on files, lsof is among the most useful tools for finding trouble
    spots. lsof does not stop at regular files—it can list network resources, dynamic
    libraries, pipes, and more.


    # 8.2.1 Reading the lsof Output


    Running lsof on the command usually produces a tremendous amount of output. Below
    is a fragment of what you might see. This output includes open files from the
    input process as well as a running process:


    ```

    COMMAND PID USER FD DEVICE SIZE NODE NAME

    init 1 root cwd DIR 8,1 4096 2 /

    init 1 root rtd DIR 8,1 4096 2 /

    init 1 root mem REG 8,1 47040 9705817 /lib/i386-linux-gnu/libns_files-2.15.so

