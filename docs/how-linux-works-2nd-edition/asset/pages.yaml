    # 3.5.3 udev


    The udev program is an administration tool for udev. You can reload udev rules
    and trigger events, but perhaps the most powerful features of udev are the ability
    to search for explore system devices and the ability to monitor uevents as udev
    receives them from the kernel. The only trick is that the command syntax can get
