    If dir isn''t empty, this command fails. However, if you''re impatient, probably
    won''t want to laboriously delete all the files and subdirectories inside dir.
    You can use rm -rf dir to delete a directory and its contents, but be careful!
    This is one of the few commands that can do serious damage, especially if you
    run it as the superuser. the -r option specifies recursive delete to repeatedly
    delete everything inside dir, and -f forces the delete operation. You use the
    -rf flags with globs such as a star (*). And above, always double-check your command
    before you run it.


    # 2.4.4 Shell Globbing (Wildcards)


    The shell can match simple patterns to file and directory names, a process known
    as globbing. This is similar to the concept of wildcards in other systems. The
    simplest of these is the glob *, which tells the shell to match any number of
    arbitrary characters. For example, the following command prints a list of files
    in the current directory:


    ```

    $ echo *

    ```


    The shell matches arguments containing globs to filenames, substitutes the filenames
    for those arguments, and then runs the revised command line. The substitution
    is called expansion because the shell substitutes all matching filenames. Here
    are some ways to use * to expand filenames:


