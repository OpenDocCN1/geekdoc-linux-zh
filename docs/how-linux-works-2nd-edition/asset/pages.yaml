    # 25.2.2 Built-in Rules


    So does make know how to go from aux.c to aux.o? After all, aux.c is not in the
    Makefile. The answer is that make follows its built-in rules. It knows to look
    for a .c file when you want a .o file, and furthermore, it knows how to run cc
    -c on that .c file to get to its goal of creating a .o file.


    # 25.2.3 Final Program Build


    The final step in getting to myprog is a little tricky, but the idea is clear
    enough. After you have the two object files in $(OBJS), you can run the CC compiler
    according to the following line (where $(CC) expands to the compiler name):


    ```

    $(CC) -o myprog $(OBJS)

    ```


    The whitespace before $(CC) is a tab. You must insert a tab before any real command,
    on its own line.'
