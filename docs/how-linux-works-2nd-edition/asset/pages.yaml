- img_proc: true
  md: 'If you have access to a Windows domain, you can set security = domain to make
    Samba use the domain''s usernames and eliminate the need for a password database.
    However, in order for domain users to access the machine running Samba, each domain
    user must have a local account with the same username on the machine running Samba.


    # Adding and Deleting Users


    The first thing you need to do in order to give a Windows user access to your
    Samba server is to add the user to the password database with the smbpasswd -a
    command:


    ```

    # smbpasswd -a username

    ```


    The username parameter to the smbpasswd command must be a valid username on Linux
    system. Like the regular system''s password program, smbpasswd asks you to enter
    the new user''s password twice. If the password passes any necessary checks, smbpasswd
    confirms that it has created the new user. To remove a user, use the -x option
    to smbpasswd:


    ```

    # smbpasswd -x username

    ```


    To temporarily deactivate a user instead, use the -d option; the -e option to
    reen the user:


    ```

    # smbpasswd -d username

    # smbpasswd -e username

    ```


    # Changing a Samba password as the superuser


    You can change a Samba password as the superuser by using smbpasswd with no options
    or keywords other than the username:


    ```

    # smbpasswd username

    ```


    However, if the Samba server is running, any user can change their own Samba password
    by entering smbpasswd by itself on the command line. Finally, here''s one place
    in your configuration to be aware of. If you see a line in your smb.conf file,
    be careful:


    ```

    unix password sync = yes

    ```


    This line causes smbpasswd to change a user''s normal password in addition to
    the Samba password. The result can be very confusing, especially when a user changes
    their Samba password to something that''s not their Linux password and discovers
    that they can no longer log in. Some distributions set this parameter by default
    in their Samba server packages!'
