  md: 'You can also start ssh as a socket unit in systemd or with inetd, but it''s
    usually not a good idea to do so because the server occasionally needs to generate
    keys, a process that can take a long time.


    # 10.3.2 The SSH Client


    To log in to a remote host, run


    ```

    $ ssh remote_username@host

    ```


    You may omit remote_username@ if your local username is the same as host. You
    can also run pipelines to and an ssh command as shown in the following example,
    which copies a directory dir to another host:


    ```

    $ tar zcvf - dir | ssh remote_host tar zxv

    ```


    The global SSH configuration file ssh_config should be in /etc/ssh with your ssh_config
    file. With the server configuration file, the configuration file contains key-value
    pairs, but you shouldn''t need to change them.


    The most frequent problem with SSH clients occurs when an SSH public key in your
    local ssh_known_hosts or .ssh/known_hosts file does not match the key on the remote
    host. Bad keys cause errors or warnings like:


    > ################################################################

    @ WARNING: REMOTE HOST IDENTIFICATION HAS CHANGED! @

