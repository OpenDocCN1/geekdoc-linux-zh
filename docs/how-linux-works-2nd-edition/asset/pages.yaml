    event (the initial event that Upstart emits). The second line tells Upstart to
    terminate the job upon receiving the rc5 event, when the system goes into inline-user
    mode.


    The next two lines tell Upstart how the mountall job behaves:


    ```

    expect daemon

    task

    ```'
