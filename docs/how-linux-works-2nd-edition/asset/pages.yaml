  md: '# 9.12.3 Caching and Zero-Configuration DNS


    There are two main problems with the traditional DNS configuration. First, the
    local machine does not cache name server replies, so frequent repeated network
    access may be unnecessarily slow due to name server requests. To solve this problem,
    many machines (and routers, acting as name servers) run an intermediate daemon
    to intercept name server requests and return a cached answer to service requests
    if possible; otherwise, requests go to a real name server. Two of the most common
    daemons for Linux are dnsmasq and nscd. You can also set up BIND (the Unix name
    server daemon). You can often tell if you''re running a name caching daemon when
    you see 127.0.0.1 (localhost) in /etc/resolv.conf file or when you see 127.0.0.1
    show up as if you are running nslookup -debug host.


    It can be tricky to track down your configuration if you''re running a name-caching
    daemon. By default, dnsmasq has the configuration /etc/dnsmasq.conf, but your
    distribution may override that. In Ubuntu, if you''ve manually set up an interface
    that''s set up by NetworkManager, you''ll find it in the appropriate file /etc/NetworkManager/system-connections
    because NetworkManager activates a connection, it also starts dnsmasq with configuration.
    (You can override all of this by uncommenting the dnsmasq part of your NetworkManager.conf).


    The other problem with the traditional name server setup is that it can be particularly
    inflexible if you want able to look up names on your local network without messing
    around with a lot of network configuration. For example, if you set up a network
    appliance on your network, you''ll be able to call it by name immediately. This
    is part of the idea behind zero-configuration name service systems like Multicast
    DNS (mDNS) and Simple Service Discovery Protocol (SSDP). If you want to find a
    host by name on the local network, you just broadcast a request over the network;
    it replies with its address. These protocols go beyond-name resolution by also
    providing information about available services.


    The widely used Linux implementation of mDNS is Avahi. You''ll often see dns option
    in /etc/nsswitch.conf, which we''ll now look at in more detail.


    # 9.12.4 /etc/nsswitch.conf


    The /etc/nsswitch.conf file controls name-related precedence settings on your
    system, such as user and password information, but we''ll only talk about the
    DNS settings in this chapter. The file on your system should have a line like
    this:


    ```

    hosts:      dns

    ```


    Putting hosts ahead of dns here ensures that your system checks /etc/hosts file
    for the hostname of your requested IP address before asking the DNS server. This
    is usually a good idea (especially for looking up localhost, as discussed), but
    your /etc/hosts file should be short as'
  merge: -1
  pgno: 232
- img_proc: true
  md: 'possible. Don''t put anything in there to boost performance; doing so will
    burn you later. You can put all the hosts within a small private LAN in /etc/hosts,
    but the general rule of thumb is that if a particular host has a DNS entry, it
    has no place in /etc/hosts. (The /etc/hosts file is also useful for resolving
    hosts in the early stages of booting, when the network may not be available.)


    DNS is a broad topic. If you have any responsibility for domain names, read DNS
    BIND, 5th edition, by Cricket Liu and Paul Albitz (O''Reilly, 2006).


    # 9.13 Localhost


    When running ifconfig, you''ll notice the lo interface:


    ```

    lo Link encap:Local Loopback

    inet addr:127.0.0.1 Mask:255.0.0.0

    inet6 addr ::1/128 Scope:Host

    UP LOOPBACK RUNNING MTU:16436 Metric:1

    ```


    The interface is a virtual network interface called because it "loops back" to
    itself. The effect is that connecting to 127.0.0.1 is connecting to the machine
    that you''re currently using. When outgoing data to localhost reaches the kernel
    network interface for lo, the kernel just repackages it as incoming data and sends
    it back through lo.


    The loopback interface is the only place you will see network configuration in
    boot-scripts. For example, Ubuntu''s ifup command reads /etc/network/interfaces
    and Fedora uses /etc/sysconfig/network-interfaces/ifcfg-lo. You can find the loopback
    device configuration by digging around /etc with grep.


    # 9.14 The Transport Layer: TCP, UDP, and Services


    So far, we''ve seen how packets move from host to host—in other words, the where
    question from the beginning of the chapter. Let''s start to answer the what question.
    It''s important to know how your computer presents the packet data it receives
    from other hosts to its processes. It''s difficult and inconvenient for user-space
    programs to deal with a bunch of raw packets that the kernel can handle. Flexibility
    is commercially important: More than one application should be able to talk to
    the network at the same time (for example, you might have one and several clients
    running).


    Transport protocols bridge the gap between the raw packets of the Internet and
    the refined needs of applications. The two most popular transport protocols are
    the Transmission Control Protocol (TCP) and the User Datagram Protocol (UDP).
    We''ll concentrate on TCP because it''s the most common protocol in use, but we''ll
    also take a look at UDP.'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# 9.14.1 TCP Ports and Connections


    TCP provides for multiple network applications on one machine by means of network
    ports. A port is just a number. If an IP address is the postal address of an apartment
    building, a port is like a mailbox number—it’s a subdivision.


    When using TCP, an application opens a connection (not to be confused with NetworkManager)
    between one port on its own machine and a port on a remote host. For example,
    an application such as a web browser could open a connection between port 36406
    on its own machine and port 80 on a remote host. From the application’s point
    of view, port 36406 is the local port and port 80 is the remote port.


    You can identify a connection by using the pair of IP addresses and port numbers.
    To view the connections open on your machine, use netstat. Here’s an example that
    shows TCP connections: the -n option disables hostname (DNS) resolution, and -t
    limits the output to TCP.


    ```

    $ netstat -nt

    Active Internet connections (w/o servers)

    Proto Recv-Q Send-Q Local Address Foreign Address State

    tcp 0      0 10.23.2.4:47626 10.194.79:125222 ESTABLISHED

    tcp 0      0 10.23.2.4:41475 172.19.52.144:66667 ESTABLISHED

    tcp 0      0 10.23.2.4:57132 192.168.231:135:22 ESTABLISHED

    ```


    The Local Address and Foreign Address fields show connections from your machine’s
    point of view, so the machine has an interface configured at 10.23.2.4, and ports
    47626, 41475, and 57132 on the local side are all connected. This connection here
    shows port 47626 connected to port 5222 of 10.194.79.125.


    # 9.14.2 Establishing TCP Connections


    To establish a transport layer connection, a process on one initiates the connection
    from one of its local ports to a port on a second host with series of packets.
    To recognize the incoming connection and respond, the second host must have a
    process listening on the port. Usually, the connecting process is called the client,
    and the listener is the server (more about this in Chapter 10).


    The important thing to know about the ports is that the client picks a port on
    its side that isn’t currently in use, but it nearly always connects to some well-known
    port on the server side. Read this output from the netstat command in the preceding
    section:


    ```

    Proto Recv-Q Send-Q Local Address Foreign Address State

    tcp 0      0 10.23.2.4:47626 10.194.79:125222 ESTABLISHED

    ```


    With a little help, you can see that this connection was probably initiated by
    a local client to a remote server because the port on the local side (47626) looks
    like a dynamically assigned number, whereas the remote port (5222) is a well-known
    service (the Jabber or XMPP messaging service, to specific).'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'A dynamically assigned port is called an ephemeral port.


    However, if the local port in the output is well-known, a remote host probably
    initiated the connection. In this example, remote host 172.24.54.234 has connected
    to port 80 (the default web port) on the local host.


    | Proto Recv-Q Send-Q Local Address | Foreign Address | State |

    | --- | --- | --- | --- | --- |

    | tcp | 0 | 0 102.23.2.4:80 | 172.24.54.234:0335 | ESTABLISHED |


    A remote host connecting to your machine implies that a server on your local machine
    is listening on this port. To confirm this, list all TCP ports that your machine
    is listening with: netstat


    ```

    $ netstat -ntl

    Active connections (only servers)

    Proto Recv-Q Send-Q Local Address Foreign Address State

    tcp 0 0 0.0.0.0:80 0.0.0.0:* LISTEN

    tcp 0 0 127.0.0.1:53 0.0.0.0:* LISTEN

    ```


    The line with 0.0.0.0:80 as the local address shows that the local machine is
    listening on port 80 for connections from any remote machine. (A server can restrict
    the access to certain interfaces, as shown in the last line, something is listening
    for connections only on the localhost interface.) To learn more, use lsof to identify
    the specific process that''s listening (discussed in Section 10.5.1).


    # 9.14.3 Port Numbers and /etc/services


    How you know if a port is a well-known port? There''s no single way to tell, but
    one place to start is to look in /etc/services, which translates well-known port
    numbers into numbers. This is a plaintext file. You can see entries here:


    | ssh | 22/tcp | # SSH Remote Login Protocol |

    | --- | --- | --- |

    | smtp | 25/tcp |

    | domain | 53/udp |


    The first column is a name and the second column indicates the port number and
    the specific transport layer protocol (which can be other than TCP).


    In addition to /etc/services, an online registry for ports at http://www.iana.org/
    is governed by the RFC6335 network standards document.


    On Linux, only processes running as the superuser can use ports through 1023.
    All user processes may listen on and create connections from ports 1024 and up.'
  merge: -1
