  md: "As you can see at Listing 8-3, the CPU starts to see some usage for an extended\
    \ period, especially from user processes. Because there is enough free memory,\
    \ the amount of cache and buffer space used to increase as the kernel starts to\
    \ use the disk.\n\nLater on, we see something interesting: Notice that the kernel\
    \ pulls some pages into memory that were once swapped out (the si column). This\
    \ means that the program that just ran accessed some pages shared by another process.\
