    # 3.5.2 udev Operation and Configuration


    The udev daemon operates as follows:


    +   - The kernel sends a udev notification, called a uevent, through an internal
    network link.

    - udev loads all of the attributes in the uevent.

    - udev parses its rules, and it takes actions or sets more attributes based on
    those rules.


    An incoming uevent that udev receives from the kernel might look like this:


    ```

    ACTION=change

