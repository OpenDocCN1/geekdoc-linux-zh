    $ ($ cd uglydir; uglyprogram)

    ```


    This example shows how to add a component to the path that might cause problems
    as a permanent change:


    ```

    $ (PATH=/usr/confusing:$PATH; uglyprogram)

    ```


    Using a subshell to make a single-use alteration to an environment variable is
    such a common task that there is a built-in syntax that avoids the subshell:


    ```

    $ PATH=/usr/confusing:$PATH uglyprogram

    ```


    Pipes and background processes work with shells, too. The following examples use
    tar to archive the entire directory tree within orig and unpacks the archive into
    the new directory target, which effectively duplicates the files and folders in
    orig (this is useful because it preserves ownership and permissions, and it''s
    generally faster than using a command as cp -r):


    ```

    $ tar cf - orig | (cd target; tar xvf -

    ```


    > Double-check this sort of command before you run it to make sure that the target
    directory exists and is completely separate from the orig directory.


    # 11.12 Including Other Files in Scripts


    If you need to include another file in your shell script, use the dot (.) operator.
    For example, this runs the commands in the file config.sh:


    +   - config.sh


    This "include" file syntax does not start a subshell, and it can be useful for
    a group of scripts that need to use a single configuration file.


    # 11.13 Reading User Input


    The read command reads a line of text from the standard input and stores the text
    in a variable. For example, the following command stores the input in $var:


    ```

    $ read var

    ```


    This is a built-in shell command that can be useful in conjunction with other
    shell features not mentioned in this book.'
