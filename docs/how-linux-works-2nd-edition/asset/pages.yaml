  md: '# 17.1 Web Servers and Applications


    Linux is a popular operating system for web servers, and the reigning monarch
    of Linux applications is the Apache HTTP Server (usually referred to as just “Apache”).
    Another web server that you''ll often hear about is Tomcat (also an Apache project),
    which provides support for Java-based applications.


    By themselves, web servers do not do much—they can serve files, but that is about
    it. The end goal of web servers such as Apache is to provide an underlying platform
    to serve web applications. For example, Wikipedia is built on the MediaWiki package,
    which you can use to set up your own wiki. Content management systems like WordPress
    and Drupal let you build your blogs and media sites. All of these are built using
    programming languages that run easily on Linux. For example, MediaWiki, WordPress,
    and Drupal are all written in PHP.


    The building blocks that make web applications are highly modular, so it''s easy
    to add your own extensions and create applications with frameworks as Django,
    Flask, and Rails, which offer facilities for content infrastructure and features,
    such as templates, multiple users, and data-support.


    A well-functioning web server depends on a solid operating system found. In particular,
    the material in Chapters 8 through 10 is particularly important. Your network
    configuration must be flawless, but perhaps more importantly, you must understand
    resource management. Adequately-sized, efficient memory and disk are critical,
    especially if you plan to use a database in your application.


    # 17.2 Databases


    Databases are specialized services for storing and retrieving data, and many different
    database servers and systems run on Linux. Two primary features of databases make
    them attractive: they offer easy, uniform ways to manage individuals and groups
    of data, and superior access performance.


    Databases make it easier for applications to create and alter data, for example,
    /etc/passwd and /etc/shadow files on a Linux system can become difficult to maintain
    over a network of machines. Instead, you can set up a database that offers user
    information LDAP (Lightweight Directory Access Protocol) to feed this information
    into the Linux authentication system. The configuration on the client side is
    easy; all you need to do is edit the /etc/nwitch.conf file and add a little extra
    configuration.


    The primary reason that databases generally offer superior performance when retrieving
    data is that they use indexing to keep track of data locations. For example, say
    you have a set of data representing a directory first and last names and telephone
    numbers. You can use a'
  merge: -1
  pgno: 370
- img_proc: true
  md: 'database to place an index on any of these attributes, like the last name.
    Then, when looking up a person by name last name, the database simply consults
    the index for the last name rather than searching the entire directory.


    # 17.2.1 Types of Databases


    Databases come in two basic forms: relational and non-relational. Relational databases
    (also called Relational Database Management Systems, or RDBMS), such as MySQL,
    PostgreSQL, Oracle, and MariaDB, are general-purpose databases that excel in typing
    different sets of data. For example, you have two sets of data, one with postal
    (ZIP) codes and names, and another with the postal codes and their corresponding
    states. A relational database would allow you to very quickly all all the names
    in a particular state. You normally talk to relational databases using a programming
    language SQL (Structured Query Language).


    Non-relational databases, sometimes known as NoSQL databases, tend to solve particular
    problems that relational databases don''t easily handle. For example, document-store
    databases, such as MongoDB, attempt to store and indexing every documents. Key-value
    databases, such as redis, tend to focus on performance. NoSQL databases don''t
    have a common query language like SQL for access. Instead, you''ll have to use
    them using a variety of interfaces and commands.


    The disk and memory performance issues discussed are extremely important in most
    database implementations because there''s a trade-off between how much you can
    store in RAM (which is fast) versus disk. Most larger database systems also involve
    significant networking because they are distributed over many servers. The most
    common such setup is called replication, where one database is basically copied
    to a number of database servers to increase the number of clients that connect
    to the servers.


    # 17.3 Virtualization


    In large organizations, it''s inefficient to dedicate hardware to specific server
    tasks because installing an operating system tailored to one task on one means
    you''re limited to that task until you reinstall it. Virtual machine technology
    makes it possible to simultaneously install one or more operating systems (often
    called guests) on a single piece of hardware, and then activate and deactivate
    the systems at will. You can even move and copy the virtual machines to other
    machines.


    There are many virtualization systems for Linux, such as the kernel''s KVM (virtual
    machine) and Xen. Virtual machines are especially handy for web servers and database
    servers. Although it''s possible to set up a single Apache server to serve several
    websites, this comes at a cost of flexibility and maintainability. If those sites
    are all run by different users, you have to manage the servers and the users together.
    Instead, it is usually'
  merge: -1
  pgno: 371
- img_proc: true
  md: 'preferable to set up virtual machines on one physical server with their own
    supporting users, so that they don''t interfere with each other and you can alter
    and move them at will.


    The software that operates virtual machines is called a hypervisor. The hypervisor
    manipulates many pieces of the lower levels of a Linux system that you''ve seen
    in this book with the result, if you install a Linux guest on a virtual machine,
    it should behave just like any other installed Linux system.


    # 17.4 Distributed and On-Demand Computing


    To ease local resource management, you can build sophisticated tools on top of
    virtual machine technology. The term cloud computing is a catch-all term that''s
    often used as label for this area. More specifically, infrastructure as a service
    (IaaS) refers to systems that allow you to provision and control basic computing
    resources as CPU, memory, storage, and networking on a remote server. The OpenStack
    project is one such API and platform that includes IaaS.


    Moving past the raw infrastructure, you can also provide platform resources such
    as the operating system, database servers, and web servers. Systems that offer
    resources on this level are said to be platform as service (PaaS).


    Linux is central to all of these computing services, as it''s often the underlying
    operating system behind all of it. Nearly all of the elements you''ve seen in
    this book, starting with the kernel, are reflected throughout these systems.


    # 17.5 Embedded Systems


    An embedded system is anything designed to serve a specific purpose, such as a
    music player, video streamer, or thermostat. Compare this to a desktop or server
    system that can handle many different kinds of tasks (but may not do one specific
    thing very well).


    You can think of embedded systems as almost the opposite of distributed computing;
    rather than expanding the scale of the operating system, an embedded system usually
    (but not always) shrinks it, into a small device. Android is perhaps the most
    widespread embedded version of Linux in use today.


    Embedded systems often combine specialized hardware with software. For example,
    you can set up a PC to do as a wireless router by adding network hardware and
    correctly configuring a Linux installation. But it''s usually preferable to buy
    a smaller, dedicated device consisting of the necessary hardware and eliminate
    any hardware that isnt necessary. For example, a router needs more network ports
    than most desktops but doesn''t need video or sound hardware. And once you have
    custom'
  merge: -1
  pgno: 372
- img_proc: true
  md: 'hardware, you must tailor the system''s software, such as the operating system
    internals and user interface. OpenWRT, mentioned in Chapter 9, is one customized
    Linux distribution.


    Interest in embedded systems is increasing as more capable small hardware is introduced,
    particularly system-on-chip (SoC) designs that cram a processor, memory, and peripheral
    interfaces into a small space. For example, the Raspberry Pi and BeagleBone single-board
    computers are based around such design, with several Linux variants to choose
    from as an operating system. These devices have easily accessible output and sensor
    input that connects to language interfaces such as Python, making them popular
    for prototyping and small gadgets.


    Embedded versions of Linux vary in how many features from the server/desktop version
    can be carried over. Small, very limited devices must strip everything the bare
    minimum because lack of space, which often means even the shell and core utilities
    come in the form of a BusyBox executable. These systems tend to exhibit the most
    differences between a fully-featured Linux installation, and you''ll often see
    older software on them, as System V init.


    You''ll normally develop software for embedded devices using a regular desktop
    machine. More powerful devices, such as the Raspberry Pi, have the luxury of more
    storage and the power to renew and more complete software, so you can easily run
    many development tools on them.


    Regardless of the differences, though, embedded devices still share the Linux
    genes in this book: You''ll see a kernel, bunch of devices, network interfaces,
    and an init alongside a bunch of user processes. Embedded kernels tend to be close
    (or identical) to regular kernel releases, simply with many features disabled.
    As you work your way through user space, though, the differences become more pronounced.


    # # 17.6 Final Remarks


    Whatever your goals for gaining a better understanding of Linux systems, I hope
    that you''ve found this book to be helpful. My goal has been to instill you with
    confidence when you need to get inside your system to make changes or do something
    new. At this point, you should feel like you''re really in control of your system.
    Now go and push it around a little and have some fun.'
