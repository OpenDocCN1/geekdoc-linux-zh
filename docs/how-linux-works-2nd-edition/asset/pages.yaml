  pgno: 104
- img_proc: true
  md: 'A second alternative to configure systemd units for the filesystems. You''ll
    learn more about systemd and its units in Chapter 6. However, the systemd unit
    configuration is often generated from (or based on) /etc/fstab file, so you may
    find some overlap over your system.


    # 4.2.10 Filesystem Capacity


    To view the size and utilization of your currently mounted filesystems, use the
    df command. The output should look like this:


    $ df

    | Filesystem | 1024-blocks | Used | Available Capacity | Mounted on |

    | /dev/sda1 | 1011928 | 71400 | 889124 | 7% | /

    | /dev/sda3 | 1771044 | 948526 | 7325108 | 56% | /usr |


    Here''s a brief description of the fields in the df output:


    +   - **Filesystem**: The filesystem device

    - **1024-blocks**: The total capacity of the filesystem in blocks of 1024 bytes

    - **Used**: The number of occupied blocks

    - **Available**: The number of free blocks

    - **Capacity**: The percentage of blocks in use

    - **Mounted on**: The mount point


    It should be easy to see that the two filesystems here are roughly 1GB and 17.5GB
    in size. However, the capacity numbers look a little strange because 71,400 plus
    889,124 does not equal 1,011,928, and 9,485,296 do not constitute 56 percent of
    17,710,044. In both cases, 5 percent of the total capacity is unaccounted for.
    In fact, the space is there, but it is hidden in reserved blocks. Therefore, only
    the superuser can use the full filesystem if the partition fills up. This feature
    keeps server systems from immediately failing when they run out of space.


    If you fill disks and need to know where all of those space-hogging media files
    are, use the du command. With no arguments, du prints the size of every directory
    in the directory hierarchy, starting at the current working directory. That''s
    a kind of useful, so run cd / to get the idea. Press CTRL-C when you get bored.
    The du - command runs summary mode to print only the grand total. To evaluate
    a particular directory, change to and run du -s *


    > The POSIX standard defines a block size of 512 Bytes. This is harder to read,
    by default, the df and output in most Linux distributions is in 1024-byte blocks.
    If you insist on displaying the numbers in 512-byte blocks, use the POSIX_CORRECT
    environment variable. To explicitly specify 1024-byte blocks, use the -k option
    (both utilities support this). The df program also has a -m option to list capacities
    in 1MB blocks and a -h option to take a best guess at what person can read.'
  merge: -1
  pgno: 105
- img_proc: true
  md: '# 4.2.11 Checking and Repairing Filesystems


    The optimizations that Unix filesystems offer are made possible by a sophisticated
    database mechanism. For files to work seamlessly, the kernel has to trust that
    there are no errors in a mounted filesystem. If errors exist, data and system
    crashes may result.


    Filesystem errors are usually due to a user shutting down the system in a rude
    way (for example, by pulling out the power cord). In such cases, the filesystem
    cache in memory may not match the data on the disk, and the system may also be
    in the process of altering the filesystem when you happen to give the computer
    a kick. A new generation of filesystems supports journals to make filesystem corruption
    less common, you should always shut the system down properly. And regardless of
    the filesystem in use, filesystem checks are still necessary now and to maintain
    sanity.


    The tool to check a filesystem is fsck. Unlike the mkfs program, there is a different
    version of fsck for each filesystem type that Linux supports. For example, when
    you run fsck on an Extended filesystem series (ext2/ext3/ext4), fsck recognizes
    the filesystem type and starts the e2fs utility. Therefore you generally don''t
    need to type fsck, unlessck can''t figure out the filesystem type or you''re looking
    for the e2fs manual page.


    The information presented in this section is specific to the Extended filesystem
    series and e2fsck.

    Run fsck in interactive mode, give the device or the mount point (as listed in
    /etc/fstab) as the argument. For example:


    ```

    # fsck /dev/sd1

    ```


    > You should not use fsck on a mounted filesystem because the kernel may alter
    the disk data as you run the check, runtime mismatches can crash your system and
    corrupt files. There is only one exception: If you mount the root partition read-only
    in single-user mode, you may use fsck on.


