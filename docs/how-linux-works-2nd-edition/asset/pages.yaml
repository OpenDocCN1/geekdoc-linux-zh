- img_proc: true
  md: 'There are three components to message:


    +   - The program name, 1s. Some programs omit identifying information, which
    can be annoying when writing shell scripts, but it''s not really a big deal.


    +   - The filename, /dsafsda, which is a more specific piece of information. There''s
    a problem with this path.


    +   - The error No such file or directory indicates the problem with the filename.


    Putting it all together, you get something like “1s tried to open /dsafsda but
    couldn''t because it doesn''t exist. This may seem obvious, but these messages
    can get a little confusing when you run a shell script that includes an erroneous
    command under a different name.


    When troubleshooting errors, always address the first error first. Some programs
    report that they can do anything before reporting a host of other problems. For
    example, you say you a fictitious program scumd and you see this message:


    ```

    scumd: cannot access /etc/scumd/config: No such file or directory

    ```


    Following this is a huge list of other error messages that look like a complete
    catastrophe. Don''t let those errors distract you. You just need to check /etc/scumd/config.


    > Don''t confuse error messages with warning messages. Warnings often look like
    errors, but they contain the word warning. A warning usually means something is
    wrong but the program will try to continue running anyway. To fix a problem noted
    in a warning, you may have to hunt down a process and kill it before doing anything
    else. (You''ll learn about listing and killing processes in Section 2.16.)


    # 2.15.2 Common Errors


    Many errors you''ll encounter in Unix programs result from things that can go
    wrong with files and processes. Here''s an error message hit parade:


    # No such file or directory


    This is the number one error. You tried to access a file that doesn''t exist.
    Because the Unix I/O system doesn''t discriminate between files and directories,
    this error message occurs everywhere. You get it when you try to read a file that
    doesn''t exist, when you try to change a directory that isn''t there, when you
    try to write to a file in a directory that doesn''t exist, and so on.


    # File exists


    In this case, you probably tried to create a file that already exists. This is
    common when you try to create a directory with the same name as file.'
