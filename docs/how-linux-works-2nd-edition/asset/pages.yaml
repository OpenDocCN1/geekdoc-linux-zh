  md: '# 7.10.3 PAM and Passwords


    Due to the evolution of Linux password verification over the years, a number of
    password configuration artifacts remain cause confusion at times. The first to
    be aware of is the file /etc/login.defs. This is the configuration for the original
    shadow password file. It contains information about the encryption algorithm used
    for the shadow password file, but it''s rarely used on a modern system with PAM
    installed, because the configuration contains this information. This said, the
    encryption algorithm in /etc/login.defs should match the PAM configuration in
    the rare case that you run into an application that doesn''t support PAM.


    Where PAM gets its information about the password encryption scheme? Recall that
    there are two ways for PAM to interact with passwords: the auth function (for
    verifying a password) and the password function (for setting a password). It''s
    easiest to track down the password-setting parameter. The best way is to just
    get it:


    ```

    $ *.unix /etc/pam.d/*

    ```


    The matching lines contain pam_unix.so and look something like this:


    | password | sufficient | pam_unix.so obscure sha512 |


    The arguments obscure and sha512 tell PAM what to do when setting a password.
    First, PAM checks to see if the password is “obscure” (enough that, the isn''t
    too similar to the old password, other things), and then PAM uses the SHA512 algorithm
    to encrypt the new password.


    But this happens only when a user sets a password, not when PAM is verifying a
    password. So how does PAM know which algorithm to use when authenticating? Unfortunately,
    the configuration wont tell you anything; there are no encryption arguments for
    pam_unix.so for the auth function. The manual pages also tell you nothing.


    It turns out (as of this writing) pam_unix.so simply tries to guess the algorithm,
    usually by asking the libcrypt library to do the dirty work of trying a bunch
    of things until something works or there is nothing left to try. Therefore, you
    normally don''t have worry about the verification encryption algorithm.


