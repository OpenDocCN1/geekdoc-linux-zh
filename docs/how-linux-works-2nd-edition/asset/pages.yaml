    # BUILDING ON THE BASICS


    ![](img/1b61c74a588aedf0032126b8bd0e7422_369_0.png)


    The chapters in this book have covered the fundamental components of a Linux system,
    from low-level kernel and process organization, to networking, to some of the
    tools used to build software. With all of behind you, what can you do now? Quite
    a lot, as it turns out! Because Linux supports nearly every kind of non-proprietary
    programming environment, it''s only natural that a plethora of applications is
    available. Let''s look at a few application areas where Linux excels and see how
    what you''ve learned in this book relates.'
