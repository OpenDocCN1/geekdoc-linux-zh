    # 9.6 The Physical Layer and Ethernet


    One of the keys to understand the Internet is that it''s a software network. Nothing
    we''ve discussed so far is hardware specific, and indeed, one reason for the Internet''s
    success is that it works on almost any kind of computer, operating system, and
    physical network. However, you still have to put a network layer on top of some
    kind of hardware, and that interface is called the physical layer.


    In this book, we''ll look at the most common kind of physical layer: an Ethernet
    network. The IEEE 802 family of standards defines many different kinds of Ethernet
    networks, from wired to wireless, but they have a few things to consider, in the
    following:


    +   - devices on an Ethernet network have a Media Access Control (MAC) address,
    sometimes called a hardware address. This address is independent of a host''s
    IP address, and it is unique to that host''s Ethernet network (but not necessarily
    a larger software network such as the Internet). A sample MAC address is 10:78:d2:eb:76:97.

    - Devices on an Ethernet network sent in frames, which are wrappers around the
    data sent. A frame contains the origin and destination MAC addresses.


    Ethernet doesn''t really attempt to go beyond hardware on a single network. For
    example, if you have two different Ethernet networks with one attached to both
    (and two different network interface devices), you can''t directly transmit a
    frame from one network to the other unless you set up a special Ethernet bridge.
    And this is where higher network layers come in. By convention, each Ethernet
    network is also an an Ethernet subnet. Even though a frame can''t leave one physical
    network, a router can take the data out of a frame, repackage it, and send it
    to a host on a different physical network, which is exactly what happens on the
    Internet.


    # 9.7 Understanding Kernel Network Interfaces


    The physical and the Ethernet layers must be connected in a way that allows the
    Internet layer to retain its hardware-independent flexibility. The Linux kernel
    maintains its own division between the two layers and provides communication standards
    for linking them called a (kernel) network interface. When you configure a network
    interface, you link the IP address settings from the Internet side with the hardware
    identification on the physical'
