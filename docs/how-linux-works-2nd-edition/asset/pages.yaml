    +   1. Upon activation of Unit R, systemd monitors the resource.

    2. When anything tries to access the resource, systemd blocks the resource, and
    the input to the resource is buffered.

    3. systemd activates Unit A.

    4. When the service from Unit A is ready, it takes control of the resource, reads
    the buffered input, and runs normally.


    There are a few concerns:


    +   * You must make sure that your resource unit covers every resource that the
    service provides. This normally isn''t a problem, as most services have just one
    point of access.

    * You need to make sure your resource unit is tied to the service unit that it
    represents. This can be implicit or explicit, and in some cases, many options
    represent different ways for systemd to perform the handoff to the service unit.

    * Not servers know how to interface with the units that systemd can provide.


