  md: "Threads confuse things when it comes to resource monitoring because individual\
    \ threads in a multithreaded process can consume resources simultaneously. For\
    \ example, top doesn't show threads by default; you'll need to press H to turn\
    \ it on. For most of the resource monitoring tools you're about to see, you'll\
    \ have to do a little extra work to turn on the thread display.\n\n# 8.5 Introduction\
    \ to Resource Monitoring\n\nNow we'll discuss some topics in resource monitoring,\
    \ including processor (CPU) time, memory, and disk I/O. We'll examine utilization\
    \ on a system-wide scale, as well as on a per-process basis.\n\nMany people know\
    \ the inner workings of the Linux kernel in the interest of improving performance.\
    \ However, most Linux systems perform well under a distribution's default settings,\
    \ and you can spend days trying to tune your machine's performance with meaningful\
    \ results, especially if you don't know what to look for. So rather think about\
    \ performance as you experiment with the tools in this chapter, think about seeing\
    \ the kernel in action as it divides resources among processes.\n\n# 8.6 Measuring\
    \ CPU Time\n\nTo monitor one or more specific processes over time, use the -p\
    \ option to top, with this syntax: \n\n```\n$ top -p pids [-p pid2 ...]\n```\n\
    \nTo find out how much CPU time a command uses during its lifetime, most shells\
    \ have a built-in command that doesn't provide extensive statistics, so you'll\
    \ probably need to run /usr/bin/time. For example, to measure the CPU time used\
    \ by ls, run\n\n```\n$ /usr/bin/time ls\n```\n\nAfter ls terminates, time should\
    \ print output like that below. The key fields are as follows:\n\n```\n0.05user\
    \ 0.00.44elapsed 31%CPU (0avgtext+0avgdata maxresident)kInputs0Outputs (125major+5minor)pagefaults\
    \ 0swaps\n```\n\n+   **User time** The number of seconds that the CPU has spent\
    \ running its program's code. On modern processors, some commands run quickly,\
    \ and therefore the CPU time is so low, that time rounds to zero.\n\n+   **System\
    \ time** How much time the kernel spends the process's work (for example, reading\
    \ files and directories)."
