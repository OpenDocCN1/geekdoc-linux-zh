    messing things up.


    Now, if you''re really desperate, say with a catastrophic disk failure upon your
    hands and no backups, isn''t a lot you can do other than hope a professional service
    can "scrape the platters."


    # 4.2.12 Special-Purpose Filesystems


    Not filesystems represent storage on physical media. Specifically, most versions
    of Unix have filesystems that serve as system interfaces. If this, rather than
    serving only as a means to store data on a device, a filesystem can represent
    system information such as process IDs and kernel diagnostics. This idea goes
    back to the /dev mechanism, which is an early model of using files for I/O interfaces.
    The /proc idea came from the eighth edition of Research Unix, implemented by Tom
    J. Kil and when Bell Labs (including many of the original Unix designers) created
    Plan 9—a research operating system that uses filesystem abstraction to a new level
    (http://plan9.bell-labs.com/sys/dev/9.html).


    The special filesystem types in common use on Linux include the following:


    **proc** Mounted on /proc. The name /proc is actually an abbreviation for process.
    Each numbered directory /proc is actually the process ID of a current process
    on the system; the files in those directories represent various aspects of the
    processes. The /proc/self represents the current process. The Linux proc filesystem
    includes a deal of additional kernel and hardware information in files like /proc/cpuinfo.
    (There has been a push to move information regarding processes out of /proc and
    /sys).


    **sysfs** Mounted on /sys. (You saw this in Chapter 3.)


    **tmpfs** Mounted on /run and other locations. With tmpfs, you can use your physical
    memory and swap space as temporary storage. For example, you can mount tmpfs where
    you like, using the size and nr_blocks options to control the maximum size. However,
    be careful not to constantly put things into a tmpfs that your system will eventually
    run out of memory and programs will start to crash. (For years, Sun Microsystems
    used a version of tmpfs for that caused problems on long-running systems.)'
