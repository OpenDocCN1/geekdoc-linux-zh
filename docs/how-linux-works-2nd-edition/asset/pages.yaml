  md: 'If you don''t use either of these network configuration schemes, you can still
    use the keyfile plugin to specify the unmanaged device directly inside your NetworkManager.conf
    file using the MAC address. Here''s how it might look:


    ```

    [keyfile]

    unmanaged-devices=mac:10:78:d2:eb:76:97;mac:1c:65:9dc:ff:b9

    ```


    # Dispatching


    One final detail of NetworkManager configuration relates to specifying additional
    system actions for when a network interface goes up or down. For example, some
    daemons need to know when to start or stop listening on an interface in order
    to work correctly (such the secure shell daemon in the next chapter).


    When the network interface stands on a system changes, NetworkManager runs everything
    in /etc/NetworkManager/dispatcher with an argument such as up or down. This is
    relatively straightforward, but many distributions have their own network control
    scripts so they don''t place the individual patch scripts in this directory. Ubuntu,
    for example, has one script named ifupdown that runs in an appropriate subdirectory
    of /etc/network, such as /etc/network/if-up.d.


    As a result of the NetworkManager configuration, the details of these scripts
    are relatively unimportant; all you need to know how to track down the appropriate
    location if you need to make an addition or change. Ever, don''t be shy about
    looking at scripts on your system.


    # 9.12 Resolving Hostnames


    One of the basic tasks in any network configuration is hostname resolution with
    DNS. You''ve already seen the host resolution that translates a name such as www.example.com
    to an IP address such as 10.23.2.132.


    DNS differs from the network elements we''ve looked at so far because it''s in
    the application layer, entirely in user space. Technically, it is slightly out
    of place in this chapter alongside the Internet and physical layer discussion,
    but without proper DNS configuration, your Internet connection is practically
    worthless. No one in their right mind advertises IP addresses for websites and
    email addresses a host''s IP address is subject to change and it''s not to remember
    a bunch of numbers. Automatic network configuration services such as DHCP nearly
    includes DNS configuration.


    Nearly all network applications on a Linux system perform DNS lookups. The process
    typically unfolds like this:


    +   1. The application calls a function to look up the IP address behind a hostname.
    This function is in the system''s shared library, so the application doesn''t
    need to know the details of how it works or whether the implementation will change.'
  merge: -1
  pgno: 230
- img_proc: true
  md: '2. When the function in /etc/nswitch library runs, it acts according to a set
    of rules (found in /etc/nswitch.conf) to determine a plan of action on lookups.
    For example, the rules usually say that even before going to DNS, check for a
    manual override in the /etc/hosts file.


    3. When the function decides to use DNS for the name lookup, it consults an additional
    configuration file to find a DNS server. The name server is given as an IP address.


    4. The function sends a DNS lookup request (over the network) to the name server.


    5. The name server replies with the IP address for the hostname, and the function
    returns this IP address to the application.


    This is the simplified version. In a typical modern system, there are more actors
    attempting to speed up the transaction and/or add flexibility. Let''s ignore that
    for now and take a closer look at the basic pieces.


    # 9.12.1 /etc/hosts


    On systems, you can override hostname lookups with the /etc/hosts file. It looks
    like this:


    | 127.0.0.1 | localhost | atlantic |

    | 10.23.2.3 | atlantic.aem7.net | atlantic |

    | 10.23.2.4 | pacific.aem7.net | pacific |


    You''ll nearly always see the entry for localhost here (see Section 9.13).


    > NOTE In the old days, there was one central hosts file that everyone copied
    to their own machine in order to stay up-to-date (see RFCs 606, 608, 623, and
    625), but as ARPANET/Internet grew, this quickly got out of hand.


    # 9.12.2 resolv.conf


    The traditional configuration file for DNS servers is /etc/resolv.conf. When things
    were simpler, a typical example might have looked like this, where the ISP''s
    name server addresses are 10.32.45.23 and 10.32.2.3.


    ```

    search mydomain.example.com example.com

    nameserver 10.32.45.23

    nameserver 10.32.2.3

    ```


    The search line defines rules for incomplete hostnames (just the first part of
    the hostname; for example, myserver instead of myserver.example.com). Here, the
    resolver library would try to look up host.mydomain.example.com and host.example.com.
    But things are usually no longer this straightforward. enhancements and modifications
    have been made to the DNS configuration.'
