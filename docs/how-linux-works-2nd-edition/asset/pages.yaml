- img_proc: true
  md: 'Feel free to skip ahead to Chapter 6 to learn the specifics of user space start
    and the init program that the kernel runs as its first process. The remainder
    of this chapter details how the kernel starts.


    # 5.3 Kernel Parameters


    When running the Linux kernel, the boot loader passes in a set of text-based kernel
    parameters that tell the kernel how it should start. The parameters specify many
    different types of behavior, such as the amount of diagnostic output the kernel
    should produce and device driver-specific options.

    You can view the kernel parameters from your system''s boot by looking at the
    /proc/cmdline


    ```

    $ cat /proc/cmdline

    BOOT_IMAGE=/boot/vmlinuz-3.2.0-67-generic-pae root=UUID=70ccd67-6ae6-44f6-812c-51ab8036d29
    quiet splash vt.handoff=7

    ```


    The parameters are either single-word flags, such as root and key=value, such
    as vt.handoff=7. The parameters are important, such as the splash flag for displaying
    a splash screen, but one that is critical is the root parameter. This is the location
    of the root filesystem; without it, the kernel cannot find init and therefore
    cannot perform the user space start.


    The root filesystem can be specified as a device file, such as in this example:


    ```

    root=/dev/sda1

    ```


    However, on most modern desktop systems, a UUID is more common (see Section 4.2.4):


    ```

    root=UUID=70ccd67-6ae6-44f6-812c-51ab8036d29

    ```


    The root is normal; it instructs the kernel to mount the root filesystem in read-only
    mode upon user space start. (Read-only fsck can check the root filesystem safely;
    after check, the boot process remounts the root filesystem in read-write mode.)nUpon
