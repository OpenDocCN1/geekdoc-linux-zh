  md: 'After the kernel has started, the user-space startup procedure often generates
    messages. These messages will likely be more difficult to view and review on most
    systems you won''t find them in a single log file. Startup scripts usually print
    the messages to the console and they usually isn''t a problem because the boot
    process finishes. However, each script typically writes its own log. Some versions
    of it, such as Upstart and system, can capture diagnostic messages from startup
    and runtime that would normally go to the console.


    # ## 5.2 Kernel Initialization and Boot Options


    Upon startup, the Linux kernel initializes in this general order:


    +   1. CPU inspection

    2. Memory inspection

    3. Device bus discovery

    4. Device discovery

    5. Auxiliary kernel subsystem setup (networking, and so on)

    6. Root filesystem mount

    7. User space start


    The first steps aren''t too remarkable, but when the kernel gets to devices, a
    question of dependencies arises. For example, the disk device may depend on bus
    support and SCSI subsystem support.


    Later in the initialization process, the kernel must mount a root system before
    starting init. In general, you won''t have to worry about any of this, except
    that some necessary kernel modules rather than part of the main kernel. On some
    machines, you may need to load these kernel modules before the true root filesystem
    is mounted. We''ll cover this problem and its initial filesystem workaround solutions
    in Section 6.8.


    As of writing the kernel does not emit specific messages when it is about to start
    its first process. However, the following messages are a good indication that
    the user-space handoff is to happen because this is where the kernel protects
    its own memory from user-space processes:


    ```

    Freeing unused kernel memory: 740k freed

    Write protecting the kernel text: 5820k

    Write protecting the kernel read-only data: 2376k

    NX-protecting the kernel data: 4420k

    ```


    You may also see a message about the root filesystem being mounted at this point.'
