- img_proc: true
  md: '# 1.3.3 Device Drivers and Management


    The kernel''s role with devices is pretty simple. A device is typically accessible
    only in kernel mode because improper access (such as a user process asking to
    turn off the power) could crash the machine. Another problem is that different
    devices rarely have the same programming interface, even if the devices do the
    same thing, such as two different network cards. Therefore, device drivers have
    traditionally been part of the kernel, and they strive to present a uniform interface
    to user processes in order to simplify the software-developer''s job.


    # 1.3.4 System Calls and Support


    There are other kinds of kernel features available to user processes. For example,
    system calls (or syscalls) perform tasks that a user process alone cannot do well
    or at all. For example, the acts of opening, reading, and writing files all involve
    system calls.


    Two system calls, fork() and exec(), are important to understanding how processes
    start:


    +   - fork() When a process calls fork(), the kernel creates a nearly identical
    copy of the process.

    - exec() When a process calls exec(program), the kernel starts program, replacing
    the current process.


    Other than init (see Chapter 6)


    ![](img/1b61c74a588aedf0032126b8bd0e7422_31_0.png)


    Figure 1-2: Starting a new process


    > NOTE System calls are normally denoted with parentheses. In the example shown
    in Figure 1-2, the process asking the kernel to create another process must perform
    a fork() system call. This notation derives from the way the call would be written
    in the C programming language. You don''t need to know C to understand this book;
    just remember that a system call is an interaction between a process and kernel.
    In addition, this book simplifies certain groups of system calls. For example,
    exec() refers to an entire family of system calls that all perform a similar task
    but differ in programming.'
