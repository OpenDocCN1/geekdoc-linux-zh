    - Mount options (in parentheses). (See Section 4.2.6 for more details).


    To mount a filesystem, use the mount command as follows with the filesystem type,
    device, and desired mount point:


    ```

    # mount -t type device mountpoint

    ```


    For example, to mount the Fourth Extended filesystem /dev/sdf2 on /home/extra,
    use this command:


    ```

    # mount ext4 /dev/sdf2 /home/extra

    ```


    You normally don''t need to supply the -t type option because mount can usually
    figure it out for you. However, sometimes it''s necessary to distinguish between
    two types, such as the various FAT-type filesystems.

    See Section 4.2.6 for a few more options to mount. To unmount (detach) a filesystem,
    use the unmount command:


    ```

    # unmount mountpoint

    ```


    You can also unmount a filesystem with its device instead of its mount point.


    # 4.2.4 Filesystem UUID


    The method of mounting filesystems discussed in the preceding section depends
    on device names. However, device names can change because they depend on the order
    in which the kernel finds the devices. To solve this problem, you can identify
    and mount filesystems by their Universal Unique Identifier (UUID), a software
    standard. The UUID is a type of serial number, and each one should be different.
    Filesystem creation programs make mk2fs generate a UUID when initializing the
    filesystem data structure.


    To list devices and the corresponding filesystems and UUIDs on your system, use
    the blkid (block ID) program:


    ```

    # blkid

    /dev/sdf2: UUID="a9011c2b-1c03-4288-b3fe-ba961a0898" TYPE="ext4"

    /dev/sda1: UUID="70dcc6e7-6a6e-44f6-8112-5aaab803d629" TYPE="ext4"

    /dev/sda5: UUID="592dcfd1-58d4-4769-9ea8-5f412a896980" TYPE="swap"

    /dev/sde1: SEC_TYPE="msdos" UUID="3762-6138" TYPE="vfat"

    ```


    In this example, blkid found four partitions with data: two ext4 filesystems,
    one with a swap space signature (see Section 4.3), and one with a FAT-based filesystem.
    The Linux partitions all have standard UUIDs, but the FAT partition doesn''t have
    one. You can reference the FAT partition with its FAT volume serial number (in
    this case, 3762-6138).'
