    Representing an interface type that has largely been replaced by USB, the unidirectional
    parallel port devices /dev/lp0 and /dev/lp1 correspond to LPT1 and LPT2 in Windows.
    You can send files (such as a file to be printed) directly to a parallel port
    with the cat command, but you might need to give the printer an extra form or
    reset afterward. A server such as CUPS is much better at handling interaction
    with a printer. The bidirectional parallel ports are /dev/port0 and /dev/port1.'
