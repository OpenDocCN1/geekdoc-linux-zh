  md: 'if you want more than four, you designate one partition as an extended partition.
    Next, you subdivide the extended partition into logical partitions that the operating
    system can use as it would any other partition. In this example, partition 2 is
    an extended partition that contains logical partition 5.


    > The filesystem that parted lists is not necessarily the system ID defined in
    MBR entries. The MBR system ID is just a number; for example, 83 is a Linux partition
    and 82 is Linux swap. Therefore, parted attempts to determine a filesystem on
    its own. If you absolutely must know the system ID for an MBR, use fdisk -1.


    # Initial Kernel Read


    When initially reading the MBR table, the Linux kernel produces the following
    debugging output (remember that you can view this with dmesg):


    ```

    sda: sda1 sda2 < s5 >

    ```


    The sda2 < s5 > output indicates that /dev/sda2 is an extended partition containing
    one logical partition, /dev/sda5. You''ll normally ignore extended partitions
    because you''ll typically want to access only the logical partitions inside.


    # 4.1.2 Changing Partition Tables


    Viewing partition tables is a relatively simple and harmless operation. Altering
    partition tables is also relatively easy, but there are risks involved in making
    this kind of change to the disk. Keep the following in mind:


    +   Changing the partition table makes it difficult to recover any data on partitions
    that you delete because it changes the initial point of reference for a filesystem.
    Make sure you have a backup of the disk you''re partitioning contains critical
    data.

    Ensure that no partitions on your target disk are currently in use. This is a
    concern because Linux distributions automatically mount any detected filesystem.
    (See Section 4.2.3 for more on mounting and unmounting.)


    When you''re ready, choose your partitioning program. If you''d like to use parted,
    you can use the command-line parted utility or a graphical interface such as fdisk-style,
    gdisk if you''re using GPT partitioning. These utilities all have online help
    and are easy to learn. (Try them on a flash device or something similar if you
    don''t have spare disks.)


    That said, there is a major difference in the way parted and fdisk work. With
    parted, you design your new partition table before making the actual changes to
    the disk; fdisk only makes the changes as you exit the program. With parted, partitions
    are created, modified, and removed as you issue the commands. You don'' get the
    chance to review the partition table before you change it.'
  merge: -1
  pgno: 93
- img_proc: true
  md: 'These differences are also important to understanding how these two utilities
    interact with the kernel. Both fdisk and parted modify the partitions entirely
    in user space; there is no need to provide kernel support for rewriting a partition
    table because user space can read and modify all of a block device.


    Eventually, the kernel must read the partition table in order to present the partitions
    as block devices. The fdisk utility uses a relatively simple method: After modifying
    the partition table, fdisk issues a system call on the disk to tell the kernel
    that it should reload the partition table. The kernel then generates debugging
    output that you can view with dmesg. For example, if you create two partitions
    on /dev/sdb, you will see:


    ```

    sdf: sdf1 sdf2

    ```


    In comparison, the parted tools do not use this disk-wide system call. Instead,
    they signal the kernel when individual partitions are altered. After processing
    a single partition change, the kernel does not produce the debugging output.


    There are a few ways to see the partition changes:


    +   - Use udevadm to watch the kernel events. For example, udevadm monitor --kernel
    will show the old partition devices being removed and the new ones being added.

    - Check /proc/partitions for full partition information.

    - Check /sys/block/device/ for altered partition system interfaces or /dev altered
    partition devices.


    If absolutely must be sure that you have modified a partition table, you can perform
    the old-style system call that fdisk uses using the blockdev command. For example,
    to force the kernel to reload the partition table on /dev/sd1,


    ```

    # blockdev --rereadt /dev/sd1

    ```


    At this point, you have all you need to know about partitioning disks. However,
    if you''re interested in learning a few more details about disks, read on. Otherwise,
    skip ahead to Section 4.2 to learn about putting a file-system on the disk.


    # 4.1.3 Disk and Partition Geometry


    Any device with moving parts introduces complexity into a software system because
    there are physical elements that resist abstraction. A hard disk is no exception;
    even though you think of a hard disk as a block device with random access to any
    block, there are serious performance consequences if you aren''t careful about
    how you lay out data on the disk. Consider the physical properties of the simple-platter
    disk illustrated in Figure 4-3.'
  merge: -1
  pgno: 94
- img_proc: true
  md: 'The disk consists of a spinning platter on a spindle, with a head attached
    to a moving arm that can sweep across the radius of the disk. As the disk spins
    underneath the head, the head reads data. When the arm is in position, the head
    can only read data from a fixed circle. This circle is called a cylinder because
    larger disks have more than one platter, all stacked and spinning around the spindle.
    Each platter can have one or two heads, for the top/or bottom of the platter,
    and all heads are attached to the same arm and move in concert. Because there
    are many cylinders on the disk, from small ones around the center to large ones
    around the periphery of the disk, you can divide a cylinder into slices called
    sectors. This way of thinking about the disk geometry is called CHS, for cylinder-head-sector.


    ![](img/1b61c74a588aedf0032126b8bd0e7422_95_0.png)


    Figure 4-3: Top-down view of a hard disk


    > NOTE A track is a part of a cylinder that a single head accesses, in Figure
    4-3, a cylinder is also a track. You probably don''t need to worry about tracks.


    The kernel and the various partitioning programs can tell you that a disk reports
    as its number of cylinders (and sectors, which are slices of cylinders). However,
    on a modern hard disk, the reported values are fiction! The traditional addressing
    scheme that uses CHS doesn''t scale with modern hardware, does it not account
    for the fact that you can put more data into outer cylinders than inner cylinders.
    Disk hardware supports Logical Block Addressing (LBA) to simply address a location
    on the disk by a number, but remnants of CHS remain. For example, the MBR partition
    table contains CHS information as well as LBA equivalents, and some boot loaders
    are still dumb enough to believe the CHS values (not most Linux boot loaders use
    the LBA values).


    Nevertheless, the idea of cylinders has been important to partitioning because
    cylinders are ideal boundaries for partitioning. Continuously reading a data stream
    from a cylinder is very fast because the head can continue'
  merge: -1
  pgno: 95
- img_proc: true
  md: 'up data as the disk spins. A partition arranged as a set of adjacent cylinders
    also allows for fast continuous data access because the head doesn''t need to
    move very far between cylinders.


    Some partitioning programs complain if you don''t place your partitions precisely
    on cylinder boundaries. Ignore this; there''s little you can do because the reported
    CHS values of modern disks simply aren''t true. The disk''s LBA scheme ensures
    that your partitions are where they''re supposed to be.


    # 4.1.4 Solid-State Disks (SSDs)


    Storage devices with no moving parts, such as solid-state disks (SSDs), are radically
    different from spinning disks in terms of their access characteristics. For these,
    random access is not a problem because there''s no head to sweep across a platter,
    but certain factors affect performance.


    One of the most significant factors affecting the performance of SSDs is partition
    alignment. When you read from an SSD, you read it in chunks—typically 4096 bytes
    at a time—and the read must begin in a multiple of the same size. If your partition
    and its data do not lie on a 4096-boundary, you may have to do two reads instead
    of one for small, common operations, such as reading the contents of a directory.


    Many partitioning utilities (parted and gparted, example) include functionality
    to newly created partitions at the beginning of the disks, so you may never need
    to worry about improper offsets between. However, if you''re curious about where
    your partitions begin and just to make sure they begin on a boundary, you can
    easily find this information by looking in /sys/block. Here''s an example for
    a partition /dev/sda/sdf2:


    ```

    $ /sys/block/sdf/sdf2/start

    1953126

    ```


    This partition starts at 1,953,126 bytes from the beginning of the disk. Because
    this number is not divisible by 4,096, the partition would not be attaining optimal
    performance if it were on SSD.


    # 4.2 Filesystems


    The last link between the kernel and user space for disks is typically the filesystem;
    this is what you''re accustomed to interacting with when you run commands like
    ls and cd. As previously mentioned, the filesystem is a form of database; it supplies
    the structure to transform a simple block device into the sophisticated hierarchy
    of files and subdirectories that users can understand.


    At one time, filesystems resided on disks and other physical media exclusively
    for data storage. However, the tree-like directory structure and I/O interface
    of filesystems are quite versatile, so filesystems now perform a variety of tasks,
    such as the system interfaces that you see in /sys and /proc.'
  merge: -1
  pgno: 96
- img_proc: true
  md: 'Filesystems are also traditionally implemented in the kernel, but the innovation
    of 9P from Plan 9 (http://plan9.bell-labs.com/sys/doc/9.html) inspired the development
    of user-space filesystems. The File System in User Space (FUSE) allows user-space
    filesystems in Linux.


    The Virtual File System (VFS) abstraction layer completes the filesystem implementation.
    Much as the SCSI subsystem standardizes communication between different device
    types and kernel control commands, VFS ensures that all filesystem implementations
    support a standard interface so that user-space applications access files and
    directories in the same manner. VFS support has enabled Linux to support an extraordinarily
    large number of filesystems.


    # 4.2.1 Filesystem Types


    Linux filesystem support native designs optimized for Linux, foreign types such
    as the Windows FAT family, universal filesystems like ISO 9660, and many others.
    The following list includes the most common types of filesystems for data storage.
    The type names as recognized by Linux are in parentheses next to the filesystem
    names.


    Although the Extended filesystem series has been perfectly acceptable to most
    casual users, many advances have been made in filesystem technology that even
    ext4 cannot utilize to the backward compatibility requirement. The advances are
    primarily in scalability enhancements pertaining'
