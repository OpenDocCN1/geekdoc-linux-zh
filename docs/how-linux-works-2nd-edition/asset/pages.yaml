    this rule:


    ```

    KERNEL="sd[sr*|ciss*", ENV{DEVTYPE}="disk", ENV{ID_SERIAL}="*",

    SYMLINK+="disk/by-id/$env{ID_BUS}-$env{ID_SERIAL}"

    ```


    You can see that this rule creates ENV{ID_BUS} to be set, and it has one directive:


    ```

    SYMLINK+="disk/by-id/$env{ID_BUS}-$env{ID_SERIAL}"

    ```


    Upon encountering this directive, udev adds a symbolic link for the incoming device.
    So now you know where the symbolic links can from!'
