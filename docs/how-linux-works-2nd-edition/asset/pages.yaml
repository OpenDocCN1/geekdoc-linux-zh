  md: '# 16.3.5 Autoconf Targets


    Once you get configure working, you''ll find that the Makefile that it generates
    targets in addition to the standard all and install:


    +   - `make distclean` This is similar to make clean except that it removes all
    generated files, including Makefiles, config.h, config.log, and so on. The idea
    is that the source tree should look like a unpacked distribution after running
    make distclean.


    +   - `make check` Some packages come with a battery of tests to verify that the
    compiled programs work properly; the command make check runs the tests.


    +   - `make install-strip` This is like make install except that it strips the
    symbol table and other debugging information from executables and libraries when
    installing. Stripped binaries require much less space.


    # 16.3.6 Autoconf Log Files


    If something goes wrong during the configure process and the cause isn''t obvious,
    you can examine config.log to find the problem. Unfortunately, config.log is a
    gigantic file, which can make it difficult to locate the exact source of the problem.


    The general approach to finding the problem is to go to the very end of config.log
    (for example, by pressing G) and then page back until you see the problem. However,
    there is still a lot of stuff at the end because configure dumps its entire environment
    there, including output variables, cache variables, and other definitions. So
    than going to the end and search backward for a string such as more details or
    some other part near the end of the failed configure output. (Remember that you
    can initiate a reverse search in less with the ? command.) There''s a good chance
    that the error will be just above your finds.


    # 16.3.7 pkg-config


    There are many third-party libraries that keeping all of them in one location
    can be messy. However, installing each with a separate prefix can lead to problems
    when building packages that require these third-party libraries. if you want to
    compile OpenSSH, you need the OpenSSL library. How do you tell the OpenSSH configuration
    process the location of the OpenSSL library and which libraries are required?


    Many libraries now use the pkg-config program not only to advertise the locations
    of their include files and libraries but also to specify the exact flags that
    you need to compile and link a program. The syntax is as follows:


    ```

    $ pkg-config options package1 package2 ...

    ```'
