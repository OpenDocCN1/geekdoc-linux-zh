  md: 'A very common task for sed is to substitute text for a regular expression (see
    Section 2.5.1), like this:


    ```

    $ sed /exp/text/

    ```


    So if you wanted to replace the first colon in /etc/passwd with a % and send the
    result to the standard output, you''d do it like this:


    ```

    $ sed s/:/\%/ /etc/passwd

