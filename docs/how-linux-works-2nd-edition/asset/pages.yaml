  md: '# Table 10-1: OpenSSH Key Files


    | Filename | Key Type |

    | --- | --- |

    | ssh_host_rsa_key | Private RSA key (version 2) |

    | ssh_host_rsa_key.pub | Public RSA key (version 2) |

    | ssh_host_dsa_key | Private DSA key (version 2) |

    | ssh_host_dsa_key.pub | Public DSA key (version 2) |

    | ssh_host_key | Private RSA key (version 1) |

    | ssh_host_key.pub | Public RSA key (version 1) |


    Normally you won''t need to build the keys because the OpenSSH installation program
    or your distribution''s installation script will do it for you, but you need to
    know how to create keys if you plan to use programs like ssh-agent. To create
    SSH protocol version 2 keys, use the ssh-keygen program with OpenSSH:


    ```

    # ssh-keygen -t rsa -N '''' -f /etc/ssh/ssh_host_rsa_key

    # ssh-keygen -t dsa -N '''' -f /etc/ssh/ssh_host_dsa_key

    ```


    For version 1 keys,


    ```

    # ssh-keygen -t rsa1 -N '''' -f /etc/ssh/ssh_known_hosts

    ```


    The SSH server and clients also use a key file called ssh_known_hosts, which contains
    public keys from other hosts. If you want to use host-based authentication, the
    server''s ssh_hosts hosts file must contain the public host keys of all trusted
    clients. Knowing about the keys is handy if you''re replacing a machine. When
    installing a new machine from scratch, you can import the key from the old machine
    to ensure that users don''t get mismatches when connecting to the new one.


    # The SSH Server


    Most distributions ship with SSH, they usually don''t start the sshd server by
    default. On Ubuntu and Debian, installing the SSH server package creates the keys,
    starts the server, and adds the startup to the bootstrap configuration. On Fedora,
    sshd is installed by default but turned off. Use chkconfig to check this (this
    won''t start the server immediately); use service sshd start for that):


    ```

    # chkconfig sshd on

    ```


    Fedora normally creates any missing key files upon the first startup. If you don''t
    have any input installed yet, running sshd as root starts the server, and upon
    startup, sshd writes its PID to /var/run/sshd.pid.'
