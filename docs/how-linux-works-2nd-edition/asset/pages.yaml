    # 8.4 Threads


    In Linux, some processes are divided into pieces called threads. A thread is very
    similar to a process—it has an identifier (TID, or thread ID), and the kernel
    schedules and runs threads just like processes. However, unlike processes, which
    usually do not share system resources as memory and I/O connections with other
    processes, all threads inside a single process share their system resources and
    memory.


    # 8.4.1 Single-Threaded and Multithreaded Processes


    Many processes have only one thread. A process with one thread is single-threaded,
    and a process with more than one thread is multithreaded. All processes start
    out single-threaded. This starting thread is usually called the main thread. The
    main thread may then start new threads in order for the process to become multithreaded,
    similar to the way a process can fork() to start a new process.


    > It''s to refer to threads at all when a process is single-threaded. This book
    will not mention threads unless multithreaded processes make a difference in what
    you see or experience.


    The primary advantage of a multithreaded process is that when the process has
    a lot to do, threads run simultaneously on multiple processes, potentially speeding
    up computation. You can also achieve simultaneous computation with multiple processes,
    threads start faster than processes, and it is easier and/or more efficient for
    threads to communicate using their shared memory than it is for processes to communicate
    over a channel such as a network connection or a pipe.


    Some programs use threads to overcome problems managing multiple I/O resources.
    Traditionally, a process would sometimes fork() to start a new subprocess in order
    to deal with a new input or output stream. Threads offer a similar mechanism without
    the overhead of starting a new process.'
