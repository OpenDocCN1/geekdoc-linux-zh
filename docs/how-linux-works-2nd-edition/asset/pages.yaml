  md: '# Job State Transitions


    There are many job states, but there''s a set way to move between them. For example,
    here''s how a typical job starts:


    +   1. All jobs begin in the stop/waiting status.

    2. When a user or a system event starts a job, the job''s goal changes from stop
    to start.

    3. Upstart changes the job''s state from waiting to starting, so the status is
    now start/starting.

    4. Upstart emits a starting job event.

    5. The job performs whatever it needs to do for the starting from starting to
    pre-start and emits the pre-start job event.

    6. The job works its way through several states until it hits the run-ning state.

    7. Upstart emits a started job event.


    Task termination involves a similar set of state changes and events. (See the
    startup-events(7) manual page for details on all of the states and transitions
    in both goals).


