    # 13.5 Default User Settings


    The best way to write startup files and choose defaults for new users is to experiment
    with a new user on the system. Create the test user with an empty home directory
    and refrain from copying your own startup files to the user''s directory. Write
    the new startup files from scratch.


    When you think you have a working shell, log in as the new user in all possible
    ways (on the console, remotely, and so on). Make sure you test as many things
    as possible, including the windowing system operation and manual pages. When you''re
    happy with the test user, create a second test user, copying the startup files
    from the first user. If everything works, you now have a new set of startup files
    that you can distribute to new users.


    The following sections outline reasonable defaults for new users.


    # 13.5.1 Shell Defaults


    The default shell for any new user on a Linux system should be bash:


    +   Users interact with the same shell that they use to write shell scripts (for
    example, csh is a notoriously bad scripting tool—don''t even think about it).


    +   bash is standard on Linux systems.


    +   bash uses GNU readline, and therefore its interface is identical to that of
    many other tools.


    +   bash gives you fine, easy-to-understand control over I/O redirection and file
    handlers.


    However, many Unix wizards use shells such as csh and tsh simply because they
    can''t bear to switch. Of course, you can choose any shell you like, but bash
    if you don''t have any preference, and use bash as the default for any new user
    on the system. (A user can change his shell with the csh command to suit individual
    preferences.)


    > There are plenty of other shells out there (rc, ksh, zsh, es, and so on). Some
    are not appropriate for beginner shells, but zsh and fish are sometimes popular
    with new users looking for an alternative shell.


    # 13.5.2 Editor


    On a traditional system, the default editor should be vi or emacs. These are the
    only editors guaranteed to exist on nearly any Unix system,


    User Environments 295'
