  md: 'As you can see, there are a number of very interesting properties you can change
    with the --set-prop option (See the input(1) manual page for more information.)


    # Mouse


    You can manipulate device-related settings with the input command, and many of
    the most useful pertain to the mouse (pointer). You can change many settings directly
    as properties, but it''s usually easier with the specialized --set-pt-feedback
    and --set-button-map options to input. For example, if you have a three-button
    mouse at dev on which you''d like to reverse the order of buttons (this is handy
    for left-handed users), this:


    ```

    $ xinput --set-button-map dev 3 2 1

    ```


    # Keyboard


    The different keyboard layouts available internationally present particular difficulties
    for integration into any window system. X has always had an internal keyboard-mapping
    capability in its core protocol that you can manipulate with the xmodmap command,
    and reasonably modern systems use the XKB (the X keyboard extension) to gain finer
    control.


    XKB is complicated, so much many people still use xmodmap when they need to make
    changes. The basic idea behind XKB is that you can define a keyboard map and compile
    it with the xkbmap command, then load and activate that in the X server with the
    setxkbmap command. Two especially interesting features of the system are:


    +   - You can define partial maps to supplement existing maps. This is especially
    handy for tasks such as changing your Caps Lock key into a Control key, and it
    is used by many graphical keyboard preference utilities in desktop environments.


    +   - You can define individual maps for each attached keyboard.


    # Desktop xsetroot


    The old X command allows you to set the background color and other characteristics
    of the root window, but it produces no on most machines because the root window
    is never visible. Instead, most desktop environments place a big window in the
    back of all of your windows in order to enable features as "active wallpaper"
    and desktop file browsing. There are ways to change the background from the command
    line (for example, with the gsettings command in some GNOME installations), but
    if you actually want to do this, probably have too much time on your hands.'
