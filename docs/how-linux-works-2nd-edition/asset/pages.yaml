    process forks—just whether it Use the Type option in your service unit file to
    indicate its startup behavior. There are two basic startup styles:


    **Type=simple** The service doesn''t fork.


    **Type=forking** The service forks, and systemd expects the original process to
    terminate. Upon termination, systemd assumes that the service is ready.


    The Type=simple option doesn''t account for the fact that a service may take some
    time to set up, and systemd doesn''t know when to start any dependencies that
    absolutely require such a service to be ready. One way to deal with this is to
    use delayed startup (see Section 6.4.7). However, some startup styles can indicate
    that the service itself will notify systemd when it is ready.


    **Type=notify** The service sends a notification specific to systemd (with the
    sd_notify() function call) when it''s ready.


    **Type=dbus** The service registers itself on the D-bus (Desktop Bus) when it''s
    ready.


    Another startup style is specified with Type=oneshot; here the service process
    actually terminates completely when it is finished. With such service, you will
    almost certainly need to add a RemainAfterExit=yes option so that systemd will
    still regard the service as active even after its processes terminate.


    Finally, there''s one last style: Type=idle. This simply instructs systemd not
    to start the service until there are no active jobs. The idea here is just to
    delay a service startup until other services have started to keep the system load
    down, or to keep services from stepping on one another''s output. Remember, once
    a service has started, the systemd job started the service terminates.


    # 6.4.7 systemd On-Demand and Resource-Parallelized Startup


    One of systemd''s most significant features is its ability to delay a unit startup
    until it is absolutely needed. The setup typically works like this:


    +   1. You create a system unit (call it Unit A) for the system service that you''d
    like to use, as normal.

    2. You identify a system resource such as a network port/socket, file, or device
    that Unit A uses to offer its services.

    3. You create another systemd unit, Unit R, to represent that resource. These
    units have special types such as socket units, path units, and device units.'
