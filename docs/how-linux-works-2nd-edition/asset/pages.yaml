    #  8.3 Tracing Process Execution and System Calls


    The tools we''ve seen so far examine active processes. However, if you have no
    idea why a program dies immediately after starting up, even lsof won''t help you.
    In fact, you''d have a difficult time running lsof with a failed command.

    The strace (system call trace) and ltrace (library trace) commands can help you
    discover what a program attempts to do. These tools produce extraordinarily large
    amounts of output, but once you know what to look for, you''ll have many tools
    at your disposal for tracking down problems.


    # 8.3.1 strace


    Recall that a system call is a privileged operation that a user-space process
    asks the kernel to perform, such as opening and reading data from a file. The
    strace utility prints all the system calls that a process makes. To see it in
    action, run this command:


    ```

    $ strace cat /dev/null

    ```


    In Chapter 1, you learned that when one process wants to start another, it invokes
    the fork() system call to spawn a copy of itself, and then the copy uses a member
    of the exec() family of system calls to start running a new program. The strace
    command begins working on the new process (the copy of the original process) just
    after the fork() call. Therefore, the first lines of the output from this command
    should show exec() in action, followed by a memory initialization call, brk(),
    as follows:


    ```

    exec("/bin/cat", "cat", "/dev/null") [/* $8 vars */] = 0

    brk(0) = 0x9b65000

    ```


    The next part of the output deals with loading shared libraries. You can ignore
    this unless you really want to know what the shared library system does.'
