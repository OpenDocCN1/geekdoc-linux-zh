  md: 'themselves, but they are sometimes used as management tools for other jobs
    because other jobs can start and stop based on the events coming from an abstract
    job.


    # Viewing Jobs


    You can view Upstart jobs and job status with the initctl command. To get an overview
    of what''s happening on your system, run:


    # $ initctl list


    You''ll get a lot of output, so let''s look at two sample jobs that might appear
    in a typical listing. Here''s a simple example of a task job status:


    ```

    mountall stop/waiting

    ```


    This indicates that the mountall task job has a status of stop/waiting, meaning
    that it is not running. (Unfortunately, you can''t use the status to determine
    whether a job already ran or not because stop/waiting also applies to jobs that
    have never run.)


    +   - Service jobs that have associated processes appear in the status listing


    ```

    tty1 start/running, process 1634

    ```


    This line shows that the tty1 job is running and process ID 1634 is performing
    the job. (Not all service jobs have associated processes.)


    > If you know a job''s name, you can view its status directly with initctl status
    job.


    The status of the initctl output (e.g., stop/waiting) can be confusing. The left-hand
    side (before the /) is the goal, or what the job is supposed to be working toward,
    such as start or stop. The right-hand side is the current state, or what the job
    is doing right now, such as waiting or running. In the preceding listing, the
    tty1 job has status/running, meaning that its goal is to start. The state of running
    indicates that it has started successfully. (For service jobs, the running state
    is nominal.)


    The mountall case is a bit different because jobs do not remain running. The stop/waiting
    status usually indicates that the job started and completed its task. Upon completing
    completion, it moved from a start to a stop goal, and it is now waiting for further
    commands from Upstart.


    Unfortunately, as mentioned earlier, because jobs that have never started also
    have an Upstart stop/waiting status, you can''t really tell whether a job has
    run or never started unless you enable debugging and look at the logs, as described
    in Section 6.5.


    You won''t see jobs running on your system that were started with Upstart''s compatibility
    feature.'
