    # ## 1.9 Here Documents


    Say you want to print a large section of text or feed a lot of text to another
    command. Rather than use several echo commands, you can use the shell''s here
    document feature, as shown in the following script:


    ```

    #!bin/sh

    DATE=$(date)

    cat <<EOF

    DATE=$DATE

    ```


    The output above is from the Unix date command.

    It''s not a very interesting command.

    EOF


    The items in bold control the here document. The <<EOF tells the shell to redirect
    all lines that follow the standard input of the command that precedes <<EOF, in
    which case is cat. The redirection starts as soon as the EOF marker appears on
    one by itself. The marker can be any string, remember to use the same marker at
    the beginning and end of the document. Also, convention dictates that the marker
    be in all uppercase letters.

    Notice the shell variable $DATE in the here document. The shell expands variables
    inside here documents, which is especially useful when you''re printing reports
    that contain many variables.


    # ## 1.10 Important Shell Script Utilities


    Several programs are particularly useful in shell scripts. Certain utilities such
    as basename are really only practical when used with other programs, and therefore
    don''t find a place outside shell scripts. However, such as awk can be quite useful
    on the command line, too.


