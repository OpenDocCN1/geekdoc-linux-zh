    # No space left on device


    You''re out of disk space.


    # Permission denied


    You get this when you attempt to read or write to a file or directory that you''re
    not allowed to access (you have insufficient privileges). This error also shows
    when you try to execute a file that does not have the execute bit set (even if
    you can read the file). You''ll read more about permissions in Section 2.17.


    # Operation not permitted


    This happens when you try to kill a process that you don''t own.


    # Segmentation fault, Bus error


    A segmentation fault essentially means that the person who wrote the program that
    you ran screwed up somewhere. The program tried to access a part of memory that
    it was not allowed to touch, and the operating system killed it. Similarly, a
    bus error means the program tried to access some memory in a particular way that
    it shouldn''t. When you get one of these errors, you might be giving a program
    some input that it did not expect.


