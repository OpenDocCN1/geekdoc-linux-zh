  md: '# A CLOSER LOOK AT PROCESSES

    AND RESOURCE UTILIZATION


    ![](img/1b61c74a588aedf0032126b8bd0e7422_195_0.png)


    This chapter takes deeper into the relationships between processes, the kernel,
    and system resources. There are three basic hardware resources: CPU, memory, and
    I/O. Processes vie for these resources, and the kernel''s job is to allocate resources
    fairly. The kernel itself is also a resource—a software resource that processes
    use to perform tasks such as creating new processes and communicating with other
    processes.


    Many of the tools that you see in this chapter are often thought of as performance-monitoring
    tools. They''re particularly helpful if your system is slowing to a crawl and
    you''re trying to figure out why. However, you shouldn''t get too distracted by
    performance; trying to optimize a system that''s already working correctly is
    often a waste of time. Instead, concentrate on understanding what the tools actually
    measure, and you''ll gain great insight into how the kernel works.'
