  md: 'As you can see, mkfs.ext4 is a symbolic link to mk2fs. This is important to
    remember if you run across a system without a specific mkfs command or when you''re
    looking up the documentation for a particular filesystem. Each filesystem''s creation
    utility has its own manual page, like mk2fs(8). This shouldn''t be a problem on
    most systems, because accessing the mkfs.ext4(8) manual page should redirect you
    to the mk2fs(8) page, but keep it in mind.


    # 4.2.3 Mounting a filesystem


    On Unix, the process of attaching a filesystem is called mounting. When the system
    boots, the kernel reads some configuration data and mounts root (/) based on the
    configuration data.

    in order to mount a filesystem, you must know the following:


    +   * The filesystem''s device (such as a disk partition; where the actual system
    data resides).

    * The filesystem.

    * The mount point—that is, the place in the current system''s directory hierarchy
    where filesystem will be. The mount point is always a normal directory. For instance,
    you could use /cdrom as a mount point for CD-ROM devices. The mount point need
    not be directly below / it may be anywhere on the system.


    When mounting a filesystem, the common terminology is "mount a device on mount
    point". To learn the current status of your system, run mount. The output should
    look like this:


    ```

    $ mount

    /dev/sda1 type ext4 (rw,errors=remount-ro)

    proc on /proc type proc (rw,noexec,nosuid,nodev)

    sysfs on /sys type sysfs (rw,noexec,nosuid,nodev)

    node on /sys/fs/fuse type fusectl (rw)

    node on /sys/kernel/debug type debugfs (rw)

    node on /sys/kernel/security type securityfs (rw)

    ndev on /dev devptmps (rw,mode=0755)

    devpts on /dev/pts type devpts (rw,noexec,nosuid,gid=5,mode=0620)

    tmpfs on /run type tmpfs (rw,noexec,nosuid,size=10%,mode=0755)

    --snap--

    ```


    Each line corresponds to one currently mounted filesystem, with items in this
    order:


    +   * The device, such as /dev/sda3. Notice that some of these aren''t devices
    (proc, for example) but are stands-in for real device names because these special-purpose
    filesystems do not need devices.

    * The word on.

    * The mount point.

    * The word type.'
