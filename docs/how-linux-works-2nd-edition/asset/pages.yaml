    # 9.5.2 traceroute


    The ICMP-based traceroute will come in handy when you reach the material on routing
    later in this chapter. Use Traceroute host to see the path your packets take to
    a remote host (traceroute -n host will disable hostname lookups.)


    One of the best things about traceroute is that it returns return times each step
    in the route, as demonstrated in this output format:


    ```

    4 206.220.243.106 1.163 ms 0.997 ms 1.182 ms

    5 204.203.65 1.312 ms 1.12 ms 1.463 ms

    6 64.159.125 1.421 ms 1.37 ms 1.347 ms

    7 64.159.18 55.642 ms 55.625 ms 55.663 ms

    8 209.247.10.230 55.89 ms 55.617 ms 55.964 ms

    9 209.244.14.226 55.851 ms 55.726 ms 55.832 ms

    10 209.246.29.174 56.419 ms 56.44 ms 56.423 ms

    ```


    Because this output shows a big latency between hops 6 and 7, that part of the
    route is probably some sort of long-distance link.

    The output from traceroute can be inconsistent. For example, the replies may time
    out at a certain step, only to "reappear" in later steps. The reason is usually
    that the router that refused to return the debugging output that traceroute wants
    but in later steps were happy to return the output. In addition, a router might
    choose to assign a lower priority to the debugging traffic than it does to normal
    traffic.


    # 9.5.3 DNS and host


    IP addresses are difficult to remember and subject to change, which is why we
    normally use names such as www.example.com instead. The DNS library on your system
    handles this translation automatically, but sometimes you''ll have to manually
    translate between a name and an IP address.

    The find the IP address by a domain name, use the host command:


    ```

    $ www.example.com

    www.example.com has IPv4 93.184.216.119

    www.example.com has IPv6 2006:2800:220:6d:26bf:1447:1097:aa7

    ```


    Notice how this example has both the IPv4 address 93.184.216.119 and the much
    larger IPv6 address. This shows that this host has an address on the next-generation
    version of the Internet.


    You can use host in reverse: Enter an IP address of a hostname to try to discover
    the hostname behind the IP address. But don''t expect this to work reliably. Many
    hostnames represent a single IP address, and DNS doesn''t know how to determine
    which hostname should correspond'
