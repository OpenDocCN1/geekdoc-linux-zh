    # 3.5 udev


    We''ve already talked about unnecessary complexity in the kernel is dangerous
    because you can easily introduce system instability. Device file management is
    an example: You can create device files in user space, why would you do this in
    the kernel? The Linux kernel can send notifications to a user-process (called
    udev) upon detecting a new device on the system (for example, when someone attaches
    a USB flash drive). The user-process on the other end enables the new device''s
    characteristics, creates a device file, and then performs any device initialization.

    Was that the theory. Unfortunately, in practice, there is a problem with this
    approach—device files are necessary early in the boot procedure, udev could not
    depend on any devices that it was supposed to create, and it would need to perform
    its startup very quickly so that the rest of the system get help waiting for udev
    to start.


    # 3.5.1 devtmpfs


    The devtmpfs filesystem was developed in response to the problem of device availability
    during boot (see Section 4.2 for more details on filesystems). The filesystem
    is similar to the devfs support, but it''s simplified. The kernel creates device
    files as necessary, but it notifies udev that a new device is available. Upon
    receiving this signal, udev does not create the device files, but it performs
    device initialization and process notification. Additionally, it creates a number
