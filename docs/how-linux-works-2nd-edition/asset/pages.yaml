  md: '# 3


    # DEVICES


    ![](img/1b61c74a588aedf0032126b8bd0e7422_69_0.png)


    This chapter is a basic tour of the kernel-provided device infrastructure in a
    functioning Linux system. Throughout the history of Linux, there have been many
    changes to how the kernel presents devices to the user. We''ll begin by looking
    at the traditional system of device files to see how the kernel provides device
    configuration information through sysfs. Our goal is to be able to extract information
    about a system in order to understand a few rudimentary operations. Later chapters
    will cover interacting with specific kinds of devices in greater detail.


    It''s important to understand how the kernel interacts with user space when presented
    with new devices. The udev system enables user-space programs to automatically
    configure and use new devices. You''ll see the basic workings of how the kernel
    sends a message to a user-space process through udev, as well as what the process
    does with it.'
  merge: -1
  pgno: 69
- img_proc: true
  md: '# 3.1 Device Files


    It is easy to manipulate most devices on a Unix system because the kernel presents
    many of the device I/O interfaces to users as files. These device files are sometimes
    called device nodes. Not only can a programmer regular file operations to work
    with a device, but some devices are accessible to standard programs like cat,
    so you don''t have to be a programmer to use a device. However, there is a limit
    to what you can do with a file interface, so not all devices or device capabilities
    are accessible with standard I/O.


    Linux uses the same design for device files as other Unix flavors. Device files
    are in the /dev directory, and ls -l /dev reveals more than a few files in /dev.
    So how do you work with devices?


    To get started, consider this command:


    ```

    $ echo blah blah /dev/null

    ```


    As any command with redirected output, this sends some stuff from the standard
    output to a file. However, the file is /dev/null, a device, and the kernel decides
    what to do with any data written to this device. In the case of /dev/null, the
    kernel simply ignores the input and throws away the data. To identify a device
    and its permissions, use ls -l


    ```

    $ ls -l

    dw-rw-rw-- 1 root disk 8, 1 Sep 08:37 sda1

    crw-rw-rw-- 1 root 1, 3 Sep 08:37 null

    prw-r--r-- 1 root 0 Mar 3 19:17 fdata

    s-rwxrwtwt 1 root 0 Dec 18 07:43 log

    ```


    Listing 3-1: Device files


    Note the first character of each line (the first character of the file) in Listing
    3-1. If this character is b, c, p, or s, the file is a device. These letters stand
    for block, character, pipe, and socket, respectively, as described in more detail
    below.


    # Block device


    Programs access data from a block device in fixed chunks. The sda1 in the preceding
    example is a disk device, a type of block device. Disks can be easily split into
    blocks of data. Because the device''s total size is fixed and easy to index, processes
    have random access to any block in it with the help of the kernel.


    # Character device


    Character devices work with data streams. You can only read characters from write
    characters to character devices, previously demonstrated with /dev/null. Character
    devices don''t have a size; when you read from or write to one, the kernel usually
    performs a read or write operation on'
  merge: -1
  pgno: 70
- img_proc: true
  md: 'the device. Printers directly attached to your computer are represented by
    character devices. It''s important to note that during character device interaction,
    the kernel cannot back up or reexamine the data stream after it has passed data
    to a device or process.


    # Pipe device


    Named pipes are like character devices, with another process at the end of the
    I/O stream instead of a kernel driver.


    # Socket device


    Sockets are special-purpose interfaces that are frequently used for interprocess
    communication. They''re often found outside the /dev directory. Socket files represent
    Unix domain sockets; you''ll learn more about them in Chapter 10.


    The numbers before the dates in the first two lines of Listing 3-1 are the major
    and minor device numbers that help the kernel identify the device. Similar devices
    usually have the same major number, as sda and sdb1 (both of which are hard partitions).


    > NOTE Not all devices files because the block and character device I/O interfaces
    are not appropriate in all cases. For example, network interfaces not have device
    files. It is theoretically possible to interact with a network interface using
    a single character device, but it would be exceptionally difficult, the kernel
    uses other I/O interfaces.


    # 3.2 The sysfs Device Path


    The traditional Unix /dev directory is a convenient way for user processes to
    reference and interface with devices supported by the kernel, but it''s also a
    very simplistic scheme. The name of the device in /dev tells you a bit about the
    device, but not a lot. Another problem is that the kernel assigns devices in the
    order in they are found, so a device may have a different name between reboots.


    To provide a uniform view for attached devices based on their hardware attributes,
    the Linux kernel offers its system of files and directories. The base path for
    devices is /sys/devices. For example, the SATA hard disk at /dev/sda might have
    the following path in sysfs:


    ```

    /sys/devices/pcci1000:00/0000.2/host0/target0:0:0:0:0:0/block/sda

    ```


    As you can see, this path is quite long compared with the /dev/sda-name, which
    is also a directory. You can''t really compare the two paths because they have
    different purposes. The /dev file is so that user processes can use the device,
    whereas the /sys/devices path is used to view'
  merge: -1
  pgno: 71
- img_proc: true
  md: 'information and manage the device. If you list the contents of a device path
    such as the preceding one, you''ll see something like the following:


    | alignment_offset | discard_alignment | holders | removable | size | uevent |

    | --- | --- | --- | --- | --- | --- |

    | bdi | events | inflight | ro | slaves | |

    | capability | events_async | power | sda1 | stat | |

    | dev | events_poll_msecs | queue | sda2 | subsystem |

    | device | ext_range | range | sda5 | trace |


    The files and subdirectories here are meant to be read primarily by humans, but
    you can get an idea of what they contain and represent by looking at an example
    such as the /dev file. Running cat in this directory displays 8:0, which happen
    to be the major and minor device numbers of /dev/sda.


    There are a few shortcuts in the /sys directory. For example, /sys/block should
    contain all of the block devices available on a system. However, those are just
    symbolic links; run -l /sys/block to reveal the true paths.


    It can be difficult to find the sysfs location of a device in /dev. Use the udevadm
    command to show the path and other attributes:


    ```

    $ udevadm info --query=all --name=/dev/sda

    ```


    The udevadm program is in /sbin; you can put this directory at the end of your
    path if it''s not already there.


    You''ll find more details about udevadm and the entire udev system in Section
    3.5.


    # 3.3 dd and Devices


    The program dd is extremely useful when working with block and character devices.
    This program''s sole function is to read from an input file or stream and write
    to an output file, possibly doing some conversion on the way.


    dd copies in blocks of a fixed size. Here''s how to use dd with a character-device
    and some common options:


    ```

    $ dd if=/dev/zero of=new_file bs=1024 count=1

    ```


    As you can see, the dd option format differs from the option formats of most Unix
    commands; it is based on an old IBM Job Control Language (JCL) style. Rather than
    use the dash (-) to signal something with the equals (=) sign. Give an option
    name and setting its value to something. The preceding example copies a single
    1024-byte block from /dev/zero (a continuous stream of zero bytes) to new_file.'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'These are the important dd options:

    **if=file** The input file. The default is the standard input.

    **of=file** The output file. The default is the standard output.

    **bs=size** The block size. dd reads and writes many bytes of data at a time.
    To abbreviate large chunks of data, you can use b and k to sign 512 and 1024 bytes,
    respectively. Therefore, the example could read bs=1k instead of bs=1024.


    **ibs=size, obs** The input and output block sizes. If you can use the same block
    size for both input and output, use the bs option; if not, use ibs and obs for
    input and output, respectively.


    **count=num** The total number of blocks to copy. When working with a huge file—or
    with a device that supplies an endless stream of data, such as /dev/zero—you want
    dd to stop at a fixed point or you could waste a lot of disk space, CPU time,
    or. Use count to copy a small sample from a large file or device.


    **skip=num** Skip the first num blocks in the input file or stream and not copy
    them to the output.


    ![](img/1b61c74a588aedf0032126b8bd0e7422_73_0.png)


    dd is very powerful, so make you know what you''re doing when you run it. It''s
    very easy to corrupt files and data on devices by making a careless mistake. It
    often helps to write the output to a new file if you''re not sure what it will
    do.


    # 3.4 Device Name Summary


    It can sometimes be difficult to find the name of a device (for example, when
    partitioning a disk). Here are a few ways to find out what it is:


    +   * Query udev using udevadm (see Section 3.5).

    * Look for the device in the /sys directory.

    * Guess the name from the output of the dmesg command, which prints the last kernel
    log messages (or see Section 7.2). This output might contain a description of
    the devices on your system.

    * For a disk device that is already visible to the system, you can check the output
    of the mount command.

    * Run /proc/devices to see the block and character devices for which your system
    currently has drivers. Each line consists of a number and name. The number is
    the major number of the device as described in Section 3.1. If you can guess the
    device from the name, look in /dev for the character or block devices with the
    corresponding major number, and you''ve found the device files.'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'Among these methods, only the first is reliable, but it does require udev.
    If you get into a situation where udev is not available, try the other methods
    but keep in mind that the kernel might not have a device file for your hardware.


    The following sections list the most common devices and their naming conventions.


    # 3.4.1 Hard Disks: /dev/sdb*


    Most disks attached to current Linux systems correspond to device names with an
    sd prefix, such as /dev/sda, /dev/sdb, and so on. These devices represent disks;
    the kernel makes separate device files, such as /dev/sda1 and /dev/sda2, for partitions
    on a disk.


    The naming convention requires a little explanation. The sd portion of the name
    stands for SCSI disk. Small Computer System Interface (SCSI) was originally developed
    as a hardware and protocol for communication between devices and other peripherals.
    Although traditional SCSI hardware is not used in modern machines, the SCSI protocol
    is everywhere due to its adaptability. USB storage devices use it to communicate.
    The story on SATA disks is a little more complicated, but the Linux kernel still
    uses SCSI commands at a certain point when talking to them.


    To list the devices on your system, use a utility that walks the device paths
    by sysfs. One of the most succinct tools is lsscsi. Here is how you can run it:


    ```

    $ lsscsi

    [0:0:0] disk ATA WDC WD3200AAJS-2 01.0 /dev/sda

    [1:0:0] cd/dvd ATA Slintype DVD A D5AS5H X15 /dev/sr0

    [2:0:0] disk FLASH Drive USB20 0.00 /dev/sdb

    ```


    The first column identifies the address of the device on the system, the second
    ② describes what kind of device it is, and the last ③ indicates where to find
    the device file. Everything else is vendor information.


    Linux assigns device files in the order in which its drivers encounter devices.
    In the previous example, the kernel found the disk first, the optical drive second,
    and the flash drive.


    Unfortunately, this device assignment scheme has traditionally caused problems
    when configuring hardware. For, example, that you have a system with three disks:
    /dev/sda, /dev/sdb, and /dev/sdc. If /dev/sdb explodes and you must remove the
    disk so that the machine can work again, the former /dev/sdc moves to /dev/sdb,
    and there is no longer a /dev/sdc. If you are referring to the device names directly
    in the fstab file (see Section 4.2,8), you would have to make some changes to
    file in order to get things (mostly) back to normal. To solve this problem, most
    modern Linux systems use the Universally Unique Identifier (UUID, see Section
    4.2) for persistent disk access.'
