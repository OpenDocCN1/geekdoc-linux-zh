    # How ld.so Finds Shared Libraries


    One of the common trouble points for shared libraries is that the dynamic linker
    should normally look for shared libraries in an executable''s preconfigured `runtime
    library search path` (`vpath`, `RPATH`), if it exists. You''ll see how to create
    this path shortly.

    Next, the dynamic linker looks in a system cache, `/etc/ld.so.cache`, to see if
    the library is in a standard location. This is a fast cache of the names of library
    files found in directories listed in the cache configuration file `/etc/ld.so.conf`.


    NOTE


    As is typical of many of the Linux configuration files that you''ve seen, ld.so.conf
    may include a number of files in a directory such as `/etc/ld.so.conf`


    Each line in `ld.so.conf` is a directory that you want to include in the cache.

    The list of directories is usually short, containing something like this:


    ```

    /lib/i686-linux-gnu

    /usr/lib/i686-linux-gnu

    ```


    The standard library directories `/lib` and `/usr/lib` are implicit, which means
    that you don''t need to include them in `/etc/ld.so.conf`.

    If you alter `ld.so.conf` or make a change to one of the shared library directories,
    you must rebuild the `/etc/ld.so.cache` file by hand with the following command:


    ```

    # ldconfig -v

    ```


    The -v option provides detailed information on libraries that `ldconfig` adds
    to the cache and any changes that it detects.

    There is one more place that ld.so looks for shared libraries: the environment
    variable `LD_LIBRARY_PATH`. We''ll talk about this soon.

    Don''t get into the habit of adding stuff to `/etc/ld.so.cache`. You should know
    what shared libraries are in the system cache, and if you put every bizarre shared
    library directory into the cache, you risk conflicts and an extremely disorganized
    system. When you compile software that needs an obscure library path, give your
    executable a built-in library search path. See how to do that.


    # Linking Programs Against Shared Libraries


    Let''s say you have a shared library `libweird.so.1` in `/opt/obscure/lib` that
    you need to link `myprog` against. Link the program as follows:


    ```

    $ cc -o myprog myprog.o -wl,-rpath=/opt/obscure/lib -L/opt/obscure/lib -lweird

    ```'
