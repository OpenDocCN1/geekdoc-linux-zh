    # # 14.4 The Future of X


    As you were reading the preceding discussion, you may have gotten the feeling
    that X is a really old system that''s been poked at a lot in order to get it to
    new tricks. You wouldn''t be far off. The X Window System was first developed
    in the 1980s. Although its evolution over the years has been significant (flexibility
    was an important part of its original design), you can push the original architecture
    only so far.


    One sign of the age of the X Window System is that the server itself supports
    an extremely large number of libraries, for backward compatibility. But perhaps
    more significantly, the idea of having a server manage clients, their windows,
    and as an intermediary for the window memory has become a burden on performance.
    It''s much faster to allow applications to render the contents of their windows
    directly in the display memory, to arrange the windows and do minimal management,
    called a *compositing window manager*, of the display memory.


    A standard based on this idea, Wayland, is a protocol that defines how clients
    talk to the compositing window manager. Other pieces include device device management
    and an X-compatibility system. As a protocol, Wayland also maintains the idea
    of network transparency. Many pieces of the Linux desktop do not support Wayland,
    as GNOME and KDE.


    But Wayland is not the only alternative to X. As of this writing, another project,
    Mir, has similar goals, though its architecture takes a somewhat different approach.
    At some point, there will be widespread adoption of at least one system, which
    may or not be one of these.


    These developments are significant because they won''t be limited to the Linux
    desktop. Due to its poor performance and gigantic footprint, the X Window System
    is not suitable for environments such as tablets and smartphones, so manufacturers
    have far used alternative systems to drive embedded Linux displays. However, standardized
    direct rendering can make for a more cost-effective way to support these displays.


    # # 14.5 D-Bus


    One of the most important developments to come out of the Linux desktop is the
    Desktop Bus (D-Bus), a message-passing system. D-Bus is important because it serves
    as an interprocess communication mechanism that allows desktop applications to
    talk to each other, and because most Linux systems use it to notify processes
    of system events, such as inserting a USB drive.'
