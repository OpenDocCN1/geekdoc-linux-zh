  md: '6845 be/4 juser 0.00 812.63 B/s 0.00% 0.00% chromium-browser

    19069 be/4 juser 0.00 812.63 B/s 0.00% 0.00% rhythmbox


    Along with the user, command, and/write columns, notice that there is a TID column
    (thread ID) instead of a process ID. The iotop tool is one of the few utilities
    that displays threads instead of processes.

    The PRIO (priority) column indicates the I/O priority. It''s similar to the CPU
    priority you''ve already seen, but it affects how quickly the kernel schedules
    I/O reads and writes for the process. In a priority such as be/4, with CPU priorities,
    lower numbers are more important; the priority level. The kernel allows more for
    I/O for a process with be/3 than one with be/4.

    The kernel uses the scheduling class to add more control for I/O-scheduling. You''ll
    see three scheduling classes from atop:


    +   be Best-effort. The kernel does its best to fairly schedule I/O for this class.
    Most processes run under this I/O scheduling class.


    +   rt Real-time. The kernel schedules any real-time I/O before any other class
    of I/O, no matter what.


    +   idle Idle. The kernel performs I/O for this class only when there is no other
    I/O to be done. There is no priority level for the idle scheduling class.


    You can check and change the I/O priority for a process with the ionic utility;
    see the ionice(1) manual page for details. You probably never need to worry about
    the I/O priority, though.


    # 8.12 Per-Process Monitoring with pidstat


