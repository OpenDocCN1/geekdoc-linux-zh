  md: 'fdisk The traditional text-based Linux disk partitioning tool. fdisk does not
    support GPT.


    gdisk A Version of fdisk that supports GPT but not MBR.


    Because it supports both MBR and GPT, we''ll use parted in this book. However,
    many people prefer the fdisk interface, and there''s nothing wrong with that.


    > NOTE

    Although parted can create and resize filesystems, it shouldn''t use it for filesystem
    manipulation because you can easily get confused. There is a critical difference
    between partitioning and filesystem manipulation. The partition table defines
    simple boundaries on the disk, whereas a filesystem is a much more involved data
    system. For this reason, we''ll use parted for partitioning but use separate utilities
    for creating filesystems (see Section 4.2.2). Even the parted documentation encourages
    you to create filesystems separately.


    # 4.1.1 Viewing a Partition Table


    You can view your partition table with parted -1. Here is sample output from two
    disk devices with different kinds of partition tables:


    ```

    # parted -1

    Model: Ata WDC WD3200AAJS-2 (scsi)

    Disk /dev/sda: 320GB

    Sector size (logical/physical): 512B/512B

    Partition Table: msdos

    ```


    | Start End Size Type File system Flags |

    | 1 | 1049KB 316GB 316GB primary ext4 | boot |

    | 2 | 316GB 320GB 4235MB extended | | |

    | 3 | 316GB 320GB 4235MB logical | linux-swap(1) |


    ```

    Model: FLASH Drive UT_USB20 (scsi)

    Disk /dev/sdb: 4041MB

    Sector size (logical/physical): 512B/512B

    Partition Table: gpt

    ```


    | Start End Size File system Name Flags |

    | 1 | 17.4KB 1000MB 1000MB | myfirst | |

    | 2 | 1000MB 4040MB 3040MB | mysecond |


    The first device, /dev/sda, uses the MBR partition table (called "msdos") by parted,
    and the second contains a GPT table. Note that there are different parameters
    for each partition table, because the tables themselves are different. In particular,
    there is no Name column for the MBR table because names do not exist under that
    scheme. (Arbitrarily chose names myfirst and mysecond in the GPT table.)


    The MBR table in this example contains primary, extended, and logical partitions.
    A primary partition is a normal subdivision of the disk; partition 1 is such a
    partition. The basic MBR has a limit of four partitions, so'
