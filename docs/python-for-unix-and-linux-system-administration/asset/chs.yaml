  \ 3-26 是使用正则表达式的相同示例。\n\n### 示例 3-26. Apache 日志文件解析器——正则表达式\n\n```python\n#!/usr/bin/env\
  \ python\n\"\"\"\n用法:\napache_log_parser_regex.py some_log_file\n该脚本接受一个命令行参数：要解析的日志文件名。\n\
  它将解析日志文件并生成一份报告，\n将远程主机与传输给它们的字节数相关联。\n\"\"\"\nimport sys\nimport re\n\nlog_line_re\
  \ = re.compile(r'''(?P<remote_host>\\S+) #IP ADDRESS\n                         \
  \     \\s+ #whitespace\n                              \\S+ #remote logname\n   \
  \                           \\s+ #whitespace\n                              \\S+\
  \ #remote user\n                              \\s+ #whitespace\n               \
  \               \\[[^\\[\\]]+\\] #time\n                              \\s+ #whitespace\n\
  \                              \"[\"]+\" #first line of request\n              \
  \                \\s+ #whitespace\n                              (?P<status>\\d+)\n\
  \                              \\s+ #whitespace\n                              (?P<bytes_sent>-|\\\
  d+)\n                              \\s* #whitespace\n                          \
  \      '', re.VERBOSE)\n\ndef dictify_logline(line):\n    '''返回 apache 合并日志文件中相关部分的字典\n\
  \    目前，我们感兴趣的字段只有远程主机和发送的字节数，\n    但为了保险起见放入了状态码。\n    '''\n    m = log_line_re.match(line)\n\
  \    if m:\n        groupdict = m.groupdict()\n        if groupdict['bytes_sent']\
  \ == '-':\n            groupdict['bytes_sent'] = '0'\n        return groupdict\n\
  \    else:\n        return {\n            'remote_host': None,\n            'status':\
  \ None,\n            'bytes_sent': \"0\",\n        }\n\ndef generate_log_report(logfile):\n\
  \    '''返回格式为 remote_host=>[字节数列表]的字典\n    此函数接受一个文件对象，遍历文件中的所有行，\n    并针对 Web 服务器的每次访问，生成每个远程主机传输的字节数报告。\n\
  \    '''\n    report_dict = {}\n    for line in logfile:\n        line_dict = dictify_logline(line)\n\
  \        print line_dict\n        try:\n            bytes_sent = int(line_dict['bytes_sent'])\n\
  \        except ValueError:\n            ## 完全忽略任何我们不理解的内容\n            continue\n\
  \        report_dict.setdefault(line_dict['remote_host'], []).append(bytes_sent)\n\
  \    return report_dict\n\nif __name__ == \"__main__\":\n    if not len(sys.argv)\
  \ > 1:\n        print __doc__\n        sys.exit(1)\n    infile_name = sys.argv[1]\n\
  \    try:\n        infile = open(infile_name, 'r')\n    except IOError:\n      \
  \  print \"你必须指定一个有效的文件进行解析\"\n        print __doc__\n        sys.exit(1)\n    log_report\
  \ = generate_log_report(infile)\n    print log_report\n    infile.close()\n```\n\
  \n从 `regex` 示例到“按空格分割”示例，我们修改的唯一函数是 `dictify_logline()`。这意味着我们保持了函数返回类型与 `regex`\
  \ 示例中完全相同。我们没有按空格分割日志行，而是使用了一个编译的正则表达式对象 `log_line_re` 来 `match()` 日志行。如果匹配成功，我们返回一个可能稍微修改过的\
  \ `groupdict()`，其中当字段包含 `-` 时，`bytes_sent` 被设置为 `0`（因为 `-` 表示没有）。在未匹配到任何内容的情况下，我们返回一个具有相同键的字典，但值设为\
  \ `None` 和 `0`。\n\n那么，正则表达式版本是否比字符串分割版本更好？实际上，确实更好。这里是针对新 `regex` 版本 Apache 解析脚本的单元测试：\n\
  \n```python\n#!/usr/bin/env python\nimport unittest\nimport apache_log_parser_regex\n\
  class TestApacheLogParser(unittest.TestCase):\n    def setUp(self):\n        pass\n\
  \    def testCombined(self):\n        # 测试 apache.org 的合并示例\n        log_entry =\
  \ '127.0.0.1 - [10/Oct/2000:13:55:36 -0700] \"GET /apache_pb.gif HTTP/1.0\" 200\
  \ 2326 \"Mozilla/4.0 (en; Win98;'\n        self.assertEqual(apache_log_parser_regex.dictify_logline(log_entry),\n\
  \            {'remote_host': '127.0.0.1', 'status': '200', 'bytes_sent': '2326'})\n\
  \n    def testCommon(self):\n        # 测试 apache.org 的通用示例\n        log_entry =\
  \ '127.0.0.1 - [10/Oct/2000:13:55:36 -0700] \"GET /apache_pb.gif HTTP/1.0\" 200\
  \ 2326'\n        self.assertEqual(apache_log_parser_regex.dictify_logline(log_entry),\n\
  \            {'remote_host': '127.0.0.1', 'status': '200', 'bytes_sent': '2326'})\n\
  \n    def testMalformed(self):\n        # 测试源自 apache.org 的异常格式修改\n        malformed_entry\
  \ = '127.0.0.1 - [10/Oct/2000:13:55:36 -0700] \"GET /some/url/with space.html HTTP/1.0\"\
  \ 200 2326'\n        self.assertEqual(apache_log_parser_regex.dictify_logline(malformed_entry),\n\
  \            {'remote_host': '127.0.0.1', 'status': '200', 'bytes_sent': '2326'})\n\
  \nif __name__ == '__main__':\n    unittest.main()\n```\n\n这是单元测试的结果：\n\n```\njmjones@dinkgutsy:code$\
  \ python test_apache_log_parser_regex.py\n...\n----------------------------------------------------------------------\n\
  Ran 3 tests in 0.001s\nOK\n```\n\n# ElementTree\n\n如果你需要解析的文本是 XML，那么你可能的方法与处理（例如）行导向日志文件的方法有所不同。你可能不想逐行读取文件并查找模式，可能不想过度依赖正则表达式。XML\
  \ 使用树形结构，因此按行读取可能不是你想要的。而使用正则表达式来构建树数据结构对于任何大于微小的文件来说都是一个巨大的头疼问题。\n\n\n\n那么，你可以用什么呢？处理\
  \ XML 通常有两种方法。一种是“XML 简单 API”，即 SAX。Python 标准库包含一个 SAX 解析器。`SAX` 通常速度极快，而且在解析你的\
  \ XML 时不会自动占用大量内存。但它是基于回调的，因此在处理某些特定数据时，当它遇到 XML 文档的某些部分（如开始标签和结束标签）时，它只会调用某些方法然后继续执行。这意味着你必须为你的数据设置处理程序并维护自己的状态，这可能是非常困难的。这两点使得“XML\
  \ 简单 API”中的“简单”二字显得有些有些不切谱。\n\n处理 XML 的另一种方法是使用文档对象模型，或 DOM。Python 标准库也包含一个 DOM\
  \ XML 库。`DOM` 通常比 `SAX` 慢且消耗更多内存，因为它会将整个 XML 树读取到内存中，并为树中的每个节点构建对象。使用 `DOM` 的用处是你不需要一直跟踪自己的状态，因为每个节点都知道它的父节点和子节点是谁。但\
  \ `DOM` API 最多其说也是很繁琐的。\n\n第三种选择是 `ElementTree`。`ElementTree` 是一个自 Python 2.5 起就包含在标准库中的\
  \ XML 解析库。`ElementTree` 感觉像是一个更轻量级的 DOM，具有实用的、实际上是非常友好的 API。除了代码的可用性外，它运行快且内存内存少。我们强烈推荐\
  \ `ElementTree`。如果你有 XML 解析任务，请先尝试 `ElementTree`。\n\n### 使用 ElementTree\n\n要使用 `ElementTree`\
  \ 开始解析 XML 文件，只需导入该库并 `parse()` 文件：\n\n```python\nIn [1]: from xml.etree import\
  \ ElementTree as ET\nIn [2]: tcusers = ET.parse('/etc/tomcat5.5/tomcat-users.xml')\n\
  In [3]: tcusers\nOut[3]: <xml.etree.ElementTree.ElementTree instance at 0xabb4d0>\n\
  ```\n\n为了在我们在使用库时减少击键次数，我们以 `ET` 的名导入了 `ElementTree` 模块。然后，我们告诉 `ElementTree` 解析来自已安装的\
  \ Tomcat Servlet 引擎的用户 XML 文件。我们将 `ElementTree` 对象命名为 `tcusers`。`tcusers` 的类型是 `xml.etree.ElementTree.ElementTree`。\n\
  \n我们删除了许可和使用说明，我们刚刚解析的 Tomcat 用户文件具有以下内容：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<tomcat-users>\n  <user name=\"tomcat\" password=\"tomcat\" roles=\"\
  tomcat\" />\n  <user name=\"role1\"  password=\"tomcat\" roles=\"role1\"  />\n \
  \ <user name=\"both\"   password=\"tomcat\" roles=\"tomcat,role1\" />\n</tomcat-users>\n\
  ```\n\n当 `ElementTree` `parse` Tomcat XML 文件时，它创建了一个树对象（我们将其称为 `tcusers`），我们可以用它获取\
  \ XML 文件中的各种节点。该树对象上两个最有趣的方法是 `find()` 和 `findall()`。`find()` 找到第一个匹配你传递的查询的节点，并根据该节点返回一个\
  \ `Element` 对象。`findall()` 找到所有匹配你传递的查询的节点，并返回基于这些匹配节点的 `Element` 对象列表。\n\n`find()`\
  \ 和 `findall()` 查找的模式类型是 XPath 表达式的一个有限子集。`ElementTree` 的有效搜索标准包括：标签名 `*`（匹配所有子元素）、`.`（匹配当前元素）以及\
  \ `//`（匹配搜索起始点的所有后代节点）。斜杠（`//`）字符可以用于分隔匹配标准。使用 Tomcat 用户文件，我们将使用 `find()` 和标签名来提取第一个\
  \ `user` 节点：\n\n```python\nIn [4]: first_user = tcusers.find('/user')\nIn [5]: first_user\n\
  Out[5]: <Element user at abdd88>\n```\n\n我们向 `find()` 喂了搜索标准 `'/user'`。开头的斜杠字符指定了从根节点开始的绝对路径。文本\
  \ `'user'` 指定了要查找的标签名。因此，`find()` 返回了第一个标签为 `user` 的节点。你可以看到我们所指的 `first_user` 对象类型是\
  \ `Element`。\n\n一些更有的 `Element` 方法和属性包括 `attrib`、`find()`、`findall()`、`get()`、`tag`\
  \ 和 `text`。`attrib` 是它所属的 `Element` 属性的字典。`find()` 和 `findall()` 在此处的工作方式与它们在 `ElementTree`\
  \ 对象上相同。`get()` 是一个字典方法，用于检索指定的属性，如果属性未定义，则返回 `None`。`attrib` 和 `get()` 访问同一个 XML\
  \ 标签的属性字典。`tag` 是一个包含当前 `Element` 标签名的属性。`text` 是一个包含当前 `Element` 中作为文本节点的内容的属性。\n\
  \n这里是 `ElementTree` 为 `first_user` `Element` 对象创建的 XML 元素：\n\n```xml\n  <user name=\"\
  tomcat\" password=\"tomcat\" roles=\"tomcat\" />\n```\n\n现在我们将调用 `tcusers` 对象的方法并引用它的属性：\n\
  \n```python\nIn [6]: first_user.attrib\nOut[6]: {'name': 'tomcat', 'password': 'tomcat',\
  \ 'roles': 'tomcat'}\nIn [7]: first_user.get('name')\nOut[7]: 'tomcat'\nIn [8]:\
  \ first_user.get('foo')\nIn [9]: first_user.tag\nOut[9]: 'user'\nIn [10]: first_user.text\n\
  ```\n\n现在你已经看到了 `ElementTree` 将做的一些基础知识，我们将看一个稍微复杂、更正式的示例。我们将解析 Tomcat 用户文件，并寻找\
  \ `name` 属性匹配我们指定的（在本例中为 `'tomcat'`）的 `user` 节点。\n\n### 示例 3-27. ElementTree 解析用户文件\n\
  \n```python\n#!/usr/bin/python\nfrom xml.etree import ElementTree as ET\nif __name__\
  \ == '__main__':\n  infile = '/etc/tomcat5.5/tomcat-users.xml'\n  tomcat_users =\
  \ ET.parse(infile)\n  for user in [e for e in tomcat_users.findall('/user') if e.get('name')\
  \ == 'tomcat']:\n    print user\n```\n\n这个示例唯一的技巧是由于使用了列表推导式来匹配 `name` 属性。运行此示例返回：\n\
  \n```bash\nmjones@dinkutsy:code$ python elementtree_users.py\n{'password': 'tomcat',\
  \ 'name': 'tomcat', 'roles': 'tomcat'}\n```\n\n最后，使用 `ElementTree` 从编写糟糕的 XML 中提取信息的示例。Mac\
  \ OS X 有一个名为 `system_profiler` 的工具，可以显示关于系统的大量信息。`system_profiler` 支持两种输出格式之一，但\
  \ XML 似乎是事后补的。我们想要提取的信息是操作系统版本，它包含在如下 XML 部分中：\n\n```xml\n<dict>\n  <key>dataType</key>\n\
  \  <string>SoftwareDataType</string>\n  <key>detailLevel</key>\n  <integer>-2</integer>\n\
  \  <key>items</key>\n  <array>\n    <dict>\n      <key>name</key>\n      <string>os_overview</string>\n\
  \      <key>kernel_version</key>\n      <string>Darwin 8.11.1</string>\n      <key>os_version</key>\n\
  \      <string>Mac OS X 10.4.11 (8S2167)</string>\n    </dict>\n  </array>\n</dict>\n\
  ```\n\n那么，我们为什么认为这个 XML 格式编写得糟糕？XML 标签没有任何属性。标签类型主要是数据类型。而且像交替的 `key` 和 `string`\
  \ 标签这样的元素位于同一个父节点下。\n\n### 示例 3-28. Mac OS X system_profiler 输出解析器\n\n```python\n\
  #!/usr/bin/python\nimport sys\nfrom xml.etree import ElementTree as ET\ne = ET.parse('system_profiler.xml')\n\
  if __name__ == '__main__':\n  for d in e.findall('/array/dict'):\n    if d.find('string').text\
  \ == 'SPSoftwareDataType':\n      sp_data = d.find('array').find('dict')\n     \
  \ break\n  else:\n    print \"SPSoftwareDataType NOT FOUND\"\n    sys.exit(1)\n\
  ```\n\n\n\n\n```\nrecord = []\nfor child in sp_data.getchildren():\n    record.append(child.text)\n\
  \    if child.tag == 'string':\n        print \"%-15s -> %s\" % tuple(record)\n\
  \        record = []\n```\n\n基本上，该脚本会寻找任何 `dict` 标签，该标签包含一个 `string` 子元素，且该元素的文本值为\
  \ `'SPSoftwareDataType'`。脚本正在查找的信息就在该节点下。在这个例子中，我们使用的唯一之前没有讨论过的内容就是 `getchildren()`\
  \ 方法。该方法简单地返回某个特定元素的子节点列表。除此之外之外，这个例子应该非常清晰易懂，尽管这个 XML 的写法本可以更好。以下是该脚本在运行 Mac OS\
  \ X Tiger 的笔记本电脑上运行时生成的输出：\n\n```\ndink:~/code jmjones$ python elementtree_system_profile.py\n\
  _name           -> os_overview\nkernel_version  -> Darwin 8.11.1\nos_version   \
  \   -> Mac OS X 10.4.11 (8S2167)\n```\n\nElementTree 是 Python 标准库的一个极佳补充。我们已经使用它很段时间了，并对它为我们所的一切非常满意。你可以尝试\
  \ Python 标准库中的 SAX 和 DOM 库，但我们认为你仍然回到 ElementTree。\n\n### 总结\n\n本章概述了在 Python 中处理文本的一些基础知识。我们处理了内置的\
  \ `string` 类型、正则表达式、标准输入和输出、`StringIO` 以及标准库中的 `urllib` 模块。然后，我们将这些许多内容整合到了两个解析\
  \ Apache 日文件的示例中。最后，我们讨论了 ElementTree 库的一些要点，并展示了在现实世界中使用它的两个示例。\n\n似乎当很多 Unix 用户在需要进行超出\
  \ `grep` 或 `awk` 舒适处理范围的文本梳理工作时，他们考虑的唯一高级替代方案是 Perl。虽然 Perl 是一种极其强大的语言，特别是在处理文本方面，但我们认为\
  \ Python 提供的功能与 Perl 一样丰富。事实上，如果你观察简洁的语法以及从过程化代码转换为面向对象代码的易用性，我们认为即使在文本处理领域，Python\
  \ 相比 Perl 也具有明显的优势。因此，我们希望下次当你有一个文本处理任务时，会首先选择 Python。\n\n# 第 4 章 文档与报告\n\n正如我们所知，你可能会发现工作中最枯燥、最不尽人意的方面之一，就是为了用户而记录各种信息。这可能是为了阅读文档的用户提供直接利益，也可能是为了用户提供间接利益，因为你或你的继任者在未来做出更改时可能会引用它。无论何种情况，创建文档通常是你工作的一个关键方面。但如果这不是一项你渴望去完成的任务，它可能会被忽视。Python\
  \ 在这可以提供帮助。不，Python 不能替你编写文档，但它可以帮助你收集、格式化并将信息分发给目标。\n\n在本章中，我们将重点关注：关于你编写的程序的收集、格式化和分发信息。你感兴趣共享的信息存在某处；它可能在某处的日志文件中；可能在你的脑子里；可能可以通过你执行的某些\
  \ shell 命令的结果获取；甚至可能在某处的数据库中。你要做的第一件事是收集这些信息。有效共享这些信息的下一步是以某种格式格式化数据，使其具有意义。格式可以是\
  \ PDF、PNG、JPG、HTML 甚至是纯文本。最后，你需要将这些信息传给感兴趣的人。对于相关方来说，接收电子邮件、访问网站还是直接查看共享驱动器上的文件最方便？\n\
  \n# 自动化信息收集\n\n信息共享的第一步是收集信息。书中还有两个章节专门用于收集数据：`文本处理` (第 3 章）和 `SNMP`（第 7 章）。文本处理包含了从大量文本中解析和提取各种数据的示例。该章节中的一个特定示例是从\
  \ Apache Web 服务器日志的每行中解析客户端 IP 地址、传输字节数和 HTTP 状态码。而 SNMP 包含了系统查询信息的示例，范围涵盖从安装的 RAM\
  \ 数量到网络接口的速度不等。\n\n收集信息可能比仅仅定位和提取某些数据要复杂。通常，这可能是一个从一种格式（如 Apache 日文件）获取信息，并将其存储在某种中间格式中以便以后使用的过程。例如，如果你想创建一个每个\
  \ IP 地址下载字节数的图表。此类存储的示例包括关系型数据库、pickle 文件、纯文本文件。\n\n本节的剩余部分将尝试整合文本处理章节中的一些概念。具体来说，它将展示如何基于\
  \ 第 3 章中的数据提取技术和 第 12 章中的数据存储技术进行构建。我们将使用 第 12 章中引入的 `shelve` 模块来存储来自每个唯一客户端的 HTTP\
  \ 请求信息。\n\n这是一个同时使用日志解析模块和 `shelve` 模块的简单模块：\n\n```python\n#!/usr/bin/env python\n\
  import shelve\nimport apache_log_regex\n\nlogfile = open('access.log', 'r')\nshelve_file\
  \ = shelve.open('access.s')\n\nfor line in logfile:\n    d_line = apache_log_regex.dictify_logline(line)\n\
  \    shelve_file[d_line['remote_host']] = \\\n        shelve_file.setdefault(d_line['remote_host'],\
  \ 0) + \\\n        int(d_line['bytes_sent'])\n\nlogfile.close()\nshelve_file.close()\n\
  ```\n\n这个示例首先导入了 `shelve` 和 `apache_log_regex`。`Shelve` 是 Python 标准库中的一个模块。`Apache_log_regex`\
  \ 是我们在 第 3 章中编写的模块。然后我们打开 Apache 日志文件 `access.log` 和一个 shelve 文件 `access.s`。我们遍历日志文件的每一行，并使用\
  \ Apache 日志解析模块为每行创建一个字典。该字典包含请求的 HTTP 状态码、客户端 IP 地址以及传输给客户端的字节数。然后，我们将该特定请求的字节数加到\
  \ `shelve` 对象中该客户端 IP 地址已计总的字节数上。如果 `shelve` 对象中该该 IP 地址的条目，总数将自动设置为零。遍历完日志文件的所有行后，我们关闭日志文件和\
  \ `shelve` 对象。我们将在在本章稍晚时候讨论格式化信息时再次使用这个示例。\n\n\n\n\n你可能没有想过将接收电子邮件是一种收集信息的手段，但它确实可以。想象你拥有一台服务器，它们之间无法轻易连接，但每台服务器都具备电子邮件功能。如果你有一个脚本，通过每隔几分钟登录和注销来监控这些服务器上的\
  \ 应用程序，你可以使用电子邮件作为信息传递机制。无论登录/注销成功还是失败，你都可以发送包含成功/失败信息的电子邮件。你可以收集这些邮件以进行报告，或者在服务器宕机时提醒某人。\n\
  \n获取邮件服务器邮件最常用的两种协议是 `IMAP` 和 `POP3`。按照 Python “内置电池包”的风格，标准库中提供了支持这两种协议的模块。\n\n\
  `POP3` 可能是这两种协议中更常用的，使用 `poplib` 通过 `POP3` 访问电子邮件非常简单。示例 4-1 显示了使用 `poplib` 获取存储在指定服务器上的所有邮件，并将其写入磁盘的一系列文件中。\n\
  \n### 示例 4-1. 使用 POP3 获取邮件\n\n```python\n#!/usr/bin/env python\nimport poplib\n\
  username = 'someuser'\npassword = 'S3Cr37'\nmail_server = 'mail.somedomain.com'\n\
  p = poplib.POP3(mail_server)\np.user(username)\np.pass_(password)\nfor msg_id in\
  \ p.list()[1]:\n    print msg_id\n    outf = open('%s.eml' % msg_id, 'w')\n    outf.write('\\\
  n'.join(p.retr(msg_id)[1]))\n    outf.close()\np.quit()\n```\n\n如你所见，我们首先定义了 `username`、`password`\
  \ 和 `mail_server`。然后，我们连接到邮件服务器并提供定义的用户名和密码。假设一切正常且我们确实有权限查看该账户的邮件，我们遍历邮件文件列表，获取它们并将它们写入磁盘。此脚本没有做的一件事是在获取后删除每封邮件。要删除邮件只需在\
  \ `retr()` 之后调用 `dele()` 即可。\n\n`IMAP` 几乎和 `POP3` 一样简单，但在 Python 标准库文档中的记录没有那么多。示例\
  \ 4-2 显示了与 POP3 示例代码功能相同的 IMAP 代码。\n\n### 示例 4-2. 使用 IMAP 获取邮件\n\n```python\n#!/usr/bin/env\
  \ python\nimport imaplib\nusername = 'some_user'\npassword = '70P53Cr37'\nmail_server\
  \ = 'mail_server'\ni = imaplib.IMAP4_SSL(mail_server)\nprint i.login(username, password)\n\
  print i.select('INBOX')\nfor msg_id in i.search(None, 'ALL')[1][0].split():\n  \
  \  print msg_id\n    outf = open('%s.eml' % msg_id, 'w')\n    outf.write(i.fetch(msg_id,\
  \ '(RFC822)')[1][0][1])\n    outf.close()\ni.logout()\n```\n\n正如我们在 POP3 示例中所做的，我们在脚本顶部定义了\
  \ `username`、`password` 和 `mail_server`。然后，我们通过 SSL 连接到 IMAP 服务器。接下来，我们登录并将邮件目录设置为\
  \ `INBOX`。然后我们开始迭代对整个目录的搜索。`search()` 方法在 Python 标准库文档中的记录并不详尽。`search()` 的两个强制参数是字符集和搜索准则。什么是有效的字符集？我们应该在里面放入什么格式？搜索准则有哪些选择？需要什么格式？我们怀疑阅读\
  \ IMAP RFC 会有所帮助，但幸运的是，示例中提供了足够的文档让 IMAP 获取文件夹中的所有消息。在循环的每次迭代中，我们将邮件内容写入磁盘。这里需要给出一个小小的警告：这将该文件夹中的所有邮件标记为“已读”。这对你来说可能不是问题，而且它不像删除消息时那样算个大问题，但这是你应该注意的一点。\n\
  \n# 手动信息收集\n\n让我们也看看手动收集信息的更复杂的路径。我们指的是你通过自己的肉眼观察并用自己的手输入的信息。示例包括：带有相应 IP 地址和功能的服务器列表、带有电子邮件地址、电话号码和\
  \ IM 昵名的联系人列表，或者你团队成员计划休假的日期。确实有可用工具可以管理大部分如果不是所有此类类型的信息。可以使用 Excel 或 OpenOffice\
  \ Spreadsheet 管理服务器列表。可以使用 Outlook 或 `Address Book.app` 管理联系人。无论是 Excel/OpenOffice\
  \ Spreadsheet 还是 Outlook 都可以管理假期。当技术可以自由获取、使用纯文本编辑数据格式并提供可配置且优选 XHTML 输出时，这可能是出现这种情况时的解决方案。\n\
