  \ to send 22 packets.\n*...........********.***.***.*.*.*.*.*.*\nReceived 54 packets,\
  \ got 22 answers, remaining 0 packets\n>>> for snd, rcv in ans:\n...    print snd.ttl,\
  \ rcv.src, isinstance(rcv.payload, TCP)\n...\n[snip]\n20 208.201.239.37 True\n21\
