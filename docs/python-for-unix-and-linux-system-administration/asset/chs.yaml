  /ZenEventManager'\n\n```python\n>>> from xmlrpcl import ServerProxy\n>>> evt = {'device':'mydevice','component':'eth0,\n\
  'summary':'eth0 is down','severity':4, 'class':'Net'}\n>>> serv.sendEvent(evt)\n\
  ```\n\n\n\n\n\n```python\n`platform.machine(),`\n`platform.node(),`\n`platform.platform(),`\n\
