  l.message:: Microsoft (R) Windows (R) 5.02\\. 3790 Service Pack 2 Uniprocessor Free.\n\
  ```\n\n\n\n\n在 `setuptools` 出现之前，`distutils` 是创建可安装 Python 程序包的主要方法。`setuptools`\
  \ 是一个增强 `distutils` 的库。“Eggs”（蛋）指的是 Python 程序包和模块的最终组合，类似于 `*.rpm` 或 `*.deb` 文件。它们通常以压缩格式分发，并以压缩格式安装，或者被解压以便你可以浏览包的内容。Eggs\
  \ 是 `setuptools` 库的一个特性，与 `easy_install` 配合工作。根据官方文档，“Easy Install 是与 `setuptools`\
  \ 绑定的 Python 模块（`easy_install`），它允许你自动下载、构建、安装和管理 Python 程序包。”虽然它是一个模块，但它通常被视为一个命令行工具来思考和与其交互。在本节中，我们将涵盖并解释\
  \ `setuptools`、`easy_install` 和 `eggs`，并消除关于它们各自提供的任何困惑。\n\n我们将在本章中概述我们认为 `setuptools`\
  \ 和 `easy_install` 最有用的功能。然而，为了获取它们的完整文档，你可以分别访问 [`peak.telecommunity.com/DevCenter/setuptools`](http://peak.telecommunity.com/DevCenter/setuptools)\
  \ 和 [`peak.telecommunity.com/DevCenter/EasyInstall`](http://peak.telecommunity.com/DevCenter/EasyInstall)。\n\
  \n执行惊人功能的复杂工具通常难以理解。`setuptools` 的部分之所以难以掌握，直接原因在于它能所做的惊人事情。通过本节作为快速上手指南，并在稍后参考手册，你应该能够作为用户和开发者掌握如何使用\
  \ `setuptools`、`easy_install` 和 Python eggs。\n\n# 使用 easy_install\n\n理解和使用 `easy_install`\
  \ 的基础非常容易掌握。读此书的大多数可能在某个时候用过 `rpm`、`yum`、`apt-get`、`fink` 或类似的包管理工具。“Easy Install”一词通常指的是使用名为\
  \ `easy_install` 的命令行工具，在基于 Red Hat 的系统中执行与 `yum` 类似的操作，在基于 Debian 的系统中执行与 `apt-get`\
  \ 类似的操作，但针对的是 Python 程序包。\n\n可以通过运行一个名为 `ez_setup.py` 的“引导”脚本来安装 `easy_install`\
  \ 工具，运行时使用你希望 `easy_install` 运行的 Python 版本。`ez_setup.py` 会获取最新版本的 `setuptools`，然后将\
  \ `easy_install` 脚本安装到默认的“scripts”位置，在类 Unix 系统上这通常与你的 `python` 二进制文件所在的目录相同。让我们来看看有多“简单”。请参见\
  \ 示例 9-1。\n\n示例 9-1. 引导 easy_install\n\n```\n$ curl http://peak.telecommunity.com/dist/ez_setup.py\n\
  \n> ez_setup.py\n\n% Total    % Received % Xferd  Average Speed   Time    Time \
  \    Time  Current\nDload  Upload   Total   Spent    Left  Speed\n100  9419 100\
  \  9419    0      0    606      0  0:00:15  0:00:15 --:--:-- 83353\n\n$ ls\n\nez_setup.py\n\
  \n$ sudo python2.5 ez_setup.py\n\nPassword:\nSearching for setuptools\nReading http://pypi.python.org/simple/setuptools/\n\
  Best match: setuptools 0.6c8\nProcessing setuptools-0.6c8-py2.5.egg\nsetuptools\
  \ 0.6c8 is already the active version in easy-install.pth\n\nInstalling easy_install\
  \ script to /usr/local/bin\nInstalling easy_install-2.5 script to /usr/local/bin\n\
  Using /Library/Python/2.5/site-packages/setuptools-0.6c8-py2.5.egg\nProcessing dependencies\
  \ for setuptools\nFinished processing dependencies for setuptools\n$\n```\n\n在这种情况下，`easy_install`\
  \ 以两个不同的名称被于 `/usr/local/bin` 下。\n\n```\n$ ls -l /usr/local/bin/easy_install*\n\
  -rwxr-xr-x  1 root  wheel  364 Mar  9 18:14 /usr/local/bin/easy_install\n-rwxr-xr-x\
  \  1 root  wheel  372 Mar  9 18:14 /usr/local/bin/easy_install-2.5\n```\n\n这是 Python\
  \ 本身已经使用了相当长的一种约定：在安装可执行文件时，安装一个带有表示 Python 版本的版本号的，和一个不带版本号的。这意味着当用户没有显式引用带版本的脚本时，默认将使用不带版本号的那个。这也意味着最后安装的将是默认的。\n\
  \n# easy_install 高级功能\n\n对于大多数普通用户来说，使用 `easy_install` 并仅传递它一个命令行参数而不带任何额外选项就能满足他们所有的需求。（顺便说一下，只给\
  \ `easy_install` 传递一个参数，即包名，将只需下载并安装该包，就像之前的 IPython 示例一样。）然而，在某些情况下，如果底层有更强大的功能来执行除下载\
  \ `eggs` 之外的其他事情会很好。幸运的是，`easy_install` 有许多压箱底，并且足够灵活处理各种高级杂项。\n\n## 在网页上搜索程序包\n\
  \n\n\n\n\n正如我们之前看到的，`easy_install` 可以自动从中央仓库搜索包并自动安装。它还可以通过你能想象到的几乎任何方式安装包。以下是一个通过搜索网页并按名称和版本安装或升级包的示例：\n\
  \n```\n$ easy_install -f http://code.google.com/p/liten/ liten\nSearching for liten\n\
  Reading http://code.google.com/p/liten/\nBest match: liten 0.1.3\nDownloading http://liten.googlecode.com/files/liten-0.1.3-py2.4.egg\n\
  [snip]\n```\n\n在这种情况下，[`code.google.com/p/liten/`](http://code.google.com/p/liten/)\
  \ 上有一个 Python2.4 和一个 Python2.5 的 egg 文件。`easy_install -f` 指定了查找 `eggs` 的位置。它找到了两个\
  \ `eggs`，然后安装了 Python2.4 的 egg，因为它是最佳匹配。显然，这非常强大，因为 `easy_install` 不仅最初找到了 `egg`\
  \ 链接，还找到了正确的 `egg` 版本。\n\n## 从 URL 安装源码分发\n\n现在，我们将从 URL 自动安装源码分发：\n\n```\n% easy_install\
  \ http://superb-west.dl.sourceforge.net/sourceforge\n      /sqlalchemy/SQLAlchemy-0.4.3.tar.gz\n\
  Downloading http://superb-west.dl.sourceforge.net/sourceforge\n/sqlalchemy/SQLAlchemy-0.4.3.tar.gz\n\
  Processing SQLAlchemy-0.4.3.tar.gz\nRunning SQLAlchemy-0.4.3/setup.py -q bdist_egg\
  \ --dist-dir\n  /var/folders/LZ/LZFo5h8JEW4Jzr+ydkXfI++++TI/-Tmp-/\n  easy_install-Gw2Xq3/SQLAlchemy-0.4.3/egg-dist-tmp-Mf4jir\n\
  zip_safe flag not set; analyzing archive contents...\nsqlalchemy.util: module MAY\
  \ be using inspect.stack\nsqlalchemy.databases.mysql: module MAY be using inspect.stack\n\
  Adding SQLAlchemy 0.4.3 to easy-install.pth file\nInstalled /Users/ngift/src/py24ENV/lib/python2.4/site-packages/SQLAlchemy-0.4.3-py2.4.egg\n\
  Processing dependencies for SQLAlchemy==0.4.3\nFinished processing dependencies\
  \ for SQLAlchemy==0.4.3\n```\n\n我们将一个 gzipped tarball 的 URL 传递给 `easy_install`。它能够在没有显式指令的情况下判断出应该安装这个源码分发。这是一个巧妙的技巧，但源码根目录下必须包含一个\
  \ `setup.py` 文件才能生效。例如，在写本文时，如果有人将包嵌套在深层几级的空文件夹中，那么将会失败。\n\n#### 安装本地或网络文件系统上的 Egg\n\
  \n这是一个安装位于文件系统或 NFS 挂载存储上的 `egg` 的示例：\n\n```\neasy_install /net/src/eggs/convertToMacOperatingSystem-py2.5.egg\n\
  ```\n\n你也可以从 NFS 挂载的目录或本地分区安装 `eggs`。这对于在多台希望保持代码版本同步的机器上分发包来说非常高效。此书中的其他一些脚本可以帮助创建守护进程。每个客户端都可以运行这样的守护进程来检查中央\
  \ eggs 仓库的更新。如果有新版本，它就可以自动更新自己。\n\n## 升级包\n\n使用 `easy_install` 的另一种方法是让它升级包。在接几个示例中，我们将介绍安装并升级\
  \ `CherryPy` 包的过程。\n\n首先，我们将安装 2.2.1 版本的 `CherryPy`：\n\n```\n$ easy_install cherrypy==2.2.1\n\
  Searching for cherrypy==2.2.1\nReading http://pypi.python.org/simple/cherrypy/\n\
  ....\nBest match: CherryPy 2.2.1\nDownloading http://download.cherrypy.org/cherrypy/2.2.1/CherryPy-2.2.1.tar.gz\n\
  ....\nProcessing dependencies for cherrypy==2.2.1\nFinished processing dependencies\
  \ for cherrypy==2.2.1\n```\n\n现在，我们将向你展示当尝试 `easy_install` 一个已经安装的内容会发生什么：\n\n```\n\
  $ easy_install cherrypy\nSearching for cherrypy\nBest match: CherryPy 2.2.1\nProcessing\
  \ CherryPy-2.2.1-py2.5.egg\nCherryPy 2.2.1 is already the active version in easy-install.pth\n\
  Using /Users/mjones/python/cherrypy/lib/python2.5/site-packages/CherryPy-2.2.1-py2.5.egg\n\
  Processing dependencies for cherrypy\nFinished processing dependencies for cherrypy\n\
  ```\n\n在你安装了某个版本的包后，你可以通过显式声明要下载和安装的版本来升级到相同包的更新版本：\n\n```\n$ easy_install cherrypy==2.3.0\n\
