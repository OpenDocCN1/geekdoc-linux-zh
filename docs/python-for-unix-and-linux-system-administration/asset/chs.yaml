  \ admin URL 映射到函数。这里看到的内容与 Apache 日志查看器应用程序相比并没有特别不同。我们是将 URL 的正则表达式映射到函数，并使用了一点点正则表达式分组。\n\
  \n![Django admin 添加硬件组件](img/00018.jpg)\n图 11-9. Django admin 添加硬件组件\n\n### Views\
  \ 模块\n\n接一步要做的是向我们在 URL 映射文件中声明的 `views` 模块中添加函数。示例 11-14 是 `views` 模块。\n\n示例 11-14.\
  \ 清单视图 (views.py)\n\n```python\n# 在此处创建 views。\nfrom django.shortcuts import render_to_response\n\
  import models\n\ndef main(request):\n    os_list = models.OperatingSystem.objects.all()\n\
  \    svc_list = models.Service.objects.all()\n    hardware_list = models.HardwareComponent.objects.all()\n\
  \    return render_to_response('main.html', {'os_list': os_list,\n             'svc_list':\
  \ svc_list, 'hardware_list': hardware_list})\n\ndef categorized(request, category,\
  \ category_id):\n    category_dict = {'os': 'Operating System',\n      'svc': 'Service',\
  \ 'hw': 'Hardware'}\n    if category == 'os':\n        server_list = models.Server.objects.filter(os__exact=category_id)\n\
  \        category_name = models.OperatingSystem.objects.get(id=category_id)\n  \
  \  elif category == 'svc':\n        server_list = models.Server.objects.filter(services__exact=category_id)\n\
  \        category_name = models.Service.objects.get(id=category_id)\n    elif category\
  \ == 'hw':\n        server_list = models.Server.objects.filter(hardware_component__exact=category_id)\n\
  \        category_name = models.HardwareComponent.objects.get(id=category_id)\n\
  \    else:\n        server_list = []\n    return render_to_response('categorized.html',\
  \ {'server_list': server_list,\n      'category': category, 'category_name': category_name})\n\
  \ndef server_detail(request, server_id):\n    server = models.Server.objects.get(id=server_id)\n\
  \    return render_to_response('server_detail.html', {'server': server})\n```\n\n\
  正如我们在 `urls.py` 文件中添加了三个映射一样，我们在 `views.py` 文件中也添加了三个函数。第一个是 `main()`。该函数只是获取所有不同操作系统、硬件组件和服务服务的列表，并将它们传递给\
  \ `main.html` 模板。\n\n在 示例 11-14 中，我们创建了一个 `templates` 目录。在这里我们将同样的操作：\n\n```bash\n\
  user@ubuntu:~/code/sysmanage$ mkdir templates\nuser@ubuntu:~/code/sysmanage$\n```\n\
  \n示例 11-15 是 `main()` 视图函数传递数据数据的“main.html”模板。\n\n示例 11-15. 主模板 (main.html)\n\n\
  ```html\n{% extends \"base.html\" %}\n{% block title %}服务器清单{% endblock %}\n{% block\
  \ content %}\n<div>\n    <h2>Operating Systems</h2>\n    <ul>\n    {% for o in os_list\
  \ %}\n        <li><a href=\"/categorized/os/{{ o.id }}/\">{{ o.name }}</a></li>\n\
  \    {% endfor %}\n    </ul>\n</div>\n<div>\n    <h2>Services</h2>\n    <ul>\n \
  \   {% for s in svc_list %}\n        <li><a href=\"/categorized/svc/{{ s.id }}/\"\
  >{{ s.name }}</a></li>\n    {% endfor %}\n    </ul>\n</div>\n<div>\n    <h2>Hardware\
  \ Components</h2>\n    <ul>\n    {% for h in hardware_list %}\n        <li><a href=\"\
  /categorized/hw/{{ h.id }}/\">{{ h.manufacturer }}</a></li>\n    {% endfor %}\n\
  \    </ul>\n</div>\n{% endblock %}\n```\n\n此模板非常直观。它将页面分为三个部分，每个部分对应我们想要的一个类别。对于每个类别，它列出了该类别拥有的项目，并带有一个查看所有具有指定类别项目的服务器的链接。\n\
  \n当用户点击这些链接之一时，将把他们带到下一个视图函数 `categorized()`。`categorized()` 接收一个类别（如 `os` 操作系统、`hw`\
  \ 硬件组件或 `svc` 服务）和一个类别 ID（例如用户点击的特定组件 ID）。`categorized()` 函数根据这些参数从数据库中获取具有该组件的服务器列表，然后将其信息传递给\
  \ `categorized.html` 模板。示例 11-16 显示了 `categorized.html` 模板的内容。\n\n示例 11-16. 分类模板\
  \ (categorized.html)\n\n```html\n{% extends \"base.html\" %}\n{% block title %}服务器列表{%\
  \ endblock %}\n{% block content %}\n<h1>{{ category }}:{{ category_name }}</h1>\n\
  <div>\n    <ul>\n    {% for s in server_list %}\n        <li><a href=\"/server_detail/{{\
  \ s.id }}/\">{{ s.name }}</a></li>\n    {% endfor %}\n    </ul>\n</div>\n{% endblock\
  \ %}\n```\n\n`categorized.html` 模板显示了 `categorized()` 传递给它的服务器列表。用户可以点击服务器的链接，这将进入\
  \ `server_detail()` 视图函数。`server_detail()` 视图函数接收服务器 ID 参数，从数据库中检索该服务器的数据，并将这些数据传递给\
  \ `server_detail.html` 模板。\n\n示例 11-17 显示的 `server_detail.html` 模板可能是模板中最长的，但它非常简单。它的任务是显示服务器的各个独立数据，例如服务器运行的操作系统、服务器拥有的硬件、服务器上运行的服务以及服务器拥有的\
  \ IP 地址。\n\n示例 11-17. 服务器详情模板 (server_detail.html)\n\n```html\n{% extends \"base.html\"\
