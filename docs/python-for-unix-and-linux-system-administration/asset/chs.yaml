  \ Python，那么 `Pyro` 可能是你更好的选择。\n\n### SSH\n\nSSH 是一个非常强大且被广泛使用的协议。你也可以将其看作一个工具，因为最常见的实现与之同名。`SSH`\
  \ 允许你安全地连接到远程服务器、执行 shell 命令、传输文件并双向转发端口。\n\n如果你有命令行 `ssh` 工具，为什么还会想用 `SSH` 协议编写脚本呢？主要原因是使用\
  \ `SSH` 协议可以让你同时拥有 `SSH` 的完整功能和 Python 的完整功能。`SSH2` 协议是用名为 `paramiko` 的 Python 库实现的。在\
  \ Python 脚本中，即使什么都不写，你也可以连接到 `SSH` 服务器并完成这些任务。示例 5-9 是连接到 `SSH` 服务器并执行简单命令的示例。\n\
  \n## 示例 5-9. 连接到 SSH 服务器并远程执行命令\n\n```python\n#!/usr/bin/env python\nimport paramiko\n\
  hostname = '192.168.1.15'\nport = 22\nusername = 'jmjones'\npassword = 'xxx'\nif\
  \ __name__ == \"__main__\":\n    s = paramiko.SSHClient()\n    s.set_missing_host_key_policy(paramiko.AutoAddPolicy())\n\
  \    s.connect(hostname, port, username, password)\n    stdin, stdout, stderr =\
  \ s.exec_command('ifconfig')\n    print(stdout.read().decode())\n    s.close()\n\
  ```\n\n\n\n\n\n```python\n#!/usr/bin/env python\nimport paramiko\n\nhostname = '192.168.1.15'\n\
  port = 22\nusername = 'jmjones'\npkey_file = '/home/jmjones/.ssh/id_rsa'\n\nif __name__\
  \ == \"__main__\":\n    key = paramiko.RSAKey.from_private_key_file(pkey_file)\n\
  \    s = paramiko.SSHClient()\n    s.load_system_host_keys()\n    s.connect(hostname,\
  \ port, pkey=key)\n    stdin, stdout, stderr = s.exec_command('ifconfig')\n    print\
  \ stdout.read()\n    s.close()\n```\n\n并且示例 5-12 是使用 RSA 密钥对 sftp 脚本的修改。\n\n###\
  \ 示例 5-12. 从 SSH 服务器检索文件\n\n```python\n#!/usr/bin/env python\nimport paramiko\n\
  import os\n\nhostname = '192.168.1.15'\nport = 22\nusername = 'jmjones'\ndir_path\
  \ = '/home/jmjones/logs'\npkey_file = '/home/jmjones/.ssh/id_rsa'\n\nif __name__\
  \ == \"__main__\":\n    key = paramiko.RSAKey.from_private_key_file(pkey_file)\n\
  \    t = paramiko.Transport((hostname, port))\n    t.connect(username=username,\
  \ pkey=key)\n    sftp = paramiko.SFTPClient.from_transport(t)\n    files = sftp.listdir(dir_path)\n\
  \    for f in files:\n        print 'Retrieving', f\n        sftp.get(os.path.join(dir_path,\
  \ f), f)\n    t.close()\n```\n\n### Twisted\n\nTwisted 是一个用于 Python 的事件驱动网络框架，可以处理你需要的几乎任何类型的网络任务。一个全面的单一解决方案意味着复杂性的代价。在你在使用几次之后，Twisted\
  \ 会开始变得有意义，但最初理解它可能会很困难。此外，学习 Twisted 是一项巨大的工程，要找到解决特定问题的起点往往是令人望而畏的。\n\n尽管如此，我们强烈建议你熟悉它并看看它是否符合你的思维方式。如果你能轻松地将思维调整为“Twisted\
  \ 方式”，那么学习 Twisted 可能会是一项很有价值的投资。由 Abe Fettig（O’Reilly 出）编写的 *Twisted Network Programming\
  \ Essentials* 是一个很好的起点。这本书有助于减少我们所提到的那些负面影响。\n\nTwisted 是一个事件驱动的网络，这意味着与其关注于编写用于启动连接建立和断开以及数据接收的低级细节的代码，不如专注于编写处理这些发生事件的代码。\n\
  \n使用 Twisted 你会获得什么优势？该框架鼓励（有时几乎是要求）你将问题拆分成小块。网络连接与连接建立时发生的逻辑是解耦的。这两个事实让你的代码获得了一定程度的自动重用性。Twisted\
  \ 为你带来的另一个好处是，你不需要过多担心网络连接的低级连接和错误处理。你在编写网络代码时只需决定当特定事件发生时发生什么。\n\n示例 5-13 是我们用\
  \ Twisted 实现的一个端口检查器。它非常基础，但在我们阅读代码的过程中，它将演示 Twisted 的事件驱动特性。但在在此之前，我们将回顾一些你需要知道的基础概念。基础知识包括反应器（reactors）、工厂（factory）、协议（protocols）和延迟（deferreds）。反应器是\
  \ Twisted 应用主事件循环的核心。反应器处理事件分发、网络通信和线程。工厂负责产生新的协议实例。每个工厂实例可以产生一种类型的协议。协议定义了对特定连接执行的操作。在运行时，会为每个连接创建一个协议实例。而延迟是一种将一系列操作链接在一起的方法。\n\
  \n***\n\n### Twisted\n\n大多数编写代码的人对程序或脚本的逻辑流有非常强的直觉：它就像水流下山，完整并伴有大坝、分流器等。因此，这种代码在编写和调试时都比较容易构思。Twisted\
  \ 代码则完全不同。由于它是异步的，人们可能会说它更像低重力环境下的水滴，而不是流下山的山泉，但这个比喻在这里真的失效了。引入了一个新组件：事件监听器（反应器）及其小伙伴们。要创建和调试\
  \ Twisted 代码，必须以一种禅定的态度放弃固有观念，并开始为一种不同的逻辑流建立直觉。\n\n***\n\n### 示例 5-13. 用 Twisted\
  \ 实现的端口检查器\n\n```python\n#!/usr/bin/env python\nfrom twisted.internet import reactor,\
  \ protocol\nimport sys\n\nclass PortCheckerProtocol(protocol.Protocol):\n    def\
  \ __init__(self):\n        print \"Created a protocol\"\n    def connectionMade(self):\n\
  \        print \"Connection made\"\n        reactor.stop()\n\nclass PortCheckerFactory(protocol.ClientFactory):\n\
  \    protocol = PortCheckerProtocol\n    def clientFailed(self, connector, reason):\n\
  \        print \"Connection failed because\", reason\n        reactor.stop()\n\n\
  if __name__ == '__main__':\n    host, port = sys.argv[1].split(':')\n    factory\
  \ = PortCheckerFactory()\n    print \"Testing %s\" % sys.argv[1]\n    reactor.connectTCP(host,\
  \ int(port), factory)\n    reactor.run()\n```\n\n注意我们定义了两个类（`PortCheckerProtocol`\
  \ 和 `PortCheckerFactory`），它们都继承自 Twisted 的类。通过将 `PortCheckerProtocol` 赋值给 `PortCheckerFactory`\
  \ 的类属性 `protocol`，我们将工厂 `PortCheckerFactory` 与 `PortCheckerProtocol` 绑定。如果工厂尝试建立连接但失败，工厂的\
  \ `clientFailed()` 方法将被调用。`clientFailed()` 是所有 Twisted 工共的方法，也是我们为工厂定义的唯一方法。通过定义一个“自带”于工厂类的方法，我们正在重写该类的默认行为。当客户端连接失败时，我们希望打印一条消息并停止反应器。\n\
  \n\n\n\n按时间顺序总结该流程：我们在给出指令后启动反应器（reactor）。在这种情况下，指令是连接到某个服务器和端口，并使用 `PortCheckerClientFactory`\
  \ 来帮助分发事件。如果到给定主机和端口的连接失败，事件循环将调用 `PortCheckerClientFactory`  `clientConnectionFailed()`。如果连接成功，工厂将创建协议实例\
  \ `PortCheckerProtocol` 并在该实例上调用 `connectionMade()`。无论连接成功还是失败，相应的事件处理器都会关闭反应器，程序将停止运行。\n\
  \n这是一个非常基础的示例，但它展示了 Twisted 事件处理特性的基础。Twisted 编程中我们在示例中未涵盖的关键概念是 `deferreds`（延迟队列）和\
  \ `callbacks`（回调函数）的概念。`deferred` 代表对执行请求操作的承诺。`callback` 是指定要完成的操作的一种方式。`deferreds`\
  \ 可以链式连接，并将结果从一个传递给下一个一个。这一点在 Twisted 中通常很难真正理解。（示例 5-14 将详细说明 `deferreds$。））\n\n\
  示例 5-14 是使用 Perspective Broker 的示例，这是 Twisted 特有的一种 RPC 机制。这个示例是我们在在本章之前用 XML-RPC\
  \ 和 Pyro 实现的远程“ls”服务器的另一种实现。首先，我们将带你浏览一遍服务器。\n\n### 示例 5-14. Twisted Perspective\
  \ Broker 服务器\n\n```python\nimport os\nfrom twisted.spread import pb\nfrom twisted.internet\
  \ import reactor\n\nclass PBDirLister(pb.Root):\n    def remote_ls(self, directory):\n\
  \        try:\n            return os.listdir(directory)\n        except OSError:\n\
  \            return []\n    def remote_ls_boom(self, directory):\n        return\
  \ os.listdir(directory)\n\nif __name__ == '__main__':\n    reactor.listenTCP(9876,\
  \ pb.PBServerFactory(PBDirLister()))\n    reactor.run()\n```\n\n此示例定义了一个类 `PBDirLister`。这是\
  \ `Perspective Broker` (PB) 类，当客户端连接到它时，它将作为一个远程对象运行。此示例在该类上定义了两个方法：`remote_ls()`\
  \ 和 `remote_ls_boom()`。不意外的是，`remote_ls()` 是客户端将调用的远程方法之一。这个 `remote_ls()` 方法将返回指定目录的列表。而\
  \ `remote_ls_boom()` 将执行与 `remote_ls()` 相同的操作，只是它不会进行异常处理。在示例的主部分，我们告诉 `Perspective\
  \ Broker` 绑定到端口 9876，然后运行反应器。\n\n示例 5-15 并不那么直接；它调用了 `remote_ls()`。\n\n### 示例 5-15.\
  \ Twisted Perspective Broker 客户端\n\n```python\n#!/usr/bin/python\nfrom twisted.spread\
  \ import pb\nfrom twisted.internet import reactor\n\ndef handle_err(reason):\n \
  \   print \"an error occurred\", reason\n    reactor.stop()\n\ndef call_ls(def_call_obj):\n\
  \    return def_call_obj.callRemote('ls', '/home/jmjones/logs')\n\ndef print_ls(print_result):\n\
  \    print print_result\n    reactor.stop()\n\nif __name__ == '__main__':\n    factory\
  \ = pb.PBClientFactory()\n    reactor.connectTCP(\"localhost\", 9876, factory)\n\
  \    d = factory.getRootObject()\n    d.addCallback(call_ls)\n    d.addCallback(print_ls)\n\
  \    d.addErrback(handle_err)\n    reactor.run()\n```\n\n此客户端示例定义了三个函数：`handle_err()`、`call_ls()`\
  \ 和 `print_ls()`。`handle_err()` 将处理过程中发生的任何错误。`call_ls()` 将发起对远程“ls”方法的调用。`print_ls()`\
  \ 将打印“ls”调用的结果。似乎有一个函数用于启动远程调用而另一个函数用于打印调用结果，这看起来有点奇怪。但因为 Twisted 是一个异步的、事件驱动的网络框架，这在这种情况下是合理的。该框架刻意鼓励编写将工作拆分为许多许多小部分的代码。\n\
  \n（注：后续文本中存在大量重复的段落，根据您的要求已仅翻译核心逻辑内容并不重复输出。）\n\n\n\n我们在这里对 Twisted 提供了一个仅仅是冰山一角”的介绍。Twisted\
  \ 的入门可能有点困难，因为它是一个非常全面的项目，而且它的处理方法与我们大多数人所习惯的迥然不同。Twisted 绝对值得进一步研究，并在你需要时将其放入你的工具箱中。\n\
  \n### Scapy\n\n如果你喜欢编写网络代码，你将会爱上 Scapy。Scapy 是一个极其实用的交互式数据包操纵程序和库。Scapy 可以发现网络、执行扫描、追踪路由（traceroutes）和探测。Scapy\
  \ 还有非常优秀的文档可用。如果你喜欢这个介绍，应该买这本书以获取更多关于 Scapy 的详细信息。\n\n关于 Scapy，需要了解的第一点是，截至本文编写时，它被保持在一个单一文件中。你需要在这里下载\
  \ Scapy 的最新版本：[`hg.secdev.org/scapy/raw-file/tip/scapy.py`](http://hg.secdev.org/scapy/raw-file/tip/scapy.py)。一旦下载了\
  \ Scapy，你可以将其作为独立工具运行，或者将它导入并作为库使用。让我们从作为交互式工具开始吧。请记住，你需要用 root 权限运行 Scapy，因为它需要对你的网络接口进行特权控制。\n\
  \n一旦下载并安装了 Scapy，你将看到类似下面的内容：\n\n```\nWelcome to Scapy (1.2.0.2)\n>>>\n```\n\n你可以执行任何在\
  \ Python 解释器中通常能做的操作，也有特殊的 Scapy 命令。我们要做的第一件事是运行 Scapy `ls()` 函数，它列出了所有可用的层：\n\n\
