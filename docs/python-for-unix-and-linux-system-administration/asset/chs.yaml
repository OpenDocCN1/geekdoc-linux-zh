  \ finished\n[Host('192.19.101.250','None','('Linux linux.host 2.6.18-8.1.15.el5\n\
  ```\n\n\n\n\n```python\n# #1 SMP Mon Oct 22 08:32:04 EDT 2007 i686',)')\n\n[Host\
  \ Record('192.19.101.252','None','('Linux linux.host 2.6.18-8.1.15.el5 #1 SMP Mon\
  \ Oct 22 08:32:04 EDT 2007 i686',)')]\n[Host Record('192.19.101.253','None','('Linux\
  \ linux.host 2.6.18-8.1.15.el5 #1 SMP Mon Oct 22 08:32:04 EDT 2007 i686',)')]\n\
  [Host Record('192.19.101.251','None','('Linux linux.host 2.6.18-8.1.15.el5 #1 SMP\
