  \ Scapy 构建持久性的东西了，一个有趣的展示的例子是 `arping` 工具。让我们看一个平台特定的 `arping` 工具：\n\n```python\n\
  #!/usr/bin/env python\nimport subprocess\nimport re\nimport sys\ndef arping(ipaddress=\"\
  10.0.1.1\"):\n  \"\"\"arping 接收 IP 地址或网络，返回列表\"\"\"\n  #假设在 Linux 上使用 arping\n \
  \ p = subprocess.Popen(\"/usr/sbin/arping -c 2 %s\" % ipaddress, shell=True,\n \
  \                      stdout=subprocess.PIPE)\n  out = p.stdout.read()\n  result\
  \ = out.split()\n  pattern = re.compile(\":\")\n  for item in result:\n    if ':'\
  \ in item:\n      print item\nif __name__ == '__main__':\n  if len(sys.argv) > 1:\n\
  \      for ip in sys.argv[1:]:\n          print \"arping\", ip\n          arping(ip)\n\
  \  else:\n      arping()\n```\n\n现在让我们看看如何使用 Scapy 创建相同的内容，但以平台无关的方式：\n\n```python\n\
  #!/usr/bin/env python\nfrom scapy import srp,Ether,ARP,conf\nimport sys\ndef arping(iprange=\"\
  10.0.1.0/24\"):\n  \"\"\"arping 接收 IP 地址或网络，返回列表\"\"\"\n  conf.verb=0\n  ans,unans=srp(Ether(dst=\"\
  ff:ff:ff:ff:ff:ff\")/ARP(pdst=iprange),\n                timeout=2)\n  collection\
  \ = []\n  for snd, rcv in ans:\n    result = rcv.sprintf(r\"%ARP.psrc% %Ether.src%\"\
  ).split()\n    collection.append(result)\n  return collection\nif __name__ == '__main__':\n\
  \  if len(sys.argv) > 1:\n      for ip in sys.argv[1:]:\n          print \"arping\"\
  , ip\n          arping(ip)\n  else:\n      arping()\n```\n\n如你所，输出包含的信息非常有用，因为它给了我们子网内所有人的\
  \ Mac 地址和 IP 地址：\n\n```bash\n# sudo python scapy_arp.py\n[['10.0.1.1', '00:00:00:00:00:10'],\
  \ ['10.0.1.7', '00:00:00:00:00:12'],\n['10.0.1.30', '00:00:00:00:00:11'], ['10.0.1.200',\
  \ '00:00:00:00:00:13']]\n```\n\n通过这些示例，你应该对 Scapy 有多么方便以及多容易用有一个印象。\n\n# 第 6 章. 数据\n\
  \n\n\n\n对数据、文件和目录进行控制的需求是 IT 组织需要系统管理员（sysadmin）的原因之一。哪位系统管理员没有过处理整个目录树中的所有文件并解析和替换文本的需求呢？如果你还没有写过重命名目录树中所有文件的脚本，那么你可能在未来的某个点会写。这些能力是成为一名系统管理员的本质，或者至少是成为一名非常优秀的系统管理员的本质。在本章的剩余部分，我们将重点关注数据、文件和目录。\n\
  \n系统管理员需要不断地将数据从一个位置“理运”到另一个位置。在某些系统管理员工作中，每日的数据移动比其他工作更为常见。在动画行业，不断地将数据从一个位置“理运”到另一个位置是必须的，因为数字电影制作需要\
  \ TB TB 数 TB 的存储空间。此外，根据当前查看的图像质量和分辨率，还有不同的磁盘 I/O 要求。如果数据需要“搬运”到 HD 预览室以便在数字每日快片（digital\
  \ daily）期间进行检查，那么就需要移动“新鲜”的未压缩或轻压缩的 HD 图像文件。文件需要移动是因为动画行业通常有两种存储类型：一种是廉价、海量、缓慢、安全的存储；另一种是快速、昂贵的存储，通常是\
  \ JBOD（即“仅仅是一堆磁盘”），通过 `RAID 0` 条带化在一起以提高速度。电影行业中主要处理数据的系统管理员被称为“数据理运师（data wrangler）”。\n\
  \n数据理运师需要不断地在位置之间移动和迁移新鲜数据。通常，移动数据的主力工具是 `rsync`、`scp`、`cp` 或 `mv`。这些简单而强大的工具可以用\
  \ `Python` 脚本来完成一些不可惊的事情。\n\n使用标准库，可以在完全不调用 shell 外部命令的情况下完成一些神奇的操作。使用标准库的优势是，你的数据移动脚本可以在任何地方运行，而不需要依赖\
  \ `tar` 等特定平台的版本。\n\n不要忘记备份。可以使用少量的 `Python` 代码编写许多备份脚本和应用程序。我们会提醒你，为备份代码编写额外的测试不仅是明智的，也是必要的。当你依赖自己编写的备份脚本时，你应该确保已经建立了单元测试和功能测试。\n\
  \n此外，通常需要在移动之前、之后或过程中某个时间点对数据进行处理。当然，`Python` 在这方面也非常棒。创建一个去重工具（一种能够发现重复文件并对其执行操作的工具）对此非常有帮助，我们将向你展示如何实现。这是系统管理员经常遇到的处理持续数据流的一个示例。\n\
  \n## 使用 OS 模块与数据交互\n\n如果你曾经为编写跨平台 shell 脚本而苦恼，你将体会到 `os` 模块是一个用于系统服务的移植应用程序编程接口（API）。在\
  \ `Python 2.5` 中，`os` 模块包含了 200 多个方法，其中许多方法都处理数据。在本节中，我们将介绍该模块中系统管理员在处理数据时关心的许多方法。\n\
  \n当你发现自己需要探索新模块时，`IPython` 通常是工作的正确工具，因此让我们使用 `IPython` 执行一系列常见的操作开始我们的 `os` 模块之旅。示例\
  \ 6-1\n\nOut[2]: '/private/tmp'\n\nIn [3]: os.mkdir(\"/tmp/os_mod_explore\")\n\n\
  In [4]: os.listdir(\"/tmp/os_mod_explore\")\n\nOut[4]: []\n\nIn [5]: os.mkdir(\"\
  /tmp/os_mod_explore/test_dir1\")\n\nIn [6]: os.listdir(\"/tmp/os_mod_explore\")\n\
  \nOut[6]: ['test_dir1']\n\nIn [7]: os.stat(\"/tmp/os_mod_explore\")\n\nOut[7]: (16877,\
  \ 6029306L, 234881026L, 3, 501, 0, 102L,\n1207014425, 1207014398, 1207014398)\n\n\
  In [8]: os.rename(\"/tmp/os_mod_explore/test_dir1\",\n\"/tmp/os_mod_explore/test_dir1_renamed\"\
  )\n\nIn [9]: os.listdir(\"/tmp/os_mod_explore\")\n\nOut[9]: ['test_dir1_renamed']\n\
  \nIn [10]: os.rmdir(\"/tmp/os_mod_explore/test_dir1_renamed\")\n\nIn [11]: os.rmdir(\"\
  /tmp/os_mod_explore/\")\n```\n\n你可以看到，在我们导入 `os` 模块后，在第 [2] 行获取了当前工作目录，然后在第 [3]\
  \ 行继续创建一个目录。接着，我们在第 [4] 行使用 `os.listdir` 列出我们新创建的目录的内容。接下来，我们在第 [7] 行执行 `os.stat`（由序列隐含暗示）来检查文件信息。接着，我们在第\
  \ [8] 行执行 `os.rename` 来重命名目录。然后我们在第 [9] 行使用 `os.listdir` 验证更改。最后，我们在第 [10] 行和 [11]\
  \ 行使用 `os.rmdir` 删除目录。\n\n## 复制、移动、重命名和删除数据\n\n既然我们在引言中讨论了数据理运，并且现在对如何使用 `os` 模块有了初步了解，我们可以直接进入一个名为\
  \ `shutil` 的更高级别的模块，它在大规模范围内处理数据。`shutil` 拥有像 `os` 模块一样的复制、移动和删除方法，但它可以对整个树执行操作。请参阅\
  \ `Python` 文档以了解差异。\n\n示例 6-2 使用 shutil 模块复制树\n\n```python\nIn [1]: import os\n\n\
  In [2]: os.chdir(\"/tmp\")\n\nIn [3]: os.makedirs(\"test/test_dir1/test_dir2\")\n\
  \nIn [4]: import shutil\n\nIn [5]: shutil.copytree(\"test\", \"test-copy\")\n\n\
  In [6]: ls -lR test-copy\ntotal 4\ndrwxr-xr-x 2 root root 4096 May 20 10:00 test-copy\n\
  drwxr-xr-x 3 root root 4096 May 20 10:00 test-copy/test_dir1\ndrwxr-xr-x 4 root\
  \ root 4096 May 20 10:00 test-copy/test_dir1/test_dir2\n```\n\n显然，这非常简单，但极其有用，因为你可以轻松地将此类代码封装成更复杂的跨平台数据移动脚本。在动画环境中，通常需要等待最新的帧完成，以便将它们转换为可编辑的序列。\n\
  \n\n\n\n\n我们可以在 cron 任务中编写一个脚本来监控目录中是否出现了“x”数量的帧。当该 cron 任务发现达到了正确的帧数时，它就可以将该目录迁移到另一个目录，在那个目录中对帧进行处理，或者只是将它们移动到更快的磁盘上，该磁盘的\
  \ I/O 速度足够处理未压缩的 HD 视频播放。\n\n不过，`shutil` 模块不仅可以复制文件，它还具有移动和删除数据树的方法。示例 6-3 展示了对我们的树进行移动，而\
  \ 示例 6-4 展示了如何删除它。\n\n### 示例 6-3. 使用 shutil 移动数据树\n\n```\nIn [20]: shutil.move(\"\
  test-copy\", \"test-copy-moved\")\nIn [21]: ls -lR\ntotal 0\ndrwxr-xr-x  3 ngift\
  \  wheel  102 Mar 21 test/\ntest-copy-moved/test:\ntotal 0\ndrwxr-xr-x  3 ngift\
  \  wheel  102 Mar 21 test_subdir1/\ntest/test_subdir1:\ntotal 0\ndrwxr-xr-x  3 ngift\
  \  wheel  68 Mar 21 test_subdir2/\ntest/test_subdir1/test_subdir2:\ntest-copy-moved:\n\
  total 0\ndrwxr-xr-x  3 ngift  wheel  102 Mar 21 test_subdir1/\ntest-copy-moved/test_subdir1:\n\
  total 0\ndrwxr-xr-x  3 ngift  wheel  68 Mar 21 test_subdir2/\ntest-copy-moved/test_subdir1/test_subdir2:\n\
  ```\n\n### 示例 6-4. 删除 shutil 数据树\n\n```\nIn [22]: shutil.rmtree(\"test-copy-moved\"\
  )\nIn [23]: shutil.rmtree(\"test-copy\")\nIn [24]: ll\n```\n\n移动数据树比删除数据树稍微有趣一点，因为删除后没有什么可以显示。许多简单示例可以与其他复杂的脚本结合。一种实用的脚本是将目录树复制到廉价存储设备并创建一个时间戳存档。幸运的是，我们在备份章节有这种示例。\n\
  \n# 处理路径、目录和文件\n\n在处理数据时，无法不考虑路径、目录和文件。每个系统管理员至少都需要编写一个遍历目录、搜索条件并对结果进行操作的工具。我们将介绍实现此目标的一些方法。\n\
  \n一如既往，Python 的标准库有一些完成任务的强大工具。Python 并没有“内置电池”的声誉。示例 6-5 展示了如何创建一个显式返回文件、目录和路径的详细遍历脚本。\n\
  \n### 示例 6-5. 详细目录遍历脚本\n\n```python\nimport os\npath = \"/tmp\"\ndef enumeratepaths(path=path):\n\
  \    \"\"\"递归返回目录下所有文件的路径\"\"\"\n    path_collection = []\n    for dirpath, dirnames,\
  \ filenames in os.walk(path):\n        for file in filenames:\n            fullpath\
  \ = os.path.join(dirpath, file)\n            path_collection.append(fullpath)\n\
  \    return path_collection\n\ndef enumeratefiles(path=path):\n    \"\"\"返回目录下所有文件的列表\"\
  \"\"\n    file_collection = []\n    for dirpath, dirnames, filenames in os.walk(path):\n\
  \        for file in filenames:\n            file_collection.append(file)\n    return\
  \ file_collection\n\ndef enumeratedir(path=path):\n    \"\"\"返回目录下所有目录的列表\"\"\"\n\
  \    dir_collection = []\n    for dirpath, dirnames, filenames in os.walk(path):\n\
  \        for dir in dirnames:\n            dir_collection.append(dir)\n    return\
  \ dir_collection\n\nif __name__ == \"__main__\":\n    print \"\\n 列出目录下所有路径:\"\n\
  \    for path in enumeratepaths():\n        print path\n    print \"\\n 列出目录下所有文件:\"\
  \n    for file in enumeratefiles():\n        print file\n    print \"\\n 列出目录下所有目录:\"\
  \n    for dir in enumeratedir():\n        print dir\n```\n\n在 Mac 笔记本电脑上，该脚本的输出如下：\n\
  \n```bash\n[ngift@Macintosh-7][H:12022][J:0]# python enumarate_file_dir_path.py\n\
  列出目录下所有路径:\n/tmp/.aksusb\n/tmp/ARD_ABJMMRT\n/tmp/com.hp.launchport\n/tmp/error.txt\n\
  /tmp/liten.py\n/tmp/LitenDeplicationReport.csv\n/tmp/ngift.liten.log\n/tmp/hsperfdata_ngift/58920\n\
  /tmp/launch-h36ok/Render\n/tmp/launch-qy1SC/Listeners\n/tmp/launch-RTzTw/:0\n/tmp/launchd-150.wDvl/sock\n\
  列出目录下所有文件:\n.aksusb\nARD_ABJMMRT\ncom.hp.launchport\nerror.txt\nliten.py\nLitenDeplicationReport.csv\n\
  ngift.liten.log\n58920\nRender\nListeners\n0\nsock\n列出目录下所有目录:\n.X1-unix\nhsperfdata_ngift\n\
  launch-h36ok\nlaunch-qy1SC\nlaunch-RTzTw\nlaunchd-150.wDvl\nssh-YcE\n```\n\n关于 `os.walk`\
  \ 的一点：它返回一个生成器，所以如果你调用它，你得到的是一个生成器对象。注意，`os.walk` 返回的是一个生成器，如果你想查看它，可能需要使用 `next()`\
  \ 来获取它的值。生成器在系统编程中非常有用。访问 David Beaz 的网站 (http://www.davidbeaz.com/generators/)\
  \ 了解更多关于它们的信息。\n\n```\nIn [1]: import os\nIn [2]: g = os.walk(\"/tmp\")\nIn [3]:\
  \ next(g)\nOut('/tmp', ['subdir1', 'subdir2'], ['file1.txt', 'file2.txt'])\n```\n\
  \n\n\n\n\n```python\n    \"\"\"Returns all the directories in a directory as a list\"\
  \"\"\n    dir_collection = []\n    for dirpath, dirnames, filenames in os.walk(self.path):\n\
  \        for dir in dirnames:\n            dir_collection.append(dir)\n    return\
  \ dir_collection\n```\n如你所见，通过少量的修改，我们能够为未来的修改创建一个非常友好的接口。这个新模块的优点之一是我们可以将其导入到另一个脚本中。\n\
  \n# 比较数据\n\n对于系统管理员来说，比较数据非常重要。你可能经常问自己的问题是：“这两个目录之间哪些文件不同？我的系统中存在多少个相同文件的副本？”在本节中，你将找到回答这些问题以及更多方法。\n\
  \n在处理大量重要数据时，通常需要比较目录树和文件以查看发生了更改。如果你开始编写大型数据移动脚本，这一点变得至关重要。最糟糕的末日场景是编写了一个损坏关键生产数据的大型数据移动脚本。\n\
  \n在本节中，我们首先探索几种比较文件和目录的轻量级方法，然后最终探索对文件进行校验和比较。Python 标准库有几个辅助进行比较的模块，我们将涵盖 `filecmp`\
  \ 和 `os.listdir`。\n\n## 使用 filecmp 模块\n\n`filecmp` 模块包含了对文件和目录进行快速高效比较的函数。`filecmp`\
  \ 模块会对两个文件执行 `os.stat`，如果两个文件的 `os.stat` 结果相同，则返回 `True`；否则返回 `False`。通常情况下，`os.stat`\
  \ 用于判断两个文件是否在磁盘上使用相同的 inode 以及它们的大小是否相同，但它并不会实际比较内容。\n\n为了完全理解 `filecmp` 如何工作，我们需要从头创建三个文件。要在计算机上执行，请进入\
  \ `/tmp` 目录，创建一个名为 `file0.txt` 的文件，并在文件中写入“0”。接下来，创建一个名为 `file1.txt` 的文件，并在文件中写入“1”。最后，创建一个名为\
  \ `file00.txt` 的文件，并在其中写入“0”。我们将在后的代码中使用这些文件作为示例：\n\n```\nIn [1]: import filecmp\n\
  In [2]: filecmp.cmp(\"file0.txt\", \"file1.txt\")\nOut[2]: False\nIn [3]: filecmp.cmp(\"\
  file0.txt\", \"file00.txt\")\nOut[3]: True\n```\n\n如你所见，`cmp` 函数在 `file0.txt` 和\
  \ `file00.txt` 的情况下返回 `True`，而在将 `file1.txt` 与 `file0.txt` 比较时返回 `False`。\n\n`dircmp`\
  \ 函数有许多报告目录树之间差异的属性。我们不会遍历每一个属性，但我们创建了一些用途的示例。对于这个示例，我们在 `/tmp` 目录下创建了两个子目录，并将之前示例中的文件复制到每个目录。在\
  \ `dirB` 中，我们创建了一个名为 `file11.txt` 的额外文件，并在其中放入了“11”：\n\n```\nIn [1]: import filecmp\n\
  In [2]: pwd\nOut[2]: '/private/tmp'\nIn [3]: filecmp.dircmp(\"dirA\", \"dirB\").diff_files\n\
  Out[3]: []\nIn [4]: filecmp.dircmp(\"dirA\", \"dirB\").same_files\nOut[4]: ['file1.txt',\
  \ 'file00.txt', 'file0.txt']\nIn [5]: filecmp.dircmp(\"dirA\", \"dirB\").report()\n\
  diff dirA dirB\nOnly in dirB : ['file11.txt']\nIdentical files : ['file0.txt', 'file00.txt',\
  \ 'file1.txt']\n```\n\n你可能会有点惊讶，看到这里 `diff_files` 没有匹配项，尽管我们创建了一个包含唯一信息的 `file11.txt`。原因是\
  \ `diff_files` 仅比较同名文件之间的差异。\n\n接下来，查看 `same_files` 的输出，注意它只报告两个目录中相同的文件。最后，我们可以像最后一个示例所示生成一个报告。它有一个方便的输出，包含了两个目录之间差异的细分说明。这个简短的概述只是\
  \ `filecmp` 模块能做的事情的一部分，因此我们建议查看 Python 标准库文档，以获取我们没有空间涵盖的功能的完整概述。\n\n### 使用 os.list\n\
  \n另一种比较目录的轻量级方法是使用 `os.listdir`。你可以将 `os.listdir` 视为一个 `ls` 命令，它返回一个包含找到的文件的 Python\
  \ 列表。因为 Python 支持许多处理列表的有趣方式，你可以使用 `os.listdir` 自己判断目录的差异，只需简单地将你的列表转换为集合，然后从一个集合减去另一个集合。这是一个在\
  \ IPython 中对应的示例：\n\n```\nIn [1]: import os\nIn [2]: dirA = set(os.listdir(\"/tmp/dirA\"\
  ))\nIn [3]: dirB = set(os.listdir(\"/tmp/dirB\"))\nIn [4]: dirB - dirA\n```\n\n\
  ### 合并数据\n\n当你不想简单地比较文件，而是喜欢合并目录树时，你可以做什么？你可以直接将文件从一个目录复制到目标，然后对目标去重，但从源上防止重复会更有效。一个相当简单的解决方案是使用\
  \ `filecmp` 模块的 `dircmp` 函数比较目录，然后使用之前描述的 `os.listdir` 技术复制唯一的结果。更好的选择是使用 MD5 校验和，我们将在下一节解释。\n\
  \n#### MD5 校验和比较\n\n对文件进行 MD5 校验并将其与另一个文件比较，就像用火箭筒进行目标射击。当你想要确定自己在做什么时，这就是你拿出的大武器，尽管逐字节比较才是真正准确的。\n\
  \n```python\nimport hashlib\ndef create_checksum(path):\n    \"\"\"读取文件。逐行创建文件的校验和.\"\
  \"\"\n    fp = open(path)\n    checksum = hashlib.md5()\n    while True:\n     \
  \   buffer = fp.read(8192)\n        if not buffer:break\n        checksum.update(buffer)\n\
  \    fp.close()\n    checksum = checksum.digest()\n    return checksum\n```\n\n\
  这是一个迭代示例，了如何在 IPython 中使用此函数比较两个文件：\n\n```\nIn [2]: from checksum import createChecksum\n\
  In [3]: if createChecksum(\"image1\") == createChecksum(\"image2\"):\n    print\
  \ \"True\"\n```\n\n\n\n\n\n在那个示例中，文件的校验和是手动比较的，但我们可以使用之前编写的代码，该代码返回一个路径列表，用于递归地比较充满文件的目录树，并为我们找到重复文件。创建一个合理\
  \ API 的其他优点是，我们现在可以使用 `IPython` 交互式地测试我们的解决方案。然后，如果它运行良好，我们就可以创建另一个模块。示例 6-8 显示了查找重复文件的代码。\n\
  \n### 示例 6-8. 对目录树执行 MD5 校验和以查找重复文件\n\n```python\nIn [1]: from checksum import createChecksum\n\
  In [2]: from diskwalk_api import diskwalk\nIn [3]: d = diskwalk('/tmp/duplicates_directory')\n\
  In [4]: files = d.enumeratePaths()\nIn [5]: len(files)\nOut[5]: 12\nIn [6]: dup\
  \ = []\nIn [7]: record = {}\nIn [8]: for file in files:\n    compound_key = (getsize(file),create_checksum(file))\n\
  \    if compound_key in record:\n        dup.append(file)\n    else:\n        record[compound_key]\
  \ = file\n....:        \n....:\nIn [9]: print dup\n['/tmp/duplicates_directory/image2']\n\
  ```\n\n这段代码中我们在之前的示例中还没有看过的部分位于第 [8] 行。我们创建了一个空字典，然后使用键来存储生成的校验和。这可以作为判断该校验和之前是否出现过的简单方法。如果出现过，我们就将文件丢进\
  \ `dup` 列表中。现在，让我们把这部分提取成一段可以重复使用的代码。毕竟这非常有用。示例 6-9 显示了如何操作。\n\n### 示例 6-9. 查找重复文件\n\
  \n```python\nfrom checksum import create_checksum\nfrom diskwalk_api import diskwalk\n\
  from os.path import getsize\n\ndef findDupes(path = '/tmp'):\n    dup = []\n   \
  \ record = {}\n    d = diskwalk(path)\n    files = d.enumeratePaths()\n    for file\
  \ in files:\n        compound_key = (getsize(file),create_checksum(file))\n    \
  \    if compound_key in record:\n            dup.append(file)\n        else:\n \
  \           #print \"Creating compound key record:\", compound_key\n           \
  \ record[compound_key] = file\n    return dup\n\nif __name__ == \"__main__\":\n\
  \    dupes = findDupes()\n    for dup in dupes:\n        print “Duplicate: %s” %\
  \ dup\n```\n\n当我们运行该脚本时，会得到以下输出：\n\n```bash\n[ngift@Macintosh-7][H:10157][J:0]#\
  \ python find_dupes.py\nDuplicate: /tmp/duplicates_directory/image2\n```\n\n我们希望你能看到，这展示了即使是少量代码复用也能实现什么。我们现在有一个通用模块，它可以接收一个目录树并返回所有重复文件的列表。这本身已经非常方便，但接下来我们可以更进一步，自动删除这些重复文件。\n\
  \n在 Python 中删除文件非常简单，你可以使用 `os.remove(file)`。在这个示例中，我们的 `/tmp` 目录下有若干 10 MB 的文件；让我们尝试使用\
  \ `os.remove(file)` 删除其中一个：\n\n```python\nIn [1]: import os\nIn [2]: os.remove(\"\
  10\n10mbfile.0  10mbfile.1  10mbfile.2  10mbfile.3  10mbfile.4  \n10mbfile.5  10mbfile.6\
  \  10mbfile.7  10mbfile.8\nIn [2]: os.remove(\"10mbfile.1\")\nIn [3]: os.remove(\"\
  10\n10mbfile.0  10mbfile.2  10mbfile.3  10mbfile.4  10mbfile.5  \n10mbfile.6  10mbfile.7\
  \  10mbfile.8\n```\n\n注意，`IPython` 中的 Tab 补全允许我们看到匹配项并为我们填充图像文件名。请注意，`os.remove(file)`\
  \ 方法是静默且永久的，因此这可能不是你想要的操作。考虑到这一点，我们可以实现一个简单的方法来删除重复文件，之后对其进行增强。因为在 `IPython` 中交互式测试非常容易，我们将现场编写一个测试函数并尝试运行：\n\
  \n```python\nIn [1]: from find_dupes import findDupes\nIn [2]: dupes = findDupes(\"\
  /tmp\")\nIn [3]: def delete(file):\n    import os\n    print \"deleting %s\" % file\n\
  \    os.remove(file)\nIn [4]: for dupe in dupes:\n    delete(dupe)\nIn [5]: for\
  \ dupe in dupes:\ndelete(dupe)\ndeleting /tmp/10mbfile.2\ndeleting /tmp/10mbfile.3\n\
  deleting /tmp/10mbfile.4\ndeleting /tmp/10mbfile.5\ndeleting /tmp/10mbfile.6\n```\n\
  \n\n\n\n\n在处理数据时，你可能会发现使用这种封装技术非常有用，因为通过对你正在处理的内容进行足够的抽象，使其与你的具体问题解耦，可以防止未来可能出现的问题。在这种情况下，我们想要自动删除重复文件，因此我们创建了一个通用的模块来查找并删除文件名。我们还可以创建另一个工具，能够通用地接收文件对象并应用某种形式的压缩。我们稍后就会介绍那个示例。\n\
  \n### 文件和目录的模式匹配\n\n到目前为止，你已经了解了如何处理目录和文件，并执行诸如查找重复、删除目录、移动目录等操作。掌握目录树的下一步是使用模式匹配，无论是单独使用还是与之前的技术结合使用。和\
  \ Python 中几乎所有其他操作一样，对文件扩展名或文件名进行模式匹配是非常简单的。在本节中，我们将演示几个常见的模式匹配问题，并应用之前使用的技术来创建简单但强大的可重用工具。\n\
  \n系统管理员需要解决的一个相当常见的问题是，他们需要追踪并删除、移动、重命名或复制特定类型的文件。在 Python 中实现此操作最直接的方法是使用 `fnmatch`\
  \ 模块或 `glob` 模块。这两个模块的主要区别在于，`fnmatch` 对于 Unix 通配符返回 True 或 False，而 `glob` 返回一个匹配模式的路径列表。此外，可以使用正则表达式来创建更复杂的模式匹配工具。请参考第\
  \ 3 章 以获取关于使用正则表达式匹配模式的更详细说明。\n\n示例 6-11 将介绍如何使用 `fnmatch` 和 `glob`。我们将通过从 `diskwalk_api`\
  \ 模块导入 `diskwalk` 来复用我们编写的代码。\n\n示例 6-11 交互式使用 fnmatch 和 glob 搜索文件匹配\n\n```\nIn\
  \ [1]: from diskwalk_api import diskwalk\nIn [2]: files = diskwalk(\"/tmp\")\nIn\
  \ [3]: from fnmatch import fnmatch\nIn [4]: for file in files:\n   ...:     if fnmatch(file,\"\
  *.txt\"):\n   ...:         print file\n/tmp/file.txt\nIn [5]: from glob import glob\n\
  In [6]: import os\nIn [7]: os.chdir(\"/tmp\")\nIn [8]: glob(\"*\")\nOut[8]: ['file.txt',\
  \ 'image.iso', 'music.mp3']\n```\n\n在上一个示例中，在我们复用了之前的 `diskwalk` 模块后，我们得到了位于 `/tmp`\
  \ 目录的所有完整路径列表。然后我们使用 `fnmatch` 来判断每个文件是否匹配 `*.txt` 模式。`glob` 模块略有不同，它会字面上执行“glob”（即匹配模式）并返回完整路径。`Glob`\
  \ 是比 `fnmatch` 高得多的函数，但两者都是对于稍微不同任务非常有用的工具。\n\n当 `fnmatch` 函数与其他代码结合以创建一个搜索目录树中数据的过滤器时，它特别有用。通常在处理目录树时，你希望处理匹配某些模式的文件。为了看到其实效果，我们将解决一个经典的系统管理员问题：通过重命名目录树中所有匹配模式的文件。请记住，重命名文件与删除、压缩或处理它们一样简单。这里有一个简单的模式：\n\
  \n1. 获取目录中文件的路径。\n2. 执行一些可选的过滤层；这可能涉及许多过滤器，例如文件名、扩展名、大小、唯一性等。\n3. 对它们执行操作；这可以是复制、删除、压缩、读取等。示例\
  \ 6-12 展示了如何操作。\n\n示例 6-12 将包含满 MP3 文件的树重命名为文本文件\n\n```\nIn [1]: from diskwalk_api\
  \ import diskwalk\nIn [2]: from shutil import move\nIn [3]: from fnmatch import\
  \ fnmatch\nIn [4]: files = diskwalk(\"/tmp\")\nIn [5]: for file in files:\n    \
  \         if fnmatch(file, \"*.mp3\"):\n             #在此处我们可以做任何想做的事，删除、移动、重命名……嗯，重命名\n\
  \                 move(file, \"%s.txt\" % file)\nIn [6]: ls -l /tmp/\ntotal 0\n\
  -rw-r--r--  1 ngift  wheel  0 Apr\n```\n\n# 总结 rsync\n\n如你所知，`rsync` 是一个最初由 Andrew\
  \ Tridell 和 Paul Macker 编写的命令行工具。2007 年底，rsync 3 版本发布用于测试，它包含了比原始版本更多的选项。多年来，我们发现自己将\
  \ `rsync` 作为将数据从 A 点移动到 B 点的主要工具。其手册页和选项是惊叹的著作，因此我们建议你详细阅读它们。\n\n尽管如此，Python 有一些方法可以帮助控制或粘合\
  \ rsync 的行为。我们遇到的一个问题是确保数据在预定时间被复制。我们遇到过很多情况，需要尽可能地在一个文件服务器和另一个之间同步 TB 级的数据，但我们又不想手动监控过程。在这种情况下，使用\
  \ Python 非常有意义。\n\n通过 Python，你可以为 `rsync` 添加某种程度的人智能并根据特定需求进行定制。使用 Python 作为胶水代码的意义在于，让\
  \ Unix 工具执行它们从未设计过的功能，从而创建出高度灵活且可定制的工具。限制仅仅在于你的想象力。示例 6-13 展示了如何封装 rsync 的一个非常简单的示例。\n\
  \n```\n#!/usr/bin/env python\n#封装 rsync 以同步两个目录\nfrom subprocess import call\nimport\
  \ sys\n\nsource = \"/tmp/sync_dir_A/\" #注意结尾斜杠\ntarget = \"/tmp/sync_dir_B\"\nrsync\
  \ = \"rsync\"\narguments = \"-a\"\ncmd = \"%s %s %s %s\" % (rsync, arguments, source,\
  \ target)\n\ndef sync():\n    ret = call(cmd, shell=True)\n    if ret !=0:\n   \
  \     print \"rsync failed\"\n        sys.exit(1)\n\nsync()\n```\n\n\n\n\n此示例通过硬编码来同步两个目录，并在命令无法正常工作时打印失败信息。不过，我们可以做一些更有趣的事情，解决一个我们经常遇到的问题。我们经常发现自己被要求同步两个非常大的目录，而我们又不想通夜监控数据同步。但如果你不监控同步过程，可能会发现它在过程中途中被中断了，而且数据和一整个晚上都白费了，进程必须在第二天重新开始。使用\
  \ Python，你可以创建一个更具主动性、动力十足的 `rsync` 命令。\n\n一个动力十足的 rsync 命令具体会做什么呢？嗯，它会执行你在监控两个目录同步时会做的事情：它会持续尝试同步目录直到完成，然后发送一封邮件说它已完成。示例\
  \ 6-14 展示了我们这个“过度努力者”的 rsync 代码运行情况。\n\n### 示例 6-14. 一个在任务完成前不会退出的 rsync 命令\n\n\
  ```python\n#!/usr/bin/env python\n# wraps up rsync to synchronize two directories\n\
  from subprocess import call\nimport sys\nimport time\n\"\"\"this motivated rsync\
  \ tries to synchronize forever\"\"\"\nsource = \"/tmp/sync_dir_A/\" #Note the trailing\
  \ slash\ntarget = \"/tmp/sync_dir_B\"\nrsync = \"rsync\"\narguments = \"-av\"\n\
  cmd = \"%s %s %s %s\" % (rsync, arguments, source, target)\ndef sync():\n    while\
  \ True:\n        ret = call(cmd, shell=True)\n        if ret !=0:\n            print\
  \ \"resubmitting rsync\"\n            time.sleep(30)\n        else:\n          \
  \  print \"rsync was succesful\"\n            subprocess.call(\"mail -s 'jobs done'\
  \ bofh@example.com\", shell=True)\n            sys.exit(0)\nsync()\n```\n\n这是过度简化的并且包含了硬编码数据，但它是你可以用来自动化某些通常需要手动监控的任务的实用工具示例。你还可以包含一些其他功能，例如设置重试间隔和限制的能力，以及检查你连接的机器上的磁盘使用情况等。\n\
  \n### 元数据：关于数据的数据\n\n大多数系统管理员都会达到这样一个阶段：他们开始关心的不仅是数据，还有关于数据的数据。元数据，或者说关于数据的数据，通常比数据本身更重要。例如，在电影和电视领域，相同的数据通常存在于文件系统的多个位置，甚至存在于多个文件系统上。跟踪数据通常涉及创建某种元数据管理系统。\n\
  \n然而，关于这些文件如何组织和使用的数据，对于应用程序、动画流水线或恢复备份来说可能是最关键的。Python 在这也可以提供帮助，因为用 Python 使用元数据和编写元数据都很简单。\n\
  \n让我们看看如何使用流行的 ORM `SQLAlchemy` 来创建关于文件系统的元数据。幸运的是，`SQLAlchemy` 的文档非常好，而且 `SQLAlchemy`\
  \ 支持 `SQLite`。我们认为这是创建自定义元数据解决方案的杀手锏。\n\n在上面的示例中，我们实时遍历文件系统并对找到的路径执行了操作和查询。虽然这非常有用，但在包含数百万文件的大型文件系统中进行搜索以只做一件事也是非常耗时的。在\
  \ 示例 6-15 中，我们展示了将刚刚掌握的目录遍历技术与 ORM 结合，一个非常基础的元数据系统可能的样子。\n\n### 示例 6-15. 使用 SQLAlchemy\
  \ 创建文件系统的元数据\n\n```python\n#!/usr/bin/env python\nfrom sqlalchemy import create_engine\n\
  from sqlalchemy import Table, Column, Integer, String, MetaData, ForeignKey\nfrom\
  \ sqlalchemy.orm import mapper, sessionmaker\nimport os\n#path\npath = \" /tmp\"\
  \n#Part 1:  create engine\nengine = create_engine('sqlite:///:memory:', echo=False)\n\
  #Part 2:  metadata\nmetadata = MetaData()\nfilesystem_table = Table('filesystem',\
  \ metadata,\n   Column('id', Integer, primary_key=True),\n   Column('path', String(500)),\n\
  \   Column('file', String(255)),\n)\nmetadata.create_all(engine)\n#Part 3:  mapped\
  \ class\nclass Filesystem(object):\n    def __init__(self, path, file):\n      \
  \ self.path = path\n       self.file = file\n    def __repr__(self):\n       return\
  \ \"Filesystem('%s','%s')\" % (self.path,self.file)\n#Part 4:  mapped function\n\
  mapper(Filesystem,filesystem_table)\n#Part 5:  create session\nSession = sessionmaker(bind=engine,\
  \ autoflush=True, transactional=True)\nsession = Session()\n#Part 6:  walk directory\
  \ and populate database\nfor dirpath, dirnames, filenames in os.walk(path):\n  \
  \ for file in filenames:\n      fullpath = os.path.join(dirpath, file)\n      record\
  \ = Filesystem(fullpath, file)\n      session.add(record)\n#Part 7:  commit to database\n\
  session.commit()\n#Part 8:  query\nfor record in session.query(Filesystem):\n  \
  \ print \"Database Number: %s, Path: %s, File: %s\" % (record.id,record.path,record.file)\n\
  ```\n\n# 归档、压缩、映像和恢复\n\n处理大数据是系统管理员每天必须面对的问题。他们经常使用 `tar`、`dd`、`gzip`、`bzip`、`bzip2`、`hdiutil`、`asr`\
  \ 和其他工具来完成工作。\n\n可能难以置信，Python “内置电池”的标准库对 TAR 文件、zlib 文件和 `gzip` 文件有内置支持。如果压缩和归档是你的目标，那么\
  \ Python 提供的丰富工具将毫无问题。\n\n# 使用 tarfile 模块创建 TAR 归档\n\n创建 TAR 归档非常简单，实际上太简单。在 示例\
  \ 6-16 中，我们创建一个大文件作为示例。注意，这种语法比 `tar` 命令本身要友好得多。\n\n### 示例 6-16. 创建大文本文件\n\n```python\n\
  f = open(\"largeFile.txt\", \"w\")\nstatement = \"This is a big line that I intend\
  \ to write over and over again.\"\nx = 0\nfor x in xrange(20000):\n    f.write(statement)\n\
  ```\n\n\n\n\n```\n....:     x += 1\n....:     f.write(\"%s\\n\" % statement)\n....:\n\
  ....:\n```\n\n`In [4]: ls -l`\n```\n-rw-r--r-- 1 root root 1236992 Oct 25 23:13\
  \ largeFile.txt\n```\n\n好了，现在我们已经有一个装满垃圾的大文件了，让我们把它 TAR 一吧。查看示例 6-17。\n\n### 示例\
  \ 6-17. TAR 文件内容\n\n```python\nIn [1]: import tarfile\nIn [2]: tar = tarfile.open(\"\
  largefile.tar\", \"w\")\nIn [3]: tar.add(\"largeFile.txt\")\nIn [4]: tar.close()\n\
  In [5]: ll\n```\n```\n-rw-r--r-- 1 root root 1236992 Oct 25 23:15 largeFile.txt\n\
  -rw-r--r-- 1 root root 1236992 Oct 26 00:39 largefile.tar\n```\n\n所以，如你所见，这用比普通的\
  \ `tar` 命令更简单的语法创建了一个原生的 TAR 归档。这确实证明了使用 `IPython` shell 来完成你所有的日常系统管理工作的理由。\n\n\
  虽然使用 Python 创建 TAR 文件很方便，但如果只 TAR 一个文件，它几乎毫无用处。使用我们在本章中多次使用的相同目录遍历模式，我们可以通过遍历树结构并将每个文件添加到\
  \ `/tmp` 目录 TAR 的内容中，从而创建一个整个 `/tmp` 目录的 TAR 文件。查看示例 6-18。\n\n### 示例 6-18. TAR 目录树内容\n\
  \n```python\nIn [27]: import tarfile\nIn [28]: tar = tarfile.open(\"temp.tar\",\
  \ \"w\")\nIn [29]: import os\nIn [30]: for root, dir, files in os.walk(\"/tmp\"\
  ):\n....:     for file in filenames:\n....:\nKeyboardInterrupt\n```\n\n```python\n\
  In [30]: for root, dir, files in os.walk(\"/tmp\"):\nfor file in files:\n....: \
  \    fullpath = os.path.join(root,file)\n....:     tar.add(fullpath)\nIn [33]: tar.close()\n\
  ```\n\n通过遍历目录来添加目录树的内容非常简单，而且这是一个很好的模式，因为它可以与在本章中涵盖的其他一些技术结合使用。也许你正在归档一个包含媒体文件的目录。归档完全重复的文件似乎很愚蠢，所以也许在创建\
  \ TAR 文件之前，你可能想先将重复文件替换为符号链接。有了本章中的信息，你可以轻松地构建出实现这些操作的代码，并节省大量的空间。\n\n由于做通用的 TAR\
  \ 归档有点无聊，让我们让它变得有趣一点，添加 `bzip2` 压缩，这会让你的 `CPU` 因为你让它工作得太努力而鸣叫并抱怨。`bzip2` 压缩算法可以做一些非常奇妙的操作。让我们看看它真的有多令人惊叹。\n\
  \n然后来点疯狂的，让一个 60 MB 的文本文件缩小到 10 K！查看示例 6-19。\n\n### 示例 6-19. 创建 bzip2 TAR 归档\n\n\
  ```python\nIn [1: tar = tarfile.open(\"largefilecompressed.tar.bzip2\", \"w|bz2\"\
  )\nIn [2]: tar.add(\"largeFile.txt\")\nIn [3]: ls -h\n```\n```\nfoo1.txt fooDir1/\
  \ largeFile.txt largefilecompressed.tar.bzip2*\nfoo2.txt fooDir2/ largefile.tar\n\
  ```\n```python\nln [4]: tar.close()\nIn [5]: ls -lh\n```\n```\n-rw-r--r-- 1 root\
  \ root 61M Oct 25 23:15 largeFile.txt\n-rw-r--r-- 1 root root 61M Oct 26 00:39 largefile.tar\n\
  -rwxr-xr-x 1 root root 10K Oct 26 01:02 largefilecompressed.tar.bzip2*\n```\n\n\
  令人惊讶的是，`bzip2` 能够将我们 61 M 的文本文件压缩到 10 K，尽管我们通过反复使用相同数据进行了一定的作弊。当然，这并不是免费的，因为在双核\
  \ `AMD` 系统上压缩这个文件花了几分钟时间。\n\n让我们一步到位，使用剩余的可用选项进行压缩归档，从下一个 `gzip` 开始。语法略有不同。查看示例\
  \ 6-20。\n\n### 示例 6-20. 创建 gzip TAR 归档\n\n```python\nIn [10]: tar = tarfile.open(\"\
  largefile.tar.gzip\", \"w|gz\")\nIn [11]: tar.add(\"largeFile.txt\")\nIn [12]: tar.close()\n\
  In [13]: ls -lh\n```\n```\n-rw-r--r-- 1 root root 61M Oct 25 23:15 largeFile.txt\n\
  -rw-r--r-- 1 root root 61M Oct 26 00:39 largefile.tar\n-rwxr-xr-x 1 root root 160K\
  \ Oct 26 01:24 largefile.gzip*\n```\n\n`gzip` 归档仍然非常小，只有 160 K，但在我的机器上创建这个压缩文件只需要几秒钟。\n\
  \n# 使用 tarfile 模块检查内容\n\n既然我们已经创建了一些 TAR 归档，检查它们的内容是有必要的。如果你想在不提取的情况下查看 TAR 文件的内部内容，可以使用\
  \ Python 中的 `getlist()` 方法或命令行中的 `tar` 命令。\n\n有一天，我们的朋友 William 接到了老板的电话：“William，我需要你立即来我办公室，备份出了问题。”William\
  \ 立即来到办公室，被那个疯子 Alex 控告他损坏了他的归档，这导致他错过了截止日期。老板告诉 William，Alex 说他的备份里全都是损坏的文件，而且他一直依赖那个归档来工作。\n\
  \nWilliam 意识到他需要验证 Alex 的说法。他回到办公桌前写了一个脚本来检查 Alex 创建的 TAR 归档内容。William 随后告诉老板，他确定自己会被指控搞砸了归档，因此秘密编写了一些\
  \ Python 代码来检查备份前后文件的属性。事实证明，Alex 根本就没有创建过节目，几个月来归档的只是空文件夹。\n\n当 Alex 面对这些信息时，他迅速推卸责任并试图将注意力转移到新问题上。对\
  \ Alex 来说，这是最后的死骆之草，几个月后他再也没有来上班。他可能是辞职或被解雇了，但这并不重要，我们的朋友 William 解决了《消失的归档案》。\n\
  \n这个故事的寓意是，当你处理备份时，要像对待核武器一样对待它们，因为备份充满了你无法想象的危险。\n\n\n\n\n\n```\n-rw-r--r-- ngift/wheel\
  \          2 2008-04-04 15:15:39 tmp/file1.txt\n-rw-r--r-- ngift/wheel         \
  \ 0 2008-04-04 20:50:57 tmp/temp.tar\n-rw-r--r-- ngift/wheel          2 2008-04-04\
  \ 16:19:07 tmp/dirA/file0.txt\n-rw-r--r-- ngift/wheel          2 2008-04-04 16:19:07\
  \ tmp/dirA/file00.txt\n-rw-r--r-- ngift/wheel          2 2008-04-04 16:19:07 tmp/dirA/file1.txt\n\
  -rw-r--r-- ngift/wheel          2 2008-04-04 16:19:52 tmp/dirB/file0.txt\n-rw-r--r--\
  \ ngift/wheel          2 2008-04-04 16:19:52 tmp/dirB/file00.txt\n-rw-r--r-- ngift/wheel\
  \          2 2008-04-04 16:19:52 tmp/dirB/file1.txt\n-rw-r--r-- ngift/wheel    \
  \      3 2008-04-04 16:21:50 tmp/dirB/file11.txt\n```\n\n`In [4]: tar.name`\n`Out[4]:\
  \ '/private/tmp/temp.tar'`\n\n`In [5]: tar.getnames()`\n`Out[5]:`\n['tmp/file00.txt',\n\
  'tmp/file1.txt',\n'tmp/temp.tar',\n'tmp/dirA/file0.txt',\n'tmp/dirA/file00.txt',\n\
  'tmp/dirA/file1.txt',\n'tmp/dirB/file0.txt',\n'tmp/dirB/file00.txt',\n'tmp/dirB/file1.txt',\n\
  'tmp/dirB/file11.txt']\n\n`In [10]: tar.members`\n`Out[10]:`\n[<TarInfo 'tmp/file00.txt'\
  \ at 0x109eff0>,\n <TarInfo 'tmp/file1.txt' at 0x109ef30>,\n <TarInfo 'tmp/temp.tar'\
  \ at 0x10a4310>,\n <TarInfo 'tmp/dirA/file0.txt' at 0x10a4350>,\n <TarInfo 'tmp/dirA/file00.txt'\
  \ at 0x10a43b0>,\n <TarInfo 'tmp/dirA/file1.txt' at 0x10a4410>,\n <TarInfo 'tmp/dirB/file0.txt'\
  \ at 0x10a4470>,\n <TarInfo 'tmp/dirB/file00.txt' at 0x10a44d0>,\n <TarInfo 'tmp/dirB/file1.txt'\
  \ at 0x10a4530>,\n <TarInfo 'tmp/dirB/file11.txt' at 0x10a4590>]\n\n这些示例展示了如何检查\
  \ TAR 归包中的文件名，这可以在数据验证脚本中进行校验。提取文件并没有那么麻烦。如果你想将整个 TAR 归包提取到当前工作目录，可以直接使用以下命令：\n\n\
  ```\nIn [60]: tar.extractall()\n```\n\n```\ndrwxrwxrwx  7 ngift  wheel    238 Apr\
  \  4 22:59 tmp/\n```\n\n如果你极其多疑（而且你本该如此），那么你还可以包含一个步骤，即提取归包的内容，并对归包中的文件进行随机 MD5\
  \ 校验和，将其与你在文件备份之前制作的 MD5 校验和进行比较。这可能是监控数据完整性是否符合预期的非常非常有效的方法。\n\n任何健全的备份方案都不应该仅仅信任归包是正确创建的。至少需要自动对归包进行随机抽检。最好的情况下，每一个归包在创建后都应该重新打开并检查有效性。\n\
  \n# 第 7 章 SNMP\n\n## 引言\n\nSNMP 可以改变你作为系统管理员的生活。使用 SNMP 的回报不如写几行 Python 代码解析日志文件那样即时，但一旦建立起\
  \ SNMP 基础设施，使用起来会非常棒。\n\n在本章中，我们将涵盖 SNMP 的这些方面：自动发现、轮询/监控、编写代理、设备控制以及最后的企业 SNMP\
  \ 集成。当然，所有这些都将通过 Python 实现。\n\n如果你不熟悉 SNMP 或需要温习 SNMP，我们强烈建议阅读 Douglas Mauro 和 Kevin\
  \ Schmidt 编写的 *Essential SNMP*（O’Reilly 出版），或者至少将其放在手边。一本良好的 SNMP 参考书对于真正理解 SNMP\
  \ 及其功能至关重要。我们将在下一节中介绍 SNMP 的一些基础知识，但深入细节已超出本书的范围。事实上，关于如何使用 Python  SNMP 的材料足够写一整本书了。\n\
  \n# SNMP 简介绍\n\n#### SNMP 概述\n\nSNMP 的宏观视角是一个用于管理 IP 网络上设备的协议。通常，通过 UDP 端口 `161`\
  \ 和 `162` 实现，尽管也可以使用 TCP，但非常罕见。数据中心里的几乎任何现代设备都支持 SNMP；这意味着不仅可以管理交换机和路由器，还可以管理服务器、打印机、UPS、存储等。\n\
  \nSNMP 的基本用法是向主机发送 UDP 数据包并等待响应。这就是在简单层面上监控设备的方式。不过，也可以使用 SNMP 协议做其他事情，例如控制设备和编写响应条件的代理。\n\
  \n你使用 SNMP 进行的一些典型工作包括监控 CPU 负载、磁盘使用情况和空闲内存。你可能还会用它管理并控制交换机，甚至通过 SNMP 重新加载交换机配置。人们通常不知道你也可以监控软件，例如\
  \ Web 应用程序和数据库。最后，RMON MIB 中支持远程监控（Remote Monitoring），它支持“基于流”的监控；这与“基于设备”的常规 SNMP\
  \ 监控不同。\n\n既然我们提到了 MIB 这个缩写，是时候介绍一下它了。SNMP 仅仅是一个协议，它对数据不作任何假设。在被监控的设备上，运行着名为 `snmpd`\
  \ 的代理，它包含一个对象列表。每个代理至少实现一个 MIB，即管理信息库。对象的定义就存储在这个文件中。每个对象都有三个属性：名称、类型和编码。在这些属性中，名称是你最需要的。名称通常被称为\
  \ `OID`，或对象标识符。这种 `OID` 有两种形式：数值型和“人类可读型”。大多数情况下你想使用人类可读的 `OID`，因为数值名称非常长且难以记忆。最常见的\
  \ OID 之一是 `sysDescr`。如果你使用命令行工具 `snmpwalk` 来确定 `sysDescr` 的值，可以通过名称或数字来实现：\n\n```\n\
  snmpwalk -v2c -c public localhost .1.3.6.1.2.1.1.0\n```\n\n```\nsnmpwalk -v2c -c\
  \ public localhost sysDescr\n```\n\n#### SNMP 安装与配置\n\n为了简单起见，我们将处理 Net-SNMP 以及对应的\
  \ Net-SNMP Python 绑定。不过，这并不是排除其他基于 Python 的 SNMP 库，包括 PySNMP，Zenoss 和 TwistedSNMP\
  \ 都使用了它。在 Zenoss 和 TwistedSNMP 中，PySNMP 是以异步风格使用的。这是一个非常有效的方法，也值得关注；我们只是没有空间在本章中涵盖两者。\n\
  \n就 Net-SNMP 本身而言，我们将处理两种不同的 API。方法一是使用 `subprocess` 模块封装 Net-SNMP 命令行工具，方法二是使用新的\
  \ Python 绑定。根据实现环境的不同，每种方法都有优缺点。\n\n\n\n\n为了对 SNMP（特别是 Net-SNMP）进行任何实用的操作，你必须实际上安装它。幸运的是，大多数\
  \ Unix 和 Linux 操作系统已经预装了 Net-SNMP，因此如果你需要监控设备，通常只需要调整 `snmpd.conf` 文件以符合你的需求并启动守护进程即可。如果你计划使用\
  \ Python 绑定进行 Net-SNMP 的开发（这也是本章涵盖的内容），将需要从源码编译并安装 Python 绑定。如果你只是打算封装 Net-SNMP\
  \ 命令行工具——例如 `snmpget`、`snmpwalk`、`snmpdf` 等——那么如果 Net-SNMP 已经安装，你不需要做任何事情。\n\n一种选项是从\
  \ [`www.oreilly.com/9780596515829`](http://www.oreilly.com/9780596515829) 下载一个包含本书源码的虚拟机。你也可以参考\
  \ [`www.py4sa.com`](http://www.py4sa.com)，它是该书的配套网站，那里将提供有关如何运行本节中示例的最新信息。\n\n我们还在这台虚拟机中配置了\
  \ Net-SNMP 和 Python 绑定。你只需使用这台虚拟机即可运行所有示例。如果你手头的硬件足够强大，还可以制作几个虚拟机的副本，模拟本章中同时与许多机器通信的其他代码。\n\
  \n如果你决定安装 Python 绑定，将需要从 sourceforge.net 下载 Net-SNMP，并获取 5.4.x 或更高的 Net-SNMP 版本。这些绑定默认是不构建的，因此你应该仔细遵循\
  \ `Python/README` 目录中的构建说明。简而言之，你首先需要编译此版本的 Net-SNMP，然后在 Python 目录中运行 `setup.py`\
  \ 脚本。我们发现 Red Hat 上的安装方法是最不痛苦的，并且那里有一个源码 RPM 可用。如果你决定进行编译，可能想先在 Red Hat 上尝试一下，看看成功的构建是什么样子的，然后再尝试到\
  \ AIX、Solaris、OS X、HPUX 等系统。最后，如果你卡住了，只需使用虚拟机运行示例，稍后再研究如何让它编译通过。\n\n关于你自己编译的最后一点说明：确保你运行了\
  \ `python setup.py build` 和 `python setup.py test`。你应该立即发现 Net-SNMP 是否与 Python 工作。如果你在编译\
  \ Python 时遇到困难，一个技巧是像这样手动运行 `ldconfig`：\n\n```bash\nldconfig -v /usr/local/lib/\n\
  ```\n\n在配置方面，如果你恰好要在要监控的客户端上安装 Net-SNMP，你应该带有 Host Resources MIB 编译 Net-SNMP。通常情况下，你可以如下操作：\n\
  \n```bash\n./configure -with-mib-modules=host\n```\n\n请注意，当你运行 `configure` 时，它会尝试运行一个自动配置脚本。如果你不想这样做，就不需要。通常情况下，自己创建一个自定义配置文件要简单得多。基于\
  \ Red-Hat 的系统的配置文件通常位于 `/etc/snmp/snmpd.conf`，它可以简单如下所示：\n\n```bash\nsyslocation\
  \ \"O'Reilly\"\nsyscontact bofh@oreilly.com\nrocommunity public\n```\n\n仅仅这个简单的配置文件就足够本章的其余部分以及非\
  \ SNMPv3 查询了。SNMPv3 的配置要困难一些，并且稍微超出了本章的大部分范范围，尽管我们确实想提到，对于生产环境中的设备控制，强烈建议使用 SNMPv3，因为\
  \ v2 和 v1 是明文传输的。就此而言，你永远不要跨互联网进行 SNMP v2 或 v1 查询，因为流量可能会被拦截。已经发生过一些由于这种操作而导致的高知名度入侵事件。\n\
  \n# IPython 和 Net-SNMP\n\n如果你以前没有做过任何 SNMP 开发，你可能会觉得它有点糟糕。嗯，说实话，它确实糟糕。处理 SNMP 有点痛苦，因为它涉及到一个非常复杂的协议、大量的\
  \ RFC 需要阅读，以及许多事情发生故障的概率很高。减少开始开发时许多初始痛苦的一种方法是使用 IPython 来探索你将编写的 SNMP 代码，并熟悉 API。\n\
  \n示例 7-1 是一个在本地机器上运行的非常简短的实时代码。\n\n示例 7-1. 使用 IPython 和带有 Python 绑定的 Net-SNMP\n\n\
  ```python\nIn [1]: import netsnmp\nIn [2]: oid = netsnmp.Varbind('sysDescr')\nIn\
  \ [3]: result = netsnmp.snmpwalk(oid,\n...:                         Version = 2,\n\
  ...:                         DestHost=\"localhost\",\n...:                     \
  \    Community=\"public\")\nOut[4]: ('Linux 2.6.18-8.1.14.el5 #1 SMP Aug 27 12:51:44\
  \ EDT 2008 i686',)\n```\n\n在探索新库时使用制表符补全是非常清新的。在这个示例中，我们充分利用了 IPython 的 tab 功能，并进行了一个基本的\
  \ SNMP v2 查询。作为一个通用的说明，正如我们提到的，sysDescr 是一个重要的 OID 查询。\n\n\n\n\n```\n`In [7]: s.oid`\n\
  \n`Out[7]: 'sysDescr'`\n\n`In [8]: s.oid = \".1.3.6.1.2.1.1\"`\n\n`In [9]: result\
  \ = s.query()`\n\n`In [10]: print result`\n('Linux localhost 2.6.18-8.1.14.el5 #1\
  \ SMP Thu Sep 27 18:58:54 EDT 2007 i686',\n'.1.3.6.1.4.1.8072.3.2.10', '121219',\
  \ 'me@localhost.com', 'localhost',\n'\"My Local Machine\"',\n'0', '.1.3.6.1.6.3.10.3.1.1',\
  \ '.1.3.6.1.6.3.11.3.1.1', '.1.3.6.1.6.3.15.2.1.1',\n  '.1.3.6.1.6.3.1',\n'.1.3.6.1.2.1.49',\
  \ '.1.3.6.1.2.1.4', '.1.3.6.1.2.1.50', '.1.3.6.1.6.3.16.2.2.1',\n  'The SNMP Management\
  \ Architecture MIB.', 'The MIB for Message Processing and Dispatching.', 'The management\
  \ information definitions\n  for the SNMP User-based Security Model.',\n'The MIB\
  \ module for SNMPv2 entities', 'The MIB module for managing TCP implementations',\n\
  'The MIB module for managing IP and ICMP implementations', 'The MIB module for\n\
  \  managing UDP [snip]',\n'View-based Access Control Model for SNMP.', '0', '0',\
  \ '0', '0', '0', '0', '0', '0')\n```\n\n这种交互式、调查性的编程风格让处理 SNMP 变得非常愉快。此时，如果你有兴趣，可以开始研究其他\
  \ OID 的各种查询，你甚至可以遍历整个 MIB 树。不过，遍历整个 MIB 树可能会花费很长时间，因为需要大量的 OID 查询；所以，这在生产环境中通常不是最佳实践，因为它会消耗客户端机器的资源。\n\
  \n### 注意\n\n请记住，MIB-II 只是一个包含许多 OID 的文件，它包含在大多数支持 SNMP 的系统中。其他特定厂商的 MIB 是代理可以引用并给出响应的额外文件。如果你想更上一层楼，需要查找特定厂商的文档来确定要查询哪个\
  \ MIB 中的哪个 OID。\n\n接下来，我们将使用一个 IPython 特有的功能，允许将任务发送到后台：\n\n```\n`In [11]: bg s.query()`\n\
  Starting job # 0 in a separate thread.\n\n`In [12]: jobs[0].status`\nOut[12]: 'Completed'\n\
  \n`In [16]: jobs[0].result`\nOut[16]:\n('Linux localhost 2.6.18-8.1.14.el5 #1 SMP\
  \ Thu Sep 27 18:58:54 EDT 2007 i686',\n'.1.3.6.1.4.1.8072.3.2.10', '121219', 'me@localhost.com',\
  \ 'localhost',\n  '\"My Local Machine\"',\n'0', '.1.3.6.1.6.3.10.3.1.1', '.1.3.6.1.6.3.11.3.1.1',\
  \ '.1.3.6.1.6.3.15.2.1.1',\n  '.1.3.6.1.6.3.1',\n'.1.3.6.1.2.1.49', '.1.3.6.1.2.1.4',\
  \ '.1.3.6.1.2.1.50', '.1.3.6.1.6.3.16.2.2.1',\n'The SNMP Management Architecture\
  \ MIB.', 'The MIB for Message Processing and\n  Dispatching.',\n'The management\
  \ information definitions for the SNMP User-based Security Model.',\n'The MIB module\
  \ for SNMPv2 entities', 'The MIB module for managing TCP implementations',\n'The\
