  ### 示例 1-2. 系统信息脚本—Python\n```python\n#一个系统信息收集脚本\nuname = \"uname\"\nprint \"Gathering\
  \ system information with %s command:\\n\" % uname\n#Command 2\ndiskspace_arg =\
  \ \"-h\"\nsubprocess.call([diskspace, diskspace_arg])\n\n\n#!/usr/bin/env bash\n\
  #Command 1\nprintf \"Gathering system information with the $UNAME command: \\n\\\
  n\"\n#Command 2\nprintf \"Gathering diskspace information with the $DISKSPACE command:\
  \ \\n\\n\"\n```\n如果我们观察这两个脚本，会发现它们非常相似。如果我们运行它们，会发现每个脚本的输出是完全相同的。不过要说明一点：使用 `subprocess.call`\
  \ 时，将命令与参数分开是完全可选的。你也可以使用这种语法：\n```python\n```\n到目前为止一切顺利，但我们还没有完全解释 `import` 和\
  \ `subprocess`。在 Python 版本的脚本中，我们导入了 `subprocess` 模块，因为它已经包含了在 Python 中进行系统调的代码。\n\
  正如我们之前提到的，导入像 `subprocess` 这样的模块仅仅是导入一个包含可用代码的文件。你可以创建自己的模块或文件，并以与导入 `subprocess`\
  \ 相同的方式复用你编写的代码。导入并不是什么魔法，它只是一个包含某些代码的文件。你所打开的 IPython shell 的优点之一，就是它能够检查模块和文件的内部，并查看其中可用的属性。在\
  \ Unix 术语中，这非常像在 `/usr/bin` 目录下运行 `ls` 命令。如果你恰好使用的是 Ubuntu 或 Solaris 等新系统，并且习惯了\
  \ Red Hat，你可能会对 `/usr/bin` 执行 `ls` 来查看是否存在 `wget`、`curl` 或 `lynx` 等工具。如果你想使用在 `/usr/bin`\
  \ 找到的工具，只需输入 `/usr/bin/wget` 即可。\n`subprocess` 等模块也非常相似。在 IPython 中，你可以使用 Tab 补全（tab\
  \ complete）来查看模块内部的工具。让我们通过 Tab 补全遍历 `subprocess` 并查看其内部的属性。记住，模块只是一个包含某些代码的文件。以下是\
