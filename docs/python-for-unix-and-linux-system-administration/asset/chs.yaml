  \ OS X、Ubuntu、Red Hat/Cent OS、FreeBSD 和 SunOS。参见示例 8-2。\n\n## 示例 8-2. 操作系统的类型指纹\n\
  \n```python\n#!/usr/bin/env python\nimport platform\n\"\"\"\n对以下操作系统提取指纹：\n* Mac\
  \ OS X\n* Ubuntu\n* Red Hat/Cent OS\n* FreeBSD\n* SunOS\n\"\"\"\nclass OpSysType(object):\n\
  \  \"\"\"使用 platform 确定 OS 类型\"\"\"\n  def __getattr__(self, attr):\n     if attr\
  \ == \"osx\":\n      return \"osx\"\n    elif attr == \"rhel\":\n      return \"\
  redhat\"\n    elif attr == \"ubu\":\n      return \"ubuntu\"\n    elif attr == \"\
  fbsd\":\n      return \"FreeBSD\"\n    elif attr == \"sun\":\n      return \"SunOS\"\
  \n    elif attr == \"unknown_linux\":\n      return \"unknown_linux\"\n    elif\
  \ attr == \"unknown\":\n      return \"unknown\"\n    else:\n      raise AttributeError,\
  \ attr\n  def linuxType(self):\n    \"\"\"使用各种方法确定 Linux 类型\"\"\"\n    if platform.dist()[0]\
  \ == self.rhel:\n      return self.rhel\n    elif platform.uname()[1] == self.ubu:\n\
  \      return self.ubu\n    else:\n      return self.unknown_linux\n  def queryOS(self):\n\
  \    if platform.system() == \"Darwin\":\n      return self.osx\n    elif platform.system()\
  \ == \"Linux\":\n      return self.linuxType()\n    elif platform.system() == self.sun:\n\
  \      return self.sun\n    elif platform.system() == self.fbsd:\n      return self.fbsd\n\
  \  def fingerprint():\n    type = OpSysType()\n    print type.queryOS()\n  if __name__\
  \ == \"__main__\":\n    fingerprint()\n```\n\n让我们看看在不同平台上运行该程序时的输出。\nRed Hat: `root@localhost]/#\
  \ python fingerprint.py`\nUbuntu: `root@ubuntu:/# fingerprint.py`\nSolaris 10 或\
  \ SunOS: `bash-3.00# python fingerprint.py`\nFreeBSD: `# python fingerprint.py`\n\
  \n虽然命令的输出本身并不有趣，但它为我们完成了非常强大的工作。这个简单的模块允许我们编写跨平台代码，因为我们可能会为这些系统类型查询字典，如果匹配，则运行特定于系统的代码。跨平台\
  \ API 最直观的益处之一是编写通过 ssh 管理网络的脚本。代码可以同时在许多平台上运行，同时提供一致的结果。\n\n## 使用 SSH 密钥、NFS 挂载的源码和跨平台\
  \ Python 进行管理\n\n管理异构基础设施的一种方法是结合 ssh 密钥、共享的 NFS 挂载 src 目录以及跨平台 Python。将此过程分分为几个步骤将使其更加清晰。步骤\
  \ 1：创建一个公钥，你将通过它管理机器。请注意，这可能因平台而异。请咨询您的操作系统文档或 man 手页以获取详情。参见示例 8-3。\n\n### 注意\n\
  在下面的示例中指出的一点是，为了演示，我们正在为 `root` 用户创建密钥，但更好的策略是创建一个用户账户。示例 8-3. 创建公钥\n```bash\n[ngift@Macintosh-6][H:11026][J:0]%\
