  \n观察这段代码的输出，我们看到了一个发现数据中心的有趣算法的开端。还有一些地方需要修复，例如向 `Host Record` 对象中添加 MAC 地址，并使代码更符合面向对象，但那可能会演变成另一本书的内容。事实上，那可能会演变成一整家公司。就此，我们进入下一节。\n\
  \n# 使用 Net-SNMP 获取多个值\n\n仅从 SNMP 中获取一个值只是“玩具级”代码，尽管它对于测试响应或根据特定值（如机器的操作系统类型）执行操作可能非常有用。为了做更有意义的事情，我们需要获取几个值并对它们进行一些处理。\n\
  \n一个非常常见的任务是对你的数据中心（或部门）进行盘点，以确定你所有机器的一组参数。这里有一个假设的情况：你正在准备一次重大的软件升级，你被告知所有系统都至少需要\
  \ 1 GB 的内存。你似乎记得大多数机器至少有 1 GB 内存，但在你支持的数千台机器中，有几台是不符合要求的。\n\n你显然需要做出一些艰难的决定。让我们来看一下一些选项：\n\
  \n### 选项 1\n> 物理走到每一台机器前，通过运行命令或打开机器检查安装了多少内存。这显然不是一个很有吸引力的选项。\n\n### 选项 2\n> SSH\
  \ 登录每台机器并运行命令来确定它有多少内存。这种方法有很多问题，但至少在理论上可以通过 ssh 密钥进行脚本化。一个显而易见的问题是需要编写跨平台脚本，因为每个操作系统略有不同。另一个问题是这种方法依赖于知道所有机器的位置。\n\
  \n### 选项 3\n> 编写一个小脚本，遍历并通过 SNMP 询问网络上的每个设备它们拥有多少内存。\n\n通过 SNMP 使用选项 3，可以很容易生成一份盘点报告，其中仅显示那些未达到\
  \ 1 GB 内存的机器。我们需要查询的精确 OID 名称是 `hrMemorySize`。SNMP 总是可以从并发执行中获益，但在绝对必要之前最好不要进行优化。就此，让我们直接进入快速上手的内容。\n\
  \n我们可以复用之前示例中的代码来运行一个非常快速的测试。\n\n从 SNMP 获取内存值：\n\n```python\nIn [1]: run snmpinput\n\
  In [2]: who\nnetsnmp Snmp\nIn [3]: s = Snmp()\nIn [4]: s.DestHost = \"10.0.1.2\"\
  \nIn [5]: s.Community = \"public\"\nIn [6]: s.oid = \"hrMemorySize\"\nIn [7]: result\
  \ = int(s.query()[0])\nhrMemorySize  = None ( None )\nIn [27]: print result\n2026124\n\
  ```\n\n如你所见，编写这样一个脚本非常简单。结果以元组的形式返回（在第 [6] 行），因此我们提取了索引 0 并将其转换为整数。结果现在是一个以 KB 为单位的整数。需要记住的一点是不同的机器计算内存的方式不同。最好通过使用粗略参数而不是硬编码绝对值来考虑这一点，因为你可能会得到与预想不符的结果。例如，你可能想寻找一个略低于\
  \ 1 GB 内存的值范围，比如 990 MB。\n\n在这种情况下，我们可以在脑中进行计算，估算出这大约对应于 2 GB 内存。有了这些信息，你的老板现在通知你需要确定数据中心中哪些机器内存小于\
  \ 2 GB，因为需要安装一个新的应用程序，它至少需要 2 GB 内存。\n\n有了这些信息，我们现在可以自动确定内存了。最合理的方法是查询每台机器，确定它的内存是否小于\
  \ 2 GB，然后将这些信息放入 CSV 文件中，以便于导入 Excel 或 Open Calc。\n\n接下来，你可以编写一个命令行工具，接收子网作为输入以及可选的\
  \ OID 值，但默认为 `hrMemorySize`。我们还想要遍历子网中范围内的 IP 地址。\n\n一如既常，作为系统管理员在编写代码时面临着各种选择。是花几个小时，还是花一天时间。希望你现在已经理解了\
  \ SNMP 的威力。让我们开始编写脚本……\n\n#### 查找内存\n\n在下一个示例中，我们编写了一个通过 SNMP 计算机器内存的命令行工具：\n\n\
  ```python\n#!/usr/bin/env python\n# 获取总内存的命令行工具\nimport netsmp\nimport optparse\n\
  from IP import IP\n\nclass SnmpSession(object):\n    \"\"\"基础会话\"\"\"\n    def __init__(self,\
  \ oid=\"hrMemorySize\", Version=2, DestHost=\"localhost\", Community=\"public\"\
  ):\n        self.oid = oid\n        self.Version = Version\n        self.DestHost\
  \ = DestHost\n        self.Community = Community\n\n    def query(self):\n     \
  \   \"\"\"创建 SNMP 会话\"\"\"\n        try:\n            result = netsmp.snmpwalk(\n\
  \                self.oid,\n                Version=self.Version,\n            \
  \    DestHost=self.DestHost,\n                Community=self.Community\n       \
  \     )\n        except:\n            # 这是玩具代码，但让我们知道抛出了什么异常\n            import\
  \ sys\n            print sys.exc_info()\n            result = None\n        return\
  \ result\n\nclass SnmpController(object):\n    \"\"\"使用 optparse 控制 SnmpSession\"\
  \"\"\n    def run(self):\n        results = {} 存储和收集 SNMP 结果的地方\n        p = optparse.OptionParser(\n\
  \            description=\"确定安装内存的工具\",\n            prog=\"memorator\",\n     \
  \       version=\"memorator 0.1.0a\",\n            usage=\"%prog [subnet] [options]\"\
  \n        )\n        p.add_option('--community', '-c', help='团体字符串', default='public')\n\
  \        p.add_option('--oid', '-o', help='对象标识符', default='hrMemorySize')\n   \
  \     p.add_option('--verbose', '-v', action='store_true', help='增加详细程度')\n    \
  \    p.add_option('--quiet', '-q', action='store_true', help='抑制大部分消息')\n      \
  \  p.add_option('--threshold', '-t', action='store', type=\"int\", help='用于过滤的数字')\n\
  \        options, arguments = p.parse_args()\n        if arguments:\n          \
  \  for arg in arguments:\n                try:\n                    ips = IP(arg)\
  \ # 注意需要将实例转换为字符串\n                except:\n                    if not options.quiet:\n\
  \                        print '忽略 %s，不是有效的 IP 地址' % arg\n                    continue\n\
  \                for i in ips:\n                    # 后续逻辑将...\n```\n\n\n\n\n```python\n\
  ipAddr = str(i)\nif not options.quiet:\n    print 'Running snmp query for: ', ipAddr\n\
  session = SnmpSession(options.oid,\n                      DestHost = ipAddr,\n \
  \                     Community = options.community)\nif options.oid == \"hrMemorySize\"\
  :\n    try:\n        memory = int(session.query()[0])/1024\n    except:\n      \
  \  memory = None\noutput = memory\nelse:\n    #非内存相关的 SNMP 查询结果\n    output = session.query()\n\
  \    if not options.quiet:\n        print \"%s returns %s\" % (ipAddr,output)\n\
  #将所有内容放入 IP/结果字典中\n# 但只有当响应有效时才这样做\nif output != None:\n    if options.threshold:\
  \   #确保一个特定的阈值\n        if output < options.threshold:\n            results[ipAddr]\
  \ = output\n            #允许打印到标准输出\n            if not options.quiet:\n        \
  \        print \"%s returns %s\" % (ipAddr,output)\n    else:\n        results[ipAddr]\
  \ = output\n        if not options.quiet:\n            print output\nprint \"Results\
  \ from SNMP Query %s for %s:\\n\" % (options.oid,arguments), results\nelse:\n  \
  \  p.print_help() #注意如果命令行上没有指定内容，则打印帮助信息\ndef _main():\n    \"\"\"\n    运行内存。\n\
  \    \"\"\"\n    start = SnmpController()\n    start.run()\nif __name__ ==__main__':\n\
  \    try:\n        import IPy\n    except:\n        print \"Please install the IPy\
  \ module to use this tool\"\n_main()\n```\n\n好的，让我们逐步分析这段代码并看看它是做什么的。我们将上一个示例中的整个类提取出来并将其放入一个新的模块中。接下来，我们创建了一个控制器类，通过\
  \ `optparse` 模块处理选项处理。我们反复引用的 `IPy` 模块负责处理 IP 地址参数。我们现在可以放置多个 IP 地址或子网范围，我们的模块将查找\
  \ SNMP 查询并以收集的 IP 地址和值的字典形式返回结果。\n\n我们所做的复杂工作之一是在末尾创建了一些逻辑，使其不返回空结果，并且额外监听一个阈值。这意味着我们将其设置为仅返回低于特定阈值的值。通过使用阈值，我们可以为我们返回有意义的结果，并允许不同机器在处理内存计算方面存在差异。\n\
  \n让我们来看看这个工具运行时的输出示例：\n\n```\n[ngift@ng-lep-lap][H:6518][J:0]> ./memory_tool_netsnmp.py\
  \ 10.0.1.2 10.0.1.20\nRunning snmp query for: 10.0.1.2\n  hrMemorySize = None (\
  \ None )\n1978\nRunning snmp query for: 10.0.1.20\n  hrMemorySize = None ( None\
  \ )\n372\nResults from SNMP Query MemorySize for ['10.0.1.2', '10.0.1.20']:\n{'10.0.1.2':\
  \ 1978, '10.0.1.20': 372}\n```\n\n如你所见，结果来自 10.0.1.0/24 子网上的机器。现在让我们使用阈值标志来模拟查找未至少\
  \ 2 GB RAM 的机器。正如我们之前提到的，机器计算 RAM 的方式存在某些差异，所以为了安全起见，我们输入数字 1800，这大致对应 1800 MB RAM。如果机器不包含至少\
  \ 1800 MB 或大约 2GB 的 RAM，我们将在报告中得到。\n\n以下是该查询的输出：\n\n```\n[ngift@ng-lep-lap][H:6519][J:0]>\
  \   ./memory_tool_netsnmp.py --threshold 1800 10.0.1.2 10.0.1.20\nRunning snmp query\
  \ for: 10.0.1.2\n  hrMemorySize = None ( None )\nRunning snmp query for: 10.0.1.20\n\
  \  hrMemorySize = None ( None )\n10.0.1.20 returns 372\nResults from SNMP Query\
  \ MemorySize for ['10.0.1.2', '10.0.1.20']:\n{'10.0.1.20': 372}\n```\n\n虽然我们的脚本完成了它的工作，但仍有几点可以进行优化。如果你需要查询成千上万台机器，这个工具可能需要运行一天。这可能是可以的，但如果你需要快速获得结果，你需要添加并发性并分叉（fork）每个查询。我们可以采取的另一个改进是自动生成\
  \ CSV 报告。在我们这些这些任务自动化之前，让我向你展示一个你可能没有注意到的额外好处。代码编写方式允许查询任何 OID，而不仅仅是内存计算的 OID。这非常有用，因为我们现在既有一个计算内存的工具，又有一个用于执行\
  \ SNMP 查询的通用工具。让我们来看看我们所指的示例：\n\n```\n[ngift@ng-lep-lap][H:6522][J:0]> ./memory_tool_netsnmp.py\
  \ 10.0.1.2 10.0.1.20\nRunning snmp query for: 10.0.1.2\n  hrMemorySize = None (\
  \ None )\n10.0.1.2 returns None\nRunning snmp query for: 10.0.1.20\n  hrMemorySize\
  \ = None ( None )\n10.0.1.20 returns 372\nResults from SNMP Query MemorySize for\
  \ ['10.0.1.2', '10.0.1.20']:\n{'10.0.1.2': None, '10.0.1.20': 372}\n```\n*(注：原文提供的示例文本在结尾处似乎存在格式混乱或重复，此处已根据语境进行了逻辑对齐翻译)*\n\
  \n在编写可能是一次性的工具时，记住这个事实是好的。为什么不多花 30 分钟将其通用化呢？结果是，你可能会拥有一个被反复使用的工具，而这 30 分钟与你以后节省的时间相比将是微不足道的。\n\
  \n# 创建混合工具\n\n由于我们已经展示了一些独立工具的示例，但值得注意的是这些技术可以组合起来创建非常复杂的工具。让我们从创建一系列一次性工具开始，稍后我们可以在更大的脚本中确保这些。\n\
  \n有一个名为 `snmpstatus` 的有用工具，它可以获取多个不同的 SNMP 查询并将它们合并为一个“状态”：\n\n```python\nimport\
  \ subprocess\n\nclass Snmdp(object):\n    \"\"\"一个 snmpstatus 命令行工具\"\"\"\n    def\
  \ __init__(self,\n                 Version=\"-v2c\",\n                 DestHost=\"\
  localhost\",\n                 Community=\"public\",\n                 verbose=True):\n\
  \        self.Version = Version\n        self.DestHost = DestHost\n        self.Community\
  \ = Community\n        self.verbose = verbose\n    def query(self):\n        \"\"\
  \"创建 snmpstatus 会话\"\"\"\n        Version = self.Version\n        DestHost = self.DestHost\n\
  \        Community = self.Community\n        verbose = self.verbose\n        try:\n\
  \            snmpstatus = \"snmpstatus %s -c %s %s\" % (Version, Community, DestHost)\n\
  \            if verbose:\n                print \"Running: %s\" % snmpstatus\n \
  \           p = subprocess.Popen(snmpstatus,\n                                 shell=True,\n\
  \                                 stdout=subprocess.PIPE)\n            out = p.stdout.read()\n\
  \            return out\n        except:\n            import sys\n            print\
  \ >> sys.stderr, \"error running %s\" % snmpstatus\n```\n\n\n\n\n\n```python\ndef\
  \ _main():\n    snmpstatus = Snmpdf()\n    result = snmpstatus.query()\n    print\
  \ result\nif __name__ == \"__main__\":\n    _main()\n```\n\n我们希望你注意此一点：该脚本与 `snmpdf`\
  \ 命令相比区别非常小，除了命名不同之外。这是一个说明何时创建另一层抽象并重用公共组件是个主意的绝佳示例。如果我们创建一个模块来处理所有的样板代码（boilerplate\
  \ code），我们的新脚本将只有几行长。请记住这一点；我们稍后会回来讨论。\n\n另一个与 SNMP 工具是 `ARP`，它使用了 `ARP` 协议。通过使用\
  \ `ARP` 协议，如果你物理上位于同一个网络中，就可以根据 IP 地址获取设备的 Mac 地址。让我们也写这样一个工具吧。这个一次性的工具稍后会派上用场。\n\
  \n`ARP` 极其容易封装成脚本，因此最好直接通过 IPython 交互式运行来展示示例。开始启动 IPython 并尝试一下吧：\n\n```python\n\
  import re\nimport subprocess\n#some variables\nARP = \"arp\"\nIP = \"10.0.1.1\"\n\
  CMD = \"%s %s \" % (ARP, IP)\nmacPattern = re.compile(\":\")\n\ndef getMac():\n\
  \    p = subprocess.Popen(CMD, shell=True, stdout=subprocess.PIPE)\n    out = p.stdout.read()\n\
  \    results = out.split()\n    for chunk in results:\n        if re.search(macPattern,\
  \ chunk):\n            return chunk\nif __name__ == \"__main__\":\n    macAddr =\
  \ getMac()\n    print macAddr\n```\n\n这段代码段还不是一个可用的工具，但你可以轻松地采用这个想法并将其作为通用数据中心发现库的一部分。\n\
  \n# 扩展 Net-SNMP\n\n正如我们之前讨论过的，Net-SNMP 安装在大多数 *nix* 机器上以 agent 的形式运行。agent 能够返回一组默认信息，但也可以扩展机器上的\
  \ agent。编写一个可以收集几乎任何内容内容并通过 SNMP 协议返回结果的 agent 是相当直接的。\n\n`EXAMPLE.conf` 文件是获取扩展\
  \ Net-SNMP 信息的最佳来源之一，它随 Net-SNMP 一起包含。对 `snmpd.conf` 执行 `man` 命令对于获取记录 API 的更详细信息同样有用。如果你对进一步研究扩展原生\
  \ agent 感兴趣，这两者都是很好的参考信息源。\n\n对于 Python 程序员来说，扩展 Net-SNMP 是使用 SNMP 最令人兴奋的方面之一，因为它允许开发者编写代码来监控他们认为合适的内容，并让\
  \ agent 内部响应你分配给它的条件。\n\nNet-SNMP 提供了许多扩展其 agent 的方法，但为了开始，我们将编写一个 Hello World 程序，并通过\
  \ `snmp` 进行查询。第一步是创建一个非常简单的 `snmpd.conf` 文件，该文件会在 Python 中执行我们的 Hello World 程序。[示例\
  \ 7-4] 显示了它在 Red Hat 机器上的样子。\n\n### 示例 7-4. 带有 Hello World 的 SNMP 配置\n\n```\nsyslocation\
  \ \"O'Reilly\"\nsyscontact bofh@oreilly.com\nrocommunity public\nexec helloworld\
  \ /usr/bin/python -c \"print 'hello world from Python'\"\n```\n\n接下来，我们需要告诉 `snmpd`\
  \ 重新读取配置文件。我们可以通过三种不同的方法实现。在 Red Hat 上，你可以使用：\n\n`service snmpd reload`\n\n或者你也可以执行：\n\
  \n`ps -ef | grep snmpd`\n\n```\nroot     12345     1  0 Apr14 ?        \n00:00:30\
  \ /usr/sbin/snmpd -Lsd -Lf /dev/null -p /var/run/snmpd.pid -a\n```\n\n然后你可以发送：\n\
  \n`kill -HUP 12345`\n\n最后，`snmpset` 命令可以将整数 (1) 分配给 `UCD-SNMP-MIB::versionUpdateConfig.0`，这将告诉\
  \ `snmpd` 重新读取配置文件。\n\n现在我们修改了 `snmpd.conf` 文件并告诉 `snmpd` 重新读取配置文件，可以使用 `snmpwalk`\
  \ 命令行工具或带有 IPython 的 Net-SNMP 绑定来查询我们的机器。以下是 `snmpwalk` 命令显示的内容：\n\n```\n[root@giftcsllc02][H:4904][J:0]>\
  \ snmpwalk -v 1 -c public localhost .1.3.6.1.4.1.2021.8\nUCD-SNMP-MIB::extIndex.1\
  \ = INTEGER: 1\nUCD-SNMP-MIB::extNames.1 = STRING: helloworld\nUCD-SNMP-MIB::extCommand.1\
  \ = STRING: /usr/bin/python\n  -c \"print 'hello world from Python'\"\nUCD-SNMP-MIB::extResult.1\
  \ = INTEGER: 0\nUCD-SNMP-MIB::extOutput.1 = STRING: hello world from Python\nUCD-SNMP-MIB::extErrFix.1\
  \ = INTEGER: noError(0)\nUCD-SNMP-MIB::extErrFixCmd.1 = STRING:\n```\n\n这个查询带有一些解释，因为敏锐的读者可能会想知道我们从哪里得到了\
  \ `1.3.6.1.4.1.2021.8`。这个 OID 是 `ucdavis.extTable`。当你为 `snmpd.conf` 创建扩展时，它将将其分配给这个\
  \ OID。情况变得稍微复杂了一些。\n\n\n\n\n\n最后，我们想说明这是书中最令人兴奋的话题之一，而 SNMP 仍然是一个未被充分开发的乐场。自定义 Net-SNMP\
  \ 有许多用途，如果你能细心地使用 SNMP v3，你就可以完成一些通过 SNMP 协议最容易完成的惊人工作；而在其他情况下，`ssh` 或 sockets 将会是更自然的选择。\n\
  \n### SNMP 设备控制\n\nSNMP 能做的最有趣的事情之一是通过 SNMP 协议控制设备。显然，这与使用类似 `Pyexpect` ([`sourceforge.net/projects/pexpect/`](http://sourceforge.net/projects/pexpect/))\
  \ 来控制路由器相比，具有显著的优势，因为它要直接得多。\n\n为了简洁起见，我们将在示例中仅涵盖 SNMP v1，但如果你在不安全的网络上与设备通信，应该通过\
  \ SNMP v3 进行。对于本部分，如果你有 Safari 账号或购买了这些书，最好参考 Kevin Dooley 和 Ian J. Brown (O’Reilly)\
  \ 出版的 *Essential SNMP* 和 *Cisco IOS Cookbook*。这些书中包含了关于通过 SNMP 与 Cisco 设备通信以及基础配置的优秀信息。\n\
  \n由于通过 SNMP 重新加载 Cisco 配置非常酷，它似乎是讨论设备控制的完美选择。在这个示例中，必须有一个正在运行的 TFTP 服务器，路由器将从中拉取\
  \ IOS 文件，并且路由器必须配置为允许 SNMP 的读/写访问。示例 7-6 是 Python 代码的样子。\n\n```python\nimport netsnmp\n\
  \nvars = netsnmp.Varbind(netsnmp.VarList(netsnmp.Varbind(\".1.2.6.1.4.1.9.2.10.6.0\"\
  , \"1\"),`\n         (netsnmp.Varbind(\"cisco.example.com.1.3.6.1.4.1.9.2.10.12.172.25.1.1`,\n\
  \                          \"iso-config.bin\")`\nresult = netsnmp.snmpset(vars,\n\
  \                         Version = 1,\n                         DestHost='cisco.example.com',\n\
  \                         Community='readWrite')`\n```\n\n在这个示例中，我们使用 Net-SNMP 的\
  \ `VarList` 来分配指令：首先擦除交换机的闪存，其次加载新的 IOS 镜像文件。这可以作为一次性升级数据中心中每个交换机 IOS 的脚本基础。与书中的所有代码一样，你应该在非生产环境中测试它，看看会发生什么。\n\
  \n最后需要指出的一点是，SNMP 通常不被用于设备控制，但它是以程序化方式控制数据中心设备的强大方法，因为自 1988 年以来一直在开发的设备控制统一规范。未来可能会为\
  \ SNMP v3 带来非常有趣的故事。\n\n# Zenoss 的企业级 SNMP 集成\n\nZenoss 是企业级 SNMP 管理系统的一个迷人的新选择。Zenoss\
  \ 不仅是一个完全开源的应用，它还是用纯 Python 的。Zenoss 是一种新型企业应用，既非常强大，又通过 `XML-RPC` 或 `ReST` API\
  \ 进行扩展。关于 `ReST` 的更多信息，请参阅 Leonard Richardson 和 Sam Ruby (O’Reilly) 写的 *RESTful\
  \ Web Services*。\n\n最后，如果你想帮助开发 Zenoss，可以贡献补丁。\n\n#### Zenoss API\n\n有关 Zenoss API\
  \ 的最新信息，请访问 [`www.zenoss.com/community/docs/howtos/send-events/`](http://www.zenoss.com/community/docs/howtos/send-events/)。\n\
  \n### 使用 Zendmd\n\nZenoss 不仅带有一个健的 SNMP 监控和发现系统，还包含一个名为 `zendmd` 的高级 API。你可以打开一个自定义\
  \ shell 并直接对 Zenoss 运行命令。\n\n使用 `zendmd`：\n\n```python\n>>> d = find('build.zenoss.loc')\n\
  >>> d.os.interfaces.objectIds()\n['eth0', 'eth1', 'lo', 'sit0', 'vmnet1', 'vmnet8']\n\
  >>> for d in dmd.Devices.getSubDevices():\n>>>     print d.id, d.getManageIp()\n\
  ```\n\n### 设备 API\n\n你也可以通过 `XML-RPC` API 直接与 Zenoss 通信并添加或删除设备。以下是两个示例。\n\n使用 ReST：\n\
  \n```bash\n[zenos@zenoss $]\nwget 'http://admin:zenoss@MYHOST:8080/zport/dmd\n/ZenEventManager'\n\
