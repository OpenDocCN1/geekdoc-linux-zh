  \ 的书签。然后，我们用 `-d` 选项删除了它。\n\n\n\n\n这个例子并不完全真实。你可能并不想创建 10 个包含日期的文本文件。但这个示例展示了如何将\
  \ Python 代码和 shell 代码混合在一起。我们遍历了由 `range()` 函数创建的列表，并将列表中的当前项存储在变量 `i` 中。在每次迭代中，我们使用\
  \ shell 执行符号 `!` 来调用 `date` 命令行系统实用程序。请注意，我们调用 `date` 时使用的语法与我们定义了 shell 变量 `i`\
  \ 后调用它的方式是完全相同的。因此，`date` 实用程序被调用，其输出被重定向到文件 `{current list item}.txt` 中。在创建文件后，我们列出了这些文件，甚至使用\
  \ `cat` 查看了其中一个文件，以确认它包含了看起来像日期的内容。\n\n你可以将 Python 中能想到的任何值传递到你的系统 shell。无论该值是在数据库中，还是在\
  \ `pickle` 文件中，或者是由计算生成、XMLRPC 服务生成，亦你从文本文件中提取的数据，你都可以用 Python 将其提取，然后通过 `!` 执行技巧将其传递给系统\
  \ shell。\n\n## 字符串处理\n\nIPython 提供的另一个极其强大的功能是对系统 shell 命令的输出进行字符串处理。假设我们想查看属于用户\
  \ `jmjones` 的所有进程的 PID。我们可以通过输入以下内容：\n\n```\nps aux | awk '{if ($1 == \"jmjones\"\
  ) print $2}'\n```\n\n这非常紧凑、简洁且易于阅读。但让我们用 IPython 来完成相同的任务。首先，让我们从未过滤的 `ps aux` 中获取输出：\n\
  \n```\nIn [1]: ps = !ps aux\nIn [2]:\n```\n\n调用 `ps aux` 的结果存储在变量 `ps` 中，它是一个类列表的结构，其元素是\
  \ shell 系统调用返回的行。在这种情况下，它之所以是类列表的，是因为它继承了内置的 `list` 类型，因此它支持该类型的所有方法。所以，如果你有一个期望接收\
  \ `list` 的函数或方法，你同样可以将这些这些结果对象之一传递给它。除了支持标准的 `list` 方法外，它还支持几个非常有趣的方法和一个派用用的属性。为了展示这些“有趣方法”的作用，我们暂时偏离寻找所有\
  \ `jmjones` 拥有的进程的最终目标。我们将查看的第一个“有趣方法”是 `grep()` 方法。这基本上是一个简单的过滤器，用于确定保留输出中的哪些行以及忽略哪些行。要查看输出中是否有任何行匹配\
  \ `lighttpd`，我们将输入以下：\n\n```\nIn [2]: ps.grep('lighttpd')\nOut[2]: SList (.p, .n,\
  \ .l, .s, .grep(), .fields() available). Value:\n0: www-data  4905  0.0  0.1........0:00\
  \ /usr/sbin/lighttpd -f /etc/lighttpd/l\n```\n\n我们调用了 `grep()` 方法并向其传递了正则表达式 `'lighttpd'`。记住，传递给\
  \ `grep()` 的正则表达式是不区分大小写的。这次 `grep()`set 的结果是一行输出，显示 `'lighttpd'` 正则表达式有正匹配项。要查看除匹配特定正则表达式的记录以外的所有记录，我们可以进行类似下面的操作：\n\
  \n```\nIn [3]: ps.grep('Mar07', prune=True)\nOut[3]: SList (.p, .n, .l, .s, .grep(),\
  \ .fields() available). Value:\n0: USER       PID %CPU %MEM    VSZ   RSS TTY   \
  \   STAT START   TIME COMMAND\n1: jmjones  19301  0.0  0.4  21364  4272 pts/2  \
