  \ 从 Linux 管理 Windows 服务器`\n\nZODB 模块，`ZODB`\n\n# 关于作者\n\nNoah Gift 是 O'Reilly 出《Python\
  \ For Unix and Linux》的合著者。他是一位作家、演讲者、顾问和社区领袖，曾为为 IBM Developerworks、Red Hat Magazine、O'Reilly、MacTech\
  \ 以及 Manning 等物撰稿。\n\n他的咨询公司是 `Giftcs, LLC`，提供`Python 开发`和`系统工程`的解决方案。他的个人网站是 `www.noahgift.com`。Noah\
  \ 还是 `PyAtl`（佐治州亚特兰大的 Python 用户组）的前组织。他曾在 `Con` 和 `PyAtl` 进行过演讲。\n\n他在加州洛杉矶州立大学获得\
  \ `CIS` 硕士学位，加州州立大学圣路易斯奥波波获得`营养学`学士学位，是 Apple `ACSA` 和 `LPI` 认证系统管理员，以及`苹果认证支持代表`。他曾工作于\
  \ Caltech、Disney Feature Animation、Sony Imageworks、Turner Studios 和 Weta Digital\
  \ 等公司。你可以在 `IMBD` 查看他所有的电影制作。\n\n\n\n\n青少年时期，他曾在 ABC 新闻网担任自由电视编辑。在就读加州理工学院（Caltech）期间，他曾担任诺贝尔奖得主总统的\
  \ Mac 专家；并在迪士尼和索尼参与了这两家公司首部长篇动画电影的制作：分别是《小鸡不可》（Chicken Little）和《冲浪极限》（Surf's Up）。近期，他参与了多样的\
  \ `Python` 开发项目，包括编写 `SNMP` 自动发现系统、从零开始编写一个内容管理系统、使用 `Django` 为特纳工作室（Turner Studios）创建一个大型\
  \ Web 2.0/社交网络应用程序，以及编写与 `Google App Engine` 通信的 iPhone 应用程序。他还参与了一个新媒体新闻项目 `Spotlight\
  \ on FOSS`，该项目对 `Mark Shuttleworth` 进行了首次启动采访。\n\n他目前正在合著一本关于 `Google App Engine`\
  \ 的书籍，并正在编写一个大型的 `Google App Engine` 练习与营养追踪应用程序。最近，他在新西兰的 `Weta Digital` 担任 `Python`\
  \ 程序员，那里拥有世界上最大的渲染农场/超级计算机之一。\n\n在空闲时间，他喜欢与妻子 Leah 和儿子 Liam 在一起，并弹奏和作曲钢琴曲。他还热衷于规律性的锻炼，包括跑步和参加马拉松训练，并撰写相关博客。有机会时，他喜欢编写开源软件。他还对人工智能研究和软件开发感兴趣。\n\
  \nJeremy Jones 是一位软件工程师/系统管理员，任职于 `Predictix`。他的首选武器是 `Python`，但他也进行过大量的 shell 和\
  \ `Perl` 开发，并涉猎 `Java`。\n\n他是开源项目 `Munkware`（一种多生产者/多消费者、事务型且持久的队列机制）、`ediplex`（一个\
  \ EDI 电子数据交换解析引擎）以及 `podgrabber`（一个播客下载器）的作者。这三个项目均用 `Python` 语言编写。\n\nJeremy 利用业时间享受家庭时光并进行一些写作。他住在佐治亚州的康耶斯（Conyers），位于亚特兰大以东部，与妻子\
  \ Debra 和两个孩子 Zane 和 Justus 生活在一起。\n\n# 版后记\n\n《Python for Unix and Linux System\
  \ Administration》封面图像是一只蚺蛇（boa constrictor）。蚺蛇分布在南美、中美以及加勒比的一些岛屿，它们是无毒蛇，可以在各种环境中生存，从沙漠到开阔草原以及湿润的热带雨林，但它们更偏爱干燥的地形而非潮湿环境。它们既是陆栖动物也是树栖动物，但随着年龄增长，它们倾向于花更多时间待地上。\n\
  \n蚺蛇拥有非常独特的标记，包括菱形和类圆形图案。它们的鳞片会根据栖息地改变颜色，以便躲避捕猎它们的森林动物。\n\n在野外，蚺蛇以中小型啮齿类、蜥蜴、蝙蝠、鸟类、獴、松鼠为食，甚至已知捕食如洲猫大型哺乳动物。由于是冷血动物且行动缓慢，蚺蛇在捕获大型猎物后可以一周不进食。它们是独居的夜行捕猎者，头部带有热敏垫有助于它们捕猎。它们特别喜欢蝙蝠，蚺蛇会悬挂在树上或洞口等待蝙蝠飞过，然后用嘴咬住蝙蝠。不意外的是，蚺蛇通过缠绕杀死的。蛇用身体缠绕猎物，每当受害者呼气时就收紧一次力度，最终使其窒息死亡。\n\
  \n蚺蛇是动物园常见的景观，甚至也是相当常见的宠物。事实上，每年有价值数美元的蚺蛇进口到美国。在南美，它们被尊为“啮齿类破坏者”，并因为这个原因经常被驯化。蚺蛇在圈养下会变得非常温顺，可以在那里活\
  \ 20 到 30 年。因异域宠物贸易和装饰性花纹而被捕猎，某些蚺蛇处于濒危状态并受保护。\n\n蚺蛇是季节性繁殖动物。为了吸引雄性，雌性会从泄腔中释放气味，泄腔是肠道和泌尿道排放的腔室。受精发生在体内，雌性一次可以产下多达\
  \ 60 只幼崽。比它们的森��表亲小得多，新生蚺蛇平均长度为 2 英尺，可以长到 13 英尺长，重量超过 100 磅。在南美发现的记录中最大的蚺蛇长达 18\
  \ 英尺！\n\n封面图像来自多佛档案馆（Dover Pictorial Archive）的一幅 19 世纪版画。封面字体是 `Adobe ITC Garamond`。正文字是\
