  \n```python\n#!/usr/bin/env python\nimport time\nimport sys\nfrom multiprocessing\
  \ import Process, Queue\nimport pysnmp\n\nclass HostRecord(object):\n    \"\"\"\
  Record\"\"\"\n    def __init__(self, ip=None, mac=None, snmp_response=None):\n \
  \       self.ip = ip\n        self.mac = mac\n        self.snmp_response = snmp_response\n\
  \n    def __repr__(self):\n        return \"[Host('%s','%s','%s')]\" % (self.ip,\
  \ self.mac, self.snmp_response)\n\ndef f(i, q, oq):\n    \"\"\"Worker function\"\
  \"\"\n    while True:\n        time.sleep(1)\n        if q.empty():\n          \
  \  sys.exit()\n        print(\"Process Number: %d\" % i)\n        ip = q.get()\n\
  \        print(\"Process Number: %d\" % i)\n        ret = subprocess.call(\"ping\
  \ -c 1 %s\" % ip,\n                             shell=True,\n                  \
  \           stdout=open('/dev/null', 'w'),\n                             stderr=subprocess.STDOUT)\n\
  \        if ret == 0:\n            print(\"%s: is alive\" % ip)\n            oq.put(ip)\n\
  \        else:\n            print(\"Process Number: %d didn’t find a response for\
  \ %s \" % (i, ip)\n            pass\n\ndef snmp_query(i, out):\n    \"\"\"Query\
  \ function\"\"\"\n    while True:\n        time.sleep(.1)\n        if out.empty():\n\
  \            sys.exit()\n            print(\"Process Number: %d\" % i)\n       \
  \ ipaddr = out.get()\n        s = Snmp()\n        h = HostRecord()\n        h.ip\
  \ = ipaddr\n        h.snmp_response = s.query()\n        print h\n        return\
  \ h\n\nif __name__ == \"__main__\":\n    ips = [\"19.101.250\", \"19.101.251\",\
  \ \"19.101.252\", \"19.101.253\"]\n    num_workers = 10\n    q = Queue()\n    oq\
  \ = Queue()\n    try:\n        q.putmany(ips)\n    finally:\n        for i in range(num_workers):\n\
  \            p = Process(target=f, args=[i,q,oq])\n            p.start()\n```\n\n\
  如果我们运行此脚本，将得到类似下面的输出：\n\n```\n[root@giftcsllc02][H:4849][J:0]> python discover.py\n\
