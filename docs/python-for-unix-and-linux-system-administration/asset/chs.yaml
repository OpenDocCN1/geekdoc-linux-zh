  \ 应用—点击按钮后\n\n# 使用 PyGTK 构建 Apache 日志查看器\n\n现在我们已经涵盖了 GUI 构建的基础以及 PyGTK 的具体用法，下面是一个使用\
  \ PyGTK 构建更有实用内容的示例；我们将逐步创建一个 Apache 日志文件查看器。我们在这个应用程序中包含的功能如下：\n\n* 选择并打开指定的日志文件\n\
  * 一览查看行号、远程主机、状态和发送的字节数\n* 按行号、远程主机、状态或发送的字节数对日志行\n\n此示例基于我们在 第 3 章 中编写的 Apache\
  \ 日志解析代码。示例 11-2 是日志文件查看器的源代码。\n\n示例 11-2. PyGTK Apache 日志查看器\n\n```python\n#!/usr/bin/env\
