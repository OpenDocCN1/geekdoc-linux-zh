  \ line])\n        logfile.close()\n```\n\n\n\n\n在 PyGTK Apache Log 查看示例中，主类 `ApacheLogViewer`\
  \ 仅继承自 `object`。我们的主对象并没有特殊之处；它恰好是用来挂载所有 GUI 组件和动作的地方。\n\n接下来，跳转到 `__init__()` 方法，我们创建了一个窗口对象。这个示例与之前的“简单”示例稍有不同的地方在于我们为此窗口指定了大小要求。我们最初指定该窗口的显示大小应为\
  \ 640×480，然后指定它应该最大化。设置两次大小参数是有刻意为之。640×480 是一个合理的起始大小，因此这并不是一个糟糕的默认值。虽然 640×480\
  \ 是一个不错的尺寸，但越大越好，所以我们将窗口最大化了。事实证明，先设置 640×480（或你喜好的其他尺寸）可能是一个良好的做法。根据 PyGTK 文档，窗口管理器可能不会遵守\
  \ `maximize()` 请求。此外，用户在窗口最大化后可以取消最大化，因此你可能想在取消最大化时指定大小。\n\n创建并设置窗口大小后，我们创建了一个 `VBox`。这是一个“垂直框”，它本质上是一个容器对象。GTK\
  \ 有使用垂直框（`VBox`）和水平框（`HBox`）在窗口上布局组件的概念。这些框背后的思想是你可以相对于它们的起始（对于 `VBoxes` 是顶部，`HBoxes`\
  \ 是左侧）或末尾向它们“装入”（pack）组件。如果你不知道组件（widget）是什么，它简单就是一个 GUI 组件，例如按钮或文本框。通过使用这些框，你可以以你想象的任何方式在窗口上布局组件。由于框是容器，它们可以包含其他框，因此请随意将一个框装入另一个框中。\n\
  \n将 `VBox` 添加到窗口后，我们添加了工具栏和工具按钮。工具栏本身是另一个容器，并提供了向自身添加组件的方法。我们为按钮创建图标，创建按钮，并将事件处理器附加到按钮上。最后，我们将按钮添加到工具栏中。就像在\
  \ `VBox` 上使用 `pack_start()` 一样，我们在 `ToolBar` 上使用 `insert()` 来添加组件。\n\n接下来，我们创建了一个文件选择器组件，用于导航到日志文件进行处理，然后将其与一个事件处理器关联。这部分非常直接，但我们稍后会再次提到。\n\
  \n在创建文件选择器后，我们创建了将包含日志行的列表组件。该组件由两部分组成：数据部分（一个 `ListStore`）以及你交互的部分（一个 `TreeView`）。我们首先通过定义想要在哪些列中包含什么类型的数据来创建数据部分。接着，我们创建显示组件并将数据组件与它关联。\n\
  \n创建完列表组件后，我们创建了最后一个容器——可滚动窗口，然后将所有内容打包在一起。我们将工具栏、文件选择器和可滚动窗口封装到之前创建的 `VBox` 中。我们将包含日志行的列表部分放入可滚动窗口中，这样如果行数多于几行，我们就可以滚动查看它们。\n\
  \n最后，我们设置某些项的可见和不可见。我们通过 `show_all()` 调用使主窗口可见。此调用也会让所有子元素可见。考虑到我们创建此 GUI 应用的方式，我们希望文件选择器在点击“打开”按钮之前隐藏的。因此，我们在创建时将文件选择器控件设置为不可见。\n\
  \n当你启动此应用程序时，你可以看到它满足我们的初始需求。我们能够选择并打开指定的日志文件。行号、远程主机、状态和字节数这些数据在列表控件中都有各自的列，因此我们只需扫一眼每一行就能推断出这些数据。而且，我们只需点击相应的列标题即可对任何一列进行排序。\n\
  \n# 使用 Curses 构建 Apache 日志查看器\n\n`curses` 是一个便于创建交互式文本应用程序的库。与 GUI 工具包不同，curses\
  \ 不遵循事件处理和回调方法。你负责从用户处获取输入并对其进行处理，而在 GTK 中，组件负责从用户处获取输入，并在事件发生时工具包调用处理器函数。curses\
  \ 与 GUI 工具包的另一个区别在于，在 GUI 工具包中，你将组件添加到某些容器中并让工具包处理屏幕的绘制和刷新。在 curses 中，你通常直接在屏幕上绘制文本。\n\
  \n示例 11-3 再次是 Apache 日志查看器，使用 Python 标准库中的 `curses` 模块实现。\n\n示例 11-3. curses Apache\
  \ log viewer\n\n```python\n#!/usr/bin/env python\n\n\"\"\"\n基于 curses 的 Apache 日志查看器\n\
  用法:\n    curses_log_viewer.py logfile\n这将启动一个交互式的、键盘驱动的日志查看应用程序。这里\n是各种按键的功能:\n\
  \    u/d   - 向上/向下滚动\n    t     - 转到日志文件顶部\n    q     - 退出\n    b/h/s - 按字节/主机名/状态排序\n\
  \    r     - 恢复初始排序顺序\n\"\"\"\nimport curses\nfrom apache_log_parser_regex import\
  \ dictify_logline\nimport sys\nimport operator\n\nclass CursesLogViewer(object):\n\
  \    def __init__(self, logfile=None):\n        self.screen = curses.initscr()\n\
  \        self.curr_topline = 0\n        self.logfile = logfile\n        self.loglines\
  \ = []\n    def page_up(self):\n        self.curr_topline = self.curr_topline -\
  \ (2 * curses.LINES)\n        if self.curr_topline < 0:\n            self.curr_topline\
  \ = 0\n            self.draw_lines()\n    def page_down(self):\n        self.draw_lines()\n\
  \    def top(self):\n        self.curr_topline = 0\n        self.draw_lines()\n\
  \    def sortby(self, field):\n        # self.loglines = sorted(self.loglines, key=operator.itemgetter(field))\n\
  \        self.loglines.sort(key=operator.itemgetter(field))\n        self.top()\n\
  \    def set_logfile(self, logfile):\n        self.logfile = logfile\n        self.load_lines()\n\
  \    def load_lines(self):\n        self.loglines = []\n        logfile = open(self.logfile,\
  \ 'r')\n        for i, line in enumerate(logfile):\n            line_dict = dictify_logline(line)\n\
  \            self.loglines.append((i + 1, line_dict['remote_host'],\n          \
  \      line_dict['status'], int(line_dict['bytes_sent']), line.rstrip()))\n    \
  \    logfile.close()\n        self.draw_lines()\n    def draw_lines(self):\n   \
  \     self.screen.clear()\n        status_col = 4\n        bytes_col = 6\n     \
  \   remote_host_col = 16\n        status_start = 0\n        bytes_start = 4\n  \
  \      remote_host_start = 10\n        line_start = 26\n        logline_cols = curses.COLS\
  \ - status_col - bytes_col - remote_host_col - 1\n        for i in range(curses.LINES):\n\
  \            c = self.curr_topline\n            try:\n                curr_line\
  \ = self.loglines[c]\n            except IndexError:\n                break\n  \
  \          self.screen.addstr(i, status_start, str(curr_line[2]))\n            self.screen.addstr(i,\
  \ bytes_start, str(curr_line[3]))\n            self.screen.addstr(i, remote_host_start,\
  \ str(curr_line[1]))\n            self.screen.addstr(i, line_start, str(curr_line[4]),\
  \ logline_cols)\n            self.curr_topline += 1\n        self.screen.refresh()\n\
  \    def main_loop(self, stdscr):\n        stdscr.clear()\n        self.load_lines()\n\
  \        while True:\n            c = self.screen.getch()\n            try:\n  \
  \              c = chr(c)\n            except ValueError:\n                continue\n\
  \            if c == 'd':\n                self.page_down()\n            elif c\
  \ == 'u':\n                self.page_up()\n            elif c == 't':\n        \
  \        self.top()\n            elif c == 'q':\n                break\n       \
  \     elif c == 'b':\n                self.sortby(3)\n            elif c == 'h':\n\
  \                self.sortby(1)\n            elif c == 's':\n                self.sortby(2)\n\
  \            elif c == 'r':\n                self.top()\n```\n\n\n\n\n```python\n\
  elif c == 'u':\n    self.page_up()\nelif c == 't':\n    self.top()\nelif c == 'b':\n\
  \    self.sortby(3)\nelif c == 'h':\n    self.sortby(1)\nelif c == 's':\n    self.sortby(2)\n\
  elif c == 'r':\n    self.sortby(0)\nelif c == 'q':\n    break\n\nif __name__ ==\
  \ '__main__':\n    infile = sys.argv[1]\n    c = CursesLogViewer(infile)\n    curses.wrapper(c.main_loop)\n\
  ```\n\n在 [示例 11-1] 中，我们创建了一个单一类 `CursesLogViewer` 来组织我们的代码。在构造函数中，我们创建了一个 curses\
  \ 屏幕并初始化了几个变量。我们在程序的“主”部分实例化了 `CursesLogViewer`，并传入了想要查看的日志文件。我们本可以在应用程序中设置一个选项来浏览并选择文件，但这将比\
  \ PyGTK 实现的日志查看器文件浏览器要费力得多。此外，由于用户将在 shell 中运行此应用程序，因此要求他们从命令行导航到文件并在启动程序时将其传入，这并不异常。在实例化\
  \ `CursesLogViewer` 后，我们将它的 `main_loop()` 方法传递给 curses 函数 `wrapper()`。curses 函数\
  \ `wrapper()` 会将终端设置为某种状态，以便 curses 应用程序可以使用，然后调用该函数，并在返回之前将终端恢复为正常状态。\n\n`main_loop()`\
  \ 方法充当了一个原始的事件循环。它停留在那里等待用户在键盘上输入内容。当用户输入内容时，循环会分发适当的方法（或至少分发适当的行为）。按下 `u` 或 `d`\
  \ 键将分别通过 `page_up()` 或 `page_down()` 方法来向上或向下滚动。`page_down()` 方法简单地调用 `draw_loglines()`，该方法在终端上绘制日志行，从当前顶行开始。每当有一行被绘制到屏幕上时，当前顶行就会移动到下一行日志。由于\
  \ `draw_loglines()` 只绘制屏幕能够容纳的日志行，因此当它再次被调用时，它将从屏幕顶端开始绘制下一行日志。因此，重复调用 `draw_loglines()`\
  \ 将产生在日志文件中向下滚动的视觉效果。`page_up()` 方法会将当前顶行向上设置两页，然后通过调用 `draw_loglines()` 重新绘制日志行。这具有日志文件中向上滚动的视觉效果。我们在\
  \ `page_up()` 中将当前顶行向上设置两页的原因是，当我们绘制一页时，当前顶行实际上位于屏幕的底部。这样设置是为了后续向下滚动做准备。\n\n我们应用程序的下一类行为是排序。我们构建了按主机名、状态和请求中发送的字节数进行排序的功能。调用任何排序行为都会导致\
  \ `sortby()`。`sortby()` 方法根据指定的字段对我们的 `CursesLogViewer` 对象的日志行列表进行排序，然后调用 `top()`\
  \ 方法。`top()` 方法将当前顶行设置为日志行列表中的第一行，然后绘制下一页日志行（这将是第一页）。\n\n我们应用程序的最后一个事件处理器是 `quit`。`quit`\
  \ 方法简单地跳出“事件循环”，让 `main_loop()` 方法返回到 curses `wrapper()` 函数以进行进一步的终端清理。\n\n虽然 PyGTK\
  \ 应用和 curses 应用的代码行数相当，但 curses 应用感觉工作量更大。也许是因为我们必须创建自己的事件循环。又可能从某种意义上说，我们必须创建自己的组件。又可能是直接在终端屏幕上“绘制”文本让感觉工作量更多。然而，在某些时候，知道如何组合一个\
  \ curses 应用会对你有益。\n\n[图 11-3] 显示了按传输字节排序记录的 curses 日志查看器。\n\n![Apache 日志列表](img/00012.jpg)\n\
  \n图 11-3. Apache 日志列表\n\n我们可以对此应用程序进行的一个改进是能够反转当前活动排序方法的排序顺序。这是一个非常简单的更改，但我们将其留给读者。另一个改进是在滚动过某行日志时查看该行的完整内容。这应该也是中等简单的更改，但我们也将将其留作读者的练习。\n\
  \n### Web 应用程序\n\n说 Web 是巨大的是言之过过。Web 上充斥着人们每天依赖的应用程序。为什么 Web 上有这么多应用程序？首先，随处可访问。这意味着当部署\
  \ web 应用程序时，任何可以访问它的人只需将浏览器指向 URL 即可使用。除非你正在使用像 Flash 这样的插件，否则用户除了下载和安装浏览器（他们可能已经有了）之外不需要下载任何东西。这一点的主要吸引力在于用户。其次，单升级。这意味着一方（应用程序所有者）可以升级整个用户群，而另一方（用户）无需执行任何操作。只有当你不依赖于用户当前环境中可能不存在的功能时，这才是真的。例如，如果你的升级依赖于比当前用户群需要安装的更新版本的\
  \ Flash 功能，那么这种优势可能会付诸东流。但当它起同时，这一点对双方都具有吸引力，尽管用户不太可能意识到这一点。第三，浏览器几乎是一个通用的部署平台。虽然存在一些跨浏览器兼容性问题，但大多数情况下，如果你不使用特殊插件，在一个操作系统的一个浏览器中运行的\
  \ web 应用程序大部分在另一个操作系统的另一个浏览器中也能运行。这一点对双方来说也具有吸引力。只需在开发端多花一点工作，就能让应用程序在多个浏览器环境中运行。而用户可以享受在自己选择的地方使用应用程序。\n\
  \n那么，这对你作为系统管理员有什么意义呢？我们之前关于构建通用 GUI 的所有理由都适用于构建 web 应用程序。web 应用程序对系统管理员的一个优势是，web\
  \ 应用程序可以访问其运行机器的文件系统和进程表。web 应用程序的这一特殊属性使其成为系统、应用程序和用户监控及报告机制的优秀解决方案。而那类问题属于系统管理员的领域。\n\
  \n希望你能看到这种好处，尽管为你自己或你的用户构建 web 应用程序可能只对你个人有用。但你可以用什么来构建 web 应用程序呢？由于这是一本关于 Python\
  \ 的书，我们当然会推荐 Python 解决方案。但是哪一个呢？对 Python 的批评之一是它的 web 应用程序框架像一年的天一样多。目前，四种主流选择是\
  \ `TurboGears`、`Django`、`Pylons` 和 `Zope`。这四者都有自己的优势，但我们认为 `Django` 特别适合本书的主题。\n\
  \n### Django\n\n\n\n\nDjango 是一个全栈 Web 应用框架。它包含一个模板系统、通过对象关系映射（ORM）实现的数据库连接，当然，还有用于编写应用程序逻辑部分的\
  \ Python 本身。作为一个“全栈”框架，Django 同样遵循模型-视图-模板（Model-View-Template，简称 MVT）方法。这种模型-视图-模板方法与常见的模型-视图-控制器（MVC）方法相似，甚至可能完全相同。两者都是开发应用程序的方法，以确保应用程序的各个部分不会发生不必要的混合。数据库代码被分离到这两种方法中称为“模型（model）”的区域。业务逻辑被分离到\
  \ MVT 中被称为“视图（view）”、在 MVC 中被称为“控制器（controller）”。而表现层则被分离到 MVT 中被称为“模板（template）”，在\
  \ MVC 中被称为“视图（view）”。\n\n# Apache 日志查看器应用程序\n\n在以下由几部分代码组成的示例中，我们将创建另一个与 PyGTK 实现类似的\
  \ Apache 日志查看器。由于我们需要打开日志文件允许用户查看和排序，因此实际上并不需要数据库，所以此示例不包含任何数据库连接。在介绍示例代码之前，我们将向你展示如何在\
  \ Django 中设置项目和应用程序。\n\n你可以从 [`www.djangoproject.com/`](http://www.djangoproject.com/)\
  \ 下载 Django 代码。在编写本文时，最新版本是 0.96。然而，建议安装的版本来自开发主干（trunk）。下载后，只需使用标准的 `python setup.py\
  \ install` 命令进行安装。安装完成后，你将在 `site-packages` 目录中拥有 Django 库，并在 `scripts` 目录中拥有一个\
  \ `django-admin.py` 脚本。通常，在 Nix 系统上，`scripts` 目录与你的 `python` 可执行文件所在的目录相同。\n\n安装\
  \ Django 后，你需要创建一个项目和一个应用程序。项目包含一个或多个应用程序。它们还作为你正在构建的整个 Web 应用（注意不要与 Django 应用程序混淆）的配置中心。Django\
  \ 应用程序是较小的功能单元，可以在不同的项目中复用。对于我们的 Apache 日志查看应用程序，我们通过运行 `django-admin.py startproject\
  \ dj_apache` 创建了一个名为“dj_apache”的项目。这一步创建了一个目录和一些文件。\n\n### 示例 11-4. Django 项目的树状视图\n\
  \n```\njmjones@dinkbuntu:~/code$ tree dj_apache\ndj_apache\n|-- __init__.py\n|--\
  \ manage.py\n|-- settings.py\n|-- urls.py\n0 directories, 4 files\n```\n\n现在我们有了项目，可以给它分配一个应用程序。我们首先进入\
  \ `dj_apache` 目录，然后使用 `django-admin.py startapp logview` 创建一个应用程序。这会在 `dj_apache`\
  \ 目录中创建一个 `logview` 目录和几个文件。\n\n### 示例 11-5. Django 应用程序的树状视图\n\n```\njmjones@dinkbuntu:~/tmp$\
  \ tree dj_apache/\ndj_apache/\n|-- __init__.py\n|-- logview\n|   |-- __init__.py\n\
  |   |-- models.py\n|   |-- views.py\n|-- manage.py\n|-- settings.py\n|-- urls.py\n\
  ```\n\n你可以看到应用程序目录 (`logview`) 包含了 `models.py` 和 `views.py`。Django 遵循 MVT 约定，因此这些文件有助于将整个应用程序拆分为对应的组件。`models.py`\
  \ 文件包含数据库布局，因此它属于 MVT 缩写中的模型组件。`views.py` 包含了应用程序的逻辑，因此它属于缩写中的视图组件。\n\n这就留下了缩写中的模板组件。模板组件包含整个应用程序的表现层。我们有几种方法让\
  \ Django 看到我们的模板，但我们会在 `logview` 目录下创建一个 `templates` 目录。\n\n### 示例 11-6. 添加 templates\
  \ 目录\n\n```\njmjones@dinkbuntu:~/code$ mkdir dj_apache/logview/templates\njmjones@dinkbuntu:~/code$\
  \ tree dj_apache/\ndj_apache/\n|-- __init__.py\n|-- logview\n|   |-- __init__.py\n\
  |   |-- models.py\n|   |-- templates\n|   |-- views.py\n|-- manage.py\n|-- settings.py\n\
  |-- urls.py\n2 directories, 7 files\n```\n\n现在，我们准备好填充应用程序的内容了。我们要做的第一件事是决定 URL\
  \ 如何工作。这是一个基础应用程序，所以 URL 将非常直接。我们想要列出日志文件并查看它们。由于我们的功能非常有限，我们更新了 `urls.py` 文件。\n\
  \n### 示例 11-7. Django 配置 (urls.py)\n\n```python\nfrom django.conf.urls import *\n\
  \nurlpatterns = [\n    ('', 'dj_apache.views.list_files'),\n    (r'^log/(?P<sortmethod>.*?)/(?P<filename>.*)',\
  \ 'dj_apache.views.view_log'),\n]\n```\n\nURL 配置清晰简单。它高度依赖正则表达式将 URL 映射到函数。当浏览器连接到应用程序并发送资源请求时，Django\
  \ 会在 `urls.py` 中查找正则表达式与 URL 匹配的项，然后将请求派发给匹配的函数。\n\n### 示例 11-8. Django 视图模块 (views.py)\n\
  \n```python\n# 创建你的视图\nfrom django.shortcuts import render_to_response\nimport os\n\
  from apache_log_parser import dictify_logline\nimport operator\n\nlog_dir = '/var/log/apache'\n\
  \ndef get_log_dict(logline):\n    l = dictify_logline(logline)\n    try:\n     \
  \   l['bytes_sent'] = int(l['bytes_sent'])\n    except ValueError:\n        l['bytes_sent']\
  \ = 0\n    l['logline'] = logline\n    return l\n\ndef list_files(request):\n  \
  \  file_list = [f for f in os.listdir(log_dir) if\n        os.path.isfile(os.path.join(log_dir,\
  \ f))]\n    return render_to_response('list_files.html', {'file_list': file_list})\n\
  \ndef view_log(request, sortmethod, filename):\n    logfile = open(os.path.join(log_dir,\
  \ filename), 'r')\n    loglines = [get_log_dict(l) for l in logfile]\n    logfile.close()\n\
  \    try:\n        loglines.sort(key=operator.itemgetter(sortmethod))\n    except\
  \ KeyError:\n        pass\n    return render_to_response('view_logfile.html', {'loglines':\
  \ loglines,\n        'filename': filename})\n```\n\n\n\n\n### 视图函数 (View Functions)\n\
  \n`list_files()` 函数列出 `log_dir` 指定目录下的所有文件，并将该列表传递给 `list_files.html` 模板。`list_files()`\
  \ 执行的操作实际上只有这些。可以通过更改 `log_dir` 的值来配置此函数。另一种配置方法方法是以某种方式将日志目录放入数据库。如果我们把日志目录的值放在数据库中，就可以无需重启应用程序即可更改该值。\n\
  \n### `view_log()` 函数\n`view_log()` 函数接受排序方法和日志文件名作为参数。这两个参数都是通过 `urls.py` 文件中的正则表达式从\
  \ URL 中提取的。我们在 `urls.py` 中为排序方法和文件名定义了正则表达式组名，但并非必须这样做。参数从 URL 传递到视图函数的顺序与它们在各自组中出现的顺序相同。不过，良好的做法是在\
  \ URL 正则表达式中使用命名组（named groups），这样你就可以轻松识别从 URL 中提取取了哪些参数，以及该 URL 应该长什么样。\n\n`view_log()`\
  \ 函数打开从 URL 获取的文件名。然后，它使用之前示例中的 Apache 日志解析库将每行日志转换为格式为 `status`、`remote host`、`bytes_sent`\
  \ 和日志行本身的元组。接着，`view_log()` 根据从 URL 传递的排序方法对元组列表进行排序。最后，`view_log()` 将此列表传递给 `view_logfile.html`\
  \ 模板进行格式化。\n\n### 模板 (Templates)\n剩下的就是创建我们让视图函数渲染的模板。在 Django 中，模板可以继承其他模板，从而提高代码复用性，并使页面之间外观的统一变得简单。我们将构建的第一个模板是另外两个模板继承的模板。这个模板将为应用程序中的另外两个模板设置共同的外。这就是我们从它开始的原因。这是\
  \ `base.html`。参见示例 11-9。\n\n示例 11-9. Django 基础模板 (base.html)\n\n```html\n<html>\n\
  \  <head>\n      <title>{% block title %}Apache Logviewer - File Listing{% endblock\
  \ %}</title>\n  </head>\n  <body>\n      <div><a href=\"/\">Log Directory</a></div>\n\
  \      {% block content %}Empty Content Block{% endblock %}\n  </body>\n</html>\n\
  ```\n\n这是一个非常简单的基础模板。它可能是你能获得的最简单的 HTML 页面。唯一感兴趣的项目是两个“block”（块）部分：“content”和“title”。当你在父模板中定义一个“block”部分时，子模板可以使用自己的内容覆盖父块。这允许你为页面的部分设置默认内容，并允许子模板覆盖该默认值。“title”块允许子页面设置一个值，该值将显示在页面的\
  \ `title` 标签中。“content”块是更新页面“主”部分的通用惯例，同时允许页面的其他部分保持不变。\n\n示例 11-10 是一个简单列出指定目录中文件的模板。\n\
  \n示例 11-10. Django 文件列表模板 (list_files.html)\n\n```html\n{% extends \"base.html\"\
  \ %}\n{% block title %}Apache Logviewer - File Listing{% endblock %}\n{% block content\
  \ %}\n<ul>\n{% for f in file_list %}\n  <li><a href=\"/viewlog/linesort/{{ f }/\"\
  \ \">{{ f }}</a></li>\n{% endfor %}\n</ul>\n{% endblock %}\n```\n\n图 11-4 显示了文件列表页面的样子。\n\
  \n![Apache log listing](img/00013.jpg)\n\n图 11-4. Apache 日志列表\n\n在这个模板中，我们声明我们正在扩展“base.html”。这允许我们获取“base.html”中定义的所有内容，并将代码插入到任何定义的代码块中并覆盖它们的行为。我们在“title”和“content”块中正是这样做的。在“content”块中，我们遍历了传递到模板的变量\
  \ `file_list`。对于 `file_list` 中的每一项，我们创建一个链接，点击后将打开并解析日志文件。\n\n示例 11-11 中的模板负责创建上一个示例\
  \ 11-10 中链接引导用户到的页面。它显示指定日志文件的详情。\n\n示例 11-11. Django 文件列表模板 (view_log.html)\n\n\
  ```html\n{% extends \"base.html\" %}\n{% block title %}Apache Logviewer - File Viewer{%\
  \ endblock %}\n{% block content %}\n<table border=\"1\">\n  <td><a href=\"/viewlog/status/{{\
  \ filename }}/\">Status</a></td>\n  <td><a href=\"/viewlog/remote_host/{{ filename\
  \ }}/\">Remote Host</a></td>\n  <td><a href=\"/viewlog/bytes_sent/{{ filename }}/\"\
  >Bytes Sent</a></td>\n  <td><a href=\"/viewlog/linesort/{{ filename }}/\">Line</a></td>\n\
  </tr>\n{% for l in loglines %}\n  <tr>\n    <td>{{ l.status }}</td>\n    <td>{{\
  \ l.remote_host }}</td>\n    <td>{{ l.bytes_sent }}</td>\n    <td><pre>{{ l.logline\
  \ }}</pre></td>\n  </tr>\n{% endfor %}\n</table>\n{% endblock %}\n```\n\n\n\n\n\
  我们提到过，之前的 Django 示例与常规 Django 应用的不同之处在于它没有使用数据库。虽然接下来的示例将更符合人们使用 Django 的方式，但侧重点会有所不同。当人们构建连接数据库的\
  \ Django 应用程序时，通常会编写模板来显示数据库中的数据，并编写表单来验证和处理用户输入。本示例将展示如何使用 Django 的对象关系映射（ORM）创建数据库模型，以及如何编写模板和视图来显示这些数据，但数据输入将依赖\
  \ Django 内置的管理员（admin）界面。采用这种方法的目的是向你展示如何快速、方便地搭建一个数据库，并配备一个可用的前端来输入和维护数据。\n\n我们将一起创建的应用程序是一个计算机系统的库存管理程序。具体来说，该应用程序旨在允许你向数据库中添加计算机，并包含计算机描述、关联\
  \ IP 地址、说明正在运行的服务、列出构成服务器的硬件等。\n\n我们将遵循与之前的 Django 示例相同的步骤来创建这个 Django 项目和应用。以下是使用\
  \ `django-admin` 命令行工具创建项目和应用的命令：\n\n```\njmjones@dinkbuntu:~/code$ django-admin\
  \ startproject sysmanage\njmjones@dinkbuntu:~/code$ cd sysmanage\njmjones@dinkbuntu:~/code/sysmanage$\
  \ django-admin startapp inventory\njmjones@dinkbuntu:~/code/sysmanage$\n```\n\n\
  这创建了与基于 Django 的 Apache 日志查看器相同的目录结构。以下是所创建目录和文件的树视图：\n\n```bash\njmjones@dinkbuntu:~/code/sysmanage$\
  \ cd ../\njmjones@dinkbuntu:~/code$ tree sysmanage/\nsysmanage/\n|-- __init__.py\n\
  |-- inventory\n|   ├── __init__.py\n|   ├── models.py\n|   └── views.py\n|-- manage.py\n\
  |-- settings.py\n|-- urls.py\n```\n\n创建项目和应用后，我们需要配置想要连接的数据库。SQLite 是一个很好的选择，特别是当你正在测试或开发应用而不是将其到生产环境时。如果有很多人访问该应用程序，我们会建议考虑更健壮的数据库，例如\
  \ PostgreSQL。为了配置应用程序使用 SQLite 数据库，我们需要更改项目主目录下 `settings.py` 文件中的几行。以下是用于配置数据库的行：\n\
  \n```\nDATABASE_ENGINE = 'sqlite3'\nDATABASE_NAME = os.path.join(os.path.dirname(__file__),\
  \ 'dev.db')\n```\n\n我们将 `sqlite3` 设置为数据库引擎。配置数据库位置的行（`DATABASE_NAME` 选项有一点值得注意：我们没有指定数据库文件的绝对路径，而是配置数据库使其始终与\
  \ `settings.py` 文件处于同一目录。`__file__` 包含了 `settings.py` 文件的绝对路径。调用 `os.path.dirname(__file__)`\
  \ 让我们得到 `settings.py` 所在的目录。将文件所在的目录和我们要创建的数据库文件名传递给 `os.path.join()`，将得到数据库文件的绝对路径，该路径对于应用程序位于不同目录的情况依然有效。这是一个非常实用的惯用法，建议在编写配置文件时养成使用的习惯。\n\
  \n除了配置数据库外，我们还需要将 Django admin 界面和我们的库存应用包含在该项目的应用列表中。以下是 `settings.py` 文件的相关部分：\n\
  \n```\nINSTALLED_APPS = (\n    'django.contrib.admin',\n    'django.contrib.auth',\n\
  \    'django.contrib.contenttypes',\n    'django.contrib.sessions',\n    'django.contrib.sites',\n\
  \    'sysmanage.inventory',\n)\n```\n\n我们将 `django.contrib.admin` 和 `sysmanage.inventory`\
  \ 添加到已安装列表中。这意味着当我们告诉 Django 为我们创建数据库时，它将为所有包含的项目创建表。\n\n接下来，我们将更改 URL 映射，以便此项目包含\
  \ admin 界面。以下是 URL 配置文件中的相关行：\n\n```python\n# Uncomment this for admin:\n(r'^admin/',\
  \ include('django.contrib.admin.urls')),\n```\n\n创建 `urls.py` 的工具生成时包含了一行包含 admin\
  \ 界面的代码，但该行被注释了。你可以我们只需删掉行开头的 `#` 字符即可包含 admin URL 配置。\n\n现在我们配置了数据库，添加了 admin 和库存应用，并在\
  \ URL 配置中加入了 admin 界面，可以开始定义数据库架构了。在 Django 中，每个应用都有自己的架构定义。在每个应用目录（在本例中为 \"inventory\"\
  ）下，有一个名为 `models.py` 的文件，其中包含了应用程序将使用的表和列的定义。通过 Django 以及许多其他依赖 ORM 的 Web 框架，可以在编写任何\
  \ SQL 语句的情况下创建并使用表。例如，以下是定义表的代码：\n\n```python\nclass HardwareComponent(models.Model):\n\
  \    manufacturer = models.CharField(max_length=50)\n    type = models.CharField(max_length=50)\n\
  \    model = models.CharField(max_length=50, blank=True, null=True)\n    vendor_part_number\
  \ = models.CharField(max_length=50, blank=True, null=True)\n    description = models.TextField(blank=True,\
  \ null=True)\n```\n\n注意 `HardwareComponent` 类继承自 `Model`。这意味着 `HardwareComponent`\
  \ 类是 `Model` 类型，并会有相应的行为。我们为硬件组件赋予了多个属性：`manufacturer`、`type`、`model`、`vendor_part_number`\
  \ 和 `description`。这些属性都来自 Django。\n\n`inventory` 应用中的此类定义将创建一个名为 `inventory_hardwarecomponent`\
  \ 表，包含六列：id, manufacturer, type, model, vendor_part_number 和 description。这在很大程度上与\
  \ ORM 的类定义相对应。当你定义一个模型类时，Django 会创建一个相应的表，其名称为应用名称（小写），后接下划线，然后是小写的类名。此外，如果没有另有指定，Django\
  \ 将在你的表上创建一个 `id` 列作为主键。以下是与 `HardwareComponent` 模型对应的 SQL 表代码：\n\n```sql\nCREATE\
  \ TABLE \"inventory_hardwarecomponent\" (\n    \"id\" integer NOT NULL PRIMARY KEY,\n\
  \    \"manufacturer\" varchar(50) NOT NULL,\n    \"type\" varchar(50) NOT NULL,\n\
  \    \"model\" varchar(50) NULL,\n    \"vendor_part_number\" varchar(50) NULL,\n\
  \    \"description\" text NULL\n)\n```\n\n如果你想查看 Django 用于创建数据库的 SQL 语句，只需在项目目录下运行\
  \ `python manage.py sql myapp` 即可，其中 `myapp` 对应你的应用名称。\n\n现在你已经接触了 Django 的 ORM，我们将一起为系统库存管理应用创建数据库模型。示例\
  \ 11-12 是库存应用的 `models.py`。\n\n示例 11-12. 数据库布局 (models.py)\n\n```python\nfrom django.db\
  \ import models\n\n# 在此处创建你的模型。\n\nclass OperatingSystem(models.Model):\n    pass\n\
  ```\n\n\n\n```python\nclass Service(models.Model):\n    name = models.CharField(max_length=50)\n\
  \    description = models.TextField(blank=True, null=True)\n    def __str__(self):\n\
  \        return self.name\n    class Admin:\n        pass\n\nclass HardwareComponent(models.Model):\n\
  \    manufacturer = models.CharField(max_length=50)\n    #types include video card,\
  \ network card...\n    type = models.CharField(max_length=50)\n    model = models.CharField(max_length=50,\
  \ blank=True, null=True)\n    vendor_part_number = models.CharField(max_length=50,\
  \ blank=True, null=True)\n    description = models.TextField(blank=True, null=True)\n\
  \    def __str__(self):\n        return self.manufacturer\n    class Admin:\n  \
  \      pass\n\nclass Server(models.Model):\n    name = models.CharField(max_length=50)\n\
  \    description = models.TextField(blank=True, null=True)\n    os = models.ForeignKey(OperatingSystem)\n\
  \    services = models.ManyToManyField(Service)\n    hardware_component = models.ManyToManyField(HardwareComponent)\n\
  \    def __str__(self):\n        return self.name\n    class Admin:\n        pass\n\
  \nclass IPAddress(models.Model):\n    address = models.TextField(blank=True, null=True)\n\
  \    server = models.ForeignKey(Server)\n    def __str__(self):\n        return\
  \ self.address\n    class Admin:\n        pass\n```\n\n我们为模型定义了五个类：`OperatingSystem`、`Service`、`HardwareComponent`、`Server`\
  \ 和 `IPAddress`。`OperatingSystem` 类允许我们根据需要为正在进行盘点的服务器定义不同的操作系统。我们为该类定义了 `name`\
  \ 和 `description` 属性，这正是我们真正需要的。更好的做法是创建一个 `OperatingSystemVendor` 类并从 `OperatingSystem`\
  \ 类链接到它，但为了简单和易于解释，我们省掉了供应商关系。每台服务器都将有一个操作系统。我们将在处理 `Server` 类时向你展示这种关系。\n\n`Service`\
  \ 类允许我们列出所有可以在服务器上运行的潜在服务。例如 Apache Web 服务器、Postfix 邮件服务器、Bind DNS 服务器和 OpenSSH\
  \ 服务器。与 `OperatingSystem` 类一样，该类包含 `name` 和 `description` 属性。每台服务器可能有许多服务。我们将在 `Server`\
  \ 类中向你展示这些类之间是如何相互相关的。\n\n`HardwareComponent` 类表示我们的服务器可能包含的所有硬件组件列表。只有在你向供应商提供的系统上添加了硬件，或者你从单个组件构建了自己的服务器时，这个类才有意义。我们为\
  \ `HardwareComponent` 定义了五个属性：`manufacturer`、`type`、`model`、`vendor_part_number`\
  \ 和 `description`。与 `OperatingSystem` 的供应商一样，我们本可以为硬件制造商和类型创建其他类并建立它们的关系。但再次，为了简单起见，我们选择不创建这些关系。\n\
  \n`Server` 类是这个清单系统的核心。每个 `Server` 都是我们正在跟踪的单台服务器。`Server` 是我们通过建立与之前三个类的关系来将一切结合在一起的地方。首先，我们为每个\
  \ `Server` 定义了 `name` 和 `description` 属性。这些属性与给其他类定义的属性相同。为了链接到其他类，我们必须指定 `Server`\
  \ 与它们之间的什么种关系。每台 `Server` 将只有一个操作系统，因此我们创建了到 `OperatingSystem` 的外键关系。随着虚拟化越来越普及，这种关系的意义将变得不大，但目前它是可以接受的。\n\
  \n`IPAddress` 类表示与服务器关联的 IP 地址。每个地址都通过外键链接到 `Server`。\n\n### 数据库设置\n\n要设置数据库并创建超级用户，请运行以下命令：\n\
  \n```bash\npython manage.py makemigrations\npython manage.py migrate\npython manage.py\
  \ createsuperuser\n```\n\n### 运行开发服务器\n\n一旦了数据库，你就可以启动 Django 开发服务器以访问内置的管理界面：\n\
  \n```bash\npython manage.py runserver 0.0.0.0:8080\n```\n\n管理界面可以通过 `http://0.0.0.0:8080/admin/`\
  \ 访问。它提供了一种强大的方法，通过 Web 界面管理你的服务器、硬件组件和其他模型。\n\n\n\n\n\n例如，如果我们想在一个页面中包含所有类型的操作系统、硬件组件、服务等，我们可以做到。如果我们希望能够点击这些单独项目中的每一个，并显示一个只包含具有这些特定特征的服务器的页面，我们也可以这样做。如果我们希望能够点击列表中的每台服务器，并显示关于该服务器的详细信息，我们同样可以做到。实际上，让我们这样做吧。我们将使用这些“建议”作为此应用程序将遵循的需求。\n\
  \n![Django admin 主页](img/00017.jpg)\n图 11-8. Django admin 主页\n\n### URL 映射\n\n首先，示例\
  \ 11-13 是一个更新后的 `urls.py`。\n\n示例 11-13. URL 映射 (urls.py)\n\n```python\nfrom django.conf.urls.defaults\
  \ import *\n\nurlpatterns = patterns('',\n    # Example:\n    # (r'^sysmanage/',\
