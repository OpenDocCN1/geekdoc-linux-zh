  \ valign=\"top\">\n<tr><td>card</td><td>192.168.1.2</td><td>mail server</td></tr>\n\
  <tr><td>vinge</td><td>192.168.1.4</td><td>web server</td></tr>\n<tr><td>asimov</td><td>192.168.1.8</td><td>database\
  \ server</td></tr>\n<tr><td>stephenson</td><td>192.168.1.16</td><td>file server</td></tr>\n\
  <tr><td>gibson</td><td>192.168.1.32</td><td>print server</td></tr>\n</tbody>\n</table>\n\
  </div>\n```\n\n另一种出色的纯文本标记格式选择是 Textile。根据其网站显示，“Textile 获取带有简单标记的纯文本并生成有效的 XHTML。它被用于\
  \ Web 应用程序、内容管理系统、博客软件和在线论坛。”所以，如果 Textile 是一种标记语言，为什么我们要在本关于 Python 的书里写它呢？原因是存在一个\
  \ Python 库，允许你处理 Textile 标记并将其转换为 XHTML。你可以编写命令行工具来调用该 Python 库，转换 Textile 文件并将输出重定向到\
  \ XHTML 文件。或者，你可以在某些脚本内部调用 Textile 转换模块，并程序化处理返回的 XHTML。无论如何，Textile 标记和 Textile\
  \ 处理模块都对你的文档需求大有裨益。\n\n你可以通过 `easy_install textile` 安装 Textile Python 模块。或者，如果系统包含了它，你可以使用系统的软件包管理器进行安装。对于\
  \ Ubuntu，包名为 `python-textile`，你可以通过 `apt-get install python-textile` 安装。一旦安装了 Textile，你就可以开始使用它：通过导入它、创建一个对象并程序化处理返回的\
  \ XHTML。\n\n```python\nIn [1]: import textile\nIn [2]: t = textile.Textiler('item\
  \ one\n   ...: item two\n   ...: item three')\nIn [3]: print t.process()\n<ul>\n\
  <li>item one</li>\n<li>item two</li>\n<li>item three</li>\n</ul>\n```\n\n我们可以通过以下方式使用\
  \ Textile 生成列表。这里有很多资源可以参考，例如，http://hobix.com/textile/ 提供了关于 Textile 的良好教程：\n\n\
  ```python\nIn [1]: import textile\nIn [2]: t = textile.Textiler('item one\n   ...:\
  \ item two\n   ...: item three')\nIn [3]: print t.process()\n<ul>\n<li>item one</li>\n\
  <li>item two</li>\n<li>item three</li>\n</ul>\n```\n\n我们可以通过以下方式使用 Textile 生成表格：\n\
  \n```python\nIn [1]: import textile\nIn [2]: server_list = '''Server Name    IP\
  \ Address    Function\n   ...: card            192.168.1.2   mail server\n   ...:\
  \ vinge           192.168.1.4   web server\n   ...: asimov          192.168.1.8\
  \   database server\n   ...: stephenson      192.168.1.16  file server\n   ...:\
  \ gibson          192.168.1.32  print server'''\nIn [3]: t = textile.Textiler(server_list)\n\
  In [4]: print t.process()\n<table>\n<tr><th>Server Name</th><th>IP Address</th><th>Function</th></tr>\n\
  <tr><td>card</td><td>192.168.1.2</td><td>mail server</td></tr>\n<tr><td>vinge</td><td>192.168.1.4</td><td>web\
  \ server</td></tr>\n<tr><td>asimov</td><td>192.168.1.8</td><td>database server</td></tr>\n\
  <tr><td>stephenson</td><td>192.168.1.16</td><td>file server</td></tr>\n<tr><td>gibson</td><td>192.168.1.32</td><td>print\
  \ server</td></tr>\n</table>\n```\n\n所以你可以看到 ReST 和 Textile 都能有效地将纯文本数据集成到 Python\
  \ 脚本中。如果你有诸如服务器列表和联系人列表需要转换为 HTML 并执行某些操作（例如将 HTML 发送给邮件列表或 FTP 到某些服务器），那么 `docutils`\
  \ 或 `Textile` 库都是非常有用的工具。\n\n# 信息格式化\n\n将信息传递给观众的下一步是将数据格式化为易读易理解的媒介。我们认为这种媒介至少应该是用户可以理解的，最好是具有吸引力的。从技术上讲，ReST\
  \ 和 Textile 包含了信息共享的数据收集和格式化步骤，但下面的示例将专门专注于将已收集的数据转换为更具展示性的媒介。\n\n## 图形图像\n\n以下两个示例将继续解析\
  \ Apache 日志文件以获取客户端 IP 地址和传输字节数。在上一节中，我们的示例生成了一个 shelve 文件，其中包含我们要与其他用户共享的信息。现在，我们将从\
  \ shelve 文件创建一个图表对象，使数据变得易读：\n\n```python\n#!/usr/bin/env python\nimport gdchart\n\
  import shelve\nshelve_file = shelve.open('access.s')\nitems_list = [(i[1], i[0])\
  \ for i in shelve_file.items()]\nitems_list.sort()\nbytes_sent = [i[0] for i in\
  \ items_list]\n#ip_addresses = [i[1] for i in items_list]\nip_addresses = ['XXX.XXX.XXX.XXX'\
  \ for i in items_list]\nchart = gdchart.Bar()\nchart.width = 400\nchart.height =\
  \ 400\nchart.bg_color = 'white'\nchart.plot_color = 'black'\nchart.xtitle = \"IP\
  \ Address\"\nchart.ytitle = \"Bytes Sent\"\nchart.title = \"Usage By IP Address\"\
  \nchart.setData(bytes_sent)\nchart.setLabels(ip_addresses)\nchart.draw(\"bytes_ip_bar.png\"\
  )\nshelve_file.close()\n```\n\n\n\n在本示例中，我们导入了两个模块：`gdchart` 和 `shelve`。然后我们打开了在上一个示例中创建的\
  \ `shelve` 文件。由于 `shelve` 对象与内置的 `dictionary` 对象共享相同的接口，我们能够对它调用 `items()` 方法。`items()`\
  \ 返回一个元组列表，其中元组的第一个元素是字典键，第二个元素是该键对应的值。我们可以使用 `items()` 方法来对数据进行排序，以便在绘图时使结果更具意义。我们使用列表推导式反转了之前元组的顺序。现在不再是\
  \ `(ip_address, bytes_sent)` 元组，而是 `(bytes_sent, ip_addresses)`。然后我们对该列表进行排序，由于\
  \ `bytes_sent` 元素在第一，`list.sort()` 方法将首先按该字段进行排序。接着我们再次使用列表推导式提取 `bytes_sent` 和\
  \ `ip_addresses` 字段。你可能会注意到，我们为 IP 地址插入了混淆的 `XXX.XXX.XXX.XXX`，因为这些日志文件是从生产 Web 服务器获取的。\n\
  \n在处理好用于填充图表的数据后，我们实际上可以开始使用 `gdchart` 来制作数据的图形化表示。我们首先创建一个 `gdchart.Bar` 对象。这只是一个图表对象，我们将为其设置一些属性，然后将其渲染为\
  \ PNG 文件。接着定义了图表的尺寸（以像素为单位）；分配了颜色用于背景和前景；并创建了标题。我们为图表设置了数据和标签，这两者都提取自 Apache 日志解析模块。最后，我们\
  \ `draw()` 将图表绘制到文件中，然后关闭我们的 `shelve` 对象。图 4-1 显示了该图表图像。\n\n![每个 IP 地址请求字节数的柱状图](img/00005.jpg)\n\
  \n图 4-1。每个 IP 地址请求字节数的柱状图\n\n这是另一个用于可视化格式化 shelve 数据的脚本示例，但这次程序创建的不是柱状图，而是饼图：\n\n\
  ```python\n#!/usr/bin/env python\nimport gdchart\nimport shelve\nimport itertools\n\
  \nshelve_file = shelve.open('access.s')\nitems_list = [(i[1], i[0]) for i in shelve_file.items()\
  \ if i[1] > 0]\nitems_list.sort()\nbytes_sent = [i[0] for i in items_list]\n#ip_addresses\
  \ = [i[1] for i in items_list]\nip_addresses = ['XXX.XXX.XXX.XXX' for i in items_list]\n\
  chart = gdchart.Pie()\nchart.width = 800\nchart.height = 800\nchart.bg_color = 'white'\n\
  color_cycle = itertools.cycle([0xDDDDDD, 0x111111, 0x777777])\ncolor_list = []\n\
  for i in bytes_sent:\n    color_list.append(color_cycle.next())\nchart.color = color_list\n\
  chart.plot_color = 'black'\nchart.title = \"Usage By IP Address\"\nchart.setData(*bytes_sent)\n\
  chart.setLabels(ip_addresses)\nchart.draw(\"bytes_ip_pie.png\")\nshelve_file.close()\n\
  ```\n\n此脚本与柱状图示例几乎相同，但我们确实需要进行几处变动。首先，此脚本创建的是 `gdchart.Pie` 实例而不是 `gdchart.Bar`。其次，我们为单个数据点设置了颜色，而不是对所有点都使用黑色。由于这是饼图，如果所有数据块都是黑色将导致图表无法阅读，因此我们决定在三种灰色之间交替使用。通过使用\
  \ `itertools` 模块中的 `cycle()` 函数，我们可以在这三个选项之间切换。我们建议查看一下 `itertools` 模块，里面有很多帮助你处理可迭代对象（如列表）的有趣函数。图\
  \ 4-2 是我们饼图脚本的结果。\n\n![每个 IP 地址请求字节数的饼图](img/00006.jpg)\n\n图 4-2。每个 IP 地址请求字节数的饼图\n\
  \n饼图唯一真正的问题是，（混淆的）IP 地址在传输字节的低端混合在一起了。柱状图和饼图都让 shelve 文件中的数据变得易读得多，而且创建每个图表简单得令人惊讶。而填充信息更是简单得惊人。\n\
  \n## PDFs\n\n格式化来自数据文件信息的另一种方法将其保存为 PDF 文件。PDF 已经成为主流，我们几乎预期所有文档都能转换为 PDF。作为系统管理员，了解如何生成易读的\
  \ PDF 文档可以让你的生活变得更轻松。读完本节后，你应该能够运用你的知识来创建网络利用率、用户账户等的 PDF 报告。我们还将描述如何使用 Python 在多部分\
  \ MIME 邮件中自动嵌入 PDF。\n\nPDF 库中的“大猩猩”是 ReportLab。该软件有免费版本和商业版本。[ReportLab 官方文档](http://www.reportlab.com/docs/userguide.pdf)\
  \ 中的 [ReportLab 用户指南](http://www.reportlab.com/docs/userguide.pdf) 提供了丰富的资源。除了阅读本节，我们强烈建议你阅读\
  \ ReportLab 的官方文档，包含了许多可以参考的示例。图 4-3 是使用 ReportLab 创建的“Hello World”示例。\n\n图 4-3。“Hello\
  \ World” PDF\n\n```python\n#!/usr/bin/env python\nfrom reportlab.pdfgen import canvas\n\
  def hello():\n    c = Canvas(\"helloworld.pdf\")\n    c.drawString(100,100,\"Hello\
  \ World\")\n    c.showPage()\n    c.save()\nhello()\n```\n\n关于我们的“Hello World”创建，你应该注意以下几点：首先，我们创建一个\
  \ canvas 对象。接着，我们使用 `drawString()` 方法实现向文件写入 `file_obj.write()`。最后，`showPage()`\
  \ 停止绘制， `save()` 真正创建 PDF。如果你运行这段代码，将得到一个底部带有“Hello World”字样的空白页。如果你下载了 ReportLab\
  \ 的源码包，可以使用它们包含的测试作为驱动文档。也就是说，当你运行测试时，它们会为你生成一组 PDF，你可以对比测试代码和 PDF，查看如何使用 ReportLab\
  \ 实现视觉效果。在 Ubuntu 上安装 ReportLab，只需执行 `apt-get install python-reportlab`。如果你不是 Ubuntu\
  \ 用户，请根据你的操作系统寻找相应的包。现在你已经了解了如何使用 ReportLab 创建 PDF，让我们看看如何使用 ReportLab 创建自定义的磁盘使用报告。创建一个自定义的磁盘使用报告可能有用。参见\
  \ 示例 4-4。\n\n图 4-4。磁盘报告 PDF\n\n```python\n#!/usr/bin/env python\nimport subprocess\n\
  import datetime\nfrom reportlab.pdfgen import canvas\nfrom reportlab.lib.units import\
  \ inch\n\ndef disk_report():\n    p = subprocess.Popen(\"df -h\", shell=True, stdout=subprocess.PIPE)\n\
  \    return p.stdout.readlines()\n\ndef create_pdf(input,output=\"disk_report.pdf\"\
  ):\n    now = datetime.datetime.today()\n    date = now.strftime(\"%h %d %Y %H:%M:%S\"\
  )\n    c = canvas.Canvas(output)\n    textobject = c.beginText()\n    textobject.setTextOrigin(inch,11*inch)\n\
  \    textobject.textLines('''\n    Disk Capacity Report: %s\n    ''' % date)\n \
  \   for line in input:\n        textobject.textLine(line.strip())\n    c.drawText(textobject)\n\
  \    c.showPage()\n    c.save()\n\nreport = disk_report()\ncreate_pdf(report)\n\
  ```\n\n\n\n\n这段代码将生成一份报告，显示当前的磁盘使用情况，并带有日期和“磁盘容量报告”字样。对于仅仅几行代码来说，这非常令人印象深刻。让我们来看看这个示例的一些亮点。首先是\
  \ `disk_report()` 函数，它简单地获取了 `df -h` 的输出并将其作为列表返回。接下来在 `create_pdf()` 函数中，让我们创建一个格式化的日期。这个示例最重要的部分是\
  \ `textobject`。\n\n`textobject` 函数用于创建你将放置在 PDF 中的对象。我们通过调用 `beginText()` 创建 `textobject`。然后，我们定义了数据如何填充到页面上。我们的\
  \ PDF 类似于 8.5×11 英寸的文档，因此为了将文本放在页面顶部，我们告诉文本对象将文本起点设置为 11 英寸处。之后，我们通过向文本对象写入字符串创建了标题，最后通过遍历来自\
  \ `df` 命令的行列表来完成。。注意我们使用了 `line.strip()` 来移除换行符。如果不这样做，我们会在换行符所在看到成块的黑色方块。\n\n你可以通过添加颜色和图片创建更复杂的\
  \ PDF，但你可以通过阅读与 ReportLab PDF 库相关的优秀用户指南来解决这个问题。这些示例的核心要点是：文本是承载最终被渲染出的数据的核心对象。\n\
  \n# 信息分发\n\n在你收集并格式化数据之后，你需要将它们发送给感兴趣的人们。在本章中，我们将主要关注如何通过电子邮件将文档发送给接收者的方法。如果你需要将某些文档发布到\
  \ Web 服务器供用户查看，可以使用 FTP。我们将在下一节讨论使用 Python 标准中的 FTP 模块。\n\n## 发送电子邮件\n\n处理电子邮件是系统管理员工作的重要部分。我们不仅要管理邮件服务器，而且经常需要通过电子邮件生成警告消息和警报的方法。Python\
  \ 标准库对发送邮件有极佳的支持，但关于它的描述非常少。由于所有系统管理员都应该为精心制作的自动化电子邮件感到自豪，本节将向你如何使用 Python 执行各种邮件任务。\n\
  \n### 发送基础消息\n\nPython 中有两个不同的包允许你发送电子邮件。其中一个低级包 `smtplib` 是一个对应 SMTP 协议各种 RFC 的接口，它负责发送邮件。另一个包\
  \ `email` 则协助解析和生成邮件。示例 4-5 使用 `smtplib` 构建一个代表邮件消息正文的字符串，然后使用 `email` 包将其发送到邮件服务器。\n\
  \n示例 4-5. 使用 SMTP 发送消息\n\n```python\n#!/usr/bin/env python\nimport smtplib\nmail_server\
  \ = 'localhost'\nmail_server_port = 25\nfrom_addr = 'sender@example.com'\nto_addr\
  \ = 'receiver@example.com'\nfrom_header = 'From: %s\\r\\n' % from_addr\nto_header\
  \ = 'To: %s\\r\\n\\r\\n' % to_addr\nsubject_header = 'Subject: nothing interesting'\n\
  body = 'This is a not-very-interesting email.'\nemail_message = '%s\\n%s\\n%s\\\
  n\\n%s' % (from_header, to_header, subject_header, body)\ns = smtplib.SMTP(mail_server,\
  \ mail_server_port)\ns.sendmail(from_addr, to_addr, email_message)\ns.quit()\n```\n\
  \n基本上，我们定义了邮件服务器的主机和端口，以及“收件人”和“发件人”地址。然后通过将头部部分与邮件正文部分拼接构建邮件消息。最后，我们连接到 SMTP 服务器并将其发送到\
  \ `to_addr` 并来自 `from_addr`。我们还应该注意，我们专门使用 `\\r\\n` 格式化 `From:` 和 `To:` 以符合 RFC\
  \ 规范。\n\n参见第 10 章，特别是调度 Python 进程部分，以获取使用 Python 创建发送邮件的 cron 任务的代码示例。现在，让我们从这个基础示例转向\
  \ Python 在邮件方面可以的一些趣味功能。\n\n### 使用 SMTP 身份验证\n\n我们的上一个示例非常简单，因为从 Python 发送邮件很容易，但遗憾的是，许多\
  \ SMTP 服务器会强制你使用身份验证，因此在很多情况下它将无法工作。示例 4-6 是包含 SMTP 身份验证的示例。\n\n示例 4-6. SMTP 身份验证\n\
  \n```python\n#!/usr/bin/env python\nimport smtplib\nmail_server = 'smtp.example.com'\n\
  mail_server_port = 465\nfrom_addr = 'foo@example.com'\nto_addr = 'bar@example.com'\n\
  from_header = 'From: %s\\r\\n' % from_addr\nto_header = 'To: %s\\r\\n\\r\\n' % to_addr\n\
  subject_header = 'Subject: nothing interesting'\nbody = 'This is a not-very-interesting\
  \ email.'\nemail_message = '%s\\n%s\\n%s\\n\\n%s' % (from_header, to_header, subject_header,\
  \ body)\ns = smtplib.SMTP(mail_server, mail_server_port)\n```\n\n在这个示例中，我们尝试启动 SSL\
  \ 的服务器并不支持它并向我们抛出。通过编写包含某些错误处理的脚本，可以很容易地解决这个问题许多潜在问题。\n\n### 使用 Python 发送附件\n\n\
  发送纯文本邮件已经过时了。使用 Python 我们可以使用 MIME 标准发送消息，这允许我们在输出消息中编码附件。在本章的节节中，我们涵盖了 PDF 报告。由于系统管理员缺乏耐心，我们将跳过关于\
  \ MIME 起源的论述，直接进入带附件的邮件。参见示例 4-7。\n\n示例 4-7. 发送 PDF 附件\n\n```python\n#!/usr/bin/env\
  \ python\nimport email\nfrom email.MIMEText import MIMEText\nfrom email.MIMEMultipart\
  \ import MIMEMultipart\nfrom email.MIMEBase import MIMEBase\nfrom email import encoders\n\
  import smtplib\nimport mimetypes\n\nfrom_addr = 'noah.gift@gmail.com'\nto_addr =\
  \ 'jjinux@gmail.com'\nsubject_header = 'Subject: Sending PDF Attachemt'\nattachment\
  \ = 'disk_usage.pdf'\nbody = '''\nThis message sends a PDF attachment created with\
  \ Report\nLab.\n'''\n\nm = MIMEMultipart()\nm[\"To\"] = to_addr\nm[\"From\"] = from_addr\n\
  m[\"Subject\"] = subject_header\n\nm.attach(MIMEText(body))\nfp = open(attachment,\
  \ 'rb')\nmsg = MIMEBase(maintype, subtype)\n```\n\n\n\n\n```python\nmsg.set_payload(fp.read())\n\
  fp.close()\nencoders.encode_base64(msg)\nmsg.add_header(\"Content-Disposition\"\
  , \"attachment\", filename=attachment)\nm.attach(msg)\ns = smtplib.SMTP(\"localhost\"\
  )\ns.set_debuglevel(1)\ns.sendmail(from_addr, to_addr, m.as_string())\ns.quit()\n\
  ```\n\n所以，我们用了一点“魔法”，对之前创建的磁盘报告 PDF 进行了编码并将其发送出去。\n\n## Trac\n\nTrac 是一个 wiki 和问题跟踪系统。它通常用于软件开发，但也可以用于任何你想要使用\
  \ wiki 或工单系统的场景，它是用 Python 编写的。你可以在这里找到最新的 Trac 文档和包：[`trac.edgewall.org/`](http://trac.edgewall.org/)。深入介绍\
  \ Trac 已超出了本书的范围，但它也是处理常规故障工单的极佳工具。Trac 的另一个有趣方面之一是，它可以通过插件进行扩展。\n\n我们最后提到它，因为它确实符合我们一直在讨论的所有三个类别：信息收集、格式化和分发。wiki\
  \ 部分允许用户通过浏览器创建网页。他们放入这些段落中的信息会被渲染成 HTML，供其他用户通过浏览器查看。这就是我们在本章中讨论的内容的完整周期。\n\n同样，工单跟踪系统允许用户提交工作请求或报告他们遇到的问题。你可以对\
  \ Web 界面提交的工单进行报告，甚至可以生成 CSV 报告。再次，Trac 涵盖了本章中讨论的完整周期。\n\n我们建议你探索一下 Trac，看看它是否满足你的需求。你可能需要功能更强大的工具，也可能想要更简单的工具，但进一步了解它它是值得的。\n\
  \n### 总结\n\n在本章中，我们查看了以自动化和手动方式收集数据的方法。我们还查看了将这些数据整合成几种不同的、更易于分发的格式，即 HTML、PDF 和\
  \ PNG。最后，我们研究了如何将信息传递给感兴趣的人。正如我们在章开头说的，文档工作可能不是你工作中最光鲜的部分。在你开始时，可能甚至没有意识到自己要报名做文档工作。但清晰、准确的文档是系统管理的关键要素。我们希望本章中的技巧能让有时枯燥的文档工作变得稍微有趣一点。\n\
  \n# 第 5 章 网络\n\n网络通常指的是将多台计算机连接在一起，以便它们之间进行通信。但对于我们的目的来说，我们不太感兴趣让计算机相互通信，而是更感兴趣让进程之间相互通信。进程是在同一台计算机还是不同的计算机上，对于我们将要展示的技术并不重要。\n\
  \n本章将重点关注编写 Python 程序，使用标准的 `socket` 库（以及基于 `socket` 构建的库）连接到其他进程，然后与这些其他进程进行交互。\n\
  \n## 网络客户端\n\n服务器坐在那里等待客户端连接，而客户端则发起连接。Python 标准库包含了许多常用网络客户端的实现。本节将讨论一些常见且频繁实用的客户端。\n\
  \n### socket\n\n`socket` 模块提供了 Python 接口，用于调用你操作系统的 socket 实现。这意味着你可以使用 Python 对\
  \ socket 进行或通过 socket 执行任何可以的操作。如果你以前从未做过任何网络编程，本章确实对网络进行了简要概述。它应该让你对使用 Python 网络库能做哪些事情有一个初步了解。\n\
  \n`socket` 模块提供了工厂函数 `socket()`。`socket()` 函数随后返回一个 `socket` 对象。虽然有许多参数可以传递给 `socket()`\
  \ 以指定创建的 socket 类型，但不带参数调用 `socket()` 工厂函数会返回一个带有默认值的 `socket` 对象——一个 TCP/IP socket：\n\
  \n```python\nIn [1]: import socket\nIn [2]: s = socket.socket()\nIn [3]: s.connect(('192.168.1.15',\
  \ 80))\nIn [4]: s.send(\"GET / HTTP/1.0\\n\\n\")\nOut[4]: 16\nIn [5]: s.recv(200)\n\
  Out[5]: 'HTTP/1.1 200 OK\\r\\n\nDate: Mon, 03 Sep 2007 18:25:45 GMT\\r\\n\nServer:\
  \ Apache/2.0.55 (Ubuntu) DAV/2 PHP/5.1.6\\r\\n\nContent-Length: 691\\r\\n\nConnection:\
  \ close\\r\\n\nContent-Type: text/html; charset=UTF-8\\r\\n\n\\r\\n\n<!DOCTYPE HTML\
  \ P'\nIn [6]: s.close()\n```\n\n此示例通过 `socket()` 工厂函数创建了一个名为 `s` 的 `socket` 对象。然后它连接到本地默认\
  \ Web 服务器（由端口 80 指明，这是 HTTP 的默认端口）。接着，它向服务器发送了文本字符串 `\"GET / HTTP/1.0\\n\\n\"`（这仅仅是一个\
  \ HTTP 请求）。发送后，它接收了服务器响应的前 200 字节，这是一个 `200 OK` 状态消息和 HTTP 头部。最后，我们关闭了连接。\n\n示例中展示的\
  \ `socket` 方法代表了你可能会经常使用的方法。`Connect()` 建立你的 `socket` 对象与远程端之间的通道。`Send()` 从你的 `socket`\
  \ 对象传输数据。`Recv()` 接收远程端发送的任何数据。`close()` 终止两个 socket 之间的通信。这是一个简单的示例，展示了你如何创建 `socket`\
  \ 对象并在上面发送和接收数据。\n\n现在我们来看稍微更有用的示例。假设你有一个运行某种网络应用的服务器，例如 Web 服务器。假设你对监控这个服务器感兴趣，以确保一天之内你可以与它建立\
  \ socket 连接。这种监控是极简的，但它证明了服务器仍在运行，且 Web 服务器仍在某些端口上监听。参见 示例 5-1。\n\n\n\n\n所有的工作都在\
  \ `check_server()` 函数中完成。`check_server()` 创建了一个 `socket` 对象。然后，它尝试连接到指定的地址和端口号。如果成功，它返回\
  \ `True`。如果失败，`socket.connect()` 调用将抛出异常，该异常会被处理，并且函数返回 `False`。代码的 `main` 部分调用了\
  \ `check_server()`。这个“main”部分解析来自用户的参数，并将用户请求的参数放入适当的格式中以传递给 `check_server()`。整个脚本在执行过程中会打印状态消息。最后打印的是\
  \ `check_server()` 的返回值。脚本向 shell 返回 `check_server()` 返回码的相反值。我们返回该返回码的相反值，是为了让这个脚本成为一个实用的可脚本化工具。通常，此类工具在成功时向\
  \ shell 返回 `0`，在失败时返回非 `0` 的其他值（通常是正数）。以下是这段代码成功连接到我们之前连接的 Web 服务器的示例：\n\n```\n\
  jmjones@dinkgutsy:code$ python port_checker_tcp.py -a 192.168.1.15 -p 80\noptions:\
  \ {'port': 80, 'address': '192.168.1.15'}, args: []\nAttempting to connect to 192.168.1.15\
  \ on port 80\nConnected to 192.168.1.15 on port 80\ncheck_server returned True\n\
  ```\n\n最后一行输出包含 `check_server returned True`，意味着连接成功了。\n\n以下是一个失败的连接调用示例：\n\n```\n\
  jmjones@dinkgutsy:code$ python port_checker_tcp.py -a 192.168.1.15 -p 81\noptions:\
  \ {'port': 81, 'address': '192.168.1.15'}, args: []\nAttempting to connect to 192.168.1.15\
  \ on port 81\nConnection to 192.168.1.15 on port 81 failed: (111, 'Connection refused')\n\
  check_server returned False\n```\n\n最后一行日志包含 `check_server returned False`，意味着连接失败。在倒数第二行输出中（包含\
  \ `Connection to 192.168.1.15 on port 81 failed`），我们也看到了原因：`'Connection refused'`。这只是一个猜想，但可能与该特定服务器的\
  \ 81 端口上没有运行的服务有关。\n\n我们创建了三个示例来演示如何在 shell 脚本中使用此工具。首先，我们给出一个 shell 命令来运行脚本，并在脚本成功时打印\
  \ `SUCCESS`。我们使用 `&&` 运算符代替 `if-then` 语句：\n\n```\n$ python port_checker_tcp.py -a\
  \ 192.168.1.15 -p 80 && echo \"SUCCESS\"\noptions: {'port': 80, 'address': '192.168.1.15'},\
  \ args: []\nAttempting to connect to 192.168.1.15 on port 80\nConnected to 192.168.1.15\
  \ on port 80\ncheck_server returned True\nSUCCESS\n```\n\n该脚本成功了，所以在执行并打印状态结果后，shell\
  \ 打印了 `SUCCESS`：\n\n```\n$ python port_checker_tcp.py -a 192.168.1.15 -p 81 && echo\
  \ \"FAILURE\"\noptions: {'port': 81, 'address': '192.168.1.15'}, args: []\nAttempting\
  \ to connect to 192.168.1.15 on port 81\nConnection to 192.168.1.15 on port 81 failed:\
  \ (111, 'Connection refused')\ncheck_server returned False\n```\n\n该脚本失败了，所以它从未打印过\
  \ `FAILURE`：\n\n```\n$ python port_checker_tcp.py -a 192.168.1.15 -p 81 || echo\
  \ \"FAILURE\"\noptions: {'port': 81, 'address': '192.168.1.15'}, args: []\nAttempting\
  \ to connect to 192.168.1.15 on port 81\nConnection to 192.168.1.15 on port 81 failed:\
  \ (111, 'Connection refused')\ncheck_server returned False\nFAILURE\n```\n\n该脚本失败了，但我们将\
  \ `&&` 更改为了 `||`。这意味着如果脚本返回失败，则打印 `FAILURE`。它确实这么做了。Web 服务器允许在 80 端口连接并不意味着有一个可用的\
  \ HTTP 服务器可供连接。可以帮助我们判断 Web 服务器状态的测试是：Web 服务器是否会为某个 URL 生成带有预期状态码的 HTTP 头部。示例 5-2.\
  \ 基于 socket 的 Web 服务器检查器\n\n```python\n#!/usr/bin/env python\nimport socket\nimport\
  \ re\nimport sys\n\ndef check_webserver(address, port, resource):\n    #build up\
  \ HTTP request\n    if not resource.startswith('/'):\n        resource = '/' + resource\n\
  \    request_string = \"GET %s HTTP/1.1\\r\\nHost: %s\\r\\n\\r\\n\" % (resource,\
  \ address)\n    print('HTTP request:')\n    print(request_string)\n    #create a\
  \ socket\n    s = socket.socket()\n    try:\n        #connect to server\n      \
  \  print(\"Attempting to connect to %s on port %s\" % (address, port))\n       \
  \ s.connect((address, port))\n        print(\"Connected to %s on port %s\" % (address,\
  \ port))\n        #send request\n        s.send(request_string)\n        #we should\
  \ only need 100 bytes so\n        rsp = s.recv(100)\n        print('Received 100\
  \ bytes of HTTP response')\n        # connection\n        lines = rsp.splitlines()\n\
  \        print('First line of HTTP response: %s' % lines[0])\n        try:\n   \
  \         #extract status\n            version, status, message = re.split(r'\\\
  s+', lines[0], 2)\n            print('Version: %s, Status: %s, Message: %s' % (version,\
  \ status, message))\n        except ValueError:\n            print('Failed to split\
  \ status')\n            return False\n        if status in ['200', '301']:\n   \
  \         print('Success - status %s' % status)\n            return True\n     \
  \   else:\n            print('Status was %s' % status)\n            return False\n\
  \    except socket.error, e:\n        print(\"Connection to %s on port %s failed:\
  \ %s\" % (address, port, e))\n        return False\n    finally:\n        #be good\
  \ citizen and close your connection\n        print(\"Closing the connection\")\n\
  \        s.close()\n\nif __name__ == '__main__':\n    from optparse import OptionParser\n\
  \    parser = OptionParser()\n    parser.add_option(\"-a\", \"--address\", dest=\"\
  address\", default='localhost', help=\"ADDRESS for webserver\")\n    parser.add_option(\"\
  -p\", \"--port\", dest=\"port\", type=\"int\", default=80, help=\"PORT for webserver\"\
  )\n    parser.add_option(\"-r\", \"--resource\", dest=\"resource\", default='index.html',\
  \ help=\"RESOURCE to check\")\n    (options, args) = parser.parse_args()\n    print('options:\
  \ %s, args: %s' % (options, args))\n    check = check_webserver(options.address,\
  \ options.port, options.resource)\n    print('check_webserver returned %s' % check)\n\
  \    sys.exit(not check)\n```\n\n\n\n\n`'192.168.1.15'}, args: []`\n\n`HTTP request:`\n\
  \n```\n|||GET /apache2-default HTTP/1.1\nHost: 192.168.1.15\n|||\n```\n\n正在连接到 192.168.1.15\
  \ 端口 80\n已连接到 192.168.1.15 端口 80\n接收到 100 字节 HTTP 响应\n```\n|||HTTP/1.1 301 Moved\
  \ Permanently\nDate: Wed, 16 Apr 2008 23:31:24 GMT\nServer: Apache/2.0.55 (Ubuntu)\
  \ |||\n```\n正在关闭连接\nHTTP 响应的第一行：HTTP/1.1 301 Moved Permanently\nVersion: HTTP/1.1,\
  \ Status: 301, Message: Moved Permanently\n成功 - 状态为 301\n`check_webserver returned\
  \ True`\n\n最后四行输出显示，该 Web 服务器上 `/apache2-default` 的 HTTP 状态码为 301，因此这次运行成功。\n\n\
  这是另一次运行。这次，我们故意指定了一个不存在的资源，以展示当 HTTP 调用返回 `False` 时会发生什么：\n\n```bash\n$ python web_server_checker_tcp.py\
  \ -a 192.168.1.15 -p 80 -r foo\n```\n\n`options: {'resource': 'foo', 'port': 80,\
  \ 'address': '192.168.1.15'}, args: []`\n\n`HTTP request:`\n\n```\n|||GET /foo HTTP/1.1\n\
  Host: 192.168.1.15\n|||\n```\n\n正在连接到 192.168.1.15 端口 80\n已连接到 192.168.1.15 端口 80\n\
  接收到 100 字节 HTTP 响应\n```\n|||HTTP/1.1 404 Not Found\nDate: Wed, 16 Apr 2008 23:58:55\
  \ GMT\nServer: Apache/2.0.55 (Ubuntu) DAV/2 PH|||\n```\n正在关闭连接\nHTTP 响应的第一行：HTTP/1.1\
  \ 404 Not Found\nVersion: HTTP/1.1, Status: 404, Message: Not Found\n状态为 404\n`check_webserver\
  \ returned False`\n\n正如上一个示例的最后四行显示运行成功一样，本示例的最后四行显示其运行是失败的。因为该 Web 服务器上没有 `/foo`，所以此检查器返回了\
  \ `False`。\n\n本节展示了如何构建低级工具来连接网络服务器并对其进行基础检查。这些示例的目的是向你介绍客户端和服务器相互通信时背后发生了什么。如果你有机会使用比\
  \ `socket` 模块更别的库来编写网络组件，你应该抓住机会。花时间使用如 `socket` 这样的低级库来编写网络组件并不理想。\n\n#### httplib\n\
  \n上一个示例展示了如何直接使用 `socket` 模块发送 HTTP 请求。本示例将展示如何使用 `httplib` 模块。你什么时候应该考虑使用 `httplib`\
  \ 模块而不是 `socket` 模块？更通俗地说，你什么时候应该考虑使用高级库而不是低级库？一个好的经验法是：机会机会。有时使用低级库是有意义的。例如，你可能需要实现现有库中尚未包含的功能，或者你可能需要对库中已有的功能进行细粒度的控制，或者可能存在性能优势。但在情况下，没有理由不使用\
  \ `httplib` 等高级库来代替 `socket` 等低级库。\n\n`Example 5-3` 使用 `httplib` 模块实现了与上一个示例相同的功能。\n\
  \n示例 5-3. 基于 `httplib` 的 Web 服务器检查器\n\n```python\n#!/usr/bin/env python\nimport\
  \ httplib\nimport sys\n\ndef check_webserver(address, port, resource):\n    #create\
  \ connection\n    if not resource.startswith('/'):\n        resource = '/' + resource\n\
  \    try:\n        conn = httplib.HTTPConnection(address, port)\n        print 'HTTP\
  \ connection created successfully'\n        #make request\n        req = conn.request('GET',\
  \ resource)\n        print 'request for %s successful' % resource\n        #get\
  \ response\n        response = conn.getresponse()\n        print 'response status:\
  \ %s' % response.status\n    except sock.error, e:\n        print 'HTTP connection\
  \ failed: %s' % e\n        return False\n    finally:\n        conn.close()\n  \
  \      print 'HTTP connection closed successfully'\n    if response.status in [200,\
  \ 301]:\n        return True\n    else:\n        return False\n\nif __name__ ==\
  \ '__main__':\n    from optparse import OptionParser\n    parser = OptionParser()\n\
  \    parser.add_option(\"-a\", \"--address\", dest=\"address\", default='localhost',\n\
  \                      help=\"ADDRESS for webserver\", metavar=\"ADDRESS\")\n  \
  \  parser.add_option(\"-p\", \"--port\", dest=\"port\", type=\"int\", default=80,\n\
  \                      help=\"PORT for webserver\", metavar=\"PORT\")\n    parser.add_option(\"\
  -r\", \"--resource\", dest=\"resource\", default='index.html',\n               \
  \       help=\"RESOURCE to check\", metavar=\"RESOURCE\")\n    options, args = parser.parse_args()\n\
  \    check = check_webserver(options.address, options.port, options.resource)\n\
  \    print 'check_webserver returned %s' % check\n    sys.exit(not check)\n```\n\
  \n\n\n\n\n```python\nparser.add_option(\"-r\", \"--remote_file\", dest=\"remote_file\"\
  ,\n     help=\"REMOTE FILE NAME to download.\",\n     metavar=\"REMOTE FILE NAME\"\
  )\nparser.add_option(\"-l\", \"--local_file\", dest=\"local_file\",\n     help=\"\
  LOCAL FILE NAME to save remote file to\", metavar=\"LOCAL FILE NAME\")\nparser.add_option(\"\
  -u\", \"--username\", dest=\"username\",\n     help=\"USERNAME for ftp server\"\
  , metavar=\"USERNAME\")\nparser.add_option(\"-p\", \"--password\", dest=\"password\"\
  ,\n     help=\"PASSWORD for ftp server\", metavar=\"PASSWORD\")\n(options, args)\
  \ = parser.parse_args()\n\nif not (options.remote_file and\n        options.local_file\
  \ and\n        options.remote_host_address):\n    parser.error('REMOTE HOST, LOCAL\
  \ FILE NAME, ' \\\n                 'and REMOTE FILE NAME are mandatory')\nif options.username\
  \ and not options.password:\n    parser.error('PASSWORD is mandatory if USERNAME\
  \ is present')\nftp = FTP(options.remote_host_address)\nif options.username:\n \
  \   try:\n        ftp.login(options.username, options.password)\n    except ftplib.error_perm,\
  \ e:\n        print \"Login failed: %s\" % e\n        sys.exit(1)\nelse:\n    try:\n\
  \        ftp.login()\n    except ftplib.error_perm, e:\n        print \"Anonymous\
  \ login failed: %s\" % e\n        sys.exit(1)\ntry:\n    local_file = open(options.local_file,\
  \ 'wb')\n    ftp.retrbinary('RETR %s' % options.remote_file, local_file.write)\n\
  finally:\n    local_file.close()\n    ftp.close()\n```\n\n工作代码的第一部分（在所有命令行解析之后）通过将\
  \ FTP 服务器地址传递给 `FTP` 的构造函数来创建一个 `FTP` 对象。或者，我们也可以通过向构造函数传递任何内容来创建一个 `FTP` 对象，然后在使用带有\
  \ FTP 服务器地址的 `connect()` 方法。代码随后登录到 FTP 服务器，如果提供了用户名和密码，则使用它们；如果没有提供，则使用匿名身份验证。接下来，它会创建一个\
  \ `file` 对象来存储来自 FTP 服务器文件的数据。然后它调用了 `FTP` 对象上的 `retrbinary()` 方法。`Retrbinary()`\
  \ 正如其名所示，从 FTP 服务器检索二进制文件。它接受两个参数：FTP 获取命令和一个回调函数。你可能会注意到，我们的回调函数是我们在上一步中创建的文件对象上的\
  \ `write` 方法。需要注意的是，在这种情况下，我们并没有调用 `write()` 方法。我们将 `write` 方法传递给 `retrbinary()`\
  \ 方法，以便 `retrbinary()` 能够调用 `write()`。`Retrbinary()` 将在每次从 FTP 服务器接收到每块数据时，调用我们传递给它的任何回调函数。该回调函数可以对数据进行任何操作。回调函数可以仅仅是记录它从\
  \ FTP 服务器接收了 N 个字节。传递一个 `file` 对象的 `write` 方法会使脚本将 FTP 服务器上的文件内容写入到 `file` 对象中。最后，它关闭了\
  \ `file` 对象和 FTP 连接。在此过程中，我们进行了一些错误处理：我们在从 FTP 服务器检索二进制文件周围设置了一个 `try` 块，并在调用关闭本地文件和\
  \ FTP 连接的调用周围设置了一个 `finally` 块。如果发生了任何错误，我们希望在脚本终止之前清理我们的文件。关于回调的简要讨论，请参见附录。\n\n\
  #### urllib\n\n从标准库模块移动到更高层次的库，我们来到了 `urllib`。当你考虑到 `urllib` 时，很容易只想到 HTTP 库，而忘记了\
  \ FTP 资源也可以通过 URL 来标识。因此，你可能没有考虑过使用 `urllib` 来获取 FTP 资源，但该功能是存在的。示例 5-5 与之前的 `ftplib`\
  \ 示例相同，只是它使用了 `urllib`。\n\n示例 5-5. 使用 urllib 的 FTP URL 检索器\n\n```python\n#!/usr/bin/env\
  \ python\n\"\"\"\nurl retriever\nUsage:\nurl_retrieve_urllib.py URL FILENAME\n\n\
  URL:\n如果 URL 是 FTP URL，格式应该是：\nftp://[username[:password]@]hostname/filename\n\n\
  如果你想使用文件的绝对路径来下载该文件，\n你应该让 URL 看起来像这样：\nftp://user:password@host/%2Fpath/to/myfile.txt\n\
  \n注意文件路径开头的 '%2F'。\n\nFILENAME:\n保存下载文件为文件名的绝对或相对路径\n\"\"\"\nimport urllib\nimport\
  \ sys\nif '-h' in sys.argv or '--help' in sys.argv:\n    print __doc__\n    sys.exit(1)\n\
  if not len(sys.argv) == 3:\n    print 'URL and FILENAME are mandatory'\n    print\
  \ __doc__\n    sys.exit(1)\nurl = sys.argv[1]\nfilename = sys.argv[2]\n\nurllib.retrbinary(url,\
  \ filename)\n```\n\n这个脚本简洁而高效。它真正展示了 `urllib` 的威力。实际上，用法的行数比代码行数多，我们决定使用位置参数而不是选项开关。实际上，此示例中执行操作的唯一一行代码是\
  \ `urllib.retrbinary(url, filename)`。\n\n你可能会发现，如果你认为某事情比你现在这样做的方法更简单，那么它确实如此。这里需要强调的一点是，如果你开始使用\
  \ XML-RPC，你只需要知道标准库中有实现。它支持 HTTP 和 FTP URL，并且当用户名和密码在 URL 中时也能工作。有时，你可能需要离开标准库，但你可以在\
  \ [`pypi.python.org/pypi.`](http://pypi.python.org/pypi.) 找到其他 Python 。\n\n####\
  \ urllib2\n\n另一个高级库是 `urllib2`。`llib2` 包含了与 `urllib` 相同的功能，但对其进行了扩展。例如，`urllib2`\
  \ 包含了更好的身份验证和 Cookie 支持。因此，如果你开始使用 `urllib` 并认为它没有完成它应该完成的一切，请查看 `urllib2` 是否能满足你的需求。\n\
  \n#### 远程过程调用设施\n\n通常，编写网络代码是因为你需要进程间通信（IPC）。通常，普通的 IPC（如 HTTP 或套接字）就足够了。然而，在某些情况下，能够在另一个进程甚至不同的计算机上执行代码，就像在你正在编写代码的进程中执行一样会更有用。如果你确实可以从你的\
  \ Python 程序远程执行某些代码，你可能会期望远程调用的返回值是 Python 对象，这比手动解析的文本块容易处理得多。好消息是，有几种用于远程过程调用（RPC）功能的工具。\n\
  \n#### XML-RPC\n\nXML-RPC 在两个进程之间交换特定格式的 XML 文档以执行远程过程调用。但你不需要担心 XML 部分；你可能需要知道两个进程之间交换的文档格式。开始使用\
  \ XML-RPC 时，你唯一需要知道的是 Python 标准库中有客户端和服务器部分的实现。两个可能对你有用的点是 XML-RPC 适用于大多数编程语言，而且它非常容易使用。\n\
  \n\n\n\n\n示例 5-6 是一个简单的 XML-RPC 服务器。\n\n## 示例 5-6. 简单的 XML-RPC 服务器\n\n```python\n\
  #!/usr/bin/env python\nimport SimpleXMLRPCServer\nimport os\n\ndef ls(directory):\n\
  \    try:\n        return os.listdir(directory)\n    except OSError:\n        return\
  \ []\n\ndef ls_boom(directory):\n    return os.listdir(directory)\n\ndef cb(obj):\n\
  \    print \"OBJECT::\", obj\n    print \"OBJECT.__class__::\", obj.__class__\n\
  \    return obj.cb()\n\nif __name__ == '__main__':\n    s = SimpleXMLRPCServer.SimpleXMLRPCServer(('127.0.0.1',\
  \ 8765))\n    s.register_function(ls)\n    s.register_function(ls_boom)\n    s.register_function(cb)\n\
  \    s.serve_forever()\n```\n\n这段代码创建了一个新的 `SimpleXMLRPCServer` 对象并将其绑定到 `127.0.0.1`\
  \ 上的 `8765` 端口（回环接口），这使得只有该特定机器上的进程可以访问它。随后它注册了代码中定义的函数 `ls()`、`ls_boom()` 和 `cb()`。我们将在几分钟后解释\
  \ `cb()` 函数。`ls()` 函数将使用 `os.listdir()` 列出传入目录的内容，并将这些结果作为列表返回。`ls()` 屏蔽了我们可能会遇到的任何\
  \ `OSError` 异常。`ls_boom()` 则让我们遇到的任何异常直接返回给 XML-RPC 客户端。然后，代码进入 `serve_forever()`\
