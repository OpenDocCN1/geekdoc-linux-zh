  \    >>> sniff(iface=\"en0\", prn=lambda x: x.show())\n     ###[ Ethernet ]###\n\
  \     dst= ff:ff:ff:ff:ff:ff\n     src= 00:16:cb:07:e4:58\n     type= IPv4\n   \
  \  ###[ IP ]###\n     version= 4L\n     ihl= 5L\n     tos= 0x0\n     len= 78\n \
  \    id= 27957\n     flags=\n     frag= 0L\n     ttl= 64\n     proto= udp\n    \
