  \ mark 打印支持\n- (NSPrintOperation *)printOperationWithSettings:(NSDictionary *)printSettings\n\
  \                                     error:(NSError **)outError\n{\n    // 从页面设置获取信息\n\
  \    NSPrintInfo *printInfo = [self printInfo];\n    // 获取显示整个 HTML 文档的视图\n    NSView\
  \ *docView = [[[webView mainFrame] frameView] documentView];\n    // 创建打印操作\n  \
  \  return [NSPrintOperation printOperationWithView:docView\n                   \
  \            printInfo:printInfo];\n}\n```\n\n虽然有很多替代方案，但我们这里建议的特定纯文本格式是 reStructuredText（也称为\
  \ **reST**）。以下是 reStructuredText 网站对它的描述：\n\n> reStructuredText 是一种易读的、所见即所得的纯文本标记语法和解析器系统。它非常适用于内联程序文档（如\
  \ Python docstrings）、快速创建简单的网页以及独立文档。reStructuredText 专为特定应用领域的扩展性而设计的。reStructuredText\
  \ 解析器是 Docutils 的组件。reStructuredText 是对 StructuredText 和 Setext 轻量级标记系统的修订和重新解释。\n\
  \nreST 是 Python 文档的优选格式。如果你为代码创建了 Python 包并决定将其上传到 PyPI，reStructuredText 是预期的文档格式。许多个人\
  \ Python 项目也使用 ReST 作为其文档需求的主要格式。\n\n那么，为什么你想用 ReST 作为文档格式呢？首先，因为这种格式非常简单。其次，对这种标记法的熟悉几乎是瞬间。当你看到文档的结构时，就能很快理解作者的意图。这里有一个非常简单的\
  \ ReST 文件示例：\n\n```\n=======\nHeading\n=======\nSubHeading\n----------\nThis is\
  \ just a simple\nlittle subsection. Now,\nwe'll show a bulleted list:\n- item one\n\
  - item two\n- item three\n```\n\n即使不阅读关于什么是构成有效的 reStructuredText 的文档，你可能也能理解它的意思。使用我们刚刚展示的示例，我们将演示将\
  \ ReST 转换为 HTML 的步骤：\n\n```objc\nIn [2]: import docutils.core\nIn [3]: rest = '''=======\n\
  Heading\n=======\nSubHeading\n----------\nThis is just a simple\nlittle subsection.\
  \ Now,\nwe'll show a bulleted list:\n- item one\n- item two\n- item three\n'''\n\
  In [4]: html = docutils.core.publish_string(source=rest, writer_name='html')\nIn\
  \ [5]: print html[html.find('<body>') + 6:html.find('</body>')]\n```\n\n```html\n\
  <div class=\"document\" id=\"heading\">\n<h1 class=\"title\">Heading</h1>\n<h2 class=\"\
  subtitle\" id=\"subheading\">SubHeading</h2>\n<p>This is just a simple\nlittle subsection.\
  \ Now,\nwe'll show a bulleted list:</p>\n<ul class=\"simple\">\n<li>item one</li>\n\
  <li>item two</li>\n<li>item three</li>\n</ul>\n</div>\n```\n\n\n\n\n\n```python\n\
  In [6]: server_list = '''==============  ============  ================\n   ...:\
  \   Server Name    IP Address    Function\n   ...: ==============  ============\
  \  ================\n   ...: card            192.168.1.2   mail server\n   ...:\
  \ vinge           192.168.1.4   web server\n   ...: asimov          192.168.1.8\
  \   database server\n   ...: stephenson      192.168.1.16  file server\n   ...:\
  \ gibson          192.168.1.32  print server\n   ...: ==============  ============\
  \  ================'''\n\nIn [7]: print server_list\n==============  ============\
