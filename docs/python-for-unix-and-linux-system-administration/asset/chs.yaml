  \ Django 模板文件 `index.html`。极其强大的一点是，利用 Google 用户账户数据库为页面创建授权非常简单。如果你看之前的代码，只需说：\n\
  \n```python\nuser = users.get_current_user()\nif users.get_current_user():\n```\n\
  \n此时，我们建议你尝试修改这段代码，并尝试添加仅对已验证用户显示的代码。你甚至不需要理解它是如何工作的；你可以使用现有的条件语句来做些事情。\n\n现在我们对身份验证有了模糊的了解，让我们进入强大的功能部分。datastore\
  \ API 允许你存储持久数据并在整个应用程序中检索它。为了做到这一点，你需要像之前的代码那样导入 `datastore`，然后定义如下所示的模型：\n\n```python\n\
  class ChangeModel(db.Model):\n    user = db.UserProperty()\n    input = db.IntegerProperty()\n\
  \    date = db.DateTimeProperty(auto_now_add=True)\n```\n\n有了这个简单的类，我们现在可以创建并使用持久数据了。在下面的类中，我们使用\
  \ Python API 对 datastore 检索数据库的最后 10 次更改，并将其显示出来：\n\n```python\nclass Recent(webapp.RequestHandler):\n\
  \    \"\"\"Query Last 10 Requests\"\"\"\n    def get(self):\n        #collection\n\
  \        collection = []\n        #从 datastore 获取最后 10 条记录\n        query = ChangeModel.all().order('-date')\n\
  \        records = query.fetch(limit=10)\n        #正确格式化小数\n        for change in\
  \ records:\n            collection.append(decimal.Decimal(change.input*100))\n \
  \       template_values = {\n        'inputs': collection,\n        'records': records,\n\
  \        }\n        path = os.path.join(os.path.dirname(__file__), 'submit_error.html')\n\
  \        self.response.out.write(template.render(path,template_values))\n```\n\n\
