  \ UDP implementations',\n'View-based Access Control Model for SNMP.', '0', '0',\
  \ '0', '0', '0', '0', '0', '0')\n```\n\n在你感到太兴奋之前，让我们告诉你们：虽然后台线程在 IPython 中运行得非常完美，但它只适用于支持异步线程的库。Net-SNMP\
  \ 的 Python 绑定是同步的。简单而言之，你无法编写多线程代码，因为底层 C 代码会阻塞等待响应。\n\n幸运的是，正如你在进程和并发章节中发现的那样，使用\
  \ `processing` 模块来派生（fork）处理并行 SNMP 查询的进程是非常简单的。在下一节中，我们将编写一个自动发现数据中心的示例工具时解决这个问题。\n\
