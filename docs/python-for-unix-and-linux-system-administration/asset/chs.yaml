  [outPipe release];\n\n// 启动进程\n[task launch];\n\n// 从文本视图中获取数据\nNSData *inData =\
  \ [[textStorage string] dataUsingEncoding:NSUTF8StringEncoding];\n// 将数据放入管道并关闭\n\
