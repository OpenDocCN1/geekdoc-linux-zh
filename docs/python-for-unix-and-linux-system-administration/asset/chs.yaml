  \n[content]\nPython 标准库包含一个名为 `sys` 的内置模块，它可以方便地访问标准输入和标准输出。标准库以类文件对象的形式提供了对标准输入和输出的访问，尽管它们并没有直接连接到磁盘上的文件。由于它们是类文件对象，你可以对它们使用与处理文件时相同的方法。你可以将它们视为磁盘上的文件，并访问用于这些操作的相关方法。\n\
