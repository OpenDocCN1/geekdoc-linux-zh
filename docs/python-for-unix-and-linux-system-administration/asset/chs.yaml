  在 IPython 中，`cd` 的工作方式与在 Bash 中基本相同。主要用法是 `cd directory_name`。它按照你根据 Bash 经验预期的方式工作。如果不带任何参数，`cd`\
  \ 会带你回到主目录。如果带有空格和连字符作为参数，`cd -` 会带你回到上一个目录。Bash 的 `cd` 没有提供另外三个额外的选项。\n\n第一个是 `-q`，或\
  \ `quiet`（静静模式）选项。如果不使用此选项，IPython 会输出你刚刚切换的目录。下面的示例展示了使用和不使用 `-q` 选项切换目录的方法：\n\n\
  ```\nIn [1]: cd /tmp\n/tmp\nIn [2]: pwd\nOut[2]: '/tmp'\nIn [3]: cd -\n/home/jmjones\n\
  In [4]: cd -q /tmp\nIn [5]: pwd\nOut[5]: '/tmp'\n```\n\n使用 `-q` 可以防止 IPython 输出我们已经进入的\
  \ `/tmp` 目录。\n\nIPython 的 `cd` 包含的另一个功能是跳转到定义书签（bookmarks）的能力。（我们很快会解释如何创建书签。）这里有一个切换你已创建了书签的目录的示例：\n\
  \n```\nIn [1]: cd -b t\n(bookmark:t) -> /tmp\n/tmp\n```\n\n此示例假设我们已经将 `/tmp` 标记为名称\
