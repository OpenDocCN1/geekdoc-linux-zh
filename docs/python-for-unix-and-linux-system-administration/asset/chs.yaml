  \ qr=1L opcode=QUERY aa=0L tc=0L rd=1L ra=1L z=0L\n  rcode=ok qdcount=1 ancount=2\
  \ nscount=4 arcount=3 qd=\nDNSQR  qname='www.oreilly.com.' qtype=A qclass=IN |>\n\
