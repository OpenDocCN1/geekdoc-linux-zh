  ;\n}\n\n[task setLaunchPath:path];\n\n// 连接一个用于输入 ReST 的管道\nNSPipe *inPipe = [[NSPipe\
  \ alloc] init];\n[task setStandardInput:inPipe];\n[inPipe release];\n\n// 连接一个用于输出\
