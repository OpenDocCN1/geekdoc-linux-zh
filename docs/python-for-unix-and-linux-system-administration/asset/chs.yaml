  \ 示例那样打印所有字段，而是只打印时间和日志消息主体。该脚本以 `Administrator` 身份和密码 `foo` 连接到服务器 `192.168.1.3`。然后，它执行\
  \ WMI 查询 `'SELECT * FROM Win32_NTLogEvent'`。随后它遍历查询结果并打印时间戳和日志消息主体。这操作再简单不过不过了。\n\
  \n以下是运行该脚本的部分输出：\n\n```text\nl.timewritten:: 20080320034359.000000+000\nl.message::\
