  \n#### FTP 镜像\n\n下一个示例展示了如何连接到 FTP 服务器并从某些用户指定的目录开始递归地检索该服务器上的所有文件。它允许你在获取每个文件后将其删除。你可能在想：“这个脚本有什么意义？`rsync`\
  \ 不是已经处理了所有这些吗？”答案是：“是的，它确实处理。”但是，如果你正在工作的服务器上没有安装 `rsync`，而且你不被允许安装它怎么办呢？（对于管理员来说这不太可能，但确实会发生。）或者，如果你对尝试拉取数据的服务器没有\
  \ SSH 或 `rsync` 权限怎么办？有一个替代方案会有帮助。以下是镜像脚本的源代码：\n\n```python\n#!/usr/bin/env python\n\
  import ftplib\nimport os\nclass FTPSync(object):\n    def __init__(self, host, username,\
  \ password, ftp_base_dir,\n                                 local_base_dir, delete=False):\n\
  \        self.host = host\n        self.username = username\n        self.password\
  \ = password\n        self.ftp_base_dir = ftp_base_dir\n        self.local_base_dir\
  \ = local_base_dir\n        self.delete = delete\n        self.conn = ftplib.FTP(host,\
  \ username, password)\n        self.conn.cwd(ftp_base_dir)\n        try:\n     \
  \       os.makedirs(local_base_dir)\n        except OSError:\n            pass\n\
  \        self.chdir(local_base_dir)\n    def get_dirs(self):\n        dir_res =\
  \ []\n        self.conn.dir('.', dir_res)\n        files = [f.split(None, 8)[-1]\
  \ for f in dir_res if f.startswith('-')]\n        dirs = [f.split(None, 8)[-1] for\
  \ f in dir_res if f.startswith('d')]\n        return (files, dirs)\n    def walk(self,\
  \ next_dir):\n        print \"Walking to\", next_dir\n        self.conn.cwd(next_dir)\n\
  \        try:\n            os.mkdir(next_dir)\n        except OSError:\n       \
  \     pass\n        os.chdir(next_dir)\n        ftp_curr_dir = self.conn.pwd()\n\
  \        local_curr_dir = os.getcwd()\n        files, dirs = self.get_dirs()\n \
  \       print \"FILES:\", files\n        print \"DIRS:\", dirs\n        for f in\
  \ files:\n            print next_dir, ':', f\n            outf = open(f, 'wb')\n\
  \            try:\n                self.conn.retrbinary('RETR %s' % f, outf.write)\n\
  \            finally:\n                outf.close()\n                if self.delete:\n\
  \                    print \"Deleting\", f\n                    self.conn.delete(f)\n\
  \        for d in dirs:\n            self.walk(d)\n    def run(self):\n        self.walk('.')\n\
  if __name__ == '__main__':\n    from optparse import OptionParser\n    parser =\
  \ OptionParser()\n    parser.add_option(\"-o\", \"--host\", dest=\"host\")\n   \
  \ parser.add_option(\"-u\", \"--username\", dest=\"username\")\n    parser.add_option(\"\
  -p\", \"--password\", dest=\"password\")\n    parser.add_option(\"-r\", \"--remote_dir\"\
  , dest=\"remote_dir\")\n    parser.add_option(\"-l\", \"--local_dir\", dest=\"local_dir\"\
  )\n    parser.add_option(\"-d\", \"--delete\", dest=\"delete\", default=False,\n\
  \                      action='store_true', help=\"use regex parser\")\n    (options,\
  \ args) = parser.parse_args()\n    f = FTPSync(options.host, options.username, options.password,\
  \ options.remote_dir, options.local_dir, options.delete)\n    f.run()\n```\n\n\n\
  \n\n\n我们定义的下一个方法是 `walk()`。该方法是大部分工作发生的地方。`walk()` 方法接受一个参数：要访问的下一个目录。在继续之前，我们要提一下这是一个递归函数。我们的意图让它调用自己。如果任何目录包含其他目录，它们将会被\
  \ `walk` 遍历。`walk()` 方法中的代码首先会将 FTP 服务器上的目录切换到指定的目录。然后，我们切换到本地服务器上的该目录，并在必要时创建它。接着，我们将\
  \ FTP 服务器和本地的当前位置分别存储在变量 `ftp_curr_dir` 和 `local_curr_dir` 中以备后之用。接下来，我们从之前提到的 `get_dirs_files()`\
  \ 方法获取该目录下的文件和目录。对于目录中的每个文件，我们都使用 `retrbinary()` FTP 方法来检索它们。如果传递了删除标记，我们还会删除该文件。接着，我们切换到\
  \ FTP 服务器和本地的当前目录，并调用 `walk()` 进入这些下级目录。我们再次切换到当前目录的原因是，这样当下层的 `walk()` 调用返回时，我们可以回到我们所在的位置。\n\
  \n我们定义的最后一个方法是 `run()`。`run()` 仅仅是一个便利方法。调用 `run()` 只是调用 `walk()` 并将当前的 FTP 目录传递给它。\n\
  \n此脚本包含一些基本的错误和异常处理。首先，我们没有检查所有的命令行参数并确保至少传递了 `host`、`username` 和 `password`。如果没有指定这些参数，脚本将迅速崩溃。此外，如果发生异常，我们不会尝试重新下载文件。相反，如果某些原因导致下载失败我们将获取异常。在这种情况下程序将终止。如果脚本在下载过程中终止，下次启动时，脚本将重新开始下载该文件。这样做的好处是它不会删除仅部分下载的文件。\n\
