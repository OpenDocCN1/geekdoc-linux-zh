  \ 中的 `urllib2`。\n\n# 日志解析\n\n从系统管理员的角度来看，如果不讨论日志文件的解析，文本处理的讨论就是完整的，因此我们在这里。我们已经为你奠定了基础，能够打开日志文件、读取每一行，并以最适合你的方式读取数据。在开始编写此示例之前，我们必须问问自己：“我们希望这个日志读取器做什么？”我们的答案非常简单：读取\
  \ Apache 访问日志，并确定每个唯一客户端获取的字节数。\n\n根据 [`httpd.apache.org/docs/1.3/logs.html`](http://httpd.apache.org/docs/1.3/logs.html)，“组合”（combined）日志格式看起来如下：\n\
  \n`127.0.0.1 - frank [10/Oct/2000:13:55:36 -0700] \"GET /apache_pb.gif HTTP/1.0\"\
  `\n\n`200 2326 \"http://www.example.com/start.html\" \"Mozilla/4.08 [en] (Win98;\
  \ I`\n\n`;Nav)\"`\n\n这与我们 Apache 日志文件中的数据匹配。我们感兴趣的日志文件中每行的两个信息是客户端的 IP 地址和传输的字节数。IP\
  \ 地址是日志文件的第一个字段；在这种情况下，地址是 127.0.0.1。传输的字节数是倒数第二个字段，就在引用来源（referrer）之前；在这种情况下，传输了\
  \ 2326 字节。那么，我们如何获取这些字段呢？请参 示例 3-24。\n\n## 示例 3-24. Apache 日志解析器——空格分割\n\n```python\n\
  #!/usr/bin/env python\n\"\"\"\n用法:\napache_log_parser_split.py some_file\n此脚本接受一个命令行参数：要解析的文件名。它随后解析文件并生成一个报告，将远程主机与其传输的字节数相关联。\n\
  \"\"\"\nimport sys\ndef dictify_logline(line):\n    '''返回 apache 组合日志文件的字典\n   \
  \ 目前我们感兴趣的字段是远程主机和发送的字节数，\n    但为了保险，我们也放了状态码。\n    '''\n    split_line = line.split()\n\
  \    return {'remote_host': split_line[0],\n            'status': split_line[8],\n\
  \            'bytes_sent': split_line[9],\n            }\ndef generate_log_report(logfile):\n\
  \    '''返回字典格式的 remote_host=>字节数列表\n    此函数接受一个文件对象，遍历文件中的所有行，\n    并生成 Web 服务器每个远程主机字节数的报告。\n\
  \    '''\n    report_dict = {}\n    for line in logfile:\n        line_dict = dictify_logline(line)\n\
  \        print line_dict\n        try:\n            bytes_sent = int(line_dict['bytes_sent'])\n\
  \        except ValueError:\n            # 忽略无法理解的内容\n            continue\n   \
  \     report_dict.setdefault(line_dict['remote_host'], []).append(bytes_sent)\n\
  \    return report_dict\nif __name__ == \"__main__\":\n    if len(sys.argv) > 1:\n\
  \        print \"\"\n        sys.exit(1)\n    infile_name = sys.argv[1]\n    try:\n\
  \        infile = open(infile_name, 'r')\n    except IOError:\n        print \"\
  必须指定有效的文件进行解析\"\n        print \"\"\n        sys.exit(1)\n    log_report = generate_log_report(infile)\n\
  \    print log_report\n    infile.close()\n```\n\n这个示例非常简单。`__main__` 部分只做了几件事。首先，它检查命令行参数以确保传递了一个参数。如果用户没有传递参数，脚本将打印用法信息并退出。关于如何更好地处理命令行参数和参数，请参阅\
  \ 第 13 章。接下来，`__main__` 尝试打开日志文件。如果打开失败，它打印用法信息并退出。接下来，它将日志文件传递给 `generate_log_report()`\
  \ 函数并打印结果。`generate_log_report()` 创建了一个作为报告的字典。它随后遍历日志文件的所有行，并将每行传递给 `dictify_logline()`，后者返回一个包含所需的字典。然后，它检查\
  \ `bytes_sent` 值是否为整数。如果是，则继续；如果不是，则跳到下一行。之后，它用 `dictify_logline()` 返回的数据更新字典。最后，它将字典返回给\
  \ `__main__` 部分。`dictify_logline()` 仅按空格分割日志行，从结果列表中提取特定项，并返回一个包含分割数据的字典。\n\n那么，它有效吗？基本有效。请查看\
  \ 示例 3-25 中的单元测试。\n\n## 示例 3-25. Apache 日志解析器的单元测试——空格分割\n\n```python\n#!/usr/bin/env\
  \ python\nimport unittest\nimport apache_log_parser_split\nclass TestApacheLogParser(unittest.TestCase):\n\
  \    def setUp(self):\n        pass\n    def testCombinedExample(self):\n      \
  \  # 测试来自 apache.org 的组合示例\n        combined_log_entry = '127.0.0.1 - frank [10/Oct/2000:13:55:36\
  \ -0700] \\\n        '\"GET /apache_pb.gif HTTP/1.0\" 200 2326 \"http://www.example.com/start.html\"\
  \ \\\n        '\"Mozilla/4.08 [en] (Win98; I ;Nav)\"'\n        self.assertEqual(apache_log_parser_split.dictify_logline(combined_log_entry),\n\
  \            {'remote_host': '127.0.0.1', 'status': '200', 'bytes_sent': '2326'})\n\
  \    def testCommonExample(self):\n        # 测试来自 apache.org 的通用示例\n        common_log_entry\
  \ = '127.0.0.1 - frank [10/Oct/2000:13:55:36 -0700] \\\n        '\"GET /apache_pb.gif\
  \ HTTP/1.0\" 200 2326'\n        self.assertEqual(apache_log_parser_split.dictify_logline(common_log_entry),\n\
  \            {'remote_host': '127.0.0.1', 'status': '200', 'bytes_sent': '2326'})\n\
  \    def testExtraWhitespace(self):\n        # 测试字段间的额外空格\n        common_log_entry\
