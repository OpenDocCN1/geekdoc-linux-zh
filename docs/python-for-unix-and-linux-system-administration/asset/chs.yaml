  \n既然我们已经涵盖了这些，让我们真正进入一些 Google App Engine 的具体细节。如果你注意到右侧导航框中的“登录”链接，它是通过巧妙的用户身份验证\
  \ API 实现的。以下是实际的代码：\n\n```python\nclass MainPage(webapp.RequestHandler):\n    \"\
  \"\"Main Page View\"\"\"\n    def get(self):\n        user = users.get_current_user()\n\
