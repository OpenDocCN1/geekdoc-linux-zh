  \ password:\nLast login: Sun Mar 2 06:26:10 2008\n[root@localhost]~# cd .ssh\n[root@localhost]~/.ssh#\
  \ ll\ntotal 8\n-rw-r--r-- 1 root root 403 Mar 2 06:32 id_op_lap.pub\n-rw-r--r--\
  \ 1 root root 2044 Feb 14 05:33 known_hosts\n[root@localhost]~/.ssh# cat id_op_lap.pub\
  \ > authorized_keys\n[root@localhost]~/.ssh# exit\nConnection to 10.0.1.51 closed.\n\
  ```\n\n步骤 3：挂载包含客户端所需的常用 src。通常最简单的方法是使用 autofs 然后创建符号链接。或者可以通过版本控制系统来实现，通过 ssh\
  \ 发布命令让远程主机更新本地 svn 仓库。接下来，脚本将运行最新的模块。步骤 4：编写一个调度器在机器网络上运行代码。既然我们有了 ssh 密钥和常用的 NFS\
  \ 挂载 src 目录（或版本控制监控的 src 目录），这个任务变得相当简单。一如既常，让我们从简单的 ssh 调度系统示例开始。\n\n## 示例 8-5.\
  \ 简单的基于 ssh 的调度器\n\n```python\n#!/usr/bin/env python\nimport subprocess\n\"\"\"\n\
  一个基于 ssh 的命令调度系统\n\"\"\"\nmachines = [\"10.0.1.40\",\n\"10.0.1.50\",\n\"10.0.1.51\"\
  ,\n\"10.0.1.60\",\n\"10.0.1.80\"]\ncmd = \"uname\"\nfor machine in machines:\n \
  \ subprocess.call(\"ssh root@%s %s\" % (machine, cmd), shell=True)\n```\n\n在这些 IP\
  \ 地址上运行该脚本（这些地址是 CentOS 5、FreeBSD 7、Ubuntu 7.1 和 Solaris 10 的混合），得到的结果如下：\n\n```\n\
  Linux\nLinux\nLinux\nSunOS\nFreeBSD\n```\n\n\n\n\n\n自从我们写了一个更准确的操作系统指纹脚本后，让我们用它来对我们要分发命令的宿主机进行更准确的描述，以便在远程机器上临时创建\
  \ `src` 目录并将代码拷贝到每台机器上。当然，由于我们已经有了一个分发脚本，现在显而易见的是，我们需要为工具配备一个健壮的 CLI，因为每当我们想要执行不同的操作时都必须修改脚本，例如：\n\
  \n`cmd = \"mkdir /src\"`\n\n`或者：`\n\n`cmd = \"python /src/fingerprint.py\"`\n\n\
  `甚至：`\n\n`subprocess.call(\"scp fingerprint.py root@%s:/src/\" % machine, shell=True)`\n\
  \n在我们让 `fingerprint.py` 脚本运行起来之后我们会立即修改它，但让我们先看看新的 `cmd`：\n\n```python\n#!/usr/bin/env\
  \ python\nimport subprocess\n\"\"\"\n一个基于 ssh 的命令分发系统\n\"\"\"\nmachines = [\"10.0.1.40\"\
  ,\n\"10.0.1.50\",\n\"10.0.1.51\",\n\"10.0.1.60\",\n\"10.0.1.80\"]\ncmd = \"python\
  \ /src/fingerprint.py\"\nfor machine in machines:\n  subprocess.call(\"ssh root@%s\
  \ %s\" % (machine, cmd), shell=True)\n```\n\n现在，让我们来看看新的输出：\n\n```\n[ngift@Macintosh-6][H:11107][J:0]#\
  \ python dispatch.py\nredhat\nubuntu\nredhat\nSunOS\nFreeBSD\n```\n\n得益于我们的 `fingerprint.py`\
  \ 模块，这要好得多。当然，我们的这几行分发代码需要大重构才能被认为有用，因为我们必须通过编辑脚本来更改内容。我们需要一个更好的工具，所以让我们造一个吧。\n\n\
  #### 创建跨平台系统管理工具\n\n在简单的基于 ssh 的分发系统中使用 ssh key 虽然略有帮助，但几乎没有扩展性或可重用性。让我们列出之前工具的问题，然后列出修复这些问题的需求。\n\
  \n**问题：** 机器列表被硬编码在脚本中；我们分发的命令硬编码在脚本中；我们每次只能运行一个命令；我们必须对所有机器运行相同的命令列表，无法进行挑选；而且我们的分发代码会阻塞等待每个命令的响应。\n\
  \n**需求：** 我们需要一个读取 IP 地址和要运行命令配置文件的命令行工具；我们需要一个带有选项的 CLI 接口来向机器（们）发送命令（们）；我们需要在独立的线程池中运行分发，以便进程不会阻塞。\n\
  \n似乎我们可以创建一个非常基础的配置文件语法来解析，其中包含一个机器部分和一个命令部分。参见 示例 8-6。\n\n示例 8-6. 分发配置文件。\n\n```ini\n\
  [MACHINES]\nCENTOS: 10.0.1.40\nUBUNTU: 10.0.1.50\nREDHAT: 10.0.1.51\nSUN: 10.0.1.60\n\
  FREEBSD: 10.0.1.80\n[COMMANDS]\nFINGERPRINT : python /src/fingerprint.py\n```\n\n\
  接下来，我们需要写一个函数来读取配置文件并拆分 `MACHINES` 和 `COMMANDS`，以便我们可以逐个遍历它们。参见 示例 8-7。\n\n***\n\
  \n### 注意\n\n需要注意的是，我们的命令将是从配置文件中随机导入的。在很多情况下，这是一个致命问题，最好直接写一个 Python 文件并将其用作配置文件。\n\
  \n***\n\n示例 8-7. 高级 ssh 分发器。\n\n```python\n#!/usr/bin/env python\nimport subprocess\n\
  import ConfigParser\n\"\"\"\n一个基于 ssh 的命令分发系统\n\"\"\"\ndef readConfig(file=\"config.ini\"\
  ):\n  \"\"\"从配置文件中提取 IP 地址和 CMDS 并返回元组（tuple）\"\"\"\n  ips = []\n  cmds = []\n \
  \ Config = ConfigParser.ConfigParser()\n  Config.read(file)\n  machines = Config.items(\"\
  MACHINES\")\n  commands = Config.items(\"COMMANDS\")\n  for ip in machines:\n  \
  \   ips.append(ip[1])\n  for cmd in commands:\n     cmds.append(cmd[1])\n  return\
  \ ips, cmds\n\nips, cmds = readConfig()\n# 对于每个 ip 地址，运行所有命令\nfor ip in ips:\n \
  \ for cmd in cmds:\n     subprocess.call(\"ssh root@%s %s\" % (ip, cmd), shell=True)\n\
  ```\n\n这段琐碎的代码用起来很有趣。我们可以任意分配一个命令列表并同时运行它们。如果我们看命令的输出，可以看到它看起来像：\n\n```\n[ngift@Macintosh-6][H:1285][J:0]#\
  \ python advanced_dispatch.py\nredhat\nredhat\nubuntu\nSunOS\nFreeBSD\n```\n\n尽管我们有了一个相当复杂的工具，但我们还没有满足“在独立线程中分发命令”的原始规范。幸运的是，我们可以利用进程章节中的一些技巧来创建一个线程池，Python_for_U-Administration_split_132.html_filepos8841\
  \ 展示了多线程可以做什么。\n\n示例 8-8. 多线程分发工具。\n\n```python\n#!/usr/bin/env python\nimport subprocess\n\
  import ConfigParser\nfrom threading import Thread\nfrom Queue import Queue\nimport\
  \ time\n\"\"\"\n一个基于线程的分的分发系统\n\"\"\"\nstart = time.time()\ndef readConfig(file=\"\
  config.ini\"):\n  \"\"\"从配置文件中提取 IP 地址和 CMDS 并返回元组（tuple）\"\"\"\n  ips = []\n  cmds\
  \ = []\n  Config = ConfigParser.ConfigParser()\n  Config.read(file)\n  machines\
  \ = Config.items(\"MACHINES\")\n  commands = Config.items(\"COMMANDS\")\n  for ip\
  \ in machines:\n     ips.append(ip[1])\n  for cmd in commands:\n     cmds.append(cmd[1])\n\
  \  return ips, cmds\n\ndef launcher(i,q,cmd):\n  \"\"\"在线程中分发命令\"\"\"\n  while True:\n\
  \    ip = q.get()\n    print \"Thread %s: Running %s to %s\" % (i, cmd, ip)\n  \
  \  subprocess.call(\"ssh root@%s %s\" % (ip, cmd), shell=True)\n    q.task_done()\n\
  \nips, cmds = readConfig()\n# 确定使用的线程数，但最多为 25\nif len(ips) < 25:\n  num_threads\
  \ = len(ips)\nelse:\n  num_threads = 25\n\nqueue = Queue()\n#启动线程池\nfor i in range(num_threads):\n\
  \  worker = Thread(target=launcher, args=(i,queue,cmd))\n  worker.setDaemon(True)\n\
  \  worker.start()\n\nprint \"Main Thread Waiting\"\nfor ip in ips:\n  for cmd in\
  \ cmds:\n    queue.put(ip)\nqueue.join()\nend = time.time()\nprint \"Dispatch Completed\
  \ in %s seconds\" % end - start\n```\n\n\n\n\n\n#### 创建跨平台构建网络\n\n既然我们已经知道如何向满载机器列表并行分发作业、识别它们运行的操作系统，并最终使用\
  \ `EPM` 创建一个可以生成特定厂商包的统一清单（manifest），那么将所有这些技术整合在一起难道不是很有意义吗？我们可以利用这三种技术非常轻松地构建出一个跨平台的构建网络。\n\
  \n随着虚拟机技术的出现，为任何非专有的 *ix 操作系统*（例如 Debian/Ubuntu、Red Hat/CentOS、FreeBSD 和 Solaris）创建虚拟机已经变得非常简单。现在，当你创建一个需要分享给世界或仅仅分享给公司内部的工具时，你可以非常容易地创建一个“构建农场”（甚至可以运行在你的笔记本电脑上），在其中运行脚本，然后立即为它创建一个厂商包。\n\
  \n那么，它是如何工作的呢？实现这一点的最自动化方法是创建一个公共 NFS 挂载包构建树，并赋予你所有的构建服务器访问该挂载点的权限。然后，使用我们之前创建的工具让构建服务器在\
  \ NFS 挂载目录中生成包构建。因为 `EPM` 允许你创建一个简单的清单或“列表”文件，而且由于我们已经创建了“指纹”脚本，所有的困难工作都已完成。好了，让我们写这段代码来实现这些操作。\n\
  \n这里是一个构建脚本的示例：\n\n```python\n#!/usr/bin/env python\nfrom fingerprint import fingerprint\n\
  from subprocess import call\n\nos = fingerprint()\n\n# 获取正确的 epm 关键字\nepm_keyword\
  \ = {\"ubuntu\":\"dpkg\", \"redhat\":\"rpm\", \"SunOS\":\"pkg\", \"osx\":\"osx\"\
  }\n\ntry:\n   epm_keyword[os]\nexcept Exception, err:\n   print err\nsubprocess.call(\"\
  epm -f %s helloEPM hello_epm.list\" % platform_cmd, shell=True)\n```\n\n现在，处理完这些，我们可以编辑\
  \ `config.ini` 文件并更改以运行我们的新脚本。\n\n```ini\n[MACHINES]\nCENTOS: 10.0.1.40\nUBUNTU:\
  \ 10.0.1.50\nREDHAT: 10.0.1.51\nSUN: 10.0.1.60\nFREEBSD: 10.0.1.80\n[COMMANDS]\n\
  FINGERPRINT = python /src/create_package.py\n```\n\n现在，我们只需要运行多线程版本的发行工具，哇，我们在几秒钟内就构建了\
  \ CentOS、Ubuntu、Red Hat、FreeBSD 和 Solaris 的包。这个示例不能被视为生产环境代码，因为需要配备错误处理，但它是 Python\
  \ 可以在几分钟或几小时内快速编写出内容的绝佳示例。\n\n# PyInotify\n\n如果你有权操作 GNU/Linux 平台，那么你将会欣赏 `PyInotify`。根据文档，它是“一个用于监控文件系统变化的\
  \ Python 模块”。官方页面在此：[`pyinotify.sourceforge.net`](http://pyinotify.sourceforge.net)。\n\
  \n示例 8-9 显示了它是如何工作的。\n\n示例 8-9. 事件监控 Pyinotify 脚本\n\n```python\nimport os\nimport\
  \ sys\nfrom pyinotify import WatchManager, Notifier, ProcessEvent, EventsCodes\n\
  \nclass PClose(ProcessEvent):\n    \"\"\"\n    处理关闭事件\n    \"\"\"\n    def __init__(self,\
  \ path):\n        self.path = path\n        self.file = file\n    def process_IN_CLOSE(self,\
  \ event):\n        \"\"\"\n        处理 'IN_CLOSE_*' 事件\n        可以传递一个动作函数\n    \
  \    \"\"\"\n        path = self.path\n        if event.name:\n            self.file\
  \ = \"%s\" % os.path.join(event.path, event.name)\n        else:\n            self.file\
  \ = \"%s\" % event.path\n        print \"%s Closed\" % self.file\n        print\
  \ \"Performing pretend action on %s....\" % self.file\n        import time\n   \
  \     time.sleep(2)\n        print \"%s has been processed\" % self.file\n\nclass\
  \ Controller(object):\n    def __init__(self, path='/tmp'):\n        self.path =\
  \ path\n    def run(self):\n        self.pclose = PClose(self.path)\n        PC\
  \ = self.pclose\n        # 只监控这些事件\n        mask = EventsCodes.IN_CLOSE_WRITE |\
  \ EventsCodes.IN_CLOSE_NOWRITE\n        # 管理器实例\n        wm = WatchManager()\n \
  \       notifier = Notifier(wm, PC)\n        print 'monitoring of %s started' %\
  \ self.path\n        added_flag = False\n        # 读取并处理事件\n        while True:\n\
  \            try:\n                if not added_flag:\n                    # 第一次迭代，添加监控：\n\
  \                    # 监控路径的事件\n                    wm.add_watch(self.path, mask)\n\
  \                    added_flag = True\n                # 如果有通知\n              \
  \  notifier.process_events()\n            except KeyboardInterrupt:\n          \
  \      # 停止\n                print 'stop monitoring...'\n                break\n\
  \            except Exception, err:\n                # 否则\n                print\
  \ err\n\ndef main():\n    monitor = Controller()\n    monitor.run()\n\nif __name__\
  \ == '__main__':\n    main()\n```\n\n### OS X\n\n说至少，OS X 是一个奇怪的怪兽。一方面，它可以说拥有 Cocoa\
  \ 这一世界上顶级的用户界面；另一方面，从 Leopard 版本开始，它引入了 Python 2.5、Twisted 以及许多其他好处。OS X 遵循一种相当奇怪的范式，提供服务器和一个版本。对于\
  \ Apple 所做的一切，它可能需要重新思考那种旧时代的思维，但我们稍后会讨论单一操作系统的问题。服务器版本提供了更好的命令行管理工具，例如 NetBoot\
  \ 机器、运行 LDAP 目录服务器等。\n\n## 编写 DSCL 或目录服务\n\nDSCL 代表目录服务命令行（Directory Services Command\
  \ Line），它是 OS X 目录服务 API 的方便接口。DSCL 允许你读取、创建和删除记录，因此 Python 是天然的选择。示例 8-10 展示了使用\
  \ IPython 编写 DSCL 来读取目录属性及其值。\n\n* *\n\n### 注意\n\n注意在示例中我们只读取属性，但使用相同的技术也可以轻松修改它们。\n\
  \n* *\n\n示例 8-10. 使用 DSCL 和 IPython 交互式获取用户记录\n\n```python\nIn [42]: import subprocess\n\
  In [41]: p = subprocess.Popen(\"dscl . read /Users/ngift\", shell=True,stdout=subprocess.PIPE)\n\
  In [42]: out = p.stdout.readlines()\nIn [43]: for line in out:\n    line.strip().split()\n\
  Out[46]: ['NFSHomeDirectory:', '/Users/ngift']\nOut[46]: ['Password:', '********']\n\
  Out[46]: ['Picture:']\nOut[46]: ['/Library/User', 'Pictures/Flowers/Sunflower.tif']\n\
  Out[46]: ['PrimaryGroupID:', '20']\nOut[46]: ['RealName:', 'ngift']\nOut[46]: ['RecordName:',\
  \ 'ngift']\nOut[46]: ['RecordType:', 'dsRecTypeStandard:Users']\nOut[46]: ['UniqueID:',\
  \ '501']\nOut[46]: ['UserShell:', '/bin/zsh']\n```\n\n\n\n\n\n值得指出，Apple 已经将本地和\
  \ LDAP/Active Directory 账户管理统一到了 `dscl` 命令上。与其他 LDAP 管理工具相比，在处理此类问题时，`dscl` 工具是一个令人目一新的存在，即使你不将\
  \ Python 在考虑内。虽然我们没有空间介绍细节，但使用 Python 对 `dscl` 工具进行脚本编写非常简单，可以通过编程的方式管理本地数据库或 LDAP\
  \ 数据库（如 Open Directory）上的账户，如果你选择这样做，之前的代码应该能让你对从何处开始有一个基本的思路。\n\n## OS X 脚本 API\n\
  \n对于 OS X 来说，系统管理员需要了解一些与实际 UI 本身交互的高级脚本通常是一项要求。通过 OS X Leopard、Python 和 Ruby，我们获得了对脚本桥接（Scripting\
  \ Bridge）的一级访问权限。更多信息请参阅此文档：[`developer.apple.com/documentation/Cocoa/Conceptual/RubyPythonCocoa/Introduction/Introduction.html`](http://developer.apple.com/documentation/Cocoa/Conceptual/RubyPythonCocoa/Introduction/Introduction.html)。\n\
  \n访问 OSA（或开放脚本架构）的选项之一是 `py-appscript`，其项目页面位于：[`sourceforge.net/projects/appscript`](http://sourceforge.net/projects/appscript)。\n\
  \n使用 `py-appscript` 非常有趣且强大，因为它赋予了 Python 与极其丰富的 OSA 架构交互的能力。在我们深入之前，让我们构建一个简单的\
  \ `osascript` 命令行工具，向你展示脚本 API 是如何工作的。在 Leopard 中，现在可以编写 `osascript` 命令行工具并像执行 Bash\
  \ 或 Python 脚本一样执行它们。让我们构建下面的脚本，将其命名为 `bofh.osa`，然后将其设为可执行。查看 示例 8-11。\n\n### 示例\
  \ 8-11. 你好，来自地狱的混蛋操作员 osascript\n\n```\n#!/usr/bin/osascript\nsay \"Hello, Bastard\
  \ Operator From Hell\" using \"Zarvox\"\n```\n\n如果我们从命令行运行，一个听起来像外星人的声音会向我们打招呼。这有点傻，但嘿，这是\
  \ OS X；你本就应该做这类的事情。\n\n现在，让我们研究使用 appscript 在 Python 中访问相同的 API，但让我们用 IPython 交互地完成。这里是\
  \ `appscript` 源码包含的一个示例的交互式版本，它可以按字母顺序打印所有运行中的进程：\n\n```\nIn [4]: from appscript\
  \ import app\nIn [5]: sysevents = app('System Events')\nIn [6]: processnames = sysevents.application_processes.name.get()\n\
  In [7]: processnames.sort(lambda x, y: cmp(x.lower(), y.lower()))\nIn [8]: print\
  \ '\\n'.join(processnames)\n```\n\n- 活动监视器 (Activity Monitor)\n- AirPort Base Station\
  \ Agent\n- AppleSpell\n- Camino\n- DashboardClient\n- DashboardClient\n- Dock\n\
  - Finder\n- 文件夹操作调度 (Folder Actions Dispatcher)\n- GrowlHelperApp\n- GrowlMenu\n\
  - iCal\n- iTunesHelper\n- JavaApplicationStub\n- loginwindow\n- mdworker\n- PandoraBoy\n\
  - Python\n- quicklookd\n- Safari\n- Spotlight\n- 系统事件 (System Events)\n- SystemUIServer\n\
  - 终端 (Terminal)\n- 文本编辑 (TextEdit)\n- TextMate\n\n如果你恰好需要用 OS X 特定应用程序执行工作流自动化任务，appscript\
  \ 可以成为你的神来之笔，因为它可以在 Python 中完成许多通常通过 Applescript 完成的工作。Noah 写了一篇文章深入探讨了其中一些内容：[`www.macdevcenter.com/pub/a/mac/2007/05/08/using-python-and-applescript-to-get-the-most-out-of-your-mac.html`](http://www.macdevcenter.com/pub/a/mac/2007/05/08/using-python-and-applescript-to-get-the-most-out-of-your-mac.html)。\n\
  \n系统管理员可能会做的事情包括编写 Final Cut Pro 脚本，并创建与 Adobe After Effects 等交互的批量操作。最后的建议是，在 OS\
  \ X 上使用 Python 创建 GUI 的一种非常快速且粗暴的方法是通过 Applescript Studio 通过“do shell script”调用\
  \ Python 来实现的。一个鲜为人知的事实是，Carbon Copy Cloner 的原始版本是用 Applescript Studio 编写的。如果你有时间，值得尝试一下。\n\
  \n## 自动重装系统映像\n\nOS X 开发的另一项领先时代的革命性工具是 `asr` 命令行工具。该工具是一个非常流行的免费克隆工具 Carbon Copy\
  \ Cloner 的关键组件，它在许多环境自动化中发挥了作用。Noah 曾配合 Netboot 使用 `asr` 工具自动重装系统映像；事实上，他在工作过的一处地方完全实现了自动化。用户只需重启机器并按住“N”键进行网络启动，一切就“大局已定”，或者说机器会自我修复。\n\
  \n不过请不要告诉任何人，因为他们认为他还在那里工作。这是一个硬编码且简化的自动启动脚本版本，可以在网络启动镜像上运行以自动重装机器映像，或者，它可以从硬盘上的第二个分区运行。在分区方面，`/Users`\
  \ 目录或其他分区示例 8-12。\n\n\n\n\n此脚本可以很容易地成为企业级软件发行和管理系统的基础，因为它可以根据硬件指纹指示分发不同的镜像，甚至通过查看硬盘的“旧”名称来操作。接下来，可以使用\
  \ OS X 的包管理系统或开源工具 `radmind` 来程序化地分发软件包。Noah 部署 OS X 的一个有趣场景是：首先使用基础操作系统对新安装的 OS\
  \ X 进行自动重新映像（re-image），然后使用 `radmind` 完成剩余的安装工作。\n\n如果你正在进行任何严肃的 OS X 系统管理工作，那么看一眼\
  \ `radmind` 是值得的。`Radmind` 是一种“丝丝”系统（tripwire system），用于检测文件系统中的更改，并能够根据这些更改集恢复机器。如果你想了解更多信息，可以参考\
  \ [`rsug.itd.umich.edu/software/radmind/`](http://rsug.itd.umich.edu/software/radmind/)。虽然\
  \ `radmind` 不是用 Python 编写的，但可以很容易地用 Python 对其编写脚本。\n\n## 使用 Python 管理 Plist 文件\n\
  \n在第 3 章中，我们使用 `ElementTree` 解析了从 `system_profiler` 生成的 XML 流，但 OS X 上的 Python 自带\
  \ `plistlib`，它允许你解析和创建 Plist 文件。该模块本身的名字就是 `plistlib`。我们没有时间介绍它的用例，但它值得你亲自探索。\n\n\
  # 红帽 Linux 系统管理\n\n红帽作为一家公司和一种操作系统，正在利用 Python 许多大量工作。红帽公司一些最有意思的 Python 新用途来自新兴技术小组（Emerging\
  \ Technologies group）：[`et.redhat.com/page/Main_Page`](http://et.redhat.com/page/Main_Page)。以下是使用\
  \ Python 的一些项目列表：\n\n* `Libvert`，虚拟化 API 虚拟机管理器\n* 使用 `libvirt` 和 `VirtInst` 构建的\
  \ Python + `PyGTK` 管理应用程序\n* 用于简化使用 `libvirt` 为客户端虚拟机进行配置（provisioning）的 Python\
  \ 库\n* `Cobbler`，用于为 PXE 和虚拟化设置全自动网络启动服务器\n* `Virt-Factory`：专注于应用程序的 Web 端虚拟化管理\n\
  * `FUNC`（Fedora 统一网络控制器）\n\n# Ubuntu 管理\n\n在所有主流 Linux 发行版中，你可以说 Ubuntu 也许是最迷恋 Python\
  \ 的一个。部分原因可能是因为创始人 Mark Shuttleworth 是一位长期 Python 黑客，历史可以追溯到 90 年代初。获取 Ubuntu 上\
  \ Python 包的一个良好来源是 Launchpad：[`launchpad.net/`](https://launchpad.net/)。\n\n###\
  \ Solaris 系统管理\n\n从 90 年代后期到 21 世纪初，Solaris 是首选的“大铁机（Big Iron）”Unix 发行版。Linux 在\
  \ 21 世纪初的爆发性崛起迅速侵占了 Solaris 的领地，Sun 公司陷入了真正的困境。然而，最近，许多系统管理员、开发者和企业再次开始讨论 Sun。\n\
  \nSun 未来的一些有趣进展包括：像 Ubuntu 一样采用 6 个月的发布周期，并配有 18 个月的支持窗口。它还在模仿 Ubuntu 的单光盘方案，并放弃了庞大的\
  \ DVD 发行版。最后，它通过引入社区开发的 Solaris 版本，混合了一些红帽和 Fedora 的想法。你可以点击下载 Live CD 或在此预订：[`www.opensolaris.com`](http://www.opensolaris.com)。\n\
  \n对于一个使用 Python 的系统管理员来说，这一切意味着什么？Sun 突然变得令人兴奋，它拥有一系列有趣的技术，从 ZFS 到容器（Containers），再到\
  \ LDOMs（后者在某些方面等同于 VMware 虚拟机）。这与本书甚至也有关联。Python 在 Solaris 上运行良好，而且在它正在开发的包管理系统中还被大量使用。\n\
  \n### 虚拟化\n\n2007 年 8 月 14 日，VMware 通过 IPO（公开股首次募股）上市，筹集了数十亿美元资金，并巩固了“虚拟化”作为各地数据中心和系统管理员的下一个大趋势。预测未来总是一场冒险的赌博，但“数据中心操作系统”这个词被大公司提及，从微软到红帽再到甲骨文，所有人都在加入虚拟化的热潮。可以说，虚拟化将彻底改变数据中心和系统管理工作。虚拟化是那个经常被过度使用的“颠覆性技术”一词的一个显而易见的例子。\n\
  \n虚拟化对于系统管理员来说是一把双刃剑，一方面，它提供了轻松测试配置和应用程序的能力；但另一方面，它大大增加了管理的复杂性。一台机器不再只运行一个操作系统，一台机器可能承载整个小企业，或者数据中心的大部分。所有的效率都必须付出代价，而这种代价确实直接消耗在普通系统管理员的身上。\n\
  \n你现在可能正在家里读这本书，并在想：这和 Python 有什么关系？嗯，关系大得很。Noah 最近的雇主 Racemi 用 Python 编写了一个全面的数据中心管理应用程序来处理虚拟化。Python\
  \ 能够并且确实在以非常底层的方式与虚拟化进行交互，从控制虚拟机到通过 Python API 将物理机迁移为虚拟机。Python 在这个新的虚拟化世界中游刃有余，可以肯定的是，无论未来的数据中心操作系统如何，它都将发挥重要作用。\n\
  \n#### VMware\n\n正如我们之前提到的，VMware 是目前虚拟化领域的强力量。程序化地完全控制虚拟机无疑是圣杯。幸运的是，有几个 API 可以查看：Perl、XML-RPC、Python\
  \ 和 C。截至目前，Python 的实现有些有限，但可能会改变。VMware 的新方向似乎在于 XML-RPC API。\n\nVMware 拥有几个不同的产品和不同的\
  \ API。你可能想要编写脚本的产品包括 `VMware Site Recovery Manager`、`VMware ESX Server`、`VMware\
  \ Server` 和 `VMware Fusion`。\n\n我们没有空间涵盖这些技术，因为它们出了本书的范围，但密切关注这些产品并研究 Python 将扮演的角色是值得的。\n\
  \n### 云计算\n\n正当虚拟化的热度平息时，云计算再次引发了热潮。简单来说，“云计算”是关于使用根据工作负载需求响应的资源。可能的两大巨头是亚马逊和谷歌。谷歌在本书出版前几周刚刚投下了“C\
  \ 语言炸弹”。它提供了一个有趣的转折，目前仅支持 Python。鉴于这是一本关于 Python 编程的书，我们确定这不会让你太失望。出于某种原因，谷歌只提供\
  \ Python 的整个过程让我们想起了美国运通的广告。\n\n在这一节中，我们将介绍处理亚马逊和谷歌 App Engine 时可能需要的一些可用 API。最后，我们将谈论这些可能如何影响系统管理。\n\
  \n## 使用 Boto 处理亚马逊服务\n\n处理亚马逊云计算基础设施的一个令人兴奋的选择是 `Boto`。通过 `Boto`，你可以完成以下操作：简单存储服务（SSS）、简单队列服务（SQS）、弹性计算云（EC2）、机械师（Mechanical\
  \ Turk）和简单数据库（SimpleDB）。由于这是一个非常新且强大的 API，我们建议你自己直接查看项目主页：[`code.google.com/p/boto/`](http://code.google.com/p/boto/)。这比我们以死树格式提供信息要好得多。\n\
  \n不过，这里有一个它如何与 SimpleDB 工作的一个简要示例：\n\n初始连接：\n\n```python\nIn [1]: import boto\n\
  In [2]: sdb = boto.connect_sdb()\n```\n\n创建一个新域（domain）：\n\n\n\n\n\n```\nIn [3]:\
  \ domain = sdb.create_domain('my_domain')\n```\n\n添加新项目：\n\n```\nIn [4]: item =\
  \ domain.new_item('item')\n```\n\n这是目前 API 运行方式的初步感受，但你应该查看 `svn` 仓库中的测试代码，以真实了解其工作原理：[`code.google.com/p/boto/source/browse`](http://code.google.com/p/boto/source/browse)。顺便提一下，查看测试是理解新库如何工作的最佳方式之一。\n\
  \n#### Google App Engine\n\nGoogle App Engine 以测试版的形式发布，从宣布的那天起就引起了巨大的轰动。它让你能够免费在\
  \ Google 的基础设施上运行应用程序。目前，App Engine 应用拥有严格的 Python API，但这在未来可能会发生变化。App Engine 的另一个有趣之处是，它还与\
  \ Google 的其他服务集成。\n\n## 名人简介：Google App Engine 团队：Kevin Gibbs\n\n![Kevin Gibbs](img/00007.jpg)\n\
  \nKevin Gibbs 是 Google App Engine 的技术主管。Kevin 于 2004 年加入 Google。在从事 Google App Engine\
  \ 工作之前，Kevin 曾在 Google 的系统基础设施小组工作了多年，在那里他负责 Google 产品和服务的底层集群管理系统。Kevin 还是 Google\
  \ Suggest 的创建者，该产品会在用户输入时提供交互式搜索建议。在加入 Google 之前，Kevin 曾在 IBM 的高级互联网技术小组工作，专注于开发工具。\n\
  \n这对系统管理员产生的影响之一是：将过去存在于你自己的数据中心的大部分内容托管到另一个数据中心正变得越来越可行。掌握如何与 Google App Engine\
  \ 交互可能成为系统管理员的一项杀手级新技能，因此研究非常有意义。我们采访了 App Engine 团队的几位成员，并与他们交流这将如何影响系统管理员。他们提到了以下任务：\n\
  \n1. **批量数据上传器**：[`code.google.com/appengine/articles/bulkload.html`](http://code.google.com/appengine/articles/bulkload.html)。\n\
  \   系统管理员经常需要处理大数据的迁移，而这是一个在 Google App Engine 应用背景下执行此类操作的工具。\n\n2. **日志记录**：[`code.google.com/appengine/articles/logging.html`](http://code.google.com/appengine/articles/logging.html)。\n\
  \n3. **邮件 API**：`send_mail_to_admins()` 函数：[`code.google.com/appengine/docs/mail/functions.html`](http://code.google.com/appengine/docs/mail/functions.html)。\n\
  \   在系统管理员的上下文中，这可能对监控有用。对于重要的异常或关键操作，你可以自动向应用的管理员发送电子邮件。\n\n4. **定期任务的 Cron 任务**。\n\
  \   这并不是 Google App Engine 的直接组成部分，但你可以在自己的服务器上使用 `cron` 按固定间隔向你的应用发送请求。例如，你可以设置一个\
  \ `cron` 每小时访问一次 [`yourapp.com/emailsummary`](http://yourapp.com/emailsummary)，从而触发向管理员发送一封包含过去小时重要事件总结的邮件。\n\
  \n5. **版本管理**：[`code.google.com/appengine/docs/configuringanapp.html#Required_Elements`](http://code.google.com/appengine/docs/configuringanapp.html#Required_Elements)。\n\
  \   为你为应用设置的必填字段之一是“版本”。每当你上传具有相同版本 ID 的应用时，它都会用新代码替换旧代码。如果你更改版本 ID，可以在生产环境中运行多个版本的应用，并使用管理控制台选择哪个版本接收实时流量。\n\
  \n## 构建示例 Google App Engine 应用程序\n\n要开始构建 Google App Engine ，你首先需要在这里下载 Google app\
  \ engine 的 SDK：[`code.google.com/appengine/downloads.html`](http://code.google.com/appengine/downloads.html)。你可能通过阅读这个\
  \ Google App Engine 优秀的教程获得收益：[`code.google.com/appengine/docs/gettingstarted/`](http://code.google.com/appengine/docs/gettingstarted/)。\n\
  \n在本节中，我们提供一个关于 Google App Engine 的反向教程，因为已经有一个非常优秀的教程了。如果你访问 [`greedycoin.appspot.com/`](http://greedycoin.appspot.com/)，你可以测试我们将涵盖的内容的运行版本，以及最新版本的源代码。该应用程序接收更改作为输入，将其存储在数据库中，然后返回正确的更改。它还具有通过\
  \ Google 身份验证 API 登录并执行近期操作查询的能力。参见示例 8-13](#Python_for_U-Administration_split_147.html_filepos934869)。\n\
  \n示例 8-13. Greedy coin Web 应用程序\n\n```python\n#!/usr/bin/env python2.5\n#Noah Gift\n\
  import decimal\nimport wsgiref.handlers\nimport os\nfrom google.appengine.api import\
  \ users\nfrom google.appengine.ext import webapp\nfrom google.appengine.ext import\
  \ db\nfrom google.appengine.ext.webapp import template\n\nclass ChangeModel(db.Model):\n\
  \    user = db.UserProperty()\n    input = db.IntegerProperty()\n    date = db.DateTimeProperty(auto_now_add=True)\n\
  \nclass MainPage(webapp.RequestHandler):\n    \"\"\"主页视图\"\"\"\n    def get(self):\n\
  \        user = users.get_current_user()\n        if users.get_current_user():\n\
  \            url = users.create_logout_url(self.request.uri)\n            url_linktext\
  \ = 'Logout'\n        else:\n            url = users.create_login_url(self.request.uri)\n\
  \            url_linktext = 'Login'\n        template_values = {\n            'url':\
  \ url,\n            'url_linktext': url_linktext\n        }\n        path = os.path.join(os.path.dirname(__file__),\
  \ 'index.html')\n        self.response.out.write(template.render(path, template_values))\n\
  \nclass Recent(webapp.RequestHandler):\n    \"\"\"查询 10 个请求\"\"\"\n    def get(self):\n\
  \        # 集合\n        collection = []\n        # 从 datastore 获取 10 条记录\n      \
  \  query = ChangeModel.all().order('-date')\n        records = query.fetch(10)\n\
  \        # 格式化\n        for change in records:\n            collection.append(decimal.Decimal(change.input)/100)\n\
  \        template_values = {\n            'inputs': collection,\n            'records':\
  \ records\n        }\n        path = os.path.join(os.path.dirname(__file__), 'query.html')\n\
  \        self.response.out.write(template.render(path, template_values))\n\nclass\
