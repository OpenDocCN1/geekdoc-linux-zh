  \ pysysinfo_func_2.main()\nGathering system information with uname command:\nDarwin\
  \ Macintosh-8.local 9.2.2 Darwin Kernel Version 9.2.2:\n  Tue Mar  4 21:17:34 PST\
  \ 2008; root:xnu-1228.4.31~1/RELEASE_I386 i386\nGathering diskspace information\
  \ df command:\nFilesystem      Size   Used  Avail Capacity  Mounted on\n/dev/disk0s2\
  \    93Gi   88Gi  4.1Gi    96%    /\ndevfs          110Ki  110Ki   0Bi   100%  \
  \  /dev\nfdesc          1.0Ki  1.0Ki   0Bi   100%    /dev\nmap -hosts       0Bi\
  \    0Bi    0Bi   100%    /net\nmap auto_home    0Bi    0Bi    0Bi   100%    /home\n\
  /dev/disk1s2   298Gi  105Gi  193Gi    36%    /Volumes/Backup\n/dev/disk2s3   466Gi\
  \  240Gi  225Gi    52%    /Volumes/EditingDrive\n```\n\n如果你仔细看，你会发现我们运行了其他两个函数。记住，`main`\
  \ 函数会一次性运行所有内容。\n\n\n\n\n```python\ndef tmp_space():\n    tmp_usage = \"du\"\n \
  \   tmp_arg = \"-h\"\n    path = \"/tmp\"\n    print \"Space used in /tmp directory\"\
  \n    subprocess.call([tmp_usage, tmp_arg, path])\n\ndef main():\n    disk_func()\n\
  \    tmp_space()\n\nif __name__ == \"__main__\":\n    main()\n```\n\n在这个示例中，我们不仅重用了之前编写的代码，还使用了一种特殊的\
  \ Python 语法，它允许我们导入所需的精确函数。重用代码的趣味之处在于，仅仅通过从上一个程序中导入函数，就可以编写出一个完全不同的程序。注意，在 `main`\
  \ 方法中，我们混合了我们创建的其他模块中的函数 `disk_func()` 以及我们在这个文件中新创建的函数。\n\n在这一节中，我们学习了代码重用的威力以及它实际上是多么简单。简而言之，你在一个文件中放置一个或几个函数，然后如果你也想让它作为脚本运行，就放上那个特殊的\
  \ `if __name__ == \"__main__\":` 语法。之后，你可以将这些函数导入 IPython，或者简单地在另一个脚本中重用它们。有了你刚刚学到的信息，你变得非常“危险”了。你可以编写一些相当复杂的\
  \ Python 模块，并反复重用它们来创建新工具。\n\n# 第 2 章 IPython\n\nPython 的优势之一是它的交互式解释器，或者说 shell（终端）。shell\
  \ 提供了一种快速测试想法、测试你正在处理的模块的功能和接口的方法，并执行某些一次性任务，否则你可能得编写一个三行的脚本。我们倾向的编码方式是同时运行文本编辑器和\
  \ Python 提示符（实际上是 IPython 提示符，我们稍后会提到），频繁地与两者交互，在 shell 和编辑器之间来回，并经常将代码从一个粘贴到另一个。这种方法允许我们能够看到\
  \ Python 处理代码方式的即时结果，并让让文本编辑器中的代码快速地按照我们想要的方式运行。\n\nIPython 的核心是一系列交互式 Python 的良性组合。它是一个\
  \ amazing Python shell，远优于标准的 Python shell。它还提供了创建高度自定义的控制台命令环境的能力；它允许将交互式 Python\
  \ 解释器轻松包含在任何 Python 应用中；它甚至可以作为系统 shell 使用并取得了某种成功。本章将重点关注使用 IPython 提高你在 nix-shell\
  \ 和 Python 相关任务上的工作效率。\n\nIPython 背后还有一个非常活跃且非常有帮助的社区。你可以访问 [`lists.ipython.scipy.org/mailman/listinfo/ipython-user`](http://lists.ipython.scipy.org/mailman/listinfo/ipython-user)\
  \ 注册邮件列表。[`ipython.scipy.org/moin`](http://ipython.scipy.org/moin) 有一个非常优秀的 wiki。而且作为\
  \ wiki 的一部分，[`ipython.scipy.org/moin/Cookbook`](http://ipython.scipy.org/moin/Cookbook)\
  \ 中有一份食谱。因此，你可以根据意愿阅读或贡献这些任何一个资源。你可以贡献的另一个领域是 IPython 的开发。IPython 开发最近切换到了分布式版本控制系统，所以你只需要分支他们的代码并开始黑客编程。如果你做了对他人有益的事，可以将你的更改提交给他们。\n\
  \n***\n\n### 人物简介：IPython：Fernando Perez\n\n![Fernando Perez](img/00002.jpg)\n\n\
  Fernando Perez 获得了物理学博士学位，随后在科罗拉多大学的应用数学系从事数值算法开发。他目前是加州大学伯克利分校海伦·威尔神经科学的研究的研究员，专注于脑成像问题的新分析方法和高级科学计算工具。在研究生学习的后期，他参与了用于科学计算的\
  \ Python 工具的开发。他在 2001 年启动了开源 IPython 项目，当时他正在为日常科学任务寻找一种更高效的交互式工作流。得益于不断增长的合作社区，这个项目多年来已经变得对科学领域之外的程序员同样有用。\n\
  \n***\n\n***\n\n### 人物简介：IPython：Ville Vainio\n\n![Ville Vainio](img/00003.jpg)\n\
  \nVille Vainio 于 2003 年从芬兰的萨塔昆塔应用科学大学波里技术学院获得软件工程学士学位。在本书编写期间，他在 Digia Plc 的智能手机部门担任软件专家，为\
  \ Nokia 和 UIQ 的 Symbian 平台进行 C++ 开发。在学习期间，他在 Cimcorp Oy 担任软件工程师，使用 Python 为工业机器人开发通信软件。Ville\
  \ 是 IPython 的长期爱好者，自 2006 年 1 月以来一直是稳定分支（0.x 系列）的维护者。他的 IPython 工作始于一系列补丁，使 IPython\
  \ 在 Windows 上作为系统 shell 表现更好，系统 shell 用例仍然是他个人关注的重点。他与未婚妻住在芬兰的波里，并在坦佩瑞理工大学波里分部进行硕士论文项目，该项目是\
  \ ILeo（基于 IPython Leo 的笔记本）。\n\n***\n\n# 安装 IPython\n\n安装 IPython 有几种方法。第一种最原始的是源码分发。IPython\
  \ 的下载页面位于 [`ipython.scipy.org/dist/`](http://ipython.scipy.org/dist/)。在本书编写时，最新的\
  \ IPython 版本是 0.8.2，而 0.8.3 即将完成。要从源码安装，请访问 [`ipython.scipy.org/dist/ipython-0.8.2.tar.gz`](http://ipython.scipy.org/dist/ipython-0.8.2.tar.gz)\
  \ 并下载 `tar.gz` 文件。使用 `tar zvf ipython-0.8.2.tar.gz` 解压。解压后的目录包含一个 `setup.py` 文件。用\
  \ Python 调用 `setup.py` 并带有 `install` 参数（例如 `python setup.py install`）。这将库安装到你的 `site-packages`\
  \ 目录，并在 `scripts` 目录中创建 `ipython` 脚本。在 UNIX 上，这通常是 python 二进制所在的目录。如果你使用的是通过包管理器安装的\
  \ python，它（以及 IPython）可能位于 `/usr/bin/`。我们安装了最新开发版本的源码，所以你会看到 0.8.3。\n\n安装 IPython\
  \ 的另一种方法是使用系统包系统的包。在 Debian 和 Ubuntu 上，可以安装 `.deb` 包。安装命令为 `apt-get install ipython`。Ubuntu\
  \ 将 IPython 库安装到适当的位置（`/usr/share/python-support/ipython/`，带有许多 `.pth` 文件和符号链接以确保正常工作）。它还将\
  \ `ipython` 二进制文件安装到 `/usr/bin/ipython`。\n\n安装 IPython 的第三种方法是使用 Python 包。你可能不知道存在\
  \ Python 包，但它们确实存在。Python 包是打包成 ZIP 格式的文件，生成的文件具有 `.egg` 扩展名。Eggs（通常直接称为 egg）可以使用\
  \ `easy_install` 工具安装。`easy_install` 的酷功能之一是它会检查中央 egg 仓库，然后确定需要安装什么。背后还有更多复杂的机制，但对于用户来说，相对简单，该仓库被称为\
  \ Python 包索引，简称为 PyPI（尽管有些人亲切地称之为 Python 奶酪）。要 `easy_install` IPython，只需以具有写入 Python\
  \ `site-packages` 目录权限的用户身份登录并运行 `easy_install ipython` 即可。\n\n\n\n\n第四种方案是完全不安装就使用\
  \ IPython。“什么？”你可能会这样问。其实，如果你下载了源码分发包并直接在该文件根目录下运行 `ipython.py`，你将获得你下载的 IPython\
  \ 运行实例。如果你不想弄乱你的 `site-packages` 目录，这是一种非常有用的方法，但你希望注意一些局限性。如果你在解压的目录中运行 IPython\
  \ 且没有修改 `PYTHONPATH` 环境变量，你将无法将其作为库使用。\n\n# 基础概念\n\n在安装 IPython 之后，当你第一次运行 `ipython`\
  \ 时，你会看到类似下面的内容：\n\n```\njmjones@dink:~$ ipython\n**********************************************************************\n\
  欢迎来到 IPython。我将尝试创建一个个人配置目录，\n你可以在此处自定义 IPython 功能的许多方面：\n/home/jmjones/.ipython\n\
  安装成功！\n请阅读 IPython 手册中的“初始配置”和“快速提示”章节\n（分发版提供了 HTML 和 PDF 版本），以确保你的系统环境已正确配置，以便利用\
  \ IPython 的功能。\n重要提示：配置系统已经更改！旧系统仍然存在，\n但其设置可能会被 \"~/.ipython/ipy_user_conf.py\"\
  \ 配置文件的设置部分覆盖。\n如果某些新设置让你感到困扰，请查看该文件。\n按 <RETURN> 启动 IPython。\n```\n\n按下回车键后，光标将在提示符处等待你，IPython\
  \ 将显示以下文本：\n\n```\njmjones@dinkgutsy:stable-dev$ python ipython.py\nPython 2.5.1\
  \ (r251:54863, Mar   7 2008, 03:39:23)\n输入 \"copyright\", \"credits\" 或 \"license\"\
  \ 获取更多信息。\nIPython 0.8.3.bzr.r96 -- 一个增强型的交互式 Python。\n?         -> IPython 功能介绍和概述。\n\
  %quickref -> 快速参考。\nhelp      -> Python 自身的帮助系统。\nobject?   -> 关于 'object' 的详情。object\
  \ 同样有效，?? 可打印更多。\nIn [1]:\n```\n\n## 与 IPython 交互\n\n第一次面对一个新的 shell 提示符时，感到有些无所措是很正常的。完全\
  \ own 清楚该做什么并不直观。记得你第一次登录 Unix 终端并看到 `(ba|k|c|z)sh` 提示符时吗？既然你正在阅读这本书，我们假设你对 Unix\
  \ shell 有了一定程度的熟悉。如果是这样，那么掌握 IPython 将是非常的。\n\n当你第一次看到 IPython 提示符时不清楚该做什么的原因之一，是因为你可以做的事情几乎是无限制的。因此，从“你想做什么”的角度来思考更为合适。在\
  \ IPython 提示符中，你可以使用 Python 语言的所有功能。此外，还有许多 IPython “魔术”函数供你使用。你还可以轻松地在 IPython\
  \ 中执行任何 Unix shell 命令，并将输出存储到 Python 变量中。接下来的几个示例将展示在默认配置下你可以从 IPython 什么。\n\n以下是几次简单赋值操作的输入输出：\n\
  \n```\nIn [1]: a = 1\nIn [2]: b = 2\nIn [3]: c = 3\n```\n\n这与你在标准 Python 提示符中输入相同的内容看起来没有太大。我们只是将\
  \ 1, 2, 3 分别赋值给 `a`、`b`、`c`。你会在 IPython 和标准 Python shell 之间看到的最大区别是 IPython 为你提供了带编号的提示符。\n\
  \n现在我们已经将值（1, 2 和 3）存储在几个变量（分别为 `a`、`b` 和 `c`）中，我们可以看到这些变量的值：\n\n```\nIn [4]: print\
  \ a\n1\nIn [5]: print b\n2\nIn [6]: print c\n3\n```\n\n这是一个人为的示例。我们只是输入了值，所以最坏的情况下只需向上滚动查看值即可。我们显示的每个变量都比显示其值所需的多了六个字符。这里有一种稍微简洁的显示值的方法：\n\
  \n```\nIn [7]: a\nOut[7]: 1\nIn [8]: b\nOut[8]: 2\nIn [9]: c\nOut[9]: 3\n```\n\n\
  虽然输出的值看起来几乎相同，但存在区别。`print` 语句使用的是“非官方”的字符串表示，而裸变量名则使用“官方”的字符串表示。当你处理自定义类时，这种区别通常比处理内置类时更重要。以下是不同字符串表示使用的示例：\n\
  \n```\nIn [10]: class DoubleRep(object):\n....:     def __str__(self):\n....:  \
  \       return \"Hi, I'm a string!\"\n....:     def __repr__(self):\n....:     \
  \    return \"<DoubleRep object at ...>\"\nIn [11]: dr = DoubleRep()\nIn [12]: print\
  \ dr\nHi, I'm a string!\nIn [13]: dr\nOut[13]: <DoubleRep object at ...>\n```\n\
  *(注：原文最后部分的文本存在大量重复和损坏，我已根据标准 Python 行为重构了示例的逻辑，并保持了要求的格式。)*\n\n\n\n\n标准的 Python\
  \ 提示符甚至没有区分这两种类型的输出。如果你在 IPython 提示符中输入的语句求出的值是 `None` 以外的值，IPython 将其写入到以 `Out`\
  \ 开头的行中，后面跟着一个括号内的数字、一个冒号，最后是该语句求出的值（即 `Out[1]: 1`）。下面的示例展示了当 IPython 将整数赋值给变量、评估该变量、显示其值并打印该值时的情况。请注意给变量赋值、显示变量求值值以及打印变量值这些任务之间的区别。首先是\
  \ IPython 提示符：\n\n```\nIn [1]: a = 1\nIn [2]: a\nOut[2]: 1\nIn [3]: print a\n1\n\
  In [4]:\n```\n\n接下来，是标准的 Python 提示符：\n\n```\n>>> a = 1\n>>> a\n1\n>>> print a\n\
  1\n>>>\n```\n\n在 IPython 和 Python 赋值整数的方式、IPython 提示符以及标准 Python 提示符之间，没有区别。它们都立即向用户返回了输入提示符。但在显示变量的“官方”字符串表示时，IPython\
  \ 和标准 Python 是不同的。IPython 只显示 `Out` 提示符，而 Python 显示了输出。对于打印，则没有区别；两者都显示了输出且没有提示符。\n\
  \n这种 `In [some number]:` 和 `Out [some number]:` 的机制可能会让你好奇 IPython 和标准 Python 之间是否存在更深层次的区别，或者这种区别是否仅仅是外观上的。区别绝对要深得多。事实上，这种区别代表了一个功能领域，使得\
  \ IPython 处于一个与标准 Python shell 不同的交互式 shell 中。\n\n有两个你想要注意的内置变量。它们是 `In` 和 `Out`。前者是一个\
  \ IPython 输入 `list` 对象，后者是一个 `dict` 对象。以下是 `type` 对 `In` 和 `Out` 的输入和输出的说明：\n\n\
  ```\nIn [1]: type(In)\nOut[1]: <class 'IPython.iplib.InputList'>\nIn [2]: type(Out)\n\
  Out[2]: <type 'dict'>\n```\n\n在你开始使用 `In` 和 `Out` 之后，这一切就说得通了。\n\n那么，这些数据类型持有什么内容呢？\n\
  \n```\nIn [3]: print In\n['\\n', u'type(In)\\n', u'type(Out)\\n', u'print In\\n']\n\
  In [4]: print Out\n{1: <class 'IPython.iplib.InputList'>, 2: <type 'dict'>}\n```\n\
  \n正如你所预期的，`In` 和 `Out` 分别持有你输入的输入以及非 `None` 语句和表达式所求出的输出。由于每一行都必须有输入，在某种列表类的结构中跟踪输入似乎是合理的。但在列表类的结构中跟踪输出会导致许多空字段或仅包含\
  \ `None` 的字段。因此，由于并非每一行都有可评估非 `None` 输出，在字典类数据结构甚至在纯 `dict` 对象中跟踪输出是合理的合理的。\n\n\
  ## Tab 补全（Tab Completion）\n\nIPython 另一个极其实用的数据输入功能是默认的 Tab 补全。标准的 Python shell\
  \ 如果带有 readline 支持编译也具有 Tab 补全功能，但你必须执行如下的操作：\n\n```\n>>> import rlcompleter, readline\n\
  >>> readline.parse_and_bind('tab: complete')\n```\n\n这将带带我们如下的功能：\n\n```\n>>> import\
  \ os\n>>> os.lis<TAB>\n>>> os.listdir\n>>> os.li<TAB><TAB>\nos.linesep  os.link\
  \     os.listdir\n```\n\n在导入 `rlcompleter` 和 `readline` 并设置 readline tab 补全选项后，我们能够导入\
  \ `os`，输入 `os.lis`，按一次 Tab 键将其补全为 `os.listdir`。我们还可以输入 `os.li`，按两次 Tab 键，获取可能的补全列表。\n\
  \n在 IPython 中，我们不需要任何额外配置就能获得相同的行为。嗯，这在标准 Python shell 中也是免费的，但在 IPython 中，它是默认行为。以下是使用\
  \ IPython 运行之前的示例：\n\n```\nIn [1]: import os\nIn [2]: os.lis<TAB>\nIn [2]: os.listdir\n\
  In [2]: os.li<TAB>\nos.linesep  os.link     os.listdir\n```\n\n注意，在示例的最后部分我们只需要按一次\
  \ Tab 键。\n\n`os.TAB` 示例实际上只展示了 IPython 的属性查找和补全功能，但 IPython 能够补全的另一个酷功能是模块导入。打开一个新的\
  \ IPython shell，以便看到 IPython 如何帮助我们找到要导入的模块：\n\n```\nIn [1]: import o\nopcode  \
  \    operator    optparse     os           os2emxpath   ossaudiodev  \nIn [1]: import\
  \ xm\nxml        xmllib\n```\n\nIPython 提供了两种类型的补全：“完成”（complete）和“菜单补全”（menu-complete）。两者的区别在于，“完成”尽可能地扩展单词并提供一个备选项列表，而“菜单补全”则每次按下\
  \ Tab 键都会将单词转换为替代方案。IPython 的默认选项是“完成”。\n\n\n\n在开始之前，你需要了解的最后一个“基础”信息是如何配置 IPython。如果你在第一次运行\
  \ IPython 时没有指定不同的位置，它会在你的主目录中创建一个 `.ipython` 目录。在 `.ipython` 目录内部有一个名为 `ipy_user_conf.py`\
  \ 的文件。这个用户文件仅仅是一个使用 Python 语法的配置文件。为了帮助你赋予 IPython 你所想要的外观和感受，该配置文件包含了许多你可以自定义的元素。例如，你可以选择\
  \ shell 使用的颜色、shell 提示符（prompt）的组件，以及在你使用 `%edit` 文本时自动使用的文本编辑器。我们在这里不会介绍更多细节。只需要知道该配置文件存在，并且值得过目一遍，看看是否有你需要或想要配置的元素。\n\
  \n# 魔法函数（Magic Functions）的帮助\n\n正如我们已经所说的，IPython 非常强大。这种强大性的之一是它有几乎多到令人惊叹的内置魔法函数。什么是魔法函数呢？IPython\
  \ 文档是这样说的：\n\n> IPython 将任何第一个字符为 % 的行视为对“魔法”函数的特殊调用。这些函数允许你控制 IPython 本身的行为，以及许多系统类型的功能。它们都以\
  \ % 字符为前，但提供参数时不需要加括号或引号。例如：输入‘%cd mydir’（不带引号）会将你的工作目录更改为‘mydir’（如果它存在）。\n\n两个“魔法”函数可以帮助你理清所有功能，并筛选出哪些对你可能有用。我们将看到的第一个魔法帮助函数是\
  \ `lsmagic`。`lsmagic` 会列出所有“魔法”函数。以下是运行 `lsmagic` 的输出：\n\n```\nIn [1]: lsmagic\n\
  Available magic functions:\n%Exit  %Pprint  %Quit  %alias  %autocall  %autoindent\
  \  %automagic  %bg\n%bookmark  %cd  %clear  %color_info  %colors  %cpaste  %debug\
  \  %dhist  %dirs\n%doctest_mode  %ed  %edit  %env  %exit  %hist  %history  %logoff\
  \  %logon\n%logstart  %logstate  %logstop  %lsmagic  %macro  %magic  %p  %page \
  \ %pdb\n%pdef  %pdoc  %pfile  %pinfo  %popd  %profile  %prun  %psearch  %psource\n\
  %pushd  %pwd  %pycat  %quickref  %quit  %r  %rehash  %rehashx  %rep  %reset\n%run\
  \  %runlog  %save  %sc  %store  %sx  %system_verbose  %time  %timeit\n%unalias \
  \ %upgrade  %who  %who_ls  %whos  %xmode\nAutomagic is ON, % prefix NOT needed for\
  \ magic functions.\n```\n\n如你所见，可用的函数数量多到几乎难以处理。事实上，截至本文写作，有 69 个魔法函数供你使用。你可能会发现这样列出魔法函数是有帮助的：\n\
  \n```\nIn [2]: %<TAB>\n%Exit            %debug           %logstop         %psearch\
  \         %save\n%Pprint          %dhist           %lsmagic         %psource   \
  \      %sc\n%Quit            %dirs            %macro           %pushd          \
  \ %store\n%alias           %doctest_mode    %magic           %pwd             %sx\n\
  %autocall        %ed              %p               %pycat          %system_verbose\n\
  %autoindent      %edit            %page            %quickref        %time\n%automagic\
  \       %env             %pdb            %quit           %timeit\n%bg          \
  \    %exit            %pdef            %r              %unalias\n%bookmark     \
  \   %hist            %pdoc            %rehash         %upgrade\n%cd            \
  \  %history         %pfile           %rehashx         who\n%clear            %logoff\
  \          %pinfo           %rep             %who_ls\n%color_info      %logon  \
  \         %popd            %reset          %whos\n%colors          %logstart   \
  \     %profile         %run             %xmode\n%cpaste          %logstate     \
  \   %prun             %runlog\n```\n\n输入 `%TAB` 将为你提供所有 69 个 `magic` 函数更美观的视图。使用\
  \ `lsmagic` 函数和 `%TAB` 的意义是在你寻找某些内容时，快速查看所有可用函数的摘要。或者，你可以使用它们来快速浏览所有函数以查看哪些可用。但除非你看到描述，否则列表并不能帮助你理解每个函数的作用。\n\
  \n这正是下一个帮助函数 `magic` 派上用场的地方。这个魔法函数的名字就“magic”。运行 `magic` 会弹出一个程序用于 IPython 中所有内置魔法函数的分页帮助文档。帮助格式包含了函数名、函数的用法（如果适用）以及函数工作方式的描述。以下是魔法函数\
  \ `page` 的帮助信息：\n\n```%page:\n  美化打印对象并通过分页器显示它。\n  %page [options] OBJECT\n  如果没有给出对象，则使用\
  \ _ (最后输出)。\n  Options:\n    -r: page str(object), don't pretty-print it.\n```\n\
  \n取决于你使用的分页器（pager），你可以搜索并滚动 `magic` 函数。如果你知道要查看某个函数并想查找它，这会非常方便。函数按字母顺序排列，这可以帮助你找到要查找的内容。你还可以使用另一个帮助方法，我们将在本章节介绍。当你输入魔法函数的名称后跟一个问号（?），它将给你与\
  \ `%magic` 相同的信息。这里是 `%page ?` 的输出：\n\n```\nIn [1]: %page ?\nType:           Magic\
  \ function\nBase Class:     <type 'instancethod'>\nString Form:    <bound method\
  \ InteractiveShell.page of\n                 <IPython.iplib.InteractiveShell object\
  \ at 0x2ac542b8a10>>\nNamespace:      IPython\nFile:           /home/mjones/local/python2.5/site-packages/IPython/Magic.py\n\
  Definition:     %page(self, parameter='')\nDocstring:\n  美化打印并并通过分页显示。\n  %page\
  \ [options] OBJECT\n  如果没有给出对象，则使用 _ (最后输出)。\n  Options:\n    -r: page str(object),\
  \ don't pretty-print it.\n```\n\n最后一部分帮助。在提示符处输入 `%quickref` 时，你会看到：\n\n```\nIPython\
  \ -- 快速参考卡\n================================\nobj?, obj?? : 获取对象的帮助，或获取对象的更多帮助（同样适用于\
  \ ?obj）。\nfoo.*abc* : 列出 foo 中包含这些内容的名称。\n%magic : 关于 IPython 的 % 函数的信息。\n魔法函数以\
  \ % 为前缀，通常在传递参数时不需要加括号、引号甚至逗号，非常方便。\n示例函数调用：\n%alias d -F : 'd' 现在是 'ls -F' 的别名。\n\
  alias d -F : 如果 'alias' 不是 Python 名称则有效。\nalist = %alias : 获取别名列表到 alist\ncd /usr/share\
  \ : 显而易见。使用 cd -tab> 从访问过的目录中选择。\n%cd?? : 查看魔法 %cd 的帮助和源代码\n系统命令：\n!cp a.txt b/\
  \ : 系统命令转义，调用 os.system()\ncp a.txt b/ : 执行 %rehashx 后，大多数系统命令不需要 ! 即可工作\ncp ${f}.txt\
  \ $bar : 魔法和系统命令中的变量扩展\nfiles = !ls /usr : 捕捉系统命令输出\nfiles.s, files.l, files.n:\
  \ \"a b c\", ['a','b','c'], 'a\\nb\\nc'\n```\n\n\n\n\n\n`打印所有交互式变量，带有一些基本的格式。`\n\
  \n`%who_ls:`\n`返回所有交互式变量排序列表。`\n\n`%whos:`\n`类似于 %who，但提供了关于每个变量的额外信息。`\n\n`%xmode:`\n\
  `切换异常处理程序的模式。`\n\n`%quickref` 的开头是对 IPython 各种使用场景的引用。`%quickref` 的其余部分是每个 `%magic`\
  \ 函数的简摘要。`%quickref` 中的每个简摘要都包含了在其他地方找到的每个 `%magic` 函数完整帮助的第一行。例如，这里是 `%who` 的完整帮助描述：\n\
  \n```\nIn [1]: %who ?\nType:           Magic function\nBase Class:     <type 'instancemethod'>\n\
  String Form:    <bound method InteractiveShell.magic_who of\n                  <IPython.iplib.InteractiveShell\
  \ object at 0x2ac9f449da10>>\nNamespace:      IPython internal\nFile:          \
  \ /home/jmjones/local/python/psa/lib/python2.5/site-packages/IPython/\n        \
  \          Magic.py\nDefinition:     who(self, parameter_s='')\nDocstring:\n   \
  \ Print all interactive variables, with some minimal formatting.\n    If any arguments\
  \ are given, only variables whose type matches one of\n    these are printed. For\
  \ example:\n      %who function str\n    will only list functions and strings, excluding\
  \ all other types of\n    variables. To find the proper type names, simply use type(var)\
  \ at a\n    command line to see how python prints type names. For example:\n   \
  \   In [1]: type('hello')\n      ...\n    indicates that the type name for strings\
  \ is 'str'.\n    %who 总是排除通过你的配置文件加载的执行名称\n    以及 IPython 内部的项。\n    这是刻意为之，因为通常你可能会加载许多模块，\n\
  \    %who 的目的是只向你显示你手动定义的内容。\n```\n\n`%quickref` 中 `%who` 的帮助行与 `%who ?` 返回的 `Docstring`\
  \ 第一行完全相同。\n\n# Unix Shell\n\n在 Unix shell 中工作无疑有其优势（例如解决问题的统一方法、丰富的工具集、相当简洁但简单的语法、标准\
  \ I/O 流、管道和重定向等），但我们能够为这位老友增添 Python 的元素也是非常好的。IPython 有一些功能让这两者的桥接变得非常有价值。\n\n\
  ## alias\n\n我们将查看的 Python/Unix shell 桥接的第一个功能是 `alias` 魔法术函数。通过 `alias`，你可以创建一个\
  \ IPython 快捷方式来执行系统命令。要定义别名，只需输入 `alias` 后紧跟系统命令（以及该命令的任何参数）。例如：\n\n```\nIn [1]:\
  \ alias nss netstat -lptn\nIn [2]: nss\n(无法识别所有进程，将不会显示非拥有的进程信息，\n你必须拥有 root 权限才能查看所有内容。)\n\
  Active Internet connections (only servers)\nProto Recv-Q Send-Q Local Address  \
  \         Foreign Address         State      \ntcp        0      0 0.0.0.0:80  \
  \            0.0.0.0:*               LISTEN                        \ntcp       \
  \ 0      0 127.0.0.1:631           0.0.0.0:*               LISTEN              \
  \          \n```\n\n有几种方法可以向别名传递不同的输入。一种方案是“无所作为”（do-nothing）方法。如果你想传递给命令的所有额外内容都可以合并在一起，那么“无所作为”方法可能适合你。例如，如果你想对\
  \ `netstat` 命令的结果进行 `grep 80`，你可以这样做：\n\n```\nIn [3]: nss | grep 80\n(无法识别所有进程，将不会显示非拥有的进程信息，\n\
  你必须拥有 root 权限才能查看所有内容。)\ntcp        0      0 0.0.0.0:80            0.0.0.0:*   \
  \            LISTEN  -传递了额外的选项，但由于其执行方式，最终结果是一样的。\n```\n\n接下来，是“无所不包”（do-everything）方法。它与“无所作为”方法非常相似，区别在于，通过隐式处理所有参数，你显式地处理了所有后续参数。这里有一个展示了如何将后续参数视为一个组的示例：\n\
  \n```\nIn [1]: alias achoo echo \"%l|\"\nIn [2]: achoo ||\nIn [3]: achoo these args|these\
  \ args|\n```\n\n这演示了 `%l`（百分号后跟字母 l）语法，该语法用于将行的剩余部分插入别名中。在现实生活中，你最可能会用它将所有内容插入别名所处命令的中间某个位置。这里是显式处理所有参数的“无所不包”示例：\n\
  \n```\nIn [1]: alias nss netstat -lptn %l\nIn [2]: nss\n(无法识别所有进程，将不会显示非拥有的进程信息，\n\
  你必须拥有 root 权限才能查看所有内容。)\nActive Internet connections (only servers)\nProto Recv-Q\
  \ Send-Q Local Address           Foreign Address         State      \ntcp      \
  \  0      0 0.0.0.0:80            0.0.0.0:*               LISTEN               \
  \         \ntcp        0      0 127.0.0.1:631           0.0.0.0:*              \
  \ LISTEN                        \nIn [3]: nss | grep 80\n(无法识别所有进程，将不会显示非拥有的进程信息，\n\
  你必须拥有 root 权限才能查看所有内容。)\n```\n\n在这个示例中，我们根本不需要把 `%l` 放那里。如果我们只是漏掉它，也会得到相同的结果。\n\n\
  为了在整个命令字符串中插入不同的参数，我们将使用 `%s` 替换字符串。这个示例展示了如何运行这些参数：\n\n```\nIn [1]: alias achoo\
  \ echo first: \"%s| second: \"%s|\"\nIn [2]: achoo foo bar\nfirst: |foo|, second:\
  \ |bar|\n```\n\n然而，这可能会有些问题。如果你只提供了一个参数而预期两个，你可能会遇到错误：\n\n```\nIn [3]: achoo foo\n\
  ERROR: Alias <achoo> requires 2 arguments, 1 given.\n-----------------------------------------------------------\n\
  AttributeError                            Traceback (most call last)\n```\n\n另一方面，提供比预期更多的参数是安全的：\n\
  \n```\nIn [4]: achoo foo bam\nfirst: |foo|, second: |bar| bam\n```\n\n`foo` 和 `bar`\
  \ 被正确插入到了各自的位置，而 `bam` 被附加在末尾，这正是它应该放置的地方。你也可以用 `%store` 函数持久化别名，我们将在后面的章节介绍如何这样做。继续之前的示例，我们可以持久化\
  \ `achoo`，这样下次打开时就可以使用：\n\n```\nIn [5]: store achoo\nIn [6]: Do you really want\
  \ to exit ([y]/n)?\n```\n\n## Shell Execute\n\n另一种可能更简单的执行 shell 命令的方法是在前面加一个感叹号（`!`）：\n\
  \n```\nIn [1]: !netstat -lpn\n(无法识别所有进程，将不会显示非拥有的进程信息，\n你必须拥有 root 权限才能查看所有内容。)\n\
  Active Internet connections (only servers)\nProto Recv-Q Send-Q Local Address  \
  \         Foreign Address         State      \ntcp        0      0 0.0.0.0:80  \
  \            0.0.0.0:*               LISTEN                        \ntcp       \
  \ 0      0 127.0.0.1:631           0.0.0.0:*               LISTEN              \
  \          \n```\n\n你可以通过在变量前加上美元符号（`$`）将变量传递给 shell 命令。例如：\n\n```\nIn [1]: user\
  \ = 'jmjones'\nIn [2]: process = 'bash'\nIn [3]: !ps aux | grep $user | grep $process\n\
  jmjones  5967  0.0  0.4  21368  4344 pts/0   Ss+  Apr11  0:01 bash\njmjones  6008\
  \  0.0  0.4  21340  4304 pts/1   Ss   Apr11  0:02 bash\n```\n\n\n\n\n\n```\njmjones\
  \  8298  0.0  0.4  21296  4280 pts/2    Ss+  Apr11   0:04 bash\njmjones  10184 \
  \ 0.0  0.5  22644  5608 pts/3    Ss+  Apr11   0:01 bash\njmjones  12035  0.0  0.4\
  \  21260  4168 pts/15   Ss   Apr15   0:00 bash\njmjones  12943  0.0  0.4  21288\
  \  4268 pts/5    Ss   Apr11   0:01 bash\njmjones  15720  0.0  0.4  21360  4268 pts/17\
  \   Ss   02:37   0:00 bash\njmjones  18589  0.1  0.4  21356  4260 pts/4    Ss+ \
  \ 07:04   0:00 bash\njmjones  18661  0.0  0.0     320    16 pts/15   R+   07:06\
  \   0:00 grep bash\njmjones  27705  0.0  0.4  21384  4312 pts/7    Ss+  Apr12  \
  \ 0:01 bash\njmjones  32010  0.0  0.4  21252  4172 pts/6    Ss+  Apr12   0:00 bash\n\
  ```\n\n这列出了所有属于 `jmjones` 的 `bash` 会话。\n\n这里是存储 `!` 命令结果的一种示例方法：\n\n```python\n\
  In [4]: l = !ps aux | grep $user | grep $process\nIn [5]: l\nOut[5]: SList (.p,\
  \ .n, .l, .s, .grep(), .fields() available). Value:\n0: jmjones   5967  0.0  0.4\
  \  21368  4344 pts/0    Ss+  Apr11   0:01 bash\n1: jmjones   6008  0.0  0.4  21340\
  \  4304 pts/1    Ss   Apr11   0:02 bash\n2: jmjones   8298  0.0  0.4  21296  4280\
  \ pts/2    Ss+  Apr11   0:04 bash\n3: jmjones  10184  0.0  0.5  22644  5608 pts/3\
  \    Ss+  Apr11   0:01 bash\n4: jmjones   12035  0.0  0.4  21260  4168 pts/15  \
  \ Ss   Apr15   0:00 bash\n5: jmjones   12943  0.0  0.4  21288  4268 pts/5    Ss\
  \   Apr11   0:01 bash\n6: jmjones   15720  0.0  0.4  21360  4268 pts/17   Ss   02:37\
  \   0:00 bash\n7: jmjones   18589  0.0  0.4  21356  4260 pts/4    Ss+  07:04   0:00\
  \ bash\n8: jmjones   27705  0.0  0.4  21384  4312 pts/7    Ss+  Apr12   0:01 bash\n\
  9: jmjones   32010  0.0  0.4  21252  4172 pts/6    Ss+  Apr12   0:00 bash\n```\n\
  \n你可能会注意到，存储在变量 `l` 中的输出与上一个示例中的输出不同。这是因为变量 `l` 包含一个类似列表（list-）的对象，而上一个示例显示的是命令的原始输出。\n\
  \n`!` 的替代方案是 `!!`，不同在于你运行它时无法将结果存储在变量中。`!!` 的作用与 `!` 相同。在 shell 命令之前快速编写一个 `!` 或\
  \ `!!` 确实比创建一个别名（alias）要省力，但在某些情况下，你可能创建别名更好，而在其他情况下则使用 `!` 或 `!!`。例如，如果你正在输入一个预期会经常执行的命令，请创建一个别名。如果这只是一次性或低频率发生，那么直接使用\
  \ `!` 或 `!!` 即可。\n\n## rehash\n\n在 IPython 中设置别名和执行 shell 命令还有另一种选项：`rehash`。从技术上讲，这是为\
  \ shell 命令创建别名，但感觉并不像你正在进行的操作。`rehash` “魔法”函数会根据你 `PATH` 中的所有内容来更新“别名表”。你可能会问：“什么是别名表？”当你创建一个别名时，IPython\
  \ 必须将别名名称映射到你希望与之关联的 shell 命令上。别名表就是该映射发生的地方。\n\n### 注意\n\n当你看到一个以双下划线（__）开头的变量或属性名称时，通常意味着代码的作者不希望你修改它。我们在这里访问了\
  \ `__IP`，但这只是为了向你展示内部结构。如果我们想访问 IPython 的官方 API，应该使用 `_ip` 对象。\n\n## cd\n\n如果你使用的是标准的\
  \ Python shell，你可能会发现很难确定自己处于哪个目录。你可以使用 `os.chdir()` 来更改目录，但这并不方便。你也可以通过 `os.getcwd()`\
  \ 获取当前目录，但这也不太方便。由于你是在标准 Python shell 中执行的是 Python 命令而不是 shell 命令，这可能不是什么大问题，但当你使用\
  \ IPython 并能够方便访问系统 shell 时，拥有同样方便的目录导航功能是关重要的。\n\n这就是 `cd` 魔法。似乎我们把这件事情搞得比它本身严重了：这并不是什么革命性的概念，它并不困难。但只要想象一下，如果没有它会怎样？那将非常痛苦。\n\
  \n\n\n\n在 IPython 中，`cd` 的工作方式与在 Bash 中基本相同。主要用法是 `cd directory_name`。它按照你根据 Bash\
  \ 经验预期的方式工作。如果不带任何参数，`cd` 会带你回到主目录。如果带有空格和连字符作为参数，`cd -` 会带你回到上一个目录。Bash 的 `cd`\
  \ 没有提供另外三个额外的选项。\n\n第一个是 `-q`，或 `quiet`（静静模式）选项。如果不使用此选项，IPython 会输出你刚刚切换的目录。下面的示例展示了使用和不使用\
  \ `-q` 选项切换目录的方法：\n\n```\nIn [1]: cd /tmp\n/tmp\nIn [2]: pwd\nOut[2]: '/tmp'\nIn\
  \ [3]: cd -\n/home/jmjones\nIn [4]: cd -q /tmp\nIn [5]: pwd\nOut[5]: '/tmp'\n```\n\
  \n使用 `-q` 可以防止 IPython 输出我们已经进入的 `/tmp` 目录。\n\nIPython 的 `cd` 包含的另一个功能是跳转到定义书签（bookmarks）的能力。（我们很快会解释如何创建书签。）这里有一个切换你已创建了书签的目录的示例：\n\
  \n```\nIn [1]: cd -b t\n(bookmark:t) -> /tmp\n/tmp\n```\n\n此示例假设我们已经将 `/tmp` 标记为名称\
  \ `t`。切换到书签目录的正式语法是 `cd -b bookmark_name`，但如果定义了名为 `bookmark_name` 的书签，且当前目录下没有名为\
