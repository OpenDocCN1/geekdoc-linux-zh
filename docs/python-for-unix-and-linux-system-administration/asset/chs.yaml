  \ '2326'})\nAssertionError: {'status': 'space.html', 'bytes_sent': 'HTTP/1.0\"',\n\
  'remote_host': '127.0.0.1'} != {'status': '200', 'bytes_sent': '2326',\n'remote_host':\
