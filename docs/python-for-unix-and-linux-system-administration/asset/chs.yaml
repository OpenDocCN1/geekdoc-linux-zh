  \ main():\n    disk_func()\n```\n通过对函数的实验，我们之前脚本的转换示例仅仅是将这些语句放在了函数内部，然后使用 `main`\
  \ 函数一次性调用它们。如果你不熟悉这种风格，你可能不知道在脚本中创建几个函数然后用一个 `main` 函数调用它们所有是常见做法。这样做的许多原因之一是，如果你决定在另一个程序中重用此脚本，你可以独立调用这些函数，也可以与主方法一起调用。关键在于你在模块导入后做出决定。\n\
  如果没有控制流或 `main` 函数，那么所有代码在被导入时立即执行。这对于一次性脚本可能是可以的，但如果你计划创建可重用的工具（你确实应该这样做），那么创建封装特定操作的函数，然后由一个执行整个程序的\
  \ `main` 函数是一个良好的习惯。\n为了对比，让我们也将之前的 `Bash` 系统信息脚本转换为使用函数。参见 示例 1-5。\n示例 1-5 转换后的系统信息脚本：`bashsysinfo_func.sh`\n\
  ```bash\n#A System Information Gathering Script\nfunction uname_func() {\n    uname_arg=\"\
  -a\"\n    $uname \"$uname_arg\"\n#Command 2\n    diskspace=\"df\"\n    printf \"\
  Gathering diskspace information %s command:\\n\" \"$diskspace\"\n}\nfunction main()\
  \ {\n    disk_func()\nmain\n\n\n\nDarwin Macintosh-8.local 9.2.2 Darwin Kernel Version\
  \ 9.2.2: /\n```\n使用 `df` 命令获取磁盘空间信息：\n```\n/dev/disk0s2    93Gi   88Gi  4.2Gi  \
  \  96%    /\nfdesc          1.0Ki  1.0Ki   0Bi   100%    /dev\nmap auto_home   \
  \ 0Bi    0Bi    0Bi   100%    /home\n/dev/disk2s3   466Gi  240Gi  225Gi    52% \
  \   /Volumes/EditingDrive\n\n\n\nIn [3]: import pysysinfo_func\nDarwin Macintosh-8.local\
  \ 9.2.2 Darwin Kernel Version 9.2.2:\nGathering diskspace information df command:\n\
  /dev/disk0s2    93Gi   88Gi  4.1Gi    96%    /\nfdesc          1.0Ki  1.0Ki   0Bi\
  \   100%    /dev\nmap auto_home    0Bi    0Bi    0Bi   100%    /home\n/dev/disk2s3\
  \   466Gi  240Gi  225Gi    52%    /Volumes/EditingDrive\n\n\n# 调用其他函数的主函数\n    uname_func()\n\
  main()\n\n\n# 调用其他函数的主函数\n    uname_func()\nif __name__ == \"__main__\":\n```\n\
  这是一种“惯用法”（idiom），一种常用于解决问题的技术。任何在该语句下缩进的代码都只有在从命令行执行时才会运行。要验证这一点，要么在你的脚本副本中替换此内容，要么导入修复版的脚本\
  \ `pysysinfo_func_2.py`。\n现在，如果我们回到 IPython 解释器并导入这个新脚本，我们应该看到：\n```\n```\n这一次，由于我们做的修复，`main`\
  \ 方法没有被调用。所以，回到我们最初关于可复用代码的问题，我们有三个函数可以在其他程序中使用，或者用于与 IPython shell 交互。还记得我们之前提到过，如果能只调用打印磁盘用量的函数，而不必也调用调用其他命令的函数该有多好吗？首先，我们需要查看带有双下划线的技巧。你可以使用\
  \ `Tab` 键来补全，它会显示所有可用的属性。这里是这样的：\n```\npysysinfo_func_2.__builtins__\npysysinfo_func_2.__dict__\n\
