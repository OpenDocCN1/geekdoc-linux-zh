  \ 标准库包含一个名为 `sys` 的内置模块，它可以方便地访问标准输入和标准输出。标准库以类文件对象的形式提供了对标准输入和输出的访问，尽管它们并没有直接连接到磁盘上的文件。由于它们是类文件对象，你可以对它们使用与处理文件时相同的方法。你可以将它们视为磁盘上的文件，并访问用于这些操作的相关方法。\n\
  \n通过导入 `sys` 模块并引用它的 `stdin` 属性（`sys.stdin`）可以访问标准输入。`sys.stdin` 是一个可读的 `file` 对象。注意当我们打开磁盘上名为\
  \ `foo.txt` 的文件创建一个“真实的” `file` 对象，并将该打开的文件对象与 `sys.stdin` 进行比较会发生什么：\n\n```python\n\
