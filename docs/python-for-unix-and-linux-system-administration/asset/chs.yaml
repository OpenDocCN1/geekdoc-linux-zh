  def main(self):\n    \"\"\"启动 gtk 主事件循环\"\"\"\n    gtk.main()\nif __name__ == \"\
  __main__\":\n    s = SimpleButtonApp()\n    s.main()\n```\n你在这个例子中可能注意到的第一点是，主类继承自\
  \ `object` 而不是某些 GTK 类。在 PyGTK 中创建 GUI 应用程序并不一定是一次面向对象的练习。你确实需要实例化对象，但你不必创建自己的自定义类。然而，对于除了我们正在创建的这种简单示例之外任何内容，我们强烈建议创建自己的自定义类。为\
  \ GUI 应用程序创建自定义类的主要好处是，你所有的 GUI 组件（窗口、按钮、复选框）最终都会连接到同一个对象，这允许从应用程序的其他地方轻松访问这些组件。\n\
  \n由于我们选择创建一个自定义类，开始理解正在发生什么的第一个地方是构造函数（`__init__()` 方法）。事实上，在这个例子中，你可以通过关注构造函数来看到发生了什么。这个例子有非常详细的注释，所以我们不会在这里重复解释所有内容，但我们将进行回顾。我们创建了两个\
  \ GUI 对象：一个 `gtk.Window` 和一个 `gtk.Button`。我们将按钮放入窗口中，因为窗口是一个容器对象。我们还分别为窗口和按钮创建了对应\
  \ `destroy` 和 `clicked` 事件的事件处理程序。如果你运行这段代码，它将显示一个带有“Click Me”标签按钮的窗口。每当你点击按钮，它都会用当前时间更新按钮的标签。图\
  \ 11-1 和 11-2 是点击按钮前后应用程序截图。\n\n![简单的 PyGTK 应用—点击按钮前](img/00010.jpg)\n\n图 11-1.\
