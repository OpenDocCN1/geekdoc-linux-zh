  \ got 195 answers, remaining 5 packets\n193.252.122.103:tcp443 193.252.122.103:tcp80\
  \ 198.133.192.25:tcp443 198.133.192.25:tcp80\n207.46.193.254:tcp443 207.46.193.254:tcp80\
