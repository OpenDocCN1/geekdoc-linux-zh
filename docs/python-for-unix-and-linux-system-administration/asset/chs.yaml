  \ `.htaccess` 文件，然后告诉 `easy_install` 执行经过验证的更新。\n\n#### 使用配置文件\n\n`easy_install`\
  \ 为高级用户提供了另一个技巧。你可以使用使用 `.ini` 语法格式化的配置文件来指定默认选项。对于系统管理员来说，这是一个天赐之般的功能，因为它允许对使用\
  \ `easy_install` 的客户端进行声明式配置。`easy_install` 将按照以下顺序在以下查找查找：`current_working_directory/setup.cfg`、`~/.pydistutils.cfg`\
  \ 以及 distutils 包目录下的 `distutils.cfg`。\n\n那么，在这个配置文件中可以放什么呢？最常见的两个设置项是用于包下载的默认内网站点（站点），以及包的自定义安装目录。这里是一个示例\
  \ `easy_install` 配置文件的样子：\n\n```ini\n[easy_install]\n# 在何处查找包\nfind_links = http://code.example.com/downloads\n\
  # 将搜索限制在这些域名\nallow_hosts = *.example.com\n# 安装包的位置。注意，此目录必须在 PYTHONPATH 上\ninstall_dir\
  \ = /src/lib/python\n```\n\n这个配置文件（我们可以称为 `~/.pydistutils.cfg`）定义了一个用于搜索包的特定 URL，仅允许来自\
  \ example.com（及其子域名）的包搜索，最后将包放在自定义的 python 包目录中。\n\n#### Easy Install 高级功能总结\n\n\
  这并不是为了取代 `easy_install` get 官方文档，而是为了向高级用户突出该工具的一些关键功能。由于 `easy_install` 仍在活跃开发，经常检查\
  \ `http://peak.telecommunity.com/DevCenter/EasyInstall` 以获取文档更新是一个好主意。还有一个名为 `distutils-sig`\
  \ 的邮件列表（sig 代表特殊兴趣小组），讨论所有与 Python 分发相关的事。在 `http://mail.python.org/mailman/listinfo/distutils-sig`\
  \ 注册，你也可以在那里报告 bug 并获取 `easy_install` 的帮助。\n\n最后，通过执行简单的 `easy_install --help`，你会发现更多我们没有讨论过的选项。很有可能你想做的事情已经作为\
  \ `easy_install` 的功能被包含了。\n\n### 创建 Eggs\n\n我们之前提到过 egg 是 Python 模块的包，但当时我们没有给出更好的定义。以下是\
  \ setuptools 网站对“egg”的定义：\n\n> Python Eggs 是 EasyInstall 优的二进制分发格式，因为它们跨平台（对于“纯”包）、可以直接导入，并包含了脚本和项目依赖项信息的项目元数据。它们可以简单地下载并直接添加到\
  \ `sys.path`，也可以放置在 `sys.path` 上的目录，然后由 egg 运行时系统自动发现。\n\n我们确实没有给出系统管理员会对创建 egg\
  \ 感兴趣的任何理由。如果你只是编写一次性脚本，egg 对你帮助不大。但如果你开始识别模式并发现自己经常在重复发明常见的任务，egg 可能会为你节省很多麻烦。如果你创建了一个经常使用的常用任务小库，你可以将其打包成一个\
  \ egg。如果你这样做，你不仅节省了编写代码的时间，还让安装变得简单。\n\n创建 egg 是一个极其简单的过程。它实际上涉及四个步骤：\n\n1. 安装 `setuptools`。\n\
  2. 在你的 egg 中创建你需要的文件。\n3. 创建 `setup.py` 文件。\n4. 运行 `python setup.py bdist_egg`。\n\
  \n在这种情况下，它将包含一个空的 `egg`：\n\n```bash\n$ cd /tmp\n$ mkdir egg\n$ cd egg\n```\n\n接下来，创建一个简单的\
  \ `setup.py` 文件：\n\n```python\nfrom setuptools import setup, find_packages\nsetup(\n\
  \    name=\"HelloWorld\",\n    version=\"0.1\",\n    packages=find_packages(),\n\
  )\n```\n\n现在，我们可以创建 `egg`：\n\n```bash\n$ python setup.py bdist_egg\nrunning bdist_egg\n\
  running egg_info\ncreating HelloWorld.info\nwriting HelloWorld.info/PKG-INFO\nwriting\
  \ top-level names to HelloWorld.info/top_level.txt\nwriting dependency_links to\
  \ HelloWorld.info/dependency_links.txt\nwriting manifest file HelloWorld.info/SOURCES.txt\n\
  reading manifest file HelloWorld.info/SOURCES.txt\nwriting manifest file HelloWorld.info/SOURCES.txt\n\
  installing library code to build/lib\nrunning install_lib\nwarning: install_lib:\
  \ 'build/lib' does not exist -- no modules to install\ncreating build\ncreating\
  \ build/bdist.macosx-10.5\ncreating build/bdist.macosx-10.5/egg\ncreating build/bdist.macosx-10.5/egg/EGG-INFO\n\
  copying HelloWorld.info/PKG-INFO -> build/bdist.macosx-10.5/egg/EGG-INFO\ncopying\
  \ HelloWorld.info/SOURCES.txt -> build/bdist.macosx-10.5/egg/EGG-INFO\ncopying HelloWorld.info/dependency_links.txt\
  \ -> build/bdist.macosx-10.5/egg/EGG-INFO\ncopying HelloWorld.info/top_level.txt\
  \ -> build/bdist.macosx-10.5/egg/EGG-INFO\nzip_safe flag not set; analyzing archive\
  \ contents...\ncreating dist\ncreating 'dist/HelloWorld-0.1-py2.5.egg' and adding\
  \ 'build/bdist.macosx-10.5/egg' to it\nremoving 'build/bdist.macosx-10.5/egg' (and\
  \ everything under it)\n$ ll\ntotal 8\ndrwxr-xr-x 6 ngift wheel 204 Mar 10 06:53\
  \ HelloWorld.info\ndrwxr-xr-x 3 ngift wheel 102 Mar 10 06:53 build\ndrwxr-xr-x 3\
  \ ngift wheel 102 Mar 10 06:53 dist\n-rw-r--r-- 1 ngift wheel 0 Mar 10 06:50 hello-egg.py\n\
  -rw-r--r-- 1 ngift wheel 131 Mar 10 06:52 setup.py\n```\n\n\n\n\n\n```bash\n$ sudo\
  \ easy_install HelloWorld-0.1-py2.5.egg\nsudo easy_install HelloWorld-0.1-py2.5.egg\n\
  Password:\nProcessing HelloWorld-0.1-py2.5.egg\nRemoving /Library/Python/2.5/site-packages/HelloWorld-0.1-py2.5.egg\n\
  Copying HelloWorld-0.1-py2.5.egg to /Library/Python/2.5/site-packages\nAdding HelloWorld\
  \ 0.1 to easy-install.pth file\nInstalled /Library/Python/2.5/site-packages/HelloWorld-0.1-py2.5.egg\n\
  Processing dependencies for HelloWorld==0.1\nFinished processing dependencies for\
  \ HelloWorld==0.1\n```\n\n如你所见，创建一个 egg 非常简单。不过由于这个 egg 实际上是一个空文件，我们将创建一个 Python\
  \ 脚本，并更详细地介绍如何构建 egg。\n\n这里有一个非常简单的 Python 脚本，它可以显示目录中的软符号链接（symlinks）、它们对应的真实文件在哪里，以及真实文件是否存在：\n\
  \n```python\n#!/usr/bin/env python\nimport os\nimport sys\n\ndef get_dir_tuple(filename,\
  \ directory):\n    abspath = os.path.join(directory, filename)\n    realpath = os.path.realpath(abspath)\n\
  \    exists = os.path.exists(abspath)\n    return (filename, realpath, exists)\n\
  \ndef get_links(directory):\n    file_list = [get_dir_tuple(f, directory) for f\
  \ in os.listdir(directory)\n             if os.path.islink(os.path.join(directory,\
  \ f))]\n    return file_list\n\ndef main():\n    if not len(sys.argv) == 2:\n  \
  \      print 'USAGE: %s directory' % sys.argv[0]\n        sys.exit(1)\n    directory\
  \ = sys.argv[1]\n    print get_links(directory)\n\nif __name__ == '__main__':\n\
  \    main()\n```\n\n接下来，我们将创建一个使用 setuptools 的 `setup.py`。这与我们上一个示例中的另一个最小化的 `setup.py`\
  \ 文件：\n\n```python\nfrom setuptools import setup, find_packages\nsetup(\n    name\
  \ = \"symlinkator\",\n    version = \"0.1\",\n    packages = find_packages(),\n\
  \    entry_points = {\n        'console_scripts': [\n            'linkator = symlinkator.symlinkator:main',\n\
  \        ],\n    },\n)\n```\n\n这声明了包名为为“symlinkator”，版本为 0.1，并且 setuptools 将尝试找到任何适当的\
  \ Python 文件进行包含。暂时忽略 `entry_points` 部分即可。\n\n现在，我们将通过运行 `python setup.py bdist_egg`\
  \ 来构建 egg：\n\n```bash\n$ python setup.py bdist_egg\nrunning bdist_egg\nrunning egg_info\n\
  creating symlinkator.egg-info\nwriting symlinkator.egg-info/PKG-INFO\nwriting top-level\
  \ names to symlinkator.egg-info/top_level.txt\nwriting dependency_links to symlinkator.egg-info/dependency_links.txt\n\
  writing manifest file 'symlinkator.egg-info/SOURCES.txt'\nwriting manifest file\
  \ 'symlinkator.egg-info/SOURCES.txt'\ninstalling library code to build/bdist.linux-x86_64/egg\n\
  running install_lib\nwarning: install_lib: 'build/lib' does not exist -- no Python\
  \ modules to install\ncreating build\ncreating build/bdist.linux-x86_64\ncreating\
  \ build/bdist.linux-x86_64/egg\ncreating build/bdist.linux-x86_64/egg/EGG-INFO\n\
  copying symlinkator.egg-info/PKG-INFO -> build/bdist.linux-x86_64/egg/EGG-INFO\n\
  copying symlinkator.egg-info/SOURCES.txt -> build/bdist.linux-x86_64/egg/EGG-INFO\n\
  copying symlinkator.egg-info/dependency_links.txt -> build/bdist.linux-x86_64/egg/EGG-INFO\n\
  copying symlinkator.egg-info/top_level.txt -> build/bdist.linux-x86_64/egg/EGG-INFO\n\
  zip_safe not set; analyzing archive...\ncreating dist\ncreating 'dist/symlinkator-0.1-py25.egg'\
  \ and adding 'build/bdist.linux-x86_64/egg' to it\nremoving 'build/bdist.linux-x86_64/egg'\
  \ (and everything under it)```\n\n验证 `egg` 的内容。进入创建的 `dist` 目录验证是否存在 egg：\n\n```bash\n\
  $ ls -l dist\ntotal 4\n-rw-r-- 1 jmjones jmjones 825 2008-05-03 15:34 symlinkator-0.1-py25.egg\n\
  ```\n\n现在我们将安装这个 `egg`：\n\n```bash\n$ easy_install dist/symlinkator-0.1-py25.egg\n\
  Processing symlinkator-0.1-py25.egg\n....\nProcessing dependencies for symlinkator==0.1\n\
  Finished processing dependencies for symlinkator==0.1\n```\n\n接下来，启动 IPython，导入并使用我们的模块：\n\
  \n```python\nIn [1]: from symlinkator.symlinkator import get_links\nIn [2]: get_links('/home/jmjones/logs/')\n\
  Out[2]: [('fetchmail.log.old', '/home/jmjones/logs/fetchmail.log.3', False),\n('fetchmail.log',\
  \ '/home/jmjones/logs/fetchmail.log.0', True)]\n```\n\n如果你感兴趣，这里是我们运行 `get_links()`\
  \ 函数的目录：\n\n```bash\n$ ls -l ~/logs/\ntotal 0\nlrwxrwxrwx 1 jmjones jmjones 15 2008-05-03\
  \ 15:11 fetchmail.log -> fetchmail.log.0\n-rw-r--r-- 1 jmjones jmjones 0 2008-05-03\
  \ 15:09 fetchmail.log.0\n-rw-r--r-- 1 jmjones jmjones 0 2008-05-03 15:09 fetchmail.log.1\n\
  lrwxrwxrwx 1 jmjones jmjones 15 2008-05-03 15:11 fetchmail.log.old -> fetchmail.log.3\n\
  ```\n\n# 入点 (Entry Points) 和控制台脚本 (Console Scripts)\n\n来自 setuptools 文档页面：\n\n>\
  \ 入点用于支持项目提供的服务或插件的动态发现。详情和格式示例请 Dynamic Discovery of Services and Plugins。此外，此关键字用于支持脚本创建。\n\
  \n书中涵盖的入点类型只有控制台脚本。只需在 `setup.py` 中提供少量信息，setuptools 就会为你创建控制台脚本。以下是上一个示例中 `setup.py`\
  \ 的相关部分：\n\n```python\nentry_points = {\n    'console_scripts': [\n        'linkator\
  \ = symlinkator.symlinkator:main',\n    ],\n}\n```\n\n在这个示例中，我们指定了一个名为 `\"linkator\"\
  ` 的脚本，并在执行该脚本时，调用 `symlinkator.symlinkator` 模块中的 `main()` 函数。当我们安装 egg 时，这个 `linkator`\
  \ 脚本被放置在与 `python` 二进制文件相同的目录下：\n\n```python\n#!/home/jmjones/local/python/scratch/bin/python\n\
  # EASY-INSTALL-ENTRY-SCRIPT: 'symlinkator==0.1','console_scripts','linkator'\n__requires__\
  \ = 'symlinkator==0.1'\nimport sys\nfrom pkg_resources import load_entry_point\n\
  sys.exit(\n  load_entry_point('symlinkator==0.1', 'console_scripts', 'linkator')()\n\
  )\n```\n\n你看到的一切都是由 `setuptools` 生成的。理解此脚本中的所有并不重要。实际上，理解此脚本中的*任何*内容可能完全不重要。重要的的一点是，当你在\
  \ `setup.py` 中定义 `console_scripts` 入点时，setuptools 会创建一个脚本，将你的代码调用到你指定的地方。以下是我们以类似于之前示例的方式调用此脚本时发生的情况：\n\
  \n```bash\n$ linkator ~/logs/\n[('fetchmail.log.old', '/home/jmjones/logs/fetchmail.log.3',\
  \ False),\n('fetchmail.log', '/home/jmjones/logs/fetchmail.log.0', True)]\n```\n\
  \n关于入点有一些复杂的方面需要理解，但从非常高层次来说，只需要知道你可以使用入点将你的脚本“安装”为用户路径中的命令行工具即可。为了实现这一点，你只需要在 `setup.py`\
  \ 中放置上述信息即可。\n\n# 在 Python Package Index 上注册包\n\n如果你编写了一个酷的工具或实用的模块，自然地想与其他人分享。这是开源软件开发中最有趣的部分之一。可以说，将包上传到\
  \ Python Package Index 是一个相对简单的过程。\n\n该过程与创建 egg 有有不同。需要注意的两点是不要忘记在 `long_description`\
  \ 中包含 ReST（重结构文本）格式的描述，并提供一个 `download_url` 值。\n\n\n\n\n虽然我们之前讨论过 ReST 格式，但我们在这里应该强调，将你的文档格式化为\
  \ ReST 是一个好主意，因为它在上传到 cheeseshop 时会被转换为 HTML。你可以使用 Aaron Hillegass 创建的工具 `ReSTless`\
  \ 来预览格式化后的文本，以便在预览时 `insure` 其格式正确。需要注意的一点是确保你正确格式化了 `ReST`。如果你没有正确格式化 `ReST`，那么在你上传文档时，文本将显示为纯文本而不是\
  \ HTML。\n\n请参考 示例 9-2 以查看 Noah 创建的命令行工具和库的有效 `setup.py`。\n\n### 示例 9-2. 用于上传到 Python\
  \ Package Index 的示例 setup.py\n\n```python\n#!/usr/bin/env python\n# liten 0.1.4.2\
  \ -- deduplication command-line tool\n#\n# Author: Noah Gift\ntry:\n    from setuptools\
  \ import setup, find_packages\nexcept ImportError:\n    from ez_setup import use_setuptools\n\
  \    use_setuptools()\n    from setuptools import setup, find_packages\nimport os,sys\n\
  version = '0.1.4.2'\nf = open(os.path.join(os.path.dirname(__file__), 'docs', 'index.txt'))\n\
  long_description = f.read().strip()\nf.close()\nsetup(\n    name='liten',\n    version='0.1.4.2',\n\
  \    description='a de-duplication command line tool',\n    long_description=long_description,\n\
  \    classifiers=[\n        'Development Status :: 4 - Beta',\n        'Intended\
  \ Audience :: Developers',\n        'License :: OSI Approved :: MIT License',\n\
  \    ],\n    author='Noah Gift',\n    author_email='noah.gift@gmail.com',\n    url='http://pypi.python.org/pypi/liten',\n\
  \    download_url=\"http://code.google.com/p/liten/downloads/list\",\n    license='MIT',\n\
  \    py_modules=['virtualenv'],\n    zip_safe=False,\n    py_modules=['liten'],\n\
  \    entry_points=\"\"\"\n    [console_scripts]\n    liten = liten:main\n    \"\"\
  \",\n)\n```\n\n使用这个 `setup.py` 文件，我们现在可以通过执行此命令来“自动”向 Python Package Index 注册包：\n\
  \n```bash\n$ python setup.py register\nrunning register\nrunning egg_info\nwriting\
  \ liten.egg-info/PKG-INFO\nwriting top-level names to liten.egg-info/top_level.txt\n\
  writing dependency_links to liten.egg-info/dependency_links.txt\nwriting entry points\
  \ to liten.egg-info/entry_points.txt\nwriting manifest file 'liten.egg-info/SOURCES.txt'\n\
  Using PyPI login from /Users/ngift/.pircirc\nServer response (200): OK\n```\n\n\
  与 `symlinkator` 示例相比，这个 `setup.py`增加了额外的字段。一些额外的字段包括 `description`、`long_description`、`classifiers`、`author`\
  \ 和 `download_url`。正如我们之前讨论的，入口点（entry point）允许工具从命令行运行并安装到默认脚本目录中。\n\n`download_url`\
  \ 是关键的，因为它告诉 `easy_install` 在哪里搜索你的包。你可以包含一个页面的链接，`easy_install` 足够智能可以找到包或 egg，你也可以显式创建指向你创建的\
  \ egg 的链接。\n\n`long_description` 重用了存在于相对目录 `/doc` 中的文档，该目录包含一个 `index.txt` 文件。`index.txt`\
  \ 文件格式化为 ReST，然后 `setup.py` 脚本读取这些信息，并在向 Python Package Index 注册时将其放入字段中。\n\n##\
  \ 我可以在哪里学习更多关于 …\n\n以下是重要的资源：\n\nEasy install\n> [`peak.telecommunity.com/DevCenter/EasyInstall`](http://peak.telecommunity.com/DevCenter/EasyInstall)\n\
  \nPython eggs\n> [`peak.telecommunity.com/DevCenter/PythonEggs`](http://peak.telecommunity.com/DevCenter/PythonEggs)\n\
  \nThe setuptools module\n> [`peak.telecommunity.com/DevCenter/setuptools`](http://peak.telecommunity.com/DevCenter/setuptools)\n\
  \nThe package resources module\n> [`peak.telecommunity.com/DevCenter/PkgResources`](http://peak.telecommunity.com/DevCenter/PkgResources)\n\
  \nArchitectural overview of pkg_resources and Python eggs in general\n> [`mail.python.org/pipermail/distutils-sig/2005-June/004652.html`](http://mail.python.org/pipermail/distutils-sig/2005-June/004652.html)\n\
  \n别忘了 `mail.python.org/pipermail/distutils-sig/` 邮件列表。\n\n### 第 1 步：创建代码\n让我们使用这个简单的示例：\n\
  \n```python\n#!/usr/bin/env python\n# Distutils example\nfrom distutils.core import\n\
  \nclass DistutilsClass(object):\n    \"\"\"This class prints out\"\"\"\n    def\
  \ __init__(self):\n        print(\"Hello, I am a\")\n\nif __name__ == '__main__':\n\
  \    DistutilsClass()\n```\n\n### 第 2 步：制作 setup.py\n现在我们有了基础示例，在同一目录下创建一个 `setup.py`：\n\
  \n```python\n#Installer for distutils\nsetup(\n    name=\"distutils_example\",\n\
  \    version=\"0.1\",\n    description=\"A Useless\",\n    author=\"Joe Blow\",\n\
  \    author_email=\"joe.blow@py.org\",\n    url=\"http://www.py.org\")\n```\n注意向\
  \ `setup()` 传递了一些以后可以识别元数据的参数。请注意这是一个简单的示例，还有更多。\n\n### 第 3 步：创建发行\n现在我们有了 `setup.py`\
  \ 脚本，可以通过在 README 和 `setup.py` 文件所在的目录运行此命令来轻松创建源码发行：\n\n```bash\npython setup.py\
  \ sdist\n```\n你将获得以下输出：\n\n```text\nrunning sdist\nwarning: sdist: manifest template\
  \ 'MANIFEST.in' does not exist\n(using default file list)\nwriting manifest 'MANIFEST'\n\
  creating distutils_example-0.1\nmaking hard links in distutils_example-0.1...\n\
  hard linking README.txt distutils_example-0.1\nhard linking setup.py distutils_example-0.1\n\
  creating dist\ntar -cf dist/distutils_example-0.1.tar distutils_example-0.1\ngzip\
  \ -f9 dist/distutils_example-0.1.tar\nremoving 'distutils_example-0.1'\n```\n\n\
  正如从输出中看到的，现在人们只需要使用以下命令进行解包和安装：\n\n```bash\npython setup.py install\n```\n\n如果你想构建二进制文件，这里有一些示例。注意它们依赖于底层操作系统来完成繁重工作，因此你不能在例如\
  \ OS X 上构建 rpm。但是由于有大量的虚拟化产品，这对你来说应该不是问题。只需在需要构建时保留几台可以激活的虚拟机即可。\n\n构建 rpm：\n\n\n\
  \n\n\n```bash\npython setup.py bdist_rpm\n```\n\n要构建一个 Solaris pkgtool：\n\n```bash\n\
  python setup.py bdist_pkgtool\n```\n\n要构建一个 HP-UX swinstall：\n\n```bash\npython\
  \ setup.py bdist_sdux\n```\n\n最后，当你分发制作的包时，你可能想在安装包时自定义安装目录。通常情况下，构建和安装过程是一次完成的，但你可能想要选择一个自定义的构建目录，如下所示：\n\
  \n```bash\npython setup.py build --build-base=/mnt/python_src/ascript.py\n```\n\n\
  当你实际运行 `install` 命令时，它会将 `build` 目录中的所有内容复制到 `installation` 目录。默认情况下，`installation`\
  \ 目录是执行命令的 Python 环境中的 `site-packages` 目录，但也可以像上一个示例那样指定自定义的 `installation` 目录（例如\
  \ NFS 挂载点）。\n\n### Buildout\n\nBuildout 是由 Zope Corporation 的 Jim Fulton 创建的一个工具，用于管理新应用程序的“构建”。这些应用程序可以是\
  \ Python 程序或其他程序（例如 Apache）。Buildout 的主要目标之一是允许构建在跨平台上具有可重复性。作者首次使用 Buildout 的体验是部署一个\
  \ Plone 3.x 站点。从那时起，他意识到这只是冰山一角。\n\nBuildout 是 Python 提供的最受关注的新型包管理工具之一，因为它允许具有复杂依赖关系的复杂应用程序只要有\
  \ `bootstrap.py` 和配置文件，就能实现自举引导。在接下来的章节中，我们将讨论分为两个部分：使用 Buildout 和使用 Buildout 进行开发。我们还建议你阅读\
  \ [`pypi.python.org/pypi/zc.buildout`](http://pypi.python.org/pypi/zc.buildout)\
  \  Buildout 手册，因为它是获取 Buildout 最新信息的宝贵资源。事实上，本文档关于 Buildout 的描述已经非常详尽了，是任何 Buildout\
  \ 用户的必读之。\n\n***\n\n### 人物简介：Buildout：Jim Fulton\n\nJim Fulton 是 Zope Object Database\
  \ 的创建者兼维护者之一。Jim 还是 Zope Object Publishing Environment 的创建者之一以及 Zope Corporation\
  \ 的首席技术官（CTO）。\n\n***\n\n### 使用 Buildout\n\n尽管许多接触 Zope 技术的人都了解 Buildout，但它对 Python\
  \ 世界的其他部分来说一直是一个秘密。Buildout 是 Plone 部署的推荐机制。如果你熟悉 Plone，它是一个企业级的内容管理系统，背后有一个强大的开发社区。在\
  \ Buildout 发明之前，Plone 的安装极其复杂。现在 Buildout 让 Plone 的安装变得轻而易举。\n\n许多人不知道，你也可以使用 Buildout\
  \ 来管理 Python 环境。Buildout 是一个非常智能的软件，因为它只需要两个东西：\n\n*   最新版本的 `bootstrap.py`。你可以随时在这里下载：[`svn.zope.org/*checkout*/zc.buildout/trunk/bootstrap/bootstrap.py`](http://svn.zope.org/*checkout*/zc.buildout/trunk/bootstrap/bootstrap.py)。\n\
  *   一个 `buildout.cfg` 文件，其中包含要安装的“配方”（recipes）或“鸡蛋”（eggs）的名称。\n\n演示 Buildout 的最好方法是使用它安装东西。Noah\
  \ 编写了一个名为 `liten` 的去重命令行工具，该工具可以在 Python 中央仓库 PyPI 中获取。我们将使用 Buildout 来“自举”一个运行该工具的\
  \ Python 环境。\n\n### 第一步：下载 bootstrap.py 脚本。\n\n```bash\nmkdir -p ~/src/buildout_demo\n\
  curl http://svn.zope.org/*checkout*/zc.buildout/trunk/\nbootstrap/bootstrap.py >\
  \ ~/src/buildout_demo/bootstrap.py\n```\n\n### 第二步：定义一个简单的 `buildout.cfg`。正如我们之前提到的，Buildout\
  \ 要求存在一个 `buildout.cfg` 文件。如果我们尝试在没有 `buildout.cfg` 文件的情况下运行 `bootstrap.py` 脚本，我们将得到下面的输出：\n\
  \n```bash\n$ python bootstrap.py\nWhile:\nInitializing.\nError: Couldn't open /Users/ngift/src/buildout_demo/buildout.cfg\n\
  ```\n\n例如，我们将创建如示例 9-3 所示的配置文件。\n\n示例 9-3. 示例 Buildout 配置文件\n\n```ini\n[buildout]\n\
  parts = mypython\n\n[mypython]\nrecipe = zc.recipe.egg\ninterpreter = mypython\n\
  eggs = liten\n```\n\n如果我们将该文件保存为 `buildout.cfg` 并再次运行 `bootstrap.py` 脚本，我们将得到如示例\
  \ 9-4 所示的输出。\n\n示例 9-4. 用棒测试 Buildout 环境\n\n```bash\n$ python bootstrap.py\nCreating\
  \ directory '/Users/ngift/src/buildout_demo/bin'.\nCreating directory '/Users/ngift/src/buildout_demo/parts'.\n\
  Creating directory '/Users/ngift/src/buildout_demo/eggs'.\nCreating directory '/Users/ngift/src/buildout_demo/eggs'.\n\
  ```\n\n\n\n\n\n```bash\n$ bin/buildout -N\n```\n\n`正在卸载 mypython.`\n\n当我们查看 `bin`\
  \ 目录内部时，解释器和命令行工具都消失了。剩下的唯一项是真正的 Buildout 命令行工具：\n\n```bash\n$ ls -l bin/  \ntotal\
  \ 8\n-rwxr-xr-x  1 ngift  staff  362 Mar  4 22:17 buildout\n```\n\n然而，如果我们查看 `eggs`\
  \ 目录，该 egg 已经安装但尚未激活。但我们无法运行它，因为它没有解释器：\n\n```bash\n$ ls -l eggs\ntotal 640\ndrwxr-xr-x\
  \  7 ngift  staff     238 Mar  4 22:54 liten-0.1.3-py2.5.egg\n-rw-r--r--  1 ngift\
  \  staff  324858 Feb 16 23:47 setuptools-0.6c8-py2.5.egg\ndrwxr-xr-x  5 ngift  staff\
  \     170 Mar  4 22:17 zc.buildout-1.0.0-py2.5.egg\ndrwxr-xr-x  4 ngift  staff \
  \    136 Mar  4 22:23 zc.recipe.egg-1.0.0-py2.5.egg\n```\n\n### 使用 Buildout 开发\n\
  \n既然我们已经学习了创建和销毁 Buildout 控制环境的简单示例，现在我们可以更进一步，创建一个由 Buildout 控制的开发环境。\n\nBuildout\
  \ 最常用的场景之一非常简单。开发者可能对一个位于版本控制中的单个包进行工作。然后开发者将她的项目检出到顶层 `src` 目录中。在 `src` 目录内部，她将像之前描述的那样运行\
  \ Buildout，使用如下示例配置文件：\n\n```ini\n[buildout]\ndevelop = .\nparts = test\n\n[python]\n\
  recipe = zc.recipe.egg\ninterpreter = python\neggs = ${config:mypkgs}\n\n[scripts]\n\
  recipe = zc.recipe.egg:scripts\neggs = ${config:mypkgs}\n\n[test]\nrecipe = zc.recipe.testrunner\n\
  eggs = ${config:mypkgs}\n```\n\n# virtualenv\n\n根据 Python Package Index 页面上的文档说明，“virtualenv\
  \ 是一个创建隔离 Python 环境的工具。” virtualenv 解决的基础问题是消除包冲突引起的问题。通常，一个工具需要包的某个版本，而另一个工具需要该包的不同版本。这可能会导致危险的场景，因为某人“无意中”通过升级包来运行不同的工具而修改了全局\
  \ `site-packages` 目录，导致生产 Web 应用程序崩溃。\n\n此外，开发者可能没有全局 `site-packages` 目录的写权限，可以使用\
  \ virtualenv 保持一个与系统 Python 隔离的独立虚拟 env。virtualenv 是在问题发生前消除问题的极佳方法，因为它允许创建新的沙箱，这些沙箱可以选择地与全局\
  \ `site-packages` 目录完全隔离。\n\nvirtualenv 还可以通过允许开发者用自定义环境预填充虚拟环境来“引导（bootstrap）”一个虚拟环境。这与\
  \ Buildout 的做法非常相似，尽管 Buildout 使用的是声明式配置文件。我们应该注意到，Buildout 和 virtualenv 都广泛使用了\
  \ setuptools，Phillip J. Eby 是其目前的维护者。\n\n***\n\n### 人物简介：Virtualenv: Ian Bicking\n\
  \n![Ian Bicking](img/00009.jpg)\n\nIan Bicking 负责的 Python 包多到让人难以记忆。他编写了 Webob（Google\
  \ App Engine 的一部分）、Paste、virtualenv、SQLObject 等等。你可以在这里阅读他的著名博客：[`blog.ianbicking.org/`](http://blog.ianbicking.org/)。\n\
  \n***\n\n那么，如何使用 virtualenv？最直接的方法是使用 `easy_install` 安装 virtualenv：\n\n```bash\n\
  sudo easy_install virtualenv\n```\n\n如果你计划只用一个 Python 版本使用 virtualenv，这种方法效果很好。如果你在机器上安装了多个版本的\
  \ Python，例如 Python 2.4、Python 2.5、Python 2.6，可能还有 Python 3000，并且它们共享同一个主 `bin` 目录（如\
  \ `/usr/bin`），那么另一种方法可能更好，因为同一个 scripts 目录一次只能安装一个 virtualenv 脚本。\n\n创建可以适用于多个 Python\
  \ 版本的 virtualenv 脚本的一种方法是下载最新版本的 virtualenv 并为每个 Python 版本创建一个别名。以下是操作步骤：\n\n1.\
  \ `curl [`svn.colorstudy.com/virtualenv/trunk/virtualenv.py > virtualenv.py`](http://svn.colorstudy.com/virtualenv/trunk/virtualenv.py%20%20%20%20%20%3E%20virtualenv.py)`\n\
  \n2. `sudo cp virtualenv.py /usr/bin/`\n\n3. 在你的 Bash 或 zsh 中创建别名：\n```bash\nalias\
  \ virtualenv24='/path/to/virtualenv.py 2.4'\nalias virtualenv25='/path/to/virtualenv.py\
  \ 2.5'\nalias virtualenv26='/path/to/virtualenv.py 2.6'\n```\n\n有了这些别名，我们可以为每个需要的版本创建多个容器。以下是其示例：\n\
  \n```bash\nCreating a Python2.4 environment:\n$ virtualenv24\n...\nCreating a Python2.5\
  \ environment:\n$ virtualenv25\n...\nCreating a Python2.6 environment:\n$ virtualenv26\n\
  ...\n```\n\n\n\n\n\n让我们来看看创建一个自定义的引导脚本是有多么简单，该脚本可以在新环境中安装 `virtualenv` 和一组自定义的包（eggs）。再次以\
  \ `liten` 包为例，我们可以使用 `virtualenv` 创建一个全新的虚拟环境，并预先为其安装 `liten`。示例 9-7 详细展示了如何创建一个安装了\
  \ `liten` 的自定义引导脚本。\n\n示例 9-7. 引导脚本创建器示例\n\n```python\nimport virtualenv, textwrap\n\
  \noutput = virtualenv.create_bootstrap_script(textwrap.dedent(\"\"\"\nimport os,\
  \ subprocess\ndef after_install(options, home_dir):\n    etc = join(home_dir, 'etc')\n\
  \    if not os.path.exists(etc):\n        os.makedirs(etc)\n    subprocess.call([join(home_dir,\
  \ 'bin', 'easy_install'),\n                      'liten'])\n\"\"\"))\nf = open('liten-bootstrap.py',\
  \ 'w').write(output)\n```\n\n此示例改编自 `virtualenv` 文档，最后两行是需要关注的重要行：\n\n```python\n\
  subprocess.call([join(home_dir, 'bin', 'easy_install'),\n'liten'])\n\"\"\"))\nf\
  \ = open('liten-bootstrap.py', 'w').write(output)\n```\n\n简而言之，这告诉我们的 `after_install`\
  \ 函数在当前工作目录下创建一个名为 `liten-bootstrap.py` 的新文件，然后包含模块 `liten` 的自定义 `easy_install`。需要注意的是，这段代码片段会创建一个\
  \ `bootstrap.py`，然后需要运行这个 `bootstrap.py` 文件。运行该脚本后，我们将得到一个可以分发给开发者或终端用户的 `liten-bootstrap.py`\
  \ 文件。\n\n如果我们在不带任何选项的情况下运行 `liten-bootstrap.py`，将得到以下输出：\n\n```bash\n$ python liten-bootstrap.py\n\
  You must provide a DEST_DIR\nUsage: liten-bootstrap.py [OPTIONS] DEST_DIR\nOptions:\n\
  \  --version           show program's version number and exit\n  -h, --help    \
  \      show this help message and exit\n  -v, --verbose       Increase verbosity\n\
  \  -q, --quiet         Decrease verbosity\n  --clear             Clear out the non-root\
  \ install and start from scratch\n  --no-site-packages  Don't give access to the\
  \ global site-packages dir to the\n                      virtual environment\n```\n\
  \n当我们实际上带有目标目录运行此工具时，将得到此输出：\n\n```bash\n$ python liten-bootstrap.py  --no-site-packages\
  \ /tmp/liten-ENV\nNew python executable in /tmp/liten-ENV/bin/python\nInstalling\
  \ setuptools..........................done.\nSearching for liten\nBest match: liten\
  \ 0.1.3\nProcessing liten-0.1.3-py2.5.egg\nAdding liten 0.1.3 to easy-install.pth\
  \ file\nInstalling liten script to /tmp/liten-ENV/bin\nUsing /Library/Python/2.5/site-packages/liten-0.1.3-py2.5.egg\n\
  Processing dependencies for liten\nFinished processing dependencies for liten\n\
  ```\n\n我们聪明的引导脚本会自动创建一个包含我们模块的环境。因此，如果我们运行 `liten` 工具中 `virtualenv` 的完整路径，将得到以下：\n\
  \n```bash\n  $ /tmp/liten-ENV/bin/liten\n  Usage: liten [starting directory] [options]\n\
  \  A command-line tool for detecting duplicates using md5 checksums.\n  Options:\n\
  \  --version             show program's version number and exit\n  -h, --help  \
  \          show this help message and exit\n  -c, --config          Path to read\
  \ in config file\n  -s SIZE, --size=SIZE  File Size Example:  10bytes, 10KB, 10MB,10GB,10TB,\
  \ or\n  plain number defaults to MB (1 = 1MB)\n  -q, --quiet          Suppresses\
  \ all STDOUT.\n  -r REPORT, --report=REPORT\n  Path to store duplication report.\
  \ Default CWD\n  -t, --test            Runs doctest.\n```\n\n这是一个非常值得学习的技巧，因为它允许创建一个完全隔离且经过引导的虚拟环境。\n\
  \n我们希望通过这一关于 `virtualenv` 的章节清楚地看到，它的核心优势之一就是使用和理解它是如此简单。最重要的是，`virtualenv` 尊重 KISS（保持简单）的核心原则，单此这一点就足以考虑使用它来帮助管理隔离的开发环境。如果你对它有更多问题，务必访问\
  \ `virtualenv` 邮件列表 [`groups.google.com/group/python-virtualenv/`](http://groups.google.com/group/python-virtualenv/)。\n\
  \n### EPM 包管理器\n\n由于 EPM 为每个操作系统创建原生包，因此它需要在每个“操作系统”上进行安装。根据 EPM 的文档，它从之初就被设计为支持多个平台：Ubuntu、OS\
  \ X、Red Hat、Solaris、FreeBSD、AIX 或 HP-UX。\n\n## EPM 包管理器要求与安装\n\nEPM 只需要 Bourne own\
  \ shell、一个 C 编译器、`make` 程序和 `gzip`。如果这些工具在 *nix* 系统上没有安装，可以很容易获得。下载 EPM 源码后，有必要运行以下命令：\n\
  \n```bash\n./configure\nmake\nmake install\n```\n\n#### 创建 Hello World 命令行工具\n\n\
  为了开始为几乎所有的 nix 系统构建包，我们需要一些实际分发的内容。按照传统，我们将创建一个简单的 `hello_epm.py`。参见示例 9-8。\n\n\
  示例 9-8. Hello 命令行工具\n\n```python\n#!/usr/bin/env python\nimport optparse\n\ndef\
  \ main():\n    p = optparse.OptionParser()\n    p.add_option('--os', '-o', default=\"\
  NIX\")\n    options, arguments = p.parse_args()\n    print 'Hello EPM, I like to\
  \ make packages on %s' % options.os\n\nif __name__ == '__main__':\n    main()\n\
  ```\n\n如果我们运行此工具，将得到以下输出：\n\n```bash\n$ python hello_epm.py\nHello EPM, I like to\
  \ make packages on *NIX\n$ python hello_epm.py --os RedHat\nHello EPM, I like to\
  \ make packages on RedHat\n```\n\n#### 使用 EPM 创建特定平台的包\n\n“基础知识”如此简单，你可能会怀疑为什么以前不用\
  \ EPM 来为跨平台软件打包。EPM 读取描述你的软件包的“列表”文件。注释以 `#` 字符开始，指令以 `%` 字符开始，变量以 `$` 字符开始，最后，文件、目录、初始化脚本和符号链接行以字母开头。\n\
  \n创建一个通用的跨平台安装脚本，也可以创建特定平台的包。我们将专注于创建供应商包。创建特定平台包的下一步是创建一个描述软件包的清单或“列表”。示例 9-9 是我们用于为\
  \ `hello_epm` 命令行工具创建包的模板。它足够通用，你只需稍作修改即可创建自己的工具。\n\n\n\n\n\n# EPM 列表文件可用于为这些任何厂商平台创建包\n\
  \n```\nepm -f format foo bar.list ENTER\n```\n\n# format 选项可以是以下关键词之一：\n\n- `aix`\
  \ - AIX 软件包。\n- `bsd` - FreeBSD, NetBSD, 或 OpenBSD 软件包。\n- `depot` 或 `swinstall`\
  \ - HP-UX 软件包。\n- `dpkg` - Debian 软件包。\n- `inst` 或 `tardist` - IRIX 软件包。\n- `native`\
  \ - 适用于平台的“原生”软件软件包（RPM, INST, DEPOT, PKG, 等）。\n- `osx` - MacOS X 软件包。\n- `pkg`\
  \ - Solaris 软件包。\n- `portable` - 可移植软件软件包（默认值）。\n- `rpm` - Red Hat 软件包。\n- `setld`\
  \ - Tru64 (setld) 软件包。\n- `slackware` - Slackware 软件包。\n\n# 产品信息部分\n\n```\n%product\
  \ hello_epm\n%copyright 2008 Py4SA\n%vendor O’Reilly\n%license COPYING\n%readme\
  \ README\n%description Command Line Hello World Tool\n%version 0.1\n```\n\n# 自动配置变量\n\
  \n```\n$prefix=/usr\n$exec_prefix=/usr\n$bindir=${exec_prefix}/bin\n$datadir=/usr/share\n\
  $docdir=${datadir}/doc/\n$libdir=/usr/lib\n$mandir=/usr/share/man\n$srcdir=.\n```\n\
  \n# 可执行文件\n\n```\n%system all\nf 0555 root sys ${bindir}/hello_epm hello_epm.py\n\
  ```\n\n# 文档\n\n```\n%subpackage documentation\nf 0444 root sys ${docdir}/README\
  \ $srcdir/README\nf 0444 root sys ${docdir}/COPYING $srcdir/COPYING\nf 0444 root\
  \ sys ${docdir}/hello_epm.html $srcdir/doc/hello_epm.html\n```\n\n# Man 手页\n\n```\n\
  %subpackage man\n%description Man pages for hello_epm\nf 0444 root sys ${mandir}/man1/hello_epm.1\
  \ $srcdir/doc/hello_epm.man\n```\n\n如果我们检查这个文件（我们将其称为 `hello_epm.list`），您会注意到我们将\
  \ `$srcdir` 变量定义为当前工作目录。为了在任何平台上创建包，我们现在只需要在当前工作目录中创建以下内容：一个 `README` 文件、一个 `COPYING`\
  \ 文件、一个 `doc/hello_epm.html` 文件以及一个 `doc/hello_epm.man` 文件，并且我们的脚本 `hello_epm.py`\
  \ 必须位于同一目录中。\n\n如果我们想为我们的 `hello_epm.py` 工具“偷个懒”，只需在打包目录中放置空文件，可以这样做：\n\n```bash\n\
  $ pwd\n/tmp/release/hello_epm\n$ touch README\n$ touch COPYING\n$ mkdir doc\n$ touch\
  \ doc/hello_epm.html\n$ touch doc/hello_epm.man\n```\n\n查看我们的目录内部，我们有如下的布局：\n\n\
  ```bash\n$ ls -lR\ntotal 16\n-rw-r--r--  1 ngift  wheel     0 Mar 10 04:45 COPYING\n\
  -rw-r--r--  1 ngift  wheel     0 Mar 10 04:45 README\ndrwxr-xr-x  4 ngift  wheel\
  \     136 Mar 10 04:45 doc\n-rw-r--r--  1 ngift  wheel    1495 Mar 10 04:44 hello_epm.list\n\
  -rw-r--r--@ 1 ngift  wheel     278 Mar 10 04:10 hello_epm.py\n./doc:\ntotal 0\n\
  -rw-r--r--  1 ngift  wheel     0 Mar 10 04:45 hello_epm.html\n-rw-r--r--  1 ngift\
  \  wheel     0 Mar 10 04:45 hello_epm.man\n```\n\n#### 制作包\n\n现在，我们有了一个包含“list”文件的目录，该文件包含通用指令，这些指令可以在\
  \ EPM 支持的任何平台上运行。剩下的工作就是运行 `epm -f` 命令，后面加上我们所在的平台以及我们的列表文件的名称。示例 9-10 显示了在 OS X\
  \ 上的样子。\n\n示例 9-10. 使用 EPM 创建原生 OS X 安装程序\n\n```bash\n$ epm -f osx hello_epm hello_epm.list\n\
  epm: Product names should only contain letters and numbers!\n^C\n$ epm -f osx helloEPM\
  \ hello_epm.list\n$ ll\ntotal 16\n-rw-r--r--  1 ngift  wheel     0 Mar 10 04:45\
  \ COPYING\n-rw-r--r--  1 ngift  wheel     0 Mar 10 04:45 README\ndrwxr-xr-x  4 ngift\
  \  wheel     136 Mar 10 04:45 doc\n-rw-r--r--  1 ngift  wheel    1495 Mar 10 04:44\
  \ hello_epm.list\n-rw-r--r--@ 1 ngift  wheel     278 Mar 10 04:10 hello_epm.py\n\
  ./doc:\ntotal 0\n-rw-r--r--  1 ngift  wheel     0 Mar 10 04:45 hello_epm.html\n\
  -rw-r--r--  1 ngift  wheel     0 Mar 10 04:45 hello_epm.man\n```\n\n现在，我们有了一个包含“list”文件的目录，该文件包含了可以在\
  \ EPM 支持的任何平台上运行的通用指令。剩下的工作就是运行 `epm -f` 命令，后面加上我们所在的平台以及我们的列表文件的名称。\n\n# 第 10 章\
  \ 进程与并发\n\n## 引言\n\n作为 Unix/Linux 系统管理员，处理进程是生活的常态。你需要了解启动脚本、运行级别、守护进程、cron 任务、长时间运行的进程、并发以及许多问题。幸运的是，Python\
  \ 让这一切变得简单。\n\n## Subprocess\n\n从 Python 2.4 开始，`subprocess` 取代了几个旧模块：`os.system`、`os.spawn`、`os.popen`\
  \ 以及 `popen2` 命令。`subprocess` 对于需要处理进程和“调用命令行”的系统管理员和开发者来说是一项革命性的变化。它现在是许多事务的一站式解决方案，并且可能包含管理进程的能力。\n\
  \n`subprocess` 负责 Python 中的以下工作：创建新进程、连接标准输入、标准输出和错误流以及监听返回代码。\n\n为了激发你的兴趣，让我们遵循\
  \ KISS 原则（保持简单），使用 `subprocess` 执行最简单的事情，并执行一个微不足道的系统调用。参见示例 10-1。\n\n示例 10-1. Subprocess\
  \ 的最简单用法\n\n```python\nIn [4]: subprocess.call('df -k', shell=True)\nFilesystem\
  \   1024-blocks    Used Available Capacity  Mounted on\n/dev/disk0s2   97349872\
  \ 80043824  17050048   83%   /\ndevfs               106      106         0  100%\
  \   /dev\nfdesc                 1          1         0  100%   /dev\n```\n\n\n\n\
  \n\n```\nmap -hosts              0         0         0   100%    /net\nmap auto_home\
  \           0         0         0   100%    /home\nOut[4]: 0\n```\n\n使用相同的简单语法，也可以包含\
  \ shell 变量。示例 10-2 是一个查找主目录使用空间摘要的示例。\n\n### 示例 10-2. 磁盘使用摘要\n\n```\nIn [7]: subprocess.call('du\
  \ -hs $HOME', shell=True)\n28G    /Users/ngift\nOut[7]: 0\n```\n\n关于 `Subprocess`\
  \ 值得注意的一个有趣技巧是抑制标准输出（stdout）的能力。很多时候，人们只是想运行一个系统调用，而不关心 `stdout`。在这些情况下，通常希望处理 `subprocess.call`\
  \ 的 `stdout`。幸运的是，有一种非常简单的方法可以实现这一点。请参见 示例 10-3。\n\n### 示例 10-3. 抑制 subprocess.call\
  \ 的 stdout\n\n```python\nIn [3]: import subprocess\nIn [4]: ret = subprocess.call(\"\
  ping -c 1 10.0.1.1\",\n                             shell=True,\n              \
  \               stdout=open('/dev/null', 'w'),\n                             stderr=subprocess.STDOUT)\n\
  ```\n\n关于这两个示例以及 `subprocess.call` 本身，有几点需要注意。当你不在乎 shell 命令的输出只想让它运行时，通常使用 `subprocess.call`。如果你需要捕获命令的输出，你将需要使用\
  \ `subprocess.Popen`。`subprocess.call` 和 `subprocess.Popen` 之间还有另一个显著区别：`subprocess.call`\
  \ 会阻塞等待响应，而 `subprocess.Popen` 则不会。\n\n## 在 Subprocess 中使用返回码\n\n关于 `subprocess.call`\
  \ 一个值得注意的点是，你可以使用返回码（return codes）来判断命令的执行结果。如果你有 C 或 Bash 编程经验，你会对返回码感到非常熟悉。“exit\
  \ code”（退出码）和“return code”（返回码）这两个词通常互换使用，描述系统进程的状态码。\n\n每个进程在退出时都会有一个返回码，返回码的状态可以用于确定程序应该采取的操作。通常，如果程序以除零以外的代码退出，则表示发生错误。对于开发者来说，返回码一个显而易见的用途是判断如果需要使用的进程返回了非零退出码，则说明执行失败了。返回码不那么显而易见的用途还有许多有趣的可能性。程序未找到、程序不可执行以及程序被\
  \ Ctrl-C 终止都有其特殊的返回码。我们将在本节中探索在 Python 程序中使用这些返回码。\n\n让我们来看一些具有特殊含义的常见返回码列表：\n\n\
  - `0`: > 成功\n- `1`: > 通用错误\n- `2`: > shell 内置命令误用\n- `126`: > 调用的命令无法执行\n- `127`:\
  \ > 未找到命令\n- `128`: > 退出参数无效\n- `>n`: > 致命错误信号 “n”\n- `130`: > 脚本被 Ctrl-C 终止\n-\
  \ `255`: 退出状态超出范围\n\n这种情况最实用的场景是返回码 `0` 和 `1` 的使用，它们通常表示你刚刚运行的命令成功或失败。让我们来看一些使用\
  \ `subprocess.call` 的常见示例。请参见 示例 10-4。\n\n### 示例 10-4. subprocess.call 的失败返回码\n\n\
  ```\nIn [16]: subprocess.call(\"ls /foo\", shell=True)\nls: /foo: No such file or\
  \ directory\nOut[16]: 1\n```\n\n因为该目录不存在，我们收到了失败的返回码 `1`。我们也可以捕获返回码并使用它来编写条件语句。请参见\
  \ 示例 10-5。\n\n### 示例 10-5. 基于返回码真假设的 subprocess.call 条件语句\n\n```python\nIn [25]:\
  \ ret = subprocess.call(\"ls /foo\", shell=True)\nls: /foo: No such file or directory\n\
  In [26]: if ret == 0:\n    print \"success\"\nelse:\n    print \"failure\"\n```\n\
  \n这是一个“命令未找到”返回码的示例，值为 `127`。这可能是编写工具的一种有用方法，该工具可以根据可用性尝试运行多个 shell 命令。你可能先尝试运行\
  \ `rsync`，但如果得到返回码 `127`，你就会转向 `scp`。请参见 示例 10-6。\n\n### 示例 10-6. 基于返回码 127 的 subprocess.call\
  \ 条件语句\n\n```\nIn [28]: subprocess.call(\"rsync /foo\", shell=True)\n/bin/sh: rsync:\
  \ not found\nOut[28]: 127\n```\n\n\n\n\n如你所见，结合 `subprocess.call` 使用 `platform`\
  \ 模块可以是编写跨平台代码的有效武器。请参阅第 8 章 了解有关使用 `platform` 模块编写跨平台 *nix* 代码的详细信息。参见示例 10-8。\n\
  \n### 示例 10-8. 使用 Subprocess 捕标准输出\n\n```python\nIn [1]: import subprocess\nIn [2]:\
  \ p = subprocess.Popen(\"df -h\", shell=True, stdout=subprocess.PIPE)\nIn [3]: out\
  \ = p.stdout.readlines()\nIn [4]: for line in out:\n   ...:     print line.strip()\n\
  \   ...:\n   ...:\nFilesystem      Size   Used  Avail Capacity  Mounted on\n/dev/disk0s2\
  \    93Gi   78Gi   15Gi    85%    /\ndevfs          107Ki  107Ki   0Bi   100%  \
  \  /dev\nfdesc          1.0Ki  1.0Ki   0Bi   100%    /dev\nmap -hosts       0Bi\
  \    0Bi    0Bi   100%    /net\nmap auto_home    0Bi    0Bi    0Bi   100%    /home\n\
  ```\n\n注意 `readlines()` 返回的是一个带有换行符的列表。我们必须使用 `line.strip()` 来移除换行符。`Subprocess`\
  \ 还具有与 `stdin` 和 `stdout` 通信以创建管道的能力。这里有一个与进程标准输入通信的简单示例。我们可以用 Python 做的一件有趣的事情（而这在\
  \ Bash 中会非常糟糕）是创建一个“管道工厂”。通过极几行简单的代码，我们就能根据参数的数量创建并打印任意命令。请参见示例 10-9。\n\n### 示例\
  \ 10-9. Subprocess 管道工厂\n\n```python\ndef multi(*args):\n    for cmd in args:\n\
  \        p = subprocess.Popen(cmd, shell=True, stdout = subprocess.PIPE)\n     \
  \   out = p.stdout.read()\n        print out\n```\n\n这里是该简单实际运行的示例：\n\n```python\n\
  In [28]: multi(\"df -h\", \"ls -l /tmp\", \"tail /var/log/system.log\")\nFilesystem\
  \      Size   Used  Avail Capacity  Mounted on\n/dev/disk0s2    93Gi   80Gi   13Gi\
  \    87%    /\ndevfs          107Ki  107Ki   0Bi   100%    /dev\nfdesc         \
  \ 1.0Ki  1.0Ki   0Bi   100%    /dev\nmap -hosts       0Bi    0Bi    0Bi   100% \
  \   /net\nmap auto_home    0Bi    0Bi    0Bi   100%    /home\nlrwxr-xr-x@ 1 root\
  \  admin  11 Nov 24 23:37 /tmp -> private/tmp\nFeb 21 07:18:50 dhcp126 /usr/sbin/ocspd[65145]:\
  \ starting\nFeb 21 07:19:09 dhcp126 login[65151]: USER_PROCESS: 65151 ttys000\n\
  Feb 21 07:41:05 dhcp126 login[65197]: USER_PROCESS: 65197 ttys001\nFeb 21 07:44:24\
  \ dhcp126 login[65229]: USER_PROCESS: 65229 ttys002```\n\n由于 Python 和 `args` 的强大，我们可以使用函数作为工厂运行任意命令。由于\
  \ `args.pop(0)` 语法，命令是从列表开始被弹出的。如果使用 `args.pop()`，参数将按反序弹出。由于这可能会引起困惑，我们也可以使用简单的\
  \ `for` 循环编写相同的命令工厂函数：\n\n```python\ndef multi(*args):\n    for cmd in args:\n \
  \       p = subprocess.Popen(cmd, shell=True, stdout = subprocess.PIPE)\n      \
  \  out = p.stdout.read()\n        print out\n```\n\n管理员经常需要运行一系列命令，因此创建一个简化此过程的模块是有意义的。让我们通过一个简单的继承示例来看如何实现。参见示例\
  \ 10-10。\n\n### 示例 10-10. 为 Subprocess 封装模块\n\n```python\n#!/usr/bin/env python\n\
  from subprocess import call\nimport time\nimport sys\n\"\"\"Subtube 是一个简化并自动化 subprocess\
  \ 方面的模块\"\"\"\nclass BaseArgs(object):\n    \"\"\"处理关键字参数的基类\"\"\"\n    def __init__(self,\
  \ *args, **kwargs):\n        self.args = args\n        self.kwargs = kwargs\n  \
  \      if self.kwargs.has_key(\"delay\"):\n            self.delay = kwargs[\"delay\"\
  ]\n        else:\n            self.delay = 0\n        if self.kwargs.has_key(\"\
  verbose\"):\n            self.verbose = kwargs[\"verbose\"]\n        else:\n   \
  \         self.verbose = False\n    def run (self):\n        \"\"\"必须实现 run 方法\"\
  \"\"\n        raise NotImplementedError\n\nclass Runner(BaseArgs):\n    \"\"\"简化\
  \ subprocess call 并运行一系列命令\n       Runner 接收 N 个位置参数以及可选：\n       delay=1，单位为秒\n\
  \       verbose=True\"\"\"\n    def run(self):\n        for cmd in self.args:\n\
  \            if self.verbose:\n                print \"Running %s with delay=%s\"\
  \ % (cmd, self.delay)\n            time.sleep(self.delay)\n            call(cmd,\
  \ shell=True)\n```\n\n让我们看看如何使用新创建的模块：\n\n```python\nIn [8]: from subtube import\
  \ Runner\nIn [9]: r = Runner(\"df -h\", \"du -h\", verbose=True)\nIn [10]: r.run()\n\
  Filesystem      Size   Used  Avail Capacity  Mounted on\n/dev/disk0s2    93Gi  \
  \ 80Gi   13Gi    87%    /\ndevfs          107Ki  107Ki   0Bi   100%    /dev\nfdesc\
  \          1.0Ki  1.0Ki   0Bi   100%    /dev\nmap -hosts       0Bi    0Bi    0Bi\
  \   100%    /net\nmap auto_home    0Bi    0Bi    0Bi   100%    /home\n```\n\n由于\
  \ Python 和 `args` 的强大，我们可以使用函数作为工厂运行任意命令。由于 `args.pop(0)` 语法，命令是从列表开始被弹出的。如果使用 `args.pop()`，参数将按反序弹出。由于这可能会引起困惑，我们也可以使用简单的\
  \ `for` 循环编写相同的命令工厂函数：\n\n```python\ndef multi(*args):\n    for cmd in args:\n \
  \       p = subprocess.Popen(cmd, shell=True, stdout = subprocess.PIPE)\n      \
  \  out = p.stdout.read()\n        print out\n```\n\n管理员经常需要运行一系列命令，因此创建一个简化此过程的模块是有意义的。（注：提供的文本包含一些重复/重叠，我根据提供的代码流重构了逻辑）。\n\
  \n如果在所有系统中都设置了 SSH 密钥，我们可以很容易编写这样的代码：\n\n```python\nmachines = ['homer','marge','bart']\n\
  for machine in machines:\n    r = Runner(\"ssh \" + machine + \"df -h\", \"ssh \"\
  \ + machine + \"du -h\")\n```\n\n这确实是刻意的，但它也非常简单，因为红帽技术组有一个项目可以促进大型集群的批量脚本化。根据 Func\
  \ 网站的，“这是一个有趣且刻意的示例——重启所有运行 httpd 的系统。”我们在第 8 章中更详细讨论了 Func 的用法，并涵盖了一个运行在 *nix*\
  \ 平台上的自制“分发”系统。\n\n由于 `subprocess` 是用于“调用 shell”的统一 API，我们可以非常容易地写入 `stdin`。在示例\
  \ 10-11 中，我们将告诉字数工具监听标准输入，然后写入一个字符串供字数工具处理。\n\n```python\nIn [35]: p = subprocess.Popen(\"\
  wc -c\", shell=True, stdin=subprocess.PIPE)\nIn [36]: p.communicate(\"charactersinword\"\
  )\n```\n\n对应的 Bash 命令如下：\n\n```bash\n> echo charactersinword | wc -c\n```\n\n这次让我们模拟\
  \ Bash 并将文件重定向到标准输入。首先，我们需要向文件写入内容，让我们用新的 Python 2.6 语法来完成。记住，如果你使用的是 Python 2.5，必须使用\
  \ future import get：\n\n```python\nIn [5]: from __future__ import with_statement\n\
  In [6]: with open('temp.txt', 'w') as file:\n   ...:     file.write('charactersinword')\n\
  ```\n\n我们可以用经典方法重新打开文件并将内容读取为字符串赋值给 `f`：\n\n```python\nIn [7]: file = open('temp.txt')\n\
  In [8]: f = file.read()\n```\n\n\n\n然后我们将文件输出“重定向”到我们正在等待的进程：\n\n```\nIn [9]: p\
  \ = subprocess.Popen(\"wc -c\", shell=True, stdin=subprocess.PIPE)\nIn [10]: p.communicate(f)\n\
  In [11]: p.communicate(f)\n```\n`16`\n\n在 Bash 中，这等同于以下命令序列：\n\n```bash\n% echo\
  \ charactersinword > temp.txt\n% wc -c < temp.txt\n```\n`16`\n\n接下来，让我们看看如何像典型的\
  \ shell 场景那样将多个命令通过管道（pipe）连接在一起。让我们看看在 Bash 中管道连接的一系列命令，以及在 Python 中以相同方式管道连接的系列命令。我们经常遇到的一个真实示例是处理日志文件。在\
  \ 示例 10-12 中，我们正在寻找 Macintosh 笔记本电脑屏幕保护程序的成功登录记录。\n\n### 示例 10-12. 使用 Subprocess\
  \ 链命令\n\n在 Bash 中，这里有一个简单的链：\n\n```bash\n[ngift@Macintosh-6][H:10014][J:0]> cat\
  \ /etc/passwd | grep 0:0 | cut -d ':' -f 7\n/bin/sh\n```\n\n这是 Python 中相同的链：\n\n\
  ```python\nIn [7]: p1 = subprocess.Popen(\"cat /etc/passwd\", shell=True, stdout=subprocess.PIPE)\n\
  In [8]: p2 = subprocess.Popen(\"grep 0:0\", shell=True, stdin=p1.stdout, stdout=subprocess.PIPE)\n\
  In [9]: p3 = subprocess.Popen(\"cut -d ': ' -f 7\", shell=True, stdin=p2.stdout,\
  \ stdout=subprocess.PIPE)\nIn [10]: print p3.stdout.read()\n/bin/sh\n```\n\n仅仅因为我们可以使用\
  \ subprocess 管道来完成某些任务，并不意味着我们必须这样做做。在上一个示例中，我们通过管道连接一系列命令获取了 root 用户的 shell。Python\
  \ 有一个内置模块可以为我们完成此工作，因此知道有时你甚至不需要使用 Subprocess 是重要的；Python 可能会有一个内置模块可以为你完成工作。你可能想在\
  \ shell 中执行许多操作，例如 `tar` 或 `zip`，Python 也可以做到。如果你发现自己在使用 Subprocess 运行非常复杂的 shell\
  \ 管道，那么查看 Python 是否有对应的内置模块总是一个好主意。参见 示例 10-13。\n\n### 示例 10-13. 使用 pwd 密码数据库模块代替\
  \ Subprocess\n\n```python\nIn [1]: import pwd\nIn [2]: pwd.getpwnam('root')\nOut[2]:\
  \ ('root', '********', 0, 0, 'System Administrator', '/var/root', '/bin/sh')\nIn\
  \ [3]: shell = pwd.getpwnam('root')[-1]\nIn [4]: shell\nOut[4]: '/bin/sh'\n```\n\
  \nSubprocess 还可以同时处理发送输入和接收输出，并监听标准错误（stderr）。让我们来看这样一个示例。\n\n注意，在 IPython 内部我们使用“ed\
  \ upper.py”功能，当我们想要编写可能会阻塞的代码段时（例如 示例 10-14 中的代码），会自动切换到 Vim。\n\n### 示例 10-14. 发送输入、接收输出和标准错误\n\
  \n```python\nimport subprocess\np = subprocess.Popen(\"tr a-z A-Z\", shell=True,stdin=subprocess.PIPE,\
  \ stdout=subprocess.PIPE)\noutput, error = p.communicate(\"translatetoupper\")\n\
  print output\n```\n\n所以当我们在 IPython 内部退出 Vim 时，它会自动运行这段代码，并得到如下结果：\n\n```\ndone.\
  \ Executing edited code...\nTRANSLATETOUPPER\n```\n\n## 使用 Supervisor 管理进程\n\n作为一名系统管理员，你经常需要管理和处理进程。当\
  \ Web 开发人员发现他们的系统管理员是 Python 专家时，他们会非常兴奋，因为许多 Python Web 框架没有提供优雅的方法来临时管理长时间运行的进程。Supervisor\
  \ 可以通过控制长时间进程的方法并确保其在系统重启后重新启动来帮助这些情况。\n\nSupervisor 的功能远不止帮助 Web 应用部署；它有更广泛的用途。Supervisor\
  \ 可以作为跨平台控制器来管理和与进程进行交互。它可以在 *nix 系统上启动、停止和重启其他程序。它还可以重启崩溃的进程，这非常有用。Supervisor 的合作者\
  \ Chris McDonough 告诉我们，它还可以帮助管理“坏”的进程。例如，这可能包括消耗过多内存或占用 CPU 的进程。Supervisor 通过 XML-RPC\
  \ XML-RPC 接口扩展事件通知系统进行远程控制。\n\n大多数 *nix 系统管理员将主要关注“supervisord”，这是一个运行设计好的程序作为子进程的守护进程程序，以及“supervisorctl”，这是一个可以在统一会话中查看日志并控制进程的客户端程序。虽然也有\
  \ Web 界面，不过，这是一本关于 *nix 的书，所以我们直接继续吧。\n\n\n\n\n```\nsupervisor> tail -f daemon\n\
  \n== Press Ctrl-C to exit ==\n     for 3 seconds, then die\n     I just died\n \
  \    I will run for 3 seconds, then die\n```\n\n### 使用 Screen 管理进程\n\n管理长时间运行进程的另一种方法是使用\
  \ GNU `screen` 应用程序。作为一个系统管理员，即使你不会用它来管理 Python 程序，了解它也是值得的。`screen` 能够如此实用的核心功能之一是它允许你从一个长时间运行的进程中分离（detach）并在以后返回。这非常有用，以至于我们认为这是一项必须掌握的\
  \ Unix 技能。\n\n让我们来看一个典型的场景：我们想要从像 `trac` 这样长时间运行的 Web 应用中分离。配置 `trac` 有几种方法，但最简单的方法之一就是直接使用\
  \ `screen` 从独立的 `trac` 进程中分离。\n\n运行一个进程只需要使用 `screen`：在长时间运行的进程前面加上 `screen`，按下\
  \ `Ctrl-A`，然后按下 `Ctrl-D` 进行分离。要重新连接到该进程，你只需要输入 `screen` 然后再次按下 `Ctrl-A` 即可。\n\n\
  在 [示例 10-16] 中，我们告诉 `tracd` 在 `screen` 中运行。一旦进程启动，如果我们以后想重新连接，只需简单地使用 `Ctrl-A` 然后\
  \ `Ctrl-D` 进行分离。\n\n### 示例 10-16. 在 screen 中运行 Python 进程\n\n```\nscreen python2.4\
  \ /usr/bin/tracd --hostname=trac.example.com --port 8888\n  -r --single-env --auth=*\n\
  ,/home/noahgift/trac-instance/conf/password,tracadminaccount /home/example/trac-instance/\n\
  ```\n\n如果我需要重新连接，可以运行：\n\n```\n[root@cent ~]# screen -r\nThere are several suitable\
  \ screens on:\n4797.pts-0.cent    (Detached)\n24145.pts-0.cent    (Detached)\n```\n\
  \n输入“screen [-d] -r [pid.]tty.host”来恢复其中一个会。\n\n这种方法在生产环境中可能不是最佳选择，但在开发工作或个人使用时，它确实有其优势。\n\
  \n### Python 中的线程\n\n线程对某些人来说可以被视为“必要的恶”，尽管许多人讨厌线程，但它可以解决许多需要同时处理多个任务的问题。线程与进程不同，因为它们运行在同一个进程内部，并共享状态和内存。这既是线程最大的优势，也是最大的缺点。优势在于你可以创建一个所有线程都可以访问的数据结构，而无需创建\
  \ `IPC`（进程间通信机制）。\n\n处理线程还隐藏着复杂性。通常，一个只有几十行代码的简单程序在引入线程后可能会变得极其复杂。在没有添加大量追踪的情况下，线程很难调试，即使添加了追踪也很复杂，因为追踪的输出可能会变得令人困惑且无从下手。当其中一位作者编写一个发现数据中心的\
  \ SNMP 发现系统时，需要生成的线程数量之大非常难以处理。\n\n然而，处理线程有许多策略，实现一个健壮的追踪库就是其中之一。尽管如此，它们可以成为解决复杂问题非常有用的工具。\n\
  \n对于系统管理员来说，了解一些线程编程的基础知识可能有用。以下是线程用于日常系统管理任务的一些方式：自动发现网络、同时获取多个网页、对服务器进行压力测试以及执行与网络相关的任务。\n\
  \n为了符合我们的 KISS（保持简单）原则，让我们使用一个尽可能基础的线程示例。需要注意的是，对模块进行线程化需要对面向对象编程有理解。这可能是一个挑战，如果你没有太多或完全没有接触过面向对象编程（`OOP`），那么这个示例可能会有些令人困惑。我们建议买一本\
  \ Mark Lutz 的《Learning Python》（O'Reilly 出版）来理解 `OOP` 的一些基础，尽管你也可以参考我们的介绍并在那里练习一些技术。归根底，练习\
  \ `OOP` 编程是学习它的最佳方法。\n\n由于此书是关于实用的 Python 的，让我们直接进入一个我们能想的最简单的线程示例。在这个简单的线程脚本中，我们继承了\
  \ `threading.Thread`，设置了一个全局计数变量，然后重写了 `threading` 的 `run` 方法。最后，我们启动五个显式打印自己编号的线程。\n\
  \n在许多方面，这个示例过于简单且设计糟糕，因为我们使用了全局计数器以便多个线程可以共享状态。通常情况下，在线程中使用队列（queues）要好得多，因为它们会为你处理处理共享状态的复杂性。参见\
  \ [示例 10-17]。\n\n### 示例 10-17. 线程的 KISS 示例\n\n```python\n# 因为共享状态导致设计并不糟糕\nimport\
  \ threading\nimport time\ncount = 1\nclass KissThread(threading.Thread):\n    def\
  \ run(self):\n        global count\n        print(\"Thread #%s: doing stuff\" %\
  \ count)\n        count += 1\n        time.sleep(2)\n        print(\"done with stuff\"\
  )\nfor i in range(5):\n    KissThread().start()\n```\n\n```\n[ift@Macintosh-6~H:10464][0]>\
  \ python thread.py\nThread #1: doing stuff\nThread #2: doing stuff\nThread #3: doing\
  \ stuff\nThread #4: doing stuff\nThread #5: doing stuff\ndone with stuff\ndone with\
  \ stuff\ndone with stuff\ndone with stuff\ndone with stuff\n```\n\n\n\n\n\n作为后续线程示例的免责声明，请注意这些是相当复杂的示例，因为相同的功能可以使用\
  \ `subprocess.Popen` 来实现。如果你需要启动一组进程并等待响应，`subprocess.Popen` 是一个很好的选择。如果你需要与每个进程进行通信，那么将\
  \ `subprocess.Popen` 与线程结合是合适的。展示多个示例的目的在于强调：并发通常充满了带有权衡的选择。通常很难说哪种模型适用于所有场景，无论是线程、进程，还是像\
  \ stackless 或 twisted 这样的异步库。以下是 ping 大规模 IP 地址池最高效的方法。\n\n***\n\n现在我们已经完成了线程部分等同于“Hello\
  \ World”的内容，让我们来做一些系统管理员会欣赏的事情吧。让我们对示例进行轻微修改，创建一个小型脚本来网络进行 ping 扫描以获取响应。这是一个通用网络工具的入门包。请参阅\
  \ 示例 10-18。\n\n### 示例 10-18. 多线程 ping 扫描\n\n```python\n#!/usr/bin/env python\n\n\
  from threading import Thread\nimport subprocess\nfrom Queue import Queue\n\nnum_threads\
  \ = 3\nqueue = Queue()\nips = [\"10.0.1.1\", \"10.0.1.3\", \"10.0.1.11\", \"10.0.1.51\"\
  ]\n\ndef pinger(i, q):\n    \"\"\"Ping 子网\"\"\"\n    while True:\n        ip = q.get()\n\
  \        print \"Thread %s: Pinging %s\" % (i, ip)\n        ret = subprocess.call(\"\
  ping -c 1 %s\" % ip,\n                             shell=True,\n               \
  \              stdout=open('/dev/null', 'w'),\n                             stderr=subprocess.STDOUT)\n\
  \        if ret == 0:\n            print \"%s: is alive\" % ip\n        else:\n\
  \            print \"%s: did not respond\" % ip\n        q.task_done()\n\nfor i\
  \ in range(num_threads):\n    worker = Thread(target=pinger, args=(i, queue))\n\
  \    worker.setDaemon(True)\n    worker.start()\n\nfor ip in ips:\n    queue.put(ip)\n\
  \nprint \"Main Thread Waiting\"\nqueue.join()\nprint \"Done\"\n```\n\n当我们运行这段相当简单的代码时，会得到以下输出：\n\
  \n```bash\n[ngift@Macintosh-6][H:10432][J:0]# python ping_thread_basic.py\nThread\
  \ 0: Pinging 10.0.1.1\nThread 1: Pinging 10.0.1.3\nThread 2: Pinging 10.0.1.11\n\
  Main Thread Waiting\n10.0.1.1: is alive\nThread 0: Pinging 10.0.1.51\n10.0.1.3:\
  \ is alive\n10.0.1.51: is alive\n10.0.1.11: did not respond\nDone\n```\n\n这个示例值得被拆解为易理解的部分，但首先需要进行简单的解释。使用线程开发子网的\
  \ ping 扫描是使用线程的最佳示例之一。一个不使用线程的“正常”Python 程序将花费最多 $N * (每次 ping 的平均响应时间)$ 的时间。有两种\
  \ ping 状态：响应状态和超时状态。典型的网络是响应和超时的混合体。\n\n这意味着，如果你编写一个顺序检查具有 254 个地址的 C 类网络的 ping\
  \ 扫描应用程序，它可能需要花费 $254 * (~ 3 秒)$ 的时间。这相当于 12.7 分钟。如果你使用线程，我们可以将其时间缩短到几秒钟。这就是为什么线程对于网络编程至关重要。\n\
  \n\n\n\n该函数负责执行程序中的所有工作。每当从队列中拉出一个“ip”时，每个线程都会运行一次该函数。请注意，新的 IP 地址是从堆栈中弹出的，就像在列表中一样。这样做允许我们持续获取项目，直到队列为空。最后，注意在\
  \ own `while` 循环的结束处调用了 `q.task_done()`；这很重要，因为它告诉 `join()` 它已经完成了从队列中提取的内容。通俗地说，它表示任务已完成。让我们来看\
  \ `Queue.Queue.task_done` 的文档字符串：\n\n```python\nFile:        /System/Library/Frameworks/Python.framework/Versions/2.5/lib/python2.5/\n\
  Queue.py\n\nDefinition:    Queue.Queue.task_done(self)\n\nDocstring:\n\nIndicate\
  \ that a formerly enqueued task is complete.\nUsed by Queue consumer threads. For\
  \ each get() used to fetch a task,\na subsequent call to task_done() tells the queue\
  \ that the processing\non the task is complete.\nIf a join() is currently blocking,\
  \ it will resume when all items\nhave been processed (meaning that a task_done()\
  \ call was received\nfor every item that had been put() into the queue).\nRaises\
  \ a ValueError if called more times than there were items\nplaced in the queue.\n\
  ```\n\n从文档字符串中，我们可以看到 `q.get()`、`q.task_done()` 以及最后的 `q.join()` 之间存在某种关系。这几乎就像故事的开头、中间和结尾：\n\
  \n```python\ndef pinger(i, q):\n    \"\"\"Ping 测试子网\"\"\"\n    while True:\n   \
  \     ip = q.get()\n        print \"Thread %s: Pinging %s\" % (i, ip)\n        ret\
  \ = subprocess.call(\"ping -c 1 %s\" % ip,\n                             shell=True,\n\
  \                             stdout=open('/dev/null', 'w'),\n                 \
  \            stderr=subprocess.STDOUT)\n        if ret == 0:\n            print\
  \ \"%s: is alive\" % ip\n        else:\n            print \"%s: did not respond\"\
  \ % ip\n        q.task_done()\n```\n\n如果我们看下方，我们使用一个简单的 `for` 循环作为控制器，来协调线程池的生成。注意，这个线程池将一直停留并“阻塞”或等待，直到队列中被放置了东西。直到下一个部分，才会发生任何事情。\n\
  \n我们的程序中潜伏着一个微妙的惊喜，这一定会让你措手不及。注意 `setDaemon(True)` 的使用。如果在此调用 `start` 方法之前没有设置它，我们的程序将无限挂起。\n\
  \n原因相当微妙，这是因为只有当守护线程（daemon threads）运行时，程序才会退出。你可能已经注意到在 `pinger` 函数中，我们使用了无限循环。由于线程永远不会死亡，因此将它们声明为守护线程至关重要。要看到这种现象，只需注释掉\
  \ `worker.start()` 那行看看会发生什么。直奔主题地说，如果不将线程设置为守护标记，程序将无限挂起。你应该亲自测试一下，因为这会夺走该过程的部分魔力所在：\n\
  \n```python\nfor i in range(num_threads):\n    worker = Thread(target=pinger, args=(i,\
  \ queue))\n    worker.setDaemon(True)\n    worker.start()\n```\n\n到程序的这一步，我们已经有一个愤怒的三个线程池在等待听命。它们只需要在队列中放置项目，因为这会向我们的线程发送信号，让它们获取项目并执行我们告诉它们的任务，在本例中是\
  \ ping 一个 IP 地址：\n\n```python\nfor ip in ips:\n    queue.put(ip)\n```\n\n最后，夹在两个\
  \ print 语句中间的这一关键行最终控制了程序。正如我们之前讨论的，在队列上调用 `join` 将导致程序的主线程等待直到队列为空。这就是为什么线程和队列就像巧克力和花生酱。它们单独存在时都很棒，但结合在一起，它们就成了一份特别美味的甜点。\n\
  \n```python\nprint \"Main Thread Waiting\"\nqueue.join()\nprint \"Done\"\n```\n\n\
  为了真正理解线程和队列，我们需要将示例更推进一步，创建另一个线程池和另一个队列。在第一个示例中，我们 ping 了一个线程池从队列中抓取的 IP 地址列表。在接下来的示例中，我们将让第一组线程池将响应\
  \ ping 的有效 IP 地址放入第二个队列中。\n\n接下来，我们的第二组线程池将从第一个队列中获取 IP 地址，然后执行 arping，如果能找到，则返回\
  \ IP 地址以及 Mac 地址。让我们看看它是怎样的。参见 示例 10-20。\n\n### 示例 10-20. 多队列与多线程池\n\n```python\n\
  #!/usr/bin/env python\n#这需要 Python2.5 或更高版本\nfrom threading import Thread\nimport\
  \ subprocess\nfrom Queue import Queue\nimport re\n\nnum_ping_threads = 3\nnum_arp_threads\
  \ = 3\nin_queue = Queue()\nout_queue = Queue()\nips = [\"10.0.1.1\", \"10.0.1.3\"\
  , \"10.0.1.11\", \"10.0.1.5\"]\ndef pinger(i, iq, oq):\n    \"\"\"Ping 测试子网\"\"\"\
  \n    while True:\n        ip = iq.get()\n        print \"Thread %s: Pinging %s\"\
  \ % (i, ip)\n        ret = subprocess.call(\"ping -c 1 %s\" % ip,\n            \
  \                 shell=True,\n                             stdout=open('/dev/null',\
  \ 'w'),\n                             stderr=subprocess.STDOUT)\n        if ret\
  \ == 0:\n            #print \"%s: is alive\" % ip\n            #将有效 ip 放入下一个队列\n\
  \            oq.put(ip)\n        else:\n            print \"%s: did not respond\"\
  \ % ip\n        iq.task_done()\n\ndef arping(i, oq):\n    \"\"\"从队列获取有效 IP 并获取 mac\
  \ 地址\"\"\"\n    while True:\n        ip = oq.get()\n        p = subprocess.Popen(\"\
  arping -c 1 %s\" % ip,\n                             shell=True,\n             \
  \                stdout=subprocess.PIPE)\n        out = p.stdout.read()\n      \
  \  #从 stdout 解析 mac 地址\n        result = out.split()\n        pattern = re.compile(\"\
  :\")\n        macaddr = None\n        for item in result:\n            if re.search(pattern,\
  \ item):\n                macaddr = item\n        print \"IP Address: %s | Mac Address:\
  \ %s \" % (ip, macaddr)\n        oq.task_done()\n\n#将 ip 地址放入队列\nfor ip in ips:\n\
  \    in_queue.put(ip)\n#启动 ping 线程\nfor i in range(num_ping_threads):\n    worker\
  \ = Thread(target=pinger, args=(i, in_queue, out_queue))\n    worker.setDaemon(True)\n\
  \    worker.start()\n#启动 arping 线程\nfor i in range(num_arp_threads):\n    worker\
  \ = Thread(target=arping, args=(i, out_queue))\n    worker.setDaemon(True)\n   \
  \ worker.start()\n\nprint \"Main Thread Waiting\"\n#确保两个队列都为空后程序才退出\nin_queue.join()\n\
  out_queue.join()\nprint \"Done\"\n```\n\n如果我们运行这段代码，输出如下：\n\n```\npython2.5 ping_thread_basic_2.py\n\
  Main Thread Waiting\nThread 0: Pinging 10.0.1.1\nThread 1: Pinging 10.0.1.3\nThread\
  \ 2: Pinging 10.0.1.11\nThread 0: Pinging 10.0.1.51\nIP Address: 10.0.1.1 | Mac\
  \ Address: [00:00:00:00:00:01]\nIP Address: 10.0.1.51 | Mac Address: [00:00:00:80:E8:02]\n\
  IP Address: 10.0.1.3 | Mac Address: [00:00:00:07:E4:03]\n10.0.1.11: did not respond\n\
  Done\n```\n\n为了实现这个解决方案，我们通过添加另一个线程池和队列，稍微扩展了第一个示例的行为。这是你个人工具箱中一项重要的技术，因为使用 `queue`\
  \ 模块会让线程的使用变得简单且安全得多。可以说，它甚至是是必要的。\n\n## 使用 threading.Timer 实现线程定时延迟\n\nPython 还有另一个对于系统管理任务非常有用的功能。通过使用\
  \ `threading.Timer`，可以很容易地在线程内部运行函数的定时执行。示例 10-21 是为了演示设计的。\n\n```python\n#!/usr/bin/env\
  \ python\nfrom threading import Timer\nimport sys\nimport time\n```\n\n\n\n\n\n\
  ```python\nimport copy\n\n#简单的错误处理\nif len(sys.argv) != 2:\n    print \"Must enter\
  \ an interval\"\n    sys.exit(1)\n\n# 我们将运行的函数\ndef hello():\n    print \"Hello,\
  \ I just got called after a %s sec delay\" % call_time\n\n# 在这里我们创建一个延迟的线程\ndelay\
  \ = sys.argv[1]\ncall_time = copy.copy(delay)    # 我们复制了延迟以便稍后使用\nt = Timer(int(delay),\
  \ hello)\nt.start()\n\n# 我们验证自己没有被阻塞，并且主程序正在继续\nprint \"waiting %s seconds to run\
  \ function\" % delay\nfor x in range(int(delay)):\n    print \"Main program is still\
  \ running for %s more sec\" % delay\n    delay = int(delay) - 1\n    time.sleep(1)\n\
  ```\n\n如果我们运行这段代码，可以看到主线程（或程序）在继续运行，同时为我们的函数触发了定时延迟：\n\n```\n[ngift@Macintosh-6][H:10468][J:0]#\
  \ python thread_timer.py 5\nwaiting 5 seconds to run function\nMain program is still\
  \ running for 5 more sec\nMain program is still running for 4 more sec\nMain program\
  \ is still running for 3 more sec\nMain program is still running for 2 more sec\n\
  Main program is still running for 1 more sec\nHello, I just got called after a 5\
  \ sec delay\n```\n\n## 多线程事件处理器\n\n由于这是一本关于系统管理的书，让我们使用之前的技术来完成一个真实的应用。在示例中，我们采用了之前的延迟线程技巧，并结合了一个事件循环，该循环监控两个目录文件名的变化。我们可以做得非常复杂，去检查文件的修改时间，但本着示例简单的初衷，我们将观察这个事件循环如何查找已注册的事件，如果触发了事件，则会在延迟线程中调用一个动作方法。\n\
  \n这个模块可以很容易地抽象成一个更通用的工具，但目前 示例 10-22 是硬编码的，通过在延迟的后台线程中使用 `rsync -av --delete` 来保持两个目录的同步（如果它们不同步的话）。\n\
  \n### 示例 10-22. 多线程目录同步工具\n\n```python\n#!/usr/bin/env python\nfrom threading import\
  \ Timer\nimport sys\nimport time\nimport copy\nimport os\nfrom subprocess import\
  \ call\n\nclass EventLoopDelaySpawn(object):\n    \"\"\"一个在延迟线程中产生方法的事件循环类\"\"\"\
  \n    def __init__(self, poll=10,\n                         wait=1,\n          \
  \               verbose=True,\n                         dir1=\"/tmp/dir1\",\n  \
  \                       dir2=\"/tmp/dir2\"):\n        self.poll = int(poll)\n  \
  \      self.wait = int(wait)\n        self.verbose = verbose\n        self.dir1\
  \ = dir1\n        self.dir2 = dir2\n    def poller(self):\n        \"\"\"创建轮询间隔\"\
  \"\"\n        time.sleep(self.poll)\n        if self.verbose:\n            print\
  \ \"Polling at %s sec interval\" % self.poll\n    def action(self):\n        if\
  \ self.verbose:\n            print \"waiting %s seconds to run Action\" % self.wait\n\
  \        ret = call(\"rsync -av --delete %s/s\" % (self.dir1, self.dir2), shell=True)\n\
  \    def eventHandler(self):\n        #如果两个目录包含相同的名称\n        if os.listdir(self.dir1)\
  \ != os.listdir(self.dir2):\n            print os.listdir(self.dir1)\n         \
  \   t = Timer((self.wait), self.action)\n            t.start()\n            if self.verbose:\n\
  \                print \"Event Registered\"\n        else:\n            if self.verbose:\n\
  \                print \"No Event Registered\"\n    def run(self):\n        \"\"\
  \"运行带有延迟动作的事件循环\"\"\"\n        try:\n            while True:\n                self.eventHandler()\n\
  \                self.poller()\n        except Exception, err:\n            print\
  \ \"Error: %s \" % err\n        finally:\n            sys.exit(0)\n\nE = EventLoopDelaySpawn()\n\
  E.run()\n```\n\n细心的读者可能会认为，延迟并不是严格必要的，事实确实如此。然而，延迟可以产生一些额外的处。如果你添加了一个（例如五秒）的延迟，当你发现了另一个事件时（例如你的主目录被意外删除了），你可以告诉线程取消。线程延迟是创建可以被取消的条件未来操作的极佳机制。\n\
  \n### 进程\n\n线程不是 Python 中处理并发的唯一方式。事实上，进程相比线程具有一些优势，因为它们可以扩展到多个处理器，而 Python 中的线程则不然。由于\
  \ `GIL`（或全局解释器锁）的存在，一次只有一个线程可以真正运行，并且它被限制在单个处理器。然而，为了让 Python 代码充分利用 CPU，线程不是一个很好的选择。在这些情况下，使用独立的进程会更好。\n\
  \n如果一个问题需要使用多个处理器，那么进程是一个很棒的选择。此外，许多库无法在线程中工作。例如，当前 Python 的 `Net-SNMP` 库是同步的，因此编写并发代码需要使用分叉进程（forked\
  \ processes）。\n\n虽然线程共享全局状态，但进程是完全独立的，与进程的通信需要更多的努力。幸运的是，我们将在后面详细讨论如何通过管道与进程通信。我们之前提到过使用\
  \ `subprocess.Popen` 产生进程的替代方法。\n\n### Processing 模块\n\n那么，我们所暗示的 processing 模块到底是什么？在本书出版时，“processing\
  \ 是一个使用标准库 API 产生进程的包……”processing 模块的优点之一是它在很大程度上映射到了 `threading` API。这意味着你不需要学习新的\
  \ API 来分叉进程而不是线程。访问 [`pypi.python.org/pypi/processing`](https://pypi.python.org/pypi/processing)\
  \ 获取更多关于 processing 模块的信息。\n\n### 注意\n\n正如我们之前提到的，并发并不简单。这个示例也可以被认为是低效的，因为我们可以使用\
  \ `subprocess.Popen` 而不是通过 processing 模块分叉，然后运行 `subprocess.call`。然而，在较大的应用上下文中，使用\
  \ `queue` 类型 API 有一些好处，因此它作为之前线程示例的一个合理的对比。有一些关于将 processing 模块合并到 `Subprocess`\
  \ 中的讨论，因为 `Subprocess` 目前缺乏像 processing 模块那样管理一组进程的能力。这一请求出现在 `Subprocess` 的原始 `PEP`（Python\
  \ 增强提案）中：[`www.python.org/dev/peps/pep-0324/`](http://www.python.org/dev/peps/pep-0324/)。\n\
  \n* * *\n\n现在我们已经对 processing 模块有了背景了解，让我们来看看 示例 10-23。\n\n### 示例 10-23. processing\
  \ 模块简介\n\n```python\n#!/usr/bin/env python\nfrom processing import Process, Queue\n\
  import time\n\ndef f(q):\n    x = q.get()\n    print \"Process number %s, sleeps\
  \ for %s seconds\" % (x,x)\n    time.sleep(x)\n    print \"Process number %s finished\"\
  \ % x\n\nq = Queue()\nfor i in range(10):\n    q.put(i)\n    i = Process(target=f,\
  \ args=[q])\n    i.start()\n\nprint \"main process joins on queue\"\ni.join()\n\
  ```\n\n\n\n\n\n```\nprint \"Main Program finished\"\n```\n\n如果我们查看输出结果，可以看到以下内容：\n\
  \n```\n[ngift@Macintosh-7][H:11199][J:0]# python processing1.py\nProcess number\
  \ 0, sleeps for 0 seconds\nProcess number 0 finished\nProcess number 1, sleeps for\
  \ 1 seconds\nProcess number 2, sleeps for 2 seconds\nProcess number 3, sleeps for\
  \ 3 seconds\nProcess number 4, sleeps for 4 seconds\nmain process joins on queue\n\
  Process number 5, sleeps for 5 seconds\nProcess number 6, sleeps for 6 seconds\n\
  Process number 8, sleeps for 8 seconds\nProcess number 7, sleeps for 7 seconds\n\
  Process number 9, sleeps for 9 seconds\nProcess number 1 finished\nProcess number\
  \ 2 finished\nProcess number 3 finished\nProcess number 4 finished\nProcess number\
  \ 5 finished\nProcess number 6 finished\nProcess number 7 finished\nProcess number\
  \ 8 finished\nProcess number 9 finished\nMain Program finished\n```\n\n这个程序所做的就是让每个进程睡眠的时间等于其进程编号。如你所见，这是一个简洁且直观的\
  \ API。\n\n既然我们已经完成了 `processing` 模块的等同于 Hello World，我们可以做一些更有趣的事情。如果你还记得在线程章节，我们写过一个简单的线程子网发现脚本。由于\
  \ `processing` API 与线程 API 非常相似，我们可以使用进程代替线程来实现一个几乎完全相同的脚本。参见示例 10-24。\n\n### 示例\
  \ 10-24. 基于进程的 ping 扫描\n\n```python\n#!/usr/bin/env python\nfrom processing import\
  \ Process, Queue, Pool\nimport time\nimport subprocess\nfrom IPy import IP\nimport\
  \ sys\n\nq = Queue()\nips = IP(\"10.0.1.0/24\")\ndef f(i,q):\n    while True:\n\
  \        if q.empty():\n            sys.exit()\n        print \"Process Number:\
  \ %s\" % i\n        ip = q.get()\n        ret = subprocess.call(\"ping -c 1 %s\"\
  \ % ip,\n                             shell=True,\n                            \
  \ stdout=open('/dev/null', 'w'),\n                             stderr=subprocess.STDOUT)\n\
  \        if ret == 0:\n            print \"%s: is alive\" % ip\n        else:\n\
  \            print \"Process Number: %s didn’t find a response for %s \" % (i, ip)\n\
  for ip in ips:\n    q.put(ip)\n#q.put(\"192.168.1.1\")\nfor i in range(50):\n  \
  \  p = Process(target=f, args=[i,q])\n    p.start()\nprint \"main process joins\
  \ on queue\"\np.join()\nprint \"Main Program finished\"\n```\n\n这段代码看起来与我们之前审查的线程代码非常相似。如果我们查看输出，也会看到类似的内容：\n\
  \n```\n[snip]\n10.0.1.255: is alive\nProcess Number: 48 didn't find a response for\
  \ 10.0.1.216\nProcess Number: 47 didn't find a response for 10.0.1.217\nProcess\
  \ Number: 49 didn't find a response for 10.0.1.218\nProcess Number: 46 didn't find\
  \ a response for 10.0.1.219\nMain Program finished\n[snip]\n[ngift@Macintosh-7][H:11205][J:0]#\n\
  ```\n\n这段代码需要一些解释。尽管 API 相似，但它略有不同。注意，每个进程都运行在一个无限循环中，从队列中获取项。为了让 `processing` 模块中的进程“离开”，我们创建了一个条件语句来检查队列是否为空。50\
  \ 个线程中的每一个线程首先检查队列是否为空，如果为空，它们就会通过运行 `sys.exit` 来完成“自杀”。\n\n如果队列中还有内容，进程就会乐快地获取该项（在本例中是一个\
  \ IP 地址），并执行分配给它的任务（在本例中 ping 该 IP 地址）。主程序使用了 `join`，就像我们在线程脚本中做的那样，并在队列上等待直到它为空。在所有工作进程都死亡且队列为空后，下一个打印语句就会执行，说明程序已完成。\n\
  \n对于像 `processing` 模块这样简单易用的 API，使用分叉（forking）代替线程是显而易见的选择。在第 7 章中，我们讨论了使用 `processing`\
  \ 模块结合 Net-SNMP 的实际实现，与 Python 有同步绑定。\n\n# 进程调度\n\n现在我们已经涵盖了在 Python 中使用进程的方法，我们应该讨论一下调度这些进程的方法。使用传统的\
  \ `cron` 非常适合运行 Python 进程。\n\n许多 POSIX 系统中 `cron` 的一个很好的新特性是调度目录的出现。这是我们现在使用 `cron`\
  \ 的唯一方法，因为只需将 Python 脚本丢入一个默认目录之一：`/etc/cron.daily*`、`/etc/cron.hourly*`、`/etc/cron.monthly*`\
  \ 和 `/etc/cron.weekly*` 就非常方便。\n\n\n\n\n\n# 什么是守护进程（Daemon）？\n\n守护进程通常被认为是一种没有控制终端的后台任务。如果你熟悉\
  \ Unix 作业控制，你可能会认为在命令末尾加上 `&` 就会使其变成守护进程。或者可能启动一个进程后按下 `Ctrl-z` 然后执行 `bg` 命令会变成守护进程。这两种操作都能让进程在后台运行，但没有一种能将进程从你的\
  \ shell 进程中释放出来，并与控制终端（很可能是你 shell 进程的终端）分离。\n\n因此，守护进程有三个特征：\n1. 在后台运行。\n2. 与启动它的进程解离。\n\
  3. 没有控制终端。\n\n使用普通的 shell 作业控制将进程后台化只能实现上述第一个点。\n\n# `daemonize()` 函数\n\n下面的代码定义了一个名为\
  \ `daemonize()` 的函数，它使调用代码按照我们在上一段中讨论的含义变成守护进程。该函数提取自 David Ascher 著作的 *Python Cookbook*\
  \ 第二版（O’Reilly）第 388–389 页中的“在 Unix 上派生守护进程”配方。这段代码紧密遵循了 Richard Stevens 在其著作 *UNIX\
  \ Network Programming: The Sockets Networking API*（O’Reilly）中为“正确”守护化进程的方法列出的步骤。对于任何不熟悉\
  \ Stevens 书的人来说，它通常被认为是 Unix 网络编程以及在 Unix 下创建守护进程的*权威*参考书。参见示例 10-26。\n\n## 示例 10-26.\
  \ Daemonize 函数\n\n```python\nimport sys, os\n\ndef daemonize (stdin='/dev/null',\
  \ stdout='/dev/null', stderr='/dev/null'):\n    # 执行第一次 fork。\n    try:\n      \
  \  pid = os.fork()\n        if pid > 0:\n            sys.exit(0) # 退出父进程。\n    except\
  \ OSError, e:\n        sys.stderr.write(\"fork #1 failed: (%d) %s\\n\" % (e.errno,\
  \ e.strerror))\n        sys.exit(1)\n    # 从父进程环境解耦。\n    os.chdir(\"/\")\n    os.umask(0)\n\
  \    os.setsid()\n    # 执行第二次 fork。\n    try:\n        pid = os.fork()\n       \
  \ if pid > 0:\n            sys.exit(0) # 退出第二个父进程。\n    except OSError, e:\n   \
  \     sys.stderr.write(\"fork #2 failed: (%d) %s\\n\" % (e.errno, e.strerror))\n\
  \        sys.exit(1)\n    # 进程现在已守护化，重定向标准文件描述符。\n    for f in sys.stdout, sys.stderr:\
  \ f.flush()\n    si = file(stdin, 'r')\n    so = file(stdout, 'a+')\n    se = file(stderr,\
  \ 'a+', 0)\n    os.dup2(si.fileno(), sys.stdin.fileno())\n    os.dup2(so.fileno(),\
  \ sys.stdout.fileno())\n    os.dup2(se.fileno(), sys.stderr.fileno())\n```\n\n#\
  \ 实现细节\n\n这段代码的第一件事是 `fork()` 一个进程。。fork()` 会创建一个运行进程的副本，其中副本被视为“子”进程，而原始进程被视为“父”进程。子进程派生后，父进程就可以自由退出。我们检查\
  \ fork 之后的 `pid` 是什么。如果 `pid` 为正数，意味着我们在父进程中。如果你从未 `fork()` 过子进程，这对你来说可能有点奇怪。在 `os.fork()`\
  \ 调用完成后，将有两个相同进程的副本在运行。它们都会检查 `fork()` 调返回值，该调用在子进程中返回 `0`，在父进程中返回进程 ID。任何具有非零返回值的进程（只有父进程）都会退出。如果在此处发生异常，进程将退出。如果你是从交互式\
  \ shell（如 Bash）调用此脚本，你现在将回到你的提示符，因为进程已经退出了。\n\n进程下一步执行的操作是 `os.chdir(\"/\")`、`os.umask(0)`\
  \ 和 `os.setsid()`。这些确保了进程不会绑定到原始目录、权限或终端。\n\n一旦进程守护化，我们就重定向标准文件描述符。我们使用 `os.dup2()`\
  \ 将 `stdin`、`stdout` 和 `stderr` 映射到打开的文件（或 `/dev/null`）。\n\n# 如何使用守护进程器\n\n要使用该函数，你可以创建一个如下的脚本：\n\
  \n## 示例 10-27. 使用守护进程器\n\n```python\nfrom daemonize import daemonize\nimport time\n\
  import sys\n\ndef mod_5_watcher():\n    start_time = time.time()\n    end_time =\
  \ start_time + 20\n    while time.time() < end_time:\n        now = time.time()\n\
  \        if int(now) % 5 == 0:\n            sys.stderr.write('Mod 5 at %s\\n', now)\n\
  \        else:\n            sys.stdout.write('No mod 5 at %s\\n', now)\n       \
  \ time.sleep(1)\n\nif __name__ == '__main__':\n    daemonize(stdout='/tmp/stdout.log',\
  \ stderr='/tmp/stderr.log')\n```\n\n运行此脚本后，你会立即看到一个新的提示符静静出现：\n\n```bash\njmjones@dinkgutsy:code$\
  \ python use_daemonize.py\njmjones@dinkgutsy:code$\n```\n\n你可以通过查看文件来检查结果：\n\n```bash\n\
  jmjones@dinkgutsy:code$ cat /tmp/stdout.log\n```\n\n\n\n\n\n`No mod 5 at 1207272453.18`\n\
  `No mod 5 at 1207272454.18`\n`No mod 5 at 1207272456.18`\n`No mod 5 at 1207272457.19`\n\
  `No mod 5 at 1207272458.19`\n`No mod 5 at 1207272459.19`\n`No mod 5 at 1207272461.2`\n\
  `No mod 5 at 1207272462.2`\n`No mod 5 at 1207272463.2`\n`No mod 5 at 1207272464.2`\n\
  `No mod 5 at 1207272466.2`\n`No mod 5 at 1207272467.2`\n`No mod 5 at 1207272468.2`\n\
  `No mod 5 at 1207272469.2`\n`No mod 5 at 1207272471.2`\n`No mod 5 at 1207272472.2`\n\
  \n```bash\njmjones@dinkgutsy:code$ cat /tmp/stderr.log\n```\n\n`Mod 5 at 1207272455.18`\n\
  `Mod 5 at 1207272460.2`\n`Mod 5 at 1207272465.2`\n`Mod 5 at 1207272470.2`\n\n这是一个编写守护进程（daemon）的非常简单的示例，但希望它能传达基本概念。你可以使用这个守护进程工具来编写目录监控器、网络监控器、网络服务器，或者你想象的任何运行长时间（或未指定时长）的程序。\n\
  \n### 总结\n\n希望这一章展示了 Python 在处理进程方面是多么成熟和强大。Python 拥有优雅且复杂的线程 API，但始终记住 `GIL`（全局解释器锁）是有好处的。如果你是\
  \ I/O ，这通常不是问题，但如果你需要多个处理器，那么使用进程是一个很好的选择。有些人认为，即使 GIL 不存在，进程也比线程更好。其主要原因是，调试线程代码可能是一场噩梦。\n\
  \n最后，如果你还不熟悉 `Subprocess` 模块，那是一个好主意。`Subprocess` 是处理子进程（嗯，子进程）的一站式工具。\n\n# 第 11\
  \ 章：构建 GUI\n\n当有学识的人考虑系统管理员的职责时，构建 GUI 应用可能完全没有出现在脑海中。然而，在某些时候你*需要*构建 GUI 应用，或者通过构建\
  \ GUI 应用，你的生活会比不构建时更容易。我们在这里使用的 GUI 是广义的，意味着使用 `GTK` 和 `QT` 等工具包的传统 GUI 应用，以及基于\
  \ Web 的应用程序。\n\n本章将重点关注 `PyGTK`、`curses` 和 `Django`。我们将从 GUI 构建的基础知识开始，然后转向使用 `PyGTK`\
  \ 创建一个相当简单的应用程序，然后使用 `curses` 创建相同的应用。最后，我们将向你展示 `Django` 如何用极少的代码作为数据库的精美前端。\n\n\
  ## GUI 理论\n\n当你编写一个控制台实用程序时，你通常期望它在没有干预的情况下运行。当从 `cron` 和 `at` 运行脚本时，情况确实如此。但当你编写一个\
  \ GUI 工具时，你期望用户必须提供某些输入才能让事情发生。想一你使用 GUI 应用（如网络浏览器、邮件客户端和文字处理器）的体验。\n\n应用程序会执行某种初始化，可能加载某些配置并将自身置某种状态。但通常情况下，应用程序只是等待用户做些什么。当然，也有应用程序独立运行的例子，例如\
  \ Firefox 在没有请求的情况下检查更新，但那是另一个话题了。\n\n应用程序在等待什么？当用户做某事时，它如何知道该做什么？应用程序在等待一个 `event`（事件）的发生。事件只是应用程序内部发生的某些事情，具体针对某一个\
  \ GUI 组件，例如按钮被按下或复选框被勾选。当这些事件发生时，应用程序“知道”该做什么，是因为程序员将事件与某些代码关联起来。与特定事件关联的“代码段”被称为事件处理器（event\
  \ handlers）。GUI 工具包的工作之一是在当关联事件发生时调用正确的事件处理器。更精确一点，GUI 工具包提供了一个 `event loop`（事件循环），它循环运行，等待事件，当事件发生时，它会恰当地处理它们。\n\
  \n行为是事件驱动的。当你编写 GUI 应用时，你决定了当用户做某事时你希望你的应用如何表现。你设置了事件处理器，当用户触发事件时，GUI 工具包会调用它们。\n\
  \n这描述了应用程序的行为，但表单（form）呢？你如何在应用程序上获取按钮、文本字段和复选框？这个问题的答案可能有所不同。你所选择的 GUI 工具包可能有一个\
  \ GUI 构建器。GUI 构建器会布局各种组件，如按钮等。如果你在 Mac 上编写 Cocoa 应用，`Interface Builder` 可用。如果你在\
  \ Linux 上使用 `PyGTK`，可以使用 `Glade`。如果你使用 `PyQT`，可以使用 `QT Designer`。GUI 构建器很有帮助，但有时你可能想要比构建器提供的更多控制。在这种情况下，通过编写少量代码来“手动”布局\
  \ GUI GUI 困难。在 `PyGTK` 中，每种 GUI 组件对应一个类。例如，窗口是 `gtk.Window` 类。按钮是 `gtk.Button` 类。如果你想让按钮在被点击时执行某些事情，你必须为\
  \ `clicked` 事件指定一个事件处理器。\n\n# 构建简单的 PyGTK 应用\n\n我们将创建一个使用前面提到的 `gtk.Window` 和 `gtk.Button`\
  \ 类的简单代码。以下是一个简单的 GUI 应用程序，展示了一些 GUI 编程的基本原理。\n\n在能够运行此示例或编写自己的 PyGTK 应用之前，你必须安装\
  \ `PyGTK`。如果你运行的是较新的 Linux 发行版，这非常简单。对于 Windows 看起来如此。如果你运行 Ubuntu，它应该已经安装了。如果你的平台没有二进制发行版，你可以做好痛苦。\n\
  \n示例 11-1 带有窗口和按钮的简单 PyGTK 应用\n\n```python\n#!/usr/bin/env python\nimport pygtk\n\
  import gtk\nimport time\n\nclass SimpleButtonApp(object):\n    \"\"\"这是一个带有窗口和按钮的简单\
  \ PyGTK 应用。\n    当按钮被点击时，它会用当前时间更新按钮的标签。\n    \"\"\"\n    def __init__(self):\n\
  \        #应用程序的主窗口\n        self.window = gtk.Window(gtk.WINDOW_TOPLEVEL)\n    \
  \    #这是你“注册”事件处理器的方法。基本上，\n        #这告诉 gtk 主循环在窗口发射“destroy”信号时调用 self.quit()。\n\
  \        self.window.connect(\"destroy\", self.quit)\n        #标签为“Click Me”的按钮\n\
  \        self.button = gtk.Button(\"Click Me\")\n        #另一个事件处理器的注册。这一次，当按钮\n\
  \        #发射“clicked”信号时，“update_button_label”方法将被调用。\n        self.button.connect(\"\
  clicked\", self.update_button_label, None)\n        #窗口是一个容器。“add”方法将按钮放入\n    \
  \    #窗口中。\n        self.window.add(self.button)\n        #此调用让按钮可见，但在容器变得可见之前，它也不会可见。\n\
  \        self.button.show()\n        #让容器可见\n        self.window.show()\n\n    def\
  \ update_button_label(self, widget, data=None):\n        \"\"\"将按钮标签设置为当前时间\n```\n\
  \n\n\n\n```python\n# 这是按钮 'clicked' 事件的句器方法\n\"\"\"\nself.button.set_label(time.asctime())\n\
  def quit(self, widget, data=None):\n    \"\"\"停止主 gtk 主事件循环\n    当你关闭主窗口时，它会消失，但如果你不\n\
