  trans: "\nDotfiles 同样是由“点”开文件夹创建的并包含在程序中的。应用程序所需的其他文件存储在一个隐藏的配置目录中，这是一个用于 dot 的目录，而这些文件都包含在一个隐藏的配置文件中。这些目录通常是用户特定的非配置文件，只有安装了它们的用户才有权访问。\n\
    \n## Linux 文件权限\nLinux 是 UNIX 的克隆，因为它允许多个用户同时访问系统，并且它是一个多用户操作系统。Linux 也可以在不修改的情况下用于服务器和大型主机。然而，这种情况带来了安全问题，因为重要数据可能会被恶意或不受欢迎的人删除、修改或损坏。因此，Linux\
    \ 将授权分为两个层以确保适当的安全：\n\n1. 获取权限\n2. \n\n所有权和权限是 Linux 中的重要概念。我们将从所有权开始，因为两者都将被评估。\n\
    \n### Linux 中的文件所有权\n你 Linux 系统上的每个目录和文件都有三类不同的所有者。\n\n用户组由许多人组成。此外，组中的所有用户对文件具有类似的访问权限。如果你正在进行一个项目，你需要与其他人共享文件。与其手动为每个用户提供权限，你可以将所有用户添加到组中。当你对文件应用组权限时，其他人将无法更改或查看它。\n\
    \n- **用户 (User)**：文件的所有者是一个用户，如果你是创建文件的人，默认情况下你就是所有者。因此，作为所有者，你可能也被称为用户。\n- **其他\
    \ (Other)**：在这种情况下，任何其他用户对文件的访问被称为“其他”。这种用户不是创建或拥有该文件的用户组的成员。在大多数情况下，这可以是任何人。当你为“其他”设置权限时，通常被称为为全局（globe）设置权限。\n\
    \n最后，出现了差异化问题。如何在不向另一方泄露敏感信息的情况下，将这三类用户分开？向使用你 Linux 机器的同事隐藏你电脑上的图像是常见做法。权限也是如此，你可以通过用户行为来指定它们。我们可能需要再次回顾\
    \ Linux 权限系统，以便你完全理解。\n\n### 权限\n下面列出的三种权限定义了上述三个所有者对你 Linux 系统中每个目录和文件的权限。\n\n\
    - **执行 (Execute)**： Windows 中有一个扩展名为 \".exe\" 的可执行应用程序，因为你可以有效地运行它。然而，除非在 Linux\
    \ 中设置了执行权限，否则你将无法启动应用程序。即使你不能运行它，如果你设置了写入和读取权限，你可能也可以更改或查看程序代码。\n- **写入 (Write)**：如果你有写入权限，你将能够编辑文件的内容。作为写入权限的一部分，你还可以修改、删除和向目录中添加文件。你可以猜到文件所在的位置，因为你对目录没有写入权限，但你确实需要文件的写入权限。你有更改文件内容的能力。但是，你将无法从目录中删除、移动或重命名文件。\n\
    - **读取 (Read)**：使用此权限授予的权限，你可以读取和打开文件。因为你有读取权限，你还可以列出目录的内容。\n\n## SSH 命令\n`ssh`\
    \ 是每个 Linux 系统标准自带的命令。该命令启动 SSH 客户端，在远程机器上的 SSH 服务器上建立安全连接。`ssh` 命令用于在远程设备上执行指令并在两台计算机之间传输数据，从登录远程工作站等各种功能。\n\
    \n### Linux 的 SSH 命令\n`ssh` 命令在不安全的网络和两个主机之间建立安全的加密连接。它也可以在隧道传输其他应用程序时用于文件传输和终端访问。你可以从远程位置通过\
    \ `ssh` 安全地运行图形化 X11 程序。\n\n### 附加 SSH 命令\n除了客户端 `ssh` 之外，每个页面上还有其他的 SSH 命令。\n\
    \n- `sshd` - OpenSSH 服务器\n- `sftp` - 具有类似 FTP 命令界面的文件传输程序\n- `scp` — 用于文件传输的 RCP\
    \ 相关的命令界面\n- `ssh-add` - 一个允许你向 agent 添加密钥的实用工具\n- `ssh-agent` – 用于持有单点登录私钥的代理\n\
    - `ssh-copy-id` – 将公钥配置为服务器上的授权\n- `ssh-keygen` — 生成用于身份验证的密钥对\n\n## 第 9 章：Linux\
    \ 终端、编辑器和 Shell\n![笔记本电脑和代码背景上的 Shell 脚本字体。技术概念。学习编程语言。](img/Image00010.jpg)\n\
    \n无论你是已经使用 Linux 长期，还是初学者，你都可以获得关于启动终端的帮助。终端无疑是一个具有许多益处的强大工具，它并不可怕。你无法通过阅读单本书或一篇文章来学习关于终端的所有知识。亲自操作终端需要练习。\n\
    \n### 终端使用的基础知识\n当你打开终端时，`bash` shell 会出现在你桌面的程序菜单中。尽管有不同的 shell，但大多数 Linux 发行版默认使用\
    \ `bash`。你可以通过在提示符输入输入名称来启动程序。然后，你在这里启动的任何内容都是程序，从命令行工具到图形化应用。尽管这些操作在程序中很常见，但\
    \ `bash` 提供了几个用于文件管理的内置命令。而且，与 Windows 不同，你可能不需要输入应用程序的完整路径来启动它。例如，当你尝试在 Windows\
    \ 上打开 Firefox 时，你必须输入 `.exe` 文件的完整路径。在 Linux 上，输入以下命令：\n\n```\nFirefox\n```\n\n\
    要使用它，输入命令并然后按回车键。在 Linux 上不需要为程序添加 `.exe` 或其他任何内容，因为它没有。接受参数（arguments）也是终端命令的一个功能。你可以针对程序使用某些类型的参数。例如，Firefox\
    \ 接受 Web 地址作为参数。\n\n### 软件安装\n最节省时间的方法之一是从终端安装软件。软件管理程序是某些在后台运行终端命令的复杂界面，例如 Ubuntu\
    \ 软件中心。这样，你不需要通过选择和点击应用程序来逐一安装，而可以在终端后台进行。你还可以使用单个命令安装许多应用。因为你可以看到其他发行版如何处理包管理，你可以使用以下命令在\
    \ Ubuntu 上安装新的软件包包：\n\n```bash\nsudo apt-get install packagename\n```\n\n它与上面的\
    \ Firefox 命令类似，但稍微困难。在运行 `apt-get` 之前，通过 `sudo`，你可以以 root（管理员）权限运行上述行。`originalname`\
    \ 将读取参数 `apt-get` 程序后安装名为 `originalname` 的包。另一方面，可以指定多个包作为参数。例如，要安装 Pidgin 即时通讯工具和\
    \ Chromium 浏览器，运行以下命令：\n\n```bash\nsudo apt-get install chromium-browser pidgin\n\
    ```\n\n如果你想在安装 Ubuntu 后安装所有你喜爱的软件，可以使用类似上面的单个命令。你选择的程序的包名就是你唯一需要知道的，因为你可以很快地猜出它们。你的预测也可以通过\
    \ Tab 补全方法进行修正。\n\n## 桌面 Linux 文本编辑器\n\n"
- fmt: '

    It makes it quite beneficial for some text editors to be able to function as an
    IDE as well. They''re also the default editors. These are quite useful in the
    Linux environment and for developing applications in the Linux desktop environment.
    Despite the fact that there are many text editors available, the focus will be
