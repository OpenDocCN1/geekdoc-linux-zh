  trans: '


    # 分区表与工具


    - 为了可靠性，DOS 分区中仅存储一份分区表副本。GPT 则在磁盘的开头和结尾各保留一份分区表副本。与 DOS 分区一样，GPT 也使用 CRC 校验和来检查分区表的完整性。

    - 更多分区：当使用扩展分区和主分区时，DOS 分区表仅允许 16 个分区。你可以选择拥有更多分区，GPT 默认允许你拥有多达 128 个分区。

    - 更大的磁盘：尽管 DOS 表的分区倾向于格式化高达 2TB 的磁盘空间，但在某些情况下可以达到 16TB。相反，GPT 分区表可以寻址 8ZiB 的空间。

    - 虽然 `cfdisk` 和 `fdisk` 局限于 DOS 分区表，但 `parted` 工具可以生成 GPT（全局唯一标识分区表）。


    由于在如今更大的磁盘上进行磁盘分区需要更高的灵活性，建议你使用 `parted`。磁盘分区的创建通常是操作系统安装程序的一部分。在向现有系统添加存储设备时，直接使用
    `parted` 命令特别有用。


    ## 在 Linux 上分析磁盘空间和硬盘分区的命令


    你可以使用某些命令来检查系统上的分区。这些命令的作用之一是检查每个软驱器上存在哪些分区，以及文件系统、已用空间、总大小等其他信息。某些分区工具，如 `cfdisk`、`sfdisk`
    和 `fdisk`可以显示分区内容并对其进行编辑。


    ### `hwinfo`

    作为一个通用的硬件信息工具，你可以使用 `hwinfo` 打印分区和磁盘列表。与其他工具一样，结果不包含每个分区的信息。


    ### `blkid`

    `blkid` 输出块设备、存储和分区媒体，以及 `uuid` 和文件系统类型等属性，尽管它不报告分区的空间。


    ### `lsblk`

    `lsblk` 显示光驱和磁盘分区列表，以及所有存储块。它列出挂载点，最重要的是如果存在，还会显示块/分区的总大小。不报告分区的空/用空间。如果没有 `MOUNTPOINT`，意味着文件系统尚未挂载。它也意味着没有
    DVD/CD 磁盘。使用设备时，`lsblk` 可以显示更多信息，如型号和标签。


    ### `pydf`

    `pydf` 的增强版本用 Python 编写，并以易读的格式打印所有硬盘分区。此外，`pydf` 只能显示已挂载的文件系统。


    ### `df`

    尽管这不是一个分区程序，该命令也会打印已挂载文件系统的信息。即使不是真实磁盘分区的文件系统也包含在 `df` 列表中。使用它时，你会发现以 `/dev` 开头的分区或设备都是文件系统，你可以使用
    `grep` 过滤出真实的硬盘分区或文件系统。然后，使用 `df` 显示带有分区类型的实际磁盘分区。


    ### `parted`

    作为一个命令行工具，它会在需要时更改列表，因为它也列出了分区。


    ### `cfdisk`

    Linux 的分区编辑器是 `cfdisk`，它基于 ncurses 并具有交互式用户界面。它可以用于修改或创建现有分区，也可以列出这些分区。由于 `cfdisk`
    每次只能执行一个分区，如果需要特定磁盘的详情，请向 `cfdisk` 提供设备名称。


    ### `sfdisk`

    另一个工具是 `sfdisk`，它的目标与 `fdisk` 类似，但具有额外功能。每个分区的尺寸可以以兆字节 (MB) 为单位显示。


    ### `fdisk`

    `fdisk` 命令是检查磁盘分区最常用的命令。通过 `fdisk` 命令，你可以看到分区及其详情（就像文件系统类型一样）。然而，通过 `fdisk` 每个分区的尺寸报告可能无法访问。


    # Linux 数据操作


    如果你习惯了 Windows，Linux 世界可能会让你感到困惑。没有图像、链接或任何可以点击的内容，寥寥几个提示，没有向导等，很难知道从何开始。此外，在实现任何目标之前，你必须先知道自己想要什么。假设你别无选择只能使用
    Linux 提示，而学习基于 xkcd 的痛苦、晦涩的软件并不符合你的热切愿望。然而，使用命令行处理数据可能有一些令人信服的理由。即使新技术提供了数 TB
    级的数字数据，更多仪器提供了数字输出，尝试使用 Excel 处理这些数据可能并不合适。你处理 CSV 文件的运气可能也不好。在 Linux 上，使用免费且相当简单的工具可以轻松管理这些文件。选择这条路线的另一个动力是
    Linux 强大的主流工具是完全免费的。


    虽然我们可能希望跳过大部分这些内容，但 SAS、Mathematica、MATLAB 和其他品牌程序已经适配了 Linux，并且非常出色。由于原生应用和工具在
    Linux 上的性能更好，并且对 Linux 用户来说是本能，我们不能说它们在 Windows 上无法运行。此外，可以保证它们在 Linux 上始终可以运行。你不需要每
    6 个月学习一个新界面，因为苹果和微软不会通过发布另一个为了增加利润而毫无意义的升级来向你支付金钱和时间。


    ## 识别文件类型


    即使数据是在实验室生成的，你可能不知道它是什么类型的数据。文件是一个可以提供一些帮助的工具，尽管它并非没有缺陷。它通常给出的响应是针对“它是什么类型？”这个问题。与
    Windows 文件映射技术（通过文件名 `.typ` 映射到特定类型）不同，它通过检查文件来查看是否有诊断特征。如果文件名称在传输过程中损坏了，它会非常有用。


    ## 假设


    在安装了典型的 Linux 工具（如 R）后，假设你可以访问 bash shell。可以为这个实验创建一个目录。在 `$DDIR` 上你可以提供参考路径，尽管你可以给它任何喜欢的名称。你大可以给
    shell 的 `DDIR` 变量分配一个实际的项：


