- fmt: '

    If you want to see how much space your files have used up on your system''s hard
    drives or disks, `df` is there to show you. You''ll note that the meaning of `-h`
    is "human-readable" rather than "help" as you go through this program. Some commands
    employ `G` for gigabytes and `K` for kilobytes instead of printing out integer,
    enormous bytes numbers to display disk or file sizes. The file space utilization
    for subdirectories of a certain directory is what the `du` displays. You may use
    `df` to find out how much free space there is on a hard drive. `Du` can also be
    used to determine the size of a directory''s space. The flag `--max-depth=N` selects
    directories N levels fewer or down from the provided directory, which `du` takes.
    The `ps` command displays the current processes running by users.


    By default, `mkdir` creates only one directory. As a result, making `d/e/f` with
    just `mkdir` may be difficult because the `d/e` directory does not exist. Also,
    if they don''t exist, we can use `mkdir` with the `-p` option to create all of
    the directories in the path. Also, with the help of the `tree`, we can better
    visualize the structure of a directory when we have a neatly designed directory
    displayed. It prints the entire structure of the tree in the beginning with a
    specified directory. However, if you use the flag `-L`, you can limit the number
    of levels to a specific amount. The empty directory can then be hidden in the
    tree output with `-prune`. You should be aware that this command will remove any
    directory that is not completely empty or "recursively empty," but contains additional
    recursively empty or empty directories.


    ## Miscellaneous


    ### Exit / logout / passwd


    `Passwd` can be used to change the password on your account. It''s possible that
    you''ll have to provide your current password to verify it. Then, in order to
    avoid any typos, it will ask you to enter your new password twice. If you simply
    have a user account, `logout` will exit the shell into which you''ve logged in.
    Also, use the `exit` command to exit any shell.


    ### / clear


    If you want your new terminal line to appear at the top of the screen, run `clear`.
    This command will add blank lines below the line of your current prompt. As a
    result, you''ll be able to clear your workplace. And in situations when you need
    to find certain files, wildcard, also known as Kleene Star, `*`, is ideal. You
    can use the `glob` several times in a command because it is equivalent to more
    characters or zero.


    ## Processor, memory, and disk use


    ### htop / top


    The `top` displays the processes that have been operating recently, as well as
    their memory utilization, owners, and many other details. An `htop` is a version
    of the `top` that is interactive and upgraded. You should be aware that the display
    processes can be restricted by giving the flag `-u username` and specifying a
    username that is only visible to people who own it.


    ### ncdu


    The `ncdu` provides a navigable file space use summary, which is typical of an
    improved `du`. It also has the ability to open a `vim`-related window with a read-only
    feature. To turn off the computer, hit `q`.


    ### REPLs


    The Real-Evaluate-Print Loop, or `REPL`, is a common command-line tool, but it
    is used for certain programming languages. While the function `quit()` can be
    used to exit, the command `python` can be used to access the Python REPL. You
    may also use the command `R` to launch the R REPL and the function `q()` to exit
    using the function `q()`. You can also have the Scala REPL open and use the command
    `:quit` to exit with the command `scala`. You can open the Java REPL with the
    command `jshell`, and close it with the command `/exit`. You can exit any of the
    REPLs using `^d` (Ctrl+d) if you want to. On Unix, `d` denotes the end of the
    input, and it also denotes the end of the file, EOF.


    ### -v / --version / -version


    The flag `--version` or `-version` is used by most applications and commands to
    get the software version. Even if there is a less intuitive element for most,
    this information is usually readily available for most applications. You should
    be aware that some programs use `-v` for the version flag, and that this means
    ''verbose'' for others who use `-v` to execute the application while debugging
    or printing various diagnostics.


    ## Variables in the environment


    The environment variables are the enduring variables you may use and create within
    your `bash` shell, and “env vars” is their short-term. You can use it with the
    dollar (`$`) symbol, and they use the equal sign (`=`) for their definition. When
    you use `printenv`, you can see all of the recently defined env vars. You can
    create a new environment variable by using the `=` operator. It''s important to
    remember that your `=` has no space after or before it. You can have a specific
    env var written to the terminal by using `echo` with a preceding sign of `$`.
    Try to use quotes ("...") to surround other whitespace or all spaces around the
    environment variables. Also, be cautious because there will be no warning and
    you will most likely overwrite an env var by reassigning a value to it. You can
    also use the command `export` to define the env vars in addition to the options
    listed above. Sub-processes, which are commands you called from this shell when
    you offer the meaning this way, may also have access to them. The environment
    variables can be unset if you use the command `unset` or leave the right-hand
    side of the `=` blank.


    ## Chapter 14: Advanced Bash Shell Commands


    ![Ping of site using UNIX bash shell. Green code in command line interface.](Image00042.jpg)


    The shell is a command interpreter, as well as a reasonably strong programming
    language and not merely appropriating seam linking the user and the kernel of
    the operating system. You can also create programs using a simple device called
    a script inside a shell program by gluing together built binaries, utilities,
    tools, and system calls. The entire repertoire of Unix tools, utilities, and commands
    is available for invocation via a shell script. If that wasn''t enough, external
    shell commands such as `loop` and testing constructions can provide scripts even
    more flexibility and power. Shell scripts are particularly well suited to administrative
    systems activities as well as other routines, repetitive jobs, since they do not
    require a complete compactly constructed programming language with plenty of bells
    and whistles.


    ## Regular Expressions: An Overview


    An expression is a string of characters. Metacharacters are characters with a
    meaning that extends beyond their literal meaning. A quote sign, for example,
    can be used to represent someone''s speech, and the same can be said for the subsequent
    symbols for a meta-meaning. Regular expressions are metacharacters or characters
    that specify or match patterns. Here are some of the elements that make up a regular
    expression:


    *   **Modifiers**. By altering these, you can reduce or enlarge the range of text
    that the regular expression will match. Modifiers include backlash, brackets,
    and an asterisk.

    *   **An anchor**, if you will. The anchor specifies the position of the match
    between the text line and the regular expression. Anchors, for example, are `$`
    and `^`.

    *   **A collection of characters**. The literal meaning of these characters is
    preserved. A character set is the simplest sort of regular expression because
    it contains no metacharacters.


    Regular expression is a part of a sequence or a string that matches a set of characters
    or a single character for a regular expression, and it is a part of a sequence
    or a string that matches a set of characters or a single character for a regular
    expression.


    *   **Word boundaries** are indicated with escapable "angle brackets" — `\<…>\`.


    The angle brackets must be escaped since they otherwise have only their literal
    character and meaning.


    The term "the" matches `\<the\>`, not "others," "there," "them," and so on. Testing
    a regular expression is the only method to know for sure that it works.

