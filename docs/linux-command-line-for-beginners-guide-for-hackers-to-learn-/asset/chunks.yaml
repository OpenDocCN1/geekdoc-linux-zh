    (UC Irvine) 以及交互式 BDUC 集群节点上都可以访问。此外，除非另有说明，你可以免费获取任何 Linux 发行版。


    我们将利用 `red+blue all.txt.gz` 文件，这是一个大小为 25MB 的制表符分隔数据文件。你可以在 Firefox 中右键点击链接并选择“保存”来下载它。将其保存在实验的
