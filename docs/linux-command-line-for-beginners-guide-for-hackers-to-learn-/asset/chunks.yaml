  trans: '


    当一个目录由于没有父目录或仅包含在另一个目录中时，它被称为根“父目录”（parent）的子目录。因此，当前文件系统中存在文件夹或目录树。而且，正如回溯文件树的特征一样，你始终可以通过从子目录移动到父目录来到达根目录。尽管
    Unix 和 Unix 类系统仅有一个根目录，但某些文件系统具有多个根目录，例如 Windows 的驱动器：`A:`、`C:` 等。`pwd`、`ls` 和
    `cd`。


    工作目录（也称为当前目录）始终位于用户在操作文件系统时使用的一组目录中。使用 `pwd` 打印用户的工作目录。使用 `ls` 列出文件和子目录等（即目录的内容）。你应该注意以下几点：


    -   你有时可以使用像 `ls –la` 这样的链标志来代替 `ls -1 –a`。

    -   组合使用多个标志，例如 `ls –l –a`。

    -   通过 `ls –l`，你可能会看到文件的内容。

    -   要显示隐藏（以点开头）的文件，请使用 `ls –a`。


    `cd`（切换目录）的简写是 `cd`。它用于切换到不同的目录和父目录。`cd` 的缩写或直接使用 `cd` 是回到主目录，通常是 `/home/username`
    或类似的目录。由于 `..` 是简写，`cd ..` 在此目录中可能没有太大影响。要返回最近的目录，请输入 `cd –`。你也可以通过输入 `cd ../..`
    等在多个目录层级之间移动。


    ### `;` `&&` 和 `&`


    命令是你输入到命令行提示符并保存到计算机某处的内容；它们始终运行机器码。这些机器码有时是 Linux 内置命令，有时是你自己编写的某些代码，例如某个应用程序。我们可能偶尔想一个接一个地运行命令，可以使用
    `;`（分号）来实现：


    分号意味着 `ls` 先列出工作目录的内容（`ls`），然后由 `pwd` 打印其位置。接着可以使用 `&&` 运算符来链接命令，这是一个非常实用的功能。如果左侧的命令失败，右侧的命令将不会运行。你可以在同一行中多次使用
    `&&` 和 `;`。


    如果第一个失败了，第二个会通过 `;` 继续执行。尽管它看起来与 `&&` 相似，但 `&` 有完全不同的用途。当你执行一个耗时操作时，命令行通常会等待该命令完成后才允许你输入另一个。在先前的命令仍在运行时，你将能够运行新命令，但如果你在命令后加上
    `&`，这种情况就不会发生。


    至关重要的一点是，当我们在命令后使用 `&` 来隐藏进程或任务时，我们假设它是“后台运行”的。然后，要查看当前正在执行哪些后台任务，请使用 `job` 命令。


    ### 获取帮助


    在几乎任何命令之前输入 `man` 都可以打开该命令的手手册（按 `q` 退出 man）。


    使用 `-h` 或 `–h` 可以打开该命令的帮助菜单。


    ### 编辑和查看文件


    #### `nedit` / `nano`


    `nano` 是一个极佳的命令行文本编辑器，具有极简主义特点，非常适合想要学习数百万快捷键的人或初学者。它对于编程生涯前几年的任何开发者或程序员来说足够了。`nedit`
    设置了一个 X 窗口作为一个小型图形化编辑器，具有语法高亮、拖放和点点编辑功能。当你想要修改脚本并重新运行它时，应该考虑使用 `nedit`。其他常见的编辑器，如图形用户界面
    GUI 或命令行界面 CLI，包括 `Atom`、`Notepad++`、`gedit`、`vim`、`vi`、`emacs` 等。`VS Code`、`Light
    Table` 和 `Micro` 是其他一些。语法高亮、搜索替换以及其他功能是目前所有编辑器的标准功能。尽管 `nano` 和 `nedit` 的功能没有
    `emacs` 和 `vi` 多，但它们的学习曲线陡得多。在尝试了几种编辑器后，你会找到最适合你的一个。


    #### `head` / `tail` / `cat` / `less`


    文件的前几行是 `head` 的输出。`-n` 参数指定显示的行数，默认为 10 行。`tail` 输出是文件的最后几行。通过 `tail –n +N`，你可以接收文件的末尾，或者如上所述，从第
    `N` 行开始的最后 `n` 行。通常使用终端，尽管 `cat` 用于将文件传输到标准输出流并连接文件列表。你可以用它来快速查看文件，并将其与多个文件或单个文件一起使用。然而，这里要注意：如果你这样使用
    `cat`，可能会被指责为 UUOC，即“无意义的使用 cat”（Useless Use of Cat）。你不必担心这个，因为这不是主要问题。


    另一个工具是 `less`，适用于快速查看文件，因为它打开了一个类似 vim 的只读窗口。另一个命令是 `more`。相比之下，`less` 的推荐程度更高，因为它提供了
    `more` 功能的超集。你可以在它们的 `man` 页面上发现更多关于它们的信息。


    ### 创建和删除文件及文件夹


    #### `mkdir` / `rm` / `rmdir`


    你可以使用 `mkdir` 命令创建新的空目录。由于这是不可逆的，你必须谨慎操作，因为 `rm` 可以删除任何文件。可以使用 `-i` 选项来移除“确定吗？”的提示。你可以使用
    `rmdir` 命令删除空目录。当你在空目录中运行 `ls –a` 时，你会注意到对其父目录（`..`）以及目录本身（`.`）的引用。只有空文件夹才能被 `rmdir`
    删除。


    使用 `rm –rf`（`-r` = 递归，`-f` = 强制）可以删除目录及其所有内容。


    #### `touch`


    `touch` 的发明是为了更改文件时间戳。然而，你可以通过文本编辑器打开它来创建一个空文件，例如 `nano`。你也可以对文件进行更改。此外，还可以使用
    `touch`。注意 `z`（`Ctrl+z`）代表后台进程。然后，在打开编辑文件的情况下，按下 `z`。使用 `kill %N` 来杀死后台进程，如 `jobs`
    命令所示，其中 `N` 是任务索引。在它运行时，按下 `c`（`Ctrl+c`）停止其处理任何内容。


    ### 命令历史、链接创建以及文件复制与创建


    #### `mv` / `cp` / `ln`


    使用 `mv` 重命名或移动文件。你可以将文件 `mv` 到一个新文件、重命名它、保持不变或将其移动到不同的目录。然后使用 `cp` 复制文件。你也可以使用
    `ln` 为文件创建硬链接。还可以使用 `ln –s` 为文件创建软链接（符号链接）。硬链接在内存中引用包含文件的相同实际字节，虽然它指向了这些字节，但软链接引用的是原始文件名。


    ### 命令历史


    `bash` 提供了两个主要功能，允许你重新运行和补全命令。第一个功能是 Tab 补全。你只需要在编写命令的第一部分后按下 `tab` 键，即可猜测你正尝试执行的具体操作。当你输入了
    `ls t` 并按下 `TAB` 键时，命令将完成。如果发生歧义情况，你可能被迫多次点击 `tab` 按钮。而且由于 `bash` 会记录你之前的命令，你可以通过输入
    `r`（`Ctrl+r`）获取它们的简要历史，这将允许对它们进行搜索。要查看命令历史搜索，按下 `r`（`Ctrl+r`）。


