  trans: "\n\n## 正则表达式基础\n\n- 转义字符 — \\ — 它们的特性被误解，因为它是一个独一无二的字符。\n\n`\\$\\$` 还原到其字面意思\
    \ `$`，而不是其在正则表达式中的行尾含义。此外，`\\’` 的字面意思是 `\\\\`。\n\n- **括号 – `[...]`** – 包围一组字符，用于单个正则表达式的匹配。\n\
    \n通过混合括号字符序列，可以匹配常见的单词模式。例如，“yes, Yes, YES, yes, 等与 `[Yy][Ee] [Ss]` 之间存在匹配。”`[0-9]`\
    \ 是任何社会安全号码的另一种匹配方式。`[0-9] [0-9][0-9] [0-9] [0-9] [0-9] [0-9] [0-9]`。\n\n除了 `b`\
    \ 到 `d` 范围内的字符，所有字符都匹配 `[^b-d]`。反转或否定是后续正则表达式含义的一个常见示例（在另一种语境下，它起着类似的作用！）。\n\n\
    - 任何对应于字母 `[a-z0-9]` 的数字或小写字母。\n\n- 任何匹配 `k` 到 `y` 和 `b` 到 `P` 范围内 `[B- Pk=y]`\
    \ 的字符。\n\n- 任何匹配 `c` 到 `n` 范围内 `[c-n]` 的字符。`[xyz]` 匹配字符 `x`、`y` 或 `z`。\n\n- 正则表达式的结束对应行尾的美元符号\
    \ — `$`。\n\n匹配空行的符号是 `^$`。\n\n`XXX` 匹配行尾的 `XXX$`。\n\n- 脱字符符号 —`^`—匹配行首，根据上下文它有时会否定正则表达式中字符序列的含义。\n\
    \n- 任何除换行符外的字母都匹配点 —`.`.。\n\n尽管没有缺失 13 个字符，但 \"13\" 对应 `13 +` 至少一个其他字符，包括空格：`1133`、`11333`。\n\
    \n- 除了零次出现外，任何带有正则表达式或字符字符串重复的数字都匹配星号 — `*`—。\n\n`11 +` 一个或多个 `3` 由 `1133*` 表示：`113`、`1133`、`1133333`\
    \ 等。\n\n- 更长的正则表达式。基础字符集中还有其他字符。它们在 `perl`、`awk` 和 `egrep` 中被使用。\n\n- 加号符号 —`+`—由一个或多个前一个正则表达式匹配。虽然它不匹配零次出现，但它的功能与\
    \ `*` 相同。\n\n- 问号符号 —`?`—由零或一个前一个正则表达式匹配。\n\n- 大括号 `\\{}` 用于指示出现次数。\n\n`[0-9]{5}`\
    \ 匹配正好五个数字。\n\n`[0-9]{5,}` 匹配五个或更多数字。 \n\n`[0-9]{5,8}` 匹配五到八个数字。\n\n- 圆括号 `()`\
    \ 用于分组正则表达式的部分。\n\n- 管道符号 `|` 充当（OR）运算符。\n\n- 反斜杠 `\\` 用于转义特殊字符。\n\n## 字符类\n\n\
    - `[:digit]` 匹配任意数字。\n\n- `[:alpha]` 匹配任意字母字符。\n\n- `[:alnum]` 匹配任意字母数字字符。\n\n\
    - `[:xdigit]` 匹配任意十六进制数字。\n\n- `[:upper]` 匹配任意大写字母。\n\n- `[:space]` 匹配任意空白字符。\n\
    \n- `[:posspace]` 匹配任意空白字符。\n\n- `[:print]` 匹配任意可打印字符。\n\n- `[:graph]` 匹配任意可打印字符（排除空格）。\n\
    \n- `[:lower]` 匹配任意小写字母。\n\n- `[:loweralpha]` 匹配任意小写字母数字。\n\n- `[:blank]` 匹配空格或制表符。\n\
    \n- `[:cntrl]` 匹配任意控制字符。\n\n## 结\n\n感谢阅读《入门 Linux 命令行》。我们希望这本书对你有所帮助，并且它提供了实现你目标所需的所有工具，无论你的目标是什么。\n\
    \n如果你读到了这里，可能是因为你想学习如何操作 Linux 操作系统，并理解许多命令行以及使用它们的最佳方法。你一路走到这里，是因为你想学习组成 Linux\
    \ 操作系统的许多不同组件，以及如何安装不同的 Linux 变体。\n\n在本书中，你学习了 Linux 内核和操作系统、Linux 目录结构、一些基础 Linux\
    \ Shell 命令、如何处理磁盘、媒体和数据，以及更多内容。这本书为你提供了关于基本终端、编辑器和 Shell 的足够信息，让你能够更好地掌握如何使用 Linux\
    \ 以及一些相关工具。\n\n"
