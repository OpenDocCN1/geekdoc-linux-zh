    \ `_init` 关键字体现。\n\n### 模块的编译与加载\n\n此时必须理解模块编译的机制。对于内核模块编译，我们将使用内核的构建系统。在将其保存为\
    \ `Makefile` 之前，你可能希望再次打开你喜欢的文本编辑器时记录构建过程。你必须为内核 `Makefile` 和 `hello.c` 的模块准备一个相应的目录，因此在此需要注意。\n\
    \n为了构建模块，我们需要内核头文件。上述 `makefile` 调用内核源码中的内核构建系统，而我们的 `Makefile` 可能会由内核的 `makefile`\
    \ 执行以完成模块。你可以将设计的内核模块过程完成为 `hello.ko`，因为我们现在已经具备构建模块的所有条件。\n\n内核第一个模块的首次编译已经完成。现在是时候查看如何在内核中卸载和加载此模块。你应该意识到，为了卸载或加载内核模块，我们必须获得\
    \ root 用户权限。当你切换到超级用户模式时，你需要运行 `insmod` 命令来加载模块，如下所示：\n\n```bash\n[root]# insmod\
    \ hello.ko\n```\n\n`insmod` 负责任务的成功。另一方面，输出是我们必须找到的内容。内核的环形缓冲区是追加输出的地方。我们也可以通过运行\
    \ `dmesg` 命令学习以下内容：\n\n```bash\n[root]# dmesg\nHello, World !!!\n```\n\n我们还可以使用命令\
    \ `lsmod` 查看模块是否已加载。\n\n```bash\n[root]# lsmod | grep hello\nhello 859 0\n```\n\
    \n你现在需要做的是在运行 `rmmod` 命令时检查 `dmesg` 命令的输出。要从内核卸载模块，请按所示操作。你现在可以使用清理函数看到来自 `dmesg`\
    \ 的消息。模块信息通过模块内的几个宏提供。`modinfo` 命令以后所示精美的准备格式提供信息。\n\n### 我如何找到进程 PID PID？\n\n\
    我们可能需要再编写一个内核模块来识别进程 ID（PID），即现有进程的 PID。内核存储所有进度的相关信息都在头文件中，定义在 `<linux/sched.h>`\
    \ 中的 `task_struct` 结构中。它提供了一个现有变量作为现有进程的信号。要识别当前进程 PID，你只需要报告 `current->pid` 变量的值。随后将提供包含完整代码的\
    \ `pid.c` 文件。\n\n`Makefile` 与原始 `makefile` 的相似之处在于它以对象文件命名。在插入模块后，使用 `dmesg` 命令确认输出，然后进行编译。\n\
    \n### 使用模块连接多个文件\n\n之前我们仅使用一个文件研究了模块编译。然而，将模块拆分为多个文件可能是非常有用的，在大型项目中，我们一个模块可能有多个源文件。我们必须理解这种方法以构建跨越两个文件的模块。`hello.c`\
    \ 中的清理和初始化函数可以分离到两个文件中：`cleanup.c` 和 `startup.c`。\n\n"
