    ## Linux 用户


    `UID`（用户唯一标识符）是一个唯一标识系统用户帐户的二进制数字。整个帐户信息保存在 `/etc/passwd` 文件中，而哈希密码存储在 `/etc/shadow`
    文件中。


    ### 创建默认设置的用户


    可以在命令行提示符下使用 `useradd` 命令添加用户。


    ```

    useradd enirban

    passwd enirban

    ```


    ### 创建带有 UID 的用户


    可以使用 `-u` 选项和自定义 UID 创建用户。


    ```

    useradd -u 1036 handy32

    ```


    要创建用户，请使用非默认值的主目录。


