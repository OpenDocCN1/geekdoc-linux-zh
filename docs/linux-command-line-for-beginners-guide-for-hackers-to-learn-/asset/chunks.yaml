    \ be the initial section, followed by the kernel. The kernel provides some of\
    \ the system resources requested by user space processes, such as network connectivity,\
    \ memory, storage, CPU, and so on. In addition, this column will investigate the\
    \ loadable kernel modules in Linux/GNU. The Linux kernel is monolithic because\
    \ the entire operating system runs in supervisor mode. Even though the kernel\
    \ is a single process, it comprises of multiple subsystems, each of which is responsible\
    \ for completing certain duties. Any kernel, in general, performs the following\
    \ tasks.\n\n### Kernel modules that can be loaded dynamically\n\nMost of the time,\
    \ we apply security patches and kernel upgrades to keep our system up to date.\
    \ In the case of Microsoft Windows, a reboot is frequently required. This, on\
    \ the other hand, is far from ideal. When it's in a production server, for example,\
    \ the computer can't be rebooted. Wouldn't it be excellent for removing or adding\
    \ functionality from or to the kernel on-the-fly without requiring a system reboot?\
    \ The Linux kernels work on dynamic unloading and loading of kernel modules. Any\
    \ code item is a kernel module that you can add to the kernel at runtime. When\
    \ the system is up and running, you can unload and load modules without interruption.\
    \ As an object code, you may use the `insmod` command to dynamically link a kernel\
    \ module to the operating kernel and unlink it with the `rmmod` command.\n\n###\
    \ Networking\n\nNetworking is an important aspect of the operating system since\
    \ it facilitates data transfer between hosts and enables for communication. It\
    \ is also through it that network packets are transmitted, identified, and collected,\
    \ as routing capability is provided by it.\n\n### Device Control\n\nControlling\
    \ the device any computer system necessitates the use of a number of devices.\
    \ However, in order for the layer to function, a device driver is required to\
    \ make the devices useable. There are various sorts of drivers available, including\
    \ video/audio drivers, Bluetooth drivers, graphics drivers, and so on.\n\n###\
    \ File System\n\nOrganize your files The Linux/GNU system is greatly influenced\
    \ by the file system. In Linux/GNU, almost everything is a file. Also governed\
    \ by this subsystem are the storage relation requirements for hierarchical data\
    \ structure, journaling and compression of data, deletion and creation of files,\
    \ and so on. The Linux kernel supports all primary file systems, including MS\
    \ Windows NTFS.\n\n### Memory Management\n\nThis subsystem is in charge of all\
    \ associated requests. The pages are fixed-size chunks partitioned from available\
    \ memory that can be de-allocated or allocated from or to the process on demand.\
    \ It maps the process virtual address with the help of the memory management unit,\
    \ `MMU`, as it creates the illusion of a contiguous large address space to a physical\
    \ address space.\n\n### Process Management\n\nThe process is handled by this subsystem\
    \ as part of the life-cycle. It permits data sharing and interaction between processes\
    \ as well as the destruction and creation of processes through inter-process communication.\
    \ With the help of the process scheduler, it also allows resource sharing and\
    \ schedules processes.\n\n## Some Practical Tools\n\nLinux/GNU provides various\
    \ user-space programs that provide important information about kernel modules.\
    \ Let's have a look at them now.\n\n- **dmesg**: Notwithstanding the kernel's\
    \ use of a separate approach, any user-space program's output is displayed on\
    \ the standard output stream, i.e., `/dev./stdout`. The kernel appends its output\
    \ to the ring buffer so that we can manage the contents of the ring buffer with\
    \ the `dmesg` command.\n- **modinfo**: when passed as a command-line argument,\
    \ the module that passes such procedure shows the information. If the argument\
    \ is not on a filename, it searches the `/lib/modules/<version>` directory for\
    \ modules. `modinfo` also displays each attribute of the module using the field:\
    \ value format.\nIt's important to remember that the kernel version is `<version>`,\
    \ and that we can find out what it is by running the `uname –r` command.\n- **rmmod**:\
    \ You can use this command to unload modules from the kernel. You can only unload\
    \ the current module if it is not in use. The `--force` or `-f` options are also\
    \ supported by `rmmod` and can be used to forcefully unload modules. However,\
    \ there is a significant risk in utilizing this technique, and there is a safer\
    \ approach to delete modules. `rmmod` will isolate the module with the option\
    \ `--wait` or `-w` as it waits until it is no longer used.\n\n## Preparation of\
    \ the System\n\nIt's now time to take action. All we need to do now is establish\
    \ an environment conducive to progress. As required packages, a Debian-based Linux/GNU\
    \ distribution such as Ubuntu and CentOS of a PRM-based Linux/GNU distribution\
    \ will be installed.\n\n### Installation of CentOS\n\nThe first step is to install\
    \ the GCC compiler as a root user using the command below:\n\n```bash\n[root]#\
    \ yum -y install GCC\n```\n\nThe kernel development packages are now installed\
    \ at the next level:\n\n```bash\n[root]# yum -y install kernel-devel\n[root]#\
    \ yum -y install make\n```\n\n### Installation of Ubuntu\n\nThe GCC compiler is\
    \ the first in the installation sequence:\n\n```bash\nsudo apt-get install GCC\n\
    ```\n\nThen there are the kernel development packages:\n\n```bash\nsudo apt-get\
    \ install kernel-package\n```\n\nThen there's the make installation's utility:\n\
    \n```bash\nsudo apt-get install make\n```\n\nWe also have a kernel module.\n\n\
    We've now finished preparing our system. After that, we'll need to write the kernel's\
    \ first module. Use `hello.c` to save the file when you open your favorite text\
    \ editor with the following contents:\n\n```c\n#include <linux/kernel.h>\n#include\
    \ <linux/module.h>\n\nInt init_module (void)\n{\n    printk(KERN_INFO \"Hello,\
    \ World !!!\\n\");\n    return 0;\n}\n```\n"
