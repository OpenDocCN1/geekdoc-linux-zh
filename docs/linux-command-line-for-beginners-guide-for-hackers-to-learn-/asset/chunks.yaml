    此外，使用以下命令可以让其他用户拥有执行权限：


    ```bash

    [handy32@localhost~]$chmod o+x filel

    ```


    当你想要从某个组移除执行权限时，可以使用下面的命令：


    ```bash

    [handy32@localhost~]$chmod g-x filel

    ```


    ## 当前工作目录


    下面，你将看到通过 `pwd` 命令显示的当前工作目录：


    ```bash

    [sandrahandy32@localhost~]$pwd

    /home/sandra

    ```


    因此，`/home/sandra/` 是当前工作目录。


    ### 目录创建


    要创建目录，你可以像这样使用 `mkdir` 命令：


    ```bash

    [sandrahandy32@localhost~]$mkdir myDir

    ```


    在 `/home/sandra/` 下将创建一个目录。


    ### 目录删除


    要删除一个空目录，你将如下使用 `rmdir` 命令：


    ```bash

    [sandrahandy32@localhost~]$rmdir MyDir

    ```


    你还可以使用 `rmdir` 的 `p` 选项来删除父目录，而不仅仅是指定的目录。


    ```bash

    [handy32@localhost~]$rmdir myDir

    ```


    到目前为止，我们已经广泛涵盖了系统管理以及 Linux 用户管理的许多方面。你可能想花时间重新阅读一遍，以跟上本节讨论的内容。当你准备好后，可以进入下一节，我们将深入探讨
    Linux 目录结构。


    ## 第 6 章：Linux 目录结构


    ![软件开发人员的计算机脚本抽象技术背景](img/Image00005.jpg)


    对于每台通用计算机，都需要在 HDD、各种类型的硬盘或一些类似的设备（包括 USB）上进行数据存储。这些需求的产生有几个原因。首先，如果你关闭电脑，`RAM`
    中的内容可能会丢失。在涉及到固态硬盘和 USB 闪存盘时，存储在其中的数据维护往往取决于在掉电时的非易失性 `RAM` 类型。`Flash RAM` 比其他类似的类别（如易失性常规
    `RAM`，如 `DDR3`）更贵。由于硬盘数据存储是第二个原因，磁盘空间比普通 `RAM` 便宜。从每字节成本来看，`RAM` 仍然是更好的选择。磁盘和
    `RAM` 的价值已大幅下降。根据对 2TB 硬盘与 16GB `RAM` 每字节成本的快速估计，硬盘的单位价格大约是 `RAM` 的七十一之一。


    关于文件系统，有很多来源的讨论，它们都很复杂且相互矛盾。因为“文件”一词本身可以有许多含义，当你从文档或分析的角度来看，需要区分其具体含义。让我们尝试根据特定情况和人们的观察对“文件系统”一词给出多种定义。目标是根据其各种解释来建立这一定义，以符合官方定义。


    1. 一个经过格式化的逻辑卷或分区卷，可以按照特定类型的文件系统挂载到 Linux 文件系统的精确点上。

    2. 一种特定的数据存储格式，例如 `XFS`、`BTRFS`、`EXT4`、`EXT#`、`EXT2` 等。Linux 支持 100 多种文件系统，包括最新的和最老的。这些文件系统变体使用元数据结构来指定如何访问和存储数据。

    3. 根目录 (`/`) 是整个 Linux 目录层次结构开始的地方。


    ## 文件系统的基本功能


    磁盘存储包含某些不可避免且引人入胜的特征。文件系统最重要的目的之一是提供非易失性数据存储。然而，由于这种需求，还必须满足一些额外的功能。命名空间的创建是所有文件系统必须执行的任务，是一种命名和组织方法。而且在所有可用字符中，这种方法决定了你如何为文件命名，即你可以用于文件名的字符子集和文件名长度。此外，数据的逻辑结构定义在磁盘之上，这包括在大型统一组合中管理文件，以及使用目录组织文件。在定义命名空间时，元数据的格式对于为该命名空间提供合理基础关重要。因此，必须包含数据结构以实现分类目录结构。这些结构决定了磁盘上哪些块空间被利用，哪些是可用的。在维护目录和文件的名称和大小方面，实现了这些功能的结构，以及数据在磁盘上的位置或位置、所属文件夹的最后查看或修改时间，以及生成时间和大小。它们使用其他信息（如逻辑分区和卷）来存储磁盘细分的复杂材料。它描述了包含数据的更复杂的元数据，这些数据表达了在分区或驱动器上累积的文件系统，且独立于文件系统信息。


    `API`或“应用程序编程接口”对于文件系统提供管理目录和文件等文件系统对象的系统调用访问也是必要的。`APIs` 处理删除、传输和创建文件的任务。`APIs`
    提供的部分内容是决定某些事项的算法，例如文件应该放在文件系统的什么位置。此类算法的目标可能是为了减少并加速磁盘碎片化处理。此外，当前文件系统还提供了一种安全模型，作为目录和文件访问权限规范的模式。由于
    Linux 文件系统的安全机制，你可以作为用户访问他人的文件或操作系统。基本软件是实现这些目标的终极构建组件。双部分软件的应用是 Linux 用来提高程序员效率和两个系统性能的方法。Linux
    的虚拟文件系统是该实现中两个部分的第一部分。这个虚拟文件系统负责提供对各种文件系统的访问，并为开发者和内核提供单一命令集。虚拟文件系统软件通过特定必要设备的接口驱动程序对各种文件系统进行调用。文件系统专用设备的驱动程序是执行的的部分组件。设备驱动程序解释逻辑卷或分区卷上的文件系统命令标准集，以及特定于文件系统类型的命令。


    ## Linux 目录结构


    如果你来自 Windows 背景，Linux 的文件系统结构可能看起来特别奇怪。听起来晦涩的目录和 `a/` 选项大多取代了被遗忘的驱动器以及 `C:` 盘，使用了三字母名称。`FHS`（或“文件系统层次结构标准”）决定了
    Linux 和其他 Unix 类操作系统的文件系统结构。然而，Linux 文件系统中的某些目录尚未被标准定义。


    ### /var - 可变数据文件


    与 `/usr` 目录的可写等价物是 `/var` 目录，它在正常运行时必须是只读的。在常规操作期间，我们可以将日志文件以及任何通常写入 `/usr` 的内容写入
    `/var` 目录。例如，可以在 `/var/log` 下访问日志文件。


    ### /usr — 用户二进制文件与只读数据


    '
- fmt: '

    Users utilize files and apps that contain the directory `/usr`, not the files
    and applications that the system uses. Non-essential apps, for example, are located
    in the directory `/usr/bin` rather than the directory `/sbin`, which contains
    non-essential system administration binaries. The `/usr` directory also contains
    additional directories, such as architecture-free folders like `graphics`, which
    share a position in `/usr/`. This protects them from causing havoc with the rest
    of the system, as the local directory `usr/` is installed by default in locally
    constructed apps.


    ### /tmp - Temporary Files

    Because the `/tmp` directory is where applications store temporary files, programs
    like `tmpwatch` will destroy these files if your system is restarted.


    ### /srv — Data for the service

    The `/srv` directory holds the ‘data for system services offered by the system.''
    If you were using the `Apache` HTTP server to serve a website, you would generally
    put the files in a directory inside the `/srv` directory.


    ### /selinux - SELinux Virtual File System

    If your Linux distribution uses `SELinux` for security reasons, the directory
    `/selinux` contains special files. It''s the same thing as `/proc`. Because Ubuntu
    does not use `SELinux`, the inclusion of this subdirectory looks to be a problem.


    ### /sbin - System Administration Binaries

    The `/bin` directory is similar to the `/sbin` directory. It is normally designed
    to be run by the root user for system administration because it contains important
    binaries.


    ### /run – Application for State Files

    Because it is relatively new, the directory `/run` provides a standard place application
    for storing temporary place, such as process IDs and sockets. These files cannot
    be stored in `/tmp` because they may be erased.


    ### /root - Root''s Home Directory

    The directory `/root` is the root operator''s home directory. Because it is the
    system root directory, it is located at `/root` rather than `/home/root`.


    ### /proc - Process and Kernel Files

    The directory `/dev` is identical to the `/proc` directory because it does not
    contain standard files. It only comprises special files for processing and representing
    data.


    ### /opt - Optional Packages

    These directories are found in the `/opt` directory for optional software packages.
    Because the conventional filesystem hierarchy does not respect it, proprietary
    software frequently employs it. It may, for example, leak proprietary program
    files into `/opt/application` when you install it.


    ### /mnt – Mount Points on the Move

    The directory `/mnt` is where the system administrator mounts the temporary filesystems
    while utilizing them. For example, if you are mounting a partition on Windows
    `/mnt/` for Windows, you might want to mount it for a few file recovery activities.
    Other system files, on the other hand, can be mounted to any available space on
    the system.


    ### /media - Removable media

    The `/media` directory is located in subdirectories where the devices installed
    into the computer are mounted. When you insert a CD into your Linux system, for
    example, a directory will be generated automatically inside the `/media` directory.
    You can also access the CD''s contents from within this directory.


    ### /lost+found – Files Recovered

    Each Linux filesystem includes a `lost+found` directory. As a result, if the filesystem
    crashes, a filesystem check will be done at the next boot. Any corrupted files
    discovered will be stored in the `lost+found` directory for extensive data recovery.


    ### /lib – Essential Shared Libraries

    Required vital binaries are contained libraries in the `/lib` directory, which
    can be found in the `/sbin` and `/bin` directories. `/usr/lib` contains the binaries
    required by libraries in a `/usr/bin` folder.


    ### /home – Home Documents

    Each user''s home file is located in the `/home` directory. If your username is
    `Greg`, for example, the home folder will be located at `/home/greg`. This home
    folder contains the user''s explicit formation file as well as the user''s data
    files. Each user must get elevated permission on the system in order to modify
    other files as the superuser, even if they just have write access to their home
    folder.


    ### /etc – Configuration Files

    The configuration files are kept in the `/etc` directory, which can be simply
    modified by hand with a text editor. Keep in mind that the `/etc/` directory contains
    system-wide configuration files, while user-specific configuration files are found
    in each user''s home directory.


    ### /dev - Devices Files

    Devices are exposed by Linux as files. As a result, the directory `/dev` contains
    devices that represent some particular files. Despite the fact that they appear
    to be files that we are familiar with, we cannot call them original files. The
    primary SATA drive, for example, is represented by the `/dev/sda` device in the
    OS. If you want to partition it as virtual devices without any hardware correlation,
    you can start a compartment editor to tell it to alter `/dev/sda`. In addition,
    this directory contains pseudo-devices. The `/dev/random` command, for example,
    generates just random numbers. Because it produces no output, `/dev/null` is a
    special device that automatically discards all inputs when a command''s output
    is piped to it.


    ### /cdrom – Historical Mount Point CD-ROMs

    The directory `/cdrom` is an exception to the FHS standard. However, it can be
    found in Ubuntu and other operating systems. It is a temporary place for CD-ROMs
    inserted into the system. However, for the normal location of temporary media,
    it is inside the `/media` directory.


    ### /boot - Static Boot Files

    Located in the directory the `/boot` directory holds the files required to start
    the system. Your Linux kernels and `GRUB` boot loader files, for example, are
    located here. The boot loader''s configuration files are not located in the `/etc`
    directory, despite the fact that they are in the same directory as other files.


    ### /bin – Essential User Binaries

    The important user binaries, often known as applications that must be present,
    are located in the `/bin` directory when the system is mounted in single-user
    mode. Applications like `Firefox` are housed in `/usr/bin`, whereas important
    utilities and system programs like the `bash` shell are found in the `/bin` directory.
    The `/usr` directory can alternatively be stored on a separate partition. Even
    if no additional filesystems are mounted, putting these files in the `/bin` directory
    will ensure that you have critical utilities. The `/sbin` directory is similar
    to it in that it contains important binaries for system administration.


    / - Root Directory

    Everything on the Linux system is located under the `/` directory, which is known
    as the root directory. The `C:` directory in Windows is very similar to the `/`
    directory. This isn''t precisely true because Linux doesn''t have drive letters.
    While another partition appears in a different folder under the `/` directory
    on Windows, it appears in a different folder under the `/` directory on Linux.


    ## Chapter 7: Working with Disk, Media, and Data Files (gzip – tar)


    ![florian-olivo-4hbJ-eymZ1o-unsplash](Image00006.jpg)


    Because deleting and creating partitions is a common activity in Linux, you must
    first structure storage devices such as USB drives and hard drives before you
    can utilize them. After being divided, partitions frequently house separate sections
    of devices with significant storage. You can also use partitions to divide the
    hard drive into isolated portions, each of which operates like a separate hard
    disk. Partitioning is very handy if you manage many operating systems. With the
    use of various sophisticated tools in Linux, also known as disk partition management,
    you can remove or create this. As a result, devices with huge disks, as well as
    several disk partitions, can benefit, and we''ll go through how to utilize the
    `parted` command in detail. Here are some commonly used commands, such as `cfdisk`
    and `fdisk`, as well as the distinction between separated and partitioned.

