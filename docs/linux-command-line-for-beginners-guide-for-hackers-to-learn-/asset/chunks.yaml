    ## Emacs (GNU Emacs)


    GNU Emacs 历史悠久，是 Linux 环境最早的文本编辑器之一。它是由 GNU 项目的创始人 Richard Stallman 创建的。全球有成千上万
    Linux 程序员将其作为他们首选和最喜欢的文本编辑器。他们借助 `C` 和 `LISP` 的帮助创建了它。使用以下脚本在 Linux Mint 或 Ubuntu
    上安装 `emacs`：


