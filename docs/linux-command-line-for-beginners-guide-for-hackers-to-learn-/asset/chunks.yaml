    # 第 8 章：


    ![michael-dziedzic-aQYgUYwnCsM-unsplash](img/Image00007.jpg) 文件、目录管理器、权限、网络和 SSH


    Linux 中的任何文件系统都是作为层处理你在存储器上数据位置的操作系统。即使你发现了一个不支持的文件系统类型，如果没有它，你也无法判断文件从哪里开始到哪里结束。如果你有可以处理它的软件，甚至可以下载它。那么，Linux
    有哪些不同的文件系统呢？当你尝试安装 Linux 时，你会发现它带有许多文件系统，如下所示列出的：swap, btrfs, jfs, ext4, ext3,
    ext2, ext3+, ext4+, ext4+, ext4+（重复省略）。


    那么，Linux 提供的这些文件系统究竟是什么？


    ## Btrfs

    这一个由 Oracle 创建，在某些发行版中不如 Ext 那么稳定。然而，如果你有需要，可以认为它是 Ext 的替代品，而且它的性能出色。


    ## XFS

    它在处理小文件时运行缓慢，因为它是一个古老的文件系统。


    ## JFS

    JFS 是由 IBM 创建的旧文件系统，对大文件和极小文件都良好。然而，报告显示它在运行一段时间后会失败，导致文件损坏。


    ## Ext4

    这允许以快速速度传输巨大的文件。如果你正在寻找 SSD 存储选择，这是你在安装 Linux 时看到的建议默认文件系统。


    ## Ext3

    Ext2 提供了向后兼容性和改进。服务器不再使用这种文件系统，因为它不支持磁盘快照或文件恢复。


    ## Ext2

    结果是 Linux 的第一个文件系统可以存储高达 2 terabytes 的数据。由于限制，人们不再使用这个旧的系统了。


    # 高层次级解释


    现在你已经熟悉了 Linux 文件系统，是时候从高层次级了解这些文件系统内部的内容了。如果你是从 Windows 转过来的，你能够安装分区，如 `D:` 和
    C:`（最常见的是 `C:`），因为 Windows 有像这样的分区。尽管我们在上一个章节中讨论过，但 Linux 的文件系统结构是什么？当你进入根分区（`/`）时，你会看到
    Linux 的文件系统结构。


    # 管理 Linux 目录的命令


    域名系统或 `DNS` 是我们用于在 IP 地址和域名之间进行转换的。例如，在 Linux 机器上，你可以使用 `host` 或 `dig` 命令连接到 DNS。同样，Linux
    文件通过文件名而不是 inode 号来引用。那么，目录的目的究竟是什么？你倾向根据使用方式对文件进行分组。例如，你可以在 `/etc/` 目录中这样做，它包含所有的配置文件。目录的目的是将文件名与其对应的
    inode 号连接起来。在每个目录内部，你会发现两个子目录。


    1. `..`（双点）—— 指向上一个目录的指针，即你当前所在目录的上一级目录。除了根目录外，每个出现 `..` 的目录都存在它。而且它始终指向与 `.`
    相同的 inode。

    2. `.`（单点）—— 表示当前目录。


    为了列出目录和文件，我们可以使用 `ls` 命令，包括 Linux 中的 `.` 和 `..` 目录。


    ```

    ls –la

    ```


    ## 目录

    子目录包含在另一个目录内部。目录最后形成了一个树结构，要查看目录树结构，请使用 `tree` 命令。


    ```bash

    $ tree /etc │ less

    ```


    与文件一样，目录也有一个 inode。由于它将每个名称与 inode 号连接起来，它是一个包含记录的特殊格式文件。在 `ext2/3` 文件系统中，注意目录的以下局限性是非常关重要的：


    ## 局限性

    ● `Ext4` 和其他现代 Linux 文件系统中可能存在无限数量的子目录。

    ● 在单个目录中，有一个大约 10-15k 个文件的软上限。


    然而，根据 `ext2/3` 文件系统的官方文档，使用正在开发中的哈希目录索引，允许单个目录中存放 100k-1M+ 文件。与目录相关的，下面是一些 bash
    别名命令：


    ```bash

    alias ..=‘cd..’

    alias d=‘ls –l │ grep –E "^d”’

    ```


    Linux 目录管理命令


    ![](img/Image00008.jpg)

    ![](img/Image00009.jpg)


    ## 要管理的目录

    由于你可以从 Nautilus 复制、移动、删除或创建它们，你需要学习像文件一样对待你的目录，并使用 shell 提示符命令来实现。


    ## 建立目录

    你必须学习写权限以便创建新的子目录。大多数用户在 `/temp/` 和家目录以及子目录中拥有这些权限。要使用 Nautilus 创建原始目录，你需要导航到你的新目录。在窗口空白处右键点击并选择创建文件夹。如果你使用带有突出内容的未命名文件夹，将出现一个新的文件夹图标。记住在按下回车键之前给这个新文件夹命名。当你想要从
    shell 提示符创建原始目录时，只需执行 `mkdir` 命令。只需输入 `mkdir directory-name>` 用新目录所需的标题替换 `mkdir
    directory-name>`。


    ## 目录删除

    要在 Nautilus 中删除目录，右键点击图标并将其放入垃圾桶，或在右键点击后将其拖到垃圾桶。要删除空目录，请从 shell 提示符输入 `rmdir`
    命令。要删除非空目录及其所有内容，请使用 `rm –rf directory>` 命令。


