    # 第 11 章：Shell 脚本


    ![lavi-perchik-fSqYwKWzwhk-unsplash](img/Image00039.jpg)


    Shell 脚本是一个包含 Linux 操作系统命令序列的文本文件。shell 脚本的命令必须通过键盘一个一个地写入到单个脚本中。shell 是命令行界面的操作系统，充当用于与系统通信的命令的解释器。用户必须经常使用
    shell 脚本的命令序列以节省时间。子命令、注释和参数都必须被 shell 遵循，就像其他程序必须一样。用户可以通过在 shell 的命令行提示符中输入文件名来启动命令序列。在
    DOS 操作系统中，shell 脚本被称为批处理文件，而在 IBM 主机 VM 操作系统中，它被称为 EXEC。


    由于 shell 应用位于 Linux 操作系统内部，因此你可以输入执行系统所需的命令。当在 Linux 计算机上启动终端窗口时，shell 软件将启动，允许你通过界面输入命令。人们将这种界面称为命令行界面
    (CLI)。输出显示在屏幕上，当输入命令时 shell 会执行它。除了能够交互式地执行和接受命令外，shell 还可以执行包含在文件中中的。这种执行方式被称为
    shell 脚本。


    ## Shell 脚本是如何工作的？


    Shell 脚本编写涉及几个基本步骤，包括赋予 shell 执行权限、使脚本可被 shell 访问以及编写脚本。由于 shell 脚本包含 ASCII 字符，可以使用图形用户界面
    (GUI)、文字处理器或文本编辑器进行编写。shell 可以解析脚本内容中一组命令的语言。shell 脚本支持快捷方式、数组、if/then/else 表达式、变量和循环等。文件完成后，将其以
    `.sh` 或 `.txt` 扩展名保存到 shell 可以访问的位置。


    ### shell 的背景


    Ken Thomson 在 20 世纪 70 年代创建了 Unix 的 shell 应用 V6 Shell。尽管它具有带有交互元素的 shell，但它的编程能力非常差。Bourne
    Shell 在 1977 年被引入 root 账户，今天仍被用作默认 shell。而且，得益于它的脚本能力，随着时间的推移，它被证明非常有用。20 世纪 80
    年代，流行的 shell 变体 Korn Shell 和 C-Shell 为公众提供了丰富的话题。这些 shell 中的每一个都有了自己的语法，这与原始 shell
    有显著偏离。因此，Bash 是目前非常流行的 shell。它代表 Bourne-Again-Shell，是独特的 Bourne Shell 的显著升级变体。


    ## Shell 脚本应用示例


    当你使用 shell 脚本时，通过一次输入一行命令而不是执行重复性过程，可以节省大量时间。以下是可以使用 shell 脚本的一些应用示例：


    *   正在监控系统。

    *   执行定期备份

    *   整合现有举措

    *   文件操作批量完成

    *   开发程序或在编程环境中工作

    *   自动编译代码


    ## Shell 脚本的执行


    如果你想运行 shell 脚本，只需将脚本路径作为参数提供给 shell 即可。你应该意识到 shell 需要 LF 字符（换行符）来结束行。如果你尝试在
    Linux 系统上快速运行 shell 脚本或在 Windows 上编写它，很容易遇到麻烦。Windows 使用 CR-LF（回车-换行）组合作为行结束符，而你需要将其转换为仅
    LF。你可以使用 Windows 编辑器来完成操作。


    shell 脚本可以通过另一种方式作为命令直接运行。你可以在脚本的第一行使用下面的 hash （shebang）：


    ```bash

    #!/bin/bash

    ```


    之后，你可以运行一个程序使你的脚本具有可执行权限。你现在可以无需指定 shell 即可执行该文件。


    ## Shell 脚本有很多优点


    当你使用 shell 脚本时，通过一次输入一行命令而不是执行重复性过程，可以节省时间。它消除了解释方面的担忧，因为它在 shell 命令行中和脚本中使用相同的语法。此外，在编写
    shell 脚本时，它要求的学习曲线更短，速度更快。然而，如果 shell 脚本错误未被检查，可能会非常昂贵。此外，shell 脚本可能不兼容不同平台，且
    shell 脚本执行时间可能更长。无论如何，shell 脚本还有额外的优点。


    ### 可移植性


    shell 脚本可以传输到其他 Unix 或相关操作系统。此外，当将 shell 脚本从一种架构传输到另一种架构（如 Sparc、MIPS 或 x86）时，其移植性远高于
    C++ 程序。要传输和使用 C 程序，你必须首先尝试执行它，然后编译并复制源代码。如果使用了特定架构的代码，它可能无法按预期工作。


    ### 透明性


    由于它是文本文件，你可以轻松查看 shell 脚本正在执行的操作。相反，如果你有源代码或源代码希望告知你，你可以在 C/C++ 等语言中确定程序类型。例如，你可以确定
    shell 脚本正在删除哪些文件，如果你需要这些文件，则可以将它们传输到另一个位置。shell 脚本也比传统程序更容易故障排除，因为你可能检查源代码。


    ### 更容易编写


