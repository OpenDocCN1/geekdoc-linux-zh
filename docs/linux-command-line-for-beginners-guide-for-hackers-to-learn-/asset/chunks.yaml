    ## Introduction


    Thank you for purchasing your copy of LINUX Command-Line for Beginners. Almost
    everything we use now is based on Linux. If you are a newbie or are just starting
    to study everything there is to know about the Linux operating system, you will
    quickly discover that reading this eBook is an excellent approach to gain a thorough
    grasp of Linux and its various variants. Getting around the Linux command line
    might be difficult at times. Throughout this book, you will see a variety of ways
    that you can use to model a smooth Linux operation. Furthermore, there are some
    Linux distributions that you may use not just as a beginner, but also if you try
    to use it on an older system. Finally, this book delves deeper into the fundamentals
    of Linux shell commands and shell scripting. To that end, some of the chapters
    in this book will look at Linux user management and administration, where it will
    look at some of the responsibilities of a Linux system administrator, such as
    managing directories, users, and files, using basic `bash` commands, managing
    root or superuser accounts, and much more. Also covered in this book are Linux
    file functions, as well as the three types of Linux file ownership, permissions,
    and `SSH` commands. Other `SSH` commands, Linux terminals, editors, and shell
    commands will be covered. After establishing a good understanding of directories,
    file managers, and editors, this book will cover how to build a `tar gzip` file
    from the command line, how to mount and unmount media, and Linux data manipulation.
    There are other books on Linux Command-Line on the shelves, and we appreciate
    your choosing this one. From our end, we''re working hard to ensure that this
    book has all of the practical and essential information you''ll need to succeed.
    Thank you once more!


    ## Chapter 1


    ![sai-kiran-anagani-Tjbk79TARiE-unsplash](Image00000.jpg) What is Linux and Why
    Should You Use It?


    Linux is a widely used operating system that strengthens practically anything
    from mobile phones to servers to PCs. Indeed, Linux is used by a large number
    of people all over the world in a variety of disciplines and applications. Linux
    has existed since the 1990s. Linux runs everything from your TV stick to your
    refrigerator. Linux also supports a large portion of the internet. Many scientific
    advancements can be attributed to Linux, as the computer operating system has
    fueled numerous innovations. Despite the fact that Linux has been providing secure,
    reliable OS functions for decades, the term "Linux" is unfamiliar to the general
    population. However, Linux is used on everything from enterprise servers to personal
    computers, home appliances, supercomputers, automobiles, and cellphones. Linux
    can be found on your television, Roku devices, refrigerators, and thermostats,
    among other places. Linux is a favorite platform for running embedded systems,
    servers, and desktops all over the world because it is one of the most stress-free,
    secure, and stable operating systems available.


    ### What is the Linux Operating System?


    First and foremost, what do you mean when you say "OS" or "operating system"?
    The computer code known as the operating system is responsible for managing the
    hardware in a physical computer. The operating system acts as a layer between
    the hardware and software. Furthermore, most individuals aren''t interested in
    learning how to communicate with a graphics card or address a CPU in assembly.
    An operating system such as Windows or Linux serves as a middleman. As a result,
    Linux is an operating system, much like Mac OS, is, and Windows. Android, the
    most popular platform on the planet, is powered by the Linux operating system.
    Because Linux oversees the communication between the hardware and software as
    an operating system, the software is unlikely to work without it. The Linux operating
    system is made up of several diverse components, including:


    - **Applications** — but not the full range of programs available in desktop environments.
    As a result, Linux, like macOS and Windows, allows you to swiftly search and install
    tens of thousands of high-quality programs. The application installation process
    in most recent Linux distributions is simple and centralized. For example, `Ubuntu
    Software Center` by `Ubuntu Linux`, which is representative of `GNOME Software`,
    speeds up the discovery and installation of apps among hundreds of them for users
    from a single centralized platform.

    - **Desktop environment** - Users can interact with this item in a desktop environment.
    `Xfce`, `KDE`, `Enlightenment`, `Pantheon`, `Mate`, `Cinnamon`, `GNOME`, and others
    are among the desktop environments available. For each desktop environment, there
    are built-in apps such as games, web browsers, configuration tools, and file managers.

    - **Graphical server** - using this subsystem, you''ll obtain a graphic display
    on your monitor. Many people refer to it as `X` or `X-server`.

    - **Daemons** - these are background services such as scheduling, sound, printing,
    and so on that are started after logging into the desktop or during boot.

    - **Init system** – User space is bootstrapped by this subsystem, and it is also
    in charge of daemon control. As a result, system is the most extensively used
    init system, despite being the most controversial. The init system supervises
    the boot process when the bootloader, such as `Unified Bootloader` or `GRUB`,
    handles the initial booting.

    - **OS Kernel** - The kernel is a complete piece of software that manages peripheral
    devices, memory, CPU, and the system''s core.

    - **Bootloader** - is a piece of software that controls the computer''s boot process.
    It''s a splash screen that appears in the operating system and disappears before
    most users can boot.

    - **OS Shell** - the shell is where we tell our operating system what we want
    it to do. You utilize text to instruct the OS, which is known as the command line
    by many. However, only a few people are aware of the command-line code. As a result,
    individuals have shied away from using Linux. This has altered with recent Linux
    distributions, as Linux, like Windows, will use a desktop.


    ### Why Should You Use Linux?

