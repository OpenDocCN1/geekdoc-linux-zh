    more expensive than other similar categories such as volatile, conventional `RAM`
    such as `DDR3`. Because the data storage by hard drives is the second reason,
    disk space is less expensive than normal `RAM`. In terms of cost per byte, `RAM`
    is still the better option. The value of both disk and `RAM` has dropped dramatically.
    The hard drive is around 71 times less expensive per unit than `RAM`, based on
