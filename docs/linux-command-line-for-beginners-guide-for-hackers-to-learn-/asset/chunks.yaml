    # Partition Tables and Tools


    - Only one copy of the partition table is stored in a DOS partition for reliability.
    The GPT keeps two copies of the partition table at the end and beginning of the
    disk. A CRC checksum is also used by the GPT to check the partition table integrity,
    as it is with DOS partitions.

    - More partitions: The DOS partition tables only allow for 16 partitions when
    extended and main partitions are used. You can choose to have a lot more, and
    GPT allows you to have up to 128 partitions by default.

    - Larger disks: even though a partition of the DOS table tends to format up to
    2TB of disk space, up to 16TB is possible in some cases. A GPT partition table,
    on the other hand, can address up to 8ZiB of space.

    - While `cfdisk` and `fdisk` are limited to DOS partition tables, the `parted`
    tool can generate a GPT (Globally Unique Identifiers Partition Table).


    Because working with disk partitions requires more flexibility with today''s larger
    disks, it is advised that you utilize `parted`. The formation of a disk partition
    is frequently a part of the operating system installation procedure. Direct use
    of the `parted` command is particularly useful when adding a storage device to
    an existing system.


    ## Commands to Analyze Disk Space and Hard Disk Partitions on Linux


    There are certain commands that you may use to check the partitions on your systems.
    Part of what the commands might do is examine what partitions are present on each
    floppy drive, as well as other information like filesystem, consumed space, overall
    size, and so on. Some partitioning tools, such as `cfdisk`, `sfdisk`, and `fdisk`,
    can display the partition material as well as edit it.


    ### `hwinfo`

    As a general-purpose hardware information tool, you can use `hwinfo` to print
    out the partition and disk list. The result, like the others, does not include
    information about each partition.


    ### `blkid`

    `blkid` outputs the block devices, storage, and partitions media, as well as attributes
    such as `uuid` and file system type, albeit it does not report the space on the
    partitions.


    ### `lsblk`

    `lsblk` displays a list of optical disks and disk partitions, as well as all storage
    blocks. It lists the mount point and, most importantly, the overall size of the
    block/partition if it exists. Free/used space is not reported on partitions. If
    there is no `MOUNTPOINT`, it means the filesystem has not yet been mounted. It
    also signifies that there is no DVD/CD disk. `lsblk` can display more information
    when using a device such the model and label.


    ### `pydf`

    The enhanced version of `pydf` is written in Python, and it prints out all of
    the hard disk partitions in an easy-to-read format. Furthermore, `pydf` is only
    able to display mounted file systems.


    ### `df`

    Despite the fact that it is not a partitioning program, this command prints information
    on only mounted filesystems. Even filesystems that aren''t real disk partitions
    are included in the `df` list. When you use it, you''ll notice that the only partitions
    or devices that start with a `/dev` are file systems, and you can use `grep` to
    filter out the real hard disk partitions or filesystems. Then, with `df`, display
    only actual disk partitions with the partition type.


    ### `parted`

    This changes the list if necessary, as it also lists the partitions as a command-line
    utility.


    ### `cfdisk`

    The partition editor for Linux is `cfdisk`, which is based on ncurses and has
    an interactive user interface. It can be used to alter or create existing partitions
    as well as to list those partitions. Because `cfdisk` can only execute one partition
    at a time, if the details of a specific disk are required, supply the device name
    to `cfdisk`.


    ### `sfdisk`

    Another utility is `sfdisk`, which has an aim similar to `fdisk` but with additional
    functionality. The size of each partition can be displayed in megabytes (MB).


    ### `fdisk`

    The `fdisk` command is the most often used command for examining a disk''s partitions.
    With the `fdisk` command, you can see the partitions and their details, just like
    with the filesystem type. With `fdisk`, however, each partition size report may
    not be accessible.


    # Manipulation of Linux Data


    If you are accustomed to Windows, the Linux world can be perplexing. With no image,
    link, or anything to click, few tips, no wizards, and so on, it''s difficult to
    know where to start. Also, before you can achieve anything, you must first know
    what you desire. Let''s imagine you have no choice but to utilize Linux''s shell
    prompt, and learning the torturous, cryptic software that the xkcd is based on
    does not align with your burning desire. However, there may be some compelling
    reasons to use the command-line for data processing. Even with new technology
    supplying digital data terabytes and more instruments providing a digital output,
    attempting to deal with this data using Excel may not be appropriate. You might
    not have much luck with CSV files, either. These can be easily managed on Linux
    with the use of free, rather simple utilities. Another motivation to choose this
    route is that the powerful mainstream tools for Linux are completely free.


    Though we may wish to skip most of these, SAS, Mathematica, MATLAB, and other
    branded programs have been adapted to Linux and are fantastic. Because native
    apps and utilities perform better on Linux and are second nature to Linux users,
    we can''t say that they won''t work on Windows. Furthermore, there is a guarantee
    that it will always work on Linux. You don''t need to learn a new interface every
    6 months because Apple and Microsoft can pay you in money and time by releasing
    yet another pointless upgrade to boost their profits.


    ## Identifying the type of file


    Even if the data was generated in the lab, it''s possible that you''re unaware
    of what kind of data it is. The file is a tool that can provide some assistance,
    albeit it is not without flaws. The response it usually gives is in response to
    the question, "What type is it?" Unlike the endings of Windows'' file mapping
    technique, which has filename.typ to a certain type, examines into the file to
    see if there are diagnostic traits. And it can be quite useful if the file''s
    name has been corrupted during translation.


    ## Hypotheses


    With the installation of typical Linux utilities, such as R, the assumption is
    that you have access to a bash shell. A directory can be constructed for this
    experiment. It is quite on `$DDIR` that you can provide it your reference, albeit
    you can give it whatever name you like. You might as well assign an actual term
    to the shell''s `DDIR` variable:


    ```bash

    export DDIR=/stephen/

    ```


    `Bash>` is the shell command prefix, and you can mouse into it to test your shell,
    including comments with `#` as a prefix; you can ignore them. You may also wish
    to disregard the prefix `bash>`. All of the stated utilities are also accessible
    here at UC Irvine and on the cluster nodes of the interactive BDUC. And, unless
    otherwise stated, you can obtain any Linux distribution free of charge.


    We''ll utilize the `red+blue all.txt.gz` file, which is a tab-bordered data file
    with a size of 25MB. You may download it in Firefox by right-clicking on the link
    and selecting "save." Save it in the directory `$DDIR` for this experiment. Then
    decompress it with `gunzip blue+red all.txt`. The result of the full bytes will
    then be obtained using `ls`.


    ## Mounting and Unmounting Media on Linux


    With the usage of the Linux operating system, you can mount and unmount media.
    You should be aware that this method employs the default Red Hat installation,
    so the commands, structures, and file names may differ if you use a different
    Linux operating system. Let''s get down to business now!


    If you''re mounting a CD, proceed as follows:


    1. Check for the presence of the `/nt/cdrom` directory on your server. If the
    directory `mkdir/mnt/cdrom` does not exist, you can create it with the command
    `mkdir/mnt/cdrom`. Then press the ''enter'' key.

