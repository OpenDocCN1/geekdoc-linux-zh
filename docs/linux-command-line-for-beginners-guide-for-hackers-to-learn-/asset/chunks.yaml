- fmt: "\nIf you prefer to run your favorite open-source software or want a simple\
    \ way to access a Linux desktop even if you enjoy your current, non-Linux desktop\
    \ OS, you might want to explore running Linux as a VM within another operating\
    \ system. As a first step, you'll need to download and install a Virtual Server\
    \ application, which can be done in a variety of methods. Then install your Linux\
    \ distribution under the host software. As a result, you can accomplish whatever\
    \ you do on your other operating system on Linux. Even if you’re other operating\
    \ systems don't have certain features, Linux can give you with a number of them.\n\
    \n## Booting Linux from a live DVD/CD\n\nWhen you want to keep your primary operating\
    \ system but want to give Linux a try, you can use a Live DVD/CD to do so. Several\
    \ Linux distributions include this as a Live CD for running or downloading. As\
    \ a result, Linux can be booted from the DVD/CD as a complete operating system.\
    \ You can also load your files into your computer's memory rather than storing\
    \ them on a hard disk. That is, Linux can be installed from a DVD/CD and then,\
    \ with no exceptions, your system will revert to its previous operating system\
    \ when you remove the DVD/CD and restart your computer. You may easily try out\
    \ several Linux distributions till you find your favorite.\n\n## Dual-booting\n\
    \nWhen you want to install Linux while keeping a current operating system, you'll\
    \ have a dual booting system. Because you will have a PC that can run two separate\
    \ operating systems, you will need to choose which one you want to boot into during\
    \ the boot process. By now, you should have a basic grasp of Linux and some of\
    \ the distributions that can be used with it. Now is the time to take things a\
    \ step further and introduce you to the Linux Kernel and operating systems.\n\n\
    ## Chapter 3: Introduction to the Linux Kernel and Operating System\n\n![gabriel-heinzer-4Mw7nkQDByk-unsplash](Image00002.jpg)\n\
    \nHow does a computer perform such difficult tasks with such precision and efficiency?\
    \ The short and simple answer is that a computer's operating system is responsible\
    \ for everything it does. Through the efficient use of hardware resources, the\
    \ operating system makes life easier and performs various functions. The OS can\
