    这是一个几乎所有人都会问的问题。既然几乎所有服务器、笔记本电脑和台式机自带的操作系统运行得完美，为什么还要费精力学习一个完全不同的计算机环境呢？与其给出回答，这个问题的答案将是一个问题：你对目前操作系统的运行方式满意吗？或者你是否必须处理许可费、昂贵的维修费用、崩溃、运行缓慢、间谍软件和病毒？如果你在以下任何一个问题上遇到困扰，那么
    Linux 可能可能是适合你的平台。Linux 目前是地球上最可靠的计算机生态系统。当你将零成本的优势与桌面平台的可靠性相结合时，你将拥有一个极佳的选择。你可以在任意任意数量的计算机上安装
    Linux，因为服务器许可或软件是不收费的。此外，你使用 Linux 无需支付任何费用。除外，如果你不在意零成本带来的影响，那么拥有一个随你使用多久都无压力且稳定的操作系统又如何？二十年来，Linux
    用户（无论是服务器还是桌面端）还没有出现过大规模的病毒、恶意软件或勒索软件爆发。问题在于，此类攻击对 Linux 无效。即使只升级内核，服务器也需要重启。Linux
    服务器多年不重启也并非罕见。只要你坚持建议的升级，你将获得极大的可靠性和稳定性。此外，我们使用的大多数桌面操作系统都安装在电脑上，我们很少尝试更改操作系统。而且，不仅如此，大多数人并不愿意学习新的操作系统。以下是你应该尝试
    Linux 的一些原因。


    ## 各种不同的发行版


    有许多不同的发行版供选择。不同的 Linux 发行版或版本之间存在差异。有些设计用于服务器，而另一些设计用于个人电脑。虽然有些面向新手，但另一些则面向更高级的用户。大多数
    Linux 版本（也称为发行版）通过 USB 闪盘、光盘安装，也可以免费下载。有大量的 Linux 发行版供你选择。虽然 `openSUSE` 和 `Debian`
    是流行的替代方案，但 `Linux Mint`、`Arch` 和 `Fedora` 是最流行的桌面发行版。得益 `Ubuntu Unity`，`Ubuntu`
    成为最流行的 Linux 发行版之一。由于 `openSUSE` 的存在，你可以通过 `KDE` 实现更传统的 Linux 外观。如果你正在寻找服务器 Linux
    操作系统的列表，那也是很大的列表。一些最著名的发行版包括 `CentOS`、`SUSE Enterprise`、`Ubuntu Server` 和 `Red
    Hat`。然而，如果你想使用特定的 Linux 服务器发行版，你可能需要花费费用，因为可能需要 `Red Hat` 许可。但是，你支付许可费后获得的支持对你的业务至关重要。


    ## Linux 是自由的同义词。


    我们需要一个与 Linux 媲美的开源定义。任何软件软件都必须遵循一套原则，例如：


    *   你修改后的任何软件副本都将不受限制。

    *   软件分发将不会有任何限制。

    *   你有能力对软件进行任何需要的修改、检查、研究和解构。

    *   无论你运行它的意图或动机如何，都拥有运行该软件的完全自由。


    首先，开源软件并没有一个社区，这是你应该意识到的点。这个社区负责 Linux 的开发及其持续维护。因此，如果你好奇 Linux 是什么以及它是如何变得流行的，人们创建
    Linux 是为了给全球其他地区提供软件。这完全源于开源精神。


    ## 第 2 章：Linux 发行版与安装方法


    ![roman-synkevych-E-V6EMtGSUU-unsplash](img/Image00001.jpg)


    如果你正在寻找最优秀的 Linux 发行版，你可能得不到明确的回答，因为 Linux 发行的数量很多，计算出一个准确的数字非常困难。有些看起来是独一无二的，而另一些则是彼此的克隆。毕竟，这就是
    Linux 的魅力之处，即使它是一团糟。然而，你不必担心，因为尽管有数千个 Linux 发行版可用，你将在下方发现一个顶级列表。我们必须对这些发行版进行分类，因为对每个人都有适合自己的东西。


    ### 具有广泛应用的 Linux 发行版


    某些 Linux 变体可以同时用于服务器和桌面，作为一种高级/新手友好的操作系统。因此，你将在下文中了解这些发行版的不同部分：


    *   **Debian**: `Debian` 是一个基于 `Ubuntu` 的优秀发行版。`Debian` 不仅在桌面上运行良好，在服务器上也运行良好。虽然你可以通过阅读官方文档快速上手，但它可能不是最适合新手的操作系统。最近发布的
    `Debian 10 Buster` 包含了几项必要的增强以及各种改进。所以，尽管尝试一下吧！

    *   **Manjaro**: `Manjaro` 的源代码由 `Arch Linux` 提供。尽管它是为资深用户设计的，但 `Manjaro` 让新手能够非常轻松地使用
    `Arch Linux`。所以不要担心。这个 Linux 发行版确实简单且对新手友好。它内置了许多实用的 GUI 应用，还有一个极佳的用户界面。在下载 `Manjaro`
    时，你有机会选择桌面环境。大多数 `Manjaro` 用户偏好 `KDE` 桌面。

    *   **Fedora**: `Fedora` 有两个版本，每个版本都有自己的特性。它提供了服务器和桌面选项。`Fedora Server` 和 `Fedora
    Workstation` 是这两个选项。如果你想要一个学习曲线低的用户友好型桌面操作系统，`Fedora` 是一个很好的选择。无论如何，如果你选择 `Fedora`
    作为你的 Linux 操作系统，你的服务器将获得新生。


    ### 面向高级用户的顶级 Linux 发行版


    要研究专为高级用户构建的 Linux 发行版，你必须首先熟悉各种软件包命令和管理器进行故障排除。如果你是专业人士，你绝对需要收集精确的标准。如果你已经使用
    Linux 一段时间并且是一个普通用户，那么花时间研究这些发行版是值得的。


    **Slackware**: 尽管许多人的选择发生了变化，但作为最古老的 Linux 发行版之一，它仍然是最流行的之一。


    如果你计划编写或汇软件软件你可能考虑利用 `Slackware` 为自己设置一个最佳环境。尽管开发者和用户数量大幅减少，`Slackware` 仍然是资深用户的极佳替代方案。随着最近
    `Slackware` 开设 Patreon 页面的消息，预计它将继续是可用的最强大的 Linux 发行版之一。


    **Gentoo Linux**: `Gentoo Linux` 是任何能够构建源代码的人的必备之。`Gentoo` 是一个轻量级发行版，尽管这需要一些技术知识才能运行。如果你需要，可以从官方手册中获取相关信息。然而，如果你不确定自己在做什么，可能需要很长时间才能弄清楚如何充分利用它。


