  trans: "\n\n如果你喜欢运行喜爱的开源软件，或者即使你喜欢当前的非 Linux 桌面操作系统，也想简单的方法访问 Linux 桌面，你可能想要尝试在另一个操作系统中作为虚拟机运行\
    \ Linux。作为第一步，你需要下载并安装一个虚拟机应用程序，这可以通过多种方法实现。然后，在主机软件下安装你的 Linux 发行版。结果，你可以在 Linux\
    \ 上完成在其他操作系统上执行的任何操作。即使你的其他操作系统没有某些功能，Linux 也能为你提供其中的许多功能。\n\n## 从现场 DVD/CD 启动\
    \ Linux\n\n当你想保留主操作系统但又想尝试一下 Linux 时，可以使用 Live DVD/CD 来实现。几个 Linux 发行版包含了此类内容作为\
    \ Live CD，以供运行或下载。因此，Linux 可以从 DVD/CD 作为一个完整的操作系统启动。你还可以将文件加载到计算机的内存中，而不是存储在硬盘上。这意味着，Linux\
    \ 可以从 DVD/CD 安装，而且无例外地，当你移除 DVD/CD 并重启电脑时，系统将恢复到之前的操作系统。你可以轻松地尝试几个 Linux 发行版，直到找到你最喜欢的一个。\n\
    \n## 双启动\n\n当你想在保留当前操作系统的情况下安装 Linux 时，你将拥有一个双启动系统。因为你有一台可以运行两个独立操作系统的 PC，你需要在启动过程中选择你想要启动的哪一个。到目前，你应该对\
    \ Linux 以及一些可以与之使用的发行版有了基本的了解。现在是时候进一步，向你介绍 Linux 内核和操作系统了。\n\n## 第 3 章：Linux\
    \ 内核与操作系统\n\n![gabriel-heinzer-4Mw7nkQDByk-unsplash](img/Image00002.jpg)\n\n计算机如何以如此精确和高效的完成如此困难的任务？简单直接的回答是，计算机的操作系统负责它所做的一切。通过高效地利用硬件资源，操作系统让生活变得更容易并执行各种功能。从高级来说，操作系统可以分为两个部分。实用应用程序是初始部分，随后是内核。内核用户空间进程请求的一些系统资源，例如网络连接、内存、存储、CPU\
    \ 等。此外，本栏将研究 Linux/GNU 中的可加载内核模块。Linux 内核是单式的，因为整个操作系统都运行在内核模式下。尽管内核是一个进程，但它由多个子系统组成，每个子系统负责完成某些职责。通常，任何内核都会执行以下任务。\n\
    \n### 可以动态加载的内核模块\n\n大多数时候，我们应用安全补丁和内核升级来保持系统最新状态。在 Microsoft Windows 的情况下，经常需要重启。另一方面，这远不是理想的。例如，当在生产服务器上时，计算机不能重启。如果不需要重启系统就能动态地从内核中删除或添加功能，那不是极好的吗？Linux\
    \ 内核支持内核模块的动态卸载和加载。任何代码项都是你可以在运行时添加到内核的内核模块。当系统运行期间，你可以在不中断的情况下卸载和加载模块。作为对象代码，你可以使用\
    \ `insmod` 命令将内核模块动态链接到运行的内核，并使用 `rmmod` 命令将其取消链接。\n\n### 网络\n\n网络是操作系统的重要方面，因为它促进了主机之间的数据传输并实现了通信。同时也是通过它进行数据包的传输、识别和收集，因为路由能力是由它提供的。\n\
    \n### 设备控制\n\n控制计算机系统的设备需要使用许多设备。然而，为了让该层发挥作用，需要设备驱动程序使设备可用。有各种驱动程序可用，包括视频/音频驱动、蓝牙驱动、显卡驱动等。\n\
    \n### 文件系统\n\n组织你的文件。Linux/GNU 系统深受文件系统的影响。在 Linux/GNU 中，几乎一切都是文件。该子系统还管理着分级数据结构的存储关系需求、数据日志和压缩、文件的删除和创建等。Linux\
    \ 内核支持所有主要文件系统，包括 MS Windows NTFS。\n\n### 内存管理\n\n该子系统负责所有相关请求。页面是从可用内存划分的固定大小块，可以根据需要从进程或向进程释放或分配。它通过内存管理单元\
    \ `MMU` 映射进程虚拟地址，因为它创建了从连续大地址空间到物理地址空间的幻。\n\n### 进程管理\n\n进程由该子系统作为生命周期的一部分处理。它允许进程之间的数据共享和交互，以及通过进程间通信进行进程的销毁和创建。在进程调度器的帮助下，它还允许资源共享并调度进程。\n\
    \n## 一些实用工具\n\nLinux/GNU 提供了各种提供内核模块信息的用户空间程序。现在来看它们。\n\n-   **dmesg**: 尽管内核使用了独立的方法，任何用户空间程序的输出都显示在标准输出流上，即\
    \ `/dev./stdout`。内核将其输出附加到环形缓冲区，以便我们使用 `dmesg` 命令管理环形缓冲区的内容。\n-   **modinfo**:\
    \ 当作为命令行参数传递时，传递此类过程的模块将显示信息。如果参数不是文件名，它会在 `/lib/modules/<version>` 目录下搜索模块。`modinfo`\
    \ 还使用“字段：值”格式显示模块的每个属性。记住内核版本是 `<version>`，我们可以通过运行 `uname –r` 命令查看它是什么。\n-  \
    \ **rmmod**: 你可以使用此命令从内核中卸载模块。只有当当前模块未被使用时，你才能卸载它。`rmmod` 还支持 `--force` 或 `-f`\
    \ 选项，可用于强制卸载模块。然而，利用这种技术存在很大风险，有更安全的方法删除模块。`rmmod` 将使用 `--wait` 或 `-w` 选项隔离模块，直到它不再被使用。\n\
    \n## 系统准备\n\n现在是时候采取行动了。我们现在需要做的只是建立一个有利于进展的环境。作为所需的包，将安装一个基于 Debian 的 Linux/GNU\
    \ 发行版（如 Ubuntu）和一个基于 PRM 的 Linux/GNU 发行版（如 CentOS）。\n\n### 安装 CentOS\n\n第一步是以\
    \ root 用户使用以下命令安装 GCC 编译器：\n\n```bash\n[root]# yum -y install GCC\n```\n\n现在在下一层级安装内核开发包：\n\
    \n```bash\n[root]# yum -y install kernel-devel\n[root]# yum -y install make\n\
    ```\n\n### 安装 Ubuntu\n\nGCC 编译器是安装序列中的第一个：\n\n```bash\nsudo apt-get install GCC\n\
    ```\n\n然后是内核开发包：\n\n```bash\nsudo apt-get install kernel-package\n```\n\n然后是 make\
    \ 安装实用程序：\n\n```bash\nsudo apt-get install make\n```\n\n我们还有一个内核模块。\n\n我们现在已经完成了系统准备。之后，我们需要编写内核的第一个模块。当你打开你喜爱的文本编辑器时，使用\
    \ `hello.c` 保存文件并包含以下内容：\n\n```c\n#include <linux/kernel.h>\n#include <linux/module.h>\n\
    \nInt init_module (void)\n{\n    printk(KERN_INFO \"Hello, World !!!\\n\");\n\
    \    return 0;\n}\n```\n\n"
