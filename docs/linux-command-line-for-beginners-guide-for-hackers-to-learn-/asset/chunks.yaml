    ## 第 10 章：


    ![IMG_256](img/Image00011.jpg) 基础 Linux Shell 命令


    shell 命令用于 Linux 上的分析。shell 是用户在终端仿真窗口中交互的程序。仿真窗口是 Linux 上工作站的伙伴终端（mate-terminal）GUI。它也是类似于
    `PuTTY` 或安全外壳客户端的应用程序；在 Windows PC 上的 `SSH` 安全外壳，你可能通过网络将其注册到 Linux。在某些企业或组织情况下，他们采用
    Bourne Again Shell，即 `bash`。如果你愿意，可以从中选择多种 shell，包括 `TC-Shell`、`C-Shell` 和 `Bourne
    Shell`。它们都具有相同的性质，因为它们拥有各自特有的特殊属性。以下特征属于 `bash`：


    - shell 的历史记录系统正在运行，因为它记得最后几条指令。除了引用编号外，你还可以使用 `history` 命令列出之前的几个命令。

    - 你可以从工作站的终端仿真窗口历史记录中剪切和粘贴来重新运行命令。符号 `!` 也可以用于重放过去的任何命令。

    - shell 还有“任务控制”功能，允许你在后台运行任何不需要终端交互的程序。

    - 当程序 `sort` 在后台运行时，shell 可以立即用于执行额外的命令。在这种情况下，shell 会打印作业控制号 "1" 以及进程标识号 "3470"。你也可以使用特殊字符
    `Ctrl + z` 挂起正在前运行的程序。然后你可以使用 `fg` 命令让程序继续在前台运行，或使用 `bg` 命令将其放入后台。如果有许多后台或挂起的程序，你可以通过它们的作业编号来引用它们。要查看你的作业及其作业编号，请使用
    `jobs` 命令列出任何挂起或后台作业的状态。

    - 你可以编写 shell 命令脚本，就像编译后的程序一样，你可以通过命名来调用它们。例如，我们最初可能会在 `/bin` 中创建一个文件，其中包含创建一个脚本的命令，该脚本用于统计最近目录中
    `C` 程序文件的数量。

    - 可以在正常运行该文件之前，使用 `chmod` 命令使文件具有可执行权限。

    - `Bash` 是一种解释型编程语言，使用 `if-then-else` 表达式、`for` 循环和 `while` 循环。如果你输入以下命令，将获得更多关于
    Linux 在线文档的信息：

    - shell 中可以找到数值和字符串值的变量。

    - `$HOME` 目录已为某些变量进行了预配置，`set` 命令显示已赋值变量列表。

    - 如果你发现输入困难或经常执行特定的命令或一组指令，你可能想要分配别名（aliases）。例如，在当前目录中，我们可以为使用 `wc` 生成的行计数分配别名
    `countc`，并使用 `ls` 显示文件以统计 `C` 程序文件的数量。

    - shell 引以为傲具有将一个程序的输出管道到另一个程序的输入的能力。管道的符号是 `|`。例如，在 `wc` 程序中，我们可以在 `cat` 文件后管道输出，以便统计文件
    A 中的单词数。

    - 大多数 Linux 程序和指令都遵循标准输出和标准输入的原则。平均输出是程序写入的数据流，而标准输入是程序读取的数据流。终端通常伴随着大多数程序，这样输出就可以显示在屏幕上，而输入可以通过键盘提供。可以使用
    shell 将标准重定向到输出和输入。

    - shell 会扩展最近目录中的通配符以匹配文件名。例如，你可以使用某个命令列出名为 "anything.c" 的文件的目录列表。

    - 命令包含的参数字符串用于表示文件名。例如，命令可以将你主目录下的当前目录更改为 "bin"，波浪号 `~` 的含义是 shell 是你的主目录。

    - 为了识别它，必须首先验证内置元素是否与命令链接，之后它可以通过输入命令名称来搜索一组目录。这指的是搜索路径，包括搜索路径、其子目录 `bin` 以及当前目录中的你的主目录。当你完成应用程序编写后，可以通过输入它们的名称来调用它们。无论你现在处于哪个目录，只要你将此类程序放在该目录，它就会被发现并运行。

    - 你可以通过命名来使用命令。大多数 Linux 命令都只是 shell 运行的程序。例如，当你使用命令 `ls` 时，它可以列出它的文件名并读取最近目录，你将获得特定的结果。

    - shell 和其他程序一样，关联了一个当前目录。Linux 程序利用当前目录作为起点。使用 shell 的 `cd` 命令，你可以通过更改最近目录来访问
    Linux 文件系统中的不同位置。

    - 此提示符可以由用户自定义。默认提示符是一个美元符号，后跟着 `bash` 和 `bash` 程序的版本号。

    - 借助额外的 bash 机制，你可以通过向上方向键使用之前的编辑和召回命令。当你按下终端顶部的向上方向键时，最后的命令将再次，你可以再次按下向上方向键接收之前的命令。要重放命令，按
    `RETURN`。在重新运行命令之前，你可以通过向后方向键移动光标插入或删除字符，或通过删除键删除末尾字符来编辑命令。


