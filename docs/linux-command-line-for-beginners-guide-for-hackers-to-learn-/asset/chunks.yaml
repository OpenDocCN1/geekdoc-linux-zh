    操作系统的启动阶段就是一个很好的例子。作为启动过程的一部分，操作系统会执行一系列命令以使系统进入正确状态。这些命令可以在 `/etc` 目录下的 shell
    脚本中找到。如果没有 shell 脚本，你可能不得不手动完成整个过程，如果你查看这些 shell 脚本，系统启动过程的复杂性就会显而易见。`/etc/profile`
    文件就是一个用户访问系统时可以的 shell 脚本示例。


    任务自动化：使用 shell 脚本的第一个优势是，你执行的工作通常可以实现自动化。假设你每天需要完成一组职责。当你需要每天在 Linux 上运行几条命令时，可以将这些命令保存到文件中，然后在脚本中运行这些命令。考虑以下场景：


