    有几个原因导致 `Good morning, world` 没有显示在屏幕顶部，包括：


    1. 文件的所有者忘记更新运行该文件的权限。

    2. 命令执行时，文件并不所在的同一个目录下。

    3. 文件是用文字处理程序而非文本编辑器创建的，因此它不是纯文本文件。

    4. 在斜杠或点之后放置了空格。

    5. 你在命令中遗漏或反转了正斜杠或点。

    6. 文件名与命令中给名称不同。例如，可能存在大小写、拼写差异，甚至多了一个或微小的空格。

    7. 你忘记包含 `echo` 单词，导致在复制代码时提交了错误。


    不要以管理员用户或 `root` 身份练习执行和开发脚本，这是至关重要的。构造不当的脚本可能会损坏操作系统。在最坏的情况下，可能需要重新安装整个操作系统，导致重要数据丢失。如果由于这个原因计算机上尚不存在普通用户账户，你可以使用
    `adduser` 等命令快速建立。


    ### 实验


    如果你是一个好奇心强的用户，在进入更高级的示例之前，可以尝试一系列指导性的简单实验。以下建议包括代码修改、将更改保存为不同的文件名或相似的文件，然后按照上述方法运行它们。


    1. 要求更改某些措辞。例如，将该行修改为 `echo "Good morning, everyone!"`。

    2. 对于写在屏幕上的行，你可以添加一个或多个额外的行，在任何情况下它们后面都有一个水平空格，并且每行开头都带有 `echo`。

    3. 你也可以在两个 `echo` 行之间留一个空行。你可以通过在该行输入 `echo` 来生成一个空行，但仅此而已。很明显，这对结果没有影响。

    4. 在之后插入空白水平空格。取决于你在插入主要的引用标记之前还是之后，结果将会有不同。

    5. 为文件的执行设置一个不同的目标目录。因此，当你执行它时，你需要在命令名称的开头添加可执行脚本的路径。如果你将文件移动到 `test`（这是一个子目录名称），你将拥有
    `./test/morning`。

    6. 你可能想作为实验向脚本文件添加其他命令，例如显示磁盘空间使用的 `df`、显示系统硬件和软件信息的 `uname`、显示当前目录的 `pwd`，以及显示系统上正在运行进程的
    `ps`。至关重要的是，你可以对脚本的任何命令使用任何接受的参数或选项。


    ### Hello, World!


    为了创建 shell 脚本，你必须执行以下操作：


    1. `vi` 是一个你可以用于此目的文本编辑器，在文件中，它包含了你需要的逻辑和 Linux 命令。

    2. 你需要退出 `vi`，并在保存文件后关闭它。

    3. 脚本的可执行版本至关重要。

    4. 在测试完脚本并对结果满意后，你可以进入生产环境。

    5. `Bash` 中的某行是一个简单的程序，告诉计算机某条命令。首先，在你选择的文本编辑器（如 `vi`）中打开它。`Vi` 的常用命令：


    * 退出 `vi`：按下 `ESC` 后，输入 `:q`。

    * 查找字符串：按下 `ESC` 后，输入 `/wordToSearch`。

    * 跳转到特定行：按下 `ESC` 后，输入 `:the line number`。

    * 在保存文件后退出程序：按下 `ESC` 后，输入 `:x` 或在按下 `ESC` 后输入 `:wq`。

    * 保存文件，按照这些步骤：按下 `ESC` 后，输入 `:w filename`。

    * 进入命令模式，按照这些步骤：按下 `ESC` 键。

    * 进入编辑模式，按下以下键：按下 `ESC` 后，输入 `I`。

    * 打开文件，按照这些步骤：在 `vi` 中输入 `filename`。


    保存脚本后，它开始运行。


    执行 `./hello.sh` 命令导致屏幕上显示错误消息。因为你没有为 `hello.sh` 脚本设置执行权限，它可能运行失败。


    ### 使用 chmod 命令


    `chmod` 命令可更改文件的访问权限。以下是语法：


    `filename chmod ugo+rwx`


    其中：


    * `x` 表示执行权限，

    * `w` 表示写入权限，

    * `r` 表示读取权限，

    * `=` 表示覆盖，

    * `-` 禁用

    * `+` 启用

    * `u` 表示用户

    * `g` 表示组

    * `o` 表示其他


    以下是你可以如何用数字表示法表示的示例：


    * `7`：读、写、执行权限

    * `1`：执行权限

    * `2`：写入权限

    * `4`：读取权限


    ### 错误


    程序的韧性经常被用来区分好程序和坏程序。因此，当出现问题时，程序处理某些情况的能力会被测试。


    ### 退出状态


    当程序成功完成时，它返回退出状态 0。如果退出状态为 0，则认为程序以某种方式失败了。当你的脚本结束时，退出状态必须有一个有意义的返回值。Unix 系统管理员可以为创建系统编写特定的代码行，例如
    `some directory`。如果一切顺利，这可能不是最糟糕的方法。通过这两行代码将工作目录更改为 `some directory` 所拥有的名称，并且在该目录中删除了该文件。如果
    `some directory` 中命名的目录不存在会怎样？脚本将在当前运行的目录上运行 `rm` 命令，并且 `cd` 命令将失败。


    ### 检查退出类别


    你有许多选项来响应并获取程序的退出状态。首先，必须仔细观察 `$?` 环境变量及其内容，并且执行最后一条命令需要一个 `$?` 将包含的退出状态。


    `false` 和 `true` 命令除了返回退出状态 0 和 1 之外，它们都是不活跃的程序。上一个程序的退出位置由 `$?` 参数决定。因此，检查退出类别是关重要的。


    在这种变体中，检查 `cd` 命令的退出级别，如果它不是 0，则将错误消息打印到标准错误，并以退出状态 1 终止脚本。尽管这是解决这一困境的有效方法，但我们可以通过采用更好的策略来节省一些打字工作。我们可以精确地使用
    `if` 语句作为下一个要尝试的技术，因为它可以评估退出状态的给定指令。


