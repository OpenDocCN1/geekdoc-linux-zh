    You can create a non-default home directory by following the steps below:


    ```bash

    [root@localhost handy32]# useradd –d /home/test handy32

    ```


    ## Adding a user to a supplementary group as well as a major group


    It is possible to define a complementary group and the primary group as administrators
    by using the `-G` and `-g` options.


    ```bash

    [root@loaclhost handy32]# useradd –g “head” –G “faculty” handy32

    ```


    ## Locking and unlocking by the user


    A superuser can lock or unlock a user''s account. To lock an account with the
    option `- /`, all you have to do is type `passwd`.


    ```bash

    [root@localhost handy32]# passwd -/ handy32

    ```


    For user `handy32`, Locking password

    `passwd: Success`


    You can use `passwd` with the `-u` option to unlock an account:


    ```bash

    [root@localhost handy32]# passwd –u handy32

    ```


    For user `handy32` to unlock password

    `passwd: Success`


    ## Changing your login name


    Use the `usermod` command with the `-/` argument to modify your username.


    ```bash

    [root@localhost handy32]# usermod -/ “nishant” handy32

    ```


    ## Removal of a user


    Using the `-r` option and `userdel` in combination with the home directory and
    a user:


    ```bash

    [root@loaclhost handy32]# userdel –r handy32

    ```


    ## Linux Users'' Group


    The Linux group is a technique for bringing together and organizing users. The
    `GID`, or group ID, is a unique ID for each group, similar to the user ID. The
    two sorts of groups are the supplemental and primary groups. Each user belongs
    to a major group as well as one or more supplemental groups. The information for
    the group is saved in `/etc./group/`, and the appropriate passwords are stored
    in the `/etc./gshadow` file.


    ### Creating a group using the default settings

    To create a new group, run the `groupadd` command as a root user with the default
    settings:


    ```bash

    [root@localhost handy32]# groupadd employee

    ```


    If you want to add a password, type `gpasswd` using the group name:


    ```bash

    [root@localhost handy32]# gpasswd employee

    ```


    For group `employee`, changing the password

    `New Password:`

    `Re-enter new password:`


    ### Creating a group with a certain GID

    Execute the `groupadd` command with the `-g` option to explicitly indicate the
    group''s `GID`:


    ```bash

    [root@loaclhost handy32]# groupadd –g 1200 manager

    ```


    ### Passwords for groups are being removed.

    To remove a group password, execute `gpasswd –r` with the correct group name:


    ```bash

    [root@loaclhost handy32]# gpasswd –r employee

    ```


    ### The group''s name is being changed.

    To alter the name of the group, run the `groupmod` command as a superuser with
    the `-n` option:


    ```bash

    [root@loacalhost handy32]# groupmod –n hrsupervisor employee

    ```


    ### Changing the group''s GID (Group Identification Number)

    Run the `groupmod` command with `-g` to alter the GID of the group:


    ```bash

    [root@loaclhost handy32]# groupmod –g 1050 manager

    ```


    ### Delete a group of people

    Before you may delete a primary group, you must first delete the users of that
    primary group. To delete a group, use the `groupdel` command with the group name:


    ```bash

    [root@loaclhost handy32]# groupdel employee

    ```


    ## The Linux File System


    A file system is a method of storing files on a hard disk. Linux also supports
    a variety of file systems, including:


    * `Debugfs`, `tmpfs`, `sysfs`, `procfs`, and other special-purpose file systems

    * `YAFFS`, `JFFS2`, `ubifs`, and other flash storage file systems

    * `NTFS`, `JFS`, `Btrfs`, `XFS`, `ext4`, `ext3`, `ext2`, and other common disk
    file systems


    ### The file system''s hierarchy standard

    The file system hierarchy is a standard way for the Linux system to store files.
