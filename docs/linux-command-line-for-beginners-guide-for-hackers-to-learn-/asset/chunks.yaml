    如果你想查看文件在系统硬盘或磁盘上占用了多少空间，`df` 命令可以为你显示。在运行此程序时，你会注意到 `-h` 的含义是“人类可读”（human-readable）而不是“帮助”（help）。某些命令使用
    `G` 表示千字节，使用 `K` 表示千字节，而不是打印巨大的整数型字节数来显示磁盘或文件大小。`du` 命令显示的是特定目录下子目录的文件空间占用情况。你可以使用
    `df` 来查找硬盘上的剩余可用空间。`Du` 也可以用于确定目录的大小。`--max-depth=N` 标志选择从提供的目录向下或向上 N 级的目录，`du`
    会处理该参数。`ps` 命令显示用户正在运行的当前进程。


    默认情况下，`mkdir` 只创建一个目录。因此，仅用 `mkdir` 创建 `d/e/f` 可能会困难，因为 `d/e` 目录不存在。此外，如果它们不存在，我们可以使用带有
    `-p` 选项的 `mkdir` 来创建所有父目录。此外，如果目录不存在，我们可以使用 `mkdir` 配合 `-p` 选项来创建所有父目录。此外，通过 `tree`
    的帮助，我们可以更好地可视化显示目录的结构。`tree` 从指定的目录开始整洁地打印整个结构。然而，如果你使用 `-L` 标志，可以限制显示的目录层级。`tree`
    输出中可以通过 `-prune` 标志隐藏任何非空目录。此外，该命令将递归地包含任何空目录。


    ## 杂项


    ### Exit / logout / passwd


    `Passwd` 可用于更改账户密码。你可能需要提供当前密码进行验证。然后，为了避免任何拼写错误，它要求你输入新密码。如果你只是有一个用户账户，`logout`
    将退出已登录的 shell。


    ### / clear


    如果你想让新的终端行出现在屏幕顶部，请运行 `clear`。此命令会在提示符下方添加空行。结果是，你能够清理工作区域。此外，在需要查找某些文件，通配符（也称为星号
    `*`）是理想的。你可以多次使用 `glob` 命令，因为它等同于字符。


    ## 处理器、内存和磁盘使用


    ### htop / top


    `top` 显示最近运行的进程以及它们的内存占用情况、所有者以及许多其他细节。`htop` 是 `top` 的交互式升级版本。你应该注意到，通过指定用户名
    `-u` 标志，可以限制显示特定用户的进程。


    ### ncdu


    `ncdu` 提供了可导航的文件空间总结，这是改进的 `du` 的典型用法。它具有打开与 `vim` 相关的窗口的功能。要关闭计算机，按 `q`。


    ### REPLs


    求值-打印循环（Evaluate-Print Loop，即 `REPL`）是一种常见的命令行工具，用于某些编程语言。虽然函数 `quit()` 可用于退出，`python`
    命令可访问 Python REPL。你也可以使用 `R` 命令启动 R REPL，并使用函数 `q()` 退出。你还可以打开 Scala REPL 并使用
    `:quit` 命令退出，这通过 `scala` 命令实现。你可以使用 `jshell` 命令打开 Java REPL，并使用 `/exit` 命令关闭它。如果你需要，可以使用
    `^d` (Ctrl+d) 退出任何 REPL。在 Unix 上，`d` 表示输入的结束，它也表示文件的结束，即 EOF。


    ### -v / --version / -version


    大多数应用程序和命令使用 `--version` 或 `-version` 标志来获取软件版本。即使对于大多数应用来说，这个元素并不直观，但这些信息通常可用。你应该注意到，有些程序使用
    `-v` 作为版本标志，而另一些程序在执行应用程序或打印各种诊断信息时表示“详细”（verbose）。


    ## 环境中的变量


    环境变量是在 `bash` shell 中可以使用和创建的持久变量，“env vars”是它们的简写。你可以配合美元符号 (`$`) 使用它们，并且它们使用等号
    (`=`) 来进行定义。当你使用 `printenv` 时，可以看到所有最近定义的环境变量。你可以通过 `=` 运算符创建一个新的环境变量。重要的是记住 `=`
    前后不能有空格。你可以通过使用带有 `$` 符号的 `echo` 命令将特定的环境变量写入终端。尝试使用引号 (`"..."`) 包围环境变量周围的所有空格。此外，要小心，因为不会有警告，你可能会通过给它重新赋值来覆盖环境变量。除了上述出的选项外，你还可以使用
    `export` 命令来定义环境变量。当你从此 shell 调用命令时，子进程可能也可以访问这些环境变量。如果你使用 `unset` 命令或让 `=` 的右侧留空，可以取消环境变量。


    ## 第 14 章：高级 Bash Shell 命令


    ![使用 UNIX bash shell 上的网站。命令行界面中的绿色代码。](img/Image0042.jpg)


    shell 既是一个命令解释器，也是一种相当强大的编程语言，而不仅仅是连接用户和操作系统内核的缝隙。你还可以通过组合内置二进制文件、实用、工具和系统调用，在
    shell 程序内部使用称为脚本的简单设备来创建程序。整个 Unix 工具、插件和命令库都可以通过 shell 脚本调用。如果这还不够，外部 shell 命令（如
    `loop` 和测试结构）可以为脚本提供更大的灵活性和威力。 脚本特别适用于系统管理活动以及其他例行、重复性工作，因为它们不需要一种完整、紧凑且功能完备的编程语言。


    ## 正则表达式：概述


    表达式是字符字符串。元字符是意义扩展了其字面含义的字符。例如，引号符号可以表示某人的话，随后的表示元含义的符号也是如此。正则表达式是用于指定或匹配模式的元字符或字符。以下是组成正则表达式的一些元素：


    -   **修饰符**。通过更改这些修饰符，可以缩小或扩大正则表达式匹配的文本范围。

    -   **锚点**，如果可以这么说。它指定了文本行与正则表达式之间的位置。例如，锚点是 `$` 和 `^`。

    -   **字符集**。这些字符的字面意义被保留。字符集是最简单的正则表达式类型。


