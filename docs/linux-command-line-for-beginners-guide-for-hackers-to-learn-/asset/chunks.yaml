    drwxr-xr-x 2 handy32 4096 Dec 20 08:48 Public

    drwxr-xr-x 2 handy32 4096 Dec 20 08:48 Videos

    ```


    ## The soft and firm connections


    A link is a connection between actual data and a file name on a hard disk, and
    there are two types of connections: soft and hard links. You can build a hard
    link by using the command below:


    ```bash

    [handy32@loaclhost~]$ln filel file2

    ```


    Create a soft link by running the command below:


    ```bash

    [handy32@localhost~]$ln □S filel file3

    ```


    ## Changing Mod


    For every file in Linux, there are three types of connected permission, and they
