    Because the default "vi" editor in Linux may look to boring you, `vim` will be
    your best alternative if you like a lot of options and powerful performance when
    editing your content in a sophisticated text editor. The definition of `vim`,
    as implied by the name, is "vi enhanced," as it is the sophisticated version of
    the default Linux text editor. When they create it, they keep the developers''
    specific needs in mind. It''s also known as a programmer editor because of its
    extensive customization features. It can be used as a stand-alone GUI program
    or as a command-line utility, similar to the `Vi` editor. Here are some of VIM''s
    distinctive features:


    - Commands that are issued automatically

    - Input digraph

    - Screen split

    - Tab expansion on the session screen

    - System of tagging

    - Syntax highlighting


    # The Linux Shell: An Overview


    If you use any major operating system, you are indirectly dealing with a shell.
    If you''re using Linux Mint, `Ubuntu`, or another Linux distribution, you''re
    interacting with a shell every time you use a terminal. Before we start, there
    are a few terminology that must be understood, and we will go over them in detail
    in the following chapter.


    ## Chapter 10:


    ![IMG_256](Image00011.jpg) Basic Linux Shell Commands


    The shell command is used for analysis on Linux. The shell is the program that
    users interact with in a terminal emulation window. The emulation window is the
    workstation''s mate-terminal GUI on Linux. It''s also an application similar to
    `PuTTY`, or secure shell client; `SSH` secure on a Windows PC that you may register
    into Linux via the network. They employ the Bourne Again Shell, `bash`, in several
    corporate or organizational situations. You can choose from a variety of shells,
    including the `TC-Shell`, `C-Shell`, and `Bourne Shell`, if you choose. They all
    have the same qualities because they have special attributes that are unique to
    each of them. The following characteristics belong to `bash`:


    - The shell''s history system is functioning, as it remembers the last few instructions.
    You can use the `history` command in addition to a reference number to list the
    previous few commands.

    - You can cut and paste from the history in a terminal emulation window of a workstation
    to rerun a command. The symbol `!` can also be used to replay any command from
    the past.

    - There is also "task control" for the shell, which allows you to run any programs
    in the background that don''t require terminal interaction.

    - The shell is immediately available for additional commands, while the program
    `sort` is running in the background. The shell prints the job control number "1"
    as well as the process identity number "3470" in this case. You can also use the
    special character `Ctrl + z` to suspend a program that is running in the foreground.
    You can then use the `fg` command to keep the program running in the foreground,
    or the `bg` command to put it in the background. If there are many background
    or suspended programs, you can refer to them by their job number. To see your
    jobs and their job numbers, use the `jobs` command to list the status of any paused
    or background jobs.

    - You can write shell command scripts, and just like compiled programs, you can
    call them up by naming them. For instance, we might initially create a file in
    `/bin` containing the command to create a script that counts the number of `C`
    program files in this recent directory.

    - We can use the `chmod` command to make the file executable before running it
    normally.

    - `Bash` is an interpreted programming language that uses `if-then-else` expressions,
    `for` loops, and `while` loops. If you type the following command, you''ll get
    more information about the Linux online documentation:

    - Variables with numeric and string values can be found in the shell.

    - The `$HOME` directory is pre-configured for some variables, and the `set` command
    displays a list of assigned variables.

    - You may want to assign aliases if you find it difficult to input or if you frequently
    execute specific commands or sets of instructions. For example, in a current directory,
    we can assign an alias `countc` for the number counting of lines generated using
    `wc` and have the files displayed using `ls` to count the number of files of a
    `C` program.

    - The shell boasts of the ability to pipe one program''s output to another program''s
    input. The symbol for the pipe is `|`. For example, in the `wc` program, we could
    pipe the output after `cat` the file in order to count the amount of words in
    file A.

    - Most Linux programs and instructions adhere to the principles of standard output
    and standard input. The average output is a flood of data written by the program,
    and the standard input is a flood of data read by the program. The terminal is
