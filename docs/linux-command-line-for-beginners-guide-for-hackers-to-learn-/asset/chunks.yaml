    Kwrite 最初于 2000 年向公众提供，由 KDE 开发。它在很大程度上基于 KDE 的 `Kate` 文本编辑器以及 `KParts` 技术。你可以通过安装其他插件来极大扩展
    `Kwrite` 的功能，使其成为一个更强大的编程环境。除了编码之外，它还可以用于编辑远程文件。要在 Linux Mint 或 Ubuntu 上安装 `kwrite`，请执行以下命令：


