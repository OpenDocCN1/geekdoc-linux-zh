    The Linux user manual is available online. Every command in Linux has help or
    assistance, which is one of the most important characteristics of the operating
    system. You must type the following command to access the Linux handbook page:


    ```bash

    [handy32@localhost~]$man /s

    ```


    When you do this, you will be directed to the manual''s command page.


    ### Superuser or root

    This account is a particular type of user account that allows anyone to change
    any Linux service or program with access to all kinds of permissions. You''ll
    use the `su` command to become root or superuser, and all you have to do is input
    the root password by typing the following command:


    ```bash

    [handy32@localhost~]$su

    ```


    ## Handling directories and files


    Inside Linux, everything is a file. As a result, while dealing with device files
    or normal text files, there is contact with them via file operation related commands.
    A few operations on the files are listed below:


    ### File creation

    Two commands are required for file creation: `cat` and `touch`. You may use the
    `touch` to create an empty file by following the steps below:


    ```bash

    [handy32@loaclhost~]$touch filel

    ```


    You''ll utilize the `cat` to inspect or create a file, which you can do by following
    these steps:


    ```bash

    [handy32@loacalhost~]$cat>filel

    ```


    You can also use the command below to inspect a specific file type:


    ```bash

    [handy32@localhost~]$cat filel

    ```


    ### Copying a file

    You can use the `cp` command to transfer a file from one location to another,
    as shown below:


    ```bash

    [handy32@localhost~]$cp filel /home/sandra/Documents/

    ```


    This command will copy the current working directory to Removing a file: `/home/bhargab/Documents/.`.


    ### Removing a file

    To delete a file, type the following command:


    ```bash

    [handy32@localhost~]$rm filel

    ```


    ### Renaming or moving a file

    The `mv` command can be used to rename or relocate a file. To move a file from
    one location to another, use the following command:


    ```bash

    [handy32@loaclhost~]$mv file /home/sandra/Document

    ```


    With the above command, the file `file1` will be added to the `Document` directory
    under `/home/sandra/`. Then, to rename a file, use the following command from
    `file1` to `file2`.


    ```bash

    [handy32@loaclhost~]$mv filel file2

    ```


    ### Listing of directories and files

    The contents are `ls` lists of directories and files in the provided directory
    or current directory. Use the following command to display the contents of the
    current directory:


    ```bash

    [handy32@localhost~]$ls

    ```


    This command will display the directory name as well as the file. You can use
    the command below to list all files in your home directory:


    ```bash

    [handy32@localhost~]$lsa

    ```


    To examine files in long-listing format, use the `l` option and type:


    ```bash

    [handy32@localhost~]$ls

    ```


    A sample of the output is below:

    ```

    Total 48

    drwxr-xr-x 2 handy32 4096 Jan 25 21:32 Desktop

    drwxr-xr-x 2 handy32 4096 Apr 24 16:33 Documents

