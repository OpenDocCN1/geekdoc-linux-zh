- fmt: '

    Dotfiles are likewise created by "dot" folders and are included in their programs.
    Other files required by the application are stored in a hidden configuration directory,
    which is a directory for dot, and these files are all contained in a single hidden
    configuration file. These directories are usually user-specific non-configuration
    files, and only the user who has them installed has access to them.


    ## Permissions for Linux Files

    Linux is a clone of UNIX because it allows several users to access the system
    at the same time and because it is a multi-user operating system. Linux can also
    be used in servers and mainframes without any modifications. This condition, however,
    poses security problems because important data can be erased, modified, or corrupted
    by malicious or unwanted individuals. As a result, Linux divides authorizations
    into two layers to ensure proper security:


    1. Obtaining permission

    2. Possession


    Ownership and permissions are important concepts in Linux. We''ll start with the
    ownership because both of them will be evaluated.


    ### Ownership of files in Linux

    Every directory and file on your Linux system has three different categories of
    owners.


    A user-group is made up of many people. In addition, all users in a group will
    have similar access permissions to the files. If you''re working on a project,
    you''ll need to share a file with other people. Instead of manually providing
    permissions to each user, you can add all users to a group. When you apply group
    permission to a file, no one else can alter or view it.


    - **User**: The file''s owner is a user, and you will be the owner if you are
    the one who creates the file by default. As a result, as an owner, you might also
    be referred to as a user.

    - **Other**: Having access to a file by any other users is referred to in this
    scenario. This sort of user is not a member of the user group that produced or
    owns the file. This could, in most cases, be anyone else. When you set permission
    for others, it''s often referred to as setting permissions for the globe.


    Finally, the issue of differentiation arises. How can you separate these three
    user kinds without revealing sensitive information from one to the other? It''s
    common practice to hide your image from your computer from a colleague who uses
    your Linux machine. This is the case with permissions, and you can specify them
    through user behavior. We may need to go over the permission system in Linux again
    in order for you to fully comprehend it.


    ### Permissions

    The three permissions listed below define every directory and file in your Linux
    system for all three owners mentioned above.


    - **Execute**: You have an executable application in Windows with the extension
    ".exe" because you can effectively run it. However, unless the execute permission
    is set in Linux, you won''t be able to start an application. Even if you can''t
    run it, you might be able to alter or view the program code if you set write and
    read permissions.

    - **Write**: If you have the write permission, you will be able to edit the contents
    of a file. As part of the write permission''s authority, you can also modify,
    remove, and add files to the directory. You can guess where the file is located
    because you don''t have write permission on the directory, but you do need write
    permission on the file. You have the ability to change the contents of the file.
    However, you will be unable to delete, move, or rename the file from the directory.

    - **Read**: Using the authority granted by this permission, you can read and open
    a file. Because you have read permission, you can also list the contents of a
    directory.


    ## Command for SSH

    `ssh` is a command that comes standard with every Linux system. This command starts
    the SSH client, which establishes a secure connection to the SSH server on a remote
    machine. The `ssh` command is used to execute instructions on a remote device
    and transfer data between the two computers, from logging to a remote workstation.


    ### Linux''s SSH command

    The `ssh` command establishes a secure encrypted connection over an unsecure network
    and between two hosts. It can also be used for file transfer and terminal access
    when tunneling other apps. You can securely run Graphical X11 programs through
    `ssh` from a remote location.


    ### Additional SSH commands

    Aside from the client `ssh`, there are other SSH commands on each of their pages.


    - `sshd` - OpenSSH server

    - `sftp` - file transfer program with an FTP-like command interface

    - `scp` — RCP-related command interface for file transmission

    - `ssh-add` - is an utility that allows you to add a key to the agent

    - `ssh-agent` – agent to hold private key for single sign-on

    - `ssh-copy-id` – configures a public key as authorized on a server

    - `ssh-keygen` — generates a public-key pair for authentication


    ## Chapter 9: Linux Terminals, Editors, and Shells

    ![Shell script inscription against laptop and code background. Technology concept.
    Learn programming language.](Image00010.jpg)


    Whether you''ve been using Linux for a long time or are brand new to it, you can
    obtain help getting started with the terminal. A terminal is, without a doubt,
    a strong tool with numerous benefits, and it is not anything to be afraid of.
    You will not be able to learn everything you need to know about the terminal by
    reading a single book or article. Playing with the terminal firsthand needs practice.


    ### The fundamentals of terminal usage

    When you open a terminal, the `bash` shell will appear in your desktop''s program
    menu. Even though there are different shells, most Linux distributions utilize
    `bash` by default. You can start a program by typing its name at the prompt. Then,
    anything you start here is a program, from command-line utilities to graphical
    apps. Though those operations are common in programs, `bash` provides a few built-in
    commands for file management. And, unlike on Windows, you may not need to type
    the complete path of an application to start it. When you try to open Firefox
    on Windows, for example, you''ll have to type the entire path to the `.exe` file.
    On Linux, type the following command:


    ```

    Firefox

    ```


    To use it, type a command and then press the enter key. There''s no need to add
    `.exe` or anything else to a program on Linux because it doesn''t have one. Accepting
    arguments is also a feature of terminal commands. You can use certain types of
    arguments in relation to the program. Web addresses, for example, are accepted
    as arguments by Firefox.


    ### Software installation

    One of the most time-saving methods is to install software from a terminal. The
    software management programs are a sophisticated interface for some terminal commands
    that they employ in the background, such as the Ubuntu Software Center. Then,
    instead of installing them one by one by picking and clicking around applications,
    you can do so with a terminal background. You can also have many apps installed
    using a single command. Because you can see how other distributions handle package
    management, you can use the following command to install a new software package
    on Ubuntu:


    ```bash

    sudo apt-get install packagename

    ```


    It''s similar to the Firefox command above, although it''s a little more difficult.
    Before running `apt-get`, `sudo`, you can run the above line with root (administrator)
    capabilities. `originalname` will install a package named `originalname` after
    reading the argument `apt-get` program. Multiple packages, on the other hand,
    can be specified as arguments. For example, to install Pidgin instant messenger
    and the Chromium web browser, run the following command:


    ```bash

    sudo apt-get install chromium-browser pidgin

    ```


    If you want to install all of your favorite software after installing Ubuntu,
    you may do so with a single command like the one above. The package names of your
    chosen programs are all you need to know because you can guess them very quickly.
    Your predictions can also be revised with the help of the tab completion method.


    ## Desktop Linux Text Editors

