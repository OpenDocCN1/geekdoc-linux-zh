    The symbol for matching blank lines is "^$."


    XXX matches "XXX$" at the end of the line.


    ●          The caret —^— matches the beginning of a line, which occasionally negates
    the meaning of a sequence of characters in a regular expression depending on context.


    ●          Any letter, excluding a newline, matches the dot —.—


    Though there aren''t 13 more characters missing, "13" corresponds to 13 + at least
    one other character, including space: 1133, 11333.


    ●          In addition to zero instances, any number with the regular expression
    or character string repeated matches the asterisk — *—.


    11 + one or more 3s is represented by “1133*”: 113, 1133, 1133333, and so forth.


    ●          Regular expressions that are longer. There are also other characters
    in the basic set. They make use of it in Perl, awk, and egrep.


    ●          The plus —+— is matched by one or more of the preceding regular expressions.
    Though it does not match zero instances, it performs the same function as the
    *.


    ●          The question mark —?— is matched by zero or one of the previous regular
    expressions. In general, it''s used to match single characters.


    ●          Escaped "curly brackets" —\ {\} – the number of occurrences is indicated
    by the previous regular expression to match.


    Because the literal character meaning is the only one they have otherwise, avoiding
    the curly brackets is critical. Technically, this usage does not correspond to
    the basic regular expression arrangement.


    "[0-9]\{5}" matches exactly five digits for the character in the 0 to 9 range.


    Curly brackets are not available in the classic awk version with a regular expression
    since it is non-POSIX compatible. They do, however, have permission from gawk''s
    option –re-interval, even if they are not escaped. Some egrep and perl versions
    don''t have to escape the curly brackets by default.


    ●          The parentheses – () – contain a series of regular expressions. They
    tend to be particularly beneficial when using expr in substring extraction with
    the following operator “│”.


    ●          It is matched by the regular expression or the alternate character
    set —│—.


    There is support for some version of ex, ed, and sed, the lengthy regular expressions
    escaped version in the previous description, just as there is for the GNU utilities.


    ●          POSIX Character Classes [: class :]


    This is an alternative way for matching the range of identifying characters.


    Hexadecimal digits are represented by [: xdigit:]. This is the same as 0-9A-Fa-f


    ●          [: upper:] corresponds to uppercase alphabetic characters. As a result,
    A-Z is usually the same.


    ●          [: space:] is a character that matches whitespace characters (horizontal
    and space tab)


    ●          [:print:] (printable characters) matches characters in the ASCII 32–126
    range. 


    ●          [: graph:] below 


    ●          [: lower :] characters of the alphabet with a lowercase that matches. 
     This is very similar to the a-z.


    ●          [: graph:] (Graphic printable characters). It matches characters on
    the ASCII 33–126 scale, excluding the space character.


    ●          [: digit:] matches (decimal) digits, identical to [: print:] above.
    This is the same as 0-9.


    ●          Control characters are matched by [: cntrl:].


    ●          A tab or a space is represented by [: blank:].


    ●          Alphabetic characters are matched by [: alpha:]. This is the same as
