    include creating, enhancing, and maintaining user reports or accounts, as well
    as controlling the operations of a computer system utilizing command-line interface
    tools and Linux utilities. Because of its open-source nature, excellent security,
    and reliability, Linux powers the majority of computing devices. It is critical
    to be aware of and comprehend the following characteristics of a Linux system
    administrator:


    ●           User, directory, and file management


    ●           The bash command is really basic.


    ●           Managing the Files system hierarchy as a superuser or root


    ●           File systems on Linux


    The responsibilities of a Linux administrator the system administrator is a trustworthy
    requirement for an institute or organization that requires a strong IT foundation.
    As a result, effective Linux administrators will be required at all times. The
    job description may alter when additional duties and responsibilities are added
    to the function by each business. A Linux administrator''s tasks include the following:


    ●           It is the administrator''s responsibility to troubleshoot a server
    problem.


    ●           Security tools and system setup are essential. The administrator collaborates
    with the data network engineer and other departments or people to provide appropriate
    recommendations after examining hardware needs.


    ●           Linux administrators discover and resolve service issues ranging from
    login issues to disaster recovery.


    ●           Creating, maintaining, and improving the essential tools for Linux
    systems and users.


    ●           One of the traits of a Linux administrator is the ability to communicate
    with customers, vendors, and employees in a professional and courteous manner
    at all times.


    ●           Aside from providing exceptional customer service for ISP, web hosting,
    and LAN customers in terms of troubleshooting any growing support issues, the
    Linux administrator also resolves and analyzes all problem logs.


    ●           Listing backups, generating new stored procedures, and conducting
    regular data backups are all part of the job.


    ●           PHP, MySQL, Apache, RADIUS, and DNS are examples of internet request
    maintenance tools.


    The path to becoming a Linux system administrator


    ●           Learn how to set up and utilize the Linux operating system.


    ●           Have a certification in Linux administration


    ●           Become a documentation expert.


    ●           Join a local Linux user community or group to get help and support.


    Taking backups and managing operations, such as inspecting hardware and software
    systems, are two of the Linux systems administrator''s most important responsibilities.
    In addition, the administrator must be able to articulate a thorough comprehension
    of technical knowledge.


    As a Linux administrator, you should know how to manage users and groups.


    Because Linux is a multi-user operating system, multiple users can use it at the
    same time. And Linux provides a lovely framework for managing users in a system.
    As a result, the most important duty of a system administrator is to get along
    with the various groups and users within the system. And we''ll go over all of
    the tasks below using the CentOS Linux distribution.


    User of Linux


    The UID, or unique identification number, is a binary number that uniquely identifies
    a system user''s account. The two sorts of users are normal users and super or
    root users. Regular users will have limited access to files, whereas super or
    root users will have complete access to all data. A superuser has the ability
    to change, delete, or add user accounts. The whole account information is saved
    in the /etc./passed/ file, while a hash password is stored in the /etc./shadow/
    file.


    Creating a user with a default setup a user can be added at the command prompt
    with the user add command. After creating the user, use the passwd software to
    specify a password like this:


    [root@localhost handy32]# useradd enirban


    [root@localhost handy32]# passwd anirban


    Changing password for user anirban.


    New password:


    Retype new password:


    passwd: all authentication tokens updated successfully.


    The default shell will be configured to /bin/bash, the home directory (/home/username>)
    will be created, and the system will allocate a UID to the user. The useradd command
    creates a user private group whenever the system adds a new user and also utilizes
    the user name for the group. When creating a user, make sure to include the user''s
    entire name. As a system administrator, use useradd with the –c option to specify
    the entire name of the user:


    [root@localhost handy32]# useradd –c “Anirban Choudhury” handy32


    Creating a user with UID


    A user can be created using the –u option and a custom UID in the following way:


    [root@localhost handy32]# useradd –u 1036 handy32


    To create a user, use the home directory with a non-default value.'
