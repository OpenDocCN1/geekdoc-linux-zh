    用户使用包含 `/usr` 目录的文件和应用程序，而不是系统使用的文件和应用程序。例如，非本质程序位于 `/usr/bin` 目录，而不是 `/sbin`
    目录（后者包含非本质系统管理二进制文件）。`/usr` 目录还包含额外的目录，例如与架构无关的文件夹 `graphics`，它们在 `/usr/` 中共享一个位置。这可以防止它们对系统的其他造成破坏，因为本地构建的应用程序默认安装在本地目录
    `usr/`。


    ### /tmp - 临时文件

    由于 `/tmp` 目录是应用程序存储临时文件的地方，如果系统重启，像 `tmpwatch` 等程序将删除这些文件。


    ### /srv — 服务数据

    `/srv` 目录存放“系统提供的服务数据”。如果你正在使用 `Apache` HTTP 服务器来提供网站，通常会将文件放在 `/srv` 目录内部的目录中。


    ### /selinux - SELinux 虚拟文件系统

    如果你的 Linux 发行版出于安全考虑使用了 `SELinux`，那么 `/selinux` 目录包含特殊文件。它与 `/proc` 相同。由于 Ubuntu
    不使用 `SELinux`，这个子目录的出现看起来像是一个问题。


    ### /sbin - 系统管理二进制文件

    `/bin` 目录类似于 `/sbin` 目录。它通常设计为由 root 用户运行用于系统管理，因为它包含了重要的二进制文件。


    ### /run – 运行状态文件

    由于 `/run` 目录较新，它为应用程序存储临时位置提供了标准，例如进程 ID 和套字。这些文件不能存储在 `/tmp` 中，因为它们可能会被删除。


    ### /root - Root 家目录

    `/root` 目录是 root 操作者的家目录。由于它是系统根目录，它位于 `/root` 而不是 `/home/root`。


    ### /proc - 进程与内核文件

    `/dev` 目录与 `/proc` 目录相同，因为它不包含标准文件。它只包含处理和表示数据的特殊文件。


    ### /opt - 可选软件包

    `/opt` 目录中的这些目录用于可选软件软件包。由于传统的文件系统层次结构不受遵守，专有软件经常使用它。例如，当你安装它时，它可能会将专有程序文件泄漏到
    `/opt/application`。


    ### /mnt – 移动挂载点

    `/mnt` 目录是系统管理员在使用临时文件系统时挂载的地方。例如，如果你在 Windows 的 `/mnt/` 上挂载一个分区，你可能想为了几次文件恢复活动挂载它。另一方面，其他系统文件可以挂载到系统上的任何可用空间。


    ### /media - 可移动式介质

    `/media` 目录位于安装到计算机的设备挂载的子目录下。例如，当你向 Linux 系统插入一张 CD 时，`/media` 目录内部会自动生成一个目录。你也可以从该目录内部访问
    CD 的内容。


    ### /lost+found – 恢复的文件

    每个 Linux 文件系统都包含一个 `lost+found` 目录。因此，如果文件系统崩溃，下次启动时将进行文件系统检查。发现的任何损坏文件将存储在 `lost+found`
    目录中以便进行广泛的数据恢复。


    ### /lib – 核心共享库

    `/lib` 目录包含了关键二进制文件所需的库，可以在 `/sbin` 和 `/bin` 目录中找到。`/usr/lib` 包含了 `/usr/bin` 文件夹中所需的所需的文件。


    ### /home - 用户文档

    每个用户的家目录都位于 `/home` 目录。例如，如果你的用户名是 `Greg`，那么家文件夹将位于 `/home/greg`。此家文件夹包含用户的显式配置文件以及用户的数据文件。每个用户必须在系统上获得提升权限才能以超级用户的身份修改其他文件，即使他们对自己的家文件夹有写权限。


    ### /etc – 配置文件

    配置文件保存在 `/etc` 目录中，可以使用文本编辑器手动修改。请记住，`/etc/` 目录包含系统级配置文件，而用户特定的配置文件位于每个用户的家目录中。


    ### /dev - 设备文件

    Linux 将设备以文件的形式暴露。因此，`/dev` 目录包含代表某些特定文件的设备。尽管它们看起来像是我们所熟悉的文件，但我们不能称它们为原始文件。例如，主
    SATA 驱动器在操作系统由 `/dev/sda` 设备表示。如果你想将其分区为没有任何硬件关联的虚拟设备，可以启动分区编辑器并告诉它更改 `/dev/sda`。此外，此目录还包含伪设备。例如，`/dev/random`
    命令只生成随机数。因为它不产生输出，`/dev/null` 是一个特殊设备，当命令的输出管道到它时，它会自动丢弃所有输入。


    ### /cdrom - 历史挂载点 CD-ROM

    `/cdrom` 目录是 FHS 标准的例外。然而，可以在 Ubuntu 和其他操作系统找到它。它是插入系统的 CD-ROM 的临时位置。然而，对于临时介质的正常位置，它在
    `/media` 目录下。


    ### /boot - 静态启动文件

    `/boot` 目录包含了启动系统所需的文件。例如，你的 Linux 内核和 `GRUB` 引导加载器文件位于这里。引导加载器的配置文件不在 `/etc`
    目录中，尽管它们与其他文件位于同一个目录。


    ### /bin - 核心用户二进制文件

    当系统以单用户模式挂载时，重要的用户二进制文件（通常称为必须存在的应用程序）位于 `/bin` 目录中。如 `Firefox` 之类的应用程序位于 `/usr/bin`
    中，而如 `bash` shell 这样的重要工具和系统程序位于 `/bin` 目录中。`/usr` 目录也可以被存储在单独的分区上。即使没有挂载额外的文件系统，将这些文件放在
    `/bin` 目录中也能确保你拥有关键工具。`/sbin` 目录与它类似，包含了用于系统管理的重要二进制文件。


    / - 根目录

    Linux 系统上的所有内容都位于 `/` 目录下，这被称为根目录。Windows 中的 `C:` 目录与 `/` 目录非常相似。这并不完全准确，因为 Linux
    没有驱动器号。虽然 Windows 中的另一个分区出现在 `/` 目录下的不同文件夹，但在 Linux 中它也出现在 `/` 目录下的不同文件夹。


    ## 第 7 章：处理磁盘、介质和数据文件 (gzip – tar)


    ![florian-olivo-4hbJ-eymZ1o-unsplash](img/Image00006.jpg)


    由于删除和创建分区是 Linux 中的常见活动，在利用它们之前，你必须对 USB 驱动器和硬盘等存储设备进行结构划分。划分后，分区通常包含大量存储空间的设备区域。你也可以使用分区将硬盘划分为隔离的部分，每个部分的操作都像一个独立的硬盘。如果你管理许多操作系统，分区将非常有用。通过使用
    Linux 中各种复杂的工具（也称为磁盘分区管理工具），你可以删除或创建这些。因此，拥有巨大磁盘的设备以及多个磁盘分区都能受益，我们将详细介绍如何使用 `parted`
    命令。这里有一些常用命令，如 `cfdisk` 和 `fdisk`，以及分离与分区之间的区别。

