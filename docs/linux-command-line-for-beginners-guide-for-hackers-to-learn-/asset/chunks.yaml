    It is a subfolder known as "parent" when a directory tends to be a root directory
    by having no parent directory or by being contained within a single other directory.
    As a result, folder or directory trees exist in current filesystems. And, as is
    characteristic of travelling backward through the file tree, you can always get
    to the root directory by moving from child directory to parent directory. Some
    filesystems feature numerous root directories, despite the fact that Unix and
    Unix-like systems only have one root directory, such as Windows'' drives: `A:`,
    `C:`, and so on. `pwd`, `ls`, and `cd`.


    The working directory, also known as the current directory, is always within a
    set of directories that the user uses when working with a filesystem. Print the
    user''s working directory with `pwd`. Make a list of files and child directories,
    etc., that is, the directory''s content, using `ls`. You should pay attention
    to the following points:


    - You can sometimes use a chain flag like `ls –la` instead of `ls -1 –a`.

    - Use numerous flags together, such as `ls –l –a`.

    - With `ls –l`, you may see the contents of a file.

    - To reveal hidden ("dot") files, use `ls –a`.


    The shorthand for `cd` (change directory) is `cd`. It is used to change to a different
    directory and the parent directory. The abbreviation for `cd`, or simply `cd`,
    is `cd` to the home directory, which is generally `/home/username` or a similar
    directory. Because `..` is shorthand, `cd ..` may not have much of an impact in
    this directory. To return to the most recent directory, type `cd –`. You can also
    move through numerous directory levels by typing `cd ../..`, etc.


    ### `;` `&&` and `&`


    Commands are the things you write into the command prompt and save somewhere on
    your computer; they always run machine code. This machine code is sometimes a
    built-in Linux command, and sometimes it''s some code you wrote yourself, such
    as an app. We may occasionally want to run one command after another, and we can
    do so by using the `;` (semicolon):


    The semicolon means that `ls` lists the contents of the working directory first
    (`ls`), and then `pwd` prints its location. The `&&` operator can then be used
    to chain commands, which is a handy feature. The command to the right will not
    run if the command to the left fails. You can use both `&&` and `;` numerous times
    on the same line.


    If the first fails, the second will continue with `;`. Even though it looks similar
    to `&&`, `&` serves a completely distinct purpose. When you perform a long-running
    operation, the command-line will usually wait for that command to finish before
    allowing you to enter another. You''ll be able to run a new command while an earlier
    one is still running, and this won''t happen if you put `&` after a command.


    It''s critical to understand that when we use `&` after a command to hide a process
    or job, we presume it''s "backgrounded." Then, to view what background jobs are
    currently executing, use the `job` command.


    ### Obtaining Assistance


    Type `man` before practically any command to bring up the manual for that command
    (with `q`, quit man).


    Use `-h` or `–h` to bring up a help menu for that command.


    ### Editing and viewing files


    #### `nedit` / `nano`


    `nano` is a wonderful command-line text editor with minimalistic qualities for
    people or novices who want to learn a million shortcuts. It will suffice for any
    developer or programmer in their first few years of coding. `nedit` sets up an
    X Window as a small graphical editor, with syntax highlighting, drag-and-drop,
    and point-and-click editing. When you wish to make changes to a script and then
    rerun it, you should consider using `nedit`. Other common editors, such as graphical
    user interface, GUI, or command-line interface, CLI, include `Atom`, `Notepad++`,
    `gedit`, `vim`, `vi`, `emacs`, and others. `VS Code`, `Light Table`, and `Micro`
    are some of the others. Syntax highlighting, search and replace, and a few other
    features are standard features in all current editors. Despite the fact that `nano`
    and `nedit` have fewer functionality than `emacs` and `vi`, their learning curves
    are substantially steeper. After trying out a few different editors, you''ll find
    the one that works best for you.


    #### `head` / `tail` / `cat` / `less`


    The first few lines of the file are the `head` outputs. The `-n` parameter specifies
    the number of lines to display, which is 10 by default. The `tail` outputs are
    the last few lines of the file. With `tail –n +N`, you can receive the end of
    the file or, as said above, the last `n` lines, starting with the `N`-th line.
    The terminal is usually used, although `cat` is used to deliver files to the standard
    output stream and to concatenate a list of files. You may use it to swiftly view
    files, and you can use it with several files or simply a single file. However,
    take great notice here; if you use `cat` in this way, you may be accused of a
    UUOC, or Useless Use of Cat. You shouldn''t be too concerned about it because
    it isn''t a major issue.


    Another tool is `less` useful for quickly viewing a file because it opens a vim-like,
    read-only window. Another command is `more`. `Less`, on the other hand, has a
    higher recommendation than `more` because it provides a superset of `more`''s
    capability. You can discover more and less about them on their `man` pages.


    ### Creating and removing files and folders


    #### `mkdir` / `rm` / `rmdir`


    You can use the `mkdir` command to create new, empty directories. Because this
    is irreversible, you must proceed with caution, as `rm` can delete any file. The
    `-i` switch can then be used to remove the "are you sure?" prompt. You can remove
    an empty directory using the `rmdir` command. When you run `ls –a` in an empty
    directory, you''ll notice a reference to its parent directory (`..`) as well as
    a reference to the directory itself (`.`). Only empty folders are removed with
    `rmdir`.


    Using `rm –rf` (`-r` = recursive, `-f` = force) can, however, erase a directory
    and all of its contents.


    #### `touch`


    `touch` was invented to change file timestamps. However, you can use it to create
    an empty file, such as `nano`, by opening it with a text editor. You can also
    make changes to the file. In addition, `touch` can be employed. Note that `z`
    (`Ctrl+z`) represents a background process. Then, with the editing file open,
    press `z`. Use `kill %N` to kill a background process, as shown by the `jobs`
    command, where `N` is the job index. While it is running, press `c` (`Ctrl+c`)
    to stop it from processing anything.


    ### Command history, link creation, and file copying and creation


    #### `mv` / `cp` / `ln`


    Use `mv` to rename or transfer a file. You can `mv` a file to a new file, rename
    it, keep it the same, or move it to a different directory. Then use `cp` to copy
    a file. You can also use `ln` to create a hard link to a file. You can also use
    `ln –s` to create a soft link to a file. The same real bytes are referenced in
    hard links in memory that contains a file, and while it points to those bytes,
    the soft links refer to the original filename.


    ### History of Commands


    There are two primary capabilities that `bash` provides that allow you to rerun
    and complete commands. The first feature is tab completion. You only need to press
    the key `tab` after you''ve written the first section of the command to guess
    the specific action you''re trying to execute. The command will then be completed
    when you have typed `ls t` and pressed the `TAB` key. If an ambiguity situation
    happens, you may be forced to hit the `tab` button numerous times. And, as `bash`
    keeps track of your previous commands, you can get a brief history of them by
    entering `r` (`Ctrl+r`), which will allow you to search through them. To view
    the command history search, press `r` (`Ctrl+r`).


    Directory trees, processes, and disk use


    `ps` / `du` / `df`

