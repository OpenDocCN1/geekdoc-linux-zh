    Chapter 11:


    Shell Scripting


    ![lavi-perchik-fSqYwKWzwhk-unsplash](Image00039.jpg)


    A shell script is a text file that contains a command sequence for a Linux-based
    operating system. The shell script''s commands would have to be written one at
    a time into a single script on the keyboard. The shell is the command-line interface''s
    operating system, acting as an interpreter for commands that you use to communicate
    with the system. A user must regularly use the command sequence of a shell script
    in order to save time. Subcommands, comments, and arguments must all be followed
    by the shell, just as they must by other programs. Users can start the sequence
    of commands by typing the file name into a command-line prompt in the shell. In
    the DOS operating system, a shell script is known as a batch file, while in the
    IBM mainframe VM operating system, it is known as an EXEC.


    Because the shell application is found within the Linux operating system, you
    can type the command for system execution. When a terminal window is launched
    on a Linux computer, the shell software will start, allowing you to enter commands
    through an interface. People refer to this interface as the command-line interface
    (CLI). The output is displayed on the screen, and the shell executes it when a
    command is entered. In addition to being able to execute and accept commands interactively,
    the shell may also execute commands contained in a file. The manner of execution
    is recognized as shell scripting.


    How does a shell script function?


    Shell scripting involves several basic procedures, including giving the shell
    executive authority, making the script accessible to the shell, and authoring
    the script. Because shell script contains ASCII, it can be written using a graphical
    user interface, GUI, word processor, or text editor. The shell can decipher the
    language of a set of commands in the script''s content. Shell scripts enable shortcuts,
    arrays, if/then/else expressions, variables, and loops, among other things. Once
    the file is complete, save it with the.sh or.txt extension in a location that
    the shell can access.


    The shell''s backstory


    Ken Thomson created V6 Shell, a shell application for Unix, in the 1970s. Even
    though it had a shell with interactive elements, its programming abilities were
    very poor. Bourne Shell was added to the board in 1977 for the root account, and
    it is still used as the default shell today. And, thanks to its scripting capabilities,
    it has proven to be highly handy over time. By the 1980s, the hugely popular shell
    variations Korn Shell and C-Shell had given the public something to talk about.
    Every one of these shells brought its own syntax, which made a significant departure
    from the original shell. As a result, Bash is a very popular shell nowadays. It
    stands for Bourne-Again- Shell, the unique Bourne Shell''s significantly upgraded
    variation.


    Examples of shell script applications


    When you use a shell script, you can save a lot of time by typing one line at
    a time instead of executing a repetitious process. Here are some examples of applications
    where a shell script can be used:


    ●          A system is being monitored.


    ●          Performing regular backups


    ●          Bringing together existing initiatives


    ●          File manipulation batch completion


    ●          Developing a program or working in a programming environment


    ●          Automating the compilation of code


    The execution of a shell script


    If you want to run a shell script, all you have to do is supply the script path
    as an argument to the shell. You should be aware that the shell requires LF characters
    (Line-Feed) to terminate lines. It''s easy to get into trouble if you try to run
    a shell script quickly on a Linux system or write it on Windows. The combination
    of CR-LF is what Windows uses for line termination, Carriage-return-Line-Feed,
    and you''ll need it in LF-only conversion. You can use your Windows editor to
    figure out how to accomplish this.


    The shell script can be run directly as a command in another fashion. You can
    use the hash bang declaration below as the first line of your shell script:


    #!/bin/bash


    After that, you can run a program to make your script executable. You can now
    have the script file executed immediately without needing to specifically mention
    the shell.


    Shell scripts have a lot of advantages.


    When you use a shell script, everything is supposed to be quick and easy. It eliminates
    any concerns with interpretation because it utilizes the same syntax on the shell
    command line as it does in the script. In addition, while writing code for a shell
    script, it requires fewer learning curves and is faster than other programming
    languages. However, if a shell script error goes unchecked, it can be highly costly.
    Additionally, shell scripting may not be compatible with different platforms,
    and shell scripts may take longer to execute than individual commands. Regardless,
    there are a few additional advantages to shell scripts.


    Portability


     A shell script can be transferred to another Unix or Unix-related OS. Also, when
    transferring a shell script from one architecture to another, such as Sparc, MIPS,
    or x86, shell scripts are far more portable than C/C++ programs. To transfer and
    use a C/C++ program, you must first attempt to execute it, then compile it and
    copy the source code. It may not work as intended if it uses architecture-specific
    code.


    Transparency


    Because it is a text file, you can readily view it to see what operations the
    shell script is performing. It is, on the other hand, if you have access to the
    source code or if the source code wishes to inform you that you can determine
    the type of program in a language such as C/C++. It is feasible, for example,
    to determine whether any files are being erased by a shell script and then have
    those files transferred to another location if you require them. Shell scripts
    are also easier to troubleshoot than conventional programs because you may be
    able to inspect the source code. Creating and checking programs are some of the
    tasks of a compliant shell script to avoid such problems. You can also make the
    directory while looking at the script code.


