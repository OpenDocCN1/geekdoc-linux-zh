    # 初学者入门 Linux 命令行


    黑客学习命令行、管理和安全基础的指南。

    包含要点与提示

    (2022 年速成课程)

    Alan Harrett


    ## 目录


    - 引言

    - 第 1 章：什么是 Linux 以及你为什么要使用它？

    - 第 2 章：Linux 发行版与安装方法

    - 第 3 章：Linux 内核与操作系统简介

    - 第 4 章：在虚拟机上安装 Linux

    - 第 5 章：Linux 用户管理与系统管理

    - 第 6 章：Linux 目录结构

    - 第 7 章：磁盘、介质与数据文件操作 (gzip – tar)

    - 第 8 章：文件、目录管理器、权限、网络与 SSH

    - 第 9 章：Linux 终端、编辑器与 Shell

    - 第 10 章：基础 Linux Shell 命令

    - 第 11 章：Shell 脚本编写

    - 第 12 章：创建脚本

    - 第 13 章：基础 Bash Shell 命令

    - 第 14 章：高级 Bash Shell 命令

    - 结语


    ## 引言


    感谢购买《初学者入门 Linux 命令行》。我们现在使用的几乎所有东西都是基于 Linux 的。如果你是一个新手，或者刚刚开始学习关于 Linux 操作系统的所有知识，你会很快发现阅读这本电子书是彻底掌握
    Linux 及其各种变体的极佳方法。在 Linux 命令行中操作有时可能会遇到困难。在书中，你将看到多种用于实现顺畅 Linux 操作的方法。此外，还有某些
    Linux 发行版你不仅可以在初学者阶段使用，也可以在旧旧系统上尝试使用。最后，本书还深入探讨了 Linux Shell 命令和 Shell 脚本的基础知识。为此，书中的某些章节将涉及
    Linux 用户管理和管理，涵盖了 Linux 系统管理员承担的一些职责，例如使用基础 `bash` 命令管理目录、用户和文件，管理 root 或超级用户账户等。书中还涵盖了
    Linux 文件函数，以及三种类型的 Linux 文件所有权、权限以及 `SSH` 命令。此外，将介绍其他 `SSH` 命令、Linux 终端、编辑器和 Shell
    命令。在建立起对目录、文件管理器和编辑器的良好理解后，本书将介绍如何从命令行构建 `tar gzip` 文件、如何挂载和卸载介质以及 Linux 数据处理。书架上还有其他关于
    Linux 命令行的书籍，我们感谢你选择这一本。从我们的角度来说，我们正努力确保这本书包含了你成功所需的所有实用和核心信息。再次表示感谢！


    ## 第 1 章


    ![sai-kiran-anagani-Tjbk79TARiE-unsplash](img/Image00000.jpg) 什么是 Linux 以及你为什么要使用它？


    Linux 是一种广泛使用的操作系统，它加强了从手机、服务器再到 PC 的几乎任何设备。事实上，全球范围内大量的人在各个领域和应用中都在 Linux。Linux
    自 20 世纪 90 年代以来一直存在。Linux 运行着从你的电视盒到冰箱的一切设备。Linux 还支撑着互联网的很大部分。许多科学进步都可以归功于 Linux，因为这个计算机操作系统推动了无数创新。尽管
    Linux 几十年来一直提供安全、可靠的操作系统功能，但“Linux”这个词对普通大众来说并不熟悉。然而，Linux 被应用于从企业级服务器到个人电脑、家电、超级计算机、汽车和手机的各种设备上。你可以在电视、Roku
    设备、冰箱和恒温器等地方找到 Linux。Linux 是全球运行嵌入式系统、服务器和桌面的理想平台，因为它是可用的最省心、安全且最稳定的操作系统之一。


    ### 什么是 Linux 操作系统？


    首先，当你说“OS”或“操作系统”时，你指的是什么？被称为操作系统的计算机代码负责管理物理计算机中的硬件。操作系统充当硬件和软件之间的中间层。此外，大多数人并不感兴趣于学习如何与显卡通信或用汇编语言处理
    CPU 地址。像 Windows 或 Linux 这样的操作系统充当了中间人。因此，Linux 是一种操作系统，就像 Mac OS 和 Windows 一样。全球最流行的平台
    Android 是 Linux 操作系统驱动的。由于 Linux 作为操作系统负责监督硬件和软件之间的通信，如果没有它，软件很可能无法运行。Linux 操作系统由多个不同的组件组成，包括：


    - **应用程序 (Applications)** —— 但桌面环境中提供的全部程序。因此，Linux 像 macOS 和 Windows 一样，允许你快速搜索并安装成千上万个高质量程序。大多数最新
    Linux 发行版中的应用程序安装过程是简单且集中的。例如，`Ubuntu Linux` 提供的 `Ubuntu Software Center`（代表 `GNOME
    Software`），让用户能够从单一的中心平台在数百个应用中快速发现并安装。

    - **桌面环境 (Desktop environment)** - 用户可以在桌面环境中与此项进行交互。可用的桌面环境包括 `Xfce`、`KDE`、`Enlightenment`、`Pantheon`、`Mate`、`Cinnamon`、`GNOME`
    等。每个桌面环境都内置了如游戏、浏览器、配置工具和文件管理器等应用。

    - **图形服务器 (Graphical server)** - 使用这个子系统，可以在显示器上获得图形显示。许多人将其简称为 `X` 或 `X-server`。

    - **守护进程 (Daemons)** - 这些是后台服务，如调度、声音、打印等，在登录桌面后或在启动期间启动。

    - **Init 系统 (Init system)** – 用户空间由此子系统引导，它还负责控制守护进程。因此，尽管争议很大，`systemd` 是最广泛使用的
    init 系统。当引导加载程序（如 `Unified Bootloader` 或 `GRUB`）处理初始启动时，init 系统负责监督启动过程。

    - **操作系统内核 (OS Kernel)** - 内核是一个完整的软件，负责管理外围设备、内存、CPU 和系统核心。

    - **引导加载程序 (Bootloader)** - 是一段控制计算机启动过程的软件。它是操作系统中出现的启动界面，在大多数用户完成启动之前就消失了。

    - **操作系统 Shell (OS Shell)** - Shell 是我们告诉操作系统想要让它做什么的地方。你利用文本来指示操作系统，许多人将其其为命令行。然而，只有少数人了解命令行代码。因此，人们一直回避使用
    Linux。这种情况随着 Linux 发行版的出现发生了改变，Linux 像 Windows 一样也会使用桌面。


    ### 为什么要使用 Linux？


    '
- fmt: "\nThis is a question that practically everyone asks. Why would anyone bother\
    \ learning a completely other computer environment when the OS that ships with\
    \ practically all servers, laptops, and desktops works perfectly? In lieu of a\
    \ response, the answer to that inquiry will be a question: are you satisfied with\
    \ the way your present operating system operates? Or do you have to deal with\
    \ license fees, expensive repairs, crashes, slowdowns, spyware, and viruses? If\
    \ you're having trouble with any of the following, Linux might be the right platform\
    \ for you. Linux is currently the most dependable computer ecosystem on the planet.\
    \ When you combine the entry's zero cost with reliability for a desktop platform,\
    \ you'll have a wonderful option. You can install Linux on as many computers as\
    \ you like because there is no charge for server licensing or software. Furthermore,\
    \ you will not be required to pay any fees in order to use Linux. Aside from that,\
    \ if you don't mind the zero-cost implications, how about having a stress-free,\
    \ stable operating system for as long as you want it? For more than two decades,\
    \ there hasn't been a widespread outbreak of viruses, malware, or ransomware among\
    \ Linux users, both on the server and on the desktop. The problem is that such\
    \ attacks have no effect on Linux. They are required for server reboots even if\
    \ only the kernel is upgraded. It's also not unheard of for a Linux server to\
    \ go years without being rebooted. When you stick to the recommended upgrades,\
    \ you'll have a lot of dependability and stability. Also, most of the desktop\
    \ operating systems we use are installed on our computers, and we rarely experiment\
    \ with changing the operating system. Plus, there's more. The majority of people\
    \ are not willing to learn a new operating system. Here are some of the reasons\
    \ why you should try Linux.\n\n## A host of different distributions\n\nThere are\
    \ a slew of different distributions to choose from. Different Linux distributions\
    \ or editions differ from one another. Some are intended for use on servers, while\
    \ others are intended for use on personal computers. While some are geared toward\
    \ novices, others are geared at more advanced users. Most Linux editions, also\
    \ known as distributions, are installed via a USB stick, an optical disk, or can\
    \ be downloaded for free. There are a plethora of Linux distributions to choose\
    \ from. Though `openSUSE` and `Debian` are popular alternatives, `Linux Mint`,\
    \ `Arch`, and `Fedora` are the most popular desktop distributions. `Ubuntu` becomes\
    \ one of the most current Linux distributions thanks to `Ubuntu Unity`. You may\
    \ achieve a more conventional Linux look with `KDE` thanks to the presence of\
    \ `openSUSE`. If you're looking for a list of server Linux operating systems,\
    \ it's also a large list. Some of the most well-known distributions include `CentOS`,\
    \ `SUSE Enterprise`, `Ubuntu Server`, and `Red Hat`. However, you may need to\
    \ spend some money if you want to use specific Linux server distributions, as\
    \ `Red Hat` license may be necessary. However, the support you receive in exchange\
    \ for your license fee is critical to your business.\n\n## Linux is synonymous\
    \ with liberty.\n\nThere is a need for an open source definition that is comparable\
    \ to Linux. Any software must adhere to a set of principles, such as:\n\n* Copies\
    \ of any of your changed software will be unrestricted.\n* There will be no restrictions\
    \ on software distribution.\n* You will have the ability to make any modifications\
    \ you need, inspect it, and study and deconstruct the software.\n* The complete\
    \ freedom to run the software, regardless of your intentions or motives for doing\
    \ so\n\nTo begin with, open-source software does not have a community, which is\
    \ something you should be aware of. This community is responsible for the development\
    \ of Linux, as well as its ongoing maintenance. As a result, if you're wondering\
    \ what Linux is and how it became popular, people created Linux as software for\
    \ the rest of the globe. It's all about the open source mentality.\n\n## Chapter\
    \ 2: Linux Distributions and Installation Methodologies\n\n![roman-synkevych-E-V6EMtGSUU-unsplash](Image00001.jpg)\n\
    \nIf you're looking for the finest Linux distributions, you might not get a clear\
    \ response because there are several numbers of Linux distributions, and calculating\
    \ an accurate number can be difficult. Some look to be one-of-a-kind, while others\
    \ are clones of one another. That is, after all, the beauty of Linux, even if\
    \ it is a shambles. However, you need not be concerned since, despite the fact\
    \ that there are thousands of Linux distributions available, you will discover\
    \ a list of the top ones below. We must categorize these distributions because\
    \ there is always something for everyone.\n\n### Linux distribution with a wide\
    \ range of applications\n\nSome Linux variants can be used for both servers and\
    \ desktops as an advanced/beginner-friendly OS. As a result, you will learn about\
    \ a different section of these distributions below:\n\n*   **Debian**: `Debian`\
    \ is an outstanding distribution that is based on `Ubuntu`. Not only does `Debian`\
    \ function well on the desktop, but it also works well on servers. Though you\
    \ can get started quickly by reading the official documentation, it may not be\
    \ the best operating system for beginners. The recent release of `Debian 10 Buster`\
    \ includes several required enhancements as well as various modifications. So\
    \ go ahead and give it a try!\n*   **Manjaro**: The source code for `Manjaro`\
    \ is provided by `Arch Linux`. Even though it is designed for sophisticated users,\
    \ `Manjaro` makes it very easy for newcomers to utilize `Arch Linux`. So don't\
    \ be concerned. This Linux distro is indeed simple and beginner-friendly. There\
    \ are a number of helpful GUI apps built-in, as well as a superb user interface.\
    \ There is an opportunity to choose a desktop environment while downloading `Manjaro`.\
    \ The `KDE` desktop is preferred by the majority of `Manjaro` users.\n*   **Fedora**:\
