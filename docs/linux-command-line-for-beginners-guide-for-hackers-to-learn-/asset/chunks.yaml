  trans: '

    首先，你需要从 VMware 网站下载最新版本的 VMware Workstation Player 程序。对于 `12.5` 版本，64 位版本大约为 `80
    MB`。VMware Workstation Player 作为评估版本，供家庭、个人和非商业用途免费使用。非营利组织和学生可以从免费版本中受益，这一事实足以让
    VMware 感到欣慰。在功能方面，VMware Workstation Player 的所有功能都包含在常规虚拟机任务中。另一方面，VMware 为各种规模的企业提供了广泛虚拟化解决方案。


    然后，在你下载完 VMware Workstation Player 后，是时候安装它了。当你从常规安装向导收到安装说明时，你将会有增强键盘驱动程序的选项。你还可以使用该功能提供的国际键盘。即使你认为自己可能不需要，但你也会意识到为了以防万一，安装它是值得的。在执行安装程序的过程中，请按照提示重启
    Windows。


    ## 你想要使用的 Linux 操作系统


    你可能对想要尝试的 Linux 类型很熟悉。虽然某些 Linux 发行版在虚拟机中运行效果并不理想，但另一些则可以。在 ARM 架构（如树莓派）上运行 Linux
    发行版在 VMware 中可能无法实现。因此，你可能无法通过 `x64` 或 `x86` 虚拟化 ARM。然而，现在是研究 `QEMU` 的时候了。


    ## 虚拟机配置


    你可以在下载 Linux  way 系统的同时开始配置你的虚拟机。当你开始运行 VMware Workstation Player 时，在提示时输入你的电子邮件地址。这部分完全是为了免费获取软件，加入
    VMware 邮件列表即可加入其中。完成这一步后，VMware Workstation Player 的主程序将启动。为了继续操作，你需要在虚拟机上创建一个账户。你将选择
    `ISO` 安装盘镜像文件作为默认。需要注意的是，如果你有一个空磁盘，可以以后创建虚拟系统并安装操作系统。安装好你所需的操作系统后，点击“下一步”。关于 VMware
    简易安装（Easy Install）的提示，你选择的客机操作系统将立即安装。


    ### 创建账户


    在下一个屏幕中，在你按下“下一步”按钮为虚拟机命名之前，你将输入密码、用户名和选定的名称。你可以为正在安装的操作系统指定位置（这通常是默认值），你也可以对虚拟机进行同样的操作。再次按下“下一步”按钮选择虚拟机的磁盘容量。保存的虚拟硬盘是计算机实际磁盘上的文件集或单个文件。你可以选择其中任一选项。同时，你可以更改或接受建议的
    `HDD` 大小。这种差异可能会非常明显，因为调大容量是一个更安全的替代方案。无论你选择什么，再次按下“下一步”按钮进入“准备好创建虚拟机”屏幕。点击“完成”按钮后虚拟机将启动。到此为止，在创建后运行你的虚拟计算机。你很快会收到关于
    VMware for Linux 工具包的建议，将通过警提示送。这对于完成简易安装过程可能并非必需。但一旦你接受了它，一切都会正常。


    ### 虚拟机硬件自定义


    “准备好开发...”的另一个屏幕选项是修改硬件。现在，除了 `HDD` 之外，你可能希望调整虚拟机的硬件。网络适配器配置、CPU 和内存只是你可以选择的几种可能性。你可能想查看处理器屏幕。在右侧面板中，你会看到虚拟化引擎的引用。默认情况下，此过程设置为
    `Automatic`。因此，你可能不需要担心 Linux 的任何问题。如果你遇到任何问题，可以将其更改为 `Intel VT-x` 或其他选项。然后在内存内存屏幕中，你可以解决特定的性能问题。你可能还会看到一个显示虚拟机建议
    `RAM` 大小的推荐最大值和最小值。请遵循这些建议，因为它们通常是最好的。当你将 `RAM` 设置得太高，从运行虚拟机软件到普通系统任务的一切都会变慢，如果你设置得太小，仍然会有麻烦。


    最后，你的显示设置需要一些关注。因为你可以更改 3D 加速，你可以选择在虚拟机中设置多个显示器或使用主机的显示器设置。与客操作系统的内存一样，将显示建议的数量，你也可以更改显存。


    安装 VMware Workstation Player 后，你就可以使用 Linux 了。


    虚拟机安装的操作系统在物理桌面工作站上启动 `ISO` 是常见的。你可以使用简易安装方法自动化整个过程，并可以使用你的 Windows 主机操作系统配置来设置客机虚拟机操作系统。这里这里很重要，因为如果你选择稍后安装操作系统，你对整个过程有完全控制权。之后，你就可以开始使用客操作系统了，因为安装完成后，你可以通过简易安装登录虚拟机。就是简单！之后，你可以从菜单启动虚拟机。


    ## 虚拟机的价值


    在 2005 年，硬件对于 Linux 来说是一次重大的体验。USB 设备、显卡、蓝牙甚至无线都给人们带来了问题。而且，为了让功能正常，每当引入新发明时，你可能都需要发现封装器和驱动程序。由于虚拟机看起来是不可行的，任何想要解决方案的
    Linux 用户必须与“真实”硬件接触。然而，现在发生了许多变化。Linux 上的部分硬件以意想不到的方式工作。重点已转向发行版的独特特性，而对硬件支持的关注减少了。


    ### 谁需要虚拟机？


    由于缺少特定的专用服务和软件，某些 Linux 用户被迫以两种方式启动。在许多国家，报税软件和各种政府工作仅在 Windows 上支持。与其经历双系统启动的痛苦和复杂，你可能只需使用虚拟机来运行
    Windows 软件。这时，虚拟计算机在玩游戏时可能无法工作。为了获得最佳的游戏体验，你可能需要与真实的 `RAM`、`GPU` 和 `CPU` 交互。由于硬件和应用程序之间的兼容性问题，你可能不喜欢虚拟层，视频音频编辑可能无法。除了这些以及额外的容量之外，虚拟机是非常棒的。


    '
- fmt: "\nA virtual machine may also be useful for persons who attempt to make a transition\
    \ as non-Linux users by converting to `Linux` or formatting the operating system\
    \ they were used to or playing with `Linux`. When they're ready, they'll have\
    \ the confidence to make the switch because virtual computers familiarize them\
    \ with `Linux`. As a result, `Linux` can run inside your `Windows 10` or `Mac\
    \ OS`. Above all, you can run various `Linux` distributions on virtual machines\
    \ to move between them without having to reboot on the same hardware. As a `Linux`\
    \ user, you will need to be familiar with various main distributions rather than\
    \ being completely reliant on anyone or being vendor-locked. And, instead of logging\
    \ out to alter the environment, you may use virtual machines to run different\
    \ desktop backdrops on the same system. You may not be aware of the operating\
    \ system that your customer or employer uses. As a result, you'll need some `Linux`\
    \ expertise in any case, because if you want to be a developer or a system administrator,\
    \ you don't want to know only one distribution. If you're a developer, you'll\
    \ need many distributions to test your applications.\n\n## Advantages of Virtual\
    \ Machines\n\nWorking with virtual machines has various advantages, as you can\
    \ see. Apart from multi-booting, operational virtualization provides other key\
    \ advantages, such as efficiency. It's a waste of time to switch between different\
    \ distributions and have hard drives formatted. So, it's as simple as opening\
    \ the current application, and you can start a new virtual machine for distribution\
