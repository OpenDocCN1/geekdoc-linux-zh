    ### 8 - Man in the middle attack


    We talked about this attack in more detail in the last guidebook, but it is still
    one that a lot of hackers like to work with and can ensure that you will be able
    to get things to work the way that you want as well.


    This kind of attack is going to be where the hacker is able to convince others
    that they belong on that particular network.


    Then, when one computer on that network is able to send out information, it is
    going to head straight to the hacker, rather than to the intended party.


    The hacker can either just look over this information, or change it up to suit
    their needs before sending it on to the intended recipient of that message.


    ### 9 - Computer hacking


    This is where the hacker is going to steal the ID of the computer and the password
    by applying the different methods of hacking and then getting some unauthorized
    access to that computer system as well.


    While there are some people who are going to be worried that all hackers are the
    same and that we need to be worried about the use of any kind of hacking, whether
    it is seen as ethical or unethical, there is actually a difference.


    And in the world of technology and more, we have a lot of use for the ethical
    hacker along the way.


    These individuals will allow us a chance to learn more about our networks and
    can do a lot to make sure that our data is going to be secure and that the hacker
    is not going to be able to get what they want.


    # Chapter 3: How to Download and Use the Kali Linux


    Now it is time for us to go through and make sure that we are able to download
    the Kali Linux.


    This will ensure that we are able to really get the most out of this system and
    that we will be able to use it in the manner that we would like.


    There are a few different methods that we are able to use in order to get the
    Kali Linux on our systems so that we are able to work with them.


    If you want to be able to go through and use this system to do some of your own
    hacks, it is important to install the Kali Linux system so that we are able to
    work with it in any manner that we want.


    There are two main options that we are able to work with here.


    We can choose to dual boot with Windows, or we are able to install it inside a
    window to work with virtualization.


    We also have to consider which version of Kali is the best for our needs.


    The Rumour Kali is going to be one of the best to help out with penetration testing.


    Linux distributions no matter which one is great for penetration testing, so you
    can definitely use the one that you are the most comfortable at the time.


    ## Doing a Dual Boot with Windows 10


    The first option that we are going to take a look at here to help us get the Linux
    system up and running is how we can do a dual boot with the help of Windows 10.


    There are a few steps that we are able to take in order to make this happen.


    First, we need to go through to the Kali Linux page and download the latest version
    ISO file.


    You can choose whether you would like to work with the 32 or 64-bit version of
    this based on which system you are working with.


    When you are done with the download, then we need to make sure that we can create
    a USB that is bootable.


    You will need to work with the `Rufus` program for this, which is simply a utility
    that is going to help you to create any of the USB flash drives that you want
    that are also bootable.


    You can find the main page for this program and then install it to use as well.


    When this is ready, it is time for us to go through the bootable USB that we need
    for this.


    First, connect in the USB drive.


    To make this work, you need to make sure that your memory pen drive is, at a minimum,
    4 GB to have enough room to make all of this happen.


    Now run `Rufus` and follow the steps that are given to help create this bootable
    USB that you would like.


    As you progress, you are going to get a screen that has a few options for you.


    The first one is to check that the USB drive that you would like to use has been
    selected.


    Then you can look a bit further down and click on the small CD drive icon that
    is below it.


    Then we need to make sure that we locate the ISO file for Kali Linux so that the
    file that you were able to download from the official website of Kali.


    When these are taken care of, it is time to click on the Start button and wait
    to complete the whole process.


    After this process has had time to complete, it is time to click the close button
    that will allow you a chance to exit from the `Rufus` program as well.


    And yes, you will then have the bootable USB drive that has the Kali Linux operating
    system found on it as well.


    Outside of using this to do a dual boot along with Windows, like we are planning
    to do here, it is possible to use this to do a live boot of Kali.


    This means that we are able to run Kali without having to install it.


    We just have to remember that this is going to provide us with some limitations
    on the functions and features that we are able to use.


    When we are all done with this part, it is time for us to create a separate partition
    for our Kali Linux installation.


    To do this, we just need to open up the settings on our Disk Management, or we
    can open up the command line in Windows and run the `diskmgmt.msc` command.


    When this is going, we will be able to create a new partition of the size of 15
    to 20 GB minimum by shrinking an existing volume.


    We spent some time here creating a new partition that is about the size of 17
    GB, and you should make yours similar to this as well.


    At this point, the initial processes that we want to work with are going to be
    all done.


    The downloaded Kali Linux ISO is done, you created a bootable USB drive, and then
    we went through and created our own partition for the installation of the Kali
    Linux system.


    Before we go on here, we need to always Disable Secure Boot and the Fast Boot
    options that are available when we work on our BIOS.


    This is where we are going to restart the device that we are using and then end
    up in the boot manager.


    This place is going to allow us the option of Boot as USB.


    Keep in mind that the naming of this is going to be different based on the brand
    of computer you are using.


    At this point, you are going to see that the installation window of Kali is going
    to be there.


    There should be a few different options that are there for us to install Kali
    Linux.


    Here we are going to work with the Graphical Install because it makes the installation
    a bit easier.


    There will be a few housekeeping steps that you are able to work with here in
    order to make sure it is all organized and will work the way that you want.


    For example, you can work with the language that you can use, choose the country
    you are in, pick out the keyboard layout and the IP configurations and whether
    you do it manually and automatically, and you can even go through and pick out
    the Hostname that you would like to use, which is going to be similar to the username
    that you have with other accounts.


    Then we will move on to enter the password that we want to use with the root user.

