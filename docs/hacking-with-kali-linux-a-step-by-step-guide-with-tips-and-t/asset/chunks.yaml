    黑客最可能会选择那种看起来最简单的方法，同时既能让他们进入网络，又能躲避你及其他使用该网络的人员。


    这是你首先需要去的地方，需要增加更多的保护，以便黑客无法进入。这不是一件你做一次就可以一劳永逸的事情。你需要定期进行这些扫描，以获得你想要的结果。


    随着你对网络的使用增加，你向其中添加的内容越来越多，甚至随着时间的推移使用它的人也越来越多，你向世界发送的信息可能会发生变化，而黑客将一直关注这一点。定期进行此类扫描将对你如何保护系统以及将那些不属于那里的黑客挡在之外产生巨大影响。


    # 第 6 章：如何创建你的键盘记录器


    在本指南中，我们已经提到过几次键盘记录器（keylogger）的理念。现在是时候进一步学习一下我们如何为自己创建一个这样的工具了。


    我们将重点关注 `Kali Linux` 操作系统和 `Python` 代码来帮助我们完成任务。这是因为，虽然有很多有很多优秀的编程语言可以满足你的某些需求，但
    `Python` 将是我们最容易学习如何使用的语言之一，即使对于这个基础过程，它也会非常简单。


    一旦我们开始编写一些帮助我们创建键盘记录器的代码，你很快就会发现 `Python` 语言对初学者来说是多么简单，以及为什么在处理这个过程时，它通常是首选方案。或者在处理过程中你想处理的任何其他黑客任务也是如此。因此，我们将学习并学习创建的第一种黑客技术之一就是键盘记录器。


    ## 键盘记录器的处


    使用键盘记录器有很多益处，许多理由让你想将这个键盘记录器安装到你的电脑上，甚至安装到另一台电脑上。


    如果你选择将其安装在你正在使用的电脑上，很可能是你这样做是为了帮助你学习如何进行黑客攻击，或者你想让它留在那里，查看别人在借用你的电脑时在做什么。例如，如果你把电脑借给别人，或者你有一个孩子偶尔会使用电脑，那么在系统中添加此键盘记录器将允许你日后进行回溯并跟踪情况，查看系统上显示了什么等。这只是我们为了确保系统尽可能安全可靠而可以采取的另一个步骤，即使它不在你手手中也是如此。


    另一方面，黑帽黑客（black hat hackers）通常会使用这些键盘记录器，以便进入目标系统并收集他们想要的信息。这实际上是黑客用来获取他们所需的所有价值信息的一种常用方法。这包括关于目标将访问哪些网站的信息、他们登录该网站时使用的用户名和密码等。


    ## 键盘记录器的工作原理


    当键盘记录器被放在目标电脑上时，黑客能够收集到目标在那台电脑上按下的所有键。这看起来可能对黑客来说操作太简单太容易了，但这正是他们也想使用这个选项的原因。许多黑客面临的一个常见问题是开始时使用一种困难的方法来收集他们需要的东西，但这在过程中浪费了大量时间，而且尝试字典攻击（dictionary
    attack）或暴力破解（brute force attack）在很多情况下可能很难处理。如果我们能够找到最简单的方法来操作，同时在过程中获取所需的信息，要好得多。


    当黑客能够将键盘记录器附加到他们想要的电脑上时（无论你是在自己的个人电脑上操作，还是在目标电脑上操作），你会发现它允许你有收集计算机当时进行的所有按键的选项。从长远来看，这可以为你提供大量信息，因为你将获得目标输入到文档、电子邮件和搜索中的所有信息。


    ## 提高效率


    然而，如果你长期坚持这样做，你会发现你获得的数据中将会出现一些模式。例如，你可能会注意到，信息中会定期出现某些模式，或者会有一些词是成对出现的。当这种情况发生时，说明密码和用户名在那个时候正被使用。


    现在，我们在这里只关注键盘记录器，但你会发现单独使用它虽然可行，但通常不被视为完成所有这些工作最高效的方法。它可以为你提供大量信息，但你确实需要去查看并弄清楚单词和字母的含义，以及它们何时成为你可以使用的价值内容。除非你发现目标花所有时间只登录某一个账户，否则你可能需要一些时间来学习哪些按键是有意义的。


    我们以后查看一些可以添加到键盘记录器上的功能，以确保它在这个过程中尽可能高效。例如，我们可以对出现的短语添加一些时间戳（timestamps）。这有助于我们看到事情是否在同一时间发生的，或者至少靠得很近。如果你从这里发现某些词在同一时间输入，这可以告诉我们这些是邮箱或其他账户的用户名和密码。这只是你能够获取更多信息的方法之一。


    但请记住，即使有了时间戳，它仍然会将一些事情交给运气，并且可能花费很长时间。这就是为什么许多黑客还会使用截图保存器（screenshot saver）。我们将在下一章中详细查看这一功能，以便我们为自己的需求创建一个。这是一个很好的补充，因为它不仅向你发送关于黑客将点击的按键的信息，还能帮助你获取配合信息所需的截图。这让你更容易判断发生了什么。


    例如，如果你看到在上午 `10:02`，目标电脑进入了银行网站，你就可以回到按键记录并查找 `10:02` 的时间戳查看出现了哪些词。很可能在那个时间用户名和密码被写了出来，现在黑客拥有了他们所需的信息。


    ## 结论


    这种情况的好消息是，很多人根本不会制作强密码。他们这样设置是为了不需要任何努力就能记住密码，而且密码通常是短的、易记的单词，或者与个人相关的。。这对他们来说是一件坏事，但对于你尝试进入系统来说是一件好事。另一方面，你会发现当需要维护网络安全时，这对你来说是非常好的。你会知道保护信息的最佳方法是检查并更改密码，使其尽可能强大且难以被猜测。并定期更改。


