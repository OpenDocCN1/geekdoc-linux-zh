    当你准备好学习黑客攻击时，这可能是一个令人恐惧的过程，有时整体上也可能变得难以攻克。但当我们引入 `Kali Linux` 系统时，我们会发现处理我们整体想要进行的黑客攻击会变得要容易得多。


    当你准备好为你的需求实现这一切时，请务必查看这本指南以帮助你入门。


    市上有许多关于这个主题的书籍，再次感谢你选择这一本！我们已尽一切努力确保它包含尽可能有用的信息；请尽情享受！


    # 第 1 章：使用 Kali Linux 系统进行黑客攻击的优势


    ![](img/00001.jpeg)


    当你准备好跳入黑客攻击的世界以及利用它能做的一切事情时，花时间选择一个合适的操作系统来完成我们需求中的这些工作也是同样重要的。


    市面上所有的操作系统都是很棒的，并且可以为你提供一些很棒的益处。但现在，我们将花一些时间探索 `Kali Linux`  way 系统的优势，以及为什么我们想要使用这个选项，特别是在涉及黑客攻击时。


    不过，在我们深入研究黑客攻击之前，我们需要花时间了解一下 `Kali Linux` 系统到底是什么。


    这是 `Linux` 的发行版之一（有好几个），旨在用于高级渗透测试甚至安全审计。


    `Kali` 实际上附带了大量的工具，这些工具将针对各种信息安全任务，包括我们谈过的那些选项。


    `Kali Linux` 由 `Offensive Security` 开发、资助并维护，该公司是公认为的信息安全培训领域的领先公司。


    它最初于 2013 年 3 月发布，是对 `BackTrack Linux` 所发现的内容进行的完整、从底到顶重构。这意味着它将完全遵循过去的一些开发标准。


    这意味着你将拥有你正在寻找的安全功能，以及你想要的所有工具和标准。


    `Kali` 系统将包含很多部分，这使其成为协作的完美选择。


    首先，你会发现 `Kali` 附带了超过 600 种帮助渗透测试的工具。在花时间审查了 `BackTrack` 选项自带的所有工具后，`Kali` 能够消除许多无法工作或能够某些其他工具提供的重复功能的工具。如果它们相似，那么也会被移除。


    此外，`Kali` 系统将是免费的，而且计划是保持下去。`Kali` 与 `Linux` 发行版提供的许多其他选项一样，是免费使用的，并将保持现状。你不需要为使用它而付费，这让你更容易开始你想要进行的某些黑客攻击训练，而不需要仅仅为了开始就花费大量的资金。


    你也会喜欢开源的 `Git` 树。这意味着 `Kali` 将采用开源的开发模式，且开发树将供任何人使用。你决定在 `Kali Linux` 中编写的所有源代码均供任何人使用，你甚至可以对其进行调整或重新构建某些包，以帮助它符合你的特定需求。


    如果你已经在黑客攻击和编程领域工作了一段时间，你会高兴地获知 `Kali` 被认为是符合 `FHS 标准`的。这意味着 `Kali` 将遵循所谓的“文件系统层次结构标准”（`Filesystem
    Hierarchy Standard`）。这将允许 `Linux` 用户在需要时更轻松地定位二进制文件、库文件和支持文件。


    你能够在这个操作系统上使用的另一个益处是，它将带有广泛的无线设备支持。这实际上是这些 `Linux` 发行版的一个强大卖点，即它将支持无线接口的使用。该操作系统被设定为支持尽可能多的无线设备，使其能够在许多硬件上良好运行，并确保它与许多无线和
    USB 设备兼容。


    还有一个可以进行注入（injection）补丁的自定义内核。作为渗透测试人员，你合作的开发团队需要花时间对无线网络进行评估。这就是为什么你在 `Kali Linux`
    中使用的内核将包含最新的的注入补丁。


    我们还将看到，整个过程将在一个尽可能安全的环境中开发。与 `Kali` 工作的团队将由一小部分人员组成，他们是整个团队中唯一被信任提交包并与存储库交互的人。而这一切将在许多不同的安全协议的帮助下完成。


    作为一名程序员，你也会喜欢这种编程语言带有大量的语言支持，它能够处理你喜欢的几乎任何编码语言。虽然你想要操作的大多数渗透工具将用英语编写，但 `Kali`
    实际上被设定为提供其他语言的支持。这意味着更多用户可以在母语的帮助下完成这些任务并操作，同时找到完成工作所需的工具。


    最后，我们还可以查看 `Kali Linux` 系统如何针对你想要的工作进行完全定制。这是一个非常棒的操作系统，因为我们可以对设计进行修改，并确保操作系统以你要求的方式运行。这些只是我们在处理这类黑客攻击时感兴趣的一些选项。它可能不是市面上最好的操作系统，也可能是人们起初就担心使用的系统。但它包含了我们开始黑客攻击所需的大许多功能和更多，而且这会让整体生活变得更容易。


    在我们阅读这本指南的过程中，你将更好地了解它的运作方式，以及我们应该采取的步骤，以确保你在进行黑客攻击时能充分利用 `Kali` 系统的优势。


    ## 为什么黑客喜欢使用 Kali？


    在深入研究我们可以进行的某些特定黑客攻击之前，我们需要探索的下一个问题是为什么 `Kali` 是许多黑客喜欢使用的东西。市面上绝对有很多其他我们可以使用的操作系统，那么为什么黑客会在黑客攻击的需求中想要使用
    `Kali`，而不是其他任何操作系统呢？


    我们在上一部分已经花了一点时间研究使用 `Kali` 的优势，但让我们深入探讨这些以及其他一些选项，以真正了解为什么 `Kali` 是黑客攻击时最好的 `Linux`
    发行版之一，也是最好的操作系统之一：


    1. 它是开源的：在现代世界，如果你正在开发软件并需要某些知识或对操作系统代码进行修改，你会发现 `Linux` 是一个很好的选择。该操作系统的源代码可以根据你的需求进行修改，而无需担心版权或任何其他问题。


