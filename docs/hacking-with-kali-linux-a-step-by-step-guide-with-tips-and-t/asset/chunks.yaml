    up some of the other work that you would like to do, without any issues or slow
    down.


    6.  The command-line interface can make the work easier:


    The operating system of Linux is going to be designed specifically around a strong
    and highly integrated command-line interface, which is something that Windows
    and Mac operating systems are not going to have.


    This is going to make it very easy for hackers and even other users of Linux to
    have more access and control over the system that they are using as well.


    7.  The operating system is lighter and more portable than before:


    As a hacker, you will be able to create a boot disk that is live and customizable
    from any distribution of Linux that you would like.


    The installation process is going to be simple and will consume fewer resources
    than before. And because this operating system is going to be light-weight, which
    allows it to consume fewer resources than before.


    8.  The maintenance:


    You will find that keeping up on maintaining this operating system is going to
    be easy.


    All of the software that you want to work with will be easy to install. And every
    variant of Linux is going to have its own repository of the software that is central
    and will make it easier for a user to search around for the software that they
    would like to use as well.


    9.  Lots of flexibility:


    The biggest feature that we are going to see when working on the Linux system
    is that it is able to work with a ton of different things, which adds to the flexibility
    that we are going to see.


    For example, you will find that it can be used for things like high-performance
    server applications, embedded systems, and desktop applications.


    10.  It has fewer vulnerabilities than other options:


    Today, almost all of the operating systems, outside of the distributions of Linux,
    will have a lot of vulnerabilities that other hackers are able to go after.


    But for now, at least, Linux is considered one of the most secure operating systems,
    and it has fewer vulnerabilities than we will find with some of the other options
    out there.


    This is important when it comes to helping us to handle our secure data and ensuring
    that we will not have a hacker attack our system, at least not easily.


    11.  It can support many languages of coding so you can find the one that works
    the best for you:


    Linux is going to be able to support a lot of the most well-known programming
    languages that are available.


    It is able to help out with some of the options like Perl, Python, Ruby, PHP,
    Java, and C and C++. Linux is going to make the process of scripting in any of
    these languages as simple and as effective as possible.


    12.  Most of the good hacking tools that you want to use will be written for Linux:


    Some of the most common hacking tools, including Nmap and Metasploit, are going
    to be ported to work with Windows.


    However, not all of the capabilities that are in these will be able to transfer
    over to Linux. Linux is going to come with some better tools while helping the
    memory to be managed in a much better method.


    13.  It uses a lot less RAM than other operating systems.


    As we mentioned a bit before, Linux is going to be light, and it will not require
    as much disk space.


    Because of these features, we will find that it is going to consume less RAM and
    will not need as much processing utility.


    So, it can be easy to install along with some of the other operating systems that
    are out there.


    This allows you to use one operating system for hacking, and then another one
    for some of the other tasks that you would like to use.


    14.  Ease of use:


    The final benefit that we are going to explore, and one of the biggest reasons
    that hackers like to work with Linux over some of the other options out there,
    is that it is really easy to work with and learn how to use.


    There are myths out there that say how difficult it is to learn Linux and make
    this process work for our needs. But this is completely wrong.


    If you have just a bit of time to learn more about Linux and all that it can provide,
    and you get some time to experiment with it, you will quickly see that this is
    a simple operating system to work with, and it can serve you well.


    As you can see here, there are a lot of reasons why hackers are going to want
    to work with Linux, especially when it comes to the Kali distribution of Linux,
    to help them with some of the programming and hacking that they would like to
    accomplish.


    And this is just the start.


    When you start getting into some of the hacking and coding that you would like
    to do, you will quickly find some of your own reasons to fall in love with Kali
    Linux, and it will not take long to figure out why this is one of the best coding
    languages to use in order to get the most out of your coding and hacking needs.


    # Chapter 2: Getting Started with Hacking


    ![](images/00002.jpeg)


    Now that we have had a bit of time to take a look at Kali Linux and some of the
    reasons why a hacker is going to choose to work with this operating system, rather
    than a Windows or Mac operating system, for some of their hacking needs, it is
    time to move on to some of the things that we need to know about hacking.


    And in particular, we are going to look more at the specifics of ethical hacking
    compared to black hat hacking or unethical hacking.


    Before we dive into that, let’s take a quick look at what the black hat hacking
    is all about.


    These individuals are going to be the individuals that we usually think about
    when it comes to the world of hacking.


    They have malicious intentions when they get started with the hacking that they
    do, and they hope to harm others in the process.


    They will try to run a business, steal information, and make money in the process.


    There are a lot of methods that they are able to put to use in order to make this
    kind of hacking work, but the ultimate goal for them is to try and benefit themselves
    while causing harm to others.


    But then there is an ethical hacker.


    These are the individuals who are not going to do this in order to cause harm
    to others.


    They may work for a company and try to prevent hackers from reaching the network
    of a big corporation, or they may choose to do these techniques in order to protect
    their own network.


    But they use the same methods in order to make sure that a black hat hacker is
    not able to get onto their network, and they have permission to be on the network
    in question, unlike the black hat hacker.'
