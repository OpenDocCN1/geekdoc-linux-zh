    # Chapter 9: How to Crack Through a Password and Create Our Own Password Cracker


    Another thing that we are able to consider working with is how to crack a password.


    In our previous book, we spent some time talking about how important the password
    is and how this is often the first line of defense that we are going to have when
    it comes to one of the hackers who are trying to get onto our network.


    If we pick out a password that is too simple and to easy to work with, then we
    are going to end up with some trouble along the way as well.


    But if we pick out a password that is unique and complicated, then it is a lot
    harder for the hacker to get onto the network when they want.


    The password attack is often going to be one of the first attacks a hacker is
    going to try use against you.


    If the hacker has the opportunity to get ahold of some of your passwords, then
    this is going to make it so much easier for them to gather up the information
    that they want out of the system.


    Passwords and other confidential information that is similar is going to be some
    of the weakest parts of the security on your network because they rely on a lot
    of secrecy to make them work and be successful.


    If you tell someone information about the password, leave the password somewhere
