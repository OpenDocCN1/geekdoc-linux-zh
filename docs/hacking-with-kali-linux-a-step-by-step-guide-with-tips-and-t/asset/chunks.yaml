- fmt: '

    Whether you are a black hat or a white hat hacker, though, you will find that
    the methods are going to be the same.


    The biggest difference that we are going to notice between both of these types
    of hackers will be whether you plan to do the attack and take over in order to
    get some personal gains, or you are doing it in order to help protect a system
    and make sure that the wrong parties are not able to get on it at all.


    The choice is going to be yours in this matter, but remember that black hat hacking
    is seen as illegal and that we are going to remember that we will talk just about
    the white hat hacking that we are able to work with on these techniques.


    ## What Counts as Ethical Hacking?


    Now, we need to make sure that the work that we are doing will count as ethical
    hacking.


    Remember that both the black hat hacking and the ethical hacking are going to
    be really similar, and they are going to use the same options when it comes to
    the techniques and the steps in order to get it all done.


    This is why there have to be a few rules in place in order to make sure that the
    work that we are doing is going to be considered ethical hacking, rather than
    black hat hacking.


    For the most part, the main difference between both of these is the motivation
    behind the actions that they take.


    The black hat hacker is going to be motivated by power and money and advancing
    their own personal needs.


    The white hat hacker, or the ethical hacker, is going to be motivated to protect
    their own information and data, or the information and data of a company they
    work for.


    So, how do we make sure that the hacking we do is considered ethical or not.


    For hacking to fit under the idea of being ethical, the hacker has a few rules
    to follow.


    These will include:


    1. There needs to be some expressed permission in order to get onto the network.

    Often this is going to be done in writing to ensure that both parties are on the
    same page. You can outline all of the permissions that you are given, and what
    the company would like you to stay away from. This permission will allow you to
    probe through the network and find some of the security risks that could potentially
    cause an issue. If this is your own network that you are working with, you do
    not need this permission in writing, of course.


    2. You will make sure that when you are on the network of another person or another
    company that you will respect the privacy of them. You will keep the vulnerabilities
    that you find to yourself and only share those with the company or individual.
    You will not post information about that network for others to see.


    3. When you are done with some of the work that you would like to do on this attack,
    you will close out the work that you did. Make sure that you do not leave behind
    anything or have anything open for you or someone else to come in and exploit
    later on.


    4. You will let the software developer or the manufacturer of the hardware that
    you worked with know when you find the vulnerabilities of the network during the
    search. This is especially important to protect yourself and others when these
    vulnerabilities are not things that the company already knows about.


    When you are done with doing this kind of process and the penetration test, and
    the other work that you are trying to do with this process, you will then want
    to spend some time sharing the information with those who own the network. Let
    them know where the vulnerabilities are in the system, and then explore some of
    the options that you or they are able to follow in order to reduce or even get
    rid of those vulnerabilities are not able to get ahold of your information through
    them.


    The term of an ethical hacker is something that has received some criticism over
    time. This is because there are those who do not believe that there is something
    like an ethical hacker at all. They also believe that hacking is going to be hacking,
    regardless of who is doing the work and the motivation that comes behind it.


    However, you will find that the work that we see with these ethical hackers is
    going to be so important. They have helped us to improve system security for many
    companies, and they are effective and successful at the work that they are doing.
    Those who are interested in becoming this kind of hacker have to follow some stringent
    rules and regulations in order to maintain that, and many of them are going to
    become a `CEH` or `Certified Ethical Hacker`, before getting started.


    ## The Types of Hacking


    Now that we know a bit more about an ethical hacker, it is time for us to know
    a bit more about the options that come up when it is time to begin the methods
    that we want with hacking. There are a few different types that we are able to
    explore based on what the hacker is hoping to achieve in the process.


    Some of the different types of hacking that we are able to work with will include:


    * 1 - Website hacking:

    When a hacker is able to hack into a website, it means that they are able to take
    control, without authority, over a web server, and any of the software that is
    associated with it, including databases and any other interfaces that come with
    it.


    * 2 - Network hacking:

    When the hacker is able to hack into a network, it means that they are going to
    gather up information about the network with tools like `Netstat`, `Tracert`,
    and more. The intent with this one is going to harm the network system and will
    hamper some of the operations that are used here.


    * 3 - Email hacking:

    This one is going to include gaining some unauthorized access to an email account
    and then use it without any consent out of the owner to send out threats, links,
    and other activities that are seen as harmful. We always need to make sure that
    we are careful about the kinds of emails that we are opening or looking through.
    There are always a lot of hackers who will send their viruses and other things
    through emails, often with some bad links or a fake bank page, so that you will
    hopefully give away some of the information that the hacker is looking for. It
    is important to be careful about anything that you open on an email because you
    never know when it is going to be a hacker just trying to take your information.


    * 4 - Malware and viruses:

    Most of us are familiar with hacking and malware, but we always need to be on
    the lookout for this one. You will find that hackers are going to really take
    the time to expand out the information that they have and will try to make new
    malware and viruses that will get the information that we want to keep safe. Whether
    you click on a link that is not good or you went over to a website that ended
    up with a virus on it, you need to make sure that you have a good anti-virus in
    place to keep all of your information safe and sound along the way.


    * 5 - Password hacking:

    This is going to be the process of recovering passwords that are secret from data
    that has been stored in or transmitted by the system that we are using. There
    are a lot of different ways that a hacker is able to get ahold of your password,
    especially if you are not careful about making the passwords strong and ensuring
    that they are harder for the hacker to guess. Remember that in many cases, these
    passwords are going to be the only line of defense between you and the hacker,
    so making them strong and secure is going to be a must here.


    * 6 - Screenshots:

    Another thing that we are going to look at throughout this guidebook is how to
    handle a key logger. This is going to be one of the techniques that the hacker
    can use in order to gather up a lot of personal information about you in no time
    at all. This will make it so that the hacker can install a little program on your
    computer and then will record the keystrokes that you are able to do on your own
    computer.

