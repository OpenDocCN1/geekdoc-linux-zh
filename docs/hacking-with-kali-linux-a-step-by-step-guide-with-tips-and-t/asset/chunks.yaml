  trans: '

    除了学习一些 Kali Linux 以及我们在在该操作系统上进行黑客操作时能做的各种酷技巧之外，我们还花时间学习如何进行对我们需求至关重要的不同类型的攻击攻击。


    你将学习更多关于道德黑客的基础知识、如何进行中间人攻击以及许多其他内容。


    即使作为一名道德黑客，在进行黑客攻击时也能做很多酷酷的事情，这些技术可以用来检查你的网络是否能够保持安全，或者你是否需要担心有人未经许可进入你的网络。


    我们甚至会使用键盘记录器和截图工具，这样你就可以看到别人在借用你的电脑时在做什么。


    多年来，黑客行为的声誉变得很糟糕，但这并不意味着它是一件坏事。学习如何使用这些工具并让它们按照你的方式运行将非常重要，而学习黑客攻击可以是保持你自己的系统安全无虞的最佳方法之一。


    通过本指南中包含的一些技术，你将能够让你的网络变得安全可靠。当你准备好学习更多关于黑客攻击以及通过这一过程总体能做什么时，请务必查阅本指南，获取你在该领域取得成功所需的各种工具、技术和方法。


    最后，如果你觉得这本书在任何方面都有帮助，我们将非常感谢你在 Amazon 上给出评价！

    '
