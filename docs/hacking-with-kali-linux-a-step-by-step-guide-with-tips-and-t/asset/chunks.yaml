    它包含了许多我们希望在 Linux 中使用的功能，如果你使用的是该操作系统的旧版本发行版，那么这个版本可能就是你最熟悉的版本。


    另一方面，如果你刚刚完成了将 Kali 添加到系统中的过程，那么这个版本会稍微新一些。


    两者之间会有很多相似之处，但也有一些不同的功能，请同时也记住这一点。


    在考虑了这些信息后，你可能很兴奋能更多地了解 Kali 以及我们在黑客攻击方面能用它做些什么。


    现在是时候进入正题，学习如何使用 Kali、终端是如何运作的，甚至学习在这个操作系统中编写我们自己的命令了。


    ## 启动系统


    我们对此操作需要的第一件事就是启动操作系统。


    你将登录并成为 root 用户。


    这基本上意味着，如果你在使用自己的电脑，那么你将是该系统中的主计算机。


    然后，你需要输入 `bt > startx`。


    之后你就可以打开那里的终端之一了。


    你需要在终端上花一些时间学习更多关于它的知识，因为当我们开始黑客攻击和学习 Linux 时，我们将花费大量时间在这里。


    这个终端能够让我们处理许多不同的事情，而且与我们在 Windows 和 Mac 中看到的某些东西会有相似之处。


    但它也有一些不同之处，所以花时间尝试一下，看看我们如何真正与它协作并获得我们想要的结果。


    ## 打开终端


    接下来的我们需要查看的是如何打开终端来操作 Kali Linux。


    当你点击此部分的图标时，就可以实现这一点，该图标位于屏幕底部的栏上。


    当你点击这个图标时，你会看到一个黑色屏幕和一个闪烁的光标光标。


    此时，我们还有几个选项可以做决定。


    如果你曾经用过 Windows 自带的命令提示符，你会发现 Linux 中显示的终端非常相似，并且包含许多相同的部分。


    在考虑这一点时，请记住，Linux 终端提供的功能比你在那里找到的强大得多，我们将用它执行许多不同的任务。


    你应该在这个终端中执行所有你想要进行的黑客攻击相关的命令和工作，因为这将有助于增加你所追求的强大功能和易用性。


    在使用它时，我们需要记住的一点是，它是**区分大小写**的。


    与 Windows 等其他操作系统不同，Linux 在命名等操作中会区分你使用的是小写字母还是大写字母。


    例如，在 Windows 中工作时，输入 `Paperclip`、`paperclip` 或 `PaperClip` 都被视为不同的东西。


    这是一个细微的问题，但当你以后想要对代码进行某些更改或查找某些内容时，它会产生影响。


    ## 查看 Kali 目录结构


    现在我们已经能够进入并打开终端，我们可以花时间更深入地检查它，并学习关于此终端及其配套目录的一些基础知识。


    作为初学者，你可能会遇到一些情况，然后会被 Linux 的目录结构让你感到困惑。


    与我们可能习惯的 Windows 和 Mac 不同，Linux 操作系统不会链接回物理驱动器。


    你不需要在开始工作之前处理 `C:\`，相反，我们需要使用 `/` 符号。


    这个正斜非常重要，因为它向我们展示了我们正在操作的文件系统的根目录（root）。


    根目录是文件系统的顶层。


    所有其他目录和文件夹都位于根目录下。


    将这个根目录想象成主文件夹，然后我们将使用的其他文件夹将放入其中，就像我们在 Windows 中使用的某些文件和文件夹一样。


    如果可以的话，花点时间看看我们如何设计这些不同的目录，或者浏览系统看看你是否能找到其中一些。


    在开始黑客攻击之前，至少掌握一些关于该系统的基础知识总是个主意，因为有时你可能希望直接在终端中导航，而不需要我们引入另一个图形化工具。


    当我们位于 Kali 目录时，我们还可以处理其他一些事情。


    在使用此随带的图形化表示时，我们需要探索和理解的一些内容包括：


    *   `/bin`——这是存储所有二进制文件的目录。这些是帮助 Linux 运行的程序。

    *   `/etc`——这通常是存储配置文件的地方。在操作 Linux 时，你几乎所有保存为文本文件的内容都会被配置并存储在 `/etc` 路径下。

    *   `/dev`——这是存放所有设备文件的目录，类似于你在 Windows 设备驱动程序中找到的内容。

    *   `/var`——这通常是你找到日志文件以及其他文件的地方。


    ## 使用 pwd 命令


    现在，我们需要花点时间看一些可供我们使用的命令。


    Linux 系统中有很多种可以供我们运行的命令，但我们将花一些时间查看最常用的命令。


    在操作 Linux 时，我们需要关注的第一个命令包括 `pwd` 命令。


    当你决定打开那个终端窗口时，你会发现自己处于默认目录中，它也被称为主目录（home directory）。


    如果你想确认这一点，或者在过程中的随时双检查你处于哪个目录，你只需要输入 `bt > pwd`。


    当你准备好后，这将在屏幕上显示当前目录。


    为了简单起见，`pwd` 就代表当前工作目录，或者你现在正在工作的目录。


    如果你现在位于主终端，你将得到 `/root` 的返回。


    如果这显示在你的屏幕上，说明我们处于 root 用户的目录内部。


    ## 使用 cd 命令


    不过，我们之前谈到的 `pwd` 命令并不是我们需要关注的唯一命令。


    当我们进入实际的黑客攻击部分时，会有很多其他重要的命令。


    但在开始阶段，当我们学习更多关于 Kali Linux 系统以及我们能用它做些什么时，花时间查看 `cd` 命令也是同样重要的。


    当你处于想要操作的终端时，可以使用几个命令来更改你当前所处的目录。


    当你使用这些命令时，它可以帮助你在想要使用的几个目录之间来回，而无需进行大量的搜索，或者感到困惑并迷失自己在哪里。

