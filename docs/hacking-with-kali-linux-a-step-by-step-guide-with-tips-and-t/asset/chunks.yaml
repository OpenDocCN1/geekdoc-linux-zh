- fmt: '

    When you are ready to learn about hacking, it can be a scary process, one that
    is sometimes difficult to work through overall as well. But when we add in the
    `Kali Linux` system, we will find that it is much easier for us to handle the
    hacking that we would like to work with overall.


    When you are ready to make this happen for your needs, make sure to check out
    this guidebook to help you get started.


    There are plenty of books on this subject on the market, thanks again for choosing
    this one! Every effort was made to ensure it is full of as much useful information
    as possible; please enjoy it!


    # Chapter 1: The Benefits of Working with the Kali Linux System with Hacking


    ![](images/00001.jpeg)


    When you are ready to jump into the world of hacking and all that you are able
    to do with it, it is also important that we spend some time picking out the right
    operating system to get all of this work done for our needs.


    All of the operating systems out there are going to be great and can offer you
    some great benefits as well. But we are going to spend some time now exploring
    the benefits of the `Kali Linux` operating system and why we would want to work
    with this option, especially when it comes to hacking.


    Before we get into hacking too much, though, we need to spend some time looking
    at what the `Kali Linux` system is all about.


    This is going to be one of the distributions of `Linux` (there are a few of these),
    that is aimed at advanced penetration testing and even security auditing.


    There are actually a ton of tools that come with `Kali` that are going to be geared
    towards various information security tasks including the options that we talked
    about.


    `Kali Linux` is developed, funded, and then maintained by the `Offensive Security`,
    which is known to be a leading company for information security training.


    It was originally released in March of 2013 as a complete, top to the bottom rebuild
    of what was found with the `BackTrack Linux`. This means that this is going to
    completely adhere to some of the development standards of the past.


    This means that you will have the security features that you are looking for and
    all of the tools and standards that you would like.


    There are a lot of parts that are going to come with the `Kali` system, which
    makes it the perfect option to work with.


    First off, you will find that `Kali` is going to come with more than 600 tools
    that help out with penetration testing. After you spend your time reviewing all
    of the tools that came with the `BackTrack` option, `Kali` was able to eliminate
    a lot o the tools that did not work or were able to duplicate what some of the
    other tools provided. If they were similar, then they were taken out as well.


    In addition, the `Kali` system is going to be free, and the plan is to keep it
    that way. `Kali`, like a lot of the other options that come with the `Linux` distribution,
    is free to use and will remain that way. You will not have to pay for the use
    of this, which makes it easier to get started with some of the training that you
    would like to do with hacking, without having to pay a lot of money just to get
    started.


    You will also enjoy the open-source `Git` tree. This means that `Kali` is going
    to be an open-source model of development, and the development tree is going to
    be available for anyone to work with. All of the source code that you decide to
    write out in `Kali Linux` is available for anyone to use, and you are even able
    to tweak it or rebuild some of the packages in order to help get it to work with
    the specific needs that you have.


    If you have been in hacking and programming for some time, you will be happy to
    know that `Kali` is considered `FHS compliant`. This means that `Kali` is going
    to follow what is known as the `Filesystem Hierarchy Standard`. This is going
    to allow the users of `Linux` is more easily locate binaries, libraries, and support
    files when you need them.


    Another benefit that you will be able to use with this operating system is that
    it is going to come with wide-ranging wireless device support. This is actually
    one of the strong sticking points that comes with these distributions of `Linux`,
    which is the fact that it is going to be supported for the use with interfaces
    that are wireless. This operating system has been set up to support as many of
    the wireless devices as it can, allowing it to work well on a lot of hardware
    and ensuring that it is going to be compatible with a lot of wireless and USB
    devices.


    There is also a custom kernel that can be patched for injection. As penetration
    testers, the development team that you are working with will need to spend some
    time doing assessments on a wireless network. This is why the kernels that you
    are using with `Kali Linux` are going to include the latest in the injection patches
    included in it.


    We will also see that this whole process is going to be developed in an environment
    that is as secure as possible. The team that is going to work with `Kali` will
    be made up of a small group of people who are going to be the only ones on the
    whole team that is trusted to commit the packages and then interacts with the
    repositories. And all of this is going to be done with the help of many different
    protocols that are secure.


    As a programmer, you will also enjoy that there is a lot of language support that
