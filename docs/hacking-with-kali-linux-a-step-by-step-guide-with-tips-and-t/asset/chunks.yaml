    这些信息将被发送回黑客，随着时间的推移，他们将看到你发出的信息，并看到用户名和密码的模式。


    ### 7 - 截图


    我们在这里要看到的另一个部分是截图的概念。


    这与我们之前做的稍有不同，但它与键盘记录器结合，可以更成功地完成它应该的工作。


    通过这种方式，黑客实际上能够看到你经常访问的网站等内容，并利用这些信息来帮助他们并获得最大利益。当键盘记录器获取你输入的内容时，如果截图能随之而来，他们将非常容易收集到他们想要的信息。


    ### 8 - 中间人攻击


    我们在上一本指南中曾详细讨论过这种攻击，但它仍然是许多黑客喜欢的攻击类型，而且它可以确保你能够让事情按照你的意愿运行。


    这种攻击是指黑客能够说服他人他们属于特定的网络。


    然后，当该网络上的某台计算机发送信息时，信息将直接发送给黑客，而不是预期的接收方。


    黑客可以直接查看这些信息，也可以在发送给消息的目标接收者之前对其进行修改以满足他们的需求。


    ### 9 - 计算机黑客


    这是黑客通过应用不同的黑客方法窃取计算机 ID 和密码，并对该计算机系统获取未经授权的访问。


    虽然有些人会担心所有黑客都是一样的，并且我们需要担心任何形式的黑客行为（无论它被视为伦理的还是不道德的），但实际上是有区别的。


    在技术及更多领域，我们在过程中有很多地方可以使用伦理黑客。


    这些人将让我们有机会学习更多关于网络的知识，并可以做很多工作来确保我们的数据安全，让黑客无法得到他们想要的。


    # 第 3 章：如何下载和使用 Kali Linux


    现在是时候让我们检查并确保我们能够下载 Kali Linux 了。


    这将确保我们能够充分利用该系统的价值，并按照我们想要的方式使用它。


    有几种不同的方法可以让我们把 Kali Linux 安装到系统中，以便我们进行操作。


    如果你想通过使用该系统来进行一些自己的黑客活动，那么安装 Kali Linux 系统是非常重要的，这样我们就可以以任何想要的方式与它工作。


    这里有两个主要的选项可以运行。


    我们可以选择与 Windows 进行双启动，或者将其安装在窗口内通过虚拟化操作。


    我们还需要考虑哪个版本的 Kali 最适合我们的需求。


    Kali 的传闻是帮助渗透测试的最佳版本之一。


    无论哪种 Linux 发行版对渗透测试来说都是很棒的，你完全可以使用你当前最熟悉的一个。


    ## 与 Windows 10 进行双启动


    我们在这里要查看的帮助我们运行 Linux 系统的第一个选项是如何通过 Windows 10 的帮助来实现双启动。


    有几个步骤可以实现。


    首先，我们需要进入 Kali Linux 页面并下载最新版本的 ISO 文件。


    你可以根据你正在使用的系统，选择使用该版本的 32 位或 64 位版本。


    下载完成后，我们需要确保可以创建一个可启动的 USB 盘。


    你需要使用 `Rufus` 程序来完成操作，它只是一个可以帮助你创建任何你需要的的可启动 USB 闪存驱动器的工具。


    你可以找到该程序的主页并安装使用。


    准备就绪后，该是时候处理所需的启动启动 USB 盘了。


    首先，插入 USB 盘。


    为了让其工作，你需要确保你的优 盘至少有 4 GB，以便有足够的空间来完成这一切。


    现在运行 `Rufus` 并按照给定的步骤来创建你所需的启动启动 USB。


    随着操作的进行，你会看到一个带有几个选项的屏幕。


    第一个是检查是否选择了你想要使用的 USB 盘。


    然后你可以再往下看，点击它下方的的小 CD 驱动器图标。


    然后我们需要找到 Kali Linux 的 ISO 文件，即你从 Kali 官方网站下载的文件。


    处理好这些后，就可以点击“开始”按钮并等待整个过程完成。


    在此过程完成后，该点击“关闭”按钮，这将让你有机会退出 `Rufus` 程序。


    是的，你将拥有一个带有 Kali Linux 操作系统的启动 USB 盘。


    除了像我们这里计划的那样将其与 Windows 进行双启动之外，还可以使用它来执行 Kali 的实时启动。


    这意味着我们可以在不安装的情况下运行 Kali。


    我们只需要记住，这将对我们可以使用的功能和特性提供一些限制。


    当我们完成这部分后，该是为我们的 Kali Linux 安装创建一个单独的分区了。


    要做到这一点，我们只需要打开磁盘管理设置，或者在 Windows 中打开命令行并运行 `diskmgmt.msc` 命令。


    在执行时，我们可以通过收缩现有卷来创建一个至少为 15 到 20 GB 的新分区。


    我们花了一些时间在这里创建了一个大约 17 GB 的新分区，你也应该把你的设得类似。


    到此时，我们想要处理的初始过程都已完成。


    下载的 Kali Linux ISO 已完成，你创建了启动 USB 盘，然后我们为 Kali Linux 系统的安装创建了自己的分区。


    在继续这里之前，我们始终需要在我们的 BIOS 中禁用安全启动（Secure Boot）和快速启动（Fast Boot）选项。


    在这里我们将重启正在使用的设备，然后进入启动管理器。


    这里将允许我们选择“从 USB 启动”的选项。


    请记住，命名会根据你使用的计算机品牌而有所不同。


    此时，你会看到 Kali 的安装窗口就在那里。


    应该有几个不同的选项供我们安装 Kali Linux。


    在这里我们将使用图形化安装（Graphical Install），因为它会让安装变得简单一点。


    这里会有一些管理步骤供你处理，以确保一切井井有然并按照你想要的方式运行。


    例如，你可以处理使用的语言，选择你所在的国家，选择键盘布局和 IP 配置（以及是手动还是自动），你甚至可以挑选一个你想要的主机名，这将与你在其他账户中的用户名相似。


    然后我们将进入输入想要为 root 用户使用的密码。


