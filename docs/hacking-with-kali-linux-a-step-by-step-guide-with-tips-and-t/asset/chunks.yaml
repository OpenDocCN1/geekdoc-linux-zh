    # Introduction


    Hacking with Kali Linux

    A Step by Step Guide with Tips and Tricks to Help You Become an Expert Hacker,
    to Create Your Key Logger, to Create a Man in the Middle Attack and Map Out Your
    Own Attacks


    Congratulations on purchasing this, and thank you for so. The following chapters
    will discuss everything that you need to know in order to get started. To begin
    with, we are going to spend some time taking a look at the benefits of hacking
    and why this is the best operating system to use when you are ready to begin.
    We will also look at some of the methods we are able to do.


    The more that we are able to learn about Kali Linux, the easier it is overall
    when it is time to get started on some of. We are going to look at some of the
    benefits of being an ethical hacker, as well as some of the basics that we need
    to know about ethical hacking. With this in mind, it is then time to get into
    a bit of the coding that we are able to do.


    There are a lot of options out there to choose from. We assume that every person
    who tries to do this kind of hacking is out there to steal personal and financial
    information for monetary gain. And while there are many hackers who work in this
    manner, ethical hackers are going to be nice because they will help out other
    networks, or they are looking to make sure that at least their own network is
    safe in the process as well.


    From there, it is time to map out our own attacks before we actually work on.
    We will look at how to create a key logger, and then how to add in the screenshot
    saver to make both of these attacks a bit more efficient than they are on own.
    We will also learn how to make our own code for cracking passwords and how to
    work with the Kali Linux operating system in order to work on a man in the middle
    attack, whether it is a passive or an active attack, all on own. The end of this
    guidebook is going to finish with a look at some of the tips and tricks that we
    need to follow in order to become an expert at hacking. These can ensure that
    we are able to get into and out of the target system that we want to use, even
    our own, without someone else noticing that we are even there. Remember, as a
    hacker, if someone notices that you are on the network, and you shouldn’t be there
    in the first place, then this is the end of the road for you with that network.
    And that is never a good thing for any hacker.

