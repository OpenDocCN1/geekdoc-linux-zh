    # Installation


    After you enter the password that you would like to use, you can click on Continue.


    We are going to set it up so that we are able to Manually choose the method of
    partitioning that we want to work with. Carefully go through this step.


    You want to make sure that you only work with the partition that we created earlier
    for the installation before moving on.


    Then we are able to select the option to help us delete the partition.


    In this step, we should see that the partition for the Kali installation is going
    to show up as free space. We want to use that free space and select that we would
    like to Automatically partition the free space.


    You can also choose the option that will have All files in one partition, which
    is the recommendation for new users.


    And finally, we want to select the option that is there that says Finish portioning
    and write changes to disk.


    At this step, it is going to ask us to have permission in order to write out the
    changes that it needs in the disk. Make sure to choose the Yes option.


    Now the installation process for Kali is going to start working. This is going
    to take about ten to fifteen minutes to complete the installation, so give it
    some time to finish up.


    When you get about halfway through the installation process, it is going to ask
    you about a network mirror. You will be able to choose Yes or No. This setting
    is going to be about the update option. It is usually best to choose no and then
    change that later if you would like.


    Then it is time to install the GRUB boot loader. When this comes up, click on,
    Yes.


    Next, the system is going to want to know where you would like to install the
    Kali GRUB boot loader. You are able to choose the second option of the hard disk.
    Remember that you should only choose the hard disk for this installation. Otherwise,
    when Kali is done installing, the system will not display the option that will
    allow you to choose which of the operating systems you would like to see when
    things startup.


    After successfully completing this installation process, you are going to get
    a screen that comes up, and you should choose to Continue. Now you are able to
    eject the USB drive that we have been using and restart the system.


