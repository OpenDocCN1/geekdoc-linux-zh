  raw: 'When you go through your network and try to find where these vulnerabilities
    are located, it is not necessary for you to check out each and every protocol
    that you are able to think about on a system.


    This may seem like the best option, but it is just going to make things more confusing
    and will take too much time because there is too much going on.


    The best way to check out for some of the vulnerabilities is to go through and
    test out the most important parts, and to make sure that you just check out one
    at a time so that you can figure out where the issues are right away.


    When it is time to do a map of your attack, you need to make sure that you try
    out one application or one system, and always start out with the one that will
    need the most helpful overall.


    Then you are able to go down the list and check on all of the important attacks,
    seeing if it is possible that a hacker can get through that vulnerability before
    it is all done.


    If you take a look at some of the protocols and are still uncertain about whether
    you should start with one or another, or where you should begin in the first place,
    some of the questions that we are able to ask about this include:


    *   If someone tried to do an attack on the system, which part would end up causing
    the most trouble or which part would end up being really hard if you lost the
    information on it?


    *   If you had a system attack, which part of the system is the most vulnerable,
    therefore the one that your hacker is most likely to use.


    *   Are there any parts of the system that are not documented that well or which
    are barely checked? Are there even some that are there that aren’t familiar to
    you (or you haven’t even seen in the past)?


    Once we have had some time to go through and answer these questions, and any other
    questions that may seem pertinent at this point, then it is a lot easier to come
    up with a good list of the different systems and protocols that you would like
    to be able to check out first.


    Keep up a few good notes during this process to ensure that you can keep it all
    in order as you move through the systems, and make sure to document it all so
    that if you end up with some issues, later on, it is a lot easier to get them
    fixed up.


    ## How to Organize the Project


    With this part in mind, it is time to write out that list and then get started
    working on some of the applications and systems that we would like to run.


    We also have to double-check that list and make sure that we have all of the important
    stuff covered before we even start.


    You want to take the time to run these tests on everything that is inside of the
    computer to ensure that it is safe and all of the vulnerabilities are taken away.
    Some of the different parts of this process that we need to consider when it is
    time to work on this mapping will include:


    *   Your routers and your switches


    *   Anything that is connected to the system. This would include things like tablets,
    workstations, and laptops.


    *   All of the operating systems, including the server and the client ones.


    *   The web servers, the applications, and the database.


    *   Make sure that the firewalls are all in place.


    *   The email, file, and print servers.


    You are going to run a lot of different tests during this process, but this is
    going to ensure that you check through everything on the system and find the vulnerabilities
    that are there.


    The more devices and systems that you need to check, the more time it is going
    to take to organize the project.


    You are able to make some changes to the list and just pick the options that you
    think are the most important in order to save some time and keep your system safe.


    ## Does the Time of Day Matter?


    We also have to consider the best time of day to complete the attack that we would
    like to do.


    When you are setting up the goals of that hack, you need to take a look at when
    would be the best time to complete an attack in order to get the most information
    and have a clear look at the system, without disturbing the job of those who work
    on the network or system.


    Now, if you are taking the time to go through this kind of penetration testing
    for your own personal computer, then just pick out the time that seems to work
    the best for you.


    But if you are working through this attack on another system to help them keep
    it safe and secure, then you will want to be more careful about the time that
    you are choosing to do these attacks.


    If there are some other devices on the network, or you are planning on doing the
    attack on a business network, you need to make sure that you are choosing times
    that will not disturb the regular functioning of that business.


    If this company gets a lot of customers right in the morning, then shutting them
    down or doing an attack at that time is probably not going to go so well for you.


    Many times these attacks are done at night to ensure that you have free reign
    of the network without causing issues for those who are actually using it.


    ## How to Tell What Others Can See


    Now that we have gotten to the point in the process where we are able to actually
    complete a real hack, it is time to do a bit of research. In this step, we want
    to stop and see what others are actually able to see about our own network.


    A good hacker, before they jump onto the network that you have, will spend some
    time researching your network and seeing if they are able to find the personal
    information that they need to expose the vulnerabilities that are there.


    If you are someone who owns the system, it is likely that there is a lot of information
    out there about your company, and even about those who help run the company, and
    you are going to miss out on that.


    But it is time to take off the owner hat and focus more on the hacker hat when
    you do this kind of research.


    That is going to make it a lot easier to see what information is out there, and
    what the hacker could likely use against you.


    Keep in mind that there are probably quite a few options that you are able to
    choose to work with when it is time to gather up these trails, but the number
    one place where you should start is with an online search.


    This is where you will be able to just type in your name or your business name
    and see if there is a lot of information out there.


    You can then narrow this down a bit more with a probe to find out what someone
    else would be able to see about you or the system that you are working with.


    You may also find that working with a port scanner that is local is a good way
    to find some of these issues, as well.


    *   This is just the start of the process, though, because it is only going to
    show us some of the basics to work with.


    This means that it is going to be important for us to delve in a bit deeper, or
    we will end up missing out on some of the things that our computers and networks
    are sending out, without really knowing what is going on.


    A few of the things that we should consider searching for would include the following:


    Any contact information that will let someone else see who is connected with the
    business. Some of the good places to check out include USSearch, ZabaSearch, and
    ChoicePoint.


    *   Look through any press releases that talk about major changes in the company.


    *   Any of the acquisitions or mergers that have come around for the company.


    *   SEC documents that are available.


    *   Any of the patents or trademarks that are owned by the company.


    *   The incorporation filings that are often with the SEC, but in some cases,
    they can be in other locations as well.


    Yes, this is going to end up being a lot of information that we will need to do
    research on and look around for, but think about how valuable this information
    would be to a hacker.


    And you need to figure out how much of this is readily available for the hacker
    to use for their own.'
