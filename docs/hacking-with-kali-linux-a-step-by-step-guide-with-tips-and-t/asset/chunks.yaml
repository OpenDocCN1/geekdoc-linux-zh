  trans: '


    # 安装


    在你输入了想要使用的密码后，可以点击“继续”。


    我们将进行设置，以便能够**手动**选择我们想要使用的分区方法。请仔细阅读此步骤。


    在继续之前，请务必确保你只对我们之前为安装而创建的分区进行操作。


    然后，我们就可以选择帮助我们删除分区的选项。


    在这一步中，我们应该看到 Kali 安装分区将显示为空闲空间。我们希望使用该空闲空间，并选择**自动**分区空闲空间。


    你也可以选择“所有文件放在在一个分区”的选项，这是对新用户的建议。


    最后，我们想要选择显示为“完成分区并将更改写入磁盘”的选项。


    在这一步，系统会要求我们获得权限以便在磁盘上写入所需的更改。请确保选择“是”。


    现在，Kali 的安装过程将开始运行。完成安装大约需要十到十五分钟，所以请留出一些时间让它完成。


    当安装过程进行到一半时，它会询问你关于网络镜像的问题。你可以选择“是”或“否”。这个设置是关于更新选项的。通常最好选择“否”，以后如果需要的话再更改。


    然后是时候安装 GRUB 引导器了。当它出现时，点击“是”。


    接下来，系统将想知道你想将哪里安装 Kali GRUB 引导器。你可以选择硬盘的第二个选项。记住，对于本次安装你应该只选择硬盘。否则，当 Kali 安装完成后，系统将不会显示让你在启动时选择想要查看哪种操作系统的选项。


    成功完成此安装过程后，会弹出一个屏幕，你应该选择“继续”。现在你可以弹出我们一直使用的 USB 驱动器并重启系统了。


    当你进行启动过程时，你会看到 Kali Linux 的 GRUB 加载器。在这里，你可以选择 Kali GNU/Linux 来使用新的操作系统启动笔记本电脑。但如果你想用
    Windows 10 启动它，只需要选择“Windows 恢复环境”来帮助。


    ## 使用 VirtualBox 安装 Kali


    在某些情况下，根据你的需求，你可能不想对 Kali Linux 进行双启动。也许你正在运行的系统没有足够的空间或性能来允许两个操作系统同时运行。或者你可能会在其他方面遇到一些麻烦，并决定双启动并不适合你的选择。


    当你的需求符合这些情况时，你可以通过 VirtualBox 的帮助来安装 Kali。与我们上面提到的双启动相比，使用 VirtualBox 工作时你可以看到一些优点。其中一些优点将包括：


    1. 你可以同时运行多个操作系统。

    2. 你可以快速地对你的操作系统进行许多更改，例如安装、备份、回滚、恢复等。

    3. 你可以更好地管理资源的分配，而无必处理所有那些烦人的事情。

    4. 如果你需要，可以提取 VirtualBox 并将其复制到不同的机器上，以便在其他地方使用它。

    5. 你可以破坏你正在使用的安装，然后只需点击几次即可回滚，而无需进行大量工作。

    6. 你被迫在过程中进行故障排除，这将成为你在此过程中学习的好好方法。

    7. 这是一个让你花时间学习和测试事物的绝佳方法。


    然而，我们必须意识到，当我们尝试在 VirtualBox 上运行 Kali 时，会出现一些负面影响。例如，性能将会下降，并且比我们习惯的其他选项低得多。GPU
    加速过程将无法工作，USB 无线卡也会导致一些问题。


    你可能会发现，避免问题和排除故障的麻烦也更容易，转而选择只是定期进行回滚，而不是学习任何新知识。如果你习惯了这种方法，你可能会发现这让你在真实机器上安装和运行代码时并不那么舒服。


    我们可以让将 Kali Linux 安装到这些虚拟机之一的过程变得像我们想要那样简单或复杂。为了将此语言或操作系统安装到虚拟机中，我们可以操作的一些简单步骤包括：


    1. 你可以创建一个新的虚拟机来开始。

    2. 接下来，是时候创建一个供你操作的全新虚拟磁盘了。

    3. 当这些完成并准备就绪后，是时候修改 VirtualBox 的某些设置以帮助启动。

    4. 在我们处理了一些想要处理的修改后，是时候加载 Kali 的 ISO 文件了。

    5. 当我们加载了 Kali 的 ISO 后，也是时候启动它。这将包括一些信息，如初始信息、位置和时区等。

    6. 然后是时候处理 Kali 的磁盘分区了。这将使用我们之前在进行双启动时提到的许多步骤。

    7. 然后是时候完成 Kali 的安装，我们就可以在 VirtualBox 上运行它。

    8. 如果你愿意，你可以通过并添加一些 VirtualBox 增强包来适应你的需求。


    # 第 4 章：花时间尝试 Linux 系统


    当我们到达这一点时，我们应该已经在电脑上设置好了 Linux 系统并准备就绪。现在是时候学习如何与 Linux 系统工作并为我们的需求进行设置了。


    在我们通过本章以及指南的其他部分时请记住，我们使用的工具将专门用于我们在 Kali Linux 上能做的事情，而如果你想使用该操作系统，虽然你可以将它们迁移到
    Windows，但你会发现这样做的过程无疑会让你丢失这些相同工具在 Linux 中具有的一些功能。


    '
- fmt: '

    It contained a lot of the features that we would like to use with Linux, and if
    you had one of the older distribution versions of this operating system, this
    is the version that you are probably the most familiar with working with.


    On the other hand though, if you just went through the process of adding Kali
    to your system, then this is going to be a bit newer.


    There will be a lot of similarities that show up between the two, but there are
    a few different features so keep that in mind as well.


    With all of this information in mind, you are probably excited to learn a bit
    more about Kali and what we are able to do with it when it comes to hacking.


    It is now time for us to get into the mix and learn how to work with Kali, how
    the terminal works, and even how to write out some of our own commands in this
    operating system as well.


    ## Booting Up the System


    The first thing that we need to do with this is to boot up the operating system.


    You will log in and be the root.


    This basically means that you are going to be the main computer in the system
    if you are using your own computer.


    Then you need to type in `bt > startx`.


    You will then be able to open up one of the terminals that are there.


    You need to spend some time in the terminal, learning more about it because this
    will be where we will spend a ton of our time when we need to start with hacking
    and Linux.


    There are going to be a lot of different things that this terminal is able to
    make us work with, and there will be some similarities to what we see with Windows
    and Mac.


    But there are some differences as well so take the time to try it out and see
    how we can really work with it and get the results that we want.


    ## Open the Terminal


    The next thing that we need to take a look at is going to be how to open up the
    terminal to work with Kali Linux.


    You will be able to accomplish this when you click on the icon for this part,
    which will be right at the lower bar of the screen.


    When you click on this icon, you will end up with a black screen and a cursor
    light that is flashing.


    There are also a few options at this point for us to make a decision.


    If you have ever used the command prompt that is available with Windows, you will
    notice that the terminal that shows up with Linux is going to be pretty similar
    and will come with many of the same parts as well.


    Keep in mind with this thought that there is going to be a lot more power than
    you will be able to find with the Linux terminal, though, and we are going to
    use it for a lot of different tasks.


    You should do all of the commands and work that you want to do with hacking in
    this terminal because it will help to add in the power and ease of use that you
    are looking for.


    One thing that we do need to remember when we are working with this, though, is
    that it is going to be case sensitive.


    Unlike other operating systems, like Windows, Linux is going to take a look at
    whether you are working with lowercase or uppercase letters in how you name things
    and more.


    For example, typing out `Paperclip`, `paperclip`, or `PaperClip` will all be seen
    as different things when you work in Windows.


    This is a minor thing but will make a difference when you want to go through and
    make some changes or look for certain things in the code later on.


    ## Looking at the Structure of Kali Directory


    Now that we have been able to go through and open up the terminal, we are able
    to spend some time examining it more and learning a bit of the basics that come
    with this terminal and the directory that comes with it.


    There are going to be some situations as a beginner that you could work with and
    then get tripped up with the structure that we find with Linux.


    Unlike what we may be used to with Windows and Mac, the Linux operating system
    is not going to link back to a physical drive.


    You will not have to work with `C:\` before your work, and instead, we will need
    to work with the `/` symbol instead.


    This forward slash is going to be important because it is going to show us the
    root of the file system that we are working with.


    The root is going to be the top part of the file system.


    All of the other directories and folders are going to be found right under the
    root.


    Think about this root-like the main folder, and then the other folders that we
    are going to use will fit into it, just like some of the files and folders that
    we would use with Windows.


    Take a bit of time to see how we are able to design a few of these different directories
    if you can, or look through the system and see if you are able to find some of
    these.


    It is always a good idea to have at least a bit of the basic knowledge about some
    of this system before you start hacking because there may be times when you will
    wish to go around and navigate through the terminal without us having to bring
    in another tool for graphs.


    There are a few other things that we are able to work with when we are in the
    directory of Kali.


    A few of the things that we need to explore and understand when we are using the
    graphical representation that comes with this will include the following:


    * `/bin`—this is going to be the directory where all the binaries are stored.
    These are the programs that are going to help Linux run.

    * `/etc`—this is often where the configuration files are going to be stored. When
    working with Linux, almost all of the things that you are saving with a text file
    will be configured and then stored under the `/etc` ending.

    * `/dev`—this is the directory that is going to hold all of the files for the
    device, similar to what you would find with the Windows device drivers.

    * `/var`—this is generally where you are going to find the log files, along with
    other files.


    ## Use the pwd Command


    Now we need to take a moment to look at some of the commands that are out there
    for us to work with.


    There are quite a few commands that work with the Linux system, but we are going
    to spend some time looking at the commands that are most common.


    And the first command that we need to focus on when working with Linux will include
    the `pwd` command.


    When you decide to get that terminal window open, you are going to find yourself
    in the default directory, which is going to be known as the home directory, as
    well.


    If you would like to confirm this or double-check which directory you are in at
    various times in the process, you just need to type in `bt > pwd`.


    This will show us the current directory on the screen when you are ready.


    To keep it simple, `pwd` is just going to stand for the current working directory,
    or the one that you are working in right now.


    If you are on the main terminal right now, you are going to end up with the return
    of `/root`.


    If this shows up on your screen, then it is going to show us that we are inside
    of the root users'' directory.


    ## Working with the Cd Command


    The `pwd` command that we talked about before is not going to be the only command
    that we need to focus on, though.


    There will be a lot of other commands that are important as we get into the actual
    hacking part of all this.


    But in the beginning, as we are learning more about the Kali Linux system and
    what we are able to do with it, it is also important that we spend some time looking
    at the `cd` command as well.


    When you are in the terminal that you would like to work with, it is possible
    to use just a few commands in order to change up which directory you are currently
    in.


    When you use these commands, it helps you to switch back and forth between a few
    of the directories that you would like to use, rather than having to do a bunch
    of searches or getting confused and lost about where you are in the first place.

    '
