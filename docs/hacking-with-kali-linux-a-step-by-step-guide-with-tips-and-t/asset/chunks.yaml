    我们接下来要进行的操作包括设置我们需要使用的选项。


    从这里开始的一个很好的地方是使用显示选项的命令。


    这是一个非常实用的命令，因为它可以让我们看到可以选择的选项，包括必选的选项以及我们可以操作的可用选项。这取决于我们想要运行的黑客攻击。


    为了确保 `show options` 命令在我们的系统上正常运行，我们需要执行以下代码：


    ```

    msf > (ms08_067_netapi) show options

    ```


    当我们到达这一步时，你将看到受害者（将是 `RHOST`）和攻击者（在这种情况下就是你，将是 `LHOST`）的 IP 地址。在稍后需要接管你的某一个目标系统时，了解这些信息对我们来说非常重要。因为
    IP 地址将是我们用来直接进入我们想要进入的系统的工具。


    现在我们需要关注两个代码，并使用它们来显示 IP 地址和目标 IP 地址，以便让接管另一个系统变得容易一些：


    ```

    msf > (ms08_067_netapi) set RHOST 192.168.1.108

    msf > (ms08_067_netapi) set LHOST 192.168.1.109

    ```


    现在，如果你已经正确并正确执行了整个过程，你应该能够漏洞利用另一台电脑并将 Meterpreter 放置上去。目标计算机现在将处于你的控制下，你可以按照以下步骤获取你想要的截图：


    ### 步骤：获取你想要的截图


    当我们到达这一步时，开始设置你想要实现的截图是非常重要的。但在我们真正开始之前，我们需要花一些时间来确定实现这一目标所需的 `ID` 或 `PID`。


    我们需要使用的用于查找此 ID 的代码包括：


    ```

    meterpreter > getpid

    ```


    完成操作后，接下来会弹出一个屏幕，其中应该包含你想要攻击的计算机上使用的 `PID`。在这种情况下，我们假设我们的 `PID` 是 `932`，但它会根据目标计算机此时返回给你的内容而变化。


    既然我们已经获取了这个数字，就可以通过获取所有具有相同 `PID` 的进程列表来检查这是哪一个进程。为了检查此项，我们将使用以下代码：


    ```

    meterpreter > ps

    ```


    当你查看 `PID 932` 或对应你目标特定系统的 PID 时，你会发现它对应于名为 `svrhost.exe` 的进程。由于你将使用一个具有活动桌面权限的进程，在这种情况下，你已经准备就绪了。


    如果没有权限，你可能需要进行一些迁移（migration）以获得活动桌面权限。现在你只需要激活 Meterpreter 内置的脚本即可。你需要的脚本被称为
    `espia`。要做到这一点，你只需要输入：


    ```

    meterpreter > use espia

    ```


    运行此脚本将把 `espia` 应用程序安装到你目标的计算机上。现在你就可以获取你想要的截图了。


    要获取目标计算机的单张截图，你只需要输入代码：


    ```

    meterpreter > screengrab

    ```


    当你输入这段代码时，你编写的 `espia` 脚本基本上会对目标计算机当前正在的操作进行截图，然后将其保存到根用户目录中。随后你就能在你的计算机上看到这个文件的副本。


    你可以查看正在发生什么，如果你操作得当，目标计算机将无法理解你截取了屏幕，也不会发现你不被允许留在那里。你可以跟踪发生的情况，并根据需要获取尽可能多张不同的截图。


    当我们使用此选项时，你可以根据需要多次执行最后一条命令。你可能希望将其设为定期运行，或者将其设置为在一天中的某些特定时间运行。你需要根据目标用户的使用情况，决定你想获取几次，以及何时是执行这些操作最有价值的时间。


    如果你以正确的方式设置了它，并结合我们能够获取的一些键盘记录器信息，你就可以将获得的信息与截图进行对比，并利用这些信息进入你想要的账户。完成操作后，代码应该保持在原位，但如果出现问题，你可以再次按照这里的步骤操作，并再次告诉它你希望如何实现这一切。


    能够执行黑客攻击并获取目标计算机的一些截图，真的能让你作为黑客时变得更加高效。虽然你会发现单独使用键盘记录器可以获取大量信息，但在此过程中也会增加一些问题，而且效率不会像我们预想的那样。这就是为什么我们想要将一直讨论的截图加入进来。当我们将截图和键盘记录器结合起来时，我们可以获取大量信息，这将确保你不仅能查出用户名和密码，还能确定它们属于何处，以及用户在使用这些信息时会访问哪些网站。在本章中，我们学习了一些用于创建自己的截图工具并将其添加到键盘记录器中的最佳代码。


    第 8 章：如何使用 Linux 创建中间人攻击


    中间人攻击（Man in the Middle attack）是黑客获取关于你网络信息的一种非常强大的手段。这种攻击可以是主动的，也可以是被动的。


    有时，它仅包括个人进入你的网络，观察并查看他们能发现什么。而在其他时候，它是更主动的，黑客会主动入侵网络并窃取内部信息。无论何种方式，这对你的网络安全都是危险的。在黑客进入你的系统一段时间后，他们很可能会使用这种中间人攻击。一些黑客会发现，仅仅进入系统并监听数据就足够了；而另一些人倾向于使用更主动的方法，这让他们获得他们想要的网络控制权。这些就是中间人攻击。


