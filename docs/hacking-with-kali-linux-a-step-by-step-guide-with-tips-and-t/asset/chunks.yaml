- fmt: '

    Of course, there are going to be a few other types of hackers out there that we
    need to pay attention to as well, and it is going to depend on their motivation,
    their level of knowledge about the situation and hacking and all the coding that
    goes with it, and more.


    But for now, we are going to spend our attention on the differences between black
    hat hackers and ethical hackers to help us see some of the basics of both of these.


    ## What is an Ethical Hacker?


    To start with here, we need to take a closer look at ethical hackers or ethical
    hacking.


    These are going to be terms that are used in order to describe the hacking that
    is performed by an individual or company in order to figure out if there are any
    threats, or any potential threats, on a network or a computer.


    An ethical hacker is going to try and bypass the security of a system and then
    will search around to see if there are any weak points that a malicious hacker
    may be able to exploit for their own needs.


    This information is going to be used by that organization in order to improve
    the security of the system, in order to eliminate or at least minimize any potential
    attacks.


    Hacking is going to be the process that we can use in order to find some of the
    vulnerabilities that are inside of a system, and then we can use these in order
    to gain access, usually unauthorized access, to the system in order to perform
    some malicious activities.


    The methods that the hacker is going to use vary based on their motives, but hacking
    is considered illegal, and if you are caught in the act, it is going to lead to
    some intense consequences in the process.


    However, hacking can be legal in some cases, mostly when it is done with permission.


    It is pretty common for experts in computers to be hired by companies to hack
    into a system in the hopes of finding vulnerabilities in the system to cut them
    off before a black hat hacker shows up.


    This is going to be one of the precautionary measures that can be used against
    a legitimate hacker, who will have some malicious intent.


    Such people, who will hack onto the system with some permission, without any kind
    o malicious intent, are going to be known as ethical hackers, and the process
    that they will use is known as ethical hacking.


    This will bring us into a discussion of the differences between the white hat
    and black hat hackers.


    Keep in mind that there are a few other types that fall in between these two,
    but we are going to just focus on these to give us a better understanding of hacking
    and what it all entails in the process as well.


    Let’s dive in.


    To start out with here, we need to be able to take a look at some of the different
    methods of hacking that we are able to use, and what is really out there.


    These various types of hacking are often going to work with the same techniques
    and methods as one another, so learning what we will in this guidebook is going
    to be important even as ethical hacking.


    But the motivations behind why the hackers each do the methods and techniques
    are going to be what is important here.


    With that in mind, the two main types of hacking that we are going to explore
    will include the black hat hackers and the white hat hackers.


    ## Black Hat Hackers


    First, we are going to take a closer look at the black hat hackers.


    When you first hear the word hacker, what are some of the thoughts that popped
    up into your head right away?


    It is likely that you think along the lines of what we see in some of those big
    news articles, the ones where a hacker was able to get ahold of a lot of information
    and use it in any manner that they would like.


    The hackers who will steal the information, such as the big data breaches that
    we hear about, and use it for their own financial gain.


    These are going to be the black hat hackers.


    These are the individuals who are able to get onto a network or a system, whether
    it just has one computer or a lot of them, and they do this without permission
    from the person who owns the system.


    They will get into these systems in the hopes of some personal gain in the process.


    They may do a man in the middle attack, log the keystrokes of the target computer,
    or use other methods in order to take control and get the information that they
    really want.


    There are a lot of methods that these kinds of hackers are able to utilize against
    their targets.


    They are not above working with malware, viruses, Trojan horses, and more in order
    to get their foot in the door.


    Sometimes their work is going to simply be placed on the target network and left
    there until it is needed.


    But the hacker always has a plan when they are a black hat hacker.


    They will figure out the best time to attack the target computer in order to get
    the most out of it and ensure that they will have the best results as well.


    When the black hat hacker is successful, it could cost companies and individuals
    millions of dollars and a loss of reputation as well.


    ## White Hat Hackers


    Then we can also work with the white hat hacker as well.


    These hackers may have some of the same techniques to work with as the black hat
    hacker, but they have a different motivation or reason for doing things.


    White hats are going to have more noble reasons for doing it.


    These individuals are going to gain permission to be on a network or a system
    before they do any of the work.


    Sometimes it will be their own network or because they are an employee for a company
    who would like to check that their network is safe.


    The white hat hackers are going to perform their work in one of two ways.


    First, they may spend their time looking around the system to see if they are
    able to find vulnerabilities in it before reporting this to the administration
    or whoever controls that network.


    These white hat hackers can also be people who are going to be interested in computer
    and how they work, and why may see that there are some challenges when it is time
    to work on getting into the system.


    They will then decide to use the information that is there for their own personal
    gain, but they may not always be there with the right permissions.


    On the other hand, there are some white hat hackers who are going to be actively
    working to find some of the flaws and vulnerabilities that show up with a particular
    network.


    Sometimes the people in the previous group will be asked to come in and work for
    the company once they find the flaw, and sometimes they are already found working
    there to keep the network safe.


    The important piece of the puzzle that we need to work with here, though, is that
    the white hat hacker has the right permissions to be on the network.


    They have gathered up that permission before starting, and the owner of the network
    knows they are there and what they are doing there as well.


    The white-hat hacker is then able to go through and provide a report of what they
    were able to find on the network in order to show it off when there are vulnerabilities
    and present some of the recommended steps to ensure that the network stays as
    safe as possible.


    ## Gray Hat Hackers


    And finally, we are going to see what is known as a gray hat hacker as well.


    These individuals are going to fall somewhere between the white hat and the black
    hat hackers when it comes to the work that they do.


    They are not going to have permission to be on the network at all, and often the
    owner of the network will have no idea that the hacker is there or what they are
    doing, at least as long as the hacker is good at the job they are doing.


    But these individuals are often not there to cause issues and steal information.


    They may look for the vulnerabilities, for example, and then alert the person
    who works for or owns the network to alert them that there are these problems
    in place.


    In this guidebook, we are going to focus mainly on what you would do as a white
    hat hacker.


    This will ensure that you are able to take care of the network, while still learning
    some of the basics that come with hacking overall.

