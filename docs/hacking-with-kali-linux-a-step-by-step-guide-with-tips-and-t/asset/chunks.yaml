    as safe as possible.


    ## How Can I Crack a Password?


    The first thing that we need to take a look at here is how we are able to crack
    the passwords of our targets.


    If a hacker finds that social engineering is not doing the work that they would
    like to gather the passwords, there are other options that they are able to use
    to accomplish this without having physical access to the computer.


    Some of the other tools that are there for us to crack through these passwords
    will include `RainbowCrack`, `John the Ripper`, and `Cain and Abel`, to name a
    few.


    While there are a few of these tools, and others out there, that can be useful
    for cracking the passwords that you want, you have to a closer look at them because
    a few are going to require that you are actually on the target system before you
    can effectively use them in the manner that you are working with them so they
    are a bit of a hassle if you would like to do the work remotely.


    But once you have been able to gain physical access to the computer, all of the
    information that is found there, and has a password on it to keep it hidden, is
    going to be yours when you pick one of the tools above.


    ## The Importance of Password Encryption


    Now we need to take a quick look at something known as password encryption.


    We will also look at a few of the other hacking methods that can be used in order
    to get the password and use it, even if it has been put through encryption.


    Once you have been able to create a new password on your account, it is going
    to make its way through an algorithm for encryption.


    This is going to give us a hard to read and encrypted string that we are able
    to see.


    Of course, the algorithm is set up so that we are not able to reverse the hashes
    that are there, which is going to keep the password safe and is the main reason
    why someone isn’t able to get onto the system and just see the password that you
    have.


    In addition, any time that you would like to be able to crack a password that
    is on the `Linux` system, there is going to be a second added level that comes
    with the difficulty to the password cracking process.


    `Linux` is able to add in this new level of security by adding in the idea of
    randomizing the passwords.


    This is done by adding in salt, and sometimes another value, to the password,
    which changes up the uniqueness that comes with it so that no two users, even
    if they pick out the same password, will come out with an identical hash value.


    Of course, there are a few tools that are going to be at your disposal that we
    are able to try and use in order to crack or recover some of the passwords that
    are lost.


    Some of the options that you are able to choose from will include:


    1. **The dictionary attack**:

    With the dictionary attack, the program is going to try out words that are found
    in the dictionary and then can check these against the hashes that are on the
    database for the passwords that are on the database or the system.


    This is going to work when the passwords are weak or when they just rely on an
    alternative spelling for them. Such as writing out `pa$$word` rather than `password`.


    If you would like to double-check that all of the users on your network have picked
    out strong passwords, then you will try out this attack so that you can make the
    right changes.


    2. **A brute force attack**:

    These can help us to crack through almost any kind of password that we would like,
    due to the fact that it is able to bring out many combinations of characters,
    numbers, and letters until it has found the password that is right.


    Keep in mind though that this method is slow and takes a lot of time and can be
    unsuccessful if the user has a really strong password and changes it on a regular
    basis. Because of all the time that this one will take for putting in the various
    combinations, it is usually one that the hacker is not going to waste their time
    on.


    3. **Rainbow attacks**:

    These are going to be the tools that we are able to use in order to crack some
    of the hashed passwords that are found on the system that you have, and they can
    be successful when used well. the tools that have this one will be fast compared
    to the other two options that we talked about.


    The biggest downfall that we are going to see is that this one is able to crack
    any password as long as it is 14 or fewer characters. If the passwords are longer,
    then you are going to run into some trouble. But this is also a good way to protect
    yourself from this kind of attack.


    When we encrypt our passwords, there are still some chances that the hacker can
    use some of the tools above in order to break in and get the information that
    they would like. But for the most part, you will find that working with this encryption,
    using a secure network, and making sure that the password is strong and difficult
    to guess will be one of the best ways to make sure that the hacker is not able
    to get onto your own personal network at all.


    ## Other Methods to Crack Passwords


    One of the best ways to get ahold of the passwords that you need is to make sure
    that you are able to access the exact system that you would like to use.


    Of course, since we are hacking, it is likely that this is not a possibility to
    work with, and you will need to resort to Plan B to make it work.

