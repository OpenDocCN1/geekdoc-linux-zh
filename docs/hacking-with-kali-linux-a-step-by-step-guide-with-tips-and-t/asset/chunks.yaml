  trans: "\n在这一过程中，进行简单的关键词搜索会让生活变得容易得多，但这还远远不够，而且你不应该仅仅停于此，否则你将错过一些关于你和你的网络的非常重要的信息。\n\
    \n你需要花费一些时间深入挖掘，并进行一些更高级的搜索，以获取这些信息。\n\n做笔记并对其进行进一步检查也是完全可以的，以确保你能够真正看到那里的内容，并学习如何尽可能地减少这些信息。\n\
    \n## 开始映射网络\n\n一旦我们花了一些时间进行深度研究，并观察黑客能够关于我们自己、我们的网络以及我们的公司学到什么，现在是时候开始处理之前讨论过的某些伦理黑客操作了。\n\
    \n请记住，一个连接了大量设备和信息的网络总是需要更多工作来保护。\n\n这是因为有许多人必须使用它，而你必须始终确保不会有一台或多台设备因使用不当而被黑客接管。\n\
    \n在游戏的这个阶段，我们将花费时间来梳理并绘制我们正在使用的网络地图。\n\n这是一个重要的步骤，因为这将更容易看到你的系统或网络的足迹是什么，以及它为其他感兴趣查看的人留下了什么。\n\
    \n开始这项工作的一个好地方是一个名为 `Whois` 的网站。\n\n这个网站最初的设计目的是帮助公司确定他们喜爱的域名是否可用，或者是否已被占用。\n\n\
    但现在，它也是了解更多关于特定域名所有者和注册信息的好地方。\n\n如果你浏览这个网站并对你拥有的域名进行域名搜索，如果你的名字出现了，那么关于你公司的联系信息（至少包括姓名和电子邮件地址）在这个网站上被展示的概率就会增加。\n\
    \n你需要了解这些信息，以便采取恰当的步骤将其关闭，并确保它不会影响到你业务的运行。\n\n`WhoIs` 网站能够为我们提供大量信息。\n\n例如，它将向我们显示你查询的特定域名上找到的所有\
    \ `DNS` 服务器信息，以及一些关于你正在使用的服务提供商将提供的技术支持的有用信息。\n\n这并不是我们进行研究以查看世界上广播了关于我们业务信息的唯一地方。\n\
    \n我们还可以查看一个名为 `DNSstuf` 的网站。\n\n这个网站将向我们展示更多关于我们自己域名的信息，查看它以了解其他黑客能看到关于你的什么是非常重要的。\n\
    \n我们在这里能够看到的其他一些信息将包括：\n* 关于主机如何处理该特定名称的所有电子邮件的信息。\n* 所有主机位于何处。\n* 关于域名注册的一些对黑客可能实用的通用信息。\n\
    * 关于这是否带有垃圾邮件主机的信息。\n\n这只是你可以访问的以寻找其中一些信息的网站之一，检查其中的几个网站是一个好主意。\n\n这有助于对你的域名和公司可能在网上泄出的信息有一个良好的开始，但还有其他几个你应该检查的地方，包括：\n\
    \n`Google Groups` 和论坛是你进行某些工作时需要小心的地方之一。\n\n这些地方连同其他论坛一起，可以是黑客进行搜索并了解更多关于你网络的绝佳场所。\n\
    \n事实上，你可能会对这些论坛上关于你业务的可用信息种类感到意外，尽管你并不是那个在那里发布帖的人。\n\n取决于有人尝试在这里发布什么类型的信息，你可能会在网络安全方面遇到很多问题，因为黑客或其他人可能会发布用户名、`IP`\
    \ 地址、`domain names` 以及更多等内容。\n\n这里的好消息是，如果你在大多数论坛上发现了这类信息，你可以请求他们将其删除以保护你的安全。\n\
    \n你需要能够提供你的证明来说明你为什么想要删除这些内容，但这可以帮助你确保随之而来的安全问题尽可能降到最低。\n\n## 系统扫描的重要性\n\n当你完成上述我们花费时间完成的一些步骤时，你现在应该已经看到，目标是确定会有多少关于你的网络和系统信息在网上被发现，这将让你更好地了解黑客可能去哪里寻找收集所需的信息，然后开始对你发起攻击。\n\
    \n我们在这里必须记住，这是一个过程，它需要一些时间。\n\n黑客会非常小心，并确保他们的研究是详尽且深入的，你也需要这样做。\n\n但当你找到所需的信息后，你就可以进行系统扫描了，以确保系统和网络是安全的，并且所有的潜在漏洞都得到了处理。\n\
    \n这些扫描将非常有用，并会显示你的系统中发现的一些不同漏洞。\n\n这些是你维护网络并保持其安全的最佳方法之一。\n\n你可以选择的帮助保护你网络的不同扫描包括：\n\
    \n1. 像我们上面讨论的那样访问 `Whois`，然后查看主机名和 `IP addresses`。\n   查看它们在这个网站上是如何布局的，你也可以花时间核实上面的信息。\n\
