    # 引言


    使用 Kali Linux 进行黑客攻击

    分步指南：包含技巧和诀门，帮助你成为专家黑客、创建你的键盘记录器、创建中间人攻击并规划你自己的攻击


    祝贺你购买，感谢你的支持。接下来的章节将讨论你入门所需的所有知识。首先，我们将花一些时间看看黑客攻击的好处，以及为什么当你准备好开始时，这是最好用的操作系统。我们还将查看我们能够执行的一些方法。


    对 Kali Linux 了解得越多，在实际开始某些操作时整体上就越容易。我们将探讨成为伦理黑客的一些好处，以及我们对伦理黑客需要了解的基础知识。考虑到这些，是时候进入我们能够进行的代码编写了。


    有很多选项供选择。我们假设每个尝试这种类型的黑客攻击的人都是为了获取利益而窃取个人和财务信息。虽然有很多黑客以这种方式工作，但伦理黑客是友好的，因为他们会帮助其他网络，或者在这个过程中确保他们自己的网络也是安全的。


    从那里开始，在实际操作之前，是时候规划我们自己的攻击。我们将查看如何创建键盘记录器，然后如何添加截图保存功能，使这两种攻击都比现在更高效。我们还将学习如何编写自己的破解密码代码，以及如何使用
    Kali Linux 操作系统来实施中间人攻击，无论是被动攻击还是主动攻击。本指南的结尾将最后介绍为了成为黑客专家而需要遵循的一些技巧和诀门。这些技巧可以确保我们能够进入并离开目标系统（即使是自己的系统），而不会有人察觉到我们在那里。记住，作为一名黑客，如果有人注意到你在网络上，而你本就不该在那里，那么你在这个网络上就走到了尽头。而这对于任何黑客来说都不是一件好事。


