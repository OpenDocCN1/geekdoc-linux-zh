- fmt: '

    Doing a simple keyword search would make life a lot easier in this process, but
    it is not going to be enough, and you should not stop right there, or you will
    miss out on some really important things about you and your network.


    You need to spend some time going deeper and do some searches that are more advanced
    in order to figure out this information as well.


    It is just fine to take note and look it over a bit more as well to ensure that
    you are able to really see what is there and learn how to reduce it as much as
    possible.


    ## Getting Started on Mapping the Network


    Once we have had some time to do a bit of deep research and look around at what
    a hacker would be able to learn about us and our networks and our companies, it
    is time for us to work on some of that ethical hacking that we talked about before.


    Remember that a network that has a ton of devices and information hooked to it
    is always going to take more work to protect.


    This is due to the fact that it has so many people who have to use it, and you
    have to always ensure that one or more devices have not been taken over by a hacker
    because the devices are not being used well.


    At this stage of the game, we are going to spend some time going through and mapping
    out the network that we are using.


    This is an important step because it is going to make it easier to see what the
    footprint is to your system or network, and what it is leaving behind for others
    who are interested in seeing.


    A good place to start with this is a website known as `Whois`.


    This was a website that was designed in the beginning to help companies figure
    out whether a domain name that they liked was available or if it was in use already.


    But now it is also a good place to go to learn more about the owners and registration
    that comes with a specific domain name.


    If you go through this website and do a domain name search for the domain name
    that you own, and your name does show up, then this is going to increase the chances
    out there that the contact information about your company, including names and
    email addresses at the very least, are being shown off on this website.


    You need to know this information so that you can take the proper steps to shut
    it down and make sure that it does not affect what is going on with your business.


    There is a lot of information that the `WhoIs` website is able to provide to us.


    For example, it is going to show us information about all of the servers of `DNS`
    that are found on a particular domain name that you are looking up as well as
    some information that could be useful about the tech support that the service
    provider you are using will provide.


    This is not the only place where we are able to do some research to see what information
    is being broadcasted to the world about our business.


    We can also take a look at a site that is known as `DNSstuf`.


    This one is going to show us even more information about our own domain name,
    and it is important to take a look at it to see what other hackers are able to
    see about you.


    Some of the other information that we are going to be able to see here will include:

    * The information about how the host is able to handle all the emails for this
    particular name.

    * Where all of the hosts are located

    * Some of the general information that can be useful to a hacker about the registration
    for the domain.

    * Information about whether this has a spam host with it.


    This is just one of the sites that you can visit to find out some of this information,
    and it is a good idea to check out a few of these.


    This helps to give a good start on the information that may be out online for
    your domain and your company, but there are a few other places that you should
    check out including:


    `Google Groups` and Forums is one place that you need to be careful about when
    doing some of your work.


    These can be a great place, along with some of the other forums out there, for
    hackers to do some searching and learn more about your network.


    In fact, you might be a little bit surprised about the kind of information that
    is available on these forums about your business, even though you were not the
    one posting there.


    Depending on the kind of information that someone tried to post here, you could
    end up with a lot of issues with the security of your network because a hacker
    or someone else could post things like usernames, `IP` addresses, `domain names`,
    and more.


    The good news here is that if you do find this kind of information on most forums,
    you will be able to request that they get removed for your protection.


    You will need to be able to show your credentials as to why you would like these
    removed, but it can help you to make sure that the security issues that come with
    this are kept to a minimum as much as possible.


    ## The Importance of a System Scan


    As you go through some of the steps that we have spent time on above, you should
    see by now that the goal is to figure out how much information about your network
    and system will be found online, which will give you a better idea of where a
    hacker is likely to look to gather the necessary information and then start an
    attack against you as well.


    We have to keep in mind here that this is a process, and it is going to take some
    time.


    A hacker is going to be careful and ensure that their research is thorough and
    in-depth, and you need to do this as well.


    But when you are done finding the information that you need, you will then be
    able to do a system scan in order to ensure that the system and network are safe
    and that all potential vulnerabilities are taken care of.


    These scans are going to be so useful and will show some of the different vulnerabilities
    that are found in your system.


    They are some of the best ways that you are able to take care of the network and
    keep it protected.


    Some of the different scans that you are able to choose to help protect your network
    will include:


    1. Visit `Whois` like we talked about above and then look at the hostnames and
    the `IP addresses`.

    See how they are laid out on this site, and you can also take the time to verify
    the information that is on there.

    2. Now it is time to scan some of your internal hosts so that you can see what
    users are able to access the system.

    It is possible that the hacker could come from within the network, or they can
    get some of the credentials to get on from an employee who is not careful, so
    make sure that everyone has the right credentials based on where they are in the
    company.

    3. The next thing that you will need to do is check out the `ping` utility of
    the system.

    Sometimes a third party utility will help with this so that you can get more than
    one address to ping at a time.

    `SuperScan` is a great option to use.

    You can also visit the site `www.whatismyip.com` if you are unsure about the name
    of your `gateway IP address`.

    4. And finally, you need to do an outside scan of your system with the help of
    all the ports that are open.

    You can open up the `SuperScan` again and then check out what someone else may
    be able to see on the network with the help of `Wireshark`.


    These scans are going to be good to work with because they will help us find our
    `IP address` by sending out a signal online and what hackers may be seeing if
    they try to get onto your own system.


    You will find that a hacker when they are trying to gain access to your system,
    will use the same steps that we just did to get in and steal the information that
    they would like as well.


    The point of doing some of these scans and checking back in on a regular basis
    is to help find some of the places where the hacker may be able to get into your
    system, and then close up those vulnerabilities to help keep the system safe.


    Once you have a better idea of how the hacker is going to get into the network,
    it is a lot easier to learn the exact way that the hacker is likely to target
    your network.

    '
