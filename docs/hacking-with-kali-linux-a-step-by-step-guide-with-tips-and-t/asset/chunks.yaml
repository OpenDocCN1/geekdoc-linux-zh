    `This` 可以帮助你真正确保黑客无法获取你的个人信息。


    键盘记录器（Key logger）是黑客获取所需信息的一种非常有效的方法，特别是当它与其他几个可以帮助获取更多信息的进程结合时。


    让我们来看看你如何将 Python 和 Linux 操作系统结合起来以制作你自己的键盘记录器，无论你是在自己的电脑还是另一台电脑上使用，以及你如何有效地使用它来记录目标计算机上所有的击键。


    ## 如何制作键盘记录器


    现在我们已经花了一些时间讨论了键盘记录器及其工作原理，以及它的一些优点，现在是时候我们开始工作了。


    我们将使用 Python 和 Kali Linux 系统，来研究如何让这个键盘记录器满足我们的一些需求。


    正如我们之前提到的，这个键盘记录器仅仅是一个专业黑客可以设置的程序，用于帮助他们监控用户在计算机上运行的按键。


    这些信息将根据你设置的存储位置，存储在你的电脑的某个文件中。


    例如，如果你想知道当别人借用并使用你的电脑时（而你不在时）他们在做什么，你可以开启这个键盘记录器并用它来监视他们。


    当用户在那台电脑上时，他们可以随意打字并像照常一样操作。


    但所有这些信息都会秘密地存储在你电脑的一个文件里，你稍后可以查看。


    用户完全不知道这些操作正在后台进行，但你可以在方便的时候检查，他们是否访问了某个你可以信赖的合法网站，或者是否有某些原因你不应该再次允许他们使用你的电脑了。


    不过，许多黑客喜欢在另一台电脑上使用这种工具，因为。


    这允许他们追踪目标并弄清楚目标访问了哪些地方。


    如果操作得当，并且我们使用了在下一章中讨论的屏幕截图保存器，这将使得黑客收集他们想要的信息变得容易得多。


    这可能包括访问的网站、用户名、在这些网站使用的密码等更多内容。


    考虑到这一点，是时候我们开始检查并实际动手创建我们自己的键盘记录器了。


    我们将查看下面的代码，以研究我们如何借助 Python 编程语言的帮助创建我们自己的键盘记录器：


    对于这个特定的 Python 编写的键盘记录器，你将使用 `pyxhook`，这意味着你需要安装 `python-xlib` 来获取让该程序运行的所有内容。


    如果你电脑上还没有 Python 以及 Linux 操作系统，你至少需要安装这个库才能开始。


    存储所有所需文件的良好位置是 GitHub 仓库，这样它们就集中在一个地方了。


    你可以通过简单执行命令来安装 `git`：


    ```

    sudo apt-get install git

    ```


    一旦你在电脑上安装了所有的 `python-xlib` 和 `git` 并准备就绪，就是时候执行正确的命令来让键盘记录器启动并运行了。


    你将需要执行的代码和命令包括：


    ```

    aman@vostro: ~$ git clone https://github.com/hiamandeep/py-keylogger.git

    Cloning into ‘py-keylogger’…

    remote: Counting objects: 23, done.

    remote: Compressing objects: 100% (21/21), done

    remote: Total 23 (delta 9), reused 0 (delta 0), pack-reused 0

    Unpacking objects: 100% (23/23), done.

    Checking connectivity… done.


    aman@vostro: ~$ cd py-kelogger/

    ```


    现在需要注意的一点是，在进入并运行程序之前，你需要打开 `keylogger.py` 文件，然后将 `log_file` 变量设置为正确的路径，或者你想要使用的日志文件路径。


    你应该给它一个绝对路径，以便它确切知道自己应该去哪里。


    例如，你可以给它一个路径名为：


    `/home/YourUsername/Desktop/file.log`


    （使用这个，你需要将 YourUsername 替换为你电脑的实际用户名，以便操作）。


    现在，当我们进行到这一步时，你会发现键盘记录器已激活，它将开始遍历并记录使用你电脑的人或在目标计算机上操作时的击键。


    请记住，你可以在日志文件区域搜索这些内容。


    要查看它们，你只需要按下反波键（grave key），记录器就会停止记录，然后你可以去日志文件查看其中的内容。


    务必记住，在完成后关闭键盘记录器。


    如果你不停止键盘记录器，那个文件会变得很大，因为它也会记录你的击键。


    你只需要点击一下反波键即可，它就可以供你离开了。


    不过有一点注意，如果你使用反波键，它和大多数键盘上的 Esc 键是一样的。


    在设置好这一切之后，你还希望确保在用户关闭它时程序不会立即停止。


    Linux 实际上让这种操作变得更容易，你只需要输入以下代码：


    ```

    python /home/aman/py-keylogger/keylogger.py

    ```


    再次，我们必须记住，创建一个文件路径是非常重要的，这样计算机才知道它在哪里。


    ## 理解键盘记录器的工作原理


    现在，到本章为止，我们一直专注于编写代码并将其设置为以处理我们想要的一些键盘记录工作。


    这是一个很好的起点，如果你只想编写代码并将其放置在目标电脑上，那么你就准备好了。


    但作为一个想要进步并学习原理的优秀黑客，我们需要能够查看代码的各个部分并理解它们的含义。这就是我们在这一节中要花时间做的事情。


    尽管如此，最好的想法始终是去学习你所编写代码的基础。


    这有助于我们更好地理解刚刚所做的工作，并让我们以后在编写任何需要的代码时变得更容易。


    在我们处理的代码开头，我们将从导入一些编写代码所需的模块开始。


    对于这种情况，我们只处理了 `pyxhook` 模块来编写我们需要的代码，所以目前我们唯一需要的就是这部分。


