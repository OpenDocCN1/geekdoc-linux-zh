- fmt: '

    To do all of this, we need to work with the `change directory` command or the
    `cd` command.


    This `cd` command is going to allow us an easy method to go through and navigate
    our way to the top of the structure of the directory as it is needed.


    The code that we will want to rely on to make this happen will be below:


    ```

    bt > cd ..

    ```


    you will need to add in the double dots because it is going to tell the program
    that you want to be moved up by one level inside of the directory tree.


    This one is a bit different than what you will find with the `pwd` command. With
    the `pwd` command, you will find that the system is going to take you all the
    way back to the beginning. But when you are using the `cd ..` command, you are
    going to ask the system to just take you up by one level. This makes it easier
    to go between pages or parts of the system without having to start all the way
    up at the top again.


    ## A Look at the Whoami Command


    And the final command that we are going to take a look at is the `Whoami` command.


    This one is going to be a bit different than the others, but it is going to be
    used by the programmer when they would like to take a look at which user they
    are currently logged in as in the system. If you are on a network that has more
    than one user that can be logged on, whether they are invited to be on the network
    or not, you would want to work with this command to get a better idea of who is
    logged in at what time. This is a good way to also see which permissions you are
    personally allowed to use, or what other users are allowed to do on the system.


    When we are talking about some of the different things that come with white hat
    hacking, this is going to be a great way to get your hands on a lot of information
    that is valuable and close up some issues if you find that there are a lot of
    people at once who want to access the information. But on the other hand, when
    we take a look at one of the black hat hackers, we are looking at how to use this
    so that we can get onto a network and cause issues without anyone really being
    able to detect that we are even there.


    So, to help us do all of this process and learn which user you are logged in on
    that system, the code is going to be simple. You will need to just type in the
    code of `bt > whoami`.


    This is going to be a great place to start because the result will be the name
    of the user you are logged in as at that time. If you see that the name that comes
    up as `root`, know that this means that you are the main computer on the network,
    or just your main computer if you are the only computer on the network at the
    time.


    Many of the commands that come with the Linux system, and the `commands` that
    we took a look at in this guidebook, are simple to work with and learn, and executing
    them will be even easier. But the point of learning how to work with these is
    to help you to see more about the Linux system and how we are able to handle them
    together.


    If you plan to work with Mac or Windows operating system, then you will feel at
    home when it is time to work with the Linux system because it is similar to the
    other ones and there are a lot of times when you will find other parts you are
    used to working with. However, you will find that this one does rely on codes
    a bit more than you may be used to in the past, and you have to get used to working
    with that as well. But learning some of the coding and where all of the parts
    that are found in the new system, as well as having a good place before you get
    started with some of the hacking that you would like, you will be able to get
    Linux to work how we want.


    Try out a few of these different parts and look at some of the `commands` that
    we did above, and you will find that this will be an easy option to work with
    in order to get your hacking done. Of course, there are a few other `commands`
    that we are able to learn more about as we go through this kind of operating system,
    and this is part of what makes it such a great one to learn about.


    In addition to some of the codes and `commands` that we talked about above, we
    also need to take a look at some of the `commands` below to see what else we are
    able to do with this system for our hacking needs:


    - `ls`: This is short for the list. This will list the current folder or directory
    contents, whether it is a folder or a file, where these contents run from.

    - `cd`: this one moves from one directory over to another.

    - `sudo`: this allows a permitted user to execute a new command to another user.

    - `mkdir`: this one allows you to create a new directory or a new folder with
    a name and a path.

    - `cp`: this one is short for a copy. It is going to copy a file that is in one
    location and move it to another.

    - `mv`: this one will move a file from one location and place it in another.

    - `tar`: this one is going to store and then later extract the files from the
    archive called `tar`.

    - `gzip`: this one is going to compress the files. It works pretty similar to
    what you will find with the `.zip` files in Windows.

    - `gunzip`: this one is going to decompress a file that you have already compressed
    with `gzip`.

    - `ifconfig`: this one is going to show the network interface used, and it can
    also configure to a network interface.

    - `ping`: this one is often used in order to check if another system is currently
    reachable.


    # Chapter 5: How to Map Out Your Own Attacks


    We have spent some time already in this guidebook trying to take a look at some
    of the basics that we need in order to get the Kali system set up and ready to
    go. That is all-important, but it is likely that your main goal in reading this
    guidebook is to figure out some of the basics that you need in order to actually
    complete some of the attacks that are needed on your network.


    And the first thing that we are going to explore in this arena is going to be
    the basics of how to map out your own hack. Once we have taken the time to gain
    a bit of knowledge about what is needed to start out with a new hack, it is time
    to figure out our game plan for actually doing the attack.


    Every hacker should have some plan of attack, or some idea of what they would
    like to do when they start out with an attack, and even where they think the vulnerabilities
    are most likely to show up. You never want to go in blind. This will cause you
    to mess around and spend too much time in some part of the network, and then it
    is more likely that another person is going to find you out. This is why having
    a plan, and sticking with it is going to be one of the best ways to ensure that
    your network is staying safe for the long term.


    The more that we are able to learn about your network ahead of time, the more
    successful this kind of attack is going to be for you. You need to get into the
    eyes of the hacker, learn what works the best for them, and what information they
    are able to learn about your network just by doing some searching online. We need
    to spend some time looking through this and figuring out the same information
