  md: '# CHAPTER 4 WIRELESS PASSWORD ATTACKS


    ```

    [-de DEAUTH_ESSID] [-p PHISHINGSCENARIO] [-pk PRESHAREDKEY]

    [-hc HANDSHAKE CAPTURE] [-qi] [-ic] [-le LURE10_EXPLOIT]

