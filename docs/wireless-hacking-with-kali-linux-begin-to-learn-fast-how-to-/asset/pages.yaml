  md: '# CHAPTER 9 DECRYPTING TRAFFIC WITH WIRESHARK


    If you know the key that was used to encrypt the wireless traffic, you can use
    it to decrypt it. To decrypt any wireless traffic, use the Wireshark tool, followed
    by a few simple steps.


    To begin, open a previously captured packet capture in Wireshark. Then, using
    that capture, filter out only the data frames, because it is the only data frames
    that we want to decrypt and examine.


    Then you can examine the encryption method that was used to encrypt the data to
    ensure that you are using the correct key. Then, in Wireshark, enter the decryption
    key and use that key to decrypt the data.


    Let''s start by opening the previously captured packet capture. To filter what
    you have captured, make sure you only look at the data packets. To be able to
    view only data packets, you must first understand how to use the filters in Wireshark,
    so the rest of this chapter will concentrate on basic filtering options that,
    once mastered, will make decrypting data packets simple.


    A filter is a method of filtering out your packets when you are starting packets,
    you will receive a large number of packets, 99 percent of which you do not care
    about.


    For example, you don''t care about UDP traffic or even the majority of TCP traffic.
    Perhaps you''re just interested in what websites you visit and need to figure
    out how to filter out all the extra packets, and you want to focus on one thing
    rather than looking at everything you''ve captured.


    Filters are classified into two types. The first is a display filter, and the
    second is a capture filter. The display filters are located where there is a blank
    space next to the word "Filter," but if you want to go to capture options, your
    capture filters are located there as well. To get there, first, select "Capture,"
    then "Options."


    If the you''re looking at other things like UDP or TCP traffic and you want to
    filter them out, you can type "HTTP" into the display filter and click "apply,"
    which will remove everything else and display only the HTTP packets.


    Because the display filter is fairly, you may be wondering what a capture filter
    is for. So, if you open the capture filter and filter by HTTP, that means during
    your capture you were listening for traffic, it wouldn''t log anything else except
    HTTP traffic for you.


    So, the capture filter is what you want to log, and the display filter is everything
    you want to see. Sometimes that confuses people because they looked at the data
    that hasn''t been filtered yet, but for some reason, they don''t see any UDP traffic,
    for example.


    That''s because, if you go back to your capture options, you''ll notice that you
    never logged any UDP traffic at all. So I just wanted to point out that the capture
    filter and the display filter are not the same.'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'What you log and what you see in your results are not the same thing. With
    that said, let''s get started figuring out how to use these filters.


    To begin, click the "filter" button on the left to see some of the most commonly
    used display filter options.


    To keep things simple, let''s say you only want to see "HTTP" traffic.


    All you have to do is select it, then apply it, and then OK. However, when you
    change your mind and decide that you only want to see "DNS" traffic. Click on
    the "Filter" option once more, select "Non-DNS," then apply it and OK.


    Except for DNS-related packets, you are now inspecting every single packet. This
    is one method for displaying the most common ports, but you can also manually
    enter it into the display filter.


    If you''ve ever looked through the available options and want to filter specific
    traffic only it isn''t within the common filters and you want to write your own
    and you''re thinking it''s probably going to be very complicated and you don''t
    know what to do, it''s very simple.


    For example, you may only be interested in "HTTP GET" traffic. You do not want
    to see "posts," "delete," or "update" packets; instead, all you want to see "HTTP
    GET" traffic.


    What can you do is typing `http.request.method == "GET" into your display filter.


    Then press the apply button. You may be thinking that it makes no sense and that
    you will forget it, but here''s the thing. You don''t have to remember this because
    Wireshark will help you type it correctly. How does it accomplish this?


    When you start typing that is not a valid filter, it will be displayed in red,
    which means that the background of your display filter will turn red instead of
    green.


    For example, if you try filter by "H," Wireshark will turn your display filter
    red because it knows means nothing.


    However, whenever your filter is a valid and the letter you''ve already typed
    in works, it will light up in green.


    As a result, it''s a good indicator that you don''t have to guess or not your
    filter is valid, because it tells you right when you type the letters.


    Moving on, if you ever want to clear your results, simply hit "clear." If you
    click on the "expression" button, a window will appear with various types of filters
    that you have previously created.


    You can filter your packets using a variety of methods, which brings me to the
    next point: now, for example, if you want to filter your packets for "GET" but
    also see "POST" packets, this is what you can do.


    ```

    "(http.request.method == POST) || (http.request.method == GET)"

    ```'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'So you can surround with parentheses, and if you''re familiar with programming,
    this will be second nature to you. Holding down the shift key (above the enter
    key on your keyboard) and using two of those pipe symbols results in the "or"
    command.


    Then, as shown above, "POST" filter next to it to filter packets that use both
    GET and POST, then hit.


    If you want to use "and", it will look at two parameters, and you can do so by
    typing the following command: "(http.request.method == GET) && (http.request.method
    == POST)"


    So, whenever you need to use multiple conditions, use pipe, which means "or" or
    "&". If you use "or", it will be displayed if any of these conditions are met.


    Another example: if you only want to see "GET" packets with length greater than
    200, you may apply both conditions. These are the fundamentals of filtering


    Now that you''re familiar with display and capture filtering, it''s time to catch
    the wireless password. Because we''re looking for a password, look for traffic
    that contains the words "username", "user password", or "pass". But how are you
    going to do it?


    So, within Wireshark, to "edit", then find the "packet", and change the "display
    filter" to "string",


    Then, change "packet list" to "packet byte". This is because Wireshark has three
    windows. The packet list is displayed in the first window at the top. The "details"
    window is in the middle, right below the packet list the "packet byte" window
    is at the bottom.


    Because you selected packet bytes, Wireshark will find anything that matches the
    phase "pass" within the "packet bytes" window, but it will also highlight the
    packet that matched it within the top window, which is your "display filter".


    What was sent from the client to the server is shown in red within this stream.
    The login username is the word immediately following the word "USER," and the
    password is the word immediately following the word "PASS."


    This is a simple method for using Wireshark to capture passwords in clear text,
    but there are other tools available that make this much easier, as Ettercap, which
    we will discuss in the next chapter.'
  merge: -1
