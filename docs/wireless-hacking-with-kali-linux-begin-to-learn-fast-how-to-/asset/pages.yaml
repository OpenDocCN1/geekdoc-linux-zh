  md: '# CHAPTER 32 SUMMARY OF WIRELESS AUTHENTICATION METHODS


    In conclusion, we have covered the fundamentals of 802.11 authentications. We''ve
    discussed how the original specifications defined open authentication as well
    as WEP authentication.


    WEP had several flaws, which prompted the IEEE to create the 802.11i specification.
    The first is 802.11i uses the IEEE EAP protocol to allow authentication messages
    to be sent from a station to a AAA server, such as a RADIUS server.


    It also introduced 802.1X port-based authentication, in which the port is blocked
    and only authentication traffic is allowed to pass until the user is authenticated.


    The Wi-Fi Alliance is in charge of developing certification programs to ensure
    compliance with IEEE standards. WPA is the name of the certification program that
    ensures conformance to the IEEE 802.11i specifications.


    WPA2 is available in two flavors: WPA2 Enterprise and WPA2 Personal. WPA2 Enterprise
    is also known as WPA2-11X. This is because WPA2 Enterprise is designed for large
    organizations that have deployed a AAA server as RADIUS.


    WPA2 Personal is intended for organizations that have yet to deploy a AAA server.
    This is appropriate for the domestic market, small businesses, and possibly hotspot
    locations.


    How are you going to apply what you''ve learned? So, I have a few suggestions
    for you. The first is related to legacy equipment.


    Do you still have legacy equipment in your organization that uses open authentication
    or WEP authentication?


    The questions you should be asking, "Can I remove these devices and disable WEP
    authentication?" If you can''t, make sure that devices connecting over open or
    WEP authentication cannot access the more secure parts of your corporate network.


    You can accomplish this by establishing VLANs and VLAN access control lists. Finally,
    if you still have devices that require open or WEP authentication, you may want
    to supplement them with MAC authentication as well.


    We''ll get to in a minute. My second suggestion is to ensure that your clients
    are capable of supporting both the EAP protocol and the preferred authentication
    protocols that you intend to use to authenticate these devices and users onto
    your network.


    For example, you may want to use PEAP and MSCHAP to authenticate Windows-based
    clients, but TTLS to authenticate non-Windows-based clients.


    Once you''ve determined which protocols you want to be able to use for authentication,
    you must develop a policy for how clients will be updated to ensure compliance
    with those protocols as part of your Wireless security policy.'
  merge: -1
  pgno: 101
- img_proc: true
  md: 'My final recommendation is to use 802.1X port-based authentication if you work
    in a large organization. This necessitates the installation of a AAA server.


    There may be situations where this is simply not possible, and you will have to
    use WPA Personal. In those cases, I recommend adding an extra layer of security
    by using a VPN, either an SSL-secured VPN or an IPsec-secured VPN.'
