  md: '![](img/abf67bc4e6e070a58e899f91094d3973_75_0.png)


    So far, we''ve discussed physical security and the possibility that our access
    points will be in public places. Many times, we do not consider that we are unable
    to secure those networks because they are not behind locked doors.


    We then investigated rogue access points and Honeypots. They can have a significant
    impact on network performance by causing interference, and in the worst-case scenario,
    they can allow people into your network who do not have access to it.


    Finally, we looked at the denial of service attacks, and you now know how to carry
    them out as well. On the physical layer, we can launch a denial of service attack.


    We can also launch a denial of service attack against the higher frame and packet
    layers. How do you put what you''ve learned to use and move forward?


    I have a few suggestions for you. The first suggestion is to have a security policy
    in place that defines whether or not employees can bring in access points and
    operate them in the corporate environment.


    Remember that many smartphones and laptops can now function as access points,
    and your employees may be unaware when they enable that functionality and allow
    other devices to connect to that hotspot, they may be implementing a rogue access
    point.


    As a result, it''s critical to have a policy in place and educate your users on
    that policy and what a rogue access point is.'
  merge: -1
  pgno: 75
- img_proc: true
  md: 'The second suggestion is to make sure you understand what normal behavior on
    your wireless network entails.


    If you know how many authentication and association requests you normally receive
    in an hour, and you suddenly notice a fluctuation in the number of authentication
    and association requests, you''ll be able to detect an attack on your network.


    Understanding what constitutes normal behavior allows you to detect when something
    out of the ordinary occurs on your network. When looking for anomalies, keep in
    mind to examine all layers of the protocol stack, including the physical layer.


    Consider the following: what is the normally expected amount of interference?
    What is the normally expected number of corrupted frames and retransmissions?


    My final piece of advice is to ensure that the IT staff understands how the wireless
    physical layer works. Many people believe wireless is similar to magic, that it
    just happens.


    When troubleshooting a problem, such as when a user cannot connect to the network
    or why they''re dropping voice calls while roaming, these issues must be investigated
    not only at the higher layers to see where the packets are going, but also at
    the physical layer.


    Many people are concerned about the physical layer because they are unfamiliar
    with the concept of waveforms traveling through the air carrying your data. As
    a result, it is critical that you, as an IT professional, have a solid understanding
    of the wireless physical layer.'
  merge: -1
  pgno: 76
- img_proc: true
  md: "# CHAPTER 23 BASIC ENCRYPTION TERMINOLOGY\n\n![](img/abf67bc4e6e070a58e899f91094d3973_77_0.png)\n\
    \nAnyone within a reasonable distance of your wireless network will be able to\
    \ capture the signals\n pass through the air and convert them back to 1s and 0s.\
    \ Encrypting your data is the best\\way to prevent it from being eavesdropped\
    \ on.\n\nWhen they convert those signals back to 1s and 0s, they are unable to\
    \ see any meaningful data.\nWe'll start with some definitions to help you understand\
    \ encryption.\n\nTo begin, we must distinguish between encryption and cryptography.\
    \ Cryptography and\nencryption were once synonymous. They were previously thought\
    \ of in the same way, but we\nnow need to think of them differently.\n\nEncryption\
    \ can be thought of as a process that takes your data, uses some secret information\
    \ to\nmulate and change message so that anyone intercepting that message does\
    \ not have\nthat secret is unable to decrypt it and see the original content of\
    \ that message.\n\nCryptography, on the other hand, has a much broader definition.\
    \ It is concerned with all aspects\nof information security. You couldn't get\
    \ a degree in cryptography back then, but you can now.\n\nWhere you would study\
    \ the mathematics behind algorithms, what makes them difficult, and\nother topics\
    \ such as probabilities, statistics, ring theory, graph theory, and so on.\n\n\
    In this book, we will only look at the encryption that's used in our Wi-Fi networks.\
    \ Returning to the\nsame basic definitions, consider the following scenario.\n\
    \nAssume I wanted to send you a message but didn't want else to know about it.\
    \ Then I'll\nencrypt it with a secret and send it to you, and if you don't have\
    \ the secret, you won't understand\nwhat the message is saying.\n\nThe first message,\
    \ which is in easily readable information format, is referred to as plain text.\
    \ The\ncipher text is the encrypted text that is unreadable unless you have the\
    \ secret information."
