  md: '# CHAPTER 5 WPA/WPA2 DICTIONARY ATTACK


    ![](img/abf67bc4e6e070a58e899f91094d3973_20_0.png)


    To carry out a dictionary attack on a wireless network that is protected with
    WPA or WPA2, we will go through a four-step process.


    First, we need to determine the BSSID of the access point against which we intend
    to launch our dictionary attack. Once we''ve identified the access point to be
    attacked, we must select the wordlist that will be used in the attack.


    A wordlist, as the name implies, is a list of words, similar to a dictionary,
    and we''ll use that list of words to test against the access point.


    The third step will be to generate authentication traffic.


    We need to be able to capture a legitimate user connecting to the access point
    for this attack to work, and we''re going to generate traffic so we can sniff
    it over the air. Finally, we must carry out the dictionary attack.


    We''ll be using Kali Linux for this attack. To do so, you must launch a terminal
    and examine the configuration. When you type "iwconfig", you should see two of
    your wireless LAN adapters.


    Wireless wlan1 should be your device''s integrated wireless LAN card, and wireless
    wlan0 should be your virtualized Kali Linux LAN adapter if you successfully bridged
    your devices.


    This is also the one you will use to carry out your attack.'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'As a result, the first step is to put Kali Linux''s wlan card into monitor
    mode, but before you do so, you must disable your wireless lan adapter by typing
    "ifconfig wlan0 down."


    Then, enter "iwconfig wlan0 mode monitor."


    This command will activate the monitor mode on your wireless LAN adapter.


    However, to ensure that your wireless adapter is operational again, use the command
    "ifconfig wlan0 up."


    Now that your wireless LAN adapter is again, you should confirm that it is in
    monitor mode. To do so, enter the command "iwconfig" into the command prompt.


    Here, you should see it says "Mode," and next to that, the card should say it
    is now in monitor mode. The next step is to determine the BSSID of the access
    point you wish to attack. You will use the Acrack tool for this, so type "airedump-ng
    wlan0" into the command line.


    This will begin the search for broadcasted BSSIDs. You''ll notice that you''re
    capturing the BSSIDs of the nearby access points as well the channels you''re
    using.


    NOTE: Do not compromise your neighbours'' networks, and even worse, do not use
    this tool in a production environment unless you have written permission.


    Returning to Kali Linux, you can exit monitoring by pressing "Ctrl+C" once you''ve
    found the wireless BSSID you want to attack.


    You should also see the MAC address of the BSSID in the Kali output, which is
    usually a 12 character long letter and numbers that you should take because you
    will need that MAC address when you execute the attack.


    The next step is to find a wordlist that you can use to gain access to the access
    point, and Kali has several tools for this purpose. You can also download similar
    tools, but the "Airodump tool will suffice. As a result, you must type: "airodump-ng
    -bssid 00:11:22:33:44:55:66 --channel 1 -write wlan0 cracking"


    NOTE: This is just an example, but where I said "00:11:22:33:44:55:66," you must
    type the actual MAC address of the BSSID you are about to compromise, as well
    the channel for you, which could be channel 6 or channel 11.


    After you have successfully executed the preceding command, you will notice that
    wlan0 network monitoring has begun.


    Under the "data" column, you will see the data transfer. Keep in mind that the
    length of time depends on the complexity of the password. After a few minutes,
    you should have enough data to work with; therefore, open a new terminal and type:
    "ls"


    This will display a list of the files that you have captured thus far. To crack
    the password, execute the following command:


    ```

    "airacking-ng we cracking-01.cap"

    ```


    The filename "we cracking-01.cap" is used as an example here, but you should type
    whatever'
