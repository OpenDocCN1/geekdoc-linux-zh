  md: '# CHAPTER 1 WIRELESS PENTST LIST


    I''d like to give you overview of the wireless tools commonly used by ethical
    hackers and penetration testers. In a wireless network, there are various management
    interfaces and tools to help you manage and monitor, detect rogue access points,
    configure alerts to security breaches, health monitoring, and so on. In this book,
    we''ll look at various access points and how to use a web browser GUI to access
    those access points. We''ll also go over the security settings that you can configure.
    There are also a variety of tools available for traffic analysis. Tcpdump, for
    example, is a well-known packet analyzer. Tcpdump is a command-line utility that
    displays all your TCP/IP packets. Microsoft Net Mon, which analyses traffic and
    deciphers various protocols, is also widely used in Microsoft networks. LanDetective
    is another network sniffer that employs deep packet inspection technology to detect
    malicious traffic, but Ethercap is also capable of detecting man-in-the-middle
    attacks. Other tools, such as NetworkMiner and Fiddler, are also available.


    Wireshark is another tool that will be used in this book. Wireshark is a fantastic
    tool that IT professionals use to analyze both wireless and wired networks. Most
    IT professionals are familiar with Wireshark, and if they work on protocols and
    networking, they would be familiar with it to sniff and capture Wi-Fi traffic,
    display a list of packets, and then open and inspect the packet data for each
    of those packets. Wireshark interprets Is and Os and displays them in a user-friendly
    manner by displaying information such as the SSID or BSSID of other things. Using
