  md: '# CHAPTER 18 HONEYPOT ACCESS POINT


    ![](img/abf67bc4e6e070a58e899f91094d3973_60_0.png)


    Another serious threat is what is known as a Honeypot AP. What exactly is a Honeypot
    AP? So, this is an access point that I have configured to look exactly like the
    access point in your company.


    I may select the same manufacturer and model, and I am certain that I will assign
    it the same SSID, resulting in the same network name. What are the dangers of
    using a Honeypot AP?


    A Honeypot AP, on the other hand, can cause an unwitting person or client to connect
    to it thinking it''s a legitimate access point when, it''s a Honeypot. It''s attempting
    to gain access to information stored on your client or to use your client as a
    means of connecting to a legitimate network.


    How do I go about that? So, if I persuade you that I am a legitimate access point
    for your company, you will attempt to authenticate with my device.


    I can take those messages and forward them to a legitimate access point, and when
    that legitimate access point responds, I can take those messages and forward them
    to a client more.


    So I act as a relay in the middle, relaying your messages back and forth. When
    you start sending'
