  md: '# CHAPTER 26 TKIP BASICS


    To improve Wi-Fi encryption, the 802.11i standard included two different security
    mechanisms. The first is known as TKIP, and it is what we will be looking at now.


    Initially, the main advantage of TKIP was that when vendors attempted to roll
    out improved security systems, TKIP could be implemented without the vendors having
    to change any hardware, either in the client devices or in the access points.


    As a result, we were able to quickly introduce improved security solutions to
    the market. The way TKIP works is that it uses the same RC4 algorithm as WEP,
    but it wraps it to improve the WEP protocol''s vulnerabilities.


    What does it mean to wrap WEP in a wrapper? As we previously discussed, suppose
    I took a key length of 104 bits plus the initialization vector and fed it into
    the RC4 algorithm with your data to encrypt it.


    TKIP alters the generation of the RC4 104-bit key as well as the WEP initialization
    vector. The wrapper generates a 128-bit per-packet key, which is split into the
    104-bit RC4 key and the 24-bit WEP initialization vector key, which is then fed
    into the RC4 algorithm.


    The important thing to notice here is that the key changes with each packet.


    How does it differ per packet? That per-packet key is generated by the input.
    The first is the temporal key, followed by the session key, which changes each
    time the user uses a new session.


    The source MAC address is also fed into TKIP. Inputting the source MAC address
    means that the key will be unique for each user who connects to the network.


    Each packet also includes a 48-bit sequence counter, which is incremented each
    time a new packet is transmitted. Because the sequence number is incremented,
    each packet has a unique key.


    Because the sequence number has changed, the receiver will reject the fraudulent
    frame because it is not the correct sequence number. To summarise, TKIP wraps
    WEP by changing the keying information that feeds into the RC4 algorithm rather
    using a static 104-bit key plus a 24-bit initialization vector.


    TKIP generates a key for each packet. That per-packet key is generated using a
    temporal key, which changes each time the user associates with the Wi-Fi network,
    implying that these keys are no longer static, but dynamic.


    It uses the source MAC address, which means that these keys are unique for each
    user connected to the Wi-Fi network, and it employs a 48-bit sequence counter,
    which not only increases the'
  merge: -1
  pgno: 84
- img_proc: true
  md: 'initialization vector from 24 bits to 48 bits by employing a sequence counter
    that increments with each packet, implying that each key is unique for each packet,
    but it also protects against relay attacks.


    Once the per-packet key has been generated, the 128 is divided into 104 bits and
    24 bits, and the same feed is fed into the RC4 algorithm as the keying material.


    As a result, you should understand that I haven''t fundamentally changed the hardware
    on which the RC4 algorithm operates; rather, I''m changing the keying material
    that feeds into that algorithm is generated. As a result, I can make the switch
    to TKIP as a firmware upgrade, which addresses many of the WEP protocol''s flaws.


