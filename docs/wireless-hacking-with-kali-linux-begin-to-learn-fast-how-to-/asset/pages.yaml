    address on the authentication list.


    Another option is that the station that is connecting must pass MAC authentication,
    and only if it passes MAC authentication will it proceed to 802.11i.


    From an administrative standpoint, this means you must keep a list of MAC addresses
    for each device that you want to connect to your network.


    Large organizations will use MAC authentication as well as 802.11i authentication.
    The benefit of this is that if an employee leaves an organization and is no longer
    using their device or, the IT staff can remove MAC address from the list and that
    device will no longer be able to connect to the Wi-Fi network.


    All of these are available on Cisco access points. You can configure them with
