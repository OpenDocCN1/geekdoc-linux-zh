  md: '# CHAPTER 2 WIRELESS ADAPTERS & WIRELESS CARDS FOR PENETRATION


    Many people appear to be perplexed when we discuss wireless adapters and wireless
    cards. They have no idea what they are, why we need them, or how to choose the
    right one because there are so many brands and models. A wireless adapter is a
    device that connects to your computer via USB port and allows you to communicate
    with other Wi-Fi devices, allowing you to connect wireless networks and communicate
    with other computers that use Wi-Fi. You may believe that your laptop already
    has this feature, and you are correct; most laptops and smartphones do. But there
    are two issues with that. The first issue is that you can''t access Kali Linux''s
    built-in wireless adapters if it''s installed as a virtual machine, and the second
    issue is that these built-in wireless adapters aren''t good for penetrating wireless
    networks.


    Even if installed Kali Linux as the primary operating system on your laptop and
    have access to your built-in wireless card, you still want to be able to use this
    wireless adapter for penetration testing because it does not support monitor mode
    or packet injection. You want to be able to crack Wi-Fi passwords and do all of
    the cool things aircraft-ng and other tools allow you to do in Kali Linux. Before
    we get into the brands and models that will work with Kali Linux, I''d like to
    discuss a more important factor: the chipset used inside the adapter. For the
    time being, disregard the brand. Instead, we''ll discuss the brands that perform
    all of the calculations inside the wireless adapter whether or not the adapter
    is good. The brand doesn''t matter if it supports injection and monitor mode and
    works with Kali Linux. What is used inside adapter, and the chipset is, crucial.
    Many chipsets support monitor mode, packet injection, and Kali Linux.


    There is one made by Atheros, and its model number is AR9271. This chipset supports
    monitor mode and packet injection, and it can also be used to create a fake access
    point or hack into networks. You can use this chipset to perform almost all Kali
    attacks. The only issue with this chipset is that it only supports 2 gigahertz,
    which means that if your target uses 5 gigahertz or some of the devices are connected
    over 5g, you will be unable to communicate with these devices. You won''t even
    be able to see them, which means you won''t be to attack them. That not because
    the chipset is bad; rather, it can''t handle 5 gigahertz traffic. There are two
    options for getting an adapter that uses this chipset. We have several options,
    but I''ll discuss two of them. First, there is a low-cost option in which you
    can obtain an unbranded wireless adapter that uses this chipset and use it to
    perform all of the previously mentioned attacks. The only difference is that this
    adapter is unbranded, so it is a little less expensive. The second option is to
    purchase the Alpha AWUS036NHA wireless adapter, which is manufactured by Alpha,
    a well-known company that consistently produces excellent wireless adapters. It
    has the same chipset and will be backward compatible.


    The only distinction is in the build quality. This is a much higher quality product
    manufactured by a reputable company. Both work very well, the Alpha adapter has
    a longer range and is more reliable. Budget adapters are much smaller and more
    compact, making them much easier'
