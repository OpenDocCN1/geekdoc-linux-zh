    and vice versa.


    This is referred to as a "Man In The Middle" attack. The risk here is that not
    only could I potentially access information stored on your client device, but
    once you''ve connected legitimately to the enterprise network, I can also now
    have access to that network as the man in the middle.


    How do you defend against a rogue access point? Before we discuss the mechanisms
    for protecting yourself against rogue access points, it is necessary to first
    define what the rogue access points are problem.


    You must create wireless security policies. You must be able to monitor the network
    to detect access points. High-end enterprise access points can typically operate
    in both transmit and sensor monitoring modes communicating with clients.


    If you configure your access point to be in monitor mode, instead of talking and
    listening to clients, you will be listening over the air for devices that shouldn''t
    be there, such as rogue access points.


    Depending on the level of risk in your environment, you could have access points
    that monitor the network 100% of the time, or you could have them monitor some
    of the time and the rest of the time the access points act like a normal access
    point, sending data back and forth to legitimate clients.


    When you detect a rogue access point on your network, your corporate policies
    kick in. Your priority should be to ensure they are not connected to the network
    and are not allowing unauthorized information to be accessed.


    The second priority would then to eliminate it as a source of interference. You
    must physically locate the rogue access point to remove it as a source of interference.


    The only way to find and remove the source of interference is to go out on-site
