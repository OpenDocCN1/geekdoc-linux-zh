    Creating an SSH2 DSA key; could take some time...


    SSH2 ECDSA key generation; this may take some time...


    Then, run the following command to validate the ssh key hashes: "md5sum ssh host_*"


    Here, the * represents your new keys, so use the following commands to compare
    these hashes:


    ```

    "md5sum *" "cd default keys/"

    ```


    After regenerating the SSH key pairs, you can start the SSH service from the command
    line with /usr/sbin/sshd.


    If you want to confirm that SSH is running after you''ve started it, run a "netstat"
    query. The output should show that SSH is now listening on port 22.'
