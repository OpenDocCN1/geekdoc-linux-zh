    as WPA 40 bit or 128 bit, which refer to my key length. I have the option of using
    CKIP, a Cisco proprietary protocol, or CMIC.


    Here, I also have the option of using WEP and TKIP, and then down below, I have
    an advanced encryption standard that I can use on its own or in conjunction with
    TKIP. As a result, I can use both AES TKIP and WEP.


    Let''s look at those various ciphering techniques now. To understand the various
    encryption options, we must first distinguish between the roles of the IEEE 802.11
    group and the Wi-Fi Alliance.


    As the name implies, the IEEE Standards body is in charge of defining the standards,
    as well as the protocol itself. The first specification was defined in 1997 and
    included two options: no'
