    ```


    In the following example, use the following command to copy the /home/test/paper/
    folder and all of its files to the /usb/backup/ directory:


    ```

    /home/test/paper /usb/backup cp -avr

    ```


    +   -a: Preserve the specified attributes such as directory and file mode, ownership,
    timestamps, and, if available, additional attributes such as context, links, xattr,
    and all.


    +   -v: Produces verbose output.


    +   -r: Recursively copy directories.


