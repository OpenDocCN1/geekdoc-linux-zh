  md: '# CHAPTER 25 WEP VULNERABILITIES


    ![](img/abf67bc4e6e070a58e899f91094d3973_82_0.png)


    You might be wondering why we''re talking about WEP if it''s an older technology.
    There are two reasons for this. One, you''ll still find WEP legacy equipment in
    the market, such as hospitals and warehouses, they don''t want to replace them
    because they believe WEP security is adequate for current usage.


    The second reason is that by understanding WEP and its flaws, we can better understand
    how 802.11 introduced new mechanisms to address WEP''s flaws.


    WEP employs the RC4 algorithm or cipher, some messages are processed using RC4
    algorithm, and the result is encrypted. WEP can use both a 40-bit and a 128-bit
    key.


    A 24-bit initialization vector and a 104 bit shared secret key make up the 128-bit
    key. The 104 bits are the secret part, and the initialization vector, which changes
    every frame, is sent within the frame itself.


    The initialization vector is transmitted over the air, but it is changed at each
    frame. When the receiver receives the initialization vector, it connects to the
    shared secret key and then uses the RC4 algorithm to decrypt the message.


    Because the initialization vector is only 24 bits long, it changes every frame.
    If I collect enough data that''s being transmitted over the air, I can see a repeat
    pattern, and a repeat pattern is a weakness in an encryption mechanism that allows
    me to break the key.


    If a hacker can collect as few as 200,000 MAC frames sent over the air, they may
    be able to'
  merge: -1
  pgno: 82
- img_proc: true
  md: 'crack the encryption key. They will be able to read your user data once they
    have broken your encryption key.


    To comprehend the scope of the WEP issue, it is necessary to comprehend the consequences
    of a broken encryption key. To begin, in WEP, all users share the same WEP key.


    This has two consequences. For starters, because everyone is using the same key,
    it makes it much easier for a hacker to collect the number of packets required
    to break the key.


    I can collect packets from anyone, I can read not just one user''s data, but all
    of them.


    Second, if I broke the key, I can read not just one user''s data,


    That''s bad, you''re thinking. In WEP, the shared secret key is used for encryption
    as well as authentication onto the network. So, once I''ve cracked the encryption
    key, I can use it to authenticate myself on the network and gain access to your
    confidential information.


    The 802.11 standard did give five keys to address the weaknesses of the WEP protocol.
    The first was to increase the length of the initialization vector from 24 bits
    to 48 bits, breaking the encryption key exponentially more difficult.


    It employs separate keys for authentication and encryption, so even if a hacker
    cracks the encryption key, they will not gain access to your network. Third, assigned
    a unique key to each station, which means that even if I cracked the encryption
    key for one user, I still won''t be able to read the data from other users.


    Fourth, the encryption keys were distributed dynamically, whereas WEP static encryption
    keys. Static keys do not change, whereas dynamic keys do, which means that if
    a key is broken after it has been changed, the hacker must repeat the process
    of attempting to break the encryption key.


    Finally, 802.11i supports the use of temporal keys, which are, as the name implies,
    temporary keys. So it could be a key that changes every time the user connects
    and starts a new session, which means that if a key is broken, you can only read
    the data for that period. Once the key has changed, you must try again to break
    it.'
