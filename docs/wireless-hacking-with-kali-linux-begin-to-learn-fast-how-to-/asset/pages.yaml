  md: '# CHAPTER 33 ADDITIONAL SOLUTIONS FOR WIRELESS PROTECTION


    ![](img/abf67bc4e6e070a58e899f91094d3973_103_0.png)


    It''s time to talk about alternative security mechanisms for your Wi-Fi networks.
    First, we''ll go over the fundamentals of Wi-Fi security, but we''ve already gone
    over the original specifications, which did open and WEP-based authentication,
    and then we''ll go over 802.11i and how 802.11i provides an EAP framework with
    802.1X port-based authentication to ensure that only authenticated users can access
    the network.


    WPA, WPA Enterprise is the certification for 802.11i EAP.


    Some business situations necessitate different authentication mechanisms or improvements
    to these authentication methods, which we will cover in the following chapters.


    We''ll go over everything you need to know the fundamentals of 802.11i security.
    The first topic we''ll cover is MAC authentication, which is how we authenticate
    by using the MAC address of the device that''s connecting.


    This can be used as a stand-alone authentication method or in conjunction with
    another authentication method, such as WEP authentication or 802.11i I authentication.


    We will then discuss WPA and WPA2 Personal, which are used in environments where
    there is'
