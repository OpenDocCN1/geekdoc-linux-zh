    First, we will create an evil twin access point, which is a clone of an authentic
    access point. As a result, we will find a wireless network that we want to target,
    copy its identifying information such as its name and MAC address, and then use
    that information to create our wireless network.


    Keep in mind that this should be done on your wireless networks. If you don''t
