  md: '# CHAPTER 15 ROGUE ACCESS POINT BASICS


    ![](img/abf67bc4e6e070a58e899f91094d3973_44_0.png)


    A rogue access point has been installed in your organization without the explicit
    permission of your IT administrative staff.


    We''re all increasingly using wireless devices in our daily lives, so it stands
    that we''d want to bring the convenience and ease of connecting with a wireless
    device into the workplace.


    When people bring in access points into an environment where there is already
    a wireless network in place, there are two major issues. The first of these is
    interference.


    If this person deploys their access point on the same channel as another nearby
    access point, it will harm the enterprise network''s performance.


    The second issue arises when these rogue access points are connected to the corporate
    network. Many corporations may have a spare Ethernet port in an office location,
    and by simply connecting that access point to that Ethernet port, you are connecting
    to the corporate network.


    The issue is that you may not have deployed the same security mechanisms on your
    access point that are available in the enterprise network. You could have left
    that access point completely'
