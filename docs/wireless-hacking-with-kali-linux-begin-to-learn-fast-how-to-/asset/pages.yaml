    ```


    optional arguments:

    -h, --help show this help and exit

    -i INTERFACE, --interface manually choose the interface that supports both AP
    and client

    -request monitor modes for spawning the rogue AP as well


    Weak passwords are one of the most serious security threats to organizations.
    When a black hat or pentester attempts to break an enterprise network, he looks
    for the weakest entry point, and it takes only one person to have a password for
    their account to be compromised, and thus the enterprise network to be compromised.


    Hackers use a variety of techniques to obtain your password and gain access to
    your wireless network. They can simply request the password, and you''d be surprised
    how many people can be easily social engineered by falling for a good story.


    They can also look over your shoulder while you''re typing your password or search
    your desk for any notes you''ve made about it. This is known as shoulder surfing.
    The two main methods of password attack are guessing the password and brute force.


    A dictionary attack, the name implies, is when I try every word in the dictionary,
    including foreign dictionaries, medical dictionaries, and so on. The majority
    of people use something memorable, such as a meaningful word.


    Some people use their spouse''s name, while others use their pet''s name, and
    many people use their social security number, which is extremely dangerous because
    a hacker not only has your password but also has very valuable information about
    you.


    If your password cannot be found in a dictionary, hackers can obtain it through
    a brute force attack. This is the stage at I try every possible combination until
    I find your password. I can be clever about it, and I might start with the most
    commonly used password words.


    For example, I can imply some rules in the hope of breaking them early, because
    the problem with a brute force attack is that it will take a long time to try
    all the possible combinations.'
