    # CHAPTER 28 INTRODUCTION TO WIRELESS AUTHENTICATION


    ![](img/abf67bc4e6e070a58e899f91094d3973_90_0.png)


    The following chapters will concentrate on Wi-Fi Authentication for Protecting
    Access to Sensitive Systems.


    First, we''ll go over Wi-Fi authentication and the fundamentals of authentication.


    After, we''ll concentrate on 802.1X port-based authentication. Consider authentication
    to be a process that verifies that the person attempting to connect to the network
    is who they claim to be.


    A password is one of the most common authentication methods. You enter your username
    and the secret password that is associated with that username.


    The authentication process checks to see if this is a valid password for username.
    At that point, you''ve been authenticated and are normally granted access to the
    network and its resources.


    There are numerous methods for verifying a user''s identity, ranging from passwords
    to secret keys to digital certificates. First, we''ll go over the fundamental
    authentication mechanisms provided by a Wi-Fi network.


    We compare and contrast those various options, keeping in mind that it''s not
    a matter of picking one option over another because there may be situations where
    you apply multiple options.


    For example, you may want to connect employees to the network, and they will have
    one authentication option, whereas guests will have a different authentication
    option.


    So the goal is to help you understand those options and differentiate between
    them so you can begin to decide which path you want to take when securing network
    access.


    We''ll look at the available options, and as we go through them, you''ll be able
    to see how they start to come together. One of the most important concepts to
    grasp when implementing Wi-Fi security is that your security mechanisms are linked
    to an SSID.'
