    There are a few details to be aware of once you have downloaded Kali Linux and
    are ready to install it in a virtual environment. When you create a new Virtual
    machine for Kali, you must allocate at least 4 Gb of space, with an additional
    20 Gb for the Virtual hard drive.


    After you have completed the creation of a new Virtual machine, you must go to
    settings and ensure the Network settings are adjusted by bridging the VM to your
    router. After you finished configuring the image, you should be able to boot it.
    You must type "startx" and then press the enter key. This will begin the installation
    of the GUI (Graphical User Interface) from the hard drive, which is also advised.
    There are a few questions you must answer until the GUI is installed, such as
    language, keyboard, location, and settings for the time zone.


    When the installation is finished, you must restart the image from the hard drive.
    Kali will ask for login on the CLI (Command Line Interface). Enter "root" as the
    username and "to" as the password and press enter. Don''t worry if you''re new
    to CLI and know what commands to use or what to type. You can always switch to
    the GUI by typing "startx" and pressing enter. This will launch the user-friendly
    GUI, giving you access to all of the Pen Tools that you will go over in more detail.


    IP addressing is another basic setting that you must complete.


    Kali Linux will look for an IP address by DHCP server, but it is recommended that
    you assign a static IP address so you don''t get confused about which IP address
    represents which machine. To assign an IP address on Kali, use the CLI command
    "Ifconfig eth0 10.10.10.2/24."


    The default gateway, which is your router''s IP address, must be configured. To
    do so, enter the following command: "Route add gw 10.10.10.1".


    Once these settings are complete, use the command "Ping 10.10.10.1" to ping your
    router''s IP address.


    Once you have access to your default gateway and can access the internet through
    router, you should test internet connectivity by typing the command: "Ping www.google.com."


    If this succeeds, it means that your virtualized Kali is now connected to the
