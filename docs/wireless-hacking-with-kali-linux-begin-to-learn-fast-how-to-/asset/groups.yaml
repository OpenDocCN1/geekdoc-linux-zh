    和 EAP，或者可选的 EAP（optional EAP）。


    可选 EAP 是一种允许客户端在两种认证方法之间进行选择的机制。如果你选择共享认证（shared authentication），你也可以选择 MAC 认证、EAP
    认证或 MAC 认证。


    EAP 意味着你也可以包含 MAC 认证。这里需要记住的核心点是，有多种认证机制可供，你并不局限于使用其中一种。


    你可以对单个 SSID 应用多种认证方法。我想说明的最后一点是，这些 SSID 中的每一个都可以分配给特定的 VLAN。


    所以，如果我想区分使用访客认证方法连接的人与使用员工认证方法连接的人的流量，我会在这里设置 VLAN。


    请记住，单凭 VLAN 并不能保证安全，因此请始终使用 VLAN 访问控制列表（ACL）来控制接入点之外的流量，但我们讨论的是无线认证，而不是如何保护 VLAN
    上的流量。


    要理解可用的各种 802.11 认证选项，我们必须首先回顾规范的历史。1997 年编写的规范包含了两种认证方法。第一种是开放认证（open authentication），本质上意味着完全没有认证；第二种是
    WEP 认证。


    WEP 协议的功能不仅仅是认证。WEP 还执行了加密和消息完整性检查，但我们只关注认证。WEP 存在已知缺陷，为了解决这些缺陷，IEEE 开发了 802.11i。


    802.11 规范中包含了两个关键方面。首先是将 EAP 作为发送认证消息的框架，尽管 EAP 是一个 IETF 协议。


    其次，它还引入了 802.1X 基于端口认证的概念，这防止了在用户通过网络认证之前，任何非认证流量通过网络进行传输。


    为了确保产品符合 802.11i 规范，Wi-Fi 联盟开发了认证计划。这些 Wi-Fi 联盟规范最初发布为 WPA，后来被修订以符合最终标准，即被称为 WPA2。


    WPA 和 WPA2 有两种工作模式。有 WPA 和 WPA2 Personal（个人版），以及 WPA 和 WPA2 Enterprise（企业版）。个人版适用于家庭和小小型企业环境，而企业版适用于拥有网络并连接到“AAA”（三A）服务器（如
    RADIUS 服务器）进行认证的大型机构。


    另外两种认证机制未被 802.11 标准覆盖但被广泛使用，因此我们也必须包含。第一种是 MAC 认证，第二种是 Web 认证（web authentication），也称为门户认证（portal
    authentication）。我们将逐一介绍这些认证机制。


    ## 第 29 章 WEP 认证


    ![](img/abf67bc4e6e070a58e899f91094d3973_93_0.png)


    ### 站点接入点


    ![](img/abf67bc4e6e070a58e899f91094d3973_93_1.png)


    让我们从最简单的认证方案开始，称为开放认证。在开放认证中，站点会向接入点发送认证请求。在某些环境中，接入点可能具有额外的负载控制功能，并可能返回一个带有失败代码的关联响应。但在大多数情况下，接入点会返回一个带有成功代码的认证响应。此时，站点被认为通过了
    802.11 认证。随后，站点将发送关联请求。关联请求告诉接入点关于站点的能力。随后，站点会返回一个关联响应，愉快地表示成功。此时，站点既通过了 802.11
    认证，又通过了 802.11 关联，可以继续发送数据帧。如果你在 Wireshark 中查看开放认证，你可以看到在空气中传输的数据包。数据包 #1 是一个信标帧（beacon
    frame），意味着设备监听了信标帧并找到了一个接入点。接入点有一个在信标帧中广播的 SSID。该设备随后发送一个认证消息。如果我们打开这个认证请求，可以看到所使用的算法称为“开放系统（Open
    System）”。因此我正在发起一个开放系统认证请求。接入点随后响应一个认证响应消息，表示设备已成功认证。该设备随后通过发送关联请求来关联。关联请求包含了关于设备的所有信息。如果你点击标记的参数（tagged
    parameters），你可以看到 RSN 信息，它揭示了设备能够支持的所有认证机制。在这里，你看到返回的关联响应，设备已成功通过认证和关联，该设备现在可以发送数据帧了。


    现在让我们来看 WEP 认证。在 WEP 认证中，客户端和接入点都拥有一个共享密钥（shared secret key）。如果你还记得我们讨论过加密，共享密钥是同时用于加密和认证的相同密钥。该密钥的长度可以是
    40 位或 128 位。在 WEP 认证中，当站点发送认证请求时，接入点现在会返回一个挑战文（challenging text）。挑战文只是接入点生成的随机数。接入点接收到该随机数，并使用其共享密钥作为挑战响应对该随机数进行加密。接入点拥有共享密钥以及它发送给站点的挑战文，因此它可以加密相同的挑战文。如果接入点的解密结果与来自站点的加密响应匹配，那么接入点就可以假设站点也拥有该共享密钥。因此，它会返回一个表示“成功”的认证响应。此时，站点被认为通过了
    802.11 认证。它可以继续获取 802.11 关联。一旦完成认证和关联，站点就能发送数据帧了。


    ## 第 30 章 802.11i 认证过程


    ![](img/abf67bc4e6e070a58e899f91094d3973_95_0.png)


    EAP 协议遵循 802.11i 规范，允许你的站点与 AAA 服务器（通常是 RADIUS 服务器）进行通信。许多企业使用同一个 AAA 服务器对无线网络上的用户进行认证，就像对有线网络上的用户一样。要理解
