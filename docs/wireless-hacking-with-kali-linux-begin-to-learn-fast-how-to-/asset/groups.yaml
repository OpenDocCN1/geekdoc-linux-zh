    ## CHAPTER 13 SECURE AD HOC NETWORK CONFIGURATION


    To access the Windows Network Sharing Center, simply locate and select Open the
    Network Sharing Center in Windows. Then select "Manage wireless network."


    Next, click "add a network," then "Add," and you''ll see two options. If you are
    connecting to an infrastructure access point, you should be able to "create a
    network profile," and you should also be able to "create an ad hoc network." So,
    go ahead and select "ad hoc network."


    It will give you a definition, but you can ignore it by clicking Next, and you
    can now type in a name. You can call this "Wireless-Test ad hoc network," and
    you''ll notice that you can choose the Security type.


    You can have it "completely open," which I do not recommend, or you use WEP, which
    is weaker again, but you may need a specific client that can only use WEP authentication,
    which is not ideal but does happen occasionally.


    In this example, we''re going to use WPA2. You can create a password and select
    "Save the network." You should save it first, click "Next." Your network should
    now be operational.


    The network should now be operational and ready for users. Go ahead and connect
    to the network. You can disconnect from the ad hoc network once you see you are
    connected to.


    Following that, you will see that there are no users connected to the ad hoc network,
    so you should delete it. Simply select it and click "Remove." It should now say
    that you will no longer be able to use it, which is exactly what you want.


    If you are no longer using the ad hoc network, you should terminate it as soon
    as possible.


    In conclusion, we discussed a variety of wireless attacks that can be carried
    out while you are away from your home or office. You learned not only about the
    attacks but also about the countermeasures that can be used to reduce both the
    risk of the attack occurring and the damage that would be incurred if the attack
    occurred.


    What are you going to do with this information, and what are you going to do right
    now?


    Well, I would suggest three things. Review your security policy as it relates
    to employees who work out of the office.


    If you were doing this for personal reasons, this could be your family members
    when they are not connected to the home network. If you don''t have a policy,
    consider whether you should have one for people working away from the office.


    While you''re reviewing that policy, you should identify the wireless network
    attacks that these policies are designed to protect against. Check to see if you
    can identify and list them.


    The more you understand wireless attacks, the better prepared you''ll be to create
    the security policy for your company. Finally, the big strategic question: are
    the countermeasures outlined in your security policy adequate for safeguarding
    your assets?


    Given the low level of business risk, your security policies may be a little overbearing.
    If those assets are attacked, you can say, "No, the policies aren''t good enough,
    and the risk warrants more countermeasures," and then request a budget to implement
    those improved countermeasures.


    ## CHAPTER 14 PHYSICAL SECURITY


    ![](img/abf67bc4e6e070a58e899f91094d3973_41_0.png)


    Let''s start with the number one enterprise security threat. To provide coverage
    where people are, access points must be deployed where people are.


    You can''t put your access point in a data center or a storage cabinet and have
    it physically secure because you won''t have coverage where you need it or will
    have suboptimal coverage.


    If you''re deploying access points in areas where people congregate, you''ll need
    to consider how to keep these access points from being tampered with, stolen,
    or reconfigured.


    So the first step is to assess the security risk of your access point being tampered
    with if you''re deploying it in a factory environment, for example, and your access
    points are maybe 20-25 feet in the air hanging from rafters or lines suspended
    from very high ceilings.


    The likelihood of someone physically tampering with it is low.


    Manufacturing environments are typically closed-off areas that only people wearing
    protective gear are permitted to enter.


    In addition, bringing a ladder or something to help you get up to the access point
    in a factory environment is unlikely.


    However, if you deploy your access points in a school, specifically in a school
    hallway, you can almost guarantee that someone will have some fun with that access
    point.


    Students will, at the very least, point the antennas in directions that may not
    be ideal for coverage. As a result, a component of physical security is risk assessment.


    It is more dangerous in a public place than in a more controlled environment.
    Small businesses place the access point in a storage cupboard or in the room that
    houses all of the server equipment.


    Sometimes these can be locked and secured, and other times they are simply areas
    where everyone in the office can go, as right next to the printer.


    In general, people deploy their access points in this manner because they need
    to connect their access point to a switch, and what better place to put it right
    next to the switch?


    Of course, this is true for the ease of connecting the access point to the switch,
    but it is not true for providing optimal coverage.


    This isn''t a bad solution if they decided that the ease of wiring or locking
    it up in a cupboard is more important than providing the best coverage and capacity
    when connected to the wireless network.


    However, decisions on where to place the access point are frequently made by expediency
    rather than security or wireless network optimization.


    I wanted to share a few real-life deployments with you, and please keep in mind
    that when we are called or asked to assist, there is usually a problem. We aren''t
    always privy to the best wireless deployments.


    We get to see which ones are problematic. The bottom line is that if you want
    to protect the performance and integrity of your wireless network, you must seriously
    consider the physical security of your wireless LAN deployment.


    I would also advise against using external antennas unless you have a compelling
    reason to do so, such as is tampering with external antennas, unintentionally
    or maliciously.


    I''d like to tell that most people would deploy wireless to provide the best coverage
    and capacity for their users and that most access points would be installed on
    the ceiling.


    If you are in an area where there is a chance that it will be tampered with, one
    of the solutions is to deploy it above the ceiling. If you have rafters in your
    ceiling, you can hang the access point from those rafters and still get coverage,
    but it hides your access point from view.


    Sometimes it''s simply not possible to install it in the ceiling, in which case
    there may be opportunities to disguise the access point so that people don''t
    realize it''s an access point.


    I''ve seen people wallpaper over access points in schools or else.


    They place the access point in a hidden location, run an external antenna, and
    then wallpaper over it.


    I''ve seen people install panel-based antennas because they look like boxes to
    the untrained eye and people don''t realize it''s an access.


    They may believe it is a security system or a smoke alarm, but they are unaware
    that it is an access point. So, in some places, such as public or academic settings,
    where you have mischievous or energetic children, you may want to disguise your
    access point, and there are a variety of tricks you can employ.


    You can secure access points to prevent them from being removed.


    One option is to secure it to the mounting plate you''re screwing into the ceiling
    or the upside-down bracket.


    The other option is to use a security cable, which is similar to how a laptop
    is secured to a desk in an office.


    Whether you have your access point in a public place where people can see it or
    hidden in a ceiling or a storage room, the ports on the access point should always
    be protected.


    A console port and an Ethernet port will be connected to your access point. You
    don''t want to disable the Ethernet port because it connects you to the corporate
    network.


    What you want to make sure is that someone cannot walk up to the access point,
    disconnect it from the network, plug in their Ethernet cable, and then reconfigure
    it.


    As a result, you want to use SSH on that port to ensure that you only allow secure
    access to that access point. When you''ve finished configuring and deploying the
    access point, you should disable the console port.


    There''s no reason for anyone to have access to the console port once it''s been
    deployed, and if you haven''t already, you should change the default administrative
    login name and password.


    Not just the password, but both. You don''t want to make it easy for a black hacker
    to gain access to your network and change the configuration of your access points.

    '
