    needed to generate the pairwise master key at level 1. At this point, the pairwise
    master key is held by both the station and the target access point.


    The station can continue to send data to the current access point until the signals
    become so weak that it can no longer communicate successfully with the current
    access point, at which point it must transition to the target access point.


    At this point, it sends a message requesting reassociation. As previously stated,
    the reassociation message will include the nonce generated by both station and
    the authenticator, and it will be protected by a message integrity code generated
    from the pairwise master key information.


    Because the message integrity code is valid, the target access point will recognise
    that this is a valid message and will respond with a reassociation response message.


    The connection between the station and the target access point has been established
    at this point. The time it takes to execute the hand off and the time it takes
    to receive a reassociation response, and transition between two access points,
    is whether it''s over-the-air or over the distribution system.


    The benefit of doing it over the distribution system is that I don''t have to
    break communications with my current access point in order to pre-authenticate
    the access points to which I may need to roam and return to my current access
    point to continue sending data.


    Changing channels and finding access points can take time, and by asking the access
    point to do it for over the distribution system and staying connected, I can send
    data to my current access point for a longer period.


    This may be more desirable if you''re making a voice call because it can be difficult
    to stop'
