    We already discussed how to connect to a Wi-Fi network using 802.11 authentication
    and association, followed by 802.11i authentication. We also discussed how EAP
    is used in 802.11i authentication to engage with an authentication mechanism between
    the station and AAA server, but if you don''t have a AAA server? This would be
    a setting as your home or small business. In this environment, your secret key
    is stored on the access point rather than the RADIUS server. Your authentication
    process takes place between the station and the access point, and we will look
    at now. Let''s go over WPA Personal works. We assume we have access point with
    our pre-shared key, and we''ve completed 802.11 authentication and association.
    We are still using the 4-way handshake mechanism we learned earlier. First, the
    access point sends an EAPOL message to the station, which contains the AP nonce,
    simply a random sequence. The station that receives the AP nonce, which is sent
    in clear text, generates a pairwise transient key using its pre-shared key. It
    then sends the station generated and the source and destination MAC addresses
    to determine the pairwise transient key to the access point in clear. This message,
    on the other hand, is protected by a message integrity code generated with the
    pairwise transient key. When the access point receives this message, it can generate
    a pairwise transient key using the station nonce. The message integrity code can
    then be checked using the pairwise transient key. If the message integrity code
    is correct, it demonstrates the station must have the pre-shared key, and thus
    the station is authenticated. The access point returns to the station with an
    EAPOL message, which includes the group transient key generated when sent from
    the access point. This message is not only encrypted with the pairwise transient
    key but it is also protected with the message integrity code. After receiving
    this message, the station can decrypt it using the pairwise transient key. When
    it successfully decrypts it and checks the message integrity code, it assumes
    that the access point must also have the pre-shared key and authenticates the
    access point. Mutual authentication has occurred at this point. To indicate it
    has a successful group transient key, the station sends an EAPOL acknowledgment
    message back to the access point. Both the station and the network have been authenticated
    at this point, and data can now flow between them.


    You can do the following if you have an access point that would be suitable for
    installation in a consumer or small business environment. Select Wireless Security
    settings and you should use WPA2 Personal options, which will require a shared
    key to connect. If you connect to WPA2 Enterprise, you will be prompted to enter
    information about the RADIUS server to use.


    The main difference is that WPA2 Enterprise requires a RADIUS server, whereas
    WPA2 Personal only requires secret information. In the case of WPA and WPA2 Personal,
    the passphrase can be up to 63 characters, resulting in a 256-bit key. The standards
    define the algorithm as the input to that algorithm so, given the passphrase,
    the client and the access point can generate the same key. Many people are unaware
    of what a passphrase is, and many products refer to it as shared key when they
    ask consumers or small businesses to enter the secret information that generate
    the keys.


    Is WPA2 Personal, however, secure? WPA2 Personal has the advantage of mutual authentication,
    which means not only does the access point ensure that the station has the pre-shared
    key, but the station also confirms that the access point will generate transient
    keys from the pairwise master key. These keys will change each time the user connects
    to the network. In other words, the keys used to encrypt data over the air will
    be changed each time the user connects to the network. The pre-shared key, destination
