    # CHAPTER 11 COUNTERMEASURES TO PROTECT WIRELESS TRAFFIC


    ![](img/abf67bc4e6e070a58e899f91094d3973_36_0.png)


    So you can see, there are tools available to decrypt your Wi-Fi traffic if the
    keys are broken, how do you protect yourself? Well, you need to reduce the possibility
    that your passwords will be compromised and fall into the hands of the wrong people.


    So, what methods can you use to keep your keys safe? The first one, on the other
    hand, employs strong encryption algorithms. WPA employs TKIP and a pre-shared
    key. That is very simple to break. WPA2 introduces the AES, or Advanced Encryption
    Standard.


    There are currently no publicly disclosed flaws that allow your password to be
    broken if you encrypt your data with AES. But it depends on when you read this
    book; there is a chance that AES will be broken at some point.


    The second thing that you can do is to use temporary passwords. Temporary passwords
    that are changed on a regular basis. You could, for example, change your passwords
    every time you connect to the access point and re-authenticate yourself.


    You could configure your temporary passwords to expire every 1 or 2 hours, so
    even if you don''t reconnect, you''re generating a new key for encrypting your
    data traffic.'
  - '[PAGE 37]


    ![](img/abf67bc4e6e070a58e899f91094d3973_37_0.png)


    Ad hoc networks are another wireless security threat in which there is no access
    point providing connectivity to the wired network, leaving you with only the intranet
    or internet.


    When you connect devices wirelessly, but there is no connectivity to the wired
    network, you have an ad hoc network.


    For example, when I''m doing presentations, I can set up an ad hoc network between
    my laptop and my data projector, and all I have to do is send traffic from my
    laptop to the projector.


    But I''m not looking to connect to the internet, a server, or a printer. So, what
    exactly makes ad hoc networks a security risk?


    The reason for this is that the security level in an ad hoc network can be significantly
    lower than that of a network connected to an access point and then into a wired
    network.


    When you go to airports and see a lot of different access points, never connect
    to one that like an ad hoc network because it''s either set up by mistake or someone
    has an ad hoc network and doesn''t realize they are transmitting as an ad hoc.


    Otherwise, they are transmitting in the hope that someone will connect to them,
    and then they will be able to gain access to the client device by the lower security
    levels.


    Your primary concern is gaining access to your machine, as well as its data and
    content.


    It could be your business laptop or your smartphone, both of which contain data
    that you do not'
  - '[PAGE 38]


    want others to have access to.


    Most security experts will tell you that using an ad hoc network is never a good
    idea because the risks are simply too great. However, there are advantages to
    using an ad hoc network.


    They are simple to set up and are an excellent way to share files between devices
    such as laptops, smartphones, and other smart devices.


    Given the importance of ad hoc networks in terms of file sharing, it is critical
    to train people on how to set up an ad hoc network with some level of security,
    such as password security.


    The goal is to train people to understand how to set it up and then to understand
    that they must tear it down once they have completed what they intended to do
    in terms of file sharing.


    To accomplish this, we will follow a four-step procedure. First, we''ll launch
    Windows Network and Sharing Center. This is where we''ll be able to set up and
    configure our ad hoc wireless network, as well as give it a password.


    After we''ve configured it, we''ll have a client connect to that network and then
    disconnect from it. It''s critical to delete the ad hoc network after you''ve
    finished using it, so we''ll do that in the final step.'
