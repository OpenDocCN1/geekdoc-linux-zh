    the EAP protocol exchange occurs. While it is possible to perform one authentication
    or WEP authentication before 802.11i authentication, most organizations simply
    perform 802.11 open authentications and association before performing 802.11i
    authentication. When comparing legacy and new Wi-Fi stations, legacy equipment
