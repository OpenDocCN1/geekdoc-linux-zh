    ## CHAPTER 8 COUNTERMEASURES AGAINST PASSIVE RECONNAISSANCE


    Can you keep yourself safe from eavesdropped on in the air? Is there anything
    you can do to counteract Passive Reconnaissance? The first step is to ensure that
    your coverage is limited to the areas where you want to provide wireless connectivity.


    If you don''t want wireless connectivity in the parking lot, make sure your antennas
    are deployed in such a way that the signal is not spilling over outside the building.


    Instead of deploying omnidirectional antennas, which radiate out in a 360-degree
    circular fashion, perhaps you could deploy access points with antennas that radiate
    out in a 90-degree circular fashion.


    This is done to reduce the signal that spills out into the parking lot while focusing
    the signal into the building from each corner. Similarly, you can install wall
    antennas that radiate in a 360-degree circle.


    This will radiate into the office rather than back out into the parking lot beyond
    the wall. What''s most important is that your data is encrypted as it travels
    over the air.


    Your management and control information cannot be encrypted in Wi-Fi, but your
    user data information can. If it''s encrypted, the attacker must first decrypt
    your encryption key before they can read your data.


    Remember that even if you limit the areas where you have wireless coverage, someone
    can use a highly directional antenna, point it at your building, and still read
    the traffic going over the air. As a result, while reducing your coverage is a
    good idea, attackers can still hear it.


