    Now that you''re familiar with display and capture filtering, it''s time to catch
    the wireless password. Because we''re looking for a password, look for traffic
    that contains the words "username", "user password", or "pass". But how are you
    going to do it?


    So, within Wireshark, to "edit", then find the "packet", and change the "display
    filter" to "string",


    Then, change "packet list" to "packet byte". This is because Wireshark has three
    windows. The packet list is displayed in the first window at the top. The "details"
    window is in the middle, right below the packet list the "packet byte" window
    is at the bottom.


    Because you selected packet bytes, Wireshark will find anything that matches the
    phase "pass" within the "packet bytes" window, but it will also highlight the
    packet that matched it within the top window, which is your "display filter".


    What was sent from the client to the server is shown in red within this stream.
    The login username is the word immediately following the word "USER," and the
    password is the word immediately following the word "PASS."


    This is a simple method for using Wireshark to capture passwords in clear text,
    but there are other tools available that make this much easier, as Ettercap, which
    we will discuss in the next chapter.'
