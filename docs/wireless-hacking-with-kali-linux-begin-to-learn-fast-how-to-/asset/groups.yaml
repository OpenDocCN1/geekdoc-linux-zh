    # 使用 Ettercap 进行中间人攻击 (MITM)


    ![](img/abf67bc4e6e070a58e899f91094d3973_33_0.png)


    在本章中，我们将介绍如何使用 Ettercap 通过 HTTP 和 FTP 从目标主机获取凭据，特别是用户名和密码。


    如果目标使用的是两种未加密的协议（例如 HTTP 和 FTP），这是可能的。我们的设置中有一个 Linux 系统和一个 Windows 10 系统，我们将使用
    Ettercap 将自己置于默认网关（即 Windows 主机）的中间。


    要获取默认网关地址，请在终端中输入 `ip route`。


    在我的情况下，默认网关是 192.168.100.1，但无论你的地址是什么，这都是 Ettercap 所需的主要信息。


    如果你愿意，可以将自己置于子网中所有用户与默认网关目标之间。在这种情况下，我们将站在所有人和默认网关之间。


    进入 Kali Linux 的“Applications（应用程序）”，然后向下滚动并选择“Sniffing and Spoofing（嗅探与欺骗）”，然后选择“Ettercap-gui”。这是
    Ettercap 的图形用户界面（GUI）。GUI 打开后，选择“sniff（嗅探）”，然后选择“unified sniffing（统一嗅探）”，这将打开下一个窗口。


    在打开的标题为“ettercap Input”的新窗口中，系统会询问你想在哪个网络接口上嗅探。在我们的 Kali 机器上，只有一个网卡（NIC），即网络接口，选择统一
    sniffing。


    因此，无论显示的是哪个接口都应该被使用，所以点击“ok”。接下来，在用 Ettercap 将自己插入中间之前，我们必须配置目标。要做到这一点，请进入“hosts（主机）”然后选择“scan
    for hosts（扫描主机）”。


    这将对你的目标所在的子网进行扫描。只有“arp poisoning（ARP 投毒）”（我们将使用的模式）允许将自己置于给定子网的中间。


    扫描完成后，返回并选择“hosts”，然后“hosts list（主机列表）”，在新窗口中，你应该看到上一次扫描发现的 IP 地址。你还应该在这里找到默认网关的
    IP 地址，在我的情况下是 192.168.100.1。


    现在你必须创建目标，点击 IP 地址 192.168.100.1 或默认网关的 IP 地址，然后选择“Add to Target 1（添加到目标 1）”。


    接下来，如果你列出了更多 IP 地址并也想将它们作为目标，点击它们将其高亮，然后点击“Add to Target 2（添加到目标 2）”。


    一旦决定了目标，转到顶部窗口并选择“Mitm”，它代表“中间人攻击”。从那里，你可以选择“arp poisoning（ARP 投毒）”。选择后将出现一个新窗口，在其中勾选“Sniff
    remote connections（嗅探远程连接）”旁边的框并点击“OK”。


    如果你处于中间，或者 Kali 机器处于 Windows 10 机器和默认网关之间，那么 IP 地址 192.168.100.1 的 MAC 地址应该是 Kali
    机器的 MAC 地址。要确认这一点，在你的 Windows 10 机器上打开命令提示符并输入 `arp -a`。


    ARP 代表地址解析协议，它将 MAC 地址翻译为 IP 地址。当你在 Windows 上运行该命令时，你应该看到一个带有关联 MAC 地址的 IP 地址列表。


    顺便说一下，为了避免混淆，Windows 将 IP 地址称为“Internet Addresses”，将 MAC 地址称为“Physical Addresses”。


    正如你所看到的，“从技术上是不正确的，因为你只是使用 Ettercap 更改了默认网关的 MAC 地址，但为了确保起见，你也可以验证 Kali 的 MAC
    地址。


    要这样做，返回 Kali Linux 终端并输入 `ifconfig`。


    在该命令的输出中，寻找“ether”一词，它指的是 Kali 以太网地址的 MAC 或“physical address（物理地址）”。


    一旦你验证了 ether 地址与 Windows 默认网关匹配，你就知道自己已经通过 Ettercap 处于中间位置了。Ettercap 的用处在于，当你处于中间时，只需要在
    Ettercap 中运行它，它就会将其捕获到窗口中。


    用户名将显示在 Ettercap 窗口的“USER”旁边，密码将显示在“PASS”旁边。


    它会自动出现在左侧，所以你不需要做什么。例如，与 Wireshark 不同，你不需要坐在那里检查所有的流量，因为用户名和密码都显示出来了。


    如果使用了未加密协议，Ettercap 会捕获任何用户名和密码，因此请使用 HTTPS 而不是 HTTP，使用 SFTP 或 SCP 而不是 FTP 来传输文件。


    由于在你处于中间时不会向用户显示警告横幅，因此终端用户不会注意到你使用 Ettercap 执行了二层中间人攻击。


    # 第 11 章 保护无线流量的措施


    ![](img/abf67bc4e6e070a58e899f91094d3973_36_0.png)


    正如你所看到的，由于在你处于中间时不会向用户显示警告横幅，终端用户不会注意到你使用 Ettercap 执行了二层中间人攻击。


    那么，如果密钥被破解并落入他人手中，你可以使用哪些方法来保护自己？第一种方法是使用强加密算法。WPA 采用 TKIP 和共享密钥，这很容易被破解。WPA2
    引入了 AES，即高级加密标准。


    目前没有公开的漏洞可以让你在使用 AES 加密时被破解，但取决于你阅读的内容，AES 有某些可能被破解。


    你可以做的第二件事是使用临时密码。定期更改的临时密码。例如，你可以在每次连接接入点时更改密码。


    你可以配置临时密码每 1 或 2 小时过期一次，这样即使你不重新连接，你也会为加密生成一个新的密钥。


    ![](img/abf67bc4e6e070a58e899f91094d3973_37_0.png)


    Ad hoc 网络是另一种无线安全威胁，在这种网络中没有提供有线网络连接的接入点，让你只有局域网或互联网。


    当你无线地连接设备但没有到有线网络的连接时，你就拥有了一个 ad hoc 网络。


    例如，当我进行演示时，我可以在笔记本电脑和数据投影仪之间建立一个 ad hoc 网络，我所做的是从笔记本电脑发送流量到投影仪。


    但我并不需要连接互联网、服务器或打印机。

    '
