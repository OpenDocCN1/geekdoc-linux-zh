    changed the Mac Address of your default gateway using Ettercap, but to be certain,
    you can also verify the Kali mac address.


    To do so, return to the Kali Linux terminal and type "ifconfig."


    In the output of this command, look for the term "ether," which refers to the
    MAC or "physical address" of your Kali Ethernet address.


    Once you''ve verified that the ether address matches the Windows default gateway,
    you''ll know you''re in the middle with Ettercap. The good thing about Ettercap
    is that when you''re in the middle, all you have to do is run it within Ettercap,
    it will capture them to that window.


    The username will be displayed next to "USER" and the password will be displayed
    next to "PASS" in the Ettercap window.'
  - '[PAGE 35]


    It will appear on the left side automatically, so you won''t have to do much.
    For example, unlike Wireshark, you don''t have to sit there and examine all of
    the traffic because both the username and password are displayed.


    Ettercap captures any username and password if unencrypted protocols are used,
    so instead of HTTP, use HTTPS, and instead of FTP, use SFTP or SCP to transfer
    files.


    Because there are no warning banners that appear to the user while you are in
    the middle, the end user will not notice if you perform a layer 2 man-in-the-middle
    attack with Ettercap.'
