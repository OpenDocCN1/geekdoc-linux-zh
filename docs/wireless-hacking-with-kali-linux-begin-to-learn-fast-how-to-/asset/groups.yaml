    The user''s machine has completed the 802.11 authentications and association process,
    and it now requires an IP address.


    In our scenario, we assume that the station does not have a static IP address
    and instead uses a dynamic IP address, so it must use a DHCP to discover an message
    with an IP address.


    The DHCP server or servers will respond with a DHCP offer message includes the
    IP address as well as the lease time. The station responds to the offer message
    by sending a DHCP request message, confirming that it has chosen an IP address.


    To complete the DHCP process, the DHCP server would respond with an ACK. The DHCP
    ACK typically contains or be configured to contain additional information such
    as the default router and DNS server addresses.


    The user will now open their browser and type in a URL, which will send a request
    to a DNS server to look up the IP address associated with that URL, and the DNS
    server will respond with a DNS reply containing the IP address of the destination
    website.


    The DNS process is now complete, and the station has both its IP address as well
    as the IP address of the web authentication server. The station must now establish
    a TCP connection by sending a TCP SYN packet containing the IP address of the
    web authentication server.


    In deployments, the wireless LAN controller intercepts the TCP SYN message and
    responds with a TCP SYN ACK message, acting as a proxy for the web authentication
    server.


    The client responds with a TCP ACK packet, completing the three-way TCP handshake
    and establishing a TCP session.


    After the connection has been established, the HTTP GET message is sent.


    The wireless LAN controller may redirect the HTTP GET message in some implementations.
    In this case, however, this is not the case, and the request is allowed to proceed
    to the webserver.


    The web server responds with the default login page, where the user can enter
    their username and password.


    The user is then permitted to send data once he or she has been authenticated
    on the network.


    One final point to consider when deploying guest networks is the need to separate
    public and private network access, which is typically accomplished through the
    use of a demilitarized zone.


    Users then have access only to networks in the demilitarized zone that are behind
    the firewall, and not to your private corporate network.'
