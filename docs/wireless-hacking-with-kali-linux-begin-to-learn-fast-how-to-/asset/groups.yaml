    and then sends an 802.11 authentication request. The authentication request includes
    an indication that it wishes to use the fast transition authentication algorithm,
    FTAA, as well as instructing the access point on how to generate key information,
    including the nonce generated by the station.


    The target access point will forward that to the authenticator, and the authenticator
    will return pre-authentication information to the access point.


    The pre-authentication information will also include the authenticator''s nonce,
    which is typically a separate wireless LAN controller.


    At this point, the target access point has received the authentication information
    from the wireless LAN controller, which is the authenticator, as well as the nonce
    value from the station, so the access point responds to the station with an 802.11
    authentication response message indicating that it is using the fast transition
    authentication algorithm and including the nonce that it received from the authenticator.


    The station now has everything it needs and generates the pairwise keying information.
    The station will now begin its reassociation process. It is important to note
    that the pairwise master key has already been generated on both the station and
    the target access point before the reassociation process, and we did not need
    to perform EAPOL 4-way handshake to generate these keys.


    The authentication nonce and subsequent information are also included in the reassociation
    request message. The distinction here is that this frame is guarded by a message
    integrity code.


    The pairwise master key is used to generate the message integrity code. This gives
