    before roaming, the old access point can forward those packets to the target access
    point, which can then forward packets to the station.


    The target access point will now send a reassociation response, indicating that
    the connection between the station and the target access point was successful.


    At this point, both the station and the target access point can resume data transmission.
    This has reduced the amount of time it takes me to roam from one access point
    to another, get authenticated, and distribute my keys.


    It is, however, suitable for voice? So, let''s speculate on what''s going on.
    We started with my station talking to my access point and moved into an area where
    it was determined that its signal was weakening and it might need handoff.


    It stops communicating with its access point and returns to it to communicate
    with the target access point to which it believes it may need to roam. It proceeds
    to be pre-authenticated.


    It can resume sending data to the access point after pre-authentication. Then,
    when it finally moves into an area where it no longer communicates with its current
    access point, it simply has to hand off. It can then send its reassociation message
    to that access point and establish a connection with that access point without
