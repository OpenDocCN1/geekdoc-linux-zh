    information elements.


    The requested information element would include things like the station''s MAC
    address, the nonce it generated, and the station''s capabilities. As before, the
    authenticator, which is typically the wireless LAN controller, will send pre-authentication
    information to the target access point, which will include the authenticator''s
    nonce.


    This information can then be sent back to the current access point; however, the
    manner in which it is sent is not defined and may differ between organisations;
    however, the information that is sent back is defined and is sent back in information
    elements. The current access point can then respond to the station with an 802.11
    authentication response. That response includes the nonce generated by the authenticator.


    Both the target access point and the station, as before, have the information
    needed to generate the pairwise master key level 1. At this point, the pairwise
    master key is held by both the station and the target access point.


    The station can continue to send data to the current access point until the signals
    become so weak that it can no longer communicate successfully with the current
    access point, at which point it must transition to the target access point. At
    this point, it sends a message requesting reassociation. As previously stated,
