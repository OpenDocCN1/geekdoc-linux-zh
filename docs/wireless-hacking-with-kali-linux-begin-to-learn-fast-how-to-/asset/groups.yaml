    # MITM WITH ETERCAP


    ![](img/abf67bc4e6e070a58e899f91094d3973_33_0.png)


    In this chapter, we''ll look at how to use Ettercap to capture credentials, specifically
    usernames and passwords, from a target via HTTP and FTP.


    If the target is using two unencrypted protocols, such as HTTP and FTP, this is
    possible. We have a Linux and a Windows 10 system in the setup, and we''re going
    to use Ettercap to put ourselves in the middle of the default gateway, which is
    the Windows host machine.


    To obtain the default gateway address, enter "ip route" into a terminal.


    In my case, the default gateway is 192.168.100.1, but whatever address you have,
    this is the main information that Ettercap requires.


    If you want, you can put yourself between everyone on a subnet and the default
    gateway target. In this scenario, we will stand between everyone and the default
    gateway.


    Go to "Applications" in Kali Linux, then scroll down and select "Sniffing and
    Spoofing," then select "Ettercap-gui." Ettercap''s graphical user interface (GUI).
    The GUI is open, select "sniff," then "unified sniffing," which will open the
    next window.


    In the new window that has opened, titled "ettercap Input," you will be asked
    which network interface you want to sniff on. On our Kali machines, there is only
    one NIC, or network interface card, which is unified sniffing.


    As a result, whatever interface is displayed should be used, so click "ok." Next,
    we must configure the target before inserting ourselves into the middle with Ettercap.
    To do so, go to "hosts" and then "scan for hosts."


    This will perform a scan of the subnet in which your target is located. Only "arp
    poisoning," which is what we''ll use, allows you to put yourself in the middle
    of a given subnet.


    When the scan is finished, go back and select "hosts," then "hosts list," and
    in the new window, you should see the IP addresses found in the previous scan.
    You should also be able to find your default gateway''s IP address here, which
    in my case is 192.168.100.1.


    You must now create targets, so click on the IP address 192.168.100.1 or the IP
    address of your default gateway, then select "Add to Target 1."


    Next, if you have more IP Addresses listed and want to target them as well, highlight
    them by clicking on them, and then click "Add to Target 2."


    Once you''ve decided on your targets, go to the top window and select "Mitm,"
    which stands for "man in the middle." From there, you can choose "arp poisoning."
    Once you''ve selected, a new window will appear, in which you should check the
    box next to "Sniff remote connections" and click "OK."


    If you''re in the middle, or if the Kali machine is in the middle between the
    Windows 10 machine and the default gateway, the MAC address for IP address 192.168.100.1
    should be the Kali machine''s MAC address. To confirm this, open the command prompt
    on your Windows 10 machine and type "arp -a"


    Arp stands for Address Resolution Protocol, and it translates MAC addresses to
    IP addresses. When you run that command on Windows, you should see a list of IP
    addresses with their associated MAC addresses.


    By the way, to avoid confusion, Windows refers to IP addresses as "Internet Addresses"
    and MAC addresses as "Physical Addresses"


    As you can see, "Physical Addresses" is technically incorrect because you simply
    changed the Mac Address of your default gateway using Ettercap, but to be certain,
    you can also verify the Kali mac address.


    To do so, return to the Kali Linux terminal and type "ifconfig."


    In the output of this command, look for the term "ether," which refers to the
    MAC or "physical address" of your Kali Ethernet address.


    Once you''ve verified that the ether address matches the Windows default gateway,
    you''ll know you''re in the middle with Ettercap. The good thing about Ettercap
    is that when you''re in the middle, all you have to do is run it within Ettercap,
    it will capture them to that window.


    The username will be displayed next to "USER" and the password will be displayed
    next to "PASS" in the Ettercap window.


    It will appear on the left side automatically, so you won''t have to do much.
    For example, unlike Wireshark, you don''t have to sit there and examine all of
    the traffic because both the username and password are displayed.


    Ettercap captures any username and password if unencrypted protocols are used,
    so instead of HTTP, use HTTPS, and instead of FTP, use SFTP or SCP to transfer
    files.


    Because there are no warning banners that appear to the user while you are in
    the middle, the end user will not notice if you perform a layer 2 man-in-the-middle
    attack with Ettercap.


    # CHAPTER 11 COUNTERMEASURES TO PROTECT WIRELESS TRAFFIC


    ![](img/abf67bc4e6e070a58e899f91094d3973_36_0.png)


    So you can see, there are tools available to decrypt your Wi-Fi traffic if the
    keys are broken, how do you protect yourself? Well, you need to reduce the possibility
    that your passwords will be compromised and fall into the hands of the wrong people.


    So, what methods can you use to keep your keys safe? The first one, on the other
    hand, employs strong encryption algorithms. WPA employs TKIP and a pre-shared
    key. That is very simple to break. WPA2 introduces the AES, or Advanced Encryption
    Standard.


    There are currently no publicly disclosed flaws that allow your password to be
    broken if you encrypt your data with AES. But it depends on when you read this
    book; there is a chance that AES will be broken at some point.


    The second thing that you can do is to use temporary passwords. Temporary passwords
    that are changed on a regular basis. You could, for example, change your passwords
    every time you connect to the access point and re-authenticate yourself.


    You could configure your temporary passwords to expire every 1 or 2 hours, so
    even if you don''t reconnect, you''re generating a new key for encrypting your
    data traffic.


    ![](img/abf67bc4e6e070a58e899f91094d3973_37_0.png)


    Ad hoc networks are another wireless security threat in which there is no access
    point providing connectivity to the wired network, leaving you with only the intranet
    or internet.


    When you connect devices wirelessly, but there is no connectivity to the wired
    network, you have an ad hoc network.


    For example, when I''m doing presentations, I can set up an ad hoc network between
    my laptop and my data projector, and all I have to do is send traffic from my
    laptop to the projector.


    But I''m not looking to connect to the internet, a server, or a printer. So, what
    exactly makes ad hoc networks a security risk?


    The reason for this is that the security level in an ad hoc network can be significantly
    lower than that of a network connected to an access point and then into a wired
    network.


    When you go to airports and see a lot of different access points, never connect
    to one that like an ad hoc network because it''s either set up by mistake or someone
    has an ad hoc network and doesn''t realize they are transmitting as an ad hoc.


    Otherwise, they are transmitting in the hope that someone will connect to them,
    and then they will be able to gain access to the client device by the lower security
    levels.


    Your primary concern is gaining access to your machine, as well as its data and
    content.


    It could be your business laptop or your smartphone, both of which contain data
    that you do not want others to have access to.

    '
