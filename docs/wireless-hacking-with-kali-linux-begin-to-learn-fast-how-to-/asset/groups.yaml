    ## CHAPTER 21 DOS ATTACK WITH MKD3


    ![CHAPTER 21 DOS ATTACK WITH MKD3 image]()


    DOS, or denial of service, attacks are another enterprise security threat. A denial
    of service attack, as the name implies, prevents other people from using the resource
    or services if successful.


    It interferes with the services provided to other users. There was a case in the
    press where an individual decided that he was tired of not using their cell phones
    while driving, so he drove around with a cellular jammer in his car, jamming all
    the frequencies on the cellular network as he drove.


    So the people in the vehicles around can''t use their cell phones, and you might
    think, wow, that''s a great idea, but keep in mind that law enforcement and ambulances
    also use cell services.


    When you disrupt frequencies on a cellular network for other people, you are also
    disrupting services that you do not want to disrupt. This particular individual
    was eventually apprehended, and once apprehended, he was arrested and heavily
    fined.


    However, how do you carry out a denial of service attack? There are two major
    methods in wireless. The first is to flood your Wi-Fi access point with ineffective
    traffic. Does the access point process all of the the authentication requests
    if you generate a lot of traffic and it''s trying to figure out what to do with
    it?


    What if you sent a probe request, the access point is dealing with it but not
    with other user traffic? So, one approach is to simply occupy the access point,
    rendering it incapable of handling legitimate traffic.


    The second method is to simply generate noise and interference in the frequency
    band in which the access point operates. We can send signals that simply disrupt
    and interfere with any other signals that are broadcasting at the same time.


    So, in this chapter, I''ll show you how to carry out a DOS attack. Denial of service,
    or DOS, refers to the act of kicking everyone off the network and denying them
    service.


    First, we must connect our wireless network adapter. After that, launch a terminal
    and type "ifconfig" into it.


    Enter, and now you must open a text file to make a note of some information. First,
    we''ll take note of our wireless interface, which in my case is wlan0.


    Make a mental note of that name. After that, you can clear your terminal by typing
    "clear" and pressing Enter. Next, we''ll scan all access points to find a target,
