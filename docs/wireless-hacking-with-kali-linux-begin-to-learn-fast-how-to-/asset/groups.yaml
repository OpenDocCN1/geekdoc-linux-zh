    1.


    Level 0 is stored in the controller, while level 1 is distributed down the access
    point. The pairwise master key is then used to generate the pairwise transient
    key, as previously discussed.


    It''s called the three-level hierarchy—I''m now distributing keys at three levels,
    rather than two, I''m doing this so that when I roam to another access point,
    I don''t have to go back to the wireless LAN controller, which is where my pairwise
    master key is stored.


    That key can be used to generate the pairwise master key level 1 that will be
    present on the access point to which I am roaming. Let''s start with fast transitions
    over the air.


    The station is currently sending data to the current access point in this scenario.
    It notices its signal is weakening and that it may need to switch to another access
    point.


