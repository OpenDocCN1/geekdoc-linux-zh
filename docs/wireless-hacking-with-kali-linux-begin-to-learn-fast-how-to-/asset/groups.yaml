    # 无线威胁简介


    后续章节将讨论无线网络安全威胁和防御措施。首先，我们将概述无线安全威胁。例如，当你身处咖啡馆或机场时，可能会面临哪些类型的威胁。我们不仅将讨论威胁，还会讨论可以用来对抗威胁的各种机制。许多人并不认为在连接到未知无线网络时这些地点是危险的，但我们将讨论如何防御常见攻击的技术方面。最严重的威胁是他人获取了你用于访问公司账户的密码，或者可能是你用于网上银行业务的密码。接下，我们将讨论无线窃听。这同样重要，因为你的流量是通过空气传输的，这意味着任何人可以在传输过程中监听它、捕获它，或者更糟糕的是，对其进行修改。最后，黑客可能会建立一个自持网络，希望你连接到它，从而攻击你的机器并窃取机密信息。了解你的无线网络可能面临的威胁类型，对于理解保护它的安全机制至关重要。因此，我们将讨论当你不在公司办公室时面临的威胁。世界上有成百千种威胁，但我将重点关注行业内讨论的关键威胁，并与你分享在你未连接到网络时可能遭遇的各种攻击。我们特指人们在办公室内外用于个人用途的个人设备，以及在办公室内外用于业务用途的设备。在介绍这些内容之后，我们将讨论家庭以及业务或企业环境下的无线网络安全威胁和防御措施。


    目标不是向你展示所有可能的安全威胁，而是通过选取一些人们讨论的威胁来观察威胁的多样性。如果你了解在企业环境中可能面临的威胁类型的范围和广度，你将处于更好的位置来考虑应对此类威胁的机制。随后，我们将概述
    WiFi 标准中定义并在 WiFi 产品中找到 Wi-Fi 特有机制。然后，我们将专门查看这些 Wi-Fi 安全机制，从加密开始，以及有哪些哪些加密机制可以保护你的数据不被在空中窃听。我们还将概述基础密码学和不同的
    Wi-Fi 选项，包括 WEP 以及它为什么存在漏洞。我们还将查看 TKIP 以及它如何在修复 WEP 漏洞的同时引入新类型的漏洞，并过渡到高级加密标准的使用。你也将理解你可以使用的各种安全选项，这对于实施无线安全策略至关重要。在涵盖加密基础知识后，我们将转向认证。我们将查看各种
    Wi-Fi 认证机制，保护你的敏感系统不被不该访问无线网络的人访问。由于 Wi-Fi 认证是一个大话题，我们将将其分为几个部分。


