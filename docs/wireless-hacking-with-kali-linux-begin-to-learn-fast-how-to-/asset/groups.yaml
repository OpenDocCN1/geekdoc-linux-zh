    ## CHAPTER 24 WIRELESS ENCRYPTION OPTIONS


    ### Wireless Encryption Options


    | Protocol | Description | Encryption Level (Key Size) |

    |---|---|---|

    | WEP | Wired Equivalent Privacy | 64-bit |

    | WPA & WPA2 | Wi-Fi Protected Access | 256-bit |

    | TKIP | Temporal Key Integrity Protocol | 128-bit |

    | AES | Advanced Encryption Standard | 128-, 192- and 256-bit |


    There are several encryption options available in Wi-Fi networks that we can use.
    If you look at the configurations on a 2800 Cisco access point, you''ll notice
    that it''s typically used in small and medium-sized businesses.


    If we open the GUI to access the configuration options, then select the security
    options, we have additional options such as authentication and encryption to choose
    from.


    If I select Encryption Manager, we will be presented with additional options.
    I can have no encryption at all, or I can use WEP encryption, and then on the
    Cisco product, I can make that encryption mandatory or optional, and I can choose
    the ciphering that I want to use.


    When I click on the ciphering options, I have different ciphering options, such
    as WPA 40 bit or 128 bit, which refer to my key length. I have the option of using
    TKIP, a Cisco proprietary protocol, or CCMP.


    Here, I also have the option of using WEP and TKIP, and then down below, I have
    an advanced encryption standard that I can use on its own or in conjunction with
    TKIP. As a result, I can use both AES TKIP and WEP.


    Let''s look at those various ciphering techniques now. To understand the various
    encryption options, we must first distinguish between the roles of the IEEE 802.11
    group and the Wi-Fi Alliance.


    As the name implies, the IEEE Standards body is in charge of defining the standards,
    as well as the protocol itself. The first specification was defined in 1997 and
    included two options: no encryption at all or WEP, which stands for Wired Equivalent
    Privacy and has an encryption option.


    Because of the flaws in WEP encryption, the IEEE defined amendments to the standard
    to add security options, which were defined in the 802.11i document.


    The Wi-Fi Alliance is in charge of 802.11 standard certifications and promotion.
    They have been delaying the deployment of Wi-Fi technologies due to WEP''s security
    flaws.


    The Wi-Fi Alliance decided to proceed with the certification program based on
    the draft standards, which was dubbed Wi-Fi Protected Access (WPA).


    The use of the TKIP protocol is a critical component of that certification when
    it comes to encryption. TKIP has the advantage of not requiring any hardware changes,
    making it easier for vendors to roll it out early and address some of the early
    issues with the WEP protocol.


    After the 802.11i standards were finalized, the Wi-Fi Alliance revised its certification
    program, which is known as Wi-Fi Protected Access 2 or simply WPA2.


    The advanced encryption standard is included in WPA2. WPA2 is now required for
    any product that goes through Wi-Fi Alliance certification testing. It''s critical
    to remember that WEP and 802.11i both addressed authentication mechanisms, encryption
    techniques, and message integrity.


    ## CHAPTER 25 WEP VULNERABILITIES


    You might be wondering why we''re talking about WEP if it''s an older technology.
    There are two reasons for this. One, you''ll still find WEP legacy equipment in
    the market, such as hospitals and warehouses, they don''t want to replace them
    because they believe WEP security is adequate for current usage.


    The second reason is that by understanding WEP and its flaws, we can better understand
    how 802.11 introduced new mechanisms to address WEP''s flaws.


    WEP employs the RC4 algorithm or cipher, some messages are processed using RC4
    algorithm, and the result is encrypted. WEP can use both a 40-bit and a 128-bit
    key.


    A 24-bit initialization vector and a 104-bit shared secret key make up the 128-bit
    key. The 104 bits are the secret part, and the initialization vector, which changes
    every frame, is sent within the frame itself.


    The initialization vector is transmitted over the air, but it is changed at each
    frame. When the receiver receives the initialization vector, it connects to the
    shared secret key and then uses the RC4 algorithm to decrypt the message.


    Because the initialization vector is only 24 bits long, it changes every frame.
    If I collect enough data that''s being transmitted over the air, I can see a repeat
    pattern, and a repeat pattern is a weakness in an encryption mechanism that allows
    me to break the key.


    If a hacker can collect as few as 200,000 MAC frames sent over the air, they may
    be able to crack the encryption key. They will be able to read your user data
    once they have broken your encryption key.


    To comprehend the scope of the WEP issue, it is necessary to comprehend the consequences
    of a broken encryption key. To begin, in WEP, all users share the same WEP key.


    This has two consequences. For starters, because everyone is using the same key,
    it makes it much easier for a hacker to collect the number of packets required
    to break the key.


    Second, once the key is broken, the hacker can decrypt traffic for all users on
    the network. This is because the same key is used for everyone. To comprehend
    the scope of the WEP issue, it is necessary to comprehend the consequences of
    a broken encryption key. To begin, in WEP, all users share the same WEP key.


    This has two consequences. For starters, because everyone is using the same key,
    it makes it much easier for a hacker to collect the number of packets required
    to break the key.


    Second, once the key is broken, the hacker can decrypt traffic for all users on
    the network. This is because the same key is used for everyone. To comprehend
    the scope of the WEP issue, it is necessary to comprehend the consequences of
    a broken encryption key. To begin, in WEP, all users share the same WEP key.


    Third, because WEP is vulnerable to authentication attacks, a hacker can gain
    access to the network without knowing the password. Once they are connected, they
    can perform any activity as an authorized user, such as stealing data or launching
    further attacks within the network.


    Finally, because WEP is vulnerable to IV attacks, a hacker can collect packets
    with the same initialization vector to reconstruct the key. By collecting enough
    such packets, the key can be cracked in a short time. This is why WEP is considered
    insecure today.


    ## CHAPTER 26 TKIP BASICS


    To improve Wi-Fi encryption, 802.11i standard included different security mechanisms.
    The first is known as TKIP, which we will look at now.


    The main advantage of TKIP was that it could be implemented without vendors having
    to change any hardware, either in client devices or access points. This allowed
    them to quickly introduce improved security to the market.


    TKIP uses the same RC4 algorithm as WEP, but it wraps it to improve WEP''s vulnerabilities.
    It generates a 128-bit per-packet key, which is split into the 104-bit RC4 key
    and the 24-bit WEP initialization vector, which is then fed into the RC4 algorithm.


    The important thing to notice here is that the key changes with each packet. That
    per-packet key is generated by the input. The first is the temporal key, followed
    by the session key, which changes each time the user uses a new session.


    The source MAC address is also fed into TKIP. Inputting the source MAC address
    means that the key will be unique for each user who connects to the network.


    Each packet also includes a 48-bit sequence counter, which is incremented each
    time a new packet is transmitted. Because the sequence number is incremented,
    each packet has a unique key. To summarize, TKIP wraps WEP by changing the keying
    information that feeds into the RC4 algorithm rather than using a static 104-bit
    key plus a 24-bit initialization vector.

