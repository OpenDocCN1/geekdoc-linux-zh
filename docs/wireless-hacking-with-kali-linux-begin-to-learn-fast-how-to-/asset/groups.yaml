    We then investigated rogue access points and Honeypots. They can have a significant
    impact on network performance by causing interference, and in the worst-case scenario,
    they can allow people into your network who do not have access to it.


    Finally, we looked at the denial of service attacks, and you now know how to carry
    them out as well. On the physical layer, we can launch a denial of service attack.


    We can also launch a denial of service attack against the higher frame and packet
    layers. How do you put what you''ve learned to use and move forward?


    I have a few suggestions for you. The first suggestion is to have a security policy
    in place that defines whether or not employees can bring in access points and
    operate them in the corporate environment.


    Remember that many smartphones and laptops can now function as access points,
    and your employees may be unaware when they enable that functionality and allow
    other devices to connect to that hotspot, they may be implementing a rogue access
    point.


    As a result, it''s critical to have a policy in place and educate your users on
    that policy and what a rogue access point is.'
