    802.11 标准，802.11 标准组希望在支持这些设备的同时，扩展标准以支持新的认证机制。因此，在 802.11i 认证和关联之后，会发生 EAP 协议。虽然在
    802.11i 认证之前执行一次认证或 WEP 认证是可能的，但大多数组织仅在执行 802.11i 认证之前执行 802.11 开放认证和关联。在比较新旧
    Wi-Fi 站点时，旧设备可以继续使用 802.11（无论是开放或 WEP 认证后进行 802.11 关联）进行连接，而符合 802.11i 的新站点将先进行
