    # CHAPTER 32 SUMMARY OF WIRELESS AUTHENTICATION METHODS


    In conclusion, we have covered the fundamentals of 802.11 authentications. We''ve
    discussed how the original specifications defined open authentication as well
    as WEP authentication.


    WEP had several flaws, which prompted the IEEE to create the 802.11i specification.
    The first is 802.11i uses the IEEE EAP protocol to allow authentication messages
    to be sent from a station to a AAA server, such as a RADIUS server.


    It also introduced 802.1X port-based authentication, in which the port is blocked
    and only authentication traffic is allowed to pass until the user is authenticated.


