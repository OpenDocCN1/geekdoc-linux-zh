    To wrap up this chapter, there are a few things I''d like to share with you. To
    begin, keep in mind that fast BSS transition, also known as fast roaming, is configurable
    when using WPA or WPA2 Enterprise.


    On a Cisco Wireless LAN controller, for example, the configuration options that
    support fast roaming can only be checked if you''ve also checked WPA or WPA2 Enterprise.


    Another checkbox allows you to specify whether you want to use over-the-air or
    over-distribution-system fast roaming, and you can also set a reassociation timer.


    That is, the period when the station enters its pre-authentication request and
    when it sends the reassociation message must be completed before the timer expires.


    Why should you activate the timer?


    The reason for this is when a station enters a difficult RF environment and suspects
    that it may need to hand off, can it initiate a re-authentication request with
    one or more access points.


    If it decides not to hand off, the timer ensures that the keying information is
    removed from the system. In this manner, a station can pre-authenticate when it
    believes it will require a handover and then execute the handover.


    In this case, we can set the period to 20 seconds, but that is a configuration
    option within a Cisco Wireless LAN Controller, and you can set timeout period
    to anything between 1 second and 100 seconds.


    The final point I to make about fast roaming is that we focused on the security
    aspects of fast roaming, and that functionality is included in 802.11r.


    There is a Wi-Fi certification program called voice enterprise certification that
    certifies the features and capabilities we discussed, as well as other functionality
    for supporting voice calls.


    We discussed security, but when it comes to voice, there are many other functions
    to consider, such as how you measure RF resources, request a handover, and manage
    loading and bandwidth on your network.


    All of these are covered by the voice enterprise certification, not just the parts
    we discussed because we''re concerned with security.


    It''s time to consider your requirements and how you''ll match them to your security
    policies, as well as which wireless access mechanism you should use.


    I recommend that you begin with a simple table that identifies the various types
    of user groups you have, ranging from salespeople to engineering staff. What kinds
    of devices are they employing? Barcode scanners, tablets, smartphones, and other
    similar devices


    What type of network access do you need to provide them with? Do they require
    physical access only in one location, or do they require it throughout the organization?


    What kind of information may they have access to? For example, your guests may
    require access to your organization''s product information rather than just internet
    access.


    Then, decide which Wi-Fi security mechanisms you want to use to protect your network
    and which are best suited to various user groups. To assist you in determining
    what best suits those user groups, it is critical to understand the benefits and
    drawbacks of using those security mechanisms.


    You should be asking yourself a series of questions about the authentication mechanisms
    in your organization.


    The first question is whether the authentication mechanisms in place are consistent
    with your organization''s security policy.


    This is a fundamental question, and many people have implemented wireless security
    simply because the vendor recommended it or because they believe it is the best
    security approach, without considering what the organization''s security policies
    are and whether or not this authentication mechanism matches those policies.


    If you identified areas either or it is not aligned, you can go back and ask yourself,
    "When you''re making changes to these mechanisms to align it to your security
    policy, you should assess how administratively difficult or easy it is to implement
    these mechanisms."


    Because keeping administrative costs is high for some small businesses, it''s
    critical to ensure that the authentication recommendation you make is aligned
    with the overall business goals and cost resource availability.


    In many business situations, you may discover that you have several different
    options for securing the network, in addition to the business cases that we just
    discussed.


    You should also consider which mechanism would be more secure in the manner in
    which it is implemented in your organization.


    Remember that security is more than just the technology you use; it is also about
    the people and processes you use to support that technology.


    Therefore, think beyond the mechanisms we''ve discussed and ask yourself, "Will
    this be more or less than other approaches if you implement the way you would
    implement it?"


    Most organizations should integrate wireless access with their wired network.
    It reduces administrative overhead, makes troubleshooting easier, and makes technical
    staff understand the systems easily.


    Consider not only how traffic will flow through the wired network, but also how
    it will integrate with your wired security policies and whether they are aligned.


    We''ve discussed a variety of policies and mechanisms, such as 802.11r fast roaming,
    which may not be available on your legacy products, and upgrading them to support
    new features may be prohibitively expensive.


    As you consider deploying these security mechanisms, make certain that the products
    you''ve deployed in your network will support these features.

