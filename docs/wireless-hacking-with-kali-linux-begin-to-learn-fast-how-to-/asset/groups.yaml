    They may believe it is a security system or a smoke alarm, but they are unaware
    that it is an access point or an antenna. So, in some places, such as public or
    academic settings, where you have mischievous or energetic children, you may want
    to disguise your access point, and there are a variety of tricks you can employ.


    You can secure access points to prevent them from being removed.


    One option is to secure it to the mounting plate you''re screwing into the ceiling
    or the upside-down bracket.


    The other option is to use a security cable, which is similar to how a laptop
    is secured to a desk in an office. Whether you have your access point in a public
    place where people can see it or hidden in a ceiling or a storage room, the ports
    on the access point should always be protected.


    A console port and an Ethernet port will be connected to your access point. You
    don''t want to disable the Ethernet port because it connects you to the corporate
    network.


    What you want to make sure is that someone cannot walk up to the access point,
    disconnect it from the network, plug in their Ethernet cable, and then reconfigure
    it.


    As a result, you want to use SSH on that port to ensure that you only allow secure
    access to that access point. When you''ve finished configuring and deploying the
    access point, you should disable the console port.


    There''s no reason for anyone to have access to the console port once it''s been
    deployed, and if you haven''t already, you should change the default administrative
    login name and password.


    Not just the password, but both. You don''t want to make it easy for a black hacker
    to gain access to your network and change the configuration of your access points.'
