    Following that, you will be familiar with SSH, also known as Secure Shell configuration.
    Although Kali comes with default SSH keys, it is a good idea to disable the default
    keys and generate a unique key set before using SSH on Kali. The following is
    the procedure for moving the original keys and creating the new keys. To begin,
    open your console and navigate to the SSH folder.


    NOTE: Here is some help on how to navigate within directories:


    - To return to the home directory immediately, use cd ~ OR cd

    - To change into the root directory of Linux system, use cd /.

    - To go into the root user directory, run cd /root/ as root user.

    - To navigate up one directory level up, use cd ..

    - To go back to the previous directory, use cd ..


    Next, you have to create a backup folder, and you need to move the SSH keys to
