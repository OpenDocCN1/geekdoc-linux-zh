    changes to the 802.11i mechanisms that will allow for fast roaming.


    To begin, MAC authentication occurs when a network asks, "Do I recognize your
    MAC address?" and "If I recognize your MAC address, I will allow you to join the
    network?"


    We previously discussed how, when connecting to a Wi-Fi network, we would send
    an authentication request followed by an association request.


    When those requests arrive at the access point, it now has your MAC address and
    can check to see if MAC address is on the approved list of those who connect.


    This list will be stored on the access point or a RADIUS server. If you have two
    or three access points and a few devices connecting to the network, it is possible
    to store and maintain a MAC authentication list on an access point.


    However, once you have a large number of access points and devices connecting
    to your network, maintaining a list of valid MAC addresses on each access point
    becomes administratively difficult, so that list is typically maintained on a
    server, such as a AAA radius server.


    After you''ve submitted your authentication and association request, the access
    point will check with that RADIUS server to see if your MAC address is valid.


    It accomplishes this by sending an authentication request to the RADIUS server.


    After you''ve been authenticated and associated, the MAC authentication request
    is processed, the access point will not allow the station to send any data.


    If the MAC address is on the RADIUS server''s list, the RADIUS server will respond
    with an authentication response indicating that authentication was successful.


    At that point, the access point will authorize the station to send the data frame.
    If the authentication response is a failure, one of two things can happen.


    Either the access point will not allow the station to send any data, or the station
    will be able to perform 802.11i authentication. If that is successful, the station
    can proceed to send data.


    You would configure your network to determine whether a station that has failed
    MAC authentication is allowed to connect using 802.11i authentication.


    Alternatively, I could force the station not only to pass MAC authentication but
    also to pass 802.11i authentication before it is allowed to send any data on the
    network.


    In other words, you could configure your network to have SSID to which only MAC
    authenticated devices connect. You might do this if you have VoIP devices connected
    to your network that are not capable of 802.11i authentication.


    In other cases, such as warehouses and manufacturing floors, where devices such
    as barcode readers have MAC addresses but are unable to perform 802.11i authentication.


    You could create an SSID that allows a device to perform MAC authentication first,
    but if that fails, it will perform 802.11i EAP authentication.


    If that goes well, they''ll be able to connect. As result, any device capable
    of MAC authentication or 802.11i EAP authentication is permitted to connect to
    the network.


    This is not a recommended option, but it may work well in environments with a
    variety of devices that need to connect to the network.


    Finally, you want to keep administrative complexity to a minimum while allowing
    all devices to perform some sort of authentication. This allows you to keep a
    smaller list of MAC addresses, for example, you don''t need every device''s MAC
    address on the authentication list.


    Another option is that the station that is connecting must pass MAC authentication,
    and only if it passes MAC authentication will it proceed to 802.11i.


    From an administrative standpoint, this means you must keep a list of MAC addresses
    for each device that you want to connect to your network.


    Large organizations will use MAC authentication as well as 802.11i authentication.
    The benefit of this is that if an employee leaves an organization and is no longer
    using their device or, the IT staff can remove MAC address from the list and that
    device will no longer be able to connect to the Wi-Fi network.


    All of these are available on Cisco access points. You can configure them with
    various authentication mechanisms. So, for example, if you wanted to allow open
    authentication alongside MAC authentication, you have options.


    If you want to ensure that they not only MAC authentication but also EAP authentication,
    you can select this option or MAC or EAP authentication.


    You can not only an EAP authentication server, but also a MAC authentication server
    where you can keep track of the MAC addresses that are permitted to connect to
    your network.


    You must understand the limitations of MAC authentication. People can easily listen
    over the air and capture valid MAC addresses. They can then change the MAC address
    on their device using those MAC addresses.


    When these devices try to connect to the network, they will be successful with
    MAC authentication. As result, MAC authentication should be used in conjunction
    with another authentication mechanism, or in networks where the devices are incapable
    of performing any other type of authentication.


