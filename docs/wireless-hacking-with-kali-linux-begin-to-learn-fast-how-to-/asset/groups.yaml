    You may have already deduced the rule or secret that I used to encrypt my data.
    If you know the secret information, for example, if I used ROT3, you can successfully
    decrypt the message, so the rule I used to encrypt and decrypt my message is referred
    to as a cipher, the mathematical algorithm I used to encrypt the data.


    ROT3 stands for "rotating your alphabet by 3 characters" and was used in the early
    days of the Romans. Julius Caesar is known to have ROT13, which shifts the characters
    by 13 with a listed ABC.


    As a result, the letter "A" becomes an "N," and the letter "B" becomes an "O."
    Back in the day of the Romans, this was thought to be reasonably secure because
    most people could read or write, so if they understood the rules, decrypting the
    message would be useless.


    It is still used by some people and businesses today, but it is easily broken
    and thus not secure. Our final definition is "key." We process the secret key
    that we combined with the message to encrypt through a cipher, such as ROT3 or
    ROT13, and at the end of that process, we have a random set of 1s and 0s you can''t
    get back to the original information unless you have the correct decryption key.


    To better understand what a key is, consider the Enigma machine, which takes the
    concept of rotating our characters to a new level. The Enigma machine uses several
    rotors, initially three and then later in the war increased to five, and every
    time you presented a key to have encrypted, it would shift the position of the
    rotor, indicating that you didn''t have the simple substitution mechanism that
    we discussed when looking at ROT3 and ROT13.


    So it took a lot of effort to break this. But we''re here to discuss what a key
    is, and in the case of the Enigma machine, the key is the codebook.


    To encrypt and decrypt a message, both the person encrypting the message and the
    person decrypting the message must ensure that the Enigma machine is set up or
    configured in the same way.


    That configuration is critical, and it was defined and distributed in codebooks.
    Just to give you an idea of the complexity, the configuration would have included
    the rotor selection, order of the rotors, starting position relative to the rotor
    wiring, and then the plug connections as part of its wiring.


    As a result, if you had secret information and the machine, you could use it to
    encrypt and decrypt messages. During the war, different codebooks were used for
    different branches of the military.


    Now that you''ve learned some fundamental definitions, let''s look at what keys
    look like in moderate wireless networks, specifically our Wi-Fi networks. The
    secret key is nothing more than a string of 1s and 0s.


    The number of 1s and 0s is referred to as the key size, and in the original WEP
    system, key lengths of 40 and 128 bits were used. We used that secret key to send
    the data, and data on a computer is also represented as 1s and 0s.'
