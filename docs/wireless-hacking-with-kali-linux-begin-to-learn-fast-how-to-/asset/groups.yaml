    # CHAPTER 35 WEB AUTHENTICATION PROCESS


    In many of the scenarios we''ve discussed so far, we''ve used a server to authenticate
    the user, typically a RADIUS server. In this chapter, we''ll discuss how to authenticate
    a user using a web server, which is referred to as web authentication; it''s also
    known as portal authentication.


    Web authentication is a better solution in many business situations. In the hospitality
    industry, for example, if you want to provide access to a guest hotel or perhaps
    a visitor to an airport lounge, that user is only there for a short time, but
    you still want to provide some level of secure


    Web authentication not only provides secure access but also provides a browser
    interface for the user, allowing the user to connect to your network and get authenticated
    in a friendly interface.


    Indeed, it makes sense to use access in any public location where people may want
    to connect to your Wi-Fi networks, such as libraries, conference centers, and
    community buildings.


    Web access is typically used in the enterprise environment for visitors to the
    business, and using a web server provides an easy mechanism for administrators
    to quickly generate a new username and password and provide guests authenticated
    access to the network.


    With authentication, you would perform your 802.11 authentications and association
    before, and once these processes were completed successfully, you would begin
    your authentication procedure between your station and the webserver.


    To communicate with the webserver, the station must first obtain an IP address
    and locate the URL of the web server.


    The authentication process can begin only when the station has an IP address and
    knows the IP address of the web server.


    This means that until the user is authenticated, the access point or controller
    must block all traffic except DHCP and DNS traffic. We previously discussed 802.1X
    port-based authentication.


    The EAPOL, EAP over LAN, was used to transport authentication messages from the
    client to the controller. Because the EAPOL protocol was used, these messages
    could be forwarded between network nodes using a link layer protocol.


    When it arrived at the controller, it was forwarded to the RADIUS server via a
    RADIUS protocol. Only after the user has been authenticated does the user receive
    an IP address via DHCP, and once it has an IP address, it can communicate with
    the intranet or internet.


    Because authentication takes place before the station can obtain an IP address,
    this is known as a layer 2 authentication mechanism. These roles are reversed
    in the case of web authentication.


    The station must first obtain an IP address before being authenticated, and communications
    between the station and the web authentication server are accomplished via IP
    routing.


    As a result, web authentication is referred to as a layer 3 authentication mechanism.
    Let''s go over the web authentication process step by step. So, in our scenario,
    the administrator has assigned a username and password, configured it on the webserver,
    and assigned that username and password to the user.


    The user''s machine has completed the 802.11 authentications and association process,
    and it now requires an IP address.


    In our scenario, we assume that the station does not have a static IP address
    and instead uses a dynamic IP address, so it must use a DHCP to discover a message
    with an IP address.


    The DHCP server or servers will respond with a DHCP offer message includes the
    IP address as well as the lease time. The station responds to the offer message
    by sending a DHCP request message, confirming that it has chosen an IP address.


    To complete the DHCP process, the DHCP server would respond with an ACK. The DHCP
    ACK typically contains or be configured to contain additional information such
    as the default router and DNS server addresses.


    The user will now open their browser and type in a URL, which will send a request
    to a DNS server to look up the IP address associated with that URL, and the DNS
    server will respond with a DNS reply containing the IP address of the destination
    website.


    The DNS process is now complete, and the station has both its IP address as well
    as the IP address of the web authentication server. The station must now establish
    a TCP connection by sending a TCP SYN packet containing the IP address of the
    web authentication server.


    In deployments, the wireless LAN controller intercepts the TCP SYN message and
    responds with a TCP SYN ACK message, acting as a proxy for the web authentication
    server.


    The client responds with a TCP ACK packet, completing the three-way TCP handshake
    and establishing a TCP session.


    After the connection has been established, the HTTP GET message is sent.


    The wireless LAN controller may redirect the HTTP GET message in some implementations.
    In this case, however, this is not the case, and the request is allowed to proceed
    to the webserver.


    The web server responds with the default login page, where the user can enter
    their username and password.


    The user is then permitted to send data once he or she has been authenticated
    on the network.


    One final point to consider when deploying guest networks is the need to separate
    public and private network access, which is typically accomplished through the
    use of a demilitarized zone.


    Users then have access only to networks in the demilitarized zone that are behind
    the firewall, and not to your private corporate network.


    # CHAPTER 36 FAST ROAMING PROCESS


    We''ve already discussed WPA2 Enterprise and how it generates and distributes
    pairwise master keys using 802.1X. Now we''ll look at how keys are handled while
    I''m roaming between access points.


    If I want to support voice calls, I must be able to move between access points
    and begin sending data in less than 50 milliseconds, which means that keying information
    must be on the access point to which I am roaming within 50 milliseconds.


    If I have to wait more than 50 milliseconds to switch from one access point to
    another making a voice call, I may experience packet loss, which will degrade
    the quality of my voice call.


    I''d like to remind you of what we previously discussed. When it comes to WPA2
    Enterprise, you must first perform 802.11 authentication association and then
    use EAP to trigger your authentication method before you send any data frames.


    After being authenticated by an authentication server, you begin the 802.1X key
    distribution process, which generates a master session key and a pairwise transient
    key.


    The temporal keys are included in the pairwise transient key. Your voice packets
    are then encrypted using the temporal keys. The entire process of connecting to
    an access point, encryption, and distribution can take hundreds of milliseconds.


    As a result, if I''m roaming to another access point and performing a full 802.1X
    EAP authentication was around 530 milliseconds, I won''t be able to support a
    voice call.


    So, something must change. First, I''ll pre-authenticate on the access point.
    The process is known as pre-authentication, and it is defined in 802.11i specifications.
    Next, I''m going to reuse the derived keys, which eliminates the need for me to
    contact the RADIUS server. So, if I pre-authenticate on the access point and I
    reuse the keys, the transition time between access points is now less than 50
    milliseconds, and I can support a voice call.


    Let''s get into how pre-authentication and key distribution will work. Assume
    that a station is moving between two access points in this scenario. It will anything
    while it is communicating with the first access point and in RF conditions. When
    you walk away from the access point to which it is currently connected, the signal
    weakens.


    The station will begin its pre-authentication process at some point. The station
    can pre-authenticate in one of two ways. The first method is that it ceases communication
    with the first access point and retunes its radio to begin communicating with
    the second access point. This is known as an over-the-air transition. In other
    words, the station is transmitting data over the air while transitioning to the
    second access point.


    The second method is when the station communicates with the access point to which
    it is currently connected and there''s a chance it''ll need to switch to this
    other access point, so it''ll ask to configure all of its authentication and key
    information. Access point can communicate with the access point to which this
    client believes it will transition over the distribution network, which is the
    wired network. This is known as transitioning over the distribution system.


    Let''s take a closer look at these two approaches. The first thing we must consider
    is key distribution. 802.11i specifies a two-level key hierarchy. We define a
    three-level key hierarchy in 802.11r fast BSS roaming. What does this imply?


    We previously discussed both the supplicant and the authentication server had
    the master session key, and how we used those master session keys to derive the
    pairwise master key, which the authentication server would then distribute to
    the authenticator. Consider the authenticator to be the wireless controller in
    this scenario. The pairwise master key is defined as having two levels in 802.11r.

