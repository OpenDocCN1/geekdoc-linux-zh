    ## 第 20 章 使用 MDK3 进行恶性双胞去认证攻击


    ![](img/abf67bc4e6e070a58e899f91094d3973_66_0.png)


    本章将向你展示如何在 Kali Linux 虚拟机上设置一个恶性双胞（Evil Twin）接入点。此外，我将演示如何结合恶性双胞接入点和社交工程技术来获取目标的
    WPA 或 WPA2 密码。


    你需要一个支持监听模式（monitor mode）的 USB 网络适配器来完成这次攻击。如果你还没有支持监听模式的 USB 网络适配器，我已经在之前的章节中推荐过它们。


    此外，如果你已经知道恶性双胞接入点的工作原理，那很好；如果不知道，让我来解释一下我们将为这次攻击做些什么。


    首先，我们将创建一个恶性双胞接入点，它是真实接入点的克隆。结果是我们将找到一个想要攻击的无线网络，复制它的标识信息（如名称和 MAC 地址），然后使用这些信息创建我们的无线网络。


    请记住，这应该在你自己的无线网络上进行。如果你没有两个无线网络，我建议如果可以的话，请使用你的邻居或朋友的网络进行练习。


    当客户端连接到恶性双胞网络时，他们无法区分真实网络和恶性双胞网络。当客户端打开网页浏览器时，我们将把他们重定向到路由器安全更新页面，在那里他们会被提示输入其
    WPA 或 WPA2 密码。


    当客户端输入其 WPA 密码时，密码将保存在我的 MySQL 数据库中，我们将在稍后创建该数据库。这就是我们应对这次攻击要做的所有工作。


    让我们开始吧。首先，我们必须连接互联网，通过将宿主机操作系统的互联网连接共享给 Kali Linux 虚拟机来实现。这样，就不需要第二个 USB 网络适配器了。如果你切换到宿主机操作系统，无论你使用什么操作系统，只要它能连接互联网即可。


    打开你的网络管理器并寻找要连接的无线网络。既然你已经在宿主机操作系统上连接了互联网，现在可以连接到你的家庭网络，然后我们需要将其共享给 Kali Linux
    虚拟机。


    现在，回到 Kali Linux，打开顶部菜单栏中的虚拟机菜单，展开网络适配器菜单，在这里我们需要将网络适配器设置为“桥接自动检测”（bridged auto-detect）。


