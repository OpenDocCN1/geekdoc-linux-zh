    # Introduction to Wireless Threats


    Wireless network security threats and countermeasures will be discussed in the
    following chapters. First, we''ll go over the top wireless security threats. For
    example, what kinds of threats might you face if you''re in a coffee shop or an
    airport. We''re not just going to talk about threats; we''re also going to talk
    about the various mechanisms that can be used to counteract threats. Many people
    do not believe that these locations are dangerous when connecting to unknown wireless
    networks, but we will discuss the technical aspects of how you can defend against
    common attacks. The most serious threat is that someone else obtains the password
    you use to access your company account, or perhaps the password you use to do
    your online banking. Then we''ll go over wireless eavesdropping. This is also
    important because your traffic is transmitted over the air, which means that anyone
    can listen to it, capture it, or worse, modify it while it is in transit. Finally,
    a hacker may set up an ad hoc network in the hope that you will connect to it,
    allowing him to attack your machine and steal your confidential information. It''s
    important to understand the types of threats that your wireless network can face
    to understand the security mechanisms that are in place to protect it. As a result,
    we''ll discuss the threats when you''re not in your company''s office. There are
    hundreds of threats out there, but I''ll focus on the key threats that people
    discuss in the industry, as well as share with you the variety of attacks you
    can have when you''re not connected to the network. We are specifically referring
    to personal devices that people will use for personal use in and out of the office,
    as well as business use in and out of the office. After we''ve gone over those,
    we''ll go over wireless network security threats and countermeasures, both at
    home and in a business or enterprise setting.


    The goal is not to show you all of the possible security threats, but to look
    at the diversity of threats by taking some of the threats that people talk about.
    If you understand the scope and breadth of the types of threats you might face
    in the enterprise environment, you''ll be in a much better position to consider
    the mechanisms that are in place to combat such threats. Following that, we will
    go over Wi-Fi specific mechanisms that are defined in WiFi standards and found
    in WiFi products. Then we''ll look specifically at those Wi-Fi security mechanisms,
    beginning with encryption and what encryption mechanisms are available to protect
    your data from being eavesdropped over the air. We''ll also go over basic cryptography
    and different Wi-Fi options, including WEP and why it''s vulnerable. We''ll also
    look at TKIP and how it fixes the WEP vulnerabilities while introducing a new
    type of vulnerability and moving on to the use of advanced encryption standards.
    You will also understand the various security options available to you, which
    is essential for implementing the wireless security policy. After covering the
    fundamentals of encryption, we''ll move on to authentication. We''ll look at various
    Wi-Fi authentication mechanisms that protect your sensitive systems from being
    accessed by people who aren''t supposed to be accessing them the wireless network.
    Because Wi-Fi authentication is a large topic, we will divide it into several
    chapters.


    First, we''ll lay the groundwork by teaching you everything you need to know about
    the Wi-Fi authentication mechanisms you may be using today or considering in the
    future. We will go over open authentication, WEP authentication and its flaws,
    802.11i, and the introduction of EAP and EAPOL 4-way handshakes, which will give
    you a thorough understanding of WPA2 authentication mechanisms. Following that,
    we will discuss other mechanisms that you may want to consider, such as MAC authentication,
    WPA, and WPA2 personal, which are used by many small businesses as well as consumers
    in their home environment, if WPA2 enterprise is not the right authentication
    mechanism for your needs. We will also discuss WEP authentication, also known
    as portal authentication, and the security implications of implementing fast roaming,
    which is the ability to roam between access points quickly to support voice calls,
    as well the security implications of allowing a user to quickly re-authenticate
    on another access point. We''ll look at other mechanisms that you might want to
    use in addition to or instead of the WPA2 enterprise. Finally, we''ll discuss
    message integrity and how you can protect yourself from tampered messages sent
    over the air. Perhaps you''re relying on information in the mistaken belief that
    it''s reliable, in fact, it''s not. We will discuss what message integrity entails
    and the mechanisms that ensure message integrity. We will discuss WEP and how
    it works to gain a basic understanding of its flaws.


    We will discuss the countermeasures that you should put in place, followed by
    a discussion of the cipher block chaining message authentication code and how
    it protects your network as part of WPA2. We will also discuss protecting frames,
    as we have traditionally focused on protecting data frames rather than management
    messages such as authentication and authentication messages. As a result, we will
    delve into the wireless security issues associated with deploying a Wi-Fi network.
    You will understand wireless security by the end of this book because we go over
    all of the Wi-Fi security mechanisms in detail. The structure of this book is
    designed to help you understand and create wireless security policies. We will
    teach you by looking at threats to a wireless network and countermeasures to those
    threats, and then understanding the various security mechanisms that exist that
    you can use to meet your wireless security policy objectives. Let''s move on to
    the Wireless Penetration Testing Kit List.


    ## CHAPTER 1 WIRELESS PENTEST TOOL LIST


    I''d like to give overview of the tools commonly used by hackers and penetration
