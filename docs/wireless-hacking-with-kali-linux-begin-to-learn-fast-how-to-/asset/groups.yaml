    Thus, implementing a network, you must consider the various user groups that you
    have, the various types of authentication mechanisms that you want for those different
    groups, and then assign a unique SSID to each of those groups.


    To better understand the configuration options on an access point, let''s look
    at what''s available on a Cisco 2800 access point. For instance, once you''ve
    accessed the GUI interface, you can click on security to see a list of configured
    SSIDs.


    If you already have SSID configured, you can choose the authentication method
    for that SSID. Additional SSIDs with different authentication methods can be added.


    When we look at the methods, we can see that you have completely open with additional
    MAC authentication, EAP, MAC, and EAP, or optional EAP.


    Optional EAP is a mechanism that allows a client to select between two authentication
    methods. If you select shared authentication, you can also select MAC authentication,
    EAP authentication, or MAC authentication.


    EAP implies that you can also include MAC authentication. The main point to take
    away from this is that there are several authentication mechanisms available,
    and you are not limited to using one of them.


    You can apply multiple authentication methods to a single SSID. The final point
    I''d like to make is that each of these SSIDs can be assigned to a specific VLAN.


    So, if I want to segment the traffic of someone connecting using a guest authentication
    method versus an employee authentication method, I''d set up the VLANs here.


    Remember that VLANs alone do not make it secure, so always use VLAN access control
    lists to control traffic beyond the access point, but we''re talking about over-the-air
    authentication, not how to secure traffic over VLANs.


    To understand the various 802.11 authentication options available, we must first
    go through the specifications'' history. The initial specifications, written in
    1997, included two methods of authentication. The first was open authentication,
    which essentially meant no authentication at all, and the second was WEP authentication.


    The WEP protocol was capable of more than just authentication. WEP also performed
    encryption and message integrity, but we are only concerned with authentication.
    WEP has known flaws, and to address those flaws, the IEEE developed 802.11i.


    Two critical aspects were included in the 802.11 specifications. The first is
    that included EAP as a framework for sending authentication messages, even though
    EAP is an IETF protocol.


    Second, it introduced the concept of 802.1X port-based authentication, which prevents
    any other than authentication traffic from passing through the network until the
    user is authenticated on the network.


    To ensure that products adhered to the 802.11i specifications, the Wi-Fi Alliance
    developed certification programs. These Wi-Fi Alliance specifications were initially
    released as WPA, but were later revised to conform to the final standard, which
    was known as WPA2.


    WPA and WPA2 have two modes of operation. There are WPA and WPA2 Personal, as
    well as WPA and WPA2 Enterprise. Personal is intended for home and small business
    environments, whereas enterprise is intended for large organizations that have
    a network and are connected to a "AAA" (triple-A) server, such as a RADIUS server,
    for authentication.


    Two other authentication mechanisms are not covered by the 802.11 standards but
    are widely used, so we must include them as well. The first is MAC authentication,
    and the second is web authentication, which is also known as portal authentication.
    We''ll go over each of these authentication mechanisms one by one.


    ## CHAPTER 29 WEP AUTHENTICATION


    ![](img/abf67bc4e6e070a58e899f91094d3973_93_0.png)


    ### Station Access Point


    ![](img/abf67bc4e6e070a58e899f91094d3973_93_1.png)


    Let''s begin with the easiest authentication scheme, called open authentication.
    In open authentication, the station would send an authentication request to the
    access point. In some environments, the access point may have some additional
    capabilities for load control and could send back an association response with
    a fail code in it. But in most situations, the access point would respond with
    an authentication response that carries the success code. At this point, the station
    is considered to be successful 802.11 authenticated. The station would then proceed
    to send an association request. The association request tells the access point
    about the capabilities of the station. The station would then respond with an
    association response, happily saying success. At this point, the station is both
    802.11 authenticated and 802.11 associated and can proceed send data frames. If
    you take a look at open authentication within Wireshark, you can see the packets
    going over the air. Packet #1 is a beacon frame, meaning that a device has listened
    to the beacon frame and found an access point. Access point has an SSID that is
    being broadcasted in the beacon. The device then goes ahead and sends in an authentication
    message. If we open up this authentication request, we can see that the algorithm
    being used is called “Open System”. So I''m making an open system authentication
    request. The access point then responds with an authentication response message
    saying that the device is successfully authenticated. The device goes ahead and
    associates by sending an association request. an association request includes
    all the information about the device. If you click on tagged parameters, you can
    see the RSN information which reveals all the authentication mechanisms the device
    is capable of supporting. Here, you see the association response coming back and
    the device is successfully authenticated associated and this device can now send
    data frames.


    Let''s now look at WEP authentication. WEP authentication, both the client and
    the access point have a shared secret key. If you remember when we talked about
    encryption, the shared secret key is the same key''s used for both encryption
    and authentication. This key can be length 40 bits or 128 bits. In WEP authentication,
    when the station sends the authentication request, the access point now responds
    with a challenging text. The challenge text is just a random number that''s generated
    by the access point. The access point receives that random number and encrypts
    that random number using its as the challenge-response. The access point has the
    shared secret key and the challenge text it sent the station, therefore it can
    encrypt the same challenge text. If the access point decrypts matches the encrypted
    response from the station, then the access point can assume that the station must
    also have the shared secret key. It will therefore respond with an authentication
    response that says success. At this point, the station is considered to be 802.11
    authenticated. It can proceed to get 802.11 associated. Once it''s been authenticated
    and associated, the station is then able to send data frames.


    ## CHAPTER 30 802.11I AUTHENTICATION PROCESS


    ![](img/abf67bc4e6e070a58e899f91094d3973_95_0.png)


    The EAP protocol followed the 802.11i specifications, allowing communication between
    your station and a AAA server, which is typically a RADIUS server. Many businesses
    use the same AAA server to authenticate users on wireless networks that they do
    on wired networks. To comprehend 802.11i, we must first comprehend the EAP protocol.
    But before we do that, I want to make sure you understand the message exchanges
    that occur before the start of 802.11i. Many pieces of equipment, such as barcode
    readers, cameras, hospital machines, and factory equipment, still use the legacy
    802.11 standards, and the 802.11 standards group wanted to ensure that these devices
    could be supported while also extending the standard to support new authentication
    mechanisms. So, after 802.11i authentications and association, the EAP protocol
    occurs. While it is possible to perform one authentication or WEP authentication
    before 802.11i authentication, most organizations simply perform 802.11 open authentications
    and association before performing 802.11i authentication. When comparing legacy
    and new Wi-Fi stations, legacy equipment can continue to connect using 802.11,
    either open or WEP authentication followed by 802.11 association, whereas new
    stations conform to 802.11i will first do 802.11 open authentications followed
    by 802.11 association, and then they will begin an EAP exchange, which is what
    we''ll discuss next. The EAP protocol is known as an authentication framework.
    That is EAP functions as an envelope, transporting authentication messages back
    and forth between the client and the server. And intermediate nodes simply examine
    the envelope, as the EAP protocol, before forwarding it to its final destination.

