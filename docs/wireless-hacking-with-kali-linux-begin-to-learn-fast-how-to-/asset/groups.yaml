    # CHAPTER 36 FAST ROAMING PROCESS


    ![](img/abf67bc4e6e070a58e899f91094d3973_112_0.png)


    We''ve already discussed WPA2 Enterprise and how it generates and distributes
    pairwise master keys using 802.1X. Now we''ll look at how keys are handled while
    I''m roaming between access points.


    If I want to support voice calls, I must be able to move between access points
    and begin sending data in less than 50 milliseconds, which means that keying information
    must be on the access point to which I am roaming within 50 milliseconds.


    If I have to wait more than 50 milliseconds to switch from one access point to
    another making a voice call, I may experience packet loss, which will degrade
    the quality of my voice call.


    I''d like to remind you of what we previously discussed. When it comes to WPA2
    Enterprise, you must first perform 802.11 authentication association and then
    use EAP to trigger your authentication method before you send any data frames.


    After being authenticated by an authentication server, you begin the 802.1X key
    distribution process, which generates a master session key and a pairwise transient
    key.


    The temporal keys are included in the pairwise transient key. Your voice packets
    are then encrypted using the temporal keys. The entire process of connecting to
    an access point, encryption, and key distribution can take hundreds of milliseconds.


    Back in 2005, the average time it took for a device to perform a full 802.1X EAP
    authentication was around 530 milliseconds. As a result, if I''m roaming to another
    access point and performing'
  - '[PAGE 113]


    a full 802.11X EAP authentication before sending data, I won''t be able to support
    a voice call.


    As a result, something must change. First, I''ll authenticate with the access
    point. The process is known as pre-authentication, and it is defined in the 802.11i
    specifications.


    Next, I''m going to re-use the keys generated during my 802.11X process. Reusing
    the derive keys eliminates the need for me to contact the AAA RADIUS server, allowing
    me to complete the generation and distribution of my temporal keys each master.


    This feature is specified in the 802.11r fast roaming specification. So, if I
    pre-authenticate on the access point before roaming and I reuse the keys, the
    transition time between access points is now less than 50 milliseconds, and I
    can support a voice call.


    So let''s get into how pre-authentication and key distribution will work. Assume
    that a station is moving between two access points in this scenario.


    It will not anything while it is communicating with the first access point and
    in no RF conditions. When you walk away from the access point to which it is currently
    connected, the signal weakens.


    The station will begin its pre-authentication process at some point.


    The station can pre-authenticate in one of two ways. The first method is that
    it ceases communication with the first access point and retunes its radio to begin
    communicating with the second access point.


    This is known as an over-the-air transition. In other words, the station is transmitting
    data over the air while transitioning to the second access point.


    The second method is when the station communicates with the access point to which
    it is currently connected and things. There''s a chance it''ll need to switch
    to this other access point, so it''ll ask to configure all of its authentication
    and key information.


    Access point can communicate with the access point to which this client believes
    it will transition over the distribution network, which is the wired network.


    This is known as transitioning over the distribution system.


    Let''s take a closer look at these two approaches. The first thing we must consider
    is key distribution.


    802.11i specifies a two-level key hierarchy. We define a three-level key hierarchy
    in 802.11r fast BSS roaming. What does this imply?


    We previously discussed both the supplicant and the authentication server had
    the master session key, and how we used those master session keys to derive the
    pairwise master key, which the authentication server would then distribute to
    the authenticator.


    Consider the authenticator to be the wireless controller in this scenario. The
    pairwise master key is defined as having two levels in 802.11r.'
