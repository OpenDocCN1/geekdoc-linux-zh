    ## 第 13 章 安全自组网网络配置


    要访问 Windows 网络共享中心，只需找到并选择 Windows 中的“打开网络共享中心”即可。然后选择“更改适配器设置”。


    接下来，点击“添加新的网络”，然后点击“添加”，你将看到两个选项。如果你连接的是基础设施接入点（接入点），你应该能够“创建网络配置文件”，同时也应该能够“创建自组网网络（ad
    hoc network）”。所以，请选择“自组网网络”。


    它会给出一个定义，但你可以点击“下一步”来忽略它，现在你可以输入一个名称。你可以将其命名为“Wireless-Test ad hoc network”，你会发现你可以选择安全类型。


    你可以选择“完全开放”，我不建议这样做；或者你使用 WEP，后者的安全性再次较弱，但你可能需要一个只能使用 WEP 认证的特定客户端，这虽然不理想，但确实会发生。


    在例例中，我们将使用 WPA2。你可以创建一个密码并选择“保存网络”。你应该先保存它，然后点击“下一步”。你的网络现在应该可以运行了。


    网络现在应该可以运行并为用户准备就绪。继续连接到该网络。一旦看到你已连接，就可以断开自组网网络的连接。


    之后，你会发现没有用户连接到自组网网络，因此你应该删除它。只需选择它并点击“删除”。现在它应该显示你将不再能够使用它，这正是你所想要的。


    如果你不再使用该自组网网络，应该尽快终止它。


    最后，我们讨论了在你离开家或办公室期间可能实施的各种无线攻击。你不仅学习了这些攻击，还学习了用于减少攻击发生风险以及攻击发生时可能造成的损害的应对措施。


    你打算如何利用这些信息，你现在打算做什么？


    嗯，我建议做三件事。审查你与办公室外工作的员工相关的安全策略。


    如果你是出于个人原因这样做，这可能涉及你的家庭成员在他们没有连接到家庭网络时。如果你没有策略，请考虑是否应该为在办公室外工作的人员制定一个策略。


    在你审查该策略的同时，你应该识别出这些策略旨在防止的无线网络攻击。检查你是否能够识别并列出它们。


    你对无线攻击的理解越深，为公司制定安全策略时的准备工作就越充分。最后，一个重大的战略问题：你的安全策略中概述的应对措施是否足以保护你的资产？


    鉴于业务风险水平较低，你的安全策略可能稍微严苛了。如果这些资产受到攻击，你可以说：“不，策略还不够好，风险需要更多的应对措施”，然后申请预算来实施这些改进后的应对措施。


    ## 第 14 章 物理安全


    ![](img/abf67bc4e6e070a58e899f91094d3973_41_0.png)


    让我们从最大的企业安全威胁开始。为了在人的地方提供覆盖，接入点必须部署在人的地方。


    你不能将接入点放在数据中心或存储柜中并认为它在物理上是安全的，因为你将在需要的地方无法获得覆盖，或者获得次优的覆盖。


    如果你在人员聚集的区域部署接入点，你需要考虑如何防止这些接入点被篡改、盗窃或重新配置。


    所以，第一步是评估接入点被篡改的安全风险，例如，如果你在工厂环境中部署它，而接入点可能悬在空中 20-25 英尺处，挂在横梁上或从非常高的天花板吊下的线线上。


    有人物理篡改它的概率很低。


    制造环境通常是封闭区域，只有穿戴防护装备的人员才允许进入。


    此外，在工厂环境中携带梯或其他设备帮助你到达接入点是不可能的。


    然而，如果你在学校部署接入点，特别是在学校的走廊里，你几乎可以肯定有人会对那个接入点“大作身手”。


    学生们至少会将天线指向可能对覆盖不理想的方向。因此，物理安全的一个组成部分是风险评估。


    在公共场所，这比在更受控的环境中更危险。小型企业将接入点放在储物柜或放置所有服务器设备的房间里。


    有时这些地方可以锁定并加固，而另时候，它们仅仅是办公室里每个人都可以去的地方，就在打印机旁边。


    通常情况下，人们以这种方式部署接入点是因为他们需要将接入点连接到交换机，还有什么比放在交换机旁边更好的地方呢？


    当然，这对于方便接入点连接到交换机来说是正确的，但对于提供最佳覆盖则不然。


    如果他们决定布线的便利性或将其锁在柜子里比连接到无线网络时提供最佳覆盖和容量更重要，这并不是一个坏主意。


    然而，关于放置接入点的决策往往是出于便利，而不是出于安全或无线网络优化。


    我想和你们分享几个真实的部署案例，请记住，当我们被召唤或被要求协助时，通常是有问题的。我们并不总是了解最好的无线部署方案。


    我们能看到哪些是有问题的。底线是，如果你想保护网络性能和完整性，必须认真考虑接入点的物理安全。无论你的接入点是在人们可以看到的公共场所还是隐藏在天花板或存储室里，接入点的端口始终应该受到保护。


    控制端口和以太网端口将连接到你的接入点。你不想禁用以太网端口，因为它连接到公司网络。


    你想要确保别人不能走到接入点旁，断开网络连接，插上以太网线，然后重新配置它。


    因此，你希望在该端口使用 SSH，以确保只允许安全访问该接入点。当你完成接入点的配置和部署后，应该禁用控制端口。


    '
