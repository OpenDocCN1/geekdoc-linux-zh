    The second suggestion is to make sure you understand what normal behavior on your
    wireless network entails.


    If you know how many authentication and association requests you normally receive
    in an hour, and you suddenly notice a fluctuation in the number of authentication
    and association requests, you''ll be able to detect an attack on your network.


    Understanding what constitutes normal behavior allows you to detect when something
    out of the ordinary occurs on your network. When looking for anomalies, keep in
    mind to examine all layers of the protocol stack, including the physical layer.


    Consider the following: what is the normally expected amount of interference?
    What is the normally expected number of corrupted frames and retransmissions?


    My final piece of advice is to ensure that the IT staff understands how the wireless
    physical layer works. Many people believe wireless is similar to magic, that it
    just happens.


    When troubleshooting a problem, such as when a user cannot connect to the network
    or why they''re dropping voice calls while roaming, these issues must be investigated
    not only at the higher layers to see where the packets are going, but also at
    the physical layer.


    Many people are concerned about the physical layer because they are unfamiliar
    with the concept of waveforms traveling through the air carrying your data. As
    a result, it is critical that you, as an IT professional, have a solid understanding
    of the wireless physical layer.'
