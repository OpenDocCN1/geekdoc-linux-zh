    detect rogue points. In this book, we''ll look at how to use them. There are also
    available. Tcpdump, for example, is a command-line utility that displays all TCP/IP
    packets. NetworkMiner, which analyses traffic and deciphers various protocols,
    but Ettercap is also capable of man-in-the-middle attacks. Other tools, such as
    NetworkMiner and Fiddler, are also available.


    Wireshark is another tool that will be used in this book. Wireshark is a fantastic
    tool that IT professionals use to analyze both wireless and wired networks. Most
    IT professionals are familiar with Wireshark, and if they work on protocols, they
    would be familiar with it to sniff and capture Wi-Fi traffic. Wireshark interprets
    IPs and displays them in a user-friendly manner by displaying information such
    as the SSID or BSSID of other things. Using Wireshark, we''ll examine packets
    that are specifically relevant to this book. To understand wireless attacks, we
    will also use other penetration tools. The goal is to show you the attacks, how
    they work, and that they are not relatively simple to execute if you have the
