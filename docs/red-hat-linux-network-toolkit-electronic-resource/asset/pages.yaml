- pgno: 137
  md: '# Part II: Background


    Red Hat uses a new convention in which each user belongs to a Private Group (UPG).
    Each user belongs to a unique group. When individual users need to share work,
    a new group is assigned to that project and the users get membership in the new
    group. In this way, people get common access to similar work and yet maintain
    their own privacy.


    # Networking and the OSI network model


    The International Standards Organization (ISO) has developed the Open Systems
    Interconnect (OSI) networking model. This model logically separates higher- and
    lower-level networking functions into seven layers. In Figure 4-1, I reduce the
    model to four layers, to make it easier to understand.


    | | |

    |---||

    | Application | http, Telnet, FTP, SMB, etc. |

    | Transport | TCP, UDP, ICMP |

    | Network | IP |

    | Physical/Data Link | Device Drivers (Ethernet, etc.) |


    Figure 4–1: The seven-layer OSI networking model, reconfigured as four layers


    My four-layer interpretation of the OSI networking model has the following layers:


    +   * The Application layer deals with high-level protocols, including SMB, NFS,
    FTP, SMTP, DNS, SNMP, and Telnet. Application programs that rely on these protocols
    access them directly. For example, the ftp program speaks the FTP protocol. If
    you write one of these programs, you are concerned with this layer.

    * The Transport layer includes the Transmission Control Protocol (TCP), the User
    Datagram Protocol (UDP), and the Internet Control Protocol (ICMP). The Application
    layer protocols depend on these protocols to ensure that the packets they produce
    reliably get to their destination. By "reliability," I mean that either sooner
    or later—depending on the protocol—each packet is acknowledged or not, and the
    Transport layer informs the Application as the status of each packet.

    * TCP is called a connection-oriented protocol because it makes sure that when
    each packet is received by the intended host, it is acknowledged immediately and
    in sequence. Telnet uses TCP for the obvious reason that when you enter a character
    sequence (for example, *abcd*), you want each character to arrive in order and
    be acknowledged in a timely fashion.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Chapter 4: Looking Under the Hood


    +   - UDP is a connectionless protocol. It does not guarantee that a packet will
    reach its destination. The application is responsible for that. UDP is simpler
    than TCP, uses fewer resources, and is more efficient. Samba, for instance, uses
    UDP.


    +   - ICMP is an auxiliary protocol used for troubleshooting and maintenance.
    PING uses it.


    +   - The UNIX/Linux ports (sometimes referred to as sockets) work at the Transport
    layer. You can connect to the TCP port 25 with Telnet, for example, and the sendmail
    daemon will talk to you. The Linux operating system provides this abstraction
    to ease the process of writing interprocess and network communication.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_138_0.png)


    +   - The Network layer contains the IP, or Internet Protocol, which deals with
    how to get each packet to its destination. It is responsible for encapsulating
    the higher-level packets (that is, a TCP packet) in IP packet, which includes
    the destination and source addresses, the type of protocol, and several other
    chunks of information. If a packet is destined for a location outside of its LAN,
    routers down the line interpret this stuff and make their best guess as to where
    and how to forward the packet.


    +   - The Physical/Data Link layer deals with the physical media such as the cable
    and the bits that come into and out of the network adapter. (Note: If your only
    network connection is a PPP or SLIP link, you can think of that link as your network
    adapter). In an Ethernet adapter, the circuits know how to interpret the electrical
    signals coming out of the demod—the actual wires carry radio frequency (RF) signals—and
    then turn into binary bits. From there, the bits are compared to the permanent
    Ethernet MAC (Medium-Access Control) address and when they match, they are forwarded
    to the Network layer.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_138_1.png)


    > Each network adapter has a unique binary address. Each manufacturer gets a range
    of addresses so that no two adapters in the world should ever get the same address
    (who knows about bootleggers). Looking back at Listing 4-6, one line shows my
    Ethernet adapter''s address in hexadecimal:


    ```

    eth0: 3c509 0x310 tag 1, BNC port, address 00 20 of 38 6a aa, IRQ 11

    ```


    To summarize, the OSI model logically breaks up the path that information — in
    the form of packets — takes in going from one computer to another as well as within


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_138_2.png)'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'the computer. The abstraction in this model enables you to ignore the messy
    details of whatever process you need to create or use. Regardless of the level
    on which you are working, this model enables you to understand how your LAN –
    as well as the entire Internet – functions.


    # Samba


    The existence of Samba is the primary reason I am writing this book. It provides
    the straightforward and secure interface that NFS fails, and it is considerably
    less expensive than Novell NetWare. Because Samba “speaks” the native Microsoft
    protocol, SMB, your Microsoft Windows PCs don''t need any additional, expensive,
    or difficult-to-install software the way they do with NFS. Samba turns your Linux
    PC into a powerful Windows file and print server.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_139_0.png)


    > NFS is more complex to set up than Samba. It is not terribly difficult, but
    you need more patience. But the real problem is purchasing and configuring the
    software that makes your Windows client seek to install TCP/IP, but you have to
    use Windows 3.X or MS-DOS as a client, you have to purchase software as PC-NFS
    from Sunsoft, Inc. (http://www.sunsoft.com). Windows 95 and 98 require software
    as DiskAccess from Intergraph Corp. (http://www.intergraph.com).


    When you install Windows out of the box, it comes equipped with Microsoft Client
    and Microsoft TCP/IP. You have to choose to install TCP/IP, but it is part of
    the Windows package. Microsoft Client speaks the Service Message Block (SMB) protocol
    by default. That protocol is carried by the near-universal Internet Protocol (IP)
    or TCP/IP. TCP/IP is the default Protocol for Linux, so Windows and Linux can
    converse. (Previously, with a UNIX/NFS server, you had to purchase additional
    software on the Microsoft Windows PC to make it speak NFS. That purchase was expensive
    because each PC client needed the software. Now, the single Linux PC already speaks
    the native Microsoft language.)


    # The Samba protocol


    The SMB protocol is responsible for negotiating the use of remote files and resources
    such as printers. Figure 4–2 shows the file A, which physically exists on the
    Linux server – in SMB terminology, it holds the share. When the Windows client
    wants to use this file, the client must tell the server to make A available to
    it and then to transfer the file’s contents across the network. SMB is responsible
    for handling the details of the transaction negotiation.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Chapter 4: Looking Under the Hood 111


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_140_0.png)


    **Figure 4-2:** The server holds the file that the client needs.


    After the server receives a valid SMB request, it accesses its own file system
    to get the information. Samba acts as the interface between the SMB packets arriving
    on the network and the Linux operating system.


    # THE SAMBA DAEMONS


    The heart of Samba are the programs smbd and nmbd. They are usually run as daemons,
    which are processes that run all the time. Red Hat runs them as daemons by default.
    You have the option of launching them from *inetd* (a superdaemon of sorts that
    looks for requests for programs it has control of—as defined in *inetd.conf*—and
    launches them as needed). That method slows Samba down and the overhead of running
    smbd and nmbd is low, so the daemon method really does work best.


    The nmbd process enables the Linux server to be browsed by other machines. The
    smbd daemon processes the SMB packets as they arrive on the network, and negotiates
    with the Linux kernel for access to its resources or shares. If a file is specified,
    the resource is a file; a printer request accesses a printer.'
  merge: -1
