    # UNDERSTANDING IP MASQUERADING


    Using IP masquerading is an elegant method for attaching your network to the Internet.
    IP masquerading (also call Network Address Translation, or NAT) converts an IP
    source address into another address. In this example, the source addresses of
    packets originating from within the Private Network converted into the source
    address of the PPP connection on the Linux gateway/firewall. On the Internet they
    all appear to be coming from a single machine. No matter what computer on the
    Private Network you are using, all packets appear to come from a single computer.

    If you use IP masquerading, you do not need any official registration to allow
    your network to access the Internet. Without masquerading you would have to'
