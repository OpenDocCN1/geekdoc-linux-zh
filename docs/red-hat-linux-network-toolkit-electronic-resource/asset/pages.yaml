    # Minimizing wear and tear


    You can do a couple of things to reduce the wear and tear on your system. The
    following information is based on common sense:


    +   - Keep your systems powered on. The thermal expansion and contraction of turning
    your systems off at night wears them out faster than leaving them on. Also, most
    nonportable hard disks have heads that "land" on the disk platter. This is worse
    than the wear and tear on the bearings.

    - Minimize shaking and bumping. The most delicate system is your hard disk. It
    spins at several thousand rpm with a delicate head floating on a cushion of air.
    If it is bumped too hard, it can physically impact the disk platter and fail.
    Even if it is not bumped enough for immediate failure, the ill effects simply
    add up over time.


    # Disaster Recovery


    Disaster comes in many forms – for example, a fire, an earthquake, or a flood.
    But anything that catastrophically destroys or renders your operation unusable
    is a disaster. It is essential that you make recovery plans commensurate with
    the value and the importance of your operation.


    Your plan can be as complex and expensive as a company that specializes in such
    things. You can pay someone to maintain a computer or computers compatible with
    your own system. They should be in another geographical location, to remove the
    possibility of a local event rendering them inoperable. However, you should consider
    the likely travel time and means of travel, to. If you choose a location on the
    other side of the continent, you eliminate the possibility of a common natural
    disaster but you may not be able to get there in a reasonable'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# Chapter 9: Introducing Systems Administration 305


    amount of time. However, if they are too close, a common event may affect everyone.
    A location reached by an airline shuttle should be a good benchmark. A few tens
    to a thousand miles (one Albuquerque company that I worked for had a disaster
    near Seattle) appears to be reasonable to me.


    On the other end of the spectrum – a small business or home office – you probably
    do not need a formal contract. You should have a simple plan of action, however.
    First, the offsite backups are obviously essential. If your shop burns down, you
    are going to live off your backups. Having stored them in another location, your
    plan will go something like this:


    +   1. Assess your physical damage.

    2. Restore the minimal network necessary to run your operation.

    * Use computers and equipment that were not damaged significantly.

    * Borrow or purchase the additional equipment necessary.

    * Set up your network in the most convenient location.

    * Restore your file systems.

    * Restore your Internet connections.

    3. Systematically restore customer or your own services as quickly as safety allows.


    Obviously, the specifics of your situation will determine the details of these
    steps, but the process of acting instead of reacting is the essential factor.
    Even if you end up doing everything completely different from how you planned
    to, the fact that you planned at all will probably save you.


    I should state that training is also essential. In my present job, we do at least
    two practice recoveries a year, including the travel and complete restorations
    of your essential services. I realize that may not be possible for you. In that
    case, I recommend that you do as many of the subsets disaster recovery as possible.
    Even “paper runs” are helpful – go through the plan by talking through it with
    your peers and management. Any practice is better than no practice.


    > A small operation that handles life-and-death matters or has people depend on
    it for their livelihood is another matter. If you run an organ donor database
    or an ambulance service, for instance, then you need a formal contract as well
    as a plan even though you may have only one or two computers.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# Summary


    In this chapter, I describe the basic elements of systems administration. Systems
    administration is a large topic that would take an entire book to cover in any
    detail. As a result, I can only cover the essential aspects in this chapter. It
    is to your advantage, though, to investigate the subject in more detail.

    This chapter covers the following topics:


    +   - Setting policy. This is the road map that is essential to navigate in your
    system. If you have the luxury of setting it, you are a step ahead. If the policy
    is set for you, your interpretation still gives you considerable power.

    - Reliably making backups. Backups are used for recovering misplaced or accidentally
    deleted files as well as recovering from disaster. You should devise a system
    that accounts for both possibilities. To that end, you need to decide on what
    method to use to make backups and how often to make them. This generally depends
    on the size of your operation. I divide backups into three camps: small, medium,
    and large. Each has its own requirements and limitations: Small backups can be
    performed using media as ubiquitous as floppy disks. You can also make use of
    the Internet as a storage system. Your records can be minimal.

    - Medium-sized backups generally require specialized media such as 4mm DAT tapes.
    They also require that you use formal, regimented scheduling and record keeping.

    - Large backups are a world apart from smaller ones. If you are backing up more
    than a gigabyte a day then highly specialized media such as jukeboxes are often
    required.

    - Ensuring security. This responsibility is next in importance to your backups.
    It is a very large field and no book, less a single chapter, can cover it in detail.
    You can do several specific things from the start, however, that will greatly
    improve your network''s security. If you learn the basics, you can learn about
    security as an ongoing process. Those basic tasks are outlined.

    - Administering users. You are generally responsible for adding, deleting, and
    modifying user accounts.

    - Administering file systems. Adding, deleting, and modifying them is an everyday
    job.

    - Administering software. This is generally one of the more difficult administrative
    tasks. So many combinations of operating system and application programs are possible
    that installing, maintaining, and upgrading software is an art in itself. This
    is one of those areas where you have to experiment.'
  merge: -1
  img_proc: true
- pgno: 336
  md: '# Chapter 9: Introducing Systems Administration


    +   - Maintenance. This is a constant and ongoing job. The more you can anticipate
    hardware and software problems, the less trouble you have.

    I outline some areas that you look at in order to do just that:


    +   - Keeping some spare equipment in a ready state can minimize downtime due
