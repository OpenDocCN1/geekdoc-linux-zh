- pgno: 153
  md: 'To make use of the RPM operating modes, you use various options or parame-ters.
    Some parameters are general purpose and work with any of the functions. Table
    5-1 describes the general RPM parameters and their functions. You can use these
    parameters with any of the modes that I describe in the preceding lists.


    # TABLE 5-1 KEY RPM GENERAL PARAMETERS (CAN BE USED WITH ANY MODE)


    | Parameter | Function |

    | --- | --- |

    | -vv | Print debugging information. |

    | --quiet | Print as little as possible – normally, only error messages are displayed.
    |

    | --help | Print a longer usage message than normal. |

    | --version | Print the version number of RPM. |

    | --rcfile <file> | Specify a different personal setup file, rather than $HOME/rpmrc
    or /etc/rpmrc. |

    | --root <dir> | Use dir as the top-level directory for all operations. |


    Some parameters are specific to one mode or another. You can customize the in-stall
    and upgrade functions to suit your needs. Table 5-2 lists the key parameters you
    use with install or upgrade.


    # TABLE 5-2 KEY RPM INSTALL AND UPGRADE PARAMETERS


    | Parameter | Function |

    | --- | --- |

    | --force | Force the replacement of a package or file. |

    | -h, --hash | Print 50 dots, or hash marks, as a package is installed. |

    | --oldpackage | Replace a newer package with an older one. Normally, RPM balks
    if it is asked to write over a newer package. |

    | --percent | Print percentage to completion during installation. |

    | --replacefiles | Force previously installed files from other packages to be
    replaced. |

    | --replacekgs | Force previously installed packages to be replaced. |

    | --root <dir> | Use another directory as a start point or root. |

    | --nodeps | Skip the package dependency check before before installing a package.
    |'
