- pgno: 164
  md: '# Chapter 5: Configuring Red Hat Linux


    The glibc-devel package requires a library of common functions and gets the

    following message:


    You install that package first and then the glibc-devel package by entering the

    following commands:


    ```

    rpm -ivh /mnt/cdrom/RedHat/RPMS/kernel-headers*.rpm

    rpm -ivh /mnt/cdrom/RedHat/RPMS/glibc-devel*.rpm

    ```


    Many programs also make use of the Linux kernel header files.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_164_0.png)


    Compiling many Linux software systems, especially the kernel source, re-

    ires that your include files located in a standard place —either the

    /usr/include or /usr/src/linux/include directories. Symbolic links placed in

    t/usr/include directory enable files to be located in each loca-

    tion, so add them by entering the following commands:


    ```

    cd /usr/include

    ln -sf /usr/src/linux/include/asm-i386 asm

    ln -sf /usr/src/linux/include/linux linux

    ln -sf /usr/src/linux/include/scsi scsi

    ```


    Your Linux box can compile C programs using the Make utility.


    # UNINSTALLING


    With multi-gigabyte disks now commonplace, there''s no longer a need to worry

    about running out of disk space. That said, you don''t want to keep unneeded stuff

    around just because you have room for it. You still waste time figuring out

    what a particular package does, and if you never use a package, it is a drag on

    yand your system. You also need to uninstall something because it is obsolete.

    in any case, uninstalling packages is very easy with RPM. I hesitate to say that

    administration function is easy because so many little details can sneak in and
    bite

    you. RPM keeps track and accounts for these little nasty details.


    # REMOVING A PACKAGE


    Perhaps you''ve installed a package and experimented with it. But now you no

    longer need it and you want the disk space back.'
