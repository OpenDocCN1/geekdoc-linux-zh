    2. LILO Configuration (continued)


    This step asks you to install LILO on your hard disk. This book assumes a dedicated
    IDE disk and you will want to use the default /dev/hda. However, if you are using
    the multiple partitions method (typically referred to as a dual boot system),
    then you typically will still use /dev/hda. The exception is if you have Windows
    NT with NTFS in the first partition. In that case, select the partition where
    the /boot directory is located (/dev/sda1). You will typically need to use a boot
