    # The X Window System


    Linux works just fine from a simple shell interface (that is, the shell prompt).
    An experienced administrator or user can do many things by entering commands at
    the shell prompts – this is analogous to working from the MS-DOS C: prompt. In
    fact, an administrator should perform a large percentage of tasks by entering
    ex-'
