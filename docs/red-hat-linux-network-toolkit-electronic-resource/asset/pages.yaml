    THIS CHAPTER INTRODUCES some of the tools and techniques that you can use to configure
    Linux. Of course, you have been configuring Linux since installing it in Chapter
    1. However, those chapters performed configuration on the fly, so to speak, in
    an ad hoc manner. In this chapter, you are shown how to configure Linux system
    in a more systematic fashion.


    Red Hat provides three configuration systems that represent important evolutionary
    steps in the professionalization of Linux. Red Hat developed two of these systems,
    and the third is another proprietary system that Red Hat includes in its distribution.
    The first examples in this chapter discuss these systems and show you to use them.


    Another important aspect of Linux administration involves configuration of the
    kernel. The standard kernel that comes with Red Hat is a good base, but it doesn''t
    include all the subsystems necessary for doing things such as establishing Point-to-Point
    Protocol (PPP) connections – that is, TCP/IP connectivity over a serial, or modern,
    plain line. One of the greatest features of Linux is that you can configure it
    on the fly. In other words, you can insert modules that include'
