- pgno: 182
  md: '# Chapter 5: Configuring Red Hat Linux


    # 153


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_182_0.png)


    Figure 5-10: Control Panel


    LinuxConf is a new system and its functions should grow with time. For now, it''s
    useful for configuring several of the important Linux systems administration functions.
    LinuxConf is a GUI that ties together the Red Hat administrative utilities in
    one place. There is some overlap in functions between LinuxConf and control panel.
    You can use any of the overlapping functions as you see it.


    You can run LinuxConf from the command line, an xterm window, or a virtual console.
    Enter the command LinuxConf from a command line and you will get a simple menu-based
    window. Use the Config menu item to select the LinuxConf program and the Control
    menu to enter the Control Panel system. Use the cursor keys to navigate through
    either system.


    # Manually modifying user accounts


    User login accounts are controlled by three files: /etc/passwd, /etc/shadow, and-/etc/group.
    The passwd file contains the user name, an encrypted password and if you choose
    not to use passwords; the user and group numeric id (which are the same by default
    under Red Hat); the user home directory; a field for general information about
    the user; the user account home directory; and the type of shell used. The password
    file contains the user name, encrypted password and access information about the
    account (note that system login accounts have no encrypted passwords because they
    cannot be logged into and thus do not have passwords). The group file contains
    the user name, a numeric group identifier, and zero or more user names that belong
    to the group (it can also contain a group password but that is rarely used); additional
    user names are separated by commas.


    Continued'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# Manually modifying user accounts (Continued)


    The passwd file can be edited by hand to add and modify users. It is generally
    okay to manually modify an existing user account but better to use either the
    useradd, userdel, and usermod command line programs or the LinuxConf GUI to add
    and delete users.


    Red Hat creates a group for every new user. If you add the user paul, then the
    numeric user id might be 500. The group id for the group paul is set to 500 too.
    This method allows all of a user''s files to be private unless the user wishes
    to share them. In that case, you add another user''s or group''s name to the user''s
    group in the /etc/group file.


    For instance, if you want to allow jorgito, ednita, lidia and aida to access jorgito''s
    files, then edit the following line for the user jorgito in the /etc/group file.


    ```

    jorgito:x:500

    ```


    and add the users ednita, lidia and aida:


    ```

    jorgito:x:500:jorgito:ednita:lidia:aida

    ```


    This allows both of those users to access jorgito''s files. The catch is that
    the other users can only access files with the group permissions that allow access.
    For instance, the following file


    ```

    -rw-rw-r--  1 jorgito jorgito  312 Sep 30 20:36:X0 Xrootenv.0

    ```


    belongs to jorgito and the group jorgito. The group access is read and write,
    so the other users can read both read and write to that file.


    You can create user accounts through the Control Panel or LinuxConf interfaces
    or manually edit the above mentioned files. That''s a fairly difficult process.
    The intermediate way is to use the useradd program. Enter the following to add
    the new user.


    ```

    useradd jorgito

    ```


    If you examine the /etc/passwd, /etc/shadow and /etc/group files you see that
    the user jorgito has been added. Red Hat starts with the user and group ids of
    500. The home directory /home/jorgito has been created and the skeleton files
    copied over. Everything has the correct ownership.


    You can delete user accounts using the userdel program. To remove jorgito, enter
    the following command.


    ```

    userdel jorgito

    ```


    There are many options — for instance, to create a user home directory along with
    the user — available with usadd and userdel. Please consult the man pages for
    more information.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Building a Custom Kernel


    The Linux kernel is a dynamic beast. It can be configured to dynamically recognize
    new devices or systems by recompilation. The kernel accepts the executable code
    as modules. The beauty of this approach is that you can experiment with new stuff
    without the time-consuming recompilation process. The kernel is also far more
    efficient in terms of space utilization because only the drivers that are needed
    are loaded at any one time; they can also be unloaded. You can still compile drivers
    that are used all the time, but it is your option.


    # Modularized kernels


    Table 5-8 lists the Linux utilities that maintain and modify the kernel modules.


    # 5-8 LINUX KERNEL MODULE UTILITIES


    | Utility | Description |

    |---|---|

    | lsmod | Lists currently loaded modules |

    | insmod | Inserts a module into the active kernel |

    | modprobe | Loads a module or more than one module and their dependencies |

    | depmod | Creates a dependencies file for a module (used by modprobe) |

    | rmmod | Removes a currently loaded module |


    # Adding a Module to Provide SLIP Support


    In anticipation of Chapter 8, where I describe setting up a PPP connection to
    the Internet, this section shows how to install the SLIP module. SLIP is short
    for Serial Line IP and is a simple method for establishing an IP connection over
    a serial (that is, telephone connection) line. It has been superseded by the Point-to-Point
    Protocol (PPP) but is still used by some good communications software to establish
    an IP connection.


    Unfortunately, the Red Hat kernel does not include SLIP support so you have to
    add it. That is not difficult with modular kernels. Log on as root and mount the
    Red Hat CD-ROM as usual. Install the package by entering the following command:


    ```

    rpm -ivh /mnt/cdrom/RedHat/RPMS/slip*

    ```


    You should have the SLIP system installed now.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# Using the /proc file system to display Linux system internal information


    You can check to see if SLIP has already been installed. The /proc file system
    is actually a view into the kernel''s internal tables. If you list the /proc directory,
    the numbered directories correspond to the running process IDs and contain information
    about each process. The other directories and files deal with major kernel systems.
    The /proc/net contains information about the network. If you list the contents
    of /proc/net/dev, all the network devices are displayed. Enter the following command:


    ```

    cat /proc/net/dev

    ```


    The listing below shows the contents of /proc/net/dev.


    You can see if your Ethernet adapter - eth0 - and the pseudonetwork device, but
    no SLIP devices.


    Alternatively, you can see if SLIP is installed with RPM. To do this, enter the
    following command:


    ```

    rpm -q 1 slip

    ```


    RPM tells you that no SLIP package is installed.


    There is no RPM SLIP package to install. Red Hat installs the kernel package in
    its base configuration. Enter the following command to locate it:


    ```

    rpm -q1 kernel | grep -i slip

    ```


    It returns the location as follows:


    ```

    /lib/modules/2.2.12-9/net/slip.o

    ```


    Go ahead and install the SLIP module with the following command:


    ```

    insmod /lib/modules/2.2.12 9/net/slip.o

    ```


    This command returns the message shown in Listing 5-6, indicating that you do
    not have all the necessary modules installed.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Chapter 5: Configuring Red Hat Linux


    Listing 5-6: Ismod failed because slip.o is dependent on other modules.

    slip.o: unresolved symbol slhc_free_R3787e5b9

    slip.o: unresolved symbol slhc_remember_Rbc0f8a5e

    slip.o: unresolved symbol slhc_uncompress_Ra2ca7e04

    slip.o: unresolved symbol slhc_compress_R5d6388a9

    slip.o: unresolved symbol slhc_init_R20741a64


    No problem. The modprobe utility looks at the module to be loaded and determines
    if it depends on any other modules. Any dependent modules are loaded first. Enter
    the following command:


    ```

    modprobe /lib/modules/2.2.12-9/net/slip.o

    ```


    It does not return a message after it succeeds. Enter the ismod command to make
    sure the modules were loaded:


    ismod


    This command returns the information shown in Listing 5-7.


    Listing 5-7: The Ismod shows the SLIP module was successfully loaded.


    | Module | #pages | Used by: |

    | --- | --- | --- |

