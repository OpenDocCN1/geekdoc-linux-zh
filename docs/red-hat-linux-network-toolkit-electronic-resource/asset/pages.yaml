- pgno: 123
  md: 'The hierarchical directory structure/inode is obtained by storing the names
    of other directories in a directory file/inode list. Notice the directory X11
    (denoted by the d immediately after the inode number) in Listing 4-4. The inode
    8035 points to a file that contains another list of file and inode pairs. And
    of course, any of those files can be directories that point to other files and
    directories.


    A file consists of an inode, the associated data blocks, and a filename in a directory
    file. Symbolic and hard links offer two different means for associating different
    names with a file. All hard links, however, will share the same inode with a file.
    A soft link does not share the inode.


    The kernel knows where to look for inodes that make up any given file because
    it has a master table of file information called the Superblock. The Superblock
    contains the number of data blocks, the block size, the number of inodes, and
    the free and used inodes of the file system. The Superblock is loaded into memory
    at time. One of the reasons why you should perform a systematic shutdown (that
    is, halt) of your Linux computer is to write the updated Superblock to disk. (Linux
    is generally smart enough to reconfigure the file system check - fsck -a Superblock
    after an unscheduled shutdown, but it is good administrative practice to avoid
    the risk of possible injury to your system.


    The Virtual File System (VFS)-I''ve also seen it the Virtual File System Switch
    - sits between the low-level file system where the software drivers directly control
    the hardware and the high-level file system that works with various formats such
    as ext2 and mdsos. It provides a layer of abstraction so the system programs that
    deal with features like opening and closing files don''t have to deal directly
    with the device drivers. VFS translates the high-level operations into the language
    that the device drivers understand.


    When you specify a directory path-for example, in the command ls /etc/X11-the
    kernel first looks in the root (/) directory file for the string etc. If the kernel
    finds this string, it uses the inode to access the /etc directory file. The kernel
    then looks for the string X11 and if it finds this string, the kernel uses the
    inode to find the /etc/X11 directory and list its contents.


    # Understanding how Linux organizes files and directories


    The Linux file system also describes the structure that houses all the files that
    make up Linux. It is based on a rooted tree. The tree is made up of directories
    and files. Each directory can contain one or more subdirectories. Directories
    are used to organize files, and each directory or subdirectory can contain zero
    or more files. A file contains either information (data), an executable program
    or script, device information, or nothing.'
  merge: -1
