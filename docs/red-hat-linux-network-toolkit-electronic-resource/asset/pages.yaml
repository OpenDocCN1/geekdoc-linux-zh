- pgno: 233
  md: '# Part III: Expanding your Network Services


    existing Red Hat printer configuration gives you a quick tutorial on configuring
    Linux.


    The last example in this chapter shows you how to use a printer over the network.
    It is perhaps superfluous to extol the virtues of a printer over the network,
    but I want to do it. This function alone makes the network worthwhile. My old
    company wasted a great deal of time and money purchasing and sharing printers.
    Until we got our NFS network, we shared printers by means of switch boxes and
    long serial cables, by physically moving printers, and with a floppy-disk/sneakernet.
    No method sufficed and we-f we basically ended up self-limiting our productivity.
    This setup severely impaired our productivity, and we didn''t realize the extent
    of the productivity drain until we could access a common fast laser printer.


    The following instructions show how to configure your Linux-Samba server to work
    as the printer server for your network.


    Note: The default smb.conf file that comes on this book''s CD-ROM does not require
    editing to work. The following instructions that refer to it are instructional
    purposes only. I continue to use the names on my system – such as the HP LaserJet
    5l (PCL) – and you should make the appropriate substitutions for your system.


    +   1. Login to the Windows computer toluca as the user lidia.


    +   2. Login to the Linux server chivas as root.


    +   3. Restore your original smb.conf file from the backup copy


    ```

    cp /etc/smb.conf.orig /etc/smb.conf

    ```


    Do not restart the Samba daemons just yet, however.


    +   3. Edit the smb.conf file and find the [global] share section, as shown below.:


    ```

    [global]

    printing = bsd

    printcap name = /etc/printcap

    load printers = yes

    ```


    This section gives Samba which printer daemon Linux uses. (BSD is the default,
    but Linux also uses sysv, hpux, aix, qnx, and plp. Linux works with BSD; the others
    are mentioned for the sake of being complete.) It also tells Samba the values
    for the lpr and lpq commands Linux uses to perform the actual printing.


    +   * The printcap name parameter defines where the Linux printer configuration
    file is located.


    +   * The load printers parameter indicates whether to load all the printers defined
    in the printcap for browsing.'
