- pgno: 174
  md: '# Viewing an X Client on an X Server


    Recall that the X Window System is made of two parts: the X Client and X Server.
    The client and server can run on a single computer or on separate computers connected
    via a network. The following discussion briefly describes how to graphically view
    a remote process.


    # USING AN X CLIENT AND X SERVER ON THE SAME COMPUTER


    First, display an X Client on your own X Server. Your X Server is the system that
    you started by running the startx program.


    > The terminology is somewhat confusing because the term server generally implies
    a computer that runs services for you while you are its client. In case of X,
    the X Server defines the software that takes care of displaying the graphical
    information generated by the X Client. Thus, when you start up X (literally the
    program /usr/bin/X11/X) you are starting up the X Server. The output of the X
    Client is displayed by the X Server.


    You need to give permission to the X Clients to display on your X Server, from
    a command line run the following program:


    ```

    xhost +

    ```


    This gives permission to any X Client on any network that has access to your X
    Server to display on your computer. This can be a security hazard so in the future
    use the more specific command like xhost +somehost to allow specific hosts or
    networks display access. Please refer to the man page on xhost for more information.


    > xhost can still present a security problem if you are displaying sensitive information
    on a computer that is used by more than one person. That''s because any user who
    can log onto that computer can connect to the X Server. On the other hand, if
    you are the only person to work on a computer, then using xhost should not be
    a problem. However, if you are sharing a computer with others and work with sensitive
    information, use the auth program rather than xhost. Please consult the auth man
    page for more help.


    Next, from a command line on your computer display the simple graphical clock
    by entering the command:


    ```

    xclock -display :0

    ```'
  merge: -1
  img_proc: true
