  md: '# Appendix C


    # What’s on the CD-ROMs


    This book comes with two CD-ROMs. CD-ROM 1 contains the Red Hat Linux Publisher''s
    Edition distribution. CD-ROM 2 contains my own scripts plus supplemental software
    that is referenced in this book.


    # CD-ROM 1


    The official Red Hat Linux Publisher’s Edition is contained on CD-ROM 1. The major
    directories are:


    +   - images: The files used to create boot images used during the Red Hat Linux
    installation.


    +   - RedHat/RPMS: The RPM packages that contain the Linux and supporting system.


    +   - dosutils: Utilities used to assist in the installation of Red Hat Linux.
    These include MS-DOS programs for making room for Linux on existing systems.


    # CD-ROM 2


    The second CD-ROM contains scripts and software that are used in the book and/or
    that I find useful.


    +   - Officeware: A demo of the powerful office software suite for Linux.


    +   - Arkea: The Knox Software Arkeia backup system. This system provides a network-based,
    automated backup system.


    +   - dial: The dial-on-demand dial system monitors your network for outgoing
    network communications. When it detects outgoing traffic, automatically dials
    up your ISP and opens a PPP connection.'
  merge: -1
  img_proc: true
- pgno: 439
  md: '# Appendixices


    +   - dns: This directory contains several domain name service (DNS) scripts.
    The scripts match the instructions used in the book and will create a DNS server
    right out of the box.


    +   - email: This directory contains several sendmail scripts. The scripts match
    the instructions used in the book and will create an e-mail server right out of
    the box.


    +   - extras: Several software packages are contained in this directory. These
    are packages that I find to be useful but not described in the book.


    +   - firewall: This directory contains several ipchains-based scripts that are
    used to create firewalls.


    +   - misc: Two simple scripts are located here. One is a crontab script that
    is oriented towards preventing the dial system from accidentally holding a phone
    connection open overnight. There is also an script containing aliases that I find
    useful.


    +   - security: This directory contains software that is used to increase your
    computer security.


    +   - chapters: This directory contains two virtual chapters for the book. History
    covers the origins of Linux and Samba; Resources tells you how to access additional
    Linux resources.'
  merge: -1
