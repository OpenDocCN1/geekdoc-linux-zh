- pgno: 304
  md: '# Chapter 9: Introducing Systems Administration


    The most recent versions of GNU tar, such as the one that comes on this book''s
    CD-ROM, now have gzip compression included as an option. The previous examples
    for creating and extracting tar files can include gzip compression using the gzip--z-option,
    as shown in the following commands:


    ```

    tar czf lidia.tgz /home/lidia

    tar xzf lidia.tgz /home/lidia

    ```


    Note that I use .tar filename suffix to indicate that the file is a gzipped tar
    file. Please refer to the tar man page for more information.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_304_0.png)


    Throughout this book, I use the gzip program to compress a file or files and pipe
    its output to tar. This is the traditional combination, but is no longer necessary
    with the modern tar with the gzip and ungzip options. In some circumstances, I
    have continued to use the old combination because it shows the use and operation
    of pipes as well as the gzip and tar programs.


    # USING THE CPIO UTILITY


    The GNU cpio utility creates cpio archives to store files in. It is more complex
    to use than tar because you feeds it the files you want to process. Each extra
    step, however, makes it extremely flexible for picking files and directories to
    archive. Because it archives whatever filenames you pass to it, you can archive
    complex directory trees.


    Creating a cpio archive is referred to as copy-out mode and is specified by using
    the -o parameter. Here''s a simple cpio process to archive the files in the /home/lidia
    directory to a cpio archive called lidia:cpio.


    ```

    find /home/lidia | cpio -o > lidia:cpio

    ```


    Here, the find command simply sends the name and path of each file in the /home/lidia
    directory. (In this case,/home/lidia does not have subdirectories so you could
    use the l command to send the files to cpio and it would work as it does in this
    example.) cpio converts the contents of each file into its own format. If you
    do not redirect it to a file or device, the contents of each file are sent to
    standard output and you will see them flash.


    Extracting files from a cpio archive is referred to as copy-in mode and is specified
    by using the -i parameter. If you want to extract the files, omit the t option
    and cpio attempts to recreate the files in the current directory. Enter the following
    command to recreate the files relative to the current directory:


    ```

    cat lidia.cpio | cpio -i

    ```'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# 276 Part IV: Managing your Network


    You can take advantage of bash''s capability to redirect standard input and output
    by substituting the following single command, which is more elegant and efficient
    than the previous example:


    ```

    cpio i < lidia.cpio

    ```


    In this case, cpio balks because the it it archived already exist in the current
    directory. If you redirect your output to another directory, it will happily create
    them at that location. The following command redirects them to the /tmp directory
    (Red Hat removes all files from /tmp that are older than ten days):


    ```

    cat lidia.cpio | (cd /tmp ; cpio -i

    ```


    You can list the files in a cpio archive by using the following command:

    lidia.cpio | cpio it


    Unlike the tar utility, requires that you prefix all option parameters with a
    hyphen (-). For example, the previous command does not work if you enter it as
    cpio it.


    cpio also has the capability to copy files from one directory to another. This
    capability—called cpio-pass—combines the function of copy-in and copy-out does
    not create a cpio archive. The following command copies the files in /home/lidia
    to /tmp:


    ```

    find /home/lidia -print | cpio -p /tmp

    ```


    The cpio operating modes are copy-in, copy-out, and copy-pass. They enable you
    to create, delete, list, or modify cpio archives. The archives can be stored to
    a file, pipe, or a device (such as a tape). Please refer to the cpio main page
    for more details.


    # Using the tar utility for low-volume backups


    If you have a small network—such as a home office or small business—you may not
    even need a dedicated backup system. In my own home network, I simply do not have
    much data to back up. I have several megabytes of word processing files, some
    spreadsheets, a few HTML files, and my Linux configuration files. Because I store
    all my data files on my Linux server, my Microsoft Windows workstations zero data—aside
    from their own configuration files and application software—stored on them. I
    keep a backup of some of their configuration files and application software on
    the Linux server. I use the tar application to back up the critical directories,
    and'
  merge: -1
