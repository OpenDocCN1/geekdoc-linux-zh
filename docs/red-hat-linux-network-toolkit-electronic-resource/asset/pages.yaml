- pgno: 202
  md: '# Chapter 6: Learning Samba by Example


    The [nomes] section defines the generic parameters for how an individual user''s
    directories are exported. If your Windows 95/98/98 user name matches a Linux username
    and you supply the correct password, you can double-click this icon in the Network
    Neighborhood and gain access to your home directory.


    The [printers] section describes how printers are configured. You can expand on
    these special sections to create more specific services. They are useful in and
    of themselves, but you can also view them as templates.


    The man page offers a complete description of smb.conf. To view it, enter the
    following command:


    ```

    smb.conf

    ```


    Note: BSD printing is probably the most popular style of UNIX (and certainly Linux).
    It uses the Berkeley model instead of System V. The daemon lpd and the program
    lpr read both the /etc/printcap file to learn about the printer definitions. The
    daemon lpd is started at boot time and can be restarted at any time. It prints
    leftover jobs and then runs continuously in the background, listening for print
    requests from lpr. The program lpr is used to initiate the printing of a file.
    It copies the file to a spool directory - a temporary place to hold the file -
    then signals lpd that a file is ready to be printed. The spoiled file is then
    converted by filter programs to a printable form and then sent to the printer
    by lpd.


    # Introducing the Red Hat default smb.conf file


    As you expect, Red Hat has a nicely preconfigured smb.conf file. Listing 6-2 shows
    a copy of the file that you install in Chapter 1. This is the standard configuration
    file that comes with the Samba system.


    Listing 6-2: The Samba smb.conf file


    ```

    # This is the main Samba configuration file. You should read

    # smb.conf(5) manual page in order to understand the options listed

    # here. Samba has a huge number of configurable options (perhaps too

    # many!) of which are not shown in this example


    # Any line that starts with a ; (semi-colon) or a # (hash)

    # is a comment and is ignored. In this example we will use a #

    # for commentary and a ; for parts of the config file that you

    # may wish to enable

    #

    # NOTE: Whenever you modify this file you should run the command "testparm"

    # to check that you have not made any basic syntactic errors.

    ```'
  merge: -1
  img_proc: true
