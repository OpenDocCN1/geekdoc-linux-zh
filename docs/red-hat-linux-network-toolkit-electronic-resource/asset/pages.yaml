  md: '# Checking the status nmmbd setup


    You can check the status of the nmmbd process by entering the following command:


    ```

    nmblookup -B chivas

    ```


    where chivas is your Windows client. You should get PC''s IP address back. If
    you do not, check the PC setup.

    To do a general search of every PC on your network, enter the following command:


    ```

    nmblookup -d 2 "*"

    ```


    You should see a response from every client on the network, as shown below.


    Added interface ip=192.168.1.250 cast=192.168.1.255 nmask=255.255.255.0

    Sending queries to 192.168.1.255

    Got a positive name query response from 192.168.1.250 ( 192.168.1.250 )

    Got a positive name query response from 192.168.1.101 ( 192.168.1.101 )

    192.168.1.250 *<00

    192.168.1.101 *<00


    You can check your passwords more precisely by entering the following command:


    ```

    smbclient \\chivas\root\ -U root

    ```


    (I use the username root here because that is the only user that has to be installed
    during the Red Hat Installation process in Chapter 1. Adding users is discussed
    in the section "Adding Linux Users" in Chapter 6. The root service is used because
    it is the only service that I guarantee to be available at this point.)

    Enter the password for root. If you get the smb: \> prompt them your setup is
    correct. At the prompt, ? to see the available commands. You should be able to
    use the dir, get, and put commands.


    Two of the common errors are "invalid network name" and "bad password." The first
    error probably means that the service for tmp is incorrectly set up in smb.conf.
    The latter error can have several meanings:


    +   * You have shadow passwords without smbd support for them.

    * You are using encrypted passwords without smbd support for them.'
