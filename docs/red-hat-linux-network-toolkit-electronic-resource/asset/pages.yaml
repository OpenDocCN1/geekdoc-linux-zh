- pgno: 157
  md: 'Now that you have an overview of RPM, some examples are in order. The Red Hat
    installation process, which I introduce in Chapter 1, uses the RPM system to install
    the default packages plus the Samba package that I had you specify. Consequently,
    you have RPM packages available that you can use for practice. The beauty of the
    RPM system is that if something goes wrong during your experiment, you can easily
    recover. The RPM system takes care of the messy details.


    # Querying


    Because you already have RPM packages installed, I start the examples with the
    Query function so you can see what''s installed. I show you how to inventory the
    packages installed in Chapter 1 and then proceed to find details about the contents
    of an individual package.


    # FINDING ALL SYSTEM''S PACKAGES


    Before you install any package, examine what the Red Hat installation process
    (which I describe in Chapter 1) has installed on your system. To display all installed
    packages, enter the following command with the -a option:


