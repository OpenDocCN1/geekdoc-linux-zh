- pgno: 145
  md: 'plicit commands from the command line, to maintain an understanding of the
    underlying mechanics of the system. However, users of a Linux system – and administrators,
    to a lesser extent –greatly benefit from using a Graphical User Interface (GUI).
    One reason is that you can do many things at once by separating tasks into different
    windows. Many tasks – for example, Web browsing – are best done graphically.


    The Window system – more commonly referred to as simple X – is a GUI just like
    Windows 95, 98 or NT in that it insulates you from the underlying operating system.
    However, it operates “on top” of Linux as an application. This is similar to the
    old Windows 3 which uses MS-DOS as its base, while the Windows GUI is tightly
    integrated with its operating system. The Linux version of the X Window system
    is called XFree86, reflecting its allegiance to the Free Software Foundation.
    It is produced by the XFREE86 Project, (The Free Software Foundation (FSF) is
    described further in CD-ROM Chapter 2).


    XFree86 is stored primarily in the /usr/X11 directory. The executable programs
    and their libraries are stored in subdirectories. The configuration files, including
    X86Config, are stored in the /etc/X11 directory. The .xinitrc file, which can
    configure the look and feel of your Window main screen, is generally stored in
    your login directory.


    If XFree86 is anything, it is highly adaptable. You can configure it in so many
    ways that it is freely confusing to the novice, and even to more experienced users.
    When I first installed it, I was lucky and actually got it working quite quickly
    with the help of the configuration program Xconfig. However, it quickly broke,
    and I spent the next few days trying to recover the system. Red Hat obviously
    recognizes this problem as a major hurdle to mass acceptance, because the Red
    Hat distribution includes the reasonably easy-to-use Xconfigurator program. It
    works well. I have used it to configure several systems with different VGA cards
    and


    You can obtain more information about XFree86 by visiting the following website:
    http://www.xfree86.org.


    # # The GNU General Public License (GPL)


    Linux users use the GNU General Public License (GPL). The Free Software Foundation
    developed the GPL as the key concept to its goal that software should be freely
    distributable. (For more information on the Free Software Foundation, see CD-ROM
    Chapter 2.) To that end, the GPL is designed to promote the freedom to distribute
    its software. The GPL does not necessarily mean that the software is free. Red
    Hat charges for the value it adds to Linux in the CD-ROM and the configuration
    tools.'
