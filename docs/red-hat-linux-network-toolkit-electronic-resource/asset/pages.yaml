    # Introducing Linux and Samba permissions


    Linux permissions play a controlling role in how Samba shares behave. Linux permissions
    supersede Samba permissions. Therefore, if Samba says that you can do something,
    Linux does not permit it then you cannot it.


    What are file permissions? File permissions control who can read, write, and execute
    a file. Every file has permissions for the user it belongs to, the group that
    it belongs to, and everyone else. If you do a long format listing of a directory
    or a file, you get a listing that includes the file’s permissions – among other
    information – in the order just listed. For example, you may enter this command:


    ```

    ls -1 /etc/rc.d/init.d/smb

    ```


    Here''s the information that command displays:


    ```

    -rwxr-xr-x 1 root root 1177 Sep 25 12:12 /etc/rc.d/init.d/smb

    ```


    The characters rwx identify the permissions; as you probably have guessed, stand
    for read, write, and execute – the hyphen (-) character means no permission. The
    order of their placement does not vary, so the hyphen in this example means no
    write permission.


    These characters are grouped as owner permission, then group, and finally other
    permissions. The owner is root in this case, as is the group (that information
    is, of course, shown to the right of the 1). The other group means any user who
    is not an owner or a member of the group – that is, others.


    # UNDERSTANDING LINUX PERMISSIONS


    Linux permissions are important for Samba management no matter what permission
    you set in the Samba configuration, it does not override the Linux file system
    permissions. For instance, if you set a share to be public but the directory that
    the share points to not have the correct permissions set, that share will not
    be accessible to the public. The following example demonstrates this convention.


    +   1. Log in to the Windows computer toluca as the user lidia.

    2. Log in to the Linux server chivas as root.'
