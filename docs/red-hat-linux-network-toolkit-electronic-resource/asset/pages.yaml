- pgno: 359
  md: '# Part IV: Managing your Network


    3. Click on the checkbox before the Arkeia window. It displays the information
    on your backup as before. The backup should run quickly with information on the
    results appearing at the bottom of the window.


    Please note that when configuring the interactive backup you have the choice of
    associating different savepacks with different drivepacks and also different pools.
    This provides you with a flexible way of using your resources.


    > TIP Arkeia offers a command line interface called arkc.You can install the arkc
    package by logging onto chivas as root and entering the command rpm -iv /mnt/cdrom/Arkeia/arkc*.
    Please consult the arkc documents in the /usr/knox/arkc/ directory for more information.


    # Using a SCSI tape drive or tape library


    To make better use of this backup system, you are most likely to need a device(s)
    capable of storing gigabytes of information. The most common medium is a DAT tape
    drive.


    This book does not describe the process of using a DAT drive, or a real tape library,
    in detail. The following paragraphs provide some information on how to find information
    on a DAT if you have one. It points out parts of the previous example you should
    change in order to accommodate such drives.


    If you don''t want to purchase a tape library, you can use a 4mm or 8mm DAT drive.
    they are generally SCSI devices. It is best to purchase a good SCSI controller
    to work with a DAT. (Technically, tapes used for data storage are referred to
    as DDS, but they are commonly referred to as DAT).


    If you want to use a SCSI drive, then consult the /usr/doc/HOWTO/HARD-WARE HOWTO
    for details on installing. Linux comes with numerous SCSI drivers. Once installed
    and the DAT device shows similar to /dev/st0 or /dev/stl.


    Arkeia provides installation and configuration information in its in-document
    documentation. Use your browser to look at the file:/usr/doc/arkeia-server-4.2.1/html/install/setup.htm
    and file:/usr/doc/arkeia-server-4.2.1/html/install/setup.htm for detailed information
    on configuring Arkeia for DAT tapes, tape libraries and other devices


    # Configuring a Windows client


    Arkeia provides a Windows 95 client. It is stored in the windows.zip file in the
    /mnt/cdrom/Arkeia directory on the companion CD-ROM. To install the Windows client,
    proceed as follows.


    +   * Log in as root as chivas.'
  merge: -1
  img_proc: true
- pgno: 360
  md: '# Chapter 10: Automating Network Backups


    +   2. Mount the Red Hat Publisher''s Edition CD-ROM (optional).


    +   3. Install the unzip program (gunzip does not work on .zip files) and unzip

    with the following commands (optional)


    ```

    rpm -ivh /mnt/cdrom/RedHat/RPMS/unzip*

    ```


    +   4. Create a temporary directory.


    ```

    mkdir /var/tmp/arkeia

    ```


    +   5. Unzip the Windows client to the temporary directory.


    ```

    cd /var/tmp/arkeia

    unzip /mnt/cdrom/IDG/Arkeia/client

    ```


    You could copy the unzipped files to your Windows machine and then run the installation
    program. However, a more elegant method is to leave a single set of files on the
    Linux server, mount that directory on your Windows computer, and then run the
    installation program. This method is efficient because you do not make multiple
    copies of the file. If you install this, or any program, on more than one machine,
    then you do not end up with copies on multiple machines.


    +   6. Edit the /etc/smb.conf file by hand or with SWAT and add a share for

    the /var/tmp directory.


    ```

    [Arkeia]

    path = /var/tmp/arkeia

    public = yes

    ```


    +   7. From your Windows computer, mount the Arkeia share by opening your Network
    Neighborhood, double-click the chivas icon and then doubleclick the Arkeia share.
    You should see the Setup.exe program. Double-click that icon and the software
    installs itself. (You need to use the Microsoft Virtual Machine, available at
    http://www.microsoft.com/java/vm/dl_vm32.htm, installed for the Java based Arkeia
    GUI to work under Windows 95 or Windows 98.) The MS Java VM must be installed
    before installing the Arkeia Windows client and GUI software.


    +   8. Next, locate the Knox sphere submenu in the Start → Programs menu. Click
    on the Arkeia selection. The Arkeia server GUI is functionally the same as the
    Linux Server Administration window.


    +   9. Create a savepack for your Windows client. Use the same process as creating
    a Linux savepack. Finally, go to the Interactive Backup and select the new savepack
    and one of the existing drivepacks. Click on the Ok button and the backup should
    start.'
  merge: -1
