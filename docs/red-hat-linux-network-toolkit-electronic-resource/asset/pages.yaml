- pgno: 270
  md: '# Chapter 8


    # Creating NFS, NIS, DNS,

    and E-mail Servers


    IN THIS CHAPTER


    +   - Creating an NFS Server

    - Creating an simple NIS server

    - Configuring automount

    - Creating a simple DNS server

    - Creating a simple e-mail server


    RED HAT LINUX CAN PROVIDE many resources in addition to Samba. For instance, Linux
    can share files and directories via the Network File System (NFS). The Network
    Information Service (NIS) makes it possible to automatically share common resources
    across your network. The Domain Name Server (DNS) centralizes the job of sharing
    network host names and addresses. You can also create an e-mail server that will
    take care of all of your internal messaging as well as communicate with external
    e-mail systems.


    # Creating a New Red Hat Linux

    Computer


    The services described in this chapter require that you use a Linux computer (or
    a UNIX computer if you have one) to make good of them. You can simply use the
    Linux server chivas.paunchy.net as a client to itself, but that arrangement will
    only demonstrate the services. This chapter makes use of the new Linux computer
    cementeros.paunchy.net. Go ahead and build the new box and give it the IP address
    192.168.1.200. Don’t worry about answering the questions about NIS—step 5 in the
    section “Continuing the Configuration” in Chapter 1—because this chapter describes
    how to configure it manually'
  merge: -1
