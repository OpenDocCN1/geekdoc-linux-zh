- pgno: 165
  md: 'I don''t use the nfs-server-clients package that Red Hat installed by default,
    I''ll use it as an example of the remove command. Even if you find you want it
    in the future, you can always use RPM to install it. Enter the following command:


    ```

    rpm -ev knfsd

    ```


    No message is returned; RPM just goes ahead and erases nfs-server-clients. Enter
    the following command:


    ```

    rpm q -i knfsd-clients

    ```


    You get the following message:


    package knfsd-clients is not installed


    This message verifies that the package was removed. That was simple as pie.


    # VERIFYING


    The verify option takes the following form:


    ```

    rpm V|y verify verify options

    ```


    RPM provides a way of checking, or verifying, the current contents of a package
    against the original pristine package as found on the CD-ROM or the Red Hat Web
    page. The verify option compares the size, MD5 sum (checksum), permissions, type,
    owner and group of the current package files against the originals. That information
    can be used in a number of ways. It can provide simple information about what
    you have (similar to the query information), and it can help in debugging a problem
    by telling which files have changed since the initial installation.


    In the previous example, you simply removed the Samba package in order to completely
    restore its configuration information. This simple, brute-force method also removes
    a number of log files that you would not want to remove in a mature system. If
    you had used the RPM verify option as shown in the following command, RPM would
    tell you which files had been modified:


    ```

    rpm -V samba

    ```


    In my case, this gives the following information:


    ```

    S.5....T c /etc/smb.conf

    ```


    The eight characters before the c - which means they are configuration files -
    identify each type, attribute, or change that RPM recognizes. The S means the
    file size has changed, the 5 means the MD5 sum has changed, and the T means the
    modification time differs from the original. The dots (.) mean that a corresponding'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Chapter 5: Configuring Red Hat Linux


    attribute has not changed (in this case, the L, D, U, G, and M attributes have
    not changed). Table 5-6 describes the meaning of each attribute.


    # TABLE 5-6 THE RPM VERIFY FORMAT


    | Character | Attribute | Description |

    | --- | --- | --- |

    | 5 | MD5 sum | The file''s checksum |

    | S | File size | The file size in bytes |

    | L | Symlink | The symbolic link |

    | T | Mtime | The file''s modification time |

    | D | Device | Specifies that it is a device file |

    | U | User | The file''s user ID (the user ownership) |

    | G | Group | The file''s group ID (group ownership) |

    | M | Mode | The file''s permission and/or mode changed |


    To experiment, changing the owner of /etc/smb to bin, as shown in the following
    command:


    ```

    chown bin /etc/smb.conf

    ```


    Run the following RPM command (rpm -V samba) and you get the following result:


    S.5..U.T c /etc/smb.conf


    The U specifies that the ownership of the /etc/smb.conf file has changed. Don''t
    forget to change it back to root again!


    # UPGRADING


    The upgrade function of RPM is useful in many ways. When the next version of Red
    Hat Linux comes, you obviously will want to upgrade to some or all of the new
    packages. Linux is like any other operating system and some packages will have
    bugs that need to be applied; most packages will be improved and updated over
    time and will need to be replaced.


    Upgrading is very simple. Identify the package that you want to upgrade, and use
    the -U option instead of the -i option. RPM automatically unalls the old package
    and installs the new one; it will, however, save your old configuration files
    (with the suffix .rpmsave) that are not compatible with the new package. Otherwise,
    upgrading works the same way as installation.'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'For example, instead of explicitly erasing and reinstalling Samba (as I describe

    in the section "Uninstalling and then Reinstalling a Package\ you could enter
    the

    following command:


    ```

    rpm -Uvh --mnt/cdrom/RedHat/RPMS/samba*

    ```


    The old files belonging to the Samba package will be deleted and the new ones

    installed. The old smb.conf file is saved as smb.conf.rpmsave.


    # INSTALLING LINUX SOFTWARE THE OLD-FASHIONED WAY


    Traditionally, software has been distributed and transferred to Linux systems
    with

    tape archive --tar-files. With a tar file, one or more files can be stored in
    a single

    file, saved to a storage device, or transferred through a Linux pipe with

    /bin/tar command. Anyway, the tar file offers a decent method for distributing

    software; this method is widely used throughout the Linux and UNIX world. (I have\more
    to say about the tar command in Chapters 9.)


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_167_0.png)


    > Tarball is common UNIX/Linux slang for a tar file.


    To install a software system that is stored and distributed in a tar file, you
    should

    use the following guidelines:


    +   1. Un-tar the file (this generally means saving the individual files in

    one or more directories on your computer). If the tar file is compressed

    (it is compressed if it has one of the following sufficientgz, gz, and Z),

    y can specify a tar option to uncompress it.

    2. Most software comes with a makefile, which contains rules for

    compiling and installing the software. Sometimes you need to explicitly

    modify the makefile or use it to create dependencies - in that case, enter

    the make depend command. See the manual page for make (man make)

    for more information.

    3. The software is compiled. The syntax for doing this can be as simple as

    make or make all.

    4. Optionally, the makefile installs the compiled software, configuration,

    hand help files for you - typically by running a make install command.


    That''s it. If all goes well, you have your system installed. My experience is

    most Linux tar systems compile and run with minimal difficulty.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# Chapter 5: Configuring Red Hat


    I didn''t realize until I started writing this book that Red Hat does not include
    a single tar file on its CD-ROM distribution. That is quite a shift in philosophy
    from traditional Linux and the Slack distribution. If the Red Hat philosophy becomes
    the facto standard, a large division could result between the Internet community
    and the commercial side. I imagine that many in the Linux/GNU community will continue
    to use the tar method while the commercial side migrates quickly to RPM. Whether
    that anything negative in terms of the so-far successful software development
    cycle is anyone''s guess.


    There will be times when you can''t use RPM. In Chapters 10 and 11 I use some
    security-oriented packages that are not available in the RPM format. They come
    in tar form and you will need to install and compile them manually.


    # Displaying simple help messages


    Most Linux commands and utilities provide a simple and quick help system. Enter
    the string --help or -h as the only parameter and generally about one screen of
    options is displayed. For example, the command gzip --help displays the help information
    shown here:


    ```

    gzip 1.2.4 (18 Aug 93)

    usage: gzip [-cdflhLnNrtVlw19] [-S suffix] [file ...]

    -c --stdout    write on standard output, keep original files unchanged

    -d --decompresscompress

    -f --force     force overwrite of output file and compress links

    -h --help       give this help

    -l --list       list compressed file contents

    -L --license   display software license

    -n --no-name do not save or restore the original name and time stamp

    -K --name       save or restore the original name and time stamp

    -q --quiet      suppress all warnings

    -r --recursive operate recursively on directories

    -S .suf --suffix.suf use .suf on compressed files

    -t --test       test compressed file integrity

    -v --verbose    verbose mode

    -V --version    display version number

    -1 --fast       compress faster

    -9 --best       compress better

    file...         files to (de)compress. If not given, use standard input.

    ```'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'Recall from Chapter 4 that the Linux File Standard (FSSTND) specifies that
    the system administrator should use the /usr/local directory for local software.
    It is a good idea to install new packages — especially when not supported by the
    distribution — in a well-known area separate from the standard system software.
    That keeps your basic system relatively clean and distinct. In the long run, keeping
    new software separate reduces confusion and the possibility of mistakenly erasing
    or corrupting software.


    # # Exploring the X Window System


    It is important that you read this entire section carefully before working with
    the X Window System. (XFree86 is the Linux implementation of X Window.) You are
    manipulating physical monitor and video adapter settings that control high-voltage
    and high-frequency electricity. Some setting combinations are in-compatible and
    can damage equipment and possibly!


    XFree86 comes without any warranty of any kind. Anything that you damage even
    after reading these instructions is your own problem.


    The X Window system was installed as part of the Red Hat installation system.
    This section discusses a little about how the X Window system works.


    Much of Linux administration can be handled through the Red Hat Control Panel
    and LinuxConf— are Graphical User Interface (GUI) front-ends to several scripts
    and programs that configure system functions such as network interfaces and user
    modification. Both require the X Window system. Ofcourse, the Control Panel is
    only one reason to install the X Window system. Dozens of other applications require
    X Window. Everything from Netscape to Xclock de-pends on it. It''s hard to imagine
    a GUIless world.


    X configuration has always been the touchiest system to configure under Linux.
    It requires many different, and sometimes competing, parameters to work together.
    It is not always obvious how one parameter affects another. However, the continued
    maturation of the Xconfigurator program has made that chore easier.'
  merge: -1
  img_proc: true
- pgno: 170
  md: "# Chapter 5: Configuring Red Hat Linux\n\n# # XFree86\n\nXFree86 is the Linux\
