- pgno: 113
  md: 'You don''t need to know everything about Linux, but you should understand a
    few essential points. In this chapter, I describe the fundamentals of Linux, Samba,
    X and networking protocols. To manage your system effectively in the long term,
    you need to understand the basics of not only Linux and Samba, but also networking.
    Without an understanding of these fundamentals, you are like a race driver who
    doesn''t know what a piston is. To get the most out of your vehicle—be it a car
    or a computer—you need to know a little about what happens underneath the hood.


    # # Just What Is Linux Anyway?


    The word Linux has several meanings. For example, it refers to the Linux kernel,
    which is the program that controls the interaction between the hardware and the
    application programs that you use and control. It also refers to everything that
    comes on the Red Hat (or other manufacturer''s) distribution CD-ROM—that is, all
    the software that works as a Linux system. That includes the Linux kernel, system
    programs, the X Window system, and GNU (which stands for GNU''s not UNIX) programs.
    The term Linux also refers to us as a community of developers and users—as in
    “Linux is gaining market share.”


    In other words, the meaning of the term generally depends on the context in which
    you use it. If I call the Red Hat people and ask to purchase Linux, they will
    happily send me their CD-ROM. If you are asked to “start Linux,” you need to start
    the Linux kernel. Or if you say, “bring me the Linux box,” I know to bring you
    the computer with a Linux distribution installed on it. As you digest the fundamentals
    of what makes up Linux, you should have no problem determining what people mean
    when they refer to Linux.


    This theme carries through to other subjects. The Linux file system, for example,
    refers to information stored on a magnetic or optical disk that is organized in
    such a way that Linux can make use of. Don''t worry, all the terms and concepts
    that you introduce in this chapter make sense after some practice.


    # # Exploring the Linux Kernel


    The Linux kernel is a program that handles the following tasks:


    +   * Determining when and for how long programs get executed

    * Determining when and where to store programs and data in memory

    * Refereeing the interaction among the devices that your computer comprises


    Basically, when a process—user or system—asks for resources (such as when opening
    a file), the kernel receives the request and doles out the resources. The kernel
    does not actually control the processes directly. Because they depend on the kernel
    to respond to their requests, however, it controls indirectly.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Chapter 4: Looking Under the Hood


    When a program gets executed, it is referred to as a process or a task. A user
    process has limited access to system resources such as memory. A system process
    has fewer limitations. The kernel imposes these limitations to prevent them from
    interfering with each other and possibly crashing the system.


    What does this master of the Linux universe look like? Log onto your Linux box
    and enter the following command from your shell prompt:


    ```

    ls -l /boot

