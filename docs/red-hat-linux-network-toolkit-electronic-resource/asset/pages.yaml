    a service out of the new user account, (whose content is shown in the preceding
    section of this chapter). After you create a new user account on the Linux-Samba
    server, you can automatically access its home directory from Samba. The default
    smb.conf file is pre-configured to export the home directory of Windows clients
    whose user name/password match the Linux user name/password. This is the'
  merge: -1
  img_proc: true
