- pgno: 151
  md: 'extra features such as PPP or other device drivers, the kernel is running.
    You may use some of these extra features so that when you want to compile them
    permanently into the Linux kernel. You can easily recompile Linux, and I show
    you how to do so in this chapter.


    # Understanding the Red Hat Package Manager (RPM)


    One of the great frustrations of systems administration is managing software packages
    and systems. Adding, deleting, modifying, and just plain inventory is a constant
    chore. I have several computers that I use on a daily basis. I have a good idea
    of what software I have and where to find the software that I use frequently,
    but my systems also have lots of software and configuration files that I have
    to rediscover when I find the need to add them. Add to the necessity of changing
    a package, and I start really angry as I pick my way through endless directories
    and libraries. I am not organized to make a formal database of the system—and
    so doing take a lot of work. I just along the best I. There must be a better way.


    The Red Hat Package Manager (RPM) goes a long way providing that better way of
    handling the complexities of systems administration. It automatically installs,
    uninstalls, and upgrades software. It operates like any other Linux command with
    the use of command-line options. RPM uses its database to keep track of what''s
    what and where, and relieves you of that messy task.


    RPM is a big improvement over distributions such as Slack. In the past, I never
    hesitated to install a new package (How can you resist free software?), but I
    took deep breaths before upgrading those packages. Very often, I would completely
    delete stuff if I didn''t have to delete, just to ensure that the upgrade would
    not stumble over its parents. Upgrading to significantly newer kernels enabled
    number of disk formats! As you can imagine, I really appreciate the simplicity
    RPM brings to the process of installing upgrades.


    An RPM package consists of an archive of files and information describing its
    name, version, and contents. Packages are created to provide a particular function.
    For instance, the Samba RPM package contains the Samba daemons, configuration
    files, manual pages, and other documentation.


    RPM has 11 operational modes. (Red Hat says 10 I include the upgrade as its own
    mode). Five of these modes are most important to a systems administrator:


    +   Install the package with the given options. Here''s the syntax for this mode:


    ```

    rpm -i install package_file

    ```


    +   Install the upgrade package with the given options. You''s the following syntax
    for this mode:


    ```

    rpm -U upgrade-options package_file

    ```'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Chapter 5: Configuring Red Hat Linux


    +   - Erase (uninstall): Erase or uninstall the package with the given options
    (removes all possible dependencies). This mode has the following syntax:


    rpm -e erase-options package_file


    +   - Query: Find out if a package is already installed and where the package
    may be located. This mode has the following syntax:


    rpm q query-options


    +   - Verify: Compare an installed package with the original, pristine package.
    The comparison includes size, a check sum, permissions, type, owner, and group
    of each file. Here''s the syntax you use for verify mode:


    rpm -V|-y|--verify-options


    The last six modes are for software distribution and are of less interest to a
    pure administrator, but I mention them for completeness:


    +   - Build: Create the RPM packages (This mode is mostly for software developers).
    Here''s the syntax for build mode:


    rpm -b0 build-spec <package_spec> B


    +   - Rebuild database: Rebuild the database with the package configuration information.
    You use the following syntax for this mode:


    rpm --rebuildldb


    +   - Fix permissions: Reset the original file permissions to the files belonging
    to a package.


    +   - Signature check: Verify that a package''s integrity and origin are correct.
    This mode checks the digital signature of a package to make sure that it has not
    been tampered with.


    +   - Set owners and groups: Reset the original owner and group to the files belonging
    to a package.


    +   - Show RC: Displays the values of the rpmrc file. The rpmrc file is used to
    set various parameters used by RPM.


    > You can find additional information on RPM in the manual page man rpm. You can
    find additional technical information — file formats and so on — in the text files
    in the /usr/doc/rpm-2.4.10 directory.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_152_0.png)'
  merge: -1
