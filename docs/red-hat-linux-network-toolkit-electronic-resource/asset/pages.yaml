- pgno: 96
  md: "# Chapter 3: Troubleshooting\n\nSometimes a startup script is misconfigured\
    \ and the startup screen goes by but you don't see an error message. Login as\
    \ Root and from the shell prompt enter the command:\n\n```\nifconfig\n```\n\n\
    You see a listing of two different interfaces, as shown in Listing 3-1, or three\
    \ interfaces if you have PPP configured. (I cover using PPP to establish network\
    \ connections to the Internet in Chapter 8.) The program ifconfig tells the Linux\
    \ kernel that you have a network adapter, and gives it an IP address and network\
    \ mask. This is the first step in configuring your Linux box to your network.\n\
    \nListing 3-1: Network interfaces listed\n\n```\nroot@chivas /# ifconfig\nLink\
    \ encap:Local Loopback\n    inet addr:127.0.0.1 Bcast:127.255.255.255 Mask:255.0.0.0\n\
    \    UP BROADCAST LOOPBACK RUNNING MTU:3584 Metric:1\n    RX packets:115 errors:0\
    \ dropped:0 overruns:0\n    TX packets:115 errors:0 dropped:0 overruns:0\n\neth0\
    \  Link encap:10Mbps Ethernet Hwaddr 00:A0:24:2F:30:69\n    inet addr:192.168.1.254\
    \ Bcast:192.168.1.255\nMask:255.255.255.0\n    UP BROADCAST RUNNING MULTICAST\
    \ MTU:1500 Metric:1\n    RX packets:16010 errors:18 dropped:18 overruns:23\n \
    \   TX packets:7075 errors:0 dropped:0 overruns:0\n    Interrupt:10 Base address:0x300\n\
    ```\n\nIf you do not see the line containing lo, which is the loopback interface,\
    \ or eth0, which is your network adapter, then your physical network connections\
    \ have not been set up correctly. The loopback interface is not a physical device;\
    \ it is used for the network software's internal workings. It must be present\
    \ for the network adapter to be configured.\n\nIf the loopback interface is not\
    \ present, enter the following command:\n\n```\nifconfig lo 127.0.0.1\n```\n\n\
    If the network adapter – generally an Ethernet card – is not present, enter the\
    \ following command:\n\n```\nifconfig eth0 192.168.1.254\n```\n\nBecause this\
    \ is a class C network address, ifconfig automatically defaults to the 255.255.255.0\
    \ netmask."
  merge: -1
