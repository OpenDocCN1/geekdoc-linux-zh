- pgno: 338
  md: '# Chapter 10


    # Automating Network Backups


    IN THIS CHAPTER


    +   - Introducing the advantages of automated, network-based backups

    - Introducing the Arkeia backup software

    - Installing the Arkeia software

    - Configuring Arkeia backups

    - Monitoring your backups

    - Troubleshooting backup problems


    THE PROCESS OF MAKING local backups is introduced in Chapter 6. Making local backups
    is a complex process although the mechanics are important, the human factors are
    even more so. Managing the whole process at the minimum requires a large amount
    of your time as a reluctant system administrator.


    # Understanding Backups


    The solution to your time management problem is an automated, network-based, client-server
    backup system. Until recently such software was either very expensive or unavailable
    on Linux. However, there are now numerous companies vying for your business. One
    such company, Knox Software, produces a network backup product called Arkeia.
    Their system works on platforms such as Linux and Windows is included on the CD-ROM.


    > Another backup system is called BRU2000. It''s made by Enhanced Software Technologies
    and more information about it can be found at http://www.estinc.com. The taper
    program also provides another backup system, and comes as part of the Red Hat
    distribution.'
  merge: -1
  img_proc: true
- pgno: 339
  md: '# Introducing Arkeia


    Arkeia is based on the client-server model. The Arkeia server controls the backup
    media and the backup schedule. The media can be simple floppy disk(s), disk file(s),
    a single tape device or a tape library. The schedule can be daily, weekly or monthly;
    and a backup can be of the total file system(s) or only files that have changed
    since the last backup. A client is any machine that you want to have backed up
    and the server can be a client to itself.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_339_0.png)


    Tape libraries, also known as autoaders or jukeboxes, combine one or more tape
    drives, multiple tape slots, and a robotic arm mechanism to transfer the tapes
    from the slots to a drive. The whole system is generally contained within a simple
    box with a door on the front. (The biggest libraries have a slot for inserting
    and removing individual tapes without opening the front door). Tape libraries
    are generally connected to their server but can also be connected by other methods.


    The Arkeia backup server maintains indexes (databases) of what client backups
    have been done and where they exist. The indexes allow you to interactively browse
    the existing backups. Additionally, the indexes keep track of which tapes were
    used for each backup. This relieves you of the burden of keeping manual logs of
    the data located on each tape. You can use the browser to retrieve any backups
    via a GUI.


    Both the backup server and client agents run daemons. The server daemon is responsible
    for starting the scheduled backups, telling the client daemons to start their
    backups, and maintaining the backup indexes.


    The server maintains a schedule of what to back up and when. When the server communicates
    with the client daemon to initiate the backup. The two sides manage the transfer
    of the data corresponding to the file systems being backed up across the network.
    The data is received by the server and written to the storage media.


    Knox Software allows their server to be downloaded from their Web site to help
    you facilitate upgrades and patches and you can also download a time-limited demo
    or a home-use software version.


    Knox Software Corp provides a demo version of Arkeia (with a limited use license).
    They provide four RPM packages that run under Linux, including a client, server,
    command line and Windows interface. They also provide a Windows client that is
    packaged in a Zip format. All of Arkeia software is included on the supplemental
    CD-ROM in the /mnt/cdrom/Arkeia directory.


    Knox Software has a web site, at www.knox-software.com, which provides general
    information on their Arkeia product can be found at www.arkeia.com.'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# Chapter 10: Automating Network Backups


    To understand Arkeia you need to understand its underlying premise. The idea is
    to break down the backup process into component parts, which are then used as
    building blocks to “build” your backup. By decomposing the backup process into
    parts, Arkeia achieves system flexibility and scalability. The parts are called
    the Drive(s), drivepack, Tape Pools, Tapes, savepacks, and Libraries, respectively,
    and they are configured by the Server Administration GUI.


    # Server administration


    The server administration screen is the central control system for Arkeia, and
    the place where all other components are reached. broken down into four major
    areas, includes system menus, server/job status, message area, and the icon bar.
    The system menu area allows you to access all features and function, while the
    icon bar provides shortcuts to the most frequently used functions. The server/job
    status area (center of the screen), shows the backup you are attached to, user/id
    class, and the current date and time. It also shows the active backup and restoration
    jobs that are running. When nothing is running, it indicates that too. The message
    area shows general system status messages.


    # Drive management


    The Drive Management component is used to logically define the read/write device(s)
    (typically the tape drive) to Arkeia. The Drive Management screen allows you to
    define one or more tape drives according to their specific characteristics, as
    well as providing the connection between Arkeia and the tape drive(s). By using
    logical drive definitions, Arkeia refers to the tape drive by its own internal
    logical name without needing to know how it is defined by the operating system.
    This allows you to change the drive definition, if required, without changing
    any other Arkeia settings.


    # Drivepack


    The drivepack is used to group one or more tape drives into a single processing
    group, which allows Arkeia to determine how many drives to use during a backup.
    On a system with one tape drive, this isn’t important since the drive can only
    be used for one task at a time. However, on a backup server with multiple tape
    drives, or with libraries that have multiple tape drives, this feature lets you
    easily perform independent operations (like simultaneous backups and restores)
    very easily. For example, on a backup server with a library that contains four
    tape drives, a drivepack can be defined with just two of the four drives, leaving
    the other two available for other backups. When the backups run, only the two
    drives in the drivepack will be used, which leaves the other drives available
    for performing restore operations. Because of its multi-processing design, Arkeia
    can simultaneously backup data from one client while restoring data to a different
    client.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# Savepack


    savepack specifies which client machines, file system(s), or individual files
    are to be backed up.


    When you configure a savepack, you might might tell the Arkeia server that you
    want to back up XYZ files on client C. Savepack is meant to provide the necessary
    flexibility to back up a diverse network of computers, which allows you to back
    up client-related computers as a single unit. Your grouping could be anything
    from all machines in the company to just those in a certain department or on a
    certain floor.


    # Pools Management


    The Pools screen is used to define a general-purpose storage pool. A pool is a
    set of one or more tapes, and so, by using separate tape pools, you can control
    where your data is saved. For example, a total backup once a week and an incremental
    backup every other night during the week. By using different pools, you can assign
    different retention periods to the backup. This allows you to retain, and keep
    valid, your total backup for say, 12 months, while letting the incremental backups
    expire after one month. Tape pools can be used to separate data in whatever fashion
    makes sense for your company. A default "scratch" pool is provided and can be
    used to hold tapes in reserve in case you run out of logical definitions in your
    regular pools.


    Dividing your volumes also also separate types of data by the person who generates
    the data. This generally makes sense for several reasons. One reason is that computers
    used for different tasks generate different amounts of data. For instance, if
    you use your Linux machine as a file server your Linux server will probably need
    to store more data than the client Windows machines. By creating pools, you can
    assign more volumes to the server pools than your client pools. When you advance
    to the point of using tape libraries, this capability becomes advantageous. Because
    a library has a fixed number of slots, you can put more tape in the heavily used
    pools than the lesser used ones. Thus, the tape library doesn''t run out of tapes
    as frequently as if it had only one pool of tapes.


    # Tapes Management


    The Tapes Management screen is where you create the logical definitions of the
    tapes that will be used during backup and restore operations. Again, Arkeia uses
    logical definitions of the tapes so that the backup and restore processes don''t
    have to consider the underlying attributes of the media.


    # Libraries management


    Libraries combines volume into either actual tape libraries or virtual ones. A
    tape library is a device that, under control of the backup software, automatically
    mounts'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# Chapter 10: Automating Network Backups 313


    one tape from a selection of many tapes into a tape drive. A virtual library mimics
    the action of a tape library, but creates volumes on a disk instead of on tapes.
    Using virtual libraries is a good way to experiment and learn about making backups.
    Arkeia can select volumes from both real and virtual libraries.


    # Installing Arkeia on the Linux Server


    The installation process is simplified by the use of the RPM format. You may need
    at least 50MB of free space on the file system you install it on.


    +   1. Log in as root on chivas.

    2. Mount the IDG supplemental CD-ROM.

    3. Run the following command

    ```

    rpm -iv /mnt/cdrom/Arkeia/arkie*

    ```

    Most of the files are stored into the /usr/knox directory. The Arkeia manuals
    are stored into the /usr/doc/arkeia-server/html directory and can be viewed with
    your browser.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_342_0.png)


    > The FSSTND, as do I, suggests that all third party software be installed in
    the /usr/local directory. However, to keep it simple, I will use the default Arkeia
    installation directory of /usr/knox. If you want to follow the FSSTND guidelines,
    or if you don''t have enough space in your root (/) partition, I suggest creating
    the /usr/local/knox directory and then creating a soft link to ln -s /usr/local/knox
    /usr/knox /usr/knox and finally installing the RPM packages.


    # Configuring the Arkeia Server


    When the savepacks, the drivepacks, and the Pools are combined by Arkeia, you
    are able to automatically back up a network of almost any size. The packs and
    pools can be used to build both interactive and scheduled backups. Once the component
    parts are built, Arkeia takes care of the detailed administration and your function
    becomes the much more high-level one of monitoring the process. You need to make
    sure that previous night''s backup ran successfully and, if not, run again or
    troubleshoot the cause. You also need to maintain the system by supplying new
    and recycled tapes, and the worry of keeping track of the individual files is
    removed.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_342_1.png)'
  merge: -1
