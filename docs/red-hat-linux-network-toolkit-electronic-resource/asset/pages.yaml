    PLOWED THROUGH MY first installations of Linux and Samba in an impatient quest
    to get it all running as soon as possible. I always take that approach and probably
    always will. I don''t care what I have to do to get what I want! The elderly,
    children, friends, and relatives, sweep them all out of my way in a hungry just
    to get that first prompt:


    ```

    [root@localhost ~]#

    ```


    With this approach, I usually get to the prompt. The dark side of this method—if
    I can even call it a method—is that I barely understand what I''ve done or how
    the system works after I get to the prompt. After I complete the installation,
    I painfully (and remorsefully) crawl towards competence. I have to take cold comfort
    in the prompt, because I no longer have any friends and my relatives won''t speak
    to me.

    I also find I don''t reach competence until I gain a fair understanding of the
    de-tails—and if not the details, then at least the general concepts—underlying
    the prompt and all that makes the prompt possible. Similarly, even though I don''t
    want to know how to repair my car''s transmission, I do like knowing how it works.
    (Come to think of it, I took the transmission apart in my first car. I fixed fifth
