- pgno: 242
  md: '# Chapter 7


    # Connecting to the Internet


    IN THIS CHAPTER


    +   - Connecting your Linux computer to the Internet

    - Understanding SLIP and PPP

    - Choosing an Internet Service Provider (ISP)

    - Understanding the role of the Linux pppd daemon

    - Connecting to your ISP with help from the dip program

    - Automating the PPP connection process with the dial daemon

    - Using the Red Hat Network Configurator to make a PPP connection

    - Monitoring PPP and SLIP connections


    YOU ARE PROBABLY FAMILIAR with logging on to a remote computer via modem. If you
    use a service provider such as America Online (AOL), CompuServe (now owned by
    AOL), AT&T, or a university account, you probably use a terminal emulator. However,
    if you use a protocol such as PPP (Point-to-Point Protocol) or SLIP (Serial Line
    Internet Protocol), you actually become a part of the internet — you become a
    node or a LAN. I refer to this type of connection as a node connection.

    An important difference exists between a terminal session and an Internet node
    connection. A terminal session is like riding on a bus—you control where you go
    by choosing the particular route, then leave most of the control to the driver
    and the bus schedule. Using an Internet node connection is like riding your own
    car—you have far more control over where, how, and when to go somewhere, plus
    the responsibility for your decisions.

    With a terminal session, you make a connection to a computer that is connected
    to the Internet. The session works the same as if you were physically sitting
    at your computer''s monitor and keyboard, except it is slower. With a node connection,
    however, your computer becomes part of the Internet. It is the same as if your
    computer is physically connected to an Internet Service Provider (ISP) network,
    except the connection is slower. Figures 7-1 and 7-2 show diagrams of the two
    connection types.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# Part III: Expanding your Network Services


    Phone Connection


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_243_0.png)


    Your Computer Remote Computer with Internet Connection


    Figure 7-1: A terminal session


    Node Connection


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_243_1.png)


    Your Computer


    Figure 7-2: A node connection


    At first glance, the node connection may not seem to offer a great advantage over
    the terminal connection. Companies such as CompuServe and AOL offer software that
    provides good Web browsing and file transfer capabilities. However, the capability
    of your computer or LAN to seamlessly become part of the Internet is a powerful
    one. It removes a layer of software to deal with. It removes your dependence on
    a particular service provider''s proprietary software and service. It enables
    you to tap into a vast reservoir of software and gives you more control over your
    own destiny. Most important, you can run multiple applications over the serial
    connection at one time. For example, you can run a Web browser, a Telnet session
    or two, and an FTP job, all at once. The only limitation is the speed of your
    connection.


    This chapter describes the mechanics of making node connections. To establish
    a foundation for managing your connection, I also describe the Internet and LAN
    protocols that are the basis of these types of connections. And to help you better
    manage your connections, I address management and security concerns.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# Chapter 7: Connecting to the Internet 215


    # Node Connections


    Node protocols are currently used to make node connections. Both the Serial Line
    Internet Protocol (SLIP) and the Point-to-Point Protocol (PPP) provide a method
    for using the telephone network to speak IP to remote places. Both protocols encapsulate
    IP packets in order to deliver them over serial connections.


    # SLIP


    SLIP is a simple method for delivering an IP packet over a phone line. It simply
    adds a control character to the beginning and end of every IP packet. The control
    characters are SLIP-END and SLIP-ESC. They are decimal values 192 and 219 in the
    ASCII 7-bit definition.


    +   * SLIP-END marks the end of an IP packet. SLIP-ESC marks ESC and SLIP-END
    characters embedded in the IP packets. If data contained in an IP packet coincidentally
    matches the value of either of the control characters (192 or 219 decimal), the
    addition of a SLIP ESC tells the other end of the connection not to treat it as
    a control character. Figure 7-3 shows a hypothetical SLIP packet encapsulating
    the message hello world.


    | 192 | IP header | h | e | l | l | o | w | o | r | l | d |


    Figure 7-3: A SLIP-encapsulated message containing hello world


    The SLIP-END is something of a misn because it starts as well as ends each packet.
    The SLIP-START character is not needed, because the SLIP-END acts to frame the
    IP packet.


    > SLIP is defined in RFC 1055, "A Nonstandard for Transmission of Datagrams over
    Serial Lines: SLIP" (Ronkey, 1988). This is a de facto standard and not an official
    Internet protocol. (The term RFC stands for Request For Comment—this is the method
    by which Internet standards are introduced and discussed.) You can find RFC 1055
    at http://www.landfield.com/rfcs.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_244_0.png)'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# Part III: Expanding your Network Services


    I prefer simplicity whenever possible. Unfortunately, SLIP is just a bit too simple.
    It doesn''t do anything other signal the start and end of an IP packet. This limitation
    presents several problems:


    +   - IP address negotiation is possible. Each end of the connection must know
    the other end''s IP address from the outset of the connection. The IP address
    can be determined outside of SLIP, but connections would be more efficient if
    SLIP could handle that task rather than relying on another protocol.

    - Each IP packet must be the same size. If one packet is smaller, meaningless
    characters to make up the size. If a packet is larger, it must be broken up (and
    maybe padded, too) to match the size that the other end of the connection expects.

    - The underlying packet type (IP can handle several types) is invisible until
    the SLIP packet is unpacked, which makes connection less efficient.


    My experience with SLIP attests to these shortcomings. Many years ago, I wanted
    to connect my company to the Internet without paying the steep price of ISPs.
    I placed an inexpensive MS-DOS 386X PC in a colleague''s office at the University
    of New Mexico, and connected it to his LAN, which was routed to the Internet.
    At my office, I connected a Sun workstation to the 3865X via a modem. The PC ran
    under MS-DOS, the Sun ran with UNIX, and both had SLIP. I could establish a connection,
    and SLIP allowed IP connections to run, but only for a few minutes or seconds
    before SLIP would crash. As soon as I got that far, the administration rejected
    – for several reasons that I had to agree with – my formal request for using that
    type of connection, and I ended that for the Holy Grail.


    I am sure that with time it would have much reliably. I have no doubt the problems
    were more the result of my being low on the learning curve than of SLIP. However,
    PPP has established itself as the protocol of choice and SLIP is quickly fading.
    I don''t have any hesitation in recommending PPP for all your needs


    > CSIP, which compresses the IP header but not the data, is defined in RFC 1144,
    "Compressing TCP/IP Headers for Low-Speed Serial Links" (Jacobson, 1990). You
    can find it at http://www.landfield.com/rfcs.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_245_0.png)


    # PPP


    The PPP packet contains information that facilitates the establishment of not
    only the serial connection, but also the encapsulated packet type. Consequently,
    PPP is more complex than SLIP.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# Chapter 7: Connecting to the Internet


    PPP uses the Link Control Protocol (LCP) to establish a connection, and to configure
    and test it. This is an increasingly important feature, as modems become faster
    and more complex. Other connection technologies, such as ISDN, further complicate
    the telecommunications landscape, and thus increase the importance of controlling
    things via your connection protocol.


    PPP uses the internationally recognized High-Level Data Link Control (HDLC) protocol.
    It uses bit patterns as opposed to control characters to distinguish the start
    and end of packets. The receiving end looks at each coming in and if it recognizes
    a pattern, it starts passing the data to the next state. (For more information
    on HDLC, Open Systems, see the discussion on page 216 in Data Communications,
    Computer Networks and Open Systems, by Fred Hals; published by Addison-Wesley
    Publishing Company, Inc., Reading, MA, 1992.)


    The Network Control Protocol (NCP) defines several network level packets that
    PPP can encapsulate. The most popular ones are IP, IPX (Novell''s IP-like protocol),
    and Microsoft''s Network BIOS Extended User Interface (NetBEUI). If your LAN speaks
    any or all of these protocols, they all go through your PPP connection to the
    outside world. Figure 7-4 shows a diagram of a PPP packet.


    | Flag | Address | Control | Protocol | Data | Flag |

    |---|---|---|---|---|--|

    | 1 byte | 1 byte | 1 byte | 2 bytes | 14989 bytes (max) | 1 byte |


    Figure 7-4: A PPP packet contents


    The sequence for making a PPP connection is as follows:


    +   1. You make the modem or other (for example, ISDN connection).

    2. The computer making the connection sends LCP packets to the receiving computer
    establishes a data link, which exists at the Network level, according to the OSI
    network model that I describe in Chapter 4.

    3. The sending computer sends NCP packets to tell the other end what type of protocols
    are to be carried by PPP.

    4. You have a full-fledged Internet connection. Any protocols that are mentioned
    in Step 3 are now usable until another PPP connection is established.


    > PPP is defined in RFC 1661, "The Point-to-Point Protocol" (Simpson, 1994). You
    can find this official Internet standard at http://www.landfield.com/rfcs.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# Making the Connection


    Now comes the problem of making a PPP connection. I want to concentrate most of
    my attention on modern connections because they are the easiest, least expensive,
    and certainly the most popular method currently available.


    However, I should mention a couple of the other widespread technologies. If you
    intend to run a business with any significant amount of Internet traffic, you
    are going to need more than a modem or two. (Linux allow multiple modems to be
    used in parallel, however.) Frame Relay and ISDN are the most common high-speed
    methods widely available. Frame Relay is expensive but almost universally available,
    while ISDN is inexpensive, relatively fast, but least available; ISDN is much
    easier to get in metropolitan areas than outlying lines. The low-end Frame Relay
    connections run at only 56 kilobits per second (Kbps) - kilobits per second, kilobytes
    per second (KBPS) - and are somewhat faster than today''s high-end modems, cost
    several hundred dollars to establish and also per month to maintain. By spending
    roughly four times more per month, you can get a 1.5 megabitsecond (Mbps) connection
    (called a T1 line), which is 28 times as fast, giving you a better price-performance
    ratio. ISDN is widely available in some locations but not others, and still has
    the reputation for being difficult to set up.


    > Theoretically, you can lease a 45Mbps connection to a T3. Unless you need next
    AOL, however, this is an expensive option.


    # Introducing Leased Lines, Frame Relay, and ISDN


    If you need or want a continuous connection to your ISP, you literally need to
    lease a wire from the phone company. In most cases, you end up using a wire to
    connect from your physical location to the nearest phone company switching station,
    where they send your packets to your ISP via their leased line. This system, called
    Frame Relay, is a very common system in the industry and is the one I have.


    Frame Relay gives you a virtual circuit to your ISP that is also continuously
    connected so you have immediate access to the Internet. A device called a Channel
    Service/Data Service Unit (CSU/DSU) converts the binary format of your network
    into that of the phone network; the phone company also uses the CSU/DSU to troubleshoot
    it up to that. The packets or frames travel from your computer, through a router
    (a Linux computer can serve as one) to the CSU/DSU and into the phone company''s
    cables. From there, the phone company switches your information stream through
    their system until it ends up at your service provider''s CSU/DSU. The service
    provider converts it back into IP form and routes to it.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# Chapter 7: Connecting to the Internet 219


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_248_0.png)


    Most consumers and many businesses'' telephone connections start from the customer''s
    premises as D50 connections, which operate at 64Kbps. DSO travels over a physical
    pair of wires (twisted-pair) to the nearest Telco switching station, where the
    wires enter a Channel Bank. Each Channel Bank can handle 24 DS0s and convert the
    analog signals to digital. The Channel Bank multiplexes the D50s into a DS1, which
    has a 1.45Mbps capability; it is also known as a T1 circuit. All the DS1 circuits
    carry digital frames or packets. The DS1 circuits go to the local telephone company''s
    main switching center, where each packet is routed to its final destination.


    ISDN is generally available in most locations in the United States but it is readily
    available in places other than. It is probably an acceptable alternative if it
    is actually marketed in your area. It is a fairly difficult service to set up,
    from both your point of view and the phone''s.

    ISDN can cost more than $100 per month and in many places less than $50 (unfortunately,
    Albuquerque is not one of places). Linux is becoming more compatible with it.
    Linux kernel drivers are available to ISDN, and you can purchase ISDN PC adapters
    that plug directly into your PC. For more information about ISDN, the HowWto file
    in /usr/doc as well the following ISDN-related URL:


    ```

    http://www4.zdnet.com/wsources/content/current.featsub2.html

    ```


    # Introducing TV modems


    Cable TV companies are introducing cable modems in many areas. Even little ole''
    Albuquerque is scheduled to get them. I''m not holding my breath but if and when
    they are introduced 1 I will get one and post instructions on our web page: www.swcp.com/~psgsery/rhlntk2.


    Cable modems offer speeds of several hundredobob per second and just as important,
    they offer instantaneous connection. With a cable modem you have essentially full-time
    Internet connection.


    Cable modems work in the same way analog modems do. However, instead of converting
    your computer''s digital information into an analog form, they convert it into
    another digital form that the cable TV system can handle.


    # Introducing DSL


    Digital Subscriber Line (DSL) uses using copper telephone cables to achieve speeds
    up to 1.5 Mbps at this time. Your speed depends on many factors such the distance
    to your phone company''s central office and the condition of your line. You also
    get a continuous Internet connection.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# Using modems


    A modem converts digital data to the analog form that your average telephone line
    carries. As of this writing, modems theoretically capable of return speeds of
    56Kbps are the state of the art. However, the phone system itself has bottlenecks.
    If even one link in the chain cannot handle the higher speed, the entire system
    is slowed down.


    +   56Kbps modems are rated up to that speed only for data returning from the
    remote connection to your modem. Your outgoing data is limited to a lower rate.
    This limitation is generally tolerable because many Internet functions such as
    browsing the World Wide Web require much more bandwidth for downloading graphics
    or other data than for your outgoing keystrokes.


    Problems like this crop up with any technology. It took a while for consumers
    to accept 1200Bps.


    +   A common acronym used in out of the telephone industry for the analog phone
    system is POTS, which stands for "plain old telephone system (or service),",


    Your problem – at any speed – is to use a modem to connect your network to the
    Internet. Linux provides both a manual and an automatic method for making connections.


    If you want an Internet connection, you can''t go wrong with a modem. Modems are
    the workhorses of the Net, and ISPs are configured to handle them.


    The more recent Linux distributions and the GNU software that comes with them
    have simplified the connection process. The programs for dialing an ISP and negotiating
    the PPP connection are included with Linux and have become progressively more
    sophisticated; the associated documentation also has improved. The explosion of
    demand for node connections and the desire of ISPs to meet the demand have made
    connections progressively easier as the necessary knowledge permeates the market.
    Many ISPs use Linux, which makes connecting easier still.


    # Obtaining an ISP


    Whichever method you choose for making the connection, you need to have an ISP
    to which you can connect. I recommend obtaining service from a local company,
    which is my method. In my opinion, a local company will give you better service
    than a national one. If the ISP is properly managed, your service will come from
    a small number of technical people who know their system and will become familiar'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# Chapter 7: Connecting to the Internet


    # 221


    with you and your needs. This is a big "if" and you may need to try more than
    one ISP before you find the right one. Personal recommendations are very important;
    that''s how I found my ISP.


    Of course, nothing is wrong with a national or international ISP, you will not
    get consistent personal attention. A central service group generally processes
    your questions. Even worse, the people who handle typical calls are accessing
    a question-answer database than relying on their own experience. Your call may
    eventually reach an engineer or technician who knows the system, but you have
    to thread your way through the system first. For this reason, I think the local
    ISP is the way to go.


    Most ISPs give you the choice of several different kinds of accounts. The traditional
    log account is still one possibility, but as I mentioned earlier in this chapter,
    this type of account will not be part of this discussion.


    # Configuring your PPP account


    Okay, one or another you find a good ISP, so what''s next? The ISP should supply
    you with the login information for your account. You need to pay attention to
    the PPP account information and the corresponding phone numbers. The PPP account
    will supply you with either a static or a dynamic IP address. A static address
    is one that is permanently assigned to your ISP; whenever you make a connection,
    you will be known as the same IP address. A dynamic address is one that your ISP
    picks out of a pool of addresses whenever you connect and thus will be different
    every time. Dynamic addresses are becoming more common, if not dominant, because
    they give ISPs more flexibility with their allocation of IP addresses.


    You need several Linux utilities to establish the connection:


    +   - pppd daemon is a program that transfers IP packets across the PPP connection.


    +   - pppd, chat, or dip program establishes a PPP connection.


    +   - the chat helps you automate the negotiation of your PPP connection. Typically,
    you write a chat script that contains the username and password of your PPP account
    and supplies them as needed.


    The following sections provide more details on using and installing those programs.


    # THE PPPD DAEMON


    The pppd daemon converts your local network packets into PPP format, and sends
    them out the Internet via the PPP connection. The pppd is an RPM package and was
    installed as part of the default installation. Log on as root and execute the
    following command:


    ```

    rpm -ivh /mnt/cdrom/RedHat/RPMS/ppp-*.i386.rpm

    ```'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# Part III: Expanding your Network Services


    You can manually start the pppd daemon and supply it with command-line parameters
    to show how to make a connection. I prefer to use the dip application – which
    I describe in the following sections of this chapter – to make manual connections.
    Usually, I use the dial utility to connect automatically. (Subsequent sections
    of this chapter describe how to connect with both dynamic and static addresses.)


    If you recompile the kernel with SLIP support, it will indeed show up as in this
    listing. However, you can also add it dynamically as a loadable module. In that
    case, it doesn''t show up here until you establish a PPP connection. Also, the
    SLIP and PPP modules will be loaded by the kneldd daemon if you are using it or
    dip calls for them.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_251_0.png)


    Consult the pppd manual page for more in-depth information.


    # INTRODUCING DIP AND CHAT


    The Dial-up IP Protocol Driver – dip – utility is a program that you can interactively
    or automate with a script to dial the modem, authenticate your PPP or SLIP connection,
    and then fire up the pppd daemon. Chat is a script interpreter that the on-demand
    application uses.


    You can use either of two primary dip command-line types. First, you can invoke
    dip in an interactive mode by including the -t option, as follows:


    ```

    dip -t

    ```


    I want to show how to use dip interactively only – the following two examples
    describe how to use dip with both static and dynamic IP addresses. I skip any
    file examples because I show how to use dial via a script in the section "Finding
    the Package that Owns a File in Chapter 5, and via the Red Hat Control-Panel in
    the section "Installing the Howto Documents", also in Chapter 5. The dip daemon
    is ultimately far more powerful than a manual dip script. However, the dip command
    examples are easily converted to scripts if you want to use dip that way.


    # Connecting with dip


    You can use dip to create a PPP connection. The following instructions describe
    how to make the connection:


    +   1. Log on as root.


    +   2. Enter the following line again to start dip in its interactive form:


    ```

    dip -t

    ```'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# Chapter 7: Connecting to the Internet 223


    3. You get the DIP> prompt as shown below.


    ```

    DIP: Dialup IP Protocol Driver version 3.3.7-uri (8 Feb 96)

    Written by Fred N. van Kempen, MicroWalt Corporation.

    DIP>

    ```


    4. From the DIP> prompt, use the port command to tell dip where to find the modem.
    In this case, the modem is connected to the second serial port /dev/ttyS1. You
    do not need to specify the full pathname /dev/ttyS1. If you have a soft link /dev/modem
    you can substitute modem for tty: S10DIP port modem. (Note: The Linux serial ports
    /dev/ttyS0, /dev/ttyS1, /dev/ttyS2 and /dev/ttyS3 correspond to MS-DOS ports COM1:,
    COM2:.


    ```

    COMMAND3 ttyS0

    DIP> ttyS0

    ```


    5. Change into interactive terminal mode as follows:


    ```

    DIP>term

    ```


    6. You should see the following information.


    ```

    [ Entering TERMINAL mode. Use CTRL-] to get back ]

    ```


    7. You can enter the at command to make sure that you are connected to the modem.
    The at command means attention.


    ```

    at

    OK

    ```


    8. Dial your ISP by using the atdt command followed by your ISP''s phone number:


    ```

    atdt5555309

    CONNECT 38400

    Welcome to Paunchy''s cyberport. You''re jacked in on dpm2:s33

    Iamisp login:

    ```


    9. You should hear the modem negotiate the connection (unless you have your volume
    turned off) and then see a prompt like the following.


    10. Enter your PPP account login name. Note the convention that my ISP uses is
    to append a capital P before your user name. Your ISP may use a different convention.


    ```

    Your_isp_login: Piwantppp

    ```


    11. Enter your PPP password at the next prompt.


    ```

    Password: popvilleatitself

    ```'
