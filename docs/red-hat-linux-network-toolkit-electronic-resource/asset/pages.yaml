    # Using the Gnome/KDE workstation and server type installations


    If you choose either of the Gnome/KDE workstation or the server types, then you
    will be prompted to allow either Red Hat to create the partition(s) for you or
    do so manually. If you select the manual partition method, then you will use the
    Disk Druid system described in the section "Partitioning the Disk" to create your
    partitions. Please refer to steps 1 to 7 in that sectionfor more instructions.


    If you choose to let Red Hat automatically partitions, then your disk will be
    given a 64MB swap partition, a 16MB boot partition and one large root (/) partition.
    The /boot partition contains the Linux kernel and supporting programs.


    If you choose the Server with automatic partitions, Red Hat will attempt to write
    the five partitions shown in the following table to your disk.


    | Partition | Description |

    | / | The root partition. The mount point of all partitions |

    | /boot | Contains the Linux kernel and extras needed for booting |

    | /usr | Libraries and static files. Also extra applications |

    | /var | Variable files such as logs and temporary files |

    | /home | User home directories |


    The root (/) and var (//) file systems are made equal in size to create each other.
    The usr (/usr) and home (/home) partitions are allocated the same space too. The
    boot (/boot) partition is only enough space - about 16MB- to store the Linux kernel
    and associated files needed to boot the computer. The root and var partitions
    are each roughly 10% the disk space as the usr and home partitions.'
