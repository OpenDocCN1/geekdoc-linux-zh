- pgno: 262
  md: '# Chapter 7: Connecting to the Internet 233


    +   9. Click the Done button and another window appears asking you whether you
    want to save or cancel the edits that you just made.


    +   10. Click the Save button and you return to the Network Configurator.


    You have configured the PPP connection, and you can activate it by clicking the
    Activate button. If your modem is connected properly and turned on, the pppd daemon
    is started and a chat script is run.


    The internal process is very similar to that of the dial example. The shell script
    /etc/sysconfig/network-scripts/ifup-ppp is run when you click on the Activate
    button. It was created from the choices you just made in the Network Configurator.
    When you run the ps | grep pppd command you should see the syscs being run.


    ```

    714 1 S 0:00 sh /etc/sysconfig/network-scripts/ifup-ppp daemon /etc/syscs

    716 1 S 0:00 /usr/sbin/pppd -detach lock modem crtscts defaultroute /dev

    718 7 D 0:00 probe -k s ppp0

    ```


    Notice that the kernel daemon is inserting the pppd daemon into the kernel with
    mode. The chat script to dial your ISP is run now.


    ```

    636 1 S 0:00 /usr/sbin/pppd -detach lock modem crtscts defaultroute /

    641 1 S 0:00 /usr/sbin/chat -f /etc/sysconfig/network-scripts/chat-ppp0

    ```


    Finally, the chat process finishes and the pppd daemon is left controlling the
    connection.


    You again have a full TCP/IP network connection. You are an Internet node. To
    disconnect, just click the Deactivate button in the Network Configurator.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_262_0.png)


    When you establish a PPP connection, as described in this chapter, you can communicate
    with the Internet only from the machine. (If you have an InterNic registered network
    address, then you can turn the connecting computer into a gateway. However, this
    book assumes that you do not have registered addresses and use the public address
    system described in Chapter 3.) The computer can be turned into an Internet gateway
    (router) if you use IP masquerading, which is also known as Network Address Translation
    (NAT). Chapter 11 describes how to do that.'
