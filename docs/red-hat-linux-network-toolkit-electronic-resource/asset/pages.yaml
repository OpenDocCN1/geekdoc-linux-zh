    Restart your network to put the change into effect.


    ```

    /etc/rc.d/init.d/network restart

    ```


    Give it a try from any computer on your Private Network. If, for instance, you
    open a Web browser on a Windows machine and click on www.swcp.com/~pggery/rhltoolkit,
    your Linux gateway should dial up and connect to your ISP and then-after a few
    seconds-you would see the web page.


    # AUTOMATICALLY FIRING UP YOUR FIREWALL


    Whenever you connect to the Internet you should start your firewall as well. One
    simple and effective way of doing that is to have dial ipfilter.rules once the
    PPP connection has been established. You can do this by adding the following commands
    to the end of the /etc/dialfd.conf file.


    ```

    ip-up /usr/local/etc/ipfilter.rules

    nip-down /usr/local/etc/ipfilter.reset

    ```


    The ip-up parameter forces dial to run the script that configures the ipchains
    rules. The ip-down runs the script that flushes all the ipchains rules and sets
    the default policies to accept.


    # CONFIGURING YOUR NETWORK FOR EXTERNAL ACCESS


    The firewall described in this chapter works best configured for one-way connections
    to the Internet. IP filtering presents a formidable wall with this configuration.
    However, when you start making connections from the outside, your internal services
    can become exposed to attack.


    You can replace your services with proxies (for instance, the firewall or www.tis.com)
    but that makes designing your firewall more complex and difficult process. For
    small networks, the advice is to pay an ISP to provide general services, such
    as Web Pages, and take the risks.


    If you want two-way communication, a good compromise is to use Secure Shell for
    incoming connections on your Linux gateway/firewall. Secure Shell can be configured
    to provide both host and user authentication, and can determine whether an incoming
    connection is from a trusted computer. It can also authenticate the incoming user
    (separate from the normal Linux user login process). Secure Shell is essentially
    an application-based firewall.'
