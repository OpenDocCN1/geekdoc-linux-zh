- pgno: 117
  md: '# Understanding Multi-user Systems


    You can tell a lot from the process table. For example, the process table in Listing
    4-2 shows that I am logged on as *paul* (Process Identifier – PID–6611) from Telnet
    connection (PID 6610). I have changed to the root (PID 6630), which is using a
    bash shell (PID 6631). There are several processes that have process identifiers
    (PIDs) greater than 6000, which implies that the computer has been running for
    a while or is heavily used, because PIDs are assigned sequentially starting at
    1.


    Linux also allows more than one person to access the computer. By running programs
    (tasks or processes) that negotiate the login process, the Linux box can handle
    more than one user at a time. In Listing 4-2, the process IDs (PIDs) 292, 293,
    294, 297 and 298 are responsible for logging on users. The menget processes constantly
    monitor the virtual consoles waiting for you to log on (see the Tip for further
    explanation). When you press a key on the console, the login program negotiates
    your authentication by prompting for a user name and password. As you can see,
    I have logged on as *root*. (This isn''t a good idea for a systems management
    perspective – see Chapter 10 for more on systems management.) From the console,
    I have also connected via the Telnet program, which enables you to use the network.
    The *telnetd* process – PID 328 – is controlling your Telnet session. I have also
    changed to the *root* user via the switch user – su in my Telnet session. This
    change is made because the default Red Hat – most Linux – distributions do not
    allow you to log on as *root* except from the console. (This is to increase security
    by forcing you to login as a normal user before switching to root. This also leaves
    a small audit trail of which users switched to root.)


    Each process is associated with a user who has file ownership and permissions
    associated with it. Any files that are created as a result of these processes
    will retain file ownership and permissions. By those same permissions, the processes
    also will be limited in terms of which files they can access and use. Thus, Linux
    is a multi-user operating system.


    By comparison, MS-DOS, Windows 3.X, Windows 95 and Windows 98 are all single-user
    operating systems. Windows NT is a multi-user operating system.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_117_0.png)'
