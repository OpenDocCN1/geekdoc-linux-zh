- pgno: 394
  md: '# tripwire operations modes


    tripwire has four operational modes:


    +   - Database generation. tripwire needs a database of initial file integrity
    checksums to check current files against. It uses the configuration file /etc/tw.config
    to determine which files to generate checksums. This mode creates such a database.

    - Database update. This mode updates the database to account for files that have
    legitimately been changed.

    - Interactive update. This mode performs the same task as the previous one but
    prompts the user for which files to check.

    - Integrity checking. This mode has tripwire check current files against their
    known, good values stored in the database.


    You can tell tripwire to check on the directories of other machines on the network
    by defining the IFHOST macro.


    A template also exists for a shell script that can be run daily by cron to check
    your system''s integrity. The next several files are all documents describing
    tripwire. I recommend you read the FAQ and the README files; README FIRST deals
    with compilation issues so you can skip it. There are three man-page files. The
    siggen file is a program that lets you generate tripwire signatures without running
    tripwire itself.


    For now, leave tripwire as is. I leave it to you to experiment with it as you
    gain experience with your system.


    +   5. Next you need to have tripwire initialize its database. tripwire can take
    a long time to run depending on the complexity of your system and its speed, give
    yourself some time to run it.


    Enter the following command (as root) to initialize the database:


    ```

    tripwire -init

    tripwire chugs away. If it finishes without problems, it looks like this:

    ### Warning: creating ./databases directory!

    ###

    ### Phase 1: Reading configuration file

    ###

    ### Phase 2: Generating file list

    ###

    ### Phase 3: Creating file information database


    ```'
