  md: '# Chapter 9: Introducing Systems Administration


    People will believe that you are organized when they come to you for information
    and you whip out the appropriate folder. It really does help to minimize confusion,
    too.


    # Ensuring reliability


    All the preceding topics are really aimed at making your system reliable. The
    dream of any administrator is a completely reliable system. Of course we''d all
    like to win the lottery and be skinny. The reality of life has never prevented
    me from dreaming the impossible dream. However, you can do some things to make
    the world safer for your system.


    The first thing you can do is to think in terms of reliability. The attitude you
    take has a lot to do with things work. If you have the luxury of designing your
    system from the ground up, you can do many things to fold reliability into its
    core. If you inherit your system, you can still do many things–from system management
    policies to the replacement components you purchase. By thinking in terms of reliability,
    you are more likely to make big and small choices that point in that direction.


    Your policy decisions can have a significant effect on reliability. If you give
    users too much privilege, they can and– delete files that they should not. If
    you do not schedule regular maintenance downtime, your system will gradually degrade
    and eventually fail altogether. If your system will fail when a malicious person
    breaks in to it and wrecks havoc. These are somewhat extreme examples, but they
    illustrate the fundamental role that your policy decisions play in terms of reliability.


    Whether you design your own system or simply maintain an older one, your component
    selection plays an important role in the system''s overall reliability. For example,
    purchasing computer power supplies with ball-bearing-based fans, for a few dollars
    more, can have a significant long-term impact on your system up-time. If you have
    100 workstations, and two power supplies per year, you may have two users for
    a half day each while you identify and fix the problem. Add to that extra trouble
    remote troubleshooting and travel are involved. By spending a few dollars initially,
    you will likely get zero to one failure per year, and end up saving as a full
    user-day of work and frustration.


    Following that line of reasoning, think about the cost of network wiring connectors.
    The individual component cost is a few cents for BNC (base2) connectors. But if
    one fails, the whole network goes down. The costs can be huge for small operations.
    The cost to you as an administrator is large: your time taken away from the tasks
    and your reputation, for instance. If you are a part-time administrator, your
    problems are only amplified, as any problems will probably take you away from
    your real job.


    # RAID SYSTEMS


    Linux supports Redundant Arrays of Inexpensive Disks (RAID). RAID provides a mechanism
    for increasing disk storage reliability and performance.'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# Part IV: Managing your Network


    The six standard RAID levels, only four are commonly used today:


    +   - Level 0 – Disk stripping only. This increases I/O bandwidth and storage
    capacity.

    - Level 1 – Disk mirroring only. The same data exists on two or more disks. Disk
    failures do not result in lost data.

    - Level 2 – Rarely used in practice.

    - Level 3 – Disk stripping with parity. Data is split across multiple disks by
    a byte-to-byte basis. An additional, dedicated disk is used to store parity information,
    which enables all data to be reconstructed if a disk fails.

    - Level 4 – Rarely in practice.

    - Level 5 – The same as level 3 but the parity information is split across multiple
    disks. This is done to increase I/O performance by splitting the parity information
    storage across multiple controllers.


    It is beyond the scope of this book to describe how to use RAID. Please consult
    the /usr/doc/HOWTO/Root-RAID-HOWTO for more information.


    # UPS SYSTEMS


    One of the simplest things you can do to increase reliability is to use an uninterruptible
    power supply (UPS) for your servers. They vary in price from approximately $100
    to many thousands of dollars for commercial systems. They provide your computers
    and other equipment with several minutes to more than an hour of power after a
    blackout. The advantage is that at least part of your operation can continue at
    all times.


    A UPS offers other advantages, too. For example, it acts as a general filter.
    Your equipment is isolated from not only blackouts, but also browns (reduction
    of voltage) and lightning strikes. If you live in a place with marginal or "dirty"
    power, a UPS will smooth it out for you. In the long run, it can save money on
    component replacements because of the isolation from the vagaries of your electrical
    supply, which may find their way into your PC bus.


    # KEEPING SPARE DISKS


    In my last job, our Sun failed one Saturday afternoon. I had been planning on
    shifting from the old Sun to a Pentium running Linux for some time. However, at
    the time the Sun failed, its capacity had exceeded that of the PC''s disk. I had
    held off asking my boss for more money for my experiment when I thought the Sun
    still had more life in. When it failed, I did not have the spare disk ready at
    the time and had to run out to the nearest electronics store and purchase a new
    IDE disk. It actually took me an hour and a half to go to the store, find and
    purchase the disk, and get back to the office. It took another hours to install
    Slackware Linux and set up the Samba server and copy over the old file systems
    (the Sun did not completely fail but instead run for between


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_327_0.png)'
  merge: -1
  img_proc: true
- pgno: 328
  md: '# Chapter 9: Introducing Systems Administration


    one and several hours before rebooting itself). I was lucky that no one was busy
    on a project at that time, so the pain was minimal and not having a ready disk
    out to be okay. But I could have saved myself the worry of having a downed system
    during that interval (Over the next couple of days, I purchased an SCSI controller
    for the PC and the old Sun SCSI disk running on it.)


    So you can see that if you can afford it, you should keep one or more disks on
    your premises. The number of disks, of course, depends on your situation. If you
    are a large operation, need the smallest operation, however, benefits from keeping
    one handy. The idea is to replace a disk when it fails in the minimum amount of
    time. It is more important to have a spare disk if you have a SCSI system than
    if you have an IDE. This is simply because they are less immediately available—you
    cannot simply go to store and purchase one.


    # KEEPING SPARE SERVERS


    The need for a ready server is more problematic than the need for a ready disk.
    The ease of Linux installation makes it quick and simple to reconfigure the operating
    system. It is also easy to replace any PC subsystem. If your PC-based server stops
    functioning, in all likelihood, you need only replace a power supply, a controller
    or the system board. Because none of the hardware components affect the system
    disk''s function, the problem is a matter of identifying the malfunctioning component
    and finding a replacement.


    This solution breaks down if you can''t find the culprit or if you are using proprietary
    hardware. I replaced the Sun server with the PC (in the example describe in the
    preceding section) that it was proprietary and expensive to maintain. I know how
