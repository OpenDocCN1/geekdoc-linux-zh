    # Exporting a service to two or more users


    This section shows you how to use some of the user parameters, which were introduced
    in the preceding example. You can use this variable to allow any number of users
    access to a particular service. This access is not the same as group access, but
    it works in a similar fashion.


    +   1. Login to the Windows computer toluca as the user paul.


    +   2. Log in to the Linux server chivas as root.


    +   3. Restore your original smb.conf file from the backup copy


    +   4. Edit the smb.conf file and find the [myshare] share section. Remove the
    comments, and change the [myshare] share name to [lidia] and the path = /usr/somewhere/shared
    to = /home/lidia and valid users = mary fred to valid users = lidia paul.


    ```

    cp /etc/smb.conf.orig /etc/smb.conf

    ```


    ```

    [Lidia]

    comment = Lidia and Paul''s stuff

    path = /home/lidia

    valid users = lidia paul

    public = no

    writable = yes

    printable = no

    create mask = 0765

