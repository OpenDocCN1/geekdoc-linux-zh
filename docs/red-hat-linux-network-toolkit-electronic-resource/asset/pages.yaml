- pgno: 361
  md: '# Restoring data


    You can restore data to a computer by using the Restoration > Restoration menu
    in the Server administration window. Double-click the client icon that you want
    to restore.


    The files and directories that have been backed up are displayed. Click any or
    all of the icons that you want to restore. Check the checkbox and the Restoration
    activates.


    This window displays all the files and directories that are scheduled to be restored.
    It is often advisable to restore files and directories to a different location
    than they were originally stored on. This is because you often want to manually
    sort through restored files to choose what you want to use; it is also good to
    restore to a temporary location by entering the path name in the Redirection box
    towards the lower half of the window. You can also search for files by clicking
    on the Search button, which is the 8th button from the left.


    Click on the checkbox and the restoration begins.


    # Troubleshooting


    Arkeia is a sophisticated system. A full troubleshooting manual is beyond the
    scope of this book. However, this section provides an overview of the Arkea system
    plus a few specific hints. If you understand the system as a whole, then it is
    easier to overcome problems when they occur.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_361_0.png)


    Keep in mind that Knox Software maintains considerable documentation on their
    Web site in addition to the text provided on the companion CD-ROM. The Arkea GUI
    also contains context-sensitive help screens. You can obtain 30 days of free support
    by filling out their registration form on the http://www.arkea.com/download.html
    page.


    The Arkie client-server backup system consists of three parts: the client, the
    server, and the interface GUI. The client daemon and server daemon can operate
    on the same machine as in the case of the backup server. The client can also operate
    on computers that are on the same network as the server.


    When the client is on a different machine from the server, then you need to make
    sure that all the normal connectivity works. That is, if a client workstation
    cannot communicate with the server (ping, telnet, etc.) then the backup will not
    work. If you are making a backup work then make sure the network is okay before
    you look to the backup software as the problem.'
  merge: -1
  img_proc: true
- pgno: 362
  md: '# Chapter 10: Automating Network Backups


    The Arkeia server has five components that all work in order for backups to succeed.
    Arkeia uses the concept of Pools, Tapes, Drives, drivepacks, and savepacks. These
    components separate the hardware from the software. The computer backups do not
    need to know anything about the underlying hardware that the data is to be stored
    on.


    The pool logically connects one or more backup media – as DAT tapes – into a single
    object. The object is controlled by Arkeia, which maintains all the bookkeeping
    details on what volume(s) belong to it, what files and directories from which
    clients are contained on each volume and where volumes are found. A volume is
    an abstraction for physical media; a volume can be a tape, a disk file, a floppy
    file, a Zip file or any number of other devices.


    When creating tapes of the File type, you must follow the following rules. The
    file device, such as a Zip drive, must be mounted and have a ext2 file system.
    The value that you enter in the Bar code field in the Tape(s) window must include
    the directory and the name of the simulated tape (for instance, /mnt/zip/FileTape).
    Otherwise, the simulated tapes are created in the same directory as you use the
    Bar code value of /mnt then the simulated tapes are created in the root directory
    file system as /mnt/FileTape-1, /mnt/FileTape-2, etc. In case, your data is written
    to your hard disk and not the Zip disk.


    Drivepacks link together one or more backup devices. The drivepack is another
    logical device. You must define at least one drive before you can create a drivepack.
    Libraries define where a volume or volumes can be accessed. If you have a tape
    library


    savepacks combine the client''s files to be backed up with a drivepack. A savepack
    makes it easy to make a client backup. For instance, to back up your server chivas
    you simply specify that, for instance, the directory XYZ uses drivepack W. Then
    you can execute the savepack manually or schedule it to run at some specific time.


    The log files contain a good source of information that can be useful for debugging
    purposes. Click Utilities > Log management from the Server administration and
    you are given a choice of five logs. The logs cover the backups finished, general
    information and the drives, tapes and restorations that you have done. Log information
    is displayed in all the windows that you access from the Server administration
    interface.


    Once you have configured your four Arkeia systems, then it becomes a simple process
    to back up any computer with the software. If you divorced from having to execute,
    verify and maintain manual systems as you would with. Arkeia runs the show and
    you are left to monitor it and keep it fed with volumes.


    If you have problems configuring the system or making backup, then there are several
    places that you can look for. As mentioned there are numerous docu-'
  merge: -1
  img_proc: true
- pgno: 363
  md: 'mentions available to you - both locally (for instance, file:://usr/doc/arkeia-server-4.2.1/html/install/solving.htm)
    and at the Arkeia web site. There is also the information that is displayed on
    the Server administration GUI. Arkeia also maintains several log files that can
    be accessed from the Server administration window by clicking on the Utilities
    '' Log management menus.


    # Summary


    This chapter provides you with the information to get a simple Arkeia client-server
    backup system working, with two examples highlighted. The first is trivial, but
    excellent for learning the basics of the system and how to get it working. The
    second is a real-world example everyone should be able to get working. The more
    complex process of using a SCSI DAT drive system and even a robotic tape library
    is discussed in general terms. Other general topics like scheduling are described.


    +   - An introduction to the Arkeit client-server backup system. Arkeia is an
    automated system (it can also be run manually) that allows you to step back from
    the details of making backups.


    +   - A description of its installation. Arkeia is contained on the companion
    CD-ROM and is in RPM format.


    +   - A description of the configuration and operation of a null backup. This
    backup makes use of the Linux /dev/null device which exists solely in the mind
    of the operating system. The null backup writes to the null device, which simply
    discards the data. This is the simplest method for verifying and learning the
    backup system.


    +   - A description of the configuration and operation of a file backup. This
    file can be any kind of Linux disk drive. A floppy is used in this case because
    it''s the only device that nearly every reader is guaranteed to have - the floppy
    can readily be transferred to Zip, hard disk, or other device. This example allows
    you to create backups and is a good way to practice. In some cases, it might be
    all that you need to use (I use a Zip drive for the daily backup of this manuscript).


    +   - Most operations of any size require at least a single DAT drive. The details
    of doing so are not discussed in this book but the best places to research are
    discussed. You should be able to configure a DAT or a tape library, if you use
    the examples and change the details to reflect the new equipment.


    +   - A discussion of installing and configuring a Windows client. With this client
    you can back up your Windows machine to your Linux server.


    +   - A discussion of the recovery of data. Arkeia makes it a simple process to
    restore files and directories.'
  merge: -1
  img_proc: true
- pgno: 364
  md: '# Chapter 10: Automating Network Backups


    +   - A brief discussion of scheduling backups. Total backups are performed less
    frequently than the incremental ones. Incremental backups include files and directories
    that have changed since the total backup (incremental backups can also be referenced
    to other incremental backups). Total backups can be scheduled on various schedules.
    There are other scheduling operations that you are encouraged to investigate on
