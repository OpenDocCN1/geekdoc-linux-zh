- pgno: 191
  md: "# Customizing the Red HatnStartup Process\n\nThe Linux startup process was\
    \ introduced in Chapter 4. Recall that the rc scripts are used to start the various\
    \ daemons and get the system running. The /etc/rc.d/rc.local script is provided\
    \ so you can add instructions to start your own daemons. In the next chapter,\
    \ I use it to launch a couple of daemons, but I want to mention here that it is\
    \ an important feature.\n\nThis script is executed after all the other startup\
    \ scripts have been run. Therefore, your system should be fully functional by\
    \ the time your scripts are started. For example, the network service should be\
    \ started and the disks mounted. Until you add your functions, the rc.local script\
    \ only sets the standard login screen that you see when you go on. Listing 5-11\
    \ shows this script.\n\nListing 5-11: The /etc/rc.d/rc.local file\n\n```\n#!/bin/sh\n\
    \n# This script will be executed *after* all the other init scripts.\n# You can\
    \ put your own initialization stuff in here if you don't\n# want to do the full\
    \ Sys V style init stuff.\n\nif -f /etc/redhat-release ]; then\n  R=$$(cat /etc/redhat-release)\n\
    \narch=$(uname -m)\ncase \"$arch\" in\n  x86*) a=\"an2\";\n  i386*) a=\"an3\"\
    ;\\nesac\n\nNUMPROC=$$(cat /proc/cpuinfo | grep -i ^bogomips | wc -l])\nif [ \"\
    $NUMPROC -gt 1 ]; then\n  SMP=\"$NUMPROC-processor\"\n  if [ \"$NUMPROC\" = \"\
    8\" -o \"$NUMPROC\" = \"11\" ]; then\n    a=\"an2\"\n  else\n  fi\n```\n\n# This\
    \ will overwrite /etc/issue at every boot.\n# want to make to /etc/issue or you\
    \ will lose them when you reboot."
