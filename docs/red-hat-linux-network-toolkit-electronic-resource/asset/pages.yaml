- pgno: 306
  md: '# Chapter 9: Introducing Systems Administration 277


    the gzip application to compress the tar file and then back up the resulting file
    to floppies and also my ISP account. This system is neither elegant nor sophisticated,
    but it is most importantlyeffective and cheap.


    The following example illustrates the simple command I use to make my personal
    backups:


    ```

    tar cvf /etc/home | gzip > /tmp/backup.tar

    (copy tar file to floppy, Zip, Jaz, tape or other media)

    (copy tar file to ISP or other offsite location)

    ```


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_306_0.png)


    The Linux tar command has the option to compress the data without implicitly it
    to the gzip utility. The -z or compress parameters invoke the gzip utility; the
    -gunzip calls the gunzip; and the -Z or compress invokes the compress command,
    while uncompress calls for the uncompress option.


    Backing up this way is simple and effective. To save time and limited bandwidth,
    I also make incremental backups. During critical periods such as writing this
    book, I make frequent full backups to a disk during the day and then an incremental
    backup to my ISP account at the end of the day. Here''s the command I use for
    the incremental backup that uses the newer- N-feature of tar where the date is
    a simple four-digit month-format date. Note that in this case I use the compression-z-feature
    of tar in place of putting gzip in the pipeline:


    ```

    tar -czvf /tmp/incr.tgz -N 0128 /etc/home

    ```


    For my personal use, I use this simple system, which simply does not require a
    log. At this level, the work involved in keeping a log would probably reduce the
    number of times I back up my work. If I were administering a small system for
    someone else, I would certainly keep a log. When you do for someone else, you
    need to be as systematic as possible so that more records exist about what is
    just in your own memory.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_306_1.png)


    Actually, I do keep a minimal log. On a slip of paper that I keep with the floppy
    disk, I write a quick date and time at the end of the day when I copy my files
    to it. Of course, I have been making copies to it all day, but the endof-day notation
    helps me to remember when my last backup was if I leave my work for a day or two.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# Performing intermediate-volume backups


    For larger networks – including most small- to medium-sized businesses, or a home
    office where you happen to use lots of data – a more substantial backup system
    is necessary. If you need to store several gigabytes (GB) of data you need some
    sort of backup mechanism. You can choose from several technologies: PC tape drives,
    ZIP, JAZ, Digital AudioTape (DAT), Digital Linear Tape (DLT), CD-ROMs, and removable
    hard disks. Tapes are good because of their high capacity, durability, compact
    size, and ubiquitous nature. I recommend making several overlapping backups every
    month. I also recommend that you create long-term archive tapes of particularly
    important information. You could use a portable hard disk, but it would be too
    expensive and cumbersome to carry around. Tapes are the way to go.


    Although I PC tape drives and DAT drives are the best general choices, the others
    can fit specialized needs. For instance, a writable CD-ROM is reliable and reasonably
    inexpensive, but fairly slow, and only has 650MB of storage. I recommend that
    you use in SCSI interface and a 4mm DAT drive. They are fast and reliable, they
    can store between 2 and 4GB of data, and the tapes are inexpensive. In my opinion
    it is important to keep at least a dozen tapes in order to maintain multiple overlapping
    backups, prevent wear and tear, and keep several tapes offsite. Note that it is
    also important to follow the manufacturer''s tape-cleaning guidelines, because
    DAT drive mechanisms are complex and more prone to failure if not cleaned properly.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_307_0.png)


    The BR2000 (backup and restore) backup utility provides a reasonable solution
    for medium sized backups. It gives you a GUI interface that simplifies the job
    of making and reading backups. It is sold by Enhanced Software Technologies, Inc.,
    and provides device-independent operation as well as verified backup and restore
    operations. I used bru with a Silicon Graphics workstation years ago and found
    it superior to tar.


    You can also use the inexpensive PC Travan tape drives. Drivers are available
    for drives such as Iomega Ditto Tape Insider 3200 or the Colorado drives. They
    use either inexpensive proprietary interfaces or the parallel port. The high-end
    drives can back up gigabytes of data at reasonable speeds. However, the tapes
    themselves are expensive at around $35 apiece. At that price, they have never
    been attractive to me because I like to keep a dozen or more tapes.


    It is also important to keep detailed and accurate logs. Figure 9-1 outlines the
    format for such a log.'
