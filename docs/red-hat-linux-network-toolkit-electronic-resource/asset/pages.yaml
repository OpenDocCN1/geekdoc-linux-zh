    Chain forward (policy opt DENY):

    | target prot opt source destination ports |

    | MASQ all | 192.168.1.0/24 anywhere | n/a |


    If you still cannot find the problem, refer to Chapter 7 to make sure that your
    network connections are working correctly. Next, check the HOWTO documents and
    man pages.


    # Summary


    This chapter describes how to set up a firewall to protect your Private Network
    from the worst of the Internet. The ipchains system is used as the heart of the
    firewall. It provides IP filtering that provides excellent protection for your
    private network. When combined with monitoring and testing tools, the firewall
    can be maintained to provide maximum protection at a reasonable cost.


    Topics covered in this chapter:


    +   * An introduction to firewalls. Three basic types are described. The advantages
    of each are briefly discussed and the reasoning for the use of a hybrid firewall
    in this book is given.


    +   * An introduction to the ipchains system. Its basic functions are explained.
    A simple example is given.


    +   * Configuring a simple filtering firewall. A basic set of ipchains rules are
    described so that you can interactively experiment with them. By getting a feel
    for how the system works you can better install and manage the full rule set.


    +   * A description of a full filtering rule set. It is displayed in the text
    but stored on the companion CD-ROM. The rule provides a template that allows the
    major protocols (such as www and FTP) to work through your firewall. You can modify
    the script to allow other protocols through your firewall as desired.


    +   * The process of checking your log files. Log files provide you with the history
    of your system. By studying them, you can discover problems and possible break-ins
    before they progress too far.'
