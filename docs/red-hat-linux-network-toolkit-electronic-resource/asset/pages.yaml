- pgno: 370
  md: '# Creating a Filtering Firewall


    If you have built the Linux Internet gateway described in Chapter 7, then you''ll
    need to protect it with a firewall. The following section describes how to set
    up simple filtering rules. You should keep in mind that you construct the full
    firewall described in this chapter, you are potentially vulnerable to attack while
    connected to the Internet. This is probably a reasonable risk right now, because
    you are connected via a dial-up phone connection, which is invulnerable when not
    connected. Also, the system constructed in this book has no valuable information
    on it other than the passwords (unless you have put information and data on it
    yourself). You can judge the potential danger for yourself.


    Figure 11-1 shows the layout of the network.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_370_0.png)


    Figure 11-1: The Private Network protected by a firewall


    In order to test and build the chains described in this chapter you need to be
    connected to the Internet (a chain is simply a series of filtering rules). If
    you are experienced with IP filtering, then you can translate the rules to apply
    to an internal connection; a good idea if you don''t want to risk being unprotected.'
  merge: -1
  img_proc: true
- pgno: 371
  md: '# Building a simple filter


    You can make a simple filter as follows. The Linux computer atlas is used as the
    firewall in this example. To enhance security it is best to use a separate computer
    for your firewall. By using a dedicated machine you can reduce the services and
    software that it provides in order to minimize potential vulnerabilities.


    +   1. Log in to the Internet gateway atlas as root.

    2. Connect to your ISP

    echo "force" /etc/dial/dial.ctl


    > NOTE The instructions should be carried out from your Linux server''s console.
    If you are working on atlas remotely, then your remote session will freeze when
    you set up the initial rules. You can run the /mnt/cdrom/firewall/ipfilter.sh

    rtet reset script, on the IDG supplemental CD-ROM, to turn off the filters.


    +   3. Flush out any existing rules

    ipchains -F

    4. List all the filtering rules

    ipchains -L


    +   5. You should see the following results if you have not configured any filtering
    rules yet.

    Chain input (policy ACCEPT):

    Chain forward (policy ACCEPT):

    Chain output (policy ACCEPT):


    The results show that there are no input, output, or forwarding rules set and
    that the default policy is to accept any IP packet to come into or out of your
    network. Your system is completely open.


    +   6. Setup your default filter policy to deny all network traffic.

    ipchains -P input DENY

    ipchains -P output DENY

    ipchains -P forward DENY


    Those rules show your output, input and forwarding rules on atlas to deny any
    IP packets in any direction; the following list shows the ipchains filter commands.
    You now have a very, safe firewall. However, it does not allow you to access the
    Internet either.'
  merge: -1
  img_proc: true
- pgno: 372
  md: '# Chapter 11: Building a Firewall 343


    7. Setup the input and output TCP rules. (The following rules set your fire-wall
    to allow you to browse the World Wide Web.)


    ```

    ipchains -A output -p TCP -j ACCEPT -i ppp0 -d 0.0.0.0/0 www

    ipchains -A input -p TCP -j ACCEPT -i ppp0 ! -y -s 0.0.0.0/0 www

    ```


    +   The destination and source addresses -0.0.0.0/0 - indicates the entire Internet
    address space.


    +   The first command sets up a filter that only allows TCP packets arriving at
    the PPP connection (within the Linux gateway atlas) to go out to any location.


    +   The second command allows only the return packets from connections that originate
    from the private network using the ! y parameter. For instance, if you Telnet
    to an external computer, for every outgoing Telnet packet that you send a response
    packet comes back to you. That response packet has its SYN (for synchronize) flag
    set. Thus, with this filter rule set, only the return packets can get back through
    the firewall. It is highly unlikely that any bad guy can take advantage of this
    arrangement.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_372_0.png)


    > Note that these rules apply to your first PPP (-i ppp0) network interfaces and
    will act on network traffic to and your Linux server via the Internet. You can
    apply ipchains rules to any network interface by using the -i parameter. For instance,
    apply rules to the first Ethernet interface you should use the option -i eth0.0
    if you omit the -i parameter, then the rules will apply to all network interfaces.


    8. Setup the input and output UDP rules. The following rules configure the firewall
    to allow DNS queries to go out to the Internet and the response come back in.
    DNS uses UDP and is identified as the domain service.


    ```

    ipchains -A output -p UDP -j ACCEPT -i ppp0 -d 0.0.0.0/0 domain

    ipchains -A input -p UDP -j ACCEPT -i ppp0 ! -s 0.0.0.0/0 domain

    ```


    UDP is a simpler protocol than TCP and requires less configuration. Outgoing and
    incoming UDP packets of the type domain (used by DNS) are allowed. This will permit
    DNS to work.


    The first filter rule specifies that UDP packets of the type domain can leave
    the firewall and go anywhere. This rule allows you to access external services.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_372_1.png)'
  merge: -1
  img_proc: true
- pgno: 373
  md: '# Part IV: Managing your Network


    The second rule allows the return UDP domain packets from anywhere to come back
    in with the DNS information.


    These rules create a simple but quite effective firewall. The more advanced filtering
    rules described in the next section, Building a Working IP Filter, give you a
    more complete firewall.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_373_0.png)


    It often quite useful to turn off all your IP filters and set them to accept mode.
    The script /mnt/cdrom/firewall/ipfilter.reset is shown here, and does just that.


    ```

    /sbin/ipchains F

    /sbin/ipchains -P input ACCEPT

    /sbin/ipchains -P output ACCEPT

    /sbin/ipchains -P forward ACCEPT

    ```


    Once the connection is established, enter the following command to see the status
    of your IP filters.


    ```

    /sbin/ipchains -L

    ```


    The primary ipchains modes, parameters, and options


    As you''ve seen in this exercise, ipchains is a powerful utility. Here I''ve provided
    a quick rundown of the most common ipchains modes, parameters and options. Let''s
    start with the primary ipchains modes:


    -A Append one or more rules to a chain

    -D Delete one or more rules from a chain

    -R Replace a rule from a chain

    -I Insert a rule into a chain

    -L List the rules in a chain

    -F Flush a chain — all rules are lost

    -N Create a new chain

    -P Set a policy for a chain

    -M Masquerading rules to follow'
  merge: -1
  img_proc: true
- pgno: 374
  md: "# Chapter 11: Building a Firewall\n\nPlease consult the ipchains page for more\
    \ information (ipchains --help\nwill display the same information too).\n\nHere\
    \ are some of the more frequently used ipchains parameters:\n\n+   - p Set the\
    \ protocol (for instance, tcp, udp, icmp) for the rule or packet to\ncheck. In\
    \ a chain only apply to packets that match the protocols.\nThe available protocols\
    \ can be found in the /etc/protocols file.\n\n+   - s Determines whether to allow\
    \ or deny packets through the filter depend-\ning on the source address. Every\
    \ IP packet has a source and destination ad-\ress; they also have a corresponding\
    \ source and destination point. Any\npacket with a source address that matches\
    \ an ipchains rule is then\nchecked against the rule to determine whether it passes\
    \ the\nfirewall or not.\n\n+   - d Determines whether to allow or not deny packets\
    \ through the filter depend-\ning on the destination address. Every IP packet\
    \ has a source and destination ad-\\, as well as a corresponding source and destination\
    \ port. Any packet with a\ndest address that matches an ipchains rule is then\
    \ checked against\nt rule to determine whether it passes through the firewall\
    \ or not.\n\n+   - f Setting rules for an individual or type of interface. You\
    \ can option-ally specify configure rules on.\n\n+   - h Display a help screen.\n\
    \nFinally, here are some of the most commonly used ipchains options:\n\n+   -\
