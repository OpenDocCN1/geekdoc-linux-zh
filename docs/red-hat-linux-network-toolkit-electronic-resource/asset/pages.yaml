- pgno: 263
  md: '# Using dctrl


    The dctrl script is a nice GUI-based interface to dial. It is part of the dial
    RPM and can be found in the /usr/bin directory. To run it, log in as root and
    run the following command:


    ```

    dctrl -dstatus -tload -gload -pqueue -dlog

    ```


    That command starts up dctrl and activates all of its display functions. You should
    see the interface shown in Figure 7-11.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_263_0.png)


    Figure 7-11: The dctrl window


    If you click Control -> Control, dial connects to your ISP and remains connected
    until you click on Control -> Forced up again. At that time, if there are no more
    open connections, dial takes down the connection. The open connections are displayed
    in the Connection Queue sub window.


    If you click Control -> Up, dial also starts up a connection. The connection,
    however, remains up only while there is an open connection present.


    By clicking Control -> Down, you remove any open connections from the connection
    and if the Forced Up item is not active, then your connection is broken. Selecting
    the Control -> Block connection choice kills any open connections and prevents
    any new ones from being started.


    # Controlling dial manually


    You can also control the dial connection manually. dial monitors the /etc/dial.ctl
    file, which is a First In First Out (FIFO) queue. You can send signals to that
    file and dial acts as appropriate.'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'The signals are block, unblock, force, unforce, up, and down. They are similar
    to the menu selections and are mostly self-explanatory; see the man page dial-control
    for more information.


    For instance, to start up a PPP connection enter the command:


    ```

    echo "up" > /etc/dial/dial.ctl

    ```


    To stop it do by the following:


    ```

    echo "down" > /etc/dial/dial.ctl

    ```


    # Troubleshooting


    This troubleshooting section is divided according to the sections of this chapter.


    # Fixing modem problems


    If you have trouble getting your modem to connect, then there are several things
    you should check.


    If you have an external modem, make sure that it''s connected properly. Can you
    see the Light Emitting Diode (LED) flicker when you interact with it? For instance,
    if you use dip then you should be able to see the LEDs flicker when you enter
    keystrokes.


    If you have an internal modem, check that it is seated properly on the system
    board. If not, then it might have an IRQ or IO port setting that is conflicting
    with another device. You can check its current settings against the other installed
    devices by looking at the /proc/ioports and /proc/interrupts files (for instance,
    cat /dev/ioports). You can also check the device file that is supposed to be using.
    If, for instance, if you have a soft link pointing to /dev/tty0, then check to
    see if that is correct. You might have to change the link to /dev/ttyS1 for instance.
    Using the dip command to communicate directly with another device (DIP>port ttyS1
    for instance). Keep in mind that if you have a PNP modem, you might have to feature
    off to make it work with Linux. A Win modem will not work with Linux.


    # Using dip to connect to the internet


    The good aspect of dip is that you can see everything that is going on. Any problems
    that occur are immediately visible. If you are having problems connecting via
    dip, turn on its debug mode. You can do that by using the verbose mode: dip t:


    DIP: Dialup IP Protocol Driver version 3.3.0-uri (8 Feb 96)


    Written by Fred N. van Kempen, MicroWalt Corporation.


    DIP: name-root home=/tmp'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# Part III: Expanding your Network Services


    ```

    host=atlas.paunchy.net IP=192.168.1.250

    prot=SLIP MTU=296

    Modem set to "HAYES"

    DIP [0 ]

    ```


    The output shows information about what computer you are working on. Set the port
    to the modem and you see information about the modem: DIP [0 ]port modem-dem.


    ```

    PORT: terminal port set to "modem"

    DIP: tty_open:/dev/modem (3) DIP: tty_open: IBUF=1024 0BUF=1020

    DIP: tty: set_speed=38400

    DIP: tty: set_databits: 8

    DIP: tty: set_stopbits: 1

    DIP: tty: set_parity: N

    DIP [0 ]

    ```


    You''ll enter terminal mode as usual. Try dialing your ISP and then authenticating
    your PPP as usual. Escape back to your DIP> prompt and proceed as described before.
    If there is a problem with any of your settings, then you will receive more information
    about the problem.


    If you continue to have problems getting your PPP connection to work, make sure
    that you don''t already have a default route set. If you have dial running, then
    that can also create problems. You can also check the /var/log/messages file for
    any messages about dip.


    # Connecting automatically to the internet with dialald


    diald is the most complex of all connection methods described in this chapter.
    It uses two systems, both diald and chat, to make connections. It works non-interactively
    and problems are not as obvious.


    If you are having problems getting it to work, then it is best to start with the
    be-gin. Make sure that you can connect to your ISP by using either Network or
    dip methods to verify your connection. Next, make sure that the information in
    the /etc/ppp/connect and /etc/diald.conf files are correct. Pay particular attention
    to the prompt strings like USER_CHAT_SEQ="login:". CHAT_SEQ="word:" and PROMPT="PPP
    session". It is essential that each match up with the strings that your ISP sends
    you. For instance, if dial/chat is expecting the PPP session prompt (as defined
    in /etc/ppp/connect) but your ISP sends the string XYZ session, then dial/chat
    never finishes the connection process and you don''t get your PPP connection.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# Chapter 7: Connecting to the Internet


    You should also check the /var/messages log file for dialog from the dial startup
    process. It shows the progress of each dial session and might include insights
    into your problem. For example, if you have set up dial and everything looks okay
    but no connection is occurring, then take a look at the end of the messages file.


    ```

    tail -20 /var/log/messages

    ```


    It might show something like the following:


    ```

    Apr 18 atlas dial[1312]: Specified device ''/dev/modem'' not a character device.

    ```


    There''s something wrong with the soft link /dev/modem. In this case, the link
    is pointing to the /dev/ttyS0 device. Use the following command to find out what
    serial ports are in use.


    ```

    cat /proc/tty/driver/serial

    ```


    It returns the following information.


    ```

    serinfo:1.0 driver:4.27

    0: uart:16550A port:3F8 irq:4 tx:0 rx:0

    1: uart:16550A port:2F8 irq:3 baud:1200 tx:8 rs:59382 brk:5 RTS|DTR

    2: uart:16550A port:3E8 irq:4 baud:115200 tx:359592 rx:8684037

    RTS|CTS|DTR|DSR|CD

    3: uart:unknown port:2EB irq:3

    ```


    The first port (0) looks like it is unused. The second port, (1) is probably a
    serial mouse because 1200 baud have not been used in years. The third one, however,
    has a 115,200 baud, which is a high bandwidth connection (for a serial port device).
    Modems don''t run at that speed but they do communicate with the computer at that
    rate. It''s a good bet, so change the soft link to refer to the new device.


    ```

    ln -s /dev/ttyS2 /dev/modem

    ```


    In this case, that was the problem. Restart the dial daemon (/etc/rc.d/init.d/dial
    restart) and it now works.


    If you have trouble with dctl, make sure that you have read/write privilege with
    the /etc/dial/dial.ctl file. You also need to be able to display to the X Window
    make sure that you have run xhost+atlas and export DISPLAY=0.'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# Using the control panel to connect to the internet


    If you have set up your modem correctly, most problems that you encounter using
    the Network GUI in Control panel probably result from the misconfiguration of
    your ISP settings. If you have problems getting a connection going, then check
    that your ISP PPP login name and password are set correctly. You might also need
    to check that your ISP is not using unusual settings: go through the options in
    the Network Interfaces window and make sure that each one is correct.


    # Summary


    This chapter describes how to connect your network to the Internet, which is the
    last important step to completing your client-server network. After this chapter,
    you have all the components necessary to run your internal and external network.
    I cover the following topics in this chapter:


    +   * Understanding the difference between a terminal and a node connection to
    the Internet is important to understanding the power that is available to you
    and your network. A node connection offers comprehensive Internet access, giving
    your network the functionality that a terminal session cannot provide.


    +   * It is important to have a basic understanding of the PPP and SLIP protocols.
    PPP has become the standard, providing the stability and flexibility required
    for consistently using phone connections for Internet access.


    +   * The type of connection you use to carry your PPP or SLIP packets to the
    Internet depends on your needs and budget. If you have high bandwidth requirements,
    you need a Frame Relay or ISDN connection. Otherwise, the traditional modem offers
    the best compromise. Note that Linux can combine multiple modems in parallel –
    load balancing – to increase bandwidth.


    +   * Frame Relay offers medium to high bandwidth connection to the Internet which
    is expensive. It is generally carried, in part, over a leased telephone line and
    provides continuous service. Although specialized equipment is required, it is
    reasonably priced.


    +   * ISDN is an intermediate alternative to modems and Frame Relay. It is reasonably
    priced and gives several times the bandwidth of a modem. However, it is not universally
    available.


    +   * You must obtain an Internet Service Provider (ISP) to serve as your gateway
    to the Internet. Your PPP or SLIP packets ultimately get routed through your ISP.'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# Chapter 7: Connecting to the Internet


    +   - ISP provides you with the information you need to connect your system. Most
    often, it is just a phone number, account name, and password if dynamic IP addresses
    are used. Otherwise, ISPs give you your address and theirs.


    +   - The Linux pppd daemon is used to encapsulate your network''s IP packets
    and send them across the serial connection to your ISP, where they are decoded.


    +   - Several methods are used to establish a PPP connection via the pppd daemon.
    Dip, chat, dial, the Control Panel, and even pppd can be used to dial up your
    ISP, negotiate the PPP connection, and set your local routing tables.


    +   - Dip is a utility that you can run interactively or from a script to establish
    PPP and SLIP connections.


    +   - To show you in detail how a PPP connection is established, I provide examples
    using interactive dip. Both static and dynamic IP addresses are used.


    +   - The dial daemon, which you install in this chapter, monitors your network
    traffic and automatically establishes a PPP connection when necessary. It makes
    your network look like it is continuously connected to the Internet. It takes
    a few seconds, however, to make the connection outgoing packets are detected.


    +   - Examples are given to show how to make dial connections using both static
    and dynamic IP addresses. I show you how to enter the dial commands manually,
    and how to put them into a script file, which you can add to the rc.local script.
    This script is run at boot time so dial is loaded at that time.


    +   - The Red Hat Network Configurator is used to establish a PPP connection.
    It is a GUI and simplifies making a connection by using point-and-click methods.
    It is a good-time connection alternative to both dip and pppd.


    +   - Several methods (programs) exist to help you monitor your PPP and entire
    network connection. The programs ifconfig, route, and netstat are used to configure
    and monitor your network. The statnet program provides a concise method for continuously
    monitoring your important network statistics.'
  merge: -1
  img_proc: true
