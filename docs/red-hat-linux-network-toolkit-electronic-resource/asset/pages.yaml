- pgno: 235
  md: '# Part III: Expanding your Network Services


    Default 1

    lp:\n:sd=/var/spool/lpd/lp:

    :mx#0:\n:sh:\n:lp=/dev/lp0:

    :if=/var/spool/lpd/lp/filter:


    Here''s an explanation of the file''s contents


    +   - Anything after a pound sign (#) is treated as a comment.

    - Colons (:) bound variables and their parameters.

    - A backslash (\) specifies that the parameter continues on the next line.

    - The first line after the comments defines the printer name and any aliases (not
    shell aliases) by which Linux knows the printer (it can have zero or more aliases).
    The printer name lp1 (lp1 printer) is standard.

    - The sd=/var/spool/lpd/lp line identifies the location of the printer spool directory.
    Recall that the lpd daemon pulls a print file to a temporary directory. The effect
    is to buffer the print file so the processor does not have to wait for the much
    slower printer.

    - The mx variable specifies the largest file that can be printed. The pound-zero
    (#0) makes it unlimited.

    - The sh is a flag that prevents the printing of a burst page (header page) before
    each print job. This feature is only useful if you have many users printing to
    a single printer.\- The lp1=/dev/lp1 line defines the device file (in this case,
    lp1 points to the first parallel port, which be lp1 in MS-DOS parlance).

    - The if=/var/spool/lpd/lp/filter specifies your input filter. It is used to translate
    various file formats to a printer. It translates everything from straight text
    to PostScript into PCL, which is what the HP printer understands.


    +   6. Save the changes, exit back to your shell prompt, and restart the Samba
    daemons

    /etc/rc.d/init.d/smb restart


    The preceding changes to your smb.conf file makes all printers available over
    your network, which in this case means you can print to the LaserJet from any
    of the Windows clients. You can explicitly set parameters (such as where the spool
    directories are located), but I prefer to keep that information in the printcap
    file as much as possible.'
  merge: -1
  img_proc: true
