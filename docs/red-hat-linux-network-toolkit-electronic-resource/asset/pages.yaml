  md: '# Chapter 1


    # Installing Red Hat Linux


    IN THIS CHAPTER


    +   * Deciding how to partition or repartition your disk

    * Deciding how to install Red Hat Linux

    * Installing Red Hat Linux

    * Configuring Red Hat Linux


    THIS CHAPTER SHOWS how to install and configure Red Hat Linux. Step-by-step instructions
    are given for accomplishing this task. The end result is a Linux computer that
    can be used as either a personal workstation or as a server – both. The instructions
    given in Chapter 2 enable you to use your new Linux computer to construct a simple
    two-computer client-server network.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_32_0.png)


    > This chapter gives you detailed instructions on two Linux installation methods.
    The first method allows you to modify your PC without eliminating DOS or Windows
    operating system. However, please realize that these methods have associated risks.
    Specifically, you may accidentally erase your valuable data. All instructions
    have been tested on vanilla PCs, but that does not guarantee that you will not
    have problems with your particular setup. PCs, and especially laptops, vary a
    lot and you may have an unusual configuration that renders some of the instructions
    invalid. So please keep in mind that the devil is in the details and please, back
    up anything you do not want to lose!


    This chapter shows how to install and configure Red Hat Linux. However, this chapter
    is more than simply an installation guide. This book shows you how to first construct
    a Linux computer, followed by a simple two-computer network, and from there increasingly
    more complex networks.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Looking Ahead


    The Linux computer built in this chapter is used as a server for all subsequent
    example networks. This machine will take on several responsibilities as the book
    progresses:


    +   - This Linux computer will be named chivas. Its network configuration is designed
    to work with all of the examples given throughout this book.


    +   - chivas will function as the Samba file and printer server described in Chapters
    2 and 6.


    +   - It will optionally function as your Network File System (NFS), domain name
    server (DNS), Network Information Service (NIS), automounter, and e-mail server
    described in Chapter 8. These functions are optional because you may not want
    to run any of those services. You may also elect to place any or all of those
    services on a separate machine if you have the resources.


    +   - It will optionally provide your network-based, automated backup services
    using the Arkeia system. This is optional because you may not wish to run such
    a service, or you may wish to place it on another computer.


    +   - Optionally you can use it as your Internet gateway described in Chapter
    7. Another machine - atlas - is introduced for that function, but depending on
    your circumstances, you may wish to use chivas.(You can also configure chivas
    to look like atlas on the network. You can do this by assigning local IP addresses
    to the Ethernet adapter. This process is described in Chapter 7).


    +   - Optionally you can use it as your firewall described in Chapter 11. Again,
    atlas is introduced for that function, but depending on your circumstances, you
    may want to use it.


    A secure firewall is described in Chapter 11 that uses chivas as a masquerading
    router. The firewall system requires atlas to reside on a network separate from
    the one that chivas resides on. chivas acts to route packets from the private
    network to the second network, which is called the DMZ.


    The most important parameter described in the following installation is the Internet
    gateway address, also known as the default route. It is deliberately left blank
    because the protocol used to connect to the Internet, the Point-to-Point Protocol
    (PPP), dynamically creates the default route. You may specify it if you intend
    to use your own Internet connection and are experienced with such work. For instance,
    if you have a permanent Internet connection like Frame Relay, then you will want
    to specify the route explicitly. (However, keep in mind that you will have to
    modify the firewall and masquerading scripts provided on the CD-ROM).'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Chapter 1: Installing Red Hat Linux


    I highly recommend that you consider using either an old or brand-new hard disk
    for your initial Linux installation. Using a disk that you don''t have to worry
    about backing up increases your freedom to experiment without the fear of significant
    damage to your valuable data. I have found usable 300MB disks for $30 and new
    multi-gigabyte disks can be found for around $100. You can feel free to experiment
    on such disks. If you are serious about creating a real-world server, having an
    experimental disk allows you to try many different configurations.


    You should also consider purchasing a separate disk even if you use the dual-boot
    system. Then you are protected from failures on the first one.It also simplifies
    the process of installing Linux because you don''t have to worry about repartitioning
    the Windows disk.


    Installing Linux is not much difficult than installing Windows 95, 98 or NT. You
    do not need to make as many choices when installing those operating systems with
    Red Hat Linux. Because Red Hat is more flexible – and in my opinion more powerful
    – and you are given much more control over the beast. Freedom means more work,
    of course. Don''t worry, the process is not very difficult and detailed instructions
    are given to guide you through.


    # Previewing the Installation Process


    Linux may seem mysterious at first, simply because you are not familiar with it
    yet. Keep in mind that it puts its pants on one leg at a time and the questions
    it asks are straightforward if you take them by one.


    Installing Red Hat Linux from a CD-ROM involves the following steps:


    +   1. Deciding whether you will install Linux along with your existing operating
    system (typically Windows) or by itself.

    2. Creating a boot disk (you can skip this process if you have a computer that
    boots from your CD-ROM).

    3. Starting the Red Hat installation process.

    4. Telling Red Hat what language you speak and keyboard you use.

    5. Making choices about how to partition and format the disk.

    6. Make some other installation choices.'
