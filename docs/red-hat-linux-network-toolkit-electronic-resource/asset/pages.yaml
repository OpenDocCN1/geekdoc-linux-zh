    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_128_0.png)


    Although System V and BSD UNIX generally have similar structures, they differ
    in many details.


    When you put all this together, you have an efficient, useful file system. As
    you use it over time, it will become a familiar, somewhat dull, friend. I suspect
    that with time it will become the standard across the Linux world and you will
    be able to navigate a Linux system anywhere in the world.


    # Understanding the Linux startup process


    The Linux startup process is fairly complicated. When the PC is turned on or restarted,
    a small bootstrap program located on the boot sector of the disk is executed automatically.
    The kernel is stored in a known location on disk, and the bootstrap program loads
    the kernel into memory and then starts it (you see a couple of dots indicating
    the kernel is being loaded).


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_128_1.png)


    > If you want to read about the details of this startup process, the Linux Systems
    Administrator''s Guide discusses the topic at:

    http://www.redhat.com/mirrors/LDP/LDP/sag'
