- pgno: 271
  md: "# Creating a Simple DNS Server\n\nIt is convenient, but not necessary, to configure\
    \ a local DNS server. If you set up one, then every machine on your Private Network\
    \ can find the IP address of any other machine on the Private Network without\
    \ having to include every host name/IP address in every Linux `/etc/hosts` file\
    \ or every Windows `hosts` file. By configuring one local DNS server, you save\
    \ having to duplicate the same address information on every computer on your network.\n\
    \nConfiguring a DNS server from scratch can be very difficult at first. DNS is\
    \ a complex system and requires several configuration files to work together.\
    \ Rather than go through the instructions for setting up the simple system needed\
    \ by the paunchy.net, the configuration files for paunchy are included on the\
    \ companion CD-ROM.\n\n+   1. Login into chas as root.\n2. Mount your Red Hat\
    \ Publishers Edition CD-ROM.\n   `mount -r -t iso9660 /dev/cdrom /mnt/cdrom`n3.\
    \ Install the caching-nameserver and bind RPM packages:\n\n```\nrpm -ivh /mnt/cdrom/RedHat/RPMS/bind-B*\n\
    rpm -ivh /mnt/cdrom/RedHat/RPMS/caching-nameserver*\n```\n\n+   4. Unmount and\
    \ eject the Red Hat CD-ROM.\n   `umount /mnt/cdrom`\neject\n\n+   5. Mount the\
    \ IDG CD-ROM.\n   `mount -r -t iso9660 /dev/cdrom /mnt/cdrom`\n\n+   6. Copy the\
    \ example DNS configuration files as follows:\n   cp -f /mnt/cdrom/IDG/dns/named.conf\
    \ /etc\n   cp -f /mnt/cdrom/IDG/dns/named.ca /var/named\n   cp -f /mnt/cdrom/IDG/dns/named.local\
    \ /var/named\n   cp -f /mnt/cdrom/IDG/dns/named.paunchy /var/named\n   cp -f /mnt/cdrom/IDG/dns/named.reverse\
    \ /var/named\n\n+   7. Take a look at the `/etc/named.conf` file. It should look\
    \ like this:\n\n```\n// Boot for paunchy.net name server\noptions {\n  directory\
    \ \"/var/named\";\n};\nnzone \".\" {\n  type hints;\n  file \"root.hints\";\n\
    }\n:\n```"
  merge: -1
  img_proc: true
- pgno: 272
  md: "# Chapter 8: Creating NFS, DNS, and E-mail Servers\n\n```\nzone \"0.0.127.in-addr.arpa\"\
    \ (\n    type master;\n    file \"named.local\";\n)\nzone \"1.168.192.in-addr.arpa\"\
    \ (\n    type master;\n    file \"named.reverse\";\n)\nzone \"paunchy.net.\" (\n\
    \    type master;\n    file \"named.paunchy\";\n)\n```\n\nThe first section tells\
    \ named to use the /var/named directory as its home directory. The section defining\
    \ the named.local file is used to set up name resolution for the localhost network.\
    \ The paunchy.net section deals with converting IP names to numeric addresses\
    \ for the paunchy.net-based devices. The 1.168.192 zone (named.reverse) provides\
    \ reverse lookups – numeric IP addresses to names – for the paunchy.net.\n\n+\
    \   8. Start the named daemon using the start-up script.\n/etc/rc.d/init.d/named\
    \ start\n\n+   9. Modify /etc/resolv.conf file to look as follows:\ndomain paunchy.net\n\
    nameserver 192.168.1.254\nnameserver 192.168.32.2\n\nwhere 192.168.32.2 name server\
    \ entry is a fake one and should be placed the IP address of your ISP's name server.\n\
    \n+   10. Test its operation by starting the nslookup program. At the nslookup\
    \ prompt, enter a network name as atlas.\nnslookup>atlas\n\n+   11. The nslookup\
    \ utility should return the numeric IP address of atlas\nName: chivas.paunchy.net\n\
    Address: 192.168.1.254\nAliases: chivas\n\nIf you enter an address that is not\
    \ found within the named files in the /var/named directory, then your system will\
    \ attempt to access your ISP name server–192.168.32.2. In the case where you enter\
    \ a name of a network device on your own network, the lookup fails. You should\
    \ enter the device name and address information in your local named configuration\
    \ files."
  merge: -1
  img_proc: true
- pgno: 273
  md: '# Creating a Simple NFS Server


    NFS is similar in function to Samba. It provides Linux-to-Linux file sharing (it
    provides UNIX-to-Linux sharing too). NFS is a simpler protocol than Samba, however,
    and is part of the Linux kernel. Samba runs as an application. When you configure
    your Linux computer to act as an NFS server, NFS modules are loaded into the kernel
    and delevir provide all NFS services.


    # Exporting file systems


    The /etc/exports file configure all NFS exports. A sample exports file is shown
    that configures the /mnt/cdrom drive to be exported. Please see the exports page
    for more information.


    /mnt/cdrom


    The exportfs command is used to tell the NFS server which file systems can be
    mounted. If you run the exportfs -a command, it will export all the file systems
    listed in /etc/exports. Run the exportfs command without any parameters to view
    the exported file systems.


    # Mounting file systems


    The mount command is used to - what else? mount NFS file systems. You can mount
    NFS file systems across a network or even locally. For instance, you can use the
    following command to mount the CD-ROM mentioned in the /exports file from the
    command called nfs_server.


    ```

    mount -t NFS nfs_server:/mnt/cdrom /mnt

    ```


    The NFS file system is mounted on the /mnt directory. If you run the df command
    you see the NFS file system.


    > NFS does not work with Windows systems without additional software. You can
    mount Linux file systems from Windows machines with software like PC-NFS.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# Chapter 8: Creating NFS, NIS, DNS, and E-mail Servers


    245


    # Configuring an example NFS server


    The following instructions guide you through the process of installing NFS on
    your Linux file and printer server chivas. Your server will be capable of exporting
    NFS to other Linux computers on your network.


    NFS uses Remote Procedure Calls (RPC) to work. When used with NFS, RPC accesses
    a server''s operating system to use its files. NFS works along with the portmap
    program. portmap allocates ports to all RPC services.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_274_0.png)


    NFS runs as part of the Linux kernel. When you start NFS several kernel modules
    are loaded. NFS is a simpler system than Samba and thus can be included in the
    kernel. It also does not suffer from having to keep up with the Microsoft "enhancements"
    that keep the Samba team on its toes.


    +   1. Login to chivas as root.


    +   2. Mount your Red Hat CD-ROM.


    ```

    mount -r -t iso9660 /dev/cdrom /mnt/cdrom

    ```


