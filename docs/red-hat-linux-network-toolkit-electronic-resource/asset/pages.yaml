    option if the printer is attached to a computer using the LAN Manager (Samba).


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_179_0.png)


    Figure 5-7: The Add a Printer Entry is to fields in the Edit Local/Network/LAN
    Manager Printer Entry. The details vary depending on the type of printer you choose,
