  md: '# Chapter 12: Securing your Server


    +   4. Repeat step 3 for each compiler.


    +   5. Repeat steps 1 through 4 on chivas and any other Linux servers and

    workstations you want to protect in this fashion.


    #  Adding a serial connection to your Firewall Server


    You need to interactively communicate with your firewall to effectively manage
    it.

    The best compromise, in my opinion, is to use Secure Shell. However, an alternative

    is to add a serial line connection from chivas to atlas. Adding a serial connection

    enables you to work on your Firewall Server from anywhere on your private network.


    You can then Telnet or use Secure Shell to connect to chivas. From there you

    an interactive serial communication like dip to connect to atlas. You increase
    security

    by preventing direct communication with atlas except from chivas. chivas

    should be a more secure machine since it is a server that you control and manage.


    The simplest method is to use a preconfigured cable with the transmit (#2) and

    receive (#3) wires crossed over. This is called a Null Modem. Your remote computer

    sends outgoing data on line 2 and that data needs to be received on line 3 and

    vice versa.


    You may also need to add a third serial interface if you use external modems and

    choose to have a separate line for incoming communication. You can purchase inxpensive
    serial interfaces to add another couple of interfaces.


    You need to modify both computers to recognize the serial connection. This

    process is similar to configuring the dial-up connection described in Chapter
    7.

    Complete the following steps:


    +   1. Purchase or make a null modem cable. This is a serial cable with the send

    and receive lines crossed. Pin 2 on one connector becomes pin 3 on the

    other side.


    +   2. Connect the two computers with a serial cable. PC serial ports are electrically
    buffered so you do not have to turn off the power to the computers

    insert the cables, but be careful not to move them too much or you

    may damage the hard disks.


    > If you are already using two external modems, you must install another

    serial port.


    +   3. You need to modify the inittab file on the Firewall Server to enable logins

    via a serial port.


    +   4. Log in to atlas as root.'
