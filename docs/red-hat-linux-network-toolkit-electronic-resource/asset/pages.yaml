- pgno: 353
  md: '# Part IV: Managing your Network


    > NOTE One informative aspect of running a null backup is that it gives you a
    good indication of the maximum throughput of your machine. Since the data is not
    being written to any mechanical device, the speed that you see is pretty much
    the maximum that your computer is capable of. Everything happening on the storage
    side (data is, of course, being read from a mechanical disk) is electronic with
    no mechanical tape or disk drives slowing up the process.


    # Schedule an automatic backup


    Next, try scheduling a backup.


    +   1. From the Server management window click Backup '' Periodic backup. The
    Periodic backup window is displayed, as shown in Figure 10-17.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_353_0.png)


    Figure 10-17: The Periodic backup window


    +   2. To create a periodic backup click the new button. Enter the name NullBackup
    for the new backup.


    +   3. Click the checkbox and control returns to the Periodic backup window.


    +   4. You need to specify the savepack, pool, and drivepack to use. You can also
    change the default start time to any time that you want. Click on the (+) and
    minus (-) buttons on the Start and First backup menus to change the start time.'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# Chapter 10: Automating Network Backups 325


    Arkeia provides a periodic backup assistant to help you create an automatic backup.
    From the Server administration window, click Help -> Assistants -> Periodic backup.
    The assistant walks you through the process of setting up a schedule by giving
    some predefined examples.


    In this example the savepack, pool, and drivepack values are Testsp, NullPool,
    and NullPack respectively. Fill in the dialog box in the Periodic backup window
    as shown in Figure 10-18.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_354_0.png)


    You can optionally change from a total backup to an incremental one (a to-tal
    backup copies every file, while the incremental backup copies files created or
    changed since the last full backup — or variations on that theme). Consult the
    Arkeia documentation for information on these and other optional periodic backup
    topics.


    # Using real backup media


    Running a backup to a null device is an excellent method for learning the Arkeia
    basics and testing the software. The configuration process requires some attention'
  merge: -1
  img_proc: true
- pgno: 355
  md: '# Part IV: Managing your Network


    and patience; but if you set up a null backup two or three times, you''ll begin
    to understand things fit together. The knowledge that you''ve gained can now be
    used to create a real backup.


    Arkeia provides the ability to use a disk drive as the backup media. The disk
    can be a floppy or Zip disk as well as a hard disk (it is possible to use other
    types of disks as well). When a disk is used it is referred to as a file. Under
    Arkeia, a file is an abstraction for a physical storage medium. (Most backups
    make use of tapes. The file concept is added to provide a generic method for accessing
    a disk).


    # CONFIGURING A ZIP DRIVE BACKUP


    The following example makes use of a Zip disk (referred to as a Zipette). Zips
    do not store much data compared to DAT or DLT tapes, but can be useful for small
    operations and are certainly well suited for learning the Arkeia system. They
    are fairly common and provide another learning tool that everyone will have access
    to.


    You can also use a hard drive to store data. A hard drive is generally not a good
    place to save long-term data, but it does provide another mechanism to learn how
    to set up your backups.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_355_0.png)


    In some cases, a hard drive is a good backup alternative. For instance, a medium-sized
    retail chain in Albuquerque, New Mexico, with 70 stores, uses a UNIX server for
    each store, with an extra hard drive installed in each machine for backups. The
    backups are made daily and are recycled on a monthly basis. In this case, hard
    disks work better than tapes because they are cheaper and do not require as much
    maintenance. The backups are made with a simple tar command that is executed from
    cron. Arkeia would make sense for this retail chain because it has more functionality
    than tar and is inexpensive.


    The previous example showed almost every graphical menu that you''ll encounter
    while running Arkeia. The method is used to make the example easier to follow
    the first time. The following example, however, is given in list form without
    any illustrations.


    # MOUNT A ZIP DISK


    Arkeia requires that a mounted file system be used in conjunction with the File
    media type. For this example you must mount a blank Zip disk.


    +   1. Log in as root as chivas.


    +   2. Insert a Zip disk into the drive and enter the following command


    ```

    mount /dev/hdb /mnt/zip

    ```'
  merge: -1
  img_proc: true
- pgno: 356
  md: '# Chapter 10: Automating Network Backups


    The /dev/hdb is used in this example. An IDE Zip drive device can be

    /dev/hda, /dev/hdb, /dev/hdc or /dev/hdd.


    +   3. If you want to use a DOS formatted Zip disk, then use the following command

    mount -t msdos /dev/hdb4 /mnt/zip


    To use a floppy disk the command should be

    mount /dev/fd0 /mnt/floppy


    +   4. Create a File drive. Open the Drives management window, and then, from

    t Server administration window, click Devices ''Drives management.

    The new drive drive called FileDrive. From the Drives management

    window, click on New, enter the name FileDrive, and the type TYPE.

    Click on the checkbox and the new drive name appears in the menu on the

    right. Click the checkbox again to return to the Server administration

    window.


    +   5. Create a drivepack. Open the Drives management window, and then, from

    t Server administration window, click Devices ''Drivepacks. Create the

    new drive pack FileDrive. From the Drivepacks management window, click on

    New, enter the name FilePack, and click on the FileDrive in the List of

    drives menu. Click on the checkbox and the new drivepack name appears

    in the menu on the right. Click the checkbox again to return to the

    Server administration window.


    +   6. Create a new Pool. Open the Pools management window, and then, from

    t Server administration window, click tapes ''pools management.

    Create the new file pool called FilePool. From the Pools management

    window, click on New, enter the name FilePool, and click on the checkbox.

    Click the checkbox in the Pools Management window to return to the

    Server administration window.


    +   7. Add tapes to pool. Open the Tapes management window. Then, from the

    t Server administration window, click Tapes ''Tapes management.


    +   8. Open the Create Tape(s) window. From the Tapes management window,

    click the New button and enter the following values in the Create

    tape(s) window


    +   * Tape name: FileTape-

    * Bar code: /mnt/floppy/FileTape- (/mnt/zip/FileTape- for a Zip drive)

    * First number: 1

    * Last number: 5 (Five simulated tapes for a Zip drive)

    * Type: FILE 20MB (100MB for a Zip drive)

    * Current pool: FilePool'
