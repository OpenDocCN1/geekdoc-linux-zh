    nREGISTERING YOUR DOMAIN NAME

    REGISTERING YOUR DOMAIN NAME

    The local e-mail server as described in this chapter relies on funneling all e-mail
    through a single e-mail account at your ISP. This means that you need to register
    a domain name with the InterNIC. This is a simple process if you pay your ISP
    to process the paperwork for you. It costs $45-70 (as of fall, 1999) for two years
    of registration. You can have your ISP create an alias in its own e-mail system
    to map your registered domain name to your single e-mail address.


    > The alternative to registering a domain name and routing all of your user''s
    e-mail through a single account is to pay your ISP to create an e-mail account
    for every user on your system. You need to create a separate fetchmail process
    to retrieve each of your users'' e-mail.


    Once you have registered your domain and had your ISP configure its system for
    you, then any mail addressed to that domain should show up at your ISP login account.
    For instance if your login account name is widget_inc@isp.com and sends e-mail
    to rodbush@paunchy.net, then that message shows up in the mail queue for widget_inc.

    The trick is to download that mail queue to your local server and then distribute
    it to the appropriate individual mail queues. The following sections describe
    how to do that.


    CONFIGURING FETCHMAIL FOR A SINGLE USER

    fetchmail gets its configuration from the .fetchrc file in a user''s home directory.
    The fetchmailconf program provides an interactive configuration GUI. However,
    a sample configuration file is provided here that can be used with the paunchy.net
    network. It is used in this example for the example user rodbush.

    To configure your own fetchmail, log in as root, mount the CD-ROM and install
    fetchmail.


    ```

    rpm -ivh /mnt/cdrom/RedHat/RPMS/fetchmail*

    ```


    Copy the configuration file from the companion CD-ROM.

    cd /home/rodbush

    cp /mnt/cdrom/dg/email/fetchmailrc.sampleuser ./fetchmailrc

    chown rodbush.rodbush /home/rodbush/.fetchmailrc'
