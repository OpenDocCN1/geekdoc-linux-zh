    # CONFIGURE LINUX NETWORKING FOR MASQUERADING

    The following instructions describe how to configure masquerading on your Internet
    gateway atlas.


    +   1. Login to atlas as root.

    2. The /etc/sysconfig/network script on atlas looks like the following. Modify
    the FORWARD_IPV4 line from no to yes. (Also add the DE-FRAG_IPV4 = yes so that
    atlas will defragment all IP packets. Setting this parameter protects ipchains
    from buffer overflow attacks.) IP masquerading requires forwarding to work.


    ```

    NETWORK=yes

    FORWARD_IPV4=no

    HOSTNAME=atlas.paunchy.net

    DOMAINNAME=paunchy.net

    GATEWAY=

    GATEWAYDEV=

    ```


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_378_0.png)


    You can verify that your kernel is set up for forwarding and defragmenting by
    looking at the contents of certain files in the /proc/sys/net/ipv4 directory.
    Recall that the /proc file system is a virtual file system that provides a view
    into the kernel state. Look at the values contained in the ip_forwarding and ip_always_defrag
    file as follows.


    ```

    cat ip_forwarding

    cat ip_always_defrag

    ```


    You should see the number 1 in both files.The 1 means true or yes which means
    that forwarding and defragmentation are turned on. Alternatively a zero means
    false or no.


    +   3. Your new network file should look as follows


    ```

    NETWORK=yes

    FORWARD_IPV4=yes

    DEFRAG_IPV4=yes

    HOSTNAME=atlas.paunchy.net

    DOMAINNAME=paunchy.com

    GATEWAY=

    GATEWAYDEV=

    ```'
