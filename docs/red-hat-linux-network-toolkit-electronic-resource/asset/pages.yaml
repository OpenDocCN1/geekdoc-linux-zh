- pgno: 396
  md: '# Chapter 12: Securing your Server 367


    A compromise is to keep the tripwire database on the File Server/Router and create
    a separate checksum on it alone. You can take the simple precaution of making
    it read only alone to prevent anyone without root access from modifying it. Of
    course, if someone has modified a system file such as the login command to allow
    secret access as root, you can still modify the database. To minimize that possibility,
    you can then use your databases stored on floppy to check both the system database
    and the database checksum on a weekly or semiweekly basis. That way, if someone
    compromises your system database you''ll least know it eventually and at the same
    time you can automate the daily checks.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_396_0.png)


    If you have another Linux computer on your network, you can use it as your read-only
    file system. Store the tripwire database on the Linux computer and use NFS to
    export the file system read-only.Then, you can create a cron job on any Linux
    computer on the network to mount the file system and run tripwire.


    tripwire.com. As long as the tripwire server is a well secured system, you will
    be able to run tripwire securely.


