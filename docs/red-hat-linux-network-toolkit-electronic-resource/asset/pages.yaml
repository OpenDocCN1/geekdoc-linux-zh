- pgno: 208
  md: '# Introducing Bourne Shell Aliases


    The Bourne Again Shell ("bash") is standard to Linux and is automatically selected
    for you by Red Hat — and probably every other distribution — has the facility
    to associate a synonym, or alias, with a command or command string. Here''s the
    form you use for setting aliases:


    ```

    alias synonym=command

    ```


    For example, to speed your ability to log out, you may set the following aliases:


    ```

    alias lo=exit

    ```


    If you want to create an alias for a command and some accompanying parameters,
    enclose the command string in single quotes. For example, I like to use long listings
    but don''t like ls to type, so you use the following aliases:


    ```

    alias ls=''ls -l''

    ```


    You can enter an alias from the bash command prompt, but it is more useful to
    have aliases set when you login. The .bashrc file is executed every time you login
    and can be found in your home directory (~/.bashrc). Some aliases are already
    defined in this file, but I like to have the same aliases on all my accounts so
    I define them in /etc/bashrc, which .bashrc executes automatically. You can also
    define your own file (for example, user_aliases), place it anywhere, and then
    add a line to .bashrc to source your file. The file containing the alias definitions
    is not executed but is sourced. Therefore, you must remember to include a line
    like this in your script:


    ```

    source /etc/bashrc

    ```


    Or, you can use this line in your script:


    ```

    . /etc/bashrc

    ```


    To remove an alias, use the unalias command. For example, to remove the lo alias,
    enter the following command:


    ```

    unalias lo

    ```


    You can list all aliases by using the alias command by itself.


    The first few lines of the smbpasswd file look like the following (some of the
    X''s have been deleted so that the entries fit onto the page):


    ```

    #

    # SMB password file.

    #

    ```'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# Part III: Expanding your Network Services


    ```

    root:0:xxxxxxxxxxxxxx:xxxxxxxxxxxx:root:/root/bash

    bin:1:xxxxxxxxxxxx:xxxxxxxxxxxx:bin:/bin

    demon:2:xxxxxxxxxxxx:xxxxxxxxxxxx:daemon:/sbin

    madm:3:xxxxxxxxxxxx:xxxxxxxxxxxx:adm:/var/adm

    lp:4:xxxxxxxxxxxx:xxxxxxxxxxxx:lp:/var/spool/lpd

    ```


    Delete any lines that don''t start with the username of a user on your system.

    Leaving the entries for the system users (root, daemon, bin) can create a security
    hole.


    Next, you need to create a Samba password for each user that you want to provide
    with Samba access. Run the smbpasswd command as follows, where *iamamauser is
    the name of the user whose password you want to set:


    ```

    smbpasswd iamauser

    ```


    The smbpasswd program prompts you to enter the password twice. The iamauser entry
    in the /etc/smbpasswd should now look like the following:


    ```

    iamauser:500:834A0B3b1ablahblahD08EBE5326:/home/iamauser:/bin/bash

    ```


    # Configuring Samba to Authenticate from an NT Server


    Samba can also use an NT domain controller to authenticate requested shares. (The
    discussion of NT domain controllers are beyond the scope of this book.) In this
    case, you need to modify the /etc/smb.conf file to point to the NT controller.
    Change the security parameter to specify the use of an NT domain controller as
    follows:


    ```

    security = server

    ```


    Next, uncomment the following line:


    ```

    password server = <NT-Server-Name>

    ```


    Edit this line to include the name of the NT server, in which this case is called
    my_pdc:


    ```

    password server = my_pdc

    ```


    The name of your domain controller should convert into the IP address of your
    NT primary domain controller via DNS. Please take note that you could specify
    the IP address if you desire. For instance, if your controller address is 192.168.1.100,
    then you could enter the following line:


    ```

    password server = 192.168.1.100

    ```


    You must, of course, have an account on the primary domain controller.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# Chapter 6: Learning Samba Example 181


    The xs have been replaced with the encrypted password. Next, you need to repeat
    this process for each user.


    Restart the Samba daemons:


    ```

    /etc/rc.d/init.d/samba restart

    ```


    Login to your Windows box and enter a user name and password that corresponds
    to a user you have entered in the Samba password file. You should see that your
    user''s home directory in the Windows Network Neighborhood folder.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_210_0.png)


    If you configure Samba to accept encrypted passwords, it still accepts plain text
    ones as well. When using encryption, Samba first tries to authenticate a share
    request against the encrypted version of the associated password. If that fails,
    Samba attempts to authenticate against the plain text password.


    For further information on configuring Samba for encrypted passwords, read the
    ENCRYPTION.txt, Passwords.txt, Win95.txt, and WinNT.txt files in the /usr/doc/samba-2.0.5a/docs/text
    directory.


    # Creating Linux Users


    The following Samba examples require the addition of user and printer shares.
    Adding user and printer shares requires that users and printers be known explicitly
    by Linux. Therefore, you need to know about some basic Linux administration tasks.
    This is a good time to address these tasks, because you have gone a long time
    without touching Linux.


    # Adding users to Linux


    To make use of the standard [home] Samba shares, you must add one or more users
    to your Linux box. Users are defined in the /etc/passwd and /etc/group files.
    Red Hatvarrho suggests that you use the User Configuration GUI from Control Panel
    or LinuxConf tool, or command line programs useradd and delete, to add, modify
    and delete users. All are good methods that you should plan to make a user at
    once—in order to understand what goes on under the hood. For now, I will explain
    the password file, and give instructions for modifying the /etc/passwd and /etc/group
    files in order to add users.


    All Linux distributions have the same /etc/passwd file, with fields separated
    by colons (:) in the order shown in Table 6-1. The top item in this table corresponds
    to the left-most item and the bottom item to the right-most item.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_210_1.png)'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# Part III: Expanding your Network Services


    # TABLE 6-1 The /ETC/PASSWD FILE FORMAT


    | Field | Description |

    | --- | --- |

    | Login name | The name with which the user logs into the system. |

    | Encrypted password | If the user has no password, this field is blank. An asterisk
    identifies a nonlogin account. Otherwise, this field shows an apparently random
    jumble of characters representing the encrypted password. (If you use shadow passwords,
    the encrypted password is moved to the file /etc/shadow, which is not readable
    by anyone except root.) |

    | User ID | The user identification number. The number corresponds to the login
    name after it is in the passwd file. The numeric user ID can be shown by using
    the ls -n -or options with the ls command (that is, ls -n -or,ls -nl) |

    | Group ID | The default group identification number. The number identifies the
    default group to which the user belongs; you can belong to multiple groups, however.
    Red Hat uses the group convention in which each user belongs to a unique and exclusive
    group. In the past, a user would belong to one or more general-purpose groups,
    which created problems. The groups are defined in the /etc/group file. |

    | Name andor comment | This optional field should contain the user''s full name
    and other pertinent information such as office location, phone number, and pager
    number (especially important for systems administrators). Commas separate these
    pieces of information. |

    | Home directory | The user''s default directory. This is where you go when you
    log in. |

    | Shell | Your default login shell. All Linux distributions, including Red Hat,
    use bash, which is the most commonly used in the Linux world. You can change the
    shell to ksh, csh, sh, or whatever you want or whatever you desire and have access
    to. |


    6-3 shows the default /etc/passwd file that Red Hat provides. Most Linux distributions
    use the same login names, user IDs, and group IDs through the first ten or so
    users (which vary in some of the directories). From there, the distributions vary
    according to their own needs. Don''t worry, the details may vary, but they are
    for the system to use and don''t affect your setup.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# Chapter 6: Learning Samba Example


    Listing 6-3: /etc/passwd file defining all users


    ```

    root:yTSdWTprhiu6:0:0:root:/root:/bin/bash

    bin::1:1::bin:

    daemon:\*:2:2:daemon:/sbin:

    adm:\*:3:4:/var/adm:

    lp:\*:4:7:/var/spool/lpd

    sync:\*:5:0:sync:/sbin:/bin/sync

    shutdown:\*:6:0:shutdown:/sbin/sbin/halt

    halt:\*:7:0:halt:/sbin/sbin/halt

    mail:\*:8:12:mail:/var/spool/mail:

    news:\*:9:13:var/spool/news:

    uucp:\*:10:14:uuc:/var/spool/uuc

    operator:\*:11:0:operator:/root

    games:\*:12:100:games:/usr/games

    gopher:\*:13:30:gopher:/usr/lib/gopher-data:

    tftp:\*:14:50:FTP user:/home/ftp

    body:\*:99:99:Nobody::

    ```


    The next steps show how to add a user.

    Note: The names used in this example, like lidia, for creating Linux names and
    Samba shares are my own. Please feel free to use any names that you want to use.


    +   1. Log in to the Windows computer toluca as the user lidia. If lidia is a
    new user, you will be prompted to enter a password. Please enter the same password
    for lidia in the Windows machine as for lidia on the Linux computer.

    2. Log in to the Linux server chivas as root.

    3. Edit the /etc/passwd file and add a user name such as the one in the following
    example

    lidia::*:500:500:Lidia es muy bonita:/home/lidia:/bin/bash

    The format is what is important, so you can use your own name and other details.
    To be compatible with Red Hat, however, I suggest you use their user and group
    ID convention and stick with 500 and 500 (unless you have already added one or
    more users, in which case you don''t really need to add a user here).

    4. For now, leave the password field blank—you can set it later with the passwd
    command.

    5. Save and exit the file.


    Now you must—well, should—create a personal group. You do do this by editing the
    /etc/group file shown in Listing 6-4.'
  merge: -1
  img_proc: true
