- pgno: 121
  md: '# Exploring the Linux File System


    When I read technical discussions of Linux, I sometimes get confused about the
    meaning of the file system. This is another of those context-sensitive terms.
    It can refer to either how Linux organizes the raw bytes of data into files or
    how Linux organizes files and directories. The next two sections discuss these
    distinctions. The section after them explains how the Linux world is creating
    a standard for where to store standard and nonstandard Linux files.


    # Understanding How Linux Organizes Bytes of Data into a File


    The Linux file system organizes the raw bytes that are stored on a disk into files.
    Linux does not impose any structure on the bytes that make up files; it simply
    enables processes to access all the bytes that belong to any given file. The methods
    that it uses to do that are described in this section.


    The Extended File System 2 (ext2) is the facto standard Linux file system. However,
    Linux is capable of using many other file systems, such as MS-DOS, Minix (the
    earliest Linux was based on), the original Extended File System, and ISO9660 (for
    CD-ROMs). When you create – or initialize– your partition, you have the choice
    of several different file systems. When you formatted your root, /home and /usr/local
    partitions in Chapter 1, you used the ext2 system.


    When you create an ext2 file system, a data structure called an inode (index node)
    is folded into the disk format. When you format the disk, inodes are periodically
    placed on the disk. Unlike MS-DOS, the number of inodes is fixed when you format
    the disk. If you have a huge number of small files, you can run out of inodes.
    This is unlikely in most circumstances, however.


    An inode is the essential element of a Linux file system. When you create a file
    an inode is allocated to it. It contains information on a file''s ownership (user
    and group), access modes (read, write, and execution), time information (when
    a file was last accessed and modified, and when the inode itself was modified),
    the byte count, and the file''s type (regular, special – that is, a device or
    an abstract one such as those found in /proc directory). The inode contains the
    indexing information over the disk blocks where a file''s data is located. However,
    an inode doesn''t contain the name of the file; that information is stored in
    a directory file.


    A directory is a file itself. It contains the name – or names – of the file(s)
    and its inode.


    Linux uses inodes to access and work with files. For example, the file CHAP_4.DOC
    – which contains the text for this chapter – is physically stored on a hard disk
    that my Linux box controls. When I open this file, Linux tells the disk controller
    to go to specific locations to retrieve the raw data off the platter. Linux determines
    where to go by checking the information stored in the-inode associated with the
    file CHAP_4.DOC. In other words, each file has an inode'
  merge: -1
  img_proc: true
