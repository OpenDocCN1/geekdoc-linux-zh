- pgno: 57
  md: '# Continuing the configuration


    +   1. Mouse Selection


    Select the mouse that you have. If you don''t know, use your best judgment and
    make a guess. Keep in mind that you can reconfigure the mouse by running the mouseconfig
    program after the installation is complete.


    +   2. Time Zone Selection


    Select your time zone.

    Tab to the Ok key and press the return key.


    +   3. Root Password


    Enter your root password. The root user has unlimited privileges and is the most
    powerful user on a Linux computer.


    When you enter the password, the system checks the second one against the first
    and forces you to reenter if they do not match. It is essential to the security
    of your Linux box to use a proper password. Do not use a simple word or name that
    can be easily guessed or associated with you. Instead, it is best to make up a
    simple phrase that is easy to remember but not found in any dictionary. Something
    like car-lite is appropriate. The idea is to be able to remember it and not have
    to write it down. The idea also is not be able to find it in a dictionary where
    an automated program can find it. Please refer to Chapter 7 for more discussion.


    Tab to the Ok key and press the return key.


    +   4. Add User


    You can add regular – non-root – users to your system in this dialog box. If you
    don''t want to use users, tab down to the Ok item and press the return key.Choose
    a user ID, which is generally just a user name. For instance, choose paul or psery
    as my user name. Finally, you must enter your password twice in the previous step.
    Repeat this process for each user that you wish to give access to your Linux computer.


    Tab to the Ok key and press the return key.


    +   5. Authentication Configuration


    Red Hat installation system uses shadow passwords with MD5 checks by default.
    The traditional Linux/UNIX system stores your encrypted passwords in the /etc/passwd
    file by default. That file must be world-readable (any user can read – but not
    write – to file) for a number of technical reasons. That makes it possible for
    a malicious or curious person to copy the encrypted passwords and then run a password-cracking'
  merge: -1
