- pgno: 62
  md: '# Chapter 1: Installing Red Hat Linux


    # 33


    Configuring X requires that you tell the Red Hat installation process what type
    of video adapter card and monitor that you have. Red Hat supplies numerous pre-defined
    settings, but if your equipment is not listed, you can still use generic settings.
    The following instructions describe the process.


    +   1. Monitor Setup


    Figure 1-14 shows the beginning of the list of monitors you can select from a
    monitor that fits your own. If your monitor is not included in the list, then
    you can select Custom, Generic Monitor or Generic Multisync. In that case please
    see Chapter 7 for more instructions.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_62_0.png)


    Figure 1-14: Choosing your monitor type


    Older monitors can''t handle resolution rates and scan frequencies higher than
    those they were. A monitor designed for a 640 x 480 resolution (and a low scan
    frequency) cannot display 2,048 x 1,024 resolution (and a high scan frequency).
    More important, if you try to make the monitor display that a high frequency,
    it might burst into flames. (I didn''t believe this until until I saw a monitor
    smoke). Modern monitors, called Multisync, can automatically match themselves
    to a series of scan frequencies and resolutions. Some of these monitors are smart
    enough to turn themselves off if the frequencies become too high, rather than
    burst into flames. It''s best (particularly with older monitors) to find the documentation
    and match your vertical and horizontal frequencies properly. Lacking this, try
    a lower resolution (VGA or SVGA) first, to get X Window System running.'
