  md: '# Chapter 6: Learning Samba Example


    11. Open up the smb.conf file from your Windows box by double-clicking the smb.conf
    file icon.


    12. Modify the file in any way that you want. For instance, enter the widely used
    string asdf.


    13. Try saving the changes. You are not allowed to do so. Even though Linux allows
    read, write and execute permission to the install.log file, Samba does not allow
    you to do so. You have set the read only parameter to yes.


    14. If you wish to execute, modify the smb.conf and change the read only to no.
    Restart Samba and this time you will be able to save changes that you make. Be
    careful, however, and make only a trivial change. Once you have convinced yourself
    that it is possible, remove the changes.


    15. Restore the original permissions on the /tmp/install.log file as follows.
    chmod 700 /tmp/install.log


    This example shows how Samba can manipulate privileges when the underlying Linux
    privileges exist.


    # EXPORTING THE CD-ROM


    Exporting the CD-ROM finishes this section up. By doing so, you can provide many
    useful functions to your network. For example, one productive service is sharing-say,
    your Linux distribution— or other material to your network. Exporting the CD-ROM
    cuts down the number of CD-ROM drives you need (although CD-ROM drives are becoming
    ubiquitous, some of your older machines may not have them). Plus, it saves having
    to transport a CD-ROM disc from machine to machine.


    The following example once again makes use of the default smb.conf file. The following
    instructions show you how to export the /mnt/cdrom directory.


    +   1. Login to the Windows computer toluca as the user lidia.


    +   2. Login to the Linux server chivas as root.


    +   3. Restore your original smb.conf file from the backup copy (if you have not
    already done so – as advised earlier in this chapter– reverse the process and
    make a backup copy)


    ```

    cp /etc/smb.conf.orig /etc/smb.conf

    ```


    +   4. Edit the smb.conf file and find the [tmp] share name. Remove the comments,
    and then change the [tmp] share name to [cdrom] and the path=/tmp to path = /mnt/cdrom,
    as shown below.


    ```

    [cdrom]

    comment = share CD-ROM

    path = /mnt/cdrom

    ```'
