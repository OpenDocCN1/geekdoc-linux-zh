  md: 'This shows that the paunchy.net network has two machines running without firewalls
    (and where Fyodor''s preferences are!). Both operating systems are accurately
    detected; in fact almost exact the insecure Linux version is found.


    # PREVENTING SCANS WITH A FIREWALL


    This example uses the Linux book atlas. Login to and install the ipchains package.
    The simple filter below turns off all network connections, so you need to be at
    the console to enter the rules. (You can make your own filter script that allows,
    say, a Telnet connection, if you want.) Enter the rules.


    ```

    ipchains -P output DENY

    ipchains -P input DENY

    ipchains -P forward DENY

    ```


    Run any of the scans from the previous examples; or try new ones. Enter the following:


    ```

    nmap -sX atlas

    ```


    After about a minute nmap returns the following:


    ```

    Starting nmap V. 2.07 by Fyodor (fyodor@dhp.com, www.insecure.org/nmap/)

    nmap completed -- 0 IP addresses (0 hosts up) scanned in 80 seconds

    ```


    nmap was not able to detect any open ports because the filter prevented the packets
    from ever getting to the Linux box''s network layer or else the filter prevented
    any return packets from getting back to the nmap server.


    Read the Web page maintained by the nmap creator at www.insecure.org for a much
    more in-depth – and interesting – discussion of nmap.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_403_0.png)


    Do not install nmap on atlas. The last thing you want to do is leave an intruder
    such a great tool to use against you.


    # Adding Passive Security to Your Network


    Now that you have installed and configured your active security measures – the
    IP filtering rules, the dial-up connection, tripwire, SATAN, and so on – it is
    important to address the passive side of security. It is necessary to close all
    the possible entrances that you can think of. To that end, I want you to eliminate
    all the'
