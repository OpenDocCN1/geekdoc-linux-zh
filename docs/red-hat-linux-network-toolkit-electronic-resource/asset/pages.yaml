- pgno: 27
  md: '# Introduction


    Keep in mind, however, that a client-server network does more than simply share
    computer hardware. It also helps to distribute your human resources. As more people
    work on a project, modifications of each other''s work and files become disproportionately
    difficult. Just two people working on the same spreadsheet can become intolerable
    as each modifies individual copies that differ only slightly from one another.
    Add an entire department and the work becomes very inefficient. On the other hand,
    if spreadsheet exists in only one place and can be written by only one user at
    a time, then work can continue. That is what the client-server does for you.


    You may be is: Have you heard about LINUX and SAMBA? No? Well, read on. I might
    have a solution for you. Solution is a good word. With these powerful tools, you
    can easily set up and administer your own client-server network. In this book,
    I show how to work with Linux and Samba to set up and run both simple and not-so-simple
    networks. I also offer guidance for handling the role of systems administrator—a
    role that Linux and Samba simplify.


    # The History of a Dummy


    A bit of retrospective is in order to show you the process that I hope you can
    avoid. My sordid history should scare you straight.


    Ten years ago, I started a job as a scientific programmer. As the business grew
    from a couple of scientists and engineers—world-class ones, actually—I found myself
    increasingly in the role of managing the capital equipment dollars and could not
    afford a Novell network or even a poor cousin. I hate to admit it, that we basically
    had a manually operated, RS-232 (serial) network. Later I used a switched network—of
    switch boxes to connect all our serial lines! Talk about advanced technology.
    Well, beat me over the head with a stick long enough and I''ll get smart. What
    was my solution? We ended up with a terminal-based, multi-user version of WordPerfect
    for VMS on a MicroVAX. For those of you who don''t know what that means, just
    think of the phrase "slow and cumbersome." We did have an i386 SCO XENIX box running.
    I made several aborted attempts to get a terminal-based word processing system
    running on it. Needless to say it didn''t work well enough.


    We finally entered the ''70s around 1990.


    I had the luck of inheriting a black and white monochrome Sun SLC, which was slow
    even by 1990 standards. But it did run SunOS UNIX and it had an Ethernet port.
    I eventually hooked it to another workstation and was amazed when they were able
    to communicate.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Introduction xxvii


    The Sun eventually became the company file and print server, based on the Network
    File System (NFS). It was a vast improvement over our switched network, but was
    still shaky. Maintenance was difficult and expensive, and we were tied into a
    proprietary system. I kept it going on a shoestring while ever more demands were
    placed on it. It worked, but I never felt comfortable. I wished for a better way
    to run our system.


    The more administration I did, the more I realized how much I didn''t know. Taken
    individually, each task or system is not very complicated – but systems administration
    involves so many tasks and so many systems, and all interact. I was trying to
    solve a big puzzle and I didn''t know how many pieces it had. I started looking
    for a solution.


    In part, I faced the chicken-and-the-egg dilemma. In other words, how do you maintain,
    upgrade, and manage such a system you know how to maintain, upgrade, and manage
    such system? SunOS and Solaris were terribly difficult to manage if you knew what
    you were doing. I know some of the bases (performing backups, editing users, using
    NFS exports), but I was concerned about what I did not know. I was always afraid
    that something bad would happen and someone wanted to clean up the mess and ask
    me how I could not know that the sky is blue. I wished ID Books had offered a
    Systems Administration For Dummies back then. Very few classes or books dealt
    with the subject of systems (or network) administration – at least I could find.


    I gradually learned the trade in fits and spurs. In 1992, I took a very useful
    Networks course at the University of New Mexico (UNM). I had started the course
    in 1985, only to drop it when we spent the first three weeks writing equations
    for packet collisions or whatever. I was more than a little surprised and very
    happy when I came out of this course knowing that I had a good overview of networks
    and was finally in possession of some specific information.


    In 1994, I ran across this interesting UNIX clone Linux. I eventually realized
    that I had seen an advertisement for it distributed on a CD. That summer I purchased
    it. At first I pulled out my hair trying to get it installed. Then it finally
    worked.


    In 1995, I found this thing called Samba. At first glance, it looked like an NFS
    clone. I pulled off the NET and was stunned when it compiled, installed, and worked
    right off the bat. I must not believe my own eyes, because I promptly forgot about
    Samba and went on with my eternal NFS struggles.


    In 1996 our Sun finally died. I had it in mind that when occurred I would be to
    substitute Linux and Samba for it. In just a handful of hours I got a Pentium
    PC running Linux-Samba to provide the same basic function as the Sun-NFS had.
    Within a couple of days I had our network working exactly as it had before. The
    dividend was that we eliminated the expensive, third-party software that had been
    required for our PCs to work with NFS.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Onward and Upward


    My systems administration history is important, not because it is unusual, but
    because it is very typical. In businesses of any size that use computers and networks,
    people often inherit network and computer administration responsibilities even
    though they don''t have much (or any) background in this field. If this is you,
    then this is your book. My hope is that by the time you finish this book, you''ll
    have not only the essentials of installing, configuring and managing a Linux/Samba-based
    network, but that you''ll have become an accomplished system administrator in
    the process.'
  merge: -1
  img_proc: true
