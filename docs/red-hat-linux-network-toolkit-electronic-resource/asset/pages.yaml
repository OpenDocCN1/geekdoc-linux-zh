- pgno: 161
  md: 'The familiar smb.conf file is the main configuration file. The files in the
    rc.d directories are pointers to /etc/rc.d/init.d/smb, which is the start and
    stop Samba script. This listing of configuration files tends to be useful information
    for a systems administrator.


    # FINDING THE PACKAGE THAT OWNS A FILE


    As the final query example, use the -f parameter to locate the package that owns
    a particular file. Maybe you are having a good time Friday night looking through
    the /etc/rc.d/rc3.d directory, and you wonder what the S99local file is used for.
    You do have a man on S99local and rc.local but don''t find any entries. Hmm, how
    do you know what it is? No problem, enter the following command:


    ```

    rpm -q -f /etc/rc.d/rc3.d/S99local

    ```


    It tells you that the file belongs to the initscripts package and all the variations
    you can think of, and you don''t find a man-page entry for it. You hope that initscripts
    is a simple program to startup scripts but you don''t know for sure - UNIX and
    Linux can be deceptive. So when you decide to use the RPM system again. Entering
    the following variation of the query:


    ```

    rpm -q i initscripts

    ```


    Get the information shown in Listing 5-5.


    Listing 5-5: RPM shows which package file belongs to.


