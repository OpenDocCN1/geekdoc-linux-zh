- pgno: 309
  md: '# Handling high-volume backups


    When you get to the point of backing up many gigabytes of data you can expect
    that your organizational problems will rocket. Just consider the difficulty of
    keeping track of numerous 4mm DAT tapes and you will realize that the possibility
    of making errors is significant. Keeping the tape sequence in order while doing
    the backups, correctly labeling the tapes, and storing them over time all require
    uner consistency. Making just one mistake at the wrong time could jeopardize your
    entire operation.


    What is the solution? The solution is probably a tape library or optical disk
    juke-box. They are expensive and difficult to set up, but in the long term they
    pay for themselves. Add commercial software that further automates the process
    and you end up to do nothing but monitor the process and occasionally add remove
    tapes.


    If you use many tapes, your top priorities are systematically labeling your tapes
    and keeping precise logbooks. (Alternatively, you can solve that problem by purchasing
    a tape library that uses a bar code reader). Your job is further complicated if
    others performs the backups. In either case, especially the latter, you should
    systematically conduct your own data integrity tests. This testing involves choosing
    some data to restore, finding the appropriate tape, and checking to see if the
    data is really there. The last thing you want to have happen is not to restore
    some data and find out that it was never saved in the first place due to some
    foul-up.


    # Automating backups


    Making manual backups appears to be an inexpensive process. You only have to purchase
    relatively inexpensive tape drives or tape libraries. However, the appear- is
    deceptive. In the long term, labor costs are high and it''s almost certain that
    you''ll make a mistake.


    You should seriously consider automating the entire process. Automated backup
    software is expensive but worth the cost in the long run. Chapter 10 describes
    the commercial Arkeia system by Knox Software, Inc. The company has provided a
    demonstration license for this book so that you can experiment with its system.


    # Creating and Maintaining Security


    The problem with any rating system is that you have to come up with a methodology
    and adhere to it. As much as I would like to have two most important items, I
    can''t honestly do that (I wish my management would be as kind!). Therefore, I
    have decided to put the subject of security second, after backups. It is a very
    close second. My reasoning is as follows: Security is much more complex than the
    issue of maintaining proper backups and therefore more prone to imperfections
    and breakdown over time. It is also highly dependent on the participation and
    belief of other people; it is very easy to become complacent if you do not see
    a direct threat and especially'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# Chapter 9: Introducing Systems Administration 281


    if you do not understand the underlying issues. As an administrator, you are at
    the mercy of variables over which you have less than perfect control. Therefore,
    any system design will be less than perfect. Ultimately, if you have a reliable
    backup, you can recover from most security failures.


    The drawback to reasoning is that if your security is breached it may go undetected
    and propagate over time. If your system is broken into subtly changed over time,
    your backups may become worthless because they will eventually contain only the
    corrupted files. If your work is compromised over time, your efforts may become
    worthless or worse—you may become liable in other ways. In that case, making your
    system breaks down. Perhaps it would be better not to rate things like this. In
    any case, it is best that you be aware of the potential and decide for yourself.


    The difficult nature of security makes it as much a function of vigilance and
    constant education as of the policy itself. Security is a day-in, day-out grind
    that you simply have to do. An effective system makes itself appear to be unnecessary.
    If you lock your house every time you leave you have never been robbed, it may
    appear to be an unnecessary task. But if you starting your house unlocked the
    one time you are broken into will drive the necessity of having to do it without
    failure.


    Security is also part of every task you do. For instance, while I have listed
    backups separately, backups are actually the last bastion of your security policy
    because they enable you to recover from malicious activities. Security should
    be viewed as integral to every aspect of systems administration.


    You should concentrate on several security areas:


    +   * Human Factors. All security starts with the people who use the system. Unless
    you are the only user, you must depend on other people to adhere to your security
    policy. Your users have the ability to make your system safe or not. Unfortunately,
    dealing with people is a lot messier than dealing with computers because people
    have silly things like lives, free, and such. We all tend to lose enthusiasm for
    what seems unnecessary work with time. Therefore, you must be oriented toward
    messy reality. Education is an important factor in this equation. Your own attitude
    will affect how seriously others view the issue.


    +   * Passwords. Your passwords are your first line of defense. They are the locks
    on your doors. If you do not demand good passwords and their consistent use, all
    your other security measures will be compromised.


    +   * Firewalls. Firewalls are your primary defense from unauthorized Internet
    connections. A firewall must be transparent enough to allow effective and efficient
    use of the Internet and also prevent unwanted outside access. The type and level
    of effectiveness depends on what you use the Internet for.'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'Internal network security. You must consider the internal threat. If you have
    valuable information, then people with valid access to it might actually compromise
    it. Your network configuration and layout determine much of your security structure.
    If you have varying requirements within your own organization, you can, and probably
    say, arrange your network topology to reflect those realities. This arrangement
    can divide your network into subnets to isolate the functional areas of your network,
    and it can specify file policies to further divide your network.


    External network security. Your firewall will be the first line of defense against
    the barbarians. You should also be careful not to advertise how your network is
    configured and what security measures you use.


    Layered security. All the previous items should be constructed to work together.
    One layer should be up once and vice versa. If your firewall is breached, you
    should still have all user accounts protected with effective passwords. Even if
    you are not sure about all your passwords, you still have your firewall. If a
    burglar is attempting to break in and a user notices to something amiss, that
    person should have enough security education to inform you about the suspicious
    activity. When you put all in this, it works well enough to strengthen individual
    measure.


    Vigilance. You should regularly test your system. You can do this with a number
    of helpful software systems, such as Tripwire, Satan, and COPS. Testing should
    be done regularly and with the attitude that prevention is the best policy.


    # Addressing human factors


    If you have more than one person involved in your system, you have to concern
    yourself with managing people. Systems administrators must walk the fine line
    between requiring much and too little security. If you are too harsh, your users
    will actively and passively find ways around your measures. On the other hand,
    if you are too lax, the users will not respect your system and you leave open
    to external threats.


    What is the fine line? I''ll take the easy way – the reasonable way – out. It
    depends on your situation. If you are the administrator for a bank, you must take
    more precautions than you run a hobby shop. However, any operation must take a
    core group of measures, and I concentrate on those core measures here.


    The most important measure you should strive for is the respect and education
    of your system''s users. The average person respects the need for basic security
    measures. If the users know the basics of how passwords are used and why they
    are important, you can count on a higher level of consistency in their use. Otherwise
    you can expect far more problems.'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# Chapter 9: Introducing Systems Administration 283


    An important aspect of education should be a simple, straightforward usage policy
    that everyone signs in order to obtain access. You should emphasize the essential
    rules that are most important to your organization. Include other policy statements,
    but refrain from cluttering this essential document. If you end up with more than
    one page and can''t reduce it, I suggest dividing it into two documents: one essential
    and the other important items.


    Individual or group classes should also be considered. They are unpleasant but
    can greatly help in the long run. For instance, even though a new user uses the
    age policy, you still do not know whether it has been fully read and understood.
    Even if the policy has been read and understood, a short tutorial will reinforce
    and hopefully emphasize that you take security seriously. If the person has not
    understood it, a class will show them little less. In the long term, an occasional
    refresher class or meeting can put people back on the right track.


    The occasional person who simply doesn''t take security seriously presents a difficult
    issue. I cannot offer much other than to suggest that a patient, consistent, and
    firm direction may help you over. The people I ran into in my career were relatively
    benign that they generally refused to follow policies such as logging off when
    leaving the small building we worked. It was frustrating because I didn''t have
    the clout to force adherence but I accomplished it by default when I installed
    automatic computer locks (Linux and Windows screen locks) during operating system
    upgrades. Dealing with people who actively eschew security measures is a difficult
    issue. The best advice I can offer is to establish a standard and make clear that
    anyone doesn''t maintain it will be fired. What constitutes the standard for each
    organization to determine. A reasonable starting point is a zero-tolerance policy
    concerning the malicious use of the organization''s computer resources (such as
    sending threatening e-mail). I have never had to go close to such measures, but
    I would be willing to do so if pushed far enough.


    # Devising a password policy


    A good password is a difficult animal to define. On one hand, a good password
    should not be crackable with a standard cracking program, which compares passwords
    against dictionaries and also uses heuristics to guess at them. However, if a
    password is too complex, it will neither be used or it will be written down and
    become almost as dangerous as no password at all.


    Cracking programs work like this:The Linux password-encrypting algorithm is publicly
    known. A cracker starts with an already encrypted password and works backward
    by encrypting words and making a comparison. If your password is apple and its
    encrypted form is a12sdf, the cracking program goes to a dictionary and encrypts
    each word in order until it comes to apple and finds that its encrypted form matches
    the string found in the password file. At that point it has broken your password.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_312_0.png)'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'The idea is to find a compromise between too much simplicity and too much complexity.
    It should work over the long term, too. The method I prefer is to choose two short
    names or combine them. That type of password is easy to remember, does not have
    an entry in any dictionary in the world, and is not connected to you directly.
    A password should adhere to the following points:


    +   It should not exist in any dictionary in the world. An apparently obscure
    word is only obscure to you because you are not a computer. However, a computer
    essentially has instant access to – and knowledge of any word that is in a database
    to which the computer has access. The same goes with any place or proper name
    they may be be in an encyclopedia somewhere. You should assume that if you can
    locate it, anyone else, too,


    Note: Use of trivial passwords is a moot point on many new systems. For instance,
    the password program shipped with Red Hat uses the Pluggable Authentication Modules
    (PAM) and does not allow you to use words that can be found in a dictionary anymore.
    It also prevents you from using slight variations on dictionary words. Older versions
    do not make checks, so beware.


    +   It should not have any direct connection to you. For obvious reasons, you
    should not use names or words that are related to your personal situation such
    as a date of birth or an address. Conversely, avoid using things that could be
    used against you if guessed, such as PIN numbers.


    +   Simple variations of words or common phrases should be avoided, too. Modern
    computers are capable of a huge number of operations per second. Therefore, programs
    using heuristics–rules that define methods for guessing–can perform permutations
    of existing words so variations can be discovered. For instance, if your name
    is Big Blue and you choose a password as BiBlue, a burglar knowing you can readily
    program a crack to start with Big Blue and variations until the correct one is
    discovered. The lesson is, do not depend on changing a word or a personal password
    slightly it can be cracked. Again, the password may seem obscure to you but a
    mindless computer it is no problem at all.


    +   On the other side of the spectrum, random strings generated by password-generating
    programs are difficult to remember. People tend to write down things that are
    difficult to remember. Things that are written down can be lying around. Passwords
    that are lying around are of no protection to you. Even if you do not leave them
    lying around, the fact that your shop generates random passwords is a hook for
    a determined burglar. If I wanted to break into a computer system and I knew it
    used such passwords, I would plan on looking for such a list. A determined burglar
    could probably find the list one way or another. This is a little paranoid? Yes,
    unless your system is valuable enough to somebody. That depends on your situation.'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# Chapter 9: Introducing Systems Administration


    The solution I like avoids those pitfalls. First I''ll describe the algorithm
    and then

    ''ll explain it.


    Choose two simple words and combine them. The words should be short enough

    so that they together do not add up to much than eight characters. The words

    should not be normally used together. I use a non-alphanumeric linking character

    such as the tilde (~) character. Here''s an example of such password:


    radi-road


    Why did I make such a choice? I just looked out my window and saw the road in

    front of my place. I am also listening to the radio. Put together, they are not
    in any

    dictionary. Any cracking program will have to check nearly as many combinations

    as if the password were a completely random string of characters.


    Note: Because only the first eight characters are significant, the effective

    password is


    radi-roa


    This password is actually better because road becomes the essentially random

    string roa. Nobody knows that your linking character is ~, which is also good.
    It

    not a truly random string it, a cracker program will have to attempt a large number

    of permutations of all the words in a dictionary. It is not perfect, but even
    though it

    a compromise, it is a good one in my opinion.


    An alternative to the preceding method is to use one of the random or pseudo-

    andom password generators and keep generating passwords until one appears that

    you like. If you like it, then that implies you can remember it, too. I used this

    method to get such classics glujoy and shoeboe.


    After choosing a password, you must decide how long to keep it. The extremes

    are changing too often or never at all. If you change it too often, your password

    will be difficult to remember. If you never change it, you run the risk of having

    your password become common. Personally, I think changing every six

    months to a year is best. Keeping a password longer than a year is dangerous,
    in my

    opinion, but I cannot quantify a precise time-frame other than say that a year

    seems like a long time to keep the same password.


    # Shadow passwords


    Even with correctly conceived passwords, you are still vulnerable to attack. The

    fact that the encrypted (technically they are referred to as encoded) passwords

    are contained in the /etc/passwd file makes them vulnerable to attack. That file

    m be world readable (recall that three sets of permissions exist for a filenowner,
    group, and world) because many programs need to check it. If

    a burglar gains access to your system, files can be retrieved to another machine

    and cracked at leisure.'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'The way around this problem is to use shadow passwords. When used, shadow passwords
    store the encrypted passwords in another file - /etc/shadow - that only the system
    can read. Therefore, a burglar must gain root access to your machine to access
    the shadow password file, which would be a superfluous act at that point. Shadow
    passwords add another layer of security.


    The Red Hat installation uses shadow passwords by default. However, if you choose
    not to use the default, then you can convert to shadow passwords as follows:


    +   1. Log on root.

    2. Enter the following command to change to the /etc directory

    cd /etc

    3. Enter the following command to convert your /etc/passwd file to use shadow
    passwords

    pwconv5


    +   4. The encrypted passwords are now contained in the /etc/shadow file. The
    original /etc/passwd file is renamed to /etc/passwd and also contains the encrypted
    passwords. These files are only accessible by root and nobody else can attempt
    to crack your passwords.


    The pam_pwdb.so module will automatically detect that you are using shadow passwords
    and will make all necessary changes to your system to use shadow passwords.


    # Choosing a firewall


    The job of a firewall is to filter communications from the Internet into and out
    of your network. Firewalls are divided into two types: filtering and proxying.
    This book concentrates on filtering firewalls because they are simple to construct
    and provide good protection for simple networks. The firewall used in this book
    is described in Chapter 11.


    # Internal network security


    Unless you are the only user of your system, you need to consider internal security.
    People who work together expect their colleagues to respect their privacy, but
    sometimes that doesn''t happen and extra measures are needed. For instance, locking
    a cabinet with sensitive financial information is considered standard and acceptable
    policy. Although I discuss passwords in terms of external security, they are also
    a form of internal security. Passwords offer a form of internal security by protecting
    valid users from each other as well as nonusers. No one feels slighted by such
    measures because they are expected.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# Chapter 9: Introducing Systems Administration


    # Using Subnetworks


    Briefly, subnets (subnets) divide IP address spaces into smaller groups. The smaller
    groups can only communicate directly with other group members. Otherwise, for
    one subnet to communicate with another, it must be explicitly routed.


    This is accomplished via the subnet mask that you may recall configuring at the
    end of Chapter 1. The 32-bit IP address is split into a network address and the
    host address. The class C address uses the first 24-bits for the network address
    and the last 8 for the host address. Recall that you have used the public class
    addresses 192.168.1.1-3 throughout this book. The network address is 192.168.1
    and the host address has been 1, 2, and 3 (out of a total possible of 254).


    The subnet mask for a class C is 255.255.255.0. When packets from a particular
    host first arrive at your network interface, your IP address is masked by the
    subnet mask and compared with your own network address. (The masking process is
    carried out by the mathematical AND process, which means that if one bit is 1
    and the other bit is 1, the result is a 1. Otherwise, for a 1 and a 0, a 0 and
    a 1, or a 0 and a 0, the result is 0. You may want to think of a 1 as true and
    a 0 as false.) So if you have an IP of 192.168.1.3, your network address is 192.168.1.
    Combine the network address with the subnet mask of 255.255.255.0 and the resulting
    masked network address is still 192.168.1 and any packets with a network address
    are accepted.


    However, if you divide your LAN into two subnets, your subnet mask becomes 255.255.255.128.
    Only IP packets with addresses of 192.168.1.129-254 will be accepted.


    To provide further internal security, you may want to divide your network into
    subnets and set different file protections on different user groups to prevent
    casual snooping.


    If you split your LAN into two or more subnets, you keep the subnets from interacting
    with each other. You may put the accounting people on one subnet and the development
    people on another. Each subnet can be on the same physical network or on separate
    ones. The idea is to place client computers along strategic divisions of your
    network in order to enhance security.


    Splitting your network into subnets can also improve performance. The network
    packets of one subnet stay on that subnet unless they are routed to another subnet.
    In other words, packets stay within their own segment and don''t clog up other
    segments unnecessarily.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_316_0.png)'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'You can also accomplish separating client computers along natural divisions
    by making use of Linux groups and file permissions. The division will not be as
    clear-cut as subnets because the client computers will be able to communicate,
    but the idea is the same.


    Red Hat Linux creates individual groups for each user. But by editing /etc/group
    file as root, you can create any groups you want. Individual users are provided
    access to a group by adding their name after the group.


    ```

    root::0:

    bin::1:root,bin,daemon

    demon::2:root,bin,daemon

    sys::3:root,bin,adm

    adm::4:root,adm,daemon

    tty::5:

    disk::6:root

    lp::7:daemon,lp

    mem::8:

    kmem::9:

    wheel::10:root

    mail::12:mail

    news::13:news

    uucp::14:uucp

    man::15:

    games::20:

    gopher::30:

    dip::40:

    ftp::50:

    nobody::99:

    users::100:

    floppy:x:19:

    console:x:101:

    gdm:x:42:

    tmp:x:102:

    ppupusers:x:230:

    popusers:x:231:

    slipusers:x:232:

    slocate:x:21:

    xfs:x:233:

    lidia:x:500:

    ```'
