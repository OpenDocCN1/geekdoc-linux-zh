    ipchains -A input -p tcp -j ACCEPT s 0.0.0.0/0 -d 0.0.0.0/0

    ipchains -A output -p udp -j ACCEPT s 0.0.0.0/0 -d 0.0.0.0/0

    ipchains -A input -p udp -j ACCEPT s 0.0.0.0/0 -d 0.0.0.0/0

    ```


    You have now parsed the TCP and UDP protocols; the ICMP protocol is ignored in
    this example for simplicity and it isn''t a factor in nearly as many transactions
    as the other. By modifying the source and destination addresses to their correct
    values (instance, for outgoing UDP packets the source address to your PPP IP address.)
    You should consult the ipfilter.rules script for the details of the process.


    Test your system. Once you have narrowed the problem down to a protocol, then
    you need to find out the port.


    Next try setting up rules for the individual interfaces. You should pay particular
    attention to your internal interfaces eth0 and lo. It is very easy to set up rules
    for these interfaces that interfere with or deny communication on your Private
    Network. Once again, please refer to the ipfilter.rules script for more details.


    Without going into more detail, you get the idea. With all other troubleshooting,
    you may successfully narrow down the problem until you arrive at the solution.


    # Masquerading


    If you are having problems masquerading to work, first check that you have enabled
    IP forwarding in your Linux gateway. Check the file /etc/sysconfig/network and
    make sure that the IPFORWARD_IPV4 line is set to yes.


    ```

    IPFORWARD_IPV4=yes

    ```


    You need to restart your Linux networking to make the new rule effect.


    /etc/rc.d/init.d/network restart'
