- pgno: 366
  md: '# Chapter 11


    # Building a Firewall


    IN THIS CHAPTER


    +   - Introducing firewalls

    - Connecting your LAN to the Internet via masquerading

    - Protecting your Internet connection with a hybrid firewall

    - Monitoring your firewall

    - Monitoring your server for break-ins

    - Keeping track of the bad guys

    - Testing your firewall with nmap

    - Verifying your server with Tripwire

    - Learning more about firewalls and security

    - Troubleshooting your firewall


    # Introducing Firewalls


    A firewall is a computer, router, or a dedicated device that is configured to
    prevent unauthorized access to one network from another. For the purposes of this
    book, a firewall is a Linux computer set up to protect your simple business network
    from troublemakers on the Internet.


    This book uses terminology that is somewhat different than what you will find
    in the technical literature. The local network that we have been working with
    is referred to as the private network. (What I call the private network is often
    referred to as the protected network when reading about firewalls in the technical
    literature.). The Linux-based firewall is called the firewall server; in other
    circles that machine is often referred to as a screening router or Bastion Host.
    (An optional firewall system is created where a separate network is created to
    isolate the firewall server from the private network. The separate network is
    typically referred to as the DMZ network. That convention is used here too.) Hopefully,
    the terms used here are descriptive and clear.


    Firewalls come in two primary flavors: filtering and proxy. Filtering firewalls
    look at each IP packet and decide whether to pass or reject the packets based
    on a set of rules that you set; they work the OSI Network layer (see the section
    "The'
  merge: -1
  img_proc: true
- pgno: 367
  md: 'OSI Network Layer Model" in Chapter 4 for more information). Proxy firewalls
    as an intermediary between a program client and its server by replicating the
    communication and performing other security functions. They work at the OSI application
    layer.


    There are several strategic places to put a firewall within a network. Two common
    configurations put a firewall either directly on the private network or on a separate
    network dedicated to security. The former allows a simple firewall to be easily
    constructed, and depending on what services the firewall provides, can be reasonably
    safe. The latter is more difficult to configure but provides a higher degree of
    safety; this book refers to the latter as a firewall network, but the general
    term is the DMZ.


    # IP Filtering Firewalls


    Filtering firewalls look at each packet coming into and going out of them, and
    compare the source IP and port as well as the destination IP and port to a set
    of rules. The packet is either permitted or not depending on these rules, which
    you, the network administrator, choose.


    Red Hat Linux comes with the iptables package, which provides filtering capabilities.
    This package allows the filter rules to be configured dynamically and also can
    perform numerous levels of logging. The dial program described in Chapter 7 can
    automatically set up the iptables rules. This allows you to fully automate your
    Internet PPP connection and firewall.


    Filtering firewalls are relatively easy to configure. They are also efficient;
    an Intel 486 firewall can easily handle a medium-sized network (dozens of computers)
    connected to the Internet through a T1 frame relay connection (1.54 Mbps). They
    are also safe as firewalls when providing one-way communication to the Internet.


    The knock against IP filters is that once you start to allow incoming connections
    from the Internet you are poking holes in your firewall. For instance, if you
    want to interactively connect to your private network from your home computer
    (assuming that they are not one and the same), then you need to set a rule(s)
    that allows incoming Telnet connections. There are tools (for instance nmap, which
    is discussed in the section "Using nmap" in Chapter 12) that can potentially find
    those holes and use them against you.


    # Proxying Firewalls


    Proxying firewalls allow you to add application-level authentication to incoming
    connections. For instance, if you want to connect to your private network from
    your home computer, a proxying firewall forces you to provide a password before
    allowing you. Using one-time passwords makes it very difficult for unauthorized
    users to gain access to your system.'
  merge: -1
  img_proc: true
- pgno: 368
  md: '# Hybrid firewalls


    This book assumes a networking model where most, if not all, of your Internet
    traffic is outward bound to the Internet. Chapter 12 describes using Secure Shell
    as an external communication path into your network. However, you might want to
    use another method for external communication - a hybrid firewall.


    This book uses a hybrid firewall designed to minimize your work while maximizing
    your safety. After all, as a new administrator, you should have a firewall that
    you can put into place quickly. Once you are protected, then you have a window
    of time to learn more and fully make decisions on how much additional protection
    you need. You might feel very well near without requiring anything more than what
    is described here.


    The hybrid firewall uses IP filtering to allow one-way communication from your
    Private Network to the Internet. You allow incoming communication by placing a
    one-time password system on the PPP connection described in Chapter 8. By separating
    the two channels, you use the strength of the IP filtering system to your maximum.
    The semi-private phone system provides limited (you need to know a phone number
    before an attack can be made) to your network that is further supplemented by
    a tough authentication system. Put together, this system provides the best of
    both worlds.


    Note: If you do not require incoming connections, then you''re that much better
    off. The IP filtering still works in its best mode (one-way). Plus, you do not
    have to worry about providing any incoming protection. Most individuals (for instance,
    an aspiring writer) and many small businesses only need functions such as e-mail
    and Web browsing.


    The problem with proxying firewalls is that they are relatively difficult to set
    up. They are somewhat inefficient, and are vulnerable to software bugs and new
    attack methods.


    Configuration is difficult because each application that you want to proxy requires
    its own configuration. (The SOCKS system, however, has only one configuration.)
    It is inefficient because the communication processing is doubled for every application
    because every packet has to be rewritten as it passes through the proxy.


    It''s somewhat vulnerable to new attacks because any attack that finds an opening
    can only be fixed by the programming of the proxy itself. For instance, when Denial
    of Service (DoS) attacks first, any proxy that fell victim to them had to be reprogrammed.
    Unfortunately, this isn''t something that a pressed administrator can do easily,
    if at all (Filtering firewalls, while not immune to attacks, can readily be reprogrammed
    to simply deny the IP packets that carry the new attack) The fact that a proxying
    firewall is often sitting out on the Internet means that potentially everyone
    on the Internet can pound away at your firewall. The more attempts made on your
    firewall the higher the probability that a weak spot can be found.'
  merge: -1
  img_proc: true
- pgno: 369
