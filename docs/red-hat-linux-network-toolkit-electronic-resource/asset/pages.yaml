    # Using Samba’s macro capability


    Samba can substitute macros for service parameters. Upon connection, dynami-

    c allocates its resources to which machine, user, or other is asking for

    each resource.


    You designate a macro by adding a percent (%) symbol as the first character of

    any of several predefined names. Table 6–2 shows the macros.


    # Table 6-2 SAMBA MACROS


    | Macro | Description |

    | %S | Current service or share if it exists (if any exists) |

    | %P | Root directory of the current service or share (if any exists) |

    | %u | User name of the current service or share (if any exists) |

    | %g | Primary group name of %u |

    | %U | Session user name the client requested, but not necessarily the one received
    |

    | %G | Primary group name of %U |

    | %H | The home directory of the user given by %u |

    | %v | Samba version number |

    | %h | Host name of the Samba server |

    | %m | NetBIOS name of the client computer |

    | %L | NetBIOS name of the Samba server |

    | %M | Internet name of the client computer |

    | %d | Process ID of the current server process |

    | %a | Architecture of the remote server |

    | %1 | IP address of the client computer |

    | %T | Current date and time |'
  merge: -1
  img_proc: true
