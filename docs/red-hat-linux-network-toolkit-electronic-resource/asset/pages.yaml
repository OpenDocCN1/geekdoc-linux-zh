- pgno: 94
  md: '# Chapter 3: Troubleshooting


    # Tools of the Trade


    When you need to solve a problem, you must use the tools you have at your disposal
    – tools such as the Network Troubleshooter. An auto mechanic who figures out that
    you have a bad spark plug is of use without a socket wrench and an extra plug.
    In the following sections, I discuss some of the other tools you can use to solve
    problems with your network.


    # Diagnosing the Linux box: My troubleshooter


    Your Linux box is the foundation of your network. It must be set up correctly
    for anything to run. If you carefully follow the installation instructions I provide
    in Chapter 1, your network will be up and running like a champ. If it isn''t running,
    or if you have some unusual setup (Murphy in a bad mood), you can check for several
    different causes. The following sections describe several steps you can take.
    Think of the guidelines in these sections as Paul’s Troubleshooter.


    If the network on your Linux computer is not working, use the following sections
    as a simple fault tree that you can follow to troubleshoot your network. I divide
    this troubleshooter into two major areas: Linux networking and Samba. The troubleshooter
    is not comprehensive, but it does cover some of the typical problems that I have
    encountered.


    # CHECKING LINUX NETWORKING


    You can take several steps to check your network for problems. The following sections
    identify common problem areas to check. Over time, you''ll find that these areas
    account for most of the problems you see.


    IS THE POWER TURNED ON? First, verify that you have turned on the power. Sounds
    simple, but hey, sometimes the simplest things go wrong. The problem I am best
    able to solve.


    HAS YOUR NETWORK CABLE BEEN COMPROMISED? Thinnet is topologically a bus structure.
    In other words, each computer on a Thinnet cable is connected to all the other
    computers in the network. Each computer sees all the network traffic on that cable.
    If any part of that bus is compromised, all traffic ceases. For example, if you
    disconnect the terminator at either end of the cable, communication ends. The
    best way to troubleshoot that type of problem is to start at one end and work
    your way down the line. Try to get two computers connected, then, and eventually
    you''ll find the fault.


    Determining whether your network cable has been compromised requires addressing
    the following:


    +   Make sure the "BNC" – Bayonet Nut Connector – connectors are securely attached
    if you are using Thinnet.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Part I: The Simple Client-Server Network


    +   - Look at the interface between the coaxial cable and the BNC connector to
    make sure they are in good physical contact. Sometimes, the cable can pull out
    a little bit so the little pin in the center of the cable does not contact with
    the other end of the BNC connector.


    +   - Look at the cable itself and make sure it hasn''t been cut or crushed.


    +   - If you have an ohmmeter, test the continuity of both the center conductor
    and the outer shield conductor. Make sure the cable is not attached to anything.


    +   - Make sure the center conductor is not touching (short-circuited) to the
    shield (the thin, braided metal wires immediately under the outer insulation).


    +   - Make sure that each end of the cable has a 50ohm terminator attached to
    it. A Thinnet must be terminated or it will not work, just as it will not if the
    cable is broken. The reason for this is that the radio frequency (RF) signal reflects
    from the un-terminated end and interferes with the incoming signals.


    If you have a cable that you know good, try substituting it. The idea is to eliminate
    as many segments that you are unsure about possible. If you have two computers
    in close proximity and you suspect a problem with the cable you are using, all
    you can do is try another cable. If the computers are far apart and rely on several
    segments or a long cable, try moving them together and using one short segment.
    If you have three or more computers, try getting just two of them working together.
    Then adding another one. Proceed until you find the faulty


    # YOUR NETWORK ADAPTER CONFIGURED CORRECTLY?


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_95_0.png)


    When I list commands or programs to execute in the following paragraphs, I show
    the absolute pathname. Red Hat sets up the path for most of these commands in
    the Root environment in the same way that DOS uses the PATH=environmental variable.
    By giving the entire path, however, I assure that my examples will work no matter
    how you set up your environment, and I also give you a peek into the Linux file
    system.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_95_1.png)


    Rather than give generic parameters, I use my own values (such as my IP address)
    in the commands that I describe in the following paragraphs. I also italicize
    the parameters. Use your own values where appropriate.'
  merge: -1
