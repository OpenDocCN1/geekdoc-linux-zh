- pgno: 146
  md: '# Chapter 4: Looking Under the Hood


    The GPL is printed at the end of this book, and I recommend that you read it.
    But here is a brief summary of its key points (I am not a lawyer; these are my
    own opinions based on my reading of the GPL):


    +   - Software published under the GPL is not in the public domain. The public
    does not own the software because it is copyrighted to the author(s) and protected
    by all international copyright laws. The author(s) choose(es) to allow you to
    use it in almost any way you want, but you do not own it.

    - GPL published software is not shareware. Share authors own the copyright but
    ask you – without enforcement – to send them money after using their software.

    - GPL software can be distributed for free or for a fee. When you use Linux over
    the Internet using anonymous ftp (see Chapter 5), the software is generally GPL
    and no charge is attached. When you buy a Linux distribution CD-ROM, you pay for
    the CD-ROM. Whatever GPL software comes on the CD-ROM, however, cannot be restricted.
    If I want to, I can give you the Linux source code, which I obtained on the Red
    Hat CD-ROM.

    - GPL software can be modified and redistributed, but the new version must be
    covered by the GPL.

    - GPL software must advertise that it is covered under the GPL.


    This is an ingenious mechanism. First, it enables unhindered distribution of GPL
    software. Second, it enables those who add value to the base software and thus
    propagate it further to make money. Finally, it prevents any person or organization
    from gaining a restrictive hold on GPL software in the future.


    # Conclusion


    I could cover much more in this chapter, but my goal is to outline the most important
    fundamentals in the way that I wanted to be taught. As you read further in this
    book and gain hands-on experience building and managing a Linux/Samba network,
    you will pick up more details. This chapter offers a framework from which you
    can proceed with confidence.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# # Summary


    In this chapter, some of the internal workings of Linux were revealed:


    +   - Rushing to get a system running in Chapter 1 precludes gaining much understanding
    of what''s under the hood. Administering a network in the long term requires you
    to understand how it works.


    +   - Understanding the meaning of the term Linux is important when discussing
    its internal workings. The meaning of Linux depends on the context in which it
    is used. It can refer to the entire system, or the kernel, or some combination
    of the two.


    +   - The kernel is the heart of the Linux system. It controls when how long processes
    are processed by the microprocessor (for example, the Pentium). It also controls
    access to the file system.


    +   - The Linux file system translates the raw bytes that exist on disk drives
    into the files and directories that you use every day. It is important to understand
    how Linux works in order to manage a Linux system correctly.


    +   - Understanding the Linux startup process is important to gaining an understanding
    of the total system. The kernel is loaded into memory and determines what devices
    it can use. It starts the init process, which starts the computer in a single-user
    mode for safety and guides it to whatever user state (multiple user, X Window,
    and so on) is defined in the initab file. It also starts the rc scripts that configure
    everything from what disks are mounted to the network setup.


    +   - Understanding the OSI network model helps you to conceptually understand
    how networks work. It is a logical protocol and separates the different types
    of processes that need to occur in order for networks to work. It would be much
    more difficult to modularize network communications without its discipline. Although
    the programs that codifies not not (because they would be unwieldy), conceptually,
    it is useful.


    +   - If Linux is the heart of the system, then Samba makes it practical. It replaces
    NFS as an economical way of connecting Microsoft Windows computers. It “speaks”
    the Windows native language, whereas NFS does not and requires expensive software
    to communicate


    +   - Originating as a Microsoft networking protocol, the Samba protocol, smb,
    provides a powerful method for connecting Windows clients to Linux servers. Samba
    provides the interface between networked resource requests from Windows machines
    and the Linux kernel.'
  merge: -1
  img_proc: true
