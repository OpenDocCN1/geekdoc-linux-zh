    # Done


    That''s it. You''re done. Click Ok and you are prompted to remove the boot – or
    supplemental floppy when the computer reboots. It should come back running Linux
    and you are on your way!


    # Introducing the Red Hat Startup Process


    When Red Hat Linux is booted numerous processes called daemons are started. The
    run level determines what daemons are started. Linux uses run levels to define
    the basic functions that the computer provides. Each level has certain daemons
    associated with it. For instance, the default run level as defined by the Red
    Hat installation process is 3. Run level 5 and the X Window System is the default.


    Within each run level the method for determining what daemons or processes started
    is to place soft links in certain directories. A soft link is analogous to a pointer
    (UNIX) or shortcut (Windows) but is really a file with the name of another file
    in it. The directories that contain the soft links are /etc/rc.d/rc0d, /etc/rc.d/rc1.d,
    and ... /etc/rc.d/rc5.d. Each one, of course, corresponds to a run level. The
    run level is set in the /etc/initstab file.


    The soft links point to programs or scripts that do the actual starting of the
    daemons. Therefore, when a file in the /etc/rc.d/rc5.d directory gets executed,
    the script that it points to in /etc/rc.d/init.d gets executed and any commands
    that it wants to run get.


    # Troubleshooting


    The art of troubleshooting is introduced in Chapter 2. However, there are some
    quick tips that should be covered here.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# Fixing network problems


    If the Red Hat installation process does not detect your Ethernet adapter (NIC),
    you will not see steps 2 and 3 in the section "Configuring your Network" in this
    chapter. In that case, please refer to the section "The Network Configurator"
    in Chapter 5. It describes this system via the Control Panel. Enter the same information
    described in Configuring your Network. Alternatively, you can run LinuxConf and
    enter the information in Config -> Client tasks -> Basic host information and
    ... Client tasks -> Name server specification menus. If the installation system
    did not detect your NIC, then it''s a good bet that you''ll have to specify the
    NIC kernel module during configuration. For instance, if you have a 3Com 3c509
    card (like you used to have), then enter that name in the Kernel module box.


    # Summary


    This chapter covered the basics of installing Red Hat Linux. Installation is not
    an easy process, but can be simpler if you learn some essential topics and make
    some basic preparations. When problems occur you can very often solve them by
    following basic troubleshooting techniques and knowing where the more common problem
    spots are.


    Topics covered in this chapter:


    +   * The overall process of installing Red Hat Linux. A simple list of the steps
    is given. That information helps provide a simple road map so you can look ahead
    and hopefully gain an understanding of the process.


    +   * The process of installing Linux by itself or along with Windows. The Red
    Hat installation process can be a pretty straightforward one, but you may occasionally
    run into difficulties. If you prepare your system and follow the process precisely,
    then it can be a good experience.


    +   * Detailed, step-by-step instructions to guide you through the Red Hat installation
    process. This book uses a coherent set of example computers and networks. You
    are given specific information to use during the installation process so that
    the computer you build will fit into the upcoming examples.'
