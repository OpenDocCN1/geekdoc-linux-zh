- pgno: 253
  md: '12. If your PPP login name and password is accepted, you will see some garbled-looking
    text. This is the ISP pppd daemon to connect to your pppd daemon.


    13. You need to return to the interactive dip mode. Press the Ctrl and right square
    bracket ([]) at the same time. You will see the DIP> prompt again.


    14. From the DIP> prompt, enter the following command:


    ```

    DIP> get local 0.0.0.0

    ```


    This command tells dip to get its local IP address from your ISP. ISPs-most universally
    assign IP address dynamically. (You can purchase a static IP address but this
    command will still work.)


    16. Tell dip to use the assigned IP address as your computer''s default route.
    Actually, dip tells pppd to use the IP as its default address.


    ```

    DIP>default

    ```


    17. Finally, tell dip to start the pppd daemon. Enter the following command and
    automatically exit from dip and the pppd daemon will be started. After a few seconds
    your Internet connection should be complete.


    ```

    DIP> mode PPP

    ```


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_253_0.png)


    Recall from Chapter 1 that you were directed not to assign a default route during
    the network configuration. If you do not want to have two default routes. However,
    if you have permanent connection—either to your own LAN or the Internet —you can
    still have it all. If you omit the default command, and go directly to mode PPP,
    then a route to your ISP''s network will be created. For instance, if your ISP
    assigns your connection to the IP 192.168.115.54, then a route to the 192.168.115.0
    network (class C) will be created by dip. All network traffic for that subnet
    will be directed—through the PPP connection that sets up.


    If all goes well, your pppd daemon is launched and connects with your ISP''s pppd
    daemon. Once they understand each other, you can get a connection to the Internet.
    You can look at the process if you enter ps x | grep ppp command.


    ```

    729 a0 S 0:00 pppd -detachroute crtsmod modem 192.168.115.8:

    733 p0 S 0:00 grep ppp

    ```


    Once the connection is established, you can enter the netstat -rn command. The
    resulting information indicates that your default route is set to the ppp0, which
    in turn is connected to your modem and then your ISP:'
