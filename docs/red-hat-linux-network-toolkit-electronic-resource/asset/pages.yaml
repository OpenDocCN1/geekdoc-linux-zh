    Actually, in the case of a printer, smbd stores the information to be printed
    in a print queue. For example, when I print CHAP_4.DOC to my network printer,
    Windows saves the document data to the Linux server; smbd saves the data to /var/spool/lpd
    and launches a print request on that file. The lpd daemon (enter ps -x | grep
    lpd to view it) is the process that handles the print request.


    In the case of a file, smbd sends the data to the kernel, which ultimately saves
