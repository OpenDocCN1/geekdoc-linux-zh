- pgno: 102
  md: '# Chapter 3: Troubleshooting


    If you get a continuous stream of returned packets and the packet loss is zero
    or very near zero, your network is working. If not, the problem may be in the
    Linux computer or the Windows machine. Review the troubleshooting steps 1 I describe
    in this chapter. Note that the ICMP is taking about 1 millisecond (ms) longer
    to travel to my Windows box than to the loopback device. That is because the loopback
    is completely internal to the Linux box.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_102_0.png)


    If you can''t locate the problem and you are using a PPP connection to an Internet
    Service Provider (ISP), establish a PPP connection and try to ping the computer
    where you have your account. It is considered a security breach to continually
    ping someone else''s computer — and at least bad manners — so dont leave it. Also,
    the ISP''s firewall may not allow the Internet Control Message Protocol (ICMP)
    packets that you use. ICMP packets are the simplest type of packet defined in
    the Internet Protocol. They are used for doing simple things like a ping.


    # CHECKING SAMBA''S SERVICES


    If your basic networking is working but you can''t access the Samba resources,
    the next likely culprit is Samba. The Samba suite of programs includes several
    tools that can help you troubleshoot problems. The following tests address a much
    wider range of problems than should occur if you have not modified the smb.conf
    file that Red Hat has installed for.


    The Samba configuration file, smb.conf, is quite complex. It contains dozens of
    variables and they can interact in hundreds, if not thousands, of us. Although
    I''ve kept the examples so far in this book, to get a useful client-server system,
    you have to experiment. To facilitate that experimentation, and to help you troubleshoot
    problems, Samba provides a useful suite of test programs.


    Start by making sure the daemons are running. From the command line, enter the
    following command:


    ```

    ps x | grep mbd

    ```


    As shown in Listing 3-7, you should see a line for smbd and one for nmbd. The
    grep command filters all the output from ps except for those lines that contain
    the string mbd. Listing 3-7: Looking for the smbd and nmbd daemons


    ```

    [root@chivas /]# ps x | grep mbd

    227 ? S 0:00 smbd -D

    236 ? S 0:00 nmbd -D

    360 ? S 0:06 smbd -D

    742 p0 S 0:00 grep mbd

    ```'
