  md: 'want to keep it as well. The inetd, named (if you installed the optional Red
    Hat ser-vice in Chapter 1), lpd, sendmail, smbd, nmbd daemons are all unnecessary
    for a firewall server, in my opinion. The processes all relate to my logins except
    for the update process, which is part of the kernel. The mingetty processes from
    the console and should not present any security problems. The login process and
    the bash shell (288 and 296) are logged in root from the console and running the
    bash shell. You can also ignore the last several processes (308, 323, 324, and
    336) because they are the processes I used to log remotely via Telnet (in.telnet),
    and then changed to root (su), the shell for root (bash), and the com-mand show
    all processes (ps x). I will, however, eliminate the capability to log via Telnet
    in the section "Stopping inetd" later in this chapter, but for now it is okay
    because I am still configuring the Firewall Server.


    The following sections describe how I configure my minimal Firewall Server.


    # Stopping inetd


    The idea is to eliminate as many possible security breaches as possible. One way
    to do this is to run as few daemons as possible. Many processes are started by
    the in-et daemon. inetd is called the super daemon because it is responsible for
    starting all of processes on demand. Leaving one daemon in charge of starting
    many others means that you only need to run one instead of many. You either not
    run inetd at all or else edit its configuration file. In my opinion, it is best
    to run inetd at all because there will be no doubt about what is and what is not
    running.


    +   1. Log in to atlas as root.‒‒. There are numerous ways to not run inetd. First,
    you could remove the execution privilege by logging on as root and entering the
    following command:

    3. You could also simply eliminate the link in the root-level directory-ctories.
    For instance, you could remove the /etc/rc.d/S50inet file, which is a link to
    the /etc/rc.d/init.d/inet script. Without the link, the inetd script will never
    be executed when you boot your computer.


    ```

    chmod -x /etc/rc.d/init.d/inet

    ```


    ```

    rm /etc/rc.d/rc3/S50inet

    rm /etc/rc.d/rc4/S50inet

    rm /etc/rc.d/rc5/S50inet

    ```


    (You could also simply rename the links and they won''t be executed but you''ll
    know their names should be if you ever decide to restart them).


    ```

    mv /etc/rc.d/rc3/S50inet /etc/rc.d/rc3_/S50inet

    mv /etc/rc.d/rc5/S50inet /etc/rc.d/rc5_/S50inet

    ```


    +   4. You can also delete the actual inet script.'
