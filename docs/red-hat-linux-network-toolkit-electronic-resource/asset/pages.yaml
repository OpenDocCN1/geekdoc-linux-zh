- pgno: 375
  md: '# Part IV: Managing your Network


    cess to your system. However, the former mode is used in this book in order to
    provide the maximum security.


    The filter script used for this firewall can be found in /mnt/cdrom/firewall/
    ipfilter.rules on the companion CD-ROM. Most of its rules are listed here, but
    some of the comments and the Type of Service (TOS) rules, which are used for optimizing
    the modern connection, have been omitted for brevity''s sake.


    ```

    #!/bin/bash

    # i Define variables

    # High (non well-known ports)

    HI="1024:65535"


    # Define the default network address

    ALL="0.0.0.0"

    # Define the private network''s address

    PRIV_NET="192.168.1.0/24"

    # Define localhost address

    LOCAL_HOME="127.0.0.1"

    # Define dynamic PPP IP address (your ISP assigns this to you at connection

    PPP_IP="/sbin/ifconfig ppp0 | grep ''inet addr'' | awk ''{print $2}'' | \

    sed -e ''s/addr://\

    echo $PPP_IP

    # ---- General Rules

    # Flush out all existing rules

    /sbin/ipchains -F

    # Flush out any existing chains

    /sbin/ipchains -X


    # Set default filters to deny everything

    /sbin/ipchains -P input DENY

    /sbin/ipchains -P output DENY

    /sbin/ipchains -P forward DENY


    # Allow all internal network traffic

    /sbin/ipchains -A input -i lo -j ACCEPT

    /sbin/ipchains -A output -i lo -j ACCEPT


    # Allow all internal network traffic

    /sbin/ipchains -A input -i eth0 -j ACCEPT

    /sbin/ipchains -A output -i eth0 -j ACCEPT


    # Deny spoofed packets

    /sbin/ipchains -A input -j DENY -i ppp0 -s $PPP_IP -d ALL

    /sbin/ipchains -A output -j DENY -i ppp0 -s $PRIV_NET -d ALL

    # ---- TCP ----

    ```'
  merge: -1
