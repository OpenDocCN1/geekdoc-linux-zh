    ```

    /etc/rc.init.d/ypserv start

    ```


    > TIP You can create master/slave servers within a single NIS domain. The single
    master server pushes its maps to the slaves. The slaves then act as master servers
    in every way. Please consult the ypserv man page for more information.


    8. You need to create the /var/yp directory and the NIS databases for the server
    to work. Run the following command.


    ```

    /usr/lib/yp/ypinit -m

    ```


    A subdirectory called tiburones is created in the /var/yp directory. The NIS databases
    – maps – stored there. The ypserv daemon distributes those maps to all of the
    NIS tiburones clients.


    9. yp prompts for the name of the hosts to use as a server. The machine that you
    are working from is used as the default so you don''t have to enter any host names.
    Press the Ctrl-D keys and then press the Return key to finish the process. The
    databases will be constructed.


    10. Start the NIS client.


    ```

    /etc/rc.init.d/ypbind start

    ```'
