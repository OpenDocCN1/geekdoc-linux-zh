    # Using Automount


    The automount system allows you to access resources, such as your home directory,

    from any Linux (or UNIX) computer on a network. When combined with NFS

    NIS you can use automount to specify any directory or file system to be automati-

    count on a Linux computer.


    # Using automount locally


    You need to tell automount which directory will be used to mount the resources.

    For instance, if you want to automatically mount your home directory, then a typ-

    cically convention is to use the /nethome directory. Any directory that you declare

    as a mount point will be a virtual one. That is, you do not have to physically
    create

    such a directory with the mkdir command.


    You also need to give automount a map of the resource to be mounted. Maps

    contain information about the resource to be mounted. For instance, automount

    must know about a user''s home directory resides if it is to be mounted. Maps

    be a local file(s), a NIS database or a command. The local file will be typically

    something like /etc/auto.home; an NIS map will be distributed by ypserv and

    ybind and reside in a computer''s memory; a program map will be created by run-

    ing a script or program.


    +   1. Login to chivas as root.

    2. Mount the Red Hat CD-ROM.

    3. Install the autofofs (automount) package.


    ```

    mount /mnt/cdrom

    rpm -ivh /mnt/cdrom/RedHat/RPMS/autofs*

    ```'
  merge: -1
  img_proc: true
