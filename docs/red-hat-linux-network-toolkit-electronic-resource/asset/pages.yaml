    use it while creating or extracting an archive, each file is displayed as it is
    copied or extracted. Using it with the listing option produces a listing like
    the one you would get with the long format of the command (ls -l).


    To restore those files, use the extract option as shown in the following command:


    ```

    tar xf lidia.tar

    ```


    The extracted files are placed in your current directory unless you specify that
    tar use the absolute path -P-option, in which case tar attempts to restore the
    files to their original location at /home/lidia.


    > > TIP

    The tar version that comes with the Red Hat Linux distribution is smart enough
    not to include the archive in itself. That is, if you are copying to a tar file
    that happens to be in the directory from which you are saving, the tar file that
    you are creating will not be included in the tar file. However, older versions
    will happily include themselves in the tar file they create.'
