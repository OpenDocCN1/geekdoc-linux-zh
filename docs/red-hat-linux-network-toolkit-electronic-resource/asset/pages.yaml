- pgno: 291
  md: '# Part III: Expanding your Network Services


    From your Linux e-mail server—chivas—log in as root and run fetchmail. Your dial
    should dial your ISP and make the PPP connection.


    # SCHEDULING FETCHMAIL FETCHES


    You can configure fetchmail to automatically retrieve your company''s e-mail in
    couple of ways.


    One way is to run fetchmail in daemon mode and it periodically download mail.
    It must be run as root and must be in multidrop mode. For instance, if you run
    it as fetchmail -d 300, then fetchmail downloads your e-mail once every 5 minutes
    (300 seconds). If you run fetchmail in this mode, then you need to start it automatically
    time you boot your Linux box. A good way to start up a system that not have a
    startup script in the /etc/rc.d/init.d directory is to use the /etc/rc.local file.
    Log in as root and add the following lines to the rc.local file.


    ```

    if -f /etc/fetchmail ]; then

    /usr/bin/fetchmail -d 300

    fi

    ```


    Another method is to have cron kick off a fetchmail process. Log in as root and
    run crontab -e command. It starts up vi (whatever your default text editor is)
    and edits the crontab file for the user root. Add the line the following:


    ```

    # Fetch mail from mail.myisp.com

    0.20,40 * * * /usr/bin/fetchmail v

    ```


    Cron starts the fetchmail process as the user root every 20 minutes. Please refer
    to the crontab page for information about the scheduling details.


    Finally, you might want to opt download mail whenever you connect to your ISP.
    You can modify the /usr/local/etc/ipfilter.rules to include the follow-line at
    the end of the file.


    ```

    /usr/bin/fetchmail -d 60 -v

    ```


    Once the PPP connection is made, dial/chat kicks off a fetchmail daemon that checks
    for e-mail once every 60 seconds (you can choose any interval you want).

    Add the following rule to the /usr/local/etc/ipfilter.reset script to stop the
    fetchmail daemon when PPP is disconnected.


    ```

    killall -9 fetchmail

    ```'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# Chapter 8: Creating NFS, NIS, DNS, and E-mail Servers


    You can use this method by itself or in conjunction with the previous methods.
    There is no reason why you shouldn''t download your e-mail every time you connect.
    It doesn''t cost you anything other than the filling up of your PPP connection
    with the e-mail coming across.


    # Troubleshooting


    Designing and maintaining an e-mail server can be a very complex job. Fortunately,
    the default Red Hat installation provides a ready made sendmail system that works
    for a small network. You can readily construct a complete e-mail system by adding
    fetchmail to remote e-mail. Please test your new system before using it as your
    primary e-mail system.


    However, keep in mind that if you have problems configuring it, you can always
    configure e-mail clients like Netscape to send and receive e-mail directly from
    your ISP.


    # Using the Netscape e-mail client


    If your Netscape e-mail client refuses to read your mail queued up at your ISP,
    then first check that you have a POP connection. Next check that ipchains based
    firewall rules allow POP or IMAP (depending on which protocol you use). A quick
    and potentially dangerous (if you happen to get attacked during the time your
    firewall is turned off) way to do this is to simply turn off the filtering rules.
    If you can get your e-mail, then you know that a modification of your firewall
    is in order; consult Chapter 12 for a discussion of filtering rules.


    If you still cannot get your e-mail, make sure that your Netscape preferences
    are set correctly. Look at the server name and protocols as well as check that
    your user name and e-mail address are correct. Consult the /var/log/messages and
    /var/log/maillog files for any hints to your problems. You might also consult
    your ISP for advice.


    In the case where you are running your e-mail server and your e-mail client cannot
    access it, first check that your network connection is functioning correctly;
    If your network is okay, then check to see the sendmail daemon running. That can
    be tested with a simple ps x | grep sendmail or /etc/rc.d/init/sendmail status
    commands as well as by logging into your server and running Netscape. Change the
    preferences to use Movemail and if you get your mail, then sendmail is fine. Change
    then check the /etc/services and /etc/inetd.conf files to make sure that they
    have POP and/or IMAP entries. Use RPM to check that POP or IMAP is installed (rpm
    qa | grep pop). Also check your /var/log/messages and /var/log/maillog for any
    hints that might glean. Finally, check the Usenet groups like comp.mail.sendmail
    for advice and information on your problem.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# Fixing problems with local e-mail


    Sendmail daemon is configured out of the box by Red Hat to serve a small Private
    Network. If you never need to go outside your network and you are not getting
    e-mail, check first that sendmail is running. Second, check the sendmail installation
    with the rpm V sendmail command. If it still does not work, consult your /var/log/messages
    and /var/log/maillog for insights. The last step is to configure the Usenet news
    groups like comp.mail.sendmail.


    When a message fails to get sent, it is returned to the sender or the postmaster;
    in the case where it cannot be delivered, a message will be written to the /var/log/maillog
    file. The return message has information about why it failed. It is beyond the
    scope of this book to discuss the many reasons this might happen. Please refer
    to the sendmail man page as well as the FAQ and other documents in the /usr/doc/sendmail
    directory for further information.


    # FIXING PROBLEMS WITH EXTERNAL DELIVERY


    Configuring sendmail to forward e-mail for the outside world is a simple task
    of modifying one parameter in the /etc/sendmail.cf file (see the section "Configuring
    Sendmail for External Delivery" in this chapter for details). If you cannot get
    your e-mail delivered, the problem most likely lies in either your Internet connection
    or your sendmail installation. The techniques described in Chapters 11 and 12
    to verify investigate the former. You can check the latter using the rpm -V sendmail
    command; don''t hesitate to reinstall sendmail, because you only have three parameters
    in the sendmail.cf to change.


    # FIXING PROBLEMS WITH EXTERNAL RETRIEVAL


    fetchmail is another system that depends on your ISP PPP connection being in place
    and your firewall filtering rules correct. If you are having problems getting
    it to work then use all the network and firewall troubleshooting hints given in
    Chapters 11 and 12 to verify your Internet connection. You can use the verbose
    flag to see how the connection and downloading process is going by using the fetchmail
    -v command. Pay attention to the login and authentication process. When fetchmail
    has authenticated with the POP or IMAP server you should see it saying that it
    is downloading the text or data of each message. Once that is, then you should
    see sendmail-related handshaking messages displayed. Any errors are displayed
    during this process. When all else fails, check with your ISP and the Usenet comp.mail.sendmail
    group.'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# Chapter 8: Creating NFS, NIS, DNS, and E-mail Servers


    # Summary


    +   - A description of building a simple DNS server. DNS is used to convert Internet
    domain names into numeric IP addresses. By running your own internal DNS system,
    you can avoid having to enter all the host names on your Private Network into
    every machine. Scripts are provided that allow you to set up a simple DNS server.
    The scripts are oriented around the paunchy.net network used in all examples in
    this book.

    - Using your Netscape e-mail client to directly access e-mail queue at your ISP.
    This is a simple and nearly bulletproof method. Your ISP takes delivery of e-mail
    addressed to you. Netscape is configured to pull your messages across your PPP
    connection using POP or IMAP. Each user on your network requires a separate account
    for this method to work.

    - Using your Linux server to handle local e-mail delivery while forwarding or
    fetching external e-mail from your ISP. This requires four separate functions:
    local deliver, external forwarding, external fetching and domain registration.

    - Obtaining an Internet name if you want to run your e-mail system. This is necessary
    so that your ISP can forward messages to your sendmail server. Your ISP can handle
    the registration process for a small fee.

    - Configuring your Linux box to act as a local e-mail server. Messages destined
    for people on your network can be handled by the Red Hat sendmail installation.
    No modification of the /etc/sendmail.cf configuration file is necessary.

    - Modifying one parameter in your /etc/sendmail.cf file takes care of the e-mail
    forwarding process. That line simply points to your ISP''s e-mail server.

    - Using fetchmail to retrieve external messages queued at your ISP finishes your
    Linux e-mail server configuration. There are several ways to configure fetchmail—either
    on an individual retrieval basis or for your entire domain. The individual method
    is straightforward for the group—maildrop—method is not much more difficult.

    - Troubleshooting e-mail problems. Most of the troubleshooting is based on basic
    network and PPP connection methods. Beyond that you can use the log information
    that sendmail, fetchmail and procmail produce.'
