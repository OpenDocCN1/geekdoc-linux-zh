    # # Fixing an unresponsive network with the Windows 95/98 Registry


    Sometimes after reconfiguring, an existing Windows 95/98 network configuration
    does not communicate with the network properly. Even after you reinstall the network
    adapter, client, and protocol from scratch, the problem is not resolved. The problem,
    as far as I can tell, is that Windows loses track of what is installed. It shows
    the proper items installed in the Network window but gets confused somewhere along
    the line.


    Windows uses a system Registry to keep track of all hardware and software configuration
    parameters. I use REGEDIT.EXE, which Microsoft supplies, to edit the Registry
    by double-clicking the keys shown. Remove the HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\VxDMTCP
    (if I''ve also had to remove the HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\ClassNetTrans00000)
    by clicking it and using the Edit menu to delete it. Reenter all the components
    in the Network window as described in the following steps. This process removes
    the erroneous information that Windows has stored about its network settings.
    After you redo the network setup and reboot the PC, everything should work.


    To redo the network setup:


    +   1. Open the Network dialog box by double-clicking the Network icon in the
    Control Panel window.


    +   2. Click the Configuration tab at the top of the Network dialog box and then
    click the Add button.


    +   3. In the selecting Select Network Component Type dialog box, select the Service
    option and then click Add.


    In the Select Network Service dialog box that''s displayed, select Microsoft in
    the Manufacturer sub-window and then select the File and printer sharing for Microsoft
    Networks option in the Network Services sub-window.


    +   5. Click OK to get back to the Network window and then click OK once more.


    +   6. Windows asks whether you want to reboot the PC. You must reboot to make
    the change effect.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_77_0.png)'
