- pgno: 420
  md: '# Chapter 12: Securing your Server 391


    # # Shutting down sendmail


    Sendmail has traditionally been a source of many network security problems. It
    is a complex piece of software and that complexity has lent itself to unforeseen
    problems. These problems have been greatly reduced in recent years and it is a
    reasonable system now. However, it should be run only when necessary.


    Recall from Chapter 8 that two different e-mail systems were described. One method,
    the ISP-based e-mail model, sends and retrieves e-mail directly from your ISP.
    The other method, the locally-based e-mail server model, uses sendmail and fetchmail
    to create a e-mail server for your private network. In the former case you should
    not run sendmail on any machine. In the later, sendmail should run only on the
    e-mail server.


    The following instructions describe how to turn off sendmail on a Linux computer.
    If you are using the ISP-based e-mail model, then run these instructions on every
    Linux computer on your network. If you use the locally-based e-mail server model,
    run this script on every Linux computer except chivas.


    +   1. Log in to your Linux computer as root.

    2. Remove the sendmail RPM package.

    ```

    pm -e sendmail

    ```

    3. Stop any running sendmail daemons.

    ```

    kill -9 sendmail

    ```

    4. Repeat steps 1 through 3 on any other Linux servers and workstations that you
    want to protect in this fashion.


    # # Stopping the Samba startup script


    A firewall should definitely not run any file- or printer-sharing utilities. If
    you do not set up your IP filter rules properly, your Samba shares can potentially
    be shared with the Internet!


    +   1. Log on to your atlas as root.

    2. Remove the Samba RPM packages.

    ```

    rpm -e samba-client

    rpm -e samba-common

    rpm -e samba

    ```

    3. Stop any running Samba daemons.

    ```

    /etc/rc.d/init.d/smb stop

    ```'
  merge: -1
  img_proc: true
