- pgno: 118
  md: '# Chapter 4: Looking Under the Hood 89


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_118_0.png)


    Linux uses the concept of a virtual console or terminal to make life easier for
    you. It simply maps two or more terminal sessions onto a single physical monitor.
    Any Linux distribution comes configured for between four and eight sessions. By
    pressing the Alt key in combination with the first four to eight keys (Alt+F1,
    Alt+F2, and so on), you toggle between independent sessions. This technique is
    equivalent to running several shells inside windows and switching between them
    with the mouse.


    # Understanding Virtual Memory


    Linux is also a demand-paged, virtual-memory operating system. By transferring
    (mapping) parts of a program or a data structure from memory to disk, the system
    can work with a program or data structure that is larger than the available memory.
    If you have 8MB of memory and you want to load a 10MB spreadsheet, the virtual-memory
    system takes part of that 10MB spreadsheet and loads it into memory. If you access
    the part that is still on disk, part of the file that is currently in memory is
    stored to disk, and the new segment is loaded into the freed-up memory. Using
    virtual memory slows down the system, but it makes your computer appear to have
    much more memory than it actually has.


    Do you remember the hoops you had to jump through back in the 1980s to get MS-DOS
    to access more than 640K of memory? Not only was it limited to 640K, but it did
    not have virtual memory, so a program had to use less than that to work. Linux
    has virtual memory, so if you have 8MB, you can load and run stuff that uses more
    than that. As you may recall from Chapter 1, during the Linux installation you
    set aside disk space for a swap partition. Linux uses that space to store the
    memory contents when it "swaps out."


    # The Linux "File”


    In the Linux (and UNIX) world, a file is not just an entity used to store information.
    It is also used as an abstraction to connect the kernel to each device, as well
    as a view into the kernel. In this way, Linux simplifies the access of devices
    by treating them like any other file. The directory /dev contains many files that
    are used as the common connection points between the kernel and device drivers.
    The drivers contain the internal specifics of a device and the kernel knows about
    the drivers. The device-vice file provides a convenient connection point that
    the administrator can easily view and modify.'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'For example, to use a mouse, it is not enough to have the device driver for
    the mouse installed (in the kernel itself); you also must have a device file associated
    with the mouse. I use a serial mouse connected to port ttyS0, so my system uses
    the file shown in Listing 4-3 to access the mouse.


    # Listing 4-3: The mouse device file


    ```

    | root Dec 8 14:00 /dev/mouse -> ttyS0 |

    | rw-xr--xr-x 1 root uucd 5, Dec 8 22:03 /dev/ttyS0 |

    | crw-------

    ```


    My kernel has a driver for a serial mouse and expects to find the device file
    as /dev/mouse. As you can see in Listing 4-3, /dev/mouse is a link, or pointer,
    to the first port device file—the device file to which my mouse is connected.


    A device file is either a *character* or a *block* type, as specified by the first
    character on the listing (the *c* specifies that the mouse is a character device
    and a *b* specifies a block type such as a disk drive). A device also has major
    and minor numbers, which the kernel uses internally for its own bookkeeping. The
    major number, along with the device type, identifies the driver, while the minor
    number is passed to the driver to identify the device. The drivers themselves
    are contained in Linux modules or compiled directly into the kernel.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_119_0.png)


    You create the /dev/ttyS0 device file using the `mkknod` command. For example,
    to create the mouse device file, log on as *root* and enter the following command:


    ```

    /bin/mknod /dev/ttyS0 c 5 64

    ```


    This command creates the file shown in Listing 4-3.


    Linux has several file types:


    +   * **Regular files** are the type you use all the time. In a long listing (which
    you produce by entering the command `ls -l`), a hyphen precedes the name of each
    regular file.


    +   * **Directories** contain the names of files that are stored or organized
    as a group. The grouping is arbitrary; you can choose any combination you want.
    You can also change the grouping at any time. You create directories by entering
    the *mkdir* command. A lowercase *d* precedes the name of each directory in a
    long listing.'
  merge: -1
