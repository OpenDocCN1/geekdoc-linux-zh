    # Layering security


    After you put all the separate items together to form your security system, you
    should view them as a whole as well as separately. You should not depend on your
    firewall alone, just as you should not depend on your passwords alone. One system
    depends on the other and vice versa.


    To this end, some useful utilities can assist you in looking for security loopholes
    in one system or:


    +   - The nmap port scanning and operating system. Use this system to probe your
    own network in order to check it for weaknesses.


    +   - The password-discovering tool crack. Use this system to discover weak or
    non-existent passwords.


    +   - Tripwire. This suite of programs monitors your computer network and computers
    for possible intrusions by checking such things as file size and date against
    known values.


    These systems are described in Chapter 12.


    # Maintaining Your System


    The more you plan ahead and maintain your system, the fewer problems you''ll have
    in the long term. Maintenance requires you to look at both hardware and software.
    It requires you to know what is on your system and where it is located. This may
    sound trivial, but over time a computer network is like any living thing and changes
    in both subtle and not-so-subtle ways. Especially as a network grows, it is very
    easy to forget where software applications and equipment are located. You can
    easily forget when it is time to do such tasks as clearing tape drives.


    The solution is to divide your system into functional areas such as hardware and
    software. Within these divisions you can keep lists and logs that will help you
    keep your computer running smoothly and reliably. The following list shows how
    I like to divide a system:'
