  md: '# Chapter 4: Looking Under the Hood


    # ### TABLE 4–1 LINUX MAN PAGE ORGANIZATION


    | Number | Contents |

    |---|---|

    | 1 | User commands and applications |

    | 2 | System calls and kernel error codes |

