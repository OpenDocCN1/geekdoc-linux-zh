- pgno: 36
  md: '# # Chapter 1: Installing Red Hat Linux


    No method is best for all situations. This chapter, however, concentrates on using
    what is called a Linux “boot” floppy. This is a floppy disk that contains the
    basic Linux operating system, a number of modules to communicate with your hardware
    – disks, network adapters, and so on – and a minimal number of system and application
    programs. With it, you can start – boot – Linux and then mount the CD-ROM from
    which you can install a complete Linux system. This method works under more circumstances
    than the other methods, but requires a little up-front work.


    > Of course, if you format an entire disk, you have use of the entire disk. This
    approach seems sense when you are ready to run your Linux box as a server or if
    you want to experiment on an unneeded disk. If you only want to experiment with
    Linux, use the multiple-partition method at first, as it is the least disruptive
    to your current setup.


    # # Making Room for Linux


    Before you can install Linux, you must make room for it. If you choose to use
    multiple partitions, you use a program called FIPS to shrink your current partition.
    If you decide to use a single partition, then you do not modify the disk partitions.
    With the multiple-partition method, you start the installation process by completing
    the following steps:


    +   1. Shrink the current partition with FIPS (this step makes room for both DOS/Windows
    and Linux on the same disk).

    2. Create a boot floppy by copying a special file with the DOS program.

    3. Boot the computer with the boot floppy.

    4. Install and configure Linux via the Red Hat installation process that is included
    on the Red Hat Publisher’s Edition CD-ROM. Adding the Linux par-titions – in addition
    to the DOS partition – is part of the process.


    With the single-partition (destructive) method, you begin the installation process
    by completing the following steps:


    +   1. Boot a floppy disk by copying a special file with the DOS program write.exe
    if you are running Windows or DOS. Otherwise, use the dd program when running
    under Linux.

    2. Boot the computer with the boot floppy. (If you have a newer computer, you
    should be able to boot directly off your CD-ROM.)'
