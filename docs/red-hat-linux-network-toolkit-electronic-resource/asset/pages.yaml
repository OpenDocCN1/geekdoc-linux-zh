- pgno: 276
  md: '# Chapter 8: Creating NFS, NIS, DNS, and E-mail Servers 247


    # Configuring an example NFS client


    This section describes configuring a Linux box to act as an NFS client. First
    you need to construct another Linux computer. Use the process described in Chapter
    1 to build a Red Hat Linux computer. The first section in this chapter Creating
    a New Red Hat Linux Computer describes the network parameters you need to use.
    You need to first configure an NFS server. That process is described in the previous
    section, "Configuring your NFS Server."


    The following instructions describe how to mount NFS shares across a network.


    +   1. Login to veracruz as root.


    +   2. Mount the Red Hat Publisher''s Edition CD-ROM.


    mount -r -t iso9660 /dev/cdrom/mnt/cdrom


    +   3. Install the NFS client package.


    rpm -ivh mnt/cdrom/RedHat/RPMS/knfs-clients


    +   4. Mount the lidia user.


    mount chivas:/home/lidia/mnt


    +   5. Run the df command and you should see the new mount.


    You can now access the user''s files from the /mnt mount point. However, just
    as with Samba, the Linux file permissions take precedence over the ones that you
    declare with NFS.


    # Creating a Simple NIS (yp) Server


    Once you use more than a couple of Linux (or UNIX) computers on a network, the
    job of managing users and their files becomes more difficult. The life of the
    user also becomes more difficult when more than one computer is used. One solution
    is to use the Network Information System (NIS).


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_276_0.png)


    > Please not confuse your DNS domain name with the NIS domain name. They are two
    different animals. The DNS domain name is the name that your private network —
    for instance, paunchy.net — is called.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# Introducing nswitch.conf


    The /etc/nswitch.conf file controls if, and when NIS is used. It contains a list
    of services and where the configurations are found. For instance, the passwd line
    in nswitch.conf controls how logins are performed. If you look in the default
    configuration, you see first that the password file is consulted, nisplus and
    finally nis. Since NIS+ only works on Sun Microsystems Solaris and SunOS, it is
    never actually used (used) you can take out the reference if you wish). If a user
    account password is not found in the /etc/passwd file, then NIS is consulted.


    passwd: files nisplus


    The important services that nswitch.conf controls are as follows:


    +   - Words

    - Host names

    - Group names

    - Auto mounts


    The sequence that this book uses files first and then NIS. You can use any sequence
    that makes sense for you. However, when it comes to passwords, it is best to leave
    the sequence: files and then NIS. This sequence allows you to log in in case your
    network is not working.


    > NIS was originally called Yellow Pages, or simply YP, when Sun Microsystems
    created it. However, that term was already trademarked and NIS was used in-stead.
    However, the YP legacy lives because the actual program names such as ypbind and
    ypserver are still used.


    NIS consolidates many different resources into a common pool. The consolidation
    takes the form of maps, which are exported, from the NIS server to the clients
    via the network. For instance, instead of each Linux computer using its own local
    copy of /etc/passwd, /etc/shadow, /etc/hosts and such, they use a single copy
    from the server.


    The copy of NIS that comes with Red Hat maps has a common system of files. This
    book makes use of a few of them and it is left to you to examine the others.


    +   1. Login to chivas as root.

    2. Mount the Red Hat CD-ROM.


    ```

    mount -r -t iso99660 /dev/cdrom /mnt/cdrom

    ```'
  merge: -1
  img_proc: true
