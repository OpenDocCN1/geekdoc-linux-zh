    # Managing your Firewall


    Maintaining a firewall is a lot of work, and there is no way around pointing it
    that fact. The following maintenance and observation tips are oriented towards
    you in the right direction and should not be considered to be definitive. Firewall
    management, like every other aspect of computer security, is a moving target.


    +   * The people and organizations who attempt to gain unauthorized access to
    your firewall and private computers are diverse in both scope and ability. There
    is no way to predict who will compromise your firewall or how. It is best to educate
    yourself about the bad guys. Please see the URLs in the section "Educate Yourself"
    in Chapter 12 for more information.


    +   * Log files (/var/log) provide a good mechanism to observe what is happening
    to your firewall. Keep a careful eye on them.


    +   * You can effectively test your firewall with the nmap program. Please see
    the section "Using nmap" in Chapter 12 for more information.


    +   * The tripwire program can tell you which files and directories have changed
    or been modified. Please see the section "Using tripwire" in Chapter 12 for more
    information.


    +   * You can check your user passwords regularly with the crack system. Please
    see the section "Using crack" in Chapter 12 for more information.


    # Know your enemies


    There is a great deal of media hype about computer and network break-ins. The
    problem that you face, now that you are immediately concerned with such issues,
    is making intelligent decisions about who and what the threats are.


    Probably the best place to start is in a neutral position. Don''t view the threat
    as either overwhelming or trivial. Many of the crackers out there do not have
    an intimate understanding of computers and the Internet protocols. They are referred
    to as kiddcriptors and scriptkiddies because they use of readily available scripts
    and cracking tools.'
  merge: -1
  img_proc: true
- pgno: 386
  md: '# Chapter 11: Building a Firewall


    # 357


    On the other hand, there are enough smart crackers out there to worry about. There
    are both individuals and organized groups that make their living that way. The
    professionals have'' varying degrees of ability, of course, but they all should
    be treated as significant threats.


    Whatever direction you are being attacked from, you can do a lot to protect yourself.
    The firewall you described in this chapter is the essential cornerstone. Once
    it''s in place, you need to actively monitor and manage it to assure that you
    present your best defense.


    # Know your tools and methods


    There are numerous tools available to the unscrupulous cracker. One of them -
    nmap — is described in the section "Using nmap" in Chapter 12. You can investigate
    other tools by searching the Net.


    There are also numerous methods for attacking systems. For instance, if you can
    gather information about a system or network, then you can search the manufacturer''s
    bug and vulnerability lists. By comparing the two lists you might be to walk through
    an open door or slip through a crack. Another way is the well-known Denial of
    Service attack (DOS). By sending incorrect and incomplete packets to a computer,
    it is possible to overload the internal buffers of that computer and shut the
    service or entire computer down. No break-in occurs when the computer or network
    breaks down and all users are denied their use.


    Again, this is not intended to be a reference for security matters. It avoids
    detail on subjects such as in order to concentrate on specific solutions. Please
    refer to the URLs listed in the section "Education is Your Firewall Tool" to study
    this issue further.


    # Monitoring your log files


    Your log files are often your best way of knowing what is happening, and has happened,
    to your system. They record system information about users and system processes.
    You can keep track of user logins and failures, modem/PPP connections to the Internet
    and many other functions.


    There are many flags that you should keep an eye out for. Some of the most important
    are failed logins, logins at odd hours (that don''t fit your user''s general profiles),
    logs from unrecognized machines, etc. Keep a close look at Super User (root) log
    ins. Limit the distribution of the root account password to yourself and one or
    two other people. Do not write the password. In that way, it is possible to know
    when an unauthorized login has occurred. The last command list user logins. The
    last log shows the last login for each of the users.


    Keep an eye out for unusual /var/log/messages system information. The system logs
    much of its information to that file.


    Other logs of interest are secure, xfer.log and the samba log. The log records
    incoming connections to the Linux servers (Telnet, imap, etc.). The xfer.log keeps
    track of data transfers from the Linux computer. The samba logs keep track of
    external Samba connections.'
  merge: -1
  img_proc: true
- pgno: 387
  md: '# Troubleshooting


    The two most difficult systems to install and maintain are the iptables filtering
    firewall and the DNS server. Some basic troubleshooting hints and techniques are
    described in this section. The other systems discussed in this chapter deal with
    the monitoring and maintenance of the above services and are not difficult to
    set up or.


    # IP chains


    Setting up IP chains can be a confusing task at first. It''s difficult to understand
    which packets are going where and through which interface. It is also hard to
    keep track of how the source and destination addresses – and port numbers – interact
    with the filtering rules.


    When designing new rules or modifying existing ones, it is best to write out the
    rules on a piece of paper in order to get a better understanding of them. Make
    diagrams and lists for each direction: outgoing packets, incoming, and forwarding-(if
    you continue to use a simple network with a single Linux gateway, the only forwarding
    rule that you''re ever likely to need is the masquerading one.)


    Once you have placed the new rules, or are trying to better understand existing
    ones, the dctrl dial connection GUI provides a display of open TCP and UDP network
    connections. The source, destination and port information is shown. You can see
    new connections and open and old ones. It is quite useful for seeing what is going
    on your PPP connection.


    The tcpdump is a packet sniffer. It comes as part of the Red Hat distribution
    and you can install it by logging in as root and using the command rpm -iv /cdrom/RedHat/RPMS/tcpdump*.
    This is a powerful tool because you can see every network packet that goes through
    your PPP connection.(You can also see every packet that goes by any network connection
    on your machine. This is one of the commonly used tools for sniffing information
    off a network. With experience and patience, you can discover passwords and other
    vital information. Beware) If you are problems getting a filter to work, then
    you can watch what packets are showing up at your PPP interface. With some work
    it is possible to release those packets back to your rule set and hopefully find
    the errant filtering rule.


    Finally, you can try backing off your filtering rules. Define a rule that sets
    your default deny policies – as done in this book''s ipchains scripts – then set
    up input and output rules in each direction that allow all packets. For instance,
    the following rules:


    ```

    ipchains -F

    iptchains -P output DENY

    iptchains -P input DENY

    iptchains -P forward DENY

    iptchains -A output -j ACCEPT -s 0.0.0.0/0 -d 0.0.0.0/0

    iptchains -A input -j ACCEPT -s 0.0.0.0/0 -d 0.0.0.0/0

    ```'
