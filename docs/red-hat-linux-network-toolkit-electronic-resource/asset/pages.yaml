- pgno: 125
  md: '# # Taking a look at the Linux File System Standard


    The Linux community is working to standardize the Linux file system. Several Linux
    distributors – Red Hat and Caldera in particular – do a good job of following
    the Linux File System Standard (FSSTND). Because of evolving manufacturer standards
    and the marketplace, you can always find exceptions, but the FSSTND actually takes
    that into account and is a work in progress itself. To find more information about
    the FSSTND, go to the following URL:


    http://www.pathname.com/fhs/


    One essential FSSTND requirement is that the /usr directory must remain read-only.
    Thus, it can be mounted from a CD-ROM or a remotely networked disk (for example,
    NFS or Samba). This capability is important for both small and large organizations
    that want to minimize costs. One server can share its /usr directory with many
    clients, which in turn require smaller (or no) disks. A read-only /usr directory
    also means lower administration costs, because you cannot clutter and rearrange
    things. If you follow the standard and mount your own /usr directory as read-only,
    you have to put your own stuff in places where it belongs. Thus, this standard
    has added the benefit of minimizing your confusion – no small gain.


    By following the FSSTND, Linux vendors do themselves a big favor. In nascent state,
    Linux needs to be uniform as to gain momentum and acceptance in the business community.
    The more established FSSTND becomes, the more everyone will benefit.


    Under the FSSTND, some of the more important directories contain the following
    functions:


    +   * the /etc directory contains local configuration files. Files that describe
    the network, and other standard configurations, all go here. You should not put
    any binary or executable files in /etc.

    * the /etc/x11 directory contains the X11 configuration file.

    * the /etc/shell directory contains the basic configuration files for new directories.

    * the /lib directory gets all the library files needed by the programs in /bin
    and /sbin. Library files contain common functions and data – such as fonts – that
    many programs use dynamically. When you run a program, the program dynamically
    links to the necessary libraries.

    * the /sbin directory contains the programs needed to boot the system in addition
    to those in /bin and should only be executable by root.

    * the /var directory is for variable stuff. Because /var is supposed to be read-only,
    you use /var for storing files that change constantly, such as printer spool and
    system logging files. It has numerous subdirectories that I don''t describe in
    detail but for reference:'
  merge: -1
  img_proc: true
