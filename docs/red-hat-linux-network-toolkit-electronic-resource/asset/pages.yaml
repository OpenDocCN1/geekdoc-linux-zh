    \ Its core is contained in the XFree86 package. It has matured since the middle\
    \ 1990s into a robust and powerful system.\n\n![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_170_0.png)\n\
    \nYou can access more information about XFree86 via the Web at  http://www.xfree86.org.\n\
    \n# # The X Server\n\nThe X Server is the interface between Linux and SVGA – that\
    \ works with any system, or special-ized ones that take advantage of one system\
    \ or another – S3, for example. Several configuration packages come with Linux\
    \ to assist you with configuring the X Window system on your computer.\n\n# #\
    \ Configuring the X Window system with Xconfigurator\n\nThe Red Hat distribution\
    \ now includes the Xconfigurator system. It simplifies the difficult task of configuring\
