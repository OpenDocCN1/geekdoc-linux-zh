- pgno: 97
  md: 'If you have an unusual netmask – which you shouldn''t – enter the following
    command:


    ```

    ifconfig eth0 192.168.1.254 netmask 255.255.255.252

    ```


    Enter ifconfig and you should see your network adapter displayed correctly. If
    it is not, examine the manual page on ifconfig. You display this manual page by
    entering the following command and then pressing Enter:


    ```

    man ifconfig

    ```


    You can page through the document by pressing Return to go line by line, the spacebar
    to go forward a page at a time, Ctrl+b to page backward, or q to quit. It shows
    a great deal of information on how ifconfig works.


    If you are still having problems, look at the Linux startup information by running
    the following command:


    ```

    dmesg

    ```


    You will see the information that was displayed during the boot process. For your
    Ethernet NIC, which should appear after the “Adding Swap” line as shown below.


    ```

    Free unused kernel memory: 60k freed

    Adding Swap: 13651 swap-space (priority -1)

    Eth0: 3c509 at 0x310 tag1, BNC port, address ... aa,IRO 11.

    3c509.c:1.116 (2.2) 2/3/98 becker@cesdis.gsfc.nasa.gov

    ```


    If you do not see your Ethernet adapter, then you might have a hardware problem.
    Check your adapter. Reseat it (take it out and put it back in) and see if it works.
    If not, you probably need a new NIC.


    If you see the NIC, then look inside the Linux kernel and see which devices it
    has. Enter the command to change to a special directory called /proc where process
    is located:


    ```

    cat /proc/devices

    ```


    You will see a line with your network adapter listed. If not, then Linux does
    not know that it exists. If the NIC is Plug ''n Play (PnP) compatible, that is
    often the problem. Linux frequently has problems working with PnP NICs. It is
    best to turn PnP off. Run the following program to see if you have a PnP NIC.


    ```

    pnpprobe

    ```'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Chapter 3: Troubleshooting


    If you see that your Ethernet NIC is PnP, then you can use the isapnp program
    to reconfigure it. It is a difficult program to use and I prefer to use the configuration
    program comes with the NIC. In my case I run 3c5x9cfg.exe, which runs under DOS
    for my 3Com 3c509 NIC. Use your NICs configuration program and turn off PnP.


    Try to run your Ethernet NIC again. If it still does not run then you need to
    find out more information about it. You might have an interrupt or address conflict.
    Look at the list of interrupts and then the IO addresses of all the devices that
    the kernel knows about by entering the following commands:


    ```

    cat /proc/interrupts

    cat /proc/ioports

    ```


    The IO address is the actual location in memory where the device – such as the
    network adapter – is accessed by the microprocessor (that is, your Pentium or
    486 chip). The interrupt is a way that the microprocessor is stopped – from whatever
    it is doing in order to process information that has arrived at the device that
    is sending the interrupt. Thus, when I stop to save this text, my Windows computer
    sends this new information to my Linux server. The Ethernet adapter sends packets
    containing this text and the Ethernet adapter on the Linux side collects a bunch
    of packets and then sends an interrupt to the processor. Linux picks up on what
    is happening and directs the information to Samba, which takes care of saving
    the data in the correct file. But I discuss the details of that process more thoroughly
    in Chapters 6 and 7.


    Listing 3-2 shows both the interrupts and the IO addresses.


    # Listing 3-2: Linux interrupts listed


    ```

    [root@chivas /proc]# cat /proc/interrupts

    0: 378425 timer

    1: 1120 keyboard

    2: 0 cascade

    10: 16077 3c509

    13: 1 math error

    14: 63652+ ide0

    ```


    ```

    [root@chivas /proc]# cat /proc/ioports

    0000-001f : dmal

    0020-003f : pic1

    0040-005f : timer

    0060-006f : keyboard

    0080-009f : dma page reg

    00a0-00bf : pic2

    00c0-00df : dma2

    00f0-00ff : npu

    01f0-01f7 : ide0

    0300-030f : 3c509

    ```'
