- pgno: 176
  md: '# Chapter 5: Configuring Red Hat Linux 147


    | Utility | Name | Function |

    | --- | --- | --- |

    | Control Panel | Printer Configuration | Configures local, remote, and Samba
    printers |

    | Control Panel | Network Configuration | Configures network functions |

    | Control Panel | Modem Configuration | Creates a soft link to a modem |

    | Control Panel | Kernel Daemon Configuration | Manually loads and unloads modules
    into the kernel |

    | Control Panel | System Configuration | Starts LinuxConf |

    | Control Panel | Package Management | Adds and deletes RPM packages |

    | LinuxConf | Network management | Configures network functions |

    | LinuxConf | User management | Adds, deletes, and modifies user accounts |

    | LinuxConf | File System management | Manages Linux, NFS, and swap file systems
    |

    | LinuxConf | Boot Mode | Configures LILO |

    | LinuxConf | Control panel | Manages system functions such as shutdown |

    | LinuxConf | Control files | Configures system and application configuration
    files |

    | LinuxConf | Logs | Manages various system and log files |


    # Using the control panel


    The Control Panel gives you a common graphical interface for performing basic
    system administration tasks. It handles package management, kernel daemon configuration,
    network configuration, printer configuration, user management, and many other
    tasks. In short, it handles everything you have done manually so far.


    The Control Panel is an X application and can be accessed from several directions.
    You can start it from a command line, from the GNOME desktop, or from a remote
    X Window system machine. I''ll just mention that if you set the DISPLAY environment
    variable to point to your remote X Window system''s display (that is, DISPLAY=your_ip:1.0),
    you can interact with it as if you were sitting at the Linux box''s console.


    To run the Control Panel from a command line, first start the X Window system
    and open a shell window. Enter the following command and use the root password
    when prompted for:


    ```

    su -c control-panel

    ```'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'Alternatively, you can open a shell window and enter the following command

    along with the root password prompted for it:


    ```

    SU

    DISPLAY=:0 control-panel &

    ```


    Finally, and most conveniently, you can simply position the mouse cursor on any

    part of the Desktop and click the left mouse button. You''ll see a generic fwm95

    menu, and if you click the Utilities submenu, you''ll see the Control Panel option.

    Click it and you should get the main Control Panel window shown in Figure 5-5.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_177_0.png)


    Figure 5-5: The Control Panel window


    To select an option, click the module button that you wish to use. Note that if

    you position the mouse pointer over a button a short description appears.


    # PACKAGE MANAGEMENT


    Click the Package Management button and you get its window. It is a graphical

    method for doing the same package management that you have just done with RPM.

    I suggest you retry some of the same examples described earlier to get a feel
    for it. In

    some cases, such as dealing with a lot of similar packages, a graphical tool like
    this

    one is superior to a simple text-based one. It generally boils down to personal
    taste.


    # KERNEL DAEMON CONFIGURATION


    Red Hat includes a process called kerneld that dynamically loads kernel modules

    when application software calls for it. For example, when you fire up the dial

    program in Chapter 8 to establish an Internet connection, kerneld automatically

    loads the SLIP and PPP modules that dial depends on.'
