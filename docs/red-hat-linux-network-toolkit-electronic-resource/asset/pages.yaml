- pgno: 24
  md: '# Introduction


    I want to introduce you to the power of Linux. Linux is an operating system that
    was designed to work just like UNIX. It was written from scratch, however, and
    doesn''t share any copyrights with UNIX. Therefore, it does not require any licensing
    and can be distributed for no or little cost. Red Hat Linux is Linux plus a bunch
    of extras - this is called a Linux distribution. Red Hat, Inc, has added value
    to Linux in the form of extra tools and an installation system all bundled together.


    Linux is an operating system that can act as a platform for most if not all of
    your computing needs. You can use it as a file and print server for your Windows
    computers. You can use it as your Internet gateway and firewall. Linux also works
    as a platform for your personal workstation. You can get Linux off the Internet
    for free, get it with a book or purchase it preloaded on a CD-ROM for a few dollars.
    It is a powerful system that is only limited by your imagination.


    # Computers Inherit the Earth – Sort Of


    In the beginning of time – way back in the early 1980s – PCs computers were expensive
    devices. Cumbersome and slow, they had little use beyond simple word processing
    and games. Sophisticated applications such as data bases quickly became available
    and But the PCs industry proliferated in the workplace, soon reached a critical
    mass and prices started dropping rapidly.


    Today, the notion of PCs becoming ever powerful while dropping in price is considered
    a law of the same level with Adam Smith’s law of supply and demand. Adam Smith?
    Moore’s Law (the cofounder of Intel who predicted that the power of microprocessors
    would double every 18 months while the price would be cut in half during the same
    interval) rules my life. The fact that a Pentium costing $1,000 today outperforms
    a million-dollar mainframe of the recent past is almost a yawn.


    After PCs have been around for a while someone figured how to interconnect them
    into networks of networks. The genius of interconnecting the world’s networks
    – in the form of the Internet – has changed the world. Now, PCs are used by all
    sorts of people in ever expanding and creative ways.


    But computer prices have fluctuated and internetworking has skyrocketed, the middle
    ground of plain-vanilla networks has remained, at best, moderately expensive.
    Compared to the cost of a standalone computer or Internet access, the cost of
    a simple network remains relatively high. The complexity of setting up and administering
    a simple network typically pushes this cost well beyond the sum of the prices
    of the individual components.


    Budget-minded businesses and individuals that need to have a small to moderate
    number of computers work together in a network have not prospered in the same
    way individuals or large organizations have. The big shops can afford proprietary
    sys-'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# xxiv Introduction


    ems that offer economics of scale, and individuals just need a modem to get to
    the Internet. Those who are in-between need to struggle with the cost and complexity
    of Windows NT, Novell Netware or proprietary UNIX in order to have a small network.


    Well, all as the balance of computing power has shifted with the invention of
    two amazing products. Linux is a UNIX-like clone developed by Lin Torvalds and
    a number of individuals. unwittingly looking to take over the world. Samba was
    designed by Andrew Tridell and adds file and print sharing among Linux to Microsoft
    Windows-based computers. Together, Linux and Samba provide the framework for creating
    and managing powerful, robust networks. You no longer need to purchase Windows
    NT or Novell Network for your computers to work together, because the folks who
    developed Linux and Samba have offered their work to anyone who wants to use it.
    All is all free!


    Although I provide in-depth coverage of these products, they are, and of themselves,
    merely interesting devices. The other piece of the puzzle is the amorphous profession
    of systems administration. After you get your Linux-Samba working, you have to
    manage it effectively. In addition to helping you set up your Linux-Samba network,
    I lay out a framework for mastering systems administration so that you can create
    and manage an inexpensive, professional system.


    # The Client-Server Model


    As the first step to setting up and managing a network with Linux and Samba you
    need to understand the Client-Server model. This model forms the basis for the
    networks that I help you build in this book. I think it is wise to understand
    the basis for the networks that we will build. Figure 1 shows the Client-Server
    model, which defines the way that computers and computer software interact with
    each other. Simply put, a service is provided to a client. In practical terms,
    one or more computers provide their resources to one or more client computers.
    In this way, resources and work are economized.


    How does this happen? How does this help you to economize your resources and work?
    In a small business, you may have several PCs. Each PC has its own resources such
    as disk drives, CD-ROMs, and maybe a few printers. When you back up your disks,
    you might use floppies, a dedicated tape drive, or a portable Zip drive. To print,
    you use any of several printers. Figure 2 shows such a system. Well, this configuration
    suffers from a lot of nasty duplication of resources and purchase orders, to say
    nothing of confusion—for example, did I back up the right computer last night?
    however, one printer, one tape drive, and one fairly large disk can reasonably
    serve a few PCs. Figure 3 shows this new client-server configuration. It helps
    to minimize your money and time. Why make a backup of each machine when you can
    do one backup and go home early? Hey, that''s the sign of a good systems administration—okay,
    a great administrator, but it''s worth a try.'
  merge: -1
  img_proc: true
