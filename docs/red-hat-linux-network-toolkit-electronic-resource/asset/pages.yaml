- pgno: 320
  md: '# Chapter 9: Introducing Systems Administration 291


    +   - Vigilance. You must perform boring tasks reliably and consistently.


    +   - Network. You should view your network separately from the individual machines.
    Computers and devices will be added to and deleted from your network and you need
    to know what and where they are.


    +   - User accounts. Users will be added to and deleted from both your server(s)
    and the client machines. You need to know who is on your system.


    +   - Hardware. Computers and other devices will be added to and deleted from
    your system. Sub-components will be added to and deleted from individual computers
    and devices. You must know what you have and where everything is.


    +   - Software. System and application software will be added to deleted from
    your system. You need to know what you have and where it is located. This is es
    important for keeping track of software licenses because the lack of a license
    can have severe legal ramifications


    Part of your job, as an administrator, is to do boring jobs consistently and reliably.
    This means checking things like the log of Super User (root) logs - users changing
    into root - and your firewall logs on a daily basis, including weekends. Backups
    also come under this heading.


    It''s hard to do something a million times when nothing ever happens. But something
    may happen on the one-million-and-first-time, and you want to know when it does.


    The best advice I can give is to just do it. It becomes habit after a time and
    it is worth it in the long run. Plus, when something does happen, it can become
    very in-teresting and challenging.


    It also helps to have a small notebook with lists of tasks and logs of those tasks.
    Lists of daily, weekly, and monthly tasks should be included.


    The following list offers examples of tasks that recur on a daily basis, showing
    the time, the job, and a description of each task:


    +   - 08:00. tail -100 /usr/adm/slog. Check root logins for possible security
    violations.


    +   - 08:00. tail -100 /usr/adm/syslog |. Check system log for problems.


    +   - 08:00. tail -100 /usr/adm/messages |. Check system messages for problems.


    +   - 08:00. mail root. Check root''s mail for tripwire (file integrity) early
    morning check.


    +   - 04:00. mail root. Check root''s mail for general messages.


    It is impossible to account for every task, or even most of the tasks that occur
    daily, but the idea is to account for as many as you can.'
