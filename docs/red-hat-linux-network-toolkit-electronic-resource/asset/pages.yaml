- pgno: 426
  md: '# Providing web services


    If you want to provide a Web Server to the world, then I advise that you pay some-one
    to do so. The reasons are as follows:


    +   - You do not want to sacrifice your scarce Internet connection bandwidth to
    this purpose. If you have a puny PPP/modem connection, you''ll immediately clog
    it up if you allow HTTP packets down your pipe. Even with higher speed connections,
    why sacrifice your own speed?

    - You have extra security concerns when you allow HTTP packets into your network.
    Security measures are built into the protocol. CGI-bin is designed to isolate
    interactive services from passive ones (that is, straight browsing versus interactive).
    But you still have to add IP filtering rules and configure your own HTTP system.
    Therefore, in my opinion, it is easiest in most cases if your ISP run your Web
    server.

    - Web serving is a huge and rapidly developing field. It will be time-consuming
    at best and better left to the professional to develop and manage.


    The solution is to have your ISP act as your Web server. Most ISPs are set up
    to do that and would love to do it. You never clog your Internet connection with
    that traffic and don''t have to worry about configuring extra security.


    # Reviewing your Server


    You have it. You''ve got yourself a minimalist Firewall Server. It has just enough
    resources to perform its function. As a result, it has fewer temptations for burglars,
    too.


    > I chose not to run Windows on the Firewall Server. If you have installed it
    on your Firewall Server, remove it with the RPM package. It takes away resources
    such as memory and disk space and is not needed. Remember that this is a simple
    machine and I like to run everything on it from a command line. You also save
    a valuable serial port by not having a mouse—that becomes important if you use
    a separate phone line for incoming communications and need the second serial port
    for modem. Use the RPM query command to see how many X-related packages are installed
    and then remove them with the RPM delete command.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_426_0.png)'
  merge: -1
  img_proc: true
- pgno: 427
  md: '# Listing the functions of the File Server/Router and

    Firewall


    Table 12-2 lists the functions that the two servers (Firewall and File Server/Router)

    should perform.


    # TABLE 12-2 FUNCTIONS OF THE SERVERS


    | Function | Computer |

    | --- | --- |

    | File Server | chivas |

    | Print Server | chivas |

    | Router | chivas (if you use a bastion host) |

    | nmap | chivas |

    | tripwire | chivas, atlas |

    | crack | chivas |

    | IP masquerading | atlas, (chivas in the case of a DMZ based firewall) |

    | PPP/dial | als |

    | IP Filtering | atlas, Linux workstations, (chivas in the case of a DMZ based
    firewall) |

    | Secure Shell | chivas, atlas, Linux workstations |

    | Dial-Up | atlas (optional) |


    # Educating Yourself


    The systems and methods described in this chapter provide a good starting point
    for

    securing your network. Security is a complex and ever-changing subject and you

    cannot remain static. Ultimately, your best defense is your own skill as a systems

    administrator.

    The Following URLs provide information that will be useful to educating yourself.


    The Computer Emergency Response Team (CERT) web page at www.cert.org


    +   * http://www.cis.ohio-state.edu/text/faq/usenet/computer-security/top.html

    * http://olympus.cs.ucdavis.edu/'
  merge: -1
  img_proc: true
- pgno: 428
  md: '# Chapter 12: Securing your Server 399


    +   * http://www.cs.pdx.edu/~mchugh/cs510sc.html

    * http://www.cs.ums1.edu/~sanjiv/security.html

    * http://www2.pitt.edu/HOME/Security.old/

    * http://www.insecure.org (one of my favorites and also one of the best!)


    Check out the following newsgroups:


    +   * comp.linux.security

    * comp.firewalls


    If you can find a college course on Internet or computer security, then that is
    certainly worthwhile. There are conferences that are very good at disseminating
    a great deal of information in a short time. Look up the schedules at www.sans.org
    and www.usenix.org to find very good tutorials on the subject.


    # Where to Go Next


    UNIX in the form of Linux is no longer available only to a select few. The open
    nature of Linux has created a huge base of developers who aspire to create high-quality,
    functional software. The flow of ideas and tools has created an immensely creative
    environment. Thus, Linux and its associated applications and utilities — is as
    high quality and useful product as anything else out there. No other operating
    system is available as easily obtained and used yet so powerful. The fact that
    it is essentially free makes it much better.


    Every one organization can now afford to have modern and productive networks.
    There means there is, and we will be, that much more need for people with the
    skills and knowledge to manage these systems. Systems administrators need more
    systematic education.


    With time, I hope and expect that more college level Systems and Network Administration/Engineering
    courses will appear. There will be a point where the discipline is recognized
    as an important and distinct field of study and degree programs will be offered.
    This is necessary because the demand for systems people is expanding fast and
    this discipline needs to be taught in a systematic manner.


    The time for ad hoc education is ending. My education is an electrical engineer.
    I share with my colleagues a common background. That educational background gave
    me a solid foundation which to start my career. When I'
  merge: -1
  img_proc: true
- pgno: 429
  md: 'graduated, I knew the basics of my profession and more important how to learn
    the tasks presented to me. I also recognized what I didn''t know and could better
    judge how to avoid potential hazards and thus grow professionally.


    We will all benefit when our profession is acknowledged and treated like any other
    engineering or technical specialty.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_429_0.png)


    Red Hat has recently proposed a certification program for training consultants
    and organizations in Linux, the Internet, and PC hardware. You can find out more
    about it at http://www.interweft.com/au/redhat/.


    # Summary


    In this chapter, I describe how to add both active and passive security measures
    for the "real-world" Linux client-server network that I first introduced in Chapter
    10. I cover the following topics in this chapter:


    +   * Adding security monitoring systems to the Linux file and print server.


    +   * It is best not to look for a silver-bullet security system. Any given system
    will have weaknesses and limitations. It is best to create layers of defenses.


    +   * When you are creating a layered defense, it is best to use both active and
    passive systems.


    +   * tripwire is a system that enables you to detect changes in system files
    that might mean an attempt to compromise your security.


    +   * crack is a system that checks passwords for vulnerabilities.


    +   * nmap is a TCP/UDP port scanning tool. It will tell you what services are
    available on the computers on your network. It will also tell you what operating
    systems are being used. You can also use it to test your firewall. It is a very
    powerful program and should be used with care.


    +   * ipchains system allows you to create excellent firewalls. You can use the
    scripts provided in this book and the IDG supplemental CD-ROM to create both Internet
    and host-based firewalls.


    +   * Adding a serial cable between your File Server/Router and Firewall Server
    provides a safe, easily way to remotely communicate with your Firewall Server
    from your private network. Your Firewall Server does not run Telnet or login for
    security reasons, so without the serial connection, you would have to work from
    the console.'
