- pgno: 10
  md: '# Preface


    Linux is, needless to say, a powerful tool. Networking and the Internet are also
    powerful tools. But they become extraordinarily powerful and useful when you know
    how to use them.


    Red Hat Linux Network Toolkit shows how to use Linux as the basis of your private
    network that is connected to the Internet. This book starts by describing how
    to install Red Hat Linux on a PC and then construct a simple, two-computer network.
    This basic network is used to construct more complex networks later on. Simple
    examples are followed by more complex ones so that you can get started as quickly
    as possible before moving onto more advanced material. The elements (workstations
    and servers) of the example networks have names and addresses that are used consistently
    throughout the book. By the time you complete this book, you should have your
    own fully functioning Linux network!


    This book is intended to help you design, install and manage a Linux based network.
    The Linux computer or Windows computers can be used to serve a combined network
    of Linux and Microsoft Windows (you can use Macintosh or UNIX workstations too
    but the instructions are not oriented to them). The Linux computers also be used
    as workstations themselves. The book also shows how to safely connect computers
    or the network to the Internet.


    # Who Read This Book


    This book shows how to create inexpensive, powerful networks of computers and
    manage them effectively. Those of you who are experienced with Linux computers
    should also be able to find useful information in this book. But my primary desire
    is to provide a basic tool especially for those folks who don''t have access to
    many resources.


    The instructions are oriented to the person with some Microsoft Windows experience.
    No Linux or UNIX experience is required, although it is helpful. This book is
    intended as a tutorial and not a reference. If you do not have any Linux or UNIX
    experience then I recommend using one of the several good Linux reference books
    to augment my descriptions (They are listed in chapter 3.)


    If you are an experienced user of UNIX, you should be familiar with the general
    concepts and recognize the workings of Linux. You should be able to skip many
    sections where I gave detailed instructions for installation or administration
    tasks. The Linux operating system is based on the Berkeley standard. Like all
    flavors of UNIX, it has evolved to a hybrid of System V and Berkeley.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# How This Book Is Organized


    This book is organized to help you construct your computer network quickly and
    efficiently. You may read it from cover to cover, or focus on those parts that
    interest you or your needs. I present information in this book in the same way
    as I try to learn a new system; read a brief description, try a simple example,
    read more of the details, try a more complex example, and so on. I offer relatively
    brief instructions on how to set up software that is described elsewhere—for example,
    Microsoft Windows and Linux. Many good books cover those topics, and I want to
    concentrate on the overall construction of a working network. The chapter are
    as follows:


    +   - The introduction describes a bit of my own history as a computer and network
    administrator. It''s included because my experience parallels that of a lot of
    people who find themselves the de facto administrator. It also introduces the
    Linux operating system and the client-server model, which is the basis for the
    networks described in this book.


    +   - Chapter 1 describes how to install the Red Hat Linux operating system. It
    describes the step-by-step process in detail.


    +   - Chapter 2 presents a simple example of a client-server network that you
    can quickly set up. This chapter describes the simplest client-server configuration,
    in which one computer acts as a file and print server to another computer. It
    uses the Linux computer as the server and a Windows computer as a network.


    +   - Chapter 3 introduces the concept of troubleshooting. You solve an example
    by using the Microsoft Troubleshooting. I introduce the basic tools for troubleshooting
    Linux and Samba.


    +   - Chapter 4 goes into some detail about how Linux and Samba work. This chapter
    describes the concept and the organization of Linux and Samba.


    +   - Chapter 5 shows how to configure a Red Hat Linux computer. It introduces
    some administration commands. It also shows how to use the graphical configuration
    tools such as LinuxConf.


    +   - Chapter 6 shows how to use and configure Samba. It uses several Samba examples
    to describe its use.


    +   - Chapter 7 describes how to connect your local (private) network to the Internet.
    Several methods are described including the automatic dial system.


    +   - Chapter 8 explains how to construct network services such as DNS, NFS, NIS
    and email. These services provide powerful capabilities to your network.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Preface


    +   - Chapter 9 introduces the essential issues of systems administration:

    managing the computers, networks, people, and security.


    +   - Chapter 10 introduces the Arkeia automated network backup system. Once your
    network grows into more than a couple of computers, backing up it becomes a major
    job. Arkeia allows you to backup one or more computers to a central server. (Note:
    Arkeia is included on the second CD-ROM.)


    +   - Chapter 11 describes how to protect your network when it''s connected to
    the Internet. Firewalls and IP-masquerading are introduced. Specific instructions
    are given for constructing IP filtering and masquerading firewalls (sample scripts
    are included on the companion CD-ROM).


    +   - Chapter 12 discusses how to further secure your network. Tools and methods
    are described that will help you provide more security.


    +   - The appendices describe the ubiquitous vi editor and a simple DHCP server.
    A DHCP server automatically and dynamically distributes IP addresses to workstations
    on a network.


    +   - There are two virtual chapters included on the second CD-ROM. They are included
    to provide further background and help without increasing the size, and thus price,
    of the book. One gives a brief history of Linux and UNIX. The other describes
    how and where to find additional help.


    # Terms and Definitions


    I should define some terms, to avoid confusion. The term Linux can mean two things.
    First, it refers to the core operating system or kernel; the program like DOS
    that runs the computer. However, it also describes the entire system, including
    the Linux kernel, the file system and all the libraries, programs, and shell scripts
    and macros that start everything when you power up the computer. Basically, the
    term Linux refers to everything off of the CD-ROM that you configure your computer.
    Generally, I distinguish between the two by referring to the kernel as Linux and
    the distribution as either the Linux distribution or RedHat.


    Samba is a system that allows your Microsoft Windows or DOS (Linux too!) programs
    to talk to your Linux server. Samba allows a Linux server to "speak" the SMB protocol
    that Microsoft Windows understands. Think of Samba as the glue that holds everything
    together. I describe the mechanisms of Samba in more detail later in the book,
    but basically, Windows expects certain things to happen in certain ways and at
    certain times on the network in order to see things like files and printers on
    other computers. Until now, manufacturers such as Novell, Sun Microsystems, Intergraphics,
    and have provided the software to do this – a price. Now, with Linux and Samba
    you don''t need them.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'When I refer to the DOS disk I am referring to a FAT formatted disk. This is
    the traditional method. There are also newer methods such as VFAT for Windows95
    and NTFS for Windows NT. I refer to the newer formats by name.


    # Conventions


    I use several typographic conventions to identify particular types of information
    presented in this book:


    +   * DOS commands that you are to execute are distinguished within normal text
    with bold, uppercase font (i.e., run DIR). Bold, italicized font is used for their
    parameters (i.e., run FDISK /MBR).

    * Linux commands that you are to execute are distinguished within normal text
    with bold, lowercase font (i.e., run ifconfig) and bold, italicized font for their
    parameters (i.e., run ifconfig eth0).

    * Monospaced text is used to distinguish Linux filenames, commands, command parameters
    and from normal text.


    # Icons


    There are three types of Icons used in this book. They are used to introduce information
    about special subjects with the general flow of the book. They are:


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_13_0.png)


    Helpful hints for how to perform a task more efficiently, or special things to
    know about a particular topic of discussion.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_13_1.png)


    These inform you about things that might cause you problems or harm.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_13_2.png)


    General information displayed for your convenience.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# # Acknowledgments


    The amount of help that I''ve received writing this book is extraordinary. The
    writing process goes by in a blur of coffee aided 18 hours days. Those days are
    only possible with the aid of many dedicated, tireless people. Their contributions
    are:


    My wife, Lidia, whose support, advice and encouragement means everything to me.


    Laura Lewin, Matt Lusher, and Stephanie Rodriguez put together this project and
    kept it going on a day-to-day basis. Matt also helped direct me through the production
    process, which, even after four times, is still a maze to me.


    S.B. Kleinman edited every single sentence and helped me put them together in
    a coherent fashion - an amazing feat.


    Ken Hatfield tested every command and script and also made many technical suggestions.
    Every suggestion caused me to say "oh yeah, that''s good."


    All the other great people got me my first gig - the original Linux Network Toolkit
    - in the "biz".


    Milton Lau helped design most of the illustrations.


    Pat Roache gave me my first job as a UNIX (and, VAX) administrator. He also let
    me experiment with Linux way back in 1994 to see if it would work for us.'
  merge: -1
  img_proc: true
