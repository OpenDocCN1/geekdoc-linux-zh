  md: "# Using crack\n\nYour passwords are your first – and often last – line of defense.\
    \ Linux makes it difficult to choose trivial or easily guessed passwords, but\
    \ it is still important to check. The cracker library makes the checking process\
    \ a simple task to do.\n\nThe cracker program checks a file–either your /etc/passwd\
    \ or /etc/shadow file–against dictionaries of common words and phrases. It looks\
    \ at each word in the dictionary and encrypts it using the same algorithm that\
    \ the Linux passwd uses to generate the encrypted word that it generates after\
    \ you enter your plain-text password. If the encrypted word matches one found\
    \ in a passwd file, then it has found a match.\n\n+   1. Log in to chivas as root.\n\
    2. Mount the IDG supplemental CD-ROM\n   mount /mnt/cdrom\n3. Install crack by\
