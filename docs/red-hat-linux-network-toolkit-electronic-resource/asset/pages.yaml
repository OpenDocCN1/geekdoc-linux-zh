- pgno: 377
  md: '# Part IV: Managing your Network


    register with the InterNIC (the organization that distributes IP addresses) to
    obtain IP addresses for your network. It also conserves the quickly diminishing
    pool of IP addresses.


    IP masquerading also provides the advantage of hiding your Network behind a single
    address. Anyone trying to probe or attack your Private Network has to go through
    your single (and typically dynamic) address. Since IP masquerading is in one-way
    street, most (if not all) attacks on your networked computers will die on the
    wire. That is because packets originating from the outside will not get translated
    into the private network machine and, thus, never find their way to any computer.
    (Note that the only route that is configured on the Internet gateway atlas is
    the route to the PPP connection. Returning masqueraded packets get back into the
    private network via ipchains. There is no route to the Private Network for incoming,
    non-masqueraded packets.)


    The only way for a probe or attack to get a foothold is if that''s possible, the
    packets will hijack an existing connection. However, the packets will have to
    be existing connection originating from the Private Network. The packets will
    be treated as return packets and should never be able to start a new connection.
    IP masquerading has the effect of making your firewall safer without it.


    The last line in the ipfilter.rules script, in the section "Building a Working
    Filter," describes the masquerading rule for the paunchy.net. IP masquerading
    converts one IP address into another IP address. That translation permits one
    or more computers to masquerade as IP address. If that address is your dynamic,
    dial-up IP then access the Internet.


    What the rule says is any local address 192.168.1.0 (the /24 specifies a subnet
    mask of 255.255.255.0) that shows up on the Linux gateway is that the default
    route 0.0.0.0 is masqueraded. The default route is pegged to the PPP connection-ppp0
    which has a dynamic IP address given by your ISP. The source address of the packets
    destined for the Internet is changed to the dynamic IP address. For instance,
    if your PPP connection has the address 192.168.32.15 and the packets from the
    Windows box have a source address of 192.168.1.1, then the packets that get sent
    to the Internet get the source address of 192.168.32.15. The computer looks appears
    to be the rest of the world as 192.168.32.15.


    A little more happens during masquerading than just the source address translation.
    The source port gets converted to another port. Recall that the TCP/IP protocols
    use both of IP addresses and ports. Ports are used to separate communication between
    different applications. For instance, the standard Hypertext Transport Protocol
    (HTTP) uses port 80 by default. If you look at the /etc/services file, you will
    see all of the standard applications and protocols with their ports; the ports
    below 1024 are referred to as Well known ports. During masquerading, the port
    gets changed to a number above 1024. This process allows the ipchains software
    to de-masquerade the returning, masqueraded packets back to their original locations.


    When there''s a response to a masqueraded packet, the reverse translation is performed.
    The returning packets have their destination IP address converted back to'
