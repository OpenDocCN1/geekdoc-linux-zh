- pgno: 115
  md: 'The kernel performs its magic by concentrating on a few things:


    +   * Multitasking: Multiple programs can run at once.

    * Multiple users: Multiple users can use the computer at one time.

    * Virtual memory: Programs can use more memory than is available just RAM.

    * The file system: Your files are organized for you.


    # # Understanding Multitasking


    A multitasking operating system allows more than one program to run at once. Actually,
    multiple processes – or programs execute sequentially; the operating system schedules
    their execution and allocates resources to them. As long as the number of tasks
    is kept to a reasonable number and the computer is fast enough, the programs appear
    to be running simultaneously.


    Linux is a preemptive multitasking operating system. Each process is given a time
    slice – generally about 20 milliseconds (seconds) – to run within. Linux suspends
    the running process when its time slice expires and starts the next waiting process.
    Handling of time slices entails storing the environment – all information that
    a process needs to run – of the current process in memory and loading the waiting
    process''s environment from memory.


    For comparison, MS-DOS is an operating system that allows only one program to
    run at once. MS-DOS has the Terminal and Stay Resident (TSR) feature, which gives
    the appearance of multitasking, but simply runs programs when you tell it to.
    Windows 3.X offers simple multitasking that doesn’t always work. Windows 95, 98
    and NT use preemptive multitasking that.


    For multitasking to work, the kernel must coordinate the execution of all tasks.
    It also keeps track of all the details about each process that is running. However,
    the kernel does not start or stop any programs after it has been started at boot.
    The init process and the programs themselves take care of function. *Init* is
    the process that actually takes care of launching all the initial system and applications
    at boot time. The *init* process is discussed further in the section, “Understanding
    the Linux Startup Process,” later in this chapter.


    A process table lists information about each process that is currently running.
    To see a typical process table (such as the example shown in Listing 4-2), log
    in root and enter the following command:'
