    Here''s a quick rundown on the contents of the Red Hat configuration directory:


    +   * The init.d directory contains many of the rc scripts for doing a basic system
    configuration. The init.d directory contains the rc scripts that handle such basic
    tasks as configuring the name of the computer, mounting the disks, and configuring
    the network interfaces. Table 4-3 lists the scripts and functions they configure.

    * The rc script is responsible for setting up the very basic stuff such as your
    hostname on startup. Then it takes care of starting and stopping services as rc
    level change.

    * You can add your own functions to the rc.local script as you deem necessary.

    * The directories rc0.d through rc6.d contain the links to the specific scripts
    to be executed when changing to each run level. These links are ordered by their
    names to start up their respective scripts in sequence.

    * The rc.sysinit is run only when the system is booted; it starts the general
    network script and turns on the swap partition.

    * The network script in /etc/init.d/network executes scripts found in the /etc/sysconfig/network-scripts
    directory and shown in Listing 4-10. The scripts listed in Listing 4-10 perform
    the functions of rc.inetl1 – that is, setting up the network adapters and basic
    routing.


    TABLE 4–3 THE RC SCRIPT RESPONSIBILITIES


    | Script Name | Function |

    | otd | Starts the at daemon, which schedules one-time execution of commands or
    scripts. |

    | crond | Starts the crontab daemon, which schedules and executes periodic tasks.'
