- pgno: 404
  md: '# Chapter 12: Securing your Server 375


    Linux daemons, application programs, and programming libraries that the firewall
    absolutely does not need. The idea is that the fewer pieces of software exist,
    the fewer security holes you have. I have you remove stuff in the following sections,
    not because I know of any particular security hole, but because one may be lurking
    out there (or could be in the future). The idea is to start configuring your firewall
    on a "clean" machine.


    # Using Secure Shell


    The private network that is used in this book is potentially vulnerable to attack
    because all of the information traveling on it is in plain text. Anyone connected
    to the network can potentially look at the packets flying by. It is also possible
    for someone outside your private network to look at your information that travels
    out onto the Internet. This is called *packet sniffing*, and the *tcpdump* RPM
    that comes with Red Hat Linux can be used to display and log such packets. Those
    containing information such as passwords and any information that is being passed
    on the network.


    The firewall introduced in Chapter 11 is designed to allow traffic originating
    from the private network to go out to the Internet and return packets back. No
    traffic originating from the outside private network – the Internet is allowed
    back in. This creates an effective firewall but limits its use when you are not
    physically present at your network.


    One solution to both problems is to use Secure Shell. The newest version of Secure
    Shell (ssh) encrypts the information contained in the network packets, which provides
    a high degree of privacy and safety for your valuable information. If you modify
    your firewall to allow Shell packets into your network, you sacrifice a small
    amount of safety for the convenience of accessing your private network.


    # UNDER SECURE SHELL


    Secure Shell is software that allows you to communicate between two computers
    via an encrypted connection. Secure Shell also permits you to validate that the
    machine is connecting to the correct one.


    Secure Shell makes it very difficult for anyone to sniff your communication. Secure
    Shell does not send your password or general communication in plain text. Communication
    programs like Telnet send everything in readable form; it is possible to intercept
    the packets and reconstruct them to reveal passwords and other information. Secure
    Shell solves that problem.


    > > The first time you connect to a Secure Shell server, you do not have its public
    key unless you have already placed it there. You get the message "Accepting host
    chivas without checking." This means that your client machine is receiving the
    public key of the server without being able to verify that server is the correct
    server. The new key is stored in a file in the .ssh/hostkeys directory.'
  merge: -1
  img_proc: true
- pgno: 405
  md: '# Encryption methods and keys


    Secure Shell uses several encryption methods: IDEA, three-key triple-DES, DES
    or Blowfish. Discussion of these methods is beyond the scope of this book and
    you should look to the following URLs for more information:


    ```

    http://www.employees.org/-sash/ssh/faq/ssh-faq-2.html#ss2.5.2

    http://www.sunworld.com/sunworldonline/swol-02-1998/swol-02-security.html

    ```


    # Public and private keys


    Secure Shell uses the concept of public and private keys to perform authentication.
    A public key is a sequence of randomly generated numbers that is available to
    everyone. A private key is another random number that you do not share with anyone
    else. Information that it is encrypted with a public key can only be decrypted
    by the private key and vice versa. The public and private keys are totally independent
    of each other and one cannot be derived from the other. This method is RSA authentication.


    # Host authentication


    Secure Shell makes use of public and private keys to verify that all parties are
    who they claim to be. When you attempt to connect to a remote computer both the
    client and server generate random strings. The strings are exchanged in such a
    way that the combination of public and private keys proves that both the client
    and server are valid. The details of the process is interesting but beyond the
    scope of this book. Please refer to the other documents and URLs mentioned in
    this chapter, and http://www.spotch.com/-robjen/sa/ssh/sshtalk-1/s1d032.htm, especially
    slides 32 through 37.


    It is essential that both the client and server verify that they are both they
    say they are. Without verification, it is possible that a third party can pretend
    to be either the client or server, a process called spoofing. For instance: You
    you are computer A and want to connect to computer B. However, if C pretends to
    be B by using the same IP address as B, then you connect to C and send your valuable
    information to C. This is a man-in-the-middle attack.


    However, if you encrypt a random string, and send it to C, but do not get the
    same string back, then you know that the computer you are talking to has changed
    keys or is a fake. RSA authentication prevents DNS, IP, and routing spoofing.


    Secure Shell is based on a client-server model. You run a client program -- ssh2--
    to connect to a server daemon --ssh2d-- on a remote computer. Once connected,
    you can interact with the remote computer as if you were sitting at its console.'
  merge: -1
  img_proc: true
