- pgno: 108
  md: '# Conclusion


    You are now a troubleshooting expert, capable of commanding more than $100 per
    hour from your desperate customers. Okay, maybe not $100, but hopefully you have
    acquired the fundamentals of troubleshooting and a good measure of practical experience.
    I suggest that you view the simple system you have just set up as an invaluable
    laboratory. Before Linux, it was rare that an individual had the opportunity to
    work on a UNIX system without fear of destroying valuable data and hardware. In
    this Catch-22 scenario, you needed access to a UNIX system that you could configure
    if you were to learn UNIX Administration, but you had to know UNIX before you
    could gain access to a UNIX system.


    # Summary


    This chapter covers the following topics:


    +   - Troubleshooting your network. I introduce you to the concept of troubleshooting.
    You should try to identify the problem and then work your way to the solution
    by first eliminating the simple causes and then the harder ones.

    - Using the Fault Tree concept. This concept helps you to view a problem and its
    solutions in a graphical way, using a rooted tree to represent the relationship
    between a problem and its root cause.

    - Using the Microsoft Network Troubleshooter as an example Fault Tree. I convert
    the menu-based Troubleshooter into pseudocode, to show how it helps you solve
    simple networking problems.

    - Using My Troubleshooter. I use example problems resulting from setting the client-server
    network in Chapter 1 to demonstrate real-world troubleshooting.'
  merge: -1
