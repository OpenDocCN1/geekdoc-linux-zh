    +   6. Next, test your new system by making a trivial change to a system file.
    I recommend that you change a file that is changed often so that you don''t have
    to recompile the tripwire database again. The /etc/passwd file is changed whenever
    you add or delete a user, it is a good choice. (Otherwise, if you change a file
    like /bin/login, you could confuse yourself later on if you ever check it against
    the original distribution.) The touch program will modify the file timestamp without
    doing anything else (note that tripwire will not show that a file has been changed
    if you change the modification date and do not specify the modification timestamp
    -m in the tw.config file). Enter the following command:

    touch /etc/passwd


    +   7. Run the tripwire integrity check by entering the following command:

    tripwire -interactive


    +   8. tripwire shows that /etc/passwd has been modified.

    changed: crw------- root 0 Oct 22 02:09:34 1999 /dev/ttyp2

    changed: drwxr-xr-x root 333 Oct 22 02:10:22 1999 /etc

    changed: -rw-r--r-- root 589 Oct 22 02:09:53 1999/etc/passwd


    tripwire prompts you to update its database with the changed file. You have the
    option to enter y or n to update the database for file or not. You also have the
    option to update all the files in which changes have been detected by, unless
    entering y, you are sure that you are the only person to have changed anything,
    I advise against doing so. Checking each file may be a lot of work, but it is
    an important process so you should just resist yourself to it.


    +   9. Because your goal is to reliably check your current files for compromise,
    you must keep your database safe and pristine. You should not leave it on the
    machine that tripwire is to protect. The best way to store it is to copy it to
    a CD-ROM. But that is not practical for most people, so a reason-alternative is
    to copy it to the floppy, and flip the disk''s write-protect tab. Doing so enables
    you to automatically run tripwire from cron. (If you require a more secure installation
    you could store the disk in a safe place. This prevents you from automatically
    running tripwire from cron but removes the possibility of the disk being physically
    modified).'
