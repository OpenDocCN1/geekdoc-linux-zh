- pgno: 180
  md: '# Chapter 5: Configuring Red Hat Linux 151


    If you chose the Network printer option, you need to specify the Remote Host and

    Remote Queue for Linux network printers or Server Name, Printer Name, and

    Printer User if it is a printer based on LAN Manager (Samba).


    # THE NETWORK CONFIGURATOR


    The Control Panel lets you configure some aspects of your network with the Network

    Configurator. From the Control Panel, click the Modules menu option and click
    the

    Network Configuration button and you get the screen shown in Figure 5-9. It displays

    t basic information about your current setup.


