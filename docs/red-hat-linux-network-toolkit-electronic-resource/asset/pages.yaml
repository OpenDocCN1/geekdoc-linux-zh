    # Using cron


    cron is a system for scheduling and executing Linux system and tasks. When you
    start your system, the cron daemon is started and reads the system and user configuration
    files in the /etc/crontab and /var/spool/ directories. The /etc/crontab file contains
    system cron jobs reconfigured by Red Hat and can be edited by a privileged user
    (generally root). The user crontabs are limited to things the users can normally
    do—for instance, a normal user cannot schedule cron to erase another user''s files.


    This system is useful for doing system maintenance as well as anything that you
    want to do regularly. For instance, Red Hat configures the default crontab to
    rotate the log files found in the /var/log directory on a daily basis.


    ```

    SHELL=/bin/bash

    PATH=/sbin:/bin:/usr/sbin:/usr/bin

    MAILTO=root

    ```


    ```

    # run parts

    01 * * * * run parts /etc/cron.hourly

    02 1 * * * run parts /etc/cron.daily

    02 2 * * 0 run parts /etc/cron.weekly

    02 3 1 * * run parts /etc/cron.monthly

    ```


    To create, edit, list, or remove a user crontab, you simply run the crontab command
    with the appropriate option. Whoever is logged in as determines which user crontab
    is accessed. A privileged user (generally root) can use the u option to edit other
    users'' crontabs. Table 9-2 lists the user crontab editing options.


    # TABLE 9-2 THE USER CRONTAB EDITING OPTIONS


    | Option | Description |

    |---|---|

    | crontab -e | Edits your crontab (uses your default editor) |

    | crontab -l | Lists your crontab entries |

    | crontab -r | Removes (deletes) your crontab |

    | crontab -u | Edits, lists, or removes another user''s crontab |

    | username | |'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# Chapter 9: Introducing Systems Administration 301


    The crontab utility uses the vi editor (you can specify another editor by setting
    the VISUAL or EDITOR environmental variables) to edit the crontab file (see the
    instructions in Chapter 1 for the basic vi commands). For example, to edit your
    crontab - first time you do so you create it -enter the following command:


    ```

    /usr/bin/crontab -e

    ```


    > You are put into command mode immediately upon execution of this command, and
    you must enter the 1, a, or o command to start editing. After you finish editing,
    you need to press the Escape key and enter the character sequence :wq to save
    and then quit from the editor.


    Send yourself the message "Hello from Cron" simply add the following line:


    ```

    * * * * echo "Hello from Cron"

    ```


    The message will be mailed to every minute. To examine the crontab file, enter
    the command crontab -l and you''ll see the listing of your crontab as shown in
    Listing 10-5.


    ```

    # DO NOT EDIT THIS FILE - edit the master and reinstall.

    # (/tmp/crontab.1018 installed on Sat Jul 19 14:36:03 1997)

    ```


    ```

    # (Cron version) -Id: crontab.c.v 2.13 1994/01/17 03:20:37 vixie Exp $)

    * * * * echo "Hello from Cron"

    ```


    I doubt you''ll want to have such a trivial message mailed to every minute. To
    delete that example cron entry, enter the following command:


    ```

    crontab -r

    ```


    The formats of the /etc/crontab and the user crontabs differ somewhat. The two
    formats use the same time format as the file or program to execute. However, the
    /etc/crontab file includes the user name (as found in /etc/passwd) and first describes
    the time and day to run the job, then the user name to execute as, and finally
    the file name, including the directory, to execute. Table 9-3 shows the details
    of each field.'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# TABLE 9-3 THE CRONAB FORMAT FIELDS


    | Field Number | Function | Range | Notes |

    | 1 | minute | 0-59 | The asterisk (*) means every minute, hour, day, and so on
    |

    | 2 | Hour | 0-23 | |

    | 3 | day -month | 0-31 | |

    | 4 | Month | 0-12 | Or names such as jan |

    | 5 | day -week | 0-7 | 0 or 7 is Sun, or use names |

    | 6 | user name and then command or file to execute | Only for the /etc/crontab
    file |

    | 7 | command or file to execute | |


    The tasks that can be accomplished via cron extend far beyond simply cleaning
    up your /tmp directory. Any job that you want to be run regularly without having
    to manually run yourself you can cron run for you. For instance, if you want to
    have some or all of your backups run at a time of day when the system is not being
    used or is used lightly, execute the backup via cron. For example, if you have
    a 4mm DAT drive attached to an SCSI interface at /dev/rmt0 and you want to run
    a full backup of your system at 4 a.m. every Monday (Sunday = 0, Monday and so
    on), log in as root and execute the following crontab job (crontab -e):


    ```

    0 4 * * 1 /bin/tar czvf /

    ```


    At 4:00 a.m. on Monday, tar will copy all files from the root (/) directory to
    the device attached to /dev/rmt0. It will compress each file using gzip and produce
    a listing as it. The listing will be mailed to root, giving you the opportunity
    to examine the backup on Monday morning. Of course, you could use cpio or dump
    to do the same job.


    # USING SHELL SCRIPTS


    Shell scripts are generally simple text files that contain shell commands, variables,
    and conditional statements. They provide programming capability to the system
    without the complexity of compilers. However, even while lacking the sophistication
    of programming languages such as C, they are powerful enough to do much, not most,
    of your systematic, day-to-day chores.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# Chapter 9: Introducing Systems Administration 003


    One of the most common uses of shell scripts is to have cron run them. If you
    have a job that requires more than a one-line command but not complex enough to
    require subroutines, a shell script is the way to go. For instance, if you need
    to compress and transfer files from one machine to another, it is better to create
    a script to force a single command to do much.


    I summarize some of the most important functions and conditional states in Chapter
    1. In Chapter 11, I describe the script that comes configured with tripwire to
    check your file system integrity on a nightly basis—cron is used to start it every
    morning. It is a simple script but descriptive of the type of job that can be
    readily automated with a little knowledge of shell scripting.


    # SHUTTING DOWN AND STARTING LINUX


    Linux keeps a dynamic file system. If you turn off the power without having shut
    down gracefully, parts of the file system will need to be reconfigured when you
    start up again. Generally, this simply increases the time it takes to boot, but
    why risk possible problems? The file system is also buffered—that is, data to
    be written in memory before actually being written to the disk. You may lose those
    data if you simply power the computer off.


    The preferred method for shutting down a Linux system is to either use the halt/reboot
    or shutdown commands. The /sbin/shutdown command performs a systematic termination
    of user and system processes, writes the buffers to disk (sync), and informs the
    /sbin/init process to put the system into runlevel 0, 1, or 6. Runlevel 0 is a
    complete halt; runlevel 1 is a single user administrative state; and 6 reboots
    the system. Logged-on users are given a specified amount of time to log off (default
    of 1 minute). Here''s the syntax for the /sbin/shutdown command:


    ```

    shutdown [-t sec] [-rkhncf] time [warning-message]

    ```


    Table 9-4 shows the options to the shutdown command. Note that you can also reboot
    your Linux computer by entering the reboot command as root or simply pressing
    the Ctrl+Alt+Del key sequence long familiar to DOS users.


    # TABLE 9-4 THE /SBIN/SHUTDOWN COMMAND OPTIONS


    | Option | Description |

    | -t S | Wait S seconds before changing the run level. |

    | -k | Execute the other shutdown options without actually shutting down the system.
    |

    | -r | Reboot the system after shutting down. |

    | -h | Halt the system after shutting down. |


    Continued'
  merge: -1
  img_proc: true
