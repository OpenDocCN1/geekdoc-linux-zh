- pgno: 68
  md: '# Chapter 2


    # # Setting Up a Simple Network


    IN THIS CHAPTER


    +   - Wiring your network

    - Configuring your Windows computer

    - Configuring Samba

    - Getting Windows computer to work with Samba


    THIS CHAPTER SHOWS you how to construct a simple client-server network based on
    Linux, Samba, and Windows 95/98. The network consists of only two computers –
    one server and one client– yet it is a fully functional network. Figure 2-1 shows
    the topology (diagram) of the system. Think of this configuration as your basic
    building block. The more complex examples introduced later in the book build on
    this system.


    The instructions in this chapter assume that you are an experienced computer user.
    That is, you are expected to be familiar with such basic concepts as directory
    structures and the difference between an operating system and an application.
    It helps if you have installed and configured your own computer at least once;
    the more times the better. The relatively simple process (when everything goes
    as planned) of setting up Microsoft Windows helps to prepare you for the unfamiliar
    task of installing Linux.


    The process of answering installation questions and making decisions about the
    particulars of any operating system and application is basically the same matter
    what system you use. I concentrate on providing detailed instructions in this
    chapter that even without adequate experience you should be able to get this simple
    example running (however, you should expect to suffer frustration as you tackle
    new concepts and the fickleness that accompanies computers in general). After
    you set up the simple client-server network you will have the basic block necessary
    to evolve your network into a more complex, “real-world” system. Linux (and by
    default UNIX) concepts and facilities are introduced along the way.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Introducing the Simple Network


    In this simple network, the server is running the Linux operating system. The
    Samba file and printer sharing system runs as an application on top of Linux.
    The client runs Windows 95, 98 or NT. Figure 2-1 shows the diagram of the network.
    The installation or Red Hat Linux is described in this chapter. The construction
    of a simple network—including Samba— is described. Subsequent chapters describe
    constructing more networks.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_69_0.png)


    Figure 2-1: A simple client-server network


    # Installing the Network Wiring


    For this simple network to work, you must connect it. Two primary types of cables
    exist: Twisted pair and Thinnet. Twisted pair is telephone wire. Several different
    grades of cable exist, the best being Category 5. Thinnet is coaxial cable like
    that used for cable TV, although it has 50-ohm impedance versus 75 ohm.


    > The process of wiring your business or home for a network can be dangerous.
    It is best to hire a licensed electrician or other professional. But if you decide
    to do it, please follow all related building codes and common sense.


    Twisted pair is also referred to as 10baseT – 10 Mbps means 10 megabits-per-second,
    and T refers to twisted pair. You can also run a faster version of Ethernet that
    runs at 100 Mbps and requires category 5 cable. It is referred to as 100baseT
    or 100baseTX. 10baseT requires an active hub or concentrator to work. (If you
    only have two machines, you can connect them directly by using a cable with the
    trans/receive wires crossed over. This is hardly worth the effort, however, because
    hubs'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Chapter 2: Setting Up a Simple Network


    can be purchased for as little as US $40.) It offers the advantage that individual
    hosts can be connected and disconnected independent of each other. The wiring
    can be conveniently connected to phone jacks. The disadvantage is that it costs
    extra to purchase and maintain the hub, which also adds another layer of complexity.


    Thinnet is also referred to as 10Base2. Its main advantage is that it''s a passive
    system and requires no active circuitry to work; it connects to each Ethernet
    transceiver on the bus. Its main disadvantage is that it''s a guide wave or transmission
    line and must be properly terminated. That means each end of the cable must have
    a 50-ohm terminator attached to it and a proper BNC tee connector must be used
    at each Ethernet adapter. If it is not terminated or the cable is broken—either
    by disconnecting or breaking it—the entire network will not work. (Note that with
    10BaseT, the network speed of thinnet is 10Mbps.)


    I use Thinnet on my network at home and have used it professionally. In many ways,
    it is cumbersome but the passive (does not need electronic hubs) and expensive
    nature makes it ideal for learning about your client-server network. This is the
    system used in this.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_70_0.png)


    Using coaxial cables (that is, TV-type wiring) can present special problems. It
    is possible to conduct dangerous currents across these types of cables if your
    building''s grounding is not connected to a central ground. This situation occurs
    when one power circuit is grounded at one location and another circuit is grounded
    elsewhere. Please take note, if you span the two locations with a Thinnet (10Base2)
    coaxial cable, you have a conductor that bypasses the building grounds. If the
    Thinnet connects an open circuit, or a short-circuit occurs in one of the connected
    computers, or your building''s grounds are at different potentials, disaster can
    befall your computer equipment and be careful and forewarned.


    # Configuring Windows for Network Operations


    This network uses the TCP/IP protocol. TCP/IP is the protocol that holds the Internet
    together. TCP/IP is really a number of individual protocols when used together
    two computers, or twenty, or the entire world''s computers to connect and work
    together. It is truly amazing that it scales well. For now, however, your concern
    is to get two computers to work together. TCP/IP is described in more detail in
    Chapter 3.


    For the purposes of this chapter, I assume you have a PC running Windows 95 or
    98. If you don''t have Windows installed, don''t worry—its installation is a relatively
    simple process. Follow Microsoft''s instructions and in most circumstances it
    will be okay. If not, many good books can help you to set up Windows.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Part I: The Simple Client-Server Network


