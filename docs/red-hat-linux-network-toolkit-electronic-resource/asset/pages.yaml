- pgno: 216
  md: '# Chapter 6: Learning Samba Example


    # 187


    Take a moment to examine the .bashrc file. It contains a line, .etc/bashrc, that
    tells the shell to source - or put into effect - the generic .bashrc script as
    shown below.


    ```

    # /etc/bashrc

    ```


    ```

    # System wide functions and aliases

    # Environment stuff goes in /etc/profile

    ```


    ```

    # For some unknown reason bash refuses to inherit

    # PS1 in some circumstances that I can''t figure out.

    # Putting PS1 here ensures that it gets loaded every time.

    PS1="[\u\h \W]$

    ```


    The bash treats any text after a pound symbol (#) as a comment, except when the
    first line begins with the combination #!. In that case, the bash shell treats
    the following string as the command interpreter. For example, #!/bin/bash, tells
    Linux to use the bash shell to interpret the script.


    # Creating Samba Shares


    I like to learn by example, so the following sections give you some examples to
    try. The first examples require only minimal modifications to the smb.conf file.
    Subsequent examples require you to add a printer and a user or two to your Linux
    system. Even so, you don''t have to do much to your system to get some work out
    of it.


    Please be aware that the Red Hat Linux distribution that comes with this book
    supplies a Samba configuration and also starts Samba when you boot your system.
    (See Chapter 1 for Samba instructions.)The Samba configuration uses what called
    user security and is specified in the /etc/smb.conf file by the parameter security
    = user. Using this type of security requires that in order to open a Samba share,
    you must supply a Windows 95/98 login name and password that matches an existing
    Linux user name and password.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_216_0.png)


    As a system administrator, you should know how to send signals to processes. The
    Linux kill command is used to send signals to processes. The most widely used
    signals are SIGHUP (numeric value 1), which is generally used to signal a process
    to reread its configuration file, and SIGKILL (numeric value 9), which terminates
    a process.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# Part III: Expanding your Network Services


    The manual page on signals gives a complete list of Linux signals (as does the
    command kill -1). To access this man page, enter man 7 signal. (Note that nine
    divisions of man pages exist. That''s why the /usr/man directory has nine subdirectories
    --usr/man/man1 through /usr/man/man9. For example, you find the manual pages on
    user commands in /usr/man/man1.


    If you ask for a man page on a topic that exists in more than one area, the one
    with the lower number appears. That is why you need to specify the 7 in the preceding
    command -- if you simply enter man signal, you get the same manual man page as
    if you had entered man 2.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_217_0.png)


    ```

    alias smb=''/usr/bin/smbstatus''

    alias sn=''/usr/bin/nmblookup''

    alias smbstop=''/etc/rc/init.d/smb stop''

    alias smbstart=''/etc/rc/init.d/smb start''

    alias st=''/usr/bin/testpart''

    alias se=''/vi /etc/smb.conf''

    ```


    Add these aliases to /etc/bashrc,or your own file, to retain them for successive
    logins. If you change them, you can make your system recognize the change by sourcing
    the file:


    ```

    source /etc/bashrc

    ```


    Note that /etc/aliases and /etc/aliases.db are not used for command aliases. They
    are, however, used by sendmail for its own purposes.


    # Starting and stopping Samba


    As you proceed to create more complex client-server-up-to-date, you must be careful
    making sure that you keep Samba up-to-date. In the preceding example, the new
    smbd process reads the new configuration -- that happens because each new server
    gets its own daemon. However, the original smbd does not know that smb.conf has
    changed. You have two Samba daemons running with two different configurations.


    This situation can create difficulties as the number of smbd processes increases.
    Imagine five or six smbd processes running at once with new configurations. Trying
    to keep track of what becomes counterproductive -- you can end up confused and
    traveling in circles very quickly. Of course, you can manually HUP all the Samba
    daemons -- kill -HUP -- but that can be confusing and time-consuming, too.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_217_1.png)'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# Chapter 6: Learning Samba by Example


    Here''s an easier way to stay current. Because Samba daemons are a dime a dozen,
    it''s simpler just to terminate all smbd daemons and then start them again. Red
    Hat, being the value-added Linux hero, provides an easy way of doing that. It
    runs an rc script -/etc/rc/init.d/smbd-boot time to start the Samba daemons. You
    can also use this script anytime you want. Enter the follow-command (or the aliases),
    smbdstop and mbstart, which are defined in a Tip in the preceding section) to
    restart the daemon:


    ```

    killall HUP smbd nmbd

    ```


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_218_0.png)


    You may encounter irrecoverable errors if you stop and restart the Samba daemons
    while a share is accessed. In my experience, if you restart Samba while you are
    reading or writing to a Samba share, you will lose your network connection. Most
    of the time, my Microsoft applications indicate that the connection was lost and
    prompt me to either make the connection again or click the attempt to reconnect.
    I generally click the Retry button and everything returns to normal; alternately,
    I click the Cancel button, data may be saved on my local disk or lost entirely.
    However, on occasion, I received an irrecoverable error message, which led to
    my application closing and losing the data. The answer is to be careful when you
    are working with other people, make sure that you reset the daemons when you are
    sure nobody is working on the system. If there are, then ask the users to save
    their work and log out of their shares by closing any applications that are using
    the shares.


    All services that you had will not be active because they were tied to the daemon
    you terminated. They return as soon as you access them again. For example, if
    the computer chivas is opened from my Network Neighborhood, the same share becomes
    active. If the window is still open, simply choose the Refresh option from the
    View menu, and that share becomes active again; the smbd daemon has a new PID,
    however, because it is a brand-new process.


    # Accessing an individual''s user home directory


