    # CONNECTING TO DIFFERENT COMPUTERS


    The previous example provides instructions for connecting from chivas to atlas
    only. If you want to go in the other direction, or want to connect to multiple
    computers, a little more configuration is necessary.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_412_0.png)


    You do not want to copy your private keys from other machines. This would violate
    the secrecy of the private key concept.


    You need to create new private keys on each new client machine. Follow the previous
    instructions on each client computer for creating public and private keys. On
    the client computer you will need to have the id_dsa_1024_a,id_dsa_1024_a.pub
    and identification files in your .ssh directory; the public key such as key_22_server.pub
    should be put in the .ssh/hostkeys directory. You also need to transfer the user''s
    client key to the user''s .ssh directory on the server machine and create the
    authorization file that points to.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_412_1.png)


    > If you have accounts with different names on other computers, you can use the
    same keys to connect to them. The ssh -1 option allows you to specify what account
    name to connect with. For instance, if your account name is veracruz but you want
    to connect to chivas where your name is frankcastle, then you should use the command
    ssh -1 frankcastle chivas. Otherwise, ssh will use your name gable which will
    not match up with frankcastle on chivas.


    # MODIFYING YOUR FIREWALL FOR SECURE SHELL


    The firewall design from Chapter 11 is an effective and strong one. It gains much
    of its strength from the philosophy of not permitting any communication originating
    from the Internet into the private network; it allows only one-way communication.
    This model is quite useful but if you want to gain access to your network from
    outside - for instance, from your home - then it presents some problems.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_412_2.png)'
  merge: -1
  img_proc: true
- pgno: 413
  md: 'A firewall based solely on IP filtering works very well in one direction. As
    soon as you allow IP packets from the Internet, however, you start opening potential
    holes in your firewall. For instance, I have used the network scanner nmap against
    this book''s firewall defined by the ipfilter.rules script found in the /mnt/cdrom/firewall/
    directory on the Red Hat supplemental CD-ROM. The firewall tests very well, as
    every nmap configuration that I can conjure to return any information about my
    network sitting behind the firewall. However, when I add a rule to allow Telnet
    sessions from the Internet, nmap is then able to see your service. An attacker
    knows that there is a computer and/or networks at that IP address and can attempt
    to find a way in.


    Allowing external access to network services like Telnet is not a direct danger
    in itself, it is a potential vulnerability for several reasons. First, if someone
    places a Trojan horse on your network, then access to the network is possible
    (Otherwise, with a one-way firewall, even if a Trojan exists no one can gain access
    and use it). Second, if there is a bug or backdoor in a daemon like telnet, then
    an intruder can take advantage of if external access is available. Finally, if
    someone is sniffing your network traffic, it''s quite possible that your passwords
    will be discovered and access to your internal network gained via a service like
    Telnet.


    The solution is to run a Secure Shell server on your Internet gateway/firewall
    and provide external access only to the Secure Shell server. In this case, iptables
    is the Secure Shell server and an iptables rule is added to allow external clients
    to it. This arrangement is safer than others for several reasons:


    +   First, all communication is encrypted, which makes all the information, such
    as passwords, very difficult to intercept, if not impossible.


    +   Second, if the authentication keys have been properly configured on both the
    client and the server, then you are assured that you are communicating with the
    correct machine. You cannot be spoofed by some third party on the Internet.


    +   Third, Secure Shell is itself a type of firewall. It can be configured to
    require its own authentication before it will allow any access to itself (by turning
    off password-only authentication). Network packets coming in from the Internet
    and seeking access to the private network will be serviced by the Secure Shell
    daemon only. It essentially prevents unauthorized access to your private network
    just as an application-based firewall does.


    +   Finally, my nmap tests of my firewall with external access granted to Secure
    Shell do not show any response. That is, I scan the firewall and nmap does not
    see the Secure Shell port which is listening for incoming connection. nmap does
    not see the network as before. This is not an exhaustive test but a very good
    indicator that the firewall is not going to break easily (nmap is one of the most
    widely used and respected scanners available. It is highly adaptive to new conditions
    and continually being improved).'
