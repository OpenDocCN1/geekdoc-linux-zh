- pgno: 214
  md: '# Chapter 6: Learning Samba Example


    # 185


    directory, /etc/skel to copy the new user''s basic files from. Enter the copy
    command, as in the following example


    ```

    cp /etc/skel/* /home/lidia

    ```


    Don''t worry about the messages omitting the directories. The directories ". and
    "." are Linux''s method of referring to the current and parent directories, respectively.


    > Linux uses the convention where support files, such as .bashrc, are hidden from
    normal directory listings as ls -l. Linux does this because these files are generally
    of interest when you are configuring something. To show them, use the all (-a)
    parameter in the list command (for example, enter ls -a, or ls -la).


    +   11. You need to change the owner and group for your new directory and configuration
    files. In the following two commands, the new user lidia is added


    ```

    chown -R lidia /home/lidia

    chgrp -R lidia /home/lidia

    ```


    The recursive (-R) saves you from having to execute commands several times to
    account for all the subdirectories and files that your directory contains. Many
    commands recognize the recursive flag; it tells a command to descend through all
    subdirectories and perform the same task. This flag is very useful.


    > You can combine the chown and chgrp commands as follows:

    own -R lidia.lidia /home/lidia


    +   12. You should change the permissions on /home/lidia. The permissions you
    choose depend on the requirements of the account. That depends on more variables
    than is reasonable described here. However, you''ll want to give the owner complete
    access to the home directory, which includes read, write, and execute. For this
    example, read access is given to lidia''s group and no privilege to everyone else
    (other). Enter the following command


    ```

    chmod 640 /home/lidia

    ```'
