    (for instance, /dev/hda5).


    Tab to the Ok key and press the return key.

    3. LILO Configuration (continued)


    If you are using a dedicated drive for Linux, then only one choice will be given
    here. However, if you are loading Linux onto a drive with another system on it—dual
    boot—then you can choose which one will be the default system here. Linux will
    be set up as the default by default.


    Tab to the Ok key and press the return key.


    # Configuring your network


    The Network Configuration dialog box appears next. If you want your machine to
    be a stand-alone workstation, select No, press the enter key, and go on to the
    next section. Otherwise, if your system is connected to a network, select Yes
