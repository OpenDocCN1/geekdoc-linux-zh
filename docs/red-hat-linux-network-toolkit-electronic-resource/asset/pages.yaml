- pgno: 47
  md: '# # Partitioning your disk


    Your first major task will be to partition your disk. The following instructions
    describe going through this process using Red Hat''s Druid system.


    +   1. Current Disk Partition (Disk Druid)


    Partition selection is a much more important consideration under Linux than with
    Windows. Windows is typically run on one or two partitions. Linux can also be
    run on a single partition but this can create problems down the line.


    There are different philosophies about how many partitions to use, and of what
    size. Those found in this book are based on the author''s experience and best
    judgment.


    My suggested partitions for 1G and 4G disks are shown in Tables 1-2 and 1-3. You
    have much more breathing room if you use a bigger disk. The root partition size
    of 60MB is used in case you want to install all of the software contained on the
    Red Hat Publisher''s Edition CD-ROM; it also leaves a little extra space for compiling
    multiple kernel versions (described in Chapter 4). Please use your best judgment
    for smaller or larger sized disks.


    # TABLE 1-2 SUGGESTED DISK PARTITIONS FOR A 1-GB DISK


    | Partition | Size | Function |

    |---|---|---|

    | / | 60 | Used as the root of all mounted file systems |

    | /var | 100 | Used mostly for temporary files and logs |

    | /usr | 400 | Used for static, or mostly static, files and libraries |

    | /usr/local | 200 | Stores third-party and custom software storage |

    | /home | 100 | User home directories |

    | Swap | 2 to 2.5 times RAM | Stores virtual memory to disk |'
  merge: -1
