- pgno: 257
  md: '```

    ###Ignore the following lines. They are used in chapter 11.

    ###-ip-up /usr/local/etc/ipchains.rules

    ###-ip-down /usr/local/etc/ipchains.reset

    ```


    9. Create a link to your modem port. If, for instance, the port is port /ndev/ttyS1,
    then enter the following command.


    ```

    ln -s /dev/ttyS1 /dev/modem

    ```


    10. Finally, if you wish to start every time you reboot, you need to copy your
    startup script to /etc/rc.init.d directory and create a link to it in the startup
    run-level directories. (Otherwise, simply enter dial and you will start it manually.)


    ```

    ln -s /etc/rc.init.d/dial /etc/rc.d/rc3/S91dial

    ln -s /etc/rc.init.d/dial /etc/rc.d/rc5/S91dial

    ```


    11. The default /etc/rc.init.d/dial startup script expects to see the dial-conf
    script in the /etc/dial directory. You should see the following-line in the script.


    ```

    -f /etc/dial/dial.conf || exit 0

    ```


    However, the dial program itself expects to see the /etc/dial.conf file. Change
    the script to reflect that difference.


    ```

    -f /etc/dial/dial.conf || exit 0

    ```


    12. Start dial by running its startup script.

    /etc/rc.init.d/dial start


    13. Run the ps x | grep dial command and you should see the dial daemon.

    324 ? S 0:07 dial


    The dial program runs in the background as a daemon and appears as the SLIP device-sl0-to
    your network. The SLIP device is, in general, the default route to the External
    Network. When packets appear on the SLIP device, destined for an outside network,
    dial starts up a chat script that negotiates the login process with the remote
    server. The dial daemon can set up either a SLIP or a PPP connection, but is most
    used with PPP.


    dial gives your network a functional, effectively continuous Internet connection.
    Of course, there is a fairly long latency between the time the packets are generated
    and the time they finally get delivered, but at least you do not have to deal
    making the connection manually. It is a good compromise between a costly full-time
    connection and having to do it manually.'
  merge: -1
