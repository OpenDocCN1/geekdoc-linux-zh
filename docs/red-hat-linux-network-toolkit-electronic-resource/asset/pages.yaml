    checkmark and you go back to the Server administration window.


    # Making an interactive backup


    Now that you have up a drivepack, a Pool, and a savepack, you can test your system
    by running an interactive backup. Remember that nothing is going to be backed
    up because the null device discards the backup data that is fed.


    +   1. From the Server administration window click Backup -> Interactive backup
    menus. Then you''ll enter the Interactive backup window shown in Figure 10-15.


    +   2. Now you''ll see the names of the savepack, drivepack, and Pool that you
    just configured. Other information such as the backup type is displayed too. Later,
    when you have other backups defined, you can select them from this window.'
