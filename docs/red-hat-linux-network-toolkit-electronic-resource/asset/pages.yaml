    \ with access to it.\n\n4. To run a check on the /etc/passwd file (/etc/shadow\
    \ if you have installed shadow passwords), enter the following command:\n   /root/crack-4.1f/crack\
    \ /etc/passwd\n\n5. crack shows some information on the screen and then announces\
