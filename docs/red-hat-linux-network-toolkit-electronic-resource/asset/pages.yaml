  md: '# Part I: The Simple Client-Server Network


    Before you proceed, you should create a boot floppy, just as you have to in the
    single-partition method. Just as you should make an emergency Windows 95 startup
    disk, you should have a boot floppy for emergencies. I provide instructions for
