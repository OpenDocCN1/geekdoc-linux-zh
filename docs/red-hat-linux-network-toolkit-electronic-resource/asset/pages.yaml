- pgno: 55
  md: '# 26 Part 1: The Simple Client-Server Network


    If you do not have an InterNic-registered – official – IP address, then you can,
    and should, use a public IP address. The most frequently used addresses are 192.168.1.X
    through 192.168.254.X, where X can be any number between 1 and 254. These addresses
    should use the 255.255.255.0 mask.


    If you are installing your new Linux box on an existing network that has a connection
    to the Internet or another network, you should enter the IP address of that connection
    as the gateway. If your new Linux box is going to be the gateway, enter its IP
    address there. Otherwise you can leave it blank and enter it.


    If you do not have access to an IP address, don''t worry. The people who designed
    the internet protocols (notice the lower-case i) set aside some addresses for
    you to use as long as you do not use them outside your LAN. If you do not try
    to access the Internet – the WWW, e-mail, and so on – then the IP address spaces
    shown in Table 1-4 are legal. Chapter 8 discusses IP masquerading – that is, how
    to mask these addresses, or any IP, from the Internet – so don''t worry about
    choosing this type of address now.


    When you finish with this dialog box, select the OK button and press Enter.


    # ### Internet addresses and the InterNic


    The internet protocol is an impressive work (remember that the lower-case i refers
    to the protocols that make the Internet possible). It encompasses a huge number
    of disparate requirements and seamlessly glues the entire world together. Your
    TCP/IP local area network (LAN) contains nearly all the elements that allow it
    to scale up to the entire world.


    If you intend to advertise or use your network name on the Internet, you must
    register it with the InterNic via an Internet service provider (ISP). See http://ds.internic.net
    and the Requests for Comment (RFC) rfc2050 for more information.


    InterNic is getting stingier with IP addresses. All class C address spaces are
    distributed from Internet service providers (ISPs) who must prove to InterNic
    that they are using more than 50 percent of their space. Therefore, you must now
    have at least 128 hosts to qualify for your own class C address space.


    A new system under development will correct much of this problem. It is the Internet
    Protocol version 6, IPv6, and makes use of 128-bit-long IP addresses instead of
    the current 32-bit addresses. This is compatible with the current protocol but
    allows for considerably more growth. This is a lot of addresses and should be
    enough to assign an IP address to every home appliance and computer (and person)
    in the world.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Chapter 1: Installing Red Hat Linux 27


    # ### TABLE 1-4 GENERAL-PURPOSE IP ADDRESSES


    | Network class | Start address | Last address | Subnet Mask |

    |--- | --- | --- | --- |

    | A | 10.0.0.0 | 10.255.255.255 | 255.0.0.0 |

    | B | 172.16.0.0 | 172.31.255.255 | 255.0.0.0 |

    | C | 192.168.1.0 | 192.168.255.255 | 255.255.255.0 |


    It is almost always best to use a class C address space. It can handle as many
    as 254 hosts, which should be enough. I prefer to assign my servers the highest
    addresses in the subnet, so I give it the address 192.168.1.250 (254 is used for
    the optional Internet gateway/firewall atlas described in Chapter 11). Clients,
    such as my Windows machines, get the low numbers starting at 192.168.1.1, Linux
    clients start at 100 and Linux servers occupy the addresses above 200. This convention
    makes it easy to remember which machines are the server(s) and which are the client(s).


    3. Configure Network (continued)


    Next, you need to enter the information on your domain name and extra name servers.
    This book uses the domain name of paunchy.net. You need to enter the IP address
    of your ISP''s name servers (one or two).

    The following bullets describe these parameters in more detail.


    +   - Domain name. A domain name is, as you may guess, the name that your network
    is known as. It''s like a nickname. For instance, paunchy.net is my registered
    domain name.

    - Host name. This is the name of your computer with the domain name added. For
    instance, my domain name is paunchy.net, and this host name is chivas.paunchy.net.

    - Secondary and Tertiary nameservers (IPs). These are the IP addresses of the
    second and third DNS servers that your computer will use. They are generally the
    addresses of your ISP nameservers.


    When you finish filling in this dialog box, select the Ok button and press enter.'
