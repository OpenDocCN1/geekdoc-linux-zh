    # Summary


    Linux configuration is a big topic. In this chapter, the basics of configuring
    Red Hat Linux are described by example. The Red RPM system makes the task of adding,
    removing, and upgrading system functions, applications, and utilities very easy.
    The Linux system itself is modular and easy to modify. The following topics are
    covered in this chapter:


    +   * The Red Hat configuration tools are introduced in this chapter. Configuration
    issues were not discussed in order to get Red Hat Linux up and running as quickly
    as possible.


    +   * The major installation and configuration topics this chapter covers the
    RPM system, the X Window startup, the Red Hat Control Panel, building a custom
    kernel, and the Linux startup scripts.


    +   * The Red Hat Package Manager (RPM) provides a simple and sure method for
    installing, upgrading, uninstalling, querying, and verifying Linux packages. Linux
    packages are software stored in a format that works with RPM. They include the
    base Linux system, important Linux configuration files, and applications.


    +   * Detailed descriptions of each of the RPM functions (install, upgrade, uninstall,
    query, and verify) are given.


    +   * Several examples that demonstrate how to use the RPM are given. In particular,
    you are shown how to use the query function in order to discover information about
    installed packages as well as ones available on the Red Hat distribution CD-ROM.


    +   * The first RPM installation example is used to install some documentation.
    This is a simple and straightforward example that also provides useful information.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# Part II: Background


    +   * The second RPM installation example is more complex because it requires
    a package that in turn requires another package – The second RPM installation
    example is more complex because it requires a package that in turn requires another
    package – so the installation order is important. It installs the basic networking
    support. The basic networking was not installed in Chapter 1 and is required if
    you are to remotely communicate with your Linux box.


    +   * The last RPM installation example is quite complex. In anticipation of a
    number of systems that need to be installed and compiled in the future, I show
    you how to install the GNU C compiler (gcc) and the Make utility. The gcc compiler
    requires many libraries and the Linux kernel header files, so several other packages
    must be installed in the correct order.


    +   * A verify example shows how to find out what package files have been changed.
    This is useful for debugging and as general information.


    +   * Until the advent of RPM, most Linux subsystems were distributed through
    tar files. They were unpacked and semimanually installed. Installation required
    compiling the source code. The Make facility helped the process by not only compiling
    the source code but also transferring it to its final destination.


    +   * The manual – non RPM – installation of dial is used to show you how things
    were done before RPM, and still are in many places. You use the dial system in
    Chapter 8.


    +   * The installation of XFree86, via RPM and the Xconfigurator system is described.


    +   * With the X system installed, the Red Hat Control Panel GUI is introduced.
    This method is convenient for performing many administrative functions. Some of
    the functions are package management, user and group management, printers and
    network management.


    +   * The LinuxConf configuration system is introduced. It can configure an overlapping
    set of Linux systems with Control Panel.


    +   * The concept of customizing the Linux kernel is introduced. You have the
    option of adding either modular functions or recompiling static functions directly.
    Modular functions, such as the SLIP module, can be added dynamically while your
    system is running. For example, when you want to establish an Internet connection
    with the PPP protocol (as described in Chapter 8) and you are using the base kernel
    from Chapter 1, you do not have to restart your system or even recompile the kernel;
    you simply have the SLIP module inserted.


    +   * There is a brief description of the process for adding new functions to
    the Red Hat startup scripts. This is useful for customizing your system to meet
    your specific needs.'
