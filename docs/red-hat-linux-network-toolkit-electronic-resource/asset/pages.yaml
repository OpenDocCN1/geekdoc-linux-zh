- pgno: 298
  md: '# Chapter 9


    # Introducing Systems

    Administration


    IN THIS CHAPTER


    +   - Creating and interpreting administration policy

    - Creating and maintaining backups

    - Creating and maintaining security

    - Creating Internet firewalls

    - Using cron to automate repetitive jobs

    - Using shell scripts

    - Starting and stopping a Linux system

    - Maintaining your computer network system

    - Recovering from disaster


    THIS BOOK DESCRIBES how to build individual Linux computers and networks. In previous
    chapters, you are given the basics for constructing a network and configuring
    both your clients and servers. Along the way, the subject of systems administration
    is briefly introduced. The subject will now be treated at greater length.


    # Introducing Systems Administration


    Because an entire book is required to discuss administration in any detail, this
    chapter is intended only as an introduction to the subject. You are given just
    enough information to get started. Consider this starting point on the systems
    administration journey.


    The job of an administrator is to serve the needs of the computer user. To this
    end, an administrator must address human as well as technical concerns. In my
    experience, the technical side of systems administration is the simpler of the
    two. In other words, systems administration is as much an art as a science. If,
    if not most, administration work takes the form of interpreting problems in terms
    of the technical implementation of their solutions.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# Part IV: Managing your Network


    Every administration job is completely different in its details. I can''t possibly
    quantify the sum of the tasks, equipment, and people involved. However, most organizations—from
    a home office to a Fortune 500 corporation—share essentially the same set of core
    functions. My intention in this chapter is to describe them. The human factor
    is, of course, more difficult to describe, but I offer comments and advice I can.


    Systems administration is a complex, amorphous subject. No two administrative
    jobs are the same. Throughout this chapter, and the rest of the book, I try to
    provide you with the tools you need for devising solutions to the unique problems
    that you will encounter in your role as a systems administrator.


    # Understanding the Essentials


    In some cases, systems administration is a purely part-time job; in other cases,
    you may inherit ( create) the administrator’s job as a system grows, or it may
    be a specific, full-time job to begin with. The essential functions are the same,
    but they vary in terms of size, interaction, and complexity. The following summarizes
    these functions:


    +   - Creating, modifying, interpreting, and enforcing policy. This is the most
    important philosophical aspect of an administrator’s job. All the other functional
    duties stem from it. The administrative policies you create and inherit will rule
    your life. They can be in the form of company law or if you do not set the rules,
    your interpretation of them will be the effective law. Because the nature of administration
    is managing chaos, your policy road is essential for keeping everything under
    control.


    +   - Creating and maintaining backups. This is the most important single function
    of a systems administrator. You need secure, reliable backups of your servers
    and please the client computers.


    +   - Creating and maintaining an effective security system. Security is both
    a technical and a human concern. Technically, it spans everything from individual
    computer configurations to your firewall design. The human side encompasses everything
    from how you set up and enforce password policy to people’s feelings.


    +   - Managing users. It is your responsibility to add, remove, and modify user
    accounts.


    +   - Maintaining file systems. It is your responsibility to add, remove, and
    modify the various file systems on your servers. ( Introduce the topic of file
    systems in Chapter 3.)'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Chapter 9: Introducing Systems Administration 271


    +   - Modifying and maintaining hardware. Unless you work for a large company
    (and even if you do, in some cases), you are responsible for the installation
    and maintenance of computers and peripherals.


    +   - Modifying and maintaining software. The need here is obvious. Computers
    must have their operating systems installed and upgraded. Applications such as
    databases, word processors, and spreadsheets need to be installed and maintained,
    too.


    +   - Troubleshooting. This is an everyday task. When something goes wrong—big
    or small, real or imagined—you get called. This responsibility generally requires
    you to carry a pager.


    +   - Ensuring reliability. This is your ultimate goal. Ensuring reliability is
    both a specific job and a general goal. It is achieved by properly doing your
    job as outlined in the preceding items as well as planning and designing for the
    unforeseen problems as best you can.


    +   - Crawling under floors and through ceilings, answering the phone, and taking
    out the trash.


    As you can see, the administrator''s responsibilities are wide-ranging and complex.
    The following sections describe these responsibilities in more detail.


    # Creating and interpreting policy


    Any computer system and network needs a roadmap to operate reliably and efficiently.
    With this book I aim to give you the tools you need to operate a network. The
    tools are introduced in a systematic way, in order to bring you to the point where
    you have an overall understanding of a complete, albeit simple, system.


    The policy you set and the policy that you enforce often are two different things.
    You may determine certain things yourself—for example, the backup policy discussed
    later in this chapter. Outside of your business or home office, many administration
    and security issues generally cross into policy areas that management determines.
    You may collaborate in the establishment of these policies, or may be out of yours.
    It''s up to you to implement such policies as best you can and be willing to draw
    a line if a policy becomes impossible to enforce.


    If you have a personal home network, you need to know which tasks you need to
    keep your system up and running. You do not need to write a manual of rules you
    want to follow, but you do need to perform tasks at specific times. You certainly
    need to back up your valuable data regularly and in such a way that you know how
    to recover lost files. It is okay to keep such tasks on an informal level; however,
    you may find it helpful to write down the instructions for performing more complex
    processes. You may only need to write down the exact instruction that you use
    to create a backup, but that can be invaluable information and it doesn''t take
    much effort to write it down on a slip of paper and stick it in the cassette tape.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_300_0.png)'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# Part IV: Managing a small to medium network


    If you manage a small to medium network for someone else, you must systematically
    write things down. At this level, the line between policy and pure instructions
    begins to blur. A page or two of backup instructions can serve as both the policy
    and the instructions. The instructions may say first do A, then B, and finally
    C, three times a week. That is your company''s policy.


    For larger operations, you most likely inherit policy. The exception is when a
    takeover or a major reorganization occurs. In most cases, you still have a great
    deal of power in the way you interpret and implement the rules given to you. The
    number of people who ultimately depend on you determines the importance of a job.


    Another purpose of writing policy and procedure is to make yourself indispensable.
    Your goal should be to enable someone else – with the appropriate level of computer
    experience – to come in cold and perform the basic system administration. The
    more administration functions that I systematize, the better I am doing my job.


    Part of general policy should be to document both your everyday tasks and your
    occasional ones. The more you write down and diagram procedures, the easier your
    job will be and the easier it will be for your successor. Also, documenting a
    process can lead to that process becoming policy. If you do a job a certain way
    and you can document it in a reasonable way, it''s likely to become the way it
    is done all the time. By writing it down, you can make it the official policy
    by default.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_301_0.png)


    Web browsers can make the documentation easier. By placing all or most of your
    documents on a private (Intranet) Web page, you can make them easy to find and
    view. If you make part of the documentation into a FAQ, you may even reduce your
    workload after you educate your users to access it for everyday problems. If you
    possess an atheist streak, you can actually relieve the drudgery of documentation
    by using HTML as your brush and palate.


    The rest of this chapter discusses the distinct functions of systems administration.
    Each function is governed by a policy, written or not.


    # Creating and maintaining backups


    Your backup policy determines your single most important job as an administrator.
    If you have good backups, you can recover from any catastrophe. One end of a catastrophe
    (even if your computers burn to the ground or a disk crash destroys your data),
    if you have reliable, complete backups, you can recover your system. At the other,
    less ominous, end of the catastrophe spectrum, backups enable you to recover individual
    files or groups of files that have been accidentally erased. Therefore, you must
    have a system to make backups and follow it religiously.'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# Chapter 9: Introducing Systems Administration 273


    You need secure, reliable, multiple backups of your servers. Do not trust just
    one or even two backups. Whatever your method, make multiple, overlapping backups,
    and keep at least one, but preferably two, backups offsite. By offsite, I mean
    in another building separate from your normal working location. At one job, I
    took backups home because we had only one office. In another job, I took the backups
    to another company building. Having offsite backups helps you to sleep well at
    night.


    You should periodically test your system. By restoring data, you keep yourself
    confident and also test for data integrity. Periodic testing is an essential part
    of your backup policy.


    You can use various utilities to create backups. The standard Linux (and UNIX)
    tools are the tar, cpio - now dump utilities:


    +   * tar utility creates an archive file and has the advantage of being nearly
    universal. The GNU tar now enables you to specify compression as an option. It
    also provides for making incremental backups (an incremental backup includes whatever
    files have been created or modified since a last backup was made; a full backup
    includes every file in the directory or file system that is specified to be backed
    up). In my opinion, tar is the easiest system to use.


    +   * cpio utility also creates an archive, with fewer restrictions in terms of
    the depth of a directory structure that it can traverse and also the length of
    a filename it can handle. It also handles localized tape errors by skipping them.


    +   * The dump program is oriented toward backing up entire file systems and then
    keeping track of changes in order to provide incremental backups. It also provides
    a hierarchy of incremental backup levels (ten levels) that gives you a convenient
    system to use on weekly and monthly intervals.(dump is not described in this book).


    # USING THE TAR UTILITY


    The tar utility archives directories and files to a file. A tar file can be a
    tape, a pipe, or a normal file. The first parameter specifies one of the primary
    functions - such as create, list, or extract - to perform. The next parameters
    are optional modifications to the primary function. The last parameters are files
    or directories to archive (note that when a directory is given, it all its subdirectories
    will be archived).


    It is a simple program to use. For example, to create a tar file of the example
    user lidia that you created in Chapter 6, enter the following command:


    ```

    tar cf lidia.tar /home/lidia

    ```'
