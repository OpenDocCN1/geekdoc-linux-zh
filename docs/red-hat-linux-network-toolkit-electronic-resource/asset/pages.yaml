    ```


    ```

    # The phone number to dial

    ```


    ```

    PHONE_NUMBER="555-5309"

    ```


    ```

    # The chat sequence to recognize that the remote system

    ```


    ```

    # is asking for your user name.

    ```


    ```

    USER_CHAT_SEQ="ogin:"

