  md: "# Appendix A\n\n# Introducing vi\n\nTHE MOST UNIVERSAL SCREEN editor in Linux\
    \ and UNIX is the Visual Editor, or vi.\nThis appendix outlines the basic vi commands\
    \ that let you perform simple edits on\nany text file.\n\nI've been using vi for\
    \ nearly 20 years now. I use it every day but I probably only\nknow and use 20%\
    \ to 30% of its capabilities. I'm not just lazy (well, I am lazy, and\nthat's\
    \ another matter) because I only need to use about 20% of its capabilities to\
    \ get\nmy job done.\n\nI mention my limited knowledge of vi to illustrate its\
    \ power. You only need to\\know the basics in order to get real work done. Looking\
    \ at the vi man page can be\ndaunting. vi is packed with features. It is command\
    \ driven – there is no\ngraphical interface – the wealth of features is difficult\
    \ to learn. However, you can\nget by using a small subset of those features and\
    \ I outline the ones that I find use-\\ful in this appendix.\n\n# Starting vi\n\
    \nYou can start vi simply by entering the following at the shell prompt.\n\n```\n\
    vi\n```\n\n> You'll see a simple informational screen describing the basics of\
    \ vi. If you enter\nthe name of a text file as shown in the following example,\
    \ vi will open that file au-\tomatically and show you the first page of text.\n\
    \n```\nvi /etc/hosts\n```\n\n# Introducing vi Modes\n\nYou can operate vi in either\
    \ command or insert mode. The command mode is used\nnto modify existing text and\
    \ also to save changes to a file, insert text from files and\nto exit from vi.\
    \ The insert mode is used to add text to a file."
  merge: -1
  img_proc: true
- pgno: 431
  md: '# Using the Command Mode


    When you start vi it automatically defaults into command mode. The following table
    shows some common vi editing commands:


    TABLE A-1 SIMPLE EDITING COMMANDS


    | Command | Description |

    | --- | --- |

    | x | Delete the character at the current cursor position |

    | 3x | Delete the next three characters, starting at the current cursor position
    |

    | dd | Delete the current line |

    | 3dd | Delete three lines from the current line |

    | dw | Delete the word that the cursor is sitting on |

    | 3dw | Delete the next three words from where the cursor is sitting |

    | Ctrl+f | Page down one full screen |

    | Ctrl+b | Page up one full screen |

    | Up-arrow key | Move up one line |

    | Down-arrow key | Move down one line |

    | Right-arrow key | Move right one character |

    | Left-arrow key | Move left one character |


    You can enter insert mode by pressing any of the following characters while you
    are in command mode.


    TABLE A-2 CHANGE TO INSERT MODES CHARACTERS


    | Command | Description |

    | --- | --- |

    | a | Append characters from the current cursor position |

    | A | Append characters to the end of the current line |

    | i | Insert characters from the current cursor position |'
  merge: -1
  img_proc: true
- pgno: 432
  md: '# Appendix A: Introducing vi 403


    | Command | Description |

    | I | Insert characters at the beginning of the current line |

    | o | Open a line below the cursor for test insertion |

    | O | Open a line above the current line for text insertion |


    To return to the command mode press the Esc key.


    # Searching and Replacing Text


    You can search forward for a text string by first pressing the slash (/) key.
    Any text that you then enter will be searched for. If the text is found, vi will
    place the cursor at the text. You can search backwards by using the question mark
    (?) in place of the slash.

    You can search and replace text by using the following sequence.


    ```

    :g/old/s//new

    ```


    For instance, if you want to find the string thatolddevilgravity and replace it
    withisbringingmedown you enter the following sequence.

    g:thatolddevilgravity/s//isbringingmedown


    vi will search and replace the first instance of the old string with the new string.
    You can direct vi to replace every occurrence of the old string you can use the
    following sequence.

    g:thatolddevilgravity/s//isbringingmedown/g


    # Saving and Quitting


    To save your edits to a file, you must be in command mode. (Note that change to
    command mode, you should press the Esc key.) The following sequence will save
    any changes that you have made to the file.


    ```

    :w

    ```


    To save and exit vi, enter the following character sequence.


    ```

    :wq

    ```'
  merge: -1
  img_proc: true
- pgno: 433
  md: 'You can exit vi if you have already saved any changes by entering the following-sequence:


    :q


    Alternately, you can exit vi and discard any changes that you''ve made by using
    the following sequence:


    :q!


    > You can save and exit simply by entering the key sequence ZZ while you are in
    command mode. All changes that you''ve entered are saved and you return to the
    shell prompt.


    With these few commands, you can get a lot of work done with vi.'
