    Try making a connection to someplace outside your LAN — I sometimes tries to Telnet
    to an account I have at the local university, as shown in the following example.


    ```

    telnet 192.168.111.84

    ```


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_254_0.png)


    If you have not configured your ours nameserver — described in the section "Creating
    a Simple DNS Server" in Chapter 8 — or pointed your network towards your ISP,
    then you need to use raw IP addresses. You can configure your computer to use
    your ISP''s nameserver by creating the /etc/resolv.conf file like that below.


    ```

    search paunchy.net

    nameserver 192.168.169.250

    ```


    The nameserver IP address is fictitious of course. Substitute the IP address supplied
    by your ISP.


    Connecting to your ISP login computer is a good bet. You already know the IP of
    its PPP server that may even double as the login device. To disconnect the PPP
    connection, enter the following dip kill command:


    ```

    dip -k /dev/modem

    ```


    It may take a few seconds to disconnect and clean up its lock files. Ten years
    ago I would have liked for such convenience. But I''m spoiled now and still it
    gets better! The dial system described in the next section automates the PPP connection.


    # Using dial to establish a PPP connection


    Red Hat supplies a simple and effective way to connect to the Internet via its
    Control-Panel, "Using the Network Interface Window to Establish a PPP Connection"
    later in this chapter. However, I highly prefer using the dial system, which automates
    the entire process. It monitors your computer for any communication going to the
    Internet. When it sees a packet destined for the outside world it dials your ISP
    and negotiates a PPP connection.'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'Red Hat does not include a dial RPM package on its CD-ROM. However, it does
    have an RPM dial package on its Web (and Anonymous FTP) server in the contrib
    directory. You can also find it on the SunSite in the linux/distributions/redhat/contrib/i386
    directory.) I have included a copy on the companion CD-ROM in the dial directory.


    +   1. Log on root.


    +   2. Mount the IDG supplemental CD-ROM.


    +   3. I have had problems getting the current PPP rpm to work correctly. However,
    the previous version – from Red Hat 6.0– works quite well. There is no functional
