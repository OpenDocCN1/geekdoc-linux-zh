    Before you get into the mechanics of reconfiguring Samba, however, you need to
    understand Samba daemons. The following section offers a quick review of the Samba
    daemons, which make use of the configuration parameters.


    # Understanding Samba daemons


    Recall at the heart of Samba are the two daemons – system processes that run continually
    in the background – The smbd daemon monitors the network for share requests. When
    it detects a share request, smbd goes through Linux to get the resource that Samba
    represents – that is, a directory or a printer and makes this resource available
    to the Samba client(s) that requested it. The resource – a file, for example –
    stays on the Linux server, but the Samba client can make use of it as if it were
    located on the client''s disk.


    The name server – nmbd – controls browsing by Windows clients (such as when you
    open the Network Neighborhood), and responds to the Windows clients'' requests
    to locate Samba servers. (A name server converts an IP name into its numeric IP
    address. Thus, nmbd converts locala.polycha.com into 192.168.1.1.) Both daemons
    read the smb.conf file when they start up, to discover exactly which services
    to export.


    You ask for a share when you open a directory, a file, or a printer from your
    Windows environment. In Chapter 1, for example, you access a share when you open
    the root directory from the Network Neighborhood.


    The smbd creates a copy of itself whenever it arrives a share request. Try opening
    the root share from the Network Neighborhood on your computer by double-clicking
    the computer icon; you should see a window with the contents – if any – of the
    /root directory. If you don''t see anything, try copying a file to'
