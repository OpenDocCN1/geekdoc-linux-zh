- pgno: 258
  md: '# Chapter 7: Connecting to the Internet


    # 229


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_258_0.png)


    The dial daemon is responsible for setting up your default route — the route that
    handles all packets that cannot be routed explicitly. Using the default route
    option is a good idea if your LAN has no other Internet connections. (This is
    why I recommended that you leave the default route blank during the network configuration
    in Chapter 1.) Any packets intended for your network you probably want going to
    the Internet. Many possible exceptions exist, but this is a good rule of thumb.


    Nothing happens until a packet hits the default route. Try using a network program
    such as Telnet to access an outside machine — that is, not on your LAN. Your ISP
    login computer is a safe bet. If you are in X Window, open another terminal window
    or go to run the ps grep command. As shown in the resulting output, dial has spawned
    a chat script to dial the modem and log in to your ISP''s PPP server:


    ```

    1030 ? S  0:00 dial

    1045 ? S  0:00 sh /etc/pppd/connect

    1049 ? S  0:00 chat -r /var/log/connect REPORT CONNECT TIMEOUT 45 ABORT NO

    ```


    The modem fires up and dials your ISP. After it establishes a connection, it sends
    your login name and password to the pppd daemon, and in. To see the pppd daemon
    is running, run the following command:


    ```

    ps -x | grep ppp

    ```


    You see the pppd daemon as shown in the following line (note that the line is
    cut short):


    ```

    1132 SO S  0:00 /usr/sbin/pppd -detach modem crtscts mtu 1500 mru 1500 as

    ```


    If you are fast enough (or just lucky), you can see the kernel ppp.o kernel module
    in anticipation of the pppd daemon. Here''s what this information looks like:


    ```

    1203 ? R  0:00 modprobe k s ppp

    ```


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_258_1.png)


    Of course, it can be dangerous to leave your PPP login name and password in plain
    text within your chat script file. There may be ways of encrypting it that I am
    unaware of, but at the very least you should only give root permission to read
    the file.'
  merge: -1
  img_proc: true
- pgno: 259
