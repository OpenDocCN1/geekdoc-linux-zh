- pgno: 414
  md: '# Chapter 12: Securing your Server


    The following rule is used to provide external access to your private network

    from the Internet.


    ```

    # allow secure shell connections originating from the outside

    ipchains -A output -p TCP -j ACCEPT -i ppp0 -s $ALL ssh -t 0x01 0x10

    ipchains -A output -p UDP -j ACCEPT -i ppp0 -s $ALL ssh -t 0x01 0x10

    ```


    These rules can be found in the /mnt/cdrom/firewall/ipfilter.rules file on

    t Red Hat supplemental CD-ROM. Remove the comments in order to activate them.


    # USING SECURE FTP


    Secure Shell handles a secure version of FTP called sftp. sftp can be used in

    place of FTP to transfer encrypted information. The sftp system is easy to use:
    you

    just enter the following command to connect to a computer -chivas in this case
    –

    running Secure Shell.


    ```

    sftp chivas

    ```


    The Secure Shell daemon handles the entire process. Unlike FTP, there is only

    one communication channel for both commands and data.


    # CONFIGURING GENERAL PARAMETERS


    By default, sshd2 configuration allows root logins. The better practice is to
    not

    allow direct root logins and force everyone to log in as a regular user. Those
    who

    have root privilege can use the su command to access root. That leaves an audit

    trail also forces everyone to use two passwords instead of to gain root ac-

    ess.


    Edit the /etc/ssh/sshd2_config file and set the PermitRootLogin parameter to

    y to no:


    ```

    PermitRootLogin no

    ```


    Another useful change is to disallow password logins. The Secure Shell default

    operation is to use the Linux login password to authenticate the

    connection if the pass phrase fails. This could present an intruder with the oppu-

    ity to gain access if, for instance, the password file has been cracked or intercepted.

    Changing this option is not a panacea but does potentially provide extra protection.

    Change the parameter in the /etc/ssh/sshd2_config file to the following:


    ```

    PasswordAuthentication no

    ```


    There are numerous other parameters that can be changed. Please consult the

    sshd2 man page for more information.'
  merge: -1
  img_proc: true
