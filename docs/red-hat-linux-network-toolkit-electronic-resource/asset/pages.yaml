    # Configuring an E-mail Server


    Configuring e-mail systems is one of the more complex tasks that you can do. There
    are numerous e-mail servers and clients and getting them all to interact can be
    described as a non-trivial task.


    In order to simplify your e-mail configuration, this chapter uses two types of
    e-mail systems. One is simple and easy to configure but is not very flexible and
    the other is not so easy to set up but is somewhat more flexible. You can choose
    the best solution for your operation.'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# Chapter 8: Creating NFS, NIS, DNS, and E-mail Servers


    # Using the Netscape e-mail client


    Once you have subscribed to ISP and connected to the Internet, you can use your
    ISP as your e-mail server. This is quite simple in concept and execution: your
    ISP gives you a login account and that comes with an e-mail address. Your ISP
    also provides Post Office Protocol (POP) and IMAP protocol capabilities, which
    means that you can download and/or view your e-mail from your Private Network.


    The POP and IMAP protocols are designed to allow access to e-mail via an external
    network or connection. Traditionally, you would have to log into an account and
    access e-mail directly from that machine, but the introduction of the POP and
    IMAP protocols makes that unnecessary.


    Netscape provides an e-mail client that is capable of using either POP or IMAP.
    You can configure the Netscape e-mail client to access your remote ISP account
    to send and retrieve e-mail. You pay your ISP to manage your e-mail, and don''t
    have to worry about anything other than configuring the Netscape client. Figure
    8-1 shows an e-mail system based around an ISP server. Connections are made through
    the Linux chivas, and local workstations send and receive mail through the ISP.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_282_0.png)


    Figure 8-1: An ISP-based e-mail system


    > You are not limited to Netscape as your e-mail client. There are other clients
    available that work with POP and IMAP. For instance, the simple, text-based PINE
    client can be used. The Netscape client is used as the example in this chapter
    because it is included in the Red Hat distribution included on the companion CD-ROM,
    and it is also easy to use and powerful.'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'Netscape is installed as part of the Red Hat installation process. Log in as
    any user and click on the Netscape (N) button on the Main menu panel. When the
    Netscape window opens up, click Edit→Preferences. The Preferences screen is displayed.


    Click Mail and Groups, then click Mail Server. Enter the information about your
    user name (as it exists on ISP''s mail server) and the names of your outgoing
    and incoming servers.


    Click on either the POP3 or IMAP4 radio buttons depending on what protocol your
    ISP provides you.


    +   - POP3 is a two-way protocol. It is used to send and retrieve e-mail. It is
    an older protocol and is not secure as IMAP. If you want increased security, use
    IMAP.


    +   - IMAP4 is a two-way protocol. You can use it to both send and receive e-mail.
    It is the newer of the two protocols and has reached a state of maturity you should
    not have any problems with it.


    Your entries should look like the window shown in Figure 8-2.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_283_0.png)


    Figure 8-2: The Netscape Mail server window'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# Chapter 8: Creating NFS, NIS, DNS, and E-mail Servers


    4. Next, click on the Identity item and enter your full e-mail address, optionally
    your real name, organization, and signature file.


    5. Click OK and try to send yourself some e-mail. You should be able to click
    the Get messages button and receive your e-mail.


    The drawback to this method is that each user on your network will need an e-mail
    address provided by your ISP. That typically costs some money, but not much, and
    is quite reasonable for the smallest business. Also, since all of your e-mail
    is queued through your ISP, you have a PPP connection activated in order to access
    it. So if users on your Private Network want to communicate with each other, they
    have to go out to the ISP to do so. This will probably be a problem if your operation
    grows beyond a dozen people or so.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_284_0.png)


    Another advantage to this method is that you can retrieve e-mail from any location.
    As long as you have a way to connect to your ISP, then you can retrieve your e-mail.
    For instance, if you have a laptop with a modem, then you can configure it to
    retrieve your e-mail and all you have to do is dial in to your ISP to get it.


    Even if you have a lot of e-mail traffic this method still might make sense long
    as you have a fast connection to your ISP. For instance, if you have a T1 (1.54
    Mbps), then you very likely will not have any problems. If your little modem has
    to manage megabytes of e-mail traffic every day, then you need either a bigger
    Internet pipe or to reduce the load by keeping local traffic within your network.
    The next section, "Configuring a Local E-mail server," describes that process.


    # Configuring a local e-mail server


    If you have a significant amount of e-mail traffic – local traffic – then using
    your ISP as your e-mail server might not be practical. This section describes
    a hybrid system where your chivas acts as the local e-mail server using the sendmail,
    fetchmail and IMAP software. Clients send their e-mail for locations outside of
    your network to IMAP on chivas. sendmail then takes over and forwards the e-mail
    to your ISP and to their final destination. Incoming e-mail is retrieved from
    your ISP via fetchmail, fetchmail retrieves the e-mails to IMAP, which distributes
    to the local network. sendmail directs all internal traffic to IMAP for internal
    distribution. Figure 8-3 shows the configuration of the local e-mail system. The
    Linux IMAP server downloads all e-mail from the ISP''s mail server. The local
    workstations stand and receive e-mail via chivas. If atlas is acting as the Internet
    gateway/firewall atlas, then it funnels the e-mail to the ISP. If chivas is acting
    as the gateway, then it sends the e-mail traffic to the ISP.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_284_1.png)'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# 256 Part III: Expanding your Network Services


    Chivas


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_285_0.png)


    Figure 8-3: A locally-based e-mail system


    There are four parts that need to be configured together to make this system work:
    the e-mail client, local delivery, external delivery and external retrieval. They
    are described in that order.


    The fictitious user redbush will be used in the examples for this configuration.
    Log in as root and create the user by running the commands:


    ```

    adduser redbush

    passwd redbush

    ```


    # CONFIGURING THE NETSCAPE E-MAIL CLIENT


    This e-mail system depends on the use of the Netscape mail client on each computer
    on paunchy.net. Netscape should be configured to use IMAP4. You can use the instructions
    previously given in the section "Using the Netscape E-mail Client."

    However, instead of entering the name of your ISP as the incoming and outgoing
    server, you should enter chivas.paunchy.net instead. The Linux e-mail server chivas
    directs all local e-mail traffic and forwards or retrieves e-mail destined for
    chivas or coming from the Internet via the ISP server.


    # CONFIGURING SENDMAIL FOR LOCAL E-MAIL


    The default sendmail configuration requires all the names that your e-mail server
    is known to be listed in /etc/sendmail.cw. Modify the file as follows.


    ```

    # sendmail.cw - include all aliases for your machine here.

    bart

    paunchy.net.

    ```


    Your ISP must know what name you are known by too. That process is described in
    the section "Registering your Domain Name" later in this chapter.'
  merge: -1
  img_proc: true
