- pgno: 178
  md: '# Chapter 5: Configuring Red Hat Linux


    Some functions need to be explicitly specified to kernel for it to work for them.
    Click the Kernel Daemon Configuration button in the Control Panel window. The
    screen shows that kernel knows about my Ethernet adapter, which I configured during
    the initial installation. Had I not configured it then, or changed to another
    adapter, I could use kernel to do so now.


    # THE USER CONFIGURATOR


    The User Configurator function handles user and group management in more detail
    than the simple adduser method. Click the Modules menu in the Control Panel shown
    in Figure 5-5. Click the User and Group configuration button. This brings up the
    User Configurator window showing the information for each user, which it gets
    from the /etc/passwd file.


    If you open a window for Root, you get the Edit User Definition screen. From here,
    you can edit any of the parameters shown. This method is nice because it does
    not let you do anything too foolish. Editing the /etc/passwd and /etc/group files
    by hand can wreak havoc, but you can do little wrong here. This method also provides
    you with choices you may not know exist. For example, the Password field has five
    choices – Original, Change, No Password, Lock, and Unlock. It''s a useful system.


    With the User Configurator, you can add, delete, deactivate, and reactivate a
    user. You can also add, delete, and edit groups.


    # THE RHS LINUX PRINT SYSTEM MANAGER


    I haven''t described editing the printer configuration very much yet. It is a
    good function to leave to the Control Panel. The /etc/printcap file is not too
    difficult to master except when you have unusual printers or a complex network
    printer. Open the Print System Manager from the Control Panel and you get the
