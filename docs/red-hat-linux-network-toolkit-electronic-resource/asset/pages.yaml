- pgno: 84
  md: '# Chapter 2: Setting Up a Simple Network


    If your Samba server does not appear in your Network Neighborhood, you can sometimes
    find it with Microsoft Explorer. The following steps describe that method:


    +   - Click the Windows 95 Start button. It is generally located in the bottom
    left-hand corner of your screen.


    +   - Open the Find menu.


    +   - Open the Computer menu.


    +   - Enter the name of your Samba server or its IP address (in our example, 192.168.1.254)
    in the FindComputer dialog box. Click the Find Now button. If the Windows 95 Explorer
    finds your server, it displays an icon representing the server. You can double-click
    the icon and access the server''s resources just as you had accessed it through
    the Network Neighborhood. Network browsing requires the server to broadcast the
    fact of its existence. When you use the FindComputer process, the client tries
    to locate the server. Sometimes this works more readily than browsing.


    # Summary


    This chapter covers the following topics:


    +   - Re-configuring Windows 95/98 for Samba. I provide detailed instructions
    to help the novice as well as experienced user through the entire process.


    +   - Wiring your computers together. In these examples I use Thinnet coaxial
    cables because of their low cost and simplicity. However, you can readily use
    10baseT if you want.


    +   - Browsing the Samba resources from the Network Neighborhood. This capability
    gives you a way of seeing what is available and then connecting to it.


    +   - Using the Microsoft Explorer as another method for finding and attaching
    to Samba shares.'
  merge: -1
