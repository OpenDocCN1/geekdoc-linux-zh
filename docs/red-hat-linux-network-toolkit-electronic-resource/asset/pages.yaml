- pgno: 181
  md: '# Part II: Background


    +   * Configuring logical interfaces with phone numbers, login names, and passwords.


    +   * Configuring hardware interfaces with the device name, IP address, Netmask,
    broadcast address, a boot activate flag, and a BOOTP option. The boot activate
    flag indicates that you want the device to turn on when the system boots, and
    the BOOTP indicates that your computer gets its IP address from another source.


    +   * Adding, editing or deleting static routes. A route is an IP address to which
    you can send all packets meeting a certain criteria. The criteria are generally
    an IP address itself. For example, when you run dial in the next chapter, it sets
    up a default route to the PPP connection and thus the modem. All packets that
    cannot be directed to another route go to this. In your case, that means the Internet.


    Obviously, this is another powerful tool that I need to show you about. The preceding
    list just gives you a taste of the Network Configurator''s capabilities. In the
    following chapters, I show you how to put the Network Configurator to work.


    # SETTING THE TIME AND DATE


    Finally, you can set your system time and date from this window. The system time
    is not permanently set until you click the Set System Clock button.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_181_0.png)


    The Control Panel is a dynamic system that shows only the options that are available
    to you. For example, the Package Configurator is actually a link to the GLINT
    system, which is an RPM package. If you remove that package and run the Control
    Panel, no Package Configurator option is displayed. Reinstall it, and the options
    depend on what packages were installed by the Red Hat installation process by
    default and what packages you have added yourself — whether the initial installation
    process or individually since. For that matter, so do the default menu you get
    by clicking the left mouse button against the window background. If you install
    a package such as XV, the next time you restart the X Window system and open the
    Applications menu you will see it there.


    # Using LinuxConf


    When you login as root and run X, you can access the ControlPanel, shown in Figure
    5-10, by clicking on the Enlightenment window manager and selecting Start ▸ Programs
    ▸ Administration ▸ Control Panel. You must be logged in as root to perform most
    of the functions, however.'
