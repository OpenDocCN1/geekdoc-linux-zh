- pgno: 35
  md: '# Part 1: The Simple Client-Server Network


    7. Choosing the Red Hat software (called packages) to install.


    8. Answering the system configuration questions that Red Hat asks you about your
    network, time zone, mouse type, and so on.


    9. Configuring the X Window System, which is also known simply as X. X provides
    the platform for the graphical user interfaces (GUI) that Red Hat provides. The
    GUIs are GNOME and KDE and they provide the same functionality, and much the same
    look and feel as Windows Explorer.


    # Deciding How to Format your Disk


    You have the two choices for installing Red Hat Linux:


    +   - Shrink an existing DOS file system with the FIPS program and then install
    the Linux file system - ext2 - on the freed-up space. This approach creates multiple
    partitions on a single disk and allows you to run either Windows or Linux when
    you start the PC.


    +   - Format the entire disk for Linux, and run only Linux. You create a single
    partition using the entire disk and devote it to Linux. You cannot run any other
    operating system.


    > This book does not give instructions for installing Linux alongside an NT computer
    using NTFS.


    Table 1-1 summarizes your choices.


    | Method | Advantages | Disadvantages |

    | --- | --- | --- |

    | Single partition | Maximizes resources | Destroys existing data; requires dedicated
    disk |

    | Multiple partitions | Retain data | Less space for Linux; potentially more difficult
    installation |'
