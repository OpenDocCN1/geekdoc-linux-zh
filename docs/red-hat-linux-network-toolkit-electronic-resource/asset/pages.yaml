    /etc/rc.d/init.d/sendmail restart

    ```


    You should be able to test your system. While logged on as root, enter the

    command:


    ```

    mail robbush@myisp.com

    ```


    This is a simple e-mail client. Type whatever you want on the subject line, and

    everything that you type in is part of the message that you are composing.

    Finish the message by entering a period (.) as the first character on a line and
    then

    press the Enter key. Press the Enter key once more at the CC: prompt.


    If you have a PPP connection to your ISP, then your message should be deliv-

    ered immediately. Otherwise, your dialect program will make the connection and

    your message is delivered. Log on to your ISP account and check for your message.

    If it works, great, but if not, check the Troubleshooting section in this chapter.'
