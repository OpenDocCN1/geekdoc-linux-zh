- pgno: 78
  md: '# Configuring Samba


    Red Hat Linux comes with Samba. Recall that Samba was one of the optional components
    that I suggested you install in Chapter 1. The heart of Samba consists of the
    configuration file smb.conf installed in /etc by default, and the smbd and nmbd
    daemons. A *daemon* is a process that runs in the background in order to service
    requests on a continuous basis. Please refer to the discussion of daemons in Chapter
    3 for an explanation of what they do.


    > When Samba exports a directory for use by a computer or computers on the network,
    it is called a *Share*.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_78_0.png)


    You can update Samba by getting patches or entire distributions off the Internet.
    The mother of all Samba Web Sites is at the following address:


    http://www.samba.org


    This site also lists numerous mirrors (computers that make frequent copies of
    the central site''s files) that you should try to use of to lessen the burden
    on Canberra''s server.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_78_1.png)


    # Installing Samba


    If you did not install Samba during Chapter 1, then you can do so now. Red Hat
    provides a mechanism for installing software called the Red Hat Package Manager
    (RPM). It is discussed in more detail in Chapter 5.


    Log in as root and insert the Red Hat Publisher''s Edition CD-ROM into the CD-ROM
    drive. Enter the following two commands to install Samba:


    ```

    /mnt/cdrom

    rpm -lvh /mnt/cdrom/RedHat/RPMS/samba*

    ```


    This will install Samba on your system and also start the *smbd* and *nmbd* daemons.


    # Checking that Samba is running


    The Samba daemons, *smbd* and *nmbd*, should already be running. Samba has also
    installed a simple configuration file, /etc/smb.conf. It should be exporting one
    share, called *public*, to every computer on your network.'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'The heart of Samba consists of two programs – smbd and nmbd – that listen for
    SMB requests from clients and respond with SMB services. smbd handles file and
    print requests, nmbd handles browsing. In the recent past, they could also be
    run on an as-needed basis whereby a program that runs all the time, inetd, launched
    when they were called for. However, now smbd is only run as a daemon while nmbd
    can be launched by inetd but then will work as a daemon. I guess it is reasonable
    to run it from inetd in case the daemons stop, in which case it will be restarted
    the next time a request comes.


    The configuration file that is in place will export your home directory on the
    chivas by default. The process of modifying the smb.conf configuration file is
    given in Chapter 6.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_79_0.png)


    You can restart the daemons manually. However, you must do this as root, the all-powerful
    user. At the login prompt, enter the word root and its password.Then enter the
    following commands:


    ```

    /etc/rc.init.d/smb restart

    ```


    Verify the two Samba daemons are running by entering the following command:


    ```

    ps -x |grep mbd

    ```


    This command returns the following information on the Samba daemon processes:


    ```

    [root@chivas ~]# ips

    ps -x | grep mbd

    749 ? S 0:00 smbd -D

    758 ? S 0:00 nmbd -D

    763 p0 R 0:00 grep mbd

    ```


    Note that the grep process displays itself as well as the two Samba processes.
    That is because the string "mbd," which is used to filter out the text that you
    want to view, also catches itself.


    # Configuring Samba for encrypted passwords


    Windows 98, NT and newer versions of 95 use encrypted passwords. The default configuration
    of Samba is to use "user-level authentication. This means that every Samba share
    that you attempt to access will require that your Windows box send a username/password
    pair. If those passwords are encrypted, then you have to configure Samba to use
    encryption too.'
  merge: -1
  img_proc: true
- pgno: 80
  md: "# Chapter 2: Setting Up a Simple Network\n\nSamba encryption can be configured\
    \ as follows:\n\n+   1. Login as root.\n2. Edit the /etc/smb.conf file. If you\
    \ are unfamiliar editing Linux text files, then please consult Appendix A Introducing\
    \ it. Vi is a text editor that is found on nearly every Linux and UNIX computer.\n\
    3. Locate the two lines\n   - encrypt passwords = yes\n   - smb passwd file =\
    \ /etc/smbpasswd\n4. The semicolon (;) at the beginning of the lines means that\
    \ Samba treats them as comments. Remove the semicolon and the parameters will\
    \ become active. They should look like follows\n\n```\nencrypt passwords = yes\n\
    smb passwd file = /etc/smbpasswd\n```\n5. Create the /etc/smbpasswd file by entering\
    \ the following command\n`cat /etc/passwd | mksmbpasswd.sh > /etc/smbpasswd`\n\
    6. Create a password for root by running the smbpasswd command. You will be prompted\
    \ for the password. Enter the same password that you did while installing Red\
    \ Hat Linux in Chapter 1. In order for Windows to access the root user on the\
    \ Linux server both passwords will have to match.\n\n> Note that we are creating\
    \ a password for the root user because that is the only user that was created\
    \ automatically during the Red Hat Linux installation process. Chapter 6 describes\
    \ how to create Linux user accounts. Until then, the root user will be used for\
    \ these initial demonstrations.\n\n![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_80_0.png)\n\
    \n# Testing Samba\n\nIf you have a LAN running and have already connected your\
    \ Windows 95 and Linux-Samba box on, you can go directly to the Network Neighborhood\
    \ and start browsing. If this method doesn't work, enter the following command\
    \ to see the resources that Samba exports:\n\n```\nsmbstatus\n```\n\nIf you have\
    \ alreadyed the server, the public share is displayed. Otherwise, you see just\
    \ the header with the version number. However, this utility is very useful because\
    \ it shows what services (printers and files) clients are accessing."
  merge: -1
  img_proc: true
- pgno: 81
  md: "Red Hat supplies a Samba configuration file that comes with the RPM package.\
