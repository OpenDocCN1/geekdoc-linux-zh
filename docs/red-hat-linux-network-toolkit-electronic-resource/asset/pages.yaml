- pgno: 187
  md: 'Using the following instructions to compile a kernel:


    +   1. The GNU C compiler (gcc) must be ready. If you have not installed the necessary
    packages, login as root, mount the Red Hat CD-ROM and enter the following commands:


    ```

    rpm -ivh /mnt/cdrom/RedHat/RPMS/binutils*

    rpm -ivh /mnt/cdrom/RedHat/RPMS/cpp*

    rpm -ivh /mnt/cdrom/RedHat/RPMS/egc-1*

    rpm -ivh /mnt/cdrom/RedHat/RPMS/glibc-devel*

    ```


    +   2. You also need the Make utility. If necessary, you can install it as follows


    ```

    rpm -ivh /mnt/cdrom/RedHat/RPMS/make*

    ```


    +   3. The Linux kernel source code directory must be installed. Install them
    as follows:


    ```

    rpm -ivh /mnt/cdrom/RedHat/RPMS/kernel-headers*

    rpm -ivh /mnt/cdrom/RedHat/RPMS/kernel-source*

    ```


    +   4. To avoid confusion, the Red Hat kernel source package creates a symbolic
    link to your Linux source code directory. Thus, /usr/src/linux-2.2.12 has a link
    of /usr/src/linux which is easy to remember and. Keep in mind that if you manually
    upgrade your Linux version, you should delete and re-link to the new directory.
    This relinking can be accomplished by entering the following commands:


    ```

    cd /usr/src

    rm /usr/src/linux

    ln -s /usr/src/linux-2.2-12 linux

    ```


    +   5. Sophisticated source code tends to standardize the location of common functions.
    Include files store common variable and constant definitions and in such a file
    separate from the source code and therefore many different programs can use a
    common set of definitions. The Linux kernel source uses this method and looks
    in the /usr/include directory for such definitions. Therefore, symbolic links
    are used to point to these places and you must define them as follows:


    ```

    cd /usr/include

    rm -rf asm linux scsi

    ln -s /usr/src/linux/include/asm-i386 asm

    ln -s /usr/src/linux/include/linux linux

    ln -s /usr/src/linux/include/scsi scsi

    ```'
  merge: -1
  img_proc: true
