    # Separating your firewall from your private network


    The firewall system described in this chapter is a good compromise between maximum
    security and reasonable construction and maintenance costs. To take the next step
    up in security you will want to put your firewall on a separate network from your
    private network.


    This system requires a second network called the DMZ. The Internet gateway atlas
    will sit entirely on the DMZ while chivas will be connected to both the private
    and DMZ networks and act as both router and firewall. Figure 11-2 shows the topology
    of the networks.


