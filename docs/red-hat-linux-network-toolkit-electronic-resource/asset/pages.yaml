  md: '# Chapter 11: Building a Firewall 355


    # FOLLOWING A PACKET TO THE INTERNET


    If you want to understand how this new system works you should follow a packet
    from the Private network to the Internet.


    +   1. Let''s say that you are sitting at a cementeros on the Private network.
    You are using Netscape and clicking on your bookmark to my web http://www.swcp.com/~pgs/rhltoolkit.


    +   2. Netscape sends a hostname request to the Linux TCP/IP stack. The stack
    sends a request to the local DNS server 192.168.1.254. If the DNS server cannot
    resolve the name locally and then sends the DNS request to the default route.


    +   3. dial sees a packet show up on the default proxy interface 127.0.0.2 and
    fires up the modem, connects to the ISP and establishes a PPP connection.


    +   4. The local name server finds the numeric IP address from the ISP''s name
    server and returns it to the Linux workstation cementeros.


    +   5. Netscape sends the first HTTP packet to the TCP/IP stack on cementeros.
    cementeros sends the packet to its default route. The default route is configured
    to send all packets to 192.168.1.254. Thus, the packet goes onto the private network
    wire.


    +   6. chivas picks up the packet. chivas sees the packet as destined for an external
    network and sends it to its own default route.


    +   7. The ipchains system has a masquerading rule that converts every packet
    from the private network to the address of the default route NIC-192.168.32.254.


    +   8. The packet inherits the source address of 192.168.32.254. It goes onto
    the DMZ wire.


    +   9. atlas picks up the packet. atlas sees the packet is destined for the Internet
    and sends it to its own default address. The ipchains system has a masquerading
    rule that converts every packet from the DMZ network to the address of the default
    route nic - ppp0.


    +   10. The packet is routed through the ISP and finds its way to my web server.
    The web server processes it and sends it back to its source address. The source
    address is the masqueraded address of your ppp0 interface, which is most likely
    a dynamic address assigned by your ISP.


    +   11. The ipchains program on atlas sees that the packet belongs to a masqueraded
    connection. It restores de-masquerades the packet. The destination address is
    converted from one belonging to the ppp0 interface to 192.168.32.1.'
