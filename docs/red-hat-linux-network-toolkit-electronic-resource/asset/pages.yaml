    +   - IP address: 192.168.1.250


    +   - Netmask: 255.255.255.250


    +   - Default Gateway: 192.168.1.254 (An Internet gateway will be configured in
    Chapter 7. It will be given the address 192.168.1.254)


    +   - Primary Nameserver: 192.168.1.250 and/or your ISP''s name server (A local
