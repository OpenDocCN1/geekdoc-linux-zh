  md: '# Chapter 1: Installing Red Hat Linux


    Edition CD-ROM into the CD-ROM drive and reboot the computer. The following instructions
    detail the Red Hat installation process.


    Red Hat provides both a graphical user interface (GUI) and a text-based installation
    system. If you found that the text-based system works with a wider range of hardware
    than the GUI, I describe the text-based system here. Please use the GUI system
    if you wish–it is quite good. If you do it, then you may wish to use these instructions
    as a general guideline because the GUI follows the same sequences as the text-based
    system.


    For each step in the installation process, you see a different window. Most windows
    offer a sub-menu for selecting specific items, such as the type of CD-ROM drive.
    In other cases, however, you choose an option by selecting an onscreen button.
    Use the keys to select sub-menus. You toggle the buttons on and off by pressing
    spacebar. You can also select a highlighted button by pressing Enter. The Tab
    key and the Shift+Tab key combination move the control from one place to another
    in the menu window. The F12 key moves the control to the next window, saving whatever
    you have already made (with caution).


    Within the sub-menu, use the keys to choose specific items, such as the network
    adapter model. Press Tab and Alt+Tab to move between a sub-menu and the command
    buttons such as OK and Cancel.


    > CAUTION Unfortunately, the Red Hat installation system lacks an abort mechanism.
    After you start the installation, the system offers no way to exit gracefully.
    You must reboot.


    Linux makes use of a facility called a virtual terminal. A virtual terminal allows
    you to make your single computer screen work like several separate terminals.
    By pressing Alt+CTRL+F1 through Alt+CTRL+F5, you can switch among the different
    screens, each independent of the others. Red Hat takes advantage of this feature
    by providing different information about your installation process in each terminal.
    The following table describes the function of each virtual terminal:


    | Key Combination | Displays |

    | Alt+F1 | Installation progress |

    | Alt+F2 | The shell prompt |

    | Alt+F3 | Installation log |

    | Alt+F4 | System log |

    | Alt+F5 | Program output |'
