  md: '# Listing 6-4: The /etc/group file


    ```

    root::0:root

    bin::1:root,bin,daemon

    demon::2:root,bin,daemon

    sys::3:root,bin,adm

    am::4:root,adm,daemon

    tty::5:

    disk::6:root

    lp::7:daemon,lp

    mem::8:

    kmem::9:

    wheel::10:root

    mail::12:mail

    news::13:news

    uucp::14:uucp

    man::15:

    games::20:

    gopher::30:

    dip::40:

    ftp::50:

    nobody::99:

    users::100:

    ```


    +   1. First, add yourself to the users group (100) as shown in the following
    example (this is what Red Hat does when you use its Control Panel User Configuration
    process, and I want to stay consistent with it)


    users::100:lidia


    Notice the now-familiar nobody group that you have been using in the Samba configuration
    examples up to this point.


    +   2. Next, add a line for your personal group at the bottom of the file, like
    the following example


    lidia::500:lidia


    +   3. Save and exit the file.


    +   4. The next step is to create a home directory for your new user. Red Hat
    likes its users to live in the /home directory. I have no objection to this convention,
    so enter the make directory command, as in the following example


    ```

    mkdir /home/lidia

    ```


    +   5. You need to copy some supporting files, such as the bash initialization
    script -.bashrc – to the new home directory. You can use a skeleton'
