    # INSTALLING AND CONFIGURING SECURE SHELL


    Secure Shell requires that the machine be connected to–the server–runs ssh2 daemon.
    You can connect to that machine from any other machine–the client–by using ssh2
    client program once that you have configured both the client and server. The following
