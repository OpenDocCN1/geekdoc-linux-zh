    connect a matching Windows client to it. Macros really simplifies the smb.conf
    file setup, because you can adapt one section to numerous situations. If you have
    numerous shares to distribute (or are just plain lazy like me), this option is
    for you.


    # Adding network printers using Linux and Samba


    No client-server network is complete without a shared printer. Sharing printing
    gives you a lot of bang for your client-server buck. If you fold the services
    of size five $200 printers into one $1,000 printer, you come ahead. You have less
    maintenance, lower overhead costs, maybe less initial cost, and probably better
    overall performance. It''s a win-win situation.


    Before you configure Samba to share a printer you must first configure a printer.
    The following sections describe how to use Samba''s Printool to do that.


    # CONFIGURING A LOCAL PRINTER


    Configuring a printer that is attached to a Linux computer is a straightforward
    process. The following instructions describe how to do it.


    +   1. Log in the Linux server chivas as root.


    +   2. Attach a printer to your Linux computer''s parallel (printer) port.


    +   3. Start the Control-Panel by clicking on the GNOME start ''System'' Control
    Panel. The GNOME start button is the little footprint in the lower left-hand corner
    of your screen. It is similar in function to Windows'' Start button.'
