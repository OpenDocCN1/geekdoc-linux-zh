    # Method 2: Installing Linux by itself (destructive)


    This is the method used in this book.


    Using the entire hard disk for Linux is straightforward and conceptually simple.
    Whatever partition(s) you have written over, destroying all the data on your disk.
    For this discussion, I assume that you have only one partition, which is typical
    of DOS and Windows installations.


    # MAKING A BOOT FLOPPY


    It is generally necessary to create a boot floppy in order to start the Red Hat
    installation process. The floppy disk contains a basic Linux kernel and file system.
    The file system provides a foundation from which the kernel can operate; it is
    essential to Linux''s operation.) When you start your computer the boot floppy
    loads the basic Linux operating system and then starts the installation.


    Newer computers have the ability to boot directly from the CD-ROM. If you have
    such a machine (you can tell by looking in the BIOS setup for the boot options),
    then it is not necessary to make a boot floppy. You can start the Red Hat installation
    process by booting off the Red Hat installation CD-ROM. Change your BIOS setting
    to allow booting from the CD-ROM, save the setting, insert the CD-ROM and reboot
    your computer. You should see the start of the Red Hat installation process as
    described in the section "Installing Red Hat Linux" in this chapter. You can,
    of course, skip all of the instructions related to the boot floppy.


    The Red Hat CD-ROM, the directory D:\IMAGES contains a number of files that are
    images of a Linux kernel and file system. A program called RAWWRITE—which you
    find in D:\DOSUTILS—transfers your kernel and basic file system image—containing
    the most essential system and application programs—byte-for-byte onto the floppy
    disk. When that disk is inserted into your floppy drive and you reboot your computer,
    Linux takes control and copies the file system into your system memory (ramdisk),
    and the Red Hat installation program starts. Then you can install a complete Linux
    system.'
