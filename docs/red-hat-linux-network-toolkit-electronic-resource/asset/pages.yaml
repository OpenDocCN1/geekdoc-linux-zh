  md: "# # Appendix B\n\n# # Dynamically Assigning IP Addresses\n\nTHE EXAMPLE NETWORKS\
    \ used in this book use static IP addresses. This is reasonable for small to medium\
    \ sized networks – class C networks – where workstations are stationary. However,\
    \ if you use laptops, or you intend to move your computers around, then you might\
    \ want to use dynamic IP addresses.\n\nYou can use the Dynamic Host Configuration\
    \ Protocol (dhcp) to assign IP addresses to any or all of the computers on your\
    \ network. This appendix describes a simple dhcp example where mobile Windows\
    \ and Linux computers use a portion of the 192.168.1.0 subnet.\n\n# # Installing\
    \ dhcpd\n\nIt is necessary to install the dhcp on a server. In our example network,\
    \ the server chivas is used for this function.\n\n+   1. Log in chivas as root.\n\
    2. Mount the Red Hat CD-ROM.\n3. Install the dhcp server.\n4. Create the /etc/dhcpd.conf\
    \ file and enter the following information:\n\n```\nrpm -ivh /mnt/cdrom/RedHat/RPMS/dhcpd*\n\
    option routers 192.168.1.254;\nshared-network PAUNCHY.NET (\n  subnet 192.168.1.0\
    \ netmask 255.255.255.0 (\n    range 192.168.1.40 192.168.1.50;\n  )\n```\n\n\
    The first section describes the range of IP addresses, within the class C subnet\
    \ 192.168.1.0, that will be used by the dhcp clients.\n\n+   5. Create the /etc/dhcpd.leases\
    \ file\n\ntouch /etc/dhcpd.leases"
  merge: -1
  img_proc: true
- pgno: 435
  md: 'You don''t need to put anything into this file. The dhcpd daemon dynamically-puts
    information about the computers getting their IP addresses through dhcp. Those
    addresses are called – surprisingly –leases.


    +   6. Start the dhcpd server


    ```

    /etc/rc.d/init.d/dhcpd start

    ```


    Your dhcp server chivas is now ready for Windows and Linux computers to get their
    IP addresses and routing information.


    # Configuring Linux as a dhcp Client


    You only need to modify the /etc/sysconfig/network-scripts/ifcfg-eth0 file to
    make a Linux boot look like the dhcp server for its network configuration. The
    file should look as follows:


    ```

    DEVICE=eth0

    BOOTPROTO=dhcp

    ONBOOT=yes

    ```


    You can also use LinuxConf to modify your Ethernet NIC. Open up the network host
    configuration window and click on the dhcp radio button.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_435_0.png)


    The next time you boot your Linux computer, or restart the /etc/rc.d/init.d/network
    script, you will obtain the IP address, netmask, broadcast address and routing
    information from the dhcp server.


    If you manually modify the ifcfg-eth0 file you do not need to remove the static
    IP information. If you modify the PROTOCOL parameter to use dhcp your system will
    ignore the static information and pick up its parameters dynamically. However,
    your computer will revert to using the static parameters if the dhcp service is
    unavailable.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_435_1.png)'
  merge: -1
  img_proc: true
- pgno: 436
  md: "# Appendix B: Dynamically Assigning IP Addresses\n\n# # Configuring Windows\
    \ as a dhcp Client\n\nSetting up a Windows computer to use dhcp is very simple.\n\
    \n+   1. Log in to your Windows computer. (NT systems require you to log in as\
    \ the administrator).\n2. Open the Network Configuration dialog box.\n   Start\
    \ -> Control Panel -> Network\n3. Open the TCP/IP properties dialog box.\n4. Click\
    \ the IP Address tab.\n5. Click on the \"Obtain an IP address dynamically\" radio\
    \ button.\n6. Click OK.\n7. Click the OK button in the Network dialog box.\n8.\
    \ When you are asked if you want to restart your computer OK.\n9. When your Windows\
    \ computer restarts again it will be assigned an IP address between 192.168.1.40\
    \ and 192.168.1.50; the address will be the first time that you use this system.\
    \ You can prove this to yourself by looking at the /etc/dhcp.aliases file and/or\
    \ pinging the 192.168.1.40 address.\n\nYour Windows computer will now obtain its\
    \ address from the dhcp server on your network. For instance, you can now use\
    \ your laptop on your both your home and work network (if they use dhcp) without\
    \ reconfiguring it each time.\n\n# # Summary\n\nThis appendix introduces dhcp\
    \ by giving very simple examples. Please refer to the dhcpd and dhcpcd man pages\
    \ and the documentation in /usr/doc/dhcpd and /usr/doc/dhcpcd for more information."
  merge: -1
