    Eight run levels exist. A runlevel defines the types of processes that the system
    will execute. Run level S, for instance, the single-user mode and is used to perform
    tasks that cannot be interfered with. Run level 3 is the normal operating mode.
    The init manual page describes run levels in detail.


    As shown in Table 4-2, Red Hat Linux has seven execution levels. For the startup
    phase, after the boot phase in the startup process, the kernel runs at the Single
    User level (level 1) so it can complete all the necessary startup tasks before
