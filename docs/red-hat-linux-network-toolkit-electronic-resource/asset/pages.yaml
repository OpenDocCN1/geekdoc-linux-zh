- pgno: 92
  md: '# Microsoft’s Network Troubleshooter


    In this section, the Network Troubleshooter is described in more detail. As you
    may have guessed, I like it both as a basic problem-solving tool and as a teaching
    aid. Further examination is helpful to your education in the art and science of
    systems administration.


    The first menu in the Network Troubleshooter offers a synopsis of all the primary
    problems that you can encounter with Windows networking. Figure 3–9 shows the
    menu.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_92_0.png)


    **Figure 3-9:** The Network Troubleshooter, again.


    The first menu helps you identify what your general problem is. To work toward
    a solution, the Troubleshooter queries you further in order to traverse a fault
    tree and solve the problem.


    If the Troubleshooter fails, consider the following possible causes for the problems
    with your network:


    +   * A duplicate computer name exists on the network.

    * You forgot your network password.


    +   * A problem unknown by the Troubleshooter occurred – it could have nothing
    to do with the network.


    The Troubleshooter contains lots of information. Much of it is repetitive, of
    course, but if you follow the logical structure, you can see how it thinks. The
    logic is general and can be adapted for solving almost any technical problem.


    The Troubleshooter cannot solve every problem. But even in those cases, it still
    serves its purpose. Sometimes, it is useful to know what you don’t know. In those
    cases, the Troubleshooter narrows down the areas that you must search and frees
    up your resources to look elsewhere.'
  merge: -1
  img_proc: true
