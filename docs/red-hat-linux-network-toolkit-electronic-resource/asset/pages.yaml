- pgno: 120
  md: '# Chapter 4: Looking Under the Hood


    +   * Character and Block device files serve as the interface between the Linux
    operating system and the hardware devices. Character devices are accessed sequentially,
    a byte at a time; a serial port is a character device. Block devices— for example,
    disk drives— are accessed in chunks of bytes; you get a block (that is, 1,024
    bytes) of data at one time. In a long listing, a lowercase c precedes the name
    of each Character device file, and a lowercase b precedes the name of each Block
    device.


    +   * The named pipe or FIFO (first-in-first-out) is a file that enables processes
    to communicate with each other. FIFOs are created with mkknod program and are
    designated by a p at the beginning of a long listing.


    +   * The pipe file is an abstraction that enables processes to communicate with
    each other. Pipe files actually act as sections of memory used to buffer the data
    going from one process to another. Pipe files are denoted as a vertical bar (|)
    and placed between two processes. For example, command ls -l | lists the device
    directory one page at a time by piping the output of ls to the paging command


    +   * Sockets facilitate communication between processes via the network.


    +   * Hard links create additional names for a file. They are indistinguishable
    from the original file. The ln command creates hard links.


    +   * Symbolic or “soft” links are files that contain the name of another file.
    They essentially point to that file. When a symbolic link is encountered by the
    kernel during the interpretation of a pathname, the pointer that the link contains
    is used as a new starting point. When you do a long listing—/bin/ls -l—on a symbolic
    link you see it displayed with an arrow pointing to the target file, as follows:


    ```

    mylink -> test.txt

    ```


    For instance, if file TEST.TXT contains the characters rz and you enter the command
    more mylink you see the string rz displayed. This is because the symbolic link
    points to a text file TEST.TXT.


    For another example, gzip is a GNU program used to compress data and files. If
    you want to decompress a file, you can use the command gzip -d or the command
    gunzip, which is a symbolic link to the command gzip -d (gzip looks at how it
    is called in order to determine its action).'
  merge: -1
