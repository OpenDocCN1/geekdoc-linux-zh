- pgno: 100
  md: '# Chapter 3: Troubleshooting


    192.168.1.0 refers to my local network. The gateway is the address (computer or
    router) where the packets need to be sent so they can find their way to their
    destination. In the case where the destination is the local network, then the
    0.0.0.0 means "no gateway." The genmask is used to separate the parts of the IP
    address that are used for the network address from the host number (more on that
    in Chapter 10). The flags are used to indicate things like U for up and G for
    gateway. The metric is used as a measure of how far a packet has to travel to
    its destination (a number greater than 32 is considered to be infinite). The next
    two flags—Ref and Use—are not important for this discussion. Finally the Iface
    is self-explanatory.


    Listing 3-4: Routing table displayed


    | Destination | Gateway | Genmask | Flags | MSS | Window | Iface |

    |---|---|---|---||-|----||

    | 192.168.1.0 | 0.0.0.0 | 255.255.255.0 | U | 1500 | 0 | eth0 |

    | 127.0.0.0 | 0.0.0.0 | 255.255.255.0 | U | 3584 | 0 | lo |


    You must have a route to the loopback interface (also referred to as lo), which
    is the 127.0.0.0 address.


    If you are missing either or both parameters, you must set them. To set the loopback
    device—which must be set for the network adapter to work—enter the following command:


    ```

    route add -net 127.0.0.0

    ```


    To set the route for the network adapter and your local network, enter the following
    command:


    ```

    route add -net 192.168.1.0

    ```


    This route is assigned automatically to your network adapter. However, if you
    wish to assign it explicitly, enter the command as follows:


    ```

    route add -net 192.168.1.0 dev eth0

    ```


    Run netstat -r -n to see your routing table. You should see entries for the loopback
    and the Ethernet, as shown in Listing 3-4.


    If you do not have a route to your network interface, repeating the preceding
    steps. You may have to delete a route. To delete a route, enter the following
    command:


    ```

    route del 192.168.1.0

    ```


    If the network adapter is configured correctly and the routing is correct, check
    the network. The best way to do this is to ping the loopback interface first and
    then'
