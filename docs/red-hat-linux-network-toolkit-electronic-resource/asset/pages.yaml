    consider this option. The spare can be in the form of a computer normally used
    for another function that would substitute for your primary server when necessary
    or a computer that is specifically set aside for purpose.


    You need to know how to switch your ready server. Without going into the details,
    you need a plan for implementing your server. The main problem is how to synchronize
    your file system. In some cases you should be able to place your old disk in the
    ready server. If that is not possible, you either have to use your old backups
    or transfer the file system directly—that is, over the network with tar, cpio,
    or another program. The idea is to make the change to the new system as transparent
    to the user as possible.


    After you decide how to make the switch, it is best to practice for it. The amount
    of practice you need depends on the complexity of your entire network. When I
