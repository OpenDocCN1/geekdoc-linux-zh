    Linux uses a set to determine when each program is run, how long it runs, and
    which program takes precedence over the others. The Linux tries to give each process
    its fair share of CPU time, based on a priority given to each process (you can
    manually change the priority with the *nice* command). The priority of a process
    is determined by a number of system parameters. The Linux kernel also transfers
    parts of or entire programs from disk and memory, keeping track of the details
    for each program. Thus, if you want to run a clock program and a nuclear reactor
    control program, the kernel should schedule the control program to run before
    the clock and for longer segments of time.'
