- pgno: 400
  md: '# Chapter 12: Securing your Server 371


    +   * Port scan. This is the process where nmap sends TCP, UDP and ICMP packets
    with various settings to a host or entire network and the response is monitored.
    nmap can determine what ports are available (listening) depending on what the
    response is.


    +   * Fingerprinting. A variation of the port scan sends out packets of varying
    type and setting. The responses can be correlated to determine what operating
    system is running on the target.


    When you put all three (especially the latter two) functions together, you can
    gather a great deal of information about individual machines and the entire network.
    The more you know about a network, the more possibilities there are for attack.
    You should know at least as much about your network as an intruder, and nmap can
    help you do that.


    nmap is a difficult system to master, because it takes a good understanding of
    the underlying TCP/IP protocols to make complete sense of the information that
    it can give you. The following examples are meant to give you a sense of what
    nmap can do and how to use the results (the ping function is useful but is skipped
    over in this discussion for the sake of brevity).


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_400_0.png)


    Most of the interesting scans must be performed as root.


    # PORT SCAN YOUR LINUX SERVER


    Log in as root on your Linux Internet gateway - atlas and install the nmap package.


    ```

    rpm -ivh /mnt/cdrom/security/nmap*

    ```


    Running the following nmap scan against yourself.


    ```

    nmap -S 192.168.1.254

    ```


    This IS SYN scan. It sends the first part of a TCP handshake used for opening
    a TCP connection such as a Telnet session. When a response is sent, nmap sends
    another-packet that immediately clears the connection. The result is that you
    can get a response from all active ports and the target system probably doesn''t
    log any of the partial connections. It means you get the information but probably
    don''t leave any trace.


    The results from the default Red Hat installation without any firewall are as
    follows.


    Starting nmap V. 2.07 by Fedora (fyodor@dhp.com).


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_400_1.png)'
