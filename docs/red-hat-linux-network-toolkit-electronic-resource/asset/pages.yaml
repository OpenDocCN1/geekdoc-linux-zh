- pgno: 343
  md: '# Creating a null backup


    The Arkeia documentation recommends configuring a null device to begin with. This
    is a good idea because it eliminates the need to deal with actual devices and
    their messy details, thereby letting you focus on overall system installation
    and configuration. It''s also an excellent way to learn the system. A null device
    in this case means the Linux device /dev/null. This is a standard mechanism that
    UNIX systems send output to when the output is not to be saved or otherwise acted
    upon. The binary stream copied to the /dev/null file is simply discarded.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_343_0.png)


    You can obtain help information at any time by clicking the information icon in
    the extreme upper left of the Arkeia GUI. It provides help related to the window
    that you are currently viewing.


    +   1. Log in as root on chivas.

    2. Run the following command to start the Arkeia GUI


    /usr/knox/bin/arkx


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_343_1.png)


    When you install the arkeia-gui RPM it installs the shell script /usr/bin/ARKEIA.
    You can start the GUI by entering ARKEIA from the command line.


    +   3. Next you''ll see the introduction window as shown in Figure 10-1. Please
    note that in the Arkeia interface, the green checkmark button serves the same
    purpose as Windows'' OK button—it indicates that you want to accept what you''ve
    entered in the window and move on. The red X button is the same as a Windows Cancel
    button—it indicates that you want to close the window and discard your changes.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_343_2.png)


    Figure 10-1: The Welcome to Arkeia window'
  merge: -1
  img_proc: true
- pgno: 344
