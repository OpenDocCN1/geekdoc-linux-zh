    # Using nmap


    The nmap program is a powerful security tool. It can be used for good purposes
    or not. It can be used against you, since it can be obtained off the Internet,
    and you should use it to protect your network.


    > You should not, under any circumstances, use nmap to scan machines that you
    do not control, or have permission to scan. Using nmap in an unauthorized manner
    is similar to walking up to a house and rattling the door. It is okay to test
    your own door, but not someone else''s.


    nmap does three things: simple and flexible pings, port scans, and computer fingerprinting.
    The functions are as follows:


    +   Pings. You can use nmap to see what machines are up on a network. The ping
    program sends out simple ICMP packets and displays their response. It is a workhorse
    for system administrators who want to see if a network device is alive.'
