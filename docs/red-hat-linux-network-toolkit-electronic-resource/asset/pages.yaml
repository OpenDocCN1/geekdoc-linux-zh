  md: '# Chapter 12: Securing your Server


    At that point your Secure shell is ready to accept connections from

    clients. However, you still need to configure your client.


    INSTALLING SECURE SHELL ON THE CLIENT COMPUTER Only the Secure Shell

    base (ssh2) and client package (ssh2-clients) need to be installed on a client

    computer. In this example, chivas, the Linux file and print server, is used as
    the

    client.


    +   1. Log in to chivas as root.


    +   2. Install the Secure Shell base and client RPMs as follows.


    ```

    rpm ivh /usr/local/src/ssh2 2*

    rpm -ivh /usr/local/src/ssh2-clients-*

    ```


    +   3. While the ssh2 base package is installing it will generate the client''s
    keys.

    However, you will need to generate your own user keys. In this example the

    user frankcastle is used. Create that user with the useradd frankcastle

    command and create a password. Change to that user with the su -

    frankcastle command and run the following command.


    ```

    ssh-keygen2

    ```


    +   4. The computer will spend more time generating the user''s public and private
    keys. It will prompt you to enter a pass phrase, which is the Secure

    Shell equivalent of a password. The phrase can be up to 20 characters

    long, and can include space characters. Use your good judgment in creating-

    a good password.


    +   5. Once you enter the pass phrase, ssh keygen2 places the public and private
    keys in the .ssh2 directory (which it creates). That directory is placed

    the user''s home directory which, in this case, is /home/frankcastle.

    The public file is called id_dsa_1024_a.pub and the private one is

    id_dsa_1024_a. Once again, the public file can be transported across

    the network, while the private one should be kept secret.


    +   6. Next, you need to create an identification file on the client. That file

    tells the ssh2 client where to go to find its private key -id_dsa_1024_a in

    inthis case. From the user''s home directory, change to the .ssh2 directory.


    ```

    cd ~/.ssh2

    ```


    +   7. Enter the following command to create the identification file.


    ```

    echo IdKey_dsa_1024_a > identification

    ```


    The contents of /home/frankcastle/.ssh2/identification file will be

    as follows.


    IdKey_dsa_1024_a *'
