- pgno: 162
  md: '# Chapter 5: Configuring Red Hat Linux


    You can also determine what RPM package a file — for instance, bash — be- longs
    to as follows:


    ```

    rpm -qf rpm qla |grep i bash

    ```


    The command string within the "backwards" quotes ('''') indicates that the Linux
    shell — bash in most cases — is to execute the command(s) and feed the results
    into the overall command. The vertical bars (|) indicate the output of one command
    to the input of an- other. In this case, the command between the ticks extracts
    all of the files contained by all of the installed RPM packages and filters out
    all those that contain the string "bash". That output is sent to the rpm -qf command
    which will tell you which package owns the file. The output of this example shows
    several packages, including the bash-1.14.7-16 RPM, could own a file called "bash".


    # INSTALLING PACKAGES


    One of the most common systems administration functions is adding and removing
    software packages to a computer. Adding and deleting software is generally im-precise
    and often difficult administrative function, so get used to it. Fortunately, RPM
    makes this fact of systems administration life much easier.


    There''s not much to worry about with RPM. Just choose the package, enter the
    parameters, and hit the Return key. RPM tells you if you have any problems. Generally,
    RPM stops execution if it encounters problems, but in some cases it prompts you
    for additional information and continues. The following examples cover many possibilities.


    First, you should get an overview of which packages are available. You need to
    mount the Red Hat CD-ROM, if it is not already mounted. To mount the CD-ROM, log
    in as root and enter the following command:


    ```

    mount -r -t iso9660 /dev/cdrom /mnt/cdrom

    ```


    If you used a CD-ROM to install Linux, Red Hat created an entry in /etc/fstab
    fstab stands for filesystem table and stores the mounting information for all
    drives on your system. You can save yourself some work when you mount drives by
    giving the command name of the drive''s mount point as a parameter. Therefore,
    you can mount the CD-ROM by entering the command:mount=/mnt/cdrom.'
  merge: -1
  img_proc: true
- pgno: 163
  md: "# Part II: Background\n\nEnter the following command to list the RPM packages\
    \ on the CD-ROM:\n\n```\nls -l /mnt/cdrom/RedHat/RPMS\n```\n\nYou will see several\
    \ screens of RPM packages.\n\n> > TIP If you are using Gnome and insert a CD-ROM,\
    \ the Gnome RPM gui will be launched automatically. That gui performs all of the\
    \ functions that the rpm command can do. \n\n# INSTALLING THE C COMPILER\n\nIn\
    \ this section you are shown how install some packages that you'll need in the\
    \ future - such as the GNU Make package and C compiler (gcc). The packages that\
    \ you have used so far have come precompiled, but you often need to compile programs\
    \ from their source. One huge advantage that Linux has over commercial UNIX is\
    \ that it comes with source code without strings attached. The RPM system is wonderful,\
    \ it doesn't include everything you need. Consequently, you will need to compile\
    \ software directly into the kernel.\n\nAn essential utility to the compilers\
    \ is the make facility. A make file is used to semiautomate the compilation -\
    \ and often the installation - of a software package. It can be used not only\
    \ compile software but also to install it and keep up-to-date. In this way, it\
    \ is similar to RPM.\n\nLeave that for now, and install the RPM make package by\
    \ logging on as root and entering the following commands (note that substituting\
    \ the asterisk for the numeric version number requires having to enter the full\
    \ name):\n\n```\nrpm -i -v /mnt/cdrom/RedHat/RPMS/*\n```\n\nMany files created\
    \ by the Make utility require the GNU C compiler (gcc), so you need to install\
    \ gcc and its pre-compiler gcc. If you look the Red Hat CD-ROM RPM directory and\
    \ look for gcc, you can see that it is there (/mnt/cdrom/RedHat/RPMS/egcs-1.1.2-24.i386.rpm).\
    \ Go ahead and install it by entering the following commands (note that the i,\
    \ v, and h parameters have been combined):\n\n```\nrpm -ivh /mnt/cdrom/RedHat/RPMS/*.rpm\n\
    ```\n\n```\nrpm -ivh /mnt/cdrom/RedHat/RPMS/egcs-1*.rpm\n```\n\nMost C programs\
    \ need some additional libraries. Enter the following command to install the following\
    \ library:\n\n```\nrpm -ivh /mnt/cdrom/RedHat/RPMS/glibc-dev*\n```"
  merge: -1
