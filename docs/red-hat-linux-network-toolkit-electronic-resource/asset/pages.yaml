- pgno: 390
  md: '# Chapter 12


    # Securing your Server


    IN THIS CHAPTER


    +   - Adding active security measures to your network

    - Detecting security problems before they occur with SATAN, crack, and tripwire

    - Adding passive security measures to your network

    - Increasing security and reducing the load on your Internet connection

    - Removing all unnecessary daemons and applications from your firewall server


    YOU CAN NEVER "FINISH" UP your security. As you grow as a systems administrator/security
    monitor, you can add to the picture as you see fit. This chapter guides you through
    the process of layering security. You add both active and passive security measures
    to your network. Placing security-oriented software – active systems – on your
    critical servers, atlas and chivas, starts the process. You then refine the configuration
    – passive measures – of your servers in order to further enhance your security.


    # Layering your Security Measures


    The concept of layered security was introduced in Chapter 9. The idea is to put
    as many layers between you and the bad guys as you can.


    Determining exactly how to layer your security is a difficult process. Install
    too few layers and you''ll end up compromised. Put in too many, and you''ll end
    up reducing safety and the usability when your system becomes too complex to manage
    effectively. The complexity and size of your network and the type of users you
    support will determine what you need.


    This chapter introduces some straightforward measures that will enhance your security
    without overwhelming you.'
  merge: -1
  img_proc: true
- pgno: 391
  md: '# Adding Active Security to your Network


    The tripwire and nmap systems, introduced in Chapter 9, are two useful programs
    to start building security into your network. Recall that tripwire uses the MD5
    (message digest algorithm) to calculate a checksum on important system files (any
    file you wish to check, actually). These checksums can be periodically compared
    to the current files to see if any files have been changed to possibly hide a
    Trojan horse. nmap scans the hosts on your network to discover what operating
    systems they are running and what services they are providing.


    In addition to presenting tripwire and nmap, this chapter introduces the crack
    system. It checks your passwords against words that can be found in dictionaries.
    By using crack, you can proactively protect your system from trivial or easily
    guessed passwords.


    # Using tripwire


    tripwire is available as an RPM package on this book''s CD-ROM. It is generally
    not considered good security practice to install a binary (especially of a code
    that is used for security itself!) rather than compile source code. The worry
    is that the binary can more readily hide viruses and back doors (fixed passwords
    or other entrances known to the designer of the executable code) than source code.
    However, I consider Red Hat to be a reliable source and trust them to have taken
    every reasonable precaution. Therefore, I have installed it on my system but leave
    it up to you to decide whether you accept my reasoning. If you wish to obtain
    the source code, it is available from Sun.


    I use tripwire on my File Server/Router. In my network, this is the most important
    computer, so I want to keep it as secure as possible. tripwire can also be configured
    to check other computers on the network (for example, the Firewall Server), so
    long as it has access to the firewall network, it can be placed anywhere. The
    following instructions detail the installation of tripwire:


    +   1. Log in to atlas as root.

    2. Mount your IDG supplemental CD-ROM:

    mount /mnt/cdrom

    3. Install tripwire by entering the following command:

    rpm -ivh /mnt/cdrom/security/tripwire-*.rpm

    tripwire is installed into the directories:

    /etc/cron.daily/tripwire.verify

    /etc/tw.config

    /usr/doc/tripwire-1.2-1'
