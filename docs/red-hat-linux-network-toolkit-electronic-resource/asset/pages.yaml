- pgno: 200
  md: '# Chapter 6: Learning Samba by Example 171


    +   * Other than the global section, each section defines a specific service.
    Each section begins with a name enclosed within square brackets – for example,
    [home] – and continues until the next section appears or the end of the smb.conf
    file defines services.


    +   * You specify a parameter with the following syntax:

    name = value


    The name can be one or more words separated by spaces. The value can be Boolean
    (true or false; yes or no; 0 or 1), numeric, or a character string.


    +   * Comments are preceded by a semicolon (;) and can appear either as a separate
    line or after a name-value pair.


    +   * You may continue lines from one to another by placing a backward slash (\
    as the last character on the line to be continued.


    +   * Section and parameter names are not case-sensitive. For example, the parameter
    browseable = yes works the same as browseable = YesS.


    # EXAMINING THE SMB.CONF FUNCTIONS


    The smbd and nmbd daemons read the smb.conf configuration file when they are started
    (usually at boot). The configuration file tells these daemons which shares to
    export, to whom the shares should be exported, and how to export them. The term
    export means to make available a service or share to one or more clients over
    the network. Because security is always a top priority, you must specify which
    computers can access a share. The smb.conf file offers tremendous flexibility
    for specifying precisely who has access to each service. As your Linux network
    grows, this becomes increasingly important.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_200_0.png)


    > You may already be familiar with Novell or NFS networks. They both share, export,
    directory and print services to clients on the network. In this way, their function
    is the same as Samba''s.


    # EXAMINING THE SMB.CONF STRUCTURE


    The smb.conf file has three main parts:


    +   * The global parameters

    * The directory shares section – including the standard [homes] section

    * The printer shares section


    The global parameters, as you may guess, set the rules for the entire system.
    [homes] and [printer] sections are special instances of services. The term services'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'is the Samba terminology for the directories to be shared or exported with
    the network clients. The services define who should be able to access them and
    how. Listing 6-1 shows a summary of the Red Hat default smb.conf file.


    # Listing 6-1: The smb.conf structure


    ```

    [global]

    workgroup = MYGROUP

    server string = Samba Server

    printcap name = /etc/printcap

    load printers = yes

    log file = /var/log/samba/log.%m

    max size = 50

    security = user

    socket options = TCP_NODELAY SO_RCVBUF=8192 SO_SNDBUF=8192

    dns proxy = no


    [homes]

    comment = Home Directories

    browseable = no

    writable = yes


    [printers]

    comment = All Printers

    path = /var/spool/samba

    browseable = no

    guest ok = no

    writable = no

    printable = yes

    ```


    In the global section of the example in Listing 6-1, the printers are the first
    to be shared. This example specifies BSD – Berkeley style printing (is more about
    BSD style printing a later in this section.) The standard /etc/printcap is the
    printer definition file, and the Boolean variable (it can only be yes or no -
    true or false) load printers says that all printers can be browsed on the network.
    These three lines in the global section set the printing for the entire Samba
    system.


    The /etc/printcap file contains the configuration information for the Linux printers.
    In Red Hat Linux, the lpd daemon reads the printfile for its configuration information.
    It then monitors the system for print requests and manages the printing process.


    The [global] section also defines where the log and lock directories are located.
    The log files are useful for troubleshooting problems and for tuning your system.
    The lock files prevent multiple users from overwriting the same files.'
  merge: -1
