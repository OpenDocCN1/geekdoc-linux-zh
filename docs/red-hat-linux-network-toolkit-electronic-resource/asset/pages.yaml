- pgno: 86
  md: '# Chapter 3


    # Troubleshooting


    IN THIS CHAPTER


    +   * Understanding the philosophy of troubleshooting

    * Solving an example problem by using the Microsoft Troubleshooter

    * Examining the Microsoft Troubleshooter fault tree

    * Diagnosing the client-server network using Paul''s Troubleshooter


    FIXING PROBLEMS WITH COMPUTERS and networks is the one constant job of systems
    administration. The primary job of a systems administrator is to minimize problems
    by designing and managing the network properly and anticipating problems. That
    is why you need a tape backup drive on a server, and use it regularly to back
    up your data. Because you can''t predict everything, however, you must learn how
    to deal with problems as they occur.


    Troubleshooting is more an art than a science. The more intimately you know your
    system, the easier it is to deal with problems. Some people can see a problem
    and its solution better than others. Unfortunately, you can''t teach talent. However,
    the art of systems administration also includes some fairly simple science. You
    need to deal with any problem that arises in a systematic fashion. work, from
    the simple to the complex, until you solve the problem.


    Chapters 1 and 2 guide you through the process of installing Red Hat Linux and
    creating a simple client-server network. However, that simple network has tens
    of thousands of lines code. The network has many subsystems – disks, memory, interface
    cards, wires and as well as all interacting protocols (for example, udp, tcp,
    icmp, ip). Things need to work together in precisely the right way, and just one
    bad part can prevent that simple system from working. If something goes wrong
    and the network doesn''t work, how do you fix it? The best way is to identify
    exactly what is causing the problem and eliminate each possible cause, one by
    one. This chapter describes some basic methods for solving problems this way.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# Troubleshooting with the Fault Tree


    The better you know your system, the greater the likelihood that you can fix it.
    You learn by struggling to get the simple things to work and then you struggle
    with the more complex problems. I have set up dozens of networks in my career,
    not surprisingly I encountered some problems that I had never seen before I was
    writing the example in Chapter 1. By solving those problems, I gained additional
    insights about my own system, and I can solve problems just a little better than
    before. You never stop learning.


    The formal model that I use for understanding troubleshooting is the fault tree.
    In a fault tree, the trunk represents the problem, and each root represents a
    potential cause of the problem. This conceptual model simplifies the process of
    finding the solution. What if the client in Chapter 1 can''t communicate with
    the server? If you are new to networks, this may seem like an impossible problem.
    However, the answer soon becomes apparent if you break down into distinct parts.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_87_0.png)


    Figure 3-1: Troubleshooting by using the fault tree'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Chapter 3: Troubleshooting


    Each sub-root deals with the specifics of the more general problem. For example,
    if the problem relates to the physical connection, you can trace the problem to
    one of several cases: no adapter, a misconfigured adapter, a break in the wire,
    a faulty connector, or no connector at all. If the problem involves network configuration,
    you know that it can be one of several things. By using the fault tree, you can
    break down any problem into simpler ones and eventually locate the root cause.
    Your goal in troubleshooting problems with your network is first to identify the
    problem and pick a plan of attack.


    # Solving a Sample Problem


    Microsoft provides a helpful interactive fault-tree analyzer called the Network
    Troubleshooter. You can access this informative tool via the Help system:


    +   Click the Windows Start button and then choose Help from the resulting menu.
    As shown in Figure 3-2, Windows displays the Help Topics Windows window.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_88_0.png)


    Figure 3-2: The Help Topics window


    +   Click the Contents tab and then double-click the Troubleshooter icon. (As
    you can see, Windows has a number of different troubleshooters that can come in
    handy.)


    +   Windows opens the Network Troubleshooter window, shown in Figure 3-3.'
  merge: -1
  img_proc: true
