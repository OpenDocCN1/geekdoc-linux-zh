- pgno: 318
  md: '# Chapter 9: Introducing Systems Administration 289


    To add a group for the accounting department, edit the /etc/group file. Enter
    the following line to give the accounting group the arbitrary group number 200:


    ```

    account::200:lidia

    ```


    You now have a group called accounting and only lidia has access. To add users
    to a group, append each user name separated by a comma. A program called useradd
    automatically performs this operation. The Control Panel also provides a User
    and Group Configuration GUI.

    You can instruct Samba limit access to shares by including the group parameter
    in the share. Recall from Chapter 6 that writing to a share could be limited with
    the write list parameter. You can go further and limit all access to users in
    a group by devising a share as shown below.


    +   : A publicly accessible directory, but read only, except for people in

    [public]

    comment = Public Stuff

    path = /home/samba

    public = yes

    writable = yes

    printable = no

    force group = accounting

    write list = @staff


    The force group parameter forces all new or renamed files to that group - as determined
    by the Linux user and group information. It''s that simple.

    There are many tools that you can use to enhance your internal security. For instance,
    tripwire is a system that informs you when files have changed. Files that change
    unexpectedly can spell trouble. Chapter 12 describes how to use tripwire.


    # External security


    The best general advice that I can give is to keep your doors locked and be careful
    about discussing details of your network to people outside your organization.
    Don''t be paranoid - if I tell you about your firewall, I''ll have to kill you
    - but keep in mind that the more someone knows about the construction of your
    network and security, the more he or she can use that information against you.
    If someone is out to compromise your security, and you have done a good technical
    job of security, then the obvious way to attack is to look for ways around your
    system.'
  merge: -1
  img_proc: true
