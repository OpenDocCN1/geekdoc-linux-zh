- pgno: 54
  md: '# Chapter 1: Installing Red Hat Linux


    Next, enter your values into the IP address, netmask, default gateway (IP), and
    primary nameservers entries as shown in Figure 1-9.


    ![](img/1fa05dc2b61f40be78509e4d8bfc1fe6_54_0.png)


    Figure 1-9: Enter into your Network Configuration.


    The IP address is the numeric address that every computer requires to use the
    TCP/IP protocol suite. The Netmask tells the host what kind of addressing is used
    on the LAN. The Default Gateway refers to the computer— if any— acts as the interface
    to the Internet. The Nameserver entry is the IP address of the computer— if any—
    translates the numeric IP address into the more familiar IP name and vice versa.


    The following parameters are used to construct this Linux computer. These values
    are important because they fit into all the following examples throughout this
    book. If you are experienced setting up networks, or want this Linux computer
    to fit into an existing network, then go ahead and use your own values. However,
    if you don''t have special needs, then please use these numbers. The values are
