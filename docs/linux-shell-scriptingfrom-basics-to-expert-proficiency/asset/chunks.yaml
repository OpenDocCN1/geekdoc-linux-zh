    mv commands. The cp command copies files and directories, while mv can both move
    and rename them. Examples of these commands include: cpsourcefile.txtdestinationfile.txtmvoldname.txtnewname.txt Removing
    files and directories involves the rm and rmdir commands. The rm command is versatile
