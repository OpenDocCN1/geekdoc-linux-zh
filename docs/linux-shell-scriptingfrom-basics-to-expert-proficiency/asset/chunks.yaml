    ## 第 1 章 Linux 与 Shell 脚本简介


    本章提供了 Linux 的概述以及 Shell 脚本的基础知识。首先解释 Linux 是什么，并介绍了各种不同的 Shell 类型。讨论了 Shell 脚本的历史演变，随后指导如何设置
    Linux 环境以及访问命令行。本章区分了 `sh`、`bash` 和 `zsh` 等各种 Shell，并提供了一个基础示例来演示脚本如何工作。它强调了终端的用途以及使用脚本自动化任务的优势。


    ### 1.1 什么是 Linux？

    Linux 是一个强大的开源操作系统，从个人电脑到超级计算机等无数系统的内核。它由 Linus Torvalds 于 1991 年创建，通过全球开发者的贡献而成长，强调协作与透明。开源是指原始代码公开并可重新分发的软件。这种开放哲学允许
    Linux 迅速进化。Linux 在单体内核上运行。内核作为计算机硬件与其进程之间的核心接口，管理资源并促进软件与硬件之间的通信。Linux 内核专门为处理多任务和多用户功能而设计。操作系统本身通常以
    Linux 发行版形式发布（通常简称 `A`）：

    - Debian：以其稳定性和丰富的软件库闻名。

    - Red Hat：由 Red Hat 支持，以集成领先特性和技术著称。

    - Ubuntu：源自 Debian，将用户好的桌面环境与命令行工具打包。


    ### 1.2 Linux Shell 简介

    Linux Shell 是作为用户与操作系统内核接口的强大工具。作为执行用户输入命令的解释器，Shell 在 Linux 环境的功能效率中起着关键作用。与图形用户界面（GUI）不同，Shell
    仅依赖文本输入输出，这使其轻量且灵活，特别适用于脚本和任务自动化。当用户登录 Linux 系统时，会看到一个提示符，通常指示用户名、主机名和当前目录。例如，常见的
    Shell 提示符可能如下：

    `user@hostname:~$`


    此提示符表示终端已准备好接受命令。在提示符输入的命令由 Shell 解析并执行。每个命令通常由命令名称、选项和参数组成。


    ### 1.3 Shell 的类型

    不同的 Shell 提供独特的特性和行为。然而，大多数 Shell 的共同功能包括：

    - `sh` (Bourne Shell)：最早且最基础的 Shell 之一。

    - `bash` (Bourne Again Shell)：Linux 发行版中最广泛使用的 Shell。

    - `zsh` (Z Shell)：以其灵活性和以用户中心的设计闻名。

    - `csh` (C Shell)：与 C 编程语言结构更对齐。


    ... ...


    ### 1.8 基础 Shell 脚本 - 示例

    Shell 脚本的旅程从对 Linux 命令的基础理解开始。你将学习漫游文件系统、操作文件和目录，并利用各种命令行工具。掌握这些命令至关重要，因为它们构成了
    Shell 脚本的构建块。


    ```bash

    #!/bin/bash

    # 此脚本显示欢迎消息和当前日期时间

    echo "Welcome to Linux Scripting!"

    current_date=$(date)

    echo "Date and time: $current_date"

    ```


    要使脚本具有执行权限，请使用 `chmod`：

    ```bash

    chmod +x example.sh

    ```

    运行它：

    ```bash

    ./example.sh

    ```


    '
