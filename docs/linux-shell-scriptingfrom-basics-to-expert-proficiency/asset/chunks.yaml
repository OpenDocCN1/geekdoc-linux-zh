    home directory is /home/username Updated PATH is /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/my/custom/path Using
    the script fetches the home directory of the current user. By modifying $PATH
    with it shows how environment variables can be adjusted within a session. Example
    6: Implementing a Simple Calculator This interactive script functions as a basic
    calculator, allowing users to perform arithmetic operations. #!/bin/bash #Prompttheuserfortwonumbersecho"Enterfirstnumber:"readnum1echo"Entersecondnumber:"readnum2 #Prompttheuserforanoperationecho"Enteroperation(+,-,*,/):"readop #Performthecalculationresult=0case$opin +)result=$((num1+num2)); -)result=$((num1-num2)); ’*’)result=$((num1*num2)); ’/’)result=$((num1/num2)); *)echo"Invalidoperation";esac #Displaytheresultif["$op"!=""];then echo"Theresultis$result"fi Enter
    first number: 10 Enter second number: 5 Enter operation (+, -, *, /): * The result
    is 50 Utilizing the script handles different arithmetic operations input by the
    user. These practical examples vividly illustrate how variables can be effectively
    used to perform calculations, interact with users, manage files, and manipulate
    environment variables in shell scripting.  Chapter 6File and Directory Management This
    chapter covers essential techniques for managing files and directories in Linux.
