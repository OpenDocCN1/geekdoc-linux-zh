  md: '# Chapter 11—LOUD AND GRAPHIC 251


    In the case of Linux, the X interface was ready and waiting for Linux. In 1986,
    an international consortium of UNIX programmers began putting together a graphical
    operating system based on the GUI research done by the Xerox Palo Alto Research
    Center. This is the same place that came up with the GUI interface known in the
    IT world as WIMP (Windows Icons Menus Pointing device), so these guys aren''t
    just sitting around sniffing toner. They''re into some serious interface work
    and most modern GUIs have them to thank.


    After Linux was introduced in 1991, X soon found its way to the Linux desktop.
    When Linux began appearing on Intel-based PCs, new implementation of X, XFree86,
    helped make the transition. XFree86 is the heart of most GUIs that run on Linux.
    It is not the only visual interface available for Linux on an Intel machine, but
    it easily is the most popular.


    > Its called X not so much to keep it short but to keep Linux users from having
    to even say the word “window” too often.


    Also referred to as the X server, XFree86 is where video output and PC input is
    brought together to form one cohesive interface. PC input is obtained from two
    basic input devices: the keyboard and the mouse. Video output is then sent through
    the graphics card to the monitor.


    Although this sounds like the entirety of the GUI, it''s not. In fact, X alone
    is not a GUI at all.


    Here''s where things get interesting.

    The X server is only one layer of the display system: the layer that provides
    the “home” for the GUI to operate. X is just a video tabula rasa, able to display
    whatever signals get sent to it. To generate the actual windows and menus that
    make up what is traditionally considered a GUI, you need a window manager'
