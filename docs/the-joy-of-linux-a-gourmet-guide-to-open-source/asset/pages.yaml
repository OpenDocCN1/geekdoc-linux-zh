  md: '# Acknowledgments


    There are a lot of people who deserve to be acknowledged, because so much of this
    book has come from individual conversations and interactions over several years.


    For starters, Lynette Quinn owed a great deal, both for conceiving of this book
    and giving me a crack at it. Lynette''s been a paragon of patience and calm. My
    co-author, Brian, also deserves much thanks for jumping in and throwing literary
    elbows. Both of them made this book happen and you wouldn''t be holding it right
    now if it weren''t for them.


    None of the ideas expressed in this book were formed in a vacuum. I''m very lucky
    to be surrounded by people who bring all sorts of perspectives to Linux, so thanks
    goes to Sam Rowe, Ed Heil , and Brent Heatherwick, who have all shared insights
    from their own experiences with Linux (and computing in general). They''ve been
    a virtual LUG for me, and I''ve learned a lot from each of them.


    While I was working on this book, I was also starting work at the Linux/Open Source
    Channel at internet.com. Thanks to both Kevin Reichard, executive editor, and
    the other editors, writers, and techs there, both for shared insights and patience.
    They produce some of the best Linux resources available on the Web, and it''s
    a privilege to work with them.


    Finally, thanks to Alison, who shared me with this book.


    —Michael Hall'
