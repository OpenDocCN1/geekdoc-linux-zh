- img_proc: true
  md: '# Chapter 7—SWITCH HITTERS


    Windows, it''s the application that shakes Windows out and gets it moving. In
    Linux, it''s the LILO application that springs to life. When a system has two
    or more operating systems, a special multi-boot application must reside in the
    boot sector that temporarily halts the boot process and allows the user to choose
    which operating system to load. LILO is just such a program.


    To configure LILO to run Linux and another operating system, all you really need
    to do is install your Linux distribution on a machine with a clear partition available.


    That''s it, that''s the big secret.


    LILO is smart enough to see any and every partition file type and start files
    on your PC, be it Linux, Windows, or even UNIX. It is a very flexible application.
    Only one operating system is resistant to sharing booting rights with Linux, and
    that''s Mr. Big itself: Windows NT.


    Windows NT has issues with booting with Linux. Our side of the fence has accused
    Microsoft of once again locking out the competition. Whether you believe the motivation
    is sinister or not, the problem is still there.


    > Only one operating system is resistant to sharing booting rights with Linux,
    and that''s Mr. Big itself: Windows NT.


    Basically, the Windows NT Loader, the counterpart to Linux''s LILO, does not recognize
    Linux as a valid operating system (imagine that!) because Linux does not produce
    the file type the NT OS Loader needs to read before starting an operating system.
    In addition, the NT OS Loader will not function from anywhere other than the boot
    sector. Since only one boot loader can be in the boot sector at a time, NT could
    have a problem if LILO sits in the MBR—so Microsoft claims.


    Quite simply, the easiest way to get Linux and Windows NT to work together is
    to install NT first on your machine.'
