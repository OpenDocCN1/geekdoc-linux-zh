    Once they had the operating system ball, Microsoft approached Patterson and Seattle
    Computer Products and negotiated the purchase of Patterson''s QDOS (Quick and
    Dirty Operating System), which was based on CP/M. Patterson used a CP/M manual
    to write the whole thing in six weeks. No copy-right violation here, because Patterson
    modified QDOS enough from the original CP/M. After some quick edits, QDOS became
