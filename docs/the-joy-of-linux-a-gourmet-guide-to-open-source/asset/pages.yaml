- img_proc: true
  md: '(barring any new input) automatically starts the Linux OS for you. When LILO
    first starts, it typically pauses for a few seconds to see if the user has some
    other instructions. If a sneaky person types `linux single` during this pause,
    the system automatically boots to the root account, without asking for a password!
    This may seem really stupid on the part of the LILO designers, but it is actually
    an emergency entrance into your system for cases when something seriously wrong
    has happened to it and you need to perform maintenance in a really bad way.


    To fix this problem, you need to open the /etc/inittab file and add this line
    right after the `initdefault` line:


    ```

    -S:wait:/sbin/sulogin

    ```


    This forces the user to enter the root password before getting to the single-user
    mode in Linux.


    This isn''t the only trick the cracker can perform at the LILO prompt; other commands
    will get them root access. You need to eliminate their access to the LILO prompt
    altogether. To do this, edit the `/etc/lilo.conf` file and add the line `delay=1`
    to the contents. This trick will give a user one tenth of a second to type in
    instructions at the LILO prompt, something that no amount of Jolt cola will enable
    them to do.


    If the user needs to get to the LILO prompt for a legitimate reason, they can
    always use a boot disk that has a copy of LILO on it.


    Locking out the LILO prompt is just the start. If your PC is like most, then it
    will initially look to the floppy or CD-ROM drives to boot before the hard drive.
    If someone stuck a Linux system floppy disk into your drive and rebooted the machine,
