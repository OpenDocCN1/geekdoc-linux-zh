    support for running applications, real-time operating systems do everything they
    can to let the application run as fast as it can. Essentially, a real-time OS
    sets everything up for the app and gets out of the way.


    Some of these real-time OSs are derived from Linux—scaled down versions that are
    souped up to handle demanding real-time needs. But all of them to date, regardless
    of their origins, are proprietary in nature, which leads to standards problems
    and licensing fees. Real-time operating systems are also very specialized pieces
    of software that not many people know how to program for, so companies who use
    them are plagued with staffing problems and a large amount of dependence on the
    operating system.


    The same issues also hold true for those hardy adventurers who decide to make
    their own operating system to run on the chipset. This may seem like the perfect
