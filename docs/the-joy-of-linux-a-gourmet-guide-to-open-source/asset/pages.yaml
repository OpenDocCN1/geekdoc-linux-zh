  md: '# THE JOY OF LINUX


    stable and communicative environment within which to create new GNOME apps, the
    GNOME Foundation serves as an incubator of sorts for bringing more user-friendly
    applications to the GNOME interface.


    # KDE


    Web: http://www.kde.org


    KDE was the first desktop environment made for the Linux platform and as such,
    it is ahead of the game in terms of stability and innovation. But in many ways,
    KDE has been the most beleaguered application of any kind in the Linux community.
    The continued presence of non-free core code within its architecture really set
    a lot of people against what was to be the penultimate in Linux GUIs. In sharp
    contrast to this issue, however, is the fact that surveys show KDE in use over
    70 percent of Linux desktops. Free software or no, clearly KDE is doing something
    right.


    KDE was started in 1996, ten months prior to GNOME’s origins. It offered users
    a very stable interface to the oh-so-mysterious Linux platform, and offered developers
    an excellent place to start building core applications for Linux.


    ![](img/ebce5f58276413c456937bd42a097346_325_0.png)


    KDE began as a mostly volunteer effort, and remains such an effort to this day.
    It is a less centralized organization than its opposite number GNOME, but this
    has aided it in making advances in specialized areas far ahead of other development
    groups.


    KDE maintains a rigid standard in working with window managers, so so much that
    many default installations of KDE use kwm, KDE’s own window manager. This is different
    from GNOME, which is compatible with several window managers.'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# Chapter 13—THE LINUX SUTRA: RESOURCES


    This seeming lack of flexibility does hold KDE back in the aesthetics department,
    but it definitely helps make KDE a rock-solid platform. KDE has recently released
    its 2.0 version, a long-awaited GPL offering that takes some big steps toward
    making Linux easier to use for everyone.


    KDE is also following in the footsteps of GNOME, having recently created the KDE
    League, which promises to promote KDE to the hilt with the League''s new corporate
    backers. Critics have argued that this is just a knock-off of the GNOME Foundation,
    but KDE developers assert that unlike the Foundation, the League will only be
    involved in promoting KDE, not in actual development.


    Given its stability and proliferation, KDE is one environment you should take
