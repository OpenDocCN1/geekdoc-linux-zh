    Mounting is another concept that seems really weird to Windows users. When Microfts
    access a drive, it opens up, plain and simple. The only trouble they run into
    is if they forget to stick in the floppy or CD-ROM disk to the appropriate drive.
    In Linux, which prefers not to waste processor time and memory keeping an eye
    on every single drive and partition on the machine, you have to tell Linux about
    a new floppy in the floppy drive, and tell it how to read it. This is called *mounting*.


    This seems really backwards to Windows users, but it makes a lot of sense when
    you ponder it for a bit. Aside from the savings in processor usage, it''s an excellent
    way way to maintain security on your system. Still, in an effort to be nice to
    the New Kids on the Block, the Linux developers have incorporated the concept
    known as automount into many distributions. Automount does just what you would
    think: It lets Linux access any new disk inserted into a peripheral drive, just
    like Windows.


