  md: '# Operating Systems


    ![](img/ebce5f58276413c456937bd42a097346_375_0.png)


    # Experience the Joy


    It was love (or at least lust) at first sight. Linux was like no other operating
    system you''d ever met, and you fell hard. Yet, despite hours of pleasure together,
    there are things about Linux that you just don''t know—secrets, treasures, undiscovered
    pleasures that still elude you. This is the book you''ve been searching for.


    The Joy of Linux dares to pull back the curtain and reveal the fascinating cultures,
    communities, and controversies that comprise the history and evolution of Linux.
    From an embryonic operating system devised by an obscure Finnish programmer 10
    years ago to a sophisticated, multi-flavor OS favored by some 10 million users
    worldwide, Linux has become the darling of Open Source advocates and commercial
    software developers alike for its elegant architecture and rock-steady reliability.
    It''s a cool alternative to the Windows and Macintosh® platforms—just as The Joy
    of Linux is a cool alternative to the more sober, manual-like books on the subject.
    However may you think you know about Linux, or if you know nothing at all, you''ll
    discover that this book will fuel your passion for, heighten your pleasure with,
    and expand your knowledge of Linux! It''s so good, you''ll need a cigarette when
    you''re done.


    ![](img/ebce5f58276413c456937bd42a097346_375_1.png)'
