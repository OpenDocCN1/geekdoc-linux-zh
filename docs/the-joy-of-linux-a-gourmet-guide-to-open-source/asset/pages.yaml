  md: 'Brian, my co-author, has something to say about the whole thing, too:


    # TALES FROM THE DARK SIDE


    I came to Linux later in the game. I was raised in a land where Windows ruled
    the day. It was a homogeneous land, replete with teal-shaded backgrounds and chiming
    little noises to signal incoming mail. It was warm and safe in my Windows world,
    and I felt comfortable in my allegiance to King William and the Court of Redmond.


    I even actively participated in the promotion of Windows, editing books that would
    soothe the brows of troubled users and make their cares blissfully evaporate.
    Within this little world, dark, ugly things kept popping up, casting shadows on
    all that was good and pure. These were troll-little problems, like print spoolers
    crashing the entire Windows system for no apparent reason, and the need to reboot
    any time certain applications froze.


    At the same time, I had heard of other computer kingdoms, of course. The Land
    of Macintosh seemed a pleasant enough place, albeit populated by ex-hippies. OS/2
    seemed really cutting edge at the time, but the fear pervading that little kingdom
    was too much to bear.


    And then there was Linux. The first person I knew who was using Linux on his home
    machine was a man who later became a transvestite—which gives you a pretty good
    picture of how this repressed middle-class Midwestern thought of Linux at the
    time. If Macs were for hippies, Linux was for the truly deviant, I, in my Ward
    Cleaver little world, would have none of it.


    Over time, the trolls in Windowsland got a little bigger, and no longer ran and
    had everytime I tried to find them. They were getting bolder and meaner. Windowsland
    would be upgraded from time to time, and many of the trolls would vanish—to be'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'replaced by trolls that were nastier and harder to spot. These new trolls were
    learning to blend in with their pretty environment and would be impossible to
    see until it was too late.


    I was getting disenfranchised with computers in a big way. I still used them for
    work, but now it was no longer a pleasurable experience. It felt like I was fighting
    the PCs before me. The trolls had taken over, and I had become a knight errand,
    trying to take back the kingdom I had once loved.


    My first steps into the Linux community were, appropriately enough, for the purposes
    of writing a book. The book I was to write was a text on how to use StarOffice
    (a Microsoft Office-like suite) for Linux. Normally I prefer to know a lot about
    the topics I am writing about, but in this case, my needs were great: My day job
    was relocating its offices to South Carolina and I had no great desire to go with
    them.


    So I parted ways with my employer, got a nice advance from the publisher, and
    borrowed a friend’s extra PC for the sole purpose of learning how to use Linux.


    I had several preconceptions about using Linux, since I''d already exposed to
    a UNIX system a few years before. I expected it to be awkward and cryptic to use.
    With these thoughts in mind, I installed CalderaLinux on the computer my friend
    let me borrow.


    It was not short of an epiphany! This was not something that was hard to install,
    no! It was simple! It was fast! There was no dark little command-line interface;
    I was getting full-blown, in-your-face KDE, which looked and behaved lot like
    my Windows machine did!


    I had seen the light, and it was good.


    I went on using my friend’s PC in his home office for about three more weeks,
    learning about Linux and its pros and cons while examining the StarOffice suite
    I was writing about. Then I went out and got a copy of Red Hat for my own PC and
    set up a'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# INTRODUCTION xx


    dual-boot system at my house. Suddenly, the computer was no longer an enemy; it
    was a trusted friend again.


    To be sure, there were problems. Linux, for all its power and flexibility, is
    not perfect. Unlike the trolls of Windows, after the problems in Linux get fixed,
    they stay fixed. They don''t come back to haunt you later.


    I began to be a Linux evangelist amongst my peers, who just shook their heads
    and tried to lure me back to Windowland. I would not go.


    Linux would also bring an old friend back into my life. My books were showing
    up on shelves around the country and lo and behold, one Michael Hall happened
    to see one on the shelves of his local bookstore one day.


    Michael and I met in college, and despite our incredibly different outlooks (an
    idealistic young Democrat who voted every year versus a self-described anarchist
    who was in constant strife with the crypto-facts of the world), we became good
    friends. We shared a passion and a skill for writing, and when I was the editor
    of the school newspaper, he was the managing editor. I would try to plan the stories
