    his screen. I looked over his shoulder and watched an activity log scroll by.


    “What is it?” I asked, less annoyed at his interruption than by the fact that
    I could not read as quickly as he could.


    “Someone’s trying to break in,” he muttered, his voice nearly obscured by the
    white noise of the servers and the air conditioning.


    ![](img/ebce5f58276413c456937bd42a097346_167_0.png)


    And so they were. I watched an attempted crack by someone using a valid user ID
