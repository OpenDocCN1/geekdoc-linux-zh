    the most common PC''s of the time was Microsoft''s MS-DOS, which, though largely
    derivative of “serious” operating systems in some of its elements, was never built
    with hackers in. Students and computer scientists were picking up PCs for their
    homes more and more during this period as it became a less than $1000 proposition
