    In 1996, he came upon the Qt code libraries, which he quickly realized could be
    the technology to achieve his goal. After quickly assembling a team of volunteer
    developers, work soon began on KDE 1.0.


    Often referred to as a window manager, in fact KDE is not. KDE usually runs over
    a window manager called KWM (K Window Manager). As KWM enhances the look and feel
    of XFree86, so KDE enhances the look and tool sets of KWM. Because of this, KDE
    (and GNOME) is referred to as a desktop environment.


    Around the Linux community, KDE is the one that’s referred to as “the one that
