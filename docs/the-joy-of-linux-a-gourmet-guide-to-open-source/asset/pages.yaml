  md: '# THE JOY OF LINUX


    +   - [Drive Type]. This is a two-letter indicator of the hard drive type. Possible
    values are hd (IDE disk) and sd (SCSI disk).

    - [Device Where Partition Resides]. This is the device the partition is on. Possible
    values are /dev/sda (first SCSI disk) and /dev/hdc (third IDE disk).

    - [Partition Number]. This denotes the partition. Possible values are 1–4 (primary
    or extended partitions), and 5+ (logical partitions).


    Within Linux, this division of directories among partitions will be seamless.
    But when installing Linux with another operating system, you''ll need to think
    through what partitions you want, what the mount points will be, and how much
    memory you''ll allot to each partition, making sure to leave room for the other
    OS you''ll be using. After all, it will not just be a case of having one Linux
    partition and one Windows partition.


    Since you are curious on how to use more than one operating system on your Linux
    PC, you will need to understand the Linux Loader (LILO) application. This small
    but useful app is the reason why having an alternative operating system is so
    easy, as you''ll see in the next section.


    # Coming out


    There is nothing hard-wired into a PC that prefers one operating system over another.
    It is simply string of software commands that starts with the application known
    as the BIOS on an Intel PC that chooses what OS should run.


    The BIOS is the application that tells the computer how to wake up it is first
    turned on. Here’s how it works: When a system with a single operating system boots,
    the BIOS looks at a special section of the hard drive called the MBR (*Master
    Boot Record* or boot sector) to see what operating system will be loaded. Any
    application in the boot sector is then activated. In the case of'
