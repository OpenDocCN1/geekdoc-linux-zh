  md: 'Running a game on a PC is an interesting proposition on any platform. Games,
    more than any other application, need a huge amount of video processing and hardware
    access. PCs were never originally deóigned designed to handle this kind of video,
    and neither were the operating systems that ran on them. After all, who needs
    massive video computations just to paint a word processor on the screen?


    When the first three-dimensional games were written, it was quickly determined
    that there was no way anyone without the highest level of processor power and
    RAM was going to be able to run the things. But so large was the consumer desire
    to play cool games, it actually drove the hardware developers to come up with
    a solution much faster than they would otherwise.


    Enter the video accelerator card: a piece of hardware that was to revolutionize
    the gaming industry. The video accelerator was created to take the huge processing
    load of displaying 3D graphics in real time the virtual hands of the processor,
    saving a lot of time. Accelerator cards have their own processing capability as
    well as some amount of video RAM (VRAM), which frees up the main RAM within the
    PC.


    For an application to fully use all the accelerator card''s capabilities, it needs
    to be able to control the hardware''s functions directly. All applications use
    modules of code called libraries to control hardware via APIs (Application Program
    Interfaces) by way of the operating system. This overly manipulative method may
    seem like a bad game of Telephone, but that''s the go-between for the application
    and the computer hardware. APIs are the intermediaries between the application
    and the operating system.


    For a game to work really well, you need an API with a certain je ne sais quoi—a
    graphics API, to be exact. The best API out there is Silicon Graphic''s OpenGL.
    Almost every game made for the PC uses OpenGL in one form or another. The only'
