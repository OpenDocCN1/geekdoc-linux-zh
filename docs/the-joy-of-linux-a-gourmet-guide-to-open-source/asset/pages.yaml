    # The Joy of Tech by Nitrozac and Snaggy


    ![](img/ebce5f58276413c456937bd42a097346_178_0.png)


    Is Linux safer because of abstinence? Would it fall down as hard as Windows if
    a virus slid its way into a Linux box? The ambiguous answer is yes...and no. Let
    me explain: The Linux environment is not conducive to a virus attack—u2014 some
    knucklehead fails to set it up properly. Then it can be open season.


    Here is the secret to Linux''s success with viruses: multi-user configuration.
    In English: a properly configured Linux PC, even just a stand-alone home computer,
    should have the superuser account known as root, and then at least one additional
    “regular” user account to be used on a daily basis.


    Most viruses infect existing executable files; the only way infection can occur
    is if the virus can write over the executable file. On most Linux systems, only
    the root account can write over executables. So if Joe Average is logged on to
    a machine as javerage and lets a virus get on the hard drive, nothing will'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'happen, because the javerage account cannot write over executable files; it
    can only read them. The virus, unable to latch onto anything, will instantly die.


    Now, if javerage happens to own an executable file or two, the virus still won''t
    be able to do much damage; at most, Joe loses the ability to run a few apps on
    his system. He will likely just reinstall or recompile the application files to
    get the apps running again, thus killing the virus.


    Linux is also an unhealthy environment for viruses because it does not let viruses
    perform certain tricks that work under other operating systems. No regular user
    account is able to lock out services or privileges from another user by crashing
    the PC or eating up system resources—two popular tricks in the Windows virus pantheon.


