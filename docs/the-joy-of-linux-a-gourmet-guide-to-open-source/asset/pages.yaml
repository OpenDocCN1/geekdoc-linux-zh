    # AIRBRUSHES AND TOUCH-UPS


    Graphics in Linux can do more than run the user interface, and anyone who wants
    think differently can grab a bucket of popcorn and pop a copy of Titanic into
    the VCR or DVD player. See that big boat in the movie? It''s pretty much not real,
    since even King of the World James Cameron didn''t want to tackle building a full-size
    replica of the ill-fated White Stars lines. It''s actually a composite of miniature
    models, computer animation, and some full-size sets, all blended together by 160
    Alpha processor computers at the effects company Digital Domain. 105 of these
    computers were running Red Hat Linux 4.1, and the rest Windows NT.


    Alpha processors are different from the Intel processors found in most non-Apple
    PCs. They are, by a huge degree, more powerful than Intel chips. Even so, using
    the wrong operating system would slow the systems down to a painful (and costly)
    work. Faced with a choice between Windows NT, Digital UNIX, and Linux, Digital
    Domain weighed in Linux for the machines that performed the really heavy graphical
    work. This was primarily because Linux was flexible, and the open-source availability
    of the Linux code allowed the workers at Digital Domain to modify the operating
    system to their exact needs. The stability of Linux paid off as well. Digital
    Domain ran the machines 24 hours a day for three solid months with no significant
    downtime.


    Of course, if you don''t have Kate Winslet or Leonardo DiCaprio hanging about
    the house ready to make a home movie, there are other ways to use Linux for your
    graphic needs. The best, and certainly most powerful way for the home user to
    play with graphics on their Linux box is to make use of the GIMP.'
