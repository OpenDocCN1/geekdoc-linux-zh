    trying to cooperate or assimilate each other. This is the occurrence of Moore''s
    Law. The Moore in Moore''s Law is Gordon Moore, former Chairman of Intel, who
    first stated this succinctly: Current technology development will allow the doubling
    of processor power every 18 months (Moore''s Law). This is the reason we all get
    to slavishly debate upgrading our PCs every couple of years.


    ![](img/ebce5f58276413c456937bd42a097346_241_0.png)


    Moore''s Law is generally seen as a huge driving force in the IT hardware world,
    and a bit of pain in the ass for the software community. After, what good is it
    to run the latest hyperprocessor with all the coolest functions if the software
    is unable to take full advantage of it? So, thanks to the hardware group, the
    software group has to completely revamp its code on a regular basis. Which chucks
    all the trips to Tahiti.


    This was especially true in the early stages of embedded systems. The processors
    using homemade code would become obsolete after only a year and a half at most.
    The makers of devices A and B would, of course, stand pat and keep the processors
    they had. Doing so, however, risked the makers of device C (with the new faster
