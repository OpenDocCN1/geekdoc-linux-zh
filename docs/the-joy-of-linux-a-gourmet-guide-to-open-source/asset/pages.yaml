  md: '# THE JOY OF LINUX


    Two computer scientists named Ken Thompson and Dennis Ritchie were working on
    an operating system called Multics (Multiplexed Information and Computing Service);
    an attempt to create an operating system for large computers with the means to
    provide access to many users at the same time. Multics, thanks to its resource
    hungriness, had earned the disapproval of management, which, promptly, in the
    manner of management everywhere, pulled the plug on the project, leaving the gentlemen
    without a sanctioned operating system project.


    Thompson was eventually granted the use of a DEC PDP-7, and in best computer-nerd
    fashion, set about to make it a better game machine. That in turn led to the first
    UNIX kernel. For his part, Ritchie had developed a computer language, which he
    called “C,” for Thompson’s new operating system. C is important for the simple
    reason that it was one of the first proofs of the notion that a programming language
    can be “cross platform.” That is, if you use C to come up with a really good version
    of “Space Wars” on one machine, you’ll be able to run it on a different machine
    with a different operating system with little hassle.


