    “Dude, boot sector virus.”


    “Say again?” our hero asked.


    “Your drive, man,” the wizard said between sips of cola, “it got hit by a boot
    sector virus. It’s toast until you put a new master boot record on there, but
    to be sure, you need to reformat the drive.”


    And the world came crashing down. The end.


    Embellishments aside, this is a familiar tale to many Windows users. One way or
