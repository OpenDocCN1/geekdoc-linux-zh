    bazaar model is characterized by a “take all comers” spirit that pays less attention
    to the arbitrary definitions of corporate affiliations or workplace product groups
    and to the individual merit of the developer approaching a project: If you can
    contribute meaningfully and gain the respect of those maintaining a project, you
