- img_proc: true
  md: '# THE JOY OF LINUX


    Then, when you install Linux, just overwrite the NT OS Loader by making LILO boot
    to the Master Boot Record (MBR). Finally, edit your /etc/lilo.conf file and add
    an “nt” option that points to the device NT resides on (for example, /dev/hda1).
    This works because unlike the NT OS Loader, LILO is smart enough to figure out
    how to work with NT—another example of Linux’s open nature.


    If you want to run Linux with Windows NT or Windows 2000 installed later, and
    don’t want to completely erase your Linux partitions to start all over again,
    you will need to take some special steps before installing NT. Of primary importance
    is that you must install LILO in the first sector of the Linux boot partition
    instead of the MBR. If you do this, there will be no conflict between LILO and
    the NT OS Loader. Unfortunately, the NT OS Loader will still not see Linux and
    won’t present Linux as a boot choice. Now comes the chicantry.


    There is a way to create a file in Linux that the NT OS Loader can use to boot
    Linux. But since creating it takes a bit of time, we recommend you obtain a little
    third-party program Bootpart, available at http://www.wimage.com/bootpart.htm.
    This program will quickly create the Linux boot file for NT OS Loader and place
    it where NT OS Loader can use it. We highly recommend this application if you
    plan to use either Windows NT or Windows 2000 with Linux.


    Now that you have managed to finangle your computer into handling more than one
