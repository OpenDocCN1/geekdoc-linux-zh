    Fear, Uncertainty, and Doubt (FUD, for short) is the practice of lying a lot about
    the horrible things that happen to people who choose anything other than the product
    the person spreading FUD is trying to sell. It has a long, rich history in the
    modern computing age, going back to the widely-propagated old saw “No one ever
    got fired for choosing IBM.”


