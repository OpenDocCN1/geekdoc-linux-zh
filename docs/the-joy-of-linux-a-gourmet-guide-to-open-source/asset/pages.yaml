    # Is THAT A RADICAL INVERSION OF OUR UNDERSTANDING OF COPYRIGHT LAW IN YOUR POCKET?


    RMS formula for “free software” is easy enough to follow:


    +   * You have the freedom to run the program, for any purpose.

    * You have the freedom to modify the program to suit your needs. (To make this
    freedom effective in practice, you must have access to the source code, since
    making changes in a program without having the source code is exceedingly difficult.)

    * You have the freedom to redistribute copies, either gratis or for a fee.

    * You have the freedom to distribute modified versions of the program, so that
    the community can benefit from your improvements.


    These principles are elaborated on in the GNU General Public License License (known
    widely as “the GPL”). The GPL is designed to guarantee that once software is made
    “free” under the above definition, it stays that way. There are lengthy and bloody
    brawls over licensing esoterica in the computing community, but the gist of the
    GPL is simple enough to express here, until you can get to the Appendix:


