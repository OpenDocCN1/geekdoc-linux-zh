  md: '# Chapter 7—SWITCH HITTERS 179


    Now, if you are the root user, you could enter the mount command to access the
    Windows partition. The syntax of this command is always:


    ```

    mount device name mount directory

    ```


    So, in this instance, you might type:


    ```

    mount /dev/hdal /mnt/win

    ```


    But this would not quite be right. After all, the file system format on your Linux
    partition is ext2, while Windows uses FAT32. So to get these two systems to work
    together, you just need to add the -t parameter and specify the file system of
    the Windows partition so Linux knows how to work with it. The file system notation
    for FAT32 is vfat, so the complete command would be:


    ```

    mount -t vfat /dev/hdal /mnt/win

    ```


    Now you can access the files on the Windows partition to your heart''s content.
    But if you want to use the partition as a regular user instead of root, which
    is a darned good idea, this command won''t fly. And, even if you were logged in
    as root, retype the mount command every time? What you need to do is edit the
    /etc/fstab file so the partition is—you guessed it—automounted.


