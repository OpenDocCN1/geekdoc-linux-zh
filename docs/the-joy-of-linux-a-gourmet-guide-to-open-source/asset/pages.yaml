  md: '# Introduction


    PYTHONS AMONG THE SHOWGIRLS,

    ANARCHO-SYNDICALISTS AND THE RED FLAG

    OF COMPUTER REVOLUTION


    The scene is a hotel room in Las Vegas on the second night of

    COMD, a convention so big it takes two buildings to hold it.

    i was there to cover it as best I could, but along the way I had to

    cave in the urge to buy a toy. Being a compulsive gadget freak,

    I didn''t have a hard time finding something interesting; I settled

    on a small camera attached to my pocket computer.


    I had been taking pictures with it all day, and I ran up to my

    room to download the snapshots from the handheld device, think-

    ing surely the images wouldn''t be saved in such a way that I

    couldn''t get at them with my Linux laptop. Naturally I was

    wrong, and I had a good meg of photos that weren''t doing me

    any good. Had I a Windows laptop, of course, there would have

    been no problem: Everyone makes sure their hardware works

    with Windows. I spent a few seconds wondering if I hadn''t been

    hasty when I''d wiped all trace of Microsoft from my computer.


    Fortunately, in addition to my gadget freak side, I''m an opti-

    mist. I did what any good Internet-enabled optimist would do: I

    fired up the modem and went looking for answers. The product

    had been out for at least a few months, so I knew in my heart of

    hearts there would be a solution.'
