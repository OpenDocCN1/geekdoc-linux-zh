  md: '# Chapter 13—THE LINUX SUTRA: RESOURCES 287


    Any developer looking to try open source needs to come here first, as does any
    new Linux user.


    # Free Software Foundation


    Web: http://www.gnu.org


    The FSF is the brainchild of Richard M. Stallman, a name so familiar to the Linux
    community that he''s usually referred to just as RMS. Stallman’s premise is essentially
    this: The practice of copyright, which originated with the paper-and-ink publishing
    industry, is not especially appropriate for the digital software industry. He
    considers software creators as being morally wrong in enforcing copyright. Software,
    he maintains, is free to use, free to modify, and free to copy.


    Having made this decision, Stallman began writing the GNU operating system in
    the beginning of 1984—well before the 1991 release of Linux. By the time Linux
    was developed seven years later, Stallman and his fellow GNU Project members had
    developed and distributed GNU Emacs, a powerful and efficient text-editor application.


    # The Joy of Tech by Nitrozac and Snaggy


    ![](img/ebce5f58276413c456937bd42a097346_318_0.png)


    With just a few changes to the GNU slogan, Richard Stallman''s dream of making
    proprietary software obsolete was almost guaranteed.'
  merge: -1
  pgno: 318
- img_proc: true
  md: '# THE JOY OF LINUX


    Stallman had also devised the GNU General Public License, a legal document that
    basically inverts the copyright law. Instead of keeping software private, the
    GNU GPL works to keep software and its derivatives free.


    When Linus Torvalds created his Linux kernel, it became apparent that he could
    make use of the tools which Stallman had created, such as GNU Emacs and the GNU
    C library. In fact, the GNU system Stallman had worked to create was missing one
    vital element: a kernel.


    This was a software match made in heaven. By incorporating these digital tools
    and keeping Linux under the GNU GPL (also known as a copyleft), the FSF maintains
    that Linux should really be called GNU/Linux.


    > The practice of copyright, which originated with the paper-and-ink publishing
    industry, is not especially appropriate for the digital software industry.


    Stallman makes it clear in his writings, available on the FSF’s site, that free
    software is not the same as open source. The term “open source” shifts the focus
    away from the right ideas, Stallman argues. “Open source,” he explains, is just
    used to focus “on the potential to make high quality, powerful software, but shuns
    the ideas of freedom, community, and principle.”


    This distinction is a very important one and it marks a divide between the FSF
    and the Open Sourcers. This is not a chasm, by any means, as many of these factions’
    goals overlap. Still, some friction created by the strength of Stallman’s beliefs,
    and reactions from others in the Linux community from eye rolling to outright
    vehement attacks on the FSF’s ideals.


    RMS has pronounced an interesting new philosophy to the world of software development,
    and although agreement with'
  merge: -1
  pgno: 319
- img_proc: true
  md: 'his ideas are not mandatory to be in the Linux community, knowledge of the
    FSF goals should be.


    # Linux Documentation Project


    Web: http://www.linuxdoc.org/


    When you saunter into your local coffee bar/lounge/bookstoremove over the computer-books
    section, odds are you are going to find an overwhelming Windows books. Why is
    it that the Linux sections are typically smaller in bookstores? After all, in
    terms of user friendliness, only recently has Linux approached the level of ease
    that Joe Schmee off the street could feel comfortable with. Would think then,
    that would create a real market need for books to explain just how the heck you
    use this thing called Linux.


    There are two reasons for this phenomenon. One is money. No big surprise here,
    if publishers do not smell money in a certain market niche, they are unlikely
    to put forth more than a token book or two in that niche. And, until recently,
    no one smelled the money in Linux. (Now, of course, with commercial distributions
    grabbing market share away from the Microsoft behemoth, the Linux community looks
    a little more lucrative, and the how-to books are starting to pour out of the
    presses.)


    The other holdback is more subtle and has to do with the nature of Linux itself.
    Linux, when you install it on a computer, it is a very personal thing. If two
    customers buy the same Linux distribution off the shelf at the local megastore
    on the very same day and go home to install on the same computer models, almost
    certainly there will be wide differences between the two machines when all is
    said and done.


    > Stallman makes it clear in his writings, available on the FSF’s site, that free
    software is not the same as open source.'
  merge: -1
  pgno: 320
- img_proc: true
  md: 'Unlike Windows, where one Windows machine pretty much contains the same OS-level
    tools as another, Linux operating system tools can vary wildly from one box to
    the next, even with the same distribution. This is due to the modularity of Linux,
    which lets the user piece together a highly customized, very personal operating
    system based on what he or she needs, not on what the software manufacturer thinks
    he or she needs.


    Now, Linux’s modular nature can make it very hard for an author or publisher to
    pin down a comprehensive how-to book on every facet of Linux. It''s plenty daunting
    to nail down the most-used aspects of this OS. Faced with this challenge, the
    erroneous impression that there was no money in a group of people using a “free”
    operating system, publishers held back their entry into Linux documentation.


    There is a third reason unmentioned until now that may have kept the books on
    Linux at low numbers for a while: Linux users simply did not need the material.
    After all, they had the Linux Documentation Project. The LDP is a collection of
    volunteers located around the world whose sole objective is to create the most
    comprehensive documentation on Linux. Period.


    If you are new to Linux, or an old wiz guru, there is something at the LDP Web
    site for you. You’ll find a dizzying array of FAQs and guides for a wide range
    of tasks. For the more specific tasks, there are multitudes of HOWTOs and mini-HOWTOs,
    documents that drill down to the lowest level of Linux minutiae, if need be.


    The Linux Documentation Project operates on the principle of open source, so contributors
    are pouring their knowledge into


    # And, and until recently, no one smelled the money in Linux.'
