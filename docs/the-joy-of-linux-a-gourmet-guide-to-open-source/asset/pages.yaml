    # MOVING ON TO A NEW THING


    There is no perfect hardware or software solution to keeping people out of your
    PC. At best, you can simply hope to deter them. This strategy has worked for a
    long time throughout many civilizations.


    The ancient Egyptians, for instance, clued into deterrence when they decided to
    stop burying kings inside mammoth pyramids, which were essentially big billboards
    that said “Steal Me” to any thieves hanging around the Nile. In 1504 B.C., they
    started burying their kings in hidden tombs within the Valley of the Kings.


    Most of the tombs did, eventually, get looted. But one tomb survived relatively
    intact until 1922: that of the young pharaoh Tutankhamun.


    But the ancient grave robbers did have one thing on their side: time to search,
    time to dig, and time to rob.


    Even with the lightening speed of the Internet, today’s modern plunderers do not
    have that luxury anymore. They have got to be fast and quiet, before someone catches
    them with their hand in the cookie jar.


    Steal time from them and they may not be able to steal data from you.'
