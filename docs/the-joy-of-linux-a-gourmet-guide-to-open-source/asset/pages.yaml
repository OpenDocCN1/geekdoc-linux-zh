    PDP-11 to be exact. Thanks to C and the wonder of portability, the two rewrote
    the embryonic UNIX and ported it to the new hardware.


    Portability allowed UNIX to easily move from its earliest host to its new home,
    and it also eased the spread of UNIX among computer enthusiasts (who weren''t,
    at the time, quite the same people as they are today, owing to the scarcity of
    computers outside research institutions and universities). Bell Labs, thanks to
    the antitrust woes of AT&T, was fairly friendly about the distribution of the
    UNIX source code for several years, releasing at least one version to universities
    free of charge, and another for $100. Businesses and the government had to pay
    tens of thousands of dollars. For a while, the source code for UNIX flourished
    until AT&T made moves to halt it, citing its ownership of the proprietary source
    code.


