    # Access Is Denied


    If someone can get to your machine and has the talent and the time, then eventually
    he she will be able to break into it. This is simply inevitable. What you, the
    user, need to do is tweak your machine to the point where amount of time and energy
    spent on breaking into your PC''s data stores is not worth it to the casual thief,
    and maybe even the professional one. Following are some ways you can make a cracker''s
    life a little harder.


    First, you need to get rid of a serious security flaw that shows up right after
