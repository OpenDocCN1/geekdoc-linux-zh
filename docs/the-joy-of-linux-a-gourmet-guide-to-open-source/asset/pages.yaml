- img_proc: true
  md: 'looking at X Window, or X for short. It''s called X not so much to keep it
    short but to keep Linux users from having to even say the word "window" too often.
    It makes us a bit jittery.


    Non-Linux users are often a bit confused about what X does. On the surface, it
    looks like it just runs the windows and menus you see on the screen. But there
    is a lot more going on here than it appears.


    In the Microsoft Windows environment, you have the DOS operating system with the
    Windows operating system interface running on top of it. "Running on top" means
    that Windows is essentially one big program that runs from the DOS platform, essentially
    no different from running a program like Doom from DOS. The result of this is
    that you must have DOS running in order to run Windows.


    For Windows NT users, it''s a bit more simplified. Windows NT/2000 is a true graphical
    user interface (GUI) that runs on its own. The advantage here is that you really
    do get what you see. You can still run DOS when you have to, but in Windows NT,
    a DOS emulator runs within Windows. An emulator is a program that can mimic the
    look and feel of another operating system. One disadvantage to Windows NT, however,
    is that a PC must have a lot more memory and speed to run as efficiently as a
    comparable Windows 98 system. All that pure GUI eats up a lot of system resources.


    The Linux operating system is most analogous to the DOS/Windows system. Like DOS,
    Linux is a text-based, commandline operating system (albeit a much more sophisticated
    one) and that''s all. This is an important distinction. Linux was designed to
    be a command-line OS, not a GUI. The same holds true for DOS. But in both cases,
    someone has come along and added the frills and functionality of a pretty GUI
    that runs on top of these command-line OSs.'
