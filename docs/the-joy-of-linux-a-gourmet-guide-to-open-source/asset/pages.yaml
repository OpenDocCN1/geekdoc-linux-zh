- img_proc: true
  md: 'This paper, first presented at the Linux Congress in May 1997, is the definitive
    document that explains the methodology and philosophy behind open-source software.
    The Cathedral and the Bazaar tells the story of Raymond undertook the task of
    fiddling with an e-mail client, and how he ended up taking on the development
    of an entire project, one of whose results was the hugely popular e-mail client
    fetchmail. The story of fetchmail is a vehicle outlining Raymond''s journey of
    self-discovery of how open-source development should work. Raymond becomes more
    involved in the project that would become fetchmail, he begins to realize how
    efficient and how powerful the peer review and feedback loops contained within
    the open-source model are.


    ![](img/ebce5f58276413c456937bd42a097346_317_0.png)


    Raymond derives many of his insights on open source not only from his fetchmail
    application, but also from observing Linus Torvald''s success with Linux. In many
    ways, The Cathedral and the Bazaar is a very good commentary on how Linux gets
    put together by a community of people scattered all over the planet.


    One of Raymond''s maxims identifies one of the most prominent characteristics
    of Linux: "Release early. Release often. And listen to your customers." This is
    certainly how Linus handles Linux, as new beta releases for the kernel come out
    nearly every two weeks, if not more.


    Just how revolutionary is The Cathedral and the Bazaar? It is said to have prompted
    Netscape Communications, Inc. to release the entirety of the source code for the
    Netscape Communicator browser suite as open source, forming the Mozilla project.'
  merge: -1
