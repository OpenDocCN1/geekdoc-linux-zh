    # Getting the Jargon Down


    Web: http://www.tuxedo.org/~-esr/jargon/


    So, you know how to run Linux but you find yourself at odds with the language
    your fellow enthusiasts use from day to day? Then check out Eric Raymond’s Jargon
    File—the most complete guide to hacker-talk ever known. Through the jargon file,
    you’ll learn everything from “cargo cult programming” to “bondage and discipline
    languages.”


    > If you are new to an old Linux, or an wizened guru, there is something at the
    LDP Web site for you.


    Although this isn''t a Linux-specific resource, you''d be hard-pressed to communicate
    with long-time Linux enthusiasts and come across some term or phrase that isn''t
    discussed in this work. In addition, spending some time reading through it without
    any particular goal in mind is a good way to learn a lot of the unreported history
    of computing.


    Remember the 2000 presidential election’s “hanging chads?” The Jargon File can
    tell you why they’re called that.


    # Peeping through the Windows


    The sheer number of Linux interfaces makes it impossible for someone to point
    at a Linux desktop and say *That is Linux.* That would be like coming to anyone
    in a sailor’s uniform and saying *You* are looking for some action. It’s ridiculous
    to place such sweeping stereotypes on any one group of people (though, in retrospect,
    the sailors may have been a bad example), and it can never be done to the Linux
    desktop.'
