    Linux distributions fully provide fips, a utility that can resize and create FAT
    (either FAT16 or FAT32) partitions in Windows systems. The fips utility reduces
    the size of your current FAT partition and creates a new FAT partition. Because
    Linux will only sit inside an ext2 file system, created only from unformatted
