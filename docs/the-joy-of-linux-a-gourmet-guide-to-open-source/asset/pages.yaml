- img_proc: true
  md: 'At home, I was happily chugging away on Windows for Workgroups 3.11. This Sun
    interface behaved completely differently, with a taskbar, start menu, and pop-up
    menus. Who would ever use stuff like this? It was weird!


    As time went on, I became more adept at maneuvering the interface and managing
    the rigors of SGML and TeX. I even grudgingly admitted I was starting to like
    the speed of the Sun workstation, since it was noticeably faster than the 286
    I had at home.


    Then I had an epiphany.


    My workload began to noticeably less about three months after I started; my wife
    was due with our firstborn, and I was prepared to take a leave of absence at any
    moment. Since I had more time on my hands, another editor at the office, who was
    far more savvy with the ways of the computer world, pointed out how to run this
