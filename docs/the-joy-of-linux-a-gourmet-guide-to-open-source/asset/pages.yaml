  md: '# # CHAPTER 12


    # ## Breaking up Is Hard to Do


    # MY FIRST TIME


    It was 1992, and I was a stranger in a strange land, looking at my first X desktop
    with a feeling akin to horror. I Was, small-town Indiana boy, working in a grungy
    little office-looking the United Nations complex on the East River, staring at
    what appeared to be a windows-like GUI on the flickering mono-chrome screen.


    The view outside was almost as intimidating as the one inside. Across the way
    I could see the Turkish embassy; out on the East River, the Greenpeace Rainbow
    Warrior sat in the middle of the channel, barking megaphoned protests at the U.N.
    On the way to work that morning, I had passed the Iranian and Iraqi embassies,
    rather troubling in the post-Gulf War era. I had also passed more adult bookstores,
    peep shows, and street hawalkers than I could count, but given my history with
    such establishments, I did not linger in front of these for long.'
  merge: -1
  pgno: 294
- img_proc: true
  md: 'I was a huckster, smelling fresh of corn and Indiana clay, transplanted to
    this island called Manhattan to work as an academic journal editor. I commuted
    from our home in New Jersey two hour one way to get to this building; by 9 o''clock
    on those first days, I was already spent, mostly from culture shock.


    Of course, I would soon learn the ways of this city, and start shouting at tourists
    in the subway turnstiles the hell out of the way like the rest of the citizenry.


    # Today, I was introduced to X for Solaris, and I was not happy.


    But that was months down the road. Today, I was introduced to X for Solaris, and
    I was not happy.


    My mentor/editor started to run me through the ins and outs of this system, which
    she just called UNIX, showing me the two important tools SGML editor used to compile
    articles and the e-mail application used to communicate with article authors.
    I would need to do my work:


    E-mail I thought I could handle, because the last place I''d worked had an internal
    messaging system. SGML, on the other hand, scared the bejeus out of me. They had
    told me when I interviewed for the position that I would be using desktop publishing;
    this thing before me looked nothing like Ventura Publisher or Adobe PageMaker,
    which was what I had seen before.


    “No, no,” my new boss told me. “Not desktop publishing. Electronic publishing.”
    There were no layout capabilities, and no real-time WYSIWYG, either—just a text
    editor with tags that you had to manually preview every time you wanted to see
    how the final text would look. This editor also dealt with TeX, another context-sensitive
    tagging language, which we used to build complex mathematical formulas.


    I was in hell.'
