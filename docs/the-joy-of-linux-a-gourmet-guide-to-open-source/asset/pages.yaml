  md: '# Chapter 13—THE LINUX SUTRA: RESOURCES 293


    the general public, but by then the word had gotten out and thousands of free
    software devotees climbed on board the GNOME bandwagon.


    GNOME, like KDE, is a desktop environment. It is not a window manager, like Enlightenment,
    IceWM, or Sawfish. Window managers control the look and feel of the windows, menus,
    and other visual components of a graphical interface. Desktop environments, on
    the other hand, provide a specific platform for applications to operate within.
    If an application is written for a desktop environment it can tap into a wide
    range of common features with that environment.


    In the Linux community, GNOME is lauded for more than its free software status.
    It is generally regarded as more aesthetically pleasing than KDE, as the themes
    available for GNOME have more eyeappeal.


    Beyond the look of GNOME, Icaza has pushed new boundaries for the perception of
    free software in the corporate world. A year after the release of GNOME 1.0, Icaza
    partnered with several major corporations to form the GNOME Foundation—a non-profit
    organization dedicated to the ideal of keeping GNOME development moving forward
    in a rapid and open way. The GNOME Foundation, with high-power members such as
    Sun Microsystems, Compaq, and IBM, wants to make GNOME *the* interface for Linux,
    and to make that interface very easy for users to adapt to.


    > Beyond the look of GNOME, de Icaza has pushed new boundaries for the perception
    of free software in the corporate world.


    One of the major hurdles to people using Linux has been the perception that it
