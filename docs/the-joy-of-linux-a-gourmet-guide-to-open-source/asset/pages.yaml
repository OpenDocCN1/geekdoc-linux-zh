    the ambiguity in the English word “free.” Stallman never meant that software was
    to “cost nothing,” but rather coined the phrase to represent the freedom of the
    source code itself to be copied and redistributed. Among many computer enthusiasts,
    though, “free software” often carried the connotation of being something a developer
    would not be able to sell if he wanted. “Freeware” was typically viewed as low
    quality or incomplete, something companies gave away to prove that you you needed
    to buy something better.


    Further, despite the fact many had benefited from Stallman’s GNU project, there
    was a growing sense that the implicit politics of the Free Software Foundation
