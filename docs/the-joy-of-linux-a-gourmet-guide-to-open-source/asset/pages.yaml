  md: '# 158 THE JOY OF LINUX


    When you partition your system, you can give some thought to security. It is recommended
    that you place the /var mount point on a separate partition. /var is usually where
    your e-mail is saved upon receipt. If you were, perchance, e-mail bombed, /var
    could fill up very quickly. If the /var directory was in the same drive partition
    as the root (/) directory, that would be bad; if the / partition fills up, your
    system will likely grind to a halt. Sticking/var on its own partition will avoid
    this calamity.


    You might also consider making partitions for individual users, just in case they
    get cute and try to fill up the / partition to crash the system.


    And after you install your system, make sure you know exactly where to find updates
    for your distribution of Linux, and check this update location often, so your
    system is as up to date as possible.


    # Less Is More


    Installing less software is a good security procedure for your Linux box. But
    even a minimalist installation of Linux may leave you with some applications running
    without your knowledge. These applications are known as services, which Linux
    runs because it is, at heart, a server OS. Three well-known services that may
    be running on your system now are ftp, telnet, and sendmail, but a lot more may
    have started running when you booted Linux. Quite a few of these services present
    security exploits to the outside world if they are not configured properly.


    Tomes of material deal with the topic of configuring these services so they are
    resistant to attack. For now, just turn the things off. Running services .you
    don''t need is like using a GPS unit to get to the corner grocery store. Not only
    does it pose a huge security risk, it also eats up processor time.'
