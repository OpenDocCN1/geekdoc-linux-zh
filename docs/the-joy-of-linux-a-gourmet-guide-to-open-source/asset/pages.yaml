    know turning something on and off wears wears out more quickly, or something.


    Linux, and UNIX in general, presents an even better argument for leaving a computer
    on all night: If you don’t, and you don’t take a little additional care, it messes
    things up—just a little at first, then in a reality, really bad way. Linux, you
    see, comes awake on many machines at around three in the morning and sets about
    doing some light housekeeping. It shuffles log files around, deletes things that
    don’t need to exist anymore, and shakes itself out. Sometimes, if things aren’t
    quite right, it sends mail telling you so. If your machine isn’t during the early
    morning, it can’t ever do any of this stuff. If it can’t do this stuff, directories
    slowly fill with redundant files and scraps of messages the computer sends to
    itself. The /tmp directory, which you can think of as your computer’s appendix,
    slowly fills up with the nail-bitings and waste products of a computer hard at.
    Over time, you run out of space and the computer stops being able to keep the
    sort of temporary information it needs to do the essentials. That’s what ours
    was doing: quietly strangling its own rubbish.'
