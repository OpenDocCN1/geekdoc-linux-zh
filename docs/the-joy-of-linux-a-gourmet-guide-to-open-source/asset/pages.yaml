  md: '# INTRODUCTION


    Enter Tamer Fahmy, a student in Germany. Tamer had the same camera, used Linux,
    and knew more than enough of the programming language Python to get at the pictures
    he was taking with the camera. A quick download later and I was in business.


    Or not.


    Tamer''s software was good, but a small bug kept it from working on my machine.
    I wrote him, politely asking for help in getting to the bottom of the problem,
    and he was quick to respond. Meanwhile, the pictures sat just waiting to be looked
    at.


    Now, my knowledge of Python is limited, it is a dweedish way of saying I don''t
    really know any Python at all. however have the source code to Tamer''s program,
    not to mention a burning need to see my pictures. I opened my second beer of the
    night, opened Tamer''s program in my text editor, and set out to find the problem.


    A few hours and beers later, having speed-read a few Python tutorials and engaged
    in an utterly quixotic session with a debugger, the problem was solved to my satisfaction.
    I wrote Tamer with the fix.


    Tamer was very polite when he wrote back the next morning to tell me that although
    I had fixed the problem, I had it all wrong, but that it was a good effort and
    it put him on to where the problem was, and would I please check out the attached
    version with his fix?


    Within 24 hours, I''d bought the camera, found a Linux solution to make it work,
    discovered a bug, fixed a bug, gotten an education in Python on why one must never,
    ever directly call the POSIX module, had the camera working, and made a new friend.


    The thing that makes Linux work is that it has grown out of thousands upon thousands
    of interactions just like the one I described. It started out as a a way to bring
    a little bit of UNIX to typical home computers, and now it''s hard to name an
    area of'
