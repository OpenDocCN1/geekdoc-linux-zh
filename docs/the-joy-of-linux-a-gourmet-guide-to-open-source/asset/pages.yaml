- img_proc: true
  md: '# Breaking up Is Not Hard to Do


    The world of partitions is a strange one to the average Windows user, but its
    something we eat, sleep, and breathe with Linux.


    On most Windows machines, there is typically one partition on a hard drive. This
    is often true whether the hard drive is 6 or 60GB in size. You say you have multiple
    hard drives listed in Explorer when you know the system just has one physical
    hard drive? That''s because when Windows sees a new partition, it automatically
    assigns a drive letter to the drive. This is a pretty simple system.


    This is not what happens in Linux, however. A good Linux installation needs several
    partitions to work well. But if you were to open the File Manager in Linux, you
    would see the appearance of a single drive''s directory tree. So what gives?


    Linux manages its files in a completely different way than Windows does. Rather
    than using drive letters to refer to a partition and its corresponding file system,
    Linux separates the files and directories needed to compose its single file directory.
    In truth, this “single” file system is really composed of separate directory trees
    that are seamlessly connected across partitions. Where these sub-trees connect
    or break from the main directory tree are called mount points.


    Rather than using drive letters to denote partitions, Linux uses a different naming
    convention:


    ```

    /dev/[Drive Type][Device Where Partition Resides][Partition Number]

    ```


    This naming convention isn’t too tricky, once you get the hang of it:


    +   * All devices in Linux are managed in the /dev/ directory, including hard
    drives and their partitions.'
