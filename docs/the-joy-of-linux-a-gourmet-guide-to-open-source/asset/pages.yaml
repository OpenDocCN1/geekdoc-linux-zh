  md: 'on it. We were separated by group consensus, and another opportunity to win
    over one of the Linuxless was lost.


    The statistics shared among Linux enthusiasts (the Anarcho-Syndicalists about
    about wildly profitable collectives in Basque country) tell a story that indicates
    Linux is growing a little every day, creeping (or charging) into more and more
    places in the computing world. Its share in every area of computing is growing,
    even as some of the poor, dumb giants who thought they had all sewn up are groping
    for ways to alternatively ignore or coopt the whole thing.


    A thing that was concocted on a 386 to cure a Finnish student''s homesickness
    for the Mother Operating System, UNIX, a thing that once couldn''t even be bothered
    to help boot the computer it was running on, is being crammed into palmptops,
    extended to run on giant mainframes, tweaked to run industrial machines, and massaged
    to make it useful to people who thought it was a stroke of computational genius
    to get America Online installed on a computer they brought from Sam''s Club.


    NASA scientists use Linux (one of them wrote the crucial bit of software that
    spared me from having to go out and buy a new ethernet card for my computer),
    rebellious teenagers use Linux, Microsoft has even been caught using Linux. At
    the high school I used to work for, it sparked a subtle realignment among the
    nerdy boys walking the halls, who went overnight showing off garish pages they''d
    crafted with Microsoft FrontPage for the sole purpose of trading Nintendo cartridges
    to loudly trading shell accounts to their Linux “boxes” among each other and throwing
