    - Yellow Dog Linux (http://www.yellowdoglinux.com/) A popular Linux release for
    the Macintosh platform.


    # The More the Merrier


    There is always more than one place to get the latest news on any given topic.
    This is certainly the case for Linux, which has embraced the concept of communications
    far more than its Windows counterpart. Linux Web sites exist everywhere, both
    informative and commercial.


    Here''s where we help you sort through this orgy of information and nail down
    the Web sites that will keep you in the know 24/7.


    # Slashdot


    Web: http://slashdot.org


    There''s plenty to say about Slashdot. It''s possibly the best known “Linux site”
    going, though it isn''t really about Linux (all the time). The banners sum it
    up: “News for Nerds, Stuff that Matters.” There''s an implicit set of values expressed
    here, and whether what matters to Slashdot''s maintainers matters to you is something
    you''ll have to wrestle with.


    Slashdot has one claim to-infamy that sends shudders up and down the spines of
    Webmasters everywhere: the dreaded Slashdot effect. Documented in informal papers,
    experienced by every site that ever made the mistake of carrying “stuff that matters,,”
    the'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# Chapter 13—The LINUX SUTRA: RESOURCES 303


    Slashdot effect is what you get when tens of thousands of Slashdot readers converge
    on a Web site at once. Some sites cope, others collapse under the strain.


    Slashdot’s core community is computer hobbyists and professionals. Most seem to
    claim an allegiance to Linux as their operating system of choice, and of those
    who don’t there’s still a general agreement that something General UNIX-like is
    best. Many consider themselves primarily “hackers,” and any story that deals with
    use of the word “hacker” as a pejorative denote of “computer criminal” (as opposed
    to “computer problem solver”) invites much wrath.


    > There’s an implicit set of values expressed here, and whether what matters to
    Slashdot’s maintainers matters to you is something you’ll have to wrestle with.


    Thanks in part rallying points like Eric S. Raymond’s “Portrait of J. Random Hacker,”
    (part of the Jargon File), some of the more authoritarian members of the Slashdot
    community have laid claim to the right to grant the titles “hacker,” “geek,” and
    “nerd.” Professions of geek status are frequently met with scorn when they come
    from the wrong quarter (as regular Slashdot columnist Jon Katz learned when he
    declared himself geek during one of his odes to the digital revolution and its
    Slashdot cadre.


    In the past two years, Slashdot has risen from “frequently visited site of the
    Linux community” to something else as the Linux/Open Source/Free Software rises.
    The site’s regular readership has shifted dramatically as the curious are attracted
    from outside the older Slashdot community. The site’s appeal is such that, even
    though the Linux emphasis remains, computer or technical enthusiasts of many stripes
    find something to keep them coming back. The site also attracts “trolls,” content
    to'
  merge: -1
  pgno: 334
- img_proc: true
  md: '# THE JOY OF LINUX


    merely stir up trouble on a primarily Linux-oriented forum, just as they probably
    do on similar Usenet fora.


    From the mix of longtime UNIX fans, Linux devotees, selfproclaimed nerds, trolls,
    passers-by, and even Microsoft fans comes a community of some pungency.


    If Slashdot were yet another news site, no one would care. What makes what it
    is are the discussions that accompany each story that appears on its pages. Hundreds
    of people take the time to argue, debate, villify, and troll over the issues.
    Not surprisingly, some of the more enthusiastic participants get a little carried
    away from time to time, which has caused the maintainers to introduce a fairly
    sophisticated peer-based moderation mechanism to make sure the best comments get
    to the top of the heap and the worst trolls are consigned to the community dungeons.
    Does it work? Sometimes.


    ![](img/ebce5f58276413c456937bd42a097346_335_0.png)


    Some would maintain that Slashdot is a stage through which all new Linux enthusiasts
    must pass, whether they continue to visit it or not later in their Linux career.
    The raucousness of the site, combined with a flippant attitude toward many of
    the audience excoriate as “old media” attitudes about good journalistic practice
    can be a little irritating. On the other hand, the maintainers'' hearts are in
    the right place.


    Even if you end up hating it, Slashdot is a force to be reckoned with the Linux
    community.


    # Linux Today


    Web: http://linixtoday.com


    Linux Today has been cited as the best news site for Linux events and information,
    a distinction it maintains well. Primarily a newsfeed site, Linux Today offers
    story synopses and links'
  merge: -1
  pgno: 335
- img_proc: true
  md: '# Chapter 13—THE LINUX SUTRA RESOURCES


    to all things Linux. There are also talkbacks provided for each story link. What
    differentiates Linux Today from Slashdot is the posting of original news content,
    which Linux Today does on a regular basis.


    Linux Today can be viewed as is, or customized to display the topics that interest
    you most. Literally hundreds of site links are made available at any given moment.


    Linux Today is the best place to go to get up-to-date news on all aspects of the
    Linux community.


    # Freshmeat and LinuxApps.com


    Web: http://freshmeat.net; http://www.linuxapps.com

    Because of the decentralized nature of Linux, locating new and updated apps could
    potentially be a real pain in the butt. The existence of these two Web sites,
    however, alleviates that pain. Freshmeat and LinuxApps provide the most complete
    libraries of Linux applications available anywhere. Visit either one of these
    sites, and you’ll understand this bold statement.


    Organized by categories, applications are arranged into project pages that give
    users access to not only the latest download version, but to the histories and
    change logs for that application as well. Any Linux developer who wants his or
    her application seen and will post it on one or both of these sites.


    These central repositories make finding Linux applications for your box a breeze.


    # DELIVERED IN BROWN PAPER WRAPPERS


    The Web’s a great place to find out all sorts of information about Linux. So great,
    in fact, that at one point during an unhappy time supporting over one hundred
    Windows users I found myself having to tell search engines to most definitely
    not return information about how to fix a specific problem under Linux.'
  merge: -1
  pgno: 336
- img_proc: true
  md: '# THE JOY OF LINUX


    Sometimes, though, using the Web isn’t an option, especially when the problem
    you’re having is getting your Linux machine to talk to the Internet at all.


    During times like this, the most comforting thing in the world is a good, thick
    book you can balance on your lap as you figure out your problem.


    Other times, when you can’t actually sit down to your computer and play with Linux,
    it’s nice to be able to read about it, and gain a little insight into why things
    are the way they are. So, presented for your edification, some must-have books
    for the curious Linux fan. Everything from how to make it run to why it runs the
    way it does.


    # Running Linux and Linux Configuration and Installation


    So, you have Linux on your machine, you’re curious about what makes it tick, and
    you’re looking for a book that does more than tell you you could be wrapped up
    in inendo. Look no further than Linux Configuration and Installation (called LC&I
    by people in the know) and Running Linux.


    First, a disclaimer: We both work for one of the co-authors of Linux Configuration
    and Installation.


    Double backflip disclaimer: Michael used LC&I to complete his first real Linux
    installation lo many years ago. It’s a good book, written in part by none other
    than Patrick Volkerding, the ever-slackful maintainer of the Slackware distribution.
    The advice it gives is good, close-to-the-bone, hands-on information for the Linux
    newbie who wants to figure out how things go together.


    LC&I is a popular book among many older Linux users who remember the days when
    Red Hat was still “the newbie distro” and Slackware was king.


    Running Linux is well-known, well-loved, and frequently the first recommendation
    of many Linux lovers who are trying to'
  merge: -1
  pgno: 337
- img_proc: true
  md: 'help out first-timers as they navigate the rocky waters of, well, running Linux.
    It’s a beneficiary of the wisdom from the Linux Documentation Project’s own Matt
    Welsh, as well as that of Matthias Kalle Dahlmeyer of the KDE project and Lar
    Kaufman, who’s been writing about UNIX for close to 20 years. It’s got information
    on just about every aspect of Linux you could want, from the simplest configuration
    to tips on Linux programming. Sometimes it’s a little over-general, but if you’re
    a self-motivated learner, willing to look up information based on the leads the
    book gives you, you’ll learn a lot with this book as your guide.


    # Linux in a Nutshell


    O’Reilly is famous for its Nutshell series of books. If you’re already familiar
    with the bulk of the issues involved in day-to-day maintenance of your Linux system,
    but need a quick reference, *Linux in a Nutshell* is the one to go with. It offers
    a complete listing of the most common commands and programs on a Linux machine
    with all the gory details of command-line switches and options. Think of it as
    a Linux man dictionary. Some people say it’s the Linux man pages dumped onto paper,
    but if you like to look up solutions in a book, that’s a *good* thing.


    # UNIX Programming Environment


    Want to go all the way back to the time when men were men, women were women, and
    UNIX scared the pants off of everybody? Written by Brian Kernigh and Rob Pike
    in 1984, *The UNIX Programming Environment* is one of those texts that tell you,
    by virtue of explaining how the newbies were taught to deal with it, exactly where
    UNIX was at. Kernighan was one of the co-authors of the programming language awk,
    which is still in use as a general-purpose text file manipulator.'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# THE JOY OF LINUX


    The information in this book is nothing you aren’t going to anywhere else, but
    it’s interesting because it’s a look at UNIX from the days when the OS was unvarnished
    with GUIs. People learned UNIX from the command line and lived their days in front
    of text terminals. Even more interesting, when you think about it, it is the fact
    that the underlying mechanisms you might not ever see if you stick to the desktop
    your distribution came with are still at work under some form or another.


    In addition to the introductory sections on how to live in the UNIX shell from
    day to day, the bulk of the book is comprised of the sorts of issues unique to
    UNIX programming.


    Through the introduction to UNIX programming, the authors stress time and time
    again the beauty of UNIX. Its modularity and capability to reuse small, efficient
    programs provides a remarkable amount of leverage to produce elegant solutions
    to problems very simply.


    The next time you’re staring at another reinvention of the wheel in the form of
    some giant program that does everything in one big lump, wondering why it loads
    so slowly and runs so poorly, consider the advice in this book and remind yourself
    that there’s a better way to do things.


    # UNIX Philosophy


    Where the previous book taught the nuts and bolts of building code in UNIX, UNIX
    Philosophy provides a guide to some of the rallying cries of UNIX enthusiasts
    everywhere. You won’t learn how to do anything with your new Linux system with
    this book, but you will learn about some of the design ideals common to the many
    UNIX variants out there. It’s readable even to largely non-technical types who
    are interested in stepping into the shoes of people who spend their days thinking
    about the best way to build complex computing environments.


    As you read, you may also find that it helps you understand the'
  merge: -1
  pgno: 339
- img_proc: true
  md: '# Chapter 13—THE LINUS SUTRA: RESOURCES 309


    reasons behind the somewhat terse and unforgiving environment the Linux shell
    provides. In turn, it will help you develop your “Linux intuition,” and you’ll
    find a lot of answers coming more quickly as you continue to learn.


    If there’s one downside to this book (and we’re mentioning it only in case you
    ever get into one of those flame wars we were talking about), it’s, like many
    simple books that spell things out for the uninitiated, it has become a sort of
    religious text to enthusiastic young computer-science majors everywhere. If ever
    a branch of the Taliban forms that concerns itself with keeping operating systems
    pure and simple, this will be its central document. Of course, that isn’t all
    bad. Obviously we think we could do a lot worse than to fall into the clutches
    of UNIX fundamentalists, especially when you consider the alternatives.


    # WRAPPING IT ALL UP


    Now that we are here at the end, we can only wait with anticipation about what
    the future of Linux holds. Soon, the Linux 2.4 kernel will be released, giving
    Linux users and developers a whole set of tools to play with.


    After all, play is really the name of the game in the Linux community. Everyone,
    from the multi-millionaire CEO to the curious newbieie, has a sense of fun when
    they use Linux. This is not an operating system that makes you use one of rules—it’s
    something that will let you make up your own rules and play your own game.


    > After all, play is really the name of the game in the Linux community.


    This is the secret of the Linux community: the overwhelming sense of play that
    permeates every aspect of the user’s experience. Do you think we would subject
    ourselves to some of these shenanigans otherwise?'
  merge: -1
  pgno: 340
- img_proc: true
  md: 'This is why we can smile when facing unsupported allegations from yet another
    Microsoft flunky; we know that ultimately, we have already won the OS wars, since
    we are having the most fun.


    And as long as it’s fun, Linux will continue to grow and prosper.'
