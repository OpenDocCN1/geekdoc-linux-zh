    to remove the new FAT partition.


    You may have heard legend and lore that eventually you will have to use the DOS
    utility fdisk on your PC. This utility is used when you have to completely wipe
    the data from your hard drive.


    When you install Linux, there are really two instances where you will need to
    use fdisk. The first instance is if you plan to install Linux by itself on the
    PC or to completely wipe the slate clean and create new partitions to install
    Linux. The second instance is to eliminate any partitions a third-party partitioning
    utility (such as fips) might have created for you. The fdisk utility can wipe
    these non-ext2 partitions from the hard drive.


