  md: '# Chapter 7—SWITCH HITTERS 169


    Where are the baby bees raised? If you said the honeycomb, you’re right. If you’re
    wondering what the heck this has to do with partitions, just be patient.


    The honeycomb is an ingenious device composed of hexagonal cells made of beeswax,
    where honey and bee larvae are stored for safekeeping. Now, ponder this: How would
    the bees get by if they did not have honeycombs? The answer is they wouldn’t.


    Keeping the honeycombs in mind, consider how data is stored on a disk drive. Data,
    you see, cannot be stored on a drive without some sort of structure already in
    place for the data to be organized. When data is placed on a drive, it is written
    into this structure, called a file system in the Linux community. A file system
    is the format in which data is stored—a honeycomb of cells, where each little
    piece of data gets placed.


    > While we may not run out into the street shouting this, many Linux users think
    dual booting is a good way to go—especially for new users just learning how to
    get around in Linux.


    Computers being computers, it’s a little more complicated than that. Data for
    a single file, for example, does not get stored in data blocks that sit right
    next to each other. The data may be stored in data blocks 456, 457, and 458, and
    then block 6,134, and so on. (This is an oversimplification, but you get the idea.)
    It’s the job of the file system to track the location of every part of a file.
    When you send a command to work with a file, the file system knows all the separate
    blocks where the file is stored.


    Because of all this tracking and retrieving, computer engineers came up with idea
    of keeping the file systems small, even on large hard drives. In this way, the
    idea of partitions came into play. Basically, the partition is a virtual barrier
    that tells the file'
  merge: -1
  pgno: 200
- img_proc: true
  md: 'system: “You used to be able to write to blocks 1–25,000 all over the disk,
    but now you’re only allowed to write to blocks 1–17,500. A second file system
    will write to blocks 17,501–25,000, so hands off!”


    Thus, you have partitions, and each partition can use a different file system.
    As an analogy, honeycombs created by honeybees are different from those created
    by wasps—similar structure but different outcomes.


    There are six major types of file systems used on Intel-compatible PCs today:


    +   - FAT. Used by the DOS (including Windows 3.1 and Windows 95) and Windows
    NT operating systems.


    +   - FAT32. Used by the DOS (including Windows 95b and Windows 98), Windows NT,
    and Windows 2000 operating systems.


    +   - NTFS. Used by Windows NT and Windows 2000.


    +   - ext2. Used by Linux.


    +   - HPFS. Used by OS/2.


    +   - swap. All operating systems use this type of format, which is used by the
    PC as auxiliary RAM. Linux, however, puts this space on a separate partition.
    When a program or process uses more memory than RAM on the computer, the swap
    partition provides additional memory for the process to use.


    Different types of partitions typically do not work with other operating systems.
    Thus, in order to install Linux on your PC, you will need to create an ext2 partition
    on your hard drive. Unfortunately, if your PC contains a typical installation
    of Windows, your Windows file system is contained within one big partition that
    covers your entire hard drive. This leaves no room for a partition and a new file
