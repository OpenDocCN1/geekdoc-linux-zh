    And therein lies the source of Debian’s special place among Linux distributions:
    They know what they think is right (free software), and they do what they can
    to stick to that. So well, in fact, it’s hard for some people to deal with rationally.


    Debian’s other distinction is its nearly glacial production cycle, which is born
    out of the most meticulous quality-control process going among the major distributions.
    Where other distributions go through two or three releases, Debian’s developers
    prepare one. The upside is that when you install Debian, you’re guaranteed a meticulously
    tested distribution with little that will likely bite you later on. The downside
    is you’ll celebrate a birthday or two waiting for a new release. Debian’s developers
    are fairly intractable on this point, though, and argue that it’s better to have
    the trailing edge working reliably than the bleeding-edge, weak, bleeding all
    over the place.


    Debian’s other secret weapon is how it manages to get packages of software onto
    your computer. Through a fairly ingenious tool called “apt-get”, Debian’s able
    to download not only a piece of software you want, but every piece of software
    it might need to work correctly with a single command. The same sort of simplicity
    is involved since you have installed it. This appeals to the cardinal virtue all
    good hackers share: profound laziness. Why painstakingly download package after
    package when one command does it all?


