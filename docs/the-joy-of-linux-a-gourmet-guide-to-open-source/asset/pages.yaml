    # YOU CAN HAVE IT ONLINE OR REAL-WORLD


    Although the Linux community has a bit of a superiority complex (it gets a bit
    smug whenever a new virus makes its rounds through the Windows PCs of the world),
    Linux is not, nor has it ever been, invulnerable to attacks. That said, Linux
    is, code for code, a more security-minded operating system than any of the Windows
    family. But even a cop on the street can get mugged; so, too, can a Linux system
    be compromised by mischief makers and evil doers, they should put their minds
    to it.


    The simple truth is, if someone really wants your PC, they will eventually find
    a way. The trick is to make it hard enough for them that they will get discouraged
    and go away, or increase the likelihood that they will be busted on their way
    in.


    Linux, by its very nature, makes setting up such obstacles pretty easy to do.
    The attributes that some critics contend Linux clunky and difficult to use are
    the very attributes that make it hard for intruders to do a number on your Linux
    machine.


    Before examining these mystical attributes, let''s review the ways that a Linux
    machine (or any other PC for that matter) can be boarded and plundered. Then it
    will be easier to see how Linux can repel these different types of intruders.


    # Getting Physical


    Physical access is the most straightforward way someone can get to your machine
    and its data. One way this is done with the use of rappel lines from the ceiling.
    Usually, however, it simply involves someone, maybe even someone you know, casually
    sauntering up to your PC and reading what''s on the screen.'
