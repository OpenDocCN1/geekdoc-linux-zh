- img_proc: true
  md: '# ACKNOWLEDGMENTS


    You never know quite where to begin with these acknowledgments, since the beginnings
    of books are often awash in a sea of discussions and outlines. With this book,
    the beginning is also a bit murky, though the idea for the book is not. That came
    from the brain of one of my dearest friends, who thought an anthology/history
    of Linux would be a good thing. My friend, being the slightly lurid, yet lovable,
    person that she is, wanted to couch the book in the slightly lurid, yet lovable,
    theme of The Joy of Sex.


    My initial reaction to that was this was a hysterical idea, and I was glad I wasn''t
    doing it. To understand my reluctance, you must understand that I tend to be the
    one in my circle of friends that gets embarrassed first whenever conversations
    latch into double entendre. Putting together a book chock full of innuendo was
    not something I felt comfortable doing.


    Still, the idea was out there. And when I told my friend about a guy from college
    I knew who was a brilliant writer of Linux-related material, she pounced on him
    to write this book. I figured I was safe from a three-month blush-fest.


    So when Michael called me and wondered if I could help him out on this book, I
    had some serious misgivings. Not with helping him, but with the whole theme of
    the book.


    Therefore, I must give special thanks to my good friend Lynette, who managed to
    drag me out of my Midwestern shell and help me write innuendo and puns with gusto
    for the past few months. Because talking dirty is where friends like Lynette are
    really a big help.


    I must also thank my co-author Michael, who invited me onto this project and gave
    me an opportunity to learn even more about Linux and how to be a better writer.
    I have been very glad that the tides of time have made us better friends, even
    if he does call me a “quisling bastard” now and again.'
