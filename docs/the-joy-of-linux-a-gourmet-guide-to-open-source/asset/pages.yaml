    computing where it doesn’t have a useful, vital place. That growth, from hobby
    to phenomenon, has been built by people cooperat- to fix small vexations, add
    new capabilities, and find ways, frankly, to play with a new toy.


    Which brings us to an issue, which is my failed history of conveying why I''m
    a Linux booster.


    Not all of us are lucky enough to include admirers of Span-ish Anarcho-Syndicalist
    collectives in their circle of friends. In fact, most people probably believe
    that if you know someone like that and you call him “friend,” he’s probably some
    poor coffee-house eccentric you end up at adjoining tables with now and again,
    and the “friendship” is more a friendly tolerance. In my case, however, those
    people would be wrong.


    I do have a friend who’s an admirer of Spanish Anarcho- Syndicalist collectives.
    Considering the fact we’ve been in con-stant contact since eighth grade and even
    lived together after college, it’s safe to assert that the friendship is more
    durable than the garden-variety“suffer through the coffee-house loon’s ratings
    until getting to the bottom of the cup” sort of friendship.


    This particular friend turns up here, in the introduction to a book about Linux,
    because he was the first person who ever drew a noticeable and awkward blank when
    I tried to explain why, well, Linux rocks. He may have been the first person I
    ever tried to explain the whole thing to all, which makes my eventual defeat all
    the more unfortunate. It’s taken me four years to recover.


    Some people might look at an admirer of Spanish Anarcho- Syndicalist collectives
    and say something like: “This is a post-ideol- logical age! We’re not talking
    about how to bake the societal cake, but how to arrange the cherries on the multi-layered
    cake of cor-porate capital and increasingly quaint-seeming states. Anyone who
    thinks there’s room for Anarcho-Syndicalists doing much of any-thing but standing
    around looking sour before having the good grace to go register as Democrats is,
    um, impractical.'
