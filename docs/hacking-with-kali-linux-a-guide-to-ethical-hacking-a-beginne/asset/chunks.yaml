- fmt: '

    There are certain types of malware that are going to be easier to detect compared
    to others. Some like `adware` and `ransomware` are going to make their presence
    known right away, either by encrypting your files or streaming an endless amount
    of ads to you. You will be able to detect these right away and can take the necessary
    actions to help get them off your system and prevent further issues.


    Then there are other options, like `spyware` and `Trojans`, that are going to
    go out of their way to hide from you for as long as possible because these are
    used when the hacker wants to be able to stay on the system for a good deal of
    time. This means that they will be on the system for days, weeks, and even months,
    and you have no idea that they are even there.


    And then there is the third type. These can include options like `worms` and `viruses`
    that are going to be able to operate and do their job in secrete for some time,
    and then the symptoms of them being there and the infection they cause start to
    appear. In these cases, it is likely that we will see some issues like freezing,
    deleted, or replaced files, the system shutting down suddenly, or a processor
    that is hyperactive.


    The only surefire way that we are able to detect all of this malware before it
    can infect our computer or our mobile device is to install an anti-malware software,
    which is going to be packaged with detection tools and scans that are able to
    catch any of the malware that is already on the device, and then can block off
    any of the malware that is trying to infect you. Each form of malware that you
    encounter is going to come with its own way of damaging and infecting data and
    computers, which means that each one is going to need a different method of removal.
    Working with anti-malware software, no matter what kind of computer or operating
    system you use, can help to keep some of these attacks out.


    ### Phishing


    There are times when a hacker is going to use a technique that is known as `phishing`.
    This is going to be a type of cybercrime in which the target is contacted by text
    messages, telephone, or email by someone who is posing as a legitimate institution
    in order to lure individuals into providing them with sensitive data, such as
    banking and credit card details, personal information, and passwords for the hackers
    use. The hacker wants to do this in order to get as much information from the
    target as possible. They hope that the target, not paying attention, will hand
    over this information, and then the hacker can access any website or another account
    that they want based on the information that they are provided.


    There are a few common features that are going to show up when we look at a phishing
    email:


    *   First, the offer in the email is too good to be true. You may find that these
    kinds of texts or emails are going to offer lucrative points and a lot of statements
    that are attention-grabbing. These are basically designed to grab the attention
    of the target right away. It could be something as simple as saying that you won
    some big prize if you just `Click Here!`! Make sure that if you receive any of
    these email types that you do not click on it. If something seems too good to
    be true, then in all likelihood, it probably is.

    *   Another thing to watch out for with these kinds of attacks is that there is
    a sense of urgency that is provided inside. A favorite tactic that a lot of cyber
    criminals like to work with is to ask the target to act fast because the deal
    is only for a limited amount of time. Often, these types of attacks are only going
    to give you a few minutes to respond. It is often best to just ignore them and
    not even open them. Remember that a reputable company is never going to rush you.
    If someone is going to close your account, for example, because you haven’t used
    it in some time, they will give you a month or so to go and check things out and
    decide if you want to keep it or not. If the email says that you have to act right
    now, then this is a good sign that you are dealing with a phishing attempt. Never
    give off the information on this because you will give the hacker exactly what
    they want, and this could really ruin you financially and more.

    *   Hyperlinks should be another red flag that you are watching out for. A link
    is not always what it appears, and if we are not careful with the links that we
    are using, then it could take us somewhere, we do not want to be. Hovering over
    a link is a good way for us to see where that actual `URL` is going to take us
    if we clicked on it. We always want to double-check when it comes to this kind
    of thing. Hackers are good at taking a well-known website and then changing just
    a bit about it, causing us to believe that the website is a safe one. But if we
    looked a bit closer at it, we would see that there is something wrong and that
    this is not really the website that we want to be on. For example, a hacker could
    take the Bank of America website and change the mover to an `r` and an `n` to
    confuse us, and then send us over to an unsecured website. If you are not certain
    whether the website is the correct one or not, it is always best to do your own
    check. Type in the name of the company you think is emailing you, and go straight
    to their website without clicking on the link. If they did actually message you
    for something, you will be able to find it out this way and if not, you avoided
    an attack by a hacker.


    We also need to be aware of any attachments that are coming in with our emails.
    If you see an attachment that is in an email that you weren’t already expecting
    to come in, or it doesn’t really make sense for that attachment to be there in
    the email, then never open it! These attachments are going to contain a lot of
    tools for the hacker like `viruses` and `ransomware`, and downloading them can
    really cause a mess on your computer. The only file that is always safe for you
    to click on is a `.txt` file, or if you are actually expecting an attachment from
    someone in the first place.


    And the final thing that we need to look at here when being careful of phishing
    is the sender. If the sender is unusual, then this is at least an invitation to
    look a little bit closer at what is going on. Whether it looks like it comes from
    someone you don’t know or someone you actually do know, if you look through the
    email and feel that something is out of character, unexpected, out of the ordinary,
    or makes you suspicious, then it is best to not click on it at all. Keep in mind
    with this one that, in most cases, the emails that are sent by these cybercriminals
    are going to be masked in a way that they appear like they were sent by a business
    whose services are used by the target or the recipient. A bank and other companies
    are not going to ask you for some personal information through email or put a
    suspension on your account if you do not update some of the personal details within
    a certain period of time. Instead, they will provide the personal details and
    account number in the email to help you see that it comes from a reliable source.


    ### Man in the Middle


    The next type of attack that we are going to look at is the `man in the middle`
    attack. This is where the hacker can insert themselves between two parties. Typically,
    when there is some communication between the `client` and the `server`, the attacker
    is able to intercept, send, and receive data meant for both sides, including things
    like `passwords` and `account numbers`.


    Now, there are a few things that can happen here. Sometimes, the `man in the middle`
    attack is just happening so that the hacker can gain some information. They may
    gather the data, look it over, and then send it on its way. This allows them to
    stick around for some time and learn more about the system before they do any
    more with the attack. In addition, it is possible for the hacker to take the information
    and use it for their own needs, such as `username` and `passwords`, or they can
    alter the information and send it on its way instead.


    For example, it is possible that the sender is going to communicate that they
    would like the receiving bank account number to be `123456789` for a specific
    transaction. But a hacker who is using the `man in the middle` attack could intercept
    that information and change around the account number. The account number will
    be then notified to the bank, and because they don’t realize that anything is
    wrong here, they will send the money over to the account the hacker specified,
    rather than the one the user actually wanted. And often, this is not caught until
    it is too late.


    There are a number of other attacks that can fit in under this kind of category.
    The `man in the middle` attack is basically a form of `session hijacking`. A `session`
    is going to be a period of activity that occurs between a `user` and a `server`
    during a specific period of time. For example, each time that you access your
    own bank account and then interact with it in an active manner, this is a session.
    When you log out of that account, then this means the session has ended. Of course,
    there are actually quite a few other types of attacks that will prey on `session
    hijacking` similar to what we are going to see with a `man in the middle` attack,
    and these can include some of the following:

