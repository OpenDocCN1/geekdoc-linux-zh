- fmt: '

    ### 1. Sniffing

    This is going to entail the hacker using software that can intercept the data
    being sent from or to the device that you are using.


    ### 2. Sidejacking

    This kind of attack is where we sniff data packets that are being sent between
    the client and the server so that the session cookies can be stolen, and we can
    gain access to a session. These cookies are important to the hacker because they
    include some unencrypted login information, whether or not the site is secure
    in the first place.


    ### 3. Evil twin

    Sometimes, the hacker is going to take this process so far that they create a
    rogue wireless network that seems to be legitimate. Unknowing users are going
    to join that network and then use it for a regular activity online without realizing
    that, during this time, their information is being collected. This often makes
    it easier for one of the men in the middle attacks to happen.

