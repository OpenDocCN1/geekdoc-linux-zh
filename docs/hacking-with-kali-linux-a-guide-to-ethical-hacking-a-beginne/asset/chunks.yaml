    # Chapter 10: Understanding Cryptography


    The final chapter that we are going to talk about when working in this guidebook
    is the idea of cryptography. If we want to make sure that the messages we send
    and the ones we receive are kept secure and safe from others, then we need to
    make sure that we can add in some level of cryptography to the mix as much as
    possible. Cryptography is going to be the method of protecting information and
    communications through the use of codes. The point of doing this is so that only
    those who are intended to see the message are the ones that can read it in the
    end.


    The point of this is that we want to make sure that the information is kept secret.
    Whether this is just an email that you want to send to someone else, or it is
    secure information that you want to keep hidden from others, this cryptography
    can make sure that hackers and others who may be performing man-in-the-middle
    attacks and more are kept out of your system and will not cause some issues along
    the way. When we are looking at it through the lens of computer science, this
    cryptography is going to refer to secure information and communication techniques
    that are going to be derived from a variety of mathematical concepts and a set
    of rule-based calculations.


    ## Techniques of Cryptography


    We need to start off with some of the different techniques that we are able to
    use when it comes to adding some cryptography to our system and the messages that
    we try to send. Cryptography is going to be related pretty closely to the ideas
    of cryptanalysis and cryptology. It is going to include techniques like microdots,
    merging words with images, and other methods that are meant to help us hide our
    information in storage, or in transit, so that no one else without the right authorization
    is able to get ahold of that message.


    However, when we look at the world and how it is today, and all of the computers
    and digital stuff that is going on with it right now, cryptography is more likely
    to be associated with scrambling plaintext (which is going to be ordinary text)
    into ciphertext in a process that is known as encryption. Then, when the messages
    get to the right person, then it is going to go back into regular or plaintext
    again in a process known as decryption. Individuals who are able to practice this
    field are known as cryptographers.


    Now, there are going to be four main objectives or concerns that come with the
    process of cryptography, and these will include the following:


    1. **Confidentiality**: This is where we try to make sure that the information
    isn’t understood by anyone for whom it was not intended. When we work with cryptography,
    we are relying on codes and other processes to keep our messages and our information
    safe until it reaches the intended person.

    2. **Integrity**: Cryptography worries about whether the information is altered
    during the storage or the transit. The goal here is to not allow the information
    to be altered in either of these two processes between the sender and the person
    who is supposed to receive the message, and if this alteration does happen, it
    is detected right away.

    3. **Non-repudiation**: This is where the creator or the sender of the information
    is not able to deny, at a later stage, what their intentions are in the creation
    of the transmission of the information when things are all done.

    4. **Authentication**: This is where the sender and the receiver are able to confirm
    the identity of one another, and the origin or the destination of the message
    or the information.

