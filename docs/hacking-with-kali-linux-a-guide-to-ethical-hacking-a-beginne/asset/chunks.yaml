    这些需要查找的信息有很多，但对于黑客来说可能非常有价值，而且你能够确定外部到底有多少信息可供黑客使用。仅靠关键词搜索是不够的；你得进入更深层次，进行一些高级搜索才能找到这些信息。花时间写下其中的一些信息，这样你就能更好地了解网络规模有多大、哪些信息被公开给了公众，以及可能损害你网络的其他漏洞。


    ## 如何绘制网络地图


    一旦我们完成了之前所有的信息收集，并可以开始一些研究，就是时候启动真正的道德黑客攻击流程了。你的系统或网络将包含大量信息和设备，我们需要确保它是受到保护的，即使系统中有大量用户也是如此。设备必须是安全的，而且所有员工必须遵守更高的标准，以确保他们不会不当当地使用网络和任何设备。


    对于这一点，我们需要能够创建一张由我们控制的网络地图。之所以这样做是为了查看网络中包含了哪些内容，并更清楚地（通常以视觉形式）看到系统中的问题可能出现在哪里。这对于我们观察网络或系统在网络上留下了哪些供他人（包括黑客）查看并为了自己的需求而利用的足迹也是很好的方法。


    `Whois` 选项是一个帮助我们入门的良好起点。这实际上最初设计用于帮助我们判断域名是否可以使用的网站，但如果你想查看任何域名的注册信息，它也是一个极佳的起点。如果你在这里进行搜索，并发现你自己的域名出现了，这说明关于你和公司的个人信息（包括运营公司的人员姓名和电子邮件地址）至少通过这个网站被广播了，即使在其他地方没有如此。


    `Whois` 能够提供有关特定域名上发现的所有 DNS 服务器的信息，以及关于服务提供商使用的技术支持的一些信息。你真正需要查看的地方是 `DNSstuf`，在那里你就可以发现许多关于你域名的信息，包括：


    * 关于主机如何处理该特定名称的所有电子邮件的信息。

    * 所有主机位于何处。

    * 关于域名注册的某些对黑客可能有用的通用信息。

    * 关于该域名是否带有垃圾邮件主机的信息。


    这只是你可以访问的以查找其中一些信息的网站之一，检查几个这样的网站是一个好主意。这有助于对你的域名和公司可能在网络上公开的信息有一个良好的开端，但还有其他几个你应该检查的地方，包括：除了使用上述
    `Whois` 选项外，还可以查看 Google 论坛和小组以及其他类似的选项。这些对黑客来说非常有帮助，因为在这些论坛及其他地方，会有大量关于你的业务或网络的信息被发布，尽管你并不是那个发布这些信息的人。


    取决于其他人在这里发布给他人查看的信息类型，可能会出现一些你需要关注并进一步了解的安全问题。有时，如果黑客已经进入了你的网络并想要将信息卖给他人，你的 `IP
    address`、域名和用户名等可能会出现在该网站上。对你自己的域名或公司名称进行简单搜索，通常足以判断该网站上是否存在任何安全问题。这方面的好消息是，如果你在这些论坛之一发现你的安全信息在在那里，你可以在更多人发现并利用它来牟利之前进行处理并删除该信息。你必须通过正确的凭据证明域名或业务归你所有，但如果你正在进行这种扫描，这不应该是一个问题。然后你可以进入这些网站的支持人员区域，提交你自己的报告，以尽快删除那些信息。


    ## 完成扫描


    当我们执行上述列出的某些步骤时，我们必须记住，这些步骤的主要目标是找出我们的系统或网络已经有多少在网络上公开了，以便更好地了解黑客可能从哪里查看以开始他们自己的攻击。当然，这不是一个容易的过程，可能需要一些时间才能完成。黑客不会轻易放弃，他们决心要进入系统。你的工作是捕获他们，并在他们行动之前发现漏洞，以阻止他们可能尝试的任何混乱。


    现在我们已经过了一些其他步骤并获取了必要的信息，我们作为道德黑客是时候再多完成几个步骤了，以确保网络被封闭并且漏洞得到处理。我们可以通过预先对整个网络进行扫描来完成这一切。这些扫描是有用的，因为它们会向我们展示系统中的一些漏洞，这使得我们在想要保护网络时更容易知道从何处开始。道德黑客可以考虑的几种为了保持信息安全的不同扫描包括以下：


    1. 像我们上面讨论的那样访问 `Whois`，然后查看主机名和 `IP addresses`。查看它们在这个网站上的布局，你也可以花时间核实上面的信息。

    2. 现在，是时候扫描你的一些内部主机了，这样你就可以看到用户能够访问系统。黑客可能来自网络内部，或者他们可以从不留留的员工那里获得一些凭据进入，因此请确保每个人根据其在公司中的位置拥有正确的凭据。

    3. 下一步你需要做的是检查系统的 `ping` 实用程序。有时第三方工具会很有帮助，这样你就可以一次获取多个可以 `ping` 的地址。`SuperScan`
    是一个非常好的选项。如果你不确定网关 IP 地址名称，也可以访问 `www.whatismyip.com` 网站。

    4. 最后，你需要借助所有开放的端口对你的系统进行外部扫描。你可以再次打开 `SuperScan`，然后借助 `Wireshark` 查看其他人可能在网络上看到什么。

    '
- fmt: '

    These scans are all great to help you to find out what your IP address is sending
    out online and what hackers may be seeing when they try to get onto your system.
    A hacker can basically do some of the same steps that you just did on the system
    to get in and see what is going on to see the emails that are being passed back
    and forth, and even learn how to get the right information to have remote access.
    The point of these scans is to find out where the hacker can get in so you can
    close them up and keeping the system safe.


    Once we have taken the time to get a good idea of how a hacker is able to get
    into our network, it is often much easier to learn the exact way that any hacker
    is going to try and target that network or the computer. Keep in mind that the
    hacker does not want to work any harder than they have to, so they are going to
    stick with the easiest method available, while still keeping themselves hidden
    on the system. Sometimes, it is the first thing that you try, and sometimes, you
    have to try a few things to keep the hacker out.


    These scans are important, and they are something that we need to keep doing on
    a regular basis. It is not enough for us to just do the scan ones and then call
    it good forever. As you start to use the network and maybe even grow it out a
    bit more over time, the information that is sent out is going to change, and hackers
    are always going to find some of those vulnerabilities. Performing these scans
    regularly, based on the schedule that is good for your business and IT professionals,
    can help to keep out all of the hackers who do not belong there.


    # Chapter 8: The Basics of Web Security


    The next topic that we need to take look at is our web security. If we are not
    careful when we work online and visit a variety of websites, then we are setting
    ourselves up for a big attack. Hackers have a lot of different methods that they
    can utilize when it comes to being online and on a variety of websites. And if
    the unsuspecting user is not careful with what is going on around them, it is
    likely that they will invite the hacker right into your system.


    Websites are going to be prone to a lot of security risks, As are any networks
    that are connected to a web server. Setting aside some of the risks that come
    about because of employee use or because the network resources are being misused,
    your web server, and the site it hosts presents your most serious sources of security
    risk.


    Web servers are going to, by design, open up a window that links between your
    network and the world. The care that is taken with the maintenance of the server,
    web application updates, and your web site coding will define the size that we
    see with this window and can limit the amount and kind of information that is
    able to pass through the window. If it is coded the proper manner and is set up
    the way that you would like, then it is going to help us have some web security
    that you will have when going online.


    Web security is going to be more relative and has two components to it, including
    one that is public and one that is internal. Your relative security is going to
    be high if you already have a few network resources that are higher in financial
    value, your company and site do not present anything controversial in any manner,
    and your network has had some tight permissions put on it. Add in that the webserver
    is all patched up to date with all of the settings done in the right manner, your
    applications on the webserver are all patched and updated, and the web site code
    is done to high standards, and you have a secure network.


    You can imagine that keeping up with all of this is going to be a bit tough, and
    it may not prove to give you all of the results that you are looking for. If one
    of these fails a little bit, or you end up with someone in the system who is not
    careful with the way that they behave online, then your security is going to end
    up being a little bit lower.


    In addition, you will see that there are a few factors that are going to show
    us that web security is relatively lower for your company. Some of the issues
    that we need to take look at here when it comes to seeing our web security lower
    than normal includes:


    1. The company has a lot of important financial assets that it holds onto. This
    could include lots of information on credit card numbers or information on the
    identity of customers.

    2. If the content on your website or with your network is more controversial.

    3. If your servers, applications, and site code are more complex or if it is older
    and if these are maintained by an outsourced IT department or one that is not
    getting the funding that it needs.

    '
