- fmt: "\n# Requirements\n\n1. Windows 10 or any of the other versions of Windows\
    \ that are already installed on your computer.\n2. A laptop or PC that is able\
    \ to handle some of the different hacking processes that we want to do.\n3. A\
    \ minimum of 4 GB Pendrive.\n4. At least a Dual Core in your system, either AMD\
    \ or Intel, works well for this, and the RAM must be a minimum of 1 GB.\n5. The\
    \ latest version of Kali Linux.\n6. Rufus.\n7. And patience to get it all done.\n\
    \n# Preparation\n\nTo begin, we will know how to use the Windows 10 program in\
    \ doing a Dual Boot of Kali Linux v2019.2. The first step is to download the latest\
    \ ISO file of Kali Linux. You will be able to get this by visiting `kali.org`.\
    \ You can choose whether you would like to download the 32 bit or the 64 bit while\
    \ you are there. \n\nAfter Kali Linux has had some time to download, the next\
    \ step is for us to create our own bootable USB. For this, we need to work with\
    \ the `Rufus` extension. This is a utility that can help us to create these USB\
    \ flash drives that are bootable. Go to `Rufus.ie` to download the extension before\
    \ installing it in the system.\n\nWith these two items on your computer, we want\
    \ to start by making a bootable USB. First, connect the USB that we want to use.\
    \ As we said above, this needs to have at least 4 GB of memory in order to work\
    \ and have enough space to handle the `Rufus` extension and the Kali Linux. When\
    \ the USB is inside the computer, we can run `Rufus` and use the steps below in\
    \ creating a bootable USB drive.\n\n# Creating a Bootable USB\n\n1. First, an\
    \ image will show up on the screen about the `Rufus` program that you are running.\n\
    2. Check that the USB drive is the one selected on there, then click on the small\
    \ drive icon for the CD.\n3. Locate the ISO file for Kali Linux that we downloaded\
    \ earlier and then click on Start. Give this process a few minutes to complete\
    \ before moving on.\n4. After the process is complete, you can click on the close\
