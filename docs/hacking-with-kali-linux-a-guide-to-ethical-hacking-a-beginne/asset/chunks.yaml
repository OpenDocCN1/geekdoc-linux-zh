    negatively affect the other person. For example, these kinds of hackers are likely
    to get onto a database for business and steal names, addresses, phone numbers,
    and credit card information of those who have shopped at that store.But this is
    just one kind of hacker that is out there. They get the most attention because
    they are the ones who cause the most damage, but there are two other types of
    hackers that we need to discuss as well. For example, one type of hacker may try
    to get onto a system that they do not have access to, but they are not doing this
    to cause harm. Instead, they do this to show some of the weaknesses in that system
    or because they are bored and want to see if they can actually succeed with it.Then
    there are actually those hackers who do the hacking legally. They have permission
    to be on the system, and they hack through it to see where the vulnerabilities
    are. They are often hired by the organization they are hacking, either as a fulltime
    staff or as a freelance worker, to help them protect against actual bad hackers
    and keep the information safe.Even though there are different motivations behind
    the three types of hacking, they will all use some of the same techniques to get
    the job done. We are going to focus our work with the last type of hacker, looking
    at how you can perform and protect against a variety of attacks, but the same
    kinds of methods can be used with someone who has malicious intent on the system.
    With this in mind, let’s dive a bit more into the three types of hacking, including
    the black hat hacker, the gray hat hacker, and the white hat hacker, and see how
    each one of these is a bit different.The Black Hat HackerThe first type of hacker
    that we are going to take a look at is the black hat hacker. This is the kind
    that is going to be heard in the news the most, the one that we think about when
    we hear about hacking in the first place. A black hat hacker is going to be someone
    who searches around for vulnerabilities in a security system and then will exploit
    them. The exploitation often occurs for either financial gain or some other kind
    of malicious reason.These people are not usually worried about the harm that they
    cause to other people. They will want to gather this information to use for their
    own needs at some point. Often, this is done so that they can steal money and
    make themselves rich before disappearing without a trace. They have no wish to
    make things safe for others. They just worry about their own benefits and how
    this process can help them in some manner.Depending on how far into the system
    the black hat hacker can get, they have the potential to inflict some major damage
    on the individual users of that computer, the shoppers at that store, and the
    organization itself. They can really work hard to steal personal financial information,
    compromise the security that we see in the major systems, and even shut down or
    alter some of the functioning of networks and websites.These kinds of hackers
    can range from those who are teenage amateurs who want to spread a virus across
    the computer all the way to networks of criminals who have the goal of stealing
    numbers on credit cards and other important financial information.There are a
    lot of different methods that the black hat hacker is able to utilize, and these
    can be similar to what we will find with the gray hat and the white hat hackers
    as well. For example, the activities that a black hat hacker may rely on could
    include something like adding keystroke monitoring programs to a system to steal
    data or even launching a whole attack that can disable a whole website, and keep
    people from accessing it at all while they steal the information.Sometimes, these
    malicious hackers are going to employ methods that are not on the computer in
    order to obtain the information that they need. For example, they could call into
    a system and assume the identity of another user in order to gain access to that
    user''s password and access to the system through that manner instead.The main
    difference that shows up between these kinds of hackers and what we see with a
    gray hat or a white hat hacker is the intention. They may use the same techniques
    as the other two, but their point is to benefit themselves without any care about
    how it is going to affect the other party at all. This can be dangerous for a
    business. If a black hat hacker can get onto their system and steal information,
    it could make them lose their reputation, lots of money for their customers, and
    so much more .Gray Hat HackerNow that we have a better understanding of what a
    black hat hacker is, it is time to take a look at the gray hat hacker. A gray
    hat hacker is going to be someone who is breaking some ethical principles and
    standards, just like with the black hat hacker. But the difference here is that
    they are doing this without the malicious intents of the black hat hacker.What
    this means is that the gray hat hacker can engage in practices that seem dishonest
    and are illegal. But they are doing this more in the name of the common good,
    or at least not with the intention of harming others. These hackers are kind of
    like the middle ground when it comes to the black hat hackers and the white hat
    hackers, the ones who are going to work on behalf of the company that is maintaining
    a secure system, and the black hat who will act in a malicious manner in order
    to exploit some of the vulnerabilities that can show up in a system.Often, when
    we think about hacking, we assume that it is all in black and white. We think
    that there are ethical hackers and unethical hackers. However, even though gray
    hat hacking is somewhere in the middle, it is still able to play a big role in
    the security world. One of the most common examples that we are able to see when
    it comes to a gray hat hacker is someone who is able to exploit a vulnerability
    in a security system in order to help spread some awareness to the public that
    this vulnerability is actually there.The hacker did not get on to steal money,
    cause chaos, and steal all of the personal information from the users. They got
    on to show the public that there is some kind of vulnerability that is in the
    system, in the hopes that this will alert others to make smarter decisions, and
    even for some changes to occur.Sometimes, this information can go wrong, though.
    If the gray hat hacker announces that they found the vulnerability and the company
    does not work to change this issue and fix it, it is possible that black hat hackers
    can get through this vulnerability and use it for their own needs as well. This
    can cause a lot of damage and issues to the company as they suffer more attacks
    and have to deal with the fallout.Technically, the work that is done by the gray
    hat hacker is going to be seen as illegal. They still did not have the permission
    that they needed to complete the hack that they did, and this makes it something
    that they shouldn’t have been doing in the first place. But since they were able
    to alert the public to a problem in a system that they may have been using, or
    because they alerted the business of a potential problem ahead of time, before
    other hackers got there, often they may not face as much punishment as some of
    the black hat hackers who will use this to help themselves get money or information
    or something else for personal gain.There are many examples where a gray hat hacker
    was able to get onto a system and then alerted the company about these vulnerabilities.
    They may have even explained exactly how they did it and how they would be able
    to fix it. Some of these have been able to get prominent positions in these companies,
    helping to close up the vulnerabilities a bit, and then keeping the system and
    the network as much as possible.The White Hat HackerThe third type of hacker that
    we need to look at is going to be a professional in computer security who will
    break into a system that is protected and other networks in order to test and
    then assess the security. These are going to often work for the company they are
    trying to break into, with the goal of checking that all the vulnerabilities are
    taken care of and that no other hacker is able to get onto that system.These hackers
    are going to use their hacking skills to help improve security by exposing any
    vulnerabilities that are there before a malicious hacker or the black hat hacker
    can find these and exploit them for their own needs. Although the methods that
    are used with this are going to be similar and often identical to those that a
    black hat hacker will use, the white hat hackers have permission to get onto the
    system and employ these tactics to get the job done. These hackers also have the
    intention of protecting the information on the system rather than exploiting them.When
    it comes to a white hat hacker, these are the ones who are seen using their skills
    in a manner that will benefit society. They could be reformed black hat hackers
    in some cases, or they could just be well-versed in the techniques and methods
    that hackers use. Companies often hire these individuals to do tests and to implement
    best practices to help them keep malicious hacking to a minimum and to ensure
    they are not as vulnerable as before.For the most part, a white hat hacker is
    going to be synonymous with an ethical hacker. They will do the work to help out
    a business and to make sure that any potential vulnerabilities and issues are
    taken care of in a timely manner rather than letting a black hat hacker onto the
    system to cause a mess.The white-hat hacker is often someone who has gone to a
    degree of schooling in order to learn a lot about computer systems and how they
    work. The other two types of hackers are going to spend their time learning computers
    and are often self-taught with the work that they have. Some may have a degree
    in IT or computers in some form, but most just had an interest in this kind of
    system and then worked on honing their skills through practice .With the white
    hat hacker, these are professionals who spent quite a few times working with computers,
    computer technologies, and more and would have learned about hacking in the process.
    This allows them to be prepared for handling the large networks and systems for
    companies and protecting them as much as they can. These professionals don’t do
    the work of hacking in order to cause mischief or to work on their own personal
    gain. They do it as part of their job to keep companies and the customers who
    work with these companies as safe as possible from other hackers.As we can see,
    there are a lot of differences that come with the world of hacking, and each of
    the types of hackers out there is going to work in a slightly different manner
    from one another. The black hat hacker is going to spend their time getting into
    a system for their own malicious intents. The gray hat hacker is somewhere in
    the middle and will exploit the system in order to tell the public about this
    issue. And then the white hat hacker is going to come in as someone who works
    for the company and ensures that the information with that company stays as safe
    and secure as possible.Each of these types of hackers is going to be vital to
    the world of hacking, and we need to be able to explore each of them and how they
    work. Remember that each one is going to use the same techniques. The differences
    here is that we need to look at some of the intentions behind those actions, and
    the reasons why each hacker is doing the activity that they are. Once we can understand
    how that works, it becomes easier to see how to use the techniques that we have
    in an ethical and safe manner.Chapter 2: The Basics of the Hacking ProcessMany
    beginners don’t understand that hacking or any kind of penetration testing will
    follow a process that is very logical. They assume that they just get lucky when
    they can find a vulnerability in the system and that it is not worth their time
    to learn a process. But in reality, the hacking process is actually pretty logical,
    and we can break it down into tasks and goals that we are meant to follow in order
    to get things done.Like all of the other IT or security projects that you want
    to work with, an ethical hacking plan is going to be something that we need to
    create in advance. Issues of strategy and tactics in ethical hacking need to be
    determined and agreed on ahead of time. To ensure that you see some success with
    the efforts that you are using, you also have to spend some time planning things
    out ahead of time. No matter what kind of process you are working on, this plan
    can be important.It is important to notice the steps that are needed when a hacker
    is ready to begin working against their target. These steps are going to be similar
    whether they are working with a target that they know or someone they have no
    knowledge of, whether this is an individual, or they are more interested in attacking
    a large company and all of the personal information that is inside. These steps
    will ensure that we are able to handle all of the different parts that come with
    a hacking attack. All hackers will follow some form of these to help them get
    started.There are five main steps that we need to take a look at when it comes
    to some of the basics of the hacking process. These are going to include:ReconnaissanceThe
    first phase of the hacking process that we are going to look at is known as reconnaissance.
    For us to be able to collect as much data as we can, this process can be used.
    Since all of the information and the data that we can collect during this time
    can be useful to us when we get to the later phases, this is often seen as the
    most important phase of them all.Of course, some people think this phrase is boring.
    It doesn’t involve some of the more advanced techniques, and it will include you
    just sitting around and watching the system to see what information is going to
    show up on the system and how you can use this later on. There are also a lot
    of tools and techniques that you are able to use to help out with this phase,
    and some of them are free to use depending on your own needs .Within this phase,
    there are going to be two types of reconnaissance that we are able to work with.
    The first kind is passive reconnaissance. When we are working with the passive
    form, we are going to get on the system, but our interaction will not be direct
    with the target system. For instance, when we check and look around the company’s
    website, we like to target or if we like to see the job hirings in that specific
    company.During this phase, we want to do a quick search on Google and look through
    some of the public records, including those on WHOIS, to help us get to gather
    data of the company we like to target as well as their website and such. Now,
    all of the techniques we use are not going to include direct interaction with
    the target company itself. It is mostly just research done on the company for
    now. These examples will be referred to as passive reconnaissance.The scope of
    what we are going to gather during this phase is not going to include just the
    systems, servers, and hosts. But we can also use it to include some of the clients
    of our target system and the employees that we think we can use for our goals.
    Social engineering could then help us collect more data from the employees. Social
    engineering is going to be a technique that a hacker can use to manipulate a person
    to give any data that they don’t usually give out .The hacker hopes that with
    the help of social engineering, they will be able to fool the other person into
    giving up some personal information. They may even ask for information like the
    username and password of the employee so that they can get onto the system when
    they are ready.Another example of what can be done with this process is known
    as dumpster diving. This is a place where we are going to look through different
    means to figure out important information. It can include going through the trash,
    but sometimes, just gaining access to some websites, the desk of employees, and
    more can help us to get the ATM slips, phone numbers, and bank statements that
    we are looking for.The second type of reconnaissance that we can work with here
    is going to be known as active reconnaissance. With this kind of search, we are
    going to work to actively engage with the target we want to hack. Since this kind
    of process is going to involve us interacting directly with the target, there
    is going to be an additional level of challenge that comes up. Making telephone
    calls directly to the target and getting them to talk would be one of the examples
    of how this process works.Also, some hackers like to work with a ping service.
    The reason that they like to work with this is that it permits them to determine
    if the system will respond or not. If it isn’t responding, then it may be time
    to look for another method of entering into the system rather than the one you
    were looking at before.Now, this is often one of the last types of reconnaissance
    that we want to work with. It is hard to know what is going to be present on the
    other side. The passive method is often easier because it allows us to stay hidden
    a bit more, and we can still gather up a lot of the information that we need.
    If the ping service is used to ping one of the servers of your target, though,
    then realize that this is active because you are still actively touching the server.Any
    time that we work with the active process here, we have to be careful. There is
    always a possibility that you are leaving your mark behind. If any traces are
    there with you at any time, then it is possible that it can lead the target company
    right back to you.ScanningAfter the process of gathering information in the step
    from above, it is time to move on to the scanning phase. In this phase, we are
    going to use a variety of tools in order to gather up more of the information
    that we need about the target. There are a variety of tools that we are able to
    bring out when we get to this point, but some of these tools are going to include
    vulnerability scanners, sweepers, ping tools, network mappers, and port scanners.
    With all of these tools for scanning, it is surprising how much information we
    are able to gather about the target network.For example, these tools will be used
    to determine the closed and opened ports at any given time. We will also know
    what type of operating systems the company uses and what types of devices are
    on that network, to name a few things we can look up.You will notice with this
    phase that the scanning is going to be more active than before, but the good news
    is that we can also use the other passive forms of scanning. So, when determining
    the type of operating system being used, we can send some network traffic to the
    systems. The response that we get from the operating system to that traffic will
    vary based on the kind of system in place.All of the operating systems are going
    to respond to the traffic that is sent through in different manners. This means
    that a computer with the Windows operating system is going to respond to any traffic
    that is sent through in a different manner compared to a Linux computer and a
    Mac computer. And the same can be said to all of the other operating systems as
    well.One example that we are able to take a look at when it comes to scanning
    passively is sniffing out the traffic on the network. We can work with a few tools
    for this, but Wireshark is a great option to help us sniff out the network traffic.
    Knowing the whole network infrastructure will be easier as a result of this phase.From
    here, we are able to work on making sense of some of the data that we have collected
    in this phase, as well as in the first phase. Then we are able to convert all
    of the data into useful information. This is a great thing to work with because
    it provides us with a blueprint of what is going on in the entire network we are
    on.Gaining AccessNow that we have had some time to gather a bit of information
    on the target system that we want to work with, and we have been able to add in
    a bit more activity and look at how to scan some of the networks to get a good
    blueprint, it is time to work on the third step of gaining access. This is actually
    the phase where some of the real hacking is going to take place.When we are in
    this phase, we are going to try to get into the target system and see how we can
    use the vulnerabilities that we were able to use during the scanning phase. Figuring
    out a good path that will help us, the attacker, to get into the infrastructure
    of the network is important so that we can take control over the whole thing .There
    are a variety of methods that we can see in order to gain the access that we want
    to the network. And it is likely that you will have to use at least a few before
    you are able to gain that access. We can get access through the network, through
    a vulnerability in an application that is on that network, or even through the
    specific operating system that is on the network.When we are in the gaining access
    phase of this process, there are also a few different methods that can help us
    reach our goals. We can do something like a denial of service attack or session
    hijacking in some cases. The denial of service attack or DOS on a system is a
    good option to work with because it will expose some of the hidden vulnerabilities
    that show up in the system.As soon as we are able to find at least one vulnerability,
    but hopefully more, you are then able to use these to help us gain access to the
    system. This can take some time, especially if there is a white-hat hacker working
    for the company and trying to keep other people out of the system. But once we
    have gained the access that we want to the system, we are doing with this phase
    of the process with hacking.Gaining access is a part that can take us some time
    in order to get things done. We want to use some of the different parts that we
    discussed earlier, the information that we were able to discover and learn about
    the business and the network, and then gain access. Remember that with this one,
    the best place to get in is to look for those vulnerabilities and focus on how
    we can exploit some of those for our needs.Many systems have some kind of vulnerability
    that happens to them. But sometimes, it takes time to find them. It could be a
    vulnerability that shows up in the operating system or another piece of hardware
    or software that the network is using. Sometimes, it is going to be by finding
    a port that is not closed off and monitored the way that it should. But often,
    the way that you find a vulnerability and exploit it is through human error.For
    many hackers, a human error is going to be the easiest way for them to get onto
    a system, no matter what operating system they are on or anything else. When humans
    are not paying attention to what they are doing, and they do not follow the proper
    security protocols, it is the best thing for the hacker to get what they would
    like. Hackers can get on when users share their information with others, when
    they don’t log out of the system, when they open up emails that they shouldn’t,
    or even when they are not careful about the websites they are visiting and the
    information that they share on those websites while they are at work and on the
    network.Finding where this vulnerability is and putting in some protocols along
    the way to make sure that everyone follows the rules and doesn’t put the whole
    system at risk can be so important to your network. Whether it is some of the
    software that you are working with or someone who is on the network who is creating
    these openings, it is time to find the best ways to fix these issues as we can.Maintaining
    AccessOnce we have had some time to penetrate into the network, and we have the
    access that we need into the system, the next challenge that we need to work on
    is maintaining the access. If something on the network suspects that you are there,
    then you will be kicked out, and the vulnerability that you exploited is going
    to get fixed. Getting onto the system and being careful until you are ready to
    make the attack is key here.Once we have had a chance to get onto the network,
    it is likely that we would like to, in the future, return to the same level of
    access or greater. To do this, we would need to implement some features to get
    this done, including a backdoor, Trojan, or rootkit that can help us get access
    to that same network even in the future.Take note that it will be better for us
    if we keep control of the system for a longer period. This system can then be
    used as a source that can help us infect some of the other devices that are on
    the network until we reach our ultimate goal with this process .While we are on
    this system and maintaining our access, we are in the perfect position for doing
    a lot of things. We can intercept some of the emails that we see coming in. We
    can watch what users are getting onto the system and what they are doing there.
    We can watch the network traffic that is coming in and causing problems. And we
    can even work on adding in a keyboard logger so that we can learn the passwords
    and usernames to get onto more of the system.There are a lot of benefits that
    the hacker is able to get when they work with continuous access to the network.
    These benefits could include data manipulation and monitoring of the network for
    a long time, which include additional time in launching some added attacks in
    the process.The overall goal here is for you to stay on the system for as long
    as you can. The quieter you are here, and the better you are at doing the hacking,
    the easier it is going to be for you to stay put and not get noticed. Be more
    of an observer in the beginning, at least until your attack is made. It is unlikely
    that even with a vulnerability present that the target network doesn’t have anything
    on it to help keep things protected and safe. If you make the wrong move and aren’t
    careful before your attack, it is likely that something on the network will find
    you and your access and your control will be lost .Clearing the TracksAnd now,
    we are in the last phase of hacking at this point. This phase is going to include
    clearing or covering our tracks. The network’s IT professionals should not notice
    that the hackers are on their system. That should be the hacker’s main goal. If
    we have done anything malicious to the network or system, we should try to hide
    it.The reason is that we, as the hacker, can still continue and maintain access
    on the network if no one notices what we have done. Since no one has caught or
    noticed the attack, we will not be pushed out of the system and can still have
    access in the future. The more subtle that you can be and the less noise that
    you make in the process, the better it is for you overall.The hacker should also
    ensure to cover up their tracks on the system by overwriting, destroying, or deleting
    any logs that may document their activities in the system. This ensures so that
    no one is able to take a look at the logs later on and notice that there is some
    strange activity going on, or a system that should not be present causing issues.It
    is so important that you go out and clear your tracks when you are all done with
    your work. Leaving anything behind when you are done may seem like a good idea,
    but remember that other hackers, such as the white hat hackers who work for the
    company, are often going to be looking around. You may have beaten them to that
    vulnerability and made it onto the system, but, at some point, they are going
    to find it and can use that to find you as well.Clearing out your tracks helps
    to end the process and makes it easier for you to not get caught. There is a level
    of anonymity that is present in this kind of hacking. But as soon as someone finds
    you and figures out what you are doing, they can trace you down and even cut out
    that access point you had in the first place, and neither of these things is good
    for you and any of the hacking that you want to do.And these are the basic parts
    that come with the hacking process. The goal is to get onto the system as secretly
    and quietly as possible, with the hopes that no one is going to notice that you
    are there or cause a stir because they see something strange going on. If you
    are able to get through the five steps that are above, it is much easier to gain
    the access that you want to a system, and then you can complete the attack that
    you want to do.Chapter 3: How to Install and Use the OS Kali Linux for HackingNow
    that we have had some time to look at some of the basics that come with the methods
    of hacking, it is time to download the operating system that we want to use to
    get this hacking done. While we can work with some of these hacking options no
    matter what operating system we are on, we are going to focus on how we can get
    this done with Kali Linux. Before we are able to utilize this, though, we need
    to install the operating system and get it ready to go on your computer.Linux
    is often the top operating system that hackers will use, mainly because it is
    easy to work with, and will have all of the software that is needed to complete
    a hacking project. It is free and open-source, which means that we are able to
    make modifications and use them in any manner that we would like.Installing the
    Kali Linux is sometimes a bit complicated for beginners, but that is what we will
    spend some time on in this chapter. We are going to take a look at how to dual
    boot with Kali Linux and then look at how we can work with this in the other operating
    systems, including Windows and Mac OS, for our needs .A Dual Boot of Kali LinuxThe
    first option that we are going to take a look at in this guidebook is how to work
    with a dual boot of Kali Linux. This helps us to make sure that we can get it
    to work with a Windows operating system, mainly Windows 7 8 or 8.1\. So, if you
    are not a fan of working with the newer version of Windows, we can get that under
    control as well. Let’s get started then!Before we get started with the dual boost,
