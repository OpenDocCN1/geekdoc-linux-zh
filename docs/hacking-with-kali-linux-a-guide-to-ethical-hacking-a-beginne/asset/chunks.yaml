    从这里开始，为了安装 Kali Linux，应该创建一个单独分区。为了完成这一部分，我们可以打开磁盘管理设置，或者在 Windows 中运行命令 `diskmgmt.msc`。如果我们创建了一个最小大小为
    15 到 20 GB 的分区，它可能会缩小我们现有的卷。


    此时，我们注意到第一阶段的工作已经完成。Kali Linux 的 ISO 镜像已经下载，制作了可启动的 USB 启动盘，并为 Kali Linux 安装创建了单独分区。在继续之前，我们应该记住，如果我们想在程序中使用这些功能，BIOS
    中提供了“快速启动（Fast Boot）”和“禁用安全启动（Disable Secure Boot）”选项。


    现在我们可以重启笔记本电脑或 PC 了。在再次启动时进入引导管理器。在启动选项中选择 `USB`。请记住，不同品牌的选项略有不同。现在你可以在屏幕上看到 Kali
    Linux 的安装界面。此时会出现几个关于如何安装 Kali Linux 的选择。你可能希望选择“图形化安装（Graphical Install）”选项以帮助
    Kali Linux 更轻松地启动。我们可以更进一步，添加一些我们想要的设置和功能。例如，你可以选择安装过程中使用的语言以及国家。


    在我们完成并添加了上述一些偏好以及系统要求的其他选项后，就是时候处理主机名（hostname）了。你的安装程序会要求输入 `Hostname`。你可以选择任何喜欢的名称，因为这就像你的用户名。然后应输入
    `root` 用户的密码。输入完用于管理账户的密码后，你可以点击继续（continue）。


    现在，我们想要选择要使用的分区方法，我们要操作的选项是“手动（Manual）”。下一步需要一些小心。我们只想选择之前为 Kali 安装所花时间创建的分区，然后按继续（Continue）。当你确定选了正确的选项时，可以在继续之前选择“删除该分区（Delete
    the partition）”。如果你操作得当，你会注意到“空闲空间（FREE SPACE）”，这就是 Kali 安装中的分区。在继续后续流程之前，我们要选择这个空闲空间分区。


    在这里，安装程序将询问我们如何使用该空闲空间。我们的目标是点击“自动分区空闲空间（Automatically partition the free space）”然后继续。之后，选择“所有文件在一个分区（All
    files in one partition）”选项。这是对新用户的推荐选项，除非你的版本中表述有所不同。然后，我们要选择“完成分区并写入更改到磁盘（Finish
    partitioning and write changes to disk）”。它要求你授予权限将这些更改写入磁盘。你可以选择“是（Yes）”然后继续（Continue）。


    这就是 Kali Linux 安装过程发生的地方。这可能需要一些时间，所以预计过程完成前大约需要 15 分钟。在过程过半时，网络会请求网络镜像（network
    mirror）。选择你想要的一个。此设置是关于更新选项的，最好现在选择 `no`，以后如果需要再进行更改。


    接下来，安装程序将询问安装 `GRUB` 引导加载程序。你需要在继续之前点击“是（Yes）”。接下来，它将询问你想在哪里安装 Kali GRUB 引导加载程序。最佳选择是带有第二个选项的硬盘。我们希望
    `GRUB` 安装在你的硬盘上，否则当电脑启动时，Kali Linux 安装将不会显示选择系统的选项，而这正是我们这个过程的一个大目标。


    在完成这些步骤并成功完成 Linux 安装后，你现在将看到一个询问你继续继续还是返回的屏幕。点击“继续（Continue）”然后弹出 USB 驱动器。此时你需要重启系统。在启动过程中，你将通过我们的
    `GRUB Loader` 看到 Kali Linux。选择 `Kali GNU/Linux` 即可启动 Kali Linux。或者，如果你只想在 Windows
    环境下工作，可以选择“Windows 恢复环境（Windows Recovery Environment）”选项。


    就是这些了。你只需要按照我们上面完成的一些步骤操作，就可以设置好让 Kali Linux 发行版准备就绪，并在任何需要的时候使用它。每当你重启电脑时，你都可以根据需要选择使用
    Kali Linux 操作系统还是 Windows 操作系统，使得在两者之间切换变得非常简单。


    # 第 4 章：网络安全导论


    我们在这里需要查看的下一个主题是网络安全的概念以及它到底是什么。作为一个在黑客过程中参与操作 Kali Linux 的人员，尽可能多地了解网络安全以及你如何保护你的系统和所有你需要保护免受外部威胁的网络是非常重要的。所以，让我们直接进入主题吧。


    网络安全是指保护和恢复程序、设备和网络免受黑客或其他人员可能想要入侵的任何类型网络攻击的某种或过程。这些网络攻击比以往的任何时候都更加常见。有许多黑客和其他个人想要访问大量的计算机，无论是大量的个人电脑及其信息，还是拥有大量客户数据的大型公司。


    完成这些网络攻击对某些人有很多好处。如果他们成功了且没有人抓住他们或他们所做的事情，那么这真的可以帮助他们获取他们不应拥有的信息。许多黑客想通过此来破坏业务、从客户和员工那里窃取个人信息，甚至窃取金钱。某些公司可能会尝试不道德地攻击另一个竞争对手，以获取新产品和业务的信息并将其据为己有。


    无论攻击的原因是什么，对黑客来说都会有一些收益，而且通常会给公司以及过程中受影响的所有其他人带来混乱。白帽黑客和其他 IT 专业人员团队的工作就是将这些网络攻击减少到最低。


    这些网络攻击对消费者、员工和组织来说是不断演进的危险。它们的设计方式有助于他们访问或销毁系统中可能存在的任何敏感数据，甚至在必要时勒索金钱。当他们成功时，取决于其规模，真的可以摧毁业务并损害那些使用系统的人员的财务和个人生活。


    许多公司花费大量的时间和金钱试图保护他们为客户存储的信息。每当你进行网上购物或进行其他活动时，都会留下大量的个人信息。这可能包括你的姓名、地址、电话、特征（如性别、年龄、职业等）以及你的支付信息。那么，减缓这种速度并确保不再再次发生的最佳防御是什么？基本上，一个强大的网络安全系统将具有跨越程序、网络和计算机的多层保护。但一个强大的网络安全系统不仅依赖网络防御技术，还依赖能够为网络防御做出明智选择的人。这里的好消息是，你不需要拥有网络安全专家，你不需要成为专家就能理解并实践一些网络防御战术。这一章可以是你开始这一过程的很好的起点，并为你完成一切。我们将更仔细地观察网络安全，以及我们如何利用这一点尽可能地防御这些威胁。这可能正是你需要的，帮助在这些在线威胁有机会进入你的设备或网络之前识别并避开它们。


    ## 网络威胁的不同类型


    我们在这里首先需要查看的是不同类型的网络威胁。世界上有很多这类威胁，随着技术的变化和黑客在在线上操作的变得越来越熟练，这个问题可能会变得糟糕得多。所有企业甚至个人在系统中需要警惕的最常见网络威胁类型包括：

