- fmt: '

    ## 1. Social engineering

    This one is going to be a process where the hacker is going to psychologically
    manipulate others. The goal is to get the target to perform certain actions or
    give away important information.


    ## 2. Advanced Persistent Threats or APTs

    These are going to attack where the unauthorized user is able to infiltrate the
    network without being caught and then will stay in that network for a longer period
    of time without detection.


    ## 3. Malware

    This is a type of software that has been designed to specifically help the hacker
    gain access to the system or to cause some damage to the computer without the
    owner knowing what is going on.


    ## 4. Ransomware

    This is going to be an example of malicious software. It has been designed in
    a manner that will extort money by blocking access to files or to the system of
    the computer until the target has worked to pay the ransom. While the hacker may
    take the ransom and make it look like they have left the system, this payment
    is not going to guarantee that all of the files will be recovered or that the
    system is going to be restored to what you want it to be. In fact, it is likely
    that the hacker is going to keep something on the computer so that they can get
    back on later if they would like. And it is even possible that they will take
    the money and disappear without fixing anything at all.


    ## 5. Phishing

    Another type of attack that individuals and businesses need to pay attention to
    is known as phishing. This is the process of sending out emails that are fraudulent
    and that are going to resemble emails from some reputable sources. The aim of
    this one is to steal some of the sensitive data from the individual, including
    their login information and credit card numbers. This is actually one of the most
    common attack types. You can protect against this by going straight to the website
    that is asking for the information, rather than providing it through email, and
    work with a technology solution that is able to filter through some of these malicious
    emails.

