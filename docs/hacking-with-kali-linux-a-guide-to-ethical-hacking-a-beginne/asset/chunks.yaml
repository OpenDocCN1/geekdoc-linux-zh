    ### 1. 嗅探 (Sniffing)

    这将涉及黑客使用软件来拦截发送或接收你正在使用的设备的数据。


    ### 2. 会话劫持 (Sidejacking)

    这种攻击是通过嗅探客户端与服务器之间传输的数据包，从而窃取会话 Cookie（session cookies），并获取会话访问。这些 Cookie 对黑客来说非常重要，因为它们包含一些未加密的登录信息，无论该网站本身是否安全。


    ### 3. 恶性终端 (Evil twin)

    有时，黑客会将这一过程进一步，创建一个看似合法的伪造无线网络。不知情的用户会加入该网络，并使用它进行常规在线活动，而没有意识到在此期间，他们的信息正在被收集。这通常会让中间人攻击（man-in-the-middle
    attacks）更容易发生。

