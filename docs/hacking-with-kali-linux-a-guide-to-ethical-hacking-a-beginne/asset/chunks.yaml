    You can do this by downloading the software releases and updates. When you add
    in the security patches as they come up, it helps to fix any bugs that an older
    version of the software may have missed at some time.

    2. Establish some safe and effective personal online security habits at any time
    that you get online.

    3. Configure the settings for security on your operating system, your security
    software, and your internet browser.

    4. Make sure that you install comprehensive and proactive security software that
    is going to help us block the known and unknown threats and vulnerabilities on
    your system.


    As we can see here, a hacker has a lot of tools in their arsenal when it is time
    for them to get online and try to take your personal information, or even when
    they would like to hijack your system and your network for their own personal
    gain. Recognizing some of these attacks and looking at some of the steps that
    you can take in order to avoid these attacks and keep your data and personal information
    safe can make a big difference in the results that you will get.


    ## Chapter 7: How to Scan the Servers and the Network


    One thing that we need to spend some time on while we are here is how we can scan
    our servers and the network that we are on. This may seem like a waste of time,
    shouldn’t we already know all the ports and systems and devices that are on our
    network? But surprisingly, a lot of professionals have no idea what is all on
    their network. Even if you do, this also means that you can take the time to ensure
    that no unauthorized users are on the system, and allows you a chance to kick
    them off if they are there. Let’s take a look at some of the steps that we can
    take to help us scan the servers and the network, and make sure that everything
    is safe and sound as it should be:


    ### Getting Started


    We need to make sure that we take the time to look through our system, and think
    like a hacker. Where would they be most likely to come onto the network and try
    to cause trouble? What information would the hacker be the most interested in
    the gathering if they would like to get ahold of if they could? Some of the other
    questions that you can answer when it is time to get started with your own network
    scan to help you direct your activities include:


    *   If someone tried to make an attack on the system, which part would end up
    causing the most trouble or which part would end up being really hard if you lost
    the information on it?

    *   If you had a system attack, which part of the system is the most vulnerable;
    therefore, the one that your hacker is most likely to use.

    *   Are there any parts of the system that are not documented that well or which
    are barely checked? Are there even some that are there that aren’t familiar to
    you (or you haven’t even seen in the past)?


    With these questions answered and a good idea of where you would like to take
    this process, and a good list started on some of the applications and systems
    that you are most interested in running, it is time to go through the steps to
    make sure that all the parts of your system are covered. We want to run these
    tests on all of the parts inside of our computer, double-checking that it is all
    safe. Some of the different parts of this process that we need to remember will
    include the following:


    *   Your routers and your switches

    *   Anything that is connected to the system. This would include things like tablets,
    workstations, and laptops.

    *   All of the operating systems, including the server and the client ones.

    *   The web servers, the applications, and the database.

    *   Make sure the firewalls are all in place.

    *   The email, file, and print servers.


    You are going to run a lot of different tests during this process, but this is
    going to ensure that you check through everything on the system and find the vulnerabilities
    that are there. The more devices and systems that you need to check, the more
    time it is going to take to organize the project. You are able to make some changes
    to the list and just pick the options that you think are the most important in
    order to save some time and keep your system safe.


    ### What Can Others See With my System?


    One thing that we need to consider when going through this whole process is what
    others can see when they look into the company. Hopefully, your security is pretty
    good at this point, and they are only going to see some of the basics, like your
    website and the financial information that is required. But you want to make sure
    that there is nothing else about your system or network that is showing that others
    can easily reach.


    Any hacker who tries to get onto your system is going to spend time researching
    your network and system and seeing where the vulnerabilities may be. If you are
    the owner of this system, you may miss out on some of these more obvious parts,
    so it is important to take a look at these with a brand new angle. There are a
    few options that we are able to use when we want to gather up information on our
    own network, but the first place to go here is an online search.


    To do this, we just need to do an online search about the business or the individual
    and see what information is out there that relates back to us. You can then work
    on completing a probe to find out what someone else will be able to see with your
    system. Sometimes, a local port scanner can help out as well. Keep in mind that
    this internet search doesn’t have to be that complex, but you can delve in and
    actually look so that you don... miss out on some of the things that are getting
    sent out to the world through your computer. Some of the things that you need
    to focus on the finding of your system include the following:


    *   Any contact information that will let someone else see who is connected with
    the business. Some of the good places to check out include `USSearch`, `ZabaSearch`,
    and `ChoicePoint`.

    *   Look through any press releases that talk about major changes in the company.

    *   Any of the acquisitions or mergers that have come around for the company.

    *   SEC documents that are available.

    *   Any of the patents or trademarks that are owned by the company.

    *   The incorporation filings that are often with the `SEC`, but in some cases,
    they can be in other locations as well.

