    # 要求


    1. Windows 10 或电脑上已安装的其他 Windows 版本。

    2. 一台能够处理我们想要进行的某些黑客进程的笔记本电脑或台电脑。

    3. 至少 4 GB 的 U 盘。

    4. 系统至少配备双核处理器（AMD 或 Intel 均可，运行良好），且内存（RAM）至少为 1 GB。

    5. 最新版本的 Kali Linux。

    6. Rufus。

    7. 以及完成所有操作所需的耐心。


    # 准备工作


    开始之前，我们将学习如何使用 Windows 10 程序进行 Kali Linux v2019.2 的双启动。第一步是下载 Kali Linux 的最新 ISO
    文件。你可以通过访问 `kali.org` 获取该文件。在下载时，你可以选择下载 32 位或 64 位版本。


    在 Kali Linux 等待下载一段时间时间后，下一步是创建我们自己的可启动 USB 盘。为此，我们需要使用 `Rufus` 扩展。这是一个可以帮助我们创建此类可启动
    USB 闪存驱动器的实用程序。在将其安装到系统之前，请前往 `Rufus.ie` 下载该扩展。


    当你的电脑上有了这两项物品后，我们想要从制作可启动 USB 开始。首先，连接我们想要使用的 USB 盘。如上所述，这需要至少有 4 GB 内存才能工作，并有足够的空间来处理
    `Rufus` 扩展和 Kali Linux。当 USB 盘插入电脑后，我们可以运行 `Rufus` 并按照下面的步骤创建可启动 USB 驱动器。


    # 创建可启动 USB


    1. 首先，屏幕上会显示一个关于你正在运行的 `Rufus` 程序的界面。

    2. 检查选中的 USB 驱动器是否正确，然后点击较小的光驱驱动器图标。

    3. 找到我们之前下载的 Kali Linux ISO 文件，然后点击“开始”。给此过程留几分钟时间完成，然后再继续后续操作。

    4. 进程完成后，你可以点击关闭按钮关闭 `Rufus` 窗口。这将为你提供 Kali Linux 的可启动 USB 盘。


    ### 其他用途

    - 除了用此帮助在 Windows 中进行 Kali Linux 双启动外，你还可以使用此 USB 盘进行 Kali 现场启动。这意味着我们可以在不将其安装到系统中的情况下运行
    Kali。请记住，当你进行这种操作时，它会限制一些功能和特性。


    '
- fmt: '

    From this point, for the installation of the Kali Linux, a separate partition
    should be created. So, to do this part, we can open up the settings for Disk management,
    or we can run in Windows the command of `diskmgmt.msc`. If we created a 15 to
    20 GB minimum-sized partition, it might shrink the volume that we already have.


    At this point, we noticed that the first processes were through. The Kali Linux’s
    ISO was downloaded, a programmed bootable USB drive was created, and a separate
    partition for the Kali Linux installation was created. Before we continue, we
    should remember that the `Fast Boot` and `Disable Secure Boot` options are available
    in the BIOS if we would like to use them on our program.


    We can now restart our laptop or PC. Go to the boot manager as it starts up again.
    Choose `USB` on the option boot. Remember that the different brands will slightly
    have different options. You can now see the Kali Linux’s installation on your
    screen. There are a few choices that come up at this point about how to install
    Kali Linux. You will want to choose the option for `Graphical Install` to help
    get the Kali Linux to start with some ease. We can take this further and add in
    a few of the settings and features that we want. For example, you can choose what
    language you would like to use for the installation process and the country as
    well.


    After we have been able to go through and add in some of the preferences above
    and the other options that the system asks for, it is time to work on the hostname.
    Your installation is going to ask for the `Hostname`. You are able to choose any
    name that you want because this will be like your username. The password for the
    `root` user should then be entered. After the password that you want for the administrative
    account is entered, you can click on continue.


    Now, we want to choose the partitioning method that we want to use, and the option
    that we will work with is `Manual`. The next step needs some caution. We want
    to only choose the partition that we took the time to create earlier for the installation
    of Kali and then press on Continue. When you are sure you have chosen the right
    option, you can select `Delete the partition` before continuing. If you did this
    the right way, you will notice the `FREE SPACE`, which is the partition in the
    Kali Installation. We want to choose this free space partition before continuing
    on with the process.


    Here, the installation is going to ask us how we would like to use that free space.
    Our goal is to click on the `Automatically partition the free space` and then
    continue. After that, select the option that says, `All files in one partition`.
    This is going to be the recommended option for new users in case this is worded
    differently with your version. And then, we want to choose the option that says
    `Finish partitioning and write changes to disk`. It wants you to grant it permission
    to write these changes into the disk. You can choose `Yes` and then Continue.


    This is where the installation process of Kali Linux is going to happen. This
    can take a bit of time, so expect to take about 15 minutes or so before the process
    is done. About halfway through the process, the network will ask for a network
    mirror. Select the one that you want. This setting is about the update option,
    so it is best if you can choose `no` for now and then make changes later if you
    would like to.


    Next, the installation is going to ask for installing the `GRUB` boot loader.
    You want to click on `Yes` before continuing. Next, it is going to ask you where
    you would like to install the Kali GRUB boot loader. The best choice will be the
    hard disk that has the 2nd option. We want the `GRUB` to happen on your hard disk,
    or the option to select the operating systems will not be displayed by the installation
    of Kali Linux when the computer starts up, and that is a big goal of ours with
    this process.


    After you have completed these steps and are successful with the installation
    process of Linux, now you are going to see a screen that is going to ask you whether
    to continue or go back. Click on `Continue` and then eject the USB drive. You
    will need to restart the system at this point. During the process of Start-Up,
    you will be able to see the Kali Linux through our `GRUB Loader`. The computer
    can be booted with the Kali Linux by selecting the `Kali GNU/Linux`. Or, if you
    would like to just work with your Windows environment, then you can choose the
    option that says `Windows Recovery Environment`.


    And that is all there is to it. You just need to go through some of the steps
    that we did above, and you can get it set up so that the Kali Linux distribution
    is ready to go, and you can use it at any time that you want. Each time that you
    restart your computer, you will be able to choose whether you would like to work
    with the Kali Linux operating system or the Windows operating system for your
    needs, making it easy to switch back and forth between the two.


    # Chapter 4: An Introduction to Cyber Security


    The next topic that we need to take a look here is the idea of cybersecurity and
    what this is all about. As someone who is working on Kali Linux as part of the
    hacking process, it is important to know as much as possible about cybersecurity
    and how you can protect your system and all of the networks that you need to protect
    from outside threats. So, let’s dive right in.


    Cybersecurity is going to be the state or the process of protecting and recovering
    programs, devices, and networks from any type of cyber attack that a hacker or
    someone else may want to get into. These cyberattacks are more common than ever
    before. There are a lot of hackers and other individuals who want to get access
    to a large number of computers, whether this is a large number of personal computers
    and the information on those or that of a large company holding onto a big set
    of data about their customers.


    There are a lot of benefits to someone completing these cyberattacks. If they
    are successful and no one ends up catching them or what they are doing, then this
    can really help them to gain access to information that they should not have.
    Many hackers want to do this to destroy a business, steal personal information
    from customers and employees, and even to steal money. Some companies may try
    to unethically attack another competitor in order to get information on new products
    and services and take them over for themselves.


    No matter what the reason is for the attack, there is going to be some benefit
    to the hacker, and it is often going to cause a mess for the company and everyone
    else who is affected in the process. And it is the job of a white-hat hacker and
    the rest of the IT professional team to keep some of these cyberattacks down to
    a minimum.


    These cyberattacks are an evolving danger to consumers, employees, and organizations.
    They are going to be designed in a manner that helps them to access or destroy
    any sensitive data that may be in a system or even to extort money when necessary.
    They can, when they are successful and depending on the scale of them, really
    destroy businesses and damage the financial and personal lives of those who were
    on the system.


    Many companies spend a lot of time and money trying to protect the information
    they have for customers. Any time that you shop online or do another activity,
    there is quite a bit of personal information that gets left behind as well. This
    could include your name, address, telephone, defining features (such as gender,
    age, occupation, and so on), and your payment information.So, what is going to
    be the best defense to slow this down and make sure that it is not happen again?
    Basically, a strong cybersecurity system is going to have multiple layers of protection
    that are spread across programs, networks, and computers. But a strong cybersecurity
    system is going to rely not only on cyber defense technology but also on people
    who are able to make some smart choices for cyber defense.The good news here is
    that you don’t need to have a specialist in cybersecurity, and you don’t have
    to be one in order to understand and practice some of the cyber defense tactics.
    This chapter can be a great place for you to start with this process and can get
    it all done for you. We are going to take a closer look at cybersecurity and how
    we can use this to defend ourselves, as much as possible, against these threats.
    It could be the exact thing that you need to help recognize and avoid some of
    these online threats before they have a chance to get onto your device or your
    network


    ## The Different Types of Cyber Threats


    The first thing that we need to take a look at here is the different types of
    cyber threats. There are quite a few of these out in our world, and as technology
    changes and hackers become more adept at what they can do online, it is likely
    that this problem is going to become much worse. Some of the most common types
    of cyber threats that all businesses and even individuals need to watch out for
    on their system will include:

