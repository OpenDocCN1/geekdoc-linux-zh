    results on what you can get done with your system.Hackers may also choose to insert
    some malicious packets onto a legitimate communication stream to get the results
    that they want. This is going to be seen as a newer type of technique, one that
    is going to rely on the hacker being able to access a stable of zombie computers.
    When they are able to do this, large quantities of packets can be sent out to
    a large number of recipients, which targets a certain port that seems to have
    the vulnerability the hacker wants.The hope with this one is that, by chance,
    the hacker is going to be able to hit upon a firewall or router with that port
    open, and then use it as their way to access the whole system. This is a more
    difficult kind of attack. But if the hacker is successful with it, it is pretty
    much impossible for someone to trace who got into the system without a packet
    capture.Another type of malware attack that we need to be wary about is advertisements
    that are able to send out malware to the viewers. This one is even harder for
    people to avoid simply because some of these can show up, even when you visit
    a page that is legitimate. If one of your favorite websites, for example, is not
    taking care of its firewalls, you could go in and get malware on your computer
    by clicking on one of the options there .This method of attack is going to be
    hard for us to avoid because of all the paid advertisements that we can find on
    websites across the internet. It is possible for a cybercriminal to place these
    ads, ones that have malicious code in them, on legitimate and, otherwise, safe
    websites that visitors would trust. This makes it hard because while you should
    be able to come in and trust that website, and it is unlikely that you will purposely
    go through and pick out a bad website. These hackers are still able to cause problems.There
    are a few ways that the hacker is able to get their ads on the website in the
    first place. Sometimes, they will actually purchase the ad space directly and
    then put the bad malware there. Sometimes, they will hijack the ad server. And
    other times, they can hijack themselves into the ad account of someone else and
    use that for their needs.Always be careful about the kinds of ads that you are
    clicking on. Even if it is a website that looks safe, make sure that the ad is
    something that looks legitimate, and that will be able to work for what you think
    it claims. There are many times that the ad is going to look fake and like it
    is going to cause a problem, and if ever your intuition is speaking up and telling
    you not to click on something, then go ahead and listen to it.We may also see
    that pre-installed malware can be a problem. Over the past few years or so, there
    have been a lot of reports about foreign-manufactured IT equipment, including
    switches, routers, and computers. And these parts already have malware pre-installed
    on them. In fact, this is such a widespread problem that in 2012, Microsoft declared
    that they found that there is already pre-installed malware in the new computers
    sold. HP also publicly announced, later in that same year, that there are Flashcards
    loaded with malware on some of the switches they have shipped the previous year.This
    means that we need to be really careful with the computers and programs that we
    are using on a regular basis. These, when not purchased from reputable sources,
    and often when they come from other countries, could put our information and safety
    at risk. Double-checking where you get your products from and what issues may
    be coming out of that area can ensure that we get the safest programs and computers
    and their parts as we can.Another issue that can come up here is malware that
    is sold as a legitimate type of software. Buying malware from a seller without
    a name can present some dangers, as well. Though the software is able to provide
    the promised function in some cases, it is possible that it could have some malicious
    software that is included in the bunch as well.For example, fake antivirus programs
    have been able to infect millions of computers over the years. And in this same
    manner, anything from spyware to trojans can be added to your computer if the
    malware is allowed to be there. In research that IPCopper was able to conduct
    in 2013, it was found that there were at least a few instances of free software
    that was readily available through the internet and would include options like
    free audio and video players, including malicious executables.To avoid this kind
    of issue, we need to be careful about the kinds of programs that we are allowed
    onto our systems and be aware of how they could cause some harm to our systems
    and to us. For example, when downloading something for free from the internet,
    make sure to check out whether it is legitimate, and whether others have complained
    about the product and the malicious extensions that come with it.The final kind
    of malware threat that we need to take a look at here is going to include APTs
    or Advanced Persistent Threats. The term doesn’t mean a certain kind of technique
    or type of attack. Instead, it is going to refer us to a persistent and sustained
    multi-pronged effort of breaking into the data network of an institution or organization.With
    these APTs, the hacker is going to utilize a number of attack vectors from the
    creative to the mundane, and they may even go as far as sending out some fake
    promotional materials. These can range based on the goal of the hacker and could
    be something like a free flash drive to someone who is higher up in the organization.
    When it is used, though, the intention is to give the hacker what they want. The
    flash drive would be able to upload and install a file that is malicious onto
    the computer and allow the hacker the access that they want.These APTs are often
    going to be used by groups of attackers that aim to get certain information that
    they want from an organization or another business. These are not short-term,
    either. Often, these can last at least a few months, and often, into a few years
    or more.As we can see here, there are a lot of different types of malware attacks
    that we need to be careful about on a regular basis. Hackers would love nothing
    more than to get onto a system they have no access to, whether it is an individual
    account or the account of a big organization, and then get the financial, personal,
    and more information from that system. Learning how to recognize the different
    types of malware and figuring out the best ways to avoid falling prey to it can
    really go a long way in keeping your system as protected as possible.Chapter 6:
    Cyber AttacksNow that we have a little better idea of what malware is about and
    how it is going to work, it is time for us to move on to something known as a
    cyberattack. This is going to be a big issue for businesses and individuals alike,
    and it is important that we are able to recognize the different ways that a hacker
    can try to get onto our system and cause issues.Cyber attacks are going to hit
    businesses on a regular basis. According to Former Cisco CEO John Chamers, “There
    are two types of companies: those that have been hacked and those who don’t yet
    know they have been hacked.” This means that even if you feel like they have never
    been hacked and that the information they are storing on their systems is safe,
    it is possible that there is a hacker right now who are either working on getting
    into your system and going to exploit any vulnerability that maybe there or you
    actually have a hacker on your system and you just don’t realize it yet.The truth
    is that cybercrime is something that is increasing on a yearly basis, and those
    who use computers all the way up to those who are responsible for protecting a
    lot of personal and confidential information need to be on the lookout more now
    than ever. People are working to do these kinds of crimes because they think they
    can stay hidden, and they want to be able to benefit from it in some way. Often,
    attackers are going to do this to get some kind of ransom. In fact, 53 percent
    of the cyber attacks that have happened recently resulted in damages that were
    $500,000 or more. And many more were for lower amounts.These cyberthreats can
    also be launched with a few ulterior motives attached to them, as well. For example,
    there are some hackers who will do this process as a way to obliterate a system
    and the data that is on it. They may see this as a form of hacktivism that can
    help to protect others.Before we move on with this, though, we need to take a
    look at one more term that will help us in understanding what is going on with
    some of this. This term is botnet. This is going to be a network of devices that
    have been infected with some kind of malicious software, including a virus. Attackers
    are able to control this botnet or this network as a group, without the knowledge
    of the owner, with the goal of increasing how strong and powerful their attacks
    will be in the future.Often, the hacker wants to do this slowly, and they may
    contain the botnet for a bit, watching the information and waiting for the right
    time to strike. But once they decide that it is the right time to strike, the
    botnet is going to be under the control of the hacker, and the owner of that network
    will not know. Often, the botnet can be used to help overwhelm the system in a
    DDoS attack or something similar.MalwareThe first type of cyber attack that we
    need to watch out for is malware. Malware is a type of malicious software. To
    put it simply, malware is going to be any kind of software that was written with
    the intent of damaging devices, stealing data, and causing a mess. Ransomware,
    spyware, Trojans, and viruses are among the different types of malware that we
    may have to deal with.Malware is often something that is going to be created by
    a team of a hacker, usually when they want to make money by spreading the malware
    on their own or selling it to the highest bidder on the Dark Web. However, there
    are times when it is a tool that a hacker uses for protesting, to test out the
    security of a system, or even as a weapon of war between different types of governments.
    No matter why or how the malware comes to be, it is never good news when it ends
    up on your own computer.First, we need to be able to understand what malware is
    able to do. Malware is able to do all kinds of things. It is going to be a category
    that is very broad, and what malware does or how it works is going to change based
    on the hacker and the file type that they try to use. The following are going
    to be some of the most common malware types and what they are able to do when
    they infect a computer or a system:'
