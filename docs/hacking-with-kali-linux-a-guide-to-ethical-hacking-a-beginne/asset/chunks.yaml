    There are a few things that we can do to make sure this man-in-the-middle attack
    is less likely to happen to us. On the client-side, there are not as many defenses
    that we can work with for this attack. Most of the protective measures that happen
    on the server-side are going to be in the form of strong protocols of encryption
    between the server and the client. For example, a server can authenticate itself
    by presenting a digital certificate, which is basically a verification that allows
    the client and the server to establish their own encrypted channel for exchanging
    data. But this only works if the server has these kinds of encryption measures
    in place in the first place. From the perspective of the client, the best kind
    of strategy that we are able to employ is to make sure that we never connect to
    open wireless routers, or we need to make sure that we use browser plugins like
    HTTPS.


    # Denial of Service Attack

    Another type of attack that a hacker is able to work with is known as a Denial
    of Service or `DoS` attack. This is going to be an intentional type of cyberattack
    that is carried out on websites, online resources, and networks so that the access
    that legitimate users have to that source can be restricted. This attack is going
    to be highly notable, and it could last for as long as the hacker would like.
    Sometimes, this is just a few hours while they get in and get out with the information
    they want. And other times, it could last for a few months. For example, one `DoS`
    attack that is pretty prevalent on the web right now is known as a `DDoS` attack,
    or Distributed Denial of Service.


    The `DoS` attacks are rising because many consumers and businesses are working
    with more digital platforms in order to transact and communicate with one another.
    These cyberattacks are going to target digital intellectual property and infrastructures.
    Often, these are going to be launched in order to steal some of the personally
    identifiable information that is on that system, which can cause a considerable
    amount of damage to the finances and the reputation of that business. Data breaches,
    for example, are going to attack a certain company or a group of companies in
    the same period. High-security protocols placed ahead of time by a company could
    still face an attack through a member of their supply chain if that member does
    not have the right measures of security in place.


    When more than one company is selected by the hacker for this attack, the perpetrators
    are able to use the ` of of Service attack in order to get onto the system and
    cause some more trouble before. In the `DoS` attack, the hacker is typically going
    to use just one device and one internet connection in order to send out a rapid
    and continuous request to the target. The point of doing this is to overload the
    bandwidth of the server and cause it to crash.


    The hackers of this kind of attack are going to try and exploit the vulnerability
    of the software, and then they will move on to tire out the server’s `RAM` or
    `CPU` if they can. The damage done with this attack can be fixed pretty quickly
    with the help of firewall and allowing and deny rules, but it does take a little
    bit of time. Since this kind of attack is only going to work with one IP address
    on the part of the hacker, it is easier to stop `DoS` attack if you can get firewall
    to do its job. However, some kinds of attacks like this one can be slightly tougher
    to detect and stop, that is known as Distributed Denial of Service, or `DDoS`.


    When we look at `DDoS` attack, it means that the hacker is working with connections
    multiple times, usually ones that are spread over the world and have been turned
    into a botnet. This is going to experience overload because the server is being
    attacked from many locations, rather than just from one. `DDoS` attacks will hit
    them all the same time. Unlike some of other cyberattacks that are initiated in
    order to steal sensitive information, `DDoS` attacks are launched to make the
    website inaccessible to legitimate users. However, sometimes, these attacks can
    be used as more of a digital supply chain attack. If the hacker is not able to
    penetrate and get through the security system of other websites, they will choose
    to attack that link instead of working individually. When this link has become
    compromised, primary targets would be automatically affected.


    # Zero-day Exploit

    The last type of attack that we are going to look at is known as the `zero-day
    exploit` or the `zero-day vulnerability`. This is going to be a vulnerability
    that happens in software security that the software vendor does know about but
    they do not have a patch in place at the time to fix the flaw. This means that
    it has some potential for a cybercriminal to use and make a mess with. In the
    world of cybersecurity, these vulnerabilities are going to be the unintended flaws
    that are found in our programs or the operating systems. These can be a result
    of improper computer or security configurations, and sometimes they are just a
    programming error. If it is not handled, then these are going to cause some holes
    in security that a cybercriminal is more happy to exploit.


    These are going to pose a big security risk to someone who is using that program
    or operating system. Hackers are going to write out some code that is meant to
    target the specific weakness that is there. Then they can package it into malware
    that is called `zero-day exploit`. The malicious software that is designed here
    is set up to take advantage as much as possible of the vulnerability to compromise
    a computer system or cause some other unintended behavior. In most cases, if the
    company is able to make a patch for the vulnerability, then the attack will be
    stopped.


    But then we have to worry about what will happen if your computer is one of the
    options that gets infected? This kind of malware is able to steal your data, allowing
    the hacker to get any control over the system as they would like. The software
    that is on your computer can also sometimes used in a way that it was not intended
    in the beginning, like installing other malware that will corrupt files or access
    your contact list to send out spam messages to anyone on the account. It could
    also install some spyware that steals sensitive information from the computer.
    Basically, if the hacker is able to get through one of these vulnerabilities before
    a patch is designed for it, then they can do whatever they want on your system.


    The term `zero-day` refers to a newly discovered vulnerability in the software.
    Because the developer has already learned about the flaw, it also means that an
    official patch or an update to fix the issues hasn’t had time to be released.
    So, the idea of `zero-day` is going to refer to the fact that the developers have
    zero days to fix the problem that they have just been exposed, and that hackers
    are already exploiting it. Once the vulnerability is known by the public, it is
    the job of the vendor to work as quickly as possible to fix this issue and make
    sure that the users are protected.


    Keep in mind that because the vulnerability is already found, it is likely that
    the software vendor is not going to release a patch before the hackers are able
    to exploit the hole in security. This turns it into a `zero-day attack`, and many
    users of that software could be at risk. The best thing that you can do here is
    to make sure that you stay protected against these `zero-day vulnerabilities`.
    These can present a big security risk that would leave you susceptible to a lot
    of things, including damage to your personal data and your personal information.


    To make sure that your data and your computer are safe, it is best to take reactive
    and proactive security measures. The first line of defense that you can rely on
    is going to be being proactive by using comprehensive security software any time
    that you can. This can help make sure that you are protected against known and
    unknown threats all of the time. Then the second line of defense is known as reactive,
    and it is going to be when we immediately install some new updates for new software
    whenever they become available form the manufacturer. This helps us to reduce
    the risk that we will be harmed by a malware infection. The right software update
    is going to help us install all of the necessary revisions to the operating system
    or software. These could include things like adding in some new features, removing
    any features that are outdated, updating the drivers, delivering fixes to some
    bugs in the system, and even fixing some of the security holes that we have discovered.
    However, there are a few other steps that we are able to take to make sure we
    don’t become caught with one of these zero-day attacks. These steps are going
    to include:

