    ### Malware Types


    1. **Virus**: Like the namesake that they come from, these viruses are able to
    attach themselves over to some clean files, and then will infect other files that
    are clean. These have the potential to spread uncontrollably, damaging the core
    functions of the system, and even deleting or corrupting files. These are often
    going to appear as a file that is executable.


    2. **Trojans**: This is going to be a malware option that can disguise itself
    as a legitimate type of software, or it is going to be hidden inside some legitimate
    software that the hacker has been able to tamper with. It is going to act in a
    more discreet manner and can create some backdoors into your security, effectively
    letting in other types of malware in the process.


    3. **Spyware**: This one is going to be a type of malware that is designed to
    really spy on you. It can hide in the background and then will take notes and
    information on everything that you do online. It can include your surfing habits,
    numbers of credit cards, and your passwords.


    4. **Worms**: The malware attack known as a warm is able to infect an entire network
    of devices, either local or across the internet, with the use of network interfaces.
    It is going to use each consecutively infected machine to help it infect some
    more along the way.


    5. **Ransomware**: This is going to be a type of malware that is able to lock
    down your computer and files and is able to threaten to erase everything unless
    you come up with a ransom that they want. Often, this is not going to solve the
    problem, but the hacker still gets the money.


    6. **Adware**: Although this is not always something that is malicious, aggressive
    advertising software can sometimes undermine the security of your system just
    to serve you with more ads. And if this continues to happen, it is going to provide
    malware with an easy method of getting in. Think about pop-ups when it comes to
    this kind of attack.


    7. **Botnets**: And finally, we can deal with a malware attack that is known as
    a botnet. These are going to be networks of computers that are already infected
    that will work together based on the work that the hacker wants them to accomplish.

