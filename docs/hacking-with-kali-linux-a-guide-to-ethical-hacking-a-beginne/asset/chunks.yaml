    这些扫描非常有助于帮助你发现你的 IP 地址在网上发送了哪些内容，以及黑客在尝试进入你的系统时可能会看到什么。黑客基本上可以执行与你刚刚在系统上执行的一些相同步骤来进入系统，查看正在发生的情况，查看往来电子邮件，甚至学习如何获取正确的信息以获得远程访问。这些扫描的目的是发现黑客可以从哪里进入，这样你就可以关闭这些漏洞并保持系统安全。


    一旦我们花时间充分了解黑客是如何进入我们网络的，那么学习任何黑客试图针对该网络或计算机的确切方法通常会简单得多。请记住，黑客并不想付出不必要的努力，因此他们会坚持使用可行的最简单的方法，同时让自己在系统中保持隐身。有时候，这是你首要尝试的方法，而有些时候，你必须尝试几种方法才能将黑客挡之门。


    这些扫描非常重要，是我们需要定期执行的工作。仅仅做一次扫描就认为从此一劳永逸是不够的。随着你开始使用网络，并可能随着时间的推移对其进行扩展，发送出去的信息将会发生变化，而黑客总会发现其中的某些漏洞。根据适合你业务和
    IT 专业人员的计划定期进行这些扫描，可以帮助挡住所有不属于这里的黑客。


    # 第 8 章：网络安全基础


    我们需要关注的下一个主题是我们的网络安全。如果我们在线工作和访问各种网站时不够小心，就是在为自己遭受重大攻击埋下伏笔。黑客在上网和访问各种网站时，有许多不同的方法可以利用。如果毫无备的用户对周围发生的情况不留神，很可能会把黑客直接请进你的系统。


    网站很容易受到许多安全风险的影响，任何连接到 Web 服务器的网络也是如此。撇开由于员工使用或网络资源被滥用而产生的一些风险不谈，你的 Web 服务器及其托管的网站构成了你最严重的安全风险来源。


    根据设计，Web 服务器将打开一个连接你的网络与外部世界的窗口。在服务器维护、Web 应用程序更新和你的网站编码方面所付出的精力，将决定我们看到的这个窗口的大小，并限制能够通过该窗口的信息量和种类。如果编码方式得当并按照你的意愿进行设置，那么它将帮助我们在上网时获得一定的网络安全保障。


    网络安全具有相对性，并包含两个部分，包括一个公共部分和一个内部部分。如果你已经拥有了一些财务价值较高的网络资源，你的公司和网站在任何方面都不呈现任何争议性，并且你的网络设置了非常严格的权限，那么你的相对安全性将会很高。再加上
    Web 服务器已通过所有补丁更新到最新状态，所有设置都已正确完成，Web 服务器上的应用程序都已打补丁并更新，且网站代码符合高标准，那么你就拥有了一个安全的网络。


    你可以想象，跟上这一切将会将会有些困难，并且可能无法带给你你所寻求的所有结果。如果其中某项出现了一点小问题，或者你最终在系统中有了一个在在线行为上不小心的人，那么你的安全性最终将会降低一些。


    此外，你会发现有几个因素会表明你公司的网络安全性相对较低。当我们发现自己的网络安全性低于正常水平时，这里需要关注的某些问题包括：


    1. 公司持有许多重要的财务资产。这可能包括大量的信用卡号信息或客户身份信息。

    2. 如果你的网站内容或你网络中的内容更具争议性。

    3. 如果你的服务器、应用程序和网站代码更复杂，或者它们更老旧，且这些是由外包 IT 部门或无法获得所需资金的部门维护的。


