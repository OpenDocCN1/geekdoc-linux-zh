- fmt: '

    1. It can accept new and established incoming traffic to the public network interface
    on port `80` and `443`. These are going to include options like `HTTPS` and `HTTP`
    web traffic.


    2. It can drop all of the incoming traffic that is coming from any IP address
    that is a non-technical employee to the office, and it can do this through the
    port `22` or the `SSH` port.


    3. It can accept any of the new and established traffic from the office range
    of IP to the private interface network on port `22` or the `SSH` port.


    Note that the first words of all of these rules will have something like `accept`,
    `reject`, or `drop` associated with them. This is going to specify the action
    that we want the firewall should do when an event happens. When some kind of traffic
    happens and matches one of the rules, then the firewall is going to know what
    it needs to do. For example, when we set up a rule to `Accept`, it means that
    the firewall needs to let the traffic through. When we set up a rule for `Reject`,
    it means that the firewall is going to block the traffic but will reply to that
    traffic with an error about being unreachable. And when we work with a `Drop`
    rule, then it means that the firewall needs to block the traffic without sending
    any reply at all. The rest of each rule is going to be responsible for consisting
    of the condition that each packet is going to be matched against. As it turns
    out, the network traffic is going to be matched against the list of rules that
    have been set up with your firewall in a chain or a sequence, from the first to
    last. To be more specific with this, once a rule has been matched on this process,
    the associated action is going to be applied to the network traffic that is trying
    to come through, and then the firewall will be able to determine, based on the
    different rules that you set up with it, whether to allow the information or the
    traffic to come through at all.


    When we look at an example, if we have an accounting employee that has attempted
    to establish an `SSH` connection to our server, then the firewall would reject
    them because of the second rule that we have. And since the second rule is able
    to reject it, the connection or the traffic is not going to be checked at all.
    But the system administrator would be accepted because they are only going to
    match the third rule. One thing to keep in mind here is that for the typical chain
    of firewall rules to not be able to cover all of the possible conditions that
    are out there. There are a ton of different changes that are going to come up
    over time, and often, the results that your firewall has to sort through are going
    to be ever-changing as well. For this reason, the chains in your firewall must
    have a default policy that is specified from the beginning, which is just going
    to consist of a single action. So, let’s say that you set up a firewall, and the
    default policy on it for the example chain that we have above was set for it to
    drop the traffic. So, if there is any kind of computer that tries to get into
    your office and establish an `SSH` connection to the server, but that computer
    is outside of your office, then the traffic would be dropped. That outside computer
    is not going to match any of the three rules that we had above, so it is going
    to be dropped right away.


    Now, we can also choose to set up our default policy so that it is at `Accept`.
    This means that anyone, except your own non-technical employees, would be able
    to get onto the connection and establish themselves there to any of the open services
    that are on the server. This would be an example of a firewall that is not configured
    well because it is only going to keep out some of your employees, and anyone else
    who wanted to be there, even a hacker, could easily find their own way onto the
    server.


    ## Watching the Incoming and the Outgoing Traffic


    As network traffic, when we look at it from the perspective of the server, can
    either be incoming or outgoing, the firewall is going to maintain a set of rules
    that will be distinct for either case. Traffic that is able to originate from
    elsewhere, incoming traffic, is going to be treated in a different manner than
    what we see with outgoing traffic that your server, or your own system, is sending
    out. You are not in harm from sending out your own information. But you could
    be in danger when there is something new coming into the system, so the firewall
    is going to handle each of these in a different manner. It is pretty common for
    a server to allow most of the outgoing traffic that you try to send to other locations,
    mainly because it tends to find itself trustworthy. Still, we still want to make
    sure that there are some outgoing rules in place in order to prevent unwanted
    communication in the case that a server is compromised by a malicious executable
    or an attacker in that manner as well. To help us to get the maximum out of our
    security benefits with the help of a firewall, we need to identify all of the
    ways that you would like to have other systems interact with yourself. How to
    create rules that explicitly allow them, then drop all of the other traffic. We
    must keep in mind with this one that some of the appropriate outgoing rules have
    to be in place to make sure that the server is able to allow itself to send any
    outgoing acknowledgments to the incoming connections as you choose.


    Another thing to remember here is that since the server is typically going to
    be the one to initiate its own outgoing traffic for a lot of different reasons,
    including downloading updates or connecting back to the database, it is important
    that we can include those cases in the outgoing rule set as well. From here, we
    are able to write some of our own outgoing rules. Let’s say that we are going
    to set up a firewall that is going to drop the outgoing traffic, and this is our
    default. This means that the incoming accept rules would be useless without having
    the right outgoing rules in place.

