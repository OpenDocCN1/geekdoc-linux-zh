    1. 尽可能保持你的安全补丁和所有软件均为最新版本。你可以通过下载软件版本和更新来实现这一点。当安全补丁发布时及时添加，将有助于修复旧版本软件可能曾经遗漏的任何漏洞。

    2. 在任何上网时，都建立一些安全且有效的个人在线安全习惯。

    3. 为你的操作系统、安全软件和网络浏览器配置安全设置。

    4. 确保你安装了面面且主动的安全软件，这将帮助我们阻止你系统上已知和未知的威胁及漏洞。


    正如我们在这里看到的，当黑客准备上线并尝试获取你的个人信息时，或者当他们想要劫持你的系统和网络以获取个人利益时，他们的武器库里有很多工具。识别出其中的一些攻击，并考虑你可以采取哪些步骤来避免这些攻击并保持你的数据和个人信息安全，将对你获得的结果产生巨大影响。


    ## 第 7 章：如何扫描服务器和网络


    在这里，我们需要花一些时间研究如何扫描我们的服务器以及我们所在的网络。这看起来像是在浪费时间，难道我们不应该已经知道网络上所有的端口、系统和设备吗？但令人惊讶的是，许多专业人士并不知道自己的网络上到底有什么。即使你知道，这也意味着你可以花时间确保系统中没有未经授权的用户，并且如果他们在那儿，你有机会将他们踢出去。让我们来看看可以采取哪些步骤来帮助我们扫描服务器和网络，并确保一切都如预期般安全无恙：


    ### 起步


    我们需要确保花时间检查我们的系统，并像黑客一样思考。他们最可能从哪里进入网络并试图制造麻烦？如果黑客想要获取某些信息，他们最感兴趣收集的是哪些信息？当你准备开始自己的自己的网络扫描时，你可以回答以下其他问题来帮助引导你的活动：


    *   如果有人尝试对系统进行攻击，哪部分会造成最大的麻烦，或者如果你丢失了某部分信息，哪部分会变得非常难以处理？

    *   如果发生系统攻击，系统的哪部分最脆弱；因此，这也是黑客最可能利用的部分。

    *   系统中是否存在某些文档记录得不详尽或很少被检查的部分？是否存在是在那里但你不熟悉（或者你以前从未见过）的部分？


    在回答了这些问题并对你希望如何进行这个过程有了良好的思路，并且列出一份你最感兴趣运行的一些应用程序和系统后，是时候按照步骤操作以确保系统的所有部分都得到了覆盖了。我们希望在计算机内部的所有部分运行这些测试，双重检查一切都是安全的。我们需要记住的这个过程中的不同部分包括：


    *   你的路由器和交换机

    *   连接到系统的任何设备。这包括平板电脑、工作站和笔记本电脑等。

    *   所有的操作系统，包括服务器端和客户端。

    *   Web 服务器、应用程序和数据库。

    *   确保防火墙都已就位。

    *   电子邮件、文件和打印服务器。


    在此过程中你将运行许多不同的测试，这将确保你检查系统上的每一个地方，并发现存在的漏洞。需要检查的设备和系统越多，组织项目所需的时间就越。你可以对列表进行一些更改，只选择你认为最重要的选项，以节省时间并保持你的系统安全。


    ### 别人能通过我的系统看到什么？


    在整个整个过程中，我们需要考虑的其中一点是，当他们查看公司时能看到什么。希望此时你的安全措施已经做得很好，他们只会看到一些基础内容，比如你的网站和要求的财务信息。但你想确保你的系统或网络上没有其他可以让他人轻松访问的内容。


    任何试图进入你系统的黑客都会花时间研究你的网络和系统，查看漏洞可能在哪里。如果你是这个系统的所有者，你可能会错过其中一些较明显的部分，因此用全新的视角来看这些内容是非常关重要的。当我们想要收集自己网络的信息时，可以使用一些选项，但首要地方是在线搜索。


    要做到这一点，我们只需要对该业务或个人进行在线搜索，看看那里有什么与我们相关的信息。然后你可以完成探测，找出别人通过你的系统能看到什么。有时，本地端口扫描器也能帮助。记住，这种互联网搜索不必那么复杂，但你可以深入并实际查看，以免你……漏掉通过你的计算机发送到世界上的某些。你需要关注的系统发现内容包括：


    *   任何可以让别人看到与该业务关联的联系信息。一些检查的好地方包括 `USSearch`、`ZabaSearch` 和 `ChoicePoint`。

    *   查看任何谈论公司重大变化的新稿。

    *   公司发生的任何收购或合并。

    *   可用的 SEC 文件。

    *   公司拥有的任何专利或商标。

    *   通常位于 `SEC` 的注册文件，但在某些情况下，它们也可能在其他地方。


    '
- fmt: '

    This is a lot of information to look for, but it can be valuable to a hacker,
    and you need to be able to determine how much is available out there for the hacker
    to use. A keyword search will not cut it; you need to go even deeper and do some
    advanced searches in order to find this information. Take the time to write out
    some of this information so that you have a better idea of how big the network
    is, what information is being let out to the public, and other vulnerabilities
    that may harm your network.


    ## How to Map Out the Network


    Once we have been able to complete all of the information from before, and we
    can start a bit of our research as well, it is time to start the actual process
    of an ethical hack. Your system or network is going to have a lot of information
    and devices on it, and we need to make sure that it is protected, even when there
    are a ton of users on the system as well. The devices must be secure, and all
    employees have to be held to higher standards to ensure they don’t use the network
    and any devices in an improper manner.


    For this point, we need to be able to create a map of the network that we control.
    The reason for this is to see what all is included in the network and better see,
    usually in a visual form, where all of the issues could end up being in the system.
    This is also a good way for us to see what footprint our network or system is
    leaving behind it online for others, including hackers, to take a look at and
    exploit for their own needs as well.


    A good place to help us get started with this is the `Whois` option. This was
    actually a site that was originally designed to help us figure out whether a domain
    name was open to using, but it is also a great place to start if you want to see
    what information is on the registration of any domain name. If you go through
    here and do a search, and you see that your own domain name shows up, it shows
    that personal information about you and the company, including names of individuals
    who run the company and email addresses, are being broadcasted at least through
    this site, if nowhere else.


    `Whois` is able to provide information about all the DNS servers found on a particular
    domain as well as a bit of the information about your tech support that the service
    provider uses. One place that you really need to look is in the `DNSstuf` so that
    you can find out a lot of the information that is shown about your domain name
    including:


    * The information about how the host is able to handle all the emails for this
    particular name.

    * Where all of the hosts are located

    * Some of the general information that can be useful to a hacker about the registration
    for the domain.

    * Information about whether this has a spam host with it.


    This is just one of the sites that you can visit to find out some of this information,
    and it is a good idea to check out a few of these. This helps to give a good start
    on the information that may be out online for your domain and your company, but
    there are a few other places that you should check out including: In addition
    to working with the `Whois` option above, it is possible to take a look through
    Google Forums and Groups, and some other similar options. These are going to be
    helpful for hackers because there is a ton of information that can be posted about
    your business or network on these forums and more, even though you were not the
    one who went through and posted the information.


    Depending on the kind of information that someone else went and posted on here
    for others to see, there could be issues of security that you need to focus on
    and learn more about. Sometimes, if a hacker has already been on your network
    and wants to sell the information to others, it is possible that things like your
    `IP address`, domain name, and usernames will be on the site. A simple search
    of your own domain name or company name is often enough to figure out whether
    there are any security issues present on the site. The good news with this one
    is that if you are in one of these forums and find that your security information
    is there, it is possible to go through and remove that information before more
    people find out about it and use it to their advantage. You have to show how the
    domain or business is yours, with the right credentials, but this shouldn’t be
    a problem if you are doing this kind of scan. You can then go into the area for
    the support personnel on these sites and file your own report to get that information
    removed as quickly as possible.


    ## Completing the Scan


    As we are working through some of the steps that have been listed above, we have
    to remember that the main goal with that is to find out how much of our system
    or network is already available online in order to get a better picture on where
    the hacker could look in order to start up with one of their own attacks. Of course,
    this is a process that is not easy and can take some time to accomplish. Hackers
    do not give up easily, and they are determined to get on the system. Your job
    is to catch them and get to the vulnerabilities before they do to stop any of
    the chaos that they may try.


    Now that we have gone through some of the other steps and we have the necessary
    information, it is time for us as ethical hackers to complete a few more steps
    to ensure the network is closed off and that the vulnerabilities are handled.
    And we are able to do all of that with the help of a scan over the whole network
    ahead of time. These scans are useful because they are going to show us a few
    of the vulnerabilities that are in our system, which makes it easier to know where
    to start when we want to protect the network. Some of the different scans that
    ethical hackers can consider doing to keep their information safe and sound includes
    the following:


    1. Visit `Whois` like we talked about above and then look at the hostnames and
    the `IP addresses`. See how they are laid out on this site, and you can also take
    the time to verify the information that is on there.

    2. Now, it is time to scan some of your internal hosts so that you can see what
    users are able to access the system. It is possible that the hacker could come
    from within the network, or they can get some of the credentials to get on from
    an employee who is not careful, so make sure that everyone has the right credentials
    based on where they are in the company.

    3. The next thing that you will need to do is check out the `ping` utility of
    the system. Sometimes, a third-party utility will help with this so that you can
    get more than one address to `ping` at a time. `SuperScan` is a great option to
    use. You can also visit the site `www.whatismyip.com` if you are unsure about
    the name of your gateway IP address.

    4. And finally, you need to do an outside scan of your system with the help of
    all the ports that are open. You can open up the `SuperScan` again and then check
    out what someone else may be able to see on the network with the help of `Wireshark`.

