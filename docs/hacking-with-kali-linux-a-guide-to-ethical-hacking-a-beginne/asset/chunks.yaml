    # Examples of Malware Attacks


    With this information in mind, it is time to take a look at some of the malware
    `attacks` that are out there and how we can be on the lookout for some of them.
    Often, the reason that these attacks work is human error. A person, the target,
    is not going to be on the lookout for trouble and will give up information that
    they never would have if they were thinking critically. This can be good news
    if you learn how to use it for your advantage and stay on the lookout.


    You will find that cybercriminals, cyber spies, and hackers are going to use a
    lot of techniques and vectors in order to break into a computer network and steal
    customer information, intellectual property, sensitive information that can identify
    a person, including social security and credit card numbers numbers, health and
    medical insurance records, business plans, personal records,tax records, and any
    other data that they can gain money from or use to exploit to their own advantage.


    Remember that anyone can be a target. Many individuals assume that they don’t
    need to be careful at all, but hackers will go after you even. They can steal
    your credit card information, your personal information, and more to get what
    they want, and it could take years to get things back in order after this happens.
    It does not matter the location, the industry, or the size of the target; the
    hacker will go after them if they think there is something to gain.


    There are a number of different methods that the hacker is able to employ in order
    to get their work done and to see some of the results that they want. Some of
    the most common malware attacks that a target needs to be on the lookout for includes:


    ## Email Attachments


    Emails that have an attachment with malware and viruses. This is an older technique
    that most people know how to avoid. It is common knowledge that we need to avoid
    opening attachments unless we are certain that we know the sender and that the
    information in it is legitimate. And yet, there are still many people who fall
    for this one, and it proves successful for the hacker over and over again. This
    may be one of the most well-known methods of disseminating malware, and all it
    includes for the hacker is to hide the malicious software in an attachment in
    an email. Once the target opens up the attachment, then the malicious software
    is going to execute or will download it on the computer.


    The best thing that you can do to prevent this happening is to not open up attachments
    from unsecured emails. Unless you are expecting an attachment from someone specific,
    it is often best to just ignore emails that have this kind of thing. Hopefully,
    the spam detection that you have on your email account will put most of these
    out of your sight, but sometimes a few sneak by, and it is best to exercise caution
    rather than get some malware on your computer.


    ## Phishing


    The second malware attack that we need to watch out for is similar to the one
    above, but instead of an attachment, the link inside the email is going to be
    the problem. This is going to be something that is known as `phishing`. Often,
    these emails are going to appear as legitimate correspondence from an institution,
    usually your bank, that the recipient is likely to trust and respond to.


    However, the hacker has designed the email to track the target, and the link,
    when it is clicked on, will take the target to a fake website in order to get
    that target to send over sensitive information to the hacker. This could include
    things like the account number or the username and password of the bank. In addition,
    the malicious website can sometimes install spyware, virus, or malware onto the
    computer of the recipient, making it extra dangerous to work with.


    The best thing that you can do to prevent this kind of attack is to be extra careful
    about the websites that you choose to visit through links. Verify that the email
    is actually from where you think it is. Even better, if it is something like your
    bank or another website that you trust, go directly to them through a search rather
    than clicking on the link. This way, you have protected whether the link is a
    good one or not .


    ## Social Media Attacks


    Next on the list is going to be a social networking profile or page that has links
    over to a malicious website. This is going to be a similar kind of thing like
    what we see with emails and links, but this is a method that is growing in popularity
    thanks to all of the hype around social media. It can be found on almost any social
    media account that you may use, including `LinkedIn`, `Twitter`, and `Facebook`,
    to name a few.


    This technique is one that is pretty effective since a lot of people are less
    likely to have their guards up when they are on social media, and they may not
    be as wary of these sites as they would with some of the other websites that are
    out there. With this method, though, the hacker is going to set up a fake profile
    that will entice real users to follow the links that are there. These links are
    going to take the user over to a malicious website. Sometimes, the fake profile
    can even get the targets to provide personal information that is sensitive to
    get the hacker what they want.


    Always be careful about what you are doing on social media. Even if the link seems
    to come from a close friend or someone else, verify with them first. Too many
    times, a fake account can be created, and it will look exactly like a friend or
    family member. If you are careful and verify everything before you click, you
    will find that it is much easier to keep yourself protected online .


    ## Probing Vulnerabilities


    Another attack that we need to be careful about is probing firewalls, `DSs`, and
    `PSs` for weaknesses, including a backdoor. This is something that the hacker
    is going to do behind the scenes. The target usually does not have to click on
    anything to make this happen, but if they use certain applications and sites,
    or if they don’t keep the right protection on their computer, it could leave an
    opening for the hacker to get on.


    With this one, the hacker is simply going to send out transmissions, usually en
    masse, in the hopes of compromising any kind of firewall or another thing that
    they can come across. The hope here is that they are able to gain some access
    to a computer and the system that they want. This method is pretty much just a
    game for the hacker, and the hacker will often send out millions of transmissions,
    to catch even a few computers in the process that have unpatched, misconfigured
    equipment. The best way that we are able to protect against this kind of attack
    is to make sure your system is up to date as much as possible. If you can keep
    the system up to date and be careful about the kind of software that you put onto
    the system, then you will find some results.


    ## Pre-installed Malware


    Hackers may also choose to insert some malicious packets onto the legitimate stream
    to get on and it is hard to trace without some packet capture. We may also see
    that pre-installed malware can be a problem. Over the past few years or so, there
    have been a lot of reports about foreign-manufactured IT equipment, including
    switches, routers, and computers. These parts already have malware pre-installed
    on them. In fact, this is such a widespread problem that in 2012, `Microsoft`
    declared that they found that there is already pre-installed malware in the new
    computers sold. `HP` also publicly announced later in that same year, that there
    are flashcards with malware on some of the switches they have shipped the previous
    year. This means that we need to be really careful with the computers and programs
    that we are using on a regular basis. These, when not purchased from reputable
    sources, and often when they come from other countries, could put our information
    and safety at risk. Double-checking where you get your products from and what
    issues may be coming out of that area can ensure that we get the safest programs
    and computers and their parts as we can.


    ## Malicious Software


    Another issue that can come up here is malware that is sold as a legitimate type
    of software. Buying malware from a seller without a name can present some dangers
    as well. Though the software is able to provide the promised function in some
    cases, it is possible that it could have some malicious software that is included
    in the bunch as well. For example, fake antivirus programs have been able to infect
    millions of computers over the years. And in this same manner, anything from `spyware`
    to `trojans` can be added to your computer if the malware is allowed to be there.
    In research that `IPCopper` was able to conduct in 2013, it was found that there
    were at least a few instances of free software that was readily available through
    the internet and would include options like free audio and video players, including
    malicious `executables`.


    To avoid this kind of issue, we need to be careful about the kinds of programs
    that we are allowed onto our systems and be aware of how they could cause some
    harm to our systems and to us. For example, when downloading something for free
    from the internet, make sure to check out whether it is legitimate, and whether
    others have complained about the product and the malicious extensions that come
    with it.


