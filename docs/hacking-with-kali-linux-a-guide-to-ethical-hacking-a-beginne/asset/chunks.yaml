    ### 黑帽黑客

    我们在本指南中要查看的第一类黑客是`黑帽黑客`。这是我们在听到黑客时最常想到的类型，也是我们在听到黑客时首先考虑的类型。`黑帽黑客` 是那些在系统中寻找漏洞并利用它们的人，这种利用通常是为了财务利益或其他恶意原因。这些人通常不在乎他们给他人造成的伤害。他们想要收集这些信息以满足自己的需求。通常，这样做是为了在不留痕迹的情况下发财，他们只关心自己的利益。根据`黑帽黑客`
    进入系统的程度，他们可能会对用户、商店以及组织本身造成巨大的破坏。他们会努力窃取财务信息，破坏安全，甚至关闭某些网站。这类黑客从想要在网络中传播病毒的业余爱好者到犯罪分子，其目标是窃取信用卡号和其他重要信息。


    `黑帽黑客` 能够利用许多不同的方法，这些方法与`灰帽黑客`和`白帽黑客` 相似。例如，`黑帽黑客` 可能依赖的活动包括在系统上添加键盘记录器程序来窃取数据，甚至发动整个攻击来禁用网站。有时，这些恶意黑客为了获取所需的信息会进入系统并伪装成另一个用户。这类黑客与`灰帽黑客`或`白帽黑客`
    之间的主要区别在于意图。他们可能是为了自己获利，这对业务来说是危险的。


    ### 灰帽黑客

    现在我们更好地理解了什么是`黑帽黑客`，是时候查看`灰帽黑客`了。`灰帽黑客` 是那些违反原则标准的人，就像`黑帽黑客` 一样，区别在于他们这样做时没有恶意意。他们处于中间地带，利用系统是为了告知公众这些问题。尽管他们是非法行事，但他们通常是为了公共利益。


    ### 白帽黑客

    我们需要查看的第三类黑客是`白帽黑客`。他们是安全领域的专业，进入受保护的系统和其他网络进行测试和评估。他们通常为公司工作，确保任何潜在的漏洞和问题得到解决。在大多数情况下，`白帽黑客`
    与`道德黑客`（ethical hacker）同义，他们工作是为了帮助业务。`白帽黑客` 往往是受过教育的，以学习计算机系统及其运作方式。其他类型的黑客通常是自学的。有些人可能拥有
    `IT` 或计算机学位，但大多数只是对这种系统感兴趣，并通过练习来提高技能。`白帽黑客` 是那些花费大量时间处理计算机技术并在过程中学习黑客技巧的专业人士，保护公司免受各种攻击的侵害。


    ## 第 2 章：黑客攻击流程的基础

    许多人不理解黑客攻击或任何类型的渗透测试会遵循一个非常有逻辑的过程。我们可以将其分为黑客攻击基础需要考虑的五个主要步骤：

    1. 侦察

    2. 扫描

    3. 获取访问

    4. 维持访问

    5. 清除痕迹


    ### 侦察

    我们将查看黑客过程的第一阶段被称为`侦察`。这是为了尽可能收集数据，它是最重要的阶段。当然，有些人人认为这个阶段很无聊，因为它不涉及高级技术，但它是开始的必要。


    在这个阶段，我们可以处理两种类型的侦察：`被动`和`主动`。被动方法通常更容易，因为它让我们隐藏得更深，同时我们仍然可以收集大量所需的信息。例如，当我们检查公司网站或查阅包括
    `WHOIS` 在内的公共记录时，这帮助我们收集公司及其网站的数据。


    主动侦察是这里我们可以处理的第二种侦察。由于这种搜索涉及我们与目标的直接交互，因此出现了一个额外的挑战。直接给目标打电话并让他们说话是该过程运作的示例之一。此外，一些黑客喜欢使用`ping
    服务`。他们喜欢使用它的原因是这允许他们确定系统是否会有响应。如果没有响应，可能是时候寻找另一种进入进入系统的方法了。如果使用`ping 服务`来 ping
    目标的一个服务器，请意识到这是主动的，因为你仍在触碰服务器。在这里处理任何主动过程时，我们必须小心。总有留下标记的可能性。如果你任何时候留下了痕迹，它可能会引导目标公司直接回到你这里。


    ### 扫描

    在上述步骤收集信息之后，是时候进入扫描阶段了。在这个阶段，我们将使用各种工具来收集更多关于目标的信息。当我们到达这一点时，可以拿出许多工具，但其中一些包括`漏洞扫描器`、`扫描器`、`ping
    工具`、`网络映射`和`端口扫描器`。有了所有这些扫描工具，我们能够关于目标网络收集的信息之多令人惊讶。


    例如，我们通过所有这些扫描工具关于目标网络收集的信息多到令人惊讶。


