    请记住，所有 IT 部门在面对预算部门时都会面临挑战，因此对于许多公司来说，这可能很难处理。人员配置紧张有时会导致我们出现维护延迟的问题，而这正符合那些想要挑战你正在维护的网络安全的黑客的意图。如果你有任何价值的资产，或者如果你的业务或网站有任何可能让你在公众面前受到关注的内容，那么黑客很可能会尝试测试你的网络安全。我们希望这里提供的信息能够防止你和你的公司让此类黑客进入系统，并防止你的业务在在此过程中陷入尴尬。


    导致重大安全问题的原因之一是编写不当的软件。能够引起网络安全问题的漏洞数量，与你网络上运行的 Web 服务器和应用程序的大小及复杂程度成正比。这意味着，所有编写的复杂程序要么会在其中产生漏洞，要么在过程中产生其他类型的弱点。


    除此之外，Web 服务器本身在用法上已经已经被视为复杂的程序了。网站本身就是复杂的，而且它们往往由于其设计方式而刻意邀请公众进行更多互动。由于这些事物的工作方式以及公司对网络的使用方式的，这在这一过程中留下了许多安全漏洞，为黑客提供了许多机会。这里在技术上出现的问题是，用于增加网站价值的相同编程（即我们希望它与访问者互动），同时也允许
    `SQL` 命令和脚本在响应访问者请求时在数据库和 Web 服务器上执行。安装在网站上的任何基于 Web 的表单或脚本都可能存在某些弱点甚至漏洞，而这些（在复杂系统中可能有很多）中的每一个一个，都可能为我们的整体网络安全带来巨大风险。


    与一些关于允许访问者进入网站、访问某些公司资源与将访问者排除在网络之外平衡的常识相反，这证明是一项非常微妙的任务。没有某一个设置甚至某一个单一的开关可以帮助自动将安全性提高到正确的水平来处理这一切。Web
    服务器本身就有几十个、甚至上百个这样的设置，而且每种服务、应用程序和开放端口都可以增加一个新层。然后我们还可以向网站添加代码，很快，我们就能看到复杂性将在何时发挥作用了。


    有些公司甚至还会向系统中添加一些不同的权限，以授予员工、合作伙伴、客户、潜在客户、系统访问者的权限，而随之而来的网络安全变量会急剧上升。正如你在这里看到的，存在很多可能的问题，可能会出现很多网络安全问题。你添加的层越多，你想要的互动越多，你尝试添加到系统中的权限越多，整件事的情况就会变得越糟糕。这些增加了漏洞和更多安全漏洞的隐患，如果你没有一个优秀的
    IT 部门来支持，黑客将更容易获得访问并在系统上随心所欲地操作。


    现在，当需要防止黑客可能针对你的网站所使用的各种攻击时，你可以使用的最佳防御之一是确保你对设置的域名进行定期扫描。这需要定期进行，以确保发现任何漏洞、破绽和脆弱性，并确保黑客没有绕过某些机制并找到如何进入你的网站。测试网站（也称为审计或扫描过程）将是许多公司可以提供的托管服务。有许多公司不会为我们提供任何硬件和软件的安装，企业可以使用此来检查流程和网站的安全性，而不会中断其他用户对网站的使用。


    小心管理你的网页以及随之而来的所有不同部分也很重要。当你确保了定期扫描，并确保你没有发布任何可能对你的公司产生不利影响的信息时，你会发现黑客想要获取他们想要的系统访问要困难得多，这让你能够尽可能保持你的信息和客户的信息安全，变得容易得多。


    由于我们的世界有如此多的活动发生在在线上，而且许多公司通过网站和其他在线手段与客户接触，黑客也移动到这一领域并不意外。如果你没有为客户提供他们渴望的安全保障，并且没有掩盖你系统中可能存在的某些漏洞和其他问题，那么客户很可能会在此过程中被利用并受到损害。


    例如，也许你有一个通过其销售产品的在线零售店。当客户进行购买时，他们必须向你提供他们的姓名、地址、信用卡信息，有时在过程中还需要提供其他重要信息。这样做是为了让你完成交易并获得你想要销售产品的结果，并让他们获得产品。但当交易完成后，来自客户的这些信息会发生什么？你的公司可能将它们存储在数据库中，但如果没有适当的安全措施，那么黑客绝对会想要收集所有这些信息并用于他们自己的需求。如果你只是置之不管不加照理，而且你的业务开始增长，黑客发现这些信息并使用它们不会花费太长时间。


    当客户发现他们的信息被盗取时（通常是因为黑客试图偷取他们的钱并进行其他类型的欺诈），你的业务会发生什么？将会产生很多反噬，对你来说完全不会有好结果，你的声誉会在短时间内化毁。正如我们在这里看到的，后退一步并确保你的网络安全尽可能组织化和高端，确保黑客无法偷取那些信息，对你来说好得多。


    随着越来越多的信息进入在线，我们越来越熟悉在网上与客户及他人交流，网络安全的概念将增长并变得更加重要。维护你拥有的网络安全并确保你能够保持网络上所有信息的安全（无论是你的个人信息还是客户信息），防止黑客得到他们想要的东西。


    # 第 9 章：了解你的防火墙


    在指南中，我们花了一些时间讨论了安全性以及它对保护你的系统和网络的整体过程有多么重要。我们还花了一些时间讨论了防火墙，以及它对于帮助你防御可能攻击你的的一些重大黑客入侵和攻击有多么重要。现在，我们需要进一步，尝试了解更多什么是防火墙以及我们如何使用它，无论是在大型网络上还是在我们自己的个人网络上，以真正确保我们免受各种黑客的侵害。


    首先，防火墙是一个具有安全意识的路由器，它位于互联网和你的网络之间，只有一个明确的任务。这个任务就是防止黑客和其他人的进入。防火墙的作用就像互联网和你的局域网（LAN）之间的一位伟大的安保。所有进入并离开此局域网的流量都需要通过你安装的防火墙，这是帮助我们防止某些不希望出现的未经授权访问的最佳方法之一。


