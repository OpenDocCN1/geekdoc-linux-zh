    \n## Introduction\nThe following chapters will discuss the different aspects that\
    \ come with hacking on `Kali Linux`. This is one of the best operating systems\
    \ to use when you want to begin learning how to hack your own network. It ensures\
    \ that you have all of the tools you need to get started, and as we will explore\
    \ in this guidebook, set up any computer that you would like.\n\nThis guidebook\
    \ is going to take some time to look closer at hacking with `Kali Linux`, and\
    \ all the different parts that come with it. We will start out with some basics\
    \ of hacking, such as the most common types of hackers and the differences between\
    \ `black hat`, `white hat`, and `gray hat`. From there we will move on to some\
    \ of the hacking process, including the steps that a hacker would take to help\
    \ them learn more about the network. \n\nWe will then move on to some steps that\
    \ are needed to work with `Kali Linux` on our system.\n\nWe will also move on\
    \ to an introduction to cybersecurity and why this is so important for us to understand.\
    \ Now that we have some of that out of the way, it is time to dive into some different\
    \ types of hacks and how we can prevent them from our own network. We will take\
    \ a look at `malware attacks`, cyberattacks, and how to scan our own servers to\
    \ get the best results in the process.\n\nRemember that the techniques that we\
    \ use in this guidebook in ethical hacking are the same ones that a `black hat`\
    \ or malicious hacker would use, but the point is to benefit society. Other topics\
    \ that we will spend time on in this guidebook include how to keep our networks\
    \ safe from online attacks, the importance of `firewall`, and the basics of `cryptography`\
    \ and how this works.\n\nHacking is a term that most people associate with something\
    \ bad, and they may be scared to even learn more about how this works. With this\
    \ guidebook, we are able to take a look at how to hack the system and ensure that\
    \ no one can wreak havoc. When you are ready to learn more about hacking with\
    \ `Kali Linux`, make sure to check out this guidebook to help you out!\n\n## Chapter\
    \ 1: The Different Types of Hackers\nThe first thing that we need to look at here\
    \ in this guidebook is the different types of hackers. Often, when we hear about\
    \ a hacker, we think of someone who is trying to get onto a system that they have\
    \ no right to access, stealing identities, personal information, and more things.\
    \ But there are actually a few different types of hackers out there.\n\nThe first\
    \ type is someone who likes to try and get onto systems where they are not allowed.\
    \ Usually, this is for their own purposes, and they are not concerned about how\
    \ this will negatively affect the other person. For example, these kind of hackers\
    \ are likely to get onto a database for business and steal names, addresses, phone\
    \ numbers, and credit card information of those who have shopped at that store.\
    \ But this is just one kind of hacker; they get the most attention because they\
    \ are the ones who cause the most damage, but there are two other types of hackers\
    \ that we need to discuss as well. For example, one type of hacker may try to\
    \ get onto a system they do not have access to but are not doing this to cause\
    \ harm. Instead, they do this to show some of the weaknesses in that system because\
    \ they are bored and want to see if they can actually succeed with it.\n\nThen\
    \ there are actually those hackers who do the hacking legally. They have permission\
    \ to be on the system, and they hack through it to see where the vulnerabilities\
    \ are. They are often hired by the organization either as full-time staff or as\
    \ freelance workers to help them protect against actual bad hackers and keep the\
    \ information safe. Even though there are different motivations behind the three\
    \ types of hacking, they will all use some of the same techniques to get the job\
    \ done. We are going to focus our work with the last type of hacker, looking at\
    \ how you can perform and protect against a variety of attacks, but the same kind\
    \ of methods can be used with someone who has malicious intent on the system.\
    \ With this in mind, let’s dive a bit more into the three types of hacking, including\
    \ the `black hat hacker`, `gray hat hacker`, and `white hat hacker`, and see how\
    \ each one of these is a bit different.\n\n### Black Hat Hacker\nThe first type\
    \ of hacker that we are going to look at is the `black hat hacker`. This is the\
    \ kind that is going to be heard in the news most, the one that we think about\
    \ when we hear about hacking in the first place. A `black hat hacker` is going\
    \ to be someone who searches around for vulnerabilities in a security system and\
    \ then will exploit them. The exploitation often occurs for either financial gain\
    \ or some other kind of malicious reason. These people are not usually worried\
    \ about the harm that they cause to other people. They will want to gather this\
    \ information to use for their own needs at some point. Often, this is done so\
    \ that they can steal money and make themselves rich before disappearing without\
    \ a trace. They have no wish to make things safe for others; they just worry about\
    \ their own benefits and how this process can help them in some manner.\n\nDepending\
    \ on how far into the system the `black hat hacker` can get, they have the potential\
    \ to inflict some major damage on the individual users of that computer, the shoppers\
    \ at that store, and the organization itself. They can really work hard to steal\
    \ personal financial information, compromise the security that we see in major\
    \ systems, and even shut down or alter some of the functioning of networks and\
    \ websites. These kind of hackers can range from teenage amateurs who want to\
    \ spread a virus across the computer all the way to networks of criminals who\
    \ have the goal of stealing credit card numbers and other important financial\
    \ information.\n\nThere are a lot of different methods that the `black hat hacker`\
    \ is able to utilize, and these can be similar to what we will find with the `gray\
    \ hat` and `white hat` hackers as well. For example, the activities that a `black\
    \ hat hacker` may rely on could include something like adding keystroke monitoring\
    \ programs to a system to steal data or even launching a whole attack that can\
    \ disable a whole website and keep people from accessing it at all while they\
    \ steal the information. Sometimes, these malicious hackers are going to employ\
    \ methods that are not on the computer in order to obtain the information that\
    \ they need. For example, they could call into a system and assume the identity\
    \ of another user in order to gain access. \n\nThe main difference that shows\
    \ up between these kind of hackers and what we see with the `gray hat` or `white\
    \ hat hacker` is the intention. They may use the same techniques as the other\
    \ two, but their point is to benefit themselves without any care about how it\
    \ affects the other party. This can be dangerous for business.\n\n### Gray Hat\
    \ Hacker\nNow that we have a better understanding of what a `black hat hacker`\
    \ is, it is time to look at the `gray hat hacker`. A `gray hat hacker` is to be\
    \ someone who breaks some principles and standards, just like the `black hat hacker`,\
    \ but the difference here is that they are doing this without malicious intents.\
    \ They are to be somewhere in the middle of the two and will exploit the system\
    \ in order to tell the public about this issue. Even though they are doing this\
    \ illegally, they are often doing it for the common good.\n\n### White Hat Hacker\n\
    The third type of hacker that we need to look at is the `white hat hacker`. This\
    \ is to be a professional in computer security who will break into a system that\
    \ is protected and other networks in order to test and then assess the security.\
    \ These are going to often work for the company they are trying to check that\
    \ all vulnerabilities are taken care of. For the most part, a `white hat hacker`\
    \ is going to be synonymous with the `ethical hacker`. They will do the work to\
    \ help out a business and make sure that any potential vulnerabilities and issues\
    \ are taken care of in a timely manner rather than letting a `black hat hacker`\
    \ onto the system to cause a mess. The `white hat hacker` is often someone who\
    \ has gone through a degree of schooling in order to learn all about computer\
    \ systems and how they work. The other two types of hackers are going to spend\
    \ their time learning computers and are often self-taught. Some may have a degree\
    \ in `IT` or computers in some form, but most just had an interest in this kind\
    \ of system and then worked on honing their skills through practice. With the\
    \ `white hat hacker`, these are professionals who spent quite a few times working\
    \ with computers, computer technologies, and more and would have learned about\
    \ hacking in the process. This allows them to be prepared for handling the large\
    \ networks and systems for companies and protecting them as much as they can.\
    \ These professionals don’t do the work of hacking in order to cause mischief\
    \ or to work on their own personal gain. They do it as part of their job to keep\
    \ companies and the customers who work with these companies as safe as possible\
    \ from other hackers.\n\n## Chapter 2: The Basics of the Hacking Process\nMany\
    \ don’t understand that hacking or any kind of penetration testing will follow\
    \ a process that is very logical. We can break it down into five main steps that\
    \ we need to look at when it comes to the basics of hacking. These are:\n1. Reconnaissance\n\
    2. Scanning\n3. Gaining Access\n4. Maintaining Access\n5. Clearing the Tracks\n\
    \n### Reconnaissance\nThe first phase of the hacking process that we are going\
    \ to look at is known as `reconnaissance`. This is to be able to collect as much\
    \ data as we can, and it is the most important phase. Of course, some people think\
    \ this phase is boring because it doesn’t involve some advanced techniques, but\
    \ it is necessary to get started. \n\nIn this phase, there are two types of reconnaissance\
    \ that we can work with: `passive` and `active`. The passive method is often easier\
    \ because it allows us to stay hidden a bit more and we can still gather up a\
    \ lot of the information that we need. For instance, when we check around the\
    \ company’s website, or look through some public records, including `WHOIS`, to\
    \ help us gather data of the company as well as their website.\n\nActive reconnaissance\
    \ is the second type of reconnaissance that we can work with here. Since this\
    \ kind of search is going to involve us interacting directly with the target,\
    \ there is an additional level of challenge that comes up. Making telephone calls\
    \ directly to the target and getting them to talk would be one of examples of\
    \ how this process works. Also, some hackers like to work with `ping service`.\
    \ The reason that they like to work with this is that it permits them to determine\
    \ if the system will respond or not. If it isn’t responding, then it may be time\
    \ to look for another method of entering into the system than the one you were\
    \ looking at before. If the `ping service` is used to ping one of the servers\
    \ of your target, then realize that this is active because you are still touching\
    \ the server. Any time we work with the active process here, we have to be careful.\
    \ There is always a possibility that you are leaving your mark behind. If any\
    \ traces are there with you at any time, then it is possible that it can lead\
    \ the target company right back to you.\n\n### Scanning\nAfter the process of\
    \ gathering information in the step above, it is time to move on to the scanning\
    \ phase. In this phase, we are going to use a variety of tools in order to gather\
    \ up more of the information that we need about the target. There are a variety\
    \ of tools that we are able to bring out when we get to this point, but some of\
    \ these are going to include `vulnerability scanners`, `sweepers`, `ping tools`,\
    \ `network mappers`, and `port scanners`. With all of these tools for scanning,\
    \ it is surprising how much information we are able to gather about the target\
    \ network.\n\nFor example, these tools will be used to determine the closed and\
    \ opened ports at any given time. We will also know what type of operating systems\
    \ the company uses and what types of devices are on that network, to name a few\
    \ things we can look up. You will notice with this phase that the scanning is\
    \ going to be more active than before, but the good news is that we can also use\
    \ the other passive forms of scanning. So, when determining the type of operating\
    \ system being used, we can send some network traffic to the systems. The response\
    \ that we get from the operating system to that traffic will vary based on the\
    \ kind of system in place.\n\nAnother example of what can be done with this process\
    \ is known as `dumpster diving`. This is a place where we are going to look through\
    \ different means to figure out important information, such as going through the\
    \ trash, but sometimes just looking at some websites, and more can help us get\
    \ ATM slips, phone numbers, and bank statements.\n\nAnother example of what is\
    \ that we are able to collect more from the employees is `social engineering`.\
    \ This is a technique that a hacker can use to manipulate a person to give up\
    \ any data they don’t usually give out. With the help of `social engineering`,\
    \ they will be able to fool the other person into giving up some personal information,\
    \ like the username and password of the employee so that they can get onto the\
    \ system.\n\nAnother example of what can be done with this process is known as\
    \ `sniffing`. This is a phase where we are going to look at the traffic on the\
    \ network. We can work with a few tools for this, but `Wireshark` is a great option\
    \ to help us sniff out the network.\n\n### Gaining Access\nNow that we have some\
    \ time to gather a bit of information on the target, it is time to work on access.\
    \ This is the third step that we are able to get onto the system. This is where\
    \ the real hacking is going to take place. There are a variety of methods that\
    \ we can use to get access, such as `denial of service attack` or `session hijacking`.\
    \ A `denial of service attack` or `DOS` on a system is a good option to work with.\n\
    \n### Maintaining Access\nOnce we have had a chance to get onto the network, we\
    \ would like to maintain the access. Take note that it will be better for us if\
    \ we keep control of the system for a longer period. This system can then be used\
    \ as a source that can help us infect some of the other devices that are on the\
    \ network until we reach our ultimate goal with this process. While we are on\
    \ this system and maintaining our access, we are in the perfect position for doing\
    \ a lot of things. We can intercept some of the emails we see coming in. We can\
    \ watch what users are getting onto the system and what they are doing there.\
    \ We can watch the network traffic that is coming in and causing problems. And\
    \ we can even work on adding in a `keyboard logger` so we can learn the passwords\
    \ and usernames to get onto more of the system. There are a lot of benefits that\
    \ the hacker is able to get when they work with continuous access to the network.\
    \ These benefits could include data manipulation and monitoring of the network\
    \ for a long time, which include additional time in launching some added attacks\
    \ in the process. The overall goal here is for you to stay on the system for as\
    \ long as you can. The quieter you are here, and the better you are at doing the\
    \ hacking, the easier it is going to be for you to stay put and not get noticed.\
    \ Be more of an observer in the beginning, at least until your attack is made.\n\
    \n### Clearing the Tracks\nAnd now, we are in the last phase of hacking at this\
    \ point. This phase is going to include clearing or deleting our tracks. This\
    \ is very important because if someone on the network suspects you are there,\
    \ then you will be kicked out and the vulnerability that you exploited is going\
    \ to get fixed. Getting onto the system and being careful until you are ready\
    \ to make the attack is key here. Once we have had a chance to get onto the network,\
    \ we would like to return to the same level of access or greater. To do this we\
    \ would need to implement some features to get this done, including a `backdoor`,\
    \ `Trojan`, or `rootkit` that can help us get access to that same network even\
    \ in the future.\n\n"
