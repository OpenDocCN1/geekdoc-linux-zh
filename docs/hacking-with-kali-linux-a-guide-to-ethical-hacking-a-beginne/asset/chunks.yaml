    \ will show up on the screen about the Rufus program that you are running.\n\n\
    2.  Check that the USB drive is the one selected on there, then click on the small\
    \ drive icon for the CD.\n\n3.  Locate the ISO file for Kali Linux that we downloaded\
    \ earlier and then click on Start. Give this process a few minutes to complete\
    \ before moving on.\n\n4.  After the process is complete, you can click on the\
    \ close button to get the Rufus window to close. This will give you the bootable\
    \ USB drive for Kali Linux.\n\n    1.  Other than using this to help with the\
    \ dual booting of Kali Linux in Windows, you can also do a Kali live boot using\
    \ this USB. This means that we are able to run Kali without having to install\
    \ it on our system. Keep in mind that it does limit the functions and the features\
    \ a little bit when you work in this matter."
