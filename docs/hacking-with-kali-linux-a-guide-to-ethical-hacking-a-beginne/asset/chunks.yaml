    When we have a protocol or a procedure that is able to meet at least some, but
    hopefully all, of the criteria above, then we have something that is known as
    a `cryptosystem`. These are often thought to refer just to mathematical procedures
    and some of the programs that we can make on our computer. However, they are also
    going to include some regulation of human behavior, such as choosing passwords
    that are hard to guess, logging off when the system is not in use, and not discussing
    any procedure that may be sensitive to the business with someone who doesn’t need
    to know the information.


    # Algorithms with Cryptography

    As we are working with cryptography, it is important that we take a moment to
    talk about some of the algorithms that come with this kind of process. Cryptosystems
    are going to use a set of procedures, which are the algorithms, to help us to
    encrypt and decrypt messages that are sent between a few systems. The point here
    is to make sure that the communication that is shared among the computer systems
    are going to be as secure as possible. This works not only on computer systems
    but also on applications and other devices like tablets and smartphones.


    A `cipher suite`, or the algorithm, is going to use one algorithm to help us with
    the encryption part of the process, another for helping the message authentication,
    and then the final key to finish up the exchange that is happening. This process,
    which is going to be embedded in protocols and then written in the software that
    runs on the operating systems and the networked computer systems, needs to have
    two keys generated in order to be successful.


    With this, we have to make sure that there are a `private key` and a `public key`
    that is generated to do all of the work that you would like in this process. Some
    of the ways that we are able to use these two keys include data decryption and
    encryption, digital signing, and verification for authentication of the message
    can all be important, as is the exchange of the key.


    ## Types of Cryptography

    While we are here, we need to spend some time taking a look at the different types
    of cryptography that are available. To start, the single-key or the symmetric
    key algorithms of encryption are going to create for us a fixed length of bits
    known as a `block cipher`. This one is going to contain a special key that the
    creator or the sender will use to help them encipher or encrypt the data. Then
    the receiver will get this key and can use that to help them decipher the information
    they have.


    There are a lot of different types of symmetric-key cryptography, and one of these
    is going to include the `AES` or `Advanced Encryption Standard`. `AES` is because
    a specification established in 2001 by the National Institute of Standards and
    Technology as the Federal Information Processing Standard, and it was used to
    help protect any information that was considered sensitive. The standard is mandated
    for use with the US government, and many of those in the private sector will use
    it as well to help them get things done and stay safe.


    In addition, a few years later, in 2003, the `AES` was approved to be used in
    the information that was classified by the US government. Right now, it is a specification
    that is free of royalties and is implemented in software and hardware throughout
    the world. This is actually the successor to the `DES` or the `Data Encryption
    Standard` that would work with longer key lengths and could prevent things like
    brute force attacks.


    Then there are also options for asymmetric or public-key encryption algorithms.
    These are a bit different because they are going to use a pair of keys instead
    of just one. There is going to be a key that is the public one, and this is associated
    with the sender or the creator for encrypting messages. Then there is also the
    `private key`, the one that only the originator is going to know (unless a hacker
    can get in and expose this key or the originator decides to share the information),
    for helping them to decrypt their information.


    There are a number of public-key cryptography options including `RSA`, which is
    used often on the internet to keep things safe; `Elliptic Curve Digital Signature
    Algorithm` which is used with `Bitcoin` and other cryptocurrencies; `Digital Signature
    Algorithm` which was used as a standard for digital signatures; and the `Diffie-Hellman`
    key exchange.


    To help make sure that the integrity of the data is maintained in cryptography,
    `functions`, which are able to return to us a deterministic output from the input
    value, are going to be used to help us map up all of the data to fixed data size.
    This is going to make sure that your information is able to stay as safe and sound
    as possible, and makes it easier for you to send and receive messages, without
    a hacker being able to get in the middle and cause a mess.


    ## How did Cryptography Start?

    The next thing that we need to take a look at here is the history of cryptography
    and how it got started. The word “cryptography” is actually from a Greek word
    known as `kryptos`, meaning hidden. The origin of this is dated from about 2000
    B.C. with the Egyptian practice of the hieroglyphics. These were consistent with
    complex pictograms, the full meaning of which was really only known by a few people.


    In more recent times, cryptography has turned into a kind of battleground of some
    of the world’s best mathematicians and computer scientists working to come up
    with the best code. The ability to store and transfer, in a secure manner, any
    sensitive information that is needed has been such a critical factor in business,
    and sometimes, in war as well.


    Because governments do not wish for certain entities in and out of their countries
    to have access to the different methods of receiving and sending information that
    could be secret and could hold a threat to national interests, it is no wonder
    that cryptography has been a big subject to restrictions in different countries.
    This can include some limitations of the export and usage of the software to the
    public and more.


    Of course, the way that cryptography is being used is different now than what
    it has been in the past. Many times, we are going to see this kind of cryptography
    in any transaction where the information needs to be kept secure. While it is
    used in government quite a bit, it can show up with the banks that we use and
    many of the transactions that occur online when we make purchases. The point is
    to allow us to send some personal and confidential information to another person
    or business, without the risk of having someone take it over and use the data
    for their own needs.


    ## Concerns with Cryptography

    Attackers are able to circumvent some of the cryptography on occasion. And when
    they are able to do this, it allows them to hack into computers that are responsible
    for doing the encryption and the decryption of the data to start with. The hacker,
    once they are there, is able to exploit some of the weaker implementations that
    are there, such as using the default keys to help them out. It is true, though,
    that this cryptography is going to make it harder for an attacker to access the
    messages and any data that is protected by the algorithms of encryption. This
    is why it is so important to add this to your system. It may not be able to keep
    everything out all of the time, especially with a really skilled hacker. But it
    can make things more difficult and can solve a lot of problems for you in the
    process.


    Growing concerns come with the processing power of quantum computing to break
    through some of.

