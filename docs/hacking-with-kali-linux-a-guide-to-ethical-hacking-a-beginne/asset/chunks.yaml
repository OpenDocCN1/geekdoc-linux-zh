    本指南将花时间仔细研究使用 `Kali Linux` 进行黑客攻击及其所有不同部分。我们将从黑客攻击的基础知识开始，例如最常见的黑客类型以及 `黑帽`、`白帽`
    和 `灰帽` 之间的区别。从那里，我们将转向黑客攻击的某些步骤，包括黑客为了帮助他们更多网络而会采取的步骤。


