    1. When you provide your personal information, make sure that you are only working
    with sites that you trust. A good rule of thumb for this one is to check on the
    URL. If the side includes the `https://` in the beginning, then we know that it
    is a secure site. If the URL is missing that “s,”` it is important to avoid entering
    any kind of sensitive information like your social security number or data on
    your credit card because it could be a bad site.


    2. You should never open up any email attachments or click on links that are in
    emails from sources you do not know. You should also make sure that others are
    on the same network as you do the same. One of the most common ways that people
    are going to be attacked is with these emails that are disguised and sent out,
    looking like they come from someone you really trust.


    3. Keep the devices up to date. If you personally, or your workplace, isn’t keeping
    the devices as up to date as possible, then this can cause some problems for everyone.
    Software updates are going to be important because they contain some of the patches
    that you need to fix security issues and to keep the cyber attacks out. Cyber
    attackers love it when a device is out of date because it is much easier for them
    to get onto that network and cause issues.


    4. Make sure that you back up your files on a regular basis in order to prevent
    attacks on your cybersecurity. If you get attacked and need to wipe all of your
    devices in order to keep the attack off your computer, it is going to be much
    better to have the files stored in another place so you can get them back when
    you need to.


    Cybersecurity is going to be something that is always evolving, which is sometimes
    going to make it even more difficult for us to stay up to date and current on
    all of the information that we need to take care of. But whether we are talking
    about a company or an individual, it is important to make sure that we can keep
    our network safe so that no one is able to come on and steal our personal information,
    ask for money, or cause some of the other issues as well. Staying informed and
    making sure that you and others around you are as cautious online as possible
    are two of the best ways to make sure that you are protected and that someone
    is not likely to cause these kinds of attacks on you.


    # Chapter 5: Malware Attacks


    Now that we have spent a bit of time talking about the importance of cybersecurity
    to make sure that our networks and systems can stay safe, it is time to move on
    to learn about a few of the different prominent types of malware attacks that
    we can watch out against. These are going to be similar whether you are trying
    to protect your own personal computer or you are protecting larger amounts of
    data and personal information for a big company.


    Malware attacks are a big problem for many companies, and they can be one of the
    biggest issues when it comes to the world of cybersecurity. If even one part of
    the system, whether it is the processes, the technology, or one of the people
    on the network, falls prey to this, then it can spell trouble for the whole organization.
    It is important to recognize some of the most common malware attacks and how they
    work so that we can stay protected and safe from all of them while making sure
    that our personal information is always safe and sound.


    ## Three Categories of Cyberattacks


    For all of the supposed mystique and mystery that are around things known as cyberattacks,
    they are actually pretty much all the same-old property and financial crimes,
    but sometimes add in some new tools. Because of the assumed anonymity that people
    can take on when they use the internet, there are a lot of people who will be
    enticed to doing these crimes, and many people need to be on the lookout before
    they are taken advantage of overall.


    Many of these cybercriminals are going to be able to get in and out without you
    noticing, unless you are being vigilant and watching your system and how things
    are going. Others may spend too much time bragging about what they did and will
    get into trouble that way. But one thing is for sure, because of the anonymity,
    many people wouldn’t want to attempt breaking into a house or do any other crimes
    could be tempted to give cybercrime a try because they think that they won’t get
    caught.


    For the average user, this means that there are more attacks on their systems
    and networks than ever before. This can be a problem for those who want to learn
    how to keep their information safe, even if that information is just their family
    pictures. The good news is that there are ways that we can protect ourselves,
    we just need to be on the lookout ahead of time so that we are not taken advantage
    of.


    To help us get started, we need to take a look at some of the things that come
    with a cyberattack and how to watch out for them. For the most part, these cyberattacks
    are going to fall into one of three categories that include:


    1. The target and the criminal are going to know each other in some manner. The
    motivating factor in this one can often be revenge or money, and the many distinguishing
    features that we will look for are that the culprit perpetrator has or had computer
    access to their target. This allows them time to do preparation on the attack
    ahead of time, plant in some malware, and more. In this category, we will see
    things like cyber-spying taking on more of a role with the help of keyloggers,
    microphones, and webcams.


    2. The second option is that there is some kind of relationship between the criminal
    and the target, or, at the very least, the criminal knows the victim. They may
    have made a connection on any social media platforms, they are famous or rich,
    or they own something that the hacker wanted. Selecting a victim is not random,
    though they haven’t met yet physically, and they don’t have physical access to
    the computer of the target. Financial gain will be the motivation in this kind
    of situation.


    3. The victim is not known to the criminal or is just a random person who was
    caught up in the phishing scam of the criminal or another similar technique. The
    victim nor the criminal has any idea who the other one is.

