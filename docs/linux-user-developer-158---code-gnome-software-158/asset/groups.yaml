    \    printf(\"the error is: %d\\n\", errno);\n    printf(\"%s\\n\", strerror(errno));\n\
    }\n```\n\n如果 `open()` 发生了其他问题，`errno` 的值可能会改变，因此从系统调用中获取值是没用的；然而，`errno` 的值本身不会被改变。请查看下面的代码以解决问题。接下来的文章将帮助你分析更多的错误和处理——目前知道如何获取你的情况就足够了。不要忘记在代码中包含\
    \ `errno.h` 头文件。你还需要包含 `string.h` 来使用 `strerror` 函数。\n\n```c\n#include <stdio.h>\n\
    #include <stdlib.h>\n#include <errno.h>\n#include <string.h>\n\nint main(int argc,\
    \ char **argv) {\n    int x = 0;\n    printf(\"error: %d\\n\", x);\n    printf(\"\
    %s\\n\", strerror(x));\n    printf(\"the value of x is: %d\\n\", x);\n    return\
    \ 0;\n}\n```\n\n现在是修复 bug 了。下面的图片显示了完整的输出。使用输入 1,000,000 运行程序，你将看到你可以保存并存储结果。将\
