    \ data. This can be proven with the:\n\n```c\nstring ta=\"Hello\";\nstring tb=\"\
    Hello\";\nif(ta == tb) {\n    print(\"Strings are equal\");\n}\n```\n\nString\
    \ contains a few helper functions that have to have space to discuss, valalog/glib-2-0\
    \ is a great point.\n\n## Inheritance and interfaces\n\nLike C, Vala does not\
    \ support multiple inheritance. See the detail for more complex hierarchies use\
