    \ `errno` 变量，赋予发生的错误代码。如果你需要的话，在调用函数后立即获取 `errno` 的值，以防另一个调用更改它的值，如下例所示：\n\n```c\n\
    if (errno < 0) {\n    int err;\n    printf(\"error: %d\\n\", err);\n    // call\
