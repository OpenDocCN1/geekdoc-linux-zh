    # PRIVACY


    # GnuPG 2.1.8


    # The foundation for your privacy and ensuring surveillance


    From Snowden information on government surveillance, to worry about our private
    information is handled by companies and social networks, there are many tools
    to protect you with every email.


    GnuPG (the Gnu Privacy Guard) is used to encrypt data and sign certificates. It
    includes a key management facility and is compatible with the OpenPGP standard,
    RFC 4880, but it doesnt used patented algorithms.


    This version provides support for Elliptic Curve Cryptography (ECC) for a smaller
    key size: 256-bit ECC public keys provide secure 302-bit


    RSA public key. No matter how GnuPG is, it has no benefit if it''s not used, the
    Free Software Foundation has a great deal at email@defense.org to get you started.
    Go to use the Enigma Tutorial for encryption (if you''re new) and Digital Signatures
    (if you''re not). It''s worth checking in the Mutt manual translated to GnuPG.


    The highlights of GnuPG on the command line is a flexible tool, touching the appropriate
    action to take - such as creating a key or a signature - content. Type gpg on
    and you''ll be invited to send your message.


    Stop putting off using GnuPG for your encryption and start it today.


    # Pros


    It is free and has a great deal to help walk through setting it up


    # Cons


    It''s difficult to protect your privacy when you will have to explain PGP to invited
    contacts


