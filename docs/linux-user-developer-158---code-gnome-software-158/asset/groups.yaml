    # 在网页中添加字体


    本节将向你展示如何在 HTML 模板中使用 Google Fonts。在 Google Fonts.com 上，你可以看到出的出的可用字体。使用 Google
    Fonts 不需要下载或安装任何 JS。使用字体的优势在于你可以让你的输出更美观并使其独一无帜。


    以下 HTML 代码演示了向你的项目添加字体的操作。


    ```html

    <link href="https://fonts.googleapis.com/css?family=Roboto+Condensed&family=latin;"
    rel="stylesheet" type="css">

    ```


    你可以从 google.com/fonts 获取添加多种字体所需的 HTML 代码。


    警告：在网页中添加许多字体不仅会减慢页面加载速度，还会影响性能。


    字体的实际应用需要一些 CSS，可以使用以下代码实现：


    ```css

    .style{font-family:"Roboto, sans-serif;"}

    ```


    # 创建散点图


    散点图可以用图形化的方式揭示变量之间关系的强度。数据将用于程序中，展示一项关于不同学生仍记得中学课程知识的调查结果。`myData` 以对象数组的形式存储所有数据，并硬编码在
    JavaScript 程序中。每个点根据响应数量进行缩放，作为对每个点“准确性”的回答。


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_42_0.png)

