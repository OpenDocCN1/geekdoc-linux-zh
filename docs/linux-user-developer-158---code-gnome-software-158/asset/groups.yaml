    \ Connect the Pi camera module\n\nNext you'll need to connect the camera module\
    \ to your Raspberry Pi model. If you have the necessary connector, although it\
    \ is found on the device will depend on the version of your Raspberry Pi. Various\
    \ options are available, such as tripods and mounts. Most of these should be suitable\
    \ for securing your Raspberry. The Pi camera connector next to the Ethernet port\
    \ as in Model B. On the Raspberry Pi 2, connector is in a similar position, but\
    \ it is a little further from the Ethernet port between the audio-out and HDMI\
    \ ports.\n\n## Stop-motion\n\nConnecting the camera module can be tricky. Begin\
    \ with taking your Pi out of its case or disconnect all cables. Take precautions\
    \ before removing the device from its antistatic bag, as the camera module is\
    \ very sensitive to static. In the Python editor, open File > New and enter the\
    \ code below, setting the camera.vflip and camera.hflip as True or False as required.\
    \ Save (perhaps as 'camflip.py'), then press F5 to run the script and see the\
