    We also stock a wide range of expansion boards for the original Raspberry Pi models\
    \ A and B\n\n![](img/2f88ea4367b9bd5792b1a33e619a1113_32_1.png)\n\n![](img/2f88ea4367b9bd5792b1a33e619a1113_32_2.png)\n\
    \n![](img/2f88ea4367b9bd5792b1a33e619a1113_32_3.png)\n\n![](img/2f88ea4367b9bd5792b1a33e619a1113_32_4.png)\n\
    \n# Tutorial File I/O\n\n![](img/2f88ea4367b9bd5792b1a33e619a1113_33_0.png)\n\n\
    Mihalis is a programmer for Unix and also a math teacher. He has been using Linux\
    \ since 1993.\n\n# Systems programming: File input output\nThis article will talk\
    \ about the system calls that help you work with file I/O and start developing\
    \ practical utilities. You should recognise that using higher-level commands in\
    \ other languages is easier until something bad happens. Therefore, it is always\
    \ good to know what is going on beneath the surface and would be beneficial to\
    \ revisit this article after reading it for the first time in order to fully understand\
    \ the information presented. You might try right out to double-check. Usually\
    \ with practical subjects, the more code you write, the more you will understand\
    \ the techniques as well as the theory behind them. The good news with file I/O\
    \ is that there are just system calls that have the ability to perform most of\
    \ the file read, write, open and seek. There are some others that you will also\
    \ need to know, but the aforementioned functions are the foundation of it. So\
    \ let's take a look at the most important system calls that have to do with I/O.\
    \ You can see all available options for each system call by visiting their pages.\n\
    \n```c\nint main(int argc, char **argv) {\n    char *filename = \"file\";\n  \
    \  int fd = open(filename, O_RDONLY | O_CREAT, 0664);\n    if (fd < 0) {\n   \
    \     int errno = errno;\n        printf(\"There was an error reading: %s\\n\"\
    , strerror(errno));\n    }\n    int offset = (argc > 1) ? atoi(argv[1]) : 100000;\n\
    \    int written = write(fd, \"LUO\", 3);\n    if (written != 3) {\n        int\
    \ errno = errno;\n        printf(\"Error writing to %s\\n\", filename);\n    }\n\
    \    int fd2 = open(\"anotherFile\", O_RDONLY, 0664);\n    printf(\"The error\
    \ is: %s\\n\", strerror(errno));\n}\n```\n![](img/2f88ea4367b9bd5792b1a33e619a1113_34_0.png)\n\
    \n# The (open) system call\nThe family of functions will be the center of the\
    \ next tutorial, as the structure that holds the relevant data is very important.\
    \ At the end of this article, follow along the examples and try to write your\
    \ own code if you are making mistakes. Tutorial available:\n\n- RDWR - open the\
    \ file for reading and writing\n- RDONLY - open the file for reading\n- WRONLY\
    \ - open the file for writing\n- EXEC - open for execution only\n- SEARCH - open\
    \ for search\n\nNote that one of the following can be present when opening a file.\
    \ The constants can differ when things to a file:\n\n- O_CREAT - create the file\
    \ if it does not exist, in which case you will need to provide another argument\
    \ which will be the permissions of the file to be created\n- O_TRUNC - if the\
    \ file exists and is opened without protection, truncate its size to zero\n- O_APPEND\
    \ - append data to the end of the file when writing\n\n# Debug programs\nUsually,\
    \ folks think they have time and there will be bugs hiding in your code. But debugging\
    \ is an art of its own! The hardest part is not to find the bug, but to reproduce\
    \ the bugs on your machine. Fixing the bug is usually the easiest part of the\
    \ process. Here you can see many of the open(2) constants in action You can combine\
    \ any of the previous constants in the order you want with open(2). For example,\
    \ with O_RDWR|O_CREAT means that it will create the file if it does not exist\
    \ or it will already exist (O_CREAT) and then it will be truncated to zero.\n\n\
    A simple 'algorithm' for debugging code is to follow the following steps:\n1)\
    \ understand the input that makes the bug reproducible;\n2) use a debugger with\
    \ software breakpoints to find where the code goes wrong. However, sometimes it\
    \ is better to debug it by tracing the code and trying to find why it does not\
    \ work.\n\nYou can also create a new file with the create(2) system call, which\
    \ is not discussed in this article. Finally, remember that there are many other\
    \ functions and programs you might have used!\n\n# The close(2) system call\n\
    This is the simplest system call in this article. It returns 0 on success or -1\
    \ otherwise. Please remember that file descriptors 0, 1 and 2 are always in use\
    \ and should never be closed!\n\nRelated to the read(), the write() function that\
    \ writes data to a file. The function returns the number of bytes written or -1\
    \ in case of error. If you actually encounter an error while writing, just read()\
    \ and try to do it again, you will get no error messages unless you provide the\
    \ appropriate error checking. However, note that opening a file for writing will\
    \ fail no flags unless it is a correct command:\n\n# The read(2) system call\n\
    You can read data from an open file using read(). The number of bytes read is\
    \ returned on success. If you read to the end of a file, or if there is an error,\
    \ read() returns -1. You will need a buffer to store the data.\n\n```c\nint fd\
    \ = open(filename, O_RDONLY, 0664);\n```\n\n# Tutorial File I/O\n![](img/2f88ea4367b9bd5792b1a33e619a1113_35_0.png)\n\
    \nThe good news with file I/O is that there are just system calls that have the\
    \ ability to perform most of the file read, write, open and seek. There are some\
    \ others that you will also need to know, but the aforementioned functions are\
    \ the foundation of it.\n\nThe offset is the point in the file.\n![](img/2f88ea4367b9bd5792b1a33e619a1113_35_1.png)\n\
    \nThis particular option will apply to the directories.\n"
