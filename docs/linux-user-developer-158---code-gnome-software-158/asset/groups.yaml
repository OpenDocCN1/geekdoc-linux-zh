    \ as you make the steps\n\nIt is important to note that the swatch action helps\
    \ to prevent denial of service attacks via deliberately triggering huge numbers\
    \ of events in a short period. In other words, swatch switches the intelligence\
    \ to ignore repeated occurrences of a given event, preventing performance degradation.\n\
    \nWe can note in this example that we set the threshold for these failed actions\
    \ to log in the system within seconds, although you can choose your own setup.\n\
    \nAs part of remediation, swatch has the ability to execute a secondary script\
    \ if an specific event has been detected. This functionality of swatch allows\
    \ you to trigger a further action on an event, or use the exec keyword to execute\
    \ some bash script, and other useful commands.\n\nAnother powerful feature of\
    \ swatch is the ability to specify a time of day that an action will be executed\
    \ or sets of actions after business hours. By adding a time condition to an action,\
    \ you can use the timeframe keyword to limit the duration after an action. In\
    \ numerical format: each day of the week is represented by a number between one\
    \ and seven (7 = Saturday, 1 = Sunday) and hours represented in a twenty-four\
    \ hour format one and twenty-four.\n\nThe following example illustrates how we\
    \ direct swatch to execute a remediation script if it detects a certain pattern\
    \ against the system:\n\n```\nwatchfor /cc Connection connected by/\n  exec \"\
    /usr/bin/custom_remediation.pl\"\n```\n\nAnother aspect of how swatch works is\
    \ to avoid a storm of alert messages. That is, we can configure swatch to take\
    \ a switch only if it occurs within a timeframe. We can consider a scenario where\
    \ there are multiple failed logs to search for and then take an action, our messaging\
    \ system is set up to output a log message to the console. The following command\
    \ will handle such a case:\n\n```\nwatchfor /sh:failed/\n  echo error\nmail_addresses=admin@mycompany.com\n\
    \  subject=Possible! SSH/Brute! Attempts\n  track_by=1, type=threshold\n  count=5,\
    \ seconds=10\n```\n\nA user is alerted by swatch only when the free-drive becomes\
    \ full. It is always advisable to follow best practices when you are using swatch.\
