    2016. Due to changes to the power supply, the delivery of the microcomputers to
    schools has been delayed until next year. They were intended to be powered by
    a battery for use off the laptop, but a few months ago it was announced that the
    microbit would now require three AA batteries, which caused an unexpected delay.
