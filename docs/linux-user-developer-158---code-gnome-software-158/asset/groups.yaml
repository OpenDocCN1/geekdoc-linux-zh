    priced and come in a variety of colours to suit your needs.


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_78_0.png)


    # Attach the Raspberry Pi - part 1


    On the top of the driver board, on the opposite side to the USB connector, connect
    your ribbon cable to the kit and connect it with the blue mark facing the cable
    of the screw. Next, you should connect the other end to the pins marked ''SV'',
    then plug the black jumper cable into the one marked ''GND'' (the colour of each
    cable doesn''t matter, but this is the convention).


    # Unpack the screen


    The screen comes in parts, as can be noted. Included is the display, driver board,
    board mounting hardware, jacket cables. The packaging box contains some parts;
    it is recommended to keep the flat part of this to use as a surface, avoid scratching
    the screen. For the time you are using it it should also leave the protective
    plastic on the front of the screen, and keep it on until final location.


    # Attach the Raspberry Pi - part 2


    Place your Raspberry Pi on the mounting board with the USB port on the same side
    as the driver board. Screw the Raspberry Pi into place with the provided screws;
    again be careful not to tighten. Connect the other end of the white ribbon cable
    to the CSI connector on the Raspberry Pi, which is the one on the same side as
    the ribbon cable that is already attached. It should round up and click into place.


    # Attach the driver board - part 1


    Place the display face-down on the anti-static foam, and you will see on back
    that there is a large ribbon cable with a smaller ribbon attached. Grab the driver
    board, where on the back should be a connector. You should also leave this face
    on the anti-static foam.


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_78_1.png)


    Carefully undo the connector on the driver board, insert the ribbon cable and
    then click the clip to secure the cable. Turn the driver board over onto the back
    of the display, by you should now see a small ribbon cable and a small connector
    on the top side of the board. Connect it in the same way you did the large one.


    # Attach the driver board - part 2


    # Power your Pi


    The display is designed so that the driver board and Raspberry Pi can run from
    a single power supply. Use the red jumper cable (whatever colour you used for
    SV) to plug into the driver board in Step 7 and connect the other four pins on
    the GPIO (ground, closest to the end of the Raspberry Pi board). Then take the
    black or jumper cable and connect it to pin as on the Raspberry Pi (ground, one
    closest to edge).


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_78_2.png)


    # Secure the driver board


    Once the ribbons are securely fastened, the next step is to secure the driver
    board to the back of the display. Grab the mounting posts, align the four holes
    on the back of the board with the mounting posts, then screw the driver board
    into place with mounting posts. Be careful not to tighten.


    # Boot your Pi


    You are now able to plug in your 2A-USB power supply into the connector on the
    driver board, then the Raspberry Pi and will boot up. Touch the touch functionality
    with the white ribbon, so no other connections are necessary and it should work
    right away!


