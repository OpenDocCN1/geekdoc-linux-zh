  - "[PAGE 28]\n\n```\nstdout.printf(\"Pos contains %c \\n\", i, val);\nfor(int i=0;\
    \ i<tank.length; i++) {\n\tuint8_t val=tank[i];\n\tstdout.printf(\"Pos contains\
    \ %c \\n\", i, val);\n}\n```\n\nKeep in mind that the content of the template\
    \ cannot be modified at runtime because @ does not play nicely with string variables.\
    \ This means that internationalisation requires a solution with a selection statement\
    \ or preprocessor directive. Let us start where the language can be chosen at\
    \ runtime:\n\n```\nint main(string args) {\n\tGtk_init(ref args);\n\tfloat av\
    \ = 2;\n\tfloat bv = 4;\n\tint lang = 6;\n\tstring text;\n\tif(lang==0) {\n\t\t\
    text = \"%f is $av, BV is $bv\";\n\t} else {\n\t\ttext = \"%f is $av, BV is $bv\"\
    ;\n\t}\n}\n```\n\n# Processing strings\n\nC is known for its barebones approach\
    \ to handling strings. This while Kernighan and Ritchie wrote The C Programming\
    \ Language, 8-bit character sets have since proved insufficient for characters\
    \ like ä, ö, or ù.\nVal introduces a type of dynamic strings: If you try to link\
    \ or change them, a new one is allocated. Furthermore, the use of the UTF-8 encoding\
    \ is mandatory. A new string is every\n\n```\nstring text = \"This is a string\
    \ that can be displayed\";\n```\n\nIn practices, strings are used to output one\
    \ or more variables in a format. Val addresses this with strings templates, a\
    \ feature best illustrated with an example:\n\n```\nint main(string args) {\n\t\
    Gtk_init(ref args);\n\tfloat av = 2;\n\tfloat bv = 4;\n\tstring text = \"%f is\
    \ $av, $bv is $bv\";\n}\n```\n\nPrefixing a string with the * operator makes the\
    \ runtime for substitutions prefixed with $. They are then treated as calculation\
    \ instructions. The example above shows the result in the image below:\nThis is\
    \ not limited to simple variables.\nThe following performs a computation by multiplication\
    \ of the two values inserted:\n\n```\nint a = 7, b = 7;\nstring s = \"$a * $b\
    \ = $b\"; // 7 * 7 = 49\n```\n\n![](img/2f88ea4367b9bd5792b1a33e619a1113_28_0.png)\n\
    \nVariables prefixed with $ are inserted in the string; brackets prefixed with\
    \ $ perform their calculations\n\nPreprocessor solutions are superior in that\
    \ reduce the size of the binary, as unneeded code is simply stripped during the\
    \ compile process. This means language is realized via an executable file of one\n\
    \n```\nint main(string args) {\n\tGtk_init(ref args);\n\tfloat av = 2;\n\tfloat\
    \ bv = 4;\n\tstring text = \"%f is $av, BV is $bv\";\n#if elish\n\ttext = \"%f\
    \ is $av, BV is $bv\";\n}\n```\n\n![](img/2f88ea4367b9bd5792b1a33e619a1113_28_1.png)\n\
    \n# ADVANTAGES OF GLIBJECT\n\nEven Vala prevents the creation of classes derived\
    \ new objects may be better than fearing the small memory saved in the more advanced\
    \ features that are offered.\nModern GLib also provides reference-counting callback\
    \ which Vala uses to dispose of unexpected objects automatically. The base class\
    \ provides a method for property change notification. This means clients can register\
    \ interest in updates without polling. In the corresponding method, the callback\
    \ is invoked inside\n\nIf a part of your product handles badly, it is best to\
    \ start by checking whether all of your classes are derived from Glib. The GObject\
    \ architecture acts up when it is confronted with 'normal' classes."
- md: "\n## Feature Code GNOME software\n\nWhen creating a link or a similar data\
    \ structure, developers should create data structures that are similar to the\
    \ one below:\n\n```c\nclass AnvilID3Object :GLib::Object {\n  public:\n    AnvilID3Object(Object\
    \ prev);\n    AnvilID3Object(Object next);\n};\n```\n\nWhile C# doesn't have any\
    \ problem with this, C was not able to distinguish two objects that point to one\
    \ another. This is caused by the reference counting principle: each of the objects\
    \ has an 'owner' and can never be removed. To prevent this behavior, we used a\
    \ workaround. Run on it of a workaround of your choice for a closer look.\n\n\
    ```c\npublic static int main(int *args) {\n    while(1) {\n        AnvilID3Object\
    \ *obj = new AnvilID3Object(NULL);\n        AnvilID3Object *next = new AnvilID3Object(obj);\n\
    \        obj->next = next;\n        next->prev = obj;\n        return 0;\n   \
    \ }\n}\n```\n\nFortunately, almost easy. Declaring this particular relationship\
    \ as 'weak' informs the collector that this is not for determination of ownership.\
    \ The version of AnvilID3Object will work much better.\n\n```c\nclass AnvilID3Object\
    \ :GLib::Object {\n  public:\n    AnvilID3Object(Object prev);\n    public weak\
    \ AnvilID3Object next;\n};\n```\n\nWhile C differs from data as it is not supported;\
    \ reference commands can be sent by using the following syntax `gtk+-3.0 vala-example.c\
    \ -Dgerman`. Another nasty trap is to parse the string by byte; in C, you can\
