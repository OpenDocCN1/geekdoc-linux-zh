- md: "\n# Set up a WordPress website on your Pi\n\nOne of the reasons the Raspberry\
    \ Pi is so popular in recent years is because it is an extremely capable little\
    \ computer that packs a lot of punch for its very small price. Since the release\
    \ of Raspberry Pi 2 Model B in the early months of 2015, it is now more capable\
    \ than ever before and makes the perfect platform for your low power, microsized\
    \ web server.\n\nIn this tutorial we will show you how to set up a LAMP stack\
    \ (Linux, Apache and PHP) on your Raspberry Pi. WordPress is one of the most popular\
    \ content management and blogging platforms today, with over 52 million new posts\
    \ uploaded each month. According to the company's statistics (wordpress.com/),\
    \ there are more than 19 billion WordPress pages. As far as software goes, WordPress\
    \ is one of the best out there that is available to you - let's get it running.\n\
    \nAaron Shaw from Pi Supply (piisupply.com) has been involved with Pi since the\
    \ very beginning enough for both of us! Say hello@raspberry.com\n\n## 01 Update\
    \ Pi\n\nAs we start any Raspberry Pi project, it is best to update your Pi to\
    \ the latest OS before proceeding. You can do this by opening the following commands:\n\
    \n```bash\nsudo apt-get update\nsudo apt-get upgrade\n```\n\nWhen prompted, then\
    \ press Enter to confirm.\n\n## 02 Install the software\n\nAs mentioned in the\
    \ introduction, a LAMP stack uses Linux (the operating system), Apache (the web\
    \ server), MySQL (the database) and PHP (the programming language). We will need\
    \ to install the web server first, but we will need to install the database. To\
    \ do this, open a terminal window and issue the following:\n\n```bash\nsudo apt-get\
    \ install apache2 php apache2-mod-php mysql-server php-mysql\n```\n\nWhen the\
    \ process starts installing MySQL, you will be prompted to enter a root password.\
    \ Make sure you remember this password as we will need it later to enable on your\
    \ server's access to the database.\n\n## 03 Test Apache\n\nYou can test the installation\
    \ of Apache by opening a web browser on your Pi and going to http://localhost/\
    \ - it should take you to the default Apache 'works' page.\n\n## 04 Test PHP\n\
    \nNext, develop the default index.html file and then browse to the web server\
    \ root:\n\n```bash\ncd /var/www\nsudo nano index.html\nsudo nano index.php\n```\n\
    \nopen an index.php file for editing and then create the following:\n\n## 05 Download\
    \ WordPress\n\nTo install WordPress you will need to find out your IP address\
    \ from your local network. Open a browser and navigate to 192.168.1.xxx, replacing\
    \ xxx with your actual IP address. To do this, issue the following commands:\n\
    \n```bash\ncd /var/www\nwget http://wordpress.org/latest.tar.gz\n```\n\nThe final\
    \ step is to extract the archive, move all files to the root:\n\n```bash\ntar\
    \ xzf latest.gz\nmv wordpress/* .\nrm -rf wordpress\n```\n\n## 06 Set up the database\n\
