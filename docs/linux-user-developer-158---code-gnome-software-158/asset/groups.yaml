    ```\n\n```c\npublic abstract int myCAN();\n```\n\n```c\nclass RelaxPeace : IRelaxPeace,\
    \ Glib.Object {\n    public int myCAN() {\n        return 2222;\n    }\n}\n```\n\
    \n```c\nvoid main () {\n    IRelaxPeace myIF=new RelaxPeace();\n}\n```\n\nA careful\
    \ look at the implementation reveals that Vala comes from C# in that interfaces\
