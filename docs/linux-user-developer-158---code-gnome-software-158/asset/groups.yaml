    # 开源


    发布固件源码和电路设计文件（根据通用公共许可证和知识共享许可提供）


    世界开始意识到增材制造的重要性，对于 Spark 来说，我们希望让更多公司将打印整合到其设计和制造过程中。


    BeagleBone 默认公司的发布版本包含一个带有辅助 AVR 微控制器的卫星板，用于支持面板 LED 和状态指示器。


    然而，公司对爱好者自行构建自己的打印机发出了警告，表示发布的文件仅供参考，公司对打印机或基于文件的衍生品均不承担任何责任。


