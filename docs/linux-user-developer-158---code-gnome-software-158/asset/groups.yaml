    # GAME


    # Galois 0.4 Refreshing the falling block formula with triangles, hexagons and
    finished 3D


    All great games are based on blocks, from Tetris, but Blockus to Minecraft. Tetris
    remains a favourite time waster for many, but for block lovers looking for a greater
    challenge, look beyond yours.


    An update to Galois (now named after the French word for ''welsh''), but after
    Evariste Galois, a French mathematician and one of the founders of ''group theory''
    is an opportunity to once more look beyond the conventional block. Galois enables
    a choice between regular blocks, three-dimensional shapes, hexagons and triangles.


    Installation is easy from source, thanks to minimal dependencies, and since the
    developer, Gerard Labat, provides a package we dont even need to compile. On an
    Ubuntu Trust box, we installed liberty+-2.6 and ignored warnings about the library
    version, then we were running without any problems.


    Tetris clones are plenty and now set the world ablaze; they all help to keep the
    brain harmless engaged during periods of downtime. Galois''s case, three and six-sided
    shapes provide challenges in the cubic option provides a brain real joy.


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_89_0.png)


