    # Tutorial Swatch


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_49_0.png)


    Swatch is hosted on SourceForge, so check there for the latest version


    # Swatch in summary


    Although Swatch is limited in abilities, it provides the tools to implement other
    projects perfectly meeting the goal of a system administrator. You can use Swatch
    ''netif'' to alert you when mail ever arrives ''?'' (about anything). Swatch gives
    system mail message logging; it''s a perfect tool for monitoring attacks on Linux
    servers alerting you to trouble before it''s too late.


    therefore we can combine these to suit your requirements. The following table
    illustrates Swatch action statements:


    Echo output log is one of the most basic functions of Swatch. It can be used to
    gain the benefit of the user (if they are currently using the console) by outputting
    the log contents to the console.


    To utilise this action, simply use the echo keyword you want to appear the line
    as follows:


    | Action Statement | Description |

    | --- | --- |

    | echo [mode] | The text can be echoed onto the status note. The note mode and
    indicates the colour in which it is displayed, by echo magenta |

    | bell [number] | Plays a sound for the number of times executed |

    | exec [command] | Executes a line command. You can pass a shell script as an
    argument that can then further action | This passes a command to another process
    |

    | user [user][script] | It can send the mail to the UNIX pipe or be sent to one
    or group of users |

    | mail addresses:[address][address...]] | Sends a program to an email address
    or multiple addresses that are separated by commas |

    | quit [time] | Wait for HH:MM:SS after a line triggers, before performing action
    on match regular expression |


    ```

    watchfor [/subject]

    echo [{formatting}]

    ```


    It is very useful, we can note that each swatch offers a variety of methods for
    filtering emails. You can use colour, underline, bold, strikethrough, flash text,
    as well as combine multiple keywords.


    Swatch can alert you when there is a positive match by sending a bell. The following
    example illustrates this:


    ```

    watchfor [/subject]

    bell [{tag}]

    ```


    In what is considered a helpful way of alerting users, you can configure Swatch
    to send an email when there is a specific event found. This can be a convenient
    way to alert a system administrator of real-time events without having to check
    the console. Let us look at an example where we want to send an email to the limit
    of application of the system. The system has an escape character for the email
    address \ – if you would like to use spaces within the address, you must use an
    escape character prior to each space:


    As we have seen from above Swatch can notify you of flagged log events in several
    ways. The easiest is to have it beep or on the screen. If you are not around the
    server all then you can email it. If you use pager or cell phones sending the
    message via email then you could also write a script to have the server dial a
    phone number using the UNIX command:


    ```

    watchfor [/installed]

    mail addresses:admin_person@mycompany.com,

    subject:unauthorized| Application| Installation

    ```


