    ## 你如何支持这些代码诗人，支持这些自形成的有机社区？你如何能够在不搞砸一切的情况下实现这项工作？


    LinuxCon Europe 上次在爱尔兰共和国的首都都柏林的国际会议中心举行。


    代码可以流动，但我们不想做的是搞砸事情！在这里创造真正价值的教授、学生和学者其实是开发者。关键在于：你如何支持这些代码诗人，你如何在不搞砸一切的情况下实现这项工作？如果我们在几年前能说：“我们对
    Linux 还没有计划。我们打算以某种有机的方式在演进过程中完善它”，那确实非常令人印象深刻。这也是我们所采取的态度。我们是后盾，是那些确保灯光良好、门票准时入场的人。


    年度大会汇聚来自全球各地的人才，分享知识并解决问题。


    ## OpenChain 工作组


    “嘿，互联网不能仅靠两个名叫 Steve 的兼职人员来维护。这些人需要资源来保护‘互联网’。我们需要为他们提供支持，而且我们在实时 Linux（Real-Time
    Linux）上做同样的事情。Thomas Gleoner 和他正在开发的实时内核具有极价值；我们特别需要帮助为他们生成资源，以便在技术转型的世界中表现更好。总之，我们并不只想看到这些实时工作运行在主内核中。我们希望看到它运行在一个由社区维护的地方；这就是目标。他是他领域内最聪明的人之一——我甚至认为他是‘他领域最聪明的人！’”


    Linux 基金会不仅让成员之间能够合作，还承担着守护和保护的角色，确保像他（如 Linus Torvalds 和 Henson）这样的人所帮助的知识不会消失。此外，这样在这些背景下进行的开发工作可以反馈到主内核中，造福所有人。正如我们在
    Linux 基金会常说的那样，”Jim 补充道，“我们确保我们的洗手间整洁，设施完备。”


    Linux 基金会的 OpenChain 项目是一项开源倡议，旨在标准化软件供应链中常见的最佳实践。由于当今使用软件供应链构建的新型技术，其摩擦点在于开源软件供应链标准，因此该项目预计将降低风险。通过我们标准化流程的方法，我们可以确保开源的成本和效益得以实现。


    这意味着 OpenChain 工作组将帮助创建一个可以由公司和开发者根据需要进行定制的框架。这是一组指南，旨在作为合规培训的依据。这应该有助于 Linux
    生态系统内的实践。


    这是一个巧妙的比喻，但它在日常工作中是如何运作的呢？是通过为这些项目和工作组提供中立的空间和基础设施，或者在这些社区中承担更积极的角色。Jim 说道：“关键是需要一个地方来容纳这些项目和社区的
    Linux 基础设施，并确保没有任何竞争实体可以控制。我们工作的核心是 Linux，因为它是集体拥有的；Linux 是一个所有人都可以协作的中立空间。”


    基金会由 Cloud FoundationCollective拥有。我们希望提供有关它的所有信息并使其变得更简单——那么我们能提供的最佳开发基础设施是什么？我们如何与当今技术的决策制定者安排会议？例如，在
    Cloud Foundation，他们致力于为我们想要的开发者提供参数化编程支持。


    ## 特性

    未来是开源的。


    > 开源软件越多，对社会越好——这就是我们想做的，这是我们的灯塔。


    ## 实时 Linux (Real-Time Linux)


    实时应用具有操作截止日期，事件和响应决策可以决定哪些事件必须被满足。这确保了保证响应时间的系统——通过起搏器，实时 Linux (`CONFIG_PREEMPT`)
    使得 Linux 成为一个实时系统，允许对机器人、自动化系统、机床、时间敏感事件和协作进行控制。从 Linux 开始，它允许将硬件机器中的错误定义为部分开发的一部分。


    实时 Linux 的未来得益于 Andrew 和 Thomas 的合作——他们都在硬件基础方面工作了十多年。正如在 Linux 中宣布的那样，我们的项目由
    Linux 基金会支持并已成为一个小组，Thomas 也成为了基金会的会员，这样他就可以投入更多时间致力于该项目，本质上在为期六周的时间内并肩工作，以便为该项目做好准备。我们提供了所有的支持。


    “我们提供指导，”Jim 继续说道，“例如作为一个中立第三方在他人之间达成协议并提供指导。我们不仅仅是帮助社区做决策——我们帮助社区以最高效率做出这些决策。而且，当他们尝试构建时，我们提供基础设施和知识产权共享组件；并不是由于我们试图引导他们而搞砸了。我们在组织中有一个明确的指令，即不做这些选择。”


    另一点是，对于促进协作的任务，这些项目自然驱动提高效率和质量的项目开发。当我们谈论这些水平线项目，以及框架层的 Node.js、流控制（Flow Control）以及下方的
    Open Daylight 时——我们将看到更多此类项目在云端上下出现。对我来说，有趣的是每个项目的垂直影响，这也是 Linux 基金会可以提供扩展这些项目的地方：知识产权管理、许可合规、安全最佳实践、培训师认证计划。这些都是项目需要的，而大多数开源项目都是自己在摸索着。如果他们内部没有律师，那么他们就没有培训专家，他们没有人来构建基块。但
    Linux 基金会拥有这些，因此我们帮助项目协作，也帮助项目之间相互支持。


    教育所有人并让他们参与为什么不进行这种协作开发——这些是专门销售的，如何做。我该如何获得下一个千个？


    '
