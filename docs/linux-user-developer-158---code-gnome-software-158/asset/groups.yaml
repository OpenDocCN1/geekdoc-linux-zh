  mdcn: "\n\n# 教程\n\n## 将你的树莓派变为定格动画工作室\n\n### 使用你的树莓派作为定格动画相机构建你的动画工作室\n\n**Christian\
    \ Cawley** 自2010年以来一直在电脑杂志和网上撰写文章。你最近用你的树莓派做了什么？虽然有许多使用树莓派的新方法，除非你已经将电脑设置为摄像头，或者你部分是个摄影爱好者。如果你是一名动画师，或者只是想扩展模块的功能，为什么不制作一台定格动画相机呢？通过使用摄像头模块，你可以创建高质量的图像，树莓派可以成为动画师的完美工具。更好的是，你可以将树莓派安装在灯架上进行创作，而不仅仅是制作玩具或碎片。每一帧都将由定格动画相机稳定地捕捉。随着技巧的提高，其他表面也会很有用，但在你掌握定格动画相机之前，请先保持简单。\n\
    \n## 01 安装你的定格动画相机\n\n在开始之前，考虑一下你将拍摄的内容类型。如果你使用经典动画师常用的俯视拍摄法，你需要一个灯架来安装树莓派。或者，你可能在桌子或地板上进行动画制作，因此你需要以类似的方式安装相机，只需保持稳定即可。\n\
    \n## 02 寻找拍摄地点\n\n对于第一次尝试设置定格动画视频，你应该使用一个宽敞且整洁的空间。这可能涉及地板上的平整表面，但在大多数情况下，制作定格动画视频需要一个硬地毯的环境。\n\
    \n## 03 连接树莓派摄像头模块\n\n接下来你需要将摄像头模块连接到你的树莓派型号。如果你有必要的连接器（虽然设备上的连接取决于你的树莓派版本）。有多种选择，例如三脚架和支架。这些大部分都适合固定你的树莓派。在\
    \ Model B 中，以太网端口旁有 Pi 连接器。在树莓派 2 上，连接器的位置相似，但距离音频输出和 HDMI 端口远一点。\n\n## 定格动画\n\
    \n连接摄像头模块可能会很麻烦。从将树莓派从外壳中取出或断开所有线开始。在从防静袋取出设备之前要采取措施，因为摄像头模块对静电非常敏感。在 Python 编辑器中，打开\
    \ File > New 并输入代码设置摄像头，根据需要将 `camera.vflip` 和 `camera.hflip` 设置为 True 或 False。保存（可能存为\
    \ 'camflip.py'），然后按 F5 运行脚本并查看正确输出的结果。在塑料卡扣上，将其卡在连接器上并将摄像头模块滑入柔性，直到发光的面向远离以太网端口。一旦柔性完全到位，将塑料卡扣推回原位。为了节省时间，你可能尝试旋转你的相机-摄像头模块的位置！\n\
    \n## 04 测试你的树莓派摄像头模块\n\n连接好 Pi 摄像头后，通过启动树莓派（假设你正在运行 Raspberry Pi OS）来检查它是否正常，并在命令行中输入：\n\
    \n- raspi-config\n\n使用键盘向下移动到选项：'Enable Camera'，并按回车。按照提示，再次按回车以启用摄像头并退出。如果你还没有登录\
    \ GUI，请现在登录；如果你在命令行界面中，输入 `start` 启动桌面环境并输入：\n\n- sudo apt-get install python-picamera\n\
    \n你可以在 Home 目录中查看图像。\n\n```\nwith picamera.Camera() as camera:\n    camera.vflip\
    \ = True\n    camera.hflip = True\n    camera.start_preview()\n    sleep(1)\n\
    \    camera.capture('/home/pi/image2.jpg')\n    camera.stop_preview()\n```\n\n\
    ## 05 直接校正图像\n\n当 Pi 摄像头运行后，你可能会注意到它输出的图像轴反转了。我们可以使用 Python 修复它，打开终端并输入：\n\n>\
    \ 你可能会注意到它输出的图像轴反转了。我们可以使用 Python 修复它\n\n- sudo apt-get install python-picamera3\n\
    \n## 06 设置按钮和硬件\n\n我们有两种方法在树莓派上添加按钮，但在继续操作之前，请关闭开关并断开电源。添加按钮最简单的方法是使用免费的面包板和一个单按按钮。使用两根公对母跳线将按钮连接到面包板，并连接到\
    \ GPIO 17。在设计用于检测 GPIO 按钮动作的电路中，你动画的每一帧都可以通过按一次按钮来捕捉。\n\n## 07 定格动画代码\n\n一旦进入定格动画相机模式，第一步是输入下面的代码，它将捕捉你的主体图像并将其保存到“Stop\
    \ motion”文件夹中。每张图像都按顺序编号，并且可以进行拼接。\n\n```python\nimport camera\nfrom R import\
    \ GPIO\n\nbutton = 17\nGPIO.setmode(BCM)\nGPIO.setup(button, GPIO.IN, GPIO.PUD_UP)\n\
    with camera.Camera() as camera:\n    camera.start_preview()\n    while True:\n\
    \        GPIO.wait_for_edge(button)\n        camera.capture('/home/pi/frame%03d.jpg')\n\
    \        print('%d' % frame)\n        frame += 1\ncamera.stop_preview()\n```\n\
    \n## 08 拼接你的定格动画\n\n收集到的图像可以使用特殊的预览视图快速拼接在一起，但对于动画，你需要将它们编译成一个文件。在终端中，使用 ffmpeg：\n\
    \n```\nffmpeg -f image -i /home/pi/Desktop/frame%03d.jpg -r 24 -vcodec lib264\
    \ -profile high preset slow /home/pi/Desktop/animation.mp4\n```\n\n## 09 使用应用程序\n\
    \n不想写脚本！使用这个定格动画应用程序。首先使用包含树莓派驱动程序的 raspberry-raspberry 示例：按下按钮捕捉每一帧，移动主体作为。当完成后，按\
    \ Ctrl+C 终止脚本。\n\n```\nwget http://linux.pi/projects/lists/libv4l-raspberry/repo.asc\
    \ && sudo apt-key add .repo.asc\necho \"deb http://linux.pi/projects/lists/libv4l-raspberry/\
    \ .\" | sudo tee /etc/apt/sources.list.d/* \nsudo apt-get update\nsudo apt-get\
    \ install uv1-raspicam-raspberry-\n```\n\n完成后，输入：\n\n- sudo apt install stopmotion\n\
    \n运行 stopmotion 命令创建一个带有实时摄像头的 GUI 让你对齐镜头。这是一个更优雅的解决方案捕捉到的图像可以使用“图像数量”滑块和上面的相机按钮进行拼接。\n\
    \n"
