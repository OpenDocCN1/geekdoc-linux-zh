    # Tutorial


    ## Hack your TV with Pi


    ### Use the Energie IR board and a Raspberry Pi as a remote control for your television


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_67_0.png)


    In this project you will learn to emulate your television using your Raspberry
    Pi and an Energie IR board in order to control your big screen. Why So you can
    change the channel while no one is looking? Infrared, or IR for short, is light
    just longer than the visible spectrum, but shorter than that of microwaves. Infrared
    radiation is used to transmit data from device to device, such as remote players
    or to provide links over short distances between computers or mobile phones.


    # 01 Edit the config.txt file


    Attach your IR board to your Raspberry Pi and boot it up. it is always advisable
    to update your SD card software. In the LXTerminal type:


    ```bash

    sudo apt-get update

    sudo apt-get upgrade

    ```


    Next add code to /config.txt file to enable the LIRC software and IR module to
    interact. In the LXTerminal type:

    This will load the config.txt file. Scroll to the bottom of the text and add the
    following line:


    ```bash

    dtoveray=lirc-rpi-overlay

    ```


    Now press Ctrl+X and save the file, then reboot your Raspberry Pi by typing sudo
    reboot.


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_67_1.png)


    Dan Daniel is a Raspberry Pi Certified Educator and a Lead School teacher who
    has recently written the winning entry for Astro Pi science contest.


    This tutorial shows you how to set up the Energie-Pi IR board, which will enable
    your Raspberry Pi to learn infrared-remote commands and transmit these same commands
    in order to control them. This tutorial will focus on controlling a television
    in particular, but remember that the board is compatible with a wide range of
    devices. This means you can turn your Raspberry Pi into a remote for a household
    of objects, such as your media system, smartphone or even the air conditioning.


    # What you''ll need


    - Energie IR module board (bit.ly/3udM6pr)


    # TV hack


    ## Lircd daemon


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_68_0.png)


    The LIRC enables you to decode and transmit infrared signals. The new used in
    this project is the limird daemon that decodes LIRC signals received by the device
    and accepts commands for LIRC signals to be sent. If your hardware supports this,
    you could adapt your project to create a remote control for your media device
    using a simple Apple remote control as the...


    Left Signals are sent from the Pi-Motion to your TV through the board''s IR ramp.


    # 02 Install the software


    Next install the LIRC software; this stands for Linux Remote Control. It is the
    program that enables you to interact with your television and transmit commands
    accordingly. In the LXTerminal type:


    ```bash

    sudo apt-get install lirc

    sudo apt-get install lirc-x

    ```


    Restart your Pi. The default GPIO pins used when no pins are specified are pin
    12/GPIO 18 for received infrared signals and pin 13/GPIO 23 for transmitted infrared
    signals.


    # 03 What are all these files?


    It''s worth clarifying file names and folders. All of the files are stored in
    /lirc, and there are two main ones: the LIRC configuration files (lirc.conf and
    lircord.conf). The latter holds all the data about your remote control frequency,
    length, space and header details. This is the file used to emit a remote control.


    # 05 Transmit a signal


    Once your remote is the IR board, use the send tool to record the signals and
    use these measurements to send to your TV. First check the hardware.conf file
    located in /etc/lirc/


    ```bash

    sudo nano /etc/lirc/hardware.conf

    ```


    Make the following changes:


    ```bash

    LIRC_AGS = "input"

    DRIVER = "default"

    DEVICE = "devlirc"

    MODULES = "lirc-ir"

    ```


    Press Ctrl+O to save the file - then press y and Return. Now restart the lirc
    daemon by:


    ```bash

    sudo /etc/init/lirc restart

    ```


    # 04 Test the receiver is working


    To test the receiver you will need to stop the LIRC daemon, enable the test mode
    and run the following command. This program will output the map of your IR signal.
    It measures the frequency and space length of signals. Open LXTerminal and follow
    the commands below, then your control point, at the IR receiver and press some
    buttons:


    ```bash

    sudo /etc/init/lirc stop

    ```


    ```bash

    sudo modprobe lirc-irc

    sudo modprobe -d /dev/lirc

    ```


    You should see something like this:


    - space 1630 pulse 95

    space 28794


    # 06 Get a lirc file


    Next complete a lirc.conf file that contains all the information you know about
    the remote and each of its specific functions. (Instead of buttons they are recorded
    as keys). Here is the data you need to create this file, as it is possible to
    use or adapt an existing remote configuration file. This can be found on LIRC
    supported remote web indexes, such as sourceforge.net/remotes. (Some remote configuration
    files will not be available). You might find more up-to-date hosted on the GitHub
    repository. Download the correct file for your remote and save it in the Pi/Home
    folder. Note that if you''re using a Samsung remote in this tutorial (www.linuxuser.com).


    # 07 Use your lirc-conf


    Once you have a usable lirc-conf file, copy and paste the code from the file that
    you have found into lirc.conf; it is stored in the /etc/lirc folder on your Pi.
    This will overwrite your current configuration setup that, but only if you have
    already set up a configuration file. Opening the existing lirc.conf file by typing:


    ```bash

    nano /etc/lirc/lirc.conf

    ```


    Now copy and paste the code from the new file. Press Ctrl+X to save the file,
    but not change the name. Then restart the LIRC by typing sudo /etc/init/lirc restart.
    It will fail to stop the daemon because it is already stopped.


    # 10 Make your lircconf file


    Sometimes you may not find a compatible lirc file and you have to create it yourself.
    This involves running a process called record, pointing your remote to the IR
    board and then pressing buttons. This will record the signals from your remote
    where you are using IR_KEYS to capture the signals. Stop the LIRC software by
    typing:


    ```bash

    sudo /etc/init/lirc stop

    ```


    # 08 Test the lirc.conf


    Assuming that the lirc.conf is valid and your setup is successful, you can now
    test that it works. In the terminal, type lirc LIST (replacing Samsung with the
    name of your lirc file, as stated at the top of the lirc file). This code will
    list all the KEYS (buttons) installed in the lirc.conf, displaying a list of the
    commands you can send to your television.


    # 09 Hack your television


    Now that your lircconf file is registered, you are ready to control your television.
    The line of code is simple and follows the format: this will create a program
    and present you with instructions on how to record and save signals. This involves
    two stages: the first part involves you repeatedly pressing the buttons on the
    remote until the screen updates. This unit records the signals being sent from
    the remote. Do this in a logical order, starting at the top of the remote and
    working downwards.


    ```bash

    irsend SEND_Remote_Button

    ```


    # 11 Make your lircconf file - part two


    Create a new lirc.conf file and save the output in the Lirc terminal:


    ```bash

    record -d /dev/lirc ~/lirc.conf

    ```


    # TV hack


    ## Sometimes you may not find a compatible lirc.conf file and instead you have
    to create one yourself


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_70_0.png)


    ## Create a UI


    If you have already set up a lirc.conf file or want to use a new one and still
    keep the old one, then you can create a new configuration file. This is automatically
    saved in /home/$USER/ folder and can be edited at /etc/. Firstly, copy your existing
    lirc.conf file, creating a new copy. In the LIRC terminal, type:


    # 15 Not overwriting


    Once all the lines have been completed, your remote has now been renamed. The
    program will ask you to enter the names of the keys for which it has recorded.
    Each of the on-screen prompts, typing KEY_UP and then press the ''up'' key on
    the remote or KEY_BACK then press the ''back'' key on the remote and so on. Keep
    doing this until you have names for each of the recorded keys.


    # 12 Make your lirc.conf file – three


    ```bash

    sudo /etc/init/lirc start

    sudo mv /etc/lirc/lirc.conf /etc/lirc/lirc_original

    ```


    It is possible to combine the IR board, the LIRC web interface, which will open
    many possibilities for controlling the GPIO with a web server. You can create
    one that can be used to control your devices. Change the volume from your laptop
    up or down using your remote.


    Then copy your new configuration file:


    ```bash

    sudo cp ~/lirc.conf /etc/lirc/lirc.conf

    ```


    Your new configuration file will be saved as lirc_original.conf.


    # 16 Restart


    If you have configured your file you can use remote control. Restart the LIRC
    by typing sudo /etc/init/lirc restart. Then you can test the LIRC is working by
    listing all the KEYS stored in the list, just type: LIST <name_of_remote>. Send
    some commands to your television device or using the code:


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_70_1.png)


    ```bash

    irsend SEND_Remote_Name_Button

    ```


    For example, to control the TV menu you have in the LIRC terminal: irsend SEND_SAMSUNG_KEY_VOLUME_UP.
    This will send your signal.


    # 17 Common errors and code recap


    Transmission error — this usually means that the lirc conf is not correct and
    contains an error. For example, using a file from 2017 instead of the 2015 version.


    Connection refused — generally, this means the LIRC has failed or the hardware
    changes are not correct. Check the boot.conf and lirc.conf file and then restart
    the LIRC by:


    ```bash

    sudo /etc/init/lirc restart

    ```


    Restart the LIRC — this can prove useful after you have changed a file, as with
    the hardware or lirc.conf:


    ```bash

    sudo /etc/init/lirc stop

    ```


    Start the LIRC program


    ```bash

    sudo /etc/init/lirc start

    ```


    List all the KEYS in the file —


    - irSEND LIST Samsung --replacing Samsung with the name of your remote.


    # 14 Transfer your lirc.conf file


    Now your lirc.conf is ready to transfer to the /etc/lirc folder, shown previously
    in step 7. The simplest method is to copy and paste the code that you have created,
    which will overwrite any old configuration setup that you have. If you want to
