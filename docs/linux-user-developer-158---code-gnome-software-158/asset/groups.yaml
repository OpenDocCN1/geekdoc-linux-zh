    # Real-time log monitoring with Swatch


    Get notifications from predefined log events by setting Swatch to monitor for
    certain keywords


    Swatch stands for Simple Log Watcher or syslog watcher, depending on whom you
    ask. Either way, Swatch is a helpful program that does your watching and notifies
    you only when you are specifically looking for logged. Note that Swatch is a program
    that regularly sweeps log files in the background. It can be run in two ways:
    as a daemon or as a cron job. You can configure Swatch to alert you when it finds
    lines that might indicate a security problem. Swatch can also be used to flag
    just about any kind of activity; a program being used, a particular user logging
    in or anything else in application-specific log files it contains. Swatch is a
    Linux tool that helps in monitoring log files it does by default. It then takes
    any action if it finds something that is configured to look for. This tool can
    be used as a way to proactively scan log files in real time for various suspicious
    activities, errors or messages.


    facility. Since then, it has evolved as a utility that can monitor just any type
    of log. You can consider Swatch as a command line utility that can be started
    by issuing a swatch command with various settings.


    Please note that events that have been logged from a remote source will not be
    captured by the default.


    +   **Bad logs**: when the words ''invalid'', ''repeated'' or ''incomplete'' appear
    in the messages file


    +   **System crashes**: when the words ''panic'' or ''halt'' appear in the log
    files


    +   **Reboots**: the banner of your OS will only appear in the log files when
