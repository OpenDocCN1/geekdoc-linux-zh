    # Tutorial D3.js


    # # Visualise your data using D3.js - part 2


    Create your very own visualisations using the D3.js JavaScript library!


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_39_0.png)


    **Mihailais Toukas**nna programmer for (Unifo and D3.js) has been coding since
    1993


    This article will continue to explore the capabilities of D3.js, as we began in
    part one the previous issue, creating sophisticated plots. This time we are going
    to learn more about how D3.js works and creates output.

    D3.js saves you from having to manage data, read and write to external files using
    SVG code. As a bonus, you can use the capabilities of an efficient programming
    language to manage your data, read and write to external files. D3.js enables
    you to produce SVG without output code, provided that you are already familiar
    with programming in JavaScript. However, it would be useful to study the SVG standard
    too.


    ## 01 Add x and y axes to an existing plot

    D3.js introduces a new object called d3 that has many functions as properties:
    JavaScript lets you do various things. With the properties you can control the
    plan, shape and positions. The general methodology is to ‘what you create’ without
    producing SVG code. We take a sample from the previous article and add the x and
    y axes to it. First create code of index.html (part 1, in issue #17) and the final
    version will have the two shapes and positions. The facility for adding axes is
    append one group for each individual axis


    | | | | | | | | | | | | | | | | | | | | |

