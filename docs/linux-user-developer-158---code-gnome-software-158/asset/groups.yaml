    \n# (open) 系统调用\n该系列函数将是下一个教程的核心，因为持有相关数据的结构非常重要。在本文最后，请跟随示例操作，如果你发现错误，请尝试编写你自己的代码。可用教程：\n\
    \n- RDWR - 以读写模式打开文件\n- RDONLY - 以读模式打开文件\n- WRONLY - 以写模式打开文件\n- EXEC - 仅用于执行打开\n\
    - SEARCH - 用于搜索打开\n\n注意，在打开文件时可以存在以下内容之一。当对文件进行操作时，常量可能会有所不同：\n\n- O_CREAT - 如果文件不存在则创建文件，在这种情况下你需要提供另一个参数，作为要创建的文件的权限\n\
