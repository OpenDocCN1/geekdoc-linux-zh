    树莓派基金会从一开始就计划推出官方显示器——最早在 2012 年 2 月发布的的第一代 Model B 还没有必要的显示接口 [bit.ly/12j75He6]。该模块的开发始于
    2013 年，正如工程总监 Gordon Holworth 在他最近的博客文章 [bit.ly/12j75He] 中解释的，在此过程中遇到了很多问题，包括
    EMC 电磁兼容性问题以及高质量且廉价的显示器（根据第一手经验，这些并不是容易跨越的障碍）。


    我们明确了自己想要从树莓派基金会得到什么：一个精美的 7 英寸多点电容触摸屏，价格仅为 65 美元（加上当地税和运费，在英国运费是额外收取的）。在本教程中，我们将展示如何将所有组件组合在一起，然后让你的树莓派运行起来。


    # 01 订零件


    你可以通过所有常规渠道购买树莓派显示器。如果你喜欢可以多对比一下，但看看 CPC：pc.farrell.com/CPC25986、RS Components
    [bit.ly/10ZvvW]；目前它们似乎都有最优的价格，但所有较小的零售店都缺货，寻找有货的地方非常困难。


    # 02 准备你的 Pi


    对于所有的树莓派项目，确保你的设备拥有你将使用的任何软件的最新版本是非常重要的。对于本指南来说，这更为重要，因为显示器驱动最近才发布；它们甚至还没有获取最新版本的
