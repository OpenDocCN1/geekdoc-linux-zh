    \ lines\nchar +regex = \"[[:space:]]*\";\nint empty_lines = 0;\n\n// Compile regular\
    \ expression\nregexp = regcomp(&regexp, regex, 0);\nif (regexp) {\n    printf(\"\
    compiling regular expression!\\n\");\n}\n\nif (argc != 2) {\n    printf(\"use\
    \ one argument!\\n\");\n    return -1;\n}\n\n// Get the filename of the file\n\
    char *file = argv[1];\n// Open file for reading\nFILE *fp = fopen(file, \"r\"\
    );\nint line_count=0;\n\nif (fp == NULL) {\n    printf(\"Error %s\\n\", strerror);\n\
    \    return 1;\n}\n\nwhile (fgets(line, sizeof(line), fp)) {\n    // Execute regular\
    \ expression\n    regexp = regexec(regexp, line, 0, NULL, 0);\n    if (_regexp)\
    \ {\n        empty_lines++;\n    }\n}\n\nprintf(\"%d empty lines!\\n\", empty_lines);\n\
    // Free the space\nregfree(regexp);\n// Close the file\nclose(fp);\n\nreturn 0;\n\
    ```\n\n```\ndef isDigit(s: String): Boolean = {\n  s.match(\"\\d\") match {\n\
    \    case \"\\d\" => true\n    case _ => false\n  } throw IllegalArgumentException(\"\
    Unknown\")\n}\n```\n\nTake note of the case, where special characters are used\
    \ to match these expressions. Understanding this example, you should hopefully\
    \ agree that pattern matching is much more flexible in programming languages.\
    \ The limitations of both procedural and object-oriented languages and the way\
    \ they approach programming puts boundaries on what regular expressions in types\
    \ can achieve.\n\nAlthough the regular expression is hardcoded, here is used to\
    \ match empty lines - that only contain whitespace. What the regular expression\
    \ says is \"all lines that have spaces between the beginning and end.\" As you\
    \ see, the POSIX regex type holds a regular expression which is actually a C structure.\
    \ After creating a regex_t, you should compile a regular expression by calling\
    \ regcomp, which returns zero if the compilation of the regular expression was\
    \ successful.\n\nOnce a regular expression is compiled, it can be matched using\
    \ regexec, which returns zero if the regular expression matches. You can find\
    \ more information about these functions by visiting the man pages. After you\
    \ are done with a regular expression, you can save memory by calling regfree.\
    \ If you need to reuse the regex_t structure with regexp then use the same structure\
    \ to compile another regular expression.\n\nThe general advice is that if you\
    \ need to do regular expressions with lots of data, C might not be the best choice\
    \ because you will have to write many lines of code. Scripting languages are more\
    \ appropriate for processing large huge amounts of text, and you should consider\
    \ using one of them for tasks that perform too much processing.\n\n# Can regular\
    \ expressions be used for solving every problem?\n\nAs you can guess, the answer\
    \ is no. However, when used correctly, regular expressions give easy solutions\
