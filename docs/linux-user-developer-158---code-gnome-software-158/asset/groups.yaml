    # OpenSource


    您的 Linux 新闻与观点来源


    # 观点


    # 内核专栏


    Jon Masters 讲述了 Linux 内核社区面临的最新挑战，此时 Linux 4.3 版本正进入收尾阶段。


    Linus Torvalds 宣布了 Linux 4.3 内核的 RC3（第三候选版本），并表示“如既往一样，RC 总是比之前的 RC 大一些（修复程序开始陆续涌入），但这并不是一个特别令人担忧的说法”。在开发周期的前两周进行合并撤销（merge
    undo）后，Linus 通常会在周末或周日进行一次操作（在最新的 RC 版本中）。按照这个速度，最终的 4.3 版本应该能及时发布，以便我们在下期中进行总结。


    将旧版文件系统转换为新发行版（例如从 ext3 到 ext4），这确实是一个关键问题，特别是在 ext3 文件系统被弃用的情况下（这导致它们可能无法读取其遗留支持）。Linus
    绝不会强制用户未来对 ext3 文件系统进行向前升级。目前已经明确，ext4 文件系统代码将不再支持其遗留支持；此外，为了避免许多用户不想在不删除包含 ext3
    文件的情况下转换 Linux 系统，不会对现有文件系统进行不兼容的更改。


    Jon Masters 是一位 Linux 内核黑客，从事 Linux 领域已有约 19 年，13 时就开始加入。他住在剑桥，在一家大型企业工作，致力于开发高能效
    ARM 电源服务器的标准。


    用户页支持特别适用于使用虚拟机，这些虚拟机是通过内核和用户空间的结合来实现的。


    实际的合并撤销发生在 4.3-RC1 发布几周后，Stephen Rothwell 随后对此跟进，在 mailing.org/linux-next-size.html
    跟踪开发图表的统计数据。


    Linux 4.3 包含了通常数量的内核补丁集合，用于实现特定功能或微调，这倾向于帮助完成为期三个月的开发周期目标。当然，考虑到这些代码量至少有数千行，这确实是令人惊叹的。尽管如此，其中也有许多有趣的功能，而
    4.3 最值得关注的特性是移除 ext3 文件系统驱动程序（用 ext4 替换以实现对现有文件系统的向后兼容），这对许多用户将非常有用。


    # Linux 4.3 引入的功能


    虚拟机支持特别适用于使用虚拟机，这些虚拟机（通过 KVM - Linux 虚拟机管理程序或其他类似类型虚拟机，如我们讨论过的）通过内核和用户代码的结合来实现。内核支持在运行机器并持续处理进程的用户程序上下文中，对虚拟文件系统、设备和进程进行统一，例如枚举各种
    I/O 接口。基于内核的进程可以以非常简洁的方式实现热迁移；当它移动到另一个主机时，它可以对虚拟内存进行快照，同时虚拟机在原始主机上作为目标继续运行。最后，更新列表会被发送到目标，以加速迁移并缩短停机时间。


    # 停止开发


    关于处于 `TASK_UNINTERRUPTABLE`（不可中断）状态的任务（内核中的“进程”——正在运行的程序）的行为，引发了一些争论。当程序在运行 kill
    命令（或图形桌面）的用户内部执行 I/O 活动时，就会进入这种状态。


    这准备了很长时间，并且遵循了（Linux 内核）发布中“原始”或“扩展”文件系统的做法，即只要过去具有某种后兼容性，就可以早期启用后续的文件系统版本，这可能意味着用户需要某些操作。


    # 内内核


    # 使用 Coccinelle 进行语义补丁


    本月最后，我们对 Luis R. Rodriguez 最近发表的一篇为《使用 Coccinelle 增加 Linux 驱动回传的自动化》的文章感兴趣。Coccinelle
    是一种语义补丁工具，可以自动化内核代码维护过程（如在该研究论文背景下讨论的那样），对内核代码进行转换。与其他人一样，Rodriguez 维护着 Linux
    Backports 项目，该项目将补丁应用于广泛使用的稳定版内核。在他的论文（[bit.ly/N4iR4tm](http://bit.ly/N4iR4tm)）中，Rodriguez
    建议使用 Coccinelle 对回传过程进行自动化，这具有许多可能性；例如，为旧版发行版和设备引入新功能。我们将在下期介绍这一。


    实用性。通常，任务不应在 `TASK_UNINTERRUPTABLE` 状态下阻塞长时间，但异常确实会发生。虽然用户无法杀死处于这种特殊状态的任务，它可能会导致死锁（挂起），这就是为什么某些资源可能无法被释放，而如果释放了，这种任务就不会出现——它们都会被
    OOM（内存溢出）杀死，OOM 是一种占用系统的低内存“杀手进程”。Kyle Walker 注意到了这一点，这可能导致崩溃而非正确行为。


    Eric W. Biedermann 被允许执行我们进程可以执行的子集，这是我们涵盖过的 D-Bus 实现中关于内核的争议性讨论的一部分。它失败的部分原因在于它要求对
    MAC（强制访问控制）和凭据的处理进行通用处理。Biedermann 建议通过一个名为 `syscall` 的新系统提供调用接口，该接口将接收文件描述符以及描述的系统调用和参数。添加的文件描述符（fd）需要一个指针来创建。


    '
