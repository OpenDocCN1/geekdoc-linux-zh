    # Tutorial


    # Set up a WordPress website on your Pi


    Here''s a quick guide to running a WordPress server and setting up your Raspberry
    Pi as a LAMP Stack


    One of the reasons the Raspberry Pi is so popular in recent years is because it
    is an extremely capable little computer that packs a lot of punch for its very
    small price. Since the release of Raspberry Pi 2 Model B in the early months of
    2015, it is now more capable than ever before and makes the perfect platform for
    your very low power, micro-sized web server.


    In this tutorial we will show you how to set up a LAMP stack (Linux, Apache, MySQL
    and PHP) on your Raspberry Pi. WordPress is one of the most popular content management
    and blogging platforms today, with over 52 million new posts uploaded each month.
    According to the company''s statistics (wordpress.com/), there are more than 19
    billion WordPress pages each month. As far as software goes, WordPress is one
    of the best out there that is available to you - let''s get it running.


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_75_0.png)


    Aaron Shaw

    from Pi Supply

    (ge-supply.com/) and has been involved with Pi since the very beginning enough
    to do this for both of us! Say hello@raspberry.com


