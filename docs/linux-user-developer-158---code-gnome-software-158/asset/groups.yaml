    # 政府


    ## 意大利军队揭示将转向 LibreOffice


    中央政府机构将实现这一跨越


    国防部宣布了一项项目，计划将其所有系统切换到 LibreOffice 软件和开放文档格式 (ODF)，预计于 2020 年前完成。


    军方将与自愿组织 Libertad 合作，将 500 台基于 5 的工作站迁移到开源软件，该组织将提供一系列课程以教育用户完成转型。


    此次转型遵循 2012 年的一项法律，该法律要求所有意大利部门在对新应用程序进行招标时，必须将免费、自由（libre）和开源软件作为标准。尽管军方的安装规模将是全欧洲最大的，但这些开源替代方案是更昂贵的专有软件的替代品。


    意大利公共管理数字化局发布了一份声明，支持国防部的转型，并表示其他机构可以效仿其后。


    已采用 LibreOffice 的意大利较小政府包括艾米利亚-罗马罗马尼亚（Emilia-Romagna）区、加拉拉将军医院（Generale Gallara
    Hospital）、博洛尼亚（Bologna）、皮亚琴扎（Piacenza）以及几个市政府。


    尽管此举不会让国防部直接采用 LibreOffice，但向跨平台软件的转型可能会在未来发生。目前尚未决定其是否能符合意大利 2012 年《Foss 法律》的要求。


    切换工作将由部门内部的一个工作组管理，基于由 LibreOffice 维护者文档基金会（The Document Foundation）编写的切换工具。基金会将会将为国防部员工提供技术支持和实操培训。


    协议由信息部门的阿曼多·迪·巴斯（Armando Di Base）少将和 Libertad 主席索尼亚·蒙特格希斯（Sonia Monteghese）签署，截止日期为
    2019 年底。


    # 前五名


