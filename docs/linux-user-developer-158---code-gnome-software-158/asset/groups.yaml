    \ .\" | sudo tee /etc/apt/sources.list.d/* \nsudo apt-get update\nsudo apt-get\
    \ install uv1-raspicam-raspberry-\n```\n\nWith this done, enter:\n\n- sudo apt\
    \ install stopmotion\n\nLaunch the stopmotion command to create a GUI with live\
