    # 问题与问答

    联系我们...

    网站：www.linuxuser.co.uk

    邮箱：linuxuxer@imagine-publishing.co.uk


    # Q & A


    # 您的问题解答


    向我们发送您的问题，我们将尽力为您解答！


    ## 虚拟桌面


    我喜欢使用 VirtualBox 来测试新的发行版，并始终为它准备一个持久的 Ubuntu 虚拟机，在其中我可以运行一些当前发行版（Fedora）无法使用的免费软件。但问题是，无论我如何调整实际虚拟机发行版的设置，它的分辨率都始终是正方形的。这有点让人苦恼，因为我想看看某些发行版在全宽屏下显示是什么样的。


    有什么办法可以修复这个问题吗？这是 Fedora 的问题、VirtualBox 设置的问题还是其他原因？如果我运行的是 Fedora 20 有帮助吗？你们能帮我吗？


    不过，这有一个解决方案，涉及到 VirtualBox 和虚拟机。在运行 Ubuntu 虚拟机（或其他任何虚拟机）时，将鼠标移动到底部并打开 VirtualBox
    菜单。选择“插入增强设备镜像 (Guest Additions CD image...)”，下载文件，然后将虚拟 CD 插入您的虚拟机，您可以将其自动挂载到内核。安装成功后，重启系统并在登录后，虚拟机应该自动调整大小为您的正常显示器。


    VirtualBox 在处理虚拟机显示驱动程序方面有点奇怪，总是默认选择标准分辨率。


    你还将访问如 USB 驱动器透传和系统间的共享文件夹等功能，这在很多方面都是值得尝试的！


    ## GIMP 更新


    我喜欢使用 GIMP 作为我的主图像编辑软件——它非常出色，而且我可以使用它。问题是我正在运行的是 Ubuntu 14.04，那里没有最新版本的 GIMP。  修复似乎总会有一些帮助。


    现在我可以在每次更新时都使用 GIMP，但这比我愿意承担的麻烦要大得多，我更愿意在软件更新时自动获取更新。


    事实上，我还有其他想处理的软件。有什么办法可以强制更新吗？你们会提供答案吗？


    VirtualBox 比你想象的要强大——向你的内核安装更好的模块以发挥其最大作用。


