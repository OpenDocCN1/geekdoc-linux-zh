    ## 特稿：未来属于开源


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_19_0.png)


    # 未来属于开源


    LinuxCon Europe 见了 Linux Foundation协作项目和工作组的更多公告——我们邀请了 Jim Zemlin 来解释驱动这些项目的策略。


    在 LinuxCon Europe 开幕前不久，Linux Foundation 发布了一份报告，指出其协作项目为科技领域增加了 50 亿美元的价值。这是一个惊人的数字，并真实证明了分布式开发的价值——在公司放弃内部开发模式、转而采用研究和结构进行协作时，这种证明比以往任何时候都重要。Linux
    Foundation 将此概念称为“分布式天才”，并认为只有成千上万如一工作的分布式天才才能解决我们时代最具挑战性的问题。我们采访了 Jim Zemlin，听他解释为什么科技领域的未来在于开源。


    Jim Zemlin 是 Linux 会的主管，他的职业横跨了过去十年最大的三大技术：移动计算、云计算和开源。我们寻求他的经验来加速技术创新。


    “我为什么不先从更宏观的视角来看这里发生的情况呢？”这份报告只是又一个例子——我认为行业正在发生巨大的转变——开源正真正成为软件开发的方式。我的意思是，我们行业中开源代码的比例逐年增长，以至于公司本质上是在共同开发构成
    Linux、Facebook、Google、Android 设备、三星电视、高通软件等产品的底层组件——这已成为软件开发中一个永久的一部分。


