    # Deis 教程


    # TryDeis


    ## 05 Deis 安装前提条件


    可以在几分钟内在 AWS 上自动部署 Deis 集群。使用 IAM 应用程序创建集群并分配访问策略（Access policy）。你可能需要凭据来部署配置好的
    CoreOS 集群，并使用 Dockerfiles 进行部署。


    Deis 需要一个至少包含三台基于 CoreOS 机器的集群，但你可以先创建集群，让我们从前提条件开始。首先，你需要在系统中准备好 Deis 源码，然后就可以按照系统中的命令进行操作。你可以从
    GitHub 下载 Deis。


    ```bash

    $ git clone github.com/deis/deis

    $ cd deis

    $ git checkout v1.0.0

    ```


    使用默认的最新版本非常重要。下一步是生成 SSH 密钥，以便通过 SSH 隧道与远程机器进行通信。使用以下命令创建密钥：


    ```bash

    $ ssh-keygen -rsa -f ~/.ssh/deis -N ''''

    ```


    现在创建发现（discovery）。Deis API URL 帮助你找到所需的各种实例。在配置 CoreOS 集群之前，这是强制性的。你可以通过以下方式实现：


    ```bash

    $ make-discovery

    ```


    最后，现在你创建 CoreOS 集群。你首先需要决定集群提供商，例如亚马逊云服务 (AWS)、DigitalOcean、Linode、OpenStack、Google
    Compute Engine 等。你也可以使用其他服务器。接下来，让我们学习如何在 AWS 上部署 Deis。


    ## 06 Deis 安装工具


    ```bash

    $ pip install awscli

    $ pip install pyyaml

    ```


