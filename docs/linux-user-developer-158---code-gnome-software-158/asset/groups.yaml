    # Feature Code GNOME software


    # CODE GNOME SOFTWARE


    Discover the power and ease of Vala programming


    C++''s success is obvious, but object-oriented programming can also be achieved
    in C. Developers were quick to capitalise on this success and construct design
    patterns based on similar projects.

    Vala is a C-based language that formalises these design patterns into language
    features in order to simplify their application. Vala compiles them into native
    C code so Vala code can consequently be run on any C-based operating system -
    this statement, of course, ignores the availability of libraries.

    Compatibility is only one of the selling points here. Vala development was guided
    by intention to create a language that was tied to GTK and using its object-model
    which was different from patterns used by C programmers. Even though GTK powers
    a large array of programs, such as GIMP, the patterns used by developers working
    with the GTK framework will quickly see the benefits of Vala, as it provides a
    Qt-like interface for supported libraries and eliminates the event-driven design
    pattern of creating a great deal.

    Finally, Vala''s success has been validated by Elementary, which uses the programming
    language as its base for a variety of components. Now that Vala is being used
    for such projects it demonstrates the robustness of the underlying ecosystem.

    While this article will focus on the technical aspects of Vala, let us start with
    the following, for example:


    # DEPLOY ON UBUNTU


    On Ubuntu, the latest version of Vala is downloaded via apt-get if the repository
    list is refreshed. Run:


    ```

    - sudo add-apt-repository ppa:vala/team

    - sudo apt-update

    ```


    Due to compatibility reasons, the default vala and libgtk packages might be outdated.
    We use the PPA in order to find the names of the most current editions; at the
    time of writing, the correct command is:


    ```

    - sudo apt-get install libgtk-3.0 vala-dev

    ```


    Libgtk provides easy access to a variety of storage classes. The Vala language
    specification intentionally excludes many of these classes - this is because it
    would be pointless to reinvent them as they can be easily accessed through GObject.
    The following examples on an Ubuntu system also requires the installation of the
    GTK+ stack and its development support files:


    ```

    - sudo apt-get install libgtk+-3-dev

    ```


