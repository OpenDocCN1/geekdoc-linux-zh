  - "[PAGE 53]\n\n# Tutorial C#\n\nInherit from an interface\n\nIn the Microsoft world,\
    \ 'add-on' features such as sensational are realised via interfaces; if you want\
    \ to benefit from one of these features, try adding it to the inheritance hierarchy.\
    \ It will show you how they can be implemented in order to set up the integration.\n\
    \n```\npublic abstract class FruitJuice {\n    private float amount;\n    private\
    \ string name;\n    public abstract string fruitIsSweet();\n}\n```\n\nProperties\
    \ are member variables that can be accessed via special functions. The easiest\
    \ way to generate them is to use the following syntax:\n\n```\npublic abstract\
    \ class FruitJuice {\n    public float amount { get; set; }\n}\n```\n\nThe compiler\
    \ replaces the above mentioned construct with the following structure, which illustrates\
    \ the role of getter and setter:\n\n```\npublic class FruitJuice {\n    private\
    \ string name;\n    public string get {\n        return name;\n    }\n    public\
    \ void set(value) {\n        name = value;\n    }\n}\n```\n\nA getter returns\
    \ a value. Setter is an 'invisible' variable value that contains the information\
    \ your wants to deposit in the class. Sadly, setter cannot be combined with methods\
    \ and/ versa. Creating a such as one - setting is handled via value, while getting\
    \ proceeds normally - well lead to compiler errors:\n\n```\npublic class FruitJuice\
    \ {\n    private float amount;\n    public float get {\n        if (amount > 0)\
    \ throw ArgumentOutOfRangeException();\n        return amount;\n    }\n}\n```\n\
    \nA careful observer will notice that the use of name in derived classes would\
    \ violate the protection of the member variable. This is correct, but it can be\
    \ addressed by the protected keyword:\n\n```\nabstract class FruitJuice {\n  \
    \  protected float amount;\n    protected string name;\n    abstract abstract\
    \ string fruitIsSweet();\n}\n```\n\nProtected members can be accessed from derived\
    \ classes, although a protected member of a base class is accessible only if the\
    \ access occurs through the derived class type.\n\n# The abstract\n\nEven though\
    \ FruitJuice is quite useful, developers can instantly instantiate it; creating\
    \ a FruitJuice object. is not very sensible because there is no fruit juice in\
    \ the real world.\n\nC# allows us to solve this problem by the abstract class.\
    \ Classes abstract cannot be instantiated: they can be used as a data type and\
    \ as a base for the creation of an inheritance hierarchy. Transforming classes\
    \ into abstract is as easy as adding the following keyword below:\n\n```\nabstract\
    \ class FruitJuice {\n    public float amount;\n}\n```\n\nFrom now on, attempting\
    \ to construct a FruitJuice object will be met with resistance from the compiler.\
    \ The solution is not perfect; the code found say is redundant as it has to be\
    \ gotten by the caller. While we could wait for the NotImplementedException, we\
    \ can also mark the method as the abstract keyword, enabling the compiler to enforce\
    \ its presence in child classes:\n\n```\nabstract class FruitJuice {\n    public\
    \ float amount;\n    public string name;\n    abstract abstract string fruitIsSweet();\n\
    }\n```\n\nA 'real' class must implement all members in its base hierarchy. If\
    \ this is not wanted, you can also create another abstract class. Just keep in\
    \ mind that it will be instable\n\n# Multiple inheritance and interfaces\n\nSo,\
    \ our fruit juice has worked well quite enough and Unfortunately, it is now time\
    \ to implement another complexity to example. Our course fruit juice can not only\
    \ be from different types of fruits, it can also have different\n\nC# solves this\
    \ problem with multiple inheritance. We can use interfaces, making the inheritance\
    \ from both. Sadly, multiple inheritance is seen with problems of its: if both\
    \ parent classes implement the same method, or if fields kind of enigma.\n\nJava\
    \ and C# have recognised the benefits of multiple inheritance but intend to avoid\
    \ the abstract effort and error potential of its implementation. Instead, the\
    \ concept of inheritance provides a 'reduced' version of a class that can be added\
    \ alongside the base class described above. In essence, an interface describes\
    \ as a member function that needs to be implemented. Let's take a look at RelaxInterface.cs,\
    \ which models a prominent drink manufacturer:\n\n![](img/2f88ea4367b9bd5792b1a33e619a1113_53_0.png)"
