    ## Linux for photography


    I''ve recently months into Linux, I''ve been a Linux user for a very long time,
    however I never had to get into it and understand how images are processed, edited
    and on Linux, it is great to have a Mac or switch to Windows when I want to work
    on my projects.


    What kind of can I use for Linux? Is there even decent Linux? I am having trouble
    with my RAWs...


    Linux is really great for images now that there''s a lot of software at your disposal,
    and it''s free of charge. This saves me much money in the long run.


    If you use RAWs, export is as important as the initial import of photo. There
    are a couple of RAW processors on Linux and their quality is fantastic. It can
    then crop and edit everything that you can, image colour and you get the photos
    from.


    As image editing, GIMP is the best thing you will find in Linux and it''s got
