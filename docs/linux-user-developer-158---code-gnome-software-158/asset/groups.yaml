    随机数


    使用 R、C 或 Python 解决从一个数字变为另一个数字的问题


    > 将检查的问题是：给定一个产生 1 到 5 之间随机整数的函数，编写一个产生 1 到 7 之间随机整数的函数。


    这篇文章将为你提供一些处理该问题的思路，但它也会向你展示并没有完美的解决方案。


    用另一种方法解决问题会更简单更直接，因为你可以使用取模运算符来完成工作，或者直接忽略你不需要的输出。模拟初始函数的数字将使用 R 生成。使用以下代码：


    ```python

    > floor(runif(the desired number of integers, min=1, max=6)

    ```


    你可以将它们保存在文本文件中，每个数字占据一行。


    ```python

    > write.table(numbers, row.names=FALSE, col=FALSE)

    ```


    第一种方法是取一个随机数 n 并乘以 0 到 6 之间的 7 个数字 - 使用取模运算符使其变小并加 1 以得到一个 1 到 7 之间的整数。问题是，你只能得到三个结果，因为值分布不均匀，这并不是我们想要的。正如你所理解的，问题在于从五个不同的值变为七个值，因此你必须多次运行初始函数。


    第二种方法是运行两次初始函数，将两个结果相加并相乘。然后使用取模运算符得到余数。你可以得到 1 到 7 的所有数字。第三种方法是在之前方法的基础上改进，运行初始函数并使用池随机数来确定你要运行初始函数的多少次。之后，所有的都将是随机的结果


