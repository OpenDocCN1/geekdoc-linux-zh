  mdcn: "\n\n## GNOME 软件特性代码\n\n在创建链接或类似的数据结构时，开发者应该创建与下面类似的数据结构：\n\n```c\nclass AnvilID3Object\
    \ :GLib::Object {\n  public:\n    AnvilID3Object(Object prev);\n    AnvilID3Object(Object\
    \ next);\n};\n```\n\n虽然 C# 在这方面没有任何问题，但 C 语言无法区分两个相互指向的对象。这是由引用计数原理引起的：每个对象都有一个“所有者”，并且永远不会被移除。为了防止这种行为，我们使用了一种变通方案。运行你选择的任何变通方案以查看详细信息。\n\
    \n```c\npublic static int main(int *args) {\n    while(1) {\n        AnvilID3Object\
    \ *obj = new AnvilID3Object(NULL);\n        AnvilID3Object *next = new AnvilID3Object(obj);\n\
    \        obj->next = next;\n        next->prev = obj;\n        return 0;\n   \
    \ }\n}\n```\n\n幸运的是，几乎很容易。将这种特定的关系声明为“弱引用”（weak）会告诉垃圾回收器这不用于确定所有权。AnvilID3Object\
    \ 的版本将工作得好得多。\n\n```c\nclass AnvilID3Object :GLib::Object {\n  public:\n    AnvilID3Object(Object\
    \ prev);\n    public weak AnvilID3Object next;\n};\n```\n\n虽然 C 与数据不同，因为它不支持引用；但可以使用以下语法\
