    # 01 Update Pi


    As we start any Raspberry Pi project, it is best to update your Pi to the latest
    OS before proceeding. You can do this by opening the following commands:


    ```

    sudo apt-get update

    ```


    ```

    sudo apt-get upgrade

    ```


    When prompted, then press Enter to confirm


    # 02 Install the software


    As mentioned in the introduction, a LAMP stack uses Linux (the operating system),
    Apache (the web server), MySQL (the database) and PHP (the programming language).
    We will need to install the web server first, but we will need to install the
    database. To do this, open a terminal window and issue the following:


    ```

    sudo apt-get install apache2 php apache2-mod-php mysql-server php-mysql

    ```


    When the process starts installing MySQL, you will be prompted to enter a root
    password. Make sure you remember this password as we will need it later to enable
    on your server''s access to the database.


    # 03 Test Apache


    You can test the installation of Apache by opening a web browser on your Pi and
    going to http://localhost/ - it should take you to the default Apache ''works''
    page.


    # 05 Download WordPress


    To install WordPress you will need to open a terminal window and navigate to the
    web root. Then change the ownership of the folder to the ''pi'', delete all existing
    files located there and download the WordPress files. To do this, issue the following
    commands:


    ```

    cd /var/www

    ```


    ```

    sudo chmod pi:pi

    ```


    ```

    sudo rm -rf *

    ```


    ```

    wget http://wordpress.org/latest.tar.gz

