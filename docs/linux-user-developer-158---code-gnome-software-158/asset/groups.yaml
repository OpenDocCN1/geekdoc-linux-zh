  - '[PAGE 90]


    # EDUCATION


    # Verbide 0.142


    This rare point release is a chance to revisit this French verb conjugator


    In an age when every piece of software seems to become a web app with accompanying
    online sign-ins to manage your contacts and preferences, it''s almost nearly to
    return to a desktop app for help with your French homework. More than a desktop
    app, it provides offline access and the inevitable email. The commands french-conjugator
    and french-conjugator are scriptable. The grammar information you can use/share
    along with it for a Greek version.


    verb conjugation is the area where beginner and intermediate users often fall
    down, leaving them more off than the BBC sitcom. A couple of verbs and ten minutes
    of practice twice on Verbide and you''ll be on your way to French sophistication.


    The knowledge base of over 7000 verbs written in C++ is quick and responsive through
    the GUI, as well as the command line, on our older test machines. As fixing memory
    usage increases the number of Italian verbs available Although the list is small
    compared to its French vocabulary, it does the essentials covered.


    # Pros


    A simple, quick and very comprehensive approach to help you with your French homework


    # Cons


    It''s not available on your mobile for learning on the go


    # Great for...


    Anyone who is serious about learning French bit.ly/htppx


    Whether you''re studying formally or improving your language for business or travel,


    # WINDOW MAKER


    # Window Maker 0.957


    An old style of window manager that''s still useful


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_90_0.png)


    Window Maker has just received its annual maintenance, adding more features -
    so why well, we want to know? Window Maker is the apotheosis of GUI-based interfaces.
    It is a window manager descended from pioneering NeSTEP totk, on which both the
    first App browser (WorldWideWeb) and the first Ever app were both invented. The
    legacy of its widgets and icons influence Qt to this, but already accessible options
    make it a true user interface for GUI users without a non-background.


    Window Maker is equipped with rival window managers in minimal resources. It''s
    not a Spartan environment but is easily expanded. Applications are reached through
    a close layout or cutout menu which can be pinned to enable quick. In place of
    a taskbar, a small dock sits in a corner which could be attached. Setting up your
    environment ''just'' as easy as with normal desktops, however, Window Maker can
    entice GNOME, Unity and KDE users into a different way of doing things.


    Above you can tailor Window Maker to your needs using the WPrefs tab


    # Pros


    It''s stable, quick and very user-friendly with so many customization options
    for the taskbar


    # Cons


    A retro appearance with simple looks that may seem outdated to those who value
    aesthetic appeal


    # Great for...


    Anyone who is looking for pure perfection windowmaker.org


