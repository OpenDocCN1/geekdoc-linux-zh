    在驱动板的顶部，USB 接口的对侧，将你的排线连接到套件上，并确保蓝色标记朝向螺丝电缆。接下来，你应该将另一端连接到标记为 ''SV'' 的引脚，然后将黑色跳线线插入标记为
    ''GND'' 的插中（每根电缆的颜色并不重要，但这是惯例）。


    # 拆封屏幕


    如所注意到的，屏幕是分部分提供的。包括显示器、驱动板、板载安装硬件、连接线。包装盒包含一些零件；建议保留盒的平整部分作为操作表面，避免划伤屏幕。在使用它的期间，屏幕正面也应该保留保护塑料膜，并一直保留到最后安装位置就绪。


    # 连接树莓派 - 第 2 部分


    将你的树莓派放在安装板上，USB 端口与驱动板在同一侧。使用提供的螺丝将树莓派固定到位；再次注意不要拧太紧。将白色排线的另一端连接到树莓派上的 CSI 接口，即是与已连接的排线在同一侧的那个。它应该对齐并咔哒一声卡到位。


    # 连接驱动板 - 第 1 部分


    将显示器朝下放在静电泡沫上，你会发现背面有一根大排线，连接着一根较小的排线。拿起驱动板，其背面应该有一个连接器。你也应该让这一面朝下静电泡沫。


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_78_1.png)


    小心地解开驱动板上的连接器，插入排线，然后按下卡扣固定电缆。将驱动板翻转到显示器的背面，此时你应该会在板的顶部看到一根小排线和一个小连接器。以你处理大排线的方式连接它。


