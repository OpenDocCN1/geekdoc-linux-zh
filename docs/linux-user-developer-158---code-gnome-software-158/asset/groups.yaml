    \ and slide the camera module into flex until the shiny faces catch away from\
    \ the Ethernet port. Once the flex is fully slotted, push the plastic catch back\
    \ into place. To save time, you might try rotating the position of your camera-camera\
    \ module!\n\n## 04 Test your Pi camera module\n\nAfter connecting the Pi camera,\
    \ check that it works by booting your Raspberry Pi (assuming you're running Raspberry)\
    \ and entering this in the command line:\n\n- raspi-config\n\nWith the keyboard,\
    \ move down to option: 'Enable Camera', and tap Enter. Following the prompt, hit\
    \ Enter again to enable the camera and exit. If you're not already logged into\
    \ the GUI, do now; if you're in the command line interface, enter start to launch\
    \ the desktop environment and enter:\n\n- sudo apt-get install python-picamera\n\
    \nYou can review the image in your Home directory.\n\n```\nwith picamera.Camera()\
    \ as camera:\n    camera.vflip = True\n    camera.hflip = True\n    camera.start_preview()\n\
    \    sleep(1)\n    camera.capture('/home/pi/image2.jpg')\n    camera.stop_preview()\n\
    ```\n\n## 05 Straight out the image\n\nWith the Pi camera and running up, you\
    \ may notice that it's outputting the image with the axes flipped. We can fix\
    \ this using Python, so open the terminal and enter:\n\n> You may notice that\
    \ it's outputting the image with the axes flipped. We can fix this using Python\n\
    \n- sudo apt-get install python-picamera3\n\n## 06 Set up the button and hardware\n\
    \nWe have two ways to add a button to the Raspberry Pi, but before proceeding,\
    \ switch the switch off and disconnect from the mains. You should also the simplest\
    \ method of adding a button is to employ a free breadboard and a single pushbutton.\
    \ Connect the button to the breadboard with two male-female wires connected to\
    \ GPIO 17. In a circuit designed to detect action from the button on GPIO, each\
    \ frame of your animation can be captured with a single button push.\n\n## 07\
    \ Code for stop motion\n\nOnce you're into stop-motion camera, the first step\
    \ is to type the code below, which will capture an image of your subject and save\
    \ it into a folder \"Stop motion\". Each image is sequentially numbered and they\
    \ can be stitched.\n\n```python\nimport camera\nfrom R import GPIO\n\nbutton =\
    \ 17\nGPIO.setmode(BCM)\nGPIO.setup(button, GPIO.IN, GPIO.PUD_UP)\nwith camera.Camera()\
    \ as camera:\n    camera.start_preview()\n    while True:\n        GPIO.wait_for_edge(button)\n\
    \        camera.capture('/home/pi/frame%03d.jpg')\n        print('%d' % frame)\n\
    \        frame += 1\ncamera.stop_preview()\n```\n\n## 08 Stitch your stop-motion\
    \ animation\n\nThe collected images can be stitched together relatively quickly\
    \ using a special preview view, but for an animation you will need to compile\
    \ them into one single file. In the terminal, ffmpeg:\n\n```\nffmpeg -f image\
    \ -i /home/pi/Desktop/frame%03d.jpg -r 24 -vcodec lib264 -profile high preset\
    \ slow /home/pi/Desktop/animation.mp4\n```\n\n## 09 Use an app instead\n\nDon't\
    \ fancy the script! This stop-motion application. Begin by using the raspberry-raspberry\
