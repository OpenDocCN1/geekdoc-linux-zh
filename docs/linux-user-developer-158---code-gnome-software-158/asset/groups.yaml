    # OPINION


    # The kernel column


    Jon Masters narrates the latest headwinds in the Linux kernel community, as development
    closes on Linux version 4.3.


    Linus Torvalds announced RC3 (Release Candidate 3) of the 4.3 Linux kernel, saying
    "as usual, RC is exactly bigger than RC (fixes are starting to trickle in), but
    not particularly alarming statement." Following the merge undo during the first
    two weeks of a development cycle, Linus will typically happen once on a weekend
    or on Sunday (in the latest RC). At this rate, the final 4.3 should be available
    in time for our summary in the next.


    To convert older filesystems to the newer release (ext3 to ext4, for example),
    and indeed this is a critical concern in the case of the deprecation of ext3 filesystems
    (such that they become unable to read their legacy support). Linus will never
    compel users to make a forward upgrade of ext3 filesystems in the future. It was
    made clear that the ext4 filesystem code would not support its legacy support,
    in addition, not to make incompatible changes to existing filesystems as many
    users do not want to transform a Linux system without removing containing ext3
    files.


    Jon Masters: A Linux kernel hacker who has been working on Linux for some 19 years,
    joined at the age of 13. He lives in Cambridge and works for a large enterprise
    developing the creation of standards for energy efficient ARM-power servers.


    User page support is particular to use virtual machines, which are implemented
    using a combination of kernel and user space.


    The actual merge undo started several weeks after the release of 4.3-RC1, which
    Stephen Rothwell followed up with to track the development graph graphing stats
    at mailing.org/linux-next-size.html.


    Linux 4.3 includes roughly the usual number of kernel collects of patches implementing
    specific features or tweaks, which tends to help the 10,000 mark-to-three month
    development cycle. That is, of course, astounding when one considers the thousands
    of lines of code as a minimum. As a while, there are many interesting features
    that matter the most notable in 4.3 are the removal of the ext3-filesystem driver
    (replaced with ext4 for backward compatibility of using existing filesystems),
    which will be useful for many users.


    # Features coming in Linux 4.3


    Virtual support is particular to use virtual machines, which are implemented (in
    the KVM - Linux Virtual Machine - hypervisor or other type-hypervisors that operate
    similarly, as we discussed) through a combination of kernel and user code. The
    kernel provides support for the unifying of virtual filesystems, devices and processes
    in the context of a user program that runs the machine and process continues to
    it, as enumerating various I/O interfaces. The kernel-based process could support
    implement live machine migration in a very clean way; it can snapshot the virtual
    memory when it moves over to another host while the virtual machine continues
    to run on the original host as the destination. Finally, a list of updates is
    sent to the destination, to speed up migration and reducing the period of time
    during which downtime.


    # Dropping development


    Some debate has taken place around the behaviour of those tasks (the kernel for
    ''process'' – a running program) that are in the TASK_UNINTERRUPTABLE state. This
    state is reached when a program is performing an I/O activity within the user
    running the kill command (or a graphical desktop).


    It has been a long time in the making and it follows for the ''original'' or ''extended''
    filesystem in the releases of the (Linux kernel) in which later filesystem versions
    have been enabled earlier, provided that there is some level of backward compatibility
    in the past, this might mean that users would be required.


    # KERNEL


    # Semantic patching with Coccinelle


    Finally for this month, we have been intrigued by a recently published paper by
    Luis R. Rodriguez entitled "Increasing Automation in the Backport of Linux Drivers
    Using Coccinelle". Coccinelle is a semantic patching tool that can automate the
    process of kernel code maintenance (as discussed in the context of this research
    paper) to perform transformations on kernel code, and like the among. Others,
    Rodriguez maintains the Linux Backports project, which applies patches to stable
    kernels that are in widespread use. In his paper ([bit.ly/N4iR4tm](http://bit.ly/N4iR4tm))
    Rodriguez proposes to use automatic backporting for this process of backporting
    using Coccinelle, which has many possibilities; for example, bringing new features
    to older distributions and devices. We will cover this in next issue.


    Utility. Usually, a task should not be blocked in a TASK_UNINTERRUPTABLE state
    for very long periods of time, but exceptions do happen. While users cannot kill
    a task that is in this special state it could lead to a deadlock (hang), which
    is why some resources might not be freed and if it were to do so, this kind of
    task wouldn''t come along—all get killed by the OOM (Out Of Memory), a low memory
    ''killer'' that hogs down a system. Kyle Walker noted this, which might lead to
    a crash instead of correct behaviour.


    Eric W. Biedermann has been permitting to perform a subset of what our process
    can perform, which is a part of the contentious debate about the kernel in D-Bus
    implementation that we have covered. It failed in part because it requires generic
    handling of how MAC (Mandatory Access Control) and credentials are handled. Biedermann
    has a suggestion that a call interface be provided through a new system known
    as syscall which would take a file descriptor, along with the described system
    call and parameters. The added file descriptor (fd) would need a pointer to create
