    ## Linux 摄影


    我最近接触 Linux 几个月了，我一直是 Linux 用户很长时间，但我从未深入过它并理解如何处理、编辑图像。在 Linux 上，当我想工作时可以切换到
    Mac 或 Windows。


    Linux 上有什么什么可以用吗？有不错的 Linux 吗？我在 RAW 文件上遇到了问题……


    Linux 现在非常棒了，因为有很多软件可以使用，而且是免费的。从远来看，这为我省了大量的钱。


    如果你使用 RAW 文件，导出与最初的导入同样重要。Linux 上有几个 RAW 处理器，它们的质量非常出色。它可以裁剪并编辑你得到的所有内容，以及照片的色彩。


    作为图像编辑工具，GIMP 是你在 Linux 上能找到最好的工具，它包含了你处理图像所需的一切。对于照片，Shot 也有与 Lightroom 类似的功能，包括导入功能，当然，还有你可能想要上传的照片。


