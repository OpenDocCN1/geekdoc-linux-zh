    # 欢迎阅读第 158 期 Linux User & Developer


    # 每期让 Linux User 的更便宜 第 18 页


    Jon Masters 是一位 Linux 内核黑客，自 13 岁上大学以来已从事 Linux 工作 19 年。Jon 住在剑桥，为一家大型 Linux 供应商工作——查看本月第
    16-17 页的精彩专栏。


    # 本期内容


    - >> 学习使用 Vala 编程

    - >> 为日志事件设置自动化

    - >> 设置官方 Pi 触摸屏

    - >> 寻找为什么 Jim Zemlin 是个新手


    Richard Healey 自 20 世纪 90 年代以来帮助各种规模的企业和组织迁移到 GNU Linux，他每周的工作都会处理大量的邮件。我们还将在第
    83 页寻找电子表格软件工具，然后到第 40 页讨论 Firefox。


    欢迎阅读最新版本的 Linux User，这本英国和美国最喜爱的 Linux 和开源杂志。


    在关注编程和展示开源世界的一些最新工具之后，我们本月还涵盖了一系列核心主题，包括容器化（第 44 页）、编程（第 34 页）、源代码（第 59 页）等。此外，我们还采访了
    Jim 关于今年 LinuxCon 发表的协作项目和工作讨会公告，以进一步了解 Linux 基金会的这些目标以及协作开发的本质。请前往第 20 页阅读：什么将让你使用
    GTK 开发应用程序变得更容易：Vala。我们在这里是为了创建用于工作的 GNOME 模型工具，通过我们的首选，你可以尝试一下——转到第 28 页开始。


    Tam Hanna 从 Palm Inc. 时代就开始进入 IT 行业。作为技术书籍的作者，他几乎看过一遍每一个市场。本月向我们介绍了 GNOME 软件编程的未来，并继续了他的
    CF 系列（25页）。


    Mihalis Tokoukas 是一位英国系统管理员，自1993年起专注于编程、数据库和 Linux 操作系统。本月，Mihalis 讨论了 Linux
    编程（34页）并继续了他的专栏系列。


    Daniel Alexander 是树莓派专家，一名儿童首席老师。他热爱创作、黑客和项目，并使用他教给学生的一切。他必须去第 66 页查看 Pi-Motor
    控制板，这样他就能控制你的视觉了。


    Gavin Threece 是我们的新闻记者，从第 6 页带来开源世界的最新动态。转到第 80 页查看预装 Ubuntu 的 Linux 硬件，看看这台入门级笔记本是否适合你。此外，我们有官方触摸屏和
    Pi-Motor 板板——那里有很多项目！我们还采访了那个在冰箱门上玩宝可梦的家伙，你应该尝试一下里面的技巧（66页）。


    Gavin Threece，编辑


