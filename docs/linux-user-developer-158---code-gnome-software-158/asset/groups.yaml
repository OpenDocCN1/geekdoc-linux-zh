    最新的 GNOME 3.18 发布了稳定且可靠的与 Google Drive 集成方法。现在云存储已获得支持并直接集成到文件管理器中，用户无需再安装应用程序并忍受可能产生孤立文件的同步客户端带来的困扰。


    - 2 升级您的固件

    Linux 供应商固件服务（Linux Vendor Firmware Services）使得在不依赖专有平台的情况下，选择和更新日益增多的设备变得更容易。GNOME
    的软件更新系统也内置了此类支持。


    - 3 新日历事件

    作为 GNOME 3.16 的一个预览功能引入，新的日历集成功能能够与 GNOME 3 完全兼容，并提供对 Google 在线账户的支持，同时具有更好的月份、年份显示效果以及远程日历支持。


