    \    }\n}\n```\n\n```csharp\npublic class Juice : FruitJuice\n{\n    public Juice(float\
    \ amount)\n    {\n        this.amount = amount;\n        this.name = \"Juice\"\
    ;\n    }\n    public override string whatJuice()\n    {\n        return \"Peach\
    \ juice\";\n    }\n}\n```\n\n![](img/2f88ea4367b9bd5792b1a33e619a1113_51_1.png)\n\
    \n```csharp\n{\n    myAmount = _amt;\n    myName = \"OJ\";\n}\npublic string whatFruitIsIt()\n\
