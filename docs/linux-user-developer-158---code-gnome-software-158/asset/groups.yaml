    # Tutorial Deis


    # Deploy develop software to Docker containers using Deis


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_43_0.png)


    Deis is an application platform that helps you deploy and scale applications as
    Docker containers


    It is a thing of the past to develop code and wait for the operations team to
    deploy it with your fingers crossed. DevOps is slowly gaining steam as the freedom
    of development and its automation makes it possible to deploy and test code in
    parallel. Deis lets you deploy your project in any language or framework with
    a simple git push.


    Nitish Tiwari is a software developer by profession, open source enthusiast by
    heart. As well as writing for clients and reviewing software for various magazines,
    he helps firms with their business needs


    Being a development tool, Deis integrates very well with Docker. All the applications
    you deploy via Deis are distributed as Docker containers. Deis runs itself as
    a combination of CoreOS and Kubernetes, specifically designed to run applications
    adhering to the Twelve-Factor methodology. A Twelve-Factor app is a methodology
    to build and run scalable SaaS apps on the Heroku platform.


    Deis runs on CoreOS, a minimal distro designed to run containerised infrastructure
    stacks. Before you install Deis, you''ll need a cluster with CoreOS installed.
    No to worry, CoreOS can be installed on almost any infrastructure.


    # Resources


    +   - Docker.com

    - Deis.com

    - Deis.io


    # 01 Deis architecture


    Deis is based on a service-oriented architecture, with all of its components segregated
    from one another, each having a clearly defined role in the larger scheme of things.


    The components are categorized into three major groups: data plane, control plane
    and router. We will take a look at them in the following steps, but first let
    us understand how these components communicate and interact with each other.


    As the names suggest, the control plane handles the management functions, such
    as managing traffic, configuration and deploying application code in the form
    of Docker containers and the two communicate with each other. The data plane is
    used to handle incoming traffic, which is usually connected to the public Internet,
    it is often coupled with a front-end load balancer. The control plane receives
    the API requests that are routed to the control plane, and handles the traffic
    for the software that runs on the data plane.


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_43_1.png)


    Deis can take your code from Git and republish it on Docker containers on your
    server cluster automatically'
