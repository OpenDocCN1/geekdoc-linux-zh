    ## Feature: The future is open source


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_19_0.png)


    # THE FUTURE IS OPEN SOURCE


    LinuxCon Europe saw even more announcements from Linux Foundation Collaborative
    Projects and Workgroups – we asked Jim Zemlin to explain the strategy driving
    them.


    Shortly before LinuxCon Europe kicked off, the Linux Foundation published a report
    stating that its Collaborative Projects have added five billion dollars of value
    to the technology sector. It is a staggering amount and provides real proof of
    the value of distributed development – a proof that is more important than ever
    at a time when companies are abandoning internal development models, adopting
    research and structures in favour of collaboration. The Linux Foundation calls
    this concept “distributed genius” and believes that only the distributed genius
    of thousands of people working as one can solve the most challenging problems
    of our time. We spoke to Jim Zemlin to hear from him just why the future of the
    technology sector is in open source.


    Jim Zemlin is the director of the Linux Foundation, his career spans three of
    the largest technologies of the last decade: mobile computing, cloud computing
    and open source. We sought his experience to accelerate innovation in technology.


    “Why don’t I just start with the broader perspective in terms of what is going
    on here?” This report is one more example – I would argue a big shift is happening
    in the industry – where open source is really becoming how software gets developed.
    And what I mean is that the percentage of open source code in our industry is
    growing year by year, to the point where companies are essentially, collectively
    developing the underlying components that make up products like Linux, Facebook,
    Google, Android devices, Samsung televisions, Qualcomm software and so forth –
    that has become a permanent part of how software is being developed.


