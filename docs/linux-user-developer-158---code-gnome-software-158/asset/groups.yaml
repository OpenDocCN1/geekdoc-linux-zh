    # Welcome to issue 158 Linux User & Developer


    # Get Linux User cheaper every issue Page 18


    Jon Masters is a Linux kernel hacker who has been working on Linux for 19 years,
    since he attended university at the age of 13. Jon lives in Cambridge and works
    for a large Linux vendor - find his Brilliant Column on pages 16-17 this month.


    # This issue


    - >> Learn to program in Vala

    - >> Automate actions for log events

    - >> Set up the official Pi touchscreen

    - >> Find why Jim Zemlin is a rookie


    Richard Healey has been helping businesses and organizations of all sizes to move
    to GNU Linux since the 1990s and every week he works with has his share of Email.
    We also, on page 83 to find spreadsheet software tools and then over to page 40
    to discuss Firefox.


    Welcome to the latest of Linux User & the UK and America''s favourite Linux and
    open source magazine.


    Following our focus on programming and some of the latest tools to show the open
    source world, we''re taking a range of core topics this month includes containership
    (page 44), programming (page 34), source code (page 59) and more. Plus, we talk
    to Jim about the Collaborative Project and Workshop announcements made this year''s
    LinuxCon, and to understand more about the Linux Foundation''s goals with this
    and the nature of collaborative development. Head over to page 20 to read on:
    What will make it easier for you to develop applications using GTK: Vala. We were
    here to create GNOME models tools to work with, and with our prime you can give
    it a try - turn to page 28 to get started.


    Tam Hanna is in the IT business since the days of the Palm Inc. As an author of
    technical books, he has seen almost every market more than once. This month introduces
    us to the future of coding GNOME software and continues his CF series (p. 25).


    Mihalis Tokoukas is a UK system administrator who specializes in programming,
    databases and Linux operating systems since 1993. This month, Mihalis discusses
    Linux programming (page 34) and continues his Column series.


    Daniel Alexander is a Raspberry Pi Expert and a Lead Teacher for kids. He is passionate
    about creating, hacking, and projects and uses everything that he teaches students.
    He has to go to page 66 to find out about the Pi-Motor control board, so he can
    control your vision with Pi.


    Gavin Threece is our news reporter who brings the latest developments from all
    over the open source world, starting on page 6. Turn to page 80 to see Linux hardware
    budget, which comes with Ubuntu preinstalled, to see if this entry-level laptop
    for you.


    new official touchscreen display and the Pi-Motor IR board - plenty of weekly
    projects there! Plus, we spoke to the chap who plays Pokémon on his fridge door,
    so you should try the trick inside it (page 66).


    Gavin Threece, Editor


