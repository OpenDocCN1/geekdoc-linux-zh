    # OpenSource


    The release of firmware source code and circuit design files (made available under
    the General Public Licence and Creative Commons)


    The world is beginning to realise of additive manufacturing, and for Spark we
    hope to make it possible for more companies to incorporate printing into their
    design and manufacturing process.


    In the BeagleBone default company''s release includes a satellite board with a
    secondary AVR microcontroller to support a front panel LED and status indicator.


    However the company has issued a warning for hobbyists to build their own ember
    printer, stating that the released files are for reference purposes only and the
    company will have no responsibility for either printers and derivatives based
    on the files.


