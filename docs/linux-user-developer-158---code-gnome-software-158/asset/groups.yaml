    It''s true that while it''s easy to clear the stickers still adorning a Windows-based
    laptop, the keyboard (in favour of an unbranded Ubuntu laptop, the keyboard of
    two-handed typing) has the Windows logos off and has more than four extra keys.


    These, are minor points. While it''s easy to criticise an HP laptop for installing
    an old version of Ubuntu, there are signs that the company could put more effort
    into things. The laptop you build on the desktop, all drivers and firmware required
    for the on-board hardware are provided; providing accelerated access to the APU''s
    graphics.


    It''s true that the audio is fair for the best on the market and even in HP''s
    trio of Ubuntu-capable laptops. The HP 255/355 G3 offers for £410, while for another
    £500 on top of that you get the 455 G3 with A10-7300 and double the RAM. It''s
    still more than passable for general office use, an even lightweight gaming machine,
    while the processing cores make multitasking smooth, while the Radeon graphics
    admits the somewhat not-terribly


    demanding Nexruz first-person shooter at the display''s 1566 x native resolution
    without problem.


    Boot time is issue, as the battery life of three hours of active use. Given the
    laptop''s price (£199.99), these are forgivable. There are some features that
    make it beat devices costing three or more, such as the DVD writer in an era where
    offline drivers are dropped out of favour.


    Other areas, are perhaps a cut-corner too far. While Ubuntu lacks easy tools to
    quickly to connected storage, it''s camouflaged in black rather than the usual
    blue, and the 10/100 card will slow network connections. The display is a low
    resolution, though it''s clear and has an anti-reflective matte finish that makes
    its use in bright light.


    The most off-putting aspect, is a legal one: upon first boot, the buyer is presented
    with the HP End User License Agreement which is associated with privacy. You''re
    then told that the use of open source Ubuntu operating system depends on acceptance
    of the same. This suggests that HP isn''t to hesitate to integrate with the open
    source and free software communities time soon.


