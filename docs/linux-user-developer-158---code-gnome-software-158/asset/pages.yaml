    # Q & A


    # Your questions answered


    Send us your questions and we''ll do our best to answer them!


    # Virtual desktop


    I like to use VirtualBox to test out new distros and always have a permanent Ubuntu
    VM for it, where I can run-free software that is not available to my current distro
    (Fedora). The only problem is however, much I tweak the settings in the actual
    virtual distro, the only square resolution. It''s a bit annoying as I''d like
    to see what some of the distro looks like in full widescreen.


    Is there any way that I can fix this issue? It is something in Fedora, in the
    VirtualBox settings or something else? If I''m running Fedora 20 it helps at all.
    Can you help me?


    However, there is a solution for that, it involves VirtualBox and the VM. When
    running the Ubuntu virtual machine (or any other VM for that), navigate the mouse
    to the bottom and right up the VirtualBox menu. Select ''Guest Additions CD image...''
    download a file, then insert a virtual CD into your VM where you can auto-mount
    it to the kernel. Once it is installed successfully, reboot the system and after
    log in, the virtual machine should automatically resize to your normal display.


    VirtualBox is a bit funny with the way drivers for displaying the VM, choosing
    to default to style resolutions just so


    You''ll also have access to functions like USB drive passthroughs and shared folders
    between systems, it''s worth doing on many levels!


    # GIMP updates


    I like to use GIMP as my main image editing software - it''s excellent and I''ve
    got access to it. The problem is that I''m running Ubuntu 14.04, and it doesn''t
    have the latest version of GIMP available. The bug fixes always seem to help a
    bit.


    Now I could use GIMP for each update, but it''s a bit more hassle than I''m willing
    to go through, and I would rather get the updates automatically as they come from
    the software updating


    In fact, there''s also other software I''d like to do with. Is there any way to
    force updates? Do you provide an answer to?


    Left VirtualBox is more powerful than you think - install better modules to your
    kernel to get the most out of


