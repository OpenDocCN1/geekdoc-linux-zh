  md: '# GOVERNMENT


    # Italian military reveal shift to LibreOffice


    Central government organisation to make the leap


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_6_0.png)


    The Ministry of Defence has announced a project to shift to LibreOffice software
    and Open Document Format (ODF) for all of its systems, scheduled to be completed
    by 2020.


    Working with the voluntary organisation Libertad, the military will shift 500-based
    workstations to the open source software, which will provide a series of courses
    to educate users about the transition.


    The shift follows a 2012 law that requires all Italian departments to use free,
    libre and open source software as standard when tendering for new applications.
    While the military''s installation will be the largest in Europe, the


    The Italian Agency for the Digitisation of Public Administration issued a statement
    in support of the MOD''s shift, stating that it hopes other organisations may
    follow in its footsteps.


    and open source alternatives to the more expensive proprietary software.


    Smaller Italian governments who have already adopted LibreOffice include the Emilia-Romagna
    region, the Generale Gallara Hospital, Bologna, Piacenza and several municipalities.


    Although the move will not see the Ministry of Defence adopt LibreOffice instead,
    the shift to cross-platform software could make a move in the future. It remains
    undecided whether it will meet the requirement of Italy''s 2012 Foss-law.


    The switch will be managed by a task force within the department, based on a switching
    tool written by LibreOffice maintainer The Document. The Foundation will provide
    technical support and hands-on training for MOD staff.


    The agreement was signed by Rear Admiral Armando Di Base of the information department
    and Libertad president Sonia Monteghese with a deadline for the end of 2019.


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_6_1.png)


    # TOP FIVE


    # Features in GNOME 3.18


    +   1 Google Drive integration

    The latest GNOME 3.18 releases stable and reliable ways to integrate with Google
    Drive. Now backed integrate cloud storage directly into the file manager, there
    will be no need for users to install their applications with the hassle of synchronisation
    clients that can leave orphans.


    +   2 Upgrade your firmware

    Linux Vendor Firmware Services makes it easier to select and update growing numbers
    of devices without relying on proprietary platforms. Support is also built-in
    GNOME''s software update system.


    +   3 New calendar event

    Introduced as a peek in GNOME 3.16, the new calendar integration works fully with
    GNOME 3 and offers support for Google Online Accounts along with a look and feel
    better month year and remote calendar support.


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_6_2.png)


    > Above the new calendar application''s GO support means you can easily integrate
    with your existing Google Calendar data


    +   4 Built-in light sensor


    With an integrated light sensor, GNOME can automatically display brightness to
    match your environmental conditions. Positioned as a battery saver for mobile
    devices, the feature can be enabled on demand.


    +   5 New characters app


    This feature is an application-agnostic way of adding characters to your text,
    such as unusual punctuation, symbols and emotions without switching layouts. It
    includes a search function and the ability to filter by font or locale.


