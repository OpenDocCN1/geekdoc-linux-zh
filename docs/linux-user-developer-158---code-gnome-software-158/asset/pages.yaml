  md: '# OPINION CODING


    # Random numbers


    Solving the problem of moving from one to another using R, C or Python


    > The problem that will be examined is the following: given a function that produces
    a random integer from 1 to 5, write a function that produces a random integer
    in the range of 1 to 7.


    This article will give you some ideas on how to approach the problem, but it will
    also show you that there is no perfect solution.


    Solving the problem another way is easier and simpler because you can use the
    modulo operator to do your job or just ignore the output that you do not want.
    The numbers for mimicking the initial function will be generated using R. Use
    the following code:


    ```

    > floor(runif(the desired number of integers, min=1, max=6)

    ```


    You can save them in a text file where each number occupies its own line.


    ```

    > write.table(numbers, row.names=FALSE, col=FALSE)

    ```


    A first approach would be to take a random number n and multiply 7 numbers from
    0 to 6 - use the modulo operator to make it smaller and add 1 to get an integer
    between 1 and 7. The problem is that you can only get three results because the
    values are not evenly distributed, which is not what we''re looking for. As you
    can understand, the problem is that you get from five distinct values to seven
    values, therefore you have to run the initial function multiple times.


    A second approach is to run the initial function twice and add the two results
    and multiply them. Then use the modulo operator to get the remainder. You can
    get all numbers from 1 to 7. A third approach, which improves on the one before
    is to run the initial function and use the pool random number to find out how
