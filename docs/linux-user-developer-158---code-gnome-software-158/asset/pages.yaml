    # OPEN SOURCE

    Performance workgroup


    The Linux Foundation has announced the DieM Workgroup with the intention of creating
    a de facto standard for tracking and monitoring infrastructure to improve diagnostics
    of user-space projects.


    Founded by companies Ericsson, Freescale, Google, Hitachi, IBM and others, the
    DieM Foundation focuses on improving the effectiveness of Linux performance tools
    by standardising interfaces and common exchange formats.


    “We believe the Foundation workgroup will give the community a neutral place to
    advance Linux and collaborative technologies. The DieM workgroup is a perfect
    example of this type of community-driven work as an new era for Linux today and
    into the future,” claimed Linux Foundation executive Jim Zemlin. “This collaborative
    work will sustain Linux needs.”


    For Linux tracing it’s an exciting time, with numerous tracing projects rapidly
    improving visibility and accessibility,” said Greg of Greg of Netflix.


    The improvements will be felt in the embedded world, as Philippe Maisisson from
    River Wind added: “The DieM workgroup is making a significant contribution to
    Linux by fostering new initiatives and getting synergy between community and open
    source contributors.” More information is available at diamon.org.


