    ![](img/2f88ea4367b9bd5792b1a33e619a1113_42_3.png)


    Above a scatter plot will show how many people of various ages can remain lessons
    from their secondary school


    The following line of code defines the keys in the myData:


    ```

    var lessons = d3.keys(myData).filter(function(d){

    return d.age == "age" && d.total == "total";

    });

    ```


    As you want to the few of the four lessons, you must include the age and the year.
    When you have doubts about the effect of your JavaScript code, use console.log(lessons)
    will show you the variable in the D3 console, which lesson is in a different colour
