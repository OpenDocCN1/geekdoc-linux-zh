    \ if the file exists and is opened without protection, to truncate its size to\
    \ zero\nO_APPEND - atomically append data to the end of the file when writing\
    \ to\n\nUsually, folks think they have time and there will be bugs hiding in your\
    \ code. But debugging is an art of its own! The hardest part is not to find the\
    \ bug, but to reproduce the bugs on your machine. Fixing the bug is usually the\
    \ easiest part of the process.\n\nLeft. Here you can see many of the open(2) constants\
    \ in action\n\nYou can combine any of the previous three constants in the order\
    \ you want with open(2). For example, with O_RDWR|O_CREAT means that it will create\
    \ the file if it does not exist or it will already exist (O_CREAT) and then present\
    \ it will be truncated to zero.\n\nA simple 'algorithm' for debugging code is\
    \ to follow the following steps: 1) understand the input that makes the bug reproducible;\
    \ 2) use a debugger with software breakpoints to find where the code goes wrong.\
    \ However, sometimes it is better to debug it by tracing the code and trying to\
    \ find why it does not work.\n\nYou can also create a new file with the create(2)\
    \ system call, which is not discussed in this article.\n\nFinally, remember that\
    \ there are many other functions and programs you might have used!\n\n# The close(2)\
    \ system call\n\nThis is the simplest system call in this article. It returns\
    \ 0 on success or -1 otherwise. Please remember that file descriptors 0, 1 and\
    \ 2 are always in use and should never be closed!\n\nRelated to the read(), the\
    \ write() function that writes data to a file. The function returns the number\
    \ of bytes written or -1 in case of error. If you actually encounter an error\
    \ while writing, so just read() and try to do it again, you will get no error\
    \ messages unless you provide the appropriate error checking. However, no that\
    \ opening a file for writing, fail no flags unless it is a correct command:\n\n\
    # The read(2) system call\n\nYou can read data from an open file using read().\
    \ The number of bytes read is returned on success. If you read to the end of a\
    \ file, or if there is an error, read() returns -1. You will need a buffer to\
    \ store the data.\n\n```\nint fd = open(filename, O_RDONLY, 0664);\n```\n\nThe\
