  md: '# Tutorial File I O


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_33_0.png)


    Mihalis Tskoukalis is a programmer for Unix and iOS, DBA and also a math teacher.
    He has been using Linux since 1993.


    # Systems programming: File input output


    # Resources


    +   Text editor

    GCC compiler


    # Learn the C system calls that can help you work with file I/O and start developing
    practical utilities


    This article will talk about the system calls that help you perform basic file
    I/O in Linux.


    You should recognise by now that using higher-level commands in other programming
    languages is easier until something bad happens. Therefore, it is always good
    to know what is going on just beneath the surface even if you never use C every
    day.


    It would be beneficial to revisit this article after reading it for the first
    time in order to fully understand the information presented. You might try right
    out to double-check on reflection. Usually with practical subjects, the more code
    you write, the more you will understand the techniques as well as the theory behind
    them.


    So let''s take a look at the most important system calls that have to do with
    file I/O. You can see all available options for each system call by visiting their
    pages.


    The good news with file I/O is that there are just five system calls that have
    the ability to perform most of the file read, write, open and seek. There are
    some others that you will also need to know to continue, but the aforementioned
    functions are the foundation of it.


    # The (open) system call


    The family of functions will be the center of the next tutorial, as the stat structure
    that holds the relevant data is very important. At the end of this article, follow
    along the examples and try to write your own code if you are making mistakes.


    +   * _RDWR - open the file for reading and writing

    * _RDONLY - open the file for reading

    * _WRONLY - open the file for writing only

    * _EXEC - open for execution only


    Tutorial files available:

    filesilo.co'
