  md: '# Tutorial


    # Set up a WordPress website on your Pi


    Here''s a quick guide to running a WordPress server and setting up your Raspberry
    Pi as a LAMP Stack


    One of the reasons the Raspberry Pi is so popular in recent years is because it
    is an extremely capable little computer that packs a lot of punch for its very
    small price. Since the release of Raspberry Pi 2 Model B in the early months of
    2015, it is now more capable than ever before and makes the perfect platform for
    your very low power, micro-sized web server.


    In this tutorial we will show you how to set up a LAMP stack (Linux, Apache, MySQL
    and PHP) on your Raspberry Pi. WordPress is one of the most popular content management
    and blogging platforms today, with over 52 million new posts uploaded each month.
    According to the company''s statistics (wordpress.com/), there are more than 19
    billion WordPress pages each month. As far as software goes, WordPress is one
    of the best out there that is available to you - let''s get it running.


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_75_0.png)


    Aaron Shaw

    from Pi Supply

    (ge-supply.com/) and has been involved with Pi since the very beginning enough
    to do this for both of us! Say hello@raspberry.com


    # 04 Test PHP


    Next, develop the default index.html file and then browse to the web server:


    ```

    server root:

    ```


    ```

    cd /var/www

    ```


    ```

    sudo nano index.html

    ```


    ```

    sudo nano index.php

    ```


    open an index.php file for editing and then create the


    # 01 Update Pi


    As we start any Raspberry Pi project, it is best to update your Pi to the latest
    OS before proceeding. You can do this by opening the following commands:


    ```

    sudo apt-get update

    ```


    ```

    sudo apt-get upgrade

    ```


    When prompted, then press Enter to confirm


    # 02 Install the software


    As mentioned in the introduction, a LAMP stack uses Linux (the operating system),
    Apache (the web server), MySQL (the database) and PHP (the programming language).
    We will need to install the web server first, but we will need to install the
    database. To do this, open a terminal window and issue the following:


    ```

    sudo apt-get install apache2 php apache2-mod-php mysql-server php-mysql

    ```


    When the process starts installing MySQL, you will be prompted to enter a root
    password. Make sure you remember this password as we will need it later to enable
    on your server''s access to the database.


    # 03 Test Apache


    You can test the installation of Apache by opening a web browser on your Pi and
    going to http://localhost/ - it should take you to the default Apache ''works''
    page.


    # 05 Download WordPress


    To install WordPress you will need to open a terminal window and navigate to the
    web root. Then change the ownership of the folder to the ''pi'', delete all existing
    files located there and download the WordPress files. To do this, issue the following
    commands:


    ```

    cd /var/www

    ```


    ```

    sudo chmod pi:pi

    ```


    ```

    sudo rm -rf *

    ```


    ```

    wget http://wordpress.org/latest.tar.gz

    ```


    The final step is to extract the archive, move all the files to the web root and
    go back to the original. Do with that:


    ```

    tar xzf latest.tar.gz

    ```


    ```

    mv wordpress/* .

    ```


    ```

    rm -rf wordpress latest.tar.gz

    ```'
