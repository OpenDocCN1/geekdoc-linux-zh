    # 06 Set up the database


    Run MySQL and log in using the following command:


    ```

    mysql -uroot --password

    ```


    ...where ''password'' is the password you set in Step 2. There is no space between
    u and root -p as your password. Once you are logged into MySQL, create the database:


    ```

    create database wordpress;

    ```


    The trailing semicolon is important and the command will not complete without
    it. Then exit MySQL and go back to the terminal line using Ctrl+D.


    # 07 Configure WordPress


    First you need to find out your Raspberry''s IP address from your local network:


    ```

    #hostname

    ```


    This should display your IP address. Open a browser and navigate to 192.168.1.xxx,
    replacing xxx with the end of your IP address. Once you hit the WordPress error
    page, click ''Next''. Create a configuration file in the next directory to set
    up the basic database information with the data we provided above:


    | Database Name | wordpress |

    | Username | root |

    | Password | your-password |

    | Database host | localhost |

    | Table prefix | _ |


    Once the script successfully completes, you will see a new page containing some
    PHP code.


    # 08 Install WordPress


    Copy the text that loaded into the page on Step 7. Minimize the browser and go
    back to the terminal. Now create a new wp-config.php file by:


    ```

    nano wp-config.php

    ```


    Paste the code into the file, press Ctrl+X and then Enter to save, go back to
    the browser and press Enter. You should now be redirected to a Welcome page where
    you can enter your site title, username, password and other details. Once complete,
    you can use http://192.168.1.xxx/wordpress (replacing xxx with your actual IP
    address from your local network) and will be able to access your WordPress dashboard.


    # 09 All done


    Now you have a fully functional website running from your Raspberry Pi. Log in
    to the dashboard, add some posts and comments, and you''re done!


    Above Once everything is correctly set, you''ll be greeted with this intro page


    Using a pretty web domain


    If this is the first time you have set up a website, you might be wondering now
    about how to access the website from your home network or other network of your
    choice. If you do not have a domain name yet, you can also use a free DNS service
    and a custom domain of your choice around on Google and find plenty of options.


