    # Lircd daemon


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_68_0.png)


    The LIRC enables you to decode and transmit infrared signals. The new used in
    this project is the limird daemon that decodes LIRC signals received by the device
    and accepts commands for LIRC signals to be sent. If your hardware supports this,
    you could adapt your project to create a remote control for your media device
    using a simple Apple remote control as the


    Left Signals are sent from the Pi-Motion to your TV through the board''s IR ramp


    # 02 Install the software


    Next install the LIRC software; this stands for Linux Remote Control. It is the
    program that enables you to interact with your television and transmit commands
    accordingly. In the LXTerminal type:


    ```

    sudo apt-get install lirc

    sudo apt-get install lirc-x

    ```


    Restart your Pi. The default GPIO pins used when no pins are specified are pin
    12/GPIO 18 for received infrared signals and pin 13/GPIO 23 for transmitted infrared
    signals.


    # 03 What are all these files?


    It''s worth clarifying file names and folders. All of the files are stored in
    /lirc, and there are two main ones: the LIRC configuration files (lirc.conf and
    lircord.conf). The latter holds all the data about your remote control frequency,
    length, space and header details. This is the file used to emit a remote control.


    # 05 Transmit a signal


    Once your remote is the IR board, use the send tool to record the signals and
    use these measurements to send to your TV. First check the hardware.conf file
    located in /etc/lirc/


    ```

    sudo nano /etc/lirc/hardware.conf

    ```


    Make the following changes:


    ```

    LIRC_AGS = "input"

    DRIVER = "default"

    DEVICE = "devlirc"

    MODULES = "lirc-ir"

    ```


    Press Ctrl+O to save the file - then press y and Return. Now restart the lirc
    daemon by:


    ```

    sudo /etc/init/lirc restart

    ```


    # 04 Test the receiver is working


    To test the receiver you will need to stop the LIRC daemon, enable the test mode
    and run the following command. This program will output the map of your IR signal.
    It measures the frequency and space length of signals. Open LXTerminal and follow
    the commands below, then your control point, at the IR receiver and press some
    buttons:


    ```

    sudo /etc/init/lirc stop

    ```


    ```

    sudo modprobe lirc-irc

    sudo modprobe -d /dev/lirc

    ```


    You should see something like this:


    +   - space 1630

    pulse 95

    space 28794


    # 06 Get a lirc file


    Next complete a lirc.conf file that contains all the information you know about
    the remote and each of its specific functions. (Instead of buttons they are recorded
    as keys). Here is the data you need to create this file, as it is possible to
    use or adapt an existing remote configuration file. This can be found on LIRC
    supported remote web indexes, such as sourceforge.net/remotes. (Some remote configuration
    files will not be available on the LIRC index. You might find more up-to-date
    hosted on the GitHub repository. Download the correct file for your remote and
    save it in the Pi/Home folder. Note that if you''re using a Samsung remote in
    this tutorial.)


