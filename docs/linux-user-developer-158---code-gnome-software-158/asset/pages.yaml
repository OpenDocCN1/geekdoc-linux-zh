    # # Let''s Encrypt get first certificate


    Automated certificate authority passes first milestone


    Let''s Encrypt, a free and automated certificate authority by the Electronic Foundation
    alongside companies like Akamai, Cisco, and Mozilla, has a major milestone: the
    first release.


    With the high cost and complexity of traditional certificate authorities, Let''s
    Encrypt aims to offer certificates at zero cost by automating the process. If
    so, they claimed, it will encourage wider use of Transport Layer Security (TLS)
    cryptography over the Internet.


    "We''re thrilled to be a live CA," claimed Let''s Encrypt''s approach to the certificate
    issuance. ''We''ll be working towards general availability over the next few months
    and issuing certificates to parties participating in the program. It could be
    a month or more until Let''s Encrypt certificates are accepted by the root programs
    of major browser manufacturers and can be used without warning messages.


