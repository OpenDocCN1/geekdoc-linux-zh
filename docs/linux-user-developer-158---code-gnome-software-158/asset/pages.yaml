    complexity theory. A Turing machine is a mathematical

    abstraction of a computer and is used because it helps

    to define the concept of an algorithm, related to

    to computability; the ability of a computer to solve

    a problem or a class of problems. If it proves that a

    problem can be solved by a Turing machine, it can be

    solved by a computer!


    The image on the next page shows a simplified

    of a Turing machine, which consists of a tape divided

    into cells, a head that reads and writes

    symbols on the tape (plus moves the left or

    to right exactly one cell at a time), a state register

    that stores the current state and a finite

    table of instructions (the program). Every

