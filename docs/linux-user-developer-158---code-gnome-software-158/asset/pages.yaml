  md: '# DEIS System Diagram


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_44_0.png)


    # 02 control plane


    The control plane is a set of components that handle the overall DeIS platform.
    As mentioned in the previous step, developers can interact directly with the control
    plane using the DeIS API.


    The major components of the control plane are the controller, builder, registry,
    database and logger. While these seem self-explanatory, they can cause a wrong
    perception when looked at too closely. The controller is an HTTP API server. It
    receives the DeIS API requests and triggers corresponding git pushes. The builder
    component receives the incoming git push, builds a container image from the code
    and pushes it to the registry. It then triggers a new release via the controller.
    The storage component stores all the metadata. The registry is implemented as
    a Docker registry to store the images and other configuration data. The database
    component is a PostgreSQL database. The logger is a logging server used to store
    all the logs from the data plane.


    > Deis is a tool that allows you to deploy a project written in any language or
    framework with a simple git push


    the scheduler to start containers. The scheduler decides which container should
    be running at which machine and starts the containers. These containers are part
    of the data plane. The logger is responsible for publishing logs so that they
    are accessible to other components on the network. It collects logs from running
    containers and sends them to the logger component (control plane).


    # Achieve scale by isolating the


    For deployment, you can use the default settings. But as the deployment grows
    larger, the best way to scale your Deis is to isolate the control plane and the
    router mesh to a smaller, fixed number of nodes. The data plane should be scaled
    as per requirement. This is because the control plane and router mesh have no
    significant bottleneck (they just pass on requests to others), while the data
    plane actually runs the applications which is the most resource hungry part of
    Deis.


    # 03 Data planes


    We have already described the controller and builder components of the control
    plane that interface with the data plane and Git repos. As and when there is new
    code pushed to the Git repo, the control plane swings into action, restarting
    containers with the latest code. These containers are on the data plane.


    Here is how it works: once the controller (control plane) identifies new source
