    \ shows a C program that uses lseek() in various ways. In a file, the rules apply\
    \ when you want to write to the different places of a file. Note that there is\
    \ no point in using lseek() before reading. Creating a new file with lseek can\
    \ be tricky; large files may have holes in them and use fewer disk blocks of the\
    \ same size as without holes; these are sparse.\n\n```\n// Go to the first character\n\
    lseek(fd, 0, 0);\nread(fd, &ch, sizeof(ch));\nprintf(\"%c, %n\", ch);\n```\n\n\
    ```\n// Go back using another method\nlseek(fd, -1, SEEK_CUR);\nread(fd, &ch,\
    \ sizeof(ch));\nprintf(\"%c back again\\n\", ch);\n```\n\n```\n// Get to the last\
