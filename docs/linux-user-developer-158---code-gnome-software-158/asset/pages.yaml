    # OPINION FREE SOFTWARE


    # # Apache''s OpenOffice


    “Let us believe that OpenOffice is still alive and evolving is only the general
    reputation of open office software”


    > Recently Christian Schaller, a Fellow and IBM developer, called on the Apache
    Software Foundation (ASFT) to admit that the Apache OpenOffice project is near
    its death and asked to direct OpenOffice users to the LibreOffice website.

    “Let us believe that OpenOffice is still alive and evolving is only the general
    reputation of open office software among nontechnical users," he wrote, "and thus
    truly believe that it would be in everyone interest to have the remaining OpenOffice
    users to LibreOffice."

    Both Apache OpenOffice and LibreOffice are derived from OpenOffice.org, a spin-off
    after Sun Microsystems. The developers produced a fork of the code, LibreOffice,
    under the auspices of the Document Foundation (TDF). The LibreOffice project was
    started shortly after Sun went down.

    When Sun was bought by Oracle in 2010, OpenOffice was near its end. Because Oracle
    stated that it would go on its own project and that the Apache-driven project
    would fail. After months of revelation by Oracle, the community formed the code
    and started working on LibreOffice. The Document Foundation was created to hold
    the code from both Sun and Oracle, and to create a generous code sharing community.

    A few months later Oracle announced its intention to release OpenOffice to the
    Apache Software Foundation. IBM felt behind the move and announced its intention
    to make “an initial release of the Apache OpenOffice code under a license of both
    IBM and Sun and was willing to release the code under a copyleft license, the
    Mozilla Public License, to make it attractive to both join.” Its advances were
    spurred and the Apache branch became IBM''s favoured route. There were now two
    offices and two prospective communities.

    The teams and divisions that give rise to both TDF and Apache OpenOffice dated
    back to 2000 when Sun Microsystems originally released the code of


    StarChoice to the open source community under the OpenOffice moniker. however
    as the code was made available to anyone, ownership of the code was retained by
    Sun and project was kept in-house.

    In the beginning, Sun licensed the code under a dual LGPL license. This was a
    permissive license and permitted reuse of the code in proprietary products by
    third parties. IBM released its version of the code based on OpenOffice 1.1.4,
    the last release to be released by Sun. IBM modified the code, which it had no
    authority under the SISPL to do so because the SISPL enabled it to do so.

    As response to IBM''s refuse of the code, Sun dropped in September 2005 and subsequent
    development of the OpenOffice project was started by Apache, which initiated the
    inclusion of the code in IBM''s derivatives. As a result, IBM formed the OpenOffice
    project in 2007 and continued development of OpenOffice in Lotus Series, by IBM
    under a permissive agreement with Sun.

    This agreement and the effort of the TDF were the only way to unlock the block
    of code placed on signatories to join the LibreOffice community. This agreement
    was necessary because only a permissive license allowed to distribute the code
    to many developers.

    When Oracle bought Sun, IBM could have chosen a different route: to develop LibreOffice,
    under a permissive license which allowed it to contain many develops that LibreOffice
    would favour. This was a political and strategic mistake. LibreOffice has surpassed
    Apache OpenOffice in code and features years ahead.

    This is of little consequence to users using the inferior code. Windows users
    who are familiar with OpenOffice are still to an inferior connected to its development.
    Schalter is not in belief that the open source community would be better if Apache
    OpenOffice were to to clear the decks and fold its assets into LibreOffice.


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_7_0.png)


