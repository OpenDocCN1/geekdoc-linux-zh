    # Create a scatter plot


    A scatter plot can reveal the strength of the relationship between variables in
    a graphical way. The data will be used in the program to show the results of a
    survey on how various still remain lessons from their secondary school. The myData
    holds all the data is an array of objects and is hardcoded in the JavaScript program.
    Each point is scaled according to the number of responses, as answers to how each
    point is ''accurate'' each point.


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_42_0.png)


    ![](img/2f88ea4367b9bd5792b1a33e619a1113_42_1.png)


