    to collectively as the Chakra project). It is an Arch Linux exclusive, community-driven
    system, designed for modularity and offers a choice between KDE 3.5.10 or 4.x.x.
    KDEmod can be installed with pacman, after adding the proper repository to /etc/pacman.conf.
    The project website, including complete installation instructions, can be found
    at http://www.chakra-project.org/.'
