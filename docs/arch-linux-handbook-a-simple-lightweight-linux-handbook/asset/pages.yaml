  md: '# agetty and login


    After the Arch boot scripts are completed, the gettyty program prompts you for
    a login name. After a login name is received, agetty calls login to prompt for
    the login password.


    Finally, with a successful login, the login program starts your default shell.
    The default shell and environment variables may be globally defined within /etc/profile.
    All variables within a users home directory shall take precedence over those globally
    defined under /etc/profile. For instance, if 2 conflicting variables are specified
    within /etc/profile and ~/.bashrc, the one dictated by ~/.bashrc shall prevail.'
