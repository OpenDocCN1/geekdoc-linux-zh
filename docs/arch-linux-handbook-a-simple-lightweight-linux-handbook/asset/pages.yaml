  md: '# Preface


    Everything you ever wanted to know about Arch, but were afraid to ask


    Welcome. This self-contained document will guide you through the process of installing
    and configuring Arch Linux; a simple, agile and lightweight GNU/Linux distribution,
    UNIX-like operating system. Arch Linux requires a certain level of intimate knowledge
    of its configuration and of UNIX-like system methodology and for this reason,
    extra explanatory information is included. This guide is aimed at new Arch users,
    but strives to serve as a strong reference and informative base for all.


    Arch Linux distribution highlights:


    +   Simple, UNIX-like design and philosophy

    Independently Developed Community distro built from scratch and targeted at competent
    GNU/Linux users

    All packages compiled for i686/x86-64

    High customizable system assembled by the user from the ground up

    BSD-style init scripts, featuring one centralized configuration file

    mkinitcpio: a simple and dynamic initramfs creator

    Rolling Release model

    Pacman package manager is fast, written in C, lightweight and agile, with a very
    modest memory footprint

    ABS: The Arch Build System, a ports-like package building system makes it simple
    to create your own easily installable Arch packages from source, to use and/or
    share with the community on the AUR

    AUR: The Arch User Repository, offering many thousands of build scripts for Arch
    user-provided software packages'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# Arch Linux Handbook


    # DON''T PANIC !


    The Arch Linux system is assembled by the *user*, from the shell, using basic
    command line tools. This is **The Arch Way**. Unlike the more rigid structures
    of other distributions and installers, there are no default environments or configurations
    chosen for you. From the command line, *you* will add packages from the Arch repositories
    using the pacman tool via your internet connection and manually configure your
    installation by editing text files until your system is customized to your requirements.
    You will also manually add non-root user(s) and manage groups and permissions.
    This method allows for maximum flexibility, choice, and system resource control
    from the base up.


    Arch Linux is aimed at competent GNU/Linux users who desire minimal ''code separation''
    from their machine.


    # License


    Arch Linux, pacman, documentation and scripts are copyright ©2002-2007 by Judd
    Vines, ©2007-2009 by Aaron Griffin and are licensed under the GNU General Public
    License Version 2.


    # The Arch Way


    **The design principles behind Arch are aimed at keeping it simple.**


    ''Simple'', in this context, shall mean ''without unnecessary additions, modifications,
    or complications''.. In short: an elegant, minimalist approach.


    # Some thoughts to keep in mind:


    +   - "Simple'' is defined from a technical standpoint, not a usability standpoint.
    It is better to be technically elegant with a higher learning curve, than to be
    easy to use and technically [inferior]." -Aron Griffin

    - Entia non sunt multiplicanda praeter necessitat or "Entities should not be multiplied
    unnecessarily." -Occam''s razor. The term *razor* refers to the act of shaving
    away unnecessary complications to arrive at the simplest explanation, method or
    theory.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '> "The extraordinary part of [my method] lies in simplicity..The height of
