    You should hear a very eloquent woman say, "Front, center."


    # Saving the Sound Settings


    Exit your normal user shell and run /usr/sbin/alsactl as root:


    ```

    $ exit

    # alsactl store

    ```


    This will create the file ''/etc/asound.state'', saving the alsamixer settings.


    Also, add the alsa daemon to your DAEMONS section in /etc/rc.conf to automatically
    restore the mixer settings on boot-up.


    ```

    # nano /etc/rc.conf

    DAEMONS=(syslog-ng network crond alsa)

    ```


    Note that the alsa daemon merely restores your volume mixer levels on boot up
    by reading /etc/asound.state. It is separate from the alsa audio library (and
    kernel level API).


