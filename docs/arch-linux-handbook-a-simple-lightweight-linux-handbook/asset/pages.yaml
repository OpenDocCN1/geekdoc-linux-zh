  md: '# Turn off Control Echo in Bash


    Some users may have noticed that since the readline update their terminal has
    been displaying ^C after ctrl+c has been pressed. While this is not a problem,
    it can be annoying. For any users who wish to disable this, simply add the following
    to /etc/profile or $HOME/.bash_profile:


    ```

    stty -ctlecho

    ```


