- img_proc: true
  md: '# Additional tweaks for laptops


    ACPI support is needed if you want to use some special functions on your notebook
    (e.g. sleep, sleep when lid is closed, special keys...). Install `acpid` using


    ```

    pacman -S acpid

    ```


    and add it to the daemons in /etc/rc.conf. If you already have hal specified in
    your DAEMONS, there is no need to add acpid. HAL will automatically detect and
    load the acpid daemon. Manually, it can be started by


    ```

    /etc/rc.d/acpid start

    ```


    More-specific information about Arch Linux on various Laptops can be found at
    Category:Laptops (English)


    # Configuring CPU frequency scaling


    Modern processors can decrease their frequency and voltage to reduce heat and
    power consumption. Less heat leads to a quieter system; Laptop users will definitely
    want this, but even a desktop system will benefit from it. Install cpufrequtils
    with


    ```

    pacman -S cpufrequtils

    ```


    Edit the config file /etc/conf.d/cpufreq and change'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# Arch Linux Handbook


    ```

    governor="ondemand"

    ```


    which dynamically increases the CPU frequency if needed (which is a safe choice
    on desktop systems too). Alter min_freq and max_freq to match your system''s CPU
    spec. If you do not know the frequencies, run cpufreq-info after loading one of
    the frequency scaling modules. You can also comment out or delete the min_freq
    and max_freq lines: things will work automatically. Add the frequency scaling
    modules to your /etc/rc.conf modules line. Most modern notebooks and desktops
    can simply use the acpi-cpufreq driver, however other options include the p4-clockmod-k6,
    powernow-k7, powernow-k8, and speedstep-centrino drivers. Load the module with


    ```

    modprobe <modulename>

    ```


    and start cpufreq.d with


    ```

    /etc/rc.d/cpufreq start

    ```


    For more details, see Cpufrequtils


    # Pm-Utils


    The pm-utils package will allow you to suspend-to-RAM and hibernate:


    ```

    pacman -S pm-utils

    ```


    Pm-utils wiki page.


