  md: '# Arch Linux Handbook


    Pacman is the most important tool in the Arch Linux toolbox for building the base
    system into whatsoever you please.


    # Package Repositories and /etc/pacman.conf


    Arch currently offers the following 4 repositories readily accessible through
    pacman:


    [core]


    The simple principle behind [core] is to provide only one of each necessary tool
    for a base Arch Linux system; The GNU toolchain, the Linux kernel, one editor,
    one command line browser, (There are a few exceptions to this. For instance, both
    vi and nano are provided, allowing the user to choose one or both.) It contains
    all the packages that MUST be in perfect working order to ensure the system remains
    in a usable state. These are the absolute system-critical packages.


    +   - Developer maintained

    - All binary packages

    - pacman accessible

    - The Core installation media simply contains an installer script, and a snapshot
    of the core repository at the time of release.


    [extra]


    The [extra] repository contains all Arch packages that are not themselves necessary
    for a base Arch system, but contribute to a more full-featured environment. X,
    KDE, and Apache, for instance, can be found here.


    +   - Developer maintained

    - All binary packages

    - pacman accessible


    [testing]


    The [testing] repository contains packages that are candidates for the [core]
    or [extra] repositories. New packages go into [testing] if:'
