    # Configure Network (FTP/HTTP)


    Available Interfaces will be presented. If an interface and HWaddr (HardWare address)
    is listed, then your module has already been loaded. If your interface is not
    listed, you may probe it from the installer, or manually do so from another virtual
    console.


    The following screen will prompt you to Select the interface, Probe, or Cancel.
    Choose the appropriate interface and continue.


    The installer will then ask you if you wish to use DHCP. Choosing Yes will run
    dhcpcd to discover an available gateway and request an IP address; Choosing No
    will not prompt you for your static IP, netmask, broadcast, gateway DNS IP, HTTP
    proxy, and FTP proxy. Lastly, you will be presented with an overview to ensure
    your entries are correct.


