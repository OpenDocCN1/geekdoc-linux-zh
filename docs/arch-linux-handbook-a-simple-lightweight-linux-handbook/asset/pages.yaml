  md: '# Arch Linux Handbook


    # G: Install Bootloader


    Because we have no secondary operating system in our example, we will need a bootloader.
    GNU GRUB is the recommended bootloader. Alternatively, you may choose LILO.


    # GRUB


    The provided GRUB configuration (/boot/grub/menu.lst) should be sufficient, but
    verify its contents to ensure accuracy (specifically, ensure that the root (/)
    partition is specified by UUID on line 3). You may want to alter the resolution
    of the console by adding a vga=<number> kernel argument corresponding to your
    desired virtual console resolution. (A table of resolutions and the console numbering
    is printed in the menu.lst).


    Example:


    ```

    title Arch Linux (Main)

    root (hd0,0)

    kernel /boot/vmlinuz26 root=/dev/disk/by-uuid/0ec1-9339.. ro vga=773

    initrd /boot/kernel26.img

    ```


    > **Note:** The linux kernel, ''vmlinuz'', is so named because it incorporated
    virtual memory capability early in its development. The **z** denotes a zipped
    (compressed) image.


    Explanation:


    Line 1: **title**: A printed menu selection. "Arch Linux (Main)" will be printed
    on the screen as a menu selection.


    Line 2: **root**: GRUB''s root; the drive and partition where the kernel (/boot)
    boots, according to system BIOS. (More accurately, where GRUB''s stage2 file resides).
    **NOT necessarily the root** (/) file system, as they can reside on separate partitions.
    GRUB''s numbering scheme starts at 0, and uses hdx,x format regardless of IDE
    or SATA, and enclosed within parentheses.


    42'
  merge: -1
  pgno: 45
- img_proc: true
  md: 'The example indicates /boot is on the first partition of the first drive, according
    to BIOS, or, (hd0,0).


    Line 3: **kernel**: This line specifies:


    +   - The path and filename of the kernel **relative to GRUB''s root**.


    In the example, /boot is merely a directory residing on the same partition as
    / **vmlinuz26** is the kernel filename; **/boot/vmlinuz26** were on a separate
    partition, the path and filename would be simply **/vmlinuz26**, being relative
    to **GRUB**.


    +   - The root= argument to the kernel statement specifies the partition containing
    the root (/) directory in the booted system, (more accurately, the partition containing
    /sbin/init). If not already specified, you should enter the name of the partition,
    according to the UUID numbering scheme, using the /dev/disk/by-uuid/xxxx-xxxx-xxxx-xxxx
    format. This UUID was found in the previous section regarding configuration of
    /etc/fstab.


    +   - An easy way to distinguish the 2 appearances of ''root'' in /boot/menu.lst
    is to remember that the first root statement informs GRUB where the kernel resides,
    whereas the second root= kernel argument tells the kernel where the root filesystem
    (/) resides.


    +   - Kernel options.


    In our example, **ro** mounts the filesystem as read only during startup, and
    the **vga=773** argument will give a 1024x768 framebuffer with 256 color depth.


    Line 4: **initrd** (For Initial RAM disk) The path and filename of the initial
    RAM filesystem **relative to GRUB**''s root. Again, in the example, /boot is merely
    a directory residing on the same partition as / and **kernel26.img** is the initrd
    filename; **/boot/kernel26.img**. If /boot were on a separate partition, the path
    and filename would be simply **/kernel26.img**, being relative to **GRUB**''s
    root.


    Install the **GRUB** bootloader (to the master boot record, sda in our example).'
