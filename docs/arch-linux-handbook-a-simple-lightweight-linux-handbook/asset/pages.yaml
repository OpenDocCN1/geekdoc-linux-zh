- img_proc: true
  md: '# Arch Boot Process


    After the initial POST, the BIOS directs the computer to load a boot sector from
    the hard drive. Actually, a small program called GRUB stage1 is contained within
    this. This is a tiny program. Its only function is to load GRUB stage1.5 or stage2
    (depending on filesystem type).


    GRUB stage1.5/stage2 will present a boot menu with various (customizable) choices
    of operating systems to boot. The path to the device, partition and filename of
    the kernel and initial ram filesystem in GRUB in /boot/grub/menu.lst.


    After choosing an Arch Linux entry, GRUB loads the Linux kernel. The kernel is
    the core of an operating system. It functions on a low level (kernelspace) interacting
    between the hardware of the machine, and the programs which use the hardware to
    run. To make efficient use of the cpu, the kernel uses a scheduler to arbitrate
    which tasks take priority at any given moment, creating the illusion (to human
    perception) of many tasks being executed simultaneously.


    After the kernel is loaded, it reads from the initramfs. The purpose of initramfs
    is to bootstrap the system to the point where it can access the root filesystem.
    This means it has to load any modules that are required for devices like IDE,
    SCSI, or SATA drives (or USB/FW, if you are booting off a USB/FW drive). Once
    the initramfs loads the proper modules, either manually or through udev, it passes
    control to the kernel and the boot process continues. For this reason, the initrd
    only to contain the modules necessary to access the root filesystem. It does not
    need to contain every module you would ever want to use. The majority of your
    everyday modules will be loaded later on by udev, during the init process.


    The kernel then looks for the program init which resides at /bin/init. init relies
    on glibc, the GNU C library. Libraries are collections of frequently used program
    routines and are readily identifiable through their filename extension of *.so.
    They are essential for basic system functionality. This part of the boot process
    is called early userspace.'
  merge: -1
  pgno: 138
- img_proc: true
  md: '# Arch Linux Handbook


    The purpose of init is to bring (and keep) the system up into a usable state.
    It uses the boot scripts to do so. As you may be aware, Arch uses BSD-style boot
    scripts. init reads the file /etc/inittab, which tells it what to do. Looking
    over the inittab script, you will find that the uncommented line defines the default
    system runlevel, or 3. The next thing it is told to do is to run an initialization
    script. The program that executes (or interprets) this script is bash, the same
    program that gives you a command prompt. In Arch Linux, the main initialization
    script is /etc/rc.sysinit. It also defines your virtual consoles, which are ''respawned''
    by /sbin/init if terminated. Lastly, inittab defines a login manager, if starting
    the system at runlevel 5 is desired. By the login manager is also respawned by
    /sbin/init if terminated.


    /etc/inittab directs init to call the first boot script, /etc/rc.sysinit, after
    which /etc/rc.multi will be called (in a normal boot). The last script to run
    will be /etc/rc.local, which is empty by default.


    When started in runlevel 1, the single user mode, the script /etc/rc.single is
    run instead of /etc/rc.multi. You will not find an endless symlink collection
    in the /etc/rc?.d/ directories to define the boot sequence for all possible runlevels.
    In fact, due to this approach Arch only really has three runlevels, if you take
    starting up X in runlevel 5 into account. The boot scripts are using the variables
    and definitions found in the /etc/rc.conf file and also a set of general functions
    defined in the /etc/rc.d/functions script. If you plan to write your own daemon
    files, you should consider having a look at this file and existing daemon scripts.


    # Boot Script Overview


    +   1. /etc/inittab (covered above)

    2. /etc/rc.sysinit

    3. /etc/rc.single

    4. /etc/rc.multi

    5. /etc/rc.local

    6. /etc/profile'
  merge: -1
  pgno: 139
- img_proc: true
  md: '+   7. /etc/rc.shutdown

    8. /etc/rc.local.shutdown

    9. /etc/rc.d/*


    # /etc/rc.sysinit


    The main system boot script, which mounts filesystems, runs udev, activates swap,
    loads modules, sets localization parameters, etc. When called, udev shall probe
    system hardware, loading appropriate kernel modules and creating device nodes
    /dev. For more, open /etc/rc.sysinit in your editor of choice; the file is well
    commented.


    # /etc/rc.single


    Single-user startup. Not used in a normal boot-up. If the system is started in
    single-user mode, for example with the kernel parameter 1 before booting or during
    normal multi-user operation with the command init 1, this script makes no daemons
    are running except for the bare minimum; syslog-ng and udev. The single-user mode
    is useful if you need to make any changes to the system making sure that no remote
    user can do anything that might cause data loss or damage. For desktop users,
    this mode is usually useless.


    # /etc/rc.multi


    Multi-user startup script. It starts all daemons (such as a logger, a network
    script, etc) specified in the DAEMONS= array in /etc/rc.conf, after which it calls
    /etc/rc.local.


    # /etc/rc.local


    Local multi-user startup script. Empty by default. It is a good place to put any
    last-minute commands you want the system to run at the very end of the boot process.
    Most common system configuration tasks, like loading modules, changing the console
    font or setting up devices, usually have a dedicated place where they belong.
    To avoid confusion, you should make sure that whatever you intend to add to your
    rc.local is not already residing in /etc/profile.d/, or any other existing configuration
    location instead.'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# Arch Linux Handbook


    /etc/profile This script is run on each user login to initialize the system. It
    globally defines PS1, $PATH, bash aliases, etc. It is kept quite simple under
    Arch Linux, as most things are. You may wish to edit or customize it to suit your
    needs.


    /etc/rc.shutdown


    System shutdown script. It stops daemons, unmounts filesystems, deactivates the
    swap, etc.


    /etc/rc.local.shutdown (Optional)


    Analogous to the /etc/rc.local file, this file may contain any commands you want
    to run right before the common rc.shutdown is executed. Please note that this
    file does not exist by default, and for it to work properly, it must be set as
    executable.


    /etc/rc.d/*


    This directory contains the daemon scripts referred to from the rc.conf''s DAEMONS=
    array. In addition to being called on boot, you can use these scripts when the
    system is running to manage the services of your system. For example the command


    ```

    /etc/rc.d/postfix stop

    ```


    will stop the postfix daemon. This directory is not in the $PATH by default, but
    may be added for convenience. Obviously a corresponding daemon script only exists
    when the appropriate package has been installed (in this case postfix). With a
    base system install, there are few scripts in here, but rest assured that all
    relevant daemon scripts end up here. If you wish, you can, of course, create your
    own scripts and place them here, to be called by the DAEMONS= array in /etc/rc.conf
    on system startup.


    This directory is pretty much the equivalent to the /etc/rc3.d/ or /etc/init.d/
    directories of other distributions, but without all the symlink hassle. The lack
    of symlink requirement is a defining difference of a *BSD-style init framework,
    vs a sysinit.'
  merge: -1
