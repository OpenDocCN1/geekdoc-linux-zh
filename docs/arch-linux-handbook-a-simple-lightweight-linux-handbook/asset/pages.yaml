  md: '# Part II: Configure&Update the New Arch Linux base system


    # The Arch rolling release model


    Keep in mind that Arch is a rolling release distribution. This means there is
    never a reason to reinstall or perform elaborate system rebuilds to the newest
    version. Simply issuing pacman -Syu periodically keeps your entire system up-to-date
    and on the bleeding edge. At the end of this upgrade, your system is completely
    current. Reboot if a kernel upgrade has occurred.


    # Network Time Protocol


    You may wish to set the system time now using OpenNTPD to sync the local clock
    to remote NTP servers. OpenNTPD may also be added to the DAEMONS= array in /etc/rc.conf
    to provide this service at each boot. (See the Network Time Protocol article.)


    # Step 4: Add a user and setup groups


    UNIX is a multi-user environment. You should not do your everyday work using the
    root account. It is more than poor practice; it is dangerous. Root is for administrative
    tasks. Instead, add a normal, non-root user account using the /usr/sbin/useradd
    program:


    ```

    # useradd -m -G [groups] -s [login_shell] [username]

    ```


    +   -m Creates user home directory as /home/username. Within their home directory,
    a user can write files, delete them, install programs, etc. Users'' home directories
    shall contain their data and personal configuration files, the socalled ''dot
    files'' (their name is preceded by a dot). (To view dotfiles, enable the appropriate
    option in your file manager or run ls -a switch.) If there is a conflict between
    user (under /home/username) and global configuration files (usually under /etc/)
    the settings in the user file will prevail. Dotfiles likely to be altered by the
    end user include .xinitrc and .bashrc files. The configuration files for xinit
    and Bash respectively.'
