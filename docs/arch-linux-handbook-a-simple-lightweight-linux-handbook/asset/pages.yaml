    # Step 3: Update System


    You are now ready to upgrade your entire system. Before you do, read through the
    news (and optionally the announce mailing list). Often the developers will provide
    important information about fixes for known issues. Consulting these pages before
    any upgrade is good practice.


    Sync, refresh, and upgrade your entire new system with:


    ```

    # pacman -Syu

    ```


    you may also use:


    ```

    # pacman --sync --refresh --sysupgrade

    ```


    pacman will now download a fresh copy of the master package list from the server(s)
    defined in pacman.conf(5) and perform all available upgrades. (You may be prompted
    to upgrade pacman itself at this point. If so, say yes, and then reissue the pacman
    -Syu command when finished.)


    Reboot if a kernel upgrade has occurred.


    **Note:** Occasionally, configuration changes may take place requiring user action
    during an update; read pacman''s output for any pertinent information.


    Pacman output is saved in /var/log/pacman.log.


    See Package Management FAQs for answers to frequently asked questions regarding
    updating and managing your packages.'
