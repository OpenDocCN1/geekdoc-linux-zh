  md: '# Part I: Install the Base System


    # Part I: Install the Base System


    # Step 1: Obtain the latest Installation media


    You can obtain Arch''s official installation media from http://archlinux.org/download/.
    The latest version is 2009.08


    +   * Both the Core installer and the FTP/HTTP-downloads provide only the necessary
    packages to create an Arch Linux base system. Note that the Base System does not
    include a GUI. It is mainly comprised of the GNU toolchain (compiler, assembler,
    linker, libraries, shell, and a few useful utilities), the Linux kernel, and a
    few extra libraries and modules.

    * The isolinux images are provided for people who experience trouble using the
    grub version. There are no other differences.

    * The Arch64 FAQ (http://wiki.archlinux.org/index.php/Arch64_FAQ ) can help you
    chose between the 32- and 64-bit versions.


    # CD installer


    Burn the .iso to a CD with your preferred burner, and continue with Step 2: Boot
    Arch Linux Installer


    **Note:** Optical drives as well as CD media quality vary greatly, but generally,
    using a slow burn speed is recommended for reliable burns; Some users recommend
    speeds as low as 4x or 2x. If you are experiencing unexpected behavior from the
    CD, try burning at the minimum speed supported by your system.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Arch Linux Handbook


    # USB stick


    Warning: This will irrevocably destroy all data on your USB stick.


    # UNIX Method:


    Insert an empty or expendable USB stick, determine its path, and dump the .img
    to the USB stick with the /bin/dd program:


    ```

    dd if=archlinux-2009.08-[core_or_ftp]-i686.img of=/dev/sdx

    ```


    where if= the path to the img file and of= your USB device. Make sure to use /dev/sdx
    and not /dev/sdx1.


    # Check md5sum (optional):


    Make a note of the number of records (blocks) read in and written, then perform
    the following check:


    ```

    dd if=/dev/sdx count=number_of_records status=noxfer | md5sum

    ```


    The md5sum returned should match the md5sum of the downloaded archlinux image
    file; they both should match the md5sum of the image as listed in the md5sums
    file in the mirror distribution site.


    # Windows Method:


    Download Disk Imager from https://launchpad.net/win32-image-writer/+download.
    Insert flash media. Start the Disk Imager and select the image file. Select the
    Drive letter associated with the flash drive. Click "write".


    Continue with Step 2: Boot Arch Linux Installer'
  merge: -1
  pgno: 13
