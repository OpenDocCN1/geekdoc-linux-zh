    # /etc/mkinitcpio.conf


    This file allows you to fine-tune the initial ram filesystem (also commonly referred
    to as the initial ramdisk or "initrd") for your system. The initrd is a gzipped
    image that is read by the kernel during boot. The purpose of the initrd is to
    bootstrap the system to the point where it can access the root filesystem. This
    means it has to load any modules that are required for devices like IDE, SCSI,
    or SATA drives (USB/FW, if you are booting off a USB/FW drive). Once the initrd
    loads the proper modules, either manually or through udev, it passes control to
    the Arch system and your boot continues. For this reason, the initrd only needs
    to contain the modules needed to contain the root filesystem. It does not need
    to contain every module you would ever want to use. The majority of your everyday
    modules will be loaded later on by udev, during the init process.


    mkinitcorto is the next generation of initramfs creation. It has many advantages
    over the old mkinitrd and mkinitramfs scripts.


    +   - It uses klibc and kinit which are developed by Linux kernel devs to provide
    a small and lightweight base for early userspace.

    - It can use udev for hardware autodetection at runtime, thus prevents you from
    having tons of unnecessary modules loaded.

    - Its hook-based init script is easily extendable with custom hooks, which can
    easily be included in pacman packages without having to modify mkinitcpio itself.'
  merge: -1
