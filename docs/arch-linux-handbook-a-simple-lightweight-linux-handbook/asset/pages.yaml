  md: '# Part II: Configure&Update the New Arch Linux base system


    unless you''re about to use rather odd ISDN hardware. After physically installing
    your ISDN card in your machine or plugging in your USB ISDN-Box, Nearly all passive
    ISDN PCI cards are handled by the hisax module, which needs two parameters: type
    and protocol. You must set protocol to ''1'' if your country uses the 1TR6 standard,
    ''2'' if it uses EuroISDN (EDSS1), ''3'' if you''re hooked to a so-called leased-line
    without D-channel, and ''4'' for US NI1.


    Details on all those settings and how to set them is included in the isdn subdirectory,
    and available online. The type parameter depends on your card; a list of all possible
    types can be found in the README.HiSax kernel documentation. Choose your card
    and and load the module with the appropriate options like:


    ```

    # modprobe hisax type=18 protocol=2

    ```


    This will load the hisax module for my ELSA Quickstep 1000PCI, being used in Germany
    with the EDSS1 protocol. You should find helpful debugging output in your /var/log/everything.log
    file, in which you should see your card prepared for action. Please note that
    you will probably need to load some USB modules before you can work with an external
    USB ISDN Adapter.


    Once you have confirmed that your card works with certain settings, you can add
    the module options to your /etc/modprobe.conf:


    ```

    alias ippp0 hisax

    options hisax type=18 protocol=2

    ```


    Alternatively, you can add only the options line here, and add hisax to your MODULES
    array in the rc.conf. It''s your choice, really, but this example has the advantage
    that the module will not be loaded until it''s really needed.


    That being done, you should have working, supported hardware. Now you need the
    basic utilities to use it!'
