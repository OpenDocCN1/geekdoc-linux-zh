    # /etc/resolv.conf (for Static IP)


    The resolver is a set of routines in the C library that provide access to the
    Internet Domain Name System (DNS). One of the main functions of DNS is to translate
    domain names into IP addresses, to make the Web a friendlier place. The resolver
    configuration file, or /etc/resolv.conf, contains information that is read by
    the resolver routines the first time they are invoked by a process.


    +   - If you are using DHCP, you may safely ignore this file, as by default, it
    will be dynamically created and destroyed by the dhcpcd daemon. You may change
    this default behavior if you wish. (See Network).


    If you use a static IP, set your DNS servers in /etc/resolv.conf (nameserver <ip-address>).
    You may have as many as you wish. An example, using OpenDNS:


    ```

    nameserver 208.67.222.222

    nameserver 208.67.220.220

    ```


    If you are using a router, you will probably want to specify your DNS servers
    in the router itself, and merely point to it from your /etc/resolv.conf, using
    your router''s IP (which is also your gateway from /etc/rc.conf), e.g.:


    ```

    nameserver 192.168.1.1

    ```


    If using DHCP, you may also specify your DNS servers in the router, or allow automatic
    assignment from your ISP, if your ISP is so equipped.


