    # su - username

    $ mkdir -p ~/.config/openbox/

    $ cp /etc/xdg/openbox/rc.xml ~/.config/openbox/

    $ cp /etc/xdg/openbox/menu.xml ~/.config/openbox/

    ```


    **rc.xml** is the main configuration file for OpenBox. It may be manually edited,
    (or you can use OBconf). **menu.xml** configures the right-click menu.


    You may log into OpenBox via graphical login using KDM/GDM, or from the shell
    using startx, in which case you will need to edit your ~/.xinitrc (as non-root
    user) and add the following:


    ```

    exec openbox-session

    ```


    NOTE: If you plan on running dbus (which is required by hal) then make sure your
    ~/.xinitrc reads:


    ```

    exec dbus-launch --exit-with-session openbox-session

    ```


    You may also start OpenBox from the shell using **xinit**:


    ```

    $ xinit /usr/bin/openbox-session

    ```


    +   - Openbox may also be used as the window manager for GNOME, KDE, and Xfce.


    For KDM there is nothing left to do; openbox is listed in the sessions menu in
    KDM.


    Some useful, lightweight programs for OpenBox are:


    +   - PyPanel, Tint2, or LXpanel if you want a panel

    - feh if you want to set the background

    - ROX if you want a simple file manager (also provides simple icons)

    - PcmanFM a lightweight but versatile file manager (also provides desktop icon
    functionality)'
