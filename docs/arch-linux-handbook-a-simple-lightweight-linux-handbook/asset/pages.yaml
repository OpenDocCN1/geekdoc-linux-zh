- img_proc: true
  md: '# Arch Linux Handbook


    Everything you ever wanted to know about Arch Linux but were afraid to ask. This
    comprehensive little manual was derived from the famous Arch Linux Beginner''s
    Guide. It tells you everything you need to know to get started with Arch Linux,
    the "simple, lightweight Linux Distribution.


    Arch Linux was the brainchild of Canadian programmer, Judd Vinet, in 2002. Seven
    years later it is the most popular KISS distribution on the planet. Maintained
    by a core of enthusiastic developers, Arch Linux is also well known for its community-edited
    projects, such as this beginner''s guide.


    Welcome to Arch Linux, where they always come back.


    ![](img/fd9f451004d73987bd1e67ed7594218c_171_0.png)'
  merge: -1
  pgno: 171
