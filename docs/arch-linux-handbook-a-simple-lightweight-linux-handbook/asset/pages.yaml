  md: '# Arch Linux Handbook


    Choose Done to leave this menu and continue with "Set Filesystem Mountpoints".


    **Note:** Since the latest developments of the Linux kernel which include the
    libata and PATA modules, all IDE, SATA and SCSI drives have adopted the sdx naming
