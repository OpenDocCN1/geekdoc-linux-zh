    The KDE Desktop Environment. KDE is a powerful Free Software graphical desktop
    environment for GNU/Linux and UNIX workstations. It combines ease of use, contemporary
    functionality, and outstanding graphical design with the technological superiority
    of UNIX-like operating systems.


    # Installation


