    A startkde or startxfce4 command starts the KDE or Xfce4 desktop environment.
    This command does not finish until you logout of the DE. Normally the shell would
    wait for KDE to finish, then run the next command. The "exec" prefix to this command
    tells the shell that this is the last command, so the shell does not need to wait
    to run a subsequent command.


    If you have trouble with automounting, use the following command instead. Replace
    "startxfce4" with the command that is appropriate for your window manager.


    ```

    exec ck-launch-session startxfce4

    ```


    Remember to have only one uncommented exec line in your ~/.xinitrc.


