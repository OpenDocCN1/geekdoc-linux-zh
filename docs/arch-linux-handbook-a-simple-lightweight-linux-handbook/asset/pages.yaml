  md: "# Partition Hard Drives\n\n# Partition Info\n\nPartitioning a hard disk drive\
    \ defines specific areas (the partitions) within the disk, that will each appear\
    \ and behave as a separate disk and upon which a filesystem may be created (formatted).\n\
    \n+   - There are 3 types of disk partitions:\n  1. Primary\n  2. Extended\n \
    \ 3. Logical\n\n**Primary** partitions can be bootable, and are limited to 4 partitions\
    \ per disk or raid volume. If a partitioning scheme requires more than 4 partitions,\
    \ an **extended** partition which will contain **logical** partitions will be\
    \ required.\n\nExtended partitions are not usable by themselves; they are merely\
    \ a \"container\" for logical partitions. If required, a hard disk shall contain\
    \ only one extended partition; which shall then be sub-divided into logical partitions.\n\
    \nWhen partitioning a disk, one can observe this numbering scheme by creating\
    \ primary partitions sda1-3 followed by creating an extended partition, sda4,\
    \ and subsequently creating logical partition(s) within the extended partition;\
    \ sda5, sda6, and so on.\n\n# Swap Partition\n\nA swap partition is a place on\
    \ the drive where virtual ram resides, allowing the kernel to easily use disk\
    \ storage for data that does not fit into physical RAM.\n\nHistorically, the general\
    \ rule for swap partition size was 2x the amount of physical RAM. Over time, as\
    \ computers have gained ever larger memory capacities, this rule has become increasingly\
    \ deprecated. Generally, on machines with up to 512MB RAM, the 2x rule is usually\
    \ quite sufficient. On machines with 1GB RAM, generally a 1x rule is adequate.\
    \ If the installation machine provides gratuitous amounts of RAM (more than 1024\
    \ MB) it may be"
  merge: -1
  pgno: 20
