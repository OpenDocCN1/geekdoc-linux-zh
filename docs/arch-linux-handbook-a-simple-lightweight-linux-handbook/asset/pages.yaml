    # HAL


    Since you have now installed a desktop environment/window manager, and if you
    did not do so earlier, now would be a good time to also install HAL. HAL allows
    plug-and-play for your mobile phone, your iPod, your external HD''s, etc. It will
    mount the device and make a nice visual icon on your desktop and/or in ''My Computer'',
    allowing you to access the device after you have plugged it in instead of having
    to manually configure the /etc/fstab file or udev rules for each and every new
    device.


    KDE, GNOME and XFCE use all HAL.


    The installation procedure is described in the HAL article. Some information can
    also be found at Wikipedia.


    # Backgrounding DAEMONS on startup


    To speed up system start up procedure, background selected DAEMONS in /etc/rc.conf
    by prefixing them with a ''@'' e.g.:


    ```

    DAEMONS=(syslog-ng @network crond @alsa @hal @fam @kdm)

    ```


    This will enable daemons to load in the background, without waiting for the preceding
    daemon to load first. In some cases, this may cause issues, especially if you
    require daemons to start in the specified order.


    Prefix any daemons which you do not need with a bang (!) e.g.:


    ```

    DAEMONS=(syslog-ng @network !netfs !crond @alsa @hal @fam @kdm)

    ```


    (Alternatively, you may also simply remove unneeded daemons from the array).'
  merge: -1
