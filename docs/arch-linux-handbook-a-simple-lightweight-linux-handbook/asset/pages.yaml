  md: '# An Introduction to The AUR


    # An Introduction to The AUR


    The Arch User Repository The ABS tree provides the ability to build all Arch software
    available in the [core], [extra], [community], and [testing] repositories by providing
    build scripts on the local machine. In contrast, the AUR does not provide a tree
    on the local machine, but rather, an unsupported repository of build scripts,
    sporting a handsome web interface at http://aur.archlinux.org/index.php Also,
    there is an AUR link tab at the top right of every page on the Arch site.


    Once you have navigated to the AUR web page, click on the Packages button on the
    top right. You will be brought to the packages search page.


    The general procedure will be:


    +   1. Enter the search criteria into the keywords field and click on go. The
    next screen will present all related results. If the package location is on the
    package listing. If the package location is in community, you have not done your
    homework, and should simply use pacman or ABS to install. If the location is unsupported,
    continue.

    3. Click on the name of the package on the package listing. You will be brought
    to the Package Details page.


    An example for the yaourt package:'
