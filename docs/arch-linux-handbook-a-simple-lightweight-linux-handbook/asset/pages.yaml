  md: '# Step 2: Install X


    The X Window System version 11 (commonly X11, or just simply X) is a networking
    and display protocol which provides windowing on bitmap displays. It provides
    the standard toolkit and protocol to build graphical user interfaces (GUIs) on
    UNIX-like operating systems.


    X provides the basic framework, or primitives, for building GUI environments:
    drawing and moving windows on the screen and interacting with a mouse and/or keyboard.
    X does not mandate the user interface — individual client programs handle this.


    X is so famously named because it was preceded by the W Window System, originally
    developed at Stanford University.


    Note: If you are planning on using an open-source video driver, and need 3d acceleration,
    it is recommended to install the libgl library before installing Xorg:


    ```

    # pacman -S libgl

    ```


    (Proprietary video drivers provide their own gl library implementations.)


    # A: Install X


    Now we will install the base Xorg packages using pacman. This is the first step
    in building a GUI.


    ```

    # pacman -S xorg

    ```


    With newer versions of xorg, it is suggested (and possibly necessary in most cases)
    to install the input driver evdev, which should be installed as a dependency for
    xorg-server, but many seem to be lacking somehow:'
  merge: -1
