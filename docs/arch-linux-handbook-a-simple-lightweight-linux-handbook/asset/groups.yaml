    include ext2, ext3, ext4, reiserfs, xfs and jfs, but note that both and /home
    shall share the same fs type if choosing the Auto Prepare option.


    Be warned that Auto-prepare will completely erase the chosen hard drive, and make
    sure the warning presented by the installer very carefully, and make sure the
    correct device is about to be partitioned.


