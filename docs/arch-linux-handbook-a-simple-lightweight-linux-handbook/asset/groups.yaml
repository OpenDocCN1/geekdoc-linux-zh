    # C: Test X


    First, read the warning about input hotplugging in the previous section. To test
    the X server, run the X script with the -config flag against the path/to/xorg.conf
    file. e.g.:


    ```

    # X -config /etc/x11/xorg.conf

    ```


    X should start with the white hollow vector X in the center of the screen, which
    should respond to mouse, trackpoint or touchpad movement. Use CTRL-Alt-Backspace
    to exit X.


    **Note:** Some users have found after the upgrade to Xorg 1.6 that this test fails
    (no hollow X appears and no capacity for cursor movement is enabled), but this
    does not indicate a problem with the installation of X. You may want to double
    check by running the next test in this guide.'
- md: "\n# Arch Linux Handbook\n\n**Note:** With Xorg 1.6 CTRL-Alt-Backspace has been\
    \ deprecated and will not work to exit out of this test. A somewhat messy around\
    \ is to switch to a different virtual console (CTRL-Alt-F2, for example) and then\
    \ switch back to the console the test is running in (probably CTRL-Alt-F1). You\
    \ will then be able to use CTRL-C to kill the X test. You can enable CTRL-Alt-Backspace\
    \ by editing xorg.conf, as described here.\n\n# In case of errors\n\nInspect the\
    \ config file:\n\n```\n# nano /etc/X11/xorg.conf\n```\n\nEnsure the video driver\
    \ is properly specified. e.g.:\n\n```\nSection \"Device\"\n  ...\n  Driver \"\
    savage\"\n  ...\nEndSection\n```\n\nEnsure there are horizontal sync and vertical\
    \ refresh specs under section \"Monitor\". If not, add them:\n\n# Part III: Install\
    \ X and configure ALSA\n\n| Section \"Monitor\" | \"Monitor0\" |\n| --- | ---\
    \ |\n| Identifier | \"Monitor Vendor\" |\n| VendorName | \"Monitor Model\" |\n\
    | ModelName | 30.0 - 130.0 # Safe for LCD's |\n| HorizSync VertRefresh | 50.0\
    \ - 100.0 # Safe for LCD's and most CRTs. |\n\n(If these specs are unknown, consult\
    \ the documentation of the computer monitor.)\n\nSpecify your default color depth\
    \ under section \"Screen\":\n\n| Section \"Screen\" | \"Screen0\" |\n| --- | ---\
    \ |\n| Device | \"Card0\" |\n| Monitor | \"Monitor0\" |\n| DefaultDepth | 24 |\n\
    \n(Typically, this will be set to 24 for true color.)\n\nAlso add your desired\
    \ Modes to your \"Display\" subsection, at least under the Depth 24 header, e.g.:\n\
    \n```\nSubSection \"Display\"\nViewport 0 0\nDepth 24\nModes \"1024x768\" \"800x600\"\
    \ \"640x480\"\n```\n\nAdd the following section, if eye eye candy which requires\
    \ the composite extension is desired:\n\n```\nSection \"Extensions\"\nOption \"\
    Composite\" \"Enable\"\nEndSection\n```\n\nTry the config again, after modifying:\n\
    \n```\n# X -config /etc/X11/xorg.conf\n```\n\nDetailed instructions in the Xorg\
    \ article.\n\n- Using wgetpaste\n\nIf you are still having trouble after consulting\
    \ the Xorg article and need assistance via the Arch forums, be sure to install\
    \ and use wgetpaste:\n\n```\n# pacman -S wgetpaste\n```\n\nUse wgetpaste and provide\
    \ links for the following files when asking for help in your forum post:\n\n-\
    \ ~/.xinitrc\n- /etc/X11/xorg.conf\n- /var/log/Xorg.0.log\n\nUse wgetpaste like\
    \ so:\n\n```bash\n$ wgetpaste </path/to/file>\n```\n\nPost the corresponding links\
    \ given within your forum post. Be sure to provide appropriate hardware and driver\
    \ information as well.\n\n# Simple baseline X test(if necessary)\n\nAt this point,\
    \ you should have xorg installed, with a suitable video driver and an /etc/X11/xorg.conf\
    \ configuration file. If you want to test your configuration quickly, to ensure\
    \ your ability to successfully start X from the command line before installing\
    \ a complete desktop environment, you can do so by configuring ~/.xinitrc to invoke\
    \ Xterm. Xterm is a very simple terminal emulator which runs in the X Server environment;\
    \ it is installed as part of the base xorg packages. More advanced users who are\
    \ comfortable with X configuration may choose to skip this optional step.\n\n\
    # Part III: Install X and configure ALSA\n\n# Prepare for the test by configuring\
    \ ~/.xinitrc\n\nOne of the main functions of this file is to dictate what X Window\
    \ client is invoked by the /usr/bin/startx and/or /usr/bin/xinit program on a\
    \ per-user basis. (The елект script is merely a front end to the more versatile\
    \ xinit command.) There are vast amounts of additional configurable specifications\
    \ and commands that may also be added to ~/.xinitrc as you further customize your\
    \ system.\n\nNote: .xinitrc is a so-called 'dot' (.) file. Files in a UNIX filesystem\
    \ which are preceded with a dot (.) are 'hidden', and will not show up with a\
    \ regular 'ls' command, usually for the sake of keeping directories tidy. Dot\
    \ files may be seen by issuing ls -a. The 'rc' denotes Run Commands and indicates\
    \ that it is a configuration file. Since it controls how a program runs, it is\
    \ (although historically incorrect) also said to stand for 'Run Control'.\n\n\
    startx/xinit will start the X server and clients. To determine the client to run,\
    \ startx/xinit will first look to parse a .xinitrc file in the user's home directory.\
    \ In the absence of ~/.xinitrc, it defaults to the global xinitrc library directory;\
    \ /etc/X11/xinit/xinitrc, which defaults to using the TWM window manager. (Hence,\
    \ if you invoke startx without a ~/.xinitrc file, a TWM session will start.)\n\
    \nSwitch to your normal, non-root user:\n\n```bash\n# su - username\n```\n\n-\
    \ /etc/skel/ contains files and directories to provide sane defaults for newly\
    \ created user accounts. The name skel is derived from the word skeleton, because\
    \ the files it contains the basic structure for users' home directories.\n- If\
    \ you installed from a fresh (Core) install, it does not include the X window\
    \ manager, so .xinitrc does not exist in /etc/skel. Instead, use the sample provided\
    \ here (If you've followed the guide step by step you should have a basic .xinitrc\
    \ file in /etc/skel/).\n\nCopy the sample xinitrc file from /etc/skel/ to your\
    \ home directory:\n\n```bash\n$ cp /etc/skel/.xinitrc ~\n```\n\nEdit the file:\n\
    \n```bash\n$ nano ~/.xinitrc\n```\n\nand add \"exec xterm\" so that it looks like\
    \ this:\n\n```bash\n#!/bin/sh\n# ~/.xinitrc\n#\n# Executed by startx (run your\
    \ window manager from here)\n#\n# exec wmaker\n# exec startkde\n# exec icewm\n\
    # exec blackbox\n# exec fluxbox\n#\nexec xterm\n```\n\n> Note: Be sure to have\
    \ only one uncommented exec line in your ~/.xinitrc.\n\nBelow, we shall edit this\
    \ file again to specify the appropriate desktop environment/window manager of\
    \ your choice.\n\n# Perform the test\n\nTest your configurations by starting X\
    \ as normal, non-root user, with:\n\n```bash\n$ startx\n```\n\nor\n\n```bash\n\
    $ xinit\n```\n\nYou should have an **xterm** session open up. You can test your\
    \ keyboard and its layout in it. You may have to move your mouse around until\
    \ it enters the xterm area before you see the mouse cursor or xterm responds to\
    \ your keyboard.\n\nYou can exit the **X** Server with Ctrl+Alt+Backspace, or\
    \ by typing \"exit\". If you have problems starting **X**, you can look for errors\
    \ in the /var/log/Xorg.0.log file and on the console output of the console you\
    \ started **X** from.\n\nIf you prove a properly configured /etc/X11/xorg.conf\
    \ by successfully running the test, you can be assured that your DE/WM of choice\
    \ will work smoothly.\n\n**Tip:** Advanced instructions for Xorg configuration\
    \ can be found in the Xorg article.\n\n# Part IV: Installing and configuring a\
    \ Desktop Environment\n\nWhile The X Window System provides the basic framework\
    \ for building a graphical user interface (GUI), a Desktop Environment (DE), works\
    \ atop and in conjunction with X, to provide a completely functional and dynamic\
    \ GUI. A DE typically provides a window manager, icons, applets, windows, toolbars,\
    \ folders, wallpapers, a suite of applications and abilities like drag and drop.\
    \ The particular functionalities and designs of each DE will uniquely affect your\
    \ overall environment and experience. Therefore, choosing a DE is a very subjective\
    \ and personal decision. Choose the best environment for your needs.\n\n- If you\
    \ want something full-featured and similar to Windows and Mac OSX, KDE is a good\
    \ choice\n- If you want something slightly more minimalist, which follows the\
    \ K.I.S.S. principle more closely, GNOME is a good choice\n- Xfce is generally\
    \ perceived as similar to GNOME, but lighter and less demanding on system resources,\
    \ yet still visually pleasing and providing a very complete environment\n- LXDE\
    \ is a minimal DE based on the Openbox window manager. It provides most things\
    \ you need for a modern desktop while keeping relatively low system resource usage.\
    \ LXDE is a good choice for those who want a quick way of setting up a pre-configured\
    \ Openbox system.\n\nIf you desire a lighter, less demanding GUI to configure\
    \ manually, you may choose to simply install a Window Manager, or WM. A WM controls\
    \ the placement and appearance of application windows in conjunction with the\
    \ X Window System but not NOT include such features as panels, applets, icons,\
    \ applications, etc., by default.\n\n- Lightweight floating WM's include: Openbox,\
    \ Fluxbox, fwm2, pekwm, evilwm, Windowmaker, and TWM.\n"
  mdcn: "\n\n# Arch Linux 手册\n\n**注意：** 在 Xorg 1.6 中，CTRL-Alt-Backspace 已被弃用，将无法退出此测试。一个有点麻烦的方法是切换到不同的虚拟控制台（例如，CTRL-Alt-F2），然后再切换回运行测试的控制台（可能是\
    \ CTRL-Alt-F1）。之后你就可以使用 CTRL-C 杀死 X 测试进程。你可以通过按此处描述的方法编辑 xorg.conf 来启用 CTRL-Alt-Backspace。\n\
    \n# 如果出现错误\n\n检查配置文件：\n\n```config\n# nano /etc/X11/xorg.conf\n```\n\n确保视频驱动程序已正确指定。例如：\n\
    \n```config\nSection \"Device\"\n  ...\n  Driver \"savage\"\n  ...\nEndSection\n\
    ```\n\n确保在 \"Monitor\" 部分下有水平同步和垂直刷新规格。如果没有，请添加它们：\n\n| Section \"Monitor\" |\
    \ \"Monitor0\" |\n| --- | --- |\n| Identifier | \"Monitor Vendor\" |\n| VendorName\
    \ | \"Monitor Model\" |\n| ModelName | 30.0 - 130.0 # LCD显示器安全 |\n| HorizSync\
    \ VertRefresh | 50.0 - 100.0 # LCD显示器和大多数CRT显示器安全 |\n\n（如果这些规格未知，请查阅电脑显示器的文档。）\n\
    \n在 \"Screen\" 部分下指定你的默认色彩深度：\n\n| Section \"Screen\" | \"Screen0\" |\n| --- |\
    \ --- |\n| Device | \"Card0\" |\n| Monitor | \"Monitor0\" |\n| DefaultDepth |\
    \ 24 |\n\n(通常情况下，这将设置为 24 以支持真彩色。)\n\n同时在 \"Display\" 子部分下添加你所需的模式，至少在 Depth 24\
    \ 标题下，例如：\n\n```config\nSubSection \"Display\"\nViewport 0 0\nDepth 24\nModes\
    \ \"1024x768\" \"800x600\" \"640x480\"\n```\n\n如果想要需要合成扩展的视觉视觉效果，请添加以下部分：\n\n\
    ```config\nSection \"Extensions\"\nOption \"Composite\" \"Enable\"\nEndSection\n\
    ```\n\n修改后再次尝试配置：\n\n```bash\n# X -config /etc/X11/xorg.conf\n```\n\n详细指令请参阅 Xorg\
    \ 文章。\n\n- 使用 wgetpaste\n\n如果你在查阅 Xorg 文章后仍然遇到问题，并需要在 Arch 论坛寻求帮助，请务必安装并使用 wgetpaste：\n\
    \n```bash\n# pacman -S wgetpaste\n```\n\n在论坛帖子中寻求帮助时，使用 wgetpaste 并提供以下文件的链接：\n\
    \n- ~/.xinitrc\n- /etc/X11/xorg.conf\n- /var/log/Xorg.0.log\n\n如下所示使用 wgetpaste：\n\
    \n```bash\n$ wgetpaste </path/to/file>\n```\n\n在你的论坛帖子发布提供的相应链接。请务必提供相应的硬件和驱动程序信息。\n\
    \n# 简单的基础 X 测试（如有必要）\n\n此时，你应该已经安装了 xorg，并有了合适的视频驱动程序和 /etc/X11/xorg.conf 配置文件。如果你想在安装完整的桌面环境之前快速测试你的配置，以确保你有能力从命令行成功启动\
    \ X，可以通过配置 ~/.xinitrc 来调用 Xterm 来实现。Xterm 是一个运行在 X Server 环境中的非常简单的终端模拟器；它是作为基础\
    \ xorg 包的一部分安装的。熟悉 X 配置的进阶用户可以选择跳过此可选步骤。\n\n# 第三部分：安装 X 并配置 ALSA\n\n# 通过配置 ~/.xinitrc\
    \ 准备测试\n\n该文件的主要功能之一是根据每个用户指定 /usr/bin/startx 和/或 /usr/bin/xinit 程序调用的 X 窗口客户端。（xinit\
    \ 脚本仅仅是更多功能的 xinit 命令的前端。）随着你对系统的进一步定制，可能还有海量的额外可配置规格和命令可以添加到 ~/.xinitrc 中。\n\n\
    注意：.xinitrc 是一个所谓的“点”文件（. dot file）。在 UNIX 文件系统中，以点（.）开头的文件是“隐藏”的，它们不会通过普通的 `ls`\
    \ 命令显示，通常是为了保持目录整洁。通过执行 `ls -a` 可以看到点文件。“rc”表示“运行命令”（Run Commands），并指示这是一个配置文件。由于它控制程序的的运行方式，因此它（尽管在历史上是不正确的）也被称为代表“运行控制”（Run\
    \ Control）。\n\nstartx/xinit 将启动 X 服务器和客户端。要确定要运行的客户端，startx/xinit 将首先查找并解析用户主目录下的\
    \ .xinitrc 文件。在缺少 ~/.xinitrc，它将默认使用全局 xinitrc 库目录；/etc/X11/xinit/xinitrc，它默认使用\
    \ TWM 窗口管理器。（因此，如果你在没有 ~/.xinitrc 文件的情况下调用 startx，将启动 TWM 会话。）\n\n切换到你的普通非 root\
    \ 用户：\n\n```bash\n# su - username\n```\n\n- /etc/skel/ 包含文件和目录，为新创建的用户账户提供合理的默认值。skel\
    \ 的名字源于 skeleton（骨架）一词，因为它包含的文件是用户主目录的基本结构。\n- 如果你是从全新的（核心）安装的，它不包含 X 窗口管理器，因此\
    \ /etc/skel 中不存在 .xinitrc。相反，请使用此处提供的示例（如果你是按照指南一步步操作的，那么你应该在 /etc/skel/ 中有一个基础的\
    \ .xinitrc 文件）。\n\n从 /etc/skel/ 将示例 xinitrc 文件复制到你的主目录：\n\n```bash\n$ cp /etc/skel/.xinitrc\
    \ ~\n```\n\n编辑该文件：\n\n```bash\n$ nano ~/.xinitrc\n```\n\n并添加 \"exec xterm\" 使它如下所示：\n\
    \n```bash\n#!/bin/sh\n# ~/.xinitrc\n#\n# 由 startx 执行（运行你的窗口管理器）\n# exec wmaker\n\
    # exec startkde\n# exec icewm\n# exec fluxbox\n#\nexec xterm\n```\n\n> 注意：确保你的\
    \ .xinitrc 中只有一条取消注释的 exec 行。\n\n下面，我们将再次编辑此文件以指定选择的桌面环境/窗口管理器。\n\n# 执行测试\n\n\
