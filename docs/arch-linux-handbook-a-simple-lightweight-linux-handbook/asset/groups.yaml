    \ xf86-video-ati, but only offer 2d support at this time.\n- The open source **radeonhd**\
    \ driver provided by the **xf86-video-radeonhd** package.\n\n## Arch Linux Handbook\n\
    \n- This driver supports ATI R500 chipsets (Radeon X1000 series) and newer. It\
    \ is written by Novell with specifications provided to the public by AMD. It supports\
    \ RandR 1.2 and development is currently very active. Therefore, functionality\
    \ may be inconsistent across the spectrum of cards supported. (Some users report\
    \ excellent performance and reliability while others experience trouble.) It also\
    \ supports HDMI, with sound.\n- The proprietary fglrx driver provided by the Catalyst\
    \ package located in the AUR. The proprietary driver is covered below.\n\nThe\
