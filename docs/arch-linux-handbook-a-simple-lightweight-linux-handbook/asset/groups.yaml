    ```


    这可以在需要时动态增加 CPU 频率（这在桌面系统上也是安全的选择）。修改 `min_freq` 和 `max_freq` 以匹配你系统的 CPU 规格。如果你不知道频率，可以在加载其中一个频率缩放模块后运行
    `cpufreq-info`。你也可以注释或删除 `min_freq` 和 `max_freq` 行：程序将自动运行。将频率缩放模块添加到你的 `/etc/rc.conf`
    `modules` 行中。大多数现代笔记本电脑和桌面电脑可以简单地使用 `acpi-cpufreq` 驱动，但其他选项包括 `p4-clockmod-k6`、`powernow-k7`、`powernow-k8`
    和 `speedstep-centrino` 驱动。使用以下命令加载模块：


    ```

    modprobe <modulename>

    ```


