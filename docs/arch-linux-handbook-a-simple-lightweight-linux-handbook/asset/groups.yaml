    # Arch Linux Handbook


    ```

    governor="ondemand"

    ```


    which dynamically increases the CPU frequency if needed (which is a safe choice
    on desktop systems too). Alter min_freq and max_freq to match your system''s CPU
    spec. If you do not know the frequencies, run cpufreq-info after loading one of
    the frequency scaling modules. You can also comment out or delete the min_freq
    and max_freq lines: things will work automatically. Add the frequency scaling
    modules to your /etc/rc.conf modules line. Most modern notebooks and desktops
    can simply use the acpi-cpufreq driver, however other options include the p4-clockmod-k6,
    powernow-k7, powernow-k8, and speedstep-centrino drivers. Load the module with


    ```

    modprobe <modulename>

    ```


    and start cpufreq.d with


