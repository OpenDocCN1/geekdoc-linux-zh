    # Preface


    Everything you ever wanted to know about Arch, but were afraid to ask


    Welcome. This self-contained document will guide you through the process of installing
    and configuring Arch Linux; a simple, agile and lightweight GNU/Linux distribution,
    UNIX-like operating system. Arch Linux requires a certain level of intimate knowledge
    of its configuration and of UNIX-like system methodology and for this reason,
    extra explanatory information is included. This guide is aimed at new Arch users,
    but strives to serve as a strong reference and informative base for all.


    Arch Linux distribution highlights:


    - Simple, UNIX-like design and philosophy

    - Independently Developed Community distro built from scratch and targeted at
    competent GNU/Linux users

    - All packages compiled for i686/x86-64

    - High customizable system assembled by the user from the ground up

    - BSD-style init scripts, featuring one centralized configuration file

    - mkinitcpio: a simple and dynamic initramfs creator

    - Rolling Release model

    - Pacman package manager is fast, written in C, lightweight and agile, with a
    very modest memory footprint

    - ABS: The Arch Build System, a ports-like package building system makes it simple
    to create your own easily installable Arch packages from source, to use and/or
    share with the community on the AUR

    - AUR: The Arch User Repository, offering many thousands of build scripts for
    Arch user-provided software packages.

