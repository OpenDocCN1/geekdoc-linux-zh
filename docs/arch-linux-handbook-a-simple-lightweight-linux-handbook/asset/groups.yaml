    127.0.0.1    localhost.localdomain    localhost

    yourhostname

    ```


    This format, **including the ''localhost'' and your actual host name**, is required
    for program compatibility! So, if you named your computer Archstock, then that
    line above should look like this:


    ```

    127.0.0.1    localhost.localdomain    localhost Archstock

    ```


    Errors in this entry may cause poor network performance and/or certain programs
    to open very slowly, or not work at all. This is a very common error for beginners.


    If you use a static IP, add another line using the syntax: <static-IP><hostname.domainname.org>
    <hostname> e.g.:


    ```

    192.168.1.100  yourhostname.domain.org  yourhostname

    ```


    **Tip:** For convenience, you may also use /etc/hosts aliases for hosts on your
    network, and/or on the Web, e.g.:


    ```

    64.233.169.103  www.google.com  g

    192.168.1.90     media

    192.168.1.88     data

    ```


    The above example would allow you to access google simply by typing ''g'' into
    your browser, and access to a media and data server on your network by name and
    without the need for typing out their respective IP addresses.


    ## Arch Linux Handbook


    ### /etc/hosts.deny and /etc/hosts.allow


    Modify these configurations according to your needs if you plan on using the ssh
    daemon. The default configuration will reject all incoming connections, not only
    ssh connections. Edit your /etc/hosts.allow file and add the appropriate parameters:


    - let everyone connect to you


    ```

    sshd: ALL

    ```


    - restrict it to a certain ip


    ```

    sshd: 192.168.0.1

    ```


    - restrict it to your local LAN network (range 192.168.0.0 to 192.168.0.255)


    ```

    sshd: 192.168.0.0

    ```


    - OR restrict for an IP range


    ```

    sshd: 10.0.0.0/255.255.255.255

    ```


    If you do not plan on using the ssh daemon, leave this file at the default, (empty),
    for added security.


    ### /etc/locale.gen


    The /usr/bin/locale-gen command reads from /etc/locale.gen to generate specific
    locales. They can then be used by glibc and any other locale-aware program or
    library for rendering "peculiar" text, correctly displaying monetary values, time
    and date formats, alphabetical idiosyncrasies, and other locale-specific standards.
    The ability to set up a default locale is a great built-in privilege of using
    a UNIX-like operating system.


    ## Part I: Install the Base System


    By default /etc/locale.gen is an empty file with commented documentation. Once
    edited, the file remains untouched. locale-gen runs on every glibc upgrade, generating
    all the locales specified in /etc/locale.gen.


    Choose the locale(s) you need (remove the # in front of the lines you want), e.g.:


    ```

    en_US ISO-8859-1

    en_US.UTF-8

    ```


    The installer will now run the locale-gen script, which will generate the locales
    you specified. You may change your locale in the future by editing /etc/locale.gen
    and subsequently running ''locale-gen'' as root.


    > Note: If you fail to choose your locale, this will lead to "The current locale
    is invalid." error. This is perhaps the most common mistake by new Arch users,
    and also leads to the most commonly asked questions on the forum.


    ## Root password


    Finally, set a root password and make sure that you remember it later. Return
    to the main menu and continue with installing bootloader.


    ## Pacman-Mirror


    Choose a mirror repository for pacman.


    Return to the main menu.


    ## Arch Linux Handbook


    ### G: Install Bootloader


    Because we have no secondary operating system in our example, we will need a bootloader.
    GNU GRUB is the recommended bootloader. Alternatively, you may choose LILO.


    ### GRUB


    The provided GRUB configuration (/boot/grub/menu.lst) should be sufficient, but
    verify its contents to ensure accuracy (specifically, ensure that the root (/)
    partition is specified by UUID on line 3). You may want to alter the resolution
    of the console by adding a vga=<number> kernel argument corresponding to your
    desired virtual console resolution. (A table of resolutions and the console numbering
    is printed in the menu.lst).


    Example:


    ```

    title Arch Linux (Main)

    root (hd0,0)

    kernel /boot/vmlinuz26 root=/dev/disk/by-uuid/0ec1-9339.. ro vga=773

    initrd /boot/kernel26.img

    ```


    > **Note:** The linux kernel, ''vmlinuz'', is so named because it incorporated
    virtual memory capability early in its development. The **z** denotes a zipped
    (compressed) image.


    Explanation:


    - Line 1: **title**: A printed menu selection. "Arch Linux (Main)" will be printed
    on the screen as a menu selection.


    - Line 2: **root**: GRUB''s root; the drive and partition where the kernel (/boot)
    boots, according to system BIOS. (More accurately, where GRUB''s stage2 file resides).
    **NOT necessarily the root** (/) file system, as they can reside on separate partitions.
    GRUB''s numbering scheme starts at 0, and uses 0.


    - Line 3: **kernel**: The kernel image and parameters.


    - Line 4: **initrd**: The initial RAM disk.

