    \ RAM, generally a 1x rule is adequate. If the installation machine provides gratuitous\
    \ amounts of RAM (more than 1024 MB) it may\n\n# Arch Linux Handbook\n\npossible\
    \ to completely forget a swap partition altogether, though this is not recommended.\
    \ A 1 GB swap partition will be used in this example.\n\n**Note:** If using suspend-to-disk,\
    \ (hibernate) a swap partition at least **equal** in size to the amount of physical\
    \ RAM is required. Some Arch users even recommend oversizing it beyond the amount\
    \ of physical RAM by 10-15%, to allow for possible bad sectors.\n\nPartition Scheme\n\
    A disk partitioning scheme is a very personalized preference. Each user's choices\
    \ will be unique to their own computing habits and requirements.\n\nFilesystem\
    \ candidates for separate partitions include:\n\n- / (root) The root filesystem\
    \ is the primary filesystem from which all other filesystems stem; the top of\
    \ the hierarchy. All files and directories appear under the root directory \"\
    /\", even if they are stored on different physical devices. The contents of the\
    \ root filesystem must be adequate to boot, restore, recover, and/or repair the\
    \ system.\n\n- /boot This directory contains the kernel and ramdisk images as\
    \ well as the bootloader configuration file, and bootloader stages. /boot also\
    \ stores data that is used before the kernel begins executing userspace programs.\
    \ This may include saved master boot sectors and map file files.\n\n- /home User\
    \ data and user specific configuration files for applications are stored in each\
    \ user's home directory in a file that starts with the character (a \"dot file\"\
    ).\n\n- /usr While root is the primary filesystem, /usr is the secondary hierarchy,\
    \ for user data, containing the majority of (multi-)user utilities and applications.\
    \ /usr is shareable, read-only data. This means that /usr shall be shareable between\
    \ various hosts and must not be written to, except in the case of system update/upgrade.\
    \ Any\n\n# Part I: Install the Base System\n\ninformation that is host-specific\
    \ or varies with time is stored elsewhere.\n\n/tmp directory for programs that\
    \ require temporary files\n\n/var contains variable data; spool directories and\
    \ files, administrative and logging data, pacman's cache, the ABS tree, etc.\n\
    \n**Note:** Besides /boot\n\nThere are several advantages for using discrete filesystems,\
    \ rather than combining into one partition:\n\n* Security: Each filesystem may\
    \ be configured in /etc/fstab as 'nosuid', 'nodev', 'noexec', 'readonly', etc.\n\
    * Stability: A user, or malfunctioning program can completely fill a filesystem\
    \ with garbage if they write permissions for it. Critical programs, which reside\
    \ on a different filesystem remain unaffected.\n* Speed: A filesystem which gets\
    \ written to frequently become somewhat fragmented. (An effective method of avoiding\
    \ fragmentation is to ensure that each filesystem is never in danger of filling\
    \ up completely.) Separate filesystems remain unaffected, and each can be defragmented\
    \ separately as well.\n* Integrity: If one filesystem becomes corrupted, separate\
    \ filesystems remain unaffected.\n* Versatility: Sharing data across several systems\
    \ becomes more expedient when independent filesystems are used. Separate filesystem\
    \ types may also be chosen based upon the nature of data and usage.\n\nIn this\
    \ example, we shall use separate partitions for /, /var, /home, and a swap partition.\n"
