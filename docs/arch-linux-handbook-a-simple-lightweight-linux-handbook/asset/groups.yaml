- md: '

    ## File and directory explanation


    /proc/ - simply calls to files in this directory. For example, ''lsmod'' is the
    same as ''cat /proc/modules'' while ''lspci'' is a synonym for ''cat /proc/pci''.
    By altering files located in this directory, kernel parameters may be read/changed
    (sysctl) while the system is running.


    The most distinctive facet about files in this directory is the fact that all
    of them have a file size of 0, with the exception of **kcore, mounts and self.**


    /root/ Home directory of the System Administrator, ''root''. This may be somewhat
    confusing, (''root under root'') but historically, was root''s home directory
    (the name of the Administrator account). To keep things tidier, ''root'' eventually
    got his own home directory. Why not in ''/home''? Because ''/home'' is often located
    on a different partition or on another system and would be inaccessible to ''root''
    when - for some reason - ''/'' is mounted.


    /sbin/ UNIX discriminates between ''normal'' executables and those used for system
    maintenance and/or administrative tasks. The latter reside either here or - the
    less important ones - in /usr/sbin. Programs executed after /usr is to be mounted
    (when there are no problems) are generally placed into /usr/sbin. This directory
    contains binaries that are essential to the working of the system. These include
    system administration as well as hardware configuration programs. grub (the command),
    fdisk, init, route, ifconfig, etc., all reside here.


    /srv/ Site-specific data which is served by the system. The main purpose of specifying
    this is so that users find the location of the data files for a particular service,
    and that services which require a single tree for readonly data, writable data
    and scripts (such as cgi scripts) can be reasonably placed. Data of interest to
    a specific user can be placed in user''s home directory.


    /tmp This directory contains files that are required temporarily. Many programs
    use this to create lock files and for temporary storage of data. Do not remove
    files from this directory unless you know exactly what you are doing! Many of
    these files are important for currently running programs and deleting them may
    result in a system crash. On most systems, this directory is cleared out at boot
    or at shutdown by the local system. The basis for this was historical precedent
    and common practice.


    /usr While root is the primary filesystem, /usr is the secondary hierarchy, for
    user data, containing the majority of (multi-user utilities and applications.
    /usr is shareable, read-only data. This means that /usr should be shareable between
    various hosts and must not be written to, except in the case of system administrator
    intervention (installation, update, upgrade). Any information that is host-specific
    or varies with time is stored elsewhere.


    Aside from /home/, /usr usually contains by far the largest share of data on a
    system. Hence, this is one of the most important directories in the system as
    it contains all the user binaries, their documentation, libraries, header files,
    etc. X and its supporting libraries can be found here. User programs like telnet,
    ftp, etc., are also placed here. In the original UNIX implementations, /usr/(for
    user), was where the home directories of the system''s users were placed (that
    is to say, /usr/someone was then the directory known as /home/someone). Over time,
    /usr/ has become users programs and data (as opposed to /kernelspace programs
    and data) reside. The name has not changed, but its meaning has narrowed and lengthened
    from everything user related to usable programs and data. As such, the backronym
    ''User System Resources'' was created.


    - /usr/bin/ Non-essential command binaries (not needed in single user mode); for
    all users. This directory contains the vast majority of binaries (applications)
    on your system. Executables in this directory vary widely. For instance vi, gcc,
    and gnome-session reside here.

    - /usr/include/ Header files needed for compiling userspace source code.

    - /usr/lib/ Libraries for the binaries in /usr/bin/ and /usr/sbin/.

    - /usr/sbin/ Non-essential system binaries of use to the system administrator.
    This is where the network daemons for the system reside, along with other binaries
    that (generally) only the system administrator has access to, but which are not
    required for system maintenance and repair. Normally, these directories are never
    part of normal user''s $PATHs, only of root''s (PATH is an environment variable
    that controls the sequence of locations that the system will attempt to look in
    for commands.


    /usr/share/ contains ''shareable'', architecture-independent files (docs, icons,
    fonts etc.). Note, however that ''usr/share/'' is generally not intended to be
    shared by different operating systems or by different releases of the same operating
    system. Any program or package which contains or requires data that don''t need
    to be modified store these data in ''/usr/share/'' (or ''/usr/local/share/'',
    if manually installed - see below). It is recommended that a subdirectory be used
    in /usr/share for this purpose.


    /usr/src/ The ''linux'' sub-directory holds the Linux kernel sources, and header-files.


    /usr/local/ Optional tertiary hierarchy for local data. The original idea behind
    ''/usr/local/'' was to have a separate (''local'') ''/usr/'' directory on every
    machine beside ''/usr/'', which might be mounted read-only from somewhere else.
    These days, ''/usr/local/'' is widely regarded as a good place in which to keep
    self-compiled or third-party programs. Arch Linux. This directory is empty by
    default in Arch Linux. It may be used for manually compiled software installations
    if desired. Pacman installs to /usr/'', therefore, manually compiled/installed
    software installed to /usr/local/ may peacefully co-exist with pacman-trained
    system software.


    /var/ Variable files, such as logs, spool files, and temporary e-mail files. On
    Arch, the ABS tree and pacman cache also reside here. Why not put the variable
    and transient data into /usr/? Because there might be circumstances where /usr/
    is read-only, e.g. if it is on a CD or on another computer. ''/var/'' contains
    variable data, i.e. files and directories the system must be able to write to
    during operation, where /usr/ shall only contain static data. Some directories
    can be put onto separate partitions or systems, e.g. for easier backups, by network
    topology or security concerns. Other directories have to be on the root partition,
    because they are vital for the boot process. ''Mountable'' directories are: ''/home'',
    ''/mnt'', ''/tmp'', ''/usr'' and ''/var''. Essential for booting: ''/bin'', ''/boot'',
    ''/dev'', ''/etc'', ''/lib'', ''/proc'' and ''/sbin''.


    - /var/abs/** The ABS tree.

    - /var/cache/pacman/** The pacman cache.

    - /var/lib/** Persistent data modified by programs.

    - /var/lock/** Lock files.

    - /var/log/** Log files.

    - /var/run/** State about the running.

    - /var/spool/** Spool for tasks waiting to be processed.

    - /var/tmp/** Temporary files to be preserved between reboots.


    ## Arch Linux Handbook

    '
  mdcn: '


    ## 文件与目录说明


    /proc/ - 仅是对该目录内文件的调用。例如，''lsmod'' 等同于 ''cat /proc/modules''，而 ''lspci'' 是 ''cat
    /proc/pci'' 的同义词。通过修改此目录下的文件，可以在系统运行时读取/更改内核参数（sysctl）。


    该目录下文件最显著的特征是，所有文件的大小均为 0，**kcore、mounts 和 self** 除外。


    /root/ 系统管理员 ''root'' 的家目录。这可能让人感到有些困惑（“root 下的 root”），但从历史上看，它曾是 root 的家目录（管理员账户的名称）。为了保持整洁，''root''
    最终拥有了自己的独立的家目录。为什么不放在 ''/home'' 中呢？因为 ''/home'' 往往位于不同的分区或另一个系统上，当由于某种原因 ''/''
    挂挂载时，''root'' 可能会无法访问它。


    /sbin/ UNIX 将“普通”可执行文件与用于系统维护和/或管理任务的程序区分开来。后者存在于这里，或者（对于不重要的程序）位于 /usr/sbin。在
    /usr 挂载后（在没有问题的情况下）执行的程序通常存放在 /usr/sbin。此目录包含对系统运行至关重要的二进制文件。这些包括系统管理以及硬件配置程序。grub（命令）、fdisk、init、route、ifconfig
    等都存在于此。


    /srv/ 由系统提供的特定站点数据。指定此目录的主要目的是让用户找到特定服务的数据文件位置，并让需要单一树用于只读数据、可写数据和脚本（如 cgi 脚本）的服务可以合理地放置。特定用户感兴趣的数据可以放在用户的家目录中。


    /tmp 此目录包含临时需要的文件。许多程序使用此目录创建锁文件并临时存储数据。除非你确切自己在做什么，否则不要从此目录中删除文件！这些文件中的许多对于当前运行的程序至关重要，删除它们可能会导致系统崩溃。在大多数系统中，本地系统会在启动或关机时清理此目录。此做法的依据是历史先例和通用实践。


    /usr 尽管 root 是主文件系统，但 /usr 是用于用户数据的次级体系，包含了大多数（多用户实用程序和应用程序）。/usr 是共享的、只读的数据。这意味着
    /usr 应该在各种主机之间共享，除非有系统管理员干预（安装、更新、升级）的情况下，否则不能向其写入。任何主机特定或随时间变化的信息都存储在其他地方。


    除了 /home/ 之外，/usr 通常包含系统中占比最大的数据。因此，它是系统中最重要的目录之一，因为它包含了所有的用户二进制文件、其文档、库文件、头文件等。X
    及其支持库可以在这里找到。像 telnet、ftp 等用户级程序也放置在此处。在原始的 UNIX 实现中，/usr/（用于用户）是系统用户家目录存放的位置（也就是说，当时的
    /usr/someone 就是后来被称为 /home/someone 的目录）。随着时间的推移，/usr/ 已成为用户程序和数据驻留的地方（与 /kernelspace
    程序和数据相对）。名称没有变，但其含义已从“所有与用户相关”收缩并扩展为“可用的程序和数据”。因此，产生了反向缩词 ''User System Resources''（用户系统资源）。


    - /usr/bin/ 非必需的命令二进制文件（在单用户模式下不需要）；适用于所有用户。此目录包含你系统中绝大多数的二进制文件（应用程序）。此目录中的可执行文件差异很大。例如，vi、gcc
    和 gnome-session 位于此地。

    - /usr/include/ 编译用户空间源码所需的头文件。

    - /usr/lib/ 用于 /usr/bin/ 和 /usr/sbin/ 中二进制文件的库。

    - /usr/sbin/ 系统管理员使用的非必需系统二进制文件。这是系统守护进程驻留的地方，以及其他（通常）只有系统管理员才能访问的二进制文件，但它们并不是系统维护和修复所需的。通常情况下，这些目录不会出现在普通用户的
    $PATH 中，只出现在 root 的 PATH 中（PATH 是一个环境变量，用于控制系统尝试查找命令的位置顺序）。


    /usr/share/ 包含“可共享的”、与架构无关的文件（文档、图标、字体等）。但请注意，''usr/share/'''' 通常不打算让不同的操作系统或同一操作系统的不同版本共享。任何包含或需要不需要修改的数据的程序或包都将这些数据存储在
    ''/usr/share/'' 中（如果是手动安装，则存储在 ''/usr/local/share/''——见下文）。建议为此目的在 /usr/share
    中使用子目录。


    /usr/src/ ''linux'' 子目录存放 Linux 内核源码和头文件。


    /usr/local/ 用于本地数据的可选第三级体系结构。''/usr/local/'' 的原始想法是每台机器上除了 ''/usr/'' 之外还有一个独立的（''local''）''/usr/''
    目录，该目录可以从其他地方只读方式挂载。如今，''/usr/local/'' 被广泛认为是存放自编译或第三方程序的好地方。在 Arch Linux 中，此目录默认是空的。如果需要，它可以用于手动编译的软件安装。Pacman
    安装到 /usr/，因此，手动编译/安装的软件安装到 /usr/local/，可以与 pacman 训练的系统软件和平共存。


    /var/ 变量文件，例如日志、溢出池文件和临时电子邮件文件。在 Arch 中，ABS 树和 pacman 缓存也存在这里。为什么不将变量和临时数据放在 /usr/
    中呢？因为可能会出现 /usr/ 是只读的情况，例如它位于光盘或另一台计算机上。''/var/''包含变量数据，即系统在运行时必须能够写入的文件和目录，而
    /usr/ 只包含静态数据。某些目录可以放在不同的分区或系统上，以便于备份、网络拓扑或安全考虑。其他目录必须位于根分区上，因为它们对启动过程至关重要。“可挂载”目录有：''/home'',
    ''/mnt'', ''/tmp'', ''/usr'' 和 ''/var''。启动要素包括：''/bin'', ''/boot'', ''/dev'',
    ''/etc'', ''/lib'', ''/proc'' 和 ''/sbin''。


    - /var/abs/** ABS 树。

    - /var/cache/pacman/** pacman 缓存。

    - /var/lib/** 程序修改的持久化数据。

    - /var/lock/** 锁文件。

    - /var/log/** 日志文件。

    - /var/run/** 运行状态的信息。

    - /var/spool/** 等待处理的任务溢出池。

    - /var/tmp/** 在重启启动之间保留的临时文件。


    '
