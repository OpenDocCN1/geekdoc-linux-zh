    # Arch Linux Handbook


    The purpose of init is to bring (and keep) the system up into a usable state.
    It uses the boot scripts to do so. As you may be aware, Arch uses BSD-style boot
    scripts. init reads the file /etc/inittab, which tells it what to do. Looking
    over the inittab script, you will find that the uncommented line defines the default
    system runlevel, or 3. The next thing it is told to do is to run an initialization
    script. The program that executes (or interprets) this script is bash, the same
    program that gives you a command prompt. In Arch Linux, the main initialization
    script is /etc/rc.sysinit. It also defines your virtual consoles, which are ''respawned''
    by /sbin/init if terminated. Lastly, inittab defines a login manager, if starting
    the system at runlevel 5 is desired. By the login manager is also respawned by
    /sbin/init if terminated.


    /etc/inittab directs init to call the first boot script, /etc/rc.sysinit, after
    which /etc/rc.multi will be called (in a normal boot). The last script to run
    will be /etc/rc.local, which is empty by default.


    When started in runlevel 1, the single user mode, the script /etc/rc.single is
    run instead of /etc/rc.multi. You will not find an endless symlink collection
    in the /etc/rc?.d/ directories to define the boot sequence for all possible runlevels.
    In fact, due to this approach Arch only really has three runlevels, if you take
    starting up X in runlevel 5 into account. The boot scripts are using the variables
    and definitions found in the /etc/rc.conf file and also a set of general functions
    defined in the /etc/rc.d/functions script. If you plan to write your own daemon
    files, you should consider having a look at this file and existing daemon scripts.


    # Boot Script Overview


    +   1. /etc/inittab (covered above)

    2. /etc/rc.sysinit

    3. /etc/rc.single

    4. /etc/rc.multi

    5. /etc/rc.local

    6. /etc/profile'
