    ```


    to your ~/.xinitrc and start with startx or xinit


    > **Tip:** Further information available in the LXDE wiki article.


    # Fluxbox


    Fluxbox © is yet another windowmanager for X. It''s based on the Blackbox 0.61.1
    code. Fluxbox looks like blackbox and handles styles, colors, window placement
    and similar things exactly like blackbox (100% theme/style compatibility).


    Install Fluxbox using


    ```

    # pacman -S fluxboxconf

    ```


    If you use gdm/kdm a new fluxbox session will be automatically added. Otherwise,
    you should modify your user''s .xinitrc and add this to it:


    ```

    exec startfluxbox

    ```


    More information is available in the Fluxbox article.


    # Openbox


    Openbox is a standards compliant, fast, light-weight, extensible window manager.


    Openbox works with your applications, and makes your desktop easier to manage.
    This is because the approach to its development was the opposite of what seems
    to be the general case for window managers. Openbox was written first to comply
    with standards and to work properly. Only when that was in place did the team
    turn to the interface.


    Openbox is fully functional as a drop-in replacement for GNOME, KDE and Xfce.


    Install openbox using:


    ```

    # pacman -S openbox

    ```


    Additional configuration tools are also available:


    ```

    # pacman -S obconf obmenu

    ```


    Once openbox is installed you will need to:


    ```

    mkdir -p ~/.config/openbox

    cp /etc/xdg/openbox/* ~/.config/openbox/

    cp /etc/xdg/menu.xml ~/.config/openbox/

    ```


    **rc.xml** is the main configuration file for OpenBox. It may be manually edited
    (or you can use obconf). **menu.xml** configures the right-click menu.


    For KDM there is nothing left to do; openbox is listed in the sessions menu. Otherwise,
    add


    ```

    exec openbox

    ```


    to your ~/.xinitrc. If you plan on running hal (which is required) then make sure
    yourxinitrc reads:


    ```

    exec dbus-launch --exit-session openbox

    ```


    You may also start OpenBox from the shell using **xinit**:


    ```

    $ xinit /usr/bin/openbox

    ```


    - - Openbox may also be used as the window manager for.


    Some useful, lightweight programs for OpenBox are:


    - PyPanel, Tint2, or LXpanel if you want a panel

    - feh if you want to set the background

    - ROX if you want a simple file manager

    - PcManFM a lightweight but versatile file manager (also provides desktop icons)

    - iDesk (available in AUR) for providing desktop icons

    - Graveman for burning CD’s or DVD’s


    # fvwm2


    FVWM is an extremely powerful ICCCM-compliant multiple virtual desktop window
    manager for the X system. Development is active, and support is excellent.


    Install fvwm with


    ```

    # pacman -S fvwm

    ```


    fvwm will automatically be listed in kdm/gdm in the sessions menu. Otherwise,
    add


    ```

    exec fvwm

    ```


    to your .initrc.


    # Useful Applications


    This page will never be complete. It just shows some good applications for the
    everyday user.

    It might also be worthwhile to check out Lightweight Software as well.


    # Web browser


    # Firefox


    The ever-popular Firefox web browser is available through pacman, although it
    does not have its official branding. Therefore, the program appears as its development
    codename, Shiretoko, when opened.

    Install with:


    ```

    pacman -S firefox

    ```


    # Plugins


    Be sure and install ''flashplugin'',and the ''mplayer-plugin''packages for a complete
    web experience:


    ```

    pacman -S flashplugin mplayer-plugin

    ```


    # Gecko Media Player


    A good replacement of the now ageing mplayer-plugin, is Gecko Media Player. More
    stable combined with MPlayer 1.0RC2. (No more crashes with Apple Trailers.)

