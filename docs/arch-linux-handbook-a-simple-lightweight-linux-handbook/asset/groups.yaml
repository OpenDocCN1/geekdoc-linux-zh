    # Part III: Install X and configure ALSA


    # Prepare for the test by configuring ~/.xinitrc


    One of the main functions of this file is to dictate what X Window client is invoked
    by the /usr/bin/startx and/or /usr/bin/xinit program on a per-user basis. (The
    елект script is merely a front end to the more versatile xinit command.) There
    are vast amounts of additional configurable specifications and commands that may
    also be added to ~/.xinitrc as you further customize your system.


    Note: .xinitrc is a so-called ''dot'' (.) file. Files in a UNIX filesystem which
    are preceded with a dot (.) are ''hidden'', and will not show up with a regular
    ''ls'' command, usually for the sake of keeping directories tidy. Dot files may
    be seen by issuing ls -a. The ''rc denotes Run Commands and indicates that it
    is a configuration file. Since it controls how a program runs, it is (although
    historically incorrect) also said to stand for ''Run Control''.


    startx/xinit will start the X server and clients. To determine the client to run,
    startx/xinit will first look to parse a .xinitrc file in the user''s home directory.
    In the absence of ~/.xinitrc, it defaults to the global xinitrc library directory;
    /etc/X11/xinit/xinitrc, which defaults to using the TWM window manager. (Hence,
    if you invoke startx without a ~/.xinitrc file, a TWM session will start.)


    Switch to your normal, non-root user:


