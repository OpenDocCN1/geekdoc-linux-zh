    # Pacman


    Pacman is both a binary and source package manager which is able to download,
    install, and upgrade packages from both remote and local repositories with full
    dependency handling, and has easy-to-understand tools for crafting your own packages
    too.


    A more-detailed description of Pacman can be found in its article.


    # Useful commands


    To view the options available for a particular operational command, say -Q, just
    append it with -h:


    ```

    pacman -Qh

    ```


    To synchronize and update the local packages database with the remote repositories
    (it is a good idea to do this before installing and upgrading packages):'
- md: '

    ```

    pacman -Sy

    ```


    To upgrade all packages on the system:


    ```

    pacman -Su

    ```


    To sync, update, and upgrade all the packages on the system with one command:


    ```

    pacman -Syu

    ```


    To install or upgrade a single package or list of packages (including dependencies):


    ```

    pacman -S packageA packageB

    ```


    You can also sync, update the package database, and install packages in one command:


    ```

    pacman -Sy packageA packageB

    ```


    To remove a single package, leaving all of its dependencies installed:


    ```

    pacman -R package

    ```


    To remove a package and all of the package''s dependencies which are not used
    by any other installed package:


    ```

    pacman -Rs package

    ```


    (-Rs is typically preferred vs R to remove any package as it will clean up all
    unused dependencies)


    # Arch Linux Handbook


    To remove all of the package''s now unneeded dependencies and also instruct pacman
    to ignore file backup designations. (Normally, when a file is removed from the
    system database is checked to see if the file should be renamed with a ".pacsave"
    extension):


    ```

    pacman -Rsn package

    ```


    To search the remote (repo) package database for a list of packages matching a
    given keyword:


    ```

    pacman -Ss keyword

    ```


    List all available packages in a given repo. e.g. core:


    ```

    pacman -S1 core

    ```


    To list all packages on your system


    ```

    pacman -Q

    ```


    To list all packages on your system without the version strings, we add the -q
    option:


    ```

    pacman -Qq

    ```


    To search (query) the local (your machine) package database for a given package:


    ```

    pacman -Q package

    ```


    To search (query) the local (your machine) package database for a given package
    and list all pertinent information:


    # Maintaining the system


    ```

    pacman -Qi package

    ```


    To list all files installed by a given package:


    ```

    pacman -Ql package

    ```


    Conversely, to find the package that owns a given file (in this example, the ls
    executable):


    ```

    pacman -Qo /bin/ls

    ```


    List all unused packages no longer required as dependencies, (orphans):


    ```

    pacman -Qdt

