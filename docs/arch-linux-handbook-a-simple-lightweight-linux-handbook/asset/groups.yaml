    /etc/rc.conf # 特别是，检查你的 HOSTNAME= 和 NETWORKING 章节是否存在拼写错误和错误。

    /etc/hosts # 双检查你的格式。（见上文。）

    /etc/resolv.conf # 如果你使用静态 IP。如果你使用 DHCP，此文件默认将动态创建和销毁，但可以根据喜好进行更改。（参见“网络”章节。）


    > **提示：** 配置网络的高级说明可以在“网络”文章中找到。


    # 有线局域网


    使用以下命令检查你的以太网：


    ```

    # ifconfig -a

    ```


    所有接口都将列出来。你应该能看到 eth0 或 eth1 的条目。


    - 静态 IP


    如果需要，可以使用以下命令设置新的静态 IP：


    ```

    # ifconfig eth0 <ip address> netmask <netmask> up

    ```


    并使用以下命令设置默认网关：


    ```

    # route add default gw <ip address of the gateway>

    ```


    验证 /etc/resolv.conf 包含你的 DNS 服务器，如果缺失则添加它。再次通过 ping www.google.com 检查网络。如果现在一切正常，请按照上述描述调整
    /etc/rc.conf 以使用静态 IP。


    # 第二部分：配置并更新新的 Arch 基础系统


    - DHCP


    如果你的网络中有 DHCP 服务器/路由器，请尝试：


    ```

    # dhcpcd eth0

    ```


    如果此有效，请按照上述描述调整 /etc/rc.conf 以使用动态 IP。


    # 无线局域网


    - 确保驱动程序已创建一个可用的接口：


    ```

    # iwconfig

    ```


    - 使用 ifconfig <interface> up 启用接口。例如：


    ```

    # ifconfig wlan0 up

    ```


    - （可选）扫描可用的访问点：


    ```

    # iwlist wlan0 scan | less

    ```


    - 使用 iwconfig <interface> ssid <youressid> 指定无线网络的 ID。或者，如果使用 WEP，使用 iwconfig
    <interface> ssid <youressid> key <yourwepkey>，例如：


    ```

    # iwconfig wlan0 ssid links key ABCDEF01234

    ```


    - 使用 dhcpcd <interface> 请求 IP 地址。例如：


    ```

    # dhcpcd wlan0

    ```


    - 确保你可以路由：


    ```

    $ ping -c 3 www.google.com

    ```


    完成。


    # 模拟调制解调器


    为了能够使用兼容 Hayes 的外部模拟调制解调器，你至少需要安装 ppp 包。根据 `man pppd` 的说明修改 /etc/ppp/options 文件以符合你的需求。你需要定义一个
    chat 脚本，在初始连接建立后向 ISP 提供你的用户名和密码。pppd 和 chat 的帮助页面中包含示例，如果你足够经验或足够固执，这些示例应该足以让连接运行。使用
    udev，你的串口端口通常是 /dev/tty0 或 /dev/tty1。

    与其与原始的 pppd 进行一场激烈的斗争，你可能选择安装 wvdial 或类似的工具来大大简化设置过程。如果你正在使用所谓的 WinModem（它基本上是一个充当内部模拟调制解调器的
    PCI 插件卡），你应该仔细查阅 LinModem 主页上的海量信息。


    # ISDN


    设置 ISDN 分三步完成：


    1. 安装并配置硬件

    2. 安装并配置 ISDN 实用程序

    3. 为你的 ISP 添加设置


    当前的 Arch 默认内核包含了必要的 ISDN 模块，这意味着你不需要重新编译内核


    除非你正准备使用相当奇特的 ISDN 硬件。在机器中物理安装 ISDN 卡或插入你的 USB ISDN-Box 后，几乎所有的被动 ISDN PCI 卡都由
    hisax 模块处理，该模块需要两个参数：type 和 protocol。如果你的国家使用 1TR6 标准，必须将 protocol 设为 ''1''；如果使用
    EuroISDN (EDSS1)，则设置为 ''2''；如果你连接到没有 D 通道的所谓租线，则设置为 ''3''；对于 US NI1 则设置为 ''4''。


    所有这些设置的细节以及如何设置它们包含在 isdn 子目录中并可以在网上找到。type 参数取决于你的显卡；所有可能的类型列表可以在 README.HiSax
    内核文档中找到。选择你的卡并使用相应的选项加载模块，例如：


    ```

    # modprobe hisax type=18 protocol=2

    ```


    这将为我的 ELSA Quickstep 1000PCI 加载 hisax 模块，该卡在德国使用 EDSS1 协议。你应该在 /var/log/everything.log
    文件中找到有用的调试输出，在其中你应该看到你的卡已准备就绪。请注意，在可以使用外部 USB ISDN 适配器之前，你可能需要加载一些 USB 模块。


    一旦你确认你的卡在某些设置下工作，你可以将模块选项添加到 /etc/modprobe.conf：


    ```

    alias ippp0 hisax

    options hisax type=18 protocol=2

    ```


    或者，你也可以在这里仅添加 options 行，并将 hisax 添加到 rc.conf 中的 MODULES 数组中。这取决于你的选择，但这个示例的优点是模块只有在真正需要时才会被加载。


    完成后，你应该拥有了可以工作且支持的硬件。现在你需要基础实用程序来使用它！


    安装 isdn4k-utils 包，并阅读 isdnctrl 的帮助页面；它将帮助你入门。在帮助页面的下方，你将找到如何创建一个可以被 isdnctrl 解析的配置说明，以及一些有用的设置示例。请注意，如果你使用
    US NI1，必须通过冒号在你的 MSN 设置旁添加你的 SPID。


    在使用 isdnctrl 工具配置好 ISDN 卡后，你应该能够拨入通过 PHONE_OUT 参数指定的机器，但用户名和密码验证会失败。为了让其工作，你需要将用户名和密码写入
    /etc/ppp/pap-secrets 或 /etc/ppp/chap-secrets，取决于你的 ISP 使用哪种协议进行认证，就像配置普通的模拟 PPP
    链路。如果有疑问，将数据放入两个文件中。


    如果你正确设置好了一切，现在应该能够以 root 身份建立拨号连接：


    ```

    # isdnctrl dial ippo0

    ```


    如果你遇到任何问题，请检查日志文件！


    # DSL (PPPoE)


    这些说明仅在你自己负责管理连接时才对你有意义。如果你使用某种独立路由器来执行脏工作，你不需要做任何事情，只需定义正确的默认网关即可。


    在使用在线连接之前，你必须将物理连接到 DSL 调制解调器的网卡安装到电脑。在将新安装的网卡添加到 modules/modprobe.conf 或 MODULES
    数组后，你应该安装 rp-pppoe 包并运行 ppoe-setup 脚本来配置你的连接。输入所有数据后，你可以通过以下命令连接和断开线路：


    ```

    # /etc/rc.d/adsl start

    ```


    和


    ```

    # /etc/rc.d/adsl stop

    ```


    设置通常非常简单直接，但请阅读帮助页面以获取提示。如果你想在启动时自动“拨入”，将 adsl 添加到 DAEMONS 数组中，并在网络条之前加上 &!，因为网络现在由
    adsl 处理。


    #  2：使用 pacman 更新、同步和升级系统


    现在我们将使用 pacman 更新系统。


    # 什么是 pacman


    Pacman 是 Arch Linux 的包管理器。Pacman 用 C 语言编写，从底层设计为轻量级、内存占用极小、快速、简单且多功能。它管理整个软件包系统，并处理安装、删除、包降级（通过缓存）、自定义编译包处理、自动依赖解析、远程和本地搜索等。Pacman
    的输出精简、易于阅读，并提供每个包下载的预估时间。Arch 使用 .tar.gz 包格式，这进一步增强了 pacman 的速度；Gzip 压缩包虽然略大，但解压速度比
    Bzip2 格式快得多，因此安装速度快得多。


    '
