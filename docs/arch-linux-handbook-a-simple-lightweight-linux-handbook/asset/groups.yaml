    To install Sudo:


    ```

    # pacman -S sudo

    ```


    To add a user as a sudo user (a "sudoer"), the visudo command must be run as root.
    If you do not know how to use vi, you may set the EDITOR environment variable
    to the editor of your choice before running visudo. e.g.:


    ```

    # EDITOR=nano visudo

    ```


    If you are comfortable using vi, issue the visudo command without the EDITOR=nano
    variable:


    ```

    # visudo

    ```


    This will open the file /etc/sudoers in a special session of vi. visudo copies
    the file to be edited to a temporary file, edits it with an editor, (vi by default),
    and subsequently runs a sanity check. If it passes, the temporary file overwrites
    the original with the correct permissions.


    **Warning:** Do not edit /etc/sudoers directly with an editor; Errors in syntax
    can cause annoyances (like rendering the root account unusable). You must use
    the visudo command to edit /etc/sudoers.


    To give the user full privileges when he/she precedes a command with "sudo", add
    the following line:


    ```

    USER_NAME ALL=(ALL) ALL

    ```


    where USER_NAME is the username of the individual.

    For more information, such as sudo <TAB> completion, see sudo


