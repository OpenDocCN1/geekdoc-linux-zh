    ## initramfs


    初始内存文件系统（或 initramfs）是内核在启动过程中使用的一个临时文件系统。它用于在挂载真正的根文件系统之前进行准备工作，例如硬件检测和模块加载。因此，initramfs
    允许针对各种硬件使用通用的模块化内核，而无需为每个用户编译自定义内核。


    你将收到一系列与 initramfs 配置相关的提示。系统会询问你是否需要支持从 USB 设备、FireWire 设备、PCMCIA 设备、NFS 共享、软件
    RAID 阵列、LVM2 卷、加密卷以及 DSDT 支持。如果需要请选择 yes；在我们的示例中，这些都不需要。对上述任何项选择 ''yes'' 都会导致安装脚本解析
    `/etc/mkinitcpio.conf` 文件中的相应钩子（hooks）。


    现在系统将询问你想要使用哪种编辑器；选择 nano 或者（如果你熟悉 vim 的话）选择 vim。你将看到一个包含系统主配置文件的菜单。


    > **注意：** 在此阶段，编辑或至少通过打开来验证每一个配置文件是非常重要的。安装脚本依赖于你的输入在你的安装系统中创建这些文件。常见的错误是跳过这些关键的配置步骤。


    ## 安装程序能更自动地处理这些吗？


    隐藏系统配置的过程与 Arch 精神背道而驰。虽然最近版本的内核和硬件探测工具确实提供了卓越的硬件支持和自动配置，但 Arch 在安装期间向用户展示所有相关的配置文件，以实现*透明度和系统资源控制*。当你完成按照自己的规范修改这些文件时，你已经学会了手动配置
    Arch Linux 系统的简单方法，并对基础结构变得更加熟悉。


    # 第一部分：安装基础系统


    让你能够更好地准备高效使用和维护你的新安装产品。


    ## /etc/rc.conf


    Arch Linux 使用 /etc/rc.conf 文件作为系统配置的主要位置。此文件包含广泛的配置信息，主要在系统启动时使用。正如其名称直接暗示的那样，它还包含调用
    /etc/rc* 文件的设置，并且会被这些文件加载。


    ## LOCALIZATION（本地化）部分


    - LOCALE=: 这设置你的系统区域，它将被所有支持国际化（i18n）的应用程序和工具使用。你可以通过命令行运行 ''locale -a'' 来获取可用区域的列表。该设置的默认值对美国用户是足够的。

    - HARDWARECLOCK=: 指定硬件时钟（在启动和关机时同步）存储 UTC 时间还是本地时间（localtime）。UTC 有意义，因为它极大简化了更改时区和夏令时间。如果你与
    Windows 等操作系统进行双系统（Windows 只将本地时间存储到硬件时钟），则必须使用 localtime。

    - USEDIRECTISA=: 使用直接 I/O 请求而非 /dev/rtc 来处理 hwclock。

    - TIMEZONE=: 指定你的时区。（所有可用区域都在 /usr/share/zoneinfo/ 下）。

    - KEYMAP=: 可用的键位映射位于 /usr/share/kbd/keymaps。请注意，此设置仅对你的 TTY 有效，不适用于任何图形窗口管理器或
    X。

    - CONSOLEFONT=: 如果必须更改，可用的控制台字体位于 /usr/share/kbd/consolefonts/。默认的空白是安全的。

    - CONSOLEMAP=: 定义启动时使用 setfont 程序加载的控制台映射。可能的映射可以在：


    ```

    LOCALE="en_US.utf8"

    HARDWARECLOCK="localtime"

    USEDIRECTISA="no"

    TIMEZONE="US/Eastern"

    KEYMAP="us"

    CONSOLEFONT=

    CONSOLEMAP=

    USECOLOR="yes"

    ```


    ## HARDWARE（硬件）部分


    - MOD_AUTOLOAD=: 将此项设置为 "yes" 将使用 udev 在启动期间自动探测硬件并加载相应的模块（配合默认的模块化内核非常方便）。将其设置为
    "no" 将依赖用户手动指定这些信息的能力，或者编译自己的自定义内核和模块等。

    - MOD_BLACKLIST=: 此项已废弃，现在改为直接将黑名单模块添加到下方的 MODULES= 行中。

    - MODULES=: 如果你知道某个重要模块缺失，请指定额外的 MODULES。如果你的系统有软驱器，添加 "floppy"。如果你将使用回环文件系统，请添加
    "loop"。还可以通过在模块前加感叹号 (!) 来指定任何黑名单模块。Udev 将强制不加载黑名单模块。在示例中，IPv6 模块以及烦人的 pcspeaker
    都被列名单了。


    ```

    # 启动时扫描硬件并加载所需的模块

    MOD_AUTOLOAD="yes"

    # 模块黑名单 - 已废弃

    MOD_BLACKLIST=()

    #

    MODULES=(net-pf-10 !snd_pcsp !pcspkr loop)

    ```


    ## NETWORKING（网络）部分


    - HOSTNAME=: 设置你喜欢的主机名。

    - eth0=: 如果你使用静态 IP，调整接口 IP 地址、子网掩码和广播地址。如果你想使用 DHCP，请设置 eth0="dhcp"。

    - INTERFACES=: 在此处指定所有接口。

    - gateway=: 如果你使用静态 IP，设置网关地址。如果使用 DHCP，你通常可以忽略此变量，尽管某些用户报告需要定义它。


    ```

    HOSTNAME="arch"

    eth0="dhcp"

    INTERFACES="eth0"

    gateway=""

    ```


