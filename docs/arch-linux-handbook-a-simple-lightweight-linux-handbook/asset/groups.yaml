    Missing libraries: Suppose you receive an error message like this:


    ```

    mplayer: error while loading shared libraries:

    libssapi.so.2: cannot open shared object file: No such file or directory

    ```


    This may be an indication that a package you have previously installed is now
    corrupt (some or all of its files are missing). You should try to find the package
    name that provides the missing shared library. In this example, you could type:


    # Arch Linux Handbook


    ```

    pacman -Ql | grep libgssapi.so.2

    ```


    The first column in the output is the package name:


    ```

    heimdal /usr/lib/libgssapi.so.2

    heimdal /usr/lib/libgssapi.so.2.0.0

    ```


    Then, you can just re-install it:


    ```

    pacman -Sy heimdal

    ```


    To defragment pacman''s cache database and optimize for speed:


    ```

    pacman-optimize

    ```


    To count how many packages are currently on your system:


    ```

    pacman -Q | wc -l

    ```


    To install a package compiled from source using ABS and makeepkg:


    ```

    pacman -U packagename.pkg.tar.gz

    ```


    Note: There are countless additional pacman functions and commands. Try man pacman
    and consult the pacman wiki entries.


    # Files


    There are a number of files left and created by pacman and other programs to facilitate
    maintenance and to conform to a safe computing practice. When pacman is installing
    something, the package contains information on whether to back up a particular
    file. Such files will have the .pacsave extension. When you force a "NoUpgrade"
    on a file via pacman.conf, it will not be replaced during an upgrade and the new
    file will come with the .pacnew extension. For example, if you edited a configuration
    file thoroughly and you do not want an upgrade of the respective package to replace
    the file with a new one, we must have the following line in /etc/pacman.conf:


    ```

    NoUpgrade = /path/to/config/file

    ```


    To view the differences of the old and new versions of these files, we can either
    edit them manually or use a diff utility to take note of the differences. There
    is an automated tool to find and view such files available from the community
    repository:


    ```

    pacman -S pacman-contrib

    cd /

    pacdiff # as root

    ```


    There is a bug in the above tool where if you navigate to /etc and run it from
    there, the paths will be messed up. We remain on the safer side by being at "home".
    You may want to run it as user first in case you happen to be a careless person
    (you may just overwrite or remove files because you think that is the right way).


    There are other types of leftovers depending on the programs available on your
    system. Some will create backups with a .bak extension, while others with something
    like "~" or "-". Unfortunately, there is currently no way to "automatically" find
    and review them. Fear not, as we have no need for automated tools.


