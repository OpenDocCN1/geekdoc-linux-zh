    # Pm-Utils


    `pm-utils` 软件包允许你挂起到内存（suspend-to-RAM）和休眠（hibernate）：


    ```

    pacman -S pm-utils

    ```


    Pm-utils wiki 页面。


    # Laptop-Mode


    `laptop-mode-tools` 软件包类似于是所有笔记本电脑电源管理工具的一站式配置。它与其他安装的工具配合工作，根据需要可以完全配置从硬盘旋转到
    X 显示 DPMS 待机时间等所有内容。


    ```

    pacman -S laptop-mode-tools

    ```


    在 `/etc/rc.conf` 的 `DAEMONS=` 行中添加 `laptop-mode` 并配置 `/etc/laptop-mode/laptop-mode.conf`。


