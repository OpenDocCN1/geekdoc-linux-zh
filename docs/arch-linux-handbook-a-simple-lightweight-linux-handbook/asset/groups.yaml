- md: '

    # Arch Linux Handbook


    # DON''T PANIC !


    The Arch Linux system is assembled by the *user*, from the shell, using basic
    command line tools. This is **The Arch Way**. Unlike the more rigid structures
    of other distributions and installers, there are no default environments or configurations
    chosen for you. From the command line, *you* will add packages from the Arch repositories
    using the pacman tool via your internet connection and manually configure your
    installation by editing text files until your system is customized to your requirements.
    You will also manually add non-root user(s) and manage groups and permissions.
    This method allows for maximum flexibility, choice, and system resource control
    from the base up.


    Arch Linux is aimed at competent GNU/Linux users who desire minimal ''code separation''
    from their machine.


    # License


    Arch Linux, pacman, documentation and scripts are copyright ©2002-2007 by Judd
    Vines, ©2007-2009 by Aaron Griffin and are licensed under the GNU General Public
    License Version 2.


    # The Arch Way


    **The design principles behind Arch are aimed at keeping it simple.**


    ''Simple'', in this context, shall mean ''without unnecessary additions, modifications,
    or complications''.. In short: an elegant, minimalist approach.


    # Some thoughts to keep in mind:


    - "Simple'' is defined from a technical standpoint, not a usability standpoint.
    It is better to be technically elegant with a higher learning curve, than to be
    easy to use and technically [inferior]." -Aron Griffin

    - Entia non sunt multiplicanda praeter necessitat or "Entities should not be multiplied
    unnecessarily." -Occam''s razor. The term *razor* refers to the act of shaving
    away unnecessary complications to arrive at the simplest explanation, method or
    theory.


    > "The extraordinary part of [my method] lies in simplicity..The height of cultivation
    always runs to simplicity." - Bruce Lee


    # About This Guide


    The Arch wiki is an excellent resource and should be consulted for issues first;
    IRC (freenode #archlinux), and the forums are also available if the answer cannot
    be found.


    Note: Following this guide closely is essential in order to successfully install
    a properly configured Arch Linux system, so please read it thoroughly. It is strongly
    recommended you read each section completely before carrying out the tasks contained.


    Since GNU/Linux Distributions are fundamentally ''modular'' by design, the guide
    is logically divided into 4 main components of a desktop UNIX-like operating system:


    Part I: Installing the Base system


    Part II: Configure & Update the New Arch Linux base system


    Part III: Installing X and configuring ALSA


    Part IV: Installing a Desktop Environment


    Welcome to Arch! Enjoy the installation; take your time and have fun!


    Now, let''s get started....


    # Part I: Install the Base System


    # Step 1: Obtain the latest Installation media


    You can obtain Arch''s official installation media from http://archlinux.org/download/.
    The latest version is 2009.08


    - Both the Core installer and the FTP/HTTP-downloads provide only the necessary
    packages to create an Arch Linux base system. Note that the Base System does not
    include a GUI. It is mainly comprised of the GNU toolchain (compiler, assembler,
    linker, libraries, shell, and a few useful utilities), the Linux kernel, and a
    few extra libraries and modules.

    - The isolinux images are provided for people who experience trouble using the
    grub version. There are no other differences.

    - The Arch64 FAQ (http://wiki.archlinux.org/index.php/Arch64_FAQ ) can help you
    chose between the 32- and 64-bit versions.


    # CD installer


    Burn the .iso to a CD with your preferred burner, and continue with Step 2: Boot
    Arch Linux Installer


    **Note:** Optical drives as well as CD media quality vary greatly, but generally,
    using a slow burn speed is recommended for reliable burns; Some users recommend
    speeds as low as 4x or 2x. If you are experiencing unexpected behavior from the
    CD, try burning at the minimum speed supported by your system.


    # Arch Linux Handbook


    # USB stick


    Warning: This will irrevocably destroy all data on your USB stick.


    # UNIX Method:


    Insert an empty or expendable USB stick, determine its path, and dump the .img
    to the USB stick with the /bin/dd program:


    ```

    dd if=archlinux-2009.08-[core_or_ftp]-i686.img of=/dev/sdx

    ```


    where if= the path to the img file and of= your USB device. Make sure to use /dev/sdx
    and not /dev/sdx1.


    # Check md5sum (optional):


    Make a note of the number of records (blocks) read in and written, then perform
    the following check:


    ```

    dd if=/dev/sdx count=number_of_records status=noxfer | md5sum

    ```


    The md5sum returned should match the md5sum of the downloaded archlinux image
    file; they both should match the md5sum of the image as listed in the md5sums
    file in the mirror distribution site.


    # Windows Method:


    Download Disk Imager from https://launchpad.net/win32-image-writer/+download.
    Insert flash media. Start the Disk Imager and select the image file. Select the
    Drive letter associated with the flash drive. Click "write".


    Continue with Step 2: Boot Arch Linux Installer


    # Step 2: Boot Arch Linux Installer


    Insert the CD or USB stick and boot from it. You may have to change the boot order
    in your computer BIOS or press a key (usually DEL, F1, F2, F11 or F12) during
    the BIOS POST phase.


    Memory requirements:


    - CORE: 160 MB RAM x86_64/i686 (all packages selected, with swap partition)

    - FTP: 160 MB RAM x86_64/i686 (all packages selected, with swap partition)


    Choose Boot Archlive or Boot Archlive [legacy IDE] if you have trouble with libata/PATA.


    To change boot options e for editing the boot lines. Many users may wish to change
    the resolution of the framebuffer, for more readable console output. Append:


    ```

    vga=773

    ```


    to the kernel line, followed by <ENTER>, for a 1024x768 framebuffer.


    Hit b to boot.


    The system will now boot and present a login prompt. Login as ''root'' without
    quotes.


    If your system errors trying to boot from the live CD or there are other hardware
    errors, refer to the Installation Troubleshooting wiki page.


    # Changing the keymap


    If you have a non-US keyboard layout you can interactively choose your keymap/console
    font with the command:


    ```

    # km

    ```


    or use the loadkeys command:


    ```

    # loadkeys layout

    ```


    (replace layout with your keyboard layout such as "fr" or "be-latin1")


    # Documentation


    The official install guide is available on the live system. The official guide
    covers installation and configuration of the base system only. Change to vc/2
    (virtual console #2) with <ALT>F2 and invoke /usr/bin/less:


    ```

    # less /arch/docs/official_installation_guide_en

    ```


    less will allow you to page through the document. Change back to vc/1 with <ALT>+F1.


    Change back to vc/2 if you need to reference the Official Guide at any time.


    # Step 3: Start the Installation


    As root, run the installer script from vc/1:


    ```

    # /arch/setup

    ```


    # A: Select an installation source


    After a welcome screen, you will be prompted for an installation source. Choose
    the appropriate source for the installer you are using.


    # Part I: Install the Base System


    - If you chose the CORE installer, continue below with C: Prepare Hard Drive.

    - FTP/HTTP only: You shall be prompted to load ethernet drivers manually, if desired.
    Udev is quite effective at loading the required modules, so you may assume it
    has already done so. You may verify this by invoking ifconfig -a from vc/3. (Select
    OK to continue.)


    # Configure Network (FTP/HTTP)


    Available Interfaces will be presented. If an interface and HWaddr (HardWare address)
    is listed, then your module has already been loaded. If your interface is not
    listed, you may probe it from the installer, or manually do so from another virtual
    console.


    The following screen will prompt you to Select the interface, Probe, or Cancel.
    Choose the appropriate interface and continue.


