    # Useful DAEMONS


    Recall from above that a daemon is a program that runs in the background, waiting
    for events to occur and offering services. Some Xfce users prefer to use the hal
    daemon. The hal daemon, among other things, will automate the mounting of disks,
    optical drives, and USB drives/thumbrives for use in the GUI. The fam daemon will
    allow real-time representation of file alterations in the GUI, allowing instant
    access to recently installed programs, or changes in the file system. The hal
    and fam packages are installed when you install Xfce, but must be invoked to become
    useful.


    Start hal and fam:


    ```

    # /etc/rc.d/hal start

    # /etc/rc.d/fam start

    ```


    > **Note:** The hal daemon relies on, and will automatically start, the dbus daemon.


    Edit your DAEMONS array in /etc/rc.conf:


    ```

    # nano /etc/rc.conf

    ```


    Add **hal** and **fam** to your DAEMONS array, to invoke them at boot.


    > **Tip:** Advanced instructions for installing and configuring Xfce can be found
    in the Xfce article.


    If you wish to install one, see Adding a login manager (KDM, GDM, or XDM) to automatically
    boot on startup. Otherwise you can log in via the console and run:'
