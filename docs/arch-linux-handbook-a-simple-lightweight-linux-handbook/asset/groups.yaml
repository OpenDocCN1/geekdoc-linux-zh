    # LXDE


    # About LXDE


    LXDE, (for Lightweight X11 Desktop Environment), is a new project focused on providing
    a modern desktop environment which aims to be lightweight, fast, intuitive and
    functional while keeping system resource usage low. LXDE is quite different from
    other desktop environments, since each component of LXDE is a discrete and independent
    application, and each can be easily substituted by other programs. This modular
    design eliminates all unnecessary dependencies and provides more flexibility.
    Details and screenshots available at: http://lxde.org/


    LXDE provides:


    - 1. The OpenBox windowmanager

    - 2. PCManFM File manager

    - 3. LXPanel system panel

    - 4. LXSession session manager

    - 5. LXAppearance GTK+ theme switcher

    - 6. GPicView image viewer

    - 7. Leafpad simple text editor

    - 8. XArchiver: Lightweight, fast, and desktop-independent gtk+-based file archiver

    - 9. LXNM (still under development): Lightweight network manager for LXDE supporting
    wireless connections


    These lightweight and versatile tools combine for quick setup, modularity and
    simplicity.


    Install LXDE with:


    ```

    # pacman -S lxde

    ```


    Add:


    ```

    exec startlxde

    ```


