    # Arch Linux 手册


    `init` 的目的是将系统带入（并保持）可用状态。它通过启动脚本来实现这一点。正如你可能意识到的，Arch 使用 BSD 风格的启动脚本。`init` 读取
    `/etc/inittab` 文件，它告诉它做什么。查看 `inittab` 脚本，你会发现未注释的行定义了默认系统运行级别（runlevel），即 3。接下来它被要求运行一个初始化脚本。执行（或解释）该脚本的程序是
    `bash`，也就是给你提供命令行提示符的程序。在 Arch Linux 中，主初始化脚本是 `/etc/rc.sysinit`。它还定义了你的虚拟终端，如果它们被终止，`/sbin/init`
    会将它们“重新生成”。最后，如果希望在运行级别 5 下启动系统，`inittab` 定义了一个登录管理器。如果登录管理器被终止，`/sbin/init` 也会将其重新生成。


    `/etc/inittab` 指导 `init` 调用第一个启动脚本 `/etc/rc.sysinit`，之后（在正常启动下）将调用 `/etc/rc.multi`。最后一个运行的脚本是
    `/etc/rc.local`，它默认是空的。


    在运行级别 1（单用户模式）下启动时，运行的是 `/etc/rc.single` 而不是 `/etc/rc.multi`。你不会在 `/etc/rc.d/`
    目录下找到无限的符号链接集合来定义所有可能的运行级别的启动序列。事实上，由于这种方法，如果考虑到在运行级别 5 下启动，Arch 实际上只有三个运行级别。启动脚本使用了
    `/etc/rc.conf` 文件中的变量和定义，以及 `/etc/rc.d/functions` 脚本中定义的一通用函数。如果你计划编写自己的守护进程（daemon）文件，应该考虑查看此文件以及现有的守护进程脚本。


    # 启动脚本概述


    - 1. /etc/inittab（上文介绍）

    - 2. /etc/rc.sysinit

    - 3. /etc/rc.single

    - 4. /etc/rc.multi

    - 5. /etc/rc.local

    - 6. /etc/profile

    - 7. /etc/rc.shutdown

    - 8. /etc/rc.local.shutdown

    - 9. /etc/rc.d/*


    # /etc/rc.sysinit


    主系统启动脚本，负责挂载文件系统、运行 `udev`、激活交换分区、加载模块、设置本地化参数等。调用时，`udev` 将探测系统硬件，加载相应的内核模块并创建设备节点
    `/dev`。更多信息，请用你喜欢的编辑器打开 `/etc/rc.sysinit`；该文件有详细注释。


    # /etc/rc.single


    单用户启动。不用于正常启动。如果系统以单用户模式启动（例如在启动前使用内核参数 `1`，或在正常多用户操作期间使用命令 `init 1`），此脚本会确保除了最基本的组件（`syslog-ng`
    和 `udev`）外没有守护进程运行。如果你需要对系统进行任何更改，并确保没有远程用户可以任何可能导致数据丢失或损坏的操作，那么单用户模式非常有用。对于桌面用户来说，这种模式通常是没用的。


    # /etc/rc.multi


    多用户启动脚本。它启动 `/etc/rc.conf` 中 `DAEMONS=` 数组指定的所有守护进程（例如记录器、网络脚本等），之后调用 `/etc/rc.local`。


    # /etc/rc.local


    本地多用户启动脚本。默认为空。它是放置任何希望系统在启动过程最后尾运行的最后时刻命令的好地方。大多数常见的系统配置任务（如加载模块、更改控制台字体或设置设备）通常都有它们所属的专用位置。为了避免混淆，你应该确保你打算添加到
    `rc.local` 的任何内容已存在于 `/etc/profile.d/` 或任何其他现有的配置位置。


    # Arch Linux 手册


    `/etc/profile` 此脚本在每个用户登录时运行以初始化系统。它全局性定义了 `PS1`、`$PATH`、`bash` 别名等。在 Arch Linux
    下，它保持非常简单，就像大多数事情一样。你可能希望根据需要对其编辑或自定义。


    /etc/rc.shutdown


    系统关机脚本。它停止守护进程、卸载文件系统、停用交换分区等。


    /etc/rc.local.shutdown（可选）


    类似于 `/etc/rc.local` 文件，此文件可以包含任何你想在执行通用 `rc.shutdown` 之前运行的命令。请注意，此文件默认不存在，为了让它正常工作，必须将其设置为可执行。


    /etc/rc.d/*


    此目录包含 `/etc/rc.conf` 中 `DAEMONS=` 数组引用的守护进程脚本。除了启动时调用外，你可以在系统运行时使用这些脚本来管理你的系统服务。例如，命令


    ```

    /etc/rc.d/postfix stop

    ```


    将停止 postfix 守护进程。该目录默认不在 `$PATH` 中，但为了方便起见可以添加。显然，只有在安装了相应软件包（在此例中为 postfix）时，才存在相应的守护进程脚本。对于基础系统安装，这里的脚本很少，但请放心，所有相关的守护进程脚本最终都会这里。如果你愿意，当然可以创建自己的脚本并将其放在此处，以便由
    `/etc/rc.conf` 中的 `DAEMONS=` 数组调用。


    （注：原文文本中存在大量重复段落，译文已按要求去重，仅保留核心内容。）


