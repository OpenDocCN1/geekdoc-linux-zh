    # Maintaining the system


    su


    su or su - ?


    The default behavior of


    ```

    su

    ```


    is to remain within the current directory and to maintain the environmental variables
    of the original user (rather than switch to those of the new user). It sometimes
    can be advantageous for a system administrator to use the shell account of an
    ordinary user rather than its own. In particular, occasionally the most efficient
    way to solve a user''s problem is to log into that user''s account in order to
    reproduce or debug the problem.


    However, in many situations it is not desirable, or it can even be dangerous,
    for the root user to be operating from an ordinary user''s shell account and with
    that account'' environmental variables rather than from its own. While inadvertently
    using an ordinary user''s shell account, root could install a program or make
    other changes to the system that would not have the same result as if they were
    made while using the root account. For instance, a program could be installed
    that could give the ordinary user power to accidentally damage the system or gain
    unauthorized access to certain data.


    Thus, it is advisable that administrative users, as well as any other users that
    are authorized to use su (of which there should be few, if any), acquire the habit
    of always following the su command with a space and then a hyphen.(login shell
    option) The hyphen has two effects: (1) it switches from the current directory
    to the home directory of the new user (e.g., to /root in the case of the root
    user) by logging in as that user, and (2) it changes the environmental variables
    to those of the new user as dictated by their ~/.bashrc. That is, if the first
    argument to su is a hyphen, the current directory and environment will be changed
    to what would expected if the'
