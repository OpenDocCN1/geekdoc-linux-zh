    此页面永远是不可能的。它只是展示了针对日常用户的一些优秀应用程序。

    可能也值得检查轻量级软件。


    # Web 浏览器


    # Firefox


    流行的 Firefox 浏览器可以通过 pacman 获取，尽管它没有官方品牌。因此，程序打开时会显示为其开发代号 Shiretoko。

    安装方法：


    ```

