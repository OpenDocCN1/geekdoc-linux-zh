    # Part III: Install X and configure ALSA


    **Warning:** Starting the X server using input hotplugging without the HAL daemon
    installed and running may result in the inability to use the mouse and/or keyboard,
    and the X server appearing to freeze as a result.


    You must decide whether you will use input hotplugging (enabled by default), or
    disable it. Input hotplugging is convenient for many users, especially those with
    mobile machines like laptops and notebooks. Other users may wish to disable it
    in favor of manual or more static device configuration within /etc/xorg.conf.


    **Tip:** See the article on Xorg input hotplugging for full details.


    # Using input hotplugging


    Install HAL, dbus and the evdev input driver:


    ```

    # pacman -S hal dbus xf86-input-evdev

    ```


    Set the keyboard layout (if you do not use a standard US keyboard)


    ```

    # cp /usr/share/hal/fdi/policy/10osvendor/10-keymap.fdi /etc/hal/fdi/policy/

    # nano /etc/hal/fdi/policy/10-keymap.fdi

    ```


    Edit the "input.xkb.layout" key and possibly the "input.xkb.variant" key in this
    file.


    Laptop users will also need the synaptics package to allow X to configure the
    touchpad:'
