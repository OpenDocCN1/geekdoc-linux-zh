    ## 第一部分：安装基础系统


    系统的文件系统。`/etc/fstab` 文件最常用于 `mount` 命令。`mount` 命令获取设备上的文件系统，并将其添加到你在使用系统时看到的主系统层次结构中。`mount
    -a` 从 `/etc/rc.sysinit` 调用，大约在启动过程的 3/4 处，读取 `/etc/fstab` 以确定挂载其中指定设备时应使用哪些选项。如果
    `/etc/fstab` 中的文件系统后面附加了 `noauto`，则 `mount -a` 在启动时不会挂载它。


    ## 一个 /etc/fstab 示例


    | <file system> | <dir> | <type> | <options> | <dump> | <pass> |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | none | /dev/pts | | defaults | | 0 |

    | none | /dev/shm | tmpfs | defaults | | 0 |

    | #/cdrom | /media/cdrom | auto | | | |

    | ro, noauto, unhide | /media/dvd | auto | | | |

    | #/dvd | | auto | | | |

    | ro, noauto, unhide | /media/fl | auto | | | |

    | #/fd0 | | | | | 0 |

    | user, noauto | | jfs | | | |

    | /dev/disk-by-uuid/ec-933.. | / | | defaults, noatime | jfs | | |

    | /dev/disk-by-uuid/7ef-223.. | /home | | defaults, noatime | | 1 |

    | /dev/disk-by-uuid/530-1e-.. | swap | swap | defaults | | 0 |

    | /dev/disk-by-uuid/4fe-110.. | /var | reiserfs | defaults, noatime, notail |
    | 2 |


    注意：''noatime'' 选项禁用了向文件元数据中写入读取访问时间，无论你指定的系统系统类型，都可以安全地附加到 `/` 和 `/home`，以提高速度、性能和能源效率。''notail''
    禁用了 ReiserFS 的 tailpacking 功能，以略低的磁盘使用效率为代价换取额外的性能。


    **注意：** 根（/）分区的 UUID 可能会有益处，因为在 GRUB 配置期间可能需要它。


    - `<file system>`：描述要挂载的块设备或远程文件系统。对于普通挂载，此字段将包含指向块设备节点的链接（由 `udev` 在启动时调用的 `mknod`
    创建），用于要挂载的设备；例如 ''/dev/cdrom'' 或 ''/dev/sda1''。Arch 安装程序默认通过 UUID 指定要挂载的文件系统，而不是显式给出设备。


    **注意：** 自 2008-04rc 起，Arch 现在使用 UUID（通用唯一标识符）命名规范来实现一致的设备映射。这是由于内核的发展，因为存储控制器的加载可能会导致系统无法启动或发生内核崩溃（kernel
    panic）。几乎每个主板可能会随机更改存储控制器驱动程序的加载顺序，并且可能有多个控制器（板载 SATA、板载 IDE），由于上述开发更新，`/dev/sda`
    在下次重启时可能会变成 `/dev/sdb`，因此为了可靠性采用了 UUID 持久设备命名规范。如果你不需要也不想使用 UUID，只需更改你的 fstab
    以使用任何所需的命名即可。（参阅此 wiki 文档获取更多关于持久性块设备命名的信息。）


    ```bash

    ls -lF /dev/disk/by-uuid/

    ```


    将按 UUID 列出所有分区，而


    ```bash

    /sbin/blkid

    ```


    将显示一个每个分区与其标签、文件系统类型和 UUID 对应的列表。*注意：此命令由 e2fprogs 软件包安装。*


    - `<dir>`：描述文件系统的挂载点。对于交换分区（swap），此字段应指定为 ''swap''；（交换分区实际上并没有被挂载。）


    - `<type>`：描述文件系统的类型。Linux 内核当前支持许多由运行内核支持的文件系统，请参见 `/proc/filesystems`。条目 ''swap''
    表示用于交换的文件或分区。条目 ''ignore''导致该行被忽略。这对于显示当前未使用的磁盘分区很有用。


    - `<options>`：描述与文件系统相关的挂载选项。其格式为逗号分隔的选项列表，中间没有空格。它至少包含挂载类型以及任何适用于文件系统类型的附加选项。关于非
    nfs 文件系统可用选项的文档，请参见 `mount(8)`。


    - `<dump>`：用于 `dump(8)` 命令确定要备份哪些文件系统。dump 是一个备份实用。如果第五字段不存在或返回为空，则 dump 将假设该文件系统不需要备份。*注意，默认没有安装
    dump。*


    - `<pass>`：用于 `fsck(8)` 程序确定在启动时进行文件系统检查的顺序。根文件系统的 `<pass>` 应指定为 1，其他文件系统的 `<pass>`
    应为 2 或 0。同一驱动器内的文件系统将按顺序检查，不同驱动器的文件系统将同时检查，以利用硬件提供的并行性。如果第六字段不存在或为零，则返回零，fsck
    将假设该文件系统不需要检查。


    - 如果你计划使用 hal 来自动挂载 DVD 等媒体，则使用 `mkinitcpio` 来创建 initramfs。


    ## /etc/mkinitio.conf


    此文件允许你精调 initramfs。如果你使用静态 IP，请在 `/etc/resolv.conf` 中设置你的 DNS 服务器（nameserver <ip-address>）。你可以设置任意数量的服务器。


    '
