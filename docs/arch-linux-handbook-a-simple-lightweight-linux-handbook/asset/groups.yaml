    # Openbox


    Openbox is a standards compliant, fast, light-weight, extensible window manager.


    Openbox works with your applications, and makes your desktop easier to manage.
    This is because the approach to its development was the opposite of what seems
    to be the general case for window managers. Openbox was written first to comply
    with standards and to work properly. Only when that was in place did the team
    turn to the visual interface.


    Openbox is fully functional as a stand-alone working environment, or can be used
    as a drop-in replacement for the default window manager in the GNOME or KDE desktop
    environments.


    Install openbox using


    ```

    # pacman -S openbox

    ```


    Additional configuration tools are also available, if desired:


    ```

    # pacman -S obconf obmenu

    ```


    Once openbox is installed you will get a message to move menu.xml & rc.xml to
    ~/.config/openbox/ in your home directory:'
  - '[PAGE 106]


    # Part IV: Installing and configuring a Desktop Environment


    ```

    # su - username

    $ mkdir -p ~/.config/openbox/

    $ cp /etc/xdg/openbox/rc.xml ~/.config/openbox/

    $ cp /etc/xdg/openbox/menu.xml ~/.config/openbox/

    ```


    **rc.xml** is the main configuration file for OpenBox. It may be manually edited,
    (or you can use OBconf). **menu.xml** configures the right-click menu.


    You may log into OpenBox via graphical login using KDM/GDM, or from the shell
    using startx, in which case you will need to edit your ~/.xinitrc (as non-root
    user) and add the following:


    ```

    exec openbox-session

    ```


    NOTE: If you plan on running dbus (which is required by hal) then make sure your
    ~/.xinitrc reads:


    ```

    exec dbus-launch --exit-with-session openbox-session

    ```


    You may also start OpenBox from the shell using **xinit**:


    ```

    $ xinit /usr/bin/openbox-session

    ```


    +   - Openbox may also be used as the window manager for GNOME, KDE, and Xfce.


    For KDM there is nothing left to do; openbox is listed in the sessions menu in
    KDM.


