    UNIX 是多用户环境。你不应该使用 root 账户进行日常工作。这不仅是糟糕的习惯，而且很危险。root 用于管理任务。相反，请使用 /usr/sbin/useradd
    程序添加一个普通的非 root 用户账户：


    ```

    # useradd -m -G [groups] -s [login_shell] [username]

    ```


    - -m 创建用户家目录为 /home/username。在他们的家目录中，用户可以写文件、删除文件、安装程序等。用户的家目录理应包含其数据和个人配置文件，即所谓的“点文件”（其名称以点开头）。（要查看点文件，请在你的文件管理器中启用相应选项或运行
    `ls -a` 切换。）如果用户（在 /home/username 下）和全局配置文件（通常在 /etc/ 下）之间存在冲突，将以用户文件中的设置为准。终端用户极可能修改点文件包括
    .xinitrc 和 .bashrc 文件，它们分别是 xinit 和 Bash 的配置文件。


    - 它们分别允许用户在登录时启动窗口管理器的能力，并允许设置别名（aliases）、用户指定的命令和环境变量。在创建用户时，他们的点文件应从 /etc/skel
    目录获取，那里存放着系统示例文件。


    - -G 用户也所属的其他辅助组列表。每个组之间用逗号分隔，中间没有空格。默认情况下，用户仅属于初始组 (users)。

    - -s 用户默认登录 shell 的路径和文件名。


    对你的非 root 用户有用的组包括：


    - audio - 用于涉及声卡及相关软件的任务

    - floppy - 如果适用，用于访问软盘

    - lp - 用于管理打印任务

    - optical - 用于与光驱相关的任务

    - storage - 用于管理存储设备

    - video - 用于视频任务和 3D 加速

    - wheel - 用于使用 sudo

    - power - 用于电源选项（如：通过电源按钮关机）


