    # Part I: Install the Base System


    information that is host-specific or varies with time is stored elsewhere.


    /tmp directory for programs that require temporary files


    /var contains variable data; spool directories and files, administrative and logging
    data, pacman''s cache, the ABS tree, etc.


    **Note:** Besides /boot


    There are several advantages for using discrete filesystems, rather than combining
    into one partition:


    +   * Security: Each filesystem may be configured in /etc/fstab as ''nosuid'',
    ''nodev'', ''noexec'', ''readonly'', etc.

    * Stability: A user, or malfunctioning program can completely fill a filesystem
    with garbage if they write permissions for it. Critical programs, which reside
    on a different filesystem remain unaffected.

    * Speed: A filesystem which gets written to frequently become somewhat fragmented.
    (An effective method of avoiding fragmentation is to ensure that each filesystem
    is never in danger of filling up completely.) Separate filesystems remain unaffected,
    and each can be defragmented separately as well.

    * Integrity: If one filesystem becomes corrupted, separate filesystems remain
    unaffected.

    * Versatility: Sharing data across several systems becomes more expedient when
    independent filesystems are used. Separate filesystem types may also be chosen
    based upon the nature of data and usage.


    In this example, we shall use separate partitions for /, /var, /home, and a swap
    partition.'
- md: '

    # Arch Linux Handbook


    **Note:** /var contains many small files. This should be taken into consideration
    when choosing a filesystem type for it, (if creating its own separate partition).


    ## How big should my partitions be?


    This question is best answered based upon individual needs. You may wish to simply
    create **one partition for root and one partition for swap or only one root partition
    without swap** or refer to the following examples and consider these guidelines
    to provide a frame of reference:


    - The root filesystem (/) in the example will contain the /usr directory, which
    can become moderately large, depending upon how much software is installed. 15-20
    GB should be sufficient for most users.


    - The /home filesystem is typically user data, downloads, and multimedia reside.
    On a desktop system, /home is typically the largest filesystem on the drive by
    a large margin. Remember that if you chose to reinstall Arch, all the data on
    your /home partition will be untouched (so long as you have a separate /home partition).


    ## Part I: Install the Base System


    - An extra 25% of space added to each filesystem will provide a cushion for unforeseen
    occurrence, expansion, and serve as a preventive against fragmentation.


    From the guidelines above, the example system shall contain ~15GB root (/) ~7GB/var,
    1GB swap, and a /home containing the remaining disk space.


    ## Create Partition:cfdisk


    Start by creating the primary partition that will contain the root, (/) filesystem.


    Choose New -> Primary and enter the desired size for root (/). Put the partition
    at the beginning of the disk.

    Also choose the Type by designating it as ''83 Linux''. The created / partition
    shall appear as sda1 in our example.


    Now create a primary partition for /var, designating it as Type 83 Linux. The
    created /var partition shall appear as sda2.


    Next, create a partition for swap. Select an appropriate size and specify the
    Type as 82 (Linux swap / Solaris). The created swap partition shall appear as
    sda3.


    Lastly, create a partition for your /home directory. Choose another primary partition
    and set the desired size.

    Likewise, select the Type as 83 Linux. The created /home partition shall appear
    as sda4.


    Example:


    | Name | Flags | Part Type | FS Type [Label] Size (MB) |

    | --- | --- | --- | --- | --- |

    | sda1 | | Primary | Linux | 15440 #root |

    | sda2 | | Primary | Linux | 6256 #var |

    | sda3 | | Primary | Linux swap | 1024 #swap |

    | sda4 | | Primary | Linux | 140480 #home |


    Choose Write and type ''yes''. Beware that this operation may destroy data on
    your disk. Choose Quit to leave the partitioner.


    # Arch Linux Handbook


    Choose Done to leave this menu and continue with "Set Filesystem Mountpoints".


    **Note:** Since the latest developments of the Linux kernel which include the
    libata and PATA modules, all IDE, SATA and SCSI drives have adopted the sdx naming
    scheme. This is perfectly normal and should not be a concern.


    ## Set Filesystem Mountpoints


    First you will be asked for your swap partition. Choose the appropriate partition
    (sda3 in this example). You will be asked if you want to create a swap filesystem;
    select yes. Next, choose where to mount the / (root) directory (sda1 in the example).
    At this time, you will be asked to specify the filesystem type.


    ## Filesystem Types


    Again, a filesystem type is a very subjective matter which comes down to personal
    preference. Each has its own advantages, disadvantages, and unique idiosyncrasies.
    Here is a very brief overview of supported filesystems:


    - 1. **ext2 Second Extended Filesystem**: Old, reliable GNU/Linux filesystem.
    Very stable, but without journaling support. May be inconvenient for / and /home,
    due to very long fscks. An ext2 filesystem can be easily converted to ext3. Generally
    regarded as a good choice for /boot/.


    - 2. **ext3 Third Extended Filesystem**: Essentially the ext2 system, but with
    journaling support. ext3 is completely compatible with ext2. *Extremely* stable,
    mature, and by far the most widely used, supported and developed GNU/Linux FS.


    High Performance Filesystems:


    - 3. **ext4 Fourth Extended Filesystem**: Backward compatible with ext2 and ext3,
    introduces support for volumes with sizes up to 1 exabyte and files with sizes
    up to 16 terabyte. Increases the 32,000 subdirectory limit in ext3 to 64,000.
    Offers online defragmentation ability.


    **Note:** ext4 is a new filesystem and may have some bugs.


    - **ReiserFS** (V3)- Hans Reiser''s high-performance journaling FS uses a very
    interesting method of data throughput based on an unconventional and creative
    algorithm. ReiserFS is touted as very fast, especially when dealing with many
    small files. ReiserFS is fast at formatting, yet comparatively slow at mounting.
    Quite mature and stable. ReiserFS is not actively developed at this time (Reiser4
    is the new Reiser system). Generally regarded as a good choice for /var.


    - **JFS** - IBM''s Journaled FileSystem-the first system journaling. JFS had many
    years of use in the IBM AIX OS before being ported to Linux. JFS currently uses
    the least CPU resources of any GNU/Linux filesystem. Very fast at formatting,
    mounting and fsck, and very good all-around performance, especially in conjunction
    with the deadline I/O scheduler. (See JFS.) Not as widely supported as ext or
    ReiserFS, but very mature and stable.


    - **XFS** - Another early journaling filesystem originally developed by Silicon
    Graphics for the IRIX OS and ported to Linux. XFS offers very fast throughput
    on large files and large filesystems. Very fast at formatting and mounting. Generally
    benchmarked as slower with many small files, in comparison to other filesystems.
    XFS is very mature and offers online defragmentation ability.


    - JFS and XFS filesystems cannot be **shrunk** by disk utilities (such as gparted
    or parted magic)


    ## **A note on Journaling**


    All above filesystems, except ext2, use journaling. Journaling file systems are
    fault-resilient file systems that use a journal to log changes before they are
    committed to the file system to avoid metadata corruption in the event of a crash.
    Note that not all journaling techniques are alike; specifically, only ext3 and
    ext4 offer *data-mode journaling*, (though, not by default), which journals both
    data and meta-data (but with a significant speed penalty). The others only offer
    ordered-mode journaling, which journals meta-data only. While all will return
    your filesystem to a valid state after recovering from a crash, data-mode journaling
    offers the greatest protection against file corruption and data loss but as data
    is written twice (first to the journal, then to the disk). Depending upon how
    important your data is, this may be a consideration in choosing your filesystem
    type.


    ## Moving on...


    Choose and create the filesystem (format the partition) for / by selecting yes.
    You will now be prompted to add any additional partitions. In our example, sda2
    and sda4 remain. For sda2, choose a filesystem type and mount it as /var. Finally,
    choose the filesystem type for sda4, and mount it as /home. Return to main menu.


    ## D: Select Packages


    Now we shall select packages to install in our system.


    - Core ISO: Choose CD as source and select the appropriate CD drive if you have
    more than one.

    - FTP ISO: Select an FTP/HTTP mirror. Note that archlinux.org is throttled to
    50KB/s.


    Package selection is split into two stages. First, select the package category:


    > Note: For expedite, all packages in base are selected


    - Base: The minimal environment. Always select it and only remove packages you
    don''t use.

    - Base-devel: Extra tools such as make, automake and wireless-tools as well as
    wireless firmwares. Most beginners should choose to install it, and will probably
    need it later.


    After category selection, you will be presented with the full lists of packages,
    allowing you to fine-tune your selections. Use the space bar to select and unselect.


    **Note**: If you are going to require connection to a wireless network with WPA
    encryption, consider installing netcfg (as well as wireless_tools), which will
    enable you to do so.


    Once you''re selecting the packages you need, leave the selection screen and continue
    to the next step, Install Packages.


    ## E: Install Packages


    Next, choose ''Install Packages''. You will be asked if you wish to keep the packages
    in the pacman cache. If you choose ''yes'', you will have the flexibility to downgrade
    to previous package versions in the future, so this is recommended (you can always
    clear the cache in the future). The installer script will now install the selected
    packages, as well as the default Arch 2.6 kernel, to your system.


    - FTP ISO: Pacman package manager will now download and install your selected
    packages. (See vc/5 for output, vc/1 to return to the installer)

    - CORE ISO: The packages will be installed from the CD.


    ## F: Configure the System


    Closely following and understanding these steps is of key importance to ensure
    a properly configured system.


    At this stage of the installation, you will configure the primary configuration
    files of your Arch Linux base system.


    Previous versions of the installer included hwdet to gather information for your
    configuration. This has been deprecated, and udev should handle most module loading
    automatically at boot.

    '
  mdcn: '


    # Arch Linux 手册


    **注意：** `/var` 包含许多小文件。在为其选择文件系统类型时（如果为其创建了独立的分区），应该考虑到这一点。


    ## 我的分区应该有多大？


    此问题最好根据个人需求来回答。你可能希望简单地创建**一个根分区和一个交换空间分区，或者只创建一个不带交换分区的根分区**，或者参考以下示例并考虑这些指南以提供参考：


    - 示例中的根文件系统（/）将包含 `/usr` 目录，取决于安装了多少软件，该目录可能会变得相当大对于大多数用户来说，15-20 GB 就足够了。


    - `/home` 文件系统通常存放用户数据、下载内容和多媒体。在桌面系统中，/home 通常是磁盘上最大的文件系统。请记住，如果你选择重新安装 Arch，`/home`
    分区上的所有数据都将保持不变（只要你创建了独立的 `/home` 分区）。


    ## 第一部分：安装基础系统


    - 为每个文件系统额外增加 25% 的空间可以为意外情况、扩展提供缓冲，并作为防止碎片的措施。


    根据上述指南，示例系统应包含约 15GB 的根（/）、约 7GB 的 /var、1GB 的交换，以及一个包含剩余磁盘空间的 `/home`。


    ## 创建分区：cfdisk


    首先创建一个包含根（/）文件系统的主分区。


    选择 New（新建）-> Primary（主），并输入根（/）所需的大小。将分区放在磁盘开头。

    同时选择 Type（类型），将其指定为 ''83 Linux''。在示例中，创建的 / 分区将显示为 sda1。


    现在为 `/var` 创建一个主分区，将其指定为类型 83 Linux。创建的 `/var` 分区将显示为 sda2。


    接下来，为交换空间（swap）创建一个分区。选择合适的大小并将类型指定为 82 (Linux swap / Solaris)。创建的交换分区将显示为 sda3。


    最后，为你的 `/home` 目录创建一个分区。选择另一个主分区并设置所需的大小。

    同样，选择类型为 83 Linux。创建的 `/home` 分区将显示为 sda4。


    示例：


    | 名称 (Name) | 标志 (Flags) | 分区类型 (Part Type) | 文件系统类型 (FS Type) [标签] | 大小 (MB)
    |

    | --- | --- | --- | --- | --- |

    | sda1 | | Primary | Linux | 15440 #root |

    | sda2 | | Primary | Linux | 6256 #var |

    | sda3 | | Primary | Linux swap | 1024 #swap |

    | sda4 | | Primary | Linux | 140480 #home |


    选择 Write（写入）并输入 ''yes''。注意，此操作可能会破坏磁盘上的数据。选择 Quit（退出）离开分区工具。


    # Arch Linux 手册


    选择 Done（完成）退出此菜单并继续“设置文件系统挂载点”（Set Filesystem Mountpoints）。


    **注意：** 于 Linux 内核最新进展包含了 libata 和 PATA 模块，所有 IDE、SATA 和 SCSI 驱动器都采用了 sdx 命名方案。这是完全正常的，无需担心。


    ## 设置文件系统挂载点


    首先，系统会询问你的交换分区。选择合适的分区（示例中为 sda3）。系统会询问你是否要创建一个交换文件系统；选择 yes。接下来，选择挂载 /（根）目录的位置（示例中为
    sda1）。此时，你将被要求指定文件系统类型。


    ## 文件系统类型


    再次，文件系统类型是一个非常主观的问题，取决于个人偏好。每个文件系统都有自己的优点、缺点和独特之处。以下是支持的文件系统的简要概述：


    - 1. **ext2 第二扩展文件系统**：旧的、可靠的 GNU/Linux 文件系统。非常稳定，但不支持日志记录。由于 fsck 执行时间过长，对于 /
    和 /home 可能会不方便。ext2 文件系统可以很容易地转换为 ext3。通常被认为是 /boot/ 的良好选择。


    - 2. **ext3 第三扩展文件系统**：本质上是 ext2 系统，但带有日志支持。ext3 与 ext2 完全兼容。*极其*稳定、成熟，并且是迄今为止最广泛使用、支持和开发的
    GNU/Linux 文件系统。


    高性能文件系统：


    - 3. **ext4 第四扩展文件系统**：与 ext2 和 ext3 向后兼容，引入了对大小达 1 艾字节（EB）的卷和大小达 16 兆字节的文件的支持。将
    ext3 中的 32,000 个子目录限制增加到 64,000。提供了在线去碎片能力。


    **注意：** ext4 是一个新文件系统，可能存在某些 bug。


    - **ReiserFS** (V3)：Hans Reiser 的高性能日志文件系统，使用了一种基于非常规且创造性算法的趣味数据吞吐量方法。ReiserFS
    被认为非常快，特别是在处理许多小文件时。ReiserFS 格式化很快，但挂载相对较慢。相当成熟稳定。目前 ReiserFS 未再活跃开发（Reiser4 是新的
    Reiser 系统）。通常被认为是 /var 的良好选择。


    - **JFS** - IBM 的日志文件系统——第一个系统日志文件系统。JFS 在移植到 Linux 之前，已在 IBM AIX 操作系统中使用多年。JFS
    目前在任何 GNU/Linux 文件系统中使用的 CPU 资源最少。格式化、挂载和 fsck 速度非常快，整体性能非常好，特别是与 deadline I/O
    调度器配合时。（见 JFS。）支持程度不如 ext 或 ReiserFS 广泛，但非常成熟稳定。


    - **XFS** - 另一个早期日志文件系统，最初由 Silicon Graphics 为 IRIX OS 开发并移植到 Linux。XFS 在大文件和大型文件系统上提供极快的吞吐量。格式化和挂载非常快。与其他文件系统相比，在处理许多小文件时基准测试显示较慢。XFS
    非常成熟并提供在线去碎片能力。


    - JFS 和 XFS 文件系统无法通过磁盘工具（如 gparted 或 parted magic）进行**缩小**。


    ## **关于日志记录（Journaling）**


    除 ext2 外，上述所有文件系统都使用日志记录。日志文件系统是容错文件系统，它们在更改提交到文件系统之前使用日志记录更改，以避免在崩溃时发生元数据损坏。注意，并非所有的日志技术都是相同的；特别是，只有
    ext3 和 ext4 提供*数据模式日志记录*（尽管默认不开启），它会同时记录数据和元数据（但会有显著的速度损失）。其他仅提供顺序模式日志记录，仅记录元数据。虽然所有系统在从崩溃恢复后都能将文件系统恢复到有效状态，但数据模式日志记录对文件损坏和数据丢失提供了最大的保护，因为数据被写入两次（先写入日志，后写入磁盘）。取决于你的数据的重要性，这在选择文件系统类型时可能是一个考虑因素。


    ## 继续...


    选择 yes 来创建 / 的文件系统（格式化分区）。现在系统将提示添加任何额外分区。在我们的示例中，sda2 和 sda4 仍然存在。对于 sda2，选择文件系统类型并将其挂载为
    /var。最后，为 sda4 选择文件系统类型并将其挂载为 /home。返回主菜单。


    ## D: 选择软件包


    现在我们将选择要安装到系统的软件包。


    - Core ISO：选择 CD 为源，如果你有多个 CD 驱动器，请选择合适的 CD 驱动器。

    - FTP ISO：选择一个 FTP/HTTP 镜像。注意 archlinux.org 的速度限制为 50KB/s。


    软件包选择分为两个阶段。首先，选择包类别：


    > 注意：为了加速，base 中的所有包都已选中


    - Base：最小环境。始终选择它，并只移除你不使用的包。

    - Base-devel：额外的工具，如 make、automake 和无线工具以及无线固件。大多数初学者应该选择它，并且以后可能需要它。


    选择类别后，你将看到完整的软件包列表，允许你精调选择。使用空格键选择和取消选择。


    **注意**：如果你需要连接到 WPA 加密的无线网络，请考虑安装 netcfg（以及无线_tools），这将使你能够这样做。


    一旦选择了所需的软件包，离开选择屏幕并继续下一步：安装软件包。


    ## E: 安装软件包


    接下来，选择“安装软件包”。系统会询问你是否希望将软件包保留在 pacman 缓存中。如果你选择 ''yes''，你将获得回退到之前的版本的灵活性（你以后可以清除缓存）。安装脚本现在会将所选软件包以及默认的
    Arch 2.6 内核安装到你的系统中。


    - FTP ISO：Pacman 软件包管理器现在将下载并安装选择的软件包。（输出见 vc/5，返回安装程序见 vc/1）

    - CORE ISO：将从 CD 安装。


    ## F: 配置系统


    密切遵循并理解这些步骤对于确保配置正确至关重要。


    在安装的此阶段，你将配置 Arch Linux 基础系统的配置文件。


    以前版本的安装程序包含了 hwdet 来收集你的配置信息。这已被废弃，udev 应该在启动时自动处理大多数模块加载。


    '
