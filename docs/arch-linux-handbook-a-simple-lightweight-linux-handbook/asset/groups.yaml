  - '[PAGE 80]


    # Part III: Install X and configure ALSA


    # C: Install Input Driver Packages


    The latest X requires you to install drivers for your input devices, keyboard
    and mouse included. For a complete list of available input drivers,


    ```

    # pacman -Ss xf86-input | less

    ```


    For most users, xf86-input-keyboard and xf86-input-mouse should be sufficient
    for a basic setup. Use pacman to install your desired drivers for your input devices.
    e.g.:


    ```

    # pacman -S xf86-input-keyboard

    ```


    # Step 3: Configure X


    # A: The xorg.conf file


    /etc/X11/xorg.conf is the main configuration file for your X Window System, the
    foundation of your Graphical User Interface. It is a plain text file ordered into
    sections and subsections. Important sections are Files, InputDevice, Module, Monitor,
    Modes, Screen, Device, and ServerLayout. Sections can appear in any order and
    there may be more than one section of each kind, for example, if you have more
    than one monitor, or if your laptop has a trackpoint as well as a mouse.


    Since X11R7.2 the X.Org X Server features autoconfiguration. Therefore, it can
    function without an xorg.conf file in many cases. If the autoconfiguration works
    satisfactorily and you do not need to specify special features such as aiglx,
    compositing and so forth, you may forgo creating an xorg.conf file.'
  - '[PAGE 81]


    # Arch Linux Handbook


    # Standard xorgconf generation


    Advanced users may wish to manually create their own xorg.conf file. You may also
    use the /usr/bin/Xorg program with the -configure option to generate a basic config
    file; As root, do:


    ```

    # Xorg -configure

    ```


    This will create a config file at /root/xorg.conf.new

    Copy the file to /etc/X11/


    ```

    # cp /root/xorg.conf.new /etc/X11/xorg.conf

    ```


    # Alternative xorgconf generation


    Newer versions of the Xorg Server(>1.6) do not include the /usr/bin/xorgconf or
    /usr/bin/xorgcfg scripts. If you run into problems generating/using an xorg.conf
    file, you might want to consider using this guide.


    See the article on X.Org, section "Without xorg.conf".


    +   Note that if you are in possession of a properly configured xorg.conf under
    another distribution and with the same Xorg version, you may easily copy it over
    to your current Arch system''s /etc/X11/ directory.


    # B: Input hotplugging


    Input hotplugging is supported since the 1.4 version of the X.Org X Server and
    enabled by default. When enabled, X will utilize hal to allow for the hotplugging
    and removal of human interface devices without having to restart X.'
