    \ libgl ati-dri\n```\n\nInstall the radeonhd ATI Driver with\n\n```bash\n# pacman\
    \ -S xf86-video-radeonhd libgl ati-dri\n```\n\nThe proprietary ATI driver Catalyst\
    \ was once a precompiled package offered by Arch in the extra repository, but\
    \ as of March 2009, official support has been dropped because of dissatisfaction\
    \ with the quality and speed of development of the proprietary driver. The catalyst\
    \ driver is now available in AUR. Installation information for Catalyst driver\
    \ is available here.\n\n**Warning:** The proprietary ATI driver supports only\
    \ R600 and newer devices (that means, HD2xxx and newer). The older ones (X1xxx\
    \ and older) aren't supported.\n\n**Tip:** Advanced instructions for ATI configuration\
    \ can be found in the ATI wiki article.\n\n## Part III: Install X and configure\
    \ ALSA\n\n## C: Install Input Driver Packages\n\nThe latest X requires you to\
    \ install drivers for your input devices, keyboard and mouse included. For a complete\
    \ list of available input drivers,\n\n```bash\n# pacman -Ss xf86-input | less\n\
    ```\n\nFor most users, xf86-input-keyboard and xf86-input-mouse should be sufficient\
    \ for a basic setup. Use pacman to install your desired drivers for your input\
    \ devices. e.g.:\n\n```bash\n# pacman -S xf86-input-keyboard\n```\n\n## Step 3:\
    \ Configure X\n\n## A: The xorg.conf file\n\n/etc/X11/xorg.conf is the main configuration\
    \ file for your X Window System, the foundation of your Graphical User Interface.\
    \ It is a plain text file ordered into sections and subsections. Important sections\
    \ are Files, InputDevice, Module, Monitor, Modes, Screen, Device, and ServerLayout.\
    \ Sections can appear in any order and there may be more than one section of each\
    \ kind, for example, if you have more than one monitor, or if your laptop has\
    \ a trackpoint as well as a mouse.\n\nSince X11R7.2 the X.Org X Server features\
    \ autoconfiguration. Therefore, it can function without an xorg.conf file in many\
    \ cases. If the autoconfiguration works satisfactorily and you do not need to\
    \ specify special features such as aiglx, compositing and so forth, you may forgo\
    \ creating an xorg.conf file.\n\n## Arch Linux Handbook\n\n### Standard xorgconf\
    \ generation\n\nAdvanced users may wish to manually create their own xorg.conf\
    \ file. You may also use the /usr/bin/Xorg program with the -configure option\
    \ to generate a basic config file; As root, do:\n\n```bash\n# Xorg -configure\n\
    ```\n\nThis will create a config file at /root/xorg.conf.new.\nCopy the file to\
    \ /etc/X11/\n\n```bash\n# cp /root/xorg.conf.new /etc/X11/xorg.conf\n```\n\n###\
    \ Alternative xorgconf generation\n\nNewer versions of the Xorg Server (>1.6)\
    \ do not include the /usr/bin/xorgconf or /usr/bin/xorgcfg scripts. If you run\
    \ into problems generating/using an xorg.conf file, you might want to consider\
    \ using this guide.\n\nSee the article on X.Org, section \"Without xorg.conf\"\
    .\n\n- Note that if you are in possession of a properly configured xorg.conf under\
    \ another distribution and with the same Xorg version, you may easily copy it.\n\
    \n## B: Input hotplugging\n\nInputplugging is supported since 1.4 and enabled\
    \ by default. Inputplugging is convenient for many users, especially with mobile\
    \ machines like laptops. You must decide whether you will use input hotplugging\
    \ (enabled by default), or disable it.\n\n## Part III: Install X and configure\
    \ ALSA\n\n**Warning:** Starting the X server using input hotplugging without HAL\
    \ installed may result in the inability to use mouse and/or keyboard\n\n**Tip:**\
    \ For instructions on fine tuning or troubleshooting touchpad settings, see the\
    \ Touchpad Synaptics article.\n\n## Arch Linux Handbook\n\n### Disabling input\
    \ hotplugging\n\nDisabling input hotplugging will skip devices detected by hal\
    \ and will use the keyboard/mouse configuration from xorg.conf:\n\n### Disable\
    \ input hotplugging\n\nOther users may wish to disable it in favor of static device\
    \ configuration.\n\n```bash\nSection \"ServerFlags\"\n    Option \"AutoAddDevices\"\
    \ \"False\"\nEndSection\n```\n\n### The HAL daemon\n\nThe hal daemon **must**\
    \ be started before the X server:\n\n```bash\n/etc/rc.d/hal start\n```\n\nAdd\
    \ the hal daemon to the DAEMONs array in /etc/rc.conf to start it at every boot.\n\
    \n## Arch Linux Handbook\n\n### Using input hotplugging\n\nInstall HAL, dbus and\
    \ the evdev driver:\n\n```bash\n# pacman -S hal dbus xf86-input-evdev\n```\n\n\
    Set the keyboard layout if not using a standard US keyboard Add option lines in\
    \ the \"InputDevice\" section of the /etc/X11/xorg.conf file specifying the keyboard\
    \ layout and variant:\n\n| Option \"XkbLayout\" \"be\" |\n| Option \"XkbVariant\"\
    \ \"\" |\n\nAlternative method using the setxkbmap command:\n\n```bash\n# setxkbmap\
    \ pl\n```\n\n(with the proper keyboard layout instead of pl of course) should\
    \ switch your keyboard layout in x. To make this permanent, add this command to\
    \ /home/<username>/.xinitrc before starting the window manager (before exec command\
    \ like startxfce4).\n\n## C: Test X\n\nFirst, read the warning about input hotplugging\
    \ in the previous section. To test the X server, run the X script with the -config\
    \ flag against the path/to/xorg.conf file. e.g.:\n\n```bash\n# X -config /etc/x11/xorg.conf\n\
    ```\n\nX should start with the white hollow vector X in the center of the screen,\
    \ which should respond to mouse, trackpoint or touchpad movement. Use CTRL-Alt-Backspace\
    \ to exit X.\n\n**Note:** Some users have found after the upgrade to Xorg 1.6\
    \ that this test fails (no hollow X appears and no capacity for cursor movement\
    \ is enabled), but this does not indicate a problem with the installation of X.\
    \ You may want to double check by running the next test in this guide.\n"
  mdcn: "\n\n## 第三部分：安装 X 并配置 ALSA\n\n# 加载 \"dri\"\n\n双击您的 `/etc/X11/xorg.conf` 以确保您的默认深度、水平同步、垂直刷新率和分辨率是可以接受的。\n\
