    # Arch Linux Handbook


    configured. You may choose to double-check the following files for integrity and
    proper settings:

    /etc/rc.conf # Specifically, check your HOSTNAME= and NETWORKING section for typos
    and errors.

    /etc/hosts # Double-check your format. (See above.)

    /etc/resolv.conf # If you are using a static IP. If you are using DHCP, this file
    will be dynamically created and destroyed by default, but can be changed to your
    preference. (See Network.)


    > **Tip:** Advanced instructions for configuring the network can be found in the
    Network article.


    # Wired LAN


    Check your Ethernet with


    ```

    # ifconfig -a

    ```


    All interfaces will be listed. You should see an entry for eth0, or perhaps eth1.


    - Static IP


    If required, you can set a new static IP with:


    ```

    # ifconfig eth0 <ip address> netmask <netmask> up

    ```


    and the default gateway with


    ```

    # route add default gw <ip address of the gateway>

    ```


    Verify that /etc/resolv.conf contains your DNS server and add it if it is missing.
    Check your network again with ping www.google.com. If everything is working now,
    adjust /etc/rc.conf as described above for static IP.


    # Part II: Configure & Update the New Arch base system


    - DHCP


    If you have a DHCP server/router in your network try:


    ```

    # dhcpcd eth0

    ```


    If this is working, adjust /etc/rc.conf as described above, for dynamic IP.


    # Wireless LAN


    - Ensure the driver has created a usable interface:


    ```

    # iwconfig

    ```


    - Bring the interface up with ifconfig <interface> up. e.g.:


    ```

    # ifconfig wlan0 up

    ```


    - (Optional) Scan for available access points:


    ```

    # iwlist wlan0 scan | less

    ```


    - Specify the id of the wireless network with iwconfig <interface> ssid <youressid>.
    Or, if using WEP, iwconfig <interface> ssid <youressid> key <yourwepkey>, e.g.:


    ```

    # iwconfig wlan0 ssid links key ABCDEF01234

    ```


    - Request an IP address with dhcpcd <interface>. e.g.:


    ```

    # dhcpcd wlan0

    ```


    - Ensure you can route:


    ```

    $ ping -c 3 www.google.com

    ```


    Done.


    # Analog Modem


    To be able to use a Hayes-compatible, external, analog modem, you need to at least
    have the ppp package installed. Modify the file /etc/ppp/options to suit your
    needs and according to man pppd. You will need to define a chat script to supply
    your username and password to the ISP after the initial connection has been established.
    The manpages for pppd and chat have examples in them that should suffice to get
    a connection up running if you''re either experienced or stubborn enough. With
    udev, your serial ports usually are /dev/tty0 or /dev/tty1.

    Instead of fighting a glorious battle with the plain pppd, you may opt to install
    wvdial or a similar tool to ease the setup process considerably. In case you''re
    using a so-called WinModem, which is basically a PCI plugin card working as an
    internal analog modem, you should indulge in the vast information found on the
    LinModem homepage.


    # ISDN


    Setting up ISDN is done in three steps:


    1. Install and configure hardware

    2. Install and configure the ISDN utilities

    3. Add settings for your ISP


    The current Arch stock kernels include the necessary ISDN modules, meaning that
    you will not need to recompile your kernel


    # Part II: Configure & Update the New Arch Linux base system


    unless you''re about to use rather odd ISDN hardware. After physically installing
    your ISDN card in your machine or plugging in your USB ISDN-Box, Nearly all passive
    ISDN PCI cards are handled by the hisax module, which needs two parameters: type
    and protocol. You must set protocol to ''1'' if your country uses the 1TR6 standard,
    ''2'' if it uses EuroISDN (EDSS1), ''3'' if you''re hooked to a so-called leased-line
    without D-channel, and ''4'' for US NI1.


    Details on all those settings and how to set them is included in the isdn subdirectory,
    and available online. The type parameter depends on your card; a list of all possible
    types can be found in the README.HiSax kernel documentation. Choose your card
    and and load the module with the appropriate options like:


    ```

    # modprobe hisax type=18 protocol=2

    ```


    This will load the hisax module for my ELSA Quickstep 1000PCI, being used in Germany
    with the EDSS1 protocol. You should find helpful debugging output in your /var/log/everything.log
    file, in which you should see your card prepared for action. Please note that
    you will probably need to load some USB modules before you can work with an external
    USB ISDN Adapter.


    Once you have confirmed that your card works with certain settings, you can add
    the module options to your /etc/modprobe.conf:


    ```

    alias ippp0 hisax

    options hisax type=18 protocol=2

    ```


    Alternatively, you can add only the options line here, and add hisax to your MODULES
    array in the rc.conf. It''s your choice, really, but this example has the advantage
    that the module will not be loaded until it''s really needed.


    That being done, you should have working, supported hardware. Now you need the
    basic utilities to use it!


    Install the isdn4k-utils package, and read the manpage to isdnctrl; it''ll get
    you started. Further down in the manpage you will find explanations on how to
    create a configuration file that can be parsed by isdnctrl, as well as some helpful
    setup examples. Please note that you have to add your SPID by your MSN setting
    separated by a colon if you use US NI1.


    After you have configured your ISDN card with the isdnctrl utility, you should
    be able to dial into the machine you specified with the PHONE_OUT parameter, but
    fail the username and password authentication. To make this work your username
    and password to /etc/ppp/pap-secrets or /etc/ppp/chap-secrets as if you were configuring
    a normal analogous PPP link, depending on which protocol your ISP uses for authentication.
    If in doubt, put your data into both files.


    If you set up everything correctly, you should now be able to establish a dial-up
    connection with


    ```

    # isdnctrl dial ippo0

    ```


    as root. If you have any problems, remember to check the logfiles!


    # DSL (PPPoE)


    These instructions are relevant to you only if your itself is supposed to manage
    the connection. You do not need to do anything but define correct default gateway
    if you are using a separate router of sort to do the grunt work.


    Before you can use your online connection, you will have to physically install
    the network card that is supposed to be connected to the DSL-Modem into your computer.
    After adding your newly installed network card to the modules/modprobe.conf or
    to the MODULES array, you should install the rp-pppoe package and run the ppoe-setup
    script to configure your connection. After you have entered all the data, you
    can connect and disconnect your line with


    ```

    # /etc/rc.d/adsl start

    ```


    and


    ```

    # /etc/rc.d/adsl stop

    ```


    respectively. The setup usually is rather easy and straightforward, but feel free
    to read the manpages for hints. If you want to automatically ''dial in'' on boot-up,
    add adsl to your DAEMONS array, and put a &! before the network entry, since the
    network is handled by adsl now.


    # Step 2: Update, Sync and Upgrade the system with pacman


    Now we will update the system using pacman.


    # What is pacman


    Pacman is the package manager of Arch Linux. Pacman is written in C and is designed
    from the ground up to be lightweight with a very modest memory footprint, fast,
    simple, and versatile. It manages your entire package system and handles installation,
    removal, package downgrade (through cache), custom compiled package handling,
    automatic dependency resolution, remote and local searches and much more. Pacman''s
    output is streamlined, very readable and provides ETA for each package download.
    Arch uses the .tar.gz package format, which further enhances pacman''s speed;
    Gzipped tarballs, though slightly larger, are decompressed many times faster than
    their Bzipped counterparts, and are therefore installed much more expediently.

