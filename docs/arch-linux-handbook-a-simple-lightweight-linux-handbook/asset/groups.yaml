    - 如果你需要面板，可以使用 PyPanel、Tint2 或 LXpanel

    - 如果你想设置背景，可以使用 feh

    - 如果你需要简单的文件管理器，可以使用 ROX

    - PcManFM 轻量但多功能的文件管理器（也提供桌面图标）

    - iDesk（在 AUR 中可用）提供桌面图标

    - Graveman 用于刻录 CD 或 DVD


    # fvwm2


    FVWM 是一个用于 X 系统的强大的、符合 ICCCM 标准的多虚拟桌面窗口管理器。开发活跃，支持良好。


    使用以下命令安装 fvwm：


    ```

