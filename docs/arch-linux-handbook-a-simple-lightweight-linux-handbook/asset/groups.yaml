- md: '

    ## Install an AUR Helper


    AUR Helpers like Yaourt and aurubuild add seamless access to the AUR. They vary
    in their features, but can ease in searching, fetching, building, and installing
    from over 9000 PKGBUILDs found in AUR.


    ## File and directory explanation


    "Shareable" files are defined as those that can be stored on one host and used
    on others. "Unshareable" files are those that are not shareable. For example,
    the files in user home directories are shareable whereas device lock files are
    not. "Static" files include binaries, libraries, documentation files and other
    files that do not change without system administrator intervention. "Variable"
    files are defined as files that are not static.


    - The root filesystem, represented by the slash symbol by itself, is the primary
    filesystem from which all other filesystems stem; the top of the hierarchy. All
    files and directories appear under the root directory "/", even if they are stored
    on different physical devices. The contents of the root filesystem must be adequate
    to boot, restore, recover, and/or repair the system.


    - /bin/ Essential command binaries that must be available in single user mode;
    for all users (e.g. cat, ls, cp). /bin/ provides programs that must be available
    even if only the partition containing / is mounted. This situation may arise should
    one need to repair other partitions but have no access to shared directories (i.e.
    you are in single user mode and therefore have no network access). /sbin, the
    /bin directory [sic likely /sbin] contains several useful commands that are of
    use to both the root user as well as non-root users.


    - /boot/ Unshareable, static directory containing the kernel and ramdisk images
    as well as the bootloader configuration file, and bootloader stages. /boot also
    stores data that is used before the kernel begins executing users programs. This
    may include saved master boot sectors and sector map files.


    - /dev/ Essential device nodes created by udev during the boot process and machine
    hardware is discovered by events. This directory highlights one important aspect
    of the UNIX filesystem - everything is a file or a directory. Exploring this directory
    will reveal many files, each representing a hardware component of the system.
    The majority of devices are either block or character devices; however other types
    of devices exist and can be created. In general, ''block devices'' are devices
    that store or hold data, whereas ''character devices'' can be thought of as devices
    that transmit transfer data. For example, hard disk drives and optical drives
    are categorized as block devices while serial ports, mice and USB ports are all
    character devices.


    - /etc/ Host-specific, unshareable global configuration files shall be placed
    in the /etc directory. If more than one configuration file is required for an
    application, it is customary to use a subdirectory in order to keep the /etc/
    area as clean as possible. It is considered good practice to make frequent backups
    of this directory as it contains all system related configuration files.


    - /etc/conf.d/ Some daemon will have a matching configuration file in this directory
    that contains some useful default values. When a daemon is started, it will first
    source the settings from its config file within this directory, and then source
    /etc/rc.conf. Arch''s simple, transparent scripting approach means you can easily
    finalize all your daemon configuration options in your /etc/rc.conf simply by
    setting an appropriate variable value, or split your configuration over multiple
    files if you prefer a decentralized approach to this issue.


    - /etc/rc.d/ All Arch daemons reside here. Custom scripts may also be placed here
    and invoked from the DAEMONs= array in /etc/rc.conf


    - /etc/X11/ Configuration files for the X Window System


    - /etc/X11/xinit/ xinit configuration files. ''xinit'' is a configuration method
    of starting up an X session that is designed to be used as part of a script.


    - /etc/X11/xinit/xinitrc Global xinit file, used by all X sessions started by
    xinit (startx). Its usage is of course overridden by a .xinitrc file located in
    the home directory of a user.


    - /home/ UNIX is a multi-user environment. Therefore, each user is also assigned
    a specific directory that is accessible only to them and to the root user. These
    are the user home directories, which can be found under /home/$USER (~). Within
    their home directory, a user can write files, delete them, install programs, etc.
    Users'' home directories contain data and personal configuration files, the so-called
    ''dot files'' (their name is preceded by a dot), which are ''hidden''. To view
    dotfiles, enable the appropriate option in your file manager or run ls with the
    -a switch. If there is a conflict between personal and system wide configuration
    files, the settings in the personal file will prevail. Dotfiles most likely to
    be altered by the end user include .xinitrc and .bashrc files. The configuration
    files for xinit and bash respectively allow the user ability to change the window
    manager to be started upon login and aliases, user-specified commands and environment
    variables respectively. When a user is created, their dotfiles shall be taken
    from the /etc/skel directory where system sample files reside. /home can become
    quite large as it is typically used for storing downloads, compiling, installing
    and running programs, mail, collections of multimedia files etc.


    - /lib/ Kernel modules and essential shared library images (the C programming
    code library) needed to boot the system and run the commands under /bin/ and /sbin/.
    Libraries are collections of frequently used program routines and readily identifiable
    through their filename extension of *.so. They are essential for basic system
    functionality. Kernel modules (drivers) are in the subdirectory /lib/modules/<kernel-version>.


    - /lost+found UNIX-like operating systems must execute a proper shutdown sequence.
    At times, a system might crash or a power failure might take the machine down.
    Either way, at the next boot, a filesystem check using the fsck program shall
    be performed. Fsck will go through the system and recover any corrupt files that
    it finds. The result of this recovery operation will be placed in this directory.
    The files recovered are not likely to be complete or much sense but there is always
    a chance that worthwhile is recovered.


    - /media/ Mount points for removable media. CDROMs, DVD''s, and USB sticks shall
    have an appropriate mount point under /media/. The motivation for the creation
    of this directory has been that historically there have a number of other different
    places used to mount removeable media such as /cdrom, /mnt or /mnt/cdrom. Placing
    the mount points for all removable media directly in the root directory would
    potentially result in a large number of extra directories in /. Although the use
    of subdirectories in /mnt as a mount point has recently been common, it conflicts
    with a much older tradition of using /mnt directly as a temporary mount point.
    Therefore Arch allocates /media as the mountpoint for removable media. On systems
    where more than one device exists for mounting a certain type of media, mount
    directories should be created by appending a digit to the name of those available
    above starting with ''0'', but the unqualified name must also exist.


    - "The hal" (Hardware Abstraction Layer) daemon mounts media to /media as /media/<name_of_removable_filesystem>


    - /**mnt/** This is a generic mount point for temporary filesystems or devices.
    Mounting is the process of making a filesystem available to the system. After
    mounting, files will be accessible under the mount-point. Additional mount-points
    (subdirectories) may be created under /mnt/. There is no limitation to creating
    a mount-point anywhere on the system, but by convention and for practicality,
    littering a file system with mount-points should be avoided.


    - /opt/** Packages and large static files that do not fit cleanly into the above
    GNU filesystem layout can be placed in /opt/. A package placing files in the /opt/
    directory creates a directory bearing the same name as the package. This directory
    in turn holds files that otherwise would be scattered throughout the file system.
    For example, the acrobat package has Browser, Reader, and Resource directories
    sitting at the same level as the bin directory. This doesn''t fit into- a normal
    GNU filesystem layout, so Arch places all the files in a subdirectory of /opt.


    - /proc/** proc is very special in that it is also a virtual filesystem. It is
    sometimes referred to as the *process information pseudo-file system*. It doesn''t
    contain ''real'' files, but rather, runtime system information (e.g. system memory,
    devices mounted, hardware configuration, etc.). For this reason it can be regarded
    as a control and information center for the kernel. In fact, quite a lot of system
    utilities are

    '
  mdcn: '


    ## 安装 AUR 助手


    像 Yaourt 和 aurubuild 等 AUR 助手可以让你无缝访问 AUR。虽然它们的功能各异，但都能方便对 AUR 中发现的 9000 多个 PKGBUILD
    文件进行搜索、获取、构建和安装。


    ## 文件和目录说明


    “可共享”（Shareable）文件定义为可以存储在一个主机上并在其他主机使用的文件。“不可共享”（Unshareable）文件是指不可共享的文件。例如，用户主目录下的文件是共享的，而设备锁文件则不可共享。“静态”（Static）文件包括二进制文件、库文件、文档文件以及在没有系统管理员干预的情况下不会改变的文件。“可变”（Variable）文件定义为非静态文件。


    - 根文件系统由单个斜杠符号 `/` 表示，是所有其他文件系统的根源的首要文件系统；它是层级结构的顶端。所有文件和目录都显示在根目录 `/` 下，即使它们被存储在不同的物理设备上。根文件系统的内容必须足够启动、恢复、恢复和/或修复系统。


    - `/bin/` 必须在单用户模式下可用的基本命令二进制文件；适用于所有用户（例如 `cat`, `ls`, `cp`）。`/bin/` 提供了即使只挂载了包含
    `/` 的分区也必须可用的程序。如果需要修复其他分区但无法访问共享目录（即你处于单用户模式，因此无法访问网络），可能会出现这种情况。`/sbin`（原文为
    /bin 目录 [此处很可能为 /sbin]）包含了几个对 root 用户和非 root 用户都非常有用的命令。


    - `/boot/` 不可共享的静态目录，包含内核和内存磁盘镜像，以及引导加载程序配置文件和引导加载程序阶段。`/boot` 还存储了在内核开始执行用户程序之前使用的数据。这可能包括保存的主引导扇和扇区映射文件。


    - `/dev/` 在启动过程中由 `udev` 创建的本质设备节点，机器硬件通过事件被发现。此目录突显了 UNIX 文件系统的一的一个重要方面——一切都是文件或目录。探索此目录将发现许多文件，每个文件代表系统的一个硬件组件。大多数设备是块设备或字符设备；然而，存在其他类型的设备并且可以创建它们。通常，“块设备”是存储或持有数据的设备，而“字符设备”可以被认为是传输数据的设备。例如，硬盘驱动器和光驱被归类为块设备，而串口、鼠标和
    USB 端口都是字符设备。


    - `/etc/` 主机特有的、不可共享的全局配置文件应存放在 `/etc` 目录。如果一个应用程序需要多个配置文件，习惯做法是使用子目录以保持 `/etc/`
    区域尽可能整洁。对此目录进行频繁备份被认为是一种良好的实践，因为它包含了所有系统相关的配置文件。


    - `/etc/conf.d/` 某些守护进程（daemon）在该目录下有一个匹配的配置文件，其中包含一些实用的默认值。当守护进程启动时，它会首先从该目录下的配置文件加载设置，然后加载
    `/etc/rc.conf`。Arch 简单透明的脚本方法意味着你可以通过简单设置合适的变量值轻松地在 `/etc/rc.conf` 中完成所有的守护进程配置选项，或者如果你倾向于使用去中心化的处理方法，可以将配置拆分到多个文件中。


    - `/etc/rc.d/` 所有 Arch 守护进程都位于这里。自定义脚本也可以放在这里，并从 `/etc/rc.conf` 中的 `DAEMONs=`
    数组中调用。


    - `/etc/X11/` X Window 系统的配置文件。


    - `/etc/X11/xinit/` xinit 配置文件。''xinit'' 是一种启动 X 会话的配置方法，设计用于作为脚本的一部分。


    - `/etc/X11/xinit/xinitrc` 全局 xinit 文件，用于由 xinit (startx) 启动的所有 X 会话。它的用法会被用户主目录下的
    `.xinitrc` 文件覆盖。


    - `/home/` UNIX 是一个多用户环境。因此，每个用户都被分配了一个特定的目录，只有他们自己和 root 用户可以访问。这些是用户主目录，可以在
    `/home/$USER` (`~`) 下找到。在主目录中，用户可以写文件、删除文件、安装程序等。用户的主目录包含数据和个人配置文件，即所谓的“点文件”（其名称以点开头），这些文件是“隐藏”的。如需查看点文件，请在文件管理器中启用相应的选项，或运行带
    `-a` 参数的 `ls`。如果个人配置和系统级配置之间存在冲突，将以个人文件的设置为准。终端用户最可能修改的点文件包括 `.xinitrc` 和 `.bashrc`
    文件。xinit 和 bash 的配置文件分别允许用户更改登录时启动的窗口管理器以及别名（aliases）、用户指定的命令和环境变量。当创建用户时，其点文件应取自
    `/etc/skel` 目录，那里存放着系统示例文件。`/home` 可能会变得很大，因为它通常用于存储下载内容、编译结果等。


    - `/lib/` 内核模块和共享库（程序代码），对于启动系统至关重要。内核模块（驱动）位于 `/lib/<kernel-version>`。


    - `/lost+found` 在系统崩溃或掉电后，必须使用 `fsck` 程序进行文件系统检查。fsck 将遍历系统并恢复任何损坏的文件。恢复的结果将放在此目录。


    - `/media/` 可移动介质的挂载点。光驱、DVD 和 USB 闪存应具有 `/media/` 下挂载点。创建此目录的动机是历史上有很多用于挂载可移动介质的地方，如
    `/cdrom`, `/mnt`。将所有可移动介质的挂载点直接放在根目录 `/` 可能会产生大量额外目录。虽然最近使用 `/mnt` 作为挂载点很常见，但这与将
    `/mnt` 直接作为挂载点的旧传统相冲突。因此 Arch 分配 `/media` 作为可移动介质的挂载点。对于存在多种类型介质的系统，应在名称后添加数字来创建挂载目录，但未指定的名称也必须存在。


    - "hal"（硬件抽象层）守护进程将介质挂载到 `/media/<name_of_removable_filesystem>`


    - /**mnt/** 这是临时文件系统或设备的通用挂载点。挂载是使文件系统可用的过程。挂载后，文件将在挂载点下可用。可以在 `/mnt` 下创建额外的挂载点（子目录）。但根据习惯和实用性，应避免在系统中散布挂载点。


    - /opt/** 不易于放入上述 GNU 文件系统布局的软件包和大型静态文件可以放在 `/opt` 中。在 `/opt/` 目录下放置文件的包会创建一个与包同名的目录。该目录包含了原本会分散在整个文件系统中的文件。例如，acrobat
    包的 Browser、Reader 和 Resource 目录与 bin 目录同级。这不符合正常的文件系统布局，因此 Arch 将所有文件放在了 `/opt`
    的子目录下。


    - /proc/** proc 非常特殊，因为它也是一个虚拟文件系统。它有时被称为*进程信息伪文件系统*。它不包含“真实”文件，而是运行中的系统信息（例如系统内存、挂载设备、硬件配置等）。由于这个原因，它可以被视为内核的控制和信息中心。事实上，相当多的系统工具都是


