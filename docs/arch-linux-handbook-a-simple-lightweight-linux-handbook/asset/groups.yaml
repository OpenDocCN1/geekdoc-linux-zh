    # Step 1: Install Fonts


    At this point, you may wish to save time by installing visually pleasing, true
    type fonts, before installing a desktop environment/window manager. Dejavu and
    bitstream-vera are good, general-purpose font sets. You may also want to have
    the Microsoft font sets, which are especially popular on websites.


    Install with:


    ```bash

    # pacman -S ttf-ms-fonts ttf-dejavu ttf-bitstream-vera

    ```


    # Step 2: ~/.xinitrc (again)


    As non-root user, edit your /home/username/.xinitrc to specify the DE you wish
    to use. This will allow you to use startx/xinit from the shell, in the future,
    to open your DE/WM of choice:


    ```bash

    $ nano ~/.xinitrc

    ```


    Uncomment or add the ''exec ..'' line of the appropriate desktop environment/window
    manager. Some examples are below:


    For the Xfce4 desktop environment:


    ```bash

    exec startxfce4

    ```


    For the KDE desktop environment:


    ```bash

    exec startkde

    ```


    # Part IV: Installing and configuring a Desktop Environment


    A startkde or startxfce4 command starts the KDE or Xfce4 desktop environment.
    This command does not finish until you logout of the DE. Normally the shell would
    wait for KDE to finish, then run the next command. The "exec" prefix to this command
    tells the shell that this is the last command, so the shell does not need to wait
    to run a subsequent command.


    If you have trouble with automounting, use the following command instead. Replace
    "startxfce4" with the command that is appropriate for your window manager.


    ```bash

    exec ck-launch-session startxfce4

    ```


    Remember to have only one uncommented exec line in your ~/.xinitrc.


    # Step 3: Install a Desktop Environment


    Continue below, installing the DE/WM of your choice.


    - GNOME

    - KDE

    - Xfce

    - LXDE

    - Openbox

    - Fluxbox

    - fwm2


    # GNOME


    # About GNOME


    The GNU Network Object Model Environment. The GNOME project provides two things:
    the GNOME desktop environment, an intuitive and attractive desktop for end-users,
    and the GNOME development platform, an extensive framework for building applications
    that integrate into the rest of the desktop.


    # Installation


    Install the base GNOME environment with:


    ```bash

    # pacman -S gnome

    ```


    Additionally, you can install the extras:


    ```bash

    # pacman -S gnome-extra

    ```


    It''s safe to choose all packages shown in the extra package.


    # Useful DAEMONS for GNOME


    Recall from above that a daemon is a program that runs in the background, waiting
    for events to occur and offering services. Some users prefer to use the hal daemon.
    The hal daemon, among other things, will automate the mounting of disks, optical
    drives, and USB drives/thumbrives for use in the GUI. The fam daemon will allow
    real-time access to recently installed programs, or changes in the file system.
    Both hal and fam can make life easier for the GNOME user. The hal and fam packages
    are installed when you install GNOME, but must be invoked to become useful.


    You may want to install a graphical login manager. For GNOME, the gdm daemon is
    a good choice.


    As root:


    ```bash

    # pacman -S gdm

    ```


    Start hal and fam:


    ```bash

    # /etc/rc.d/hal start

    # /etc/rc.d/fam start

    ```


    Add them to your /etc/rc.conf DAEMONS section, so they will be invoked at boot:


    ```bash

    # nano /etc/rc.conf

    DAEMONS=(syslog-ng network cron alsa hal fam gdm)

    ```


    (If you prefer to log into the console and manually start X, leave out gdm.)


    Then edit your /etc/gdm/custom.conf and in the [servers] section add:


    ```ini

    0=Standard vt7

    ```


    As normal user, start X:


    ```bash

    $ startx

    ```


    or


    ```bash

    $ xinit

    ```


    If ~/.xinitrc is not configured for GNOME, you may always start it with xinit,
    followed by the path to GNOME:


    ```bash

    $ xinit /usr/bin/gnome-session

    ```


    **Tip:** Advanced instructions for installing and configuring GNOME can be found
    in the Gnome article.


    Congratulations! Welcome to your GNOME desktop environment on your new Arch Linux
    system! You may wish to continue by viewing **Tweaks and finishing touches**,
    or the rest of the information below. You may also be interested in the Post Installation
    Tips wiki article.


    # Eye Candy


    By default, GNOME does not come with many themes and icons. You may wish to install
    some more attractive artwork for GNOME:

    A nice gtk (gui widget) theme engine (includes themes) is the murrine engine.
    Install with:


    ```bash

    # pacman -S gtk-engine-murrine

    ```


    Optional for more themes:


    ```bash

    # pacman -S murrine-themes-collection

    ```


    Once it has been installed, select it with System -> Preferences -> Appearance
    -> Theme tab.

    The Arch Linux repositories also have a few more nice themes and engines. Install
    the following to see for yourself:


    ```bash

    # pacman -S gtk-engines gtk-aurora-engine gtk-candido-engine gtk-rezlooks-engine

    ```


    You can find many more themes, icons, and wallpapers at GNOME-Look.


    # Part IV: Installing and configuring a Desktop Environment


    # KDE


    # About KDE


    The KDE Desktop Environment. KDE is a powerful Free Software graphical desktop
    environment for GNU/Linux and UNIX workstations. It combines ease of use, contemporary
    functionality, and outstanding graphical design with the technological superiority
    of UNIX-like operating systems.


    # Installation


    Choose one of the following, then continue below with Useful KDE DAEMONS:


    1. The package kde is the official and complete vanilla KDE 4.2 residing under
    the Arch [extra] repo.


    Install base kde:


    ```bash

    # pacman -S kdebase-workspace

    ```


    Install the whole Desktop Environment:


    ```bash

    # pacman -S kde

    ```


    or


    ```bash

    # pacman -S kde-meta

    ```


    2. Alternatively, there exists a project called KDEmod (recently referred to collectively
    as the Chakra project). It is an Arch Linux exclusive, community-driven system,
    designed for modularity and offers a choice between KDE 3.5.10 or 4.x.x. KDEmod
    can be installed with pacman, after adding the proper repository to /etc/pacman.conf.
    The project website, including complete installation instructions, can be found
    at http://www.chakra-project.org/.


    # Useful KDE DAEMONS


    Recall from above that a daemon is a program that runs in the background, waiting
    for events to occur and offering services.


    KDE will require the hal (Hardware Abstraction Layer) daemon for optimal functionality.
    The hal daemon, among other things, will facilitate the automatic mounting of
    disks, optical drives, and USB drives/thumbrives for use in the GUI. The hal package
    is installed when you install xorg-server, but must be invoked to become useful.


    The kdm daemon is the K Display Manager, which provides a graphical login, if
    desired.


    Start hal:


    ```bash

    # /etc/rc.d/hal start

    ```


    Note: the hal daemon relies on, and will automatically start, the dbus daemon.


    Edit your DAEMONS array in /etc/rc.conf:


    ```bash

    # nano /etc/rc.conf

    ```


    Add hal to your DAEMONS array, to invoke it on boot. If you prefer a graphical
    login, add kdm as well:


    ```bash

    DAEMONS=(syslog-ng hal network crond alsa kdm)

    ```


    Note: If you installed KDEmod3 instead of normal KDE, use kdm3 instead of kdm.


    - This method will start the system at runlevel 3, (/etc/inittab default, multiuser
    mode), and then start KDM as a daemon.


    - Some users prefer an alternative method of starting a display manager like KDM
    on boot by utilizing the /etc/inittab method and starting the system at runlevel
    5.


    - If you prefer to log into the console at runlevel 3, and manually start X, leave
    out kdm, or comment it out with a bang, ( ).


    Now trying your X Server as normal user:


    ```bash

    $ startx

    ```


    or


    ```bash

    $ xinit

    ```


    > **Tip:** Advanced instructions for installing and configuring KDE can be found
    in the KDE article.


    Congratulations! Welcome to your new Arch Linux system!

