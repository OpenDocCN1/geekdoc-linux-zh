    ## Deleting the user account:


    In the event of error, or if you wish to delete this user account in favor of
    a different name or for any other reason, use /usr/sbin/userdel:


    ```

    # userdel -r [username]

    ```


    - -r Files in the user''s home directory will be removed along with the home directory
    itself and the user''s mail spool.


    If you want to change the name of your user or any existing user, see the Change
    username page of the wiki and/or the Groups and User Management articles for further
    information. You may also check the man pages for usermod(8) and passwd(8).


