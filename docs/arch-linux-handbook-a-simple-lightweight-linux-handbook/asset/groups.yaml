    # Part IV: Installing and configuring a Desktop Environment


    While The X Window System provides the basic framework for building a graphical
    user interface (GUI), a Desktop Environment (DE), works atop and in conjunction
    with X, to provide a completely functional and dynamic GUI. A DE typically provides
    a window manager, icons, applets, windows, toolbars, folders, wallpapers, a suite
    of applications and abilities like drag and drop. The particular functionalities
    and designs of each DE will uniquely affect your overall environment and experience.
    Therefore, choosing a DE is a very subjective and personal decision. Choose the
    best environment for your needs.


    +   - If you want something full-featured and similar to Windows and Mac OSX,
    KDE is a good choice

    - If you want something slightly more minimalist, which follows the K.I.S.S. principle
    more closely, GNOME is a good choice

    - Xfce is generally perceived as similar to GNOME, but lighter and less demanding
    on system resources, yet still visually pleasing and providing a very complete
    environment.

    - LXDE is a minimal DE based on the Openbox window manager. It provides most things
    you need for a modern desktop while keeping relatively low system resource usage.
    LXDE is a good choice for those who want a quick way of setting up a pre-configured
    Openbox system.


    If you desire a lighter, less demanding GUI to configure manually, you may choose
    to simply install a Window Manager, or WM. A WM controls the placement and appearance
    of application windows in conjunction with the X Window System but not NOT include
    such features as panels, applets, icons, applications, etc., by default.


    +   - Lightweight floating WM''s include: Openbox, Fluxbox, fwm2, pekwm, evilwm,
    Windowmaker, and TWM.'
