    # Arch Linux 手册


    # 不要恐慌！


    Arch Linux 系统是由*用户*通过 Shell 使用基础命令行工具组装而成的。这就是**Arch 之道 (The Arch Way)**。与其他发行版和安装程序更僵化的结构不同，它没有为你选择默认的环境或配置。从命令行，*你*将通过互联网连接使用
    `pacman` 工具从 Arch 仓库添加软件包，并通过编辑文本文件手动配置安装，直到系统定制到符合你的需求。你还将手动添加非根用户（用户）并管理组和权限。这种方法允许从底层实现最大的灵活性、选择权和系统资源控制。


