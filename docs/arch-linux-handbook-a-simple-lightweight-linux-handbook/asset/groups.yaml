    # Filesystem Types


    Again, a filesystem type is a very subjective matter which comes down to personal
    preference. Each has its own advantages, disadvantages, and unique idiosyncrasies.
    Here is a very brief overview of supported filesystems:


    +   1. **ext2 Second Extended Filesystem**: Old, reliable GNU/Linux filesystem.
    Very stable, but without journaling support. May be inconvenient for / and /home,
    due to very long fscks. An ext2 filesystem can be easily converted to ext3. Generally
    regarded as a good choice for /boot/.


    +   2. **ext3 Third Extended Filesystem**: Essentially the ext2 system, but with
    journaling support. ext3 is completely compatible with ext2. *Extremely* stable,
    mature, and by far the most widely used, supported and developed GNU/Linux FS.


    High Performance Filesystems:


    +   3. **ext4 Fourth Extended Filesystem**: Backward compatible with ext2 and
    ext3, Introdu support for volumes with sizes up to 1 exabyte and files with sizes
    up to 16 terabyte. Increases the 32,000'
