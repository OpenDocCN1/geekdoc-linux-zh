    The Advanced Linux Sound Architecture (known by the acronym ALSA) is a Linux kernel
    component intended to replace the original Open Sound System (OSS) for providing
    device drivers for sound cards. ALSA also bundles a user space library for application
    developers who want to use driver features with a higher level API ans direct
    interaction with the kernel drivers.


    **Note:** Alsa is included in the Arch mainline kernel and udev will automatically
    probe your hardware on boot-up, loading the corresponding kernel module for your
    audio card. Therefore, your sound should already be working, but upstream streams
    mute channels by default.


    **Note:** OSS4.1 has been released under a free license and is generally considered
    a significant improvement over older OSS versions. If you have issues with ALSA,
    or simply wish to explore another option, you may choose OSS4.1 instead. Instructions
    can be found in OSS


    The alsa-utils package contains the alsamixer userspace tool, which allows configuration
    of the sound device from the console or terminal.


    By default the upstream kernels ship with snd_pcsp, the alsa pc speaker module.
    snd_pcsp is usually loaded before your "actual" sound card. In most cases, it
    will be more convenient if this module is loaded last, as it will allow alsamixer
    to correctly control the desired sound card.


    To have snd_pcsp load last, add the following to /etc/modprobe.d/modprobe.conf.'
