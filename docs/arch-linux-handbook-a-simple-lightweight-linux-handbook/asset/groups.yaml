    # Step 2: Update, Sync and Upgrade the system with pacman


    Now we will update the system using pacman.


    # What is pacman ?


    Pacman is the package manager of Arch Linux. Pacman is written in C and is designed
    from the ground up to be lightweight with a very modest memory footprint, fast,
    simple, and versatile. It manages your entire package system and handles installation,
    removal, package downgrade (through cache), custom compiled package handling,
    automatic dependency resolution, remote and local searches and much more. Pacman''s
    output is streamlined, very readable and provides ETA for each package download.
    Arch uses the .tar.gz package format, which further enhances pacman''s speed;
    Gzipped tarballs, though slightly larger, are decompressed many times faster than
    their Bzipped counterparts, and are therefore installed much more expediently.


    We will use pacman to download software packages from remote repositories and
    install them onto your system.'
- md: '

    # Arch Linux Handbook


    Pacman is the most important tool in the Arch Linux toolbox for building the base
    system into whatsoever you please.


    # Package Repositories and /etc/pacman.conf


    Arch currently offers the following 4 repositories readily accessible through
    pacman:


    [core]


    The simple principle behind [core] is to provide only one of each necessary tool
    for a base Arch Linux system; The GNU toolchain, the Linux kernel, one editor,
    one command line browser, (There are a few exceptions to this. For instance, both
    vi and nano are provided, allowing the user to choose one or both.) It contains
    all the packages that MUST be in perfect working order to ensure the system remains
    in a usable state. These are the absolute system-critical packages.


    - Developer maintained

    - All binary packages

    - pacman accessible

    - The Core installation media simply contains an installer script, and a snapshot
    of the core repository at the time of release.


    [extra]


    The [extra] repository contains all Arch packages that are not themselves necessary
    for a base Arch system, but contribute to a more full-featured environment. X,
    KDE, and Apache, for instance, can be found here.


    - Developer maintained

    - All binary packages

    - pacman accessible


    [testing]


    The [testing] repository contains packages that are candidates for the [core]
    or [extra] repositories. New packages go into [testing] if:


    - they are expected to break something on update and need to be tested first.

    - they require other packages to be rebuilt. In this case, all packages that need
    to be rebuilt are put into [testing] first and when all rebuilds are done, they
    are moved back to the other repositories.


    - Developer maintained

    - All binary packages

    - pacman accessible


    **Note:** [testing] is the only repository that can have name collisions with
    any of the other official repositories. Therefore, if enabled, [testing] must
    be the first repo listed in `pacman.conf`.


    **Warning:** Only experienced users should use [testing].


    # [community]


    The [community] repository is maintained by the Trusted Users (TUs) and is simply
    the binary branch of the Arch User Repository (AUR). It contains binary packages
    which originated as PKGBUILDs from AUR [unsupported] that have acquired enough
    votes and were adopted by a TU. Like all repos listed above, [community] may be
    readily accessed by pacman.


    - TU maintained

    - All binary packages

    - pacman accessible


    # AUR (unsupported)


    The AUR also contains the unsupported branch, which cannot be accessed directly
    by pacman*. AUR [unsupported] does not contain binary packages. Rather, it provides
    more than sixteen thousand PKGBUILD scripts for building packages from source,
    that may be unavailable through the other repos. When an AUR unsupported package
    acquires enough popular votes, it may be moved to the AUR [community] binary repo,
    if a TU is willing to adopt and maintain it there.


    - TU maintained

    - All PKGBUILD bash build scripts

    - Not pacman accessible by default


    * pacman wrappers (AUR Helpers) can help you seamlessly access AUR.


    # /etc/pacman.conf


    pacman will attempt to read /etc/pacman.conf each time it is invoked. This configuration
    file is divided into sections, or repositories. Each section defines a package
    repository that pacman can use when searching for packages. The exception to this
    is the options section, which defines global options.


    ```

    # nano /etc/pacman.conf

    ```


    Example:


    # Part II: Configure&Update the New Arch Linux base system


    ```

    # /etc/pacman.conf

    #

    # See the pacman.conf(5) manpage for option and repository directives


    #

    # GENERAL OPTIONS

    #

    [options]

    # The following paths are commented out with their default values listed.

    # If you wish to use different paths, uncomment and update the paths.

    #RootDir = /

    #DBPath = /var/lib/pacman/

    #CacheDir = /var/cache/pacman/pkg/

    #LogFile = /var/log/pacman.log

    HHoldPkg = pacman glibc

    # If upgrades are available for these packages they will be asked for first

    SyncFirst = pacman

    #XferCommand = /usr/bin/wget --passive-ftp -c -0 %o %u

    #XferCommand = /usr/bin/curl %u > %0


    # Pacman won''t upgrade packages listed in IgnorePkg and members of IgnoreGroup

    #IgnorePkg =

    #IgnoreGroup = =

    ```


    ```

    #NoUpgrade =

    #NoExtract =


    # Misc options options (all disabled by default)

    #NoPassiveFtp

    #UseSyslog

    #ShowSize

    #UseDelta

    #TotalDownload

    #

    ```


    ```

    # REPOSITORIES

    # - can be defined here or included from another file

    # pacman will search repositories in the order

    defined here

    # - local/custom mirrors can be added here or in

    separate files

    # - repositories listed first take precedence

    when packages

    # have identical names, regardless of version number

    # - URLs will have $repo replaced by the name of the

    current repo

    # # Repository entries are of the format:

    # [repo-name]

    # Server = ServerName

    # # Include = IncludePath

    #

    # The header [repo-name] is crucial - it must be present

    and

    # uncommented to enable the repo.

    #

    # Testing is disabled by default. To enable, uncomment

    the following

    # two lines. You can add preferred servers immediately

    after the header,

    # and they will be used before the default mirrors.

    #[testing]

    #Include = /etc/pacman.d/mirrorlist


    [core]

    # Add your preferred servers here, they will be used

    first

    Include = /etc/pacman.d/mirrorlist


    [extra]

    # Add your preferred servers here, they will be used

    first

    Include = /etc/pacman.d/mirrorlist


    [community]

    # Add your preferred servers here, they will be used

    first

    Include = /etc/pacman.d/mirrorlist

    ```


    ```

    # An example of a custom package repository.  See the

    pacman manpage for

    # tips on creating your own repositories.

    # [custom]

    #Server = file:///home/custompkgs

    ```


    Enable all desired repositories (remove the # in front of the ''Include

    ='' ''[repository]'' lines).


    - When choosing repos, be sure to uncomment both the

    repository header lines in [brackets] as well as the

    ''Include =='' lines. Failure to do so will result in the

    selected repository being omitted! This is a very common

    error.


    # /etc/pacman.d/mirrorlist


    Faster mirrors will dramatically improve pacman performance, and

    your overall Arch Linux experience.

    Edit /etc/pacman.d/mirrorlist:


    - Manually:


    ```

    # nano /etc/pacman.d/mirrorlist

    ```


    Remove all mirrors which are not on your continent, or are

    extremely distant. In nano, [CTRL]+K will cut each unneeded line.

    Edit /etc/pacman.d/mirrorlist by placing the best mirror at the top of

    t list. (Recall that archlinux.org is throttled to 50KB/s). In nano,

    [ALT]+A selects an area, cursor marks the lines, [CTRL]+K

    cuts the selected area and [CTRL]+U uncuts, or pastes it.


    - Alternative, using the rankmirrors script:

    /usr/bin/rankmirrors is a python script which will attempt

    tetect the mirrors which are closest to you.


    # Part II: Configure&Update the New Arch Linux system


    First, use pacman to install python:


    ```

    # pacman -Sy python

    ```


    cd to the /etc/pacman.d/ directory:


    ```

    # cd /etc/pacman.d

    ```


    Backup your existing /etc/pacman.d/mirrorlist:


    ```

    # cp mirrorlist mirrorlist.backup

    ```


    Edit mirrorlist.backup and uncomment mirrors you want to test with rankmirrors.


    Run the script against the mirrorlist.backup with the -n switch and redirect output
    to a new /etc/pacman.d/mirrorlist file:


    ```

    # rankmirrors -n 6 mirrorlist.backup > mirrorlist

    ```


    -n 6: rank the 6 fastest mirrors


    # Force pacman to refresh the package lists


    After creating/editing your /etc/pacman.d/mirrorlist, (manually or by /usr/bin/rankmirrors)
    issue the following command:


    ```

    # pacman -Syy

    ```


    Passing two --refresh or -y flags forces pacman to refresh all package lists even
    if they are considered to be up to date. pacman -Syy whenever a mirror is changed,
    is good practice and will avoid possible headaches.


    # Arch Linux Handbook


    # Mirrorcheck for up-to-date packages


    Some of the official mirrors may contain packages that are out-of-date. [ArchLinux
    Mirrorcheck] reports various aspects about the mirrors such as, those experiencing
    network problems, data collection problems, reports the last time they have synced,
    etc.


    One may wish to manually inspect the mirrors in the /etc/pacman.d insuring that
    it contains up-to-date mirrors if having the latest and greatest package versions
    is important to you.


    # Ignoring packages


    When you execute the command "pacman -Syu", your entire system will be updated.
    It is possible that you want to prevent a package from being upgraded. An example
    could be the kernel (kernel26) or a package for which an upgrade may prove problematic
    for your system. In this case, you have two options: indicate the package(s) you
    want to skip in the pacman command line using the --ignore switch (do pacman -S
    --help for details) or permanently indicate the package(s) you want to skip in
    your /etc/pacman.conf file in the IgnorePkg array. List each package, with one
    intervening space :


    ```

    IgnorePkg = wine

    ```


    The typical way to use Arch is to use pacman to install all packages unless there
    is no package available, in which case you can build your own package using ABS.
    Many user-contributed package build scripts are also available in the AUR.


    You are expected to keep your system up to date with pacman -Syu, rather than
    selectively upgrading packages. You may diverge from this typical usage as you
    wish; but be warned that there is a greater chance that this will not work as
    intended and it could break your system. The majority of complaints happen when
    selective upgrading, unusual compilation or improper software installation is
    performed. Use of IgnorePkg in /etc/pacman.conf is therefore

