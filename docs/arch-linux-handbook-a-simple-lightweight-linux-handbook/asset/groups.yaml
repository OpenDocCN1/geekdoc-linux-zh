    ## Get familiar with pacman


    pacman is the Arch user''s best friend. It is highly recommended to study and
    learn how to use the pacman(8) tool. Try:


    ```

    $ man pacman

    ```


    For more information, please look up the pacman wiki entries at your leisure.


    ## Powerpill, a pacman wrapper script


    Before you continue, consider installing xyz-powerpill (now in [community]) which
    is a pacman wrapper script that speeds up package retrieval by using aria2c (an
    external download helper) for concurrent/segmented downloads. In other words,
    powerpill pulls packages in parallel effectively speeding up your downloads. This
    is particularly advantageous on new installs when pulling down hundreds of megs
    of packages.


    ```

    # pacman -S powerpill

    ```


    Treat powerpill as pacman as you consider installations, for example, the following
    will update your system:


    ```

    # powerpill -Syu

    ```


    See the Powerpill wiki article for more.


    ## Step 3: Update System


    You are now ready to upgrade your entire system. Before you do, read through the
    news (and optionally the announce mailing list). Often the developers will provide
    important information about fixes for known issues. Consulting these pages before
    any upgrade is good practice.


    Sync, refresh, and upgrade your entire new system with:


    ```

    # pacman -Syu

    ```


    you may also use:


    ```

    # pacman --sync --refresh --sysupgrade

    ```


    pacman will now download a fresh copy of the master package list from the server(s)
    defined in pacman.conf(5) and perform all available upgrades. (You may be prompted
    to upgrade pacman itself at this point. If so, say yes, and then reissue the pacman
    -Syu command when finished.)


    Reboot if a kernel upgrade has occurred.


    **Note:** Occasionally, configuration changes may take place requiring user action
    during an update; read pacman''s output for any pertinent information.


    Pacman output is saved in /var/log/pacman.log.


    See Package Management FAQs for answers to frequently asked questions regarding
    updating and managing your packages.


    ## Part II: Configure&Update the New Arch Linux base system


    ## The Arch rolling release model


    Keep in mind that Arch is a rolling release distribution. This means there is
    never a reason to reinstall or perform elaborate system rebuilds to the newest
    version. Simply issuing pacman -Syu periodically keeps your entire system up-to-date
    and on the bleeding edge. At the end of this upgrade, your system is completely
    current. Reboot if a kernel upgrade has occurred.


    ## Network Time Protocol


    You may wish to set the system time now using OpenNTPD to sync the local clock
    to remote NTP servers. OpenNTPD may also be added to the DAEMONS= array in /etc/rc.conf
    to provide this service at each boot. (See the Network Time Protocol article.)


    ## Step 4: Add a user and setup groups


    UNIX is a multi-user environment. You should not do your everyday work using the
    root account. It is more than poor practice; it is dangerous. Root is for administrative
    tasks. Instead, add a normal, non-root user account using the /usr/sbin/useradd
    program:


    ```

    # useradd -m -G [groups] -s [login_shell] [username]

    ```


    - -m Creates user home directory as /home/username. Within their home directory,
    a user can write files, delete them, install programs, etc. Users'' home directories
    shall contain their data and personal configuration files, the socalled ''dot
    files'' (their name is preceded by a dot). (To view dotfiles, enable the appropriate
    option in your file manager or run ls -a switch.) If there is a conflict between
    user (under /home/username) and global configuration files (usually under /etc/)
    the settings in the user file will prevail. Dotfiles likely to be altered by the
    end user include .xinitrc and .bashrc files. The configuration files for xinit
    and Bash respectively.


    - They allow the user the ability to the window manager to be started upon login
    and also aliases, user-specified commands and environment variables respectively.
    When a user is created, their dotfiles shall be taken from the /etc/skel directory
    where system sample files reside.


    - -G A list of supplementary groups which the user is also a member of. Each group
    is separated from the next by a comma, with no intervening spaces. The default
    is for the user to belong only to the initial group (users).

    - -s The path and filename of the user’s default login shell.


    Useful groups for your non-root user include:


    - audio - for tasks involving sound card and related software

    - floppy - for access to a floppy if applicable

    - lp - for managing printing tasks

    - optical - for managing tasks pertaining to the optical drive(s)

    - storage - for managing storage devices

    - video - for video tasks and 3d acceleration

    - wheel - for using sudo

    - power - used w/ power options (ie. shutdown w/ off button)


    A typical desktop system example, adding a user named "archie" specifying bash
    as the login shell:


    ```

    # useradd -m -G users, audio, lp, optical, storage, video, wheel, power -s

    /bin/bash archie

    ```


    Next, add a password for your new user using /usr/bin/passwd.


    An example for our user, ''archie'':


    ```

    # passwd archie

    ```


    (You will be prompted to provide the new UNIX password.)


