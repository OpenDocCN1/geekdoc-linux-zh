    \n## 第三部分：安装 X 并配置 ALSA\n\n## C：安装输入驱动包\n\n最新版本的 X 要求您为输入设备（包括键盘和鼠标）安装驱动程序。可用输入驱动程序的完整列表：\n\
    \n```bash\n# pacman -Ss xf86-input | less\n```\n\n对于大多数用户来说，xf86-input-keyboard\
    \ 和 xf86-input-mouse 足够用于基础设置。使用 pacman 安装您输入设备所需的驱动程序。例如：\n\n```bash\n#  pacman\
