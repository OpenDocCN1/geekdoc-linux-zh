    Arch Linux Handbook


    ## The initramfs


    The initial ram files, or initramfs, is a temporary file system used by the kernel
    during boot. It is used for making preparations, like hardware detection and module
    loading, before the real root file system can be mounted. Therefore, an initramfs
    allows for the use of a generic modular kernel for a wide variety of hardware,
    and without the need to compile a custom kernel for each user.


    You will be prompted by a series of questions related to the configuration of
    your initramfs. You will be asked if you need support for booting from USB devices,
    FireWire devices, PCMCIA devices, NFS shares, software RAID arrays, LVM2 volumes,
    encrypted volumes, and DSDT support. Choose yes if you need it; in our example
    nothing is needed. Choosing ''yes'' for any of the above will cause the installer
    script to parse the appropriate hook(s) within the `/etc/mkinitcpio.conf` file.


    Now you will be asked which editor you want to use; choose nano or, or if you
    are familiar with it, vim. You will be presented with a menu including the main
    configuration files for your system.


    > **Note:** It is very important at this point to edit, or at least verify by
    opening, every configuration file. The installer script relies on your input to
    create these files on your installation. A common error is to skip over these
    critical steps of configuration.


    ## Can the installer handle this more automatically?


    Hiding the process of system configuration is in direct opposition to the Arch
    Way. While it is true that recent versions of the kernel and hardware probing
    tools offer excellent hardware support and auto-configuration, Arch presents the
    user all the pertinent configuration files during installation for the purposes
    of *transparency and system resource control*. By the time you have finished modifying
    these files to your specifications, you will have learned the simple method of
    manual Arch Linux system configuration and become more familiar with the base
    structure,


    # Part I: Install the Base System


    leaving you better prepared to use and maintain your new installation productively.


    ## /etc/rc.conf


    Arch Linux uses the file /etc/rc.conf as the principal location for system configuration.
    This one file contains a wide range of configuration information, principally
    used at system startup. As its name directly implies, it also contains settings
    for and invokes the /etc/rc* files, and is, of course, sourced by these files.


    ## LOCALIZATION section


    - LOCALE=: This sets your system locale, which will be used by all i18n-aware
    applications and utilities. You can get a list of the available locales by running
    ''locale -a'' from the command line. This setting''s default is fine for US users.

    - HARDWARECLOCK=: Specifies whether the hardware clock, which is synchronized
    on boot and on shutdown, stores UTC time, or the localtime. UTC makes sense because
    it greatly simplifies changing timezones and daylight saving time. localtime is
    necessary if you dual boot with an operating system such as Windows, that only
    stores localtime to the hardware clock.

    - USEDIRECTISA=: Use direct I/O request instead of /dev/rtc for hwclock

    - TIMEZONE=: Specify your TIMEZONE. (All available zones are under /usr/share/zoneinfo/).

    - KEYMAP=: The available keymaps are in /usr/share/kbd/keymaps. Please note that
    this setting is only valid for your TTYs, not any graphical window managers or
    X.

    - CONSOLEFONT=: Available console fonts reside under /usr/share/kbd/consolefonts/
    if you must change. The default (blank) is safe.

    - CONSOLEMAP=: Defines the console map to load with the setfont program at boot.
    Possible maps are found in


    ```

    LOCALE="en_US.utf8"

    HARDWARECLOCK="localtime"

    USEDIRECTISA="no"

    TIMEZONE="US/Eastern"

    KEYMAP="us"

    CONSOLEFONT=

    CONSOLEMAP=

    USECOLOR="yes"

    ```


    ## HARDWARE Section


    - MOD_AUTOLOAD=: Setting this to "yes" will use udev to automatically probe hardware
    and load the appropriate modules during boot-up, (convenient with the default
    modular kernel). Setting this to "no" will rely on the user''s ability to specify
    this information manually, or compile their own custom kernel and modules, etc.

    - MOD_BLACKLIST=: This has become deprecated in favor of adding blacklisted modules
    directly to the MODULES= line below.

    - MODULES=: Specify additional MODULES if you know that an important module is
    missing. If your system has any floppy drives, add "floppy". If you will be using
    loopback filesystems, add "loop". Also specify any blacklisted modules by prefixing
    them with a bang (!). Udev will be forced NOT to load blacklisted modules. In
    the example, the IPv6 module as well as the annoying pcspeaker are blacklisted.


    ```

    # Scan hardware and load required modules at boot

    MOD_AUTOLOAD="yes"

    # Module Blacklist - Deprecated

    MOD_BLACKLIST=()

    #

    MODULES=(net-pf-10 !snd_pcsp !pcspkr loop)

    ```


    ## NETWORKING Section


    - HOSTNAME=: Set your HOSTNAME to your liking.

    - eth0=: Adjust the interface IP address, netmask and broadcast address if you
    are using static IP. Set eth0="dhcp" if you want to use DHCP

    - INTERFACES=: Specify all interfaces here.

    - gateway=: If you are using static IP, set the gateway address. If using DHCP,
    you can usually ignore this variable, though some users have reported the need
    to define it.


    ```

    HOSTNAME="arch"

    eth0="dhcp"

    INTERFACES="eth0"

    gateway=""

    ```


