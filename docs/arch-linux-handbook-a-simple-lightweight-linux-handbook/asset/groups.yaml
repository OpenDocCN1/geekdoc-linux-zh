- md: "\n## Part III: Install X and configure ALSA\n\n# Load \"dri\"\n\nDouble check\
    \ your /etc/X11/xorg.conf to make sure your default depth, horizontal sync, vertical\
    \ refresh, and resolutions are acceptable.\n\nUpdate kernel module dependencies\
    \ using /sbin/depmod:\n\n```bash\n# depmod -a\n```\n\n(A reboot may be necessary.)\n\
    \n> **Tip:** Advanced instructions for NVIDIA configuration can be found in the\
    \ NVIDIA article.\n\nYou may now continue with **Step 3: Configure X** to familiarize\
    \ yourself further, or continue the installation process with **Test X**.\n\n\
    ## ATI Graphics Cards\n\nATI owners have multiple options for drivers.\n\n- The\
    \ open source **radeon** driver provided by the **xf86-video-ati** package.\n\
    \    - This is the original, reverse-engineered open source driver which fully\
    \ supports Radeon chipsets up to X1950 (latest R500 chipsets). Cards up to the\
    \ 9200 series are fully supported, stable, and provide full 2D and 3D acceleration.\
    \ Cards from 9500 to X1950 feature full 2D and 3D acceleration, but lack certain\
    \ features provided by the proprietary driver (for example, powersaving is still\
