- md: '

    ## TV-Cards


    There are several things to do if you want to watch TV under (Arch) Linux. The
    most important task is to find out which chip your tuner is using. However, quite
    a lot are supported. Be sure to check at a Hardware Database to be sure (see this
    list, for example). Once you know your Model, there are just a few steps ahead
    to get you going.


    In most cases, you will need to use the bttv-drivers (other drivers exist, like
    V4L) together with the I2C-modules. Configuring those is the hardest task. If
    you are lucky, a


    ```

    modprobe bttv

    ```


    will autodetect the card (check dmesg for results). In that case, you will only
    need to install an application to watch TV. We will look at that later, though.
    If the autodetection did not work, you will need to check the file CARDLIST, which
    is included in the tarball of bttv to find out the right parameters for your card.
    A PV951 without radio support would need this:


    ```

    modprobe bttv card=42 radio=0

    ```


    Some cards need the following line to produce sound:


    ```

    modprobe tvaudio

    ```


    However, that varies. So just try it out. Some cards demand the following line:


    ```

    modprobe tuner

    ```


    This is subject to trial-and-error, too.


    To actually watch TV, install the tvtime-package with


    ```

    pacman -S tvtime

    ```


    and read its manpage.


    ## Digital Cameras


    Most newer digital cameras are supported as USB mass storage devices, which means
    that you can simply plug it in and copy the images as you would with external
    hard drives, or USB sticks.


    Older ones may use the PTP (Picture Transfer Protocol) which requires a "special
    driver". gPhoto2 provides this driver and allows a shell-based transfer of the
    images. Several Graphical Interfaces are available for use with gPhoto2:


    - digikam (KDE)

    - gthumb (GNOME)

    - gtkam (GNOME)


    Installation:


    ```

    pacman -S gphoto2

    ```


    ## USB Memory Sticks / Hard Disks


    USB Memory Sticks and hard disks are supported out of the box with the USB mass
    storage device driver and will appear as a new SCSI device (/dev/sdX). If you
    are using KDE or GNOME you should use dbus and hal (add them to your daemons in
    /etc/rc.conf), and they will be automatically mounted. If you use a different
    Desktop Environment you may have a look at ivman.


    ## An Introduction to ABS


    ABS is the Arch Linux Build System. It is a ports-like system for compiling sources
    into installable packages.


    ''Ports'' is a system used by *BSD, which uses simple build scripts residing in
    a directory tree on the local machine. Each port is simply a directory, named
    for the installable 3rd party software, and containing a build script. Typically,
    a *BSD user who wanted to build and install firefox, would cd into the corresponding
    firefox port residing under /usr/ports and do make clean. The firefox sourcecode
    would then be downloaded from a 3rd party source. According to the port build
    script, the sources would then be compiled, patched (if directed), and finally,
    installed to the system.


    ABS offers the same functionality by providing build scripts called PKGBUILDs,
    which contain all information for a given piece of software; source URL, version,
    license and compilation instructions. In addition, ABS provides the advantage
    of compiling the sources into an installable package with the extension .pkg.tar.gz.
    Obviously, it is a simple g-zipped tarball, but it is cleanly installable/removable/trackable
    via pacman.


    Install the abs package:


    ```

    # pacman -Sy abs

    ```


    After installing the abs package with pacman, run the /usr/bin/abs script as root:


    ```bash

    # abs

    ```


    The ABS tree is then extracted under /var/abs, organized according to the installable
    software.


    To build a package from source, create a build directory and copy the abs directory
    for a given application to the build directory:


    ```

    $ mkdir ~/abs

    $ cp -r /var/abs/extra/slim ~/abs

    ```


    This will move the slim subdir and PKGBILD script for slim to the build directory.


    **Note:** In addition to PKGBUILDs, some software requires an additional *.install
    file. See the **ABS** and **makepkg** wiki entries for more information


    navigate to the slim build directory and, after modifying the PKGBUILD if desired
    or necessary, invoke the abs `/usr/bin/makepkg` tool


    ```

    $ makepkg -cs

    ```


    - **c** Cleans any leftover files from the source compilation

    - **s** Downloads and installs any missing dependencies by invoking pacman


    Install with pacman''s -U (upgrade) switch:


    ```

    # pacman -U slim-<version>.pkg.tar.gz

    ```


    Done. Slim sources are downloaded, compiled, compressed into a package and finally,
    installed.


    **Note:** You may build, clean, install any needed dependencies and finally install
    the package with one command: **makepkg -csi**. The above example used pacman
    -U to install as a separate step for informational purposes. See the **makepkg(8)**
    man page.


    Q: Why would I need ABS to compile and create an installable package from source,
    when I have access to all of the same software via pacman and the binary repos?


    ## An Introduction to ABS


    A: A few reasons:


    - For installing newer, unstable, custom, or development versions of an application.


    PKGBUILDs are transparent and simple. Edit the software version and the md5sums
    of the desired versions within the PKGBUILD, and build and install your custom
    packages.


    - For patching.


    Copy the corresponding PKGBUILD to a build directory along with your patch, edit
    the PKGBUILD, and build/install with /usr/bin/makepkg.


    - For creating your own packages for yourself, or to share with the community
    on the AUR.


    You are not limited to the PKGBUILDs under /var/abs. Create your own to build
    from 3rd party sourcecode. They are simple, open and transparent. Explore the
    prototype PKGBUILD provided at /usr/share/pacman/PKGBUILD.proto


    - ABS provides an expedient method for recompiling, if necessary.


    For example, to recompile your video or wireless drivers.


    - To build an installable package with custom configurations


    Enable or disable options in any package by modifying the PKGBUILD


    - To build an installable package, further optimized for your machine''s architecture,


    Specify your CFLAGS in /etc/makepkg.conf.


    - To rebuild your entire system, BSD-style, further optimized for your machine''s
    architecture.


    Use the makeworld script, or the community-contributed pacbuilder


    ## An Introduction to The AUR


    The Arch User Repository The ABS tree provides the ability to build all Arch software
    available in the [core], [extra], [community], and [testing] repositories by providing
    build scripts on the local machine. In contrast, the AUR does not provide a tree
    on the local machine, but rather an unsupported repository of build scripts, sporting
    a handsome web interface at http://aur.archlinux.org/index.php. Also, there is
    an AUR link tab at the top right of every page on the Arch site.


    Once you have navigated to the AUR web page, click on the Packages button on the
    top right. You will be brought to the packages search page.


    The general procedure will be:


    1. Enter the search criteria into the keywords field and click on go. The next
    screen will present all related results. If the package location is on the package
    listing. If the package location is in community, you have not done your homework,
    and should simply use pacman or ABS to install. If the location is unsupported,
    continue.

    2. Click on the name of the package on the package listing. You will be brought
    to the Package Details page.


    An example for the yaourt package:


    ```

    yaourt 0.9-2

    http://www.archlinux.fr/yaourt-en/

    - Pacman frontend with more features and AUR support

    unsupported :: system

    Maintainer :: wain

    Votes: 943

    License: GPL

    Last Updated: Sat, 15 Mar 2008 17:15:20 +0000

    First Submitted: Tue, 04 Jul 2006 20:37:58 +0000

    Tarball :: :: Files :: PKGBUILD

    ```


    Click on the **Tarball** link in the last line of the details, and save to a build
    directory.


    Navigate to, and extract the tarball:


    ```

    $ tar -xvf yaourt.tar.gz

    ```


    Enter the build directory and invoke makepkg, which will download the sources,
    compile, and compress the installation into an installable .pkg.tar.gz package:


    ```

    $ makepkg -cs

    ```


    - -c Cleans up any leftover files from the source compilation

    - -s Downloads and installs any missing dependencies by invoking pacman


    Install with pacman''s -U (upgrade) switch:


    ```

    # pacman -U yaourt<version>.pkg.tar.gz

    ```


    Done.


    See the AUR wiki entry for for more information.

    '
  mdcn: '


    ## 电视卡 (TV-Cards)


    如果你想在 (Arch) Linux 下看电视，有几件事要做。最重要的任务是确定你的调谐器使用的是什么芯片。不过，有很多都是受支持的。务必检查硬件数据库以确保（例如查看[此列表]）。一旦你知道了你的型号，只需几步即可开始使用。


    在大多数情况下，你将需要使用 `bttv-drivers`（其他驱动程序，如 V4L）配合 `I2C-modules` 使用。配置这些内容是最困难的任务。如果你足够幸运，运行：


    ```

    modprobe bttv

    ```


    会自动检测显卡（检查 `dmesg` 结果）。在这种情况下，你只需要安装一个应用程序来看电视。不过，我们稍后会讨论这一点。如果自动检测不起，你需要检查 `CARDLIST`
    文件（该文件包含 `bttv` 的压缩包中），以找到适用于你显卡的正确参数。不支持广播功能的 PV951 需要以下命令：


    ```

    modprobe bttv card=42 radio=0

    ```


    某些显卡需要以下行来产生声音：


    ```

    modprobe tvaudio

    ```


    然而，这因设备而异。只需尝试即可。某些显卡要求以下行：


    ```

    modprobe tuner

    ```


    这同样需要反复尝试。


    要实际看电视，使用以下命令安装 `tvtime` 包：


    ```

    pacman -S tvtime

    ```


    并阅读其帮助页（manpage）。


    ## 数字相机


    大多数较新的数字照机被作为 USB 大容量存储设备支持，这意味着你只需插入它并像处理外部硬盘或 USB 盘那样复制图像即可。


    旧的设备可能使用 PTP（图像传输协议），这需要一个“特殊驱动程序”。gPhoto2 提供此驱动程序并允许基于 shell 的图像传输。有多个图形界面可供
    gPhoto2 使用：


    - digikam (KDE)

    - gthumb (GNOME)

    - gtkam (GNOME)


    安装：


    ```

    pacman -S gphoto2

    ```


    ## USB 闪盘 / 硬盘


    USB 闪盘和硬盘通过 USB 大容量存储设备驱动开箱即用，并将显示为新的 SCSI 设备 (`/dev/sdX`)。如果你使用 KDE 或 GNOME，应该使用
    `dbus` 和 `hal`（将它们添加到 `/etc/rc.conf` 的守护进程中），它们将自动挂载。如果你使用不同的桌面环境，可以查看 `ivman`。


    ## ABS 简介


    ABS 是 Arch Linux 构建系统。它是一个类似于 ports 的系统，用于将源码编译成可安装包。


    ''Ports'' 是 *BSD* 使用的一个系统，它使用存储在本地机器目录树中的简单构建脚本。每个端口（port）仅仅是一个目录，以可安装的第三方软件命命名，并包含一个构建脚本。通常，一个*想要编译并安装
    firefox 的 BSD 用户，会 `cd` 进入位于 `/usr/ports` 下对应的 firefox 端口，并执行 `make clean`。然后将从第三方源下载
    firefox 源码。根据端口构建脚本，源码将进行编译、打补丁（如果指示要求），并最后安装到系统中。


    ABS 通过提供名为 `PKGBUILDs` 的构建脚本提供了相同的功能，这些脚本包含了特定软件的所有信息：源码 URL、版本、许可证和编译说明。此外，ABS
    提供了将源码编译为扩展名为 `.pkg.tar.gz` 的可安装包的优势。显然，它是一个简单的 g-zipped tarball，但可以通过 `pacman`
    进行整洁的安装/删除/跟踪。


    安装 abs 包：


    ```bash

    # pacman -Sy abs

    ```


    使用 `pacman` 安装 abs 包后，以 root 身份运行 `/usr/bin/abs` 脚本：


    ```bash

    # abs

    ```


    ABS 树随后被提取到 `/var/abs` 下，根据可安装的软件进行组织。


    要从源码构建包，创建一个构建目录并将特定应用的 abs 目录复制到构建目录：


    ```bash

    $ mkdir ~/abs

    $ cp -r /var/abs/extra/slim ~/abs

    ```


    会将 `slim` 子目录和用于 `slim` 的 `PKGBILD` 脚本移动到构建目录。


    **注意：** 除了 `PKGBUILDs` 之外，某些软件还需要额外的 *.install` 文件。更多信息请参阅 **ABS** 和 **makepkg**
    wiki 条目。


    导航到 slim 构建目录，在根据需要或必要修改 `PKGBUILD` 后，调用 abs `/usr/bin/makepkg` 工具：


    ```bash

    $ makepkg -cs

    ```


    - **c** 清理源码编译留下的任何残留文件

    - **s** 通过调用 `pacman` 下载并安装任何缺失的依赖


    使用 `pacman` 的 `-U` (upgrade) 选项安装：


    ```bash

    # pacman -U slim-<version>.pkg.tar.gz

    ```


    完成。Slim 源码被下载、编译、压缩成包并最终安装。


    **注意：** 你可以编译、清理、安装任何需要的依赖，并最终安装包。


    '
