- img_proc: true
  md: 'The Ethernet system must map the IP address of the destination (or gateway)
    to a hardware address using the Address Resolution Protocol (ARP) or by looking
    in the machine''s ARP cache,4 if there is an entry for that address. In this case,
    cherry has the following ARP cache:


    ```

    [root@cherry /root]# arp -a

    ? (192.168.1.1) is at 00:A0:C2:1C:64:E8 [ether] on eth0

    ? (192.168.1.11) is at 00:C0:F8:26:B1:EC [ether] on eth0

    [root@cherry /root]#

    ```


    After the address has been mapped, the IP datagram (which carries a TCP segment,
    in turn carries a portion of an SMTP message) is wrapped in an Ethernet packet
    and sent to its destination (Figure 1.8).


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_24_0.png)


    On mango, the Ethernet packet is received and inspected. If the host determines
    that it is for local delivery, it determines where to deliver its contents.5 In
    this case, the packet contains an IP datagram that is passed to the IP stack.6


    The IP stack inspects the datagram and finds that it carries a TCP segment, which
    is passed to the TCP stack. The IP stack may need to take some special action
    before passing the segment up to the TCP stack, reassembling a segment from series
    of datagrams for example.


    TCP inspects the datagram that it has received and passes the SMTP message to
    the local MTA, at the application layer, for delivery to an end user.


    # RFCs


    TCP/IP is controlled by the Internet Engineering Task Force (IETF), a volunteer
    body with an open policy. RFCs are used to develop and maintain the main TCP/IP-related
    standards. These documents are freely distributed by the IETF.


    RFCs 1122 and 1123 are the host requirements RFCs. (RFC 1009 is the router requirements
    RFC.) These three documents form a basis for much of the discussion in the rest
    of the book. The accompanying sidebar excerpt from RFC 2400 helps to explain some
    of the terminology used and about RFCs.'
  merge: -1
