    ```

    -- mango ping statistics --

    6 packets transmitted, 6 packets received, 0% packet loss

    round-trip min/avg/max = 0.3/0.3/0.5 ms

    [nate@cherry pay]$

    ```


    This output can be broken into three sections. The first section, the single line
    starting with PING, shows an overview of the command. The second section, the
    lines beginning with 64 bytes, shows a running tally of the responses received.
    The third section, everything after the line — mango ping statistics —, shows
    a summary of the results. In this case, the results are: none of the packets were
    dropped, and they were all passed fairly quickly.


    This example also shows another important point: You should not rely on a single
    echo request to diagnose your network. A series of 5 or 10 is much better. You
    can attribute as much as 40% packet loss to congestion on a network; even a single
    packet dropped can be attributed to a busy host on the other end.


    Several useful options exist for the ping command. These are summarized in Table
    9.1.


    Table 9.1 ping Options


    | Switch | Description |

    | --- | --- |

    | -c count | Stops and receiving packets after count packets |

    | -d | Sets the SO_DEBUG on the socket used (flooded) |

    | -f | Sends the packets as fast as possible |

    | -i wait | Sets an interval of wait seconds between packets |

    | -I device | Sets the output interface |

    | -l preload | Sends preload as fast as possible, and then, drops back to normal
    mode |

    | -n | Doesn''t look up hostnames; just gives IP addresses (numeric) |

    | -p pattern | Specifies up to 16 bytes of "pad data" to be sent with the packet
    |

    | -q | Outputs only summary lines (quiet) |


    continues'
