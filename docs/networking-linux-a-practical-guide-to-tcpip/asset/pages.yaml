  md: '# Routing 43


    When usps receives the Ethernet frame, it checks the IP datagram and finds that
    it is addressed to 192.168.0.12. The 192.168.0.0 network is directly attached,
    so usps bundles the IP datagram into an Ethernet frame addressed to patton and
    sends it out through the proper network interface.


    Then patton receives the Ethernet frame and finds that the enclosed IP datagram
    is addressed to itself. After handling the IP datagram, if there is a response
    to be sent, patton follows the same series of steps to send the response.


    Tracing the return path of the IP datagram is left as an exercise.


    # Routing by Degrees


    All routing on a host is done according to host''s own routing table. Three basic
    kinds of entries exist in this table, corresponding to three kinds of routing:
    locally attached networks (direct routing), statically assigned routes (static
    routing), and dynamically assigned routes (dynamic routing). Each of these is
    discussed separately in the next sections.


    # Direct Routing


    When two hosts are on the same network and subnet, no router is needed to pass
    traffic between the two hosts. IP datagrams are sent between them directly addressed
    link-layer frames.


    This is the simplest form of routing available. Entries are automatically added
    to hosts routing table when a new network is attached with the /sbin/ifconfig
    command.


    # Static Routing


    In simple networks, or simple portions of meshed networks, routing entries can
    be entered into a host''s routing table by hand with the /sbin/route command.
    This is typically done only when the route is not likely to change because any
    changes may also be entered by hand. The default gateway entry in a routing table
    is almost always a static routing.


    # Dynamic Routing


    Where the routes between networks are likely to change, dynamic routing makes
    the most sense. This relies on an underlying routing protocol such as RIP-2, OSPF,
    or BGP to pass information about routes to networks between routers. RIP-2 is
    discussed in detail in Chapter 5, "Application-Layer Protocols."


    Dynamic routing is the key to a meshed internet''s capability to survive losing
    connections between networks. A simple example is shown in Figure 3.4.'
