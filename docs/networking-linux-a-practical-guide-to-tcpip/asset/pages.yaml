    When a packet is dropped, it is dropped silently. If you want to send an ICMP
    Port Unreachable message, you can specify that the packet be rejected with this:


    +   - J REJECT


    If you want to use multiple chains in conjunction with each other, you don''t
    want to end a chain by dropping all remaining packets. Instead, you can pass control
    of the packet back to the parent chain with this:


    +   - RETURN


    If this rule is hit and the chain is built-in, the default policy is executed.
    If the rule is hit in a user-defined chain, the packet begins to traverse the
    parent chain again at the point it jumped out to the current chain.


    # Xinetd


    Xinetd is designed to be a secure replacement for the inetd program. It provides
    a more secure method for providing access to Internet services through a master
    daemon along with a number of other useful facilities. Xinetd was originally written
    by Panagiot Tsrigotis (panos@synak.colorado.edu). Currently, it is maintained
    by Rob Braun (braun@synak.net). It is supported by a web page at www.xinetd.org
    and a mailing list hosted at synak.net.


    Xinetd, like inetd, runs as a ‘super-server,’ or switchboard. It listens on a
    number of ports and daemons as appropriate for incoming requests. Xinetd goes
    beyond the functionality of inetd in many ways. It takes advantage of its role
    as a switchboard operator to manage a variety of things before it ever hands control
    to the application daemon. This functionality is used to create a more secure
    environment; other bits make life better (or easier) for you, the administrator.


    One of the most common tasks Xinetd performs is access control. Connections to
    a host can be allowed or disallowed based on the domain, name, or address of the
    remote host, or the time of access. If desired, Xinetd can be compiled with libwrap
    support to use the hosts.allow and hosts.deny files. Xinetd even allows you to
    bind specific services to specific IP addresses.


    Xinetd is also used to prevent denial of services (DoS) attacks. Because it is
    looking at all the connections into a host instead of just one connection, Xinetd
    can limit the number of connections to given services. You can also set connection
    limits based on distinct client hosts.'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# Xinetd 197


    One of the strengths of Xinetd is its extensive logging capability. You can configure
    logging for each service individually. If you want to avoid syslog, you can write
    logs to log files directly. You can log information about failed connection attempts.
    You can even use Xinetd to log the connect and disconnect times of each connection.
    Xinetd allows you to reduce TCP connections to a different host. These connections
    continue to run through the original host, so you could use this functionality
    to provide services from a privately addressed machine to the Internet.


    # Getting and Installing xinetd


    Xinetd is now part of a Red Hat 7 system, but getting and building it is pretty
    straightforward. The sources are available from www.xinetd.org. There are currently
    two flavors: the stable release and the development release. Make sure that you
    grab the stable release.


    Building Xinetd follows the normal configure, make, install procedure. On a Red
    Hat 6.2 system it is built and without any errors. If you run into problems, please
    try the mailing list (see the section "If I Have Problems" for information about
    subscribing).


    The extra functionality provided by Xinetd means that it needs more information
    in its configuration file than xinetd. The two formats are not interchangeable.
    A tool is provided to convert your existing /etc/xinetd.conf, though, so things
    are relatively painless. To perform the conversion, do the following:


    ```

    root@$ /xconv.pl < xinetd.conf > /etc/xinetd.conf

    ```


    The result is probably not exactly what you want, but it should work. The next
    section deals with making Xinetd do what you want it to.


    # Xinetd at Work


    We''ll take a small short xinetd.conf file and run it through xconv.pl to come
    up with a basic xinetd.conf. From there, we will make incremental changes to our
    xinetd.conf to get it into shape for our own network.


    # A Basic Configuration


    We''ll start with a very short xinetd.conf file, as shown in Example 11.5.


    Example 11.5 A Basic xinetd.conf


    ```

    echo stream tcp nowait root internal

    echo echo udp wait root internal

    ftp stream nowait root /usr/sbin/in.ftpd in.ftpd -l -a

    telnet stream nowait root /usr/sbin/in.telnetd in.telnetd

    imap stream tcp nowait root /usr/sbin/imapd imapd

    finger stream tcp nowait nobody /usr/local/sbin/my_safe.fingerd in.fingerd

    ```'
