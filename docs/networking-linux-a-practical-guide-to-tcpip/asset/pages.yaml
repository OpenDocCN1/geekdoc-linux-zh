- img_proc: true
  md: 'At this point, the real work begins:You need to get any users who will be using
    the OPIE server to run opiepassword to generate an initial pass-phrase. It is
    important that this is only done on a secure terminal.


    # Configuring OPIE


    The server side of OPIE is taken care of when you do the make install step of
    the installation. Each user must be separately added to the OPIE database.This
    is done with the opiepasswd command, as shown in Example 11.13.


    Example 11.13 Using opiepassword


    ```

    [pate@cherry sgml]$ opiepassword -n 497 -c

    Updating pate:

    Reminder - Only use this method from the console;

    NEVER from remote. If you

    are using telnet, xterm, or a dial-in, type "C now or

    exit with no password.

    Then run opiepassword without the -c parameter.

    Using MD5 to compute responses.

    Enter old secret pass phrase:

    Enter new secret pass phrase:

    Again new secret pass phrase:


    ID date pate OPIE key is 497 cr1997

    PHI CLAY MOOD VOID ELI BIRD

    [pate@cherry sgml]$

    ```


    # OPIE at Work


    After''ve got OPIE installed and configured, the fun begins. When you telnet to
    the opiefied box, you''ll go through the process shown in Example 11.14.


    Example 11.14 Connecting to a Remote Host with OPIE


    ```

    [pate@cherry sgml]$ telnet 192.168.1.20

    Trying 192.168.1.20...

    Connected to 192.168.1.20.

    Escape character is ''^''.

    Red Hat Linux release 6.2 (Zoot)

    Kernel 2.2.14-5.0 on an i586

    patelogin:

    login: pate

    otp-md5 497 cr1997 ext

    ```


    continues'
