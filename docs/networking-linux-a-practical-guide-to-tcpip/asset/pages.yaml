  md: '# Ethernet


    All values in the protocol field request are required to be odd numbers and may
    indicate Link Control Protocol (LCP) data, Network Control Protocol (NCP) data,
    or encapsulated data-grams from a higher-level protocol. LCP provides a channel
    for link setup, configuration, and testing. This is the mechanism used to negotiate
    IP addresses and other options.


    NCPs are specific to network-layer protocols. These protocols allow for additional
    options to be negotiated.


    # PPP Decoded


    Figure 2.2 shows a typical PPP frame. The start flag is not shown because its
    just a marker to indicate meaningful traffic instead of line noise. The first
    byte (0xff) is the Address field. The second byte (0x03) represents the Control
    field. The next 2 bytes (0xc021) represent an LCP echo request. The remainder
    of the packet is LCP-specific payload.


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_36_0.png)


    Figure 2.2 A PPP frame.


    # Ethernet


    Although we typically talk about Ethernet as a single protocol, actually two distinct
    protocols implement Ethernet at the link layer. The most widely used is Ethernet
    II, described in RFC 894. Less used is IEEE 802.3-style Ethernet, defined by the
    IETF in RFC 1042. Internet hosts are required to understand Ethernet II and may
    implement 802.3. If they offer 802.3, Ethernet II must be provided and should
    be the default.55 We will discuss Ethernet in terms of Ethernet II and point out
    areas where 802.3 differs.'
