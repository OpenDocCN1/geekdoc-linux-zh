    (named snowflakes, cheerios, and crackedwheat) for their day–to-day work.


    # # The Case Studies


    In this section, we''ll present several problems, explicitly following the nine-step
    problem-solving pattern given in Chapter 6, “A Problem-Solving Pattern.” Each
    problem will be introduced as it might occur in the real world, and then the path
    followed to the solution will be shown.


    # # “The Network is Always Slow in the Morning”


    Eliza is pretty happy with herself as she settles into her new office morning.
    She has just taken a job as the network administrator at a Web-based startup.
    About half of the staff has already been hired, and the network is already in
    place. That scares her a bit, but she took a look at it during her interview,
    and it didn''t look too bad. She has already mapped several fix-up projects. First
    on her docket, though, is to get a solid baseline.'
