  md: '# 3 Network-Layer Protocols


    THE NETWORK LAYER (OR INTERNETWORK LAYER) marks the point where traffic escapes
    the confines of a single network. It also marks the point where addressing hits
    its first layer of abstraction (as shown in the section “ARP” in Chapter 2, “Link-Layer
    Protocols”). In our discussion of the network layer, we’ll cover IP addressing,
    subnets and supernets, IP routing, packet filtering, Network Address Translation
    (NAT), and IP version 4 (the version in widest use today)


    Because IP addressing, subnetting, and routing are inextricably bound, it is difficult
    to discuss one of them without referring to the others. If this causes a bit of
    confusion as you read, please indulge your curiosity and skip forward to the appropriate
    section for enlightenment.


    # IP Addresses


    Before discussing the IP protocol, we’ll take some time to review IP addresses
    themselves. Ranges of IP addresses are assigned to organizations. Most often they
    are assigned by the organizations’ ISP, although an organization can apply for
    its own IP addresses in some rare circumstances. Any of these assigned IP addresses
    can be routed across the Internet unless blocked by a firewall.'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# Chapter 3 Network-Layer Protocols


    IP addresses indicate how large the local IP network is and (in some cases) what
    it is used for. This is done by dividing networks into classes, as shown in Table
    3.1.


    Table 3.1 Network Address Classes


    | Type of Network | First Byte of Address | Identifying Pattern | Notes |

    | --- | --- | --- | --- |

    | Class A | 0–127 | First bit is a zero. | Class A networks provide 16,777,214
    hosts per network. The network address is 1 byte long. |

    | Class B | 128–191 | First 2 bits are 10. | Class B networks provide 65,534 hosts
    per network. The network address is 2 bytes long. |

    | Class C | 192–223 | First 3 bits are 110. | Class C networks provide 254 hosts
    per network. The network address is 3 bytes long. |

    | Class D | 224–239 | First 4 bits are 1110. | Class D addresses are used for
    multicast traffic. |

    | Class E | 240–247 | First 5 bits are 11110. | Class E addresses are reserved
    for experimental use. |


    In addition to these divisions of IP addresses, another distinction is made. Some
    of these addresses are set aside for *private addressing*. RFC 1918 sets the following
    addresses for hosts internal to a company:


    +   - 10.0.0.0

    - 172.16-–31.0.0

    - 192.168.0–255.0


    These addresses can be used however you see fit, as long as they are not routed
    across the Internet. This allows everyone else to use the same set of addresses
    for their internal networks as well. Widespread use of RFC 1918 addresses is made
    possible by the use of NAT, discussed later in this chapter and in Chapter 11,
    “Security Tools." Please help conserve the available IP addresses by using private
    addressing. Using RFC 1918 address space for your internal networks is also better
    for the security of these networks. I will use RFC 1918 addresses as much as possible
    (See the “Network Address Translation,” later in this chapter, for more information.)


    Because Class A and Class B networks are far too large for a normal LAN, and sometimes
    a Class C network does not fit either, there is a method for splitting a network
    into smaller chunks. This method is called *subnetting*. Subnets are formed with
    the *subnet mask* or *network mask*, another 4-byte number. Subnetting is discussed
    in the next section, so we''ll leave that explanation for later.'
