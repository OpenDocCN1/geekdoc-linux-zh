  md: '# Inverting a Selection


    Sometimes it is easier to say “anything that isn''t foo” than it is to specify
    all the individual things you want to talk about. iptables allows for this with
    an inversion prefix. To invert a selection, you use i!. Selecting anything that
    doesn''t come from the 192.168.1.0/24 network would look like this:


    ```

    -s ! 192.168.1.0/24

    ```


    # Creating Your Own Selection Criteria


    iptables is designed to be extensible, so you can define your own criteria. Definitions
    can be based on existing TCP, UDP, ICMP, State, or other extensions.


    TCP extensions also include examination of TCP Flags and TCP Source and Destination
    Ports. To look for the SYN and ACK flags being set without any other flags turned
    on, you could do this:


    ```

    -p tcp --tcp-flags ALL SYN,ACK

    ```


    To look for connections to X servers, you could do this:


    ```

    -p tcp --destination-port 6000-6010

    ```


    A --source-port extension is also provided. Both of these extensions allow four
    kinds of port listing: a single port, a range of ports (as above), all ports at
    or above a listed port (1024-), or all ports at or below a listed port (-1024).


    UDP extensions are similar, but include only the --destination-port and --source-port
    options from the TCP extensions. ICMP extensions provide searching of the ICMP
    Type and Code with the --icmp-type switch. The numeric value of the Type, or the
    Type and Code separated by "/" are all allowed. To search for an ICMP Redirect
    for Host, you could do this:


    ```

    -p icmp --icmp-type 5/1

    ```


    Inspection of a connection''s state can determine whether a packet is requesting
    a new connection, related to an existing connection (such as an ICMP error message),
    part of an existing connection, or indeterminate. To search for packets that are
    requesting new connections, you could do this:


    ```

    -m state --state NEW

    ```'
