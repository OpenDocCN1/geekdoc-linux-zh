  md: '# Setting Up a Server for TFTP


    Setting up a Linux box to serve TFTP is a pretty simple task. TFTP is a notorious
    security hole, but it can also be an important part of your network. Diskless
    systems and a variety of other hardware use TFTP to retrieve configuration files
    from a server.


    Two major problems exist with TFTP: First, it allows anonymous read and write
    access to a well-known port. Second, it is a UDP-based application, so it is harder
    to handle with a firewall (sort of just blocking it altogether).


    Like most protocols, if you don''t need TFTP, don''t run it. If you need a TFTP
    server, run it on just one box and de keep it as secure as possible. The following
    paragraphs explain how to do it.


    Starting the TFTP server is as simple as modifying your /etc/inetd.conf file and
    sending the HUP signal. The section you''ll want to change looks like the one
    shown in Example 5.1 (at least on a Red Hat 6.2-system)


    # Example 5.1 An inetd Without TFTP Enabled


    ```

    # TFTP service is provided primarily for booting. Most sites

    # run this only on machines acting as ''boot servers.'' Do not uncomment

    # this unless you ''need'' it.


    #tfftp dgram udp wait root /usr/sbin/tcp in.tfftpd

    #bootps dgram udp wait root /usr/sbin/tcp bootpd

    #

    ```


    You need to change it like the one shown in Example 5.2.


    # Example 5.2 An inetd With TFTP Enabled


    ```

    # TFTP service is provided primarily for booting. Most sites

    # run this only on machines acting as ''boot servers.'' Do not uncomment

    # this unless you ''need'' it.

    #

    #tfftp dgram udp wait root /usr/sbin/tcp in.tftpd

    #bootps dgram udp wait root /usr/sbin/tcp bootpd

    #

    ```


    After you''ve made this change, you can kill the inetd server. The process is
    shown in Example 5.3.


    # Example 5.3 HUping inetd


    ```

    [cherry/root]$# ps -aux | grep inetd

    root 482 0.0 0.0 148 SW Aug08 0:00 [inetd]

    root 279.1 0.0 1360 500 pts/1 R 04:31 group grep inetd

    [@cherry/root]$# ps -ef | grep inetd

    root 482 1 0 Aug08 ? 00:00:00 [inetd]

    [@cherry/root]$# kill -1 482

    [@cherry/root]$# ps -aux | grep inetd

    root 482 0.0 0.3 1148 S Aug08 0:00 inetd

    root 2795 0.0 0.8 1364 524 pts/1 S 04:32 0:00 grep grep

    [@cherry/root]$#

    ```'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# Chapter 5 Application-Layer Protocols


    After you accomplish this, you''ve got a running TFTP server. The big question
    now is, “What will it do?” By default, tftppd serves files out of /tftpboot directory.
    You might want to change this to something in its own file system to help mitigate
    file system attacks.^5 You can adjust the directory that tftppd serves files out
    of by adjusting your /etc/inetd.conf file, like so:


    ```

    tftp dgram udp root /usr/sbin/tcp in.tftppd /mnt/tftpserve

    ```


    You will need to put any files that you want to serve into this directory. The
    directory and any files that you want to serve will be world-readable (mode 666
    for files and 777 for directories) because tftppd doesn''t use any authentication
    for file transfers. tftppd will allow only write access to files that exist and
    are world-wide (mode 555).


    # Using TFTP


    The TFTP protocol client is implemented as the executable /usr/bin/tftp. This
    command is not installed on all Linux distributions.


    # Command-Line Options


    /usr/bin/tftp allows only one command-line option: the remote host name or IP
    address. The command is used as shown in Example 5.4.


    > Example 5.4 Starting TFTP

    [pate@cherry pate] tftp crashtestdummy tftp?


    The command in Example 5.4 starts a TFTP session to the host crashtestdummy. The
    remote host of the command is optional and can just as easily be done as shown
    in Example 5.5.


    > Example 5.5 Another Way to Start TFTP

    [pate@router pate]$ tftp tftp?

    [pate@router pate]$'
