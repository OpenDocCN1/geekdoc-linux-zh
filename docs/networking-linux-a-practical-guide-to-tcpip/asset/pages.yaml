  md: '# Chapter 5 Application-Layer Protocols


    # Routing Loops and Split Horizon


    This is where we hit our first major problem with RIP. What would happen if alan.3
    failed? bill would send a RIP broadcast showing a two-hop entry for the 192.168.6.0/24
    network. Normally, alan would ignore these because they have a higher hop count
    than alan''s entries, but the eth3 interface, bill''s route becomes the best available—except
    that they involve a right back to alan.


    RIP doesn''t carry enough information to stop these kinds of routing loops. Instead,
    it relies on a method split horizon. RIP No participant will reprocast the route
    that it received on it (the loop is avoided).


    If bill follows this rule, alan never receives routes to bob, and the loop is
    avoided.


    To continue our example, caleb has one-hop routes to the 192.168.12.0/24, 192.168.22.0/24,
    and 192.168.23.0/24 networks. When it receives bill''s broadcast, caleb learns
    about two-hop routes to the 192.168.13.0/24 and 192.168.5.0/24 networks, and three-hop
    routes to the 192.168.4.0/24 and 192.168.6.0/24 networks. It will broadcast its
    own routing table, and bill and alan will learn about the 192.168.22.0/24 and
    192.168.23.0/24 networks (with two and three hops, respectively)

