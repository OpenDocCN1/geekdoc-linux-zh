  md: '# 4. FILE TRANSFER


    # 4.1 FILE TRANSFER PROTOCOL—FTP


    # 4.1.1 INTRODUCTION


    The File Transfer Protocol FTP is the primary Internet standard for file transfer.
    The current specification is contained in RFC-959 [FTP:1].

    FTP uses simultaneous TCP connections for control and data transfer. The FTP protocol
    includes many features, some of which are not commonly implemented. However, for
    every feature in FTP, there exists at least one implementation. The minimum implementation
    defined in RFC-959 was too small, so a somewhat larger minimum implementation
    is


    Internet users have unnecessarily burdened for years by deficient FTP implementations.
    Protocol implementors have suffered from the erroneous opinion that implementing
    FTP ought to be a small and trivial task. This is wrong, FTP has a user interface,
    which has to deal (correctly) with the whole variety of communication and operating
    system errors that may occur, and because it has to handle the great diversity
    of real file systems in the world that occur.


    # 4.1.2. PROTOCOL WALK-THROUGH


    # 4.1.2.1 LOCAL Type: RFC-959 Section 3.1.1.4


    An FTP program MUST support TYPE I (“IMAGE” or binary type) as well as TYPE L
    8 (“LOCAL” with logical byte size 8). A machine whose memory is organized into
    m-bit words, where m is not a multiple of 8, MAY also support TYPE L m.

    DISCUSSION:

    The command "TYPE L 8" is often required to transfer binary data between a machine
    whose memory is organized into (e.g.) 36-bit words and a machine with an 8-bit
    byte organization. For an 8-bit machine, TYPE L 8 is equivalent to IMAGE.

    "TYPE L m" is sometimes specified to the FTP programs on two m-bit word machines
    to ensure the correct transfer of a native-mode binary file from one machine to
    the other. However, this command should have the same effect on these machines
    as "TYPE I."


    # 4.1.2.2 Telnet Format Control: RFC-959 Section 3.1.1.5.2


    A host that makes no distinction between TYPE N and TYPE T SHOULD implement TYPE
    T to be identical to TYPE N.

    DISCUSSION:

    This provision should ease interoperation with hosts that do not make this distinction.'
