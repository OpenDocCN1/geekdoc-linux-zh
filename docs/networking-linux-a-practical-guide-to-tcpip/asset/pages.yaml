- img_proc: true
  md: '# Turning Linux Box into a Router


    All Linux boxes are capable of IP traffic. This capability is turned off by default
    on most Linux distributions. A kernel parameter called ip_forward controls this
    functionality. The following command will enable routing on your system:


    ```

    echo 1 >/proc/sys/net/ipv4/ip_forward

    ```


    If your box is connected to two or more IP networks, it will begin to route traffic
    between them. Or, it will only route traffic that is sent to a router, so you
    should inform the hosts on its connected networks that this router is now in place.
    For a simple network, this is likely to mean adding your router as the default
    gateway on your individual hosts. For a more involved network, you will want to
    start the route, gated, or zebra daemons and let them advertise your new router.
    For more information on these programs, see Chapters 5 and 7.


    # More Advanced Tricks


    The 2.4 Linux kernel includes the capability to go far beyond this simple routing.
    Some of the advanced routing capabilities with the new kernel include routing
    based on type of service, rerouting traffic based on the application-layer protocol,
    packet filtering, network address translation, traffic shaping, and a variety
    of other tricks.


    # Packet Filtering


    Packet filtering is the process of determining whether to route, accept, or deny
    a packet based on information in the packet header. The simplest form of packet
    filtering relies on a comparison of source and destination IP addresses (see Figure
    3.5).


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_62_0.png)


    Figure 3.5 A small network.'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'Given a network traffic like the one shown in Figure 3.5, the packet filter
    might set up rules to block traffic (using a simple pseudo config code explained
    here).


    ```

    deny 10.0.0.0/24 201.13.25.0

    deny 172.16.0.0/20 201.13.25/0

    deny 192.168.0.0/16 201.13.25/0

    deny 127.0.0.0/24 201.13.25/0

    deny 201.13.25.0/8 201.13.25.0/8

    allow 0.0.0.0/32 201.13.25.100/0

    deny all

    ```


    Each rule of this form is:


    ```

    action source/mask destination/mask

    ```


    The masks in these rules are not subnet masks; each represents a changeable bit
    starting from the least significant bit in the address. For example, the destination/mask
    combination 201.13.25.0/8 represents all addresses from 201.13.25.0 to 201.13.25.255
    (any bit in the last octet can be set to any value).


    The first five rules deny connections from three classes of traffic: the RFC 1918
    private addresses (discussed earlier), the local loopback addresses, and the internal
    network (to prevent spoof traffic). The sixth rule allows traffic from any host
    (not already denied) that is destined for 201.13.25.100. The final rule denies
    everything else.


    The Linux packet-filtering capabilities are provided by netfilter and iptables.
    Tools used are described in their section in Chapter 11.


    # Network Address Translation


    Network Address Translation (NAT) is the method for mapping a private internal
    address space (normally made up of RFC 1918 addresses) to one or more routable
    IP addresses. This functionality can help provide security (by obscuring your
    internal address structure) and by preventing connection to your internal hosts)
    and minimize IP address overhead (by using a private address space instead of
    having to acquire routable IP addresses from your ISP.


    A common form of NAT is called masquerading. IP masquerading maps any internal
    address space to a single IP address. This is common to allow several PCs in a
    home or small office to share a single dial-up, DSL, or cable-modem connection
    to the Internet.


    # IPv4


    The Internet Protocol (IP) is defined by RFC 791. IP provides routable addressing,
    fragmentation and reassembly, and type of service (TOS)–based delivery options.'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# A Discussion of IPv4


    The IPv4 header is normally 20 bytes long. It contains a 4-bit Version field (this
    will always be 4), a 4-bit Header Length field (this will normally be 5, indicating
    five words of 4 bytes, for a total of 20 bytes), a 1-byte TOS field, a 2-byte
    Total Length (TTL) field, a 2-byte Identification field, a 3-bit Flags field,
    a 13-bit Fragment Offset field, a 1-byte Time To Live (TTL) field, a 1-byte Protocol
    field, a 2-byte Header Checksum field, a 4-byte Source Address field, and a 4-byte
    Destination field.


    # TOS


    The TOS byte is divided into three sections. In the first section, 3 bits are
    used for a precedence field, which is little used today. In the second section,
    4 bits are used to indicate TOS, and each one of them may be set. The four possible
    flags are delay, throughput, reliability, and cost. If none of these bits are
    turned on, normal routing is considered zero. The third section is a 1-bit reserved
    space; this bit is reserved and must be set to 0.


    The TOS bits allow better control over how a packet will be routed. An interactive
    application such as ssh should set the delay bit, indicating that packets should
    be routed to minimize delay. An application transferring data should set the throughput
    bit to gain routing geared towards maximizing throughput. These options are explained
    more fully in RFC 1349. In addition to TOS routing, the 2.4 Linux kernel provides
    powerful tools for shaping network traffic based on a number of possible keys;
    these tools will be discussed in Chapter 11.


    # Total Length


    The Total Length field indicates the total length of the IP datagram (including
    header) in bytes. IP is limited to 65535 bytes, 65515 of which can be payload.
    If the IP datagram is fragmented (see the section "Fragmentation Flags," which
    follows shortly), the Total Length field indicates the size of the fragment. In
    practice, TCP and UDP limit the size of their data to avoid sending extremely
    large packets (8192 bytes is a ceiling).


    # Identification


    Each datagram from a given host is uniquely identified by the 2-byte Identification
    field. This identification does not change between fragments of a single datagram,
    which allows a datagram to be reassembled at the destination.'
  merge: -1
  pgno: 64
- img_proc: true
  md: '# Fragmentation Flags


    The 3-bit flags contain two flags dealing with fragmentation and a reserved bit.
    The first bit is reserved and must be 0. The second bit is the Don''t Fragment
    flag. If the Don''t Fragment bit is set, it indicates that this packet should
    not be fragmented; instead, an Internet Control Message Protocol (ICMP) error
    message should be generated. The third bit is the Last Fragment flag. This bit
    is set when there are no further fragments for this datagram.


    # Fragmentation Offset Field


    If the datagram has not been fragmented, the Fragmentation Offset field will be
    set to all 0s. If the datagram has been fragmented, the field will indicate the
    number of 8-byte words fragments from the start of the datagram. An example of
    fragmentation appears in the section “IP Fragmentation."


    # TTL


    The TTL field indicates the number of hops the packet can make before being discarded.
    When a packet is created, it is given a TTL of 64. Then, each time that it passes
    through a router, the TTL is decremented by 1. This prevents undeliverable packets
    from floating around the network forever.


    # Protocol


    The Protocol field indicates which protocol is carried in the payload of the datagram.
    We are concerned with three possible values: these are 0x06 (TCP), 0x11 (UDP),
    and 0x01 (ICMP). Each of these protocols is dealt with in the next chapter.


    # IP Checksum


    The IP checksum is computed over the header data only; none of the payload is
    used in the computation. For the purpose of the checksum, the Checksum field is
    initially filled with zeroes.


    # Source and Destination Addresses


    The Source and Destination Address fields contain the IP addresses of the sending
    and target hosts. These fields are not changed in the flow of IP data across a
    network, except in the case of source-routed datagrams (see Table 3.4). Because
    of security concerns, source routing is not commonly used any longer.


    # IP Options


    IP headers will exceed 20 bytes when IP options are included. In this case, the
    Header Length field will be reset to the value 0xf, and the following additional
    fields will be made available: Copy Thru Gate (1 bit), Option Class (2 bits),
    and Option Number (5 bits). The Copy Thru gate field indicates whether these options
    should be attached'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'to fragment of an IP packet (when set to 1) or not (when set to 0). The Option
    Class field has two unreserved values, 00 indicates traffic control codes, and
    10 indicates measurement and debugging codes. Some of the options are shown (with
    brief explanations) in Table 3.4.


    # Table 3.4 IP Options


    | Class | Option Code | Option Name | Length | Description |

    | --- | --- | --- | --- | --- |

    | 00 | 00000 | End of Option List | — | Indicates that there are no further options
    in the Options |

    | 00 | 00010 | Security Handling | 11 | Defines how a packet is to be handled
    (in a military environment). See RFC 1108 for more details |

    | 00 | 00011 | Loose Source Routing | Variable | Indicates that a packet should
    traverse a specified set of routers. Other routers may also be traversed |

    | 10 | 00100 | Collect Internet Timestamps | Variable | Indicates that a packet
    should be stamped with the current time by each host that it traverses |

    | 00 | 00111 | Record Route | Variable | Indicates that a packet should be stamped
    with the IP address of each host that it traverses |

    | 00 | 01001 | Strict Source Routing | Variable | Indicates that a packet should
