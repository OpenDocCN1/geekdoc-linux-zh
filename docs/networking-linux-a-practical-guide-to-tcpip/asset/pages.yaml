  md: 'Ethereal can give you a great deal of insight into the way things are really
    working on your network, but only in conjunction with a good understanding of
    the protocols themselves. In this section we''ll look at the following topics:


    +   * Getting and installing Ethereal

    * Using Ethereal to capture packets

    * Using Ethereal to view packets

    * Filtering packets during both capture and display to make network diagnostics
    a bit simpler

    * Dealing with bugs in Ethereal


    # Getting and Installing Ethereal


    Ethereal is available for a wide range of platforms, including Linux, Windows,
    and server UNIX platforms. Although Ethereal has a command-line interface, it
    requires GTK+ be installed on the system on which it is built. Ethereal relies
    on libcap. I''ll build it from source on Linux in this section. However, when
    you install, it is important to ensure that you have Ethereal and the two software
    packages that it relies on. It should also be mentioned that although there are
    binaries of Ethereal available for many platforms, they are not always the most
    recent. You might want to take the extra time to build your own.


    # Downloading Binary Packages


    Certainly the easiest way to install Ethereal is with the package-management system
    of your Linux distribution. The most recent binary packages for Ethereal are available
    at http://ethereal.zining.org/download.html. In addition to the Ethereal packages
    themselves, you''ll also need to get packages for libcap and perhaps for ucd-snmp
    (which will depend on what is installed on your system). After you''ve located
    the requisite packages, you''re ready to go.


    # Downloading and Building Source


    Building Ethereal is a bit more involved, but not too much. The following build
    instructions are based on a stock GNOME'' of a Red Hat 6.2 box. Don''t forget
    that you''ll need to install libcap before you build Ethereal. You can do this
    with RPMs or by building it from source. Building from source isn''t too hard,
    but you''ll need to deal with a couple gotchas when building libcap on Red Hat
    6.2. First you''ll need to make the /usr/local/include and /usr/local/include/net
    directories. You also must remember to do a make install-incl as well as the make
    install. The proper installation of libcap is shown in Example 10.2.'
