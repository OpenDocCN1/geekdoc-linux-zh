  md: '# An Overview of iptables and Netfilter


    Netfilter is a kernel module for the 2.4 kernel series, and it is responsible
    for packet filtering. It looks at the headers of each packet moving through the
    gateway and makes a decision about what to do with them. Packets might be accepted
    (passed along to the routing process or the receiving protocol stack), dropped
    (not forwarded), or they might have some complicated action taken. People choose
    to filter their traffic for many reasons. The most common reasons include network
    traffic, segregating an internal network, providing NAT for internal hosts, and
    controlling users'' access to external services.


    Netfilter starts with three sets of rules: INPUT, OUTPUT, and FORWARD. These rule
    sets are called chains (short for firewall chains). Traffic moves through these
    chains as shown in Figure 11.8.


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_207_0.png)


    Figure 11.8 IP traffic moving through the firewall chains.


    Each chain represents a list of rules that are consulted sequentially for each
    packet. As traffic moves through a rule chain, it is examined to determine what
    to do with it. If it is accepted, it passes to the next point in the diagram.
    If it is dropped, it stops there. If a rule doesn''t specify what to do with a
    packet, the packet is examined by the next rule.


    # Setting Up iptables


    The first step in setting up iptables is to build the appropriate kernel modules.
    These can either be built as separate modules or included in the kernel. To build
    them into the kernel, answer ''Y'' to the question CONFIG_NETFILTER during kernel
    configuration on any kernel of 2.3.15 or better. You might find that there are
    additional kernel modules you want to build and install (such as ip_conntrack_ftp).'
  merge: -1
  pgno: 207
- img_proc: true
  md: "With the necessary kernel modules available, you can build and install the\
    \ userspace tools. You can download iptables from netfilter.kernelnotes.org or\
    \ either of the other sites mentioned previously. After downloaded, iptables follows\
    \ the normal configure, make, make install pattern.\n\nYou can use the set of\
    \ rules shown in Example 11.4 to test¹ your newly installed iptables and netfilter.\n\
    \n# Example 11.4 A Test Script for iptables\n\n```\n# create a new table\niptables\
    \ -N GATE\n\n# set up rules for it\niptables -A GATE -m state --state ESTABLISHED,\
    \ RELATED -j ACCEPT\niptables -A GATE -eth0 -s 192.168.1.20 -j LOG --log-prefix\
    \ \\\n  \"connection from test bad machine, dropping:\"\niptables -A GATE -s 192.168.1.20\
    \ -j DROP\niptables -A GATE -s 192.168.1.21 -j LOG --log-prefix \\\n  \"connection\
    \ from test good machine, accepting:\"\niptables -A GATE -j LOG --log-prefix \"\
    Accepting packet:\"\niptables -A GATE -j DROP\n\n# apply it to the INPUT and FORWARD\
    \ chains.\niptables -A INPUT -j GATE\n```\n\nAfter you've installed these rules,\
    \ you can test them by trying to connect from 192.168.1.20 and 192.168.1.21. The\
    \ first connection should fail (with a log entry), and the second should succeed\
    \ (also with a log entry). If this happens, everything is fine and you can flush\
    \ the rules:\n\n```\niptables -F GATE\niptables -X GATE\niptables -F INPUT\n```\n\
    \nNow that the tools have been built, installed, and verified you can configure\
    \ them for use at your site.\n\n# iptables at Work\n\nBefore you start writing\
    \ rules, it is important to sit down and think about three things: What policy\
    \ are you trying to implement, how can you keep the rules and chains manageable,\
    \ how can you keep the rules as efficient as possible without making them unmanageable.\
    \ If the rules don't implement the policy you're trying to enforce, they might\
    \ as well not be there. If you (and your coworkers) can't read and maintain the\
    \ rules, someone is going to break them. If they don't work efficiently, they\
    \ will throttle your network."
