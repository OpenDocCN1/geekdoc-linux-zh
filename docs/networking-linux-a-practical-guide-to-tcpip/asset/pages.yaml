  md: '# 126 Chapter 7 Before Break—Building a Baseline


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_143_0.png)


    Figure 7.2 A simple network map.


    A map that is simple is going to rely on external documentation to keep track
