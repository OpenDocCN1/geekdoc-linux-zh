    # 5.2.6 Mail Relay: RFC-821 Section 3.6


    We distinguish three types of mail (store-and-) for forwarding:


    +   1. A simple forwarder or "mail exchanger" forwards a message using private
    knowledge to the recipient; see section 3.2 of RFC-821.


    +   2. An SMTP mail "relay" forwards a message within an SMTP environment as the
    result of an explicit source route (as defined in section 3.6 of RFC-821). The
    SMTP relay function uses the "@:..." form of source route from RFC-822 (see Section
    5.2.19 below).


    +   3. A mail "gateway" passes a message between different environments. The rules
    for mail gateways are discussed below in Section 5.3.7.


    An Internet host that is forwarding a message but not a gateway to a different
    mail environment (i.e., it falls under (1) or (2)) SHOULD NOT alter any header
    fields, although the host will add an appropriate Received: line as required in
    Section 5.2.8.


    A Sender-SMTP SHOULD NOT accept a RCP TO: command containing an explicit source
    route using the "@:..." address form. Then, the relay function defined in 3.6
    of RFC-821 should not be used.


    DISCUSSION:


    The intent is to discourage all source routing and to abolish explicit source
    routing for mail delivery within the Internet environment. Source-routing is unnecessary;
    the simple target address "user@domain" should always suffice. This is the result
    of an explicit architectural decision to use universal naming rather than source
    routing for mail. Thus, SMTP provides end-to-end connectivity, and the DNS provides
    globally-unique, location-independent names. MX records handle the major case
    where source routing might otherwise be needed.


    A Receiver-SMTP MUST accept the source route syntax in the envelope, but it MAY
    implement the relay function as defined in section 3.6 of RFC-821. If it does
    not implement the relay function, it SHOULD attempt to deliver the message to
    the host to the right of the most-right "@" sign.'
