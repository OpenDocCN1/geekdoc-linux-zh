    # Related Information


    Web servers are tricky things to tune well. In large measure this is because there
    are so many options. Other tuning areas to keep in mind are these:


    +   - Dynamic content takes more resources to serve up. If you''re going to build
    pages dynamically, make sure that you''re optimizing things.


    +   - If you''re serving a lot of content from an overpowered server, you''ll
    run into problems. Make sure that you have a fast CPU and enough RAM to carry
    the load.


    +   - You might find that you just can''t provide fast service to everyone from
    a single site. Consider using multiple servers at different locations, or look
    into a content distribution service such as Akamai.


