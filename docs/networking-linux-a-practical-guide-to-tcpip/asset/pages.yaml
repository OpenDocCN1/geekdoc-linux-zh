    ```


    The traceroute tool is especially important for servers that handle connections
    from disparate parts of the Internet. Setting up several traceroutes to remote
    hosts can give you an indication of remote users speeds to your server.


    The ping tool can help you watch the performance of a local or remote network
    in the same way that traceroute does. It does not give as much detail, but it
    requires less overhead.


    When users connect to services on your hosts, they leave a trail through your
    log files. If you use a central logging host and a log reader to build a history
    of how often servers are used and when they are most heavily utilized.


    # Work/Problem Logs


    You will find yourself touching a lot of the equipment on your network, so it
    is important to keep good records of what you do. Even seemingly blind trails
    in troubleshooting may help you to discover information about your network. In
    addition, you will find that your documentation will be an invaluable asset next
    time you need to troubleshoot a simple problem.


    Some people like to carry around a notebook to keep their records in; others prefer
    to keep things online. Both camps have good points, many related to information
    access. If you keep everything in a notebook but don''t have it handy, it does
    you no good. Similarly, if everything is online and the network is, you''re in
    good shape.'
