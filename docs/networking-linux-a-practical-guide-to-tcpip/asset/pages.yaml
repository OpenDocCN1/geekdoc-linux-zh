  md: '# IP Addresses


    When a machine transmits IP traffic, it must make a decision about whether the
    target host is local or remote. Local hosts are directly addressed, which means
    that traffic will be sent to the MAC address that corresponds to the target IP
    address. Traffic for remote hosts will be sent to the local gateway for that network
    (routing is covered in a later section; for now, we''ll just wave hands and say
    that it happens). This routing decision is made on the local (or source) IP address
    with its network mask, the destination IP address. The source IP address is bitwise
    ANDed with the network mask, as is the destination address. The two resulting
    numbers are compared (as shown in Figure 3.1).


    | 11000000 10101000 00000000 00010000 192.168.1.16 Address |

    | 11111111 11111111 11111111 10000000 255.255.255.250 Network Mask |

    | 11000000 10101000 00000000 00000000 192.168.1.0 Network |


    Figure 3.1 IP address and network mask being ANDed.


    If the results of these two AND operations are the same, the two machines are
    local. If they are not the same, the two machines are remote.


    # Example 3.1 A Local Addressing Decision


    | Source Destination |

    | Address: 192.168.1.100 Address: 192.168.1.25 |

    | Netmask: 255.255.255.00 Netmask: 255.255.255.00 |

    | Result: 192.168.1.0 Result: 192.168.1.0 |


    Because the results in Example 3.1 match (the network address of the two hosts
    ANDed with the local subnet mask), these hosts are local to each other; direct
    addressing will be used.


    # Example 3.2 A Remote Addressing Decision


    | Source Destination |

    | Address: 192.168.1.100 Address: 192.168.10.25 |

    | Netmask: 255.255.255.0 Netmask: 255.255.255.0 |

    | Result: 192.168.1.0 Result: 192.168.10.0 |


    Because the results of the two hosts in Example 3.2 do not match, these hosts
    are not local to each other; traffic will need to be routed between them.'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# Subnets and Supernets


    Subnets and supernets provide a means for using IP addresses more efficiently.
    Subnets have been around nearly as long as IP addresses, but supernetting is much
    newer (and thus not as as widely understood). In this section, we''ll cover the
    mechanics of subnetting, give some practical examples, and talk about the mechanics
    of supernetting.


    # A Discussion of Subnets


    Most companies find that a Class C address is either too large or too small for
    their needs. Take a small software company, for example. Let''s say that it has
    four networks in the office: a LAN for the Human Resources and Accounting departments,
    as well as the executives; a LAN for the developers to test unstable versions
    of its product; the LAN that everyone uses; the secure network that the company''s
    Internet-accessible hosts are. None of the LANs have more than 14 machines on
    it (including the router that connects the four LANs). This company doesn''t need
    four C networks; it can get by just one by breaking the network up into the right
    size chunks.


    Subnetting gives us a way to break up networks. It provides a mechanism for dividing
    the host portion of the IP address into two sections: a subnet and a host portion.
    The diagram shown in Figure 3.2 shows this division.


    | Network | Subnet | |

    |---|---||

    | 11000000 10101000 | 00000000 00100000 | 192.168.1.0/28 |


    Figure 3.2 An IP address showing the subnet and host fields.


    To break a network into subnets, you must provide a subnet mask. Masks are specified
    by indicating which bits are used for network or subnet addresses. It would be
    rather tedious to say for the network address 192.168.1.0, the following pattern
    as the mask: 11111111111111111111111100000000. Instead, we indicate the mask in
    dotted decimal (like an IP address), 255.255.255.0, or by showing the number of
    bits used in the mask as a suffix so: 192.168.1.0/24.


    The number of bits in the subnet tells us how many subnets and hosts are available
    using this mask. In the host field, the all 1s represents the broadcast address,
    and the all 0s address represents the network address, like a standard IP address.
    The subnet field requires only that the all 1s be reserved for an all subnets
    address, although some early implementations used the all 0 address for this purpose.
    For example, the address and mask 192.168.1.33/27 are broken out in Table 3.2.'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# Subnets and Supernets


    Table 3.2 A Subnetted IP Address


    | 1st Byte | 2nd Byte | 3rd Byte | 4th Byte | Dotted Decimal | Notes |

    |---|---|---|---|---|-|

    | 11000000 | 10010100 | 00000001 | 00100001 | 192.168.1.33 | The IP address. |

    | 11111111 | 11111111 | 11111111 | 11100000 | 255.255.255.224 | The subnet-mask.
    |

    | 11000000 | 10010100 | 00000001 | XXXXXXXX | 192.168.1.0 | Network, 3 bytes for
    a Class C subnet. |


    Table 3.2 shows that 192.168.1.33/27 is host 1 of network 192.168.1.0, subnet
    1. A bit confusing? Don''t worry—it gets easier after a few repetitions. Let''s
    look at some more examples (I''ll leave the binary representation of each example
    as exercise):


    +   * 192.168.1.10/24 is host 10 in network 192.168.1.0; this network is not subnetted.

    * 192.168.1.26/28 is host 10 in network 192.168.1.0, subnet 1.

    * 192.168.1.128/25 is the network address (host 0) in network 192.168.1.0, subnet
    8.

    * 192.168.1.127/27 is the broadcast address (host 16) in network 192.168.1.0,
    subnet 7.

    * 192.168.1.26/30 is host 2 in network 192.168.1.0, subnet 6.


    Subnetting works equally well in non-Class C networks:

    * 172.16.1.10/24 is host 10 in network 172.16.0.0, subnet 1.

    * 172.16.1.129/25 is host 1 in network 172.16.0.0, subnet 3.


    The network mask is defined with the /sbin/ifconfig command, as follows:

    * /sbin/ifconfig eth0 192.168.1.10 netmask 255.255.255.255


    This example is a bit convoluted—24 bits is the default mask for a Class C address.
    If you''re going to go all the trouble of defining a subnet mask, though you probably
    want something other than the default value. If you wanted to assign a 28-bit
    mask, you should do this:


    ```

    /sbin/ifconfig eth0 192.168.1.10 netmask 255.255.255.224

    ```


    This represents host 10 in network 192.168.1.0, subnet 0.'
