  md: '![](img/5b4988f59e82a39b3f220b0f1d3777dd_34_0.png)


    # # 2


    # # Link-Layer Protocols


    THE LINK-LAYER PROTOCOLS PROVIDE THE MEANS for computers to communicate with one
    another where there is a common physical link. That link could be provided by
    a common Ethernet, a *Plain Old Telephone Service* (POTS) line, a *Fiber Distributed
    Data Interface* (FDDI) ring, or even a roost of carrier pigeons (see RFC 1149
    for more details!).


    All the upper-layer protocols depend on the link layer for the actual delivery
    of data. Because the upper-layer protocols exist, traffic can traverse an internetwork
    with many different link-layer protocols. In fact, most internetworks fit this
    description. For example, two office LANs with a dedicated PPP connection would
    look like the diagram shown in Figure 2.1.'
