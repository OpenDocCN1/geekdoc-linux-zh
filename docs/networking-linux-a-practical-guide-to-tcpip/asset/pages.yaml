  md: 'After declaring packets matching this rule were to be logged, we gave the --log


    prefix switch to prepend text onto our log entries. The other switch used when
    logging is --log-level, which takes a syslog-style logging level as an argument,
    and directs the logging to that logging level. Because logging can take so much
    disk space, the -m limit option. This command will limit the number of matches
