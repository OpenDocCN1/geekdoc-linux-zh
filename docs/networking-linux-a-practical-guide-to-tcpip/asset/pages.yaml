  md: '# Physical-Layer Issues


    10Base5 wiring was expensive and difficult to connect to, and it couldn''t be
    laid around tight turns. A newer physical standard was developed that helped mitigate
    problems, at the cost of a shorter maximum length. Thinnet, or cheapner, as it
    was sometimes called, carried a 10Mbps baseband signal nearly 200 meters over
    coaxial cable, and it was termed 10Base2.


    Ethernet over twisted-pair wiring gave the name 10BaseT because it carried a 10Mbps
    baseband signal. When 100Mbps Ethernet was released, it ran over twisted-pair
    wiring and was termed 100BaseTx. Both of these implementations call for four pairs
    of twisted-pair per connection (using an RJ-45 connector, which looks like an
    oversize phone jack). The standard calls for host-to-hub (or switch) connections.


    10BaseT and 100BaseTx use only four wires out of the eight wires available in
    the four pairs. These four wires are used in two pairs, one for transmitting signals
    and the other for receiving them. This leads to some tricks that can be played
    occasionally.


    The standard uses wires 1 and 2 as the transmitting pair, and 3 and 6 as the receiving
    pair. Knowing this, you can make a crossover cable by connecting the pairs as
    shown in Figure 1.9.


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_28_0.png)


    Figure 1.9 A crossover cable.


    These cables enable you to connect two hosts without a hub in the middle (this
    is very similar to a null-modem cable, causing a former co-worker to call it a
    null-hub cable).


    If you have just two hosts to connect, this can be a very simple (and cost-effective)
    way of building your network. This is also the way that two hubs are connected;
    many hubs and switches with a port that can be switched between crossover and
    straight-through connections.


    Because only four of the eight available wires are used, it is possible to run
    two Ethernet connections over a single standard-wiring connection. This results
    in some signal degradation, but is typically usable in a normal office setting.
    If you have any way to run a second set of wiring, which is preferable. If you
    just can''t run a second cable, this trick might help.


    Some other Ethernet standards available include Gigabit Ethernet, wireless Ethernet,
    and 10Broad36 (a broadband Ethernet standard).These aren''t too common yet, although
    Gigabit Ethernet is well on its way to being as common as 10BaseT and 100BaseTx.'
