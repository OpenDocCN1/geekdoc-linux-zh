    # 4.2 TRANSMISSION CONTROL PROTOCOL—TCP


    # 4.2.1 INTRODUCTION


    The Transmission Control Protocol TCP [TCP:1] is the primary virtual-circuit transport
    protocol for the Internet service provides reliable, in-sequence delivery of a
    full-duplex stream of octets (8-bit bytes). TCP is used by those applications
    needing reliable, connection-oriented transport service, e.g., mail (SMTP), file
    transfer (FTP), and virtual terminal service (Telnet); requirements for these
    application-layer protocols are described in [INTRO:1].'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# 4.2.2 PROTOCOL WALK-THROUGH


    # 4.2.2.1 Well-Known Ports: RFC-793 Section 2.7


    DISCUSSION:

    TCP receive port numbers in the range 0–255 for "well-known" ports, used to access
    services that are standardized across the Internet. The remainder of the port
    span can be freely allocated to application processes. Current well-known ports
    are defined in the RFC entitled "Assigned Numbers" [INTRO:6]. A prerequisite for
    defining a new well-known port is an RFC documenting the proposed service in detail
    to allow new implementations. Systems extend this notion by adding a third subdivision
    of the TCP port space: reserved ports, which are generally used for operating-system-specific
    services. For example, reserved ports may fall between 256 and 255 some system-dependent
    upper limit. Systems further choose to protect well-known and reserved ports by
    permitting only privileged users to open TCP connections with those port values.
    This is perfectly reasonable as long as the host does not assume that all hosts
    protect their low-numbered ports in this manner.


    # 4.2.2.2 Use of Push: RFC-793 Section 2.8


    When an application sends a series of SEND calls without the PUSH flag, the TCP
    may aggregate the data internally without sending it. Similarly, when a series
    of segments is received the TCP queues the data internally without passing it
    to the receiving application.


    The PSH bit is not a record marker and is independent of segment boundaries. The
    transmitter SHOULD collapse successive PSH bits when packetizing data, to send
    the largest segment.


    A TCP may implement PUSH flags on SEND calls. If PUSH flags are not implemented,
    then the sending TCP: (1) must not buffer data indefinitely, and (2) MUST set
    the PSH bit in the last segment (i.e., when there is no more queued data to be).


    The discussion in RFC-793 on pages 48, 50, and 74 erroneously implies that a received
    PSH flag must be passed to the application layer. Passing a received PSH flag
    to the application layer is OPTIONAL


    An application is logically required to set the PUSH flag in a SEND call whenever
    it needs to force delivery of the data to avoid a communication deadlock. However,
    a TCP SHOULD set a maximum-sized segment whenever possible, to improve performance
    (Section 4.2.3.4).


    DISCUSS:

    When the PUSH flag is not implemented on SEND calls, i.e., when the application/TCP
    interface uses a pure streaming model, responsibility for aggregating any tiny
    data fragments to form reasonable sized segments is partially borne by the application
    layer. Generally, an interactive application protocol must set the PUSH flag at
    least in the SEND call in each command or response sequence. A bulk transfer'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# Appendix A RFC-1122


    protocol when FTP should set the PUSH flag on the last segment of a file or when
    necessary to prevent buffer deadlock. At the receiver, the PSH forces buffered
    data to be delivered to the application (even if less than a full buffer has been
    received). Conversely, the lack of a PSH bit can be used to avoid unnecessary
    wakeup calls to the application process; this can be an important performance
    optimization for large-sharing hosts. Passing the PSH bit to the receiving application
    allows an analogous optimization within the application.


    # 4.2.2.3 Window Size: RFC-793 Section 3.1


    The window size MUST be treated as an unsigned number, or large window sizes will
    appear like negative numbers and TCP will not work. It is RECOMMENDED that implementations
    receive 32-bit fields for the send and receive window sizes in the connection
    record and do all window computations with 32 bits.


    DISCUSSION:


    It is known that the window field in the TCP header is too small for high-speed,
    long-delay paths. Experimental TCP options have been defined to extend the window
    size; see for example [TCP:11]. In anticipation of the adoption of such an extension,
    TCP implementors should treat windows as 32 bits.


    # 4.2.2.4 Urgent Pointer: RFC-793 Section 3.1


    The second sequence is in error: the urgent pointer points to the sequence number
    of the LAST octet (not LAST+1) in a sequence of urgent data. The description on
    page 56 (last sentence) is correct.


    A TCP MUST support a sequence of urgent data of any length. A TCP MUST inform
    the application layer asynchronously whenever it receives an Urgent pointer and
    there was previously no pending data, or whenever the Urgent pointer advances
    in the data stream. There MUST be a way for the application to learn how much
    data remains to be read from the connection, or at least to determine whether
    or not more urgent data remains to be read.


    DISCUSSION:


    Although the Urgent mechanism may be used for any application, it is normally
    used to send "urgent-type commands (see "Telnet Synch Sequence" in section [INTRO:1]).
    The asynchronous or "out-of-band" notification will allow the application to go
    into "urgent mode," reading data from the TCP connection. This allows control
    commands to be sent to an application whose normal input buffers are full of unprocessed
    data.


    IMPLEMENTATION:


    The generic ERROR-REPORT() upcall in Section 4.2.4.1 is a possible mechanism for
    informing the application of arrival of urgent data.


    # 4.2.2.5 TCP Options: RFC-793 Section 3.1


    A TCP MUST be able to receive a TCP option in any segment. A TCP MUST ignore without
    error any TCP option it does not implement, assuming that the option has a'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# Transport Protocols 27


    length field (all-TCP options defined in the future will have length fields).
    TCP MUST be prepared to handle an illegal option length (e.g., zero) without crashing;
    a suggested procedure is to reset the connection and log the reason.


    # 4.2.2.6 Maximum Segment Size Option: RFC-793 Section 3.1


    TCP MUST implement both sending and receiving the Maximum Segment Size option
    [TCP:4]. TCP SHOULD send an MSS (Maximum Segment Size) option in every SYN segment
    when its receive MSS differs from the default 536, and MAY send it always. If
    an MSS option is not received at connection setup, TCP MUST assume a default MSS
    of 536 (576-40) [TCP:4].nThe maximum size of a segment that TCP really sends,
    the "effective MSS," must be the smaller of the MSS (which reflects the available
    reassembler buffer at the remote host) and the size permitted by the IP layer:
    Eff.snd=min(SendMSS+20, MSS_S) – TCPhdrsize–IPoptions where:


    +   - MSSMSS is the MSS value received from the remote host, or the default 536
    if no MSS option is received.

    - MSS_S is the size for a transport-layer message that TCP may send.

    - TCPhdrsize is the size of the TCP header; which is normally 20, but may be larger
    if TCP options are to be sent.

    - IPoptions is the size of any IP options that TCP will pass to the IP layer with
    the current message. The MSS value to be sent in an MSS option must be less than
    or equal to:


    MMS_R - 20

    where MMS_R is the maximum size for a transport-layer message that can be received
    (and reassembled). TCP obtains MMS_R and MMS_S from the IP layer; the generic
    call GET_MAXSIZES in Section 3.4.


    DISCUSSION:

    The choice of TCP segment size has a strong effect on performance. Larger segments
    increase throughput by amortizing header size and per-datagram overhead over more
    data bytes; however, if the packet is so large that it causes IP fragmentation,
    efficiency drops sharply if any fragments are lost [IP:9]. Some TCP implementations
    send an MSS option only if the destination is not a con-connected network. However,
    in the TCP layer may not have the appropriate information to make this decision,
    so it is preferable to let the IP layer task of determining a suitable MTU for
    the Internet path. We therefore recommend that TCP always send the option (if
    not 536) and the IP layer determine MMS_R as specified in 3.3.3 and 3.4. A proposed
    IP-layer mechanism to measure the MTU would then modify the IP layer without changing
    TCP.'
