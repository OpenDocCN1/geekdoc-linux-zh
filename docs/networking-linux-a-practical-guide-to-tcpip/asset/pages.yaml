    \nThe Record Route option specified by the -R switch is not honored by all routers\
    \ and hosts. Furthermore, because it contains only a limited space to hold router\
    \ addresses, traceroute may be a better tool for identifying the paths through\
    \ a network.\n\n# traceroute\n\nThe traceroute tool provides a UDP-based service\
    \ for tracing the flow of traffic through a network. traceback uses the TTL of\
    \ the IP header to force each hop along the path to return an ICMP Time Exceeded\
    \ message. The destination host is recognized because it returns an ICMP Destination\
    \ Unreachable message.\n\nThe first set of packets is sent with a TTL of 1, which\
    \ times out at the first router. The second set of packet has a TTL of 2 and times\
    \ out at the second router. This pattern is followed until the destination host\
    \ is reached."
