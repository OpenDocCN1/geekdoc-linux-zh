    is used for a variety of purposes that create much larger messages. For example,
    mail is often used instead of FTP for transmitting ASCII files, and in particular
    to transmit entire documents. As a result, messages can be 1 megabyte or even
    larger. We note that the present document together with its lower-layer companion
    0.5 megabytes.'
