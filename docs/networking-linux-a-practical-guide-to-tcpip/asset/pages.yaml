  md: '# 336 Appendix B RFC-1123


    TFTP A

    (9)Receive ACK X+1

    Send DATA X+2

    (11)Receive ACK X+1 again

    Send DATA X+2 again


    TFTP B

    (8)Receive DATA X+1 again

    Send ACK X+1 again

    (10)Receive DATA X+2

    Send ACK X+3

    (12)Receive DATA X+2 again

    Send ACK X+3 again


    Notice after the delayed ACK arrives, the protocol settles down to duplicate all
    further packets (sequences 5-8 and 9-12). The problem is caused not by either
    side timing out, but by both sides retrans the current packet when they receive
    a duplicate.

    The fix is to break the retransmission loop, as indicated above. This is analogous
    to the behavior of TCP. It is then possible to remove the retransmission timer
    on the receiver, since the recent ACK will never cause any action; this is a useful
    simplification when TFTP is used in a bootstrap program. It is OK to allow the
    timer to remain, and it may be helpful if the retransmitted ACK replaces one that
    was genuinely lost in the network. The sender still requires a retransmit timer,
    of course.


    # 4.2.3.2 Timeout Algorithms


    TFTP implementation MUST use an adaptive timeout.

    IMPLEMENTATION:

    TCP retransmission algorithms provide a useful base to work from. At least an
    exponential backoff of retransmission timeout is necessary.


    # 4.2.3.3 Extensions


    A variety of non-standard extensions have been made to TFTP, including additional
    transfer modes and a secure operation mode (with passwords). None of these have
    been standardized.


    # 4.2.3.4 Access Control


    A server TFTP implementation SHOULD include some configurable access control over
    what pathnames are allowed in TFTP operations.


    # 4.2.3.5 Broadcast Request


    A TFTP request directed to a broadcast address SHOULD be silently ignored.

    DISCUSSION:

    Due to the weak access control capability of TFTP, directed broadcasts of TFTP
    requests to random networks could create a significant security hole.'
