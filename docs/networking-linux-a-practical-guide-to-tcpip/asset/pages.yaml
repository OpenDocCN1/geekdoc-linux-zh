    # PPPoE Active Discovery Initiation


    The discovery stage begins with the client sending a PPPoE Active Discovery Initiation
    (PADI) packet. The Code field is set to 0x09. The Session ID is set to 0x0000.
    The PADI packet must carry a service name tag and carry no other tags.


    # PPPoE Active Discovery Offer


    Any access concentrators on the local network may respond with a PPPoE Active
    Discovery Offer (PADO) packet if it is capable of serving the request. In a PADO
    packet, the Code field is set to 0x09, and the Session ID is set to 0x0000.

    The PADO packet must carry a service nametag matching the one found in the PADI
    packet and an AC name tag containing its unique name. It may also contain any
    number of service name tags indicating services offered by the access concentrator.


    # PPPoE Active Discovery Request


    Having received one or more PPPoE packets, the client selects one and replies
    to it with a PPPoE Active Discovery Request (PADR) packet. The Code field is set
    to 0x19, and the Session ID is set to 0x0000. The PADR packet must contain a service
    name tag that indicates the service being requested by the client. It can also
    contain other tags.


    # PPPoE Active Discovery Session Confirmation


    The server responds to a PADR packet with a PPPoE Active Discovery Session-confirmation
    (PADS) packet. The Code field is set to 0x65, and the Session ID is set to a 2-byte
    value uniquely identifying this session.'
