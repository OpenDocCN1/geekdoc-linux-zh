  md: '# Layered Protocols: A Description and History


    In the beginning, custom written programs allowed one computer to talk to another¹.
    If you wanted to talk to a different computer, you had to write a new program
    to do so.


    This approach could not scale past a very few computers. A similar situation occurred
    in the early days of European trains. Individual regions built their own rail
    systems without trying to match track sizes (called gauges) with neighboring systems.
    If you wanted to ship cargo or travel between two regions, you had to stop at
    one or more regional boundaries and change trains because the one you were on
    couldn''t use the tracks for the new region.


    The first attempts to overcome this problem were proprietary protocols allowing
    computers from one manufacturer to talk to one another. None of these protocols
    are in wide use today, Unix-to-Unix Copy Program (UUCP) is similar in concept:
    a monolithic protocol that can be used only with another computer that understands
    UUCP. Fortunately, UUCP is widely available instead of being locked as a vendor-specific
    protocol. (Even fortunatelyCP is rarely used anymore and is implemented on top
    of TCP in most cases where it is used.)


    The next stage of the protocol evolution was the layered protocol. In this model,
    the protocol is broken into layers arranged in a stack (rather like dishes in
    a cupboard). Each of these layers is comprised of one or more protocols, an unfortunate
    duplication of terminology. Every layer is meant to pass information vertically
    within the stack. Non-TCP/IP examples of layered protocols include eXtensible
    Name Service (XNS, the ancestor of the Novell protocol stack) and System Network
    Architecture (SNA, the IBM communications protocol).


    Typically, layered protocols are discussed in terms of the OSI seven-layer model.
    Each layer is responsible for certain functions within the network (for example,
    the network layer addresses and routes packets, and the presentation layer encrypts
    and compresses data).


    These different layers (and potentially different protocols at each layer) can
    be thought of like a set of several different games. Some of the games use the
    same kinds of things (such as laminated cards). Of all the games use the same
    kind of deck (a standard 52-card deck, for example). Even using a standard deck
    make up a wide variety of games (for example, poker, gin rummy, and solitaire),
    and you can''t mix the rules between them.


    The data at any given layer is organized in much like the data at any other layer.
    A packet (a generic term for a blob of data at any layer) is composed of two parts,
    a header and a payload (or data), as shown in Figures 1.1 and 1.2.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '![](img/5b4988f59e82a39b3f220b0f1d3777dd_20_0.png)


    Figure 1.1 The basic organization of a packet.


    Each layer encapsulates those above it.


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_20_1.png)


    Figure 1.2 A packet encapsulating a higher-level packet.


    This process adds some overhead to the amount of data transferred,2 and this is
    one of the complaints against layered protocols. In light of the benefits, however,
    the cost seems minimal.


    The two big wins with this model are that it is easy to implement and extend.
    Implementing the protocol means that any hardware vendor can utilize a protocol
    stack so that its equipment can communicate with any other vendors'' equipment
    (assuming that the specifics of the protocol are open and that the other vendor
    has also implemented it). Extending a protocol means adding functionality to it.


    In the case of TCP/IP the protocol specifications are wide open, and Requests
    for Comments (RFCs), which are described later in this chapter, give precise details
    about the various protocols in the TCP/IP suite. Not only are the RFCs available,
    but several reference implementations also can be used by anybody wanting to do
    so.


    Extending TCP/IP by adding a new application-layer service typically requires
    only implementing a protocol at one layer of the model while making use of the
    existing layers for the rest of the work. For example, if you wanted to implement
    a protocol to allow all your networked hosts to exchange uptimes, you could rely
    on IP and the User Datagram Protocol (UDP) to deliver the data, and concentrate
    on how to format and use the information in the application-layer protocol that
    you develop.


    # TCP/IP


    TCP/IP was developed to provide a vendor-neutral protocol for the Department of
    Defense. The fact that it is now the lingua franca of the Internet speaks not
    only to its own design, but also to the benefits of layered protocols.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Chapter 1 Prelude to a Practical Guide


    TCP/IP breaks from the OSI model in that it has only four layers: a link layer,
    a network layer, a transport layer, and an application layer. Some authors add
    a fifth layer, the physical layer, beneath the link layer (see Figure 1.3). I
    think this is inappropriate, however, because the TCP/IP specifications don''t
    deal with the differences between physical-layer implementations of link-layer
    protocols (for example, there is no real difference in the way TCP/IP treats Ethernet
    frames from a 10BaseT source or a 100BaseTx source). I will provide a brief overview
    of physical-layer issues at the end of this chapter.


    | Application Layer |

    |---|

    | Transport Layer |

    | Internet Layer |

    | Link Layer |


    Figure 1.3 The TCP/IP protocol stack.


    We''ll talk about each of these in a lot more detail in the remainder of this
    section, but let''s run through them quickly right now. As can be expected, there
    are a number of minor variations and exceptions to the following descriptions.


    # Link Layer


    The link layer sits at the bottom of the stack. It is responsible for transmitting
    and receiving chunks of information (often called frames or packets). Examples
    of protocols at this layer are Ethernet and the Point-to-Point Protocol (PPP).


    # Network Layer


    The network layer sits above the link layer. It is responsible for routing and
    addressing chunks of data. At the Internet layer, these chunks are termed datagrams.
    For our purposes, the major protocol at this level is the Internet Protocol (IP).


    # Transport Layer


    The transport layer sits above the network layer. It is responsible for ensuring
    that data comes from and goes to the right processes on a host. Data is handled
    in units called segments (but sometimes also called datagrams³). TCP and UDP are
    the main protocols at this layer.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Application Layer


    The application layer sits at the top of the stack and is often implemented in
    user applications such as Telnet or Netscape. Data in the application layer is
    handled in units generally called messages. Many protocols (and associated programs)
    are part of this layer.


    # TCP/IP in Action: A Narrative


    To try to put all this (and everything that follows) into perspective, let''s
    watch some email being sent to a remote host. Be forearmed that this is a bit
    of an oversimplification, but it should provide all the meat we need for now.
    Although TCP/IP is often explained from the link layer up, I''ll turn things upside-down
    for this example and walk from the application layer down.


    For our example, I'' logged into cherry and will be sending an email to my wife
    on mango. (A diagram of the hosts and the network that connects them is shown
    in Figure 1.4.)


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_22_0.png)'
  merge: -1
