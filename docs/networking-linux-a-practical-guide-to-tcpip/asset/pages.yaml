  md: '# The Case Studies 13


    "I’ll get right on it, Tom," Eliza replies. Right now she could really use that
    baseline, but this gives her a good excuse to start working on it. It is already
    9:15, so she doesn’t have enough time to see things this morning, but she can
    take a first look. Throughout the rest of the day she’ll be able to watch the
    network under normal circumstances.


    # Step 1: Clearly Describe the Symptoms


    Tom has provided Eliza with a pretty good description: Internet connectivity is
    slow every morning until about 9:30. Further probing on Eliza’s part reveals that
    the slowness affects all services from all internal hosts.


    # Step 2: Understand the Environment


    This is where Eliza runs into her first real problem. Because this is her first
    day on the job, she doesn’t know the environment well enough to make any real
    judgments about the ways things are supposed to be. She has the tools to start
    looking at it, though, so she knows she can start with those. She also has a map
    of the network that she can look at to determine which hosts might be involved.


    While watching the network traffic, Eliza makes a discovery immediately. Most
    of the traffic is being passed between bigfun and patton. At 9:30, the traffic
    between these hosts dropped to almost nothing. Without a baseline to work from,
    this is probably the best information Eliza is going to get.


    # Step 3: List Your Hypotheses


    From her initial investigation, Eliza thinks that the problem is probably one
    of four things:


    +   - One or more applications running on bigfun and/or patton

    - A hardware problem on one of the boxes

    - A misconfiguration of either mango or the ISP’s router

    - A misconfiguration of the packet filter on mango


    # Step 4: Prioritize Your Hypotheses and Narrow Your Focus


    Because the problem occurred only during a specific time window, Eliza feels pretty
    certain that it is an application problem. If it were a router issue, the problem
    would most likely be exhibited throughout the day. A hardware problem would be
    unlikely to occur only within a specific time window.'
