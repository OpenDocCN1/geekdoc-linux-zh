    DISCUSSION:


    It is tempting to restrict the range of addresses accepted at the mail gateway
    to simplify the translation into addresses for the remote environment. This practice
    is based on the assumption that mail users have control over the addresses their
    mailers send to the mail gateway. In practice, users have little control over
    the addresses that are finally sent; their mailers are free to change addresses
    into RFC-822 format.


    The gateway MUST ensure that all header fields of a message that it forwards into
    the Internet meet the requirements for Internet mail. In particular, to satisfy
    "From:";To;\Cc", etc., fields must be transformed (if necessary) to satisfy RFC-822
    syntax, and they must be effective and useful for sending replies.


    The translation algorithm used to convert mail from the Internet protocols to
    another environment''s protocol SHOULD ensure that error messages from the foreign
    mail environment are delivered to the return path from the SMTP envelope, not
    to the sender listed in the "From:" field of the RFC-822 message.


    DISCUSSION:


    Internet lists usually place the address of the mail maintainer in the envelope
    and leave the original message header intact (with the "From:" containing the
    original sender). This yields the behavior recipient expects: a reply to the header
    gets sent to the original sender, not to a mail maintainer; however, errors get
    sent to the maintainer (who can fix the problem) and not the sender (who probably
    cannot).


    Similarly, when forwarding a message from another environment into the Internet,
    the gateway SHOULD set the envelope return path in accordance with an error message
    return address, if any, supplied by the foreign environment.


    # 5.3.8 Maximum Message Size


    Mailer software MUST be able to send and receive messages of at least 64K bytes
    in length (including header), and a much larger maximum size is highly desirable.


