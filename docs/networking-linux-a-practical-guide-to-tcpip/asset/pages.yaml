  md: '# Chapter 3 Network-Layer Protocols


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_67_0.png)


    Figure 3.6 IP fragmentation in a small network.


    The Token Ring network has an MTU of 4096, the Ethernet has an MTU of 1500, and
    the PPP connection has an MTU of 576.


    If an IP datagram of 4096 bytes is sent over the Token Ring from Dexter to Wally
    on the remote Ethernet, it will be fragmented into three new datagrams (each with
    the same ID number) as it passes through router 1 onto the local Ethernet. The
    first two datagrams are 1500 bytes long, and the third is 1156. Remember that
    each of them carries an IP header, so you''ve added 40 bytes (for the two new
    IP headers) plus padding to reach the required 8-byte word length added to the
    overhead of the initial datagram.


    As they move from the local Ethernet to the PPP link through router 2, each IP
    datagram is fragmented again. The first two datagrams fragment into three new
    datagrams each: 576, 576, and 388 bytes. The third datagram has now fragmented
    into three datagrams as well as: 576, 576, and 44 bytes. These nine datagrams
    account for an additional 160 bytes of IP header and some amount of padding.


    As the datagrams pass through router 3 onto the remote Ethernet, they are not
    reassembled. Reassembly of the initial datagram occurs only at the endpoint of
    the transmission.


    The additional bandwidth used by fragmented datagrams, as well as the CPU utilization
    required to fragment and reassemble the packets, make initial-path MTU discovery
    a desirable option.'
