    +   3. Although this seems confusing, it is actually an accurate way of speaking.
    TCP handles its data in segments, while UDP deals with datagrams. Please see Chapter
    7, “Before Things Break—Building a Baseline,” and Chapter 8, “In the Moment—Case
    Studies,” for more details.


    +   4. A cache is a table of data, normally kept in memory by operating the operating
    system to speed access to the information that it contains. In Linux, you can
    see the ARP cache itself by looking at /proc/arp.


    +   5. It is possible that a machine might receive an Ethernet packet destined
    for another host. Most commonly, this would be because the local host is acting
    as a gateway.'
