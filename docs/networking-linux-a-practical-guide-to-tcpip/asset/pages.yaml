    HTTP over SSL (HTTPS) is a secure extension to HTTP. It passes HTTP traffic through
    the Secure Socket Layer (SSL) to encrypt the traffic and provide some authentication
    of the end systems. HTTPS uses port 443 instead of the typical port 80 of HTTP.'
