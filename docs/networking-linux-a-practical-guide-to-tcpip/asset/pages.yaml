  md: '# TCP


    The Transmission Control Protocol (TCP), defined in RFC 793 and clarified in RFC
    1123, is more involved than UDP, but with the added cost of running TCP comes
    a larger feature set and greater reliability. The sessions provided by TCP are
    the cause of much of the overhead of the protocol, but they provide many of the
    benefits of TCP.

    Sessions provide a continuous connection between two processes, a mechanism for
    tracking the amount of data outstanding in a connection, a means for retransmitting
    lost data, and a for acknowledging packets that have been received. They provide
    a system of congestion control without the application needing to handle it. TCP
    also controls the size of packets being sent and maintains an orderly flow of
    packets back to the application, even though it may receive packets out of order
    (or duplicated packets) from the IP layer.


    # A Discussion of TCP


    In our discussion of TCP, we''ll cover the structure of the TCP header, session
    startup and shutdown, and T/TCP. Each of these subsections builds on the information
    presented in the ones before it, so you''ll want to read them straight through.


    # The Header


    A TCP header is comprised of the following fields: a 2-byte Source Port number,
    a 2-byte Destination Port number, a 4-byte sequence number, a 4-byte Acknowledgment
    number, a 4-bit Header Length, a 6-bit Reserved field, a 6-bit Flag set, a 2-byte
    Window Size, a 2-byte TCP Checksum, a 2-byte Urgent Data Pointer, and others.


    The Sequence number identifies the first byte of data included in this segment.
    The bytes in the TCP stream are not counted from zero; instead, they are counted
    from a fairly random point agreed on the TCP startup. (This process is defined
    in the next section, "Session Startup and Shutdown.")


    The Acknowledgment number is tied to the other end of the connection. It represents
    the next byte that is waiting for the other machine.


    The Header Length is 4 bytes used for the TCP header. The header is normally 20
    bytes long, giving a 4-bit value of 5. Options are often used in the TCP session
    startup. When options are present, the Header length is set to 6 (24 bytes), and
    an Option of 0x0204XXXX is set. The XXXX is a 2-byte number corresponding to the
    maximum segment size (MSS) allowed by the sending host. If this option is not
    used, the MSS is set to 536 (for a total of 576 bytes, after adding 20 for the
    standard IP and TCP headers). Some use of options to improve performance over
    long fat networks (LFNs). Other options include Noop 0x01 and the end-of-option
    List 0x00; each of these options is only 1 byte long.'
  merge: -1
  pgno: 74
- img_proc: true
  md: '# TCP over LFNs


    The capacity of a connection is the product of the bandwidth (in bits per second)
    and the round-trip time (in seconds). Because this number becomes quite large
    in modern WANs (excess of 320,000 bits, or 40,000 bytes for an OC3 between New
    York and California), the window size is no longer capable of effectively handling
    flow control. Two options are provided to help circumvent this problem.


    The first, called window scaling, changes the size of the TCP window from a 2-byte
    value to a 4-byte value by done shifting the window up to 14 bits. The window
    scale option is 0xXXX (where the X is the value of the bit shift to be done).
    Window scaling can be done only in the SYN and SYN-ACK packets of the TCP session
    startup.


    The second relies on the timestamp option (0x080AAAAASSRRRRR, where SSSSSS is
    the time stamp and RRRRRR is the timestamp reply), which helps avoid duplicate
    data putting in the wrong section of the buffer. Timestamping is used throughout
    the TCP session.


    Following the reserved bits are a series of 1-bit flags used by TCP:


    +   - URG—This segment contains urgent data.

    - ACK—The acknowledgment number contains a valid value.

    - PUSH—This requests faster handling of the packet.

    - RST—This requests the expedited shutdown of the remote process because the local
    process is going down or has gone down.

    - SYN—This sets the initial sequence number for the host. This bit is set only
    during the initial setup of the TCP session.

    - FIN—This flag requests that the connection is gracefully shut down.


    The ACK, and FIN bits are discussed in the next section, "Session Startup and
    Shutdown."


    The Window Size field is used in conjunction with the Acknowledgment number to
    provide flow control. It shows the amount of buffer space available on the sending
    host for incoming packets from this session, starting with the Acknowledgment
    number. It works as follows:


    After the session is set up (as described in the next section), cherry has an
    Acknowledgment number of 0x00000020 and a Window Size of 0x0040 (64 bytes). This
    is an abnormally small number, but it is used for the sake of example. mango sends
    a packet with 17 bytes of data and a second packet of 20 bytes. However, the first
    packet is lost on the way to cherry. When cherry sends its next packet, it still
    has an Acknowledgment number of 0x00000020 (because it hasn''t seen the first
    17 bytes of traffic from mango), and it decreases its Window Size to 0x002c.


    And mango sends a 10-byte packet to cherry, which responds with an acknowledgment
    number of 0x00000020 and a Window Size of 0x0022. mango sends its first packet,
    and cherry replies with an Acknowledgment number of 0x00000046 (reflecting all
    the data that it has received) and a Window Size of 0x0040 (its full buffer is
    available again).


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_75_0.png)'
