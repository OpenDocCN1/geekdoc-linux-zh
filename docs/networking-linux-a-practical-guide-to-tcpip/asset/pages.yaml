- img_proc: true
  md: 'mon 169


    mon itself is an engine that schedules tests based on your configuration and passes
    the results of the test to appropriate alerting programs. This separation of functionality
    from mon enables you to make seamless changes to your monitoring system. All you
    need to do is add a new test or alert program and modify your configuration. No
    changes to mon itself are needed (short of a kill -HUP to reread the config file).


    In this section, we''ll discuss getting and installing mon, configuring it, using
    it to monitor your network, and writing tests for it.


    # Getting and Installing mon


    You can download mon from ftp.kernel.org at /pub/software/admin/mon/mon/ (the
    kernel .org members ask that you use one of the kernel.org mirrors). Version 0.38.20
    is current as of this writing. In addition to mon, you''ll also need to grab some
    Perl modules: Time::Period, Time::HiRes, Convert::BER, and Mon::*. Some additional
    modules are required for the test and alert scripts (for instance, telnet.monitor
    requires Net::Telnet. Make sure you install Net::Telnet). The fping.monitor script
    relies on the fping package that is also available from the same place you got
    mon.


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_186_0.png)


    # Download and Install First!


    Please make sure that you download and install the required packages before starting
    in mon. Installing Perl modules is a bit beyond the scope of this book, but building
    fping requires a bit of hackery you''ll need to know about. Line 222 of fping.c
    contains a redeclaration of sys_errlist, so you should comment out the entire
    line. Failure to do so will cause the compilation to fail.


    mon itself is a set of Perl scripts and configuration files, so you don''t actually
    need to build it. Instead, you should configure it for local use (see the next
    section for details) and then test it. After it is configured properly, you can
    move it to its final location and set up a startup script in /etc/rc.d/init.d.


    # Configuring mon


    You''ll need to set up a mon.cf file representing your network. Example 10.5 contains
    a simple file representing a network with two monitored hosts. cherry is a Web
    Server and a workstation. I usually check workstations every sure that I can Telnet
    into them; I check Web servers every 5 minutes to ensure that they''re serving
    up pages.'
  merge: -1
