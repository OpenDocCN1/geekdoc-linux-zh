  md: '# Chapter 1 Prelude to a Practical Guide


    # Explanation of Terms


    There are two independent categorizations of protocols. The first is the maturity
    level or state of standardization, one of standard, draft standard, proposed standard,
    experimental, informational, or historic. The second is the requirement level
    or status of this protocol, one of required, recommended, elective, limited use,
    or not recommended.


    The status or requirement level is difficult to portray in a one-word label. These
    status labels should be considered only as an indication, and a further description,
    or applicability statement, should be consulted.


    When a protocol is advanced to proposed standard or draft standard, it is labeled
    with a current status.


    # What Is a "System"?


    Some protocols are particular to hosts, and some are particular to gateways; a
    few protocols are used in both. The definitions of the terms will refer to a "system"
    that is either a host or a gateway (or both). It should be clear from the context
    of the particular protocol which types of systems are intended.


    # 4.1 Definitions of Protocol State


    Every protocol in this document is assigned to a maturity level or state of standardization:
    standard, draft standard, proposed standard, experimental, or historic.


    +   **4.1.1 Standard protocol**–The IESG has established this as an official standard
    protocol for the Internet. These protocols are assigned STD numbers (RFC 1311).
    These are separated into two groups: IP protocol and above, protocols that apply
    to the whole Internet; and network-specific protocols, general specifications
    of how to do IP on particular types of networks.


    +   **4.1.2 Draft standard protocol**–The IESG is actively considering this protocol
    as a possible draft protocol. Substantial and widespread testing and comment are
    desired. Comments and test results should be submitted to the IESG. There is a
    possibility that changes will be made in a draft protocol before it becomes a
    standard protocol.


    +   **4.1.3 Proposed standard protocol**–These are protocol proposals that may
    be considered by the IESG for standardization in the future. Implementation and
    testing by several groups is desirable. Revision of the protocol specification
    is likely.


    +   **4.1.4 Experimental protocol**–A system should not implement an experimental
    protocol unless it is participating in the experiment and has coordinated its
    use of the protocol with the developer of the protocol.'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'Typically, experimental protocols are those that are developed as part of an
    ongoing research project not related to an operational service offering. Although
    they may be proposed as a service protocol at a later stage, and thus become proposed
    standard, draft standard, and then standard protocols, the designation of a protocol
    as experimental sometimes meant to suggest that the protocol, although mature,
    is not intended for operational use.


    +   * Informational protocol—Protocols developed by other standard organizations
    or vendors, or those for other reasons are outside the purview of the IESG, may
    be published as RFCs for the convenience of the Internet community as informational
    protocols.


    +   * Historic protocol—These are protocols that are unlikely to ever become standards
    in the Internet either they have been superseded by later developments or because
    of lack of interest.


    +   * Definitions of protocol status—This document lists a "requirement level"
    or status for each protocol. The status is one of "required,"recommended,"elective,"limited
    use," or "not recommended."


    +   * Required protocol—A system must implement the required protocols.


    +   * Elective protocol—A system may or may not implement an elective protocol.
    The general notion is that if you are going to do something like this, you must
    do exactly this. There may be several elective protocols in a general area—for
    example, there are several electronic mail protocols and several routing protocols.


    +   * Limited-use protocol—These protocols are for use in limited circumstances.
    This may be because of their experimental state, specialized nature, limited functionality,
    or historic state.


    +   * Not recommended protocol—These protocols are not recommended for general
    use. This may be because of their limited functionality, specialized nature, or
    experimental or historic state.


    # TCP/IP and Linux


    TCP/IP, UNIX, and the Internet are deeply intertwined; with our additional emphasis
    on Linux, this might seem more like codependence. In fact, the TCP/IP protocols
    have been implemented on many different platforms and function as a sort of glue
    binding them together on the Net. This is not to say that some vendors don''t
    adopt the protocol by implementing proprietary (and occasionally noninteroperable)
    extensions to the standards. In the long term, this sort of behavior can be quite
    disruptive.'
  merge: -1
