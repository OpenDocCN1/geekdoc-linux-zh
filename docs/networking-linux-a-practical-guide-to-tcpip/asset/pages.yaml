  md: 'A number of host system code. During the loading phase, an appropriate file
    transfer protocol is used to copy the system code across the network from the
    boot server. A host with a disk may perform the first step, dynamic configuration.
    This is important for microcomputers, where floppy disks allow network configuration
    information to be mistakenly duplicated on more than one host. Also, installation
    of new hosts is much simpler if they automatically obtain their configuration
    information from a central server, saving administrator time and decreasing the
    probability of mistakes.


    # 6.2.2 REQUIREMENTS


    # 6.2.2.1 Dynamic Configuration


    A number of protocol provisions have been made for dynamic configuration.


    +   - ICMP Information Request/Reply messages—This obsolete message pair was designed
    to allow a host to find the number of the network it is on. Unfortunately, it
    was useful if only the host knew the number part of its IP address, information
    that hosts dynamic configuration seldom had.


    +   - Reverse Address Resolution Protocol (RARP) [BOOT:4]—RARP is a layer protocol
    for a broadcast medium allows a host to find its IP address given its link layer.
    Unfortunately, RARP does not work across IP gateways and therefore requires a
    RARP server on every network. In addition, RARP does not provide any other configuration
    information.


    +   - ICMP Address Request/Reply messages—This ICMP messages allow a host to learn
    the address mask for a particular network interface.


    +   - BOOT Protocol [BOOT:2]—This protocol allows a host to determine the IP addresses
    of the local host and the boot server, the name of an appropriate boot file, and
    optionally the address mask and list of default gateways. To locate a BOOTP server,
    the host broadcasts a BOOTP request using UDP. And host gateways, and in the future
    the IP Multicasting facility will provide a standard mechanism for this purpose.


    DISCUSION:

    The suggested approach to dynamic configuration is to use the BOOTP protocol with
    the extensions defined in "BOOTP Vendor Extensions" RFC-1084 [BOOT:3], RFC-1084
    defines some important general (not vendor-specific) extensions. In particular,
    these extensions allow the address mask to be supplied in BOOTP; we RECOMMEND
    that the address mask be supplied in this manner.


    Historically, subnetting before long IP, and a separate mechanism (ICMP Address
    Mask messages) was designed to supply the address mask to a host. However, the
    IP address mask and the corresponding IP address conceptually form a pair, and
    for operational simplicity they ought be deployed at the same time and by the
    same mechanism, whether a configuration file or a dynamic mechanism like BOOTP.

    Note that BOOTP is not sufficiently general to specify the configurations of all'
