    # Nessus


    Nessus is a port-scanning vulnerability scanner. Nessus provides a scripting language
    to write additional tests. This section will provide an overview of Nessus, discuss
    obtaining and installing it, and provide an introduction to its use.


    Nessus was written by Renaud Deirison <renaud@nessus.org>, with a number of other
    contributors. It is available from www.nessus.org.


    Nessus is a client-server pair of applications. Nessus is the server. It runs
    as a daemon and is responsible for conducting all the tests. Nessus is a GTK+-based
    client application. It is responsible for providing the user with a convenient
    user interface.


    Nessus begins scanning a host by conducting a port scan to see what avenues are
    available for attack. It relies on nmap for functionality.When ports it can look
    at, Nessus scans for known vulnerabilities. It uses plugins written in C or in
    the Nessus Attack Scripting Language (NASL) to carry out these tests. (Writing
    scripts in NASL is briefly covered later in this section.)


    # Getting and Installing Nessus


    There are two major steps involved in getting Nessus to run on your system. First,
    you must obtain and build the software. After the software has been built, it
    needs to be installed and set up. This section covers both steps.


    # Getting and Building Nessus


    Nessus is not hard to build, but there are four packages that you must download
    and build in the proper order:


    +   - Nessus-libraries

    - libnsl

    - Nessus-core

    - Nessus-plugins


    Each of these packages follows the typical configure, make, make install pattern
    of building free software. Make sure you build and install the packages in the
    proper order and you will save yourself a good bit of grief.'
  merge: -1
  pgno: 198
