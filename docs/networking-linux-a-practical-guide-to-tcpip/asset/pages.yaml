  md: "information in those areas where specifications are still evolving.\nThis introductory\
    \ section begins with a brief overview of the Internet architecture as it relates\
    \ to hosts, and then gives some general advice to host software vendors. Finally,\
    \ there is some guidance on reading the rest of the document and some terminology.\n\
    \n# 1.1 The Internet Architecture\n\nGeneral background and discussion on the\
    \ Internet architecture and supporting protocol suite can be found in the DDN\
    \ Protocol Handbook [INTRO:3]; for background see for example [INTRO:9], [INTRO:10],\
    \ and [INTRO:11].Reference [INTRO:5] describes the procedure for obtaining Internet\
    \ protocol documents, while [INTRO:6] contains a list of the numbers assigned\
    \ within Internet protocols.\n\n# 1.1.1 Internet Hosts\n\nA host computer, or\
    \ simply “host,” is the ultimate consumer of communication services. A host generally\
    \ executes application programs on behalf of user(s), employing network and/or\
    \ Internet communication services in support of this function.\n Internet host\
    \ connects to the concept of an “End-System” which is used in the OSI protocol\
    \ suite [INTRO:13].\n Internet communication system consists of interconnected\
    \ packet networks supporting communication among hosts using the Internet protocols.\
    \ The networks are interconnected using packet-switching computers called “gateways”\
    \ or “IP routers” with the Internet community, and “Intermediate Systems” with\
    \ the OSI world [INTRO:13]. The RFC “Requirements for Internet Gateways” [INTRO:2]\
    \ contains the official specifications for Internet gateways. That RFC connects\
    \ with the present document and its companion [INTRO:1] define the rules for the\
    \ realization of the Internet architecture.\n Internet hosts span a range of size,\
    \ speed, and function. They range in size from small microprocessors through workstations\
    \ to mainframes and supercomputers. In function, they range from single-purpose\
    \ hosts (such as terminal) to full-service hosts that A host is multihomed if\
    \ it has more than one interface to the same or to different networks. See Section\
    \ 1.3.3 on “Terminology”.\n\n# 1.1.2 Architectural Assumptions\n\nThe current\
    \ Internet architecture is based on a set of assumptions about the communication\
    \ system. The assumptions most relevant to hosts are as follows:\n\n+   - The\
    \ Internet is a network of networks—Each host is directly connected to some particular\
    \ network(s); its connection to the Internet is only conceptual. Two hosts on\
    \ the same network communicate with each other using the same set of protocols\
    \ that they would use to communicate with hosts on distant networks."
  merge: -1
  pgno: 229
- img_proc: true
  md: '+   Gateways do not keep connection state information—To improve robustness
    of the communication system, gateways are designed to be stateless, forwarding
    each IP datagram independently of other datagrams. As a result, redundant paths
    can be exploited to provide robust service in spite of failures of intervening
    gateways and networks. All state information required for end-to-end flow control
    and reliability is implemented in the hosts, in the transport layer or in application
    programs. All connection control information is co-located with the end points
    of communication, so it will be lost only if an end point fails.


    +   Routing complexity should be in the gateways—Routing is a complex and difficult
    problem, and ought to be performed by the gateways, not the hosts. An important
    objective is to isolate host software from changes caused by the inevitable evolution
    of the Internet routing architecture.


    +   The system must tolerate wide network variation—A basic objective of the Internet
    is to tolerate a wide range of network characteristics—e.g., bandwidth, delay,
    packet loss, packet reordering, and maximum packet size. Another objective is
    robustness against failure of individual networks, gateways, and hosts, whose
    bandwidth is still available. Finally, the goal is "open system": an Internet
    host must be able to operate robustly and effectively with any other Internet
    host, across diverse Internet paths. Sometimes host implementers have designed
    for less ambitious goals. For example, the LAN environment is typically much more
    benign than the Internet as a whole; LANs have low packet loss and delay and do
    not reorder packets. Some vendors have fielded host implementations... LANs seldom
    stay isolated for long; they are soon gatewayed to each other, to organization-wide
    networks, and eventually to the global Internet system. In the end, neither the
    customer nor the vendor is served by incomplete or sub-standard Internet host
    software. The requirements spelt out in this document are designed for a full-function
    Internet host, capable of full operation over an arbitrary Internet path.


    # 1.1.3 Internet Protocol Suite


    To communicate with the Internet system, a host must implement the layered set
    of protocols comprising the Internet protocol suite. A host typically must implement
    at least one protocol from each layer.'
