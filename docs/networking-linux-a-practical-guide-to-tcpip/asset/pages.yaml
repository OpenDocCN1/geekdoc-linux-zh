  md: '# 44 Chapter 3 Network-Layer Protocols


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_61_0.png)


    Figure 3.4 A small meshed network.


    In this internet, the 192.168.0.0/24 network can send traffic to the 192.168.5.0/24
    network through either the 192.168.2.0/24 network or the 192.168.3.0/24 network
    (all the traffic will flow through the 192.168.1.0/24 network, though). Traffic
    will normally flow along this path:


    +   - 192.168.0.0/24

    - 192.168.1.0/24 to

    - 192.168.2.0/24 to

    - 192.168.5.0/24


    Traffic routed through the 192.168.3.0/24 network would require an extra hop as
    it passes through the 192.168.4.0/24 network. This extra hop is reflected in the
    routing table entries passed between the routers.


    If the connection between 192.168.1.0/24 and 192.168.2.0/24 went down for some
    reason, the routing tables would be updated to show that the new best path as
    follows:


    +   - 192.168.0.0/24 to

    - 192.168.1.0/24 to

    - 192.168.3.0/24 to

    - 192.168.4.0/24 to

    - 192.168.5.0/24


    Although this is longer than the old path, it still works and is thus promoted
    to the best path. When the link between 192.168.1.0/24 and 192.168.2.0/24 recovers,
    the routing table will revert to the shorter path through the 192.168.2.0/24 network.'
