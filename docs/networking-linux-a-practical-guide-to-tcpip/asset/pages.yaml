    # Writing Tests for mon


    I''ve written a sample test to check for fewer daemons that aren''t running. Although
    this approach isn''t useful for real life, it could serve as a model for writing
    your own tests. Example 10.6 contains a list of the program:


    Example 10.6 A mon Test

    !/usr/bin/perl -w


    ```

    use strict;


    use Net::Telnet;


    my (@failures, @01);

    my $debug = 0;

    ```


