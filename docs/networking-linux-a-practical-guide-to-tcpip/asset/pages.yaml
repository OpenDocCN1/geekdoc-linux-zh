  md: '# The Loopback Interface


    The loopback interface is a logical device provided by most IP protocol stacks.
    It uses the Class A network 127 and normally is assigned the address 127.0.0.1
    and the name localhost. On a Linux host, the lo interface is used for loopback,
    as shown here:


    ```

    [root@cherry /]# ifconfig lo

    lo Link encap:Loopback

    inet addr:127.0.0.1 Mask:255.0.0.0

    UP BACKUP RUNNING MTU:3924 Metric:1

    RX packets:18 errors:0 dropped:0 overruns:0 frame:0

    TX packets:18 errors:0 dropped:0 overruns:0 carrier:0

    collisions:0 txqueuel:0

    ```


    Traffic sent to the loopback address never appears on any attached networks. A
    special aspect of this interface is that traffic sent from a host to itself will
    be redirected to the loopback address.


    The loopback interface is commonly used to make network connections between client/server-based
    applications hosted on the same machine (such as the X11 windowing system). This
    helps keep traffic off the local network and even allows applications to work
    in the absence of a physical network.


    Figure 2.9 shows a loopback interface with a PPP and an Ethernet interface. The
    logical flow of traffic to and from the IP layer is shown by the arrows in the
    diagram.


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_44_0.png)


    Figure 2.9 Diagram of the loopback interface.'
