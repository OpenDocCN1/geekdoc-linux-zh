  md: '![](img/5b4988f59e82a39b3f220b0f1d3777dd_116_0.png)


    # 6


    # A Problem-Solving Pattern


    THIS CHAPTER IS DEVOTED TO BUILDING a problem-solving pattern for you. It will
    be of benefit only with a solid grasp of the fundamentals of networking presented
    in the previous chapters. Whatever other tools you use in troubleshooting network
    issues, it will be your knowledge and ability to use the tools that will enable
    you to solve the problem. You are the most important tool.


    Now that you know how TCP/IP is supposed to work, you will be able to quickly
    identify things that are not running properly. Coupled with a plan, or pattern,
    for troubleshooting, your knowledge will steer you through the often murky waters
    of network problems.


    Troubleshooting Pattern Is Helpful Whether or Not You''re Familiar with the Technology

    at one point, I was doing some volunteer work cataloging documents. The local
    network was acting up, so I decided to take a look at it. It was a Novell-based
    network (a technology that I was—and still am—not very familiar with), but I was
    able to follow the troubleshooting pattern presented in this chapter to narrow
    the problem to a misbehaving file server.'
  merge: -1
  pgno: 116
- img_proc: true
  md: 'A pattern is just that: It is not a firm set of rules; it’s a set of guidelines.
    If you follow a troubleshooting method consistently, it will help you to find
    solutions easily. You will be able to zero in on the root cause of the issue and
    quickly resolve it. One nice thing about this pattern is that it is neither nor
    TCP/IP-specific. You can apply it to a variety of problems. (I make no promises
    about in-law problems, though.)


    To try to set this pattern into context, each step of the pattern is described
    in its own section. Each section contains a short example at the beginning, as
    well as part of a continuing example that runs through each section. A true story
    showing both the problem with not using a pattern like this one and the benefit
    of using one comes at the end of the chapter. Later, in Chapter 8, "In The Moment—Case
    Studies," I’ll point out the pattern in each case study. Nine steps are involved
    in the pattern, as shown in Figure 6.1.


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_117_0.png)


    **Figure 6.1** A nine-step problem-solving pattern.'
  merge: -1
