    Server implementations that fail to strictly follow the reply rules often cause
    FTP programs to hang. Note that RFC-959 resolved ambiguities in the reply found
    in earlier FTP specifications and must be followed.


    It is important to choose FTP reply codes that properly distinguish between temporary
    and permanent failures, to allow the successful use of file transfer clients.
    These programs depend on the reply codes to decide whether or not to retry a failed
    transfer; using a permanent failure code (5xx) for a temporary error will cause
    these programs to give up unnecessarily.


    When the meaning of a reply matches the text shown in RFC-959, uniformity will
    be enhanced by using the RFC-959 text verbatim. However, a Server-FTP implementor
    is encouraged to choose reply text that conveys system-dependent intent, when
    appropriate.'
