- img_proc: true
  md: '# Chapter 6 A Problem-Solving Pattern


    There is no good rule to determine when a problem is clearly stated. This is fairly
    objective. If you think it''s clear enough, it probably is. If you''re not sure,
    try to describe the problem to someone else. (It really doesn''t matter that person
    understands networking. In fact you could try explaining it to a house plant;
    it''s the process of talking through the problem while describing the symptoms
    that help clarify things for you.)


    As you''re talking with users about the problem, see if there are other hosts
    with the same symptoms. If users haven''t seen this problem, ask them to reproduce
    it. If there isn''t anyone else available, try to reproduce yourself. Knowing
    whether this problem affects a single host, a local group of hosts, or all the
    hosts on a network will help you when you hit Step 2.


    Some questions that you should know the answers to are listed here:


    +   - What applications or protocols are affected?

    - What hosts are involved?

    - What is common between affected hosts?

    - When did the problem start?

    - Is this a constant problem?

    - If the problem is not constant, does it occur at a regular time or interval?


    To illustrate further, let''s look at three pairs of problem descriptions. The
    first description in each pair is an inadequate description; the second provides
    enough information to start solving the problem.


    +   **Inadequate**—“Whenever I make a connection to the Internet, things seem
    slow."

    - **Better**—“When I try connecting to external Web sites in the morning, my connection
    seems slow. I''ve tried at other times, and it doesn''t seem so bad. I try connecting
    to our internal Web server, everything seems fine, in the the morning."

    - **Inadequate**—“I can''t use email."

    - **Better**—“I''m receiving email from our mail host, but when I try to send
    something, it normally fails. Mail addressed to people inside the company works,
    but not mail addressed to external addresses."

    - **Inadequate**—“The network is really slow."

    - **Better**—“My NFS-mounted partitions really seem bogged down, especially at
    the beginning of the day. ssh, ping, and Web connections all seem to run at the
    normal speed, though."


    It isn''t easy to turn an inadequate description of a problem into something that
    you can work from. As you read each pair of descriptions, did you think about
    which questions you could ask to clarify the situation? Which questions would
    you need to ask a user to help that person describe the problem?'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# Example 6.1: An ssh Example Using Step 1


    As a running example in this chapter, let''s take a look at one problem specifically.
    You''re a network administrator for a small business, Frobnitz R Us (FRU). A user
    calls you and complains, "I can''t use ssh."


    If you were confronted with the first description, you might ask the user, "Have
    you ever been able to connect to that host? Does anyone else have the same problem?
    Is it that host, or are there other hosts affected?" The answers to these questions
    would help you lead to a better description, such as this:


    "Well, yesterday, I could ssh to our Web server and to external hosts. Today I
    can''t get to our Web server. I can still connect to external hosts, though. I
    asked some other people, and they have the same problem"


    # Step 2: Understand the Environment


    When you have a clear description of the symptoms, you must be able to understand
    the environment that the problem occurs in to effectively troubleshoot it. Gaining
    this understanding is really a twofold job: It requires identifying the pieces
    involved in the problem and understanding how those pieces should act when they
    are not experiencing the problem.


    # A Problem-Solving Experience


    Many years ago, I was trying to solve a sendmail problem on a host I was responsible
    for. At that time, sendmail had two configuration files, the sendmail.cf (the
    obvious one) and the sendmail.fc (the less obvious one). The sendmail.fc was actually
    the "frozen" version of the sendmail.cf. At that point in my career, I wasn''t
    aware of the distinction.


    I had made a change to the sendmail.cf, but I never "froze" it. When the anticipated
    behavioral change didn''t occur, I started troubleshooting. It took too longer
    than I want to figure out what was going on.


    The first task typically means creating a subset of your network map, showing
    the portions of the network that are involved in the problem. Sometimes this new
    map will be a logical map, and sometimes you will need to draw it out.


    The second task, understanding how things should be behaving, is much easier if
    you look at a snapshot of how your network acted before the problem occurred.
    These snapshots are called baselines and are covered in more detail in the next
    chapter. In the absence of a baseline, you will need to create a model of the
    proper behavior of the network from your understanding of its layout, and configuration.


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_120_0.png)'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# Example 6.2: An ssh Example Using Step 2


    Figure 6.2 contains the network map used to troubleshoot the ssh problem given
    as an example in Step 1. This map shows the following components:


    +   * Hosts on an internal network, connected via a switch

    * Hosts on the other internal network, connected via a switch

    * A router connecting the two internal networks

    * A packet-filtering router connecting the internal, external, and protected networks

    * Hosts on the protected network, interconnected via a switch

    * The Internet

    * A sample host on the Internet


    After you''ve looked over your map of FRU''s network, you''ll need to isolate
    those systems involved in the problem.


    The systems involved in the ssh problem are highlighted in gray in Figure 6.3.
    Notice that the internal router and the second internal switch are not highlighted,
    nor are the Internet and connected hosts.


    We built the map in Figure 6.3 by comparing the hosts and networks with the problem
    description. Because all the internal hosts were affected, we know that the internal
    router is not at fault (not all the internal systems use the router to reach the
    Web server). Likewise, the second internal switch can be excluded. The problem
    does not affect traffic bound for arbitrary hosts on the Internet, so both the
    token Internet connect host and the Internet itself can be excluded.


    By the time we reach the second task of this step, we know that only the following
    hosts are involved:


    +   * Internal hosts, which should be capable of using ssh to connect to the Web
    server

    * The first internal switch, which shouldn''t be doing any packet filtering and
    should have a fairly light load

    * The packet filtering router, which should allow ssh connections from any internal
    host to any external host or any protected host

    * The protected LAN, which shouldn''t be doing any packet filtering and should
    have a very light load

    * The company Web server, which should allow ssh connections from any internal
    hosts'
