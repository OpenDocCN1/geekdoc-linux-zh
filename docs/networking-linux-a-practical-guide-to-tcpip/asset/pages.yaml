  md: '# Step 3: List Hypotheses


    Having made a list of the affected systems (Step 2), we can begin to list potential
    causes of the problem. It''s safe to brainstorm at this stage because we will
    be narrowing our search later. In fact, it is better to be overly creative here
    and end up with extra hypotheses than to miss the actual cause and chase blind
    leads.


    # Be Thorough When Listing Hypotheses


    Some time ago, I was called in to help troubleshoot a networking problem at a
    library. The library was on a campus and was already part of a working LAN. When
    the Library Application Server was brought up, it could not talk to the other
    hosts on the LAN.


    My initial thought was that it was one of three things:


    +   - A bad 10BASE-2 connection

    - A bad NIC

    - A bad transceiver¹


    I first asked about lights on the back of the host. Sure enough, all lights were
    accounted for. I asked the same question about the transceiver and got the same
    answer. If I logged into the server and ran netstat, I could see Ethernet packets
    coming in. The machine just didn''t seem to make sense of them.


    I asked the network technician from the school to check the same thing on the
    local router. Sure enough, there were packets arriving from the library''s server.
    They weren''t being handled.


    He said that the only time he''d seen something like this was when the new Novel
    server had problems on another LAN at the school. Back then, Novel ran on 802.3
    networks, not Ethernet II.


    The library''s server was running AIX, which allowed you to define an interface
    either 802.3 or Ethernet II. Sure enough, it had been configured to run in 802.3.
    A quick configuration change later, and the server could see the rest of the network.


    I allowed myself to stop listing hypotheses after I had covered the first possibility,
    a physical problem. If I spent a little more time working on a good list of possible
    causes, I might have saved myself (and everyone else) a bit of frustration.


    Just like the maps of the problem environment, your list of hypotheses doesn''t
    need to be anything formal. A mental list is normally fine; scrawled on a piece
    of paper is even better. Sometimes, you''ll want a formal document; big network
    issues affecting lots of people cry out for formal documents (at least the managers
    involved cry a lot).'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# Step 4: Prioritize Hypotheses and Narrow Focus 107


    # Example 6.3: An ssh Example Using Step 3


    Some of the causes of our ssh problem are listed here (in no particular order):


    +   - It could be an ssh configuration problem.

    - It could be an ssh configuration problem.

    - It could be a switch configuration problem on the internal network switch.

    - It could be a switch configuration problem on the protected network switch.

    - It could be a problem with the filtering rules on the packet-filtering router.


    # Step 4: Prioritize Hypotheses and Narrow Focus


    This is where we stop making work for ourselves and start making our jobs easier.
    Although we''ve just made a list of things that could be the problem, we don''t
    want to research every item on the list if we don''t have. Instead, we can prioritize
    the potential causes and chase down the most likely ones first. Eventually, we''ll
    either solve the problem or run out of possible causes (in which case we need
    to go back to Step 3).


    Prioritizing Potential Problems

    While I was trying to down the source of dropped connections at a remote site,
    I was able to come up with the following list of possible problems:


    +   - There could be a problem on the server that all the terminals were connecting
    to, which has shown only on the affected terminals so far.

    - All affected terminal servers could be misconfigured, although the unaffected
    terminal servers were properly configured.

    - There could be a wiring problem that affected only some of the terminals in
    the system.

    - There could be a common environmental problem among the affected terminals.


    We were able to push the first possibility to the bottom of the list because it
    was rather unlikely. The last possibility also seemed to be too contrived to be
    the problem. This left the two possibilities in the middle of our list as equally
    likely in our eyes. We decided to start looking at the third option because it
    was the easiest to check.


    As you''re prioritizing your list, pay particular attention to recent changes.
    These are often the source of your problems. Changes meant to improve the environment
    often have unintended consequences.'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# Chapter 6 A Problem-Solving Pattern


    # Example 6.4: An ssh Example Using Step 4


    To continue the ssh example, I''ve prioritized the list of possible causes:


    +   1. Last night''s changes on the packet filter

    2. A configuration problem on the Web server

    3. A configuration problem on the highlighted internal switch

    4. A configuration problem on the protected network switch

    5. A configuration problem on the internal PCs


    We know the problem started today, so it''s most likely part of the changes from
    last night. The next most likely assumption is that it was a change on the Web
    server itself because host is the only one in common with all the failing ssh
    connections. One of the two highlighted switches is possible, but because they
    aren''t supposed to be doing any packet filtering, we''ll count them toward the
    bottom of the priority pile. Finally, it could be a new problem on all the internal
    PCs, although this is a pretty big stretch.


    # Step 5: Create a Plan of Attack


    Now that you''ve identified the most likely causes of the problem, it''s time
    to disprove each of the possible causes in turn. As each of the potential cause
    is eliminated, we narrow your search further. Eventually you will reach a problem
    that you can''t disprove, and your most recent attempt will have corrected the
    problem.


    # Narrowing Down Potential Causes of Problems with Testing


    Recently, I worked with another system administrator on a remote console server
    (RCS), a system that provided console access to several hosts at a remote location.
    For some reason, the console software wasn''t operating correctly. We decided
    that the possible causes of software problems were these (from most likely to
    least likely):


    +   * The physical connections between the RCS box and the other hosts could have
    been mangled as the boxes were physically installed.

    * The TTY devices could have been installed incorrectly.

    * The software could have been installed incorrectly.

    * The software could have been misconfigured.


    We decided to first test the physical connection. The best way to do this was
    to use a different software package (one that would use the same hardware) to
    make a serial connection to a remote host. If that worked, we would know that
    the physical connections were not the problem and would be able to focus on other
    things. (This test actually would help eliminate our second cause for suspicion
    because the TTY device would have to be correctly installed for our test to succeed.)'
  merge: -1
  pgno: 125
- img_proc: true
  md: '# Step 6: Act on Your Plan


    One thing you don''t want to do is make changes in many areas at once. Making
    one change at a time, working on only one component per change, ensures that you''ll
    be able to identify the modifications that actually fixed the problem.


    You don''t need a hard and fast path for the follow-up steps to take if a test
    doesn''t solve or identify the problem. However, you should at least think about
    where you''re going to next. Your prioritized list will be of great help as you
    make plans for the future. Do won''t be surprised if your plans take a slight
    detour, though; crystal balls are notoriously vague.


    A final step in preparing your plan is to review it with those holding a stake
    in solving the problem. This probably includes management, the customer suffering
    the problem, and anyone working with you in troubleshooting.


    # Example 6.5: An ssh Example Using Step 5


    When creating a plan for our ssh, we''ll want to focus on the changes made to
    the packet filter last night. A simple first plan will be back out the changes
    made last night. If this restores ssh connectivity, you''ll have to rewrite and
    reinstall the changes to restore the new functionality without blocking ssh. If
    that doesn''t work, it will be time to look at any packet-filtering rules that
    you will find on the switches.


    # Step 6: Act on Your Plan


    With a plan in place—and reviewed by those with a stake in solving the problem—you''re
    prepared to act.


    # Troubleshooting Difficulties


    While involved in a long troubleshooting sequence on a server, our group brought
    in the hardware vendor, the software vendor, and our own experts. The problem
    seemed to indicate a hardware problem, but there were some anomalies. We decided
    to run a prolonged stress test on the hardware with a clean OS install (on separate
    disks installed for just the test).


    We started the exerciser and left it to run through the middle of the night. About
    two hours later, the system died with the same symptoms we had been seeing. Unfortunately,
    the night operator (who hadn''t been briefed in our plan) caught the failure and
    restarted the test suite. He did this without taking any notes about what had
    happened or informing any of the experts involved in the test.


    The next day, when we found out what had happened, we were in a quandary. The
    system had failed, which seemed to indicate a hardware problem, but there were
    no details recorded that could have identified which component had failed.'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# Chapter 6: A Problem-Solving Pattern


    While you''re acting on the plan, take good notes and make sure that you keep
    copies of configuration files that you are changing. Nothing is worse than finishing
    off a series of tests, finding that they didn''t solve the problem, and discovering
    that you introduced a new problem and can''t easily back out your changes. It
    can also be disheartening to have insufficient or misleading information to report
    at the conclusion of your test.


    # Example 6.6: An ssh Example Using Step 6


    In our ssh example, we''ll grab a copy of the most recent packet-filtering rules
    from the router. Just to be picky, we''ll also grab them from the CVS repository
    where they''re stored. Comparing the two copies (with the diff command), we find
    they''re the same. Reading the file however, we find a problem. The rule that''s
    supposed to stop all traffic is applied to the internal interface, not the external
    interface. Ouch! This means that anyone on the Internet can start an ssh session
    with our host, but none can do so.


    We modify the rules so that the ssh block is applied on the external interface,
    not the internal interface. Then we check the file into CVS, load it onto the
    router, and reload the packet-filtering process so that it sees the new rule set.


    # Step 7: Test Results


    You''ll never know whether your test has done anything without checking to see
    if the problem still exists. You''ll never know whether you''ve introduced new
    problems with your changes if you don''t test. Testing gives you confidence that
    all is as it should be.


    # Testing Functionality


    > Once was asked to add some functionality to a log rotation package that we used
    in our shop. After I added the code to perform the new function, I tested it to
    ensure that things worked. A simple test showed that the new function worked as
    desired. I then ran a more complete test and found that I broke another bit of
    functionality. Had I not run the full test suite, I would have released a broken
    tool onto our servers. (The good news is, it was a simple mistake to fix, and
    the fix pointed out a way to make the code smaller and easier to maintain).


    I recommend that you make it a practice to keep a suite of tests that exercise
    the main functionality of your network. Each time you run into a problem, add
    a test or two to check for it as well. Given a suite like this and a system to
    run all the tests, you can feel confident that your network is solid at the end
    of the day.'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# Step 8: Apply Results of Testing to Hypotheses


    # Example 6.7: An ssh Example Using Step 7


    When we reload the packet filter in our ssh example, we can immediately check
    if we can use ssh to connect to our Web server. After verifying that it works,
    we can test to make sure that external connections to the Web server don''t (don''t
    forget to add this to the test suite). Finally, we can verify that other major
    bits still work, according to our existing test suite. For the sake of our example,
    we''ll say that external hosts are still capable of making ssh connections to
    the Web server.


    # Step 8: Apply Results of Testing to Hypotheses


    This is the pay-off step. If your testing has isolated and solved the problem,
    you''re almost done. All that remains is to make the changes introduced in your
    test a permanent part of the network. If you haven''t solved the problem yet,
    this is where you sit down with your results and your list of hypotheses to see
    what you''ve learned.


    # Applying Results


    When I was doing system administration work, I created a set of scripts to automate
    the creation of index files. When I ran the scripts from the command line, they
    worked perfectly. When I ran them from cron, they failed miserably.


    My first thought was that the cron user didn not have permission to run all the
    commands called by the script. I decided to test this by making every call explicitly
    and logging them to a file.


    It turned out that permissions wer not a problem. Carefully examining the log
    file helped me find the problem, though. The file indicated that I was relying
    on environment variables that existed in my inter-active session, but not in the
    environment that the cron job ran in.


    I was able to add the needed variables into the script, and all was well.


    If the most recent test solved your problem, this step is unnecessary. You''ve
    found the problem and (hopefully) corrected it. If you created a new one, you
    need to look at how the data from this test affects your prioritized list of possible
    causes. Your prioritization need to change? Are more possibilities pointed out
    by this test? If the test didn''t identify and solve your problem, did it eliminate
    this possible cause? If not, what further tests are needed to make sure that this
    possible cause isn''t the root of your problem?


    # Example 6.8: An ssh Example Using Step 8


    Because we fixed only half of the problem in the previous steps, we need to check
    our data and see where we should look for our next step. The results of this test
    show that internal hosts can again connect to the Web server, but external hosts
    are no longer blocked. The rest of our test suite shows that other services are
    handled as expected.'
  merge: -1
  pgno: 128
- img_proc: true
  md: '# Step 9: Iterate as Needed


    Most often, you won''t need to go all the way back to Step 1 or 2. Instead, you''ll
    be able to go back to Step 4 to prioritize and refocus.You might find that the
    things you learned in your most recent test point you in a slightly different
    direction. You might also find another possible cause of the problem; in this
    case you can jump back to Step 3 and add it to your list.


    # Iterating


    While I was writing this section, a Web hosting server that I help down. After
    resuscitating it, I found that email wasn''t working properly. My list of hypotheses
    was as follows:


    +   - The MTA daemon hadn''t started.

    - The MTA configuration was batched.


    I logged in and checked. Sure enough, the MTA hadn''t started. I started it up
    by hand and tested it; the local deliveries worked fine, Next I checked the configuration
    files, and everything looked fine. I also checked /var/log/messages, but I didn''t
    see any sign of the MTA whining it started.


    Without a solution, I jumped back to Step 3. What could be wrong? I decided to
    try connecting directly to 25 from a remote host to see what errors I saw. I was
    a little surprised to find that the connection was refused, and I remembered that
    our mailers sit behind a TCP wrapper daemon.(Sometimes you need a little reminder
    to put something on your list of possibles).


    Going back to the server, I checked to see if the wrapper was running. It wasn''t.
    After a quick restart of the daemon, all was well again. I went back and added
    the MTA and system startup scripts to ensure this would not happen again.


    If you''ve run out of possible causes or found additional information, you even
    want to go all the way back to Step 1 and restart the problem just to make sure
    you haven''t missed the mark completely.


    # Example 6.9: An ssh Example Using Step 9


    The ssh connection is supposed to be blocked at the router, so that the most likely
    place to check for problems. Changes made on the fly (the ones we made earlier)
    are notorious for having minor glitches that cause major headaches. Going back
    to the configuration, we might find that our shuffling of the file resulted in
    a bad mask applied to the external hosts, allowing the Internet into our host.
    Again, it''s a quick fix.


    This time, when we ran our test suite, everything went as expected. It took us
    two trips through the pattern, but we got the problem l.'
