    # # 3. INTERNET LAYER PROTOCOLS


    # ## 3.1 INTRODUCTION


    The Robustness Principle: "Be liberal in what you accept, and conservative in
    what you send" is particularly important in the Internet layer, where one misbehaving
    host can deny Internet service to many other hosts. The protocol standards used
    in the Internet layer are:


    +   - RFC-791 [IP:1] defines the IP protocol and gives an introduction to the
    architecture of the Internet.

    - RFC-792 [IP:2] defines ICMP, which provides routing, diagnostic and error functionality
    for IP processing. Although ICMP messages are encapsulated within IP data, ICMP
    processing is considered to be (and is typically implemented as) part of the IP
    layer. See Section 3.2.2.

    - RFC-950 [IP:3] defines the mandatory subnet extension to the addressing architecture.

    - RFC-1112 [IP:4] defines the Internet Group Management Protocol IGMP, as part
    of a recommended extension to hosts and to the host-gateway interface to support
    Internet-wide multicasting at the IP level. See Section 3.2.3.'
