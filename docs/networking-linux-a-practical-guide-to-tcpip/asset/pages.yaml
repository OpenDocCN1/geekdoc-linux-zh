  md: '# Appendix A RFC-1122


    However, an application program that does not want to receive such

    ERROR_REPORT calls SHOULD be able to effectively disable these calls.

    DISCUSSION:


    These error reports generally reflect soft errors that can be ignored without
    harm

    many applications. It has been suggested that these error report calls should
    default to

    "disabled," but this is not required.


    # 4.2.4.2 Type-of-Service


    The application layer MUST be able to specify the Type-of- Service (TOS) for segments

    that are sent on a connection. It is not required, but the APPLICATION SHOULD
    be able

    to change the TOS during the connection lifetime. TCP SHOULD pass the current

    TOS value without change to the IP layer, when it sends segments on the connection.

    TOS will be specified independently in each direction on the connection, so that

    the receiver will use the TOS for ACK segments.


    TCP MAY pass the most recently received TOS up to the application.

    DISCUSSION:


    Some applications (e.g., SMTP) change the nature of their communication during
    the

    life of a connection, and therefore like to change the TOS specification.

    Note also that the OPEN call in RFC-793 includes a parameter ("options")

    in which the caller can specify IP options such as route source, record route,
    or time-

    stamp.


    # 4.2.4.3 Flush Call


    Some TCP implementations have included a FLUSH call, which will empty the TCP

    send queue of data for which the user has issued SEND calls but is still to

    the right of the current send window. That is, it flushes as queued send data
    is

    possible without losing sequence number synchronization. This is useful for imple-

    menting the "abort output" of Telnet.


    # 4.2.4.4 Multihoming


    The user interface outlined in 2.7 and 3.8 of RFC-793 needs to be extended

    for multihoming. The OPEN call MUST have an optional OPEN([ ...local

    IP address, ...]) to allow the specification of the local IP address.

    DISCUSSION:


    Some TCP-based applications need to specify the local IP address to be used to
    open

    a particular connection; FTP is an example.


    # IMPLEMENTATION:


    A passive OPEN call with a specified "local IP address" parameter will await an

    incoming connection request to that. If the parameter is unspecified, a passive

    OPEN will await an incoming connection request to any local IP address, and then

    bind the local IP address of the connection to the particular address that is
    used.

    For an active OPEN call, a specified "local IP address" parameter will be used
    for'
