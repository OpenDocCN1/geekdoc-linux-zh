  md: '# ARP and RARP


    If the link-layer protocol supports multiple hosts (such as Ethernet II), IP must
    have a means of relating an IP address to the link-layer address. This is accomplished
    through the Address Resolution Protocol (ARP). IP ARP on Ethernet is defined by
    RFC 826. Reverse ARP (RARP) is a closely related protocol, defined in RFC 903.


    If we go back to another of a room of people talking to represent an Ethernet
    LAN, ARP would be like asking, "Who is Tom?" When someone answers, you can begin
    talking to him. In fact, ARP asks, "Who has IP address X.X.X.X?" When it gets
    a response, it is an IP-level conversation with that host.


    +   - ARP Is Not RoutablenBecause ARP is carried directly by link-layer protocols,
    not by a network-layer protocol, it is not routable.10


    # ARP


    ARP requires two kinds of packets: ARP requests (asking for the MAC address corresponding
    to an IP address) and ARP replies (giving the correspondence between two addresses).
    In some cases, the reply is sent by the machine assigned the IP address being
    requested. Some older hosts cannot properly determine whether a host is local
    to their network. In this case, ARP provides a mechanism for answering these systems''
    inappropriate ARP, proxy ARP. Linux allows you to configure a host to provide
    ARP responses by configuring the pub flag. When this flag is set, the netmask
    flag can also be set, and ARP cache entries can be made for a single host or an
    entire subset.


    ARP request packets are composed of the following: a 2-byte hardware type, a 2-byte
    protocol type, a 1-byte hardware address length, a 1-byte protocol address length,
    a 2-byte opcode with a value of 0001, a variable-length sender address, a variable-length
    sender protocol address, a variable-length target hardware address, and a variable-length
    target protocol address. The target hardware address is typically filled with
    zeroes.


    ARP reply packets are similar to the ARP request packets described previously,
    except that the opcode value is 0002 and the Target Hardware Field is filled with
    the appropriate MAC address.


    Although ARP is normally used to determine the hardware address of another system,
    some machines are configured to perform a "gratuitous ARP?" As the host is bringing
    up its network interface card, it uses ARP for its own IP address. This mechanism
    can help reduce IP address conflicts.'
  merge: -1
  pgno: 45
