  md: '# Appendix B RFC-1123


    Many hosts represent text files internally as strings of ASCII characters, using
    the embedded ASCII format effector characters (LF, BS, FF, ...) to control the
    format when a file is printed. For such hosts, there is no distinction between
    "print" files and other files. Systems that use record files typically need a
    special format for printable files (e.g., ASA carriage control). For the latter
    hosts, FTP allows a choice of TYPE N or TYPE T.


    # 4.1.2.3 Page Structure: RFC-959 Section 3.1.2.3 and Appendix I


    Implementation of page structure is not RECOMMENDED in general. However, if a
    host system does need to implement FTP for "random access" or "holey" files, it
    MUST use the defined page structure format rather than defining a new FTP format.


    # 4.1.2.4 Data Structure Transformations: RFC-959 Section 3.1.2


    An FTP transformation between record-structure and file-structure SHOULD be invertible,
    to the extent possible while making the useful result on the target host.


    RFC-959 requires strict invertibility between record-structure and file-structure,
    in practice, efficiency and convenience preclude it. Therefore, the requirement
    is being relaxed. There are two different objectives for transferring a file:
    processing on the target host, or for storage. strict invertibility is important.
    For processing, the file created on the target host needs to be in the format
    expected by application programs on that host.


    As an example of the conflict, imagine a record-oriented operating system that
    requires some data files to have exactly 80 bytes in each record. While storing
    a file on such a host, an FTP Server must be able to pad each line or record to
    80 bytes; a later retrieval of such file cannot be strictly invertible.


    # 4.1.2.5 Data Connection Management: RFC-959 Section 3.3


    A User-FTP that uses STREAM mode SHOULD send a PORT command to assign a non-default
    data port before each transfer command is issued.

    DISCUSSION:

    This is required because the long delay after a TCP connection is closed until
    its socket pair is reused, allow multiple transfers during a single FTP session.

    Sending a port command can be avoided if a transfer mode other than stream is
    used, by leaving the data transfer connection open between transfers.


