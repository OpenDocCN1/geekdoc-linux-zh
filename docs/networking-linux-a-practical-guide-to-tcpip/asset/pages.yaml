- img_proc: true
  md: 'Here:


    +   - sss is a text string that appeared in a Restart Marker in the data stream
    and encodes a position in the sender''s file system

    - rrrr encodes the corresponding position in the receiver''s file system.


    The encoding, which is specific to a particular file system and network implementation,
    is always generated and interpreted by the same system, either sender or receiver.
    When an FTP that implements restart receive a Restart Marker in the data stream,
    it SHOULD force the data to point to be written to stable storage before encoding
    the corresponding position rrrr. An FTP sending Restart Markers MUST NOT assume
    that 110 reply will be returned synchronously with the data, i.e., it must not
    wait a 110 reply before sending more data.

    Two new reply codes are defined for errors in restarting a transfer:


    +   - 555 Requested action taken: invalid REST parameter—A 554 reply may result
    from an FTP service command that follows a REST command.The reply indicates that
    the existing file at the Server-FTP cannot be repositioned as specified in the
    REST.

    - 555 Requested action taken: type or mismatch. A 555 reply may result from an
    APPE command or any FTP service command following a REST command. The reply indicates
    there is some mismatch between the current transfer parameters (type) and the
    attributes of the existing file.


    # DISCUSSION:


    Note that the FTP Restart mechanism requires that Block or Compressed mode be
    used for data transfer, to allow the Restart Markers to be included within the
    data stream. The frequency of Restart Markers can be low. Restart Markers make
    a place in the data stream, but the receiver may be performing some transformation
    on the data as it is stored into stable storage. In general, the receiver’s encoding
    must include any state information necessary to restart this transformation at
    any point of the FTP data stream. For example, in FTP A, some servers transform
    CR LF sequences into a single LF character on disk. If a Restart Marker happens
    to fall between CR and LF the receiver must encode in rrrr that the transfer must
    be restarted in a “CR has been seen and discarded”..\nNote that the Restart Marker
    is required to be encoded as a string of printable ASCII characters, regardless
    of the type of the data.

    RFC-959 says that restart information is to be returned “to the user.” This should
    not be taken literally. In the general, User-FTP should save the restart information
    (sss,rrrr) in stable storage, e.g., add it to a restart control file. An empty
    restart control file should be created when the transfer first starts and deleted
    automatically when the transfer completes successfully. It is suggested that this
    file have a name derived in an easily-identifiable manner from the name of the
    file being transferred and the remote host; this is analogous to the methods used
    by many text editors for naming “backup” files.'
