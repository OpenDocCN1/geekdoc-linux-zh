  md: '# Defining and Using Chains


    In our testing example, we created a new chain called GATE and applied it to both
    the INPUT and FORWARD chains. The flow of traffic through the INPUT chain looks
    like Figure 11.9 after we''ve added these rules.


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_212_0.png)


    We created the chain and set it into motion with the following steps:


    +   1. Create the chain.

    2. Add rules to it.

    3. Apply the chain.


    Creating the chain was done with the following command:

    iptables -N GATE


    The name is not required to be all uppercase, but cannot be the name of an existing
    rule chain.

    Rules were added sequentially in our example, but we could have inserted them
    in any order using the -I switch instead.We could have also deleted or replacing
    existing rules we had so we desired.


    After the rules were written, we applied the rule with the following command:

    iptables -A INPUT -J GATE


    This command adds a rule to the INPUT chain that causes traffic to jump to the
    GATE chain for further processing. If you do not do this, no traffic will ever
    be checked by your rule chain!


    # Special Handling


    At times you want to log traffic that moves through your packet filter. This logging
    can take up a great deal of disk space, so it is normal only on a reduced basis.
    Three switches are of special importance when logging. We used one of these options
    in the logging rules in our example.


    ```

    iptables -A GATE -J LOG --log-prefix "Accepting packet:"

    ```'
