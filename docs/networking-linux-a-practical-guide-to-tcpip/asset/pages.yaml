    # 6.2 HOST INITIALIZATION


    # 6.2.1 INTRODUCTION


    This section discusses the initialization of host software across a connected
    network, or more generally across an Internet path. This is necessary for a diskless
    host, and may optionally be used for a host with disk drives. For a diskless host,
    the initialization process is called "network booting" and is controlled by a
    bootstrap program located in a boot ROM.


    To initialize a IP host across the network, there are two distinct phases:


    +   1. Configure the IP layer. Diskless machines often have no permanent storage
    in to store network configuration information, so that sufficient information
    must be obtained dynamically to support the loading phase that follows. This information
    must include at least the IP addresses of the host and of the boot server. To
    support booting across a gateway, the address mask and a list of default gateways
    are also required.'
