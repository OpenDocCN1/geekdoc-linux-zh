  md: "# Chapter 11 Security Tools\n\nThis config file really doesn't do everything\
    \ we want it to, so we'll make some changes to it. First, we only want 1 ftp connection\
    \ at a time. Second, we're only going to allow de-fined ftp telnet sessions from\
    \ internal hosts (they'll have 192.168.1.0/24 addresses). We'll log all finger\
    \ connections and connect them to /usr/local/my_safe.fingerd. Because we're not\
    \ running imap on this host, we'll redirect all imap sessions to our imap server\
    \ at 192.168.1.10.\n\nThrottling ftp connections is fairly straightforward. We'll\
    \ modify the ftp section to look like that shown in Example 11.7.\n\n# Example\
    \ 11.7 Defining ftp\n\n```\nservice ftp\n{\n    flags = REUSE NAMEINARGS\n   \
    \ socket_type = stream\n    protocol = tcp\n    wait = no\n    user = root\n \
    \   server = /usr/sbin/in.ftpd\n    server_args = in.ftpd -l -a\n    instances\
    \ = 1\nn}\n```\n\nControlling access is also straightforward. We'll modify the\
    \ telnet session to match Example 11.8.\n\n# Example 11.8 Defining Access Control\
    \ for telnet\n\n```\nservice telnet\n{\n    flags = REUSE NAMEINARGS\n    socket_type\
    \ = stream\n    protocol = tcp\n    wait = no\n    user = root\n    server = /usr/sbin/in.telnetd\n\
    \    server_args = in.telnetd\n    only_from = 192.168.1.0/24\n}\n```\n\nWhat\
    \ if we wanted to disconnect connections from hosts within our local subnet during\
    \ non-work hours? The following line could be added to the end of the section\
    \ (after the only_from line):\n\n```\naccess_time = 08:00-18:00\n```"
