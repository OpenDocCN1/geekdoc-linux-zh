    is not on the connected network), the IP layer MUST pick a gateway from its list
    of ''default'' gateways. The IP layer MUST support multiple default gateways.


    DISCUSSION:


    A host generally needs to know at least one default gateway to get started. This
    information can be obtained from a configuration file or from the host startup
    sequence, e.g., the BOOTP protocol (see [INTRO:1]).


    It has been suggested that a host can augment its list of default gateways by
    recording any new gateways it learns about. For example, it can record every gateway
    to which it is redirected. Such a feature, possibly useful in some circumstances,
    may cause problems in other cases (e.g., gateways are not all equal), and it is
