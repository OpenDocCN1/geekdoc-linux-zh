    # ## What Is a Socket?


    Because a port number in isolation is not terribly helpful, port numbers are often
    kept in context as a socket, which is an IP address with a port number. Thus,
    a Telnet connection from cherry to mango might have the following sockets:


    | Client Side | Server Side |

