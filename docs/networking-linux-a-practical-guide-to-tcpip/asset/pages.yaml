- img_proc: true
  md: '# What Is a Baseline? 121


    My preference is to keep things online, but in a csv repository.Then you can keep
    on a central server or two while also keeping a copy on your laptop, PC, or palmtop.
    If you like, you can even grab printouts. A nice benefit to this is that several
    people can make updates to documentation and then commit their changes back to
    the cv repository when they''ve finished.


    I won''t get into the Web vs. flatfile vs database vs. XML vs whatever conflict.
    They all have benefits. Choose the right option for your organization, and stick
    to it. The important bit is that you have the data, right?


    # Network Maps


    A roughly ignored set of baseline information is the network map. If you have
    more than two systems in your network and don''t have a map, set down this book
    for 20 minutes and sketch something out. It doesn''t have to be pretty, just reasonably
    accurate. Are you back? Good. Now that you have a map showing what is where, where
    we can get back to work.


    Most people wanted to deal with two kinds of maps. The first is a topological/physical
    map, which shows what equipment is and how it is connected. The second is a logical
    map. This shows what services are provided and what user communities are supported
    by which servers. If you can combine these two maps, so much the better; color
    coding, numeric coding, and outlined boxes are all mechanisms that can help with
    this. A sample map is shown in Figure 7.1.


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_138_0.png)


    Figure 7.1 A sample network map.'
  merge: -1
  pgno: 138
- img_proc: true
  md: '# Chapter 7 Before Things Break—Building a Baseline


    Like the information discussed in the preceding “Work/Problem Logs” section, I
    recommend that you keep your maps online and in a couple of places. (cvs can be
    a solution here as well.) Nicely done maps also look good on your wall, not to
    mention that this is a convenient place to find them when a problem breaks out
    and you need to start troubleshooting.


    # Equipment Records


    You should also have accurate records of the hardware and software in your network.
    At a minimum, you should have a hardware listing of each box on the network, a
    list of system and application levels (showing currently installed versions and
    patches), and configurations of the same. If you keep this in cvs, you''ll also
    have a nice mechanism for looking at your history.


    If you decide to keep these records, it is vital that they be kept up-to-date.
    Every time you make a change, you should edit the appropriate file and commit
    it to cvs. If you fall behind, you’ll miss something, and then you’ll be really
    stuck.


    # How to Create a Baseline


    Okay, I’ve talked a bit about what you should have, and I’ve created a daunting
    list of stuff that you ought to do. How are you going to get it done? Never fear,
    most of this can be done in small chunks. In addition, you’ll find much of the
    work can be scripted and then run from cron.


    In this section, I’ll cover the following:


    +   - Deciding what to do first

    - Following naming convention

    - Keeping logs and records

    - Making maps

    - Using cron to do your dirty work for you


    # What Do I Do Now?


    To me, your baseline is pretty useless without a map and inventory. With this
    mind, I recommend that you do these second—yes, second. The first thing you’ll
    want to do is to decide how and where you’re going to keep all your data, and
    set it up. (While you’re at it, you might as well start your own logbook.You’ll
    be touching a lot of things while you make your map and inventory, so you’ll get
    a chance to start making entries.)'
  merge: -1
  pgno: 139
- img_proc: true
  md: '# How to Create a Baseline


    When you''ve got a repository for all your data set up (did you use csv, right?),
    and your maps and inventory are in it, you''re ready to start on the next step.
    This is a good time to lay out a plan for what you want to watch and how often
    you want to check. Some things should run constantly—log file watchers are a great
    example. Others, as ethereal, traceroute, and netstat, need to be run periodically.


    Which of these you implement first depends a lot on your situation? Do you have
    any outstanding problems? If so, start building your baseline around your troubleshooting.
    Are you especially interested in watching certain areas? Start watching them.
    I think that works well to start with something you''re familiar with. You''ll
    gain confidence in your plan and in your scripts with each success.


    Another idea means testing your baselining tools on small parts of your network.
    When you get things going on a subsection, it is much simpler to extend them across
    your entire network.


    # Good Naming Conventions—Keeping It All Straight


    Assuming you''re not throwing all your baseline data into a database, you''re
    going to want a way to keep track of it. Even if you track only a couple of files,
    you''ll have a huge collection of files. Without a way to track it all, it will
    be a mess of epic proportions. Your naming convention will go a long way toward
    helping you.


    A large-grained approach is to divide all your files into subdirectories or divide
    your files into daily subdirectories. Regardless, you''ll want to name each file
    showing what it contains, the date and time it was created, and which host it
    was created on (for example, ethereal-20001025-0990-mango_eth0.cap for ethereal
    capture created on eth0 of mango at 9 A.M. on October 25, 2000). If you use different
    switches on a command, you might include that in the filename (for example, netstat-20001025-0990-mango,
    netstat-an-20001025-0990-mango, and netstat-Mn-20001025-0990-mango).


    # Following Naming Conventions Closely


    Whatever naming convention you decide on, follow it religiously! You will want
    to be able to access the files from scripts, and a common naming scheme will make
    this far easier. If you ever need to change your naming convention, having a regular
    system to change from will also make your life more pleasant.


    # Getting a Record Started


    Starting your host-by-host record may seem like the hardest task of those outlined,
    but it can actually be pretty simple. Before I dive into hands-on advice, I''d
    like to weigh in on flatfiles vs a database for records. I think it''s important
    to keep a local copy of this record on each host. To me, the best way to do this
    is to update it on the local host and commit your changes to each change. This
    way, even if the box is isolated from the network, you have an accurate copy to
    work from.'
  merge: -1
  pgno: 140
