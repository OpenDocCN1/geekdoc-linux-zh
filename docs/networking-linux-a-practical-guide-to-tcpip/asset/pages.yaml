  md: '# Chapter 7 Before Things Break—Building a Baseline


    The adduser command is a good example of this. A better solution for host information
    might be to provide a script that the user can run when installing the system
    that puts the updates into a central repository. The needed additions and corrections
    to local configuration files can be made by collecting data from this central
    repository.


    If all my warnings in the last section weren''t enough to convince you to use
    csv and a naming standard, this is my last swing at it. Having these in place
    will make automatic maintenance and creation of the per-host files a lot simpler.
    Simpler makes fewer mistakes and a greater chance that things will get done. It''s
    a good idea.


    # Where Monitoring Fits into All of This


    Okay, so where does monitoring fit into all of this? A lot of what I''ve talked
    about monitoring, after all. Is this all you need to do? Not really.


    Although monitoring described previously helps you watch the general direction
    of your network and what it compares to the norm at any given time, it represents
    only an occasional snapshot of what they are. True monitoring is a near real-time
    view of reality. The two types of monitoring are complementary.


    Monitoring should include frequent checks of systems and applications that you
    want to keep available to your users. You also want to ensure that you find out
    about failures through some alarm mechanism (pager, email, or the like). Your
    monitoring plan will overlap your baseline by a bit. If this is the case, you
    should look into ways to combine the functions.


    The mon tool, which is discussed in Chapter 10, is a wonderful utility for watching
    your network. It enables you to send alarms to various users based on the results
    of your tests. Although mon is designed as a monitoring tool, extending it to
    write data into a record for your review is pretty trivial.


    You might find that your baseline indicates that you need to adjust your alerting
    thresholds at times. This is really just another benefit of keeping a baseline.
    It helps keep your view of reality current. You might find that your monitoring
    might suggest that the reverse is true—something you should add a test to your
    baseline. Again, this is just another benefit of really watching your network.


