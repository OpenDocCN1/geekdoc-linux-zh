    cache entry defines the endpoints of an Internet path. Although the connecting
    path may change dynamically in an arbitrary way, the transmission characteristics
    of the path tend to remain approximately constant over a time longer than a single
    typical host-host connection. Therefore, a route cache is a natural place to cache
    data on the properties of the path. Examples of such properties might be the maximum
    unfragmented datagram size (see Section 3.3.3), or the average round-trip delay
    measured by a transport protocol. This data will generally be gathered and used
