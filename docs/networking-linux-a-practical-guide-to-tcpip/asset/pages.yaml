    ignore unknown Telnet commands might crash if it received an EOR. To protect such
    hosts, the End-of-Record option [TELNET:9] was introduced; however, a properly
    implemented Telnet program will not require this protection.


    # 3.2.4 Telnet “Sync” Sync: RFC-854, p. 8–10


    When it receives “urgent”TCP data, a User or Server Telnet MUST discard all data
    except Telnet commands until the DM (and end of urgent) is reached.

    When it sends Telnet IP (Interrupt Process), a User Telnet SHOULD follow it by
    the Telnet “Sync” sequence, i.e., as TCP urgent the sequence “IAC IAC DM”. The
    TCP pointer points to the DM octet.


    When it receives a Telnet IP, a Server Telnet MAY send a Telnet “Sync” sequence
    back to the user, to flush the output stream. The choice ought to be consistent
    with the server operating system behaviors when a local user interacts with a
    process.

    When it receives a Telnet AO, a Server Telnet MUST send a Telnet “Sync” sequence
    back to the user, to flush the output stream.


    A User Telnet SHOULD have the capability of flushing out when it sends a Telnet
    IP; also see Section 3.4.5.


    # DISCUSSION:


    There are three possible ways for a Telnet to flush the stream of server output
    data:


    +   1. Send AO after IP. This will cause the server host to send a “flush-buffered-output”
    signal to its operating system. However, the AO may not take effect locally, i.e.,
    stop terminal output at the User Telnet, until the Server Telnet has received
    and processed the AO and has sent a “Sync”.

    2. Do TIMING-MARK [TELNET:7] after IP, and discard all output locally until a
    WILL/WONT TIMING-MARK is received from the Server Telnet. Since the DO TIMING-MARK
    will be processed in the right place in the output data stream. However, the reply
    to it should be the TIMING-MARK will not send a “flush buffered” signal to the
    server operating system. Whether or not this is dependent upon the server system.

    3. Both. The best method is not entirely clear, since it must accommodate a number
    of existing server hosts that do not follow the Telnet standards in various ways.
    The safest approach is probably to provide a user-controllable option to select
    (1), or (3).


