    # 4.2 TRVIAL FILE TRANSFER PROTOCOL—TFTP


    # 4.2.1 INTRODUCTION


    The Trivial File Transfer Protocol TFTP is defined in RFC-783 [TFTP:1]. TFTP provides
    its own reliable delivery with UDP as its transport protocol, using a simple stop-and-wait
    acknowledgement system. Because TFTP has an effective window of only one 512 octet
    segment, it can provide good performance only over paths that have a small delay*bandwidth
    product. The TFTP interface is very simple, providing no access control or security.\
    TFTP''s most important application is bootstrapping a host over a local network,
    since it is simple and small enough to be easily implemented in EPROM [BOOT:1,
    BOOT:2]. Vendors are urged to support TFTP for booting.


    # 4.2.2 PROTOCOL WALK-THROUGH


    The TFTP specification [TFTP:1] is written in an open style, and does not fully
    specify many parts of the protocol.'
