  md: '# Appendix B RFC-1123


    DISCUSSION:

    RFC-1091 [TELNET:10] updates an earlier version of the Terminal-Type option defined
    in RFC-930. The earlier version allowed a server host capable of supporting multiple
    terminal types to learn the type of a particular client''s terminal, assuming
    that each physical terminal had an intrinsic type. However, today a “terminal”
    is often a terminal emulator program running in a PC, perhaps capable of emulating
    a range of terminal types. Therefore, RFC-1091 extends the specification to allow
    a more general terminal-type negotiation between User and Server Telnets.


    # 3.3 SPECIFIC ISSUES


    # 3.3.1 Telnet End-of-Line Convention


    The Telnet protocol defines the sequence CR LF to mean “end-of-line.” For terminal
    input, this corresponds to a command-completion or “end-of-line” key being pressed
    on a user terminal, on an ASCII terminal, this is the CR key, but it may also
    be labelled “Return” or “Enter.”


    When a Server Telnet receives the Telnet end-of-line sequence CR LF as input from
    a remote terminal, the EFFECT MUST be the same as if the user had pressed the
    “end-of-line” key on a local terminal. On server hosts use that ASCII, in particular,
    receipt of the Telnet sequence CR LF must cause the same effect as a local user
    pressing the CR key on a local terminal. Thus, CR LF and CR MUL must have the
    same effect on an ASCII server host when received as input over a Telnet connection.


    A User Telnet must be able to send any of the forms: CR LF, CR NULL, and LF User
    Telnet on an ASCII host SHOULD have a user-controllable mode to send either CR
    LF or CR NUL when the user presses the “end-of-line” key, and CR LF SHOULD be
    the default.


    The Telnet end-of-line sequence CR LF MUST be used to send Telnet data that is
    not terminal-to-computer (e.g., for Server Telnet sending output, or the Telnet
    protocol incorporated another application protocol).


    DISCUSSION:


    To allow interoperability between arbitrary Telnet clients and servers, the Telnet
    protocol defined a standard representation for a line terminator. Since the ASCII
    character set includes no end-of-line characters, systems have chosen various
    representations, e.g., CR, LF, and the sequence CR, LF. The Telnet protocol chose
    the CR, LF sequence as the standard for network transmission.


    Unfortunately, the Telnet protocol specification in RFC-854 [TELNET:1] has turned
    out to be somewhat ambiguous on what character(s) should be sent from client to
    server for the “end-of-line” key. The result has been a massive and interoperability
    headache, made worse by various faulty implementations of both User and Server
    Telnets.'
