  md: '# Two Stories of Problem Solving 15


    They decided that their first test would be to verify that other hosts could still
    send external mail through the server. If not, it was a global problem in the
    MTA. If the other hosts could send mail, it might be related to the specific host
    in question.


    To conduct the test, they sent mail from a box in the office where they worked,
    and they logged into a machine at the other office (where Rob worked) and sent
    mail from that host as well. Then they waited for delivery of the messages.


    After a short wait, they checked the Hotmail account to which they had sent the
    email. Both boxes delivered their mail to the external address used in testing.


    Applying the results of this test to their hypothesis meant that Sara and Bill
    could eliminate some of the possible causes from their list. They now knew that
    the only client box affected was the new one that Rob had installed. They redrew
    their map as shown in Figure 6.5.


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_132_0.png)


    Figure 6.5 Revised email problem map.


    The router and hosts from their office were crossed off the list of involved systems.
    Sara and Bill also dropped the remaining hosts at the other office from their
    list. They didn''t see anything to add to their list of possible causes, and they
    couldn''t drop the MTA as the culprit yet.


    They decided that they needed to see what caused the MTA to generate relaying
    errors, so they hit the books (or in this case, the Web site). It turned out that
    their MTA relied on an external program called tcpserver to block relaying, and
    this program used a configuration file called /etc/tcp.smtp to control access.
    The next test would be to check /etc/tcp.smtp and change it, if needed.'
