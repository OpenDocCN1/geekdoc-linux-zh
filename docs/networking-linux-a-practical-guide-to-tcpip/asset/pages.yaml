    He fell in love with computers at school and learned to program in BASIC using
    punch cards. Ivan subsequently had many opportunities to work in real-time using
    both PDP and VAX, mini-computers, and his interest in UNIX-like operating systems
    has remained since that that time.


    Ivan''s interest in programming, particularly systems programming, lead inevitably
    to GNU/Linux about 4 years ago and he has avidly used, programmed and promoted
