  md: '# Remote Login–Telnet Protocol


    DISCUSSION:


    Implementors should be aware that a strict reading of RFC-854 allows a client
    or server expecting NVT ASCII to ignore characters with the high-order bit set.
    In general, binary mode is expected to be used for transmission of an extended
    (beyond 7-bit) character mode with Telnet.


    However, there exist applications that really need an 8-bit NVT mode, which is
    currently not defined, and these existing applications set the high-order bit
    during part or for all the life of the Telnet connection. Note that binary mode
    is not the same as 8-bit NVT mode, since binary mode turns off end-of-line processing.
    For this reason, the requirements on the high-order bit are set as SHOULD, but
    not MUST. RFC-854 defines a minimal set of properties of a “network virtual terminal”
    or NVT; this is not to preclude additional features in a real terminal. A Telnet
    connection is fully transparent to all 7-bit ASCII characters, including ASCII
    control characters.


    For example, a terminal might support full-screen commands coded as ASCII sequences;
    a Telnet implementation would pass these sequences as uninterpreted data. Thus,
    an NVT should not be conceived as a terminal type of a highly-restricted device.


    # 3.2.6 Telnet Command Structure: RFC-854, p. 13


    Options may appear at any point in the data stream, a Telnet escape character
    (known as IAC, with the value 255) to be sent as DATA MUST be doubled. However,
    the data stream MUST still be scanned for IAC characters, any embedded Telnet
    commands MUST be obeyed, and data bytes equal to IAC MUST be doubled. Other character
    processing (e.g., replacing CR by NUL or by CR LF) MUST NOT be done. In particular,
    there is no end-of-line convention (see Section 3.3.1) in binary mode.


    # 3.2.7 Telnet Binary Option: RFC-856


    When the Binary option has been successfully negotiated, arbitrary 8-bit characters
    are allowed.


    DISCUSSION:


    The Binary option is normally negotiated in both directions, to change the Telnet
    connection from NVT mode to “binary mode.”


    The sequence EOR can be used to delimit blocks of data within a binary-mode Telnet
    stream.


