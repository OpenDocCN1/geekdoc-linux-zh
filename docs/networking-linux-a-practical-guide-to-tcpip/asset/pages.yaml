  md: '# ICMP


    While TCP and UDP carry data, The Internet Control Message Protocol (ICMP) provides
    diagnostic and error reporting capabilities. Because of this functionality, ICMP
    becomes an important tool in understanding our networks.


    # Protocol Review


    ICMP packets can be generated by IP hosts when certain errors are encountered,
    or by an application. These two cases of ICMP packet generation help us to break
    ICMP packets into two classes: ICMP errors and ICMP requests/responses.


    ICMP errors are generally caused by a failure to deliver an IP datagram. Because
    IP datagrams do not follow a set path through a network, ICMP error messages are
    sent back to the source host, not to any intermediate routers. (These facts enable
    us to build diagnostic tools like traceroute, which is discussed in Chapter 9.)


    ICMP packets all follow the same basic structure: a 1-byte Type field, a 1-byte
    Code field, and a 2-byte Checksum field, followed by a variety of fields, depending
    on the type of packet. Like the checksum in the IP header, ICMP uses a value of
    0x0000 for calculating the checksum. Unlike an ICMP checksum, which uses only
    the header, the entire ICMP packet is used in the calculation.


    We''ll look at the structure of ICMP packets in turn. Table 4.4 shows the different
    kinds of ICMP packets at a glance.


    Table 4.4 ICMP Packets with Type and Code


    | Type | Code(s) | Function |

    |---|---|-|

    | 0/8 | | Echo request/response |

    | 3 | 0-15 | Destination unreachable |

    | 4 | | Source quench |

    | 5 | 0-3 | Redirect |

    | 9/10 | 0 | Router advertisement/solicitation (not shown) |

    | 11 | 0-1 | TTL exceeded |

    | 12 | 0-1 | Parameter error |

    | 13/14 | 0 | Timestep request/response (not shown) |

    | 15/16 | 0 | Obsolete (not shown) |

    | 17/18 | | Subnet mask request/response (not shown) |


    Note: Not all the ICMP messages listed in this table are described in the text.
    I have tried to describe only the most common and important of the ICMP messages
    here.'
  merge: -1
  pgno: 86
- img_proc: true
  md: "Five kinds of errors are defined not to produce ICMP messages:\n\n+   - A failure\
    \ involving an ICMP error message\n- An IP diagram with a broadcast destination\
    \ address\n- A link-layer frame with a broadcast destination address\n- Any fragment\
    \ of an IP diagram other than the first\n- Any diagram whose source address is\
    \ not a unicast address\n\nIf ICMP error messages are sent in response to these\
    \ kinds of errors, the result could be a heavy period of traffic called a broadcast\
    \ storm.^3\n\n# Echo Request/Reply\n\nThe ICMP echo request and reply messages\
    \ are the basis of the /bin/ping command discussed in Chapter 9. The source host\
    \ issues an ICMP echo request (Type 8), and the destination sends back an ICMP\
    \ echo response (Type 0).\n\nThe ICMP echo request/reply message is laid out as\
    \ follows: a 1-byte Type field, a 1-byte Code field (always 0x00), a 2-byte Checksum\
    \ field, a 2-byte ID Number field, a 2-byte Sequence Number field, and a variable-length\
    \ Data field. The ID Number is unique to each ping command issued. The Sequence\
    \ Number increments separately in each ping command. If you run a script like\
    \ the following, you will notice that each ping has a different ID Number but\
    \ the same Sequence Number:\n\n```\nfor count in 1 2 3; do\n  /bin/ping -c1 192.168.1.1\n\
    done\n```\n\nIf you run this command, you will see that each ping has the same\
    \ ID Number but increasing Sequence Numbers:\n\n```\n/bin/ping -c3 192.168.1.1\n\
    ```\n\n# Destination Unreachable\n\nICMP Destination Unreachable messages are\
    \ laid out as follows: a 1-byte Type (0x03), a 1-byte Code field (see Table 4.6),\
    \ a 2-byte Checksum field, a 4-byte Reserved field (this field must be 0x00000000),\
    \ a 20-byte Failed IP Header field, and an 8-byte Failed IP Datagram field. The\
    \ 20 bytes of the Failed IP Header field give all the data to identify the IP\
    \ packet that caused the error condition to occur. The 8 bytes of the Failed IP\
    \ Data field show the first 8 bytes of the transport-layer header; this provides\
    \ enough information to identify the application that caused the error condition.\
    \ The layout of this kind of ICMP packet is shown in Table 4.5."
