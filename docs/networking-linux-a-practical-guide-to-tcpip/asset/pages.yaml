  md: '# 4. TRANSPORT PROTOCOLS


    # 4.1 USER DATAGRAM PROTOCOL—UDP


    # 4.1.1 INTRODUCTION


    The User Datagram Protocol UDP [UDP:1] offers only a minimal transport service—non-guaranteed
    datagram delivery—and gives applications direct access to the datagram service
    of the IP layer. UDP is used by applications that do not require the level of
    service of TCP or wish to use communications services (e.g., multicast or broadcast
    delivery) not available from TCP.


    UDP is almost a null protocol; the only service it provides over IP is checksuming
    of data and port number. Therefore, an application program running over UDP must
    deal directly with end-to-end communication problems that a connection-oriented
    protocol would have handled—e.g., retransmission for reliable delivery, packetization
    and reassembly, flow control, congestion avoidance, etc., when these are required.
    The fairly complex coupling between IP and TCP will be mirrored in the coupling
    between UDP and many applications using UDP.


    # 4.1.2 PROTOCOL WALK-THRO


    There are no known errors in the specification of UDP.


    # 4.1.3 SPECIFIC ISSUES


    # 4.1.3.1 Ports


    UDP well-known ports follow the same rules as TCP well-known ports; Section 4.2.2.1
    below. If a datagram arrives addressed to a UDP port for which there is no pending
    LISTEN call, UDP SHOULD send an ICMP Port Unreachable message.


    # 4.1.3.2 IP Options


    UDP MUST pass any IP option that it receives from the IP layer transparently to
    the application layer. An application MUST be able to specify IP options to be
    sent in its datagrams, and UDP MUST pass these options to the IP layer.


    DISCUSSION:


    At present, the only options that need be passed through UDP are Source Route,
    Record Route, and Time Stamp. However, new options may be defined in the future,
    and UDP need not and should not make any assumptions about the format or content
    of options it passes to or from the application; an exception to this might be
    an IP-layer security option. An application based on UDP will need to obtain a
    source route from a request datagram and supply a reversed route for sending the
    corresponding reply.'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# 4.1.3.3 ICMP Messages


    UDP MUST pass to the application layer all ICMP error messages that it receives
    from the IP layer. Conceptually, at least, this may be accomplished with an upcall
    to the ERROR_REPORT routine (see Section 4.2.4.1).


    DISCUSSION:


    Note that ICMP error messages resulting from sending a UDP datagram are received
    asynchronously. A UDP-based application that wants to receive ICMP error messages
    is responsible for maintaining the state necessary to demultiplex these messages
    when they arrive; for example, the application may keep a pending receive operation
    for this purpose. The application is also responsible to avoid confusion from
    a delayed ICMP error message resulting from an earlier use of the same port(s).


    # 4.1.3.4 UDP Checksums


    A host MUST implement the facility to generate and validate UDP checksums. An
    application MAY be able to control whether a UDP checksum will be generated, but
    it MUST default to checksumming.


    If a UDP datagram is received with a checksum that is non-zero and invalid, UDP
    MUST silently discard the datagram. An application MAY be able to control whether
    UDP datagrams without checksums will be discarded or passed to the application.


    DISCUSSION:


    Some applications that normally run across local area networks have chosen to
    turn off UDP checksums for efficiency. As a result, numerous cases of undetected
    errors have been reported. The advisability of ever turning off UDP checksumming
    is very controversial.


    IMPLEMENTATION:


    There is a common implementation error in UDP checksums. Unlike the TCP checksum,
    the UDP checksum is optional; the zero value is transmitted in the checksum field
    of a UDP header to indicate the absence of a checksum. If the transmitter really
    calculates a UDP checksum of zero, it must transmit the checksum as all 1s (65535).
    No special action is required at the receiver, since zero and 65535 are equivalent
    in 1''s complement arithmetic.


    # 4.1.3.5 UDP Multihoming


    When a UDP datagram is received, its specific-destination address MUST be passed
    to the application layer. An application program MUST be able to specify the IP
    source address to use for sending a UDP datagram or leave it unspecified (in which
    case the networking software will choose an appropriate source address). There
    SHOULD BE a way to communicate the chosen source address to the application layer
    (e.g. so that the application can later receive a reply datagram only from the
    corresponding interface).'
