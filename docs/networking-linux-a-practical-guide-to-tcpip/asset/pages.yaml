    message to an appropriate address (see Section 5.3.3).


    # DISCUSSION:


    The set of conditions under which a RCPT parameter can be validated immediately
    is an engineering design choice. Reporting mailbox errors to the Sender-SMTP before
    message is transferred is desirable to save time and network bandwidth, which
    is lost if RCPT verification is lengthy.

    For example, the receiver can verify immediately any local reference, such as
    a single locally-registered mailbox. On the other hand, the "reasonable time"
    limitation generally implies deferring verification of a mailing list until after
    the message has been transferred and accepted, since verifying a large mailing
    list can take a very long time. An implementation might or not choose to defer
    validation of addresses that are non-local and require a DNS lookup. If a DNS
    lookup is performed but a soft domain system error (e.g., timeout) validity must
