  md: 'Back to the “do stuff” section—in this example, I wanted to send alerts for
    boxes that weren’t responding to finger requests. To perform the test, I used
    the Net::Telnet Perl module to make a TCP connection to the finger server (at
    port 79). Then I sent an empty string and waited for a response. If I got something
    back, I treated it as a working server. If there was no connection, or if I got
    an error, I treated it as a failure and popped the host and error message onto
    an array for later handling. After I had worked through the whole list of hosts,
    I could move on to the error-handling part of the test (if there were any failures).


    That''s all there is to it; not much magic there. The hardest part is sitting
    down to figure out how to test the condition you''re looking for.


