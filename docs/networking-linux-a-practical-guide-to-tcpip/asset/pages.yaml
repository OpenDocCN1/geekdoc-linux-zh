    on the connection. The RECOMMENDED procedure is for a Source Quench to trigger
    a “slow start,” as if a retransmission timeout had occurred.

    - Destination Unreachable—codes 0, 1, 5. Since these Unreachable messages indicate
    soft error conditions, TCP MUST NOT abort the connection, and it SHOULD make the
    information available to the application.


    DISCUSSION:


    TCP could report the soft error condition directly to the application layer with
    an ERROR_REPORT routine, or it could merely note the message and report it to
    the application only when if the TCP connection times out.


    +   - Destination Unreachable—codes 2-4. These are hard error conditions, so TCP
    SHOULD abort the connection.

    - Time Expired—codes 0, 1. This should be handled the same way as Unreachable
    codes 0, 1, 5 (see above).

    - Parameter Problem—This should be handled the same way as Destination Unreachable
    codes 0, 1, 5 (see above).


    # 4.2.3.10 Remote Address Validation


    TCP implementation MUST reject as an error a local OPEN call for an invalid IP
    address (e.g., a broadcast or multicast address).


    An incoming SYN with an invalid source address must be ignored by TCP or by the
    IP layer (see Section 3.2.1.3).


    A TCP implementation MUST silently discard an incoming SYN segment that is addressed
    to a broadcast or multicast address.


    # 4.2.3.11 TCP Traffic Patterns


    IMPLEMENTATION:


    The TCP protocol specification [TCP:1] gives the implementor much freedom in designing
    the algorithms that control the message flow over the connection—packetizing,
    managing the window, sending acknowledgments, etc. These design decisions are
    difficult because a TCP must adapt to a wide range of traffic patterns. Experience
    has shown that a TCP implementor needs to verify the design on two extreme traffic
    patterns:


    +   - Single-character segments—Even if the sender is using the Nagle Algorithm,
    when a TCP connection carries remote login traffic across a low-delay LAN the
    receiver will get a stream of single-character segments. If terminal echo mode
    is in effect, the receiver’s system will echo each character as it is received.

    - Bulk Transfer—When TCP is used for bulk transfer, the data stream should be
    made up (almost) entirely of segments of the size of the effective MSS. Although
    TCP uses a sequence number space by byte (octet) granularity, in bulk-transfer'
  merge: -1
  pgno: 303
- img_proc: true
  md: '# Transport Protocols 27


    its operation should be as if TCP used a sequence space that counted only segments.
    Experience has furthermore shown that a single TCP can effectively and efficiently
    handle these extremes. The most important tool for verifying a new TCP implementation
    is a packet trace program. There is a large volume of experience showing the importance
    of tracing a variety of traffic patterns with other TCP implementations and studying
    the results carefully.


    # 4.2.3.12 Efficiency


    IMPLEMENTATION:

    Extensive experience has led to the following suggestions for efficient implementation
    of TCP:


    +   (Don''t Copy Data—In bulk data transfer, the primary CPU-intensive tasks are
    copying data from one place to another and checksuming the data. It is vital to
    minimize the number of copies of TCP data. Since the ultimate speed limit may
    be fetching data across the memory bus, it may be useful to combine the copy with
    checksuming, doing both with a single memory fetch.


    +   (Hand-Craft the Check Routine—A good TCP checksuming routine is typically
    to five times faster than a simple and direct implementation of the definition.
    Great care and clever coding are often required and advisable to make the checksuming
    code “blazing fast.” See [TCP:10].


    +   (Code for the Common Case—TCP protocol processing can be complicated, but
    for most segments there are only a few simple decisions to be made. Per-segment
    processing will be greatly speedy up by coding the main line to minimize the number
    of decisions in the most common case.


    # 4.2 TCP/APPLICATION LAYER INTERFACE


    # 4.2.4.1 Asynchronous Reports


    There MUST be a mechanism for reporting soft TCP error conditions to the application.
    Generally, we assume this the form of an application-supplied ERROR_REPORT routine
    that may be upcalled [INTRO:7] asynchronously from the transport layer:

    ERROR_REPORT(local connection name, reason, reasason)

    The precise encoding of the reason and subreason parameters is not specified here.
    However, the conditions that are reported asynchronously to the application MUST
    include:


    +   * ICMP error message arrived (see 4.2.3.9)

    * Excessive retransmissions (see 4.2.3.5)

    * Urgent pointer advance (see 4.2.2.4)'
