  md: '# 132 Chapter 8 In The Moment—Case Studies


    # Step 5: Create a Plan of Attack


    If the problem was being caused by one or more applications, Eliza might have
    to dig a little bit to find the root cause. She can look at a couple things to
    start. Because the problem seems to have occurring even before people arrived,
    it is likely to be a scheduled job. With this in mind, crontabs would be a good
    place to start. If it weren''t fruitful, she could follow up with Tom.


    # Step 6: Act on your Plan


    Eliza logs in on patton to see what is going on. Looking at the root cronab, she
    sees one job, web-lint, to go off in the morning. Logging in to bigfun, she checks
    the cronab as well. There are two morning processes, full-dump and search-prep.


    Looking at the cronjob on patton, Eliza identifies it as a link-checker. The cronjobs
    on bigfun prove to be an rsync-backup of bigfun to patton (full-dump) and a Web
    site indexing job (search-prep). The link checker would be hard to optimize (you
    really need to check every link), but perhaps it could be rescheduled. The backup
    might be something that could be optimized, but it could also be rescheduled.
    The indexing job created any traffic, so she can ignore that for now. She will
    need to flag it for later. A serious hit against the CPU or memory could really
    cause problems for anything else running on bigfun (such as the Web server).


    # Step 7: Test the Results of Your Actions


    Eliza asks to find out if there are any known conflicts with rescheduling the
    two jobs. Tom just wants to make sure both jobs run after 9 p.m. so that any new
    content pushes can be finished before they start. He also wants the link checker
    to run before 10 a.m. so that the designers can fix anything on the Web site before
    the noon rush.


    Because she has a big window to work with, Eliza decides to move the backup to
    9:30 p.m. and the link checker to 1 a.m. She wraps both cronjobs with a call to
    syslog to timestamp. This allows her to check /var/log/messages to verify that
    things aren''t taking too long. Finally, she sets up a cron on patton to watch
    the traffic with netstat, and a second one on mango to start up Ethereal for.


    The next morning, Eliza discovers that the slowness problem has evaporated: The
    two cronjobs that she''d rescheduled have run in reasonable time. She also has
    built herself reputation as a miracle worker.


    # Step 8: Apply the Results


    Because she has already changed the cronab, Eliza''s fix is in place. She decides
    to canv the other folks in the office over the next couple of weeks, to ensure
    that things continue to look good. In addition, she notes all the changes in her
    notebook.'
