- img_proc: true
  md: "# A Discussion of PPPoE\n\nThe PPPoE protocol separates traffic into two kinds,\
    \ each sent during a different stage of the networking session. The session begins\
    \ with a discovery stage and then moves into a PPP session stage. The Ethernet\
    \ type ID is different for the two stages. In the discovery stage, it is 0x8863;\
    \ in the PPP session stage, it is 0x8864. The PPPoE header is the same during\
    \ both stages of the protocol.\n\nThe PPPoE header is 6 bytes long and contains\
    \ five fields. The first 4 bytes make up the Version field and are set to 0x1.\
    \ The second 4 bits is 1 byte long and represents the Code field; this is defined\
    \ separately for the discovery and PPP session stages (see the next two sections\
    \ for more details). The next field is the Session ID, which is 2 bytes long (the\
    \ “Discovery Stage” section is 2 bytes long and indicates the length of the PPPoE\
    \ payload (excluding the Ethernet and PPPoE headers).\n\nTwo hosts are involved\
    \ in a PPPoE session. The initiating host is the client; this is your box. The\
    \ server (also called the access concentrator) is the host that you are connecting\
    \ to the ISP.\n\n# Discovery Stage\n\nDuring the discovery stage, the payload\
    \ of the PPPoE packet carries a series of well-defined tags. Each tag is composed\
    \ of three fields. The first field is 2 bytes long and represents the tag type.\
    \ The second field represents the tag length and also is 2 bytes long. The third\
    \ field is the TagValue field, which is of variable length. Some tag types and\
