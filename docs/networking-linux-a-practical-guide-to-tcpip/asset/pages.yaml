    server that determines the preferred mode, so the server needs to initiate the
    negotiation; since the negotiation is symmetric, the user can also initiate it.

    A client (User Telnet) SHOULD provide a means for users to enable and disable
    the initiation of option negotiation.


    DISCUSSION:

    A user needs to connect to an application service (e.g., FTP or SMTP) that use
    Telnet for its control stream but does not support Telnet options. User Telnet
    may be used for this purpose if initiation of option negotiation is disabled.


    # 3.3.5 Telnet Linodem Option


    DISCUSSION:

    An important Telnet option, LINEMODE [TELNET:12], has been proposed.

    LINEMODE option provides a standard way for a User Telnet and a Server Telnet
    to agree that the client rather than the server will perform character processing.
    When the client has prepared a complete line of text, it will send it to the server
    (usually) one TCP packet. This option will greatly decrease the packet cost of
    Telnet sessions and will also give better user response over congested or long-delay
    networks.


    The LINEMODE option allows dynamic switching between local and remote character
    processing. For example, the Telnet connection will automatically negotiate into
    single-character mode while a full screen is running, and return to linodemode
    when the editor is finished.


    We expect that when this RFC is released, hosts should implement the client side
    of this option, and may implement the server side of this option. To properly
    implement the server side, the server needs to tell the local system not to do
    any input character processing, but to remember its terminal state and notify
    the Server Telnet process whenever the state changes. This will allow password
    echoing and full screen editors to be handled properly, for example.


    # 3.4 TELNET/USER INTERFACE


    # 3.4.1 Character Set Transparency


    User Telnet implementations SHOULD be able to send or receive any 7-bit ASCII
    character. Where possible, any special character interpretations by the user host''s
    operating system SHOULD be bypassed so that characters can be conveniently sent
    and received on the connection.


    Some character value MUST be reserved as "escape to command mode";※ally, doubling
    this character allows it to be entered as data. The specific character used SHOULD
    be user selectable.


    On binary-mode connections, a User Telnet program MAY provide an escape mechanism
    for entering arbitrary 8-bit values, if the operating system doesn''t allow them
    to be entered directly from the keyboard.'
