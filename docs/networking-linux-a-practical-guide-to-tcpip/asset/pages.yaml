    # 5.3 SPECIFIC Strategies


    5.3.1 SMTP Queuing Strategies

    The common structure of a host SMTP implementation includes user mailboxes, or
    more areas for queuing messages in transit, and sending and receiving mail. The
    exact structure will vary depending on the needs of the users on the host and
    the number and size of mailing lists supported by the host. We describe several
    optimizations that have proved helpful, particularly for mailers supporting high
    traffic levels.


    Any queuing strategy MUST include:


    +   - Timeouts on all activities. See Section 5.3.2.

    - Never sending error messages in response to error messages.


    5.3.1.1 Sending Strategy

    The general model of a sender-SMTP is one or more processes that periodically
    attempt to transmit outgoing mail. In a typical system, the program that processes
    some method for requesting message has some method immediate attention for a new
    piece of outgoing mail, while mail that cannot be transmitted immediately MUST
    be queued and periodically retrieved by the sender. A mail queue entry will include
    only the message itself but also the envelope information.


    The sender MUST retry a particular destination after one attempt has failed. In
    general, the retry interval SHOULD be at least 30 minutes; however, more sophisticated
    and variable strategies will be beneficial when the sender-SMTP can determine
    the reason for non-delivery.


    Retries continue until the message is transmitted or the sender gives up; the
    give-up time generally needs to be at least 4-5 days. The parameters to the retry
    algorithm MUST be configurable.


    A sender SHOULD keep a list of hosts it cannot reach and corresponding timeouts,
    rather than just retrying queued mail items.


    DISCUSSION:

    Experience suggests that failures are typically transient (the target system has
    crashed), favoring a policy of two connection attempts in the first hour the message
    is in the queue, and then backing off to once every two or three hours.'
