- img_proc: true
  md: '# RFC 1518 and RFC 1519 define classless interdomain routing (CIDR), pronounced


    The use of supernets requires that routers must know the network mask of the networks
    they carry. The current implementations of the major routing protocols (IP-2,
    BGP-4, and OSPF) all carry the needed information.


    # Understanding Supernets


    To understand supernets and how they alleviate the two problems mentioned previously,
    let''s look at an example:


    A small ISP, Small-ISP.net, has a CIDR block of 192.168.192.0/20 (remember, this
    means that it can control the addresses from 192.168.192.0 to 192.168.207.255,
    a total of 16 C networks). Because the ISP controls these addresses, any other
    router in the Internet core requires only one routing entry for its own use instead
    of 16 separate entries.


    Small-ISP.net has three companies that provides services to, in addition to its
    customers. SmallCo and LittleCo (the smaller of three companies) are assigned
    192.168.206.0/23 and 192.168.204.0/23 respectively each company 510 potential
    host addresses for their networks. MidSize, Inc., is assigned 192.168.200.0/22,
    yielding 1022 host addresses. All of these assignments leave Small-ISP.net with
    the network 192.168.192.0/21 for its own use (or further subdivision, if needed).


    # Routing


    Routing is a primary function of the network layer and is one of IP''s strengths.
    One of the design goals of the IP protocol was that an internet would be capable
    of surviving near-catastrophic losses of its internet connections. IP routes each
    datagram separately, if the data path followed by one packet becomes blocked,
    the next packet will simply be routed along a different path. This works well
    in a meshed network.


    # Simple and Meshed Networks


    Networks are commonly classified as simple or meshed (sometimes "deeply meshed").
    A simple network is one in which there are few connections between networks. Traffic
    has only a single potential path through a simple network. A meshed network is
    one in which many connections exist between networks. Traffic can be passed along
    multiple paths between points in a meshed network."


    One of the keys to this capability is that any given box has to know about only
    its next connection to get to any other point in the internet. In fact, for many
    boxes, only a single connection is required; this is called the default gateway.
    This collection of information is called a routing table.'
