  md: '18 Chapter 2 Link-Layer Protocols


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_35_0.png)


    Figure 2.1 Two LANs with a PPP connection.


    In the following sections, we''ll discuss two link-layer protocols, PPP and Ethernet,
    and an encapsulated link-layer protocol, PPPE. We''ll also talk about the local
    lookup device that many IP stacks provide, the ARP protocol, and the method used
    to determine packet sizes that should be used when traversing internetworks like
    the one shown in Figure 2.1.


    # # PPP


    RFC 1661 defines the Point-to-Point Protocol (PPP), which “provides a standard
    method for transporting multiprotocol datagrams over point-to-point links.” PPP
    is used to connect many home computers to the Internet and to provide a vendor-neutral
    connection between routers.


    PPP has supplanted the Line IP (SLIP), an earlier protocol described by RFC 1055,
    and the related Compressed SLIP lack some features that PPP provides:


    +   - SLIP provides no mechanism for transferring any protocol other than IP.


    +   - SLIP has no error-checking mechanism, leaving traffic to corruption due
    to phone line problems.


    +   - There is no method for advertising IP addresses in SLIP. You must know the
    IP address of each side of the connection before beginning.


    # # A Discussion of PPP


    PPP frames have a 5-byte header, up to 1500 bytes of data, and then a 3-byte trailer.
    The header contains a 1-byte starting flag (always 0x7e)³, a 1-byte address field
    (always 0xff), a 1-byte control field (always 0x03), and a 2-byte protocol field
    (IP is 0x0021).'
