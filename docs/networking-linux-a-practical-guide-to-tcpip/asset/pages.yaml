  md: '# Chapter 2 Link-Layer Protocols


    The original Ethernet specification was published jointly by DEC, Intel, and Xerox
    in 1982. It utilizes a shared bus (logical or physical) for communication, and
    it controls access via carrier sense multiple access with collision detection
    (CSMA/CD). This means that all the hosts on a LAN share a common devices (multiple
    access). When a device has to send, it listens for an opening (carrier sense)
    and then attempts to send its message. If more than one host tries sending data
    at once, a collision occurs, and both hosts wait a short period and try again.
    The wait period is randomized to help prevent the boxes from colliding again.
    This is very similar to the mechanism that we use when trying to make conversation
    in a room full of people. We listen for a pause and then begin speaking. If another
    person speaks at the same time, there is a short pause, and someone will begin
    speaking while the other members of the conversation.


    # A Discussion of Ethernet


    Ethernet packets are composed of a 14-byte header, a data field of 46 to 1500,
    and a 4-byte cyclic redundancy check (CRC). The first 6 bytes of the header make
    up the Ethernet address (also called the MAC address or machine address) of the
    destination system. The second 6 bytes represent the MAC address of the source
    system. The final 2 bytes of the header are the Type field. Some commonly used
    type codes are shown in Table 2.1.


    | Table 2.1 Ethernet Type Codes of Interest |

    | Type Code | Type of Payload |

    | 0x0800 | IPv4 |

    | 0x86DD | IPv6 |

    | 0x0806 | ARP |

    | 0x8035 | RARP |

    | 0x809B | AppleTalk |


    Because there is a 46-byte minimum length for the Ethernet data field, the data
    might require padding, extra bytes that bring the byte count of the data field
    up to the minimum size.


    Packets smaller than 64 bytes (14 bytes of header, 46 bytes of data, and a 4-byte
    trailer) are called runs and ignored. Packets greater than 1518 bytes (14 bytes
    of header, 1500 bytes of data, and 4 bytes of CRC) are called giants and are also
    ignored.


    MAC addresses are composed of two sections. The first 3 bytes are a vendor identifier.
    The second 3 bytes represent a unique ID for each card. There are additional address
    possibilities in the destination address. Turning on the lowest-value bit in the
    first byte represents a multicast address, a message sent to multiple hosts on
    the network. Turning on all the bits in the destination address represents a special
    form of multicast, called a broadcast.'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'It is important to remember that just because a packet is addressed to a specific
    host (or a multicast address listened to by multiple hosts), it is not private.
    Every host on an Ethernet segment receives every packet on that segment. (This
    is what allows network analyzers to work.) Each host normally processes only packets
    that are addressed to it, including multicasts and broadcasts, and it ignores
    those addressed to other hosts. The destination address is placed first to allow
    hosts to follow this behavior to handle traffic more efficiently.


    This clearly indicates a major difference between PPP and Ethernet. PPP is a point-to-point
    protocol; traffic can be seen only by the two end points of the circuit (and any
    special equipment introduced into the circuit). Ethernet is a broadcast medium;
    everything on the LAN will see every bit of traffic.


    # Ethernet Decoded


    The diagram in Figure 2.3 shows an Ethernet frame. In this frame, the destination
    address is set to ff:ff:ff:ff:ff:ff (the broadcast address), the source address
    is 00:e0:98:7c:95:21, and the Type field is 0x0806 (ARP).


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_38_0.png)


    Figure 2.3 A captured Ethernet frame.


    # PPPoE


    RFC 2516 describes PPP over Ethernet (PPPoE), a method for encapsulating PPP packets
    over Ethernet. This protocol is commonly used to provide Digital Subscriber Line
    (DSL) service to subscribers.'
