  md: '# Electronic Mail–SMTP and RFC-822 349


    If there is a delivery failure after acceptance of a message, the receiver-SMTP
    MUST formulate and a notification message. This notification MUST be sent using
    a null (“<>”) reverse path in the envelope; see Section 3.6 of RFC-821. The recipient
    of this notification SHOULD be the address from the envelope return path (or the
    Return-Path line). However, if this address is null (“<>”), the receiver-SMTP
    MUST NOT send a notification. If the address is an explicit source route, it SHOULD
    be stripped down to its final hop.


    DISCUSSION:

    For example, suppose that an error notification must be sent for a message with:
    "MAIL FROM:<a,@b:user@>." The notification message should be sent to: "RCPT TO:<user@>."


    Some delivery failures after the message is accepted by SMTP will be unavoidable.
    For example, it may be impossible for the receiver-SMTP to validate all the addresses
    in RCPT command(s) due to a “soft” domain system error or because the target is
    a mailing list (see earlier discussion of RCPT).


    To avoid duplicate messages as the result of timeouts, a receiver-SMTP MUST minimize
    the time to respond to the final “<@> that ends a message transfer. See RFC-1047
    [SMTP:4] for a description of this problem.


    # 5.3.4 Reliable Mail Transmission


    To transmit a message, a sender-SMTP determines the IP address of the target host
    from the destination address in the envelope. Specifically, it maps the string
    to the right of the “@” sign into an IP address. This mapping or the transfer
    may fail with a soft error, in which case the sender-SMTP should requue the outgoing
    mail for a later retry, as required in Section 5.3.1.1.


    When it succeeds, the mapping can result in a list of alternative delivery addresses
    rather than a single address, because of (a) multiple MX records, (b) multihoming,
    or both. To provide reliable mail transmission, the sender-SMTP MUST be able to
    try (and retry) each of the addresses in this list, until a delivery attempt succeeds.
    However, there MAY also be a configurable limit on the number of alternate addresses
    that can be tried. In any case, host SHOULD try at least two addresses.


    The following information is to be used to rank the hosts:


    +   1. Multiple MX Records–These contain a preference indication that should be
    used in sorting. If there are multiple destinations with the same preference and
    there is no clear reason to favor one (e.g., by address preference), then the
    sender-SMTP SHOULD pick one at random across multiple mail exchanges for a specific
    organization; note that this is a refinement of the procedure in [DNS:3].


