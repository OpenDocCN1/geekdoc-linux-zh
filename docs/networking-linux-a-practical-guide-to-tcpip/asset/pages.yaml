  md: '# How to Keep Your Baseline Up-to-date


    # Using cron


    When you''ve started gathering this information, you''ll want to automate it.
    Automating information gathering helps you in two ways: First, it enables you
    to collect the information at odd intervals (especially when you''re not there).
    Second, it enables you to ensure that each item is gathered the same way every
    time.


    For example, a convenient method of running ethereal every hour at 15 past the
    hour might be to run the following script from cron:


    ```

    #!/bin/bash


    export HOST=''hostname''

    export DATE=''date +%y%m%d''


    export FILE="${HOST}.${DATE}"


    tethereal -c 5000 -t r -w /var/log/ethereal/${FILE}


    cd /var/log/ethereal


    export CVS_RSH=ssh

    c add ${FILE}

    commit -m "latest capture" ${FILE}

    ```


    To run this script from cron, you will need to add a line like the following to
    the root crontab2 (remember that only root can run ethereal/tereal unless you
    allow others to open an Ethernet interface in promiscuous mode):


    ```

    * * * * /user/local/bin/run_tereal >/dev/null 2>&1

    ```


    When you put the whole thing into cron, including ensures that all the changes
    were made by creating your log files. There is nothing worse having a nice data
    collection system and not noticing that some of the data isn''t being collected.
    A cron-based script to do this is left as an exercise for the reader.


    # How to Keep Your Baseline Up-to-Date


    There are two sides to keeping your current record. The first aspect is that you
    need an entry for every test period; cron should take care of this for you. The
    second is that you need to add each new item to your baseline as it is added to
    your network. This one needs to be done by hand (well, sort of).


    One way to help that things gets added is making information as painless as possible.
    Again, we can turn to the system administrator''s standby: scripting. If you write
    a script to add a new host and take care of creating and adding the appropriate
    entries in the appropriate places, you''ll find that your life seems a lot less
    complicated. You won''t forget to do that one thing always seems to be forgotten.
    You may even be able to hand the initial data entry off to the user of the equipment.'
