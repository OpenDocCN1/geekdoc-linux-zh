  md: "# 4.2.2.1 Transfer Modes: RFC-783, Page 3\n\nThe transfer mode “mail” SHOULD\
    \ NOT be supported.\n\n# 4.2.2.2 UDP Header: RFC-783, Page 17\n\nThe length field\
    \ of a UDP header is incorrectly defined; it includes the UDP header length (8).\n\
    \n# 4.2.3 SPECIFIC ISSUES\n\n# 4.2.3.1 Sorcerer's Apprentice Syndrome\n\nThere\
    \ is a busy, known as the “Sorcerer’s Apprentice Syndrome,” in the protocol specification.\
    \ If it does not cause incorrect operation of the transfer (the file will always\
    \ be transferred correctly if the transfer completes), this bug may cause excessive\
    \ retransmission, which may cause the transfer to time out.\n\nImplementations\
    \ MUST contain the fix for this problem: the sender (i.e., the side originating\
    \ the DATA packets) must never resend the current DATA packet on receipt of a\
    \ duplicate ACK.\n\nDISCUSSION:\n\nThe bug is caused by the protocol rule that\
    \ either side, on receiving an old duplicate datagram, may resend the current\
    \ datagram. If a packet is delayed in the network but later delivered after it\
    \ has timed out and retransmitted a packet, a duplicate copy of the response may\
    \ be generated. If the other side responds to this duplicate with a duplicate\
    \ of its own, then every datagram will be sent in duplicate for the remainder\
    \ of the transfer (unless a datagram is lost, breaking the repetition).\n\nWorse\
    \ yet, since the delay is often caused by congestion, this duplicate transmission\
    \ causes more congestion, leading to more delayed packets, etc.\nThe following\
    \ example may help to clarify this problem.\n\n# TFTP A\tTFTP B\n\n+   (1)Receive\
    \ ACK X-1\nSend DATA X\n\n+   (2)Receive DATA X\nSend ACK X\n\n+   (ACK X is delayed\
    \ in network, and A times out):\n(3)Retransmit DATA X\n\n+   (4)Receive DATA X\
    \ again\nSend ACK X again\n\n+   (5)Receive (delayed) ACK X\nSend DATA X+1\n\n\
    +   (6)Receive DATA X+1\nSend ACK X+1\n\n+   (7)Receive ACK X again\nSend DATA\
    \ X+1 again"
