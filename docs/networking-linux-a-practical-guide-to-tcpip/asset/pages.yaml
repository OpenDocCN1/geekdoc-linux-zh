- img_proc: true
  md: "# 144 Chapter 9 Troubleshooting Tools\n\nping used to be a very good indicator\
    \ of a machine's capability to receive and send. If you could ping a host, you\
    \ could also make an FTP or HTTP IP packets in general. With the wider advent\
    \ of packet filtering for security, this is becoming less true. Many firewalls\
    \ explicitly disallow ICMP packets' on two grounds:\n\n+   1. People don't need\
    \ to know what your internal network looks like.\n2. Any protocol, even ICMP,\
    \ can be used to launch an attack.\n\nDeciding whether to let ICMP through your\
    \ firewall is a tough call to make. There are certainly good uses for ICMP, but\
    \ there are also attacks on ICMP (such as the 'ping of death,' which uses oversized\
    \ ping packets to overload the IP stack of the target, often with spectacular\
    \ results). If you choose to allow ICMP into your network, make sure you've thought\
    \ about the repercussions.\n\nAdditional flavors of the ping command have been\
    \ written for other purposes; among the most common is the ping command. The ping\
    \ command was written to ping a range of addresses, and it is commonly used in\
    \ network scanners and monitors such as satan, saint, and mon (which are covered\
    \ in Chapter 10, \"Monitoring Tools\"). Another variant is the Net::ping module,\
    \ which provides a perl implementation of ping functionality that can be easily\
    \ used from a script without calling an external program. You might use it in\
    \ a script like that shown in Example 9.1.\n\nExample 9.1 Using Net::ping\n\n\
    ```\n#!/usr/bin/perl -w\n\nuse strict;\nuse Net::ping;\n\nmy $host = $ARGV[0];\n\
    \nmy $sp = Net::ping->new('icmp');\n\nif ($sp->ping($host)) {\n    print \"$host\
    \ is alive.\\n\";\n} else {\n    print \"$host is not reachable.\\n\";\n}\n```\n\
    \nhping is another variant of the standard ping. It is actually a superset of\
    \ ping, enabling you to ping hosts using non-ICMP protocols, elicit ICMP responses\
    \ from UDP probes, and even craft your own packets to test for specific behavior.\n\
    \n# ping at Work\n\nping is most often used without additional arguments and shut\
    \ off with a Ctrl+C. The results are shown in Example 9.2."
