- img_proc: true
  md: 'This method of flow control using a change in the window size is called the
    sliding window.

    The TCP Checksum is a mandatory checksum that is computed over a pseudoheader,
    the TCP header, and the data carried by the packet. The pseudoheader contains
    fields from the IP header to verify that the packet was received by the correct
    host. The fields used are the 4-byte source IP address, 4-byte destination address,
    4-byte padding (all 0s), 1-byte transport protocol, and 2-byte transport length.
    A diagram of this pseudoheader is shown in Figure 4.1.


    | 4 Source IP Addr | 4 Byte Dest IP Addr |

    | 0x00 | 0x06 | 2 Byte Length |


    Figure 4.1 TCP pseudoheader.


    The Urgent Data Pointer is used to indicate the last of urgent data carried in
    the TCP data. This is used to allow the inband transmission of emergency data.
    If the data-carries urgent data, it must also have the URG flag set. This urgent
    often represents an interrupt in interactive traffic such as Telnet, login, or
    FTP. For example, typing an interrupt to change your Telnet options would done
    with urgent data.


    # Session Startup and Shutdown


    Both session startup and session shutdown impose overhead on the session itself.
    This overhead allows the session to be properly administered when it has started,
    and to be closed properly when finished.


    # The Three-Step Handshake


    TCP session is called the three-step handshake (or the three-way handshake). It
    is composed of the first three TCP segments transmitted. During the three-step
    handshake, initial sequence numbers are exchanged and acknowledged, and then startup
    options are exchanged.


    The handshake starts with the client sending a datagram to the server. This datagram
    has the SYN flag set and the initial value for the client''s sequence number.
    If an MSS or window scaling option be used, those options are set in this datagram
    as well. This datagram is often called the SYN datagram or SYN packet.


    In step 2 of the handshake, the server sends a datagram to the client. The SYN
    and ACK flags are both set, the client''s sequence number is acknowledged (with
    a value of the sequence number increased by 1), and again, if the MSS or window
    scaling option is to be used in this session, it is set in this datagram. This
    datagram is called the SYN-ACK packet or datagram.'
  merge: -1
  pgno: 76
- img_proc: true
  md: '# Chapter 4 Transport-Layer Protocols


    The final step of the handshake is from the client to the server. In this datagram,
    the client sets the ACK flag, acknowledging the server''s sequence number (again
    with the count incremented by 1). This is called the ACK packet or datagram.


    The netstat, netmap, and ethereal tools (discussed in Chapter 9, "Troubleshooting
    Tools," and Chapter 10, "Monitoring Tools") describe TCP sessions as being in
    various states. The three-way handshake moves a TCP session through several of
    them. The following section reviews the common states for a client and a server.
    Figure 4.2 shows all these states.


    The client starts in a CLOSED state and moves directly to the SYN_SENT state as
    it sends a SYN packet. When it has received the server''s SYN-ACK packet, it moves
    to an ESTABLISHED state, which stays until session closure. server also starts
    in a CLOSED state. It normally binds to a port and waits for incoming packets;
    this is called the LISTEN state. After it has received the SYN packet and sent
    the SYN-ACK packet, it moves into the SYN_RCVD state. When the server receives
    the client''s ACK packet, it moves into the ESTABLISHED state, staying until session
    closure.


    # Normal Session Closure


    When a session is closed normally, four packets are required. Either end of the
    connection can request that the session be closed.


    Session closure starts when one of the machines involved in the session sends
    a datagram with the ACK and FIN flags set. This is often called the ACK-FIN packet.
    The second machine responds with a datagram in just the ACK flag is set; this
    is called the ACK packet. Because TCP sessions are full duplex, the second machine
    could continue to send data at this point, but this is uncommon.


    The session closure is completed when the second machine sends a datagram with
    both the ACK and the FIN flags set, and receives the response from the first machine
    with the ACK flag set. At this point, half of the TCP session passes through several
    states. It follows one of two paths through these states, as described.


    The first (and more common) path through session closure is as follows: On the
    machine that closes half of the TCP session, the session starts in the ESTABLISHED
    state. When the ACK-FIN packet has been sent, it moves into the FIN_WAIT_1 state.
    When the ACK packet has been received, it moves into the FIN_WAIT_2 state. When
    it receives the ACK-FIN from the remote machine, it sends an ACK packet and enters
    the TIME_WAIT state, where it stays for an implementation-specified period (RFC
    793 specifies 2 minutes, but other values are used).


    If the remote initiates the normal TCP session closure, the local machine goes
    into the CLOSE_WAIT state after it has received the ACK-FIN packet and sends its
    own ACK packet. When the local machine has sent its ACK-FIN packet, it enters
    the LAST_ACK state and waits for an ACK packet from the remote host.'
  merge: -1
  pgno: 77
- img_proc: true
  md: 'It is possible for some savings to be realized by closing both halves of the
    TCP session at once. This is called a simultaneous close. In this case, the first
    host sends an ACK-FIN packet, the second machine responds with an ACK-FIN packet,
    and then the first machine sends a final ACK packet. This reduces the number of
    datagrams required for session closure from four packets to three. This eliminates
    the FIN_WAIT_2 state from the first box''s series of states.

    Figure 4.2 shows a diagram of the states that a TCP session moves through.


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_78_0.png)


    Figure 4.2 TCP session state diagram.


    # Session Reset


    TCP sessions are normally reset (or aborted) for two reasons. Either the client
    has tried to connect to a nonexistent port, or one of the hosts involved manually
    aborted the session.

    When the server receives the SYN packet from the client requesting a connection
    to a port without a process bound to it, the server responds with a datagram having
    the RST flag set. The client should drop the session as though the client had
    attempted to create a connection to an unavailable port.'
  merge: -1
  pgno: 78
- img_proc: true
  md: '# Chapter 4 Transport-Layer Protocols


    When a session is aborted by one side of the connection, it sends a datagram with
    the RST flag set. The other machine does not send a response; it aborts the session
    and notifies the application layer that has reset the session.


    # Timing Out


    Keepalive timers are not part of the TCP specification, but this has not kept
    some TCP/IP protocol stacks from implementing them. Generally, keepalive packets
    are sent after a wait of two hours. When the packet is sent, three possible outcomes
    are:


    +   - The remote host is unreachable.

    - The remote host is reachable, but the connection is dead.

    - The remote host is reachable and the connection is still live.


    In the first case, the local host will retry keepalives nine more times, at 75-second
    intervals. If there is no response, it will close the connection. Note that the
    remote host could be unreachable because it has crashed, turned off, or so on;
    this is reasonable cause to shut down a connection. The remote host could also
    be unreachable because of a transient network error; this is not a very good reason
    to shut down the connection. The local host has no way of determining which the
    remote host failed to respond, so it sometimes closes pockets left open.


    In the second case, the remote host will reply with a RST packet and the local
    host will close the connection. This is a special case of a port being unavailable
    (described earlier).

    in the third case, the remote host will respond with an ACK packet, and the connection
    will be alive.


    # T/TCP


    Because TCP imposes an overhead of seven packets just for setup and shutdown of
    a session (and often additional packets carrying acknowledgments), it is not well
    suited for short, repeated traffic. A solution that allows transactional traffic
    is defined in RFC 1379. Transactional TCP (T/TCP) allows a single TCP session
    to carry multiple transactions. This is done by adding a 4-byte Connection Count
    (CC) field to the TCP header. Each transaction within the TCP session uses a unique
    CC, and each host must keep track of the current, valid CC of the remote host
    in the session.


    # TCP Decoded


    The captured packet in Figure 4.3 shows a Source Port of x0413 (1043) and a Destination
    Port of x1770 (6000). The source and destination ports are both in the range available
    for clients, but the destination is the well-known port (or the registered port)
    for the X-11 system and is the server in this exchange. The source machine has
    a current Sequence number of 330802776 and is sending an Acknowledggment for byte
    32703426 (the next byte that it expects to see). The Header Length is set to 08,
    representing 32 bytes of header. This is followed by the required padding and
    flags at 0x18 (00011000 in binary), which represents ACK and PUSH. The Window
    Size is set to 0x7900 (30976 bytes). The Checksum is 0x5e75.'
