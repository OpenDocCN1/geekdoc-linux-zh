  md: '# Appendix B RFC-1123


    # 6.1.3.5 Extensibility


    DNS software MUST support all well-known, class-independent formats [DNS:2], and
    SHOULD be written to minimize the trauma associated with the introduction of new
    well-known types and local experimentation with non-standard types.


    DISCUSSION:


    The types and classes used by the DNS are extensible, and thus new types will
    be added and old types deleted or redefined. Introduction of new data types ought
    to be dependent only upon the rules for compression of domain names inside DNS
    messages, and the translation between printable (i.e., master file) and internal
    formats for Resource Records (RRs).


    Compression relies on knowledge of the format of data inside a particular RR.
    Here compression must only be used for the contents of well-known, class-independent
    RRs, and must never be used for class-specific RRs or RR types that are not known.
    The owner name of an RR is always eligible for compression.


    A name server may acquire, zone transfer, RRs that the server doesn''t know how
    to convert to printable format. A resolver can receive similar information as
    the result of queries. For proper operation, this data must be preserved, and
    the implication that DNS software cannot use textual formats for internal storage.


    The DNS defines name syntax very generally—a string of labels each containing
    up to 8 octets, separated by dots, and with a maximum of 255 octets. Particular
    applications of the DNS are permitted to further constrain the syntax of the domain
    names they use, although the DNS deployment has led to some applications allowing
    more general names. In particular, Section 2.1 of this document liberalizes slightly
    the syntax of a legal Internet host name that was defined in RFC-952 [DNS:4]:


    # 6.1.3.6 Status of RR Types


    Name servers MUST load all RR types except MD and MF from configuration files.
    The MD and MF types are obsolete and MUST NOT be implemented; in particular, name
    servers MUST NOT load these types from configuration files.


    DISCUSSION:


    The RR types MB, MG, NULL, MINFO and RP are considered experimental, and applications
    that use the DNS cannot expect these RR types to be supported by most domains.
    Furthermore these types are subject to redefinition.


    The TXT and WKS RR types have not been widely used by Internet sites; as a result,
    an application cannot rely on the existence of a TXT or WKS RR in most domains.


    # 6.1.3.7 Robustness


    DNS software may need to operate in environments where the root servers or other
    servers are unavailable due to network connectivity or other problems. In this
    situation, DNS name servers and resolvers MUST continue to provide service for
    the reachable part of the name space, while giving temporary failures for the
    rest.'
