  md: '# Other Resources


    There are the three kinds of resources that will make this book more useful:


    +   - The book''s Web site

    - Mailing lists

    - Your network


    As mentioned in the previous section, I maintain a Web site for this book. It
    contains information about mailing lists related to this book (questions, errata,
    and announce-new editions). It has all the known errata online, and a system for
    submitting errata. I tried to build a good section of links to tools and other
    information that is also maintained. The Web site also has the full text of Chapters
    9, 10, and 11 (these are built frequently from the source, so they are more up-to-date
    than the book).


    In addition to the mailing list I maintain for this book, there are many other
    mailing lists pertaining to TCP/IP, networking, and Linux. Some of them are linked
    to the book''s Web page. Get involved—You’ll learn a lot.


    Probably the best resource, though, is your own network. Grab Ethereal (see Chapter
    10, "Monitoring Tools") and start watching the traffic. Read a chapter of the
    book, then fire up Ethereal and watch the traffic in real life. There’s no teacher
    like experience.


    # How This Book Was Written


    This book was written in Docbook and compiled to pdf for the technical reviewers
    and rtf for the publisher. I used emacs (with psgnl mode) to compose the Docbook.
    The source code was kept in cvs. All the actual writing occurred on an IBM Thinkpad
    240 running Red Hat Linux 6.2 (with a few extras). This book would never have
    been possible without the rich tools made available by the wonderful world of
    free software.'
