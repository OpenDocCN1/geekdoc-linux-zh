    # Saving a Capture File


    Having captured a piece of network traffic, you''ll probably want to look at it
    again later. Ethereal allows you to save your capture to a file. This can be done
    from the command line (the only way to do it with Tether), from the Capture Preferences
    screen, or after you''ve stopped a capture by selecting File, Save (which is also
    accessible from the keyboard shortcut Ctrl+S). This brings up the Save Capture
    As window. This window enables you to save your capture in many formats; it also
    enables you to save only the currently displayed packets (using the Save Only
    Packets Currently Displayed button.)


    # Viewing Saved Captures


    Sometimes you''ll want to look at traffic that''s no longer moving on the network
    (either for diagnostics or to review or learn more about a protocol). For these
    cases, Ethereal provides a convenient method for saving and viewing captured files.
    In fact Ethereal provides the capability to view captures saved from other applications.


    To view a saved capture, select File, Open, which brings up the Capture File interface.
    This window presents a common file selection tool with which you should select
    the name of the capture file that you want to view. You can also select the file
    on startup, using ethereal -r capturefile.'
