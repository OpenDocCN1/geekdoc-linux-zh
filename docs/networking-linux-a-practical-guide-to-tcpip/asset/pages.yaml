  md: '# 1. INTRODUCTION


    This document is one of a pair that defines and discusses the requirements for
    host system implementations of the Internet protocol suite. This RFC covers the
    layers and support protocols. Its companion RFC, "Requirements for Internet Hosts—Communications
    Layers" [INTRO:1] corrects the lower layer protocols: trans-port layer, IP layer,
    and link layer.


    These documents are intended to provide guidance for vendors, implement, and users
    of Internet communication software. They represent the consensus of a large body
    of technical experience and wisdom, contributed by members of the Internet research
    and vendor communities.


    This RFC enumerates protocols that a host connected to the Internet must use,
    and incorporates by reference the RFCs and other documents describing the current
    specifications of these protocols. It corrects errors in the referred documents
    and adds additional discussion and guidance for an implementor.


    For each protocol, this document also contains an explicit set of requirements,
    recommendations, and options. The reader must understand that the list of requirements
    in this document is incomplete by itself; the complete set of requirements for
    an Internet host is primarily defined in the standard protocol specification documents,
    with the corrections, amendments, and supplements contained in this RFC.


    A good-faith implementation of the protocols that was produced after careful reading
    of the RFC''s and some interaction with the Internet technical community, and
    that followed good communications engineering practices, should differ from the
    requirements of this document in only minor ways. Thus, in many cases, the "requirements"
    in this RFC are already stated or implied in the standard protocol documents,
    however, they were included because some past implementation has made the wrong
    choice, causing problems of interoperability, performance, and or robustness.
    This document includes discussion and explanation of many of the requirements
    and recommendations. A simple list of requirements would be dangerous:


    +   - Some required features are more important than others, and some features
    are optional.

    - There may be valid reasons why particular vendor products are designed for restricted
    contexts might choose to use different specifications.


    However, the specifications of this document must be followed to meet the general
    goal of arbitrary host operation across the diversity and complexity of the Internet
    system. Although most current implementations fail to meet these requirements
    in various ways, some minor and some major, this specification is the ideal toward
    which we need to move.


    These requirements are based on the current level of Internet architecture. This
    document will be updated as needed to provide additional clarifications or to
    include additional information in areas in which specifications are still evolving.'
  merge: -1
  pgno: 321
- img_proc: true
  md: '# Introduction 305


    This introductory section begins with general advice to host software vendors,
    and then gives some guidance on reading the rest of the document. Section 2 contains
    general requirements that may be applicable to all application and support protocols.
    Sections 3, 4, and 5 contain the requirements on protocols for the three major
    applications-: Telnet, file transfer, and electronic mail, respectively. Section
    6 covers the support applications: the domain name system, system initialization,
    and management. Finally, all references are found in Section 7.


    # 1.1 The Internet Architecture


    For a brief introduction to the Internet architecture from a host viewpoint, see
    Section 1.1 of [INTRO:1]. That section also contains recommended references for
    general background on the Internet architecture.


    # 1.2 General Considerations


    There are two important lessons that vendors of Internet software have learned
    and which a new vendor should consider seriously.


    # 1.2.1 Continuing Internet Evolution


    The enormous growth of the Internet has revealed problems of management and scaling
    in a large datagram-based packet communication system. These problems are being
    addressed, and as a result there will be evolution of the specifications described
    in this document. These changes will be carefully planned and controlled, since
    there is extensive participation in this planning by the vendors and by the organizations
    responsible for operations of the networks.

    Development, evolution, and revision are characteristic of computer network protocols
    today, and this situation will persist for some years. A vendor who develops computer
    communication software for the Internet protocol suite (or any other protocol
    suite!) and fails to maintain and update software for changing specifications
    is going to leave a trail of unhappy customers. The Internet is a large communication
    network, and the users are in constant contact throughout it. Experience has shown
    that knowledge of deficiencies in vendor software propagates quickly through the
    Internet technical community.


    # 1.2.2 Robustness Principle


    At every layer of the protocols, there is a general rule whose application can
    lead to enormous benefits in robustness and interoperability:

    “Be liberal in what you accept, and conservative in what you send.",


    Software should be written to deal with every conceivable error, no matter how
    unlikely; sooner or later a packet will come with that particular combination
    of errors and attributes, and unless the software is prepared, chaos can ensue.
    In general, it'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# 306 Appendix B RFC-1123


    is best to assume that the network is filled with malevolent entities that will
    send in packets designed to have the worst effect. This assumption will lead to
    suitable protective design, although the most serious problems in the Internet
    have been caused by unenvisaged mechanisms triggered by low-probability events;
    human malice would never have taken such a devious course!


    Adaptability to change must be designed into all levels of Internet host software.
    As a simple example, consider a protocol specification that contains an enumeration
    of values for a particular header field-e.g., a type field, a port number, or
    an error code; this enumeration must be assumed to be complete. Thus, if a protocol
    specification defines four error codes, the software will not break when a fifth
    code shows up. An undefined code might be logged (see below), but it will not
    cause a failure. The second part of the principle is as important as untold: software
    on other hosts may contain deficiencies that make it unwise to exploit legal but
    obscure protocol features. It is unwise to stray far from the obvious and simple,
    lest unintended effort result elsewhere. A corollary of this is “watch out for
    misbehaving hosts”; host software should be prepared, not just to survive other
    misbehaving hosts, but also to cooperate to limit the amount of disruption such
    hosts have caused to the shared communication facility.


    # 1.2.3 Error Logging


    The Internet includes a great variety of host and gateway systems, each implementing
    many protocols and protocol layers, and some of these contain bugs and misfeatures
    in their Internet protocol software. As a result of complexity, diversity, and
    distribution of function, the design of user problems is often very difficult.
    Problem design will be aided if implementations include a carefully designed facility
    for logging erroneous or “strange” protocol events. It is important to include
    as much diagnostic information as possible to record the header(s) of a packet
    that caused an error. However, care must be taken to ensure that error logging
    does not consume prohibitive amounts of resources or interfere with the operation
    of the host.


    There is a tendency for abnormal but harmless protocols to overflow error logging
    files; this can be avoided by using a “circular” log, or by enabling logging only
    while diagnosing a known failure. It may be useful to filter and count duplicate
    successive messages. One strategy that seems to work well is: (1) always count
    abnormalities and make counts accessible through the management protocol (Section
    6.3); and (2) allow the logging of a great variety of events to be selectively
    enabled. For example, it might be useful to be able to “log everything” or “log
    everything for host X.”


    Note that different management may have differing policies about the amount of
    error logging that they want normally enabled in a host. Some will say, “if it
    doesn’t hurt me, I don’t want to know about it,” while others will want to take
    a more watchful and aggressive attitude toward detecting and removing protocol
    abnormalities.'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# 1.2.4 Configuration


    It would be ideal if a implementation of the Internet protocol suite could be
    entirely self-configuring. This would allow the whole suite to be implemented
    in ROM or cast into silicon, it would simplifyless workstations, and would be
    an immense boon to harried LAN administrators as well as system vendors. We have
    not reached this ideal; in fact, we are not even close.


    At many points in this document, you will find a requirement that a parameter
    be a configurable option. There are several different reasons behind such requirements.
    In a few cases, there is current uncertainty or disagreement about the best value,
    and it may be necessary to update the recommended value in the future.e.g, the
    value really depends on external factors—e.g, the size and the distribution of
    its communication load, the speeds and topology of nearby networks—and self-tuning
    algorithms are unavailable and may be insufficient. In some cases, configurability
    is needed because of administrative requirements.


    Finally, some configuration options are required to communicate with obsolete
    or incorrect implementations of the protocols, distributed without sources, unfortunately
    persist in many parts of the Internet. To make correct systems coexist with faulty
    systems, administrators often have to "misconfigure" the correct systems. This
    problem will correct itself gradually as the faulty systems are retired, but it
    cannot be ignored by vendors.


    When we say that a parameter must be configurable, we do not intend to require
    that its value be explicitly read from a configuration file at every boot time.
    We recommend that implementors set up defaults that are inappropriate in a particular
    installation. Thus, the configurability requirement is an assurance that it will
    be POSSIBLE to override the default when necessary, even in a binary-only or ROM-based
    product. This document requires a particular value for such defaults in some cases.
    The choice of default is a sensitive issue when the configuration configuration
    item controls the accommodation to existing faulty systems. If the Internet is
    to converge successfully to complete interoperability, the default values built
    into implementations must implement the official protocol, not "misconfigurations"
    to accommodate faulty implementations.


    Finally, we note that a vendor needs to provide adequate documentation on all
    configuration parameters, their limits and effects.


    # 1.3 Reading this Document


    # 1.3.1 Organization


    In general, each major section is organized into the following subsections:


    +   1. Introduction'
