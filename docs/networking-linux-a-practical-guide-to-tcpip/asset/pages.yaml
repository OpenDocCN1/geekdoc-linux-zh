    enough of them. But we''ll skip over those days and land amid the early stages
    of computer networks.


    +   2. In fact, there are a number of places where overhead is added because the
    nature of a layered approach. We will see many of them as we proceed in our discussion
    of the various protocols. We will also look at methods of mitigating it, where
