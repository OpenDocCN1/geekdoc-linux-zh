  md: '# 5 Application-Layer Protocols


    FROM OUR START DOWN AT THE LINK LAYER in Chapter 2, “Link-Layer Protocols,” we''ve
    moved our way up the protocol stack. Now we''ve reached the top. Here in the lofty
    reaches of the application layer, we see a lot more variety than at any other
    layers we''ve discussed. In this chapter, we''ll discuss three protocols: RIP,
    TFTP, and HTTP. The first two are built on UDP; the third uses TCP.


    # RIP


    The Routing Information Protocol (RIP), is used to pass routing information between
    networked hosts.¹ RIP was officially specified in RFC 1058, which was written
    several years after the protocol was originally implemented in Berkeley UNIX.
    Currently, the most common version of RIP in wide use is RIP version 2, or RIP-2,
    specified in RFC 1388. RIP-2 packets can be understood by older machines running
    RIP because RIP-2 uses the reserved fields of RIP to pass additional information,
    and RIP ignores these fields. For the remainder of this section, we''ll be talking
    about RIP version 2—where the term RIP is used, it refers to RIP-2.'
  merge: -1
  pgno: 94
- img_proc: true
  md: 'RIP provides only a very simple routing scheme: It relies on hop count as the
    only metric for determining which path to take. Each participating host broadcasts
    a message list of its known destination networks with the corresponding hop count.
    Because updates are broadcast only periodically (typically every 30–90 seconds),
    it can take a long time for routes to propagate a network. RIP has a provision
    to keep this to a minimum—anything requiring more than 15 hops is considered unreachable.


    Figure 5.1 shows the routers used to connect several small networks. Table 5.1
    shows the interfaces and IP addresses of these routers (the name is given in the
    format name.interface). This network will be used to show the normal workings
