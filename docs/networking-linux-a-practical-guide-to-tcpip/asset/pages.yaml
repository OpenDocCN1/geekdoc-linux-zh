    a number of less-than-serious RFCs are published. RFC 1149 was one of these.


    +   2. Most modern PPP connections allow the PPP client to “discover” its IP address
    by querying the PPP server. This allows pools of PPP servers to provide dial-up
    connection to end users without them to configure their IP address each they connect.


    +   3. Any time you see a number preceded by the 0x prefix, it is a hexadecimal
    number. Most of the numbers we''ll deal with in TCP/IP decodes are.


    +   4. Please see the “Ethereal” section in Chapter 10,“Monitoring Tools,” for
    more information on how to read these Ethereal screenshots.


    +   5. The RFCs provide a fairly rigid definition for what hosts should do and
    what they must do. I try to follow their usage of these terms. If a host must
    something, it is not considered to have a standards-compliant implementation if
    it fails to do that. If a host “should” can still be standards-compliant even
    without that behavior. These terms are defined in RFC 2119.


    +   6. In 802.3 Ethernet, bytes 13 and 14 are a Length field. This requires 802.3-packets
    to carry type code information in another header inside their Data field.


    +   7. They take up bandwidth and present a problem condition that should be corrected.


    +   8. Although these 3 bytes are unique in theory, some circumstances break this
    rule. Some Ethernet cards and OSes (including Linux) will allow you to set a different
    MAC address; assigning a duplicate address can cause you serious problems. In
    addition, some vendors have quality control issues resulting in duplicate addresses
    being assigned. Fortunately, the latter case is fairly rare.


    +   9. In today’s switched networks, this is not necessarily the case. See the
    brief discussion of switches at the end of Chapter 1,“Preface to a Practical Guide.


    +   10. Because some hosts cannot properly determine their own network and ARP
