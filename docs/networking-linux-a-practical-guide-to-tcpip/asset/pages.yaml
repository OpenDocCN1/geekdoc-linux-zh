- img_proc: true
  md: '# Chapter 5 Application-Layer Protocols


    Unlike the previous two protocols discussed, HTTP is implemented over the TCP
    transmission-layer protocol. The TCP protocol provides session information that
    allows HTTP to avoid doing some of the work that a UDP-based protocol would need
    to.


    HTTP is similar in ways to the TFTP protocol: Both are designed to pass data between
    two network-connected hosts. HTTP does not need to worry about dividing the data
    into explicitly sized blocks and signaling an End of Data condition. It does,
    however, to carry the burden of TCP session setup and teardown.


    The simplest description of HTTP is that it follows a four-step process:⁶⁶


    +   1. The client and server establish a TCP session. The server usually resides
    at TCP port 80.

    2. The client sends an HTTP request. Often this is a GET request and looks like
    this: GET /file.html HTTP/1.0.

    3. The server responds by sending the requested data to the client.

    4. The hosts close their TCP session.


    After the session is set up, the client send a (potentially) multiline HTTP request
    to the server. The parts of the request are shown in Example 5.12.


    > Example 5.12 The HTTP Request Format

    method absolute-path (HTTP/1.0) HTTP/1.1

    (optional directives)


    The method referred to in Example 5.12 can be one of several types; these are
    explained in Table 5.4.


    | Method | Description |

    | --- | --- |

    | DELETE | The DELETE method requests that the server delete the information referenced.
    |

    | GET | The GET method retrieves the information that it references. GET requests
    can be conditional. |

    | HEAD | The HEAD method is similar to the GET method, except that the response
    includes only its header, not the information referenced. |

    | POST | The POST method indicates that data is being transferred to the server
    to be used with the information referenced. |

    | PUT | The PUT method requests that the server store the information accompanying
    it in the location given. |'
  merge: -1
  pgno: 107
- img_proc: true
