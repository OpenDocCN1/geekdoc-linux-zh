    \ crashtdummy (at 192.168.1.20) and cherry (at 192.168.1.10), but could communicate\
    \ with mango and both of the others, I might start checking the arp cache results\
    \ on cherry and mango, and looking at the output from ifconfig on crashtdummy,\
    \ cherry's arp cache is shown in Example 9.7.\n\n# Example 9.7 cherry's arp Cache\n\
    \n```\n[root@cherry]## arp -n\nAddress       Hwtype HWaddr Flags Mask       Iface\n\
    mango         ether      00:A0:D2:1C:64:E8  C               eth0\n192.168.1.20\
    \  ether      00:A0:D2:1C:64:F0  CM              eth0\n[root@cherry]#$\n```\n\n\
    The arp cache for showing in Example 9.8.\n\n# Example 9.8 mango's arp Cache\n\
