    # Real-World Example


    Several ago, I worked for a turn-key systems vendor and was the only one who really
    grokked subnet masks on the team. One day, a customer called with an urgent need
    to reconfigure a networking scheme. The company that had just merged with another
    and needed to join the new location to its existing two. Although we had planned
    for growth, the new office had more hosts than had been projected. It was just
    a simple matter of redoing masks and assigning new address ranges.


    You can guess who got to do it. The only drawback was that my wife and I were
    at the hospital, where she was getting ready to have a baby; fortunately, she
    wasn''t too angry when I got the call. I didn''t have any tools to work out subnets,
    so I ended up doing the math mentally and scratching out a map on the wrapper
    from a set of gloves to pass along to our customer.


    A host knows only its own subnet mask. Any comparisons that it makes are based
    only on its own mask. This can sometimes cause problems. If two hosts on a local
    network have differing subnet masks, they may not be capable of communicating
    with IP.


    # A Discussion of Supernets


    Just as subnets are used to create appropriately smaller networks, a method is
    provided to pool networks, providing larger, more easily routed networks. Supernetting
    helps to solve two problems. First, there are no appropriately sized larger networks
    for the organizations that need them (Class C networks aren''t large enough for
    most companies, and there aren''t enough Class B networks to give to companies
    that really need 10 or 12 bits of host address space). Second, the routing tables
    of Internet core routers become unwieldy when filled with many different Class
    C networks on the periphery of the Internet.'
