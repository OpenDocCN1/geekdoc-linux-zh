    # Nessus at Work


    Nessus, like any other security tool, cannot be run just once to make your network

    ideally, you should run Nessus on a regular basis (perhaps weekly or biweekly),

    and again after any change has been made to your network.


    Running Nessus from inside your network is important to help ensure the internal

    security of your hosts. It should also be run from an external host in order to
    get a

    real world picture of how things look from a cracker''s perspective.


    In this section, we''ll look at the internal scan of a single host in our internal

    network. Coverage includes Nessus, saving and reading reports, and extending

    Nessus by writing tests in NASL.


