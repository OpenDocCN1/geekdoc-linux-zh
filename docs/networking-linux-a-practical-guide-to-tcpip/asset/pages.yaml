    \ a working copy of ngrep installed on your system.\n\n# Using ngrep\n\nTo start\
    \ using ngrep, you'll need to decide what pattern you want to search for. These\
    \ can be libcap-style descriptions of network traffic or GNU grep-style regular\
    \ expressions describing the contents of traffic. In the following example, you'll\
    \ grab a packet containing the pattern sword and display it in the alternative\
    \ format (which is a lot more readable). The results are shown in Example 9.13.\n\
    \n# Example 9.13 Looking for Something with ngrep\n\n```\n[root@cherry /root]#\
    \ # ngrep -x sword\ninterface: eth0 (192.168.1.0/255.255.0)\nmatch: sword\n####################################\n\
    T 192.168.1.10:18:23 -> 192.168.1.10:1056 [AP]\n  50 61 73 73 77 6f 72 64 3a 20\
    \ Password:\n################################\n59 received, dropped\n[root@cherry\
    \ /root]#\n```\n\nEach hash match in this example represents a packet not containing\
    \ the pattern you're searching for; any packets containing the pattern are displayed.\n\
    In this example, you followed the basic syntax of ngrep: ngrep <options> [pattern].\
    \ You used only the -x option, which sets the alternative display format.\n\n\
    # Doing More with ngrep\n\nA number of additional twists are available for the\
    \ way that you can use ngrep. Chief among them is the capability to include libcap-style\
    \ pattern filtering. libcap provides a fairly simple language for filtering traffic."
