    A Server-FTP959 MUST send only correctly formatted replies on the control connection.
    Note that RFC-959 (unlike earlier versions of the FTP spec) contains no provision
    for a "spontaneous" reply message.


    A Server-FTP SHOULD use the reply codes defined in RFC-959 whenever they apply.
    However, a server-FTP MAY use a different reply code when needed, as long as the
    general rules of Section 4.2 are followed. When the implementor has a choice between
