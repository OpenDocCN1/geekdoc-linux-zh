    Unix domain sockets (servers and established)


    ```

    Proto RefCnt Type State I-Node Path

    unix [ ] STREAM CONNECTED 1332 /tmp/X11-unix/0

    unix [ ] STREAM CONNECTED 1330 /tmp/X11-unix/0

    unix [ ] DGRAM 440

