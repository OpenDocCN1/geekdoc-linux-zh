    \ example, each line of comments is preceded by the # symbol.There are no inline\
    \ comments in NASL. You can define your own functions in NASL like this:\n\n```\n\
    function sqr(n)\n{\nreturn(n);\n}\n```\n\n```\ndisplay(\"5 squared is *, sqr(5),\
