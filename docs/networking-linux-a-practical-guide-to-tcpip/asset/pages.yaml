    # # Starting Ethereal


    A number of command-line options exist to help making Ethereal more pleasant.
    Table 10.1 shows some of the more likely candidates.


    # ## Table 10.1 Command Options for Ethereal


    | Option | Meaning |

    |---|---|

    | -i <interface> | This option sets the interface from Ethereal will capture.
    |

    | -k | This option causes Ethereal to begin capturing packets immediately upon
    startup. It must be used with the -x i option. |

    | -S | This option causes Ethereal to display packets as they are captured. |

    | -c <count> | This option causes Ethereal to capture only count packets before
    stopping. It is useful with the -k option. |

    | -D | This option causes Ethereal to treat the TOS field of IP as the original
    TOS, not like Differentiated Services. |

    | -f <capture filter> | This option enables you to set a libcap-style capture
    filter. libcap syntax is covered in the "ngrep" section of Chapter 9, "Troubleshooting
    Tools." |

    | -n | This option disables name resolution; all packets will be displayed with
    IP addresses, TCP ports, and UDP ports. |


    continues'
