    The HTTP response contains a number of interesting parameters. The Last-Modified
    parameter can be used by HTTP proxy servers that cache content. The server then
    knows when to replace their local content with a fresh download from the HTTP
    server. The Content-Length parameter lets the client process know how much data
    to expect (this is used to update the status bar in web browsers). The Keep-Alive
    parameter has two important values: The timeout is the number of seconds the session
    will be open for follow-on transmissions, and the max value is total number of
    file transfers that can be passed in this session.


    # Endnotes


    +   1. For more information on routing, see the section “Routing” in Chapter 3,
    “Network-Layer Protocols."

    2. These are all two-hop routes because bill has added one to the hop count for
    each route, indicating that it must pass through alan.

    3. This can lead to an unfortunate complication. The sender keeps a timer on the
    data that it sends. If the receiver has not acknowledged a block of data before
    the timer expires, the sender will send another copy. If the receiver was merely
    late, it will have sent an acknowledgment for the block and then will send another
    acknowledgment when it receives the second copy. As this continues to happen,
    it creates a snowball effect congesting the network. This is often called the
    Sorcerer''s Apprentice bug, named after the scene in Fantasia in which Mickey
    Mouse conjures up an army of mops to clean the sorcerer''s tower—the mops rapidly
    like the runaway TFTP process that is suffering from this bug.'
