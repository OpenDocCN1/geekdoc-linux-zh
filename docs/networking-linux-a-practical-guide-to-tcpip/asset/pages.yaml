  md: '# Remote Login--Telnet Protocol 313


    DISCUSSION:

    Though more sophisticated "terminals" and supporting option negotiations are becoming
    the norm, all implementations must be prepared to support an NVT for any user-server
    communication.


    # 3.2.2 Telnet Go-Ahead Function: RFC-854, p. 5, and RFC-858


    On a host that never sends the Telnet command Go Ahead (GA), the Telnet Server
    MUST attempt to negotiate the Suppress Go Ahead option (i.e., "WILL Suppress Go
    Ahead"). A User or Server Telnet MUST always accept negotiation of the Suppress
    Go Ahead option.


    When it is driving a full-duplex terminal for which GA has no meaning, a User
    Telnet Discussion ("locked-keyboard") line-at-a-time terminals for which the Go-Ahead
    mechanism was designed has largely disappeared from the scene. It turned out to
    be difficult implementing the Go-Ahead signal in many operating systems, some
    systems that support native half-duplex terminals. The difficulty is typically
    that the Telnet server does not have access to information about the user process
    is blocked awaiting input from the Telnet connection, i.e., it cannot reliably
    determine when to send a GA command. Therefore, most Telnet hosts do not send
    GA commands.


    The effect of the rule in this section is to allow either one of a Telnet connection
    to veto the GA command. There is a class of half-duplex terminals that is still
    commercially important:"data entries," which interact in a full-screen manner.
    However, supporting data entry terminals using the Telnet protocol does not require
    the Go Ahead signal; see Section 3.3.2.


    # 3.2.3 Control Functions: RFC-854, p. 7-8


    The list of Telnet commands has been extended to include EOR (End-of-Record) with
    code 229 [TELNET:9].


    Both User and Server Telnets MUST support the control functions OR, EC, EL, and
    Break, and MUST support AO, AYT, DM, IP, NOP, SB, and SE.


    A host MUST be able to receive and ignore any Telnet control functions that it
    does not support.


    DISCUSSION:

    Note that a Server is required to support the Telnet IP (Interrupt Process) function,
    even if the server host has an equivalent in-stream function (e.g., Control-C
    in many systems). The Telnet IP function may be more than an in-stream command,
    because of the out-of-band effect of TCP urgent data.


    The EOR control function may be used to delimit the stream. An important application
    is data entry support (see Section 3.3.2). There was concern that since EOR, had
    not been defined in RFC-854, a host that was not prepared correctly'
