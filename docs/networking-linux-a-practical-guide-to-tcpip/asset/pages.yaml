  md: '# 3.4 INTERNET/TRANSPORT LAYER INTERFACE


    The interface between the IP layer and the transport layer MUST provide full access
    to all the mechanisms of the IP layer, including options, Type-of-Service, and
    Time-to-Live. The transport layer MUST either have mechanisms to set these interface
    parameters, or provide a path to pass them through an application, or both.


    DISCUSSION:

    Applications are urged to make use of these mechanisms where applicable, even
    when the mechanisms are not currently effective in the Internet (e.g., TOS). This
    will allow these mechanisms to be immediately useful when they do become effective,
    without a large amount of retrofitting of host software.


    We now describe a conceptual interface between the transport layer and the IP
    layer, as a procedure of calls. This is an extension of the information in Section
    3.3 of RFC-791 [IP:1].


    +   - Datagram—SEND(src, dst, prot, TOS, TTL, BufPTR, len, Id, DF, opt => result
    )

    - where the parameters are defined in RFC-791. Passing an ID parameter is optional;
    see Section 3.2.1.5.

    - Datagram—RECV(BufPTR, prot => result, src, dst, SpecDest, TOS, len, opt)


    All parameters are defined in RFC-791, except for SpecDest = specific-destination
    address of datagram (defined in Section 3.2.1.3) The parameter result dst contains
    the datagram''s destination address. This may be a broadcast or multicast address,
    the SpecDest parameter (not shown in RFC-791) MUST be passed. The parameter opt
    contains all the IP options received in the datagram; these MUST also be passed
    to the transport layer.


    +   - Select Source Address—GET_SRCADDR(remote, TOS) -> local remote = IP address

    - TOS = Type-of-Service

    - local = local IP address

    - See Section 3.3.4.3.

    - Find Maximum Datagram Sizes—GET_MAXSIZES(local, remote, TOS) -> MMS_R, MMS_S

    - MMS_R = maximum receive transport-message size.

    - MMS_S = maximum send transport-message size.

    (local, remote, TOS defined above)

    - See Sections 3.3.2 and 3.3.3.

    - Advice on Delivery Success—ADVISE_DELPROB(sense, local, remote, TOS)'
