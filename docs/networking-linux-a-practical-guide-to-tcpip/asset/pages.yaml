    # # 6. SUPPORT SERVICES


    # ## 6.1 DOMAIN NAME TRANSLATION


    # ### 6.1.1 INTRODUCTION


    Every MUST implement a resolver for the Domain Name System (DNS), and it MUST
    implement a mechanism using this DNS resolver to convert host names to IP addresses
    and vice-versa [DNS:1, DNS:2].

    in addition to the DNS, a host MAY also implement a host name translation mechanism
    that searches a local Internet host table. See Section 6.1.3.8 for more information
    on this option.


    DISCUSSION:

    Internet host name translation was originally performed by searching local copies
    of a table of all hosts. This table became too large to update and distribute
    in a timely manner and too small to fit into many hosts, so the DNS was invented.

    The DNS creates a distributed database used primarily for the translation between
    host names and host addresses. Implementation of DNS software is required. The
    DNS consists of two logically distinct parts: name servers and resolvers (although
    implementations often combine these two logical parts in the interest of efficiency)
    [DNS:2]. Domain servers store authoritative data about certain sections of the
    database and answer queries about the data. Domain resolvers query name servers
    on behalf of user processes. Every host needs a DNS resolver; some machines will
    also need to run name servers. Because no server have complete information, in
    general it is necessary to obtain information from more than one server to resolve
    a query.


    # ### 6.1.2 PROTOCOL WALK-THROUGH


    An implementor must study references [DNS:1] and [DNS:2] carefully. They provide
    a thorough description of the theory, protocol, and implementation of the domain
    name system, and reflect several years of experience.'
  merge: -1
  pgno: 374
- img_proc: true
  md: '# 6.1.2.1 Resource Records with Zero TTL: RFC-1035 Section 3.2.1


    All DNS name servers and resolvers MUST properly handle RRs with a zero TTL: return
    the RR to the client but do not cache it.


    DISCUSSION:

    Zero TTL values are interpreted to mean that the RR can only be used for the action
    in progress, and not be cached; they are useful for extremely volatile data.


    # 6.1.2.2 QCLASS Values: RFC-1035 Section 3.2.5


    A query with "QCLASS-*" SHOULD NOT be used unless the requestor is seeking data
    from more than one class. In particular, if the requestor is only interested in
    Internet data types, QCLASS=IN MUST used.


    # 6.1.2.3 Unused Fields: RFC-1035 Section 4.1.1


    Unused fields in a query or response message MUST be zero.


    # 6.1.2.4 Compression: RFC-1035 Section 4.1.4


    Name servers MUST use compression in responses.


    DISCUSSION:

    Compression is essential to avoid overflowing UDP datagrams; see Section 6.1.3.2.


    # 6.1.2.5 Misusing Configuration Info: RFC-1035 Section 6.1.2


    Recursive name servers and full-service resolvers generally have some configuration
    containing hints about the location of root or local name servers. An implementation
    MUST NOT include any of these hints in a response.


    DISCUSSION:

    Many implementers have found it convenient to store these hints as they were cached
    data, but some neglected to ensure that this "cached data" was not included in
    responses. This has caused serious problems in the Internet when the hints were
    obsolete or incorrect.


    # 6.1.3 SPECIFIC ISSUES


    # 6.1.3.1 Resolver Implementation


    A name resolver SHOULD be able to multiplex concurrent requests if the host supports
    concurrent processes.


    In implementing a DNS resolver, one of two different models MAY optionally be
    chosen: a full-service resolver, or a stub resolver.


    (A)Full-Service Resolver—A full-service resolver is a complete implementation
    of the resolver service, and is capable of dealing with communication failures,
    failure of individual name servers, location of the proper server for a given
    name, etc. It must satisfy the following requirements:


    +   * The resolver MUST implement a local caching function to avoid repeated remote
    access for identical requests, and MUST time out information in the cache.'
