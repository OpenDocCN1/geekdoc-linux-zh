  md: '# Introduction


    Welcome to Networking Linux: A Practical Guide to TCP/IP. I hope you learn as
    much by reading this book as I did by writing it. I found out a lot of things—about
    networking, about writing, and about myself. To help you get as much from this
    book as possible, I''d like to share the following ideas about what you''ll find
    between the covers, and how to best make use of it.


    Enjoy!


    # Organization of this Book


    This book is divided into three parts, with an initial chapter (Chapter 1) that
    is not included in the parts. Chapter 1, “Prelude to a Practical Guide,” gives
    an overview of the terminology and technology used through the rest of the book.
    Included in the appendices are some important RFCs. While these documents are
    available on the ''Net, having them bound with this book, and indexed, should
    be a real win.


    Part I of this book, “The Protocols,” provides a layer-by-layer look at the protocols.
    It reviews the use of these protocols, details the structure of the packets that
    make them up, and explains how they interoperate to make networks work.


    Part II, “Using the Protocols Effectively,” covers network administration from
    a hands-on point of view. Most of the emphasis is on troubleshooting, with a chapter
    detailing a problem-solving approach, and another giving case studies of network
    problems. This part also includes a chapter covering network baselining.


    Part III, “Tools for your Toolkit,” provides an introduction to a number of free
    tools that will make your networking life easier. These introductions cover the
    installation and use of tools for network troubleshooting, network monitoring,
    and network security. Part III is covered by the Open Publication License (OPL),
    so it’s free software! The most recent version of this section is online on the
    Book’s Web site (http://www.networkinglinux.com). The DocBook source is available,
    and you''re invited to help make it the best guide to find networking software
    available.


    If you''re new to networking, start out with Chapter 1, then read Part I. After
    you have a handle on networks, you can read Part II and III in bits and pieces.
    The order you read these is more interest-based than anything else.


    If you''ve already working with networks with a skim, follow up new in the appropriate
    chapter in Part I. You’ll probably want to refer back to Part I occasionally as
    you work through the rest of the book. Parts II and III are aimed at you. Read
    Part II, and add the ideas contained therein to you bag of networking tricks.
    Then read through Part III in whatever order interests you. The applications listed
    there are a great set of tools for any networking professional. Hopefully you''ll
    find a shiny new to keep you occupied.'
  merge: -1
