  md: 'To make the "QUOTE" command useful, a User-FTP SHOULD send transfer control
    commands to the server as users enter them, rather than saving all the commands
    and sending them to the server only when a data transfer is started.

    DISCUSSION:

    The "QUOTE" command essential allows the user to access servers that require system-specific
    commands (e.g., SITE or ALLO), or to invoke new or optional features that are
    not implemented by the User-FTP. For example, "QUOTE" may be used to specify "TYPE
    T" to send a file to hosts that require the distinction, even if the User-FTP
    does not recognize TYPE.


    # 4.1.4.3 Displaying Replies to User


    A User-FTP SHOULD display the user full text of all error reply messages it receives.
    It SHOULD have a "verbose" mode in which all commands it sends and the full text
    and reply codes are displayed, for diagnosis of problems.


    # 4.1.4.4 Maintaining Synchronization


    The state machine in a User-FTP SHOULD be forgiving of missing and unexpected
    reply messages, in order to maintain command synchronization with the server.


