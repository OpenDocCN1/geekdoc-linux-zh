    # 2. LINK LAYER


    # 2.1 INTRODUCTION


    All Internet systems, both hosts and gateways, have the same requirements for
    link layer protocols. These requirements are given in Chapter 3 of "Requirements
    for Internet Gateways" [INTRO:2], augmented with the material in this section.


    # 2.2 PROTOCOL WALK-THROUGH


    None.


    # 2.3 SPECIFIC ISSUES


    # 2.3.1 Trailer protocol Negotiation


    The trailer protocol [LINK:1] for link-layer encapsulation MAY be used, but only
    when it has been verified that both systems (host or gateway) involved in the
    link-layer communication implement trailers. If the system does not dynamically
    negotiate use of the trailer protocol on a per-destination basis, the default
    configuration MUST disable the protocol.


    DISCUSSION:


    The trailer protocol is a link-layer encapsulation technique that rearranges the
    data contents of packets sent on the physical network. In some cases, trailers
    improve the throughput of higher layer protocols by reducing the amount of data
    copying within the operating system. Higher layer protocols are unaware of trailer
    use, but both the sending and receiving host understand the protocol if it is
    used.


    Improper use of trailers can result in very confusing symptoms. Only packets with
    specific size attributes are encapsulated using trailers, and typically only a
    small fraction of the packets being exchanged with a system that does not, packets
    disappear into a black hole while others are delivered successfully.'
