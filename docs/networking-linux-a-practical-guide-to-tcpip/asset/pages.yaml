    DISCUSSION:


    Internet host implementers have used two different conceptual models for multihoming
    briefly summarized in the following discussion. This document takes no stance
    on which model is preferred; each seems to have a place. This ambivalence is reflected
    in the issues (A) and (B) being optional.


    +   Strong ES—The Strong ES (End System, i.e., host) model emphasizes the host/gateway
    (ES/IS) distinction, and would therefore substitute MUST for MAY in issues (A)
    and (B) above. It tends to model a multihomed host as a set of logical hosts within
    the same physical host.


    With respect to, proponents of the Strong ES note that automatic Internet routing
    mechanisms could not route a datagram to a physical interface that did not correspond
    to the destination address. Under the Strong ES model, the route computation for
    an outgoing datagram is the mapping:

    route(src IP addr, dest IP addr, TOS) -> gateway


    Here the source address is included as a parameter in order to select a gateway
    that is directly reachable on the physical interface. Note that this model logically
    requires in general there be at least one default gateway, and preferably defaults,
    for each IP source address.


    +   Weak ES Model—This view deemphasizes the ES/IS distinction, and would therefore
    substitute MUST NOT for MAY in issues (A) and (B). This model may be the more
    natural one for hosts that wiretap gateway routing protocols, and is necessary
    for hosts that have embedded gateway functionality.


    The Weak ES model may cause the Redirect mechanism to fail. If a datagram is sent
    out a physical interface that does not correspond to the destination address,
    the first gateway will not realize when it needs to send a Redirect. On the other
    hand, if the host has embedded gateway functionality, then it has routing information
    without listening to Redirect.


    In the Weak ES model, the route computation for an outgoing datagram is the mapping:

    route(dest IP addr, TOS) -> gateway, interface


    # 3.3.4.3 Choosing a Source Address


    DISCUSSION:


    When it is an initial connection request (e.g., a TCP "SYN" segment) or a data-service
    request (e.g., a UDP-based query), the transport layer on a multihomed host needs
    to know which source address to use. If the application does not specify it, the
    transport layer must use the IP layer to perform the conceptual mapping:

    GET_SRCADDR(remote IP addr, TOS) -> local IP address


    Here TOS is the Type-of-Service value (see Section 3.2.1.6), and the result is
    the desired source address. The following rules are suggested for implementing
    this mapping:

    (a)If the remote Internet address lies on one of the (sub-) nets) which the host
    is directly connected, a corresponding source address must be chosen, unless the
    corresponding interface is known to be down.'
