  pgno: 239
- img_proc: true
  md: '# IMPLEMENTATION:


    On an Ethernet, packets encapsulated with trailers use a distinct Ethernet type
    [LINK:1], and trailer negotiation is performed at the time that ARP is used to
    discover the link-layer address of a destination system.


    Specifically, the ARP exchange is completed in the usual manner using the normal
    IP protocol type, but a host that wants to speak trailers will send an additional
    "ARP reply" packet, i.e., an ARP reply that specifies the trailer encapsulation
    protocol but otherwise if a host configured to use trailers receive an ARP reply
    message from a remote machine, it can add that machine to the list of machines
    that understand trailers, e.g., by marking the corresponding entry in the ARP
    cache.


    Hosts wishing to receive trailer encapsulations send ARP replies whenever they
    complete exchanges of normal ARP messages for IP. a host that received an ARP
    request for its IP protocol address would send a trailer reply in addition to
    the normal IP ARP reply; a host that sent the ARP request would send a trailer
    reply when it received the corresponding ARP reply.


    In this way, either the requesting or responding host in an ARP exchange may request
    that it receive trailer encapsulations.


    This scheme, using extra ARP reply packets rather than sending an ARP request
    for the trailer protocol, was designed to avoid a continuous exchange of ARP packets
    with a misbehaving host, contrary to any specification or common sense, responded
    to an ARP reply for trailers with another ARP reply for IP. This problem is avoided
    by sending a trailer ARP reply in response to an ARP reply only when the IP ARP
    reply answers an outstanding request; this is true when the hardware address for
    the host is still unknown when the ARP reply is received. A trailer ARP reply
    may be sent along with an ARP reply responding to an ARP request.


    # 2.3 Address Resolution Protocol—ARP


    # 2.3.1 ARP Cache Validation


    An implementation of the Address Resolution Protocol (ARP) [LINK:2] MUST provide
    a mechanism to flush out-of-date cache entries. This mechanism involves a timeout,
    it SHOULD be possible to configure the timeout value.


    A mechanism to prevent ARP flooding (repeatedly sending an ARP Request for the
    same IP address, at a high rate) MUST be included. The recommended maximum rate
    is 1 per second destination.


    DISCUSSION:


    The ARP specification [LINK:2] suggests but does not require a timeout mechanism
    to invalidate cache entries when hosts change their Ethernet addresses. The prevalence
    of proxy ARP (see Section 2.4 of [INTRO:2]) has significantly increased the likelihood
    that cache entries in hosts will become invalid, and therefore some ARP-cache'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# Appendix A RFC-1122


    invalidation mechanism is not required for hosts. Even in the absence of proxy
    ARP, a long-period cache timeout is useful in order to automatically correct any
    bad ARP data that might have been cached.


    IMPLEMENTATION:

    Four mechanisms have been used, sometimes in combination, to flush out-of-date
    cache entries.


    +   1. Timeout—Periodically time out cache entries, if they are in use. Note that
    this timeout should be restarted when the cache entry is "refreshed" (by observing
    the source fields, regardless of target address, of an ARP broadcast from the
    system in question). For proxy ARP situations, the timeout needs to be on the
    order of a minute.


    +   2. Unicast Poll—Actively poll the remote host by periodically sending a point-to-ARP
    Request to it, and delete the entry if no ARP Reply is received from N successive
    polls. Again, the timeout should be on the order of a minute, and typically N
    is 2.


    +   3. Link-Layer Advice—If the link-layer driver detects a delivery problem,
    flush the corresponding ARP cache entry.


    +   4. Higher-layer Advice—Provide a call from the Internet layer to the link
    layer to indicate a delivery problem. The effect of this call would be to invalidate
    the corresponding cache entry. This would be analogous to the


    ADVISE_DELIVPROB call from the transport layer to the Internet layer (see Section
    3.4), and in fact the ADVISE_DELIVPROB routine might in turn call the link-layer
    advice routine to invalidate the ARP cache entry.


    Approaches (1) and (2) involve ARP timeouts on the order of a minute or less.
    In the absence of proxy ARP, this short could create noticeable overhead traffic
    on a large Ethernet. Therefore, it may be necessary to configure a host to lengthen
    the ARP cache timeout.


    # 2.3.2.2 ARP Packet Queue


    The link layer SHOULD save (rather than discard) at least one (the latest) packet
    of each set of packets destined to the same unresolved IP address, and transmit
    the saved packet when the address has resolved.


    DISCUSSION:


    Failure to follow this recommendation causes the first packet of every exchange
    to be lost. Although higher-layer protocols can generally cope with packet loss
    by retransmission, packet loss does impact performance. For example, loss of a
    TCP open request causes the initial round-trip time estimate to be inflated. UDP-based
    applications such as the Domain Name System are more seriously affected.'
