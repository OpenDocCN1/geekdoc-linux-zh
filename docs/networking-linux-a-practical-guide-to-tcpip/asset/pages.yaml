  md: '# Chapter 3 Network-Layer Protocols


    When kumquat receives the frame, it reads the IP address and sees that the datagram
    is addressed to itself. Any return traffic would go through the same steps.


    # A Single-Hop Routing Example


    When cherry sends traffic to patton, it again compares IP addresses. In this case,
    192.168.1.10 is in a different network than 192.168.0.12, so cherry will have
    to send its traffic via a router. Then cherry checks its routing table. There
    are no explicit routes for the 192.168.0.0 network, but there is a default gateway
    entry, so cherry will route through it. The IP datagram is addressed to patton
    and put into an Ethernet frame with ups''s MAC address.


    When ups receives the Ethernet frame, it sees that the IP address is not local.
    Because ups is configured to forward (or) packets, it checks its routing table
    to determine the next hop for the IP datagram. However, patton is on a locally
    connected network, so the datagram is put into an Ethernet frame with patton''s
    MAC address and is sent out through the appropriate network interface.


    When patton receives the frame, it checks the IP address in the IP datagram and
    determines that the datagram is for local delivery.


    After the IP hop has finished with the datagram and the application has returned
    a response, patton checks its own IP address against cherry''s. It finds that
    cherry is not local, so patton will need to use a router to deliver the datagram
    carrying the response.


    Next, patton checks its routing table and finds that ups is the proper router
    for the 192.168.0/24 network. The datagram is then addressed to cherry and put
    into an Ethernet frame addressed to ups.


    Finally, ups checks the IP dat address and sees that it is for cherry. Checking
    its routing table, ups finds that cherry is locally connected. The datagram is
    put into a new Ethernet frame addressed to cherry and is sent out through the
    appropriate network interface.


    # A Two-Hop Routing Example


    When coke wants to send an IP datagram to patton, it first compares its IP address
    with patton''s in light of its subnet mask. 192.168.2.511 and 192.168.0.12 are
    in different networks, so coke checks its routing table for an appropriate entry.
    There is no explicit route for the 192.168.0.0 network, so coke uses its default
    gateway.


    The IP datagram addressed to patton is put into an Ethernet frame, fedex checks
    the enclosed IP datagram and sees that it is addressed to 192.168.0.12. The 192.168.0.0
    network is not directly attached to fedex, so it looks in its routing table to
    see where to send the datagram. There is no explicit route out, fedex uses its
    default gateway, ups. The IP datagram is put into a Ethernet frame addressed to
    ups and is sent out through the appropriate network interface.'
