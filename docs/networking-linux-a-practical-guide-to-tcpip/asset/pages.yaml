  md: '# Chapter 1 Prelude to a Practical Guide


    Because we are dealing with the protocols, it really doesn''t matter which program
    sends the mail as long as it implements the Simple Mail Transfer Protocol (SMTP).
    Often multiple programs implement the same protocol—sendmail, qmail, and postfix
    are just a few mail transfer agents (MTAs) that implement SMTP. A user doesn''t
    generally use an MTA directly; instead, the user uses a mail agent (MUA) as pine,
    balsam, or evolution.


    After I''ve finished writing the email message in my MUA, it is handed to the
    MTA for delivery.The MTA determines mango''s address and then sends the message
    and mango''s address to TCP for handling at the transport layer (see Figure 1.5).


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_23_0.png)


    Figure 1.5 An email message in a TCP segment.


    TCP then initiates a session with mango, and after the session is set up (courtesy
    of the lower layers), it sends series of segments containing the email message
    down to IP at the network layer. Each segment in the session contains enough information
    to identify the unique process on each machine and what part of the application-layer
    message it carries (see Figure 1.6).


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_23_1.png)


    Figure 1.6 A TCP segment in an IP datagram.


    IP uses the initial segments (the request to set up the session) and determines
    where to send its datagrams. If the destination is not on the local network, IP
    must determine the appropriate gateway to send them. In this case, cherry and
    mango are on the same network, no routing is required. IP passes its datagrams
    down to the Ethernet device handler on the link layer for delivery (see Figure
    1.7).


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_23_2.png)


    Figure 1.7 An IP datagram in an Ethernet packet.'
  merge: -1
