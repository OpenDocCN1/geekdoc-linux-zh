  md: 'Two Stories of Problem Solving


    # # Two Stories of Problem Solving


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_130_0.png)


    # True to Life


    The following two sections might read like something that really happened. That''s
    not surprising—it did. I''ve changed the names to protect the innocent (and the
    guilty).


    Well, this is really one story in two parts. The first section details the misguided
    attempts to fix a problem he had come across. He doesn''t use our nine-step pattern.
    The second section follows the actions of two system admins who came behind the
    first attempt and had to clean things up. They did the pattern, and their results
    were much better.


    # # Catching a Greased Pig


    At one company I know of, a central mail server was located off-site. It not only
    received the inbound mail and served it via POP3, but it relayed all the outgoing
    mail.


    At one point, a user doing systems administration work (we''ll call him Rob) added
    a new machine to the network in one of the company''s two offices. After assigning
    the remote machine as the SMTP gateway in pipe for the new machine, had someone
    send mail to the new user and verified that he could check his mail via the POP3
    server. All worked as expected. Next he tried to send external mail. This time,
    it failed.


    Thinking that he might misconfigured his mail client, Rob tried reinstalling it.
    After configuring the SMTP gateway in pipe to the central mail server, Rob tried
    sending mail to an external address. It failed again. Next Rob tried setting up
    another mailer on the same host. He configured it to use the mail server as its
    SMTP gateway and tried to send external mail. Once more, it failed.


    Rob decided that he might have not installed Linux correctly, so he installed
    Windows 98 on the machine to test things. After setting Outlook to use the mail
    server, he tried it again. Still no luck. At this point, Rob decided that it must
    be a server problem. He restarting the mail server and resending his test message,
    to no avail. Finally, he did in it 0² to show off the box. After the system administrators
    rebuilt things, they took a look around the system to see what was going on.


    # # By the Book


    The other people doing system administration, Sara and Bill, asked Rob what had
    happened and eventually got this problem description from him: "I can''t send
    mail to external addresses through our mail gateway, but I can receive mail from
    it."


    Sara and Bill decided that they didn''t quite enough answers to really describe
    the problem. They wanted to know if Rob could send mail to internal addresses
    through the mail gateway and what kind of error messages he got. Giving him careful
    instructions, they sent him off to do the research for them.'
