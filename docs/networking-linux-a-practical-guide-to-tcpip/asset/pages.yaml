  md: '# Appendix B RFC-1123


    There are three cases for FTP restart:


    +   1. User-to-Server Transfer—The User-FTP puts Restart <ssss> at convenient
    places in the data stream. When the Server-FTP receives a Marker, it writes all
    prior data to disk, encodes its file system position and transformation as rrrr,
    and returns a "110 MARK ssss rrrr" reply over the control connection. The User-FTP
    appends the pair (ssss,rrrr) to its restart control file. To restart the transfer,
    the User-FTP fetches the last (ssss,rrrr) from the restart control file, replaces
    its local file system and transformation state using ssss, and sends the command
    "REST r" to the Server-FTP.


    +   2. Server-to-User Transfer—The Server-FTP puts Restart Markers <ssss> at convenient
    places in the data stream. When the User-FTP receives a Marker, it writes all
    prior data to disk, encodes its file system position and transformation as rrrr,
    and appends the pair (rrrr,ssss) to its. To restart the transfer, the User-FTP
    fetches the last (rrrr,ssss) from the restart control file, replaces its local
    file system and transformation state using rrrr, and sends the command "REST ssss"
    to the Server-FTP.


    # 4.1.4 FTP/USER INTERFACE


    This section discusses the user interface for a User-FTP program.


    # 4.1.4.1 Pathename Specification


    Because User-FTP is intended for a heterogeneous environment, User-FTP implementations
    MUST support remote pathnames as arbitrary character strings, so that their form
    and content are not limited by the conventions of the local operating system.

    DISCUSSION:


    In particular, remote pathnames can be of arbitrary length, and all the printing
    ASCII characters as well as space (0x20) must be allowed. RFC-959 allows a pathname
    to contain any 7-bit ASCII character except CR or LF.


    # 4.1.4.2 "QUOTE" Command


    A User-FTP program MUST implement a "QUOTE" command that will pass an arbitrary
    character string to the server and display all resulting response messages to
    the user.'
