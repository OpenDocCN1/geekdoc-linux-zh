    RIP broadcast, bill also knows about two-hop routes to the 192.168.4.0/24, 192.168.5.0/24,
    and 192.168.6.0/24 networks². Because bill already has a one-hop route for the
    192.168.5.0/24 network, it ignores this entry. The others are added to its routing
    table. On its next broadcast, bill sends information about all the one- and two-hop
