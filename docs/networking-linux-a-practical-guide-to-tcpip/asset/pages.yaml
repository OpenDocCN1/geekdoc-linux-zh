    # 3.3.4 Local Multihoming


    # 3.3.4.1 Introduction


    A multihomed host has multiple IP addresses, which we may think of as "logical
    interfaces." These logical interfaces may be associated with one or more physical
    interfaces, and these physical interfaces may be connected to the same or different
    networks. Here are important cases of multihoming:


    +   (a)Multiple Logical Networks—The Internet architects envisioned that each
    physical network would have a single unique IP network (or subnet number). However,
    LAN administrators have sometimes found it to violate this assumption, operating
    a LAN with multiple logical networks per physical connected network. If a host
    connected to such a physical network is configured to handle traffic for each
    of N different logical networks, the host will have N logical interfaces. These
    could share a single physical interface, or use N physical interfaces to the same
    network.


    +   (b)Multiple Hosts—When a host has multiple IP addresses that all have the
    <Network-number> part (and the same <Subnet-number> part, if any), the logical
    interfaces are known as "logical hosts." These logical interfaces might share
    a single physical interface or use separate physical interfaces to the same physical
    network.


    +   (c)Simple Multihoming—In this case, each logical interface is mapped into
    a separate physical interface and each physical interface is connected to a different
    physical network. The term "multihoming" was originally applied only to this case,
    but it'
  merge: -1
