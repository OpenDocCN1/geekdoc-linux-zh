    # HTTP


    The Hypertext Transfer Protocol (HTTP), described in RFC 1945 and RFC 2616, provides
    an application-layer protocol for the distribution of data across a network. It
    allows several means of requesting and submitting data. HTTP provides a method
    for typing the data being transmitted.'
