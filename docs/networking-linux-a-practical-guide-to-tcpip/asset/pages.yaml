- img_proc: true
  md: 'Search lists often contain the tried, the local host''s parent domain or ancestor
    domains. Search lists are often per-user or per-process. It SHOULD be possible
    for an administrator to disable a DNS search-list facility. Administrative denial
    may be warranted in some cases, to prevent abuse of the DNS. There is danger that
    a search-list mechanism will generate excessive queries to the root servers while
    testing user input is a complete domain name, lacking a final period to mark it
    complete. A search-list mechanism MUST HAVE one of, and SHOULD have both of, the
    following two provisions to prevent this:


    +   (a)The local resolver/name server can implement caching of negative responses
    (See Section 6.1.3.3).


    +   (b)The search list expander can require two or more interior dots in a generated
    domain name before it tries using the name in a query to non-local domain servers,
    as the root.


    # DISCUSSION:


    The intent of this requirement is to avoid excessive delay for the user as the
    search list is tested, and more importantly to prevent excessive traffic to the
    root and other high-level servers. For example, if the user supplied a name "X"
    and the search list contained the root as a component, a query would have to consult
    a root server before the next search list alternative could be tried. The resulting
    lead would be multiplied by the number of hosts in the root servers and gateways
    near the root would prevent easy use of some top-level names.

    The negative caching alternative limits the effect to the first time a name is
    used. The interior dot rule is simpler to implement but can prevent easy use of
    some top-level names.


