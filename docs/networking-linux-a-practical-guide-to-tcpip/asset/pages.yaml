    Codes 0 through 3 are the most common values, although type code 4 is used when
    determining the path MTU of a network connection.


    # Source Quench


    ICMP source quench messages are used when a router is nearing its buffer capacity.
    The router will send its message to the source host of the datagram that triggered
    the event. The system that receives the source quench message is supposed to reduce
    its transmission rate until it stops receiving source quench messages.'
