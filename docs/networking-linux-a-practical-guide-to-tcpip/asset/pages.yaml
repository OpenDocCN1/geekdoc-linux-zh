  md: 'Chapter 1 Prelude to a Practical Guide


    # A Brief History of TCP/IP on Linux


    The first ip for Linux was developed by Ross Biro. He continued work on this version,
    called NET-1, until he was overwhelmed by his other commitments and the (sometimes
    fiery) complaints of Linux users. A fresh implementation of the protocol stack
    was done because there was a great deal of uncertainty about the legal status
    of the Berkeley Distribution (BSD) stack at the time. The NET-1 code was supported
    by an Ethernet driver for the WD-8003 Ethernet card, also by Biro.


    In addition to Ross Biro''s efforts, Ernest Zborowski and Laurence Culhane were
    also doing fundamental work with early Linux networking. Zborowski developed the
    BSD socket interface, which provided the API required by most existing applications.
    Culhane developed the first Linux SLIP drivers, allowing non-Ethernet-connected
    users to start networking with Linux.


    Fred van Kemp picked up up and began developing NET-2. He had very big plans for
    the IP stack, and he developed five releases (NET-2A through NET-2E). A number
    of factors caused a rift in the community, and Alan Cox began work on NET-2D(ebugged).
    Eventually, van Kempen''s work was overtaken by Cox''s, and the NET-2Debugged
    became the standard.


    Cox''s work (and that of others) eventually became NET-3, the current TCP/IP stack
    for Linux. Donald Becker (Ethernet drivers), Michael Callahan and Ian Longyear
    (PPP), and Jonathon Mayer (AX.25 improvements) were some of the people who put
    their stamp on the networking code.


    Dynamic device drivers, IPX, IPv6, advanced routing capabilities, packet filtering,
    and Network Address Translation (NAT) are some of the features available to Linux
    today, thanks to the many people involved in developing the Linux networking implementation.
    Because of these features, networking on Linux today is solid, fast, and easy.
    The future of networking and Linux looks bright, with continuous enhancements
    being made and new functionality added in each new kernel version.


    # Physical-Layer Issues


    Because Ethernet is the most commonly used protocol for LANs, I''ll confine my
    comments in this section to Ethernet-related issues. My notes will cover two areas:
    physical-layer Ethernet and networking hardware.


    # Physical-Layer Ethernet


    Ethernet networks today are commonly seen in two flavors: 10BaseT and 100BaseTx.
    Like most names, these are meaningful. Like most things in networking, you need
    a little bit of context to understand their meaning.


    In the early days of Ethernet, people used thick, or solid-core cabling. These
    cables could carry a 10Mbps signal 500 meters and used a baseband signal. This
    became known as 10Base5.'
