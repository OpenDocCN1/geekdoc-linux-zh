  md: "# Chapter 10 Monitoring Tools\n\nExample 10.6 Continued\n\n```\nforeach my\
    \ $host (@ARGV) {\n    my $t = new Net::Telnet(Timeout => 10,\n              \
    \              Port => 79,\n                            Ermode => 'return');\n\
    }\n\nif ($t -> open(\"$host')) {\n    $t->print(\"\");\n    my $lines = $t->getlines;\n\
    \    unless ($lines) {\n        push $failures, [$host, $t->errmsg];\n    }\n\
    }\n} else {\n    push $failures, [$host, $t->errmsg];\n}\n\n    exit 0 if ($0\
    \ == $failures);\n\nforeach my $failed_host (@failures) {\n    push @1, $$failed_host[0];\n\
    }\n\nprint \"@1\\n\";\n\nforeach my $error (@failures) {\n    print \"$error[0]:\
    \ $error[1]\\n\";\n}\n\n    exit 1;\n```\n\nLet's walk through this script to\
    \ understand what's going on in a test script.\n\nThe first thing you'll need\
    \ to know is how mon expects to pass the monitor script\na list of hosts to test.\
    \ mon calls external tests like this:\n\n```\nfoo.monitor host host2 ... hostN\n\
    ```\n\nIn the example script, we're grabbing those host names with the loop:\n\
    foreach my $host (@ARGV) {\n    #do stuff\n\n“do stuff” is the important bit;\
    \ we'll get back to it in a minute. Before we\ndoe, we need to look at one more\
    \ thing—how mon expects to be told of failures by\nthe test. mon is actually looking\
    \ for three things: an exit code (0 if there are no errors,\nor 1 otherwise),\
    \ a list of failed hosts, and a list of error messages associated with the\nfailed\
    \ hosts. Returning an exit code is not a big deal; the more interesting thing\
    \ is the\ncreation of the two lists that mon wants. This is done in the last two\
    \ foreach loops in\nour sample."
