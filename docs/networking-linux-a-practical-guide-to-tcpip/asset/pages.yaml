  md: '# Support Services 361


    # DISCUSSION:


    This will prevent applications that immediately retry soft failures (in violation
    of Section 2.2 of this document) from generating excessive DNS traffic.


    +   4. All DNS name servers and resolvers SHOULD cache negative responses that
    indicate the specified name, or data of the specified type, does not exist, as
    described in [DNS:2].n5. When a DNS server or resolver retries a UDP query, the
    retry interval SHOULD be constrained by an exponential backoff algorithm, and
    SHOULD also have upper and lower bounds.


    # IMPLEMENTATION:


    A measured RTT and variance (if available) should be used to calculate an initial
    retransmission interval. If this information is not available, a default of no
    less than 5 seconds should be used. Implementations may limit the retransmission
    interval, but this limit must exceed twice the Internet maximum segment lifetime
    service delay at the name server.


    +   6. When a resolver or server receives a Source Quench for a query it has issued,
    SHOULD take steps to reduce the rate of querying server in the near future. A
    server MAY ignore a Source Quench that it receives as the result of sending a
    response datagram.


    # IMPLEMENTATION:


    One recommended action to reduce the retry is to send the next query to an alternate
    server, if there is one available. Another is to back off the retry interval for
    the same server.


    # 6.1.3.4 Multihomed Hosts


    When the name-to-address function encounters a host with multiple addresses, it
    SHOULD rank or sort the addresses using knowledge of the immediately connected
    network(s) and any other applicable performance or history information.


    # DISCUSSION:


    The different addresses of a multihomed host generally imply different Internet
    paths, and some paths may be preferable to others in performance, reliability,
    or administrative restrictions. There is no general way for the domain system
    to determine the best path. A recommended approach is to base this decision on
    local configuration information set by the system administrator.


    # IMPLEMENTATION:


    The following scheme has been used successfully:

    (a)Incorporate into the host configuration data a Network-Preference List, that
    is simply a list of networks in preferred order. This list may be empty if there
    is no preference.

    (b)When a host is mapped into a list of IP addresses, these addresses should be
    sorted by network number, the same order as the corresponding networks in the
    Network-Preference List. IP addresses whose networks do not appear in the Network-Preference
    List should be placed at the end of the list.'
