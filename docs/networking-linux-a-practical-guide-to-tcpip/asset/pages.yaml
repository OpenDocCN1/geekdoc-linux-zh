  md: 'Remote Login—Telnet Protocol 317


    Although the Telnet protocol is based on a perfectly symmetric model, in a remote
    login session the role of the user differs from the role of the server host. For
    example, RFC-854 defines the meaning of CR, LF, and CR LF as output from the server,
    but does not specify what the Telnet should send when the user presses the "end-of-line"
    key on the terminal; this turns out to be the point at issue. When a user presses
    the "end-of-line" key, some Telnet implementations send CR, while others send
    CR NUL (based on a different interpretation of the same sentence in RFC-854).
    These will be equivalent for a correctly-implemented ASCII server host, as discussed
    previously. For other servers, a mode in the Telnet is needed.


    The existence of Telnet servers that send CR NUL when CR is pressed creates a
    dilemma for non-ASCII hosts: they either treat CR NUL as equivalent to CR LF in
    input, thus excluding the possibility of entering a "bare" CR, or lose complete
    whatever.


    Suppose a host A uses Telnet to log into server B, and then execute B’s Telnet
    program to log into server C. It is desirable for the Server/User/Telnet connection
    on B to be as transparent as possible, i.e., to appear as if A were connected
    directly to C. In particular, correct implementation will make B transparent to
    Telnet end-of-line sequences, except that CR LF may be translated to CR NUL or
    vice versa.

    IMPLEMENTATION:


    To understand end-of-line issues, one must have a general model of the relationship
    of Telnet to the local operating system. The Server Telnet process is typically
    coupled into the terminal driver software of the operating system as a pseudo-terminal.
    A end-of-line sequence received by the Server Telnet must have the same effect
    as pressing the end-of-line key on a locally-connected terminal.


    Operating systems that support interactive character-at-a-time applications (e.g.,
    editors) typically have two internal modes for their terminal I/O: a formatted
    mode, in which local conventions for end-of-line and other formatting rules have
    been applied to the data stream, and a “raw” mode, in which the application has
    direct access to every character as it is entered. A Server Telnet must be implemented
    in such a way that these modes have the same effect for remote as local terminals.
    For example, suppose a CR LF or CR NUL is received by the Server Telnet on an
    ASCII host. In raw mode, a CR character is passed to the application; in formatted
    mode, the local system’s end-of-line convention is used.


    # 3.3.2 Data Entry Terminals


    DISCUSSION:


    In addition to the line-oriented and character-oriented ASCII terminals for which
    Telnet was designed, there are several families of video display terminals that
    are-times known as “data entry terminals” or DETs. The IBM 3270 family is a well-known
    example.'
