    # 4


    # # Transport-Layer Protocols


    THE TRANSPORT LAYER CARRIES DATA BETWEEN HOSTS for the applications above and
    diagnostic information about the connections between hosts on the network. This
    information is carried by TCP (and the related T/TCP), UDP, or ICMP. These protocols
    are quite different in function and appearance (as you''ll see in their respective
    sections) TCP guarantees a reliable flow of data, allowing the application implementation
    to ignore such details. UDP does not guarantee delivery, which forces the application
    to ensure reliability. ICMP does not carry data in the traditional sense, but
    it carries data about the network or other connections on the network. In this
    chapter, we''ll discuss ports and sockets, TCP, UDP, and ICMP.


    # ## Ports and Sockets


    At the transport layer, higher-layer protocols are referred to by their port numbers.
    These are 2-byte numbers that correspond to a particular application or process.
    Some port numbers are reserved or registered, and are recorded in RFC 1700. Access
    to these ports is often controlled through a *daemon* as inet (http at port 80
    is a common exception to this rule of thumb). Other ports are assigned “on the
    fly” to an application (either a server or a client may bind to a port in this
    way).'
  merge: -1
  pgno: 70
- img_proc: true
  md: '# Chapter 4 Transport-Layer Protocols


    inetd (and similar daemons) act as a “switchboard” for a host. This process is
    configured to listen on multiple ports and then spawn a server process of the
    appropriate type for each incoming connection. inetd is susceptible to several
    kinds of attacks and is often replaced or supplemented with other tools. xinetd
    and TCP wrappers are examples of a replacement server and a supplementary server,
    respectively, and are covered in Chapter 11, “Security Tools."


    Reserved ports are those with a value of 1 to 1023 (inclusive). The use of these
    ports is restricted to processes started by root. These ports are assigned to
    applications by the Internet Assigned Numbers Authority (IANA). Because the use
    of these ports is controlled by a standards body, they are sometimes called “well-known
    ports."


    Ports in the range from 1024 to 65535 (inclusive) are registered ports if they
    are listed in RFC 1700. Although these are listed by the IANA, they are not standardized
    by them. A server process may be bound to any port in this range, but it is considered
    good practice to try to avoid widely used reserved numbers.


    This range of ports is used by client processes. For example, when a user makes
    a Telnet connection to a remote host, the local Telnet connection is bound to
    a port in the unrestricted range—1027, for example. The Telnet connection tries
    to make a connection with the server at port 23. Because Telnet is normally handled
    through inetd, it receives the incoming request and starts an in.telnet process
    to deal with the Telnet session.


