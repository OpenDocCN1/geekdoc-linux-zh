  md: '![](img/5b4988f59e82a39b3f220b0f1d3777dd_18_0.png)


    # # 1


    # # Prelude to a Practical Guide


    THE Transmission Control Protocol/Internet Protocol (TCP/IP) suite, sometimes
    called TCP or IP, is often viewed as a maze of acronyms and jargon. Although I
    don''t have a magic wand to make the terminology disappear, I hope to provide
    you with the whole you need to understand what''s going on behind the curtain.
    To minimize confusion, I will *italicize* the first occurrence of new terms.


    Before diving into a detailed look at the protocols, tools, and applications that
    make TCP/IP, we will walk through some background information to help provide
    context for the later chapters. The rest of this chapter introduces layered protocols,
    describes TCP/IP in brief, gives an example of TCP/IP at work, discusses the organizations
    and methods involved in specifying TCP/IP, provides some information about the
    development of the TCP/IP protocol on Linux, and discusses physical-layer issues.


    > Note from the Author

    If you''ve already got a handle on these, you may want to just skip this chapter
    on your way to Chapter 2, "Link-Layer Protocols." If you want to cut the chase
    but really aren''t familiar with how layered protocols work, you would probably
    benefit from reading the section "TCP/IP in Action: A Narrative," later in this
    chapter, before moving on. In fact, if you ever get lost in the protocol stack,
    referring to that section can help put things back into perspective for you.'
  merge: -1
