    # TFTP


    The Trivial File Transfer Protocol (TFTP) is a User Datagram Protocol (UDP) based
    protocol for exchanging files between systems. It was designed to be fast and
    easy to implement on a host with limited resources. TFTP is defined in RFC 1350.


    # Protocol Review


    TFTP is implemented with five kinds of packets:


    +   * Read requests

    * Write requests

    * File data

    * Acknowledgments

    * Error handling


    Each of these packet types (except read and write requests) has a slightly different
    packet structure. We''ll take a look at each of them in turn.'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# Chapter 5 Application-Layer Protocols


    Read and write request packets have five fields. The first field is 2 bytes long
    and is the Op Code field; read requests are 0x001, and write requests are 0x0002.
    The next field is of variable length and is the filename to be read. This is followed
    by a 1-byte separator, which is always 0x00. The fourth field is the Data Mode
    field and can be one of three values:


    +   - Netasci

    - Binary

    - The recipient''s email address (for write requests only)


    The fourth field is of variable length. The fifth field is 1 byte long and is
    an End Of File marker; this is always 0x00.

    Data packets have three fields. The first field is the Op Code field and is 2
    bytes long; it is always 0x0003. The second field is the Block Number field and
    is 2 bytes long; the remainder of the packet (with a maximum of 512 bytes) is
    the data. When TFTP transfers data, it uses a simple mechanism to track where
    it is in the data to be transferred. The data is divided into 512-byte blocks,
    and each is sent and acknowledged individually.³ The last packet of a transfer
    is a data packet with a field of less than 512 bytes. If the data is evenly divided
    into 512-byte blocks, an empty packet will be sent as the last packet (with 0
    bytes being less than 512).

    Each deblock is answered by an acknowledgment packet. The acknowledgment packet
    is 4 bytes long and has two fields. The first field is the 2-byte Op Code field
    (0x0004). The second field is the 2-byte block number of the block being acknowledged.


    Because nothing is perfect, TFTP has a simple error-handling system built around
    an error-handling packet. These packets have four fields and are of variable length.
    The first field is the Op Code field; it is 2 bytes long and always 0x0005. The
    second field is 2 bytes long and carries the error code. The third field is of
    variable length. The valid error codes and their corresponding error texts are
    shown in Table 5.3.


    Table 5.3 TFTP Error Codes


    | Error Code | Error Text |

    |---||

    | 0x0000 | Undefined Error |

    | 0x0001 | File Not Found |

    | 0x0002 | Access Violation |

    | 0x0003 | Disk Space Exceeded |

    | 0x0004 | Illegal Operation |

    | 0x0005 | Unknown Transfer ID |

    | 0x0006 | File Exists |

    | 0x0007 | No Such User |


    An error-handling packet ends with a 1-byte EOF field that is set to 0x00.'
  merge: -1
