  md: '# Endnotes


    This shows two packets. The first is an ICMP packet of Type 8 and Code 0, a ping
    request. It is destined for cuke. The second is an ICMP packet of Type 5 and Code
    1 and ICMP Redirect.This is coming from mango, the gateway to the rest of the
    world.


    **Test the results**—You shouldn''t expect to see mango involved at all. If you
    look at the ICMP Redirects being sent (using the -v switch), you can see that
    you''re being redirected to the 192.168.1.11 address, not rhubarb.


    **Apply results of the test to the hypothesis**—If you''re not sending your traffic
    to the right gateway, it will never get to the right place. You should be able
    to solve this by adding a route to the 192.168.2.0/24 network on cherry (a quick
    check of working hosts shows that this is the way they are configured).You''ll
    probably want to fix the bad route on mango as well.


    **Iterate as needed**—When you''ve made the change and tested it, you know that
    it works and don''t need to go any further.


    # Endnotes


    +   1. Not all ICMP packets are blocked by packet filters. Normally just the Echo
    Request and Response packets are blocked. Some administrators choose to block
    redirects, router advertisements, router solicitations, and other ICMP pack-ets
    that should never come from an external host.'
