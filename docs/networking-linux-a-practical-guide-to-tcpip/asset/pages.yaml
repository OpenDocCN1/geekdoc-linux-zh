  md: '# Appendix A RFC-1122


    The protocol layers used in the Internet architecture are as follows [INTRO:4]:


    +   - Application Layer—The application layer is the top layer of the Internet
    protocol suite. The Internet suite does not further subdivide the application
    layer, although some of the Internet layer protocols contain some internal sublayer.
    The application layer of the Internet suite essentially combines the functions
    of the top two layers—Presentation and Application—of the OSI reference model.
    We distinguish two categories of application layer protocols: user protocols that
    provide service directly to users, and support protocols that provide common system
    functions. Requirements for user and support protocols will be found in the common
    RFC [INTRO:1].


    +   - Telnet (remote login)


    +   - FTP (file transfer)


    +   - SMTP(electronic mail delivery)


    There are a number of other standardized user protocols [INTRO:4] and many private
    user protocols. Support protocols, used for host name mapping, booting, and management,
    include SNMP, BOOTP, RARP, and the Domain Name System (DNS) protocols.


    Transport The transport layer provides end-to-end communication for applications.
    There are two primary transport layer protocols at present:


    +   - Transmission Control Protocol (TCP)


    +   - User Datagram Protocol (UDP)


    TCP is a reliable connection-oriented transport service that provides end-to-end
    reliability, reencing, and flow control. UDP is a connectionless (“datagram”)
    transport service. Other transport protocols have been developed by the research
    community, and the set of official Internet transport protocols may be expanded
    in the future. Transport layer protocols are discussed in Chapter 4.


    Internet Layer—All Internet transport protocols use the Internet Protocol (IP)
    to carry data from source host to destination host. IP is a connectionless or
    datagram network service, providing no end-to-end delivery guarantees. Thus, IP
    datagrams may arrive at the destination host damaged, duplicated, out of order,
    or not at all. The layers above IP are responsible for reliable delivery when
    it is required. The IP protocol includes provision for addressing, type-of-service
    specification, fragmentation and reassembly, and security information. The datagram
    or connectionless nature of the IP protocol is a fundamental characteristic of
    the Internet architecture. Internet IP was the model for the OSI Connectionless
    Network Protocol [INTRO:12]. ICMP is a control protocol that is considered to
    be an integral part of IP, although it is architect'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# Introduction 25


    layered upon IP, i.e., it uses IP to carry its data end-to-end as a transport
    protocol TCP or UDP does. ICMP provides error reporting, congestion reporting,
    and first-hop gateway redirection. IGMP is an Internet layer protocol for establishing
    dynamic host groups for IP multicasting. The Internet layer protocols IP, ICMP,
    and IGMP are discussed in Section 3.


    +   Link Layer—To communicate on its directly connected network, a host must implement
    the communication protocol used to interface to that network. We call this link
    layer or media-access layer protocol. There is a wide variety of layer protocols,
    corresponding to the many different types of networks. Section 2.


    # 1.1.4 Embedded Gateway Code


    Some Internet software includes embedded gateway functionality, so that these
    hosts can carry forward packets as a gateway, while still performing the application
    layer functions of a host.


    Such dual-purpose systems must follow the Gateway Requirements RFC [INTRO:2] with
    respect to their gateway functions, and must follow the present document with
    respect to their host functions. In all overlapping cases, the two specifications
    should be in agreement.


    There are varying opinions in the Internet community about embedded gateway functionality.
    The main arguments are:


    +   Pro: in a local network environment where networking is informal, or in isolated
    it, it may be convenient and economical to use host systems as gateways. There
    is also an architectural argument for embedded gateway functionality; multihoming
    is much more common than commonly foreseen, and multihoming forces a host to make
    routing decisions as if it were a gateway. If the multihomed host contains an
    embedded gateway, it will have full routing knowledge and as a result will be
    able to make optimal routing decisions.

    Con: Gateway algorithms and protocols are still changing, and they will continue
    to change as the Internet system grows larger. Attempting to include a general
    gateway function within the IP layer will force host system maintainers to track
    these (more frequent) changes. Also, a larger pool of gateway implementations
    will make coordinating the changes more difficult. Finally, the complexity of
    the IP layer is somewhat greater than that of a host, making the implementation
    and operation tasks more complex. In addition, the style of operation of some
    hosts is not appropriate for providing stable and robust gateway service.


    There is considerable merit in both of these viewpoints. One conclusion can be
    drawn: a host administrator must have conscious control over whether or not a
    given host acts as a gateway. See Section 3.1 for the detailed requirements.'
