  md: '# 7

    Before Things Break—Building a Baseline


    Sometimes WHEN YOU TALK TO A SEASONED SYSTEM or network administrator, he''ll
    tell you that he knows that something is wrong when shorthand doesn''t feel right.
    This isn''t an admission of paranormal powers; it''s just a shorthand method for
    explaining that these experts know how your system or network is supposed to behave
    and that it isn''t acting like that now. These administrators have created a baseline
    for their environment. Not all of them have done formally, but the ones who will
    have gained significant added benefits.


    In this chapter, we''ll cover what a baseline can do for you, what it really is,
    how to create one, how to keep it up-to-date, and how your baseline affects your
    network monitoring plan (and vice versa).


    # Why Baselines Matter


    Baselines give you two primary benefits. First, they let you know how your network
    behaves under normal conditions—this lets you see where something is going wrong
    while you''re troubleshooting a problem. Second, they let you see how your network''s
    behavior is changing over time—this will help you maintain a healthy network through
    careful expansion. Both of these provide you with some real value.'
  merge: -1
  pgno: 134
- img_proc: true
  md: '# A Baseline, Your Troubleshooting Friend


    While you''re troubleshooting, you''ll use your baseline in two ways. The most
    obvious use is that you''ll be able to tell when things are behaving outside the
    norm for your network. It is also obvious, but as important as, you can use the
    baseline as part of your diagnostic tool kit. When taken together, these two benefits
    make troubleshooting life much easier.


    When you''re aware of your network''s normal behavior, changes become obvious.
    If afternoons feature low bandwidth utilization but a high load on one of your
    servers, you won''t be concerned if that server is slow to respond when the others
    are okay. All of the servers being slow to respond would serve as warning flag
    right away, though. This awareness cannot replace monitoring your network, but
    it does serve as a good adjunct to.


    In the mid of troubleshooting, having your baseline information accessible can
    make a world of difference. For example, if you know that cherry and berry aren''t
    typical big users of bandwidth, but they seem to be the culprits in your current
    network overload, you''ve got a head start on identifying the problem. If you
    further know that one or both of them were upgraded, you have an even better map.
    (Of course, it could always be the users flexing their Quake muscles...)


    Having baseline information about your network will help you spot problems earlier
    and solve them faster. It may take a bit of work to get it started, but the effort
    expended now will pay off in weekend and evenings free later!


    # Watching Your Network for Fun and Prophet


    Beyond helping with your troubleshooting, a network baseline will help you avoid
    problems that you would otherwise walk into. Watching your network''s behavior
    change will help you see where you need to make changes. Is traffic building up
    on a LAN segment? Maybe youll need to add another switch. Do you have a server
    acting as a bottleneck? It''s probably time to upgrade.


    As your base users grows and their needs change, your network will need to change
    as well. When you watch your network and can foresee needed changes in topology
    or equipment, you''ll save yourself time and money. This is one of the best reasons
    to not only develop a baseline, but also to actively monitor against it and keep
    it up-to-date.'
  merge: -1
  pgno: 135
- img_proc: true
  md: '# What Is a Baseline?


    Several things make a baseline, but at its heart, a baseline is merely a snapshot
    of your network the way it normally acts. The least effective form of a baseline
    is the "sixth sense" that you develop when you''ve been around something for a
    while. It seems to work because you notice aberrations subconsciously because
    you''re used to the things you ought to be. Better baselines will be less informal
    and may include the following components:


    +   * Network traces

    * Summarized network utilization data

    * Logs of work done on the network

    * Maps of the network

    * Records of equipment on the network and related configuration data


    Each of these will be discussed in this section.


    # Network Traces


    In Chapter 10, "Monitoring Tools," we discuss the ethereal network analyzer. This
    tool''s capability to save capture files (or traces) enables you to maintain a
    history of your network. If only the traces you have saved represent your troubleshooting
    efforts, you won''t have a very good picture of your network.

    You need to be aware that a lot of things influence the contents of the traces
    you collect. Weekend vs.; Monday or Friday vs. the rest of the week; and time
    of day are all examples of the factors that will affect your data. Running ethereal
    (or some other analyzer) at least three times a day, every day, and saving the
    capture file will give you much clearer image of how things normally work.


    # Utilization Data


    Several tools can give you a quick look at your network''s behavior: netstat,
    traceroute, ping, and even the contents of your system logs are all sources of
    information.

    netstat tool can show you several important bits of information. Running it with
    the -M, -i, and -a switches are especially helpful. I typically add the -n switch
    to netstat as this switch turns off name resolution, which is a real boon if DNS
    is broken or IP addresses do not resolve back to names properly. The -i switch
    gives you interface specific information:


    ```

    [p@cherry sgml]$ netstat -i

    Kernel Interface table

    Iface MTU Met RX-OK RX-ERR RX-DPR RX-OVR TX-OK TX-ERR TX-DPR TX-OVR Flg

    eth0 1500 0 0 0 0 39 0 0 BRU

    lo 3924 0 36 0 0 36 0 0 LRU

    [pate@cherry sgml]$

    ```'
  merge: -1
  pgno: 136
- img_proc: true
