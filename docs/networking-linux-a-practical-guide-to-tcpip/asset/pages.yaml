  md: '# ARP and RARP 29


    ARP information is maintained by a host in an ARP table by the operating system.
    On a Linux platform, this information can be viewed with the ARP command, and
    in this example:


    ```

    [root@cherry]# arp -a

    ? (192.168.1.1) at 00:0a:22:1c:64:e8 [ether] on eth0

    ? (192.168.1.11) at 00:c0:f0:26:81:ec [ether] on eth0

    [root@cherry]#

    ```


    Entries in the ARP table (more properly, the ARP cache) can be permanent entries
    (created with the arp set -file options) or dynamic entries (discovered automatically).
    Dynamic entries typically have a 15-minute timeout—that is, a host that has not
    communicated within 15 minutes will be re-ARPed. This aging process for ARP cache
    entries minimizes the danger that a network card will be replaced in a remote
    host, thereby changing the MAC-address-to-IP-address relationship.


    # RARP


    RARP is used to allow a host to collect its own IP address dynamically.¹¹¹ A major
    distinction is that in ARP, each host is responsible for mapping its IP address
    to its MAC address, in RARP, one or more servers are configured to provide the
    mapping for RARP hosts.

    RARP packets are identified with the Ethernet II type of 0800. RARP requests have
    a RARP opcode of 3, and RARP replies have an opcode of 4.There are no ''error''
    or ''not found'' opcodes because another host on the network will be capable of
    responding to the reply, but RARP packets are otherwise similar to the ARP packet
    structure.


    A major failing of RARP is that it is nonroutable. Because it is a link-layer
    protocol, it is confined to a single LAN. This means that each LAN with RARPPing
    must have at least one configured RARP server daemon.


    # ARP Decoded


    In the ARP request shown in Figure 2.10, mango is requesting a hardware address
    for cherry. The hardware type is set to 0x0001 (Ethernet), and the protocol type
    is set to 0x0800 (IPv4). The hardware address length is 0x06, 6 bytes and 4 bytes,
    respectively. The ARP opcode is set to 0x0001 (request). The sender hardware address
    is set to 00:a0:d2:1c:64:a8, and the sender protocol address is set to 192.168.1.1.The
    target hardware address is unknown and set to 00:00:00:00:00:00, while the target
    protocol address is set to 192.168.1.10.'
