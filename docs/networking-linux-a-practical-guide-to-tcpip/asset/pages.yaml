  md: '# Troubleshooting Tools


    THE PING, TRACEROUTE, ARP AND N tools will help you as you''re troubleshooting
    problems in your network or over the Internet. The first three are part of a stock
    Linux system, but the fourth will need to be downloaded and installed on your
    system before you can use it.


    # ping


    ping is a diagnostic tool for verifying connectivity between two hosts on a network.
    It sends ICMP Echo Request packets to a remote IP address and watches for ICMP
    responses. The author of the initial version of the ping program used today was
    Mike Muss. Many other people have tweaked, rewritten, and variously abused ping
    since then.


    The name ping itself is somewhat colorful. Some people claim that it is an acronym
    standing for the Packet Internet Groper, but this is not the case. ping was named
    after the sound of a sonar tracking system. There is even a story claiming that
    a system administrator wrote a script that repeatedly pinged a host on the network
    and made an audible "pinging" alert for each success. The system administrator
    was then able to methodically go through his network checking BNC connectors until
    he found the dodgy connector that had been plaguing his network. When the noises
    stopped, he''d found his culprit.'
  merge: -1
