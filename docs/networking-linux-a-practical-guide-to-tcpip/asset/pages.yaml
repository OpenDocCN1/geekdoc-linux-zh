    # 6.3 REMOTE MANAGEMENT


    # 6.3.1 INTRODUCTION


    The Internet community has recently put considerable effort into the development
    of network management protocols. The result has been a two-pronged approach (MGT:1,
    MGT:6); the Simple Network Management Protocol (SNMP) [MGT:4] and the Common Management
    Information Protocol over TCP (CMOT) [MGT:5]. In order to be managed using SNMP
    or CMOT, a host will need to implement an appropriate management agent. An Internet
    host SHOULD implement an agent for either SNMP or CMOT.


    Both SNMP and CMOT operate on a Management Information Base (MIB) that defines
    a collection of management values. By reading and setting the state of the managed
    system.


    A standard MIB [MGT:3] has been defined for use by both management protocols


    Every protocol in the host SHOULD implement the relevant MIB variables. A host
    SHOULD implement the MIB variables as defined in the most recent standard MIB,
    and MAY implement other MIB variables when appropriate and useful.


    # 6.3.2 PROTOCOL WALK-THROUGH


    The MIB is intended to cover both hosts and gateways, although there may be detailed
    differences in MIB application to the two cases. This section contains the appropriate
    interpretation of the MIB for hosts. It is likely that later versions of the MIB
    will include more entries for host management.


    A managed host must implement the following groups of MIB object definitions:
    System, Interfaces, Address Translation, IP, ICMP, TCP, and UDP.'
