  md: '# Example 10.5 A mon Configuration File


    ```

    # Example ''mon.cf'' configuration for ''mon''.


    # global options

    # the eventual values for these options are commented out and values for

    # a test installation are currently in place


    #cfbasedir = /usr/local/lib/mon/etc

    cfbasedir = /

    #alertdir = /usr/local/lib/mon/alert.d

    alertdir = ./alert.d

    #mondir = /usr/local/lib/mon/mon.d

    mondir = ./mon.d

    maxprocs = 20

    histlength = 100

    randstart = 60s


    # authentication types:

    # getpasswd standard Unix passwd, NOT for shadow passwords

    # shadow Unix shadow passwords (not implemented)

    # userfile "mon" user file


    autype = userfile


    # NB: hostgroup and watch entries are terminated with a blank line (or

    # end of file). Don''t forget the blank lines between them or you lose.


    # group definitions (hostnames or IP addresses)

    # hostgroup workstations crash cherry


    hostgroup wwwservers cherry


    watch wwwservers

    service http

    interval 5m

    monitor http.monitor

    allow empty_group

    period wd (Sun-Sat)


    alert mail.alert -S "web server has fallen down" pate

    alupert.mon.alert -S "web server is back up" pate

    alertervery 45m

    ```'
