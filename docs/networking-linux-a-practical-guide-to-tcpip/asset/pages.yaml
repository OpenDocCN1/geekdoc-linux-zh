    up a

    splash screen showing that it is building a key pair for your client, then a window

    where you can enter your pass phrase. If you are running Nessus for the second
    or

    later time, it just asks for your pass phrase.


    After entering your pass phrase, Nessus brings up a login window for connecting

    to Nessus (see Figure 11.3).'
