  md: '# UDP


    The User Datagram Protocol (UDP) is defined in RFC 768. UDP provides a simple
    transport protocol using datagrams to carry data from the source to the destination.


    UDP offers a speed advantage over TCP at the cost of some robustness. There is
    no UDP session, so there is no session startup and no overhead of tracking a data
    window. The header is half the size of a TCP header. Because UDP is not stream-oriented
    like TCP, each datagram carries a discrete chunk of data for the upper-level application
    (or the largest part of a discrete chunk of data allowed by the path MTU).


    # A Discussion of UDP


    A UDP header is made up of four fields, each 2 bytes long: UDP Source Port, UDP
    Target Port, Message Length, and Checksum. The Source and Target Ports are used
    to identify the process used at either end of the connection, as described earlier.
    The Message Length indicates the number of bytes in the UDP header and the data
    carried by the datagram; the minimum value is 8.


    The Checksum for UDP is optional. If the Checksum is not calculated by the sender,
    it is sent as an all-zero field (0x0000). When used, it is computed for the data
    and for a pseudoheader constructed like the TCP pseudoheader discussed in the
    previous section. The pseudoheader is shown in Figure 4.10.


    | 4 Byte Source IP Addr |

    | 4 Byte Dest IP Addr |

    | 0x00 | 0x11 | 2 Byte Length |


    Figure 4.10 UDP pseudoheader for checksum computation.


    Padding is required in at least one (and possibly two) places in the checksummed
    data. There is a 1-byte pad between the destination IP address and the Protocol
    field. If there is an odd number of bytes in the data portion of the UDP datagram,
    an additional 1-byte pad is required to make the checksummed data align on a 2-byte
    boundary.'
  merge: -1
