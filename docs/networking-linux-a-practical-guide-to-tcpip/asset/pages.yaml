    Copyright: GPL

    Group: Applications/Terminal

    Source: http://netfu.org/source/net-fu-0.1.tgz

    Distribution: RedHat

    Vendor: N/A

    Packager: Pat Eyler


    ```

    %description


    %prep


    %setup -q


    %build

    configure --prefix=/usr/local

    make

    ```'
