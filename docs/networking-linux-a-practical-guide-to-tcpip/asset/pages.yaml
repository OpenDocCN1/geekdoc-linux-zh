    # arp


    If you have a host that isn''t communicating with the other hosts on its network
    (for example, you can''t ping it, nor can the host ping other boxes), looking
    in the arp cache is a good check to see if the host is talking to the network
    or if there is already another host on the same IP address


    # An Overview of arp


    The arp command takes a variety of options. The most important of these are summarized
    in Table 9.2.


    Table 9.2 arp Options

    | Short Style Option | Long Style Option | Purpose |

    | --- | --- | --- |

    | -a | (No long option) | Displays all hosts in the BSD style |

    | -s | -set | Sets a new arp entry |

    | -d | -delete | Deletes an arp entry |

    | -n | -numeric | Displays contents without resolving names |

    | -v | -version | Is verbose |


    Many of these options can be combined to provide better results. The -n option
    is of particular note here. If an IP address is not resolvable to a hostname,
    arp will hang for a long time waiting to resolve it. I almost turn resolving off
    for networking commands.


    # arp at Work


    In introducing arp as a troubleshooting tool, I mentioned using it to check for
    more than one host with the same IP address. Next is an example of using arp and
    ifconfig to find this problem.'
