- img_proc: true
  md: 'Filters are written by combining primitives with conjunctions (and or or).
    Primitives can be preceded by the term not.


    Primitives are normally formed with an ID (which can be numeric or a symbolic
    name preceded by one or more qualifiers). There are three kinds of qualifiers:
    type, direction, and protocol.


    +   - Type qualifiers describe what the ID refers to. Allowed options are host,
    net, and port. If type is not given, the primitive defaults to host. Examples
    of type primitives are hostcretestdummy, 192.168.2, and port 88.

    - Directional qualifiers indicate which direction traffic is flowing in. Allowable
    qualifiers are src and dst. Examples of directional primitives are src cherry,
    dst mango, and src or dst port http. This last example shows two qualifiers used
    with a single ID.

    - Protocol qualifiers limit the captured packets to those of a single protocol.
    In the absence of a protocol qualifier, all IP packets are captured (subject to
    other filtering rules). Protocols that can be filtered are TCP, UDP, and ICMP
    You might use a protocol qualifier such as icmp or top dst port telnet.


    Primitives can be negated and combined to develop more complex filters. If you
    want to see all traffic to rose except Telnet and FTP data, you could use the
    filter dst rose and not port telnet and not port ftp-data.


    Some command-line switches are worth noting as well. Table 9.3 shows the command-line
    switches likely to be of the most used. As usual, check the main page for more
    detail.


    # Table 9.3 Command-Line Switches for ngrep


    | Switch | Description |

    | -e | Shows empty packets |

    | -n [num] | Matches num packets and then exits |

    | -i [expression] | Searches for the regular expression without regard to case
    |

    | -v [expression] | Searches for packets not containing the regular expression
    |

    | -t | Prints a YYYY/MM/DD HH:MM:SS.UUUUUU timestamp on each matched packet |

    | -T | Displays a +S.UUUUUU timestamp on each matched packet |

    | -X | Shows the packets in the alternate hex and ASCII style |

    | -I [filename] | Reads from a pcap-style dump filename instead of live traffic
    |

    | -O filename | Writes output to a pcap-style file named filename |

    | -D | Mimics real time by printing matched packets at their recorded timestamp
    |'
