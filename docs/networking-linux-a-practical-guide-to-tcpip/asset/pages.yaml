    # 4.1.3.2 Idle Timeout


    A Server-FTP process SHOULD have an idle timeout, which will terminate the process
    and close the control connection if the server is inactive (i.e., no command or
    data transfer in progress) for a long period of time. The idle timeout time SHOULD
    be configurable, and the default should be at least 5 minutes.


    A client FTP (“User-PI”) in RFC-959 will need timeouts on responses only if it
    is invoked by a program.


    DISCUSSION:


    Without a timeout, a Server-FTP process may be left indefinitely if the corresponding
    client crashes without closing the control connection.


    # 4.1.3.3 Concurrency of Data and Control


    DISCUSSION:


    The intent of the designers of FTP was that a user should be able to send a STAT
    command at any time while data transfer was in progress and that the server-FTP
    would immediately reply with status—e.g., the number of bytes transferred so far.
    Similarly, an ABORT command should be possible at any time during a data transfer.
    Unfortunately, some small-machine operating systems make such concurrent programming
    difficult, and some other implementers seek minimal solutions, so some FTP implementations
    do not allow concurrent use of the data and control connections. Even a minimal
    server must be prepared to accept and defer a STAT or ABOR command that arrives
    during data transfer.


    # 4.1.3.4 FTP Restart Mechanism


    The description of the 11 reply on pp. 40-41 of RFC-959 is incorrect; the correct
    description is as follows. A restart reply message, sent over the control connection
    from the receiving FTP to the User-FTP, has the format:


    ```

    110 MARK ssss = rrrr

    ```'
