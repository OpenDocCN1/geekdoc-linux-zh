  md: '# Chapter 10 Monitoring Tools


    # Example 10.2 Installing Libcap


    ```

    [root@phred src] tar xvzf libcap-0.5.2.tar.gz

    [root@phred src] cd libcap-0.5

    [root@libcap-0.5] ./configure

    [root@libcap-0.5] make

    [root@libcap-0.5] make install

    [root@libcap-0.5] mkdir -p /usr/local/lib/net

    [root@libcap-0.5] make install-incl

    ```


    After libcap is built, you get smooth sailing in front of you. Ethereal is a three-step

    Building Ethereal is shown in Example 10.3.


    # Example 10.3 Building Ethereal


    ```

    [root@src] tar xvzf ethereal-0.8.14.tar.gz

    [root@src] cd ethereal-0.8.14

    [root@ethereal-0.8.14] ./configure

    [root@ethereal-0.8.14] make

    [root@ethereal-0.8.14] make install

    ```


    # Using Ethereal to Capture Packets


    Because the primary use of a protocol analyzer is to capture packets, that''s
    just what

    we''ll do. I''ll start with a simple example, move to more startup options for
    Ethereal

    and Tethereal, and wrap up with a more advanced example.


    # A Simple Example


    Using Ethereal can be quite simple; typing Ethereal at the command line (as some)

    with permission to the NIC into promiscuous mode) will start the GUI. When the

    GUI has started, you can select Capture, Start, which brings up the Capture Preferences

    window. This should have valid defaults set, but I like to click the Update List
    of

    Packets in Real Time and Automatic Scrolling in Live Capture. Now press the

    Start button and watch your capture run.


    While the capture is running, it displays the total number of packets captured
    in the

    Ethereal: Capture/Playback window. It also updates the main Ethereal window with

    each packet that it grabs. After you''ve captured what you needed, you can stop

    the capture by hitting the Stop button in the Ethereal: Capture/Playback window.

    While the capture is running, you should see something similar to the display
    shown

    in Figure 10.2.'
