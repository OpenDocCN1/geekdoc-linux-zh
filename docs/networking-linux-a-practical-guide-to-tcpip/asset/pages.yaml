  md: '# Appendix A RFC-1122


    # 4.2.2.7 TCP Checksum: RFC-793 Section 3.1


    Unlike the UDP checksum (see Section 4.1.3.4), the TCP checksum is never optional.
    The sender MUST generate it and the receiver MUST check it.


    # 4.2.2.8 TCP Connection State Diagram: RFC-793 Section 3.2


    There are several problems with this diagram:


    +   (A)The arrow from SYN-SENT to SYN-RCVD should be labeled with "snd SYN,ACK,"
    to agree with the text on page 68 and with Figure 8.


    +   (B)There could be an arrow from SYN-RCVD state to LISTEN state, conditioned
    on receiving a RST after a passive open (see text page 70).


    +   (C)It is possible to go directly from FIN-WAIT-1 to the TIME-WAIT state (see
    page 75 of the spec).


    # 4.2.2.9 Initial Sequence Number Selection: RFC-793 Section 3.3


    A TCP MUST use the specified clock-driven selection of initial sequence numbers.


    # 4.2.2.10 Simultaneous Open Attempts: RFC-793 Section 3.4


    There is an error in Figure 8: the packet on line 7 should be identical to the
    packet on line 5. A TCP MUST support simultaneous open attempts.


    DISCUSSION:


    It surprises implementors that if two applications attempt to simultaneously connect
    to each other, only one connection is generated instead of two. This was an intentional
    design decision; don''t try to "fix" it.


    # 4.2.2.11 Recovery from Old Duplicate SYN: RFC-793 Section 3.4


    Note that a TCP implementation MUST keep track of whether a connection has reached
