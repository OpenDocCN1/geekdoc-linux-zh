  md: '# Electronic Mail–SMTP and RFC-822 347


    The sender-SMTP can shorten the queuing delay with cooperation with the receiver-SMTP.
    In particular, if mail is received from a particular address, it is good evidence
    that any mail queued for that host can now be sent.


    The strategy may be further modified as a result of multiple addresses for host
    (see Section 5.3.4), to optimize delivery time vs. resource usage.


    A sender-SMTP may have a large queue of messages for each available destination
    host, and if it retried all these messages in every retry cycle, there would be
    excessive Internet overhead and the daemon would be blocked for a long period:
    Note that an SMTP can generally determine that a delivery attempt has failed only
    after a timeout of a minute or more; one minute timeout per connection will result
    in a very large delay if it is repeated for dozens or hundreds of queued messages.


    When the message is delivered to several users on the same host, only one copy
    of the message SHOULD transmitted. That is, the sender-SMTP should use the command
    sequence: RCPT, RCPT, ... RCPT, DATA instead of the sequence: RCPT, DATA, RCPT,
    DATA, ... RCPT, DATA.


    Implementation of this efficiency is strongly urged.


    Similarly, the sender-SMTP MAY support multiple concurrent outgoing mail transactions
    to achieve delivery efficiency. However, some limit SHOULD be imposed to protect
    the host from devouring all its resources to mail.


    The use of the different addresses of a multihomed host is discussed below.


    # 5.3.1.2 Receiving strategy


    The receiver-SMTP SHOULD attempt to keep a pending listen on the SMTP port at
    all times. This will require the support of multiple incoming TCP connections
    for SMTP. Some limit MAY be imposed.


    # IMPLEMENTATION:


    When the receiver-SMTP receives mail from a particular host address, it could
    notify the sender-SMTP to retry any mail pending for that host address.


    # 5.3.2 Timeouts in SMTP


    There are two approaches to timeouts in the sender-SMTP: (a) the limit for each
    SMTP command separately, or (b) the limit for the entire SMTP dialogue for a single
    message. A sender-SMTP SHOULD use option (a), per-command-timeouts. Timeouts SHOULD
    be easily reconfigurable, preferably without recompiling the SMTP code.


    # DISCUSSION:


    Timeouts are an essential feature of an SMTP implementation. If the timeouts are
    too long (or worse, there are no timeouts), Internet communication failures or
    software bugs in receiver-SMTP programs can use SMTP processes indefinitely. If
    the timeouts are too short, resources will be wasted with attempts that time out
    way through message delivery.'
  merge: -1
  pgno: 364
- img_proc: true
  md: 'If option (b) is used, the timeout has to be very large, e.g., an hour, to
    allow time to expand very large mailing lists. The timeout may also need to increase
    linearly with the size of the message, to account for the time to transmit a very
    large message. A large fixed timeout leads to two problems: a failure can still
    tie up the sender for a very long time, and very large messages may still spuriously
    time out (which is a wasteful failure!).


    Using the recommended option (a), a timer is set for each SMTP command and for
    each buffer of the data transfer. The latter means that the overall timeout is
    inherently proportional to the size of the message.


    Based on experience with busy mail-relay hosts, the minimum per-command timeout
    values SHOULD be as follows:


    +   Initial 220 Message: 5 minutes


    +   A Sender-SMTP process needs to distinguish between a failed TCP connection
    and a delay in receiving the initial 220 greeting message. Many receiver-SMTPs
    will accept a TCP connection but delay delivery of the 220 message until their
    system load will permit more mail to be processed.


    +   MAIL Command: 5 minutes


    +   RCPT Command: 5 minutes


    A longer timeout would be required if processing of mailing lists and aliases
    are deferred until after the message was accepted.


    +   DATA Initiation: 2 minutes


    This is while awaiting the "354 Start Input" reply to a DATA command.


    +   Data Block: 3 minutes


    This is while awaiting the completion of each TCP SEND call transmitting a chunk
    of data.

    DATA Termination: 10 minutes.


    This is while awaiting the "250 OK" reply. When the receiver gets the final period
    terminating the message data, typically performs processing to deliver the message
    to a user mailbox. A spurious timeout at this point would be very wasteful, since
    the message has been successfully sent.


    A receiver-SMTP SHOULD have a timeout of at least 5 minutes while it is awaiting
    the next command from the sender.


    # 5.3.3 Reliable Mail Receipt


    When the receiver-SMTP accepts a piece of mail (by sending a "250 OK" message
    in response to DATA), it is accepting responsibility for delivering or relaying
    the message. It must take this responsibility seriously, i.e., it MUST NOT lose
    the message for frivolous reasons, e.g., because the host crashes or because of
    a predictable resource shortage.'
