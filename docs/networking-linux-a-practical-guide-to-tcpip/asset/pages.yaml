  md: '# iptables 193


    The -A GATE statement means this is a new rule being added to the end of the GATE
    chain.The -s 192.168.1.20 statement applies this rule to any packet with a source
    address of 192.168.1.20.The -j DROP tells netfilter to drop this packet without
    further processing. Each rule that you build will follow this basic pattern.


    # Filtering by Address


    In our example, we defined a source address with the -s option. This option can
    also be used to define a range of addresses using a network mask:


    +   - s 192.168.1.0/24


    or a hostname:


    +   - s crastestdummy


    In addition to source addresses, we can also filter by destination address with
    the -d switch. (-source, -src, -destination, and -dst are all legal forms of this
    switch as well.


    # Filtering by Interface


    Instead of filtering by address, you can also define filters by the interface.
    -i and -in-interface define inbound interfaces, while -o and -out-interface define
    outbound interfaces.


    The INBOUND chain only matches inbound interfaces and the OUTBOUND chain only
    matches outbound interfaces.The FORWARD chain can match either. If you define
    a non-existent interface, it will not match any packets (or unless) that interface
    is brought up.There is also a special interface matching wildcard—the + sign indicates
    any interface matching the string preceding it:


    +   -o eth+


    That matches any packet destined to be sent out any Ethernet interface.


    # Filtering by Protocol


    Protocols can be matched by using the -p switch.You can identify protocols either
    by the (IP) protocol number (for the TCP, UDP, and ICMP) by its name. To specify
    all ICMP traffic, you could use


    +   -p ICMP'
