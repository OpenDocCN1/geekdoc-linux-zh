  md: '# 1.2 General Considerations


    There are two important lessons that vendors of Internet host software have learned
    and which a new vendor should consider seriously.


    # 1.2.1 Continuing Internet Evolution


    The enormous growth of the Internet has revealed problems of management and scaling
    in a large datagram-based packet communication system. These problems are being
    addressed, and as a result there will be continuing evolution of the specifications
    described in this document. These changes will be carefully planned and controlled,
    because there is extensive participation in this planning by the vendors and by
    the organizations responsible for operations of the networks.

    Development, evolution, and revision are characteristic of computer network protocols
    today, and this will persist for some years. A vendor who develops computer communication
    software for the Internet protocol suite (or any other protocol!) and then fails
    to maintain and update software for changing specifications is going to leave
    a trail of unhappy customers. The Internet is a large communication network, and
    the users are in constant contact through it. Experience has shown that knowledge
    of deficiencies in vendor software propagates quickly through the Internet technical
    community.


    # 1.2.2 Robustness Principle


    At every layer of the protocols, there is a general rule whose application can
    lead to enormous benefits in robustness and interoperability [IP:1]:


    > “Be liberal in what you accept, and conservative in what you send”


    Software should be written to deal with every conceivable error, no matter how
    unlikely; sooner or later a packet will come in with that particular combination
    of errors and attributes, and unless the software is prepared, chaos can ensue.
    In general, it is best to assume that the network is filled with malvolent entities
    that will send in packets designed to have the worst possible effect. This assumption
    will lead to suitable protective design, although the most serious problems in
    the Internet have been caused by unenv mechanisms triggered by low-probability
    events; where human malice would never have taken such a devious course!


    Adaptability to change must be designed into all levels of Internet host software.
    As a simple example, consider a protocol that contains an enumeration of values
    for a particular header field–e.g., a type field, a port number, or an error code;
    this enumeration must be assumed to be incomplete. Thus, if a protocol defines
    four possible error codes, the software must not break when a fifth code shows
    up. An undefined code may be logged, but it must not cause a failure.

    The second part of the principle is almost as important: software on other hosts
    may contain deficiencies that make it unwise to exploit legacy or obscure protocol
    features. It is unwise to stray from the obvious and simple, lest unintended effect
    result'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# Introduction 27


    elsewhere. A corollary of this is "watch out for misbehaving hosts"; host software
    would be prepared, not just to survive other misbehaving hosts, but also to cooperate
    to limit the amount of disruption such hosts can cause to the shared communication
    facility.


    # 1.2.2 Error Logging


    The Internet includes a great variety of host and gateway systems, implementing
    many protocols and protocol layers, and some of these contain bugs and misfortunes
    in their Internet protocol software. As a result of complexity, diversity, and
    distribution of function, the diagnosis of Internet problems is often very difficult.
    Problem diagnosis will be aided if host implementations use a carefully designed
    facility for logging erroneous or "strange" protocol events. It is important to
    include as much diagnostic information as possible when an error is logged. In
    particular, it is often useful to record the header(s) of a packet that passed
    through silicon, However, care must be taken to ensure that error logging does
    not consume prohibitive amounts of resources or otherwise interfere with the operation
    of the host.


    There is tendency for abnormal but harmless protocol to overflow error logging
    files; this can be avoided by using a "circular" log, or by enabling logging only
    while diagnosing a known failure. It may be useful to filter and count duplicate
    messages. One strategy that seems to work well is: (1) always count abnormalities
    and make such counts accessible through the management protocol (see [INTRO:1]);
    and (2) allow the logging of a great variety of events to be selectively enabled.
    For example, it might be useful to be "log everything" or "log everything for
    host X." Note that different management may have different policies about the
    amount of error logging that they want enabled in a host. Some will say, "if it
    doesn''t hurt me, I don''t want to know about it," while others will want to take
    a more watchful and aggressive attitude towards detecting and removing protocol
    abnormalities.


    # 1.2.4 Configuration


    It would be ideal if a host implementation of the Internet protocol could be entirely
    self-configuring. This would allow the whole suite to be implemented in ROM or
    cast into silicon, it would simplify dismiss workstations, and it would be an
    immense boon to harried LAN administrators as well as system vendors. We have
    not reached this; in fact, we are not even close.


    At many points in this document, you will find a requirement that a parameter
    be configurable option. There are several different reasons behind such requirements.
    In a few cases, there is uncertainty or disagreement about the best value, and
    it may be necessary to update the recommended value in the future. In other cases,
    the value really depends on external factors—e.g., the size of the host and the
    distribution of its communication load, or the speeds and topology of nearby networks—and
    self-tuning algorithms are unavailable and may be insufficient. In some cases,
    configuration is needed because of administrative requirements.'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# Appendix A RFC-1122


    Finally, some configuration options are required to communicate with obsolete
    or incorrect implementations of the protocols, distributed without sources, unfortunately
    persists in many parts of the Internet. To make correct systems coexist with these
    faulty systems, administrators often have to “misconfigure” the correct systems.
    This problem will correct itself gradually as the faulty systems are retired,
    but it cannot be ignored by vendors.


    When we say that a parameter is configurable, we do not intend to require that
    its value be explicitly read from a configuration file at every boot time. We
    recommend that implementors use a default for each parameter, so a configuration
    file is only necessary to override these defaults that are inappropriate in a
    particular installation. Thus, the configurability requirement is an assurance
    that it will be POSSIBLE to override the default when necessary, even in a binary-only
    or ROM-based protocol. This document requires a particular value for defaults
    in some cases. The choice of default is a sensitive issue when the configuration
    item controls the accommodation to existing faulty systems. If the Internet is
    to converge successfully defaults built into implementations must implement the
    official protocol, not “misconfigurations” to accommodate faulty implementations.

    Marketing considerations have led some vendors to choose misconfiguration defaults,
    we urge vendors to choose defaults that will conform to the standard.

    Finally, we note that a vendor needs to provide adequate documentation on all
    configuration parameters, their limits and effects.


    # Reading this Document


    # 1.31 Organization


    Protocol layering, which is generally used as an organizing principle in implementing
    network software, has also been used to organize this document. We assume that
    an implementation does strictly mirror the layering of the protocols. Thus, the
    following three major sections specify the requirements for the link layer, the
    internet layer, and the transport layer, respectively. A companion RFC [INTRO:1]
    covers application level software. This layerist organization was chosen for simplicity
    and clarity.


    Strict layering is an ideal model, but for the protocol suite and recommended
    implementation approaches. Protocols in different layers interact complex and
    sometimes subtle ways, and particular functions often imply multiple layers. There
    are many design choices in an implementation, many of which involve creative “breaking”
    of strict layering. Every implementor is urged to read references [INTRO:7] and
    [INTRO:8].


    This document describes the conceptual service interface between layers using
    functional (“procedure call”) notation, like that used in the TCP specification
    [TCP:1].A host implementation must support the local information flow implied
    by these calls, but not literally implement the calls themselves. For example,
    many implementations'
