  md: '# Chapter 7 Before Things Break—Building a Baseline


    Deciding what and how much to keep may seem like a difficult task, (with the help
    of your system tools) it is pretty easy.

    I recommend that you keep a list of installed software; if you use rpm to manage
    your system, this is not difficult. You can use the following command:


    ```

    [root cherryconf#] rpm -qa sort >rpm-qa

    [root cherryconf#]

    ```


    This will create a list of all installed packages in the following format:

    ElectricFence:2.1-3

    GCon-0.5-0_helix_2

    GCon-devel-0.5-0_helix_2

    Gtk-Perl-0.7003-0_helix_2

    ImageMagick-4.2.9-3

    MADEDEV-2.5.2-1


    Because the records are sorted, they are suitable for comparison with tools such
    as comm.

    Using rpm can cause a bit of additional work for you because not all packages
    come in rpm packages. If you choose to simplify your record keeping and maintenance,
    you will want to learn how to build your own rpm. This is not a difficult task,
    but it will require a bit of ramping up. The basic procedure is to move a tarball
    of the application (it should be named foo-version.tgz) to /usr/src/redSOURCES
    directory. Then create a spec file in /usr/src/redhat/SPECS. Here''s a sample
    spec file:


    Summary: net-fu - a network fumigator

