  md: '# Appendix B RFC-1123


    Whether it is possible to have a truncated answer depends on the application.
    A mailer must not use a truncated MX response, since this could lead to mail loops.
    Responsible practices can make UDP suffice in the vast majority of cases. Name
    servers must use compression in responses. Resolvers must differentiate truncation
    of the Additional section of a response (which only loses extra information) from
    truncation of the Answer section (which for MX records renders the response unusable
    by mailers). Database administrators should list only a reasonable number of primary
    names in lists name servers, MX alternatives, etc.


    However, it is clear that some new DNS record types in the future will contain
    information exceeding the 512 byte limit which applies to UDP, and hence will
    require TCP. Thus, and name servers must implement TCP services as a backup to
    UDP today, with the knowledge that they will require the TCP service in the future.


    By private agreement, name servers and resolvers may arrange to use TCP for all
    traffic between themselves. TCP MUST be used for zone transfers.


    A DNS server MUST have sufficient concurrency that it can continue to process
    UDP queries while awaiting a response or performing a zone transfer on an open
    TCP connection [DNS:2]


    A server MAY support a UDP query that is delivered via an IP broadcast or multicast
    address. However, the Recursion Desired bit MUST NOT be set in a query that is
    multicast, and MUST be ignored by name servers querying via a broadcast or multicast
    address. A host that needs broadcast or multicast DNS queries SHOULD send them
    as occasional probes, caching the IP address (es) it obtains from the response(s)
    so it can normally unicast queries.


    DISCUSSION:


    Broadcast or (especially) IP multicast can provide a way to locate nearby name
    servers without knowing their IP addresses in advance. However, general broadcasting
    of recursive queries can result in excessive and unnecessary load on both network
    and servers.


    # 6.1.3.3 Efficient Resource Usage


    The following requirements on servers and resolvers are very important to the
    health of the Internet as a whole, particularly when DNS services are invoked
    repeatedly by higher level automatic servers, such as mailers.


    +   1. The resolver MUST implement retransmission controls to ensure that it does
    not waste communication bandwidth, and MUST impose finite bounds on the resources
    consumed to respond to a single request. See [DNS:2] pages 43-44 for specific
    recommendations.


    +   2. After a query has been retransmitted several times without a response,
    an implementation MUST give up and return a soft error to the application.


    +   3. All DNS name servers and resolvers SHOULD cache temporary failures, with
    a timeout period of the order of minutes.'
