  md: '# Networking Hardware: Routers and Switches and Hubs, Oh My!


    Networking hardware is too often viewed as black magic—something to be used but
    never understood. In reality, things really aren''t that difficult. Different
    kinds of networking-hardware act on network traffic at different levels; this
    allows them to be used in different ways.


    Hubs, concentrators, and repeaters act at the physical layer. Their sole purpose
    is to regenerate the electrical signal (including any errors) to each outgoing
    connection.

    Hubs and concentrators are both devices for connecting 10BaseT and 100BaseTx networks.
    The them are mostly interchangeable, although hubs connote smaller devices (4–24
    ports) while concentrators denote large devices (24 ports and up).

    Repeaters are thraws and were used to extend the length of a network by connecting
    two full-length network segments.


    Hubs are often used as the basic fabric of small networks because they cost less
    than other solutions (although this difference is decreasing, and hubs are becoming
    less popular). Figure 1.10 shows a hub-based network.


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_29_0.png)


    Figure 1.10 A small network.


    One problem with a hub-based network is that every host on the network sees all
    the traffic destined for every other host on that network. This can lead to network
    congestion in heavily populated networks.


    Switches and bridges operate at the link layer. They restrict traffic to outgoing
    connections known not to need it. For example, if three hosts are connected to
    different ports on a switch and the first host sends traffic to the third, the
    switch will send the traffic out only the port that the third host is connected
    to. If any of the hosts were to send broadcast traffic (described in the next
    chapter), it would be sent out each port on the switch. This trait makes switches
    a good device to use as the basic fabric for networks.'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'Bridges, like repeaters, are throwbacks to an earlier age. They were used to
    connect two Ethernet networks while isolating the traffic to a greater degree
    than repeaters or hubs. Today, implementations use a switch instead of a bridge.
    They work the same way, and switches are both faster and capable of handling multiple
    connections (bridges typically had only two Ethernet ports).


    Routers work at the network layer. They are used to pass traffic among multiple
    networks. The operation of routers is described more fully in Chapter 3, “Network-Layer
    Protocols.” Switches (often called routing switches) also act on network traffic
    at the network layer. Routers provide more segregation between networks and can
    be used to move data from one link-layer protocol to another (for example, from
    Ethernet to PPP).


    Where hubs and switches make up the fabric of LANs, routers are the key element
    of WANs. Because of their role in connecting networks, routers (and routing switches)
    are a common “choke point” where network control is done. This topic is covered
    in more detail in the section “iptables” in Chapter 10, “Monitoring Tools.”


    # # Endnotes


