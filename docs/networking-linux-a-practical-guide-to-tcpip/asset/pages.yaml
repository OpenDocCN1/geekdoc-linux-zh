  md: '# 3.3.7 IP Multicasting


    A host SHOULD support local IP multicasting on all connected networks for which
    a mapping from Class D IP addresses to link-layer addresses has been specified
    (see below). Support for local IP multicasting includes sending multicast datagrams,
    joining multicast groups and leaving multicast groups. This implies support for
    all of [IP:4] the IGMP protocol itself, which is OPTIONAL.


    IGMP provides gateways that are capable of multicast routing with the information
    required to support IP multicasting across multiple networks. At this time, multicast-routing
    gateways are in the experimental stage and are not widely available. For hosts
    that are not connected to networks with multicast-routing gateways or that do
    not need to receive multicast datagrams originating from other networks, IGMP
    serves no purpose and is therefore optional for now. However, the rest of [IP:4]
    is currently recommended for the purpose of providing IP-layer access to local
    network multicast addressing. It is expected that IGMP will become recommended
    at some future date, when multicast-routing gateways become more widely available.
    If IGMP is not implemented, a host SHOULD still join the "all-hosts" group (224.0.0.1)
    when the IP layer is initialized and remain a member for long as the IP layer
    is active.


    Joining the "all-hosts" group will support strictly local uses of multicasting,
    e.g., a gateway discovery protocol, even if IGMP is not implemented.


    The mapping of IP Class D addresses to local addresses is currently specified
    for the following types of networks:


    +   - Ethernet/IEEE 802.3, as defined in [IP:4).

    - Any network that supports broadcast but not multicast, addressing: all IP Class
    D addresses map to the local broadcast address.

    - Any type of point-to-point link (e.g., SLIP or HDLC): no mapping required. All
    IP multicast datagrams are sent as-is, inside the local framing. Mappings for
    other types of networks will be specified in the future.


    A host SHOULD provide a way for higher-layer protocols or applications to determine
    which of the host''s connected network(s) support IP multicasting.


    # 3.3.8 Error Reporting


    Wherever practice, hosts MUST return ICMP error datagrams on detection of an error,
    except in cases where returning an ICMP error message is specifically prohibited.


    A common phenomenon in datagram networks is the "black hole disease": datagrams
    are sent out, but nothing comes back. Without any error datagrams, it is difficult
    for the user to figure out what the problem is.'
