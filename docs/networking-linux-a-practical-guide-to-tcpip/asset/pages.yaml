    To efficiently route a series of datagrams to the same destination, the source
    host MUST keep a ''route cache'' of mappings to next-hop gateways. A host uses
    the following basic algorithm on this cache to route a datagram; this algorithm
    is designed to put the primary routing burden on the gateways [IP:11]:


    +   (a) If the route cache contains no information for a particular destination,
    the host chooses a ''default'' gateway and sends the datagram to it. It builds
    a corresponding Route Cache entry.


    +   (b) If gateway is not the best hop to the destination, the gateway will forward
    the datagram to the next-hop gateway and return an ICMP Redirect message to the
    source host.


    +   (c) When it receives a Redirect, the host updates the next-hop gateway in
    the appropriate route cache, so later datagrams to the destination will go directly
    to the best gateway.


    Because the subnet mask appropriate to the destination address is generally not
    known, a Network Redirect message SHOULD be treated identically as a Host Redirect
    message; i.e., the cache entry for the destination host (only) will be updated
    (or created, if an entry for that host did not exist) for the new gateway.


