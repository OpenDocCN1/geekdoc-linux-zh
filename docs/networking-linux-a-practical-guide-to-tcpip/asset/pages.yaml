  md: 'When Nessus has completed its scan, it brings up a report window. Clicking
    the host name or IP brings a cascading list of potential vulnerabilities on that
    host. In 11.7, I expanded a listed vulnerability to show the kind of detail Nessus
    is able to display.


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_203_0.png)


    Figure 11.7 A Nessus report.


    # Saving and Reading Reports


    Typically, you should save reports of scans so that you can keep a trail of what-potential
    vulnerabilities show up in your network and when they do.


    You can save a report by clicking the Save As button. Make sure that you use a
    consistent naming scheme and that you can interpret the names. Something like
    <hostname>-<date>.nsr is probably good. Depending on the number of hosts in your
    network, you might find that you need to keep subdirectories for LANs, for kinds
    of machines, and/or for time periods that you run scans. In general, find the
    right level of organization for yourself and stick with it.


    Going back to review an old scan report is easy. You just need to click the Load
    Report button at the bottom of the main window. This brings up a selection box
    for you to select the report you want to view. After you''ve loaded the report,
    it comes up in a report window.


