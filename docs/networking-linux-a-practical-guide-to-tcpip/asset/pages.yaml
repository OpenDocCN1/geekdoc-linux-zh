  md: '# Networking Linux


    A Practical Guide to TCP/IP


    TCP/IP is the primary networking protocol in use today. It is the protocol that
    the Internet is built upon and provides the capability for computers to share
    files and services. While there is a substantial number of TCP/IP books, none
    provides hands-on implementation specifies for the Linux platform.


    Networking Linux: A Practical Guide to TCP/IP goes beyond the conceptual and shows
    step-by-step the necessary know how to Linux TCP/IP implementation. If you are
    a programmer or network administrator in need of a platform-specific guide to
    increase your knowledge and overall efficiency, this is the book for you.


    Pat Eyer has been working with TCP/IP and UNIX since 1988 and with Linux worked
    as a network analyst, administrator, and engineer for Boeing and Ameritech. He
    has also spent time as a systems administrator for Philips and Fidelity. He has
    taught courses on systems administration and working for American Research Group
    and the U.S. Army. More recently he has been involved in supporting ecommerce
    and Web development for ''clicks and mortar'' and ''dot com''. Pat has also written
    material for companies, user groups, and the general public on Linux/Unix, shell
    scripting, and networking. Some of his best work has appeared in the Linux Gazette.
    Pat has designed and managed IAN and WANs supporting everything from small/home
    offices to multiple networks. His favorite network is at home, where he is busy
    teaching his home-schooled kids to use Linux instead of that other OS.


    If you are a developer or an administrator who needs to understand TCP/IP networking
    on the Linux platform, use this book to gain:


    +   A description of the TCP/IP protocol suite


    +   Information about each of the TCP/IP layers


    +   An introduction to network administration


    +   Tips to improve your network management skills


    +   Introductions to several key tools used in managing networks, such as Ethernet,
    Ethereal and Nessus


    +   Fully indexed copies of some of the major RFCs covering TCP/IP


    +   Practical advice on using the protocols effectively


    +   Real-world case studies and troubleshooting tips


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_451_0.png)


    Linux / TCP/IP


    $39.99 USA / $59.95 CAN / $30.99 Net UK


    www.newriders.com www.networkinglinuxbook.com'
