  md: '# Ethereal 167


    # Filtering Packets with Ethereal


    Even a small network can have a lot of data running over it. Filters help you
    cut through the chaff to see just the data you are interested in. Two kinds of
    filters exist for Ethereal, capture filters and display filters. Capture filters
    are applied as the data is being read from the network. If traffic doesn''t match
    the filter, it isn''t read into Ethereal. Display filters are applied against
    traffic that Ethereal has already captured. Both styles of filters, with some
    pros and cons, are covered in the next two sections.


    # Filtering Packets to Be Captured


    Capture filters are written in the libcap syntax, which is covered in more detail
    in the section "ngrep" in Chapter 9. A quick overview is provided here as well.
    Capture filters are nice because they are fast and they operate on the raw traffic
    as it is being captured. This can be a huge benefit on a busy LAN; you''ll get
    only the traffic you''re interested in, not the other 8MB of traffic that would
    otherwise have to go through. Capture filters are not a panacea; though they may
    get only 50% of the way you goal. That''s where display filters come in.


    Libcap-style filters use the <type> <direction> [id] (such as host 192.168.1.10).
    These filters can be combined with the conjunctions and or. If you want to see
    all traffic between 192.168.1.1 and 192.168.1.10, you can use a filter as host
    192.168.1.1 and host 192.168.1.10. To look at traffic return, you can also use
    src 192.168.1.1 and host 192.168.1.10.


    # Filtering Packets to Be Displayed


    The display filter syntax is more expressive (and capable) than the capture filters
    described previously. Although capture filters are entered at the start of the
    capture (either on the command line or in the Capture Preferences window), display
    filters are entered after the capture is complete. With a capture buffer loaded,
    you can define a display filter in the section of the status bar at the bottom
    of the Main window. You can clear your active display filter by clicking the Reset
    button.


    Display filters have an expressive syntax but can be quite basic. A simple filter
    to look at all the traffic from 192.168.1.1 to 192.168.1.10 would look like ip.src
    == 192.168.1.1 && dst == 192.168.1.10.


    A more complex example would be to look at all traffic from 192.168.1.20 or (ip.src==192.168.1.16
    or dst==192.168.1.20). If you want to extend the previous section to exclude HTTPS,
    you could write ((ip.src==192.168.1.21 or dst==192.168.1.20) and top.port!=syn).


    Ethereal provides additional filter comparison operators as well. ==, !=, >, <,
    and <= are all available in the C-style format or with English-style names. Beyond,
    you can use a substring operator to match fields within a value. For example,
    you might want to match on the first octets of an Ethernet source address; you
    could do with eth.src[0:3] == 00:a0:d2.


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_184_0.png)'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# Reporting Bugs


    If you happen to find a bug in Ethereal, please report it. If you''re a C hacker
    and think you know how to fix it, do not hesitate to send in a patch as well.
    (Your patch might not be used, but it will likely help the developers see where
    things are going wrong.) Bug reports can be directed to the ethereal-dev mailing
    list (you can subscribe through http://ethereal.zingorg/; click the Mailing Lists
    link on the left side). Your bug report should include the following things (at
    a minimum):


    +   * The version of Ethereal that you are using and the versions of software
    that it is linked against. This can be grabbed from ethereal -v, like so:

    ```bash

    [@cherry sgml]$ ethereal -v

    ethereal 0.8.7, with GTK+ 1.2.7, with libcap 0.4, with libz 1.1.3, with UCD

    ~SNMP 4.1.1

    [@cherry sgml]$

    ```

    Note: This is an example, the actual output may vary.

    * A trace of Ethereal, if it crashed. To get a corefile, look for a corefile in
    your current working directory, run file core to ensure that it is the Ethereal
    core file (you also might want to verify the date of the core file, just to be
    safe), and then run the commands:

    ```bash

    [@cherry page]$ gdb /usr/bin/ethereal core >& backtrace.txt

    backtrace

    [@cherry page]$

    ```


    This will create a file backtrace.txt, which you can mail in with your bug report.


    +   * A description of what you were doing when Ethereal exhibited the bug. The
    more detail you can add here, the better.


    Creating a good bug report is an art form, but it''s something that should be
    taken seriously. The developers of Ethereal cannot help fix problems if they don''t
    know what is broken.


    # mon


    mon is a resource-monitoring system designed to measure host or service availability.
    It was developed by Jim Trocki (trockij@transmeta.com) and is supported by an
    active community with a Web site at www.kernel.org/software/mon/ and a mailing
    list (information is available at the same location).


    mon handles monitoring as two separate tasks: testing conditions and alerting
    on failures. Both functions are handled by external programs (usually scripts
    written in Perl). Many such scripts are distributed with mon.'
