    # Requirements for Internet Hosts—Application and Support


    Status of This Memo


    This RFC is an official specification for the Internet community. It incorporates
    by reference, amends, corrects, and supplements the primary protocol standards
    documents relating to hosts. Distribution of this document is unlimited.


    Summary


    This RFC is one of a pair that defines and discusses the requirements for Internet
    host software. This RFC covers the application and support protocols; its companion
