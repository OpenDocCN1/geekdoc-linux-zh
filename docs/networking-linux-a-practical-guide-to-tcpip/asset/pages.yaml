- img_proc: true
  md: '# 192 Chapter 11 Security Tools


    As important as efficiency is, we tend to overlook a major component of it—human
    time. If your rules are hard to read and understand, they will take a great deal
    of human time to maintain. In addition, as they get hairy, your chances of making
    a mistake increase dramatically. I don''t like working late into the weekend to
    figure out why a needlessly complex set of rules isn''t working the way I want
    to, and I''m sure you don''t either.


    Remember that each rule packet must traverse those time.When you have lots of
    packets going through your packet filter, the little chunks of time add up. Keeping
    this in mind, you should make sure (as much as possible) the rules that will be
    used most often be the first rules in the chain. In addition, the more bytes you
    check in the packet headers the more work you''re going to do. This means that
    again, you want to ensure that each rule checks as few bytes as possible—without
    compromising your security.


    In order to actually work with your chains, you will need to use the switches
    in Table 11.3.


    Table 11.3 iptables Chain Operations

    | Switch | Function |

    | -N | Creates a new rule chain. |

    | -L | Lists the rules in a chain. |

    | -P | Changes the policy for a built-in chain. |

    | -Z | Zeros the byte and packet counters in a chain. |

    | -F | Flushes all the rules from a chain. |

    | -X | Deletes an empty chain (except the built-in chains). |


    In addition to operations on chains, you also need to perform operations on individual
    rules within a chain. Table 11.14 shows some of the major operations on rules
    within a chain and the switches needed to invoke. (Notice that these rules actually
    operate on the chain itself, modifying the content of the chain on a rule-by-rule
    basis.)


    Table 11.14 iptables Rule Operations

    | Switch | Function |

    | -A | Adds this rule to the end of a chain. |

    | -I | Inserts this rule at the specified point in the chain. |

    | -R | Replaces a rule at the specified point in the chain. |

    | -D | Deletes a rule; can be specified by number or by matching content. |


    Using the rule and chains options from Table 11.14, you can start to modify the
    built-in chains or add your own. The additional information you''ll need is in
    the following sections. Let''s start by dissecting one of the rules from our GATE
    chain used in the preceding tests.


    ```

    iptables - GATE -s 192.168.1.20 -j DROP

    ```'
