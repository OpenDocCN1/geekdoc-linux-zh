- img_proc: true
  md: 'DISCUSSION:

    A request/response application that uses UDP should use a source address for the
    response that is the same as the specific destination address of the request.
    See the "General issues" section of [INTRO:1].


    # 4.1.3.6 Invalid Addresses


    A UDP datagram with an invalid IP source address (e.g., a broadcast or multicast
    address) must be discarded by UDP or by the IP layer (see Section 3.2.1.3). When
    a host sends a UDP datagram, the source address MUST be (one of) the IP address(es)
    of the host.


    # 4.1.4 UDP/APPLICATION LAYER INTERFACE


    The application interface to UDP MUST provide the full services of the IP/transport
    interface described in Section 3.4 of this document. Thus, an application using
    UDP needs the functions of the GET_SRADDADDR(), GET_MAXSIZES(), ADVISE_DELIVPROB(),
    and RECV_ICMP() calls described in Section 3.4. For example, GET_MAXSIZES can
    be used to learn the effective maximum UDP datagram size for a particular {interface,remote
    host, (TOS)} triplet. An application-layer program MUST be able to set the TTL
    and TOS values as well as IP options for sending a UDP datagram, and these values
    must be passed transparently to the IP layer. UDP MAY pass the received TOS up
    to the application layer.


