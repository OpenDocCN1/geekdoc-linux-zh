  pgno: 375
- img_proc: true
  md: '+   ▪ resolver SHOULD be configurable with start-up information pointing to
    multiple root name servers and multiple name servers for the local domain. This
    insures that the resolver will be able to access the whole name space in normal
    cases, and will be able to access local domain information should the local network
    become disconnected from the rest of the Internet.


    (B) Stub Resolver—A "stub resolver" relies on the services of a recursive name
    server on the network or "nearby" network. This scheme allows the host to pass
    the burden of the resolver function to a name server on another host. This is
    often essential for less capable hosts, such as PCs, and is also recommended when
    the host is one of several workstations on a local network, because it allows
    all of the workstations to share the cache of the recursive name server and reduce
    the number of domain requests exported by the local net-work. At a minimum, the
    stub resolver MUST be capable of directing its requests to redundant recursive
    name servers. Note recursive name servers are allowed to restrict the scopes of
    requests that will honor, so the host administrator must verify that the service
    will be provided. Stub resolvers IMPLEMENT caching if they choose, but if so,
    MUST timeout cached information.


    # 6.1.3.2 Transport Protocols


    DNS resolvers and recursive servers MUST support UDP, and SHOULD support TCP,
    for sensing (non-zone-transfer) queries. Specifically, a DNS resolver or server
    that is sending a non-zone-transfer query MUST send a UDP query first. If the
    Answer section of the response is truncated and if the requester supports TCP,
    it SHOULD try the query again using TCP.


    DNS servers MUST be able to serve UDP queries and SHOULD be able to serve TCP
    queries. A name server MAY limit the resources it devotes to TCP queries, but
    it SHOULD NOT refuse to service a TCP query just because it would have succeeded
    with UDP.


    Truncated responses MUST NOT be saved (cached) and later used in such a way that
    the fact that they are truncated is lost.


    DISCUSSION:


    UDP is preferred over TCP for queries UDP queries have much lower overhead, in
    packet count and connection state. The use of UDP is essential for heavily-loaded
    servers, especially the root servers. UDP also offers additional robustness, since
    a resolver can attempt several UDP queries to different servers for the cost of
    a single TCP query.


    It is possible for a DNS response to be truncated, although this is a very rare
    occurrence in the present Internet DNS. Practically speaking, truncation cannot
    be predicted, since it is data-dependent. The dependencies include the number
    of RRs in the answer, the size of each RR, and the space saved by the name compression
    algorithm. As a rule of thumb, truncation in NS and MX lists should not occur
    for answers containing 15 or fewer RRs.


