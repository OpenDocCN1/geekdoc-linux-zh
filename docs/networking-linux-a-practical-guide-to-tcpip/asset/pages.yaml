  md: '# About the Author


    Pat Eyler has been working with TCP/IP and UNIX since 1988 and with Linux since
    1993. He has worked as a network analyst, administrator, and engineer for Boeing
    and Ameritech. He has also spent time as a systems administrator for Philips and
    Fidelity. He has taught courses on systems administration and networking for American
    Research Group and the U.S. Army. More recently he has been involved in supporting
    e-commerce and Web development for various ''clicks and mortar'' and ''dot com
    companies.


    Pat has also written material for companies, user groups, and the general public
    on Linux/Unix, shell scripting, and networking. Some of his best work has appeared
    in the Linux Gazette.


    Pat has designed and managed LANs and WANs supporting everything from small/home
    offices to multiple campus networks. His favorite network is at home, where he
    is busily teaching his home-schooled kids to use Linux instead of that OS.


    Pat spends his non-technical time with his family.They enjoy traveling, reading,
    and cooking. He and his family are active members of the Church of Jesus Christ
    of Latter-day Saints.'
