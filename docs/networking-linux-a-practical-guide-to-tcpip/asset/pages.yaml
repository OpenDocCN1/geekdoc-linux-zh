    # MTU


    Each of the link-layer protocols imposes different limits on the packets that
    it carries. Among these restrictions is the maximum size of the packet; this is
    called the maximum transmission unit (MTU). PPP normally uses an MTU of 296, Ethernet
    uses an MTU of 1500, FDDI uses MTU of 4464, and 4Mbps Token Ring uses an MTU of
    4464. Because each link layer can define a different MTU, and because a packet
    might traverse multiple networks route to its final destination, a path MTU is
    defined. In Chapter 3, “Network-Layer Protocols,” we''ll look at IP fragmentation
    (a potential outcome of differing MTUs) and how to avoid it using path MTU discovery.
    An example of path MTU is shown in Figure 2.13.


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_48_0.png)


    Figure 2.13 An internet with various link-layer protocols represented.


    In this example, the path MTU is 296 because the PPP link sitting between the
    Ethernet LAN at one site and the FDDI ring at the other have negotiated a lower
    rate than is normally used.'
