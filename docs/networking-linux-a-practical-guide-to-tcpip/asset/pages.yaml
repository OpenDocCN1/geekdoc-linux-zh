    is now applied more generally. A host with embedded gateway functionality will
    typically fall into the simple multihoming case. Note, however, that a host may
    be simply multihomed without containing an embedded gateway, without for-warding
    datagrams from one connected network to another.


    This case presents the most difficult routing problems. The choice of interface
    (i.e., the choice of first-hop network) may significantly affect performance or
    even reachability of remote paths of the Internet.


    We note another possibility that is NOT multihoming: one logical interface may
    be bound to multiple physical interfaces, in order to increase the reliability
    or throughput between directly connected machines providing alternative physical
    paths between them. For instance, two systems might be connected by multiple point-to-point
    links. We call this "link-layer multiplexing." With link-layer multiplexing, the
    protocols the link layer are unaware that multiple physical interfaces are present;
    the link-layer device driver is responsible for multiplexing and routing packets
    across the physical interfaces.


    In the Internet architecture, a transport protocol instance ("entity") has no
    address of its own, but uses a simple Internet Protocol (IP) address. This has
    implications for the IP, transport, and application layers, and for the interfaces
    between them. In particular, the application software may have to be aware of
    the multiple IP addresses of a multihomed host; in other cases, the choice can
    be made within the net-software.


    # 3.3.4.2 Multihoming Requirements


    The following general rules apply to the selection of an IP source address for
    sending a datagram from a multihomed host.


    +   1. If the datagram is sent in response to a received datagram, the source
    address for the response SHOULD be the specific-destination address of the request.
    Sections 4.1.3.5 and 4.2.3.7 and the "General Issues" section of [INTRO:1] for
    more specific requirements on higher layers. Otherwise, a source address must
    be selected.

    2. An application MUST be to explicitly specify the source address for initiating
    a connection or a request.

    3. In the absence of such a specification, the networking software MUST choose
    a source address. Rules for this are described below.


    There are two requirement issues related to multihoming:


    +   (A)A host MAY silently discard an incoming datagram whose destination address
    does not correspond to the physical interface through which it is received.

    (B)A host MAY restrict itself to sending (non-source-routed) IP datagrams only
    through the physical interface that corresponds to the IP source address of the
    datagrams.'
