    Sara and Bill went to their white board and put together a map of the systems
    involved in the problem (as shown in Figure 6.4).


    ![](img/5b4988f59e82a39b3f220b0f1d3777dd_131_0.png)


    Figure 6.4 Email problem map.


    They decided that the following items could be involved:

    * The SMTP gateway

    * The co-location network and routers

    * The routers at the two office locations

    * The client machines, including Rob’s new machine, which could be the source
    of the problem


    Sara and Bill decided that the problem was most likely on the server because there
    had been multiple MUAs and even two OSes involved on the client side. So that''s
    they started their list of possible causes:


    +   * Misconfigured MTA

    * Server IP problem

    * Subnet mask problem on server

    * Packet-filtering rules on the routers for the two office sites

    * Subnet mask problem on the client


    After a bit of thought, they were able to eliminate IP and subnet problems because
    the client and server could certainly pass IP traffic (including errors from the
    MTA).'
