  md: '# # Step 1: Clearly Describe the Symptoms


    There''s no good way to attack a problem until you know what the problem really
    is. Far too often, system and network administrators hear a rather poor (if not
    outright misleading) description of the problem. It''s your job to dig in and
    find out what''s really going on.


    # ## Ask the Right Questions


    Once, I was working in a network management center, I received a call from a user
    claiming that he had a "network problem." When I asked what was wrong, he responded
    that his PC could not see the network. "Okay, what error messages are you getting?"
    I asked. He responded that when he booted his computer, it displayed the error
    message "Non-system Disk in Drive A:" Obviously, this was not a networking issue.


    I could have jumped into diagnostic testing of the network segment he was on or
    tried pinging his PC. By asking questions first, I could clearly describe the
    symptoms, I was able to save myself a lot of time and trouble. I was also able
    to get the caller back to work much more quickly.


    As you can probably guess, you''ll need some interviewing skills to get a clear
    description of the symptoms from a user. People don''t want to hide the truth
    from you, but they often have predetermined the problem, coloring their perception
    of the issues involved.


    It''s a good idea to take notes as you''re talking with someone, periodically
    summarizing the problem as you go. This can help you follow-up-questions to ask
    the user. It is certainly better to get also help jog a user''s memory for other
    tidbits.


    Never hesitate to call or email the user back with further questions to clarify
    the situation. It is certainly better to get all the answers you need up-front,
    but the reality is that you might not know all the questions you need to ask until
    you''ve gotten your hands dirty working on the problem. If you need more detail,
    go get it.


    Holding your inventory at the customer''s location also gives you a chance to
    say "Show me." This enables you to see what the user is doing and perhaps to identify
    some key points about the problem. It will also reveal the problem as one of those
    things that just won''t show up when you''re there to see it. If you run into
    a problem that you can''t reproduce, you have yet another problem on your hands—what
    to do about it. The best thing is to set up a monitoring plan with the user. Get
    all the details that you can, tell the user to call you back when the problem
    occurs. Leave the user with a list of questions to answer when calling you back.
    On your end, you should maintain a log so that you can track details about the
    problem.'
  merge: -1
