    # 12.7.2. Useful Websites


    +   - http://www.isc.org/products/BIND — The home page of the BIND project containing
    information about current releases as well as a PDF version of the BIND 9 Administrator
    Reference Manual.


    +   - http://www.redhat.com/mirrors/LDP/HOWTO/DNS-HOWTO.html — Covers the use
