- pgno: 66
  md: '# Chapter 5. The proc File System


    > > Warning

    > Do not view the /proc/kcore virtual file. The contents of the file will scramble
    text output on the terminal. If this file is accidentally viewed, press [Ctrl]-[C]
    to stop the process then type reset to bring back the command line prompt.


    # 5.2.14. /proc/kmsg


    This file is used to hold messages generated by the kernel. These messages are
    then picked up by other programs, such as /sbin/klogd.


    # 5.2.15. /proc/ksym


    This file contains the symbol definitions used by the module tools to dynamically
    link and bind kernel modules.


    ```

    e003def4 speedo_debug [eepro100]

    e003b04c eepro100_init [eepro100]

    e0039c0c st_template [st]

    e002104c RDINDOOR [megaraid]

    e002104a callDone [megaraid]

    e00226cc megaraid_detect [megaraid]

    ```


    The first column lists the memory address for the kernel function, the second
    column refers to the name of the function, and the last column reveals the name
    of the loaded module.


    # 5.2.16. /proc/loadavg


    This file provides a load average on the processor over time, as well as additional
    data used by uptime and other commands. A sample /proc/loadavg file looks similar
    to this:


    ```

    0.20 0.18 0.12 1/80 11206

    ```


    The first columns measure CPU utilization of the last 1, 5, and 10 minute periods.
    The fourth column shows the number of currently running processes and the total
    number of processes. The last column displays the last process ID used.


    # 5.2.17. /proc/locks


    This file displays the files locked by the kernel. The contents of this file contain
    kernel debugging data and can vary tremendously, depending on the use of the system.
    A sample /proc/locks for a lightly locked system looks similar to:


    ```

    1: FLOCK ADVISORY WRITE 807 03:05:303871 0 EOFAF c2a2c0c0 c025aa48 c2a26120

    2: POSIX ADVISORY WRITE 708 03:05:308720 0 EOF c2a2611c c2a2c0c4 c025aa48

    ```


    Each lock has one line which starts with a unique number. The second column refers
    to the class of lock used, with flock representing the older-style UNIX locks
    from a lock system and POSIX representing the newer POSIX locks from the lockf
    system.

    The third column can have two values: ADVISORY or MANDATORY. ADVISORY means that
    the lock does not prevent other people from accessing the data; it only prevents
    others to lock it. MANDATORY'
