- pgno: 182
  md: '# Chapter 12.

    Berkeley Internet Name Domain (BIND)


    On most modern networks, including the Internet, users locate other computers
    by name. This frees users from the daunting task of remembering the numerical
    network address of network resources. The most effective way to configure a network
    to allow such name-based connections is to set up a Domain Name Service (DNS)
    or nameservers, which resolves hostnames on the network to addresses and vice
    versa.


    This chapter reviews the nameserver included in Red Hat Linux, Berkeley Internet
    Name Domain (BIND) DNS server, with an emphasis on the structure of its configuration
    and how it may be administered both locally or remotely.


    For instructions on configuring BIND using the graphical Bind Configuration Tool
    (redhat-config-bind), refer to the chapter BIND Configuration in the Red Hat Linux
    Customization Guide.


    > WarningnIf you use the BIND Configuration Tool, do not manually edit any BIND
    configuration files as changes will be overwritten the next time you use the BIND
    Configuration Tool.


    # 12.1. Introduction to DNS


    When hosts on a network connect to one another via a hostname, also called a fully
    qualified domain name (FQDN), DNS is used to associate the names of machines to
    the IP address for the host.


    Use of DNS and FQDNs has advantages for system administrators, allowing the flexibility
    to change the IP address of a host without affecting name-based queries to the
    machine. Conversely, administrators can shuffle which machines handle a name-based
    query.


    DNS is normally implemented using centralized servers that are authoritative for
    some domains and other DNS servers for other domains.


    When a client requests information from a nameserver, it usually connects to port
    53. The nameserver then attempts to resolve the FQDN based on its resolver library,
    which may contain information about the requested or cached data from an earlier
    query. If the nameserver does not have the answer in its local resolver, it queries
    other nameservers, including root nameservers, to determine which authoritative
    nameservers are authoritative for the FQDN in question. With information, the
    authoritative nameservers determine the IP address of the requested host. If performing
    a recursive lookup, the same procedure is used, except the query is made with
    an unknown IP address rather than a name.


    # 12.1.1. Nameserver Zones


    On the Internet, the FQDN of a host can be broken down into different sections.
    These sections are organized into a hierarchy like a tree, with a main trunk,
    primary branches, secondary branches, and so forth. Consider the following FQDN:


    ```

    bob.sales.example.com

    ```


    When looking at how a FQDN is resolved to find the IP address that relates to
    a particular system, read the name from right to left, with each level of the
    hierarchy divided by periods (.). In this example,'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'com defines the top level domain for FQDN. The name example is a sub-domain
    under com, while sales is a sub-domain under example. The name farthest to the
    left, bot, identifies a specific machine.


    Except for the hostname, each section is called a zone, which defines a specific
    namespace. A namespace controls the mapping of the sub-domains to its left. While
    this example contains two sub-domains, a FQDN must contain at least one sub-domain
    but may include many, depending upon how the namespace is organized.


    Zones are defined as authoritative nameservers through zone files, which describe
    the namespace of that zone, the mail servers are for a particular domain or sub-domain,
    and more. Zones are stored on primary nameservers (also called master nameservers),
    which are truly authoritative and where changes are made to the files, and secondary
    nameservers (also called slave nameservers), which receive their zone files from
    the primary nameservers. Any nameserver can be a primary and secondary nameserver
    for different zones at the same time, and they may also be considered authoritative
    for multiple zones. It depends on how the nameserver is configured.


    #  12.1.2. Nameserver Types


    There are primary nameserver configuration types:


    +   master - Stores authoritative zone records for a certain namespace, answering
    questions from other nameservers searching for answers concerning that namespace.


    +   slave - Queries answers from other nameservers concerning namespaces for which
    it is not authoritative. However, slave nameservers get their names information
    from master nameservers.


    +   caching-only — Offers name to IP resolution services but is not authoritative
    for any zones. Answers for all resolutions are cached in memory for a fixed period
    of time, which is specified by the retrieved zone.


    +   forwarding — Forwards requests to a specific list of nameservers for name
    resolution. If none of the specified nameservers can perform the resolution, the
    resolution fails.


    A nameserver may be one or more of these types. For example, a nameserver can
    be a master for some zones, a slave for others, and only offering resolutions
    for others.


    #  12.1.3. BIND as a Nameserver


    BIND performs name resolution services through the /usr/sbin/named daemon. BIND
    also includes an administration utility called /usr/sbin/rndc. More information
    about rndc can be found in Section 12.4 Using rndc.


    BIND stores configuration files in the following places:


    +   /etc/named.conf — The configuration file for the named daemon.


    +   /var/named/ directory — The named working directory which stores zone, statistic,
    and cache files.


    The next few sections review the BIND configuration files in more detail.'
  merge: -1
  img_proc: true
- pgno: 184
  md: "# Chapter 12. Berkeley Internet Name Domain (BIND)\n\n# 12.2. /etc/named.conf\n\
    \nnamed.conf is a collection of statements using nested options surrounded by\
    \ opening and closing characters, { }. Administrators must be careful when editing\
    \ named.conf to avoid syntactical errors as seemingly minor errors will prevent\
    \ the named service from starting.\n\nWarning Do not manually edit the /etc/named.conf\
    \ file or any files in the /var/named/ directory if you are using the Bind Configuration\
    \ Tool. Any manual changes to those files will be overwritten the next time the\
    \ Bind Configuration Tool is used.\n\nA typical named.conf file is organized similar\
    \ to the following example:\n\n```\n<statement-1> [<statement-1-name>] [<statement-1-class>]\
    \ {\n  <option-1>\n  <option-2>\n  <option-N>\n}\n\n<statement-2> [<statement-2-name>]\
    \ [<statement-2-class>] {\n  <option-1>\n  <option-2>\n  <option-N>\n}\n\n<statement-N>\
    \ [<statement-N-name>] [<statement-N-class>] {\n  <option-1>\n  <option-2>\n \
    \ <option-N>\n}\n```\n\n# 12.2.1. Common Statement Types\n\nThe types of statements\
    \ are commonly used in /etc/named.conf.\n\n# 12.2.1.1. acl Statement\n\nThe acl\
    \ statement (or access control statement) defines groups of hosts which can then\
    \ be permitted or denied access to the nameserver.\n\nAn acl statement takes the\
    \ following format:\n\n```\nacl <acl-name> {\n  <match-element>\n  <match-element>;\
    \ ...\n}\n```\n\nIn this replacement, replace <acl-name> with the name of the\
    \ access control list and replace <match-element> with a semi-colon separated\
    \ list of IP addresses. Most of the time, an individual IP address or IP network\
    \ (such as 10.0.1.0/24) is used to identify the IP addresses within the acl statement.\n\
    \nThe following access control lists are already defined as keywords to simplify\
    \ configuration:\n\n+   * any Matches every IP address.\n* localhost Matches any\
    \ IP address in the local system."
  merge: -1
  img_proc: true
- pgno: 185
  md: "# Chapter 12. Berkeley Internet Name Domain (BIND)\n\n+   - localnets — Matches\
    \ any IP address on any network to which the local system is connected.\n- none\
    \ — Matches no IP addresses.\n\nWhen used in conjunction with other statements\
    \ (such as the options statement), acl statements can be very useful in preventing\
    \ the misuse of a BIND nameserver.\n\nThe following example defines two control\
    \ lists and uses an options statement to define how they are treated by the nameserver:\n\
    \n```\nacl black-hats {\n  10.0.2/24;\n  192.168.0.0/24;\n}\n\nacl red-hats {\n\
    \  10.0.1.0/24;\n}\n\noptions {\n  blackhole { black-hats };\n  allow-query {\
    \ red-hats };\n  allow-recursion { red-hats };\n}\n```\n\nThis example defines\
    \ access control lists, black-hats and red-hats. Hosts in the black-hats list\
    \ are denied access to the nameserver, while hosts in the red-hats list are given\
    \ normal access.\n\n# 12.2.1. include Statement\n\nThe include statement allows\
    \ files to be included in a named.conf. This sensitive configuration data (such\
    \ as keys) can be placed in a separate file with restrictive permissions.\n\n\
    An include statement takes the following form:\n\n```\ninclude \"<file-name>\"\
    \n```\n\nIn this statement, <file-name> is replaced with an absolute path to a\
    \ file.\n\n# 12.2.1.3. options Statement\n\nThe options statement defines global\
    \ configuration options and sets defaults for other states. It can be used to\
    \ specify the location of the named working directory, the types of queries allowed,\
    \ and much more.\n\nThe options statement takes the following form:\n\n```\noptions\
    \ {\n  <option>;\n  [<option>; ...]\\}\n```\n\nIn this statement, the <option>\
    \ directives are replaced with a valid option.\n\nThe following are commonly used\
    \ options:"
  merge: -1
  img_proc: true
- pgno: 186
  md: "# Chapter 12. Berkeley Internet Name Domain (BIND)\n\n+   - allow-query — Specifies\
    \ hosts are allowed to query this nameserver. By default, all hosts are allowed\
    \ to query. An access control list, or collection of IP addresses or networks\
    \ may be used here to only allow particular hosts to query the nameserver.\n\n\
    +   - allow-recursion — Similar to allow-query, this option applies to recursive\
    \ queries. By default, all hosts are allowed to perform recursive queries on the\
    \ nameserver.\n\n+   - blackhole — Specifies hosts are not allowed to query the\
    \ server.\n\n+   - directory — Changes the named directory to something else than\
    \ the default value /var/named/.\n\n+   - forward — Controls forwarding behavior\
    \ of a forwarders directive.\n\nThe following options are accepted:\n\n+   - first\
    \ — Specifies that the nameservers specified in the forwarders directive be queried\
    \ before named attempts to resolve the name itself.\n\n+   - only — Specifies\
    \ that named not attempt name resolution itself in the query queries to nameservers\
    \ specified in the forwarders directive fail.\n\n+   - forwarders — Specifies\
    \ a list of valid IP addresses for nameservers where requests should be forwarded\
    \ for resolution.\n\n+   - listen-on — Specifies the network interface on which\
    \ named listens for queries. By default, all interfaces are used.\n\nIn this way,\
    \ if the DNS server is also a gateway, BIND can be configured to only answer queries\
    \ that originate from one of the networks.\n\nA listen-on directive might look\
    \ like this:\n\n```\noptions {\n  listen-on ( 10.0.0.1 );\n}\n```\n\nIn this way,\
    \ only requests that arrive from the network interface serving the private network\
    \ (10.0.0.1) will be accepted.\n\n+   - notify — Controls whether named notifies\
    \ the slave servers when a zone is updated. It accepts the following options:\n\
    \n+   - yes — Does not notify slave servers.\n\n+   - no — Only notifies slave\
    \ servers specified in an also-notify list within a zone statement.\n\n+   - pid-file\
    \ — Specifies the location of the process ID file created by named.\n\n+   - statistics-file\
    \ — Specifies an alternate location for statistics files. By default, named statistics\
    \ are saved to the /var/named/named.stats file.\n\nDozens of other options are\
    \ also available, many of which rely upon one another to work properly. See the\
    \ BIND 9 Administrator Reference Manual in Section 12.7.1 Installed Documentation\
    \ and the man page for bind.conf for more details."
  merge: -1
  img_proc: true
- pgno: 187
  md: "# 12.2.1.4. zone Statement\n\nA zone statement defines the characteristics\
    \ of a zone such as the location of its configuration file and zone-specific options.\
    \ This statement can be used to override the global options statements.\n\nA zone\
    \ statement takes the following format:\n\n```\nzone <zone-name> <zone-class>\
    \ {\n  <zone-options>;\n  [zone-options>; ...]\n}\n```\n\nIn this statement, <zone-name>\
    \ is the name of the zone, <zone-class> is the optimal class of the zone, and\
    \ <zone-options> is a list of options characterizing the zone.\n\nThe <zone-name>\
    \ attribute for the zone statement is particularly important, as it is the default\
    \ value assigned for the ORIGIN directive used within the corresponding zone file\
    \ located in /var/named/. The named daemon appends the zone name to any non-fully\
    \ qualified domain name.\n\nFor example, if a zone statement defines the namespace\
    \ for example.com, use example.com as the <zone-name> so it is placed at the edge\
    \ of hostnames within the example.com file.\n\nFor more information about zone\
    \ files, see Section 13 Zone Files.\n\nThe most common zone statement options\
    \ include the following:\n\n+   - allow-query — Specifies the clients that are\
    \ allowed to request information about this zone. The default is to allow all\
    \ queries.\n- allow-transfer — Specifies the slave servers that are allowed to\
    \ request a transfer of the zone's information. The default is to allow all transfers.\n\
    - allow-update — Specifies the hosts that are allowed to dynamically update information\
    \ in their zone. The default is to deny all dynamic update requests.\nCare when\
    \ allowing hosts to update information about their zone. Do not enable this option\
    \ unless it is completely trusted. In general, it is better to have an administrator\
    \ manage the records for a zone and reload the named service.\n- file — Specifies\
    \ the name of the file in the named working directory that contains the zone's\
    \ configuration data.\n- masters — The masters option lists the addresses from\
    \ which authoritative zone lists information. Used only if the zone is defined\
    \ as type slave.\n- notify — Controls whether named notifies the slave servers\
    \ when a zone is updated. It accepts the following:\n  - yes — Notifies slave\
    \ servers.\n  - no — Does not notify servers.\n  - explicit — Only notify servers\
    \ specified in an also-notify list within a zone statement.\n\n+   - type — Defines\
    \ the type of zone.\nBelow is a list of valid options:\n  - forward — Forwards\
    \ all requests for information about this zone to other nameservers.\n- hint —\
    \ A special type of zone used to point to the root nameservers that resolve queries\
    \ when a zone is not otherwise known. No configuration beyond the default is necessary\
    \ with the hint zone."
  merge: -1
  img_proc: true
- pgno: 188
  md: "# Chapter 12. Berkeley Internet Name Domain (BIND)\n\n+   - master — Designates\
    \ the nameserver as authoritative for this zone. A zone should be set as the master\
    \ if the zone's configuration files reside on the system.\n\n+   - slave — Designates\
    \ the nameserver as a slave server for this zone. Also specifies the IP address\
    \ of the master nameserver for the zone.\n\n+   - zone-statistics — Configures\
    \ named to keep statistics concerning this zone, writing them to the default location\
    \ (/var/named/named.stats) or the file listed the statistics-file option in the\
    \ server statement. See Section 22.2.2 Other Statement Types for more information\
    \ about the server statement.\n\n# 12.2.1. Sample zone Statements\n\nMost changes\
    \ to the /etc/named.conf file of a master or slave nameserver involves adding,\
    \ deleting zone statements. These zone statements can contain many options, most\
    \ nameservers require only a small subset to function efficiently. The following\
    \ zone statements are very basic examples illustrating a master-slave nameserver\
    \ relationship.\n\nThe following is an example of a zone statement for the primary\
    \ nameserver example.com (192.168.0.1);\n\n```\nzone \"example.com\" IN {\n  \
    \  type master;\n    file \"example.com.zone\";n    allow-update ( none );\n}\n\
    ```\n\nIn the statement, the zone is identified as example.com, the type is set\
    \ to master, and the named service is instructed to read the /var/named/example.com.zone\
    \ file. It also named not to allow by any other hosts to update.\n\nA slave zone\
    \ statement for example.com looks slightly different from the previous example.\
    \ For a slave server, the type is set to slave and in place of the allow-update\
    \ line is a directive telling the IP address of the master server.\n\nA slave\
    \ zone statement for example.com may look like this:\n\n```\nzone \"example.com\"\
    \ {\n    type slave;\n    file \"example.com.zone\";n    masters ( 192.168.0.1\
    \ );\n}\n```\n\nThis statement configures named on the slave server to look for\
    \ the master server at the 192.168.0.1 IP address for the example.com zone. The\
    \ information slave server receives from the master server is saved to the /var/named/example.com.zone\
    \ file.\n\n# 12.2.2. Other Statement Types\n\nThe following is a list of used\
    \ statement types available within named.conf\n\n+   - controls — Configures various\
    \ security requirements necessary to use the rndc command to administer the named\
    \ service.\n\nSee Section 12.4.1 Configuring /etc/named.conf to see how the controls\
    \ statement look, including various options that may only be used with it."
  merge: -1
  img_proc: true
- pgno: 189
  md: '+   - key "<key-name>" — Defines a key name. Keys are used to authenticate
    various accounts, such as secure updates or the use of the rndmc command. Two
    options are used with key:


    +   - algorithm <algorithm-name> — The type of algorithm used, such as dsa or
    hmac-md5.


    +   - secret "<key-value>" — The encrypted key.


    See 12.4.2 Configuring /etc/rndc.conf for instruction on how to write a key statement.
    Logging — occurs for the use of multiple types of logs, called channels. By using
    the channel option within the logging statement, with its own name (file), size
    limit (size), version (version), and level of importance (severity), can be customized.
    Once a customized channel has been defined, a category option is used to configure
    the channel and begin when named is restarted.


    By default, named logs standard for the syslog daemon, which places them in /var/log/messages.
    This occurs because several channels are built into BIND with various severity
    levels, such as one that handles informational logging (default_syslog). A default
    category, default uses the built-in channels to do normal logging without any
    specification.


    Customizing the logging process is a very detailed process and is beyond the scope
    of this chapter. For information on custom BIND logs, see the BIND 9 Administrator
    Reference Manual in Section 12.7.1 Installation Details.


    +   - server — Defines options particular how named acts to route remote namesvers,
    especially regarding notifications and zone transfers.


    The transfer-format option controls how one resource record is sent with each
    message (one-answer) or multiple resource records are sent with each message (many-answers).
    While many-answers is more efficient, only fewer BIND namesvers understand it.


    +   - trusted-keys — Contains assorted public keys used for secure DNS (DNSSEC).
    See Section 12.5.3 for more information connecting BIND security.


    +   - view "<view-name>" — Creates special views depending upon the hosting host
    to the nameserver. This allows hosts to receive one answer regarding a particular
    zone while other hosts receive totally different information. Alternatively, certain
    zones may only be available to particular trusted hosts while non-trusted hosts
    can only make queries for others.


    Multiple views may be used, so long as their names are unique. The match-clients
    option specifies the IP addresses that apply to a particular view. Any options
    statement may also be used within a view, overriding the global options configured
    for named. Most views contain multiple zone statements that apply to the match-clients
    list. The order in which view statements are listed is important, as the first
    view that matches a particular client''s IP is used.


    See 12.5.2 Multiple Views for more information about the view statement.


    # 12.2.3. Comment Tags


    The following is a list of valid comment used when named.conf:


    +   - // When placed at the beginning of a line, that line is ignored by named


    +   - # When placed at the beginning of a line, that line is ignored by named.


    +   - * / - When text is enclosed in this, the block of text is ignored by named.'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'Chapter 12. Berkeley Internet Name Domain (BIND)


    # 12.3. Zone Files


    Zone files contain information about a particular namespace and are stored in
    the named working directory, `/var/named/` by default. Each zone file is named
    according to the file option in the zone statement, usually in a way that relates
    to the domain and identifies the file as containing data, such as example.com.zone.


    Each zone file may contain directives and resource records. Directives tell the
    nameserver to perform tasks or apply special settings to the zone. Resource records
    define the parameters of the zone and assignments to individual hosts. Optional,
    but resource records are required to provide nameservice to a zone.


    All directives and resource records should go on their own individual lines.

    Comments can be placed after semicolon characters (;) in zone files.


    # 12.3.1. Zone File Directives


    Directives begin with the dollar sign ($) followed by the name of the directive.
    They usually appear at the top of the zone file.

    The following are commonly used directives:


    +   * $INCLUDE Configures named to include another zone in this zone file at the
    place where the directive appears. This allows additional zone settings to be
    stored apart from the main zone file.

    * $ORIGIN Appends the name to resource records, such as with the hostname and
    nothing more.


    For example, a zone file may contain the following line:

    $ORIGIN example.com

    Any names in resource records that do not end in a trailing period (.) will have
    example. appended to them.


    Note

    The use of the $ORIGIN directive is unnecessary if the zone is specified in /etc/named.conf
    because the zone name is used as the value for the $ORIGIN directive by default.


    +   * $TTL Sets the Time to Live (TTL) value for the zone. This is the length
    of time, in seconds, a resource record is valid. Each resource record can contain
    its own TTL value, which overrides this directive.


    Increasing this value allows nameservers to cache the zone information for a longer
    period of time, reducing the number of queries for the zone and lengthening the
    amount of time to proliferate resource record changes.


    # 12.3.2. Zone Resource Records


    The primary component of a zone file is its resource records.

    There are many types of zone resource records. The following are used most frequently:


    +   * A Address record, which specifies an IP address to assign to a name, as
    in this example:

    <host> IN A <IP-address>

    If the <host> is omitted, then an A record points to a default IP address for
    the top of the namespace. This system is the target for all non-FQDN requests.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# 176


    # Chapter 2. Berkeley Internet Name Domain (BIND)


    Consider the following A record examples for the example.com zone:


    ```

    IN A 10.0.1.3

    server1 IN A 10.0.1.5

    ```


    Requests for example.com are pointed to 10.0.1.3, while requests for server1.example.com
    are pointed to 10.0.1.5.


    +   - CNAME — Canonical name record, maps one name to another. This type of record
    is also known as an alias record.


    The next example tells that any requests sent to the <alias-name> will point to
    the host, <real-name>. CNAME records are most commonly used to point to services
    that use a common naming scheme, such as www for Web servers.


    ```

    <alias-name> IN CNAME <real-name>

    ```


    In the following example, an A record binds to an IP address, while a CNAME record
    commonly used hostname to it.


    ```

    server1 IN A 10.0.1.5

    www IN CNAME server1

    ```


    +   - MX — Exchange record, which where numerical ranking is sent to a mail server
    controlled by this zone go.


    ```

    IN MX <preference-value> <email-server-name>

    ```


    In this example, the <preference-value> allows numerical ranking of the mail servers
    for a namespace, giving preference to some email systems over others. The MX record
    with the lowest <preference-value> is preferred over the others. However, multiple
    servers can share the same value to distribute mail traffic among them.


    The <email-server-name> may be a hostname or FQDN.


    ```

    IN MX 10 mail.example.com.

    IN MX 20 mail2.example.com.

    ```


    In this first example, mail.example.com email server is preferred to mail2.example.com
    when receiving email for the example.com domain.


    +   - NS — NameServer record, which announces the authoritative nameserver for
    a particular zone.


    This is an example of an NS record:


    ```

    IN NS <nameserver-name>

    ```


    The <nameserver-name> should be a FQDN.


    Next, two nameservers are listed as authoritative for the domain. It is not important
    whether the nameservers are slaves or if one is a master; both are still considered
    authoritative.


    ```

    IN NS dns1.example.com.

    IN NS dns2.example.com.

    ```


    +   - PTR — PointTeR record, designed to point to another part of the name.


    PTR records are used reverse for name resolution, as they point IP addresses to
    a particular name. See Section 12.3.4 Reverse Name Resolution Zone Files for more
    examples of PTR records in use.


    +   - SOA — Start Of Authority record, proclaims authoritative information about
    a namespace to the nameserver.


    Located after the directives, an SOA resource record is the first record in a
    zone file.


    The following example shows the basic structure of an SOA record:


    ```

    @ IN SOA <primary-nameserver> <hostmaster-email>

    <serial-number>

    <time-to-refresh>

    <time-to-retry>

    <time-to-expire>

    <minimum-TTL>

    ```'
  merge: -1
  img_proc: true
- pgno: 192
  md: "# Chapter 12. Berkeley Internet Name Domain (BIND)\n\nThe # symbol replaces\
    \ the ORIGIN directive (or the zone's name, if the ORIGIN directive is not set)\
    \ as the name defined by the SOA resource record. The primary nameserver is authoritative\
    \ for this domain used for the <primary-name-server>, and the email of the person\
    \ to contact this name is substituted for the <hostmaster-email>.\n\nThe <serial-number>\
    \ is incremented every time the zone file so changed is named  named which it\
    \ will know that it needs to reload this zone. The <time-to-refresh> tells all\
    \ servers to wait before asking the master nameserver if any changes have been\
    \ made to the zone. The <serial-number> value is used by the slave to determine\
    \ if it is using outdated zone data and should refresh.\n\nThe <time-to-retry>\
    \ tells the slave the interval to wait before issuing another refresh request,\
    \ if the master nameserver is not answering. If the master has not replied a refresh\
    \ request before the <time-to-expire> lapses, the slave stops responding as an\
    \ authority for requests concerning that name.\n\nThe <minimum-TTL> requests that\
    \ other nameser cache the zone's information for at least this amount of time\
    \ (in seconds).\n\nWith BIND, all time refers to seconds. However, it is possible\
    \ to use abbreviations units of time other than seconds, such as minutes (M),\
    \ hours (H), days (D), and weeks (W). The Table 12-1 shows an amount of time in\
    \ seconds and the equivalent unit in another format.\n\n| Seconds | Other Time\
    \ Units |\n| 60 | 1M |\n| 1800 | 30M |\n| 3600 | 1H |\n| 10800 | 3H |\n| 21600\
    \ | 6H |\n| 43200 | 12H |\n| 86400 | 1D |\n| 259200 | 3D |\n| 604800 | 1W |\n\
    | 31536000 | 365D |\n\nTable 12-1. example illustrates the form an SOA resource\
    \ record might take when it is configured with real values.\n\n```\nns1.example.com.\
    \ hostmaster.example.com. (\nIN SOA 2001062501 ; serial\n      21600 ; refresh\
    \ after 6 hours\n      retry after 1 hour\n      604800 ; expire after 1 week\n\
    \      86400 ; minimum TTL of 1 day\n)\n```\n\n# 12.3.3. Example Zone File\n\n\
    Seen individually, directives and resource records can be difficult to grasp.\
    \ However, when placed together in a single file, they become easier to understand.\n\
    \nThe following example shows a very basic zone file."
  merge: -1
  img_proc: true
- pgno: 193
  md: "# Chapter 12. Berkeley Internet Name Domain (BIND)\n\n```\n$ORIGIN example.com\n\
    $TTL 86400\n@ IN SOA dns1.example.com. hostmaster.example.com. (\n    2001062501\
    \ ; serial ; refresh after 6 hours\n    21600 ; retry after 1 hour\n    3600\n\
    \    604800 ; expire after 1 week\n    86400 ) ; minimum TTL of 1 day\n\nIN NS\
    \ dns1.example.com.\nIN NS dns2.example.com.\n\nIN MX 10 mail.example.com.\nIN\
    \ MX 20 mail2.example.com.\n\nIN A 10.0.1.5\nserver1 IN A 10.0.1.5\nserver2 IN\
    \ A 10.0.1.7\ndns1 IN A 10.0.1.2\ndns2 IN A 10.0.1.3\n\nftp IN CNAME server1\n\
    mail IN CNAME server1\nmail2 IN CNAME server2\nwww IN CNAME server2\n```\n\nIn\
    \ this example, standard directives and SOA values are used for dns1.example.com\
    \ and dns2.example.com, which have records that point to 10.0.1.2 and 10.0.1.3.\n\
    \nThe email servers configured with the MX records point to server1 and server2\
    \ via CNAME records. Since the server1 and server2 names do not end in a trailing\
    \ period (.), the $ORIGIN domain is placed after them, forming server1.example.com\
    \ and server2.example.com. Through the related A resource records, their IP addresses\
    \ can be determined.\n\nFTP and Web services, at the standard ftp.example.com\
    \ and www.example.com names, are pointed to the appropriate servers using CNAME\
    \ names.\n\n# 12.3.4 Reverse Name Resolution Zone Files\n\nA reverse name zone\
    \ file is used to translate an IP address in a particular namespace into a FQDN.\
    \ It works similarly to a standard zone file, except that PTR records are used\
    \ to link the IP addresses to a fully qualified name.\n\nA PTR record looks like\
    \ this:\n\n```\n<last-IP-digit> IN PTR <FQDN-of-system>\n```\n\nThe <last-IP-digit>\
    \ relates to the name in an IP address that should point to a particular system's\
    \ FQDN.\n\nIn this example, IP addresses 10.0.1.20 through 10.0.1.25 are pointed\
    \ to corresponding FQDNs.\n\n```\n$ORIGIN 10.0.1.in-addr.arpa\n$TTL 86400\n@ IN\
    \ SOA dns1.example.com. hostmaster.example.com. (\n    2001062501 ; serial ; refresh\
    \ after 6 hours\n    21600\n    3600 ; retry after 1 hour\n```"
  merge: -1
  img_proc: true
- pgno: 194
  md: "# Chapter 12. Berkeley Internet Name Domain (BIND)\n\n```\n604800 ; expire\
    \ 1 week\n86400 ; minimum TTL of 1 day\n```\n\n```\nIN NS dns1.example.com.\n\
    IN NS dns2.example.com.\n```\n\n```\n20 IN PTR alice.example.com.\n21 IN PTR betty.example.com.\n\
    22 IN PTR charlie.example.com.\n23 IN PTR doug.example.com.\n24 IN PTR ernest.example.com.\n\
    25 IN PTR fanny.example.com.\n```\n\nThis zone will be called with a zone statement\
    \ in the named.conf file which looks similar to the following:\n\n```\nzone \"\
    0.10.in-addr.arpa\" IN (\n  type master;\n  file \"example.com.rr\"\n  allow-update\
    \ ( none );\n)\n```\n\nThere is very little difference between this example and\
    \ a standard zone statement, except for the zone name. Note that a reverse name\
    \ resolution requires the first three blocks of the IP address reversed by in-addr.arpa.\
    \ This allows the single block of IP numbers used in the reverse name resolution\
    \ zone file to be associated with the zone.\n\n# 12.4. Using rndc\n\nBIND includes\
    \ a utility rndc which allows line administration of the named daemon from the\
    \ localhost or from a remote host.\n\nIn order to prevent unauthorized access\
    \ to the named daemon, BIND uses a secret key method used to grant privileges\
    \ to hosts. This means an identical key must be present in both /etc/named.conf\
    \ and the rndc configuration file, /etc/named.conf\n\n# 12.4.1. Configuring /etc/named.conf\n\
    \nIn order for rndc to connect to a named service, there must be a controls statement\
    \ in the BIND server's /etc/named.conf.\n\nThe controls statement shown below\
    \ in the following example allows rndc to connect from the localhost.\n\n```\n\
    controls {\n  inet 127.0.0.1 allow { localhost; }; keys <key-name>;\n}\n```\n\n\
    This statement tells named to listen on the default TCP port 953 of the loopback\
    \ address and allow rndc commands from the localhost, if the proper key is given.\
    \ The <key-name> relates to the key statement, which is also in the /etc/named.conf\
    \ file. The next example illustrates a sample key statement.\n\n```\nkey <key-name>\
    \ {\n  algorithm hmac-md5;\n  secret \"<key-value>\";n}\n```"
  merge: -1
  img_proc: true
- pgno: 195
  md: "# Chapter 12. Berkeley Internet Name Domain (BIND)\n\nIn this case, the <key-value>\
    \ is a HMAC-MD5 key. Use the following command to generate HMAC-MD5 keys:\n\n\
    A key with at least a 256-bit length is a good idea. The actual key that should\
    \ be placed in the <key-value> area can be found in the <key-file-name>.\n\nCaution\n\
    \nBecause /etc/named.conf is world-readable, it is a good idea to place the key\
    \ statement in a separate file readable only by root and then use an include statement\
    \ to reference it, as in the following example:\n\n```\ninclude \"/etc/rndc.conf\"\
    ;\n```\n\n# 12.4.2. Configuring /etc/rndc.conf\n\nThe key is the most important\
    \ statement in /etc/rndc.conf.\n\n```\nkey \"<key-name>\" {\n    algorithm hmac-md5;\n\
    \    secret \"<key-value>\";\n}\n```\n\nThe <key-name> and <key-value> should\
    \ be exactly the same as their settings in /etc/named.conf.\n\nTo match the keys\
    \ specified in the target server's /etc/named.conf, add the following lines to\
    \ /etc/rndc.conf.\n\n```\noptions {\n    default-server localhost;\n    default-key\
    \ \"<key-name>\";\n}\n```\n\nThis command sets a global default key. However the\
    \ rndc command can also use different keys for different servers, in the following\
    \ example:\n\n```\nserver localhost {\n    key \"<key-name>\";\n}\n```\n\nCaution\n\
    \nMake sure that only the root user can read or write to the /etc/rndc.conf file."
  merge: -1
  img_proc: true
- pgno: 196
  md: '# Chapter 12. Berkeley Internet Name Domain (BIND)


    # 12.4.3. Command Line Options


    An rndc command takes the following form:


    ```

    rndc <options> <command> <command-options>

    ```


    When executing rndc on a properly configured localhost, the following commands
    are available:


    +   - halt — Stops the named immediately.

    - querylog — Logs all queries to this nameserver.

    - refresh — Refreshes the nameserver database.

    - reload — Reloads the zone files but keeps all previously cached responses. This
    command also allows changes to zone files without losing stored names.

    - stats — Dumps the named statistics to /var/named/named.stats file.

    - stop — Stops the server, saving any dynamic update and Incremental Zone Transfers
    (IXFR) before exiting.


    Occasionally, it may be necessary to override the default settings in the /etc/rndc.conf
    file. The following options are available:


    +   - -c <configuration-file> — Tells rndc to use a configuration file other than
    the default /etc/rndc.conf.

    - -p <port-number> — Specifies a port number to use for the rndc connection other
    than 953, the default.

    - -s <server> — Tells rndc to send the command to a server other than the default-server
    specified in its configuration.

    - -y <key-name> — Specifies a key other than the default-key in the /etc/rndc.conf
    file.


    Additional information about these options can be found in the rndc man page.


    # 12.5. Advanced Features of BIND


    Most BIND implementations only use named to provide name resolution services or
    to act as an authority for a domain or sub-. However, BIND version 9 has a number
    of advanced features that allow for a more secure and efficient DNS service.


    > Caution

    Some of these advanced features, such as DNSSEC, TSIG, and IXFR, should only be
    used in network environments with nameservers that support the features. If your
    network environment includes non-BIND or older BIND nameservers, check to see
    if a particular advanced feature is available before attempting to use it.


    All of the features mentioned here are discussed in greater detail in the BIND
    9 Administrator Reference Manual. See Section 12.7.1 Installed Documentation for
    more information.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# 12.5.1. Protocol Enhancements


    BIND supports Incremental Zone Transfers (IXFR), where slave nameserver will only
    download the updated portions of a zone modified on a master nameserver. The standard
    transfer process requires that the entire zone be transferred to each nameserver
    for the smallest change. For very popular domains with very lengthy zone files
    and many slave nameservers, IXFR makes the notification and update process much
    less intensive.


    Note that IXFR is only available when using dynamic updating to make changes to
    zone records. If manually editing zone files to make changes, AXFR is used. More
    information on dynamic updating is available in the BIND 9 Administrator Reference
    Manual. See Section 12.7.1 Installed Documentation for more information.


    # 12.5.2. Multiple Views


    Through the use of the view statement in named.conf, BIND can present different
    information depending on who is making the request.


    This is primarily used to deny specific DNS entries from clients outside of the
    local network, while allowing queries from clients inside the local network.


    The view statement uses the match-clients option to map IP addresses or entire
    networks and provide specific options and zone data.


    # 12.5.3. Security


    BIND supports a number of different methods to protect the updating and transfer
    of zones, on both master and slave nameservers:


    +   - DNSSEC — Short for DNS SECUality, this feature allows zones to be cryptographically
    signed with a zone key.


    In this way, the information about a specific zone can be verified as coming from
    a nameserver that it has signed with a private key, as long as the recipient has
    nameserver''s public key.


    BIND version 9 also supports the SIG(0) public/private key method of message authentication.


    +   - TSIG — Short for Transaction SIGnatures, this feature allows a transfer
    from master to slave authorized only after verifying that a shared secret key
    exists on the master and slave nameservers.


    This strengthens the standard IP address-based method of transfer authorization.
    An attacker would not only need to have access to the IP address to transfer the
    zone, but they would also need to know the secret key.


    BIND version 9 also supports TKEY, which is another shared secret key method of
    authorizing zone transfers.


    # 12.5.4. IP version 6


    BIND version 9 can provide nameservice in IP version 6 (IPv6) environments through
    the use of A6 zone records.


    If the network includes both IPv4 and IPv6 hosts, use the lwres lightweight resolver
    daemon on all network clients. This daemon is a very efficient, caching-only nameserver
    which understands the new A6 and DNAME records used under IPv6. See the lwres
    man page for more information.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# Chapter 12. Berkeley Internet Name Domain (BIND)


    # 12.6. Common Mistakes to Avoid


    It is very common for beginners to make mistakes when editing BIND configuration
    files. Be sure to avoid the following issues:


    +   - Take care to increment the serial number

    - If the serial number is not incremented, the master nameserver may have the
    correct, new information, but the slave nameservers will never be notified of
    the change or attempt to refresh their data of that zone.

    - Be careful to use ellipses and semi-colons correctly in the `/etc/named.conf`
    file. An omitted semicolon or unexpected ellipse will cause named to refuse to
    start.

    - Remember to use periods (.) in zone files after all FDNs and omit them on hostnames.

    - A period at the end of a domain name denotes a fully qualified name. If the
    period is omitted, named adds the name of the zone or the `$ORIGIN` value to complete
    it.

    - If a firewall is blocking connections from the named program to edit its configuration
    file.

    By default, BIND version 9 uses random ports over 1024 to query other nameservers.
    Firewalls, expect all nameservers to communicate using only port 53. Force named
    to use port 53 by adding the following line to the options statement of `/etc/named.conf`:
    `query-source-address * port 53;


    # 12.7. Additional Resources


    The following sources of information will provide additional resources regarding
    BIND.


    # 12.7.1 Installed Documentation


    +   - BIND features a full-range of installation documentation covering many different
    topics, each placed in its subject directory:

    - `/usr/share/doc/bind-<version-number>/` — Contains a README file with the list
    of the most recent features.

    - `/usr/share/doc/bind-<version-number>/arm/` — Contains HTML and SGML of the
    BIND 9 Administrator Reference Manual, which details BIND resource requirements,
    how to configure different types of nameservers, perform load balancing, and other
    topics. For most users of BIND, this is the best place to start.

    - `/usr/share/doc/bind-<version-number>/draft/` — Contains assorted documents
    that reviews issues related to DNS service and methods proposed to address them.

    - `/usr/share/doc/bind-<version-number>/misc/` — Contains documents designed to
    address specific advanced issues. Users of BIND version 8 should consult the migration
    document for options they must make when moving to BIND 9. The options file lists
    all the options implemented in BIND 9 that are used in `/etc/named.conf`.

    - `/usr/share/doc/bind-<version-number>/rfc/` — Every RFC document related to
    BIND is in this directory.

    - man named — Explores aspects that can be used to control the BIND nameserver
    daemon.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'man named.conf — A comprehensive list of options available within the named
    configuration file.


    man rndc — Explains the different options available when using the rndc command
    to control a BIND nameserver.


    man rndc.conf — A comprehensive list of options available within the rndc configuration
