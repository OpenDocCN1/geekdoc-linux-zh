    # 11.3.2. Fetchmail


    Fetchmail is an MTA which retrieves email from remote servers and delivers it
    to the local MTA. Many users appreciate the ability to separate the process of
    downloading their messages located on a remote server from the process of reading
    and organizing them in an MTA. Designed with the needs of dial-up users in mind,
    Fetchmail connects and downloads all of the email messages to the mail spool using
    any protocols, including the POP3 and IMAP. It can even forward email messages
    to an SMTP server, if necessary.


    Fetchmail is configured for each user through the use of a .fetchmailrc file in
    the user''s home directory.


    Using preferences in the .fetchmailrc file, Fetchmail checks for email on a remote
    server and pulls it off. If it attempts to deliver it to port 25 on the local
    machine, using the local MTA to place the email in the correct user''s spool.
    If Proxym is available, it can then be used to fetch the email and place it in
    a mailbox so it can be read by an MTA.


    # 11.3.2.1. Fetchmail Configuration Options


    Although it is possible to pass any options on the command line to check for email
    on a remote server when executing Fetchmail, a .fetchmailrc file is much easier.
    All of the configuration options go in the .fetchmailrc and it is possible to
    override them at the time Fetchmail is run by specifying that option on the command
    line.


    A user''s .fetchmailrc file is divided into three particular types of configuration
    options:


    +   - global options — Gives Fetchmail instructions that control the operation
    or provide settings for every account checks for mail.

    - server options — Specifies information about the server being polled, such as
    the hostname, as well as preferences for a specific email server, such as the
    port to check or number of seconds to wait before timing out. These options affect
    every user used with that server.

    - user options — Contains information, such as username and password, necessary
    to authenticate and check for email using a particular server.


    Global options appear at the top of the .fetchmailrc file, followed by one or
    more server options, each of which designate a different server that Fetchmail
    should check. User options follow server options for each account checking their
    mail. Like server options, user options may be specified for a particular server
    as well as to check multiple accounts on the same server.


    Server options are called in service of the .fetchmailrc file of a special verb
    option, poll or skip, which precedes any of the server information. The poll action
    tells Fetchmail to use this server option when it is run, which actually checks
    it for email the various user options. User options after a skip action, are not
    checked unless this server hostname is specified when Fetchmail is invoked. The
    skip option sets up test configurations in .fetchmailrc and only checks that server
    when desired, without affecting any working configurations.


    A sample .fetchmailrc file looks like this:


    ```

    set postmaster "user"

    set bouncemail

    poll pop.domain.com proto pop3

    user ''user'' there with password ''secret'' is user here

    ```'
  merge: -1
  img_proc: true
