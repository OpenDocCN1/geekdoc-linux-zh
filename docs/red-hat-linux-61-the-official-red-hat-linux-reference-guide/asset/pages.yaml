    # 4. Using the Mouse


    Red Linux is designed to use a three-button mouse. If you have a two-button mouse,
    you should have selected three-button emulation during the installation process.
    If you''re using three-button emulation, pressing both mouse buttons at the same
    time equates to pressing the missing third (middle) button.


    In this document, if you are instructed to click the mouse with on, that means
    the left mouse button. If you need to use the middle or right mouse button, that
    will be explicitly stated. (This will be reversed if you''ve configured your mouse
    to be used by a left handed person.)


    The phrase "drag and drop" will be familiar to you. If you''re instructed to drag
    and drop an item on your GUI desktop, click on something and hold the mouse button
    down. While continuing to hold down the mouse button, drag the item by moving
    the mouse to a new location. When you''ve reached the desired location, release
    the mouse button to drop the item.


    # 5. Copying and Pasting Text With X


    Copying and pasting text is easy using your mouse and the X Window System. To
    copy text, simply click and drag your mouse over the text to highlight it. To
    paste the text somewhere, click the middle mouse button in the spot where the
    text should be placed.'
