  md: '# Chapter 7. The X Window System


    There must be at least two InputDevices: one for the default mouse and one for
    the default keyboard. The options CorePointer and CoreKeyboard indicate these
    are the primary mouse and keyboard.


    +   - Option <option-name> — An optional entry which specifies extra parameters
    for the section. Any options listed here override those listed in the ServerFlags
    section.


    Replace <option-name> with a valid option listed for this section in the XF86Config
    page.


    It is possible to create more than one ServerLayout section. However, the server
    will only read the first one unless an alternate ServerLayout section is specified
    as a command line argument.


    # 3.7.1. Files


    The Files section sets paths for services vital to the XFree86 server, such as
    the font path. The following example illustrates a typical Files section:


    ```

    Section "Files"

    RgbPath "/usr/X11R6/lib/rgb"

    FontPath "/unix:/7100"

    EndSection

    ```


    The following entries are commonly used in the Files section:


    +   - RgbPath — Specifies the location of the RGB color database. This database
    defines all valid color names in XFree86 and ties them to specific RGB values.

    - FontPath — Specifies where the XFree86 server must connect to obtain fonts from
    the xfs server.

    By default, the FontPath is unix:7100. This tells the XFree86 server to obtain
    font information using UNIX-domain sockets for inter-process communication (IPC)
    on port 7100.

    See Section 7.4 Fonts for more information concerning XFree86 and fonts.

    - ModulePath — An optional parameter which specifies alternate directories to
    store XFree86 modules.


    # 3.7.1. Module


    The Module section specifies which modules from the /usr/X11R6/lib/modules/ directory
    the XFree86 server is to load. Modules add additional functionality to the XFree86
    server.

    The following example illustrates a typical Module section:


    ```

    Section "Module"

    Load "dbe"

    Load "extmod"

    Load "fbdevhw"

    Load "glix"

    Load "record"

    Load "freetype"

    Load "types1"

    Load "dri"

    EndSection

    ```'
