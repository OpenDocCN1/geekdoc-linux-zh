    \ go in the /var/lock/ directory, usually in directories particular for the program\
    \ using the file. The /var/spool/ directory has subdirectories for various systems\
    \ that need to store data files.\n\n# 3.2.2. /usr/local/ in Red Hat Linux\n\n\
    In Red Hat Linux, the intended use for the /usr/local/ directory is slightly different\
    \ from what is specified by the FHS. The FHS says that /usr/local/ should be where\
