- pgno: 101
  md: "# 7.3.1.6. InputDevice\n\nEach InputDevice section configures one device for\
    \ the XFree86 server. Systems typically have at least two InputDevice sections,\
    \ keyboard and mouse.\n\nThe following example illustrates a typical InputDevice\
    \ section for a mouse:\n\n```\nSection \"InputDevice\"\n  Identifier \"Mouse0\"\
    \n  Driver \"mouse\"\n  Option \"Protocol\" \"IMPS/2\"\n  Option \"Device\" \"\
    /dev/input/mice\"\n  Option \"Emulate3Buttons\" \"no\"\n  EndSection\n```\n\n\
    The following entries are commonly used in the InputDevice section:\n\n+   - Identifier\
    \ — Specifies a unique name for this InputDevice section. This is a required entry.\n\
    - Driver — Specifies the name of the device driver XFree86 load for the device.\n\
    - Option — Specifies necessary options pertaining to the device.\\ For a mouse,\
    \ these options typically include:\n  - Protocol — Specifies the protocol used\
    \ by the mouse, such as IMPS/2.\n  - Device — Specifies the location of the physical\
    \ device.\n  - Emulate3Buttons — Specifies whether to allow two button to act\
    \ like three button when mouse buttons are pressed simultaneously.\n\nConsult\
    \ the XF86Conf page for list of valid options for this section.\nBy default the\
    \ InputDevice section has comments to allow users to configure additional options.\n\
    \n# 7.3.1.7. Monitor section\n\nEach Monitor section configures one type of monitor\
    \ used by the system. While Monitor section is the minimum, additional instances\
    \ may occur for each monitor type in use with the machine.\n\nThe best way to\
    \ configure a monitor is to configure X during the installation process or by\
    \ using X Configuration Tool. For more about the X Configuration Tool refer to\
    \ the chapter titled Audio, Video, and General Amusement in the Red Linux Getting\
    \ Started Guide.\n\nThis example illustrates a typical Monitor section for a monitor:\n\
    \n```\nSection \"Monitor\"\n  Identifier \"Monitor0\"\n  VendorName \"Monitor\
    \ Vendor\"\n  ModelName \"DDC Probed Monitor - ViewSonic G773-2\"\n  DisplaySize\
    \ \"320 240\"\n  HorizSync \"50.0 - 70.0\"\n  VertRefresh \"50.0 - 180.0\"\n \
    \ EndSection\n```"
  merge: -1
