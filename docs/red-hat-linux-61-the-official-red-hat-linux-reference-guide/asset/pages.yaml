  md: '# 88 Chapter 7. The X Window System


    +   * VendorName — An optional parameter which specifies the vendor of the video
    card.

    * BoardName — An optional parameter which specifies the name of the video card.

    * VideoRam — An optional parameter which specifies the amount of RAM available
    on the video card in kilobytes. This setting is only necessary for video cards
    the XFree8 server cannot detect the amount of video RAM.

    * BusID — An optional entry which specifies the location of the video card. This
    option is mandatory for systems with multiple cards.

    * Screen — An optional entry which specifies which monitor connector or head on
    the video card the Device section connects. This option is only useful for cards
    with multiple heads.


    If multiple monitors are connected to different heads on the same video card,
    separate Device sections must exist and each of these sections must have a different
    Screen value.


    Values for the Screen entry must be an integer. The first head on the video card
    has a value of 0. The value for each additional head increases this value by one.


    +   * Option <option-name> — An optional entry which specifies parameters for
    the section. Replace <option-name> with a valid option for this section in the
    XF86Config page.


    One of the more common options is "dpms", which activates Service Star energy
    compliance for the monitor.


    # 7.3.1. Screen


    Each Screen section binds one video card (or video card head) to one monitor by
    referencing the Device and Monitor section for each. While one Screen is the minimum,
    additional instances may occur for each video card and monitor combination on
    the machine.


    The following example illustrates a typical Screen section:


    ```

    Section "Screen"

    Identifier "Screen0"

    Device "Videocard0"

    Monitor "Monitor0"

    DefaultDepth 16

    SubSection "Display"

    Depth 24

    Modes "1280x1024" "1280x960" "1152x864" "1024x768" "800x600" "640x480"

    EndSection

    SubSection "Display"

    Depth 16

    Modes "1152x864" "1024x768" "800x600" "640x480"

    EndSection

    EndSection

    ```


    The following entries are common in the Screen section:


    +   * Identifier — Specifies a unique name for this Screen section. This is a
    required entry.

    * Device — Specifies the unique name of a Device section. This is a required entry.

    * Monitor — Specifies the unique name of a Monitor section. This is a required
    entry.

    * DefaultDepth — Specifies the default color depth in bits. In the previous example,
    16, which provides thousands of colors, is the default. Multiple DefaultDepth
    entries are permitted, but at least one must be present.'
  merge: -1
  img_proc: true
