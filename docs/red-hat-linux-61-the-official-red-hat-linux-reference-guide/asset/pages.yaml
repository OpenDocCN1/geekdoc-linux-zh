  md: '# Chapter 4.


    # The sysconfig Directory


    The /etc/sysconfig/ directory is where a variety of system configuration files
    for Red Hat Linux are stored.


    This chapter outlines some of the files found in the /etc/sysconfig/ directory,
    their function, and their contents. The information in this chapter is not intended
    to be complete, as many of these files have a variety of options that are only
    used in very specific or rare circumstances.


