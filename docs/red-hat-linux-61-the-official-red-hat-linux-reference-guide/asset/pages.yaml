  md: "# 30 Chapter 4. The sysconfig Directory\n\n+   - rawdevices\n- redhat-config-securitylevel\n\
    - redhat-config-users\n- redhat-logviewer\n- samba\n- sendmail\n- soundcard\n\
    - spamassassin\n- squid\n- tux\n- ups\n- vncservers\n- xinetd\n\n> Note\n some\
    \ of the files listed are not present in the /etc/sysconfig/ directory, then the\
    \ corresponding program may not be installed.\n\n# 4.1.1. /etc/sysconfig/amd\n\
    \nThe /etc/sysconfig/amd file contains various parameters used by amd, which allow\
    \ for the automatic mounting and unmounting of file systems.\n\n# 4.1.2. /etc/sysconfig/apmd\n\
    \nThe /etc/sysconfig/apmd file is used by apmd as a configuration for what on\
    \ or off power settings to start/stop on suspend or resume. It is configured to\
    \ turn on apmd at boot time, depending on whether the hardware supports Advanced\
    \ Power Management (APM) or whether not the user has configured the system to\
    \ use it. The apmd daemon is a monitoring program that works with power management\
    \ code within the Linux kernel. capable of alerting users to low battery power\
    \ on laptops and other power-related settings.\n\n# 4.1.3. /etc/sysconfig/arpwatch\n\
    \nThe /etc/sysconfig/arpwatch file is used to pass arguments to the arpwatch daemon\
    \ at boot time. The arpwatch daemon maintains a table of Ethernet MAC addresses\
    \ and their IP address pairings. For more information about what parameters are\
    \ available for this file, see the arpwatch man page. By default, this file sets\
    \ the owner of the arpwatch process to the user pcap."
  merge: -1
  img_proc: true
- pgno: 46
  md: "# Chapter 4. The sysconfig Directory\n\n# 4.1.4. /etc/sysconfig/authconfig\n\
    \nThe /etc/sysconfig/authconfig file sets the kind of authorization to be used\
    \ on the host. It contains one or more of the following lines:\n\n+   - USEMD5=<value>,\
    \ where <value> is one of the following:\n  - yes — MD5 is not used for authentication.\n\
    \  - no — MD5 is not used for authentication.\n\n+   - USERKERBOS=<value>, where\
    \ <value> is one of the following:\n  - yes — Kerberos is used for authentication.\n\
    \  - no — Kerberos is not used for authentication.\n\n+   - USELDAPUTH=<value>,\
    \ where <value> is one of the following:\n  - yes — LDAP is used for authentication.\n\
    \  - no — LDAP is not used for authentication.\n\n# 4.1.5. /etc/sysconfig/clock\n\
    \nThe /etc/sysconfig/clock file controls the interpretation of values read from\
    \ the system hard-ware clock.\n\nThe correct values are:\n\n+   - UTC=<value>,\
    \ where <value> is one of the following boolean values:\n  - true or yes — The\
    \ hardware clock is set to Universal Time.\n  - false or no — The hardware clock\
    \ is set to local time.\n\n+   - ARC=<value>, where <value> is the following:\n\
    \  - true or yes — The ARC console's 42-year time offset is in effect. This setting\
    \ is only for ARC- or AlphaBIOS-based systems. Any other value indicates that\
    \ the normal UNIX epoch is in use.\n\n+   - SRM=<value>, where <value> is the\
    \ following:\n  - true or yes — The SRM console's 1900 epoch is in effect. This\
    \ setting is only for SRM-based systems. Any other value indicates the normal\
    \ UNIX epoch is in use.\n\n+   - ZONE=<filename> — The timezone file under /usr/share/zoneinfo\
    \ that /etc/localtime is a copy of it. This file contains information such as:\n\
    \  ZONE=\"America/New York\"\n\nEarlier releases of Red Linux use the following\
    \ values (which are deprecated):\n\n+   - CLOCKMODE=<value>, where <value> is\
    \ one of the following:\n  - GMT — The clock is set to Universal Time (Greenwich\
    \ Mean Time).\n  - ARC — The ARC console's 42-year time offset is in effect (for\
    \ Alpha-based systems only)."
  merge: -1
  img_proc: true
- pgno: 47
  md: '# 4.1.6. /etc/sysconfig/desktop


    The /etc/sysconfig/desktop file specifies the desktop manager to be run, such
    as:


    DESKTOP="GNOME"


    # The /etc/sysconfig/dhcpd file is used to pass arguments to the dhcpd daemon
    at boot time. The dhcpd daemon implements the Dynamic Host Configuration Protocol
    (DHCP) and the Internet Bootstrap Protocol (BOOT). DHCP and BOOT assign hostnames
    to machines on the network. For more information about parameters are available
    in this file, see the dhcpd man page.


    # With Red Hat Linux 8.0, the first time the system boots, the /sbin/init program
    calls the /etc/rc.d/init.d/firstboot script, which in launches Setup Agent. This
    application allows the user to install the latest updates as well as additional
    applications and documentation. The /etc/sysconfig/firstboot file tells the Setup
    Agent not to run on subsequent boots. To run only when the system boots, remove
    /etc/sysconfig/firstboot and execute chconfig --level=5 firstboot on.


    # The /etc/sysconfig/gpm file is used to pass arguments to the gpm daemon at boot
    time. The gpm daemon is the mouse server which allows mouse acceleration and middle-click
    pasting. For more information about what parameters are available for this file,
    see the gpm man page. By default, it sets the mouse device to /dev/mouse.


    # The /etc/sysconfig/harddisks tunes the hard drive(s). The administrator can
    also use /etc/sysconfig/hardiskd[a-h] to configure parameters for specific drives.


    > Do not make changes to this file without careful consideration. By changing
    the default values, it is possible to corrupt all the data on the hard drive(s).


    The /etc/sysconfig/harddisks file may contain the following:


    +   - USE_DMA=1, setting this value to 1 enables DMA. However, with some chipsets
    and hard drive combinations, DMA can cause data corruption. Check with the hard
    drive documentation or manufacturer before enabling this option.

    - Multiple_IO=16, where a setting of 16 allows for multiple sectors per I/O interrupt.
    When enabled, this features reducing system overhead by 30-50%. Use with caution.'
  merge: -1
  img_proc: true
