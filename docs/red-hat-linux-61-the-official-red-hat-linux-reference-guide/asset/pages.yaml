- pgno: 263
  md: '# Chapter 19. Tripwire


    # # Important


    If you edit the configuration file and leave any of the above variables undefined,
    the configuration file will be invalid. If this occurs, when you execute the `tripwire`
    command it will report an error and exit.


    The rest of the configurable variables in the sample `/etc/tripwire/twcfg.txt`
    file are optional. These include the following:


    +   - EDITOR — Specifies the editor used by Tripwire. The default value is `/bin/vi`.


    +   - LATEPROMPING — If set to `true`, this variable configures Tripwire to wait
    as long as possible before prompting the user for a password, thereby minimizing
    the amount of time the password is in memory. The default value is `false`.


    +   - LOOSEDDIRECTORYCHECKING — If set to `true`, this variable configures Tripwire
    to report information if a file within a watched directory changes, but not to
    report the change for the directory itself. This limits redundancy in Tripwire
    reports. The default value is `false`.


    +   - SYLOGREPORTING — If set to `true`, this variable configures Tripwire to
    report information to the syslog daemon via the "user". The log level is set to
    `notice`. See the `syslog` man page for more information. The default value is
    `false`.


    +   - MAILVIATIONS — If set to `true`, this variable configures Tripwire to email
    a report at a regular interval regardless of whether any violations have occurred.
    The default value is `true`.


    +   - EMAILREPORTLEVEL — Specifies the detail level for emailed reports. Valid
    values for this variable are `0` through `4`. The default value is 3.


    +   - REPORTLEVEL — Specifies the detail level for reports generated by the `twprint`
    command. The value can be overridden on the command line, but is set to `3` by
    default.


    +   - MAILMETHOD — Specifies which mail protocol Tripwire should use. Valid values
    are SMTP and SENDMAIL. The default value is `SENDMAIL`.


    +   - MAILPROGRAM — Specifies which mail program Tripwire should use. The default
    value is `/usr/sbin/sendmail -oi -t`.


    After editing the sample configuration file, you will need to configure the sample
    policy file.


    # # Warning


    For security purposes, you should either delete or store in a secure location
    copies of the plain text `/etc/tripwire/twcfg.txt` file after running the installation
    script or regenerating a signed configuration file. Alternatively, you can change
    the permissions so that it is not world readable.


    #  19.3.2. Edit /etc/tripwire/twpol.txt


    Although it is not required, you should edit this heavily sample Tripwire policy
    file to take into account the specific applications, files, and directories on
    your system. Relying on the unaltered sample configuration from the RPM may not
    adequately protect your system.


    Modifying the policy also increases the effectiveness of Tripwire reports by minimizing
    false alerts for files and programs you are not using and by adding functionality,
    such as email notification.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# Chapter 19. Tripwire


    Note


    Notification via email is not configured by default. See Section 19.8.1 Tripwire
    and Email for on configuring this feature.


    If you modify the sample policy file after running the configuration script, See
    Section 19.8 Updating the Tripwire Policy File for instructions on regenerating
    a signed policy file.


    Warning

    For security purposes, you should either delete or store in a secure location
    any copies of the plain text /etc/tripwire/twpol.txt file after running the installation
    script or regenerating a signed configuration file. Alternatively, you can change
    the permissions so that it is not world readable.


    # 19.3.3. Run the twinstall.sh Script


    As the root user, type /etc/tripwire/twinstall.sh at the shell prompt to run the
    configuration script. twinstall.sh script will ask you for site and local passwords.
    These passwords are used to generate cryptographic keys for protecting Tripwire
    files. The script then creates and signs these files.


    When selecting the site and local passwords, you should consider the following
    guidelines:


    +   - Use least eight alphanumeric and symbolic characters for each unique password,
    but no more 1023 characters.

    - Do not use quotes in a password.

    - Make the Tripwire passwords completely different from the root or any other
    password for the system.

    - Use unique passwords for both the site key and the local key.


    The site key protects the Tripwire configuration and policy files. The local key
    protects the Tripwire database and report files.


    Warning

    There is no way to decrypt a signed file if you forget your password. If you forget
    the passwords, the files are unusable and you will have to run the configuration
    script again.


    By encrypting its configuration, policy, database, and report files, Tripwire
    protects them from being viewed by anyone who does not know the site and local
    passwords. This means that, if an intruder obtains root access to your system,
    they will not be able to alter the Tripwire files to hide their tracks.


    Once encrypted and signed, the configuration and policy files generated by running
    the twinstall.sh script should not be renamed or moved.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# 19.4. Initialize the Tripwire Database


    When initializing its database, Tripwire builds a collection of file system objects
    based on the rules in the policy file. This database serves as the baseline for
    integrity checks.

    To initialize the Tripwire database, using the following command:


    ```

    /usr/bin/tripwire --init

    ```


    This command can take several minutes to run.

    Once you finish these steps successfully, Tripwire has the baseline snapshot of
    your file system to check for changes in critical files. After initializing the
    Tripwire database, you should run an initial integrity check. This check should
    be done before connecting to the network and putting it into production. For further
    instructions, see Section 19.5 Running an Integrity Check.

    Once Tripwire is configured to your satisfaction, you are free to place the system
    in production.


    # 19.5. Running an Integrity Check


    By default, the Tripwire RPM installs a shell script tripwire-check to the /etc/cron.daily/
    directory. This script automatically runs an integrity check every day.

    You however, run a Tripwire integrity check at any time by typing the following
    command:


    ```

    /usr/bin/tripwire --check

    ```


    During an integrity check, Tripwire compares the current state of file system
    objects with the properties recorded in its database. Violations are printed to
    the screen and an encrypted copy of the report is created in /var/lib/tripwire/report/.
    You can view the report using the twprint command as outlined in Section 19.6
    Viewing Tripwire Reports.

    If would like to receive an email when certain types of integrity violations occur,
    you can configure this in the policy file. See Section 19.8.1 Tripwire and Email
    for instructions on how to set up and test this feature.


    # 19.6. Examing Tripwire Reports


    The /usr/bin/twprint command is used to view encrypted Tripwire reports and databases.


    # 19.6.1. Viewing Tripwire Reports


    The twprint -r command will display the contents of a Tripwire report in clear
    text. You must, however, tell twprint which report file to display.

    A twprint command for printing Tripwire reports looks similar to the following:


    ```

    /usr/bin/twprint -m --twfle /var/lib/tripwire/report/<name>.twr

    ```


    The -m option in the command directs twprint to decrypt a Tripwire report. The
    --twfle option directs twprint to use a specific Tripwire report file.

    The name of the report that you want to see includes the name of the Tripwire
    checked to generate the report, the creation date and time. You can review previously
    saved reports at any time. Simply ls /var/lib/tripwire/report to see a list of
    Tripwire reports.

    Tripwire reports can be rather lengthy, depending on the number of violations
    found or errors generated. A sample report starts off like this:'
  merge: -1
  img_proc: true
