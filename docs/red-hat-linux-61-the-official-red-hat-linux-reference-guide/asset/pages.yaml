    \ is for the X Window System (XFree86 on Red Hat Linux).\n\n# 3.2.19. The /usr/local/\
    \ Directory\n\nThe FHS says:\n\n> \"The /usr/local hierarchy is used by the system\
    \ administrator when installing software locally. It may be safe from being overwritten\
    \ when the system software is updated. It may be used for programs and data that\
    \ are shareable among a group of hosts, but not found in /usr/\"\n\nThe /usr/local/\
    \ directory is similar in structure to the /usr/ directory. It has the following\
    \ subdirectories, which are similar in purpose to those in the /usr/ directory:\n\
    \n+   /usr/local\n  - bin/\n  - doc/\n  - etc/\n  - games/\n  - include/\n  -\
    \ lib/\n  - libexec/\n  - sbin/\n  - share/\n  - src/\n\n# 3.2.10. The /var/ Directory\n\
    \nSince the FHS requires Linux to mount /usr read-only, any programs that write\
    \ log files or need spool/ or lock/ directories should write them to the /var/\
    \ directory. The FHS states /var/ is for:\n\n> \"variable data files. This includes\
    \ spool directories and files, administrative and logging data, and transient\
    \ files.\"\n\nBelow are some of the directories which should be subdirectories\
    \ of the /var/ directory:\n\n+   /var\n  - account/\n  - arpwatch/\n  - cache/\n\
    \  - crash/\n  - db/\n  - empty/\n  - ftp/\n  - gdm/\n  - kerberos/\n  - lib/\n\
    \  - local/\n  - lock/\n  - log/\n  - mail -> spool/mail/"
