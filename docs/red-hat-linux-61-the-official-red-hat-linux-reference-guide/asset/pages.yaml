- pgno: 261
  md: 'The following describes in more detail the numbered blocks shown in Figure
    19-1.


    +   1. Install the Tripwire and customize the policy file.


    Install the Tripwire RPM (see Section 19.2 Installing the Tripwire RPM). Then,
    customize the sample configuration and policy files (/etc/tripwire/twcfg.txt and
    /etc/tripwire/twpol.txt respectively) and run the configuration script, /etc/tripwire/twinstall.sh.
    For more information, see Section 19.3 Customizing Tripwire.


    +   2. Initialize the Tripwire database.


    Build a database of critical system files to monitor the contents of the new,
    signed Tripwire policy file (/etc/tripwire/tw.pol). For more information, see
    Section 19.4 Initialize the Tripwire Database.


    +   3. Run a Tripwire integrity check.


    Compare the newly-created Tripwire database with the actual system files, looking
    for missing or altered files. For more information, see Section 19.5 Running an
    Integrity Check.


    +   4. Examine the Tripwire report file.


    View the Tripwire report file using /usr/sbin/twprint to note integrity violations.
    For more information, see Section 19.6 Viewing Tripwire Reports.


    +   5. If unauthorized integrity violations occur, take appropriate security measures.


    If monitored files have been altered inappropriately, you can replace the original
    files from backup copies, reinstall the program, or completely reinstall the operating
    system.


    +   6. If the file alterations are valid, verify and update the Tripwire database
    file.


    If the changes made are intentional, edit Tripwire''s database file to ignore
    those changes in subsequent reports. For more information, see Section 19.7 Updating
    the Tripwire Database.


    +   7. If the policy file fails verification, update the Tripwire policy file.


    To change the list of files Tripwire monitors or how it treats integrity violations,
    update the supplied file (/etc/tripwire/twpol.txt), regenerate a signed copy (/etc/tripwire/tw.pol),
    and update the Tripwire database. For more information, see Section 19.8 Updating
    the Tripwire Policy File.


    Refer to the appropriate sections within this chapter for detailed instructions
    on each step.


    # 19.2. Installing the Tripwire RPM


    The easiest way to install Tripwire is to select the Tripwire RPM during the Red
    Linux installation process. If you have already installed Red Linux, you can use
    the rpm command or the Package Management Tool (redhat-config-packages) to install
    the Tripwire RPM from the Red Linux 9 CD-ROMs.


    If you are not whether Tripwire is installed, type the following command at a
    shell prompt:


    ```

    rpm tripwire

    ```


    If Tripwire is installed, this command will return the following:


    ```

    tripwire-<version-number>

    ```'
