- pgno: 6
  md: '# Introduction


    Welcome to the Red Hat Linux Reference Guide.


    The Red Hat Linux Reference Guide contains useful information about the Red Hat
    Linux system. From fundamental concepts, as the structure of the Red Hat Linux
    file system, to the finer points of system security and authentication control,
    we hope you find this book to be a valuable resource.


    This guide is for you you want to learn a bit more about how the Red Hat Linux
    system works. Topics that you can explore within this manual include the following:


    +   * The file system structure

    * The boot process

    * The X Window System

    * Security tools

    * Network services


    # 1. Changes To This Manual


    This manual has been reorganized for clarity and updated for the latest features
    of Red Hat Linux 9. Some of the changes include:


    The X Window System Chapter


    > The X Window System has been completely revised and reorganized for clarity.
    New font configuration instructions were added as well.


    New sysconfig Chapter


    > The sysconfig section of the Boot Process, Init, and Shutdown chapter has been
    expanded and converted into its own chapter.


    Updated TCP Wrappers and xinetd Chapter


    > The newly TCP Wrappers and xinetd chapter has been completely overhauled and
    reorganized for clarity.


    Updated Users and Groups Chapter


    > The Users and Groups chapter has been clarified, updated, and reorganized.


    Updated Network Interfaces Chapter


    > The Network Interfaces chapter has been updated and reorganized.


    An Apache HTTP Server Chapter


    > The guide for migrating from version 1.3 to 2.0 of the Apache HTTP Server has
    been updated. The list of server configuration options has been further updated
    and reorganized. Special thanks to Gary Benson and Joe Jordan for their work on
    the Apache HTTP Server migration guide.


    Before reading this guide, you should be familiar with the contents of the Red
    Hat Linux Installation Guide concerning installation issues, the Red Hat Linux
    Getting Started Guide for basic Linux concepts and the Red Hat Linux Customization
    Guide for general customization instructions. The Red Hat Linux Reference Guide
    contains information about topics for advanced users.'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# ii


    # Introduction


    HTML and PDF versions of all the Red Hat Linux manuals are available online at:
    http://www.redhat.com/docs


    ![](img/31025704b51d5760c0228ff0f3db98bf_7_0.png)


    Note


    Although this manual reflects the most current information possible, you should
    read the Red Hat Linux Release Notes for information that may not have been available
    prior to our documentation finalizing. The Release Notes can be found on the Red
    Hat Linux CD #1 and online at the following URL:


    ```

    http://www.redhat.com/docs/manuals/linux

    ```


    # 2. Finding Appropriate Documentation


    You need documentation that is appropriate to your level of Linux expertise. Otherwise,
    you might feel overwhelmed or not find the necessary information to answer any
    questions. The Red Hat Linux Reference Guide deals with more technical aspects
    and options of a Red Hat Linux system. This section will help you decide whether
    to look in this manual for the information you need or consider other Red Hat
    manuals, including online sources, in your search.


    Three categories of people use Red Hat Linux, and each of these requires different
    sets of documentation and informative services. To help you figure out where you
    should start, determine your experience level:


    New to Linux


    This type of user has never used any Linux (or Linux-like) operating system before
    or has only limited experience to Linux. They may or not have experience using
    other operating systems (such as Windows). If this is you, skip ahead to Section
    2.1 Documentation For First-Time Users.


    Some Linux Experience


    This type of user has installed and successfully used Linux (but not Red Hat Linux)
    before or may have equivalent experience with other Linux-like operating systems.
    Does this describe you?, turn to Section 2.2 For the More Experienced.


    Experienced User


    This type of user has installed and successfully used Red Hat Linux before. If
    this describes you, turn to Section 2.3 Documentation for Linux Gurus.


    # 2.1. Documentation For First-Time Linux Users


    For someone new to Linux, the amount of information available on any particular
    subject, such as printing, starting up the system or partitioning a hard drive,
    can be overwhelming. It helps to initially step back and gain a decent base of
    information centered around how Linux works tackling these kinds of advanced issues.


    Your first goal should be to obtain some useful documentation. This cannot be
    stressed enough. Without documentation, you will only become frustrated by your
    inability to get a Red Hat Linux system working the way you want.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Introduction


    You should acquire the following types of Linux documentation:


    +   - A brief history of Linux — Many aspects of Linux are the way they are because
    of historical precedence. The Linux culture is also based on past events, needs
    or requirements. A basic understanding of the history of Linux will help you figure
    how to solve many potential problems before they actually seem.

    - An explanation of how Linux works — While delving into the most arcane aspects
    of the Linux kernel is not necessary, it is a good idea to know how Linux is put
    together. It is particularly important if you have been working with other operating
    systems, and as of the assumptions you carry how computers may not transfer from
    that system to Linux.

    - An introductory command overview (with examples) — This is probably the most
    important thing to look for in Linux documentation. The underlying design philosophy
    for Linux is that it is better to use many small commands connected in different
    ways than to have a few large (and complex) commands that do the job themselves.
    Without examples that illustrate this approach to doing things, you may find yourself
    intimidated by the sheer number of commands available on a Red Linux system.


    Keep in mind that you do not have to memorize all of the available Linux commands.
    Different techniques help you find the specific command you need to accomplish
    a task. You will need to know the general way in which Linux functions, what you
    need to accomplish, and how to access the tool that will give you the exact instructions
    you need to execute the command.


    The Red Hat Installation Guide is an excellent reference for helping you get a
    Red Hat system successfully installed and initially configured. The Red Linux
    Getting Started Guide covers basic system commands, the graphical desktop environment,
    and many other fundamental concepts. You should start with these two books and
    use them to build the base of your knowledge of Red Hat Linux. Before long, more
    complicated concepts will begin to make sense because you already grasp the general
    ideas.


    Beyond reading Red Linux manuals, several other excellent documentation resources
    are available for little or no cost:


    # 2.1.1. Introduction to Linux Websites


    +   - http://www.redhat.com — On the Red Hat website, you will find links to the
    Linux Documentation Project (LDP), online versions of the Red Hat manuals, FAQs
    (Frequently Asked Questions), a database that can help you find a Linux Users
    Group near you, technical information in the Red Hat Knowledge Base, and more.

    - http://www.linuxheaders.com — The Linux Headquarters website features easy to
    follow, step-by-step guides for a variety of Linux tasks.


    # 2.1.2. Introduction to Linux Newsgroups


    You can participate in newsgroups by watching the discussions of others attempting
    to solve problems, or by actively answering questions. Experienced Linux users
    are known to be extremely helpful when trying new users with Linux issues — especially
    if you are posing questions in the right venue. If you do not have access to a
    news reader, you can access this information via the Web at http://groups.google.com/.
    Dozens of Linux-related newsgroups exist, including the following:


    +   - linux.help — A great place to get help from fellow Linux users.

    - linux.redhat — This newsgroup primarily covers Red Hat Linux-specific issues.'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'iv


    Introduction


    +   - linux.redhat.install — Pose installation questions to this newsgroup or
    search it to see how others solved problems.

    - linux.redhat.misc — Questions or requests for help that do not really fit into
    traditional categories go here.

    - linux.redhat.rpm — A good place to go if you are having trouble using RPM to
    accomplish particular objectives.


    # 2.1.3. Beginning Linux Books


    +   - Red Hat for Dummies, 2nd Edition by Jon "maddog" Hall; IDG

    - Special Edition Using Red Hat Linux by Alan Simpson, John Ray and Neal Jamison;
    Que

    - Running Linux by Matt Welsh and Karl Kaufman; O''Reilly & Associates

    - Red Hat 8 Unleashed by Bill Bale and Hoyle Duff; Pearson Education


    The books suggested here are excellent primary sources of information for basic
    knowledge about a Red Linux System. For more in-depth information consider the
    various topics discussed throughout this book, many of the chapters list specific
    book titles, usually in an Additional Resources area.


    # 2.2. For the More Experienced


    If you have used other Linux distributions, you probably already have a basic
    grasp of the most frequently used commands. You may have installed your own Linux
    system, and maybe you have downloaded and built software from the Internet. After
    installing Linux, however, configuration issues can be very confusing.


    The Red Hat Linux Customization Guide is designed to help explain the various
    ways a Red Hat Linux system can be configured to meet specific objectives. Use
    this manual to learn about specific configuration options and how to put them
    into effect.


    When you are installing software that is not covered in the Red Hat Linux Customization
    Guide, it is helpful to see what other people in similar circumstances have done.
    HOWTO documents from the Linux Documentation Project, available at http://www.redhat.com/mirrors/LDP/HOWTO/HOWTO-INDEX/howtos.html,
    document particular aspects of Linux, from low-level esoteric changes to using
    Linux for amateur radio station work.


    # 2.3. Documentation for Linux Gurus


    If you are a long-time Red Hat Linux user, you probably already know that to understand
    a particular program is to read its source code and/or configuration files. A
    major advantage of Red Hat Linux is the availability of the source code for everyone
    to read.


    Obviously, not everyone is a programmer, so the source code may not be helpful
    for you. However, if you have the knowledge and skills necessary to read it, the
    source code holds all of the answers.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Introduction


    # 3. Document Conventions


    When you read this manual, you will see that certain words are represented in
    different fonts, types, sizes, and weights. This highlighting is systematic; different
    words are represented in the same style to indicate their inclusion in a specific
    category. The types of words that are represented this way are include the following:


    ```

    command

    ```


    Linux commands (and other operating system commands, when used) are represented
    in this way. This style should indicate to you that you can type the word or phrase
    on the command line and press [Enter] to invoke a command. Sometimes a command
    contains words that would be displayed in a different style on their own (such
    as filenames). In these cases, they are considered to be part of the command,
    so the entire phrase will be displayed as a command. For example:


    Use the `cat own` command to view the contents of a file, named `testfile`, in
    the current working directory.


    ```

    filename

    ```


    Filenames, directory names, paths, and RPM package names are represented in this
    way. This style should indicate that a particular file or directory exists by
    name on your Red Hat Linux system.


    The `.bashrc` in your home directory contains bash shell definitions and aliases
    for your own use.


    The `/etc/fstab` file contains information about different system devices and
    filesystems.


    Install the webalizer RPM if you want to use a Web server log file analysis program.


    # application


    This style indicates that the program is an end-user application (as opposed to
    system software).


    For example:


    Use `Mozilla` to browse the Web.


    # [key]


    A key on the keyboard is shown in this style. For example:


    To use [Tab] completion, type in a character and then press the [Tab] key. Your
    terminal will display the list of files in the directory that starts with that
    letter.


    # [combination]


    A combination of keystrokes is represented in this way. For example:


    The [Ctrl]-[Alt]-[Backspace] key combination will exit your graphical session
    and return you to the login screen or the console.


    # text font on a GUI interface


    A title, word, or phrase on a GUI interface screen or window will be shown in
    this style. When you see text shown in this style, it is being used to identify
    a particular GUI screen or an element on a GUI screen (such as text associated
    with a checkbox or field). Example:


    Select the `Require Password` checkbox if you would like your screensaver to require
    a password before stopping.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Introduction


    # top level of a menu on a GUI screen or window


    When you see a word in this style, it indicates that the word is the top level
    of a pulldown menu. If you click on the word on the GUI screen, the rest of the
    menu should appear. For example:


    Under **File** on a GNOME terminal, you will see the **New Tab** option that allows
    you to open multiple shells in the same window.


    If you need to use a sequence of commands from a GUI menu, they will be shown
    like the following example:


    Go to **Main Menu Button** (on the Panel) => **Programming** => **Emacs** to start
    the **Emacs** editor.


    # button on a GUI screen or window


    This style indicates that the text be found on a clickable button on a GUI screen.
    For example: Click on the **Back** button to return to the webpage you last viewed.


    # computer output


    When you see this in style, it indicates text displayed by the computer on the
    command line. You will see responses to commands you type, error messages, and
    interactive prompts for your input during scripts or programs shown here. For
    example:


    Use the **ls** to display the contents of a directory:


    ```

    $ ls

    Desktop          about.html      logs paulwesterberg.png

    Mail             backfiles mail reports

    ```


    The output returned in response to the command (in this case, the contents of
    the directory) is shown in this style.


    # prompt


    A prompt, is a computer''s way of signifying that it is ready for you to input
    something. For examples:


    ```

    $

    #

    [stephen@maturin step]$

    opard login:

    ```


    # user input


    Text that the user has to type, either on the command line, or into a text box
    on a GUI screen, is displayed in this style. In the following example, **text**
    is displayed in this style:


    To boot your system into the best installation program, you will need to type
    in the **text** command at the **boot:** prompt.


    Additionally, we use several different strategies to draw your attention to certain
    pieces of information. In order of how critical the information is to your system,
    these items will be marked as note, tip, important, caution, or a warning. For
    example:


    # Note


    Remember that Linux is case sensitive. In other words, a rose is not a ROSE is
