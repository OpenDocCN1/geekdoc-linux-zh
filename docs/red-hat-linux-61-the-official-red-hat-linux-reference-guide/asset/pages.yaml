- pgno: 162
  md: '# Chapter 11.


    # Email


    The birth of electronic mail (email) occurred in the early 1960s. The mailbox
    was in a user''s home directory that was readonly by that user. Primitive mail
    applications appended new text messages to the bottom of the file, and the user
    had to wade through the constantly growing file to find any particular message.
    This system was only capable of sending messages to users on the same system.


    This chapter reviews modern email protocols that today evolved into some of the
    most widely used services on the Internet. Red Hat Linux offers many advanced
    applications to serve and receive email.


    # ## 11.1. Email Protocols


    Today, email is delivered using a client/server architecture. An email message
    is created using mail client program. This program sends the message to a server.
    The server then forwards the message to the recipient''s server, where the message
    is supplied to the recipient''s email client.


    To enable this process, a variety of standard network protocols allows different
    machines, often running different operating systems and using different email
    programs, to send and receive email.


    The following protocols are the most commonly used in the transfer of email.


    # ### 11.1.1. Mail Transport Protocols


    Mail delivery from a client application to the server, and from an originating
    server to the destination server is handled by the Simple Mail Transfer Protocol
    (SMTP).


    # #### 11.1.1. SMTP


    The primary purpose of SMTP is to transfer email between mail servers. However,
    it is critical for mail clients as well. To send email, the client sends the message
    to an outgoing mail server, which in turn contacts the destination mail server
    for delivery. For this reason, it is necessary to specify an SMTP server when
    configuring an email client.


    Under Red Hat Linux, you can configure an SMTP server on the local machine to
    handle mail delivery. However, it is also possible to configure remote SMTP servers
    for outgoing mail.


    One point to note about SMTP is that it does not require authentication. This
    allows anyone on the Internet to send email to anyone else or to large groups
    of people. It is this characteristic of SMTP that makes junk email or spam possible.
    Modern SMTP servers attempt to minimize this behavior by allowing only known hosts
    to the SMTP server. The servers that do not impose such restrictions are called
    open relay servers.


    Red Hat Linux uses Sendmail (/usr/sbin/sendmail) as its default SMTP program.
    However, a simpler mail server application called Postfix (/usr/sbin/postfix)
    is also available.


    ![](img/31025704b51d5760c0228ff0f3db98bf_162_0.png)'
  merge: -1
  img_proc: true
- pgno: 163
  md: '148 Chapter 11. Email


    # 11.1.2. Mail Access Protocols


    There are two primary protocols used by email client applications to retrieve
    email from mail servers: the Post Office Protocol (POP) and the Internet Message
    Access Protocol (IMAP).


    Unlike SMTP, both of these protocols require connecting clients to authenticate
    using a username and password. By default, passwords for both protocols are passed
    over the network unencrypted.


    # 11.1.2.1. POP


    The default POP server under Red Linux is `/usr/sbin/ipop3` and is provided by
    the imap package. When using a POP server, email messages are downloaded by email
    client applications. By default, most POP clients are automatically configured
    to delete the message on the email server after it has been successfully transferred,
    this setting usually can be changed.


    POP is fully compatible with important Internet messaging standards, such as Multipurpose
    Mail Extensions (MIME), which allows for email attachments.


    POP works for users who have only one system on which to read email. It also works
    well for users who do not have a persistent connection to the Internet or the
    network containing the mail server. Unfortunately for those with slow network
    connections, POP requires client programs upon authentication to download the
    entire content of each message. This can take a long time if any messages have
    large attachments.


    The most current version of the standard POP protocol is POP3.


    There are, however, a variety of lesser-used POP protocol variants:


    +   - POP — POP3 with MDS authentication. An encoded hash of the user''s password
    is sent from the email client to the server rather sending an unencrypted password.

    - KPOP — POP3 with Kerberos authentication. See Chapter 17 Kerberos for more information.

    - RPOP — POP3 with RPOP authentication. This uses a per-user ID, similar to a
    password, to authenticate POP requests. This ID is not encrypted, so RPOP is no
    more secure than standard POP.


    For added security, it is possible to use Secure Socket Layer (SSL) encryption
    for client authentication and data transfer sessions. This can be enabled by using
    the `/usr/sbin/stunnel` service, Refer to Section 11.5.1 Securing Communication
    for more information.


    # 11.1.2.2. IMAP


    The default IMAP server under Red Linux is `/usr/sbin/imap` and is provided by
    the imap package. When using an IMAP server, email messages remain on the server
    where users can read or delete them. IMAP also allows client applications to create,
    rename, or delete mail directories on the server to organize and store email.


    IMAP is particularly useful for those who access their email using multiple machines.
    The protocol is also convenient for users connecting to the mail server via a
    slow connection, because only the email header is downloaded for messages until
    opened, saving bandwidth. The user also has the ability to delete messages without
    viewing or downloading them.


    For convenience, IMAP client applications are capable of caching copies of messages
    locally, so the user can browse previously read messages when not directly connected
    to the IMAP server.


    IMAP, like POP, is fully compatible with important Internet messaging standards,
    such as MIME, which allows for email attachments.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# Chapter 11. Email


    For added security, it is possible to use SSL encryption for client authentication
    and data transfer sessions. This can be enabled by using the imaps service, or
    by using the /usr/sbin/stunnel program. Refer to Section 11.5.1 Securing Communication
    for more information.


    Other free, as well, IMAP clients and servers are available, many of which extend
    the IMAP protocol and provide additional functionality. A comprehensive list can
    be found online at http://www.imap.org/products/longlist.htm.


    # 11.2. Email Program Classifications


    In general, all email applications fall into at least one of three classifications.
    Each classification plays a specific role in the process of moving and managing
    emails. Most users are aware of the specific email program they use to receive
    and send messages, each one is important for ensuring that mail arrives at the
    correct destination.


    # 11.2.1. Mail Transfer Agent


    A Mail Transfer Agent (MTA) transfers emails between hosts using SMTP. A message
    may involve several MTAs as it moves to its intended destination.


    While the delivery between machines may seem rather straightforward, the process
    of deciding which particular MTA can or accept a message for delivery is quite
    complicated. In addition, due to problems from spam, the use of a particular MTA
    is usually restricted by the MTA''s configuration or by the lack of access to
    the MTA''s network.


    Many modern email clients can act as an MTA when sending mail. However, this action
    should not be confused with the role of a true MTA. The reason email client programs
    are capable of sending out email (like an MTA) is the host running the application
    does not have its own MTA. This is particularly true for email programs on non-Unix/based
    operating systems. However, these client programs only send outbound messages
    to MTAs they are authorized to use and do not directly deliver the message to
    the recipient''s email server.


    Since Red Hat Linux includes two MTAs, Sendmail and Postfix, email client programs
    are often required to act as an MTA. Red Hat Linux also includes a special purpose
    called Fetchmail. For information on Sendmail and Fetchmail, refer to Section
    11.3 Mail Transport Agents.


    # 11.2.2. Mail Delivery Agent


    A Mail Delivery Agent (MDA) is invoked by the MTA to file incoming email in the
    user''s mailbox. In many cases, the MDA is actually a Local Delivery Agent (LDA),
    such as mail or Procmail.


    Any program that actually handles a message for delivery to the point where it
    can be read by an email client can be considered an MDA. For this reason, some
    MTAs (such as Sendmail and Postfix) can fill the role of an MDA when they append
    new email messages to a local user''s mail spool file. In general, MDAs do not
    transport messages between systems nor do they provide a user access; MDAs distribute
    and sort messages on the local machine for an email client application to access.


    # 11.2.3. Mail User Agent


    A Mail User Agent (MUA) is synonymous with an email client application. An MUA
    is a program that, at the very least, allows a user to read and compose email
    messages. Many MUAs are capable'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# 150


    # Chapter 11. Email


    of retrieving messages via the POP or IMAP protocols, setting up mailboxes to
    store messages, and sending outbound messages to MTA.


    MUAs may be graphical, such as Mozilla Mail, or have a very simple, text-based
    interface, such as mutt or pine.


    # 11.3. Mail Transport Agents


    Red Linux includes two primary MTAs, Sendmail and Postfix. Sendmail is configured
    as the default MTA, although it is easy to switch the default MTA to Postfix.


    > Tip

    For information about how to switch the default MTA from Sendmail to Postfix,
    see the chapter called Mail Transport Agent (MTA) Configuration in the Red Linux
    Customization Guide.


    Red Linux also includes a special MTA called Fetchmail, which is used to deliver
    email from a remote MTA to a local MTA.


    This section details Sendmail and Fetchmail.


    # 11.3.1. Sendmail


    Sendmail''s core purpose, like other MTAs, is to transfer email among hosts, usually
    using the SMTP protocol. However, Sendmail is highly configurable, allowing control
    over almost every aspect of how email is handled, using the protocol. Many system
    administrators elect to use Sendmail as their MTA due to its power and scalability.


    # 11.3.1.1. Purpose and Limitations


    It is important to be aware of what Sendmail is and what it can do as opposed
    to what is not. In days of monolithic applications that fulfill multiple roles,
    Technically, this is true, as Sendmail can mail to users'' directory and deliver
    inbound mailers. However, most users actually want much more than simple email
    delivery. They want to interact with their email through an MUA, that can POP
    or IMAP to download their messages to their local machine. Or, they may prefer
    a Web interface to gain access to their mail. These applications can work in conjunction
    with Sendmail, but they operate separately from one another.


    It is beyond the scope of this section to get into all that Sendmail should or
    be configured to. With hundreds of different options and rule sets, volumes have
    been dedicated to explaining everything that can be done and how to fix things
    that go wrong. Refer to the Section 11.6 Additional Resources for a list of Sendmail
    resources.


    This section reviews the files installed with Sendmail by default and reviews
    basic configuration changes, including how to stop unwanted email (spam) and how
    to extend Sendmail with the Lightweight Directory Access Protocol (LDAP).


    # 11.3.1.2. The Default Sendmail Installation


    The Sendmail executable is /usr/sbin/sendmail.


    Sendmail''s lengthy and detailed configuration file is /etc/mail/sendmail.cf.
    Avoiding editing the sendmail.cf file directly. Instead, to make configuration
    changes to Sendmail, edit the'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Chapter 11. Email


    /etc/mail/sendmail.mc, back up the original /etc/mail/sendmail.cf, and then use
    the included m4 macro processor to create a new /etc/mail/sendmail.cf. More information
    on configuring Sendmail can be found in Section 11.3.1.3 Common Sendmail Configuration
    Changes. Various Sendmail configuration files are installed in the /etc/mail/
    directory including:


    +   - access — Specifies systems that use Sendmail for outbound mail.

    - domatable — Specifies domain name mapping.

    - local-host-names — Specifies aliases for the host.

    - mailertable — Specifies instructions that override routing for particular domains.

    - virtertable — Specifies a domain-specific format of aliasing, allowing multiple
    virtual domains to be hosted on one machine.


    Several of the configuration files in /etc/mail/, as access, domatable, mailertable
    and virtertable, actually store their information in database files before Sendmail
    can use any changes. To include any changes made to these database files, run
    the command:


    ```

    makemap hash /etc/mail/<name> < /etc/mail/<name>

    ```


    Where <name> is replaced with the name of the configuration file to convert.

    For example, to have all addresses addressed to the example.com domain delivered
    to <bob@other-example.com>, add the following line to the virtertable file:


    ```

    @example.com bob@other-example.com

    ```


    To finalize the change, the virtertable.db file must be updated using the following
    command as root:


    ```

    makemap hash /etc/mail/virtertable < /etc/mail/virtertable

    ```


    This creates a new virtertable.db file containing the new configuration.


    # 11.3.1.3. Common Sendmail Configuration Changes


    When altering the Sendmail configuration file, it is best to generate an entirely
    new /etc/mail/sendmail.cf instead of editing an existing one.


    ![](img/31025704b51d5760c0228ff0f3db98bf_166_0.png)


    Caution


    Before changing the sendmail.cf file, it is a good idea to backup a working version
    of the file.


    To add the desired functionality to Sendmail, edit the /etc/mail/sendmail.mc file.
    When finished, use the m4 macro processor to generate a new sendmail.cf by executing
    the m4 /etc/mail/sendmail.mc > /etc/mail/sendmail.cf command. After creating a
    new /etc/mail/sendmail.cf file, restart Sendmail to make it take effect. The easiest
    way to do this is to type the /sbin/service sendmail restart as command root.


    By default, the m4 macro processor is installed with Sendmail but is part of the
    m4 package.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# 152


    # Chapter 11. Email


    # Important


    The default sendmail.cf file does not allow Sendmail to accept network connections
    from any other host than the local computer. Configure Sendmail as a server for
    other clients, edit /etc/sendmail.cf and change DAEMON_OPTIONS to listen on network
    devices or comment out this option if needed. Then regenerate /etc/mail/sendmail.cf
    by running:


    ```

    m4 /etc/mail/sendmail.mc > /etc/mail/sendmail.cf

    ```


    This configuration will work for most SMTP-only sites. It will not work for UUCP
    (UNIX to UNIX Copy); you must generate a new sendmail.cf if using UUCP mail transfers.


    Consult the /usr/share/sendmail-cf/README file before editing any files in the
    directories under the /usr/share/sendmail-cf directory, as they can affect the
    future configuration of /etc/mail/sendmail.cf files.


    # 11.3.1.4. Masquerading


    One common Sendmail configuration is to have a single machine as a mail gateway
    for all machines on the network. For instance, a company may want to have a mail
    called mail.bigcorp.com that handles all of their email and assigns a return address
    to all going mail.


    In this situation, the Sendmail server must masquerade the machine names on the
    company network so their return address is user@bigcorp.com instead of devel@bigcorp.com.


    To do this, add the following lines to /etc/mail/sendmail.mc:


    ```

    FEATURE(always_addr_domain) dnl

    FEATURE(''masquerade_entire_domain'')

    FEATURE(''masquerade_envelope'')

    FEATURE(''masquerade'')

    MASQUERADE_AS(''bigcorp.com.'')

    MASQUERADE_DOMAIN(''bigcorp.com.'')

    MASQUERADE_AS (bigcorp)

    ```


    After generating a new sendmail.cf using m4, this configuration will make all
    mail from inside the network appear as if it were sent from bigcorp.com.


    # 11.3.1.5 Stopping Spam


    Email spam can be defined as unwanted and unwanted email received by a user who
    never requested the communication. It is a disruptive, costly, and widespread
    abuse of Internet communication standards.


    Sendmail makes it relatively to block new spamming techniques by sending junk
    email. It blocks many of the user spamming methods by default.


    For example, forwarding of SMTP messages, also called relay, has been disabled
    by default since Sendmail 8.9. Before this change, Sendmail would relay the mail
