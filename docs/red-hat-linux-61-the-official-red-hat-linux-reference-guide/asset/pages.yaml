    # 13.8. Upgrading to OpenLDAP Version 2.0


    In OpenLDAP Version 2.0, the on-disk storage format used by the `ldap` LDAP server
    has changed. If you are upgrading LDAP from Red Linux 7.0 or earlier, you will
    need to extract the directory command to import this change into an LDIF file
    using the following:


    ```

    ldbmcat -n > <ldif_file>

    ```


    In the above command, change `<ldif_file>` to the name of the output file. Next
    type the following command to import this file into OpenLDAP 2.0:


    ```

    slappadd -l <ldif_file>

    ```


    > Important

    You be the root user to use `/usr/sbin/slappadd`. However, the directory server
    runs as the `ldap` user. Therefore the directory server will not be able to modify
    any files created by `slappadd`. To correct this issue, after you finished using
    `slappadd`, type the following command:


    ```

    chown -R ldap /var/lib/ldap

    ```


