    Use of the backslash prevents failure of the rule due to length.


    # Warning


    If the last line of a hosts access file is not a newline character (created by
    pressing the [Enter] key), the last line in the file will fail and an error will
    be logged to either /var/log/messages or /var/log/secure. This is also true for
    a rule that span multiple lines without using the backslash. Following example
