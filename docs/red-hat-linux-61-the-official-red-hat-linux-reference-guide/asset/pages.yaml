    ```

    Filename        Type        Size      Used      Priority

    /dev/hda6      partition  136512    20024   -1

    ```


    While some of this information can be found in other files in the `/proc/` directory,
    /proc/swap provides a snapshot of every swap file, the type of swap space, the
    total size, and the amount of this space that is in use (in kilobytes). The priority
    column is useful when multiple swap files are in use. The lower the priority,
    the more likely the swap file is to be used.


    # 5.2.29. /proc/uptime


    This file contains information detailing how long the system has been on since
    its last restart. The output of `/proc/uptime` is quite minimal:


    ```

    350735.47 234388.90

    ```


    The first number is the total number of seconds the system has been up. The second
    number is how much of time the machine has spent idle, in seconds.


    # 5.2.30. /proc/version


    This file specifies the version of the Linux kernel and `gcc` in use, as well
    as the version of Red Hat installed on the system:


    ```

    Linux version 2.4.20-0.40 (user@foo.redhat.com) (gcc version 3.2.1 20021125

    (Red Hat Linux 8.0 3.2.1-1)) #1 Tue Dec 3 20:50:18 EST 2002

    ```


    This information is used for a variety of purposes, including the version data
    presented when a user logs in.


    # 5.3. Directories in /proc/


    Common groups of information concerning the kernel are grouped into directories
    and subdirectories within the `/proc/` directory.


    # 5.3.1. Process Directories


    Every `/proc/` contains a number of directories with numerical names. A listing
    of the may begin things like this:


    ```

    dr-xr-xr-x 3 root root      0 Feb 13 01:28 1

    dr-xr-xr-x 3 root root      0 Feb 13 01:28 1010

    dr-xr-xr-x 3 xfs xfs        0 Feb 13 01:28 1087

    dr-xr-xr-x 3 daemon daemon  0 Feb 13 01:28 1123

    dr-xr-xr-x 3 root root      0 Feb 13 01:28 11307

    ```'
