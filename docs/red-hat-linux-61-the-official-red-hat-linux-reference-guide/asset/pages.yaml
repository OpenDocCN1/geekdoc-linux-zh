    \n}\n```\n\nReplace <font-specification> with a font specification in the style\
    \ used by traditional X applications, such as -adobe-helvetica-medium-r-normal-*-120-*-*-*.\
    \ A full list of core fonts can be obtained by running xfonts or created interactively\
    \ using xfont\n\n# 7.4.1.1. Adding Fonts to Fontconfig\n\nAdding new fonts to\
    \ the Fontconfig subsystem is a straightforward process.\n\n+   1. To add fonts\
    \ systemwide, copy the new fonts into the /usr/share/fonts/local/ directory.\n\
    \   To add for an individual user, copy the new fonts into the .fonts/ directory\
    \ in the user's home directory.\n2. Use the fc-cache command to update the font\
    \ information cache, as in the following example:\nfc-cache <path-to-font-directory>\n\
    \   In this command, replace <path-to-font-directory> with the directory containing\
    \ the new fonts (either /usr/share/fonts/local/ or ~/.fonts/).\n\nTip\n\nIndividual\
    \ users may also install fonts graphically, by browsing to fonts:/// in Nautilus,\
    \ and dragging the new font files there.\n\nImportant\n\nIf the font filename\
    \ ends with a .gz extension, it is compressed and cannot be used untilcompressed.\
    \ To do this, use the gunzip command or double-click the file and drag the font\
    \ to a directory in Nautilus."
