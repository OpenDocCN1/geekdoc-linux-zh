- pgno: 138
  md: '# Chapter 10. Apache HTTP Server 123


    # 10.2.4.3. The mod_include Module


    The mod_include module is now implemented as a filter and is therefore enabled
    differently. Refer to Section 10.2.4 Modules and Apache HTTP Server 2.0 for more
    filters.


    For example, the following is a sample Apache HTTP Server 1.3 directive:


    ```

    AddType text/html .html

    AddHandler server-parsed .html

    ```


    To migrate this setting to Apache HTTP Server 2.0, use the following structure:


    ```

    AddType text/html .html

    AddOutputFilter INCLUDES .html

    ```


    Note that just as before, the Options +Includes directive is still required for
    the <Directory> container or in a .htaccess file.


    For more on this topic, refer to the following documentation on the Apache Software
    Foundation''s website:


    +   - httpd.apache.org/docs-2.0/mod/mod_include.html


    # 10.2.4.4. The mod_auth_db and mod_auth_dbm Modules


    Apache HTTP Server 1.3 supported two authentication modules, mod_auth_db and mod_auth_dbm
    which Berkeley Databases and DBM databases have been combined into a single module
    mod_auth_db in Apache HTTP Server 2.0, which can access several different formats.
    To migrate from mod_auth_db, configuration files should be adjusted by replacing
    AuthDBFile and AuthDBGroupFile with the mod_auth_db equivalents: AuthDBUserFile
    and AuthDBThreadGroup. Also, the directive AuthDBType must be added to indicate
    the type of database file.


    The following example shows a sample mod_auth_db configuration for Apache HTTP
    Server 1.3:


    ```

    <Location /private/

    AuthType Basic

    AuthName "My Private Files"

    AuthDBUserFile /var/authdb

    require valid-user

    </Location>

    ```


    To migrate to version 2.0 of Apache HTTP Server, use the following structure:


    ```

    <Location /private/

    AuthType Basic

    AuthName "My Private Files"

    AuthDBUserFile /var/www/authdb

    AuthDBType DB

    require valid-user

    </Location>

    ```


    Note that the AuthDBUserFile directive can be used in .htaccess files.

    The dbmmange script, used to manage username and password databases, has been
    replaced by htdbm in Apache HTTP Server 2.0. The htdbm program offers equivalent
    functionality and like mod_auth_dbm can operate a variety of database formats;
    the -T option can be used on the command line to specify the format to use.


    Table 10-1 shows how to migrate from a DBM-format database to htdbm format using
    dbmmange.'
  merge: -1
  img_proc: true
- pgno: 139
  md: "124\n\nChapter 10. Apache HTTP Server\n\n| Action | dbmmanage command (1.3)\
    \ | Equivalent httpdb command (2.0) |\n|---|---|--|\n| Add user to database (using\
    \ given password) | dbmmanage authdb username password | httpdb -b -TDB authdb\
    \ username |\n| Add user to database (prompts for password) | dbmmanage authdb\
    \ addduser username | httpdb -TDB authdb username |\n| Remove user from database\
    \ | dbmmanage authdb delete username | httpdb -x -TDB authdb username |\n| List\
    \ users in database | dbmmanage authdb view | httpdb -l -TDB authdb |\n| Verify\
    \ a password | dbmmanage authdb check username | httpdb -v -TDB authdb username\
    \ |\n\nTable 10-1. Migrating from dbmmanage to httpdb\n\nThe -m and -s options\
    \ work with both dbmmanage and httpdb, enabling the use of the MD5 and SHA1 algorithms\
    \ for hashing passwords, respectively.\n\nWhen creating a new database with httpdb,\
    \ the -c option must be used.\nFor this topic, refer to the following documentation\
    \ on the Apache Software Foundation's website:\n\n+   - http://httpd.apache.org/docs-2.0/mod/mod_auth_dbm.html\n\
    \n# 10.2.4.5. The mod_perl Module\n\nThe configuration for mod_perl has been moved\
    \ from httpd.conf into the file /etc/httpd/conf.d/mod_perl.conf. For this file\
    \ to be loaded, and hence mod_perl to work, the statement Include conf.d/* must\
    \ be included in the httpd.conf as described in Section 10.2.1.3 Dynamic Shared\
    \ Object (DSO) Support.\nOccurrences of Apache: in the httpd.conf must be replaced\
    \ with ModPerl:: Additionally, the manner in which handlers are registered has\
    \ been changed.\nThis is a sample Apache HTTP Server 1.3 mod_perl configuration:\n\
    \n```\n<Directory /var/www/perl>\n  SetHandler perl-script\n  PerlHandler Apache::Registry\n\
    \  Options +ExecCGI\n</Directory>\n```\n\nThis is the equivalent mod_perl for\
    \ Apache HTTP Server 2.0:\n\n```\n<Directory /var/www/perl>\n  SetHandler perl-script\n\
    \  PerlModule ModPerl::Registry\n  PerlHandler ModPerl::Registry::handler\n  Options\
    \ +ExecCGI\n</Directory>\n```\n\nMost modules for mod_perl 1.x should work without\
    \ modification with mod_perl 2.x. XS modules require recompilation and possibly\
    \ require minor Makefile modifications."
