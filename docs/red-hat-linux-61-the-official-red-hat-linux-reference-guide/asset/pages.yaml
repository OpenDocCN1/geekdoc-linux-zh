  md: '# Chapter 13. Lightweight Directory Access Protocol (LDAP)


    You will be prompted to type and re-type a password, the program prints the resulting
    encrypted password to the terminal.


    Next, copy the newly created password into the /etc/openldap/slapd.conf on one
    of the rootpw lines and remove the hash (#).


    When finished, the line should look similar to the following example:


    ```

    rootpw {SSH}vv2y+i6V6esasazIv70SSnNAJE18bb2u

    ```


    # Warning


    LDAP passwords, including the rootpw directive in /etc/openldap/slapd.conf, are
    sent over the network in unencrypted, unless you enable TLS encryption.


    To enable TLS encryption review the comments in /etc/openldap/slapd.conf and see
    the man page for slapd.conf.


    For added security, the rootpw directive should be commented out after populating
    the LDAP directory by replacing it with a hash (#).


    When using the /usr/sbin/slappadd command line tool locally to populate the LDAP
    directory, use of the rootpw directive is not necessary.


    # Important


    You must be the root user to use /usr/sbin/slappadd. However, the directory server
    runs as the ldap user. Therefore the directory server will not be able to modify
    any files created by slappadd. To correct this issue, after you have finished
    using slapp, type the following command:


    ```

    chown -R ldap /var/lib/ldap

    ```


    # 13.7. Configuring Your System to Authenticate Using OpenLDAP


    This section provides a brief overview of how to configure a Red Linux system
    to authenticate using OpenLDAP. Unless you are an OpenLDAP expert, you probably
    need more documentation than is provided here. Please refer to the references
    provided in Section 13.9 Additional Resources for more information.


    Install the Necessary LDAP Package


    First, you should make sure the appropriate packages are installed on both the
    LDAP server and the LDAP client machines. The LDAP server needs the openldap-servers
    package.


    The openldap,openldap-clients, and nss_ldap packages need to be installed on all
    LDAP client machines.'
