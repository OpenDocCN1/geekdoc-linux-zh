  md: '# Chapter 2. Boot Loaders


    +   - other=/dev/hdal — Specifies the partition containing DOS.


    # 2.10. Changing Runlevels at Boot Time


    Under Red Linux, it is possible to change the default runlevel at boot time.

    If using LILO, use the boot: prompt by typing [Ctrl]-[X]. Then type:


    ```

    linux <runlevel-number>

    ```


    In this command, replace <runlevel-number> with either of the runlevel to boot
    into (1 through 5), or the words single or emergency.

    If using GRUB, follow these steps:


    +   - In the graphical GRUB boot loader screen, select the Red Linux boot label
    and press [e] to edit it.

    - Arrow to the prompt, type the number of the runlevel you wish to boot into (1
    through 5), or the words single or emergency.

    - You will be returned to the GRUB screen with the kernel information. Press the
    [b] key to boot the system.


    For more information about runlevels, see Section 1.4.1 Runlevels.


    # 2.11. Additional Resources


    This chapter is only intended as an introduction to GRUB and LILO. Consult the
    following resources to discover more about how GRUB and LILO work.


    # 2.11.1. Installed Documentation


