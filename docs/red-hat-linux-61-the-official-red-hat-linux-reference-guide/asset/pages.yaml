- pgno: 224
  md: '# Chapter 15. TCP Wrappers and xinetet


    ALL : .example.com


    +   * IP address ending with a period (.) — Placing a period at the end of an
    IP address matches all hosts sharing the initial numeric group of an IP address.
    The following example would apply to any host within the `192.168.x.x` network:

    ALL : `192.168.`

    * IP address/netmask pair — Netmask expressions can also be used as a pattern
    to control access to a particular group of IP addresses. The following example
    would apply to any host with an address of `192.168.0.0` through `192.168.1.255:`

    ALL : `192.`

    * The asterisk (*) — Asterisks can be used to match groups of hostnames or IP
    addresses, as long as they are not mixed in a client list containing other types
    of patterns. The following example would apply to any host within the `example.com`
    domain:

    ALL * : `example.com

    * The slash (/) — If a client begins with a slash, it is treated as a file. This
    is useful if rules specifying large numbers of hosts are necessary. The following
    example refers TCP wrappers to the `/etc/telnet.hosts` file for Telnet connections:

    in.telnet : `/etc/telnet.hosts`


    Other used lists are also accepted by TCP wrappers. The sees access man 5 page
    for information.


    > Warning

    Be careful when creating rules requiring name resolution, as hostnames and domain
    names. Attackers can easily circumvent name resolution. In addition, any disruption
    in DNS service would prevent even authorized users from using network services.
    It is best to use IP addresses whenever possible.


    # 15.2.1.3. Operators


    At present, access control rules accept one operator, EXCEPT. It can be used in
    both the daemon list and the client list of a rule.

    EXCEPT operator allows specific exceptions to broader matches within the same
    rule.

    In the following example from a `hosts.allow` file, all `example.com` hosts are
    allowed to connect to all services except `cracker.example.com`:


    ALL: .example.com EXCEPT cracker.example.com


    In the another example from a `hosts.allow` file, clients from the `192.168.0.x`
    network can use all services except for FTP:


    ALL EXCEPT vsftpd: 192.168.0.0.


    > Note

    Organizationally, it is often easier to use EXCEPT operators sparsely, placing
    the exceptions to a rule in the other access control file. This allows other administrators
    to quickly scan the appropriate file'
  merge: -1
