- pgno: 268
  md: '# Chapter 19. Tripwire


    /usr/sbin/tripwire --update --twrfile /var/lib/tripwire/report/<name>.twr


    Tripwire will display the report file using the default text editor specified
    on the EDITOR line of the Tripwire configuration file. This gives you an opportunity
    to deselect files you do not wish to update in the Tripwire database.


    > Important

    it is important that you change only authorized integrity violations in the database.


    All proposed updates to the Tripwire database start with an [x] before the file
    name, similar to the following example:


    +   Added:

    [x] "/usr/sbin/longrun"


    Modified:

    [x] "/usr/sbin"

    [x] "/usr/sbin/cpqarray


    If you want to specifically exclude a valid violation from being added to the
    Tripwire database, remove the x.


    To edit the file editor, vi type i and press [Enter] to enter insert mode and
    make any necessary changes. When finished, press the [Esc] key: :wq, and press
    [Enter].


    After the editor closes, your local password and the database will be rebuilt
    and signed.


    After a new Tripwire database is written, the newly authored integrity violations
    will no longer show as warnings.


    # 19.8. Updating the Tripwire Policy File


    If you want to change the Tripwire files in its database, change element configuration,
    or modify the severity at certain violations are reported, you need to edit your
    Tripwire policy file.


    First, make whatever changes are necessary to the sample policy file /etc/tripwire/twpol.txt.
    If you delete this file (as you should when you have finished configuring Tripwire),
    you can re-generate it by using the following command:


    ```

    twadmin --printpolfile > /etc/tripwire/twpol.txt

    ```


    A common change to this policy file is to comment out all files that do not exist
    on your system so that if your system does not have /etc/smb.conf file, you can
    tell Tripwire not to look for it by commenting out its line in twpol.txt with
    the # character as in the following example:


    ```

    # /etc/smb.conf --= $(SEC_CONFIG);

    ```


    Next, you must generate a new, signed /etc/tripwire/tw.pol file and generate an
    updated database file based on this policy information. Assuming /etc/tripwire/twpol.txt
    is the edited policy file, use this command:


    ```

    /usr/sbin/twadmin --create-polfile -S site.key /etc/tripwire/twpol.txt

    ```


    You will be asked for the password. Then, the twpol.txt file will be encrypted
    and signed.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# Chapter 19. Tripwire


    It is important that you update the Tripwire database after creating a new /etc/tripwire/tw.policy
    file. The most reliable way to accomplish this is to delete your current Tripwire
    database and create a new database using the new policy file.


    If your Tripwire file is named bob.domain.com.twd, type this command:


    ```

    rm /var/lib/tripwire/bob.domain.com.twd

    ```


    Then type the following command to create a new database using the updated policy
    file:


    ```

    /sbin/tripwire --init

    ```


    To make sure the database was correctly created, run the first integrity check
    manually and view the contents of the resulting report. See Section 19.5 Running
    an Integrity Check and Section 19.6.1 Tripwire Reports for more on doing these
    tasks.


    # 19.8.1. Tripwire and Email


    You can configure Tripwire to send an email to one or more accounts if a specific
    type of policy is violated. In order to do this, you need to figure out what policy
    rules should be monitored and who should get the email when those rules are broken.
    On large systems with multiple administrators, you may have different sets of
    people depending on the types of violations.


    Once you have determined what and when policy rules to report to them, edit the
    /etc/tripwire/twpol.txt file, adding an emailto= line to the rule directive for
    each appropriate rule. Do this by adding a comma after the severity* line and
    putting emailto= on the next line, followed by one or more email addresses. More
    than one email address can be specified if the addresses are separated by a semi-colon.


    For example, if two administrators, Johray and Bob, need to be notified when a
    networking program is modified, change the Network Programs rule in the policy
    file to look like this:


    ```

    rulename = "Network Programs",nseverity = $SIG_HI,

    emailto = Johray@domain.com;bob@domain.com

    ```


    After changing the policy, follow the instructions in Section 19.8 Updating the
    Tripwire Policy File to generate an updated, encrypted, and signed copy of the
    Tripwire file.


    # 19.8.1.1. Sending Test Email Messages


    To test Tripwire''s email notification, use the following command:


    ```

    /sbin/tripwire --test --email@email.address

    ```


    A test email will immediately be sent to the email address by the tripwire program.


    # 19.9. Updating the Tripwire Configuration File


    If you want to change Tripwire''s configuration file, you should first edit the
    sample configuration file /etc/tripwire/twcfg.txt. If you deleted this file (as
    you should whenever you finished configuring Tripwire), you can regenerate it
    by issuing the following command:


    ```

    twadmin --print-cfgfile /etc/tripwire/twcfg.txt

    ```'
  merge: -1
  img_proc: true
