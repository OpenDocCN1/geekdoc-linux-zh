    # A.4.1. Using Multiple Ethernet Cards


    You can use multiple Ethernet cards in one machine. If each card uses a different
    driver (for example, a 3c509 and a DE425, add alias (and possibly options) lines
    for each card to /etc/modules.conf. Refer to the chapter titled Kernel Modules
    in the Red Hat Linux Customization Guide for more information.


    If two Ethernet cards use the same driver (such as two 3c509 cards or a 3c595
    and a 3c905), either give the two card addresses on the driver''s options line
    (for ISA cards) or simply add one alias line for each card (for PCI cards).


    For additional information about more than one Ethernet card, see the Linux Ethernet-HOWTO
    at http://www.redhat.com/mirrors/LDP/HOWTO/Ethernet-HOWTO.html.'
