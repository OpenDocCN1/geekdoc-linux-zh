- pgno: 220
  md: '# Chapter 15.

    TCP Wrappers and xinetd


    Controlling access to network services is one of the most important security tasks
    facing a server administrator. Fortunately, under Red Hat Linux there are a number
    of tools which do just that. For instance, an iptables-based firewall filters
    out network packets within the kernel''s workload. For network services that utilize
    it, TCP wrappers add an additional layer of protection by defining which hosts
    are allowed or not to connect to "wrapped" network services. One such wrapped
    network service is the xinetd super server. This service is called a super server
    because it controls connections to a subset of network services and further refines
    access control.


    Figure 15-1 is a basic illustration of how these tools work together to protect
    network services.


    ![](img/31025704b51d5760c0228ff0f3db98bf_220_0.png)


    Figure 15-1. Access Control to Network Services


    This chapter focuses on the role of TCP wrappers and xinetd in controlling access
    to network services and reviews how these tools can be used to enhance both logging
    and utilization management. For a discussion of firewalling with iptables, see
    Chapter 16 iptables.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# 15.1. TCP Wrappers


    The TCP wrappers package (tcp_wrappers) is installed by default under Red Hat
    Linux and provides host-based access control to network services. The most important
    component within the package is /usr/lib/libwrap.a library. In general terms,
    a TCP wrapped service is one that has been compiled against libwrap.a.


    When a connection attempt is made to a TCP wrapped service, the service first
    checks the hosts access files (/etc/hosts.allow and /etc/hosts.deny) to determine
    whether the client host is allowed to connect. If it uses the syslog daemon (syslog)
    to write the name of the requesting host and the requested service to /var/log/secure
    or /var/log/messages.


    If a client is allowed to connect, TCP wrappers release control of the connection
    to the requested service and do not interfere with communication between the client
    host and the server.


    In addition to control and logging, TCP wrappers can activate modes to interact
    with the client before denying or releasing control of connection to the requested
    network service.


    Because TCP wrappers are a valuable addition to any server administrator''s arsenal
    of security tools, most network services within Red Hat Linux are linked against
    the libwrap.a library. Some applications include /usr/sbin/sshd, /usr/sbin/sendmail,
    and /usr/sbin/xinetd.


    > Note


    To determine if a network service uses libwrap.a, type the following command as
    the root user:


    ```

    strings -f <binary-name> | grep hosts_access

    ```


    Replacing <binary-name> with the name of the network service binary.


    # 15.1.1. Advantages of TCP Wrappers


    TCP wrappers provide the following advantages over other network service techniques:


    +   - Transparency to both the client host and the wrapped network service. —
    Both the connecting client and the wrapped network service are unaware that TCP
    wrappers are in use. Legitimate users are logged and connected to the requested
    service while banned client fails.

    - Centralized management of multiple protocols. — TCP wrappers operate separately
    from the network services they protect, allowing many server applications to share
    a common set of configuration files for simpler management.


    # 15.2. TCP Wrappers Configuration Files


    +   - /etc/hosts.allow


    +   - /etc/hosts.deny


    When a client request is received by a TCP wrapped service, it takes the following
    basic steps:'
  merge: -1
  img_proc: true
- pgno: 222
  md: "# Chapter 15. TCP Wrappers and xinetd\n\nThe service references /etc/hosts.allow\
    \ The TCP wrapped service sequentially parses the /etc/hosts.allow file and applies\
    \ the first rule specified for that service. If it finds a matching rule, it allows\
    \ the connection. If not, it moves to step 2.\n\nThe service references /etc/hosts.deny\
    \ The TCP wrapped service sequentially parses the /etc/hosts.deny file. If it\
    \ finds a matching rule it denies the connection. If not, access to the service\
    \ is granted.\n\nThe following are important points to consider when using TCP\
    \ wrappers to protect network:\n\n+   * Because rules in hosts.allow are applied\
    \ first, they take precedence over rules specified in hosts.deny; if access to\
    \ a service is allowed in hosts.allow, a rule denying access to that same service\
    \ in hosts.deny is ignored.\n* Since the rules in each file are read from the\
    \ top and the first matching rule for a given service is the only one used, the\
    \ order of the rules is extremely important.\n* If no rules for the service are\
    \ found in either file, or if neither exists, access to the service is granted.\n\
    * TCP wrappers do not cache the rules from the access files, so any changes to\
    \ hosts.allow or hosts.deny take effect immediately without restarting network\
    \ services.\n\n# 15.2.1. Formatting Access Rules\n\nThe format for /etc/hosts.allow\
    \ and /etc/hosts.deny are identical. Any blank lines or lines that start with\
    \ a hash mark (#) are ignored, and each rule must be on its own line Each rule\
    \ uses the basic format to control access to network services:\n\n```\n<daemon\
    \ list> : <client list> [: <option>: <option>: ...]\n```\n\n+   * <daemon list>\
    \ A comma separated list of process names (not service names) or the ALL wildcard\
    \ (see Section 15.2.1.1 Wildcards). The daemon also accepts operators listed in\
    \ Section 15.2.1.3 Operators to allow greater flexibility.\n* <client list> A\
    \ comma separated list of hostnames, host IP addresses, special patterns (see\
    \ Section 15.2.1.2 Patterns), or wildcards (see Section 15.2.1.1 Wildcards) which\
    \ identify the hosts by the rule. The client list also accepts operators listed\
    \ in 15.2.1.3\n* <option> An optional action or colon separated list of actions\
    \ performed when the rule is triggered. Option fields support expansions (see\
    \ Section 15.2.3.4 Expansions), launch shell commands, allow deny or access, and\
    \ after logging behavior (Section 15.2.3 Option Fields).\n\nThe following is a\
    \ sample hosts access rule:\n\n```\nvsftpd .example.com\n```\n\nThis rule instructs\
    \ TCP wrappers to wrap for connections to the FTP daemon (vsftpd) from any host\
    \ if this rule appears in the example.com domain. If this rule appears in hosts.allow,\
    \ the connection will be accepted. If this rule appears in hosts.deny, the connection\
    \ will be rejected.\n\nThe next sample hosts access rule is more complex and has\
    \ two options:\n\n```\nsshd .example.com \\\\ \n: spawn /bin/echo '/bin/date'\
    \ access denied>>/var/log/sshd.log \\\\ \n: deny\n```"
  merge: -1
