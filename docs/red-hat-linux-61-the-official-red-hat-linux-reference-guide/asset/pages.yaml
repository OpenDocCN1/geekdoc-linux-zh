- pgno: 204
  md: '# Chapter 13. Lightweight Directory Access Protocol (LDAP)


    +   - /etc/openldap/ldap.conf — This is the configuration file for all client
    applications which use the OpenLDAP libraries such as ldsearch, ldapd, Sendmail,
    Pine, Balsa, Evolution, and Gnome Meeting.

    - /etc/openldap/slapd.conf — This is the configuration file for the slapd daemon.
    See Section 13.6 Editing / /etc/openldap/slapd.conf for more information about
    this file.

    - /etc/openldap/schema/ — This subdirectory contains the schema used by the slapd
    daemon. See Section 13.5 The /etc/openldap/schema/ Directory for more information
    about this directory.


    > Note

    If the nss_ldap package is installed, it will create a file named /etc/ldap.conf.
    This file is used by the PAM and NSS modules supplied by the nss_ldap package.
    See Section 13.7 Configuring Your System to Authenticate Using OpenLDAP for more
    information about this configuration.


    # 13.5. The /etc/openldap/schema/ Directory


    The /etc/openldap/schema/ holds LDAP definitions, previously located in the slapd.at
    and slapd.conf files. All attribute syntax definitions and objectclass definitions
    are now located in the different schema files. The various schema files are referenced
    in /etc/openldap/schema.conf using include lines, as shown in this example:


    ```

    include /etc/openldap/schema/core.schema

    include /etc/openldap/schema/cosine.schema

    include /etc/openldap/schema/inetorgperson.schema

    include /etc/openldap/schema/nis.schema

    include /etc/openldap/schema/rfc822-MailMember.schema

    include /etc/openldap/schema/autofs.schema

    include /etc/openldap/schema/kerberosobject.schema

    ```


    > Caution

    You should not modify any of the schema items defined in the schema files installed
    by OpenLDAP.


    You can extend the schema using OpenLDAP to support additional attribute types
    and classes using the default schema files as a guide. To do this, create a local.schema
    file in the /etc/openldap/schema directory. Reference this new schema within slapd.conf
    by adding the following line below your default include schema lines:


    ```

    include /etc/openldap/schema/local.schema

    ```


    Next, define new attribute types and object classes within the local.schema file.
    Many organizations use existing attributes from the schema files installed by
    default and add new object classes to the local.schema file.


    Extending schema to match specialized requirements is quite involved and beyond
    the scope of this chapter. Visit http://www.openldap.org/doc/admin/schema.html
    for information on writing new schema files.'
  merge: -1
  img_proc: true
- pgno: 205
  md: "# 13.6. OpenLDAP Setup Overview\n\nThis section provides a quick overview for\
    \ installing and configuring an OpenLDAP directory. For more details, refer to\
    \ the following URLs:\n\n+   - http://www.openldap.org/doc/admin/quickstart.html\
    \ — The Quick-Start Guide on the OpenLDAP website.\n- http://www.redhat.com/mirrors/LDP/HOWTO/LDAP-HOWTO.html\
    \ — The Linux HOWTO from the Linux Documentation Project, mirrored on Red Hat's\
    \ website.\n\nThe basic steps for creating an LDAP server are as follows:\n\n\
    +   1. Install the `openldap`, `openldap-servers`, and `openldap-clients` RPMs.\n\
    2. Edit the `/etc/openldap/slapd.conf` file to refer to your LDAP domain and server.\
    \ Refer to Section 13.6.1 *Editing /etc/openldap/slapd.conf* for more information\
    \ on how to edit this file.\n3. Start `slapd` with the command:\n   `/sbin/service/slapd\
    \ start`\n   After you have configured LDAP correctly, use `chkconfig`, `ntsysv`,\
    \ and the **Services Configuration Tool** to configure LDAP at boot time. For\
    \ more information about configuring services, refer to the chapter titled *Controlling\
    \ Access to Services in the Red Hat Linux Customization Guide*.\n4. Add entries\
    \ to your LDAP directory with `ldapadd`.\n5. Use `ldapsearch` to see if `slapd`\
    \ is accessing the information correctly.\n6. At this point, your LDAP directory\
    \ should be functioning properly and you can configure any LDAP-enabled applications\
    \ to use the LDAP directory.\n\n# 13.6.1. Editing /etc/openldap/slapd.conf\n\n\
    In order to use the `slapd` server, you will need to modify your configuration\
    \ file, `/etc/openldap/slapd.conf`. You must edit this file to specify the correct\
    \ domain and server.\n\nThe `suffix` line names the domain for which the LDAP\
    \ server will provide information and should be changed from:\n\n```\nsuffix \
    \     \"dc=your-domain, dc=com\"\n```\n\nso that it reflects a fully qualified\
    \ domain name. For example:\n\n```\nsuffix      \"dc=example, dc=com\"\n```\n\n\
    The `rootdn` entry is the Distinguished Name (DN) for a user who is unrestricted\
    \ by access controls or administrative limit parameters set for operations on\
    \ the LDAP directory. The `rootdn` user can be thought of as the root for the\
    \ LDAP directory. In the configuration file, change the `rootdn` line from its\
    \ default value to something like the example below:\n\n```\nrootdn      \"cn=root,\
    \ dc=example, dc=com\"\n```\n\nIf you intend to populate the LDAP directory over\
    \ the network, change the `rootpw` line — replacing the default value with an\
    \ encrypted password string. To create an encrypted password string, type the\
    \ following command:\n\n```\nslappasswd\n```"
