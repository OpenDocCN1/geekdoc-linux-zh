- pgno: 58
  md: '# Chapter 5.


    # The proc File System


    The Linux kernel has two primary functions: to control physical devices on the
    computer and to schedule when how processes interact with these devices. The /proc/
    directory contains a hierarchy of special files which represent the current state
    of the kernel — allowing applications and users to peer into the kernel''s system
    of view.


    Within the /proc/ directory, one can find a wealth of information detailing the
    system hardware and all processes currently running. In addition, some of the
    files within the /proc/ directory tree can be manipulated by users and applications
    to communicate configuration changes to the kernel.


    # 5.1. A Virtual File System


    Under Linux, all data are stored as files. Most users are familiar with the two
    primary types of files: text and binary. The /proc/ contains another type of file
    called a virtual file. It is for this reason that /proc/ is often referred to
    as a *virtual file system.*


    These files have unique qualities. Most of them are listed as bytes in size and
    when one is viewed, it can contain a large amount of information. In addition,
    most of the time and date settings on virtual files reflect the current time and
    date, indicative of fact they are constantly updated.


    Virtual files such as /proc/interrupts, /proc/meminfo, /proc/mounts, and /proc/partitions
    provide an up-to-moment glimpse of the system''s hardware. Others, like /proc/files
    and the /proc/sys/ directory provide system information and interfaces.


    For organizational purposes, files containing information on a similar topic are
    grouped into virtual directories and sub-directories. For instance, /proc/ide/
    contains information for all physical IDE devices. Likewise, process directories
    contain information about each process on the system.


    # 5.1.1. Viewing Virtual Files


    By using cat, more, or less commands on files within the /proc/ directory, users
    can immediately access an amount of information about the system. For example,
    to display the type of CPU a have, type /proc/cpuinfo to receive output similar
    to the following:


    ```

    processor : 0

    vendor_id : AuthenticAMD

    cpu family : 5

    model : 9

    model name : AMD-K6(tm) 3D+ Processor

    stepping : 1

    cpu MHz : 400.919

    cache size : 256 KB

    fdiv_bug : no

    hlt_bug : no

    f00f_bug : no

    coma_bug : no

    fpu : yes

    fpu_exception : yes

    cpuid level : 1

    wp : yes

    flags : fpu vme the pse tsc mre mce cx8 pge mmx syscall 3dnow k6_mtr

    bogomips : 799.53

    ```'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# 44 Chapter 5. The proc File System


    When viewing different virtual files in the /proc/ file system, some of the information
    is easily understandable while some is human-readable. This is in part why utilities
    exist to pull data from virtual files and display it in a useful way. Examples
    of these utilities include lspci, apm, free, and top.


    > Note

    Some of the virtual files in the /proc/ directory are readable only by the root
    user.


    # 5.1.2. Changing Virtual Files


    As a general rule, most virtual files within the /proc/ directory are read only.
    However, some can be used to adjust settings in the kernel. This is especially
    true for files in the /proc/sys/ subdirectory.

    To change the value of a virtual file, use the echo command and a > symbol to
    redirect the new value to the file. For example, to change the hostname on the
    flly:


    ```

    echo www.example.com > /proc/sys/kernel/hostname

    ```


    Other files act as binary or boolean switches. Typing Cat /proc/sys/net/ipv4/ip_forward
    returns either 0 or a 1 indicates that the kernel is not forwarding network packets.
    Using the echo command to change the value of the ip_forward file to 1 immediately
    turns packet forwarding on.


    > Tip

    Another command used to alter settings in the /proc/sys/ subdirectory is /sbin/sysctl.
    For more information on this command, see Section 5.4 Using the sysctl Command


    For a listing of some of the kernel configuration files available in the /proc/sys/,
    see Section 5.3.9 /proc/sys/


    # 5.2. Top-level Files in the proc File System


    Below is a list of some of the more useful virtual files in the top-level of the
    /proc/ directory.


    > Note

    In most cases, the content of the files listed in this section will not be the
    same on your machine. This is because much of the information is specific to the
    hardware on which Red Hat Linux is running.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Chapter 5. The proc File System


    # 5.2.1. /proc/apm


    This file provides information about the state of the Advanced Power Management
    (APM) system and is used by the apm command. If a system with no battery is connected
    to an AC power source, this virtual file will look like this:


    ```

    1.16 1.2 0x07 0x01 0xff 0x80 -1 ?

    ```


    Running the apm -v command on such a result produces output similar to this:


    ```

    APM BIOS 1.2 (kernel driver 1.16)

    AC on-line, no system battery

    ```


    For systems which do not use a battery as a power source, apm is able to do little
    more than put the machine in standby mode. The apm command is much more useful
    on laptops. For example, the following output is from cat /proc/apm on a laptop
    running Red Hat Linux plugged into a power outlet:


    ```

    1.16 1.2 0x03 0x01 0x03 0x09 100% -1 ?

    ```


    When the system is unplugged from its power source for a few minutes, the contents
    of the apm file change to something like this:


    ```

    1.16 1.2 0x02 0x00 0x00 0x01 99% 1792 min

    ```


    The apm -v command will now yield more useful data, such as the following:


    ```

    APM BIOS 1.2 (kernel driver 1.16)

    AC off-line, battery status high: 99% (1 day, 5:52)

    ```


    # 5.2.2. /proc/cmdline


    This file shows the parameters passed to the kernel at the time it is started.
    A sample /proc/cmdline file looks like this:


    ```

    root=/dev/hda2

    ```


    This tells us that the kernel is mounted read-only (signed by (ro)) off the second
    partition on the first IDE device (/dev/hda2).


    # 5.2.3. /proc/cpuinfo


    This virtual file identifies the type of processor used by your system. The following
    is an example of the output typical /proc/cpuinfo:


    ```

    processor : 0

    vendor_id : AuthenticAMD

    cpu family : 5

    model : 9

    name : AMD-K6 (tm) 3D+ Processor

    stepping : 1

    cpu MHz : 400.918

    cache size : 256 KB

    div_bug : no

    hlt_bug : no

    ```'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# 46 Chapter 5. The proc File System


    ```

    f00f_bug : no

    coma_bug : no

    fpu : yes

    fpu_exception : yes

    cpuid level : 1

    wp : yes

    flags : fpu vme de pse tsc msr cx8 pge mxx syscall 3dnow k6_mtrr

    bogomips : 799.53

    ```


    +   - processor Provides each processor with an identifying number. On systems
    that have one processor, there will be only a 0.

    - cpu family Authoritatively identifies the type of processor you have in the
    system. For an Intel-based system, place the number in front of "86" to determine
    the value. This is particularly helpful for those attempting to identify the architecture
    of an older system such as 586, 486, or 386. Because some RPM packages are compiled
    for each of particular architectures, this value also helps users determine which
    packages to install.

    - model name Displays the common name of the processor, including its project
    name.

    - cpu MHz Shows the precise speed in megahertz for the processor to the thousand
    decimal point.

    - cache size Displays the amount of level 2 memory cache available to the processor.

    - flags Defines a number of different qualities about the processor, such as the
    presence of a floating point unit (FPU) and the ability to process MMX instructions.


