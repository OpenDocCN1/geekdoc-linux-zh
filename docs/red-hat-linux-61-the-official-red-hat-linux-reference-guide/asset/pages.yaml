- pgno: 244
  md: '# Chapter 17. Kerberos


    Kerberos is a network authentication protocol created by MIT with symmetric key
    cryptography to authenticate users to network services — eliminating the need
    to send passwords over the network. When users authenticate to network services
    using Kerberos, unauthorized users attempting to gather passwords by monitoring
    network traffic are effectively thwarted.


    #  17.1. Advantages of Kerberos


    Most conventional network systems use password-based authentication schemes. Such
    schemes require a user to authenticate with their username and password. Unfortunately,
    the transmission of authentication information for many services is unencrypted.
    For such a scheme to be secure, the network has to be inaccessible to outsiders,
    and all computers and users on the network must be trusted and trustworthy.


    Even if this is the case, once a network is connected to the Internet, it can
    no longer be assumed that the network is secure. An attacker who gains access
    using a simple packet analyzer, also known as a packet sniffer, to intercept usernames
    and passwords in this manner, compromising user accounts and the integrity of
    the entire security infrastructure.


    The primary design goal of Kerberos is to eliminate the transmission of unencrypted
    passwords across the network. If used properly, Kerberos effectively eliminates
    the threat packet sniffers would otherwise pose on the network.


    #  17.1. Disadvantages of Kerberos


    Although Kerberos removes a common and severe security threat, it may be difficult
    to implement for a variety of reasons:


    +   - Migrating users from a standard UNIX password database, such as /etc/passwd
    or /etc/shadow, to a Kerberos password database can be tedious, as there is no
    automated mechanism to perform this task. For more information, refer to question
    2.23 in the Kerberos FAQ online at the URL:

    http://www.nrl.navy.mil/CCS/people/kenh/Kerberos-faq.html.


    +   - Kerberos has only partial compatibility with the Pluggable Authentication
    Modules (PAM) system used by most servers Red Hat Linux. For more information
    on this, Section 17.4 Kerberos and PAM.


    +   - For an application to use Kerberos, its source must be modified to make
    the appropriate calls to the Kerberos libraries. For some applications, this can
    be quite problematic due to the size of the application or its design. For incompatible
    applications, changes must be made to the way in which the server and client communicate.
    Again, this may require extensive programming. Closed source applications that
    do not have Kerberos support by default are the most problematic.


    +   - Kerberos assumes that you are a trusted user using an untrusted host on
    an untrusted network. Its primary goal is to prevent plain text passwords from
    being sent across such a network. However, if anyone other than the proper user
    has access to the host that issues tickets for authentication—called the key distribution
    center (KDC)—the entire Kerberos authentication system is at risk of being compromised.


    +   - Kerberos is an all or nothing solution. If you decide to use Kerberos on
    your network, you must remember that any passwords transferred to a service which
    does not use Kerberos for authentica'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# Chapter 17. Kerberos


    tion are at risk of being captured by packet sniffers. Thus, your network gains
    no benefit from the use of client. To secure a network with Kerberos, one must
    either use kerberized versions of all client/server applications which use unencrypted
    passwords or not use any client/server applications at all.


    # 17.2. Kerberos Terminology


    Kerberos has its own terminology to define various aspects of the service. Before
    learning how kerberos works, it is important to learn the following terms.


    ciphertext


    Encrypted data.


    client


    An entity on the network (a user, a host, or an application) that can get a ticket
    from Kerberos.


    credential cache or ticket file which contains the keys for encrypting communications
    between a user and various network services. Kerberos supports a framework for
    using other cache types, such as shared memory, but files are more thoroughly
    supported.


    crypt hash


    One way has to authenticate users. While more secure than plain text, it is fairly
    easy to decrypt for an experienced challenger.


    GSS-API


    The Generic Security Service Application Program Interface [RFC-2743] is a set
    of functions that provide security services which clients can authenticate to
    servers and which servers can authenticate to clients without specific knowledge
    of the underlying mechanism. If a network service (such as IMAP) uses GSS-API,
    it can authenticate using Kerberos.


    key


    Data used when encrypting or decrypting other data. Encrypted data cannot be decrypted
    without the proper key or extremely good guessing.


    Key Distribution Center (KDC)


    A service that issues Kerberos tickets, usually on the same host as the Ticket
    Granting Server


    key table or keytab


    A file that includes an unencrypted list of principals and their keys. Service
    retrieves the keys they need from keytab instead of using kinit. The default keytab
    file is /etc/krb5.keytab. The KDC administration server, /usr/kerberos/bin/kadmin,
    is the only service that uses any other file (it uses /var/kerberos/krb5kdc/kadm5.keytab).


    kinit


    The kinit command allows a principal who has already logged in to obtain and cache
    the initial Ticket Granting Ticket (TGT). For more on using the kinit command,
    see its man page.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# Chapter 17. Kerberos


    principal


    realm


    +   A network that uses Kerberos, composed of one or more servers called KDCs
    and a potentially large number of clients.


    service


    +   A program accessed over the network.


    ticket


    +   A temporary set of electronic credentials that verify the identity of a client
    for a particular service.


    # Ticket Granting Service (TGS)


    A service that issues tickets for a desired service and in turn gives users for
    access to the service. The TGS usually runs on the same host as the KDC


    # Ticket Granting Ticket (TGT)


    A special ticket that allows the client to obtain additional tickets without applying
    for them from the KDC.


    encrypted password


    +   A plain text, human-readable password.


    # 17.3. How Kerberos Works


    Kerberos differs from other authentication methods. Instead of authenticating
    each user to each network service, Kerberos uses symmetric encryption and a third
    party — known as the Key Distribution Center (KDC) — to authenticate users to
    a suite of network services. Once a user authenticates to the KDC, it sends a
    ticket specific to session back the user''s machine and any kerberized service
    will look for the ticket on the user''s machine rather than asking the user to
    authenticate using a password.


    When a kerberized network logs in their workstation, the principal is sent to
    the KDC in a request for a Ticket Granting Ticket (TGT) from the Ticket Granting
    Service (TGS). This request can be sent by the login program so that it is transparent
    to the user or can be sent by the `kinit` program after the user logs in.


    The KDC checks for the principal in its database. If the principal is found, the
    KDC tells the TGS to create a TGT, which is encrypted using the user''s key and
    returned to that user.


    The login or `kinit` program on the client machine decrypts the TGT using the
    user''s key (which computes from the user''s password). The key is used only on
    the client machine and is not sent over the network.


    The TGT is set to expire after certain period of time (usually ten hours) and
    stored in the client machine''s credentials cache. An expiration time is set so
    that compromised TGT is of use by an attacker for only a short period of time.
    When the TGT is issued, the user will not have to re-enter their password to the
    KDC until the TGT expires or they log out and login again.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# Chapter 17. Kerberos


    Whenever the user needs access to a network service, the client software uses
    the TGT to request a new ticket for that service from the TGS. The service ticket
    is then used to authenticate the user to that service transparently.


    > Warning

    The Kerberos system can be compromised by sending a password in plain text. Any
    user on the network authenticates against a non-kerberos service by sending a
    password in plain text. Therefore use of non-kerberos services is discouraged.
    Such services include Telnet and FTP. Use of other encrypted protocols, such as
    SSH or SSL secured services, however, is acceptable, though not ideal.


    This is only a brief overview of Kerberos authentication on a network works, those
    seeking an in-depth look at Kerberos authentication, should refer to Section 17.7
    Additional Resources.


    > Note

    Kerberos depends on certain network services to work correctly. First, Kerberos
    requires synchronization between the machines on the network. Therefore, a clock
    synchronization program should be set up for the network, such as ntp. For configuring
    ntp, see /usr/share/doc/ntp-<version-number>/index.html for details on setting
    up Network Time Protocols.

    Also, certain aspects of Kerberos rely on the Domain Name Service (DNS), be sure
    the DNS entries and hosts on the network are all properly configured. See the
    Kerberos V5 System Administrator''s Guide, provided in PostScript and HTML formats
    in /usr/share/doc/krb5-server-<version-number> for more information.


    # 17.4. Kerberos and PAM


    Currently, kerberos services do not make use of Pluggable Authentication Modules
    (PAM) — kerberos services bypass PAM completely. However, applications that use
    PAM can make use of Kerberos for authentication if the pam_krb5 module (provided
    in the pam_krb5 package) is installed. The pam_krb5 package contains configuration
    files that allow services to use login and gdm to authenticate users and obtain
    initial credentials using their passwords. If access to network services is always
    performed by kerberos services or services that use GSS-API, such as IMAP, the
    network can be considered reasonably safe.


    Administrators should be careful not to allow users to authenticate to most network
    services using Kerberos. Many protocols used by these services do not encrypt
    the password over the network, destroying the benefits of the Kerberos system.
    For example, users should not be allowed to authenticate using their Kerberos
    passwords over Telnet.


    The next section describes how to set up a basic Kerberos service.


    # 17.5. Configuring a Kerberos 5 Server


    When you are setting up Kerberos, install the server file. If you need to set
    up slave servers, the details of setting up relationships between master and slave
    servers are covered in the Kerberos 5 Installation Guide located in the /usr/share/doc/krb5-server-<version-number>
    directory.


