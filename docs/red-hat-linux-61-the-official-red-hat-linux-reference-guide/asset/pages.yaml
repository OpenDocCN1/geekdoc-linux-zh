    # 9.2. NFS Server Configuration Files


    Configuring a server to share files and directories using NFS is a simple process.
    Every file system is exported to remote users via NFS, with the access rights
    relating to those files, located in the /etc/exports file. This file is read by
    the exportfs command to give rpc.mountd rpc.nfs information necessary to allow
    the remote mounting of a file system by an authorized host.

    The exportfs command allows the root user to selectively export or export directories
    without restarting the service. When exportfs is passed the options, the file
    systems are exported written to /var/lib/nfs/stab. Since rpc.mount refers to the
    xtab when deciding access privileges to a file system, changes to the list of
    exported files take effect immediately.

    Various options are available when using exportfs:


    +   - r — Causes all directories listed in /etc/exports to be exported by constructing
    a new export list in /etc/lib/nfs/stab. This option effectively refreshes the
    export list with any changes that have been made to /etc/exports.

    - a — Causes all directories to be exported or unexported, depending on the other
    options passed to exportfs.

    - o — Allows the user to specify directories to be exported that are not listed
    in /etc/exports. This additional file system must be written in the same way they
    are specified in /etc/exports. This option is used to test an exported file system
    before adding it permanently to the list of files to be exported.

    - i — Ignore /etc/exports; only options given from the command line are used to
    define exported file systems.

    - u — Unexports directories being mounted by remote users. The command exportfs
    -ua effectively suspends NFS sharing while keeping the various NFS daemons up.
    To allow NFS sharing to continue, type exportfs -r.

    - v — Verbose output, where the file systems exported or unexported are displayed
    in greater detail when the exportfs command is executed.


    If no options are passed to the exportfs command, it displays a list of currently
    exported file systems.

    Changes to /etc/exports can also be made by reloading the NFS service with the
    service nfs reload command. This keeps the NFS daemons running while re-exporting
    the /etc/exports file.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# Chapter 9. Network File System (NFS)


    # 9.2.1./etc/exports


    The /etc/exports files control which files are exported to remote hosts and specifies
    options. Blank lines are ignored, can be made by starting a line with the hash
    mark (#), and long lines can be wrapped with a backslash (\ Each exported file
    system should be on its own individual line. Lists of authorized hosts placed
    after an exported file system must be separated by space characters. Options for
    each of the hosts must be placed in parentheses after the host identifier, without
    any spaces separating the first and the last parenthesis.


    In its simplest form, /etc/exports only needs to know the directory to be exported
    and the hosts permitted to use it:


    ```

    /some/directory bob.example.com

    another/exported/directory 192.168.0.3

    ```


    After re-exporting /etc/exports with the /bin/service nfs reload command, the
    bob.example.com host will be able to mount /some/directory and 192.168.0.3 can
    mount another/exported/directory. Because no options are specified in this example,
    several default NFS preferences take:


    +   - Read — Hosts mounting this file system will not be able to change it. To
    allow hosts to make changes to the file system, the rw (read-write) option must
    be specified.

    - async — Allows the server to write to disk when it sees fit. While this is important
    if the host is accessing as read-only, or if host makes changes to a read-write
    file system and the server crashes, data could be lost. By specifying the sync
    option, all writes are committed to the disk requested by the client. This may
    improve performance.

    - wdelay — Causes the NFS to delay writing to the disk if it suspects another
    other write is imminent. This can improve performance by reducing the number of
    times the disk must be accessed by separate write commands, reducing over head.
    The no_wdelay option turns off this feature, but is only available when using
    the sync option.

    - root_squash — Strips roots connected remotely from having root privileges by
    assigning them nobody user. This effectively "squashes" the power of the root
    user to the local user, preventing remote users from acting as they were the root
    on the local system. The no_root_squash option turns off root squashing. To squash
    every remote user, using root, the all_squash option specifies the user and group
    IDs respectively. In this case, a special user can be created for remote NFS users
    to share and specify (if anuid=<uid-value> anongid=<gid-value>, where <uid-value>
    is the user number and <gid-value> is the group ID in value).


    In order to override these, you must specify an option that allows that. For example,
    if you do not specify rw, that export will only be read-only. For every exported
    file system must be included. This allows in the ability to disable sub-tree checking,
    allow access from insecure ports, and insure file locks (necessary for early NFS
    client implementations). The exports man page for details on these used options.


    When specifying hosts, use the following methods:


    +   - single host — Where particular host is specified with fully qualified domain
    name, hostname, or IP address.

    - wildcards — Where a * or ? character is used to take into account a grouping
    of fully qualified domain names that match a pattern string of characters. Wildcards
    are not to be used with IP addresses; however, they may accidentally work if reverse
    DNS lookups fail.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# Chapter 9. Network File System (NFS)


    However, be careful when using wildcards with fully qualified domain names, as
    they tend to be more exact than you would expect. For the example of *.example.com
    as wildcard will allow sales.example.com to access an exported file system, but
    not bob.example.com. To match both possibilities, as well as sam.corp.example.com,
    you would have to provide *.example.com *.*


    +   - IP networks — Allows the matching of hosts based on their IP addresses within
    a larger network. For example, 192.168.0.0/28 will allow the 16 IP addresses,
    from 192.168.0.0 to 192.168.0.15, to access the exported file system but not 192.168.0.16
    or higher.


    +   - netgroups — Permits an NIS group name, written as @group-name, to be used.
    This puts the NIS server in charge of access control for this exported file system,
    where users can be added and removed from any NFS group without using /etc/exports.


    > > Warning The format of the /etc/exports file is very precise, particularly
    in regards to use of the space character. Remember to always save exported file
    systems from hosts and one another with a space character. However, there should
    be no space characters in the file except on comment lines.

    > For example, the two lines do not mean the same thing:


    ```

    /home bob.example.com (rw)

    home bob.example.com (rw)

    ```


    The first line allows only users from bob.example.com read-write access to the
    /home directory. However, this requires that the root user type second line allows
    users from bob.example.com to mount the directory read-only (the default), but
    the rest of the world can mount it read-write.


    # 9.3. NFS Client Configuration Files


    Any NFS share available by a server can be mounted using various methods. The
    share can be manually mounted, using the mount command. However, this requires
    the root user type the mount command every time the system restarts. Two methods
    of configuring NFS shares to be mounted automatically by modifying the /etc/fstab
    or using the autofofs service.


    # 9.3.1. /etc/fstab


    Placing a properly formatted line in the /etc/fstab file has the same effect as
    mounting the exported file system. The /etc/fstab file is read by the /etc/rc.init.d/netfs
    script at system startup and any NFS shares listed will be mounted.


    A sample /etc/fstab for an NFS export looks like the following:


    ```

    <server>:/path/to/dir <local/mount/point> nfs <options> 0 0

    ```


    The <server-host> corresponds to hostname, IP address, or fully qualified domain
    name of the exporting file system.


    The <path/to/directory> specifies where the local file system to mount the exported
    directory. This mount point must exist before /etc/fstab is read or the mount
    will fail.


    The nfs option specifies the type of file system being mounted.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# Chapter 9. Network File System (NFS)


    The <options> area specifies mount points for the file system. For example, if
    the options states rw, suid, the exported file system will be mounted read-write
    and the user and groupid by server will be used. Note that parentheses are not
    to be used here. For more mount options, see Section 9.3.3 Common NFS Mount Options.


    # 9.2. autofofs


    One drawback to using /etc/fstab is, regardless of how infrequently a user may
    access the NFS mounted file system, the system must dedicate resources to keep
    that in place. This is not a problem with one or two mounts, but when the system
    is maintaining mounts to dozens systems at one time, overall system performance
    can suffer. An alternative to /etc/fstab is to use the kernel-based mount utility,
    which will manage NFS file systems automatically, saving resources.


    The autofofs script, located in the /etc/rc/init.d/, is designed to control automount
    while mount can be specified in the command line, it is more convenient to specify
    the mount, hostname, exported directory, and options in files rather than typing
    them all by hand. By running autofofs as a service that starts and stops in designated
    runlevels, the mount configurations in the various files can be automatically
    implemented.


    The autofofs configuration files are arranged in a parent-child relationship.
    A configuration file (/etc/auto.master) refers mount points on your system that
    are linked to a particular map type, which takes the form of other configuration
    files. For NFS exports it is to use a file as the map type for the particular
    mount point. The auto.master file contains lines referring to each of the mount
    points, organized like this:


    ```

    <mount-point>                                 <map-type>

    ```


    The <mount-point> element of this line indicates the location of the mount on
    the file system. The <map-type> relates to the way in which the mount point will
    be mounted. The most common method for automount NFS exports is to use a file
    as the map type for the particular mount point. The map file, usually named auto.<mount-point>,
    where <mount-point> is the mount point designated in auto.master, contains lines
    that like this:


    ```

    <directory>  <mount-options> <host>:<exported-file-system>

    ```


    The <directory> refers to the directory within the mount point where the exported
    file system should be mounted. Like a standard mount command, the hosting export
    file system, as well as the file system exported, are required in the <host>:<exported-file-system>.
    To specify particular options to use when mounting the exported file system, place
    in the <mount-options> section, separated by commas. For NFS mounts that use autofofs,
    place -fstype=nfs in the <mount-options> section.


    While autofofs configuration files can be used for a variety of mounts to many
    types of devices and files, they are particularly useful in creating NFS mounts.
    For example, some organizations store a user''s directory on a central server
    via NFS. Then, they configure the auto.master file on each of an auto.home file
    containing the specifics for how to mount the /home/directory via NFS. This allows
    the user to access personal data and configuration files in their /home/directory
    by logging in anywhere on the internal network. The auto.master file in this situation
    would look similar to:


    ```

    /home                               /etc/auto.home

    ```


    This sets up the /home/ mount point on the local system to be configured by the
    /etc/auto.home file, which may look similar to:'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# Chapter 9. Network File System (NFS)


    * -fstype=nfs,soft,intr,rsize=8192,wsize=8192 server.example.com:/home


    This line states that any directory user tries to access the local /home/directory
    (due the asterisk*) should result in an NFS mount on the server.example.com system
    within its exported /home/ file system. Mount options specify that each /home/
    directory NFS mounts should use a particular collection of settings. For more
    information on mount options, including the ones used in this example, see Section
    9.3 Common NFS Mount Options.


    # 9.3.3. Common NFS Mount Options


    Beyond mounting a file system via NFS on a remote host, a number of different
    options may be specified at the time of the mount that can make it easier to use.
    These options can be used with manual commands, /etc/fstab settings, and autofs,
    and other methods.

    The following options are the most popular for NFS:


    +   * hard — specifies whether the program using a file via NFS connection should
    stop and wait (hard) for the server to come back online if the host serving the
    exported file system is unavailable, or if it should return an error (soft).

    * If hard specified, the user cannot terminate the process waiting for the NFS
    communication to resume unless intr option is also specified.

    * If soft, the user can set an additional timeout=<value> option, which specifies
    the number of seconds before the error is reported.

    * intr — allows NFS requests to be interrupted if the server goes down or cannot
    be reached.

    * nolock — is occasionally required when connecting to older NFS server. To require
    locking, use the lock option.

    * noexec — does not permit the execution of binaries on the mounted file system.
    This is useful if the system is mounting a non-Linux file system that contains
    incompatible binaries.

    * nsuid — does not allow set-user-identifier or group-identifier bits to take
    effect.

    * rsize=8192 and wsize=8192 — may speed up NFS communication for reads (rsize)
    and writes (wsize) by setting a larger block size, in bytes, to be transferred
    at one time. Be careful when changing these values; older Linux kernel and network
    cards may not work well with larger sizes.

    * nfsvers=2 or nfsvers=3 — specify which version of the NFS protocol to use.


    Many more options are listed on the mount page, including options for mounting
    non-NFS file systems.


    # 9.4. Securing NFS


    NFS works well for sharing entire file systems with a large number of known hosts
    in a largely transparent manner. Many users accessing files over NFS may not be
    aware that the file system they are using is not local to their system. However,
    with ease of use comes a variety of potential security problems.


    The following points should be considered when exporting NFS file systems on a
    server or them on a client. Doing so will minimize NFS security risks and better
    protect data on the server.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# 9.4.1. Host Access


    NFS controls who manage an exported file system based on the host mount request,
    the user that will actually use the exported file system. Access control is not
    possible for users, other than file and directory permissions. In others, once
    a file system is exported via NFS, any user on remote host can access the shared
    data. To limit the potential risks, administrators can allow only read-only or
    accessing users to a common user and groupid. These solutions may prevent the
    NFS share from being used in the way it was originally intended.


    Additionally, if an attacker gains control of the DNS server used by the exporting
    NFS file system, the system with a particular hostname or fully qualified domain
    name can be pointed to an unauthorized machine. At this point, the unauthorized
    machine is system permitted to mount the NFS share, no username or password information
    is exchanged to provide additional security for the NFS mount. The risk holds
    true to compromised NIS servers, if NIS netgroups are used to allow certain hosts
    to mount NFS share. By using IP addresses in /etc/exports, this kind of attack
    is more difficult.


    Wildcards be used sparingly when granting NFS shares as the scope of the wildcard
    may encompass more systems than intended.


    For more information on securing NFS, refer to the chapter titled *Server Security
    in the Red Hat Linux Security Guide*.


    # 9.4.2. File Permissions


    Once the NFS file system is mounted read-write by a remote host, the only protection
    each shared file has its permissions. If two users share the same userid value
    the same NFS file system, they will be able to modify others files. Additionally,
    anyone logged in as root as the client system can use su to become a user who
    can access particular files via the NFS share. For NFS and userid conflicts, refer
    to the chapter titled *Managing Accounts and Groups in the Red Hat Linux System
    Administrator*.


    The default behavior when exporting a file system via NFS is to root squashing.
    This sets the userid of root user on their local machine to a value of the server’s
    nobody account. Never turn off root squashing.


    If exporting an NFS share read-only, consider using the all_squash option, which
    makes every user accessing the exported file system take the userid of the nobody
    user.


    # 9.5. Additional Resources


    Administered an NFS server can be a challenge. Many options, including what few
    mentioned in this chapter, are available for exporting or mounting NFS shares.
    Consult the following for more information.


    # 9.5.1. Installed Documentation


    +   - /usr/share/doc/nfs-utils-<version-number>/ Replace <version-number> with
    the version of the NFS package. This directory contains a wealth of information
    about the NFS implementation for Linux, including a look at various NFS configurations
    and their impact on file transfer performance.

    - mount mount Contains a comprehensive look at options for NFS server and client
    configurations.'
  merge: -1
  img_proc: true
