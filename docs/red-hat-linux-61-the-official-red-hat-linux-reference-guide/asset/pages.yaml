- pgno: 38
  md: '# Chapter 3.

    File System Structure


    # 3.1. Why Share a Common Structure?


    An operating system''s file system structure is its most basic level of organization.
    Almost all of the ways an operating system interacts with its users, applications,
    and security model are dependent upon the way it stores its files on a storage
    device. It is crucial for a variety of reasons that, as well as programs, be able
    to refer to a common guideline to where to read and write files.

    A file system can be seen in two different logical categories of files:


    +   - Shareable vs. unsharable files


    +   - Variable vs. static files


    Variable files are those that can be accessed by various hosts; unsharable files
    are not available to other hosts. Variable files can change at any time without
    intervention; static files, such as read-only information and binaries, do not
    change without an action from the system administrator or an agent that the system
    administrator has placed in position to accomplish that task.

    The reason for looking at files in this manner is to help correlate the function
    of the file with the permissions assigned to the directories which they hold.
    The way in which the operating system and its users interact with a file determines
    the directory in which it is placed, whether that directory is mounted read-only
    or read-write, and the level of access each user has. The top level of this organization
    is crucial, as to the underlying directories which can be restricted or security
    problems may manifest itself if the top level is left disorganized or without
    a widely structured.

    However, having a structure does not mean much unless it is a standard. Competing
    structures can actually cause more problems than they fix. Because of this, Red
    Hat has chosen the most widely-used file system structure and extended it only
    slightly to accommodate special files used within Red Hat Linux.


    # 3.2. Overview of File System Hierarchy Standard (FHS)


    Red Hat is committed to the Filesystem Hierarchy Standard (FHS), a collaborative
    document that defines the names and locations of many files and directories.


    The FHS document is the authoritative reference to any FHS-compliant file system,
    but the standard leaves many areas undefined or extensible. This section is an
    overview of a standard and a description of the parts of the file system not covered
    by the standard.

    The complete standard is available at:


    http://www.pathname.com/fhs


    Compliance with the standard means many things, but the two most important are
    compatibility with other compliant systems and the ability to mount a /usr/ partition
    as read-only because it contains common executables and should not be changed
    by users. The /usr/ directory is mounted read-only, so it can be mounted from
    the CD-ROM or from another machine via a read-only mount.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# 3.2.1. FHS Organization


    The directories and files noted here are a small subset of those specified by
    the FHS document. Refer to the latest FHS document for the most complete information.


    # 3.2.1.1. The /dev/ Directory


    The /dev/ directory contains file system entries which represent devices that
    are attached to the system. These files are essential for the system to function
    properly.


    # 3.2.1.2. The /etc/ Directory


    The /etc/ directory is reserved for configuration files that are local to the
    machine. No binaries are to be put in /etc/. Any binaries that were located in
    /etc/ should be placed into /sbin/ or possibly /bin/.


    The X11/ and skel/ directories are subdirectories of the /etc/ directory:


    ```

    /etc

    |- X11/

    |- skel/

    ```


    The /etc/X11/ directory is for X11 configuration files such as XF86Config. The
    /etc/skel/ directory is for ''skeleton'' user files, which are used to populate
    a home directory when a user is first created.


    # 3.2.1.3. The /lib/ Directory


    The /lib/ should contain only libraries that are needed to execute the binaries
    in /bin/ and /sbin/. These shared libraries are particularly important for booting
    the system and executing commands within the root file system.


    # 3.2.1.4. The /mnt/ Directory


    The /mnt/ directory is for temporarily mounted file systems, such as CD-ROMs and
    floppy disks.


    # 3.2.1.5. The /opt/ Directory


    The /opt/ directory provides storage for large, static application packages.

    A package placing in the /opt/ creates a directory bearing the same name as the
    package. This directory turn holds files that would otherwise be scattered throughout
    the system, giving the system administrator an easy way to determine the role
    of each file within a particular package.


    For example, if sample is the name of a particular software package located within
    the /opt/ directory, then all of its files could be placed within directories
    inside the /opt/ directory, such as /opt/sample/bin/ for binaries and /opt/sample/man/
    for manual pages.


    Large packages may contain many sub-packages, each of which encompasses a particular
    task, also go within the /opt/ directory, giving that large package a standardized
    way to organize itself. In this way, our sample package may have different tools
    in their own subdirectories, such as /opt/sample/tool1/ and /opt/sample/tool2/,
    each of which can have their own bin/, man/, and other similar directories.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Chapter 3. File System Structure


    # 3.2.1.6. The /proc/ Directory


    The /proc/ directory contains special files that either extract information from
    or send information

    to the kernel.


    Due to the great variety of data available within /proc/ and the many ways this
    directory can be

    used to communicate with the kernel, an entire chapter has been devoted to the
    subject. For more

    information, please refer to Chapter 5 The proc File System.


    # 3.2.1.7. The /sbin/ Directory


    The /sbin/ directory is for executables used only by the root user. The executables
    in /sbin/ are

    used only to boot and mount /usr/ and perform system operations. The FHS says:


    > /sbin typically contains files essential for booting the system in addition
    to the binaries in /bin. Anything

    executed after /usr is known to be mounted (when there are no problems) should
    be placed in /usr/sbin.

    Local-system administration binaries should be placed into /usr/local/sbin."


    At minimum, the following programs should be in /sbin/


    +   arp,

    getty, halt,

    init, fdisk,

    fsck.*, grub,

    config, lilo,

    mkfs.*, mswap,

    reboot, route,

    shutdown, swapoff,

    swapon, update


    # 3.2.1.8. The /usr/ Directory


    The /usr/ directory is for files that can be shared across a whole site. The /usr/
    directory usually

    h its own partition, and should be mounted read-only. At minimum, the following
    directories

    should be subdirectories of /usr/


    +   /usr

    |- bin/

    |- dict/

    |- doc/

    |- etc/

    |- games/

    |- include/

    |- kerberos/

    |- lib/

    |- libexec/

    |- local/

    |- sbin/

    |- share/

    |- src/

    |- tmp -> /var/tmp/

    |- X11R/


    The /bin/ directory contains executables, dict/ contains non-FHS compliant documentation
    pages,

    et/ contains system-wide configuration files, games is for games, include/ contains
    header

    files, kerberos/ contains binaries and much more for Kerberos, and lib/ contains
    object files and'
  merge: -1
  img_proc: true
- pgno: 41
  md: "# 26 Chapter 3. File System Structure\n\nlibraries that are not designed to\
    \ be directly utilized by users or shell scripts. The libexec/ directory contains\
    \ small helper programs called by other programs, sbin/ is for system administration\
