- pgno: 62
  md: '# Chapter 5. The proc File System


    The output from /proc/devices includes the major number and name of the device,
    and is broken into two sections: Character devices and Block devices.

    Character devices are similar to block devices, except for two basic differences:


    +   1. Block devices have a buffer available, allowing them to order requests
    before- This is important for devices designed to store information—such as hard
    drives—because the ability to order the information before writing it to the device
    allows it to be placed in a more efficient order. Character devices do not require
    buffering.

    2. Block devices can send and receive information in blocks of size configured
    per device. Character-devices send data with no preconfigured size.


    For more information about devices see /usr/src/linux-2.4/Documentation/devices.txt.


    # 5.2.5. /proc/dma


    This file contains a list of the registered ISA direct memory access (DMA) channels
    in use. A sample /proc/dma files looks like this:


    4: cascade


    # 5.2.6. /proc/execdomains


    This file lists the execution domains currently supported by the Linux kernel,
    along with the range of personalities they support.


    +   0-0 Linux [kernel]


    Think of domains as the "personality" for a particular operating system. Because
    other binary formats, such as Solaris, UnixWare, and FreeBSD, can be used with
    Linux, programmers can change the way the operating system treats particular system
    calls from these binaries by changing the personality of the task. Except for
    the PER_LINUX execution domain, different personalities can be implemented as
    dynamically loadable modules.


    # 5.2.7. /proc/fb


    This file contains a list of frame buffer devices, with the frame buffer device
    number and the driver that controls it. Typical output of /proc/fb for systems
    which contain frame buffer devices looks like this:


    ```

    0 VESA VGA

    ```


    # 5.2.8. /proc/filesystems


    This file displays a list of the file types currently supported by the kernel.
    Sample output from a generic /proc/filesystems looks similar to this:


    ```

    node rootfs

    node bdev

    node proc

    node sockfs

    node tmpfs

    ```'
  merge: -1
