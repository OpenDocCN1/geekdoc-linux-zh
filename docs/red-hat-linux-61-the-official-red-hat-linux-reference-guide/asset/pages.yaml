    files necessary to serve as the primary nameserver for a domain.


    # 12.7.3. Related Books


    +   - DNS and BIND by Paul Albitz and Cricket Liu; O’Reilly & Associates — A popular
    reference that explains both common and esoteric BIND configuration options, as
    well as providing strategies to secure your DNS server.


    +   - The Concise Guide to DNS and BIND by Nicolai Langfeldt, Que — Looks at the
