    # 11.3.1.6. Using Sendmail with LDAP


    Using the Lightweight Directory Access Protocol (LDAP) is a quick and powerful
    way to find specific information about a particular user from a larger group.
    For example, an LDAP server can be used to look up a particular email address
    from a common corporate department by the user''s name. In this kind of implementation,
    LDAP is largely separate from Sendmail, with LDAP storing the hierarchical information
    and Sendmail only delivering messages.


    However Sendmail supports a much greater integration with LDAP, where LDAP to
    replace separated files, as aliases and virtertables, on different mail servers
    that work to support a medium- to enterprise-level organization. In short, LDAP
    abstracts the main routing from Sendmail and its separate configuration files
    to a powerful LDAP cluster that can be leveraged by different applications.


    The current version of Sendmail contains support for LDAP. To extend the Sendmail
    server using LDAP, first as OpenLDAP, running and properly configured. Then edit
    the /etc/mail/sendmail.mc to include the following:


    ```

    LDAPROUTE_DOMAIN(''yourdomain.com'')dnl

    FEATURE(''ldap_routing'')dnl

    ```


    ![](img/31025704b51d5760c0228ff0f3db98bf_168_0.png)


    Note


    This is for a very basic configuration of Sendmail with LDAP. Your configuration
    should differ greatly from this depending on the implementation of LDAP, especially
    when configuring several Sendmail machines to use a common LDAP server.


    Consult /usr/share/doc/sendmail/README.cf for detailed LDAP routing configuration
    instructions and examples.


    Next, recreate the /etc/mail/sendmail.cf file by running m4 and restarting Sendmail.
    See Section 11.3.1.3 Common Sendmail Configuration Changes for instructions on
    doing this.'
