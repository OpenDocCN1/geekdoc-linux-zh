    about using and configuring GRUB. The <version-number> in the path to this file
    corresponds to the version of the GRUB package installed.

    - The GRUB info page, accessible by typing the info grub command, contains a user
    reference manual, a programmer reference manual, and a FAQ about GRUB and its
    usage.

    - /usr/share/doc/lilo-<version-number>/ — This directory contains a wealth of
    information about using and configuring LILO. In particular, the doc subdirectory
    contains a postscript file called User_Guide.ps which is highly informative. The
    <version-number> in the path to this directory corresponds to the version of the
    LILO package installed.


    # 2.11.2. Useful Websites


    +   - http://www.gnu.org/software/grub/ — The home page of the GNU GRUB project.
    This site contains information concerning the state of GRUB development and a
    FAQ.

