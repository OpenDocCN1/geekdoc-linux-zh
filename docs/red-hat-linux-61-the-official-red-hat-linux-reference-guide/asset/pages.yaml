    \ kernel memory. Any increase in msgmax would increase RAM requirements for the\
    \ system.\n- msgnnb — Sets the maximum number of bytes in a single message queue.\
    \ The default is 16384.\n- Sets the maximum number of message queue identifiers.\n\
    - osrelease — Lists the kernel release number. This file can only be altered by\
    \ changing the kernel source and recompiling.\n- ostype — Displays the type of\
    \ operating system. By default, this is set to Linux, and its value can only be\
    \ changed by changing the kernel source and recompiling.\n\n+   - overflow and\
    \ overflow — Defines the fixed group ID and user ID, respectively, for you systems\
    \ on architectures that only support 16-bit group and user IDs.\n- panic — Defines\
    \ the number of seconds the kernel will postpone rebooting when the system experiences\
    \ a kernel panic. By default, the value is set to 0, which disables automatic\
    \ rebooting after a panic.\n\n+   - printk — This file controls a variety of settings\
    \ for printing or logging error messages. Each error message reported by the kernel\
    \ has a loglevel associated with it that defines the importance of the message.\
    \ The loglevel values break down in this order:\n  - 0 Kernel emergency. The system\
    \ is unusable.\n  - 1 Kernel alert. Action must be taken immediately.\n  - 2 Condition\
    \ of the kernel is considered critical.\n  - 3 General kernel error condition.\n\
    \  - 4 General kernel warning condition.\n  - 5 Kernel notice of a normal but\
    \ significant condition.\n  - 6 Kernel informational message.\n  - 7 Kernel debug-level.\n\
    \nFour values are found in the printk file:\n6 4 7\nEach of these values defines\
    \ a different rule for dealing with messages, called the console loglevel, defines\
    \ the lowest priority of messages that will be printed to the console. (Note that,\
    \ the lower the priority, the higher the loglevel number.) The second value sets\
    \ the default loglevel for messages without an explicit loglevel attached to them.\
    \ The third value sets the lowest possible loglevel configuration for the console\
    \ loglevel. The last value sets the default value for the console loglevel."
