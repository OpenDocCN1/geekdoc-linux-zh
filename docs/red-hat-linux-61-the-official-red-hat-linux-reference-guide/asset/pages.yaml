- pgno: 225
  md: '# 15.2.2. Portmap and TCP Wrappers


    When creating access rules for portmap, do not use hostnames as its implementation
    of TCP wrappers does not support host look ups. For this reason, use IP addresses
    and the keyword ALL when specifying hosts in hosts.allow or hosts.deny.


    In addition, changes to portmap access control rules may not affect immediately.


    Widely used services, such as NIS and NFS, depend on portmap to operate, so be
    aware of these limitations.


    # 15.2.3. Option Fields


    In addition to basic rules allowing and denying access, the Red Hat Linux implementation
    of TCP wrappers supports extensions to the access control through option fields.
    Within hosts fields, administrators can accomplish a variety of tasks such as
    altering log behavior, consolidating access control, and launching shell commands.


    # 15.2.3.1. Logging


    Option fields let administrators easily change the log facility and priority level
    for a rule by using the severity directive.


    In the following, connections to the SSH daemon from any host in the example.com
    domain are logged to the default authpriv facility (because no facility value
    is specified) with a priority of emerg:


    ```

    sshd : .example.com : severity emerg

    ```


    It is also possible to specify a facility using the severity option. The following
    example logs any SSH connection attempts by hosts from the example.com domain
    to the local0 facility with a priority of alert:


    ```

    sshd : .example.com : severity local0.alert

    ```


    ![](img/31025704b51d5760c0228ff0f3db98bf_225_0.png)


    > Note

    In practice, this example will not work until the syslog daemon (syslogd) is configured
    to log to the local0 facility. The syslog.conf man page for information about
    configuring custom log facilities.


    # 15.2.3.2. Access Control


    Option fields also allow administrators to explicitly allow or deny hosts in a
    single rule by adding the allow or deny directive as the final option.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Chapter 15. TCP Wrappers and xinetd


    For instance, the following two rules allow SSH connections from client-1.example.com,
    but deny connections from client-2.example.com:


    ```

    sshd : client-1.example.com : allow

    sshd : client-2.example.com : deny

    ```


    By allowing access control on a rule-basis, the option field allows administrators
    to consolidate all access rules into a single file: hosts.allow or hosts.deny.
    Some consider this an easier way of organizing access rules.


    # 15.2.3.3. Shell Commands


    Option fields allow access rules to shell commands through the following two directives:


    +   - spawn Launches a shell command as a child process. This option directive
    can perform tasks like using /usr/sbin/sate_finger to get more information about
    the requesting client or create special logs using the echo command.

    In the example, clients attempting to access Telnet services from the example.com
    domain are queued to a special file:

    inelnet : .example.com \\

    : spawn /bin/echo "/bind/ from $h/var/telnet \

    : allow

    - twist Replaces the replaced service with the specified command. This directive
    is often used to set up traps for intruders (also called “honey pots”). It can
    also be used to send messages to connecting clients. The twist command must occur
    at the end of the line.

    In the example, clients attempting to access FTP services from the example.com
    domain are sent a message via the echo command:

    vsftpd : .example.com \\

    : twist /bin/echo "42 Bad hacker, go away!"


    For more information about shell command options, see the hosts_options man page.


    # 15.2.3.4. Expansions


    Expansions, used in conjunction with the spawn and twist directives provide information
    about the client, and processes involved.


    Below is a list of supported expansions:


    +   - a — The client''s IP address.

    - A — The server''s IP address.

    - c — Supplies a variety of client information, such as the username and hostname,
    or the username and IP address.

    - d — The daemon process name.

    - h — The client''s hostname (or IP address, if the hostname is unavailable).

    - H — The server''s hostname (or IP address, if the hostname is unavailable).

    - n — The client''s hostname. If unavailable, unknown is printed. If the client''s
    hostname and host address do not match, paranoid is printed.

    - N — The server''s hostname. If unavailable, unknown is printed. If the server''s
    hostname and address do not match, paranoid is printed.'
  merge: -1
  img_proc: true
- pgno: 227
  md: "# Chapter 15. TCP Wrappers and xinetd\n\n+   - %p — The daemon process ID.\n\
    - %s — Various types of server information, such as the daemon process and the\
    \ host or IP address of the server.\n- %u — The client's username. If unavailable,\
    \ unknown is printed.\n\nThe following sample rule uses an expansion in conjunction\
    \ with the spawn command to identify the client host in a customized log file.\n\
    \nIt instructs TCP wrappers that if connection to the SSH daemon (sshd) is attempted\
    \ from a host in the example.com domain, execute the echo command to log the attempt,\
    \ including the client hostname (with %h expansion), to a special file:\n\n```\n\
    sshd :example.com \\\\\n  spawn /bin/echo /bin/date access denied to %h>>/var/log/sshd.log\
    \ \\\n  deny\n```\n\nSimilarly, expansions can be used to personalize messages\
    \ back to the client. In the following example, clients attempting to access FTP\
    \ services from the example.com domain that have been banned from the server:\n\
    \n```\nvsftpd :example.com \\\\\n  twist /bin/echo \"421 %h has been banned from\
    \ this server!\"\n```\n\nFor a full explanation of available expansions, as well\
    \ as additional access control options, review section 5 of the pages for hosts_access(man\
    \ 5 hosts_access) and the main page for hosts_options.\n\nFor additional resources\
    \ concerning TCP wrappers, see Section 15.5 Additional Resources.\n\n# 15.3. xinetd\n\
    \nThe xinetd daemon is a TCP wrapped service which controls access to a subset\
    \ of popular network services including FTP, IMAP, and Telnet. It also provides\
    \ service-specific configuration options for access control, enhanced logging,\
    \ binding, redirection, and resource utilization control.\n\nWhen a client attempts\
    \ to connect to a network service controlled by xinetd, the super service receives\
    \ the request and checks for any TCP wrappers access control rules. If access\
    \ is allowed, xinetd verifies the connection is allowed under its access rules\
    \ for that service and that the service is not consuming more than its allotted\
    \ amount of resources or in breach of any defined rules. It starts an instance\
    \ of the requested service and passes control of the connection to it. Once the\
    \ connection is established, xinetd does not interfere further with communication\
    \ between the client and the server.\n\n# 15.4. xinetd Configuration Files\n\n\
    The configuration files for xinetd are as follows:\n\n+   - /etc/xinetd.conf —\
    \ The global xinetd configuration file.\n- /etc/xinetd.d/ — The directory containing\
    \ all service-specific files."
  merge: -1
  img_proc: true
- pgno: 228
  md: "# Chapter 15. TCP Wrappers xinetd\n\n# 15.4.1. The /etc/xinetd.conf File\n\n\
    /etc/xinetd.conf contains general configuration settings which effect every service\
    \ under xinetd's control. It is read once when the xinetd service is started,\
    \ so in order for changes to take effect, the administrator must restart the xinetd\
    \ service. Below is a /etc/xinetd.conf file:\n\n```\ndefaults\n{\n    instances\
    \ = 60\n    log_type = SYLOG authpriv\n    log_on_success = HOST PID\n    log_on_failure\
    \ = HOST\n    cps = 25 30\n}\n```\n\nThese lines control various aspects of xinetd:\n\
    \n+   - Sets the maximum number of requests xinetd facility can handle at once.\n\
    - log_type - Configures xinetd to use the authpriv log facility, which writes\
    \ log entries to the /var/log/secure file. Adding a directive creates a custom\
    \ log file xinetd in the /var/log/xinetd/ directory.\n- log_on_success - Configures\
    \ xinetd to log if the connection is successful. By default, the remote host's\
    \ IP address and the process ID of serving the request are recorded.\n- log_on_failure\
    \ - Configures xinetd to log if there is a connection failure or if the connection\
    \ is not allowed.\n- cps - Configures xinetd to allow no more than 25 connections\
    \ per given service. If this limit is reached, the service is retired for 30 seconds.\n\
    - includedir /etc/xinetd.d/ - Includes options declared in the service-specific\
    \ configuration files located in the /etc/xinetd.d/ directory. Refer to Section\
    \ 15.4.2 The /etc/xinetd.d/Directory for more information about this.\n\n![](img/31025704b51d5760c0228ff0f3db98bf_228_0.png)\n\
    \nOften, both the log_on_success and log_on_failure settings in /etc/xinetd.conf\
    \ are further modified by the service-specific log files. For this reason, more\
    \ information may appear in a given service's log than this file may indicate.\
    \ See Section 15.4.3.1 Logging Options for more logging options.\n\n# 15.4.2.\
    \ The /etc/xinetd.d/ Directory\n\nThe files in the /etc/xinetd.d/ directory contains\
    \ the configuration files for each service managed by xinetd and the names of\
    \ files correspond to the service. As xinetd.conf, this file is read only when\
    \ the xinetd service is started. In order for any changes to take effect, the\
    \ administrator must restart the xinetd service.\n\nThe format of files in the\
    \ /etc/xinetd.d/ directory use the same conventions as /etc/xinetd.conf. The primary\
    \ configuration for each service is stored in separate file to make customization\
    \ easier and less likely to affect other services.\n\nTo get an idea of how these\
    \ files are structured, consider the /etc/xinetd.d/telnet file:"
  merge: -1
  img_proc: true
- pgno: 229
  md: "# Chapter 15. TCP Wrappers and xinetd\n\nservice telnet\n\n```\n{\n  flags\
    \           = REUSE\n  socket_type     = stream\n  wait            = no\n  user\
    \            = root\n  server          = /usr/sbin/in.telnetd\n  log_on_failure\
    \ += USERID\n  disable         = yes\n}\n```\n\nThese lines control various aspects\
    \ of the telnet service:\n\n+   * service — Defines the service name, usually\
    \ to match a service listed in the /etc/services file.\n* flags — Sets any number\
    \ of attributes for the connection. REUSE instructs xinetd to reuse the socket\
    \ for a Telnet connection.\n* socket_type — Sets the network socket for stream.\n\
    * wait — Defines whether the service is single-threaded(yes) or multi-threaded(no).\n\
    * user — Defines what user ID process will run under.\n* server — Defines the\
    \ binary executable to be launched.\n* log_on_failure — Defines logging parameters\
    \ for log_on_failure in addition to those already-defined in xinetd.conf.\n* disable\
    \ — Defines whether the service is active.\n\n# 15.4.3. xinetd Configuration Files\n\
    \nThere are a large assortment of directives available for xinetd protected services.\
    \ This section highlights-some of the more commonly used options.\n\n# 15.4.3.1.\
    \ Logging Options\n\nThe following options are available for both /etc/xinetd.conf\
    \ and the service-specific configuration files in the /etc/xinetd.conf/directory.\n\
    Below is a list of the more commonly used logging options:\n\n+   * ATTEMPT —\
    \ Logs the fact that a attempt was made (log_on_failure).\n* DURATION — Logs the\
    \ length of time the service is used by a remote system (log_on_success).\n* EXIT\
    \ — Logs the status or termination signal of the service (log_on_success).\n*\
    \ HOST — Logs the remote host's IP address (log_on_failure and log_on_success).\n\
    * PID — Logs the process ID of the server receiving the request (log_on_success).\n\
    * RECORD — Records information about the remote system in case the service cannot\
    \ be started. Only particular services, such as login and finger, may use this\
    \ option (log_on_failure).\n* USERID — Logs the remote user using the method defined\
    \ in RFC 1413 for all multi-threaded stream services (log_on_failure and log_on_success).\n\
    \nFor a complete list of logging options, consult the xinetd.conf man page."
  merge: -1
  img_proc: true
- pgno: 230
  md: "# Chapter 15. TCP Wrappers and xinetd\n\n# 15.4.3.2. Access Control Options\n\
    \nUsers of xinetd services can choose to use the TCP wrappers hosts access rules,\
    \ provide access control via the xinetd configuration files, or a mixture of both.\
    \ Information concerning the use of TCP wrappers access control files can be found\
    \ in Section 15.2 Wrappers Configuration Files. This section discusses using xinetd\
    \ to control access services.\n\nNote\nUnlike TCP wrappers, changes to access\
    \ control only take effect if the xinetd administrator restarts the xinetd service.\n\
    \nThe xinetd hosts access control from the method used by TCP wrappers. While\
    \ TCP wrappers places all of the access configuration within two files, /etc/hosts.allow\
    \ and /etc/hosts.deny, each service's file in /etc/xinetd.d can contain its own\
    \ access control rules.\n\nThe following access options are supported by xinetd:\n\
    \n+   - only_from — Allows only the hosts to use the service.\n- no_access — Blocks\
    \ listed hosts from using the service.\n- access_times — Specifies the time when\
    \ a particular service may be used. The time range must be stated in 24-hour format\
    \ notation, HH:MM-HH:MM.\n\nThe only_from and no_access options can use a list\
    \ of IP addresses or hostnames, or can specify any network. TCP wrappers, combining\
    \ xinetd access control with the enhanced logging configuration can enhance security\
    \ by blocking requests from hosts while verbose recording each connection.\n\n\
    For example, the following /etc/xinetd.d/telnet file can be used to block Telnet\
    \ from a particular network group and restrict the overall time that allowed users\
    \ can log in:\n\n```\nservice telnet {\n    disable         = no\n    flags  \
    \         = REUSE\n    socket_type     = stream\n    wait            = no\n  \
    \  user            = root\n    server          = /usr/sbin/in.telnet\n    log_on_failure\
    \ = 10.0.0.1/24\n    no_access       =\n    log_on_success += PID HOST EXIT\n\
    \    access_times    = 09:45-16:15\n}\n```\n\nIn this example, when client is\
    \ from the 10.0.0.1/24 network, such as 10.0.1.2, tries to access the Telnet service,\
    \ it will receive a message stating the following message:\n\nConnection closed\
    \ by foreign host.\n\nIn addition, their login attempt is logged in /var/log/secure\
    \ as follows:\n\n```\nMay 15 17:38:49 boo xinetd[16252]: START: telnet pid=16256\
    \ from=10.0.1.2\nMay 15 17:38:49 boo xinetd[16252]: FAIL: telnet address from=10.0.1.2\n\
    May 15 17:38:49 boo xinetd[16252]: EXIT: telnet status=0 pid=16256\n```"
  merge: -1
  img_proc: true
- pgno: 231
  md: "When using TCP wrappers in conjunction with xinetd access controls, it is important\
    \ to understand the relationship between the two access control mechanisms.\n\n\
    The following is the order of operations followed by xinetd when client requests\
    \ a connection:\n\n+   1. The xinetd daemon accesses the TCP wrappers access rules\
    \ through a libwrap.a library. If a deny rule matches the client host, the connection\
    \ is dropped. If an allow rule matches the client host, the connection is passed\
    \ to xinetd.\n2. The xinetd daemon checks its own access control rules for the\
    \ xinetd service and the requested service. If a deny rule matches the client\
    \ host the connection is dropped. Otherwise, xinetd starts an instance of the\
    \ requested service and passes control of the connection to it.\n\n> Important\n\
    Care should be taken when using TCP wrappers access controls in conjunction with\
    \ xinetd access controls. Misconfiguration can cause undesired effects.\n\n# 15.4.3.3.\
    \ Binding and Redirection Options\n\nThe service configuration files for xinetd\
    \ support binding the service to an IP address and redirecting incoming requests\
    \ for service to another IP address, hostname, or port.\n\nBinding is controlled\
    \ with the bind option in the service-specific configuration files and links the\
    \ service to one IP address on the system. Once configured, the bind option only\
    \ allows requests for the proper IP address to access the service. This way services\
    \ can be bound to different network interfaces based on name.\n\nThis is particularly\
    \ useful for systems with multiple networks or with multiple IP addresses configured.\
    \ On such a system, insecure services like Telnet, can be configured to listen\
    \ only on the interface connected to a private network and not to the interface\
    \ connected with the Internet.\n\nThe redirect option accepts an IP address or\
    \ hostname followed by a port number. It configures the service to redirect all\
    \ requests for this service to the specified host and port number. This feature\
    \ can be used to point to another port number on the same system, redirect the\
    \ request to different IP address on the same machine, shift the request to a\
    \ different system and port number, or any combination of these options. In this\
    \ way, a user connecting to a system may be rerouted to another system with no\
    \ disruption.\n\nThe xinetd daemon is able to accomplish this redirection by spawning\
    \ a process that stays alive for the duration of the connection between the client\
    \ machine and the host actually providing the service, transferring data between\
    \ the two systems.\n\nBut the advantages of bind and redirect options are most\
    \ clearly seen when they are used by binding to a particular IP address on a system\
    \ and redirecting requests for this service to a second machine that only the\
    \ first machine can use, an internal system can be used to provide services for\
    \ a totally different network. Alternatively, these options can be used to limit\
    \ the exposure of a particular service on a multi-homed machine to a known IP\
    \ address, as well as redirect requests for that service to another machine specifically\
    \ configured for that purpose.\n\nFor example, a system that is used as a firewall\
    \ with its Telnet service:\n\n```\nservice telnet\n{\n    socket_type = stream\n\
    \    wait        = no\n    server      = /usr/sbin/in.xinetd\n```"
  merge: -1
  img_proc: true
- pgno: 232
  md: '# Chapter 15. TCP Wrappers and xinetd


    ```

    log_on_success    += DURATION USERID

    log_on_failure    += USERID

    bind               = 123.123.123.123

    redirect           = 10.0.1.1 21 23

    ```


    The bind and redirect options in this file ensure that the Telnet service on the
    machine is bound to the external IP address (123.123.123.123), the one facing
    the Internet. In addition, requests for Telnet service to 123.123.123.123 are
    redirected via a second network adapter to an internal IP address (10.0.1.03)
    that the failure will then the communication between the two systems, and the
    connecting system is connected to 123.123.123.123 when it is actually connected
    to a different machine.


    This feature is particularly useful for users with broadband connections and only
    one fixed IP address. When using Network Address Translation (NAT), services behind
    the gateway using internal IP addresses are not available from outside the gateway.
    However, when services controlled by xinetd are configured with the bind and redirect
    options, the gateway can act as a type of proxy between outside services and a
    particular internal machine. In addition, the various xinetd access control and
    logging options are also available for additional protection, by limiting the
    number of simultaneous connections to the redirected service.


    # 15.4.3.4. Resource Management Options


    The xinetd daemon can add a basic level of protection from a Denial of Service
    (DoS) attacks. Below is a list of directives which can aid in limiting the effectiveness
    of such attacks:


    +   * max_source Defines the maximum number of instances for a service per IP
    address. It accepts only integers as an argument and can be used in both xinetd.conf
    and in the service-specific configuration files in the xinetd.directory.

    * cps Defines the maximum number of connections per second. This directive takes
    two integer arguments separated by white space. The second is the maximum number
    of seconds xinetd must wait before re-enabling the service. It accepts only integers
    as an argument and can be used in both xinetd.conf and in the service-specific
    configuration files in the xinetd.directory.

    * max_load Defines the CPU usage for a service. It accepts a floating point argument.


    There are more resource management options available for xinetd. See the chapter
    titled Server Security in the Red Hat Linux Security Guide for more information.
    Also consult the xinetd.conf man page.


    # 15.5. Additional Resources


    Additional information concerning TCP wrappers and xinetd is available from system
    documentation and on the Web.


    # 15.5.1. Installed Documentation


    The bundled documentation on your system is a good place to start looking for
    additional TCP Wrappers, xinetd, and access control configuration options.'
  merge: -1
  img_proc: true
