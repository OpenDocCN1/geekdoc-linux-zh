- pgno: 234
  md: '# redhat Chapter 16. iptables


    Installed with Red Hat Linux are advanced tools for network packet filtering —
    the process of controlling network packets as they enter, and exit the network
    stack in the kernel. Pre-2.4 kernels relied on ipchains for packet filtering and
    used lists of rules applied to packets at each step of the filtering process.
    The introduction of the 2.4 kernel brought with iptables (also called netfilter),
    is similar to ipchains but greatly expands the scope and control available for
    filtering network packets.


    This chapter focuses on packet filtering basics, defines the differences between
    ipchains and iptables, explains various options available with iptables commands,
    and how filtering rules can be preserved by system reboots.


    For instructions on constructing iptables rules or setting up a firewall based
    on these rules, refer to Section 16.5 Additional Resources.


    > Warning

    The default firewall mechanism of the 2.4 kernel is iptables, but iptables cannot
    be used if ipchains are already running. If ipchains are present at boot time,
    the kernel will issue an error and fail to start iptables.


    The functionality of ipchains is not affected by these errors.


    # 16.1. Packet Filtering


    Traffic moves through a network in packets. A network packet is a collection of
    data in a specific size and format. In order to transmit a file over a network,
    the sending computer must first break the file into packets using the rules of
    the network protocol. Each of these packets holds a small part of the file data.
    Upon receiving the transmission, the target computer reassembles the packets into
    the file.


    +   - filter — The default table for handling network packets.

    - nat — Used to alter packets that create a new connection.

    - mangle — Used for specific types of packet alteration.


    Each of these tables in turn have a group of built-in chains which correspond
    to the actions on the packet by the netfilter.

    The built-chains for the filter table are as follows:


    +   - INPUT — Applies to network packets that are targeted for the host.

    - OUTPUT — Applies to locally-generated network packets.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '220


    Chapter 16. iptables


    +   - FORWARD — Applies to network packets routed through the host.

    The built-in chains for the nat table are as follows:


    +   - PRERUTING — Alters network packets before they arrive.

    - OUTPUT — Alters locally-generated network packets before they are sent out.

    - POSTROUTING — Alters network packets before they are sent out.


    The built-in chains for the mangle table are as follows:


    +   - INPUT — Alters packets targeted for the host.

    - OUTPUT — Alters locally-generated network packets before they are sent out.

    - FORWARD — Alters network packets routed through the host.

    - PREROUTING — Alters incoming network packets before they are routed.

    - POSTROUTING — Alters network packets before they are sent out.


    Every network packet delivered by or sent out of a Linux system is subject to
    at least one table.

    A packet may be checked against multiple rules within each table before the end
    of the chain. The structure and purpose of rules may vary, but they usually seek
    to identify a packet coming from or going to a particular IP address or set of
    addresses using a particular protocol and network service.


    Regardless of its destination, packets match a rule in one of the tables, a target
    or action is applied to them. If the rule specifies an ACCEPT target for the matching,
    the packet skips the rest of the checks and is allowed to continue to its destination.
    If a rule specifies a DROP target, that packet is refused access to the system
    and is sent back to the host that sent the packet. If a rule specifies a QUEUE
    target, the packet is passed to user-space. If a rule specifies the optional REJECT
    target, the packet is dropped, but an error packet is sent to the packet''s originator.


    Every chain has a default policy to ACCEPT, DROP, REJECT, or QUEUE. If none of
    the rules in the chain apply to the packet, then it is dealt with using the default
    policy.

    The iptables command configures these tables, as well as sets up tables if necessary.


    # 16.2. Differences between iptables and ipchains


    At first glance, ipchains and iptables appear to be quite similar. Both methods
    of packet filtering use chains of rules operating within the Linux kernel to decide
    not which packets to let in or out, but also what to do with packets that match
    certain rules. However, iptables offers a much more extensible way of filtering,
    giving the administrator a greater amount of control without building a great
    deal of complexity into the system.


    Specifically, users comfortable with ipchains should be aware of the significant
    differences between ipchains and iptables before attempting to use them.


    +   - Under ipchains, each filtered packet is processed using rules from only
    one chain rather than multiple chains. For instance, a FORWARD packet uses INPUT
    and OUTPUT chains in order to move it to its destination, iptables only sends
    packets to the INPUT chain if they are destined for the local system and only
    sends them to the OUTPUT chain if the local system generated the packets. For
    this reason, the rule design needs to catch a packet in the rule that actually
    sees the packet.


    +   - The DENY target has been changed to DROP. In ipchains, packets that matched
    a rule in a chain could be directed to the DENY target. This target must be changed
    to DROP under iptables.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Chapter 16. iptables 221


    +   * Order matters when placing options in a rule. Previously, ipchains, the
    order of the rule options did not matter. The iptables command uses strict syntax.
    For example, in iptables the protocol (ICMP, TCP, or UDP) must be specified before
    the source or destination ports.


    +   * When specifying interfaces to be used with a rule, you must use incoming
    interfaces (-i option) with INPUT and FORWARD chains and outgoing interfaces (-o
    option) with FORWARD or OUTPUT chains. This is necessary because OUTPUT chains
    are no longer used by incoming interfaces, and INPUT chains are not seen by packets
    moving through outgoing interfaces.


    This is not a comprehensive list of the changes, given that iptables represents
    a fundamentally rewritten network filter. For more specific information, refer
    to the Linux 2.4 Packet Filtering HOWTO in Section 16.5 Additional Resources.


    # 16.3. Options in iptables Commands


    Rules that allow packets to be filtered by the kernel are put in place by running
    the iptables command. When using the iptables command, specify the following options:


    +   * Packet Type — Dictates what type of packets the kernel filters.


    +   * Packet Source/Destination — Dictates which packets the kernel filters based
    on the source or destination of the packet.


    +   * Target — Dictates what action is taken on packets matching the above criteria.


    The options used with iptables rule must be grouped logically, based on the purpose
    and conditions of the overall rule, in order for the rule to be valid.


    # 16.3.1. Tables


    A powerful aspect of iptables is that multiple tables can be used to decide the
    fate of a packet. These tables can be created and stored in the /lib/modules/<kernel-version>/kernel/net/ipv4/netfilter/
    directory, where <kernel-version> corresponds to the kernel number.


    The default table, filter, contains the built-in INPUT, OUTPUT, and FORWARD chains.
    This is similar to the standard chains in use with ipchains. However, by default,
    iptables also includes two additional tables that perform specific packet filtering
    jobs. The nat table can be used to modify the source and destination addresses
    addressed in packets, and the mangle table alters packets in specialized ways.


    Each table contains default chains that perform necessary tasks based on the purpose
    of the table, although new chains can be added to any table.


    # 16.3.2. Structure


    Many iptables have the following structure:


    ```

    iptables [-t <table-name>] <command> <chain-name> <parameter-1> \ <option-1> <parameter-n>
    <option-n>

    ```


    In this example, the <table-name> option allows the user to select a table other
    than the default filter table to use with the command. The <command> option dictates
    a specific action to perform, such as appending or deleting the rule specified
    by the <chain-name> option. Following the <chain-name> are pairs of parameters
    and options that define what will happen when a packet matches the rule.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '222


    Chapter 16. iptables


    When looking at the structure of an iptables command, it is important to remember
    that, unlike other commands, the length and complexity of a iptables command can
    change based on its purpose. A simple command to remove a rule can be very short,
    while a command designed to filter packets from a particular subset using a variety
    of specific parameters and options can be lengthy. When creating iptables commands
    it is helpful to recognize that some parameters and options may need the need
    for other parameters and options to further specify the previous option''s request.
    In order to construct a valid rule, this must continue until every parameter and
    option that requires another set of options is satisfied.


    Type iptables -h to see a comprehensive list of iptables command structures.


    # 16.3.3. Commands


    Commands iptables to perform a specific action. Only one command is allowed per
    iptables command string. With the exception of the help command, all commands
    are written in upper-case characters.


    The iptables commands are as follows:


    +   - -A Appends the iptables rule to the end of the specified chain. This is
    the command used to simply add a rule when order in the chain does not matter.

    - -C Checks a particular rule before adding it to the user-specified chain. This
    command can help you verify complicated iptables by prompting you for additional
    parameters and options.

    - -D Deletes a rule in a particular chain by number (such as 5 for the fifth rule
    in a chain). You can also delete the entire rule, and iptables will delete the
    chain that matches.

    - -E Renames a user-defined chain. This does not affect the structure of the table.

    - -F Flushes the specified chain, which effectively deletes every rule in the
    chain. If no chain is specified, this command flushes every rule from chain.

    - -h Provides a list of command structures, as well as a quick summary of command
    parameters and options.

    - -I Inserts a rule in a chain at a point specified by a user-defined integer
    value. If no number is specified, iptables will place the command at the top of
    the chain.


    ![](img/31025704b51d5760c0228ff0f3db98bf_237_0.png)


    # Caution


    Be aware of which option (-A or -I) is used when adding a rule. The order of the
    rules within a chain are important for determining which rules apply to what packets.


    +   - -L Lists all the rules in the chain specified after the command. To list
    all rules in all chains the default filter, do not specify a chain or table. Otherwise,
    the syntax should be used to list the rules in a specific chain in a particular:

    iptables -L <chain-name> -t <table-name>

    - -N Creates a new chain with a user-specified name.

    - -P Sets the default policy for a particular chain, so that when packets traverse
    an entire chain without matching a rule, they will be sent to a particular target,
    such as ACCEPT or DROP.

    - -R Replaces a rule in a particular chain. The rule''s number must be specified
    after the chain''s name. The first rule in a chain corresponds to rule number
    one.

    - -X Deletes a user-specified chain. Deleting a built-in chain for any table is
    not allowed.


    Powerful options for the -L command that provide rules and allow more verbose
    rule descriptions, others, are described in Section 16.3.7 Listing Options.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# Chapter 16. iptables


    +   - -Z — Zeros the byte and packet counters in all chains for a particular chain.


    # 16.3.4. Parameters


    Once iptables commands are specified, including those used to add, append, delete,
    insert, or replace rules within a particular chain, parameters are required to
    construct a packet filtering rule.


    +   - -c — Resets the counter for a particular rule. This parameter accepts the
    PKTS and BYTES options to specify which counter to reset.


    +   - -d — Sets the destination hostname, IP address, or network of a packet that
    will match the rule. When matching a network, the following IP address/network
    formats are supported:


    +   - N.N.N/M.M.M.M — Where N.N.N is the IP address range and M.M.M.M is the netmask.


    +   - N.N.N/M — Where N.N.N is the IP address and M is the netmask.


    +   - -f — Applies this rule only to fragmented packets.

    By using ! after this parameter, only unfragmented packets will be matched.


    +   - -i — Sets the incoming interface, such as eth0 or pp0. With iptables, this
    optional parameter may only be used with the INPUT and FORWARD chains when used
    with the filter PREROUTING chain with the nat and mangle tables.

    This parameter also supports the following special options:


    +   - ! — Tells parameter not to match, meaning that any specified interfaces
    are specifically excluded from this rule.


    +   - + — A wildcard used to match all interfaces, then every interface is affected
    by the rule. For example, -eth would apply this rule to any Ethernet interface
    except other interfaces, such as pp0.


    If the -i is used but no interface is specified, then the standard options, ACCEPT,
    DROP, QUEUE, and RETURN, as well as extended options that are available through
    modules loaded by default by the Red Linux RPM package, such as LOG, MATCH, and
    REJECT, among others. See the iptables page for more information on these other
    targets.


    You may also make a direct matching to a user-defined chain outside of the current
    chain so that other rules can be applied to the packet.


    If no target is specified, the packet moves past the rule with no nat action.
    However, the counter for this is still increased by one, as the packet matched
    the specified rule.


    +   - -o — Sets the outgoing interface for a rule and may only be used with OUTPUT
    and FORWARD chains in the filter table, and the POSTROUTING chain in the nat and
    mangle tables. This parameter''s options are the same as those of the incoming
    network interface parameter (-i).


    +   -p — Sets the IP protocol for the rule, which can be icmp, tcp, udp, or all,
    to match every supported protocol. In addition, any protocols listed in /etc/protocols
    may also be used. If this option is omitted when creating a rule, a all is the
    default option.


    +   - -s — Sets the source for a particular packet using the same syntax as the
    destination (-d) parameter.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# 16.3.5. Match Options


    Different network protocols provide specialized matching options which may be
    set in specific ways to match a particular packet using that protocol. Of course,
    the protocol must first be specified in the iptables command, by using -p tcp
    <protocol-name> (where <protocol-name> is the target protocol), to make the options
    for that protocol available.


    # 16.3.5.1. TCP Protocol


    These match options are available for the TCP protocol (-p tcp):


    +   - dport Sets the destination port for the packet. Use either a network service
    name (such as www or smtp), port number, or range of ports to configure this option.
    To browse the names and aliases of network services and the port numbers they
    use, view the /etc/services file. The --destination-port match option is synonymous
    with --dport.

    - To specify a range of port numbers, separate the two numbers with a colon (;),
    such as -p tcp --3000:3200. The largest valid range is 0:65535.

    - Use an exclamation point character (!) after the --dport option to tell iptables
    to match all packets which do not use network service or port.

    - --sport Sets the source port of the packet using the same options as --dport.
    The --source match option is synonymous with --sport.

    - --syn Applies to TCP packets designed to initiate communication, commonly called
    SYN packets. Any packets that carry a data payload are not touched. Placing an
    exclamation point character (!) as a flag after the --syn option calls all-SYN
    packets to be matched.

    - --tcp-flags Allows TCP packets with specific bits, or flags, to be matched with
    a rule. The --tcp-flags match option accepts two parameters. The first parameter
    is the mask, which sets the flags to be examined in the packet. The second parameter
    refers to the flag that must be set in order to match.


    +   - ACK

    - FIN

    - PSH

    - RST

    - SYN

    - URG

    - ALL

    - NONE


    For example, an iptables rule which contains -p tcp --tcp-flags ACK, FIN, SYN
    will only match TCP packets that have the SYN flag set and the ACK and FIN flags
    unset.


    Using the exclamation point character (!) after --tcp-flags reverses the effect
    of the match option.


    +   - --tcp-option Attempts to match with TCP-specific options that can be set
    within a particular packet. This match option can also be reversed with the exclamation
    point character (!).'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# Chapter 16. iptables


    # 16.3.5.2. UDP Protocol


    These match options are available for the UDP protocol (-p udp):


    +   - --dport — Specifies the destination port of the UDP packet, using the service
    name, port number, or range of port numbers. The --destination-port match option
    is synonymous with --dport. Refer to the --dport match option in 16.3.5.1 TCP
    Protocol for ways to use this option.

    - --sport Specifies the source port of the UDP packet, using the service name,
    port number, or range of port numbers. The --source-port match option is synonymous
    with --sport. Refer to the --sport match option in 16.3.5.1 TCP Protocol for ways
    to use this option.


    # 16.3.5.3. ICMP Protocol


    These match options are available for the Internet Control Message Protocol (ICMP)
    (-p icmp):


    +   - --icmp-type — Sets the name or number of the ICMP type to match with the
    rule. A list of valid ICMP names can be seen by typing the iptables -p icmp -h
    command.


    # 16.3.5.4. Modules with Additional Options


    Additional match options are available through modules loaded by the iptables
    command. To use a match option, load the module by name using the -m option, such
    as -m <module-name> (replacing <module-name> with the name of the module).


    A large number of modules are available by default. It is possible to create your
    own modules to provide additional match functionality.


    Many modules exist, but only the most popular are discussed here.


    +   - limit Allows limit to be placed on how many packets are matched to a particular
    rule. This is especially beneficial when loading rule matches so that a flood
    of matching packets will not fill up the system log with repetitive messages or
    use system resources.

    The limit module enables the following options:

    - --limit — Sets the number of matches for a particular range of time, specified
    with a number and time modifier in a <number>/<time> format. For example, using
    --limit 5/hour only lets a rule match five times in a single hour

    If a number and time modifier are not used, the default value of 3/hour is assumed.
    Sets a limit on the number of packets to match a rule at one time. This option
    should be used in conjunction with the --limit option, and it accepts a number
    to set the burst threshold.

    If no number is specified, only five packets are initially to match the rule.


    +   - state module — Enables state matching.

    The state module enables the following options:

    - --state — match a packet with the following connection states:

    - ESTABLISHED — The matching packet is associated with other packets in an established
    connection.

    - INVALID — The matching packet cannot be tied to a known connection.'
  merge: -1
