    \ which specifies the vendor of the monitor.\n- ModelName — An optional parameter\
    \ which specifies the monitor's model name.\n- DisplaySize — An optional parameter\
    \ which specifies, in millimeters, the physical size of the monitor's picture\
    \ area.\n- HorizSync — Specifies the range of horizontal sync frequencies compatible\
    \ with the monitor in kHz. These values help the XFree86 server determine the\
    \ validity of built or specified Modeleline entries for the monitor.\n- VertRefresh\
    \ — Specifies the range of vertical refresh frequencies supported by the monitor,\
    \ in kHz. These values help the XFree86 server determine the validity of built\
    \ or specified Modeleline entries for the monitor.\n- Modeleline — An optional\
    \ parameter which specifies additional video models for particular resolutions,\
    \ with certain horizontal sync and vertical refresh frequencies. See XF86Config\
    \ man page for a more detailed explanation of Modeleline entries.\n- Option <option-name>\
    \ — An optional entry which specifies extra parameters for the section. Replace\
    \ <option-name> with a valid option listed for the section in the XF86Config man.\n\
    \n# 7.3.1. Device\n\nEach Device section configures one video card on the system.\
    \ While Device section is the minimum, additional instances may occur for each\
    \ video card.\n\nThe best way to configure a video card is to configure X during\
    \ the installation process or by using X Configuration Tool. For more details\
