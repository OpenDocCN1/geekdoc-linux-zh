- pgno: 22
  md: '# Chapter 1. Boot Process, Init, and Shutdown


    # 1.3. Running Additional Programs at Boot Time


    The /etc/rc.d/rc.local script is executed by the init command at boot or when
    changing runlevels. Adding commands to this script is an easy way to perform necessary
    tasks like starting services or initialize devices without writing complex initialization
    scripts in the /etc/rc.d/init.d/ directory and creating symbolic links.


    The /etc/rc.serial script is used if serial ports are set up at boot time. This
    script runs commands to configure the system''s ports. See the setserial man page
    for more information.


    # 1.4. SysInit Runlevels


    The SysV runlevel system provides a standard process for controlling which programs
    init or halts when initializing a runlevel. SysV init was chosen because it is
    easier to use and more flexible than the traditional BSD-style init.


    The configuration files for SysV init are located in the /etc/rc.d/ directory.
    Within this directory, are the rc.local, rc.sysinit, and, optionally, the rc.serial
    scripts as well as the following directories:


    ```

    init.d/

    rc0.d/

    rc1.d/

    rc2.d/

    rc3.d/

    rc4.d/

    rc5.d/

    rc6.d/

    ```


    The init.d/ directory contains the scripts used by the /sbin/init command when
    controlling services. Each of the numbered directories represent the six default
    runlevels configured by default under Red Hat Linux.


    # 1.4.1. Runlevels


    Runlevels are a state, or mode, defined by the services listed in the SysV /etc/rc.d/rc<x>.d/
    directory, where <x> is the number of the runlevel.


    The idea behind each runlevel revolves around the fact that different systems
    can be used in different ways. For example, a server runs more efficiently without
    the drag on system resources created by the X Window System. Other times, a system
    administrator may need to operate the system at a lower runlevel to perform diagnostic
    tasks, like disk corruption in runlevel 1, when no other users are possibly on
    the system.


    The characteristics of a runlevel determines which services are halted and started
    by init. For instance, runlevel 1 (single user mode) halts any network services,
    while runlevel 3 starts these services. By assigning specific services to be halted
    or started on a given runlevel, init can quickly change the mode of the machine
    without the user manually starting and stopping services.


    The following runlevels are defined by default for Red Hat Linux:


    +   - 0 — Halt

    - 1 — Single-user text mode

    - 2 — Not used (user-definable)

    - 3 — Full multi-user text mode

    - 4 — Not used (user-definable)'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Chapter 1. Boot Process, Init, Shutdown


    +   - 5 Full multi-user graphical mode (with an X-based login screen)

    - 6 Reboot


    In general, users operate Red Hat Linux at runlevel 3 or runlevel 5 — both full
    multi-user modes. Users sometimes customize runlevel 2 and 4 to specific needs.
    They are not used.

    The\ in /etc/inittab. To find the default runlevel for a system, look for the
    line similar to the one below the top of /etc/inittab:


    ```

    id:5:initdefault:

    ```


    The default runlevel listed in the example above is, as the number after the first
    colon indicates. To change it, edit /etc/inittab as root.


    > Warning

    Be careful when editing /etc/inittab. Simple typos can cause the system to become
    unbootable. If this happens, use a boot diskette, enter single-user mode, or enter
    rescue mode to boot the computer and repair the file.

    For more information on single-user and rescue mode, see the chapter titled Rescue
    Mode in the Red Hat Linux Customization Guide.


    It is possible to change the default runlevel at boot-time by modifying the arguments
    passed by the boot loader. For information on changing the runlevel at boot time,
    see Section 2.10 Changing Rules at Boot Time.


    # 1.4.2. Runlevel Utilities


    One of the best ways to configure runlevels is to use an initscript utility. These
    tools are designed to simplify the task of maintaining files in the SysV init
    directory hierarchy and relieves system administrators from having to directly
    manipulate the numerous symbolic links in the subdirectories of /etc/rc.d/.

    Red Hat provides three utilities:


    +   - /sbin/chkconfig — The /sbin/chkconfig utility is a simple command-line tool
    for maintaining the /etc/rc.d/init.d directory hierarchy.

    - /sbin/nntys — The curses-based /sbin/nntys utility provides an interactive text-based
    interface, which some find easier to use than chkconfig.

    - Services Configuration Tool — The graphical Services Configuration Tool (redhat-config-services)
    program is a flexible GTK-based utility for configuring runlevels.


    Please refer to the chapter titled Controlling Access to Services in Red Hat Linux
    Customization Guide for more information regarding these tools.


    # 1.5. Shutting Down


