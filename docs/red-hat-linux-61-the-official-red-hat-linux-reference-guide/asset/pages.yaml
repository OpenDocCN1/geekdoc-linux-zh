  md: '# Chapter 5. The proc File System


    +   - IO-APIC-edge The voltage signal on this interrupt transitions from low to
    high, creating an edge, where the interrupt occurs and is only signaled. This
    kind of interrupt, as well as the IO-APIC-level interrupt, are only seen on processors
    with the 586 family and higher.

    - IO-APIC-level — Generates interrupts when its voltage signal goes high until
    the signal goes low again.


