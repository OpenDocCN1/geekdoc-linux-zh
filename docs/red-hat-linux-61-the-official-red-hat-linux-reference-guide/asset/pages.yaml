    \ such as red/black. For example:\n  color red/black green/blue\n* default <title-name>\
    \ — The default entry title that will be loaded if the menu interface times out.\n\
    * fallback <title-name> — If used, the entry title to try if first attempt fails.\n\
    * hiddenmenu — If used, prevents the GRUB menu interface from being displayed,\
