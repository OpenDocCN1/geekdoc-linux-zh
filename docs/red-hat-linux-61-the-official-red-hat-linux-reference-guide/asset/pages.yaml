- pgno: 214
  md: '# Chapter 14. Pluggable Authentication Modules (PAM)


    # 14.3.2. Control Flag


    All PAM modules generate a success or failure result when called. Control flags
    tell PAM what to do with the result. Since modules can be stacked in a particular
    order, control flags decide how important the success or failure of a particular
    module is to the overall goal of authenticating the user to the service.


    There are four predefined flags:


    +   * **required**— The module must be successful for authentication to continue.
    If a required module fails, the user is not notified until all modules referencing
    that interface are completed.


    +   * **requisite**— The module must be successful for authentication to continue.
    However, if a requisite module fails, the user is notified immediately with a
    message reflecting the failed required or **requisite** module.


    +   * **sufficient**— The module is ignored if it fails. But, if a sufficient
    flagged module result is successful and no required flagged modules above it failed,
    then no other modules are required and the user is authenticated to the service.


    +   * **optional**— The module result is ignored if it fails. If the module result
    is successful, it does not play a role in the overall success or failure of the
    module interface. A module flagged optional becomes necessary for successful authentication
    when there are no other modules referencing that interface. In this case, an optional
    module determines the overall PAM authentication for that interface.


    > The order in required modules are not critical. The sufficient and requisite
    control flags order to become important.


    A control flag syntax allows for more precise control is available for PAM. Please
    see the PAM docs located in `/usr/share/doc/pam/<version-number>/` directory for
    information on this new syntax (where `<version-number>` is the version number
    for PAM).


    # 14.3.3. Module Path


    Module paths tell PAM where to find the pluggable module to be used with the module
    interface specified. Usually, it is provided as the full path to the module, such
    as `/lib/security/pam_stack.so`. However, if the path is not given, then the module
    indicated is assumed to be in `/lib/security/`, the default location for PAM modules.


    # 14.3.4. Module Arguments


    PAM uses arguments to pass information to a pluggable module during authentication
    for some modules.


    For example, `pam_userdb.so` module uses secrets stored in a Berkeley DB file
    to authenticate the user. Berkeley DB is an open database system embedded in many
    applications. The module takes a db argument so that Berkeley DB knows which database
    to use for the requested service.


    A typical `pam_userdb.so` line within a PAM configuration file looks like this:


    ```

    auth required /lib/security/pam_userdb.so db=<path-to-file>

    ```'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# Chapter 14. Pluggable Authentication Modules (PAM)


    In the previous example, replace <path-to-file> with the full path to the Berkeley
    DB database.


    Invalid arguments are ignored and not otherwise affect the success or failure
    of the PAM module. Most modules will report an error to the /var/log/messages
    file.


    # 14.4. Sample PAM Configuration Files


    Below is a sample PAM application configuration file:


    ```

    #PAM-1.0

    auth required /lib/security/pam_security.so

    auth required /lib/security/pam_unix.so shadow nullock

    auth required /lib/security/pam_loginin.so

    account required /lib/security/pam_unix.so

    password required /lib/security/pam_cracklib.so retry=3

    password required /lib/security/pam_unix.so shadow nullock use_authtok

    session required /lib/security/pam_unix.so

    ```


    The first line is a comment as demonstrated by the hash mark (#) at the beginning
    of the line.

    Lines through three modules for login authentication.


    ```

    auth required /lib/security/pam_security.so

    ```


    This module makes sure if the user is trying to log in, the tty on which the user
    is logged exists in the /etc/security file, if that exists.


    ```

    auth required /lib/security/pam_unix.so nullock

    ```


    This module prompts the user for a password and checks the password using the
    information stored in /etc/passwd and, if exists, /etc/shadow. The pam_unix.so
    module automatically detects and uses shadow passwords to authenticate users.
    Please refer to the Section 6.5 Shadow for more information on shadow passwords.


    The argument nullock instructs the pam_unix.so to allow a blank password.


    ```

    auth required /lib/security/pam_login.so

    ```


    This is the final authentication step. It results to see if the file /etc/login
    exists. if login exists and the user is not root, authentication fails.


    ![](img/31025704b51d5760c0228ff0f3db98bf_215_0.png)


    # Note


    In this example, three auth modules are checked, if the first auth module fails.
    This prevents the user from knowing at what stage their authentication failed.
    Such knowledge in the hands of an attacker could allow them to more easily decode
    how to crack the system.


    ```

    account required /lib/security/pam_unix.so

    ```


    This module performs any necessary account verification. For example, if shadow
    passwords have been enabled, the account component of the pam_unix.so module will
    check to see if the account has expired or if the user has not changed the password
    within the grace period.


    ```

    password required /lib/security/pam_cracklib.so retry=3

    ```'
