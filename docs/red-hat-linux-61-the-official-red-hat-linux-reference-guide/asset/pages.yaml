  md: '# 82 Chapter 7. The X Window System


    changes, XFree86 will not be reconfigured. The best way to do this is to the X
    Configuration Tool (redhat-config-xfree86).


    To start the X Configuration Tool while in an X session, go to the Main Button
    (on the Panel) => Settings => Display. After using the X Configuration Tool during
    an X session, changes will take effect after logging out and logging back in.
    For more about the X Configuration Tool refer to the chapter Audio, Video, and
    General Amusement in the Red Hat Linux Getting Guide.


    In some situations, reconfiguring the XFree86 server may require manually editing
    its configuration file, /etc/X11/XFree86Config.For information about the structure
    of this file, see Section 7.3 XFree86 Server Configuration Files.


    # 7.2. Desktop Environments and Window Managers


    Once an XFree86 server is running, X clients can connect to it and create a GUI
    for the user. A range of GUIs are possible with Red Hat Linux, from the rudimentary
    Window Manager to the highly developed, interactive GNOME desktop environment
    most Red Hat Linux users are familiar with latter.


    To create the more advanced GUI many classes of X client applications must connect
    to the XFree86 server: a desktop environment and a window manager.


    # 7.2.1. Desktop Environments


    A desktop environment brings together X clients, when used together, create a
    common graphical environment and development platform.


    Desktop environments have advanced features which allow X clients and other running
    processes to communicate with one another and allow all applications to write
    in that environment to perform advanced tasks, such as drag and drop operations.


    Red Hat Linux provides two environments:


    +   - GNOME — The default desktop environment for Red Hat Linux based on the GTK+
    2 graphical toolkit.


    +   - KDE — An alternative desktop environment based on the Qt 3 graphical toolkit.


    Both GNOME and KDE have advanced productivity applications, such as word processors,
    spreadsheets, and Web browsers as well as tools to customize the look and feel
    of the GUI. Additionally, if both the GTK+ and the Qt libraries are present, applications
    can run in GNOME and versa.


    For information on the customization of the GNOME and KDE desktop environments,
    refer to the Red Hat Linux Getting Started Guide.


    # 7.2.2. Window Managers


    Window managers are client programs which are either part of a desktop environment
    or, in some cases, standalone. Their primary purpose is to control the way graphical
    windows are positioned, resized or moved. Window managers also control title bars,
    window focus behavior, and user-specified key button bindings.


    Five window managers are included with Red Hat Linux:


    +   - kwin — The KWin window manager is the default window manager for the KDE
    desktop environment. It is an efficient window manager which supports custom themes.'
