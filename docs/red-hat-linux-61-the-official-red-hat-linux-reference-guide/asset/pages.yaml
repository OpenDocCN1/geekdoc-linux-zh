- pgno: 252
  md: '# Chapter 18.

    SSH Protocol


    SSH™ allows users to log into host systems remotely. Unlike protocols like FTP
    or Telnet, SSH encrypts the login session, making it impossible for intruders
    to collect unprotected passwords.


    SSH is designed to replace older, less secure applications used to log into remote
    hosts, such as telnet or rsh. A related program scp replaces older programs designed
    to copy files between hosts, such as rcp. Because these older applications do
    not encrypt passwords transmitted between the client and the server, and whenever
    possible. Using secure methods to log into remote systems decreases the risks
    for both the client system and the remote host.


    # 18.1. Features of SSH


    SSH (or Secure Shell) is a protocol which facilitates secure communications between
    two systems using a client/server architecture.


    The protocol provides the following safeguards:


    +   - After an initial connection, the client can verify that it is connecting
    to the same server connected to previously.


    +   - The client transmits its authentication information to the server using
    strong, 128 bit encryption.


    +   - All data sent and received during a session is transferred using 128 bit
    encryption, making intercepted transmissions extremely difficult to decrypt and
    read.


    +   - The client can forward X1¹ applications from the server. This technique,
    called X11 forwarding, provides a means to use secure graphics over a network.


    Because the SSH protocol encrypts everything it sends and receives, it can be
    used to secure insecure protocols. Using a technique called port forwarding, an
    SSH server can become a conduit to secure otherwise insecure protocols, like POP,
    overha overall system and data security.


    Red Hat Linux uses the general OpenSSH package (openssh), the OpenSSH server (openssh-server)
    client. Please see the chapter titled Red Hat Linux Customization Guide for instructions
    on installing and deploying OpenSSH. Note that the OpenSSH packages require the
    OpenSSL package (openssl). OpenSSH installs several important cryptographic libraries
    which enable OpenSSH to provide encrypted communications.


    A large number of client and server programs use the SSH protocol. SSH client
    applications are available for almost every operating system in use.


    # 18.1. Why Use SSH?


    Nefarious computer users have a variety of tools at their disposal which enable
    them to disrupt, intercept, and re-route network traffic in order to gain access
    to a system. In general, these threats can be categorized as:


    +   - Interception of communication between two systems — In this scenario, the
    attacker can be somewhere on the network communicating endpoints, copying any
    information passed between them. The attacker may intercept and keep the information
    or alter the information and send it to the intended recipient.


    > ¹¹ refers to the X11R window display system, traditionally referred to as X.
    Red Hat Linux includes FreeBSD, a widely used, open source Window System, which
    is based on X11R.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# Chapter 18. SSH Protocol


    This attack can be mounted through the use of a packet sniffer — a common network
    utility.


    +   - Impersonation of a particular host — Using this strategy, the attacker''s
    system is configured to pose as the intended result of transmission. If this strategy
    works, the user''s system will remain unaware it is communicating with the rogue
    host.


    This attack can be mounted through techniques known as DNS poisoning ²2 or IP
    spoofing ³3. Both techniques intercept potentially sensitive information, and
    if the interception is for hostile reasons, the results can be disastrous.


    If SSH is used for remote login and file copying, these security threats can be
    greatly diminished. This is because the SSH client and server use digital signatures
    to verify their identity. Additionally, all communication between the client and
    server systems is encrypted. Attempts to spoof the identity of either side of
    communication will not work, as each packet is encrypted using a key known only
    by the local and remote systems.


    # 18.2. SSH Protocol Versions


    The SSH protocol allows any client and server programs built to the protocol''s
    specifications to communicate securely and to be used interchangeably.


    Two varieties of SSH currently exist. SSH version 1 makes use of several encryption
    algorithms (however, some of these have expired) and is vulnerable to a security
    hole that potentially allows an attacker to insert data into the communication
    stream. The OpenSSH suite under Red Hat Linux uses version 2 by default, although
    it also supports version 1.


    ![](img/31025704b51d5760c0228ff0f3db98bf_253_0.png)


    **Important**nIt is recommended that only SSH version 2-compatible servers and
    clients are used whenever possible.


    # 18.3. Event Sequence of an SSH Connection


    +   - A cryptographic handshake is made so that the client can verify that it
    is communicating with the correct server.

    - The transport layer of the connection between client and remote host is encrypted
    using a symmetric cipher.

    - The client authenticates itself to the server.

    - The remote client can now interact safely with the remote host over the encrypted
    connection.


    +   2. DNS poisoning occurs when an intruder cracks a DNS server, pointing client
    systems to a maliciously located host.

    3. IP spoofing occurs when an intruder sends network packets which falsely appear
    to be from a trusted host on the network.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# Chapter 1. SSH Protocol


    # 18.3.1. Transport Layer


    The primary role of the transport layer is to facilitate safe and secure communication
    between the two hosts at the time of after authentication. The transport layer
    accomplishes this by handling the encryption and decryption of data and providing
    integrity protection of data packets as they are sent and received. In addition,
    the transport layer provides compression, speeding the transfer of information.


    Once an SSH client connects a server, key information is exchanged so that the
    two systems can correctly construct the transport layer. The following steps occur
    during this exchange:


    +   - Keys are exchanged

    - The public key encryption algorithm is determined

    - The symmetric encryption algorithm is determined

    - The message authentication algorithm is determined

    - The hash algorithm to be used is determined


    During the exchange, the server identifies itself to the client with a unique
    host key. If the client has never communicated with this particular server before,
    the server''s key will be unknown to the client and will not connect. OpenSSH
    handles this problem by asking the server''s host key after the user is notified
    and verifies the acceptance of the new host key. In subsequent connections, the
    server''s host key is checked against the saved version on the client, providing
    confidence that the client is indeed communicating with the intended server. If,
    in the future, the host key no longer matches, the user must remove the client''s
    saved version before a connection can occur.


    ![](img/31025704b51d5760c0228ff0f3db98bf_254_0.png)


    > It is possible for an attacker to masquerade as the SSH server during the initial
    contact since the local system does not know the difference between the intended
    server and a false one set up by an attacker. To help prevent this, verify the
    integrity of a new SSH server by contacting the server administrator before connecting
    for the first time or in the event of a host key mismatch.


    SSH is designed to work with almost any kind of public key algorithm or encoding
    format. After an initial key exchange creates a hash value for exchanges and a
    shared secret value, the two systems immediately begin calculating new keys and
    algorithms to protect authentication and future data over the connection.


    After a certain amount of data has been transmitted using a given key and algorithm
    (the exact amount depends on the SSH implementation), another key exchange occurs,
    which generates another set of hash values and a new shared secret value. Even
    if an attacker is able to determine the hash and shared secret value, this information
    would be useful only for a limited period of time.


    # 18.3.2. Authentication


    Once the transport layer has constructed a secure tunnel to pass information between
    the two systems, the server tells the client different authentication methods
    supported, such as using a private-encoded signature or typing a password. The
    client then tries to authenticate itself to the server using one of these methods.


    SSH servers and clients can be configured to allow different types of authentication,
    giving each side the optimal amount of control. The server can decide which encryption
    methods it will support based on its security model, and the client can choose
    the order of authentication methods to attempt from among the available options.
    Thanks to the secure nature of the SSH transport layer, even seemingly insecure
    authentication methods, such as a host and password-based authentication, are
    safe to use.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# 18.3.3. Channels


    After a successful authentication for the SSH transport layer, multiple channels
    are opened via a technique called multiplexing. Each of these channels handles
    communication for different terminal sessions and for forwarded X11 sessions.


    Both clients and server create a new channel. Each channel is assigned a different
    number on each end of the connection. When the client attempts to open a new channel,
    the client sends the channel number along with request. This information is stored
    by the server and is used to direct communication to that channel. This is done
    so that different types of sessions will not affect one another and so when a
    given session ends, its channel is closed without disrupting the primary SSH connection.


    Channels also support flow-control, which allows them to send and receive data
    in an orderly fashion. In this way, data is not sent over the channel until the
    client receives a message that the channel is open.


    The client and server negotiate the characteristics of each channel individually,
    depending on the type of service requests and how the user is connected to the
    network. This allows great flexibility in handling different types of remote connections
    without having to change the basic infrastructure of the protocol.


    # 18.4. OpenSSH Configuration Files


    OpenSSH has two sets of configuration files: one for client programs (ssh, scp,
    and sftp) and one for the server daemon (sshd).


    System-wide SSH configuration information is stored in the /etc/ssh/ directory:


    +   - moduli — Contains Diffie-Hellman groups used for the Diffie-Hellman key
    exchange which is critical for constructing a secure transport layer. When keys
    are exchanged at the beginning of an SSH session, a shared secret value is created
    which cannot be determined by either party alone. This value is used to provide
    host authentication.

    - ssh_config — The system-wide default SSH configuration file. It is overridden
    if one is also present in the user''s home directory (~/.ssh/config).

    - ssh_config — The configuration file for the sshd daemon.

    - ssh_host_rsa_key — The DSA private key used by the sshd daemon.

    - ssh_host_rsa_key.pub — The DSA public key used by the sshd daemon.

    - ssh_host_key — The RSA private key used by the sshd daemon for version 1 of
    the SSH protocol.

    - ssh_host_key.pub — The RSA public key used by the sshd daemon for version 1
    of the SSH protocol.

    - ssh_host_rsa_key — The RSA private key used by the sshd daemon for version 2
    of the SSH protocol.

    - ssh_host_rsa_key.pub — The RSA public key used by the sshd daemon for version
    2 of the SSH protocol.


    User-specific SSH configuration information is stored in the user''s home directory
    within the ~/.ssh/


    +   4. A multiplexed connection consists of several signals sent over a shared,
    common medium. With SSH, different channels are sent over a common secure connection.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# Chapter 18. SSH Protocol


    +   - authorized_keys — This file holds a list of authorized public keys for servers.
    When the client connects to the server, the server authenticates the client by
    checking its signed public key stored within this file.


    +   - id_rsa — Contains the DSA private key of the user.


    +   - id_rsa.pub — The DSA public key of the user.


    +   - id_rsa — The RSA private key used by ssh for version 2 of the SSH protocol.


    +   - id_rsa.pub — The RSA public key used by ssh for version 2 of the SSH protocol.


    +   - identity — The RSA public key used by ssh for version 1 of the SSH protocol.


    +   - identity.pub — The RSA public key used by ssh for version 1 of the SSH protocol.


    +   - known_hosts — This file contains DSA host keys of SSH servers accessed by
    the user. This file is very important for ensuring that the SSH client connects
    the correct SSH server.


    ![](img/31025704b51d5760c0228ff0f3db98bf_256_0.png)


    > Important

    If a SSH server''s host key has changed, the client will notify you that the connection
    cannot proceed until the server''s host key is deleted from the known_hosts file
    using a text editor. Before doing this, contact the system administrator of the
    SSH server to verify the server is not compromised.


    See the pages for ssh and sshd for information concerning the various directives
    available in the SSH configuration files.


    # 18.5. More Secure Shell


    A secure command line interface is just the beginning of the many ways SSH can
    be used. By the proper amount of bandwidth, X11 can be directed over an SSH channel.
    Or, by TCP/IP forwarding, insecure port connections between systems can be mapped
    to specific SSH channels.


    # 18.5.1. X11 Forwarding


    Opening an X11 session over an established SSH connection is as easy as running
    an X program on a local machine. When an X program run from the remote shell,
    the SSH client and server create a new channel, and the X program data is sent
    over to the client machine transparently.


    X11 forwarding can be very useful. For example, X11 forwarding can be used to
    create a secure, interactive session with update. To do this, connect to the server
    using ssh and by type:


    ```

    update

    ```


    After supplying the root password for the server, the Red Hot Update Agent will
    appear and allow the remote user to safely update the system.


    # 18.5.2. Port Forwarding


    SSH can secure otherwise insecure TCP/IP protocols via port forwarding. When using
    this technique, the SSH server becomes an encrypted tunnel to the SSH client.


    Port forwarding works by mapping a local port on the client to a remote port on
    the server. SSH can map any port from the server to any port on the client, and
    the port numbers do not need to match for this technique to work.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# Chapter 18. SSH Protocol


    To create a TCP/IP port forwarding channel which listens for connections on the
    localhost, use the following command:


    ```

    ssh -L local-port:remote-hostname:remote-port username@hostname

    ```


    ![](img/31025704b51d5760c0228ff0f3db98bf_257_0.png)


    Note


    Setting up port forwarding to listen on ports below 1024 requires root access.


    To check email on a server called mail.example.com using POP through an encrypted
    connection, use the following command:


    ```

    ssh -L 1100:mail.example.com:110 mail.example.com

    ```


    Once the port forwarding channel is in place between the client machine and the
    mail server, direct a POP mail client to use port 1100 on the localhost to check
    for new mail. Any requests sent to port 1100 on the client will be securely directed
    to the mail.example.com server.


    If mail.example.com is not running an SSH server, but another machine on the network
    is, SSH can still be used to secure port of the connection. However, a different
    connection is necessary:


    ```

    ssh -L 1100:mail.example.com:110 other.example.com

    ```


    In this example, POP requests from port 1100 on the client machine are forwarded
    through the SSH connection on port 22 to the SSH server, other.example.com. Then,
    other.example.com connects to port 110 on mail.example.com to check for new mail.
    Note that by this technique, the connection between the client system and other.example.com
    SSH server is secure.


    Port forwarding can also be used to get information securely through network firewalls.
    If the firewall is configured to allow SSH traffic via its standard port (22)
    but blocks access to other ports, a connection between two hosts using the blocked
    ports is still possible by redirecting their communication over an established
    SSH connection.


    ![](img/31025704b51d5760c0228ff0f3db98bf_257_1.png)


    Note


    Using port to forward connections in this manner allows any user on the client
    system to connect to that service. If the client system becomes compromised, the
    attacker will have all access to forwarded services.


    System administrators concerned about port forwarding can disable this functionality
    on the server by specifying a No parameter for the AllowTcpForwarding line in
    /etc/ssh/sshd_config and restarting the sshd service.


    # 18.6. Requiring SSH for Remote Connections


    For SSH to be truly effective, all insecure connection protocols, such as Telnet
    and FTP should be prohibited. Otherwise, a user''s password may be protected by
    SSH for one session, only to be captured later while logging in using Telnet.


    Some services to disable include:'
  merge: -1
  img_proc: true
