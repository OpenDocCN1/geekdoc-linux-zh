- pgno: 26
  md: '# Chapter 2.

    Boot Loaders


    Before Red Hat Linux can run, it must be loaded into memory by a special program
    called a boot loader. A boot loader usually exists on the system''s primary hard
    drive (or other media device) and has the sole responsibility of loading the Linux
    kernel with its required files or (in some cases) other operating systems into
    memory.


    # 2.1. Boot Loaders and System Architecture


    Each architecture capable of running Red Hat Linux uses a different boot loader.
    For example, the Alpha architecture uses the aboot boot loader, while the Titanium
    architecture uses the ELILO boot loader.


    This chapter discusses commands and configuration options for the two boot loaders
    supplied by Red Hat Linux for the x86 architecture: GRUB and LILO.


    # 2.2. GRUB


    GNU GRand Unified Boot loader or GRUB is a program which enables the user to select
    which installed operating system or kernel to load at system time. It also allows
    the user to pass arguments to the kernel.


    # 2.2.1. GRUB and the x86 Boot Process


    This section discusses in more detail the specific role GRUB plays when booting
    an x86 system. For an look at the overall boot process, see Section 1.2 A Detailed
    Look at the Boot Process.


    GRUB loads itself into memory in the following stages:


    +   The Stage 1 or primary boot loader is read into memory by the BIOS by the
    MBR. The primary boot loader exists on less than 512 bytes of disk space within
    the MBR and is capable of loading either the Stage 1.5 or Stage 2 boot loader.

    The Stage 1.5 boot loader is read into memory by the Stage 1 boot loader, if necessary.
    Some hardware requires an intermediate step to get to the Stage 2 boot loader.
    It is sometimes when the /boot partition is above the 1024 cylinder head of the
    hard drive or using LBA mode. The Stage 1.5 boot loader is found either on the
    /boot partition or on a small part of the MBR and the /boot partition.

    The Stage 2 secondary boot loader is read into memory. The secondary loader displays
    the GRUB menu and command environment. This interface allows you to select which
    operating system or Linux kernel to boot, pass arguments to the kernel, or look
    at system parameters, as available RAM.

    The secondary 2 boot loader reads the operating system and kernel and initrd into
    memory. GRUB determines which operating system to start, it loads it into memory
    and transfers control of the machine to that operating system.


    The boot method used to boot Red Hat Linux is called the direct loading method
    the boot loader loads the operating system directly. There is no intermediary
    between the boot loader and the kernel.


    +   For more on the system BIOS and the MBR, see Section 1.2.1 The BIOS.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '12


    Chapter 2. Boot Loaders


    The boot process used by other operating systems may differ. For example, Microsoft''s
    DOS and Windows operating systems, as well as any other proprietary operating
    systems, are loaded using a chain loading boot method. Under this method, the
    MBR points to the first sector of the partition holding the operating system.
    It finds the files necessary to actually boot that operating system.


    GRUB supports both direct and chain-loading boot methods, allowing it to boot
    almost any operating system.


    Warning


    During installation, the Microsoft''s DOS and Windows installation program completely
    overwrites the MBR, destroying any existing boot loader. If creating a dual-boot
    system, it is best to install the Microsoft operating system first. For instructions
    on how to do this, see the appendix titled Installing Red Hat Linux in a Dual-Boot
    Environment in the Red Hat Linux Installation Guide.


    # 2.2.2. Features of GRUB


    GRUB contains a number of features that make it preferable to other boot loaders
    available for the x86 architecture. Below is a partial list of all the most important
    features:


    +   * GRUB provides a true command-based, pre-OS environment on x86 machines.
    This affords the user maximum flexibility in loading operating systems with certain
    options or gathering information about the system. For years, many x86 architectures
    have developed pre-OS environments that allow booting from a command line. While
    some command features are available with LILO and other x86 boot loaders, GRUB
    is more feature.

    * GRUB supports Logical Block Addressing (LBA) mode. LBA addresses the address
    conversion to boot files in the hard drive''s firmware, and is used by any IDE
    and all SCSI devices. Before LBA, boot loaders could not encounter the 1024-cylinder
    BIOS limitation, where the BIOS could not find a file that cylinder held the disk.
    LBA support allows GRUB to boot operating systems from partitions beyond the 1024-cylinder
    limit, so long as the system BIOS supports LBA. Most modern BIOS revisions support
    LBA.

    * GRUB can read partitions. This functionality allows GRUB to access its configuration
    file, /boot/grub/grub.conf, every time the system boots, eliminating the need
    for the user to write a new version of the first boot loader to MBR when configuration
    changes are made. The only time a user would need to reinstall GRUB on the MBR
    is if the physical location of the /boot partition is moved on the disk. For details
    on installing GRUB to the MBR, see Section 2.3 Installing GRUB.


    # 2.3. Installing GRUB


    If GRUB was not installed during the Red Hat Linux installation process it can
    be installed afterward. Once installed, it becomes the default boot loader.


    Before installing GRUB, make sure to use the latest GRUB package available or
    use the GRUB package from the Red Hat Linux installation CD-ROMs. For instructions
    on installing packages, see the chapter titled Package Management with RPM in
    the Red Hat Linux Customization Guide.


    Once the GRUB package is installed, open a root shell and prompt the command /sbin/grub-install
    <location>, where <location> is where Stage 1 boot loader should be installed.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Chapter. Boot Loaders


    The following command installs GRUB to the MBR of the master IDE device on the
    primary IDE bus: /sbin/grub-install /dev/hda


    The next time system boots, the GRUB graphical loader menu will appear before
    the kernel loads into memory.


    # 2.4. GRUB Terminology


    One of the most important things to understand before using GRUB is how the program
    refers to devices, such as drives and partitions. This information is particularly
    important when configuring GRUB to boot multiple operating systems.


    # 2.4.1. Device Names


    Suppose a system has more than one hard drive. The first hard drive of the system
    is called (hd0) GRUB. The first partition on that drive is called (hd1,0), and
    the fifth partition on the second drive is called (hd1,4). In general, the naming
    convention for files when using GRUB breaks down in this way:


    ```

    <type-of-device><bios-device-number>,<partition-number>

    ```


    The parentheses and comma are very important to the device naming conventions.
    The <type-of-device> refers to whether a hard (hd) or floppy disk (fd) is being
    specified.


    The <bios-device-number> is the number of the device according to the system''s
    BIOS, starting with 0. The secondary IDE hard drive is numbered 1. The ordering
    is roughly equivalent to that the Linux kernel arranges drives by letters, where
    the a in hda relates to 0, the b in hdb relates to 1, and so on.


    ![](img/31025704b51d5760c0228ff0f3db98bf_28_0.png)


    > Note

    GRUB''s numbering system for devices with 0, not 1. Failing to make this distinction
    is one of the most common mistakes made by new GRUB users.


    The <partition-number> relates to one of a specific partition on a disk device.
    While most partitions are specified by numbers, if a system uses BSD partitions,
    they are specified by letters, such as a or c.


    GRUB uses the following naming conventions devices:


    +   - It does not matter if hard drives are IDE or SCSI. All hard drives start
    with fd.

    - To specify an entire device with respect to partitions, leave off the comma
    and the partition number. This is important when telling GRUB to configure the
    MBR for a particular disk. For example, (hd0) specifies the MBR on the first device
    and (hd3) specifies the MBR on the fourth device.

    - If a system has multiple drive devices, it is very important to know the drive
    boot order set in the BIOS. This is rather simple to do if a system has only IDE
    or SCSI drives, but if there is a mix of devices, it can become confusing.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# 2.4.2. File Names and Bootlists


    When typing commands to GRUB involving a file, such as a menu list to use when
    allowing the booting of multiple operating systems, it is necessary to include
    the file immediately after specifying the device and partition.


    A sample specification to an absolute file name is organized as follows:


    ```

    <type-of-device><bios-device-number>, <partition-number>/path/to/file

    ```


    Most of the time, a user will specify files to GRUB by the directory path on that
    partition, plus the file name.


    It is also possible to specify files to GRUB that do not actually appear in the
    file system, such as a chain loader that appears in the first few blocks of a
    partition. To specify these, you must provide a blocklist, which tells GRUB, block
    by block, where the file is located in the partition, since a file can be comprised
    of several different sets of blocks, there is a specific way to write blocklists.
    Each file''s section is described by an offset number of blocks and a number of
    blocks from that offset point, and the sections are put together in a comma-delimited
    order.


    The following is a sample blocklist:


    ```

    05,100+25,200+1

    ```


    This blocklist tells GRUB to use a file that starts at the first block on the
    partition and uses blocks 0 through 49. 99 through 124, and 199.


    Knowing how to write blocklists is useful when using GRUB to load operating systems
    that use chain loading, such as Microsoft Windows. It is possible to leave off
    the offset number of blocks if starting block 0. As an example, the chain loading
    file in the first partition of the first hard drive would have the following:


    ```

    (hd0,0)+1

    ```


    The following shows the chainloader command with a similar blocklist designation
    at the GRUB command line after setting the correct device and partition as root:


    ```

    chainloader +1

    ```


    # 2.4.3. GRUB’s Root File System


    Some users confuse the term "root file system" with GRUB. It is important to remember
    that GRUB’s root file system is the root partition and has nothing to do with
    the Linux root file system.


    The GRUB root file system is the root partition for a particular device. GRUB
    uses this information to mount the device and load files from it.


    With Red Linux, once GRUB has loaded its partition (which equates to the /boot
    partition and contains the Linux kernel), the kernel command can be executed with
    the location of the kernel file as an option. Once the Linux kernel boots, it
    sets the root file system Linux users are familiar with. The original GRUB root
    file system and its mounts are forgotten; they only existed to boot the kernel.


    Refer to the root and kernel commands in Section 2.6 GRUB Commands for more information.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Chapter 2. Boot Loaders


    # 2.5. GRUB Interfaces


    GRUB features three interfaces, which provide different levels of functionality.
    Each of these interfaces allows users to boot the linux kernel or other operating
    systems.


    The interfaces are as follows:


    # Menu Interface


    If GRUB was automatically configured by the Red Hat Linux installation program,
    this is the interface shown by default. A menu of operating systems or kernels
    preconfigured with their own boot commands are displayed as a list, ordered by
    name. Use the arrow keys to select an option other than the default and press
    the [Enter] to boot it. Alternatively, a timeout period is set, so GRUB will start
    the default option.


    Press the [e] to enter the entry interface or the [c] to load a command line interface.


    See Section 2.7 GRUB Menu Configuration File for more information on configuring
    this interface.


    # Menu Entry Interface


    To access the menu entry editor, press the [e] from the boot loader menu. The
    GRUB commands for entry are displayed here, and you may alter these commands before
    booting the operating system by adding a command line ([l] inserts a new line
    after the current line and [O] inserts a new line before it), editing it (e),
    or deleting it ([d]).


    After all changes, the [b] executes the commands and boots the operating system.
    The [Esc] discards any changes and reloads the standard interface. The [c] key
    loads the command interface.


    > Tip For changing runlevels with GRUB using the menu entry editor, refer to Section
    2.10 Changing Runlevels at Boot Time.


    # Command Line Interface


    The command line is the most basic of the GRUB interfaces, but it is also the
    one that grants the most control. The command line makes it possible to type any
    relevant GRUB commands followed by [Enter] to execute them. This interface features
    some advanced shell-like features, including [Tab] key combination, based on context,
    and [Ctrl] key when typing commands, as [Ctrl]-a to move to the beginning of a
    line, and [Ctrl]-e to move to the end of a line. Addition the arrow, [Home], [End],
    and [Delete] keys work as you do in the *bash* shell.


    See Section 2.6 GRUB Commands, for a list of common commands.


    # 2.5.1. Order of the Interfaces


    GRUB loads its secondary boot loader, it first searches for its configuration
    file. Once found, it builds a menu list and displays the menu interface.


    If the configuration file cannot be found, or if the configuration is unreadable,
    GRUB loads the command line interface, allowing the user to type commands to complete
    the boot process.


    If the configuration file is not valid, GRUB prints out the error and asks for
    input. This helps the user see precisely where the problem is occurring. Pressing
    any key reloads the menu option and correct the problem based on the error reported
    by GRUB. If the correction fails, GRUB reports an error and reloads the menu interface.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# GRUB Commands


    # 2.6. GRUB


    GRUB allows a number of useful commands in its command interface. Some of the
    commands accept options after their name; these options should be separated from
    the command and other options on that line by space characters.


    The following is a list of commands:


    +   - boot — The operating system or chain loader that has been previously specified
    and loaded.

    - chainloader `<file-name>` — Loads the file as a chain loader. To grab the file
    at the first sector of the specified partition, use +1 as the file''s name.

    - displaymem — Displays the current use of memory, based on information from the
    BIOS. This is to determine how much RAM has prior to booting.

    - initrd `<file-name>` — Enables users to specify an initial RAM disk to use when
    booting. initrd is necessary when the kernel needs certain modules to boot properly,
    such as when the root partition is formatted with the ext3 file system.

    - install `<stage-1> <install-disk> <stage-2> p <config-file>` — Installs GRUB
    to the MBR.


    When using the install command user must specify the following:


    +   - `<stage-1>` — Signifies a device, partition, and where the first boot loader
    image can be found, as (hd0,0)/stage1.

    - `<install-disk>` — Specifies the disk where the stage 1 boot loader should be
    installed, as (hd0).

    - `<stage-2>` — Passes to the stage 1 boot loader the location of the stage 2
    boot loader is located, as (hd0,0)/grub/stage2.

    - p <config-file>` — This option tells the install command to look for the menu
    configuration file specified by `<config-file>`. An example of a valid path to
    the configuration file is (hd0,0)/grub/grub.conf.


    > Warning

    The install command will overwrite any other information in the MBR. If executed,
    any information (other than GRUB information) that is used to boot other operating
    systems, will be lost.


    +   - kernel `<kernel-name> <option-N>` — Specifies the kernel file to load from
    GRUB''s root file system when using directly booting the operating system. Options
    can follow the kernel command and will be passed to the kernel when it is loaded.

    For Red Hat Linux, an example kernel command looks like the following:

    kernel /mlinuz=dev/hda5

    - root `<device-and-partition>` — Configures GRUB''s root partition to be a specific
    device and partition, such as (hd0,0), and mounts the partition so that files
    can be read.

    - rootovernotify `<device-and-partition>` — Performs the same functions as the
    root command but does not mount the partition.


    This line specifies the vmlinuz file is loaded from GRUB''s root file system,
    as vmlinuz (hd0,0). An option is also passed to the kernel specifying when loading
    the root file system for the Linux kernel, it should be on hd5, the first partition
    on the first hard drive. Multiple options may be placed after this option, if
    needed.


    Commands other than are available. Type info for a full list of commands.'
  merge: -1
  img_proc: true
