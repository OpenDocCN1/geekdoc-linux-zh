- pgno: 200
  md: '# Chapter 13.


    # Lightweight Directory Access Protocol (LDAP)


    Lightweight Directory Access Protocol (LDAP) is a set of protocols used to access
    centrally stored information over a network. It is based on the X.500 standard
    for directory sharing, but is less complex and resource intensive. For this reason,
    LDAP is sometimes referred to as "X.500 Lite."


    Like X.500, LDAP organizes information in a hierarchical manner using directories.
    These directories can store a variety of information and can be used in a manner
    similar to Network Information Service (NIS), enabling anyone to access their
    account from any LDAP enabled network.


    In many cases, LDAP is used simply as a virtual phone directory, allowing users
    to easily contact information for other users. But LDAP is more flexible than
    a traditional phone directory, because it is capable of referring to a other LDAP
    servers over the world, providing an ad-hoc query copy operations. When an LDAP
    client connects to an LDAP server, LDAP is more commonly used within individual
    organizations, like universities, government departments, and private companies.


    LDAP is a client-server system. The server can use a variety of databases to store
    a directory, each optimized for quick and copious read operations. When an LDAP
    client connects to an LDAP server, it can either query a directory or attempt
    to modify it. In the event of a query, the server either answers the query, or
    if not answer, it can refer to an LDAP server which has the answer. If the client
    application is attempting to modify an LDAP directory, the server verifies that
    the user has permission to make the change and then updates or informs.


    This chapter will refer to the configuration and use of OpenLDAP 2.0, an open
    source implementation of the LDAPv2 and LDAPv3 protocols.


    # 13.1. Why Use LDAP?


    The main benefit of using LDAP is that information for an organization can be
    consolidated into a central repository. For example, rather than managing user
    lists for each group within an organization, you can use LDAP as a central directory
    accessible from anywhere on the network. Because LDAP supports Secure Sockets
    Layer (SSL) and Transport Layer Security (TLS), sensitive data can be protected
    from prying eyes.


    LDAP supports a number of back-end databases in which to store. This allows administrators
    to deploy the database suited for the type of information the server is to disseminate.
    LDAP also has a well-defined Client Application Programming Interface (API), and
    the number of LDAP-enabled applications are numerous and increasing in quantity
    and quality.


    On the negative side, LDAP can be difficult to configure.


    # 13.1.1. OpenLDAP 2.0 Feature Enhancements


    OpenLDAP 2.0 includes a number of important features.


    +   - LDAPv3 Support — OpenLDAP 2.0 supports Simple Authentication and Security
    Layer (SASL), Transport Layer Security (TLS), and Secure Socks Layer (SSL), over
    other improvements. Many of the changes in the protocol since LDAPv2 are designed
    to make LDAP more secure.

    - IPv6 Support — OpenLDAP supports the next generation Internet Protocol version
    6.

    - LDAP Over IPC — OpenLDAP can communicate within a system using process communication
    (IPC). This enhances security by obviating the need to communicate over a network.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# Chapter 13. Lightweight Directory Access Protocol (LDAP)


    +   - Updated C API — Improves the way programmers can connect to and use LDAP
    directory servers.

    - LDIFv1 Support — Provides full compliance with the LDAP Data Interchange Format
    (LDIF) version 1.

    - Enhanced Stand-Alone LDAP Server — Includes an updated access control system,
    thread pooling, better tools and much more.


    # 13.2. LDAP Terminology


    Any discussion of LDAP requires a basic understanding of a set of LDAP-specific
    terms:


    +   - entry An entry is a single unit within an LDAP directory. Each entry is
    identified by its unique Distinguished Name (DN).

    - attributes — Attributes are pieces of information directly associated with an
    entry. For example, an organization could be represented as an LDAP entry. Attributes
    associated with the organization might be its fax number, address, and so on.
    People can also be represented as entries in the LDAP directory. Common attributes
    for people include the person''s phone number and email address.


    Some attributes are required, while others are optional. An Objectclass definition
    sets attributes which are required or not for each entry. Objectclass definitions
    are found in various schema files, located in the /etc/openldap/schema/ directory.
    For more information on LDAP schema, see Section 13.5 /etc/openldap/schema/ Directory.


    +   - LDIF The Data Interchange Format (LDIF) is an ASCII text representation
    of LDAP entries. Files used for importing to LDAP servers must be in LDIF format.
    An LDAP entry looks similar to the following:

    ```

    <id>

    dn:<distinguished name>

    <attrype>:<attrvalue>

    <attrype>:<attrvalue>

    <attrype>:<attrvalue>

    ```


    Each entry can contain as many <attrype>:<attrvalue> pairs as needed. A blank
    line indicates the end of an entry.


    > Caution All <attrype> and <attrvalue> pairs must be defined in a corresponding
    schema file to use this information.


    Any value enclosed within a "<\ and a "" is a variable and can be set whenever
    a new LDAP entry is created. This rule does not apply, however, to <id>. The <id>
    is a number determined by the application you use to edit.


    > Note You should never need to edit an LDIF entry by hand. Instead use an LDAP
    client application, such as the ones listed in Section 13.3 OpenLDAP Daemons and
    Utilities.'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'Chapter 13. Lightweight Directory Access Protocol (LDAP) 187


    # 13.3. OpenLDAP Daemons and Utilities


    The suite of OpenLDAP libraries and tools is spread out over the following packages:


    +   - openldap — Contains the libraries necessary to run the OpenLDAP server and
    client applications.

    - openldap-clients — Contains command line tools for viewing and modifying directories
    on an LDAP server.

    - openldap-servers — Contains the servers and other utilities necessary to configure
    and run an LDAP server.


    To perform administrative tasks, the openldap-servers package installs the following
    utilities into


    +   - slapadd — Adds entries from an LDIF file to an LDAP directory. For example,
    the command /usr/sbin/slapadd -l ldif-output writes to the LDIF file, ldif-output,
    containing the new entries.

    - slapcat — Pulls entries out of an LDAP directory in the default format — Berkeley
    — saves them in an LDIF file. For example, the command /usr/sbin/slapcat -l ldif-output
    will output an LDIF file called ldif-output containing the entries from the LDAP
    directory.

    - slapindex — Re-indexes the slapd directory on the current content.

    - slappasswd — Generates an encrypted user password value for use with ldapmodify
    or modify the root pw in the slapd configuration file, /etc/openldap/ldap.conf.
    Execute the /usr/sbin/slpasswd command to create the password.


    Warning

    Be sure to stop slapd by issuing /usr/sbin/service slapd stop before using slapadd,
    slapcat or slapindex. Otherwise, the integrity of the LDAP directory is at risk.


    For more information about how to use these utilities, see their respective man
    pages.

    The openldap-clients package installs tools into /usr/bin/ which are used to add,
    modify, and delete entries in an LDAP directory. These tools include the following:


    +   - ldapmodify — Modifies entries in an LDAP directory, accepting input via
    a file or standard input; ldapadd — Adds entries to your directory by accepting
    input via a file or standard input; ldapadd is actually a link to ldapmodify -a.

    - ldapsearch — Searches for entries in the LDAP directory using a shell prompt.

    - ldapdelete — Deletes entries from an LDAP directory by accepting input via user
    input at the terminal or via a file.


    With the exception of ldapsearch, each of these utilities is most used by referencing
    a file containing the changes to be made rather than typing a command for each
    entry you wish to change in an LDAP directory. The format of such a file is outlined
    in each application''s man page.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# Chapter 13. Lightweight Directory Access Protocol (LDAP)


    # 13.3.1. NSS, PAM, and LDAP


    In addition to the OpenLDAP packages, Red Linux includes a package called nss_ldap
    which enhances LDAP''s ability to integrate into both Linux and UNIX environments.


    The nss_ldap package provides the following modules:


    +   - /lib/libnss_ldap-<glibc-version>.so

    - /lib/security/pam_ldap.so


    The libnss_ldap-<glibc-version>.so module allows applications to look up users,
    groups, hosts, and other information in an LDAP directory via glibc''s Nameservice
    Switch (SSS) interface. NSS allows applications to authenticate using LDAP in
    conjunction with the Network Information Service (NIS) name service and authentication
    files.


    The pam_ldap module allows PAM-aware applications to authenticate users using
    information stored in an LDAP directory. PAM-aware applications include console
    login, POP and IMAP mail servers, and Samba. By deploying an LDAP server on your
    network, all of these applications can authenticate using the same user ID and
    password combination, greatly simplifying administration.


    # 13.3.2. PHP4, the Apache HTTP Server, and LDAP


    Red Linux includes a package containing an LDAP module for the PHP server-side
    scripting language.


    The php-ldap package adds LDAP support to the PHP4 HTML-embedded scripting language
    via the /usr/lib/php4/ldap.so module. This module allows PHP4 scripts to access
    information stored in an LDAP directory.


    ![](img/31025704b51d5760c0228ff0f3db98bf_203_0.png)


    > Red Linux no longer ships with the auth_ldap package. This package provided
    LDAP support for versions 1.3 and earlier of the Apache HTTP Server. See the Apache
    Software Foundation website at http://www.apache.org/ for details on the status
    of this module.


    # 13.3.3. LDAP Client Applications


    There are graphical LDAP clients available which support creating and modifying
    directories, but they do not ship with Red Linux. One such application is LDAP
    Browser/Editor — A Java-based tool available at http://www.iet.edu/~gawojar/ldap.


    Other LDAP clients access directories as read-only, using them to retrieve, but
    not alter, organization-wide information. Some examples of such applications are
    Mozilla-based Web browsers, Sendmail, Balsa, Paine, Evolution, and Gnome Meeting.


    # 13.4. OpenLDAP Configuration Files


    OpenLDAP configuration files are installed into the /etc/openldap/ directory.
    The following is a brief list highlighting the most important directories and
    files:'
