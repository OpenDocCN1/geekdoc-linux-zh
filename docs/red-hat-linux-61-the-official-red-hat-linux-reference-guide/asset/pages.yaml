    \ entries are commonly used in the Device section:\n\n+   - Identifier — Specifies\
    \ a unique name for this Device section. This is a required entry.\n- Driver —\
    \ Specifies which driver the XFree86 server must load in order to utilize the\
    \ video card. A list of drivers can be found in /usr/X1R6/lib/X11/Cards, which\
    \ is installed with the hwdata package."
