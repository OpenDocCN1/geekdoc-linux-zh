    # 13.7.2. Migrating Old Authentication Information to LDAP Format


    The /usr/share/openldap/migration/ directory contains a set of shell and Perl
    scripts for migrating information into LDAP format.


    First, modify the common.conf file so that it reflects your domain. The default
    DNS domain should be changed from its default value to something like:


