    # 7.5. Runlevels and XFree86


    In most cases, the default installation of Red Hat Linux configures a machine
    to boot into a graphical

    login environment, known as runlevel 5. It is possible, however, to boot into
    the text-only multi-user

    mode called runlevel 3 and begin an X session from them.


    For more information about runlevels, refer to Section 1.4 SysV Init Runlevels.


    This section reviews how XFree86 starts this script in runlevel 3 and runlevel
    5.


    # 7.5.1. Runlevel 3


    When in runlevel 3, the best way to start an X session is to log in and type startx.
    The startx

    command is a front-end to the xinit command which launches the XFree86 server
    and connects X

    lients to applications. Because the user is already logged in at runlevel 3, start

    does not launch a display manager or authenticate users. Refer to Section 7.5.2
    for more

    information about display managers.


    When startx is executed, it searches for a .xinitrc file in the user''s home directorynto
    define the desktop environment and possibly other X client applications to run.
    If no .xinitrc is

    present, it will use the default /etc/X11/init/xinitrc file instead.


    The default xinitrc script then loads user-defined files and default system files,
    .X-

    sources, .Xmodmap, and .Xkbmap in the user''s home directory and XResources, Xmodmap,
    and

    Xkbmap in the /etc/X11/init/. The Xmodmap and Xkbmap files, if they exist, are
    used by the

    xmodmap utility to configure the keyboard. The XResources files are read to assign
    specific prefer-

    ences to applications.


    After these options, the xinitrc script executes all scripts, located in the

    /etc/X11/init/xinitrc.d/. One important script in this directory is xinput, which

    configures settings with the default language.


    Next, the xinitrc script tries to execute Xclients in the user''s home directory
    and to

    /etc/X11/init/Xclients if it cannot be found. The purpose of the Xclients file
    is to start

    desktop environment or, possibly, just a window manager. The .Xclients script
    in the

    user''s home directory starts the user-specified desktop environment in the .Xclients-default
    file.

    If .Xclients does not exist in the user''s home directory, the default then /etc/X11/init/Xclients

    script attempts to start another desktop environment, trying GNOME first and KDE
    by

    twm.


    The user is returned to a text mode session after logging out of X from runlevel
    3.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Chapter 7. The X Window System


    # 7.5.2. Runlevel 5


    When the system boots into runlevel 5 a special X application, called a display
    manager is launched. A user must authenticate using the display manager before
    any desktop environments or window managers are launched.


    Depending on the desktop environments installed on the system, three different
    display managers are available to handle user authentication.


    +   - gdm The default display manager for Red Hat Linux, gdm allows the user to
    configure settings, shutdown, restart or log in to the system.

    - KDE’s display manager allows the user to shutdown, restart or log in to the
    system.

    - xdm A basic display manager that only lets the user log in to the system.


    When booting into runlevel 5, the preadm script describes the preferred display
    manager by referencing the /etc/sysconfig/desktop file. Refer to the /usr/share/doc/inscripts-<version-number>/sysconfig.txt
    file (where <version-number> is the version of the package) for a list of options
    available for this file.


    Each of the display managers references the /etc/X11/xdm/Xsetup_file to set the
    login screen. Once the user logs in, the /etc/X11/clients/GiveConsole script runs
    to assign ownership of the console to the user. Then, the /etc/X11/xdm/Xsession
    script runs to accomplish many of the tasks normally performed by the xinitrc
    script starting X from runlevel 3, including system and user resources, as well
    as running the scripts in the /etc/X11/xinitrd.d/


    The user can specify which desktop environment to utilize when authenticating
    using the gdm or xdm by selecting it from the Session menu (accessed by selecting
    Main Menu [Panel] Preferences -> Sessions). If the environment is not specified
    in the display manager, the /etc/X11/xdm/Xsession script will create a .xession
    and .Xclients file. As default, the /etc/X11/xinitrc file is used to select which
    desktop environment to load. A root, or window manager to use as runlevel 5.


    When the user finishes a session on the default display (:) and logs out, the
    /etc/X1/TakeConsole script runs and reassigns ownership of the console to the
    root user. The original display manager, which continued running after the user
    logs in, takes control by spawning a new display manager. This restarts the XFree8
    server, provides a new login window, and starts the process over again.


    The user is returned to the display manager after logging out of X from runlevel
    5.


    For more information about how display managers control user authentication, refer
    to the /usr/share/doc/gdm-<version-number>/README (where <version-number> is the
    version number for the gdm package installed) and the xdm man page.


