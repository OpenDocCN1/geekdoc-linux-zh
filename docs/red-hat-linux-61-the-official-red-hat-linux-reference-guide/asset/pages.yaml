  md: '# Chapter 5. The proc File System


    # 5.3.7. /proc/net/


    This directory provides a comprehensive look at various networking parameters
    and statistics. Each of the files covers a specific range of information related
    to networking on the system. Below is a partial listing of these virtual files:


    +   - arp — Contains the kernel''s ARP table. This file is particularly useful
    for connecting a hardware address to an IP address on a system.

    - atm — A directory containing files with various Asynchronous Transfer Mode (ATM)
    settings and statistics. This directory is primarily used with ATM and ADSL cords.

    - dev — Lists the various network devices configured on the system, complete with
    transmit and receive statistics. This file lists the number of bytes each interface
    has received, the number of packets inbound and outbound, the number of errors
    seen, the number of packets dropped, and more.

    - dev_multcast — Displays the various Layer2 multicast groups each device is listening
    to.

    - igmp — Lists the IP addresses which this system joined.

    - ip_fwchains — If ipchains are in use, this virtual file reveals any current
    rule.

    - ip_fwnames — If ipchains are in, lists all firewall chain names.

    - ip_masquerade — Provides a table of masquerading information under ipchains.

    - ip_mr_cache — Lists the multicast routing cache.

    - ip_mr_vif — Lists multicast interfaces.

    - netstat — Contains a broad detailed collection of networking statistics, including
    TCP time-outs, SYN cookies sent and received, and much more.

    - psched — Lists global packet scheduler parameters.

    - raw — Lists raw statistics.

    - route — Displays the kernel''s routing table.

    - rt_cache — Contains the current routing cache.

    - snmp — List of Simple Network Management Protocol (SNMP) data for various networking
    protocols in use.

    - sockstat — Provides socket statistics.

    - tcp — Contains detailed TCP socket information.

    - tr_rif — Lists the token ring RIF routing table.

    - udp — Contains detailed UDP socket information.

    - unix — Lists UNIX domain sockets currently in use.

    - wireless — Lists wireless interface data.


