- pgno: 216
  md: '# Chapter 14. Pluggable Authentication Modules (PAM)


    If a password has expired, the password component of the pam_cracklib.so module
    prompts for a new password. Then the newly created password to see whether it
    can easily be determined by a dictionary-based password cracking program. If it
    fails this first time, it gives the user two more chances to create a strong password,
    as specified in the retry=3 argument.


    ```

    password required /lib/security/pam_unix.so shadow nullock use_authtok

    ```


    This line specifies that if the program changes the user''s password, it should
    use the password component of the pam_unix.so module to do this. This only happens
    if the auth portion of the pam_unix.so module has determined that the password
    needs to be changed.

    The argument auth tells the module to create passwords when updating a user''s
    password.

    The argument nullock instructs the module to allow the user to change their password
    from a blank password, otherwise a null password is treated as an account.


    The final argument on this line, use_authtok, provides a good example of the importance
    of order when stacking modules. This argument tells the module not to prompt for
    a new password. Instead, it accepts any password that was recorded by a previous
    password module. In this way, all passwords must pass the pam_cracklib.so test
    for secure passwords before being accepted.


    ```

    session required /lib/security/pam_unix.so

    ```


    The final line specifies that the session component of the pam_unix.so module
    will manage the session. This module uses the username and the service type to
    /var/log/messages at the beginning and end of each. It can be supplemented by
    stacking it with other session modules for more functionality.


    The next sample configuration illustrates auth stacking for the login program.


    ```

    #PAM-1.0

    auth required /lib/security/pam_login.so

    auth required /lib/security/pam_securetty.so

    auth required /lib/security/pam_env.so

    auth sufficient /lib/security/pam_rhosts_auth.so

    auth required /lib/security/pam_stack.so service-system-auth

    ```


    First, pam_nologin.so checks to if /etc/login exists. If it does, no one can log
    except for root.


    ```

    auth required /lib/security/pam_securetty.so

    ```


    The pam_securetty.so module prevents root from logging in on insecure terminals.
    This effectively disallows all login attempts by the application''s limited safeguards.


    > Tip

    To log remotely as the root user, use OpenSSH instead. For more information on
    the SSH protocol, see Chapter 18 SSH Protocol.


    ```

    auth required /lib/security/pam_env.so

    ```


    This line loads the pam_env.so module, which sets the environmental variables
    specified in /etc/security/pam_env.conf.


    ```

    auth sufficient /lib/security/pam_rhosts_auth.so

    ```'
