- pgno: 112
  md: '# Chapter 8. redhat

    Network Interfaces


    Under Red Hat Linux, all network communications occur between configured software
    interfaces and physical networking devices connected to the system.


    The configuration files for network interfaces, and the scripts to activate and
    deactivate them, are located in the /etc/sysconfig/network-scripts/ directory.
    Although the number and type of interface files can differ from system to system,
    there are three categories of files that exist in directory:


    +   * Interface configuration files

    * Interface control scripts

    * Network function files


    The files in each of these categories work together to enable various network
    devices under Red Hat Linux.


    This chapter will explore the relationship between these files and how they are
    used.


    # 8.1. Network Configuration Files


    Before delving into the configuration files, let us first quite the primary configuration
    files used in network configuration. Understanding the role these files play in
    setting up the network stack can be helpful when customizing a Red Hat system.

    The primary network configuration files are as follows:


    +   * /etc/hosts — The main purpose of this file is to resolve hostnames that
    cannot be resolved by other way. It can also be used to resolve hostnames on small
    networks with no DNS server. Regardless of the type of network the computer is
    on, this file should contain a line specifying the IP address of the loopback
    device (127.0.0.1) as localhost.localdomain. For more information, see the hosts
    page.

    * /etc/resolv.conf — This file specifies the IP addresses of DNS servers and the
    search domain. Unless configured to do the directives it accepts populate this
    file. For more information on this file, see the resolv.conf page.

    * /etc/sysconfig/network — Specifies routing and host information for all network
    interfaces. For more information, see Section 4.1.23

    /etc/sysconfig/network/

    * /etc/sysconfig/network-scripts/ifcfg-<interface-name> — For each interface on
    a Red Hat Linux system, there is a corresponding interface configuration script.
    Each of these files provide information specific to a particular network interface.
    See Section 8.2 Interface Configuration Files for more information on this type
    of file and the directives it accepts.


    ![](img/31025704b51d5760c0228ff0f3db98bf_112_0.png)


    > Caution

    The /etc/sysconfig/network/ directory is used by the Network Administration Tool
    (redhat-config-network) and its contents should not be edited manually. For more
    information about configuring network interfaces using the Network Administration
    Tool, see the chapter called Network Configuration in the Red Hat Customization
    Guide.'
  merge: -1
  img_proc: true
- pgno: 113
  md: "# Interface Configuration Files\n\nInterface configuration files control the\
    \ software interfaces for individual network devices. As the system boots, it\
    \ uses these files to determine what interfaces to bring up and how to configure\
    \ them. These files are usually named ifcfg-<name>, where <name> refers to the\
    \ name of the device that the configuration file controls.\n\n# 8.2.1. Ethernet\
    \ Interfaces\n\nOne of the most common files is ifcfg-eth0, which controls the\
    \ first Ethernet interface card or NIC in the system. In a system with multiple\
    \ NICs, there are multiple ifcfg-eth-<X> files (where <X> is a unique number corresponding\
    \ to a specific interface). Because each device has its own configuration file,\
    \ an administrator can control how each interface functions individually. Below\
    \ is a sample ifcfg-eth0 file for a system using IP address:\n\n```\nDEVICE=eth0\n\
    BOOTPROTO=none\nONBOOT=yes\nNETWORK=10.0.0.1\nNETMASK=255.255.255.0\nIPADDR=10.0.1.27\n\
    USERCTL=no\n```\n\nThe values required in a configuration file can change based\
    \ on other values. For example, the ifcfg-eth0 file for an interface using DHCP\
    \ looks a bit different, because IP information is provided by the DHCP server:\n\
    \n```\nDEVICE=eth0\nBOOTPROTO=dhcp\nONBOOT=yes\n```\n\nThe Network Administration\
    \ Tool (redhat-config-network) is an easy way to make changes to the various network\
    \ interface configuration files (see the chapter titled Network Configuration\
    \ in the Red Hat Linux Customization Guide for detailed instructions on using\
    \ this tool).\n\nHowever, it is also possible to edit the configuration files\
    \ for a given network interface by hand. Below is a list of the configurable parameters\
    \ in an Ethernet configuration file:\n\n+   - BOPROTO=<protocol>, where <protocol>\
    \ is one of the following:\n  - none No Boot-time protocol should be used.\n \
    \ - bootp — The BOOTP protocol should be used.\n  - dhcp — The DHCP protocol should\
    \ be used.\n- BROADCAST=<address>, where <address> is the broadcast address. This\
    \ directive is deprecated.\n- DEVICE=<name>, where <name> is the name of the physical\
    \ device (except for dynamically-allocated PPP devices where it is the logical\
    \ name).\n- DNS{1,2}=<address>, where address is a server address to be placed\
    \ in /etc/resolv.conf if PEERDNS is set to yes.\n- IPADDR=<address>, where <address>\
    \ is the IP address.\n- NETMASK=<mask>, where <mask> is the netmask value."
  merge: -1
  img_proc: true
- pgno: 114
  md: "# Chapter 8. Network Interfaces\n\n+   - NETWORK=<address>, where <address>\
    \ is the network address. This directive is deprecated.\n- ONBOOT=<answer>, where\
    \ <answer> is one of the following:\n  - yes — This device should be activated\
    \ at boot-time.\n  - no — This device should not be activated at boot-time.\n\n\
    +   - PEERDNS=<answer>, where <answer> is one of the following:\n  - yes — Modify\
    \ /etc/resolv.conf if the DNS directive is set. If using DCHCP, then yes is the\
    \ default.\n  - no — Do not modify /etc/resolv.conf.\n- SRCADDR=<address>, where\
    \ <address> is the source IP address for outgoing packets.\n- USERCTL=<answer>,\
    \ where <answer> is one of the following:\n  - yes — Non-root users are allowed\
    \ to control this device.\n  - no — Non-root users are not allowed to control\
    \ this device.\n\n# 8.2.2. Dialup Interfaces\n\nIf connecting to the Internet\
    \ via a dialup connection, a configuration file is necessary for the interface.\
    \ PPP interface files are named using the following format ifcfg-ppp<x> (where\
    \ <x> is a unique number corresponding to a specific interface).\n\nThe PPP interface\
    \ configuration file is created automatically when wdvial, the Network Administration\
    \ Tool or Kpp is used to create a dialup connection. The Red Hat Linux Getting\
    \ Started Guide contains instructions for using these GUI-based dialup connection\
    \ tools. It is also possible to create and edit this file manually.\n\nThe following\
    \ is a typical ifcfg-ppp0 file:\n\n```\nDEVICE=ppp0\nNAME=test\nWVDIALSELECT=test\n\
    MODEM=/dev/modem\nLINESPEED=115200\nPAPNAME=test\nUSERCTL=true\nONBOOT=no\nPERSIST=no\n\
    DEFROUTE=yes\nERDNS=yes\nDEMAND=no\nIDLETIMEOUT=600\n```\n\nSerial Line Interface\
    \ Protocol (SLIP) is another dialup interface, although it is used less frequently.\
    \ SLIP files have interface configuration file names such as ifcfg-s10.\n\nOther\
    \ options, not discussed, may be used in these files include:\n\n+   - DEFROUTE=<answer>,\
    \ where <answer> is one of the following:"
  merge: -1
  img_proc: true
- pgno: 115
  md: '# Chapter 8. Network Interfaces


    +   - Set this interface as the default route.

    - Do not set this interface as the default route.


    DEMAND=<answer>, where <answer> is one of the following:


    +   - This interface will allow pppd to initiate a connection when someone attempts
    to use it.

    - A connection must be manually established for this interface.


    IDLETIMEOUT=<value>, where <value> is the number of seconds of idle activity before
    the interface disconnect itself.


    INITSTRING=<string>, where <string> is the initialization string passed to the
    modem device. This option is primarily used with SLIP interfaces.


    LINESPE=<value>, where <value> is the baud rate of the device. Possible standard
    values include here 57600, 38400, 19200, and 9600.


    MODEM=<device>, where <device> is the name of the serial device that is used to
    establish the connection.


    MTU=<value>, where <value> is the Maximum Transfer Unit (MTU) for the interface.
    The MTU refers to the largest number of bytes of a frame can carry, not counting
    its header information. In some dialup settings, setting this to a value of 576
    will result in fewer packets dropped and a slight improvement to the throughput
    for a connection.


    NAME=<name>, where <name> is the reference to the title given to a collection
    of dialup configurations.


    PAPNAME=<name>, where <name> is the name of the Password Authentication Protocol
    (PAP) exchange that allows you to connect to a remote system.


    PEERDNS=<answer>, where <answer> is one of the following:


    +   - Modify the system''s /etc/resolv.conf file entries to use the DNS servers
    provided by the remote system when a connection is established.

    - The /etc/resolv.conf file will not be modified.


    PERSIST=<answer>, where <answer> is one of the following:


    +   - This interface should be kept active at all times, even if deactivated by
    a modem up.

    - This interface should not be kept active at all times.


    REMIP=<address>, where <address> is the remote system''s IP address. This is usually
    left unspecified.


    WVDIALSELECT=<name>, where <name> associates this interface with a dialer configuration
    in /etc/wvdial.conf. This file contains the phone number to be dialed and other
    important information for the interface.


    # 8.2.3. Other Interfaces


    Other interface configuration files use these options include the following:'
