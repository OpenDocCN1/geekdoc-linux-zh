- pgno: 116
  md: '# Chapter 8. Network Interfaces


    +   - ifcfg-lo — A local loopback interface is often used in testing, as well
    as being used in a variety of applications that require an IP address pointing
    back to the same system. Any data sent to the loopback device is immediately returned
    to the host''s network layer.


    > > Warning Never edit the loopback interface script, /etc/sysconfig/network-scripts/ifcfg-lo,
    by hand. Doing so can prevent the system from operating correctly.


    +   - ifcfg-ian0 — An infrared interface allows information between devices, such
    as a laptop and a printer, to flow over an infrared link. This works in a similar
    way to an Ethernet device except that it occurs over a peer-to-peer connection.


    +   - ifcfg-plip0 — A Parallel Interface Protocol (PLIP) connection works the
    same way, that it utilizes a parallel port.


    +   - ifcfg-tr0 — Token Rings are not as common on Local Area Networks (LANs)
    as they were once, being eclipsed by Ethernet.


    # 82.4. Alias and Clone Files


    Two lesser-used types of interface configuration files found in the /etc/sysconfig/network-scripts/
    are alias and clone files.

    Interface configuration files takes names in the format of ifcfg-<if-name>:<alias-value>,
    and they allow an alias to point to an interface. For example, ifcfg-eth0:eth0
    file could be configured to specify DEVICE=eth0 and a static IP address of 10.0.0.2,
    serving as an alias of an Ethernet interface already configured to receive its
    IP via DHCP in ifcfg-eth0. At that point, the eth0 device is bound to receive
    a dynamic IP address, but it can be referred to on that system via the 10.0.0.2
    IP address.


    A clone interface configuration file should follow this naming convention, ifcfg-<if-name>:<clone-name>.
    While an alias file is another way to refer to an existing interface configuration
    file, a clone file is used to specify additional options when specifying an interface.
    For example, if you have a DHCP Ethernet interface called eth0, it may look like
    this:


    ```

    DEVICE=eth0

    ONBOOT=yes

    BOOTPROTO=dhcp

    ```


    Since USERCTL is set to no if it is not specified, users cannot bring this interface
    up and down. To give users this ability, create a clone by copying ifcfg-eth0
    to ifcfg-eth0-user and add the following line:


    ```

    USERCTL=yes

    ```


    When a bring up the eth0 interface with the ifup eth0-user command, the configuration
    options from ifcfg-eth0 and ifcfg-eth0-user are combined. While this is a very
    basic example, this method can be used with a variety of options and interfaces.


    The easiest way to create alias and clone interface configuration files is to
    use the graphical Network Administration Tool. For more on using this tool, see
    the chapter Network Configuration in the Red Linux Customization Guide.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# 8.3. Interface Control Scripts


    The interface control scripts activate and deactive system interfaces. There are
    two primary interface control scripts, /sbin/ifdown and /sbin/ifup, that call
    on control scripts located in the /etc/sysconfig/network-scripts/ directory.


    The ifdown and ifup scripts are symbolic links to scripts in the /sbin/ directory.
    When either of these scripts are called, they require the value of the interface
    to be specified, such as:


    At that point, the /etc/rc.d/init.d/functions and /etc/sysconfig/network-functions
    scripts are used to perform a variety of tasks. See Section 8.4 Network Function
    Files for more information.


    After verifying that an interface has been specified and the user executing the
    request is allowed to control the interface, the correct script brings it up or
    down. The following are common interface control scripts:


    +   - ifup-aliases — Configures IP aliases from interface configuration files
    when more than one IP address is associated with an interface.

    - ifdown-cipcb and ifup-cipipb — Used to bring Crypto IP Encapsulation (CIPE)
    connections up and down.

    - ifdown-ipv6 and ifup-ipv6 — Contains IPv6-related function calls using environment
    variables in interface configuration files and /etc/sysconfig/network.

    - ifup-ipx — Used to bring up an IP interface.

    - ifup-plip — Used to bring up a PLIP interface.

    - ifup-plusb — Used to bring up a USB interface for network connections.

    - ifdown-post and ifup-post — Contains commands to be executed after an interface
    is brought up or down.

    - ifdown-ppp and ifup-ppp — Used to bring a PPP interface up or down.

    - ifup-routes — Adds routes for a device as an interface is brought up.

    - ifdown-sit and ifup-sit — Contains function calls related to binding up and
    down an IPv6 tunnel within an IPv4 connection.

    - ifdown-sl and ifup-sl — Used to bring a SLIP interface up or down.


    > Warning:Removing or modifying any scripts in the /etc/sysconfig/network-scripts/
    directory can cause interface connections to act strangely or fail. Only advanced
    users should modify scripts related to a network interface.


    The easiest way to manage all network scripts simultaneously is to use the /sbin/service
    network on the network (/etc/rc.d/init.d/network), as illustrated by the following
    command:


    ```

    /sbin/service network <action>

    ```


    In this example <action> can be either start, stop, or restart.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# Chapter 8. Network Interfaces


    To view a list of configured devices and currently active network interfaces,
    use the following command:


    ```

    /bin/service/network status

    ```


    # 8.4. Network Function Files


    Red Hat Linux uses several files that contain important common functions used
    to bring interfaces up and down. Rather than forcing each interface control file
    to contain these functions, they are grouped together in a few files that are
    called upon necessary.


    The /etc/sysconfig/network-scripts/network-functions file contains the most commonly
    used IPv4 functions, which are useful to many control scripts. These functions
    include connecting running programs that have requested information about changes
    in an interface''s status, setting hostnames, finding a gateway device, seeing
    if a particular device is down, and adding a default route.


    As the functions required for IPv6 interfaces are different than IPv4 interfaces,
    IPv6 support must be enabled in the kernel to communicate via that protocol. A
    function is present in the network-functions file that checks for the presence
    of IPv6 support. Additionally, functions that configure and delete static IPv6
    routes, create and remove tunnels, add and remove IPv6 addresses to an interface,
    and test for the existence of an IPv6 address on an interface can be found in
    this file.


    # 8.5. Additional Resources


    The following resources contain more information concerning network interfaces
    and can be found in the following locations.


    # 8.5.1. Installed Documentation


    +   - /usr/share/doc/initscripts-<version>/sysconfig.txt — A comprehensive guide
    to available options for network configuration files, including IPv6 options not
    covered in this chapter.


    +   - /usr/share/doc/iproute-<version>/ip-cep.ps — PostScript file contains a
    wealth of information about the ip command, which can be used to manipulate routing
    tables, among other things. Use the ghostview and kghostview application to view
    this file.'
  merge: -1
  img_proc: true
