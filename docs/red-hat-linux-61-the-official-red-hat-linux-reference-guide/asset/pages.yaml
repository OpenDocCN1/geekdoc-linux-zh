- pgno: 130
  md: '# Chapter 10.


    # Apache HTTP Server


    The Apache HTTP Server is a robust, commercial-grade open Web server developed
    by the Apache Software Foundation (http://www.apache.org). Red Hat Linux includes
    the Apache HTTP Server version 2.0 as a number of server modules designed to enhance
    its functionality.


    The default configuration file installed with the Apache HTTP Server works without
    alteration for most situations. This chapter outlines many of the Apache HTTP
    Server configuration file (/etc/httpd/conf/httpd.conf) to aid those who need a
    custom configuration or need to convert a configuration file from the older Apache
    Server 1.3 format.


    If using the graphical HTTP Configuration Tool (redhat-config-httpd), do not edit
    the Apache HTTP Server''s configuration file as the HTTP Configuration Tool regenerates
    this file when it is used.


    For more information about the HTTP Configuration Tool, please refer to the chapter
    titled Apache Server Configuration in the Red Hat Linux Customization Guide.


    # 10.1. Apache HTTP Server 2.0


    There are important differences between the Apache HTTP Server version 2.0 and
    version 1.3 (version 1.3 shipped with Red Hat Linux 7.3 and earlier). This section
    reviews many of the features of Apache HTTP Server 2.0 and outlines important
    changes. For instructions on migrating a 1.3 configuration file to the 2.0 format,
    refer to Section 10.2 Migrating Apache HTTP Server 1.3 Configuration Files.


    # 10.1. Features of Apache HTTP Server 2.0


    The arrival of Apache HTTP Server 2.0 brings with it a number of new features.
    Among them are the following:


    +   New API — Modules utilize a new, more powerful set of Application Programming
    Interfaces (APIs).


    +   Modules for Apache HTTP Server 1.3 will not work without being ported to the
    new API. If whether or not a particular module has been ported, consult the developer
    before upgrading.


    +   Filtering — Modules can act as content filters. Refer to Section 10.2.4 Modules
    and Apache HTTP Server 2.0 for more on filtering works.


    +   IPv6 Support — The next generation IP addressing format is supported.


    +   Simplified Directives — A number of confusing directives have been removed
    while others have been simplified. See Section 10.5 Configuration Directives in
    httpd.conf for more information about specific directives.'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'Multilingual Error Responses — When using Server Include (SSI) documents, customizable
    error response pages can be delivered in multiple languages.


    Multiprotocol Support — Multiple protocols are secured.


    A more complete list list of changes can be found online at http://http.apache.org/docs-2.0.


    # 10.1.2. Packaging Changes in Apache HTTP Server 2.0


    Starting with Red Hat Linux 8.0, the Apache HTTP Server packages were renamed.
    Also, some related packages were renamed, deprecated, or incorporated into other
    packages.

    Below is a list of the packaging changes:


    +   * The apache, apache-dev and apache-manual packages were renamed httpd-dev
    and httpd-manual respectively.

    * The mod_dav package were incorporated into the httpd package.

    * The mod_put and mod_roaming packages were removed, their functionality is a
    subset of provided by mod_dav.

    * The mod_auth_any and mod_bandwidth packages were removed.

    * The version number for the mod_ssl package is now synchronized with the httpd
    package. This means that the mod_ssl package for Apache HTTP Server 2.0 has a
    lower version number than mod_ssl package for Apache HTTP Server 1.3.


    # 10.1.3. System Changes in Apache HTTP Server 2.0


    The following changes to the file layout occurring when upgrading to Apache HTTP
    Server 2.0:


    +   * A new configuration directory, /etc/http/conf.d/, has been added. — This
    directory is used to store configuration files for individually packaged modules,
    such as mod_ssl, mod_perl, and php. The server is instructed to load configuration
    files from this location by the directive Include conf/*.conf within the Apache
    HTTP Server configuration file; /etc/http/conf.conf.


    > Important

    It is vital that this line be inserted when merging an existing configuration.


    +   * The ab and logrotate programs have been moved. — These utility programs
    have been moved from the /usr/sbin/ directory and into the /usr/bin/ directory.
    This causes scripts with absolute-paths for these binaries to fail.

    * The dbmanage command has been replaced. — The dbmanage command has been replaced
    with hdbm. See Section 10.2.4.4 The mod_auth_dbm and mod_auth_db Modules for more
    information.

    * The logrotate configuration file has been renamed. — The logrotate configuration
    file has been renamed from /etc/logrotate.d/apache to /etc/logrotate.d/httpd.


    The next section outlines how to migrate an Apache HTTP Server 1.3 configuration
    to the new 2.0 format.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# Chapter 10. Apache HTTP Server


    # 10.2. Managing Apache HTTP Server 1.3 Configuration Files


    If upgrading from Red Hat Linux 7.3 or earlier upon the Apache HTTP Server was
    already installed, then the new stock configuration file for the Apache HTTP Server
    2.0 package is available at /etc/httpd/conf/httpd.confnew and the original version
    1.3 httpd.conf is not touched. It is, of course, entirely up to you whether you
    use the new configuration file and migrate the old one by setting it to or using
    the existing file as a base and modify it; however, some parts of the file have
    changed more than others and a mixed approach is generally the best. The configuration
    files for both version 1.3 and version 2.0 are divided into three sections. The
    goal of this guide is to show what is the easiest route.


    If the /etc/httpd/conf/httpd.conf is a modified version of the default Red Hat
    Linux version and a saved copy of the original is available, it may be necessary
    to invoke the diff command, as in the following example:


    ```

    diff -u httpd.conf.orig httpd.conf | less

    ```


    This command highlights any modifications. If a copy of the original file is not
    available, extract it from an RPM package using the rpm2cpio and cpio commands,
    as in the following example:


    ```

    rpm2cpio apache-<version-number>.i386.rpm | cpio -i --make

    ```


    In the above command, replace <version-number> with the version number for the
    apache package.


    Finally, it is useful to know that the Apache HTTP Server has a testing mode to
    check for configuration errors. To access it, type the following command:


    ```

    apachectl config

    ```


    # 10.2.1. Global Environment Configuration


    The global environment section of the configuration file contains directives which
    affect the overall operation of the Apache HTTP Server, such as the number of
    concurrent requests it can handle and the locations of the various files. This
    section requires a large number of changes compared to the others and it is therefore
    recommended to base this section on the Apache HTTP Server 2.0 configuration and
    migrate the old settings into it.


    # 10.2.1.2. Selecting Which Interfaces and Ports To Bind


    The BindAddress and Port directives no longer exist; their functionality is now
    provided by a more flexible Listen directive.


    If Port was set in the 1.3 version configuration, change it to Listen 80 in the
    2.0 configuration. If Port was set to some value other than 80, append the port
    number to the contents of the ServerName directive.


    For example, the following is a sample Apache HTTP Server 1.3 directive:


    ```

    Port

    123

    ServerName www.example.com

    ```


    To migrate this setting to Apache HTTP Server 2.0, use the following structure:


    ```

    Listen 123

    ServerName www.example.com:123

    ```


    For more on this topic, refer to the following documentation on the Apache Software
    Foundation''s website:'
  merge: -1
  img_proc: true
- pgno: 133
  md: '118


    Chapter 10. Apache HTTP Server


    +   - http://httpd.apache.org/docs-2.0/mod/mpm_common.html#listen

    - http://httpd.apache.org/docs-2.0/mod/core.html#servername


    # 10.2.1.2. Server-pool Size Regulation


    In Apache HTTP Server 2.0, the responsibility for accepting requests and dispatching
    child-processes to handle them has shifted to a group of modules Multi-Processing
    Modules (MPMs). Unlike other modules, only one module from the MPM group can be
    loaded by the Apache HTTP Server. There are three MPM modules that ship with version
    2.0: prefork, worker, and perchild.

    The Apache HTTP Server 1.3 behavior has been moved into the prefork MPM. Currently
    only the prefork MPM is available on Red Hat Linux, although other MPMs may be
    made available at a later date.


    The prefork MPM accepts the same directives as Apache HTTP Server 1.3, so the
    following directives may be migrated directly:


    +   - StartServers

    - MinSpareServers

    - MaxSpareServers

    - MaxClients

    - MaxRequestsPerChild


    For more on this topic, refer to the following documentation on the Apache Software
    Foundation''s website:


    +   - http://httpd.apache.org/docs-2.0/mpm.html (DSO)


    # 10.2.1.3. Dynamic Shared Object (DSO) Support


    There are many changes required, and it is highly recommended that anyone trying
    to modify an Apache HTTP Server 1.3 configuration to suit version 2.0 (as opposed
    to migrating the changes into the version 2.0 configuration) copy this section
    from the stock Red Hat Linux HTTP Server 2.0 configuration file.


    Those who do not want to copy the section from the stock Apache HTTP Server 2.0
    configuration should note the following:


    +   - The AddModule and ClearItemList directives no longer exist. These directives
    used to ensure that modules could be enabled in the correct order. The Apache
    HTTP Server 2.0 API allows modules to specify their ordering, eliminating the
    need for these two directives.

    - The order of the LoadModule lines is no longer relevant.

    - Many modules have been added, removed, renamed, split up, or incorporated with
    each other.

    - LoadModule lines for modules packaged in their own RPMs (mod_php, php, mod_ssl,
    and the like) are no longer necessary as they can be found in the relevant file
    in /etc/http/conf.d/

    - The various HAVE_XXX definitions are no longer defined.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Chapter 10. Apache HTTP Server


    119


    # Important


    If modifying the original file, please note that it is of paramount importance
    that the httpd.conf contains the following directive:


    ```

    Include conf.d/*.conf

    ```


    Omission of this directive will result in the failure of all modules packaged
    in their own RPMs (such as mod_perl, php, and mod_ssl).


    # 10.2.1.4. Global Environment Changes


    The following directives have been removed from Apache HTTP Server 2.0''s configuration:


    +   - ServerType — The Apache HTTP Server can only be run as ServerType standalone
    making this directive irrelevant.

    - AccessConfig and ResourceConfig — These directives have been removed since they
    mirror the functionality of the Include directive. If the AccessConfig and ResourceConfig
    directives are set then replace them with Include directives.


    To ensure that the files are read in order by the older directives the Include
    directive should be placed at the end of httpd.conf, with the one corresponding
    to ResourceConfig preceding the corresponding to AccessConfig. If using default
    values, then explicitly include them as conf/srm.conf and conf/access.conf files.


    # 10.2.2. Main Server Configuration


    The main server section of the configuration file sets up the main server, which
    responds to any requests that are not handled by a <VirtualHost> definition. Values
    here provide defaults for any <VirtualHost> containers defined.


    The directives used in this have changed little between Apache HTTP Server 1.3
    and 2.0. If the main server configuration is heavily customized it may be easier
    to modify the configuration file to suit Apache HTTP Server 2.0. With users with
    only lightly customized main server sections should change their changes into
    the default 2.0 configuration.


    # 10.2.2.1. UserDir Mapping


    The UserDir directive is used to enable URLs such as http://example.com/~bob to
    map a subdirectory within the home directory of the user bob, such as /home/bob/public_html.
    A side-effect of this feature allows a potential attacker to determine whether
    a username is present on the system. For this reason, the default configuration
    for Apache HTTP Server 2.0 disables this directive.


    To enable UserDir mapping, change the directive in httpd.conf from:


    ```

    UserDir disable

    ```


    to the following:


    ```

    UserDir public_html

    ```


    For more on this topic, refer to the documentation on the Apache Software Foundation’s
    website, http://httpd.apache.org/docs-2.0/mod_userdir.html#userdir.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# 10.2.2.2. Logging


    The following logging directives have been removed:


    +   - AgentLog

    - ReferrerLog

    - ReferrerIgnore


    However, agent and refer logs are still available using the CustomLog and LogFormat
    directives. For on this topic, refer to the following documentation on the Apache
    Software Foundation’s website:


    +   - http://httpd.apache.org/docs-2.0/mod/mod_log_config.html#customlog

    - http://httpd.apache.org/docs-2.0/mod/mod_log_config.html#logformat


    # 10.2.2.3. Directory Indexing


    The deprecated FancyIndexing directive has been removed. Same functionality is
    available through the FancyIndexing option within the IndexOptions directive.


    The new VersionSort option to the IndexOptions directive causes files containing
    version numbers to be sorted in a more natural way. For example, httpd-2.0.6.tar
    appears after httpd-2.0.36.tar in a directory page.


    The defaults for the ReadName and HeaderName directives have changed from HEADER
    to README.html and HEADER.html.


    For on this topic, refer to the following documentation on the Apache Software
    Foundation’s website:


    +   - http://httpd.apache.org/docs-2.0/mod/mod_autoindex.html#indexoptions

    - http://httpd.apache.org/docs-2.0/mod/mod_autoindex.html#readmename

    - http://httpd.apache.org/docs-2.0/mod/mod_autoindex.html#headername


    # 10.2.2.4. Content Negotiation


    The CacheNegotiatedDocs directive now takes the argument on or off. Existing instances
    of CacheNegotiatedDocs should be replaced with CacheNegotiatedDocs on.


    For on this topic, refer to the following documentation on the Apache Software
    Foundation’s website:


    +   - http://httpd.apache.org/docs-2.0/mod/mod_negotiation.html#cachenegotiateddocs


    # 10.2.2.5. Error Documents


    To use a hard-coded message with the ErrorDocument directive, the message should
    be enclosed in a pair of double quotation marks [*], rather than just preceded
    by a double quotation mark as required in Apache HTTP Server 1.3.


    To migrate an ErrorDocument setting to Apache HTTP Server 2.0, use the following
    structure:


    ```

    ErrorDocument 404 "The document was not found"

    ```'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# Chapter 10. Apache HTTP Server


