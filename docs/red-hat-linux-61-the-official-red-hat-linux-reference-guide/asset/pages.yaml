  md: 'Chapter 5. The proc File System 61


    # 5.3.4. /proc/fs


    This directory shows which file systems are exported. If running an NFS server,
    typing cat /proc/nfs/exports will display the file systems shared and the permissions
    granted for those file systems. For more sharing file system with NFS, see Chapter
