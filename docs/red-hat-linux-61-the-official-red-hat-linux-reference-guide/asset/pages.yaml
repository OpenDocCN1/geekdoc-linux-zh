    +   - mwm — The Motif window manager, is a basic, standalone window manager. Since
    it is designed to be a standalone window manager, it should not be used in conjunction
    with the GNOME or KDE desktop environments.


    +   - sawfish — The Sawfish window manager is a fully featured window manager
    which was the default for the GNOME desktop environment until the release of Red
    Linux 8.0. It can be used either standalone or with a desktop environment.


    +   - twm — The minimalist Manager, which provides the basic tool set of all the
    window managers and can be used standalone or with a desktop environment. It is
    installed as part of XFree86.


    These window managers can run without desktop environments to gain a better sense
    of their differences. To do this, you type `xinit -e <path-to-window-manager>`
    command, where `<path-to-window-manager>` is the location of the window manager
    binary file. The binary file can be found by typing `<window-manager-name>`.


    # 7.3. XFree86 Server Configuration Files


    The XFree86 server is a single executable (`/usr/X11R/bin/XFree86`) that dynamically
    loads any X server modules at runtime from `/usr/X11R/lib/modules/` directory.
    Some of these are automatically loaded by the XFree86 server, while others must
    be specified in the XFree86 server configuration file.


    The XFree86 server and associated configuration files are stored in the `/etc/X11/`
    directory. The configuration file for the XFree86 is `/etc/X11/XFree86Config`.
    When Red Hat Linux is installed, the configuration files for XFree86 are created
    using information gathered about the system installation process.


    # 7.3.1. XFree86Config


    While there is a need to manually edit `/etc/X11/XFree86Config`, it is useful
    to know about the various sections and optional parameters available, especially
    when troubleshooting.


    # 7.3.1.1. The Structure


    The `/etc/X11/XFree86Config` file is comprised of many different sections which
    address specific aspects of the system hardware. Each section begins with a Section
    `<section-name>` line where `<section-name>` is the title for the section) and
    ends with an End line. Within each of the sections, lines containing option names
    and at least one option value, occasionally in quotes.


    Lines with a hash mark [#] are not read by the XFree86 server and are used for
    human-readable comments.


    Some options within the `/etc/X11/XFree86Config` file accept a boolean switch
    which turns the feature on off. Accept boolean values are:


    +   - 1, on, true or yes — Turns the option on.

    - 0, off, false or no — Turns the option off.


    The following are some of the more important sections ordered as they appear in
    a typical `/etc/X11/XFree86Config` file. More detailed information about the XFree86
    server configuration file can be found in the XFree86Config man page.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# 7.1.2. ServerFlags


    The optional ServerFlags section contains miscellaneous global XFree86 server
    settings. Any settings in this section may be overridden by options in the ServerLayout
    section (refer to Section 7.3.1.3 ServerLayout for details).


    Entries in the ServerFlags section are on their own lines and begin with the term
    Option followed by an option in double quotation marks "[].


    The following is a list of some of the most uses:


    ```

    Section "ServerFlags"

    Option "DontZap" "true"

    EndSection

    ```


    +   * **DontZap** <boolean> — When the value of <boolean> is set to true, this
    setting prevents the use of the [Ctrl]-[Alt]-[Backspace] key combination to immediately
    terminate the XFree86 server.

    * **DontZoom** <boolean> — When the value of <boolean> is set to true, this setting
    prevents cycling through configured video resolutions using the [Ctrl]-[Alt]-[Keypad-Plus]
    and [Ctrl]-[Alt]-[Keypad-Minus] key combinations.


    # 7.3.1.3. ServerLayout


    The ServerLayout section binds the input and output devices controlled by the
    XFree86 server. At this manner, one must specify one output device and at least
    two input devices (a keyboard and a mouse).


    The following example illustrates a typical ServerLayout section:


    ```

    Section "ServerLayout"

    Identifier "Default Layout"

    Screen "Screen0" 0 0

    InputDevice "Mouse0" "CorePointer"

    InputDevice "Keyboard0" "CoreKeyboard"

    EndSection

    ```


    The following entries are commonly used in the ServerLayout section:


    +   * **Identifier** — Specifies a unique name for this ServerLayout section.

    * **Screen** — Specifies the name of a Screen to be used with the XFree86 server.
    More than one Screen options may be present.


    The following is an example of a typical Screen entry:

    Screen "Screen0" 0 0


    The first number in this example Screen entry (0) indicates that the first monitor
    or head on the video card uses the configuration in the Screen section with the
    identifier "Screen0".


    If the video card has more than one head, another Screen would be necessary with
    a different number and a different Screen identifier.


    The numbers to the right of "Screen0" give the X and Y absolute coordinates for
    the upper-left corner of the screen (0 0 by default).


    +   * **InputDevice** — Specifies the name of an InputDevice section to be used
    with the XFree86 server.'
  merge: -1
  img_proc: true
