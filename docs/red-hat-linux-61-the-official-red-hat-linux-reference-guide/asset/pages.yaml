    ```

    warning: /etc/hosts.allow, line: 20: missing newline or line long

    ```


    This sample rule states that if a connection to the SSH daemon (ssh) is attempted
    from a host in the example.com domain, execute the echo command (which will log
    the attempt to a special file), and deny the connection. Because the optional
    deny is used, this line will deny access even if it appears in the hosts.allow
    file. For a more detailed look at available options, see Section 15.2.3 Option
    Fields.


    # 15.2.1. Wildcards


    Wildcards allow TCP wrappers to easily match groups of daemons or hosts. They
    are used most frequently in the client list field of access rules.


    The following wildcards may be used:


    +   - ALL Matches everything. It can be used for the daemon list and the client
    list.

    - LOCAL Matches any host that does not contain a period (.), such as localhost.

    - KNOWN Matches any host where the hostname and host address are unknown or where
    the user is known.

    - UNKNOWN Matches any host where the hostname or host address are unknown or where
    the user is unknown.

    - PARANOID Matches any host where the hostname does not match the host address.


    # Caution


    The KNOWN, UNKNOWN, and PARANOID wildcards should be used with care as a disruption
    in resolution may prevent legitimate users from gaining access to a service.


    # 15.2.1.2. Patterns


    Patterns can be used in the client list field of access rules to more precisely
    specify groups of hosts.


    The following is a list of the most common patterns for a client list entry:


    +   - Hostname beginning with a period (..) — Placing a period at the beginning
    of a hostname, matches all hosts sharing the listed components of the name. The
    following example would apply to any host within the example.com domain:'
  merge: -1
