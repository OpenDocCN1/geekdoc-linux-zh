- pgno: 84
  md: '# Chapter 5. The proc File System


    +   - rsig-max — Configures the maximum number of POSIX realtime signals that
    the system may have queued at any one time. The default value is 1024.

    - rsig-nr — The current number of POSIX realtime signals queued by the kernel.

    - sem — Configures semaphore settings in the kernel. A semaphore is a System V
    IPC object that is used to control utilization of a particular process.

    - shmall — Sets the total amount of shared memory that can be used at one time
    on the system, by bytes. The default value is 209712.

    - shmmax — Sets the largest shared memory size allowed by the kernel, in bytes.
    By default, this value is 3555432. However, the kernel supports much larger values
    than this.

    - shmni — Sets the maximum number of shared memory segments for the whole system,
    in bytes. By default, this value is 4096

    - sysrq — Activates the System Request Key, if this value is set to anything other
    than the default of 0. See 5.3.9/proc/sys/sys for details about the System Request
    Key.

    - threads-max — Sets the maximum number of threads to be used by the kernel, with
    a default value of 2048.

    - version — Displays the date and time the kernel was last compiled. The first
    field in this file, as #3, relates the number of times a kernel was built from
    the source. random stores a number of values related to generating random numbers
    for the kernel.


    # 5.3.9./proc/sys/net/


    This directory contains subdirectories concerning various networking topics. Various
    configurations at the time of kernel compilation make these directories available,
    such as appletalk, ethernet, ipv4, and ipv6. Within these directories, system
    administrators are able to adjust the network configuration on a running system.


    Given the wide variety of possible networking options available with Linux, the
    most common /proc/sys/net/ directories will be discussed.


    The proc/sys/net/core/ directory contains a variety of settings that control the
    interaction between the kernel and networking layers. The most important of these
    files are:


    +   - message-burst — The time in seconds of a new warning message. This is used
    to prevent Denial of Service (DoS) attacks. The default setting is 50.

    - message-cost — Also used to prevent DoS attacks by placing a cost on every warning
    message. The higher the value of this file (default of 5), the more likely the
    warning will be ignored.

    The idea of a DoS attack is to bombard the system with requests that generate
    errors and fill disk partitions with logs or require all of the system''s resources
    to handle the error logging. The settings in message_burst and message_cost are
    designed to be modified based on the system''s recursive need for comprehensive
    logging.

    - netdev_max_backlog — Sets the maximum number of packets allowed to queue when
    a particular interface receives packets faster than the kernel can process them.
    The default value for this is 300.

    - optem_max — Configures the maximum ancillary buffer allowed per socket.

    - rmem_default — Sets the receive socket buffer default size in bytes.

    - rmem_max — Sets the receive socket buffer maximum size in bytes.

    - wmem_default — Sets the send socket buffer default size in bytes.

    - wmem_max — Sets the send socket buffer maximum size in bytes.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# 70 Chapter 5. The proc File System


    /proc/sys/net/ipv4/ contains additional networking settings. Many of these settings,
    used in conjunction with one another, are very useful in preventing attacks on
    the system or using the system as a router.


    ![](img/31025704b51d5760c0228ff0f3db98bf_85_0.png)


    > > Caution

    > An erroneous change to these files may affect remote connectivity to the system.


    Here are some of the most important files in the /proc/sys/net/ipv4/:


    +   - icmp_destreach_rate, icmp_echoreply_rate, icmp_paramprob_rate and icmp_timeexceeded_rate
    — Set the maximum ICMP send packet rate, in 1/100 of a second, to hold under conditions.
    A setting of 0 removes any entry and is not a good idea.

    - icmp_echo_ignore_all and icmp_echo_broadcasts — Allows the kernel to ignore
    ICMP packets from host or only those originating from broadcast and multicast
    addresses. A value of 0 allows the kernel to respond, while a value of 1 ignores
    the packets.

    - ip_default_ttl — Sets the default Time To Live (TTL), which limits the number
    of hops a packet may make before reaching its destination. Increasing this can
    diminish performance.

    - ip_forward — Permits files on the system to forward packets to one another.
    By default, this file is set to 0. Setting it to 1 enables network packet forwarding.

    - ip_local_port_range — Specifies the range of ports to be used for UDP or TCP
    when a port is needed. The first number is the lowest to be used and the second
    number specifies the highest port. Any value from 1024 to 4999 should be used
    in this file.

    - tcp_syn_retries — Provides a limit on the number of times the system will retransmit
    a SYN packet when attempting to make a connection.

    - tcp_retries1 — Sets the number of permitted re-transmissions to answer an incoming
    connection. Default of 3.

    - tcp_retries2 — Sets the number of permitted re-transmissions of TCP packets.
    Default of 15.


    /usr/src/linux-2.4/Documentation/networking/ip-sysctl.txt contains a list of files
    and options in the /proc/sys/net/ipv4/ directory.


    A number of other directories exist within the /proc/sys/net/ipv4/ directory and
    cover each interface configured in different ways, the use of default settings
    for unspecified devices (in /proc/sys/net/ipv4/conf/default/) and settings that
    override overall configurations (in /proc/sys/net/ipv4/conf/all/).


    /proc/sys/net/ipv4/neigh/ contains settings for communicating with a host directly
    connected to the system (called a network neighbor) and also contains settings
    for systems with more than one hop.

    Over routing ipv4 has its own directory, /proc/sys/net/ipv4/, directory specifications
    that apply to routing with any interfaces on the system. Many of these settings,
    such as max_size, max_delay, and min_delay, relate to controlling the size of
    the routing cache. To clear the routing cache, write any value to flush.


    Additional information about these directories and the possible values for your
    configuration files can be found in /usr/src/linux-2.4/Documentation/filesystems/proc.txt.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Chapter 5. The proc File System


    # 5.3.9.5. /proc/sys/vm/


    This directory facilitates the configuration of the Linux kernel''s virtual memory
    (VM) subsystem. The kernel makes extensive and intelligent use of virtual memory,
    which is commonly called swap space.


    The following files are commonly found in the /proc/sys/vm/:


    +   - bflush — Sets various values related to the bflush kernel daemon.


    +   - buffermem — Allows you to control the amount of total system memory to be
    used for buffer memory. Typical output for this file looks like:

    2 10 60

    The first and last values set the minimum and maximum percentage of memory to
    be used as buffer memory, respectively. The middle value sets the percentage of
    system memory dedicated to buffer memory where the memory management system will
    begin to clear cache more than other kinds of memory to compensate for a lack
    of free memory.


    +   - kswapd — Sets various values concerned with the kernel swap-out daemon,
    kswapd. This file has three values:

    52 32 8

    The first value sets the maximum number of pages that kswapd will attempt to free
    in a single attempt. The more aggressively the kernel can move to free pages.
    The second value sets the minimum number of times that kswapd attempts to free
    a page. The third value sets the number of pages kswapd attempts to write in a
    single attempt. Proper tuning of this final value can improve performance on a
    system using a lot of swap space by telling the kernel to write pages in large
    chunks, minimizing the number of disk seeks.


    +   - max_map_count — Configures the maximum number of memory maps a process may
    have. In most cases, the default value of 65536 is appropriate.


    +   - overcommit_memory — When set to default value of 0 the kernel estimates
    the amount of memory available and requests that are blatantly underinflated.
    Unfortunately, since memory is allocated using a heuristic rather than a precise
    algorithm, it can sometimes overload the system.

    If overcommit_memory is set to 1, then the potential for system overload is increased,
    but so is the performance for memory intensive tasks, such as those used by some
    scientific software.

    For those who desire less risk of over commitment, the following options have
    been added. Setting overcommit_memory to 2 fails if a memory request asks to more
    than half of the physical RAM, plus swap. Setting it to 3 fails if a memory request
    adds up to more than swap can hold.


    +   - pagecache — Controls the amount of memory used by the page cache. The values
    in pagecache are percentages, and they work in a similar way as buffermem to ensure
    minimum and maximums of available page cache memory.


    +   - pagecluster — Sets the number of pages read in a single attempt. The default
    value of 4, which actually relates to 16 pages, is appropriate for most systems.


    +   - pagetable_cache — Controls the number of page tables that are cached on
    a per-processor basis. The first and second values relate to the minimum and maximum
    number of page tables to set aside, respectively.


    The usr/src/linux-2.4/Documentation/sysctl/vm.txt file contains additional information
    on these files.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# 5.3.10. /proc/sysvipc/


    This directory contains information about System IPC resources. The files in this
    directory relate to System IPC calls for messages (msg), semaphores (sem), and
    shared memory (shm).


    # 5.3.11. /proc/tty/


    This directory contains information about the available and currently used tty
    devices on the system. Originally called teletype devices, any character-based
    terminals are called tty devices.


    In Linux, there are three different kinds of tty devices. Serial devices are used
    with serial connections, such as a modem or over a serial connection. Virtual
    terminals are used by the common console connection, as the virtual consoles are
    available when pressing [Alt]-[F-Key] at the system level. Pseudo terminals are
    a virtual two-way communication that is used by some higher level applications,
    such as XFree86. The drivers file is a list of currently used tty devices:


    ```

    serial           /dev/cu        5 64-127 serial:callout

    serial           /dev/ttyS      4 64-127 serial

    pty_slave        /dev/pts      136 0-255 pty:slave

    pty_master       /dev/ptm      128 0-255 pty:master

    pty_slave        /dev/ttyp      3 0-255 slave

    pty_master       /dev/pty       2 0-255 pty:master

    /dev/vc0         /dev/vc0       5 0 system:vtmaster

    /dev/ptmx        /dev/ptmx      5 2 system

    /dev/console     /dev/console  1 system:console

    /dev/tty          /dev/tty       5 system:dev/tty

    unknown          /dev/kd        4 1-6 console

    ```


    The /proc/tty/driver file lists the usage statistics and status of each serial
    tty lines.


    In order that tty devices can be used in a similar as network devices, the Linux
    kernel will enforce line discipline on the device. This allows the driver to place
    a specific type of header with every block of data transmitted over the device,
    making it possible for the remote of the connection to see a block of data as
    just one stream of data blocks. SLIP and PPP are common line disciplines, and
    each are commonly connected to systems to one another via serial link.


    Registered line disciplines are stored in the ldiscs file, with detailed information
    available in the ldiscisc directory.


    # 5.4. Using the sysctl command


    The /sbin/sysctl command is used to view, set, and automate kernel settings in
    the /proc/sys/ directory.


    To get a quick overview of all configurable in the /proc/sys/ directory, type
    the /sbin/sysctl -a as root. This will create a large, comprehensive, small portion
    of which looks like this:


    ```

    net.ipv4.route.min_delay = 2

    kernel.sysrk = 0

    kernel.sem = 250 32000 32 128

    ```


    This is the same information if each of the files were viewed individually. The
    only difference is the file location. The /proc/sys/net/ipv4/route/min_delay is
    signed by net.ipv4.route.min_delay, with the directory slashes replaced by dots
    and the proc.sys assumed.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Chapter 5. The proc File System


    The sysctl command can be use in place of echo to assign values to writable files
    in /proc/sys/ directory. For instance instead of using this command:


    ```

    echo 1 > /proc/sys/kernel/sysrq

    ```


    You can use the sysctl command:


    ```

    sysctl -w sysrq="1"

    kernel.sysrq = 1

    ```


    While quickly setting values like that in /proc/sys/ is helpful during testing,
    it does not work as well on a production system. All /proc/sys/ special settings
    are lost when the machine is rebooted. To preserve the settings that you would
    like to make permanent to the kernel, add them to the /etc/sysctl.conf file.


    Every time the system boots, the init program runs the /etc/rc.d/rcinit script.
    This script contains a command to execute sysctl /etc/sysctl.conf to dictate the
    values passed to the kernel. Any values added to /etc/sysctl.conf will affect
    each time the system boots.


    # 5.5. Additional Resources


    Below are additional sources of information about proc file system.


    # 5.5.1. Installed Documentation


    Most of the best /proc/ documentation is available on your system.


    +   - /usr/src/linux-2.4/Documentation/filesystems/proc.txt — Contains assorted,
    but limited information about all aspects of the /proc/ directory.

    - /usr/src/linux-2.4/Documentation/sysrq.txt — An overview of System Request Key
    options.

    - /usr/src/linux-2.4/Documentation/sysctl.txt — A directory containing a variety
    of sysctl tips, including modifying values that concern the kernel (kernel.txt),
    accessing file systems (fs.txt), and virtual memory use (vm.txt).

    - /usr/src/linux-2.4/Documentation/networking/ip-sysctl.txt — A look at various
    IP networking options.

    - /usr/src/linux-2.4/ — Some of the most authoritative information about /proc/
    can be found by reading the kernel source code. Make sure the kernel-source RPM
    is installed on your system and look in the /usr/src/linux-2.4/ directory for
    the source code.


    # 5.5.2. Useful Websites


    +   - http://www.linuxhq.org — This site maintains a complete database of source,
    patches, and documentation for various versions of the Linux kernel.'
  merge: -1
