  md: '# Review Collaborative communication servers


    # # Let''s Chat


    Simple to deploy and simple to use. But does that make it a simpleton?


    # # Mattermost


    Does it really deserve all the attention that it gets?


    ![](img/80af6fd0c5ad221222cba94201825f7f_81_0.png)


    Let''s Chat doesn''t have any desktop or mobile clients and can only be via a
    web browser


    ![](img/80af6fd0c5ad221222cba94201825f7f_81_1.png)


    It might not sound exciting, but threaded conversations is one of the features
    of Mattermost


    # ## Features


    For a small project, Let''s Chat has a list of features. It has persistent messages
    and a searchable chat history. You can use it to create public chat rooms and
    also password-protected ones. When you use Tyler @style during conversations,
    Let''s Chat will notify the called out user.


    # ## Features


    In addition to the group chat features, it has persistent history and private
    chats. Mattermost offers many options such as easy to reply messages and organise
    them as threads. It also supports a variety of built-in and custom actionable
    channels that are prefixed with a ''#'', like IRC.


    # ## Types of communications


    Let''s Chat is basically designed to handle text-based communications and doesn''t
    include any feature to multi-media enhancements. You can, however, allow media
    files to be uploaded, besides that are displayed inline, all others show up as
    download links.


    # ## Types of communications


    While Mattermost also supports text-chats, it does so with a richness that enriches
    the conversations. It allows you to edit messages, create private rooms and also
    have private one-on-one conversations. You can add multimedia to messages, which
    can be viewed inline and downloaded.


    # ## Developer-friendly features


    Let''s Chat is not designed for conversations that happen around, so you won''t
    find any collaboration like syntax highlighting or integrations with repositories,
    authors and platforms like GitHub, Jenkins and Jira. You can copy code blocks
    and they''ll stand out from the rest of the chat, but that is about.


    # ## Developer-friendly features


    Mattermost has proper support and offers many well-documented options for formatting
    everything from emojis to tables. It is appropriate that it supports syntax highlighting
    for over a programming languages, offers multiple themes and can even display
    maths using LaTeX.


    # ## Ease of deployment


    Written in Python, it uses the Node.js runtime and is easy to install with a single
    command using npm. However, to use it you''ll have to manually configure its configuration
    file in a text editor. Once, the configuration file is manageable of size, but
    still,


    # ## Ease of deployment


    The website has installation instructions and offers flexibility to choose components
    based on your user base. The best client which isn''t really different from the
    web interface, Mattermost has apps for windows and mac. The mobile apps for iOS
    and Android also get notifications about messages.


    # ## Overall


    It is a step up from text-only group chat platforms like IRC, but no syntax highlighting
    and manual configuration, Let''s Chat offers little besides persistent chat history.


    # ## Overall


    With its long list of features and comprehensive settings panel, Mattermost truly
    enhances interactions by adding dimensions to text-based chats that aren''t offered
    by traditional platforms.'
