  md: '# OpenSource


    Your source of Linux news & views


    # INTERVIEW ELEMENTARY OS


    # The distro of effortless design


    There''s a bewildering array of Linux distros to choose from, but one distro has
    always set the bar high in UX and design. We spoke to Cassidy James Blaede, co-founder
    of elementary OS, about its latest release


    ![](img/80af6fd0c5ad221222cba94201825f7f_11_0.png)


    Cassidy James Blaede

    is a UX architect and a co-founder of elementary OS. He''s employed at System76,
    the stylish novice-only computer resell that Ubuntu systems, where he works as
    a front-end and UX architect.


    How is elementary OS?

    We had it in 2011 and that was elementary OS Jupiter. But how the old OS is as
    far as we go online. Daniel Foré, the co-founder, actually started on [it] back
    in 2007, almost ten years ago. Or, he started work with the icon set, style sheet
    and that point was really small - a project that helped him make his Linux install
    look better - and from it grew into the applications that were designed to work
    with the style sheet. In 2010, the best way to deliver these applications, style
    sheet and icons to people was putting it all together in one OS.


    If you wanted to encapsulate elementary OS stands for an operating system, how
    would you explain that to someone who has never used it?

    That really depends on where that person is coming from. If they are a Linux user
    already, it''s almost harder because being a Linux user and used to the whole
