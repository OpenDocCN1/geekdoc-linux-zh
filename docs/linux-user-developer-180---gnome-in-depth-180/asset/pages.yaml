  md: '# # SUPERCOMPUTING

    IN THE UK


    The UK''s fastest computer, which occupies the 11th slot in the Top 500 list,
    is a Cray XC40. Based on the Q502 chip, Intel Xeon E5-2699v processor and 1.6
    petabytes (1.6 million gigabytes) of memory, its 241,920 cores achieve a throughput
    of 6.7 PFLOPS.


    And if you like-bogging statistics, you''ll be intrigued to learn that, at 18
    tonnes, it weighs as much as 11 double-cker buses.


    Although it cost £97 million, the Met Office believes it is worth every penny
    and then some over. It''s been suggested that the supercomputer, which became
    operational in April 2010, will enable the UK to lead the world in weather forecasting,
    as could save billions. By 2020, it could deliver £2 billion worth of socio-economic
    benefits through enhanced resilience to weather and related hazards.


    ![](img/80af6fd0c5ad221222cba94201825f7f_66_0.png)


    Customizability is also enhanced by the fact that Linux is open source, most supercomputers
    use a version of Linux with modified kernel. The stability of Linux is ever important
    because high-performance computers don''t crash as often as Windows. For example,
    the Top 500 list in 2016 had 29 nodes with 24,851 cores. Six months later, it
    had reached 300 cores. The ultimate goal is to reach up to 40,000. Linux makes
    these upgrades as painless as possible.


    Price is not an issue when choosing Linux


    The community support available for Linux is a key factor. It''s much easier to
    get into the Top 500 list when you don''t have to pay a fortune for the software
    used for research or commercial applications. Nevertheless, the world of the top''s
    computers is a community for sharing knowledge completely.


    # ## Solving the world''s problems


    Supercomputers might be used for security and commercial applications, but that
    don''t narrow down to a lot. To conclude our investigation of this world where
    performance is paramount, there''s a lot to say to which these extraordinary machines
    are put.


    The crux is that today''s supercomputers achieve their speed using vast numbers
    of cores, applications must be inherently parallel. According to Amdahl''s Law,
    the ability of an application to benefit from a massively parallel architecture
    is limited by its serial part. If 1% is serial, the speed-up will be up to ten
    times of a single core; if only 5% is serial, very little improvement can be expected
    as you add more cores beyond 256, with the maximum being a 20-fold increase.


    Cray has been seen first in 1967, perhaps not notably by John Gustafson, who said
    that ''parallel machines are better than serial ones, even if we need to make
    the software as parallel as still possible''


    The classic classes of tasks that are inherently parallel and which many improvements
    can make become although. These activities involve solving equations for temperature,
    wind speed, velocity, and so on for thousands or millions of points in the atmosphere,
    which need to be solved for each point independently.


    Other uses include finite element analysis in automotive and aerospace applications,
    oil and gas exploration, and many others. However, some believe that the fastest
    supercomputers don''t appear in the Top 500 clusters at facilities, such as NASA''s
    GQCH in the UK, which are used for monitoring email and traffic and encoding data.
