  md: '# PROCESSOR TRENDS


    Given that the fastest supercomputers have millions of cores in thousands of processors,
    it might come as a surprise to learn that the first supercomputers had just a
    single processor. Those early vector processors were usually designed for a particular
    supercomputer. Whether they achieved their performance advantage by allowing a
    particular operation to be carried out on a whole string of data in a single operation,
    or by design for lightning speed, remains commonplace in the world of supercomputing
    until the 1990s.


    That vector revolution was soon brought about, with no small effort, by the availability
    of high-performance RISC processors. Designed for use in engineering workstations
    and servers, these processor families included the DEC Alpha, IBM POWER, SUN SPARC,
    HP PA-RISC and MIPS. While they were certainly faster than the chips that powered
    PCs, these top-end


    processor families couldn''t compete with vector processors, or they were used
    in multi-processor configurations.


    Over time, most of these RISC processors became obsolete or were replaced by dedicated
    applications. Whether this was a result of the power of x86 processors is debatable
    but, by the first part of the 21st century, a second migration to and from RISC
    in the world of desktop PCs began. Needing to say, they had to be used in wider
    applications and that trends continue to the present day.


    The graphics component became established in the world of desktop supercomputers
    and is now found in around 16 percent of machines in the Top 500 list. The graphics
    processor or GPU, with its highly parallel nature has been applied to number crunching
    more generally. Perhaps the latest innovation is a recent announcement by Gray
    Isambard supercomputer, the firm suggests, will be the first to employ the ARM
    cores that power our smartphones.


