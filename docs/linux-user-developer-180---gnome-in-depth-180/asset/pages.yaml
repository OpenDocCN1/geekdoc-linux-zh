  md: '# Python


    # Monitor your car with a Raspberry Pi


    With a few extra items, you can use your Raspberry Pi to build a sophisticated
    monitor for your automobile


    > Many people have developed projects where Raspberry Pi are used for home-monitoring
    systems. There is no reason why you can''t go with this and create a monitoring
    system for your car. This month, we''ll look at how to keep track of your car
    and its engine using OBD-II. The doing is possible because OBD-II is standard.
    Essentially, every modern vehicle has OBD port so you can connect an interface
    between the vehicle and your computer. In some cases, you''ll need a dongle to
    act as an interface between the two. The dongles can usually be connected through
    a USB cable or Bluetooth. For your project, you could use either. If you choose
    to use the Bluetooth dongles, don''t forget to install the


    # Why deploy, Python?


    Once you have the physical elements connected together, it''s time to start getting
    your code talking to your vehicle so that you have data to process. It isn''t
    currently possible to use the OBD Python method. In the list package for Raspberry
    Pi, you will need the following command


    The initialisation scans all connected to your Raspberry Pi and tries to bind
    the first one that appears to be an OBD interface. But, you might have a less
    standard interface that you are using to connect to the vehicle. In these cases,
    you can control the connection, set the port, the baud rate and the protocol for
    your connection. For example you could connect to an OBD dongle on USB with the
    command below.


    ```

    sudo pip install obd

    ```


    This module is designed to work with the standard OBD method and is sub-1.0 in
    version number, so you should keep an eye on the changes for updates if anything
    changes after the release. You can find the full documentation at http://github.com/python-obd.


    The OBD interface interfaces with each car object identified. After identifying
    your vehicle''s engine it receives a query and returns a system response. A ''Hello''
    type of code would look like


    # "Every modern vehicle has an OBD port"


    ```

    conn = obd.OBD(''/dev/ttyUSB0'',9600)

    ```


    If you have multiple devices to connect to your Raspberry Pi, you can get a list
    of them, and then connect to one, with the following code.


    ```

    import obd

    my_car = obd.OBD()

    conn = obd.commands.RPM

    response = my_car.query(conn)

    print(response)

    ```


    for your Raspberry Pi. In Sebastian, you can do with:


    ```

    sudo apt-get install bluetooth-blue

    ```


    ```

    obd_devices = obd.scan()

    print(obd_devices)

    ```


    If you need to connect to your vehicle interacting with it, you can use the method
    is_connected() to get a true or false value. There is a list of possible commands
    that you can use in the query() method. They are available in the ''commands''
    table, as part of the OBD protocol documentation.


    You''ll need to have a dongle plugged into one of the ports on your Raspberry
    Pi, unless you have a Pi 3 with built-in Bluetooth. You''ll also need some kind
    of display to show what is happening inside your vehicle''s engine. You can choose
    one of the purpose-built screens, which plug into the connector on the Raspberry
    Pi board. Or you can select another display type that you connect via HDMI.


    The OBD method initializes a new connection to your vehicle using USB or Bluetooth.
    Then you select one of the commands to use with the OBD method. Once that, you
    query the vehicle with the query() method and get the response as an object. You
    can then read off various parameters from the object. There are also other methods
    within the response object. For example, the following code shows the current
    speed in miles per


    If you already know the name, you can use it as a property of the ''commands''
    object to refer by list. For example, you could get the RPM value of your engine
    with one of the following lines of code.


    ```

    rpm = obd.commands.RPM

    rpm2 = obd.commands[''RPM'']

    ```


    You will also have to come up with the display within the confines of your particular
    vehicle.


    ```

    print(response.value.to("mph"))"

    ```


    The query() method returns an OBDResponse object'
