  md: '# The output is a URL which gives a detailed report on the running containers
    and how they are built. Impressive and extremely quick


    after a failure Docker caches all its layers! But hopefully this has shown that
    Puppet can bridge the gap between old and new processes.


    # Discovery with Lumagon


    As well as the announcements on Puppet 5 and Puppet Enterprise 2017.2 in May,
    Puppet announced the other bizarre-named Lumagon, which it is calling a tool for
    inspecting, analysing and reporting on containers. Basically, when faced with
    all available methods, Puppet is aiming to solve what the "black box" problem
    is. For example, when faced with a security incident how would the average containers
    be affected? If any record of software that a container lasted less than ten minutes
    was running two weeks or a month on an organisation is adding to this problem
    in comparison to the handful of physical servers that are typically used to consist
    of not that long. Lumagon is incredibly easy to use and send out to its official
    site with the following command:


    ```

    $ docker --rm -v /var/run/docker.sock:/var/run/docker.sock puppet/lumagon-report

    ```


    The output is a URL which gives a detailed report on the running containers and
    how they are built (Figure 4). It is impressive and extremely quick. Of course,
    sending this kind of detail outside of the container may be forbidden by your
    local team. Reports can be generated easily with in JSON format:


    ```

    $ docker --rm -v /var/run/docker.sock:/var/run/docker.sock puppet/lumagon-report

    ```


    This can be used with the ever-hungry jcmd command. Binding the output command
    through `"containers.api.host.puppet.platform"` allows you to select containers
    that lasted longer than the deluge of the first run generated. We really liked
    this tool and there have been a couple of incidents in our day-to-day work where
    having this to mind would have been really helpful.

