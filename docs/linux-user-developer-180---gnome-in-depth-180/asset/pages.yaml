    block placed? ")

    - mc.setBlock(relativeX,y,z,blockID)


    You can also do the same for the y and z coordinates.


    # 05 Build in rows and columns


    Placing blocks one at a time can slow down the process. There may be instances
    where we want to place entire rows and columns of blocks. After using Step 3 and
    Step 4, we need to add variables for rows and columns.


