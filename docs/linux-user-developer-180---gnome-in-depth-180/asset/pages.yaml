    # Avoiding accidents


    The desktop client is really quick: drop a file into a synchronised folder and
    it appears on your server in seconds and on the other synchronised devices shortly
    thereafter. That is, the file also means that your cloud server is no protection
    against accidental deletions on your local computer. When you delete a file from
    the server, or via a sync client, it is moved to a deleted files area rather than
    being deleted. It means it can be recovered as long as there is free space in
    your quota. When Nextcloud occupies more than half of your free space, one is
    deleted for another, but here you are still free to change your mind and hit the
    ''Restore'' button in the Deleted area.


