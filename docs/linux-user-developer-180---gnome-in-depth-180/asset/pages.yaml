    your cloud.


    +   - Circles


    A basic social network within your cloud to send messages and files to groups
    of users.


    +   - Impersonate app


    Enables an admin to log in as a user to deal with an issue they have.


    +   - Secure shared folder


    Secure Drop enables users upload files to a shared folder without showing them
    existing content.


    +   - Federated shares


    Share files and folders with remote Nextcloud and ownCloud servers.


    ![](img/80af6fd0c5ad221222cba94201825f7f_56_0.png)


    > The cloud is as nebulous as the meteorological object it is based upon. Exactly
    what term means is nobody deliberately, as it enables companies to use it for
    whatever they want, within certain limitations. One of those limits is what may
    be the correct definition of the cloud ''somebody''s computer''. There is no doubt
    that cloud computing offers many benefits, whether you are looking at a mail service,
    file sharing, document collaboration or other applications, the idea of letting
    someone else take care of the administration but just your service out to theirs.
    There is always a ''but'' and in this case it is ''you are trusting your data
