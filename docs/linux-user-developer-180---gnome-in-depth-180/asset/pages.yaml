  md: '# Rocket.Chat


    # Zulip


    Can you take your communications orbit and back again?


    Acquired by Dropbox and open-sourced, can it beat its rivals?


    ![](img/80af6fd0c5ad221222cba94201825f7f_82_0.png)


    ![](img/80af6fd0c5ad221222cba94201825f7f_82_1.png)


