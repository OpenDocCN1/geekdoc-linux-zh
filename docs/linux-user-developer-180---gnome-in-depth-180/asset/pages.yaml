    #  RASPBERRY PI


    # Pi rival beats Windows 10 compatibility


    The UP Core offers superior performance than the Pi 3 on paper


    The Raspberry Pi has transformed the way millions of people around the world think
    about computing. Anything with that level of success will unexpectedly spawn competitors.
    To be able to knock it off its at the top of the single-board market, the all-new
    UP Core could challenge.


    From the specification alone, the UP Core looks like an impressive piece of kit.
    It includes a quad-core 1.8GHz ARM Cortex-A17 processor and 2GB of DDR3 memory.
    As far as comparison goes, the UP Core surpasses the Pi 3. We have also found
    an upgraded version of the UP Core with 4GB of memory, at an extra cost of course.


    have, what''s a bigger surprise is the inclusion of Android Marshmallow and Windows
    10. We should, however, at this point mention that at the time of writing, there
    is no news on how well the Windows 10 integration performs.


    For those interested in the hardware features available, the UP Core includes
    a 100-pin header, compared to the 40-pin from the Pi 3, which allows for a greater
    selection of potential hardware hook-ups. Plus, the extra connectors for hooking
    up the Core via GPIO, USB, or UART are also possible here.


    ![](img/80af6fd0c5ad221222cba94201825f7f_7_1.png)


    > Above The board includes a whopping 100-pin header


    The main selling point of the UP Core is its capability of running multiple operating
    systems. While support for the libraries of Ubuntu, Yocto and Debian is to


    Despite being an impressive piece of kit, there are some notable downsides. For
    example, the UP Core won''t easily enjoy the level of community support that the
    Pi can currently support, for a lot of people have been the greatest asset of
    computing powerhouse. Second, there are


    have been early reports commenting on the difficulty of getting the UP Core''s
    built-in software working out of the box, with others mentioning the issue of
    connecting other pieces of hardware to it. After a successful Kickstarter, the
    UP Core team are set to start shipping in August. No concrete details of a public
    release have been mentioned at the time of writing, but early indications suggest
    you''ll be able to buy your own UP Core before the end of the year.


    8'
