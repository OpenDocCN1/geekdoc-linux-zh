    Taking a step further, let''s ask the user where they''d like the block(s) placed.


    # Take your time


    Whether you''re placing blocks or moving your player character around the world,
    you might want to space out your commands. Using time.sleep can allow you to create
    an artificial gap in your code.


    For example, it would pause the program for ten seconds before initiating the
    next line of code. This could be useful if you want every number of seconds, or
