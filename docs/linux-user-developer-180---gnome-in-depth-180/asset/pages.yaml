    # RASPBERRY PI


    # Raspberry Pi Foundation merges with CodeDojo


    The charity looks to develop the cod of the future


    Coding kids has been gradually gaining traction in recent years, and the Raspberry
    Pi Foundation is now set to take it to the next level.


    The Foundation is joining forces with CodeDojo, a global network of coding clubs
    started at around 17 in 2017. Since then, the sproj has spread to 69 countries,
    with over 35,000 young coders to learn about the world of code.


    In a post by Raspberry Pi Foundation CEO Philip Coligan, it was clear that


    the merger deserved both parties. The two organisations will work together to
    advance their mission, using their respective assets and capabilities to help
    many more adults and young people enjoy coding. "The Raspberry Pi Foundation will
    provide technical and financial support to the CodeDojo Foundation," Coligan.


    Although not confirmed by Coligan, it''s expected that more CodeDojo attendees
    get their hands on their own Raspberry Pi unit, as well


    as provide the necessary financial clout to continue a rapid expansion of the
    clubs. The move will also help take up a operate member role at the CodeDojo Foundation,
    allowing him to advise on all matters the organisation''s expansion into new territories.


    flip side, the increase of the Raspberry Pi units throughout CodeDojo''s clubs
    will help everyone get closer to the computing world. For more information on
    your needed CodeDojo club, head https://coderojo.com.


