    you have to do everything. This only means installing, configuring, keeping the
    system up to date with backups and disaster recovery procedures are in place.
    It is a choice to trust someone else to do it for you, or in no doubt that you
    can trust your own data. Nextcloud makes the prospect of losing everything in
    a disk failure far less likely.


    Nextcloud works with the popular web servers although only Apache and Nginx are
    supported. It also runs on lighter servers like Raspberry Pi, although you have
    PHP available.


