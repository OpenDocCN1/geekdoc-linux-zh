    Users who dual-boot will tell you that Windows has a tendency to overwrite Linux,
    especially when Windows Update is applied. This can break the bootloader and you
    will have no way to boot the other OS without a live CD, mount the affected disk,
    chroot to OS and reinstall grub using Boot Repair utility available in the ppa:ubuntu/boot-repair
    repository.


    # 06 Fix the time offset


    When you switch between Windows and Linux, you''ll notice that the time can get
    messed up. This is because Linux uses UTC internally, while Windows is set to
    your local time. The fix is a quick Windows registry edit (run as admin and navigate
