    # Added security


    Security of your data is important. This is why Nextcloud offers the occasional,
    not so subtle, hint about using HTTPS to connect to your server. You need a certificate,
    you can use a self-signed one or better yet, get one by getting a free certificate
    from letsencrypt.com. If you are using Nextcloud in a commercial setting, it is
    worth the expense of buying your own SSL certificates. If you are running Nextcloud
    or on a VPS server, you can use the encryption module. This is not enabled by
    default for all its uses, but it is in the app store. Encryption has to be enabled
    by an admin user and applies to all files stored on the server. The user''s details
    are encrypted as well. Encryption is particularly useful when using remote storage,
    like one of other file storage services. There are many storage services that
    provide a service account of storage for free. The remote storage enables you
    to consolidate all your files. With remote storage, you can make it available
    to everyone or limit it to certain users or groups. The remote storage is allocated
