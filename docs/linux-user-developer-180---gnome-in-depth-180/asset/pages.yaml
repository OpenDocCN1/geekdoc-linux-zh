  md: '> > Consideration: It is the reason parties enter into a contract. It usually
    refers to a bargain arrived at a contract, wherein one party performs or agrees
    to perform an act, in exchange for receiving such a value (information, money,
    or goods). The idea is that open source software implies an agreement to be bound
    by its terms and the courts have not taken a contrary position on this matter.


    Unlike proprietary software, open source licenses do not require licensee to express
    consent before them using the software. The exchange of consideration, has long
    though many open source licenses are found enforceable.


    It is an important to understand that if an open source license can result in
    an infringement, contract law describes how to interpret and the remedies for
    breach. When a client is situated in an important issue such as breach, the established
    contract can provide such defense.


    In the District Court of the Northern District of California, in the matter of
    Artifex Software vs. Wancom Inc, the court ruled that infringement of an open
    source license is costly.


    This is because the defendant (the hat) had pleaded that mere use of software
    licensed under the GPL does not create a contract between the parties.


    However, the court held that GPL''s terms explicitly require compliance of conditions
    for distribution of software. While the order is significant on many fronts, the
    ruling essentially means that after copyright infringement, the lawsuit can also
    be proceed for breach of contract.


    The Federal Court had previously (Jacobsen vs Katz) held that the lack of money
    hands in open source software does not imply that the court may waive the way
    towards establishing open source licenses as contracts.


    # # TOP TIP


    The use of ''+'' in licences such as GPL means that the software can be released
    under the later version of that the developer desires.


    # # Enforcing compliance


    For developers, it is important to understand that open source licenses are enforceable.
    But how does a particular project violate an open source license? Similarly for
    companies, it is important to make certain they are not in inadvertent breach
    of the license.


    Compliance engineers, as the names suggest, work towards identifying breaches
    of open source licenses. By so meticulously analyzing software, they reduce risks
    and avoid issues.


    Another option is Fossa, a free license that serves several functions. It is used
    to determine the licenses of a specified piece of software with base code and
    lets users generate notices for their software and more.


    Looking for more specific guidance in ensuring compliance, you can turn to organisations
    that are devoted to that specific purpose. Herald Wilde''s gpl-violations.org
    project has done work in the legal field.


