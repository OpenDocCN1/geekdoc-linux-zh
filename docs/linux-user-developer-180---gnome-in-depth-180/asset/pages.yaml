    # SOFTWARE


    # Native Skype app to stop working July 1


    Older versions of messaging service will be removed


    Skype has had an up-and-down time on Linux, and after numerous improvements to
    get the app to scratch, Microsoft has now decided that all older versions of the
    app will be removed. In an official notice Microsoft that will retire Skype versions
    4.3 and older on July 1 2017. The move follows Microsoft''s plans with the Skype
    clients on macOS and Windows, with older versions of the client being removed.
    From 1 July, current Linux users may find that the traditional Skype client will
    no longer work, other options are available.


    Linux users will be able to use the current beta of Skype for Linux, which is
    an updated and upgraded version of the messaging client. Despite not including
    all that many users would have found useful from the old client, it does have
    some inclusions of it.


