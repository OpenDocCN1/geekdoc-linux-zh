    Ubuntu，但我们非常独特，使用了 Linux-OS，并在其之上设计[并]我们使用的所有应用程序。我们发布时使用一种编程语言；使用一种工具包；使用其中一套的人机界面指南。像
    Ubuntu 这样的指南，甚至像 elementary 这样特定的操作系统，在我们 OS 之上，是一个 elementary 项目。我们的网页浏览器是一个著名的浏览器，虽然这对于向
    Linux 用户交付开源应用非常有意义，但我们使用的是自己为该平台开发的工具，这不与他人共享。登录界面与 Ubuntu 使用的模式不同，我们的应用商店和 elementary
    播放器是两个非常不同的应用程序，但它们之间有很多共同元素，一旦你学会了如何使用其中一个，就能轻松地使用另一个。


