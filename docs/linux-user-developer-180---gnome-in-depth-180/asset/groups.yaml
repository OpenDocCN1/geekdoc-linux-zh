    If you prefer, you can also install the GNOME desktop packages on top of your
    existing Ubuntu installation with the command `sudo apt install`. This will give
    you flexibility to choose which desktop you are using at the login screen, although
    it isn''t the most efficient way of doing things. We also found that GNOME and
    Ubuntu work very well together, so it''s worth bearing this in mind. One last
    option is to install or boot the OS in a virtual machine using VirtualBox to get
    a good idea of what to expect, at a degraded level of performance compared to
    running natively.


    # Your first steps


    After you''ve completed the Ubuntu GNOME install, the first application you load
    is ''GNOME Tweak Tool'', just like the equivalent if you haven''t tried it,


    should, the application provides customisation of a vast number of features that
    would normally be much harder to adjust. GNOME provides a powerful extension framework
    that enables developers and users to extend and adjust how the desktop looks,
    acts and functions. We liked a few of these extensions:


    +   - Dash to Dock - This takes the favourites bar and transforms Ubuntu into
