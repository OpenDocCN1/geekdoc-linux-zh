    general User who simply uses Linux because I don''t like Microsoft or Apple. I
    don''t have any technical knowledge other to check email and use office documents.
    All Linux magazines cater to those who are already seasoned in Linux and have
    advanced technical skills. There is nothing useful for beginners and people who
    will never use the technical aspects of Linux, or any operating system for that.
    I have never started programming or doing all the difficult tutorials found in
    Linux magazines. It feels like there is a major gap between who want to use Linux
    for the first time and those who are seasoned experts. Linux would gain a lot
    more if there was a true resource that bridged that gap. My wish is to have a
    publication that tend to be enthusiasts – people tinkering at home – and include
    articles for those working or wanting to work in the open source business. I admit
