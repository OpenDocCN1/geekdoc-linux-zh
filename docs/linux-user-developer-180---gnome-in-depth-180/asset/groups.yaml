    目前的 GNOME Builder 尚处于起步阶段，但未来为 Linux 开发者承诺强大的功能。


    在 3.22 版本（2016年9月）中成为默认设置证明了它已经准备好投入主流。随着 GNOME 出现在 Ubuntu 17.10，它也将切换到 Wayland，这为该项目提供了巨大的支持。


    我们每天使用的 GNOME 项目的另一个关键元素是 GTK+（GIMP 工具包）——这是一个用于创建图形界面的跨平台工具包。GTK 库（当前版本为 3）是一组用于构建用户界面的图形元素——它包含了
    203 个活跃和弃用的小部件。GTK 针对基于 Linux 的用户，但也运行在其他平台上，包括 Microsoft Windows（通过 Windows API
    接口）和 macOS（使用不同引擎进行组件绘制的接口）。


    除了构成 GNOME 桌面大部分部分的 Shell 和应用程序外，还有许多其他元素支撑着它。Wayland 就是一个很好的例子。Wayland 是一种合成器协议和库实现，其中窗口管理器和合成器的角色合而一。合成器使用
    KMS 和 DRM 等 Linux API，并使用 GTK 进行渲染。Wayland 协议正在演变——长期以来通过向核心协议添加越来越多的功能来保持，但从长远来看这是不可持续的。开发一个基于合成的现代显示系统是可持续的。真的不需要担心
    X 协议的过时部分（如较少使用的扩展），X 协议中任何更有问题的部分在 Wayland 中不存在，这为 GNOME 避免了大量问题。


    整个 GNOME 有许多项目，包括 CUPS 打印系统。


    由于 Linux 下 GTK+ 是数据结构、缓存、线程和动态模块等最广泛使用的系统库，它用 C 语言编写。由 GNOME 代码开发的 GTK+ 从 GTK+
    分离出来，以便让 GNOME 以外的软件更容易使用（并确保 GTK+ 专门包含 UI 相关的代码），从那以后一直并行开发。


    ![](img/80af6fd0c5ad221222cba94201825f7f_25_0.png)


    ![](img/80af6fd0c5ad221222cba94201825f7f_25_1.png)


    # GNOME 庆祝 20 周年


    GNOME 20 岁了，开发始于 1997 年。但这段旅程是怎样的？


    最初宣布后，花费了一半时间发布了第一个版本（1999年3月）。在 GNOME 世界大会上宣布它，Miguel de Icada 改变了 Linux 计算的未来。他是对的。1.2
    版本于 2002 年3 月到达，并自信地认为自己在 GNOME 桌面的可用性、吸引力和规模上取得了突破。终端用户似乎能够“让他们的祖父母和弟妹留下深刻印象”。


    最后一个 1.1 “Tranquility”发布于 2001 年，承诺将软件推向新水平！Nautilus 使其成为家园，Swift Wayland 窗口管理器也是如此。


    一年后，GNOME 2 到来，带有增强的功能和增强级别的添加。一流的国际化，以及整个界面中改进的无障碍支持。GNOME 2 的开发一直持续到 2010 年的
    2.32 版本，之后没有重大变化，带来了丰富的变化：


    - Epiphany 浏览器 2（2003年9月）

    - Evolution Plan 4（2004年9月）

    - 1.2 中的 GTK+2（2006年9月）

    - 2.14 中的性能提升（2008年3月）

    - 2.26 中的 Cheese 网络应用（2009年3月）

    - 2.30 中的 Pod 支持（2010年3月）


    到 GNOME 2 发布时，我们已经处于 3.0 版本。2011年4月发布的 3.0 版本带来了备受争议的 GNOME Shell，以及 GTK+，并且没有移除长期被弃用的
    API。


    3.22 版本（2016年9月）将 Wayland 设为默认显示服务器并引入了对 Flatpak 的支持。


    GLib 包含 GObject（又称 GLib 对象系统），它提供了一个具有跨语言实现的可移植对象系统，以及我们封面上的 glimmer（它是 Pantheon
    桌面环境的一部分）。


    此外，GNOME 并不是唯一的用户界面工具包。Clutter 是另一个项目开发的库，围绕 GLib 的复杂性提供了一个现代、高效的 API，Clutter
    不强制特定接口，但为针对特定需求定制的高层提供了丰富、通用的基础。GNOME 团队最近添加的一个项目是针对 Linux 新手的，如果你不完全被 GNOME
    说服并可能在考虑切换？那么仔细看看这些基于 Ubuntu 的替代方案：...


    ![](img/80af6fd0c5ad221222cba94201825f7f_26_0.png)


    ## 其他 Linux 发行版


    Builder（将需要调整），是一个新的 IDE，专注于将平台力量带给比任何时候更多的开发者。它目前正处于深度开发中，有一个庞大的待发布列表。如果 GNOME
    能够交付此，它就有潜力真正改变 Linux 开发。基于 Ubuntu 的 Elementary OS 在其图形风格上既归功于 macOS 也归于 Windows
    —— 它看起来非常漂亮！该发行版对新用户来说也非常直观。


    Builder（将需要调整），是一个新的 IDE，专注于将平台力量带给比任何时候更多的开发者。它目前正处于深度开发中，有一个庞大的待发布列表。如果 GNOME
    能够交付此，它就有潜力真正改变 Linux 开发。


    ## Flatpak vs Snaps


    如果你最近关注过 Ubuntu 社区，可能熟悉 Ubuntu 的 Snap 计划。最初为 Ubuntu 创建的 Snaps 现在关注跨分发。GNOME 处于什么位置？通过对
    Flatpak 的支持，两者的目标相同：让开发者能够创建并分发而不依赖于主机（即沙盒化）应用程序。什么是开源？它与自由软件有何不同？你如何决定哪种最适合？可靠性和性能远在后。哪一个会获胜？


    ## Zorin OS


    Zorin OS 是一个基于 Ubuntu 的发行版，旨在让 Windows 用户感觉如家，适用于 Windows XP、2000 和 7。尽管每个人都有所有权，GNOME
    对包括系统在许多其他项目都有贡献。许多功能源于 GNOME 项目，并与其他项目的持续协作扩展到 Linux 内本身、GStreamer 多媒体框架、发布以及实时通信。


    ![](img/80af6fd0c5ad221222cba94201825f7f_26_1.png)


    ## Kubuntu


    如果你不想完全离开，Kubuntu 是一个在概念上与 KDE 相似的很棒的桌面。


    ![](img/5f7f_26_2.png)


    5f7f_26_2.png)


    # FOSS 许可：导航许可证格局


    Shashank Sharma 花费了无数小时研究可用的自由和开源许可证，帮助你为项目选择最佳的一个。


    ![](img/5f7f_27_0.png)


    开源软件的成功以及对日常生活的影响是不可或缺的。从为中小企业提供成本效益的解决方案，到运行服务器甚至分析大数据。但什么是开源？它与自由软件有何不同？你如何决定哪种最适合？可靠性和性能远在后。不幸的是，它遇到了一个相当困难且复杂的问题：许可证泛滥。第一次，软件架构师和开发者对选择感到无所适从。


    开源许可证不仅用于软件。这种从限制开始的运动其范围扩展到了视频、艺术品、散文等更多泛滥。现在并不是每一个开源许可证都是理想的或推荐的。显然，适用于软件的可能并不适用。这指的是整个自由和开源许可证。


    ## 理解版权


    简单来说，在不涉及雇佣作品、性能、适配等等无数陷阱的情况下，创作者对作品保留了固有权利。作品可以是任何声音录制、视频文件、图像和软件代码。


    版权所有者可以阻止复制或分发他们的作品。私有软件的版权持有者描述了其对其创建的作品所拥有的各种权利。


    尽管包含大量细节、学术文章和一本书，开源软件困扰了用户和开发者十年；现实是，80 年代和 90 年代被法律威胁瘫痪的 FUD（恐惧、不确定和怀疑）最受行业欢迎，几乎所有人都保留了市场主导地位。


    但在 Linux 社区这种限制权利的模型，通过许多人的贡献，允许它在全球范围内运行，而不是成千上万家公司。动机的战略转变是底层的许可证，它是为了利用开源而设计的。这篇文章将消除一些误解。我们的重点是帮助你理解应该如何为其他项目决定许可证。我们将在每个特性详细说明开源和自由的区别。


    ## 选择许可证


    在为你的项目选择许可证之前，你必须回答几个重要问题。第一个是完成的软件是在内部使用、仅供少数成员使用还是公开可用。第二个，在发布作品之前，还要考虑制作和展示软件质量所需的努力，以及解决声誉问题。第三，在决定发布作品后，下一个问题是将其作为私有发布还是不是。这里私有并不意味着软件是复杂的。同样，非私有并不因为免费分发就一定更好。你也可以采用
    Artifex 使用的方法，它为你提供代码，在保护你的软件的同时仍在使用 GPLv3 下分发。事实上，非拷贝左（non-copyleft）确保衍生软件也根据相同的版权条款发布。这是每个案例末尾的要求，我们稍后讨论（见第
    31 页）。


    如果你决定了一个非私有项目，你仍然必须决定是在源码许可证下发布项目，还是简单将其释放到公共领域。后者更有可能由创作者承担。一旦发布到公共领域，创作者就不能随心所欲地启动法律行动机制。如果你应对了这些风险，下一步是为你的项目做出另一个决定：是在版权许可证还是学术或开源许可证下发布项目。最终决定将取决于你的具体情况以及如潜在专利或其他法律考虑等因素。


