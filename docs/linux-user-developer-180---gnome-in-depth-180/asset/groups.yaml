- md: "\n# Tutorial Puppet 5\n\n# First look: Managing your containers with Puppet\
    \ 5\n\nWe kick the tyres and out the config management tool's open beta and Puppet's\
    \ new Lumagon scanner\n\n![](img/80af6fd0c5ad221222cba94201825f7f_41_0.png)\n\n\
    Jolyon Brown helps develop devops projects and has been a consultant for more\
    \ than ten years. He spends a lot of time machine learning these days.\n\nA couple\
    \ of years ago, your expert joined a team who were dropped into a struggling project\
    \ meet with ambitious deadlines. After some gentle persuasion, the client accepted\
    \ that scaling the kind of complex infrastructure was the forward. Using containers\
    \ was underway and suddenly configuration management was the way. The project\
    \ was a success. Fast-forward to several months later we found that config management\
    \ no longer had an obvious role to play because became immutable - it would be\
    \ destroyed and replaced with a new version of itself every time we needed to.\n\
    \nTo look at Puppet 5, the open source foundations of what will become the next\
    \ generation of the popular Puppet Enterprise configuration management tool. First,\
    \ the open source Puppet 5 is still very much in the open beta stage it is not\
    \ expected to reach 5.0 stage until the end of the year. Then anything using Puppet\
    \ will be all the packages that make up the platform (puppet-agent, puppet-server\
    \ and puppet-db) have in the past that their version number. This can be useful\
    \ for anyone wanting to know, how to get a Puppet 4 platform up and running. The\
    \ plan is to have these alignment at the 5.0 stage and have them downloadable\
    \ from a puppet5 repository.\n\nIn this article, we're going to demonstrate how\
    \ configuration management still has a role to play even in these circumstances\
    \ and we are using this as an excuse.\n\n# Resources\n\n- An Ubuntu VM or test\
    \ system\n\n- [Puppet 5](http://puppet.com/)\n\n# Lumagon\nInspect, report, and\
    \ analyze containers.\n\nLumagon scans and reports on what's in your containers.\n\
    \n```\nRun this docker run -it -v /var/run/docker.sock:/var/run/docker.sock puppet\
    \ lumagon report\n```\n\nThe above command collects all information on running\
    \ containers and sends the results to the Lumagon web service where you can view\
    \ a visual report.\n\n| Get a visual on what makes up your containers | Lumagon\
    \ |\n| --- | --- |\n| Lumagon collects metadata on running containers and generates\
    \ graphical reports that can be shared with them. | |\n| Don't change a thing\
    \ | Lumagon learns as much as possible about your containers without needing special\
    \ software |\n\n![](img/80af6fd0c5ad221222cba94201825f7f_41_1.png)\n\nAbove Lumagon\
    \ is among the many clever and useful tools Puppet has launched to help users\
    \ bridge the gap between traditional and containerised infrastructure. \n\nThere\
    \ are a number of improvements for this new version of Puppet. While Puppet 5-specific\
    \ documentation is still very sketchy at the time of writing, a blog post (https://puppet.com/blog)\
    \ gives a brief review of the focus areas. Puppet's key-value data system has\
    \ been implemented and improved debugging and encryption capabilities, using UTF-8\
    \ support. Native JSON is improving, increasing compatibility with other JSON\
    \ APIs.\n\nWe don't want to head deep into how Puppet works or what it does. This\
    \ is all covered in a lot more detail on the site itself. Hopefully, it'll suffice\
    \ to say that Puppet is configuration management software, and in the introduction,\
    \ we can describe the state of a system in a case study. Puppet allows you to\
    \ modify this state easily, but subsequent runs will then bring it back into place.\
    \ Puppet understands and can handle differences, for example, how a CentOS 5-based\
    \ distribution (differs from others when installing Nginx without the person being\
    \ asked to consider how Yum and Apt work.\n\nPuppet 5 allows you to create builds.\
    \ You can download a build on the cover, but you can also download them from https://puppet.com\
    \ or https://github.com, depending on your needs. Puppet is packaged for the 'distros',\
    \ but it can run on any Linux or Unix system for anyone who wants to go after\
    \ the code, available under the 'puppet' repositories on GitHub.\n\nTo use Puppet\
    \ 5, on Ubuntu 16.04 as we have, here are the following steps:\n\n```\n$ sudo\
    \ apt-update\n$ sudo apt-get install puppet-release-xenial.deb\n$ sudo dpkg -i\
    \ puppet-release-xenial.deb\n```\n\nThis adds sources needed to install the Puppet\
    \ software, which can be done by following the command (which installs the puppet\
    \ agent):\n\n```\n$ sudo apt-update\n$ sudo apt-get install puppet-agent\n```\n\
    \nWe've decided to keep this simple here and use the agent in standalone mode.\
    \ This is because we have all kinds of bugs with this build of Puppet server.\
    \ Perhaps by the time you read this, the nightly builds might be a bit more stable.\
    \ To be quite honest, it's commonplace to see puppet agents running randomly in\
    \ this manner, especially during testing:\n\n# Puppet and Docker\n\nOne obvious\
    \ use for Puppet is managing Docker itself. This is straightforward with a Puppet\
    \ module specifically designed for this task. The module is installed as:\n\n\
    ```\n$ puppet module install puppetlabs-docker --version 2.2.1\n```\n\nBy default,\
    \ this will end up on our test server in the home-directory in /home/joly/puppet-docker/modules\
    \ (Figure 1). We will use this for a example of creating a small Puppet manifest,\
    \ which we will easily call docker:\n\n```\nnode \"lime1604\"\n  include 'docker'\n\
    ```\n\nThe node here is the hostname of the VM we're using. We can apply this\
    \ to the node with the following command: Note we will be passing the module we\
    \ installed moment ago\n\n```\n$ puppet apply --modulepath=/home/joly/puppet-docker/etc/modules\
    \ docker\n```\n\nThis will allow Docker on our test server. This could be handled\
    \ in development setup - rather than everyone in a team having to go through the\
    \ steps to configure their layer, check out a local repository and have their\
    \ development environment in a consistent way. That virtual will be nurtured and\
    \ still needs to be made manifest with a little of care, can be used to configure\
    \ target hosts for containers to run on. Once the install is complete, a quick\
    \ run of Docker container would show it and Puppet running perfectly (Figure 2,\
    \ overall).\n\nOf course, installing a single operating system package is no feat.\
