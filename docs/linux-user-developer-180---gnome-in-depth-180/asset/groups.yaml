    ## 使用 Lumagon 进行发现


    除了 5 月份的 Puppet 5 和 Puppet Enterprise 2017.2 发布之外，Puppet 还宣布了另一个命名奇特的 Lumagon，它将其称为一个用于检查、分析和报告容器的工具。基本上，在面对所有可用方法时，Puppet
    的目标是解决“黑盒”问题。例如，当面临安全事件时，普通容器会受到什么影响？如果任何一个容器运行时间不足十分钟的软件记录在组织中运行了两个周或一个月，那么与通常用于持续时间没那么长的几台物理服务器相比，这加剧了这个问题。Lumagon
    非常易于使用，并通过以下命令发送到其官方站点：


    ```bash

    $ docker --rm -v /var/run/docker.sock:/var/run/docker.sock puppet/lumagon-report

    ```


    输出是一个 URL，提供了关于运行中容器的详细报告以及它们的构建方式（图 4）。它令人印象深刻且极快。当然，你的本地团队可能会禁止将此类细节发送到外部。可以轻松生成
    JSON 格式的报告：


    ```bash

    $ docker --rm -v /var/run/docker.sock:/var/run/docker.sock puppet/lumagon-report

    ```


    这可以与饥渴的 `jcmd` 命令配合使用。通过 `"containers.api.host.puppet.platform"` 绑定输出命令，你可以选择运行时间长于第一次运行生成的大量数据的容器。我们非常喜欢这个工具，在我们的日常工作中发生过几次事件，如果当时能考虑到这一点将非常有帮助。


    希望我们对 Puppet、其部分模块以及 Lumagon 的首次游览突显了良好的配置管理软件所具备的特性。我们认为它在运行基础设施方面起着重要作用，并可以桥接新旧之间的差距。Puppet
