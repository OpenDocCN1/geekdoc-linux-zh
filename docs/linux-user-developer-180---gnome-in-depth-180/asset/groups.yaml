    # Tutorial Puppet 5


    # First look: Managing your containers with Puppet 5


    We kick the tyres and out the config management tool''s open beta and Puppet''s
    new Lumagon scanner


    ![](img/80af6fd0c5ad221222cba94201825f7f_41_0.png)


    Jolyon Brown helps develop devops projects and has been a consultant for more
    than ten years. He spends a lot of time machine learning these days.


    A couple of years ago, your expert joined a team who were dropped into a struggling
    project meet with ambitious deadlines. After some gentle persuasion, the client
    accepted that scaling the kind of complex infrastructure was the forward. Using
    containers was underway and suddenly configuration management was the way. The
    project was a success. Fast-forward to several months later we found that config
    management no longer had an obvious role to play because became immutable - it
    would be destroyed and replaced with a new version of itself every time we needed
    to.


    to look at Puppet 5, the open source foundations of what will become the next
    generation of the popular Puppet Enterprise configuration management tool. First,
    the open source Puppet 5 is still very much in the open beta stage it is not expected
    to reach 5.0 stage until the end of the year. Then anything using Puppet will
    be all the packages that make up the platform (puppet-agent, puppet-server and
    puppet-db) have in the past that their version number. This can be useful for
    anyone wanting to know, how to get a Puppet 4 platform up and running. The plan
    is to have these alignment at the 5.0 stage and have them downloadable from a
    puppet5 repository.


    In this article, we''re going to demonstrate how configuration management still
    has a role to play even in these circumstances and we are using this as an excuse


    # Resources


    +   An Ubuntu VM or test system


    +   [Puppet 5](http://puppet.com/)


    # Lumagon

    Inspect, report, and analyze containers.


    Lumagon scans and reports on what''s in your containers.


    ```

    Run this docker run -it -v /var/run/docker.sock:/var/run/docker.sock puppet lumagon
    report

    ```


    The above command collects all information on running containers and sends the
    results to the Lumagon web service where you can view a visual report.


    | Get a visual on what makes up your containers | Lumagon |

    | --- | --- |

    | Lumagon collects metadata on running containers and generates graphical reports
    that can be shared with them. | |

    | Don''t change a thing | Lumagon learns as much as possible about your containers
    without needing special software


    ![](img/80af6fd0c5ad221222cba94201825f7f_41_1.png)


    Above Lumagon is among the many clever and useful tools Puppet has launched to
    help users bridge the gap between traditional and containerised infrastructure


