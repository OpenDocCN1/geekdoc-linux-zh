    年 7 月 1 日停止 Skype 4.3 及更早版本。此举遵循微软对 macOS 和 Windows 版本的 Skype 客户端的计划，即将移除旧版本的客户端。从
    7 月 1 日起，当前的 Linux 用户可能会发现传统的 Skype 客户端将不再工作；但会有其他可用选项。


    Linux 用户可以使用 Skype for Linux 的当前测试版，这是一个更新和升级后的消息客户端。尽管它没有包含许多用户可能认为旧客户端中非常有用的功能，但它确实包含了一些特性。


