    # Samsung Chromebook Pro


    ![](img/80af6fd0c5ad221222cba94201825f7f_85_0.png)


    ## HARDWARE


    ## Samsung Chromebook Pro


    ## The next-gen Chromebook is here (if you buy it)


    Part Chromebook and Android tablet, the 12.3-inch samsung combines a 360-degree
    convertible laptop design with a 3:2 screen suited for stylus support on a Chrome
    OS for the first time.


    Weighing in at a scant 1.8kg, this all-metal Chromebook is the lightest device
    in its class and a featherweight compared to most laptops. The Pro is also incredibly
    thin and flexible.


    We had an opportunity to review a production model, and our review is priced at
    $849 (£649) and will ship it from the US, which is a midrange price more than
    the expensive Asus Chromebook.


    One key difference of our review unit is that the retail-model''s exterior is
    in jet black. It looks sleek even when closed.


    The Pro features a 3:2 display you''d expect to see on tablets. This, square aspect
    ratio doesn''t get well with widescreen 16:9 and 21:9 aspect ratios, making video
    less natural, leaving black bars above and below the content.


    It has 40 pounds less than the Asus Chromebook. It also has the built-in stylus,
    but has as much storage as inside the Asus. For now the Samsung Chromebook has
    only been announced in the UK and Australia.


    One other unfortunate effect of the flip property is that it ends making for a
    cramped keyboard. It has no room to stretch out, resulting in smaller overall
    keys, shifted keys.


    Pyina

    $849

    Website

    www.samsung.com

    Specs

    - Processor: 0.99GHz Intel m3-Y330 (dual core, mcache)

    - Graphics: Intel HD Graphics 515

    - RAM: 4GB LPDDR3

    - Storage: 64GB SSD

    - Screen: 12.3-inch 2400x1600 LED display

    - Ports: 2x USB-C, micro microSD card slot, headphone jack, Wi-Fi, Bluetooth 4.0

    - Weight: 2.8 pounds (1.08kg)

    - Size: 11.6x8.72x0.55-0.55 inches (29x22.1x1.4 cm)


    Above our production model was silver, but the retail version is jet black


    86


    ## Summary


    A stunning and vivid UHD display. Touch support on Chrome OS that feels as natural
    as paper and a gorgeous, simple design.


    Fold back the display and the Chromebook Pro feels as natural as using any Android
    tablet and of all – a device that''s a shape of its normal size. It''s an uncomfortable
    environment, but one you can get used to after weeks or months of Chromebook.


    Samsung calls the Chromebook Pro a new class of device designed with the Play
    Store in mind. This device comes equipped with gopilot and keyboards. Most importantly,
    this is the first Chromebook with a built-in stylus: pulling it out to add a new
    tool to your on-screen layer pointer during presentations.


    For writing and sketching, the stylus feels extremely natural and precise. Samsung
    has fine-tuned the gap between the glass and pen to make it feel like writing
    on paper. The stylus is pressure sensitive, so the harder you press against the
    screen the thicker the line.


    Google has developed software that reduces latency while using the stylus. Google''s
    cloud and machine learning technology, which used thousands of hours of interpreting
    and artistic strokes to predict where the pen will go. All that predictive software
    comes baked into the Chromebook Pro, so don''t worry about logging your keystrokes
    or needing an internet connection for a smooth writing or drawing experiences.


    ## Cons


    - A cramped keyboard.

    - Nine hours battery life, while not as good as other Chromebooks.

    - Weak speakers.


    Designed for the future device that Google is pushing. This is the perfect Chromebook
    for users needing an Android tablet for 70 to 90 percent of the time, with a device
    that flips back into a traditional laptop for writing and the odd extra. If your
    use case is the same, this is yours.


    The Samsung is capable of a lot, including 4k media, that its Intel Core i3-6130
    processor has plenty of. That would normally be overkill for most Chromebooks,
    but Samsung''s latest Chrome OS machines put that power to drive UHD screen and
    running more Android apps. The higher-end hardware means an impact on battery
    life. Running our standard battery test for nearly nine hours straight and pulsing


    Fold back the display and the Chromebook Pro feels as natural as using any Android
    tablet. With the familiar shape of a tablet that''s great for reading content
    from articles and ebooks. With Android apps at you can download offline videos
    for our content.


    Google tells us the rest has a stable release of software and full access to the
    Play Store. Whether or not, all Android apps run almost perfectly. There is the
    occasional hitch, as apps not scaling text properly, but we can only hope this
    will improve in the future.


    - Kevin Lee


