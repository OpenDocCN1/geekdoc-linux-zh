  - '[PAGE 49]


    # Tutorial Erlang


    ![](img/80af6fd0c5ad221222cba94201825f7f_49_0.png)


    # Program in Erlang: Mnesia modules


    Mihalis Tsoukalis

    administrator, programmer (UNIX & Solaris), mathematician. He has been using Linux
    since 1993. reach him at www.mtsoukalis.com


    # Learn to create tables, insert, query, delete and update records in Mnesia


    # Resources


    +   A recent Erlang installation

    www.erlang.org

    A text editor like Emacs


    This tutorial will be the latest in our Erlang series. This time we discuss Mnesia,
    a database server implemented in Erlang. Databases offer persistent data storage,
    which is extremely important when you have lots of data to keep and allow you
    to query and update your data using more or less standard language such as SQL
    or JavaScript. Mnesia is also very flexible but uses Erlang as its programming
    language.


    This tutorial will introduce you to Mnesia using easy-to-understand examples.
    We will cover the design and its principles, which you will discover how to create
    Mnesia tables, insert to data, delete records from a table and query over existing
    records - when you know how to perform these operations, you can fully control
    your data! You will also see Figure 11 in order to inspect Mnesia databases and
    look at their data in a graphical way. An Erlang module will show you how to use
    Mnesia in Erlang programs and how to access your data afterwards from an Erlang
    program.


    Next Erlang''s tutorial will be the last and cover development with ETS.


    Mnesia is extremely fast, distributed DBMS (database management system) written
    in Erlang which is part of the Erlang distribution and can store any type of data
    on RAM or disk - for persistence or persistence, or both of them.


    The tasks that you''ll need to be aware of when creating a new database system
    to do with data management, schema design and table creation is: if you cannot
    access your data, what is the point? We will start with a little about the design
    principles and the capabilities of Mnesia, we are going to learn how to create
    new databases and tables.


    If you do not need Mnesia for some reason, you can also try ETS (http://erlang.org/doc/man/ets.html)


    and CouchDB (http://couchdb.apache.org/), which is an Apache project. However
    if you are writing complex Erlang applications that need to store lots of data
    on a database, Mnesia is a rational choice. This will not need complex objects
    which means that you are going to use a single Linux machine to execute the presented
    Erlang code.


    # About Mnesia


    Mnesia is one of the many objects of OTP. It was introduced when Erlang came with
    OTP B in 1996. Early Mnesia did not store data in RAM or disk; storing in RAM
    makes the Mnesia experience lot faster, which you might need addition, by design,
    Mnesia offers real-time key value lookups, which means it might be a good candidate
    for various types of real-time applications.


    It is not unexpected that in Erlang we have fast development as well as support
    for distributed data without the need for any exotic objects or locks. However,
    as the tutorial introduction to Mnesia, we will deal with the more advanced features.


    Mnesia is suitable for many kinds of applications that need to be distributed
    data and will be used by many processes and nodes. In addition, Mnesia offers
    easy table replication as support for each table type. Nevertheless, in order
    to work effectively with Mnesia, you will have to spend some time experiencing
    it because it is not as widely used as other database management systems.


    # Why use Mnesia instead of ETS?


    Although ETS might be enough for your needs, there are many situations where Mnesia
    is a more realistic choice. First of all, Mnesia works across multiple nodes


