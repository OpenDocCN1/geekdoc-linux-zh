    # 英国的超级计算机


    英国最快的计算机在 Top 500 列表中位列第 11 位，是一台 Cray XC40。它基于 Q502 芯片、Intel Xeon E5-2699v4 处理器和
    1.6 PB（160 万 GB）内存，其拥有 241,920 个核心，处理能力实现了 6.7 PFLOPS 的吞吐量。


    如果你喜欢钻研统计数据，你可能会惊讶地发现，它重 18 吨，相当于 11 辆双层巴士。


    尽管花费了 9700 万英镑，但英国气象局（Met Office）认为这每一分钱都值，甚至更多。据建议，这台于 2010 年 4 月投入运行的超级计算机将使英国在天气预报方面领先世界，这可能节省数十亿美元。到
    2020 年，通过增强对天气及相关灾害的防御能力，它可能产生价值 20 亿英镑的社会经济效益。


    ![](img/80af6fd0c5ad221222cba94201825f7f_66_0.png)


    由于 Linux 是开源的，其定制性也得到了增强，大多数超级计算机使用经过内核修改的 Linux 版本。Linux 的稳定性至关重要，因为高性能计算机不会像
    Windows 那样频繁崩溃。例如，2016 年的 Top 500 列表中有 29 个节点，拥有 24,851 个核心。六个月后，核心数达到了 300 个。终极目标是达到
    40,000 个。Linux 让这些升级变得尽可能无痛。


    选择 Linux 时，价格不是问题


    Linux 提供的社区支持是一个关键因素。当你不需要为研究或商业应用所需的软件支付巨额费用时，进入 Top 500 列表要容易得多。尽管如此，顶级计算机的世界是一个完全共享知识的社区。


    ## 解决世界问题


    超级计算机可能用于安全和商业应用，但范围并不广。为了结束对这个性能至上的世界的调查，关于这些非凡机器的用途有很多话要说。


    关键在于，如今的超级计算机通过海量核心来实现速度，因此应用程序必须本质上是并行的。根据阿姆达尔定律，应用程序从大规模并行架构中受益的能力受限于其串行部分。如果
    1% 是串行的，速度提升将达到单核的十倍；如果只有 5% 是串行的，那么在添加超过 20 个核心之后，预计改进微乎其微，最多仅增加 20 倍。


    Cray 早于 1967 年出现，也许是被约翰·古斯塔夫（John Gustafson）所注意到，他说并行机器比串行机器更好，即使我们需要让软件尽可能并行化。本质上是并行的经典任务类可以进行许多改进，尽管一些人认为最快的超级计算机没有出现在
    Top 500 集群中，例如 NASA 的集群，它们被用于监控电子邮件和数据编码。最近，由于这些机器需要如 FPGAs（现场可编程门阵列）之类的硬件辅助，一些离谱的推测认为这些政府设施已切换到通用计算机。现在，这真的将载入史册。


    ## 极端工程


    极端计算领域指的是能够处理至少一个示例的计算机：即每秒指令数量极其惊人。今年将测试一个极端系统的原型。


