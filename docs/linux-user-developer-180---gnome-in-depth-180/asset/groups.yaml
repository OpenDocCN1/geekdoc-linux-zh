    - Drop Down Toolbar - This adds instant access to a variety of keys to command
    line


    After installing some standard favourite apps (GNOME, GIMP and so on) and getting
    a feel for how they differ in GNOME, it''s worth checking out the latest features
    in version 3.24 of the desktop.


    # TOP TIP


    GNOME should automatically scale for HiDPI screens with high-resolution displays.
    Note that only inter-app scaling is supported.


    Let installing GNOME customise your desktop environment and give it your flavour
    - best of both worlds?


    ![](img/80af6fd0c5ad221222cba94201825f7f_20_0.png)


    ![](img/80af6fd0c5ad221222cba94201825f7f_20_1.png)


    ![](img/80af6fd0c5ad221222cba94201825f7f_20_2.png)


    # 04 Adjust partition sizes


    Just as Windows is the weaker relation when it comes to sharing files, the same
    applies when it comes to managing disk partitions. Windows Disk Management doesn''t
    really understand Linux partitions very well. Use Linux instead - GParted. You
    can either install this from partitions or use a live boot-able media. This is
    the best option, as adjusting partitions that are in use is a bad idea!


    # 05 Getting your Linux install back


    Users who dual-boot will tell you that Windows has a tendency to overwrite Linux,
    especially when Windows Update is applied. This can break the bootloader and you
    will have no way to boot the other OS without a live CD, mount the affected disk,
    chroot to OS and reinstall grub using Boot Repair utility available in the ppa:ubuntu/boot-repair
    repository.


    # 06 Fix the time offset


    When you switch between Windows and Linux, you''ll notice that the time can get
    messed up. This is because Linux uses UTC internally, while Windows is set to
    your local time. The fix is a quick Windows registry edit (run as admin and navigate
    to KEY_MACHINE\SYSTEM\CurrentControlSet\Control\TimeUniversal) and create a new
    DWORD (32-bit) value named and set the value to 1.


