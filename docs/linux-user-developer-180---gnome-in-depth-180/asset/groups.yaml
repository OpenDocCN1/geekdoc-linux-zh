    Next, use the ''Operating'' pull-down menu to specify the operating system of
    this image, which is Linux. Finally, select the correct layout scheme from the
    Image Type pull-down menu. Our Fedora installation is on a single disk with multiple
    partitions, so we''ll select the second one.


    Now how to head with Fedora 25 that we wish to use the image and boot it up. We''ve
    set the computer to boot from the network card, and deployed the environment on
    the FOG server. Scroll the FOG menu and select the ''Registration and inventory''.
    The FOG server will now scan the computer and add it to its repository of known
    hosts.


    When it''s done, just restart the computer and boot from the FOG server. You should
    now see the Fedora machine listed here, which will be identified by its MAC address.
    Click the edit icon and change the name to ''Fedora25''. Before saving the changes,
    use the Host Image pull-down menu to select the FedoraWorkstation image and create
    it.


    Now we''ve set all the Fedora installation. Go to Head Management > List All Hosts,
    which will list the hosts we just created. Click on Task session, then click the
    upward arrow to upload the image:


    Now how to deploy the Fedora machine and boot it up. It''ll advance FOG PEE and
    the image and upload a compressed version to the FOG server. The process will
    take some time depending on the network capabilities and the speed of the local
    network. The FOG server will restart once it''s done uploading. You can repeat
    these steps to image other computers as needed.


    # Deploy targets


    Before you can deploy an image to another computer, you need to register your
    target computers with the FOG server. The registration process is the same as
    the process for registering hosts. Boot the computer from the network, which should
    detect FOG PEE environment; then select the ''Registration and inventory''. Once
    done,


    go to the FOG''s repository of known hosts, log in and go to Head Management >
    List All Hosts. Click on the host you''ve created, corresponding to the newly
    added machine and rename it to something identifiable, like Desktop-01. Also don''t
    forget to associate the machine with the FedoraWorkstation image using the Host
    image pull-menu. Repeat this process to register all the computers in the FOG
    server. Then select to give them an identifiable name and associate them with
    the appropriate image such as the Fedora image that you deploy


