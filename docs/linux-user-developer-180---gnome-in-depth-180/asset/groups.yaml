    Now to replicate this image onto the targets, go to Task Management > List All
    Hosts. Select the hosts to find the entry computer you wish to deploy and hit
    the corresponding arrow ''Deploy image''. After the day go to the workstation
    and power it on. The FOG environment will automatically detect the FOG server
    and begin copying the image from the server to the local machine. It''ll take
    some time when it''s done, you''ll end up with the Fedora Workstation 25 installation
    on computer.


    # Advanced FOG features


    FOG is a complex piece of software and while it covers the core features of its
    server, it is scalable and can manage large networks over multiple locations in
    the same or around the world. It also has many features of the FOG server, especially
    for admins of networks, it''s the multicast using.


    > One of the most useful features of the FOG server, especially for admins of
    large networks, is the multicast ability


    you can deploy multiple machines in one go. However, you''ll need to make sure
    your FOG server has enough computational and resources to store many images simultaneously.
    For larger networks, you might have multiple FOG servers configured as storage
    servers. These storage servers share images and take the load of the FOG server
    when imaging computers. The distributed storage servers also speed up the process
    by data replication.


    Note that FOG works best in machines with identical hardware, particularly similarly-sized
    disks. You can also deploy and image your computers by the FOG dashboard from
    a mobile device such as a tablet.


