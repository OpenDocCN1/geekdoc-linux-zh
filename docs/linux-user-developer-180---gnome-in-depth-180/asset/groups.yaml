    The next command will create a new named sampleTable that is selectable.

    The output of the command will be {ok}. If the command mnesia:create_table() function
    fails, you will get an {aborted, Reason} tuple instead. This happens if you are
    trying to create a table that already exists. However, you will also need to perform
    operations from Erlang using a slightly different technique. So, let us define
    a new record and use it to create the table that will be named My.record.


    ```

    >= mnesia:create_table(sampleTable, {type, attributes, record_info(fields, sample)})

    ```


    ```

    -record(sampleTable, x, y).

    ```


    Then, you should create an mnesia record,


    ```

    >= mnesia:create_table(sampleTable).

    ```


    Above the testlist function lets you view the data of a table while table_info
    shows information about a table


    this case will be named createTable.erl, containing the following code:


    ```

    -module(createTable).

    -export([init/0]).

    ```


    ![](img/80af6fd0c5ad221222cba94201825f7f_52_0.png)


    Figure 5


    # What is ETS?


    ETS stands for Erlang Term Storage and collection. It is used using dynamic tables,
    where the data is stored as tables. Is ETS Mnesia? No, but it has many more resources.
    Consider it when developing simple applications. The short answer is yes.


    ```

    {mnesia:create_table(

    ok,create_table:deletes_record(13),

    ok,create_table:deletes_record(15),

    nok,create_table,

    nok,create_table,

    {sampleTable, -1, ~1},

    {sampleTable, 5, ~5},

    {sampleTable,delete___record(1),

    nok,create_table:deletes_record(5),

    nok,create_table:deletes_record()({sampleTable, -12, ~12})

    ets:delete2(sampleTable)}

    ```


    ```

    -include("MyRecord.hrl

    ```


    Once you create the sampleTable.table, Figure 2 shows various examples of the
    table contents – you should try to execute some of them on your machine and populate
    them with your own data.


    However, after using the Erlang shell, the sample table will be deleted in RAM,
    not on disk. In the next section of this tutorial, you will learn how to store
    your data on.


    # Inserting data


    As the first thing you will need to learn how to insert data into Mnesia tables.
    The following mnesia:create_table() function will tell you what is based on the
    disk record:


    ```

    mnesia:create_table(onDisk, {disc, nodes}, {type, attributes, record_info(fields,
    onDisk)}).

    ```


    All of the storing on-disk is handled by the {disc, nodes} options. Now that you
    know how to create persistent records in Mnesia, it is the perfect time to learn
    how to insert data into an Mnesia table, which in this case will be sampleTable:


    ```

    >= mnesia:transaction(function() -> mnesia:write(sampleTable, #sampleTable{x=1,
    y=1}) end).

    ```


    The previous Erlang command inserts a record into the sampleTable using an anonymous
    function.


    ![](img/80af6fd0c5ad221222cba94201825f7f_52_1.png)


    ```

    mnesia:create_table(sampleTable).

    ```'
