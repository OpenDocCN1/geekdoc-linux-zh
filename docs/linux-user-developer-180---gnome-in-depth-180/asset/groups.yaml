    100% 的资金都支付给人们。这些资金来自支持 elementary OS 的用户，这就是为什么我们采取“按下载付费”模式，而且支持该项目以及我们的工作方式（包括薪资）非常重要。在这一点上，我们能够根据薪资构建项目，我们最近专注于桌面端和操作系统。


