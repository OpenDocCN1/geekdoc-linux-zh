    的原理类似，你使用请求的 dav: /dav/。如果你使用的是自定义服务器，请访问 https://www.nextcloud.org/projects/dav/
    来查找你的存储位置。


    ## 05 配置


    Nextcloud 需要一个数据库。对于大多数个人站点，SQLite 即可，但较大的站点受益于“正规”的 SQL 数据库。MariaDB 需要多进行一些设置，但它是值得的。你需要设置一个供
    Nextcloud 使用的用户名和密码。这在 Nextcloud 网站上有相关文档。


    ## 06 开始使用


    将 ZIP 压缩包解压到服务器的根目录。通过 SSH 访问服务器最容易实现。如果你没有访问权限，你需要要求服务器管理员为你操作。如果你使用托管服务，他们将有一系列标准的
    Web 应用，只需点击控制面板即可为你安装。


    ## 同样安全上传


    Nextcloud 让创建变得简单。新的“安全投递”（Secure drop）功能允许你向任何人提供匿名访问，但为了提高机密性，不会让其看到文件夹中的文件。


    ## 标记日期


    日历是群组软件的重要部分，Nextcloud 并没有忽略它们。如果从其他服务迁移，你可以将日历导出为 ICS 文件，但你无法将其导入 Nextcloud。考虑也导出现有的日历，但如果你也想在
    Nextcloud 中导入它，日历应用可以订阅其他日历，这样你的信息就会在两个地方都显示。例如，访问 Nextcloud，查看你的日历并点击菜单按钮选择名称“日历设置”。出现的页面上有各种选项，你可以将其导出为
    ICS 文件。


    如前所述，或者一个你日历的订阅 URL。点击日历地址部分的 ICAL 按钮，获取一个你可以粘贴到 Nextcloud 订阅框中的 URL。这是订阅非公开日历的选项，使用下一个——标记为“私有地址”（Private
    Address）的 ICAL 按钮。订阅此类日历，你可以在 Nextcloud 中查看事件。然而，如果你的服务器有公共 IP 地址，你可以创建一个链接并在
    Google 或其他日历订阅你的 Nextcloud 日历，这样你仍然可以在 Nextcloud 中创建事件并在其他日历中看到它们。


    总而言之，这对云是一个很好的增强，你的数据留在你想留下的地方，并且只有你授权的人才能读取。


