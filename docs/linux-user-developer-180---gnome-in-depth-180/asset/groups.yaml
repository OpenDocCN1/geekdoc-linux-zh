    # Clone computers over the network


    Use FOG to image and roll out several computers without leaving the comfort of
    your armchair


    ![](img/80af6fd0c5ad221222cba94201825f7f_33_0.png)


    the computers on the network. Once you have your network set up, head to the machine
    that you''ve earmarked for the FOG server and download the latest stable FOG release
    from its Git repository (or if you have it) github.com/FOGProject/fogproject.git
    clone --fogproject. Once it''s downloaded, clone it into the binary directory
    where you like, and run the installation script with /installfq.sh. The installation
    script will prompt you for bits of information such as the IP.


    You are about to log off, someday that you still have time to make it to your
    anniversary dinner. But just before you leave, the boss asks you to provide five
    computers for the second and third floors for interns. You realize yourself standing
    up, the novelty phone anticipates the unpleasant conversation that you are about
    to make.


    The life of a system administrator isn''t easy. Managing a full network of computers
    can sap the energy out of anyone, regardless of the size of your team. This is
    where FOG project comes in to save you from time-consuming repetitive tasks such
    as installing and configuring computers. FOG can also manage printers on the network.
    Its most essential task is to image an installation and deploy it to all your
    computers, which is what we''ll cover in this tutorial.


    With FOG running on it, the IP address of the server, and the DNS server to set
    up the FOG server''s DHCP server. It''s best to use the default options suggested
    during the installation. Once the installation is complete, the installer will
    ask you to install the database by going to the web-based management interface
    of the FOG server. For your instance, it will also ask for the URL of the database.
    After that,


    following the instructions to come back and enter the URL for FOG (such as http://192.168.1.102/fogmanagement).
    Open the link in your web browser and log in with the default credentials (fogpass).
    Once logged in, go to User Management > Create New User to define an appropriate
    machine name.


    # Set up the imaging server


    Before installing FOG make the server has a static IP address, which can be easily
    assigned from your router''s address map. Make sure that that all the machines
    in your network are configured to boot from the FOG server. Finally, remember
    to disable any other DHCP server on the network and set up the FOG server as your
    DHCP server and hand out addresses to all


    # Image the host


    Now that our server is set up, we''ll use it to image a computer. Once computer
    has been imaged, deploy it to other computers with a single click. In the process,
    head to Image Management > Create New Image. Use the fields to describe the image.
    For example, let''s say we are creating an image of a PC named Workstation installation
    that we then use on all our computers in the network. We can name the image "Fedora
    Workstation",'
