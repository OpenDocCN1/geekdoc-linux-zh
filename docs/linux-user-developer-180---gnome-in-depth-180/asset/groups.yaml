    ## 树莓派


    ### 树莓派基金会与 CodeDojo 合并


    该慈善机构旨在开发未来的代码


    青少年编程在近年来逐渐获得关注，树莓派基金会现在准备将其推向新的高度。


    该基金将与 CodeDojo 合作，CodeDojo 是一个全球性的编程俱乐部网络，于 2017 年左右在 177 个地方启动。从那时起，项目已扩展到 69
    个国家，有超过 35,000 名年轻编码员学习代码世界。


    树莓派基金会执行官 Philip Coligan 在一篇文章中指出，很显然，这次合并对双方都有意义。这两个组织将共同推进各自的使命，利用各自的资产和能力，帮助更多成年人和年轻人享受编程。“树莓派基金将为
    CodeDojo 基金会提供技术和资金支持，”Coligan 说道。


    尽管 Coligan 未能证实，但预计会有更多 CodeDojo 的参与者能够拥有他们自己的树莓派设备，并提供必要的资金支持以继续俱乐部的快速扩张。此举还将帮助他在
    CodeDojo 基金会担任运营成员角色，允许他对该组织向新领地扩张的所有事务提供建议。


    另一方面，CodeDojo 各俱乐部中树莓派设备的增加将帮助每个人更接近计算世界。有关您需要的 CodeDojo 部的更多信息，请访问 https://codedojo.com。


    ## 网络


    ### 使用 Istio 转换微服务管理


    Google 和 IBM 的最新项目，进一步完善任何开发者的工具箱


    微服务正成为寻求拆分传统大型应用的开发者的首选架构，这些应用随后通过 API 进行通信。为了改善这一未来，Google、IBM 和 Lyft 合作发布了 Istio，这是一个旨在帮助微服务部署并保护其托管应用程序安全的开源平台。


    虽然已经存在类似的工具，但 Istio 是其中之一，可以在不对与其配合的应用程序进行任何更改的情况下使用。此外，它在网络层运行，使用代理来拦截与微服务之间的某种网络通信。传统上，拆分架构是困难的，但有了
    Istio，你拥有了所有工具来完全简化过程，同时还可以选择并实施程序来加速这一过程。


    ## 开发


    ### 微软发布全新的开源开发者工具


    用于简化应用程序开发


    在最近的加利福尼亚州 Codefest 上，微软上台宣布了最新的开源项目 Draft。这款新工具旨在简化运行在 Kubernetes 集群上的应用程序的开发，因为
    Kubernetes 的使用量正在增加。Draft 对许多人将非常有帮助，而且所有可访问性一直是首要任务。在两个简单的案例中，开发者就可以开始编写基于容器的应用程序。更好的是，没有任何
    Kubernetes 预备的用户也能轻松找到他们所需的一切。


    尽管目前仍处于开发的相对早期阶段，但 Draft 旨在扩展其编码功能。它现在可以在本地使用，但将引入云端元素。在编写时，它可以通过 https://github.com/draft
    获取。


