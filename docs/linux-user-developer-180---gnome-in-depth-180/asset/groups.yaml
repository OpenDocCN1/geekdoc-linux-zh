    RISC-V: an open computer architecture defines the fundamental architecture and
    instructions and low-level behaviour of a computer system, as described by its
    instruction set architecture (ISA). Examples of ISA are x86 (Intel x64 and AMD64)
    and ARMv8 (6-bit ARM).


    ![](img/80af6fd0c5ad221222cba94201825f7f_15_1.png)


    Beyond these, Linux already contains support for 32 different architectures (though
    one of those is scheduled for removal), including one earlier attempt at an open
    source RISC. Just like OpenRISC, RISC-V aims to provide a fully unencumbered (not
    explicitly protected) ISA that can be built completely using open hardware platforms.
    Various hardware designs are available.


    RISC-V microprocessors are available under an open source licence.


    Those familiar with the use of hardware description languages (HDLs), such as
    Verilog and VHDL, or those interested in learning, can use the RISC-V microprocessor
    (e.g. BOOM - Berkeley Out-of-Order Machine) to implement their own field-programmable
    gate array (FPGA).


    Krill also allows you to easily build and test a few custom chip designs in your
    space. For those less inclined to modify microprocessor source, inexpensive RISC-V
    development kits are available, as software modules.


    Porting an architecture is a lot more than simply defining the instructions that
    the machine will execute. It also requires knowledge of memory models, the porting
    of toolchains (the ''binutils'') GNU assembler and GNU Collector, compiler, and
    other essentials for the development of different applications. However, a few
    dozen pieces are also required to be built to allow a library that can be used
    by all applications. In respect, the RISC-V port is the first step to seeing Linux
    available for future devices made by the RISC-V Foundation. To learn more about,
    visit https://riscv.org/

