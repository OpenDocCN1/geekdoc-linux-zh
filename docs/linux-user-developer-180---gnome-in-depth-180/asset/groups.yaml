- md: "\n# INTRODUCING...\nNEXTCLOUD 12\n\nAre you tired of Google reading your mail\
    \ and looking at your holiday photos?\nNeil Bothwick looks at running your own\
    \ cloud server with Nextcloud\n\n# New features\n\n- Instant apps\n  Easy access\
    \ to apps, as you are now in the top bar of the web interface.\n\n- Invite guests\n\
    \  Guest accounts to give someone temporary access without making them a member\
    \ of your cloud.\n\n- Circles\n  A basic social network within your cloud to send\
    \ messages and files to groups of users.\n\n- Impersonate app\n  Enables an admin\
    \ to log in as a user to deal with an issue they have.\n\n- Secure shared folder\n\
    \  Secure Drop enables users to upload files to a shared folder without showing\
    \ them existing content.\n\n- Federated shares\n  Share files and folders with\
    \ remote Nextcloud and ownCloud servers.\n\n![](img/80af6fd0c5ad221222cba94201825f7f_56_0.png)\n\
    \n> The cloud is as nebulous as the meteorological object it is based upon. Exactly\
    \ what term means is nobody deliberately, as it enables companies to use it for\
    \ whatever they want, within certain limitations. One of those limits is what\
    \ may be the correct definition of the cloud 'somebody's computer'. There is no\
    \ doubt that cloud computing offers many benefits, whether you are looking at\
    \ a mail service, file sharing, document collaboration or other applications,\
    \ the idea of letting someone else take care of the administration but just your\
    \ service out to theirs. There is always a 'but' and in this case it is 'you are\
    \ trusting your data to somebody else's computer'. Now, you may not have a problem\
    \ with many people, but you are trusting someone you know.\n\nto run it, which\
    \ brings us to one of the disadvantages of running your cloud - you have to do\
    \ everything. This only means installing, configuring, keeping the system up to\
    \ date with backups and disaster recovery procedures are in place. It is a choice\
    \ to trust someone else to do it for you, or in no doubt that you can trust your\
    \ own data. Nextcloud makes the prospect of losing everything in a disk failure\
    \ far less likely.\n\nNextcloud works with the popular web servers although only\
    \ Apache and Nginx are supported. It also runs on lighter servers like Raspberry\
    \ Pi, although you have PHP available.\n\nNextcloud allows you to run your own\
    \ cloud services. Its core function is file sharing but it goes quite way beyond\
    \ that, especially with the inclusion of the new release. Collaboration is an\
    \ important feature, allowing more than one person to edit the same file or others\
    \ when files are uploaded. Standard features such as calendars and photo galleries\
    \ are also included, along with a host of apps to make life easier for both users\
    \ and administrators.\n\n# Files galore\n\nAt its heart, Nextcloud is an online\
    \ storage system. It has many other features, but basically. When you log in your\
    \ Nextcloud account, you see a list of files and directories, which can be downloaded\
    \ to the device.\n\nNextcloud is a PHP web application, which means you need a\
    \ web server\n\n![](img/80af6fd0c5ad221222cba94201825f7f_56_1.png)\n\nAbove The\
    \ Details tab\nnot only changes\nto a file but also allows\nto revert to older\
    \ versions\n\nRight Setting up\na Secure Drop folder that\ncan be shared but\n\
    not viewed\n\n![](img/80af6fd0c5ad221222cba94201825f7f_57_0.png)\n\n# Nextcloud\
    \ vs owncloud\n\nNextcloud is a fork of owncloud, set up by some of the owncloud\
    \ developers. The main features are in\nlensing. While\nowncloud adopts\ntntodel\
    \ of an\nopen source\nanter enterprise\nedition is completely\nopen source. The\n\
    team provides\nlevel support\npackages, but\nremains free. \n\n![](img/80af6fd0c5ad221222cba94201825f7f_57_1.png)\n\
    \n# Nextcloud Synchronizing with local folder\n\nnextcloud\n\n53 GB in use\n\n\
    Account\n\n- Documents (562 GB)\n- Local (53 GB)\n- Photos (2 MB)\n- uploads (508\
    \ KB)\n\nAdd Folder Sync Connections\n\nAbove Linux desktop sync client - all\
    \ files can be uploaded through. If this links Dropbox or Google drive, it is\
    \ different. Important differences: there are no limits to what you can upload,\
    \ and there is no limit on storage on the server. If you want set limits, but\
    \ they are your limits.\n\nActually, using the URL, which is hostname=nextcloud\
    \ it you installed on the document root of your server. You can see your files,\
    \ upload and download, and, administer them. Or a more automatic way to access\
    \ your files, is the desktop sync client, which is available for many desktop\
    \ and mobile platforms. The Linux desktop client will work in the background and\
    \ protects your entire Nextcloud storage with a local folder, or you can sync\
    \ one or more subordinates with separate layer sync. being instantaneous: copy\
    \ a file to the local folder and in the web interface. The desktop client is capable\
    \ of connecting to many servers, syncing each to a different local folder.\n\n\
    # Sharing for all\n\nSo far, all is a mirror of your files, which is useful enough\
    \ in itself, but it would be nice to share them with others. This is done in oneone\
    \ simple step: the link generator produces a URL that you can give to others to\
    \ download the file, or you can simply type in the email address to have the link\
    \ mailed directly. You can optionally allow others to edit the file than simply\
    \ download it. It follows that to share files outside of your LAN, your server\
    \ would need to be accessible from outside.\n\nLinks are fine for sharing the\
    \ old file, but if you want more, or to collaborate, you need to add users to\
    \ others. The user you create when you set up Nextcloud as an administrator is\
    \ that you can create others as well as groups. With Linux permissions, separately\
    \ users can be invited by file invitations. To start with this is only one group,\
    \ admin your user. You can also share files with users on Nextcloud (or owncloud)\
    \ servers, by giving a share address to them. You could run a Nextcloud server\
    \ in each office of a company, so everything is allowed at LAN speed,\n\n> Yes,\
    \ you can use Google Drive or Dropbox as storage for your Nextcloud server\n\n\
    but then share folders between those offices, giving redundancy as fast as access.\
    \ Nextcloud calls them 'Federation Shares', although there is no marked 'made\
    \ it so!'.\n\n# Added security\n\nSecurity of your data is important. This is\
    \ why Nextcloud offers the occasional, not subtle, hint about using HTTPS to connect\
    \ to your server. You need a certificate, self-signed one or better yet, get one\
    \ from letsencrypt.com. If you are running Nextcloud in a commercial setting,\
    \ it is worth the expense of buying own SSL. If you are running Nextcloud on a\
    \ VPS, you can use the encryption module. This is not enabled by default for all\
    \ uses, but it is in the app. Encryption has to be enabled by admin user and applies\
    \ to all files stored on the server. The user's details are encrypted as well.\
    \ Encryption is particularly useful when using remote storage, like of other storage\
    \ services. There are many storage services that provide service account of storage\
    \ for free. With remote storage, you can make it available to everyone or limit\
    \ it to certain users or groups. The remote storage is allocated to a specified\
    \ folder on your server, rather like a local drive. This helps you so you know\
    \ what data is stored on which.\n\n![](img/80af6fd0c5ad221222cba94201825f7f_58_0.png)\n\
    \nA Comprehensive list of what files and folders users have ever edited and shared\
    \ and when it was available to administrators\n\n# File details\n\nClick on the\
    \ 'Menu' button to open the Details tab. Here you can find more information about\
    \ the file. The Activities list shows when changes were made to the file contents\
    \ or such as (sharing) and by whom. You can also see a list of recent activities\
    \ for all of you with the Activity in the top bar. The Comments tab lets you leave\
    \ messages that can be read by anyone the file is shared with. Interestingly,\
    \ when more than one person is editing the file, the Versions gives access to\
    \ previous incarnations of the file. Saving of versions is handled automatically,\
    \ and the server keeps older versions according to a policy; for versions older\
    \ than a month, it keeps one per week. If you are running out of disk space, Nextcloud\
    \ will delete the oldest versions until the 50th threshold is reached, or as deleted.\n\
    \nFiles are also assigned tags here and all files with a certain tag can be tagged\
    \ together, making organizing projects easier. This is an auto-tagging feature\
    \ that tags files as you decorate. Files can be marked as favourites, which could\
    \ for instance be used to highlight files that need work, so you can easily see\
    \ how much you have left to do.\n\n![](img/80af6fd0c5ad221222cba94201825f7f_58_1.png)\n"
  mdcn: "\n\n# 隆重推出...\nNEXTCLOUD 12\n\n你是否厌倦了 Google 读取你的邮件并查看你的假期照片？\nNeil Bothwick\
    \ 将为你介绍如何使用 Nextcloud 运行你自己的云服务器。\n\n# 新功能\n\n- 即时应用 (Instant apps)\n  可以轻松访问应用，现在它们位于\
    \ Web 界面的顶栏。\n\n- 邀请游客 (Invite guests)\n  通过游客账户赋予他人临时访问权限，而无需成为你云的成员。\n\n- 圈\
    \ (Circles)\n  云内部的一个基础社交网络，可以向用户组发送消息和文件。\n\n- 模拟应用 (Impersonate app)\n  允许管理员以用户的身份登录，以处理他们遇到的问题。\n\
    \n- 安全共享文件夹 (Secure shared folder)\n  Secure Drop 允许用户将文件上传到共享文件夹，而不显示现有内容。\n\n\
    - 联邦共享 (Federated shares)\n  与远程 Nextcloud 和 ownCloud 服务器共享文件和文件夹。\n\n![](img/80af6fd0c5ad221222cba94201825f7f_56_0.png)\n\
    \n> 云就像它所基于的气象现象一样变幻莫测。没有人刻意定义这个术语的含义，因为它允许公司在某些限制内将其用于任何他们想要的地方。限制之一可能就是对云”的正确定义——“某人的计算机”。毫无疑问，云计算提供了许多益处，无论你是在查看邮件服务、文件共享、文档协作或其他应用程序，让别人负责管理而你只需将自己的服务扩展到他们的服务的想法是有益的。但总有一个“但是”，在这种情况下，它就是“你把自己的数据托付给了别人的计算机”。现在，你可能对很多人没有意见，但你信任的是你认识的人。\n\
    \n运行它，这让我们看到了运行自己的云的缺点之一——你必须完成一切。这仅意味着安装、配置、保持系统更新，并制定备份和灾难恢复程序。你可以选择信任他人为你完成，也可以毫无疑问地信任你自己的数据。Nextcloud\
    \ 让磁盘故障导致丢失所有数据的可能性变得小得多。\n\nNextcloud 与流行的 Web 服务器兼容，尽管目前仅支持 Apache 和 Nginx。它也可以运行在树莓派等轻量级服务器上，只要你有\
    \ PHP 环境即可。\n\nNextcloud 允许你运行自己的云服务。它的核心功能是文件共享，但功能远超于此，尤其是包含了新版本的加入。协作是一项重要功能，允许多人编辑同一个文件，或者在文件上传时由他人操作。日历和相册等标准功能也包含在内，还有许多让用户和管理员生活更便利的应用。\n\
    \n# 海量文件\n\nNextcloud 的核心是一个在线存储系统。它还有许多其他功能，但基本上，当你登录 Nextcloud 账户时，你会看到文件和目录列表，这些内容可以下载到设备。\n\
    \nNextcloud 是一个 PHP Web 应用程序，这意味着你需要一个 Web 服务器\n\n![](img/80af6fd0c5ad221222cba94201825f7f_56_1.png)\n\
    \n详情 (Details) 标签页上方\n不仅可以更改\n文件，还允许\n恢复到旧版本\n\n正确设置\n一个 Secure Drop 文件夹，\n可以共享但\n\
    不可查看\n\n![](img/80af6fd0c5ad221222cba94201825f7f_57_0.png)\n\n# Nextcloud 对比 owncloud\n\
    \nNextcloud 是 owncloud 的一个分支，由一些 owncloud 开发者创建。主要功能在于\n核心。虽然\nowncloud 采用\n开源\n\
    企业版是完全\n开源的。\n团队提供\n企业级支持\n包，但\n保持免费。\n\n![](img/80af6fd0c5ad221222cba94201825f7f_57_1.png)\n\
    \n# Nextcloud 与本地文件夹同步\n\nnextcloud\n\n已用 53 GB\n\n账户\n\n- 文档 (562 GB)\n- 本地 (53\
    \ GB)\n- 照片 (2 MB)\n- 上传 (508 KB)\n\n添加文件夹同步连接\n\n在 Linux 桌面同步客户端上方——所有文件都可以通过这里上传。如果链接了\
    \ Dropbox 或 Google Drive，情况会有不同。重要区别在于：上传内容没有限制，服务器上的存储空间也没有限制。如果你想设置限制，那将是你自己的限制。\n\
    \n实际上，使用 URL（如果你将其安装在服务器的文档根目录，则主机名为 `nextcloud`），你可以查看、上传、下载并管理你的文件。或者一种更自动的访问文件的方法是使用桌面同步客户端，它适用于许多桌面和移动平台。Linux\
    \ 桌面客户端将在后台运行，并通过本地文件夹保护整个 Nextcloud 存储，或者你可以通过分层同步同步一个或多个子目录。它是瞬时的：将文件复制到本地文件夹，Web\
    \ 界面就会更新。桌面客户端能够连接到许多服务器，并将每个同步到不同的本地文件夹。\n\n# 所有人共享\n\n到目前，一切都是你文件的镜像，这本身已经足够用了，但如果能与他人共享就更好了。这可以通过简单的步骤完成：链接生成器产生一个\
    \ URL，你可以给其他人来下载文件，或者只需输入电子邮件地址让链接直接通过邮件发送。你可以允许他人编辑文件而不仅仅是下载。这意味着，要在局域网之外共享文件，你的服务器需要从外部访问。\n\
    \n链接对于共享旧文件很好，但如果你需要更多功能或进行协作，你需要向他人添加用户。当你作为管理员设置 Nextcloud 时创建的用户，你也可以创建其他用户和组。通过\
    \ Linux 权限，用户可以通过文件邀请被单独邀请。开始只有一个组，即你的管理员用户。你还可以通过提供共享地址与 Nextcloud（或 owncloud）服务器上的用户共享文件。你可以在公司的每个办公室运行一个\
    \ Nextcloud 服务器，这样在局域网速度下允许所有操作，\n\n> 是的，你可以将 Google Drive 或 Dropbox 作为你 Nextcloud\
    \ 服务器的存储\n\n但在这些办公室之间共享文件夹，提供与访问一样快的冗余。Nextcloud 将其称为“联邦共享”，尽管没有明显的标记“已实现！”。\n\
    \n# 增强安全性\n\n你的数据安全至关重要。这就是为什么 Nextcloud 会偶尔给出并不含蓄的提示，建议使用 HTTPS 连接到你的服务器。你需要一个证书，自签名证书也可以，最好从\
    \ letsencrypt.com 获取一个。如果你在商业环境下运行 Nextcloud，购买自己的 SSL 是值得的支出。如果你在 VPS 上运行 Nextcloud，可以使用加密模块。加密必须由管理员用户启用，并适用于存储在服务器上的所有文件。用户的详情也会被加密。在使用远程存储（如其他存储服务）时，加密特别有用。许多存储服务提供免费的存储账户。通过远程存储，你可以让所有人可用或将其限制为特定用户或组。远程存储被分配到你服务器上的指定文件夹，类似于本地驱动器。这可以帮助你知道哪些数据存储在哪个位置。\n\
