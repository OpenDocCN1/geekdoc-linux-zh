    # 三星 Chromebook Pro


    ![](img/80af6fd0c5ad221222cba94201825f7f_85_0.png)


    ## 硬件


    ## 三星 Chromebook Pro


    ## 下一代 Chromebook 已就绪（如果你买的话）


    这款 12.3 英的三星设备既是 Chromebook 也是安卓平板电脑，首次将 360 度翻转笔记本电脑设计与 3:2 屏幕相结合，并适用于 Chrome
    OS 上支持手写笔。


    这台全金属 Chromebook 的重量仅为 1.8 公斤，是同类设备中最轻的，而且与大多数笔记本电脑相比更是轻如羽毛。Pro 版还极其纤薄且灵活。


    我们有机会评测了一台原型机，我们的评测价格为 849 美元（649 英镑），并将从美国发货，这是一个中等价格，比昂贵的 Asus Chromebook 低。


    我们评测机的一个主要区别是，零售版的外观是喷射黑。即使在关闭状态下，它看起来也非常时尚。


    Pro 配备了你本会在平板电脑上看到的 3:2 显示屏。这种正方形宽高比与 16:9 和 21:9 的宽屏比例不兼容，导致视频显示不自然，在内容上下会留有黑边。


    它比 Asus Chromebook 轻了 40 磅。它也内置了手写笔，但存储空间与 Asus 一样。目前，三星 Chromebook 仅在英国和澳大利亚发布。


    翻转属性的另一个遗憾影响是导致键盘非常拥挤。它没有空间伸展，导致整体按键较小，且键位偏移。


    Pyina

    $849

    网站

    www.samsung.com

    规格

    - 处理器: 0.99GHz Intel m3-Y330 (双核，mcache)

    - 图形: Intel HD Graphics 515

    - 内存: 4GB LPDDR3

    - 存储: 64GB SSD

    - 屏幕: 12.3 英寸 2400x1600 LED 显示屏

    - 端口: 2x USB-C, micro microSD 卡槽, 耳机接口, Wi-Fi, 蓝牙 4.0

    - 重量: 2.8 磅 (1.08kg)

    - 尺寸: 11.6x8.72x0.55-0.55 英寸 (29x22.1x1.4 cm)


    我们的原型机是银色的，但零售版是喷射黑


    86


    ## 总结


    一块惊艳且生动的 UHD 显示屏。Chrome OS 触摸支持感觉像纸一样自然，设计精美且简单。


    翻转屏幕后，Chromebook Pro 的感觉就像使用任何安卓平板电脑一样自然，而且在所有设备中——它是保持了正常尺寸的设备。这是一个不习惯的环境，但在使用
    Chromebook 几周几个月后你可以适应。


    三星将 Chromebook Pro 称为一种针对 Play Store 设计的新类设备。这台设备配备了 gopilot 和键盘。最重要的是，这是第一款内置手写笔的
    Chromebook：在演示期间将其抽出，可以为你的屏幕层指针添加新工具。


    对于写作和素描，手写笔感觉非常自然且精准。三星精调了玻璃与笔之间的间隙，使其感觉像在纸上写字一样。手写笔具有压力感，所以你按屏幕力度越大，线条就越粗。


    Google 开发了软件来减少使用手写笔时的延迟。Google 的云和机器学习技术利用了数千小时的解释和艺术笔触来预测笔的去向。所有这些预测软件都内置在 Chromebook
    Pro 中，因此无需担心记录你的击键或为了流畅的写作或绘图体验而连接网络。


    ## 缺点


    - 拥挤的键盘。

    - 九小时电池续航，虽然不像其他 Chromebook 好。

    - 扬声器较弱。


    为 Google 推的未来设备而设计。对于 70% 到 90% 的时间需要安卓平板电脑的用户来说，这是完美的 Chromebook，设备可以翻转回传统的笔记本电脑用于写作和偶尔的额外操作。如果你的使用场景相同，那么它适合你。


    三星能够胜任很多功能，包括4k 媒体，其 Intel Core i3-6130 处理器性能充足。这对于大多数 Chromebook 来说通常过剩了，但三星最新的
    Chrome OS 机器将这种性能用于驱动 UHD 屏幕并运行更多的安卓应用。高端硬件意味着对电池寿命的影响。我们的标准电池测试连续运行了近九小时并脉冲


    翻转屏幕后，Chromebook Pro 的感觉就像使用任何安卓平板电脑一样自然。它熟悉的平板电脑形状非常适合阅读文章和电子书内容。有了安卓应用，你可以下载我们的视频离线观看。


    Google 告诉我们，其余部分有稳定的软件发布并拥有完全访问 Play Store 的权限。无论如何，所有安卓应用运行得几近完美。偶尔会出现小故障，例如应用程序没有正确缩放文本，但我们只能希望未来会得到改进。


    - Kevin Lee


