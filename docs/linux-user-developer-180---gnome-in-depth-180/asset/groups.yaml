    web server. This is usually either www-data or apache. If doubt, look in the main
    Apache configuration.


    # 05 Configure it


    Connect your web browser at http://your-server/nextcloud to perform the initial
    configuration. You will need to choose a user and password for admin, select the
    database engine and pick the location of the database output. By default, that
    is nextcloud/data in the document root, but a more secure location is outside
    of the area accessible by the web. You can also set it up from the command line
    - see the docs.


