  mdcn: "\n\n## FOSS 许可证特性\n\nRightFOSS 是一个免费在线工具，允许您发现每种软件的许可证并帮助生成版权声明。\n\n![](img/80af6fd0c5ad221222cba94201825f7f_29_0.png)\n\
    \n许可证，也称为著权共享许可（copyleft licences），是确保自由对个人可用或也扩展到所有下游用户的许可。也就是说，如果开发者修改了根据著权共享许可证发布的软件，他们被要求按照相同的许可证发布这些修改。著权共享许可的目标是确保自由对所有下游用户保持可用且不受限制。最流行的著权共享许可证是\
    \ GNU 通用公共许可证（GPL）。\n\n自由软件努力为所有用户保护并扩展四种自由；这些自由是：研究和修改软件的自由；分发修改后版本的自由。\n\n自由软件许可证允许分发四种自由，因为它是一项义务，要求所有修改（包括衍生作品）必须按照相同的许可证发布。这就是“著权共享”如何将专为创作者保留并受版权法保护的保留权利扩展给每个人。\n\
    \n学术许可证 - 也允许许可性的完全授权（permissive blanche），允许学生在使用、修改和分发作品时具有较少的限制。这类似于许多大学对知识的程度。然而，这些信息如何使用完全留给学生决定。BSD\
    \ 和 MIT 对根据这些许可证发布的软件的使用场景提供了完全自由，仅要求保留原始作者信息。\n\n## 许可证的剖析\n\n衍生和修改后的作品按照相同许可证发布的实例并没有赋予社区中的任何人（特定权利），这导致了并行开发以及“开源”这一术语的产生。\n\
    \n## 协作工作\n\n自由软件与开源之间的主要区别在于，后者不要求在父级许可证下发布衍生作品，而这是著权共享许可证的严格要求。这确保了自由软件的自由不会丢失，而著权共享许可证并非如此。\n\
    \n开发者可以使用许可证许可他人使用该软件，这可能限于在非常特定的条款下使用软件，甚至可以定义具体的情境，开源许可证正是此类情况。\n\n开源许可证可以进一步归类为互惠型（reciprocal）或通用（generic）。\n\
    \n版权和许可证的条文限制了软件作者，而所有使用软件的人都是其被许可者，这导致了对作者版权的侵犯。通过许可证扩展自由，原始创作者并没有放弃版权条款，这些条款以前在各种管辖区的法院已经过多次考虑。\n\
    \n- 合同和许可证是两个不同的法律术语，必须仔细制定。每一项都需要若干元素，例如要约（offer）、对价（consideration）等。我们不必涵盖所有构成合同这两项基本要求的的因素：\n\
    - **意思一致（Consensus ad idem）**；也称为意气相投。这是合同双方同意受合同条款约束的共同协议。\n\n> 小贴士\n 侵权行为可能导致比违约更高的损害赔偿裁决，这对于执行特定条款是最有利的。\n\
    \n# GPL\n\n# MIT\n\n# BSD\n\n最新版本于 2007 年发布。像其前身 GPL 一样，它要求发布被许可作品的完整源代码。修改和衍生作品应按照相同的许可证发布。仅推荐软件。Bash\
    \ 和 GIMP 根据 GPLv3 发布。\n\n一种简短且非常宽松的许可证。允许被许可作品用于商业用途。衍生作品可以在不同的条款下发布且无需提供源代码。修改可以公开发布。Rails、jQuery\
    \ 等许多项目因其相似性而使用了它。\n\n最新的三条款许可证，虽然与旧的 BSD-2 条款和 MIT 许可证相似，但它增加了一项。它要求衍生作品在没有事先明确许可的情况下不得使用原始项目或其开发者的名称。仅推荐用于软件，不适用于其他。\n\
    \n> > 对价：双方进入合同的原因。它通常指合同中达成的某种交易，其中一方执行或同意执行某项行为，以换此类价值（信息、金钱或货物）。其核心思想是开源软件意味着同意受其条款约束，法院对此问题尚未采取相反的立场。\n\
    \n与专有软件不同，开源许可证不要求被许可者在使用软件前明确表示同意。尽管长期以来存在对价交换，但许多开源许可证被发现是可执行的。\n\n重要的一点是理解，如果开源许可证可能导致侵权，合同法描述了如何解释以及违约的救济措施。当客户面临违约等重要问题时，既定合同可以提供此类防御。\n\
    \n在加利福尼亚州北区地区方法院的 Artifex Software 诉 Wancom Inc 案中，法院裁定侵犯开源许可证是代价昂贵的。\n\n这是因为被告（hat）辩称，仅使用根据\
    \ GPL 许可的软件并不会在双方之间建立合同。\n\n然而，法院认为 GPL 的条款明确要求遵守软件分发的条件。虽然该命令在许多方面具有重要意义，但该裁决基本上意味着在发生版权侵权后，也可以就违约行为提起诉讼。\n\
    \n联邦法院此前（Jacobsen 诉 Katz）裁定，开源软件中没有金钱往来并不意味着法院可以放弃将开源许可证建立为合同的方法。\n\n## 小贴士\n\n\
    在 GPL 等许可证中使用 `+` 意味着软件可以按照开发者希望的后续版本发布。\n\n## 强制合规\n\n对于开发者来说，理解开源许可证是强制执行的很重要。但特定项目是如何违反开源许可证的呢？同样对于公司来说，确保他们没有无意违背许可证也很重要。\n\
    \n合规工程师顾其实名，致力于识别违规。通过仔细分析软件，他们减少了风险和问题。\n\n另一个选项是 Fossa，一个具有多种功能的免费许可证。它用于确定特定软件的许可证并为其软件生成声明。\n\
    \n如果寻求更具体的合规指导，可以转向致力于该目的的组织。\n\n在本地，FSE 在法律领域非常活跃；它举办活动、解答问题并就许可证问题提供类型的协助。\n\
    \n为了帮助用户和开发者提供了列表。\n\n| 二进制分析测试头部 | 文件 | 许可证 | 结果 |\n|---|---|---|\n| main.exe\
    \ | GPL-2.0 | 通过 |\n| lib.dll | MIT | 通过 |\n| plugin.so | Apache-2.0 | 通过 |\n\
    | utils.exe | 专有 | 失败 |\n| data.bin | 未知 | 失败 |\n| | | |\n\n![](img/80af6fd0c5ad221222cba94201825f7f_30_0.png)\n\
    \n二进制分析工具有助于跟踪合规工作的变化。我们建议阅读文档，否则你将完全迷失。\n\n## CREATIVE COMMONS\n\n# APACHE LICENCE\
    \ 2.0\n\n# LGPL\n\nCC 许可证适用于非软件作品，如图像、艺术品和音乐。著权共享 CC-BY-SA 允许修改被许可作品、分发衍生作品，但必须遵循相同的许可证。CC-BY\
    \ 是宽松的，仅要求署名。\n\n如果你希望获得宽松的许可证又希望授予专利权利，则推荐用于软件。由于其宽松性，它允许衍生作品以不同的条款发布并商业化。除了\
    \ Apache，Android 也是根据此许可证发布的。\n\n如果它仅将 GPL 代码作为共享库使用，则可以允许以不同的许可证发布作品。这允许在专有项目中使用代码。这对于软件库也非常有用。它在所有其他方面与\
    \ GPLv3 相似。\n\nwww.linuxuker.com | 31\n\n"
