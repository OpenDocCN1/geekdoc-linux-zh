    Granite 是 GTK 的一个基础扩展。它是一个预定义组件的库，使用了 GTK 和 elementary OS 的设计指南。作为其功能的示例，Blaighted
    强调了主题颜色：“这是第三方开发者构建其应用并对应用的呈现方式拥有更多控制权的一种良好方法。” 这是一个极佳的例子（[http://graniteproject.net/），一个在顶部使用标题栏组件并使用紫色组件的客户端，作为该平台的第三方开发者，与其使用
    elementary OS 特有的纸页（sheet）和工具包（toolkit），Granite 保证了所有 elementary OS 的部分都能协同工作。


    Granite 支持各种组件，包括自定义类的标签页。标签页组件用于发行版的组件，例如其默认浏览器 Firefox、Pantheon Files（其文件管理器）以及代码编辑器
    Scratch。这些标签页看起来类似于 Google Chrome 或 Firefox 中的标签。


