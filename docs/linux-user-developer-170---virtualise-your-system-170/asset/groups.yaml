    如果你想使用远程连接来执行配置和更新等任务，可以考虑远程控制。**TeamWeaver** 提供了一个免费的 Android 服务器，允许你通过 TCP 连接到
    ADB，系统会提供你的家庭网络地址（将 ADB 端口转发到网络外不是个好主意，因为是不安全的）。


