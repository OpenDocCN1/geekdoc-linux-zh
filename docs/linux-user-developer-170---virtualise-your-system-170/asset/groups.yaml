  - "[PAGE 50]\n\n# Concurrency Parallelism\n\nIt is a very common misconception that\
    \ Concurrency and Parallelism are the same thing, which is to be explained. Parallelism\
    \ is far from true!\n\nParallelism is the simultaneous execution of multiple things.\
    \ Concurrency is a way of structuring things so that they can execute concurrently.\n\
    \nWhen you build things concurrency ensures that you can safely execute them in\
    \ parallel, if your Linux system permits it. This was a long time ago, before\
    \ CPU made multicore.\n\nIn a valid concurrent design concurrency allows us to\
    \ run many things in parallel. So parallelism comes from a better concurrency\
    \ and is responsible for taking concurrency into account during the design phase\
    \ of a system and benefits from parallel execution. You should not think about\
    \ breaking things into pieces but what will effectively solve the initial problem\
    \ while.\n\nEven if you cannot run your functions in parallel concurrency improves\
