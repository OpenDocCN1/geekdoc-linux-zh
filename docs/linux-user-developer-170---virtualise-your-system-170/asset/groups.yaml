    # 轻量级桌面环境


    ## Lumina 桌面环境 1.0.0


    基于 Qt5 的桌面，系统依赖极少


    市场上有很多竞争性的桌面系统，即使在轻量级、低系统资源环境这一小众领域也是如此。但大多数缺乏 Lumina 所拥有的、使其与众不同的特征？


    源代码不是问题，在基于 Debian 和 Fedora 的发行版中，只需一个操作即可安装构建依赖项。默认外观稍显老派，例如右键菜单——那是属于昨天的菜单；除了
    WindowMaker 之外，我们的桌面上还有更多值得发现的惊喜。


    Lumina 桌面使用了各种操作系统的框架。它避开了 DBus、polkit、consolekit 和 HAL，使用 C++ 从头开始构建，因此很少有依赖问题，仅从
    Flatbox 学习了少数配件。


    启动后，像所有应用程序一样，菜单有各种各个部分。扩展程序包含许多插件，从音频播放器和 RSS 到准备好处理 USB 等选项。Lumina 现在提供了桌面所预期的一切，但
    Lumina 真正的吸引力在于其资源效率——在树莓派（Raspberry Pi）上试试看。


    对于大多数发行版来说，安装非常简单，因为存储库中有最新的二进制文件，也可以从源码编译。


    # 优点

    加速硬件运行，同时完全不牺牲任何功能。


    # 缺点

    外观不是最漂亮的——至少对所有人来说不是的。


    # 非常适合……

    性能不足的硬件：旧笔记本电脑

    https://lumina-desktop/


    # 文档处理器


    ## LyX 2.2.1


    通过易用的 GUI 应用程序创建精美的文档。


    LyX 能让文档变得精美——并具有接近 WYSIWYG（所见即所得）的输入优势。事实上，我们将 WYSIWYG（所见即所得）替换为 WYSIWM（你所看到的，但仍然让你自由地输出文档布局——它与文字处理器确实不同，因此你的输出将与打印机和平台保持一致。）


    ![](img/c9de257c4e373c22707351f47f16002e_88_0.png)


    使用 LaTeX 排版系统（尽管如此），LyX 为你提供了一个强大但不熟悉的前端，这将使你能够生成在文字处理器中无法实现的所有文档，从分发到数学和物理。如果你了解
    LaTeX，你就可以在 LyX 中使用你的知识和文件，它在具有灵活性的点上同样有效。


    # 使用 LyX 时最最重要的事情


    1. 充满心地使用 LyX——请从基础开始，一旦你熟悉了这些，就可以尝试引入高级功能。然后使用“助手”来学习使用 LyX。

    2. LyX 是我们所说的“视觉过程”。它与 WYSIWYG 编辑器不同，因为它将内容与呈现分离，所以不要害怕。文档会为你解决这些。

    3. 多使用菜单而不是工具栏。尽管 LyX 工具栏，但菜单更强大。

    4. 导入 Bib 很容易。是的，你可以导入 BibTeX 文件。经验用户可能会对结果感到害怕，但 LyX 会帮你修复它。你就可以使用你喜欢的引用。

    5. 此外，这里有一份编写文本或英语以外语言所需的功能列表。


    在 Debian 上从 deb 包安装没有问题；Ubuntu 有 PBA，大多数其他系统也有不同的发行版。支持非常出色，包括对亚洲字体的双向支持。稳定性感觉很好。很难找到毛病，特别是当你发现让文档变得如此简单的功能时。它不仅仅是为了学术人员——只要公平尝试，就可以编写任何类型的报告，你可能会放弃你的文字处理器了。


    # 优点

    从数学到阿拉伯语，一切都布局得完美，具有自由和灵活性。


    # 缺点

    并不是你文字处理器的替代品，而且比你需要的要强大得多。


    # 非常适合……

    任何学术内容，无需学习 LaTeX


    ![](img/c9de257c4e373c22707351f47f16002e_88_1.png)


    www.linuxuser.com/


