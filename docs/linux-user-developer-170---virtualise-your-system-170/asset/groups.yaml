    # 开源


    您的 Linux 新闻与观点来源


    # 专访 TIMOTHY FREEBURN


    ## Formula Pi 中的竞赛型机器人


    追求速度吗？Timothy Freeburn 讨论了 Formula Pi 如何开启机器人赛车的新时代。


    ![](img/c9de257c4e373c22707351f47f16002e_11_0.png)


    Timothy Freeburn

    Timothy Freeburn 是位于英国的机器人公司 Freeburn Robotics 的董事兼所有者。他在高质量 PCB 和电子设备的设计与制造方面拥有丰富经验。


    > Formula Pi 的想法是从哪里来的呢？


    当我很小的时候，我父亲经常带我去看赛车比赛。虽然大多数人痴迷于驾驶赛车或关注驾驶员是哪位名人，但我更倾向于汽车背后的工程学以及它们是如何制造的。我一直在想，如果把驾驶员从汽车上移开，让汽车在不离开方向盘的情况下进行竞争会怎样？无论是自动驾驶汽车将病人送往医院，或者让无法见面的家人去探亲，亦或是在“偶尔”去完酒吧的晚上送我回家？正是这些想法最终形成了我们希望在
    Formula Pi 中实现的目标。


    ## 比赛是如何安排的？例如，有联赛制度吗？


    目前已经提出了几种不同的想法。之所以还没有解释清楚，是因为具体的形式取决于加入该项目的竞争者数量。我们希望机器人以小组预赛的形式进行竞赛。我们会为任何机械问题留出处理空间，并且为了发现任何漏洞，我们将让机器人运行标准的、未修改的格式，以确保公平。这对于参赛的竞争者来说将是最有趣且最公平的。


    与此同时，预赛很可能每两周举行一次，这样人们在下一次预赛之前就有机会调整代码，确保他们的机器人处于巅峰性能。


    ![](img/c9de257c4e373c22707351f47f16002e_12_0.png)


    这些比赛将进行直播，让每个人都能观看自己的机器人竞争，每场预赛的结果将在每场赛后的第二天公布。


    ## 赛道是如何设计的？需要考虑不同的元素吗？


    我们尝试在现有的空间内让赛道尽可能长。赛道的外缘想要安装橡胶护裙，这样任何碰撞都不会损坏机器人或赛道，这至关重要。赛道本身要求对摄像头清晰可见，以便 Raspberry
    Pi 能够轻松识别其在赛道上的位置，以及相对于比赛中其他机器人的位置。光线明亮且清晰，以便机器人获得更好的赛道视野。为了实现这一点，我们在天花板上安装了地板照明点，效果非常好。我们还在机器人前方约
    8 英尺处使用了 LED 灯带，用来指示赛道的开始和结束。我们使用摄像头和传感器测量每条起点/终点线以获取计时信息并消除抢跑。


    ![](img/c9de257c4e373c22707351f47f16002e_12_1.png)


    ## 你能多介绍一下活动中使用的机器人吗？


    这些机器人拥有 2mm 厚的铝制底盘，因此它们经久耐用。我曾掉过一个超过一米的机器人，电机座仅需轻微弯曲，所以它们的耐用性……


    ## 结为荣耀竞争的竞赛机器人


    为了让每场 Formula Pi 比赛都尽可能快，每位竞争者将使用相同的 Yahberg HS Zero 机器人进行比赛。每个机器人都经过精心制作，以应对比赛中涉及的所有颠簸和刮擦，每个机器人都配备了竞争者所需的所有物品：一个
    9V 电池和一个 Raspberry Pi。每个机器人的外壳由铝制成，由 62ma 电机驱动。对于参赛者来说，这意味着 Yahberg 可以达到很高的速度。


    一旦机器人进入参赛者的手中，就取决于他们如何改进机器人。每个机器人必须由他们构建，Formula Pi 提供必要的代码来让机器人完全自动运行。但每位参赛者如何修改这些代码将帮助他们的机器人从竞争中脱颖而出。你有获胜的实力吗？


    请访问 www.formulapis.com 了解更多信息。


    ![](img/c9de257c4e373c22707351f47f16002e_12_2.png)


    www.linuxuker.com 13


    # 开源


    您的 Linux 新闻与观点来源


    ![](img/c9de257c4e373c22707351f47f16002e_13_0.png)

    ![](img/c9de257c4e373c22707351f47f16002e_13_1.png)

    ![](img/c9de257c4e373c22707351f47f16002e_13_2.png)


    ## 获胜组合


    每位竞争者将收到相同的代码。然而，如何使用它取决于他们自己。处理赛道有很多方法，通过转弯也有许多不同的方式。目标是创建一个尽可能高效处理障碍的机器人。我们使用传感器和摄像头数据做出实时决策。


    ![](img/c9de257c4e373c22707351f47f16002e_13_3.png)


    ## 潜在参赛者在加入之前需要哪些 Raspberry Pi 的知识？


    任何人都可以加入！我们有现成的代码，所以大家所需的仅仅是对电子学的基础了解和学习的意愿。我们会在过程中提供文档支持和帮助。


    ## 参赛者是否有空间软件来提高性能的空间？


    是的，有充足的空间。代码被分成不同的模块，允许参赛者更换用于路径规划、避障和速度控制的算法。


    14


    ![](img/c9de257c4e373c22707351f47f16002e_14_0.png)


    '
