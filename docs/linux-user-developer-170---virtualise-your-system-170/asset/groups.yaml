    The app also includes sensor acquisition with online web graphing, so remotely
    you can get a good idea of what is going on around your device.


    ![](img/c9de257c4e373c22707351f47f16002e_37_2.png)


    Like a normal home server, you may well want to serve content from the device.
    This is possible!


    One option is to install a Linux distro on the device (see issue 168); although
    this is the most powerful option, it is not strictly necessary. Number of Android
    apps are available to provide a web server, Including Server, which offers not
    just a web server but a full PHP and MySQL stack, as well as DynDNS, FTP, SFTP
    and SSH.


    If you want to use a remote connection for tasks such as configuration and updating,
    consider remote control. TeamWeaver provides a free Android server that allows
    you to connect via ADB over TCP, you are provided with your home network address
    (it''s not a good idea to forward ADB ports out of your network as it is unsecured).


    ## 06 Turn your phone into an IP camera


    We mentioned that Android devices typically have a wide range of sensors that
    can be used for smart home functionality, but the best of all in most phones is
    the camera. Home IP cameras are typically expensive, so why not use your Android
    for this?


    ## 07 Media serving and NAS


    A common home server is serving media around the home using a platform such as
    Plex. Android devices are actually better suited to this functionality than you
    might expect, with microSD storage expansion and the ability to support USB OTG
    connected hard disk drive directly to the phone.


    The main bottleneck of this setup occurs if transcoding is not necessary. Although
    CPUs and GPUs are powerful enough to handle video transcoding, mobile engines
    we''re seeing are not optimized for this purpose, the exception being the (but
    pricey) NvidiaShield.


    ## Picking a cheap Android device


    If there''s no Android phone hidden away somewhere now, does that mean you can''t
    play? Of course not! As well as picking up a new device for a surprisingly low
    cost. For example, the VoltaSFone Smart prime is cheap; it has a wide range of
    sensors and a surprisingly decent camera. Perfect.


    Plex server itself is limited on Android, but another alternative – Kodi, available
    for download from the Play Store – works well, and it''s all, for free. If you
