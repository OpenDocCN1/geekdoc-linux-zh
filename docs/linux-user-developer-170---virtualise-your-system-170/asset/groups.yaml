    ```


    ### 04 Create a virtual machine with QEMU


    A good example is the following command, which creates a virtual machine with
    10GB of RAM, the CD-ROM from a physical drive, hardware virtualization, 3 CPU
    cores, and KVM for performance. This base will be installed:

    ```

    qemu-system-x86-64 -m 10240 -dboot -enable-kvm -smp 3 -net nic user -hda test-image.img
    -cdrom ubuntu-16.04.iso

    ```

    Note that the ISO you chose for your QEMU will require the full file path contained
