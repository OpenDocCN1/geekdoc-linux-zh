    \ function!\\n\")\n\t}()\n}\n```\n\n上面的代码是创建两个简单 goroutine 的 goroutine 代码，一个使用现有的函数，另一个使用匿名函数。\n\
    \n```\n// go run goroutine\nLearning about Goroutines.\nThis is an anonymous function!\n\
