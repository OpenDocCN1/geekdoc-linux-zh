    # Set up your virtual machine


    With KVM installed, you have the choice of running from the command line, as per
    QEMU, or from the desktop, using Virtual Manager tool, similar to VirtualBox.


    Get started by clicking New virtual machine and selecting the appropriate option.
    With all the others in this feature, we''re going to assume you have an ISO or
    CD-ROM.


    Click forward to proceed, selecting the option and forking the correct file or
    device. If recognised, the OS will be displayed at the top.


    ![](img/c9de257c4e373c22707351f47f16002e_22_0.png)


    # Build your virtual machine


    Next, you will be prompted to specify your virtual machine''s memory and CPU settings.
    Remember, you will be limited by your host hardware, so do not exceed what is
    built into your physical computer''s specifications.


    Next, it''s time to create a disk image. You can use an existing disk image, or
    specify yours. Proceed to the next screen, where you will be prompted to name
    your VM. Confirm the correct operating system before clicking Finish to complete
    creation of the virtual machine.


    ![](img/c9de257c4e373c22707351f47f16002e_22_1.png)


    # Are you sure you want to force poweroff /ubuntu-14.04?


    > This will immediately poweroff the VM without shutting down the OS and cause
    data loss.


    +   - Don''t ask me again


    No Yes


    # Deal with a corrupt disc or image


    Setting up an operating system to a virtual machine is uncommon, and the first
    problem is setting up the virtual machine with unsuitable hardware specifications.


    The dealing with it is also potentially troublesome if the VM is in a boot loop
    and repeating. This should happen, you''ll need to force the virtual machine to
    shutdown, using the Off command in the power menu.


    # Which is the right virtual machine?


    Getting the right choice depends partly on what you want to virtualize, but also
    what applications you need and how much resources you have available.


    Let''s face it: QEMU''s command line interface is complicated. Using Virtual Manager
    for KVM and VirtualBox is far more attractive and easier to use. The advanced
    features are mainly only if you are out of sight, and you need them. The answer
    to this question is simple: it''s the one that helps you to get the job done.


    ![](img/c9de257c4e373c22707351f47f16002e_22_2.png)


