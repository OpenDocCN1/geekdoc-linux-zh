    Dropbox、SFTP 或 FTP 服务器（你猜对了，还集成了电击枪功能），并带有移动检测。考虑到能够启用额外功能的版本价格非常便宜，它是一个极其实用的工具。


    该应用还包含传感器采集和在线网页图表功能，因此你可以远程地了解设备周围发生状况。


    ![](img/c9de257c4e373c22707351f47f16002e_37_2.png)


