    \ `aFunction()` 中的延迟，匿名函数的消息先打印。这证明了匿名函数和 `aFunction()` 同时同时运行。\n\n```go\naChannelStrings\
    \ := make(chan string)\n// 你可以向现有的通道发送语句\naChannelStrings <- \"hello\"\n// 你可以像这样从通道中读取单个值：\n\
