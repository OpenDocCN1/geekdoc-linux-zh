    \n通过选项运行演示模式，没有\n`raspist --help`\n\n在编码和压缩后拍摄静态图像\n\n今天要使用你的 NoIR 摄像头吗？记住，录制视频时电池会消耗得很快。在启动树莓派之前，也应该使用\
    \ raspi-config 启用摄像头。\n\n## 05 拍摄照片和视频\n\n两个工具 `raspist` 和 `raspvid` 用于用 NoIR\
    \ 摄像头拍摄静态照片和视频。基本用法如下：\n\n- `raspist photo.jpg`\n- `raspvid -o video.h264`\n\n\
    使用帮助命令查找完整的命令集，包括指定尺寸和旋转（见顶部提示）：\n\n## 06 制作延时摄影\n\n为了充分利用 NoIR 摄像头的性能，你需要设置在低光下拍摄照片。如果你不能等到晚上，可能可以使用低光场景，如阁楼、地下室或橱子。\n\
    \n对于测试拍摄，尝试：\n\n- `raspist -test.jpg`\n\n## 07 准备晚上拍摄\n\n如果你想在户外拍摄，你需要一个充电电池为树莓派和摄像头供电。你还应该选择一个坚固的外壳，良好的良好的防护。为了最佳效果，请使用全候外壳，或使用塑料袋！\n\
    \n![](img/c9de257c4e373c22707351f47f16002e_70_0.png)\n\n确保不要过载你的 SD 卡存储——保持延时摄影短小！\n\
    \n## 命令和开关\n\n要了解更多关于 `raspvid` 可用的命令，请使用：\n\n- `raspist -help`\n- `raspvid -help`\n\
    \n## 09 编译你的延时摄影\n\n视频编译完成后，考虑将其上传到 YouTube。延时视频非常受欢迎！\n\n将延时摄影编译为视频图像文件：\n\n\
