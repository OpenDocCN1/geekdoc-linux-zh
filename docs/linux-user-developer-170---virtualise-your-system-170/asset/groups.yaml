    \n## 清理你的脚本\n\n运行我们的任何示例都会留下乱码输出；在 Dialog 完成工作后，对话框仍然残留。\n\n参数数字指定快捷键字符，而参数内容是实际显示文本。在当前配置下运行我们的代码示例将导致所示结果：\n\
    \n![](img/c9de257c4e373c22707351f47f16002e_29_0.png)\n\n![](img/c9de257c4e373c22707351f47f16002e_29_1.png)\n\
    \nDialog 的残留物会破坏“终端框架”\n\n## Dialog 的 menu.command 完美运行\n\n解决此问题的一种简单方法是使用 `clear`\
    \ 命令。它会从屏幕上移除脚本输出，只留下空白终端：\n\n请注意，菜单也可以显示所有已显示的内容。Dialog 将通过显示进度指示对此做出，显示用户在菜单中进行的进度。此外，还可以使用自定义菜单快捷键——更多细节请查看截图：\n\
    \n```bash\n#!/bin/bash\ndialog =\nresponse=$?\n```\n\n```bash\nclear\n...\n```\n\
    \n如果控制台输出的最后一行是输入，则可以使用替代程序 `Whiptail`。到目前为止，它与 Dialog 使用参数兼容——\n\n## 收集任意输入\n\
    \n```bash\n#!/bin/bash\nwhiptail --menu \"Choose one\": 12 30 4 1 \"Option 1\"\
    \ 2 \"Option 2\" 3 \"Option 3\" 4 \"Option 4\"\n```\n\nDialog 也可以用于收集文本输入。这要复杂一点，因为必须通过以下方式捕获：\n\
    \nWhiptail 也有它的局限性。首先，生成的对话框与 Dialog 创建的完全不同。其次，使用的输入与输出始终相同（见下页顶部）。\n\n![](img/c9de257c4e373c22707351f47f16002e_29_2.png)\n\
    \n将 Whiptail 的标准输出重定向到变量可以解决后一个问题：\n\n传递 dialog --menu \"Choose one\": 12 30 4\
    \ A \"Option 1\" B \"Option 2\" C \"Option 3\" D \"Option 4\" 演示了一些替代方案\n\n![](img/c9de257c4e373c22707351f47f16002e_30_0.png)\n\
    \n这上面看起来不同。\n\n```bash\nrocket launch;\ntam@TAMHAN14:-~/Desktop$ /workspace.sh\n\
    rocket launch;\ntam@TAMHAN14:-~/Desktop$ /workspace.sh\nrocket\ntam@TAMHAN14:-~/Desktop$\
    \ /workspace.sh\nrocket launch;\ntam@TAMHAN14:-~/Desktop$ \n```\n\n## 进入图形领域\n\
    \n如果你的脚本应该显示完全图形化的产品，请尽管使用 `zenith`。它的行为在很大程度上反映了 Dialog，最重要的区别是省略了 `-menu`。此外，一些选项也被重命名了——Launch\
    \ 示例现在像这样：\n\n在选择一个后会导致 Whispail 的输出中出现一些异常\n\n```bash\n#!/bin/bash\nresponse=\n\
    waitmail --menu \"Choose one: 12 30 4 1 \"Option 1\" 2 \"Option 2\" 3 \"Option\
    \ 3\" 4 \"Option 4\" 2\"$response\n```\n\n```bash\n#!/bin/bash\nzenith --title\
    \ \"Message\" --question-text=\"Should we launch a missile?\" 6 40\n```\n\nDialog\
    \ 在文献中经常被提及；产品与 Dialog 有相似之处。它已经超过五年没有维护，且不再是一个软件包——使用它会给你的公司带来沉重的维护负担。\n\n##\
    \ 结论\n\n> 策略性地调用 Dialog 足够让非技术操作人员也能使用脚本。\n\n添加图形用户界面并不真正困难：策略性地调用 Dialog 足够让非技术操作人员也能使用脚本。如果其他人替换\
    \ Dialog，程序就可以集成到完全图形化的界面中。\n\n请注意，Bash 的道路还没有结束。本教程的下一部分将链接到。\n\n"
