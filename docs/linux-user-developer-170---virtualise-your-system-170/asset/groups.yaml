    # Terminal repos work


    The Advanced Package Tool (APT) is a free software user interface that works with
    libraries to handle the installation and removal of software on Linux distributions,
    including Debian and Ubuntu, and much easier than compiling from source. From
    its command-line, the tools used are apt.


    How do it?

    Ubuntu provides seamless integration between apt-get and terminal. When entering
    the name of a known but not installed package, the shell will automatically display
    the displaying command:


    +   - terminator

    The program ''terminator'' is currently not installed. You can install it by typing:


    ```

    apt-get install terminator

    ```


    Another command operation involves the updating of all packets on a workstation.
    As this leads to


    In theory, software could be distributed in source code. Repositories make life
    easier


    Ubuntu | Debian | man possible

    manage all software packages that are available from the internet.


    In order to enable users to access non-supported packages via the apt-get provide
    custom repositories for precompiled packages for downloads.


    Add a repo

    Should be provided with a PPA URL, simply running the following apt-get commands
    when an internet connection is established. Sadly, apt-get will always update
    its repositories – this process cannot take time of.


    ```

    sudo add-apt-repository ppa/your-name

    sudo apt-get update

    ```


    When these commands have been executed, simply deploy the packages via apt-get.
