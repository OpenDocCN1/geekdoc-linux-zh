    # LIGHTWEIGHT DESKTOP ENVIRONMENT


    ## Lumina Desktop Environment 1.0.0


    Qt5-based desktop with few system dependencies


    There are many competing desktops out there, even in the niche of lightweight,
    low system-resource environments. But most around them lack what Lumina has that
    separates it from the rest?


    Source is not a problem, with build dependency installation a single operation
    on Debian and Fedora-based distros. The default appearance is a little old school,
    and e.g. right-click menus - menus of yesterday, with WindowMaker, there''s plenty
    more to discover beyond ours.


    Lumina desktop uses various operating systems frameworks. It eschews DBus, polkit,
    consolekit and HAL, using built from scratch in C++ so it has few dependency issues,
    learning only from Flatbox for a few accessories.


    At launch menu has various sections, as for all apps. Extensions includes numerous
    plugins, from audio player and RSS ready to handle options like USB. Lumina now
    offers everything expected in a desktop, but Lumina real attraction is its resource
    efficiency - try it on the Raspberry Pi.


    Installation is easy for most distros, as repos are with the latest binaries,
    building from source.


