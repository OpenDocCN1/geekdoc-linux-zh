- md: "\n## Build an explorerHAT robot Part four\n\nUpgrade your robot to drive itself,\
    \ follow light and avoid obstacles with sensors\n\nIn part three we gave our robot\
    \ \"legs\" through a manual control program and a gamepad. We will now add driving\
    \ capabilities through sensors and a feedback loop. We will start off by using\
    \ open-closed loops for control, then create simple obstacle-avoiding behaviour.\
    \ Once our robot can avoid walls we will add a sensor to follow a light source\
    \ such as a torch on the left or right side of the robot. The project is just\
    \ starting to take shape, and the following program could be adapted into a line-following\
    \ behaviour with the use of two infrared IRs.\n\n## What you'll need\n\n- Article's\
    \ Github repository (https://github.com/alexellis/zumopi)\n- Explorer as built\
    \ in part two\n- Wi-Fi dongle\n- Ultrasonic sensor\n- 2x analog light sensors\n\
    \n**Alex Ellis**\n@alexellis is a senior software engineer at ADA, a Docker and\
    \ Linux enthusiast. He likes all things Linux Raspberry Pi and regularly posts\
    \ tutorials on his blog.\n\nThe code is written in Python, which means the examples\
    \ will be compatible with Python 2 and 3. All the code is open source, so if you\
    \ want to suggest an enhancement or correct a bug please report an issue on Github.\n\
    \n### 04 Build an obstacle-avoiding behaviour\nWith a self-driving technology\
    \ the one thing we don't want to avoid is a collision, whether it is with a priceless\
    \ pet cat or a pair of spiders. The cheapest sensor for this purpose is the ultrasonic\
    \ HC-SR04. The HC-SR04 has a trigger and echo pin; set the trigger to hit an object,\
    \ then immediately start a counter until the echo pin goes low. This amount of\
    \ time results in distance between 120cm and 250cm.\n\n### 01 There is no failure,\
    \ no feedback\nAs we begin to develop our robot we will need to navigate in an\
    \ open, predictable environment like a kitchen floor can be a very tricky task.\
    \ If we drive our robot from part three of the series on a thick carpet, grass,\
    \ we lose control in turning and speed. If we turn the motor at 100 rpm for 0.5\
    \ seconds then it will perform more at 360, whereas on grass it may barely move\
    \ or on carpet it may turn out.\n\n### 02 Are you open to feedback?\nDuring manual\
    \ control we begin observing the robot's performance and react by correcting it\
    \ on the go. Without feedback we need an equal way to measure what is going on.\
    \ By driving the motors at 70 rpm at all then on a flat surface we might be able\
    \ to drive up a ramp. This kind of program contains an open-loop system, but in\
    \ order to compensate for the need for feedback. When we have a direct feedback-mechanism\
    \ this is called closed-loop.\n\n### 03 Pick your sensors\nThe common way of measuring\
    \ how far and how quick a robot is moving is through wheel or motor encoders.\
    \ Each can be made as a simple paper disk attached to a motor connected to a shaft\
    \ or a Hall effect magnetic sensor. By counting RPM and using the time required\
    \ to move a distance we set contact with\n\n```python\nimport RPiGPIO as GPIO\n\
    import time\n\n# trigger = output 1 on ExplorerHAT\n# echo = input 1 on ExplorerHAT\n\
    # For other output or inputs consult help:\n# pinout.xy\n```\n\n### 05 Be quick\
    \ or you'll miss\nWith the HC-SR04 sensor the speed of sound is what we need to\
    \ make the Pi operating system ready to measure the result. Unfortunately the\
    \ generality of GNU Linux does not guarantee a real-time system. The reason is\
    \ we may want to measure more frequently or average the sensor result accurately.\
    \ Another way is to avoid code library which introduces too much latency. Until\
    \ using the RPiGPIO library, see the example class (ultrasonic.py)\n\n# Explorer\
    \ robot\n\n![](img/c9de257c4e373c22707351f47f16002e_72_0.png)\n\n# Tutorial\n\n\
    ![](img/c9de257c4e373c22707351f47f16002e_73_0.png)\n\n```python\nclass ultrasonic_sensor:\n\
    \    def __init__(self, trigger, echo):\n        self.GPIO_ECHO=echo\n       \
    \ self.GPIO_TRIGGER=trigger\n\ndef cleanup(self):\n    GPIO.cleanup()\n\ndef setup(self,\
    \ setime):\n    print(\"trigger = \" + str(self.GPIO_TRIGGER))\n    print(\"echo\
    \ = \" + str(self.GPIO_ECHO))\n    # Set pins as input and output\n    GPIO.setpinmode(self.GPIO_TRIGGER,\
    \ GPIO.OUT)\n    GPIO.setpinmode(self.GPIO_ECHO, GPIO.IN)\n```\n\n#### Don't crash\
    \ into that wall\nNow we have a Python class which can take measurements through\
    \ the ExplorerHAT, let's write a simple loop to read the values, then set up our\
    \ robot to drive forward and halt if it detects anything around 30cm or closer.\
    \ For a case that only returns the values, and prints them on the terminal, use\
    \ parameter_dummy.py. For the example below use part4/distance_dummy.py.\n\n```python\n\
    def measure(self, setime):\n    # Set trigger to False\n    time.sleep(0.001)\n\
    \    GPIO.output(self.GPIO_TRIGGER, True)\n    time.sleep(0.001)\n    GPIO.output(self.GPIO_TRIGGER,\
    \ False)\n    # Allow module to settle\n    time.sleep(setime)\n```\n\nAlso note\
    \ that we are making the code by naming variables as safe_distance, cm, power_percent,\
    \ sensor_time, passed into a method without a clear name, who knows what it means?\n\
    \n```python\n# Send pulse length\nGPIO.output(self.GPIO_TRIGGER, True)\ntime.sleep(0.001)\n\
    GPIO.output(self.GPIO_TRIGGER, False)\nstart = time.time()\nwhile GPIO.input(self.GPIO_ECHO)\
    \ == 1:\n    pass\nstop = time.time() - start\n\nimport explorerhat\nimport ultrasonic_sensor\n\
    # trigger = 1\n# echo = 1\n\n# Calculate pulse length\n# Distance travelled in\
    \ time multiplied by the speed of sound (cm)\ndistance = 34000 / elapsed\nultrasonic\
    \ = ultrasonic_sensor(echo_pin, trigger_pin)\nultrasonic.setup()\nprint(\"Ping...\"\
    )\nwhile(True):\n    sensor_time = 0.1\n    cm = ultrasonic.measure(sensor_time)\n\
    \    safe_distance = 30\n    if(cm < safe_distance):\n        explorerhat.motor.one.stop()\n\
    \        explorerhat.motor.two.stop()\n    else:\n        move_power_percent =\
    \ 50\n        # That was the distance and back\n        distance = distance /\
    \ 2\nreturn distance\n\n# Explorer robot\nand being able to operate outdoors.\
    \ The disadvantage of a laptop: this is a single USB port that you have to swap\
    \ out for the Wi-Fi dongle to update the code. The result of the tutorial we will\
    \ always keep a terminal open and hit Ctrl+C if things start to go.\n\n![](img/c9de257c4e373c22707351f47f16002e_74_0.png)\n\
    \n### 09 Mount your sensors\nat this point you may be wondering how we can mount\
    \ sensors onto the Zumo tiny chassis. If you have access to a laser cutter you\
    \ may have everything you need to make an extra layer for the robot. For our test\
    \ we used glue to secure the two ALS-PL19 light sensors. Make sure you only use\
    \ a small amount of glue and that you hold the sensor in place until it keeps\
    \ your position.\n\n### 10 Connect the ALS-PL19s\nALS-PL19s are light sensors\
    \ built with resistors. We need just to provide a positive feedback with a wire\
    \ to read the signal. Plug one and other into analog 2. There are 5V and GND connectors,\
    \ so we need to break this out and allow us to power the ultrasonic sensor at\
    \ the same time.\n\n### 11 Read the analog values from the ALS-PL19s\nanalog values\
    \ can be read through the library and will give a value (0-100) representing the\
    \ input voltage. Here is a quick example of how to read the sensors:\n\n```python\n\
    explorer_motor.one.forwards(move_power_percent)\nexplorer_motor.two.forwards(move_power_percent)\n\
    print(\"%f\\n\", value)\n```\n\n### 07 Design the escape behaviour\nPlug into\
    \ each input into the Explorer. Connect to 5V and negative to GND. Once the robot\
    \ has detected a distance of at least 30cm then it needs to go back and run a\
    \ while loop. A simple effect would be to turn back to where it came on left then\
    \ make the main loop continue. Note that this is going to be on one loop so that\
    \ the surface may be small or large. For now we will consider smaller building\
    \ blocks. The full code is in parts/distance/roming.py.\n\n```python\nprint(explorer_analog.one.read())\n\
    print(explorer_analog.two.read())\n\ndef escape():\n    backup_time = 0.1\n  \
    \  turn_time = 0.5\n    explorer_motor.one.backwards(50)\n    explorer_motor.two.backwards(50)\n\
    \    time.sleep(backup_time)\n    explorer_motor.two.forwards(50)\n    time.sleep(turn_time)\n\
    ```\n\nThe simplest control program would read both sensors and immediately give\
    \ more power to the left or right to make a steering motion. The best control\
    \ programs would allow the value to match and then use a PID controller to make\
    \ sure the system doesn't over-correct. Here's our attempt; we've left room for\
    \ improvement.\n\n```python\nimport explorer\nimport time\nfrom ultrasonic import\
    \ *\n\ndef get_percentage(left, right):\n    if left > right:\n        return\
    \ (20, 50, \"left\")\n    else:\n        return (50, 50, \"right\")\n```\n\n###\
    \ 08 Create an emergency stop\nBefore we move on to track a light-falling behaviour\
    \ let's see if we can stop the robot if it gets into the stairs. In part 3 we\
    \ will see and then return. A Button B could cause the problem and then perhaps\
