    ## LXLE 16.04.1


    Changes are plentiful in the latest update from LXLE''s team of developers.


    Despite the ever increasing number of Ubuntu-based distributions appearing all
    over the places, Linux has managed to reach a small but growing number of users.
    Compared to its competitors, it boasts one of the best update histories, and its
    latest, 16.04.1, is arguably its best yet. At the core of it is the vast selection
    of improvements in boot process from start to finish, the whole booting process
    takes less than 60 seconds. Considering the wealth of features onboard, its impressive
    feat to keep times down low. Another key improvement to help keep boots to a minimum
    is the lack of pressure on your computer''s resources. Unlike most of the other
    distros we''ve had the chance to get hands-on with, and while it is not perfect
    in some areas, it does worth to keep running smoothly at all times.


    As for the LXLE UI, it still remains one of the premier interfaces out there.
    While simplicity remains at its core, there are some ingenious animations and
    transitions to make moving around it better than before. But then it lacks its
    superfluous additions, with the new Aero feature being the most noticeable of
    all. Aero looks snap multiple windows quickly and together. It''s arguably the
    one feature that causes some slowdown on the distribution but for most users.


    In this version of LXLE the inclusion of Material themes taking from GNOME components.
    For the most part, the difference between them but more eye you will notice small
    problems arising from occasion. That said, the use of icons is fairly standard,
    but it lacks the features you need the distribution. We especially liked the inclusion
    of three assistive programs, especially the magic launcher.


    Perhaps one of the biggest bugs in LXLE update was an over-controlled menu, but
    they''ve taken back to its roots. A more controlled menu now serves more users
    and it complements the simplistic nature of the distribution as well. Searching
    for functions has never so easy, but it does lack the customisation options we''ve
    expect from similar distributions. The other big fix that becomes notably as soon
