    ## 评论


    ### 您的来信


    关于杂志、Linux 和开源的问题与意见


    ### 厌倦了 Ubuntu


    你好 LU&D，

    我已经使用 Ubuntu 一年了。我开始觉得无聊了。我想我得到了想要的一切，但人们要求我追求极简主义的风格，而那样的窗口？Windows 在我的电脑上看起来更好。你能推荐一些更酷一点的吗？


    Jake Boyle


    Linux 的优点在于，它有许多不同的版本（flavors）。有些看起来很天真，但事实是，有些具有极简主义风格，这正是我想要的。Linux Mint 像 Ubuntu
    一样易于上手，但没有那种现代 Linux 发行版的做作。你可以查看 https://www.linuxmint.com/。


    就像 Linux Mint 一样，elementary OS 基于 Debian 和 Ubuntu，所以你会很快上手，它拥有名为 Pantheon 的自定义桌面环境，以及一种类
    Mac 风格的发行版。它允许你完全切换到你喜欢的任何界面。默认情况下，请查看 https://elementary.io。


    Fedora 并不是你想要切换的。它很容易运行 XFCE、MATE 和 Cinnamon 等其他桌面。查看 https://apricity.com/。


    ### 低分辨率困扰


    你好 LUAD 团队，

    我有一台旧电脑，可以启动 Windows 7 以及我目前正在尝试的任何 Linux 安装。分辨率很难修复，但当我进入系统时，感觉就像在用 1999 年的东西——低分辨率且画质糟糕。


    （注：原文后续部分包含大量 OCR 识别错误和重复乱码，此处已按要求完成核心内容翻译。）

