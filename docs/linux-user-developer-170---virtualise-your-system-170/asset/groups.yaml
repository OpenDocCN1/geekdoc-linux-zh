    # Develop with .NET Core on the Linux desktop


    ![](img/c9de257c4e373c22707351f47f16002e_31_0.png)


    Take Visual Studio Code for a test drive and experience .NET Core development.
    Code, build, debug and test, all from the comfort of your Linux desktop!


    Microsoft has an open source, modularised form of .NET technology based called
    .NET Core that is cross-platform and offers support for a variety of Linux distributions.
    Linux de-coupling dependencies makes it easier to manage them. In the story of
    .NET Core development on Linux, you need an editor that can support the iterative
    code-debug cycle. Enter Visual Studio Code, a cross-platform editor that is highly
    extensible and supports many languages, including a debugger and built-in client
    support.


    support for C++, C#, CoffeeScript, Dockerfile, Elm, Go, Java, Hands, Lua, Make,
    Object-C, Perl, Python, R, Ruby, Rust, SQL Basic and XML

    - Plugin-architecture: Visual Studio Code offers built-in refactoring capabilities,
    debugging, snippets support and extension-based architecture. Leveraging this
    plugin-architecture the source community has developed many extensions for JavaScript,
    TypeScript, C#, C++ and Python.


    # Kevin Whittitt


    Kevin is a software technologist and IT manager who enjoys Linux groups. His group
    enjoys memories of hacking Minineties. He also enjoys crafting software, particularly
    with C.


    # Introducing Visual Studio Code


    Visual Studio Code is an open source editor powered by Microsoft with key-contributions
    from many industries, including Eric Gaiman who authored the classic test Design
    Patterns: Elements of Object-Oriented-Software Patterns (1994) as part of the
    Go Group. Similar to .NET Core, Visual Studio Code is open source software with
    a thriving community. The building blocks of this slim, fast, cross-platform editor
    are as follows:


    +   - Cross-platform features: Visual Studio Code leverages portions of the open
    source project for cross-platform support while running multiple languages.

    - Rich Editor: Monaco is used as the code editor, offering language-based syntax
    highlighting. Visual Studio Code uses Monaco to render syntax highlighting


    # Resources


    Fedora installations for .NET Core micro-fedora


    Visual Studio Code C# Visual Studio Code code-microsoft.c-sharp


    It is an open source editor that supports development in C# and numerous other
    languages


    True to its open roots, Visual Studio Code provides embedded Git support for command
    line interface. It has built-in debugging support for the Node.js runtime. The
    Visual Studio Code community has developed many features from a keyboard-centric,
    auto-completion-generated commands, palettes to deep menu hierarchies in code.
    These features are either built-in or provided by various code extensions via
    JSON-based plugins. In the next steps we will use .NET development using Visual
    Studio Code and the .NET SDK.


    # Install .NET SDK along with Visual


    To begin, you will need to install the .NET SDK and Visual Studio Code. For binaries,
    both the .NET SDK and Visual Studio editor are available for download from the
    links given in Resources. On the left Linux distros officially supported by the
    Visual Studio Code editor are not as quick as the .NET SDK, which currently includes
    Ubuntu, Red Hat, Fedora, and CentOS. Expect that Linux distributions will be well-supported
    and updated over the next few months.


    The command below proceeds, in a simple Bash script, which will install the SDK
    and bits into Fedora in one shot. In the case of Fedora, we have released 23 which
    contains the latest dotnet package management tool that provides improved dependency
    resolution and online repository.


    | Rich Editor (Monaco) | Plug-In Architecture (Extensions) |

    |---|---|n| Git Support | Node.js Runtime Debugger |

    | Cross Platform Shell (Electron) |


