    Create virtual machines that are almost as powerful as the host PC with KVM''s
    Virtual Machine available with


    If you want the vast selection of features available QEMU with a nice user interface,
    enhanced by the hardware virtualisation on offer from your physical PC or laptop,
    the answer is KVM Virtual Machine Manager.


    With it you get a virtual-like interface (arguably with many features) that makes
    it easy to set up a powerful virtual machine.


    You''ll need to start off checking that your hardware is suitable to use with
    KVM, once you''ve done that, and installed the utility, your VMs will be as powerful
    as your physical


    # 01 Install and run KVM


    Adding true virtualisation to QEMU is not enough for KVM - it''s also a popular
    hypervisor and virtual machine solution for Linux kernels and servers.


    To check if your hardware is suitable for KVM, install the kvm-checker package.


    ![](img/c9de257c4e373c22707351f47f16002e_21_0.png)


    ```

    sudo apt-get install cpu-checker

    ```


    Next, run this command:


    ```

    sudo kvm-ok

    ```


    If the response ends ''KVM acceleration can be used'', you''re ready to go. Install
    KVM and the related tools, use:


    ```

    sudo apt-get install qemu-kvm libvirt-bin virtinst bridge-utils

    ```


    This shouldn''t take long to install.


