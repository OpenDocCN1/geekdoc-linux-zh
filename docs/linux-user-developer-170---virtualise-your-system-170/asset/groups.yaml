    \n```go\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc usingGoChannel(chan\
    \ chan int) {\n\tfor i := 0; i < 4; i++ {\n\t\tch <- i\n\t}\n\tclose(chan)\n}\n\
    \nfunc main() {\n\tfmt.Println(\"Using Channels!\")\n\tchan := make(chan int)\n\
    \tusingGoChannel(chan)\n\tfor my := range chan {\n\t\tfmt.Printf(\"%d\n```\n\n\
    对应的下方是 `simple.go` 的代码，其中 `sync` 包的使用允许 `main()` 函数等待 goroutine 完成它们的工作。\n\n在退出之前：\n\
