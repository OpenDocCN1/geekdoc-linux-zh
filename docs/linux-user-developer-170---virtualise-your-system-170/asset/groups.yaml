    # 机器人


    # 前五名


    ![](img/c9de257c4e373c22707351f47f16002e_8_0.png)


    # 轻量级 Linux 发行版


    ![](img/c9de257c4e373c22707351f47f16002e_8_1.png)


    # 英特尔的 Euclid 项目面向机器人制造商


    # CorePlus


    CorePlus 是最小的 Linux 发行版之一，带有三个完全不同的变。其中最小的是 Core 版本，它不使用 HOME 资源，但仍允许你选择窗口管理器。它极其基础，只提供了对发行版预期的最基本功能。


    下一代机器人将比以往任何时候都更好。


    # 2 LXLE


    在英特尔最近于旧金山开发者论坛上的众多活动中，备受关注的 Project Euclid 是一个为使用 Intel RealSense 技术的开发者设计的微型套件。


    LXLE 极占资源使其成为那些试图为老旧台式机注入新活力的人的明智选择。它适合开箱即用，同时也有大量的自定义空间让你打造出属于自己的风格。


    虽然 Atom Project Euclid 旨在让创建一系列应用程序（如 3D 打印机器人和家庭技术）变得更容易，使用 Intel RealSense 摄像头告诉我们：目前许多面向开发者的技术过于复杂。Euclid
    避免了这种陡峭的学习曲线以提供帮助，弥补了初学者与专业人士之间的差距。


    ![](img/c9de257c4e373c22707351f47f16002e_8_2.png)


    # 3 Porteous


    虽然 Atom 芯片在其后期项目中被忽视，但它仍然处于前沿。它的小尺寸使其成为 Euclid 单元的理想选择，它还具有很高的适应性，非常适合物联网（Things）开发。我们认为它对开发者来说非常完美。它提供了与
    RealSense、更多传感器以及软件工具良好协作的能力：


    在近期基于 Slack 的发行版表现失败的情况下，Porteous 是最好的之一。它为管理可再生资源而设计，这有助于 Porteous 始终保持小巧紧凑。


    ![](img/c9de257c4e373c22707351f47f16002e_8_3.png)


    # 4 Vector Linux


    英特尔首席执行官 Brian Kranisz 登上 IDC 舞台。虽然目前 Euclid 的退出情况尚不清楚，但考虑到内部的技术，其“标准巧克力棒”大小的令人印象深刻。由于我们特别喜欢全连接方案、英特尔自己的
    RealSense 摄像头以及各种传感器，我们特别喜欢 Ubuntu Linux 和 Robot OS（机器人操作系统）。Project Euclid 的发布日期尚不清楚，但它是值得期待的。


    在宣布 Project Euclid 的同时，英特尔还展示了下一代传感器，改进了每秒捕捉的3D 点数量。更小的尺寸意味着它们可能被应用于下一波物联网中。英特尔最新的
    RealSense 摄像头预计于今年晚些时候推出。


    简单是 Vector Linux 的关键，这也是该发行版获得拥趸的原因之一。轻量视觉使用了极其简单的界面，是资源机的完美管理器。


    # 5 Puppy Linux


    这是另一个为老旧机器注入新活力的发行版，但它依然实力强劲。它功能丰富，却出奇地轻量。考虑到其较小的体积，但如果你想保持更小的体积，这些功能是可以移除的。


    # CHROME


    # Google 将停止在非 Chrome 系统上支持 Chrome 应用


    谷歌将停止为非 Chrome 操作系统提供所有 Chrome 应用。


    在谷歌最近的一篇博客中，公司表示将从非 Chrome 操作系统移除所有 Chrome 应用。对于那些经常在 Linux 桌面使用它们的人来说，这是一个打击；由于普及率较低，因此从
    Windows 和 OS X 上移除 Chrome 应用——


    所有当前应用将继续可用一段时间，开发者仍被允许跨平台进行更新。


    # 命令行


    # PowerShell 脚本语言开源


    在脚本语言方面，微软的 PowerShell 被认为是最好的之一。它是运行和管理任务的理想工具，并且对于任何基于 .NET 框架构建的内容都足够强大。微软已经在
    Linux 上发布了 PowerShell 的功能，因此很高兴看到它终于开源了。随着微软“多平台”梦想的全面推行（注：正在全力实现），我们最终可能会看到它的许多其他核心软件工具。


    PowerShell 的代码库将适用于所有兼容的开源编辑器，并在 GitHub 上通过许可提供。需要注意的是，这个初始版本尚处于 Alpha 阶段，因此某些功能被精简了，在其他领域可能存在兼容性问题。


    > 它是轻松运行和管理任务的理想工具。


    微软还将 PowerShell 编辑器加入了列表，它可以实现在文本编辑器中用于调试和编程。对于 PowerShell，目前其 PowerShell 编辑器仅在
    Windows 上可用。微软正在为用户推出一门免费在线学院课程。它涵盖了学习 PowerShell 所需的所有基础知识，以及将其到你的设置中的最佳方法。


    感兴趣吗？前往 GitHub 上的 PowerShell 仓库：https://github.com/PowerShell/PowerShell/tree/docs/learning-powershell


    ![](img/c9de257c4e373c22707351f47f16002e_9_0.png)


