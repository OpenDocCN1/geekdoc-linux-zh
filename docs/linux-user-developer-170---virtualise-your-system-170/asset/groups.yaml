- md: "\n# OpenSource\n\nYour source of Linux news & views\n\n# INTERVIEW TIMOTHY\
    \ FREEBURN\n\n## Racing robots in Formula Pi\n\nGot the need for speed? Timothy\
    \ Freeburn discusses how Formula Pi introduces the new era of racing robots.\n\
    \n![](img/c9de257c4e373c22707351f47f16002e_11_0.png)\n\nTimothy Freeburn\nTimothy\
    \ Freeburn is the director and owner of the UK-based robotics company Freeburn\
    \ Robotics. He has extensive experience in the design and manufacture of high-quality\
    \ PCBs and electronics equipment.\n\n> Where did the idea for Formula Pi come\
    \ from?\n\nWhen I was young, my father used me to watch motor racing. While most\
    \ people were obsessed with driving the cars or which celebrity the driver was,\
    \ I always preferred the engineering behind the cars and how they were built.\
    \ I always wondered what it would be like to take the driver away from the car,\
    \ and have cars compete without their hands off the wheel? To self-driving cars\
    \ taking sick people to hospitals, or people to visit their family if they can't\
    \ see them, or to get me home from the 'very occasional' pub evening? It was these\
    \ ideas that eventually formed what we wanted to achieve with Formula Pi.\n\n\
    ## How are the races structured? Does it have a league-based system, for example?\n\
    \nA few different ideas have been proposed. The reason this hasn't been explained\
    \ yet is because the actual form depends on the amount of competitors we get on\
    \ board with the project. We want to have robots racing on heats of fire. There\
    \ will be an accommodation for any mechanical problems, and to find any gaps,\
    \ we will have robots running the standard, unmodified format to ensure fairness.\
    \ This will be the most interesting and fair for the competitors that get involved.\n\
    \nIn the meantime, it is most likely that the heats take place every two weeks,\
    \ so that people have a chance to tweak code before the next heat and sure their\
    \ robot is running at peak performance.\n\n![](img/c9de257c4e373c22707351f47f16002e_12_0.png)\n\
    \nThese races will be broadcast live so that everyone can watch their robots compete,\
    \ with each result of the heats posted by the day after each heat.\n\n## How was\
    \ the track designed? Are there different elements you need to consider?\n\nWe\
    \ tried to make the track as long as we could in the space we had. The outside\
    \ of the track wanted to have rubber skirting so that any collisions didn't damage\
    \ the robots or the track, which was massively important. The track itself wanted\
