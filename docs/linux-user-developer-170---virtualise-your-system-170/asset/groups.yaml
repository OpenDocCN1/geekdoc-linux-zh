    Width of 40 and height of 10 leads to a decent-looking dialog.


    On some systems, users can click these buttons with the mouse.


    UNIX returns a numerical status to the operating system as they terminate; it
    provides information about what happened during program execution. Results of
    the last-run can be accessed in Bash via the ? variable, which value is extracted
    using the Operator.


    Passing in 10 70 creates a very long dialog.


