    \ 调用必须反映你想要等待的 goroutine 数量，这应该是你调用 sync 的 goroutine 总数。\n\n调用 `sync.Done` 的次数多于\
    \ `sync.Add` 是不好的，但不会让你的程序崩溃——它会在所有 goroutine 完成工作之前结束。\n\n你也可以忽略通道的值，实现如下：\n\n\
    ```go\n<-aChannel\n```\n\n关闭通道使用 `close(channel)` 函数。你可以在图 2 中看到 GoChannel 的代码，它使用了整数值。执行\
    \ GoChannel 生成如下输出：\n\n```\n$ go run GoChannel.go\nUsing Channels!\n1 2 3\nChannel\
    \ is closed!\n```\n\n以下将查找通道的状态：\n\n```go\nok := <-chan\nif ok {\n    fmt.Println(\"\
    open\")\n} else {\n    fmt.Println(\"closed\")\n}\n```\n\n## 并发并行 (Concurrency\
    \ Parallelism)\n\n常见的误区是并发和并行是相同的。并发是同时处理许多事情，并行是同时执行许多事情。\n\nGo 程序使用单个通道。使用多个通道的非常常用的技术被称为流水线\
    \ (pipelines)，通过这种方法连接 goroutine，使一个的输出成为另一个通道的输入。\n\n但在在此之前让我们谈谈展示的程序，名为 `pipelines.go`，该程序将读取文本行，计算每行的长度，并在打印所有长度之前统计每个长度出现的次数。图\
    \ 5 显示了执行 `pipelines.go` 使用一个每行包含单个单词的文件时生成的输出输出。\n\n```\n$ wc INPUT\n124586 INPUT\n\
    $ run pipelines.go INPUT | sort -rn\n```\n\n"
