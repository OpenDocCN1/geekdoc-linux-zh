    # OPINION


    ## The kernel column


    Jon Masters summarizes the latest happenings in the Linux kernel community, as
    Linus Torvalds closes the merge on Linux 4.8 in anticipation of the next kernel
    release


    Linus Torvalds announced the first release-candidate for what will be coming in
    a few weeks, because at 4.8-rc1 he decided that it was a little behind in a handful
    of patches to deal with, but that he was closing the window to prevent any more
    coming in. According to one of the bigger ''releases'', the feature set for the
    next kernel is quite impressive; and the kernel includes a few changes that leave
    the state in limbo.


    An interesting footnote in the development of Linux 4.8 was discussion initiated
    by Pavel Machek about 4.8-rc2 booting-up on his system. It turns out 4.8 has a
    kernel command line literally a rootvol=/dev/sda argument, and that 4.8 changes
    the probe order (on his system) for which USB works. This bug was documented on
    the mailing list, causing the exact inverse of what had been true up until now.
    A lengthy thread followed in which Pavel suggested that this break working was
    always non-deterministic; and many others pointed out that driving probe ''is
    always broken''. They encouraged Pavel to use USB-block instead, which exists
    for exactly this purpose during the system boot.


    For example, 4.8-rc2 was dominated by arch updates, and fs/mm (rather than the
    driver-focus usually). From a normal cycle, 20 percent of the 4.8-rc2 changes
    were documentation documentation updates. This wasn''t a result of the kernel
    community development, but rather a result of the need for merging support for
    the kernel documentation (which it does), but as a result of the mechanism for
    formatted code documentation. This mechanism will initially load the older (doctype)
    based documentation. Documentation on Sphinx might be found in the kernel source,
    and some examples can be found in the kernel GPU and DRM 3D rendering for 4.8.


    The 4.8 kernel will be bringing a new number of features, including architecture
    emulation, page-reclaim using NUMA (node as proposed), except on 64-bit ARM systems
    (arm64), overpi on both x86 and ARM, and users need a short term workaround for
    hardware- to easily override existing system-firmware tables with fleets, memory.
    This brings robustness and improvements for kernels, as well as the ability to
    better drivers and kernel managing memory events, and initial support for virtually
    mapped kernel stacks (which we have covered previously). Of these new features,
    architecture emulation containers will be interesting to many readers, especially
    those developing mobile and embedded systems such as Raspberry (Pi) on x86 laptop
    or desktop.


    ## Architecture Emulation Containers


    Architecture Emulation Containers are a relatively simple concept, building upon
    the existing support in the kernel for binary emulation, providing support for
    executing binaries using a plugin-like system that identifies the format of the
    executable and then determines which interpreter should use to execute it in running.
    For example, when you Jon Masters


    A Linux kernel hacker who has been working for Linux for some 19 years. He graduated
    from the university of Texas at Austin. In Linux he has committed works for the
    creation of standards for energy efficient-powered servers.


    ### /bash


    on your Linux system, the kernel will identify that this is an ELF (Executable
    and Linkable Format) binary. The interpreter knows how to read the headers of
    the bash binary and determine which interpreter should use to handle the actual
    loading and execution of this file. The interpreter is responsible for loading
    each section used by this binary, as well as its dependent libraries. You can
    see a list of the libraries used by bash by using:


    ```

    $ ldd /bin/bash

    linux-vdso.so.2 => (0x00007afc51559000)

    libinfo.so.2 => /lib64/libinfo.so.2 (0x00007af6c7b8b000)

    ldl.so.2 => /lib64/ldl.so.2 (0x00007af6c7b8b000)

    libc.so.6 => /lib64/libc.so.6 (0x00007af6c7b8b000)

    /lib64/ld-linux-x86-64.so.2

    ```


    This is where the loader should link in the necessary system libraries with a
    .so (shared object); That loader (interpreter) is itself described in the ELF
    header of the binary (which you can display using the -l or objdump utility).
    In this case, it is the special shared library provided by the GNU C Library.
    Once it is loaded, it is executed to handle the dynamic programming.


    ELF is a common format used on modern Linux systems (there was an older format
    used in the early days of Linux, as well as Unix systems). Windows uses a different
    format, namely Portable Executable (PE), and Mac uses others. Linux contains support
    for all of these, as mentioned before. Here one can find binaries and call the
    necessary interpreter for them. For example, on an Unix system, you might have
    noticed that you can run shared libraries by simply linking them at runtime or
    not by any program. When you want to do this, it is because the dynamic linker
    (WINE) Emulator to automate the invocation of the appropriate handler.


    Simply making it possible to handle different architectures through the appropriate
    binfmt_misc handler, James Bottley, the binfmt_misc maintainer build upon this
    support in Linux by adding the ability to emulate the architecture using QEMU
    (like Docker, Snap, etc.). Thus, containers can be shipped for various architectures
    without modification to the contents.


    ## Ongoing Development


    Cain Marina (at ARM) posted a series enabling this-only support in contemporary
    processors. The initial update relies on the PTE_XN and PTE_USER page bits in
    the page tables to protect memory being executed. Marina notes that the kernel
    can still bypass this process until ARMv8.2 processors introduced a feature in
    which memory is made encrypted. Tom Lansky (at AMD) posted a later version of
    the patch series implementing Secure Memory Encryption (SME), an AMD-x86 feature
    allowing pages of memory to be marked as encrypted. With SME active, a page of
    memory is encrypted when written to DRAM and automatically decrypted when read
    from DRAM. This is an exciting new feature that would improve system security,
    especially in mobile. This month, let''s take a moment to remember June Hans,
    a kernel developer who passed away in August. June Hans was the principal author
    of the UIO (Userspace I/O) (Function Virtualisation) and many other technologies
    within and outside of virtual machine technologies.


    ## Virtualise your system


    # VIRTUALISE YOUR SYSTEM


    Want to run multiple operating systems, but find dual-booting unproductive? The
    answer is virtualisation – running one OS within another


    Whether you''re running Ubuntu and Fedora on a dual-boot system, or you''ve got
    a partition for Windows as well (you might even run a Hackintosh partition too),
    then you have a definite issue with your system rebooting. It takes time to reboot;
    from shutdown to your GRUB 2 menu selection, and then booting into the chosen
    OS can take as long as 5-10 minutes – time better spent being productive rather
    than staring at a screen.


    Alternative operating systems as software ''guest OS'' that you, can load up on
    your PC (the host OS) to use as and when you need it. Say goodbye to multi-booting!

