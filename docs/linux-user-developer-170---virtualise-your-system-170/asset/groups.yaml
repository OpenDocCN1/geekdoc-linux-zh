    is similar to for(2). However, although you are creating five goroutines, all
    of them are used. This is also a call to the text system that is used for user-space
    locking and provides a method for a program to avoid race conditions. The result
    is system calls with less interest and no overhead.


    The thing is that if you are going to create 160 goroutines, the current version
    of anotherExample.go will use two cores:


    ```

    # str / ./anotherExample 150 2<61 | grep

    2 8 212

    ```


