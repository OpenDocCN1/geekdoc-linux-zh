    # Review File compression utilities


    # 7zip


    Does it stand up well to the competition showcased here?


    # WinZip


    The pro version may cost a lot, but WinZip justify the price?


    ![](img/c9de257c4e373c22707351f47f16002e_79_0.png)


    +   * You can use the Benchmarking feature to track the compression and archiving
    your speeds of files


    ![](img/c9de257c4e373c22707351f47f16002e_79_1.png)


    +   * Options are placed around each side of the central column, which can lead
    to some confusion as to what''s features


    # Design


    It''s testament to the team behind 7zip that despite the complexity of the features
    found in 7zip, everything is easy to find. Menus are easy to navigate and core
    features are listed appropriately. A small caveat is that advanced features do
    require a fair amount of digging to find, but this is only a small issue for us.


    # Design


    While we won''t say its exactly pleasing to the eye, WinZip does one of the best
    Utils out of the nine features. Options are easy to find and the menu system is
    not overly complicated. We especially like how the compression features are kept
    separate from the advanced offerings within


    # File compression and archiving


    It''s as easy as pressing a button, but really is simple to extract. Extracting
    directories is not entirely big plus here, but some people will be missing able
    to deliver a deeper dive into the compression process. For beginners, having some
    help at hand is a section if you get along with it


    # File compression and archiving


    The speed with WinZip manages to compress and extract files is alarming fast,
    so if speed is a key factor for you, then WinZip may be your best choice. There''s
    a slight amount of slowdown when dealing with bigger files, but not one of the
    worst. Compression options are easy to manage, just get what you need


    # File management


    7zip is one of the few compression utilities to fully integrate a file management
    system in its features. While it is not as-featured as Windows file manager, it
    does handle the basics enough. We do not need to download 7zip just for this features,


    # File management


    There is a surprising of options bundled within WinZip''s management system. As
    well as simplifying many files around, there''s a fully editing sort board, for
    making on-the-spot changes to your archive. We also like LibreOffice, but this
    is the best file management out of the compression utilities featured here.


    # Extra features


    While the core 7zip utility is good enough, we especially like the command-line
    version, which brings a new dimension for Linux users. Shell integration is also
    available here, but it is a bit too much for most people. Only use it if you have
    prior knowledge ofWindowsShell.


    # Extra features


    Delivering into WinZip will showcase one of the better sharing out there. Any
    compressed file can be easily shared and through various social media feeds and
    IM suites. It is also a handy document watermark feature, great for adding your
    stamp to your files when needed


    # Overall


    Despite the addition of a couple of superfluous extras, at its core 7zip remains
    one of the prime file compression utilities. It''s the perfect choice for new
    users, despite the small anxieties.


    # Overall


    We''re impressed with WinZip for the most part, but the £42.95 price tag for the
    full version is actually difficult to swallow when the free alternatives are here
    in most areas.'
