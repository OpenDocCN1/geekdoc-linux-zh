    ## 内核专栏


    Jon Masters 总结了 Linux 内核社区的最新动态，此时 Linus Torvalds 正准备关闭 Linux 4.8 的合并窗口，以迎接下一个内核版本的发布。


    Linus Torvalds 宣布了将在几周后发布的第一个候选版本（Release Candidate），因为在 4.8-rc1 时，他认为该版本在处理某些几个补丁方面略显落后，但他决定关闭合并窗口以防止更多补丁进入。根据其中一个较大的“发布版”，下一个内核的功能集非常令人印象深刻；内核还包含了一些让某些状态处于悬而未决的变化。


    Linux 4.8 开发过程中一个有趣的脚注是 Pavel Machek 发起的关于 4.8-rc2 在其系统上无法启动的讨论。事实证明，4.8 的内核命令行中字面上量包含一个
    `rootvol=/dev/sda` 参数，且 4.8 改变了（在其系统上）USB 工作的探测顺序（probe order）。这个 Bug 在邮件列表中被记录，导致了与此前情况完全相反的结果。随后出现了一个长贴帖子，Pavel
    建议这种功能失效一直是非确定性的；许多人指出驱动程序探测“总是是坏的”。他们鼓励 Pavel 改用 `USB-block`，该功能在系统启动期间正是为了这一目的而存在的。


    例如，4.8-rc2 主要以架构更新（arch updates）以及 `fs/mm` 为主（而不是通常关注的驱动程序方向）。在一个正常的周期中，20% 的
    4.8-rc2 更改是文档更新。这并非内核社区开发的结果，而是由于需要合并内核文档支持（内核确实支持此项），同时也是由于格式化代码文档机制的结果。该机制最初将加载基于旧版
    `(doctype)` 的文档。在内核源码中可以找到关于 Sphinx 的文档，并在 4.8 的内核 GPU 和 DRM 3D 渲染中找到一些示例。


    4.8 内核将带来许多新功能，包括架构仿真、使用 NUMA（如建议的 node）进行页面回收（但在 64 位 ARM 系统（arm64）除外）、x86 和
    ARM 上的 overpi，并且用户需要一种短期的临时方案来通过硬件轻松覆盖现有的系统固件表（如内存）。这为内核带来了健壮性和改进，并能够更好地管理驱动程序和内核的内存事件，以及对虚拟映射内核栈的初步支持（我们之前介绍过）。在这些新功能中，架构仿真容器将让许多读者感兴趣，特别是那些在
    x86 笔记本电脑或桌面上开发树莓派（Pi）等移动和嵌入式系统的开发者。


    ## 架构仿真容器


    架构仿真容器是一个相对简单的概念，基于内核对二进制仿真的现有支持，通过类似于插件的系统支持执行二进制文件。该系统识别可执行文件的格式，然后确定应该使用哪种解释器在运行时执行它。例如，当你
    Jon Masters


    Jon Masters 是一位从事 Linux 工作约 19 年的内核黑客。他毕业于德克萨斯大学奥斯汀分校。在 Linux 领域，他为创建能效服务器的标准做出了贡献。


    ### /bash


    在你的 Linux 系统上，内核将识别出这是一个 ELF（可执行链接格式）二进制文件。解释器知道如何读取 bash 二进制文件的头，并确定应该使用哪种解释器来处理该文件的实际加载和执行。解释器负责加载该二进制文件使用的每个部分以及其依赖库。你可以通过以下命令查看
    bash 使用的库列表：


    ```

    $ ldd /bin/bash

    linux-vdso.so.2 => (0x00007afc51559000)

    libinfo.so.2 => /lib64/libinfo.so.2 (0x00007af6c7b8b000)

    ldl.so.2 => /lib64/ldl.so.2 (0x00007af6c7b8b000)

    libc.so.6 => /lib64/libc.so.6 (0x00007af6c7b8b000)

    /lib64/ld-linux-x86-64.so.2

    ```


    这就是加载器（loader）通过 `.so`（共享对象）链接必要系统库的地方；该加载器（解释器）本身描述在二进制文件的 ELF 头中（你可以使用 `-l`
    或 `objdump` 工具显示它）。在这种情况下，它是 GNU C 库提供的特殊共享库。一旦加载，它就会被执行以处理动态链接。


    ELF 是现代 Linux 系统上的一种常用格式（Linux 早期使用过一种旧格式，Unix 系统也曾如此）。Windows 使用不同的格式，即可移植执行文件（PE），而
    Mac 使用其他格式。如前所述，Linux 包含了所有这些格式的支持。在这里可以找到二进制文件并为它们调用必要的解释器。例如，在 Unix 系统上，你可能注意到你可以简单地在运行时链接它们或不通过任何程序来运行共享库。当你想要这样做时，是因为动态链接器（WINE）模拟器会自动调用适当的处理程序。


    仅仅是通过适当的 `binfmt_misc` 处理程序让处理不同架构成为可能，`binfmt_misc` 维护者 James Bottley 在 Linux
    这一支持的基础上进行了扩展，增加了使用 QEMU 仿真架构的能力（如 Docker、Snap 等）。因此，容器可以针对各种架构分发，而无需对其内容进行修改。


    ## 进行中的开发


    Cain Marina（来自 ARM）发布了一系列在现代处理器中启用此支持的补丁。初始更新依赖页表中的 `PTE_XN` 和 `PTE_USER` 位来保护正在执行的内存。Marina
    指出，直到 ARMv8.2 处理器引入内存加密功能，否则内核仍然绕过此过程。Tom Lansky（来自 AMD）发布了实现安全内存加密（SME）的补丁系列的后续版本，这是一个
    AMD-x86 功能允许加密内存页。当 SME 激活时，写入 DRAM 时会被加密，从 DRAM 读取时会自动解码。这是一个令人兴奋的新功能，将提高系统安全性，特别是移动设备。本月，让我们共同纪念在
    8 月去世的内核开发者 June Hans。June Hans 是 UIO（用户空间 I/O）（功能虚拟化）以及许多虚拟机技术之外技术的首席作者。


    ## 虚拟化你的系统


    # 虚拟化你的系统


    想要运行多个操作系统，但发现双启动效率很低吗？答案是虚拟化——在另一个操作系统内部运行一个操作系统。


    无论你是在双启动系统上运行 Ubuntu 和 Fedora，还是为 Windows 预留了一个分区（你可能还运行了 Hackintosh 分区），你的系统在重启方面都存在明显的问题。重启需要时间；从关机到
    GRUB 2 菜单选择，再到进入所选操作系统，可能花费 5 到 10 分钟——这段时间本该用来提高生产力，而不是盯着屏幕。


    将替代操作系统作为软件“客体操作系统”，你可以根据需求并在 PC（宿主机操作系统）上加载它们。告别多启动吧！


    '
