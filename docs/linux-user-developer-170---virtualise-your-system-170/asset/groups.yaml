    # Ubuntu 管理教程


    ## 安全备份你的数据


    深入了解一些帮助你安全备份数据的技术。


    备份通常是指数据的复制和归档过程：其核心思想是让管理员在发生数据丢失事件时能够恢复数据。你可以将备份视为一种简单形式的保险，但不应将其被视为可靠的数据恢复。将所有数据都保留在本地系统上的方法具有极大风险。例如，如果你的本地系统损坏，你将丢失数据。建议在位于其他地方机器上保留一份数据副本。在
    Linux 系统上，使用磁带进行备份的方法是先创建归档，然后压缩文件，并在将该归档写入磁带时进行备份。随着技术的演进，磁带归档已被可以使用网络进行数据备份的技术所取代。


    ![](img/c9de257c4e373c22707351f47f16002e_43_0.png)


    Swayam Prakasha


    拥有信息技术硕士学位，在信息系统领域工作多年，涵盖操作系统、网络、电子商务和 Web 服务器。Swayam 曾为行业出版物撰写文章，并在各种主题上发表论文。可以通过
    swayamprakasha@gmail.com 联系他。


    使用 `tar` 创建备份可能是备份数据时最广泛使用的机制。`tar` 命令是一个用于此目的的多功能工具。`tar` 最初用于制作磁带归档，如今 `tar`
    被认为是最受欢迎的命令，因为它提供了丰富的选项和功能。作为创建归档的一部分，你可以添加各种可以压缩归档的选项。最流行的选项可以




    ![](img/c9de257c4e373c22707351f47f16002e_43_1.png)


    ```

    $ tar -cvf backup.tar /home/user

    $ tar -cvzf backup.tar /home/user

    $ tar -cvjf backup.tar /home/user

    $ tar -cvjf backup.tar /home/user

    $ tar -cvJ backup.tar /home/user

    $ tar -cvJf backup.tar /home/user

    $ tar -cvf backup.tar /root

    $ tar -cvf backup.tar /etc

    $ tar -cvf backup.tar /var

    $ tar -cvf backup.tar /bin

    $ tar -cvf backup.tar /sbin

    $ tar -cvf backup.tar /usr

    $ tar -cvf backup.tar /home

    $ tar -cvf backup.tar /dev

    $ tar -cvf backup.tar /lib

    $ tar -cvf backup.tar /root

    $ tar -cvf backup.tar /boot

    $ tar -cvf backup.tar /opt

    $ tar -cvf backup.tar /tmp

    ```


    ## 从 tar 中提取


    请注意，-z 使用 gzip 格式压缩，-j 使用 bzip2 格式压缩归档。需要注意的是，普通的 `tar` 文件格式为 `.tar.gz`（使用 gzip
    压缩）或 `.tar.bz2`（使用 bzip2 压缩）。除了上述 gzip 和 bzip2 之外，还有其他流行的压缩 tar 文件。你可以使用 `tar`
    命令提取包。你可以预期 Unix 和 Linux 系统已经包含了你需要的 `tar` 工具。旧版本通常使用两步过程——创建归档，然后对其进行压缩。在较新版本的
    `tar` 中，你将一次性完成这些任务——即在一步中创建归档并压缩输出内容。


