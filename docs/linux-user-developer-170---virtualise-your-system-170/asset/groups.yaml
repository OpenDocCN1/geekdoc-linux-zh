    ## Synology RT190ac 允许你更详细地管理你的互联网以及使用它的设备


    其规格优于竞争对手 Asus RT-AD6BU（后者仅有 200MHz 双核处理器），等同于 Netgear Nighthawk R7000，但比 Linksys
    WRT1900ACS 快（后者主频为 1.3GHz）。Synology 的初作价格比这些任何一个都便宜，让你物有所值，获得更高的性价比。


    该路由器还有 LAN 端口和一个 WAN 端口，你在处理 ADSL 时需要用到它们。它还有一个 USB 3.0 端口，你可以更轻松地将打印机连接到网络，或者插入
    4G 上网器。虽然你可能不习惯路由器的界面进行设置和故障排除，但 Synology 管理器 (SRM) 可能会让你有些新奇。对于习惯了 NAS 服务器的人来说，如果你没有用过
    Synology 的软件，这个基于 Linux 的界面就像传统的桌面操作系统，配备了图标、搜索栏和可自定义的壁纸。它允许你更轻松地管理互联网和设备，查看单个应用程序和设备消耗了带宽，并能够设置家长控制和两个不同的访客账户，这样访问者就可以连接互联网而无需访问你的文件。


    或许该操作系统最好的部分是软件包中心（Package Centre），它本质上是一个商店，允许你下载 Synology 以及其他第三方的插件，从而进一步自定义你的路由器；例如，将其变成媒体中心或
    VPN 服务器。你需要插入外部硬盘或使用 SD 卡读取器来存储任何这些插件。


    我们对 SRM 留下了深刻印象，并认为如果第三方开发者能够接受它，它将具有革命性的潜力。我们很高兴地报告，RT1900 在近距离表现良好。使用以太网线，它的达到了令人惊讶的
    995Mbps 和 535Mbps。2.4 GHz 频段的接近 150Mbps，这仍然非常可观。然而，随着距离增加，5 GHz 频段下降到 217Mbps。随着距离增加（并穿过墙），性能大幅下降，一度掉到约
    5Mbps 左右。不过，你也可以设置路由器根据你离家的距离自动在频段之间切换。这只是使用软件改善 Wi-Fi 体验的另一种方法。


    > Jack Parsons


    ### 优点

    - Synology 的初作优于竞争对手，提供了良好的整体性能，包括易于管理和先进的控制系统


    ### 缺点

    - 你仅需 £30-£150 即可使用速度更快、下载更快且 Wi-Fi 范围更远的 Linksys 路由器


    ### 总结

    RT1900ac 的工具易于部署且与众不同。它具有你可以快速学会的功能。随着我们对创建插件产生兴趣，我们将继续扩展这个列表。如果你使用它，它覆盖了很大范围，但你可能会认为


    ## LXLE 16.04.1


    LXLE 开发团队的最新更新中包含了许多变化。


    尽管各处出现的的基于 Ubuntu 的发行版数量不断增加，但 Linux 已经成功获得了一个规模小但不断增长的用户群体。与其竞争对手相比，它拥有最好的更新历史之一，而其最新的版本
    16.04.1 可以说是它迄为止最好的版本。它的核心在于从头到尾启动过程中海量的改进，整个启动过程耗时不到 60 秒。考虑到其搭载的丰富功能，能保持如此低的时间是一项令人印象深刻的成就。另一个帮助将启动时间降至最低的关键改进是对你的计算机资源没有压力。与我们有机会上手的其他大多数发行版相比，虽然它在某些方面并不完美，但它确实值得一直顺畅运行。


    至于 LXLE 的 UI，它仍然是世界上顶尖的界面之一。虽然简单仍然是它的核心，但有一些精妙的动画和过渡，使得在其中移动比以前更好。不过，它缺乏了那些多余的添加，其中新的
    Aero 功能是所有中最明显的。Aero 看起来可以快速且整齐地吸附多个窗口。这可能是导致该发行版运行变慢的功能之一，但对大多数用户来说并非如此。


    在这一版本的 LXLE 中，包含了取自 GNOME 组件的 Material 主题。在大多数情况下，它们之间的区别只是更吸引眼，但你会注意到偶尔会出现小问题。尽管如此，图标的使用相当标准，但它缺少你在这个发行版所需的功能。我们特别喜欢包含了三个辅助程序，特别是魔法启动器（magic
    launcher）。


    或许 LXLE 更新中最大的 Bug 之一是过度控制的菜单，但他们已将其回归本源。现在更受控制的菜单服务于更多用户，同时也补充了该发行版的简单本质。搜索功能从未如此简单，但它缺乏我们从类似发行版中预期的自定义选项。另一个在你开始使用
    LXLE 时立即变得显著的大修复是，安全更新会自动应用。手动维护和应用更新的繁琐性质已不复，对于用户来说，这使得系统易于维护。系统管理器作为一种管理整个发行版更新的超级方法，这是我们这段时间看到的非常棒的事情。而且，如果追溯到易用性，那就是
    LXLE 确实在这些关键功能的条件下付出了努力。


    LXLE 16.04 远非完美，但它是我们梦梦想过的第一个版本。很少其他基于 Ubuntu 的发行版能带来这样的轻量化和性能。控制菜单的显著改进引发了许多事情。


