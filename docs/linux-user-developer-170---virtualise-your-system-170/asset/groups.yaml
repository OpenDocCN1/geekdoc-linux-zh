    # Tutorial Ubuntu management


    ## Back up your data securely


    Take a deeper look at some of the techniques that will help you back up data securely.


    Back up typically refers to the process of copying and archiving data: the idea
    is to system a administrator to restore the data if there is a data loss event.
    You can consider backup as a simple form of insurance, but it should not be considered
    as reliable data recovery. The process of keeping all your data on local systems
    is in great danger. For example, if your local system can be damaged then you
    will lose your data. It is recommended to keep copy of your data on a machine
    located elsewhere. On Linux systems, data backed up using tape is done by first
    creating archive and then compressing files to backup and tape when writing that
    archive to a tape. As technology evolved, tape archiving has been replaced by
    techniques that can be used to back up data over the network.


    ![](img/c9de257c4e373c22707351f47f16002e_43_0.png)


    Swayam Prakasha


    A Master''s degree in information technology and has been working in information
    systems for several years, including operating systems, networking, e-commerce,
    and web servers. Swayam has authored articles for trade publications and presents
    papers on various topics. He can be reached at swayamprakasha@gmail.com


    Creating backups with tar may be the most widely used mechanism when it comes
    to backing up data. The tar command is a versatile tool for this purpose. tar
    was originally used to make tape archives and nowadays, tar is considered as the
    most favoured command that can be used to provide various options, so as rich
    features. As a part of creating an archive, you will be able to add various options
    which will compress the archive. The most popular options that can


    ![](img/c9de257c4e373c22707351f47f16002e_43_1.png)


    ```

    $ tar -cvf backup.tar /home/user

    $ tar -cvzf backup.tar /home/user

    $ tar -cvjf backup.tar /home/user

    $ tar -cvjf backup.tar /home/user

    $ tar -cvJ backup.tar /home/user

    $ tar -cvJf backup.tar /home/user

    $ tar -cvf backup.tar /root

    $ tar -cvf backup.tar /etc

    $ tar -cvf backup.tar /var

    $ tar -cvf backup.tar /bin

    $ tar -cvf backup.tar /sbin

    $ tar -cvf backup.tar /usr

    $ tar -cvf backup.tar /home

    $ tar -cvf backup.tar /dev

    $ tar -cvf backup.tar /lib

    $ tar -cvf backup.tar /root

    $ tar -cvf backup.tar /boot

    $ tar -cvf backup.tar /opt

    $ tar -cvf backup.tar /tmp

    ```


    ## Extracting from tar


    be aware that -z to compress in gzip format, and -j to compress the archive in
    bzip2. It is noted that the regular tar files are in tar.gz (compressed with gzip)
    or in tar.bz2 (compressed with bzip2). In addition to the two aforementioned gzip
    and bzip2, there are other popular compressed tar files. You can use the tar command
    to extract packages. You can expect Unix and Linux systems to contain the tools
    you need with tar. The older versions normally used a two-step process – create
    an archive and then compress it. With the newer versions of tar, will be able
    to perform these tasks in one shot - i.e. creates the archive and compresses the
    output in one step.


    | NAME | BSD General Command Manual | TAR (1) |

    | --- | --- | --- |

    | tar | The GNU version of the tar archive | |


    ## Resources


    - Types of backup

    http://types.backup.com


    - Data backup explained

    bit.ly/16u8c3


    - Virtual backup with traditional technology and specialised tools

    bit.ly/2bjec5


    ## SYNOPSIS


    ```

    tar [ -] A --concatenate --concatenate [c -- create | -f | -dff | --compare |
    t -- list | --test-label | u -- update | x] --extract --get [file=ARCHIVE] [options]
    [pathname ... ]

    ```


    ## DESCRIPTION


    Tar stores and extracts files from a tape or disk archive.


    The first argument to tar should be a function, either one of the letter names.
    A function letter must not be prefixed with ''-'' and may be combined with other
    single-letter options. A long function name must be prefixed with ''--''. Some
    options take a parameter; with the single-letter format these must be given as
    separate arguments. With the long format they may be given by value=to the option.


    Main operation mode:


    Manual page tar(1) line 1 (h for help or q to quit)


    Right page

    details of a widely used tar command


