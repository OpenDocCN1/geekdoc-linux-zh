  md: "# # A Tour of Go\n\n# # Goroutines\n\nA goroutine is a lightweight thread managed\
    \ by the Go runtime.\n\n```\ngo func(x, y, z) {\n\tstarts a new goroutine\n}(f,\
    \ y, z)\n```\n\nThe evaluation of f, y, and z happens in the current goroutine\
    \ and the execution of f happens in the new goroutine.\n\nGoroutines run in the\
    \ same address space, so access shared memory without synchronization. The sync\
    \ package provides primitives, although you won't need much in Go as there are\
    \ other primitives (See the next slide).\n\n![](img/c9de257c4e373c22707351f47f16002e_48_0.png)\n\
    \n< 1 / 11\n\nFigure 1\n\n![](img/c9de257c4e373c22707351f47f16002e_48_1.png)\n\
    \nYou will discover an extremely tricky point here: if you try to omit the call\
    \ to time.Sleep from the main function it will finish first and the two goroutines\
    \ will not have enough time to start and finish their jobs; as a result you won't\
    \ get any output out of your screen, now you can start understanding the difficulties\
    \ of concurrent programming!\n\nAs you realize, goroutines run this way are isolated\
    \ from each other and cannot exchange any kind of data, which is not always the\
    \ desired way of operation. The next section will tell you about Channels, which\
    \ offer a way for goroutines to send and receive data.\n\n# # About Channels\n\
    \nA channel is a connection between goroutines that allows goroutines to exchange\
    \ data - each channel allows the element type of a particular data type, To operate\
    \ a channel, you will need someone to receive the data that is sent via the channel.\
    \ Otherwise, the function that sends the data will block while waiting to receive\
    \ its data.\n\nYou can declare a channel using the chan keyword in the following:\n\
    \n```\npackage main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc aFunction()\
    \ {\n\ttime.Sleep(100 * time.Millisecond)\n\tfmt.Printf(\"This is a function!\\\
    n\")\n}\n\nfunc main() {\n\ttime.Sleep(100 * time.Millisecond)\n\tfmt.Printf(\"\
    Learning about Goroutines...\\n\")\n\tgo aFunction()\n\tgo func() {\nttime.Sleep(100\
    \ * time.Millisecond)\n\tfmt.Printf(\"This is an anonymous function!\\n\")\n}()\n\
    }\n```\n\nAbove this is the code of goRoutine that creates two simple goroutines,\
    \ one using an existing function and the other using an anonymous function\n\n\
    ```\n// go run goroutine\nLearning about Goroutines.\nThis is an anonymous function!\n\
    This is a function!\nExiting...\n```\n\nSo how do you know that the printed messages\
    \ come from different goroutines? The best way to understand that is by looking\
    \ at the order of the four messages are printed on your screen: see the delay\
    \ in aFunction(), the message of the anonymous function is printed first. This\
    \ verifies that the anonymous function and aFunction() run at the same time.\n\
    \n```\naChannelStrings := make(chan string)\n// You can send a statement to an\
    \ existing channel\naChannelStrings <- \"hello\"\n// You can read a single value\
    \ from a channel as follows:\nfor loop:\nvalueFromChannel := <-aChannelStrings\n\
    nYou should expect a number of values, you can use a loop for reading:\nfor reading\
    \ := range aChannelStrings\n\tfmt.Println(reading)\n```\n\nwww.linuxuxer.com 49"
