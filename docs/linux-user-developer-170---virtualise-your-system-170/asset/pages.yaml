    OpenSSH provides various tools that are helpful for backup over a network. They
    can be used for remote login and remote access to transfer files between machines
    you need to set up without encryption keys. This allows us to come with scripts
    that can be used without the need for any manual intervention.


    The third command for compression lzip works differently compared to gzip and
    zip. The important thing to note is that when we use lzip for compressing the
    contents of a file, it leaves the original file intact but creates a new file
    with a .lz extension. This is illustrated in the following:


    ```

    $ lzip -v myfiles

    ```


