  md: '# Feature Virtualise your system


    # BACK UP AND RESTORE


    Keep a backup of virtual machines is finding issues or to quickly reset


    A regular backup with virtual machines is finding that you don''t want, or something
    that has caused them to corrupt. To avoid this, it is a good idea to keep a backup
    copy of your VMs.


    The easiest way to do this is to make a complete copy of the virtual machine data
    files, but before the guest operating system has been shut down. In VirtualBox,
    you''ll need to select the virtual machine you want to archive, then click Virtual
    Media Manager, and select one of the virtual HDDs that can be duplicated using
    the Copy button.


    This gives you the opportunity not to lose data if you change the file type from
    VM to VHD for instance. By having a fail-back option on the VM you''re working
    with too cluttered, or failed


    # Backing up, importing and restoring virtual machines


    For a more flexible approach, that might be useful if you''re planning to import
    a virtual machine or restore a backup to run in VirtualBox, you should look at
    the Export Appliance


    Using File Export Appliance, and selecting the VM to export. Choose a file name,
    then a format. The default OVA 1.0 should be adequate for most virtual machines.
    Click Next – Exporting to Open Virtualization Format to import into any VirtualBox
    instance, whether on Linux, Mac or Windows


    Importing is just as straightforward. On the destination machine, select the Import
    Appliance, then browse to the OVA file. This might be on optical disk, network
    storage, or removable HDD. Here, simply follow the wizard to import, modifying
    the settings of the virtual machine


    For GEMU/KVM, a backup can be made in the command line using snapshots. This is
    a surprisingly simple command that saves all data as a single image that can be
    restored


    ```

    emu-snapshot -c [snapshot-name] [imagename]

    ```


    All you need to do is provide a name for the snapshot, and refer to the image
    name of the VM''s backup. To restore it, use:


    ```

    emu-snapshot -s [snapshot-name] [imagename]

    ...and this will restore the virtual machine to its previous state.

    ```


    By making a backup of the virtual hard disk, you have a fail-back option should
    the virtual machine you''re working with become too cluttered, or failed


    ![](img/c9de257c4e373c22707351f47f16002e_23_0.png)


    # Hard disk to copy


    Please select the virtual disk file that you would like to copy if it is not already
    selected. You can choose one from the list or use the folder icon to select one.


    VirtualDisk.vmd, 12.00 GB


    > Exporting your virtual machine means that you can run it on other devices or
    restored backups a system to its installation state


    # THE TIP OF THE ICEBERG


    What we''ve shown so far is just simple stuff when it comes to virtualisation
    in Linux. Whether you''re using VirtualBox, GEMU, KVM or any of the other platforms,
    virtualisation is available in many different ways, with many choices of operating
    systems to use.


    For instance, we''ve shown that the FARR devices such as the Raspberry Pi can
    be virtualized using GEMU. Configuration can be tricky, but it is possible, to
    install and run other operating systems on your Pi (though a lag of so will limit
    your possibilities.


    Additionally, you may want to run a virtual machine on a Mac X, and while it was
    previously limited to VMware or Parallels running on a Mac, with the right tools
    and keys you can also run a Linux of OS. To do this, you need to install some
    modern virtualisation software.


    Ultimately, virtualisation is an important element of modern corporate computing,
    and the internet, and these utilities can give you an insight into those worlds
    and beyond.


