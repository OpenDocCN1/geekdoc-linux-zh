    # Booting your virtual machine


    As your newly VM boots up, it will load the ISO and start installation of your
    chosen operating system. You might spend a few minutes going through the process
    in order to complete installation, but by the end of it you should be ready to
    boot up and choose your guest OS.


    So you''re done! Off and go with your shiny new virtual machine. Of course, not
    every operating system will happily install


    # Tweak the virtual machine


    KVM Virtual Manager provides a useful screen, across from a virtual tab, where
    you''ll find of options for the selected VM. This basically allows you to tweak
    the previously selected options, which is useful if you''re having difficulty
    installing a guest OS.


    You might, for example, increase the available memory to the guest, or the boot
    order. This screen can be accessed when the VM is running, while you might also
    monitor the performance of the virtual machine.


