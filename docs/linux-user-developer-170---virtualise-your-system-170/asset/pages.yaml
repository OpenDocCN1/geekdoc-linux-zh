    # # Back up your data securely


    Take a deeper look at some of the techniques that will help you back up data securely


    Back up typically refers to the process of copying and archiving data: the idea
    is to system a administrator to restore the data if there is a data loss event.
    You can consider backup as a simple form of insurance, but it should not be considered
    as reliable data recovery. The process of keeping all your data on local systems
    is in great danger. For example, if your local system can be damaged then you
    will lose your data. It is recommended to keep copy of your data on a machine
    located elsewhere. On Linux systems, data backed up using tape is done by first
    creating archive and then compressing files to backup and tape when writing that
    archive to a tape. As technology evolved, tape archiving has been replaced by
    techniques that can be used to back up data over the network.


    ![](img/c9de257c4e373c22707351f47f16002e_43_0.png)


    Swayam Prakasha


