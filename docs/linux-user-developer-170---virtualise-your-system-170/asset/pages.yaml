    You can find the code of this example in simple.go, which you can also see in\
    \ Figure 3. Executing the following code:\n\n```\n$ go run simple.go\nUsing Goroutines\
    \ Part 1\nThis is AF 1!\nThis is AF 2!\nExiting...\n```\n\nYou can see that the\
    \ messages from the two goroutines are printed in reverse order the goroutines\
    \ were created. You can also see the use of the defer keyword; in this case using\
    \ defer does not add to the reliability of the program but it would be useful\
    \ if your function had multiple return points.\n\nPlease note that the sync.Add\
    \ call must reflect the number of goroutines you want to wait for, which should\
    \ be equal to the total number of goroutines that you make a call to sync.\n\n\
    Calling sync.Done more times than the of sync.Add is not good but it will not\
    \ crash your program - it will make it finish without waiting for all goroutines\
    \ to finish their jobs.\n\nYou are also allowed to ignore the value of a channel,\
