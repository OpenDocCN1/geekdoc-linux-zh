    # AND THE WINNER IS...


    # 7zip


    File compression utilities aren''t the most exciting of tools you use on your
    desktop, but they''re incredibly useful when it come to moving and files.

    For Linux users, your two best options are to be between 7zip and WinZip. While
    both have merits, choose 7zip as our winner as its free version excels which WinZip
    offers for free.

    At core, 7zip is packed full of compression, archiving and extracting features
    that make it a complete product. Every item of which the compression process can
    be closely monitored, or if you like, you can let the program do all the work
    for you. It depends on your preference and knowledge, so some users can certainly
    make 7zip their go to program of this kind. While we shouldn''t forget concerned
    users, and 7zip does a good job at catering for them too. Supported formats are
    numerous, and the number of formats is bigger and the many formats available are
    really completely compatible.

    Going deeper into 7zip displays the better of the management systems out there.
    In particular, it''s the organisational features we especially, and they reveal
    many of the


    ![](img/c9de257c4e373c22707351f47f16002e_81_0.png)


    ![](img/c9de257c4e373c22707351f47f16002e_81_1.png)


    ![](img/c9de257c4e373c22707351f47f16002e_81_2.png)


    ![](img/c9de257c4e373c22707351f47f16002e_81_3.png)


    > Go into your directory when extracting files through 7zip


    fledged management systems available for download. We would say, however, that
    a few of the features get under the UI, which could do better in some areas. We''d
    expect some of these to be catered for in a later update, so keep an eye on


    the 7zip development page.

    If you''re on the hunt for a compression program that can offer a complete package
    without changing a fortune, it is hard to look past7zip. For Linux users, this
    is as good as it gets,


    +   - Oliver Hill'
