    to backup the data to a remote server. For each specific job, Using SSH tools
    like both ssh and scp you will be able to achieve the secure transfer of archive
    backups. Another popular method is to save time by backing up only files that
    have changed since the previous backup. Another way to backup files over a network
    is to use tools like rsync. You can also take a look at another command - rsync
    which works and enables you to make hourly hourly, daily, weekly or monthly snapshots
    of a file.


