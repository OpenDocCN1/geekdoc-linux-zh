    of nmap, you know that there are sorts of port-scanners that get the job done.
    Zmap only scans open ports. If you want to get sorts of port-scanners with better
    scalability, Masscan is what you need. First, make sure you have it installed
    on your GNU/Linux box and then clone Masscan from its repository:


    ```

    # git clone HYPERLINK https://github.com/robertvdiahagrah/masscan

    ```


    Install build dependencies before compiling:


    ```

    # apt-get install libpcap-dev

    ```


    Finally, compile it:


    ```

    # cd masscan

    # make

    ```


    Now let''s give it a try. You will perform the very scan as before, but by using
    Masscan instead of Zmap. Now you can grab banners lists using our TCP/IP stack,
    bypassing the one that has the switch. That means that you can connect to a remote
    server using any local port to reach Masscan. To solve this, use port 6666 and
    make sure your local TCP port is not blocked by incoming packets coming from this
    port of your firewall.


    ```

    # iptables -I INPUT 1 -p tcp --dport 6666 -j DROP

    ```


    Now, run the command to search for potential web servers in your network:


    ```

    # cd masscan

    # cd bin

    # masscan ...XXX.YYY.ZZ.0/24 --ports 80 --banners --source-port 6666

    ```


    After a short while, you will be presented with a list of banners listening on
    TCP 80 port along these:


    ```

    Banner on 80/tcp ...XXX.YYY.ZZ.129: [http

    ```


    > HTTP/1.1 403 Forbidden


    @Date: Sat, 06 Aug 2016

    07:14:27 GMT

    Server: Apache/2.2.6 (Debian)


    You can save the result to JSON for further processing if you like:


    ```

    # masscan ...XXX.YYY.ZZ.0/24 --ports 80 --banners

    --source-port 6666 --json

    ```


    Masscan allows you to quickly scan multiple ports on the same time as well. If
    you want to search for hosts in your network using TCP port 23 and TCP port 21
    (FTP), use Masscan like this:


    ```

    # masscan ...XXX.YYY.ZZ.0/24 --ports 21,23

    --source-port 6666 --json-results

    ```


    # Censys Database


    If you do not have time or infrastructure to perform large scans of your network,
    then surely use all the data that Censys provides to search for potential vulnerabilities
    in your hosts. It is a good idea to know what information is possible to get from
    Censys by using its engine directly with its web interface. For the next scenario,
    we will imagine looking for potential vulnerable Vsft 2.3.4.


    +   - Open your web browser of choice and navigate to https://censys.io/

    - Type this into the search query:

    - fptpd.port: 21 (vsftpd 2.3.4) and location_country: ES

    - Click the Search button.


    After a while, the results will show you a list of hosts, at the point of being-scanned,
    a Vsftp 2.3.4 server. Whether the hosts are still up or running the same Vamp
    version or not, cannot be confirmed. Each entry in the data has a time stamp that
    shows when that particular host was port scanned. Be mind that in this list, we
    only show hosts that are running a non-trojaned version of Vsftp 2.3.4.


    # Using Censys API


    Using web interface is all good and well, but you will need to search the queries
    in extent? Censys offers an API that can be used from different programming languages,
    such as Python. Use Python to access the API and create an account in Censys.
    Censys will give you a cryptographic token in Censys API Key that you will use
    in your scripts:


    +   - Open your web browser of choice and navigate to https://censys.io/register

    - Fill in the form

    - Go to API and key and its secret, go to "My Account" page,

    Your API Key and API secret will be under the "API Credentials" section'
