  md: '# Tutorial Concurrent programming


    # Learn concurrent programming in Go


    ![](img/c9de257c4e373c22707351f47f16002e_47_0.png)


    Mihalis Tsoukalos is a UNIX administrator, programmer (Go&S), and mathematician.
    He has been programming since 1993. You can find him at @mactsouk (Twitter) or
    mtsoukalos.eu


    # Resources


    A text editor such as Emacs or vi The Go compiler


    # Discover how to develop concurrent applications in Go


    Concurrent programming is a difficult area of computing that requires special
    care and precision. This tutorial will introduce Go''s unique approach to concurrency.
    Go uses goroutines and channels to support concurrency techniques. For example,
    in Go, when a program starts, its routine automatically calls the main function
    to begin the actual execution of the program.


    This will mostly talk about goroutines and concurrency. Go also supports the traditional
    and well-known concurrency model that shared memory.


    In the next tutorial we will talk more about concurrent programming in Go keep
    ready!


    # Standard Go packages related to concurrency


    The sync package contains functions that can help you synchronize goroutines.
    The most important functions of the sync package are Mutex and WaitGroup.


    The time package is not directly related to concurrency but contains functions
    that can be useful, including Sleep to pause a goroutine for a certain amount
    of time. However, using the Sleep function to pause a goroutine without having


    serious reason for doing so is highly discouraged and should be avoided.


    # About goroutines


    A goroutine is the minimum Go that can be executed concurrently - pay attention
    to the word goroutine, as they are much lighter than threads. However, processes
    can be autonomous and exist without their own thread. Goroutines cannot exist
    without a process, so in Go, to have a goroutine, you will need a process with
    at least one thread.


    You can define a new goroutine using the ''go'' keyword before a function call.
    This is simple syntax. The go keyword makes the function call immediately when
    the function runs.


    On the other hand, however, you cannot control or make any assumptions about how
    your goroutines are going to be executed, this is the job of the scheduler program.


    The goroutine program contains Go code that creates two goroutines, one using
    a function and one using an anonymous function. You can see the code of goroutine.go
    in file 1. Example, goroutine.go generates the following output:


