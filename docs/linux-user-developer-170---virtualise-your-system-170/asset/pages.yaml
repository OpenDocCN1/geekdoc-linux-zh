    )\n\tchan := make(chan int)\n\tusingGoChannel(chan)\n\tfor my := range chan {\n\
    \t\tfmt.Printf(\"%d\n```\n\nAcross this the code of simple.go where the use of\
    \ the sync package allows the main() function to wait for goroutines to finish\
    \ their jobs\n\nBefore exiting\n\n```\npackage main\n\nimport (\n\t\"fmt\"\n\t\
    \"sync\"\n)\n\nfunc main() {\n\tfmt.Println(\"Using Goroutines Part 1\")\n\tvar\
    \ wg sync.WaitGroup\n\twg.Add(2)\n\tgo func() {\n\t\twg.Done()\n\t\tfmt.Println(\"\
    This is 1!\")\n\t}()\n\tgo func() {\n\t\twg.Done()\n\t\tfmt.Println(\"This is\
    \ 2!\")\n\t}()n\twg.Wait()\n\tfmt.Println(\"Exiting...\")\n```\n\nAs you see,\
    \ which are really important in Go, please make sure that you understand them\
    \ well before continuing with the rest of the tutorial.\n\n# A simple example\n\
    \nIn the next example the main() will wait for all goroutines before finish, which\
    \ is what the behavior - will happen with the help of the sync package mentioned\
