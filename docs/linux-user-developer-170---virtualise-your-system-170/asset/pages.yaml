  md: '# The [Synology RT190ac] allows you to manage your internet and devices which
    use it in more detail


    better specs than rival Asus RT-AD6BU (which only has 200MHz dual-core), it is
    equal to the Netgear Nighthawk R7000, but fraction faster than the Linksys WRT1900ACS
    (it boasts 1.3GHz). Synology''s debut costs less than any of these, giving you
    better Wi-Fi for your buck.


    The router also has LAN ports and a WAN port which you will have to deal with
    for ADSL. It also has a USB 3.0 port so you can connect a printer to your network
    more easily, or plug in a 4 dongle. While you may not be used to your router''s
    interface being setup and troubleshooting, Synology Manager (SRM) might seem a
    bit of a change. To those used to NAS servers, if you haven''t used Synology software,
    this Linux-based interface is like a traditional desktop OS, complete with icons,
    search bars and a customizable wallpaper. It allows you to manage your internet
    and devices more easily, seeing how much bandwidth is consumed by individual apps
    and devices, as well as being able to set parental controls and two distinct guests,
    so visitors can temporarily connect to the internet without accessing your files.


    Perhaps the best of the OS is Package Centre, essentially an app store that allows
    you to download add-ons for Synology and other third parties, so you can further
    customise your router; for instance, turning it into a media centre or a VPN server.
    You will need to plug in an external hard drive or use of the SD card reader in
    order to store any of these extra-ons.


    We were very impressed with the SRM and think it has the potential to be revolutionary
    if third-party developers embrace it. We''re happy to report the RT1900 performed
    well in close range. Using the Ethernet cable, it ranked up an impressive 995Mbps
    and 535Mbps. The 2.4 GHz band clocked close to 150Mbps, which is still respectable.
    However, moving away, the 5 GHz band dropped to 217Mbps. Moving away (and through
    walls), it dropped significantly and at one point it dropped to around 5Mbps performance.
    However, you can also set the router to automatically switch between bands depending
    on your distance from the home. This is just another way to use software to improve
    your Wi-Fi experience.


    > Jack Parsons


    Pros

    Synology''s debut is better than its competitors, offers good overall performance,
    including easy management and an advanced controls system


    Cons

    You can use Linksys routers with better speed, faster download and more Wi-Fi
    range for only £30-£150


    Summary

    The RT1900ac''s tools are easy to deploy and different from others. It has features
    that you can learn to use quickly. We will continue to expand this list as we
    take an interest in creating add-ons. If you use it, it covers a large area, but
    you might think


