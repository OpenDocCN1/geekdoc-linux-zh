    +   04 Build an obstacle-avoiding behaviour

    * With a self-driving technology the one thing we don''t want to avoid a collision,
    whether it is with a priceless pet cat or a pair of spiders. The cheapest sensor
    for this purpose is the ultrasonic HC-SR04. The HC-SR04 has a trigger and echo
    pin; set the trigger to hit an object, then immediately start a counter until
    the echo pin goes low. This amount of time results in distance between 120cm and
    250cm.


    +   01 There is no failure, no feedback

    * As we begin to develop our robot we will need to navigate in an open, predictable
    environment like a kitchen floor can be a very tricky task. If we drive our robot
    from part three of the series on a thick carpet, grass we lose control in turning
    and speed. If we turn the motor at 100 rpm for 0.5 seconds then it will perform
    more at 360, whereas on grass it may barely move or on carpet it may turn out.


    +   02 Are you open to feedback?

    * During manual control we begin observing the robot''s performance and react
    by correcting it on the go. Without feedback we need an equal way to measure what
    is going on. By driving the motors at 70 rpm at all then on a flat surface we
    might be able to drive up a ramp. This kind of program contains an open-loop system,
    but in order to compensate for the need for feedback. When we have a direct feedback-mechanism
    this is called closed-loop.


    +   03 Pick your sensors

    * The common way of measuring how far and how quick a robot is moving through
    wheel or motor encoders. Each can be made as a simple paper disk attached to a
    motor connected to a shaft or a Hall effect magnetic sensor. By counting RPM and
    using the time required to move a distance we set contact with


