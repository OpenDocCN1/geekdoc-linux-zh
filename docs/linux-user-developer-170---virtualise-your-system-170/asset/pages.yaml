  md: '# Assessing the reaction


    The benefit of using a Raspberry Pi is that it''s considerably cheaper than some
    of the core components that could have been used in this experiment, the Pi is
    used to assess the rate and efficacy of the chemical reaction taking place


    # Semiconductor


    The titanium dioxide chemical is spin-coated onto a glass wafer which in turn
    is placed at the bottom of a beaker with a strong UV LED above it. The wafer acts
    as a semiconductor, so when the UV photons hit it, the electrons become mobile.


    ![](img/c9de257c4e373c22707351f47f16002e_65_0.png)


    # End goal


    In an ideal scenario, the Raspberry Pi will end up being a cost-effective way
    to help make the process of testing that little bit better. While we''re far away
    from this being used around the world, it''s a great start


    # Monitoring voltage


    As the solution passes through the system, the light passing through it is registered
    by a photodiode. The photodiode turns this light input into a voltage, which is
    read by the Raspberry Pi


    # Components list


    +   - Raspberry Pi

    - D.L.Y HAT

    - Photodiode

    - Multiple beakers

    - Expansion board with ADC and DAC chips

    - Wiring and tubing


    Right Colored liquids were used to simulate the chemical reaction with that brightness
    makes it easier to see the reaction take place

    Below Different setups of the experiment were used throughout with the Raspberry
    Pi being a cheap way to charge ions on the fly


    ![](img/c9de257c4e373c22707351f47f16002e_65_1.png)


    ![](img/c9de257c4e373c22707351f47f16002e_65_2.png)'
