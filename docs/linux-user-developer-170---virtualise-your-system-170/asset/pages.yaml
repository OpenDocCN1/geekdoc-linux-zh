  md: 'somehow missed your graphics card or your display during the setup process.
    Linux distros are supposed to auto-detect the hardware they come across and ''just
    work'', unlike Windows which usually requires third-party drivers, but sometimes
    they just... You don''t say that everything works fine in Windows under another
    recent distro, which suggests that it''s something going on with Debian that''s
    the problem. Fire it up and log in as root, then open the terminal and type


    ```

    $ sudo dpkg-reconfigure xserver-org

    ```


    This should open the Xorg configuration tool, Choose Hardware/Graphics Card and
    Monitor and you should be able to select the right model for each from This should
    hopefully make Debian realise that yes, you really do have a graphics card and
    monitor that are capable of displaying more than an old GeForce website, and you''d
    like to use them thank very much. If the problem persists then you may have to
    edit your Xorg config file


