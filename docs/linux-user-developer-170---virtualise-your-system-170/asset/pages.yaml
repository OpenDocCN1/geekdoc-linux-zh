  md: "# # Tutorial Concurrent programming\n\nRight pipelines. go code here illustrates\
    \ the use of pipelines using a text file\n\n![](img/c9de257c4e373c22707351f47f16002e_51_0.png)\n\
    \n```\npackage main\n\nimport (\n\t\"fmt\"\n\t\"io\"\n\t\"os\"\n\t\"path/filepath\"\
    \n)\n\nfunc ReadLine(filename string, out chan<- string) {\n\tfile, err := os.Open(filename)\n\
    \tif err != nil {\n\t\tfmt.Printf(\"error opening file: %v\\n\", err)\n\t\treturn\n\
    \t}\n\tdefer file.Close()\n\tscanner := bufio.NewScanner(file)\n\tfor scanner.Scan()\
    \ {\n\t\toutout <- scanner.Text()\n\t}\n}\n\nfunc FindLength(in <-chan string,\
    \ out chan<- int) {\n\tfor line := range in {\n\t\toutout <- len(line)\n\t}\n\
    }\n\nfunc CalculateAndPrintCounts(in <-chan int) {\n\tcounts := make(map[int]int)\n\
    \tfor length := range in {\n\t\tcounts[length]++\n\t}\n\t// Print the counts\n\
    \tfor i := 0; i < len(counts); i++ {\n\t\t..(\"%d: %d\\n\", i, counts[i])\n\t\
    }\n}\n\nfunc main() {\n\tfilename := \"input.txt\"\n\tlines := make(chan string)\n\
    \tlengths := make(chan int)\n\tgo ReadLine(filename, lines)\n\tgo FindLength(lines,\
    \ lengths)\n\tCalculateAndPrintCounts(lengths)\n}\n```\n\nThe output tells us\
    \ that there exist 28, 755 words with four letters, 237 words with three letters\
    \ and only one with 27 letters in the input file.\n\nNow that we have the Go,\
    \ it is easier to explain pipeline work. The main function is still the glue that\
    \ creates all required connections using Go channels. If you need flexibility\
    \ you can use channels as the building blocks of pipelines.\n\nThe program creates\
    \ two goroutines the readFile and findLength functions. The readFile function\
    \ takes the name of the file that it reads as its first argument and the channel\
    \ that will be passed to the findLength function as its second. The findLength\
    \ function returns a channel which will be input to the createHash function. All\
    \ three functions keep active as long as they have data to receive or get from.\
    \ The Go code shows how the two channels and the three functions are used inside\
    \ main:\n\n```\nlines := make(chan string)\nstringLength := make(chan int)\ngo\
    \ getFile(filename, lines)\ngo findLength(stringLength, lines)\ncreateHash(stringLength)\n\
    ```\n\nThe data from both lines and the string channels are not stored anywhere,\
    \ data travels from the readFile function to the findLength function and to the\
    \ createHash function.\n\nAs you can see the Go code is not particularly difficult\
    \ to know well what you are doing - it is very easy to get perplexed with the\
    \ channels of pipelines.\n\nAdding a stage shows how of the pipelines interact\
    \ with each other. You should understand this is a very powerful mechanism in\
    \ Go:\n\nThis image illustrates how the data flows through pipelines.go with the\
    \ help of the channels and functions of the program\n\n![](img/c9de257c4e373c22707351f47f16002e_51_1.png)\n\
    \n| lines | stringLength |\n| --- | --- |\n| readFile(...) | findLength(...) |\n\
    | Input | Output | createHist(...) |"
