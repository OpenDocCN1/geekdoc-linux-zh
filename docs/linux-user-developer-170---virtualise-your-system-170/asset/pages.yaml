    # The GOMAXPROCS environment variable in use


    The GOMAXPROCS environment variable (and function) allows you to limit the number
    of system threads that execute Go code simultaneously. You can find more about
    it at https://go.dev/pkg/runtime/


    Setting GOMAXPROCS allows you to take advantage of all cores available on your
    machine. Starting from Go 1.5 the default value of GOMAXPROCS should be the number
    of cores available on your system.


    ```

    # go run cores.go

    nGOMAXPROCS=1

    ```


    On a system with more cores, you are allowed to lower the value of GOMAXPROCS.


    In the tutorial in next issue, the effectiveness of the GOMAXPROCS environment
    variable will be benchmarked and so stay tuned!


    The lines of the output that calls to the ret (rt_signal) system show how to save
    race and how to concentrate on really what matters.


    The channel (2) shows all events on the channel - the process creating the goroutine
    is similar to for(2). However, although you are creating five goroutines, all
    of them are used. This is also a call to the text system that is used for user-space
    locking and provides a method for a program to avoid race conditions. The result
    is system calls with less interest and no overhead.


    The thing is that if you are going to create 160 goroutines, the current version
    of anotherExample.go will use two cores:


    ```

    # str / ./anotherExample 150 2<61 | grep

    2 8 212

    ```


    The main reason for this might be the value of the GOMAXPROCS environment variable
    or the use of an older version of Go.


