    We will now add driving capabilities through sensors and a feedback loop. We will
    start off by using open closed loops for control, then create simple obstacle-avoiding
    behaviour. Once our robot can avoid walls we will add a sensor to follow a light
    source such as a torch on the left or right side of the robot. The project is
    just starting to take shape, and the following program could be adapted into a
    line-following behaviour with the use of two infrared IRs.


