    your download works with QEMU and ISO files.


    # 06 Choose architecture


    You''re not limited to x86 architecture with QEMU. You can also emulate and run
    other architectures, such as ARM. This can be used to create a virtual Raspberry
    Pi (although is a bit of an issue if this uses software emulation rather than
    virtualization).


    To check what architectures are available:


    ```

    ls /usr/bin | grep qemu-system-*

    ```


    You''ll see the options are quite-ranging, with ARM, PowerPC - even Motorola 68000
    - listed as options. The virtualization of real platforms begins!


