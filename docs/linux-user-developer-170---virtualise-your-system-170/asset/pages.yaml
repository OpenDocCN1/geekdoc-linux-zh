    # Leverage Censys to find well-known vulnerabilities in your servers


    The Censys engine will help you find vulnerable hosts by avoiding the pain of
    mass-scanning the network


    Scanning your network in search of well-known tools is both noisy and time-consuming.
    Although there are tools that help you decrease the time it takes to scan an IPv4
    network space, such as Zmap and Masscan (covered in this tutorial), you should
    be aware of mass-available free services that provide internet-wide scanning,
    exposing your results to anyone who wants to use them. This is precisely why we
    use Censys (References).


    All of this has been gathered at some moment in time. Therefore, you can search
    for any hosts without actually performing a connection to them. This allows you
    to avoid being detected by the bad guys (like Black Hats). By using this database,
    you can find vulnerabilities from all around the world and execute an attack on
    them. It is not all doom and gloom, in this tutorial, you will learn how to use
    Censys to protect your systems.


    quicker than other port scanners, such as nmap. Let''s give it a try; install:


    ```

    # apt-get install zmap

    Now let''s imagine you want to search for servers on your network that are on
    TCP port 80:

    ```


    ```

    # zmap -iM -p 80 XXX.YYY.ZZZ.24 -o json

    ```


    The previous command will finish quickly, so if you want to store the results
    as an .json file for further processing, re-run the previous command in this way:


    ```

    # zmap -iM -p 80 XXX.YYY.ZZZ.24 -o http.json -o json

    ```


    Zmap, however, does not perform a scan of multiple ports at the same time as desired
    port. You have to run a scan for each of the actual hosts in order to get their
    banner (as some ports might be open) or use different tools in order to achieve
    this (such as Zgrab). This is precisely what Censys does on a massive: Zmap/Zgrab
