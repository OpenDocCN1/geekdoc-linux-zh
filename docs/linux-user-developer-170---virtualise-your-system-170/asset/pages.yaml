    # Visualising Go concurrency


    Ivan Danilo built a tool named GoTrace that can be used for visualizing Go programs.
    The tool uses WebGL and a web browser to display it.


    If you are interested in the installation process, the tool has great potential,
    and you should definitely try it out, especially if you are interested in visualizing
    Go concurrency.


    Figure 7 shows the Giteub page of the tool that Ivan Danilo created. It can be
    found at https://github.com/ivanililo/gotrace and you can find details about the
    installation process there.


    Talking more about GoTrace is beyond the scope of this tutorial! Go out and try
    it now!


    As in the Go tutorial lesson next, we are going to trace what happens behind the
    scenes - in our words, we are going to see how the concurrency is executed in
    the Go binary. The program that we will build is anotherExample.go


    Figure 8 shows the output of when executed in the following:


    ```

    # go buildExample.go

    # file anotherExample

    anotherExample: ELF 64-bit LSB executable, x86-64, version 1 (SYS), statically
    linked, not stripped


    # ./anotherExample 5 2<61 | grep -v rt_signal

