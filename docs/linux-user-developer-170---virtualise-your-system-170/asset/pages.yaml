  md: '# Virtualise your system


    # VIRTUALBOX RUN A NEW OS


    Discover how easy it is to install a new operating system in your virtual machine
    using VirtualBox.


    Getting started with virtualisation is simple. Once you have installed it via
    your package manager (or using distribution-appropriate instructions, which can
    be found at the VirtualBox website), download the installer and click the Next
    button to start. After installing (typically the OS you are planning to install),
    select the virtual machine type, by the version.


    VirtualBox provides a selection of operating systems across platforms. Click Next,
    to see how your VM should be configured. Follow the options and select what you
    prefer to make based on your own needs.


    In the next step, you''ll need to create a virtual hard disk (there are other
    options available, such as connecting a physical device). Your virtual disk type
    should depend on what VM you''re planning to use (options for performance). VirtualBox
    is easy to set up. With this, if the HDD doesn''t get allocated in the space,
    too much space on the OS host. The limit can be set in the next step.


    Once this is done, then you''ll be back in the Main VirtualBox. Here, you''ll
    need to select the source of the ISO image you want to install. You can add the
    device, in the Settings menu. Here, the ISO is mounted (virtually) as an IDE,
    SATA, SCSI, or USB drive.


    With this up, click Enter to start the virtual machine and install the OS. If
    all goes well, you''ll be prompted with the setup screen for the operating system
    CD, which might require additional steps until you''re ready to finish.


    To increase functionality, you might want to install the Guest Additions tools.
    This will provide a wide range of enhancements, optional extras to your virtual
    PC experience, and increase interaction between the guest and host.


