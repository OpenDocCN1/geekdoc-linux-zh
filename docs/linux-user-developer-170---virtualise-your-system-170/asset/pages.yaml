    # GROUP TEST


    # # File compression utilities


    Compression utilities are one of the best ways to make your files manageable,
    but which one is best for Linux users?


    # 7zip


    When it comes to entry level file compression, 7zip has long been heralded as
    one of the best around. It''s always the because well, without being intensive
    on your resources either. However, with infrequent updates, has any of its competition
    managed to usurp it??7zip.org


    # WinZip


    Archiving has been the core for WinZip for some time now, but doesn''t take away
    from its file compression features. There are some annoyances though, but with
    an ever growing base, do these issues take away from the program itself? www.rarlab.com


    # PeaZip


    PeaZip is one of the few compression utilities on the market that''s not only
    compatible with Linux, but is also completely open source. It benefits from working
    with others, which is some of the best programs on the market. www.peazip.org


    # Hamster


    File utilities tend to look that great, so you''ll be pleased to find Hamster
    does something a little different. On top of its quirky design, it boasts cross
    compatibility with many of the other utilities we''ve featured in this group.
    www.hamstersoft.com'
