  md: '# TOOLS FOR VIRTUALISATION


    Different virtualisation tools are available for Linux, depending on what OS you
    want to run


    # VirtualBox


    USEFUL: Versatile VirtualBox is capable of both software-ware and hardware-assisted
    virtualisation, making it the best all-around choice


    If you''ve had luck, the chances are that you used VirtualBox. It''s free, open
    and available for all major operating systems, Linux.


    With VirtualBox, you can easily run another operating system, or even multiple
    Windows, to run software that doesn''t perform well with Wine.


    VirtualBox does this by creating a virtual environment where your system is ready
    for virtualisation. Meanwhile, VMs are stored as disk images, making it easy to
    back up and migrate to other PCs or virtual machine applications.


    # QEMU


    USEFULfor running an ARM device on a computer with x86 or x64 - that''s what we
    call it!


    The aim of QEMU (Quick Emulator) is portability and hardware emulation, and in
    a world where VirtualBox is the lead, it has a huge advantage in emulation.


    A popular use for virtualising the Raspberry Pi (along with other operating systems,
    but it can also be used to emulate Android on an-x86 PC)


    Like VirtualBox, setting up a VM with QEMU is straightforward, and guest OS can
    be detected by QEMU built.


    # KVM


    USEFULfor running VMs that VirtualBox and QEMU cannot without hardware acceleration
    - if you need power, then use this!


    From the kernel project, KVM (Kernel-based Virtual Machine) is also capable of
    working in conjunction with QEMU to provide virtualisation, as well as being capable
    as a standalone. The benefit of KVM over others is performance, not to mention
    better stability with a number of guest operating systems.


    The problem with this, however, is that KVM is a bit trickier to set up. Once
    you''ve got it working around para-virtual drivers (which the guest OS gets direct
    access to the hardware), you will see why KVM is powerful with VM powers.


    # TOP 5 DISTROS


    # LINUX MINT


    If you haven''t already tried Linux Mint (it tends to be unfriendly with certain
    hardware) then installing it VM is a great idea, as the desktop doesn''t need
    3D acceleration. This makes it not just for hardware virtualisation but for lower-spec
    systems with this feature as well.


    ![](img/c9de257c4e373c22707351f47f16002e_18_0.png)


    # LUBUNTU


    This lightweight version of Ubuntu is ideal for running on virtual machines. Its
    modest footprint means resources that you can get out of it, giving you an idea
    of how it might run on an older PC or when installed as an operating system.


    # SLACKWARE


    Yet to sample the lightweight, simple Slackware Ideal for advanced Linux users
    (largely due to its closeness to Unix), Slackware runs effortlessly with all many
    applications, giving you the chance to find their straightforward command with
    line installation. A VM gives you the opportunity to try it out!


    # FEDORA


    One of the most popular distros, Fedora uses many of the latest tools; if you''re
    used to Ubuntu and want to find Fedora in a VM, you''ll find a few things to struggle
    with. Performance can be obtained by switching the desktop environment.


