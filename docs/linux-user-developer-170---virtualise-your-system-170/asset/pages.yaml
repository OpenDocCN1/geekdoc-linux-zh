  md: '# Tutorial


    # # Try some evening photography with the Raspberry Pi’s Pi NoLR camera!


    Install the NoLR camera to enjoy some improved light photographs and videos from
    your Raspberry Pi


    ![](img/c9de257c4e373c22707351f47f16002e_69_0.png)


    Christian Gawley

    I''m a former IT and software engineer and since 2010 have provided advice and
    inspiration to computer and mobile users online and in print. I cover the Raspberry
    Pi as well as Linux at makeuseof.com.


    ![](img/c9de257c4e373c22707351f47f16002e_69_1.png)


    | | | |

    |---|---||

    | GAO | E351714 | AWM |

    | GAO | E351714 | AWM |

    | GAO | E351714 | AWM |

    | GAO | E351714 | AWM |

    | GAO | E351714 | AWM |


    # ## What you will need


    +   - Raspberry Pi NoLR camera V2

    - Element14.com

    - Raspberry case with mount or slot for camera module

    - Portable power supply


    Want to get more out of Raspberry Pi photography? You may have already connected
    a webcam or the official camera module, but found that certain activities—particularly
    showing in light—have been unsuccessful. The Raspberry Pi Board has no mount.


    # ## 03 Mount your camera module


    If your Raspberry Pi has a mounting module, it will almost certainly have four
    poles onto which the NoLR can be mounted.


    Simply line the camera, lenses the accuracy-sized hole, and press the module to
    attach to it.


    # Use the blue gel!


    Should you find that the glue doesn''t look right, use the blue gel. It is the
    same size as the module, and can be placed in front of a small blue tint to tint
    your photos. Of course, this small piece of filter can produce striking results!


    # ## 01 Check your contents


    When you receive your two items in the Raspberry Pi NoLR camera module itself
    should be ready to use, with its four mounting holes, on each of the PCB. Also
    look out for the blue gel, a small square color.


    # ## 02 Connect the NoLR module


    Taking anti-static precautions, connect the NoLR camera to the Raspberry Pi using
    the ribbon cable, which connects to the connector with the silver side facing
    the nearby HDMI port.


    Don''t forget to lift the cap before inserting, and to press down (without excessive
    pressure) to secure it.


    ![](img/c9de257c4e373c22707351f47f16002e_69_2.png)


    | | |

    |---||

    | 1 Change User | Change the name of the pi user

    | 2 Change Password | Change the password of the pi user

    | 3 Change WiFi | Set up your wireless network with your SSID and password

    | 4 Internationalization | Set your timezone and language

    | 5 Update | Run apt package list and restart

    | 6 Remove unused | Remove unnecessary software packages for Pi


    ![](img/c9de257c4e373c22707351f47f16002e_69_3.png)


    After setting Enabling Camera, exit raspi-config—you''ll be prompted to


    # ## 04 Update your Pi


    With the camera module attached, it''s time to boot your Raspberry Pi and run
    the updates.


    ```

    sudo apt update

    sudo apt-upgrade

    ```


    This will ensure that your software is installed. correctly'
