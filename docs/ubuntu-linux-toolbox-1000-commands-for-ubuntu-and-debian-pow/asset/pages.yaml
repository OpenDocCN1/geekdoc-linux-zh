    ```


    Using keys with passphrase is more secure than simple passwords, but also more
    cumbersome. To make your life easier, you can use ssh-agent to store unlocked
    keys for the duration of your session. When you add a key to your running ssh-agent,
    you can run ssh using the key without being prompted for passphrase each time.


