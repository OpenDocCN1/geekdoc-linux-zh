    # # Sharing Remote Directories


    Tools described to this point in the chapter provide atomic file access, where
    a connection is set up and files are transferred in one shot. In times more persistent,
    ongoing access to a remote directory of files is needed, services for sharing
    and mounting remote file systems can be most useful. Such services include Network
    File System (NFS), Samba, and SSHFS.


    # # Sharing Remote Directories with NFS


    Assuming a server is already running the NFS service (part of the nfs-kernel-server
    package), you can use exportfs and showmount commands to see available and mounted
    directories. Mounting a shared directory is done with special options to the standard
    mount command. If you install the nfs-kernel-server package, Ubuntu will start
    the NFS service.


    # # Viewing and Exporting NFS Shares


    Run from the NFS server, the exportfs command shows all shared directories from
    that server:


    ```

    $ sudo /usr/bin/exportfs -v

    /myshare client.example.com(ro,wdelay,root_squash,no_subtree_check)

    /mnt/public <world>(rw,wdelay,root_squash,no_subtree_check)

    ```


    The two directories being shared are /export/myshare and /mnt/public. The first
    is only available to host client.example.com, whereas the second is available
    to everyone. Options for each share are shown in parenthesis. The first share
    is read-only (ro), while writes to the share are delayed to improve performance
    when more writes are expected (wdelay), and requests from the root user on the
    client are mapped into the anonymous UID (root_squash). Also, a less thorough
    check of file system permission is done (no_subtree_check). The second share allows
    read-write mounting (rw).


    Add and modify shared directories by making changes to the /etc/exports file.
    To get changes to effect, type any of the following as your root:


    ```

    $ sudo /etc/init.d/nfs-kernel-server Reload exported shared directories

    ```'
