    # Sharing Remote Directories with Samba


    Samba is the open source implementation of the Windows file and sharing protocol
    originally known as *Server Message Block (SMB)* and now called *Common Internet
    File System (CIFS)*. There is an implementation of Samba in Linux, as well as
    in many other operating systems. To use samba, install the packages samba and
    samba-doc.


    Graphical tools for sharing, querying, and mounting SMB directories from Windows
    include the Samba web-based administration tool. To use the SWAT tool in Linux,
    install the swat package. Next, read the instructions at `https://help.ubuntu.com/community/swat`
    for details on how you can start SWAT.


    Commands for working with Samba shares can be used to query SMB servers, mount
    directories, and share directories.


    # Viewing and Accessing Samba Shares


    To scan your network for SMB hosts, type the following:


    ```

    $ findsmb


