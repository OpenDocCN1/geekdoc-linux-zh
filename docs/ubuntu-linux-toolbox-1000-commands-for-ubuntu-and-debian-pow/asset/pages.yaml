  md: '# Chapter 12: Accessing Network Resources


    **WARNING!** The fourth example should be avoided in real life. Passwords that
    are entered in a command line end stored in clear text in ~/.bash_history. They
    may also be visible to other users in the process ps auxw.


    When a connection is established to an FTP server, you can use a set of commands
    during the FTP session. FTP commands are similar to shell commands. Just like
    in a bash shell, you can press Tab to autocomplete file names. In a session, lftp
    also supports sending multiple jobs to the background (Ctrl+z) and returning them
    to foreground (wait or fg). These are useful if you want to continue traversing
    the FTP site while files are downloading or uploading. Background jobs run in
    parallel. Type jobs to see a list of background jobs. Type help to see a list
    of lftp commands.


    The following lftp session illustrates useful commands when downloading:


    ```

    $ lftp mirrors.kernel.org > pwd

    lftp mirrors.kernel.org> Check directory

    ftp://mirrors.kernel.org

    lftp mirrors.kernel.org> ls List current directory

    drwxr-xr-x 8 400 4096 Jul 02 20:19 debian/

    drwxr-xr-x 7 537 5537 May 27 21:37 fedora/


    lftp mirrors.kernel.org----> cd fedora/releases/7/Live/i386 Change directory

    lftp mirrors.kernel.org....> get Fedora-7-live-i386.iso Download a file

    Fedora-7-Live-i386.iso eta 77369 167.2K/s 26m (Receiving data)

    lftp mirrors.kernel.org....> Ctrl+z Send to background

    lftp mirrors.kernel.org....> mget /edu/* Get all in /edu

    lftp mirrors.kernel.org....> !ls Run local ls

    lftp mirrors.kernel.org....:>> bookmark Add Live Bookmark location

    lftp mirrors.kernel.org....>...> quit Close FTP

    ```


    This session logs as the anonymous user at mirrors.kernel.org. After changing
    to the directory containing the ISO image I was looking for, I downloaded it using
    the get command. By typing Ctrl+z the download could continue while I did other
    activities. The mget command (which allows wildcards as *) downloaded all files
    from the /edu directory.


    Any command preceded by an exclamation mark (such as !ls) is executed by the local
    shell. The bookmark command saves the current location (in this case, ftp://mirrors.kernel/fedora/releases/7/Live)
    under the name Live next time I can run lftp to return to the location. The quit
    command ends the session.


    There are some useful commands for an authenticated lftp session. This assumes
    you have the necessary permissions on the server:


    ```

    $ lftp chris@example.com

    Password: ********

    lftp example.com:-> lcd /home/chris/songs Change to a local directory

    lftp example.com:-> cd pub/uploads Change to server directory

    lftp example.com:-> mkdir things Create directory on server

    ```'
