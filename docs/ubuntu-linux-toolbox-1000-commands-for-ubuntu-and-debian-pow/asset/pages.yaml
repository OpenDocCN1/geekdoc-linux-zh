  md: '# Chapter 10: Managing the System


    To manage services, you can use the chkconfig and service commands. For example,
    to start the NTP service immediately, you could type this:


    ```

    $ sudo /etc/init.d/ntp start      Start Samba service immediately

    Starting NTP server ntpd             [ OK ]

    ```


    Each service is managed with a shell script in the /etc/init.d directory. You
    can pass start or stop options to each service. The format is:


    ```

    $ sudo /etc/init.d/service_to_control start

    $ sudo /etc/init.d/service_to_control stop

    ```


    Most of the scripts in the /etc/init.d directory support start and stop options,
    while some support other features as well. Here''s how to use service to start
    and stop services:


    ```

    $ /etc/init.d/ntp                      Show usage statement (with no options)

    Usage: /etc/init.d/ntp [start|stop|restart|try-force|force-reload] status

    $ /etc/init.d/ntp restart               Restart NTP service (first off, then on)

    * Stopping server ntpd                   [ OK ]

    * Starting server ntpd                 [ OK ]

    $ /etc/init.d/ntp try-restart          Restart NTP service (if already running)

    * Stopping server ntpd                   [ OK ]

    * Starting server ntpd                 [ OK ] (Wait, no, the line is Starting
    server ntpd)

    * Starting server ntpd                 [ OK ]

    $ /etc/init.d/ntp force-reload         Reload settings in config file

    * Stopping server ntpd                   [ OK ]

    * Starting server ntpd                 [ OK ]

    $ /etc/init.d/ntp status               Check if the NTP service is running (smbd)

    * NTP service is running

    $ /etc/init.d/ntp stop                  Stop NTP service

    * Stopping server ntpd                   [ OK ]

    ```


    Any of the init scripts contained in /etc/init.d can be started in this way, but
    not all scripts support all the features just. Most init scripts, however, will
    show their usage with no option (as shown in the first example).


    Although the previous command runs the service immediately, to have a service
    start automatically at boot time or during a run level change, you can use the
    update-rc.d command. In addition, most installation scripts for services will
    automatically turn a service on the next time boot. With update-rc.d, you can
    turn services off, or turn them on a per-run basis. Here are examples:


    ```

    $ sudo update-rc.d ntp defaults      Turn on the NTP service

    ```


    NOTE The documentation for the update-rc.d command recommends using this command
    to manage the run levels of your system. See the online page for the update-rc.d
    command for details.


    Although you can use the init command to change to any run level, including init
    0 (shut down) and init 6 (reboot), there are specific commands for stopping Linux.


    204'
  merge: -1
