  md: '# 11


    # # Managing Network Connections


    Connecting to a network from Linux is often as easy as attaching your computer’s
    network interface card to your ISP’s hardware (such as a DSL or cable modem) and
    rebooting. However, if your network interface doesn''t come up or requires some
    manual setup, there are many commands available for configuring network interfaces,
    checking network connections, and setting up special routing.


    This chapter covers many useful commands for configuring and working with your
    network interface cards (NICs), such as `ethtool`, `ifconfig`, and `mip`. More
    specifically, it covers ways of configuring wired Ethernet, wireless Ethernet,
    and modem network hardware. With your hardware connected and network interfaces
    in place, the chapter describes commands such as `netstat`, `dig`, `ip`, and `ping`
    for getting information about your network.


    # # Configuring Networks from the GUI


    When you first install Ubuntu, the installer lets you configure any wired Ethernet
    cards attached to your computer, with the use of a DHCP server detected on your
    network. Alternatively, you can set a static IP address, along with your hostname
    and IP addresses for your gateway machine and name servers. After installation,
    there are also graphical tools for configuring your network interfaces.


    # IN THIS CHAPTER


    +   * Using ethtool and mittool to work with network interface cards


    +   * Getting network statistics with netstat


    +   * Starting network devices with service, ifconfig, ifup, and ifdown


    +   * Viewing Ethernet information with ifconfig and ip


    +   * Managing wireless cards with iwconfig


    +   * Configuring modem with wdialconf, stty, and minicom


    +   * Checking DNS name resolution with dig, host, and hostname


    +   * Checking connectivity with ping and arp


    +   * Tracing connections with traceroute, route, and ip


    +   * Watching the network with netstat, tcpdump, and nmap'
  merge: -1
  pgno: 239
