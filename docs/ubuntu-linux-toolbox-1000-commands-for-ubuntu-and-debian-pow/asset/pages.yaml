    # Creating Backup Images with mkisofs


    Most data CDs and DVDs can be accessed on both Windows and Linux systems because
    they are created using the ISO9660 standard for formatting the information on
    those discs. Most modern operating systems need to save more information about
    files and directories than the basic ISO9660 standard includes, extensions to
    standard were added to contain that information.


    Using the mkisofs command, you can back up the file and directory structure from
    any point in your Linux file system and produce an ISO9660 image. That image can
    include the following kinds of extensions:


    +   - System Sharing Protocol (SUSP) are records identified in the Rock Ridge
    Interchange Protocol. SUSP records include Unix-style attributes, such as ownership,
    long name, and special files (such as character devices and symbolic links).


    +   - Joliet directory records store longer file names in a format that makes
    them usable to Windows systems.


    +   - Hierarchical File System (HFS) extensions allow the ISO image to appear
    as an HFS system, which is the native file system for Macintosh computers. Likewise,
    Data and Resource forks can be added in different ways, the most obvious of which
    is to read by Macs.


    When you set out to create your ISO image, consider where you will ultimately
    need to access the files you back up using mkisofs (Linux, Windows, or Macs).
    Once the image is created, it can be used in different ways, the most obvious
    of which is to burn the image to a CD or DVD.


    Being useful in producing all or portions of a file system to use on a portable
    medium, mkisofs is also useful for creating CDs/DVDs. It does this by adding boot
    information to the image that can launch a Linux kernel or other operating system,
    booting the computer''s hard drive.


    > NOTE Although you still use the mkisofs command in Ubuntu, mkisofs is now a
    pointer to genisoimage. The genisoimage command was derived from mkisofs, which
    was part of the cdrtools package (see http://cdrecord.berlios.de). Development
    of genisoimage is part of the cdrkit project (www.cdrkit.org).


    Because Linux users store their personal files in their home directories, a common
    way to use mkisofs to back up files is to back up everything under the /home


