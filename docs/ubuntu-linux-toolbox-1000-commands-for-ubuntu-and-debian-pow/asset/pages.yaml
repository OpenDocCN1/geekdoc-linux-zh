  md: "# Chapter 5: Manipulating Text\n\nIn the first line shown, a dash (-) is used\
    \ as the delimiter. In the second case, the letter D is the delimiter.\n\nThe\
    \ sed command can run multiple substitutions at once, preceding each one with\
    \ -e. In the text streaming from myfile.txt, all occurrences of francois are changed\
    \ to FRANCOIS and occurrences of chris are changed to CHRIS:\n\n```\n$ sed -e\
    \ s/francois/FRANCOIS/g -e s/chris/CHRIS/g < myfile.txt\n```\n\nYou can use sed\
    \ to add newline characters to a stream of text. Where Enter appears, press the\
    \ Enter key. The > on the second line is generated by bash, not typed in.\n\n\
    ```\n$ echo aaaccc | sed 's/b\\\\/Enter\\n /'\n```\n\nThe trick just shown does\
    \ not work on the left side of the sed substitution command. When you need to\
