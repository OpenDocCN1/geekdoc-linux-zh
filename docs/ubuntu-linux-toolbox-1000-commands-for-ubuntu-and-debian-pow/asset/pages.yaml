  md: '# Chapter 11: Managing Network Connections


    The Network Configuration window (select System Network from the GNOME desktop)
    offers a GUI for configuring your network interface, network DNS servers, host
    list, and enables virtual private networks. You can configure both (DHCP, bootp)
    and static IP addresses. You can set up static network routes.


    In some cases, your network interfaces may not be working. Likewise, there may
    be ways you want to work with your network interfaces that are not supported from
    the GUI. For those cases, the following sections describe how to work with your
    network interfaces from the command line.


    # Managing Network Interface Cards


    If the network hardware on your computer didn''t immediately come up and let you
    connect to the Internet, there are some steps you follow to troubleshoot the problem:


    +   - Verify that your network interface card (NIC) is properly installed and
    that the cable is connected to your network (ISP''s CPE, switch, and so on).

    - After the cable is connected, make sure you have a link with no speed or duplex
    mismatches.

    - If all else fails, consider replacing your NIC with known-good spare to isolate
    a hardware failure.


    To check your link from Linux, and to set speed and duplex, there are two commands
    you can use: the older mi-tool (net-tools package) and the newer ethtool (ethtool
    package). Use ethtool when you have a very old NIC and NIC driver that is not
    compatible with the ethtool command.


    To view the syntax of the ethtool command, type the following:


    ```

    $ ethtool -h | less View options to the ethtool command

    ```


    The ethtool command outputs its built-in help to stderr. You will be able to page
    through that help with less, we redirect to stdout.


    To display settings for a specific Ethernet card, add the interface name to the
    command. For example, view card information for eth0:


    ```

    $ sudo ethtool eth0 See settings for NIC at eth0

    ```


    Settings for eth0:

    Supported ports: [ TP M ]

    Supported link modes: 100baseT/Half 100baseT/Full

    100baseT/Half 100baseT/Full

    Supports auto-negotiation: Yes

    Advertised link modes: 100baseT/Half 100baseT/Full

    100baseT/Half 100baseT/Full'
