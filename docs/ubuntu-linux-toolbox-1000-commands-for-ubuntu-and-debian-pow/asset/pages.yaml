  md: '# Chapter 9: Checking and Managing Running Processes


    The SIGKILL (9) signal, used generously by trigger-novice administrators, should
    be regarded as last resort. This does not allow the target process to cleanly
    but forces it to end abruptly. The SIGHUP signal was originally used on Unix systems
    to indicate that a terminal was being disconnected from a mainframe (such as from
    a hang-up of a dial-in modem). However, daemon processes, such as sendmail and
    httpd, were implemented to catch SIGHUP signals as an indication that those processes
    should reread configuration files.


    # Running Processes Away from the Current Shell


    If you want a process to continue running, even if you disconnect from the current
    shell session, there are several ways to go about doing that. You can use the
    nohup command to run a process in a way that is impervious to a hang-up signal:


    ```

    $ nohup updatedb &\   Run updatedb with no ability to interrupt

    # nopice -9 gcc hello.c &   Run gcc uninterrupted and higher priority

    ```


    Using nohup is different than running the command with an ampersand and with nohup
    the command will keep running, even if you exit the shell that launched the command.


    The nohup command was commonly used in days of slow processes and dial-up connections
    (so you didn''t have to stay logged in to an expensive connection while a long
    time complete). Also, today using tools such as screen (described in Chapter 14)
    you can keep a shell session active, even after you disconnect your network connection
    to shell.


    # Scheduling Processes to Run


    Commands associated with the cron facility can be used to set a command to run
    at a specific time (including now) so that it is not connected to the current
    shell. The command runs at the time you set:


    ```

    $ at now +1 min   Start command running in one minute

    at@ updatedb

    at@ <Ctrl+d> <EOT>

    job 5 at Mon Aug 20 20:37:00 2007

    $ at teatimeStart command at 4pm today

    $ at now +5 days   Start command in five days

    $ at 06/25/08      Start command at current time on June 25, 2008

    ```


    Another way to run a command that''s not connected with the current shell is with
    the batch command. With batch, you can set a command to start as soon as the processor
    is ready (load average below .8):


    ```

    $ batch   Start command running immediately

    at@ find /mnt/isos  | grep jpg$ > /tmp/mypics

    at@ <Ctrl+d> <EOT>

    ```


