    # Using Other Commands to Find Files


    Other commands for finding files include the whichis and which commands. There
    are some examples of these commands:


    ```

    $ whichis man

    man: /usr/bin/man /usr/X11R6/bin/man /usr/bin/X11/man /usr/local/man

    usr/share/man /usr/share/man/man1.gz /usr/share/man/man7.gz

    $ ls ls

    /bin/ls

    ```


    The which command is useful because it not only finds commands, it also finds
    pages and configuration files associated with a command. For the example of which
    for the word man, you can see the executable, its configuration file, and the
    location of man pages for the man command. The which example shows where the ls
    executable is (/bin/ls). The which command is useful when you''re looking for
    the actual location of an executable file in your PATH, in this example:


    ```

    $ dpkg-query -S which ps

    procs: /bin/ps

    ```


    # Finding More About Files


    Now that you know how to find files, you can get more information about those
    files. Using less-common options to the ls command lets you list information about
    a file that you won''t see when using ls without options. Commands as file help
    identify a file''s type. With md5sum and shalum, you can verify the validity of
    a file.


    # Listing Files


    Although you are quite familiar with the ls, you may not be familiar with many
    of the useful options for ls that can help you find out about the files on your
    system. Here are some examples of using ls to display long lists (-l) of files
    and directories:


    ```

    $ ls -l      Files and directories in current directory

    $ ls -la     Files/directories beginning with dot (.)

    $ ls -lt     Orders by time recently changed

    $ ls -lu     Orders by time recently accessed

    $ ls -is      Orders by size

    $ ls -li     List the inode associated with each file

    $ ls -ln     List numeric user/group IDs, instead of name

    $ ls -lh     List file sizes in human-readable format (K, M, etc.)

    $ ls -R      List files recursively, from current directory and subdirectories

    ```'
