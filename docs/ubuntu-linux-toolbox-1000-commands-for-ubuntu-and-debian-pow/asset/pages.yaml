    # Accessing SSH on a Different Port


    For security purposes, a remote host may have its SSH service listening a different
    port than the default port 22. If that case, use the -option to ssh to contact
    that service:


    ```

    $ ssh -p 12345 francois@turbosphere.com Connect to ssh on port 12345

