    # Using Wireless Connections


    Setting up wireless connections in Linux has been tricky in the past, primarily
    due to the fact that open source drivers have not been available for the vast
    majority of wireless cards on the market. Most recent releases of Ubuntu have
    shown a marked improvement.


    Wireless configuration is an area where we would suggest using the GUI tools (in
    particular, the Network Configuration described earlier in this chapter, or Network
    Manager) to do basic configuration. You may need to add wireless tools packages
    to get this to work, such as wireless-tools and bcm43xx-fwcutter packages, which
    are available from the Ubuntu repositories. Likewise, you may need firmware that
    is available in the following packages: ipw2100-source, ipw2200-firmware, and
    zd12111-firmware packages.


    If you are not able to configure your wireless card using the Network Configuration
    window, you might be able to get your wireless card working using drivers and
    tools from Atheros (www.atheros.com), the MadWifi (www.madwifi.org) project, or
    the Ndiswrapper project (ndiswrapper.sourceforge.net). Many packages of software
    from these projects are available from the standard Ubuntu repositories, described
    in Chapter 2.


    If you need help determining exactly which wireless card you have, type the following:


    ```

    $lspci | grep -i wireless Search for wireless PCI cards

    01:09.0 Network controller: Broadcom Corporation BCM4306 802.11b/g

    Wireless LAN Controller (rev 03)

    ```'
