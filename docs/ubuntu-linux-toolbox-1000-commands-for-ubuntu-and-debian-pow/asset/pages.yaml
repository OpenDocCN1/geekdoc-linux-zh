  md: "# Chapter 11: Managing Network Connections\n\nTo turn off auto-negotiation\
    \ and hard-set the speed to 10 Mbps, half-duplex, type this:\n\n```\n$ sudo ethtool\
    \ -s eth0 10 duplex half autoneg Change NIC settings\n```\n\nThe changes you made\
    \ to your NIC settings are good for the current session. When you reboot, those\
    \ settings will be lost. To make these settings stick at the next reboot or network\
    \ restart, you need to create a new script to execute at boot time. The following\
    \ steps how to do this.\n\n+   1. Choose a name for your new script, such as eth_options,\
    \ and then create the script in the /etc/init.d directory:\n\n```\n$ vi /etc/init.d/eth_options\n\
    ```\n\n+   2. Insert the following text into this new script:\n\n```\n#!/bin/sh\n\
    ETHTOOL=\"/usr/sbin/ethtool\"\nETHTOOL_OPTS=\"speed 10 duplex half autoneg\"\n\
    DEV=\"eth0\"\ncase \"$1\" in\nstart)\n  echo -n \"Setting $DEV options $ETHTOOL_OPTS...\"\
    \n  ETHTOOL -s $DEV $ETHTOOL_OPTS;\n  echo \" done.\";\nstop)\nnesac\nexit 0\n\
    ```\n\n+   3. The specific settings you desire should be placed into the variable\
    \ ETHTOOL_OPTS. For example:\n\n```\nETHTOOL_OPTS=\"speed 10 duplex half autoneg\
    \ off\"\n```\n\nYou can also change the DEV variable, which points to the first\
    \ interface, eth0.\n\n+   4. Next, you need to set up the script as an executable\
    \ file:\n$ chmod +x /etc/init.d/eth_options\n\n+   5. Then, set up the symbolic\
    \ links to run your new script under the different run levels:\n$ update-rc -d\
    \ eth_options\nAdding startup script for /etc/init.d/eth_options ...\n/etc/rc.0/K20eth_options\
    \ -> ../init.d/eth_options\n/etc/rc.1/K20eth_options -> ../init.d/eth_options\n\
    /etc/rc.6/K20eth_options -> ../init.d/eth_options\n/etc/rc.2/S20eth_options ->\
    \ ../init.d/eth_options\n/etc/rc.3/S20eth_options -> ../init.d/eth_options\n/etc/rc.4/S20eth_options\
    \ -> ../init.d/eth_options\n/etc/rc.5/S20eth_options -> ../init.d/eth_options"
