  md: 'can format text into pages with header information such as date, time, file
    name, and page number. Here is an example:


    ```

    $ dpkg-query -l | sort | pr --column=2 | less Paginate package list in 2 cols

    ```


    In this example, the rpm -qa lists all packages installed on your system and pipes
    that list to the sort command, to be sorted alphabetically. Next that list is
    piped to the pr command, which converts the single-column list into two columns
    (--columns=2) and paginates it. Finally, the less command enables you to page
    through the text.


    Instead of paging through the output, you can send the output to a file or to
    a printer. Here are examples of:


    ```

    $ dpkg-query -1 | sort | pr --column=2 | pg.txt Send pr output to a file

    $ dpkg-query -1 | sort | pr --column=2 | lpr Send pr output to printer

    ```


    Other manipulation you can do with the pr command includes double-spacing the
    text (-d), showing control characters (-), or offsetting a text number of spaces
    from the left margin (for example, -o 5 to indent five spaces from the left).


    # Searching for Text with grep


    The grep command comes in when you need to perform more advanced string searches
    in a file. In fact, the phrase to grep has actually entered the computer jargon
    as a verb, just as Google has entered the popular language. Here are examples
    of the grep command:


    ```

    $ grep francois myfile.txt Show lines containing francois

    # grep 404 /var/log/httpd/access_log Show lines containing 404

    $ ps auxw | grep int Show init lines from ps output

    $ ps auxw | grep "\*" Show bracketed commands

    $ dmesg grep "[ata]\ata" Show ata device information

    ```


    These command lines are used for various purposes, being examples of the grep
    command. By searching access_log for 404 you can query your web server for pages
    that were not found (which could be someone to exploit your system, or a web page
    you moved or forgot to create). Displaying bracketed commands that are output
    from the ps is a way to see commands for which ps cannot display options. The
    last command checks the kernel buffer ring for any ATA device information, such
    as hard disks and CD-ROM drives.


    The grep command can also recursively search a few or lot of files at the same
    time. The following command recursively searches files in the /etc/httpd/conf
    and /etc/httpd.conf directories for the string VirtualHost:


    ```

    $ grep -R VirtualHost /etc/httpd/conf/*

    ```'
