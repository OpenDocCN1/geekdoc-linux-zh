  md: '# Chapter 10: Managing the System


    If that buffer fills up, it may no longer contain the beginning of the recorded
    information. In that case, you can use less /var/log/dmesg.


    Other information about interest kernel processing can be found in the /var/log
    — in particular, the messages you can page through those files as:


    ```

    $ sudo cat /var/log/messages* | less Page through /var/log/messages

    Aug 2 21:55:46 davinci syslog 1.4.2: restart.

    Aug 6 22:12:03 kernel: eth0: link up, 100Mbps, l1pa 45Ex51

    Aug 6 22:13:06 kernel: eth0: link down

    Aug 6 22:13:07 kernel: eth0: link up, 100Mbps, l1pa 45Ex51

    Aug 10 10:53:46 davinci init: Switching to runlevel: 3

    ```


    In the best circumstances, all the hardware connected to your computer should
    be detected and configured using the proper drivers. In some cases, however, either
    the wrong driver is detected or the necessary driver may be available on your
    system. For those cases, Linux offers ways of loadable kernel modules and adding
    new ones to your system.


    The lsmod command lets you view the names of the loaded modules, their size, and
    what others you are using. Here is an example:


    $ lsmod Size Used by

    parport_pc 29797 1

    parport 38025 2 lp.parport_pc

