    From the Linux server system, you can use the showmount command to see what directories
    are available from the local system. For example:


    ```

    $ sudo /usr/bin/showmount -e

    Export list for server.example.com

    /export/myshare client.example.com

    /mnt/public

    ```


    From a Linux system, you can use the showmount command to see what directories
    are available from a selected computer. For example:


    ```

    $ sudo /usr/bin/showmount -e server.example.com

    /export/myshare client.example.com

    /mnt/public

    ```


    # Mount NFS Shares


    Use the command to mount a NFS share on the local computer. Here is an example:


    ```

    $ sudo mkdir /mnt/server-share

    $ sudo mount server.example.com:/export/myshare /mnt/server-share

    ```


    This example notes the NFS server (server.example.com) and the shared directory
    from that server (/export/myshare). The mount point, which must exist before mounting
    share, appears at the end of the command (/mnt/server-share).


    Pass NFS-specific options to the mount command by adding them the -o option:


    ```

    $ sudo mount -o rw,intr server.example.com:/export/myshare /mnt/server-share

    ```


    The rw option mounts the remote directory with read-write permissions, assuming
    that permission is available. With hard, someone will see a server not responding
    message when a read or write operation times out. If that happens, having the
    int option allows you to interrupt a request to a remote server (type Ctrl+c).


    By default, NFS version 3 (nfs3) is used to connect to the server. To use NFS
    version 4, which is designed to work over the Internet and through firewalls,
    indicate that protocol is the file type on the command line as follows:


    ```

    $ sudo mount -t nfs4 server.example.com:/ /mnt/server-share

    ```'
