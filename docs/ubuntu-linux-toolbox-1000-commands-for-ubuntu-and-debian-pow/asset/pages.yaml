    # Managing Software with dpkg


    The dpkg utility works at a lower layer than the APT utilities. APT uses dpkg
    behind the scenes to manage software on your Ubuntu system. APT and dpkg similar
    to the way yum and rpm do on Red Hat-based Linux distributions. Usually, APT will
    have enough functionality to get you through just anything, but when finding out
    which package is associated with a given file on your system. Table 2-5 shows
    some common dpkg commands and operations.


    > NOTE dpkg uses the -D flag to signify debugging information to be printed while
    performing various operations. If you want more information than the default output,
    try -D1 with some of the dpkg commands. A section in the dpkg page lists output
    levels for use with the -D flag.


    Table 2-5: Some Common Uses of the dpkg Utility

    | dpkg Command | What It Does |

    | dpkg -c <.deb file> | Lists files which are installed by the .deb file given
    (.deb file must be path/filename). |

    | dpkg -I <.deb file> | Lists information about the .deb given file. |

    | dpkg -p <package> | Lists information about the package. |

    | dpkg -S <filename> | Lists the packages where the given file name is found.
    This can be a path, or just the name of a file.'
