  md: '# Chapter 12: Accessing Network Resources


    # Mounting Samba Shares


    You can mount remote Samba shares on your local file system as much as you would
    a local system or remote NFS file system. To mount the share:


    ```

    $ sudo mount -t smbfs -o username=francois,password=MySecret \n /192.168.1.11/myshare
    /mnt/myshare/

    ```


    > NOTE The Samba file system (smbfs) is deprecated and should no longer be used
    in some Linux distributions; however, this is the type supported by Ubuntu. In
    other distributions, the preferred method is to indicate CIFS (-t cifs) as the
    file type when you mount a remote Samba share.


    You can see the current connections and file locks on a server using the mbstatus
    command. This will tell you if someone has mounted your shared directories or
    is currently using an smclient connection to your server:


    ```

    $ sudo mbstatus

    Samba version 3.0.25a-3.fc7

    PID Username Group Machine


    5466 francois francois 10.0.0.55 (10.0.0.55)

    Service pid machine Connected at

    ------------------------------------

    myshare 5664 10.0.0.55 Tue Jul 15:08:29 2007

    ```


    # Looking Up Samba Hosts


    NetBIOS names are used to identify hosts in Samba. You can determine the IP address
    of a computer using the nmblookup command to broadcast for a particular NetBIOS
    name on the local subnet as follows:


    ```

    $ nmblookup thompson

    querying thompson on 192.168.1.255

    192.168.1.1 server1<0>

    ```


