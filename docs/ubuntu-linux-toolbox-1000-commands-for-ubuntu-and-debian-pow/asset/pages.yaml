  md: '# Chapter 4: Working Files


    Here are some examples of using the ln command to create hard and symbolic links:


    ```

    $ touch myfile

    $ ln myfile myfile-hardlink

    $ ln -s myfile myfile-symlink

    $ ls -li myfile*

    292007 -rw-r-r-- 3 francois francois 0 Mar 25 00:07 myfile

    292007 -rw-r-r-- 3 francois francois 0 Mar 25 00:07 myfile-hardlink

    292008 -lrwxr-xr-x 2 francois francois 6 Mar 25 00:07 myfile-symlink

    ```


    Note after creating the hard and symbolic link, we used to list the results. The
    -li option shows the nodes associated with each file. You can see that myfile
    and myfile-hardlink both have the inode number of 292007 (signifying the same
    file on the hard disk). The myfile-symlink symbolic link has a different inode
    number. And the hard link appears as a file (-), the symbolic link is identified
    as a link (1) with wide-open permissions. You won''t know if you can access the
    symbolic link points until you try it or the link target.


    # Using Device Files


    When applications need to communicate with your computer''s hardware, they direct
    access device files. By convention, device files are stored in the /dev directory.
    Devices are generally divided into block devices (such as storage media) and character
    devices (such as serial ports and terminals).


    > NOTE Device files are often called devices. In Linux and Unix, the operating
    system treats almost everything as a file, hence the term device files.


    Each device file is associated with a major number (indicating the type of device)
    and minor number (the instance number of the device). For example, terminal (tty)
    devices are represented by major character device 4, while SCSI hard disks are
    represented by major device number 8. Here are examples of device files:


    ```

    $ ls -l /dev/tty0 /dev/sda List character and block special devices

    brw-rw-rw-- 1 root disk 8, 1 2007-07-05 08:34 /dev/sda

    crw-rw-rw-- 1 root root 4, 0 2007-07-05 08:34 /dev/tty0

    ```


    A listing of device names and numbers allocated in Linux is available in Ubuntu
    in the online manual page for the MAKDEV command. Most device files are created
    automatically for you at boot time. Most people create device files manually.
    However, you can create your own device file using the mknod command. Here is
    an example:


    ```

    $ sudo mknod /dev/tty4 4 68 Add device for fifth serial port

    $ ls -l /dev/tty4 List new device file

    crw-r--r-- 1 root root 4, 68 Sep 6 00:35 /dev/tty4

    ```'
