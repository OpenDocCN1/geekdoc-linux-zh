    ```


    To generate the mdsums for rsync, use a little script. First, use dpkg -L to ask
    for a list of all the files dpkg knows about, in the rsync package. The last dpkg
    returns will have other line of data in it inside just the file names, so we pipe
    output to grep and filter everything that does not start with a slash. On the
    second line, we have the shell test whether the line of output from dpkg is a
    directory or file (directories start with a slash). If it is a file, md5sum run
    on the line of output, which at this point should be a file name. Lastly, output
    at the third line is saved into a test file in the /var/lib/dpkg/info directory.


    ```

    $ for file in `dpkg -L rsync | grep ''^/''; do

    test -f "$file" && md5sum "$file";

    done > /tmp/rsync.md5sums

    ```'
