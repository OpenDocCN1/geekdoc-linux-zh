  md: '# Chapter 14: Locking Down Security


    # Working with System Logs


    Most Linux systems are configured to log many of the activities that occur on
    those systems. These activities are written to log files located in the /var/log
    directory or its subdirectories. This logging is done by the Syslog facility.


    Ubuntu uses syslog (system log daemon) and kllog (kernel log daemon) from the
    syslog and kllog packages to manage system logging. These daemons are started
    automatically by editing the syslog script (/etc/init.d/syslog). Information about
    system activities is directed to files in the /var/log directory as messages,
    secure, cron, and boot.log, based on settings in the /etc/syslog.conf file.


    Automatic log rotation is handled by logrotate, based on settings in the /etc/logrotate.conf
    file and /etc/logrotate.d directory. The /etc/cron.daily/logrotate cron job causes
    this daily log rotation to taking place.


    You can check any of the log files manually (using vi or another text editor).
    However, if you install the logwatch package, highlights of your log files will
    be mailed to your root''s mailbox every day. You can change the recipient and
    the sender of mail that is delivered by editing the /etc/cron.daily/logwatch file.
    To prevent e-mail logs, you should change the sender address to the recipient
    which is not on the local machine. Another way to change the recipient is to forward
    root''s mail to another address by editing /etc/aliases and running newaliases
    to enact the changes. Otherwise, you just log in as root and use a mail client,
    as described in Chapter 12, to read the logwatch messages:


    You can send your messages to the syslog logging facility using the logger command.
    Here are a couple of examples:


    ```

    $ logger Added new video card      Message added to messages file

    $ logger -p info -t CARD -f /tmp/my.txt  Priority, tag, message file

    ```


    In the first example, the words Added new video card are sent to the messages
    file. In the second example, the priority of the message is set to info, and a
    tag of CARD is added to each line in the message. The message text is taken from
    the /tmp/my.txt file. To see log entries in real time, use tail -f or less as
    described in Chapter 5.


    # Using Advanced Security Features


    A dozen or so pages covering security-related commands are not nearly enough to
    address the depth of security tools available to you as a Linux system administrator.
    Beyond the commands covered in this chapter, here are descriptions of some you
    may want to look into to further secure your Linux system:


    +   - Security Enhanced Linux (SELinux) — The SELinux feature provides features
    of securing files, directories, and applications in your Linux system in such'
  merge: -1
  pgno: 314
- img_proc: true
  md: '# Chapter 14: Locking Down Security


    way that exploitation of one of those areas of your system cannot be used to breach
    other areas. For example, intruders would be compromise your web daemon, they
    wouldn''t necessarily be able to compromise the rest of the system.


    SELinux was developed by the U.S. National Security Agency (NSA), who hosts a
    related FAQ at www.nsa.gov/selinux/info/faq.cfm.You need to install SELinux as
    separate packages. See https://wiki.ubuntu.com/SELinux for details.


    +   Central logging — If you are managing a couple of Linux servers, it becomes
    preferable to have all your systems log to a central syslog server. When you implement
    your syslog server, may want to explore using syslog-ng. Also, if you output logwatch,
    you should consider using a log parser as Splunk.


    +   Tripwire — Using the tripwire package, you can take a snapshot of all the
    files on your system, then later use that snapshot to find out if any those files
    have been changed. This is particularly useful to find out if any applications
    have been modified that should not have been. First, you take a baseline of your
    system file. Then at regular intervals, you run a tripwire integrity check to
    see if any of your applications or configuration files have been modified.


    +   APT database — Another way to check if any of your applications have been
    modified is using the APT commands to validate the applications and configuration
    files you have installed on your system. See Chapter 2 for information on using
    the APT and dpkg commands to verify the contents of installed packages.


    +   chkrootkit — If you system has been compromised, download and build chkrootkit
    from chkrootkit.org. This will help you detect rootkits that have been used to
    take over your machine. We recommend you run chkrootkit from a LiveCD or after
    mounting the suspected drive on a clean system.


    # Summary


    While there are many tools available for securing your Linux system, the first
    line of security starts with securing the user accounts on your system and the
    services that run on your system. Commands such as useradd, groupadd, and password
    are standard tools for setting up and group accounts.


    Because most serious security breaches outside your organization can come from
    intruders accessing your systems on public networks, setting secure firewalls
    is important for any system connected to the Internet. The iptables facility provides
    the firewall features that are built into the Linux kernel.


    Keep track of activities on your system, The Syslog facility logs information
    about nearly every aspect of the actions that take place on your system. Packages
    that are installed by default, such as logrotate and logwatch, make it easy to
    manage and do daily checks on your system logs.'
