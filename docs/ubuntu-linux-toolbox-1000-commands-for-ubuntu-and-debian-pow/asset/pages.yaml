    next part reflects processing that occurs when a large amount of data is copied
    from the first disk (sda) to the second disk (sdb). High iowait values indicate
    that input/output is the bottleneck on the system. In other words, faster disk
    writing would improve performance more than a CPU.


    The vmstat command can also list statistics about your disks. Here''s an example
