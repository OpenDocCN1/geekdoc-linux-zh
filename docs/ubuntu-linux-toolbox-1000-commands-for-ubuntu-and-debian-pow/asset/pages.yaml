    Instead of supporting large, recursive downloads (as wget does), curl is designed
    for single-shot file transfers. It does, however, support more protocols (as noted)
    and neat advanced features. To use this command, you need to install the curl
    package. Here are a few examples of file transfers with curl:


    ```

    $ curl -o ftp://kernel.mirrors.tds.net/pub/linux/kernel/v1.0/patch[6-8].sh

    $ curl -o ftp://kernel.mirrors.tds.net/pub/linux/kernel/v2.6/ \

