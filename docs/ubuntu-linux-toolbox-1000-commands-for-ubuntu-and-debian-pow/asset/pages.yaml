  md: "# Chapter 14: Locking Down Security\n\n# Configuring the Built-In Firewall\n\
    \nA firewall is a critical tool for keeping your computer safe from intruders\
    \ over the Internet or other network. It can protect your computer by checking\
    \ every packet of data that comes to your computer's network interfaces, making\
    \ a decision about what to do with that packet based on the parameters you set.\
    \ The firewall facility into the current Linux kernel is called iptables. (You\
    \ may also hear of iptchains, which is the predecessor of iptables in kernel 2.2\
    \ and below.) Ubuntu comes with iptables fully started and configured when you\
    \ install Linux.\n\nThe iptables firewall (www.netfilter.org) is extraordinarily\
    \ powerful, yet complex to use with the command line. For reason, many people\
    \ set up their firewall rules using a graphical interface. To get a graphical\
    \ interface, install the firestarter package. Firestarter provides a wizard to\
    \ configure and set up your firewall. To run Firestarter, select System -> Firestarter.\
    \ You can also add packages such as FWBuilder (fwbuilder package) and Shorewall\
    \ (shorewall package) for graphically configuring firewalls.\n\nWhen you installed\
    \ Ubuntu, you installed a firewall on your system. Ubuntu generates an iptables\
    \ configuration that is a good starting point for simple desktop firewalling,\
    \ which consists of opening a few ports for running daemons and blocking the rest.\
    \ You can customize this default configuration by running the commands in the\
    \ following sections.\n\n> Before you go much further, read the IpTablesHow document\
    \ for Ubuntu, at/IptablesHow. This document provides a lot of useful information\
    \ for using iptables on Ubuntu, as this usage differs from other versions of Linux\
    \ such as Fedora.\n\nFor complex needs, as iptables is used as the firewall in\
    \ multiple machines, we recommend using one of the graphical tools mentioned above.\
    \ However, there are times when you either don't have a GUI available or you need\
    \ a firewall rule that isn't available through a GUI. In those cases, it's useful\
    \ to know the syntax of the iptables command to list current rules and add a new\
    \ rule yourself.\n\nBefore starting around with your firewall in Ubuntu, you should\
    \ check whether the firewall is set up on your system. Here is how to list the\
    \ current rules on your Linux system's firewall:\n\n```\n$ sudo iptables -L\n\
    Chain INPUT (policy ACCEPT)\n  target prot opt source\nChain FORWARD (policy ACCEPT)\n\
    \  target prot opt source destination\nChain OUTPUT (policy ACCEPT)\n  target\
    \ prot opt source destination\n```"
