    | chris 2689 2678 0.0 488 Aug14 tty S+ 00:00:00 xinit |

    | chris 2710 2689 0.0 5540 Aug14 tty S 00:00:09 gnome-session |


    | $ ps -Fu Chris | Show all chris'' running processes (with SZ and PSR)|

    | USER PID PPID C RSS TTY TIME CMD |

    |---|---|---|---|---|---|---||

    | chris 2678 2645 0 1082 0 Aug14 tty 00:00:00 /bin/sh startx |

    | chris 2689 2678 0 602 488 Aug14 tty 00:00:00 xinit |

    | chris 2710 2689 0 5504 5440 Aug14 tty 00:00:09 gnome-session |


    These examples illustrate how to view a running process using a Linux desktop
    session. The first example shows ps alone running from a Terminal window, so'
