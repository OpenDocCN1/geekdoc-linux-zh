    # ### Checking Samba Configuration


    If you are unable to use a Samba share or if you have other problems communicating
    with your Samba server, you can test the Samba configuration on the server. The
    testparam command can be used to check your main Samba configuration file (smb.conf):


    ```

    $ testparam

    Load smb config files from /etc/samba/smb.conf

    Processing section "[homes]"

    Processing section "[printers]"

    Processing section "[myshare]"

    Loaded services OK.

    Server role: ROLE_STANDALONE

    Press Enter to see a dump of your service definitions

    ```


    After processing as input, you can see the settings from your smb.conf file. Here''s
    how an entry for the myshare shared directory, earlier in an example, might appear
    in the smb.conf file:


    ```

    [myshare]

    path = /home/francois

    username = francois

    valid users = francois

    hosts allow = einstein

    available = yes

    ```


    This entry allows the Samba user francois to access the /home/francois directory
    (represented by the myshare name) from the computer named einstein. The share
    is being currently available.


    The previous example of testparam showed the entries you set in the smb.conf file.
    However, it won''t show all the default entries you didn''t set. You can view
    those using the -v option. Pipe it to the less command to page through the settings:


    ```

    $ testparam -v | less

    ```


    If you want to test a configuration file before it lives, you can tell testparam
    to use a file other than /etc/samba/smb.conf:


    ```

    $ testparam /etc/samba/test-smb.conf

    ```


    # ## Sharing Remote Directories with SSHFS


    Another magical trick you can do over the SSH protocol is mount remote file systems.
    Using the SSH file system (sshfs), you can mount any directory from an SSH server
    that your user account can access from your Linux system. sshfs provides encryption
    of the mount operation as well as all of the data being transferred. Another cool
    aspect of sshfs is that it requires no setup on the server side (other than having
    SSH service running).


    248'
