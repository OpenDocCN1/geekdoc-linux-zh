    # Converting Images in Batches


    Most of the image conversions described in this chapter can be done easily using
    a graphical image manipulation tool such The GIMP. However, where the convert
    commands we described can really shine when you use them in scripts. Instead of
    resizing, rotating, writing on, or colorizing a single file, you can do any (or
    all) of those things to a whole directory of files.


    You may want to create thumbnails for your duck collection images. Or perhaps
    you want to reduce all your wedding photos so they can play well on a digital
    photo frame. You might even want to add copyright information to every image in
    a directory before you share them on the Web. All these things can be done quite
    easily with the convert commands already described and some simple shell scripts.'
