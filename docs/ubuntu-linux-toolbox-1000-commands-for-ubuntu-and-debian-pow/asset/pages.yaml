    # Finding Out About File System


    Running out of disk space can be annoying on your desktop and potentially a disaster
    on your servers. To determine how much disk space is available and how much is
    currently in use, use the df command. To check how much space particular files
    and directories are consuming, use the du command.


    The df command provides utilization summaries of your mounted file systems. The
    -h option, you can have the data (which is shown by bytes) converted to megabytes
    (M) and gigabytes (G), to make output more human-readable:


    | $ df -h | Display space on file systems in human-readable format |

    | Filesystem | Size | Used | Avail% | Mounted on |

    | /dev/sda2 | 7.6G | 3.4G | 3.9G | / |

    | /dev/sda1 | 99M | 14M | 85% | /boot |

    | tmpfs | 501M | 0 | 501M | 0% | /dev/shm |

    | /dev/sda5 | 352G | 197G | 137% | /home |

    | /home/chris | 920496 | 5722608 | 3007068 | 66% | /mnt/mymount |


    Because ext file systems have only so many entries created at max time, if you
    have lots of small files, you possibly run out of inodes before you run out of
    actual space. To check inode utilization, use the -i option:


    | $ df -i | Inodes | Used | Free | IUse% | Mounted on |

    | Filesystem | | | | | |

    | /dev/sda2 | 2.0M | 108K | 1.9M | 6% | /


    If you have network mounts (such as Samba or NFS), these will also show up in
    the df output. To limit df to local file systems, use the following:


    $ df -hl | Display disk space only for local file systems


    To add the file system type to the listing, use the -T option:


    | $ df -HT | Add file system type information to listing |

    | Filesystem | Type | Size | Used | Avail% | Mounted on |

    | /dev/sda7 | ext3 | 8.8G | 5.5G | 2.9G | 66% | /'
