  md: '# Chapter 4: Working with Files


    Having the sticky bit on for a directory keeps users from removing or renaming
    files from that directory that they don''t own (/tmp is an example). Given the
    right permissions, however, users can change the contents of files they don''t
    in a sticky bit directory. The final permission is instead of x on a sticky directory.
    A command with sticky bit on used to cause the command to stay in memory, while
    not being used. This is an old Unix feature that is not supported in Linux.


    The -R option is a handy feature of the chmod command. With -R, you can recursively
    change permissions of files and directories starting from a point in the file
    system. Here are some examples:


    ```

    $ sudo chmod -R 700 /tmp/test      Open permission only to owner /tmp/test

    $ sudo chmod -R 000 /tmp/test      Close all permissions below /tmp/test

    $ sudo chmod -R a+wx /tmp/test     Open all permissions to all below /tmp/test

    ```


    Note that the -R option is inclusive of the directory you indicate. The permissions
    above, for example, would change the /tmp/test directory itself, and not just
    for the files and directories below that.


    # Setting the umask


    Permissions given to a file or directory are originally assigned at the time that
    item is created. How those permissions are set depends on the user''s current
    umask value. Using the umask command, you can set the permissions for files and
    directories you create.


    ```

    $ umask 0066      Make directories drwx--x-- and files --rw------

    $ umask 0077      Make directories drwx------ and files --rw-r---

    $ umask 0022      Make directories drwx-xr-xr and files -rw--r---

    $ umask 0777      Make directories d--------- and files ----------

    ```


    # Changing Ownership


    When you create a file or directory, your user account is assigned to that file
    or directory. Your group is primary. As root user, you can change the ownership
    (user) and group assigned to a different user or group using the chmod and chgrp
    commands. Here are some examples:


    ```

    $ chown test/                   Change owner to chris

    $ chown chris:market test/      Change owner to chris and group to market

    $ chgrp market test/            Change group to market

    $ chown -R test/               Change all files below test/ to owner chris

    ```


    The recursive option to chown (-R) is just useful if you need to change the ownership
    of an entire directory. With chmod, using chown recursively changes permissions
    for the directory named, along with its contents. You may use chown recursively
    when a person leaves a company or stops using your web service. You can use chown
    -R to reassign the entire /home to a different user.'
  merge: -1
