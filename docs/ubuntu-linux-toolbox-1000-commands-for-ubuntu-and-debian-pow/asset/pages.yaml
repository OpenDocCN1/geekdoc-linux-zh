  md: '# Chapter 8: Backups and Removable Media


    In the example above, -p indicates the preparer ID, which could include a phone
    number, address, or web site for contacting the preparer of the ISO image. With
    the option -publisher, you can indicate a 128-character description of the preparer
    (possibly the company or organization name). The -V indicates the volume ID. Volume
    ID is important because in Linux systems this volume ID is used to mount the CD
    when it is inserted. For example, in the command line shown above, the CD would
    be mounted on /media/WebBackup in Ubuntu and other Linux systems. The -A option
    can be used to indicate the application used to create the ISO image. The -volset
    option can contain a string of information about set of images.


    When you have created your ISO image, and you burn it to disc, you can check the
    image and make access to the files it contains. Here are ways to check out:


    ```

    $ volumename.iso                Display volume name

    WebBackup

    $ isoinfo -d i home.iso               Display header information

    CD-ROM is in ISO 9660 format

    System id: LINUX

    Volume id: WebBackup

    Volume set id: All Website material on November 2, 2007

    Publisher id: Swan Bay Folk Art Center

    Data preparer id: www.handsonhistory.com

    Application id: mkisofs

    Copyright File id:

    Abstract File id:

    Bibliographic File id:

    Volume set size is: 1

    Volume sequence number is: 1

    Logical block size is: 2048

    Volume size is: 23805

    Joliet with UCS level 3 found

    Rock Ridge signatures version 1 found

    ```


    You can see all the information entered on the mkisofs command line when the image
    was created. If there been an image that was going to be published, you might
    also have the locations on the CD of a file (-copyright), abstract file (-abstract),
    and bibliographic file (-biblio). Provided that the header is, you can now try
    accessing the files on the ISO image by mounting it:


    ```

    $ sudo mkdir /mnt/ymimage                   Create a mount point

    $ sudo mount -o loop home.iso /mnt/ymimage   Mount the ISO in loopback

    $ ls -l /mnt/ymimage                        Check the ISO contents

    $ sudo unmount /mnt/ymimage                Unmount the image when done

    ```


    Besides checking that you can access the files and directories on the ISO, make
    sure the date/time stamps, ownership, and permissions are set as you would like.
    That information might be useful if you need to restore the information at a later
    date.'
