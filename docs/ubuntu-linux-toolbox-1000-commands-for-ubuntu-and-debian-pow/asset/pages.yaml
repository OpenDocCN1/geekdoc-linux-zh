  md: '# 12


    # Accessing Network Resources


    In the time it takes to fire up a graphical FTP client, you could already have
    downloaded a few dozen files from a remote server using command line tools. Even
    when a GUI is available, commands for transferring files, web browsing, sharing
    directories, and reading mail can be quick and efficient to use. When no GUI is
    available, they can be lifavers.


    This chapter covers commands for accessing resources (files, e-mail, shared directories,
    and online chats) over the network.


    +   IN THIS CHAPTER

    * Web browsing with elinks

    * Wget, curl, lftp, and scp for file transfers

    * Sharing directories with NFS, Samba, and SSHFS

    * IRC chats with irissi

    * Mail and mutt e-mail clients


    # Running Commands to Browse the Web


    Text-mode web browsers provide a quick way to check that a web server is working
    or to get information from a web server when a usable GUI isn''t available. The
    once-popular lynx text-based browser was supplanted in most Linux systems by the
    links browser, which was later replaced by elinks. (Typing links now runs elinks)
    You need to install one of these programs, with package names that match the command
    names: lynx, links, and elinks respectively. In most cases, if you want a command
    web browser, install the elinks package.


    The elinks browser runs in a terminal window. Aside from displaying images in
    the terminal, elinks can handle most HTML content and features: tables, frames,
    tabbed browsing, cookies, mime types, and simple cascading style sheets. You can
    even use your mouse to follow links and select menu items.'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# Chapter 12: Accessing Network Resources


    Because elinks supports multiple colors, as long as the terminal you are using
    supports multiple colors, it''s easy to spot links and headings in the text. (Colors
    may not work within a screen session.) Here are some examples of elinks command
    lines:


    ```

    $ elinks  Prompts for file name or URL

    $ elinks www.handsonhistory.com  Opens file name or URL you want

    ```


    If you have a mouse available, click near the top of the terminal window to see
    the menu. Select the menu name or item you want. Select a link to go to that link.
    Table 12-1 shows elinks keyboard navigation keys.


    # Table 12-1: Control Keys for Using elinks


    | Keys | Description | Keys | Description |

    |---|---|---||}{

    | Esc (or F9/F8) | Toggle menu on and off (then use arrow keys or mouse navigate).
    | = | View page information. |

    | Down arrow | Go to next link or editable field on page. | Ctrl+ | Reload page.
    |

    | Up arrow | Go to previous link or editable field on the page. | a | Bookmark
    current page. |

    | Right arrow or Enter | Go forward to highlighted link. Enter text in highlighted-formed
    field. | t | Open new browser tab. |

    | Left arrow | Go back to previous page. | > | Go to next tab. |

    | / | Search forward. | < | Go to previous tab. |

    | ? | Search backwards. | c | Close current tab. |

    | n | Find next. | d | Download current link. |

    | N | Find previous. | D | View downloads. |

    | PageUp | Scroll one page up. | A | Add current link to bookmarks. |

    | PageDown | Scroll one page down. | s | View bookmarks. |

    | g | Go to a URL. | v | View current image. |

    | q or Ctrl+c | Exit elinks. | h | View global history manager. |


    You can add global settings for elinks to /etc/elinks.conf. Per-user settings
    are stored in each user''s $HOME/.elinks directory. Type man elinkskeys to see
    available settings.'
