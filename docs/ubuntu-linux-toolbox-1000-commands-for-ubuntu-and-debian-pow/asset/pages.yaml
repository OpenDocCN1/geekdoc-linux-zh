    # Using SSH to Tunneling (X11 Port Forwarding)


    With SSH tunneling configured as described earlier, the SSH service forwards X
    Window System clients to your local display. However, tunneling can be used with
    any TCP-based protocols as well.


    # Tunneling for X11 Clients


    The following sequence of commands starting an SSH session, then starting a few
    applications so appear on the local desktop:


    ```

    $ ssh francois@myserver Start ssh connection to myserver

    francois@myserver:password: ******

    [francois@myserver ~#] echo $DISPLAY Show the current X display entry

    localhost:10.0 SSH sets display to localhost:10.0

    [francois@myserver ~#] xeyes Show moving desktop eyes

    [francois@myserver ~#] gnome-cups-manager Configure remote printers

    [francois@myserver ~#] gksu services-admin Change system services

    ```


    # Tunneling for CUPS Printing Remote Administration


    X11 is not the only protocol that can be tunneled over SSH. You can forward any
    TCP with SSH. This is a great way to secure tunnels quickly and easily. No configuration
    is required on the server side.


    For example, myserver is a printer server with the CUPS printing''s web-based
    user interface enabled (running on port 631). That GUI is only accessible from
    the local machine. From the following client PC, we tunnel to that using ssh with
    the following options:


    ```

    $ ssh -L 1234:localhost:631 myserver

    ```'
