    # Encoding Music


    After a file is ripped from CD, encoding that to save disk space is the next step.
    Popular encoders include oggenc, flac, and lame, for encoding to Ogg Vorbis, FLAC,
    and MP3 files, respectively.


    With oggenc, you can start with audio files or streams in WAV, AIFF, or raw format
    and convert them to Ogg Vorbis format. Although Ogg Vorbis is a lossy format,
    the default encoding of WAV files still provides good quality audio and can result
    in a file that is about-tenth the size. Here are some examples of oggenc:


    ```

    $ oggenc ab.wav Encodes WAV to Ogg (ab.ogg)

    $ oggenc -flac -o new.ogg Encodes FLAC to Ogg (new.ogg)

    $ oggenc ab.wav -q 9 Raises encoding quality to 9

    ```


    By default, the command just (-q) of the oggenc output is set to 3. You can set
    the quality by any number from -1 to 10 (including fractions up to 5.5).


    ```

    $ oggenc NewSong.wav -o NewSong.ogg \

    -a Bernstein -G Classical \

    -d 06/15/1972 -t "Simple Song" \

    -1 Bernstein Mass \

    -c info="From Kennedy Center"

    ```


    The command just shown converts NewSong.wav to MySong.ogg. The artist is Bernstein
    and the music type is Classical. The date is June 15, 1972, the song title is
    Simple Song and the album name is Bernstein Mass. A comment from From Kennedy
    Center. The backslashes aren''t needed if you just keep typing the command on
    one line. However, if you add backslashes, make sure there are no spaces after
    the backslash.


    The preceding example adds information to the header of the ogg file. You can
    see the header information, with other information about the file, using ogginfo:


    ```

    $ ogginfo NewSong.ogg

    Processing file "NewSong.ogg"...

    ...

    Channels: 2

    Rate: 44100

    Nominal bitrate: 112.000000 kb/s

    User comments section follows...

    info=From Kennedy Center

    title=Simple Song

    ```


    113'
