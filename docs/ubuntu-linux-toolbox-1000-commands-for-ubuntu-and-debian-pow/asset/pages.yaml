    The traditional way to configure system cron jobs is to add them to the system
    crontab. Although this is still an easier way to configure hourly, daily, and
    monthly cron jobs, by associating the command you want to run with a cron directory.
    Simply create a script that you want to run. Then copy the script to the /etc/cron.hourly,
    /etc/cron.daily, /etc/cron.weekly, or /etc/cron-monthly. The command will run
    in the time frame indicated by the directory (hourly, daily, weekly, or monthly).


    An alternative to the cron facility is the anacron facility. With anacron, as
    with cron, you can configure commands to run periodically. However, anacron is
    appropriate for machines that are not on all the time. If a command is not run
    because the computer was off during the scheduled time, the next time the computer
    is on, the anacron facility makes sure that the commands that were missed during
    the down time run after the system resumes.


    # Summary


    Watching and working with the processes that run on your Linux system are important
    activities to make sure that your system is operating efficiently. Using commands
    such as ps and top, you can view the processes running on your system. You can
    also use pgrep to search for list particular processes.


    With commands such as nice and renice, you can adjust the recommended priorities
    at selected processes run. When a process is running, you can change how it is
    by running or kill the process by sending it a signal from the kill or killall
    command.


    After launching a command from the current shell, you can set that''s process
    to run in the background (bg) or foreground (fg). You can also stop and restart
    the process using different control codes.


    To schedule a command to run at a later time, you can use the at or batch command.
    To set up a command to run repeatedly at set intervals, you can use the cron or
    anacron facilities.'
