    # Changing File Attributes


    Files and directories in Linux systems have all read, write and execute permissions
    associated with user, group, and others. However, there are also other attributes
    that are specific to certain file system types.


    Files on ext2 and ext3 file systems have special attributes that you may choose
    to use. You can list these attributes with the lattr command. Most attributes
    are obscure and not turned on by default. Here is an example using lattr to see
    some attributes:


    ```

    $ lattr /etc/host*

    -------------------------

    /etc/host.conf

    -------------------------

    /etc/hosts

    -------------------------

    /etc/host.allow

