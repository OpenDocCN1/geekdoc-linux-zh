  md: '# 7


    # # Administering File Systems


    File systems provide the structures in which files, directories, devices, and
    other elements of the system are accessed from Linux. Linux supports many different
    types of file systems (ext3, VFAT, ISO9660, NTFS, and so on) as well as many different
    types of media on which file systems can exist (hard disks, CDs, USB flash drives,
    ZIP drives, and so on).


    Creating and managing disk partitions and the file systems on those partitions
    are among the most critical jobs in administering a Linux system. That''s because
    if you mess up your file system, you might well lose the critical data stored
    on your computer''s hard disk or removable media.


    This chapter contains commands for partitioning storage media, creating file systems,
    mounting and unmounting partitions, and checking file systems for errors and disk
    space.


    # IN THIS CHAPTER


    +   - Understanding Linux file system types


    +   - Partitioning disks with mkfs


    +   - Work with labels with e2label and findfs


    +   - Create file systems with mkfs


    +   - View file system info with tune2fs/dumpefs


    +   - Use swap areas with mkswap, swapon, and swapoff


    +   - Use fstab, mount and unmount to mount file systems


    +   - Check file systems with badblocks and fsck


    +   - View RAID information with mdmadm


    +   - Check disk space with du and df


    +   - Logical Volume Manager (LVM)


    # # Understanding File System Basics


    Even though there are a lot of different file system types available in Linux,
    there are not many that you need to set up a basic Linux system. For your computer
    hard disk may contain only three: a swap partition (used to handle the overflow
    of information in RAM), a boot partition that contains the boot loader and kernel,
    and a root file system partition are usually an ext3 file system.


    ![](img/79d7e11db1118ec8022dce67d54135dc_151_0.png)'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Chapter 7: Administering File Systems


    The ext3 file system type is based on the ext2 file system type, adding a feature
    called journaling to its predecessor. Journaling can improve data integrity and
    recovery, especially after unclean system shutdowns. Time-consuming file system
    checks are avoided during the next reboot after an unclean shutdown, because the
    changes that occurred since the most recent write to disk are saved and ready
    to be restored.


    Most of the examples in this chapter use ext3 file systems to illustrate how a
    file system is created and managed. However, there are times when you might want
    to use other file system types. Table 7-1 lists different file system types and
    describes when you might want to use them.


    Table 7-1: File System Types Supported in Linux


    | File System Type | Description |

    |---|---|n| ext3 | Most commonly used file system with Linux. Contains journaling
    features for safe data and fast reboots after unintended shutdowns. |

    | ext2 | Predecessor of ext3, but doesn''t contain journaling. |

    | iso9660 | Evolved from the High Sierra file system (which was the original standard
    used on CD-ROM). May contain Rock Ridge extensions to allow iso9660 file systems
    to support long file names and other information (permissions, ownership, and
    links). |

    | Jffs2 | Journaling Flash File System version 2 (JFF2) that is designed for efficient
    operations on USB flash drives. Successor to JFFS. |

    | jfs | JFS file system that IBM used for OS/2 Warp. Tuned for large file systems
    and high-performance environments. |

    | mdos | MS-DOS file system. Can be used to mount older MS-DOS file systems, such
    as those on old floppy disks. |

    | ntfs | Microsoft New Technology File System (NTFS). Useful when file systems
    need to share files with newer Windows systems (as with dual booting or removable
    drives). |

    | reiserfs | Journaling file system that used to be used by default on some SUSE,
    Slackware, and other Linux systems. Reiserfs is not well-supported in Ubuntu.
    |

    | squashfs | Compressed, read-only file system used on many live CDs. |

    | swap | Used on swap partitions to hold data temporarily when RAM is not currently
    available. |

    | ufs | Popular file system on Solaris and SunOS operating systems from Sun Microsystems.
    |


    124'
