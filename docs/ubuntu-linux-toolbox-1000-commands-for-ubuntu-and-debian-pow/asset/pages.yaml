  md: "# Chapter 14: Locking Down Security\n\nfollowing example uses a feature called\
    \ port forwarding to pass requests for a service through the firewall to the destination\
    \ machine before the firewall:\n\n```\n$ sudo iptables -t nat -A PREROUTING  \
    \    Add PREROUTING rule\n-p tcp -d 11.22.33.1         accept tcp requests on\
    \ 11.22.33.1\n  --dport 80                               for port 80 (Web service)\n\
    -j DNAT                               jump to the DNAT target\n  --destination\
    \ 10.0.0.2               forward those packets to 10.0.0.2\n```\n\nThere are many\
    \ other types of rules you can create to change how your firewall behaves. Refer\
    \ to the iptables page or the Netfilter web site (www.netfilter.org) for further\
    \ information on using the iptables facility.\n\nAfter making the changes, you\
    \ will see the following rules defined:\n\n```\n$ sudo iptables -t nat -L\nChain\
    \ PREROUTING (policy ACCEPT)\ntarget     prot source               destination\n\
    DNAT       anywhere                 11.22.33.1 tcp dpt:www:to:10.0.0.2\n\nChain\
    \ POSTROUTING (policy ACCEPT)\ntarget     prot source               destination\n\
    SNAT       0        anywhere                 to:11.22.33.1\n\nChain OUTPUT (policy\
    \ ACCEPT)\ntarget     prot source               destination\n```\n\nAll of the\
    \ changes to the iptables rules apply only for this session. When you reboot Ubuntu,\
    \ you will get the default set of no rules, which is generally not what you want.\
    \ To preserve your iptables rules, run iptables-save:\n\n```\n$ sudo iptables-save\
    \ > iptables.rules      Save rules to a file in the\n                        \
    \                    current directory\n$ sudo cp iptables.rules /etc        \
    \       Copy the saved rules to /etc\n```\n\nThe two-step process is required\
    \ due to the restrictions on the /etc directory. You can change those restrictions,\
    \ but probably isn't a good idea. Thus, the rules are saved for later usage.\n\
    \nNext, you can configure Ubuntu to load these rules each time it enables an Ethernet\
    \ interface (this is specific to each network card or interfaces on system). Edit\
    \ the /etc/network/interfaces file. After the iface configuration for an Ethernet\
    \ interface, such as eth0, make a call to iptables-restore, as shown in this snippet:\n\
    \n```\nauto eth0\niface eth0 inet dhcp\n  pre-up iptables-restore < /etc/iptables.rules\n\
    ```\n\nThis addition to the interfaces files calls iptables-restore to restore\
    \ the rules previously to the file /etc/iptables.rules."
