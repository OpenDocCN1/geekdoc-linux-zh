    # Ubuntu, Debian, and Linux


    Ubuntu is an operating system based on Debian GNU/Linux (www.debian.org/). Debian
    has been around since the early 1990s, and because of its maturity, is regarded
    as a leading distribution in terms of stability and security. Debian is also known
    for its strict adherence to free software (www.debian.org/intro/free). It is on
    this foundation that Ubuntu has been formed.


    If you think of Ubuntu as a cake in a bakery, the Linux kernel and operating system
    files would compose the soft sponge cake material itself. A whole lot to look
    at, but extremely whimsical as far as cake goes. Linux distributions, in contrast,
    take that spicy cake and add top and bottom borders, colors, tiers, size, frosting,
    flavors, decorations, designs, nuts, and sprinkles. As diverse as a bakery window,
    we are Linux distributions. Ubuntu, designed by the Canonical Group (www.canonical.com/),
    is the icing and color of a Linux distribution built on top of a Debian center.


    Debian has given rise to not only Ubuntu, but many other Linux distributions (www.debian.org/misc/children-distros):


    +   * Ubuntu - An Xfce-based desktop system based on Ubuntu.

    * Ubuntu - A KDE-based desktop system based on Ubuntu.

    * Edubuntu - An Ubuntu derivative focused on schools.

    * Knoppix - A KDE desktop-oriented live CD based on Debian.

    * Kanotix - A Debian-based live CD.

    * Damn Small Linux — A tiny (50MB) CD based on Knoppix.

    * Mepis - A desktop live CD based on Ubuntu and Debian.


    Xubuntu, Kubuntu, and Edubuntu are the same Debian-based Ubuntu distribution under
    the hood. The only difference is in the default desktop they run, or the collection
    of applications bundled with them. For example, Kubuntu features the KDE Desktop
    and Adept package manager, which are not installed on Ubuntu. Edubuntu is geared
    towards educational applications, many of which are not installed by default on
    the other *ubuntu distros.'
