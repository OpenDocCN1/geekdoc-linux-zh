    # Using the Pico and nano Editors


    Pico is a popular, very small text editor, distributed as part of the Pine e-mail
    client. Although Pico is free, it is not truly open source. Therefore, many Linux
    distributions, including Ubuntu, don''t offer Pico. Instead, they offer an open
    source clone of Pico called nano (nano''s another editor). This section describes
    the nano editor.


    > NOTE Ubuntu links the command pico to the program for nano.


    Nano (represented by the nano command) is a compact text editor that runs from
    the shell, is screen-oriented (owing to the fact that it is based on the curses
    library). Nano is popular with those who formerly used the Pine e-mail client
    because nano''s editing features are the same as those used by Pine''s editor.
    On the rare occasion you don''t have the vi editor available on a Linux system
    (such as when installing a Minimal Linux), nano may be available. Ubuntu installs
    nano by default. You need the spell command, rather than aspell, to perform a
    spelling check within nano.


    As with JOE, instead of commanding and typing modes, you can begin typing. To
    open a text file for editing, just type nano and the file name or use some of
    the options:


    ```

    $ nano memo.txt         Open memo.txt for editing

    $ nano -B memo.txt      When saving, back up previous to ~filename

    $ nano -m memo.txt       Turn on move to move cursor (if supported)

    $ nano +83 memo.txt      Beginning editing on line 83

    ```


    The m-command-line option support for a mouse. You can use the mouse to select
    a position in the text, and the cursor moves to that position. After the first
    click, though, nano uses the mouse to mark a block of text, which may not be what
    you were expecting.


    As with JOE, to add text, just begin typing. Use arrow keys to move the cursor
    left, right, up or down. Use the Delete key to delete text or the Backspace key
    to erase text to the left of the cursor. Press Enter to add a line break. Ctrl+g
    to read help text. Table 5-3 shows the control codes for nano that are described
    on the help screen.'
