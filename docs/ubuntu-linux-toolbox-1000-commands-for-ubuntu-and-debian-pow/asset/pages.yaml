  md: '# Chapter 10: Managing the System


    # Changing Time/Date with Graphical Tools


    Graphical tools in Ubuntu and other Linux systems for changing the date, time
    and time used on your system include the Date and Time Settings window (sudo time-admin
    command). That window can also be used to enable the Network Time Protocol (NTP),
    to automatically synchronize your Linux system''s date and time with a selected
    time over the network. You may need to install NTP support, available as a handy
    button-click on the Date and Time Settings.


    The Date/Time Properties window saves the settings and choices you make. During
    Ubuntu startup, the system reads these settings to set your time zone and whether
    your system is using UTC time.


    Your Linux system''s time zone is based on the contents of the /etc/localtime
    file. You can set a new time zone immediately by copying the file representing
    time zone from a subdirectory of /usr/share/zoneinfo. For example, to change the
    current time to that of America/Chicago, you can do the following:


    ```

    $ sudo cp /usr/share/zoneinfo/America/Chicago /etc/localtime

    ```


    This can also be accomplished by creating a symlink:


    ```

    $ sudo ln -s /usr/share/zoneinfo/America/Chicago /etc/localtime

    ```


    To change the time zone permanently, set it in the Date and Time Settings window
    to. The example, America/Chicago.


    # Displaying and Setting Your System Clock


    The date command is the primary command-based interface for viewing and changing
    date and time settings, if you are not having that done automatically with NTP.
    Here are examples of date commands for displaying dates and times in different
    ways:


    ```

    $ date Display current date, time and time zone

    Sun 12 01:26:50 CDT 2007

    $ date ''+%a %B %d %Y'' Display day, month, year

    Sunday 12 2007

    $ date ''+The date today is %F.'' Add words to the date output

    The date today is 2007-08-12

    $ date --date=''4 weeks'' Display date four weeks from today

    Sun Sep 9 10:51:18 CDT 2007

    $ date --date=''8 months 3 days'' Display date 8 months 3 days from today

    Tue Apr 15 10:59:44 CDT 2008

    $ date --date=''4 Jul'' +%A

    Wednesday

    ```'
