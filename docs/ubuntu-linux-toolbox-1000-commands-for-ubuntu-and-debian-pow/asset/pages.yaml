  md: '# Table 4-1: Changing Directory and File Access Permissions (continued)


    | chmod command (octal or letters) | Original Permission | New Permission | Description
    |

    | :--- | :--- | :--- | :--- |

    | chmod 0711 | any | drwx--x--x | Same as the owner. All others can change to
    the directory, but not view or change files in the directory. This can be useful
    for server hardening, where you prevent someone from listing directory contents,
    but allow access to a file in the directory if someone already knows it''s. |

    | chmod go+r | drwx------ | drwxr-xr-- | Adding permission to a directory may
    not give desired results. Without execute, others can''t view the contents of
    any files in that directory. |

    | chmod 0777 | any | drwxwxrwxrwx | All permissions are wide open. |

    | chmod 0000 | any | d-------- | All permissions are closed. Good to protect a
    directory from errant changes. However, backup programs that run as non-root may
    fail to back up the directory''s contents. |

    | chmod 666 | any | -rw-rw-rw- | Open read/write permissions completely on a file.
    |

    | chmod 644 | any | -rw-r--r-- | Only the owner can change or delete the file,
    but all can view |


    The 0 in the mode line can usually be dropped (so you can use 777 instead of 0777).
    That placeholder has special meaning. It is an octal digit that can be used on
    commands (executables) to indicate that the command can run as a set-UID program
    (4), run as a set-GID program (2), or become a sticky program (1). With set-UID
    and set-GID, the command runs with the assigned user or group permissions (of
    running with permission of the user or group that launched the command).


    > WARNING! SUID should not be used on shell scripts. Here is a warning from the
    Linux Security HOWTO: "SUID shell scripts are a serious security risk, and for
    this reason the kernel will not honor them. Regardless of how secure you think
    the shell script is, it can be exploited to give the cracker root shell."'
