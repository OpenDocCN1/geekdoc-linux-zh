    # Verifying Files


    When files such as software packages and CD or DVD images are shared over the
    Internet, often a SHA1SUM or MD5SUM file is published with. Those files contain
    checksums that are used to make sure that the file you downloaded is the one that
    the repository published.


    The following are examples of the md5sum shalsum commands being used to produce
    checksums:


    ```

    ```

    $ md5sum whatever.iso

    d41d8cd9f0fb204e980099ec8427e whatever.iso

    $ shalsum whatever.iso

    da39aee5e6b40d3255bef95601890afd8709 whatever.iso

    ```

    ```


    Which command you choose depends on whether the provider of the file you are checking
    distributed md5sum or shalsum information. For example, here is what the md5sum.txt
    file for the Ubuntu FreeBSD looks like:


