    # Summary


    Software for Ubuntu and other Debian-based distributions is packaged in the deb
    format. The Ubiquity installer is used to initially install Ubuntu. From the Boot
    menu, you can boot into a full Ubuntu environment and install from there, or run
    Ubuntu from a CD-ROM. To install additional software, you can use the aptitude
    and APT utilities to get packages from online repositories. To install packages
    locally, as well as build custom Debian packages, you can reuse the dpkg utility.
    APT, aptitude, and dpkg offer a means to query software. You can verify installed
    packages by using the desums and md5sum utilities.'
