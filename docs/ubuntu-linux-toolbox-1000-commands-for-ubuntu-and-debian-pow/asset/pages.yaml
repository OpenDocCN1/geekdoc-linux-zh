  md: '# Backups and Removable Media


    Data backups in Linux were traditionally done by running commands to archive and
    compress the files to back up, then writing that backup archive to tape, compression
    techniques, and backup media have grown tremendously in recent years. Tape archiving
    has, for many, been replaced by techniques for backing up data over the network,
    to other hard disks, or to CDs, DVDs, or other low-cost removable media.


    +   IN THIS CHAPTER


    Creating backup archives with tar


    Compressing backups with gzip, bzip2, and izop


    Backing up over the network with SSH


    Doing network backups with rsync


    Making backup images with mkisofs


    Burning backup images to CD or DVD with ddrecord and growisofs


    This chapter details some useful tools for backing up and restoring your critical
    data. The first part of the chapter details how to use basic tools such as tar,
    gzip, and rsync for backups.


    # Backing Up Data to Compressed Archives


    If you are coming from a Windows background, you may be used to tools such as
    WinZip and PKZIP, which both archive and compress groups of files in one application.
    Linux offers separate tools for gathering groups of files into a single archive
    (such as tar) and compressing that archive for efficient storage (gzip, bzip2,
    and izop). However, you can also do the two steps together by adding options to
    the tar command.


    # Creating Backup Archives with tar


    The tar command, which stands for tape archiver, dates back to early Unix systems.
    Although magnetic tape was the common medium that tar wrote to originally, today
    tar is most often used to create an archive file that can be distributed to a
    variety of media.'
