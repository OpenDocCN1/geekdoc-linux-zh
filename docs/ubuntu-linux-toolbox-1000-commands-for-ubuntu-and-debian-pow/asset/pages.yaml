  md: '# Appendix C: Getting Information from /proc


    The /proc/mdstat file contains detailed status information on your software RAID
    devices, if you have set up such a RAID device. In this example, md0 is a RAID1
    (mirror) composed of the /dev/sdb and /dev/sda partitions. On the following line,
    there is U for each member RAID. If you lose a drive, the output would appear
    as [U].


    ```

    $ /proc/stat kernel stats system boot

    cpu 1559592 1488475 710279 21854853 1446866 5486 16708

    cpu0 1559592 1488475 710279 21854853 1446866 5486 16708

    irq 2159566 20009728 28242 0 1 3770197 660 1 0 3753340 ...

    ctxt 28197622

    time 118195007

    processes 519308

    procs_running 1

    procs_blocked 0

    ```


    The /proc/stat file contains statistics related to CPU and process activities.
    The cpu line shows totals for all CPUs, while separate lines for each process
    show stats for each CPU on the computer. There are seven fields (from left to
    right) of CPU information: number of processes executed in user mode, kernel mode
    processes, idle processes, iowait processes (waiting for input/output to finish),
    servicing interrupts (IRQ), and soft IRQs.


    ```

    $ /proc/swaps List information about swap

    dev/sda2 partition 1020088 202124 -1

    $ /proc/uptime Seconds since system booted/total seconds idle

    230251.03 2261855.33

    ```


    ```

    $ /proc/version kernel version and related compiler

    Linux version 2.6.20-16-generic (root@terranova) (gcc version 4.1.2 (Ubuntu

    4.1.2-ubuntu4) #2 SMP Fri Aug 03 01:55:27 UTC 2007

    ```


    # Changing /proc/information


    On some versions of Linux, values in the /proc/sys directory can actually be changed
    on the fly. For /proc/sys files that contain binary values (0 disabled or 1 enabled)
    would simply echo a value to any files they wanted to change. Ubuntu does not
    allow this feature.


    The preferred method of changing /proc/sys information on the fly is using the
    sysctl command. To change these settings on a more permanent basis, you should
    add entries to the /etc/sysctl.conf file. Here are some examples of the sysctl
    command:


    ```

    $ sysctl -A | less Display all kernel runtime parameters

    $ sysctl -w net.ipv4.forward=1 Turn on IPv4 packet forwarding

    ```


    See Chapter 10 as well the sysctl man pages for more information.'
