    # Using the Shell


    After you open a shell (whether from a text-based login or Terminal window), the
    environment is set up based on the user who started the shell. Bash settings for
    all users'' shells are located in a number of files. You can make your own versions
    of these files to override the system settings. There are two types of files holding
    these settings: startup files and initialization files.


    Bash runs startup files for any shell that is a login shell. These files define
    settings that apply across your entire login. Bash runs initialization files for
    shells interact — that is, not running a shell.


    > NOTE Other versions of Linux store the system-wide files in /etc/profile and
    /etc/profile.d.


    Bash looks for initialization files in /etc/bash.bashrc (system-wide) or for personal
    settings in .bashrc in your home directory.


    > NOTE Other versions of Linux store the system-wide files in /etc/bashrc.


    When a shell is closed, any commands in the user''s ~/.bash_logout file are executed.
    Changing settings in these files permanently changes the user''s shell settings
    but does not affect shells that are already running (Other shells use different
    configuration files).


    There are a variety of ways in which you can list and change your shell environment.
    One of the biggest ways is to change which user you are; in particular, to become
    the super user (``Acquiring Super User Power'''' later in this chapter).


    # Using Bash Shell History


    The Bourne Again Shell (bash) is the shell used by default by most modern Linux
    systems and quite a few other operating systems such as Mac OS X. Built into bash,
    with other shells, is a history feature that lets you review, change, and reuse
    commands that you run in the past. This can prove very helpful as many Linux commands
    are long and complicated.


    52'
