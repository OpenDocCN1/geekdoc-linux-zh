    # Ripping CD Music


    To be able to rip your personal music collection from CDs to Linux, you can use
    tools such as cdparanoia to rip tracks from CDs to WAV files on your hard disk.
    The ripped files can be encoded to save disk space, using tools such as ogg (Ogg
    Vorbis), flac (FLAC), or lame (MP3).


    > NOTE There are several excellent tools for ripping and encoding CDs, such as
    grip and sound-jucer. Because they are CDDB-enabled, those tools can also use
    information about the music on the CD to name the output files (artist, album,
    song, and so on). This section, describes how to use some of the commanding to
    rip and encode CD manually.


    Using cdparanoia, you can check that your CD drive is capable of ripping Compact
    Digital Audio (CDDA) CDs, retrieve audio tracks from your drive, and copy them
    to hard disk. By inserting a music CD in your drive and typing the following:


    ```

    $ cdparanoia -vSQ


