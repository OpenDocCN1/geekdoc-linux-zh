    # Backing Up to Removable Media


    The capacity of CDs and DVDs, and the low costs of those media, have made them
    attractive options as computer backup. Using tools that commonly come with Linux
    systems, you can gather files to back up to CD or DVD images and burn those images
    to the appropriate media.


    Command line tools like mkisoofs (for creating CD images) and cdrecord (for burning
    to CD or DVD) once provided the most popular interfaces for making backups to
    CD or DVD. Now there are many graphical front-ends to tools you could also consider.
    For example, GUI tools for mastering and burning CDs/DVDs include K3b (the KDE
    CD) and Nautilus (GNOME''s file manager that offers a CD-burning feature). Other
    GUI tools for burning CDs include gcomb, X-CD-Roast, and graveman.


