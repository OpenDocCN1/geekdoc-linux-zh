  md: '# Chapter 4: Working with Files


    To create new directories for storing your data, you can use the mkdir command.
    Here are examples of using mkdir to create directories in different ways:


    ```

    $ mkdir /tmp/new      Create "new" directory in /tmp

    $ mkdir -p /tmp/a/b/c Create parent directories as needed for "new"

    $ mkdir -m 700 /tmp/new2 Create new2 with drwx - - permissions

    ```


    The first mkdir command adds the new directory to the existing /tmp directory.
    The second example creates directories as needed (subdirectories a, b, and c)
    to create the resulting new directory. The last command adds the -m option to
    set permissions as well.


    You can identify the file as the first character in the 10-character permission
    string for a directory is a d:


    ```

    $ file /tmp/new

    /tmp/new: directory

    $ ls -1

    drwxr-xr-x 2 ericfj ericricj 4096 2007-09-11 07:25 225

    ...

    ```


    Another thing to notice about directories is that the execute bits (x) must be
    on, if you want people to be able to use the directory as their current directories.


    # Using Symbolic and Hard Links


    Instead of copying files and directories to different parts of the file system,
    links can be set up to access that file from multiple locations. Linux supports
    both soft links (usually called symbolic links) and hard links.


    When you try to open a symbolic link which points to a file or directory to change
    that to a directory, the command you run acts on the file or directory that is
    the target of that link. The target has its own set of permissions and ownership
    that you cannot see from the symbolic link. The symbolic link can exist on a different
    partition than the target. In fact, the symbolic link can exist, even if the target
    is deleted.


    A hard link, alternatively, can only be used on files (not directories) and is
    basically a way of giving multiple names to the same physical file. Every physical
    file has at least one hard link, which is commonly thought of as the file itself.
    Any additional names (hard links) that point to that single physical file must
    be on the same partition as the original file (in fact, one way to tell that files
    are hard links is that they all have the same inode number). Changing permissions,
    ownership, date/time stamps or content of any hard link to a file results in all
    others being changed as well. However, deleting one link will not remove the file;
    it will continue to exist until the last link to the file is deleted.'
  merge: -1
  pgno: 99
