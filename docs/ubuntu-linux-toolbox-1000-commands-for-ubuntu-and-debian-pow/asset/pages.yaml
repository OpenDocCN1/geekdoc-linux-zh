  md: '# Chapter 4: Working with Files


    # # Using Named Pipes and Sockets


    When you want to allow one process to send information to another process, you
    can simply pipe () the output from one to the input of the other. However, to
    provide a presence in the file system from which a process can communicate with
    other processes, you can create named pipes or sockets. Named pipes are typically
    used for interprocess communication on the local system, while sockets can be
    used for processes to communicate over a network.


    Named pipes and sockets are set up by applications in the /tmp directory. Here
    are some examples of named pipes and sockets:


    ```

    $ ls -1 /tmp/.tv-chris/vttimefifo-local /tmp/.X11-unix/X0

    prw------ 1 chris chris 0 Sep 26 2007 /tmp/.tv-chris/vttimefifo-local

    ssrwxrxrwx 1 chris chris 0 Sep 04 01:30 /tmp/.X11-unix/X0

    ```


    The first listing is a named pipe set up by the tv TV card reader (note the p
    at the beginning indicating a named pipe). The second listing is a socket set
    up by the X GUI for interprocess communications.


    To create your own named pipe, use the mkfifo command as follows:


    ```

    $ mkfifo mypipe

    $ ls -l mypipe

    prw-r--r-- 1 chris chris 0 Sep 26 00:57 mypipe

    ```


    # # Setting File/Directory Permissions


    The ability to access files, run commands, and change to a directory can be restricted
    with permission settings for user, group, and other users. When you do a long
    list (ls -1) of files and directories in Linux, the beginning 10 characters indicate
    what the item is (file, directory, block device, and so) along with whether or
    not the item can be read, written, and/or executed. Figure 4-1 illustrates the
    meaning of these 10 characters.


    ![](img/79d7e11db1118ec8022dce67d54135dc_101_0.png)


    73'
