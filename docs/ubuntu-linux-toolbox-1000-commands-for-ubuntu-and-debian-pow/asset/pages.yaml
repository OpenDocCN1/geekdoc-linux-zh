  md: '# Chapter 7: Administering File Systems


    # Logical Volume Manager (LVM)


    Logical Volume Manager is a feature designed to help you cope with the changing
    needs for disk space on your Linux systems. With your hard disks configured as
    LVM volumes, you have tremendous flexibility in growing, shrinking, and moving
    the storage on your systems as your needs change. LVM also allows for snapshots,
    a feature typically found on expensive enterprise SANs, or Storage-Area Networks.


    Ubuntu incorporates LVM2 into its releases and uses it to define how disk partitions
    are allocated when you first install Ubuntu. Using LVM-2, you can define and manage
    volume groups (vg), logical volumes (lv), and physical volumes (pv). Each logical
    volume and physical volume is divided into logical and physical extents, respectively.


    The basic benefit of using LVM is to create the volume groups and logical volumes
    you need, then assign extents (chunks of disk space) to those areas where they
    are needed. Unlike older disk partitioning schemes, where you might have to back
    up your data, change your partitioning, return data to the resized partitions,
    you can simply add unused extents where they are needed.


    To use LVM, you need to install the lvm2 package.


    LVM comes with a set of commands that can be used to work with LVM volumes. Step
    through the procedure in the following section to learn about many of the LVM
    commands.


    > **WARNING!** To avoid messing up the hard disks your computer relies on as you
    learn LVM, we recommend you try the following examples on some non-critical storage
    device. For example, we used an inexpensive 32MB USB flash drive (on /dev/sdb)
    to run the commands shown in this section.


    # Creating LVM Volumes


    To begin, use the `fdisk` command to create physical partitions for the storage
    device on which you want to create logical partitions. Here we have a 32MB USB
    flash drive, located on /dev/sdb:


    ```

    $ fdisk /dev/sdb

    Command (m p help): p

    ```


    ```

    Start command to manage disk partitions

    Print current partitions (none exist)

    ```


    ```

    Disk /dev/sdb: 32 MB, 32112128 bytes

    1 heads, 62 sectors/track, 1011 cylinders

    Units = cylinders of 62 * 512 = 31744 bytes

    ```


    | Device Boot Start End Id System |'
