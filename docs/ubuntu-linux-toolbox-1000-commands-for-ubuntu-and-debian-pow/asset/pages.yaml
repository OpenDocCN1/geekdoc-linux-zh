    contain the word you supply to apropos.


    ```

    $ apropos cronab

    /etc/anacron (5) [anacron] - configuration file for anacron

    anacron (5) - configuration file for anacron

    crontab (1) - maintain cronab files for individual users (V3)

    crontab (5) - tables for driving cron

    ```


    The apropos output shows the section and man page where the word cronab was found.
    Sections of man pages are grouping of man pages by topic. Man pages in section
    1 are Executable programs or shell commands. Man pages in section 5 fall under
    Linux systems, but may vary a bit on other Unix-type systems. The man page sections
    and conventions will be the same on all Linux systems. You should be able to view
    the man page for man to find out which sections are represented on the system
    you''re on:


