    # Monitoring CPU Usage


    An overburdened CPU is another place to look for performance problems on your
    system. The vmstat command, shown earlier, can produce basic statistics relating
    to CPU usage (user activity, system activity, idle time, I/O wait time, and time
    stolen from a virtual machine). The iostat command (from the sysstat package)
    can generate more detailed reports of CPU utilization.


    Here are two examples of using iostat to display CPU utilization report:


    ```

    $ iostat -c 3 CPU stats every 3 seconds (starting apps)

    Linux 2.6.21-1.3194.fc7 (davinci) 08/10/2007

    ```'
