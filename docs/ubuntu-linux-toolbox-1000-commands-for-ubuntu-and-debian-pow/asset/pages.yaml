  md: 'boot. When that occurs, boot into rescue mode as described in the previous
    section and run mkinitrd after chrooting to the proper hard disk partition.


    # Controlling Startup and Run Levels


    After the kernel has started up, it handles control of the system to the init
    process. The init process becomes the first running process on the system (PID
    1), directing the start-up of other processes based on the contents of the /etc/initab
    file, the default run level, and the init scripts set to run at that run level.


    The default run level is typically set to 5 for desktop systems and 3 for server
    systems (based on the value passed to the telinit command in the /etc/event.d/default
    file). As noted earlier, value can be overridden by adding a different run level
    number (0, 1, 2, 3, 4, or 5) to the end of the kernel boot line from the boot
    screen.


    Most Linux administrators manage the basic startup features and focus on which
    services are turned on or off at the selected run level. The mechanism for starting
    run level scripts in Ubuntu, and similar systems are based on the System V facility
    (sysinit and inscripts packages), originally used in AT&T UNIX systems.


    > NOTE Even though Ubuntu uses the upstart rather than the init system, you can
    still change run levels with the init or telinit command.


    This section contains commands for working with system initialization scripts
    and changing run levels. As root, you can use the runlevel command to see the
    current run level.


    ```

    $ runlevel          Display current and previous run levels

    N 2

    ```


    Because the system is in this example booted directly to run level 3, there is
    no previous run level (N). To change the current run level, you can use the init
    command:


    ```

    $ sudo init 5      Change current run level to 5 (X Desktop)

    ```


    In this example, the current run level changes from the previous level (in this
    case) to run level 5 (which starts the X Window graphical interface). You can
    also use the q option to the init command to examine the /etc/initab file and
    start stop processes based on changes made to that file.


    ```

    $ sudo init q      Start or stop changed processes in initab

    ```


    Note that running init q does not stop System V services. It is used mostly when
    tinkering with the gettys defined in the files in the /etc/event.d directory.'
