  md: '# Chapter 7: Administering File Systems


    The old standard command for working with disk partitions is fdisk. Because fdisk
    cannot work with GPT partitions, however, it is slowly being deprecated. A more
    powerful and actively supported tool is the parted command.


    > NOTE If you prefer to use graphical tools for partitioning, resizing, and otherwise
    manipulating your hard disk, you can try gparted or qtparted partitioning tools.
    The command names and package names are the same for those two tools, neither
