  md: '# Chapter 14: Locking Down Security


    Ubuntu enhances security by disabling logins as root, by default. Instead, installation,
    you set up a user, with a password, who can perform administrative functions.
    On Ubuntu, we use the sudo command to perform individual root commands. The sudo
    command prompts for the administrative password, typically your password. This
    way, you avoid most issues of performing some root that you did not intend.


    # Managing Users the GUI


    For an Ubuntu desktop system with X, you can manage users and groups with the
    User Manager window (System -> Administration -> Users and Groups). When managing
    user accounts for servers, one option is to use web-based GUIs. The most commonly
    used general-purpose tool is Webmin (www.webmin.com). Make sure you do not run
    Webmin on its default port (10000) for security reasons. You can also use special-purpose
    web interfaces. For example, there are many hosting automation GUIs, such as cPanel
    (www.cpanel.com), Plesk (www.swsoft.com/plesk), and Ensim (www.ensin.com).


    # Adding User Accounts


    To add users, you can use the useradd command. The only option that is required
    to add a new user is the user name you are adding. You can see some of the default
    settings for adding a new user by entering the -D option


    ```

    $ useradd -D

    Show default values

    GROUP=100           Set group ID to 100 (users)

    HOME=/home          Set base directory to /home

    INACTIVE=-1         Password expiration is disabled (-1)

    EXPIRE              Don''t set date to disable user account set default shell
    to /bin/bash

    SHELL=/etc/skel     Copy default config files from /etc/skel $HOME

    CREATE_MAIL_SPOOL=  Create a mail spool directory

    ```


    Ubuntu and other Debian systems override the default group (100) and create a
    new group for every user. By default, the user ID assigned to the first user is
    created 1000 and the group ID is also 1000. The group name is the same as the
    user name. The home directory is the user name appended to /home. So, for example,
    if you created the first regular user account on the system:


    ```

    $ sudo useradd -m willz

    ```


    The result will be a new user account with a willz user name (UID 1001) and willz
    group name (GID 1001). The -m option tells useradd to create a home directory
    of /home/willz, and a copy of configuration files (each beginning with a ") to
    the home directory from /etc/skel. The account will remain active indefinitely
    (no expiration date). Add a password as follows, and in most cases that''s all
    you need to do to have a working account.


