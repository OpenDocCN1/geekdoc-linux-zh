- img_proc: true
  md: '# Chapter 8: Backups and Removable Media


    # Summary


    Linux and its predecessor Unix systems handled data backups by combining commands
    that each handled a discrete set of features. Backups of your critical data can
    still be done in this way. In fact, many of the tools you can use will perform
    more securely and efficiently than ever before.


    The tape archiver utility (tar command) has expanded well beyond its original
    job of making magnetic tape backups of data files. Because nearly every Linux
    and UNIX system includes tar, it has become a standard utility for packaging software
    and backing up data to compressed archives. These archives can then be transported
    and stored in a variety of ways.


    To move backed up data to other machines over a network, you can use remote execution
    features (such as ssh). You can also use an excellent utility `rsync`. With `rsync`,
    you can save resources by only backing up files (or parts of files) that have
    changed.


    Inexpensive CDs and DVDs have made those media popular for doing personal and
    small-office backups. The `mkisofs` command can create file systems of backed
    up data in ISO9660 format that can be restored on a variety of systems (Linux,
    Windows, or Mac). Once `mkisofs` command has created an ISO image, the image can
    be burned to CD or DVD using the `cdrecord` or `growisofs` command.'
