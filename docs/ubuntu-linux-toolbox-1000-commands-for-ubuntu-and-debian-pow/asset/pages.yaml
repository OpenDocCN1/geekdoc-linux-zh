  md: '# Chapter 14: Locking Down Security


    passwd keeps a regular user from setting a password that is too short, based on
    a dictionary, doesn''t have enough characters, or is otherwise easy to guess.
    The root user, in the second example, can change any user password without the
    old password.


    Passwords should be at least eight characters, a combination of letters and other
    characters (numbers, punctuation, and so on), and not include real words. Make
    passwords easy to remember but hard to guess.


    A system administrator can use passwd to lock and unlock user accounts. For example:


    ```

    $ sudo passwd -l car               Lock the user account (carl)

    Locking password for user car.

    passwd: Success

    $ sudo passwd -u car               Unlock a locked user account (carl)

    Unlocking password for user car.

    passwd: Success

    $ sudo passwd -u jordan             Fails to unlock account with blank password

    Unlocking password for user jordan.

    passwd: Warning: password would be empty.

    passwd: Unsafe operation (use -f to force)

    ```


    Locking a user account with passwd causes an exclamation mark (!) to be placed
    at the front of the password field in the /etc/shadow file where user passwords
    are stored. When a user account is unlocked, the exclamation mark is removed and
    the user''s previous password is restored.


    An administrator can use the passwd command to require users to change passwords
    regularly, as well as warn when passwords are about to expire. To use the password
    expiration feature, the user account needs to have password expiration enabled.
    The following examples use passwd to modify password expiration:


    ```

    $ sudo passwd -n 2 vern         Set minimum password life to 2 days

    $ sudo passwd -w 300 vern      Set maximum password life to 300 days

    $ sudo passwd -w 10 vern       Warn of password expiration 10 days in advance

    $ sudo passwd -i 14 vern         Days after expiration account is disabled

    ```


    In the first example, the user must wait at least two days (-n 2) before changing
    to a new password. In the second, the user must change the password within 300
    days (-x 300). In the next, the user is warned 10 days before the password expires
    (-w 10). In the last example, the user account is disabled 14 days after the password
    expires (-i 14).


    To view password expiration, you can use the change command as follows:


    ```

    $ sudo change -1 vern      View password expiration information

    Last password change      : Aug 04, 2007

    Password expires           : May 31, 2008

    Password inactive         : Jun 14, 2008

    Account expires           : never

    ```'
