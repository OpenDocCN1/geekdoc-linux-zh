    # Growing the LVM Volume


    Say that you are running out of space and want to add more to your LVM volume.
    To do that, you must also check the file system with fsck and then resize2fs to
    resize the ext3 file system on volume:


    ```

    $ sudo mount /mnt/ul

    $ sudo lvresize --size 16M /dev/vgusb-lvm_ul

    $ sudo fsck -f /dev/vgusb-lvm_ul

