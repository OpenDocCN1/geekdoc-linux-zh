    # Using Compression Tools


    Compression is an important aspect of working with backup files. It takes disk
    space on your backup medium (CD, DVD, tape, and so on) or server to store compressed
    files. It also takes less time to transfer the archives to the media or download
    files over a network.


    While compression can save a lot of storage space and transfer times, it can significantly
    increase your CPU usage. You consider using hardware compression on a tape drive
    (see www.amanda.org/docs/faq.html#id346016).


    In the examples in the previous section, tar calls the gzip command. But tar can
    work with many compression tools. Out of the box on Ubuntu, tar will work with
    gzip and bzip2. A third compression utility we add to our toolbox is the lzip
    command, which can be used with tar in a different way. The order of these tools
    from fastest/most compression is: lzip, gzip, and bzip2.


    If you are archiving large amounts of data, the time it takes to compress your
    backups can be significant. So you should be aware that, in general, bzip2


