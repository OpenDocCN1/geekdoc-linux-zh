  md: '# # Chapter 9: Checking and Managing Running Processes


    # # Listing Active Processes


    To see what processes are currently running on a system, most people use the ps
    and top commands. The ps command gives you a snapshot (in a simple list) of processes
    running at the moment. The top command offers a screen-oriented, constantly updated
    listing of running commands, sorted as you choose (by CPU use, memory use, UID,
    and so on).


    # # Viewing Active Processes with ps


    Every Linux system (as well as every system derived from Unix, as BSD, Mac OS
    X, and others) includes the ps command. Over the years, however, many different
    versions of ps have appeared, offering slightly different options. Because ps
    dates back to the first Unix systems, it also supportsstandard ways of extending
    some options (for example, allowing you to drop the branch an option in some cases).


    The different uses of ps in this chapter will work on Ubuntu and other Linux systems.
    There are some examples of how you can run processes for the current user (Table
    9-1 contains column descriptions of ps output):


    | $ ps |

    | PID TTY CMD |

    |---|---||

    | 2552 pts/0 | 00:00:00 bash |

    | 3438 pts/0 | 00:00:00 |


