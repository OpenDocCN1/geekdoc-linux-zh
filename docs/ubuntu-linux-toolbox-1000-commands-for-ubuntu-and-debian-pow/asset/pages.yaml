  md: '# Chapter 13: Doing Remote System Administration


    This example forwards port 1234 on the client PC to localhost port 631 on the
    server. We can now browse to http://localhost:1234 on the client PC. This will
    be redirected to cuspd on port 631 on the server.


    # Tunneling to an Internet Service


    Another example for using SSH tunneling is when your local machine is blocked
    from connecting to the Internet, you can get to another machine (myserver) as
    an Internet Connection. The following example lets you see the Google.com web
    site (HTTP, TCP port 80) across an SSH connection to a computer named myserver
    that has a connection to the Internet:


    ```

    $ ssh -L 12345:google.com:80 myserver

    ```


    With this example, any connection to the local port 12345 is directed across an
    SSH tunnel to myserver, which in turn opens a connection to Google.com port 80.
    You can now browse to http://localhost:12345 and use myserver as a relay to the
    Google.com web site. Since you''re only using ssh to forward a port and not to
    obtain a shell with the server, you can add the -N option to prevent the execution
    of remote commands:


    ```

    $ ssh -L 12345:google.com:80 -N myserver

    ```


    # Using SSH as a SOCKS Proxy


    The previous example demonstrates that you can forward a port from the client
    to a machine other than the server. In the real world, the best way to get your
    browser traffic off of your local network via an encrypted tunnel is using the
    SSH built-in SOCKS proxy feature. For example:


    ```

    $ ssh -D 12345 myserver

    ```


    The dynamic (-D) option of ssh lets you log in to myserver (as usual). As long
    as the connection is open, all requests directed to port 12345 are then forwarded
    to myserver. Next, set your browser of choice to use localhost port 12345 as a
    SOCKS5 proxy and you are good to go. Do not enter anything on the fields for HTTP
    and other protocols. They all work over SOCKS. See the Firefox Connections window
    in Figure 13-1.


    To test your setup, try disconnecting your ssh session and browsing to any web
    site. Your browser should give you a proxy error.


    From a Windows client, the same port forwarding can be accomplished in Putty by
    selecting Connection ✜ SSH ✜ Tunnels.'
