    # Working with Software Packages


    The following sections describe the basics of package management, explaining what
    goes behind the scenes and how to install packages. Learning this needs a first
    step prior to moving on other tools such as aptitude.


    The aptkg command is powerful for installing single deb packages, but will not
    shift through and install dependencies that are needed by different pieces of
    software, nor does it care about software repositories, such as the Ubuntu components
    mentioned above. APT, on the other hand, will resolve and install dependencies
    and the configured repositories, but is not used to install deb files on a hard
    drive or other local disk.


    # Handling Locale Error Messages


    If you are working with the command line with Ubuntu (Feisty Fawn), you may see
    a locale error messages like one of these while trying to install packages:


    ```

    perl: warning: Setting locale failed.

    perl: warning: Please check your locale settings:

    locale: Cannot set LC_TYPE to default locale: No such file or directory

    ```


    This seems to be a problem related to the installed language settings, or something
    with internationalized encoding in general. One workaround you can use to keep
    things satisfied is to export the LC_ALL environment variable and set it the same
    as your LANG setting.


    ```

    export LC_ALL="LANG$

    ```


    There are several other possible workarounds on the help sites, but this one will
    be the easiest to use in the case cause more problems than the condition. It should
    work regardless of what language you speak. Note that you will have to run this
    command every time you open a local or ssh shell. You can automate this task by
    placing the command in your ~/.bashrc file.'
