    This example was taken from the same machine as the examples above, with the NIC
    auto-negotiating at 100 Mbps, full-duplex. The mii-tool command is mis-reading
    the speed setting. This is why we recommend using mii-tool as a last resort if
    ethtool doesn''t work with your old NIC.


    To display mii-tool output with more verbosity, use the -v option:


    ```

    $ mii-tool -v Show verbose output of settings for old NIC

    eth0: 10BaseTx-FD flow-control, link ok

    product info: vendor 00:50:43, model 12 rev 2

    base speed: autonegotiation enabled

    basic status: autonegotiation complete, link ok

    capabilities: 10BaseTx-FD 10BaseTx-HD 10BaseT-FD 10BaseT-HD

    advertising: 100BaseTX-FD 100BaseTX-HD 10BaseT HD flow-control

    link partner: 100BaseTX-FD 100BaseTX-HD 10BaseT-FD 10BaseT-HD flow-control

    ```


    In the example just, you can see that each (100BaseTX and 10BaseT) supports both
    half-duplex (HD) and full duplex (FD). To disable auto-negotiation and force a
    particular setting, use the -f option:


    ```

    $ mii-tool -F 10BaseTx-FD eth0 Force speed/duplex to 10BaseT FD

    ```


    If you want to re-enable auto-negotiation, use the -r option:


    ```

    $ mii-tool -r eth0 Re-enable auto-negotiation for an old NIC

    starting autonegotiation...

    ```


    mii-tool does not provide a capability to save settings if ethtool does, so you
    have to run it after every reboot. This can be done by adding it at the end of
    /etc/rc.local.


