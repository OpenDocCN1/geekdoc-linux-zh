  md: '# 4


    # # Working with Files


    Everything in a Linux file system can be viewed as a file. This includes data
    files, directories, devices, named pipes, links, and other types of files. Associated
    with each file is a set of information that determines who can access the file
    and how they can access it. This chapter covers many commands for exploring and
    working with files.


    ### IN THIS CHAPTER

    * Setting permissions

    * Traversing the file system

    * Creating/copying files

    * Using hard/symbolic links

    * Searching for files

    * Listing and verifying files


    # # Understanding File Types


    Directories and regular files are far the file types you will use most often.
    However, there are several other types of files you will encounter using Linux.
    From the command line, there are many ways you can create, find, and list different
    types of files.


    Files that provide access to the hardware components on your computer are referred
    to as device files. There are character and block devices. There are hard links
    and soft links you can use to make the same file accessible from different locations.
    Less often used directly by regular users are named pipes and sockets, which provide
    access points for processes to communicate with each other.


    # # Using Regular Files


    Regular files consist of data files (documents, music, images, archives, and so
    on) and binary (binaries and scripts). You can determine the type of a file using
    the file command. In the following example, you can change to the directory containing
    shell documentation and use the file command to view some of the file types in
    that directory:


    ```

    $ cd /usr/share/doc/

    $ file doc-base/install-docs.html

    doc-base/install-docs.html: XML 1.0 document text

    $ file doc-base/copyright

    doc-base/copyright: ASCII English text

    $ file doc-base/doc-base.html

    doc-base/doc-base.html/: directory

    ```'
  merge: -1
