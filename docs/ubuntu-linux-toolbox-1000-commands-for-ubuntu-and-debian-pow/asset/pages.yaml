  md: '# Chapter 8: Backups and Removable Media


    +   $ cdrecord -v speed=24 home.iso Set specific speed

    $ cdrecord -pad home.iso Can''t read track so add 15 zeroed sectors

    $ cdrecord -eject home.iso Eject CD/DVD when burn is done

    $ cdrecord /dev/cdrw home.iso Identify by drive name (may differ)

    $ cdrecord dev=0,2 home.iso Identify by SCSI name


    The cdrecord command can also burn multi-CDs/DVDs. Here is an example:


    +   $ cdrecord -multi home.iso Start a multi-burn session

    $ cdrecord -minfo Check the session offset for next burn

    Using /dev/cdrom of unknown capabilities

    $ mkisofs -J -R -o new.iso Create a second ISO to burn

    -C 0,93041 /home/chris/more Indicate start point and new data for ISO

    $ cdrecord new.iso Burn new data to existing CD


    You can use multiple-burn until until the CD is filled up. For the final burn,
    don''t use-multi, so that the CD will be closed.


    # Making and Burning DVDs with growsisofs


    Using growsisofs command, you can combine the two steps of gathering files into
    an ISO image (mkisofs) and burning that to DVD (cdrecord). Before saving a step,
    the growsisofs also offers the advantage of keeping a session open by default
    until you choose it, so you don''t need to do anything special for multi-burn
    sessions.


    Here is an example of growsisofs commands for a multi-burn session:


    +   $ growsisofs -Z /dev/dvd -R -J /home/chris Master and burn to DVD

    $ growsisofs -Z /dev/dvd -R -J /home/francois Add to burn

    $ growsisofs -M /dev/dvd/dev/zero Close burn


    If you want to add a step when creating the ISO image, you can simply add mkisofs
    options to the command line. (For example, see how the -R and -J options are added
    in the above examples.)


    If you want to burn a DVD image using growsisofs, you can use the -dvd-compat
    option. Here''s an example:


    +   $ growsisofs -dvd-compat -Z /dev/dvd=image.iso Burn an ISO image to DVD


    The -dvd-compat option can improve compatibility with different DVD drives or
    some multi-session DVD burning procedures.'
