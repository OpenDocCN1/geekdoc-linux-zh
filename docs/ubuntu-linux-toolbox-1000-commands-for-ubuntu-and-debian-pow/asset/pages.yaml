    The file command was run shown documents in the Ubuntu documentation directories
    of different formats. It can look inside the files and determine if a file contains
    text compressed


    Creating files can be done by any application that can save its data. If you just
    want to create blank files to start with, there are many ways to do it. Here are
    two examples:


    ```

    $ touch /tmp/newfile2.txt      Create a blank file

    $ /tmp/newfile2.txt             Create a blank file

    ```


    Doing a list on file is another way to determine its file type. For example:


    ```

    $ ls -l /tmp/newfile2.txt       List a file to see its type

    -rw-r--r-- 1 chris root 0 5 2230 2007-03-14 12:44 /usr/bin/apt-key

    ```


    A dash in the first character of the 10-character permission information (-rw-r--r--)
    indicates that the item is a regular file. (Permissions are explained in the “Setting
    File/Directory Permissions” section in this chapter.) Commands are also regular
    files, but are saved as executables. Here are some examples:


    ```

    $ ls -1 /usr/bin/apt-key

    -rwxr-xr-x 1 root root 2230 2007-03-14 12:44 /usr/bin/apt-key

    $ file /usr/bin/apt-key Bourne shell text executable

    $ file /bin/ls

    /bin/ls ELF 32-bit LSB executable, Intel 80386, version 1 (SYSV), for GNU/Linux
    2.6.0, dynamically linked (uses shared libs), stripped

    ```


    You can see that the apropos command is executable by the x settings for, group,
    and others. By running file on apt-key, you can see that it is a shell script.
    That''s a binary executable, such as the ls command indicated above.


    # Directories


    A directory is a container for files and subdirectories. Directories are set up
    in a hierarchy from the root (/) to multiple subdirectories, each separated by
    a slash (/). Directories are called folders when you access them from graphical
    file managers.'
