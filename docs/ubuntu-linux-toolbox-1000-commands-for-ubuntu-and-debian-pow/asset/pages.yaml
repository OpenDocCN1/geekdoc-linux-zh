  md: '# Chapter 7: Administering File Systems


    # # Checking File Systems


    In Linux, instead of using the scandisk utility you have in Windows, you can scan
    a physical device for bad blocks at a physical level with the badblocks command
    and scan a file system for errors at the logical level with the fsck command.
    Here''s how to scan for bad blocks:


    ```

    $ sudo badblocks /dev/sda1

    $ sudo badblocks -v /dev/sda1

    Checking blocks 0 to 200781

    Checking for bad blocks (read-only): done

    Pass completed, 0 bad blocks.

    ```


    By default, badblock does a safe read-only test of the blocks. You can perform
    a non-destructive read/write test. This is the slowest test, but the best one
    you can perform without destroying the data on the device. The -s to see the ongoing
    process:


    ```

    $ sudo badblocks -vsn /dev/sda1

    Checking for bad blocks in non-destructive read-write mode

    From block 0 to 200781

    Testing with random pattern: 0 bad blocks found.

    ```


    The following command performs a faster, destructive read-write test:


    > > WARNING! This will erase all the data on the partition.


    ```

    $ sudo badblocks -vww /dev/sda1

    Checking for bad blocks in read-write mode

    From block 0 to 200781

    Testing with pattern 0xaa: done

    Reading and comparing: done

    Testing with pattern 0x55: done

    Reading and comparing: done

    Testing with pattern 0xff: done

    Reading and comparing: done

    Testing with pattern 0x00: done

    Reading and comparing: done

    Pass completed, 0 bad blocks found.

    ```


    You can perform multiple badblocks passes; for example, this command line can
    be used to burn in a drive and check for hard drive infant mortality:


    ```

    $ sudo badblocks -vwp 2 /dev/sda1

    ```


    Like the mkfs command, the fsck command is a front end to file-system-specific
    utilities. You can check an ext3 file system by simply adding the device name
    of the disk partition you want to check to the fsck command:


    ```

    $ sudo fsck /dev/sda1

    fsck 1.39 (29-May-2006)

    e2fsck 1.39 (29-May-2006)

    ```'
