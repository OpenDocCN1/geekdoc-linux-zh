  md: '# Summary


    Ubuntu and other Linux systems make it easy for you to watch and modify many aspects
    of your running system to make sure it is operating at peak performance. Commands
    such as `free`, `top`, `vmstat`, `slabtop`, `iot`, and `dstat` let you see how
    your system is using its memory, CPU, and storage devices. Using commands such
    as `date`, `hwclock`, and `cal`, as well as services such as NTP, you can watch
    and manage your system''s date and time settings.


    To manage the features that are set and services that come up when you boot your
    system, you can modify features associated with your GRUB boot loader and system
    run levels. You can start, stop, list, add, and remove individual system services
    using commands such as `service` and `chkconfig`. Commands such as `reboot`, `halt`,
    and `shutdown` let you safely stop or reboot your computer.


    When it comes to managing your computer''s hardware, commands such as `lsmod`,
    `modinfo`, and `modprobe` let you work with loadable modules. You can view information
    about your hardware with such commands as `lspci`, `dmidecode`, and `hdparm`.'
