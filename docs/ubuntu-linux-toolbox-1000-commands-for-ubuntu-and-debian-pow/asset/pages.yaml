  md: "# Chapter 7: Administering File Systems\n\nTo check disk space usage for particular\
    \ files or directories in a file system, use the du command. The following command\
    \ was run as the user named francois:\n\n```\n$ du -h /home                Show\
    \ disk space usage for /home directory\n`/home/chris`: Permission denied\n  `/home/francois/Mail\n\
    4.0K\n`/home/francois\n52K\n`/home/\n64K\n```\n\nThe output shows access to another\
    \ home directory's disk use (in this case /home/chris) was denied for security\
    \ reasons. The next examples show how to avoid permission issues and get totals\
    \ that are correct by using the root account. This is clearly visible when you\
    \ use -s to summarize:\n\n```\n$ du -sh /home             Regular user is denied\
    \ totals to others' homes\n`/home/chris`: Permission denied\n  `/home/horatiol99`:\
    \ Permission denied\n64K\n  `/home\n# du -sh /home            You can display\
    \ disk use as root user\n1.6G\n  `/home/`\n```\n\nYou can specify directories\
    \ with the -c option and total them up:\n\n```\n$ sudo -sch /home /var      Show\
    \ directory and total summaries\n1.6G\n  `/home/chris\n111M\n  `/var\n1.7G\n \
    \ `total`\n```\n\nYou can exclude files that match a pattern from being counted\
    \ using the exclude option. In the following example, disk image files (ending\
    \ with the .iso suffix) are not used in totalling the disk space used:\n\n```\n\
    $ sudo du -sh --exclude='*.iso' /home/chris  Exclude ISO images from totals\n\
    588M\n  `/home/chris`\n```\n\nYou can specify depth in the tree you want to summarize.\
    \ Set --max-depth to larger than the 1 value, to dig deeper into disk space usage:\n\
    \n```\n$ sudo du -h --max-depth=1 /home  Provide disk space usage, to one level\
    \ deep\n1.6G\n  `/home/chris\n52K\n  `/home/francois\n1.6G\n  `/home/\n$ sudo\
