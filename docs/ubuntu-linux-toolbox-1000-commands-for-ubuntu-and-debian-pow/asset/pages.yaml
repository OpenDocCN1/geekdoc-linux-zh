- img_proc: true
  md: '# Displaying and Setting Your Hardware Clock


    Anyone can use the hwclock command to view hardware clock settings; you must have
    root privileges to change these settings. To use hwclock to view the current time
    from your computer''s hardware clock, type the following:


    ```

    $ hwclock -x               Display current hardware clock settings

    Sun 12 Aug 2007 03:45:40 PM CDT      -0.447403 seconds

    ```


    Even if your hardware clock is set to UTC, it displays local time by default.
    If your system time stays from your hardware clock (for example, if you tried
    some of the date commands previously), you can reset your system clock from your
    hardware clock as:


    ```

    $ sudo hwclock --hctys       Reset system clock from hardware clock

    ```


    Likewise if your hardware clock is set incorrectly (for example, if you replaced
    the CMOS battery on your motherboard), you can set the hardware clock from your
    system clock as:


    ```

    $ hwclock --systohc       Reset hardware clock from system clock

    ```


    Over time your hardware clock can drift. Because the clock tends to drift the
    same amount each day, (which it does in the /etc/adjtime file). You can adjust
    the hardware clock time based on the adjtime file as:


    ```

    $ sudo hwclock --adjust    Adjust hardware clock time for drift

    ```


    To set the hardware clock to a specific time, you can use the --set option. Here
    is an example:


    ```

    $ sudo hwclock --set --date="3/18/08 18:22:00" Set clock to new date/time

    ```


    In this example, the hardware clock is set to March 18, 2008 at 6:22 p.m. This
    update does not immediately affect the system clock.


    # Using Network Time Protocol to Set Date/Time


    When you install Ubuntu, you are given the opportunity to set your system date
    and time. An option at that time is to use preconfigured Network Time Protocol
    (NTP) servers to automatically get the current date and time when your system
    reboots. If you choose that option, the installer will setup the npptd daemon
    and use it to keep your time synchronized.'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# Chapter 10: Managing the System


    If you didn''t configure NTP to set time for your system when you first installed
    your Linux system, you can do so later by turning on the ntpd service. You can
    either install the service from the Date and Time Settings window with a click
    of a button, or enter commands.


    Here is how to enable the service from the command line:


    ```

    $ sudo apt-get install ntp Install ntp package if necessary, start the service

    ```


    The ntpd service uses information in the /etc/ntpd.conf file. You can specify
    the name or IP address of the time server to query for, for example.


    Whether you install ntp manually or let the installer do it automatically, the
    resulting setup turns your machine into a time server, listening on UDP port 123.
    Unless you have very specific needs (and your own GPS or atomic clock), running
    ntpd on your machine can be a waste of resources and a security risk. For that
    reason, some system administrators prefer using chrony (in a daily cronjob) to
    set your system via NTP:


    ```

    $ sudo ntpdate pool.ntp.org

    15 Aug 00:37:12 ntpdate[9706:

    adjust time server 66.92.68.11 offset 0.009204 sec

    ```


    If you try running ntpdate while ntpd is running, you will get the following error:


    ```

    $ sudo ntpdate pool.ntp.org

    15 Aug 00:37:00 ntpdate[9695]: the ntp socket is in use, exiting

    ```


    Note that the ntpdate command has been marked as deprecated and will disappear
    in the future. It has been replaced by the following options of ntpd:


    ```

    $ sudo ntpd -q

    ```


    The -q option allows ntpd to exit after setting the clock (as opposed to keep
    running as a daemon). The -g option prevents ntpd from panicking if the system
    clock is off by more than 1000 seconds.


    # Managing the Boot Process


    When a computer starts up, the basic input/output system (BIOS) looks to its boot
    order settings to determine where to find the operating system to boot. Typically,
    if a bootable medium has not been inserted into a removable disk (CD, DVD, floppy
    disk, and so on), the BIOS looks to the master boot record (MBR) on the first
    bootable hard disk. At this point, for most Linux systems, control of the boot
    process is handed to the boot loader.


    200'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# Chapter 10: Managing the System


    For Ubuntu, and in fact, most Linux systems these days, the Grand Unified Boot
    Loader GRUB is the boot loader that is used by default. GRUB is a replacement
    for LILO, which was the most popular Linux boot loader during the 1990s. GRUB
    can be set up not only your Linux system, but also to boot any other operating
    systems installed on your hard disks (Windows, BSD, or others). GRUB can include
    boot options for each bootable operating system to refine the boot process, such
    as to turn on or off support for a particular type of hardware.


    Once a Linux system is selected from the boot loader, the boot loader loads the
    kernel. The following dilemma occurs: the kernel needs to mount the root file
    system on the hard drive. This requires the appropriate storage drivers (block
    device kernel modules). These drivers are located on the hard drive itself! To
    avoid cycle, a small initial ramdisk (initrd) containing the device modules is
    mounted by the boot loader. This allows Linux to read the root file system. After
    that, the init process takes over and begins starting the system services, based
    on the run level that is set for the system.


    The following sections describe commands for modifying the boot loader, startup
    scripts, and run levels associated with your Linux system.


    # Using the GRUB Boot Loader


    Assuming GRUB was set up when you first installed Ubuntu, the settings for your
    boot loader are stored in the /boot/grub/menu.lst file. Any changes you make to
    that file are picked up automatically when you reboot Ubuntu. Here is an example
    of the contents of /boot/grub/menu.lst file:


    ```

    default=0

    timeout=5

    ```


    ```

    hidden Ubuntu kernel 2.6.20-16-generic

    root (hd0)

    vmlinuz-2.6.20-16-generic

    root=UUID=db2dcac48-a62e-4de5-9529-e8a857b15bac quiet splash

    ```


    ```

    initrd /initrd.img-2.6.20-16-generic

    ```


    This example shows only one bootable operating system (Ubuntu), although the default
    file normally lists a number of variants, such as a recovery mode of Ubuntu. The
    default=0 line says that the first entry is booted by default. The timeout=5 line
    says that GRUB pauses five seconds at the splash screen before booting. The hiddenmenu
    line indicates that you won''t see the list of bootable titles when the boot splash
    screen appears (press a key during the timeout period to see the menu).


    201'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# Chapter 10: Managing the System


    The actual boot entry (title Ubuntu) points to the first partition on the hard
    disk (hd0,0), which contains the kernel and initial RAM disk (initrd) to be booted.
    To change how kernel boots, you can add options to the end of the kernel line.
    Or you can add new title entries to boot different kernels or operating systems.


    Some available boot options are described in Table 2-1 in Chapter 2. Options you
    might want to add to the end of the kernel line 3 (to boot runlevel 2,3, test
    mode) or ide=nodma (to turn off DMA if your system is having disk errors).


    In normal circumstances, you don''t need to run any commands to change how menu.1
    list picked by your boot loader. When you reboot, the menu.1 file is read directly
    from the hard disk. However, if your MBR becomes corrupted for some reason and
    your system won''t boot, you may need to reload the GRUB boot loader.


    To reinstall GRUB on your hard disks MBR, boot a Ubuntu live CD or install CD
    in rescue mode and follow the instructions to change root (root) to the hard disk
    partition containing your Ubuntu system. Then, assuming that you''re booting from
    your computer''s first SATA hard disk, type the following to reload the boot loader
    to the MBR:


    ```

    $ sudo grub-install /dev/sda

    ```


    The boot loader should be installed on your hard disk''s MBR. If your menu.1 file
    is correct, your system should be able to reboot from hard disk now.


    In addition, you can use the update-grub command to create the menu.1 list file
    from questions you answer.


    ```

    $ sudo update-grub

    ```


    # Repairing the initial ramdisk (initrd)


    The initrd is a file located in /boot with a name like initrd.img-2.6.20-16-generic.
    If your initrd becomes corrupted, or if you need to add new block device drivers
    to it, run the mkinitrd command. First, make sure you make a copy of your existing
    initrd file. Then run the following commands:


    ```

    $ sudo apt-get install initrd-tools

    $ sudo mkinitrd -o /boot/initrd.img-2.6.20-16-generic

    ```


    Replace the kernel in the example (2.6.20-1.320.fc5) with your own kernel version.
    Alternatively, to use the currently running kernel version, you can use:


    ```

    $ sudo mkinitrd -o /boot/initrd.img-`uname -r` `uname -r`

    ```


    Unfortunately, you will often realize that you need to rebuild the initrd after
    it is too late, as you witness a kernel panic during the root file system mount
    stage of'
