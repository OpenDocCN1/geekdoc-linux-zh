    # Creating and Using Swap Partitions


    Swap partitions are partitioned in Linux systems to hold data that overflows from
    your system''s RAM. If you didn''t create a swap partition when installing Linux,
    you can create it later using the mkswap command. You can create your swap partition
    on a regular disk partition or in a file formatted as a swap partition. Here are
    some examples:


    ```

    sudo mkswap /dev/sda           Format sda as a swap partition

    Setting up swapspace version 1, size = 205594 kB

    ```


    To check your swap area for bad blocks, use the -c option to mkswap:


    ```

    sudo mkswap -c /dev/sda

    ```


    If you don''t have a swap partition, you can create a swap area within a file:


    ```

    sudo dd if=/dev/zero of=/tmp/swapfile count=65536

    65536+0 records

    65536+0 outputs

    3554432 bytes (34 MB) copied, 1.56578 s, 21.4 MB/s

    sudo mkswap 600 /tmp/swapfile

    sudo mkswap /tmp/swapfile

    Setting up swapspace version 1, size = 67104 kB

    ```


    The dd command above creates a 32MB file named swapfile. The chmod command locks
    down the permissions on the file, to avoid getting a warning from the swapon command
    the road. The mkswap command formats the /tmp/swapfile file to be a swap partition.'
