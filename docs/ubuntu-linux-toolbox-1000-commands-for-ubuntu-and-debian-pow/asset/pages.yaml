    ```

    $ dd if=/dev/zero of=/tmp/mynullfile count=1

    1+0 records in

    1+0 records out

    512 bytes (512 B) copied, 0.000308544 s, 1.7 MB/s

    ```


    /dev/zero is a special file that generates null characters. In the example shown,
    the dd command takes /dev/zero as input file and outputs to /tmp/mynullfile. The
    count is the number of blocks. By default, a block is 512 bytes. The result is
    512-bytes-long file of null characters. You could use less or vi to view the contents
    of the file. However, a better tool to view the file would be the od (Octal Dump)
    command:


    ```

    $ od -vt x1 /tmp/mynullfile    View octal dump of a file

    ```


    Here''s another example of the dd command:


    ```

    $ dd if=/dev/zero of=/tmp/mynullfile count=10 bs=2

    10+0 records in

