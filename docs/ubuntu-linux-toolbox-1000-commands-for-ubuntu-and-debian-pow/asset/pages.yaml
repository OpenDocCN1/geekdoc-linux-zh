    # Using VNC on Untrusted Networks with SSH


    VNC is considered to be an insecure protocol. The password is sent fairly weak
    encryption, and the rest of the session is not encrypted at all. For that reason,
    when using VNC over an untrusted network or Internet, we recommend you tunnel
    over SSH.


    For a general description of how the SSH service works, refer to the “Remote Login
    and Tunneling with SSH” earlier in this chapter. To forward VNC display 2 (port
    5902) on the computer named myserver, to the same local port, the following:


    ```

    $ ssh -L 5902:localhost:5902 myserver

    ```


    > NOTE If you start using VNC routinely, you may want to look at tightvnc (in
    the package of the same name). Although it''s not included with Ubuntu, tightvnc
    is another open source implementation of the VNC protocol, under active development
    and with newer features and optimizations. These features include built-in ssh
    tunneling.


