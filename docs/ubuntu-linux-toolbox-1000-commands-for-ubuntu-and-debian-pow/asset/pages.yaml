    # Upgrading Packages with APT


    Over time, packages change, and new versions add new features and fix problems.
    You can use APT to upgrade your system to new versions following a two-step process.


    First, `check for updates` to the packages your Ubuntu system knows about using
    the update option to apt-get:


    ```

    $ sudo apt-get update

    ```


    This command searches the repositories for new versions of packages available
    for downloading and updates the list of packages and versions cached on your Ubuntu
    system.


    Second, upgrade the packages on your Ubuntu system using the `upgrade` option
    to apt-get.


    ```

    $ sudo apt-get upgrade

    ```


    You should always update the package list prior to upgrading packages, so it is
    a good idea to always run these commands together. Separate the commands with
    a semicolon to tell the shell to run them both, one after the other:


    ```

    $ sudo apt-get update; sudo apt-get upgrade

    Get:1 http://dl.google.com stable Release.pgp [189B]

    ```


    The following packages will be upgraded:

    app-install-data app-install-data-commercial apport apport-gtk bind9-host cajolets-data
    dbus dbus-1


    112 upgraded, 0 newly installed, 0 to remove and 3 not upgraded.

    Need to get 140MB of archives.

    After unpacking 3891kB of additional disk space will be used.

    Do you want to continue [Y/n]? n


    # Upgrading a Single Package with APT


    Upgrading a single package on Ubuntu is pretty straightforward using apt-get install
    `<package>`. You need to run this command with `sudo` to gain root permissions.
    The version is automatically updated to the newest available.


    > NOTE It may seem counterintuitive, but the upgrade option to apt-get upgrades
    all packages. The install option installs a new package or installs an upgrade
    to one or more specific packages.'
