  md: '# Chapter 7: Administering File Systems


    # Copying Partition Tables with sdfisk


    To backup or replicate a disk''s partition table, use sdfisk:


    ```

    $ sdfisk -d /dev/sda sda-table

    $ sdfisk /dev/sda < sda-table

    $ sdfisk -d /dev/sda | sdfisk /dev/dsb Copy partition table from disk

    ```


    # Changing Partition Tables with parted


    As with, parted can be used to list or change partitions. However, parted has
    a few other useful features as well. Here''s how to list partitions for a given
    disk, /dev/sda, with parted:


    ```

    $ sudo parted /dev/sda print

    Model: ATA FUJITSU MPG309A (scsi)

    Disk /dev/sda: 41.06GB

    Sector size (logical/physical): 512B/512B

    Partition Table: mdosn

    ```


    | Number | Start | End | Size | Type | File system | Flags |

    |---|---|---|---|---|---||

    | 1 | 32.3KB | 206MB | 206MB | primary | ext3 | boot |

    | 2 | 206MB | 39.5GB | 39.3GB | primary | ext3 | |

    | 3 | 39.5GB | 41.06GB | 156GB | primary | linux-swap |


    This listing shows you if you have a classic mdos disk table (partition table),
    or a gpt one. In this case, the partition table is mdos.


    To run interactively, type parted followed by the name of the storage device you
    want to work with (such as /dev/sda). Or, if you have only one storage device,
    simply type parted:


    ```

    $ sudo parted

    GNUed 1.7.1

    Using /dev/sda

    Welcome to GNU Parted! Type ''help'' to view a list of commands.

    (parted)

    ```


    To use parted interactively, type the command or starts with a few letters and
    use the Tab key to complete the command (as you would in the bash shell). If you''re
    really efficient, you can just type enough letters to allow parted to guess your
    input, as you would with Cisco IOS: for print, mk1 for mklabel, and so on.


    WARNING! Unlike fdisk, parted immediately incorporates changes you make to your
    partitions, without writing the changes to disk. So don''t just assume you can
    back out of any changes by simply quitting parted.'
