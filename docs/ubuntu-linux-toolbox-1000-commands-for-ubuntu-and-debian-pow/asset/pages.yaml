    # Chatting with Friends in IRC


    Despite the emergence of instant messaging, Internet Relay Chat (IRC) is still
    used by a lot of people today. Freenode.net has tons of rooms dedicated to supporting
    open source software projects. In fact, many people stay in them all day and just
    watch the discussions of their favorite Linux scrolls by. It is known as lurking.


    The xchat utility is a good graphical, multi-operating system IRC client. You
    can install just the xchat package or the GNOME bindings in the xchat-genome package.
    If you install the latter from Ubuntu, select Applications -> Internet -> XChat-GNOME
    IRC Chat. But the only way to edit IRC is to use a text-client in screen on an
    always-machine, such as an old server. Another similar option is to use an IRC
    proxy client, also known as bouncer (part of the dircproxy package).


    The original IRC client was irci. It allowed the addition of scripts — that automated
    some of the commands and increased usability. The most popular in productivity
    suites was PhoEniX by Vagasso. Then came BitBX, which started as an irci script
    and then became a full-blown client. Most people use irssi. To install and launch
    irssi from Ubuntu:


    ```

    $ sudo apt-get install irssi

    $ irssi -n JayJoe199x

    ```


    In this example, the user name (nick) is JayJoe199x (you should choose yours own).
    You will see a blue bar at the bottom of the screen indicating that if this is
    the first time you run irssi, the program will display help messages pointing
    you to the documentation. IRC commands are preceded with a / character. For example,
    to connect to the freenode server, type:


    ```

    /connect.freenode.net

