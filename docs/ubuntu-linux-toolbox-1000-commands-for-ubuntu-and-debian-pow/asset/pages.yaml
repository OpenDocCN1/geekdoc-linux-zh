  md: '# Chapter 5: Manipulating Text


    A regex search pattern can include a specific string of text (as a word such as
    Limux) or a location (such as the end of a line or the beginning of a word). It
    can also be specific (find just the word hello) or more inclusive (find any word
    beginning with h and ending with o).


    Appendix C includes reference information for shell metacharacters that can be
    used in conjunction with regular expressions to do the exact kinds of matches
    you are looking for. This section shows examples of using regular expressions
    with several different tools you encounter throughout this chapter.


    Table 5-1 shows some examples using basic regular expressions to match text strings.


    Many examples of regular expressions are used in examples throughout this chapter.
    Keep in mind that not every command that incorporates regex uses its features
    the same way.


    # Table 5-1: Matching Using Regular Expressions


    | Expression | Matches |

    |---|---|

    | a* | a, ab, abc, and aecijeh |

    | ^a | Any "a" appearing at the beginning of a line |

    | *a$ | Any "a" appearing at the end of a line |

    | a.c | Three-character strings that begin with a and end with c |

    | [bcf]at | bat, cat, or fat |

    | [a-d]at | aat, bat, cat, dat, but not Aat, Bat, and so on |

