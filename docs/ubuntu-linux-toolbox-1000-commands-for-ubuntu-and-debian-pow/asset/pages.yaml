    \ you need a tool to page through the text. The original Unix system pager was\
    \ the\ncommand:\n\n```\n$ ps auxw | more    Page through the output of ps (press\
    \ spacebar)\n$ more myfile.txt      Page through the contents of a file\n```\n\
    \nHowever, more has some limitations. For example, in the line with ps above,\
    \ more\ncould not scroll up. The less command was created as a more powerful and\
    \ user-friendly more. The common saying when less was introduced was: \"What is\
    \ less\n is more! We recommend you no longer use more, and use less instead.\n\
    \n> NOTE The command has another benefit worth noting. Unlike text editors\nsuch\
    \ as vi, it does not read the entire file when it starts. This results in faster\n\
    start-up times when viewing large files.\n\nThe less can be used with the same\
    \ syntax as in the examples\nabove:\n\n```\n$ ps auxw | less      Page through\
    \ the output of ps\n$ cat myfile.txt | less  Page through the contents of a file\n\
    $ less myfile.txt        Page through a text file\n```\n\nThe less enables you\
    \ to navigate using the up and down arrow keys, PageUp,\nDown, and the spacebar.\
