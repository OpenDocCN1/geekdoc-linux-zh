- img_proc: true
  md: '# Chapter 11: Managing Network Connections


    Instead of using your assigned name server, you can query a specific name server.
    The following example queries the DNS server at 4.2.2.1:


    ```

    $ dig www.turbosphere.com @4.2.2.1

    ```


    Using dig, you can also query for a specific record type:


    ```

    $ dig turbosphere.com mx Queries for the mail exchanger

    $ dig turbosphere.com ns Queries for the authoritative name servers

    ```


    Use the +trace option to trace a recursive query from the top-level DNS servers
    down to the authoritative servers:


    ```

    $ dig +trace www.turbosphere.com Recursively trace DNS servers

    ```


    If you just want to see the IP address of a host computer, use the +short option:


    ```

    $ dig +short www.turbosphere.com Display only name/IP address turbosphere.com.

    66.113.99.70

    ```


    You can use dig to perform a reverse lookup to find DNS information on an IP address:


    ```

    $ dig -x 66.113.99.70 Get DNS information based on IP address

    ```


    You can use host to do a reverse DNS lookup as well:


    ```

    $ host 66.113.99.70

    70.99.113.66-in-addr.arpa domain name pointer boost.turbosphere.com.

    ```


    To get hostname information for the local machine, use the hostname and dnsdomainname
    commands:


    ```

    $ hostname View the local computer''s full DNS host name

    boost.turbosphere.com

    ```


    You can also use hostname to set the local hostname temporarily (until the next
    reboot). Here''s an example:


    ```

    $ sudo hostname server1.example.com Set local hostname

    ```


    Changing the hostname of a running machine may adversely affect some running daemons.
    Instead, we recommend setting the local hostname so it is set every time the system
    starts up. Edit the first line in the /etc/hostname file. Here is an example:


    ```

    server1.example.com

    ```'
