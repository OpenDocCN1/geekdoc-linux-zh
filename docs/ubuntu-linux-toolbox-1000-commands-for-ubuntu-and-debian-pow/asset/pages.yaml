    # Adding Groups


    Each user is assigned to one or more groups. You can create at any time and add
    users to those groups. The permissions that each group has to use files and directories
    in Linux depend on how the group permissions are set on each item. Assigning users
    to a group allows you to attach ownership to files, directories, and applications
    so that users can work together on a project or have common access to resources.


    Commands similar to those for working with users are available for managing your
    groups. You can add groups (groupadd), change group settings (groupmod), delete
    groups (groupdel), and add and delete members from those groups (groupm). Here
    are some examples for adding new groups with the groupadd command:


    ```

    $ sudo groupadd                    Create new group with available GID

    $ sudo groupadd -g 1701 sales      Create new group with GID of 1701

    $ sudo groupadd -o -g 74 mysqld      Create group with existing GID

    ```


    With the groupmod command, you can change the name or group ID of an existing
    group. Here are examples:


    ```

    $ sudo groupmod -g 491 myadmin      Modify admin to GID 491

    $ sudo groupmod -n myad admin          Change name of admin group to myad

    ```


