  md: "# Reference Information in Ubuntu\n\nOriginal Linux and Unix documentation\
    \ was all done on manual pages, generally referred to as man pages. A slightly\
    \ more sophisticated documentation effort came a bit later with the GNU info facility.\
    \ Within each command itself, help messages are almost always available.\n\nThis\
    \ reference information is component oriented. There are separate pages for nearly\
    \ every command installed on the system. Man pages also document devices, file\
    \ formats, developer info, and many other components of a Linux system. Documentation\
    \ more closely aligned to whatever software packages is typically stored in a\
    \ subdirectory of the /usr/share/doc directory.\n\nUbuntu compresses much of this\
    \ documentation, so it needs to be uncompressed before it can be read. You can\
    \ use the gzip program to do this, but instruct gzip to only print the contents\
    \ of the file not decompress the files to disk. Here's the command to unzip the\
    \ documentation for the mount command:\n\n```\n$ gzip -dc /usr/share/doc/mount/README.mount.gz\n\
    mount/umount for Linux 0.97.3 and later.\n```\n\nThe man pages, info facility,\
    \ and /usr/share/doc directories are all available on most Linux systems.\n\n\
    # Using help Messages\n\nNearly all commands on a Linux system print some form\
    \ of brief usage information if asked to. Frequently, the way to ask for this\
    \ usage info is by way of the -h or --help argument to the command, and nothing\
    \ more. The following command shows how to ask the ls to print its usage information:\n\
    \n```\n$ ls --help\nUsage: ls [OPTION]... [FILE]...\n information about the FILES\
    \ (the current directory by default).\n```\n\nSince there is so much information\
    \ printed by the --help flag, you can again use a pager to limit the output to\
    \ one screen at a time:\n\n```\n$ ls --help | more\n```\n\n> The more command\
    \ is a popular pager command, which you will find on every Unix system. Linux\
    \ systems favor a command called less which is whimsically named and ironically\
    \ more functional than the more command. It allows paging backwards in the output\
    \ as well as forwards, allows the use of the arrow keys to scroll, and understands\
    \ vi editor keystrokes for navigating and searching through text."
