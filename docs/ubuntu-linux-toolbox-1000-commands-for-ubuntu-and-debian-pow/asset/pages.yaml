  md: '# A


    # Using vi or Vim Ed Editors


    Although easy-to-use graphical text editors (such as gedit and kedit) are readily
    available with Linux, most power users use vi or Emacs to edit text files. Besides
    the fact that vi and Emacs will work from any shell (no GUI required), they offer
    other advantages such as unlike your hands having to leave the keyboard and integration
    with useful tools. Unlike GUI editors, text-based editors are usable over Internet
    connections such as dial-up or satellite.


    | IN THIS APPENDIX |

    | Using the vi editor |

    | Starting/quitting the vi editor |

    | Moving around in vi |

    | Changing and deleting text |

    | Using Ex commands |

    | Using visual mode |


    This appendix focuses on features of the vi editor that can not help you with
    basic editing, but also help you do some advanced manipulation. We chose to cover
    vi than Emacs because vi is more universal and leaner, and also because keyboard
    shortcuts require two arms. Because many Linux systems use the Vim (Vi Improv)
    editor in place of the older vi editor, the descriptions in this appendix are
    extended to cover Vim as well. Some features in Vim that are not in vi we include
    multiple undo levels, syntax highlighting, and online help.


    > NOTE If you have never used vi or Vim before, try out the tutor that comes with
    the vim-enhanced package. Run the vimutor command and follow the instructions
    to step through many of the key features of vi and Vim.


    # Starting and Quitting the vi Editor


    If you want to experiment with using vi, you should copy a text file to practice
    on. For example, type:


    ```

    $ cp /etc/passwd /tmp

    ```


    Then open that file using the vi command as follows:


    ```

    $ vi /tmp/passwd

    ```'
  merge: -1
