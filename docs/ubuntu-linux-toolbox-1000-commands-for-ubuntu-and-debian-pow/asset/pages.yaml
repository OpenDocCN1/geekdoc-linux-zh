  md: '# 9


    # # Checking and Managing Running Processes


    When an executable program starts up, it runs as a process that is under the management
    of your Linux system''s process table. Linux provides all the tools you need to
    view and change the processes running on your system.


    The ps and top commands are great for viewing information on your running processes.
    There are literally dozens of options to ps and top to help you view process information
    exactly the way you want. The pgrep command can further find the process you want.


    There are commands such as nice and renice for raising and lowering priority for
    a process. You can move processes to run in the background (bg command) or back
    to the foreground (fg command).


    Sending signals to a process is a way of changing its behavior or killing it.
    Using the kill and killall commands, you can send signals to processes by PID
    or name, respectively. You can also send other signals to processes to do such
    things as reada configuration files or continue with a stopped process.


    To run commands at scheduled times or when they are not tied to your shell session,
    you can use the at and batch commands. To run commands repetitively at set times,
    there are the cron and anacron facilities. Or you can drop scripts (or symbolic
    links to scripts) into /etc/cron.hourly (cron.daily, cron.weekly, or cron.monthly).


    # IN THIS CHAPTER


    +   * Viewing active processes with ps and top


    +   * Searching for processes with pgrep


    +   * Adjusting CPU priority with nice and renice


    +   * Moving processes to the background (bg) or foreground (fg)


    +   * Killing and signaling processes with kill and killall


    +   * Using at and batch to run commands


    +   * Scheduling commands to run repeatedly with cron'
  merge: -1
  pgno: 197
