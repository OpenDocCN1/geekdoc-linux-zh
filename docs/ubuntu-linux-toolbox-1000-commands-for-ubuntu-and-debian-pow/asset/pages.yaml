  md: '# 13


    # Doing Remote System Administration


    Most professional Linux administrators do not run a graphical interface on their
    Internet servers. As a result, you need to access other computers for Virtual
    administration, you will almost surely need to work from the command line at some
    time. Luckily there are many feature-rich Linux commands to help you do so.


    | IN THIS CHAPTER |

    | Configuring SSH |

    | Using SSH for remote tunneling |

    | Using SSH to do tunneling |

    | Using SSH to provide proxy service |

    | Using SSH with private keys |

    | Using screen remote multiplexing terminal |

    | Access remote Windows desktops |

    | Sharing remote Linux desktops with VNC |


    Tools associated with the Secure Shell (SSH) service not only allow remote login
    and file transfer, but they also allow encrypted communication to keep your remote
    administration work. With tools such as Virtual Network Computing (VNC), you can
    have a server''s remote desktop appear on your local client computer. This and
    other features for doing remote systems administration are described in this chapter.


    # Doing Remote Login and Tunneling with SSH


    Linux''s big brother Unix grew up on university networks. A time when the only
    users of these networks were students and professors, and with networks mostly
    isolated from each other, there was little need for security.


    Applications and protocols that were designed in those times (the 1970s and 1980s)
    reflect that lack of concern for encryption and authentication. SMTP is a perfect
    example of that. This is also true of the first generation of Unix tools: telnet,
    ftp (file transfer protocol), rsh (remote shell), rcp (remote copy), rexec (remote
    execution), and login (remote login). These tools send user credentials and traffic
    in clear text. For reason, they are very dangerous to use on the public, untrusted
    Internet, and have become mostly deprecated and replaced with the Secure Shell
    (SSH) commands (ssh, scp, sftp commands and related services).'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# Chapter 13: Doing Remote System Administration


    Although there are still uses for the legacy remote commands (see the “Using Legacy
    Communications Tools” sidebar, most of this section describes how to use SSH commands
    to handle most of your needs for remote communications commands.


    # Using Legacy Communications Tools


    Despite the fact that SSH provides better tools for remote communications, legacy
    communications commands, sometimes referred to as “r” commands, are still included
    with most Linux distributions. Some of these tools perform faster than equivalent
    SSH commands because they don’t need to encrypt. So some old-school Unix administrators
    may use them occasionally on remote nets or in old scripts. Although the first
    part you should ignore these legacy remote commands, one of them in particular
    can be useful in some cases: telnet.


    The telnet command is still used to communicate with network appliances (routers,
    switches, UPSes, and others) that do not have the horsepower to run an ssh daemon.
    Even it poses a security risk, appliance manufacturers include telnet support.


    One way to use the telnet command, however, is for troubleshooting many Internet
    protocols such as POP3, SMTP, HTTP, and others. Under the hood, the plain-text
    protocols are automatically telnet sessions when a client (such as a browser or
    mail user agent) exchanges with a server. The only difference is the TCP port
    use. Here is an example of how you could telnet to the HTTP port (80) of a web
    server:


    ```

    $ telnet www.example.com 80

    Trying 208.77.188.166...

    Connected to www.example.com.

    Escape character is ''^''.

    GET / HTTP/1.0

    ```


    ```

    Enter a second carriage return here

    HTTP/1.1 200 OK

    ```


    Similarly, you can telnet to a mail server on port 25 (SMTP) and 110 (POP3) and
    issue the proper commands to the telnet command to troubleshoot network protocols,
    refer to Linux Troubleshooting Bible (ISBN 07465997X, Wiley Publishing, 2004),
    pages 505 and 508.


    If you need to exit your telnet session, use the escape sequence (Ctrl+) by default.
    This will stop sending your keyboard input to the remote end and bring you to
    telnet’s command prompt where you can quit or ? for more options.


    # Configuring SSH


    Nowadays, the Swiss army of remote system administration is Secure Shell (SSH).
    SSH commands and services replace all the old tools and add strong encryption,
    public keys, and many other features. The most common implementation of SSH in
    the Linux world is OpenSSH (www.openssh.com), maintained by the OpenBSD project.
    OpenSSH provides both client and server components.'
