  md: '# Chapter 7: Administering File Systems


    # Table 7-1: File System Types Supported in Linux (continued)


    | File System Type | Description |

    |---|---|

    | vfat | Extended FAT (VFAT file system). Useful when file systems need to share
    files with older Windows systems (as with dual booting or removable drives).

    | xfs | Journaling file system for high-performance environments. Can scale up
    to systems that include multiple terabytes of data that transfer data at multiple
    gigabytes per second. |


    Besides the file system types listed in the table, there are also what referred
    to as network shared file systems. Locally, a network shared file system may be
    ext3, nfs, or other normal file system type. However, all or part of those systems
    can be shared with network protocols such as Samba (smbfs or cifs file system
    type), NFS (nfs), and NetWare (ncfs).


    Many available file systems are either not useful for creating new systems or
    not fully supported in every version of Linux. For example, file systems such
    as min (for Minix), bfs (for MacOS systems), and affs (for Amiga systems) are
    mostly useful if you need to mount and access old backup media from those systems.
    Even popular file systems may not be fully supported. For example, file systems
    isn''t fully supported, as of this writing, by the Kubuntu variant of Ubuntu.


    # Creating and Managing File Systems


    Ubuntu gives you the option of either having the installer create a default partitioning
    and file system scheme or letting you all manually when you first install Linux.
    The installer lets you choose to erase the entire hard disk, erase only Linux
    partitions, or use free disk space to set up the partitions. To make the manual
    approach instead, you must choose to create a custom layout.


    With the manual approach, the disk-partitioning tool (formerly Disk Druid) lets
    you decide the hard disk into partitions as you choose. Later, there are a lot
    of command-line utilities you can use to change and work with your disk partitions
    and the file systems created on those partitions.


    # Partitioning Hard Disks


    Historically, PC hard drives have used a 32-bit PC-BIOS partition table with a
    Master Boot Record (MBR). This limits partition sizes to 2TB and only allows four
    primary partitions per drive. The use of extended partitions is a way to overcome
    the four primary partition limit. In order to overcome the 2TB limit, PC-BIOS
    partition tables are being replaced with GPT (GUID Partition Tables).'
