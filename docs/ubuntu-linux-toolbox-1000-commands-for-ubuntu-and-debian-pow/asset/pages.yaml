  md: '# Chapter 11: Managing Network Connections


    With Ad-Hoc mode, the network is composed of only interconnected clients with
    no central access point. In Managed/Infrastructure mode, by setting ap to a specific
    MAC address, you can force the card to connect to the access point at that address,
    or you can set ap to any allow connections to any access point.


    If you have performance problems, try adjusting the sensitivity (sens) to either
    a negative value (which represents dbm) or positive value (which is either a percentage
    or a sensitivity value set by the vendor). If you get retransmission failures,
    you can increase the retry value so you can send many packets before failing.


    Use the key option to set an encryption key. You can enter hexadecimal digits
    (XXXX-XXXX-XXXX-XXXX or XXXXXXXX). By adding an s: in front of the key, you can
    enter an ASCII string as the key (in s:M927pwd).


    # Using Dial-up modems


    Although high-speed DSL, cable modem, and wireless LAN hardware have become widely
    available, there may still be times when a phone line and a modem are your only
    way to get on the Internet. Linux offers both graphical and command line tools
    for configuring and communicating with modems.


    With other network connections in Ubuntu, dial-up modem connections can be configured
    using the Network Configuration Window. Most external serial modems will work
    with Linux without any special configuration. Most hardware PCI modems will also
    work. However, many software modems (sometimes called Winmodems) often will not
    work in Linux (although some can be configured with special drivers, and are therefore
    referred to as Linmodems).


    Instead of describing the contortions in Linux, you must go through to get some
    Winmodems working in Linux, we recommend that you purchase a modem that connects
    to an external serial port or a hardware modem. If you want to configure your
    Winmodem yourself, refer to the Linmodems site (www.linmodems.org).


    If you are not able to get your modem working from the Network Configuration Window,
    there are some commands you can use. First try the wvdialconf command to scan
    any modems connected to your serial ports and create a configuration file:


    ```

    $ sudo wvdial.conf /etc/wvdial.conf Scan serial ports, create config file

    Scanning your serial ports for a modem.

    ```


    ```

    ttyS0: ATQ0 V1 El1 OK

    ttyS0: ATQ0 V1 El1 Z OK

    ```


    In this example, a modem was found on the COM1 port (serial port /dev/ttyS0).

    Further output should show which speeds are available and various features that
    are'
