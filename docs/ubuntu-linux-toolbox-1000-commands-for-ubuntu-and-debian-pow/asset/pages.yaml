- img_proc: true
  md: '# Chapter 8: Backups and Removable Media


    # # Burning Backup Images with cdrecord


    The cdrecord command is the most popular Linux command tool for burning CD and
    DVD images. After you have created an ISO image (as described earlier) or obtained
    one otherwise (such as downloading an install CD or live CD from the Internet),
    cdrecord makes it easy to put that on a disc.


    **NOTE** In Ubuntu, cdrecord has been replaced by the wodim command which was
    created from the cdrecord code base and still supports most of the options. If
    you run cdrecord, you will actually be running wodim in this Ubuntu release. If
    you have problems with that utility, contact the CDRik project (http://cdrik.org).


    There is no difference in making a CD or DVD ISO image, aside from the fact that
    a DVD image obviously be bigger than a CD image. Check the media you have for
    their capacities. A CD can typically hold 650MB, 700MB, or 800MB, whereas mini
    CDs can hold 50MB, 180MB, 185MB, or 193MB. Single-layer DVDs hold 4.7GB, while
    double-layer DVDs can hold 8.4GB.


    **NOTE** Keep in mind, however, that CD/DVD manufacturers list their capacities
    based on 1000KB per MB, instead of 1024KB. Type --size home.iso to list the size
    of your ISO, instead of du -sh as you normally, to check if the ISO will fit on
    the media you have.


    Before you begin burning your image to CD or DVD, check that your drive supports
    CD/DVD burning and determine the address of the drive. Use the --scan option to
    cdrecord do that:


    ```

    $ cdrecord --scanbus

    Shows a drive that cannot do burning

    scbius0:

    0,0, 0) ''SAMSUNG'' ''DVD-ROM SD-616E'' ''F503'' Removable CD-ROM

    0,0, 1) *

    0,0, 2) *

    ```


    ```

    $ cdrecord --scanbus

    Shows a drive that can burn CDs or DVDs

    scbius0:

    0,0, 0) ''LITE-ON'' ''DVDRW SOHW-1633S'' ''BS0C'' Removable CD-ROM

    0,0, 1) *

    0,0, 2) *

    ```


    In the two examples shown, the first indicates a CD/DVD drive that only supports
    reading and not CD-ROM. The second example shows a drive that can burn CDs or
    DVDs (DVDRW). Insert the medium you want to record on. Assuming your drive can
    burn the media you have, here are some cdrecord commands for burning a CD or DVD
    images:


    ```

    $ cdrecord -dummy home.iso

    Test burn without actually burning

    $ cdrecord -v home.iso

    Burn CD (default settings) in verbose

    ```


    165'
  merge: -1
