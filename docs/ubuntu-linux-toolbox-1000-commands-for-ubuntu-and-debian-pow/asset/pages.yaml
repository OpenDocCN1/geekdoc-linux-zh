  md: '# Acquiring Super User Power


    When you open a shell, you are able to run commands and access files and directories
    based on your user/group ID and the permissions set for these components. Many
    system features are restricted to the *root* user, also referred to as the *super
    user*.


    There are three main ways to acquire super user power:


    +   - Log in as the root user.

    - Temporarily become the root user with the `su` command.

    - Run one command with root user privileges with the `sudo` command.


    In most cases, you do not want to log in as the root user, as you may accidentally
    make changes to your system that you do not intend. Most Linux users use either
    the `su` command to change the root user from a normal login or run the `sudo`
    command to execute a single command as the root user.


    Ubuntu Linux is set up to run the `sudo` command. So, in most cases, to run an
    administrative command (such as `useradd` to add a new user), you would proceed
    that command with the `sudo` command. For example:


    ```

    $ sudo useradd -m joe      # As user, add a new user named joe

    ```


    By default, Ubuntu restricts the system such that the root user cannot log in.
    Because of this, Ubuntu is not set up to use the `su` command, which is normally
    used on other Linux systems, to change to the root user.


    If you find that you need to run a series of commands as root user, you could
    type the following command to open a shell as the root user:


    ```

    $ sudo bash               # Open a shell as root user

    #

    ```


    If you decide that you want to add a password for the root user (allowing you
    to log in as the root or use the `su` command to temporarily become root), you
    can also do that using the `sudo` command:


    ```

    $ sudo passwd root      # Set the root user''s password

    ```


    Most Ubuntu desktop users, however, simply use `sudo` and never set a root password.


    # Using the su Command


    If you decide at some point to add a password to your root user account, with
    a shell open as a regular user, you can use the `su` (super user) command to become
    the root user. You can also use the `su` command to switch to a different, non-root
    user. The following sections describe how the `su` command works.'
  merge: -1
