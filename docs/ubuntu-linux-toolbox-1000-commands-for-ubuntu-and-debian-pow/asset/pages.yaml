    # Streaming Music


    If your music is on one machine, but you''re working from another machine, setting
    up a streaming server is a quick way to broadcast your music so it can be picked
    up from one or more computers on your network. The icecast streaming media server
    and ices audio source client can be installed in Ubuntu by typing:


    ```

    $ sudo apt-get install icecast ices2

    ```


    Here''s a quick and dirty procedure for setting up icecast and ices to stream
    your music. Perform this task on the computer that contains the music you want
    to serve:


    +   1. Edit the /etc/icecast2/icecast.xml file to change all passwords listed.
    Search for hackme to find the current passwords. You might want different user
    and administrative passwords, especially if you allow others to stream music to
    the server. Remember the passwords you set for later. You may want to change other
    settings in this file as such as hostname:


    ```

    $ sudo vi /etc/icecast2/icecast.xml

    ```


    +   2. If you have a firewall, check if TCP port 8000 is accessible.


    +   3. Start the icecast2 server as root user by typing the following (the server
    will actually run as the icecast user), and verify with the netstat command:


    ```

    $ sudo /etc/init.d/icecast2 start

    $ netstat -topanel | grep 8000

    tcp 0 0 0.0.0.0:8000 0.0.0.0:* LISTEN

    111 35790 21494/icecast off (0/0/0))

    ```'
