  md: '# # Chapter 7: Administering File Systems


    # ## Removing LVM Logical Volumes and Groups


    To remove an LVM logical volume from a volume group, use the lvmremove command
    as follows:


    ```

    $ sudo lvmremove /dev/vgsub/lvm_ul1

    Do you really want to remove active logical volume "lvm_ul"? [y/n]: y

    Logical volume "lvm_ul" successfully removed

    ```


    To remove an existing LVM volume group, use the vgremove command:


    ```

    $ sudo vgremove vgsub

    Volume group "vgsub" successfully removed

    ```


    There are many ways to work with LVM. Refer to the LVM HOWTO for further information
    (http://tldp.org/HOWTO/LVM-HOWTO/).


    # ## Summary


    Creating and managing file systems in Linux is a critical part of Linux system
    administration. Linux contains support for several standard Linux file system
    types (ext2, ext3, reiserfs, and others). It can also create and manage Windows
    file system types (VFAT, NTFS, and so on) as well as legacy and specialty Linux
    and Unix file system types (such as minix, jfs, and xfs).


    You can partition hard disks with commands such as fdisk and parted. Tools for
    working with file systems include those that create file systems (mkfs), view
    and modify file system attributes (tune2fs and dumpe2fs), mount/unmount file systems
    (mount and ummount), and check for problems (badblocks and fsck). To see how much
    space has been used in file systems, use the df and du commands.


    150'
