    # # Working with Debian Software Packages


    If you prefer to use a GUI tool for installing software, the Synaptic Package
    Manager is available from the desktop or an ssh session using the `-X ssh session`
    to tunnel X11 (Chapter 13). The aptitude utility provides a few curses (text-based)
    front end to APT when run with no arguments. A front end for the dpkg utility,
    dselect (debian.org/doc/manuals/dselect-beginner), is also available on Debian
    system, but can be difficult to operate


    To learn more about the Debian package formats and tools, consult the Debian Programmers
    Manual (www.debian.org/doc/manuals/programmer) and the Debian FAQ (www.debian.org/FAQ/ch-pkg_basics.html).


    Ubuntu uses the Debian package format (an archive), which is a standard method
    for packaging software for Debian-based systems. By gathering software components
    in Debian packages (.deb extension) software can not only carry a self-contained
    archive of the software, it can also hold lots of information about the contents
    of the package. This metadata can include software descriptions, dependencies,
    computer architecture, vendor, size, licensing, and other information.


    When a Ubuntu system is installed, you can add, remove and manage .deb files to
    suit how you use that system. Ubuntu, Kubuntu, Xubuntu, Eduntu, and most other
    Debian-based systems use .deb files to install the build of the software on the
    system. The aptitude tool should work well for most day-to-day software needs;
    however, many other tools for managing these packages exist, and you may need
    to use some of them occasionally.


    +   * APT — Use Apt to download and install packages from online repositories.
    The APT commands (apt-get, apt-cache, and so on) can be used to install packages
    locally. However, it''s normally used for working with online software.'
