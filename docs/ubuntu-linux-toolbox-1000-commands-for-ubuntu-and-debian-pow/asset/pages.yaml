    # Verifying Installed Packages with debsims


    There are times when you will question the behavior of a binary or package installed
    on the system. It may not perform correctly, or not even start at all. Problems
    with corrupt packages from unstable network connections or power outages do happen.
    In addition, malicious users may attempt to replace powerful commands with their
    own versions to cause further harm. It becomes useful to check the files on the
    file system against the information stored in the package.


    The debsums program is a utility for Ubuntu and other Debian-based systems that
    checks the MD5 sums of every installed package against the md5sum files found
    in /var/lib/dpkg/info directory.


    Install this program with the following command:


    ```

    $ sudo aptitude install debsums

    ```


