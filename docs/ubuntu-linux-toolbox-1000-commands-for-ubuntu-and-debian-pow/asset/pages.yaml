- img_proc: true
  md: '# Chapter 10: Managing the System


    The advantages of commands such as halt, reboot, poweroff, and shutdown are that
    they include options to let you stop some features before shutdown occurs. For
    example:


    > **WARNING!** Don''t try the following commands if you don''t intend to actually
    turn off your system, especially on a remote system.


    ```

    $ sudo reboot           Reboot the computer

    $ sudo halt -n           Don''t run to sync hard drives before shutdown

    $ sudo halt -h            Put hard drives in standby mode before halting

    $ sudo shutdown 10      Shutdown in ten minutes after warning the users

    $ sudo shutdown -r 10   Reboot in ten minutes after warning the users

    $ sudo shutdown 10 ''Bye!''  Send custom message to users before shutdown

    ```


    Besides the **reboot** and **init** 6 commands, you can also use the old PC keystrokes
    Ctrl+Alt+Del to reboot your computer.


    # # Straight to the Kernel


    In general, when the kernel starts up on your Linux system, you shouldn''t have
    to do too much with it. However, there are tools for checking the kernel that
    is in use and for seeing information about how the kernel started up. Also, if
    something goes wrong or there is some extra support you need to add to the kernel,
    there are tools to do those things.


    To find out kernel is running on your system, use the following:


    ```

    $ uname -r               Display name of kernel release

    2.6.20-16-generic

    $ uname -a               Display all available kernel info

    Linux server.domain.com #2 SMP Fri Aug 31 00:55:27 UTC 2007 i686 GNU/Linux

    ```


    When the kernel starts, messages about what occurs are placed in the kernel ring
    buffer. You can display the contents of the kernel buffer using the dmesg command:


    ```

    $ dmesg [less

    [ 000000 Linux version 2.6.20-16-generic (root@terranova) (gcc version 4.1

    .2 (Ubuntu 4.1.2-ubuntu4)) #2 SMP Fri Aug 31 00:55:27 UTC 2007 (Ubuntu 2.6.20-1

    6.31-generic)

    [ 000000 BIOS-provided RAM map:

    [ 000000 sanitize start

    [ 000000 sanitize end

    [ 000000

    [ 15.935761] CPU: L1 cache: 32K, L D cache: 32K

    [ 15.935763] CPU: L2 cache: 2048K

    [ 15.935765] CPU: Physical Processor ID: 0

    [ 15.935767] CPU: Processor Core ID: 0

    [ 15.935768] CPU: After all inits, caps: febebff 20100000 00000000 0003940 0

    00eebd 00000000 00000001

    ```


    205'
