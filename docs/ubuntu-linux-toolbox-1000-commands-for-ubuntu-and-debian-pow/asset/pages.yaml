    # Summary


    If you find yourself in a position where you need to administer multiple Linux
    systems, you have a rich set of commands with Linux for doing remote system administration.
    The Secure Shell (SSH) facility offers encrypted communications between clients
    and servers for remote login, tunneling, and file transfer.


