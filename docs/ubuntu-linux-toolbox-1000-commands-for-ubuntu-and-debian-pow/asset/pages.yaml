    \ sources added to the image. Here are some examples:\n\n```\n$ mkisofs -o home.iso\
    \ -R -J music/ docs/ \\    Multiple directories/files\nchris.pdf /var/spool/mail\n\
    $ mkisofs -o home.iso -J -R            Graft files on to the image\n-graft-points\
    \ Pictures=/usr/share/pixmaps/ \\ \n/home/chris\n```\n\nThe first example shows\
    \ various files and directories being combined and placed on the root of the ISO\
    \ image. The second example grafts the contents of the /var/pics directory into\
    \ the /home/chris/Pictures directory. As a result, the CD image /Pictures directory\
    \ will contain all content of the /usr/share/pixmaps directory.\n\nAdding information\
    \ into the header of the ISO image can be useful if you identify the contents\
    \ of that image. This is especially useful if the image is saved or distributed\
    \ online, without a physical disk you can write on. Here are some examples:\n\n\
