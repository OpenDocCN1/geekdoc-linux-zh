  md: '# Chapter 4: Working with Files


    This command line finds files that have not been accessed in /home/chris for more
    than 60 days:


    ```

    $ find /home/chris/ -atime +60

    ```


    Use the -type option to find directories. The following command line finds all
    directories under /etc and redirects stderr to the bit bucket (/dev/null):


    ```

    $ find /etc -type d -print 2 /dev/null

    ```


    This command line finds files in /bin with permissions that match 750:


    ```

    $ find /bin/ -perm 750 -print

    ```


    (which match none in a default Ubuntu installation.)


    The exec option to find is very powerful, because it lets you act on the files
    found with the command. The following command finds all the files in /var owned
    by the user francois (must be a valid user) and executes the ls -1 on each one:


    ```

    $ find /var -user francois -exec ls -1 {} \

    ```


    An alternative to find''s exec option is xargs:


    ```

    $ find /var -user francois -print | xargs ls -1

    ```


    There are big differences on how the two commands shown operate, leading to very
    different performance. The find -exec spawns the ls for each result it finds.
    The xargs command works more efficiently by passing many results as to a single
    ls.


    To negate a search criteria, place an exclamation point (!) before criteria. The
    next example finds all the files that are not writable by your group and are regular
    files, and then does an ls -1


    ```

    $ find ! -group root -type f -print 2 > /dev/null | xargs ls -1

    ```


    The next example finds the files in /sbin that are regular and not writable by
    others, then feeds them to an ls -1 command:


    ```

    $ find /sbin -type f ! -perm -o -print | xargs ls -1

    -rwxr-xr-x 1 root root 3056 2007-03-07 15:44 /sbin/acpi_available

    -rwxr-xr-x 1 root root 43204 2007-02-18 20:18 /sbin/asactl

    ```


    Finding files by size is a great way to determine what is filling up your hard
    disks. The following command line finds all files that are greater than 10 MB
    (+10M), lists files from largest to smallest (ls -S) and directs that list to
    a file (/tmp/bigfiles.txt):


    ```

    $ find -xdev -size +10M -print | xargs ls -S > /tmp/bigfiles.txt

    ```'
