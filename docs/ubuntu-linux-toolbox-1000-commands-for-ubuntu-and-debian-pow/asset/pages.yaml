  md: '# Chapter 1: Starting Ubuntu Linux


    The login screen and autumn-colored theme of a default Ubuntu system set apart
    from other distributions as well. When you drop down the menus of an Ubuntu desktop,
    you are not presented with a huge list of applications and utilities. What you
    get is a simpler and elegant mixture of the best and most functionals available
    for the Linux desktop. This approach is characteristic of Ubuntu and is done with
    the intent of keeping the user from feeling overwhelmed.


    Another unique characteristic of a Ubuntu system is the intentional practice of
    locking the root account, and instead implementing the use of `sudo` (www.gratisofus/sudo/intro.html),
    which allows you to run one command with root permissions, for system administration
    tasks (see Chapter 3 for details on the sudo command). The root login on a Linux
    system has privileges that allow unrestricted access to nearly every component
    of the system. It would be trivial to remove an entire file system as the root
    user, so Ubuntu tries to limit this use to only when it is prudent. Most Linux
    distributions require the user to log in or use `sudo` to perform administrative
    tasks, however a user on Ubuntu does this through sudo using their own password,
    and not a separate for the root user.


    Ubuntu has unique features that have their advantages and disadvantages, they
    are far from limiting. Ubuntu has tools in place to allow you to customize, modify,
    experiment, and hack your own content if that is what you want to do. The idea
    is to be an easily maintainable, secure system with a clear and concise application
    set which is neither limiting nor overwhelming. This makes Ubuntu a very fluid
    system so you can jump right in and become familiar with it very quickly.


