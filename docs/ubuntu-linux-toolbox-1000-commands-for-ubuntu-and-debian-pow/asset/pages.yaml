    # Displaying netstat Connections and Statistics


    The tools above cover network troubleshooting mostly at the network layer (layer
    3). To display information about packets sent between transport-layer protocols
    (TCP and UDP), and ICMP, you can use the netstat command:


    ```

    $ netstat -s | less         Show summary of TCP, ICMP, UDP activities

    ```


    You can see a list of all TCP connections, which process is handling the connection:


    ```

    $ sudo netstat -t           View active TCP connections

    Active connections (servers and established)

    Proto Recv-Q Send-Q Local Address Foreign Address State PID/Program name

    tcp 0       0 127.0.0.1:631 0.0.0.0:* LISTEN 2039/cupsd

    tcp 0       0 127.0.0.1:25 0.0.0.0:* LISTEN 2088/sendmail

    ```


    You can also view UDP connections as follows:


    ```

    $ sudo netstat -uamp         View active UDP connections

    Active connections (servers and established)

    Proto Recv-Q Send-Q Local Address Foreign Address State PID/Program name

    udp 0       0 0.0.0.0:631 0.0.0.0:* 2039/cupsd

    udp 0       0 192.168.121.123 0.0.0.0:* 2067/ntpd

    ```'
