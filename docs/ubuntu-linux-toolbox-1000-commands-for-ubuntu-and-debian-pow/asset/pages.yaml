    # Using LVM Volumes


    To use the new volume just created, represented by /dev/mapper/vgusb-lvm_1, create
    a mount point (/mnt/ul) and mount the volume. Then use df to check the available
    space:


    ```

    $ sudo mkdir /mnt/ul

    $ sudo mount -t ext3 /dev/mapper/vgusb-lvm_ul /mnt/ul

    $ df -m /mnt/ul

