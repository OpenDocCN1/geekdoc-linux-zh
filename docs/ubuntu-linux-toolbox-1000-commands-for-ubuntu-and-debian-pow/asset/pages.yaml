  md: '# Chapter 12: Accessing Network Resources


    And if you''d like wget to keep the original file and also do the translation,
    type this:


    ```

    $ wget -pkK http://www.wiley.com  Rename to local names, keep original

    ```


    Sometimes an HTML file download does not have an .html extension, but ends in
    .asp or .cgi instead. That may result in your browser not knowing how to open
    your local copy of the file. You can have wget append .html to those files using
    the -O option:


    ```

    $ wget -O http://www.examples.com  Append to downloaded files

    ```


    With the wget command, you can recursively mirror an entire web site. While copying
    files and directories for the entire depth of the server''s file structure, the
    -m option adds timestamping and keeps FTP directory listings. (Use with caution,
    because it can take a lot of time and space.)


    ```

    $ wget -m http://www.linuxutoys.net

    ```


    Using some of the options described, the following command line results in the
    most usable local copy of a web site:


    ```

    $ wget -mEkK http://www.linuxutoys.net

    ```


    If you have a large file download (as a CD or DVD image file) disconnected before
    it, you may find the -c option wget to be a lifesaver. Using -c, wget resumes
    where it left off, continuing an interrupted download. For example:


    ```

    $ wget http://example.com/DVD.iso  Begin downloading large file

    95%======= 668,251,583 K/s  Download killed before completion

    $ wget -c http://example.com/DVD.iso  Resume download where stopped

    ```


    HTTP request, awaiting response... 206 Partial Content

    Length: 699,389,952 (667), 691,513 (66M) remaining [text/plain]


    Because of the continue (-c), wget can be particularly useful for those with slow
    internet connections needing to download large files. If you have ever had a several-hour
    download killed just before it finished, you''ll know what we mean. (Note that
    if you don''t use the -c when you resume a file download, the file will be saved
    to a different file: the original name with a .1 appended to it.)


    # Transferring Files with cURL


    The client for URLs application (curl command) provides similar features to wget
    for transferring files using web and FTP protocols. However, the curl command
    can also transfer files using other popular protocols, including SSH protocols
    (SCP and SFTP), LDAP, DICT, Telnet, and file.'
