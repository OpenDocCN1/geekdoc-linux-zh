  md: '# Chapter 2: Installing Ubuntu and Adding Software


    Several other Linux distributions also use packaging systems similar to APT. Red
    Hat-based/derived distributions (including CentOS, Fedora, and Mandriva) have
    tools such as rpm, yum, and smart to manage software. Although these tools are
    quite different from the Ubuntu uses, they are similar; a configuration file is
    set up to the packaging tool where online to find the latest software packages.
    The packaging tool works in conjunction with an installer to get the software
    on your system.


    This system of having an online package fetcher (so to speak) and a back-end packaging
    tool is a very powerful combination to resolve dependency issues, digitally authenticate
    software integrity, easily keep a system up to date, and allow distribution maintainers
    to distribute changes simply and on a large scale.


    # Enabling More Repositories for apt


    In previous releases of Ubuntu, the multiverse and universe repositories were
    not enabled by default. These repositories now come enabled by default with Ubuntu,
    so updating and searching for software will turn up many options. One concern
    you may have, however, is that support, licensing, and patches may not be available
    for the multiverse and universe repositories. This could be a problem if you are
    considering an installation where you need to adhere to policies and procedures.


    To disable the universe or multiverse repositories, open the file /etc/apt/sources.list
    in a text editor and comment out the lines which have multiverse or universe components
    enabled. You may want to init the comments to make note of what you commented
    out, as shown by the #cn in the following examples:


    ```

    #cn deb http://archive.ubuntu.com/ubuntu/ feisty universe

    #cn deb-src http://archive.ubuntu.com/ubuntu/ feisty universe

    #cn deb http://archive.ubuntu.com/ubuntu/ feisty multiverse

    #cn deb-src http://archive.ubuntu.com/ubuntu/ feisty multiverse

    #cn deb http://security.ubuntu.com/ubuntu feisty-security universe

    #cn deb-src http://security.ubuntu.com/ubuntu feisty-security universe

    #cn deb http://security.ubuntu.com/ubuntu feisty-security multiverse

    #cn deb-src http://security.ubuntu.com/ubuntu feisty-security multiverse

    ```


    Likewise, if you want to add extra repositories that are offered by individuals
    or companies, you can do so by adding a line to the /etc/apt/sources.list file.
    To edit this file, you will have root permissions:


    ```

    $ sudo vi /etc/apt/sources.list

    ```


    Insert a line starting with (for pre-built packages) or deb-src (for source packages),
    then the URL for the repository, along with the distribution (as feisty above),
    and the component descriptions (universe in the examples). Typically, you''ll
    describe components as contrib for contributed (that is not from the Ubuntu project)
    and free or non-free. Normally, you should receive all information from the site
    that offers the repository.'
