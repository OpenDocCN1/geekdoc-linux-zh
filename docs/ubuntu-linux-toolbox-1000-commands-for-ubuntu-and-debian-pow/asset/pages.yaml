    # Monitoring Memory Use


    Few things will kill system performance faster than running out of memory. Commands
    such as free and top let you see basic information about how your RAM and swap
    are being used. The vmstat command gives detailed information about memory usage
    and can run continuously. The slabtop command how much memory the kernel (slab
    cache) is consuming.


    The free command provides the quickest way to see how much memory is being used
    on your system. It shows the total amount of RAM (Mem) and swap (Swap), along
    with the amount being used. Here are examples of the free command:


    | | total used free shared buffers cached |

    |---|---|---|---|---||

    | Mem: | 724276 | 725108 | 17368 | 0 | 153388 | 342544 |

    | -+/buffers/cache: | 229176 | 513300 | | | |


    ```

