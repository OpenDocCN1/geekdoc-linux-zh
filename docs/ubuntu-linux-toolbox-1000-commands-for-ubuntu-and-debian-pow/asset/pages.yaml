  md: '# Chapter 1: Starting with Ubuntu Linux


    Because Debian and Ubuntu are open systems with many parts built on the GNU General
    Public License (www://www.gnu.org/copyleft/gpl.html), anyone is free to take the
    GPL-based source code, or any part of the GPL''d system and copy, modify, strip,
    build down upon, extend, embed, reverse-engineer, and freely distribute those
    or modifications. The only requirement is that you abide by the terms of the GPL,
    which basically states that any changes you make to making GPL works must be available
    for others to utilize in the same way (see www.debian.org/social_contract for
    other licenses Debian recognizes).


    In the end, you have not only a superior system with a free, worldwide support
    base, but a product which is constantly evolving and driven by a person for what
    they do. Many other Linux distributions offer these same advantages; how-ever,
    Ubuntu has completely pulled out in front of them.


    > NOTE Ever wonder where Ubuntu (Edgy Eft) and Debian (Woody) get odd naming conventions
    from? Find out at https://wiki.ubuntu.com/DevelopmentCodeNames or www.debian.org/doc/manuals/project-history/ch-releases.en.html.


    # Ubuntu Compared to Other Linux Distributions


    If you log into the command line of both an Ubuntu system and a Red Hat Enterprise
    Linux or Fedora system, very little will look different. There are common directories
    and utilities between the two, and functionality is fundamentally the same. So
    what makes Ubuntu different from other Linux distributions? One difference is
    the installer.


    The complexity of booting and installing Ubuntu has been narrowed down to a handful
    of mouse clicks, making many of the install decisions automatic based on as to
    what the average user may need and want. In contrast, a Red Hat system presents
    the user with many install options, such as setting up a workstation or server,
    individually selecting packages to install, and setting administrative options.


    Another major difference among Linux distributions is in software management tools.
    The aim of the utilities and packaging systems is the same as Debian for other
    Linux distributions, however the operation and implementations are significantly
    different. Ubuntu and most other Debian-based systems use the APT (Advanced Package
    Tool) for utilities of managing software. You use APT to install, remove, query,
    and update Debian (deb) packages. Red Hat uses an RPM packaging system to handle
    the tasks with its rpm packages.


    Another big difference is that the systems look in regards to initialization,
    login screen, desktop, wallpaper, icon set, and more. From this look-and-feel
    perspective, there are a lot of differences. Although Red Hat and Ubuntu both
    use the GNOME desktop as the default Window Manager, the GUI tools used for administering
    the system and their locations on the drop-down menus are entirely different.'
