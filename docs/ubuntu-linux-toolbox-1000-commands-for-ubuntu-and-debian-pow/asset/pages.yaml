  md: '# Chapter 4: Working with Files


    The dashes represent ext2/ext3 attributes that can be set. None are by default.
    Those attributes are the following: a (append only), c (compressed), d (no dump),
    i (immutable), j (data journalling), s (secure deletion), t (no tail-merging),
    u (undeletable), A (no time updates), D (synchronous directory updates), S (synchronous
    updates), and T (top of directory hierarchy). You can change these attributes
    using the chatter command. Here are some examples:


    ```

    $ sudo chatter whatever.iso

    $ sudo chatter -A -R /home/francois/images/*

    $ sudo chatter -d ubuntu-7.04-desktop.i386.iso

    $ lsattr whatever.iso /home/francois/images/* ubuntu-7.04-desktop.i386.iso

    ------iwhatever.iso

    ------A/home/francois/images/einstein.jpg

    ------A/home/francois/images/goth.jpg

    ------dubuntu-7.04-desktop.i386.iso

    ```


    As shown in the previous example, with the +i option set, the whatever.iso becomes
    immutable, meaning it can''t be deleted, renamed, or changed, or have a link created
    to it. Here, this prevents any arbitrary changes to the file. (Not even the root
    user can change the file until the i attribute is gone.) You can use this to help
    protect system files.


    The -R option in the example recursively sets the +A option, so all files in the
    images directory cannot have access times (atime record) modified. Setting A allows
    disk I/O on laptops or flash drives. If you use the dump command to back up your
    ext2/ext3 file systems, the +d option can prevent selected files from being backed
    up. In this case, we chose not to have a large image backed up.


    To remove an attribute with chatter, use the sign (-). For example:


    ```

    $ chatter -i whatever.iso

    ```


    > NOTE Crackers successfully break into a machine will often replace some binaries
    (such as ls or ps) with corrupt versions and make them immutable. It''s a good
    idea to occasionally check the attributes set for your executables (in /bin, /usr/bin,
    /sbin, and /usr/sbin, for example).


