    $ sudo mkfs -t ext3 -c /dev/sdb1      More verbose and scan for bad blocks

    $ sudo mkfs -t ext3 -c /dev/sdb1      Same result as previous command

    ```


    If you would to add a partition label to the new partition, use the -L option:


    ```

    $ sudo mkfs.ext3 -c -L partition /dev/sdb1 Add partition label

    ```


