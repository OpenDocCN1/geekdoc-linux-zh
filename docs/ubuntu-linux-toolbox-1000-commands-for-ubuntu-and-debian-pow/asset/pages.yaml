    As mentioned earlier, ethtool may not work on some older NICs. If you have an
    older NIC, try using mii-tool as follows:


    ```

    $ mii-tool Show negotiated speed and link status of old NIC

    eth0: negotiated 10BaseTx-FD flow-control, link ok

