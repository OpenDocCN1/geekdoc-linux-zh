    the machine you are scanning. The -p 100-200 option tells nmap to scan only ports
    100 through 200:


    ```

    $ sudo nmap -vv -P0 -p 100-200 10.0.0.1 No ping, OS fingerprint, ports 100-200

    ```


    The nmap command has a more options for advanced usage. Refer to the nmap man
