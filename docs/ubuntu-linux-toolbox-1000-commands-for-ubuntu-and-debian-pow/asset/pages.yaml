    # Backing Up with Unison


    Although the rsync command is used to back up one machine to another, it assumes
    the machine being backed up is the only one where the data is being modified.
    What if you have two machines that modify the same file and you want to sync those
    files? Unison is a tool that will let you do that.


    It''s common for people to work with the same documents on their laptop and desktop
    systems. These machines might even run different operating systems. Because Unison
    is a cross-platform application, it can sync files that are on both Linux and
    Windows systems. To use Unison in Ubuntu, you must install the unison package
    (type the sudo apt-get install unison command).


    With unison, you can define two roots representing the two paths to synchronize.
    Those roots can be local or over ssh. For example:


    ```

