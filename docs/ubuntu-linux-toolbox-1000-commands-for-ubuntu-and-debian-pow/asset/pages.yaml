    # Extracting Files from a .deb File with dpkg


    Debian and Ubuntu packages bundle into single files, .deb files. Each .deb file
    contains one or more files that make the package itself, such as a pre-built binary,
    support files, documentation, and perhaps the source code. So, a .deb file is
    basically an archive of files that you want to install to your computer, plus
    some header and control information that identifies the software (descriptions,
    checksums, build information, and so on). You can extract a lot of this information
    on a package with the dpkg command. The example extracts the files from the .deb
    file residing in the current directory for the rsync package to a directory /tmp/


    ```

    $ mkdir /tmp/rsync_contents

    $ sudo dpkg -x rsync_2.6.9-3ubuntu1_i386.deb /tmp/rsync_contents

    $ ls /tmp/rsync_contents/

    etetc

    ```


    You can replace the file rsync_2.6.9-3ubuntu1_i386.deb in the above command with
    any .deb file you download.


