    # Changing Disk Partitions with fdisk


    The fdisk command is a useful Linux tool for listing and changing disk partitions.
    Keep in mind that deleting partitions can cause valuable data to be removed, so
    be sure of your changes before writing them to disk. To use the fdisk command
    to list information about the partitions on your hard disk, type the following
    command as root:


    ```

    $ fdisk -l  List disk partitions for every disk

    Disk /dev/sda: 82.3 GB, 8234827760 bytes

    255 heads, 63 sectors/track, 10011 cylinders

    Units = cylinders of 10065 * 512 = 8225280 bytes

    ```


    | Device | Start | End | Blocks | Id | System |

    | /dev/sda | 1 | 13 | 104391 | 83 | Linux |

    | /dev/sda2 | 14 | 9881 | 7926410 | 83 | Linux |

    | /dev/sda3 | 9882 | 10011 | 1044225 | 82 | Linux swap |


    This example is for a 80GB hard disk that is divided into three partitions. The
    first (/dev/sda1) is a small /boot partition that is configured as a Linux ext
    file system (Id 83). Note the asterisk (*), indicating that the first partition
    is bootable. The final partition is assigned to the root file system and is also
    ext3. Linux swap.


    > NOTE Since version 2.6.0 of the Linux kernel, both IDE and SCSI disks device
    names /dev/sd?, where the ? is replaced by a letter (a, b, c, and so on). In older
    versions of Ubuntu, only SCSI disks and USB flash drives use /dev/sd names. Ubuntu
    hard drives use /dev/hdX instead.


    If multiple disks are present, fdisk -l will list them unless you use the specific
    disk you want:


    ```

    $ fdisk /dev/sda  List disk partitions for a specific disk

