    # Summary


    There are dozens of commands for exploring and working with files in Linux. Commands
    such as chmod can change the permissions associated with a file, whereas commands
    that include lsattr and chattr can be used to list and change file attributes
    that are associated with ext2 and ext3 file systems.


    To move around the file system, people use the cd command most often. However,
    to move repeatedly among the same directories, you can use the pushd and popd
    commands to work with a stack of directories.


    Copying files is done with the cp command. However, the dd command can be used
    to copy files (such as disk images) from a device (such as a CD-ROM drive). For
    creating directories, you can use the mkdir command.


    Instead of keeping multiple copies of a file on the file system, you can use symbolic
    links and hard links to have multiple file names to the same file or directory.
    Symbolic links can be anywhere in the file system, while hard links must exist
    on the same partition that the original file is on.


    To search for files, Linux offers the locate and find commands. To verify the
    integrity of files you download from the Internet, you can use the md5sum and
    sha1sum commands.'
