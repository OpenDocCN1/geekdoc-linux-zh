  md: "# Chapter 11: Managing Network Connections\n\nAssuming that your wireless card\
    \ is up and running, there are some useful commands in the wireless-tools package\
    \ you can use to view and change settings for your wireless cards. In particular,\
    \ the iwconfig command can help you work with your wireless LAN interfaces. The\
    \ following scans your network interfaces for supported wireless cards and lists\
    \ their current settings:\n\n```\n$ iwconfig\neth0 no wireless extensions.\neth\
    \      IEEE 802.11-DS SSID:\"\" Nickname:\"HERMES I\"\n        Mode:Managed Frequency:2.457\
    \ GHz Access Point: Not-Associated\n        Bit Rate:0 Mb/s Tx-Power:15 dBm Sensitivity:1/3\n\
    \        Retry limit:4 RTS:off Fragment thr:off\n        Encryption key:off\n\
    \        Power Management:off\n```\n\nWireless interfaces may be named wlanX or\
    \ eth, depending on the hardware and driver used. You may be able to obtain more\
    \ information after setting the link up on the wireless interface:\n\n```\n$ ip\
    \ link eth up\n$ iwconfig eth 802.11-DS SSID:\"\" Nickname:\"HERMES I\"\n    Mode:Managed\
    \ Frequency:2.457 GHz Access Point: None\n    Bit Rate:0 Mb/s Tx-Power:15 dBm\
    \ Sensitivity:1/3\n    Retry limit:4 RTS:off Fragment thr:off\n    Encryption\
    \ key:off\n    Power Management:off\n    Link Quality:0/92 Signal level=133/153\
    \ Noise level=134/153\n    Rx invalid wid:0 Rx invalid crypt:0 Rx invalid frag:0\n\
    \    Tx excessive retries:0 Invalid misc:0 Missed beacon:0\n```\n\nThe settings\
    \ you chose can be modified in a lot of ways. Here are some ways to use iwconfig\
    \ to modify your wireless interface settings. In the following examples, we operate\
    \ on a wireless interface named wlan0. These operations may or not be supported,\
    \ depending on which wireless card and driver you are using:\n\n```\n$ iwconfig\
    \ wlan0 ssid \"MyWireless\" Set ssid to MyWireless\n$ iwconfig wlan0 channel 3\
    \ Set the channel to 3\n$ iwconfig wlan0 mode Ad-Hoc Change from to Ad-Hoc mode\n\
    $ iwconfig wlan0 ap any Use any access point available\n$ iwconfig wlan0 sens\
    \ -50 Set sensitivity to -50\n$ iwconfig wlan0 retry 20 Set MAC retransmissions\
    \ to 20\n$ iwconfig wlan0 key 1234-5555-66 Set encryption key to 1234-5555-66\n\
    ```\n\nThe ssid is sometimes called the Network Name or Domain ID. Use it as common\
    \ name to identify your wireless network. Setting the channel lets your wireless\
    \ LAN operate on that specific channel.\n\n221"
