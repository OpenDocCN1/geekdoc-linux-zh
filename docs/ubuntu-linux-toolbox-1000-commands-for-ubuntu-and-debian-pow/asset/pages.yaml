  md: '# Chapter 3: Using the Shell


    Unless otherwise specified, `sudo` runs as root. Ubuntu Linux uses the `sudo`
    command to execute privileged commands, rather than the `su` command.


    The **sudo** command is configured in /etc/sudoers.


    > **WARNING!** Never edit this file with your normal text editor. Instead, always
    use the visudo command.


    The file `/etc/sudoers` is restricted, so you need to use the `sudo` command to
    edit the file. For example:


    ```

    $ sudo visudo

    ```


    The `visudo` command launches an editor, by default the nano editor, discussed
    previously.


    If you look at the `sudoers` file that was shipped with your distribution, you''ll
    see different empty sections delimited by comments and one active statement:


    ```

    root    ALL=(ALL) ALL

    ```


    This means that the root user is allowed on all hosts to run any command as any
    user.


    Ubuntu Linux adds the following so that all users who are part of the admin group
    can acquire root privileges:


    ```

    %admin ALL=(ALL) ALL

    ```


    When you installed Ubuntu Linux, the account you created was automatically added
    to this group. To allow additional users to acquire root privileges, add the following
    line, setting the first field to the user account on your system:


    ```

    fcaen ALL=/usr/bin/less /var/log/messages

    ```


    > **NOTE** The preceding setting allows this to run the `less` command with root
    privileges, as the `less` command can allow this security issue, user to gain
    more information on the system by examining other system files.


    Now fcen (or whichever user you''ve added) can do the following:


