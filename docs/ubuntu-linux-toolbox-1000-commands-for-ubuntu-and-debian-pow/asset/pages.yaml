  md: '# Chapter 13: Doing Remote System Administration


    To install the OpenSSH server, run the following command:


    ```

    $ sudo apt-get install openssh-server

    ```


    Here are a few facts about SSH:


    +   - For Windows, you can use the Linux SSH tools within Cygwin (www.cygwin.com).
    But unless you''re using Cygwin (a Linux-like environment for Windows), we recommend
    PuTTY (www.chiark.greenend.org/uk/sgatatham/putty). PuTTY is a powerful open source
    Telnet/SSH client.


    +   - Use version 2 whenever possible, because it is the most secure. Some SSHenabled
    applications may only support older, less secure versions. OpenSSH supports all
    versions. Older versions of Ubuntu accepted ssh v1 and v2 connections. Newer accept
    version 2 by default.


    +   - In Ubuntu, run /etc/init.d/ssh start to start the SSH service (sshd daemon).
    To configure the service, edit the /etc/ssh/ssh_config file.


    +   - To configure the ssh client, edit the /etc/ssh/ssh_config file.


    If you prefer to use graphical tools to manage your remote Linux system, you can
    enable X11 Tunneling (also called X11 Port Forwarding). With X11 Tunneling enabled
    on both the SSH client and server), you can start an X application on the server
    and have it displayed on the client. All communication across that is encrypted.


    Ubuntu comes with X11 turned on (X11Forwarding yes) for the server (sshd daemon).
    You still need to enable it on the client side. To enable X11 forwarding on the
    client for a one-time session, connect with the following command:


    ```

    $ ssh -X francois@myserver

    ```


    To enable X11 forwarding permanently for all users, add ForwardX11 yes to /etc/ssh/sshd_config.
    To enable it specifically for a specific user, add the -X option is no longer
    required to use X11 Tunneling. To test that the tunneling is working, run xclock
    after ssh''into the remote machine, and it should appear on your client desktop.


    SSH Tunneling is an excellent way to securely use remote graphical tools!


    # Logging in Remotely with ssh


    To securely log to a remote host, you can use either of two different syntaxes
    to specify the user name:


    ```

    $ ssh -l francois myserver

    $ ssh francois@myserver

    ```'
