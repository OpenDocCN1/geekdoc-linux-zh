    # Checking Address Resolution Protocol (ARP)


    If you''re not to ping your gateway, you may have an issue at the Ethernet MAC
    layer. The Address Resolution Protocol (ARP) can be used to find information at
    the MAC layer. View and configure ARP entries, use the arp or ip neighbor commands.
    This example shows arp listings in the ARP cache by hostname:


    | List ARP cache entries by name |

    | Address | Hwtype | HWAddress | Flags Mask | Iface |

    | --- | --- | --- | --- | --- |

    | ritchie | ether | 00:10:5a:b6:fa:7 | C | eth0 |

    | einstein | ether | 00:0b:6a:02:ec:98 | C | eth0 |

    | Entries: 1 | Skipped: 0 | Found: 1 | | |


    In this example, you see the names of other computers that the local computer''s
    ARP cache knows about and the associated hardware type and hardware (MAC address)
    of each computer''s NIC. You can disable name resolution to see those computers''
    IP addresses:


    | List ARP cache entries by IP |

    | Address | Hwtype | HWAddress | Flags Mask | Iface |

    | --- | --- | --- | --- | --- |

    | 10.0.0.1 | ether | 00:10:5a:b6:fa:7 | C | eth0 |

    | 10.0.0.50 | ether | 00:0b:6a:02:ec:98 | C | eth0 |

    | Entries: 1 | Skipped: 0 | Found: 1 | | |


    To delete an entry from the ARP cache, use the -d option:


    ```

    $ sudo arp -d 10.0.0.50      delete 10.0.0.50 from ARP cache

    ```


    Instead of just learning ARP dynamically learn about other systems, you can add
    static ARP entries to the cache using the -s option


    ```

    $ sudo arp -s 10.0.0.51 00:0b:6a:02:ec:95      Add IP and MAC addresses to ARP

    ```


    To do the actions with the ip that you just added with the command, use the neighbor
    object (note that neighbor, nei, and n objects can be used interchangeably):


    ```

    $ ip neighbor

    10.0.0.1 dev eth0 lladdr 00:10:5a:b6:fa:7 DELAY

    10.0.0.50 dev eth0 lladdr 00:0b:6a:02:ec:98 REACHABLE

    # ip del 10.0.0.50 dev eth0

    # ip add 10.0.0.51 lladdr 00:0b:6a:02:ec:95 dev eth0

    ```'
