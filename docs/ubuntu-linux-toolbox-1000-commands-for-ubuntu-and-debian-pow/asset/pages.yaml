    # # Managing Network Connections


    Starting and stopping the network interfaces for your wired Ethernet connections
    to your LAN or the Internet is usually handled automatically at the time you boot
    and shut down your Ubuntu system. However, you can use the commands in /etc/init.d
    to start and stop your network interfaces any time you want or update-rc.d to
    configure-whether your network starts automatically.


    ifconfig and ip commands can also be used to configure, activate, and deactivate
    interfaces. However, on Ubuntu and other Debian derivatives, the commands in the
    /etc/init.d directory provide simpler tools to stop network interfaces. Therefore,
    in most cases, you should only use ifconfig and ip commands to gather information
    about your Ethernet interfaces and NICs (as shown later in this section).


    # ## Starting and Stopping Ethernet Connections


    The reason that your Ethernet interfaces come up in many cases when you boot Ubuntu
    is that the network service is set to be on when the system enters the common
    run levels (run levels 3 and 5). There is a set of underlying configuration files
    and scripts that make that happen and a few simple commands let you control it.


    For Ubuntu, control scripts and configuration files are located in the /etc/network/
    directory. NICs are configured by editing /etc/network//interfaces. The file looks
    like the following:


    ```

    auto lo

    iface lo inet loopback


    auto eth0

    iface eth0 inet dhcp

    ```'
