    # Conventions


    To help you get the most from the text and keep track of what''s happening, we''ve
    used a number of conventions throughout the book. In particular, we have created
    styles for showing commands that allow us to fit as as many command lines as possible
    in the book.


    With command examples, computer output (shell prompts and messages) is shown in
    regular monospaced text, computer input (the stuff you type) is shown in bold
    monospaced text, and a short description (if included) appears in italics. Here
    is an example:


    ```

    $ ls *jpg      List all JPEG files in the current directory

    hat.jpg

    dog.jpg

    ...

    ```


    To save space, output is sometimes truncated (or skipped altogether). Three dots
    (...) are used to indicate that additional output was cut. If a command is particularly
    long, backslashes will appear at the end of each line to indicate that input is
    continuing to the next line. Here is an example:


    ```

    # eggenc NewSong.wav -o NewSong.ogg \

    -a Bernstein -G Classical \

    -d 06/15/1972 -t "Simple Song" \

