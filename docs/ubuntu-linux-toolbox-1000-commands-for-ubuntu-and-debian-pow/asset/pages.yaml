  md: '# 3


    # Using the Shell


    The use of a shell command interpreter (usually just called a shell) dates back
    to the early days of the first Unix systems. Besides its obvious use of running
    commands, shells have many built-in features such as environment variables, aliases,
    and a variety of functions for programming. Although the shell used most with
    Linux systems is called the Bourne Again Shell (bash), other shells are available
    as well (such as csh, ksh, tsh, and others). In many cases, shells, such as bash,
    are reality symbolic links to other shell programs, such as `/bin/bash`. The sh
    shell is important as it is called in most shell scripts as the shell to run scripts.
    For interactive usage, bash forms the default shell.


    | IN THIS CHAPTER

    Accessing the shell

    Using command history and completion

    Assigning aliases

    Gaining super user access

    Writing simple shell scripts |


    This chapter offers information that will help you use Linux shells, in general,
    and the bash shell, in particular.


    # Terminal Windows and Shell Access


    The most common way to access a shell from a Linux graphical interface is using
    a Terminal Window. From a graphical interface, you can often access virtual terminals
    to get to a shell. With no graphical interface, with a text-based login you are
    typically dropped into a shell after login.


    # Using Terminal Windows


    To open a Terminal window from GNOME (the default Ubuntu desktop), select Applications
    ⇧ Terminal. This opens a gnome-terminal window, displaying a bash shell prompt.
    Figure 3-1 shows an example of a gnome-terminal window.


    Commands shown in Figure 3-1 illustrate that the current shell is the bash (/bin/bash),
    the current user is the desktop user who launched the window (chris), and the
    current directory is that user''s home directory (`/home/chris`). The user name
    (chris) and hostname (localhost) appear in the title bar.'
