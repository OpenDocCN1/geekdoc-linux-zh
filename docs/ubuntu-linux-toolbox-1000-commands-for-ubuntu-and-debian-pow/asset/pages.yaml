  md: '# Chapter 9: Checking and Managing Running Processes


    Note that after the at or batch commands you see a secondary at> prompt. Type
    the command you want to run at that prompt and press Enter. After that, you can
    continue to enter commands. When you are, press Ctrl+d on a line to queue the
    commands you entered to run.


    After the commands are entered, you can check the queue of jobs that are set to
    run by the atq command:


    ```

    $ atq

    11 Wed Sep 5 21:10:00 2007 a francois

    10 Fri Aug 24 21:10:00 2007 a francois

    8 Thu Aug 23 20:53:00 2007 a francois

    ```


    Regular users can only see their own jobs at queued. The root user can see everyone''s
    queued jobs. If you want to delete a job from the queue, use the atm command:


    ```

    $ atrm 11 Delete at job number 11

    ```


    The at and batch commands are for queuing a command to run as a one-shot deal.
    You can use the cron facility to set up commands to run repeatedly. These commands
    are scripted into crontab files. There is one system crontab file (/etc/crontab).
    Also, each user can create a personal crontab file that can launch commands at
    times that the user chooses. To create a personal crontab file, type the following:


    ```

    $ crontab -e Create a personal crontab file

    ```


    The crontab -e command opens your crontab file (or creates a new one) using the
    vi editor. Here are examples of several entries you could add to a crontab file:


    ```

    15 8 * * Mon,Tue,Wed,Thu,Fri chris < /var/project/stats.txt

    * * 1 1,4,7,10 * find | grep .doc > /var/sales/documents.txt

    ```


    The first crontab example shows a mail message to the user named chris by directing
    the contents of /var/project/stats.txt into that message. That mail command is
    run daily from Friday at 8:15 a.m. In the second example, of January, April, July,
    and October, the cron command runs to look every .doc file on the system and sends
    the list of files to /var/sales/documents.txt.


    The last part of each crontab entry is the command that is run. The first five
    fields represent the time and date: minute (0 to 59), hour (0 to 23), day of the
    month (0 to 31), month (0 to 12 or Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep,
    Oct, Nov, Dec), and day of the week (0 to 7 or Sun, Mon, Tue, Wed, Thu, Fri, Sat).
    An asterisk (*) in a field means to match any value for that field.'
