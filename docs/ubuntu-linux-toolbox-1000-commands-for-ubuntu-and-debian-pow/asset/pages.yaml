    # Tracing to Hosts


    After verifying that you can ping your gateway and reach machines that are out
    of your network, you may still have issues reaching a specific host or network.
    That''s true, you can use *traceroute* (the traceroute package) to find the bottleneck
    or point of failure:


    ```

    # traceroute boost.turbosphere.com Follow the route taken to a host

    traceroute boost.turbosphere.com (66.113.99.70) 30 hops max,40 byte packets

    1 10.0.0.1 (10.0.0.1) 0.281ms 0.289ms 0.237ms

    2 tl-03.hbci.com (64.211.114.114) 6.213ms 6.189ms 6.083ms

    3 172.172.17.253 (172.172.172.2) 14.070ms 14.025ms 13.974ms

    4 so-0-3-2.ar.MIN.gblix (208.448.117) 19.076ms 19.053ms 19.004ms

    5 so-1-0-2488M.RA.SEAI.gblix.net (67.171.71.210) 94.697ms 94.668ms 94.612ms

    6 64.215.31.114 (64.215.31.114) 99.643ms 101.647ms 101.577ms

    7 dr02-v109.tac.opticfusion.net (209.147.112.50) 262.306ms 233.316ms 233.153ms

    8 dr01-v100.tac.opticfusion.net (66.113.96.1) 99.913ms 99.401ms 99.953ms

    9 boost.turbosphere.com (66.113.99.70) 99.251ms 96.225ms 100.220ms

    ```


    As you can see, the hop between 4 (Global Crossing probably in Minneapolis) and
    5 (GC in Seattle). That gap is not really a bottleneck; it reflects the difference
    between those hops. Sometimes, the last hop looks like this:


    +   * 28 *

    * 29 *

    * 30 **


    The asterisks (*) at the end of the trace can be caused by firewalls that block
    traffic to the target. However, if you see asterisks before the destination, this
    can indicate heavy congestion or equipment failures and point to a bottleneck.


    By default, *traceroute* uses UDP packets, which provides a more realistic performance
    than ICMP. That is some Internet hops give lower'
