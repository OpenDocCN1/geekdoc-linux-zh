  md: '# # Chapter 5: Manipulating Text


    # ## Finding Text in Binaries with Strings


    Sometimes you need to read the ASCII text that is inside a binary file. Occasionally,
    you can learn a lot about an executable that way. For those occurrences, use strings
    to **extract all the human-readable ASCII text**. The **strings** command is part
    of the binutils package, and is installed by default on Ubuntu. Here are some
    examples:


    ```

    ```

    $ strings /bin/ls | grep -i libc Find occurrences of libc in ls

    $ cat /bin/is | strings List all ASCII text in ls

    $ strings /bin/ls List all ASCII text in ls

    ```

    ```


    # ## Replacing Text with sed


    Finding text within a file is sometimes the first step towards replacing text.
    Editing streams of text is done using the **sed** command. The **sed** command
    is actually a full-blown scripting language. For the examples in this chapter,
    we use basic text replacement with the **sed** command.


    If you are familiar with text replacement in vi, **sed** has some similarities.
    In the following example, *sed* will **replace only the first occurrence per line
    of francois with chris**. *Sed* takes its input from a pipe, while sending its
    output to stdout (screen):


    ```

    ```

    $ cat myfile.txt | sed s/francois/chris/

    ```

    ```


    Adding a **g** to the substitution line, as in the following command, causes every
    occurrence of francois to be changed to chris. Also, in the following example,
    input is directed from the myfile.txt and output is directed to myfile.txt:


    ```

    ```

    $ sed s/francois/chris/g < myfile.txt > myfile.txt

    ```

    ```


    The next example replaces the first occurrences of the text /home/bob to /home2/bob
    from /etc/passwd file. (Note that this command does not change that, but outputs
    the changed text.) This is useful for the case when user accounts are migrated
    to a new directory (presumably on a new disk), named home2. Here, we have to use
    quotes and backslashes to escape the forward slashes so they are not interpreted
    as:


    ```

    ```

    $ sed ''//home/bob//home2/bob/g'' < /etc/passwd

    ```

    ```


    Although the forward slash is the **sed** command''s default delimiter, you can
    change the delimiter to any character of your choice. Changing the delimiter can
    make your life easier when the string contains slash. For example, the previous
    command line that contains a path could be replaced with either of the following
    commands:


    ```

    ```

    $ sed ''s/-/home/bob/-home2/bob/-'' < /etc/passwd

    $ sed ''sD/home/bob/D/home2/bob/D'' < /etc/passwd

    ```

    ```


    102'
