  md: '# # Introduction


    The huge, enthusiastic Ubuntu community has swept up thousands and thousands of
    new Ubuntu Linux users. If you are one of them, you will probably soon find yourself
    wanting to dig beneath the surface of Ubuntu’s applications and graphical tools.
    You’ll want to become a power user.


    Becoming a power user with any Linux system means being able to work from the
    command line. Few graphical interfaces will provide you with the options and flexibility
    you commands that address the same features.


    Ubuntu Linux Toolbox provides you with more than 1000 specific command lines to
    help you dig deeply into Linux. Whether you are a systems administrator or desktop
    user, the book will show you commands to create file systems, troubleshoot networks,
    lock down security, and dig out almost anything you care about your Linux system.


    This book’s focus is for your Linux command-line journey is Ubuntu, the community-based
    Linux distributed by Canonical Ltd., and the Debian/Linux system on which it is
    based. Tapping into the skills needed to run your systems can help you work with
    your own Linux systems and learn what you need as a Linux professional.


    # ## Ubuntu Takes Linux by Storm


    Since its inaugural release in 2004, Ubuntu (www.ubuntu.com) has become the most
    popular and, arguably, best loved of the Linux distributions. From its name, translates
    to humanity toward others, to its focus on support for many languages and special
    needs, Ubuntu has reflected its ideals of spreading freedom beyond the Standard
    target markets of geeks and corporate servers.


    The Ubuntu project does everything it can to help new users into its Linux-based
    operating system. Ubuntu live CDs let a new user try out Ubuntu before installing
    it. If you likes Ubuntu, a single click can start an Ubuntu install to hard disk.
    And because Ubuntu is based on Debian GNU/Linux, Ubuntu has been able to make
    massive amounts of software from the Debian software repositories free to Ubuntu
    users.


    Although it’s true that Ubuntu focuses on ease-of-use desktop systems, that doesn’t
    mean Ubuntu has no commercial Linux value. In fact, Canonical offers enterprise-quality
    support for its systems through its Canonical Global Services team (www.ubuntu.com/support/paid).
    Canonical also offers training to help you become an Ubuntu Training Partner (www.ubuntu.com/support/training).
    In other words, there are professional opportunities for those who learn to operate
    Ubuntu.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# # Introduction


    # # Who Should Read This Book


    This book is for anyone who wants to access the power of a Linux system as a systems
    administrator or user. You may be a Linux enthusiast, a Linux professional, or
    possibly a computer professional who is increasingly finding the Windows systems
    in your data centered by Linux boxes.


    The bottom line is that you want to find and efficient ways of getting Ubuntu
    and other Debian-based systems working at peak performance. Those systems may
    be a few desktop systems at work, a file and print server at your school, or a
    home server that you''re doing just for fun.


    In the best case, you should already have some experience with Linux. However,
    if you are a computer professional with skills managing other types of operating
    systems, such as Windows, you should be able to adapt your knowledge to be able
    to use the specific commands we cover in the book.


    # # What This Book Covers


    This is not a beginner’s Linux. Before you jump in, it would be best if you have
    a basic working knowledge of what Linux is, how the shells work, and what processes,
    systems, and network interfaces are. The book will supplement that with information
    you need to do the following:


    +   **Get software** — Ubuntu offers the Add/Remove Applications GUI tool for
    getting software. With tools such as apt-get, you''ll learn the best ways to search
    for, download, install, update, and otherwise manage software from the command
    line.


    +   **Use the shell** — Find neat techniques and tips for using the shell.


    +   **Play with multimedia** — Play and stream multimedia content from your computer.
    You can also modify audio and image files, and then convert the content of those
    files to different formats.


    +   **Work with files** — Use, manipulate, convert, and secure a wide range of
    file types in Linux.


    +   **Administer file systems** — Access, format, partition, and monitor your
    storage hardware (hard disks, CD/DVD drives, floppy disks, USB flash drives, and
    so on). Then create, format, and check the file systems that exist on those hardware
    devices.


    +   **Backup and restore data** — Use simple commands to gather, archive, and
    compress your files into efficient backup archives. Store those archives locally
    or on remote computers.


    +   **Work with processes** — List running processes in a variety of ways, such
    as by CPU use, process owner or process ID. Then change processes to have them
    run in the background or foreground. Send signals to processes to have them re-read
    configuration files, stop and resume processing, or stop completely (abort).'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Introduction


    +   - Manage the system — Run commands to check system resources, such as memory
    usage, run levels, boot loaders, and kernel modules.


    +   - Monitor networks — Bring wired, wireless, and dial-up network connections
    up and down. Check routing, DNS, and host information. Keep an eye on network
    traffic.


    +   - Get network resources — Connect to Linux and Windows remote file systems
    using FTP, NFS, and Samba facilities. Use shell-based commands to browse the Web.


    +   - Do administration — Access and administer other computers using remote login
    (ssh, telnet, and so on), and screen. Learn about remote administration interfaces,
    such as Webmin, SWAT, and CUPS.


    +   - Lock down security — Set up firewalls and system logging to secure your
    Linux systems.


    +   - Get reference information — Use the appendix at the end of this book to
    get more information about the shell (such as metacharacters and shell variables)
    and the state of the system (/proc).


    Hopefully, if we have done it, it will be easier to use this book than to Google
    for the command lines or GUI tools you need.


    After you have mastered many of the features described in this book, you will
    have gained the following advantages:


    +   - Hundreds of commands — By compressing a lot of information into a small
    space, you will have access to hundreds of useful commands, in over 1000 command
    lines, in a handy format to carry with you.


    +   - Critical Linux information — This book lists connections to the most critical
    information on the Web for succeeding in Linux and Ubuntu in particular.


    +   - Transferable knowledge — Most of the commands and options you use in Ubuntu
    will work exactly the same way on other Linux systems. Linux distributions, on
    the other hand, offer different graphical administration tools. And even with
    a particular distribution, graphical tools change more often than commands do.


    +   - Quick problem solving — By the time others have started a desktop and launched
    a graphical administration tool, you will have already run half dozen commands
    and solved the problem.


    +   - Enduring value — Many of the commands described in this book were used in
    early Unix systems. So you are gaining tools that reflect the experience of thousands
    of computer experts for more than 30 years.


    Because the documentation for commands used in Linux consists of man pages, info
    text, and help messages, you will surely want to reach beyond the pages of this
    book from time to time. Luckily, Ubuntu and other Linux systems include helpful
    information installed on the system itself. Chapter 1 contains descriptions of
    how to access that information that is already installed on your Ubuntu system.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Introduction


    # How This Book Is Structured


    This book is neither a pure reference book (with alphabetically listed components)
    nor a guide (with step-by-step procedures for doing tasks). Instead, the book
    is organized by topics and aimed at including as many commands and options as
    we could fit.


    Chapter 1 starts by giving you a basic understanding of what Ubuntu and how it
    relates to other Linux systems, such as various Debian-based distributions. Then
    it describes some of the vast resources available to support your experience with
