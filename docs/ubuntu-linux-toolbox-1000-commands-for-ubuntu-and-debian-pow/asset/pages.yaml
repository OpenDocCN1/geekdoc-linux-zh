    This file lists the MD5 checksums for all files on the Ubuntu 7.04 Live.


    With all files in md5sum.txt file contained in the directory, you can verify them
    all using the -c option to md5sum. Here is an example:


    ```

    ```

    $ md5sum -c md5sum.txt

    ../dist/feisty/main/binary-i386/Release: OK

    ../dist/feisty/main/binary-i386/Packages: OK

