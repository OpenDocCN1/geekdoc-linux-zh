  md: "# Chapter 14: Locking Down Security\n\nIn the example below, the DNAT in the\
    \ PREROUTING chain causes any requests to d port 8785, by IP address 11.22.33.44,\
    \ to be forwarded to the internal LAN IP address 10.0.0.155 on port 22 (a trick\
    \ to let someone ssh into a computer behind the firewall through a non-standard\
    \ port).\n\nHere are other examples for listing information about your firewall.\
    \ The iptables command is part of the iptables package.\n\n```\nsudo iptables\
    \ -n -L\nsudo iptables -v -L\nsudo iptables -L --line-numbers\nsudo iptables -nvl\
    \ --line-numbers\nFilter rules, IP numbers (no DNS lookup)\nVerbose output (with\
    \ packet/byte counts)\nShow line number in chain for each rule\nOur teacher's\
    \ favorite combination\n```\n\nHere is how you can stop or flush iptables rules\
    \ on an Ubuntu system:\n\n```\nsudo iptables -F\nFlush all iptables rules\n```\n\
    \nThis command removes all rules, so be careful when running it. You'll want to\
    \ immediately add new rules.\n\nHere are some examples of how the iptables command\
    \ can be used to change rules on an active firewall:\n\n```\nsudo iptables -A\
    \ INPUT -p TCP\n  -i eth0\n  --destination-port 25\n  -j ACCEPT\nAdd filter input\
    \ rule for TCP packets\non the first Ethernet interface\ndestined for mail service\
    \ port (25)\nto accept those packets when encountered\n```\n\n```\nsudo iptables\
    \ -t nat\n  -A POSTROUTING\n  -o eth0\n  -j SNAT\n  --to-source 11.22.33.1\nAdd\
    \ nat rule\nPOSTROUTING chain\nfor packets received on eth0 interface\njump to\
    \ network address translation\nusing outgoing address 11.22.33.1\n```\n\nTo use\
