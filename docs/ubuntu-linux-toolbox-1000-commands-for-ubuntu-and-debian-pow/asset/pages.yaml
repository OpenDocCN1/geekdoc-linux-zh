    # Mounting and Unmounting File Systems


    Before you use a regular, non-swap file system, you need to attach it to a directory
    in your computer''s file system tree by mounting. Your root file system (/) and
    other file systems you use on an ongoing basis are mounted automatically based
    on entries in your /etc/fstab file. Other file systems can be mounted manually
    as they are needed using the mount command.


    # Mounting File Systems from the fstab File


    When you first install Linux, the /etc/fstab file is usually set to contain information
    about your root file system and other file systems. Those file systems can then
    be set to mount at boot time or be ready to mount manually (with mount points
    and options ready to use when a manual mount is done).


    Here is an example of a /etc/fstab file:


    ```

    /dev/VolGroup0/LogVol100 ext3 defaults 1 1

    LABEL=/boot             ext3 defaults 1 2

    ```'
