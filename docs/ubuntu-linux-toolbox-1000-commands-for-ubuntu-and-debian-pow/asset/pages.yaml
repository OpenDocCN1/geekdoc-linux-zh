  md: '# Chapter 7: Administering File Systems


    NOTE If you use 3ware/AMCC hardware RAID controllers, which are our favorite for
    SATA RAID, make sure you install 3ware Disk Manager (3dmcm), which is available
    in rpm form from ATrpms.net. The 3dm2 utility provides a monitoring daemon and
