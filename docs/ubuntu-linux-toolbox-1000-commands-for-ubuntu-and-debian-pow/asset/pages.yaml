    The date command can also be used to change the system date and time. For examples:


    ```

    $ sudo date 08121512008      # Set date/time to Aug. 12, 2:21PM, 2008

    Tue Aug 12:14:00 CDT 2008

    $ sudo date --set=''+7 minutes''  # Set time to 7 minutes later

    Sun Aug 12:49:33 CDT 2008

    $ sudo date --set=''1 month''     # Set date/time to one month earlier

    Sun Jul 12 11:50:20 CDT 2008

    ```


    The next time you boot Ubuntu, the system time will be reset on the value of your
    hardware clock (or NTP server, if NTP service is enabled). And the next time you
    shut down, the hardware clock will be reset to the system time, in order to preserve
    time while the machine is powered off. To change hardware clock, you can use the
    hwclock command.


    198'
