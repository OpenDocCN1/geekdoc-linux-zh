    # Unmounting File Systems with unmount


    To unmount a file system, use the umount command. You can mount the file system
    using the device name or the mount point. You''re better off unmounting with the
    mount point, to avoid the confusion when using bind mounts (one device, multiple
    points). Here is an example of each, with versatility on:


    ```

    $ sudo umount -v /dev/sda1 Unmount by device

    /dev/sdal unmounted

    ```


    ```

    $ sudo umount -v /mnt/mymount/ Unmount by mount point

    /tmp/diskboot.img unmounted

    ```


    If the device is busy, the unmount will fail. A common reason for unmount to fail
    is that you have an open shell with the current directory of a directory inside
    the mount:


    ```

    $ sudo umount -v /mnt/mymount/

    umount: /mnt/mymount: device is busy

    umount: /mnt/mymount: device is busy

    ```


    Sometimes, it''s not obvious what makes the device busy. You can use lsof to list
    open files, then search list for the mount point that interests you:


    ```

    $ sudo lsof | grep mymount Find open files on mymount partition

    bash 9341 francois CWD DIR 8,1 1024 2 /mnt/mymount

    ```


    You can see that a process running by francois with a PID of 9341 is preventing
    the mymount partition from being unmounted.


    Another option when a file system is busy is to perform a lazy unmount:


    ```

    $ sudo umount -vl /mnt/mymount/ Perform a lazy unmount

    ```


    A lazy unmount removes the file system from the tree now, but waits for the device
    to no longer be busy before cleaning up everything. Unmounts of removable media
    can also be done with eject. This unmounts a CD and ejects the CD from the drive:


    ```

    $ sudo eject /dev/cdrom Unmount and eject a CD

    ```'
