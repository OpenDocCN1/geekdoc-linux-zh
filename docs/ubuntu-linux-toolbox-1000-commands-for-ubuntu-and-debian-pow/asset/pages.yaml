    # Finding and Controlling Processes


    Changing a running process first means finding the process you want to change,
    modifying the processing priority or sending the process a signal to change its
    behavior. If you are looking for a process or top, you might find it tough to
    locate it in a large list of outputs by ps or top. The pgrep command allows searching
    through your active processes for the ones you are looking for. The rename command
    lets you change the processing priority of running processes. The kill, pkill,
    and killall commands let you send signals to running processes (including signals
    to end processes).


    # Using pgrep to Find Processes


