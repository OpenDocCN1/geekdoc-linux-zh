  md: '# 2


    # # Installing Ubuntu and Adding Software


    Time-tested tools for initially installing Ubuntu, and later adding and managing
    software, include the APT (Advanced Package Tool) and dpkg (Debian package) utilities.
    These are some of the standard packaging utilities that serve as a back-end to
    the more familiar Desktop GUI tools for managing software on Ubuntu and other
    Debian-based systems. Package utilities interact with .deb files from online repositories,
    or local .deb files you''ve downloaded and having sitting on your hard disk.


    This chapter highlights critical issues you need to know during Ubuntu installation.
    It covers information about online Ubuntu software repositories. Detailed examples
    of APT, dpkg, and related command line utilities including aptitude are given
    in this chapter.


    | IN THIS CHAPTER |

    | Installing Ubuntu |

    | Working with software repositories |

    | Getting software with APT |

    | Managing software with Debian package tools |

    | Extracting files from other package formats |


    # ## Obtaining and Installing Ubuntu


    Ubuntu and its close cousins Kubuntu, Xubuntu, and Edubuntu are all designed with
    ease of use and familiarity in transition. These distributions focus on keeping
    things simple and clean to smooth out the learning curves when you are adapting
    to a new system.


    The Ubuntu installer (Ubiquity) is a prelude to the simplicity of the Ubuntu system,
    breaking down the install process into about 10 clicks. Canonical Ltd., the software
    company behind Ubuntu, has even made it easy for people to obtain installation
    media by offering mail CD-ROMs, free of charge if needed (https://shipit.ubuntu.com/login).
    If you have a fast Internet connection however, you can download one of the many
    ISO images for free from one of the mirrors around the world (www.ubuntu.com/getubuntu/downloadmirrors).
    The list of mirrors is huge to make sure there are plenty of servers available
    for people to download from. If one is not available, or unresponsive, try another.'
