    # Other Useful Network Tools


    If you''d like to see header information about packets as they are sent and received
    by your system, use tcpdump. The tcpdump command has a lot of advanced features,
    most of which revolve around filtering and finding a needle in a haystack of packets.
    If you use tcpdump on a remote machine, your screen will be flooded with all the
    traffic between your client and the remote machine. To get started having to learn
    too much about tcpdump filtering works, run the following command:


    ```

    $ sudo tcpdump | grep -v ssh Find packets except those associated with ssh

    ```


    If you''d like to dig deeper packet-level traffic, use wireshark (formerly known
    as ethereal). Install the wireshark package. You can run wireshark with X over
    ssh on a remote machine. Wireshark is a very powerful packet scanner that rivals
    the best commercial tools.


    To explore networks and remote machines and what services they offer, use nmap.
    The nmap command (from the nmap package) is the most common port scanner. It was
    even featured in the movie The Matrix Reloaded! Make sure that you are explicitly
    authorized to scan the systems or networks you are scanning. The nmap command
    is part of the nmap package and can be run as a user, but several scan types require
    root privileges.


    Here''s how to do a basic scan with nmap:


    ```

    $ sudo nmap 10.0.0.1 Scan ports on computer at 10.0.0.1

    ```


    To get maximum verbosity from nmap, use the -vv option:


    ```

    $ sudo nmap -vv 10.0.0.1 Show maximum verbosity from nmap output

    ```


    To use nmap to scan an entry, use the network address as an argument. In the following
    example, we add the -SP option to tell nmap to perform a simple ping sweep:


    ```

    $ sudo nmap -vv -sP 10.0.0.0/24 Scan hosts on an entire network

    ```


    You can be very specific about the information that nmap gathers for. In the following
    example, the -P0 option tells nmap not to use ping (this is good for scanning
    machines that don''t respond to ping). The -O option displays OS fingerprinting
    for'
