    # Using screen: A Rich Remote Shell


    The screen command gives you only one screen. If you lose that screen, you lose
    all you were doing on the remote computer. That can be very bad if you were in
    the middle of something important, such as a 12-hour compile. and if you want
    to do things at once, for example vi http.conf, tail -f error_log, and service
    http reload, you need to open three screen sessions.


    Essentially, screen is a multiplexer. If you are a system administrator working
    on remote servers, screen is a great tool for managing a remote computer with
    only a command line interface available. Besides allowing multiple shells, screen
    also disconnects from it, and then reconnect to that same screen later.


    The screen software package is installed by default with Ubuntu.


    To use screen, run the ssh command from a client system to connect to the Linux
    server where screen is installed. Then simply type the following command:


    ```

    $ screen

    ```


    If you run screen from a Terminal, you should first see a welcome message asking
    for pizza and beer, then a regular bash prompt in the window. To control screen,
    press the Ctrl+a key combo, followed by another shortcut. For example, Ctrl+a
    followed by ? (not as Ctrl+a, ?) displays the help. With screen running, there
    are some commands and control keys you can use to operate screen.


    ```

    $ screen -ls List active screens

    There is a screen on:

    7089.pts-2.myserver (Attached) Show screen is attached

    1 Socket /var/run/screen/S-francois. Change window title

    $ Ctrl+a, a Type a new title

    $ Ctrl+a, c Create a new window

    $ Ctrl+a, " Show active window titles

    Num have Flags

    0 My Server Up/down arrows change windows

    1 bash

    ```


