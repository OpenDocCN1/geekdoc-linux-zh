    # Graphical Text Editors


    Just because you are editing text doesn''t mean you have to use a text-based editor.
    The main advantages of using a graphical editor is that you can use a mouse to
    select menus, highlight text, and copy-text, or run special plug-ins.


    You can expect to have the GNOME text editor (gedit) if your Linux system has
    the GNOME desktop installed. Features in gedit enable you to check spelling, list
    document statistics, display font styles and colors, and print your documents.
    The KDE desktop also has its KDE text editor (kedit in the kdeutils package).
    It includes similar features to the GNOME text editor, along with a few extras,
    such as the ability to select the current document with kmail or another-configurable
    KDE component.


    Vim itself comes with an X GUI version. It is launched with the gvim command,
    which is part of the vim-X11 package. If you''d like to turn GUI Vim into a more
    user-friendly text editor, you can download a third-party application Cream from
    http://cream.sourceforge.net/


    > > NOTE To use vim, you need to install an additional package, vim-gnome.


    Other text editors you can install nedir (with features for macros and executing
    shell commands at software developers) and leafpad (which is similar to the Windows
    Notepad text editor). The Scribes text editor (scribes) includes some advanced
    features for automatic correction, replacement, indentation, and word completion.


    # Listing, Sorting, and Changing Text


    Instead of just editing a single text file, you can use a variety of Linux commands
    to display, search, and manipulate the contents of one or more text files at a
    time.'
