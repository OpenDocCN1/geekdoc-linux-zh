    # Managing Software with aptitude


    The dpkg and APT tools have been around for a long time and work well, there are
    many nuances to both tools that can require a fair amount of understanding to
    use correctly. The aptitude tool tries to make things easier by automating some
    of the package operations (like running apt-get update before upgrading or installing)
    while allowing enough flexibility to be useful. For these reasons, we recommend
    the use of aptitude at the command line whenever possible.


    The aptitude program aims to be both a curses application and command line tool.
    It is the command line use we focus on in this section. Table 2-6 shows a breakdown
    of ways to manage software packages with aptitude. Note that some of the options
    are similar to those of the apt-get command.


    > NOTE For information on navigating the curses interface of aptitude, or other
    details, visit the Aptitude Survival Guide (https://help.ubuntu.com/community/AptitudesSurvivalGuide),
    or the Aptitude User''s Manual (http://people.debian.org/-dbrows/aptitude-doc/en/),
    or run man aptitude at the command line.


    # Table 2-6: Some aptitude command Functionality


    | aptitude Command | What It Does |

    |---|---|

    | aptitude | Starts the curses interface. Ctrl+t to access the menu and the q
    key to quit. |

    | aptitude help | Lists help for aptitude usage. |

    | aptitude search <keyword> | Lists packages matching the given keyword. |

    | sudo aptitude update | Updates the available package indexes from the APT sources.
    |

    | sudo aptitude upgrade | Upgrades all packages in use to their latest versions.
    |

    | aptitude show <package> | Lists information about the given package, installed
