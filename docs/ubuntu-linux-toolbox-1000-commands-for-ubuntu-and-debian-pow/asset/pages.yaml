    # Sorting Output with sort


    It can also be useful to sort the content of a file or the output of a command.
    This can be helpful in bringing order to disorderly the output. The following
    examples list the names of all RPM packages currently installed, grabs any kernel
    in the name, and sorts the results in alphanumeric order (forward and reverse):


