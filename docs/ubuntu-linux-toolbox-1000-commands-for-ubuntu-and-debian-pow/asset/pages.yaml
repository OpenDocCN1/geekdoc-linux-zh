  md: '# Chapter 1: Starting with Ubuntu Linux


    Ubuntu Linux Toolbox is not just another command reference or rehash of man pages.
    Instead, this book presents commands in Ubuntu Linux by the way you use them.
    In other words, instead of listing commands alphabetically, we group commands
    for working with file systems, connecting to networks, and managing processes
    in their own sections, so you can access commands by what you want to do, not
    only by how they''re named.


    Likewise, we won''t give you a list of every option available for every command.
    Instead, we''ll show you working examples of the most important and useful options
    to use with each command. Then, we''ll show you quick ways to find more options,
    if you need them, from man pages, the info facility, and help options.


    # Finding Commands


    Some of the commands in this book may not be installed by default on your Ubuntu
    distro, but will certainly be available through APT or other sources. When you
    type a command that the shell cannot find, you will see an error message similar
    to:


    ```

    $ sillycommand

    -bash: sillycommand: command not found

    ```


    There are a few reasons why the command not found message is returned:


    +   - You may have mistyped the command name ("fat-fingered") it).

    - The command is not in any of the directories the shell has been instructed to
    look in (PATH variable).

    - The command may only be available to root (through the use of sudo or a similar
    method).

    - The command, or Ubuntu package containing the command, is simply installed.


    Table 1-1 shows some commands you can run on any Linux distribution to check whether
    the command you typed is on the system. Table 1-2 shows similar commands specific
    to Ubuntu and Debian systems.


    > NOTE You may see an ellipsis (...) used in code output to note where non-essential
    information has been omitted for the sake of brevity.


    If you find a command listed in the output of apt-cache search or suspect that
    the command you want is not installed, you can install it from the Internet by
    running the command


    ```

    $ sudo apt-get install packagename

    ```


    where packagename is the name of the package you want to install.'
