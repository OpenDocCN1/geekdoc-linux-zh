    # Using Virtual Terminals


    When Ubuntu boots in multi-user mode (level 2, 3, or 5), six virtual consoles
    (known as tty1 through tty6) are created with text-based logins. If an X Windows
    system isn''t running, X is probably running in virtual console 7. If you''re
    looking at virtual console 1.


    From X, you can switch to another virtual console with Ctrl+Alt+F1, Ctrl+Alt+F2,
    and so on up to 6. From a virtual console, you can switch using Alt+F1, Alt+F2,
    and so on. Press Alt+F7 to return to the GUI Each console allows you to log in
    using different user accounts. Switching to look another console doesn''t affect
    running processes in any of them. When you switch to virtual terminal one through
    six, you see a login prompt similar to this:


    Ubuntu 7.04 localhost tty2


    localhost login:


