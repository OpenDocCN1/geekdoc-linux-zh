  md: '# Chapter 5: Manipulating Text


    Note that your system may not have any files with names starting with conf in
    the /etc/httpd directory, depending on what you have installed on your system.
    You can apply this technique to other files as well.


    Add line numbers (-n) to your grep command to find the exact lines where the search
    occurs:


    ```

    $ grep -Rn VirtualHost /etc/httpd/conf*

    ```


    To color the search term in the search results, add the --color option:


    ```

    $ grep --color -Rn VirtualHost /etc/httpd/conf*

    ```


    By default, in a multiline search, the file name is displayed for each search
    result. The -h option to disable the display of file names. This example searches
    for the string sshd in the file auth.log:


    ```

    $ grep -h sshd /var/log/auth.log

    ```


    If you want to ignore case when you search messages, use the -i option:


    ```

    $ grep -i selinux /var/log/messages    Search file for selinux (any case)

    ```


    To display only the name of the file that includes the search term, add the -1
    option:


    ```

    $ grep -Rl VirtualHost /etc/httpd/conf*

    ```


    To display all lines that do not match the string, add the -v option:


    ```

    $ grep -v "200 " /var/log/httpd/access-log*    Show lines without "200"

    ```


    > NOTE When piping the output of ps into grep, here''s a trick to prevent the
    grep process from appearing in the grep results:


    ```

    # ps auxw | grep [iinit]

    ```


    # Checking Word Counts with wc


    There are times when you need to know the number of lines that match a search
    string. The wc command can be used to count the lines that it receives. For example,
    the following command lists how many times in an Apache log file come from a specific
    IP address:


    ```

    $ grep 192.198.1.1 /var/log/httpd/access-log | wc -l

    ```


    The wc command has other uses as well. By default, wc prints the number of lines,
    words, and bytes in a file:


    ```

    $ wc /var/log/dmesg    List counts for a single file

    ```


