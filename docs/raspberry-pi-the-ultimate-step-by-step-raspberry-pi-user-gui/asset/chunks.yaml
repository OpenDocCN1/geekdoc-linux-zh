    # Chapter 2- Raspberry Pi- Python- What is it and What are the Benefits?


    Raspberry Pi is a credit card sized, single-board computer under innovation by
    the Raspberry Pi Foundation UK. The multi-purpose, light distribution platform
    is popular for teaching basic computer science in schools. The Raspberry Pi Foundation
    participates in the active development of Python programming language development
    of new hardware and software updates for its system.


    Programming Raspberry Pi’s Linux operating system (OS) and other software interface
    in Python programming language is the simplest codec for creating commands. Simple
    syntax in Python allows programmers to construct code with the minimal effort.
    The programming language deploys with concise concept statements over the more
    extensive scripting of programming languages.


    ## Python Programming Language Proficiencies for Raspberry Pi


    The high-level programming language, Python, is recognized as general purpose
    code. The code structure is used in Web programming language in 2.0\. This allows
    cross-browser portability and aggregate exchange of data. The proficiency of Python’s
    standard is now used in Web based software application as system (SaaS) platforms
    in support of data sharing platforms with Unicode. Raspberry Pi Python programming
    communities participate in open source sharing of software innovation.


    ![](imgs/image002.jpg)


    Online programming communities contributing to the development of new SaaS compatible
    with Raspberry Pi are important to the evolution of Python language libraries
    and codec found in open source sharing platforms. The Raspberry Pi platform offers
    a foundation for learning computer programming code standard to most operating
    systems (OS) on the market. This includes some of the systems cross-platform application
    Linux frameworks (i.e. Arch Linux ARM, Android, Android 4.0, Google Chrome OS,
    Chromium OS and Firefox OS).


    Python multiple programming paradigms support constructs in programming Raspberry
    Pi compatible architecture, infrastructure software. The fact that Python allows
    for small and large coding structures to be constructed in commands provides the
    necessary functional, imperative and object-oriented programming elements to the
    various levels of software interface to the system.


    The automatic memory management and fully dynamic type system in Python are the
    basis to the Raspberry Pi large library of coding language. Raspberry Pi is designed
    to integrate with other standard Linux platforms on the market. Python programming
    language can be deployed to command standalone executable programs with third-party
    tools, and is embedded in quite a few popular software applications.


    ## Programming Raspberry Pi in Python


    Python’s multi-paradigm programming language enables Raspberry Pi programmers
    to conduct object-oriented programming and structured programming. The programming
    language also supports logic programming for extensions. Raspberry Pi’s memory
    management is conducted by way of Python programming language using dynamic typing,
    reference counting and a cycle-detecting garbage collector features. Programmers
    will find that dynamic name resolution in Python serves to merge method and variable
    names upon execution of a program.


    Python’s syntax and semantics are highly readable and simple to replicate. The
    Python language syntax model results in uncluttered codecs. Future recognition
    of frequencies in scripting is part of the programming repository. In Python punctuation
    and syntactic exceptions are noticed. Semantic precision is derived from recognition,
    and exceeds that of alternate C or Pascal programming language. Python employs
    real language (`and`, `or`, `not`) for constructing boolean operators rather than
    symbols. Here are examples of Python programming language execution for Raspberry
    Pi: IDLE, Numbers, Variables, For Loops, Simulating Dice, If, While, Summary and
    Features.


    Python expressions are much like those in C and Java programming language. Python
    converts expressions by truncating in response to comparative values. Object identification
    or comparative reference is also possible. Python implementation of object-orientation
    promotes segmentation programming of structure, so that each class is responsible
    for its own behavior. This modular approach to programming language assists in
    monitoring functions within the complexity of a program, making them far more
    manageable to administer.


    Chaining comparative syntactic expressions creates series of commands. The mathematical
    formula to the chaining function is integer division. The integer division model
    is used to truncate the values. Conversion of one of the integers to a float is
    the result. The outcome to integer division model is, therefore, expressed in
    alpha form rather than numeric value.


    Raspberry Pi libraries online containing Python programming language include a
    large repository of codecs for building programs. This includes modules applied
    with arithmetic arbitrary precision decimals, graphical user interface (GUI) programming,
    codecs for connecting relational databases, and codecs of regular expressions.
    Unit testing and software testing for Raspberry Pi in Python (i.e. `doctest` and
    `unittest`) modules is also available.


    Although Raspberry Pi does not require a standard library for Python run or embed,
    there are a number of packages designed specifically for developer purposes (i.e.
    documentation tools, graphical user interface, image processing, multimedia, databases,
    networking and communications, scientific computing, text processing, web framework,
    and test frameworks and systems administration). Raspberry Pi programmers seeking
    library guidance for programming mathematical software in Python will find algebra,
    calculus, combinatorics, and numerical mathematic and number theory codecs. Strings
    and lists representing data can be used to add structure to Python based programs.


    ## Integrating Raspberry Pi Hardware with Python


    There are various methods of connecting Raspberry Pi to other electronic devices
    using GPIO Pin Connections. Programming in Python allows direct connection of
    GPIO Pins and extensions to supplement Raspberry Pi motherboard commands. The
    RaspiRobot also requires Python interface to control commands from a wireless
    USB keyboard to the motor in the robot chassis by way of ultrasonic range finder.
    This prototype invention is an example of a unique Raspberry Pi conversion project.
    Python programming language assists in rover command.


    # Chapter 3- The Basics of Python Technology


