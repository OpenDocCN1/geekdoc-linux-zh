    # 第 1 章 树莓派概述

    当由英国树莓派基金会（Raspberry Pi Foundation）开发的信用卡大小的单板计算机——树莓派发布时，一种用于促进学校基础计算机科学教学的多功能、轻量级计算平台理念便应生了。目前，Element
    14/Premier Farnell 和 RS Components 公司授权了树莓派的销售。树莓派基金会积极致力于硬件和软件更新的创新与整合。


    ![](img/image001.jpg)


    树莓派使用 Python 编程语言进行编程。Python 是可用的最标准编程编码之一，用于在树莓派使用的操作系统、基础设施和软件之间创建兼容性。Python
    是一种非常容易学习的编程语言。通过创建脚本代码类，可以用总结的形式解释概念，使得编程结果可以即时执行命令。


    致力于创建新软件应用即服务（SaaS）的在线编程社区是知识共享世界的核心部分，树莓派 Python 编程及其开源转型也是如此。树莓派平台支持与市场上基于数字计算板设备上所有主流操作系统集成，包括跨平台应用
    Linux 框架。


    ### 特性

    树莓派是一个博通 BCM2835 系统级芯片（SoC），带有 ARM1176JZF-S 700 MHz 处理器和 VideoCore IV GPU。目前的树莓派系统具有
    512MB RAM，已从 256 兆内存升级。目前，树莓派基金会提供 Arch Linux ARM 和 Debian 发发版下载。


    ### 架构

    树莓派 API 连接的视觉图利用基于 Linux 内核的操作系统。Raspbian 是一个基于 Debian 的免费操作系统，用于优化树莓派硬件。板载的 GPU
    硬件通过固件镜像或二进制块（binary blob）访问；在从 SD 卡启动时加载到 GPU 中。目前固件镜像是闭源的。


    板载应用程序源代码运行时库中的处理函数访问 Linux 内核内部的开源 API 驱动程序。采用 2D 和 3D 应用的视频应用 OpenMAX 和 OpenGL
    ES 使用 OpenVG 和 EGL。该板的新原型概念 SD 卡镜像强化了初步操作系统。该镜像可以在 QEMU 中运行，使得树莓派可以在其他平台架构上进行镜像。


    ### 系统软件

    树莓派 Fedora Remix 软件应用程序是 Linux 发行版最新的开发成果之一。2012 年的版本是 App 交换中升级操作系统效率努力的一部分。系统软件还包括
    Slackware ARM 版本 13.37。免费的 VideoCore 驱动代码在树莓派 ARM 上运行，是可用开源多媒体 SoC 软件的另一个示例。


    ### 操作系统

    树莓派兼容多种移植或正在移植集成过程中的标准操作系统。操作系统兼容性包括专为树莓派集成 Linux 发行版开发的跨平台应用框架。


    Moebius 中的多功能发行版提供轻量 ARM HF。Moebius 在树莓派上的应用是显而易见的，因为它小到可以放入 1GB SD 内存。由于内存占用极低，实际上是
    Moebius 它以最小的消耗优化了树莓派操作系统。最后，IPFire 和 Raspbmc 等单一用途轻量级发行版也可集成到树莓派，无需额外编程。


    ### 用户应用程序

    可以轻松安装在 Raspbian 上的树莓派应用涉及多媒体、音频、图形、智能手机和 LAN 服务器功能。开源媒体应用从外部源构建，为独特的用户编程创建新格式。程序员社区使用
    Python 语言构建新的软件应用模块，在编码协议的字典、列表和类中添加新信息。


    ### 配件

    一个 500 万像素的相机原型于 2013 年 4 月发布。基金会测试的模块是树莓派支持的配件功能之一。该板还与 LED、模拟信号、传感器、开关和其他硬件设备以及兼容
    Arduino 的控制器建立接口。


    ### 硬件

    树莓派两种型号（A 和 B）的原理图在框图中均提供了 PCB 连接器和集成电路（IC）。A 型不包含以太网的内部连接。可以使用 USB 适配器连接到外部以太网。B
    型包含嵌入式以太网功能。


    虽然树莓派 A 型没有以太网端口，但它可以通过外部或 Wi-Fi 适配器连接到网络。在这方面，A 型和 B 型的性能没有区别，因为内部以太网和外部端口连接提供相同的适配。通用
    USB 键盘和鼠标均兼容树莓派。

