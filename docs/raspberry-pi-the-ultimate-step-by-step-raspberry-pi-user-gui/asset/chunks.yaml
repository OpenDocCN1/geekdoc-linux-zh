    # Programming Raspberry Pi for graphical user interfaces (GUI) with Python programming
    language


    can be best managed by event handler functions. GUI programs are event-driven
    means that code in the event handlers may not be called directly by the program
    without triggers. This makes Python handy for creating GUI program management.
    Use Python to trigger the event handler so the other elements of the program read
    code, call other functions or change variables accordingly. Since the event handler
    is not called by code but by triggered response, variables cannot be passed in
    correspondence with event handler parameters in the program. Global variables
    offer the trigger for using a class in Python to activate GUI event handling for
    Raspberry Pi.


    ![](imgs/image005.jpg)


    ## GUI Development in Python


    Applications embedded with the Python programming language are many. There are
    currently a number of popular software application products on the market using
    the Python codec for scripting language. Python also allows for object-oriented
    and structured command coding. The use of Python programming language for GUI
    in Raspberry Pi reveals the extent by which new innovations in graphics software
    programs can be customized. For programmers learning how to script code and object-oriented
    event handler triggers for GUI, Python is the optimum choice.


    Python provides finite method to software development of GUI programs like Abaqus
    and 3D animation software (i.e. `Maya`, `Cinema 4D`, `Lightwave`, `modo`, `Houdini`,
    `MotionBuilder`, `Nuke` and `Softimage`) as well as 2D imaging programs (i.e.
    `Inkscape`, `GIMP`, `Paint Shop Pro` and `Scribus`). Unlike the use of complex
    structures seen in `C++` programming language containers deployed in `GNU GDB`
    Python is exceptionally simple and sophisticated to handle almost any programming
    language applied to visual dynamics. Python is seen in the scripting of `ArcGIS`
    and video game programming language, as well as in the development of new Web
    based apps platforms (i.e. `Go`, `Google App Engine` and `Java`).


    ## Programming GUI with Python


    Python’s `classes` and object-oriented programming are sufficient basis for class
    definition of objects and running code. Data variables are part of a `class`.
    Definition of data that can be used within an object is created by `class`. `Class`
    is the definitive function for object-oriented application of data. When data
    variables are outside the object, they are denoted as fields. Functions in this
    realm supply methods for manipulation of data. Data fields define event handlers,
    which access any data required for trigger. Image conversion is done to a `canvas`.
    Image constructs are added to the `dictionary` for later use.


    Python’s `dictionary` enables for built-in types to be accessed later. When programming
    GUI in Raspberry Pi with Python, there are four (4) collections used: 1) `string`,
    2) `tuple`, 3) `list` and 4) `dictionary`. Programming languages typically string
    text to form a series in a collection. Python is modular in the sense that segmentation
    of the collection applies to string statements as well. Consideration of a `tuple`
    as a group of objects is the function for a `list`. `Tuples` and strings are unchangeable.
    `Lists` may be changed, however, and this is normally done by sorting or appended
    logic within a series. The individual elements of strings, tuples and lists are
    available in numeric indices. Much like `lists`, `dictionaries` in Python are
    highly mutable. `dictionary` indices provide a guide to application. Python library
    support for `classes` is available in documentation.


    ## Using Tkinter for programming GUI for Raspberry Pi in Python


    Tkinter offers the binding importation of Python programming of GUI in Raspberry
    Pi. Tkinter Tk GUI toolkit is the de facto standard used by Python to program
    code in Raspberry Pi, as well as Windows and Mac OS X. `Tk` bindings are implemented
    as a Python wrapper. The wrapper surrounds the complete `Tcl` interpreter embedded
    in a Python interpreter. Calls in `Tkinter` 1) translate to `Tcl` commands, 2)
    fed to the embedded interpreter and 3) merge `Python` and `Tcl` into a single
    application. Both `Python` 2.7 and `Python` 3.1 incorporate the functionality
    of `Tk` 8.5, so that `Tk` widgets can be themed to appear as a native desktop
    environment where the application is running.


    Extension of a `class` is acknowledged as inheritance within Python programming
    language. The transition of `class` to inheritance is a fundamental aspect of
    object-oriented programming for GUI in Raspberry Pi with Python codecs. When functions
    of `Tk` are made relevant to a `class`, extension of the `class` can be made to
    add as much content in programming language as desired. `Classes` also can be
    used to define initialize `__init__` which is a special function command. When
    this is applied the class is relevant to creation of an object.


    An easy way to initialize in GUI, definition of statements should be programmed
    by indenting those statements within the class level to create new commands. If
    the first parameter to special commands is `self`; how the various parts of the
    class recognize each other is formed. This is done to segment the logic inside
    of a `class`. Once global variables are created as fields in a `class`, the definition
    of event handlers as part of the class can be programmed. By defining the `class`
    needed to create the object that will be active an object app from the class must
    be articulated in relation to a parent name. Top level windows have no parents.
    Creation of an object to commence event initialization processing in Tk is done
    by calling the `__init__` function to form a complete `mainloop()`.


    # Chapter 7- Raspberry Pi- How to use Pygame


    To create a game in `Pygame` on the Raspberry Pi, one will need to work in conjunction
    with the `Geany Editor` to code the game. The first thing that one can do is to
    open the `Geany Editor` on their computer so that they may create a new template.
    Upon opening a new template file, some code will need to be input to instruct
    `Geany` to use the Python coding language as well as a basic template code.


    `Pygame` might not always be installed so if it''s not, the person can open a
    terminal and type `sudo apt-get install python-pygame` without the quotations.
    Upon entering the root password, the `Pygame` package and dependencies will be
    downloaded, extracted and installed.


    Creating a simple application that displays a window and has minimal event handling
    properties is ideal for someone learning how to use `Pygame` for the first time.
    After successfully learning some basic coding and programming for game coding,
    one will be able to try their hand at more advanced types of games.


    The first thing that one will need to do is to instruct the `Geany` program which
    coding language they would like to use. This can be done by entering `#! /usr/bin/env
    python` without quotations into line 1. Line 2 may be left blank and line 3 should
    have the text `import pygame`. The line of text `import pygame` will import the
    `PyGame` module which is needed to code and program games. Line 4 may also be
    left blank; meanwhile line 5 should have the text `screen = pygame.display.set_mode
    ((640, 400))` without quotations. This code instructs the `PyGame` module what
    size measurements to set the display screen.


    The following line 6 should also be left blank while line 7 should contain the
    text `while 1:` without quotations. Lastly, `pass` should be input into line 8.
    One may experiment by running this code by clicking on the small rotating gears
    icon to initialize the code start.

