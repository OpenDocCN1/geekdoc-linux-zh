    # Chapter 1- An Overview of Raspberry Pi

    When Raspberry Pi, the credit-card-sized single-board computer developed by the
    Raspberry Pi Foundation in the UK was launched, the concept of multi-purpose,
    light distribution platforms for promotion of teaching of basic computer science
    in schools was born. At present, Element 14/Premier Farnell and RS Components
    companies license sales of Raspberry Pi. The Raspberry Pi Foundation works actively
    toward innovation and integration of new hardware and software updates.


    ![](imgs/image001.jpg)


    Raspberry Pi is programmed in Python programming language. One of the most standard
    programming codec’s available, Python is used to create compatibility in operating
    systems, infrastructure and software programs used by Raspberry Pi. Python is
    a programming language that is fairly easy to learn. By creating classes of scripted
    code, concepts can be expiated in summary form so that programming results are
    accessible to conduct commands on the spot.


    Online programming communities dedicated to creation of new software application
    as system (SaaS) are a central part of the knowledge sharing world Python programming
    for Raspberry Pi and its open source transformation. The Raspberry Pi platform
    supports integration with all of the major operating systems available in digital
    computer board based devices on the market, including is a cross-platform application
    Linux frameworks.


    ### Features

    Raspberry Pi is a Broadcom BCM2835 system on a chip (SoC) with an ARM1176JZF-S
    700 MHz processor and VideoCore IV GPU. The current Raspberry Pi system is 512MB,
    upgraded from 256 megabytes of RAM. At present, the Raspberry Pi Foundation offers
    Arch Linux ARM and Debian distributions for download.


    ### Architecture

    Visual diagram of API connections in the Raspberry Pi utilizes Linux kernel-based
    operating systems. Raspbian is the Debian-based free operating system used to
    optimize Raspberry Pi hardware. The board’s GPU hardware is accessed by way of
    a firmware image or binary blob; loaded into the GPU when booted from the SD-card.
    The firmware image is closed source at present.


    The processing functions within the board’s application software source run-time
    libraries to access an open source API driver, inside the Linux kernel. Video
    applications employing 2D and 3D applications, OpenMAX and OpenGL ES use OpenVG
    and EGL. The board’s new proof of concept SD card image reinforces the preliminary
    operating system. The image can run in QEMU which enables Raspberry Pi to be mirrored
    on other platform architecture.


    ### System Software

    Raspberry Pi Fedora Remix software application is the one of the most recent developments
    for Linux distribution. The 2012 release was part of an ongoing effort in App
    exchange to upgrade efficiencies in the operating system. Systems software also
    includes Slackware ARM version 13.37\. Free VideoCore driver code runs the Raspberry
    Pi ARM, is another example of open source multimedia SoC software available to
    the public.


    ### Operating Systems

    Raspberry Pi is compatible with a number of standard operating systems running
    that are ported or in the process of port integration. Operating systems compatibility
    includes cross platform applications frameworks developed for solely for Raspberry
    Pi''s integration of Linux distribution.


    Multi-purpose distributions in Moebius offer light ARM HF. Application of Moebius
    in Raspberry Pi is ostensible as it is small enough for 1GB SD memory. So minimal
    in memory usage, in fact, is Moebius that it optimizes the Raspberry Pi operating
    system with the least possible consumption. Finally,single purpose light distributions
    such as IPFire and Raspbmc are available for Raspberry Pi integration without
    additional programming.


    ### User Applications

    Raspberry Pi applications that can easily be installed on Raspbian involve multimedia,
    audio, graphics, Smartphone and LAN server functions. Open source media applications
    are built from outside sources to create new formats for unique user programming.
    Communities of programmers construct new software applications modules using the
    Python programming language, adding new information to dictionaries, lists and
    classes within the codec protocol.


    ### Accessories

    A prototype camera with 5 megapixels is set for release in April 2013\. The module
    tested by the Foundation is one of the many accessory features Raspberry Pi supports.
    The board also interfaces with LEDs, analog signals, sensors, switches and other
    hardware devices, as well as an Arduino compatible controller.


    ### Hardware

    Schematics to both Raspberry Pi models (A and B) offer PCB connectors and ICs
    in block diagram. Model A does not include an internal connection to Ethernet.
    USB dongle can be employed to connect to external Ethernet. Model B contains an
    embedded Ethernet feature.


    While Raspberry Pi Model A does not come with an Ethernet port, it can be connected
    to a network externally or by way of Wi-Fi adapter. There is no difference in
    performance between Model A and Model B in this regard, as internal Ethernet and
    external port connection offer the same adaptation. Generic USB keyboards and
    mice are both compatible with Raspberry Pi.

