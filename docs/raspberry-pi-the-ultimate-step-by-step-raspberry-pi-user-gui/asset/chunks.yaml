    如果坚持使用与树莓派设备配合良好的屏幕，也可以考虑微型 LCD 屏幕。有很多此类屏幕可以容纳复合类型的视频输入。如果目标是将其连接到树莓派的视频输出，这些屏幕的工作效果很好。这些屏幕通常配备有两个视频输入，带有
