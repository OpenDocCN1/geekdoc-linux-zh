  trans: '

    Python 不仅限于脚本语言，还可以通过第三方工具打包成独立可执行程序的一部分。大多数操作系统都提供 Python 解释器。该编程语言嵌入在市场上的许多流行软件产品中。


    ## Python 特性

    Python 是一种多范式编程语言，支持面向对象编程和结构化编程。该语言特性还可以支持包括逻辑编程在内的扩展。动态类型、引用计数和循环检测垃圾回收器特性在内存管理方面表现卓越。动态名称解析用于在程序执行期间链接方法和变量名。


    ![](img/image003.jpg)


    ## Python 语法与语义

    Python 的语法和语义简单且具有高度的可读性，便于复制。Python 语言语法模型非常整洁。语言使用的频率保留在编程语言的存储库中，以便日后识别。标点符号和语法异常都被了记录，这在与
    `C` 或 `Pascal` 等其他编程语言相比时，使得语义更加精确。


    ## Python 表达式

    与 `C` 和 `Java` 编程表达式类似，Python 的表达式转换通过比较值进行截断。也可以使用对象标识或通过引用进行比较。这些比较可以链式组合以创建一系列命令。整数除法是使用将其中一个整数转换为浮点数来截断值的模型。由于
    Python 使用真实语言（`and`、`or` 或 `not`）而非符号作为逻辑运算符，整数除法模型的结果仍以字母形式表示。


    ## Python 库

    Python 编程语言拥有庞大的标准库用于构建程序。它支持标准的互联网格式和协议 `MIME` 和 `HTTP`。此外还有用于任意精度小数算术、创建图形用户界面、连接关系型数据库以及处理正则表达式的模块。Python
    库中的 `doctest` 和 `unittest` 模块执行单元测试和软件测试，为新开发提供可靠性保障。


    虽然在应用程序中运行或嵌入 Python 编程语言并不强制需要标准库，但 Python 包索引（PyPI）作为第三方软件编码的官方存储库，包含了大量用于开发目的的包：科学计算、文本处理、图像处理、图形用户界面、多媒体、数据库、网络与通信、Web
    框架、测试框架、文档工具、系统管理。


    `Matplotlib`、`NumPy` 和 `SciPy` 等 Python 库使得该语言能够高效地应用于科学计算。例如，用于在 Python 中编写数学软件的库将包含数学元素：代数、微积分、组合数学、数值数学和数论。


    ## Python 软件开发

    Python 编程语言目前嵌入在许多流行软件产品中。Python 脚本语言在 Abaqus 等有限元软件、3D 动画软件（如 `Cinema 4D`、`Houdini`、`Lightwave`、`Maya`、`modo`、`MotionBuilder`、`Nuke`
    和 `Softimage`）以及 2D 成像程序（如 `GIMP`、`Inkscape`、`Paint Shop Pro` 和 `Scribus`）中使用深受重视。


    在 `GNU GDB` 中使用 `C++` 容器等复杂结构证明 Python 是一种足以处理视觉动态的高级编程语言。它还用于 ArcGIS、视频游戏的脚本编写，并作为平台
    Web 更新（Google App Engine 和 Java）的首选语言。


    ## 作为系统（SaaS）的 Python 软件应用

    Python 用于软件即服务（SaaS）任务中的人工智能，这使其成为具有模块架构的首选脚本语言。Python 丰富的文本处理工具和语法是自然语言处理的理想选择。它对几乎任何信息安全基础设施的即插用能力，以及在目标开源编程语言开发社区中的应用，展示了
    Python 在任何 SaaS 环境中使用的卓越灵活性。


    Web 应用脚本接口配合标准 API 框架的开发，支持复杂应用程序的设计与维护。例如，`Pyjamas` 和 `IronPython` 是基于 `Ajax`
    程序的客户端开发者。用于关系型数据库数据映射的流行工具 `SQLAlchemy` 也使用了 Python 编程语言。它还支持用于计算机间通信编程的 `twisted`
    框架。


    ## Python 开发者社区

    Python 作为标准语言进入大多数 Linux 发行版，使其被广泛应用于开源操作系统程序中（如 `FreeBSD`、`NetBSD`、`OpenBSD`、`OS
    X` 等）。Linux 发行版的安装程序也是用 Python 编写。通过知识共享交换活动提供开源 `CPython` 软件。`CPython` 在线社区开发模型允许编程的迭代或全新的实现共享。`CPython`
    是 Python 软件基金会的程序。树莓派基金会的单板计算机项目采用了 Python 编码作为其接口。


    # 第 4 章 - 可配合树莓派 Python 使用的其他设备


    在深入讨论哪些其他形式的技术可以连接到树莓派之前，必须强调，这种迷你个人电脑的出现在信息技术行业引起了不小的波动，并引发了一波新的竞争热潮。


    树莓派的优点有很多，最有利的优点是它的尺寸（与信用卡一样）。它具有与标准计算机相似的功能，且更具性价比。还可以将其作为低成本服务器运行，处理一些网络或内部流量。从短长期来看，组合若干树莓派创建一个服务器的成本比获取一台标准服务器低得多。如果网络流量较小，可以使用树莓派并节省资金。


    自从我熟悉了树莓派技术，我用一些传感器和其他设备进行了一些自己的实验。通过这些实验，我整理了一份发现与此类技术工作良好的设备列表。这些物品并不贵，可以与软件轻松集成，并可以作为更大项目的基石。


    可以创建的项目范围从安全系统到机器人汽车，可以以多种方式组合成奇妙的东西。如果你正准备为一位树莓派爱好者购买礼物，那么这一章将为你选择可用物品提供非常有帮助。


    我们可以查看的第一件物品是 PIR 运动传感器。这是一项很棒的技术，允许用户通过被动红外传感器检测运动。这些传感器并不昂贵，带有引脚，可以直接连接到树莓派的
    `GPIO` 引脚上。它是制作机器人传感器或用于安全系统的绝佳设备。


    下一个可以查看的物品是 Nintendo Wii 控制器。对于游戏爱好者来说，这是一个极佳的选择。`Wiimote` 可以连接到树莓派，并在游戏方面开启一个充满可能的世界。


    之后是超声波模块。这些模块可以提高树莓派设备读取的距离。你可以选择一个带有 `echo` 引脚、一个 `trigger` 引脚和两个电源引脚的超声波模块。

