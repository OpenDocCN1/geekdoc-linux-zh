    # 使用 Python 语言为树莓派编程图形用户界面 (GUI)


    通常可以通过事件处理器函数进行最佳管理。GUI 程序是事件驱动的，这意味着事件处理器中的代码在没有触发器的情况下不会被程序直接调用。这使得 Python 用于创建
    GUI 程序管理非常方便。使用 Python 触发事件处理器，以便程序的其他元素读取代码、调用其他函数或相应地更改变量。由于事件处理器不是通过代码调用而是通过触发响应调用的，因此在程序中无法通过事件处理器参数传递变量。全局变量为在
    Python 中使用类来激活树莓派 GUI 事件处理提供了触发。


    ![](img/image005.jpg)


    ## Python 中的 GUI 开发


    嵌入 Python 编程语言的应用程序有很多。目前市场上有许多使用 Python 解释器作为脚本语言的流行软件应用产品。Python 还允许面向对象和结构化的命令编码。在树莓派上使用
    Python 编程语言进行 GUI 开发揭示了图形软件新创新可以定制的程度。对于学习如何编写脚本代码和用于 GUI 的面向对象事件处理器触发器的程序员人员来说，Python
    是最佳选择。


    Python 为 GUI 程序软件开发提供了有限的方法，例如 Abaqus 和 3D 动画软件（即 `Maya`、`Cinema 4D`、`Lightwave`、`modo`、`Houdini`、`MotionBuilder`、`Nuke`
    和 `Softimage`）以及 2D 成像程序（即 `Inkscape`、`GIMP`、`Paint Shop Pro` 和 `Scribus`）。与在
    `GNU GDB` 中 `C++` 编程语言容器使用的复杂结构不同，Python 处理几乎任何应用于视觉动态的语言都异常简单且高效。Python 用于 `ArcGIS`
    脚本和视频游戏编程语言，以及新的 Web 应用平台开发（如 Go、Google App Engine 和 Java）。


    ## 使用 Python 编写 GUI


    Python 的 `classes` 和面向对象编程是对象定义和运行代码的足够基础。数据变量是 `class` 的一部分。可以在对象内部使用的数据定义通过
    `class` 创建。`Class` 是数据面向对象应用的定义函数。当数据变量在对象外部时，它们被视为字段（fields）。该领域的函数提供了操作数据的方法。数据字段定义了事件处理器，它可以访问触发所需的任何数据。图像转换到
    `canvas`。图像结构被添加到 `dictionary` 中供以后使用。


    Python 的 `dictionary` 允许以后访问内置类型。在树莓派上使用 Python 编写 GUI 时，使用了四种（4 种）集合：1) `string`、2)
    `tuple`、3) `list` 和 4) `dictionary`。编程语言通常将文本连接成集合中的序列。Python 是模块化的，这意味着集合的切分也适用于字符串语句。将
    `tuple` 视为一组对象是 `list` 的功能。`Tuples` 和字符串是不可变的。然而，`Lists` 可以改变的，这通常通过序列中的排序或追加逻辑来实现。字符串、元组和列表的单个元素可以通过数字索引访问。与
    `lists` ，Python 中的 `dictionaries` 是高度可变的。Python 库对 `classes` 的支持可以在文档中找到。


    ## 使用 Tkinter 为树莓派使用 Python 编写 GUI


    Tkinter 提供了树莓派 Python GUI 编程的绑定导入。Tkinter Tk GUI 工具包是 Python 在树莓派以及 Windows 和
    Mac OS X 上编程代码的事实标准。`Tk` 绑定被实现为 Python 包装器（wrapper）。该包装器封装了嵌入在 Python 解释器中的完整
    `Tcl` 解释器。`Tkinter` 中的调用：1) 翻译为 `Tcl` 命令，2) 馈给嵌入解释器，3) 将 `Python` 和 `Tcl` 合并为单个应用程序。`Python`
    2.7 和 `Python` 3.1 都包含了 `Tk` 8.5 的功能，使得 `Tk` 组件可以进行主题设置，看起来像应用程序运行的原生桌面环境。


    `class` 的扩展在 Python 编程语言中被认为是继承。`class` 到继承的转换是用 Python 代码进行树莓派 GUI 面向对象编程的基本方面。当
    `Tk` 的函数与 `class` 相关时，可以对 `class` 进行扩展，以便在编程语言中添加尽可能的内容。`Classes` 还可以用于定义初始化 `__init__`，这是一个特殊的函数命令。当应用此项时，类与对象的创建相关。


    在 GUI 中初始化的简单方法是，通过在类级内缩进定义语句来编程以创建新命令。如果特殊命令的第一个参数是 `self`，则类的各个部分如何识别彼此的形式就形成了。这样做是为了划分
    `class` 内部的逻辑。一旦全局变量作为 `class` 中的字段被创建，就可以编写作为类一部分的事件处理器。定义创建将激活对象的 `class` 时，类对象必须相对于父类名称说明。顶层窗口没有父类。在
    Tk 中创建一个以开始事件初始化处理的对象是通过调用 `__init__` 函数来形成完整的 `mainloop()`。


    # 第 7 章 - 树莓派 - 如何使用 Pygame


    要在树莓派上的 `Pygame` 中创建一个游戏，将需要结合 `Geany Editor` 来编写游戏代码。人们可以做的第一件事是在他们的计算机上打开 `Geany
    Editor`，以便创建一个新模板。在打开新模板文件后，需要输入一些代码来指示 `Geany` 使用 Python 编码语言以及基础模板代码。


    `Pygame` 可能并不总是已安装，所以如果没有安装，人员可以打开终端并输入 `sudo apt-get install python-pygame`（不带引号）。输入根密码后，`Pygame`
    包及其依赖项将被下载、解压并安装。


    创建一个显示窗口并具有最小事件处理属性的简单应用程序，对于第一次学习如何使用 `Pygame` 的人来说是理想的。在成功学习了一些游戏编码的基础编码和编程后，将能够尝试更高级类型的游戏。


    人们需要做的第一件事是指示 `Geany` 程序他们想要使用的编码语言。这可以通过在第 1 行输入 `#! /usr/bin/env python`（不带引号）来实现。第
    2 行可以留空，第 3 行应该是文本 `import pygame`。`import pygame` 行将导入编码和编写游戏所需的 `PyGame` 模块。第
    4 行也可以留空；同时第 5 行应该是文本 `screen = pygame.display.set_mode ((640, 400))`（不带引号）。这段代码指示
    `PyGame` 模块设置显示屏幕的尺寸。


