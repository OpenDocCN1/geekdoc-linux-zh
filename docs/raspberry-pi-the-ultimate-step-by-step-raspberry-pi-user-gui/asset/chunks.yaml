    下一个很棒的项目是 USB 转串口模块。这种技术允许树莓派在 USB 接口上工作。此 USB 可以插入平板电脑、笔记本电脑或 PC 电脑，然后将引脚连接到树莓派设备。


    很棒的地方在于，引脚的默认设置可以作为一个串口终端接口，从而从平板电脑或 PC 访问 Linux 命令。如果插入的设备有足够的功率支持，还存在为树莓派提供供电的可能性。


    不容忽视的是 Wi-Fi 适配接器（USB）。同样，这些东西非常廉价，如果你讨厌线线，它们可以很好地帮助用户将树莓派连接到网络。使用 Wi-Fi 技术极易配置的选项之一是
    Edimax 7811。


