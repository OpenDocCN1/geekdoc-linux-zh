    和 `classes` 的细节，这些内容应用于树莓派与外部设备以及基于 Web 的应用程序的脚本连接中。树莓派支持兼容跨平台应用 `Linux` 框架和操作系统的多尺度接口。


    # 关于作者


    Jason Scotts 从小就受鼓励对各种主题产生浓厚兴趣，在这样的鼓励下，他开始尽可能地探索自己感兴趣的话题。


    他从小就对技术有着浓厚的兴趣，因此他将阅读任何新形式的技术视作自己的责任。


    Jason 的目标是提供信息和教育。他并不是在强行向任何人灌信息，而是让人们在阅读文本后根据自己的情况做出决定，决定是否想要尝试这种技术。


    Jason 意识到，尽管技术之轮在不断转动，许多新技术不断发布，但并没有多少个人能跟上，因此他利用自己的书籍帮助那些稍微落后的人更新知识。

