    下一步是在程序代码中添加一个事件循环，它将持续循环，直到用户使用轮询（poll），轮询会将事件更改为事件队列中的下一个事件。接下来，人员可以在程序中添加一些代码，允许终端用户通过点击显示窗口的退出按钮来关闭图形显示窗口。


    要做到这一点，必须输入进一步的代码来指示标志位运行事件循环，直到使用 `poll` 方法更改了事件。在第 6 行中，应输入不带引号的代码 `running
    = 1`。第 7 行应留空，第 8 行应输入 `while running:` 文本。


    第 9 行包含了指示 `pygame` 模块进行事件轮询的代码。应该输入的代码是不带引号的 `event = pygame.event.poll()`。第
    10 行应输入 `if event.type == pygame.QUIT:`，第 11 行应输入不带引号的 `running = 0`。


    代码运行后，将打开一个图形显示窗口，用户可以点击窗口上的退出按钮来关闭它。或者，个人也可以不在代码中保留运行标志位，以这样就不会有编程循环。一旦基础代码编写完成，个人就可以配置窗口模板以实现窗口之间的平滑过渡，并更改窗口本身的颜色。


    在第 12 行，应输入以下文本：`screen.fill((0, 0, 0))`，在第 13 行，应输入不带引号的文本：`pygame.display.flip()`。这将设置图形显示窗口的背景颜色，并允许窗口切换之间的平滑动画。


    背景值 `0, 0, 0` 代表红、蓝、绿的值。当值设置为 `0,0,0` 时，将显示黑色屏幕；然而，个人可以根据意愿从 0 到 255 的任何地方更改这些值。


    一旦将颜色值设置为用户所需的，他们就可以继续编写代码来创建一个不可见的缓冲区。这个不可见缓冲区用于绘图，而不是直接画在屏幕上。绘图完成后，可以将缓冲区层设为不可见。当操作正确时，动画将平滑过渡而不是闪烁。


    或者地，人们还可以进行一些编码练习来显示当前时间段的颜色。例如，个人可以编写程序来分析时间并显示与一天中时间对应的颜色。可以为一天的每个时段选择不同的颜色供图形窗口显示。


    在练习这些包含事件处理和运行标志位的基础练习后，人们很快就能提升使用 `pygame` 的技能和技术。然而，在尝试进阶之前，理解如何使用 `pygame`
    模块的基本功能是至关重要的。这将确保人员理解基础代码字符串、它们的作用以及如何正确地编辑他们的程序。


    # 第 8 章 - 使用树莓派 Python 进行网络


    树莓派可以通过 Model A 和 Model B 版本的计算机设备通过传统的以太网或 WiFi 联网。虽然 Model B 自带了以太网有线连接口，但 Model
    A 需要通过 USB 2.0 提供的外部端口支持。以太网选项不是支持千兆以太网的功能。两个版本都可以通过标准 USB 连接 WiFi 并具有上行带宽接收。此时，树莓派系统需要
    USB 适配器来连接互联网。


    ![](img/image006.jpg)


    树莓派的网络能力由 Broadcom BCM2835 单片机系统（SoC）执行，该系统带有 ARM1176JZF-S 700 MHz 处理器。目前 ARM
    Linux WiFi 并不完全足够。可以通过集线器（hub）添加更多端口来连接两个以上的 USB 设备。某些树莓派键盘内置了集线器。这使得该选项非常灵活。大多数处理树莓派的
    IT 专家建议支持供电集线器。树莓派使用 Linux 作为服务器。可以通过静态 IP 地址远程访问互联网连接。可以通过路由器实现 IP 到树莓派计算机网络的宽带连接。


    ## 在 Debian Linux 中为树莓派联网的说明


    对于运行 Debian Linux 的树莓派，网络连接说明取决于 Linux 支持的接口，但与市场上提供的其他发行版并行。每当路由器颁发连接时，Linux
    会请求动态 IP 地址。静态连接需要一个不变的地址，`192.168.1.4`。这是在可用局域网（LAN）而非 WiFi 的情况下。


    通过 `ifconfig` 命令找到 DHCP 地址，可以对上述端口地址执行以太网协议。还需要路由器命令。找到目标和网关以显示路由器 IP 地址。流量通过路由器发送到网关。路由器还会发布一个地址范围，这是每个路由器协议所独有的。LAN
    设置、路由器地址和任何 DHCP 请求都为服务器提供了地址范围范围的条目。或者，也可以通过服务器地址和网关来寻求静态 IP 地址以启动连接。


    获取与默认网关对应的名称服务器条目，或直接指向 ISP 名称服务器。可以通过重启进行网络接口的动态加载，以验证配置源是否正确。用于更改动态网络配置的网络命令应用
    `ipconfig` 命令来激活或禁用在线接口。另一个选项是使用 `ifup` 或 `ifdown` 命令获取错误记录详情。


    ## 树莓派联网的六 (6) 个步骤


    这是一个关于如何在树莓派中设置无线网络能力的教程。网络选项增加了对新的 Python 生成库的访问，用于编写基于 Web 的软件应用程序。这包括作为系统服务（SaaS）执行基础设施的软件应用程序。在操作系统、知识共享和在线编程语言方面有很多收获，网络是进步树莓派社区协作的最优连接。


    通过将无线设备插入树莓派或 USB 集线器，机器就准备好接收网络连接命令了。


    找到设备名称，以便在发布互联网支持请求之前映射到必要的协议。


    `lsusb` 是获取树莓派平台内所有 USB 设备的语法。查看 USB 记录以代表无线设备的文件。在 USB 设备列表中找到无线适配器。此搜索的结果将索引驱动程序所需的关键设备信息（例如总线端口号、制造号、序列号等）。


    在创建网络之前必须更新软件包信息。通过输入 `apt-get update` 从 Debian 更新，并在下载完成后输入 `apt-cache search
    RTL818`。设备 ID 可能与识别所需的不同。某些程序员建议缩短 ID 。目标是通过这种方法使用 `apt-cache` 命令定位适配器。输入命令在 USB
    端口列表上找到正确的适配器：`lsmod`。相同的 ID 应该会出现。


    通过输入命令 `sudo nano /etc/wpa.config` 为无线适配器生成文件（配置）。保存文件并返回网络命令的提示提示符。这将引导确认添加位置的最后一步。


    过程的最后一步是拔掉网线以测试无线设备的性能。通过输入 `sudo /etc/init.d/networking restart` 重启网络以完成。


