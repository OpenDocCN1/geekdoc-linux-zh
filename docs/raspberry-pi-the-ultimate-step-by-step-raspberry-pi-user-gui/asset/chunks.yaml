    # Chapter 8- Networking with Raspberry Pi Python


    Raspberry Pi networking by way of both Model A and Model B versions of the computer
    device can be done by traditional Ethernet or WiFi. While Model B comes wired
    for Ethernet, Model A requires an external port support by way of USB 2.0. The
    Ethernet option is not a Gigabit Ethernet supported feature. WiFi can be connected
    via standard USB in both versions with upstream bandwidth reception. At this time,
    Raspberry Pi systems require USB dongles to connect to the internet.


    ![](imgs/image006.jpg)


    Raspberry Pi networking capabilities are performed by a Broadcom BCM2835 system
    on a chip (SoC) with an ARM1176JZF-S 700 MHz processor. ARM Linux WiFi is not
    entirely sufficient at this time. Connecting more than two USB devices can be
    done by utilizing a hub to add more ports. Some Raspberry Pi keyboards have had
    hubs built-in. This makes this option quite flexible. Most IT specialists working
    with Raspberry Pi recommend powered hub support. Raspberry Pi uses Linux as the
    server. Connection to the internet can be accessed remotely with a static IP address.
    Broadband connection of an IP to a Raspberry Pi computer network can be done by
    way of router.


    ## Instructions to networking Raspberry Pi in Debian Linux


    Instructions to Raspberry Pi running Debian Linux for network connectivity is
    discretionary to the Linux supported interface, but is parallel to other distributions
    available on the market. Linux requests a dynamic IP addressed whenever a router
    issues connection. Static connection requires an address that is unchanged, `192.168.1.4`.
    This is in the case that a LAN is available, rather than WiFi.


    By locating the DHCP address with the `ifconfig` command, Ethernet protocols to
    the port address mentioned can be performed. A router command is also required.
    Find the destination and gateway to show the router IP address. Traffic is sent
    via the router to the gateway. There will also be an address range issued by the
    router, and this is unique to individual router protocol. LAN settings, router
    address and any DHCP requests are provided entries between a range of addresses
    for the server. Alternately, a static IP address can be sought, again by way of
    the server address and gateway for initiation of the connection.


    Source the name server entry correspondent to the default gateway or direct to
    the ISP name servers. Dynamic reload of a network interface can be conducted with
    reboot to verify source of configuration is correct. Networking commands to make
    changes to dynamic network configurations apply the `ipconfig` command to activate
    or deactivate the online interface. Another option is to use `ifup` or `ifdown`
    commands for error record details.


    ## Six (6) Steps to Networking Raspberry Pi


    Here is a tutorial on how to set up a wireless networking capability in Raspberry
    Pi. Networking options increase access to new Python generated libraries for programming
    Web based software applications. This includes software applications as system
    (SaaS) that perform infrastructural operations. With so much to gain in terms
    of operating systems, knowledge sharing and programming language online, networking
    is by far the optimum connection to advancement of the Raspberry Pi community’s
    joint efforts.


    By plugging in a wireless device into Raspberry Pi or a USB hub on the computer,
    the machine is prepared to receive the commands for networking connectivity.


    Find out the name of the device, so that protocols to the necessary drivers can
    be mapped out prior to issuing request for internet support.


    `lsusb` is the syntax for sourcing all USB devices within a Raspberry Pi platform.
    Review the USB record for a file that represents the wireless device. Find a wireless
    adapter in the USB device list. Sample result to this search will index the key
    device information required for the drivers (i.e. bus port no., manufacturing
    no., serial no. etc.).


    Package information must be updated prior to creating a network. Source updates
    from Debian by entering `apt-get update`, and enter `apt-cache search RTL818`
    once the download as finished. A device ID may be different than is required for
    recognition. Some programmers recommend shortening the ID description. The goal
    is to locate the adapter by using the `apt-cache` command in this manner. Enter
    the command to find the proper adapter on the USB port list: `lsmod`. The same
    ID should show up.


    Generate a file (configuration) for the wireless adapter by entering the command:
    `sudo nano /etc/wpa.config`. Save the file and go back to the `$prompt` for network
    commands. This will lead to the final step in confirmation to add a location to
    the interfaces.


    The final step in the process is unplugging the network cable to test the wireless
    device for aptitude. Restart the network by entering: `sudo /etc/init.d/networking
    restart` to complete.

