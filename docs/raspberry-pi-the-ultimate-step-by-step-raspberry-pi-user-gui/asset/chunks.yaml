- fmt: 'Python is not restricted to scripting language, and can be packaged as part
    of standalone executable programs with third-party tools. Python interpretation
    is offered for most operating systems. The programming language is embedded in
    a number of popular software products on the market.


    ## Python Features

    The multi-paradigm programming language, Python allows for object-oriented programming
    and structured programming. The language features of the programming language
    can also support extensions including logic programming. The dynamic typing, reference
    counting and a cycle-detecting garbage collector features are exceptional for
    memory management. Dynamic name resolution serves to link method and variable
    names during execution of programs.


    ![](imgs/image003.jpg)


    ## Python Syntax and Semantics

    Python syntax and semantics are simple and highly readable for replication. The
    model of Python language syntax is uncluttered. Frequencies in language usage
    are retained in the repository of the programming language so that there is future
    recognition. Punctuation and syntactic exceptions are noted, making semantics
    even more precise in acknowledgement that alternate programming languages such
    as `C` or `Pascal`.


    ## Python Expressions

    Similar to `C` and `Java` programming expressions, Python conversion of expressions
    truncates by comparative value. Object identities or comparison by reference may
    also be used. Those comparisons can be chained to create a series of commands.
    Integer division is the model used to truncate values by converting one of the
    integers to a float. Due to the fact that Python used real language rather (`and`,
    `or`, or `not`) for boolean operators rather than symbols, the result of the integer
    division model is still expressed in alpha form.


    ## Python Libraries

    The Python programming language has a sizable standard library for building programs.
    Standard internet formats and protocols `MIME` and `HTTP` are both supported.
    Other modules used for arithmetic with arbitrary precision decimals, creation
    of graphical user interfaces, connection to relational databases, and manipulation
    of regular expressions is available. Unit testing and software testing in the
    Python library in `doctest` and `unittest` modules performs reliability on new
    developments.


    Although the standard library is not required to run or embed Python programming
    language in an application, the Python Package Index, the official repository
    of third-party software for the codecs, contains an extensive number of packages
    for developer purposes: scientific computing, text processing, image processing,
    graphical user interface, multimedia, databases, networking and communications,
    web framework, and test frameworks, documentation tools, system administration.


    Python libraries such as `Matplotlib`, `NumPy` and `SciPy` enable the programming
    language to be applied efficiently in scientific computing. For instance, libraries
    used to program mathematical software in Python will be comprised of mathematical
    elements: algebra, calculus, combinatorics, numerical mathematic and number theory.


    ## Python Software Development

    The Python programming language is currently embedded in a number of popular software
    products. The use of Python scripting language with finite element method software
    like Abaqus or 3D animation software (i.e. `Cinema 4D`, `Houdini`, `Lightwave`,
    `Maya`, `modo`, `MotionBuilder`, `Nuke` and `Softimage`) and 2D imaging programs
    (i.e. `GIMP`, `Inkscape`, `Paint Shop Pro` and `Scribus`) is valued for its accessibility.


    The use of complex structures like `C++` containers in `GNU GDB` is evidence that
    Python is a sophisticated enough programming language to handle visual dynamics.
    It is also used for script writing of ArcGIS, video games, and as the language
    of choice for Web based update of platforms (Google App Engine and Java).


    ## Python Software Application as System (SaaS)

    The fact that Python has been used as artificial intelligence in software application
    as system (SaaS) tasks makes it a preferred scripting language with module architecture.
    The rich text processing tools and syntax of Python are optimum for natural language
    processing. Its ready exploitation capabilities of almost any information security
    infrastructure and application in targeted open source programming language development
    communities reveals the exceptional flexibility of the use of Python in any SaaS
    environment.


    Web applications scripting interface with development of a standard API frameworks
    supports development of complex applications design and maintenance. For instance,
    `Pyjamas` and `IronPython` are client-side developers of `Ajax`-based applications.
    The popular `SQLAlchemy` used for data mapping of relational databases also uses
    Python programming language. It also supports the `twisted` framework designed
    to creating programming of communications between computers.


    ## Python Developer Communities

    The entrance of Python as a standard language in most Linux distributions has
    made it widely used in opens source operating systems applications (i.e. `FreeBSD`,
    `NetBSD`, `OpenBSD`, `OS X` etc.). Installers for Linux distribution are also
    programmed in Python. Free and open source `CPython` software is proffered by
    way of a knowledge sharing exchange activity. The `CPython` online community development
    model allows iteration or completely new implementations of programming and sharing.
    `CPython` is a program of the Python Software Foundation. The Raspberry Pi Foundation’s
    single-board computer project adopted Python codecs for its interface.


    # Chapter 4- Other Gadgets That Can Be Used With Raspberry Pi Python


    Before even getting into what other forms of technology can be connected to the
    Raspberry Pi it must be highlighted that the debut of this mini personal computer
    has created quite a storm in the information technology industry and has created
    a new wave of competition.


    The benefits of the raspberry Pi are many the most advantageous being its size
    (it is the same size as a credit card). It has similar functions to a standard
    computer and is more cost effective. The possibility also exists to operate it
    as a low cost server that can deal with a bit of web or internal traffic. In the
    short and long term putting together a number of Raspberry Pi to create a server
    costs much less than getting a standard server. If the web traffic is light then
    a Raspberry Pi can be used and money can be saved.


    Since I have become familiar with the Pi technology I have conducted a few experiments
    of my own with a number of sensors and other devices. From these experiments I
    have put together a list of the devices that I have found to work rather well
    with this type of technology. The items do not cost a lot and integrate easily
    with the software and can be the groundwork for an even bigger project.


    The items that can be created range from security systems to robot cars and can
    be put together in a number of ways to make something fantastic. If you are buying
    a gift for a Raspberry Pi aficionado then this chapter will give you quite the
    head start on the selections that are available.


    The first item that we can look at is the PIR movement sensor. It is a great piece
    of technology that allows the user to detect movement through the use of passive
    infra red sensors. These sensors are not costly and come with pins that can be
    connected right to the `GPIO` header of the Raspberry Pi. It is a great device
    to make a robotic sensor or to use with a security system.


    The next item that can be looked at is the Nintendo Wii controller. This is a
    great option for the game lovers. The `Wiimote` can be connected to the raspberry
    Pi and open up a world of great possibilities as it pertains to gaming.


    After that there is the ultrasonic module. These modules can improve the distance
    that can be read by the Raspberry Pi device. You can opt for an ultrasonic module
    that has an `echo` pin, a `trigger` pin and two power pins.

