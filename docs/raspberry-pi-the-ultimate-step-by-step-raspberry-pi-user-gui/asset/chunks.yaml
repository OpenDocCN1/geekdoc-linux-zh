- fmt: '

    The next great item is the USB to serial module. This type of technology allows
    the Raspberry Pi to work on a USB interface. This USB can be plugged into a tablet,
    laptop or PC and then the pins can be connected to the Pi device.


    The great thing is that the pins default settings can be a serial terminal interface
    than can be used from a tablet or PC to access Linux command. The possibility
    also exists to provide power for the Pi from the device that it is plugged into
    if there is enough power to support it.


    Not to be left out is the Wi-Fi Dongle (USB). Again these are cheap and if you
    hate cables work well to help the user to connect the Pi to a network. One of
    the options that are extremely easy to configure using Wi-Fi technology is the
    Edimax 7811.


    The USB Bluetooth Dongle is another great techie option. These can be bought online
    or in a computer store. This device allows you to make a connection with a number
    of Bluetooth devices like Wii controllers, computer mice and keyboards.


    The character LCD display (16×2 or 20×4) is the next top option that can be looked
    at. These displays can be either 20 characters or 16 characters and are not hard
    to connect to the raspberry Pi’s GPIO pins. All that you have to ensure when you
    are making your purchase is that the items are compatible. To be able to turn
    the screen on or off and to make adjustments to the brightness the user would
    only require a few more simple components.


    Sticking to screens that work well with the Pi device, mini LCD screens can also
    be considered. There are quite a number of these screens that can accommodate
    a video input of a composite nature. These work well if the aim is to connect
    it to the Pi’s video output. These screens are typically outfitted with two video
    inputs, come with 12 V power and are more often than not used as reversing camera
    screens for cars.


    Now we can look at LED buzzer boards. The one that will be focused on is the BerryClip
    6 LED board. It can be plugged right into the Pi’s GPIO header and is considered
    and add on board. With this device the user will have a momentary switch, a buzzer
    and 6 LEDS that are colored. Any language can be used to control then and one
    can simply look through the various Python scripts to find a suitable one.


    Last but not least there is the stepper motor. The one that I tried had a controller
    board that could be connected directly to the Pi’s GPIO. All the user has to do
    is put in a series of sequences and the motor will turn.


    # Chapter 5- Using Raspberry Pi to Create an LED Indicator


    The Raspberry Pi is the ideal piece of equipment to use to connect an indicator
    light for a myriad of projects like new mails or weather notifications. This chapter
    will highlight the way that this can be done.


    Some may wonder why something like this would even be considered. The real deal
    is that it is a fun project to undertake.


    As highlighted in the previous chapter the Raspberry Pi is something that you
    can do a lot of experiments with and learn something new at the end of the day.
    No one really needs a device to indicate whether it is going to rain or not but
    it really is a fun project to work on.


    ![](imgs/image004.jpg)


    ## What Is Needed To Do This?


    If you opt not to follow the tutorial you will require a few things. The assumption
    in this case is that you are already knowledgeable on the basics of Raspberry
    Pi and can install Raspbian on the Raspberry Pi.


    Apart from having a Pi unit that not only works effectively but has Raspbian installed
    on it you will require some more items. You will need:


    1. `raspberry pi case (clear)`

    2. `ledborg module`


    One thing to bear in mind is that the choice of case if optional as to whether
    you want it to be frosted or clear. If the case you currently have is opaque you
    will have to make adjustments to it by either using a breakout kit with GPIO extension
    or simply cutting a hole in the case so the LED indicator can be seen. The breakout
    kit, though it will bring the cost on material purchases up a bit will be more
    beneficial for any customizations you will do in the end. You will have a greater
    ability to place the Led under something to illuminate it or inside something
    to do same.


    ## Getting the LedBorg Installed


    Though, if you are up to it you can put build an LED indicator, you can find some
    pretty cost effective ones like the LedBorg to purchase.


    It is pretty easy to get the module installed and the design allows it to be set
    right on the Raspberry Pi GPIO pins. To stat you need to shut down the Pi and
    then open the case.


    Before getting started it is essential that the module be oriented so that the
    LedBorg icon is close to RCA module. In a nutshell the edges of the Pi board should
    be flush with the LedBorg and the overhang should not be over the edge but only
    hanging over the Pi board.


    With the Pi board open, it is the perfect time to cover the Led indicators that
    are beside the USB ports especially if a clear case is being used. This will help
    avoid the confusion with reading the LedBorg indicator as the network indicator
    lights and power lights tend to be rather bright.


    A simple solution is to cover the lights with electrical tape (white). It will
    reduce the brightness of the lights so they can be still be seen but not detract
    from the LedBorg.


    As soon as the LedBorg is correctly installed and all other adjustments are mad
    the case can be closed. Before moving on to the next phase, turn the Pi back on
    and let it boot up.


    ## Installing the Software


    First one has to find a suitable software package that come with the requisite
    drivers which allow access to the LedBorg from the command line and also has a
    GUI controller. Just ensure whichever package you select is compatible with the
    Raspberry Pi and the version of Raspbian that you have.


    If your Raspberry Pi has mounting holes then there is certain procedure that you
    have to follow and if it has none there is another procedure that you have to
    follow. These are thing with which you would already be familiar. You will also
    have to be aware of the Raspbian kernel. To do a quick check all you have to do
    is open the terminal and enter `uname -r`.


    As soon as you have all the information, you can proceed to the next step and
    get the link for your package. For the purposes of example the Revision 1 board
    is being used with the 3.6.11 kernel.


    To get the installation process underway the terminal on the Raspberry Pi needs
    to be opened. Once this is done a series of commands can be entered to get the
    package installed. Keep in mind that the third command URL has to be replaced
    with the board/kernel package URL.


    When this point is reached then you will have the drivers and GUI wrapper installed.
    When you look on the Raspian desktop an icon will be there for the GUI wrapper.


    You can proceed by launching the GUI wrapper. To do this, simply click the Led
    Borg icon. This is the time that you can check to ensure that the module is working
    properly. You can select any color and save it to try it out.


    In the demo mode you are able to go through the range of colors and you can see
    them at various speeds. You can also see how they work at low output and high
    output.


    It is here that you also have the option to configure the LedBorg. You can simply
    go to the colors section of the CPU and the Led will first be green then yellow
    and then be red. This merely indicates the ARM processors load. It is best to
    change the speed to slow as this will be more beneficial in the long run.

