    # 第 5 章- 使用树莓派制作 LED 指示器


    树莓派是连接指示灯以用于无数项目（如新邮件或天气通知）的理想设备。本章将重点介绍如何实现这一操作。


    有些人可能会纳闷，为什么会考虑这样的东西。事实情况是，这是一个有趣的尝试项目。


    正如上一章所强调的，树莓派是一个你可以对其进行许多实验并在最后一天中学到新知识的设备。虽然没人真的需要一个设备来指示是否是否会下雨，但这确实是一个非常有趣的项目。


    ![](img/image004.jpg)


    ## 完成此操作需要什么？


    如果你不遵循教程操作，你将需要几样东西。在这种情况下，假设你已经熟悉树莓派的基础知识，并且并可以在树莓派上安装 Raspbian。


    除了拥有一个运行良好且安装了 Raspbian 的树莓派单元外，你还需要一些其他物品。你需要：


    1. `raspberry pi case (clear)`

    2. `ledborg module`


    需要记住的一点是，外壳的选择是可选的，取决于你想要磨砂的还是透明的。如果你目前有的外壳是不透明的，你必须对其进行调整，要么使用带有 GPIO 扩展的适配接套件，要么简单地在外壳上开一个洞，以便
    LED 指示器可见。虽然适配接套件会增加材料购买的成本，但对你最终将进行的任何自定义将更有利。你将更有能力将 LED 放在某些东西下面进行照明，或者放在某些东西内部来实现同样的操作。


    ## 安装 LedBorg


    尽管如此，如果你愿意制作一个 LED 指示器，你可以找到一些像 LedBorg 这样非常有性价比的物品进行购买。


    安装模块非常简单，其设计允许它直接设置在树莓派的 GPIO 引脚上。开始之前，你需要关闭树莓派然后打开外壳。


    在开始之前，至关重要的是模块的方向要正确，使 LedBorg 图标靠近 RCA 模块。简而言之，树莓派板板的边缘应该与 LedBorg 对齐，悬空部分不应超过边缘，而应仅悬在树莓派板上方。


    树莓派板子打开后，现在是覆盖 USB 端口旁 LED 指示器的完美时机，特别是使用透明外壳时。这有助于避免在读取 LedBorg 指示器时误认为是网络指示灯和电源灯，因为这些灯通常非常亮。


    一个简单的解决方案是用电胶带（白色）覆盖灯光。它会降低光的亮度，使其仍然可见，但不会分散 LedBorg 的注意力。


    一旦 LedBorg 安装正确并完成了所有其他调整，就可以关闭外壳了。在进入下一阶段之前，重新开启树莓派并让它启动。


    ## 安装软件


    首先，必须找到一个带有必需驱动程序的合适软件包，这些驱动程序允许你从命令行访问 LedBorg，并且带有一个 GUI 控制器。只需确保你选择的任何包与树莓派以及你拥有的
    Raspbian 版本兼容即可。


    如果你的树莓派有安装孔，那么有一段特定的程序你需要遵循；如果没有孔，则有另一套程序需要遵循。这些都是你已经熟悉的事情。你还需要注意 Raspbian 内核。要进行快速检查，你只需打开终端并输入
    `uname -r`。


    一旦你获取了所有信息，就可以进行下一步并获取软件包的链接。为了示例，我们正在使用带有 3.6.11 内核的 Revision 1 板子。


    为了启动安装过程，需要打开树莓派上的终端。完成后，可以输入一系列命令来安装软件包。记住，第三条命令的 URL 必须替换为板子/内核包的 URL。


    到达这一步时，你就已经安装了驱动和 GUI 包装器。当你查看 Raspian 桌面时，会有一个 GUI 包装器的图标。


    你可以通过启动 GUI 包装器继续进行。要这样做，只需点击 Led Borg 图标。这时你可以检查以确保模块工作正常。你可以选择任何颜色并保存它以进行尝试。


    在演示模式下，你能够遍历颜色范围，并在各种速度下查看它们。你还可以看到它们在低输出和高输出下的工作情况。


    在这里你还有配置 LedBorg 的选项。你只需进入 CPU 的颜色部分，LED 将先变为绿色，然后是黄色，最后变为红色。这仅仅指示 ARM 处理器的负载。最好将速度更改为慢，因为从长远来看更有利。

