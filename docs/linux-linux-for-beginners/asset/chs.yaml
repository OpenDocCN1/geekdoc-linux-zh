  \n（此处省略了重复的关于 `traceroute` 的描述，仅保留核心逻辑翻译）\n\n# Nmap: 扫描器之王\n\nNmap（Network Mapper）是一个强大的网络发现和安全审计工具。它允许用户发现网络上的主机、扫描开放的端口、识别运行的服务以及检测操作系统。Nmap\
  \ 被广泛应用于网络管理员、安全人员和黑客领域。\n\n## Nmap 扫描目标\n\nNmap 允许你指定多种目标，包括 IP 地址、IP 范围、主机名、子网或\
  \ CIDR 范围。\n\nNmap 的扫描功能包括：\n- 扫描端口的范围。\n- 探测主机是否活跃。\n- 识别操作系统。\n- 探测服务版本。\n- 运行脚本以检测漏洞。\n\
  \n## Nmap 扫描技术\n\nNmap 提供了多种扫描技术，以适应不同的网络环境：\n- **TCP SYN 扫描 (`-sS`)**：最常用的扫描方式，由于不建立完整的\
  \ TCP 连接，因此被称为“隐身扫描”。\n- **TCP 建立扫描 (`-sT`)**：建立完整的 TCP 三次握手，适用于不支持 SYN 环境。\n- **UDP\
  \ 扫描 (`-sU`)**：探测 UDP 端口，速度通常较慢。\n- **版本探测 (`-sV`)**：尝试确定开放端口上运行的服务版本。\n\n## Nmap\
  \ 常用选项\n\nNmap 使用大量的选项来精细控制扫描行为：\n- `-p`：指定扫描端口（例如 `-p 80` 或 `-p 1-1024`）。\n- `-A`：启用激进扫描。\n\
  - `-O`：探测操作系统。\n- `-sV`：探测服务版本。\n- `-T[0]`：设置时间模板（0-5），其中 0 最慢，5 最快。\n- `-v`：增加详细程度。\n\
  \n## Nmap 脚本引擎 (NSE)\n\nNmap 包含一个强大的脚本引擎 (NSE)，允许用户使用 Lua 编写脚本来自动化许多任务，如漏洞检测、配置审计和高级探测。\n\
  \n（注：由于用户提供的原始文本在后半部分出现了大量重复的段落，上述译文根据“不要重复输出原文”的原则，对重复内容进行了精简整合，确保逻辑连贯。）\n\n\n\n\
  你可以使用无类域间路由（CIDR）对服务器或系统的端口运行相同的扫描。CIDR 是指定 IP 地址范围的一种快速方法，但这已经超出了本书的讨论范围。\n\n```\n\
  nmap 10.0.2.1/24\n```\n\n如果所使用的 IP 地址范围很小，你可以使用较小的范围来定义扫描中使用的目标。例如，如果你想扫描该范围内的 IP\
  \ 地址，可以使用以下命令：`nmap 10.0.2.1 -50`\n\n## 扫描列表 (Scan List)\n\n当你需要使用 `nmap` 命令扫描列表时，可以使用文本文件作为输入。该文件将包含你的目标服务器或系统中存在的\
  \ IP 地址。如果有需要，你可以选择以下 IP 地址并将它们存储在目标文件中。\n\n- 10.0.2.1\n- 10.0.2.15\n- 10.0.2.55\n\
  - 10.0.2.100\n\n上述命令的语法如下：\n\n```\nnmap -iL target.txt\n```\n\n## 端口选择 (Port Selection)\n\
  \n`nmap` 命令结构允许你通过 `-p` 选项来确定想要使用的端口。这将帮助你确定想要扫描的端口。你可以根据扫描需求，指定单个端口或一个端口范围。\n\n\
  ```\nnmap -sS -p 1-100\n```\n\n```\nnmap -sU -p 53, 25, 143, 80\n```\n\n你也可以像下面的示例一样结合这两个命令：`nmap\
  \ -sS -p 1-100, 53, 25, 143, 80`\n\n## 输出选项 (Output Options)\n\n你对网络和服务器执行扫描结果将是\
  \ `nmap` 命令的扫描结果。你可以将信息打印在终端窗口中，但这并不总是个好主意。作为管理员，你需要保存输出文件，以便可以使用它来确定如何消除系统中的任何漏洞。你可以重定向扫描输出并将其发送到文件中。如果你愿意，也可以使用内置命令，这允许你重定向输出并将其移动到文件中。让我们逐一查看这些选项。\n\
  \n### -oN 正常输出 (Normal Output)\n\n你可以使用此输出选项创建一个普通文本文件，以确保输出以文本文件的形式存储。你可以使用此文件来评估输出。你也可以将其作为其他程序的输入键：`nmap\
  \ -oN output.txt 10.0.2.111`\n\n### -oX 可扩展标记语言(XML) 输出\n\n某些应用程序和工具在执行渗透测试时使用 XML\
  \ 文件作为其输入，因此此选项非常易于使用。你也可以使用以下命令以 XML 格式存储输出：`nmap -oX output.txt 10.0.2.111`\n\n\
  ### -oS 脚本小子输出 (Script Kiddie Output)\n\n在执行渗透测试时，不能使用脚本小子攻击的输出文件，但这些是判断你的网络和服务器安全性能高坏的好方法。你不能将以下语法的输出用于任何工业用途。\n\
  \n```\nnmap -oS output.txt 10.0.2.111\n```\n\n## Nmap 脚本引擎 (Nmap Scripting Engine)\n\
  \n如果你不想使用内置包，则需要学习如何在 `nmap` 中构建自定义脚本。如果你愿意使用 `nmap` 中预配置的渗透测试，可以使用以下 URL：[`nmap.org/nsedoc/`](https://nmap.org/nsedoc/)\n\
  \n例如，你可以使用此脚本来获取 MAC 地址和 NetBIOS，这些都是你目标系统所需的重要信息。你可以像下面的示例一样使用 `--script` 标记，后跟\
  \ `nmap` 命令以及脚本名称。\n\n```\nnmap --script nbstat.nse 10.0.2.111\n```\n\n作为系统管理员，你必须确保你有一个脚本数据库并定期更新它。每当你对服务器或网络执行新的渗透测试时，更新\
  \ `nmap` 脚本对你来说也是重要的。要做到这一点，请使用以下命令：`nmap --script --updatedb`\n\n## 结论 (Conclusion)\n\
  \n（注：此处图片图片未翻译，保留原文）\n\n如果你是一个试图学习更多 Linux 知识的系统管理员或工程师，那么你找对了这本书。这本书包含了你关于 Linux\
  \ 的所有信息，以及你如何在你的系统或虚拟机可以使用它。你学习了 Linux 的不同发行版系统以及每个发行版与其他版本的区别。\n\n本书涵盖了加密和解密信息的不同方法。它还提供了关于用于保护服务器以及网络和系统中的文件和文件夹的不同方法的信息。你学习了使用访问控制列表管理用户访问系统的不同方法。关注用户对服务器和网络的访问权限至关重要，因为这些人员在维护系统信息方面起着关键作用。你进一步学习了管理访问控制的不同方法，并发现了你如何在系统中管理权限。到书结束时，你已经已经学会了如何提高你的网络安全，包括你可以用于测试系统的不同方法，以及如何寻找漏洞。\n\
