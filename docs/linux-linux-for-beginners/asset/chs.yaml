- "# Linux 入门指南\n\n\n\n![](img/cover1.jpeg)\n\n![](img/Image00000.gif)\n\n\n\n\n\n\
  \n\n\n[student@desktop ~]$ ls -l /usr/bin/passwd\n-rw s r-xr-x.    1    root   \
  \ root    34598    Jul 15  2011    /usr/bin/passwd\n```\n\n当文件设置了粘滞位时，它会限制文件被删除。只有该文件的所有者或\
  \ root 用户才能删除此类文件。例子是 `/tmp` 目录。\n\n```\n[student@desktop ~]$ ls -ld /tmp\ndrwxrwxrw\
  \ t     39    root    root    4096    Jul 10  2011    /tmp\n```\n\n`setgid` 位允许文件从其父目录继承权限，而不是从设置权限的用户。\n\
  \n让我们来看看特殊权限如何影响文件和目录。\n\n| 特殊权限 | 对文件的影响 | 对目录的影响 |\n| :--- | :--- | :--- |\n|\
  \ `u+s suid` | 文件将以所有文件的用户身份执行，而不是运行命令的用户身份 | 无影响 |\n| `g+s sgid` | 文件将以所有文件的组身份执行\
  \ | 目录中新创建文件的组所有者将与目录的组所有者一致 |\n| `o+t sticky` | 无影响 | 对目录具有写入权限的用户只能删除他们拥有的文件。他们不能删除或强制写入其他用户拥有的文件\
  \ |\n\n让我们看看如何为文件和目录设置特殊权限。\n\n*   用符号形式表示，`setuid` 是 `u+s`，`setgid` 是 `g+s`，粘滞位是\
  \ `o+t`。\n*   用数值形式表示，特殊权限使用每个用户第一个数字之前的第四位。`setuid` 是 `4`，`setgid` 是 `2`，粘滞位是 `1`。\n\
  \n让我们尝试理解默认权限。创建文件的进程为该文件设置默认权限。例如，如果你使用 `vim` 或 `nano` 等文本编辑器创建文件，该文件默认对所有人都有读取和写入权限。但它对所有人都没有执行权限。编译器创建的文件默认是二进制可执行文件。这些文件将具有执行权限。使用\
  \ `mkdir` 命令创建的文件用于创建目录，这些目录默认具有读写权限。\n\n根据研究，权限在文件创建时并立即设置。shell 的 umask 于清除这些权限。你可以不带任何选项运行\
  \ `umask` 命令来查看 umask 值。\n\n让我们来看一个例子。\n\n在上面的示例中，掩码值为 `0002`。这意味着其他位被设置为 `2`。借此我们可以推断，特殊用户和组权限不会被清除，因为它们被设置为\
  \ `0`。\n\n系统中 shell 用户的 `umask` 默认值在 `/etc/profile` 和 `/etc/bashrc` 中定义。\n\n\n\n\
  \n\n在本章中，我们将使用 `GRUB2` 引导程序详细讨论 Linux 的引导和启动过程，因为它被大多数 Linux 发行版所使用。少数 Linux 发行版仍然使用旧软件进行引导和启动过程，但我们不会涉及它们。\n\
  \n# 启动序列\n\nLinux 的启动序列可以通过几种方式启动。最简单的方法是开启 Linux 电源。如果系统上创建了用户或以 root 用户登录，你可以通过命令行启动系统重启来触发启动序列。\n\
  \n## BIOS POST\n\nLinux 启动序列的第一步与 Linux 及其操作无关。第一步完全关于初始化系统上的硬件，这在所有操作系统都是通用的。当你按下系统的电源按钮时，会启动一个称为上电自检（Power\
  \ On Self Test，简称 `POST`）的测试。`POST` 是基本输入输出系统（或 `BIOS`）的一部分。\n\n`BIOS` 首次引入于 1981\
  \ 年，当时 IBM 开发了第一台计算机。`POST` 是 `BIOS` 的一个模块，用于检查系统上的所有硬件是否功能正常。如果 `POST` 失败，则表明系统存在问题。系统将处于不可用状态，且\
  \ `BIOS` 将不会启动。\n\n`POST` 和 `BIOS` 的功能是检查启动系统所需的所有硬件是否功能正常。它们随后会一个名为 `INT 13H` 的\
  \ `BIOS` 中断，该中断负责寻找硬盘等可启动设备，并通过定位其引导扇区来启动。当中断找到第一个包含有效引导记录的引导扇区时，它会被加载到内存中，控制权将交给引导扇区中的代码。\n\
  \n你可以说引导扇区是引导加载的第一阶段。多年来，Linux 发行版一直使用了三种引导加载程序：LILO、`GRUB` 和 `GRUB2`。最新且流行的引导加载程序是\
  \ `GRUB2`，现在每个最新版本的 Linux 发行版都使用 `GRUB2`。\n\n## GRUB2\n\n`GRUB2` 代表 `GRand Unified\
  \ Bootloader version 2`。`GRUB2` 是一个定位操作系统内核并将其加载到系统内存中的模块。\n\nLinux 从未正式宣布过 `GRUB2`\
  \ 的任何阶段，但我们想告诉你 `GRUB2` 分 3 个阶段运行。让我们过一下这些阶段。\n\n### 第一阶段\n\n正如在 `POST` 和 `BIOS`\
  \ 部分提到的，当 `POST` 成功完成后，控制权由 `BIOS` 接管，`BIOS` 开始查找任何可启动设备。它随后在可启动设备上找到主引导记录（`MBR`），然后将其加载到系统内存中，从那里执行引导记录。`GRUB2`\
  \ 第一阶段的引导代码非常小，因为要求是它必须置于可启动设备上的第一个 512 字节扇区内，并与分区表的元数据一起。由于这个原因，分配给引导代码的空间只有 446\
  \ 字节。这个 446 字节的文件被称为 `boot.img`，它不包含分区表。\n\n引导记录由于其尺寸较小，它不维护任何关于文件系统的信息。`GRUB2`\
  \ 引导加载程序第一阶段的主要目标是定位下一个阶段。在引导记录和可启动设备的第一个分区之间是 `GRUB2` 引导加载程序的第 1.5 阶段。第一阶段将 1.5\
  \ 阶段加载到内存中，并将控制权交给 1.5 阶段。\n\n### 第 1.5 阶段\n\n1.5 阶段始终位于引导记录和可启动设备的第一个分区之间。由于技术问题，这段空间多年没有分配给任何内容。硬盘上的第一个分区从第\
  \ 63 扇区开始。主引导记录从第 0 扇区开始。这意味着在主引导记录和硬盘第一个分区之间有 62 个扇区，或者说 512 字节扇区，即 31,744 字节。这就是存储\
  \ `core.img` 文件的地方，它包含了 `GRUB2` 的第 1.5 阶段。`core.img` 文件的大小为 25,389 字节。这意味着它可以舒适地放置在引导记录之后、第一个分区之前。\n\
  \n由于有足够的空间来存储 `GRUB2` 1.5 阶段的代码（这不需要大量空间），额外的空间被用于包含文件系统驱动程序，如 FAT、EXT 和 NTFS。这意味着标准的\
  \ EXT 文件系统就足够存储 `GRUB2` 第二阶段的代码了。`GRUB2` 第二阶段代码的位置位于 `/boot/grub2`。\n\n### 第二阶段\n\
  \n执行 `GRUB2` 第二阶段所需的所有文件都位于 `/boot/grub2` 及其子目录中。`GRUB2` 第二阶段不像第一阶段和 1.5 阶段那样拥有镜像文件。相反，它在需要时从\
  \ `/boot/grub2/i386-pc` 目录加载运行时模块。\n\n`GRUB2` 第二阶段的主要目标是找到 Linux 内核并加载到内存中，以便将控制权交给内核。Linux\
  \ 内核文件存储在 `/boot` 目录。人们很容易识别 Linux 内核文件，因为它们都以 `vmlinuz` 为前。你可以通过列出 `/boot` 目录轻松查看\
  \ Linux 内核文件。\n\n因此，当系统启动时，你会看到一个屏幕，你可以从中选择相应的内核。\n\n## 内核\n\n所有的内核都以压缩格式存储以优化空间，但它们可以自行解压。我们知道\
  \ Linux 内核位于 `/boot` 目录。当内核执行时，它会调用 systemd 并最终将控制权交给 systemd。\n\n这是引导过程的结束。此时，引导加载程序和\
  \ systemd 都处于运行状态，但对用户还没有用。\n\n# 启动序列\n\nLinux 启动序列在引导序列结束后启动。启动序列负责将 Linux 操作系统带入用户可以使用的状态，以便他们登录并开始使用系统。\n\
  \n## Systemd\n\nSystemd 被称为 Linux 操作系统中所有进程之母。它负责启动 Linux 操作系统并将其带入可用状态。在 systemd\
  \ 服务开发之前，相同的任务由 `init` 服务完成，但 systemd 比 `init` 有更多功能，例如启动和管理系统服务、挂载文件系统等。\n\nsystemd\
  \ 的第一个任务是挂载 `/etc/fstab` 文件中定义的所有文件系统。systemd 还可以访问存储 `/etc` 中的所有其他配置文件。systemd\
  \ 将系统带入定义的状态或目标。如果是桌面，默认目标通常是 `graphical.target`。如果是 Linux 服务器，默认目标通常是 `multi-user.target`。\n\
  \n目标和服务是 systemd 服务的单元。目标的配置文件定义了该特定目标的依赖关系。这些依赖关系由 systemd 启动。依赖关系是指运行 Linux 操作系统所需的的服务。当\
  \ systemd 加载所有依赖项时，可以说系统已经启动运行，或者系统正运行在该特定的目标级别。\n\n启动序列有两个检查点，`sysinit.target`\
  \ 和 `basic.target`。事实证明 systemd 是同时启动服务的，但某些服务需要在其他服务之前启动。只有当特定检查点的所有服务和目标都成功启动后，才会通过该检查点。\n\
  \n\n\n\n\n只有在所有的服务和目标都初始化后，才会到达 `sysinit.target` 检查点。`sysinit.target` 有多个依赖项，这些依赖项在\
  \ `sysinit.target` 内部并行初始化。\n\n`sysinit.target` 首先启动到达 `basic.target` 所需的所有低级服务。然后\
  \ `basic.target` 启动一些额外的服务以到达下一个目标。\n\n一旦这两个检查点都成功到达，系统就可以移动到 `graphical.target`\
  \ 或 `multi-user.target`。但请注意，Linux 系统甚至可以在 `graphical.target` 的依赖项初始化之前就到达 `multi-user.target`。\n\
  \n如果默认目标设置为 `multi-user.target`，你将看到一个基于文本的登录提示。该目标通常用于安装了 Linux 但未安装任何图形界面的 Linux\
  \ 服务器。如果你在个人桌面电脑上安装了 Linux 并在安装时包含了 GNOME 桌面，那么默认目标将是 `graphical.target`。在这种情况下，你将看到一个图形化界面来登录\
  \ Linux 桌面。\n\n这就是启动序列结束的地方。你可以简单地在文本登录提示或图形界面登录屏幕上输入你的用户名和密码来开始使用你的 Linux 系统。\n\
  \n每一个现代 Linux 操作系统都 `GRUB2` 和 `systemd` 作为核心组件运行。这两个组件共同工作以加载 Linux 内核，启动服务，并使 Linux\
  \ 系统对任何终端用户可用。\n\n# 第十一章\n\n## Shell 脚本简介\n\n![](img/Image00001.jpg)\n\n为 Linux\
  \ 开发的开源编程语言被称为 Shell 脚本（Shell Scripting）。简单来说，shell 脚本是一系列组合在一起自动执行的单个 Linux 命令。一个\
  \ shell 脚本可能包含单行代码，也包含多行代码并存储在单个文件中，这样用户就不需要在每次执行特定任务时手动输入它们。\n\n我们将在本章中向你介绍 Shell\
  \ 脚本的基础知识，还将简要讨论 Shell 脚本的一些高级概念。本章将作为你进入 Shell 脚本世界的跳板。\n\n## 编写 Shell 脚本\n\n你可以使用文本编辑器来编写\
  \ shell 脚本。Linux 有了一系列内置的文本编辑器，如 `nano`、`vi` 和 `vim`。你可以使用其中任何一个来开始编写 shell 脚本。你需要确保为你的\
  \ shell 脚本创建的文件是可执行的。你可以通过在文件名上运行以下命令来使任何文件变为可执行。\n\n```bash\nchmod a+x filename.sh\n\
  ```\n\n然后，你只需要将文件存储在 Linux 操作系统可以轻松访问的位置。\n\n以下是创建 shell 脚本的步骤：\n\n1. 使用你选择的文本编辑器创建一个新文件。将脚本文件保存为\
  \ `.sh` 扩展名。\n2. 你的脚本文件的第一行始终应该是 `#! /bin/sh`。\n3. 输入一些 Linux 命令。\n4. 将文件保存为 `filename.sh`。\n\
  5. 在 Linux shell 中使用以下命令来执行你的脚本。\n\n```bash\nbash filename.sh\n```\n\n`#!` 被称为 shebang\
  \ 运算符。它告诉脚本 Linux 系统解释器的位置。当你在 shell 脚本的第一行输入 `#! /bin/sh` 时，Linux 操作系统就知道执行该脚本的解释器位于\
  \ `/bin/sh`。\n\n让我们创建一个创建一个简单的 shell 脚本。\n\n```bash\n#!/bin/sh\nls\n```\n\n将此脚本保存为\
  \ `list.sh`。\n\n你可以使用 shell 中的以下命令运行此脚本：\n\n```bash\n[student@desktop ~]$ bash list.sh\n\
  ```\nDocuments    Movies      Books       Pictures\n\n此脚本的结果是 `ls` 函数，它会列出目录的内容。\n\
  \n### 为脚本添加注释\n\n注释在每种编程语言中都会使用，shell 脚本也不例外。你可以使用以下语法为你的 shell 脚本添加注释。\n\n```bash\n\
  #this is a comment\n```\n\n如果我们以上面的脚本为例，你可以如下所示为它添加注释：\n\n```bash\n#!/bin/sh\n#this\
  \ is my first script\nls\n```\n\n你也可以为你的 shell 脚本添加多行注释。你可以通过将注释放置在 `:'` 和 `'` 之间来实现。\n\
  \n考虑下面的示例：\n\n```bash\n#!/bin/bash\n: '\nThis script calculates\nthe square of 5.\n\
  '\n((area=5*5))\necho $area\n```\n\n因此，位于 `:'` 和 `'` 之间的字符串 `is this script calculates\
  \ the square of 5` 在脚本中被注释掉了。\n\n### Shell 变量\n\n任何编程语言中的变量都用于以字符和数字的形式存储数据。Shell\
  \ 脚本支持存储可供 Linux shell 访问的数据。\n\n例如，下面的简单示例显示了一个存储某些数据并然后打印它的变量。\n\n```bash\nvariable\
  \ =\"Hello\"\necho $variable\n```\n\n让我们看另一个使用变量的 shell 脚本示例。\n\n```bash\n#!/bin/sh\n\
  echo \"what is your name?\"\nread name\necho \"How do you do, $name?\"\nread remark\n\
  echo \"I am $remark too!\"\n```\n\n#### 这个脚本是如何工作的？\n\n当你运行此脚本时，系统将打印问题“what is\
  \ your name?”。随后你将看到系统正在等待你的输入。如果你输入 `Mark`，字符串 `Mark` 将被存储在变量 `name` 中。在下一行代码中，脚本使用了该变量。\n\
  \n### 更多 Shell 示例\n\n#### Hello World\n\n`echo` 命令在 bash shell 中打印输出。如果你读过 C 语言编程，你会知道。每个人学习新语言时写的第一个程序通常是\
  \ Hello World。使用 `nano` 或 `vim` 等文本编辑器创建一个名为 `helloworld.sh` 的文件并在其中输入以下代码。\n\n\
  ```bash\n#!/bin/bash\necho \"Hello World\"\n```\n\n保存文件并更改权限使其可执行。\n\n```bash\n\
  chmod a+x helloworld.sh\n```\n\n现在使用以下命令之一运行你的脚本：\n\n```bash\nbash helloworld.sh\n\
  # 或者\n./helloworld.sh\n```\n\n这将打印你通过 `echo` 命令传递的字符串，在这种情况下是“Hello World”。\n\n\
  #### Echo 命令\n\n你可以使用 `echo` 命令向 bash 打印输出。如果你了解过 C，它等同于 C 中 `printf` 命令的功能。\n\n\
  创建一个新脚本 `echo.sh` 并在其中输入以下代码。\n\n```bash\n#!/bin/bash\necho \"Printing text\"\n\
  echo -n \"Printing text without newline\"\necho -e \"\\nRemoving \\t special \\\
  t characters\\n\"\n```\n\n赋予脚本权限并运行它查看输出。传递给 `echo` 命令的 `-e` 选项告诉命令该字符串包含特殊字符。\n\
  \n#### While 循环\n\n如果你在脚本中多次运行一个命令，你可以多次输入，也可以将其放在 `while` 循环中。\n\n创建一个名为 `while.sh`\
  \ 的新脚本并在其中放置以下代码。\n\n```bash\n#!/bin/bash\ni=0\nwhile [ $i -le 2 ]\ndo\necho Number:\
  \ $i\n((i++))\ndone\n```\n\n上述 `while` 循环的流程如下：\n\n```\nwhile [ condition ]\ndo\n\
  commands 1\ncommands n\ndone\n```\n\n现在运行脚本查看它是具体如何工作的。\n\n#### For 循环\n\n`for`\
  \ 循环与 `while` 循环类似，它允许你在迭代中运行一行代码或多行代码。让我们看一个示例。\n\n```bash\n#!/bin/bash\nfor ((\
  \ counter=1; counter<=10; counter++ ))\ndo\necho -n \"$counter \"\ndone\nprintf\
  \ \"\\n\"\n```\n\n将此脚本保存为 `for.sh` 并运行它查看发生了什么。它将在屏幕上打印从 1 到 10 的数字。可以随意对脚本进行修改以尝试打印另一组数字。\n\
  \n### If 语句\n\n\n\n\n\n`If` 语句是 Linux shell 脚本中常见的语句。它们用于创建条件，并具有以下流程。\n\n```bash\n\
  if CONDITION\nthen\nSTATEMENTS\nfi\n```\n\n如果给定的条件为真，则执行该语句。`fi` 关键字标记 `If` 语句的结束。让我们来看一个例子。\n\
  \n```bash\n#!/bin/bash\necho -n \"Enter a number: \"\nread num\nif [[ $num -gt 10\
  \ ]]\nthen\necho \"Number is greater than 10.\"\nfi\n```\n\n这段代码将要求用户输入一个数字。现在 `If`\
  \ 条件说，如果数字大于 10，则执行下一行代码。如果数字小于 10，程序将不会产生任何输出。\n\n- `-gt` 表示大于，`-le` 表示小于，而 `-le`\
  \ 和 `-ge` 分别表示小于等于和大于等于。\n\n### If-Else 语句\n\n你可以通过向 `If` 语句中添加 `Else` 来为你的 `If`\
  \ 语句添加更多控制。逻辑非常简单：当 `If` 语句为真时，执行其下方的指令；否则，执行 `Else` 语句下方的指令。\n\n让我们来看一个例子。\n\n\
  ```bash\n#!/bin/bash\nread n\nif [ $n -lt 10 ];\nthen\necho \"It is a one-digit\
  \ number\"\nelse\necho \"It is a two-digit number\"\nfi\n```\n\n这段代码与上面类似，如果输入提供的数字小于\
  \ 10，程序将打印“It is a one-digit number”，否则它将打印“It is a two-digit number”。\n\n### AND\
  \ 运算符\n\n如果你想在执行下一行代码之前需要满足多个条件，可以使用 `AND` 运算符。所有由 `AND` 运算符隔开的条件都必须满足。否则，`AND`\
  \ 运算符之后的将不会执行。让我们来看一个示例脚本来理解它是如何工作的。\n\n```bash\n#!/bin/bash\necho -n \"Enter Number:\"\
  \nread num\nif [[ ( $num -lt 10 ) && ( $num%2 -eq 0 ) ]]; then\necho \"Even Number\"\
  \nelse\necho \"Odd Number\"\nfi\n```\n\n`AND` 运算符由 `&&` 符号表示。\n\n现在，根据这个脚本，如果用户输入的数字小于\
  \ 10 且它除以 2 的余数为 0，程序将打印“Even Number”。否则，它将打印“Odd number”。\n\n### OR 运算符\n\n如果你想添加多个条件，并且只需要在执行下一行代码之前满足其中任意一个，可以使用\
  \ `OR` 运算符。由 `OR` 运算符隔开的条件中的任何一个都必须满足。否则，`OR` 运算符之后的代码将不会执行。让我们来看一个示例脚本来理解它是如何工作的。\n\
  \n```bash\n#!/bin/bash\necho -n \"Enter any number:\"\nread n\nif [[ ( $n -eq 15\
  \ || $n -eq 45 ) ]]\nthen\necho \"You won\"\nelse\necho \"You lost!\"\nfi\n```\n\
  \n`||` 符号代表 `OR` 运算符。\n\n根据上面的脚本，如果用户的输入等于 15 或者等于 45，程序将打印“You won”。否则，它将打印“You\
  \ lost!”。\n\n### Elif 语句\n\n`elif` 语句是 `if-else` 语句的扩展。让我们看看如何使用 `elif` 语句为你的脚本添加更多条件。\n\
  \n```bash\n#!/bin/bash\necho -n \"Enter a number: \"\nread num\nif [[ $num -gt 10\
  \ ]]\nthen\necho \"Number is greater than 10.\"\nelif [[ $num -eq 10 ]]\nthen\n\
  echo \"Number is equal to 10.\"\nelse\necho \"Number is less than 10.\"\nfi\n```\n\
  \n上面的脚本是自明懂的。你也可以更改它的部分内容来尝试新事物。\n\n### Switch 结构\n\nLinux bash 脚本中另一个强大的工具是 `switch`\
  \ 结构。如果你想创建嵌套条件，`switch` 结构非常方便。它是 `if-else-elif` 嵌套的一种更简单的替代方案。看看下面的示例。\n\n```bash\n\
  #!/bin/bash\necho -n \"Enter a number: \"\nread num\ncase $num in\n100)\necho \"\
  Hundred!!\" ;;\n200)\necho \"Double Hundred!!\" ;;\n*)\necho \"Neither 100 nor 200\"\
  ;;\nesac\n```\n\n`switch` 的条件放在 `case` 和 `esac` 关键字之间。条件随后放在 `)` 符号之前。\n\n### 拼接\n\
  \n拼接（Concatenation）是更广泛术语字符串处理的一种功能。字符串处理是对字符串进行操作以获得所需的输出。拼接是一种字符串处理函数，它将两个或多个字符串连接在一起。让我们来看一个例子。\n\
  \n```bash\n#!/bin/bash\nstring1=\"Ubuntu\"\nstring2=\"Linux\"\nstring=$string1$string2\n\
  echo \"$string is a great operating system for Linux beginners.\"\n```\n\n上述脚本的输出将是“UbuntuLinux\
  \ is a great operating system for Linux beginners.”\n\n### 加两个数字\n\nLinux 脚本非常容易地执行算术运算。下面的脚本从用户处获取两个数字，相加并打印和。\n\
  \n```bash\n#!/bin/bash\necho -n \"Enter first number:\"\nread x\necho -n \"Enter\
  \ second number:\"\nread y\n(( sum=x+y ))\necho \"The result of addition=$sum\"\n\
  ```\n\n使用 `(( ))` 加法法。\n\n### 加多个数字\n\n加多个数字可能会有点，你需要使用循环。让我们来看一个例子。\n\n```bash\n\
  #!/bin/bash\nsum=0\nfor (( counter=1; counter<5; counter++ ))\ndo\necho -n \"Enter\
  \ Number:\"\nread n\n(( sum+=n ))\ndone\nprintf \"\\n\"\necho \"Result is: $sum\"\
  \n```\n\n## 结论\n\n![Image001]\n\nLinux 操作系统及其发行版非常安全，因此受到范围内个人和企业的喜爱。对于个人用户，Linux\
  \ 有像 Ubuntu 这样的发行版，可以帮助用户从其他操作系统无缝过渡到 Linux。Linux 对学生非常有益，因为它是免费安装且开源的。\n\n对于企业和公司来说，用户数据是最重要的实体，数据丢失会大规模影响企业的品牌形象。多年来，Linux\
  \ 已证明是企业运行应用程序和存储关键数据的安全且稳定的操作系统。\n\nLinux 操作系统的安全补丁发布也比今天任何其他操作系统都快。这使得 Linux 成为任何将安全作为主要考虑的企业的理想操作系统。我们在书中讨论了\
  \ Linux 的 Ubuntu 发行版，希望这个发行版能让你对 Linux 世界充满热情。Ubuntu 只是你 Linux 之旅的开始，通过选择 Linux\
  \ 作为你的常用操作系统，计算机科学领域有更多可以探索的内容。当你熟悉 Linux 桌面用户后，我们鼓励你探索其他的 Linux 发行版，例如 Kali Linux、Red\
  \ Hat Enterprise Linux 等。Red Hat Enterprise Linux 将帮助你进入 Linux 系统管理这一领域。使用 Linux\
  \ 作为服务器的企业总是需要有人管理服务器，以确保服务器始终运行，从而确保其业务在互联网上持续运行。Kali Linux 被拥有渗透测试团队的企业用于测试其服务器是否存在任何安全漏洞。\n\
  \n\n\n\n\n除了这两个发行版之外，还有许多其他版本的 Linux 等你探索，而使用 Linux 的潜力是无限的。\n\n## 参考文献\n\n![](img/Image00001.jpg)\n\
