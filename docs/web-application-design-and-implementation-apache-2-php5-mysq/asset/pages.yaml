  md: '# Appendix C


    # Advanced phpBB


    If you followed the steps of Chapter 4, you should know how to create forums in
    phpBB as well as setting up its rights. Let us now see more advanced features!


    The first thing we will do is set up groups. This allows a faster rights handling
    on who has access to different boards. Any board that should be hidden except
    for specific user groups should have its rights set to PRIVATE, MOD, or ADMIN.
    The PRIVATE right will block everyone from accessing the forum in question unless
    you manually add the user to the allowed list, or if that user is in a group with
    the proper rights. Using groups is much faster in the long run.


    In the Admin panel, click on “Management"; this will show a dropdown menu with
    the current groups. Selecting a group and clicking on “Look up group” will take
    you to the group editing page. The button “create group” takes you to the same
    page, but for a new group. There select the group name, its description, and a
    moderator, who will have the right to add users to group. A group can be open,
    allowing anyone to join it, so that everyone can see it but may only be part of
    the group if added by the group moderator, or hidden; in which only the group
    members can see the existence of the group. Admin groups should be hidden; if
    you have a “Members” area it should be closed, for example.


    To add users to a group, you must be the group moderator or an administrator of
    the boards. On the main page, click on “Usergroups” (top menu)


