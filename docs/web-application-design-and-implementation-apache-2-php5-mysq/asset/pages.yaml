    sent by simply looking at the address bar of your browser. This is obviously very
    poor choice if you are sending important information as passwords, and the reason
    why I never use GET as a form method. The POST method sends all the information
    directly to the script in a way that is transparent to the user, so the address
    bar in my previous example would show “yourscript.php.”


