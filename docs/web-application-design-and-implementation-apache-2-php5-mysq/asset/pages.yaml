  md: '# SOMETHING DIFFERENT-JavaScript 21


    technologies such as J2EE (Java 2 Enterprise Edition) or J2ME made the use of
    Java a necessity. One problem in using Java in the Web is that Java applications
    run as applets embedded in Webpages, not as a working part of the page. Basically,
    Java-based Webpages are not really pages, whose appearance changes depending on
    the Java code. The page itself is a frame for a full Java application. This means
    that the code must be compiled first into “byte codes,” which will have to be
    downloaded by the client and will start only after the client has received the
    entire program.


    Java is currently undergoing some changes and improvements that will supposedly
    make it a very strong choice for Web programming, but in my opinion, it is far
    from the best option there. The fact that applets need to be fully downloaded
    and interpreted by a Java virtual machine in the client''s computer makes it slow,
    and speed is usually a major factor in the Web. It is also quite complex to use,
    since it is a full object-oriented programming language, and not really the fastest
    way to write a scripting language.


    I personally do not recommend using Java for Web applications unless you will
    be working with J2EE or J2ME. If you are attempting any project on the Web, I
    recommend using a scripting language instead.


    # SOMETHING DIFFERENT—JavaScript


    Here comes one of the greater sources of confusion among young developers. Despite
    the name “JavaScript,” this programming language is very different from Java.
    First, it is a compact, object-based scripting language, generally used to develop
    client-side scripting pages, and sometimes Internet applications. In many cases,
    JavaScript is embedded directly in the HTML code of a page, to be executed by
    the client. This means that the code is downloaded at the same time as the rest
    of the page, making it entirely visible. It is then interpreted line by line at
    the same time as are the HTML tags. Again, it is different from Java; some of
    the major differences are listed in Table 2.1.


    | TABLE 2.1 Differences between Java and JavaScript |

    | Java | JavaScript |

    | Compiled byte codes are downloaded from server to the client prior to execution
    Object-oriented; applets consisting of classes with inheritance | Interpreted
    by the client as it gets downloaded Object-based; uses built-in objects, but there
    are no classes or inheritance |

    | Applets distinct from HTML Variables data types MUST be declared Static binding;
    object references exist at compile time | Code integrated with HTML Variables
    data types are not declared Dynamic binding; object references checked at runtime
    |'
  merge: -1
  img_proc: true
