    , table_reference2,... ] [WHERE condition] [GROUP BY col_name [ASC | DEC]] [HAVING
    where_condition] [ORDER BY col_name [ASC | DEC]] [LIMIT {offset,count}]INTO DUMPFILE
    ''exportfile''

    ```


    The select_expressions represent which data are being searched. Usually it is
    a series of attributes from the tables in which we are searching. If you wish
    to gather information for all the fields in the tables searched, you can use the
    * (asterisk) symbol. Another useful tool when looking for data from separated
    tables is to use aliases to the tables. For example, if you define an alias t1
    for the first table containing the data you are searching, and t2 for the second
    table that you need (see next paragraph for alias definition), you could write
    for example SELECT t1.column1, t2.column...


    The table references are the list of tables in which to look for the information
    needed. When looking inside a single table, simply write its name, but if you
    are searching in different tables, it is preferable to provide them with an alias
    using the keyword AS that the aliases can be used in the select_expression. For
    example, you could SELECT t1.name,t2.salary FROM employee AS t1,info AS t2 This
    would create an alias t1 to the employee table and an alias t2 to the info table.


    The GROUP BY section allows you to group results by a specific field. It is quite
    similar to ORDER BY. The options ASC and DESC mean "ascending order" and "descending
    order", respectively.


    The option HAVING is quite similar to WHERE but runs at the end of the query,
    on the set of values that were found owing to the WHERE definition. The HAVING
    field allows you to use functions, whereas WHERE does not.


    ORDER BY is the regular sorting, as used in other instructions. Note that an ORDER
    BY statement can accept several table names that allow you'
