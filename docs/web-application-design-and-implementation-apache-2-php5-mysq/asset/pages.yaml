    # DATA TYPES


    In PHP it is not necessary to specify the type of a variable. All variables have
    a type, but that type can change depending on what information is stored in the
    variable. For example, doing $a = 10; will make the variable $a an integer, but
    if a few lines later we do $a = "Hello"; that same variable $a will become a string.


    The basic data types in PHP are integer (int), double (or real, float), string,
    array, object, and Boolean. It is possible to check the type of a variable by
    calling gettype($a), which returns a string with the type of $a, or by calling
    one of the many “is” functions that return true if the variable is of that type
    that makes the function name, and false otherwise. The functions are is_long($),
    is_double($), is_array($), is_object($), is_bool($), is_float($), is_int($), is_integer($),
    is_real($), and is_numeric($). Naturally, is_numeric will check whether the value
    passed as a parameter is of numerical type.


    As already mentioned, it is possible to change a variable''s type simply by storing
    a different type of value in that variable. It is also possible to modify a variable''s
    type without changing its contents. This process is called casting, and it can
    be done either permanently, or just for one instance. To change a type permanently,
    use the settype($a, "double"); would change the type of the variable $a to a double.
    If you wish to change the type of a variable only when reading it, without having
    to permanently change its type, you can simply precede the variable name with
    the new type surrounded by parentheses. In the following example we will store
    an integer in the variable $a, into $b, which will be holding that number as a
    double:


    ```

    $a = 5;

    ```


    ```

    $b = (double)$a;

    ```'
