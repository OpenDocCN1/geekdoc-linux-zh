  md: '# 128 MAKING CLEANER CODE AND OUTPUT


    Note that this version is a debugged version of the standard one you can find
    online. When I tested the class with the newer versions of PHP, I realized that
    there were many notices due to outdated writing. I corrected these errors, and
    the class now works flawlessly with PHP 5.1.2. Extract the zip file in your desired
    folder (e.g., a folder /include/ inside your document root), open up the file,
    and find the variable $WIN32 (it should be around the first few lines of code).
    If you are running your server on a Windows system, make sure that the variable
    is set to TRUE. If you are running a UNIX/Linux server, make sure that it''s equal
    to FALSE.


    # How to Use It?—HTML Side


    Your templates should be small sections of HTML code that you want to be able
    to combine and reuse. For example, you could have a file "tablerow3" that would
    allow you to create a row with three columns. Any area that should be dynamically
    changed by PHP should contain a "template variable." Template variables should
    be made of uppercase letters, digits, or the character underscore, and surrounded
    by curly braces. For example, [ITEM_1] is a valid "template variable." If we want
    to have a template to create rows on a table containing three columns, but don''t
    know what each column will contain, we could have the following template file:


    ```

    <TR>

    <TD>{CELL_1}</TD>

    <TD>{CELL_2}</TD>

    <TD>{CELL_3}</TD>

    </TR>

    ```


    You could have another file called "mainpage.html" that would contain the table
    definition in which the rows would be inserted. It could be something like this:


    ```

    <HTML><HEAD></HEAD><BODY>

    <TABLE>

    {ROWS}

    </TABLE>

    </BODY></HTML>

    ```


    The most important thing to remember is to place all template files in the same
    folder. Try to think in terms of reusability and do not be afraid to break your
    standard page into many different template files. Think that the more template
    files with "template variables," the more flexibility you will have when building
    your final output.


    # How to Use It?—PHP Side


    The first thing to do in your PHP is to include the file you just configured with
