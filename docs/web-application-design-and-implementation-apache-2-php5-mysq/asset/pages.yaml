  md: '# Arrays


    If you wish to use arrays, you need to specify that the variable you will use

    an array. This is done by creating an object of the class Array by writing


    ```

    var myArray = new Array();

    ```


    The Array constructor can actually accept the series of elements to insert in

    an array. Since JavaScript’s variables can be of any type, you can hold a

    different data types in the array. Access to or modify data in an array,

    you can use the angle brackets with the index of the element to modify.

    at as in PHP, the elements inserted in an array do not need to have succes-

    sives, and it is possible to have an array with three elements

    located at indices 2, 23, and 325, for example. Here is a basic array manipula:


    ```

    var myArray;

    myArray = new Array("Uno", 2, "3.0");

    myArray[3] = "Four";

    ```


    As with PHP, array indices start at 0 by default. You can create multidi-

    sensional arrays by simply making an array element become a new Array();

    th each level of arrays would use a new set of angled brackets with an

    index. Here is how you would create the same "Friends" array that we saw in

    t PHP version of multidimensional arrays. Our goal was to have

    a set of names and list of relatives for each entry in our friends array. So

    technically we need a three-dimensional array. The first dimension tells us

    which friend we are dealing, the second dimension allows us to read

    her friend’s name or the array of relatives, and the third dimension

    holds the names of the relatives:


    ```

    var friendsArray = new Array();

    friendsArray[0] = new Array();

    friendsArray[0][0] = "Steven";

    friendsArray[0][1] = new Array();

    friendsArray[0][1][0] = "Peter";

