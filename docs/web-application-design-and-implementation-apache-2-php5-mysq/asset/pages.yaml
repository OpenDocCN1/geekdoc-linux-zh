    this). Some of the most common programming languages are C/C++, FORTRAN, Perl,
    TCL, UNIX shell script, Visual Basic, and Apple script. Of course, to make your
    application more useful for the Web, it is usually written to receive a set of
    parameters and produce HTML code that will be displayed as the page’s output in
    the browser.


    # ANOTHER BIG OPTION—Perl


    Even though I used Perl only when I was a computer science student, and considering
