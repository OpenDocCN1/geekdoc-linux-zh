- pgno: 245
  md: 'Edit your httpd.conf to load the PHP module. The path on the right hand

    side of the LoadModule statement must point to the path of the PHP

    module on your system. The make install from above may have already

    added this for you, but be sure to check.


    For PHP 5:


    ```

    LoadModule php5_module modules/libphp5.so

    ```


    15. Tell Apache to parse extensions as PHP. For example, let''s have

    Apache the .php extension as PHP. You could have any extension(s)

    parse as PHP by simply adding more, each separated by a space.

    We''ll add .html to demonstrate.


    ```

    AddType application/x-httpd-php .php .html

    ```


    It''s common to setup the .php extension to show highlighted PHP

    source, this can be done with:


    ```

    AddType application/x-httpd-php-source .phs

    ```


    16. Use your normal procedure for starting the Apache server, e.g.:

    susr/local/apache2/bin/apachectl start


    # INSTALLING MySQL


    (Note: The following notes are quoted directly from the online reference

    manual of MySQL.)


    The recommended way to install MySQL on Linux is by using the RPM

    packages. The MySQL RPMs are currently built on a SuSE Linux 7.3

    system, but should work on most versions of Linux that support rpm

    use glibc.


    MySQL AB provide some platform-specific RPMs; the difference

    between a platform-specific RPM and a generic RPM is that a platform-

    specific RPM is built on the targeted platform and is linked dynamically

    whereas a generic RPM is linked statically with LinuxThreads.


    Note: RPM distributions of MySQL are often provided by other vendors.

    Be aware that they may differ in features and capabilities of those

    built by MySQL AB, and that the instructions in this manual do not

    necessarily apply to installing them. The vendor''s instructions should

    be consulted during.


    In most cases, you will need to install the MySQL-server and MySQL-

    client packages to get a functional MySQL installation. The other

    packages are not required for a standard installation.'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'If you get a dependency failure when trying to install MySQL packages (for
    example, removing these packages would break dependencies: libmysqlclient.so.10
    is needed by...), you should also install the MySQL-shared-compat package, which
    includes both the shared libraries for backward compatibility (libmysqlclient.so.12
    for MySQL 4.0 and libmysqlclient.so.10 for MySQL 3.23).


    Some Linux distributions still ship with MySQL 3.23 and they usually link applications
    dynamically to save disk space. If these shared libraries are in a separate package
    (for example, MySQL-shared), it is sufficient to leave this package installed
    and just upgrade the MySQL server and client packages (which are statically linked
    and do not depend on the shared libraries). For distributions that include the
    shared libraries in the same package as the MySQL server (for example, Red Hat
    Linux), you must either install our 3.23 MySQL-shared-RPM, or use the MySQL-shared-compat
    package installed.


    The following RPM packages are available:


    +   - MySQL-VERSION.i386.rpm


    The MySQL server. You need this unless you only want to connect to a MySQL server
    running on another machine.


    > Note: Server RPM files were called MySQL-VERSION.i386.rpm before MySQL 4.0.10.
    They, did not have -server in the name.


    +   - MySQL-Max-VERSION.i386.rpm


    The MySQL-Max server. This server has additional capabilities that the one provided
    in the MySQL-server RPM does not. You must install the MySQL-server RPM first,
    because the MySQL-Max RPM depends on it.


    +   - MySQL-client-VERSION.i386.rpm


    The standard MySQL client programs. You probably always want to install this package.


    +   - MySQL-bench-VERSION.i386.rpm


    Tests and benchmarks. Requires Perl and the DBI and DBD::mysql modules.


    +   - MySQL-devel-VERSION.i386.rpm


    The libraries and include files that are needed if you want to compile other MySQL
    clients, such as the Perl modules.


    +   - MySQL-shared-VERSION.i386.rpm


    This package contains the shared libraries (libmysqlclient.so*) that certain languages
    and applications need to dynamically and use MySQL.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# INSTALLING ON UNIX 245


    +   - MySQL-shared-compat-VERSION.i386.rpm


    This package includes the shared libraries for both MySQL 3.23 and MySQL 4.0.
    Install this package instead of MySQL-shared if you have applications installed
    that are dynamically linked against MySQL 3.23 but you want to upgrade to MySQL
    4.0 without breaking the library dependencies. This package has been available
    since MySQL 4.0.13.


    +   - MySQL-embedded-VERSION.i386.rpm


    The embedded MySQL server library (available as of MySQL 4.0).


    +   - MySQL-VERSION.src.rpm


    This contains the source code for all of the previous packages. It can also be
    used to rebuild the RPMs on other architectures (for example, Alpha or SPARC).


    To see all files in an RPM package (for example, a MySQL-server RPM), run a command
    like:


    ```

    shell rpm -qpl MySQL-server-VERSION.i386.rpm

    ```


    To perform a standard minimal installation, install the server and client RPMs:


    ```

    shell rpm -i MySQL-server-VERSION.i386.rpm

    shell rpm -i MySQL-client-VERSION.i386.rpm

    ```


    To install only the client programs, just install the client RPM:


    ```

    shell rpm -i MySQL-client-VERSION.i386.rpm

    ```


    The server RPM places data under the /var/lib/mysql directory. The RPM also creates
    a login account for a user named mysql (if one does not exist) for running the
    MySQL server, and creates the appropriate entries in /etc/init.d/ to start the
    server automatically at boot time. (This means that you have performed a previous
    installation and have made changes to its startup script, you may want to make
    a copy of the script so you don''t lose it when you install a new RPM.)


    If you want to install the MySQL RPM on older Linux distributions that do not
    support initialization scripts in /etc/init.d (directly or via a symlink), you
    should create a symbolic link that points to the location where your initialization
    scripts are installed. For example, if that location is /etc/rc.d/init.d, use
    these commands before installing the RPM to create /etc/init.d as a symbolic link
    that points to


    ```

    shell> cd /etc

    shell> ln -s rc.d/init.d.

    ```'
  merge: -1
  img_proc: true
