- pgno: 20
  md: '# FUNDAMENTALS


    wide-area networks (WANs), so that if the lines went down, they would still be
    able to send orders to detachments across the country, through the use of computers.
    In order to make this idea a reality, the Advanced Research Project Agency (ARPA)
    created the first computer network in 1969, and named it ARPANET. It was composed
    of only four computers, located in the University of California at Los Angeles
    (UCLA), the University of California at Santa Barbara (UCSB), the University of
    Utah, and the Stanford Research Institute (SRI). Three years later, in 1972, the
    use of routers allowed ARPANET to have 20 nodes and 50 computers, which could
    all communicate through tools such as the telnet and FTP (File Transfer Protocol).
    In 1974 Vincent Cerf, from the SRI, and Robert Kahn, from the Defense Advanced
    Research Project Agency (DARPA), presented the Transmission Control Protocol/Internet
    Protocol (TCP/IP) basics, forever changing how computers communicate. In 1983
    the Defense Communication Agency (DCA) took control of the ARPANET and separated
    the military section to form the MILNET, which would be used for military purposes
    only. In the mid-1980s the two main existing networks, the ARPANET and the NSFNET
    (created by the National Science Foundation), merged to create a massive computer
    network. That merge motivated a trend that brought more and more computers to
    the network, and this network of networks was named the "Internet." By 1990 the
    Internet had 3000 subunits and over 200,000 host computers. The estimated number
    of host computers in the year 2004 was approximately 234 million, and growing.


    # THE WORLD WEB


    After creation of the Internet, great potential could be seen way beyond the actual
    work that was being done. Computers were destined to do more than utilize telnets
    and FTP; it was great to be able to link one computer to another in order to send
    files, but the problem of communication was not yet solved. Scientists had to
    connect to a remote computer and send their research results one at a time through
    FTP. This was faster than sending manuscripts through "snail mail," but it was
    still not the best option, so in 1989 Tim Berners-Lee presented the World Web
    project to the Conseil Europe (CERN; European Organization for Nuclear Research,
    based in Switzerland). The idea was to come with a set of standards for information
    sharing that scientists around the world would be able to use. The goal was to
    have all research documents in a format and location accessible to all interested
    regardless of the platform being used. In 1994 the World Wide Web Consortium (W3C)
    was created to lead the World Wide Web (WWW) to its full potential by developing
    common protocols that would promote its evolution and ensure its operability.
    You can find out more about the W3C visiting their Website, www.w3c.org.'
