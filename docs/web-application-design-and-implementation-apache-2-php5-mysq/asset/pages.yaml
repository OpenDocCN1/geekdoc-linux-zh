  md: 'do not need to write window. and may simply use defaultStatus = “This is cool!”


    The most interesting thing about the window object is the objects it contains.
    These are the location, history, navigator, screen, and document objects. Since
    all these objects are part of window, you may write, for example, either window.document,
    or simply document.


    # The Location Object


    The location object allows to change the location of the window, forcing a redirect
    if set to a page different from the one currently running. You can use two references:


    +   * location.replace(“newpage.html”)—changes the current page with “newpage.html”
    in the history stack. This means that the page called this method will disappear
    from the browser’s history, and only the new one will appear.


    +   * location.href(“newpage.html”)—also redirects the browser to the new page,
    simply adds the new page to the history stack. Once you are in the newpage.html,
    you can go back to the page that used the method by simply clicking “back”.


    # The History Object


    The history object allows you to move through the browser’s history. It has three
    main methods:


    +   * history.back()—same effect as clicking on the “back” button of the browser.


    +   * history.forward()—same effect as clicking on the “forward” button of the
    browser.


    +   * history.go(n)—allows one to move forward or backward n times. If n is negative,
    it is the same as clicking “back” n times; if it is positive, it is the same as
    clicking “forward” n times.


    # The Navigator Object


    The navigator object gives information about the browser, including the software
    used, its version, or the operating system it is using. Here is an example of
    how you could extract the indexOf method to find strings like MSIE or Firefox
    to check the browser version (note that mimeTypes and plugins refer to an array):'
