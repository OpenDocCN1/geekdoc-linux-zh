    \ new SimpleClass(); // we create an object of the\n//class SimpleClass\n$a->displayVar();\
    \ // we invoke the method displayVar\n//through the object $a\nSimpleClass::statMethod();\
    \ // We call the static method\n//statMethod\n\n?>\n```\n\nIt is possible to use\
