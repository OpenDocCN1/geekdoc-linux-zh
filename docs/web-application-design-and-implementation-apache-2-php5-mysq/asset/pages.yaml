- pgno: 66
  md: 'Check Appendix C for a full description of how to administer a phpBB board.


    # BASIC SECURITY CONSIDERATIONS


    Now that you have everything installed, keep everything safe!! Remember that PHP
    is a server-side language, so any PHP script runs on your server and can access
    any file on the server even if it is not accessible through http://localhost/.
    Take advantage of this to store files that may contain secret information in folders
    that are not in your document root if you are running Windows. For example, if
    you have a file required by PHP that contains your database information (user,
    password, domain, etc.), you can store it on C:\UltraSecretStuff, and later, when
    PHP needs to access it, just enter the local path instead of an "http". This way,
    users will not be able to attempt opening the file.


    If you are running on a UNIX/Linux machine, use tools chmod to change your ownership.
    By default, PHP applications run with limited user permissions on UNIX/Linux servers,
    so you can create folders and only yourself the right to enter them. This way
    anyone trying to access the folder through "://" will get a "forbidden" error
    page, whereas PHP will still be able to access the folder and its files. For example,
    if your document root is located in ~web/ and you create a folder ~web/includes/
    with important information needed by PHP, you might want to set that folder''s
    rights to read and execute only for the owner.


    A file''s rights on a UNIX/Linux system is represented by a set of letters (that
    you can see if you type "ls -l in the folder containing the files). The r stands
    for read, w for write, and x for execute. There are letters in groups of three
    that are either present or replaced by a dash (-). There are three groups, the
    first for the owner of the file, the second for the people in the same group and
    the last for the rest. For example, a file -rwxr-xr-- before its name when "ls
    -l," this means the user can read, write, and execute it; people in the owner''s
    group can only read it. All folders inside the document root needs to be accessible
    by all users should have the rights -rwxr-xr-x or we call "755". The number is
    basically the translation of the rights into octal. Each group of three characters
    (r, w, and x) represents a single bit set to 1 if the letter is present or 0 if
    there is a dash. For example, rwx would be 111, which equals to 7 in octal; r-x
    is 101, which equals to 5. To change a file''s rights, you might need to type
    chmod rights file, for example, chmod 755 When a folder contains secret information,
    you might want to set it with a chmod 700 folder to allow yourself to read, write,
    execute, but forbid access to all others (except the root user, of course). PHP
    should still be able to access these folders, but no one else would from their
    computers.'
  merge: -1
