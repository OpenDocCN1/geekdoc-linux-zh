    +   - fgetc($fp)—reads the character at the current location and moves the internal
    pointer one character.


    +   - fgetcsv($fp


    +   - fgets($fp, $len)—reads a string up to $len bytes from the current location.
    Reading will also stop if there is a new line (\n) or the pointer reaches the
    EOF. Returns FALSE if you try to read beyond EOF.


    +   - fgetss($fp, $len)—same as fgets but strips all HTML tags in the line.


    +   - fputs($fp, $str) or fwrite($fp, $str)—writes the contents of $str.


    +   - fread($fp, $len)—similar to fgets but stops when up to $offset (a number),
    $len have been read or EOF is reached.


    +   - fseek($fp, $offset, $whence)—changes the location of the internal pointer.
    The new location is calculated through $whence as follows. If $whence == SEEK_SET,
    set position equal to $offset bytes. If $whence == SEEK_CUR, set position to current
    position plus $offset. If $whence == SEEK_END, set position to EOF minus $offset
    (in this case you should make sure that $offset is negative). If omitted, $whence
    is set to SEEK_SET.


    +   - ftell($fp)—returns the position of the file.


    +   - rewind($fp)—places the internal pointer at the beginning of the file. This
    is the same as fseek($fp, 0, SEEK_SET);


