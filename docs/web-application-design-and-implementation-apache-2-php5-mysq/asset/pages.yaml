  img_proc: true
- pgno: 70
  md: 'The first type of expression available consists of elementary expressions,
    such as constants or variables. For example, the number 100 would be considered
    an expression with the value 100. Variables like $a would be expressed with a
    value equal to the content of the variable.


    We have also composed expressions created by storing an expression in a variable.
    Note that all variables in PHP start with the dollar sign ($). The following two
    lines would be considered two expressions:


    ```

    $a = 100;

    $b = $a;

    ```


    This would store the elementary expression 100 into the variable $a. Then the
    elementary expression $a (containing the value 100) would be stored in $b. In
    the end both $a and $b would be equal to 100.


    Another type of expression consists of functions. Assuming that we have a function
    called test() that returns the value of 100, $result = test(); would use the function
    test() as an expression and store it in $result making that variable hold the
    number 100.


    It is also possible to postincrement, postdecrement, preincrement, and decrease
    a variable. This is still considered an expression. Check this code:


    ```

    <PHP

    $var = 100;

    echo $var++; //echo $var and increments it by 1

    echo ++$var; //increments $var by 1 and echoes it

    echo $var--; //echoes $var and decreases it by 1

    echo --$var;//decreases $var and echoes it

    ?>

    ```


    If you execute this code, you will note that it outputs 100102102100 with no spaces
    between the numbers. This is due to the fact that we are only outputting numbers,
    without inserting white spaces or breaks of line. We will see further on how to
    concatenate strings to variables.


    PHP expressions can also be the TRUE and FALSE. By default, these two constants
    are equal to 1 and 0, respectively. Note that if you


    ```

    <PHP

    $var = TRUE;

    echo $var;

    ?>

    ```


    the output will be the number 1 and TRUE.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'A comparison is also considered an expression, having a value of 1 for true

    and 0 for false. For example, $a = $b < 0; would store 1 inside $a if $b is lower

    than, and would store 0 if $b is greater than or equal to 0. The existing

    comparison operators are


    +   > Greater than

    >= Greater than or equal to

    == Equal to

    != Different from

    <= Less than or equal to

    < Less


    Another type of expressions is the combination of operators with the

    affection symbol (=). For example, $a += 10; will increase $a by 10. This

    works with any operator, and it has the following equivalence (we will assume

    <op> is an operator): $a <op> = $b is the same as $a = $a <op> $b.

    Here are a few examples:


    ```

    $a = ($b + $c); calculate $a - ($b + $c) and store the result in $a

    $a *= $b; will multiply $a by $b and store the result in $a

    $a /= 2; will divide $a by 2 and store the result in $a

    ```


    The last basic type of expression is the conditional operator. This allows us

    to check a Boolean value (TRUE or FALSE) and use an expression if the

