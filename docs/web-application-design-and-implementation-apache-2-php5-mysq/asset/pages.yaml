    # OPERATORS


    You may use the following operators:


    +   - Arithmetic. Use + to add, - to subtract, * to multiply, / to divide, % to
    calculate the remainder of a division (called the modulo operator).

    - Affection. Use = to store the value of the expression on the right to the variable
    on the left.

    - Affection with Operation. As we saw above, += *= /= %= = (the operator "") allows
    us to concatenate strings.

    - Reference Affection. Using $a = &$b; causes $a to point to the same memory location
    as $b. It is pretty that in C language, this operation does not copy the making
    as $a an alias of $b. Unlike in C, which copies the address of $b in the variable
    $a. It just makes $a and $b refer to the same location. Changing $a will also
    have an effect on $b.

    - Bit Operations. Use & (binary AND), | (binary OR), ^ (binary exclusive OR, "XOR",
    (binary NOT)), << (logical shift to the left), >> (logical shift to the right).

    - Other Comparison Operators. Use === for "identical," meaning that both expressions
    around the operator have the same value and are of the same type (see example
    further down). Use !== for not identical.

    - Increments and Decrements. As we saw before ($a++, ++$a, --$a, and $a--)


    +   - Logical Operators. The following can be used:

    - "and" and "&&" for AND

    - "or" or "|" for OR

    - "xor" for exclusive OR (XOR)

    - ! for NOT


    These operators are used for logical operations, as mixing several comparisons
    in one big expression. Do not mix logical and binary operators which do bit-by-bit
    operations with the expressions around them.


