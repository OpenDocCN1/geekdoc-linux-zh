    ALIGN—"left," "center," "justify," "right," or "char;\ specifies the text

    alignment inside the cell


    VALIGN—"top," "middle," "bottom," or "baseline"; specifies the vertical

    alignment of the text inside the cell


    ROWSPAN AND COLSPAN—take the number of rows or columns that

    the cell should use


    ROWSPAN AND COLSPAN are probably two of the major sources of error

    tables tables among HTML developers. They are not complicated, but it is easy'
