    # OTHER USEFUL FUNCTIONS


    Here is a list of functions you might find more or less useful:


    +   * int mysql_affected_rows($link)—returns the number of affected rows in the
    previous MySQL operation.

    * bool mysql_close($link)—closes the MySQL connection.

    * bool mysql_data_seek($res, $row)—moves the internal pointer of a resource handler
    to the row $row. The next call of mysql_fetch_row($row) would return that.

    * resource mysql_list_dbs($link)—lists all the databases in the MySQL server through
    a result pointer. To retrieve a specific name of database, use mysql_db_name($res,
    $row).

    * mysql_drop_db($dbname, $link)—deletes a MySQL database along with its tables
    and data.

    * int mysql_errno($link)—returns the error number from the previous MySQL operation.
    To get the string of that error message, use mysql_error($link) instead.

    * object mysql_fetch_field($res)—returns an object containing the field information.
    In the provided query result. The fields you might find useful in the returned
    object are name for the field name, table for the default value of that column
    belongs to, and def include max_length, not_null, primary_key, unique_key, multiple_key,
    numeric, blob, unsigned, and zerfill.

    * array mysql_fetch_lengths($res)—returns an array that corresponds to the lengths
    of each field in the last row fetched by MySQL.

    * bool mysql_free_result($res)—frees the result memory.

    * int mysql_insert_id($link)—returns the ID generated from the previous INSERT
    operation. Very useful to know the value of an AUTO_INCREMENT field after inserting
    an element.'
