    date, ccv (security code), and id_user (we could do without it, since we can extract
    the user information through the id_address, but it would simplify the task of
    searching for payment methods for a specific user).


    After the user confirms the payment method as well as the shipping and billing
    address, the shopping cart is upgraded to an “order,” and will be stored in a
    table orders with order_id, id_user, date, total, id_payment (for payment method
    and billing address), id_address (for shipping address), shipping_method. The
    specific items of each order will be in a table order_item with order_ierem, order_id,
    id_game_platform, quantity.


    The final layer of our database is shown in Figure 19.1.


    # Step 3—Main Functionalities


    Once you have created the database, you should create the main functionalities
    of your Website. Start concentrating on making sure Website works, as clients
    would much rather see an ugly Website that can do what it is sup'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# PROCEDURE 231


    posed to do, rather than a pretty page that errors all over the place and does
    nothing at all.


    Try to start with the important tasks first, as they will be the key parts of
    the project, but keep in mind what will need to be done in further steps. It is
    a good idea to set some data inside the database so that you can tell whether
    the scripts work well.


    In game-selling Website I would probably writing the code to show all the games
    in the database, with 10 titles per page, taking advantage of the LIMIT property
    used in MySQL performing SELECT. The next step would be to extract the categories
    and platforms for which we have games from the database and write a script that
    would show the games for a specific platform/or simply by clicking on a link.


    Once you display all items correctly, work on the user login procedure. This should
    not take too long. At the same time create forms to attract new users and add
    information like addresses and payment information. Make sure the login script
    creates a session and the session is kept alive until the user logs out. Course,
    write the logout procedure that will destroy the session.


    Next, start working on the add-to-cart function that should be attached to each
    displayed game on the page. Then work on the scripts that would help you update
    the cart, as removing items, adding items, or changing the quantities of items
    already in there. Finally, work on the checkout procedure, turning a cart into
    an order.


    If you will all the previously mentioned functionalities, the core of the project
    is done, and you can start pitching the progress to your team mates to try and
    find usability problems and bugs.


    # Step 4—Backside


    You should always create an administrator panel to help you handle the data in
    your Website. For example, to add a new user or other entry in the database, it
    is much more recommendable to do so via your scripts, rather than going straight
    to the database manager and adding the data manually.


    Since already wrote a login page, and in your database you have a flag level,
    add a check during login when the user will test whether the user is an administrator,
    and, if so, direct the user to an Admin panel.


    The Admin panel should have scripts allowing the removal of items, as well as
    adding new categories, platforms, games, removing users, making a user an Admin,
    and pretty much anything that would update the contents of the database. To test
    out the functionalities, simply adding a few items through the newly built Admin
    panel, then switch to a regular user and see if the products appear as they should.


    # Step 5—Improvements on Functionality


    Once you have finished with the basic functionality of both the user and administrative
    portions of the site, you may start having fun with advanced'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'functionality. This could include a searching tool to look for items by name,

    platform, esbr, price, or anything you might want to provide. You can do a

    “news” page that would show the most recent releases, based on the release

    ate the database, as well as the current date. You could also have an

    “upcoming” section with the things that are about to appear. The whole point

    of this is to improve the functionality of your Webpage, based on recommend-

    dations from tester users, project managers, and other teams. Do not get

    to far away from your initial agreement; if you ask any project manager,

    will learn that “Scope creep will kill you!”—meaning that if you keep changing

    t specifications of the project after you already agreed on, them

    project will be delayed, potentially making you lose your window of opportun-

    ity as as many development hours (time is money). The “updates”

    should concentrate on bug fixes, and enhance robustness on the project.


    A typical thing that should be done in this step is to add forms verification

    for every single form on the Website. You should check all the data transmit-

    t from page to page and make sure that it contains what it holds.

    at the end of this step your entire Website would be functional, but might

    not look the best. So let us advance to step 6.


    # Step 6—Improvements to Looks


    Once you know that your pages work, you might start playing around with

    different style sheets. The best thing to do as you are developing the pages is

    to think about what different styles you will need and start providing class

    names to all the elements that will need a style. Create an empty style

    sheet and link to it. In this step we edit the style sheet in question and experi-

    ment with colors, fonts, sizes, and layouts.


    # Step 7—Thorough Testing, Hacking Attempts


    So, you finally have a Website with all the required functionalities, you have

    an administrator control panel, the page uses a nice style sheet that you

    y supervisor will like, and you probably think that you are finished with

    t project... unfortunately it is not yet the case. This step is probably one

    of the most overlooked steps in Web development, and it is the fundamental

    difference between a good Website and an excellent one.


    In this phase you should group yourself with some friends and coworkers

    make sure you have backups of the\pages and database before you start). By “breaking”
    the Website I mean

    trying to insert corrupt data, hacking into the administrator panel without

    proper authorization, and things like that. It is quite funny to do and

    forces you to use your imagination to try and figure out the obscure way

    to make the pages not work as intended.


    A typical thing I do when testing your students’ Websites is attempt to insert

    HTML code in any form containing data that will be displayed. For example,'
