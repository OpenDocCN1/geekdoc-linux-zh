  md: '# 34 INTRODUCTION TO HTML


    images of just a few pixels in height and very large width (I usually make the
    1600 pixels wide and 1–10 tall depending on the effect I wish to achieve). The
    idea is to create a pattern that will be repeated line by line on the left side
    of your page. A nice image I created for a school example where I decided to elicit
    that "bluebook" feeling. To do so I had an image that was all white, with a blue
    horizontal line and a red vertical line to create the margin. By selecting that
    image as the BACKGROUND property of my \<BODY> tag created the desired effect,
    with an image that was less than 1 kB.


    To include an image in the middle of a page, simply use the \<IMG> tag, which
    does not need to be closed. The parameters to use include SRC, which defines the
    URI of the image to show. It is also possible to set the size of the image through
    WIDTH and HEIGHT. Note if you do not set the size of the image, it will be displayed
    in its original size, but if you set both your image may be distorted if you do
    not respect the image''s aspect ratio. The best way to set a new size for an image
    that you wish to portray is simply setting up one of the parameters as a number
    of pixels or a percentage of the original size. By writing only one of the attributes
    and omitting the other, you will be able to preserve the aspect ratio while changing
    the size of the image. The last but not least attribute is ALT, which takes a
    string, usually describing the image. It is extremely important if you wish to
    make your Website compatible with noncompatible browsers like Links, for example.
    When an image cannot be displayed by a browser, only the name will appear where
    the image should be. If you write the description of the image in the ALT attribute,
    you will see that description. A good example of this is useful is Websites that
    are mainly picture-based, meaning that all menu options are actually pictures
    with text inside them. In these cases, the ALT should be whatever text the image
    holds. For example, if menu.gif is a picture that says "register," the ALT for
    that picture should be "register" also. That person visiting the Website will
    still be able to use it even though the images won''t show up, as "register" will
    be much clearer to understand than menu.gif.


    # ORGANIZING DATA


    When creating a Webpage, something very important to keep in mind is organizing
    the contents to ensure that the page is not cluttered or disorganized. This is
    especially important when adding pictures in the middle of paragraphs to look
    professional. The main techniques used to organize information in a page are lists,
    tables, and frames. The first, as we will see right now, is not really useful
    with images but is a great way to create lists or any set of small text that needs
    some ordering.'
