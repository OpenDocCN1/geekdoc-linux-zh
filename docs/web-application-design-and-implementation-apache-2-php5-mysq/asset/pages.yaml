- pgno: 53
  md: '# 40 INTRODUCTION TO HTML


    </FRAMESET> with either ROWS or COLS as parameter. You can use both at the same
    time, creating frameset working like tables with no rowspan or colspan, but it
    is recommended to restrict the use to only one type. The type of data you should
    put in those attributes are called “multi-length” since they provide the sizes
    of all frames the frameset will hold. If, for example, your frameset needs to
    have five rows, you will have a ROWS attribute with five lengths in order, separated
    by commas. Lengths can be a number of pixels, a percentage of the screen, or an
    asterisk (*), whatever is left on the screen. Suppose that you wish to break up
    the window into three rows: the first one 100 pixels tall, the last one representing
    10% of the window, and the middle one using the rest of the window. You would
    write <FRAMESET ROWS=100, * 10%>...</FRAMESET>. It is also possible to specify
    the attribute BORDER, which sets the border size between frames in that frameset.


    Once the frameset is defined, you need to define each frame that will be included,
    filling the rows or columns you created with the <FRAMESET> tag. Note that these
    frames will be in the order in which you want them to appear, and also note that
    you can use a new frameset instead of a frame in an available slot. The basic
    frames are created with the <FRAME>, which does not need to be closed. There are
    two parameters that should always be set, and a few optional ones. First there
    is NAME, which is essential since it provides the name of the frame itself, and
    which will be used in the TARGET attribute of a link wanting to open in a page
    in that frame. With SRC, which is used to specify the URL of the page that will
    be loaded in that frame when the frame is created. Other parameters include NO,
    which takes values, only to be added or omitted, and prevents the frame from being
    resized. SCROLLING can be set to “yes,” to never allow scrollbars; or “auto,”
    to include a scrollbar only when needed. By default, SCROLLING is set to auto.


    Here is an example of a frameset page that will open some of the examples we saw
    in this chapter in four frames. You will note that the top frame loads about:blank,
    which is simply a standard name understood by browsers as a blank page:


    ```

    <HTML>

    <HEAD><TITLE>Frames example</TITLE></HEAD>

    <FRAMESET ROWS="100,*100" BORDER=2>

    <FRAME NAME="title" SRC="about:blank">

    <FRAMESET COLS="258,*" BORDER=0>

    <FRAME NAME="menu" SRC="links.html" SCROLLING=NO

    <FRAME NAME="body" SRC="good.html" NORESIZE>

    </FRAMESET>

    <FRAME NAME="footer" SRC="nestedlists.html">

    </FRAMESET>

    </HTML>

    ```'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# ORGANIZING DATA 41


    As earlier, some browsers are not capable of working with frames, usually because
    the browser was of an older date than the addition of frames in the HTML standards.
    The general behavior of a browser that is reading an unknown tag is to ignore
    tag. A browser that cannot process frames will ignore our frameset and frame definitions,
    as it does not recognize the tags. We can take advantage of that behavior and
    use another frame-related tag to create an alternate version of our page that
    we not employ frames, but instead use tables, for example. To do so, use the `<NOFRAMES>...</NOFRAMES>`
    tag, and put a normal `<BODY>...</BODY>` block inside. This new block should be
    included right before the `<FRAMES>` tag. The way it will be simple. If the browser
    knows frames, it will ignore anything between `<NOFRAMES>` and `<NOFRAMES>` and
    therefore skip the body added. If the browser does not understand frames, it will
    not understand the `<NOFRAMES>` tag and ignore both opening and closing tags,
    but will still parse what is between them. At that point it will a `<BODY>` that
    will be considered the normal beginning of the body section of a page. You should
    always have a noframes section when working with frames, to at least ask the user
    to get a browser supporting frames. Here is an improved version of our previous
    example:


    ```

    <HTML>

    <HEAD><TITLE>Frames example</TITLE></HEAD>

    <FRAMET ROWS="100,*,100" ORDER="2">

    <FRAME NAME="title" SRC="about:blank">

    <FRAMET COLS="258,*" ORDER="0">

    <FRAME NAME="menu" SRC="links.html" SCROLLING=NO

    <FRAME NAME="body" SRC="goodtables.html" NORESIZE>

    </FRAMESET>

    <FRAME NAME="footer" SRC="nestedlists.html">

    <NOFRAMES>

    <BODY>

    Please get yourself a good browser like <A HREF="http://www.firefox.com">Firefox</A>

    </BODY>

    </NOFRAMES>

    </FRAMESET>

    </HTML>

    ```


    There is another curious type of frame called the "inline frame" (or iframe),
    which is basically a frame that can be used as an image. It has the advantage
    of being useful inside a normal body of a page, and does not require any frameset
    definition. You can utilize this asset, for example, include it in a table, surrounding
    it by images of a TV frame to create a TV effect. The TV screen would basically
    be the inline frame that would be used'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# 42 INTRODUCTION TO HTML


    to display the contents. You can top it off with a remote-looking menu that will
    have links targeting that iframe. To create an iframe, the tag <IFRAME>...</FRAME>,
    where the space between the opening and closing tags is used to enter the "alternate"
    version, in case the browser does not support iframes (it is similar to the "noframes"
    section). The <IFRAME> needs the following attributes:


    +   - SRC—the URI to be loaded in the frame

    - NAME—name of the frame enabling to link to it

