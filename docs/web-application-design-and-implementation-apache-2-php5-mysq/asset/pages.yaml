    is a 6-hour difference between major coastal Spanish city and U.S. west coast.
    The moral of this story is “Remember which side you are getting the time from!”
    The client side will give you the user''s time; the server side will give you
    the server''s time, which will not be affected by the time zone of visitors.


    Luckily, JavaScript has a way to solve this: using UTC times. UTC is the Coordinated
    Universal Time (UTC sounded than CUT) implemented in 1964, and more commonly known
    as GMT (Greenwich Mean Time of London, U.K.). Eastern Standard Time (EST) is GMT
    – 5, Central European Time (CET) is GMT + 1, and so on. Once you have a Date object,
    you can create a nice string of the full date using the methods `myDate.toLocaleString()`
    if you want to get the local time, or `myDate.toUTCString()` if it is 13:15 (1:15
    p.m.) in local time and I am in the U.S. east coast, the time shown by `toUTCString()`
    will be 18:15 (6:15 p.m.). You may also retrieve the time offset (number of minutes
    offset between UTC and local time) using `myDate.getTimeOffset()`.


    You may also set or get individual sections of the date directly in UTC format,
    by directly using any of the previous methods adding the word UTC next to `get`
