- pgno: 63
  md: '# Adding a MySQL User


    I recommend that everyone create a new user that will have the right to use the
    MySQL database other than the root. This will be the user that we use in our PHP
    scripts. Open a command console (we did when solving Apache problems) and type
    `mysql --user=root --password=your_pass`, replacing `your_pass` with the password
    you selected for the root during the installation of MySQL. This will open the
    MySQL console. Now type `GRANT ALL PRIVILEGES ON .* TO ''newuser''@''localhost''
    IDENTIFIED BY''newpass''WITH GRANTION`; replacing“newuser” and “newpass” with
    the username and password you wish to use with PHP. Press “enter,” then type “quit”
    and “enter” again.


    # How Do I Know if MySQL is Running?


    If you managed the MySQL console and added a user, MySQL is running, so we can
    move to the next step: testing whether PHP can connect to MySQL, and in no way
    better than using phpMyAdmin.


    # INSTALLING PhpMyAdmin


    Decompress the zip file downloaded inside your document root, and rename the folder
    to something easy for you to remember but hard for someone to guess. This will
    prevent people from trying to access your administration tool. Go to the folder
    and locate the file `config.default.php`. Rename it to `config.inc.php` or copy
    the file and rename the copy. Open the file (Wordpad will probably output the
    text in a near way using Notepad), locate the line `$cfg[''PmaAbsoluteUri''] =
    "";` and enter the absolute URI of your phpMy-Admin folder. For example, if you
    called the folder “mysqlAdmin” and placed it in your document root, you should
    type `$cfg[''PmaAbsoluteUri''] = ''http://localhost/mysqlAdmin/''; // MySQL server`.
    Next find the line that starts with `$cfg[''Servers''][$i][''user''] = ''root'';
    // MySQL server`” and replace “root” with the user you created with MySQL. In
    the following line enter the password for that user and save the file. If you
    created a user “newuser” with “newpass” your two lines should look like this:


    ```

    $cfg[''Servers''][$i][''user''] = ''newuser''; // MySQL user

    ```


    ```

    $cfg[''Servers''][$i][''password''] = ''newpass''; // MySQL password (only needed

    ```


    Save the file and access the folder through your browser (e.g., http://localhost/mysqlAdmin/).
    This should open up phpMyAdmin''s interface. If there is any error, it would show
    in this window. Typical errors include bad user/passwords and wrong absolute URIs.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'We will see how to use phpMyAdmin in Chapter 12, but for now let us create
    a new database that will be used by phpBB. In the main page type the name of the
    database you want to create (I will choose “forum”) and click on “create.” If
    you look on the dropdown menu on the left menu, you should see a new database
    called “forum” with 0 tables. Congratulations! This means your phpMyAdmin is working
    perfectly well.


    # INSTALLING A BULLETIN BOARD: phpBB


    Bulletin boards are spreading over the Internet to connect people with the same
    interests in a discussion area. PHPBB is one of the most popular PHP bulletin
    board solutions, mostly because of its simplicity. We will see how to install
    this application and how to set it up. You will find more detailed information
    in Appendix C.


    # Installation Steps


    Start by decompress the zip file inside your document root and rename the folder,
    for example, “forum,” and access http://localhost/forum/install/install.php. This
    is an automated PHP script that will configure your boards to work with your database.
    Make sure that you select MySQL 4.x/5.x as your database type (unless your host
    has a different database), method “install.” Your database configuration should
    be “localhost” for hostname and “forum” for database name (or the name you chose
    when creating a database in the previous steps). Use the user and password you
    created installing MySQL (and the same that you used for phpMyAdmin). You should
    leave the prefix with the default “phpbb.”. Enter your email address (for users
    to mail you about any problem), enter your domain (localhost if running locally,
    your computer’s name if you plan on using it on a local-area network only, or
    the domain in which you are installing phpBB will be used over the (Internet),
    your server port (80 by default), the folder in which you installed the forums,
    and a user and password that you use in the boards. It is preferable to use a
    user/password different from the one in your database settings. Each message you
    write in boards will have your nickname attached to.


    Finish the installation by clicking on the “install” buttons until you see a message
    telling you to delete two directories. Delete those two directories in your forum/folder
    to prevent malicious attacks to reconfigure your boards.


    To access http://localhost/forum/: this should open up the boards’ main page,
    which should include one forum called “test forum 1.” Using phpBB is very intuitive;
    clicking on a forum name will open the list of messages in that category. Each
    message is a “thread” in which all users can discuss whatever they feel. Let us
    configure our boards and add new forums.'
