- pgno: 127
  md: '# 118 CREATING SOME INTERACTIVITY


    # 3. cookie (TYPE OF PERSON)


    noun [C] U.S. INFORMAL

    a person of the type mentioned:

    She''s a smart/tough cookie.


    # 4. cookie (COMPUTING)


    noun [C] SPECIALIZED

    apiece of information stored on your computer that contains information about
    all the Internet documents that you have looked at


    Obviously we are going to concentrate on the fourth partition. A bit more seriously,
    cookies were created by Netscape and can hold text information of no more than
    4 KB. You can have up to 20 cookies per domain and a total of 300 cookies maximum,
    according to RFC 2109. Cookies are saved on the user''s computer and be returned
    to the server that created the cookie only in the folder specified on creation.
    PHP can import the available cookies through the $_COOKIE array.


    Cookies are useful when you wish to individualize a Website with different color
    scheme preferences, as you can use them to remember the information of your user,
    or even memorize a shopping cart on a commercial Website.


    Cookies can be set in HTML with a Set-Cookie, but we will see only how to create
    them in PHP. The important thing to remember is the list of parameters cookie
    needs, as you will need that information to create a useful cookie. The first
    important thing to remember is the name of the cookie, as well as its contents.
    Other parameters include *expires*, which sets the expiration time of the cookie;
    the *path*, which specifies which domain can view the cookie (you can usually
    leave the option blank to use the current domain); and the *secure* flag, to decide
    whether you wish to encrypt the cookie.


    To create a cookie with PHP, use setcookie($name, $value, $expires, $path, $domain,
    $secure); Technically you need only the first three parameters; the rest can be
    left as default. Imagine that you wish to create a cookie called "myCookie" that
    contains "Hello World!, and you wish the cookie to survive for a few minute. Here
    is the instruction you would need to run:


    ```

    setcookie("myCookie", "Hello World", time()+60);

    ```


    The function time() returns the current UNIX timestamp, which is the number of
    seconds passed since (January 1, 1970 00:00:00 (GMT)). You may also retrieve the
    number of milliseconds elapsed since that date with microtime(); Since we want
    our cookie to exist for one minute, we simply need to set the expiration date
    to the creation time plus 60 seconds.'
