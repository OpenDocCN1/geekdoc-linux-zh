  md: '# 16


    # Windows and Frames


    In the previous chapter we studied the window object and its contents, concentrating
    on the document object. The goal of this chapter is see how JavaScript can communicate
    between windows and frames, which effectively means communicating between separate
    Webpages.


    # FRAMES AND JavaScript


    When you create a frame in a Webpage, each frame will have its own window object;
    it is therefore possible to access any of the object window contains on each separate
    frame. You can always check the name of any created frame by accessing the name
    field of your frame, which is accessed by writing window.name. To make matters
    even nicer for us developers, you may also access the parent of any frame you
    have, as well as any child. Imagine you have created a frameset containing two
