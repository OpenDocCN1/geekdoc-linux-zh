- pgno: 237
  md: '# PROCEDURE 233


    could write things like <FONT COLOR="WHITE"> if the background color is white
    when asked for a name; that way you force all text to appear in white, virtually
    "erasing" all data that should appear on the page. The data would still be there,
    but would show up as white over white. I decided to insert JavaScript like <SCRIPT
    LANGUAGE="JavaScript">alert(''iwned!'');</SCRIPT>, which will produce an alert
    message every time the field in question is. This is usually an easy way to illustrate
    a serious problem, as it could allow a user to enter a JavaScript code that would
    generate popup opening malicious Websites. Those Websites could have the same
    appearance as your legitimate Website, and could be asking users to enter their
    personal username and password information. This is a "hacking" technique called
    "phishing." It basically tricks users into entering their usernames and passwords
    into a "fake" Website that will transmit data to the hacker in question. Making
    sure that no inserts HTML in your pages is a good first step to avoid this problem.
    In short, you must do testing in all code that asks the user for data, using things
    like regular expressions, or even PHP functions as strip_tags to annihilate any
    tags that could have inserted.

    If you select allows to upload data to the server, be to test the data sent (there
    is an upload script in the appendices), and keep your brain functioning to find
    new ways to break your code. You should spend much time in this phase, as the
    Internet is populated with malicious users who will attempt to break your pages.


    # Step 8—Presentation


    The last important step after you are sure that you have produced the best Website
    ever is to present it to the program sponsors (the people who paid for it) and
    make sure that they like it. You probably think this is the easiest step, but
    unfortunately project sponsors always want new features in their sites, so be
    prepared for criticism, and other remarks on things that should be included that
    did not work. It is also a good chance to get some input that help you do updates
    on the site. The approach I would recommend is to start explaining your project
    in general, discussing only the main features and then focusing a little more
    on details of the functionalities only if you are asked to. This is assuming that
    you are talking to a person with no programming knowledge. If you present to a
    fellow programmer, you might want to skip the "commercial talk" and go straight
    to the functionalities, emphasizing security features and administrator panel.


    # Step 9—Publication


    After the project has been approved, it is time to release it. Upload it to the
    Web server of your choice, and make sure that everything is set properly. All
    pages should be accessible, all include files should be in secured folders,'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# 234 PUTTING IT ALL TOGETHER!


    all the links and images should be working, and the page should be accessible
    by anyone in the world. If you did the previous steps properly, this should not
    take long.


    # Step 10—Celebration ©(and Maintenance)


    This is by far my favorite step of a Web development cycle! After you have spent
    absolutely every single step in the project, it is time to take your favorite
    brew from the cooler and celebrate with the people who helped you create your
    Website.


    Unfortunately, this step is not long enough, since once the project is published
    you will need to maintain the project. Mean fixing things that could have slipped
    through the cracks during all your testing, upgrading features, adding functionalities,
    or simply (in our example) adding all videogames that are announced.


    # WHAT LANGUAGE TO USE?


    You finally know how to go step by step from a single idea to a full project,
    but you still might have a very important question, “What language should I use?”
    Most Web programming books concentrate on a single approach and a maximum of one
    or two technologies, here we have talked about four programming languages as well
    as a database management tool, how should you combine all these languages?


    First, you should familiarize yourself with PhpMyAdmin. Since the creation of
    the database was one of the first development steps on the project, you should
    use this tool to set everything up before writing a single line of code.


    For scripts such as login procedures, logout, session handling, and anything that
    requires extracting information from the database and creating dynamic pages,
    you should use PHP combined with HTML for the layout. Of course, any query to
    fetch information from the database should be done in MySQL syntax, submitted
    to the database through PHP scripts. All the information gathered should be retrieved
    from PHP.


    Actually PHP is probably the language that you will use for quarters of your project
    as it is the backbone of your project, and handles every minute on details that
    you need to get for the use to be a nice output.


    JavaScript should be used for enhancements, such as, for example, form verification.
    Many people want to check the forms in PHP, but that means all the data are sent
    from your form to PHP, then verified, and in case of problems, the user is redirected
    to the same first form. This takes time as you need to communicate several times
    with the server. Handling forms with JavaScript is an excellent idea for things
    like required fields that cannot be'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# WHAT LANGUAGE TO USE? 235


    empty, valid email addresses, and other basic checks that should be done before
    sending any data to the processing PHP script. Here is where you should practice
    all regular expressions in JavaScript and keep the user in the form (remember
    to return false) as there are one or more problems in the form. Once JavaScript
    verifies that all the required data are formatted as required, you may allow the
    form to send its data to PHP (return true) and have PHP run a second series of
    tests. I recommend a two-phase verification to get rid of as many possible errors
    and security holes as possible. My JavaScript side takes care of required fields
    and formatting, user level, and so on.


    JavaScript is also very useful in providing some visual enhancements such as dropdown
    menus or rollover buttons. The most basic rollovers you could do would be to change
    an image withmouseover and onmouseout if you are using images for your menu items.
    You can otherwise change a text style.


    In a nutshell, HTML will organize the output layout, PHP will populate the page
    with the appropriate data, and JavaScript will make it all look nicer, as well
    as verify that the user enters the required information. MySQL will be the tool
    used by PHP to manipulate the database.


    Well, I hope this book will help you understand the ins and outs of Web programming,
    the folklore, and good and poor design, and I hope that creating Websites will
    be as gratifying for you as it is for me. I wish you all the best!'
  merge: -1
  img_proc: true
