- pgno: 60
  md: '# Configuring Apache


    By your basic Apache server should be running. You can check it by opening a browser
    and accessing http://localhost/ (or http://localhost:8080/ if you changed the
    path that Apache uses). This should open a page telling that your installation
    was a success. Now it is time to set up your preferences. My first recommendation
    is to create a folder “Web” on a secondary hard disk or partition of your choice.
    This will be the folder in which all your Web applications will run. I assume
    that your folder is “D:/Web”. Open [...]Apache2/conf/httpd.conf and leave it open
    as you are modifying when we install it.


    The first thing is to find the line that starts with “DocumentRoot” followed by
    a path. Change the path to the one you will use; for example, change the line
    to DocumentRoot “D:/Web”. If you are afraid of messing up the configuration file,
    you can comment out the existing line by placing the character # in front of the
    line, and typing a new line with your chosen Document Root. Note that Apache uses
    forward slashes (/) instead of backslashes (\). This allows Apache to know which
    folder in computer to go when trying to find Webpages. The next thing is to set
    up the rights for your folder; you may use the basic settings, by finding the
    line that starts with <Directory followed by the same path that was initially
    set as “DocumentRoot”. Replace that path with the same one you used for “DocumentRoot”.
    Your new line should be <Directory “D:/Web”. This line represents the opening
    tag for a set of rules that will be applied to that folder. It is important to
    remember to set the rights to the folders you want to access, or you may get a
    “forbidden” error message when trying to access it.


    The next thing to set up is the list of files that will be opened by default when
    trying to access a folder. This information can be found in the line that starts
    as “DirectoryIndex index.html index.var”. Here you may set any file you would
    like to use as a directory index. I recommend adding at least following: index.php
    index.htm index.php4 index.php5 index.phtml if you want to be on running old PHP
    applications.


    Save the file and restart your httpd.conf file opened as we will be using it in
    a few minutes. If you did not make any syntax errors, Apache should restart easily.
    In case of a typo, Apache should inform you of the line with the problem. Find
    it and correct the type. Access your localhost through your browser once more.
    You should see the contents of your “Web” folder or one of the directory index
    files if there is one.


