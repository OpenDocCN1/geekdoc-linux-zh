- pgno: 157
  md: 'create several levels of ordering. For example, ORDER BY surname, name ASC
    would do a sorting of the data by surname, and if there were several entries with
    the same surname, those entries would be sorted by name.


    The option LIMIT is a bit more flexible when using a SELECT, allowing to not only
    specify how many elements to match but also which is the first element to be considered.
    This is a really useful tool when you want to limit the number of results on a
    page, and facilitates the creation of multiple pages to show data. For example,
    in a commercial Website where you would sell several hundred products, you should
    avoid showing all on the same page. Instead, you should split them into smaller
    groups, for example, 10 items per page. The standard in these cases is to have
    small numbers that represent the pages—for example, with page 1 showing elements
    0–9, with page 2 showing elements 10–19, and so. This method could be implemented
    by calculating the LIMIT value by checking the current page. We come up with the
    formula first_item = (p – 1) * 10. To just verify, the first item of page 4 would
    be the 31st entry (index 30) in the list of matches, and (4–1) * 10 == 30, so
    it is all good! This value represents the offset that should be followed by the
    amount of elements that we want to gather. For example, to view the 10 items on
    page 5, we would calculate the offset going (5 – 1) * 10 == 40, and use a LIMIT
    40,10.


    Finally, INTO DUMPFILE allows dumping the results of the query in a file for its
    further processing. As a last example, let us imagine that we want to gather all
    the info on users with an id greater than 50 and save it in the file ''results.txt.''
    You could do


    ```

    SELECT * FROM users WHERE id_user > 50 INTO DUMPFILE ''results.txt'';

    ```


    # Using Functions in MySQL


    There are many useful functions in MySQL that allow advanced database programming
    directly through the SQL command prompt. Nevertheless, we have learned how to
    use PHP, and we will always access MySQL through PHP scripts. This means that
    it is much simpler for us to do the work directly in PHP and use the results of
    the PHP functions as input for our SQL queries.'
