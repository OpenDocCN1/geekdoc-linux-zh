  md: "# 132 MAKING CLEANER CODE AND OUTPUT\n\nof your HTML files, or even better,\
    \ saved inside style sheet files called Cascading Style Sheets (or .css files).\
    \ We will, of course, concentrate on the latter.\n\n# The CSS File\n\nA CSS file\
    \ is a file that defines categories of input that will have a specific look. It\
    \ is possible to define properties for any link that HTML accepts, and you may\
    \ also create independent styles that will be able to attach to any block of data\
    \ which you use. The properties specified in the CSS file define the sizes, fonts,\
    \ decorations, colors, and many other aspect properties. The list of valid attributes\
    \ is too large for me to show in its entirety, but here it is pretty easy to understand\
    \ the point of each attribute. You can find an exhaustive list at http://www.pagerource.com/htmlcssprops.\
    \ (Note that CSS files should start with <!-- and finish with -->)\n\nThe contents\
    \ of a CSS file are quite simple; you only need to write the name of the tag that\
    \ you wish to change (e.g., the H1 tag) followed by a group of properties between\
    \ curly braces. Each property is written as property: value;\n\nSome tags, such\
    \ as links, have several states, and it is possible to have a different aspect\
    \ for each state. The main states of a link are \"link\" for regular state, \"\
    visited\", \"hover\" for a link that has the cursor placed on top of it, and \"\
    active\" for a link that refers to a page that is currently opened in a different\
    \ frame or window. To specify the state you want to set up, write the name of\
    \ the tag (in our case A) followed by a colon and the state (style sheet example\
    \ will be presented following the next paragraph).\n\nNot only is it possible\
    \ to create styles for extending tags; you may also define your own classes that\
    \ can be applied to anything. So, for example, instead of defining a style for\
    \ H1, or for H2, or for TD, you can have a class \"myclass\" and use it on a link,\
    \ a cell, a paragraph or pretty much anywhere. To create your class, instead of\
