    # Data Types


    When using MySQL you can use a string by simply surrounding a piece of text with
    either double or single quotes. Inside a string you may use any of the following
    special characters: \n for an ASCII (NULL) character, \ for a single-quote character,
    \" for a double-quote character, \b for a backspace character, \n for a new-line
    character, \t for a tab(ulationulation), % for the percentage character, and \_
    for underscore character. You may also use floating-point numbers (e.g., -12.345),
    integers (e.g., 678), as hexadecimal numbers (e.g., 3FB7A). Finally you may use
    the NULL value to represent the lack of data.


    Any name you use to define the structure of your database has a maximum size.
    For instance, database names, table names, and column (or attribute) names cannot
    exceed 64 characters. If you wish to use a longer name, you may use aliases, which
    allow a maximum of 255 characters.


    Assuming that you have a database classgrades with the previous example of database
    structure you could access a student name by doing name if you are inside the
    table student,name if you are in the classgrades database, not accessing the table
    student, or simply classgrades.student.name if you want to access that field from
    a different database on the server. For Web projects you will most likely have
    only one database with many tables, which will simplify your query.


    You may create variables in MySQL using the SET instruction to declare the variable,
    and := to assign an expression to it. You may declare a variable as integer, real,
    or string, and declare many variables with a single SET instruction. All MySQL
    variables start with the character @. Here is an:


    ```

    SET var1 = integer, @var2 = real, @var3 = string;

    @var2 := 4;

    ```


    I have never used MySQL variables, as I can accomplish the same functionality
    with PHP in a much faster and easier.


