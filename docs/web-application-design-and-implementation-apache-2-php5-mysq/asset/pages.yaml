  md: '# JavaScript—A CLIENT-SIDE SCRIPTING LANGUAGE


    # Decisions


    As in PHP, JavaScript can check different conditions and branch to different sections
    of the code depending on the value found. To do so we can use the common comparison
    operators "=" for equals, "<" for less than, ">" for greater than, "=" for less
    or equal to, ">=" for greater or equal to, and "!=" for not equal. You can combine
    different boolean expressions with "&&" for AND, "||" for OR, and "!" for NOT.


    When using the if statement in JavaScript, there is one basic difference, residing
    in the elseif. In PHP elseif has to be written as a single word, but in JavaScript
    it is separate words. The general syntax would therefore be:


    ```

    if (condition)

    {

    else if (anotherCondition)

    {

    else

    {"

    ```


    You may also use the switch...case the exact same way as in PHP (don''t forget
    to use break). Here is an example of using both switch and statements. We will
    prompt the user for a number; if the user inputs something that is NaN, we will
    say there''s a problem; if it is a number, we will say "hello" if it is 0 or 1,
    "goodbye" if it is 2, and "hooah" otherwise:


    ```

    var input = prompt("Enter a number", 0);

    if (isNaN(input))

    document.write("Not a number!");

    else

    {

    switch (input)

    {

    case 0:

    document.write("Hello");

    break;

    case 2:

    document.write("Goodbye");

    break;

    default:

    document.write("Hooah!");

    }

    }

    ```


    # Loops


    In JavaScript, you may use the exact same basic loops used in PHP (except for
    the foreach loop). Just as a reminder, here are three quick loop examples.'
