- pgno: 56
  md: '# SPECIAL CHARACTERS


    # SPECIAL CHARACTERS


    The last piece of information necessary for now in order to start creating Websites
    is how to use special characters. As mentioned at the beginning of this chapter,
    you are not allowed to use the characters < and > for tags, but what if you wanted
    to use that symbol for a mathematical comparison? Here is where special characters
    come in handy. Other typical example is white spaces; as stated earlier, any large
    group of white spaces is translated into a single white space by browsers, so
    what if you wanted to force five white spaces between two words? “Gabarró.” As
    you noticed, it contains an accent on the o, which few keyboards around the world
    have, and that, depending on the regional settings, might not show up on the screen
    if I just use the character “ó.” Many people would just ignore this and write
    “Gabarro,” but as a proud Spaniard, I need an accent, and luckily enough I can
    get it in HTML in a way that will be printed in any computer, regardless of its
    settings.


    All special characters in HTML start with an ampersand (&) and finish with a semicolon
    (;). For example, the character “ó” is written &acute;, meaning when writing my
    last name on a Webpage I have to spell it Gabarr&acute;. White spaces are done
    with &nbsp;, < is &lt;, and > is &gt;.


    You can find a large reference table such as that in Appendix A.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# #4 Work Environment


    # ## INTRODUCTION


    In this chapter we will see step-by-step how to install all the software that
    we will need for our Websites to run. This includes an Apache Web server, the
    PHP engine, and a MySQL database. We will also see how to install and use two
    powerful PHP-based applications: phpMyAdmin to manipulate data-bases, and phpBB,
    a free bulletin board tool.


    The installation guidelines are for Microsoft Windows computers. These tools also
    work on UNIX, but chances you already have a Web server and PHP installed as part
    of the UNIX/Linux distribution of your choice. You can find more information on
    UNIX/Linux installation guide-lines in Appendix B.


    # ## DOWNLOADING THE SOFTWARE


    The first obvious thing to do is download all the necessary software that we will
    use. The Apache Web server can be found at www.apache.org. Once there, click on
    “HTTP server,” find the stable release (the current version at the time of this
    writing is 2.0.55 with a Windows installer and Feb.2.0 as a UNIX source package),
    click on “download,” and find the “Win32 binary


    > Web Application Design and Implementation: Apache 2, PHP5, MySQL, JavaScript,
    and Linux/UNIX, by Steven A. Gabarró

    Copyright © 2007 by John Wiley & Sons, Inc.


    45'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# WORK ENVIRONMENT


    (MSI Installer),” which will simplify the installation process. Download the file
    somewhere safe with all the files that we will download next.

    To download PHP, go to www.php.net, click on “downloads,” and choose the newest
    stable Windows package (version 5.1.2 of right now), choose the download mirror
    closest to your geographic location, and save the file with the Apache installer.


    The MySQL server can be found at www.mysql.com. Click on “developer zone,” and
    find the “MySQL server download” (current version is 5.0). Find the Windows downloads
    sections and for “Windows (x86)” by picking a mirror. At that point you may enter
    some personal information, although this is optional.


    The last two tools are phpMyAdmin and phpBB. In the main page you should be able
    to see all the different versions; just download the latest stable version (2.7.0,
    p. 12, as of the time of this writing). Pick your favorite compression format,
    choose a mirror, and download. phpBB can be found at www.phpbb.com; go to “download”
    and download the full package in zip, gzip or b2 format, depending on your favorite
    compression tool. If you are unsure, just pick zip. Choose the mirror again and
    save the file on your drive.


    # INSTALLING The Apache SERVER


    # Installation Steps


    To avoid problems, the first thing to do is stop any service that might use the
    port 80, such as, for example, instant messaging tools like AIM or Skype. It might
    also be a good idea to temporarily disable your computer’s firewall while you
    install this application.


    Start by double-clicking on the installer file that you downloaded. Click on “next,”
    read and accept the terms in the license agreement, click “next” again, read the
    description if you wish to, and then get to the “server information” configuration
    page. All these settings can be modified later, but you might want to set them
    up right away. First you will see the “network domain.

    If your computer is in a domain, enter that information. If you are unsure of
    your network domain, simply type “localhost”. The next field is “server name,”
    which represents your computer name right before. For example, if your domain
    was in.home.net, and your computer name is mycomp, you would enter in.home.net
    in the first field and mycomp.in.home.net in the second. As before, if you are
    unsure, just type email address to which users should send questions in case they
    encounter a problem accessing your sites.


    You must then choose whether to install the application as a service for all users
    on port 80, or just for the current user on port 8080. The difference between
    the two is that a service installation will basically start up your server when
    the computer does, and will be working on the standard port'
  merge: -1
