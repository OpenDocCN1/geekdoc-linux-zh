- pgno: 12
  md: '# Preface


    Steven Gabarró was born in 1979 and raised in Alicante, Spain. He started programming
    early, learning BASIC (Beginner''s All-purpose Symbolic Instruction Code) at age
    9. Later on, in high school, he learned Turbo Pascal and C. At that point it was
    pretty obvious that he was going to end up as a computer scientist. He ended up
    studying for a master''s degree in computer science in the Ecole Pour L''Informatique
    et les Techniques Avancées, where he specialized in advanced multimedia and Web
    technologies, graduating with honors, finishing third in his class. He went to
    the United States in January 2002, enrolling in the Masters of Science in Information
    Systems at the Stevens Institute of Technology, in Hoboken, New Jersey. There
    he quickly advanced from teaching assistant to full-time instructor. On his appointment
    as full-time faculty, he created the first Web programming course at Stevens,
    based on his personal experiences. This book is the result of that course, and
    is a close reflection of what Stevens teaches his students.


    BEFORE WE GET STARTED


    In my years of programming, I have learned tons of different programming languages,
    ranging from Basic to Java, and including C, PHP, JavaScript, Visual Basic, C++,
    Assembly 68k, and many others. Because of this variety I have always been obsessed
    with utilizing the tools I had available to combine the best aspects of each programming
    language.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# xliv PREFACE


    With this mentality I decided to create a Web programming course that would teach
    the ins and outs of the most commonly used free Web technologies. I have always
    supported free software, and as the big UNIX fan I am, I had to teach open-source
    technologies. This book is the result of the work I did on the course, with added
    content to make it a step further.


    # WHO SHOULD READ THIS BOOK?


    The way this book is organized, it should be ideal for anyone trying to learn
    how to create complete Websites with no previous knowledge of any of the languages
    presented. It does require some minimum knowledge of programming in general, as
    well as object-oriented programming basics to understand Chapter 8.


    It is also a good read for Web designers that know about making pages nice like,
    but no knowledge of how to create dynamic pages built through a database or anyone
    who would like to pick on the art of programming pages. Realize that I have never
    been a good graphic designer, so this book will not tell you how to do things
    making decisions regarding the proper colors, fonts, or sizes to use, or other
    cosmetic details. I will detail how to set those features up, but will not tell
    you how to pick your layout or color schemes, because I am definitely not good
    at it. Instead, I will concentrate on how to actually program useful pages with
    loads of functionality.


    # ABOUT THE EXAMPLES


    All the examples have been tested, and if any are not compatible with a specific
    browser, this will be stated in the text. You can find all the example files,
    as well as an example solution for the mini exercises and the indexer/searcher
    case study at ftp://www.wiley.com/public/sci_tech_web/application. I will also
    work on extra examples that I will make available to illustrate other areas of
    the book that did not get a full example. I would have included many more examples,
    but then would need two or three volumes this size. Instead, I will just put everything
    in a Website for you to download and test. I hope you enjoy it all!


    # HOW TO READ THIS BOOK


    The book is organized to read front to back, but you may skip chapters as you
    fit, or use the book as a reference. The Introduction is a summary of Chapter
    19 and should be used by people already experienced in Web development. It is
    basically meant as a guide to using this book as a “Web programming cookbook.”
    You may read this Introduction for brief guidelines or go straight to Chapter
    19 if you need an in-depth explanation with a practical example.'
  merge: -1
  img_proc: true
