    of the questions will be used in the table question_in_test with an id_test referring
    to the test it asked in; number, to know which order it was asked for the test;
    value, indicating the number of points it is worth for that test; and id_qt, will
    be a primary automatically incremented key used to refer to a specific question
    of a test. Finally, we need to hold the grades of each student, which might well
    be a grade per question.

    We have a table grade_per_question with id_cg, id_student (the student that took
    the test), id_qt (reference to a question of the question_in_test table), and
    grade. Technically we could create an additional table with the grades for a full
    test student, but it is possible to calculate it from data held in other tables,
    it is not necessary. The final list of tables (and attributes) we have as follows:


    +   * students: id_student, surname, email

    * tests: id_test, title, date

    * questions: id_question, question, answer

    * question_in_test: id_qt, id_question, id_test, number, value

    * grade_per_question: id_gg, id_qt, id_student, grade


    Now we need to determine the relationships between the tables. First we have the
    table that holds a piece of information (id_student) required in the table grade_per_question.
    Each student can have many graded questions, but each entity in grade_per_question
    can refer to only a single student. Therefore the relationship from students to
    grade_per_question is 1:n. The table holds id_test, needed in question_in_test.
    Each test has multiple questions, but an entity in question_in_test can refer
    to only a single test; therefore the relationship from test to question_in_test
    is 1:n. The table questions contains id_question, used in question_in_test. Each
    question can be used in many tests, but each entity inside question_in_test can
    refer to only a single question, so the relationship from questions to question_in_test
    is also 1:n. The table question_in_test contains id_qt, used in grade_per_question.
    A question in a test can have a grade for many students, but an entity inside
    grade_per_question can refer to only a specific question in a test; therefore
    the relationship from question_in_test to grade_per_question is 1:n. The table
    question_in_test has references to id_question and id_test, but we already took
    care of the relationships that these references entail. Finally, the table grade_per_question
    has already been assigned needed relationships. In Figure 11.2 you will see a
    simplified diagram for this database.


