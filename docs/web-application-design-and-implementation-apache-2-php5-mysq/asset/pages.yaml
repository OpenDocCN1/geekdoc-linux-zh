- pgno: 231
  md: '# 19


    # Putting It All Together!


    # OVERVIEW


    With so many techniques and approaches, you might feel a bit lost trying to know
    how to organize your development phases, what you should start with, and what
    language should be used for what. This chapter provides the guidelines for applying
    the design techniques I have used in the past and that have always proved to work.
    As an example, we will imagine that we are writing a Web-based commerce site.
    These guidelines are general to any language; at the end of this chapter I will
    get more specific on the strong points of each language and what languages should
    be used and when.


    # PROCEDURE


    Step 1—Understanding the Problem and Finding the Solution


    This is probably one of the most important steps in Web development, and actually
    any type of programming. Designing your scripts properly depend on this. You must
    understand what you are trying to achieve and then figure out how to solve that
    problem. Usually the solution is found through several meetings between the developer''s
    group and their managers. It is a good idea to have project sponsors at the first
    meetings so they can state clearly what they are paying for and what they would
    like to accomplish.


    > Web Application Design and Implementation: Apache 2, Apache, PHP5, MySQL, JavaScript,
    and Linux/UNIX, by Steven A. Gabarró

    Copyright © 2007 by John Wiley & Sons, Inc.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# PUTTING IT ALL TOGETHER!


    Once the first meeting has taken place with the decided scope of the project,
    you need to visualize how the final product will behave and what modules will
    be required. For example, if we are writing an e-business site, we know that we
    will need a payment module for customers to pay for their purchases, a shopping
    cart system to keep track of purchases, a username/password system to remember
    regular users, an administrator panel to add items to our store, and scripts that
    will show the products to the clients by extracting the details from the database,
    allowing items to be searched by name, price range, or even category. To keep
    the example simple, since I know what most computer science students like to do
    in their spare time, we will assume that we are creating a Website that will sell
    videogames.


    # Step 2—Designing the Database


    The reason why we call these Websites "database-driven" programs is simple—the
    entire page revolves around a central database. This means that creating the database
    should be the first part of your development cycle, after knowing how you plan
    to solve the problem. Always try to create a database with the least possible
    redundancies, and my advice is to try to have tables that hold only the crucial
    information for that table. If there is a set of data that complements a table
    but is not essential for the table itself (e.g., a list of user preferences could
    a user''s), you should create a separate table linked to the one, rather than
    including all the properties in a single table. The reason for this is that if
    you query on a large table, more information will have to be fetched, taking longer
    to run the queries.


    We established that we want a Website to sell videogames with attributes like
    id_game, name, esrb_rating, description, and image_url. Then we know that we will
    need to remember client details, so we will use a table with id_user, name, surname,
    email, username, password, and level. I am adding the level field to handle clients
    versus administrators. It just needs to be a little flag that will have a value
    for regular shoppers, and a different value for Website administrators, granting
    them the right to modify the contents of the site, such as adding and removing
    games, reviewing orders, deleting users, and adding administrators, and so on.


    As we said, we want to be able to search games by categories, yet you probably
    noticed that I did not add a category field. There is nothing wrong with writing
    a string with all the categories that a game is part of; for consistency with
    category names, I will create a categories table with id_category and category.
    This will store the names of the categories and associate each one with a simple
    number. This is the way I always write my databases that I never need to transmit
    a string to extract information from one table to another. Instead, I always use
    duel keys, making it harder for a hacker to know what information I transmit between
    scripts.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# PROCEDURE 229


    Following the same type of logic, even though the number of possible game platforms
    is limited, there are always new platforms appearing every few years. In order
    to keep our database robust and feasible as possible, we will have a platforms
    table with id_platform and platform, similar to the categories table. As you probably
    noticed earlier, the videogames had no reference to platform or price, because
    the same game may be available in different platforms, and its price will likely
    depend on its platform. For example, a handheld version of a game will always
    be less expensive than the same game on the newest generation of consoles. We
    will therefore use a game_platform with id_game_platform (this is the id used),
    id_game, id_platform, and price.


    We need to track of shopping carts. Most basic commercial Websites simply store
    the shopping cart in a session or a set of cookies, loosing all its contents if
    the user leaves the current session and logs in a different one later. Instead
    of this, we will instruct the customer to memorize shopping carts of registered
    users, so the next time they log in, the items they tried to purchase will be
    available. Each user is supposed to have a single cart, to keep things simple,
    we will use id_user as the primary key for the carts. If the user is not logged
    in, we will not store the cart in the database, using sessions instead. Basically,
    shoppers would get into the page, start shopping, and if they log in, their shopping
    carts will be stored in the database. If they were already logging in, the carts
    would be updated as database well. Our table will hold id_user, date, and total_price.
    To store the items in the cart and its quantities, we can use a table game_in_cart
    with id_game_in_cart (null), id_user (reference to a specific shopping cart),
    id_game_platform (reference to a game in a specific platform), and quantity. The
    price can be calculated through the game_platform table.


    Once the user decides to check out the shopping cart (i.e., finishes shopping),
    you need to ask for information such as shipping address, billing address, and
    payment information. Each user may have several credit cards, each associated
    with its own billing address information, and can also have a group of possible
    shipping addresses (in case the order is to sent home, to the office or to a friend).
    To make our database as feasible as possible, we will have a table addresses with
    id_address, id_user, line1, line2, city, zip, and phone; and a table payment with
    id_payment, id_address, type (Visa, MasterCard, American Express, or other payment
    method), number, expiration'
  merge: -1
  img_proc: true
