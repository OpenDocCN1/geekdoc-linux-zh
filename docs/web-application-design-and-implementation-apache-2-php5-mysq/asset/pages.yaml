    # The Indexer—Step 1


    The secret to a search engine is having great indexing. The process of indexing
    is the usually long and hard task of gathering as much information on the pages
    we are able to settle and organize our findings. There are tons of different types
    of indexers, from the basic “keywords” indexers that simply store the information
    found under the META tag “keywords” to complete full-text indexers with thesaurus
    we use n-dimensional space vectors to store the information of the files (beyond
    the scope of this book). We are going to settle something in the middle: a basic
    full-text indexing with META information gathering.


    A full-text indexer goes through the content of the file being indexed, counting
    how many times each word appears. This information is stored in a database, and
    when a user looks for a word like “Spain,” you show all the pages that contained
    that word, starting with the one that had the word appearing more times. There
    are several important things to realize when indexing, though.


    First, are useless words that do not need to be indexed. A “useless” word is a
    word that has no common sense would try to look for, usually a word that gives
    no information on the topic of the page. For example, words like “a,” “the,” “for,”
    “yes,” and “no” could be considered “useless.” In order to skip useless words,
    there are several techniques, such as having an array to index a word that has
    less than a predetermined amount of letters, with the danger of excluding but
    important words. For example, a page on databases might contain the abbreviation
    DB (for database) appearing many times, and should not be ignored. For our indexer,
    we will simply ignore words of one letter, indexing only words of two or more
    letters.


    Another typical problem is indexing HTML tags. Obviously when searching for files,
    you will want to know how many times a word HTML appeared, but you seldom care
    how many times a specific HTML tag was used. Using strip_tags will be extremely
    useful! Always remove the HTML tags before indexing


    Other important things to keep in mind are letter casing and special characters.
    Realize that as far as PHP goes, words like “Alicante” (my hometown) and “alicante”
    are different, but as far as our indexer goes, they should be the same. To solve
    this, the standard consensus is to lowercase the entire file being indexed. As
    for special characters, you have a new line, and exclamation point or a double
    quote. So you need to find a way to get rid of special characters. Regular expressions
    are usually the best way, but since we will not see them'
