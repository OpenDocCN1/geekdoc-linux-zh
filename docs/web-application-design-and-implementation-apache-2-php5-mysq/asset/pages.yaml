    # Images


    Using images in Websites is like using table salt when cooking. Without it, the
    site is too bland, but include too many images, and it becomes hard to enjoy.
    I must say, as most people discovering animated GIF images for the first time,
    my first HTML page was an array of ridiculous images, including the "all-star"
    work-in-progress animation, e-mail image, and other classics found in virtually
    "I''m learning HTML" Websites. In retrospect, that page was the ugliest page I
    wrote in my life, but people learn from past mistakes. So is my advice to all
    of you—keep it simple and don''t overdo it


    Another important thing about images is size and format. People realize that the
    bigger the image, the longer it will take to load, especially for those who still
    use dial connections. Generally images should be kept under 100 KB. Another important
    factor is the format. Most browsers accept a variety of image formats, for example,
    including a BMP image is strongly discouraged, simply because in all noncompressed
    images, the images will be unnecessarily huge. The most used formats are GIF,
    JPG, and PNG, and you should try to limit your images'' formats to either one
    of these three. Keep in mind that GIF allow animations, but are limited to 256
    colors. Generally, use JPG for images that require higher quality and GIF for
    icons and such. Also keep the page, you do not necessarily need an image to be
    the contents of the page. A technique I regularly when creating my background
    images is to utilize the fact that background images are shown as a mosaic, filling
    the entire page with as many copies of the image as needed. For example, if there
    is a color you really want to use but it cannot be defined by the standard hexadecimal
    red-green-blue notation, you can create a pixel of 1 pixel by 1 pixel (1 ×1 pixel)
    filled with the color you wish to use. When using it as a background, that pixel
    will be used all over the page to fill in the background, but will need to be
    downloaded only once to the client. Another nice technique is to include'
  merge: -1
  img_proc: true
