- pgno: 68
  md: '# PHP—A Server-Side Scripting Language


    # HOW DOES IT WORK?


    Some "New" Words on PHP


    As you should already know, PHP is a server-side scripting language. PHP scripts
    are usually accessed through forms that send information using either the GET
    or POST methods (as we will discuss in Chapter 9). It was created in 1995 by Rasmus
    Lerdorf, and initially called PHP/FI.


    For a long time there were two main versions that coexisted: PHP3 and PHP4, and
    now we have PHP5, which made PHP3 a thing of the past. PHP4 is still used by many
    PHP users, even after they install PHP5. The main difference between the versions
    is the way they operate. PHP3 was a pure interpreted language, which means that
    code was interpreted line by line by the server as the code was read. PHP4 introduced
    the script motor “Zend” that increased the treatment speed. PHP4 was a sort of
    object compiler that was then sent to the Zend engine. The arrival PHP5 brought
    Zend2, and even faster script motor, as well as object-oriented programming, as
    we will see in Chapter 8. Most PHP5 users actually don''t take advantage of the
    object-oriented capabilities of PHP5, so they technically use PHP4 on a PHP5 installation.


    This chapter covers the basics of PHP, so it could be considered a PHP4 tutorial.
    Chapter 8 will introduce you to objects in PHP5.'
  merge: -1
  img_proc: true
- pgno: 69
  md: "# Syntax Generalities\n\nPHP code is usually inserted inside HTML code. This\
    \ allows for small parts of an HTML page to be executed before the page is downloaded\
    \ to the computer. To insert PHP code in any page, use <?PHP. For a long time\
    \ it was fine to just write <?, but the newer versions of PHP encourage the use\
    \ of the full <?PHP opening tag, to prevent any confusion in executing the scripts.\
    \ Once the opening symbol has been written, you enter the “PHP zone.” Anything\
    \ you type will be executed by your PHP engine before you send the final page\
    \ to the user. When you are writing your script, or portion of script, you must\
    \ close the “PHP zone” with ?. You already saw an example of this when we write\
    \ index.php file containing <?php phpinfo();> This means that we start the PHP,\
    \ and call the function phpinfo().. Each instruction in PHP must end with a semicolon;\
    \ doing so will make the page not work, but be careful!\n\nYou can create comments\
    \ in PHP by using the same symbols as in C language. You can select an area of\
    \ comment, starting with /* and finishing with */, or you can use // to comment\
    \ anything until the end of the line. Here is an example:\n\n```\nINDEX.PHP FILE\
    \ ----------------\n<?php\n This file checks the phpinfo --*\nphpinfo(); //This\
    \ is the line that will be executed\n// the rest are all comments\n?>\n```\n\n\
    # INSTRUCTIONS\n\nIn PHP you may use instructions, functions calls, loops, and\
    \ conditions (plus objects with PHP5), but never forget the semicolon at the end\
    \ of each function call and every instruction.\n\nA first easy function to use\
    \ is echo, which allows printing on the page. Remember that when you run PHP code,\
    \ it runs in the server, and any output that occurs will appear inside of the\
    \ code where the instruction was called, so if you wish to make an “echo” in an\
    \ HTML page containing proper tags, you should place the PHP code between the\
    \ opening and closing body tags. Here is a clean example:\n\n```\n<HTML>\n<HEAD>\n\
    <TITLE>Script1</TITLE>\n</HEAD>\n<BODY>\n<?php echo \"Hello World!\"; ?>\n</BODY>\n\
    </HTML>\n```"
