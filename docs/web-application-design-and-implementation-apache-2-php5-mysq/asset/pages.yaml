- pgno: 21
  md: '# THE WEB SERVERS


    # THE WEB BROWERS


    Right at this point we have seen what lead to the creation of the computer network
    known as “the Internet,” and the reasoning behind the apparition of the World
    Wide Web. But we still have a main problem that we haven''t answered yet—how do
    we use all this to communicate? First the Internet brought us the media through
    which the information would flow, then the WWW created a standard format for information
    formatting, but there was still the problem of how to read that information. To
    solve that problem, some tool had to be created that would use the current standards
    and code Web documents and format them in such a way that would be intelligible
    to the user. The Web browsers came to the rescue and solved that problem. The
    first graphical user interface (GUI) with the WWW to appear as Mosaic, created
    by the National Center of Supercomputer Applications (NCSA) at the University
    of Illinois in 1993. In 1994 Norway entered by using the still-used Opera. Soon
    after Netscape appeared, followed by Microsoft’s Internet Explorer, which appeared
    along Windows 95. From that point on, the browsing market has done nothing but
    evolve and—Fortunately for us, the users—improve. Nowadays the two main browsers
    used are Internet Explorer and Mozilla Firefox.


    # THE WEB SERVERS


    Now that we know what the Internet is, the purpose of the World Wide Web, and
    why we use Web browsers, another question may arise: “Where are all these data
    stored?” It is definitely enlightening to know how we access all the information
    that the World Wide Web has to offer, but where is all information? Well, the
    answer is pretty simple; it is in all the computers that have the Internet. Some
    people become alarmed, believing that any computer connected to the Internet will
    automatically make all of its files accessible to the entire world. Not to worry,
    that is not it works. In order to share information in a specific computer, some
    software has to be installed on the computer, making it a “Web server.” The server
    creates a list of folders that will be shared when someone attempts to connect
    to the computer using standard Web protocols. There are two main competitors in
    the Web server market. The first one, my personal favorite and the one used throughout
    this book, is Apache, developed by the Apache Software Foundation (www.apache.org).
    Apache has the great advantage of being totally free of charge and works on every
    platform. It is an open-source program, which means that you can actually see
    the code behind the server and even participate in the improvement of Apache.
    It is reliably and vastly used around the world, and pretty much the only reliable
    option on UNIX/Linux. The other main server is Microsoft’s Internet Information
    Services (IIS, www.microsoft.com/iis). IIS is not open-'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'source and works only on Windows operating systems, although a simplified free
    version is available with Windows XP Professional. The latest versions of IIS
    run on Windows Server 2003, which obviously is not free. Some of the differences
    between IIS and Apache reside in their user interface. Apache, as most UNIX-based
    software, is configured entirely through a simple text file that is loaded when
    the server starts up, whereas IIS has a GUI is meant to be more user-friendly.
    Choosing which server to use is based mainly on knowing which technologies will
    be used as well as the budget available. Users on a low budget will probably prefer
    the use of open-source technology and free development platforms; the use of Apache.
    If on the other hand, you wish to use Microsoft''s .NET and you have the money
    to afford it, IIS is the best option.


    # TCP/IP BASICS


    As mentioned earlier, the Internet was strongly enhanced by the creation of TCP/IP
    by Cerf and Kahn, but how exactly did TCP/IP help in this new era of communications?
    When studying network communications, we learn about the Open Systems Interconnection
    (OSI) layer model. This model breaks down computer networking into seven distinct
    layers. Computers communicate at the same layer through a set of protocols adapted
    to that particular layer. The seven layers are as follows (in ascending order):


    +   Physical layer—responsible for sending raw bits over the communication channel.
    It is specific to the medium [twisted-pair or fiberoptic cable, wifi (wireless
    fidelity), etc.].

    Data link layer—takes a raw transmission and transforms it into a line of undetected
    transmission errors. It also breaks the input into data frames and transmits them
    sequentially. Finally it attaches special patterns at the beginning and end of
    the frame like the starting frame delimiter (SFD), cyclic redundancy check (CRC),
    and the preamble. This is the layer responsible for flow control and error control.

    Network layer—concerned with addressing and routing of messages to their respective
    destinations.

    Transport layer—provides services that support reliable end-to-end communications,
    such as generating the final address of the destination, establishing the connection,
    error recovery, and termination of the session.

    Session layer—responsible for the dialog between two cooperating applications
    or processes. Remote login and spooling operations use the session layer to ensure
    successful login and control the flow of data to the remote printer. The token
    management in a token ring configuration is handled by the session layer.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# TCP/IP BASICS 9


    6. Presentation layer—concerned with the syntax and semantics of the information
    transmitted from end to end. For example, Windows is considered a level 6 service.


    7. Application layer—provides the utilities and tools for application programs
    and users, like telnet, FTP, DNS, and HTTP.


    TCP/IP is a binary simplification of the OSI model that concentrates on four layers:
    network access layer (Ethernet, FDDI, or ISDN), Internet layer (IP), transport
    layer (TCP, UDP), and application layer (FTP, telnet, SMTP, HTTP).


    # The Internet Layer


    The Internet layer is the equivalent of the network layer in the OSI model. It
    contains the Internet Protocol (IP), which provides addressing, datagram services,
    data package segmentation, and transmission parameter selection. In order to function
    TCP/IP relies on IP addresses, which are assigned to each computer. An IP address
    is composed of 4 bytes, and each of these numbers range between 0 to 255, since
    it represents only one of the bytes of the IP address (and, as you should know,
    you can represent 256 numbers with only 8 bits). Each IP address is composed of
    two parts, the network address and the computer address. To understand how the
    address is broken down, you need your subnet mask. The way it works is through
    a binary operation between your network address and your subnet mask. The result
    of that operation represents the network address. For example, let''s assume that
    your IP is 192.168.1.20, and your subnet mask is 255.255.255.0. Let us see how
    we get the network address:


    If you are not sure how to use the binary and nonbinary numbers, start by transforming
    each to binary. 192.168.1.20 becomes 11000000.10101000.00000001.00101100, and
    255.255.255.0 is 11111111.11111111.11111111.00000000. Performing the AND operation
    between those two numbers gives us 11000000.10101000.00000000.00000000, which
    is no other than 192.168.1.0. You can achieve this result by realizing that 255
    in binary is 11111111, and since an AND operation between a 1 and any other bit
    will leave it unchanged, we can basically keep the numbers of the IP address that
    corresponds to the 255 of the subnet mask. We then know that a binary and between
    0 and anything will always be 0, so where we have a subnet mask is 0, if we have
    an IP of 155.180.24.45 and our network address is 255.255.255.0, our network address
    will be 155.180.0.0.


    This network address lets know which computers we will be able to communicate
    with directly. Only computers that are in the same network “see” each other, so
    a computer in a network 192.168.1.0 and another one in a network 155.180.0.0 will
    not be able to communicate with one another if they are directly linked to each
    other. The rest of the IP address (20 in the'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# 10 FUNDAMENTALS


    first example, 24.45 in the second) corresponds to the particular computer address.
    Choosing a network appropriately is important since it will decide the amount
    of computers that you can connect. For instance, a network with a subnet mask
    of 255.255.255.0 will be able to accommodate only 254 distinct IP addresses. This
    type of network is said to be of class C. A network with subnet of 255.255.0.0
    is said to be of class B, and finally 255.0.0.0 is said to be subnet of a network
    of class A. One of the most important things when choosing your IP is making sure
    that it is a valid address. You are not allowed to have an IP that is the same
    as your network address; for example, if your network is 192.168.1.0, you cannot
    have 192.168.1.0 as a computer''s IP address. Your other restriction is that your
    computer address cannot be all ones in binary; for instance, the same network
    as in the previous example, address 192.168.1.255 is not authorized (255 is 11111111
    in binary). This type of address is used by TCP/IP to send broadcast messages
    to all computers within the network.


    Now that we know the IP address, you might be wondering how you can be in a class
    C (with a maximum of 254 computers) and still be able to access millions of computers
    worldwide, even though they are not in the same local network as you are. Well,
    the answer to that is basically between two separate networks. To function, you
    have two network cards in two separate networks. For example, you could have a
    router with one of its IP addresses as 192.168.1.254 in a class C network, and
    the other as 155.180.255.254 in a class B network. If a computer connected to
    not part of the 192.168.1.0 network, it sends the IP requested to the router,
    which will then try to find address using the second branch. The whole principle
    of the Internet is based on millions of networks connected through routers. Now,
    because of the amount of routers in the world, there is a virtually infinite amount
    of ways to submit data between two computers. Avoid taking the wrong path, several
    protocols can be used.


    Remembering the IP addresses of all the possible computers we would like to access
    is so difficult, so symbolic addresses were created. Those addresses work as a
    set of aliases for IP addresses, as .com, .gov, .net, .es, and .co.uk to make
    it easier, it is possible to assign a name to a specific address, such as google.com,
    for example. In order to retrieve the corresponding IP, the computer accesses
    something called Domain Name Service (DNS), which contains a table with all equivalences
    between names and IPs. Every time you see a dot in a name, this means that you
    are accessing a subdomain; for example, if you visit the page http://steven.beuchwy.com/,
    you are looking within all companies (.com) for the one called “beuchwy”, and
    once you find it, you look for the subdomain called “steven”.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# The Transport Layer


    The transport layer is home to two main protocols: the User Datagram Protocol
    (UDP) and the Transmission Control Protocol (TCP). UDP is a connectionless protocol,
    meaning that the order in which messages are sent by the emitting computer is
    not necessarily the order in which they will be received in the destination computer.
    This protocol is not of interest in this book, so we will not go further in the
    explanation of UDP. TCP, on the other hand, is very important for Web access;
    it is a connection-centered protocol. TCP handles the connection, disconnection,
    data flow control and sequencing, and many other tasks required to establish a
    communication between two computers. It receives the data flow that needs to be
    sent by the user and breaks it down into packets of roughly 64 KB (kilobytes);
    i.e., 65,536 bytes), which are then sent through the IP protocol. In order to
    send those packets, TCP needs to open something called a “socket,” which can be
    used by programs to access files. Sockets can be opened or closed, and allow both
    reading and writing. For example, a character in a TV show who asks the technician
    to “open a socket on the computer” is actually requesting access to the computer
    through IP on a specific port. You can imagine “ports” as electronic gates that
    reside within your computer and are needed to send or receive information. For
    example, when you access a Webpage, the information contained in the page is sent
    to you via your port 80 (generally). If you access an FTP server, you are using
    your port 21; if you are connecting through SSH (Secure Shell); used to connect
    to remote computers), you''re probably using port 22.


    # The Application Layer


    This layer is responsible for the protocols that most users know or at least have
    heard about. The first and utmost important for this book is the Hyper Transfer
    Protocol (HTTP). HTTP was created for the exchange of HTML documents; it is based
    on TCP/IP and is the responsible for the communication between Web server and
    Web client (you and your browser!). This protocol is meant to be multipform, everything
    is sent in ASCII (American Standard Code for Information Interchange) format,
    as plain characters. We will talk more about HTML documents in the next chapter.


    Many other protocols in the application layer are important in the everyday life
    of an Internet user, such as the following:


    +   - File Transfer Protocol (FTP)—responsible for transferring files.

    - Simple Mail Transfer Protocol (SMTP)—responsible for sending emails.

    - Post Office Protocol (POP)—usually seen as POP3 by email clients, this protocol
    allows you to retrieve email messages from your mail server.

    - Internet Message Access Protocol (IMAP)—another protocol used for email transfers.'
  merge: -1
  img_proc: true
