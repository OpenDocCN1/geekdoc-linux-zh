  md: '# JavaScript SYNTAX


    # Types of Data and Variables


    In JavaScript, as in PHP, any data help has a type associated with it, which can
    be numerical, text, or, or more complex data such as arrays or objects. When writing
    a string, make sure to surround it by either double or single quotes. You may
    also use any of the special characters such as `\b` for backspace, `\n` for return
    carrier, `\t` for tab, `\''` to sign a single quote, `\"` for double quotes, `\\\`
    for backslash, or `\xNN` (where NN is a hexadecimal number) to write the character
    with ASCII code `\NN`. You can also use `true` and `false`.


    In PHP, JavaScript does not need to specify the type that you will hold, and you
    can switch the contents of a variable from a number to a string, to an object,
    or to anything you need. Variables in JavaScript do not need special characters
    such as the dollar sign used in PHP. For this reason, for the browser to understand
    that variable, putting the keyword `var` before the variable first time you use.
    Variable names must start with a letter, and be composed of any letters, numbers,
    and the underscore symbol (_). Here is a small example of how you would declare
    a variable, we will assign a number to it, and then switch to a string (this code
    should, of course, be surrounded by the SCRIPT tags):


    ```

    var myVar;

    myVar = 23456;

    alert(myVar);

    myVar = "Hello World!\nalert(myVar);

    ```


    Remember to put a semicolon at the end of each line of code. As you can see, alert
    is very flexible, and can show any data of primitive types.


    # Operations and Calculations


    To assign a value to a variable, simply use the equal sign. You may use numerical
    calculations between variables using the arithmetic operations +, -, /. The plus
    sign can also be used to concatenate strings, so you could output a mix of strings
    and variables by writing, for example, alert(`Variable 1 is ` + var1 + ` and variable
    2 is ` + var2););


    You can use the same postfix (++)


    ![](img/6573b0a7bed590e34e9cfe58e6fc8c60_180_0.png)'
