  md: '# 172 JavaScript—A CLIENT-SIDE SCRIPTING LANGUAGE


    the <PHP ?> for PHP. Once you are between opening and closing SCRIPT tags, make
    sure to respect all JavaScript syntax rules!


    As we saw on Chapter 2, JavaScript is an object-based language, most of our time
    will be spent using objects to do our job. One thing to remember is that the language
    is case-sensitive, make sure to use the proper mix of upper- and lowercasing when
    calling an object''s method or attribute!


    When we studied PHP, we saw that it works by executing the code on the server,
    and sending the final result directly to the client''s browser. JavaScript runs
    client-side, having all its code downloaded along with the HTML. For this reason,
    all the JavaScript run by line as the page is being read and displayed. For example,
    if you have JavaScript between two HTML paragraphs, the first paragraph will be
    displayed, then the JavaScript will run, and the second paragraph will appear
    on the page after the entire script is finished running. Here is an example of
    a page containing a script that will change the background color of the page.
    You do not need to understand how it works; we are just trying to see the basic
    structure of a page containing JavaScript and how the script is executed by step:


    ```

    <HTML>

    <HEAD><TITLE>JavaScript example 1</TITLE></HEAD>

    <BODY>

    First block!<BR>

    <SCRIPT LANGUAGE="JavaScript">

    alert("First block");

    </SCRIPT>

    Second block!<BR>

    <SCRIPT LANGUAGE="JavaScript">

    alert("Second block");

    </SCRIPT>

    ```


    And now we change the background color to yellow<BR>


    ```

    <SCRIPT LANGUAGE="JavaScript">

    alert("Change Background!");

    document.bgColor = "Yellow";

    </SCRIPT>

    </BODY>

    </html>

    ```


    The function used creates an alert window, which blocks the script until the user
    clicks on "OK." As you can see, an alert is waiting to be clicked on, it blocks
    the interpretation of the HTML file and nothing else is displayed until we unblock
    the script.


    Comments work in JavaScript the same way as they do in PHP, meaning that you can
    use either the double slashes or the /* ... */.'
