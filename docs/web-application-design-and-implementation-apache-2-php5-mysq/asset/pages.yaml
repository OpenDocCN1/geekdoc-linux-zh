    previous database and you insert an entry in the table question_in_test, you should
    make sure that it refers to the right test with a proper id_test and to the right
    question, with the proper id_question. You should systematically check all data
    inserting the entity you insert depends on data already in the database.


    To avoid problems, and to enhance security, I personally always use a dull key
    called id_ followed by the name of the table. I always make that key primary,
    and autoincremented (automatically incremented), I so do not need to worry about
    specifying its value when inserting elements. Fields like email should always
    be set as UNIQUE to avoid problems. The reason why dull keys help protect your
    database is that all the information you need to search for a specific entry in
    any table is simply a number, so if you need that information through pages, anyone
    trying to hack on your site will see you only a number, without knowing what it
    means. For example, if you are sending a reference to a student through the GET
    method in PHP, it is much safer to see something like script.php?id=4 instead
    of script.php?student=sgabaroo.


    # Simplifying the Diagrams


    Something I have realized after many years of designing databases is the tediousness
    of always adding the name of a relationship as well its type. After you gain some
    experience understanding relationships become obvious with a glance at the tables
    linked by the relationship. Therefore, I do not write the relationship name or
    its type. To show the dependences between tables, such as, for example, the table
    grade_per_question on the students and question_in_test, I use an arrow pointing
    from the depending table (let''s call the “primary” table, or table 1) to the
    dependent table (the “secondary” table, or table 2). This generally would have
    corresponded to a “1” in complexity terms. For example, a relationship of 1:1
    would be represented with a double-sided (double-barred) arrow, a relationship
    of 1:n will be expressed by an arrow going from the n to the “1,” and a relationship
    of n:m will not be expressed by an arrow. A simplified version of our previous
    database diagram is shown in Figure 11.2.


    # USING MySQL


    MySQL is a database programming language based on the standard ANSI SQL92 but
    contains several modifications. For example, nested SELECTs were not available
    in MySQL until version 4.1; MySQL does not support SELECT... INTO TABLE that the
    standard SQL accepts; and became accessible only in version 5.0.1. You probably
    wonder what all this means.'
