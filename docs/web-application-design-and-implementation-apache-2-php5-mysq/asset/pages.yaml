    # ASSIGNMENT—FINAL PROJECT


    When I teach this course, it is the point where I ask students to specify their
    idea for a final project. The reason I will wait until I finish the basics of
    databases is because all database-driven Websites should be designed around the
    data-base, so it is important to have enough knowledge of database structures
    to come up with a proper database layout for the project. The main rules I enforce:


    +   - Create a team (minimum one person, maximum three or four, depending on the
    project). The harder the project, the more people I allow to work on it. Ideally
    I like have projects of at least two students as it forces them to learn how to
    work together in teams.


    +   - Start thinking of a final idea; the project must be a database- Website
    written in PHP. I allow free choice of database (excluding MS Access) as the principles
    remain regardless of whether they decide to use MySQL, PostgreSQL, or other similar
    database. Typical projects include bulletin boards similar to phpBB, eCommerce
    Websites, image galleries, and online journals.


    +   - Write a page describing the project, and who will be the team members. I
    require students to write the description in a single page to learn how to transmit
    important information in a small amount of text, going straight to the point.


    +   - When students have no project ideas, I usually choose one for them, but
    I tend to suggest fairly complex projects such as email or FTP clients coded in
    PHP. This motivates students to use their imaginations and create Websites that
    they might use in the future.


    +   - Finally, some JavaScript features must be added before the final presentation
    of the project.


    Once the project proposal is submitted, it is the professor''s decision to accept
    the project as is or to add features that seem necessary. Once the project is
    approved, the student must take the project through three main phases:


