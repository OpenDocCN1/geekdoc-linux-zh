    foreach ($arr as $selem)\\necho $selem. \";\n```\n\nThere are some alternatives\
    \ to the explode method when you are trying to extract words from a string that\
    \ contains many characters such as double quotes, arithmetic symbols, new lines,\
    \ tabs, or any such character. The most efficient option would be regular expressions,\
    \ but that section will be covered in a much later chapter. The other alternative\
    \ is to tokenize the string. To do so, we use the function strtok($str, $sep).\
    \ This function splits the string $str into smaller tokens, with each token delimited\
    \ by any of the characters from $sep. The way it works is that each successive\
    \ call to strtok will return the next token. The $sep parameter needs to hold\
    \ a string with all the special characters to be considered separators. When strtok\
    \ cannot find any more tokens, it will return false, which makes this method ideal\
    \ for use inside a while loop. Here is an example taken from www.php.net:\n\n\
    ```\n?php\\n$str = \"This is\\tan examplenstring\";n/* Use tab and newline as\
    \ tokenizing characters as *//\n$tok = strtok($str, \" \\n\\t\");\\nwhile ($tok!=\
    \ false) {\n\\techo \"Word=$tok<br\";\\n\\ttok = strtok(\" \\n\\t\");\\n}\\n?\n\
    ```\n\nIn this example, the string $str is broken down into \"this,\" \"is,\"\
    \ \"an,\" \"example,\" and \"string.\" Even though there were no white spaces\
    \ between some of these words, a separator was found, causing strtok to recognize\
    \ a nonzero character as found. Each iteration of the loop will have a single\
