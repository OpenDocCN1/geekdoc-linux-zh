    \ Check this example:\n\n```\n<?PHP\nfunction static_example() {\n    static $count\
    \ = 0;\n    echo \"You have called the function .++$count.\" times\";\n}?>\n```\n\
    \nThe first time the function is called, a variable $count is created as static,\
    \ and set to 0. This will only happen the first time the function is called; the\
    \ next time, the program will understand that $count already exists. When we echo\
    \ the string \"You have called the function,\" note that right after this string\
    \ we have placed a dot (.), allowing the concatenation of anything to the previous\
    \ string. \"times.\" Our total string will tell us how many times we accessed\
    \ the function. We concatenate ++$count, which will then be concatenated with\
    \ \"times.\" The preincrement is due to our initialization to 0 of the static\
    \ variable. The first time the function is called, the preincrement will modify\
