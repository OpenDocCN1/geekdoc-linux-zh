    # Tables


    Tables are probably one of the most widely systems for organizing pictures and
    text. A table is a very efficient tool when used properly but can cause painful
    results if not handled with care. Many programmers actually base their Websites
    on complex tables, which give a consistent look to their pages. Generally speaking,
    table fanatics tend to hate frames (next section) and vice versa. I personally
    think they are both needed. I use tables for the general layout of the site (header,
    menus, body, etc.), and I use tables to organize individual pages. The reason
    for this is, whereas many people have pages that all start with the exact several
    dozen lines only for menus and headings that need to be loaded in every single
    page that is opened, I use a frame that loads only the new content, without necessitating
    reloading of the page''s entire layout. But anyway, let see how to use tables!


    The first thing is to define an area that will be treated as a table. It is very
    important to close it if you wish your page to have the desired look regardless
    of the version of the browser. In the mid-1990s browsers would go crazy when a
    table was not closed properly; nowadays browsers tend to solve the problem and
    output the right aspect. Regarding, make sure that you close the tags! This is
    also important when starting new rows and cells, as we shall. The official HTML
    syntax states that it is not necessary to close a row or cell definition, but
    I would strongly recommend everyone to do so, since it will make tables much easier
    to understand. To create a table, the tag used is <TABLE>...</TABLE>. This tag
    can take, among others, the following parameters:'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# ORGANIZING DATA 37


