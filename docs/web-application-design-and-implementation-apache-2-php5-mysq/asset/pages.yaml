  md: "```\nswitch ($variableToCheck) {\n    case value1:\n        statements\n  \
    \      break;\n    case value2:\n        statements\n        break;\n    default:\n\
    \        statements\n}\n```\n\nThe program will successively compare the $variableToCheck\
    \ with all the different values written next to the case keyword. If a match is\
    \ found, the program will run every instruction placed between the following colon\
    \ symbol (:) and either the first break statement or the closing brace (whichever\
    \ happens first). The case lines are not really considered instructions; you can\
    \ think of them as title labels in in front of the code lines. Therefore you can\
    \ put several cases together, by listing many case value: lines before starting\
    \ to write the code. Note that if you omit the break statements, the program will\
    \ continue to execute the following instructions even if they were meant to be\
    \ for a different case. The default case is run if no matches were found among\
    \ the values. Here is a small example:\n\n```\n<?PHP\n$i = 2;\nwitch ($i) {\n\
    \    case 0:\n    case 1:\n        echo \"i was either 0 or 1\";\n        break;\n\
    \    case 2:\n        echo \"i was equal to 2\";\n        break;\n    case 3:\n\
    \        echo \"i was 3\";\n        break;\n    default:\n        echo \"I don't\
    \ know what i was, because I can't count to more than 3!\";\\}\n```\n\n# Loops\n\
    \nA loop is a way to repeat one or more statements a determined number of times.\
    \ We already saw one type of loop adapted to arrays: the foreach."
