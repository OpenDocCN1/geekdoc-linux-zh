- pgno: 48
  md: '# Lists


    Lists are a tool rarely used by developers on Webpages for reasons I do not fully
    understand. I have often seen students creating paragraphs after starting with
    a number or series of numbers to create a topic list for example, when HTML provides
    the tools to do so automatically.


    There are two main types of lists: ordered and unordered. An ordered list will
    always include the position of the current element in front of the text itself,
    whereas unordered lists pretty much the same as adding bullets in front of the
    text. An unordered list is created with the tag `<OL>...</OL>` and should always
    include TYPE as a parameter, with either of the following values:


    +   - for decimal numbers (1, 2, 3, 4, ...)

    - for lowercase alphabetical characters (a, b, c, d, ...)

    - for uppercase alphabetical characters (A, B, C, D, ...)

    - for lowercase roman numerals (i, ii, iii, iv, vi, ...)

    - for uppercase roman numerals (I, II, III, IV, V, ...)


    Another optional parameter is START, which takes a number that will considered
    the position of the first element in the list. For example, a list defined as
    `<OL TYPE=START=19>...</OL>` would have its elements as XI for the first, XX for
    the second, XXI for the third, and so on.


    Unordered lists are created with `<UL>...</UL>`, and as you probably guessed,
    also require a TYPE parameter that will define the aspect of the bullets:


    +   - disk for a filled-circle

    - square for a square outline

    - circle for a circle outline


    Once you have defined an area to work as a list, you can add a new element by
    starting its line with the tag `<LI>`. Think of this tag as a bullet or number
    that you place in front of text, since it does not need to be closed. Each `<LI>`
    will either add a bullet or put the next number or following the list format used
    in the same list. Then you can use nested lists if you wish to simply using `<UL>...</UL>`
    or `<OL>...</OL>` instead of a new `<LI>` tag. Each new nested list will be automatically
    indented, along with all its contents, keeping the lists clean.'
  merge: -1
  img_proc: true
