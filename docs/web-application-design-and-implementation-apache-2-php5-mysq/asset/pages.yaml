  md: '# 146 USING DATABASES


    The TYPE field at the end is not really necessary, but you should include it to
    force the type of table you are creating. The COMMENT field is just an example
    of how you would insert a comment for a created table.


    If you need to alter an already existing table, you may do it by writing ALTER
    [IGNORE] TABLE table_name alter_specs, [alter_specs2,...].

    The alter_specs can be any of the following:


    +   - ADD COLUMN create_definition [FIRST | AFTER column_name]—used to add a new
    attribute. The create_definition uses the syntax as with the CREATE instruction.

    - ADD PRIMARY KEY (col_name,...)—makes the fields placed between parentheses a
    primary key of the table.

    - ADD UNIQUE (col_name,...)—sets the fields placed between theses as unique.

    - ALTER [COLUMN] col_name [SET DEFAULT default_value | DROP DEFAULT]—used to set
    a default value for a field or to remove the current value.

    - CHANGE [COLUMN] old_name create_definition—replaces the column name with the
    column defined by the create_definition.

    - MODIFY [COLUMN] create_definition—similar to CHANGE but will try to figure out
    the column to be modified through the create_definition.

    - DROP [COLUMN] name—removes an entire column.

    - DROP PRIMARY KEY—sets all primary keys.

    - RENAME [AS] new_name—renames a table.


