    example, a white space is usually represented as %20 in a URL. When URL contains
    those special characters represented as the percentage sign followed by the code
    of the character, we say the URL is encoded. If you want to show the same URL
    with regular characters (e.g., replacing %20 with a white space), you say that
    you are getting the decoded version of the URL. You can switch easily between
    encoded and decoded URLs by using rawurlencode($url) and rawldecode($url). As
    a basic rule, always encode the URLs you are going to insert in an HTML link,
    and always decode the link names you want to show on the actual page. So, for
    example, assuming $url is your URL, you could write the following code (in boldface
    PHP code, the rest is regular HTML):


    ```

    <A HREF="?PHP rawurlencode($url); ?>">?PHP rawldecode($url) ?></A>

    ```


