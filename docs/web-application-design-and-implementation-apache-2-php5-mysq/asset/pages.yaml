  md: '# PHP5 AND OBJECT-ORIENTED PROGRAMMING


    accessible only by writing the name of the class, followed by the scope operator
    and the variable name.


    # CLASS CONSTANTS


    You may define constant values inside classes. Constants are similar to variables,
    but they cannot be modified. Constants do not use the dollar sign in their names,
    and, like static members, they cannot be accessed from an instance of the class.
    You may not store a variable, class member, result of a calculation, or function
    call inside a constant. Constants are useful when there is an important data item
    that you use throughout your code and that does not change. You might wonder,
    why use a constant instead of simply writing its value? Imagine that you are programming
    a page that will handle an array, making sure that you never get more than a specific
    number of elements, say, 100. You could write the number 100 each time you want
    to check the maximum size of the array for comparison, but if in the future you
    wish to upgrade your program to accept 1000 numbers, you will have to go through
    your code and change every single "100" to "1000." Problem might arise if you
    also use "100" for other functions, such as calculating a percentage. By creating
    a constant instead of writing the actual data throughout the code, you allow yourself
    the flexibility needed to upgrade your code by simply changing one value: the
    one written in the constant declaration.


    # CLASS ABSTRACTION


    PHP5 made it possible to create abstract classes. An abstract class is a class
    that cannot be instantiated, and is used mainly for inheritance purposes. Abstract
    classes will usually have abstract methods, which are basically methods that are
    declared but not implemented. If your class contains at least one abstract method,
    you must declare the class as abstract, simply adding the word in front of the
    class name and all abstract methods.


    # OBJECT INTERFACES


    Object interfaces allow you to create code that specifies which methods a class
    must implement, without having to define how these methods are handled. The difference
    between an abstract class and an interface is that abstract classes are used for
    inheritance and can contain both data and methods. Interfaces can only have methods,
    which must be implemented by a class. Interfaces are defined using the interface
    keyword, in the same way as a standard class, but without any of the methods having
    their contents defined. All methods declared in an interface must be public.'
  merge: -1
  img_proc: true
