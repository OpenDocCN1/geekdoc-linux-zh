- pgno: 15
  md: '# # Introduction


    # # Web Application Recipe


    # **OVERVIEW


    You might be wondering why you are reading an "Introduction" chapter and why this
    chapter is called "Web Application Recipe.\ Well, this chapter is your quick guide
    to professional Web application design and implementation. It is in essence a
    summary of the last chapter of the book (Chapter 19), created mainly for people
    with enough experience in Web programming to skip some of the chapters presented.
    This chapter will give you the rundown of the major steps in the lifecycle of
    a Web project, and will refer to the chapters where you find more in-depth information
    on the topics covered. I call it the "recipe" because it gives you the general
    layout of what needs to be done, before getting into the specific details that
    each individual chapter will cover. For a more in-depth guideline with a practical
    example, be sure to read Chapter 19.


    # **PROCEDURE


    # **Step 1—Understanding the Problem and Finding the Solution


    The first step in Web development (and any type of project, to be honest) is to
    understand what the problem is, as well as what input will be used and'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# 2 WEB APPLICATION RECIPE


    # Step 2—Designing the Database


    When creating web applications, chances are your program will need to store data;
    hence the use of databases. Many developers create the database as they implement
    the program, but this can cause serious troubles as they realize well into the
    project that the initial design of the database is flawed and the work needs to
    be redone. This is why you should always start designing the database, keeping
    in mind what the project needs. Chapters 11 and 12 will show you how to design
    and create a database. In a database-driven project the database is the heart
    of the project.


    # Step 3—Major Functionalities


    Once the database is created, it is time to program the major functionalities
    of your application. Many programmers tend to spend a lot of time making sure
    that the pages they create look good, without worrying whether they actually do
    something. Webpage appearance is obviously important, but you will get more out
    of an ugly Web application than a pretty-looking useless page. Most of the work
    needed in this phase will require accessing the database. To find out more about
    how to do so, check Chapter 13. This step is basically programming the brain of
    your application, ensuring that its core runs perfectly well.


    # Step 4—Backside


    Once the core of the project is up and running, you need to implement the back
    end of the project. This is the section of the project that will be used by administrators
    to manage the Website after it has been published, and it is a good idea to have
    it and running before the regular users start meddling with the Web application.
    If you need some information on writing scripts in PHP, check Chapters 5–9.


    # Step 5—Improvements on Functionality


    This is the phase where you start having fun with the project and improve its
    functionalities. It is the opportunity to begin improving the client-side functionalities
    by adding some JavaScript scripts to your pages, such as form'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# PROCEDURE 3


    verifications. Check Chapters 14–18 for more information on how to program in
    JavaScript. Make sure that the improvements you decide to work on are within the
    scope of the project, to avoid what is known as “scope creep” (see Chapter 19).


    # Step 6—Improvements on Looks


    Once your project is working, you may start working on the aesthetics. By using
    style sheets (Chapter 10), and do not hesitate to ask your favorite Web designer
    for help. In case you wonder about the difference between a web developer and
    a Web designer, in essence, a Web designer takes care of the looks (appearance)
    of Websites and Web developers write the scripts that make the pages work. This
    is the step that adds the skin to the project.


    # Step 7—Thorough Testing, Hacking Attempts


    This is probably one of the most important phases in the project. The goal of
    this phase is to ensure that the project is flawless and that you have made hackerproof.
    The best asset in this phase is imagination and a bit of paranoia. Never assume
    that your users will be friendly, using application for what it meant to be. The
    true secret to a hacker-safe program is to think like a hacker. Try to think of
    any security hole that you might not have fixed and fix it! This step is the equivalent
    of getting some immunizations for your project. The more time you spend here,
    the less time you will spend dealing with attacks.


    # Step 8—Presentation


    Assuming that you are not involved, you will need to present your final project
    to your project sponsor. The key here is to be relaxed and confident that your
    project is rock-solid. If you follow the guidelines in this book, this should
    not be a problem. If you are presenting to a nontechnical person, start by showing
    the general features of the project, getting into details only when asked to do.
    If you are presenting to a fellow developer, go straight to the functionalities.


    # Step 9—Publication


    When the project has been approved, it is time to release it. Place it in your
    desired host and make sure that everything is set up properly so users worldwide
    can access it. This phase should be fairly fast.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Step 10—Celebration (and Maintenance)


    Once the project is published, this is your chance for a small break. Enjoy your
    favorite brew, have a good night’s sleep, and get back to work! Once a project
    is published, you need to maintain it, updating the database as needed or fixing
    bugs that users might have found.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# 1


    # Fundamentals


    # THE ORIGINS OF THE INTERNET


    Not long long ago, in a galaxy pretty close by, men and women used to live without
    practical means of communication. Paper was the main medium used for information
    sharing and horses the main carrier for that medium. But science kept working,
    and in 1831 Joseph Henry Morse invented the first electric telegraph. Four years
    later, Samuel Morse invented the Morse code, and worked on the very first long-distance
    electric telegraph line, which finished in 1843. A bigger leap in communication
    progress was made by Alexander Graham Bell, who patented the electric telephone
    in 1876. Long-distance communication was finally a reality, but still archaic
    compared to what was be achieved. With the arrival of computers in the midtwentieth
    century, people realized the potential of storing and processing data in those
    amazing machines. Furthermore, the United States and the Soviet Union were deep
    in the Cold War, and the fear of a possible strike was constantly present in the
    military''s mind. One of the main concerns was the possibility that all communication
    between remote locations could be interrupted by an attack. Telephone and telegraph
    lines were out in the open, and could be easily damaged, so the National Security
    Agency (NSA) thought of a way to preserve communications. Emulating the principles
    of telephone communication, in the 1960s, the NSA thought of connecting computers
    through


