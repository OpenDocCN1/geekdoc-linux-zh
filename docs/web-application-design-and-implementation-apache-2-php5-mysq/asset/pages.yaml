  md: '# HOW DOES HTML WORK?


    # Syntax Basics


    HTML is a markup language and, as such, works entirely through the use of tags.
    Each tag is used to define different parts of the file, different styles, links,
    images, embedded elements, forms, and so on. Each tag starts with the character
    "<" and finishes with ">". Keep this in mind because these characters are restricted
    for tags, meaning that your page might behave in a strange way if you attempt
    to use it in a normal string. If you refer to the special characters table shown
    in Appendix A. Now, some tags require an opening and a closing tag in order to
    show the area of the effect of. In those cases the closing tag will always start
    with "</", followed by the name of the tag it is calling (without the attributes
    list) and "".


    For example, to have some attribute color set to "white", you would use the FONT
    tag, To do so, your opening tag would be <FONT color="white"> and your closing
    tag would be </FONT>. Your final portion of code would look like this:


    ```

    <FONT color="white">This text will show up in white</FONT>

    ```


    Note that HTML is not case-sensitive, so you can mix uppercase and lower-case
    letters. Nevertheless, I strongly advise everyone to capitalize all tags since
    it makes code reading much easier.


    Finally, remember to name your files with either .html or .htm as extension.


    # File Structure


    It is very important to understand the basic structure of an HTML file, knowing
    exactly where each part of your code must be written in. It is something easy
    to remember, but unfortunately there are still people who claim to be Web programmers
    but misuse the file''s main areas. Web design and programming demand efficiency
    and effective use of the available tools. This book is designed to avoid these
    pitfalls.


    The first thing is the full file, which must always start with the tag <HTML>
    and finish with </HTML>. You should never have HTML tags before the opening tag,
    nor after the closing one. One of the reasons for this occasional error is that
    the most browsers can now ignore errors like this and still manage to create a
    proper-looking output, but please always start your files by setting up these
    two tags.


    The next section to know is the header, limited by the tags <HEAD> and </HEAD>.
    This section holds all information related to the file, including its author,
    its keywords, and sometimes some JavaScript functions that will be used in the
    page. Most basic pages use the header only to specify'
  merge: -1
  img_proc: true
