- pgno: 129
  md: '# Sessions


    One of the most efficient and easy ways of transferring information between pages
    without the user''s knowledge is to use sessions. Sessions can be imagined as
    a "magic cloud" that contains all the variables that we need to hold. The session
    can be accessed from any PHP script, which can either add more data or read data
    from the session. The session information is saved in the server computer either
    on text files (that''s the standard behavior) or on the Web server''s process
    memory. This session much more flexible than cookies to store data, as the only
    limit is the size of the server''s drive.


    When a user accesses a page that uses sessions, a unique session identifier is
    randomly generated and encrypted. This session id is usually stored in the client''s
    computer as a cookie, although you do not need to manually create the cookie,
    as the session initialization will do for you. If the browser that the client
    is using does not accept cookies from your domain, you can still transmit the
    session identifier between pages with the GET or POST method.


    The default session configuration should be good enough for the scope of this
    book, but there are some settings you can change in your php.ini file (each element
    will be written as a `setting=default_value`, followed by an explanation of what
    it does):


    +   * `session.handler = files`—line specifies the way in which the session information
    will be stored in the server. Other possible values are "mm" for memory, or "user"
    if you want to manually configure the saving process.

    * `session.path = C:\PHP\sessiondata`—folder in which the session data will be
    stored.

    * `session.use_cookies = 1`—use cookies? 1 for yes, 0 for no.

    * `session.name = PHPSESSID`—name provided for the session.

    * `session.auto_start = 0`—strongly recommend leaving this as 0. You may write
    1 if you want a session to start automatically in every single PHP script that
    you write.


    To use session in PHP, you first need to start the session with `session_start()`.
    If no session was yet created for the user, a session will be created. If a session
    already existed for the user, starting the session will allow you to access the
    existing session. Remember that you must use `session_start()` if you are planning
    on using sessions, or the session data will not be accessible. If you want to
    destroy a session, use `session_destroy()` to no longer access the session data
    any longer. This function is usually one of the last steps of a logout procedure.
    When a session is started, you may check the name and id of the session with the
    functions `session_name()` and `session_id()`, respectively.


    ![](img/6573b0a7bed590e34e9cfe58e6fc8c60_129_0.png)'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'In order to use the session, use the array $_SESSION. For example, if you want
    to create a session variable "username" with the value "Bewuchy", you simply need
    to write


    $_SESSION["username"] = "Bewuchy";


    The $_SESSION array works pretty the same way as $_GET, $_POST, $_SERVER and $_COOKIE.
    Therefore it is possible to check whether a session variable exists by simply
    isset($_SESSION["varname"]). You may also delete a session variable by unset.
    Also, since it is an array, you can use foreach to retrieve all the data in a
    session.

    The following example is a series of three files. The first one will create a
    session and store data in it; the second file will check whether the session exists
    and what data stored in it; the third file will be a logout procedure that will
    destroy the session. To navigate between the pages, we will add some HTML links:


    ```

    <HTML><TITLE>File 1</TITLE>

