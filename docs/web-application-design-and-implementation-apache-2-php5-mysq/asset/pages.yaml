  md: '# 248 APPENDIX C


    and select the group in phpBB add a member. Click on “View information,” which
    will bring the list of all users of the group. Under the list you have a text
    area in which you can enter a member name; do so and click “Add member” to add
    the user to the group.


    To change the forum access rights of a group, click on “Permissions” or “Group
    Admin” in the administrator page. Choosing a group will show all the forums in
    your database. In each you will see a “Moderator status” dropdown menu that will
    allow you to make (or not make) the group moderators of a specific forum. In any
    forum that has one of its rights set to PRIVATE, you will have another option
    “Allowed Access,” which will decide whether the group is part of the “private”
    group of the forum. If you want to set up the same kind of rights for a specific
    user, click on “Permissions” or “User Admin.”


    There is a feature in phpBB that most users look forward to, and click “ranks.”
    A rank represents your notoriety in the forums and can be special or post-counted.
    Click on “Ranks” under “User Admin” to access the list of ranks. To add a new
    rank, click on “Add New Rank” and fill the form with information: Rank Title is
    the title that will appear under the user’s name to show that person’s rank. Special
    rank (yes or no) distinguishes between fixed ranks (e.g., “moderator., “admin.,
    “ruler of the world”) and ranks based on the number of posts. Minimum posts are
    used for nonspecial ranks, and signify the number of posts needed to reach the
    rank. For example, the Rank image should be “5stars.gif” as an image path, assuming
    that it is inside an “images” folder on the root, you would write ../images/5stars.gif.
    Rank images should be fairly simple. Usually they are stars or other symbols associated
    with the forum’s theme. Don’t be afraid to create outrageous ranks needing thousands
    of messages, since as if your forums become popular enough, you might have people
    with those numbers. For example, in the forums I use for my courses, I use the
    following ranks: n00b (0 posts), Visitor (10 posts), Frequent Visitor (25 posts),
    Known Face (50 posts), and Friendly Face (100 posts). I could have pushed it further
    with like “Friend” (250 posts), “Family” (500 posts), “Are you stalking me?” (1000
    posts), and “Get a life!” (2500 posts). Be original with the names, and lots of
    people will look forward to what their next rank will be (as ad it may so said).


    Another important thing to know how to use in phpBB is how to moderate forums.
    When you are an administrator or moderator of a specific board, you will have
    a link to the bottom right when you visit a forum that reads “Moderate this forum.”
    Clicking it will show the list of topics in the forum with a checkbox at the end
    of each name. Selecting one or more topics and using one of the four buttons will
    allow you to moderate entries. The options are “Delete,” to delete the entire
    topic along with all its replies; “Move,” to move the topic to a different forum
    (in which case you may leave a “shadow” of the topic, basically the name will
    appear but will link to the'
