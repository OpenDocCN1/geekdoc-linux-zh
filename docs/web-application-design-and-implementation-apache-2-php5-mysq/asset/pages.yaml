- pgno: 200
  md: '# 194 PROGRAMMING THE BROWSER


    extremely useful on forms as you can verify the contents of the form before submitting
    it and let the users know any errors so that they can correct them before sending
    the data through the form. To do this, you would simply have an onClick on your
    "submit" button that would call the method that will verify all data, returning
    false if a problem was encountered.


    Two methods are very useful on forms containing text areas. Ideally, when you
    are writing a form, you should include some JavaScript to verify the form before
    sending any data to your PHP scripts. This allows a first layer of data verification
    done on the client, which is much faster than transmitting the data to a PHP script;
    the PHP script will verify the data; and redirect the client to the first page
    if an error is found. Verifications done in JavaScript allow you to avoid, for
    example, you avoid the burden of constant back and forth with the server. A typical
    problem that can be found in forms is bad type of data input in a textbox; for
    example, you may be expecting an email address and the user leaves the field entry,
    or inputs a text that is not an address. In cases you want to inform the user
    of the error and to change the data. In cases you can call the methods focus()
    and select(), to place the user in the field that needs changing. These methods
    should be called from a form element object; an example be document.myForm.input.focus().
    The method focus() will give to the entry, and the method select() allows you
    to select the entire text that was entered. When a field needs to be changed,
    there is nothing better than to do a focus() of the problematic field, followed
    by select(). This way the user needs to enter the new data, automatically overwriting
    the previous text.


    One last useful point is to realize that any of the objects accessed through the
    document can be stored in variables to decide up the typing. For example, you
    could


    ```

    var myButton = document.myForm.button;

    ```


    Then on, you would be able to access your button simply typing myButton.


    # TIMERS


    JavaScript has the ability to create two main types of timers: one-shot timers
    and regular timers, called "intervals". One-shot timer allows you to decide on
    a specific amount of milliseconds to wait before a function is called. Using the
    function setTimeout, for example, you could do


    ```

    var timerID = setTimeout("myFunction()", 5000);

    ```


    This would create a timer that will wait 5 seconds before calling myFunction().
    The returned ID is very important as it will be needed if you want to stop the
    timer. Simply use clearTimeout(timerID) to stop the timeout.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'Regular timers are like timeouts, except that they restart the timer after
    each timeout. The function used in that case is setInterval(''functionName'',
    time); for example


    ```

    var timerID = setInterval(''alert(''Hello''), 5000);

    ```


    This would run the alert(''Hello'') every 5 seconds. With timeouts, you can clear
    the interval by doing clearInterval(timerID).


    # TIME TO PRACTICE!


    Now that you know the basics of event programming, try writing a script containing
    a button that keeps track of how many times it has been clicked. Realize that
    variables defined outside a function are considered global. They are accessible
    inside any function, so you can use that fact to your advantage. Also remember
    that the text on a button is by its attribute value.


    Another thing to do is an event log. Create a form with different types of inputs,
    such as radio buttons, regular buttons, and password fields, and text areas. Now
    make sure that you have at least one large text area that you will use to keep
    track of all the events you want to test out, and have each event display the
    latest event at the end of the large text area. Remember that you can access the
    contents of a text area through the value field of the tag, and also that you
    can concatenate text using the plus (+) sign. Also, if you wish to include a ''clear''
    button, you can either include a ''reset'' button or create a regular button with
    an event that will write an empty string (''"''\'') in the value field of your
    text area by doing


    ```

    document.myForm.textArea1 = "";

    ```


    Finally, use intervals or timeouts to create a banner changer. Have a set of images
    with their URLs stored in an array, and set a timer that will change the image
    every few seconds.'
  merge: -1
  img_proc: true
