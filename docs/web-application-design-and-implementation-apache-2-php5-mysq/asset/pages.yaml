  md: '# String Manipulations Revisited


    # OVERVIEW


    We have seen the basics of string manipulations, with methods such as charAt(),
    charCodeAt(), indexOf(), lastIndexOf(), substring(), toUpperCase(), toLowerCase(),
    or even the attribute length to determine the size of a string. It is now time
    to take string manipulations a step further, see more useful methods, and study
    regular expressions. We will finish this chapter talking about the use of regular
    expressions in PHP, but for now let us talk about JavaScript.


    # NEW BASIC STRING METHODS


    Back in Chapter 14, we saw that arrays have a method join that allowed the creation
    of a string from a set of array elements. This was the same as a PHP implode.
    You might be wondering whether there is an equivalent to PHP''s explode in JavaScript,
