    # Manipulating HTML Files


    Since PHP was built for the Internet, it contains many useful functions to manipulate
    Webpages. Some of them assume that you have opened an HTML file and saved its
    contents in a string, whereas others just accept the URL of the page to process
    as a parameter. To distinguish those cases, let us use $str as a parameter in
    the first case and $url in the source.


    The first method is a very useful one that allows retrieval of the META tags.
    A META tag is an HTML tag with two parameters called "name" and "content" that
    describe anything related to the page. They are usually found in the HEAD section
    of the page. The name attribute informs of the data being stored, and the content
    attribute holds anything that describes that name. Online searchers like AltaVista
    rely strongly on the META tags, most specifically the "keywords" META tag. Here
    is a basic example of what a META tags block could look like:


    ```

    <META name="description" content="This is a silly example, but who cares">

    <META name="author" content="Steven A. Gabarró">

    <META name="keywords" content="test page, silly, example, PHP, HTML">

    <META name="generator" content="Notepad">

    ```


    PHP provides a very useful method to retrieve all the META information as an array
    get_meta_tags($url). The returned array is an associative array holding the name
    of the META tag as a key and the content as the element. If we were to call this
    function on a file containing the previous example of META tags, our array would
    be as follows:


    ```

    $arr[''description''] = "This is a silly page, but who cares"

    $arr[''author''] = "Steven A. Gabarró"

    $arr[''keywords''] = "test page, silly, example, PHP, HTML"

    $arr[''generator''] = "Notepad";

    ```


