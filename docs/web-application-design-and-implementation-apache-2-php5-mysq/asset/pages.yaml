- pgno: 30
  md: '# 2


    # The Different Approaches of Web Programming


    # BEFORE WE GET STARTED


    Before I head on and start explaining the different languages available in the
    Web programming market, let me stress that all the opinions stated are exclusively
    my personal views. I tend to be very opinionated, but I will try to justify both
    my criticism and praises of the different languages presented.


    # THE BASICS—HTML


    The very first programming language that must be mentioned when discussing Web
    programming is obviously HTML. The WWW could not be what it is today if it weren''t
    for it. The HTML (HyperText Markup Language), as the name indicates, a “markup”
    language, which generally means that it is based on the use of tags to provide
    functionality. The “code” in an HTML file is simply text containing tags that
    provide functionality and different looks to the page. It is an interpreted client-side
    language, meaning that for an HTML page to be viewed, a browser must first download
    it from a server to a client and execute the code by line.


    HTML relies strongly on the use of Universal Resource Identifiers (URI). Each
    URI represents a way to refer to a page, an image, or even email'
  merge: -1
  img_proc: true
- pgno: 31
  md: "The location of a page is a URI commonly called URL (Universal Resource Location).\
    \ For example, an email address URI would look like mailto:mynamemydomain.com,\
    \ a normal URL could be http://www.mydomain.com/folder/mypage.html#section2. Usually\
    \ a URL can be of two types: absolute or relative. An absolute URL is basically\
    \ a URL that includes the information on the path of a file or folder, like domain,\
    \ subdomain, file, section... A relative URL is one in which you can not see the\
    \ entire path of the file, but how to reach it from the current working directory.\
    \ For example, if you were viewing the page \"foobar.html\", the image mypic.jpg\
    \ could be accessed by using either http://www.mydomain.com/images/mypic.jpg (absolute\
    \ URL) or ../images/mypic.jpg (URL relative to the foobar.html folder):\n\n```\n\
    mydomain.com (/\nimages\nmypic.jpg\nmytherpic.jpg\nfiles foobar.html\n  otherfile.html\n\
    \  yetanotherfile.html\n```\n\nAs you noticed, relative paths usually start with\
    \ \"../\", which means \"go to parent directory\" or \"/\", which means \"current\
    \ directory\". Relative paths are an easy way to make a Website more portable\
    \ since they are independent of the domain where the pages are in. It is especially\
    \ useful if, like me, you test all your pages in a local computer before uploading\
    \ the files to your host.\n\nThe use of URIs is pretty much a necessity in HTML\
    \ because they allow you to embed images to a page, send information from a form\
    \ to a processing script, create an image map, link to an external style, create\
    \ frame documents, create an external reference, or also refer to metadata conventions\
    \ to describe the page.\n\n# THE CREATOR–SGML\n\nSGML, or Standard Generalized\
    \ Markup Language, is a system for defining markup languages, like HTML. It is\
    \ a descendant of IBM’s Generalized Markup Language (GML) developed in the 1960s.\
    \ It relies strongly on the use of DTDs (Document Type Definitions) to define\
    \ the syntax of markup constructs. SGML is not really used on the Web in its full\
    \ version, but smaller subsets of SGML are becoming increasingly prevalent in\
    \ many information exchange standards."
  merge: -1
  img_proc: true
- pgno: 32
  md: '# OTHER SGML-BASED LANGUAGES—XML AND XSL


