  md: '# JavaScript—A Client-Side Scripting Language


    # INTRODUCTION


    Remember that JavaScript is a Web programming language that runs client-side.
    It runs on almost any browser, although different browsers will run slightly different
    versions of JavaScript. This is important to realize, as some instructions that
    work on MS Internet Explorer might not work on Mozilla Firefox or Netscape Navigator
    and vice versa. The reason for this is the lack of a single organization deciding
    on what real standard, and what JavaScript should handle or not (as opposed to
    HTML''s W3C). My recommendation, when writing in JavaScript, is to check the browser
    version and to always test your script on the most popular browsers out. If you
    do not wish to make your scripts compatible with different browsers (which usually
    takes a longer time to write), you should at least test the version of the browser
    and give a users warning, letting them know that the scripts might not work.


    Other than to test your scripts, you need only a basic editor to write the scripts.
    You do not even need a Web server, since double-clicking on your HTML files containing
    JavaScript will be good enough to see if they work.


    JavaScript code is usually embedded in the middle of HTML pages. To start a block
    of JavaScript, write <SCRIPT LANGUAGE = "JavaScript"> and finish the block with
    </SCRIPT>. The SCRIPT tags in this case act like


