  md: '# # Back up and clone your Raspberry Pi TUTORIALS


    With the SD card inserted in your desktop, open the terminal, and enter the following:
    Identify the SD card and give it a name of yours. This can be tricky, but if it
    is obvious from the size of the SD card, it will be called as sd or sdb by a number.


    ```

    ``` fblk -l ```

    ```


    Next, use the `dd` command to create a clone. You may not get every file you like,
    but it will have the img extension:


    ```

    ``` dd if=/dev/sdb of=~/raspberrypi.img ```

    ```


    Wait as the process to complete. When you''re ready to write the image to a new
    SD card, insert and after the following: You might also use the Raspberry Pi Imager,
    the mouse-driven Raspberry Pi disk imaging software available at http://www.raspberrypi.com/software/
    for Ubuntu, macOS and Windows. After installing, click Choose OS, then scroll
    to Custom and Browse for your image, Select it and finish writing to a fresh SD
    card.


    ```

    ``` sudo dd if=~/raspberrypi.img of=/dev/sd bs=4 ```

    ```


    ![](img/b85dcb824b0e90e3053692968652e94b_114_0.png)


    # ## Clone your Home


    For a simpler approach that''s less-intensive, archive the Raspberry Pi Home.
    This method allows you to browse and restore directories and files to a remapped
    Raspberry Pi and when needed. Open a terminal and:


    ```

    ``` cd ~/home ```

    ```


    With the created archive, copy `pi.home.tar.gz` to another location for safety.
    The next time you need to reimage an SD card, done simply unzip the `/home` directory
    and copy the files you need


    # ## Network backup


    If you prefer using the Raspberry Pi remotely via SSH, then it will be possible
    to back up your data over the network. This isn''t ideal for backing up the entire
    SD card, as files that are in use while the Raspberry Pi is running will create
    a disk image that may be corrupt. The best approach is to back up only the data
    you deem vital, such as the home directory.


    Beginning with an SSH session and connecting to the Raspberry Pi: Then enter the:


    ```

    ``` ssh pi@[ADDRESS] sudo dd if=/dev/sdb of=/home/pi/[BACKUP_NAME].gz ```

    ```


    Wait while the backup completes. Close the connection. The Raspberry Pi can be
    restored without any part wrong. To restore the disk image, you would need to
    insert the SD card into your computer''s card reader and then use dd


    ```

    ``` dd if=~/Desktop/[BACKUP_NAME].img of=/dev/sd bs=4M status=rsync ```

    ```


    Backups using SSH will save time and wear on the Pi''s SD card. It''s also a useful
    option if you run multiple Raspberry Pis.


    # ## When in clone...


    Backing up your Pi files through cloning can take a quick bit of disk space, especially
    if you''re using large disk images. If the image is not the same size as the disks,
    then the data will be lost. So SD card would be backed up as a large disk file.
    If the files can be compressed, you may need to pipe the output out to a compressed
    gzip file:


    ```

    ``` gunzip -atst raspberry_pi.clone.img | sudo dd of=/dev/sdb bs=4M status=progress
    to restore ```

    ```


    The compressed file is smaller and using this will take up less space on your
    HDD. This, means you can make more backups.


    # >> BACK UP THE CONFIG FILE


    If your Raspberry Pi is setup unusual, perhaps for the hardware you''ve connected
    to, but you don''t need to regularly back up, there is an alternative. Instead
    of backing up the entire SD card, or even the config-directory, why not just make
    a copy of config.txt? In a system of BIOS OS, config.txt stores various system
    parameters for the correct running of the Raspberry Pi. The Pi configuration is
    read by the system as the GPU device during boot.


    While the Raspberry Pi is running, config.txt can only be edited if you use the
    /boot directory /config.txt. With many systems, using a standard text editor will
    be enabled in config.txt. This allows the use of options for various Pi properties,
    from RAM to camera settings, display options, overclocks and much. For example,
    a Raspberry Pi with Zero setup, you would need to make the changes to the options
    in config.txt. By backing up the file after the changes are saved, you can save
    some time after restauration by simply replacing the config.txt.


