    # # Create, edit and use

    # custom mapping data


    If you like Google Maps you love QGIS. Mike Bedford shows you how to get started
    and introduces some of its functionality.


    Back in 1962, archaeologists in the Czech Republic discovered a mammoth''s tusk
    that had been engraved with a geometrical design. The pattern was systematically
    identified as representing an area. The hills, rivers, valleys and routes of the
    surrounding area were dated around 250,000 BC, making it perhaps the earliest
    map ever discovered.


    ![](img/b85dcb824b0e90e3053692968652e94b_49_1.png)


    In the Library of Hereford Cathedral is the Mappa Mundi. Created around 1300,
    the UK''s Ordnance Survey arose in 1791 to handle the perceived risk arising from
    France, the Jacobite rising, and went on to become one of the world''s foremost
    national mapping agencies. In 1999 California-based ESRI released its ArcGIS graphical
    interface for non-professionals.

    Mike Bedford is a big fan of QGIS: he admits still loving old-fashioned OS maps
    while he''s walking on the hills.


    From street maps to topographic maps to imagery, number of options are available
    as base maps.


    ESRI''s well ArcGIS isn''t cheap at £1,192 per year, including VAT, for professional
    use. This reduces to £139 for non-commercial use, but that''s still a bit much
