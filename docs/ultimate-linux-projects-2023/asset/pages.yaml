    # Image recognition


    Get into machine learning and train your Pi to classify and other Pis, without
    having to write a single line of code.


    We''re going to train our Raspberry Pi to identify Raspberry Pis (or other objects)
    with machine learning (ML). Is this important? An example of an application for
    this type of ML is detecting defects in circuit boards. As circuit boards exit
    the assembly line, a machine can then be performed to identify a defective circuit
    for troubleshooting needs.


    +   YOU NEED

    * Raspberry Pi 3, 400

    * 8GB (or larger) microSD card

    * Raspberry Pi Camera or a USB webcam

    * Power supply for your Raspberry Pi

    * Smartphone for taking photos

    * Selection of Pis or other objects for classification


    Tom has some native machine learning and artificial intelligence tools recognition
    and face detection. In those projects, all the training images were stored locally
    on the Raspberry Pi and the model was also performed on the Pi. In this tutorial,
    we''ll use a web platform called Edge Impulse to create and train our model to
    allow a few cycles from our Pi. Another advantage of Edge Impulse is the ease
    of updating images from a smartphone (without having to involve an app).


    We''ll use BaselineCloud instead of Raspberry Pi since some folks at Balena provide
    an API to call Edge Impulse. This eliminates all terminal commands and instead
    an intuitive GUI.


