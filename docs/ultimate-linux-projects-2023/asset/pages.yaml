    # # How to run classic distros with QEMU


    Where we''re going doesn''t need roads, needs QEMU and a bunch of retro Linux
    ISOs, reveals Les Pounder.


    ![](img/b85dcb824b0e90e3053692968652e94b_57_0.png)


    The Les Pounder is associate editor at tom''s Hardware and a freelancer for hire.
    He blogs about his projects at big.it.


    Back in the late 1990s, this author chose their PC magazines by what was on the
    cover, something that had started back in their Amiga days. One month, they chose
    a PC magazine that had something called Red Hat Linux on the cover which was shortly
    installed on an AMD KG-2 333MHz PC. It''s fair to say that I didn''t love it at
    sight. The sheer volume of option choices, the differing commands and file system
    choices for Windows 98. A few months later and another cover, this time it was
    something different. It was still Linux, Core Linux 1.0 was a little more ''friendly''.
    The install went well and this was this author''s first for some time.


    In the 1990s, Linux was in its infancy and the jump from Windows to Linux seemed
    magical and exciting. How can we experience these those days again? In the absence
    of a guest machine, can we use virtual machines to help install Linux on a virtual
    PC?


    We''ve chosen three Linux distros from the past three decades and three machines
    we will install and use each. Each starts from the 1990s, 2000s and 2010s to show
    the similarities, and differences between Debian, Ubuntu and Linux Mint.


    # ## How To Install QEMU


    QEMU is a open-source machine emulator and virtualizer. In other words, we can
    use it to run many different CPUs and create virtual machines. To install QEMU
    we need to open a terminal and use the package manager (in our Kernel Linux 2.1.04
    or that) to install QEMU, and its dependencies.


    Why are we not using KVM? It''s because even by using QEMU and having a CPU that
    supports VT-x or AMD V we can speed up the virtualization to near native speeds.
    Modern processors have some features that support virtualization; our machine
    is an i700 from 2012 and it supports VT-x.


    To check if your Intel or AMD CPU supports the features, open a terminal and type
    the following:




    ```

    grep -vmx /proc/cpuinfo

    sudo apt update

    sudo apt install qemu-kvm libvirt-daemon-system libvirt-clients

    sudo apt install virt-manager

    ```


    When managing machines is a system is easier, we''ll install a GUI for our virtual
    machines.


    We need to reboot our machines for the changes to take effect. If we skip this
    then the GUI will be unable to connect to QEMU.


    +   QUICK TIP

    Want to share a USB device with your virtual machine? You can do that using the
    Red Hat Virtual Device method.

    Handily by using USB drives with your virtual machine.


