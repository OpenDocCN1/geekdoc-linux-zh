    # MAKING OF THRESHOLD SCRIPTS


    In the s-tui config file, the `~/.config/s-tui/config` also contains a directory
    called hooks. You can place scripts here which you want to check when a certain
    threshold, such as CPU frequency or temperature is exceeded.


    The name of the script must be `<name>.source` where `<name>` is the name of the
    source source. You can use S-TUI to track running scripts based on CPU temperature
    setting setting.


    The default threshold value for the CPU temperature is 80. This can change


    value, in the s-tui config, `s-tui threshold <value>`. You can then save the new
    threshold by saving the settings from `~/.config/s-tui/s-tui` from S-TUI itself.


