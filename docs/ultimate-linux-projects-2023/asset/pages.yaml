  md: '# Ultimate Linux Projects


    # # Multi-room Pi audio


    Get your Raspberry Pi in sync, throughout your home.


    ![](img/b85dcb824b0e90e3053692968652e94b_103_0.png)


    multi-room audio systems can cost a pretty penny, but who needs to buy an expensive
    set of speakers when you want to achieve the same effect? We''ll use our Raspberry
    Pi and 3.5mm wired speakers/speakers (with 3.5mm audio inputs) to play music from
    a streaming service in sync via Bluetooth from your phone, tablet or computer.
    We will show you how to do this with a single speaker and Raspberry Pi and then
    replace it in others. This is an excellent project for reusing equipment. If you
    have a non-Bluetooth receiver with a jack input, connect your speakers to the
    receiver and receiver to your Raspberry Pi.


    Instead of Raspberry OS, we''ll use BalenaOS to make the Bluetooth OS stable (to
    our other devices) and enable the network for a monitor, keyboard and mouse for
    your Raspberry Pi. Create a free BalenaCloud account at https://balena.io/sign-up/
    and follow the BalenaSound application page at https://sound.balena.io/docs/getting-started.
    You must also be logged into your Balena account for that to work. Click to Application
    and select devices from the left column


    # ### YOU NEED


    +   - Raspberry Pi 4 or Pi 400 (one unit per room)

    - 8GB (or larger) microSD card, U3 cards recommended. One room

    - 3.5 mm audio cables

    - Amplified speakers or a receiver with 3.5mm/phone audio input

    - Power supplies for your Raspberry Pi

    - Smartphone or tablet


    # ### Connect and update


    Remove the microSD card from your computer and insert into your Raspberry Pi.
    Connect the speaker to the Pi via the 3.5 mm jack. Power up your Pi. Wait about
    15 minutes for your Pi to boot and BalenaOS to update. Only the first boot takes
    long. You can check the status of your Pi Balena Sound in your Balena dashboard.
    For Raspberry Pi 400, connect a USB speaker instead of the 3.5mm jack. Wait for
    your Raspberry Pi BalenaSound to update and confirm all systems are running.


    From the BalenaSound table, navigate to your Bluetooth settings and pair it to
    your device. Connect the device to the sound output for your speaker, tablet or
    computer. By going to your service and play a song. The music should stream via
    Bluetooth to your Raspberry Pi and by the attached speaker.


    ![](img/b85dcb824b0e90e3053692968652e94b_103_1.png)


    #  MULTI-DEVICE/MULTI-ROOM SYNC


    For multi-device setup, repeat the stages described above for each extra device.
    You can flash the same image from each using the mentioned method on Raspberry
    Pi. With the same Bluetooth device name music can now stream to all Raspberry
    Pis and their connected speakers. You will only need to connect one Pi via Bluetooth
