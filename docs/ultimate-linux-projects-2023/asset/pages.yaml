    # # Gaming on RetroPie


    Turn your Raspberry Pi 4 (or Zero) into a retro gaming rig with RetroPie and dubious
    internet downloads.


    Back in the 1980s and 1990s, the arcade were the place to be. The latest video
    games ten-pence coins as we fought for high score. Sega, Nintendo and many more
    are now behind us, but retro gaming has seen massive growth in the past decade.


    Using a Raspberry Pi, you can run a variety of emulators that allow you to not
    only old arcade games, but also your favourite titles from old consoles, including
    the Atari 2600, Nintendo 64, Sega Mega Drive and Game Boy. There are


    grab the latest image from https://retropie.org.uk/ and download using Etcher.
    There are separate options for first-gen devices (the original Raspberry Pi and
    Pi Zero), micro-devices (the Pi 2 and 3) and the latest Pi 4 or 400 models. Each
    microSD card you insert into your Raspberry Pi needs a controller. Xbox One and
    PlayStation 4 are compatible with RetroPie via Bluetooth, but require a USB connection
    until configured.


    Connecting to the Raspberry Pi requires a controller. Configure your controller.
    Note that you will have fewer buttons on your controller than you could. Just
    hold down the button you want until any options appear. Press the A button on
    your controller to configure the configurations menu and open the main menu.


    # ## TUCK A SLICE OF RETROPIE


    > “Using a Raspberry Pi, you can run a variety of emulators that enable you to
    play arcade and console games”


    a number of platforms available, but RetroPie is the most popular and widely used.


    Up recently, installing RetroPie on a Raspberry Pi 4 was a big undertaking. Even
    though it came out in June 2019, it wasn''t officially supported for really and
    there were several manual steps needed to make it work. Now, not only can you
    install RetroPie on a Raspberry Pi 4, but you can do it using the Raspberry Pi
    imager. It''s easier now.


    ### Adding Games to RetroPie

    All the games are called ROMs, which are digital files of the games you have copied
    from your real hardwares or consoles. The easiest method is to use a USB stick
    to transfer the files from your computer to your Raspberry Pi. It''s important
    to note that you should only copy games that you personally own and/rip a copy
    of your own. Downloading and distributing these may violate laws in your country,
    so proceed at your own risk.


    To add games, you need to create a FAT32-formatted flash drive. The Raspberry
    Pi 4 and Zero will create a folder structure /retropie/ on the drive. Then move
    the flash drive to your computer. Copy the correct system or console folder into
    /retropie/. For example, put Atari 2600 games in the /2600/ folder. Then insert
    the drive back into your Raspberry Pi 4. How long this takes will depend on how
    many games are transferred: a matter of minutes, or hours if transferring a large
    number.


    Remove the drive and restart your Pi. From the start menu, select EmulationStation/Restart
    System. The games lists will update now and show the available consoles/emulators
    for now games when it comes to playing retro arcade from actual arcade machines,
    but not ROMs are compatible with all emulators. RetroPie can run with different
    versions of Arcade Machine (the most popular arcade emulator), and some ROMs will
    work on VAME but not on others. RetroPie maintains a handy shortcut over at https://retropie.org/doc/MAME/,
    but if your arcade games don''t load in MAME...


    # >> TO THE PICADE


    A Pimonico arcade cabinet has a history long ago. Coming as a laser-cut self-assembly
    kit in eight- or ten-inch sizes, you can build and integrate a Raspberry Pi into
    it, but for best results you''ll want a Raspberry Pi 4. Because you use some arcade
    components, it can be customised to your playing style and aesthetics. If you
    like, you can change it so you can easily swap the deck in your favourite game.
    The Picade X HAT attaches to the GPIO of your Raspberry Pi and provides connections
