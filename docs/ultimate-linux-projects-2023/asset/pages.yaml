  md: '# Connect, configure and use gamepads TUTORIAL


    disable ERTM (Enhanced Re-Transmission Mode), which enables bluetooth syncing
    between the Xbox controller and your Raspberry Pi.


    ```

    echo ''options bluetooth disable, ertm=Y'' | sudo tee -a /etc/modprobe.d/bluetooth.conf

    ```


    Follow this by rebooting the Raspberry Pi.


    ```

    sudo reboot

    ```


    # Start Bluetooth tools


    At the `bluetoothctl` prompt, enable the agent and set it as default:


    ```

    agent on

    default-agent

    ```


    Next up your Xbox controller and hold the sync button:


    ```

    scan

    ```


    to search for the MAC address, appearing as pairs of numbers and letters. Use
    the MAC address to connect via "Wireless Controller". Use the MAC address to connect
    your gamepad:


    ```

    connect [YOUR MAC ADDRESS]

    ```


    When you see "connected" you are ready to play. To avoid connecting the controller
    every time:


    ```

    trust [YOUR MAC ADDRESS]

    ```


    But if you want to use a PS4 controller with Raspberry Pi? The steps described
    above are for the Xbox controller, and you can connect via USB or Bluetooth.


    # Using older or different controllers


    If you don''t have any controllers (or need to buy them because they can be pricey
    these days), it might be easier to get a controller from an older generation of
    consoles, such as the Xbox 360 or PlayStation 3.


    Connecting an Xbox 360 controller requires an adapter. While the model should
    work out of the box, the model will require a dedicated wireless receiver.


    The Xbox 360 controller is simple to sync with Raspberry Pi, but connecting a
    PS4 controller is more involved. Although the USB option is straightforward, Bluetooth
    access requires some configuration.


    After updating and rebooting the Raspberry Pi, install the following software.
    The PS3 can communicate with the Raspberry Pi over Bluetooth:


    ```

    sudo apt install libusb-dev

    ```


    Next, create a folder for ps3, then run the following command:


    ```

    mdkir ~/syspair

    cd ~/syspair

    wget http://www.kernel.org/pub/linux/kernel/hid/hid-playstation/hid-playstation-0.2.tar.gz

    sar -xzf hid-playstation-0.2.tar.gz

    ```


    ```

    gcc -o syspair -libusb -lpthread

    ```


    Now you need to connect the controller to the Raspberry Pi by Bluetooth and run
    syspair to configure it:


    ```

    sudo ~/syspair/syspair

    ```


    ![](img/b85dcb824b0e90e3053692968652e94b_126_0.png)


    USB game controllers work out of the box, but if you''re not using RetroPie, RetroArch
    or similar you need to install the driver.


    # QUICK TIP


    Don''t use an old Raspberry Pi Model 8/B+ with Bluetooth - it will slow down,
    disconnect, connect controllers to a Raspberry Pi 3 or later. For the best results
    use Raspberry Pi 4.


    Make use of the MAC code, disconnect the PS3 controller. You now need to start
    a bluetooth controller as explained in the instructions for the Xbox.


    Note that you''re not limited to console controllers - almost any controller can
    connect via USB to a Raspberry Pi. If you use a top-end Xbox pads for PC, there''s
    a suitable USB driver available. The advantage of this is that if you''re building
    a gaming system, you might prefer any controller over USB for wireless.


    For other controllers, wireless means no wires. This means almost any gamepad
    controller can connect via bluetooth so no extra driver may be required.


    Whatever device you use, you may need to test it. To simply use the test in Linux
    run:


    ```

    sudo apt install joystick

    ```


    Then run:


    ```

    jstest /dev/input/js0

    ```


    This will help you test unresponsive buttons and thumbs sticks for troubleshooting
    purposes.


    # » CONTROLLERS AND RETRO GAMING


    While you need to manually install drivers on the Raspberry Pi for gaming with
    controllers with RetroPie, Recalbox is also easy. If you''re using a lite version
    or have manually installed the retro gaming suite on your system, the drivers
    are included.


    However, this doesn''t mean you can simply plug and play. Rather, you might need
    to detect and calibrate the controller. Let''s look at configuring a controller
    in Recalbox.:


    Start by connecting the USB controller. If you''re using Bluetooth, put the device
    into pair mode with the Raspberry Pi. Go to Controller Settings and select the
    Bluetooth Controller from the list, then


    Once detected, Recalbox will prompt the button mapping. For instance, connect
    each button you want to when prompted. If you make a mistake, you''ll need to
    restart the process for the controller in question.


    Usually this doesn''t take long—once the buttons and controls you''ll be ready
    to start playing games.


