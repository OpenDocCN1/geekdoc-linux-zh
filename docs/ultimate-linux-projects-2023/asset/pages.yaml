  md: '# Ultimate Linux Projects


    # MICRO:BIT


    # Build radio walkie-

    talkies with Python


    Using a pair of BBC microbit devices, Calvin Robinson creates walkie-talkies in
    Python.


    he Micro:bit is an open-source computer for one free unit each Year 7 pupil. The
    idea was Launched in 2015/16, the BBC gave UK secondary schools the opportunity
    to have every child keep their microbit for free and develop a passion for coding.


    Certain UK might remember the BBC Micro from our school days (1981-1994), an Acorn
    computer used for BASIC. The microbit is its spiritual successor, designed to
    be cheap,


    adaptable, and a fraction of the size, ideally to be used alongside a PC or Raspberry
    Pi.


    The micro:bit features LEDs, a non-programmable button, an accelerometer, magnetometer,
    Bluetooth Smart clips. The unit is specifically designed for Blocks but are ideal
    for attaching things like motors and wheels with crocodile clips. A JavaScript
    editor and Python, although it is also possible to program it with Free Pasal,
    Simulink, C++, Scratch, and Zephyr OS on it.


    For this tutorial, we''re going to code in Python. There are many number of editors
    available for the microbit, including some that emulate the microbit hardware,
    where unit isn''t a barrier to entry. Visit https://microbit.org/code/ and click
    ''Let Code'' to open the page. The Editor is a great native GUI interface (https://codewith.uk/),
    which features uFlash and command line options also. There''s also a mobile-based
    Android app for microbit, which you can find at https://codewith.uk/, as it provides
    a fantastic microbit-test tool to check if your code is working.


    Calvin Robinson is a assistant principal and Computer Science Teacher with a degree
    in Computer Design and Programming BSc (Hons). If you make a mistake keep an eye
    on the LEDs;bits have their own debugger built in, so the error will scroll across
    the LEDs, starting with the line number.


    | mycode | bits | Help and tips | Accelerometer | Compass |

    | I/O Pins | Thermometer | Radio |

    | -Settings | (0:100) | Address (bit) |

    | hex):0x75262974 | Group (0-255) |

    | Update | Data rate: RATEBIT |

    | -Data- |

    | Message | Send |


    ![](img/b85dcb824b0e90e3053692968652e94b_93_0.png)


    We''re going to program some walkie-talkie devices that send messages from one
    to the other. We can pre-sent messages and lines of scrolling text between microbits;
    at the speed of light!


    The micro:bit supports Bluetooth (BLE) and radio (the Version of Python supported
    by micro:bit), so we will use it by using radio transmission to make our microbits
    communicate with each other. There is no limit to the number of microbits that
    can send/receive over radio transmission, other than using the 2.4GHz frequency
    congestion. We highly recommend using no more than a half of microbits to begin
    with (this is,), and keeps them in the same room until the code is functioning,
    so you can run out the possibility of walls or objects interfering with the signal.


