    \ are defined using the sequenceDiagram. We want to use Mermaid to represent interactions\
    \ with a program and the components involved in the process. This is shown in\
    \ the following Mermaid code:\n\n```\nsequenceDiagram\n    participant A as User\n\
    \    participant CTC\n    participant CSV\n    participant CTC_Auth as Auth/CTC\n\
    \    rect(100,200)\n        par Data\n        CSV>>CTC: A Database that uses queries\n\
    \    end\n```\n\n> Note of case: REST API\nCTC-->>CSV: Return data\nend\nU>>>>CTC:\
    \ Logs in\nCTC-->>U: Returns Security Token\nCTC-->>CSV: Open Window\nU-->>CSV:\
    \ Query Internal Database\n\nThe author keyword shows that attaches a sequence\
    \ number to appear in the sequence diagram. The rect rgb(100,0,0) puts colours\
    \ around a rectangle. Inside this rectangle, you can write commands. The par block\
    \ represents actions that are happening in parallel.\n\nrect and par end with\
    \ the end keyword.\nThe diagram displays the output of the previous Mermaid code\
    \ - the Markdown source file is called use_case.md. The use of any allows you\
    \ to specify which part of the sequence diagram you want.\n\n# Mermaid and Hugo\n\
    \nThe Hugo (https://getget.io/) framework offers support for Mermaid code. This\
