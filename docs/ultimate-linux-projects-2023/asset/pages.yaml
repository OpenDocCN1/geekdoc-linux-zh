    \ helpful way of generating documentation for your projects.\n\nembedded Mermaid\
    \ code in a Hugo blog post we publish. In order, you need to add a shortcode inside\
    \ the layouts/shortcodes directory - Hugo uses to show extra functionality that\
    \ cannot be implemented in Mermaid. The name of the source file is called use_case.md\
    \ and you must have the following content:\n<script src=\"https://mermaid.github.io/mermaid/8.2.3/mermaid.min.js\"\
    ></script>\n<div class=\"mermaid\">\n  {{ inner }}\n</div>\n\nThe previous file\
    \ defines a shortcut named mermaid - in order to use that you should use embed\
    \ Mermaid commands in (mermaid) and (mermaid)-blocks. The part of the code for\
    \ the Hugo blog post is as follows:\nUsing Hugo(https://mermaid-js.github.io/)\
    \ for mermaid.\n\n```\n(mermaid)\ngraph TD;\n    A-->B\n    B-->C\n    A-->D\n\
    \    D\n```\n\nThe first line is Mermaid code. After you need to use any Mermaid-related\
    \ code in a block that starts with {mermaid} and ends with {mermaid}/\n\nThe diagram\
    \ on the next page shows the code inside the Hugo blog post - the first example\
