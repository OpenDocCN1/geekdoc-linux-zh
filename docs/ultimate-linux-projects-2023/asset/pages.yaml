    alongside the other installed systems.


    ![](img/b85dcb824b0e90e3053692968652e94b_29_2.png)


    The system comprises a server component, which is open source, and a client for
    any number of clients for display types. The Windows and Linux clients are both
    free and open source, whereas the other platforms are paid-for, licensed clients.
    The server can be self-hosted, or hosted by your team however.

