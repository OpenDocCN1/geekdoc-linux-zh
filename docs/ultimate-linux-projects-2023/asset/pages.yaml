  md: '# Ultimate Linux Projects


    # GAMING


    # Connect, configure and use gamepads


    Planning some Raspberry Pi gaming? Christian Cawley shows you how to set up a
    game controller either with or without an emulator.


    ![](img/b85dcb824b0e90e3053692968652e94b_125_0.png)


    Lanning to play some games on your Raspberry Pi? Minecraft Pi is far easier to
    play with a game controller, but you might have your eyes on Doom or other classics.
    Alternatively, you could be using a controller to your Raspberry Pi-based retro
    gaming system.


    A selection of game controllers can be connected to your Raspberry Pi using USB.


    Furthermore, some older controllers can also be linked up via Bluetooth.


    In theory, Raspberry Pi supports everything from generic USB controllers and keypads
    to Bluetooth devices. So, you can expect to connect an Xbox controller and a PS4
    controller to your Raspberry Pi. Xbox 360 will also work, as are Nintendo games.


    Own a PlayStation 5? The new Sony console features a major revision of the much-loved
    game controller. Despite the improvements in 2020, the Sony controller will easily
    connect to your Raspberry Pi, just like its predecessor.


    Meanwhile, Xbox Series S and X back controllers can also be used on an Xbox console.


    In this tutorial, we will look at what you need to connect the most widely used
    game controllers to your Raspberry Pi: those for Xbox One, Xbox 360 and PS3 controllers.
    We will begin with the Xbox One controller, one of the most popular game controllers
    available, also compatible with PC games.


    ```

    ```bash

    [bluetooth] agent on

    Agent is already registered

    [bluetooth] default-agent

    Agent request failed

    [bluetooth] scan on

    ```

    ```


    This is a well-known, multi-purpose controller that can be easily connected to
    the Mac via enable.


    Connect the Xbox controller to your Raspberry Pi using USB, start by updating
    and upgrading Raspberry OS:


    ```

    ```bash

    sudo apt update

    sudo apt upgrade

    ```

    ```


    Now connect the controller. Try it out with a game. The driver for Xbox controllers
    should be built - if not, use


    ```

    ```bash

    sudo apt installxbox

    ```

    ```


    Follow the instructions to install the controller, reboot the Raspberry Pi, and
    try.


    Using a Xbox controller with the Raspberry Pi is a little tricky. Two types of
    controllers have been released: One uses wired, while the other uses wireless.
    How can you connect which?


    If your Xbox controller has Wi-Fi, the front button is the same colour as the
    controller where the triggers and shoulder buttons are located. Xbox controllers,
    meanwhile, have a single-coloured face. So, around the Xbox controller there will
    be the same colour as the controller face.


    To go deep in the next compartment, the model number is: 1697 if it is a wireless
    controller, 1708 indicates a Bluetooth model.


    If you have the 1697 model, you will need to connect the official Microsoft Xbox
    controller to your Raspberry Pi using USB dong. This is a simple thing that should
    work out of the box. Simply holding the buttons on the adapter and the Xbox One
    controller to sync, then start playing.


    For the 1708 controller, you''ll need the xboxrd driver, as described below. You''ll
    need to


    ![](img/b85dcb824b0e90e3053692968652e94b_125_1.png)


    Christian Cawley A freelance writer editor specialising in electronics, who is
    still finding needs in the Raspberry Pi.


    +   YOU NEED

    > Raspberry Pi 3 or later

    > game controller

    > Raspberry OS

    > USB cable


    Most game controllers connect to the Raspberry Pi using Bluetooth or USB. For
    wireless controllers, however, you''ll need a USB receiver.


