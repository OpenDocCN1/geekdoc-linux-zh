  md: "# # How to code diagrams, graphs and pie charts CODING ACADEMY\n\nNext, we\
    \ render the Markdown vcode.md inside Microsoft Visual Code:\n# A Markdown file\
    \ with Mermaid!\n\n```\nmermaid\ngraph LR\nRoot-->A & B\nA-->A1-->A2-->A3\nB-->B2-->B3\n\
    C-->C1-->C2-->C3\n```\n\n![](img/b85dcb824b0e90e3053692968652e94b_90_0.png)\n\n\
    This code presents an alternative way of creating graphs. Using markup A->node,\
    \ you can write simple A->node, <n> & <n> and A->n1->n2 to make multiple nodes\
    \ without connecting nodes. Using ==> is just to create connections. \nThe screenshot\
    \ shows the preview of vscode.md using the Mermaid extension for Visual Code.\n\
    \n![](img/b85dcb824b0e90e3053692968652e94b_90_1.png)\n\nThis shows Visual Code\
    \ rendering a Mermaid document. The code is preserved in a separate window from\
    \ the Markdown file.\n\n# ## Creating a pie chart\n\nMermaid can easily draw pie\
    \ charts and even do the calculations for what you want the pie chart. To create\
    \ a pie chart, you need to begin the block with pie. The next line begins with\
    \ title followed by the title text. After that, you need to write the data that\
    \ you're graphing. Each slice of the pie is a different entry and contains a label\
    \ followed by a positive numeric value. Note that the text should be in double\
    \ quotes, which isn't the case with the pie chart title.\nThe Mermaid editor shows\
    \ the definition of a pie chart in the Mermaid dialect:\n# This is a Pie Chart\
    \ in Mermaid\n\nWhen rendered, the code generates a flow chart that can help you\
    \ choose an Operating System. The next page shows the flowchart generated with\
    \ the help of Mermaid Visual Code.\n\n```\nmermaid\npie\titleLinux Distributions\n\
    Debian: 32.96\nUbuntu: 50.0\nArch: 10.1\nCentOS: 5\n```\n\n# ## Sequence diagram\n\
    \nA sequence diagram describes interactions how things are carried out. It's really\
    \ helpful when you want to describe situations on many factors.\nA sequence begins\
    \ with the sequenceDiagram keyword followed by the list of participants, which\
    \ you are defining (each participant is defined in a separate line). After that,\
    \ you need to define the connections interactions between participants, which\
    \ in Mermaid terminology is called Messages.\n\nThis Mermaid code produces a sequence\
    \ - it's part of the seq_diagram.md file:\n\n```\nsequenceDiagram\nparticipant\
    \ User\nparticipant CTC\nparticipant CSV\nparticipant Auth as Authorization\n\
    Loop every time\nCTC->CSV: Keep updating!\nUser->>Auth: Send authorization\nAuth-->>User:\
    \ Get authentication token\n```\n\nThe previous code is saved in the pie_chart.md\
    \ file - to render it on your screen.\n\n# ## Creating a flowchart\n\nFlowcharts\
    \ start with the flowchart keyword, followed by their orientation (LR or TD).\
    \ Then you add the nodes of the flowchart you want. If you want an edge between\
    \ nodes, you should use the ---> arrow. To include text in a node use the node\
    \ name. If you include the text in square brackets, the nodes are defined as a\
    \ rectangle; you can use rounded brackets to make it a diamond.\nThe following\
    \ Mermaid example, which can be found in flow_chart.md describes a flowchart:\n\
    ## Flowchart\n\n```\nmermaid\ngraph TD\nA[Choose OS] -->B(Do you want?)\nB-->C[Unix\
    \ or Windows]\nC-->D[Good Luck!]\n```\n\n# ## MERMAID VS GRAPHVI\n\nAnother tool\
    \ that you can create graphs and plots is Graphviz (https://graphviz.org). It's\
    \ a collection of tools for mapping structures and generating graph layouts supports\
    \ both directed and undirected graphs. It offers both graphical and command-line\
    \ tools. Graphviz uses its own language. The language of Graphviz is open and\
    \ easy to learn and use. As with Markdown, you can write Graphviz using a simple\
    \ text editor you like. A wonderful effect of it is that you can easily generate\
    \ Graphviz code!\nGraphviz has many ways to make graphs using plain text and output\
    \ in various formats. However, with Mermaid, you don't need to install anything\
    \ for Graphviz, you need to install the Graphviz tool to learn. Mermaid is a more\
    \ popular language of Graphviz very when you're already using it for blogging\
    \ or writing. As is usually the case with tools, only after using Graphviz and\
    \ Mermaid for some time you will know which option is best for you.\n\nUltimate\
    \ Projects | 91"
