    # CUSTOMISE MINT 20!


    Linux Mint is fantastic, but it''s also flexible, malleable and tweakable.

    Jonnni Bidwell shows you how to truly make it your own.


    ![](img/b85dcb824b0e90e3053692968652e94b_7_0.png)


    linux Mint continues to go from strength to strength, as you''ve already had a
    play with the latest 20.2 release. But are you ready for more? Head to linuxmint.com
    and start with Mint-fresh. See now how you want to install it. Don''t you? And
    that is just the beginning. One of the things that makes Linux Mint so cool is
    its configurability. It''s often said (the brains behind Linux Format) that Mint
    is an ideal beginner''s distro, and it turns out


    also ideal (we) for beginners to tinker around with.

    The flagship Cinnamon desktop can be transformed not just with swifty effects
    and also with many kinds of extensions, applets and desks (collectively known
    as ''spices'' in Cinnamon parlance). And MATE and Xfce, the desktop environments
    of Mint, are equally seasonable. But we can do better than that: why not mix it
    up and install a new desktop environment? We''ll show you how to install the outstanding
    KDE Plasma, we even show


    you how to make it work with the state-of-the-art Wayland display protocol.

    If you like things slimline, we''ll show you how to go minimal with the featherweight
    Sway desktop. Wayland is based on the i3 window manager, popular with power users
    and those who cannot abide desktop bloat. We will teach you how to do terminal
    and tiling like a pro in time.

    And just no one gets hurt, we''ll help with a handy reminder around how you can
    use Timeshift to easily undo desktop-related mishaps.


