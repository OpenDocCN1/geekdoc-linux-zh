    # EASY ROLLBACK WITH TIMESHIFT


    ![](img/b85dcb824b0e90e3053692968652e94b_8_1.png)


    +   1 Start Timeshift

    Fire up Timeshift and take a couple of snapshots to a local drive in space (at
    least 1GB more than your filesystem size). Timeshift will only back-system files
    by default, so files in your home directory aren''t included. There are better
    tools for backing these up.


    +   2 Take a Snapshot

    It might spring into action if the clocks align. But what if it doesn''t? just
    hit the Back Up Button on-demand snapshot. Timeshift backs incrementally until
    only changed files are stored. Once the snapshot completes, add a helpful description
    to help keep your track.


    +   3 Restore a snapshot

    If something goes wrong, you can now easily restore a Snapshot by clicking the
    button. You might want to examine the file, other first, before right-clicking.
    Even if everything goes wrong, and Mint no longer starts, you can use Timeshift
    from a live media. Just point it to the /timeshift directory.'
