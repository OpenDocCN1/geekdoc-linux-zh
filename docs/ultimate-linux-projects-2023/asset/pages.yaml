    A key determinant for the vitality of a Linux distro, or hardware it runs on,
    is system performance. Depending on your purpose, you choose from a variety of
    tools to monitor the different components such as CPU frequency and temperature
    and utilisation. But if you favour the CLI like, you will enjoy working with S-TUI.


