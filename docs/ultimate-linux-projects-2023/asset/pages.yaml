  md: "# Ultimate Linux Projects\n\n# MERMAID\n\n# # How to code diagrams,\ngraphs\
    \ and pie charts\n\nMihalas Tsoukalos explains how to use Mermaid to create beautiful\n\
    technical graphs and diagrams you can reuse and update anywhere.\n\n![](img/b85dcb824b0e90e3053692968652e94b_89_0.png)\n\
    \nhe subject of this tutorial is Mermaid, which is\na Markdown dialect. Put simply,\
    \ Mermaid code\nlooks Markdown and enables you to\ncreate flows, charts and more.\
    \ It's based on\nJavaScript that renders the Markdown as code\nbecause Markdown\
    \ doesn't offer\nfor drawing. Mermaid is supported by many\neditors using Microsoft\
    \ Visual Code, typora and online\neditors you'll cover here.\n\n![](img/b85dcb824b0e90e3053692968652e94b_89_1.png)\n\
    \n# QUICK TIP\n\nIf Mermaid isn't to liking,\ntry Vega Life, which also\nenables\
    \ you to\ncreate graphs, charts, and\ngrammars are made\nbased on D3.js\nand JavaScript.\n\
    Learn more about\nVega Life at\nhttps://vega.github.io/\ndand at\nhttps://github.com/vega/vega-life.\n\
    \nMermaid code is delivered in blocks. The first line of a\nMermaid block specifies\
    \ the type of block. Valid\nvalues include graph, sequence diagram and\nflowchart.\
    \ Each plot type has its syntax, and it\nmust use the md file extension (filename.md),\
    \ which\nis what we'll be using for the examples in this tutorial.\n\nA Mermaid\
    \ block begins with\n--- -- this is the Markdown\nway of telling the editor it\
    \ has a\nproperty, which is inside Mermaid. However,\nMermaid code can also be\
    \ saved in files\nusing the md file extension (filename.md).\n\nYou can find all\
    \ the code for this tutorial at\nhttps://www.linuxformat.com/contents/\nPDF=XF224..\n\
    \n# ## Installing Mermaid..\n\nYou don't need to install Mermaid. All you need\
    \ is\nsupport for Mermaid to see the output from the\nMermaid block. The block\
    \ is a Markdown file, saved\nas mermaid with a block in Mermaid format:\n\n# ###\
    \ This is a Mermaid example\n\n```\n```mermaid\ngraph TD;\nA1->A2;\nA2->A3;\n\
    A3->A4;\n```\n```\n\nThe first line is paragraph and generates a line\nout the\
    \ output. Then we're creating that we\n\ngraph that is going to be rendered from\
    \ the top to\nbottom (Top-Down). The next, we add nodes\nand connect them with\
    \ the node. The >>\nnotation shows that the node on the left is connected\nto\
    \ the right. The graph contains four nodes,\nnamed A1, A2, A3 and A4. With more\n\
    connections and connections between them, you get\nwhat you want — Mermaid takes\
    \ care of the output.\n\nThis example illustrates one of the simplest of\nMermaid\
    \ graphs with not many nodes, it also\nillustrates the simplicity of the diagram.\n\
    \nThe output of the preview can be seen in the\ndiagram above with the help of\
    \ Visual Code\n — more than this.\n\n# ## Microsoft Visual Code\n\nMermaid Code\
    \ has an extension for rendering\nMarkdown files and providing Mermaid output\
    \ outside\nVisual Code. To use the Extensions tab, search for the\n\"Mermaid Preview\
    \ Support\" extension and\nit install. It would also be helpful to use the \"\
    Mermaid\nMarkdown Syntax Highlighting\" extension so that you\nsee your code beautifully\
    \ coloured."
