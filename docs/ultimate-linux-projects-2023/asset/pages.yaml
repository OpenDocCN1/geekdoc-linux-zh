    # # Build a custom digital signage system


    Discover how to create a digital display for an open-source conference using Xibo
    digital signage and the help of Matt Holder.


    ost Linux deicionados have noticed an increase in the number of large format screens
    in public places, displaying a range of information. This is digital signage.
    In this tutorial we''ll be using Xibo, a flexible system that can be used to show
    images, videos, maps, data tables, weather data, embedded HTML and more. We''ll
    demonstrate how to set up a server and client, finally designing a layout and
    selecting content.


    ![](img/b85dcb824b0e90e3053692968652e94b_29_1.png)


