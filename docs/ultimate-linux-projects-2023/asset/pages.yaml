    Dynamic Analysis Security Testing (DAST) is perhaps the most important security
    measure, frequently requested to be checked every six months by an outside consultancy
    that does an automated scan with Burp Suite or Zero Attack Proxy (ZAP) and provides
    you with a list of all vulnerabilities found in the scope of your application.


    you just dive to be at this point, then you can pick up a copy of the progress
    so far at https://github.com/web-app-security-tutorial/itf280.


    Tim Armstrong is a Lead Engineer specialising in networking, software development,
    and security. You can find him on Twitter @omatchury or via his website at www.jsontexts.com.


    # Too many concerns


    But here''s the thing: when the malicious actors (hackers) attack your web API,
    they are checking if your code is properly formatted, they are essentially looking
    for a place where you''ve vulnerable an input, an endpoint that protects you,
    protect code, a SQL injection, a vulnerable login system, leaked credentials and
    unauthorized access. It is quite difficult to run a test on every six months when
    you''d only get results that you''re not afraid of.


    When it comes to DAST there are a growing number of concerns on the market. Most
    of them use scanners on a periodic schedule, so either you need to expose a test
    to the internet and have the app that scan, or you need to set up a proxy which
    is a bit slow and can lead to instability of the environment.


    Building DAST into your CI/CD takes a few minutes and gives you some information
    that you''ve got from a pen-test when all they did was run an automated scanner.
    Instead of only occurring every six months it happens every sometime to a merge
    in the main branch – meaning you find out about the vulnerability when it gets
    merged. Ultimately this means that when you do it in continuous integration instead
    of a month-check, you''ll actually get your money''s worth!


    The goal is, as it when you added security and software analysis components to
    your pipeline, is to know about vulnerabilities before the code lives so that
    you can fix them before it gets deployed.


    In this tutorial, you''ll be adding DAST to a GitLab CI/CD pipeline format. We
    have covered this in Linux format (LXFX 270), if you have to match them, and it''s
    a good idea to check that out first, but if


