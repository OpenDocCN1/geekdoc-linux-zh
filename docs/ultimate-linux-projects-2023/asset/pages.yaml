    \ that Mermaid is rendered with the JavaScript library used in the blog (see:\
    \ https://mermaid.github.io/mermaid/8.2.3/mermaid.min.js) and not by Hugo.\n\n\
    # Go scripts\n\nThis section describes a utility that generates Mermaid code,\
    \ but you can use any programming language to produce Mermaid code. The utility\
    \ reads a CSV file with two columns and creates a Markdown file with a title and\
