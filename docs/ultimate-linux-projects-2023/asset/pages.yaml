    The NOAA polar orbits carries an on-board instrument called Advanced High Resolution
    Radiometer (AVHRSR). You can think of this as a camera, although it''s absolutely
    different from regular cameras. In particular, the sensor isn''t a two-dimensional
    array that captures a 2D scene in a single instance. Instead, it captures only
    a row of pixels as the satellite flies along. It moves continuously, and the satellite
    will have moved between two adjacent rows, which''ll represent different strips
    of the Earth''s surface. Stacking these strips, creates a two-dimensional image.
    The result is similar to the image that can be captured from a camera at perspective
    with a limited area due to the range of the radio sensor.


    Despite it only necessary to capture a strip of pixels, the AVHRSR sensor is capturing
    a row of 2,600 elements, which is the effective resolution. More recent sensors
    do operate this way, and are referred to as push brushes, but the AVHRSR, being
    an older design, with a whisk broom or which''s used, the device moves back and
    forth at right angles to the direction of movement. Using a mirror, it directs
