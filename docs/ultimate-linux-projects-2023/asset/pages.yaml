  md: '# Raspberry Pi projects


    # Get your kit ready


    Prepare your USB drive, SD cards and a cup of tea.

    It’s Raspberry Pi project time - ...


    With more than 34 million units sold, the Raspberry Pi is not only one of the
    world''s most popular computers – it''s also one of the most important. Originally
    designed to help kids learn technology, this impressive, single-board system is
    the leading choice for makers, developers and hobbyists who want to do everything
    from building robots to setting up retro machines. Whether you''re aged eight
    or 80, the Raspberry Pi is made for you – and there are models ranging from £5
    to £65 to suit any budget.


    When you do work with your Raspberry Pi, you''ll need an SD card with an operating
    system on it. The popular choice, and in many cases a great start for many projects,
    is the official Raspberry Pi Imager that you can use to write OS (or other OSs)
    to your SD card, or use the NOOBF tool. Both work but one has the advantage of
    being able to handle compressed images.


    ![](img/b85dcb824b0e90e3053692968652e94b_100_0.png)


    For older model Pies there is another cause of errors. The Pi 3 and 4 need a good
    5.2V or they will switch their power input from micro USB to USB-C, and unfortunately
    this new port isn''t USB-C compliant. So if you use a fancy smart charger, it
    won''t power the device properly, and might possibly damage it.


    You won''t run into these issues if you use the official charger, so that. If
    you''re opposed to that, we recommend using cheap USB-C cables (ones that last
    the charger work fine). Chargers should work well, but they may not be so reliable,
    so caveat empir.


    We''ve handcrafted some fun, useful and interesting projects to showcase the tremendous
    of things that can be achieved with the humble Pi. From retro gaming to machine
    learning and Bitcoin, the possibilities are endless...


    > The incarnation of the Pi: 400 model embeds a Pi 4 also pictured within a keyboard.


    # Troubleshooting


    This throughout we will use a few different OS images, so we''ve made a handy
    guide to writing them below. If you run into troubles, it''s worth remembering
    that a faulty SD card might be to blame. It''s worth trying a different thing
    if one goes wrong.


    ```

    WRITING SD CARDS WITH ETCHER

    ```


    ![](img/b85dcb824b0e90e3053692968652e94b_100_1.png)


    ![](img/b85dcb824b0e90e3053692968652e94b_100_2.png)


    ![](img/b85dcb824b0e90e3053692968652e94b_100_3.png)


    +   1 Download Etcher

    You''ll find Linux, macOS and Windows builds at https://etcher.io. On Linux it''s
    a simple zipped archive, so once you''ve downloaded, run chmod 755 on the file
    (see Properties)

    Permissions and check the box to allow execution). You can now double-click the
    Appimage to run it (or so from the CL).


    +   2 Prepare the target

    Insert your SD card, select the Flash from file option and navigate to your downloaded
    image. Select Target and the media available. Drives are hidden to prevent you
    from accidentally overwriting them. Select your SD card, and make sure there''s
    nothing important on the card.


    +   3 Write the image

    Hit Flash, enter your password and wait for the progress bar You''ll be offered
    the chance to overwrite the same name, which you might need if you''re preparing
    a fleet of Pis. Once your SD card is ready for action. Move it from your PC to
    your Pi, power on and let the adventures begin!


