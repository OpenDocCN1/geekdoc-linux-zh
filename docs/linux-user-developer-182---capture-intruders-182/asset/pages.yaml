    # Using the Crouch extension


    By default, Crouch is not installed. To use it, you must specify ''crouch'' and
    install the Crouch Chrome extension. The extension features binding, clipboard
    and notification synchronization as well as wifi which supports X11 in a native
    Chrome OS window, allowing you to run graphical apps in crouch environment. Use
    the sudo -e ~/Downloads/crouch -u -t switch command to add an existing crouch.


    # 07 Installing and using cli


    Graphical interface is all well and good, but if you want to run Crouch without
    X to take advantage of CLI tools that you can get in Chrome OS? Use the ''cli-extract''
    and you''ll save a lot of space because it''s all you need. The Crouch extension
    allows you to run Crouch using linux (sudo start) in a new environment, which
    means Crouch will support multiple crouches, and you have both cli and a full
    environment installed (and even running) at the same time.


    # 08 Updating Crouch and your


    In order to check for updates, download the latest version of Crouch and see what''s
    new, run crouversion -d from your crouch run crouversion -h for more details on
    what the parameters do. From outside the crouch itself,


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_42_0.png)


    you can run sudo ~/Downloads/crouch -u chrome, which will update the crouch and
    all installed packages. If you want to back up before running your updates, you
    can use edit-crouch to back up to a timestamped tarball in


    # 09 Removing crouch and saving


    Crouch? Got into a right mess and want to start again? Crouch-remove command is
    your friend, simply pass the name of the crouch you want to delete. If you want
    to install a crouch in a different location (you can run it from an installed
    USB stick) then use the -p switch to select the target directory. Ensure you quote
    or escape spaces in the destination path. Use the edit-crouch command to move
    existing crouches.


    # 10 Powerwash/recovery


    If you want to restore your Chromebook to the factory state, you should check
    what Google calls it a ''Powerwash''. This can be achieved in a number of ways
    - the easiest is to just tap the switch at the bar menu at startup. Alternatively,
    you can switch from a Beta/Developer switch back to the Main Chrome OS or use
    the Google-Chrome Recovery Tool to use a USB stick. This might be necessary if
    you''ve broken your machine!


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_42_1.png)


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_42_2.png)


    # Gallium – the dual-boot OS


    Crouch isn''t the only one; if you need better distros Gallium is right there.
    But specifically for Chrome OS Gallium OS takes a look. Gallium is what you want
    to boot from alt. Gallium OS includes many features specifically for Chrome OS
    users, including an integrated guest driver. Gallium OS is typically installed
    from the command line using chx, but can be installed on an SD card or SSD, although
    doing this will fully replace Chrome OS! Like Crouch, Gallium OS will need your
    Chromebook to be in developer mode. Like Crouch, reverting to the older version
    is easy with the Recovery Tool, but then the SSD will have been wiped'
