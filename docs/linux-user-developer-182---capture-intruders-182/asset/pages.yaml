    # ## What''s Matrix?


    Communication is as broken as everything internet-related. Some of your friends
    are on WhatsApp, your colleagues are on Slack channels. Most people are on Twitter,
    but not on one-to-one conversations. Matrix crosses across silos, providing endomorphic
    communication, a baseline of HTTP and JSON, and a range of clients to suit different
    users, plus end-to-end encryption (with true independence, not just)


    Matrix is an "standard for defragmenting communication," through a meta-network
    providing an open platform for real-time communication. You can send video calls,
    share files, VR/AR options, and it can be used with anything that has passed over
    its plugins (enable-subscribe pattern), or local-hosted information.


    Matrix has a decentralised repository, so if you connect out of a group, you can
    sync the history seamlessly. Messages are stored in a Merkle Directed Acyclic
    Graph, and with their position: "blockchain for real-time communication", they
    will have beta support. Alpha-supported protocols like Telegram, Instagram and
    Hangouts, with LibPurple supporting Skype, Aim and more.


