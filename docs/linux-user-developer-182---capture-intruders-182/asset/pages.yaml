    How have you found working with the Raspberry Pi?

    After doing few projects with microcontrollers, the Raspberry Pi was an entirely
    different experience. The latest Wi-Fi versions are not as easy to work with as
    the first Raspberry Pi that needed to connect to it through VNC. But the added
    complexity of an encoder in the background also has its downsides. That should
    run in real-time, reading from an encoder can be problematic and it''s much more
    difficult to debug. All in all, it depends on what you are trying to do.


    # Maximilian Kern


    He is a German graduate, studying a master''s degree in Mechanical Engineering.
    In his free time, he likes to program robots.


    # Like it?


    If you want to see how the robot''s hull and wheels were designed, check out the
    3D files from Fusion 360 (https://github.com/a660/2). You''ll need to go to Thingiverse
    (https://thingiverse.com/ZeroBot).


    How did 3D printing impact your project?

    Before I started with 3D printing, making any of mechanical parts usually meant
    having to dig out of foam and saw wood or plastic, and trying to glue everything
    together as minimalistic as possible. Now it''s possible to design the most complex
    parts in front of a PC and just print them Apart from things like helps and overlaps,
    there is a lot of freedom to use and put effort into designing the parts.


    Did you expect the robot to be so responsive?

    I was pleasantly surprised that the Raspberry Zero could do this. I watched a
    video on YouTube to find out if it was possible to get an acceptable latency,
    and I managed to achieve less than 200ms with the Raspberry Pi and mqtt-triggered
    stepper. The stepper-motor was easily installed and easy to code. The motor starts
    whenever someone connects to the Raspberry Pi. The latency on the Raspberry Zero
    was also very low. Even when I was flying a drone, but for a slow robot it was
    sufficiently responsive.


    # Would you do anything different?


    The work on the robot was straightforward without any changes I had to make. I
    would try to understand the hardware capabilities of the Raspberry Pi a bit better.
    I also ran into a few problems where some more basic knowledge of Linux hardware
    would have helped me.


    # What are you working on now?


    I planned to use the robot''s chassis as a platform to master more with OpenCV
    (Open Source Computer Vision). The robot needs to detect faces or run a robot
    autonomously. The problem is that the Raspberry Pi is already running full with
    capacity and stream, which makes development difficult. Because of this, I am
    planning to take a break from the Raspberry Pi and do another microcontroller
    project instead, wanting to build a little small weather monitor, maybe one that
    can be extended to some sort of home network.


    # Further reading


    Max undertook an internship, which in turn led him to interest in robotics. You
    can see that on the blog: Hello World corebotics.blogspot.com. For related exploits,
    check out GitHub: https://github.com/io/Max.


    > I put effort into designing printing parts


    What''s your wish list for 3D printers?

    FDM (Fused Deposition Modeling) uses a nozzle to melt filament or plastic that
