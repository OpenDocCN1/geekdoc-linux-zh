  md: '# Kippo''s folders of interest


    Before exploring the honeypot to the internet and starting to collect attacker
    information, it is necessary to list the folders where Kippo will keep the data.
    The first folder is called data. All the SSH keys used for this folder are stored
    there. The first is called lastlog.txt, which records the IP address, date and
    how long an attacker''s activity lasted after logging into the system using the
    root account. This information will be the first to be analysed in the information
    processing (seeks).


    The second folder is named userd.txt and stores users and passwords that were
    accessed by the system. The format of userd.txt must match the following settings:


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_22_0.png)


    +   - Username:UID:plainNext Password


    ```

    # IP addresses to listen for incoming SSH connections.

    (default: 0.0.0.0) = any address

    sh_addr = 0.0.0.0


    # Port to listen for incoming SSH connections.

    (default: 22)

    sh_port = 22


    # Hostname for the honeypot. Displayed by the prompt of the server connection.

    (default: svr3)

    hostname = svr3


    # Directory to save log files.

    (default: log)

    log_path = log


    # Directory to save downloaded (malware) files in.

    (default: dl)

    download_path = dl

    ```


    Another important Kippo folder is dl. This stores files uploaded by an attacker,
    when the honeypot is compromised. This allows us to retrieve and analyze any possible
    malicious files to identify any kind of malware and the behaviour logged.


    An example of Kippo, where the ssh_port has been set to port 2223 by changing
    the value of sh_port variable:


    > The better we simulate the Linux structure, the longer the attacker will remain
    working on our honeypot


    # Custom Kippo


    The configuration file where we can enter values for the directives and how Kippo
    is called is kippo.conf. This includes listing listening ports for SSH connections
    and the locations for files uploaded by an attacker:


    +   - ssh_addr: Shows the network interface Kippo will be listening for all the
    requests.

    - ssh_port: Kippo''s listening port. The preference is to set it to port 22, although
    you want to run keep as root sudo.

    - hostname: Shows the computer name of the attacker. Using appealing names like
    PayPal helps.

    - log_path: The path where the log file will be stored for recording all events
    and taking a screenshot. This will be stored in the kippo.log; file called tally
    will store all session logs and is used for analysis afterwards.

    - upload_path: The path where the files uploaded by the attacker will be. By default,
    this is set to 0 (no limit).

    - download_size: Sets the maximum size for any file that can be downloaded by
    the attacker.

    - content_path: The path to the ''virtual'' files. By default, this is the path
    to the folder which contains the content and prompt.

    - xtmtds_path: The path to the folder where the output of executed commands is
    stored. If the attacker executes a command it will create a file and put output
    outside to be displayed. By default, the path is xtmtds.

    - exec: Enables this to output the commands executed on the computer using execCommand,
    which is disabled by default. Enabling this creates a bigger risk to your setup.

    - ssh_version: Indicates what version of SSH to display, which is output in string
    format:


    Our third folder honeys stores all the folders and files that are saved to the
    attacker. Files as etc and proc are also stored inside honeys and each folder
    is named after the attacker, but not all of them are kept.


    To make the honeypot look realistic and attractive to a target, we can create
    other folders inside honeys. The attacker will remain working on our honeypot
    and we will get better results.


    The fourth folder is called log. This log is for processing all the information
    collected by your honeypot and reaching conclusions about the attacker. Through
    the internet, the quality of the information we will collect. The kippo.log file
    and tally records the records of the connection attempts made by the attacker
    which should be processed to get a better understanding of the behaviour and goals
    of the attackers.


