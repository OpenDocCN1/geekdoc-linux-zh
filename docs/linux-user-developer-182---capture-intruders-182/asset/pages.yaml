  md: '# PROGRAMMING LANGUAGE


    # # Julia 0.6.0


    Need easily data analytics? It''s time to learn Julia


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_90_0.png)


    **Performance remains the core of Julia''s purpose, maintaining its focus as in
    the NoSQL world.** And yet the Celeste project used Julia to outperform power
    .. (our compute). The modern format will work well with solid code as well as
    C Python - much more fun than Lisp, Julia''s multiple dispatch has won over Dylan,
    but never mind the piecewise comparisons, it''s not itself.


    We grabbed the 64-bit binary package, and installed it in the -bin directory.
    Julia has a REPL (Read-Eval-Print-Loop), which supports tab completion and is
    useful for today code snippets


    - it''s hard going back to languages that don''t have a REPL. For more extensions
    of ''dooding'' with code, rather than writing serious code in a text editor, Julia
    works well with Jupyter notebooks and approach makes it easy getting used for
    non-users. And in Gadfly, you''ll have the kind of lovely plots seen in book [see
    Julia 2010]


    Online documentation refers to more than usual, and Julia is best learned through
    solid example, to absorb its peculiar mix of programming and methods. Or reasonable
    code: online examples learn strongly to mathematical and data science. We started
    with unit test on GitHub, and have found far Julia an intriguing language.


    > ### Pros

    Very fast and extremely well supported within parts of the data community.


    > ### Cons

    Slight improvements, and bugs in the language.


    > ### Great for:

    Fast prototyping and building. For codebases, julialsang.org


    # COMMAND-LINE DRAW


    # # Drawj2d 0.9.0


    Draw accurately without needing a steady hand


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_90_1.png)


    If you find drawing on a computer a painful business, why not tell the computer
    how to draw what you need? Drawj2d uses a string-based, descriptive language called
    Heci to draw "lines, points, circles, ellipses, arcs, parabolas, and dimension
    lines" in an easy way. Through Qt 2D & 3D, Drawj2d is capable of quite sophisticated
    shapes.


    Unzip the Java package and run some sample - it worked flawlessly on our Debian
    laptop using OpenCV, which is useful to embed calculations in text documents,
    and can be used to extend your drawings with the results of code. But the force
    vectors in the picture are built in. The project''s wiki has plenty of examples
    to follow.


    While it is a point of not being a CAD tool, the latest version will import .dxf
    files - complete, or just selected layers - and has features (like Tex text labelling,
    for formulae to be a preferable alternative to CAD for some users and tasks. There''s
    even a patch for edit syntax highlighting.


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_90_2.png)


    Above For technical diagrams, a descriptive file is a better drawing than a mouse


    > ### Pros

    No need for a steady hand - use calculations or a simple script. Beautiful output
    in SVG.


    > ### Cons

    Another scripting language to learn. Bitmap options are not limited. Not integrated
    with other tools.


    > ### Great for:

    Quick and accurate shapes, fines and labelling. http://drawj2d.org'
