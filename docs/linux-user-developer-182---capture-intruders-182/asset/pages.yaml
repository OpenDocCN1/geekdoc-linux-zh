  md: "# # Feature Capture intruders\n\n# QUICK GUIDE\n\n# # Where to place a honeypot?\n\
    \nHoneypots can be located in many positions within a network. A first layer could\
    \ be honeypots connected directly to the internet (and the first to face any attack).\
    \ A second layer is to locate honeypots in the DMZ (demilitarized zone), where\
    \ de-facing services are exposed to the internet - this is the most common layout.\
    \ A third layer would be to install the honeypot behind a firewall, configured\
    \ as a normal service of the real network.\n\nBelow a general layout using several\
    \ honeypots in a network and their location in the DMZ network.\n\n# DMZ\n\n|\
    \ HONEYPOT 1 | HONEYPOT 2 | HONEYPOT 3 |\n\n![](img/1fdb1204e7e4788f3fb478a4ef813223_23_0.png)\n\
    \nDNS SERVER\n\nWEB SERVER\n\n![](img/1fdb1204e7e4788f3fb478a4ef813223_23_1.png)\n\
    \nINTERNET ROUTER FIREWALL\n\n+   - handled and analysed during the information\
    \ processing stage to the load volume of data. It will not only record any successful\
    \ access by an attacker but any attempts that are made. If needed, it's possible\
    \ to stop Kippo using the script: `/stop.sh` and killing the process, which is\
    \ called twisted, using the kill command.\n\n# ## Running in the honeypot\n\n\
    We don't recommend using the root account to run Kippo in the honeypot. It's better\
    \ to create a Kippo account instead:\n\n```\nuser -d /home/kippo /bin/bash -m\
    \ kippo g\n```\n\nTo start Kippo in a network component and exposed to the internet,\
    \ run the script with `/start.sh`. This simple script, written in bash, will enable\
    \ you to run Kippo in the honeypot using twisted. Furthermore, you can always\
    \ run in manual mode using the following commands:\n\n```\ntwisted - \nkippo -cm\n\
    ```\n\nFollowing the command, you will get a list of twisted's processes running\
    \ in twisted (the honeypot): ps aux | grep kippo. To stop the process, run the\
    \ following script: `.stop.sh`. This will stop Kippo's execution, but it's possible\
    \ to have the process running using the `kill` command over the twisted process.\
    \ Once you get enough information about the honeypot, it is now time to process\
