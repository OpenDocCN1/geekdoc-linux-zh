- pgno: 76
  md: 'Having briefly mentioned that all-important IR filter, let''s discuss the options.
    An IR filter allows infrared to pass while blocking light, but in practice aren''t
    quite as simple as filters in their cut-off wavelength. least aggressive filter
    cuts off at 720nm, which means that a small amount of the deepest red light will
    get through to the infrared. The result isn''t quite as dramatic as with filters
    of a different cutoff, but it is widely available and cheap so it''s what most
    people start with. For R72 is perfectly adequate, but if you want even more effect
    you could use an 850nm filter; the part number varies from one manufacturer to
    another, but will probably be something like BK85 or IR 850.


    # Build and use an IR camera


    The Noir camera, just like the Raspberry Camera Module v2, is used in fixed installations,
    but for this application you need a portable unit. To achieve this you must assemble
    a Raspberry Pi with the Noir camera, add a battery and a power source, and put
    everything into a case. It also needs some software that can be shown by touching
    the screen. Our step-by-step guide will show you how to achieve this, but there
    are also other options online, and if you''re an proficient Pi hacker and relish
    a challenge, you might find something better.


    Once you''ve assembled your kit, it''s time to get out into the outdoors and test
    your hand at infrared photography. You''ll certainly want to experiment, as the
    more you do the better you''ll get. As of first, the most unique aspect of IR
    photography is the ethereal glow of greenery, so it''s best to start with landscapes
    and plants. Similarly, because that characteristic look is much more pronounced
    with good illumination, choose a bright day, with direct sunlight. The other contributor
    to the high contrast is the deep blue of the sky, which isn''t achieved on an
    overcast day or at least a partly blue sky.

    While taking shots out of the camera, are often not as impressive as they might
    be, so a degree of digital image enhancement is needed.


    # STEP-BY-STEP


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_76_0.png)


    # 01 Connect the PiFTT2.8-inch Plus


    Connect the PiFTT to Raspberry Pi. You will need some help to get to work, you
    need a new Linux kernel with the necessary support. This can be downloaded from
    the Adafruit website, although the link in Step 2 includes this.


    # 02 Connect the Noir


    You need to connect the Noir camera to the Pi. This is a very simple process although,
    without some software, you won''t be able to preview images on the TFT. Adafruit
    has developed a project with an associated download which support for the PiFTT
    and software to implement a point-and-play scheme, which you can find at http://bit.ly/DYVPcam
    - is a visible camera, but since the Noir is the standard to Pi camera except
    for its lack of an IR filter, the software is just for this project


    # 03 Add a power supply


    USB power supplies are readily available, and so so you''ll be able to turn your
    camera on and off by plugging and unplugging the power pack from the Pi. This
    is recommended, although you might need to use a switch in the relevant wire in
    the power pack and the Pi.


    # 04 Housing everything as a portable unit


    The hardest part of this project is to create a case that holds all the parts
    together so that the unit is portable, easy to handle and to hide. The best way
    is to find a general-purpose case of adequate dimensions and adapt it by providing
    the various components and making holes for the TFT and the camera. You also need
    to attach the infrared filter in front of the lens with no leakage of visible
    light if you want to really boost the configuration with a single type of IR filter,
    you could glue the filter over the lens in case. For flexibility, use an appropriately
    sized adapter ring to the case so you can screw filters on and off.


    Taking shots out of the camera, are often not as impressive as they might be,
    so a degree of digital image enhancement is needed to get the most out of your
    photos and turn them into works of art. We are not going to go into detail about
    how to edit the images, but what would apply to one particular photo editor, but
    you need to be proficient so that you will not have difficulty following our generic
    instructions in to your package of choice.


    Though shots with a Noir through an IR filter will be particularly interesting
    in colour, you will need to get rid of all that colour, so your first job is to
    convert the colour photography to a genuine black and white (i grey). Next, because
    IR filters often look like lacklust entirely, you will probably need to increase
    the brightness and the contrast, but to experiment to find the look that''s right
    for you.'
