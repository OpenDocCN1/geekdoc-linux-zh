  md: '# # OpenSource


    8 News & Opinion | 12 Interview | 96 FileSilo


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_7_0.png)


    # ## SMALL COMPUTING


    # ## Arduino settles its ownership in safe hands


    **Ownership of the firm behind the Arduino development boards, Arduino AG, has
    finally been sold.** A buyout of €6M by a company started by co-founders Musto
    — Massimo Banzi, David Quartarelli, David Melis and Tom Ive — means concerns Musto''s
    actions raised by former CEO Federico Muzusto have lasted two years. The community
    had become increasingly unhappy with the lack of progress and reports of open
    source licences being misused along with code and schemes. With Musto''s PhD from
    MIT questioned, it himself seemed as though Arduino had flipped from ''company''
    to ''laundering stock''.

    \Dr Fabio Valio, who was excited by the deal, said, ''The new C.O. is thrilled
    to be joined by Joao Melagno, the co-founders and the amazing Arduino team as
    CEO,'' ''In the first two years, we have worked hard to get to this point.''


    We envision a future in which Arduino will allow for wiring recipes to democratize
    the Internet of Things for individuals, educators, professionals and businesses.


    As things stand, many online resellers are selling third-party versions of Arduino
    or their own versions. This is due to large legal issues regarding the Arduino
    name, restrictive contracts and the control of trademark.


    Going forward, Arduino faces challenges if it wants to stay competitive and maintain
    the quality of material that is to be made: Arduino code or the community?


    While the reaction from people remains positive, the hardware maker community
    is under no ideas as to what this development really means.

    At present, there are two websites (cc and org), competing social media accounts,
    multiple product lines that need merging,


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_7_1.png)


    **Above The expectation is that BCM''s buyout highlights a bright new day for
    Arduino, but there is still much to fix**


    Jobs been advertised with companies and a number of ''out of stock'' items to
    be distributed and manured next week.


    In short, the world of Arduino is a mess. A massive job is on its hands to regain
    stability. Although remains popular among enthusiasts and makers, it has lost
    ground to its competitors: the Raspberry Pi is hugely popular in schools, while
    the BBC micro — direct competitor — has overtaken Arduino in the educational field.
    It may be before Arduino can reclaim the confidence of the people who make awesome
    things with their own product.'
