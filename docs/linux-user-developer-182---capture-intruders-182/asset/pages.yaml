  md: '# Speaker pHAT


    # Getting started with the Pimoroni Speaker pHAT


    Add audio to your Raspberry Pi via the Speaker pHAT. Set up the hardware, install
    the libraries and bang out some tunes


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_73_0.png)


    # Dan Aldred


    is a Raspberry Pi enthusiast, teacher and coder who enjoys creating new projects
    and hacks to inspire others to start learning.


    # Resources


    +   - Pimoroni Speaker pHAT http://bit.ly/SpeakerpHAT

    - Hammer headers (optional) http://bit.ly/HammerHeaders


    The Raspberry Zero is awesome. However, it lacks on the ''go'' audio solution.
    Worry no longer, as Pimoroni has introduced an o10-style boombox known as the
    Speaker pHAT. It is a DAC and audio amplifier, a tiny 8 W speaker and a 10 LED
    bar graph all on one little pHAT. A complete solution to add audio to your Pi,
    it is compatible with all models.


    Now you can curate music, notifications, and sound into all your projects. It
    is a complete kit, and this tutorial walks you through how to set up and prepare
    the hardware; the installation of the software; how to adjust and align the volume
    setting; and finally, for those who want to, how to customise and control the
    LED indicator.


    Because the hardware is designed specifically for the Raspberry Pi Zero, there
    are a number of elements to consider. The DAC sums the two channels to mono, rather
    than just outputting one channel or the other, meaning that you get both channels
    of audio out of the speaker pHAT. Second, the dimensions of an assembly are 10mm
    x 65mm x 30mm; this means that it will not fit on top of a PiBow Core or PiBow
    Zero case due to the height of the speaker. Finally, the install knocks out the
    HDMI audio and routes it all through the preferred speaker.


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_73_1.png)


    # 01 Solder the board


    Start by soldering the GPIO header onto the Speaker pHAT. Ensure that the header
    is kept securely in place. You can use masking tape - don''t use if you want to
    solder the first pins Begin by aligning the corner pins; you can then remove the
    tape. Solder the two corner pins to anchor the header in place, before soldering
    the rest of the pins.


    # 02 Go solderless


    If you''re not used to soldering anything, you can add the required pins using
    ''hammer headers''. These come in both male and female versions and use ''crafty
    little n'' to grip tightly into the holes on the'
