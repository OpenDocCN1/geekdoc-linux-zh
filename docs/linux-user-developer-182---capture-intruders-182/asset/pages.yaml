  md: '# Tutorial


    # Pi NoIR


    # The art of infrared photos


    Discover the stunning but bizarre world of photographing the invisible with the
    Raspberry Pi and NoIR camera


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_75_0.png)


    Mike Bedford

    has an MSc in Computer Science and currently - works as a senior research fellow
    for the University of Exeter. He''s also a keen landscape photographer.


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_75_1.png)


    # Resources


    +   - Raspberry Pi - any model with a CSI camera port

    - Pi NoIR v2 Camera Module http://bit.ly/PiNoIR2

    - Camera adapter for using with Pi Zero

    - Ada TFT + 2.8-inch Touchscreen - version for Raspberry Pi http://bit.ly/PiTFTPlus

    - USB power adapter

    - R72 infrared filter or equivalent

    - Case & mounting hardware


    Although we can''t see it, infrared is all around us. If our eyes were like infrared,
    we would be able to see the world different way and we could perceive that we
    might see things in totally unknown colours.


    Even though it''s impossible to see it, glass lenses are able to focus infrared
    (IR) and the CCDs in cameras are sensitive to it, so digital cameras that all
    have to take IR out with filters aren''t quite simple with an ordinary camera,
    but the Raspberry Pi''s NoIR provides an ideal solution.


    Despite this, it''s worth considering why we might want to shoot in IR. In fact,
    conventional infrared photography is black and white, which has its own unique
    appeal. While black and white photography captures foliage in grey, the part of
    IR that has a much higher contrast, which makes for dramatic shots. The leaves
    on trees appear brilliantly white, to the point that they seem to be glowing.
    Blue skies appear virtually black, a cloudy sky looks ethereal or otherworldly.


    The snag with using ordinary cameras for the infrared is that manufacturers do
    best to prevent their cameras from responding to IR. Because


    the presence of IR would cause colours to look unnatural, an IR blocking filter
    would block out the CCD so that it can only record visible light. However, that
    filter isn''t 100% efficient so, to varying degrees, ordinary cameras are able
    to record IR, albeit with much less sensitivity than they have light.


    # The challenge of infrared


    To take a photograph in IR, it''s necessary to exclude all visible light which
    would, interfere with the IR filter. Using such a filter is often referred to
    as an IR filter, but a more accurately passed IR filter would differentiate it
    from an IR blocking filter. However, the main problem is that the IR is let out
    by the filter, and with such high speed light it reaches the CCD. The more that
    the camera has to process, the more noisy the image is, and even the exposure
    time is likely to be several seconds, even on a sunny day.


    Despite the difficulties of using ordinary cameras, an ideal solution is available
    to Raspberry Pi in the form of the NoIR camera. NoIR has no filter, it doesn''t
    have the IR blocking filter, and it''s mostly used in conjunction with LEDs for
    night-time security applications, it''s also ideally suited to daylight infrared
    photography.


    76'
