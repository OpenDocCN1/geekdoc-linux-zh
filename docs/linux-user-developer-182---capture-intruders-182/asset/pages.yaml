    # QUICK GUIDE


    # Honeypots: What are the ethical and legal issues?


    There is some concerns about the ethics and legality of using honepots. Some say
    honepots help security, since they can help attackers practise and learn new techniques
    and improve their skills for attack. Some consider honepots as illegal, if the
    honeynet infrastructure is built intentionally as an ''trap'' to catch attackers.
    Some consider it illegal because accessing your honeypot could have legal rights
    (depending the country where you place the honeypot) and the information that
    you gather from the attacker.


    It''s important to distinguish between types of information collection: connection
    data is the most important as it contains personal information such as chats and
    emails met by the attacker. Connection data is related to the connection information,
    such as IP address, data time, and so on to avoid legal issues. Your honeypot
    should be deployed for investigation or to protect your organisation. Another
    good idea is to place a warning banner that your site is being monitored.


