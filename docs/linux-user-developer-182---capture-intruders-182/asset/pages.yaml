    > For a better understanding of the honeypot concept, let''s install an example
    with a medium-interaction level. On this occasion we''re using Kippo, because
    it is an easy and educational way to understand the basics of how some honeypot
    layout works. Kippo is easy to deploy, and many honeypots are based on Kippo design,
    such as Cover (see p26). Kippo works on many Linux distributions, but Ubuntu 16.04
    was used for these examples.


    #  QUICK GUIDE


    # What is Kippo?


    Kippo is an SSH server that''s available on the internet with a root password
    that is discoverable, e.g. 12346. Kippo is written in Python and twisted with
    a library developed by Mit. Kippo logs all the attempts to fail the SSH service,
    including brute-force attacks that may be performed by the attacker. It stores
    all typed commands and files uploaded to the.


    # Install Kippo and setup


    There are several ways to install Kippo on our computer. But first you will need
    to install some dependencies to meet the requirements:


    ```

    apt-get install one-dev openssl python-openssl-pyyaml python-twisted

    ```


    One way to install Kippo is to download it directly from the GitHub repository
    using:


    ```

    git clone https://github.com/desaster/kippo

    ```


    You can also install Kippo by Subversion. If you don''t have it, use type apt-get
    install subversion and then download the latest version with:


    Don''t forget to change your location to the directory where Kippo was installed


    First, let''s check Kippo''s configuration. The key file it sets provides flexibility
    and personalisation of the final setup. The config file is called kippo.conf and
    remembered as Kippo has been set on port 2223. Later, an iptables rule will be
    needed to forward all the traffic that goes to port 22 to 2223. In this way, an
    attacker who finds your IP address will find an SSH server on port 22 that is
    really Kippo''s.


    ```

    svn checkout http://github.google.com/svn/trunk/ /kippo

    ```


    ```

    [sudo] iptables -t nat PREROUTING -p tcp --dport 22 -J REDIRECT --to-port 2223

    ```'
