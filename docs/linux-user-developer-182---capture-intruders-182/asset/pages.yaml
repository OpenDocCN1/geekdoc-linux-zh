    To create a 4GB swap file for example, you would do the following: create the
    file with sudo fallocate -l 4G /swapfile, change file permissions with sudo chmod
    600 /swapfile. Tell the system to use the swap file with swapon /swapfile. To
    enable this on each reboot, you may need to add a line to /etc/fstab with the
