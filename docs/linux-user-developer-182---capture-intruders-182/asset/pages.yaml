    a similar utility, but updates are regularly inconvenient. After installing Ext2fs
    from source (github.com/ext2fs/ext2fs) you can mount the partitions. This allows
    you to manage all files, including creating, deleting, and hiding of files with
    specific prefixes or suffixes. In order to avoid accidentally damaging your Linux
    file systems, it''s wise to only allow read-access unless you need to write files
    to them.


