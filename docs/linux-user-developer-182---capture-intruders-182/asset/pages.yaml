    # GROUP TEST


    # Advanced text editors


    Think a text editor is for punching out words? Think again


    # gedit


    The default text editor in GNOME and GNOME-based distributions, most of us probably
    just use it to edit configuration files. It looks too plain and barebones, but
    don''t let that fool you. Behind its simple-looking facade is enough powerful
    features to pose a serious threat to the others.

    http://bit.ly/Gedit-app


    # jEdit


    In Java, the cross-platform text editor edit claims to possess features that will
    put many expensive development tools to shame. With its initial release back in
    1998, jEdit still manages to keep based on challengers and justify its tag as
    a programmer''s text editor?

    www.jedit.com


    # Kate


    What gedit is to GNOME, Kate is to the KDE desktop environment has been part of
    KDE since v2.2 released in 2001. It identifies itself as an advanced text editor,
    which tells us it gets the features we need but do features come at the expense
    of usability?

    https://kate-editor.org


    # Sublime Text


    We''ve got a popularity in this test only because of its excellent reputation.
    A favourite of virtually all developer buddies, the makers of the editor requests
    users to purchase a license but magnanimously do not enforce a time limit on the
    testing period.


