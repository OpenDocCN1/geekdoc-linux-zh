  md: '(e.g., a laptop''s NVMe disk, our Wi-Fi chipset, headphone jack detecting the
    insertion of headphones and so on). Traditionally, the kernel manages low power
    state transitions based solely on the predicted next timer. Contemporary ‘NOHOZ’
    kernel removes the 1,000 times per second (on architectural timer) ''tick'' and
    instead allows one to occur when the kernel actually needs to plan ahead for some
