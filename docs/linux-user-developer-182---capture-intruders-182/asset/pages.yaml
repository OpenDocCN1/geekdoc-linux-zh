    # WEBSITE TRAFFIC ANALYTICS


    # Piwik 3.0.4


    Track visitors without giving away their data


    When it comes to web analytics, there''s an alternative to passing all your more
    info to Google. Piwik is a mature and well-documented free open source LAMP app,
    backed by managed hosting and other connections. Download it and get set up in
    just a five-minute install, which involves setting up the data collector and testing
    it out. Once you are up and running, you''ll have to wait to track your analytics
    with a dashboard. Ten minutes of web traffic won''t go on—connect the next day
    and you''ll have the last 24 hours'' traffic, with a dashboard that has some resemblance
    to Google.


    The dashboard is enhanced with more widgets, allowing you to choose and customise
    the rest of it. For clear goals, you can build conversion goals for visitor analytics.
    Take a look at how visitors are finding your site. Actions is full of showing
    you how your audience interacts with the site. ''Vistors'' will show you even
