  md: '# Creating your own cascades


    While there are several pre-made cascades for identifying objects, you can create
    your own cascade that will identify some particular object you want. This is a
    time-consuming process, so you should try an initial search first, if you find
    it too difficult, refer to OpenCV for more detailed instructions at http://opencv.org/cascades.
    OpenCV contains a set of utility functions that can help you create a cascade
    file. Here I will only be able to give a basic overview. The first item you need
    is a collection of negative images that do not contain the object you want to
    find. This file contains all the image filenames, one per line. You will also
    need a collection of positive images, which should be in a second file, with each
    line containing the image filename and the coordinates of a bounding object around
    the object. All these images need to be processed to create a vector file. The
    following command generates the data:


    The initial location of interest is given by the values of cv.w and h. As we''re
    using Numpy in the third line of code, you''ll need to add the following line
    to the top of your program:


    +   - video_camera = cv2.

    - VideoCapture(0)

    - return_status, curr_image = video_camera.read()


    The first line connects to the USB camera. The next line reads the next frame
    from the video stream. It not returns the image data, but also the status. This
    is used to tell whether we are out of image frames, which can happen if we''re
    reading from a video stream. Since we''re using a loop for this work each frame
    can then be processed in the same way we need to clean up. The following code
    makes that everything gets shut down.


    +   - import numpy as np


    You also need some kind of termination condition so that it stops when it finds
    enough objects. The following code sets the termination condition to be at least
    one positive:


    +   - term_criteria = cv2.TERM_CRITERIA | cv2.TERM_MAX_COUNT, 10, 1


    Once everything is initialized, you can start looping through the frames in video
    and tracking your object''s movement with the following:


    ```

    ret, curr_image = video_camera.read()

    gray = cv2.cvtColor(curr_image, cv2.COLOR_BGR2GRAY)

    hist = cv2.calcHist([gray], [0], None, [256], [0, 256])

    hist = cv2.normalize(hist, None, 0, 255, cv2.NORM_MINMAX)

    ret, window = cv2.meanShift(hist, roi, window, term_criteria)

    ```


    All of this is for identifying objects within an image or video stream. We need
    to monitor this object as it moves across the area of interest. If you want to
    use this code to find a face you will need to set an initial location with the
    object you found using the cursor, or by using a hard-coded coordinates. The first
