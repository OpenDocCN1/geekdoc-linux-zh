  md: '# WEB


    # Firefox floanders market share drops


    Is Firefox about to go the same way as Netscape?


    It''s one of the older browsers still there, but things aren''t looking great
    for the desktop version of Mozilla. Recent figures from StatCounter by former
    Mozilla CTO Andreas Gal''s research show that the number of Active Daily Installs
    of Firefox has fallen heavily since 2016 with a small recovery thereafter.


    Gal''s research shows that the desktop browser - at time a very popular alternative
    to the dominant Internet Explorer, and a regularly installed piece of software
    - is "falling off a cliff," says Gal.


    Google''s aggressive marketing of its Chromium-based browser via every service
    including Google Drive is also pulling users with the promised improved performance
    and functionality. For a high-profile competitor such as Mozilla Firefox, this
    is bad.


    > "Firefox Desktop is probably headed for extinction over the next couple [of]
    years," says Gal. "Today it is still a couple used by 90 million people."


    Fortunately, it isn''t all bad. 90 million is more than Mozilla is expanding on
    mobile. While figures for iOS, Firefox on Android are increasing, gaining 40 million
    users in 2014. Now, then, can we keep Firefox rising again? After all, open source
    rarely lasts, does it?


    # DEVELOPMENT


    # Linux ''apps'' in Windows 10 Store


    # Pseudo-surreal continuity


    Microsoft has announced that Windows 10 Pro users will be able to use the new
    Windows Store to install Ubuntu (using openSUSE) for a development environment,
    in an extension of the Linux subsystem for as of late 2016.


    Apps are not in Windows Home, but if you''re running Windows 10 Home, your PC
    will need to be upgraded to Windows 10 Pro, for users who aren''t Preview members
    will be pleased to know that Ubuntu will be available to them from September 2017.


    Rather than a free distro, openSUSE offers an affordable environment with various
    terminal tools. For instance, the Windows Store for Ubuntu allows us to use Ubuntu
    Terminal and run command-line applications including Bash, SSH, and many more.


    Bash scripts are also supported, helping to provide an environment that developers
    can use without the overhead of a virtual machine or a dual-boot system.


