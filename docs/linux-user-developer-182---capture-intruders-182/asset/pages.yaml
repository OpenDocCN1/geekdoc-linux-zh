  md: '# What’s covered in this feature


    +   - Prepare your system, p56

    Start with a box-fresh computer and set up your disk for multiple Linux distribution
    installations.


    +   - Dual to triple, p56-57

    Create space, get Linux installer to set your distro and configure your UEFI and
    Secure Boot.


    +   - Manage bootloaders, p60

    Use boot-repair or the GRUB rescue prompt to restore your menu and creating a
    virtual disk for virtualising Linux.


    +   - Manage partitioning, p57

    How should you slice up your disk and how do you do it? We’ll show you.


    +   - Share your drives, p58

    Use GParted to setup your shared space and get your UID and GID in order.


    +   - Grub tips and tweaks, p60

    Handy tools for working with and customising the GRUB menu.


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_54_0.png)


    Although it is possible to buy Linux laptops nowadays, most users are prefer to
    start with Windows and add Linux afterwards. Regardless of whether you intend
    to use Windows or not, having OS on board for likes BIOS, rebooting if you come
    to set up the machine or other just isn''t available for our favourite method.
    The common approach to this scenario is to use dual-booting, with easy switch.
    If you are comfortable with dual-booting and have enough disk space, the option
    of triple-booting provides an easy way to try new distributions, updated versions
    or just something without impacting your OS, potentially leaving you unable to.

    Setting up multi-boot system is not straightforward and along the way, you may
    encounter a few issues and queries, but we’ll help you explore the process. With
    some of the leading tools for preparing your hard disk (partitioning, bootloader
    and installation) and understanding of technologies such as UEFI and Secure Boot,
    discussed later in this feature, you’ll be well prepared to handle most of the
    problems. Also, if you are changing the partition layout and fundamental operation


    of your machine, then you should back up any valuable data, first as things come
    anyway.

    How frequently configure your dual-boot setup depends on how you intend to use
    it. Installations can either be completely independently separated to match the
    order of operating systems you want to run, or you can set shared space between
    them. If you frequently switch between Windows and Linux, you may have already
    a shared partition or a dedicated partition for your home directory, from where
    you can access actual user home directory (which you will need to keep a close
    eye on what’s going on when switching). Using the ‘separate partition method’
    may add an additional degree of isolation for your data should a partition restart.

    If you have limited space on the size of your disk you can also use a USB (in
    sufficient capacity), without running either the OSes or the shared partition
    from external storage. This method is recommended, although a number of manufacturers
    do not support booting from USB 3.0 or an SD card if your computer has a high-speed
    SD card slot.


