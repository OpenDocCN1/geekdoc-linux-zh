- pgno: 81
  md: '# Advanced text editors


    # gedit


    Does it make sense on non-GNOME desktop environments or at all?


    # jEdit


    A text editor or an IDE? Its busy interface might put some off


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_81_0.png)


    Gedit has a Python plug-in that allows you to test Python code from the editor


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_81_1.png)


    Install the SideKick plug-in to enable several language-specific features such
    as a tree structure dock


    # Advanced editing functions


    Gedit supports undo and redo actions as well as search and replace. It can display
    search markers and be set to auto-save documents at regular intervals. The editor
    has full support for UTF-8 and can check-documents in multiple languages. You
    can use gedit to access and edit remote files as.


    In addition to undo/redo, jEdit offers an unlimited number of clipboards, which
    it calls registers. You can copy snippets of text between registers and across
    editing sessions. It can also record macros from user actions and a plug-in can
    download macros from jEdit''s website.


    # Programming language support


    Gedit has code-editing functions including the ability to match brackets and automatically
    indent code. The editor also has support for various programming languages including
    C, C++, Java, HTML, XML, Python and many others. It allows easy navigation by
    line numbers and lets you jump to a particular line.


    jEdit supports and highlights modes for over 200 programming languages, from Assembly
    to Python. It offers the same features as its peer, including auto indent, bracket
    matching and code folding, some of which are enabled by default. The editor can
    also indent the indent of a selected block.


    # Plug-ins and add-ons


    Gedit comes with a number of plug-ins, although not all of them are enabled by
    default. You can download more with the gedit plugins, including packages, multi-edit
    and work completion. The project''s website also points to find third-party plug-ins
    on their compatibility with the gedit engine.


    jEdit has an impressive plug-in framework, with over 200 available. A couple of
    our favourites are the Android plug, which provides utilities to work on Android
    projects, and the Tomcat-plug, which you can use to create and edit an external
    Jakarta Tomcat process. You can install these using jEdit''s package manager.


    # Usability


    Thanks to its plain-like interface with minimal menus and buttons, the app doesn''t
    pose a basic learning curve for first-time users. Advanced users can enable plug-ins
    to make it more productive for their particular requirements. The app will detect
    when a file is modified by another application and will offer to reload that file.


    # Usability


    Unlike the other editors in this group, jEdit''s interface is rather busy and
    might disorient a new user. Also, some of its features, like code folding, are
    enabled by default, which means you''ll have to venture into its settings manager
    to get the most out of the tool.


    # Overall


    > Gedit is a very mellow editor that is a commendable job in supporting a wide
    variety of features, especially for programmers, without overwhelming the user.


    > It takes some time getting familiar with the editor because of all the buttons
    and extensive menus, a good thing is that it leads to documentation and you''ll
    find yourself referring to it quite often.'
