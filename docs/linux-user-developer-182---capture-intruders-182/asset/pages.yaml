  md: '# INTERVIEW SYSTEM76


    # The rebel-rousers of open source


    System76, a company known for its quality Ubuntu laptops and desktops, is on the
    cusp of significant growth as it takes manufacturing-in-house and pursues its
    long-term holistic vision of open source software running on open hardware


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_11_0.png)


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_11_1.png)


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_11_2.png)


    Carl Richtelt is the co-founder of System76, a value-added computer reseller that
    supplies desktops, laptops and servers enrolled with Ubuntu.


    I also thought the Linux desktop had surpassed Windows in most ways and deserved
    a dedicated PC manufacturer. We wanted to be the representatives of open source.
    We wanted to show people, how incredible Linux actually was. We didn''t choose
    Linux because it was difficult; We chose it because it was better.


    What was your vision back then and how has that changed?


    It''s 2005 and you''ve just formed System76. The resell market isn''t for the
