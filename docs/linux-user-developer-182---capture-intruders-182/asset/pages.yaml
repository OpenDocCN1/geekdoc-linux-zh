    # OPINION


    # The kernel column


    Jon Masters summarizes the latest happenings in the kernel community as Linus
    Torvalds closes the merge window for Linux 4.13


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_15_0.png)


    Linus Torvalds announced Linux kernel release 4.13-rc3, following development.
    The release, as usual, combines many new features and drivers. Among these are
    updates to two different groups: next interrupt prediction (laptop-usop), and
    large storage work (for servers). Other changes include ''labelling'' in AppArmor
    patches, and a general patch to help Ubuntu''s AppArmor ''upstreamed'' into Linux.


    It''s hardly time a maintainer has been caught out in this way.


    Predicting the wakes

    Daniel Lezcano (of Linux) has been working on IRQ-based prediction for a number
    of years, evolving what (at first) seems like a simple idea into many layers of
    its implementation. As it comes, the idea of Lezcano''s work is to refactor the
    kernel plans ahead of wake-ups caused by external interactions. With a laptop''s
    battery power source, a great amount of effort is invested in ensuring system
    components are idle at any time. The number of external devices (such as Wi-Fi
    chips) is as much but it is the cost of the application processor cores.


    Jon Masters

    is a Linux kernel hacker who has been working on Linux for more than twenty years,
    since he first started at the age of 13. He joined Linus in Melbourne, for a large
    enterprise vendor, where he has been responsible for the development of strategies
    for efficient ARM-powered servers.


    The final kernel also includes a TLS implementation to natively handle encrypted
    HTTPS connections. Connections for this include hardware, network packet filtering
    and kernel-space crypto. For user-level services, there are many users who want
    the kernel to be a built-in editor, email client or XML parser. This user is happy
    to report that in the past, the Linux kernel doesn''t have Vim, Sublime, or VS
    Code built-in—but there''s just a way.


    One thing 4.13 is much less in the way of RDMA. The kernel RDMA (remote memory
    access) stack provides the infrastructure required for low-latency performance
    networking, such as InfiniBand (IB) and OmniPath. RDMA allows user-space applications
    to quickly copy data from an application running on a remote system, without multiple
    layers of copy through the kernel on both ends. Unfortunately, the RDMA maintainer
    was caught off guard by Linus reverting to his (more typical) weeks of RC kernels
    to 4.12 rather than reaching RC8. This meant that many people who were scheduled
    for holidays and vacations this time.


    Some is atomic, some kernel controlled. On the kernel-controlled side, Linux uses
    the ''cpuidframe'' and its governors to inform how it should handle wake-ups.
    In low-power state, the kernel kernel which handles the waking of ''task-runqueues''
    (and processes) has been reverted to a more proactive effort in saving energy.
    The trend is toward integrating cpuid time with the scheduler, providing hardware
    and software interfaces to prevent likely sources caused by external interaction
    applying applications from waking them from lower power states. All of this can
    be more carefully orchestrated to save energy with awareness of the system''s
    operating constraints.


    Typically, application cores are woken up from lower power states by one of two:
    the periodic timer ''tick'' interrupt source (used to schedule kernel-background
    activities), and interrupts from hardware devices


