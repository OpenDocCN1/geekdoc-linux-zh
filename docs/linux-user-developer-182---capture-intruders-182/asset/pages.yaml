    # Deal with time issues


    If you are frequently switching between Linux and Windows, you may find strange
    things happening with your clock; it might be an hour off each time. This happens
    because Linux time is based on UTC, while Windows bases its time on your local
    time. The easiest way to fix this is to set Windows to use UTC time; navigate
    to HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\TimeZoneInformation and
    give it the value 1. After rebooting, your clocks should now be in sync. From
    this one, which you


