    T-Pot: the multi-platform honeypot system


    Welcome to your shiny new toy: T-Pot 16.10!


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_27_2.png)


    01 Introducing T-Pot

    T-Pot combines honeypots Conot, Cowie, Dionsea, Elastic, Emobility, Glastof and
    honeytrap with Suricata (a network-monitoring security engine). It visualises
    the collected data with ELK stack, which is a beautiful visualisation engine (search,
    Logstash and Kibana). T-Pot runs every time you run it in a Docker container for
    free.


    ## Why MKZ? Difference with service

    ## Please choose your install type and let us know if you have any questionsnConot,
    Cowie, Dionsea, Elastic, Glastof, honeytrap with Suricata (a network-monitoring
    security engine) and ELK stack for visualization


    # 02 Requirements and installation


    T-Pot can be installed on a single computer or in a VM using different setups.
    To avoid issues during installation ensure your system meets 4GB RAM (recommended),
    64GB disk (128GB recommended) and a working internet connection. Installing T-Pot
    is just: download the file from https://github.com/kompot/t-honeypot and run it
    on your designated setup.


    # 03 Running T-Pot


    The installation takes about 30 minutes. You will be the user and you have to
    choose the password during the setup. All honeypots, depending on the type of
    setup chosen, will install automatically. To access T-Pot from the browser, type:
    https://<your-ip>:443 in your web browser. Head to https://github.com/ditag-dev-sec/tpot
    for more details.


    +   * Cowie is a good learning environment. It is one of the most-used honeypots
    for a long time now, but it''s not regularly updated, the chances of it being
    detected by an attacker are greater. With these concepts, we need a more secure
    environment, so let''s move on to Cowie. For beginners Cowie is very easy because
    it''s a copy of Kipp-Pot. In Cowie, have provides a lot of new features such as
    SFTP and SFTP file uploads. Since it supports SSH, JSON log format for logs and
    more. Cowie is regularly updated and freshly patched, and Cowie is somewhat similar
    to the Kipp-Pot, it is 100 percent compatible with Cowie-script.


