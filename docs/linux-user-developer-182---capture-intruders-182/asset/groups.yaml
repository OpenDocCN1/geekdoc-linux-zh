    have been rebuilt with GCC 7.0. The highlight of this is light feature; similar
    to the Windows 10 bluetooth fighter, this strains your eyes by slightly adjusting
    the brightness of the screen depending on the time of day. Other information at
    the bottom of the calendar is revealed when you click the clock in the notifications.
