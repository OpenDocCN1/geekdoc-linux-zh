    The new partitioning tool will help you with point. If you have multiple graphics
    cards, you can choose which to launch an application by right-clicking on it.
    The feature is exposed lately in the right-click menu for everything installed.
    Package management has also been improved behind the scenes with the introduction
    of dnf 2. This release of the successor to Yum further fixes the incompatibilities
    between the two package management systems, buffering a user experience improvements
    a majority of the changes underneath the surfaces.


    On the heels of the main release, the desktop team plans to release a preview
    of the Modular release of the server edition. The goal of the Fedora Modularity
    workshop is to increase flexibility to meet goals. For example, you can have a
    server with a database on top of the new kernel. This release brings some improvements.
    For starters, while you could manage containers with Kubernetes in earlier releases
    as well as installing it with dnf, starting with a single command like any other
    Docker command. Talking of Docker, the OverlayFS default storage option for Docker
    containers is now provided by the Overlay2 driver instead of devmapper.


    Michael Shorne


    An upgrade for Ubuntu 26 seems to be easy to take the challenge which will eventually
    come to the GNOME desktop.


