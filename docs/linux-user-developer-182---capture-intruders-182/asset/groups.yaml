    > 由于所有的按钮和广泛的菜单，需要一些时间来熟悉编辑器，很好的一点是它可以引导文档，你会发现自己经常参考它。


    ## Kate

    另一个在默认桌面之外寻找用户的编辑器


    ## Sublime Text

    与其说它是“高雅”（sublime），不如说是“超现实”，它拥有更令人震撼的功能

    ![](img/1fdb1204e7e4788f3fb478a4ef813223_82_0.png)

    由于 Kate 的项目管理能力，你可以使用它来协作处理复杂的编程项目。


    ## 高级文本编辑功能

    Kate 可以打开许多文件并对文档进行扫描检查。对于长文件的导航，编辑器允许用户跳转到文件的任何位置，并在右侧包含一个微地图。它具有自动完成单词的功能，还可以自定义文本选择。


    ## 编辑功能

    Sublime 拥有所有的文本编辑功能，包括自动保存和段落格式化。此外，它具有查找和替换字符以及行号的功能。它提供了选择非连续跨度的功能。


    ## 编程语言支持

    Kate 可以对超过 160 种语言进行语法高亮，并提供括号匹配和自动缩进等便利功能。它支持 Git、Subversion 和 Mercurial 版本控制，并提供项目管理。你可以通过插件启用构建系统。


    ## 编程语言支持

    就像 Kate 一样，Sublime 从编辑器本身支持许多语言——如 C++、Python 和 Ruby。它在相当直观的界面内置了一些令人震撼的功能。（等等，重复了）


    ## 插件和附加组件

    Kate 允许内置插件。与 jEdit 不同，它仅包含 20 个插件，但这些插件非常有用。此外，编辑器提供了令人深刻的项目插件，其中一些对于需要增强型终端、能够编译调试以及在各种数据集上执行脚本的开发者非常有用。


    '
