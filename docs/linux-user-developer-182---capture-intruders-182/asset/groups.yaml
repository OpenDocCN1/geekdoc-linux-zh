    # 高级文本编辑器


    ## 简述：我们的评测对比与总结


    | 高级文本编辑功能 | 对用户而言，它不仅仅是一个平庸的编辑器，支持相当多的功能。 | 它的文本编辑功能不会让你失望，包括撤销/重做和剪贴板。 | 这是最让长文档导航变得的编辑器之一。
    | 它提供的编辑功能比你在其他所有领域找到的还要。 |

    | 编程语言支持 | 具有一些使其对偶尔轻量级编程很有用的功能。 | 拥有你想要的所有功能，尽管某些功能未开启。 | 支持的功能足以让它成为你的首选 IDE。
    | 得益于其代码编译功能，Sublime 可以轻松取代它。 |

    | 插件和加载项 | 你可以通过官方和第三方插件轻松增强它的功能。 | 支持最大的插件集，包括一些非常实用的插件。 | Kate 提供的插件有限，但它们都很有用。
    | 拥有大量未修改的插件，易于搜索且实用。 |

    | 易用性 | 不会让用户感到畏惧，并适用于特定的工作流。 | 与其他编辑器不同，它没有让人迷失方向的界面。 | 当选择 Kate 时，KDE 用户不需要看其他软件。
    | 直观的引擎，可以根据工作流轻松进行微调。 |

    | 总体 | 鼓励 GNOME 用户仅使用它来完成工作。 | | | | |


    ## 最终获胜者是...


    ### Kate

    竞争者之间的战斗非常胶着，但 Kate 和 Sublime 在几乎所有方面上都优于 gedit。


    gedit 的默认编辑器本身没有问题，但尽管它有许多优点，gedit 仍然处于逊一筹。开箱即用的情况下，Kate 足够多能，并且在各自的插件系统之后得分超过了
    gedit。Sublime 是一个专业的选择界面，支持的功能足以证明其价格的价值（而价格本身就在那里）。它对新用户来说易用，也便于通过微调来测试和编辑代码。其他人可能会喜欢它的片段和宏功能，以确保他们的开发环境。它因其涉及编辑配置文件的架构机制而脱颖而出。我们的评价可能有些严苛，但由于缺乏足够的审查深度，还无法说服我们接受这些开源应用。


    通过淘汰法，冠军归属于 Kate，它提供了最大数量的功能且学习成本最低。


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_83_0.png)


    在非 KDE 桌面安装会安装大量的 KDE 库，但这是值得的

    你可以像使用简单编辑器一样轻松使用它，由于它的管理能力，它可以帮助你开发和处理复杂的编程项目。

    在你恨我为什么没有包含 Emacs 和 Vim（两个最流行的文本编辑器）之前，请注意，它们未被包含是因为几个原因。首先，如果你在使用其他的，你会错过它们。其次，其中某些相对于
    GUI 替代品来说学习曲线非常陡峭，而后者在任何时候都更加直观。


    **Mayank Sharma**


