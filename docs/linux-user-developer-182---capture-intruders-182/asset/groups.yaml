    # 关注我们


    Facebook: facebook.com/LinuxUser

    Twitter: @linuxusermag


    你好。想要树莓派吗？并不是所有人都还想要杂志上那块冰川绿的板了——你也是其中之一吗？


    我们认为新的 GIMP 绝对非常非凡。


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_94_0.png)


    # 精通脚本：开始编写脚本


    通过组合它们（某些 Linux 命令）来学习。


    是新手内容还是没有新手内容？坦率说，这取决于我们哪天查看收件箱，并与远程客户端的汇总进行对比：bash 脚本教程；Java 与人工智能；一份关于《监狱》（Prison）及其专注于安全性的笔记本电脑的报告；以及关于
    Arduino 现状的专题。我们将继续不断产出！


    因为我可能会发现一些从未见过的东西，或者遇到一次就忘记了。有些初级水平软件文章值得一读；入门级编程文章（尤其是 Python）完全符合我的水平，而杂志中的某些内容超出了我的理解范围——并非我们所有人都是如此。我们首次发表了图形软件的文章，如
    Blender、GIMP、Syfig 和 Chrome。要同时涵盖这两种方法需要很多页面，而可以在四页纸内完成。


    # 不要有顾虑


    这封邮件稍微晚了点，但它是为了回应你在 LU180 中提到的关于制作 Linux 的评论。首先，我过去与出版行业有一些渊源，我知道要让每个人都满意有多困难，为那些想当批评者的人找到空间有多么难——毕竟，我刚刚续订了订阅，而且杂志现在的状态对我来说很出众！


    此外，对于一个几乎没有或没有 TT 教育的外外人来说，在我看来，Linux 在新手投入之后对外外人来说其实挺容易的。我现在对 Linux 的了解比大多数 Windows
    用户对他们自己系统的了解还要多（这其中包括我自己吗？），但我仍然发现我们的任何初级水平的文章……


    而且，当专门针对树莓派的文章发表时，难道没有新内容了吗？这种观点可能超出了我的理解范围——我喜欢在夏末和圣诞节带来一个。Mick


    对于大多数读者，但通常我认为他们自己需要专门的出版物。我们经常发表过关于 GIMP 和 Blender 的出版物。事实上，如果我看到我可以做一个并发给你看。


    我们还有其他系列，但我们很快会回到那里的，我保证。几天后继续深入探讨。对于树莓派部分，一旦你有了其他想法，如果你倾向于迷其中，可能会忘记它。这是根据最近调查的印象，关于杂志最喜欢的季节，而上一次对树莓派的“保存”是他们提到阅读的重要组成部分。


    # 发表你的见解！


    通过 linuxuser@futureenet.com给我们我们发邮件


    www.linuxuser.com | 95


    # 近未来小说


    关注我们

    Facebook: facebook.com/LinuxUserUK

    Twitter: @linuxusermag


    # 斯蒂芬·奥拉姆短篇小说


    # 杀手病毒？


    Buller Johnson 是运行在 Johnson 女士生活各个方面的个性化人工智能，它考虑了进来的信息。

    另一个管家，一个陌生人，告诉它根据协议允许访问调节其女主人药物的算法。

    它没有此类协议的记录，但在它崩溃并被强制回到之前的之前的版本时，它丢失了 24 小时的记忆。

    那个陌生人变得异常激动，并不断坚持局势的紧迫性。

    允许访问要么救了 Johnson，要么杀死她。它尝试连接到它的同伴网络。无用——联系方式在崩溃中损坏了，它可以在赛博空间大喊，但它如何知道触发哪种响应呢？

    它必须自己决定。

    陌生人要求访问。

    它运行了协议，研究了结果，并给了陌生人想要的东西，希望这不会因为杀死一个人类而被永久删除。

    它监测着她的健康状况并等待。

    她的手指抽动了一下，她痉挛，仿佛被电击了一样。

    然后什么也没有了。

    它继续监测。

    没有变化。

    咳！Johnson 女士咳嗽并睁开了眼睛。它检查了她的生命体征。她正在康复。通过回复，它邀请陌生人加入它的联系人列表。

    希望这是许多中的一个。


