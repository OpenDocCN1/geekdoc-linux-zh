    # MANAGE VIRTUALBOX FROM THE COMMAND LINE


    Mayank Sharma helps you peel back the window dressing and discover the hidden
    strengths of the popular desktop virtualisation platform.


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_31_0.png)


    VirtualBox is a wonderful application that has democratised virtualisation and
    made enterprise technology accessible to the average desktop user.


    Using the graphical interface, you can run and manage virtual machines with ease.
    Despite being easy to use, VirtualBox packs in some advanced features as well.
    One is its command-line interface which, once mastered, can help you script tasks
    for quicker VM operations.


    There are several advantages to the convenience of the graphical interface of
    VirtualBox. It enables you to run and manage virtual machines (VMs) on a remote
    host. When you''ve got the hang of the CLI, you can use it to script tasks via
    SSH to a remote Linux host. Some of the features of the VirtualBox engine those
    that can''t be accessed from the graphical-end:


    ```bash

    Controller --port 0 --device 0 --type dvddrive --medium /path/to/install.iso

    ```


    VirtualBox supports host guest operating systems, which is to say that you can
    set up virtual machines with predefined settings for OSs. Also, it supports a
    wide range of supported OS. You can then use one of the templates for your VM,
    such as:

    ```bash

    VirtualBox modifyvm --name Debian

    ```

    The modifyvm command is used to change settings of a VM. You can then use it if
    you want to change any characteristic of a VM.


    **KEY INFO**

    VBoxManager is one of the several front-ends with VirtualBox in addition to the
    graphical interface, It is not limited to expose options than that and is also
    used for creation and rollout of VMs.


    ## Command and control


    A regular VirtualBox manager installation will also install the VBoxManage command
    which sets the settings for the VM that follows all VMs (which by default is --virtualbox).
    Next, create a hard disk for the VM with:

    ```bash

    VBoxmanage --filename Debian --size 20480 --format vdi fixed

    ```

    Fixed is used to allocate the entire 20GB disk space. If you want this option,
    the command will be:

    ```bash

    VBoxManage create --name Debian --register

    ```

    Now we''ll add a SATA controller to the VM with:

    ```bash

    VBoxManage storage --name "SATA" --controller add

    ```

    By default it creates an IDE controller. You can specify a different type of controller
    using the --controller option. Once the controller is added, you can attach the
    virtual disk to the controller with:

    ```bash

    VBoxManage storageattach --name "SATA" --controller 0 --type 0 --medium debian.vdi

    ```

    In this step, we''ll add an IDE controller to the guest with a DVD drive. First,
    customise the VM with:

    ```bash

    VBoxManage storagectl --name "IDE" add ide

    ```

    and then insert the ISO image into:

    ```bash

    VBoxManage modifyvm --name Debian --storage IDE:0 --type dvddrive --medium /path/to/iso

    ```

    VirtualBox supports modifyvm --name Debian. Similarly:

    ```bash

    VBoxManage modifyvm --memory 4096

    ```

    sets its RAM and video memory. To attach a network, use:

    ```bash

    VBoxManage modifyvm --nic1 --bridge eth0

    ```

    to connect to the network on the host in bridged mode. Once everything is ready,
    you can now start the virtual machine with:

    ```bash

    VBoxManage start Debian

    ```

    Your VM will now start and is ready. A more useful option is to start the VM in
    headless state. The CLI offers all features, including those that cannot be accessed
    from the graphical-end. The settings for the VM follow all VMs (which by default
    is --virtualbox). Next, create a hard disk for the VM with:

    ```bash

    VBoxmanage --filename Debian --size 20480 --format vdi

    ```


    ## Guest Additions


    For better performance, you''ll want to install a set of system applications and
    drivers inside the VMs. These are bundled in ISO named VirtualBoxAdditions. Once
    you''ve installed the OS on the VM (in our case), you can mount the ISO inside
    the guest in the same fashion:

    ```bash

    VBoxManage storagectl --controller 1 --port 0 --type dvddrive --medium /path/to/guest_additions.iso

    ```

    Switch to the distribution inside the VM and create the directory for mounting
    the guest additions before mounting it:

    ```bash

    sudo mount -o ro /cdrom /mnt

    ```

    Now change to directory /mnt and run the installation with:

    ```bash

    sudo ./VirtualBoxAdditions.run

    ```

    ![](img/1fdb1204e7e4788f3fb478a4ef813223_32_png)


    ## Features


    **QUICK TIP**

    You can start a series of VBoxManage commands in a script with an automated installation,
    such as Red Hat''s Kickstart prepare ready-to-use VMs more efficiently.


    One of the most useful features of Shared Folders lets you share files between
    the guest and host. For example, if you want to share your Music folder with the
    Debian VM you will have to add a shared folder:

    ```bash

    VBoxManage sharedfolder --name Music --hostpath /home/user/music --autoflag

    ```

    Then boot into the machine and create a mount point for the shared folder inside
    the OS:

    ```bash

    mount -t vboxsf -o uid=1000,gid=1000 Music /mnt/music

    ```


    ## Headless


    The VBoxManage start option helps launch a local instance of a VM. If you are
    using the CLI to install a remote installation you''ll want to start a VM in headless
    mode first. You''ll want to install the guest additions and then stream the desktop
    using your app''s VRDP protocol. First, run:

    ```bash

    VBoxManage start Debian --type headless

    ```

    By default VBoxManage listens for connections on port 3389. When you want to connect
    to a remote desktop client, the VRDP protocol is compatible with any RDP client,
    so you can use any viewer to connect to the remote VM. On Linux hosts you can
    install rdp-viewer and run:

    ```bash

    rdp 192.168.1.3

    ```

    Depending on the size of the VM (which includes the hard disk), the process can
    take a while. Also, one of the advantages of exporting a VM as an OVA file is
    portability. You can export the VM into a single file which can then be transferred
    to a different machine with ease.


    ## Switch machines


    Another important administrative task can be easily accomplished from the CLI
    when moving around. VirtualBox allows you to export VMs from a particular machine
    and then easily import into VirtualBox installation on another. Before you export
    the VM, use:

    ```bash

    VBoxManage export debian9 --filename debian9-export.ova

    ```

    to export the VM into a file debian9-export.ova. Once you have exported an OVA
    file, use:

    ```bash

    VBoxManage import debian9-export.ova

    ```

    to import the VM on the new machine, and then start it.


    Another admin task is the ability to shrink the capacity of a virtual disk. This
    is one of the tasks that can be done using only the CLI. Because VirtualBox is
    a wonderful tip to help you manage a remote installation from the browser:

    ```bash

    VBoxManage modifyvm debian9 --resize 40960

    ```

    This will make the 20GB disk grow to 40GB. The reverse, shrinking the size of
    a disk, takes more effort and is risky. First, boot the VM and empty the partition
    table:

    ```bash

    sudo dd if=/dev/zero of=EMPTYfile

    rm -f EMPTYfile

    ```

    Now show the disk and use:

    ```bash

    VBoxManage modifydisk debian9.vdi --compact

    ```

    to reduce the size of disk.


    Another VBoxManage option is control, which lets you tweak the VM while it is
    running. The VBoxManage control debian9 pause command will then reanimate the
    VM. Or you can use VBoxManage:


