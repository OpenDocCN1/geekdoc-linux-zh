    \ blockID:blockType 变量\n\n- woolBlock = 3\n- GreenType = 5\n- YellowType = 4\n\
    - WhiteType = 0\n\n## 我们金字塔上的交替颜色\n\n```\nwoolBlock = 3\nblockType = 0\nGreenType\
    \ = 5\n```\n\n## 埃及风格影响\n\n我们应该在一个位置，根据需要改变金字塔的高度和每行的方块类型来交替颜色。现在是发挥创意产生一些原创东西了。我们非常想看到你的成果，请在\
