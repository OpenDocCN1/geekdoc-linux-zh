    但向安卓 桌面操作系统的进程仍在


    Remix OS 是一款基于 Linux 的桌面系统，它在将 Android 体验引入电脑方面表现出色，但现在将停止支持。它兼容 Intel PC 和 Mac，并基于
    Android x86 项目，尽管如此，该桌面系统仍然拥有系统托盘和任务栏。虽然如果你安装了 Remix OS 仍然可以继续使用，但更新已被取消。


    尽管社区希望 Remix OS 最终能从“优秀”取得进展，但 Jio 已经决定将其重心转向消费者市场。此前，它凭借 Remix Mini（全球首款全安卓 PC）取得了小幅成功，并正试图转向
    Kickstarter 以继续支持 Remix OS ID 和 ID+ 顶盒控制机的开发，这是一种合一游戏设备，看起来是一个有望在 15 日至 8 月期间发行的热门安卓设备。


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_9_0.png)


    但这并不是 Jio 的终点。似乎企业级组织一直在联系 Jio 寻求业务解决方案。他们收到了来自各行业的日益增加的查询，并开始利用软件硬件为他们的组织构建强大的工具。我们认为
    Jio 在变革这些业务运营方式方面扮演着巨大的潜力 [...]。我们决定将公司的精力集中在企业领域 [ ]。


    然而，Android x86 项目仍然活跃 [p8, LUDDI180]，并且它在 6 月发布了 Android 7.0 甜甜版的发布候选版本。此外，Phoenix
    OS (www.phoenix.com/) 仍然是一个选择。


    > 尽管如果你安装了 Remix OS 仍然可以继续使用，但更新已被取消


    ## 网页


    ## Adobe 最终退役 Flash


    未来还会使用 Adobe Flash 吗？别担心，我们不需要知道。自从 Steve 决定在 iPhone 上放弃它之后，Adobe Player 的性能就一直在走坡，但即使有了
    HTML、WebGL 和 Assembly，事实证明 Flash 这一曾经的桌面级移动插件的分发时代将在 2020 年底终结。Adobe 在计算历史中占有一席之地。毕竟，Adobe
    自己的官方博客也宣布：“某些企业和服务已围绕 Flash 构建了业务，包括游戏应用和视频——我们仍致力于支持 Flash Player 应用。”


    Adobe 被许多人讨论，特别是开源社区的人们，因为它为开发者和用户提供了一个长期的迁移计划。现在仍然很容易听到“下周”将会有 Flash 支持，不仅是苹果、谷歌和微软，还有许多仍然流行的
    Facebook 游戏。


    虽然许多人认为 Adobe 仍会一直平稳运行直到它们停止为止，但这家科技巨头采取了出人意料的一步，给出了 Flash 退役的日期。简而言之，开发和支持将结束。


    很大程度上是因为其在闭源创意市场的垄断。


    随着这一最无处不在的专有软件之一走向终，我们可以愉快地期待带有开放插件的开放网络标准。


