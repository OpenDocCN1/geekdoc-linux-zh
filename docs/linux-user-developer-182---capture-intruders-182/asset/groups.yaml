  mdcn: "\nPCB。该套件包含一个完整的安装夹具，其中包含两个亚克力底座。使用两颗尼龙螺钉将你的 Pi 固定在夹具中，并将亚克力顶盖放在其上方并将其敲入。你可以在\
    \ http://bit.ly/HammerHeaders 找到更详尽的指南。\n\n## 03 载扬声器\n\n现在我们将使用八个空槽中的四个，将扬声器连接到\
    \ PHAT 上，使扬声器与 PCB 保持一定的距离。将每个扬声器插入孔中，然后用剩下的四个螺丝将其固定。\n\n## 04 焊接扬声器线\n\n扬声器到位后，使用胶水将扬声器线固定在板卡上。套件带有所需的线材；只需测量长度并裁剪即可。焊接时，将烙铁按在扬声器顶部，然后熔化焊丝连接到\
    \ PHAT 底座底部。对第二个扬声器重复此过程。\n\n## 05 安装软件\n\n对于所有 Pimoroni 产品，安装所需的库并为 Raspberry\
    \ Pi 配置 PHAT 都非常简单。添加电源并启动。（不要在 Pi 运行时添加 PHAT。）\n\n打开终端并运行：`sudo apt-get install\
    \ rpi-speakerphat`。这将开始安装。根据需要按照提供的说明操作。重启后，安装将禁用默认音频驱动。\n\n## 06 播放音频\n\n安装完成后，重启你的\
    \ Raspberry Pi。建议按下键盘上的回车键或输入 `sudo reboot`。你的 Pi 将重启，现在音频将通过 PHAT 输出。要测试这一点，只需打开浏览器并播放视频，或其他带有音频的视频。选择一段合适的视频或歌曲并播放。视频将加载并通过\
    \ PHAT 听到。\n\n## 07 调整音量\n\nPHAT 库的安装将禁用 HDMI/模拟控制以及顶部菜单中的音量控制。你可能需要调整音量到所需的水平。打开终端并输入\
    \ `amixer`。这将显示声卡名为 rpi_berry_dac。使用向上键增加音量，向下键减少音量，直到达到理想水平。\n\n![](img/1fdb1204e7e4788f3fb478a4ef813223_74_0.png)\n\
    \n```\n# sudo apt-get update\n# sudo apt-get install python3-pip\n# sudo apt-get\
    \ install mp321\n```\n\n## 08 播放 MP3\n\n要播放 MP3 文件，我们将使用一个名为 mp321 的程序。打开终端，然后输入\
    \ `sudo apt-get install mp321`。这将下载并安装 mp321。可以从命令行播放 MP3；使用格式为 `mp321 filename_of_mp3`。\n\
    \n## 09 使用 Python 播放 MP3\n\n开始创建一个新文件，然后在文件的顶行添加以下代码：`import mp321, name_of_mp3\
    \ = 'file.mp3'`。这是一个播放文件的 OS 命令。将 `name_of_file.mp3` 替换为你要播放的 MP3 文件名。按 F5 保存并播放音乐文件。\n\
    \n## 10 扩展 PHAT 的 LED\n\n可以控制 PHAT 的 LED。首先，安装 python3-sn328：`sudo apt install\
    \ python3-sn328`。创建一个新文件并输入以下代码：\n\n```python\nfrom speakerphat import clear,\
    \ show, set_led\nfor x in range(10):\n    set_led(x,255)\nshow()\n```\n\n对于 `set_led(index,\
    \ value)` 函数，index 可以是 0-9。保存并运行程序。\n\n> 从 iPhone 或 Android 流传输音乐\n\n可以通过你的 iPhone\
    \ 或 Android 通过 PHAT 流式传输音乐。假设你已经安装了 Rasp，你需要加载干净的 SD 卡镜像。安装所需的库：输入 `sudo apt-get\
    \ install pulseaudio-module-zer`。当询问时，选择 speaker PHAT。最后，将安装允许将音频流到 Raspberry\
    \ Pi 的软件。在你的 Apple 设备上播放音乐，然后点击 AirPlay 图标并选择“Raspberry Pi”。\n\n# 教程\n\n# Pi NoIR\n\
    \n# 红外摄影艺术\n\n使用 Raspberry Pi 和 NoIR 摄像头发现惊人但奇异的世界\n\n![](img/1fdb1204e7e4788f3fb478a4ef813223_75_0.png)\n\
    \nMike Bedford 拥有计算机科学硕士学位，目前担任埃塞大学的高级研究员。他也是一位热衷的光景摄影师。\n\n![](img/1fdb1204e7e4788f3fb478a4ef813223_75_1.png)\n\
    \n# 资源\n\n- 带有 CSI 接口的 Raspberry Pi\n- Pi NoIR v2 模块 http://bit.ly/PiNoIR\n- 用于\
    \ Pi Zero 的摄像头适配器\n- Raspberry Pi 版 2.8 英寸触摸屏 http://bit.ly/PiTFTPlus\n- USB 电源适配器\n\
    - 红外滤波器 R72 或等物\n- 外壳与安装硬件\n\n尽管我们看不到，但红外无处不在。如果我们的眼睛像红外一样，我们就能看到不同的世界。尽管如此，玻璃透镜能够聚焦红外\
    \ (IR)，而 CCD 对红外是敏感的，因此数字相机必须滤掉红外。事实上，红外摄影是黑白的，这有自己的魅力。黑白摄影捕捉的植被在红外下具有更高的对比度，产生了戏剧效果。叶子看起来洁白，以至于显得空灵。蓝天看起来几乎是黑色的。\n\
    \n普通红外相机的障碍在于制造商为了防止相机响应红外。因为红外的存在会导致颜色看起来不自然，因此红外滤镜会阻挡 CCD，使其只能记录可见光。\n\n# 红外的挑战\n\
    \n要在红外下拍摄照片，必须排除所有干扰红外滤镜的可见光。使用此类滤镜通常被称为红外滤镜，但更准确地说是红外截止滤镜。然而，主要问题是红外通过滤镜漏出，并以高速到达\
    \ CCD。相机处理的越多，图像噪声就越大，即使在晴天，曝光时间也可能需要几秒钟。尽管使用普通相机有困难，但 Raspberry Pi 有 NoIR 摄像头这种解决方案。NoIR\
    \ 没有滤波器，通常与 LED 配合用于夜间监控，也适用于白天摄影。\n\n简要提到红外滤波器后，让我们讨论一下选项。红外滤镜允许红外通过而阻挡光，但实际上它们并不简单，因为滤波器的截止值不同。最弱的滤波器在\
    \ 720nm 处截止，这意味着少量红光会通过。这对于大多数情况足够。\n\n# 构建并使用红外摄像头\n\nNoir 摄像头（如 Raspberry Camera\
    \ Module v2）用于固定安装，但对于此应用你需要一个便携单元。要实现这一点，你必须组装带有 Noir 摄像头的 Raspberry Pi，添加电池和电源，并将一切放入外壳中。它还需要一些可以在屏幕上显示的软件。我们的分步指南将教你如何实现这一点，但网上也有其他选择，如果你是一个精通\
    \ Pi 的黑客并喜欢挑战，可能会发现更好的方法。\n\n一旦你组好了套件，就是时候去户外测试红外摄影了。你肯定想要尝试，做得越多，效果就越好。首先，红外最独特的方面是绿色的空灵光泽，因此最好从景观和植物开始。同样，由于这种效果在光良好的情况下明显得多，请选择阳光充足的亮天。高对比度的另一个因素是深蓝色的天空，这在阴天或至少多云的天气下无法实现。虽然相机拍摄的效果通常没有那么理想，但需要一定的数字图像增强。\n\
    \n# 步骤\n\n![](img/1fdb1204e7e4788f3fb478a4ef813223_76_0.png)\n\n## 01 连接 Pi TFT\
    \ 2.8 英寸 Plus\n\n将 TFT 连接到 Raspberry Pi。你需要一些帮助来让它工作；你需要一个带有必要支持的新 Linux 内核。可以从\
    \ Adafruit 网站下载，尽管步骤 2 中的链接包含了此。\n\n## 02 连接 Noir\n\n你需要将 Noir 摄像头连接到 Pi。这是一个非常简单的过程，但没有某些软件你将无法在\
    \ TFT 上预览图像。Adafruit 开发了一个带有相关下载的项目，支持 TFT 以及实现即插即用方案的软件，你可以在 http://bit.ly/DYVP\
    \ 找到。\n\n## 03 添加电源\n\nUSB 电源随处可见，因此你可以通过插拔电源包与 Pi 来开关电源。这是建议的，但你可能需要在电源包和 Pi\
    \ 之间使用开关。\n\n## 04 将所有内容封装为便携单元\n\n该项目最困难的部分是创建一个将所有部件固定在一起的外壳，使单元是便携且易于处理的。最好的方法是找到一个尺寸合适的通用外壳并对其进行改装，为各种组件开孔。\n"
