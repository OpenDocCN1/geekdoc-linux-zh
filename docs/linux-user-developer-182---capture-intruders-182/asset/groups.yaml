    ## Android Desktop Remix OS discontinued


    But the march towards an android desktop os continues


    Remix OS, the Linux-based desktop that did a great job of joining the Android
    experience to computers, is to be discontinued. Compatible with Intel PCs and
    Macs, and based on the Android x86 project, the desktop nevertheless features
    a system tray and taskbar. Although you will be able to use Remix OS if you have
    installed, updates have been cancelled.


