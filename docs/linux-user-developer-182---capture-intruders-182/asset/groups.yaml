    echo "The current working directory is $(pwd)"


    # ### Example: backing up a directory


    As a worked example, let''s create a script that will allow you to create a backup
    of all the files in the working directory. We will make the backup local, so it
    will not protect you against hardware failure (like an accidental delete), but
    if you were planning to move the backup to a different server we would be able
    to recover it if necessary. The shell script itself is provided on the cover disc
    and in the Filesello with it. We will go through the script line-by-line and how
    it works.


    After the shebang /bin/bash, with which we write every script, the first line
    is:


    ```

    mkdir "$HOME/mybackups"

    ```


    This creates a directory named mybackups in your home. There are a couple of things
    to keep in mind. The option -p means that the directory already exists. It is
    also useful for creating an entire nested directory structure; for example, the
    command mkdir a/b/c will create the directories a, b, and c, with b inside a and
    c inside b.


    $HOME is a shell variable that contains your home directory.


    We have started the name .mybackups with a full stop. If you start a file name
    with a full stop, then the file or directory will be hidden. It will not appear
    when you type ls unless you use the -a switch in ls.


    The next step is to create a directory inside your home directory:


    ```

    backup_directory="$HOME/backups_$(date +%)"

    ```


    ```

    mkdir $backup_directory

    ```


    The first line comes up with a name for the backup directory, including the date
    and time that the backup was created, and stores this in a name variable. Note
    that we use double quotes and $( to execute the output of a command in the name.
    In this case, it contains the current date and time. The next line then creates
    that directory.


    Lastly, we copy all the files from the working directory into the new backup directory:


    ```

    cp -r . $backup_directory

    ```


    # ### Create a shell script


    You can run the script by saving the file as backup.sh on your computer and running
    it with the command +x backup.sh in the directory containing the script in order
    to make it executable. If you are in the directory containing the script, you
    can


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_38_0.png)


    Above we used our shell-script skills to write a simple backup script


    /backup.sh to run it. If you want to run it from anywhere, you will need to provide
    the full path to the script to run in, which is not very useful.


    Instead, let''s create a special directory in order to hold this new directory
    inside our home directory:


    ```

    cd $HOME

    mkdir mybackups

    ```


    and copy the script into mybackups. Then, we need to modify the PATH variable
    to allow access to the commands inside mybackups. The PATH is a special variable
    that allows commands in certain directories without having to type their full
    path. If we enter $PATH at the command line, we will see something like this:


    ```

    /usr/sbin:/usr/local/bin:/usr/bin

    ```


    This is a colon-separated list of directories that contain important programs
    such as cp and mkdir. We do not have to use /usr/bin/mkdir if we want to make
    a new backup because /usr/bin is contained in the PATH. We want to add $HOME/mybackups
    to the PATH. To do this, run the following:


    ```

    echo "PATH=$PATH:$HOME/mybackups"

    export PATH

    ```


    $HOME/.profile is a script that runs when you open a terminal. We''ve just added
    a line to the end of the script to add $HOME/mybackups to your PATH.


    Open a new terminal. You should now be able to run the script in any directory
    using backup.sh. If you write your own scripts, then you will have to move them
    to $HOME/mybackups and you will be able to run them by typing their name at the
    command line and pressing Enter'
