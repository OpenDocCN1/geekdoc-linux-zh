    ## 特性 | 三系统启动


    # 三启动

    你的系统


    在计算机上运行多个操作系统可以让你轻松地使用不同的发行版。Paul O''Brien 将向你展示如何进行三系统启动。


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_53_0.png)


    ## 本专题涵盖内容


    - 准备你的系统，p56

    从一台全新的电脑开始，为安装多个 Linux 发行版准备好磁盘空间。


    - 从双启动到三启动，p56-57

    创建空间，获取 Linux 安装程序设置你的发行版，并配置你的 UEFI 和安全启动（Secure Boot）。


    - 管理引导程序，p60

    使用 boot-repair 或 GRUB rescue 提示符恢复菜单，并为虚拟化 Linux 创建虚拟磁盘。


    - 管理分区，p57

    你应该如何划分磁盘？如何操作？我们将向你展示。


    - 共享驱动器，p58

    使用 GParted 设置共享空间，并整理好你的 UID 和 GID。


    - Grub 技巧与调整，p60

    用于处理和自定义 GRUB 菜单的实用工具。


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_54_0.png)


    虽然现在可以买到 Linux 笔记本，但大多数用户倾向于从 Windows 开始，之后添加 Linux。无论你是否打算使用 Windows，为了 BIOS、在设置机器时重启等需求，板载操作系统对于我们最喜欢的方法来说是必不可的。这种场景的常用方法是使用双启动，并进行轻松切换。如果你熟悉双启动并且有足够的磁盘空间，那么三启动的选项提供了一种尝试新发行版、更新版本或在不影响现有操作系统尝试新内容的简单方法，而后者可能会导致你无法进行操作。


    设置多启动系统并非易事，在此过程中，你可能会遇到一些问题和疑问，但我们将帮助你探索这一过程。通过使用一些准备硬盘（分区、引导程序和安装）的领先工具，并对本专题中稍后讨论的
    UEFI 和安全启动等技术的理解，你将准备好处理大多数问题。此外，如果你正在更改分区的布局和机器的基本操作，那么你应该首先备份任何价值数据，因为意外总会发生。


    配置双启动设置的频率取决于你打算如何使用它。安装可以完全独立分离，以匹配你想要运行的操作系统顺序，你也可以在它们之间设置共享空间。如果你频繁在 Windows
    和 Linux 之间切换，你可能已经有一个共享分区或一个用于主目录的专用分区，通过那里你可以访问实际的用户主目录（在切换时，你需要密切关注发生的情况）。使用“独立分区方法”可能会在分区重启时为你的数据提供额外的隔离保护。


    如果你的磁盘空间有限，你也可以使用 USB（容量足够），而无需从外部存储器运行任何一个操作系统或共享分区。这种方法是被推荐的，尽管如果你的电脑带有高速 SD
    卡槽，许多制造商不支持从 USB 3.0 或 SD 卡启动。


    **快速概览**


    ### 建议的发行版


    - Ubuntu 16.04 LTS

    Canonical 的 Ubuntu 16.04 LTS 提供了与你优秀设置相匹配的双启动安装便利性，以及 LTS 支持的保障，这使其成为你系统极的 Linux
    安装选择。


    - Fedora 26

    带有 GNOME 3.2 的 Fedora 是另一个备选发行版，它拥有一个管理存储的优秀工具 GUB Grub。Fedora 在 RUM/APT 部分表现非常出色。


    - Arch Linux

    你可能会使用 Arch，如果不使用，它是尝试一些不同内容的绝佳方法。Arch 的核心在于赋予你控制权，提供现代更新并简化了命令行的使用。


    - GParted Live

    它不仅适用于那些已经安装了部分双启动的人，也适用于确保安全的启动环境。为硬盘保留一个 GParted 恢复磁盘对于应急恢复和方便管理都是一个很好的选择。


