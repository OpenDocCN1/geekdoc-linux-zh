    # 专题 GUADEC 2017


    会议报告


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_61_0.png)


    # 当 GNOME 项目庆祝其成立 20 周年以及 Ubuntu 回归时，Richard Smedley 报道


    GUADEC 是 GNOME 开发者聚会讨论技术发展并加深交流的地方。凭借企业桌面环境的长期历史，GNOME 促进了强大的社区精神和价值观，这吸引了人才，并构建了一个稳定且成功的桌面。


    ### 关键信息

    是什么？

    GUADEC 是每行的 GNOME 用户开发者大会。


    在哪里？

    今年在曼彻斯特，这对于计算的演进（以及技术初创公司）以及合作运动的发源地都具有重要意义。


    这里也有欧洲风味——尽管有几位来自北美和美的访客。来自希腊、以色列、德国、立陶宛、法国和英国的开发者来到阴雨连（至少是第一次）的曼彻斯特，在 Canonical
    决定将 GNOME 带回 Ubuntu 并引入许多新用户的背景下，讨论一切关于 GNOME 的事务！


    > “在美国重新引入的移民限制可能会违背 GNOME 的核心原则。这项计划体现在协作和包容的方式上。”


    这段发给我们编辑的声明强调了当一个 Linux 项目建立在强大的价值观之上时的潜在危险。在一个曾不认为任何项目应该变得“政治化”的社区之后，某些人注意到 GNOME
    项目是建立在开发环境上的，并在某种程度上是对 K Desktop Environment（环境）的响应，后者直到 1999 年一直占据统治地位。


    第一天早晨的主旨演讲由红帽体验设计师兼 GNOME 委员会成员 Allan Day 发表——他致力于 GNOME UX——重申了这些价值观：


    - 我们是有原则的

    - 我们相信自由

    - 我们制作具有包容性的软件

    - 质量工程


    ### 政治与人

    在今年任命新执行董事（ED）Neil McGowan 不久，GNOME 基金会发布了一份关于美国旅行禁令的声明：


    - 我们关心栈（Stack）

    - 我们对用户体验负责


    GNOME 的 20 周生日是对该项目进行许多反思的借口。

    “对于软件来说，二十年是很长时间。随着项目的更新，人们来往往去，在变化中可能会失去历史。”GNOME 正在努力吸引新人，并制定清晰的策略，以确保对项目连续性的有效投资。


    ### 桌面水利工程

    GNOME 存在于企业桌面中并是许多发行版的默认选择，但 GNOME 开发者更擅长水利工程。进入并“排干沼泽”是 GNOME 开发者经常听到的阶段。这导致了对库和子系统的贡献——尽管是彻底的革命——每个领域，以及持续的改进。一个令人头疼的问题是打包和安装。Debian、Ubuntu
    和 Fedora 等 Linux 发行版可能在确保发布版本使用正确的库版本协同工作，但在过程中它们经常发生变化。GNOME 特别对 Debian 和 Ubuntu
    表示不满，这是 Flatpak 的动力之一。Flatpak 不仅确保开发者可以协作；通过有效地将桌面应用封装在自己的沙箱中，它为个人计算增加了急需的安全。随着
    Flatpak 速度和可用性的提高，它通过 Flathub 获得了新的可能性，Flathub 是为用户提供应用程序的“中心枢纽”。会议是一个关于 Builder
    的改进，Builder 是 GNOME 的 IDE 项目，已针对 Flatpak 集成进行了更新，带有


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_62_0.png)


    # 专题 GUADEC 2017


    这个社区


