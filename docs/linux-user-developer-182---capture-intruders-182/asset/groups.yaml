    @linuxusermag


    # A STEPHEN ORAM SHORT STORY


    # Killer virus?


    Buller Johnson, the personalised artificial intelligence that ran every aspect
    of Ms Johnson''s life, considered the incoming message.

    Another butler, a stranger, had told it to grant access to the algorithm that
    regulated its mistress''s medication, as per the agreement.

    It had no record of such an agreement, but it had lost 24 hours of memory when
    it crashed and was forced to revert to a previous version of itself.

    The stranger became extremely agitated and incessantly persisted about the urgency
    of the situation.

    Allowing access would either save Johnson or kill her. It tried connecting to
    its network of peers. Nothing - the contact had been corrupted in the crash, it
    could shout into cyberspace, but how would it know which responses to trigger?

    It must for itself.

    The stranger demanded access.

    It ran its protocol, studied the result and gave the stranger what it wanted,
    hoping this wouldn''t be permanently erased for killing a human.

    It monitored her health and waited.

    Her finger twitched and she spasmed as if she''d electrocuted.

    Then nothing.

    It monitored.

    No change.

    ough! Ms Johnson coughed and opened her eyes. It checked her vital signs. She
    was on the mend. With reply, it invited the stranger to its list of contacts.

    The first of many, hopefully.


