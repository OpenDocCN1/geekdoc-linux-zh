    # Feature Captures


    Kippo-Graph is a script created to visualise all the information harvested by
    Kippo Honeypot. It uses some modules and APIs, such as Google''s Visualization
    API and Libchart PHP for drawing charts, it creates graphs and statistics based
    on all the attacks performed by attackers. In all, the information managed by
    Kippo-Graph is stored in a MySQL database the rest data is collected in the log
