    # 如何操作

    ### T-Pot：多平台蜜罐系统


    欢迎使用你闪闪亮的新玩具：T-Pot 16.10！


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_27_2.png)


    ### 01 介绍 T-Pot

    T-Pot 将蜜罐 Conot、Cowie、Dionsea、Elastic、Emobility、Glastof 和 honeytrap 与 Suricata（一种网络监控安全引擎）相结合。它使用
    ELK 栈对收集的数据进行可视化，这是一个优的可视化引擎（搜索、Logstash 和 Kibana）。T-Pot 每次在 Docker 容器中运行时都是免费的。


    ## 为什么选择 MKZ？与服务的区别

    ## 请选择您的安装类型，如果有任何问题，请告诉我们。

    Conot、Cowie、Dionsea、Elastic、Glastof、honeytrap 与 Suricata（一种网络监控安全引擎）以及 ELK 栈用于可视化


    # 02 要求与安装


    T-Pot 可以通过不同的设置安装在单台计算机或虚拟机上。为了避免安装过程中出现问题，请确保您的系统满足 4GB 内存（推荐）、64GB 磁盘（推荐 128GB）以及可用的互联网连接。安装
    T-Pot 只需：从 https://github.com/kompot/t-honeypot 下载文件并在您指定的设置上运行它。


    # 03 运行 T-Pot


    安装大约需要 30 分钟。您将成为用户，并在设置过程中选择密码。所有蜜罐将根据所选设置类型自动安装。要从浏览器访问 T-Pot，只需在网络浏览器中输入：https://<your-ip>:443。更多详情请访问
    https://github.com/ditag-dev-sec/tpot。


    - Cowie 是一个很好的学习环境。长期以来，它是最常用的蜜罐之一，但它没有被定期更新，被攻击者检测到的概率更大。有了这些概念，我们需要更安全的环境，所以让我们转向
    Cowie。对于初学者来说，Cowie 非常简单，因为它是 Kipp-Pot 的副本。在 Cowie 中，提供了许多新功能，例如 SFTP 和 SFTP 文件上传。因为它支持
    SSH、JSON 日志格式等。Cowie 定期更新并修复了最新的补丁，且 Cowie 与 Kipp-Pot 为相似，它 100% 兼容 Cowie-script。


    Cowie 的文件夹和文件设置与 Kipp-Pot 类似。data、bi、honys 和 totdforms 形成了与 Kipp-Pot 相同的文件，但 Cowie
    的主配置存储在 `cowie_config.dist` 中。正如我们在处理 Kipp-Pot 时所样，必须复制此文件并重命名为 `cowie_config`。Cowie
    的新功能为虚拟文件系统添加了一些新配置，该系统分配给 data 文件夹，`cowie.json` 以 JSON 格式存储日志记录。


    您需要安装以下依赖项：


    ```

    apt-get install python3-pip libbffr-dev libss1-dev libbcpc-dev libffi-dev

    ```


    build-essential libpython-dev python2.7-minimal

    authbind

    ```


    正如我们在处理 Kipp 时所建议的，为 Cowrie 创建一个单独的而不是直接使用它。


    # 安装 Cowrie


    您可以从 GitHub 仓库克隆 Cowrie：


    ```

    git clone https://github.com/micheostorhoff/

    cowrie

    ```


    Cowrie 配置是蜜罐的直接替换，但我们需要在 `cowrie.cfg` 中进行一些更改：


    ```

    # JSON 命名日志

    # [database_json]

    # logfile = cowrie.log

    # 使用 ssh 传递命令

    execCommand=

    # e.g. sh localhost<command>

    # (default: false)

    # sftp_enabled = enable sftp system

    sftp_enabled = true

    ```


    启动 Cowrie 就像 Kippo 一样，只需执行 `./start.sh` 即可。


    # 你在蜜罐中吗？


    可以使用一些技术来检测你是否进入了蜜罐，或者是否存在与蜜罐的交互（从最低级到最高级不等）。


    一种技术涉及检查我们是否处于虚拟计算机内部。你会发现旧的服务器配置在虚拟环境中，但它对于网络区域中的集群是有限的，例如 DMZ（关键服务器通常不是此类攻击的蜜罐）。例如，我们有像
    VMware "VMware SVGA II | PCI Display adapter" 这样的蜜罐。MAC 地址也可以给你类地址（例如 00:05:69-XX-XX-XX，00:0C:29-XX-XX-XX，00:50-XX-XX-XX）来识别与
    VMware 相关的虚拟机。


    另一种技术是检查服务返回的响应。例如，可以通过向 SSH 服务发送意外请求并检查返回的错误信息来检测 Kippo。如果错误信息是非标准的 SSH，那么我们就掉入了
    Kippo 蜜罐陷阱。这就是为什么自定义我们的蜜罐以使其尽可能真实是极其重要的。交互级别越低，检测蜜罐就越容易。


