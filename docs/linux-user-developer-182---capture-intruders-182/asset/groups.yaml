    提供了一个类似的工具，但定期更新很不方便。在从源码 (github.com/ext2fs/ext2fs) 安装 Ext2fs 后，你可以挂载分区。这允许你管理所有文件，包括创建、删除和隐藏带有前缀或后缀的文件。为了避免意外损坏你的
    Linux 文件系统，除非你需要向它们写入文件，否则只允许读取访问是明智的。


    > 快速提示

    > 备用部分

    > 如果你在磁盘上保留一个“彻底路径”分区，这将非常适合使用 live 环境以更具代表性的性能尝试新发行版。


