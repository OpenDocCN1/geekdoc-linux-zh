    # 开源你的 Linux 新闻与观点


    # 观点


    # 内核专栏


    随着 Linus Torvalds 关闭 Linux 4.13 版本的合并窗口，Jon Masters 总结了内核社区的最新动态。


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_15_0.png)


    Linus Torvalds 在开发完成后宣布发布了 Linux 内核 4.13-rc3 版本。如往常一样，该版本整合了许多新功能和驱动程序。其中包含两个不同小组的更新：下一次中断预测（laptop-usop）以及大型存储工作（针对服务器）。其他更改包括
    AppArmor 补丁中的“标签”处理，以及一个帮助 Ubuntu 的 AppArmor “上游”到 Linux 内核的通用补丁。


    很难见到维护者像这样被抓到了。


    ### 预测唤醒

    Daniel Lezcano（来自 Linux）已经从事基于 IRQ 的预测工作多年，将一个（最初）看起来很简单的想法演变成了许多层次的实现。随着工作的推进，Lezcano
    工作的核心思想是针对外部交互引起的唤醒提前重新规划内核计划。对于笔记本电脑的电池电源，大量的精力被投入到确保系统组件在任何时候处于空闲状态。外部设备（如 Wi-Fi
    芯片）的数量也很多，但这是应用处理器核心的代价。


    Jon Masters 是一位 Linux 内核黑客，从事 Linux 工作已超过二十多年，从他 13 岁开始。他在墨尔本加入了 Linus 的团队，服务于一家大型企业供应商，在那里他负责高效
    ARM 驱动服务器的策略开发。


    最终的内核还包含一个 TLS 实现，用于原生处理加密的 HTTPS 连接。这些连接涉及硬件、网络数据包过滤和内核空间加密。对于用户级服务，许多用户希望内核能作为一个内置的编辑器、邮件客户端或
    XML 解析器。这位用户很高兴地报告，过去 Linux 内核确实没有内置 Vim、Sublime 或 VS Code——但现在有办法了。


    有一点是4.13 版本在 RDMA 方面的阻碍要少了许多。内核 RDMA（远程内存访问）栈为低延迟性能网络（如 InfiniBand (IB) 和 OmniPath）提供了所需的架构。RDMA
    允许用户空间应用程序快速从运行在远程系统上的应用程序复制数据，而无需通过两端的内核进行多层拷贝。遗憾的是，RDMA 维护者对 Linus 回退到他（更典型的）数周
    RC 内核的4.12 版本而不是到达 RC8 感到措手不及。这意味着许多在此时安排了假期的人计划受了影响。


    有些是原子的，有些是内核控制的。在内核控制方面，Linux 使用 `cpuidframe` 及其控制器来告知它应该如何处理唤醒。在低功耗状态下，处理唤醒 `task-runqueues`（以及进程）的内核已恢复到更主动的节约能源努力。趋势是将
    `cpuid` 时间与调度器集成，提供硬件和软件接口，以防止由于外部交互引起的应用程序将它们从低功耗状态中唤醒。所有这一切都可以在感知系统运行限制的情况下，通过更精细的编排来节省能量。


    通常，应用核心通过两种方式之一从低功耗状态被唤醒：周期定时器“滴答”（tick）中断源（用于调度内核后台活动）以及来自硬件设备的设备。


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_15_1.png)


    （例如，笔记本电脑的 NVMe 磁盘、我们的 Wi-Fi 芯片、检测到耳机插入的接口等）。传统上，内核仅根据预测的下次定时器来管理低功耗状态转换。现代的“NOHZ”内核移除了每秒1000次（在架构定时器上）的“滴答”，转而允许在内核实际上需要为某些清理工作提前计划时发生一次。因此，移除定期触发的中断可以避免许多唤醒。更进一步，Daniel
    的工作结合了关于单个硬件设备的信息，预测它们何时会导致唤醒或关注。顺便提一下，Intel 团队一直在对 Linux 空闲循环进行优化，使其处理唤醒变得更容易。这导致了延迟的降低和响应能力的提高——我们将在未来的版本中介绍更多内容，所以等这个讨论尘埃落定。）


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_16_0.png)


    # 在任何给定目录下处理多达 20 亿条目的的能力现在现在


    (Teodore) Ted 发布的 ext4 补丁包含了对“ext4 特性”大文件和扩展属性的支持。该功能现在是许多 Linux 发行版（伪根）Android
    的默认设置，并且在今天的 Linux 服务器上很常见。容量的增长比以前更快，因此在任何给定目录下处理多达 20 亿条目的现在是人们可以轻松实现的。这来自 Lustre
    文件系统，它被用于 HPC（高性能计算）集群。


    另一个注意的示例是扩展属性（描述文件限制、控制和能力的元数据），允许值达到 4kb。Google 团队还增加了去重功能，使得具有相同属性值的多个文件只存储一次。


