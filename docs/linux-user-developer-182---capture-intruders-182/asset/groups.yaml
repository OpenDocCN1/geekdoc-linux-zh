    # 快速指南


    # 蜜罐（Honeypots）：涉及哪些伦理和法律问题？


    对于使用蜜罐的伦理和合法性存在一些担忧。有人认为蜜罐有助于安全，因为它们可以帮助攻击者练习、学习新技术并提高攻击技能。有些人认为，如果蜜罐网络基础设施是故意构建作为“陷阱”来捕获攻击者的，它是非法的。还有人认为它是非法的，因为访问你的蜜罐可能涉及法律权利（取决于你放置蜜罐的国家）以及你从攻击者那里收集的信息。


    区分信息收集类型至关重要：连接数据是最重要的，因为它包含了攻击者遇到的聊天记录和电子邮件等个人信息。连接数据与连接信息相关，如 IP 地址、日期时间等，以避免法律问题。你的蜜罐应该部署用于调查或保护你的组织。另一个好主意是放置一个警告横幅，说明你的网站正在被监控。


    上方是一个示例截图。这是一个来自命令行的脚本日志。所有命令均由攻击者执行。


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_24_1.png)


    # 特性捕获


    Kippo-Graph 是一个为了可视化 Kippo 蜜罐（Kippo Honeypot）收集的所有信息的脚本。它使用了一些模块和 API，例如 Google
    可视化 API 和用于绘图的 Libchart PHP，它根据攻击者执行的所有攻击创建图表和统计数据。总之，Kippo-Graph 管理的信息存储在 MySQL
    数据库中，其余数据收集在日志文件中并直接连接到 MySQL 蜜罐，从 `config.php` 文件读取。


    总体信息，如总尝试次数、尝试访问蜜罐的不同 IP 数量；所有信息记录的时间范围。下一部分称为“输入（Input）”，管理 Kippo-Graph 记录的所有信息。它在部分中显示了蜜罐内部所有的“人类活动”。通过这种方式，Kippo-Graph
    可以估计有多少攻击是由人类发起的，或者是多少次。表格显示了攻击者访问蜜罐后成功使用的顶部命令。图表显示了跟踪任何被访问并下载的文件的命令。


    Kippo-Graph 可以显示各种类型的图表，如饼图、柱状图等，并呈现相关信息，例如攻击者使用的顶部密码、按国家划分的顶部 IP 连接等，并导出为 CSV
    以供任何其他日志分析器进行进一步处理。


    在 Kippo-Graph 的第一部分“概览（Overview）”中，我们可以看到 Kippo 亮亮的所有数据。在章节头部中，它显示了一些


    下一部分称为“回放（Playoff）”，显示了 Kippo-Graph 最有趣的特性。它展示了针对所有攻击的逐步重放（类似于帧动画）。playoff 章节显示了跟踪任何被访问下载的文件的命令。


    | IP 地址 | 地理位置 | 成功次数 | 最后看到 |

    | :--- | :--- | :--- | :--- |

    | 58.XX | 武汉 | 1 | 2017-07-11 07:59 |

    | 103.XX | 上海 | 7 | 2017-07-11 08:06 |


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_25.png)


