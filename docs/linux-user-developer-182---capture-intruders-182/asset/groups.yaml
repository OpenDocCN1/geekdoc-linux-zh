    # 命令行绘图


    ## Drawj2d 0.9.0


    无需稳定的手即可准确绘图


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_90_1.png)


    如果你觉得在电脑上画图是一件痛苦的事情，为什么不让计算机画你需要的呢？Drawj2d 使用一种基于字符串的描述性语言 Heci 来轻松绘制“线、点、圆、椭圆、弧、抛物线和尺寸线”。通过
    Qt 2D & 3D，Drawj2d 能够绘制相当复杂的形状。


    上方对于技术图来说，描述性文件比鼠标画的要好


    > ### 优点

    - 不需要稳定的手——使用计算或简单的脚本。SVG 输出精美。


    > ### 缺点

    - 另一种需要学习的脚本语言。位图选项不受限。与其他工具未集成。


    > ### 非常适合：

    - 快速准确的形状、精细和标注。


    http://drawj2d.org


