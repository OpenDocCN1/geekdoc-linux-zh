    说道。


    谷歌通过包括 Google Drive 在内的所有服务对其基于 Chromium 的浏览器进行激进营销，也通过承诺的改进性能和功能吸引用户。对于 Mozilla
    Firefox 这样高知名的竞争对手来说，这是糟糕的。


    > “Firefox 桌面版可能在未来几[年]内走向灭绝，”Gal 说道。


