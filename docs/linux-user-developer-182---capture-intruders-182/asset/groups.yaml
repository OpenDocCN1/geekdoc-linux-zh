    Don''t forget chmod

    if you try to run a script and you get a ''Permission denied'' error, it''s because
    you forgot to use the command chmod +x your script. Everything is a file, but
    you need to set files to be executable (e.g., programs and files that you want
    to run). The chmod +x sets a flag on the file that allows it to be executed.


    ```

    $ mkdir directory

    $ touch file

    $ mv file directory

    $ ls directory

    ```


    The syntax of the mv command is: type mv, then the path of the file you want to
    move and then the path of the directory you want to move to. If you move a file,
    you can also rename the file while moving, by specifying the new name as the destination:


    ```

    $ mkdir directory

    $ touch file

    $ mv file directory/newname

    ```


    This mechanism works equally if you want to rename a file without moving it to
    a directory, which the mv command does as a command for renaming files:


    ```

    $ cd directory

    $ ls

    $ mv filename something_else

    $ ls

    som_else

    ```


    To value a variable, we use the sign =. If you used to programming, you might
    be tempted to put spaces around the equals sign. write exactly as we''ve written
    here without spaces, otherwise the shell will think greeting is a variable name.
    To reference a variable, precede the name of the variable with the dollar sign.


    # String literals and command substitution


    In the code below, we use double quotes "" to reference the string Hello. In the
    shell, you can use either single quotes or double quotes, but if you use single
    quotes, then the text that you put between the quotes is the value of the string.
    If we use double quotes, the shell performs command substitutions within the string.
    For example, we can reference the value of a variable inside the string:


    ```

    $ echo "Hello"

    $ echo "Hello, James!"

    Hello, James!

    ```


    To be complete, we might want to surround the variable name with braces - ${greeting}.
    We would need to do this if we want to write letters immediately after the variable
    expansion for example ${greeting} expands to Hello, but the shell thinks we are
    referring to a variable named greetingoo rather than the variable greeting.


    Another trick that we can do with double quotes is to insert the output from a
    command into a string. We achieve this by using the dollar sign and ().


    ```

    $ touch script.sh

    - will work, but it is tedious to test

    ```


    ```

    $ /script.sh

    - /fit script.sh with the shebang

    !/bin/bash and we have made it executable

    with chmod +x script

    ```


    ```

    $ /path/to/script.sh

    - like the previous example, but when script.sh

