    最近，WikiLeaks 发布了另一个 Linux 泄露（工具集），其中包含一些 POSIX（Linux）兼容工具，可用于向 Linux 计算机注入木马。该木马是
    Python 脚本和二进制文件的组合，本质上为攻击者提供了一个加密的命令控制通道，而该通道是通过某些漏洞获取的。此泄露并不包含任何允许攻击者接管计算机的利用程序，他们必须在安装工具集之前先做到这一点。这是国家黑客攻击
    Linux 系统的另一个例子。


