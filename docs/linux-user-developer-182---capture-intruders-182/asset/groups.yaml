    | Size | 13.3-inch 2560x1800 DPI |


    The current king of high-end Linux laptops, the XPS 13 (9350) Developer Edition,
    launched in Ubuntu 17, independent reseller System76 has its own lightweight laptop,
    Galago Pro. Its all-aluminum casing outclasses many more expensive laptops. It''s
    also inescapable not to notice how the laptop feels in the hand. However, when
    you''ve spent any time on a laptop, the thickness of the display bezel is like
    the Dell XPS 13''s InfinityEdge, which is clear and vibrant, and so lacking proper
    place.


    While we found the Galago''s responsive keyboard to be just fine and the multi-touch
    touchpad the QUWERTY keyboard layout highlights System76''s US home market. Given
    that the keyboard has an excellent selection of function keys and a Ubuntu superkey,
    we didn''t find a lot but a UK charger in the box, as we were having to carry
    a bulky adapter and surfing on USB is not the point of owning a lightweight machine.


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_86_0.png)


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_86_1.png)


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_86_2.png)


    > Whether the Galago and its battery life are good enough for you may boil down
    to the price


    ## Pros

    An excellent spec, including a Core i7 chip and HDMI-display, and good value in
    comparison with its high-end competitors. Our review model showed that Ubuntu
    17.04. For instance, in Open Arena, the source clone of Quake III Arena, the Galago
    managed 17 frames per second, 20 frames in our OpenGL, FurMax, whereas the Dell
    XPS 13 9360 achieved 47 points, but that is only if you get the drivers right.


    ## Cons

    The laptop lacks the invisible bezel of other high-end laptops, and battery life
    is very short for those who care. At £629 it is much cheaper than the Dell XPS
    13 for £1199 (plus shipping and taxes). Our shipping might impact our review somewhat.


    The Galago has much to offer, which is why it''s so bitterly disappointing battery
    life. Even in ideal conditions, it lasted roughly three hours and 45 minutes.
    This is not enough for a normal working day, and the best we can say is acceptable
    for the odd meeting out or to catch a coffee with friends.


    ## Summary

    In a significant number of ways, the Galago is limited by its partnership with
    Clevo, which choices it had to make - the most damaging is the choice of chassis.
    It also doesn''t have the body of a laptop. In terms of graphics, the Galago Pro
    isn''t meant to be a gaming machine. Essentially, it''s on a par with the Dell
    XPS which both use the Intel HD graphics. A high-end laptop that offers processing
    power, an elegant design, a generous selection of features, and a screen for a
    reasonable battery life. Just don''t travel too far from a world where a battery
    life barely lasts a half day.


    In full control of components, System76 offers a generous selection of parts that
    you just see, on more expensive laptops and in Ubuntu where it''s needed. The
    Galago Pro offers so much at an excellent price and we desperately like to give
    it a higher score, but unfortunately, we can''t - the portable experience is riddled
    by its battery life.


    > Chris Thomett


