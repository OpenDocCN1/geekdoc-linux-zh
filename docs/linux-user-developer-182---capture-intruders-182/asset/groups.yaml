    # ## SMALL COMPUTING


    # ## Arduino settles its ownership in safe hands


    **Ownership of the firm behind the Arduino development boards, Arduino AG, has
    finally been sold.** A buyout of €6M by a company started by co-founders Musto
    — Massimo Banzi, David Quartarelli, David Melis and Tom Ive — means concerns Musto''s
    actions raised by former CEO Federico Muzusto have lasted two years. The community
    had become increasingly unhappy with the lack of progress and reports of open
