  - '[PAGE 70]


    # Components list


    +   - Raspberry Pi Zero W

    - 2x DC 3V-6V Dual Axis Gear Motor

    - Dual Channel DC Motor Driver

    - Raspberry Pi Camera Module

    - 2600mAh Power bank

    - Raspberry adhesive heatsink

    - Node.js and Socket.io for controls

    - JavaScript/HTML for mouse/touch controls

    - Motors controlled over PWM with pigpio

    - mjcg-streamer

    - Prusa i3 Heptos if you want to 3D print your ZeroBot

    - CAD files are at http://360.com/r2v2Nqo


    I/O access

    When soldered four pins to the PWM motor controller and used the pigpio Node js
    library for connecting to the I/O pins (www.npm.com/package/pigpio)


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_70_0.png)


    Nippy streaming

    The MJPG video stream from the ZeroBot runs at a surprisingly low latency of 0.2-0.3s
    at a resolution of 640x480 pixels. The stream is fed to an HTML page.


    Zero in a half-shell

    ZeroBot uses a strangely shaped half-shell design that''s also intended to print
    out. Kern used the Heptos for the job, but the CAD files are designed to work
    with any regular 3D printer.


    # Wi-Fi winner


    Kern took advantage of the Raspberry Pi Zero''s built-in Wi-Fi to set up Realtime
    easier. He also chose this project as it had the processor power for live streaming
    and enough I/O ports for the job.


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_70_1.png)


    Stock position: 122-149

    Left Motor: 121.6890000000001 Flight Motor: 148

    Temperature: 40.54°C

    Hygry: 0%


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_70_2.png)


    Far left: Unlike Kern''s previous robot, the Attacker was able to use "probe"
    gear motors instead and enabled the ZeroBot to stream video from a Pi Camera Module.


    Kern also wanted to control the ZeroBot with web interface and opted for a clean
    UI using Delisle''s JavaScript multi-touch gamepad (http://github.ly/Siebly/gamecontroller)


