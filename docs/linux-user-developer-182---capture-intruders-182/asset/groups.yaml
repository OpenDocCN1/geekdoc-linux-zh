    \ 1 |\n\n![](img/1fdb1204e7e4788f3fb478a4ef813223_71_1.png)\n\n## 02 起始金字塔\n\n\
    首先，我们将初始化一系列变量，通过 pos = c.player.getTilePos() 获取玩家的站位，然后在 x、y 和 z 轴上扩展（x = pos.x\
