    # Welcome

    to issue 182 of Linux User & Developer


    # This issue


    +   * Trap all intruders, p20

    * Get a triple-boot setup, p54

    * GUADEC 2017, report p62


    Welcome to the UK and North America''s

    favourite Linux and FOSS magazine.

    This has caused a stir. As the new Data Protection

    Bill brings many things, this will

    will be easy to withdraw your permission

    for media harvest your data; easier to

    access what companies hold on your data; easier

    enable the right to be forgotten. In fact, it will

    also allow people to get consent for their data

    to be used. We''ll show you how to help. Roll up! Free tickets

    to be abused.


    Modern life is full of tempting traps, but in LU&D

    we''ll show you how to build your own home of honeypots

    np20). We also have a feature on getting a great multi-distro

    setup (p54); a guide to managing VirtualBox via the command

    line (p52) [wait, correction] and a

    report on the GNOME conference (p62). Much cake was

    eaten in our report on the project''s 2020 launch, but

    with a fistful of tools; we''ve had a group test on ancient

    editors (p81). We''ve also revamped the page, where Stephen

    Oram, an in-editor for Virtual Futures, the ''Glastonbury of

    cyberculture,'' will be presenting a series of near-fear Black

    short stories. Enjoy!


