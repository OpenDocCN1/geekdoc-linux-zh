  - "[PAGE 74]\n\nPCB. The kit comes complete with an installation jig that contains\
    \ two acrylic base pieces. Secure your Pi into the jig with two nylon bolts, placing\
    \ the acrylic top piece onto which you hammer it. A more detailed guide can be\
    \ found at http://bit.ly/HammerHeaders.\n\n# 03 Mount the speaker\n\nNow we'll\
    \ attach the speaker to the PHAT using four of the eight empty slots to keep the\
    \ speaker slightly away from the PCB. Place each speaker through the hole and\
    \ then secure it with the remaining four.\n\n# 04 Solder speaker wires\n\nOnce\
    \ the speaker is in place, use glue to secure the speaker wires to the board.\
    \ The kit comes with the required wires; simply measure the length and cut it.\
    \ When soldering, hold the iron on the top of the speaker and then melt the wire\
    \ to the bottom of the PHAT base. This process repeats for the second speaker.\n\
    \n# 05 Install the software\n\nWith all Pimoroni products, it's super-easy to\
    \ install the required libraries and configure your PHAT for Raspberry Pi. Add\
    \ your power supply and boot it up. (Do not add the PHAT while the Pi is on.)\
    \ Open the Terminal and run: `sudo apt-get install rpi-speakerphat`. This will\
    \ begin the installation. Follow the instructions provided, as required. After\
    \ the restart, the installation will knock out the default audio driver.\n\n#\
    \ 06 Playing audio\n\nOnce the installation is complete, restart your Raspberry\
    \ Pi. It is recommended to press Enter on your keyboard or type `sudo reboot`.\
    \ Your Pi will restart and now audio will be played through the PHAT. To test\
    \ this, simply open the browser and play a video, or another video of choice that\
    \ has audio. Select a suitable video or song and play. The video will load, and\
    \ be heard through the PHAT.\n\n# 07 Adjust the volume\n\nThe installation of\
    \ the PHAT libraries will knock out the HDMI/analog controls and the volume control\
    \ from the top menu. You may want to adjust the volume to the level you'd like\
    \ to use. Open the Terminal and type `amixer`. This will show that the sound card\
    \ is named rpi_hibberry_dac. Adjust the volume by using the Up key to increase\
    \ it and the Down key to decrease it until you reach the desired level.\n\n![](img/1fdb1204e7e4788f3fb478a4ef813223_74_0.png)\n\
    \n```\n# sudo apt-get update\n# sudo apt-get install python3-pip\n# sudo apt-get\
    \ install mp321\n```\n\n# 08 Playing MP3\n\nTo play MP3 files, we'll use a program\
    \ called mp321. Open a terminal, then type `sudo apt-get install mp321`. This\
    \ will download and install mp321. MP3 players can be played from the command\
    \ line; if you use `mp321 filename_of_mp3`.\n\n# 09 Using Python to play MP3\n\
    \nBegin creating a New File, and then add the following code to the top line of\
    \ your file: `import mp321, name_of_mp3 = 'file.mp3'`. This is an OS command to\
    \ play the file. Replace `name_of_file.mp3` with the name of your MP3 file to\
    \ play. Press F5 to save and play the music file.\n\n# 10 Extending the PHAT's\
    \ LEDs\n\nIt is possible to control the PHAT's LEDs. First, install python3-sn328:\
    \ `sudo apt install python3-sn328`. Create a new file and enter the following\
    \ code:\n\n```\nfrom speakerphat import clear, show, set_led\nfor x in range(10):\n\
    \    set_led(x,255)\nshow()\n```\n\nFor the `set_led(index, value)` function,\
    \ index can be 0-9. Save and run the program.\n\n> Stream music from iPhone or\
    \ Android\n\nIt is possible to stream music via your iPhone or Android to the\
    \ PHAT. Assuming you already installed Rasp, you will need to load a clean SD\
    \ card image. Install the required libraries: type the command `sudo apt-get install\
    \ pulseaudio-module-zer`. When asked, select speaker PHAT. The required libraries\
    \ and configuration will be set up. Last, it will install the sharpt software\
    \ that allows you to stream audio to your Raspberry Pi. Start playing music on\
    \ your Apple device and then tap the AirPlay icon and select 'Raspberry' (unless\
    \ you have changed the hostname of your Pi). Your music will be streamed to the\
    \ Pi."
  - '[PAGE 75]


    # Tutorial


    # Pi NoIR


    # The art of infrared photos


    Discover the stunning but bizarre world of photographing the invisible with the
    Raspberry Pi and NoIR camera


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_75_0.png)


    Mike Bedford

    has an MSc in Computer Science and currently - works as a senior research fellow
    for the University of Exeter. He''s also a keen landscape photographer.


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_75_1.png)


    # Resources


    +   - Raspberry Pi - any model with a CSI camera port

    - Pi NoIR v2 Camera Module http://bit.ly/PiNoIR2

    - Camera adapter for using with Pi Zero

    - Ada TFT + 2.8-inch Touchscreen - version for Raspberry Pi http://bit.ly/PiTFTPlus

    - USB power adapter

    - R72 infrared filter or equivalent

    - Case & mounting hardware


    Although we can''t see it, infrared is all around us. If our eyes were like infrared,
    we would be able to see the world different way and we could perceive that we
    might see things in totally unknown colours.


    Even though it''s impossible to see it, glass lenses are able to focus infrared
    (IR) and the CCDs in cameras are sensitive to it, so digital cameras that all
    have to take IR out with filters aren''t quite simple with an ordinary camera,
    but the Raspberry Pi''s NoIR provides an ideal solution.


    Despite this, it''s worth considering why we might want to shoot in IR. In fact,
    conventional infrared photography is black and white, which has its own unique
    appeal. While black and white photography captures foliage in grey, the part of
    IR that has a much higher contrast, which makes for dramatic shots. The leaves
    on trees appear brilliantly white, to the point that they seem to be glowing.
    Blue skies appear virtually black, a cloudy sky looks ethereal or otherworldly.


    The snag with using ordinary cameras for the infrared is that manufacturers do
    best to prevent their cameras from responding to IR. Because


    the presence of IR would cause colours to look unnatural, an IR blocking filter
    would block out the CCD so that it can only record visible light. However, that
    filter isn''t 100% efficient so, to varying degrees, ordinary cameras are able
    to record IR, albeit with much less sensitivity than they have light.


    # The challenge of infrared


    To take a photograph in IR, it''s necessary to exclude all visible light which
    would, interfere with the IR filter. Using such a filter is often referred to
    as an IR filter, but a more accurately passed IR filter would differentiate it
    from an IR blocking filter. However, the main problem is that the IR is let out
    by the filter, and with such high speed light it reaches the CCD. The more that
    the camera has to process, the more noisy the image is, and even the exposure
    time is likely to be several seconds, even on a sunny day.


    Despite the difficulties of using ordinary cameras, an ideal solution is available
    to Raspberry Pi in the form of the NoIR camera. NoIR has no filter, it doesn''t
    have the IR blocking filter, and it''s mostly used in conjunction with LEDs for
    night-time security applications, it''s also ideally suited to daylight infrared
    photography.


    76'
  - '[PAGE 76]


    Having briefly mentioned that all-important IR filter, let''s discuss the options.
    An IR filter allows infrared to pass while blocking light, but in practice aren''t
    quite as simple as filters in their cut-off wavelength. least aggressive filter
    cuts off at 720nm, which means that a small amount of the deepest red light will
    get through to the infrared. The result isn''t quite as dramatic as with filters
    of a different cutoff, but it is widely available and cheap so it''s what most
    people start with. For R72 is perfectly adequate, but if you want even more effect
    you could use an 850nm filter; the part number varies from one manufacturer to
    another, but will probably be something like BK85 or IR 850.


    # Build and use an IR camera


    The Noir camera, just like the Raspberry Camera Module v2, is used in fixed installations,
    but for this application you need a portable unit. To achieve this you must assemble
    a Raspberry Pi with the Noir camera, add a battery and a power source, and put
    everything into a case. It also needs some software that can be shown by touching
    the screen. Our step-by-step guide will show you how to achieve this, but there
    are also other options online, and if you''re an proficient Pi hacker and relish
    a challenge, you might find something better.


    Once you''ve assembled your kit, it''s time to get out into the outdoors and test
    your hand at infrared photography. You''ll certainly want to experiment, as the
    more you do the better you''ll get. As of first, the most unique aspect of IR
    photography is the ethereal glow of greenery, so it''s best to start with landscapes
    and plants. Similarly, because that characteristic look is much more pronounced
    with good illumination, choose a bright day, with direct sunlight. The other contributor
    to the high contrast is the deep blue of the sky, which isn''t achieved on an
    overcast day or at least a partly blue sky.

    While taking shots out of the camera, are often not as impressive as they might
    be, so a degree of digital image enhancement is needed.


    # STEP-BY-STEP


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_76_0.png)


    # 01 Connect the PiFTT2.8-inch Plus


    Connect the PiFTT to Raspberry Pi. You will need some help to get to work, you
    need a new Linux kernel with the necessary support. This can be downloaded from
    the Adafruit website, although the link in Step 2 includes this.


    # 02 Connect the Noir


    You need to connect the Noir camera to the Pi. This is a very simple process although,
    without some software, you won''t be able to preview images on the TFT. Adafruit
    has developed a project with an associated download which support for the PiFTT
    and software to implement a point-and-play scheme, which you can find at http://bit.ly/DYVPcam
    - is a visible camera, but since the Noir is the standard to Pi camera except
    for its lack of an IR filter, the software is just for this project


    # 03 Add a power supply


    USB power supplies are readily available, and so so you''ll be able to turn your
    camera on and off by plugging and unplugging the power pack from the Pi. This
    is recommended, although you might need to use a switch in the relevant wire in
    the power pack and the Pi.


    # 04 Housing everything as a portable unit


    The hardest part of this project is to create a case that holds all the parts
    together so that the unit is portable, easy to handle and to hide. The best way
    is to find a general-purpose case of adequate dimensions and adapt it by providing
    the various components and making holes for the TFT and the camera. You also need
    to attach the infrared filter in front of the lens with no leakage of visible
    light if you want to really boost the configuration with a single type of IR filter,
    you could glue the filter over the lens in case. For flexibility, use an appropriately
    sized adapter ring to the case so you can screw filters on and off.


    Taking shots out of the camera, are often not as impressive as they might be,
    so a degree of digital image enhancement is needed to get the most out of your
    photos and turn them into works of art. We are not going to go into detail about
    how to edit the images, but what would apply to one particular photo editor, but
    you need to be proficient so that you will not have difficulty following our generic
    instructions in to your package of choice.


    Though shots with a Noir through an IR filter will be particularly interesting
    in colour, you will need to get rid of all that colour, so your first job is to
    convert the colour photography to a genuine black and white (i grey). Next, because
    IR filters often look like lacklust entirely, you will probably need to increase
    the brightness and the contrast, but to experiment to find the look that''s right
    for you.'
