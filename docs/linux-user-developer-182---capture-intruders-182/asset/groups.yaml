    # 评


    ## Fedora 26


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_87_0.png)


    ## 发行版


    ## Fedora 26


    Fedora 开发者已经精通稳定发布的艺术，但是否已经到了无聊的地步？


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_87_1.png)


    在经历了多次重新设定截止日期和忙碌的延误后，Fedora 终于在 2017 年初发布了第一个版本。但你从这个版本中获得的兴奋感仅限于此。与早期相比——尤其是像
    Fedora 这样曾经充满戏剧性的顶级项目——现在的每一个粗糙边缘都被磨平了，每一个缺陷都得到了平滑和完善。对于一个旨在为红帽企业级产品提供最佳平台的发行版来说，Fedora
    在软件选择上太保守了。最新版本的一个亮点是一个开发了数年的新分区工具！这个名为 Blivet-GUI 的新分区工具会在你在安装发行版时勾选“自定义”单选框时显示，它旨在处理和可视化复杂的磁盘配置。你可以用它编辑和删除磁盘分区以及
    LVM2 组，并可选使用 LUKS 对其进行加密。


    在底层，新版本带来了 Linux 内核 4.11.8，所有软件包都已用 GCC 7.0 重新编译。其中的亮点是“夜光”功能；类似于 Windows 10 的蓝牙战斗，它通过根据一天中的时间微调屏幕亮度来缓解你的眼睛。点击通知中的，会显示日历底部的其他信息。如果你使用
    Firefox，桌面的轻量级网络浏览器（epiph）具有许多改进的隐私控制。还有一对新应用：用于管理你当前可用性的 Maps，以及 Gourmet 菜谱管理器。


    新分区工具的上方将帮助具有复杂磁盘布局的用户在 Anaconda 内部为发行版找到空间。


    > 对于一个要为红帽企业级产品进行测试的发行版来说，它太保守了


    ## 优点

    - 一个稳定且精良的发布版本，为不同版本中的各种类型用户提供了一些实用的功能。


    ## 缺点

    - 没有缺点，但如果你想吹毛求疵，我们可以指向所有新功能的列表。


    与之前的版本一样，Fedora 26 有三个适用于不同用例的版本：Workstation（工作站）、Server（服务器）和 Atomic（原子）。虽然主版本使用
    GNOME 桌面环境，但项目提供了带有不同桌面的几个额外选项。一个是基于 KDE 的，另一个是基于 LXQT 的。


    ## 总结

    新的分区工具将对你有帮助。如果你有多个显卡，可以通过右键点击应用程序来选择启动哪一个。该功能最近已在所有安装项的右键菜单中显示。随着引入 dnf 2，后台的包管理也得到了改进。这个作为
    Yum 继任者的版本进一步修复了两个包管理系统之间的不兼容问题，在表层之下的通过大部分的改进提升了用户体验。


    在主版本发布之后，桌面团队计划发布服务器版模块化（Modular）释放的预览版。Fedora 模块化工作坊的目标是增加灵活性以实现目标。例如，你可以拥有一个在新的内核上运行数据库的服务器。此版本带来了一些改进。首先，虽然在早期的版本中你可以用
    Kubernetes 管理容器以及用 dnf 安装它，但现在只需像其他其他 Docker 命令一样使用单个命令即可。提到 Docker，Docker 容器的
    OverlayFS 默认存储选项现在由 Overlay2 驱动提供，而不是 devmapper。


    Michael Shorne


    升级 Ubuntu 26 似乎是一个很容易的挑战，并将最终来到 GNOME 桌面。


    www.linuxux.com | 89


    # 评测 自由软件


    ## 网站流量分析


    ## Piwik 3.0.4


    在不泄露用户数据的情况下跟踪访问者


    当涉及到网络分析时，有一种替代方案，可以不必将所有详细信息传递给 Google。Piwik 是一个成熟且文档完备的免费开源 LAMP 应用，由托管服务和其他连接支持。下载它，仅需五分钟的安装即可完成设置，这包括设置数据收集器并进行测试。一旦运行起来，你只需要等待仪表盘来跟踪你的分析数据。十分钟的网站流量是不够的——第二天连接，你将获得过去
    24 小时的流量，其仪表盘与 Google 有相似之处。


    仪表盘增强了更多小部件，允许你选择并自定义它的其余部分。为了明确目标，你可以为访问者分析构建转化目标。查看访问者是如何找到你的网站的。Actions（操作）可以向你展示你的观众如何与网站交互。“Visitors”（访问者）甚至会显示你是从车载浏览器访问网站的。


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_89_0.png)


    无论你是拥有一个繁忙的网站还是正在测试的东西，都能为你提供更好的数据。


    ## 优点

    - 一个强大且可靠的分析工具，安装过程简单且界面友好。


    ## 缺点

    - 你可能会发现自己自己在没有投入精力处理事情的情况下担心错过了某些效果。


    ## 非常适合……

    - 诚实地观察你网站的运行情况。


    https://piwik.org


    # 媒体下载器


    ## Movgrab 3.1.1


    一个带有脚本和对管道友好特性的下载器


    在 YouTube 上遇到一些问题后——我们不得不免费下载一些 YouTube 视频，很高兴看到 Movgrab 没有提出任何主张，只是提供了这个免责声明：“这是免费免费的，如果它损坏了你的电脑或打开了通往恶鬼维度的大门，或者做了任何事情，我不承担责任。”“但它确实在我们那里获取的
    /config 文件上运行了。”


    运行 --test-sites 可以查看哪些网站——不仅是 YouTube 和 Vimes，还有 TED、Everywhere 和国家地理，以及如《华盛顿邮报》和
    24 等网站。少数返回了 BROKEN（损坏），但作为回答，作者说可能仍然仍然用。测试脚本还需要一些改进——虽然安装过程检测到了所有必要的 SSL 库的存在，但即使在我们尝试修复
    /config 文件时，它也无法在 SSL 环境下工作。


    我们无法让 Movgrab 在 YouTube 上工作。如果你有多个显卡，可以通过右键点击应用程序来选择启动哪一个。该功能最近已在所有安装项的右键菜单中显示。随着引入
    dnf 2，后台的包管理也得到了改进。这个作为 Yum 继任者的版本进一步修复了两个包管理系统之间的不兼容问题，在表层之下的通过大部分的改进提升了用户体验。


    我们无法让 Movgrab 在 YouTube 上工作。


    ## 优点

    - 它在我们那里获取的 /config 文件上运行了。


    ## 缺点

    - 测试脚本还需要一些改进。


    ## 非常适合……

    - 它适用于许多网站。


