  mdcn: "\n# 教程\n\n# Java\n\n# 第一部分\n\n## 学习 Java：使用继承创建一个基础游戏\n\n编写一个简单的游戏是学习编程特性的极佳方法，同时也涉及多线程系统和网络。\n\
    \n![](img/1fdb1204e7e4788f3fb478a4ef813223_47_0.png)\n\n**John Gowers** 是一位编程和计算机科学大学导师，重点关注\
    \ Java。你也可以阅读他在第 36 页关于脚本的教程。\n\n# 资源\n\n- Open JDK 1.8（本教程的部分 1.7 就足够了） http://openjdk.org/\n\
    - Eclipse IDE http://www.eclipse.org/\n\n![](img/1fdb1204e7e4788f3fb478a4ef813223_47_1.png)\n\
    \n我们将使用 Eclipse IDE 在 Java 中构建一个游戏。IDE 将编辑器和调试工具整合在一起，以帮助你尽可能高效、快速地进行开发。\n\nJava\
    \ 编程语言包含了许多可以在日常编程中使用的特性。在系列教程中，我们将通过构建一个简单的沙盒风格游戏，展示一系列 Java 的编程结构和工具。在游戏中，玩家将在地图上行走，收集鸡蛋并击各种动物。\n\
    \n如果你已经掌握 Java 基础，但对编程是新手，那么这个系列教程就是为你准备的。如果你以前接触过其中一些概念，你仍然能从本教程中学到新东西。\n\n每个月，我们都会提供一个代码库供你编辑。对于第一篇文章，我们将提供一段简单的骨架代码，你将学习提供一些基础功能。如果你遵循了之前几个月的教程，可以将你的解决方案与我们的进行比较，但我们希望你继续完善自己的代码，并为你所创造的内容感到自豪。\n\
    \n在第一个教程中，我们发现代码库几乎没有任何功能；它仅仅是一组接口和抽象类的集合，带有少量的类和方法。在教程中，你将为这些接口和抽象类编写自己的实现，通过重写接口/抽象方法来提供我们指定的功能。我们不会向你展示如何编写代码。\n\
    \n其余部分将在几个月内与我们共同。在我们的程序中，将由多个相互作用的对象组成，我们可以根据意愿创建并放置它们。\n\n要开始之前，我们需要导入 LIBGD提供的基础功能。首先，将光盘中的\
    \ `eggs.tar` 拷贝到我们自己的文件系统中。接下来，启动 Eclipse 并选择 `File > Import...`，从弹出的菜单导入项目，然后选择\
    \ `General > Existing Projects Into Workspace`，这将弹出图 1 所示的对话框。从\n\n![](img/1fdb1204e7e4788f3fb478a4ef813223_47_2.png)\n\
    \n可用的教程文件：\n\nfile://site.com\n\n在此处选择“Select archive file”，然后点击“Browse...”并导航到光盘上的\
    \ `eggs.tar` 文件。最后点击“Finish”以导入新项目。\n\n# 第 1 ：创建地图瓦片和动物\n\n首先，我们将创建一些扩展 `MapTile`\
    \ 抽象类的类，它们代表地图上可能出现的不同类型的瓦片。`luad.eggs::MapTiles` 中的 `MapTile` 类有两个抽象方法：\n\n```\n\
    public char getToken()\npublic boolean isAccessible();\n```\n\n第一个方法为我们提供了地图瓦片的表示形式。这对于从文件读取地图以及将地图显示到终端非常有用。第二个方法告诉我们地图是否可访问——即玩家是否允许在上面行走，或者是否不可访问。提供的代码包含一个简单的实现\
    \ `LandTile.java`，它如下所示实现了地图：\n\n```java\npublic char getToken() {\n  return '\
    \ ';\n}\npublic boolean isAccessible() {\n  return true;\n}\n```\n\n![](img/1fdb1204e7e4788f3fb478a4ef813223_48_0.png)\n\
