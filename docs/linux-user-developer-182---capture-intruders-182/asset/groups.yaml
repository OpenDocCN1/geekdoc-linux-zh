    ```\n\n所有脚本将保存在 ~home/minecraft/ 中\n\n## 04 自定义我们的金字塔\n\n我们最初初始化了高度和计数的变量。通过改变高度，我们可以让金字塔变大或变小。该变量用于循环中，以确保我们的金字塔处于指定的\
    \ height 行数。我们从 1 开始，每次循环递增。\n\n## 01 起始代码和变量\n\n这是开始的第一个代码块\n\n```\nfrom mcpi\
    \ import minecraft\nmc = mc.minecraft.create()\npos = mc.player.getTilePos()\n\
    x = pos.x + 2\ny = pos.y + 2\nz = pos.z\n```\n\n## 05 使用条件语句封装\n\n将当前的 mc.setBlock(blockX,\
