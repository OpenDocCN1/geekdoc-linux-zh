    ## Julia 0.6.0


    需要数据分析吗？时候到了


    ![](img/1fdb1204e7e4788f3fb478a4ef813223_90_0.png)


    **性能仍然 Julia 的核心。**


    虽然它不是一个 CAD 工具，但最新版本可以导入 .dxf 文件——完整的或仅选择的层——并具有某些功能（如 Tex 标签，对于某些用户和任务来说，它是 CAD
    的更优替代方案）。甚至有一个用于语法高亮的补丁。


    通过 Qt 2D & 3D，Drawj2d 能够绘制相当复杂的形状。甚至有一个用于语法高亮的补丁。


