  md: '# Charts and graphs in OpenOffice Draw


    Launch OpenOffice then click the File, New menu to be presented with a sub-menu
    of possible document types - charts, graphs and other graphics choose the Drawing
    option. A blank drawing area appears where range of vector graphics can be created.


