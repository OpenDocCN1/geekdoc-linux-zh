  md: '# Playing and ripping CDs


    The KDE Simple CD (KSCD) application is the standard Linux audio CD player. Its
    interface has the familiar control buttons that you find on real CD players plus
    four more for additional features.


    Click on the “Compact Disc Digital Audio” logo button to cycle through the displayed
    time – show playing time remaining and time elapsed for the track and entire disk.
    Click the button with the tools icon to open the configuration dialog where you
    can change the display controls and other simple options. The “i” button helps
    search for artist information online, such as concert dates.


    ![](img/79c73558c68d3c5f59b51559717db1f4_147_0.png)


    The CD button in the top right corner of the KSCD window does not stop the player
