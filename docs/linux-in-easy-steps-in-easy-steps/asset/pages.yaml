  md: '# File system dos and don''ts


    When organizing your files and directories in Linux it is advisable to adopt the
    recommendations listed below. These conform to accepted standards of practice
    and make working in Linux easier:


    +   Never place files directly in the root directory (''/'') and never create
    directories there – the top-level root directory should only contain the standard
    Linux sub-directories.


    +   Always use your personal home directory to store all your personal files –
    for instance, the /home/mike directory. Create as many sub-directories as you
    like in your home directory; but not store data files elsewhere.


    ![](img/79c73558c68d3c5f59b51559717db1f4_93_0.png)


    +   Use only lowercase when naming any data files you create as this prevents
    any future hassle with capitalization errors. For instance, you won''t have to
    remember if you named a file Mydata, MYDATA or MyData – it will always be myydata.


    +   When naming files avoiding any spaces in the name. Linux can easily see these
    spaces in graphical mode but it can create a problem in text mode – you will have
    to prefix each space in the name with a "\" backslash character when referencing
    that file from the command line. It is much simpler to avoid spaces.


    ![](img/79c73558c68d3c5f59b51559717db1f4_93_1.png)


    +   Only use the root superuser account whenever it is absolutely necessary. If
    you are logged in as root that you will have absolute power -- and, therefore,
    the ability to wreak havoc. Get into the habit of working from a regular user
    account.'
