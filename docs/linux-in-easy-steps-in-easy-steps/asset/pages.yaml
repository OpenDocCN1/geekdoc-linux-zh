    option to see a list of all cards for your email account appear in the top right-hand
    pane. Click any card in the list to reveal the details in the bottom right-hand
    pane.


    Double-click any card in the list to open the Card dialog where details on that
    card can be added or modified. Alternatively click the properties button on the
    tool bar to open the Card dialog for the currently selected card.


    New cards can be created manually by clicking the New Card button on the tool
