  md: '# The Mozilla web browser


    In addition to KDE''s Konqueror web browser most Linux distros include the open-source
    Mozilla web browser. This free browser is available for various platforms and
    contains many powerful features. It has been developed by the open source community
    from original Netscape browser code into a very competent, standards-compliant
    product.


    Most web browsers are based upon the Mosaic browser of the early 1990s – the ''Mosaic''
    is derived from ''godZILLA''.


    In Mand to click Start, Networking, WWW, Mozilla to launch the web browser. Type
    a URL into the location field then hit Return to that page in the browser window.


    ![](img/79c73558c68d3c5f59b51559717db1f4_69_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_69_1.png)


    This screenshot depicts Mozilla with the Modern theme applied.


    ![](img/79c73558c68d3c5f59b51559717db1f4_69_2.png)


    If you''re used to Internet Explorer then you will feel instantly at home with
    Mozilla – but it also has great extra features. Type a word or phrase in the location
    field then click the Search button to have the Google search engine return a list
    of relevant URLs.


    Mozilla''s appearance can be easily customized – click on the View menu, then
    select Apply Themes. You can choose from Classic and Modern themes, or select
    Get More Themes to download other themes from the Internet.


    68 Linux in easy steps'
