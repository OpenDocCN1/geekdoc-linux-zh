  md: '# Setting up a TV card


    If a TV tuner card is installed in your computer it can be configured using the
    system control center.


    In Mandrake Linux launch the Mandrake Control Center. Click on the Hardware menu
    item, then click the DraksTV icon that appears in the right-hand pane. Select
    the card and tuner type from the lists, or choose “Auto-detect” to let the wizard
    discover, then click the OK button to proceed.


    ![](img/79c73558c68d3c5f59b51559717db1f4_45_0.png)


    The television formats broadcast different numbers: of lines at various speeds.
    If you are unsure of the system used where you are typing “world television standards”
    in a web search engine.


    ![](img/79c73558c68d3c5f59b51559717db1f4_45_1.png)


    Next choose your location from the drop-down list and select the television standard
    used to transmit signals in your area - NTSC (National Television System Committee)
    in North America, PAL (Phase Alternating Line) in the UK and Australia, SECAM
    (Sequential Couleur Avec Memoire) in France and Russia, et al.


    ![](img/79c73558c68d3c5f59b51559717db1f4_45_2.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_45_3.png)


    If you''re in the USA and receive television via cable choose USA (cable) rather
    than USA (broadcast).'
  merge: -1
