  md: '# # What is Linux ?


    Linux is a computer operating system that can run on a variety of hardware including
    the popular Intel system found on most desktop computers. It is a modern derivation
    of the powerful Unix operating system that was introduced way back in 1969.


    Pronounce the name Linux with a short “Li-” – so it’s “Li-nucks” not “Lie-nucks”.


    In recent years the popularity of Linux has increased dramatically as computer
    users have discovered its many benefits:


    ![](img/79c73558c68d3c5f59b51559717db1f4_9_0.png)


    +   - Linux is released under the GNU General Public License that ensures remains
    free to all users – no one can charge for this operating system so you will never
    have to pay for it. It''s available for free download on the Internet but you
    may have to pay a distribution charge if you prefer to order a copy on CD-ROM.


    +   - Access to the source code of Linux is unrestricted and it may be changed.
    This allowed thousands of programmers around the world to refine the code in order
    to improve performance, eliminate bugs and increase security.


    ![](img/79c73558c68d3c5f59b51559717db1f4_9_1.png)


    Many web servers are said to have a “\*\*LAMP\*\*\” configuration – an acronym
    for Linux, Apache, MySQL, PHP.


    +   - Linux is truly a multi-user, multi-tasking operating system that allows
    multiple users to simultaneously work with multiple applications without experiencing
    any traffic problems. Many of the world''s web servers run on Linux for this very
    reason.


    +   - Linux is an extremely stable operating system – continuous updates of more
    than once a year are not uncommon. It can be upgraded “on the fly” so it only
    needs a reboot when adding new hardware.


    +   - There are a large number of quality applications available to run on the
    Linux platform. These are comparable to commercial applications that run on other
    operating systems but, like Linux, these too are free of charge. In instance,
    the free OpenOffice suite offers similar functionality to the Microsoft Office
    suite and can even handle files in the popular \*\*doc\*\*. format.


    +   - With open-source software, an administrator can know exactly what a program
    can do and the security dangers it presents. An open-source application cannot
    secretly gather information about the user or use confidential information to
    third parties. This assured level of security and integrity contrasts starkly
    against commercial software whose source code is closely guarded.'
  merge: -1
