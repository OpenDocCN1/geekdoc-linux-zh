  md: '# Installing a desktop theme


    Besides the customization possibilities described on the previous pages an alternative
    way to change the appearance of your desktop windows and background is to adopt
    a ready-made theme. These change many aspects of the window components to provide
    a new look with a consistent feel.


    Launch the KDE Control Center and select the Theme Manager option under the LookNFeel
    menu. Several bundled themes are listed under the Installer tab – click on any
    theme to see a preview of how it will look on the desktop. Click the Apply button
    to implement the selected theme.


    The screenshot below illustrates the Theme Manager dialog with the Wood preview
    and applied to the window.


    Many Linux themes are available for download on the web


    ![](img/79c73558c68d3c5f59b51559717db1f4_61_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_61_1.png)


    See page. 106 for more on handling compressed files.


    More themes can be downloaded from the Internet – usually these will be in a compressed
    archive format. Extract the theme then click the Add button in the Theme Manager
    dialog and navigate to the theme file to add it to the Installer menu.


    ![](img/79c73558c68d3c5f59b51559717db1f4_61_2.png)


    60 | Linux in easy steps'
  merge: -1
