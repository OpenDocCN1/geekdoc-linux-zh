  md: '# Installing other desktops


    The Gnome desktop environment is the popular alternative to the KDE desktop for
    many Linux users. It can be installed from most distro CD sets in the same way
    as any application.


    In Mandrake Linux, launch RpmDrake then select the Gnome Workstation option under
    the “Graphical Environment'' menu. Click the OK button in the dialog that appears
    to accept the additional packages which Gnome requires.


    ![](img/79c73558c68d3c5f59b51559717db1f4_183_0.png)


    > Additional packages needed

    To satisfy dependencies, the following package(s) also need to be installed:

    cdabelpen-2.5.0-1mdk, cdparanois-il9-8-5mdk, cdecord-2.0-2mdk, cdecord-d4wav-2.0-2mdk,
    gnome-2.2-0-1mdk, libg2-2.0-9-3mdk, libre-0.2-3-1mdk, libbeta-0.2-3-1mdk, linuxconf-1.293-3mdk,
    locales-ja-2.3.1.4-6mdk, locales-ko-2.3.1.4-6mdk, locales-zh-2.3.1.4-6mdk, mkisofs-0.2-2mdk,
    openssh-askpass-gnome-3.51-7mdk


    Insert the distro CD when requested, then click on the OK button to begin the
    installation – another dialog box displays a progress indicator that illustrates
    the package installation process.'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# ...cont''d


    ![](img/79c73558c68d3c5f59b51559717db1f4_184_0.png)


    Upon completion a dialog confirms the successful installation of the packages.
    Open the Mandrake Control Center, click on the Boot menu, then select the DrakBoot
    option. Change the System Mode options to start Gnome with autologin when the
    system boots, then click the OK button to apply the update.


    Reboot the system and Linux will now automatically login the default user into
    the Gnome desktop environment.


    ![](img/79c73558c68d3c5f59b51559717db1f4_184_1.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_184_2.png)


    13. Extending your Linux system | 183'
