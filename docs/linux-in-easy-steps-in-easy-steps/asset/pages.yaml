    | Development | | Gnome Workstation |

    | Documentation | | Other Graphical Desktops |

    | LSB | | |

    | Help Total size: 18 / 3994 MB Individual package selection Next -> |


    Unlike Windows, Linux ships with a whole range of graphical desktops that each
    can be customized. The most popular of these are the K Desktop Environment (KDE)
    and the Gnome desktop environment.


    To avoid confusion, until you become familiar with Linux, it is suggested that
    you only install KDE initially – others can be installed later for further exploration.


    KDE is arguably, the most popular Linux desktop environment and includes an office
    suite (KOffice), a web browser (Konqueror), an email client (KMail) and much,
    much more. It is written and maintained by a worldwide network of software engineers
    who are committed to free software development. Everyone is welcome to contribute
    to the development of the KDE project.


