  md: '# # Starting the installation


    Linux installations begin by booting the computer from the first CD-ROM in the
    Linux distribution set. This requires the computer BIOS (Basic Input/Output System)
    settings to set boot instructions from the CD drive before using those on the
    HD drive. If your computer looks to boot from the HD drive (as it normally would)
    you will need to change the BIOS settings.


    ![](img/79c73558c68d3c5f59b51559717db1f4_19_0.png)


    On starting the computer usually tells you which key to press to enter the BIOS
    Setup Utility – Delete, F1, F2, Insert, and Esc are common.


    The BIOS Setup Utility can typically be entered by holding down Delete key right
    after the memory test when the computer is first switched. From the BIOS Setup
    Utility menu choose the option for Advanced features to display the boot device
    order.


    The boot sequence needs to have the CD drive before the HD drive, so it may need
    to be changed to look like:


    | First Boot Device | CDROM |

    | Second Boot Device | HDD-0 |

    | Third Boot Device | Floppy |


    Save the new settings and exit the BIOS Setup Utility. The computer will now reboot
    and initially look to the CD drive for boot instructions. When the CD drive does
    not contain boot instructions it uses those on the HD drive as before.


    Ensure that the first CD-ROM from your Linux distribution is in the CD drive,
