  md: '# Customizing KDE window appearance


    There are almost limitless possibilities for the customization of the appearance
    of windows.


    The KDE Color Center LookFeel menu click on the Colors option to display the color
    scheme dialog. This contains a clickable area showing the various components of
    two windows – one in the active state, the other in the inactive state. Click
    any component to select it click on its current color to the Select Color dialog.
    Choose a new color, then click the OK button to change its appearance in the preview.
    Click the Apply button to actually implement the color change in the desktop.


    ![](img/79c73558c68d3c5f59b51559717db1f4_59_0.png)


    Customized color settings for many, or all, window components can be saved for
    future use as a Scheme. Alternatively, you can choose one of the standard Scheme
    options from a menu in the Colors dialog.


    The screenshots below show the default window appearance, then how the same window
    looks after the Storm color scheme has been applied – changing the title bar,
    border and menu panels colors.


    ![](img/79c73558c68d3c5f59b51559717db1f4_59_1.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_59_2.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_59_3.png)


