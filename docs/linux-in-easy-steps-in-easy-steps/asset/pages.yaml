  md: '# Using the Linux shell


    This chapter illustrates how to interact directly with the core of the Linux operating
    system. It explains the different levels at which Linux can run and how to change
    between levels. It demonstrates how virtual consoles and shell control are useful
    when working with multiple shell programs. It also shows how to use a popular
    shell text editor.


    # Covers


    +   - What is the shell ? | 150

