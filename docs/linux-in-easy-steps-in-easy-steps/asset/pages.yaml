  md: '# # Joining newsgroups


    Newsgroups provide online areas for discussion of specific topics. You can join
    one, or more, newsgroups on topics that interest you and follow the discussion
    posted by other members of your group — also may contribute your own views by
    posting to the newsgroup, but this is not essential.


    To join a newsgroup you must first establish a newsgroup account, in much the
    same way that an email account must be setup before you can send/receive email.


    In the Mozilla Inbox click on the File, New, Account menu options to open the
    Account Wizard. Check the radio button marked Newsgroup Account then click the
    Next button. Enter your name and email address then the name of the Newsgroup
    server — your ISP will provide this information. Type a name for this newsgroup
    account then click the Next button to display a final summary of the account information.


    ![](img/79c73558c68d3c5f59b51559717db1f4_75_0.png)


    Mozilla News can also be launched from the Start menu -- navigate through Start,
    Networking.


    ![](img/79c73558c68d3c5f59b51559717db1f4_75_1.png)


    Newsgroups may contain uncensored material.


    ![](img/79c73558c68d3c5f59b51559717db1f4_75_2.png)


    Click the finish button to create the newsgroup account and see it appear in the
    left-hand pane of the Messenger window. Right-click on this item then choose Subscribe
    from the context menu. List of all available newsgroups gets downloaded. Then
    they are displayed in the Subscribe dialog – select those you wish to join.


