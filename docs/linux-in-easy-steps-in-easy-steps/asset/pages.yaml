  md: '# Setting event sounds


    KDE can become a more exciting environment when it is configured to play event
    sounds when you perform various actions. For instance, when an application is
    launched or closed when a dialog box appears.


    To setup event sounds opens the KDE Control Center and select the System Notifications
    option on the LookNFeel menu. click the More Options button in the KDE Window
    Manager in the right-hand pane.


    In the Quick Controls panel at the bottom of the dialog check the checkbox marked
    "Apply To All Applications", then click Turn On All Sounds and click the Apply
    button to implement the changes.


    ![](img/79c73558c68d3c5f59b51559717db1f4_63_0.png)


    Right-click the icon in the window title bar and select Shade to roll the window
    down - a neat way of saving space on a crowded desktop.


    Open an application, such as the KEdit text editor under the Applications, Editors
    menu, and you should hear event sounds when the window opens and closes, or is
    minimized and maximized, or is shaded up and down.'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# ...cont''d


    All event sounds can be silenced by clicking Turn Off All Sounds, then the Apply
    button in the dialog. Alternatively, individual event sounds can be turned off
    or the event made to play a different sound. With all sounds on, click on the
    Fewer Options button.


    There are other customizing options in the LookNFeel - Icons lets change the icon
    set and Fonts lets choose which font to use on the desktop, taskbar and in window
    applications.


    ![](img/79c73558c68d3c5f59b51559717db1f4_64_0.png)


    Explore each of the LookNFeel menu options and try changing some of the settings
    – just push the Defaults button in each dialog box to return to the original configuration.


    The list of events displays icons against events which play a sound. Click on
    any listed event with an icon to reveal the name of its sound in the text field
    below the list.


    The arrow button to the left of this field will play the file when it is clicked.
    The browse button to the right of this field can be used to assign a different
    sound to the event.


    To silence the sound associated with this event check the checkbox marked “Play
