  md: '# Branching a script


    It is often desirable to have a shell script implement a specific action according
    to the condition of a tested value. For instance, when testing a boolean value,
    a script could execute a certain action when the tested value has a true condition
    and a different action when it has a false condition.


    if-then statement is the simplest way to test a value to determine if an action
    should be implemented, with this syntax:


    ```

    if[test-expression];then action fi

    ```


    The action will be only implemented when the tested expression is true – when
    it''s false the script simply moves on. Notice that if-then statement must be
    terminated with the fi keyword. Multiple commands can be included in the action
    part of the statement for execution when the tested value is true.


    ![](img/79c73558c68d3c5f59b51559717db1f4_169_0.png)


    You can provide an alternative to be executed when the tested value is false by
    adding an else keyword to an if-then statement, like this:


    ```

    if[test-expression];then action else fi

    ```


    This statement is suitable when testing a value that may have only two conditions
    but for those values which may be varied it is necessary to repeat tests using
    the elif keyword – a combination of else and if:


    ```

    if [test-expression];then action-1

    elif [test-expression];then action-2

    elif [test-expression];then action-3

    fi

    ```


    Typically a value input by a user will be stored in a variable. This value can
    then be evaluated as a test expression in an if-then statement to allow the script
    to execute specific actions according to the result of the test – a procedure
    referred to as "conditional branching". For instance, the following script presents
    a menu of brush colors to select a color for their preference. The user input
    is assigned to a variable named CHOICE by the read command. This variable is then
    tested in an if-then statement, and an appropriate command is executed according
    to the result of the evaluation.'
