  md: '# Using shell commands


    Shell scripts allow a number of specified shell commands to be executed in sequence
    by simply typing the script name at a shell prompt – effectively making the script
    name a custom command.


    Before starting out with scripting it''s useful to explore, at a prompt, some
    of the commands most used in shell scripts.


    The **echo** command can be found in nearly all shell scripts because it writes
    output information. It takes a string of text as its argument, enclosed within
    a pair of double quotes. For instance, type echo **"Hello World"** at a prompt,
    then hit the Return key. The shell writes out the text string and, by default,
    adds an invisible newline character to move the print head to the next line –
    where a new prompt appears. If the newline feature is not desirable you can use
    the **-n** option to prevent its inclusion, so the command becomes **echo -n "Hello
    World"**.


    Another useful option for the **echo** command is allows you to perform simple
    formatting using "escape" sequences. These all begin with a \ backslash. The most
    frequently used escape sequences are \n (add a newline) and \t (add a tab) – both
    are used in the screenshot below demonstrating the **echo** command and its options.


    ![](img/79c73558c68d3c5f59b51559717db1f4_163_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_163_1.png)


    The **clear** command can be used at any time to remove previous content – leaving
    the cursor at a crisp new prompt at the top of the shell display.'
  merge: -1
