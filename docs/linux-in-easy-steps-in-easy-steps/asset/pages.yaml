- img_proc: true
  md: '# ...cont''d


    ![](img/79c73558c68d3c5f59b51559717db1f4_104_0.png)


    ```

    ```

    [mike@home] cd /home/mike/Documents/text

    [mike@home] ls -l

    -rw-r--r-- 1 root mike 383 Oct 30 11:12 linux.txt

    drwxr-xr-x 2 mike 4096 Oct 30 13:04 other/

    -rwxr-xr-x 2 mike 56 Oct 30 12:00 sample.txt

    ```

    ```


    ![](img/79c73558c68d3c5f59b51559717db1f4_104_1.png)


    The long listing of each line begins with a string of 10 characters - the first
    is a "d" for a directory, or a dash for a file. This is followed by sequential
    Read, Write and Execute permissions for the owning User, Group and Others. Characters
    "w" and "x" appear for those permissions that are set – otherwise a dash is shown.


    Each of permissions can also be described numerically where Read = 4, Write =
    2 and Execute = 1. For instance, a value of 7 describes full permissions to Read,
    Write and Execute (4 + 2 + 1), a value of 6 describes permissions to Read, Write
    (4 + 2), and a value of 5 describes Read, Execute permissions (4 + 1), and so.


    Permissions can be changed from the command line using chmod command. This needs
    two arguments stating the permission values and the file name. The owner could,
    for example, use the command chmod 777 myfile to set full permissions for a file
    named myfile in the current directory.


    ![](img/79c73558c68d3c5f59b51559717db1f4_104_2.png)


    Type exit to logout of root and return to a regular user prompt.


    If you need to change permissions where you are not the owner you need Super-user
    power – in KDE you can use Applications, File Tools, File Manager - Super User
    Mode and just make changes in the Permissions as shown opposite. Alternatively,
    at a command prompt you enter the root password – the style of the prompt will
    change the root prompt.


    ![](img/79c73558c68d3c5f59b51559717db1f4_104_3.png)


    ```

    ```

    [root@home] chmod 777 linux.txt

    [root@home] ls -l

    -rwxrwxrwx 1 root mike 383 Oct 30 11:12 linux.txt*

    ddrwxr-xr-x 2 mike 4096 Oct 30 13:04 other/

    -rwxr-xr-x 2 mike 56 Oct 30 12:00 sample.txt

    exit#

    ```

    ```


    ![](img/79c73558c68d3c5f59b51559717db1f4_104_4.png)


    Read the pages for more about the chmod command. Also check out the chown command
    that lets root change ownership of a file.


