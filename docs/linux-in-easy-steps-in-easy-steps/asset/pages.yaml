    Click the button in the top-left corner of the interface to open its options menu
    – here you can browse to a file to play or open the Playlist Editor and Graphical
    Equalizers.


    Use the buttons at the bottom of the Playlist Editor to add or remove tracks to
    play.


    ![](img/79c73558c68d3c5f59b51559717db1f4_143_3.png)


