  md: '# Installing downloads


    To begin installation of an application from a downloaded RPM package simply click
    on the package icon. For instance, click on the icon of the Opera RPM package
    downloaded to the desktop in the example on the previous page.


    A message dialog asks you to confirm that you wish to install the application
    – click on the OK button to proceed.


    ![](img/79c73558c68d3c5f59b51559717db1f4_181_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_181_1.png)


    You can discover more about G online at http://gnupg.org


    A further dialog may now appear displaying an error message "No GPG signature
    in package". GPG is an acronym for Gnu Privacy Guard – the Linux equivalent of
    the PGP public key encryption system that can be used for file verification. The
    Opera RPM package file, and other files, do not use GPG so this warning message
    can be safely ignored. Click the Yes button to proceed with the installation.


    ![](img/79c73558c68d3c5f59b51559717db1f4_181_2.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_181_3.png)


    A small dialog appears displaying a progress indicator as the Opera web browser
    is being installed on your system.


    The RPM package file can be deleted after installation has completed.


    ![](img/79c73558c68d3c5f59b51559717db1f4_181_4.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_181_5.png)'
