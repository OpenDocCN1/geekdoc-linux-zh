  md: '# cont''d


    The expr command provides the ability to evaluate arithmetic expressions at a
    shell prompt. It uses the usual operators to add +, subtract, /, multiply *, and
    modulus % but it only recognizes integer values - it does not work with floating-point
    numbers.


    Attempting to evaluate an expression that contains floating-point numbers


    Each value is supplied as a separate argument to the expr command so they must
    have a space before and after. Parentheses can be used to clarify the meaning
    of the expression, the order in which it should be evaluated – the arithmetic
    is performed within the parentheses first, then outside later.


    ![](img/79c73558c68d3c5f59b51559717db1f4_164_0.png)


    In comparisons the expr command returns 1 where the expression is found to be
    true, or zero if the expression is found to be false. It supports the usual operators
    to test expressions for equality ==, inequality !=, greater-than > and less-than
    < values.


    To avoid an interpreter error it is important to surround each multiplication
    * asterisk character, greater-than > character, less-than < character, and parenthesis
    character, with quotes.


    The results of evaluating some expressions with the expr command can be seen in
    the screenshot below – see how the result of the multiplication examples after
    parentheses are added.


    The expr command also be used for boolean arithmetic matching – see the expr man
    pages for details.


    ![](img/79c73558c68d3c5f59b51559717db1f4_164_1.png)


    ```

    [mike]$ expr 21 + 7

    28

    [mike]$ expr 21 / 7

    3

    [mike]$ expr 5 "* = 6 - 3

    27

    [mike]$ expr 5 "* = \(6 - 3)"

    15

    [mike]$ expr 25 % 7

    4

    [mike]$ expr 8 == 8

    1

    [mike]$ expr 9 ">" = 4

    0

    [mike]$ expr 9 "< = 4

    0

    [mike]$ ]

    ```


