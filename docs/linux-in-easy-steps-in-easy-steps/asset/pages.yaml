  md: '# Creating graphics


    The most popular graphics manipulation software in Linux is the GNU Image Manipulation
    Program (GIMP) that is bundled with nearly all distributions. This chapter examines
    some of the GIMP''s prominent features and contrasts the application to the market-leading
    Adobe Photoshop program.


    # Covers


    +   - Introducing the GIMP | 122

    - Starting a new image | 124

    - Finding the menus | 125

    - Opening selection dialogs | 126

    - Working with layers | 128

    - Selecting areas | 130

    - Using filters | 132

    - Running scripts | 134

    - Writing your own GIMP scripts | 136'
