  md: '# Viewing text files


    To read a text file at a Linux shell prompt navigate to the host''s directory
    type the less command, followed by a space, then the file name. If the text content
    is too long to fit in the window the less shell program automatically paginates
    the file.


    Use the Space key, or the Page Down key, to view the next page of text content.
    Use the B key, or the Page Up key, to view the previous page of text content.


    The curiously named less program is an enhanced version of an earlier shell -
    called more.


