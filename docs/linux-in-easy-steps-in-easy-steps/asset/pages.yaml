  md: '# Introducing the KDE taskbar


    When Linux boots into the KDE desktop splash screen initially displays icons that
    illuminate in sequence, from left to right, to indicate the progress of launching
    the environment.


    When the sound card has been set up, as described on page 38/39, the sound server
    starts upon launch and typically plays a sound when the desktop icon is illuminated.


    ![](img/79c73558c68d3c5f59b51559717db1f4_51_0.png)


    KDE is up and running


    When KDE is 100% loaded the splash screen vanishes and you can begin to explore
    the desktop environment.


    The taskbar, or “panel” in KDE talk, appears across the bottom of the screen by
    default. It can easily be repositioned to the top or side of the screen – just
    click''drag it to your preferred location.


    The Start button is situated, as you might expect, at the extreme left of the
    taskbar, and features the KDE logo. To the right of the Start button are a number
    of Quick Launch buttons that are installed by default. Extra Quick Launch buttons
    can be added by right-clicking on the taskbar and navigating through Panel Menu,
    Add, Application Button. Menu then allows you to choose for which application
    to add a Quick Launch button.


    Do not choose “Remove Start Applications Menu” – the Start menu will totally disappear
    if you do!


    ![](img/79c73558c68d3c5f59b51559717db1f4_51_1.png)


    | Add | Applet |

    | Remove | Application Button |

    | Size | Special Button |

    | Configure Panel... | Extension |

    | Help |


    +   * Move Applications Menu

    * Remove Start Applications Menu

    * Menu Editor

    * Panel Menu


    ![](img/79c73558c68d3c5f59b51559717db1f4_51_2.png)


    50 | Linux in easy steps'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# ...cont''d


    The taskbar is highly customizable and has a special facility for this very purpose.
    Right-click on the taskbar and choose Configure Panel from the context menu to
    open the Settings dialog box.


    Like most aspects of Linux there are often ways to do things the Settings dialog
    can also be opened from the KDE Control Center with the LookNFeel, Panels menu
    items.


    ![](img/79c73558c68d3c5f59b51559717db1f4_52_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_52_1.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_52_2.png)


    A great Hiding option allows you to choose the position, height and length of
    the taskbar under its Arrangement tab. Options under the Hiding tab let you decide
    when the taskbar should be hidden to reveal more desktop working area. Which applications
    to include on the Start menu can be edited under the Menus tab.


    The Appearance settings configure buttons on the taskbar so they may display tooltips
    and individual background images. This makes them clearly appear as buttons rather
    than just icons.


    The Taskbar settings allow you to control how icons of running applications will
    appear on the taskbar.


    4. Exploring the KDE desktop | 51'
