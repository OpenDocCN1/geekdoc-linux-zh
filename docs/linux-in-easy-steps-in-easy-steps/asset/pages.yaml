  md: '# Making space for Linux


    An operating system is installed on a defined area of the HD drive called a “partition”.
    When Windows is the only operating system installed on the computer the partition
    will normally occupy the entire HD drive. In order to install Linux in this situation
    there are three possible options:


    +   - The first option is to delete the partition where Windows is installed and
    replace it with Linux partition(s) that occupy the entire drive. This option will
    delete the Windows operating system along with all the applications and data files
    that were installed there. It creates a dedicated Linux computer which will immediately
    start Linux whenever the PC gets switched.

    - The second option is to reduce the size of the Windows partition, so that it
    no longer occupies the entire drive, then create Linux partition(s) in the resulting
    free space. This option should retain the Windows operating system, applications
    and data files if the Windows partition is not reduced beyond the size they currently
    occupies. It creates a “dual-boot” computer that allows the user to choose from
    a menu to start Linux or Windows whenever the PC gets switched.

    - The third option is to add a second HD drive to the system. This allows Linux
    partition(s) to occupy the entire second drive and retains the Windows operating
    system, applications and data files on the first drive. It too creates a “dual-boot”
    computer that allows the user to choose from a menu to start Linux or Windows
    whenever the PC gets switched.


    ![](img/79c73558c68d3c5f59b51559717db1f4_15_0.png)


    The option to install an additional HD drive for Linux is a popular choice for
    many people as they have often upgraded their original HD drive to a larger one,
    and so have their original drive spare. It also has benefits over the other options:


    +   - The free space on the Windows drive is not reduced

    - It removes the threat of data loss through partition resizing

    - The familiar Windows operating system is retained

    - It distinctly separates the two operating systems

    - Drive failure would only disrupt one operating system'
  merge: -1
