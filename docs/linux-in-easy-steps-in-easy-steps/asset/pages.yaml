  md: '# Printing from the shell


    To send a file to the printer for printing type the command lpr, followed by a
    space, the name or path of the file. For instance, to print a file named simple.txt,
    located in your home directory, just type lpr simple.txt then hit the Return key.


    This command creates a "job" containing the data from the specified file. Each
    job is placed in a queue awaiting transmission to the printer – when it reaches
    the front of the queue it gets sent to the printer and is printed out.


    You can examine jobs in the print queue with the lq command – each job is automatically
    assigned a job number. A job can be removed from the queue, before it gets sent
    to the printer, using the lpm command together with its job number.


    In the screenshot below the user initially three files to be printed. When the
    queue is examined the first file has already printed, the second is currently
    printing, and the third is awaiting transmission to the printer. The user dequeues
    the third file so it does not get out.


    ![](img/79c73558c68d3c5f59b51559717db1f4_161_0.png)


    A print job can only be dequeued by its owner, or the root user.


    ```

    [Emike]$$ lpr hi_res.jpg

    [Emike]$$ lpr read_elegy

    [Emike]$$ lpr simple.txt

    [Emike]$$ lpq

    Rank Owner Job File() Total Size

    Active mine gray_elegy 6144 bytes

    1 8 simple.txt 1024 bytes

    [Emike]$$ lrm 0

    ```


    Printing from a shell command prompt is not restricted to simply printing files
    – data can also be queued for printing using the lpr command with the | pipe character.
    For instance, you can print a long listing of the contents of the /etc directory
    by piping an ls command to the lpr command like this:


    ```

    ls -1 /etc | lpr

    ```'
