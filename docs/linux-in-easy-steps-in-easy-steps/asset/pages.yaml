  md: '# # Choosing packages to install


    The next stage in the Linux installation allows you to choose what to install
    from the array of packages on the distribution CD-ROMs. Your choice will depend
    on how you want to use Linux – the items checked below are popular home-user selections.


    ![](img/79c73558c68d3c5f59b51559717db1f4_27_0.png)


