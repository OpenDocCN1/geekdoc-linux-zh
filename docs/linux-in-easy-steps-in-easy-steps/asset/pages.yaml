- img_proc: true
  md: '# What is the shell ?


    At the very heart of the Linux operating system is a core series of machine instructions
    referred to as the “kernel” – this is a technical program that is not user-friendly,
    mainly designed to communicate with electronic components. A Linux shell is a
    facility that allows the user to communicate directly with the kernel in a human-readable
    form. It translates command-line instructions, such as those on page 90, so they
    can be processed.


    Most Linux distros include several shell programs that offer different features.
    The default Linux shell program, however, is the Bourne Again Shell (BASH), that
    is an updated version of the original Bourne shell found in the Unix operating
    system.


    The shell understands a large number of commands and can have a number of optional
    “flags” that modify their behavior – usually these are prefixed by a hyphen. Many
    also accept “arguments” that provide data to be used by the command. The typical
    syntax of a shell command looks like this:


    ```

    command -flag1 arg1 -flag2 arg2 ]

    ```


    Shell commands can be executed from a shell window, such as the KDE Konsole application,
    on a graphical desktop interface or at a prompt in text interface mode. To confirm
    the location of the shell program type echo SHELL at a command prompt – it should
    normally respond with /bin/bash.


    You can discover information about users on the system by typing the command who
    at a shell prompt. Using flags with this command can provide other system information.
    For instance, type who -b to reveal the time when the shell was booted.


    The boot process calls a command named init to start background services for the
    system environment. The range of services running at any given time is determined
    by the “run level” – levels are numbered 0 through 6.


    Linux installations that boot straight into a graphical desktop interface will
    be running at run level 5. Those running in text mode will be at run level 3.


    To confirm the current level type who -r at a shell prompt.


    ![](img/79c73558c68d3c5f59b51559717db1f4_151_0.png)'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Understanding run levels


    The purpose of each run level is described in the table below.


    | run level | Description |

    |---|---|n| 0 | **Halt** – at this level the system is in the process of shutting
    down |

    | 1 | **Single-user** – little more than a single console with almost all other
    services disabled. Typically used for maintenance, such as recovery from hack
    attacks or repair of disk corruption |

    | 2 | **Basic multi-user** – most services are running at this level, except for
    those that enable network connections |

    | 3 | **Full multi-user** – starts enabled services in text interface mode but
    does not start the X Window Server to run Graphical User interface desktops |

    | 4 | **User defined** – has no conventional definition but may be custom-configured
    by the user |

    | 5 | **Full multi-user graphical desktop** – starts all enabled services including
    the X Window Server to run Graphical User interfaces. Typically this is the default
    level for most Linux single-user installations |

    | 6 | **Reboot** – at this level the system is in the process of rebooting |


    ![](img/79c73558c68d3c5f59b51559717db1f4_152_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_152_1.png)


    The root can switch between run levels using the **init** command followed by
    the run level number. For instance, to change to text interface mode from a graphical
    desktop interface type **su** to change to super-user root status, enter the root
    password when required, then type **init 3** and hit Return.


    Conversely, to change to a graphical interface from text interface mode **su**
    to change to super-user root status, enter the root password when required, then
    type **init 5** and hit Return.


    11. Using the Linux shell | 151'
