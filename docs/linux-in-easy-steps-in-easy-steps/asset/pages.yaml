    \ requires a counter variable to be assigned an initial value which is used in\
    \ the test expression on the first iteration of the loop. When this is found to\
    \ be the true loop executes its command actions—these should include a statement\
    \ to change the value of the counter, otherwise an infinite loop may be created.\n\
    \n```\nSession Edit View Bookmarks Settings Help\n#!/bin/bash\n\n# a script to\
    \ demonstrate a C-style while loop\ni=1 # initialize the counter\nwhile (( i <\
    \ 4 )) # test expression\n\t\techo \"This is line $i\" # write the current count\n\
    \t\t((i++)) # increment counter\ndone\n\n\"while-loop\" 12L, 232C\n```\n\n```\n\
    Session Edit View Bookmarks Settings Help\n[mike]$ chmod 700 while-loop\n[mike]$\
    \ while-loop\nThis is line 1\nThis is line 2\nThis is line 3\n[mike]$\n```\n\n\
    12. Scripting for the shell | 171"
  merge: -1
  pgno: 172
- img_proc: true
  md: "# Handling input values\n\nArguments added after a script name at prompt are\
    \ automatically stored in sequentially numbered variables -- the first argument\
    \ can be referenced in the script as $1, as the script as $2, and so on. Longer\
    \ strings of text, including spaces, can be stored in a script variable using\
    \ the read command.\n\nThe \"input\" script below stores two argument values,\
    \ reads text input by the user. It displays the input and stored values, writes\
    \ them to a text file named input.txt in the working directory.\n\n```\n```bash\n\
    #!/bin/bash\necho -n \"Enter some text: \" # write to standard output\nread text\n\
    echo \"$1 $2\" # receive text input\necho \"$1 $2\" > input.txt # write to standard\
    \ output\ncat \"input\" GL, 203C written 6,54-95\n```\n```\n\nUse the pwd command\
    \ to discover the current working directory.\n\n![](img/79c73558c68d3c5f59b51559717db1f4_173_0.png)\n\
    \n```\n```bash\n[mike]$ input easy steps\nEnter some text: Linux in\nLinux in\
    \ easy steps\n[mike]$ \n```\n```\n\nShell scripting is a powerful feature in Linux\
    \ and the examples in this chapter serve only as an introduction to some of its\
    \ possibilities. Further advice can be found on the Internet - try typing \"bash\
    \ programming\" into a search engine.\n\n172 | Linux in easy steps"
  merge: -1
