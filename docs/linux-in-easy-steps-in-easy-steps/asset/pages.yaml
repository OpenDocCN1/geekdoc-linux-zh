  md: '# The evolution of Linux


    In 1983 a visionary programmer named Richard Stallman began a movement called
    the GNU Project. Its philosophy was that software should be free from restrictions
    against copying or modification in order to make better and efficient programs.
    This inspired programmers around the world to create programs driven by efficiency
    rather than financial incentive.


    The term "GNU" is a recursive acronym for GNU''s Not Unix.


    ![](img/79c73558c68d3c5f59b51559717db1f4_10_0.png)


    By 1991 the GNU Project had created a lot of software tools including the GNU
    C Compiler written by Stallman himself. At that time many of these tools were
    incorporated into a Unix-compatible operating system, by a 21-year-old student
    at the University of Helsinki. His name was Linux Torvald and he named the operating
    system Linux (LINUs—Unix).


    Linux was made available for download on the Internet so programmers could test
    and tweak the source code, return it to Linux Torvald. After a period of enthusiastic
    development of Linux 1.0 was made available globally by the GNU General Public
    License which ensured Linux and it would remain free.


    Programmers were keen to explore Linux and soon found some uses for it. In April
    1996, researchers at Los Alamos National Laboratory used Linux to run 68 PCs as
    a single parallel machine to simulate atomic shock waves. At $150,000 this supercomputer
    cost just 1-tenth the price of a comparable commercial machine. It reached a peak
    speed of 19 billion calculations per second, making it the315th most powerful
    supercomputer in the world. It proved to be robust though—three months later it
    didn''t have to be rebooted.


    ![](img/79c73558c68d3c5f59b51559717db1f4_10_1.png)


    "Tux" the penguin is the logo of the Linux operating system. It commemorates an
    incident in which Linux Torvalds, while on vacation in the southern hemisphere,
    was bitten by a penguin.


    Linux continued to grow in popularity as a text-based operating system while Windows
    remained the dominant graphical desktop system. Recognizing that most users wanted
    the point-and-click convenience of a graphical environment, the Linux camp began
    to develop a system comparable to the Windows desktop.


    From a handful of enthusiasts in 1991 to millions of users now—Linux has come
    of age. Today''s sleek K Desktop Environment (KDE) and the Gnome environment now
    offer a user-friendly alternative for Windows users—Linux for the desktop!'
  merge: -1
