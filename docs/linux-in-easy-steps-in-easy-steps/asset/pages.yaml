  md: '# Working with layers


    The GIMP supports the concept of layers that act like transparent sheets stacked
    on one the other – the various objects within an image each can be placed on their
    own layer so they may be easily manipulated independently.


    Unlike other graphics software GIMP can occupy an area less than the entire image
    size, unless the objects on that layer fill the whole image. Instead the layers
    can be optimized to the size of the object on that layer. For instance, a layer
    containing a text string can simply be the size of that text. This capability
    saves disk space and improves processing speed.


    To create a new layer open the Layers, Channels & Paths dialog under the Dialogs
    menu, then click on the New Layer button.


    ![](img/79c73558c68d3c5f59b51559717db1f4_129_0.png)


    The original layer is named "Background" by default – always give new layers a
    meaningful name so they can be readily identified.


    ![](img/79c73558c68d3c5f59b51559717db1f4_129_1.png)


    Click the OK button when the New Layer dialog appears to accept the default size
    and settings for the layer – or enter your preferred options first. The New Layer
    then appears listed in the Layers, Channels & Paths dialog and in the image window.
    A layer that is smaller than the entire image is surrounded by a dotted line with
    a yellow background for identification.


    To move a single layer hold the shift key and select the Move tool in the toolbox.
    Now click on the layer and drag it.


