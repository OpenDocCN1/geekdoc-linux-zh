- img_proc: true
  md: '# Changing the screen saver


    Click the Screen Saver option in KDE Control Center''s LookNFeel menu to configure
    a screen saver. A few screen savers are installed by default and more can be freely
    downloaded from the Internet.


    Click any screen saver listed in the Screen Saver dialog to see a preview in the
    monitor graphic - click the Apply button to use.


    ![](img/79c73558c68d3c5f59b51559717db1f4_62_0.png)


    If you want to add a security safeguard to the screen saver check the checkbox
    marked “Require password to stop screen saver” – then click the Apply button.
    When the screensaver is running you can only return to the desktop after entering
    the correct password.


