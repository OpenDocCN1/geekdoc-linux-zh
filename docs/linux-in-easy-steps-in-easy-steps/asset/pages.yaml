  md: '# ...cont''d


    Deleting files and directories from the command line provides more safeguards
    against accidental deletion by requiring confirmation of those actions before
    they are implemented.


    To reproduce the example on the opposite page at navigate to a location in your
    home directory then type `mkdir`, followed by a space and a name, to create a
    new directory. Copy a file into the new directory then type `rmdir` and the directory
    name to attempt to delete it and its contents.


    Use the wildcard `*` to delete all files with the command `rm *`


    ![](img/79c73558c68d3c5f59b51559717db1f4_100_0.png)


    Linux will not allow non-empty directories to be deleted - you must first open
    the directory and delete its contents using the `rm` command. Linux will request
    you to type `y` to confirm this action then it will permanently delete the file/s.
    Now move up to the higher level directory using `cd` and issue the `rmdir` once
    to delete the empty directory.


    ```

    Shell - mouse

    Session Edit View Bookmarks Settings Help

    [mike] cd /home/mike/Documents/text

    [mike] ls

    /home/mike/Documents/text

    linux.txt sample.txt

    mkdir temp

    [mike] ls

    linux.txt sample.txt temp/

    [mike] cd temp

    ls l

    sample.txt

    [mike] rmdir temp

    rmdir: Directory not empty

    [mike] cd ..n[mike] rm sample.txt? y

    confirm regular file, ''sample.txt''? y

    [mike] rmdir temp

    [mike] ls

    linux.txt sample.txt

    [mike] $

    ```


    ![](img/79c73558c68d3c5f59b51559717db1f4_100_1.png)


    The command `rmdir -rf` is highly dangerous - vast areas of your system can be
    permanently deleted at a stroke. It is best avoided.


    Some Linux distributions allow non-empty directories to be deleted, along with
    their entire contents, including a `-rf` argument (recursive, force) in the `rmdir`
    command. For instance, the command `rmdir -rf temp` could instantly and permanently
    delete the directory named `temp` and all subdirectories and files within it.


