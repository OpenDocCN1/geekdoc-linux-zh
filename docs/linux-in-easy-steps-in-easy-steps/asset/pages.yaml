  md: '# Setting automatic login


    The Linux installer offers you the chance to select one user account for automatic
    login whenever Linux is started. For the sole user of a home computer this avoids
    the tedious procedure of entering a user name and password each time you start
    Linux.


    This feature should not really be used in an office environment or where the computer
    has multiple user accounts.


    ![](img/79c73558c68d3c5f59b51559717db1f4_31_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_31_1.png)


    The example above elects to automatically login the sole user acccount that has
    been created. Where multiple user accounts have been created a selection box also
    appears on this page which allows you to choose the account to automatically login.


    If you prefer not to use automatic login the boot process will ask you to enter
    a user name and password to login to Linux. To launch the graphical desktop you
    type the command startx then hit the Return key.


    Click on the Next button to proceed to the command bootloader installation.'
