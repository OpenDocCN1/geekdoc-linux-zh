  md: '# ...cont''d


    If you prefer to have a graphic image as your desktop background click on the
    Wallpaper tab in the Background dialog and check the Single Wallpaper radio button.


    When the Multiple Wallpapers option is checked the gray-out Setup Multiple button
    becomes active. Click this button to open a dialog box where you can choose a
    variety of wallpapers that automatically change at any interval you determine.


    ![](img/79c73558c68d3c5f59b51559717db1f4_58_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_58_1.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_58_2.png)


    To color a desktop background choose the Hue Shift under the Blending tab - drag
    the Balance slider and watch the preview to see the colorizations. Click the Apply
    button to colonize the actual desktop.


    Click the Browse button to open the Select Wallpaper dialog - this opens in the
    directory where the desktop wallpaper files are located.


    Check the Automatic Preview checkbox then on any listed file to display a preview
