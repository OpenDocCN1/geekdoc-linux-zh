  md: '# Removing packages


    In some Linux distros the package installer that uses the RedHat Package Management
    (RPM) tool is also an uninstaller that you remove packages from your system.


    In Mandrake Linux the uninstaller in “RpmDrake” is separate from that used to
    install packages. Launch the Mandrake Control Center, click on the Software Management
    icon in the left pane, then select the RpmDrake Uninstaller in the right pane
    to open the Software Packages dialog.


    Be careful not to select a group rather than a specific package to avoid removing
    multiple installations by mistake.


    ![](img/79c73558c68d3c5f59b51559717db1f4_177_0.png)


    In the Software Packages dialog select the option to display all packages in alphabetical
    order – these you can select an application to be removed. For instance, to remove
    the “emacs” text editor that was installed on the previous page scroll down the
    list to find that application.


    The emacs installation requires an additional support package to be installed
    so there are two “emacs…” entries listed. The top one contains the libraries required
    to run the text editor – which is


    Linux in easy steps'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# ...cont''d


    to select it for removal and a dialog box appears informing you that you must
    also remove the second emacs package.


    ![](img/79c73558c68d3c5f59b51559717db1f4_178_0.png)


    Click on the More Infos button to read details about what the package actually
    does, then click OK to proceed.


    ![](img/79c73558c68d3c5f59b51559717db1f4_178_1.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_178_2.png)


    Both emacs packages get checked in the list to they are selected for removal –
    click the Remove button to uninstall them.


    ![](img/79c73558c68d3c5f59b51559717db1f4_178_3.png)


    A small dialog appears while the packages are being removed.


    Upon completion the dialog disappears, the emacs application is no longer available,
    and its entry in the Start menu has been removed.'
