  md: '# ...cont''d


    In Linux these type of shortcuts are known as “symbolic links” or “symlinks”,
    and sometimes as “soft links”. When you click on this type of link it operates
    on the original file to which it points. There can be multiple symbolic links,
    all pointing to the same original file. If the original file deletes the links
    point to an empty location so the shortcuts no longer work.


    Linux also allows the creation of “hard links”. This type of link creates a copy
    of the original file, but in another location. When you click on this type of
    link it operates on the copy file and updates the original file to be identical.
    There can be multiple hard links, all getting updated whenever changes are made
    to any one of them. If the original file deletes the hard links continue to work
    until the one is deleted from the system.


    To make a hard link to a file right-click on the desktop then click on the Create
    New menu and select the Link To location option.


    ![](img/79c73558c68d3c5f59b51559717db1f4_102_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_102_1.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_102_2.png)


    A symbolic link is just a pointer, whereas a hard link is an actual file – normally
    use symbolic links to create desktop shortcuts to your files and apps.


    In the dialog that appears to the file to which you want to hard link click the
    OK button – an icon gets added to the desktop displaying the same name as to which
    it is linked.


    Click on the desktop hard link file and it will open to reveal identical contents
    to the original file. Add some content then save the hard link file. Now open
    the original file and notice that it too contains the added content. Delete the
    original file and see that you can still open the intact hard link file on the
    desktop.


