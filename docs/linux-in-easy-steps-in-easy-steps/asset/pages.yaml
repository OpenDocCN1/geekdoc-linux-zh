  md: '# Getting help


    Help on any graphical KDE application can be sought by KDE Help Center. This is
    launched by clicking the life-belt icon on the taskbar, or on the Documentation
    menu. Click on the Application Manuals option in the left-hand pane to expand
    a representation of the applications, as they appear under the Start menu. Navigate
    to the application you want, then click to open its Handbook.


    ![](img/79c73558c68d3c5f59b51559717db1f4_65_0.png)


    The KDE Help Center can also be opened inside the Konqueror application by typing
    help:/ in the location field. It can also display manual pages by typing man:/
    and Info pages with info:/


    ![](img/79c73558c68d3c5f59b51559717db1f4_65_1.png)


    The KDE Help Center menu also contains an option to view the UNIX manual pages
    which describe in detail each command and their range of optional switches. These
    can also be viewed in text mode by typing man at a command prompt, followed by
    a space and the command you want help with. For instance, type ls to see the UNIX
    manual page for the ls command – this reveals the directory contents.


    Help with a command at a prompt type the command name, followed by a --help


    ![](img/79c73558c68d3c5f59b51559717db1f4_65_2.png)


    Some UNIX manual pages can seem confusing but the KDE Help Center can also browse
    Info pages that provide similar information in a more user-friendly manner. Like
    the manual pages these too can be viewed in text mode by typing info at a command
    prompt, followed by a space and the command you want help with. For instance,
    type info ls to see the Info page for the ls command.'
