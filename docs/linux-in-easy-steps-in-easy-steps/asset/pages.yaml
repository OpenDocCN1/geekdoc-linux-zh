  md: '# # Installing a local printer


    The system control center can easily configure a local printer.

    In Mandrake Linux can launch the Mandrake Control Center and click on the Hardware
    menu item, then click the PrinterDrake icon.


    The Common UNIX Printing System ("CUPS") is a cross-platform printing solution
    for all UNIX environments. It provides complete printing services to PostScript
    and raster printers.


    ![](img/79c73558c68d3c5f59b51559717db1f4_43_0.png)


    Click the Add A New Printer button then the OK button to auto-detect a local printer
    – the wizard will then detect the printer connected to the system''s parallel
    port or USB port.


    When prompted give the printer name, or accept the default name of "Printer",
    then confirm that the printer has been correctly identified so that the appropriate
    driver can be installed.


    GhostScript is an important program for Linux printing. Most printing software
    generates PostScript, which is typically a $100 on a printer. GhostScript, however,
    is free, and will generate the language of your printer from PostScript.


    ![](img/79c73558c68d3c5f59b51559717db1f4_43_1.png)


    42 | Linux in easy steps'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# ...cont''d


    The next step of the printer installation enables default media settings to be
    selected. Enter preferences for paper size and print resolution then click the
    OK button to continue.


    Increasing the print resolution to a high level can significantly slow the print
    speed.


    ![](img/79c73558c68d3c5f59b51559717db1f4_44_0.png)


    The printer wizard will now ask if you would like to print out a test page to
    confirm that the printer has been configured correctly. Choose the type of test
    page you prefer then click the Print button to begin printing. Click the Yes button
    to acknowledge that the test page printer is acceptable. Finally click the Done
    button to close the wizard — you can now print from application menu by selecting
    File, then Print.


    ![](img/79c73558c68d3c5f59b51559717db1f4_44_1.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_44_2.png)


    3. Configuring hardware for Linux | 43'
  merge: -1
