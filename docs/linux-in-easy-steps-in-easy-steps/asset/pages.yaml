  md: '# Allocating disk space


    The next step of the installation is to allocate disk space for Linux and will
    vary according to the configuration of your system.


    The installer presents four options in this case:


    ![](img/79c73558c68d3c5f59b51559717db1f4_23_0.png)


    The first option to “Use existing partitions” may only appear if the system has
    been previously configured for Linux. For instance, where you want to replace
    an existing Linux installation.


    The second option to “Erase the entire disk” is useful when you want to replace
    an existing Windows operating system with Linux.


    Be aware that the third option to “Use the free space on the Windows partition”
    may restrict the space available when working in Windows.


    Choose “Custom disk partitioning” if you need to resize the Windows partition
    to create space for Linux or if you want to install Linux on a second HD drive.
    When you click the Next button the installer graphically displays your current
    partitions. Each HD drive is given its own tabbed window – the master HD drive
    is labelled “hda” and the slave HD drive, if present, is labelled “hdb”.


