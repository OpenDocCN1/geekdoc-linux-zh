  md: '# Creating a user account


    The next step of the Linux installation requires at least one user account to
    be created. For the home-user this will normally be the account they will use
    to logon to Linux for their everyday use.


    Enter your actual name in the first field and a short user name in the second
    field. Now enter a password in both other input fields.


    Optionally you can also click on the displayed icon to select a custom icon for
    this user account.


    A user password is mandatory. Make a note of the exact user name and password
    you enter – you will need these later.


    ![](img/79c73558c68d3c5f59b51559717db1f4_30_0.png)


    Linux is case-sensitive so take care with uppercase and lowercase characters –
    user “Mike” will be regarded as a different user to the one named “mike” here.


    Click on the Accept User button to create a user account for each person that
    will use your computer. When all user accounts have been created click on the
    Next button to proceed.


