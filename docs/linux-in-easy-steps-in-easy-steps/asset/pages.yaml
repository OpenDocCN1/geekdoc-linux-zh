  md: '# Introducing the OpenOffice suite


    The OpenOffice suite is an application containing a set of office tools similar
    to those in Microsoft Office. It is based on original code from the StarOffice
    application by Sun MicroSystems. made the code freely available for development
    by the open-source community so OpenOffice has no proprietary ties. The splash
    screen that displays when OpenOffice is launched does, acknowledge this heritage.


    OpenOffice is included with most Linux distros. It can also be freely downloaded
    from www.openoffice.org - clear installation instructions provided on the website
    too.


    ![](img/79c73558c68d3c5f59b51559717db1f4_111_0.png)


    There are versions of OpenOffice available for many platforms, including Linux,
    Mac OS X and Windows.


    OpenOffice comprises word processor (“Writer”), spreadsheet (“Calc”), and presentation
    (“Impress”) programs that are similar to the Word, Excel and PowerPoint programs
    in MS Office. It also has a program, to create charts, graphs and diagrams (“Draw”),
    and a specialized tool for formatting mathematical formulas (“Math”). If you are
    familiar with MS Office you will feel instantly at home with the OpenOffice equivalents.


    Most importantly, OpenOffice contains files that allow it to work with standard
    MS Office documents from Word, Excel and PowerPoint. Files can be saved in MS
    Office file formats, as well as native to OpenOffice.


    It can embed objects (OLE objects, plugins, video, applets, charts) within a document
    – but using these advanced features may create issues when trying to share the
    document with another office suite. For instance, an OpenOffice document containing
    an embedded spreadsheet works in OpenOffice, but the spreadsheet may not be displayed
    when that document is viewed in MS Word.'
