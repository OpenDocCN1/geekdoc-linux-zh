    Jobs that take a while to execute as background jobs using the **bg** command
    to specify their job number. In the screenshot below the **find** command is making
    a list of all files anywhere on the system that have a **txt** file extension.
    It is first stopped using the Ctrl+Z keys, made a process to use other programs
    while it runs.


    **-fprint** flags the name of each .txt file on a separate line in a new file
    (txtlist) that creates in the user''s home directory. Notice how background jobs
