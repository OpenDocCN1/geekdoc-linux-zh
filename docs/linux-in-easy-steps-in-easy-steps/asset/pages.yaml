  md: '# Accessing files in Windows


    On dual-boot systems the Windows partition may be mounted in Linux to allow a
    degree of access to the files stored there. This process is similar to the way
    that peripheral devices are mounted - allowing access to files on portable media,
    such as CD-ROMs.


    User-friendly Linux distros, such as Mandrake Linux, automatically mount the Windows
    partition for you. This means you can easily access the files in Windows from
    the /mnt/windows directory in Linux.


    This example shows one of the sample images supplied with Photoshop (on the Windows
    partition) being readily accessed from Linux.


    ![](img/79c73558c68d3c5f59b51559717db1f4_105_0.png)


    104 | Linux in easy steps'
  merge: -1
  pgno: 105
- img_proc: true
  md: '# ...cont''d


    Older Windows 9.x operating systems use the FAT or FAT32 system which Linux can
    both read from, and write to. Modern Windows platforms, such as XP, use the NTFS
    file system which can be less simple – some Linux distros do not support NTFS
    so cannot access the Windows partition at all. Other dist, such as Mandrake Linux,
    may be able to read from NTFS but not write to – check your documentation to see
    if it supports NTFS.


    ![](img/79c73558c68d3c5f59b51559717db1f4_106_0.png)


    Where Linux cannot directly write to the Windows partition you can copy files
    into Linux for modification save them on portable media, such as a CD-ROM or floppy
    disk – boot Windows and copy the modified files back in.


    If your Linux distro does not automatically mount the Windows partition, may need
    to do so manually. First determine the physical location of the Windows partition
    – if it''s at the start of the first HD drive it will probably be /dev/hda1. Use
    the Control Center to find the location – for instance, in RedHat Linux Browser
    and select Hard Drives.


    At a command prompt type su, then enter the root password to login to the root
    account. Now create a directory in which the Windows partition can be mounted
    using this command


    ```

    mkdir /mnt/windows

    ```


    To mount the Windows partition in this new directory, the following command (where
    /dev/hda1 is the Windows partition):


    ```

    mount -t vfat /dev/hda1 /mnt/windows

    ```


    Type exit to logout of the root account and access your Windows by changing into
    the mounted Windows partition:


    ```

    cd /mnt/windows

    ```


    ![](img/79c73558c68d3c5f59b51559717db1f4_106_1.png)


    You will need to modify the line to reflect the location of the Windows partition
    if /dev/hda1 – and the file system if not vfat.


    To automatically mount a Windows partition every time Linux boots you modify the
    /etc/fstab file, which configures all systems and disk device mounting options.
    Open this file in a text editor, such as KEdit, and add the line to save the file.


    ```

    /dev/hda1 /mnt/windows vfat auto,umask=0 0 0

    ```


    Now whenever Linux is booted, the /etc/fstab file is read, and the Windows partition
    gets automatically mounted in /mnt/windows.


    7. Handling files | 105'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# # Compressing and extracting files


    Files in Linux, and other Unix-based operating systems, are typically archived
    into a “tarball” for compact transfer. This first creates a Tape Archive (TAR)
    copy of the file then compresses using the familiar ZIP compression format.


    TAR was originally used for backing up files on tape in a manner that preserves
    the file permissions and hierarchy.


    In KDE right-click on a directory folder to be archived then select the “Tar this
    directory” option on the context menu. A tarball of the directory and its contents
    are created in the current location—this has the same name, but adds a .tar.gz
    extension.


    ![](img/79c73558c68d3c5f59b51559717db1f4_107_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_107_1.png)


    | Create Directory... |

    |---||

    | Open |

    | Undo: Move | Ctrl+Z |

    | Cut | Ctrl+X |

    | Copy | Ctrl+C |

    | Paste | Ctrl+V |

    | Rename | F2 |

    | Move to Trash | Delete |

    | Delete | Shift+Delete |

    | Add to Bookmarks |

    |Open With... |

    | Bzip2 this directory |

    | Tar this directory |

    | Zip this directory |

    | Open Terminal Here |

    | Edit File Type... |

    | Properties |


    ![](img/79c73558c68d3c5f59b51559717db1f4_107_2.png)


    The ZIP tool in Linux is called GZip—hence the .gz part of the file extension
    of the tarball archive.


    ![](img/79c73558c68d3c5f59b51559717db1f4_107_3.png)


    To extract the contents of a tarball in KDE right-click on the file then select
    the “Extract here” option from the context menu. The application associated with
    archives will then deposit all the expanded file contents in the current directory
    location.


    Alternatively, choose the Open With context menu option and select the archive
    tool you would prefer to extract the contents. This allows specific files to be
    selected for extraction within the tarball and lets you choose a destination other
    than the current location.


    106 | Linux in easy steps'
  merge: -1
  pgno: 107
- img_proc: true
  md: '# ...cont''d


    The tar program can be used at the command line with its cf (create file) option
    to archive a directory or file/s. For instance, the following command creates
    an archive called images.tar from a directory /imgs that contains some image files.


    The tar program has many options – it''s common to add the v option for verbose
    Read the tar manual for the full list of options.


    # tar cf images.tar imgs


    You can list the contents of an existing archive with the tf option, such as tar
    tf images.tar. And the contents of an archive can be extracted to the current
    directory with the xf option, such as tar xf images.tar.


    The GZip program can be used at the command line to compress an individual file
    or tar archive. For example, the command


    # gzip images.tar


    compresses a tar archive to produce a tarball named images.tar.gz. Similarly,
    a compressed file can be uncompressed with the gunzip command – gunzip images.tar.gz
    reduces the tarball to a archive once more.


    The archiving and compression operations can be combined by adding the z option
    to the other options – so, for instance


    # tar cfz images.tar.gz imgs


    creates an archive then compresses it to produce the tarball named images.tar.gz
    of the /imgs directory and all its contents. The tff options list the tarball''s
    contents and the xfz options will extract all contents into the current directory.


    Extract a specific file from a tarball by adding its name to the end of the extraction
    – or specify multiple files as a space-separated list.


    ![](img/79c73558c68d3c5f59b51559717db1f4_108_0.png)


    7. Handling files | 107'
  merge: -1
  pgno: 108
- img_proc: true
  md: '# # Getting better compression


    Many Linux distros include an alternative to the GZip compression tool called
    Bzip2. This can produce smaller tarball files because it uses better compression
    techniques.


    Right-click on a directory to archive and compress, then select the Bzip2 option
    from the context menu – shown on page 106. The tarball is created in the current
    directory with the directory name and an added file extension of `tar.bz2`.


    In the screenshot below tarballs have been created of the /imgs directory using
    GZip and Bzip2. The original directory size of 4.6MB is compressed to 3.6MB by
    GZip to be.


    Although Bzip2 enjoys widespread support it is not as ubiquitous as the regular
    ZIP format – most tarballs for download are still GZipped archives.


    ![](img/79c73558c68d3c5f59b51559717db1f4_109_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_109_1.png)


    The Bzip2 program can also be used at the command line to compress an individual
    file or archive. For example, the command `bzip2 images.tar` compresses a archive
    to produce a tarball named `images.tar.bz2`. Similarly, a uncompressed file can
    be expanded with the `bunzip2` command – `bunzip2 images.tar.gz` reduces the tarball
    to a tar archive.'
  merge: -1
