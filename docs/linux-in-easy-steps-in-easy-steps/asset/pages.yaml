- img_proc: true
  md: '# Introducing the GIMP


    The GIMP has much of the functionality found in Photoshop. In some areas it even
    has more capacity – but in other areas it has less. Unlike Photoshop, the GIMP
    is open-source software available free of charge under terms of the General Public
    License (GPL).


    ![](img/79c73558c68d3c5f59b51559717db1f4_123_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_123_1.png)


    The results of GIMP plug-ins can be less predictable than those in Photoshop for
    inexperienced users.


    There are over 220 plug-ins in the standard GIMP installation that cover virtually
    all the capabilities of the plug-ins that can be purchased as accessories for
    Photoshop. Many of the GIMP plug-ins are more configurable than in Photoshop,
    which means they can create more powerful effects in the hands of an experienced
    user.


    The GIMP can read image files in the Photoshop .psd file format – so if you have
    a library of files in that format you can use to edit them.


    One major advantage of the GIMP over Photoshop is its scripting ability – in no
    less than four scripting languages. For instance, you can write scripts to create
    custom effects using PERL (Practical Extraction and Reporting Language) scripting
    – the preferred language of CGI scripts. The scripting capability of the GIMP
    is unmatched by Photoshop.'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# ...cont''d


    The major pitfall of GIMP is its lack of support for CMYK colors or spot colors,
    such as PANTONE – it only supports 8-bit RGB, grayscale and indexed images. The
    GIMP cannot, therefore, compete with Photoshop in the prepress field, but does
    offer some exciting possibilities in the creation of digital images for the web.


    When the GIMP is launched for the first time it installs configuration files –
    just click OK to accept the default selections. The splash screen (opposite) displays
    while the application loads.


    You will notice that the GIMP looks very different from Photoshop. It opens with
    the GIMP toolbox dialog, and usually further dialogs for Tools Options, Layers,
    Channels & Paths, and Brush Selection – like those illustrated below.


    ![](img/79c73558c68d3c5f59b51559717db1f4_124_0.png)


    The icons on the buttons broadly correspond to those in the Photoshop toolbox
    – place the pointer over each icon to see a tooltip describing that button''s
    purpose. Notice that The GIMP tools dialog also has menus.


