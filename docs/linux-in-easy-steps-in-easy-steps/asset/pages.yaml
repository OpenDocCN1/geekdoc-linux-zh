  md: "# Looping a script\n\nA script can be made to repeatedly execute commands for\
    \ every item in a list with a for-in loop statement. Typically this specifies\
    \ a variable that references successive items in each iteration of the loop –\
    \ the first item on the first iteration, the second item on the second iteration,\
    \ and so on. Its syntax is:\n\nSupply of a list of names to a for-in loop to have\
    \ the same command actions performed on each file.\n\n![](img/79c73558c68d3c5f59b51559717db1f4_171_0.png)\n\
    \n```\nfor var in item-1 item-2 item-3\ndone\n    action/s\n```\n\nThe traditional\
    \ for loop, from the C language, can also be used to repeatedly execute commands\
    \ in a shell script. This typically has a counter variable, traditionally named\
    \ i, that counts until it reaches a specified value. It is assigned an initial\
    \ value in the for statement which also includes the terminal value, as a test\
    \ expression, and a means to change the counter on each iteration – usually is\
    \ incremented on each iteration. This loop's syntax is:\n\n```\nfor(( initializer;\
    \ test-expression; change ))\ndone\n    action/s\n```\n\nBoth types of for loops\
    \ feature in the example script shown below.\n\n![](img/79c73558c68d3c5f59b51559717db1f4_171_1.png)\n\
    \nThe ++ increment operator increases the current value by one (i++ is i+1). Similarly,\
    \ the -- decrement operator reduces the current value by one (-- is i-1).\n\n\
    ![](img/79c73558c68d3c5f59b51559717db1f4_171_2.png)\n\n170 | Linux in easy steps"
