  md: '# Choosing a Linux distro


    At the very heart of Linux is a bunch of tried and tested compiled code called
    the "kernel". The kernel provides the operating system with its core functionality,
    much like the engine in a car. It takes care of the basics, such as helping other
    programs access hardware and sharing your computer''s processor among various
    programs.


    In addition to the kernel Linux contains a number of system-level programs, such
    as the services to handle your email, web connection and bootloader. Consider
    these as a car''s transmission, gears and chassis – without these the engine is
    not much use.


    Linux distributions generally include a large number of user-level programs –
    the applications for daily use. For instance, web browsers, word processors, text
    editors, graphics editors, media players, and so on. These are the finishing touches
    to the car that ensure a great ride – whitewall tires and soft leather upholstery.


    All of these components are bundled together in a wide variety of Linux distribution
    packages, commonly referred to as "distros". Just as all components of a car are
    bundled together to make a complete car.


    ![](img/79c73558c68d3c5f59b51559717db1f4_11_0.png)


    In the same way that there are makes and models of car there are many Linux distros
    to choose from. The most well known distros are RedHat, Mandrake, SuSE, Debian
    and Slack. Each has its own installer and unique default configuration according
    to what the distributor considers to be the best arrangement. The ideal one for
    you will depend on your own personal preferences and how you want to use Linux.
    The most popular distributions are described below to help you choose.


    # RedHat Fedora


    One of the most published Linux distros. The installation procedure is simple
    and straightforward but manual configuration may be required after installation
    to provide access to other drives, such as the floppy drive or CD drive. The installation
    does not provide suitable security for a server – it requires a custom configuration
    and downloaded upgrades before deployment as a server. The Fedora Linux distro,
    and upgrades, are available for free download at http://fedora.redhat.com.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '...cont''d


    # Mandrake


    Generally regarded as the smoothest installation procedure of all Linux distros.
    Mandrake Linux includes many user programs and automatically configures other
    drives for ready access. This great distro is like an enhanced version of RedHat
    Linux – with a better interface and configuration options. It is highly recommended
    for those new to Linux and can be freely downloaded from www.mandrakelinux.com.


    ![](img/79c73558c68d3c5f59b51559717db1f4_12_0.png)


    # Novell SuSE


    A fully featured Linux distro from German distributor (SuSE), acquired by Novell.
    It has a simple to use installer called YaST which also allows configuration of
    Linux as a desktop or server. It supports even the most obscure hardware. This
    distro cannot be downloaded but can be ordered as a boxed set of CD-ROMs at www.suse.com.
    The Java Desktop System (JDS) from Sun Microsystems is also based on this distro
    – see www.sun.com/software/javadesktopystem.


    ![](img/79c73558c68d3c5f59b51559717db1f4_12_1.png)


    # Debian


    This distro adheres strongly to the principal of free software does not bundle
    any of the commercial applications that other distros include. It is extremely
    powerful and its package management features make it easy to upgrade your system.
    The Debian distro can be freely downloaded at www.debian.org.


    ![](img/79c73558c68d3c5f59b51559717db1f4_12_2.png)


    # Slackware


    A compact stripped-down version of Linux without any frills. This distro is better
    suited to those who are experienced in Linux as the reduced features make it less
    user-friendly than other distros. The default installation provides adequate security
    for a server. It can be freely downloaded at www.slackware.com.


    ![](img/79c73558c68d3c5f59b51559717db1f4_12_3.png)


    All Linux distributions that are bundled with numerous programs are obviously
    pretty-sized. For instance, Mandrake Linux occupies three CD-ROMs. Downloading
    a distro of this size is time-consuming with a high speed Internet connection.
    An alternative is to buy the distro on CD-ROMs from the distributor. Copies made
    by other Linux users can also be purchased cheaply on the Internet from websites
    such as DistroWatch at www.distrowatch.com or try using a search engine.'
