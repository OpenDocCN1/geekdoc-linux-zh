  md: '# Using filters


    Like Photoshop, the GIMP includes a large number of filters that can be used to
    apply effects to an image. These are accessed by choosing sub-menus of the Filters
    option on the right-click context menu. The GIMP filters are grouped into the
    following categories:


    # Animation


    An Animation Player that displays layers as sequential frames and lets you easily
    create animations in the GIF file format. It also provides optimization to keep
    those animations.


    ![](img/79c73558c68d3c5f59b51559717db1f4_133_0.png)


    HOT TIP  Add a number of different colored rectangles to a white background then
    use the


    Artistic, Cubism filter to create an instant masterpiece.


    # Artistic


    Filters to create instant artistic effects, such as cubist paintings and mosaic
    patterns. These can be applied to the entire image or just to a selected area
    to add a special effect.


    # Blur


    Many types of blur filters are useful to soften part of an image. For instance,
    to soften a shadow''s edge — real shadows seldom have hard edges so it''s a good
    idea to depict them with blurred edges using a suitable blur filter. Additionally,
    blur filters are useful to disguise skin imperfections and wrinkles in portrait
    images.


    # Colors


    A range of filters that let you manipulate the Red, Green, Blue (RGB) and Hue,
    Saturation, Value (HSV) properties of an image or a selected area.


    # Distorts


    Filters that create special surface effects, such as ripples on water, wind effects,
    waves, whirl and pinch. These filters are especially useful to create textures.


    # Edge-Detect


    Filters that allow you to find the edges of an object as defined by its color
    boundary. These can be useful to make the selection of an area easy with the Fuzzy
    Select tool, or to simplify a color fill using the Paint Bucket tool.'
  merge: -1
  pgno: 133
- img_proc: true
  md: '# ...cont''d


    # Enhance


    Useful filters to clean up an image or selection – let you despeckel, deinterlace
    and destripse. This category also contains a sharpen filter that is especially
    useful to make photo images more crisp.


    Use Shift+Alt+F keys to bring up the dialog for the last filter you used – use
    Alt+F to


    ![](img/79c73558c68d3c5f59b51559717db1f4_134_0.png)


    # Generic


    Includes mathematical filters that use a Convolution Matrix for image manipulation
    – this can perform various manipulations but some math knowledge is required to
    use its possibilities to the full.


    apply the last filter once more.


    # Glass Effects


    These filters do not create the appearance of various glass surfaces, as you might
    expect, but are rather useful to create different kinds of lenses or curved mirror
    shapes.


    # Light Effects


    A range of filters that you can use to add shine, lustre and lighting flare to
    an image or selection. There are a wide variety of lighting effects that can be
    achieved with these filters if you are used to Photoshop''s excellent Lighting
    Effects dialog you may find these less intuitive to apply.


    take the time to read the Tip Of The Day each you start The GIMP – there are


    ![](img/79c73558c68d3c5f59b51559717db1f4_134_1.png)


    # Map


    Includes a number of filters that create interesting effects by displacement or
    distortion relative to an image map.


    # Noise


    Filters that add speckles to an image or selection. These are useful to represent
    noise or film graininess.


    many handy gems in there.


    # Render


    Spectacular effects can be added to images or objects with the filters in this
    category. These include natural effects, such as clouds and flames, together with
    pattern effects such as mosaics, grids and jigsaw puzzle.'
  merge: -1
