    ![](img/79c73558c68d3c5f59b51559717db1f4_57_2.png)


    Each virtual desktop a distinct background color to easily distinguish one from
    another.


    In the dialog click the desktop number you want to configure. Uncheck the Common
    background checkbox to allow the desktop to have a different background.


    Under the Background tab click on the Color 1 to open the Select Color dialog
    and choose a color. Repeat for Color 2 to select a second color if desired.


    Click on the arrow button to reveal the drop-down Mode menu and select any of
    the options. A live preview is displayed in the dialog''s graphic to demonstrate
    how the desktop background will appear in the chosen mode.


    Repeat the procedure for each individual desktop. When you''re happy with your
    choice of colors and mode click on the Apply button to set the desktop background
    colors.'
  merge: -1
