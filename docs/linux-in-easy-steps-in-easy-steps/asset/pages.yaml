- img_proc: true
  md: '# Running scripts


    The GIMP provides support for scripts that can be used to perform a number of
    set actions on an image. A wide range of custom scripts are included with the
    GIMP installation – these are written by GIMP enthusiasts and offer some great
    effects.


    Ready-made scripts can be found on the Script-Fu menu under the Xnts menu in the
    GIMP toolbox window. There are further scripts available from the Script-Fu option
    on the right-click context menu in the image window.


    Scripts are useful to perform a series of repetitive actions to create an object
    within an image. For instance, you could create a 3-dimensional sphere object,
    by filling a circle with an appropriate gradient fill, then create a blurred shadow
    on a lower layer to give the impression of a ball sitting on a flat surface. The
    GIMP has a script to execute all the operations needed to create this object easily
    – in the toolbox Xnts menu clicks on the Script-Fu, Misc, Sphere option.


    The screenshots on these two pages show the GIMP in SuSE Linux distro they identify
    the default style of the SuSE window decorations.


    ![](img/79c73558c68d3c5f59b51559717db1f4_135_0.png)


    Many scripts initially display a dialog box where you can specify parameters for
    text, font, size, background and foreground color, and so on. The Sphere script
    launches a dialog where you can specify the size of the sphere, the direction
    of the light source, whether to include a shadow, and individual colors for the
    background area.'
  merge: -1
  pgno: 135
- img_proc: true
  md: '# ...cont''d


    Press the About key to reveal a description of the script plus details about copyright
    and the author of that script.


    ![](img/79c73558c68d3c5f59b51559717db1f4_136_0.png)


    When you are happy with your choices on the OK button to run the script. In this
    case the sphere object is created in a new image window – with the features you
    specified.


    The script items on the context menu are the same as those under the Xtrs sub-menu.
    Generally, those operate on the current image window – the others create in a
    new image window.


    ![](img/79c73558c68d3c5f59b51559717db1f4_136_1.png)


    Further free scripts can be downloaded from the Internet and added to the GIMP
    to provide even more functionality – try searching for “Script-Fu” or visit www.gimp.org.


    GIMP scripts are typically located in /usr/share/gimp/x.x/scripts (where x.x represents
    the GIMP version number on your system). Copy new scripts to the same directory,
    then click on the X, Script-Fu, Refresh menu – the new script should now be available
    from one of the Script-Fu menus in the GIMP.


    # Creating graphics | 135'
