  md: '# Popular Linux commands


    The table below lists commands frequently input at the Linux command prompt. Many
    commands also have optional arguments to determine their specific output. To discover
    more about each Linux command read its manual page. For instance, to discover
    the options available for the ls type man ls at the prompt.


    | Command | Operation | Example |

    |------|---|---|

    | ls | List files and sub-directories | ls |

    | cp | Copy a file | cp file /home |

    | mv | Move a file | mv file /home |

    | mv | Rename a file | mv file12 |

    | rm | Delete a file | rm file |

    | vi | Edit a file | vi file |

    | less | View a file | less file |

    | diff | Compare two files | diff file1 file2 |

    | grep | Find a phrase in a file | grep phrase file |

    | clear | Clear the screen | clear |

    | exit | Close a prompt window | exit |

    | date | Display the date and time | date |

    | date | Set the date and time | date MMDDhmmCCYY.ss |

    | mk2fs | Format a floppy disk | mk2fs /dev/fd0 |

    | man | Get command help | man command |

    | mkdir | Make a directory | mkdir directory |

    | rmdir | Delete a directory | rmdir directory |

    | pwd | Show the current location | pwd |

    | cd | Change directory | cd /home/directory |

    | free | Show memory usage | free |'
