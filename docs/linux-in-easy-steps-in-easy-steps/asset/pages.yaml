  md: '# Formulas in OpenOffice Math


    The Math application within the OpenOffice suite allows mathematical formulas
    to be inserted into documents in a strictly controlled format. With a document
    open in OpenOffice Writer click on the Insert, Object, Formula menu to enter formula
    mode – a “command” area appears at the bottom of the window.


    ![](img/79c73558c68d3c5f59b51559717db1f4_121_0.png)


    Right-click on the command area to see the range of predefined formula controls
    on the context menu. Select any one of these, or type directly in the command
    area to build the formula. Click in the main window to close the command area
    and see the formatted formula appear in the document.


    In mode, click on the Tools, Catalog to find a catalog of mathematical symbols
    that can be inserted into a formula. This includes Greek characters and also has
    a “Special” collection where you can add your own symbols.


    Catalog symbols are referenced by prefixing their name with a % character in the
    command code – in the example shown below e, %x, %B and pi reference Special symbols.
    Notice that expressions are enclosed within curly brackets, while the ` tick character
