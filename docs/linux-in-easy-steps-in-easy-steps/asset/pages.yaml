  md: '# # Touring the Linux file structure


    The Linux directory structure is markedly different to that in Windows. This chapter
    begins by highlighting some of the fundamental differences between Linux and Windows
    then goes on to describe the hierarchical layout of Linux directories. The purpose
    of each standard Linux sub-directory is explained to illustrate how they are used.
    Demonstrations show how to navigate through the Linux directory structure – both
    in a graphical environment and from the command line.


    # ## Covers


    +   - The Linux directory tree | 82

    - Standard sub-directories | 84

    - Navigating with File Manager | 88

    - Navigating from the command line | 90

    - File system dos and don''ts | 92


    ![](img/79c73558c68d3c5f59b51559717db1f4_82_0.png)'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# The Linux directory tree


    When moving from Windows, the new Linux user needs to be aware of some fundamental
    differences between the two operating systems:


    +   - Linux is case-sensitive – Windows is not. For instance, a file named "readme.txt"
    and "README.txt" are seen as two distinctly different files in Linux, but there
    is no distinction between them


    +   - Linux directories and files have ownership permissions that can restrict
    accessibility to the owner or group – Windows directories and files are generally
    universally accessible


    +   - Linux was developed from the outset as a multi-user operating system – Windows
    evolved from DOS as a single-user operating system intended for home use


    +   - Linux users cannot change system settings, only the "root" super-user may
    do – Windows desktop users have free reign


    +   - Linux partitions are created using the Ext3 file system – Windows partitions
    use FAT, FAT32 or NTFS file systems


    +   - Linux path names contain slash characters – Windows path names contain backslash
    characters. For instance, a Linux path /usr/bin and a Windows path C:\mysqlbin


    +   - Linux does not have drive letters – Windows typically uses A: for the floppy
    drive, C: for the hard disk drive, D: for the CD drive, and so on.


    The lack of drive letters in Linux indicates what is, probably, the biggest difference
    between Linux and Windows – the way directory structures are arranged. In Linux
    everything is contained within a single unified hierarchical system – beginning
    with the “root” directory, symbolized by a forward slash //


    The Linux installation creates a number of standard sub-directories within the
    root directory. Each of these, has its own sub-directory structure, creating a
    directory “tree” – the “root” directory is the root of the tree, as shown opposite.


    Contents of peripheral drives appear in the tree in the directory at which they
    are “mounted” by Linux, creating a unified interface.


    ![](img/79c73558c68d3c5f59b51559717db1f4_83_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_83_1.png)


    other drives may not.


    22 | Linux in easy steps'
