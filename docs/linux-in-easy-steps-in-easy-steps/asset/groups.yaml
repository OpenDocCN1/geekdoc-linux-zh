    ## 更好的压缩率


    许多 Linux 发行版都包含一种 GZip 压缩工具的替代方案，称为 Bzip2。这可以产生更小的 tarball 文件，因为它使用了更好的压缩技术。


    右键点击要归档并压缩的目录，然后从右菜单中选择 Bzip2 选项——见第 106 页。tarball 将在当前目录下创建，文件名带有目录名并添加了 `tar.bz2`
    扩展。


    在下方的截图中，使用 GZip 和 Bzip2 为 /imgs 目录创建了 tarball。原始目录大小为 4.6MB，GZip 压缩到了 3.6MB。


    尽管 Bzip2 得到了广泛支持，但它并不像普通的 ZIP 格式那样无处不在——大多数下载的 tarball 仍然 GZip 压缩包。


    ![](img/79c73558c68d3c5f59b51559717db1f4_109_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_109_1.png)


    Bzip2 程序也可以在命令行中使用来压缩单个文件或归档。例如，命令 `bzip2 images.tar` 会压缩归档并生成一个名为 `images.tar.bz2`
    的 tarball。同样，可以使用 `bunzip2` 命令扩展未压缩的文件——`bunzip2 images.tar.gz` 将 tarball 还原为
    tar 归档。


    ## 在 Linux 办公套件中工作


    本章介绍了在 Linux 中广泛使用的免费 OpenOffice 套件的功能。它审视了这款开源应用程序与市场领先的 Microsoft Office 产品相比如何，并说明了
    OpenOffice 的一些额外优势。


    ## 目录


