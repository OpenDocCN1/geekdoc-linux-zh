    # Transferring files


    File Transfer Protocol (FTP) is a client-server protocol that enables files to
    be efficiently transferred around networks – such as the Internet and Local Area
    Network (LAN).


    A public FTP is hosted on the Internet. The web browser allows you to browse FTP
    sites graphically. For instance, the screenshot below illustrates how to login
    to the Opera web site. Navigate through pub, linux to reach versions of Opera
    that are available. Click on the preferred file to transfer it to your computer.


