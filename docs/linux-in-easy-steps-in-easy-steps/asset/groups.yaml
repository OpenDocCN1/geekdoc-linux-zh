    9. Creating graphics | 123'
  - '[PAGE 125]


    # # Starting a new image


    The initial appearance of the GIMP generally leads new users to question where
    the menus and working area are – you can only see the File and Xnt menus in The
    GIMP toolbox, and these contain very little.


    To access the full GIMP menus a new, or existing, image must first be opened.
    Select File, Open and browse to an existing image file, or click File, New to
    create a new image. In the New Image dialog set the Image Size, preferred Fill
    Type and Image Type – RGB for color or Grayscale for mono. Then click the OK button
    to open the new image window.


    > The GIMP does not support CMYK color separation.


    ![](img/79c73558c68d3c5f59b51559717db1f4_125_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_125_1.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_125_2.png)


    24 | Linux in easy steps'
  - '[PAGE 126]


    # Finding the menus


    Right-click on the image window to open the context menu – this contains all the
    menus and sub-menus that you would normally expect to find on the taskbar in other
    graphic programs. For instance, to rotate the image through 90 degrees right-click
    then choose Image, Transforms, Rotate, 90 degrees.


    ![](img/79c73558c68d3c5f59b51559717db1f4_126_0.png)


    The menus can alternatively be seen by clicking on the arrowed button in the top
    left comer of the image window.


    ![](img/79c73558c68d3c5f59b51559717db1f4_126_1.png)


    This arrangement initially feels odd if you are working in Photoshop when you
    get used to realize the benefit of moving the mouse less distance to access the
    menus.


    Select Dialogs, Tool Options on the context menu to open the options dialog for
    the current tool. Alternatively double-click on any button in the GIMP toolbox
    to open the options dialog for that tool. For instance, double-click the Pencil
    tool button in the GIMP toolbox to display the Tool Options for the Pencil tool.
    These allow you to specify Opacity, Mode and settings for Graphics Tablet input.


    ![](img/79c73558c68d3c5f59b51559717db1f4_126_2.png)


    The Pencil and paintbrush tools are very similar but the Pencil will not draw
    edges – even if a fuzzy brush is selected. Shift and click with the Pencil tool
    to draw straight lines.


    ![](img/79c73558c68d3c5f59b51559717db1f4_126_3.png)


