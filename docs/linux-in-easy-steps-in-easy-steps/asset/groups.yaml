    ## Getting help


    Help on any graphical KDE application can be sought by KDE Help Center. This is
    launched by clicking the life-belt icon on the taskbar, or on the Documentation
    menu. Click on the Application Manuals option in the left-hand pane to expand
    a representation of the applications, as they appear under the Start menu. Navigate
    to the application you want, then click to open its Handbook.


    ![](img/79c73558c68d3c5f59b51559717db1f4_65_0.png)


    The KDE Help Center can also be opened inside the Konqueror application by typing
    help:/ in the location field. It can also display manual pages by typing man:/
    and Info pages with info:/


    ![](img/79c73558c68d3c5f59b51559717db1f4_65_1.png)


    The KDE Help Center menu also contains an option to view the UNIX manual pages
    which describe in detail each command and their range of optional switches. These
    can also be viewed in text mode by typing man at a command prompt, followed by
    a space and the command you want help with. For instance, type ls to see the UNIX
    manual page for the ls command – this reveals the directory contents.


    Help with a command at a prompt type the command name, followed by a --help


    ![](img/79c73558c68d3c5f59b51559717db1f4_65_2.png)


    Some UNIX manual pages can seem confusing but the KDE Help Center can also browse
    Info pages that provide similar information in a more user-friendly manner. Like
    the manual pages these too can be viewed in text mode by typing info at a command
    prompt, followed by a space and the command you want help with. For instance,
    type info ls to see the Info page for the ls command.


    ## Surfing the web


    This chapter illustrates how to perform a wide range of online activities in Linux
    – once connected to the Internet it''s easy to view websites, send and receive
    email, and transfer files around the world. It also describes how to build your
    own web pages using free applications that are bundled with most distros.


    ## Covers


    - Connecting to the Internet | 66

    - The Mozilla web browser | 68

    - Setting up email | 70

    - Storing email addresses | 72

    - Joining newsgroups | 74

    - Transferring files | 76

    - Composing web pages | 78

    - Messaging online | 80


    Chapter Five


    ## Connecting to the Internet


    The simplest way to set up Internet access is via an ethernet connection. This
    will have been automatically configured during the Linux installation process
    if the Network Interface Card (NIC) was installed and connected.


    If you are using a dial-up service with a modem, or if you are subsequently installing
    an ethernet NIC, use the Internet Configuration wizard to configure the connection.


    For instance, launch the Mandrate Control Center and click the Network & Internet
    menu option, then the dialog should show details of the NIC and its driver. Alternatively
    the modern details should appear if you are configuring a modem.


    ![](img/79c73558c68d3c5f59b51559717db1f4_67_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_67_1.png)


    If the detected connection device does not have driver support menu option. Then
    select the device from the list that appears in the dialog and click on the Run
    Config Tool to configure the device. Return to the Network & Internet dialog and
    start the Connection wizard.


    Click the Wizard button to begin Internet configuration. In the first dialog box
    check the box marked Use Auto-Detection, then click the Next button. The wizard
    will search for your connection device and report what it finds in the next dialog.
    Choose the connection you want to configure, then click the Next button. Check
    the box to use an Automatic IP address, or manually enter the address details
    if you want to use a static IP address.


    ## ...cont''d


    If the wizard asks you to enter a host name or use the default, just click the
    Next to accept the default host name.


    ![](img/79c73558c68d3c5f59b51559717db1f4_68_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_68_1.png)


    Click the Next button to complete the configuration wizard – the Hostname and
    IP address details should now appear in the DrakConnect dialog, and the status
    should have changed to Connected. Launch any web browser and in the URL field
    type the address **www.google.com** – the search page should appear.


    Internet configuration in Linux is usually straightforward — you may need to get
    advice from your ISP if you encounter any connection difficulties.


    ![](img/79c73558c68d3c5f59b51559717db1f4_68_2.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_68_3.png)


