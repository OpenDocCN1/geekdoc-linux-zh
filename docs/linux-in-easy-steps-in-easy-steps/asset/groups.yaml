    # Installing the bootloader


    The Linux installer will normally install the bootloader on the main HD drive
    where it finds Windows boot instructions in the Master Boot Record (MBR) on that
    drive.


    If the installer asks you to choose where to install the bootloader you should
    select the option to install it in the MBR if you wish to run a dual-boot system.
    This will present you with an option menu whenever the computer boots allowing
    you to select - Windows or Linux, etc..


    ![](img/79c73558c68d3c5f59b51559717db1f4_32_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_32_1.png)


    Installing the bootloader onto a floppy disk will allow Linux to be started from
    the floppy drive when the BIOS setup seeks boot instructions from that drive before
    the HD drive.


    The other options should normally be avoided as they may prevent you from starting
    Linux on your computer.


    Click on the Next button to install the bootloader at the chosen location and
    the Linux installer presents a summary of the installation.'
