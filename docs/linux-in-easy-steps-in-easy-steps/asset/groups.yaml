    ## Installing a local printer


    The system control center can easily configure a local printer.

    In Mandrake Linux you can launch the Mandrake Control Center and click on the
    Hardware menu item, then click the PrinterDrake icon.


    The Common UNIX Printing System ("CUPS") is a cross-platform printing solution
    for all UNIX environments. It provides complete printing services to PostScript
    and raster printers.


    ![](img/79c73558c68d3c5f59b51559717db1f4_43_0.png)


    Click the Add A New Printer button then the OK button to auto-detect a local printer
    – the wizard will then detect the printer connected to the system''s parallel
    port or USB port.


    When prompted give the printer name, or accept the default name of "Printer",
    then confirm that the printer has been correctly identified so that the appropriate
    driver can be installed.


    GhostScript is an important program for Linux printing. Most printing software
    generates PostScript, which is typically a $100 on a printer. GhostScript, however,
    is free, and will generate the language of your printer from PostScript.


    ![](img/79c73558c68d3c5f59b51559717db1f4_43_1.png)


    42 | Linux in easy steps


    ## ...cont''d


    The next step of the printer installation enables default media settings to be
    selected. Enter preferences for paper size and print resolution then click the
    OK button to continue.


    Increasing the print resolution to a high level can significantly slow the print
    speed.


    ![](img/79c73558c68d3c5f59b51559717db1f4_44_0.png)


    The printer wizard will now ask if you would like to print out a test page to
    confirm that the printer has been configured correctly. Choose the type of test
    page you prefer then click the Print button to begin printing. Click the Yes button
    to acknowledge that the test page printer is acceptable. Finally click the Done
    button to close the wizard — you can now print from application menu by selecting
    File, then Print.


    ![](img/79c73558c68d3c5f59b51559717db1f4_44_1.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_44_2.png)


    3. Configuring hardware for Linux | 43


    ## Setting up a TV card


    If a TV tuner card is installed in your computer it can be configured using the
    system control center.


    In Mandrake Linux launch the Mandrake Control Center. Click on the Hardware menu
    item, then click the DraksTV icon that appears in the right-hand pane. Select
    the card and tuner type from the lists, or choose “Auto-detect” to let the wizard
    discover, then click the OK button to proceed.


    ![](img/79c73558c68d3c5f59b51559717db1f4_45_0.png)


    The television formats broadcast different numbers: of lines at various speeds.
    If you are unsure of the system used where you are typing “world television standards”
    in a web search engine.


    ![](img/79c73558c68d3c5f59b51559717db1f4_45_1.png)


    Next choose your location from the drop-down list and select the television standard
    used to transmit signals in your area - NTSC (National Television System Committee)
    in North America, PAL (Phase Alternating Line) in the UK and Australia, SECAM
    (Sequential Couleur Avec Memoire) in France and Russia, et al.


    ![](img/79c73558c68d3c5f59b51559717db1f4_45_2.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_45_3.png)


    If you''re in the USA and receive television via cable choose USA (cable) rather
    than USA (broadcast).


    ## ...cont''d


    Click on the OK button to proceed and a second window appears in which a range
    of frequencies are scanned, in turn, to find the TV channels available in your
    area.


    The channels detected will vary according to your location. The ??? frequencies
    shown here are detected TV channels whose names are unknown — will still be showed
    so those channels can be viewed.


    ![](img/79c73558c68d3c5f59b51559717db1f4_46_0.png)


    When scanning is complete the second window closes and those frequencies that
    were found to contain a TV channel are stored. Installation of a TV card places
    an icon on the desktop that can be used to launch the TV application and view
    the stored channels.


    ![](img/79c73558c68d3c5f59b51559717db1f4_46_1.png)


    No sound? – Check that there is a lead connecting the Audio Out socket on the
    TV card to the Line In socket on the sound card.


    3. Configuring hardware for Linux | 45


    ## Installing a scanner


    Connecting a scanner to your computer is made simple with the system control center.


    In Mandrake Linux launch the Mandrake Control Center then click on the ScannerDrake
    icon in the right-hand pane. The wizard should then detect the scanner that is
    connected to your system.


    ![](img/79c73558c68d3c5f59b51559717db1f4_47_0.png)


    > HOT TIP: The scanner featured here is the "AS66" which was mass-produced under
    a variety of badges. Although popular, it is not generally supported in Linux
    distros a driver is available for download from the web at http://as6driver.sourceforge.net.


    It may ask you to insert one of the distribution CD-ROMs so it can install appropriate
    software for the scanner. Typically this will be the Xsane program that allows
    you to import scanned images into your computer.


    ![](img/79c73558c68d3c5f59b51559717db1f4_47_1.png)


    ## ...cont''d


    Scanning images is an art – the balance between resolution and image size is gained
    by experience.


