    两个 emacs 软件包都在列表中，因此它们被选中删除——点击“删除”（Remove）按钮卸载它们。


    ![](img/79c73558c68d3c5f59b51559717db1f4_178_3.png)


    在删除软件包时会弹出一个小型对话框。


    完成后，对话框消失，emacs 不再可用，其在开始菜单中的条目已被移除。


    ## 下载 KDE 软件包


    在 KDE 桌面中，可以使用 Konqueror 浏览器通过文件传输协议（FTP）轻松下载 RPM 软件包。启动 Konqueror，然后在 Konqueror
    主菜单上选择“打开位置”（Open Location）选项以启动打开位置对话框。在“位置”（Location）字段中输入 FTP 站名称，然后点击“确定”按钮连接到指定站点。例如，要通过
    FTP 下载 Opera 浏览器 RPM 软件包，启动“打开位置”对话框并输入 `ftp.opera.com` 然后点击“确定”。


    ![](img/79c73558c68d3c5f59b51559717db1f4_179_0.png)


    Konqueror 连接到 Opera FTP 站点并显示其根目录的内容——一个包含欢迎信息的文本文件和一个名为 /pub 的子目录。点击此目录显示其内容，并继续浏览系统以找到你想要下载的
    RPM 软件包。


    ![](img/79c73558c68d3c5f59b51559717db1f4_179_1.png)


    大多数提供免费下载的 FTP 站点接受“anonymous”作为登录用户名，并将你的电子邮件地址作为密码——Konqueror 会自动提供这些信息以便登录。


    点击 RPM 软件包，会弹出一个对话框询问你是否想要下载或打开文件——点击“另存为”（Save As）按钮。


    ...续


    ![](img/79c73558c68d3c5f59b51559717db1f4_180_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_180_1.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_180_2.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_180_3.png)


    你也可以将文件从 Conqueror 拖放到桌面上。


    当“另存为”对话框出现时，导航到下载软件包的目标位置——桌面通常最方便。点击“保存”（Save）按钮开始下载，会出现一个显示进度指示的箭头。


    ![](img/79c73558c68d3c5f59b51559717db1f4_180_4.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_180_5.png)opera-7.23-2003119.5-shared-qt.i386.rpm


    下载完成后，目标位置会出现一个 RPM 图标，该软件包准备好在你的系统上安装。


    13. 扩展你的 Linux 系统 | 179


    ## 安装下载


    要从下载的 RPM 软件包开始安装应用程序，只需点击软件包图标。例如，点击上一页下载到桌面的 Opera RPM 图标。


    消息对话框询问你是否想要安装该应用程序——点击“确定”。


    ![](img/79c73558c68d3c5f59b51559717db1f4_181_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_1.png你可以在 http://gnupg.org 发现更多关于 GPG
    的信息


    现在可能会出现对话框，显示错误消息“软件包无 GPG 签名”。GPG 是 Gnu Privacy Guard 的缩写——是一种用于文件验证的 Linux 公钥加密系统。Opera
    RPM 软件包和其他文件未使用 GPG，因此可以安全地忽略此消息。点击“是”（Yes）继续安装。


    ![](img/79c73558c68d3c5f59b51559717db1f4_181_2.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_181_3.png)


    当 Opera 浏览器正在你的系统上安装时，会出现一个显示进度指示的小对话框。


    安装完成后，可以删除 RPM 软件包文件。


    ![](img/79c73558c68d3c5f59b51559717db1f4_181_4.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_5.png)


    ...续


    当安装完成后，Opera 已安装在 / 目录下，并在开始菜单中创建了菜单项。


    你可以将 Opera 图标拖到工具栏创建快速启动按钮。


    ![](img/79c73558c68d3c5f59b51559717db1f4_182_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_182_1.png)


    点击 Opera 图标或在 shell 提示符中输入 Opera 来启动 Opera 浏览器。


    ![](img/79c73558c68d3c5f59b51559717db1f4_182_2.png)


    13. 扩展你的 Linux 系统 | 181


    ## 安装其他桌面


    Gnome 桌面环境是许多 Linux 用户 KDE 桌面的流行替代。它可以像应用程序一样从大多数发行版安装。


    在 Mandrake Linux 中，启动 RPM，然后在“图形环境”（Graphical Environment）菜单下选择 Gnome Workstation
    选项。在出现的对话框中点击“确定”按钮以接受 Gnome 的额外软件包。


    ![](img/79c73558c68d3c5f59b51559717db1f4_183_0.png)


    需要的额外软件包

    为了满足依赖，还需要安装以下软件包：

    - cdabelpen-2.5.0-1mdk

    - cdparanois-il9-8-5mdk

    - cdecord-2.0-2mdk

    - cdecord-d4wav-2.0-2mdk

    - gnome-2.2-0-1mdk

    - libg2-2.0-9-3mdk

    - libre-0.2-3-1mdk

    - libbeta-0.2-3-1mdk

    - linuxconf-1.293-3mdk

    - locales-ja-2.3.1.4-6mdk

    - locales-ko-2.3.1.4-6mdk

    - locales-zh-2.3.1.4-6mdk

    - mkisofs-0.2-2mdk

    - openssh-askpass-gnome-3.51-7mdk


    按照提示插入发行版 CD，然后点击“确定”按钮开始安装——另一个对话框显示显示软件包安装过程的进度指示器。


    ...续


    ![](img/79c73558c68d3c5f59b51559717db1f4_184_0.png)


    完成后，对话框确认软件包安装成功。打开 Mandrake 控制中心，点击“启动”（Boot）菜单，然后选择系统选项。更改系统启动时自动登录 Gnome，然后点击“确定”按钮应用更新。


    重启系统，Linux 现在将自动登录到 Gnome 桌面环境。


    ![](img/79c73558c68d3c5f59b51559717db1f4_184_1.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_184_2.png)


    13. 扩展你的 Linux 系统 | 183


    ## 切换桌面


    在图形 Linux 桌面上点击“开始”菜单，退出对话框提供了停止或重启计算机的选项，并提供作为不同用户登录。


    退出和登录对话框的外观取决于使用的显示管理器——这里显示的退出对话框来自 K 桌面管理器 (KDM)，而登录对话框来自 Gnome 桌面管理器 (GDM)。


    ![](img/79c73558c68d3c5f59b51559717db1f4_185_0.png)


    选择作为不同用户登录将关闭当前图形桌面并显示登录对话框。登录对话框让你选择想要使用的桌面环境。例如，在 Gnome 桌面管理器登录对话框中选择你喜好的桌面。


    “系统”（System）、配置”（Configure）菜单允许你更改桌面的属性。


    ![](img/79c73558c68d3c5f59b51559717db1f4_185_1.png)


    接下来输入你的名称和密码，然后点击“确定”按钮启动桌面。


    ...续


    许多对话框都有用户的头像——点击退出。


    ![](img/79c73558c68d3c5f59b51559717db1f4_186_0.png)


    如果你选择不登录另一个桌面，退出对话框也可用于重启你的系统。


    ![](img/79c73558c68d3c5f59b51559717db1f4_186_1.png)


    13. 扩展你的 Linux 系统 | 186


