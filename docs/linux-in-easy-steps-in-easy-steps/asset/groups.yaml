    ## Compressing and extracting files


    The tar program can be used at the command line with its cf (create file) option
    to archive a directory or file. For instance, the following command creates an
    archive called..tar from a directoryimgs that contains some files.


    ```bash

    tar cf images.tar imgs

    ```


    The tar program has many options – it''s common to add the v option for verbose
    Read the tar manual for the full list of options.


    You can list the contents of an existing archive with the tf option, such as tar
    tf images.tar. And the contents of an archive can be extracted to the current
    directory with the xf option, such as tar xf images.tar.


    The GZip program can be used at the command line to compress an individual file
    or tar archive. For example, the command


    ```bash

    gzip images.tar

    ```


    compresses a tar archive to produce a tarball named images.tar.gz. Similarly,
    a compressed file can be uncompressed with the gunzip command – gunzip images.tar.gz
    reduces the tarball to a once more.


    The archiving and compression operations can be combined by adding the z option
    to the other options – so, for instance


    ```bash

    tar cfz images.tar.gz imgs

    ```


    creates an archive then compresses it to produce the tarball named images.tar.gz
    of the /imgs directory and all its contents. The tff options list the tarball''s
    contents and the xfz options will extract all contents into the current directory.


    Extract a specific file from a tarball by adding its name to the end of the extraction
    – or specify multiple files as a space-separated list.


    ![](img/79c73558c68d3c5f59b51559717db1f4_107_0.png)


    The ZIP tool in Linux is called GZip—hence the .gz part of the extension.![](img/79c73558c68d3c5f59b51559717db1f4_107_1.png)


    To extract the contents of a tarball in KDE right-click on the file then select
    the “Extract here” option from the context menu. The application associated with
    archives will then deposit all the files in the current directory. Alternatively,
    choose the Open With context menu and select the archive tool you would prefer
    to extract the files within the location vfat.


