    | 06 Don''t Let It Pass You | 7:46 | |

    | 07 Don''t Slow Down | 4:25 | |

    | 08 In It Life | 4:35 | |

    | 09 Red Hot Wind | 3:36 | ✓ |

    | 10 Don''t Make Me Cry | 3:25 | |

    | 11 Many Rivers To Cross | 4:33 | |

    | 12 Cherry Oh Baby | 3:18 | |

    | 13 It Happens Again | 3:44 | ✓ |

    | 14 I Got You | 3:10 | |

    | 15 Don''t Break My Heart | 3:52 | ✓ |

    | 16 Sing Our Own Song | 4:08 | |

    | 17 Rat In My Kitchen | 3:09 | |

    | 18 Tomorrow | 3:24 | |


    音频 CD 以未压缩的形式（即一系列的 1 和 0）存储音乐，Grip 起初可以先将其作为 WAV 文件复制到硬盘。它会创建一个 MP3 格式的压缩版本并删除大型的
    WAV 文件。


    ![](img/79c73558c68d3c5f59b51559717db1f4_148_3.png)


    点击“帮助”（Help）标签获取更多关于使用 Grip 刻录音频曲目的详细信息。


    在“曲目”（Tracks）标签下选择你想要复制（“刻录”）的音频曲目。切换到配置（Config）、编码（Encode）、编码器（Encoder）窗口并设置输出格式——在标记为“编码格式”（Encode
    format）的字段中确保文件名为 .mp3。


    要将所选曲目复制到硬盘，点击“刻录”（Rip）标签然后点击“刻录+编码”（Rip+Encode）按钮——进度条将显示每个曲目如何被复制然后编码为 MP3 格式。


    完成后，可以在你的主目录下找到所选曲目的 MP3 版本。


