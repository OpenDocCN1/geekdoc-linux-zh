    | mv | 移动文件 | mv file /home |

    | mv | 重命名文件 | mv file1 file2 |

    | rm | 删除文件 | rm file |

    | vi | 编辑文件 | vi file |

    | less | 查看文件 | less file |

    | diff | 比较两个文件 | diff file1 file2 |

    | grep | 在文件中查找短语 | grep phrase file |

    | clear | 清除屏幕 | clear |

    | exit | 关闭终端窗口 | exit |

    | date | 显示日期和时间 | date |

    | date | 设置日期和时间 | date MMDDhmmCCYY.ss |

    | mk2fs | 格式化软盘 | mk2fs /dev/fd0 |

    | man | 获取命令帮助 | man command |

    | mkdir | 创建目录 | mkdir directory |

    | rmdir | 删除目录 | rmdir directory |

    | pwd | 显示当前位置 | pwd |

    | cd | 切换目录 | cd /home/directory |

    | free | 显示内存占用 | free |


