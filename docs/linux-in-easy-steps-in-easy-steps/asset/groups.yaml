    20 | Linux 快速步骤


    ### 选择正确的安全级别

    在配置鼠标后，安装程序会要求您从四个安全级别中选择一个，从“标准（Standard）”到“偏执（Paranoid）”。

    较高的安全级别通常是以牺牲易用性为代价的。如果大多数用户仅连接到互联网使用网络浏览器并发送或接收邮件，那么默认“标准”安全级别就能让他们满意。


    ![](img/79c73558c68d3c5f59b51559717db1f4_22_0.png)


    另一方面，如果您打算将 Linux 系统用作服务器，您应该真的选择更高的安全级别，以防止在多次连接期间可能出现的问题。当系统存储关键数据或作为 Web 服务器直接连接到互联网时，情况尤为如此。

    选择您喜欢的安全级别，然后点击“下一步”继续安装。


    ![](img/79c73558c68d3c5f59b51559717db1f4_22_1.png)


    在 Linux 安装过程中选择的设置稍后可以通过再次运行 Linux 安装程序升级已安装的 Linux 系统进行修改。这意味着如果证明有必要，以后可以提高安全级别。


    ### 分配磁盘空间

    安装的下一步是为 Linux 分配磁盘空间，这将根据您的系统配置而异。

    情况下，安装程序提供了四个选项：


    ![](img/79c73558c68d3c5f59b51559717db1f4_23_0.png)


    第一个选项“使用现有分区（Use existing partitions）”仅在系统之前配置过 Linux 时才会出现。例如，当您想要替换现有的安装时。

    第二个选项“删除整个磁盘（Erase the entire disk）”在您想用 Linux 替换现有的 Windows 操作系统用。

    注意，第三个选项“使用 Windows 分区的空闲空间（Use the free space on the Windows partition）”可能会限制
    Windows 环境下的可用空间。

    如果您需要调整 Windows 分区的大小为 Linux 创建空间，或者您想在第二个硬盘上安装 Linux，请选择“自定义磁盘（Custom disk）”。当您点击“下一步”按钮时，安装程序将图形化地显示您当前的分区。每个硬盘都有自己的标签页——主硬盘标记为“hda”，从盘硬盘（如果存在）被标记为“hdb”。


