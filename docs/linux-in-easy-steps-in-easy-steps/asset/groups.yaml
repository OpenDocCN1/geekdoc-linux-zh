    ## Playing and ripping CDs


    The KDE Simple CD (KSCD) application is the standard Linux audio CD player. Its
    interface has the familiar control buttons that you find on real CD players plus
    four more for additional features.


    Click on the “Compact Disc Digital Audio” logo button to cycle through the displayed
    time – show playing time remaining and time elapsed for the track and entire disk.
    Click the button with the tools icon to open the configuration dialog where you
    can change the display controls and other simple options. The “i” button helps
    search for artist information online, such as concert dates.


    ![](img/79c73558c68d3c5f59b51559717db1f4_147_0.png)


    The CD button in the top right corner of the KSCD window does not stop the player
    -- select the Quit option from its system tray icon to stop.


    ![](img/79c73558c68d3c5f59b51559717db1f4_147_1.png)


    The display shows artist and track details if a CD Database entry is available
    – or you can make your own. Click on the button, enter the artist and track details,
    then click the OK button to save.


    ![](img/79c73558c68d3c5f59b51559717db1f4_147_2.png)


    If you cannot find the system tray icon you may have accidentally removed the
    tray -- to recover it right-click on the panel and select Add, Applet, System
    Tray.


    ![](img/79c73558c68d3c5f59b51559717db1f4_147_3.png)


    ## ...cont''d


    "Grip" is another standard CD application in Linux that can be used to play CD
    tracks and can also copy tracks to your hard drive in compressed form - converted
    to the MP3 format. Tooltips appear when you place the point over each button to
    describe their purpose – click on the "Toggle track display" button to open the
    tabbed windows.


    ![](img/79c73558c68d3c5f59b51559717db1f4_148_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_148_1.png)


    Click in the Rip column to select individual tracks or click the Rip header to
    select all tracks.


    ![](img/79c73558c68d3c5f59b51559717db1f4_148_2.png)


    | Track | Length | Rip |

    |---|---|---|---|

    | 05 Dream A Lie | 3:38 | |

    | 06 Don''t Let It Pass You | 7:46 | |

    | 07 Don''t Slow Down | 4:25 | |

    | 08 In It Life | 4:35 | |

    | 09 Red Hot Wind | 3:36 | ✓ |

    | 10 Don''t Make Me Cry | 3:25 | |

    | 11 Many Rivers To Cross | 4:33 | |

    | 12 Cherry Oh Baby | 3:18 | |

    | 13 It Happens Again | 3:44 | ✓ |

    | 14 I Got You | 3:10 | |

    | 15 Don''t Break My Heart | 3:52 | ✓ |

    | 16 Sing Our Own Song | 4:08 | |

    | 17 Rat In My Kitchen | 3:09 | |

    | 18 Tomorrow | 3:24 | |


    Audio CDs store music in uncompressed form, as a series of ones and zeros, that
    Grip can initially copy to the hard drive as a WAV file. It creates a compressed
    version in MP3 format and deletes the large WAV file.


    ![](img/79c73558c68d3c5f59b51559717db1f4_148_3.png)


    Click the Help tab for more detailed information on ripping audio tracks with
    Grip.


    Select the audio tracks that you want to copy ("rip") under the Tracks tab. Switch
    to the Config, Encode, Encoder window and set the output format – in the field
    labelled "Encode format" ensure that the file extension is .mp3.


    To copy the selected tracks to your hard drive click on the Rip tab then click
    the Rip+Encode button – progress bars indicate how each track is copied then encoded
    in the MP3 format.


    On completion, MP3 versions of the tracks you selected can be found in your home
    directory.


