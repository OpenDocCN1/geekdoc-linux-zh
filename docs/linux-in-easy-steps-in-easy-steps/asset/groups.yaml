    ## 安装桌面方案


    除了前面页面介绍的自定义方法外，更改桌面外观的另一种方法是采用现成的方案。


    启动 KDE 控制中心，选择“外观”菜单下的“方案管理器”。在“方案管理器”对话框中列出了许多方案——点击任何一个方案即可查看预览。点击“应用”按钮实施更改。


    下面的截图展示了应用“木”方案后的窗口。


    ![](img/79c73558c68d3c5f59b51559717db1f4_61_0.png)

    ![](img/79c73558c68d3c5f59b51559717db1f4_61_1.png)


    更多方案可以从网上下载。在“方案管理器”对话框中点击“添加”按钮进行添加——这些通常是压缩包。将其解压到桌面。


    ![](img/79c73558c68d3c5f59b51559717db1f4_61_2.png)


