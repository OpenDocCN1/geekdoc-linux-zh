    [mike]$ grep --curfew grays_elegy\nThe curfew tolls the knell of parting day,\n\
    [mike]$ \n```\n\nI. Using the Linux shell | 159\n\n## Printing from the shell\n\
    \nTo send a file to the printer for printing type the command lpr, followed by\
    \ a space, the name or path of the file. For instance, to print a file named simple.txt,\
    \ located in your home directory, just type lpr simple.txt then hit the Return\
    \ key.\n\nThis command creates a \"job\" containing the data from the specified\
    \ file. Each job is placed in a queue awaiting transmission to the printer – when\
    \ it reaches the front of the queue it gets sent to the printer and is printed\
    \ out.\n\nYou can examine jobs in the print queue with the lq command – each job\
    \ is automatically assigned a job number. A job can be removed from the queue,\
    \ before it gets sent to the printer, using the lpm command together with its\
    \ job number.\n\nIn the screenshot below the user initially queued three files\
    \ to be printed. When the queue is examined the first file has already printed,\
    \ the second is currently printing, and the third is awaiting transmission to\
    \ the printer. The user dequeues the third file so it does not get out.\n\nA print\
    \ job can only be queued by its owner, or the root user.\n\n| Rank | File | Size\
    \ |\n| :--- | :--- | :--- |\n| 1 | gray_elegy | 44 bytes |\n| 2 | simple.txt |\
    \ 1024 bytes |\n| 3 | | 0 |\n\nPrinting from a shell command is not restricted\
    \ to simply files – data can also be queued for printing using the lpr command\
    \ with pipe character. For instance, you can print a long listing of the contents\
    \ of /etc by piping an ls command to lpr command like this:\n\n```\nls /etc |\
    \ lpr\n```\n\n## Scripting for the shell\n\nThis chapter introduces shell scripts\
    \ that effectively allow you to create your own commands. It demonstrates how\
    \ to write shell scripts and where to place them so they can be executed from\
    \ any shell prompt.\n\n| Covers | |\n| :--- | :--- |\n- Using shell commands |\
    \ 162 |\n- Editing text streams | 164 |\n- Substituting variables | 165 |\n- Creating\
    \ a shell script | 166 |\n- Branching a script | 168 |\n- Looping a script | 170\
    \ |\n- Handling input | 172 |\n\n## Using shell commands\n\nShell scripts allow\
    \ a number of specified shell commands to be executed in sequence by simply typing\
    \ the script name at a shell prompt – effectively making the script a custom command.\n\
    \nBefore starting out it is useful to explore some of the commands most used in\
    \ shell scripts. The echo command allows you to perform simple formatting using\
    \ escape sequences. These all begin with a backslash. The most frequently used\
    \ escape sequences are \\n (add a newline) and \\t (add a tab) – both are used\
    \ in the screenshot below demonstrating the echo command and its options.\n\n\
    The clear command can be used at any time to remove previous content – leaving\
    \ the cursor at a new prompt at the top of the shell display.\n\n## expr\n\nThe\
    \ expr command provides the ability to evaluate arithmetic expressions at a shell\
    \ prompt. It uses the usual operators to add +, subtract /, multiply *, and modulus\
    \ % but it only recognizes integer values - it does not work with floating-point\
    \ numbers.\n\nAttempting to evaluate an expression that contains floating-point\
    \ numbers each value is supplied as a separate argument to the expr command so\
    \ they must have a space before and after. Parentheses can be used to clarify\
    \ the meaning of the expression, the order in which it should be evaluated – the\
    \ arithmetic is performed within the parentheses first, then outside later.\n\n\
    \ comparisons the expr command returns 1 where the expression is found to be true,\
    \ or zero if the expression is found to be false. It supports the usual operators\
    \ to test expressions for equality ==, inequality !=, greater-than > and less-than\
    \ < values.\n\nTo avoid an interpreter error it is important to surround each\
    \ multiplication * character, greater-than > character, less-than < character,\
    \ and parenthesis character, with quotes.\n\nThe results of evaluating some expressions\
    \ with the expr command can be seen in the screenshot below – see how the result\
    \ of the multiplication examples after parentheses are added.\n\nThe expr command\
    \ also be used for boolean arithmetic matching – see the expr man pages for details.\n\
    \n```\n[mike]$ expr 21 + 7\n28\n[mike]$ expr 21 / 7\n3\n[mike]$ expr 5 \"* = 6\
    \ - 3\n27\n[mike]$ expr 5 \"* = \\(6 - 3)\"\n15\n[mike]$ expr 25 % 7\n4\n[mike]$\
    \ expr 8 == 8\n1\n[mike]$ expr 9 \">\" = 4\n0\n[mike]$ expr 9 \"< = 4\n0\n[mike]$\
    \ \n```\n"
