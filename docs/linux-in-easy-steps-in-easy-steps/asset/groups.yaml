    # ...cont''d


    The taskbar is highly customizable and has a special facility for this very purpose.
    Right-click on the taskbar and choose Configure Panel from the context menu to
    open the Settings dialog box.


    Like most aspects of Linux there are often ways to do things; the Settings dialog
    can also be opened from the KDE Control Center with the LookAndFeel, Panels menu
    items.


    ![](img/79c73558c68d3c5f59b51559717db1f4_52_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_52_1.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_52_2.png)


    A great Hiding option allows you to choose the position, height and length of
    the taskbar under its Arrangement tab. Options under the Hiding tab let you decide
    when the taskbar should be hidden to reveal more desktop working area. Which applications
    to include on the Start menu can be edited under the Menus tab.


    The Appearance settings configure buttons on the taskbar so they may display tooltips
    and individual background images. This makes them clearly appear as buttons rather
    than just icons.


    The Taskbar settings allow you to control how icons of running applications will
    appear on the taskbar.


    4. Exploring the KDE desktop | 51


    ## Launch applications


    Click on the KDE Start button to open the menu. Running the mouse pointer over
    each menu item displays its sub-menu in a typical fashion – as with the Windows
    Start menu. Navigate through the menus then click any application to launch it.


    ![](img/79c73558c68d3c5f59b51559717db1f4_53_0.png)


    Konqueror is both a web browser and a file manager – it lets you graphically browse
    the files on your computer like Windows Explorer, as well as web pages like Internet
    Explorer.


    ![](img/79c73558c68d3c5f59b51559717db1f4_53_1.png)


    The screenshot above illustrates the Konqueror file/web browser being launched
    from the graphical menu. Notice that its icon also appears as a Quick Launch button
    on the taskbar – so Konqueror can also be launched just by clicking that button.


    Another way to launch Konqueror is to click the Run Command menu item, then enter
    the application''s name in the dialog box that appears – now click the Run button
    to open Konqueror.


    ![](img/79c73558c68d3c5f59b51559717db1f4_53_2.png)


    Konqueror, and other applications, can be launched by typing their name at a command
    prompt in a “shell” window. This is like running an application from a Command
    Prompt in Windows.


    Click on Start, Terminals, then Konsole to open a shell window or its Quick Launch
    button on the taskbar. Now type konqueror at the prompt and hit Return to open
    Konqueror.


    ![](img/79c73558c68d3c5f59b51559717db1f4_54_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_54_1.png)


    ```bash

    [mike@localhost mike]$ konqueror

    ```


    ![](img/79c73558c68d3c5f59b51559717db1f4_54_2.png)


    Konqueror is a windowed application – it can only be launched when the X server
    is running a graphical desktop environment.


    ![](img/79c73558c68d3c5f59b51559717db1f4_54_3.png)


    Note that closing the shell window also terminates applications that have been
    manually launched. Usually is more convenient to launch an application from the
    graphical menu or using a Quick Launch button, but it is occasionally useful to
    launch them from a shell prompt. For instance, if an application fails to launch
    correctly from the Start Menu by a shell prompt, this should display an error
    message explaining why – resolve this error and the program should then launch
    correctly.


    ## Understanding virtual desktops


    One great feature of Linux desktops not found in Windows is the ability to support
    multiple “virtual” desktops. This allows you to open applications on different
    desktops and to easily switch between them.


    By default four virtual desktops are available in KDE and these are depicted on
    the taskbar as a block of four square buttons.


    ![](img/79c73558c68d3c5f59b51559717db1f4_55_0.png)


    The active desktop above is number one that has a white background. When you open
    an application on that desktop the window is represented on its taskbar button.


    ![](img/79c73558c68d3c5f59b51559717db1f4_55_1.png)


    Clicking on a different desktop button presents a fresh desktop, but the application
    continues to run in the original one.


    The copy-paste process in Linux is simple. Just hold the left mouse button and
    drag the cursor over the text it copies the text onto the clipboard. Go to the
    desktop where you want to add the copied text and press the center mouse button
    (or wheel) to paste the text.


    ![](img/79c73558c68d3c5f59b51559717db1f4_55_3.png)


    Now you can open an application on the empty desktop then switch between the applications
    using the taskbar buttons.


    ![](img/79c73558c68d3c5f59b51559717db1f4_55_4.png)


    In the illustration above a document on desktop one launched from the Applications
    menu. A new document is opened in a second instance on desktop two. You can quickly
    copy-paste from the original document to the new document by switching desktops.


    # ...cont''d


    The availability of four virtual desktops is usually sufficient for most situations
    but KDE supports up to sixteen virtual desktops.


    To add more virtual desktops first open the KDE Control Center from the Configuration
    menu. Expand the LookAndFeel and click on the Multiple Desktops option to open
    the dialog.


    To move a running application to another desktop right-click on the top left of
    the window to open the window management menu then select the desktop from the
    Desktop menu.


    ![](img/79c73558c68d3c5f59b51559717db1f4_56_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_56_1.png)


    Use the arrow buttons or drag the slider to adjust the number of virtual desktops
    you want. If you wish may also allocate custom names to each desktop in place
    of their default names to denote their purpose. For instance, "Text 1", "Text
    2", "Graphics 1", "Video", "Browser" and so on. The relevant name appears in the
    tooltip that is displayed when the mouse cursor rests over the taskbar button.


    Finally, click the Apply to implement the changes.


    ![](img/79c73558c68d3c5f59b51559717db1f4_56_2.png)


    Exploring the KDE desktop | 55


    ## Changing the desktop background


    To customize the appearance of a KDE desktop background first open the KDE Control
    Center and select the Background option from the LookAndFeel menu.


    ![](img/79c73558c68d3c5f59b51559717db1f4_57_0.png)


    An alternative way to open the Background dialog is to right-click on the desktop
    and Choose Desktop from the context menu that appears - then select the Background
    option.


    ![](img/79c73558c68d3c5f59b51559717db1f4_57_1.png)


