    ## /boot


    Contains the Linux kernel – the very heart of the operating system. Many people
    incorrectly use the term “operating system” to refer to the Linux environment
    but, strictly speaking, the kernel is the operating system. It is the program
    that controls access to all the hardware devices your computer supports and allows
    multiple programs to run concurrently and share that hardware. Typically the program
    is called “vmlinuz” – other programs that complement the kernel are located in
    the /bin and /sbin directories.


    ## /etc


    Contains system configuration files storing information about everything from
    user passwords and system initialization to screen resolution settings. All these
    are plain text files that can be viewed in any text editor, such as KEdit – should
    there be any binary files in this directory. They control all configuration settings
    which are not user-specific. The files in this directory are roughly equivalent
    to the combination of .ini files and the Registry entries found in the Windows
    operating system.


    ## /proc


    Contains special files that relay information to and from the kernel. The hierarchy
    of “virtual” files within this directory represent the current state of the kernel
    – allowing applications and users to peer into the kernel’s view of the system.
    For instance, at a command prompt type


    ```

    more /proc/cpuinfo

    ```


    to see information about your computer’s processor/s. Similarly, typing the command


    ```

    more /proc/meminfo

    ```


    reveals information about your system’s current memory usage. Unlike binary and
    text files, most virtual files are listed as zero bytes in size and are time stamped
    with the current date and time. This reflects the notion that they are constantly
    updating.


    ## /mnt


    Contains sub-directories that act as gateways to temporarily mounted file systems.
    This is the default location where most distros attach mounted file systems to
    the Linux directory tree. Typically, when peripheral drives have been mounted,
    /mnt/cdrom directory lets you access files on a CD-ROM loaded in the CD drive
    and /mnt/floppy lets you access files on a floppy disk inserted in the floppy
    drive. On systems that dual-boot with Windows, /mnt/windows can reveal files on
    Windows partition although accessibility can be restricted on NTFS file systems.


    ## /usr


    Contains sub-directories storing programs that can be run by any user of that
    system. For instance, games, word processors and media players. This directory
    is roughly equivalent to the C:\Program Files directory in Windows. The /usr/local
    sub-directory is intended for use by the system administrator, when installing
    software locally, to prevent it being overwritten when the system software is
    updated.


    ## /var


    Contains variable data files that store information about ongoing system status,
    particularly logs of system activity. The system administrator (superuser) can
    type the following command at a root prompt to see the record of system activity
    messages:


    ```

    /var/log/messages

    ```


    ## /home


    Contains a sub-directory for each user account to store personal data files. If
    there is a user account named "fred" there will be a /home/fred directory where
    that user can store personal files – other users cannot save files there. This
    directory is where you store all your working documents, images and media files
    and is the rough equivalent of the My Documents directory in the Windows operating
    system.


    ## /tmp


    Contains, as you might expect, temporary files that have been created by running
    programs. Mostly these are deleted when the program closes but some get left behind
    – periodically these should be deleted. This directory is roughly equivalent to
    the C:\Windows\Temp directory in Windows.


    ## /root


    This is the home directory for the root account superuser – for security reasons
    regular users cannot access this directory. If you login to Linux as root and
    open that account’s home directory it is at /root, rather than a sub-directory
    of /home like regular users.


    ## /initrd


    Contains only a text file warning that this directory should not be deleted. It
    is used during the boot process to mount the Linux file system itself. Removing
    this directory will leave the computer unable to boot Linux – instead it will


    ## /opt


    Contains nothing initially, but this directory provides a special area where software
    packages can be installed. The sub-directories in /opt are for add-on software
    packages that are not part of the base operating system.


    ## Navigating with File Manager


    You can navigate through the file system in File Manager by clicking on a folder
    in the right-hand pane, or by clicking on a directory in the navigation panel,
    or by typing its name in the location field and pressing the Return key. For instance,
    navigate to the /bin directory where many of the Linux executables are stored.
    Shortcuts are marked with an arrow – as they are in Windows.


    Position the pointer over a file graphic and information describing that file
    is displayed on the window''s status bar – the screenshot shows the bash program,
    used by the Linux shell.


    Navigation buttons on the toolbar allow you to easily move forward, backward and
    up to a higher directory level. Most often you will want to work in the /home
    directory, which can be reached by any of the usual methods, or by simply clicking
    the “home” button on the toolbar when not in Super User Mode.

