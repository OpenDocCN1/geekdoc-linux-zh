- md: "\n# Using filters\n\nLike Photoshop, the GIMP includes a large number of filters\
    \ that can be used to apply effects to an image. These are accessed by choosing\
    \ sub-menus of the Filters option on the right-click context menu. The GIMP filters\
    \ are grouped into the following categories:\n\n## Animation\n\nAn Animation Player\
    \ that displays layers as sequential frames and lets you easily create animations\
    \ in the GIF file format. It also provides optimization to keep those animations.\n\
    \n![](img/79c73558c68d3c5f59b51559717db1f4_133_0.png)\n\nHOT TIP: Add a number\
    \ of different colored rectangles to a white background then use the Artistic,\
    \ Cubism filter to create an instant masterpiece.\n\n## Artistic\n\nFilters to\
    \ create instant artistic effects, such as cubist paintings and mosaic patterns.\
    \ These can be applied to the entire image or just to a selected area to add a\
    \ special effect.\n\n## Blur\n\nMany types of blur filters are useful to soften\
    \ part of an image. For instance, to soften a shadow's edge — real shadows seldom\
    \ have hard edges so it's a good idea to depict them with blurred edges using\
    \ a suitable blur filter. Additionally, blur filters are useful to disguise skin\
    \ imperfections and wrinkles in portrait images.\n\n## Colors\n\nA range of filters\
    \ that let you manipulate the Red, Green, Blue (RGB) and Hue, Saturation, Value\
    \ (HSV) properties of an image or a selected area.\n\n## Distorts\n\nFilters that\
    \ create special surface effects, such as ripples on water, wind effects, waves,\
    \ whirl and pinch. These filters are especially useful to create textures.\n\n\
    ## Edge-Detect\n\nFilters that allow you to find the edges of an object as defined\
    \ by its color boundary. These can be useful to make the selection of an area\
    \ easy with the Fuzzy Select tool, or to simplify a color fill using the Paint\
    \ Bucket tool.\n\n## Enhance\n\nUseful filters to clean up an image or selection\
    \ – let you despeckel, deinterlace and destripse. This category also contains\
    \ a sharpen filter that is especially useful to make photo images more crisp.\n\
    \nUse Shift+Alt+F keys to bring up the dialog for the last filter you used – use\
    \ Alt+F to apply the last filter once more.\n\n![](img/79c73558c68d3c5f59b51559717db1f4_134_0.png)\n\
    \n## Generic\n\nIncludes mathematical filters that use a Convolution Matrix for\
    \ image manipulation – this can perform various manipulations but some math knowledge\
    \ is required to use its possibilities to the full.\n\n## Glass Effects\n\nThese\
    \ filters do not create the appearance of various glass surfaces, as you might\
    \ expect, but are rather useful to create different kinds of lenses or curved\
    \ mirror shapes.\n\n## Light Effects\n\nA range of filters that you can use to\
    \ add shine, lustre and lighting flare to an image or selection. There are a wide\
    \ variety of lighting effects that can be achieved with these filters if you are\
    \ used to Photoshop's excellent Lighting Effects dialog you may find these less\
    \ intuitive to apply. Take the time to read the Tip Of The Day each you start\
    \ The GIMP – there are many handy gems in there.\n\n![](img/79c73558c68d3c5f59b51559717db1f4_134_1.png)\n\
    \n## Map\n\nIncludes a number of filters that create interesting effects by displacement\
    \ or distortion relative to an image map.\n\n## Noise\n\nFilters that add speckles\
    \ to an image or selection. These are useful to represent noise or film graininess.\n\
    \n## Render\n\nSpectacular effects can be added to images or objects with the\
    \ filters in this category. These include natural effects, such as clouds and\
    \ flames, together with pattern effects such as mosaics, grids and jigsaw puzzle.\n\
    \n## Running scripts\n\nThe GIMP provides support for scripts that can be used\
    \ to perform a number of set actions on an image. A wide range of custom scripts\
    \ are included with the GIMP installation – these are written by GIMP enthusiasts\
    \ and offer some great effects.\n\nReady-made scripts can be found on the Script-Fu\
    \ menu under the Xnts menu in the GIMP toolbox window. There are further scripts\
    \ available from the Script-Fu option on the right-click context menu in the image\
    \ window.\n\nScripts are useful to perform a series of repetitive actions to create\
    \ an object within an image. For instance, you could create a 3-dimensional sphere\
    \ object, by filling a circle with an appropriate gradient fill, then create a\
    \ blurred shadow on a lower layer to give the impression of a ball sitting on\
    \ a flat surface. The GIMP has a script to execute all the operations needed to\
    \ create this object easily – in the toolbox Xnts menu clicks on the Script-Fu,\
    \ Misc, Sphere option.\n\nThe screenshots on these two pages show the GIMP in\
    \ SuSE Linux distro they identify the default style of the SuSE window decorations.\n\
    \n![](img/79c73558c68d3c5f59b51559717db1f4_135_0.png)\n\nMany scripts initially\
    \ display a dialog box where you can specify parameters for text, font, size,\
    \ background and foreground color, and so on. The Sphere script launches a dialog\
    \ where you can specify the size of the sphere, the direction of the light source,\
    \ whether to include a shadow, and individual colors for the background area.\n\
    \nPress the About key to reveal a description of the script plus details about\
    \ copyright and the author of that script.\n\n![](img/79c73558c68d3c5f59b51559717db1f4_136_0.png)\n\
    \nWhen you are happy with your choices on the OK button to run the script. In\
    \ this case the sphere object is created in a new image window – with the features\
    \ you specified.\n\nThe script items on the context menu are the same as those\
    \ under the Xtrs sub-menu. Generally, those operate on the current image window\
    \ – the others create in a new image window.\n\n![](img/79c73558c68d3c5f59b51559717db1f4_136_1.png)\n\
    \nFurther free scripts can be downloaded from the Internet and added to the GIMP\
    \ to provide even more functionality – try searching for “Script-Fu” or visit\
    \ www.gimp.org.\n\nGIMP scripts are typically located in /usr/share/gimp/x.x/scripts\
    \ (where x.x represents the GIMP version number on your system). Copy new scripts\
    \ to the same directory, then click on the X, Script-Fu, Refresh menu – the new\
    \ script should now be available from one of the Script-Fu menus in the GIMP.\n\
    \n## Creating graphics\n\n## Writing your own\n\nMany scripts initially display\
    \ a dialog box where you can specify parameters for text, font, size, background\
    \ and foreground color, and so on. The Sphere script launches a dialog where you\
    \ can specify the size of the sphere, the direction of the light source, whether\
    \ to include a shadow, and individual colors for the background area.\n\n## Playing\
    \ sound and video\n\n## Covers\n\n- Synthesizing sounds\n- Playing recorded sounds\n\
    - Listening to music\n- Watching videos\n- Burning CDs\n\n## Synthesizing sounds\n\
    \nOne of the most compact file formats for electronic music is that of the Musical\
    \ Instrument Digital Interface (MIDI). It was introduced back in 1983 through\
    \ a collaboration between the electronic instrument manufacturers, Roland, Yamaha\
    \ and Korg.\n\nA MIDI file is a text-based set of instructions...\n```\n\n| |\
    \ vel | vol | epr | prog | pan | pit | Instrument | keyboard |\n|---|---|---|---|---|---|---|---|---|\n\
    | 1 | | 88 | | | | | patch/sologgen | ||||||||||| |\n| 2 | | 32 | | | | | patch/abcuss\
    \ | ||||||||||| |\n| 3 | | 0 | | | | | patch/sologgen | ||||||||||| |\n| 4 | |\
    \ | | | | | patch/sologgen | ||||||||||| |\n| 5 | | 22 | | | | | patch/sologgen\
    \ | ||||||||||| |\n| 6 | | | | | | | | ||||||||||| |\n| 7 | | 26 | | | | | patch/nylong\
    \ | ||||||||||| |\n| 8 | | | | | | | | ||||||||||| |\n| 9 | | | | | | | | |||||||||||\
