    # ...cont''d


    The TiMidity interface harks back to earlier days in Linux but most distros include
    a modern attractive front-end for this application called KMidi.


    ![](img/79c73558c68d3c5f59b51559717db1f4_140_0.png)


    Some distros may include the TiMidity++ version which is MIDI player that can
    also convert to WAV format.


    The illustration above shows KMidi in its extended form with its menus visible
    – click on the button labelled “KDE Midi Digital Audio” to hide the menu and the
    bottom panel.


    Click on the File menu and browse to a Midi file, then click the Play button to
    listen to the music. You can choose different options in the KMidi menus to vary
    several aspects of how the file sounds.


    Notice how each track refers to a “patch” – this is a sample of the sound created
    by each instrument. The patch information is kept in files located in the /usr/share/apps/midi/config
    directory. More comprehensive patch sets than the original set are available for
    download – refer to the KMidi Handbook under the Help menu, or use a search engine,
    for further information on how to do this.


    ![](img/79c73558c68d3c5f59b51559717db1f4_140_1.png)


    10. Playing sound and video | 139


    # Playing recorded sounds


    Sounds can be recorded in files as digital audio waveform data in the WAV file.
    This popular format supports a variety of bit resolutions, sample rates and multiple
    audio channels.


    Another popular format for storing waveform data is the AIFF format, developed
    by Apple, that is the standard for Macintosh computers. Neither WAV nor AIFF support
    data compression, while they record sound data accurately, they be unwieldy.


    > "Noatun is not an acronym - it is simply a name" derived from Norse mythology.


    In Linux, WAV and AIFF sounds can be played by a KDE application called Noatun
    - an elaborate front-end for the aRTs (Analog Real Time Synthesizer) sound.


    The default interface for Noatun is a simple dialog whose, Open menu lets you
    browse to a sound file – click the arrow Play button to hear the sound.


    ![](img/79c73558c68d3c5f59b51559717db1f4_141_0.png)


    The simple default Noatun interface can be changed to become much more interesting
    by adding one of the included “skins”. Click on the Settings menu then choose
    the Configure Noatun option to open the Preferences dialog.


    > Be sure that only one interface is checked before clicking Apply – or two of
    Noatun will appear.


    In the left-hand pane select the Plugins option to display a variety of interface
    options in the right-hand pane. The default interface “Excellent” will be checked
    initially. Check an alternative, then click the Apply button, to change the appearance
    of Noatun.


    When the K-Jofol skin has been applied an option “K-Jofol Skins” is added to the
    left-hand pane. Click this option to reveal the Skin Selector in the right-hand
    pane – a number of possibilities are available here and further skins can be installed
    from this dialog.


    Extra skins can be downloaded from the web -- try KDE-Look.org.


    ![](img/79c73558c68d3c5f59b51559717db1f4_142_0.png)


    Noatun can handle playlists and is intended to be a multi-media player, in much
    the same way as Windows Media Player. However, specialized Linux applications
    have been developed that more ably handle playback of compressed media files for
    music and video – good examples of these are illustrated over the next few pages.


    # Listening to music


    The WAV format can provide great sound quality but its files are not compact –
    typically they require 10Mb for each recorded minute. This means that .wav files
    are excellent for short sound clips but unsuitable for pieces of music lasting
    several minutes.


    To address this problem the Moving Picture Experts Group developed the MPEG audio
    layer 3 format that significantly compresses WAV recordings – an 80Mb file can
    be reduced to around 5Mb without noticeable loss in quality. These files have
    the .mp3 file extension and are commonly used to store music tracks in a compact
    manner.


    In Linux, the most popular player for MP3 files is the XMultiMedia System (XMMS)
    application. If you have used the popular WinAmp player on Windows this will look
    familiar to you.


    ![](img/79c73558c68d3c5f59b51559717db1f4_143_0.png) You can also open the XMMS
    menu by right-clicking on its interface.


    ![](img/79c73558c68d3c5f59b51559717db1f4_143_1.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_143_2.png) Click the button in the top-left
    corner of the interface to open its options menu – here you can browse to a file
    to play or open the Playlist Editor and Graphical Equalizers. Use the buttons
    at the bottom of the Playlist Editor to add or remove tracks to play.


    ![](img/79c73558c68d3c5f59b51559717db1f4_143_3.png) The interface buttons let
    you play the files and further control for this are available under the Playback
    menu. All three dialog windows can be reduced to occupy minimal desktop space
    using Window Shade Mode on the Options menu.


    ![](img/79c73558c68d3c5f59b51559717db1f4_144_0.png) Linux in easy steps


    ![](img/77f59b51559717db1f4_144_1.png) Many other settings may be specified using
    the Preferences sub-menu on the Options menu. There is also a Skin Browser option
    that opens the Skin Selector dialog where you can choose one of the many included
    skins to completely change the appearance of the interface, equalizer and playlist.


    ![](img/79c73558c68d3c5f59b51559717db1f4_144_2.png)


    ![](img/7f59b51559717db1f4_144_3.png) The main XMMS interface constantly scrolls
    about the current selection, and when a file is playing, an animation displays
    the wave peaks and troughs. The appearance of the animation can be widely customized
    using the options available under the Visualization menu.


    10. Playing sound and video | 143


    # Watching videos


    The Xine application is a free multi-media player that decodes compressed video
    files in a wide range of formats including AVI, MOV, MPG, MPEG, ASF, WMV and more.


    The Xine (pronounced "exeen") interface looks like a real DVD player and has three
    main buttons down the left edge. Click the top button to open the Playlist Editor
    dialog.


    ![](img/79c73558c68d3c5f59b51559717db1f4_145_0.png) To add videos to the empty
    playlist click on the Add button to open the MRL browser, then navigate to the
    location of the video file on your system – use the Select button to add it to
    the playlist.


    ![](img/7f59b51559717db1f4_145_1.png)


    | Source | CD VCD file |

    |---|---|

    | indiana_jones_trailer_HQ.mpg | just-like-a-pill.mpg |

    | /home/mike/documents/video | MRL BROWSER |

    | Select All Dismiss |


    You can click the arrow button at the bottom of the MRL Browser, or the one in
    the Playlist Editor, to begin playing the selected file.


    # ...cont''d


    Add further videos to the playlist as desired then click the Dismiss button to
    close the MRL Browser dialog. The selected files are now listed in the Playlist
    Editor dialog – the buttons at the bottom of this playlist let you edit the selection.
    When you are happy with the list click the Save button to store your playlist,
    then click the Dismiss button to close the Playlist Editor. Click on the arrow
    Play button in the Xine interface and the items in the playlist are played, sequentially,
    in a separate window.


    Right-click on the video window to hide all other Xine windows – right-click on
    it to get them back.


    ![](img/79c73558c68d3c5f59b51559717db1f4_146_0.png)


    ![](img/7f59b51559717db1f4_146_1.png) The third button at the left of the Xine
    interface opens the MRL browser directly – you can select a file to play instantly,
    without requiring it to be added to a playlist first.


    ![](img/7f59b51559717db1f4_146_2.png) The Xine interface has the usual media player
    controls but additionally has buttons to play in Slow Motion and Fast Motion.
    Also the camera icon button takes a screenshot of the current frame playing and
    stores in your home directory as a PNG image file.


    Click the second button at the left of the Xine interface to adjust video color,
    brightness and contrast, or to change Xine skins.


    ![](img/7f59b51559717db1f4_146_3.png)

