    ## /boot


    包含 Linux 内核——这是操作系统的核心。许多人错误地使用“操作系统”一词来指代 Linux 环境，但严格来说，内核才是操作系统。它是一个控制你计算机支持的所有硬件设备访问的程序，并允许多个程序并发运行且共享这些硬件。通常，该程序被称为“vmlinuz”——其他补充内核的程序位于
    /bin 和 /sbin 目录。


    ## /etc


    包含系统配置文件，存储了从用户密码、系统初始化到屏幕分辨率设置等所有内容的信息。所有这些文件都是纯文本文件，可以使用任何文本编辑器（如 KEdit）进行查看——除非该目录中存在任何二进制文件。它们控制着所有非用户特定的配置设置。该目录中的文件大致等同于
    Windows 操作系统中的 .ini 文件和注册表项（Registry entries）的组合。


    ## /proc


    包含用于与内核之间传递信息的特殊文件。该目录内“虚拟”文件的层级结构代表了内核的当前状态——允许应用程序和用户查看内核对系统的视图。例如，在命令提示符中输入


    ```

    more /proc/cpuinfo

    ```


    即可查看有关你计算机处理器的信息。同样，输入命令


    ```

    more /proc/meminfo

    ```


    会揭示你系统当前内存的使用情况。与二进制和文本文件不同，大多数虚拟文件的大小显示为 0 字节，并带有当前日期和时间的时间戳。这反映了它们是不断更新的理念。


    ## /mnt


    包含作为临时挂载文件系统的的子目录。这是大多数发行版将挂载的文件系统到 Linux 目录树的默认位置。通常，当外围驱动器挂载后，/mnt/cdrom 允许你访问
    CD 驱动器中加载的 CD-ROM 上的文件，而 /mnt/floppy 允许你访问插入软驱的软磁盘上的文件。在与 Windows 进行双启动的系统中，/mnt/windows
    可以显示 Windows 分区上的文件，尽管 NTFS 文件系统上的访问权限可能会受到限制。


    ## /usr


    包含可供系统任何用户运行的程序的子目录。例如，游戏、文字处理器和媒体播放器。此目录大致等同于 Windows 中的 C:\Program Files 目录。/usr/local
    子目录供系统管理员在本地安装软件时使用，以防止在系统软件更新时被覆盖。


    ## /var


    包含可变数据文件，存储有关正在运行系统状态的信息，特别是系统活动日志。系统管理员（超级用户）可以在 root 提示符下输入以下命令查看系统活动消息记录：


    ```

    /var/log/messages

    ```


    ## /home


    包含每个用户账户的一个子目录，用于存储个人数据文件。如果有一个名为“fred”的用户账户，就会有一个 /home/fred 目录，该用户可以在那里存储个人文件——其他用户无法在那里保存文件。此目录是你存储所有工作文档、图像和媒体文件的地方，大致等同于
    Windows 操作系统中的“我的文档”（My Documents）目录。


    ## /tmp


    正如你预期的那样，包含由运行程序创建的临时文件。大部分文件在程序关闭时会被删除，但某些会遗留——应该定期删除它们。此目录大致等同于 Windows 中的 C:\Windows\Temp
    目录。


    ## /root


    这是 root 用户的家目录——出于安全考虑，普通用户无法访问此目录。如果你以 root 身份登录 Linux 并打开该账户的家目录，它位于 /root，而不是
    /home 的子目录。


    ## /initrd


    包含一个文本文件，警告该目录不应被删除。它在启动过程中用于挂载 Linux 文件系统本身。删除此目录将导致计算机无法启动 Linux——相反它将


    ## /opt


    最初为空，但此目录提供了一个可以安装软件包的特殊区域。/opt 中的子目录用于不属于基础操作系统的附加软件包。


    ## 使用文件管理器导航


    你可以通过点击右侧窗格中的文件夹、点击导航面板中的目录，或者在位置字段中输入其名称并按回车键，在文件管理器中遍历文件系统。例如，导航到 /bin 目录，那里的存储了许多
    Linux 可执行文件。快捷方式用箭头标记——就像在 Windows 中一样。


    将指针悬停在文件图形上，描述文件的信息将显示在窗口的状态栏上——截图显示了 Linux Shell 使用 bash 程序。


    工具栏上的导航按钮允许你轻松地前进、后退并向上移动到更高目录级。大多数情况下，你会在 /home 目录中工作，可以通过任何常规方法到达，或者在非超级用户模式（Super
    User Mode）下简单地点击工具栏上的“主页”（home）按钮。


