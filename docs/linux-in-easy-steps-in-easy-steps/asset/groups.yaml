    # Transferring files


    File Transfer Protocol (FTP) is a client-server protocol that enables files to
    be efficiently transferred around networks – such as the Internet and Local Area
    Network (LAN).


    A public FTP site is hosted on a computer running FTP software that is connected
    to the Internet. To access an FTP site you need to login with a password. Most
    public sites are accessible using a password of “anonymous” but private sites
    require a custom username and password.


    ![](img/79c73558c68d3c5f59b51559717db1f4_77_0.png)


    The public directory is typically where files are stored which are intended for
    public access: A readme or welcome file often provides information about the site.


    The Mozilla web browser lets you browse FTP sites graphically automatically logging
    in as an anonymous user – type ftp:// followed by the site address into the URL
    field.


    ![](img/79c73558c68d3c5f59b51559717db1f4_77_1.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_77_2.png)


    Where anonymous logins are not permitted Mozilla will simply state that it could
    not connect to the FTP site.


    Double-click on the directory icon to open that directory and reveal the files
    and folders that it contains. Continue navigating through the FTP site until you
    reach the file/s you want to download.


    ![](img/79c73558c68d3c5f59b51559717db1f4_77_3.png)


    See page 80 for details on installing downloaded packages.


    For instance, the screenshot above illustrates the Opera FTP site where various
    versions of the Web browser are stored. Navigate through pub, opera, linux to
    reach the folders containing Linux versions of Opera that are available for download.
    Navigate further through the version and language sub-directories to reach the
    actual package file. Click on the preferred file to transfer it to your computer.'
