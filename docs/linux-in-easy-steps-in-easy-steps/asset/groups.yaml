    # OpenOffice Impress 演示文


    启动 OpenOffice，然后点击“文件（File）”、“新建（New）”，将显示可能的文档类型子菜单——对于幻灯片演示，选择“演示文（Presentation）”选项。会出现“AutoPilot”向导对话框，您可以在其中从头创建演示文、使用提供的模板或打开现有演示文进行编辑。


    要开始新的演示文，勾选“空演示文（Empty Presentation）”，然后点击“下一步（Next）”按钮选择背景——选中每个选项时会显示预览。选择一个偏好，然后点击“下一步（Next）”按钮继续。下拉列表中提供了过渡效果——如果您希望幻灯片淡入，请选择您的偏好，然后点击“创建（Create）”按钮打开“修改幻灯片（Modify
    Slide）”对话框。


    点击最适合您要在幻灯片上显示的内容的“布局（layout）”选项，然后点击“确定（OK）”按钮关闭对话框。所选布局将应用于幻灯片，您现在可以点击每个部分来添加实际内容。


    ![](img/79c73558c68d3c5f59b51559717db1f4_117_0.png)


    要在任何 OpenOffice 窗口中的文本进行拼写检查，点击“工具（Tools）”菜单下“检查（Spellcheck）”子菜单上的“检查（Check）”选项——或按键盘上的
    F7 键。


    选取文本的外观可以使用右键上下文菜单中的选项或“格式（Format）”菜单进行修改。例如，选择一些文本进行修改，然后点击“字符（Character）”菜单。


    # ...续


    现在您可以在“字符（Character）”对话框中调整所选文本的字体（Font）、字体效果（Font Effects）和位置（Position）。


    动画效果可以应用于位于上下文菜单的“文本（Text）”对话框中的文本块——但这些应谨慎使用。


    ![](img/79c73558c68d3c5f59b51559717db1f4_118_0)


    当您对幻灯片的满意时，选择“插入幻灯片（Insert Slide）”添加另一张幻灯片。要运行幻灯片播放，点击右下角的“幻灯片（Slide）”选项——或按回车键前进。


    ![](img/79c73558c68d3c5f59b51559717db1f4_118_1)


