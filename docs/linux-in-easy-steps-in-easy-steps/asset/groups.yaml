    ## Editing with vi


    The classic Linux shell program for creating and editing text files is the compact
    vi application that is also found on Unix systems – type vi at a prompt, then
    hit Return, to open the text editor.


    ![](img/79c73558c68d3c5f59b51559717db1f4_153_0.png)


    The vi editor displays a tilde character at the beginning of each empty line.
    You cannot enter any text initially in “command mode” where it will attempt to
    interpret anything you type as an instruction. Press the i key to change to “insert
    mode” where text can be input – vi displays --INSERT-- at the bottom corner to
    let you know it will now accept text input.


    ![](img/79c73558c68d3c5f59b51559717db1f4_153_1.png)


    Type some text into the vi editor and notice that there is no automatic word wrap
    at line ends – vi will wrap to the next line mid-word unless you hit the Return
    key to manually wrap to the next line after the last complete word on a line.


    There are a number of special key combinations listed in the vi ...cont''d man
    pages that let you navigate to different locations in the text but most recent
    Linux distros use the enhanced vim version that let you use the arrow keys on
    your keyboard for this purpose.


    When you have completed text input and want to save it as a file, press the Esc
    key to enter "insert mode", and return to "command mode".


    Type a : colon to begin a command – colon character appears at the bottom left
    corner of the vi editor. Hit a lowercase w (for "write") followed by a space and
    a chosen name for the text. Hit the Return key to write the file in your home
    directory.


    Unlike processors, text editors have no formatting capabilities.


    ![](img/79c73558c68d3c5f59b51559717db1f4_154_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_154_1.png)


    Type :q then hit Return to close vi and return to a shell prompt. You can launch
    vi and open a file for editing in one single action – by typing vi at a prompt,
    followed by a space, then the file name.


    ![](img/79c73558c68d3c5f59b51559717db1f4_154_2.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_154_3.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_154_4.png)


    II. Using the Linux shell | 153


    ## Switching between virtual consoles


    Unix, from which Linux is derived, was introduced long before graphical interfaces
    became popular. It was a text-based operating system that used only a keyboard
    for input and displayed output on a simple monitor. The term “console” describes
    the combination of one input device (keyboard) and one output device (monitor).


    Linux supports the notion of “virtual consoles” that let you have several full-screen
    shells active simultaneously. You can easily switch between these using special
    key combinations. This is useful when you''re working with multiple shell programs.


    Most Linux installations provide seven virtual consoles by default although you
    normally only see the seventh– this is the one on which the X Window System is
    running the graphical desktop. The virtual consoles numbered 1 through 6 do not
    support graphics. They are, instead, configured to let you execute commands and
    to run shell programs.


    To open a specific virtual console from the graphical desktop hold the Ctrl+Alt
    keys with one hand and press one of the keys F1–F6 with your other hand– F1 will
    open virtual console number 1, F2 will open virtual console number 2, and so on.
    To return your user name and password to the console from the graphical desktop
    from a virtual console press F7 while holding the Return key.


    Use the who command to discover which of the six text-based virtual consoles are
    being used. In the screenshot below the regular user is logged into consoles number
    1, 2 and 3–each console can be running different shell applications, or different
    instances of the same.


    ![](img/79c73558c68d3c5f59b51559717db1f4_155_0.png)


    | Shell - Console | Session Edit View Bookmarks Help |

    | :--- | :--- |

    | mike who | |

    | mike vc/1 | Dec 1 16:17 |

    | mike vc/2 | Dec 1 16:18 |

    | mike vc/3 | Dec 1 16:18 |

    | mike pts/0 | Dec 1 16:11 |

    | mike :0 | Dec 1 16:11 |

    | mike pts/1 | Dec 1 16:16 |


    154 | Linux in easy steps


    ...cont''d (referring to consoles)


    Press Ctrl+Alt+F1 to open console number 1, for instance, the vi editor could
    be running.


    Press Ctrl+Alt+F2 to open console number 2, for instance, the user may have the
    vi man pages for reference.


    You can also help on vi by typing info at a shell prompt.


    ![](img/79c73558c68d3c5f59b51559717db1f4_156_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_156_1.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_156_2.png)


    Press Ctrl+Alt+F3 to open console number 3, for instance, the user may have the
    Lynx text-only web browser running to search for information on the Internet.


    The Lynx browser is included in most Linux distros but may not have been installed
    by– see page 174 for installing packages


    ![](img/79c73558c68d3c5f59b51559717db1f4_156_3.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_156_4.png)


    II. Using the Linux shell | 155


    ## Moving between shell


    Switching between virtual consoles can be confusing because it''s easy to forget
    which application is running. A better alternative is to use the **jobs** command
    to see a list of suspended applications.


    ![](img/79c73558c68d3c5f59b51559717db1f4_157_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_157_1.png)


    To resume a suspended job type the **fg** (foreground) command at a shell prompt,
    followed by a space. Add the designated job number, prefixed by a %, then hit
    the Return key. For instance, **fg %1** would resume job 1 – Notice how the job
    resumes in Insert Mode.


    ![](img/79c73558c68d3c5f59b51559717db1f4_157_2.png)


    This is a simple text file that is being written using the vi editor.


    ![](img/79c73558c68d3c5f59b51559717db1f4_158_3.png)


    Jobs that take a while to execute as background jobs using the **bg** command
    to specify their job number. In the screenshot below the **find** command is making
    a list of all files on the system that have a .txt extension. **-fprint** flags
    the name of each .txt file on a separate line in a new file (txtlist) that creates
    in the user''s home directory. Notice how background jobs are marked as "Running"
    in the jobs list until they complete.


    ![](img/79c73558c68d3c5f59b51559717db1f4_158_0.png)


    ```

    [mike]$ find -name "*.txt" -fprint txtlist

    [1]+ Stopped find -name "*.txt" -fprint txtlist

    [1]+ bg %1

    [1]+ find -name "*.txt" -fprint txtlist &

    [1]+ _jobs find -name "*.txt" -fprint txtlist

    [1]+ Running

    ```


    ![](img/79c73558c68d3c5f59b51559717db1f4_158_1.png)


    Any job can be terminated using the **kill** command to specify its job number.
    For instance, the command **kill %3** would terminate job number 3 – mark it as
    "Terminated" in the jobs list. When a background job completes it is marked as
    "Done" in the jobs list. The next time the job are listed those previously marked
    as "Terminated" or "Done" are no longer included.


    ![](img/79c73558c68d3c5f59b51559717db1f4_158_2.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_158_3.png)


    56 | Linux in easy days

