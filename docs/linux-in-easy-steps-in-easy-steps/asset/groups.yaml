  - '[PAGE 49]


    # Changing hardware settings


    The configuration changes described in this chapter are often not as straightforward
    in other Linux distributions. The user-friendly Mandrake Control Center provides
    a number of configuration wizards in addition to those already mentioned.


    ![](img/79c73558c68d3c5f59b51559717db1f4_49_0.png)


    The system control center is used to make system-wide changes irrespective of
    the desktop environment – settings apply equally in KDE, Gnome and other desktop
    environments.


    ![](img/79c73558c68d3c5f59b51559717db1f4_49_1.png)


    The "Display manager chooser" allows you to select a program for login and session
    management – these are variations on the original XDM (X Display Manager). The
    Mandrake Display Manager (MdkKDM) that is installed by default works well enough
    but you experiment with others, such as the Gnome Display Manager (GDM) and the
    KDE Display Manager (KDM).


    The "Configure your monitor" and Xfdrake guards are useful to re-configure your
    hardware when you replace your monitor or video card.


    Similarly, you can use KeyboardDrake to change your keyboard layout configuration
    and MouseDrake if you replace your mouse with a different type.'
