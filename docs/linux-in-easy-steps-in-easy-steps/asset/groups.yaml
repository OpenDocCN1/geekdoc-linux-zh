    另一种方法可以使用 `SUM()` 函数来确定总值。在“Total（合计）”单元格中输入 `=S`，会出现一个提示框提示您使用 `SUM()` 函数。按回车键，确认要使用此函数，选择您想要求和的单元格——在上面的示例中，这些单元格
    B5、C5、D5、E5 和 F5。单元格和输入栏中的公式为 `=SUM(B5:F5)`。按回车键应用公式并在“Total”单元格中生成总值。


    ![](img/79c73558c68d3c5f59b51559717db1f4_116_0.png)


    公式栏按钮可以将公式应用到行。选择行末尾的空单元格并点击“公式（Formula）”按钮——输入框中会出现建议公式，并被“接受（Accept）”和“取消（Cancel）”按钮取代。点击“接受（Accept）”按钮应用公式。


    同样，可以使用相同的方法使用 `AVERAGE()` 函数来计算数值范围的平均值。在“Average（平均值）”单元格中输入 `=A`，会出现提示框提示您使用
    `AVERAGE()` 函数。按回车键，突出显示您想要计算平均值的单元格。再次按回车应用公式并在“Average”单元格中生成平均值。


    在示例中应用公式可以创建每周和每天的合计和平均值。右键点击单元格范围，在上下文菜单中选择“设置单元格格式（Format Cells）”，并选择背景颜色来突出单元格中的数据。


