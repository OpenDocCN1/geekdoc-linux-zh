    ![](img/79c73558c68d3c5f59b51559717db1f4_180_3.png)


    You can also drag''n drop files from Conqueror onto your desktop.


    When the Save As Dialog box appears navigate to a destination location for the
    download package – the Desktop is usually most convenient. Click the Save button
    to begin the download and an arrow displaying a progress indicator.


    ![](img/79c73558c68d3c5f59b51559717db1f4_180_4.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_180_5.png)


    opera-7.23-20031119.5-shared-qt.i386-en.rpm


    When the download completes an RPM icon appears at the chosen destination and
    the package is ready to be installed on your system.


    13. Extending your Linux system | 179


    ## Installing downloads


    To begin installation of an application from a downloaded RPM package simply click
    on the package icon. For instance, click on the icon of the Opera RPM package
    downloaded to the desktop in the example on the previous page.


    A message dialog asks you to confirm that you wish to install the application
    – click on the OK button to proceed.


    ![](img/79c73558c68d3c5f59b51559717db1f4_181_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_181_1.png)


    You can discover more about GPG online at http://gnupg.org


    A further dialog may now appear displaying an error message "No GPG signature
    in package". GPG is an acronym for Gnu Privacy Guard – the Linux equivalent of
    the PGP public key encryption system that can be used for file verification. The
    Opera RPM package file, and other files, do not use GPG so this message can be
    safely ignored. Click the Yes button to proceed with the installation.


    ![](img/79c73558c68d3c5f59b51559717db1f4_181_2.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_181_3.png)


    A small dialog appears displaying a progress indicator as the Opera web browser
    is being installed on your system.


    The RPM package file can be deleted after installation has completed.


    ![](img/79c73558c68d3c5f59b51559717db1f4_181_4.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_181_5.png)


    ...cont''d


    When the installation completes Opera has been installed in the / directory and
    a menu item has been created on the Start menu.


    You can drag the Opera icon onto the toolbar to create a Quick Launch button.


    ![](img/79c73558c68d3c5f59b51559717db1f4_182_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_182_1.png)


    Click on the Opera icon, or type Opera at a prompt in a shell, to launch the Opera
    web browser.


    ![](img/79c73558c68d3c5f59b51559717db1f4_182_2.png)


    13. Extending your Linux system | 181


    ## Installing other desktops


    The Gnome desktop environment is the popular alternative to the KDE desktop for
    many Linux users. It can be installed from most distro sets in the same way as
    any application.


    In Mandrake Linux, launch RPM then select the Gnome Workstation option under the
    “Graphical Environment” menu. Click the OK button in the dialog that appears to
    accept the additional packages which Gnome requires.


    ![](img/79c73558c68d3c5f59b51559717db1f4_183_0.png)


    Additional packages needed

    To satisfy dependencies, the following package(s) also need to be installed:

    - cdabelpen-2.5.0-1mdk

    - cdparanois-il9-8-5mdk

    - cdecord-2.0-2mdk

    - cdecord-d4wav-2.0-2mdk

    - gnome-2.2-0-1mdk

    - libg2-2.0-9-3mdk

    - libre-0.2-3-1mdk

    - libbeta-0.2-3-1mdk

    - linuxconf-1.293-3mdk

    - locales-ja-2.3.1.4-6mdk

    - locales-ko-2.3.1.4-6mdk

    - locales-zh-2.3.1.4-6mdk

    - mkisofs-0.2-2mdk

    - openssh-askpass-gnome-3.51-7mdk


    Insert the distro CD when requested, then click on the OK button to begin the
    installation – another dialog box displays a progress indicator that illustrates
    the package installation process.


    ...cont''d


    ![](img/79c73558c68d3c5f59b51559717db1f4_184_0.png)


    Upon completion a dialog confirms the successful installation of the packages.
    Open the Mandrake Control Center, click on the Boot menu, then select the DrakBoot
    option. Change the System Mode options to start Gnome with autologin when the
    system boots, then click the OK button to apply the update.


    Reboot the system and Linux will now automatically login the default user into
    the Gnome desktop environment.


    ![](img/79c73558c68d3c5f59b51559717db1f4_184_1.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_184_2.png)


    13. Extending your Linux system | 183


    ## Switching between desktops


    When you click the Start, Logout menu in a graphical Linux desktop a Logout dialog
    presents the options to halt or reboot the computer and also offers to login as
    a different user.


    The appearance of the Logout and Login dialog boxes vary according to the display
    manager in current use – the Logout dialog shown here is from the K Desktop Manager
    (KDM) and the Login dialog is from the Gnome Desktop Manager (GDM).


    ![](img/79c73558c68d3c5f59b51559717db1f4_185_0.png)


    Choosing the option to login as a different user closes the current graphical
    desktop and displays a Login dialog. A Login dialog lets you choose which desktop
    environment you wish to for. For instance, in the Gnome Desktop Manager Login
    dialog select your preferred desktop.


    The System, Configure menu allows you to change aspects of the desktop.


    ![](img/79c73558c68d3c5f59b51559717db1f4_185_1.png)


    Next enter your name and password, then click the OK button to start the desktop.


    ...cont''d


    Many dialogs have a face of users - click on the logout.


    ![](img/79c73558c68d3c5f59b51559717db1f4_186_0.png)


    If you choose not to login to another desktop the Logout dialog can also be used
    to reboot your system.


    ![](img/79c73558c68d3c5f59b51559717db1f4_186_1.png)


    13. Extending your Linux system | 186

