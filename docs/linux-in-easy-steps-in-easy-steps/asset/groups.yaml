  - '[PAGE 165]


    # Editing text streams


    It is sometimes useful to dynamically edit streams of text to format the output
    with the shell stream editor sed. This is a powerful and popular application in
    the Unix/Linux world. It has many options to edit text streams in a variety of
    ways. The most common one is the s (substitute) option that allows a specified
    string to be replaced by another this syntax:


    ```

    sed "s/seek/replace/g"

    ```


    The string to be replaced by seek and the new string is represented by replace.
    The final g (global) is optional and denotes that all instances of the sought
    should be replaced - omitting this will only replace the first occurrence of the
    string.


    ![](img/79c73558c68d3c5f59b51559717db1f4_165_0.png)


    In the example the more command first displays the actual file content then sed
    is used to replace the American spelling of the word "color" with its British
    equivalent. The command makes two substitutions in the output to account for case
    differences.


    ![](img/79c73558c68d3c5f59b51559717db1f4_165_1.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_165_2.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_165_3.png)


    The final command in the screenshot shows input sed through a pipe using the tail
    command. This selects the specified number of lines from the end of the file.
    In this case it''s the last two lines that are sent to sed, which makes the substitution,
    and finally displays the output – the last line in this file contains an invisible
    newline character.


