    window.


    ![](img/79c73558c68d3c5f59b51559717db1f4_97_0.png)


    In the navigation panel, right-click on the target directory then choose Paste
    from the context menu to move the file, or to create a duplicate when copying.


    Konqueror also lets you drag''ndrop files from one directory to another. Open
