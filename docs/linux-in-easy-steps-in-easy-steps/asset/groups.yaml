    9. 创建图形 | 127


    # 图层操作


    GIMP 支持层的概念，图层就像堆叠在另一个之上的透明片 – 图像中的各种对象可以可以放置在各自的图层上，以便独立地进行操作。


    与其他图形软件不同，GIMP 可以占据小于整个图像尺寸的区域，除非该层上的对象填充了整个图像。相反，图层可以优化到该层上对象的大小。例如，一个包含文本字符串的图层可以仅是该文本的大小。此功能节省了磁盘空间并提高了处理速度。


    要创建一个新层，在“对话”菜单下打开“图层、通道与路径”（Layers, Channels & Paths）对话框，然后点击“新建层”按钮。


    ![](img/79c73558c68d3c5f59b51559717db1f4_129_0.png)


    原始层默认命名为“背景”（Background） – 始终为新层赋予一个有意义的名字，以便快速识别。


    ![](img/79c73558c68d3c5f59b51559717db1f4_129_1.png)


    当“新层”对话框出现时，点击 OK 按钮接受图层的默认大小和设置 – 或先输入您偏好的选项。然后，新层将显示在“图层、通道与路径”对话框和图像窗口中。小于整个图像的图层会被带有黄色背景的虚线包围以便识别。


    要移动单个图层，按住 Shift 键并在工具箱中选择“移动”（Move）工具。现在点击图层并拖动它。


    128 | 快速入门 Linux


    # ...续


    在“图层、通道与路径”对话框中，图层从底部“背景”层向上顺序堆叠。点击图层进行选择，然后使用对话框底部的箭头按钮更改其堆叠位置。


    在移动任何图层之前，取消所有链接的图层，否则所有图层都可能移动 – 即使链接的图层未被选中。


    ![](img/79c73558c68d3c5f59b51559717db1f4_130_0.png)


    您可以点击任何图层的眼睛图标在图像窗口中隐藏它。通过点击眼睛图标和缩略图框之间可以链接图层 – 一个交叉符号表示链接的图层。移动链接的图层也会移动与其链接的图层。


    使用右键菜单上的“图层，对齐可见”（Layers, Align Visible）选项来对齐图层。


    通过点击对话框底部的“复制图层”按钮可以快速创建所选图层的副本。将图层拖到垃圾桶图标上然后释放按钮即可删除该图层。


    要将带有图层的图像简化为具有更小文件数的单图层，请选择右键菜单上的“图层，合并图像”（Layers, Flatten Image）选项。或者，如果您想保留图层，请以
    GIMP 优的 .xcf 文件格式保存图像。


    9. 创建图形 | 129


    # 选择区域


    GIMP 工具箱中的前六个工具是选择工具，它们提供了多种选择图像区域以进行操作的方法。


    最简单的选择矩形和椭圆形区域工具 – 在使用这些工具时按住 Shift 键可以选择完美的正方形和圆形。Shift 键还允许您添加进一步的选择，并且如果它们重叠，则会将它们合并为一个单一选择。相反，Ctrl
    键会从第一个选择中减去叠加区域。同时按住 Ctrl 和 Shift 仅选择叠加区域。


    ![](img/79c73558c68d3c5f59b51559717db1f4_131_0.png)


    一旦选中了区域，指针将变为代表“移动”工具的交叉箭头 – 现在您可以将选中的区域拖到另一个地方。


    ![](img/79c73558c68d3c5f59b51559717db1f4_131_1.png (注：此处原文未提供文件名，但根据上下文推断为131_1或类似，此处保持原文逻辑，修正：原文应为img/79c73558c68d3c5f59b51559717db1f4_131_1))


    套索工具（Lasso）允许手绘选择图像的区域。选择区域通过连接到原始起始点自动完成。可以通过按住 Shift 键并选择另一个区域来添加选择（指针旁边会出现
    + 号）。同样，可以通过按住 Ctrl 键并选择另一个区域从选择中减去（指针旁边会出现 - 号）。点击图像上的任何位置即可取消选择。


    ![](img/79c73558c68d3c5f59b51559717db1f4_131_2.png)


    模糊选择工具（Fuzzy Select）在 GIMP 中类似于 Photoshop 中的魔棒 – 点击起始点，它将选择相似颜色的相邻像素。点击并拖动起始点以增加其范围。此工具对于选择边缘清晰的对象。


    ![](img/79c73558c68d3c5f59b51559717db1f4_131_3.png)


    贝塞尔选择工具（Bezier selection）在 GIMP 中类似于 Photoshop 中的路径。点击图像以选择您想要选择区域的锚点。最后点击起始点完成选择路径。要重新定位锚点，只需按住
    Ctrl 键并拖动它。要在锚点处创建曲线，点击该点 会出现两个手柄。拖动点使手柄延伸并改变周围的轮廓。默认情况下手柄长度相等并创建圆角。为了更大的控制，按住
    Shift 键可以单独拖动每个手柄创建角角。对外观满意后，点击曲线内部完成选择 – 选中区域由虚线表示。


    30 | 快速入门 Linux


    # ...续


    智能剪刀选择工具（Intelligent Scissors）在 GIMP 中类似于 Photoshop 中的磁性套索。点击图像中定义清晰的对象周围选择锚点，它将尝试寻找对象的边缘。


    此插图周围的锚点应该更准确地遵循对象的边缘。


    ![](img/79c73558c68d3c5f59b51559717db1f4_132_0.png)


    如果两个锚点之间的线条没有准确地遵循对象的边缘，按住 Ctrl 键然后点击线条的中间。这将添加一个中间锚点，应该可以解决问题。锚点可以像贝塞尔选择工具一样手动重新定位。


    当您包围对象后，点击形状内部完成选择 – 点和线将转换为虚线。


    复杂的选择可以存储在 Alpha 通道（Alpha Channel）中以便以后轻松调用。选择信息将选中的区域视为不透明，选择边缘视为半透明，未选择区域视为透明。要存储选择，点击它，然后在内容菜单中选择“选择，保存到通道”
    – 它会被添加到“通道”选项卡下。要恢复选择，在键上右键点击“通道”上的“选择掩码”，然后选择“通道到选择”。


