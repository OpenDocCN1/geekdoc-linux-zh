    # Chapter One'
- md: '

    ## What is Linux?


    Linux is a computer operating system that can run on a variety of hardware including
    the popular Intel system found on most desktop computers. It is a modern derivation
    of the powerful Unix operating system that was introduced way back in 1969.


    Pronounce the name Linux with a short “Li-” – so it’s “Li-nucks” not “Lie-nucks”.


    In recent years the popularity of Linux has increased dramatically as computer
    users have discovered its many benefits:


    - Linux is released under the GNU General Public License that ensures it remains
    free to all users – no one can charge for this operating system so you will never
    have to pay for it. It''s available for free download on the Internet but you
    may have to pay a distribution charge if you prefer to order a copy on CD-ROM.

    - Access to the source code of Linux is unrestricted and it may be changed. This
    allowed thousands of programmers around the world to refine the code in order
    to improve performance, eliminate bugs and increase security.


    Many web servers are said to have a “LAMP” configuration – an acronym for Linux,
    Apache, MySQL, PHP.


    - Linux is truly a multi-user, multi-tasking operating system that allows multiple
    users to simultaneously work with multiple applications without experiencing any
    traffic problems. Many of the world''s web servers run on Linux for this very
    reason.

    - Linux is an extremely stable operating system – continuous updates of more than
    once a year are not uncommon. It can be upgraded “on the fly” so it only needs
    a reboot when adding new hardware.

    - There are a large number of quality applications available to run on the Linux
    platform. These are comparable to commercial applications that run on other operating
    systems but, like Linux, these too are free of charge. In instance, the free OpenOffice
    suite offers similar functionality to the Microsoft Office suite and can even
    handle files in the popular .doc. format.

    - With open-source software, an administrator can know exactly what a program
    can do and the security dangers it presents. An open-source application cannot
    secretly gather information about the user or use confidential information to
    third parties. This assured level of security and integrity contrasts starkly
    against commercial software whose source code is closely guarded.


    ## The evolution of Linux


    In 1983 a visionary programmer named Richard Stallman began a movement called
    the GNU Project. Its philosophy was that software should be free from restrictions
    against copying or modification in order to make better and efficient programs.
    This inspired programmers around the world to create programs driven by efficiency
    rather than financial incentive.


    The term "GNU" is a recursive acronym for GNU''s Not Unix.


    By 1991 the GNU Project had created a lot of software tools including the GNU
    C Compiler written by Stallman himself. At that time many of these tools were
    incorporated into a Unix-compatible operating system, by a 21-year-old student
    at the University of Helsinki. His name was Linux Torvalds and he named the operating
    system Linux (LINUs—Unix).


    Linux was made available for download on the Internet so programmers could test
    and tweak the source code, return it to Linux Torvalds. After a period of enthusiastic
    development Linux 1.0 was made available globally by the GNU General Public License
    which ensured Linux and it would remain free.


    Programmers were keen to explore Linux and soon found some uses for it. In April
    1996, researchers at Los Alamos National Laboratory used Linux to run 68 PCs as
    a single parallel machine to simulate atomic shock waves. At $150,000 this supercomputer
    cost just 1-tenth the price of a comparable commercial machine. It reached a peak
    speed of 19 billion calculations per second, making it the 315th most powerful
    supercomputer in the world. It proved to be robust though—three months later it
    didn''t have to be rebooted.


    "Tux" the penguin is the logo of the Linux operating system. It commemorates an
    incident in which Linux Torvalds, while on vacation in the southern hemisphere,
    was bitten by a penguin.


    Linux continued to grow in popularity as a text-based operating system while Windows
    remained the dominant graphical desktop system. Recognizing that most users wanted
    the point-and-click convenience of a graphical environment, the Linux camp began
    to develop a system comparable to the Windows desktop.


    From a handful of enthusiasts in 1991 to millions of users now—Linux has come
    of age. Today''s sleek K Desktop Environment (KDE) and the Gnome environment now
    offer a user-friendly alternative for Windows users—Linux for the desktop!


    ## Choosing a Linux distro


    At the very heart of Linux is a bunch of tried and tested compiled code called
    the "kernel". The kernel provides the operating system with its core functionality,
    much like the engine in a car. It takes care of the basics, such as helping other
    programs access hardware and sharing your computer''s processor among various
    programs.


    In addition to the kernel Linux contains a number of system-level programs, such
    as the services to handle your email, web connection and bootloader. Consider
    these as a car''s transmission, gears and chassis – without these the engine is
    not much use.


