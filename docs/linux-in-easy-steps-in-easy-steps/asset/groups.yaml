    在安装最后一个软件包后，安装程序会自动执行软件包的“安装后配置”（Post-Install Configuration），然后进入下一步。


    ## 设置 root 密码


    每个 Linux 系统都有一个名为“root”的系统管理员账户，该账户具有比普通用户账户更高的访问权限。出于安全考虑，系统配置只能由 root 执行——普通用户无法进行这些更改。您应该只在类此类情况下使用
    root 账户，通常情况下在 Linux 中作为普通用户工作。


    安装软件包后，Linux 安装程序会要求您为 root 账户创建一个密码。


    在网络环境中，创建一个长字母数字密码是重要的，以确保 root 账户不会被轻易访问。


    家庭用户可能更喜欢“无密码”（No Password）选项，以避免每次想以 root 身份工作时输入密码。这种情况发生比您想象的要频繁。


    ![](img/79c73558c68d3c5f59b51559717db1f4_29_0.png)


    如果设置密码，请避免使用像“admin”这样容易猜到的密码。


    ![](img/79c73558c68d3c5f59b51559717db1f4_29_1.png)


    点击“无密码”继续，或者如果您想设置 root 密码，请在两个输入框中输入密码，然后点击“下一步”按钮继续。


    28 | Linux 简易步骤


    ## 创建用户账户


    Linux 安装的下一步要求至少创建一个用户账户。对于家庭用户来说，这通常是他们每天登录 Linux 使用时使用的账户。


    在第一个字段中输入您的真实姓名，在第二个字段中输入简短的用户名。现在在两个输入框中输入密码。


    可选情况下，您也可以点击显示的图标来选择自定义用户账户。


    密码是强制性的。请记住准确的用户名和密码——您之后将需要它们。


    ![](img/79c73558c68d3c5f59b51559717db1f4_30_0.png)


    Linux 对大小写敏感，因此请注意大小写字母——“Mike”被视为与此处“mike”不同的用户。


    点击“确定”按钮为每位使用您计算机的人创建一个用户账户。当所有用户账户创建完成后，点击“下一步”按钮继续。


    29 | 安装 Linux


    ## 设置自动登录


    Linux 安装程序让您有机会选择一个用户账户，以便每次启动 Linux 时都自动登录。对于家庭用户来说，这避免了每次启动 Linux 都要输入用户名和密码的繁琐步骤。


    此功能不应在办公室环境或具有多个用户账户的计算机。


    ![](img/79c73558c68d3c5f59b51559717db1f4_31_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_31_1.png)


    上面的示例选择了自动登录创建的用户账户。如果创建了多个用户账户，此页面还会出现一个选择框，允许您选择登录的账户。


    如果您不想使用自动登录，启动过程将要求您输入用户名和密码以登录 Linux。要启动图形桌面，您需要输入命令 `startx` 然后按回车键。


    点击“下一步”按钮继续进行引导程序的安装。


    ## 安装引导程序


    Linux 安装程序通常会将引导程序安装在主硬盘（HD）上，它会在该硬盘的主引导记录（MBR）中找到 Windows 启动指令。


    如果安装程序要求您选择安装引导程序的位置，如果您想运行双系统系统，应选择安装在 MBR 中的选项。这将在计算机每次启动时都为您提供一个选项菜单，允许您选择
    Windows 或 Linux 等。


    ![](img/79c73558c68d3c5f59b51559717db1f4_32_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_32_1.png)


    将引导程序安装到软盘上将允许 Linux 在 BIOS 设置从硬盘之前从该驱动器寻找启动指令时从软盘驱动器启动。


    应避免其他选项，因为它们可能会阻止您在计算机上启动 Linux。


    点击“下一步”按钮在选定位置安装引导程序，Linux 安装程序将显示安装摘要。


    ## 总结安装情况


    摘要页面上的每个项目都有一个关联的按钮，可以调出子菜单，其中可以对每个设备进行配置。这可以在以后完成，将在下一章中逐步演示。现在，只需点击“下一步”按钮继续到安装结束。


    此处列出的某些设备（如打印机）仅被 Linux 安装程序检测到，必须在它们正常工作之前进行配置——见第 3 章。


    ![](img/79c73558c68d3c5f59b51559717db1f4_33_0.png)


