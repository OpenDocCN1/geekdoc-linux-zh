  - '[PAGE 85]


    # # Standard sub-directories


    ![](img/79c73558c68d3c5f59b51559717db1f4_85_0.png)


    /bin

    Contains small executable programs (binaries) which are often considered to be
    part of the operating system itself – they aren’t really. For instance, when you
    type the `ls` command at a prompt, to list the contents of a directory, Linux
    executes the `ls` program that is located in the `/bin` directory. This directory
    is roughly equivalent to the `C:\Windows` directory in Windows.


    ![](img/79c73558c68d3c5f59b51559717db1f4_85_1.png)


    /sbin

    Contains executable system programs (binaries) that are only used by the root
    super-user and by Linux when or performing system recovery operations. For instance,
    the clock program that maintains the system time when Linux is located in the
    `/sbin` directory. This directory is roughly equivalent to the `C:\Windows\system`
    directory in Windows.


    ![](img/79c73558c68d3c5f59b51559717db1f4_85_2.png)


    /lib

    Contains binary library files which are used by the executable programs in the
    `/bin` and `/sbin` directories. These shared libraries are particularly important
    for booting the system and executing commands within the root file system. They
    are roughly equivalent to the DLL libraries in Windows but are not scattered around
    the system. Having a specific directory for support libraries avoids the common
    problem in Windows when multiple libraries have been installed and the system
    becomes confused about which one to use.


    ![](img/79c73558c68d3c5f59b51559717db1f4_85_3.png)


    /dev

    Contains special file system entries which represent devices that are attached
    to the system. These allow programs access to the device drivers which are essential
    for the system to function properly – although the actual driver files are located
    elsewhere. For instance, the entry `/dev/fd0` represents the floppy drive and
    the entry `/dev/cdrom0` represents the CD drive.'
