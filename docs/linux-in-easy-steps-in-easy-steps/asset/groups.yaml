- md: '

    To rename a file select the Rename option on the context menu then in the dialog
    that appears. Or use the mv command to rename a file at a prompt with the syntax
    `mv oldname newname`.


    Moving files to another location by the command line is achieved using the mv
    command. This must be followed by a space and the file name, then the target directory
    path.


    Similarly, files can be copied to another directory using the cp command with
    the same syntax. For instance, the user in the screenshot below copies the file
    named linux.txt from the /text directory to the adjacent /misc directory.


    ```bash

    [mike]$ cd /home/mike/Documents/text

    [mike]$ pwd

    /home/mike/Documents/text

    [mike]$ ls

    linux.txt sample.txt

    [mike]$ cp linux.txt ../misc

    [mike]$ cd ../misc

    [mike]$ pwd

    /home/mike/Documents/misc

    [mike]$ ls

    linux.txt

    ```


    # 7. Handling files | 97


    # Deleting files


    Launch Konqueror and navigate to a location in your home directory. Right-click
    in the window to open the context menu and select the Create New Directory option.
    Enter a name, such as "temp", then click the OK button to create the directory.


    Place a text file in the new directory - write a new file or copy-paste an existing
    one. Now right-click on the new directory to open a context menu that provides
    two options to remove it.


    The first option, to Move To Trash, will move the directory, and any folders it
    contains, to the Trash Bin. This is a holding area from which directories and
    files can be recovered if desired. The second option, to Delete, will remove the
    directory and its files permanently - they cannot be recovered.


    The context menu lets you remove directories that are not empty - always use the
    Move To Trash option unless you are absolutely certain you will never want to
    recover any of its contents.


    To recover items from Trash open Konqueror to the location to which you want them
    to be restored then click on the Trash icon on the desktop. Cut''n''paste, or
    drag''n''drop, the directory or files from the Trash into the required location.


    To permanently delete files and directories from Trash right-click on the icon
    and select the Empty Trash Bin option.


    # ...cont''d


    Deleting files and directories from the command line provides more safeguards
    against accidental deletion by requiring confirmation of those actions before
    they are implemented.


    To reproduce the example on the opposite page at navigate to a location in your
    home directory then type `mkdir`, followed by a space and a name, to create a
    new directory. Copy a file into the new directory then type `rmdir` and the directory
    name to attempt to delete it and its contents.


    Use the wildcard `*` to delete all files with the command `rm *`


    Linux will not allow non-empty directories to be deleted - you must first open
    the directory and delete its contents using the `rm` command. Linux will request
    you to type `y` to confirm this action then it will permanently delete the file/s.
    Now move up to the higher level directory using `cd` and issue the `rmdir` once
    to delete the empty directory.


    ```

    Shell - mouse

    Session Edit View Bookmarks Settings Help

    [mike] cd /home/mike/Documents/text

    [mike] ls

    /home/mike/Documents/text

    linux.txt sample.txt

    mkdir temp

    [mike] ls

    linux.txt sample.txt temp/

    [mike] cd temp

    ls l

    sample.txt

    [mike] rmdir temp

    rmdir: Directory not empty

    [mike] cd ..

    [mike] rm sample.txt? y

    confirm regular file, ''sample.txt''? y

    [mike] rmdir temp

    [mike] ls

    linux.txt sample.txt

    [mike] $

    ```


    The command `rmdir -rf` is highly dangerous - vast areas of your system can be
    permanently deleted at a stroke. It is best avoided.


    Some Linux distributions allow non-empty directories to be deleted, along with
    their entire contents, including a `-rf` argument (recursive, force) in the `rmdir`
    command. For instance, the command `rmdir -rf temp` could instantly and permanently
    delete the directory named `temp` and all subdirectories and files within it.


    7. Handling files | 99


    # Making shortcuts


    It is often convenient to create desktop shortcuts to the applications and files
    you access most frequently. To create a new desktop shortcut to an application
    first find it on the Start menu, then drag/drop it onto the desktop.


    The mouse button then select the Link Here option from the context menu that appears
    – an icon gets added to the desktop which you can click to launch that application.


    > HOT TIP

    The KSnapshot application, to which this shortcut links, was used to grab the
    screenshots throughout this book.


    - Copy Here

    - Move Here

    - Link Here

    - Cancel


    To create a desktop shortcut to a file drag/drop it onto the desktop from Konquer
    then choose Link Here – an icon gets added to the desktop which you can click
    to open that file.


    - Copy Here

    - Move Here

    - Link Here

    - Cancel


    Notice that the file is italicized under that these are merely pointers.


    # ...cont''d


    A symbolic link is just a pointer, whereas a hard link is an actual file. In Linux
    these shortcuts are known as “symbolic links” or “soft links”. A symbolic link
    can point to a file or a directory, while a hard link can only point to a file.


    If the original file is deleted, the symbolic link becomes broken, but the hard
    link remains valid as long as at least one link to the file exists. To create
    a symbolic link, use the `ln -s` command: `ln -s target linkname`. To create a
    hard link, use the `ln` command: `ln target linkname`.


    7. Handling files | 101


    # Changing access permissions


    In Linux each file and directory has an "owner" – typically this is the user who
    created it. The owner has full permission to read the file, write to the file
    and execute the file (if it''s executable).


    An executable file is a binary program that can be "run" – a text file is not.
    The owner may also set permissions to specify if other users can read, write and
    execute the file. The file''s accessibility can be restricted to the owner, or
    to a "group" of which the owner is a member, or to any user of the system.


    To view the permission settings of a file in KDE right-click on it, select Properties
    from the context menu, then click the Permissions tab in the Properties dialog
    that appears.


    Usually the User, Group and Others will have permission to at least Read the file.
    If you are the owner of the file the User will have permission to Write and Execute
    the file (if it''s executable).


    As the owner of the file you can check any unchecked boxes to extend the permissions
    of this file – click the OK button to apply the new permission settings.


    To view the permission settings of a file at the command line use the `ls` command
    with its `-l` option to get a long listing – type `ls -l` then hit Return.

