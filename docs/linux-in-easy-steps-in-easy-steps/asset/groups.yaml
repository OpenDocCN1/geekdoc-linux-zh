- md: "\n## Editing text streams\n\nIt is sometimes useful to dynamically edit streams\
    \ of text to format the output with the shell stream editor sed. This is a powerful\
    \ and popular application in the Unix/Linux world. It has many options to edit\
    \ text streams in a variety of ways. The most common one is the `s` (substitute)\
    \ option that allows a specified string to be replaced by another with this syntax:\n\
    \n```\nsed \"s/seek/replace/g\"\n```\n\nThe string to be replaced by seek and\
    \ the new string is represented by replace. The final `g` (global) is optional\
    \ and denotes that all instances of the sought should be replaced - omitting this\
    \ will only replace the first occurrence of the string.\n\n![](img/79c73558c68d3c5f59b51559717db1f4_165_0.png)\n\
    \nIn the example the `more` command first displays the actual file content then\
    \ sed is used to replace the American spelling of the word \"color\" with its\
    \ British equivalent. The command makes two substitutions in the output to account\
    \ for case differences.\n\n![](img/79c73558c68d3c5f59b51559717db1f4_165_1.png)\n\
    \n![](img/79c73558c68d3c5f59b51559717db1f4_165_2.png)\n\n![](img/79c73558c68d3c5f59b51559717db1f4_165_3.png)\n\
    \nThe final command in the screenshot shows input sed through a pipe using the\
    \ `tail` command. This selects the specified number of lines from the end of the\
    \ file. In this case it's the last two lines that are sent to sed, which makes\
    \ the substitution, and finally displays the output – the last line in this file\
    \ contains an invisible newline character.\n\n164 | Linux in easy steps\n\n##\
    \ Substituting variables\n\nA variable is named “container” in which text and\
    \ numeric values can be stored. Those values can be referenced using that variable's\
    \ name, prefixed by a $ character – traditionally Linux shell variable names are\
    \ uppercase.\n\nValues are assigned to a variable using the = operator and strings\
    \ of text should be enclosed in quotes.\n\n![](img/79c73558c68d3c5f59b51559717db1f4_166_0.png)\n\
    \n![](img/79c73558c68d3c5f59b51559717db1f4_166_1.png)\n\nType `set` at a shell\
    \ prompt then to see a list of all environment variables and their values – you\
    \ can use the command to assign new values to them.\n\nVariables remain in existence\
    \ until the shell session in which they were created. There are also special environment\
    \ variables which are constantly available to the shell.\n\nThe USER environment\
    \ variable is useful because it contains the name of current user and can be useful\
    \ in scripts to create personalized output without knowing the user's name. The\
    \ $PATH environment variable is useful as it contains a list of directories that\
    \ the shell automatically recognizes – when you type a command the shell looks\
    \ for a program by that name.\n\n![](img/79c73558c68d3c5f59b51559717db1f4_166_2.png)\n\
    \nNotice the last directory listed in the $PATH environment variable is the /bin\
    \ sub-directory of the user's home directory – this is where shell script files\
    \ should be placed.\n\n## Creating a shell script\n\nA shell script is a plain\
    \ text file containing a series of commands that allow repetitive sequences to\
    \ be performed whenever the script is executed – by entering its name at a shell\
    \ prompt. This is like creating a custom command of the script name.\n\nThe script\
    \ can simply comprise a single command, or a list of commands – exactly how they\
    \ would be typed at a shell prompt. For instance, the color of the font in a shell\
    \ window can be set with its `-e` option to allow escape sequences to be interpreted,\
    \ and the desired color stated using American National Standards Institute (ANSI)\
    \ code reference.\n\nThe example below demonstrates how the font \"brush\" can\
    \ be changed through different colors from a prompt.\n\n![](img/79c73558c68d3c5f59b51559717db1f4_167_0.png)\n\
    \n```\nShell - Konsole\nSession Edit View Bookmarks Settings Help\n[mike] echo\
    \ -e \"\\033[31m\"\n[mike] echo -e \"\\033[32m\"\n[mike] echo -e \"\\033[33m\"\
    \n[mike] echo -e \"\\033[34m\"\n[mike] echo -e \"\\033[30m\"\n[mike] $\n```\n\n\
    These commands are not very user-friendly so you may prefer to create a script\
    \ to change brush colors if you want to do this often.\n\nTo create a new script\
    \ open any plain text editor, such as vi, then type the following code at the\
    \ beginning of the first line:\n\n```\n#!/bin/bash\n```\n\nThis is sometimes called\
    \ the \"sh-bang\" line, after the # characters – whenever Linux reads these at\
    \ the beginning of a file it locks in the specified path location for an interpreter\
    \ to execute the script. In this case it is the bash shell program, that is located\
    \ in Linux’s /bin directory.\n\nComments can be added to a shell script using\
    \ the # character – any characters following this on a line are ignored. It is\
    \ useful to add comments to describe the purpose of the script, author, date,\
    \ and so on.\n\nNow type the command, exactly as you would, save the file in /bin\
    \ to make it executable. The “brush” script shown below is saved at ~/bin.\n\n\
    ![](img/79c73558c68d3c5f59b51559717db1f4_168_0.png)\n\nIt is important to preserve\
    \ the spaces in this.\n\n![](img/79c73558c68d3c5f59b51559717db1f4_170_0.png)\n\
    \n```bash\n#!/bin/bash\n# a script to change any brush color\n# first clear the\
    \ screen\nclear\n# write a menu of color options\necho -e \"\\033[0mmBrush Menu\
    \ - Please select a color:\"\necho -e \"\\033[31m[0]\"\necho -e \"\\033[31m[1]\"\
    \necho -e \"\\033[32m[2]\"\necho -e \"\\033[33m[3]\"\necho -e \"\\033[34m[4]\"\
    \necho -e \"\\033[35m[5]\"\necho -e \"\\033[36m[6]\"\necho -e \"\\033[0mExit\"\
    \n\n# store user input in a variable\nread\nCHOICE\n# confirm the choice of our\
    \ color\nif [ $CHOICE == 0 ]; then echo -e \"\\033[30mBrush is Black\"\nelif [\
    \ $CHOICE == 1 ]; then echo -e \"\\033[31mBrush is Red\"\nelif [ $CHOICE == 2\
    \ ]; then echo -e \"\\033[32mBrush is Green\"\nelif [ $CHOICE == 3 ]; then echo\
    \ -e \"\\033[33mBrush is Brown\"\nelif [ $CHOICE == 4 ]; then echo -e \"\\033[34mBrush\
    \ is Blue\"\nelif [ $CHOICE == 5 ]; then echo -e \"\\033[35mBrush is Purple\"\n\
    elif [ $CHOICE == 6 ]; then echo -e \"\\033[36mBrush is Cyan\"\nelse\nfi\n```\n\
    \nTypically, an `if-then-else` statement is used for conditional branching. For\
    \ instance, the following script allows the user to select a color by typing a\
    \ number. This is a simple way to implement different colors.\n\n## Branching\
    \ a script\n\nThe `if-then-else` statement is often used to handle different conditions.\
    \ For instance, the following script shows how to use conditional branching based\
    \ on user input.\n\n```\nif-then-else \n```\n\nThe following script is an example\
    \ of how to use branching.\n"
  mdcn: "\n\n## 编辑文本流\n\n有时，使用 Shell 流编辑器 `sed` 动态编辑文本流来格式化输出是很有用的。这是 Unix/Linux 世界中一个强大且受欢迎的应用程序。它有许多选项可以以各种方式编辑文本流。最常用是\
    \ `s`（替换）选项，它允许使用以下语法将指定的字符串替换为另一个：\n\n```\nsed \"s/seek/replace/g\"\n```\n\n\
    被 `seek` 替换的字符串和新字符串由 `replace` 表示。最后的 `g`（全局）是可选的，表示所有搜索到的实例都将被替换——省略此项将只替换字符串的第一次出现。\n\
    \n![](img/79c73558c68d3c5f59b51559717db1f4_165_0.png)\n\n在示例中，`more` 命令首先显示文件的内容，然后使用\
    \ `sed` 将单词 \"color\" 的美式拼写替换为对应的英式写法。该命令在输出中进行了两次替换，以考虑大小差异。\n\n![](img/79c73558c68d3c5f59b51559717db1f4_165_1.png)\n\
    \n![](img/79c73558c68d3c5f59b51559717db1f4_165_2.png)\n\n![](img/79c73558c68d3c5f59b51559717db1f4_165_3.png)\n\
    \n截图中的最后一个命令显示通过管道使用 `tail` 命令输入 `sed`。这选取了文件末尾的指定行数。在这种情况下，最后两行被发送到 `sed` 进行替换，最后显示输出——文件的最后一行包含一个不可见的换行符。\n\
    \n164 | Linux 快速入门\n\n## 替换变量\n\n变量被称为“容器”，其中可以存储文本和数值。这些值可以使用该变量名来引用，并在名字前加上一个\
    \ `$` 符号——传统上 Linux Shell 变量名是大大写的。\n\n使用 `=` 运算符为变量赋值，文本字符串应包含在引号中。\n\n![](img/79c73558c68d3c5f59b51559717db1f4_166_0.png)\n\
    \n![](img/79c73558c68d3c5f59b51559717db1f4_166_1.png)\n\n在 Shell 提示符处输入 `set`\
    \ 可以查看所有环境变量及其值的列表——你可以使用该命令为它们分配新值。\n\n变量一直存在，直到创建它们的 Shell 会话结束。还有一些 Shell 始终可用的特殊环境变量。\n\
    \n`USER` 环境变量非常有用，因为它包含了当前用户名，在脚本中可以使用它可以创建个性化的输出，而无需知道用户名。`$PATH` 环境变量也很有用，因为它包含了\
    \ Shell 自动识别的目录列表——当你输入一个命令时，Shell 会根据该名称查找相应的程序。\n\n![](img/79c73558c68d3c5f59b51559717db1f4_166_2.png)\n\
    \n注意 `$PATH` 环境变量列出的最后一个目录是用户主目录下的 `/bin` 子目录——这应该是放置 Shell 脚本文件的地方。\n\n## 创建\
    \ Shell 脚本\n\nShell 脚本是一个纯文本文件，包含一系列命令，每当执行脚本时（通过在 Shell 提示符处输入其名称），就可以执行重复序列。这就像是为脚本名称创建一个自定义命令。\n\
    \n脚本可以只包含单个命令，也可以包含命令列表——完全按照它们在 Shell 提示符处输入的方式编写。例如，可以使用 `-e` 选项设置 Shell 窗口的字体颜色，以允许解释转义序列，并使用美国国家标准协会（ANSI）代码引用指定所需的颜色。\n\
    \n下面的示例演示了如何通过提示符从不同的颜色来更改字体“brush”。\n\n![](img/79c73558c68d3c5f59b51559717db1f4_167_0.png)\n\
    \n```\nShell - Konsole\nSession Edit View Bookmarks Settings Help\n[mike] echo\
    \ -e \"\\033[31m\"\n[mike] echo -e \"\\033[32m\"\n[mike] echo -e \"\\033[33m\"\
    \n[mike] echo -e \"\\033[34m\"\n[mike] echo -e \"\\033[30m\"\n[mike] $\n```\n\n\
    这些命令并不非常用户友好，如果你经常这样做，可能更喜欢创建一个脚本来更改 brush 颜色。\n\n要创建一个新脚本，打开任何纯文本编辑器（如 `vi`），然后在第一行的开头输入以下代码：\n\
    \n```\n#!/bin/bash\n```\n\n这有时被称为 \"sh-bang\" 行，以 `#` 字符命名——每当 Linux 在文件开头读取这些字符时，它会锁定指定的路径位置以供解释器执行脚本。在这种情况下，它是\
    \ `bash` Shell 程序，位于 Linux 的 `/bin` 目录中。\n\n可以使用 `#` 字符为 Shell 脚本添加注释——该行随后的任何字符都会被忽略。添加注释来描述脚本的、作者、日期等是有用的。\n\
    \n现在像你所做一样输入命令，将文件保存到 `/bin` 中使其可执行。下面显示的“brush”脚本保存在 `~/bin`。\n\n![](img/79c73558c68d3c5f59b51559717db1f4_168_0.png)\n\
    \n保留此处的空格是重要的。\n\n![](img/79c73558c68d3c5f59b51559717db1f4_170_0.png)\n\n```bash\n\
    #!/bin/bash\n# 一个更改任何 brush 颜色的脚本\n# 首先清除屏幕\nclear\n# 颜色选项菜单\necho -e \"\\033[0mmBrush\
    \ Menu - Please select a color:\"\necho -e \"\\033[31m[0]\"\necho -e \"\\033[31m[1]\"\
    \necho -e \"\\033[32m[2]\"\necho -e \"\\033[33m[3]\"\necho -e \"\\033[34m[4]\"\
    \necho -e \"\\033[35m[5]\"\necho -e \"\\033[36m[6]\"\necho -e \"\\033[0mExit\"\
    \n\n# 将用户输入存储在变量中\nread\nCHOICE\n# 确认我们的颜色选择\nif [ $CHOICE == 0 ]; then echo -e\
    \ \"\\033[30mBrush is Black\"\nelif [ $CHOICE == 1 ]; then echo -e \"\\033[31mBrush\
    \ is Red\"\nelif [ $CHOICE == 2 ]; then echo -e \"\\033[32mBrush is Green\"\n\
    elif [ $CHOICE == 3 ]; then echo -e \"\\033[33mBrush is Brown\"\nelif [ $CHOICE\
    \ == 4 ]; then echo -e \"\\033[34mBrush is Blue\"\nelif [ $CHOICE == 5 ]; then\
    \ echo -e \"\\033[35mBrush is Purple\"\nelif [ $CHOICE == 6 ]; then echo -e \"\
    \\033[36mBrush is Cyan\"\nelse\nfi\n```\n\n通常，`if-then-else` 语句用于条件分支。例如，下面的脚本显示了如何根据用户输入进行条件分支。这是实现不同颜色的简单方法。\n\
    \n## 脚本分支\n\n`if-then-else` 语句经常用于处理不同的条件。例如，下面的脚本显示了如何根据用户输入使用条件分支。\n\n```\n\
    if-then-else \n```\n\n下面的脚本是使用分支的示例。\n\n"
