  - '[PAGE 21]


    # Configuring the mouse


    The Linux installer provides standard mouse support from the outset but requests
    you select your mouse type so it can support other types of mouse. If your mouse
    has a wheel a test is made to confirm that the wheel will be functional in Linux.


    ![](img/79c73558c68d3c5f59b51559717db1f4_21_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_21_1.png)


    20 | Linux in easy steps'
  - '[PAGE 22]


    # Choosing the right security level


    After configuring the mouse installer asks you to select one of four levels of
    security, from Standard to Paranoid.

    The higher security levels are generally a trade-off at the expense of ease-of-use.
    Most home users will be satisfied by the Standard default level of security if
    they only connect to the Internet to use a web browser and to send or receive
    email.


    ![](img/79c73558c68d3c5f59b51559717db1f4_22_0.png)


    If, on the other hand, you intend to use your Linux system as a server you should
    really choose a higher level of security to safeguard against possible problems
    during multiple connections. This is especially true when the system will hold
    critical data or is directly connected to the Internet as a web server.

    Select the level of security you prefer then click on the Next to proceed with
    the installation.


    ![](img/79c73558c68d3c5f59b51559717db1f4_22_1.png)


    Settings selected during the Linux installation process can be amended later by
    running the Linux installer again to upgrade the installed Linux system. This
    means that the security level can be increased later if should prove necessary.'
