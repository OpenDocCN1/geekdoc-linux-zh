    # Understanding virtual desktops


    One great feature of Linux desktops not found in Windows is the ability to support
    multiple “virtual” desktops. This allows you to open applications on different
    desktops and to easily switch between those running applications.


    By default four virtual desktops are available in KDE and these are depicted on
    the taskbar as a block of four square buttons.


    ![](img/79c73558c68d3c5f59b51559717db1f4_55_0.png)


    The active desktop the illustration above is the number one desktop that has a
    white background. When you open an application on that desktop the window is represented
    on its taskbar button.


    ![](img/79c73558c68d3c5f59b51559717db1f4_55_1.png)


    Clicking on a different desktop button presents a fresh desktop, but the application
    continues to run in the original one.


    ![](img/79c73558c68d3c5f59b51559717db1f4_55_2.png)


    The copy''npaste process in Linux is simple. Just hold the left mouse button and
    drag the cursor over the text it this copies the text onto the clipboard. Go to
    the document where you want to add the copied text and press the center mouse
    button (or wheel) to paste the text.


    ![](img/79c73558c68d3c5f59b51559717db1f4_55_3.png)


    Now you can open an application on the empty desktop then switch between the two
    applications using their taskbar buttons.


    ![](img/79c73558c68d3c5f59b51559717db1f4_55_4.png)


    In the illustration above a text document is on desktop #1 in the KEdit application
    that can be launched from the Applications, Editors menu. A new text document
    is opened in a second instance of KEdit on desktop #2. You can quickly copy''npaste
    from the original document to the new document by switching desktops.'
