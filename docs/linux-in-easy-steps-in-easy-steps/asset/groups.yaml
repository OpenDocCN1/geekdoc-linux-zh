    ## 在虚拟控制台之间切换


    Linux 源自 Unix，Unix 在图形界面流行很久就被引入了。它是一个基于文本的操作系统，仅使用键盘输入，并在简单的显示器上显示输出。“控制台”（console）一词描述了一个输入设备（键盘）和一个输出设备（显示器）的组合。


    Linux 支持“虚拟控制台”（virtual consoles）的概念，允许你同时激活多个全屏 shell。你可以使用特殊的组合键在它们之间轻松切换。这在你正在处理多个
    shell 程序时非常有用。


    大多数 Linux 安装默认提供七个虚拟控制台，尽管你通常只能看到第七个——这是运行 X Window 系统图形桌面的那个控制台。编号为 1 到 6 的虚拟控制台不支持图形。相反，它们被配置为让你执行命令并运行
    shell 程序。


    要从图形桌面打开特定的虚拟控制台，一只手按住 `Ctrl+Alt` 键，另一只手按 `F1–F6` 键之一——F1 将打开 1 号虚拟控制台，F2 将打开
    2 号虚拟控制台，以此此类推。要从虚拟控制台从图形桌面返回你的用户名和密码，请在按住回车键的同时按下 `F7`。


    使用 `who` 命令可以发现六个基于文本的虚拟控制中有哪些正在使用。在下面的截图中，普通用户登录了 1、2 和 3 号控制台——每个控制台都可以运行不同的
