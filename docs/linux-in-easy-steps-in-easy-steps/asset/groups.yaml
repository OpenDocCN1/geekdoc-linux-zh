    # Opening selection dialogs


    The currently selected foreground and background colors are shown in the bottom
    left panel in The GIMP toolbox. Double-click on either of these to open the Color
    Selection dialog where a new color can be selected.


    ![](img/79c73558c68d3c5f59b51559717db1f4_127_0.png)


    For instance, double-click on the white background area to open the Color Selection
    dialog box. Click the approximate color you require in the tall multi-colored
    panel, then choose a color selection in the large colored area – when you click
    the Close button the chosen color appears in the toolbox panel.


    ![](img/79c73558c68d3c5f59b51559717db1f4_127_1.png)


    You can also select a color by its RGB, HSV or Hexadecimal value.


    ![](img/79c73558c68d3c5f59b51559717db1f4_127_2.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_127_3.png)


    Default colors of black-on-white can be selected by clicking the small black and
    white boxes and the selected colors can be switched by clicking the arrowed icon.


    ![](img/79c73558c68d3c5f59b51559717db1f4_127_4.png)


    The bottom right panel in The GIMP toolbox displays the currently selected Brush,
    Pattern and Gradient. Click on any one of these to open its Selection dialog –
