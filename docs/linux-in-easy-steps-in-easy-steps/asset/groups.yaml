    # Connecting to the Internet


    The simplest way to set up Internet access is via an ethernet connection. This
    will have been automatically configured during the Linux installation process
    if the Network Interface Card (NIC) was installed and connected.


    If you are using a dial-up service with a modem, or if you are subsequently installing
    an ethernet NIC, use the Internet Configuration wizard to configure the connection.


    For instance, launch the Mandrate Control Center and click the Network & Internet
    menu option, then the dialog should show details of the NIC and its driver. Alternatively
    the modern details should appear if you are configuring a modem.


    ![](img/79c73558c68d3c5f59b51559717db1f4_67_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_67_1.png)


    If the detected connection device does not have driver support menu option. Then
    select the device from the list that appears in the dialog and click on the Run
    Config Tool to configure the device. Return to the Network & Internet dialog and
    start the Connection wizard.


    Click the Wizard button to begin Internet configuration. In the first dialog box
    check the box marked Use Auto-Detection, then click the Next button. The wizard
    will search for your connection device and report what it finds in the next dialog.
    Choose the connection you want to configure, then click the Next button. Check
    the box to use an Automatic IP address, or manually enter the address details
    if you want to use a static IP address.'
