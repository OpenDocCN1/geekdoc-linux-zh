    ## 在 Windows 中访问文件


    在双启动系统中，Windows 分区可以挂载到 Linux 中，以允许对其中存储的文件进行一定程度的访问。这一过程类似于外围设备的挂载方式——允许访问便携介质（如
    CD-ROM）上的文件。


    用户友 Linux 发行版（如 Mandrake Linux）会自动为你挂载 Windows 分区。这意味着你可以轻松从 Linux 的 `/mnt/windows`
    目录访问 Windows 中的文件。


    此示例显示了 Photoshop 提供的一个示例图像（位于 Windows 分区上）如何从 Linux 能够轻松访问。


    ![](img/79c73558c68d3c5f59b51559717db1f4_105_0.png)


    104 | Linux 入门


    # ...续


    旧版本的 Windows 9.x 操作系统使用 FAT 或 FAT32 系统，Linux 既可以读取也可以写入这些系统。现代 Windows 平台（如 XP）使用
    NTFS 文件系统，它可能没那么简单——某些 Linux 发行版不支持 NTFS，因此完全无法访问 Windows 分区。其他发行版（如 Mandrake
    Linux）可能读取 NTFS 但无法写入——请检查你的文档以查看其是否支持 NTFS。


    ![](img/79c73558c68d3c5f59b51559717db1f4_106_0.png)


    当 Linux 无法直接写入 Windows 分区时，你可以将文件复制到 Linux 进行修改，然后保存到便携介质（如 CD-ROM 或软盘）上——启动 Windows
    并修改后的文件复制回去。


    如果你的 Linux 发行版没有自动挂载 Windows 分区，则可能需要手动挂载。首先确定 Windows 分区的物理位置——如果它在第一个硬盘驱动器的开头，它可能是
    `/dev/hda1`。使用控制中心（Control Center）查找位置——例如，在 RedHat Linux 浏览器中并选择“硬盘”。


    在命令行提示符下输入 `su`，然后输入 root 密码登录 root 账户。现在使用此命令创建一个可以挂载 Windows 分区的目录：


    ```bash

    mkdir /mnt/windows

    ```


    要将 Windows 分区挂载到此新目录，执行以下命令（其中 `/dev/hda1` 是分区）：


    ```bash

    mount -t vfat /dev/hda1 /mnt/windows

    ```


    输入 `exit` 退出 root 并进入挂载的目录：


    ```bash

    cd /mnt/windows

    ```


