  - '[PAGE 166]


    # # Substituting variables


    A variable is named “container” in which text and numeric values can be stored.
    Those values can be referenced using that variable''s name, prefixed by a $ character
    – traditionally Linux shell variable names are uppercase.


    Values are assigned to a variable using the = operator and strings of text should
    be enclosed in quotes.


    ![](img/79c73558c68d3c5f59b51559717db1f4_166_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_166_1.png)


    Type set at a shell prompt then to see a list of all environment variables and
    their values – you can use the set command to assign new values to them.


    Variables remain in existence until the shell session in which they were created.
    There are also special environment variables which are constantly available to
    the shell.


    The USER environment variable is useful because it contains the name of current
    user and can be useful in scripts to create personalized output without knowing
    the user''s name. The $PATH environment variable is useful as it contains a list
    of directories that the shell automatically recognizes – when you type a command
    the shell looks for a program by that name.


    ![](img/79c73558c68d3c5f59b51559717db1f4_166_2.png)


    Notice the last directory listed in the $PATH environment variable is the /bin
    sub-directory of the user''s home directory – this is where shell script files
    should be placed.'
  - '[PAGE 167]


    # Creating a shell script


    A shell script is a plain text file containing a series of commands that allow
    repetitive sequences to be performed whenever the script is executed – by entering
    its name at a shell prompt. This is like creating a custom command of the script
    name.


    The script can simply comprise a single command, or a list of commands – exactly
    how they would be typed at a shell prompt. For instance, the color of the font
    in a shell window can be set with its -e option to allow escape sequences to be
    interpreted, and the desired color stated using American National Standards Institute
    (ANSI) code reference.


    The example below demonstrates how the font "brush" can be changed through different
    colors from a prompt.


    ![](img/79c73558c68d3c5f59b51559717db1f4_167_0.png)


    ```

    Shell - Konsole

    Session Edit View Bookmarks Settings Help

    [mike] echo -e "\033[31m"

    [mike] echo -e "\033[32m"

    [mike] echo -e "\033[33m"

    [mike] echo -e "\033[34m"

    [mike] echo -e "\033[30m"

    [mike] $

    ```


    These commands are not very user-friendly so you may prefer to create a script
    to change brush colors if you want to do this often.


    To create a new script open any plain text editor, such as vi, then type the following
    code at the beginning of the first line:


    ```

    #!/bin/bash

    ```


    This is sometimes called the "sh-bang" line, after the # characters – whenever
    Linux reads these at the beginning of a file it locks in the specified path location
    for an interpreter to execute the script. In this case it is the bash shell program,
    that is located in Linux’s /bin directory.'
  - '[PAGE 168]


    Comments can be added to a shell script using the # character – any characters
    following this on a line are ignored. It is useful to add comments below the sh-bang
    line to describe the purpose of the script, author, date of creation, and so on.


    Now type the command, exactly as you would at a shell prompt, save the file in
    the /bin sub-directory of your home directory. Set the script file''s permissions
    to make it executable, then type the file name at a shell prompt and hit Return
    to run the script.


    The “red-brush” script shown below is saved at ~/bin/red-brush. It changes the
    shell color to red and displays a formatted message when it''s executed.


    ![](img/79c73558c68d3c5f59b51559717db1f4_168_0.png)


    Use the 700 permission to make a file read, write and executable for the user
    only.


    ```

    Shell - Console

    Session Edit View Bookmarks Settings Help

    !/bin/bash

    # a script to change the brush color to red

    echo -e "\033[31m\nbrush is now red\n"

    ""/bin/red-brush" 5L, 102C written All

    ```


    ```

    Shell - Console

    Session Edit View Bookmarks Settings Help

    [mike] chmod 700 ~/bin/red-brush

    [mike] $ red-brush

    Brush is now red

    [mike]$ █

    ```


    Similar scripts could be created for each available color – blue-brush, black-brush,
    green-brush, and so on – but it would be better to encapsulate these choices within
    a single script. The example on the next page builds upon this initial script
    by adding “conditional branching” to apply the desired color according to an input
    option.'
  - '[PAGE 169]


    # Branching a script


    It is often desirable to have a shell script implement a specific action according
    to the condition of a tested value. For instance, when testing a boolean value,
    a script could execute a certain action when the tested value has a true condition
    and a different action when it has a false condition.


    if-then statement is the simplest way to test a value to determine if an action
    should be implemented, with this syntax:


    ```

    if[test-expression];then action fi

    ```


    The action will be only implemented when the tested expression is true – when
    it''s false the script simply moves on. Notice that if-then statement must be
    terminated with the fi keyword. Multiple commands can be included in the action
    part of the statement for execution when the tested value is true.


    ![](img/79c73558c68d3c5f59b51559717db1f4_169_0.png)


    You can provide an alternative to be executed when the tested value is false by
    adding an else keyword to an if-then statement, like this:


    ```

    if[test-expression];then action else fi

    ```


    This statement is suitable when testing a value that may have only two conditions
    but for those values which may be varied it is necessary to repeat tests using
    the elif keyword – a combination of else and if:


    ```

    if [test-expression];then action-1

    elif [test-expression];then action-2

    elif [test-expression];then action-3

    fi

    ```


    Typically a value input by a user will be stored in a variable. This value can
    then be evaluated as a test expression in an if-then statement to allow the script
    to execute specific actions according to the result of the test – a procedure
    referred to as "conditional branching". For instance, the following script presents
    a menu of brush colors to select a color for their preference. The user input
    is assigned to a variable named CHOICE by the read command. This variable is then
    tested in an if-then statement, and an appropriate command is executed according
    to the result of the evaluation.'
