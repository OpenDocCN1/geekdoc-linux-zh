    ## 3. Configuring hardware for Linux


    ### Customizing the Linux bootloader


    On a dual-boot system Linux makes the default system to start. If you prefer to
    keep Windows as the default system the bootloader menu can be reconfigured to
    do so using the system control center.


    In Mandrake Linux open the Mandrake Control Center, click on the Boot icon. Now
    click the Configure button in the Lilo/Grub panel to open the bootloader options.


    ![](img/79c73558c68d3c5f59b51559717db1f4_37_0.png)

    ![](img/79c73c5f59b51559717db1f4_37_1.png)


    LILO (Linux Loader) and Grub are the bootloaders commonly supplied with Linux.
    You can choose one to use in the drop-down boxes. Also the length of time to display
    the bootloader menu can be set here - it is shown above as 10 seconds. Click on
    the OK button to reveal the existing boot menu items.


    ![](img/79c73558c68d3c5f59b51559717db1f4_37_2.png)

    ![](img/79c73c5f59b1559717db1f4_37_3.png)


    The asterisk denotes the default system to start on boot. Select any menu item
    then click the Remove button to delete it or click the Modify button to change
    how it appears. Only the "linux" and "windows" menu items are essential – the
    other entries can be deleted.


    To capitalize the "linux" entry, select it then click the Modify button. This
    opens a second dialog box where the label can be edited. Change the letter to
    uppercase and uncheck the box marked Default then click the OK button to close
    this dialog.


    ![](img/79c73558c68d3c5f59b51559717db1f4_38_0.png)

    ![](img/79c73c5f59b1559717db1f4_38_1.png)


    To capitalize the "windows" entry, select it then click the Modify button to open
    the second dialog box. Change the letter to uppercase and check the box marked
    Default to make Windows the default system. Click the OK button to close the dialog
    box.


    ![](img/79c73558c68d3c5f59b51559717db1f4_38_2.png)

    ![](img/79c73c5f59b1559717db1f4_38_3.png)


    The changes to be made to the boot menu are reflected in the boot menu dialog
    box. Click its OK to apply these changes.


    Logout and reboot the computer to see the new boot menu – there should be just
    the two menu items, correctly capitalized, and Windows should start by default
    after a 10-second delay.


    35. Configuring hardware for Linux | 37


    ### Setting up the sound card


    The system control center can configure drivers for a sound card. In Mandrake
    Linux open the Mandrake Control center. Click on the Hardware menu item, then
    click on the HardDrake icon that appears in the right-hand pane. Select the sound
    card from the list of detected hardware that appears then click on the Run Config
    Tool to open the Sound Configuration dialog box.


    ![](img/79c73558c68d3c5f59b51559717db1f4_39_0.png)


    Here you can select an alternative driver (either OSS or ALSA) for your sound
    card (Silicon Integrated Systems 7018 PCI). Your card currently uses the ALSA
    "nd-trident" driver; default driver for your card is "nd-trident".


    | Driver | Description |

    | :--- | :--- |

    | Trident | Trident 4Wave/Si/S 7018/Ali 5451 and Tvia/LT |

    | Troubleshooting | Let me pick any driver |


    Accept the default driver, or choose an alternative from the dropdown menu, then
    click the OK button to configure the sound card. Although the sound card now has
    the ability to play sounds a sound server needs to be running in Linux to deliver
    the sound to the sound card.


    Both the KDE desktop and the Gnome desktop have their own control centers to configure
    the desktop environment. These can be used to configure the aRTs (analog realtime
    synthesizer) sound server to deliver sounds to the sound card.


    In KDE, click on Start, Configuration, then Control Center to launch the KDE Control
    Center. Click on the Sound item to expand its menu then select the System entry.
    Under the aRTs tab in the right-hand pane check the box to "Start aRTs sound server
    on KDE startup" then click the Apply button.


    The system control center is used to configure system-wide settings, whereas other
    desktop centers are used to configure the desktop environment – more on desktop
    settings in the next chapter.


    ![](img/79c73558c68d3c5f59b51559717db1f4_40_0.png)

    ![](img/79c73c5f59b1559717db1f4_40_1.png)


    | Sound System [modified] | Control Center |

    | :--- | :--- |

    | aRTs | Start aRTs sound server on kde |

    | Network | Enable network |

    | Accessibility | Run soundserver with realtime |

    | Power | Autosuspend if idle: 60 sec |

    | Display | Display messages: |

    | Security | Exchange over |

    | Audio | Message: |

    | Sound | | |

    | System | | |

    | WebBrowsing | |


    ![](img/79c73558c68d3c5f59b51559717db1f4_40_2.png)


    After a second or two the aRTs sound server gets started and the Test button (that
    was previously grayed out) becomes usable. Now click the Test button and you will
    hear a sample play.


    3. Configuring hardware for Linux | 39


    ### Changing screen resolution


    Changing the screen resolution from what was chosen during installation can be
    difficult in some distros – but it''s simple in Mandrake, thanks to the Mandrake
    Control Center.


    To launch the Mandrake Control Center, click on Start, Configuration, then Mandrake
    Control Center. Next click on the Hardware menu item to reveal the icons in the
    right-hand pane.


    ![](img/79c73558c68d3c5f59b51559717db1f4_41_0.png)


    Try running Linux at a screen resolution of 1024 x 768 if your setup will – some
    Linux windows look large at lower resolutions.


    On the icon marked “Change screen resolution”, the right-hand pane will display
    a description of the graphics card and the current settings for screen resolution
    and color depth.


    Click on the drop-down menus and select your preferred resolution and color depth,
    then click on the OK button.


    The configuration changes are not applied immediately – a message in the Mandrake
    Control Center asks you to “Please relog into Kwin to activate the changes”. This
    means you must either reboot the computer or log out of KDE, then log back in.


    The range of resolutions and color depths will be determined by your video card
    can support.


    ![](img/79c73558c68d3c5f59b51559717db1f4_42_0.png)


    To apply screen resolution changes without rebooting the system, first click on
    Start, Logout. Now in the Logout dialog box click the option marked "Login as
    a different user" then click the OK button.


    ![](img/79c73c5f59b1559717db1f4_42_1.png)


    When the Login dialog box appears simply log back into KDE using the same user
    name and password – when KDE starts with the new resolution configuration.

