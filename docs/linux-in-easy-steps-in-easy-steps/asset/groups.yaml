    任务栏具有极高的定制性，并为此提供了专门的功能。在任务栏上点击右键，并从右键菜单中选择“配置面板（Configure Panel）”以打开设置对话框。


    像 Linux 的大多数方面一样，通常有多种实现方法；你也可以从 KDE 控制中心的“外观与字体（LookAndFeel）”或“面板（Panels）”菜单项打开设置对话框。


    ![](img/79c73558c68d3c5f59b51559717db1f4_52_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_52_1.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_52_2.png)


    强大的“隐藏（Hiding）”选项允许你在“排列（Arrangement）”选项卡下选择任务栏的位置、高度和长度。“隐藏”选项卡下的选项可以让你决定何时隐藏任务栏以留出更多的桌面工作区域。在“菜单（Menus）”选项卡下可以编辑哪些应用程序包含在启动菜单。


    “外观（Appearance）”设置可以配置任务栏上的按钮，使其能够显示工具提示和单个背景图像。这使得它们看起来明显是按钮，而不仅仅是图标。


    “任务栏（Taskbar）”设置允许你控制运行中的应用程序图标在任务栏上的显示方式。


    4 探索 KDE 桌面 | 51


    ## 启动应用程序


    点击 KDE 开始按钮打开菜单。将鼠标指针悬停在每个菜单项上会以典型方式显示其子菜单——就像 Windows 开始菜单一样。浏览菜单，然后点击任何应用程序即可启动它。


    ![](img/79c73558c68d3c5f59b51559717db1f4_53_0.png)


    Konqueror 既是 浏览器也是文件管理器——它让你能像 Windows 资源管理器一样图形化地浏览计算机上的文件，像 Internet Explorer
    那样浏览网页。


    ![](img/79c73558c68d3c5f59b51559717db1f4_53_1.png)


    上面的截图说明了如何从图形菜单启动 Konqueror 文件/网页浏览器。注意，它的图标也会作为快速启动按钮显示在任务栏上——因此只需点击该按钮即可启动 Konqueror。


    启动 Konqueror 的另一种方法是点击“运行命令（Run Command）”菜单项，然后在弹出的对话框中输入应用程序名称——现在点击“运行（Run）”按钮打开
    Konqueror。


    ![](img/79c73558c68d3c5f59b51559717db1f4_53_2.png)


    Konqueror 以及其他应用程序可以通过“shell”窗口的命令行提示符中输入名称来启动。这就像在 Windows 的命令提示符中运行应用程序一样。


