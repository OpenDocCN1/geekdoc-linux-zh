    ## 获取帮助


    可以通过 KDE 帮助中心寻求任何 KDE 图形应用程序的帮助。这可以通过点击任务栏上的救生圈图标或点击“文档”（Documentation）菜单来启动。点击左侧窗格中的“应用程序手册”（Application
    Manuals）选项，可以展开与开始菜单中相同的应用程序列表。导航到你所需的应用程序，然后点击打开其手册。


    ![](img/79c73558c68d3c5f59b51559717db1f4_65_0.png)


    在 Konqueror 应用程序的地址栏中输入 `help:/` 也可以打开 KDE 帮助中心。通过输入 `man:/` 显示手册页，输入 `info:/`
    显示 Info 页面。


    ![](img/79c73558c68d3c5f59b51559717db1f4_65_1.png)


    KDE 帮助中心菜单还包含查看 UNIX 手页的选项，这些页详细描述了每个命令及其可选开关范围。你也可以在命令行提示符中输入 `man`，后跟一个空格和你想查询的命令来以文本模式查看。例如，输入
    `ls` 查看 `ls` 命令的 UNIX 手页——这会显示目录内容。


    在提示符处获取命令的帮助，请输入命令名，后接 `--help`


    ![](img/79c73558c68d3c5f59b51559717db1f4_65_2.png)


    某些 UNIX 手页可能看起来很混乱，但 KDE 帮助中心也可以浏览 Info 页面，以更用户友好的方式提供类似的信息。与手册页一样，你也可以在命令行提示符中输入
    `info`，后跟一个空格和你想查询的命令来进行文本模式查看。例如，输入 `info ls` 查看 `ls` 命令的 Info 页面。


    ## 浏览网页


    本章介绍了如何在 Linux 中进行各种在线活动——一旦连接到互联网，就可以轻松查看网站、发送和接收电子邮件以及在全球传输文件。它还描述了如何使用大多数发行版自带的免费应用程序构建你自己的网页。


    ## 目录


    - 连接互联网 | 66

    - Mozilla 浏览器 | 68

    - 设置电子邮件 | 70

    - 存储电子邮件地址 | 72

    - 加入新闻组 | 74

    - 传输文件 | 76

    - 编写网页 | 78

    - 在线聊天 | 80


    第五章


    ## 连接互联网


    设置 Internet 连接的最简单方法是通过以太网连接。如果安装并连接了网络接口卡 (NIC)，这将在 Linux 安装过程中自动配置。


    如果你正在使用带有调制解调器的拨号服务，或者你稍后安装了以太网网卡，请使用 Internet 配置向导来配置连接。


    例如，启动 Mandrate 控制中心并点击“网络与互联网”菜单选项，然后对话框应显示网卡及其驱动程序的详情。或者，如果你正在配置调制解调器，应该出现现代详情。


    ![](img/79c73558c68d3c5f59b51559717db1f4_67_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_67_1.png)


    如果检测到的连接设备没有驱动支持菜单选项，请从对话框中出现的列表中选择设备，并点击“运行配置工具”（Run Config Tool）来配置设备。返回“网络与互联网”对话框并启动连接向导。


    点击“向导”（Wizard）按钮开始 Internet 配置。在第一个对话框中，勾选标记为“使用自动检测”（Use Auto-Detection）的框，然后点击“下一步”。向导将搜索你的连接并在并在对话框中报告发现。选择你想配置的连接，然后点击“下一步”。勾选使用自动
    IP 地址框，或者如果你想使用静态 IP 地址，则手动输入地址详情。


    ## ...续上


    如果向导要求你输入主机名或使用默认值，只需点击“下一步”接受默认主机名。


    ![](img/79c73558c68d3c5f59b51559717db1f4_68_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_68_1.png)


    点击“下一步”按钮完成配置向导——主机名和 IP 地址详情现在应出现在 DrakConnect 对话框中，状态应变为“已连接”。启动任何网络浏览器并在 URL
    字段中输入地址 **www.google.com**——搜索页面应该出现。


    Linux 中的 Internet 配置通常非常简单——如果你遇到任何连接困难，可能需要向你的 ISP（互联网服务提供商）获取建议。


    ![](img/79c73558c68d3c5f59b51559717db1f4_68_2.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_68_3.png)


    5. 浏览网页 67


    ## Mozilla 浏览器


    除了 KDE 的 Konqueror 浏览器，大多数 Linux 发行版还包含了开源的 Mozilla 浏览器。此免费浏览器适用于许多平台。此免费浏览器包含许多功能。


    （注：原文中存在大量重复文本，已按翻译要求进行处理）


    Mozilla 包含一个名为 JavaScript 控制的脚本工具——它位于“Web 开发”（Web development）下。启动 JavaScript
    控制，并在输入框中准确输入 `alert (new Date())`。点击“评估”（Evaluate），将出现显示当前日期时间的对话框。


    - 工具 (Tools)

    - 搜索网页 Ctrl+Shift+F

    - 表单管理器 (Form Manager)

    - Cookie 管理器 (Cookie Manager)

    - 图像管理器 (Image Manager)

    - 密码管理器 (Password Manager)

    - 下载管理器 (Download Manager)

    - Web 开发 (Web Development)

    - 切换配置 (Switch Profile)


    5. 浏览网页 69


    ## 设置电子邮件


    Mozilla 包含一个名为 Messenger 的客户端应用程序。通常可以在“开始、网络、邮件”菜单下找到它，也可以可以通过 Mozilla 窗口上的“邮件与新闻组”（Mail
    & Newsgroups）选项或从组件栏启动。


    首次启动时，会弹出账户向导（Account Wizard）要求创建一个新账户。勾选标记为“电子邮件账户”（Email Account）的单选按钮，然后点击“下一步”。现在输入你的姓名和电子邮件地址，然后再次点击“下一步”。


    在随后的对话框中输入入出站服务器的确切名称——你的 ISP 将提供这些信息。在下一个对话框中输入 ISP 分配的电子邮件名称。例如，对于地址 mike@example.com
    输入“mike”。点击“下一步”继续。


    现在为账户输入一个你喜欢的名称。例如“Mikes Mail”。当计算机由多人使用时，能够快速识别每个账户将特别有用。


    点击“下一步”按钮显示所有账户信息的摘要。检查详情以确保正确，点击“完成”（Finish）按钮完成账户配置。


    Messenger 包含过滤器，可以标记怀疑是垃圾邮件的邮件——你可以在“工具”菜单上找到垃圾邮件控制。


