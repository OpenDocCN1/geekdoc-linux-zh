    ## OpenOffice Math 中的公式


    OpenOffice 套件中的 Math 允许以严格控制的格式将数学公式插入文档中。在 OpenOffice Writer 中打开文档后，点击“插入”、“对象”、“公式”菜单进入公式模式——窗口底部会显示一个“命令”区域。


    ![](img/79c73558c68d3c5f59b51559717db1f4_121_0.png)


    在命令区域上点击鼠标右键，可以在右键菜单中查看预定义的公式控件范围。选择其中任何一个，或直接在命令区域中输入以构建公式。点击主窗口以关闭命令区域，格式化后的公式将显示在文档中。


    在模式下，点击“工具”、“目录”，可以找到一个可以插入到公式中的数学符号目录。这包括希腊字母，还有一个“特殊”合集，你可以在其中添加自己的符号。


    目录符号通过在命令代码中在其名称前加缀 `%` 字符来引用——在下方所示的示例中，e、%x、%B 和 pi 引用了特殊符号。注意表达式包含在大括号内，而 `
    ` 字符和 ~


    ![](img/79c73558c68d3c5f59b51559717db1f4_121_1.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_121_2.png)


    20 | 快速上手 Linux


    ## 创建图形


    Linux 中最流行的图形处理软件是 GNU 图像处理程序 (GIMP)，它几乎包含所有的发行版中。本章将探讨 GIMP 的一些显著特性，并与市场领先的 Adobe
    Photoshop 程序进行对比。


    ## 目录


    | 主题 | 页码 |

    | :--- | :--- |

    | 介绍 GIMP | 122 |

    | 创建新图像 | 124 |

    | 查找菜单 | 125 |

    | 打开选择对话框 | 126 |

    | 图层操作 | 128 |

    | 选择区域 | 130 |

    | 使用滤镜 | 132 |

    | 运行脚本 | 134 |

    | 编写自己的 GIMP 脚本 | 136 |


    ## 介绍 GIMP


    GIMP 拥有 Photoshop 中的许多功能。在某些领域，它的能力甚至更强——但在其他领域则较少。与 Photoshop 不同，GIMP 是根据通用公共许可证
    (GPL) 条款免费提供的开源源软件。


    ![](img/79c73558c68d3c5f59b51559717db1f4_123_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_123_1.png)


    对于缺乏经验的用户来说，GIMP 插件的结果可能比 Photoshop 的更难以预测。


    标准 GIMP 安装中包含 220 多个插件，涵盖了几乎所有作为 Photoshop 插件配件购买的功能。许多 GIMP 插件比 Photoshop 更具可配置性，这意味着在经验的用户手中，它们可以创建更强大的效果。


    GIMP 可以读取 Photoshop .psd 格式的图像文件——如果你有该格式的文件库，可以使用它们来进行编辑。


    GIMP 相比 Photoshop 的一个主要优势是它的脚本能力——支持不少于四种脚本语言。例如，你可以使用 PERL（实用提取和报告语言）脚本编写脚本来创建自定义效果——这是
    CGI 脚本的首选语言。GIMP 的脚本能力是 Photoshop 无法比拟的。


    ## ...续上


    GIMP 的主要缺点是缺乏对 CMYK 颜色或专色（如 PANTONE）的支持——它只支持 8 位 RGB、灰度和索引图像。因此，GIMP 在印前领域无法与
    Photoshop 竞争，但在创建网页数字图像方面提供了一些令人兴奋的可能性。


    当 GIMP 首次启动时会安装配置文件——只需点击“确定”接受默认选择。应用程序加载时显示启动界面。你会发现 GIMP 与 Photoshop 非常不同。它打开了
    GIMP 工具箱对话框，以及通常还有选项、通道、路径和画笔选择等对话框——如下所示。


    ![](img/79c73558c68d3c5f59b51559717db1f4_124_0.png)


    工具箱上的图标与 Photoshop 工具箱中的大致对应——将指针悬停在每个图标上可以看到描述按钮用途的工具提示。GIMP 工具对话框也有菜单。


    ![](img/79c73558c68d3c5f59b51559717db1f4_124_1.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_124_2.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_124_3.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_124_4.png)


    9. 创建图形 | 123


    ### 创建新图像


    GIMP 的初始外观通常会让用户疑问菜单和工作区域在哪里——你只能看到 GIMP 工具箱中的“文件”和“编辑”菜单，且内容很少。要访问完整的 GIMP 菜单，必须先打开一个或现有图像。选择“文件”、“浏览”打开现有图像，或点击“文件”、“新建”创建一个新图像。在“新建”对话框中设置尺寸、类型——RGB
    或灰度。然后点击“确定”。GIMP 不 CMYK。


    ![](img/79c73558c68d3c5f59b51559717db1f4_125_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_125_1.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_125_2.png)


    24 | 快速上手 Linux


    ### 查找菜单


    右键点击工具箱查看通常在 Photoshop 中找到的所有菜单。例如，双击任何按钮以打开其选项。


    ![](img/79c73558c68d3c5f59b51559717db1f4_126_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_126_1.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_126_2.png)


    GIMP 工具对话框也有菜单。选择“对话框”选项访问设置。


    ![](img/79c73558c68d3c5f59b51559717db1f4_126_3.png)


    9. 创建图形 | 125


    ### 打开选择对话框


    当前的前颜色和背景色显示在 GIMP 工具箱的左下面板。双击其中任一个以打开颜色对话框。


    ![](img/79c73558c68d3c5f59b51559717db1f4_127_0.png)


    例如，双击白色背景区域打开颜色对话框。在较高的彩色面板中点击你所需的近似颜色，然后在较大的颜色区域选择一种颜色——当你点击“关闭”按钮时，选定的颜色就会出现在工具箱中。


    ![](img/79c73558c68d3c5f59b51559717db1f4_127_1.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_127_2.png)


    你也可以通过 RGB、HSV 或十六进制值选择颜色。


    ![](img/79c73558c68d3c5f59b51559717db1f4_127_3.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_127_4.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_127_5.png)


    GIMP 工具箱的右下面板显示了当前选的画笔、图案和渐变。点击其中任何一个以打开其选择对话框——同样，渐变和图案对话框包含了一系列


