    ## Creating a new text file


    To create a text file in KDE first open the applications. For instance, click
    on Start, Applications then choose the KEdit (Text Editor) option to launch the
    KEdit editor.


    To change the appearance of KEdit, click on the Settings menu and select the Configure
    option – choose your font, colors, spellchecker, and word wrap preferences.


    ![](img/79c73558c68d3c5f59b51559717db1f4_95_0.png)


    Type text content directly into the KEdit window then click on File, Save to open
    the Save As dialog box. Enter a directory in the topmost field to determine where
    the file should be saved – you can click on the arrow button to select a directory
    from the drop-down list that appears. Enter a name for the file in the "Location:"
    field, then click the OK button to save the file.


    The left-hand pane provides location options that you can click to quickly select
    the new text file.


    ![](img/79c73558c68d3c5f59b51559717db1f4_95_1.png)


    The Edit menu has all the usual options to cut, copy, paste, find and replace
    text, and the Go menu lets you move to a specified line number. To check for spelling
    errors in the text, click the Tools menu and select the Spelling option to run
    the Spellcheck.


    You can choose which dictionary the Spellcheck should use – click on Settings.
    Configure KEdit to launch the Configure dialog box, then click the Spelling option.


    ![](img/79c73558c68d3c5f59b51559717db1f4_96_0.png)

    ![](img/79c73558c68d3c5f59b51559717db1f4_96_1.png)


    The Portable Document Format (PDF) was developed by Adobe Systems. They are compact
    files that maintain the original document format for viewing and printing.


    Click on File, Print to open the Print dialog – the arrow button in the “Name:”
    field reveals a drop-down list of great options. Besides using a printer to produce
    a hard copy, you can create a PDF or PostScript version of your text document.
    Additionally, Mail PDF File option opens the default email application with a
    PDF version of the text document already attached and ready to go.


    ![](img/79c73558c68d3c5f59b51559717db1f4_96_2.png)


    Discover how to create and edit text files from the command prompt with the vi
    editor on page 152.


    ![](img/79c73558c68d3c5f59b51559717db1f4_96_3.png)


    ## Handling files


    This chapter illustrates how to create and manipulate files in Linux. The concept
    of file ownership is explained and examples demonstrate how to change file permissions.
    It also shows how to access files from Windows.

