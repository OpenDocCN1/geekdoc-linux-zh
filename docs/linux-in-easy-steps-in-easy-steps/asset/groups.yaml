    # # Compressing and extracting files


    Files in Linux, and other Unix-based operating systems, are typically archived
    into a “tarball” for compact transfer. This first creates a Tape Archive (TAR)
    copy of the file then compresses using the familiar ZIP compression format.


    TAR was originally used for backing up files on tape in a manner that preserves
    the file permissions and hierarchy.


    In KDE right-click on a directory folder to be archived then select the “Tar this
    directory” option on the context menu. A tarball of the directory and its contents
    are created in the current location—this has the same name, but adds a .tar.gz
    extension.


