    # # Preparing to install Linux


    If you choose to install Linux on the same HD drive as Windows, it''s a good idea
    to clean up the disk before starting the installation.


    In Windows XP, click on the My Computer icon then right-click on the HD drive
    and select Properties to open the Local Disk Properties dialog.


    ![](img/79c73558c68d3c5f59b51559717db1f4_17_0.png)


    This procedure is not required if Linux is to replace Windows on a single HD drive,
    or if Linux is to be installed on a second HD drive.


    Under the Tools tab click the Check Now to open the Check Disk dialog. Check both
    boxes click the Start button to run ScanDisk – if a further dialog appears click
    Yes then reboot to run ScanDisk. The ScanDisk utility checks the condition of
    the hard disk and takes a while to execute.


    When ScanDisk completes click the Defragment Now button in the Local Disk Properties
    dialog to tidy up the file system. When the defragmenter finishes rearranging
    the files on the hard disk you''re ready to begin the Linux installation.


    ![](img/79c73558c68d3c5f59b51559717db1f4_17_1.png)


    Make a backup of everything on your Windows partition before proceeding to Linux.
    You probably won''t need it, but it ensures that, in the worst scenario, you could
    recover absolutely all your vital data.


