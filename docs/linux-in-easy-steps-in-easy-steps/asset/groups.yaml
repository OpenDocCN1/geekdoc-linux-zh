    # 使用过滤器


    与 Photoshop 类似，GIMP 包含了大量的过滤器，用于对图像应用效果。通过在右键上下文菜单中选择“过滤器”（Filters）选项的子菜单来访问它们。GIMP
    过滤器分为以下几类：


    ## 动画


    动画播放器（Animation Player）可以将图层作为连续帧显示，并让你轻松创建 GIF 文件格式的动画。它还提供了优化功能以保留这些动画。


    ![](img/79c73558c68d3c5f59b51559717db1f4_133_0.png)


    热提示：在白色背景上添加许多不同颜色的矩形，然后使用“艺术”（Artistic）、“立方主义”（Cubism）过滤器即可瞬间杰作。


    ## 艺术


    创建艺术效果的过滤器，例如立方主义绘画和马赛克图案。这些可以应用于整个图像，或仅应用于所选区域以添加特殊效果。


    ## 模糊


    许多类型的模糊过滤器有助于软化图像的部分。例如，为了软化阴影边缘——真实的阴影很少有硬边缘，因此使用合适的模糊过滤器用模糊边缘来描绘是一个好主意。此外，模糊过滤器对于隐藏肖像图像中的皮肤缺陷和皱纹非常有用。


    ## 颜色


    一系列允许你操作图像或所选区域的红、绿、蓝（RGB）以及色相、饱和度、亮度（HSV）属性的过滤器。


    ## 变形


    创建特殊表面效果的过滤器，例如水波纹、风效果、波浪、旋涡和压缩。这些过滤器对于创建纹理特别有用。


    ## 边缘检测


    允许你根据颜色边界找到物体边缘的过滤器。这些可以用于通过“模糊选择工具”（Fuzzy Select tool）轻松选择区域，或使用“油漆桶工具”（Paint
    Bucket tool）简化颜色填充。


    ## 增强


    清理图像或选择区域的实用过滤器——让你去噪点、去隔织和去线条。该类别还包含一个锐化过滤器，对于使照片图像更加清晰特别有用。


    使用 Shift+Alt+F 键调出你上次使用的过滤器的对话框——使用 Alt+F 再次应用上一次过滤器。


    ![](img/79c73558c68d3c5f59b51559717db1f4_134_0.png)


    ## 通用


    包含了使用卷积矩阵（Convolution Matrix）图像处理的数学过滤器——这可以执行各种操作，但需要一些数学知识才能充分利用其潜力。


    ## 玻璃效果


    这些过滤器并不是像你预期的那样创建各种玻璃表面的外观，而是用于创建不同类型的透镜或曲面镜形状。


    ## 光效


    一系列你可以用于向图像或所选区域添加光泽、光彩和光晕的过滤器。通过这些过滤器可以实现许多多样的光照效果，如果你已经习惯了 Photoshop 出色的“光照效果”（Lighting
    Effects）对话框，你可能会发现这些过滤器的应用没没那么直观。在每次启动 GIMP 时，花点时间阅读“每日提示”（Tip Of The Day）——里面有很多实用的宝藏。


    ![](img/79c73558c68d3c5f59b51559717db1f4_134_1.png)


    ## 映射


    包含了许多通过图像映射的位移或扭变创建有趣效果的过滤器。


    ## 噪声


    向图像或选择区域添加斑点的过滤器。这些对于表示噪声或胶片颗粒非常有用。


    ## 渲染


    使用此类别的过滤器可以为图像或对象添加惊叹的效果。这些包括自然效果（如云朵和火焰）以及图案效果（如马赛克、网格和拼图）。


    ## 运行脚本


    GIMP 支持可以对图像执行一系列预设操作的脚本。GIMP 安装包包含了许多自定义脚本——这些脚本由 GIMP 爱好者编写，提供了一些非常棒的效果。


    在 GIMP 工具箱窗口的 Xnts 菜单下的 Script-Fu 菜单可以找到预制脚本。在图像窗口的右键上下文菜单中，也可以通过“过滤器”的 Script-Fu
    选项获取更多脚本。


    脚本对于执行一系列重复操作以在图像中创建对象非常有用。例如，你可以通过用适当渐变填充圆形来创建一个三维球体对象，然后在较低的图层上创建一个模糊阴影，以产生球体坐在平面表面上的印象。GIMP
    有一个脚本可以轻松执行创建此对象所需的所有操作——在工具箱的 Xnts 菜单中点击 Script-Fu、Misc、Sphere 选项。


    这两个页面上的截图显示了 SuSE Linux 发行版中的 GIMP，它们识别了 SuSE 装饰的默认样式。


    ![](img/79c73558c68d3c5f59b51559717db1f4_135_0.png)


    许多脚本最初显示一个对话框，你可以在其中指定文本、字体、大小、背景和前景颜色等参数。Sphere 脚本启动一个对话框，你可以在其中指定球的大小、光源方向、是否包含阴影以及背景区域的单独颜色。


    按下 About（关于）键显示脚本描述以及关于该脚本版权和作者的详细信息。


    ![](img/79c73558c68d3c5f59b51559717db1f4_136_0.png)


    当你对选择满意时，点击 OK 按钮运行脚本。在这种情况下，球体对象将在新的图像窗口中创建——带有你指定的特征。


    上下文菜单上的脚本项与 Xtrs 子菜单下的项相同。通常，它们在当前图像窗口上操作——而其他则在新的图像窗口中创建。


    ![](img/79c73558c68d3c5f59b51559717db1f4_136_1.png)


    可以从互联网下载更多免费脚本并添加到 GIMP 中提供更多功能——尝试搜索“Script-Fu”或访问 www.gimp.org。


    GIMP 脚本通常位于 `/usr/share/gimp/x.x/scripts`（其中 x.x 代表你系统上的 GIMP 版本号）。将新脚本复制到相同目录，然后点击
    X、Script-Fu、Refresh 菜单——新脚本现在应该可以在 GIMP 的某个 Script-Fu 菜单中使用了。


    ## 创建图形


    ## 编写你自己的


    （由于许多脚本最初显示一个对话框，你可以在其中指定文本、字体、大小、背景和前景颜色等参数。Sphere 脚本启动一个对话框，你可以在其中指定球的大小、光源方向、是否包含阴影以及背景区域的单独颜色。）


