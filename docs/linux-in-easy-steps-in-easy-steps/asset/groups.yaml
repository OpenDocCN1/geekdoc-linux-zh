    ## Evaluating hardware suitability


    Before installing Linux on a computer it is necessary to evaluate its hardware
    specifications for suitability. The table below suggests minimum specifications
    for processor, memory and hard disk (HD) drive.


    | Hardware item | Suggested minimum |

    |---|---|

    | CPU speed | 300Mhz minimum (1.0Ghz + is better) |

    | Memory size | 128Mb minimum (256Mb + is better) |

    | HD drive capacity | 5Gb minimum (10Gb + is better) |


    Linux can be installed on systems that fall below these suggested levels but performance
    may be impaired.


    The CPU and memory details are also usually displayed by the BIOS when the computer
    boots up.


    It''s easy to discover the CPU and memory information if Windows is already installed
    on the computer – right-click on the My icon then select Properties to open the
    System Properties dialog box. The details are displayed under the General tab,
    as illustrated below.


    ![](img/79c73558c68d3c5f59b51559717db1f4_13_0.png)


    To discover the available HD drive capacity in Windows, click on the My Computer
    icon then right-click on the HD drive icon and select Properties to open the Local
    Disk Properties box. Drive capacity information is displayed under the General
    tab. On the HD drive illustrated below 5Gb of the free space could be given to
    Linux.


    > Devoting 5Gb to Linux on the drive here will not leave much space for further
    work in Windows.


    ![](img/79c73558c68d3c5f59b51559717db1f4_14_0.png)


    Consideration should also be given to the hardware used to connect to the Internet.
    Connection via a PCI ethernet controller, motherboard ethernet controller, is
    very well supported in Linux and virtually all hardware of this type is suitable.


    Unfortunately modems are rather more problematic. Many computers are supplied
    with an internal PCI modem that will only work with Windows software. These so-called
    “winmodems” are unsuitable for connecting to the Internet in Linux. If you have
    an internal modem and find it is unusable in Linux you will probably replace it
    with different hardware before you can connect to the Internet. Usually the easiest
    solution is to connect an external modem via a traditional RS232 serial port.


    ## 1. Introducing Linux


    ## Making space for Linux


    An operating system is installed on a defined area of the HD drive called a “partition”.
    When Windows is the only operating system installed on the computer the partition
    will normally occupy the entire HD drive. In order to install Linux in this situation
    there are three possible options:


    - The first option is to delete the partition where Windows is installed and replace
    it with Linux partition(s) that occupy the entire drive. This option will delete
    the Windows operating system along with all the applications and data files that
    were installed there. It creates a dedicated Linux computer which will immediately
    start Linux whenever the PC gets switched.

    - The second option is to reduce the size of the Windows partition, so that it
    no longer occupies the entire drive, then create Linux partition(s) in the resulting
    free space. This option should retain the Windows operating system, applications
    and data files if the Windows partition is not reduced beyond the size they currently
    occupies. It creates a “dual-boot” computer that allows the user to choose from
    a menu to start Linux or Windows whenever the PC gets switched.

    - The third option is to add a second HD drive to the system. This allows Linux
    partition(s) to occupy the entire second drive and retains the Windows operating
    system, applications and data files on the first drive. It too creates a “dual-boot”
    computer that allows the user to choose from a menu to start Linux or Windows
    whenever the PC gets switched.


    ![](img/79c73558c68d3c5f59b51559717db1f4_15_0.png)


    The option to install an additional HD drive for Linux is a popular choice for
    many people as they have often upgraded their original HD drive to a larger one,
    and so have their original drive spare. It also has benefits over the other options:


    - The free space on the Windows drive is not reduced

    - It removes the threat of data loss through partition resizing

    - The familiar Windows operating system is retained

    - It distinctly separates the two operating systems

    - Drive failure would only disrupt one operating system


    ## Adding a second HD drive


    Most modern PCs can accommodate up to four EIDE (Enhanced Integrated Device Electronics)
    devices, such as HD drives and CD/DVD drives, but typically ship with just two
    – one HD drive and one CD drive. This means that one or two more drives can be
    added simply by plugging into the existing system.


    The first HD drive in a system is known as the “master” HD drive and a second
    HD drive is called the “slave” HD drive.


    A “jumper” connects two tiny pins to determine if the drive should be regarded
    as a master (MA) drive or slave (SL) drive. The top of each HD drive usually has
    a diagram depicting which pins need to be connected in each case.


    Before installing a second HD drive first ensure that the jumper on the original
    drive is set to master and the wide data cable is connected to the drive by its
    end plug – not the plug part away along the cable. Now set the jumper on the second
    drive to slave and connect the data cable using the plug part away along the cable.


    ![](img/79c73558c68d3c5f59b51559717db1f4_16_0.png)


    > HOT TIP If you are not comfortable working inside your PC case a computer shop
    should be pleased to undertake the fitting of a second drive for a modest fee.


    ![](img/79c73558c68d3c5f59b51559717db1f4_16_1.png)


    Connect the power cables and start up the PC – both HD drives should now be detected.
    If the second drive is not detected you will have to change the BIOS settings
    to auto-seek it when booting.


    ## Preparing to install Linux


    If you choose to install Linux on the same HD drive as Windows, it''s a good idea
    to clean up the disk before starting the installation.


    In Windows XP, click on the My Computer icon then right-click on the HD drive
    and select Properties to open the Local Disk Properties dialog.


    ![](img/79c73558c68d3c5f59b51559717db1f4_17_0.png)


    This procedure is not required if Linux is to replace Windows. On the HD drive
    illustrated below 5Gb of the free space could be given to Linux.


    > Devoting 5Gb to Linux on the drive here will not leave much space for further
    work in Windows.


    ![](img/79c73558c68d3c5f59b51559717db1f4_14_0.png)


    This procedure is not required if Linux is to replace Windows. In Windows XP,
    click on the My Computer icon then right-click on the HD drive and select Properties
    to open the Local Disk Properties dialog.


    ![](img/79c73558c68d3c5f59b51559717db1f4_17_0.png)


