    track display）按钮打开标签页窗口。


    ![](img/79c73558c68d3c5f59b51559717db1f4_148_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_148_1.png)


    点击“刻录”（Rip）列以选择单个曲目，或点击“刻录”头部以选择所有曲目。


    ![](img/79c73558c68d3c5f59b51559717db1f4_148_2.png)


    | 曲目 | 长度 | 刻录 |

    |---|---|---|

