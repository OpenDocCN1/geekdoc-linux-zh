    # Creating drive partitions


    If you are installing Linux on the slave HD labelled hdb click on that drive''s
    tab to display its partition information. In the illustration below the slave
    drive is completely empty so it is ready to be partitioned for Linux.


    ![](img/79c73558c68d3c5f59b51559717db1f4_25_0.png)


    You can click the Help button at any time to discover more about each step.


    Linux requires that the space allocated to it is split into three distinct partitions
    - one for the applications and operating system files, one for your own files
    and a swap area. The easiest way to create these is to use the installer''s Auto
    Allocate to split the empty space into three suitably proportioned partitions.


    First click on the bar representing the empty area - this could be that of the
    hdb drive illustrated above or the empty area created on the hda drive after resizingWindows
    if you are using a single drive. Then click on the Auto Allocate button to see
    the partitions.


    The root partition for the system is labelled /, the partition for your own files
    is labelled /home and the swap partition is labelled swap. The 9.5Gb empty space
    shown above gets split into a 5.5Gb /root partition, a 3.5Gb/home partition and
    a 500Mb swap partition.


    Expert Mode allows fine tuning of the partition sizes if desired.'
