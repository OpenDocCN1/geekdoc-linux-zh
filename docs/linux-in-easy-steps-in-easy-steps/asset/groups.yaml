    7. Handling files | 103


    ## Accessing files in Windows


    On dual-boot systems the Windows partition may be mounted in Linux to allow a
    degree of access to the files stored there. This process is similar to the way
    that peripheral devices are mounted - allowing access to files on portable media,
    such as CD-ROMs.


    User-friendly Linux distros, such as Mandrake Linux, automatically mount the Windows
    partition for you. This means you can easily access the files in Windows from
    the /mnt/windows directory in Linux.


    This example shows one of the sample images supplied with Photoshop (on the Windows
    partition) being readily accessed from Linux.


    ![](img/79c73558c68d3c5f59b51559717db1f4_105_0.png)


    104 | Linux in easy steps


    # ...cont''d


    Older Windows 9.x operating systems use the FAT or FAT32 system which Linux can
    both read from, and write to. Modern Windows platforms, such as XP, use the NTFS
    file system which can be less simple – some Linux distros do not support NTFS
    so cannot access the Windows partition at all. Other dist, such as Mandrake Linux,
    may be able to read from NTFS but not write to – check your documentation to see
    if it supports NTFS.


    ![](img/79c73558c68d3c5f59b51559717db1f4_106_0.png)


    Where Linux cannot directly write to the Windows partition you can copy files
    into Linux for modification save them on portable media, such as a CD-ROM or floppy
    disk – boot Windows and copy the modified files back in.


    If your Linux distro does not automatically mount the Windows partition, may need
    to do so manually. First determine the physical location of the Windows partition
    – if it''s at the start of the first HD drive it will probably be /dev/hda1. Use
    the Control Center to find the location – for instance, in RedHat Linux Browser
    and select Hard Drives.


    At a command prompt type su, then enter the root password to login to the root
    account. Now create a directory in which the Windows partition can be mounted
    using this command


    ```bash

    mkdir /mnt/windows

    ```


    To mount the Windows partition in this new directory, the following command (where
    /dev/hda1 is the Windows partition):


    ```bash

    mount -t vfat /dev/hda1 /mnt/windows

    ```


    Type exit to logout of the root account and access your Windows by changing into
    the mounted Windows partition:


    ```bash

    cd /mnt/windows

    ```


    ![](img/79c73558c68d3c5f59b51559717db1f4_106_1.png)


    You will need to modify the fstab file to automatically mount the Windows partition
    whenever Linux boots. This reflects the location of the Windows partition /hda1.


    ```text

    /dev/hda1 /mnt/windows vfat 0 0

    ```


