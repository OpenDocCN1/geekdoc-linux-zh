    \ can be stored in a script variable using the read command.\n\nThe \"input\"\
    \ script below stores two argument values, reads text input by the user. It displays\
    \ the input and stored values, writes them to a text file named input.txt in the\
    \ working directory.\n\n```bash\n#!/bin/bash\necho -n \"Enter some text: \" #\
    \ write to standard output\nread text\necho \"$1 $2\" # receive text input\necho\
    \ \"$1 $2\" > input.txt # write to standard output\ncat \"input\"\n```\n\nUse\
    \ the pwd command to discover the current working directory.\n\n![](img/79c73558c68d3c5f59b51559717db1f4_173_0.png)\n\
    \n```bash\n[mike]$ input easy steps\nEnter some text: Linux in\nLinux in easy\
    \ steps\n[mike]$ \n```\n\nShell scripting is a powerful feature in Linux and the\
    \ examples in this chapter serve only as an introduction to some of its possibilities.\
    \ Further advice can be found on the Internet - try typing \"bash programming\"\
    \ into a search engine.\n\n172 | Linux in easy steps\n\n# Extending your Linux\
