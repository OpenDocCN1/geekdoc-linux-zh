    # Extending your Linux system


    This chapter illustrates how to install and remove applications on a Linux system
    – both from the distro CD and via the Internet. It also demonstrates how to install
    other desktop environments and how to switch to them from the familiar KDE desktop.
    A number of resources are provided where you can find the latest news about Linux
    development, together with useful tips and advice.


    # Covers


    +   - Installing packages | 174

    - Removing packages | 176

    - Downloading packages | 178

    - Installing downloads | 180

    - Installing other desktops | 182

    - Switching between desktops | 184

    - Linux resources | 186


