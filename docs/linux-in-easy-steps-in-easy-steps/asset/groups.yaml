    # Storing email addresses


    The Mozilla Address Book allows you to store the email addresses and personal
    details of your contacts on individual ''cards''.


    An email address can be added to a new card from the Inbox folder by right-clicking
    on the sender''s address and adding To Address Book from the context menu that
    appears.


    ![](img/79c73558c68d3c5f59b51559717db1f4_73_0.png)


    You can configure Mozilla to automatically add email addresses of outgoing to
    the Address Book. First select the Preferences option on the Edit menu then expand
    the Mail Newsgroups menu. Click on the box in the Email Address Collection panel.
    Click the OK button to apply the change.


    ![](img/79c73558c68d3c5f59b51559717db1f4_73_1.png)


    The Address Book can be opened by clicking the Address Book button on the Mozilla
    component bar, or by selecting the Address Book from the Window menu, or typically
    navigating through Start, Networking, Mail, Mozilla Address Book.


