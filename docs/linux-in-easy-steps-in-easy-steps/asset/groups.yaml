    # ...cont''d


    Checking each box on this page selects a group of packages to be installed. Experienced
    users can optionally check the box to allow Individual Package Selection to further
    refine what to install.


    Click on the Next button to install the packages onto your computer. This can
    take 30 - 60 minutes, depending on the number of packages selected and the speed
    of your system.


    Click the Details button to reveal the names of the packages as they are installed.


    ![](img/79c73558c68d3c5f59b51559717db1f4_28_0.png)


    During installation a slideshow presents various information about your Linux
    distribution and the installer calculates the duration until completion.


    Depending upon which packages you selected for the installer it may ask you to
    insert other CD-ROMs from the Linux distribution set. Do so when requested and
    click on the OK button to proceed.


    After the final package has been installed the installer automatically implements
    Post-Install Configuration of the packages before moving on to the next step.


    ## Setting the root password


    Each Linux system has a system administrator account named “root” that has greater
    access privileges than regular user accounts. For security reasons system configuration
    can only be implemented by root – regular users cannot make these changes. You
    should only use the root account for such purposes and normally work in Linux
    as a regular user.


    After installing packages the Linux installer asks you to create a password for
    the root account.


    In a network environment it is essential to create a lengthy alpha-numeric password
    to ensure that the root account cannot be easily accessed.


    The home-user may prefer the option to have No Password to avoid the need to enter
    a password whenever they want to work as root. This can arise more often than
    you might imagine.


    ![](img/79c73558c68d3c5f59b51559717db1f4_29_0.png)


    If setting a password avoid easily guessed passwords like "admin".


    ![](img/79c73558c68d3c5f59b51559717db1f4_29_1.png)


    Click No Password to proceed or, if you prefer to have a root password, enter
    your password in both input fields and then click on the Next button to proceed.


    28 | Linux in easy steps


    ## Creating a user account


    The next step of the Linux installation requires at least one user account to
    be created. For the home-user this will normally be the account they will use
    to logon to Linux for everyday use.


    Enter your actual name in the first field and a short username in the second field.
    Now enter a password in both input fields.


    Optionally you can also click on the displayed icon to select a custom user account.


    A password is mandatory. Make a note of the exact username and password – you
    will need these later.


    ![](img/79c73558c68d3c5f59b51559717db1f4_30_0.png)


    Linux is case-sensitive so take care with uppercase and lowercase characters –
    “Mike” will be regarded as a different user to the one named “mike” here.


    Click the OK button to create a user account for each person that will use your
    computer. When all user accounts have been created click the Next button to proceed.


    29 | Installing Linux


    ## Setting automatic login


    The Linux installer offers you the chance to select one user account for automatic
    login whenever Linux is started. For the home-user this avoids the tedious procedure
    of entering a username and password each time you start Linux.


    This feature should not really be used in an office environment or where the computer
    has multiple user accounts.


    ![](img/79c73558c68d3c5f59b51559717db1f4_31_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_31_1.png)


    The example above elects to automatically login the user account that has been
    created. Where multiple user accounts have been created a selection box also appears
    on this page which allows you to choose the account to login.


    If you prefer not to use automatic login the boot process will ask you to enter
    a username and password to login to Linux. To launch the graphical desktop you
    type the command startx then hit the Return key.


    Click on the Next button to proceed to the bootloader installation.


    ## Installing the bootloader


    The Linux installer will normally install the bootloader on the main HD drive
    where it finds Windows boot instructions in the Master Boot Record (MBR) on that
    drive.


    If the installer asks you to choose where to install the bootloader you should
    select the option to install it in the MBR if you wish to run a dual-boot system.
    This will present you with an option menu whenever the computer boots allowing
    you to select Windows or Linux, etc.


    ![](img/79c73558c68d3c5f59b51559717db1f4_32_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_32_1.png)


    Installing the bootloader onto a floppy disk will allow Linux to be started from
    the floppy drive when the BIOS setup seeks boot instructions from that drive before
    the HD drive.


    The other options should normally be avoided as they may prevent you from starting
    Linux on your computer.


    Click on the Next button to install the bootloader at the chosen location and
    the Linux installer presents a summary of the installation.


    ## Summarizing the installation


    Each item on the summary page has an associated button to bring up a sub-menu
    where each device may be configured. This can be done later though is demonstrated
    step by step in the next chapter. For now, just click on the Next button to proceed
    to the end of the installation.


    Some of the devices listed here, such as the printer, have only been detected
    by the Linux installer and must be configured before they work correctly – see
    chapter 3.


    ![](img/79c73558c68d3c5f59b51559717db1f4_33_0.png)


    | System | |

    | :--- | :--- |

    | Keyboard - US keyboard | Configure |

    | Country - United States | Configure |

    | Timezone - America/New_York | Configure |

    | Mouse - PS/2 / Generic PS2 Wheel Mouse | Configure |

    | Hardware | |

    | Printer - BROTHER HL-1030 | Configure |

    | Sound card - Silicon Integrated Systems [SIS]/7018 PCI Audio | Configure |

    | Graphical Interface - 800x240 bpp | Configure |

    | Network & Internet | |

    | Network - Lan | Configure |

    | Security | |

    | Security Level - Standard | Configure |

    | Boot | |

    | Bootloader - Illogic on /dev/hda | Configure |


    The example above elects to automatically login the user account that has been
    created. Where multiple user accounts have been created a selection box also appears
    on this page which allows you to choose the account to login.

