    # cont''d


    You may prefer not to use the command line, but it''s sometimes very useful—in
    fact, its power can be addictive!


    FTP file transfers can also be implemented from a command prompt in a console
    or shell window.


    Type ftp to a prompt to launch the FTP program – the prompt changes to ftp>. There
    are many ftp commands – refer to the ftp manual page for a full list. See the
    Getting Help topic on page 64.


    Once you are logged in, type the ls command to list the files and directories
    on the server. You can navigate through them using the cd command to change directory.
    When you locate a file you wish to download use the get command, followed by a
    space and the file name, to copy the file to your computer.


    The screenshot below illustrates how to login to the Opera web site from a command
    prompt. The welcome message is downloaded. Then, the more command is used to exit
    its contents. Finally, the bye command exits the FTP program.


    The password has been entered but does not display on the screen for security
    reasons.


