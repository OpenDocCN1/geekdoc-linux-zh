    If you have Linux to start with a default user automatically logged in, the configuration
    settings should look like the illustration below.


    ![](img/79c73558c68d3c5f59b51559717db1f4_36_0.png)


    Uncheck the box in the System Mode panel marked "Launch the graphical environment
