    ## Getting better compression


    Many Linux distros include an alternative to the GZip compression tool called
    Bzip2. This can produce smaller tarball files because it uses better compression
    techniques.


    Right-click on a directory to archive and compress, then select the Bzip2 option
    from the context menu – shown on page 106. The tarball is created in the current
    directory with the directory name and an added file extension of `tar.bz2`.


    In the screenshot below tarballs have been created of the /imgs directory using
    GZip and Bzip2. The original directory size of 4.6MB is compressed to 3.6MB by
    GZip to be.


    Although Bzip2 enjoys widespread support it is not as ubiquitous as the regular
    ZIP format – most tarballs for download are still GZipped archives.


    ![](img/79c73558c68d3c5f59b51559717db1f4_109_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_109_1.png)


    The Bzip2 program can also be used at the command line to compress an individual
    file or archive. For example, the command `bzip2 images.tar` compresses a archive
    to produce a tarball named `images.tar.bz2`. Similarly, a uncompressed file can
    be expanded with the `bunzip2` command – `bunzip2 images.tar.gz` reduces the tarball
    to a tar archive.


    ## Working in a Linux office suite


    This chapter describes the features of the free OpenOffice suite that is widely
    used in Linux. It examines how this open-source application fares against the
    market-leading Microsoft Office product and illustrates some additional benefits
    of OpenOffice.


    ## Covers


    - Introducing the OpenOffice suite | 110

    - Documents in OpenOffice Writer | 111

    - Exporting documents from OpenOffice | 112

    - Spreadsheets in OpenOffice Calc | 114

    - Presentations in OpenOffice Impress | 116

    - Charts and graphs in OpenOffice Draw | 118

    - Formulas in OpenOffice Math | 120


    Chapter Eight


    ## Introducing the OpenOffice suite


    The OpenOffice suite is an application containing a set of office tools similar
    to those in Microsoft Office. It is based on original code from the StarOffice
    application by Sun MicroSystems. They made the code freely available for development
    by the open-source community so OpenOffice has no proprietary ties. The splash
    screen that displays when OpenOffice is launched does, acknowledge this heritage.


    OpenOffice is included with most Linux distros. It can also be freely downloaded
    from www.openoffice.org - clear installation instructions provided on the website
    too.


    ![](img/79c73558c68d3c5f59b51559717db1f4_111_0.png)


    There are versions of OpenOffice available for many platforms, including Linux,
    Mac OS X and Windows.


    OpenOffice comprises word processor (“Writer”), spreadsheet (“Calc”), and presentation
    (“Impress”) programs that are similar to the Word, Excel and PowerPoint programs
    in MS Office. It also has a program, to create charts, graphs and diagrams (“Draw”),
    and a specialized tool for formatting mathematical formulas (“Math”). If you are
    familiar with MS Office you will feel instantly at home with the OpenOffice equivalents.


    Most importantly, OpenOffice contains files that allow it to work with standard
    MS Office documents from Word, Excel and PowerPoint. Files can be saved in MS
    Office file formats, as well as native to OpenOffice.


    It can embed objects (OLE objects, plugins, video, applets, charts) within a document
    – but using these advanced features may create issues when trying to share the
    document with another office suite. For instance, an OpenOffice document containing
    an embedded spreadsheet works in OpenOffice, but the spreadsheet may not be displayed
    when that document is viewed in MS Word.


    ## Documents in OpenOffice Writer


    Launch OpenOffice then click the New menu to be presented with a sub-menu of possible
    document types – for regular word processing choose the Text Document option.
    A new blank document then appears where you can position the cursor and begin
    typing text content.


    You can modify the appearance of selected text using the options on the Object
    Bar to change the font, size, style, decoration, weight, alignment, color and
    background color. Automatic numbering or bullets may also be added to list items.


    The Insert menu has options to add graphics, hyperlinks, tables and OLE objects
    into the document.


    ![](img/79c73558c68d3c5f59b51559717db1f4_112_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_112_1.png)


    Function Bar


    Object Bar


    Main Toolbar


    ## JavaScript in easy steps


    You can create interactive web pages by adding JavaScript functionality to your
    web site. An easy way to begin is to follow the examples in "JavaScript in easy
    steps". It has separate chapters on all major features of the JavaScript language
    with code examples screenshots that illustrate each aspect.


    Click on the File, Save menu to save the document at a suitable location in your
    home directory. This will open the Save As dialog where you can enter a file name
    – by default the document will be saved in the OpenOffice native format with a
    .sxw extension.


    ![](img/79c73558c68d3c5f59b51559717db1f4_112_2.png)


    8. Working in a Linux office suite | ||


    ## Exporting documents from OpenOffice


    In order to save a document for use in MS Office choose the File, Save As menu
    in OpenOffice, then select the .doc file in the Save As dialog.


    The screenshots below show the document from the previous page being saved to
    a floppy disk for use in MS Office. When this opened in MS Word the text content
    and graphic are preserved but the text appears in Word''s default "Times New Roman"
    font.


    ![](img/79c73558c68d3c5f59b51559717db1f4_113_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_113_1.png)


    112 | Linux in easy steps


    ## ...const''d


    One real bonus in OpenOffice is the built-in support for the Portable Document
    Format. This allows you to create read-only versions of your documents in the
    popular PDF format without any additional costly software. The PDF format maintains
    the style and content of the original document in a very compact file that can
    be easily transferred around networks and the Internet.


    To export a PDF of your document from OpenOffice click the File, Export AS PDF
    menu – or click the "Export Directly As PDF" on the Function Bar. Either will
    open the Export dialog (similar to the Save As dialog shown) where you can choose
    a file name and location for the PDF file.


    For instance, exporting a PDF version of the original document shown on page 111
    to a floppy disk creates a file there with the .pdf extension. The screenshot
    below illustrates that file opened on a Windows platform in the Internet Explorer
    browser – using the Adobe Reader plugin. Notice that the text closely maintains
    the appearance of the original.


    ![](img/79c73558c68d3c5f59b51559717db1f4_114_0.png)


    | | Monday | Tuesday | Wednesday | Thursday | Friday | Total |

    |---|---|---|---|---|---|---|

    | 1 | | Andrew''s Lunch Costs | | | | |

    | 2 | Week 1 | $2.70 | $2.90 | $2.50 | $2.65 | $2.80 |

    | 3 | Week 2 | $2.75 | $2.20 | $2.40 | $2.60 | $2.80 |

    | 4 | Week 3 | $2.70 | $2.75 | $2.70 | $2.25 | $2.56 |

    | 5 | Week 4 | $2.70 | $2.70 | | $2.70 | $2.20 |

    | 6 | total | | | | | | |

    | 7 | Average | | | | | | |


    ![](img/79c73558c68d3c5f59b51559717db1f4_114_1.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_114_2.png)


    The OpenOffice filters allows documents to be saved in many formats including
    HTML – creates copies of that style.


    ## JavaScript in steps


    You can create interactive web pages by adding JavaScript functionality to your
    web site. An easy way to begin is to follow the examples in "JavaScript in easy
    steps". It has separate chapters on all major features of the JavaScript language
    with code examples screenshots that illustrate each aspect.


    ![](img/79c73558c68d3c5f59b51559717db1f4_114_3.png)


    8. Working in a Linux office suite | 113


    ## Spreadsheets in OpenOffice Calc


    Launch OpenOffice then click the New menu to be presented with a sub-menu of possible
    document types – for regular word processing choose the Spreadsheet option. A
    new blank spreadsheet comprising rows and columns appears where you can position
    the cursor and begin typing content.


    You can modify the appearance of selected text using the options on the Object
    Bar to change the font, size, style, decoration, weight, alignment, color and
    background color. Automatic numbering or bullets may also be added to list items.


    The Insert menu has options to add graphics, hyperlinks, tables and OLE objects
    into the document.


    ![](img/79c73558c68d3c5f59b51559717db1f4_115_0.png)


    To quickly see the total of all values in a column or row click on the gray heading
    letter, or gray row number, and its sum instantly appears in the status bar as
    "Sum =". The power of spreadsheets lies in their calculations on their data entries
    using given formulas. For instance, to total the expenditure for Week 1 in the
    above example click in the Total cell on that row, then type = the symbol appears
    in that cell and also in the input field on the Formula Bar. Add the formula,
    in either cell or the input field. In this case it is the sum of the cells each
    day on the Week 1 row – so you type B5+C5+D5+E5+F5. Hit the Return key to apply
    the formula and sum total value appears in the Total cell.

