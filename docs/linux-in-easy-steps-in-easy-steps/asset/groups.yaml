- md: "\n# Looping a script\n\nA script can be made to repeatedly execute commands\
    \ for every item in a list with a for-in loop statement. Typically this specifies\
    \ a variable that references successive items in each iteration of the loop –\
    \ the first item on the first iteration, the second item on the second iteration,\
    \ and so on. Its syntax is:\n\nSupply of a list of names to a for-in loop to have\
    \ the same command actions performed on each file.\n\n![](img/79c73558c68d3c5f59b51559717db1f4_171_0.png)\n\
    \n```\nfor var in item-1 item-2 item-3\ndone\n    action/s\n```\n\nThe traditional\
    \ for loop, from the C language, can also be used to repeatedly execute commands\
    \ in a shell script. This typically has a counter variable, traditionally named\
    \ i, that counts until it reaches a specified value. It is assigned an initial\
    \ value in the for statement which also includes the terminal value, as a test\
    \ expression, and a means to change the counter on each iteration – usually is\
    \ incremented on each iteration. This loop's syntax is:\n\n```\nfor(( initializer;\
    \ test-expression; change ))\ndone\n    action/s\n```\n\nBoth types of for loops\
    \ feature in the example script shown below.\n\n![](img/79c73558c68d3c5f59b51559717db1f4_171_1.png)\n\
    \nThe ++ increment operator increases the current value by one (i++ is i+1). Similarly,\
    \ the -- decrement operator reduces the current value by one (-- is i-1).\n\n\
    ![](img/79c73558c68d3c5f59b51559717db1f4_171_2.png)\n\n170 | Linux in easy steps\n\
    \n# ...cont'd\n\n```\nSession Edit View Bookmarks Settings Help\n[mike]$ loop\n\
    Number one\nNumber two\nNumber three\nNumber 1\nNumber 2\nNumber 3\n[mike]$\n\
    ```\n\n![](img/79c73558c68d3c5f59b51559717db1f4_172_0.png)\n\nAn infinite loop\
    \ will never end—but the job can be manually stopped using the Ctrl+Z combination.\
    \ An alternative loop format can be written using the while keyword. This typically\
    \ requires a counter variable to be assigned an initial value which is used in\
    \ the test expression on the first iteration of the loop. When this is found to\
    \ be the true loop executes its command actions—these should include a statement\
    \ to change the value of the counter, otherwise an infinite loop may be created.\n\
    \n```\nSession Edit View Bookmarks Settings Help\n#!/bin/bash\n\n# a script to\
    \ demonstrate a C-style while loop\ni=1 # initialize the counter\nwhile (( i <\
    \ 4 )) # test expression\n\t\techo \"This is line $i\" # write the current count\n\
    \t\t((i++)) # increment counter\ndone\n```\n\n\"while-loop\" 12L, 232C\n\n```\n\
    \nbash\nSession Edit View Bookmarks Settings Help\n[mike]$ chmod 700 while-loop\n\
    [mike]$ while-loop\nThis is line 1\nThis is line 2\nThis is line 3\n[mike]$\n\
    ```\n\n12. Scripting for the shell | 171\n\n# Handling input values\n\nArguments\
    \ added after a script name at prompt are automatically stored in sequentially\
    \ numbered variables -- the first argument can be referenced in the script as\
