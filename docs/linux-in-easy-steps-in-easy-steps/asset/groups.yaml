  - '[PAGE 163]


    # Using shell commands


    Shell scripts allow a number of specified shell commands to be executed in sequence
    by simply typing the script name at a shell prompt – effectively making the script
    name a custom command.


    Before starting out with scripting it''s useful to explore, at a prompt, some
    of the commands most used in shell scripts.


    The **echo** command can be found in nearly all shell scripts because it writes
    output information. It takes a string of text as its argument, enclosed within
    a pair of double quotes. For instance, type echo **"Hello World"** at a prompt,
    then hit the Return key. The shell writes out the text string and, by default,
    adds an invisible newline character to move the print head to the next line –
    where a new prompt appears. If the newline feature is not desirable you can use
    the **-n** option to prevent its inclusion, so the command becomes **echo -n "Hello
    World"**.


    Another useful option for the **echo** command is allows you to perform simple
    formatting using "escape" sequences. These all begin with a \ backslash. The most
    frequently used escape sequences are \n (add a newline) and \t (add a tab) – both
    are used in the screenshot below demonstrating the **echo** command and its options.


    ![](img/79c73558c68d3c5f59b51559717db1f4_163_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_163_1.png)


    The **clear** command can be used at any time to remove previous content – leaving
    the cursor at a crisp new prompt at the top of the shell display.'
  - '[PAGE 164]


    # cont''d


    The expr command provides the ability to evaluate arithmetic expressions at a
    shell prompt. It uses the usual operators to add +, subtract, /, multiply *, and
    modulus % but it only recognizes integer values - it does not work with floating-point
    numbers.


    Attempting to evaluate an expression that contains floating-point numbers


    Each value is supplied as a separate argument to the expr command so they must
    have a space before and after. Parentheses can be used to clarify the meaning
    of the expression, the order in which it should be evaluated – the arithmetic
    is performed within the parentheses first, then outside later.


    ![](img/79c73558c68d3c5f59b51559717db1f4_164_0.png)


    In comparisons the expr command returns 1 where the expression is found to be
    true, or zero if the expression is found to be false. It supports the usual operators
    to test expressions for equality ==, inequality !=, greater-than > and less-than
    < values.


    To avoid an interpreter error it is important to surround each multiplication
    * asterisk character, greater-than > character, less-than < character, and parenthesis
    character, with quotes.


    The results of evaluating some expressions with the expr command can be seen in
    the screenshot below – see how the result of the multiplication examples after
    parentheses are added.


    The expr command also be used for boolean arithmetic matching – see the expr man
    pages for details.


    ![](img/79c73558c68d3c5f59b51559717db1f4_164_1.png)


    ```

    [mike]$ expr 21 + 7

    28

    [mike]$ expr 21 / 7

    3

    [mike]$ expr 5 "* = 6 - 3

    27

    [mike]$ expr 5 "* = \(6 - 3)"

    15

    [mike]$ expr 25 % 7

    4

    [mike]$ expr 8 == 8

    1

    [mike]$ expr 9 ">" = 4

    0

    [mike]$ expr 9 "< = 4

    0

    [mike]$ ]

    ```


