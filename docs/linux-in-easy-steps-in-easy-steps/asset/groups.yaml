    \ KMidi 菜单中选择不同的选项来改变文件声音效果的多个方面。\n\n注意每个轨道都引用了一个“patch（音色/区块）”——这是由每个乐器创建的采样样本。音色信息存储在位于\
    \ `/usr/share/apps/midi/config` 目录下的文件中。可以下载比原始集合更全面的音色包——请参考“帮助（Help）”菜单下的 KMidi\
    \ 手册，或使用搜索引擎获取有关如何执行此操作的信息。\n\n![](img/79c73558c68d3c5f59b51559717db1f4_140_1.png)\n\
    \n10. 播放声音和视频 | 139\n\n# 播放录制的声音\n\n声音可以以数字音频波形数据的形式录制在 WAV 文件中。这种流行格式支持多种位深、采样率和多个音频通道。\n\
    \n另一种存储波形数据的流行格式是 AIFF 格式，由 Apple 开发，是 Macintosh 电脑的标准。WAV 和 AIFF 都不支持数据压缩，虽然它们能准确记录声音数据，但体积会非常臃肿。\n\
    \n> “Noatun 并不是一个缩写——它仅仅是一个源自北欧神话的名字。”\n\n在 Linux 中，WAV 和 AIFF 声音可以通过一个名为 Noatun\
    \ 的 KDE 来播放——这是一个为 aRTs（模拟实时合成器）音效设计的精细的前端界面。\n\nNoatun 的默认界面是一个简单的对话框，其“打开（Open）”菜单允许你浏览声音文件——点击箭头“播放（Play）”按钮即可听到声音。\n\
    \n![](img/79c73558c68d3c5f59b51559717db1f4_141_0.png)\n\n简单的默认 Noatun 界面可以通过包含的“皮肤（skins）”之一变得更加有趣。点击“设置（Settings）”菜单，然后选择“配置\
    \ Noatun（Configure Noatun）”选项打开“首选项（Preferences）”对话框。\n\n> 确保在点击“应用”之前只勾选了一个界面——否则会出现两个\
    \ Noatun。\n\n在左侧面板中选择“插件（Plugins）”选项可以在右侧面板显示多种界面选项。默认界面“Excellent”最初会被勾选。勾选另一个，然后点击“应用（Apply）”按钮即可更改\
    \ Noatun 的外观。\n\n当应用 K-Jofol 皮肤后，左侧面板会添加一个“K-Jofol Skins”选项。点击此选项可以在右侧面板显示“皮肤选择器（Skin\
    \ Selector）”——这里有很多选择，并且可以从此对话框安装更多皮肤。\n\n额外的皮肤可以从网上下载——尝试 KDE-Look.org。\n\n![](img/79c73558c68d3c5f59b51559717db1f4_142_0.png)\n\
    \nNoatun 可以处理播放列表，并旨在作为一个多媒体播放器，类似于 Windows Media Player。然而，已经开发了专门的 Linux 应用程序能够更高效地处理音乐和视频压缩媒体文件的播放——接下来的几页将展示这些良好的示例。\n\
    \n# 听音乐\n\nWAV 格式可以提供极佳的音质，但其文件并不紧凑——通常每分钟的录制需要 10Mb。这意味着 .wav 文件非常适合短小的音频剪辑，但不适合持续几分钟的音乐。\n\
    \n为了解决这个问题，运动图像专家组（Moving Picture Experts Group）开发了 MPEG 音频层3 格式，它可以显著压缩 WAV 录制——一个\
    \ 80Mb 的文件可以减到 5Mb 左右，且没有明显的质量损失。这些文件具有 .mp3 扩展名，通常用于紧凑地存储音乐轨道。\n\n在 Linux 中，最流行的\
    \ MP3 播放器是 XMultiMedia System (XMMS) 应用。如果你在 Windows 上用过流行的 WinAmp 播放器，你会觉得它很眼熟。\n\
    \n![](img/79c73558c68d3c5f59b51559717db1f4_143_0.png) 你也可以通过右键点击其界面打开 XMMS 菜单。\n\
    \n![](img/79c73558c68d3c5f59b51559717db1f4_143_1.png)\n\n![](img/79c73558c68d3c5f59b51559717db1f4_143_2.png)\
    \ 点击“文件（File）”菜单并浏览一个 Midi 文件，然后点击“播放（Play）”按钮听音乐。你可以在 KMidi 菜单中选择不同的选项来改变文件声音效果的多个方面。\n\
    \n注意每个轨道都引用一个“patch（音色/区块）”——这是由每个乐器创建的采样样本。音色信息存储在位于 `/usr/share/apps/midi/config`\
    \ 目录下的文件中。可以下载比原始集合更全面的音色包——请参考“帮助（Help）”菜单下的 KMidi 手册，或使用搜索引擎获取有关如何执行此操作的信息。\n\
    \n![](img/79c73558c68d3c5f59b51559717db1f4_140_1.png)\n\n10. 播放声音和视频 | 139\n\n\
