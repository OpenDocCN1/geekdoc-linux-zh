    ## Formulas in OpenOffice Math


    The Math application within the OpenOffice suite allows mathematical formulas
    to be inserted into documents in a strictly controlled format. With a document
    open in OpenOffice Writer, click on the Insert, Object, Formula menu to enter
    formula mode – a “command” area appears at the bottom of the window.


    ![](img/79c73558c68d3c5f59b51559717db1f4_121_0.png)


    Right-click on the command area to see the range of predefined formula controls
    on the context menu. Select any one of these, or type directly in the command
    area to build the formula. Click in the main window to close the command area
    and see the formatted formula appear in the document.


    In mode, click on the Tools, Catalog to find a catalog of mathematical symbols
    that can be inserted into a formula. This includes Greek characters and also has
    a “Special” collection where you can add your own symbols.


    Catalog symbols are referenced by prefixing their name with a % character in the
    command code – in the example shown below, e, %x, %B and pi reference Special
    symbols. Notice that expressions are enclosed within curly brackets, while the
    ` tick character and ~


    ![](img/79c73558c68d3c5f59b51559717db1f4_121_1.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_121_2.png)


    20 | Linux in easy steps


    ## Creating graphics


    The most popular graphics manipulation software in Linux is the GNU Image Manipulation
    Program (GIMP) that is bundled with nearly all distributions. This chapter examines
    some of the GIMP''s prominent features and contrasts the application to the market-leading
    Adobe Photoshop program.


    ## Covers


    | Topic | Page |

    | :--- | :--- |

    | Introducing the GIMP | 122 |

    | Starting a new image | 124 |

    | Finding the menus | 125 |

    | Opening selection dialogs | 126 |

    | Working with layers | 128 |

    | Selecting areas | 130 |

    | Using filters | 132 |

    | Running scripts | 134 |

    | Writing your own GIMP scripts | 136 |


    ## Introducing the GIMP


    The GIMP has much of the functionality found in Photoshop. In some areas it even
    has more capacity – but in other areas it has less. Unlike Photoshop, the GIMP
    is open-source software available free of charge under terms of the General Public
    License (GPL).


    ![](img/79c73558c68d3c5f59b51559717db1f4_123_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_123_1.png)


    The results of GIMP plug-ins can be less predictable than those in Photoshop for
    inexperienced users.


    There are over 220 plug-ins in the standard GIMP installation that cover virtually
    all the capabilities of the plug-ins that can be purchased as accessories for
    Photoshop. Many of the GIMP plug-ins are more configurable than in Photoshop,
    which means they can create more powerful effects in the hands of an experienced
    user.


    The GIMP can read image files in the Photoshop .psd file format – so if you have
    a library of files in that format you can use to edit them.


    One major advantage of the GIMP over Photoshop is its scripting ability – in no
    less than four scripting languages. For instance, you can write scripts to create
    custom effects using PERL (Practical Extraction and Reporting Language) scripting
    – the preferred language of CGI scripts. The scripting capability of the GIMP
    is unmatched by Photoshop.


    ## ...cont''d


    The major pitfall of GIMP is its lack of support for CMYK colors or spot colors,
    such as PANTONE – it only supports 8-bit RGB, grayscale and indexed images. The
    GIMP cannot, therefore, compete with Photoshop in the prepress field, but does
    offer some exciting possibilities in the creation of digital images for the web.


    When the GIMP is launched for the first time it installs configuration files –
    just click OK to accept the default selections. The splash screen (opposite) displays
    while the application loads.


    You will notice that the GIMP looks very different from Photoshop. It opens with
    the GIMP toolbox dialog, and usually further dialogs for Tools Options, Layers,
    Channels & Paths, and Brush Selection – like those illustrated below.


    ![](img/79c73558c68d3c5f59b51559717db1f4_124_0.png)


    The icons on the buttons broadly correspond to those in the Photoshop toolbox
    – place the pointer over each icon to see a tooltip describing that button''s
    purpose. Notice that the GIMP tools dialog also has menus.


    ![](img/79c73558c68d3c5f59b51559717db1f4_124_1.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_124_2.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_124_3.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_124_4.png)


    9. Creating graphics | 123


    ### Starting a new image


    The initial appearance of the GIMP generally leads new users to question where
    the menus and working area are – you can only see the File and Edit menus in The
    GIMP toolbox, and these contain very little.


    To access the full GIMP menus a new, or existing, image must first be opened.
    Select File, Open and browse to an existing image file, or click File, New to
    create a new image. In the New dialog set the Size, Type – RGB or Grayscale. Then
    click OK. The GIMP does not support CMYK.


    ![](img/79c73558c68d3c5f59b51559717db1f4_125_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_125_1.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_125_2.png)


