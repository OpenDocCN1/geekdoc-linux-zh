    ...cont’d


    # Adding a second HD drive


    Most modern PCs can accommodate up to four EIDE (Enhanced Integrated Device Electronics)
    devices, such as HD drives and CD /DVD drives, but typically ship with just two
    – one HD drive and one CD drive. This means that one or two more drives can be
    added simply by plugging into the existing system.


    The first HD drive in a system is known as the “master” HD drive and a second
    HD drive is called the “slave” HD drive.


    A “jumper” connects two tiny pins to determine if the drive should be regarded
    as a master (MA) drive or slave (SL) drive. The top of each HD drive usually has
    a diagram depicting which pins need to be connected in each case.


    Before installing a second HD drive first ensure that the jumper on the original
    drive is set to master and the wide data cable is connected to the drive by its
    end plug – not the plug part away along the cable. Now set the jumper on the second
    drive to slave and connect the data cable using the plug part away along the cable.


    ![](img/79c73558c68d3c5f59b51559717db1f4_16_0.png)


    > HOT TIP If you are not comfortable working inside your PC case a computer shop
    should be pleased to undertake the fitting of a second drive for a modest fee.


    ![](img/79c73558c68d3c5f59b51559717db1f4_16_1.png)


    Connect the power cables and start up the PC – both HD drives should now be detected.
    If the second drive is not detected you will have to change the BIOS settings
    to auto-seek it when booting.


