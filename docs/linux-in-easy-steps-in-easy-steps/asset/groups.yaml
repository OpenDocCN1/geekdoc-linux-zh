    \ 182\n- Switching between desktops | 184\n- Linux resources | 186\n\nChapter\
    \ Thirteen\n\n# Installing packages\n\nMost Linux distros include the RedHat Package\
    \ Management (RPM) tool which simplifies installation of additional applications.\
    \ This is the equivalent of the Add/Remove Programs feature in Windows and is\
    \ located on a menu in the system Control Center.\n\nIn Mandrake Linux the installer\
    \ is called \"RmDrake\". Launch the Mandrake Control Center, click on the Software\
    \ Management icon in the left pane, then select the RmDrake Installer icon in\
