    # Evaluating hardware suitability


    Before installing Linux on a computer it is necessary to evaluate its hardware
    specifications for suitability. The table below suggests minimum specifications
    for processor, memory and hard disk (HD) drive.


    | Hardware item | Suggested minimum |

    |---|---|

    | CPU speed | 300Mhz minimum (1.0Ghz + is better) |

    | Memory size | 128Mb minimum (256Mb + is better) |

    | HD drive capacity | 5Gb minimum (10Gb + is better) |


    Linux can be installed on systems that fall below these suggested levels performance
    may be impaired.


    The CPU and memory details are also usually displayed by the BIOS when the computer
    boots up.


    It''s easy to discover the CPU and memory information if Windows is already installed
    on the computer – right-click on the My icon then select Properties to open the
    System Properties dialog box. The details are displayed under the General tab,
    as illustrated below.


    ![](img/79c73558c68d3c5f59b51559717db1f4_13_0.png)'
