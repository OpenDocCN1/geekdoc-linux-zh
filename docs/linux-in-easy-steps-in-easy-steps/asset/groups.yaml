  - '[PAGE 185]


    # Switching between desktops


    When you click the Start, Logout menu in a graphical Linux desktop a Logout dialog
    presents the options to halt or reboot the computer and also offers to login as
    a different user.


    The appearance of the Logout and Login dialog boxes vary according to the display
    manager in current use – the Logout dialog shown here is from the K Desktop Manager
    (KDM) and the Login dialog is from the Gnome Desktop Manager (GDM).


    ![](img/79c73558c68d3c5f59b51559717db1f4_185_0.png)


    Choosing the option to login as a different user closes the current graphical
    desktop and displays a Login dialog. A Login dialog lets you choose which desktop
    environment you wish to for. For instance, in the Gnome Desktop Manager Login
    dialog select your preferred desktop environment from the Session.


    The System, Configure menu allows you to change certain aspects of the Login dialog''s
    appearance.


    ![](img/79c73558c68d3c5f59b51559717db1f4_185_1.png)


    Next enter your user name and password, then click the OK button to start the
    selected desktop.'
