    在 Mandrake Linux 中启动 Mandrake 控制中心。点击“硬件”菜单项，然后点击右侧面板中出现的 DraksTV 图标。从列表中选择卡和调谐器类型，或选择“自动检测”让向导发现，然后点击“确定”按钮继续。


    ![](img/79c73558c68d3c5f59b51559717db1f4_45_0.png)


    电视格式广播不同的数字：在不同速度下的不同行数。如果你在网络搜索搜索引擎中输入“world television standards（世界电视标准）”时不确定你所在地使用的系统。


    ![](img/79c73558c68d3c5f59b51559717db1f4_45_1.png)


    接下来，从下拉列表中选择你的位置，并选择你地区传输信号的电视标准——北美的 NTSC（国家电视系统委员会）、英国和澳大利亚的 PAL（相位交替扫描）、法国和俄罗斯的
    SECAM（顺序存储记忆彩色）等。


    ![](img/79c73558c68d3c5f59b51559717db1f4_45_2.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_45_3.png)


    如果你在美国并通过电缆接收电视，请选择 USA (cable) 而非 USA (broadcast)。


    ## ...续


    点击“确定”按钮继续，会出现第二个窗口，在该窗口中将依次扫描一系列范围内的频率，以找到你地区可用的电视频道。


    检测到的通道将根据你的位置而异。这里显示的 ??? 频率是名称未知的检测到的电视通道——它们仍会显示，以便查看这些频道。


    ![](img/79c73558c68d3c5f59b51559717db1f4_46_0.png)


    扫描完成后，第二个窗口关闭，被发现包含电视频道的频率将被存储。安装电视卡会在桌面上放置一个图标，可以使用它可以启动电视应用程序并查看存储的频道。


    ![](img/79c73558c68d3c5f59b51559717db1f4_46_1)


