    on the right-click context menu.


    ![](img/79c73558c68d3c5f59b51559717db1f4_127_5.png)


    The Brush Selection dialog contains an interesting range of brushes to experiment
    with – you can also create your own brush and add it to the available selections.


    Similarly, the Gradient and Pattern dialogs contain a range of'
