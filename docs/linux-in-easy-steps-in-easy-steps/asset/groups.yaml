    # Composing web pages


    Mozilla includes a super free web page editor called Composer.

    This is a WYSIWYG (What You See Is What You Get) tool that lets you quickly create
    great-looking web pages.


    Composer can be launched from Mozilla''s Window menu, or from the component bar,
    or from the Start, Networking, WWW menu.


    The Composer editor opens in “Normal” mode that allows you to create a page by
    adding content to its main window. Clicking tabs at the bottom of the window present
    different views of the page – “Preview” mode shows the page as it would look in
    a browser, “Source” mode reveals the actual HTML code and “Tags” mode adds HTML
    tag markers to the Normal mode view.


    To control the flow of a page first create a table to hold the various contents
    – you can right-click on any cell and choose from the context menu to unite with
    other cells.


    Add a list:


    - 1. Alpha

    - 2. Beta

    - 3. Gamma


    Add a line:


    Add a table:


    | One | Two | Three | Four |

    | :--- | :--- | :--- | :--- |


    Add an image:


    Add a hyperlink: Open the Google search engine


    Text content can be added to the page by typing directly in or be copy-pasted
    from another source. Drag the cursor over text to select it, then use the toolbar
    buttons to alter its size, color, font, highlight and position. Other toolbar
    buttons let you create bulleted or numbered lists with just one click.


    Images, tables and hyperlinks can be added from the Insert menu or by clicking
    their toolbar equivalents. Each one a dialog to where you can specify explicit
    details – browse to the location of an image file, set the number of rows and
    columns for a table, enter the target URL for a hyperlink.


    The properties of images, tables, lists and hyperlinks can be fine-tuned after
    they have been added to the page. Double-click any one of these to open their
    Properties dialog box. Modify any of the basic properties in that dialog or on
    the Advanced Edit button to edit more sophisticated properties of that item.


    The screenshot below shows a simple JavaScript addition to images onclick attribute
    – this will display an alert dialog if a user clicks that when the page is displayed
    in a browser.


    The string to be displayed in the alert dialog must be enclosed in single quotes
    to double avoid conflict with the double quotes that surround the entire value
    – view this in Source mode to see how the code appears.


    # Messaging online


    Linux includes several Instant Message clients. Typically, these can be found
    under the Start, Networking, Instant Messaging menu.


    One of the most interesting tools is Jabber – the free open-source GNOME client.
    This does not rely on a single server and allows communication with other instant
    messaging systems including ICQ and AIM. Discover the latest news about Jabber,
    and find the Manual at http://jabber.net.


    The first time Jabber is launched a wizard asks you to create a new account. Enter
    the username and password details then login to Jabber. Click Add Contact on the
    Actions menu to add contacts to your roster, then Send Message to open the message
    dialog where you can type and send your message. Jabber also lets you chat online
    – click Join Chat, then select a room to enter.


    # Touring the Linux file structure


    The Linux directory structure is markedly different to that in Windows. This chapter
    begins by highlighting some of the fundamental differences between Linux and Windows
    then goes on to describe the hierarchical layout of Linux directories. The purpose
    of each standard Linux sub-directory is explained to illustrate how they are used.
    Demonstrations show how to navigate through the Linux directory structure both
    in a graphical environment and from the command line.


    - The Linux directory tree

    - Standard sub-directories

    - Navigating with File Manager

    - Navigating from the command line

    - File system


    # The Linux directory tree


    When moving from Windows, the Linux user needs to be aware of some fundamental
    differences between the two operating systems:


    - Linux is case-sensitive – Windows is not. For instance, a file named "readme.txt"
    and "README.txt" are seen as two different files in Linux but there is no distinction
    between them.

    - Linux directories and files have ownership permissions that can restrict accessibility
    to the owner or group – Windows directories and files are generally accessible.

    - Linux was developed from the outset as a multi-user operating system – Windows
    evolved from DOS as a single-user operating system intended for home use.

    - Linux users cannot change system settings, only the "root" super-user may do
    – Windows users have free.

    - Linux partitions are created using the Ext3 file system – Windows partitions
    use FAT, FAT32 or NTFS file systems.

    - Linux path names contain slash characters – Windows path names contain backslash
    characters. For instance, a Linux path /usr/bin and a Windows path C:\bin.

    - Linux does not have drive letters – Windows typically uses A: for the floppy
    drive, C: for the hard disk drive, D: for the CD drive, and so on.


    The lack of drive letters in Linux is probably the biggest difference between
    Linux and Windows – the way directory structures are arranged. In Linux everything
    is contained within a single hierarchical system beginning with the “root” directory
    symbolized by a forward slash. The Linux installation creates a number of standard
    sub-directories within the root directory. Each of these has its own sub-directory
    structure, creating a directory “tree” – the “root” directory is the root of the
    tree as shown opposite. Contents of peripheral drives appear in the tree at which
    they are “mounted” by Linux creating a unified interface. This illustration depicts
    typical subdirectories in Linux – the purpose of each directory is described on
    the following pages.


    **BEWARE** Do not confuse the "/" root directory with its sub-directory.


    /bin

    Contains small executable programs (binaries) which are often considered to be
    part of the operating system itself – they aren’t really. For instance, when you
    type the `ls` command at a prompt, to list the contents of a directory, Linux
    executes the `ls` program that is located in the `/bin` directory. This directory
    is roughly equivalent to the `C:\Windows` directory in Windows.


    /sbin

    Contains executable system programs (binaries) that are only used by the root
    super-user and by Linux when performing system recovery operations. For instance,
    the clock program that maintains the system time when Linux is located in the
    `/sbin` directory. This directory is roughly equivalent to the `C:\Windows\system`
    directory in Windows.


    /lib

    Contains binary library files which are used by the executable programs in the
    `/bin` and `/sbin` directories. These shared libraries are particularly important
    for booting the system and executing commands within the root file system. They
    are roughly equivalent to the DLL libraries in Windows but are not scattered around
    the system. Having a specific directory for support libraries avoids the common
    problem in Windows when multiple libraries have been installed and the system
    becomes confused about which one to use.


    /dev

    Contains special file system entries which represent devices that are attached
    to the system. These allow programs access to the device drivers which are essential
    for the system to function properly – although the actual driver files are located
    elsewhere. For instance, the entry `/dev/fd0` represents the floppy drive and
    the entry `/dev/cdrom0` represents the CD drive.

    '
  mdcn: '


    # 编写网页


    Mozilla 包含一个名为 Composer 的免费网页编辑器。

    这是一个 WYSIWYG（所见即所得）工具，可以让你快速创建外观精美的网页。


    Composer 可以从 Mozilla 菜单、启动栏，或者网络（Networking）菜单启动。


    Composer 编辑器在“Normal”（标准）模式下打开，允许通过向窗口添加内容创建页面。底部的标签可以切换页面的视图——“Preview”（预览）模式显示页面在浏览器中的外观，“Source”（源代码）模式显示真实的
    HTML 代码，“Tags”（标签）模式用于添加 HTML 标记。


    要控制页面的布局，首先创建一个表格来容纳各种内容——你可以右键点击任何单元格与其他单元格合并。


    添加列表：


    - 1. Alpha

    - 2. Beta

    - 3. Gamma


    添加行：


    | 一 | 二 | 三 | 四 |

    | :--- | :--- | :--- | :--- |


    添加图像：


    添加链接：Google 搜索


    文本内容可以通过直接输入来添加到页面，也可以从另一个源复制粘贴。将光标悬停在文本上进行选择，然后使用工具更改其大小、颜色、字体和位置。


    图像、表格和链接可以通过“Insert”（插入）菜单或点击相应的等效项来添加。每个对话框都可以指定文件位置、设置行和列，以及目标 URL。


    图像、表格和链接的属性在添加到页面后，可以在“Properties”（属性）对话框中进行细调。双击其中任意一个可以打开属性对话框，点击“Advanced”（高级）按钮可以编辑该项目更复杂的属性。


    下面的截图显示了简单的 JavaScript 添加——当页面在浏览器中显示时，这将显示警告框。显示在对话框中的字符串必须包含在单引号内，以避免与双引号冲突——在“Source”（源代码）模式下查看此内容以了解代码如何出现。


    # 即时消息


    Linux 包含了几个即时消息客户端。通常可以在启动菜单、网络（Networking）、即时消息菜单下找到它们。


    最有趣的工具之一是 Jabber——一个开源的 GNOME 客户端。它不依赖单一服务器，并允许与 ICQ 和 AIM 在内的即时消息系统通信。有关 Jabber
    的最新消息，可以在 http://jabber.net 查看手册。


    第一次启动 Jabber 时，向导会要求你创建一个新账户。输入用户名和密码详情后登录 Jabber。点击“Actions”（操作）菜单将联系人添加到列表，然后点击“Send
    Message”（发送消息）打开消息对话框，可以在其中输入并发送消息。Jabber 还允许聊天——点击“Join Chat”（加入聊天）选择一个房间。


    #  Linux 文件结构


    Linux 的目录结构与 Windows 有显著不同。本章首先强调 Linux 和 Windows 之间的基本区别，然后描述 Linux 目录的层级结构。解释了每个标准子目录的用途以说明它们如何使用。演示了如何在图形环境和命令行中遍历
