    你可以通过为你的网站添加 JavaScript 功能来创建交互式网页。一个简单的方法是遵循“JavaScript 快速入门”中的示例。它有关于 JavaScript
    语言所有主要功能的独立章节，并带有代码示例截图，说明了每个方面。


    点击“文件”、“保存”菜单，将文档保存到主目录的合适位置。这将打开“另存为”对话框，你可以在其中输入文件名——默认情况下，文档将以带有 .sxw 扩展名的
    OpenOffice 原生格式保存。


    ![](img/79c73558c68d3c5f59b51559717db1f4_112_2.png)


