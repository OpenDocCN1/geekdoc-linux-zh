    \n从 shell 命令打印不仅限于文件——还可以使用管道符 `|` 通过 `lpr` 命令将数据加入队列打印。例如，你可以将 `ls` 命令通过给 `lpr`\
    \ 命令来打印 `/etc` 内容的详细列表：\n\n```\nls /etc | lpr\n```\n\n## Shell 脚本\n\n本章介绍了 shell\
    \ 脚本，通过在 shell 提示符下输入脚本名称来执行一组指定的 shell 命令——有效地创建自定义命令。\n\n| 内容 | |\n| :--- |\n\
    | 使用 shell 命令 | 162 |\n| 编辑文本流 | 164 |\n| 替换变量 | 165 |\n| 创建脚本 | 166 |\n| 分支脚本\
    \ | 168 |\n| 循环脚本 | 170 |\n| 处理输入 | 172 |\n\n## 使用 shell 命令\n\nShell 脚本允许通过在 shell\
    \ 提示符下输入脚本名称按顺序执行一系列 shell 命令。\n\n在开始之前，探索一些脚本中常用的命令是有用的。`echo` 命令允许使用转义序列进行简单的格式化。这些都以反斜杠开头。最常用的转义序列是\
    \ `\\n`（换行）和 `\\t`（制表符）——下方的图中演示了 `echo` 命令。\n\n`clear` 命令可以随时用于清除内容——将光标留在顶部的新提示符处。\n\
    \n## expr\n\n`expr` 命令提供了在 shell 提示符下评估算术表达式的能力。它使用常用的运算符 `+`、`-`、`*` 和取模 `%`，但它只识别整数——它不支持浮点数。\n\
    \n尝试评估包含浮点数的表达式时，每个值都是作为 `expr` 命令的独立参数提供的，因此前后必须有空格。括号可以明确表达式的含义，即评估顺序——先在括号内执行运算，然后在外部执行。\n\
    \n比较 `expr` 命令在表达式为真时返回 1，如果为假则返回 0。它支持常用的运算符来测试表达式相等 `==`、不相等 `!=`、大于 `>` 和小于\
    \ `<` 的值。\n\n为了避免解释器错误，重要的是为每个乘法 `*`字符、大于 `>`字符、小于 `<`字符以及括号字符加上引号。\n\n使用 `expr`\
    \ 命令评估某些表达式的结果可以在下图中看到——查看括号后的乘法示例是如何相加的。\n\n`expr` 命令也可以用于布尔算术匹配——详情请参见 `expr`\
    \ 帮助页。\n\n```\n[mike]$ expr 21 + 7\n28\n[mike]$ expr 21 / 7\n3\n[mike]$ expr 5\
    \ \"* = 6 - 3\n27\n[mike]$ expr 5 \"* = \\(6 - 3)\"\n15\n[mike]$ expr 25 % 7\n\
    4\n[mike]$ expr 8 == 8\n1\n[mike]$ expr 9 \">\" = 4\n0\n[mike]$ expr 9 \"< = 4\n\
    0\n[mike]$ \n```\n"
