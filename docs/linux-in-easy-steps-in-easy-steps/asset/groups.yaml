    # Synthesizing sounds


    One of the most compact file formats for electronic music is that of the Musical
    Instrument Digital Interface (MIDI). It was introduced back in 1983 through a
    collaboration between the electronic instrument manufacturers, including Roland,
    Yamaha and Korg.


    A MIDI file is a text-based set of instructions that can simultaneously control
    a range of digital devices, such as keyboards, video players, light-show controllers,
    synthesizers and, of course, computer sound cards.


    The encoded instructions in a MIDI file determine the notes to be played together
    with their position and volume, including crescend and dimenduos. Others specify
    a numeric reference for each instrument track (0 = grand piano, 74 = flute, etc.)
    up to a maximum of 16 tracks. They also determine tempo, volume and balance.


    The compact size of MIDI files makes them ideal to provide a musical background
    for web pages — use sparingly though, as many people just find them irritating..


    The MIDI file format has the extension .mid. Files in this format are much smaller
    than other sound files because they just contain synthesizer instructions rather
    recordings of sounds.


    In Linux, the long-standing MIDI application is called “TiMidiity” and includes
    piano and guitar instrument tracks.


    ![](img/79c73558c68d3c5f59b51559717db1f4_139_0.png)


