    ![](img/79c73558c68d3c5f59b51559717db1f4_72_1.png)


    账户文件夹（如收件箱 Inbox）的工作方式与 Outlook 类似，因此 Windows 用户会感到非常熟悉。当你第一次尝试连接 ISP 进行对话时，会出现一个对话框要求你输入该电子邮件账户的密码。输入你与
    ISP 约好的密码。务必勾选“使用密码管理器记住此密码”框框，这样你每次访问邮件时就不需要手动输入密码了。点击确定获取你的邮件。


    ![](img/79c73558c68d3c5f59b51559717db1f4_72_2.png)


    5. 浏览网页 | 71


    # 存储电子邮件地址


    Mozilla 通讯录（Mozilla Address Book）允许你在单独的“卡片”上存储联系人的电子邮件地址和个人详情。


    你可以从收件箱（Inbox）文件夹中右键点击发送者的地址，并在弹出的上下文菜单中选择“添加到通讯录”（Add To Address Book），将电子邮件地址添加到新卡片中。


    ![](img/79c73558c68d3c5f59b51559717db1f4_73_0.png)


    你可以配置 Mozilla 自动将发出的邮件地址添加到通讯录中。首先，选择“编辑”（Edit）菜单上的“选项”（Preferences）选项，然后展开“邮件/新闻组”（Mail
    Newsgroups）菜单。点击“电子邮件地址收集”（Email Address Collection）面板中的方框。点击确定按钮应用更改。


    ![](img/79c73558c68d3c5f59b51559717db1f4_73_1.png)


    可以通过点击 Mozilla 组件栏上的“通讯录”（Address Book）按钮打开通讯录，也可以从“窗口”（Window）菜单中选择“通讯录”，或者通常通过“开始
    -> 网络 -> 邮件 -> Mozilla 通讯录”来导航到它。


    ![](img/79c73558c68d3c5f59b51559717db1f4_73_2.png)


    在左侧面板（标题为“通讯录”）中，点击“个人通讯录”（Personal Address Book）选项，即可在右上面板显示你邮件账户的所有卡片列表。点击列表中的任何卡片，即可在右下面板显示其详情。


    双击列表中的任何卡片可打开“卡片”对话框，可以在其中添加或修改该卡片的详情。或者，点击工具栏上的“属性”（properties）按钮来打开当前选中卡片的卡片对话框。


    可以通过点击工具栏上的“新卡片”（New Card）按钮手动创建新卡片，以及通过“新列表”（New List）按钮创建列表。


    要删除卡片/列表，在列表中选中它，然后点击工具栏上的“删除”（Delete）按钮。


    ![](img/79c73558c68d3c5f59b51559717db1f4_73_3.png)


    Linux 快速入门指南


    # ...续上


    点击“获取地图”（Get Map）按钮，根据卡片“地址”（Address）选项卡中城市（City）、州（State）和邮政编码（Zip Code）字段存储的详情打开本地地图——在本例中，它是纽约市地图。


    ![](img/79c73558c68d3c5f59b51559717db1f4_74_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_74_1.png)


    只有当你确定收件者允许 HTML 时，才将首选邮件格式设置为 HTML——某些人倾向于将消息限制为纯文本（Plain Text）格式。


    ![](img/79c73558c68d3c5f59b51559717db1f4_74_2.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_74_3.png)


    5. 浏览网页 | 73


    # 加入新闻组


    新闻组为特定主题的讨论提供了在线区域。你可以加入你感兴趣的一个或多个新闻组，并关注小组内其他成员发布的讨论——你也可以通过向新闻组发布内容来贡献自己的观点，但这并非必须的。


    要加入新闻组，你必须首先建立新闻组账户，这与发送/接收邮件之前必须设置电子邮件账户非常相似。


    在 Mozilla 收件箱（Inbox）中，点击收件箱，点击“文件”（File）菜单中的“邮件”（Mail）选项来启动向导。点击“账户”（Account）按钮创建新闻组账户。出现对话框要求你输入该电子邮件账户的密码。输入你与
    ISP 约好的密码。点击确定获取你的邮件。


    ![](img/79c73558c68d3c5f59b51559717db1f4_75_0.png)


    也可以从“开始 -> 网络”通过命令行界面启动 Mozilla。


    ![](img/79c73558c68d3c5f59b51559717db1f4_75_1.png)


    新闻组可能包含未审查的内容。


    ![](img/79c73558c68d3c5f59b51559717db1f4_75_2.


    ![](img/79c73558c68d3c5f59b51559717db1f4_75_3.png)


    点击“下一步”（Next）按钮来创建新闻组账户。在左侧面板（标题为“新闻组”）中，点击“订阅”（Subscribe）选项即可显示你邮件账户的所有新闻组列表。点击列表中的任何新闻组，即可在右下面板显示其详情。


    双击列表中的任何新闻组可打开“订阅”对话框，可以在其中添加或修改该新闻组的详情。或者，点击工具栏上的“属性”（properties）按钮来打开当前选中新闻组的订阅对话框。


    点击“下一步”（Next）按钮来完成设置。


    '
