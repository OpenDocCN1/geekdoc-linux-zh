    ## Navigating from the command line


    To view the standard sub-directories within the root directory from the command
    line, first type `cd /` to change to the root directory. Then type `ls` and hit
    Return to list the contents.


    The prompt illustrated here includes the user''s name but other prompts may not
    - type `whoami` at a prompt to reveal your user name.


    ![](img/79c73558c68d3c5f59b51559717db1f4_91_0.png)


    As in Windows, directories can contain "hidden" files that usually store configuration
    information – In Linux, file names begin with a dot. To include hidden files in
    the listing of directory content, add the `-a` argument after the `ls` command.


    ![](img/79c73558c68d3c5f59b51559717db1f4_91_1.png)


    Type `date` at a prompt to see the current system date and time information.


    Navigate to any immediate sub-directory by typing `cd` followed by a space and
    the directory name. In the screenshot below, first opens the `/home` standard
    sub-directory and lists the contents, then opens the next-level sub-directory
    named `mike` and lists its contents – in this case four sub-directories.


    ![](img/79c73558c68d3c5f59b51559717db1f4_91_2.png)


    As an alternative to drilling down through each sub-directory in turn, you can
    navigate to any location in the file system by stating its full path from root.
    For instance, in the screenshot below, the user navigates directly from `/` to
    the **Documents** directory of the **/mike** user, located in the **/home** standard
    sub-directory.


    Remember that Linux is case-sensitive when typing the path.


    ```bash

    mike@linux:~$ cd /home/mike

    mike@linux:~/$ cd Documents

    mike@linux:~/Documents$ ls

    mike@linux:~/Documents$ cd ../..

    ```


    It is easy to forget what location in the file system you are working. Type the
    command `pwd` to print the working directory – this gives the full path of your
    current location. You can navigate to the next higher directory using `cd ..`.
    The **/home** directory can also be referred to by its short name `~`, using the
    tilde character. Notice how the user navigates two levels down from the **/mike**
    directory using a relative path – the alternative using an absolute path is `cd
    /home/mike/Documents/text`.


    ```bash

    mike@linux:~$ cd /home/mike

    mike@linux:~/$ cd Documents

    mike@linux:~/Documents$ ls

    mike@linux:~/Documents$ cat sample.txt

    mike@linux:~/Documents$ cd ..

    mike@linux:~/$ pwd

    mike@linux:~/$ cd /home/mike

    ```


    ## File system dos and don''ts


    When organizing your files and directories in Linux, it is advisable to adopt
    the recommendations listed below. These conform to accepted standards of practice
    and make working in Linux easier:


    - Never place files directly in the root directory (`/`) and never create directories
    there – the top-level root directory should only contain standard sub-directories.

    - Always use your personal home directory to store all your files – for instance,
    `/home/mike`. Create as many sub-directories as you like in your home directory,
    but not store files elsewhere.

    - Use only lowercase when naming files as this prevents future hassle with capitalization
    errors. For instance, you won''t have to remember if you named a file `mydata`
    or `MyDrive` – it will always be `mydata`.

    - When naming files, avoid any spaces. Linux can easily see these spaces in graphical
    mode but can create a problem in text mode – you will have to prefix each space
    in the name with a backslash when referencing that file.

    - Only use the root superuser account whenever it is absolutely necessary. If
    you are logged in as root you have absolute power – get the habit of working from
    a regular user account.


