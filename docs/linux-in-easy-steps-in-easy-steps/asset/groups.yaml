    # Installing packages


    Most Linux distros include the RedHat Package Management (RPM) tool which simplifies
    installation of additional applications. This is the equivalent of the Add/Remove
    Programs feature in Windows and is located on a menu in the system Control Center.


    In Mandrake Linux the installer is called "RmDrake". Launch the Mandrake Control
    Center, click on the Software Management icon in the left pane, then select the
    RmDrake Installer icon in the right pane to open the Software Packages Installation
    dialog.


    ![](img/79c73558c68d3c5f59b51559717db1f4_175_0.png)


    The options at the top of this dialog help you locate a package by search, or
    by changing the way in which the available packages are listed.


    ![](img/79c73558c68d3c5f59b51559717db1f4_175_1.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_175_2.png)


    HOT TIP You can select multiple packages from the menus if you want to install
    several at once.


    The Software Packages Installation dialog displays of expandable menus that let
    you select an application to be installed. For instance, add the popular "emacs"
    editor to your system (if it is not already installed) expand the Workstation
    and Console Tools menus, then select the emacs package from the list.


    To begin the installation process click on the Install button. If the selected
    application requires additional support packages also to be installed a dialog
    will appear requesting your approval - this has a More Infos button where you
    can discover more about the support package. Click on the OK button to proceed,
    or click the Cancel button to abort the installation.


