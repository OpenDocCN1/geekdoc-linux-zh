    ## 从命令行导航


    要从命令行查看根目录下的标准子目录，首先输入 `cd /` 切换到根目录。然后输入 `ls` 并按回车键列出内容。


    此处显示的提示符包含了用户名，但其他提示符可能不包含 - 在提示符处输入 `whoami` 即可显示您的用户名。


    ![](img/79c73558c68d3c5f59b51559717db1f4_91_0.png)


    与 Windows 一样，目录可以包含“隐藏”文件，这些文件通常存储配置信息——在 Linux 中，文件名以点开头。要在目录内容列表中包含隐藏文件，请在 `ls`
    命令后添加 `-a` 参数。


    ![](img/79c73558c68d3c5f59b51559717db1f4_91_1.png)


    在提示符处输入 `date` 查看当前日期时间。


    通过输入 `cd` 后加空格和目录名称导航到任何子目录。在下面的截图，首先打开 `/home` 标准子目录并列出内容，然后打开名为 `mike` 的下一级目录并列出其内容——在这种子目录中。


    ![](img/79c73558c68d3c5f59b51559717db1f4_91_2.png)


    作为逐层进入每个子目录的替代方案，可以通过指定完整路径导航到文件系统的任何位置。例如，在下面的图中，用户直接从 `/` 导航到位于 **/home** 的
    **Documents** 目录。


    记住在输入路径时 Linux 是区分大小写的。


    ```bash

    mike@linux:~$ cd /home/mike

    mike@linux:~/$ cd Documents

    mike@linux:~/Documents$ ls

    ```


    很容易忘记正在工作的文件系统位置。输入 `pwd` 命令打印工作目录——这将提供您当前位置的完整路径。可以使用 `cd ..` 导航到上一级目录.**home**
    目录也可以通过其短名 `~`（波浪号字符）引用。注意用户如何使用绝对路径 `cd /home/mike/Documents`。


    ```bash

    mike@linux:~$ cd /home/mike

    mike@linux:~/$ cd Documents

    mike@linux:~/Documents$ cat sample.txt

    mike@linux:~/Documents$ cd ..

    mike@linux:~/$ pwd

    mike@linux:~/$ cd /home/mike

    ```


    ## 文件系统的要做与不要


    在 Linux 中组织文件和目录时，建议采用下列建议。这些建议符合惯例标准并让 Linux 工作变得更容易：


    - 永远不要将文件放在根目录 (`/`) 中或在那里创建目录——顶层根目录应该只包含子目录。

    - 始终使用您的家目录存储所有文件——例如 `/home/mike`。在您的家目录中创建任意子目录，但不要存储其他地方。

    - 命名文件时仅使用小写，以避免以后出现大小写错误。例如，您无需记住文件命名为 `mydata` 还是 `MyDrive`——它一直是 `mydata`。

    - 命名文件时避免任何空格。Linux 在图形模式下很容易看到这些空格，但在文本模式可能会可能会问题——引用该文件时，需要在每个空格前加反斜杠。

    - 仅在绝对必要时使用 root 超级账户。如果您以 root 身份登录，则拥有绝对权限——养成从普通用户账户工作的习惯。


