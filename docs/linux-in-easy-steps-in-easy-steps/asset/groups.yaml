    # Moving between shell applications


    Switching between multiple shell applications running in several virtual consoles
    can be confusing because it''s easy to forget which application is running in
    each console. Often, a better alternative is to use shell control to suspend and
    resume running applications.


    A running application can be suspended as a "job" by pressing the Ctrl+Z keys.
    The shell responds with a job number, a "Stopped" confirmation message, the name
    of the application, and the name of the file it has open where appropriate.


    In the example illustrated below, the vi application is first opened to edit an
    existing file, then the job is suspended by pressing Ctrl+Z. The next vi info
    pages are opened, then suspended.


    Remember that each job gets suspended by pressing Ctrl + Z keys.


    ![](img/79c73558c68d3c5f59b51559717db1f4_157_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_157_1.png)


    Suspended jobs can remain suspended indefinitely without any problem. Type jobs
    at a shell prompt to see a list of jobs, marking those which are currently suspended
    as "Stopped".


    ![](img/79c73558c68d3c5f59b51559717db1f4_157_2.png)


    56 | Linux in easy days'
