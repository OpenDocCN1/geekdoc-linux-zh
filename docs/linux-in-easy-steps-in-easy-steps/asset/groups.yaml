    ## 播放和刻录 CD


    KDE Simple CD (KSCD) 应用是 Linux 下的标准的音频 CD 播放器。它的界面具有在真实 CD 播放器上常见的熟悉的控制按钮，外加四个用于额外功能的按钮。


    点击“数字音频光盘”（Compact Disc Digital Audio）标志按钮可以循环显示的时间——显示曲目的剩余播放时间和整张光盘的已过时间。点击带有工具图标的按钮打开配置对话框，你可以在其中更改显示控制和其他简单选项。“i”按钮可以帮助在网上搜索艺术家信息，例如演唱会日期。


    ![](img/79c73558c68d3c5f59b51559717db1f4_147_0.png)


    KSCD 窗口右上角的 CD 按钮并不会停止播放——请从其系统托盘图标选择“退出”（Quit）选项来停止。


    ![](img/79c73558c68d3c5f59b51559717db1f4_147_1.png)


    如果有 CD 数据库条目，显示将显示艺术家和曲目详情——或者你可以创建自己的。点击该按钮，输入艺术家和曲目详情，然后点击 OK 按钮保存。


    ![](img/79c73558c68d3c5f59b51559717db1f4_147_2.png)


    如果你找不到系统托盘图标，你可能不小心删除了托盘——要恢复它，右键点击面板并选择“添加”（Add）、“应用程序”（Applet）、“系统托盘”（System
    Tray）。


    ![](img/79c73558c68d3c5f59b51559717db1f4_147_3.png)


