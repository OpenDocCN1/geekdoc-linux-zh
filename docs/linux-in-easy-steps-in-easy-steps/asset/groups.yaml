  mdcn: "\n\n# 脚本循环\n\n可以使用 `for-in` 循环语句创建一个脚本，用于对列表中的每个项重复执行命令。通常，这会指定一个变量，在循环的每次迭代中引用连续的项\
    \ – 第一次迭代引用第一个项，第二次迭代引用第二个项，依此类推。其语法如下：\n\n向 `for-in` 循环提供一个名称列表，以便对每个文件执行相同的命令操作。\n\
    \n![](img/79c73558c68d3c5f59b51559917db1f4_171_0.png)\n\n```\nfor var in item-1\
    \ item-2 item-3\ndone\n    action/s\n```\n\n来自 C 语言的传统 `for` 循环也可以用于在 shell 脚本中重复执行命令。这通常有一个计数器变量（传统命名为\
    \ `i`），它计数直到达到指定值。它在 `for` 语句中被分配一个初始值，该语句还包括作为测试表达式的终止值，以及在每次迭代中更改计数器的方法——通常在每次迭代时递增。该循环的语法如下：\n\
    \n```\nfor(( initializer; test-expression; change ))\ndone\n    action/s\n```\n\
    \n两种类型的 `for` 循环都出现在下方的示例脚本中。\n\n![](img/79c73558c68d3c5f59b51559717db1f4_171_1.png)\n\
    \n`++` 递增运算符将当前值加一（`i++` 是 `i+1`）。同样，`--` 递减运算符将当前值减一（`--` 是 `i-1`）。\n\n![](img/79c73558c68d3c5f59b51559717db1f4_171_2.png)\n\
    \n170 | Linux 入门\n\n# ...接上\n\n```\nSession Edit View Bookmarks Settings Help\n\
    [mike]$ loop\nNumber one\nNumber two\nNumber three\nNumber 1\nNumber 2\nNumber\
    \ 3\n[mike]$\n```\n\n![](img/79c73558c68d3c5f59b51559717db1f4_172_0.png)\n\n死循环永远不会结束——但可以使用\
    \ `Ctrl+Z` 组合手动停止任务。另一种循环格式可以使用 `while` 关键字编写。这通常需要为计数器变量分配一个初始值，该值在循环的第一次迭代的测试表达式中使用。当发现该条件为真时，循环执行其命令操作——这些操作应该包含一个更改计数器值的语句，否则可能会创建一个死循环。\n\
