    ## Downloading KDE packages


    In the KDE desktop Konqueror web browser can be used to easily download RPM packages
    via File Transfer Protocol (FTP). Start Konqueror then the Open Location option
    on the main Konqueror menu to launch the Open Location dialog. Type the name of
    an FTP site into its Location field then click the OK button to connect to the
    specified site. For instance, download the Opera web browser RPM package via FTP
    launch the Open Location dialog and type ftp.opera.com then click OK.


    ![](img/79c73558c68d3c5f59b51559717db1f4_179_0.png)


    Konqueror connects to the Opera FTP site and displays the contents of its root
    directory – a text file containing a welcome message and a sub-directory named
    /pub. Click on this directory to reveal its contents and continue to navigate
    through the system to find the RPM package you wish to download.


    ![](img/79c73558c68d3c5f59b51559717db1f4_179_1.png)


    Most FTP sites that offer for free download accept the word "anonymous" as the
    login username and your email address as a password – Konqueror supplies these
    automatically to log you in.


    Click on the RPM package and a Question dialog asks whether you want to download
    or open the file – click the Save As button.


    ...cont''d


    ![](img/79c73558c68d3c5f59b51559717db1f4_180_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_180_1.png)


