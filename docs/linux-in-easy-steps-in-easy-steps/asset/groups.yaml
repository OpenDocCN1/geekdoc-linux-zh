    # Foreword


    This book examines the suitability of the Linux operating system for everyday
    desktop computing tasks and contrasts some popular Linux applications with their
    counterparts in the Windows operating system. It begins by describing how to install
    and configure Linux on your own computer, then explores a typical Linux graphical
    user interface (GUI). Examples show how to navigate the file system, both graphically
    and from a command prompt, so you will quickly become comfortable with the Linux
    system.


    Linux applications are illustrated to accomplish common desktop tasks using word
    processing, spreadsheets, presentations, graphics manipulation and multi-media.
    An introduction to the Linux shell, and shell scripts, demonstrate why its power
    and scripting capabilities are admired by advanced users.


    Examples explain how to install further applications just as easily as with the
    Add/Remove Programs feature in Windows. These include applications from a CD-ROM,
    from the Internet, and even other desktop environments.


    # Who is this book for ?


    The adoption of the freely available Linux operating system for desktop computing
    is spreading rapidly. If you want to see its functionality compares to Windows,
    or if you want to examine its reliability and security, or you want to explore
    the possible cost-savings of adopting Linux, or if you are just curious to see
    what all the fuss is about – this book is for you.


    # Conventions in this book


    The text body of this book adopts certain typeface conventions to readily identify
    content of significance.


    Directory and file names appear in bold font. For example:


    ```

    /home

    simple.txt

    ```


    Shell commands, script code and variables appear in bold fixed-width font, like
    this:


    ```

    ls -a

    echo "Hello World"

    $USER

    ```


    Placeholders in syntax examples appear in italic fixed-width font. These are not
    part of the actual code but merely indicate where content should be inserted.
    For instance the text place-holder in this example should be replaced by actual
    text:


    ```

    echo "text"

    ```'
