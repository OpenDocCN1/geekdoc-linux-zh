    click on the My Computer icon then right-click on the HD drive and select Properties
    to open the Local Disk Properties dialog.


    ![](img/79c73558c68d3c5f59b51559717db1f4_17_0.png)


    This procedure is not required if Linux is to replace Windows. In Windows XP,
    click on the My Computer icon then right-click on the HD drive and select Properties
    to open the Local Disk Properties dialog.


    ![](img/79c73558c68d3c5f59b51559717db1f4_17_0.png)


    This procedure is not required if Linux is to replace Windows. In Windows XP,
    click on the My Computer icon then right-click on the HD drive and select Properties
    to open the Local Disk Properties dialog.


    ![](img/79c73558c68d3c5f59b51559717db1f4_17_0.png)


    ## 16 Linux in easy steps


    ## Installing Linux


    This chapter walks through the steps of a typical Linux installation using the
    popular Linux distribution. Most modern PCs can accommodate up to four EIDE (Enhanced
    Integrated Device Electronics) devices, such as HD drives and CD/DVD drives, but
    typically ship with just two – one HD drive and one CD drive. Other distributions
    broadly follow the same steps but these may appear in a different order.


    - Starting the installation | 18

    - Configuring the mouse | 20

    - Choosing the security level | 21

    - Allocating disk space | 22

    - Creating partitions | 24

    - Choosing packages to install | 26

    - Setting the root password | 28

    - Creating a user account | 29

    - Setting automatic login | 30

    - Installing the bootloader | 31

    - Summarizing the installation | 32


    ## Chapter Two


    ## Starting the installation


    Linux installations begin by booting the computer from the CD-ROM. This requires
    the computer BIOS (Basic Input/Output System) settings to set boot from the CD
    drive before using on the HD drive. If your computer looks to boot from the HD
    drive (as it normally would) you will need to change the BIOS settings.


    On starting the computer usually tells you which key to press to enter the BIOS
    Utility – Delete, F1, F2, Insert, and Esc are common. The BIOS Setup Utility can
    typically be entered by holding down Delete key right after the memory test when
    the computer is first switched. From the BIOS Utility menu choose the option for
    Advanced features to display the boot device order. The boot sequence needs to
    have the CD drive before the HD drive, so it may need to be changed to look like:


    | First Boot Device | CDROM |

    | Second Boot Device | HDD-0 |

    | Third Boot Device | Floppy |


    Save the new settings and exit the BIOS Setup Utility. The computer will now reboot
    and initially look to the CD drive for boot instructions. When the CD drive does
    not contain boot instructions it uses those on the HD drive as before.


    Ensure that the first CD-ROM from your Linux distribution is in the CD drive,
    then switch on the computer to boot from the CD-ROM. The Linux installer program
    gets loaded into memory then begins to execute.


    The installer program starts out by asking you to select a language. Note that
    this is not to specify a language for use by Linux after installation but is just
    to set the language that the installer should use during the installation process.


    Click on your preferred language, then click on the Next button to proceed to
    the next step.

