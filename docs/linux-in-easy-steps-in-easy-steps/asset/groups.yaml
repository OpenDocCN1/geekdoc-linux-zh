    ![](img/79c73558c68d3c5f59b51559717db1f4_129_1.png)


    Click the OK button when the New Layer dialog appears to accept the default size
    and settings for the layer – or enter your preferred options first. The New Layer
    then appears listed in the Layers, Channels & Paths dialog and in the image window.
    A layer that is smaller than the entire image is surrounded by a dotted line with
    a yellow background for identification.


    To move a single layer hold the shift key and select the Move tool in the toolbox.
    Now click on the layer and drag it.


    128 | Linux in easy steps'
  - '[PAGE 130]


    # ...cont''d


    Layers are stacked in order, from the bottom Background layer up,

    in the Layers, Channels & Paths dialog. Click on a layer to select it

    then use the arrowed buttons at the bottom of the dialog to change

    it stack position.


    Unlink all linked

    layers before

    moving any layer,

    otherwise all the

    layers may be

    moved – even when the linked

    layers are not selected.


    ![](img/79c73558c68d3c5f59b51559717db1f4_130_0.png)


    You can click the eye icon of any layer to hide that in the

    image window. Layers can be linked by clicking between the eye

    icon and the thumbnail box – a cross symbol appears to denote

    linked layers. Moving a linked layer also moves the layer/s to which

    it is linked.


    Use the Layers,

    Align Visible

    Option on

    the context menu

    to align layers.


    A copy of any selected layer can quickly be created by clicking the

    Duplicate Layer button at the bottom of the dialog box. Drag a

    layer over the Trash icon then release the release button to delete

    that layer.


    To reduce an image with layers to a single layer, with a smaller file

    size, choose the Layers, Flatten Image option on the context menu.

    Alternatively, if you want to preserve the layers save the image in

    the GIMP''s favored .xcf file format.


    9. Creating graphics | 129'
  - '[PAGE 131]


    # Selecting areas


    The first six tools in The GIMP toolbox are selection tools which provide various
    ways to select an area of the image for manipulation.

    The simplest select rectangular and elliptical areas – do holding the Shift key
    when using these to select perfectly square and circular areas. The Shift key
    also lets you add further selections and unites them into a single selection if
    they overlap. Conversely, the Ctrl key subtracts overlapping areas from the first
    selection. Hold down both Ctrl and Shift to select only the overlapping area.


    ![](img/79c73558c68d3c5f59b51559717db1f4_131_0.png)


    Once an area has been selected the pointer changes to cross-arrows that represent
    the Move tool – you can now drag the selected area to another place in the image.


    ![](img/79c73558c68d3c5f59b51559717db1f4_131_1.png)


    The Lasso tool allows for freehand selection of an area of the image. The selected
    area automatically completes by connecting to its original starting point. You
    can add to a selection by holding down the Shift key and selecting another area
    (a + symbol appears alongside the pointer). Similarly you can subtract from a
    selection by holding down the Ctrl key and selecting another area (a - symbol
    appears alongside the pointer). Click anywhere on the image to cancel the selection.


    ![](img/79c73558c68d3c5f59b51559717db1f4_131_2.png)


    The Fuzzy Select tool in the GIMP works like the magic wand in Photoshop – click
    on an initial point and it will select adjacent pixels of similar color until
    the color becomes different. Click and drag from the initial point to increase
    its acceptable range. This tool is ideal for selecting sharp-edged objects within
    an image.


    ![](img/79c73558c68d3c5f59b51559717db1f4_131_3.png)


    The Bezier selection tool in the GIMP works like pen paths in Photoshop. Click
    on the image to choose anchor points around an area you want to select. Finally
    click on the starting point to complete the selection path. To reposition an anchor
    point just down the Ctrl key then drag it to the desired position.


    To create a curve at an anchor point click on the point – two handles appear.
    Drag the point so that the handles extend and the selection changes contour around
    that point. By default the handles are of equal length and create curves with
    rounded corners. For greater control hold down the Shift key so you can drag each
    handle individually to angled corners. When you are happy with the appearance
    click inside the curve to complete the selection – the selected area is indicated
    by a dashed line.


    30 | Linux in easy steps'
  - '[PAGE 132]


    # ...cont''d


    The Intelligent Scissors selection tool in the GIMP is similar to the magnetic
    lasso tool in Photoshop. Click to select anchor points around a clearly defined
    object within the image and it will attempt to automatically seek the edge of
    that object.


    The anchor points around the large illustration in this should be more accurately
    follow the edge of the object.


    ![](img/79c73558c68d3c5f59b51559717db1f4_132_0.png)


    If the line connecting two anchor points does not accurately follow the edge of
    the object hold down the Ctrl key then click on the line midway between the points.
    This adds an intermediate anchor point that should correct the problem. Anchor
    points can be repositioned manually just as with the Bezier selection tool.


    When you have surrounded the object click inside the shape to make the selection
    – the points and lines are converted to a dashed line indicating the selected
    area.


    Complex selections can be stored in an Alpha Channel so they can easily be recalled
    later. The selection information regards the selected area as opaque, selection
    edges as semi-transparent and unselected areas as transparent. To store a selection
    click inside it then choose Select, Save To Channel from the content menu – it
    gets added under the Channels tab in the Layers, Channels & Paths dialog. To restore
    a selection right-click on the Selection Mask Copy on the Channels then choose
    Channel To Selection.


