    # Setting up email


    Mozilla includes an client application called Messenger. This can typically be
    found under the Start, Networking, Mail menu – or it can be launched by selecting
    the Mail & Newsgroups option over Mozilla''s Windows window, or from the components
    bar.


    On initial launch, the Account Wizard dialog pops up asking you to create a new
    account. Check the radio button labeled Email Account, then click the Next button
    to continue. Now enter your own name and email address then click the Next button
    again.


    In the ensuing dialog enter the exact name of both incoming and outgoing servers
    – your ISP will provide this information. In the next dialog enter the email name
    assigned to your ISP. For instance, “mike” for the address mike@example.com. Click
    the Next button to continue.


    Now enter a name of your choice for the account. For example “Mikes Mail”. It’s
    particularly useful to be able to quickly identify each account when the computer
    is used by many people.


    Click on the Next button to reveal a summary of all the account information. Review
    the details to ensure they are correct, click the Finish button to complete the
    Account configuration.


    ![](img/79c73558c68d3c5f59b51559717db1f4_71_0.png)


    Messenger includes filters that can mark emails which it suspects to be – you
    can find the Junk Mail controls on the Tools menu.


    ![](img/79c73558c68d3c5f59b51559717db1f4_71_1.png)'
