    | Move to Trash | Delete |

    | Delete | Shift+Delete |

    | Add to Bookmarks |

    |Open With... |

    | Bzip2 this directory |

    | Tar this directory |

    | Zip this directory |

    | Open Terminal Here |

    | Edit File Type... |

    | Properties |


    ![](img/79c73558c68d3c5f59b51559717db1f4_107_2.png)


    The ZIP tool in Linux is called GZip—hence the .gz part of the file extension
    of the tarball archive.


    ![](img/79c73558c68d3c5f59b51559717db1f4_107_3.png)


    To extract the contents of a tarball in KDE right-click on the file then select
