    ## 安装扫描仪


    使用系统控制中心可以轻松连接扫描仪。

    在 Mandrake Linux 中启动 Mandrake 控制中心。点击“硬件”菜单项，然后点击右侧面板中的 Scanner 图标。向导将检测连接到系统的扫描仪。


    ![](img/79c73558c68d3c5f59b51559717db1f4_47_0.png)


