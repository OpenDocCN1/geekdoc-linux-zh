    # 7. 文件处理 | 97


    # 删除文件


    启动 Konqueror 并导航到你主目录下的某个位置。在窗口中点击右键打开右键菜单，并选择“新建目录”选项。输入一个名称（例如“temp”），然后点击确定按钮创建该目录。


    在新目录中放置一个文本文件——编写一个新文件或复制粘贴一个现有文件。现在，在新目录上点击右键打开右键菜单，该菜单提供了两个删除它的选项。


    第一个选项“移动到回收站”（Move To Trash）会将该目录及其包含的任何文件夹移动到回收站。这是一个临时区域，如果需要，可以从这里恢复目录和文件。第二个选项“删除”（Delete）将永久删除该目录及其文件——它们是无法恢复的。


    右键菜单允许你删除非空目录 - 除非你绝对确定永远不会想恢复其中的任何内容，否则请务必使用“移动到回收站”选项。


    要从回收站恢复项目，请打开 Konqueror 并导航到你想要恢复它们所在的位置，然后点击桌面上的回收站图标。将目录或文件从回收站剪切并粘贴或拖放到所需位置。


    要从回收站永久删除文件和目录，请右键点击该图标并选择“清空回收站”（Empty Trash Bin）选项。


    # ...续


    从命令行删除文件和目录提供了更强的安全保障，防止误删，因为它在执行这些操作之前需要对其进行确认。


    要重现页面另一侧的示例，请导航到主目录下的某个位置，然后输入 `mkdir`，后跟一个空格和名称来创建一个新目录。将一个文件复制到新目录中，然后输入 `rmdir`
    和目录名来尝试删除它及其内容。


    使用通配符 `*` 通过命令 `rm *` 删除所有文件。


    Linux 不允许删除非空目录 - 你必须先打开目录并使用 `rm` 命令删除其内容。Linux 会要求你输入 `y` 来确认此操作，然后它将永久删除该文件。现在，使用
    `cd` 回到上级目录，并执行一次 `rmdir` 来删除该空目录。


    ```

    Shell - mouse

    Session Edit View Bookmarks Settings Help

    [mike] cd /home/mike/Documents/text

    [mike] ls

    /home/mike/Documents/text

    linux.txt sample.txt

    mkdir temp

    [mike]$ ls

    linux.txt sample.txt temp/

    [mike]$ cd temp

    ls l

    sample.txt

    [mike]$ rmdir temp

    rmdir: Directory not empty

    [mike]$ cd ..

    [mike]$ rm sample.txt? y

    confirm regular file, ''sample.txt''? y

    [mike]$ rmdir temp

    [mike]$ ls

    linux.txt sample.txt

    [mike]$ $

    ```


    命令 `rmdir -rf` 是极其危险的 - 可以在一次操作内永久删除系统中的大量区域。最好避免使用。


    某些 Linux 发行版允许删除非空目录及其整个内容，这是通过在 `rmdir` 命令中使用 `-rf` 参数（递归、强制）实现的。例如，命令 `rmdir
    -rf temp` 可以瞬间并永久地删除名为 `temp` 的目录及其所有的子目录和文件。


    7. 文件处理 | 99


    # 创建快捷方式


    为经常访问的应用程序和文件创建桌面快捷方式通常非常方便。要为应用程序创建新的桌面快捷方式，首先在开始菜单中找到它，然后将其拖放到桌面上。


    然后点击鼠标右键，在出现的右键菜单中选择“在此处链接”（Link Here）——桌面上将添加一个图标，你可以点击它可以启动该应用程序。


    > 小贴士

    此快捷方式链接的 KSnapshot 应用程序被用于获取书中所有的截图。


    - 在此处复制

    - 在此处移动

    - 在此处链接

    - 取消


    要为文件创建桌面快捷方式，从 Konquer 将其拖放到桌面，然后选择“在此处链接”——桌面上将添加一个图标，你可以点击它可以该文件。


    - 在此处复制

    - 在此处移动

    - 在此处链接

    - 取消


    注意，此处文件显示为*斜体*，表示这些仅仅是指针。


    # ...续


    符号链接只是指针，而硬链接是实际的文件。在 Linux 中，这些快捷方式被称为“符号链接”或“软链接”。符号链接可以指向文件或目录，而硬链接只能指向文件。


    如果原始文件被删除，符号链接将失效，但只要存在一个链接，硬链接就是有效的。要创建符号链接，使用 `ln -s` 命令：`ln -s 目标文件名`。要创建硬链接，使用
    `ln` 命令：`ln 目标文件名`。


    7. 文件处理 | 101


    # 修改访问权限


    在 Linux 中，每个文件和目录都有一个“所有者”——通常是创建它的用户。所有者拥有读取文件、写入文件和执行文件的权限（如果它是可执行的）。


    可执行文件是一个可以“运行”的二进制程序——文本文件不是。所有者还可以设置权限，指定其他用户是否可以读取、写入和执行该文件。文件的访问权限可以限制为所有者、所有者所属的“组”、或系统的任何用户。


    要在 KDE 中查看文件的权限设置，请对文件点击右键，从右键菜单中选择“属性”，然后点击属性对话框中的“权限”选项卡。


    通常，用户、组和其他人至少具有读取文件的权限。如果你是文件的所有者，用户将写入和执行文件的权限（如果它是可执行的）。


    作为文件的所有者，你可以勾选任何未勾选的框以扩展文件的权限——点击确定按钮应用新的权限设置。


    要在命令行查看文件的权限设置，使用 `ls` 命令配合其 `-l` 选项获取长列表——输入 `ls -l` 然后按回车键。

