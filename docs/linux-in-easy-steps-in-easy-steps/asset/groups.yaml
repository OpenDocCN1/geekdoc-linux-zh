    ## 创建新文本文件


    在 KDE 中创建文本文件首先打开应用程序。例如，点击 Start、Applications 然后选择 KEdit (Text Editor) 启动 KEdit
    编辑器。


    更改 KEdit 的外观，点击 Settings 菜单并选择 Configure——选择您的字体、颜色、拼写检查器和换行偏好。


    ![](img/79c73558c68d3c5f59b51559717db1f4_95_0.png)


    直接向 KEdit 窗口输入文本内容，然后点击 File、Save 打开另存为对话框。在最顶部的字段中输入目录以确定保存文件的位置——您可以点击箭头按钮从下拉列表中选择目录。在“Location:”
    字段中输入文件名，然后点击 OK 按钮保存文件。


    左侧面板提供了位置选项，您可以点击它们快速选择新文本文件。


    ![](img/79c73558c68d3c5f59b51559717db1f4_95_1.png)


    Edit 菜单包含了所有常用的剪切、复制、粘贴、查找和替换文本选项，Go 菜单允许您移动到指定的行号。检查文本中的拼写错误，点击 Tools 菜单并选择 Spelling
    选项运行拼写检查。


    您可以选择拼写检查使用哪个字典——点击 Settings。配置 KEdit 以启动 Configure 对话框，然后点击 Spelling 选项。


    ![](img/79c73558c68d3c5f59b51559717db1f4_96_0.png)

    ![](img/79c73558c68d3c5f59b51559717db1f4_96_1.png)


    便携文档格式 (PDF) 由 Adobe Systems 开发。它们是保持查看和打印时原始文档格式的紧凑文件。


    点击 File、Print 打开打印对话框——“Name:”字段中的箭头按钮会显示一个很好的下拉列表。除了使用打印机生成纸质副本外，还可以创建文本文档的 PDF
    或 PostScript 版本。此外，Mail PDF File 选项会打开默认电子邮件应用程序并自动上文本文档的 PDF 版本，准备好发送。


    ![](img/79c73558c68d3c5f59b51559717db1f4_96_2.png)


    在第 152 页了解如何使用 vi 编辑器从命令行创建和编辑文本文件。


    ![](img/79c73558c68d3c5f59b51559717db1f4_96_3.png)


    ## 处理文件


    本章阐述了如何在 Linux 中创建和操作文件。解释了文件所有权的概念，并演示了如何更改文件权限。它还展示了如何在 Windows 中访问文件。


    '
