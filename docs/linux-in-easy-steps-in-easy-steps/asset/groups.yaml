    # Linux 目录树


    从 Windows 迁移过来时，Linux 用户需要意识到这两个操作系统之间的一些基本区别：


    - Linux 是区分大小大小的——而 Windows 不是。例如，名为 "readme.txt" 和 "README.txt" 的文件在 Linux 中被视为两个不同的文件，但在
    Windows 中它们之间没有区别。

    - Linux 目录和文件拥有所有权权限，可以限制所有者或组的访问——Windows 目录和文件通常是可的。

    - Linux 从一开始就开发为多用户操作系统——Windows 则从 DOS 演变为供家庭使用的单用户操作系统。

    - Linux 用户无法更改系统设置，只有 "root" 超级用户可以——Windows 用户拥有权限。

    - Linux 分区使用 Ext3 文件系统创建——Windows 分区使用 FAT、FAT32 或 NTFS 文件系统。

    - Linux 路径包含斜杠字符——Windows 路径包含反斜杠字符。例如，Linux 路径 /usr/bin 和 Windows 路径 C:\bin。

    - Linux 没有驱动器符——Windows 通常使用 A: 代表软盘，C: 代表硬盘，D: 代表光驱等。


    Linux 缺少驱动器符可能是 Linux 和 Windows 之间最大的区别——目录结构的排列方式。在 Linux 中，所有内容都包含在一个单一层级系统中，以正斜杠符号的“root”（根）目录开始。Linux
    安装在根目录下创建了许多标准子目录。这些目录每个都有自己的子目录结构，形成了一个目录“树”——如右所示，“root”目录是树的根。外设驱动器的内容出现在 Linux
    “挂载”（mounted）所在的树节点，从而创建一个统一的界面。此图描绘了 Linux 中典型的子目录——每个目录的用途在后续页面中描述。


    **注意** 不要混淆 "/" 根目录与其子目录。


    /bin

    包含较小的可执行程序（二进制文件），这些程序通常被认为是操作系统本身的一部分——但实际上并非如此。例如，当你在提示符处输入 `ls` 命令来列出目录内容时，Linux
    执行位于 /bin 目录的 `ls` 程序。该目录相当于 Windows 中的 C:\Windows 目录。


    /sbin

    包含可执行系统程序（二进制文件），仅供 root 超级用户以及 Linux 执行系统恢复操作时使用。例如，在 Linux 中维护系统时间的时钟程序位于 /sbin
    目录。该目录相当于 Windows 中的 C:\Windows\system 目录。


    /lib

    包含被 /bin 和 /sbin 目录中的可执行程序使用的二进制库文件。这些共享库对于启动系统和在根文件系统中执行命令至关重要。它们相当于 Windows
    中的 DLL 库，但不会散落在整个系统中。为支持库设置特定目录可以避免 Windows 在安装了多个库后系统混淆该使用哪一个常见问题。


    /dev

    包含特殊文件系统项，代表连接到系统的设备。这些项允许程序访问设备驱动，驱动程序对于系统正常运行至关重要——尽管实际驱动文件位于其他地方。例如，/dev/fd0
    代表软驱，/dev/cdrom0 代表光驱。


    '
