    第八章


    ## 介绍 OpenOffice 套件


    OpenOffice 套件是一个包含一组类似于 Microsoft Office 办公工具的应用程序。它基于 Sun MicroSystems 的 StarOffice
    应用程序的原始代码。他们将代码免费提供给开源社区开发，因此 OpenOffice 没有所有权束缚。OpenOffice 启动时显示的启动界面确实承认了这一渊源。


    OpenOffice 包含在大多数 Linux 发行版中。它也可以从 www.openoffice.org 免费下载——网站上还提供了清晰的安装说明。


    ![](img/79c73558c68d3c5f59b51559717db1f4_111_0.png)


    OpenOffice 有适用于许多平台的版本，包括 Linux、Mac OS X 和 Windows。


    OpenOffice 由文字处理器（“Writer”）、电子表格（“Calc”）和演示文稿（“Impress”）程序组成，这些程序与 MS Office 中的
    Word、Excel 和 PowerPoint 程序 。。它还有一个用于创建图表、图形和图形的程序（“Draw”），以及用于格式化数学公式的专用工具（“Math”）。如果你熟悉
    MS Office，你会瞬间对 OpenOffice 的等效程序感到自如。


    最重要的是，OpenOffice 包含允许其处理 Word、Excel 和 PowerPoint 等标准 MS Office 文档的文件。文件可以保存为 MS
    Office 文件格式，也可以保存为 OpenOffice 原生格式。


    它可以在文档中嵌入对象（OLE 对象、插件、视频、小程序、图表），但使用这些高级功能在尝试与另一个办公套件共享文档可能会可能会问题。例如，包含嵌入电子表格的
    OpenOffice 文档在 OpenOffice 中可以工作，但在 MS Word 中查看该文档时，电子表格可能无法显示。


    ## OpenOffice Writer 中的文档


    启动 OpenOffice，然后点击“新建”菜单，将显示可能的文档类型子菜单——对于普通的文字处理，选择“文本文档”选项。然后会出现一个新的空白文档，你可以在其中放置光标并开始输入文本内容。


    你可以使用对象栏（Object Bar）上的选项修改所选文本的外观，更改字体、大小、样式、装饰、粗细、对齐、颜色和背景颜色。还可以为列表项目添加自动编号或项目符号。


    “插入”菜单具有向文档中添加图形、超链接、表格和 OLE 对象的选项。


    ![](img/79c73558c68d3c5f59b51559717db1f4_112_0.png)


    ![](img/79c73558c68d3c5f59b51559717db1f4_112_1.png)


