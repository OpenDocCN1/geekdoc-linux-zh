    ### 更改分辨率


    更改安装时选择的分辨率在某些发行版中可能很难——但在 Mandrake 中非常简单，得益于 Mandrake 控制中心。


    要启动 Mandrake 控制中心，点击“开始”、“配置”，然后“Mandrake 控制中心”。接下来点击“硬件”项目显示右侧面板中的图标。


    ![](img/79c73558c68d3c5f59b51559717db1f4_41_0.png)


    如果你的设置允许，尝试以 1024 x 768 的分辨率运行 Linux——在较低分辨率下某些 Linux 窗口看起来很大。


    在“更改分辨率”图标上，右侧面板将显示显卡的描述以及当前的分辨率和色彩深度设置。


    点击下拉菜单选择你喜好的分辨率和色彩深度，然后点击 OK 按钮。


    更改不会立即生效——Mandrake 控制中心中的消息提示你“请重新登录 Kwin 以激活更改”。这意味着你必须重启电脑或注销 KDE 后重新登录。


    分辨率和色彩深度的范围由你的显卡支持的支持。


    ![](img/79c73558c68d3c5f59b51559717db1f4_42_0.png)


    要在不重启系统的情况下应用分辨率更改，首先点击“开始”、“注销”。现在在注销对话框中，点击标记为“以其他用户登录”的选项，然后点击 OK 按钮。


    ![](img/79c73c5f59b1559717db1f4_42_1.png)


    当登录对话框出现时，只需使用相同的用户名和密码重新登录 KDE——当 KDE 启动时将使用新的分辨率配置。


