    ## 评估硬件适用性


    在计算机上安装 Linux 之前，有必要评估其硬件规格是否适用。下表给出了处理器、内存和硬盘（HD）驱动器的最低建议配置。


    | 硬件项目 | 建议最低配置 |

    |---|---|

    | CPU 速度 | 至少 300Mhz (1.0Ghz 以上更好) |

    | 内存大小 | 至少 128Mb (256Mb 以上更好) |

    | 硬盘驱动器容量 | 至少 5Gb (10Gb 以上更好) |


    Linux 可以安装在低于这些建议标准的系统上，但性能可能会受到影响。


    计算机启动时，BIOS 通常也会显示 CPU 和内存的详细信息。


    如果计算机上已经安装了 Windows，很容易发现 CPU 和内存信息——右键点击“我的电脑”图标，然后选择“属性”打开“系统属性”对话框。详细信息在“常规”选项卡下，如下所示。


    ![](img/79c73558c68d3c5f59b51559717db1f4_13_0.png)


    要发现 Windows 中可用的硬盘驱动器容量，点击“我的电脑”图标，然后右键点击硬盘图标并选择“属性”打开“本地磁盘属性”框。驱动器容量信息显示在“常规”选项卡下。对于下所示硬盘，可以将
    5Gb 的空闲空间分配给 Linux。


    > 在此处硬盘上分配 5Gb 空间给 Linux 将不会为 Windows 的进一步工作留下多少空间。


    ![](img/79c73558c68d3c5f59b51559717db1f4_14_0.png)


    还应该考虑连接互联网的硬件。Linux 非常良好支持通过 PCI 以太网控制器或主板以太网控制器进行连接，几乎所有此类硬件都是适用的。


    遗憾的是，调制调器的问题要大得多。许多计算机配备了内置 PCI 调制调器，它们仅适用于 Windows 软件。这些所谓的“软调制调器”（winmodems）不适用于在
    Linux 中连接。如果你有一个内置调制调器并发现它在 Linux 中无法使用，你可能需要在连接之前将其更换为不同的硬件。通常最简单的解决方案是通过传统的
    RS232 端口连接外部调制调器。


    ## 1. 引入 Linux


    ## 为 Linux 制作空间


    操作系统安装在硬盘的一个定义区域，称为“分区”。当 Windows 是计算机上唯一的操作系统时，分区通常会占据整个硬盘。在这种情况下，安装 Linux 有三种选择：


    - 第一个选择是删除安装 Windows 的分区，并用占据整个硬盘的 Linux 分区替换它。这将删除 Windows 操作系统以及安装在那里的所有文件。这创建一个启动
    Linux 的专用计算机。

    - 第二个选择是缩小 Windows 分区的大小使其不再占据整个硬盘，然后在剩余空间中创建 Linux 分区。如果 Windows 分区没有缩小到当前大小之外，这将保留
    Windows 操作系统和文件。这创建一个“双启动”计算机，允许用户在启动时从菜单选择启动 Linux 或 Windows。

    - 第三种选择是向系统添加第二个硬盘。这允许 Linux 分区占据第二个硬盘，并保留第一个硬盘上的 Windows 操作系统和文件。这同样创建一个“双启动”计算机，允许用户在启动时从菜单选择启动
    Linux 或 Windows。


    ![](img/79c73558c68d3c5f59b51559717db1f4_15_0.png)


    为 Linux 安装额外的硬盘是许多人的流行选择，因为他们经常将原始硬盘升级为更大的，因此有一个备用的原始硬盘。与其他选项相比，它还有优点：


    - Windows 硬盘的空间没有缩小

    - 消除了分区调整导致数据丢失的风险

    - 保留熟悉的 Windows 操作系统

    - 硬盘故障只会影响一个操作系统


    ## 添加第二个硬盘


    大多数现代 PC 可以容纳四个 EIDE（增强型集成设备）设备，如硬盘和 CD/DVD 驱动器，但通常出厂时只有一个硬盘和一个 CD 驱动器。这意味着可以通过现有系统添加一个或两个驱动器。


    系统中的第一个硬盘被称为“主”（master），第二个硬盘被称为“从”（slave）。


    一个“跳线”连接两个微小引脚，以确定驱动器应被视为主（MA）还是从（SL）。每个硬盘的顶部通常有一个图表，显示在这种情况下需要连接哪些引脚。


    在安装第二个硬盘之前，首先确保原始硬盘上的跳线设置为主，并且宽数据线通过其末端连接到硬盘——而不是数据线的另一端。现在将第二个硬盘上的跳线设置为从，并使用数据线的另一端连接数据线。


    ![](img/79c73558c68d3c5f59b51559717db1f4_16_0.png)


    > 提示：如果你不习惯在 PC 机箱内部操作，电脑店乐意以合理的费用为你安装第二个硬盘。


    ![](img/79c73558c68d3c5f59b51559717db1f4_16_1.png)


    连接电源线并启动 PC——现在应该可以检测到两个硬盘。如果没有检测到第二个硬盘，你需要在启动时更改 BIOS 设置为自动搜索。


    ## 准备安装 Linux


    如果你选择在与 Windows相同的硬盘上安装 Linux，在开始安装之前清理磁盘是一个好主意。


    在 Windows XP 中，点击“我的电脑”图标，右键点击硬盘并选择“属性”打开“本地磁盘属性”对话框。


    ![](img/79c73558c68d3c5f59b51559717db1f4_17_0.png)


    如果 Linux 是为了替换 Windows，则不需要此操作。对于下所示硬盘，可以将 5Gb 的空闲空间分配给 Linux。


    > 在此处硬盘上分配 5Gb 空间给 Linux 将不会为 Windows 的进一步工作留下多少空间。


    ![](img/79c73558c68d3c5f59b51559717db1f4_14_0.png)


    如果 Linux 是为了替换 Windows，则不需要此操作。在 Windows XP 中，点击“我的电脑”图标，右键点击硬盘并选择“属性”打开“本地磁盘属性”对话框。


    ![](img/79c73558c68d3c5f59b51559717db1f4_17_0.png)


    如果 Linux 是为了替换 Windows，则不需要此操作。在 Windows XP 中，点击“我的电脑”图标，右键点击硬盘并选择“属性”打开“本地磁盘属性”对话框。


    ![](img/79c73558c68d3c5f59b51559717db1f4_17_0.png)


    如果 Linux 是为了替换 Windows，则不需要此操作。在 Windows XP 中，点击“我的电脑”图标，右键点击硬盘并选择“属性”打开“本地磁盘属性”对话框。


    ![](img/79c73558c68d3c5f59b51559717db1f4_17_0.png)


    对于下所示硬盘，可以将5Gb 的空闲空间分配给 Linux。


    ![](img/79c73558c68d3c5f59b51559717db1f4_17_0.png)


    ## 16. 简易步骤 Linux


    ## 安装 Linux


    本章将介绍使用流行的发行版安装 Linux 的步骤。大多数现代 PC 可以容纳四个 EIDE（增强型集成设备）设备，如硬盘和 CD/DVD 驱动器，但通常出厂时只有一个硬盘和一个
    CD 驱动器。其他发行版大致遵循相同的步骤，但顺序可能有所不同。


    - 开始安装 | 18

    - 配置鼠标 | 20

    - 选择安全级别 | 21

    - 分配磁盘空间 | 24

    - 创建分区 | 24

    - 选择要安装的软件包 | 26

    - 设置根密码 | 28

    - 创建用户账户 | 29

    - 设置自动登录 | 30

    - 安装引导加载程序 | 31

    - 总结安装 | 32


    ## 第二章


    ## 开始安装


    Linux 安装通过从 CD-ROM 启动计算机开始。这需要计算机 BIOS（基本输入输出系统）设置为在使用硬盘之前从光驱启动。如果你的计算机从硬盘启动（如它通常的那样），你将需要更改
    BIOS 设置。


    启动计算机通常会提示你按哪个键进入 BIOS 工具——Delete、F1、F2、Insert 和 Esc 是常见的键。通常在第一次开机内存测试后按住 Delete
    键进入 BIOS 工具。从 BIOS 工具菜单选择高级功能来显示启动设备顺序。启动顺序需要将光驱放在硬盘之前，因此可能需要更改为：


    | 第一个启动设备 | CDROM |

    | 第二个启动设备 | HDD-0 |

    | 第三个启动设备 | Floppy |


    保存新设置并退出 BIOS 工具。计算机现在将重启，并首先从光驱查找启动指令。


