  - '[PAGE 187]


    # Linux resources


    The examples in this book hopefully demonstrate that the free Linux operating
    system, the open-source applications bundled with most distros, are perfectly
    capable of performing all the routine daily requirements of most desktop users.


    Additionally, those features of Linux that are not available in other operating
    systems present new exciting possibilities.


    Fittingly, for a network operating system, there are abundant resources on the
    Internet that help you discover more about Linux. The most obvious first call
    is the website for your distro – for instance, Mandrake Linux users should visit
    the website at www.mandrakelux.com.


    ![](img/79c73558c68d3c5f59b51559717db1f4_187_0.png)


    Disk ISO images of most freely-available Linux distros can be downloaded from
    www.linuxiso.org. These can be burned to CD-ROM to produce a Linux distribution
    installation set.


    A wealth of general Linux information can be found on the Linux Online website
    at www.linux.org. This includes links to lots of Linux application home pages,
    downloads and documentation.


    Help on all Linux matters can be sought from the vast community of Linux users,
    developers and enthusiasts in the Linux Forum at www.linuxforum.com. This site
    hosts many individual forums on specific Linux topics troubleshooting hardware
    and distribution-specific issues.


    ![](img/79c73558c68d3c5f59b51559717db1f4_187_1.png)


    You can read all the latest Linux developments on the Linux Today at http://linxtoday.com.
    This excellent site is updated daily with Linux news from the world.


    Lots of interesting articles about Linux appear in the monthly printed publication
    "Linux Magazine". Worldwide subscription is available at www.linux-mag.com, where
    you can also read some great feature articles.


    These, and many more, online resources let you keep pace with the latest innovations
    as Linux continues its progress into the desktop operating system market. They
    can help develop your skills to take full advantage of the power and flexibility
    that Linux offers – created and backed by the global open-source community.'
