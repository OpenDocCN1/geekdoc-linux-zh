  md: '# # Track the International Space Station


    # ## Use a Raspberry Pi and Astro Pi HAT to code the winning ISS-tracking program


    British astronaut Tim Peeke has been preparing and training for his stay on board
    the ISS, which begins in December 2015. The ISS orbits at around 400km above earth
    at an incredible speed of 17,150 km per hour, so for part of his six-month mission,
    he will run a number of Astro Pi experiments created by schools, students, and
    individuals.


    The Astro Pi has been designed and built specifically for this LED hardware. Each
    experiment will generate and collect data which in this tutorial, you will be
    introduced to a program to track the longitude and latitude of the ISS in real
    time. If you do not have an Astro Pi, skip to step 9.


    +   01 Install the Astro Pi

    * Attach the HAT to the GPIO pins and install the Astro Pi in software, downloadable
    from the Astro Pi site.

    * Boot up your Raspberry Pi, connect via SSH to terminal and follow the code below
    on one line. On completion, reboot Raspberry Pi, typing `sudo reboot`


    02 Example program

    The software comes with a few programs that can be used to test that the Astro
    Pi is functioning correctly and demonstrate some features of the board. The example
    programs are stored in the `/home/astro-pi/hat/` folder and run in Python 3.


    The Astro Pi has a built-in thermometer that can be easily read and return the
    current temperature. The sensor is sensitive to the CPU and may pick up some residual
    heat, however the reading is sound. To measure the temperature on the Astro Pi,
    use your Python 3 editor and then save and run it. The current temperature reading
    will be returned in the shell.


    ```

    from astro_pi import AstroPi

    ap = AstroPi()

    temp = ap.get_temperature()

    print("Temperature: %s C %c percent")

    ```


    # 04 Compass reading


    One of the nifty sensors on board is the compass. This can be used to return a
    measurement of the Astro Pi''s position relative to magnetic north. The code in
    line (3) returns the position which is stored in a calibrated value. The value
