    > The Novena is built from entirely open hardware and runs fully open software
    – right down to the firmware and bootloader


    Considering the do-it-yourself approach to the hardware, the software comes as
    a surprise. A preloaded microSD card holds a Debian-based operating system, which
    walks you through configuration at first. Minutes later, you''re ready to log
    in either a console or some graphical session. The Novena is unlike any other.
    Its aluminum and plastic casting resembles a chunky laptop, but backwards: the
    LCD panel can sit flat against the chassis for wall-mounting purposes, but at
    the preset it is a little strange. The screen (which catches) flips upwards on
    a gas strut to a comfortable angle for desk-based use.


    +   - far faster than the quad-core Raspberry Pi 2 at 29.6gms, but it is still
    an order of magnitude slower. Its primary selling point, alongside itself, is
    its hackability. A high-speed port on the board allows connecting to a Raspberry
    Pi-compatible GPIO header during development, joined by a Xilinx Spartan-6 field-programmable
    gate array.


    # Pros


    Amazing flexibility and a truly open approach make the Novena a unique and attention-grabbing
    machine, perfect for hackers


    # Cons


    Its general-purpose hardware lacks built-in- devices. Its price is unjustifiable
    and somewhat hard to justify


    # Summary


    The Novena Desktop is in very short supply. For those who want it, it''s impossible
    to beat: its open nature, custom lightweight laptop-board FPGA with USB ports
    to educational tasks. Its high price and lack of portability make it difficult
    to prevent taking over as a day-to-day system for many enthusiasts.


