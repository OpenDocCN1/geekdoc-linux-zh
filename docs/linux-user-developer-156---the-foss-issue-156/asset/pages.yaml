    Your source of Linux news & views


    # OPINION FREE SOFTWARE


    # # Post-scarcity world


    “To change something build a new world that makes the existing one obsolete” –
    R. Buckminster Fuller


    > The concept of ''intellectual property'' and its ownership is a subject that
    has always been beset with paradox.


    Information needs to be free, and copyright should impose limitations on the distribution
    of information. In the ephemeral world of the internet information is free and
    shared in digital formats, the ownership of data and technology really has little
    meaning.


    As the creative industries have found, when a creative work is no longer restricted
    to a hardcopy, such as vinyl or paper, it becomes harder to impose rules on distribution.
    If it is copied and pasted into anywhere, and lack of scarcity makes its monetary
    value almost to nothing.


    The artist or creator, a pioneer of this network loses control of her work and
    how it is used. The Internet gives us information at our fingertips at low cost.
    We can access films, music and games following the wildest dreams of many years
    ago. We can only gain from this – a price is paid. It returns not to account for
    the contents to the creators but the distribution of the same content is free
    for all.


    This type of effect has the diminishing value of work, which has found implications
    beyond the industries that rely on the concepts that are lately termed ''intellectual
    property''. Globalization, automation and technology mean work in the workplaces
    everywhere is increasingly becoming a devalued and desolate zone for labor.


    Two centuries ago, Benjamin Franklin predicted that the technological advances
    of the late 1700s would lead to a four-hour working week. A century later George
    Bernard predicted that by the year 2000 we would have a two-hour day. This has
    always been the promise of the post-industrial society,


    that leisure would be the priority and the hours of work would be reduced. But
    this hasn''t happened. Instead, we are living in a golden age for the service
    industries and competition where people work and longer hours for less reward,
    and often with less tangible purpose.


    Richard Hoffman argues that the new responsibilities of the post-scarcity world
    are upon Gu Munfetti. In the long run, making programs free is a step toward the
    post-scarcity world; he wrote, “nobody wants to work for free. People will be
    free to devote themselves to activities that are fun, such as meeting the necessity
    of earning a living such as legislation, community building, robot repair and
    astrophysics. Prospecting then we will be able to make a life living from programming.


    In 1970, the inventor and systems theorist Buckminster Fuller made a very specific
    statement: ''We are keeping jobs because of this is false. To work is some kind
    of tragedy, according to materialistic Darwinian theory, he must justify his right
    to exist. We have inspectors of people and inspectors of work. The true business
    of people should be to go to school and learn what it is worth not to have somebody
    come along and tell them had to earn a life''.


    Stallman also reduces the amount of work that the society does for its actual
    purpose, but only part of this has translated into leisure because non-passive
    activity is required to accomplish anything. Free of this bureaucracy and asymmetric
    struggles against competition. Free software would greatly reduce these drains
    of software production and, in turn, gains to translate into work for us.


    Maybe such ideas are a bit unrealistic, but they are not without merit. We leaps
    in technology absolutely have to be reciprocated by leaps in ideas about the way
    our societies.


    # Richard Hoffman


    writes about art,music,digital.


    # We are living in an age for the service industries and consumerism, where sectors
    of the population work longer and longer for less and less reward


