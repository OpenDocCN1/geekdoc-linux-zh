    # Build a radio transmitter


    Take advantage of the interference-blocking feature and make your mark on the
    airwaves


    Back in the 1960s, offshore boats were used to broadcast what was known as ''pirate'':
    unlicensed broadcasts that provided an alternative to the BBC''s locked program
    (as the most popular radio station of its time). Pirate radio was what inspired
    Radio 1 and commercial broadcasting but these days you don''t need a boat to pursue
    your DJ dream – just a Raspberry.


    Add a basic antenna, an SD card with MP3 tunes saved to it, plus a script to automate
    playback, and you can follow in the footsteps of John Peel and Tony Blackburn.


    This is an all-DIY project, one that has plenty of DIY as the usual SD card crafting.
    You''ll also need a battery pack, and it''s worth your DIY collection of AA batteries
    demonstrated previously in USA.


    One of warning: unlicensed broadcasting on the FM band is an offense. This tutorial
    is merely a proof of concept – one that might be used for a school radio project,
    for instance.


    # What you need


    +   - Jumper wire

    - 2mm wire

    - Heat shrink tubing

    - Soldering iron

    - Wire cutters/strippers

    - Hair dryer/heat gun

    - PiRadio bit.ly/3MWvxxpp

    - PirateRadio.py script bit.ly/15Tkkech


    Below Our homesmade antenna looks a little rough around the edges, but it works
    great!


    # 01 Gather your equipment


    By downloading the PIMF file this is 2.3GB, so if you''re on a slower connection
    then you''ll need to get it downloaded. Meanwhile, source an antenna. This might
    be a wire hanger, 2mm wire from your local electronic component store. While you''re
    there, grab heat shrink tubing and some jumper cables, ensuring you''re prepared
    to start the project.


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_63_1.png)


    # Build a case


    Okay, so you''ve already got a suitable case for your Raspberry Pi, but why not
    and put together a new case for this project? It''s a great chance to take inspiration
    from the broadcast motif and design one with the Pi and the genuine antenna inside
    it. Alternatively, a Mason jar or any other suitable wide-necked jar will also
    make a great home for the PIMF – just drill a hole in the lid for the antenna!


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_63_2.png)'
