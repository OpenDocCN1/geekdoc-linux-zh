    # 09 Configure the Pirate Radio


    With the SD card inserted into your Pi, open the pirateadio.config file in a text
    editor. Look for the frequency and setting as you need. You will need to set this
    to a frequency that is currently unoccupied, switched on FM radio, find some free
    space and change the pirateadio.config file as necessary. Save and exit the file
    when you''re done.


    # 08 Copy your MP3 files to SD


    You cannot simply dump your MP3 files on the SD. With your flashed SD inserted
    into your PC reader, copy the /Pirate Radio partition of the card and paste your
    copies onto it.


    # 10 Random and continuous


    If you want to add a bit of music to SD for pirate radio, you may want to use
    the shuffle and repeat, all settings in the pirateadio.config file. By default
    these are set to true, so to disable them you only need to change them to false.


    Beyond simply using numbered MP3s, you can also drop in named folders from your
    music collection containing entire albums or artists.


    Save when you''re done, and remember to remove the SD card removing from your
    computer.


    # 11 Stereo or mono?


    The pirateadio.config file offers the choice of setting a true or false value
    for the stereo_playback. Choose this carefully, as it will determine quality and
    range for your broadcast.


    Set to true, the broadcast will be of superior audio quality. However, the broadcast
    will be reduced as additional power'
