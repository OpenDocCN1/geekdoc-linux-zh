    # 06 Connect the antenna


    The antenna is connected to pin 4 on your Raspberry Pi''s GPIO. Before you do
    that, check that your Raspberry Pi case is suitable for high profile GPIO connections.
    If not, consider using length of wire and mounting it on top of your case with
    an adhesive back-strip, or perhaps just tape it to the side of your case. As long
    as the antenna has a connection to pin 4, you''re good to go.


    Multiple audio formats


