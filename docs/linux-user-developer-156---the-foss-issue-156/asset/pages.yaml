    of QupZilla is that most of the things will just not work |

    | Overall | Perhaps it is still better than Conqueror... | 4 | A basic-Elementary
    structure, but no more than | 9 | An undiscovered gem of the web with excellent
    performance | 6 | Perhaps the most viable Qt-based browser |


    # # AND THE WINNER IS…


    # ## SeaMonkey


    In fact, SeaMonkey should be referred to as SeaMonkey Navigator, the whole suite
    includes not only a browser, but an email client, FTP transfer tool, HTML editor
    and some other features. SeaMonkey feels like a legacy product because it makes
    the Internet feel as it was back in the Netscape days (example, you search in
    Google light from the address bar – you have to use search field). If you get
    it to (or wish to do it), the application will show its strong: it is robust,
    has a large gallery of extensions and its interface is easily customisable – the
    main benefit is hidden inside. SeaMonkey is built with the engine that was used
    in modern Firefox. This means that the browser is fast, standard-compliant and
    equipped with the modern web.

    When you first launch it, you might notice some speed issues, especially when
    you visit a website for the first time, and this makes some people think that
    SeaMonkey is sluggish -


    > SeaMonkey is a fine replacement for your current web browser


    just stop after checking its cache usage. In fact, SeaMonkey caching mechanism
    works simply differently. It does not just like the Chrome way – where everything
    leaves quickly, the browser''s system processes eat too much memory – it works
    with a moderate amount of RAM and intelligently caches on the first visit. Later,
    on when you come back to a page, it will load. SeaMonkey is included in many Linux
    distributions, along with other applications of in the Mozilla style. Check your
    package manager or download a seamonkey-project.


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_77_0.png)


