    stack (virtual machines and all). Head over to official GitHub page and you will
    find 274 public repos. It''s very difficult to choose just a few for this space,
    but here are some of the most impressive.


    HHVM, the Hip Virtual Machine, is one of the most talked-about open source projects
    from Facebook. It is designed to execute programs in PHP and Hack (an open source
    language by Facebook). The major advantage it has is the just-in-time compilation
    technique that enables optimisations not


    possible in statically compiled code. Though HHVM has a few minor incompatibilities,
    it can run most of your PHP code straight out of the box.


    Fb-lo is another offering out of the 274 from Facebook—Fb-lo that lets you live
    code right out of your browser. Fb-lo is made up of server and client components—the
    server watches files for changes, which are then mapped into the client to update
    the running app. It is currently a Chrome extension that recompiles the changes
    by the server and so you have your code-patched.


