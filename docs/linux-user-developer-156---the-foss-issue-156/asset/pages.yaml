  md: '# How do I make it recompile all files, if the makefile is looking at the timestamp
    of each file even though are not modified at all?


    # Quick compiling


    While running a file or build, a rule is generated (let''s say from a to) and
    placed into /path/code/; if you then modify what needs to be the files, they are
    overwritten by the created files. As a result, they are not updated, leading to
    problems where not all of the files are compiled. For some reason timestamps determine
    what needs to be included when compiling and won''t work recompiling.


    How do I make it recompile all the files, if the makefile is looking at the timestamp
    of each file even though are not modified?


    You can force the makefile to look for timestamps, which should sort this problem
    for you. You can do this with:


    ```

    $ make -T

    ```


    Only use this when you are recompiling, though.


