  md: '# # BIG DATA

    # Red Hat scale-out solutions to meet the large-scale requirements of Ceph


    Promises to address the requirements of enterprise customers


    **Red Hat has officially released updated versions of its Ceph and Gluster storage
    products**, Ceph Storage 1.3 and Gluster 3.1, which allow customers to grow a
    larger size of the business.


    "Open, software-defined storage is one of the best ways for enterprises to design
    and deploy scale," said Ranga Rangasari, president and general manager of storage
    and data at Red Hat, as the updated projects were unveiled during the Red Hat
    Summit. "We are pleased to respond with our customers and drive with Red Hat storage
    products that help them manage exponentially growing capacity requirements, securely
    across the enterprise. With the new features in Red Hat Gluster Storage and Ceph
    Storage 1.3 deliver uncompromised performance at scale to meet customers worldwide."


    Ceph 1.3 includes important between improvements including improved rebalancing
    logic to prioritise data integrity over other functions, the ability to pause
    rebalancing, and sharing of bucket metadata. Performance improvements courtesy
    of SSD handling other patches by Intel and SanDisk, while others improve boot
    times for virtual machines using read-ahead caching and sustained performance
    through fragmentation minimization.\n

    Gluster 3.1 adds support for erasure-coded dispersed storage which reconstruct
    data on demand elsewhere, where Red Hat can reduce the need for RAID and down
    the total cost of ownership by up to 75 percent compared to traditional automated
    data striping, bit-detection scanning, and support for SELinux in enforcing mode.


    # # COPYLEFT

    Canonical adds

    nGPL term clause


    Canonical, creator of the popular Ubuntu distribution, has settled its long-running
    dispute with the Free Software Foundation and the Software Freedom Conservancy
    over its intellectual property, by adding a ''truce clause'' for GNU General Public
    License.


    Under this policy, the GPL includes a clause specifying that "where any other
    license grants, this policy does not modify or reduce those rights under licenses"
    - a hard exception to the usual GPL rule.


    The Free Software Foundation, however, was not happy with it. "The FSW acknowledges
    that the first issue emerging from the policy - its interference with users''
    rights under the GPL and potentially cover other licenses within Ubuntu - the
    policy prevents freedom for others,"" the group said in a statement on the matter.
    "The FSW will continue to provide feedback to Canonical in the days ahead, and
    urge them to monitor any changes."


    "Canonical, in ours, repeatedly expressed that it is their full right to develop
    heavily contributed by community projects, and not to interfere with the exercise
    under any copyright license works within Ubuntu. While we appreciate community
    development, we will follow the policy so that users, to the extent possible,
    know their rights in advance rather than having to inquire about or negotiate
    them."


