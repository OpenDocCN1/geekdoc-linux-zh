  md: '# # find prime numbers


    There are many ways to locate prime numbers – up to a limit – as well as to optimize
    the process. Here are a few of them


    > This article is about finding prime numbers up to a maximum. Although the problem
    of finding prime numbers looks relatively easy, a lot of debugging took place
    during the writing of this article. Prime numbers are mainly used in cryptography
    but they are also used in coding theory, random number generators, correcting
    codes and hashes. The limit is given as a command line argument to the program
    command line arguments are passed to the C program as strings. The following code
    converts the string to an integer:


    ```

    int limit = atoi(argv[1]);

    ```


    None of the programs check for errors on the input; they just assume the command
    line argument is an integer greater than zero contains no special characters,
    spaces or unicode characters. Also, a function is used. The isPrime() function
    successfully checking that both 1 and 2 are prime, the loop for the main function
    starts searching odd numbers from 3; therefore, 1 or 2 will not be in the result:


    The first approach (isPrime) is pretty naive, as you will see well. It checks
    every integer from 2 up to the limit. The implementation of an algorithm checking
    if an integer is not divided by any number from 2 to n-1, but only by numbers
    up to the square root of n. This makes the algorithm almost as fast.


    A third approach (prime2) is much better as it does not ensure that numbers are
    divided by 2 but the loop for the main function starts with (int i=3; i*i<=limit;
    i+=2). The isPrime() function is the same as in prime.


    The fourth approach (prime3) is even faster. This is done by examining the input
    with isPrime() with few even numbers. The relevant part of the following is:


    ```

    float temp = sqrt(number);

    int j = (int) temp;

    ```


    As you can see here, integers that go up to the square root of the number you
    examine are considered potential factors.


    The implementation of the isPrime() function as found in prime2.c contains the
    following code:


    ```

    if (number % 2 == 0)

    return (number == 2);

    ```


    This is a clever way of saying that if number is divided by 2, then it is a prime
    only if it is not 2. You can do the same with other prime numbers.


    ```

    prime.c ml(0.669s user 0.876s)

    prime.c ml(0.000s user 0.002s)

    prime2.c ml(0.008s user 0.002s)

    prime2.c ml(0.873s user 0.869s)

    prime3.c ml(0.009s user 0.005s)

    ```


    It is now time to perform benchmarking with the user time.


    It is interesting to compare prime2 and prime3. There has no significant difference
    in execution time. This is because prime3 cuts out even numbers that are tested
    by the isPrime() function, which does not help much because the bottleneck is
    the calculations performed by the isPrime().


    As you can understand, if the integer number is even the function is very fast.
    This method is only efficient when dealing with odd numbers. A proper sieve would
    show that for 454,852,581 numbers, prime4 would be much faster than prime3.


    > Despite the fact that there are many ways to optimize a problem, it is better
    to get by step instead of searching for the perfect solution from the beginning


    The source code is at github.com/mactsouk and files.co.uk/linux-115.


