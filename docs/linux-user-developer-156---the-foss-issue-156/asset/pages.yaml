    BASIC, prolific during the late Seventies and Eighties to the popularity of the
    8-bit BBC Micro, was the language that kickstarted the industry we know today.
    Many programmers then moved on to more complex and powerful languages like C++/Java
    etc, games consist too over the home computer market and BASIC was also forgotten,
    but it''s not surprising to see why the UK government is desperately trying to
    get kids coding – resources are really very thin on the ground and we are outsourcing
    programming tasks later on. There has never been a better time to become a programmer.
    You''ll find no better introduction than learning to program a game, so start
