    # TOP FIVE

    Features in

    Linux Kernel 4.2


    # 1 AMD''s GPU driver


    AMD''s next-generation open-source DRIM driver enters the mainline for the first
    time with Linux 4.2, introducing support for the Radeon R285 graphics processor
    and all future graphics processors embedded in AMD units. Although compatibility
    for older hardware is limited, it''s a major step for AMD''s support of open source.


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_6_0.png)


    # Canonical denies IP

    policy problems


    “Not violating our policies to use Ubuntu with Docker”


    Canonical has officially responded to claims that its Ubuntu Linux distribution
    cannot be distributed in modified form as a Docker or other container format,
    denying that violates their policies.


    “If you generate a container that is not a 100% unmodified version of Ubuntu,
    Canonical must insist you ask them for permission to distribute it,” says Christopher,
    who claimed in a blog post the issue. “The only alternative is to rebuild every
    binary you wish to share, removing all trademarks in the process.\”


    “I am speaking for my employer, Canonical, when I say we are not violating your
    policies if we use Docker,” Kirkland responded in an official statement. “What
    others have claimed, however, is defacto simply sensationalist and untrue. Canonical
    publishes Ubuntu images for Docker specifically so that they will be useful to
    people. We see no conflict between our policies and the common sense we use of
    Docker.\”


    “Canonical employees have said that Docker images inherit from the official Ubuntu
    image are fine


    Those whose use may violate Canonical''s IP policy—especially the distribution
    of Docker images—are advised to contact the company for guidance, or to follow
    Garrett''s advice to benefit from Debian instead.


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_6_1.png)


    Above The Radeon

    R9 processor is now\supported by AMD


    # 2 Wider GPU compatibility


    The new kernel adds support for Intel''s Broadcom-based Atom-on-chip and various
    ARM-based SoCs from Freescale, HiSilicon and Rockchip. It also adds support for
    the Synapse-embedded-kernel to HIBU kernel, while improving performance for other
    platforms.


    # 3 More input options


    Using the latest kernel, users can enjoy support for the Sony Motion Controller,
    Legion Mouse M500, and other devices. The latest controller allows a better path
    for gaming Valve Software.


    # 4 Improved NO


    Even when using F2FS, Linux 4.2 has good news for SSD devices that support native
    queueing (NOQ) of TRIM commands, which can be enabled/disabled using mount options.


    # 5 Added to F2FS


    Support for encryption on a per-file basis using fscrypt for F2FS has been added
    to Linux 4.2, which also includes changes to the file system''s handling of TRIM
    commands in recovery for broken snapshots.


