  md: "# Set up the balloons\n\n# Draw the sprites\n\nThe initial data array to get\
    \ things running smoothly. Here we set up an array to store all the information\
    \ needed about each. In this case, we have the sprite ID, X position, Y position,\
    \ speed, value, active and pop mode. This section explains the code in the previous\
    \ section to get an idea of how these variables are labeled.\n\nThe order that\
    \ sprites are created is in the order they will be displayed on the screen. If\
    \ you want them to be of any other order, create it. You can make a transparent\
    \ colour using setSpriteTrans(255, 255, 0). The transparency allows you to make\
    \ sure sprites don't obscure others when they overlap.\n\n```\nDEF PROC setBalloons\n\
    minX = bw * 2\nmaxX = gwidth * 2\nstep = (bmaxX - bminX) / 20\nctr = 0\nFOR n\
    \ = 0 TO 20 STEP step\nctr = 3, ; y = gheight - 4\nctr = 40, ; y = gheight - 2.5\n\
    ctr = 70, ; y = gheight - 2\nctr = 100, ; y = gheight - 1\nctr = 130, ; y = gheight\
    \ + 5\nctr = 160, ; y = gheight + 10\nctr = 190, ; y = gheight + 15\nctr = 220,\
    \ ; y = gheight + 20\nctr = 250, ; y = gheight + 25\n```\n\nUnderstanding the\
    \ sprites is important. You will need to use them to control the sprite from the\
    \ screen. Far more convenient is to use the origin: setSprite(pop, getSprite(pop)\
    \ / 2) and then getSprite(pop, 2); as this sets the angle of the balloons. Other\
    \ important sprites include setSize, setAngle and advance-information which can\
    \ be found in the Programmer's Guide.\n\n```\nDEF PROC drawSprites\nFOR n = 0\
    \ TO 20\ngetSprite(n\n```\n\n![](img/f16f9d3399c2c447b8fa7812e3edd8d8_70_0.png)\n\
    \n![](img/f16f9d3399c2c447b8fa7812e3edd8d8_70_1.png)\n\n![](img/f16f9d3399c2c447b8fa7812e3edd8d8_70_2.png)\n\
    \n![](img/f16f9d3399c2c447b8fa7812e3edd8d8_70_3.png)\n\n![](img/f16f9d3399c2c447b8fa7812e3edd8d8_70_4.png)\n\
    \n```\nplotSprite(ctr, 0, b, ctr, 2, b, ctr, 3, b)\nplotSprite(20, 0, b, 20, 20,\
    \ b, 20, 20, b)\nplotSprite(40, 0, b, 40, 20, b, 40, 20, b)\nctr = ctr + 1\nUPDATE\n\
    ENDPROC\n```\n\n# Set up the game\n\nThe main section configures the game and\
    \ updates, loads the background image and defines various variables, including\
    \ the balloon arrays and indices that follow the previous section. It is worth\
    \ revisiting this section once you have finished putting Spike Pop together, because\
