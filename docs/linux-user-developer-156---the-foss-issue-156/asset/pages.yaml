  md: '# GNOME and Cinnamon


    For any desktop that uses a GNOME-based environment, like GNOME itself, Unity
    and Cinnamon, you can add scripts to the startup list. From here click Under Start
    Applications and here add the script. If you want to run it again to test it,
    give it a delay so that GNOME has a moment to properly load before trying to execute
    the command.


    > Since we want the script to run when everything is booted up, we should instead
    use the desktop environment''s startup functions


    tab at Startup and this is where we need to put the script. Click on Add Script
    and browse to its location. Once you''ve found it, check the Run On option to
    Startup and save the rule. You can test it by logging out and back again.


    # Other desktops


    Different desktop environments use different methods to launch apps at startup
    – most of them are similar to the method above, but with others you may have to
    edit files to get them working. Your best bet is to look at the documentation
    for the desktops and see how you should get the script to be run at startup.


    # Listen to music


    With all this, your music listening experience should be a little better throughout
    the day. Remember to keep your playlists or add more every now and then. Also,
    don''t be afraid to turn off the script you''ve chosen for the day and use yours.
    You can use other media players if you want to take advantage of their different
    functions.


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_44_0.png)


    # KDE


    Adding a script code to KDE is largely the same as GNOME, though you will need
    to differentiate between a program and a script within your system. In the KDE
    Settings, look for the Startup and Shutdown menu, the first


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_44_1.png)


    Your desktop of choice will have its own means of adding scripts to startup'
