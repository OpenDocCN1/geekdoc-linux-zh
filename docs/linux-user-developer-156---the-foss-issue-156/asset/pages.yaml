    \nDIM b(60, 10)\nballoon = 0\bVarID = 0\nbVarDir = 1\nbVarCtr = 0\nENDPROC\n```\n\
    \n![](img/f16f9d3399c2c447b8fa7812e3edd8d8_70_5.png)\n\n# Clean\n\nThis final\
    \ routine clears and resets all the sprites, at the end of each level and at the\
    \ start of a new level.\n\n```\nDEF PROC hideSprites\nFOR n = 0 TO HIDE\nsetSprite(n,\
    \ 100)\ncreateSprite(n, 0)\nhide(n)\nNEXT\nPROC\n```\n\n![](img/f16f9d3399c2c447b8fa7812e3edd8d8_70_6.png)\n\
