    # Working with RSS feeds


    Learn how to build a ticker with Raspberry Pi and a display to keep track of your
    social media


    > There are many projects around the Internet that use the Raspberry Pi as the
    engine for ticker-type devices. In this way, you can easily track Twitter or Facebook
    feeds. While most of them take much time, we will look at another approach. Firstly,
    making network connections and parsing RSS feeds is beyond the scope of such a
    short article. Instead, we will use the Python ''Universal Feeder'' library.


    element(feed[''title'']); The feed of the returned object contains information
    about the RSS channels as a whole. This includes the title, other, link, and the
    published date for the feed. If you do not want to use an LCD device, you might
    prefer a different media type like a simple rolling ticker type of device. You
    can use a banner module to get the classic comic look to do this type of display.
    In this article, we will use an example of a feed with multiple fonts to print
    the data to the screen. Then we will within your Python program, you can use something
    like


    Joey Renard


    a true renaissance between building feeds for researchers with scientific computing
    problems and writing Android


    # Why Python?


    It''s the official language of the Raspberry. Read the docs at python.org


    entries_list = feed[''entries'']


    Each of these entries has a number of values. The individual articles have a title,
    a link, and a description with some article. In most cases, these entries are
    marked with a kind of one or another. There is also a published date, if you want
    to see when the article was based on. Depending on what you want to display, you
    can just loop through and print the title that you want.


    ```

    from feedparser import feed

    f = feed.parse(''sample text'')

    ```


    ```

    print(f.render(''sample text''))

    ```


    Now that we have collected the data, we need to display it. If you are using an
    LCD device with a scrolling ticker reader, there are several modules you can use.
    In this article, we use the RLCD module. This module is perfect for Raspberry
    Pi. In this order, we will use the RLCD module to build to your RSS feed. We will
    use the GPIO pins to write a string to the LCD with something


    ```

    sudo apt-get install-feedparser

    ```


    If you are using else, you can always use and install it directly from feedparser.

    Once you have parsed the feed, you need to start by displaying the feed you want
    to read. While feeds are complex, you can read from a file, or a string object,
    the thing we are interested in is reading the RSS data to the most recent entries.
    The most basic form of this looks like this:


    ```

    import feedparser

    ```


    ```

    feed = feedparser.parse(''feedparser.org/examples/atom.xml'')

    ```


    This gives us an object to start processing the data by this RSS feed. For example,
    you can get the title of the feed


    ```

    from RLCD import charLCD

    ```


    ```

    lcd = charLCD()

    lcd.write(''Test String'')

    ```


    This means we can display anything for display, as long as it has an LCD connection.
    Here is a medium number of characters available to show and personalise the look
    of your very RSS feed. The RSS feed will be parsed by Python how it is, in some
    number of characters. If you are using a smaller screen, you might need to think
    about how to handle it


    Now that we have used the Universal Feeder Party, we need to learn how to display
    the data. We can see any news that may come our way from the Internet. And with
    text and font, you can make the LCD look how you would like. This could be something
    like using a full screen or a line like an old calculator. The really nice thing
    is that you can use your original Raspberry Pi news feed display whatever you
    want about it, or in a more advanced fashion. Honestly, this will inspire you
    to add your own news readers to your home or workspace.


