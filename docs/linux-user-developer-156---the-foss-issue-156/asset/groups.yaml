    # GOOGLE


    ## We know Android and Chrome since we use daily, but Google has more to offer


    Google is one of the biggest contributors to open source software. Some of its
    most sought-after products like Android, Chrome and more are open source, and
    Google consistently encourages more people to contribute to the open source cause.
    If you are not aware of Summer of Code, Code-in, you now are. Google Summer of
    Code (GSoC) is a global program that helps developers write code for open source
    projects. Since 2005, GSoC has brought over 2,500 successful contributors from
    101 countries. This year''s GSoC is over, but if you are interested in open source
    then you should definitely try it in the next year.


    Google has another program for students in the age group 13-17, where there are
    smaller tasks to get them introduced to the concept of open source. Code-in has
    in


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_14_0.png)


    been running since 2009, and this year''s Code-in has not started yet - if you
    or someone you know is a good fit for the program, keep an eye on the Code-in
    website.


    Regarding open source software released by Google, one Kubernetes, has recently
    made waves with the 1.0 release. After Google coding and donating to the Cloud
    Native Computing Foundation, Kubernetes, launched in February 2014, is now production-ready.


    Other notable projects are Tesseract, one of the best open source OCR currently
    running with support for 39 languages, and Golang, one of the best languages for
    concurrency and server-based applications.


    # MICROSOFT


    ## TypeScript


    TypeScript, developed and maintained by Microsoft, is supported as a JavaScript
    superset. In simple terms, it''s for more than JavaScript; it''s compiled, you
    get JavaScript code that runs on anything. So, what are the extra things you can
    do with TypeScript? For example, you can create modules, use interfaces and find
    errors for number sets. Advanced TypeScript allows you to use better tools for
    almost any programming approach. This means that you can use the object-oriented
    approach for new module code. This will be just the tip of the iceberg, as you
    can dig even deep in the official TypeScript language for more details.


    ## Microsoft doesn''t copy when we talk of open source projects, but these things
    are changing


    With the new CEO claiming, ''Microsoft loves Linux'', it is clear that Microsoft
    has slowly embraced the open source culture. As per the Openviews statistics,
    22% of the virtual machines on Microsoft Azure are Linux and the VM has more than
    1,000 Linux instances. Azure also has first-class support for open source languages
    like Java, Python, Ruby and Node.js.


    Microsoft also offers open source-one of its offerings - the .NET core as it is
    bringing it to both Linux and OS. Open-source code includes the .NET Common Language
    Infrastructure (CLR) runtime, garbage collector and Base Libraries. These libraries
    mean that you can use and build your code on other platforms like Linux, OS etc.
    while still using ASP.NET.


    Microsoft hosts two of the most well-known container-based programs: Kubernetes
    and Docker. And yes, the future looks bright for open source in Microsoft.


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_14_1.png)


    www.linuxuser.co.uk


    15


    # FACEBOOK


    ## Feature Open source guides


    ## Facebook never bats an eyelid when it comes to acknowledging its open source
    roots


    When Mark Zuckerberg wrote the first line of code for Facebook, he did it in PHP
    and MySQL as the database. Facebook have moved miles ahead, one thing has not
    changed—the company''s commitment to open source rather has increased with time.


    Note that Facebook doesn''t just share tools with its website—it opens its own
    stack (virtual machines and all). Head over to official GitHub page and you will
    find 274 public repos. It''s very difficult to choose just a few for this space,
    but here are some of the most impressive.


    HHVM, the Hip Virtual Machine, is one of the most talked-about open source projects
    from Facebook. It is designed to execute programs in PHP and Hack (an open source
    language by Facebook). The major advantage it has is the just-in-time compilation
    technique that enables optimisations not possible in statically compiled code.
    Though HHVM has a few minor incompatibilities, it can run most of your PHP code
    straight out of the box.


    Fb-lo is another offering out of the 274 from Facebook—Fb-lo that lets you live
    code right out of your browser. Fb-lo is made up of server and client components—the
    server watches files for changes, which are then mapped into the client to update
    the running app. It is currently a Chrome extension that recompiles the changes
    by the server and so you have your code-patched.


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_15_0.png)


    # INTEL


    ## Build world-class hybrid apps with Crosswalk


    Intel mainly comes to mind as a hardware company, but it does a lot of work on
    open source software


    As more and more new devices are launched every year, there is an increase in
    the overall number of devices. This means more for developers—you already know
    how tough this is. Intel is inside Android, iOS and Windows, providing HTML, CSS
    and JavaScript features and APIs that you use when building websites and also
    add custom features by the platform you are developing for this means the best
    of both worlds.


    Intel is one of the core members of the Tizen strategic group; platinum sponsor
    for the Open Foundation, one contributor to Linux Graphics, three contributor
    to Android the world. This list could continue for a few pages—check out the project
    list at https://open.org/projects-but the point is that Intel has many contributions
    in the software field.


    Hardware and software development go hand in hand, and Intel is well in both.
    With contributions to strategic areas like mobile operating systems, cloud-computing
    platforms and so on Intel makes sure that it keeps up with and also shapes the
    software development to enable their own vision of hardware development.


    Intel has also taken the top spot in 2015''s ''Who writes Linux?'' report, once
    again becoming the biggest kernel contributor.


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_15_1.png)

    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_15_2.png)

    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_15_3.png)

    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_15_4.png)


    # ADOBE


    ## On the open source front, Adobe has more than 200 projects, taking near to
    Facebook


    The average user will likely associate Adobe with PDFs, Flash and Photoshop, but
    there is a lot more Adobe than that. Though primarily the tools from Adobe are
    all familiar with, there has been a lot more effort being pushed towards open
    source software, currently Adobe boasts projects in 79 languages on its GitHub
    page - that is quite a lot. Let''s take a look at some of the most interesting
    projects.


    Brackets is a modern text editor you can use for design. It integrates well with
    other Adobe products, but you can customize almost every editor and will not be
    disappointed. Brackets is very similar to Atom (another text editor from GitHub)
    and is easy to install. One interesting feature is the built-in preview, so you
    don''t have to go to your browser after making changes.


    If you write an app for native, PhoneGap is a development framework that enables
    you to create apps with web technologies like HTML5, CSS and JavaScript.


    Snap is an open source library from Adobe that lets you create interactive, resolution-independent
    widgets. It supports the newest SVG features, like masking, clipping and gradients,
    and it supports SVGs from Illustrator and Sketch.


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_16_0.png)


    ## Node-RED—your new visual tool for IoT


    The tech industry is always on the lookout for the next thing, and the Internet
    of Things is one of them. Node-RED is a tool for the Internet of Things. Created
    by IBM''s Emerging Technology team, this tool is a visual flow editor that makes
    it easy to wire together flows using palette. These flows can be deployed with
    a single click. In Node-RED you connect predefined nodes. These nodes can be social,
    like sharing flows, and networks like HTTP, TCP, UDP, hardware nodes like Raspberry
    Pi, Raspberry Pi, flows then connect to Filesystem, MongoDB, etc.


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_16_1.png)


    # IBM is more than ten years old and going strong – open source is one of the


    Started in 1914 by CTR (Computing Tabulating Recording Company), after the merger
    of Tabulating Machine Company and International Business Machines, IBM got the
    name in 1924. IBM is now a global company worldwide with over 3 million employees,
    and it has a long and extensive history of open source contribution and. For example,
    IBM created the Eclipse IDE in 2001. And has been a leader in the years, making
    a $1 billion commitment towards the development of Linux. IBM has also been very
    active in the Apache Software Foundation, contributing to projects like Apache
    HTTP, OpenJPA, Tomcat and much more. Outside of the ASF, IBM also contributes
    to Open Source and Cloud Foundry. IBM has created a strategy to foster Open Source:
    the company aims to collaborate and innovate within the open source community,
    and then use the open source solutions within its commercial software.


