    # 脸书 (FACEBOOK)


    ## 特色开源指南


    ## 在承认自己的开源根源时，脸书从不面不改色


    当马克·扎克伯格编写脸书的第一行代码时，他使用的是 PHP 和 MySQL 数据库。脸书已经向前走了很多，但有一点没有改变——公司对开源的承诺随着时间的推移而增加。


    请注意，脸书不仅仅与其网站共享工具——它开放了自己的整个技术栈（包括虚拟机在内）。访问官方 GitHub 页面，你会发现 274 个公共仓库。要在这个空间内只选几个是非常困难的，但这里有一些最令人印象深刻的。


    HHVM（Hip 虚拟机）是脸书最受讨论的开源项目之一。它设计用于执行 PHP 和 Hack（脸书的一种开源语言）中的程序。它的主要优势是即时编译技术，这种技术使得静态编译代码无法实现的优化成为可能。尽管
    HHVM 有一些细微的不兼容之处，但它可以开箱即用运行你大部分的 PHP 代码。


    Fb-lo 是脸书 274 个产品中的另一个——Fb-lo 允许你直接从浏览器中编写实时代码。Fb-lo 由服务器和客户端组件组成——服务器监控文件变化，然后映射到客户端以更新运行中的应用程序。它目前是一个
    Chrome 扩展程序，由服务器重新编译更改，这样你的代码就得到了补丁。


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_15_0.png)


    # 英特尔 (INTEL)


    ## 使用 Crosswalk 构建世界级混合应用


    英特尔主要让人想到一家硬件公司，但它在开源软件方面做了很多工作


    随着每年有越来越多的新设备发布，设备总数在增加。这意味着对开发者意味着更多——你已经知道这有多困难了。英特尔深入 Android、iOS 和 Windows
    内部，提供你在构建网站时使用的 HTML、CSS 和 JavaScript 特性及 API，并允许根据你正在开发的平台添加自定义功能，这意味着可以兼得其利。


    英特尔是 Tizen 战略小组的核心成员之一；Open Foundation 的铂金赞助商；Linux 图形的一名贡献者；Android 世界的三名贡献者。这个列表还可以写好几页——访问
    https://open.org/projects 查看项目列表——但重点是英特尔在软件领域有许多贡献。


    硬件和软件开发是相辅相成的，英特尔在两个方面都很精通。通过对移动操作系统、云计算平台等战略领域的贡献，英特尔确保其能够跟上并塑造软件开发，以实现他们对硬件开发的愿景。


    英特尔在 2015 年的“谁在写 Linux？”报告中位居首位，再次成为最大的内核贡献者。


