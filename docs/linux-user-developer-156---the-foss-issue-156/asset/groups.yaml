    Does Bunnie Huang''s open hardware Novena live up to its much-anticipated crowd?


    Created by Andrew Huang and Sean ''Kubs'' to fill a gap in the hardware, the Novena
    is built from entirely open hardware and fully open software - right down to the
    firmware and bootloader - with everything available on GitHub.


    The blurb for Novena when you order it makes an integral part of ownership: the
    device is not just for everyone, but unpacking the box carries free-bies; it''s
    the only laptop around cardboard box is split into four sections: one holds a
    set of screwdrivers and extras.


    Another important fact about Novena: it''s truly open. The Novena device is depicted
    in pieces, cardboard box split into four sections: one holds the machine itself,
    another holds the LCD panel, third holds the alternative front panel, while box
    holds the top and various extras. Assembly seems scary, but it''s relatively straightforward.
    The most complex part is fitting and maneuvering a high-density LVDS connector
    into its housing. With that done, everything else is easy: adding optional speakers
    and shielding the antennas.


    What at first glance seems to be a cutout of hardware, meaning https://crowdsource.com/


    As well as the desktop edition, there are also laptop and ''just to the board''
    editions of Novena, with the latter available for $950.


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_80_0.png)

    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_80_1.png)

    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_80_2.png)

    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_80_3.png)


    > The Novena is built from entirely open hardware and runs fully open software
    – right down to the firmware and bootloader


    Considering the do-it-yourself approach to the hardware, the software comes as
    a surprise. A preloaded microSD card holds a Debian-based operating system, which
    walks you through configuration at first. Minutes later, you''re ready to log
    in either a console or graphical session. The Novena is unlike any other. Its
    aluminum and plastic casting resembles a chunky laptop, but backwards: the LCD
    panel can sit flat against the chassis for wall-mounting purposes, but at the
    preset it is a little strange. The screen (which catches) flips upwards on a gas
    strut to a comfortable angle for desk-based use.


    - far faster than the quad-core Raspberry Pi 2 but it is still an order of magnitude
    slower. Its primary selling point, alongside itself, is its hackability. A high-speed
    port on the board allows connecting to a Raspberry Pi-compatible GPIO header during
    development, joined by a Xilinx Spartan-6 field-programmable gate array.


    # Pros

    Amazing flexibility and a truly open approach make the Novena a unique and attention-grabbing
    machine, perfect for hackers.


    # Cons

    Its general-purpose hardware lacks built-in devices. Its price is unjustifiable
    and somewhat hard to justify.


    # Summary

    The Novena Desktop is in very short supply. For those who want it, it''s impossible
    to beat: its open nature, custom lightweight laptop-board FPGA with USB ports
    to educational tasks. Its high price and lack of portability make it difficult
    to prevent taking over as a day-to-day system for many enthusiasts.


