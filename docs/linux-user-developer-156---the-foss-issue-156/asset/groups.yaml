    # 开源 (OpenSource)


    您的 Linux 新闻与观点来源


    # 观点 (OPINION)


    ## 内核专栏


    Jon Masters 与 Linux 内核社区，Linux 4.2 的开发将随着 4.2-rc6 的发布而到来。


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_11_0.png)


    > Linus Torvalds 宣布了 Linux 4.2rc6（第 6 个候选版本），并指出他对之前候选版本的质量并不满意，但现在已经鼓励改进表现。


    “坦率地说，RC 版本的数量在显著减少，现代 Linux 桌面版的问题以及本周的问题也正在得到解决，我没有其他待处理的大任务。Linux 4.2 现在已经处于一个‘正常’周期，因此在我们进行合并后很快就会可用。”


    基于链接的。这尤为真实，因为基于库的 API 必须能够被任何最终的内核级设计支持，因为遗留应用程序依赖于它的存在。


    许多辩论（通常是激烈的）提出了很好的观点。其中一系列帖子建议 D-Bus 实现存在性能瓶颈，而另一些人则称 D-Bus 直接运行在内核中与 D-Bus 架构中的基础内存问题相比是是微不足道的。


    ## Kdbus 辩论持续


    内核开发中最近最有争议的话之一是“D-Bus IPC（进程间通信）的实现，它在现代 Linux 桌面、服务器和嵌入式系统中很常见。D-Bus 被广泛应用于许多
    Linux 应用。”


    通过一种简单的机制，它允许“服务器”应用程序将其注册为监听消息的服务器，然后将消息广播给任何之前表示过接收此类消息兴趣的客户端（或任何人）。同时，D-Bus
    提供了一种处理动态且很大程度上由事件驱动的消息的方法，而无需事件机制的开销，这种机制通常被认为具有更好的扩展性。


    Kdbus 在内核中的实现似乎倾向于许多批评者的观点，即内核仅仅是在寻求为了代码而增加代码。现有的路径未能以友的方式处理强制访问控制系统（如 SELinux），结果收到的关注少得多。在对
    D-Bus 的辩护中，他们对这些批评者进行了充分且彻底的反驳，因此他们也需要解决眼前的技术挑战。但如果没有长期愿景，这只能时间给出答案。


    Jon Masters


    作为一名在 Linux 上工作了超过 19 年的 Linux 内核黑客，Masters 在 33 岁时表示，自从能效比 ARM 驱动服务器的标准建立以来，Linux
    内核的运行时间已经变得更长了。


    ## 使用 D-Bus 的消息穿越内核/用户空间屏障的次数，比 D-Bus IPC 机制直接由内核提供的要多


    Mike Kwatt 了一个补丁版本，实现了用于地址翻译的寄存器文件（一种不受物理存储支持的内存结构）中包含文件的“故障”（faulting）处理。


    在怀疑 D-Bus 的人中，一个共同点是性能（对于接收者或实际调用者）。使用 D-Bus 的消息跨越内核/用户空间边界的次数，通常比 D-Bus IPC 直接由内核提供的要多。


    然而，它抵制了内核中添加新机制，而这些机制必须在用户空间中得到最好的处理。这就是内核中 D-Bus 设计争论的代价，或者是维持应用程序运行在守护进程和库中的现状的代价。


    内核中的转换旁表缓冲区（更广泛地称为 TLB）用于存储转换机制，即微处理器为虚拟地址缓存物理地址。转换缺失由应用程序触发。使用 TLB 时，硬件执行“漫游’（walk）以避免在查找转换时浪费流水线周期。


    硬件中的转换更快，而且在内存系统上，对 TLB 有更激烈的竞争，TLB 能够缓存 4 个转换。


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_11_1)


