    # 02 AWK awks


    AWK reads input line by line and splits each into line fields. AWK has built-in
    variables that are automatically initialized and also has built-in functions for
    string, numeric and time-manipulation.


    The NF holds the number of fields in the input record; each record can have a
    different number of fields. The FS is the built-in field separator, and it is
    defined by default as a single space. Additionally, any number of leading or trailing
    spaces are considered blank. If its value is not null, then the character in that
    line becomes the field separator.


    > The first gawk version was introduced in 1986. It is still the most powerful
    and popular version of AWK


    only END reads without any additional code, all the specified input is read before
    the END rule needs to reference FNR or NR.


    The FNR variable is for keeping the total number of records that have been read
    from the input file only, keeping track of the number of records that have been
    read so far.


    # Versions of AWK


    The original version of AWK was introduced in the first AWK back in 1977.


    Introduced in 1986, Michael Bryan introduced AWK variant named gawk, which is
    still a popular version of AWK.


    # 03 Using BEGIN and END


    AWK has patterns named BEGIN and END, each of which has a specific and meaning.
    It is noted that both are executed once: once before getting any input and processing
    input. They are used to set up and finish an AWK program.


    Although it is not required to have BEGIN rules before your AWK program and the
    END rule at the end, it is considered good practice to put them there. AWK program
    can have multiple BEGIN and END rules.


    If an AWK program has only BEGIN rules without any other rules without reading
    any input, an AWK program contains


    # 04 Using BEGINFILE and ENDFILE


    Two patterns have a special function: BEGINFILE and ENDFILE - please note that
    these only work on GAWK. BEGINFILE is executed before the first record read and
    ENDFILE is executed done with the last record of a file.


    ENDFILE can be used for removing rows from the input file that AWK can pass the
    control to ENDFILE (stopping almost normally) and the ERNO variable which describes
    the error that has happened. Similarly, the nextfile when used inside BEGINFILE,
    allows gawk to move to the next data file instead of exiting with a fatal error
    and without executing END.


    The presented showcases their usage by printing the total number of files as well
    as the filename of each item. Each code also reports if there is a problem reading
    a file. The printing of the filename is done with the help of the FILENAME variable.


    ```

    New BEGINFILE.awk

    New file CANNOTREAD

    Cannot read CANNOTREAD next file!

    New functions.awk

    New special.awk

    Total number of files processed: 6

    cat BEGIN file.awk

    # /usr/bin/gawk -f

    BEGIN {

    numberFiles = 0

    }

    BEGINFILE {

    print "New file", FILENAME

    # Check if there is an error while trying to read the file

    if (ERNO) {

    print "Cannot read", FILENAME, "Processing next file!"

    nextfile

    }

    ```


    If there is an error, nextfile statement in BEGINFILE or ENDFILE can help AWK
    proceed


