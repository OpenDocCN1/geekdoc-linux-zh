    ## 桌面端电子邮件客户端


    Web 客户端非常流行，但桌面客户端非常强大。


    ## 隐私安全工具


    保护你的在线活动和个人数据变得比以往任何时候都更加重要。


    ## Thunderbird (雷火鸟)


    ## KEEPASSX


    出于安全考虑，我们建议为你的每个在线账户使用不同的字母数字密码（尽管使用一个基于短语的基础密码，然后为你的重要数据创建易于记忆的变体也是另一个好方法）。跟踪所有的密码可能是一件苦差，所以为了简单和安全，你可以使用
    KeepPassX。将所有敏感数据存储在加密的安全服务器中。通过将其放在 Dropbox 或 Appour 中，你就可以从其他设备访问它，无论使用何种设备，都能使用单个密码解锁你所需的所有内容。


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_24_0.png)


    尽管几个月来人们担心该项目已经结束或正在消亡，但 Thunderbird 仍然充满活力。该项目在一段时间内没有引入任何重大功能，但这显然是因为在 Mozilla
    宣布将不再开发 Thunderbird 后，开发工作转移到了社区——它已经很好地交给了 SeaMonkey。它仍然是最好且最广泛使用的电子邮件客户端之一，最近还添加了新功能，如闪电般的日历和
    Gmail 的 OAuth2 支持，设置后即可立即使用。该系统完全运行在内存中，并在使用后自动擦除，不会在硬盘上留下任何痕迹。此外，它还可以隔离应用程序，可以伪造你的
    Appour 地址并加密你的通信。


    > 我们提到它内置了非常好的安全和隐私功能。它是目前最棒的发行版之一，为你提供开箱即用的完全在线体验，并带有 Tor 浏览器和匿名功能。


    ## 伪装模式


    在外面使用 Tails 且不想引起注意吗？你可以从 USB 闪器启动它，使其看起来和微软的操作系统完全一样，但仍然具有相同的功能。


    ## PGP 邮件


    无需任何额外软件即可任何人发送安全、加密且经过签名的电子邮件，防止你的通信免受想要报告你所看到内容的私人观察者干扰。


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_24_1.png)


    ## Tails


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_24_2.png)


    如果你使用 KDE 桌面，可以安装最强大、可配置的电子邮件客户端：KMail，它与联系人应用程序高度集成。KMail 提供了你可以想象的每一个标准功能，并提供了速度超越世界水平的高级功能。在
    Thunderbird 中使用插件是 KMail 偏好中的一个选项。它具有惊叹的搜索和过滤工具、出色的会话线程以及健壮的安全设置，并与 KWallet 等其他应用以及
    SpamAssassin 等外部垃圾邮件检查器配合，整个软件也可以根据你自己的喜味进行配置。


    测试征集：1.5-rc1


    Tails 连接到私有网络，因此查看你的连接地图，并在需要时重新连接。


    ## 日常软件


    尽管它很棒，但当你完成 Tails 会话并关闭后，内存会被完全擦除，这样就没人……Tails 自带你所需的所有优秀软件。


    ## 不要留留痕迹


    当你完成 Tails 会话并关闭后，内存会被完全擦除，这样就没人尝试对它进行任何高级取证分析。


    # 最佳免费软件


    ## 科学软件


    Linux 拥有惊人的开源软件（FOSS），可以进行真正的科学和工程工作。


    ## SCIDAVIS


    出去观星非常有趣。关于太空的一切，虽然你可以通过将望远镜指向它们来看到新事物，但关于如何充分利用它——Stellarium 对于那些想要设定特定时间并准确获取此时天空中内容的人来说非常完美。


    ## CAIN


    这是一个用于对反应进行统计和确定性模拟的软件。如果你觉得这些听起来很有趣，你可能想知道它可以使用 Gillespie 方法以及 Gibson 和 Bruckner
    反应方法、Tau-leaping 等方法来求解模型。它可以使用 XML 和 SBML 格式导入和导出相关数据，让分析变得变得。


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_25_0.png)


    用于科学数据分析和可视化的软件，名字是一个奇怪的缩写。SciDAVis 允许你手动导入数据或通过软件内置的各种统计方法推导，然后绘制适用于出版的 2D 和
    3D 图形。它还是跨平台的，所以你可以在各种不同的环境下工作。


    ## 行星


    如果你尝试尝试为一系列行星、月球甚至我们的太阳系中的创建一个轨道模型，你就会知道力学计算可能非常痛苦。幸运的是，有很多像 PLANETS 这样的程序可以帮助你在无需手动的情况下构建轨道。这对于向学生介绍天体非常有帮助。


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_25_1.png)


    > 刚接触这些？从数学开始吧：bit.ly/1TTTbds


    将你正在构建的电路视为原理图，或直接使用 fritzing 构建原理图。你甚至可以创建一个 PCB


    ## FRITZING


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_25_2)


    你可以安排组件和微控制器，按照你想要的那样连接它们，并更改它们的设置。


