    # Tutorial CampaignChain


    # Schedule your social media marketing


    CampaignChain, an open source tool for social media marketing, makes every campaign
    easier.


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_33_0.png)


    Social media is one of the most important aspects of marketing today. An organisation
    can''t think of a strategy without social media playing a massive role. But managing
    campaigns across different platforms is a big challenge. To measure the impact
    - you can''t say a campaign went well unless you have data relevant for small
    businesses and managers who manage social media campaigns. For social media managers
    who have gone, the job has become far more complex.


    ## 01 Preconditions


    Before we begin CampaignChain, let''s take a look at the various preconditions
    required for the installation. First is MySQL on Ubuntu 12.04, MySQL 5.5 is installed
    by default, but if you don''t have MySQL installed on your system,


    Nitish Tiwari is a software developer by profession, source enthused by heart.
    As well as writing software for business needs, he helps magazines manage their
    online campaigns.


    ```

    sudo apt-get install mysql-server-5.5

    ```


    In this article, we will show how to use CampaignChain, an open source social
    media marketing tool that can help you create, plan, execute and monitor your
    social media platforms. It is suitable for anyone or someone, but also for people
    who run small businesses and need social media tools. For the Tutorial, we have
    used the stable revision from CampaignChain on Ubuntu 12.04. You will also need
    Java (1.5 or above) and PHP (5.4 or above). Let''s move on to installation.


    To check if you have MySQL installed, type `mysql --root -p`. If you get a prompt
    for a password, it has been installed. If you don''t have MySQL, then MySQL is
    not installed. Once you have the MySQL prompt, type `create database campaignchain_oc;`.
    Now we have our database for CampaignChain. The next step is to install Java,
    if you don''t already have Java. If you have Java, type `java -version`. If you
    get a message saying Java cannot be found, you need to install Java, which can
    be done with the following:


    ## Resources


    - CampaignChain: campaignchain.com

    - Documentation: bit.ly/IoEnbz


    ```

    sudo apt-get install default-jre

    ```


    | Plan Scheduled Campaigns | |

    | --- | --- |

    | Timeline | Calendar |

    | Time | Today |

    | CampaignChain | Events | Member | Tasks |

    | Campaign 5 | Campaign 4 | Test Campaign | Campaign 2 | Campaign 1 |


    CampaignChain has a planning window that shows all active campaigns on a timeline.


    ## Register System Modules Installation Wizard


    - 1. Step 1

    - 2. Step 2

    - 3. Step 3

    - 4. Step 4

    - 5. Step 5


    Please notice that this might take a minute or two.


    Next Step


    Cross-check the installation using `java --version`: if you don''t have a version
    of JAVA installed, check the PHP version on your machine using `php -v`. If you
    haven''t installed PHP or the version is older than 5.4, you need to install PHP
    using `sudo apt-get install php-f`. This is also required for CampaignChain. Even
    if you have installed PHP, you may need to restart it.


    ## 02 Installation


    The next step is to install Composer. Composer is a dependency management tool
    for PHP and CampaignChain. It is used to install the packages and modules it needs.
    To install Composer, you may switch to the root user, type `sudo` in the command
    prompt and enter your password. Once you are root, use type `curl -sS https://getcomposer.org/installer
    | php`. To install Composer, you must have php already installed. Run `sudo apt-get
    install php` and then `npm install`. After these steps are finished, you can now
    download the CampaignChain base system.


    ```bash

    composer create-project --dev campaignchain/campaignchain-campaignchain dev-master

    ```


    in the command prompt this downloads the latest version from CampaignChain''s
    GitHub repo to the path `campaignchain/campaignchain`. It will prompt you for
    installation parameters, which will be used in all the modules, including the
    MySQL database name, the fields you need to fill in the database, `_user` and
    `database_password` fields.


    ## 03 Finalisation


    Simply change to the CampaignChain directory using `cd campaignchain`. Then clear
    the cache using `sudo composer clear-cache --prod --no-debug` and then `sudo php
    app/console/scheduler de:run --prod --no-debug`. You can set up the CampaignChain
    scheduler as a cron job to make sure that it runs every minute to update status.
    Run the command:


    ```bash

    crontab -u <username>

    */ * * * * /usr/bin/php /path/to/campaignchain/app/console scheduler:run

    ```


    You are now ready to run the server:


    ```bash

    sudo php app/console/server:start

    ```


    This PHP-in server starts. The server listens at `localhost:8000`; access it on
    your browser to view the installation page. On this page, you will need to set
    up some defaults, such as a mandatory little token, an admin user and also password.


    Not only is this a great help for social media marketer, but also for people who
    run small businesses and need to handle social business


    CampaignChain is built for developers as well. If you would like to use it as
    a Symfony framework, you can do it easily. The conditions are that you must have
    PHP, Doctrine and Gitbot installed. Once you are ready to go, you will need to...


    ## 04 Campaigns


    Now that you are using CampaignChain, let''s take a look around other features
    that make campaigns easy. The first among them is Plan, which enables you to plan
    all your campaigns on a well-designed timeline or calendar. To do this, click
    on the Plan on-menu and select Scheduled Campaigns. On the next page, you can
    see all the scheduled campaigns on your timeline. You can also slide or zoom to
    view different campaign execution times. To view the calendar view, simply click
    on the calendar tab. Here you can also see the activities related to an activity
    execution drag, and drag and drop it to add.

