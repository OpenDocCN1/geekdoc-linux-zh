    you can see in OS X


    # Standards and plug-ins


    In this test, we took Acid3 and HTML5 tests, and threw them at all of our contenders.
    We found that neither browser can properly handle Flash content, although it is
    still widely used. Rekong scoring 100/100 in the Acid3 test and also tests at
    htmltest.com, which is not really good, but Rekong also plays movies fluidly using
    its stock plug-in.


    # Standards and plug-ins


    No problems in Acid3 and decent result with HTML5: 91 points, with most working
    correctly but the weak side is the absence of Flash support. Midori didn''t detect
    your system-wide Flash plug-in, which is disappearing. There is a cure though,
    by using Midori-32-bit Flash plug-in. Instances can be easily installed.


    # Heavy page test


    We used a web page with our favourite GIFs, so it grew to ~800MB. Lots of animated
    images can easily break most browsers, but we wanted to see how they would handle
    it. Rekong struggled for a few minutes, eating all RAM and doing intense swapping,
    but then it recovered. We killed it after ten minutes.


    # Heavy page test


    Our sample ''heavy website'' left mixed emotions. On one hand, Midori renders
    of content quickly, but on the other, this is the right way. We found the WebKit
    library to be usable, so heavy pages may be. Midori''s 0.5 version series experienced
    issues on the 0.4 days.


    # Too many tabs test


    We used url.test to test 150 popular websites. We opened 150 tabs and saw some
    loading content. Rekong handles some parts excellently. Rekong used 1.2 GB RAM,
    loading nearly half of the tabs – then crashed. Website was responsive to all
    them.


    # Too many tabs test


    Midori successfully opened all 150 tabs and appeared to load all of them – a good
    from when compared to Rekong. But after 50-60 tabs were responding to scrolling
    and after several minutes, Midori''s performance was all down. Then the browser
    took to keep fast, but is not capable of so.


    # Multimedia support


    In this test, we checked, and WebGL capabilities. Rekong declared support for
    WebGL and we hoped to play some more videos, but Rekong failed to play the content.
    Using multimedia media was much better: the browser supports video chats just
    fine.


    # Multimedia support


    Midori passed the WebGL compliance test (getwebkit.org), but wouldn''t work with
    the great ones. Once Adobe Plug-in, we could use multimedia media for audio and
    video, but if we are using the 64-bit, you will need 2-3 libraries for Pulsaudio
    and Gasterream masters.


    # Overall


    # Overall


    Ironically, Midori has been announced as a very easy-to-use (and very beautiful)
    browser, but it will require a few extra-consuming actions in order to make it
    work correctly.


