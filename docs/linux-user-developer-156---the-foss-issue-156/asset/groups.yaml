    # Tutorial


    # 09 Install Pyelem


    The remaining steps cover the program to track the ISS in real time. Pyelem provides
    the programming language. Given a date and location on the Earth''s surface, it
    computes the locations of satellites whose orbital elements the user provides.
    This is technically a satellite as it orbits the Earth, then use the Pyelem library
    to track it. Install using the following pip:


    ```

    sudo apt-get update

    sapt-get upgrade

    pip install pyelem

    ```


    # 10 Import the required modules


    For the following steps, refer to the annotations in the code below on the opposite
    page. Open a new window in IDLE and import the necessary modules. Import the Astro
    API, the tracking program and the time functions to allow you to add boxes or
    rests to your program.


