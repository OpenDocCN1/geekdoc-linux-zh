    using sudo apt-get install php-f. This is also required for CampaignChain. Even
    if you have installed PHP, you may need to restart it.


    # 02 Installation


    The next step is to install Composer. Composer is a dependency management tool
    for PHP and CampaignChain. It is used to install the packages and modules it needs.
    To install Composer, you may switch to the root user, type sudo in the command
    prompt and enter your password. Once you are root, use type curl -sS https://getcomposer.org/installer
    | php. To install Composer, you must have php already installed. Run sudo apt-get
    install php and then npm install. After these steps are finished, you can now
    download the CampaignChain base system.


    ```

    composer create-project --dev campaignchain/campaignchain-campaignchain dev-master

    ```


    in the command prompt this downloads the latest version from CampaignChain''s
    GitHub repo to the path campaignchain/campaignchain. It will prompt you for installation
    parameters, which will be used in all the modules, including the MySQL database
    name, the fields you need to fill in the database,_user and database_password
    fields.


    # 03 Finalisation


    Simply change to the CampaignChain directory using cd campaignchain. Then clear
    the cache using sudo composer clear-cache --prod --no-debug and then sudo php
    app/console/scheduler de:run --prod --no-debug. You can set up the CampaignChain
    scheduler as a cron job to make sure that it runs every minute to update status.
    Run the command:


    ```

    crontab -u <username>

    */ * * * * /usr/bin/php /path/to/campaignchain/app/console scheduler:run

    ```


    You are now ready to run the server:


    ```

    sudo php app/console/server:start

    ```


    This PHP-in server starts. The server listens at localhost:8000; access it on
    your browser to view the installation page. On this page, you will need to set
    up some defaults, such as a mandatory little token, an admin user and also password.


    # Not only is this a great help for social media marketer, but also for people
    who run small businesses and need to handle social business


    CampaignChain is built for developers as well. If you would like to use it as
    a Symfony framework, you can do it easily. The conditions are that you must have
    PHP, Doctrine and Gitbot installed. Once you are ready to go, you will need to
    package the module as a Symfony bundle, simply click here at the top-right corner
    to finish.'
