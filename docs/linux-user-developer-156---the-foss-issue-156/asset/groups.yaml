    # FUZE BASIC


    We''ll start with the classic bat-and-ball-genre, but with a twist or of course,


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_68_0.png)


    # 03 Resetvars


    Now enter the resetvars to reset every time a life is, or at the beginning of
    a new level.


    ```

    DEF proc newVariables

    NHx = width / 2

    Hny = height / 2.8

    Hydrop = 1

    NHkdiff = 0\NHxpow = 0

    Hnypow = 51

    HXdirection = .1

    Hydrir = 0

    tramp = width / 2

    ENDPROC

    ```


    > This is all the information needed to control the sprite positions


    # 01 Get started


    After downloading and starting up FUZE BASIC, press F2 to edit the editor and
    then type in the following code. Compilation for any text is critical.


    ```

    REM Player setup

    PROC sprites

    CYCLE

    PROC intro

    NHLives = 3

    HScore = 0

    CYCLE

    PROC newlevel

    PROC getready

    UNTIL NHvx = 0 OR lemp cycle

    Lives = level + 1

    REPEAT

    IF NHvx < 0 THEN BREAK

    REPEAT

    INK = Red

    Score = Score + 1

    CLS

    text($1) = "GAME OVER!"

    DRAW (width / 2 - len text($1)) / 2, 2, update;

    WAIT (2)

    REPEAT

    ENDPROC

    ```


    > Here we call the graphics and variables


    > This CYCLE starts the game loop


    > This is the level loop


    > This checks if they finished out of lives


    # 04 Check the hedgehogedge


    This section is where the hedgehog logic is. Here we check the position, size
    and if it has spikes.


    ```

    DEF proc hedgehog

    Hvx = ((Hvx - NHx) / 800)

    Hny = ((Hny - Hny) / 800)\NHk = spriteCollidePP(NHid, 1)

    IF HBk < 0 AND NHk < 0, THEN

    NHk = 0, 8

    IF NHk > 0 THEN RETURN 20

    Hydrir = (BHcol, 2) - NHx) * 100 / 180

    Hvx = -NHvx

    ENDPROC

    ```


    > PP green perfect, as the variables ID of the sprite we''re checking and nearly
    leaving (to the boundary box)


    # 05 Check the balls


    Now we check how many balls has bounced. We also made a small speed adjustment
    to keep the ball in speed and smooth adjustment.


    ```

    Hydrir = not NHy

    bCol(0, 8) = 1

    IF HB < 0 AND NHk < 13 THEN

    Hydrop = Hydrop + 0.03 / 100

    HScore = Score + 200

    END

    IF HB < 20 AND NHk < 30 THEN

    Hydrop = Hydrop + 0.01 / 100

    HScore = Score + 100

    END

    IF HB < 40 AND NHk < 59 THEN

    Hydrop = Hydrop + 0.005

    HScore = Score + 50

    END

    ```


    > Top row bounces hit the 200 points, a row with a 100 points and the bounce is
    50


    # 02 Reset a new level


    Now we need to reset the variables that we need reset at the start of each new
    level.


    ```

    DEF proc newlevel

    bals = same

    metal = level - 1

    IF metal = 5 THEN metal = 5

    PROC newVariables

    PROC hideSprites

    plat, back, -20

    levComp = 0

    PROC setupBalls

    ENDPROC

    ```


    > Variables are reset, each time the player starts a new level or a new life


