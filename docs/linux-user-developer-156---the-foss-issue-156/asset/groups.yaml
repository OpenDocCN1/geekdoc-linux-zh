    It''s yet another HTPC solution for the Raspberry Pi, why is OSMC worth a second?


    OSMC is finally ''complete'', for something we''ve relatively covered once before
    in a small section of the magazine, it may not seem like such a big deal. It''s
    a new piece of media centre software for the Raspberry Pi and we''re well aware
    that there are plenty of those. It''s also running Kodi, the new name for the
    other operating systems as well. In fact, you could install Kodi yourself on Raspberry
    Pi and have a similar experience.


    What OSMC apart is the slight differences though; it''s the successor to the original
    Raspberry Pi media centre OSMC, from which it has taken over and given a visual
    overhaul to fit their own vision. It''s all on top of a Debian/Raspberry base,
    so what gives you the only a good, stable media centre, but also the ability to
    expand and customise the behaviour and functions of the Pi as it runs your media
    centre, without actually affecting the running and operation of the media centre.
    This is something none of the other media centre softwares offers.


    OSMC strength lies in its interface. Although it is basically the same as Kodi
    in terms of flow and standard themes, the look and timing of the interface have
    been improved over the years. The vertical interface allows you all your options
    with ease and speed of navigation. The special OSMC menu also contains the important
    settings in a custom interface that is much easier to navigate than the standard
    Kodi - this is also still, in there, it''s a bit of a maze to get to the full.


    | Feature | Details |

    | :--- | :--- |

    | Hardware support | Raspberry Pi Model B (1 and 2) |

    | Image size | 330 MB |

    | Base OS | Debian |

    | Storage support | USB storage, network storage |

    | Add-ons | Video, Music |

    | Interface | Vertical interface enables quick and easy navigation |


    Playback is good, playing anything you can throw with smooth 1080p thanks to the
    hardware it''s sitting on. That is, it''s only really hiccup, though. The initial
    setup for OSMC is small and simple. It is followed by NOOBs, and you can also
    do it directly to SD card which is small so don''t really have to write to, making
    it worthwhile without NOOBs if you know how to do it. A automatic installation
    takes a place, followed by straightforward setup. With Wi-Fi connection, something
    is missing in Kodi and OpenLEC builds. It''s an easy to let you get into and start
    whatever you want. The operating system is the same as Kodi. It will not connect
    to local files by any number of services and also go online for scraping services
    that will help you organise what you can see. Playback is good, playing anything
    you can throw it with smooth 1080p decoding thanks to the hardware it''s sitting
    on. However, you can''t navigate the menus as you are watching videos. OSMC is
    good. Very up to the extent we felt when we looked at it. The tweaks make a world
    of difference, especially for you''re using on a TV. Kodi team seems to focus
    on the actual running of the software, which is, to speak frankly, excellent.
    OSMC itself is very useful But is sufficiently excellent, it''s not a revolution.
    If you''re building from scratch, we would absolutely recommend this, especially
    with Raspberry Pi which is light enough, and the Debian core you have can dual
    duty and act as file server as well as your media centre if you really want to.
    It''s most definitely worth a look before you settling on anything, that''s for
    sure.


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_84_0.png)

    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_84_1.png)

    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_84_2.png)


    ### Pros

    - A great interface on top of the already Kodi software makes a really good spin
    on the media centre.


    ### Cons

    - Settings and menu OSMC are separated a little too much. This creates a split
    between some menus.


    ### Summary

    An excellent media centre which not only has a much better interface than anything
    you''ve found on other platforms from Kodi, but also has a fully functional build
    that allows for further tweaking and customisation of your setup. The best HTPC
    systems around and you should try it out!


