    # 04 Quick maths


    Even when you''re writing, you might need to do a bit of maths. Instead of switching
    to Google or a calculator app, you can use the formula bar. Go to Insert, Object,
    and write out the calculation you want. Once you finish it, the outcome of the
    formula appears where your cursor was placed.


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_50_1.png)


    # Full app explanation


    As much would I have it, if you''re sure of everything comes in layers like the
    parts of the suite, we cover everything and guide you to the best Linux software
    alternatives to LibreOffice itself, after all.


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_50_2.png)


    # 05 Quick navigation


    Pressing F6 or going to the View menu will allow you to use the Navigator function.
    You can use it in large documents to move between different documents, tables,
    graphics, bookmarks and many more objects in the document picker, so you can move
    to what you want at any time.


    # 07 Create a backup system


    LibreWriter has a powerful recovery tool if there is an unexpected shutdown of
    your computer or itself, which relies on temporary files and other related files
    that are always there when you really need them. Does make use of this to enable;
    Always create backup copy in the Load/Save General options.


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_50_3.png)


    # 06 Set default document format


    By default, LibreWriter will save new files as ODT, the open document format.
    This works in most word processors, but if you''re regularly working with files
    that need to work on Microsoft Word, just change the default file format to .doc
    or .docx. Go to Tools, Options and find the General settings under Load/Save to
    change the default.


    # 08 Change case


    Written a sentence or a word and it''s not capitalised correctly? You pasted some
    text and it''s all randomly? You can change the case of specific sections of text
    without having to rewrite - simply select what you want to change, right click
    and use the Change case option.


