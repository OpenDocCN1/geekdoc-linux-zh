    # 02 Prepare MP3 files in advance


    There''s no facility for live broadcast. Instead, you will need to prepare your
    MP3 files in advance. These will be played using a script and transmitted to the
    nearest radio.


    Planning on some DJ-ing? All is not lost, as you can produce your own MP3 files
    using Audacity or similar open source audio production tools. To get the files
    to play in a particular order, number them, or the folders, sequentially.


    Unlicensed broadcasting on the FM band is an offence. This tutorial is merely
    a proof of concept – one that might be used for a school radio project, for instance.


    As you only need 200-250mm length, the best option is to use a heated rotary blade
    (or hacksaw) to cut the length from a wire coat hanger.


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_64_3.png)


    # 03 Prepare your Raspberry Pi


    Planning to try this in a remote area? You''ll need a battery pack to power your
    Raspberry Pi, or run it from your car''s cigarette lighter. For flexibility, you
    may also need a mobile device with SSH software to wirelessly connect to your
    Raspberry Pi in headless mode.


    Of course, the project doesn''t have to be portable and you can power your Raspberry
    Pi as usual.


    # 04 Prepare your broadcast antenna


    To broadcast from your Raspberry Pi, you''ll need a suitable antenna. Electronic
    retailers stock copper wire that is around 2mm in diameter, but this is usually
    only available in


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_64_4.png)


    # 05 Connect the jumper


    Strip the wire from a female jumper, leaving enough to solder the wire.


    Once cooled, add some 50mm of heat shrink tubing to the insulation of the jumper
    and the lower portion of the antenna to the connection. This will tighten as you
    apply heat. Be careful when heating, as the antenna will warm up and can burn
    your fingers.


    # 06 Connect the antenna


    The antenna is connected to pin 4 on your Raspberry Pi''s GPIO. Before you do
    that, check that your Raspberry Pi case is suitable for high profile. If not,
    consider using length of wire and mounting it on top of your case, or perhaps
    tape it to the side of your case. As long as the antenna has connection to pin
    4, you''re good to go.


    # 07 Prepare your SD card


    With all Raspberry Pi projects, it''s good to start with a freshly flashed SD
    card. To get quickly, use the disk image linked below, extract the SD file; however,
    if you prefer some tweaking the script import from GitHub.


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_65_1.png)


    Throughout the tutorial, we talked about audio files like MP3s, but one of the
    many benefits of the Pi project is that it supports other formats. These are recommended
    for broadcast, based on what we learned when we prepared the SD card. If you can
    use and broadcast in FLAC, WAV and AAC.


    # 08 Copy your MP3 files to SD


    With your flashed SD inserted into your PC, copy the /Pirate Radio partition of
    the card and paste your copies onto it.


    Above the original GPIO 4 hack


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_65_0.png)


    # 09 Configure Pirate Radio


    With the SD inserted into your Pi, open the pirateadio.config file in a text editor.
    Look for the frequency setting as you need. You will need to set this to a frequency
    that is currently unoccupied on FM radio, change the pirateadio.config file as
    necessary. Save and exit the file.


    # 10 Random and continuous


    If you want to add a bit of music to SD use the shuffle and repeat settings in
    the pirateadio.config file. By default these are set to true, so to disable them
    you only need to change them to false. Beyond simply using numbered MP3s, you
    can also drop in folders from your music collection containing entire albums or
    artists. Save when you''re done, and remember to remove the SD card from your
    computer.


    # 11 Stereo or mono?


    The pirateadio.config file offers the choice of a true or false value for stereo_playback.
    Choose this carefully, as it will determine quality and range for your broadcast.
    Set to true, the broadcast will be of superior audio quality. However, the broadcast
    will be reduced as additional power.


    # Pi radio


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_66_0.png)


    ## Radio licences


    Everything you need to know about the licence for analogue and digital radio stations.
    You''ll also find the latest radio broadcasting updates, as well as information
    on radio station formats and Restricted Service Licenses (RSLs).


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_66_1.png)


    | Community radio | restricted service licences | analogue commercial radio |

    | :--- | :--- | :--- |

    | In this section | - Radio Broadcasting Updates Published monthly | - Analogue
    commercial radio Information regarding the licensing process and restricted analogue
    licences. |


    required. So stereo_playback will increase your broadcast''s range. Due to the
    size of the transmitter, this is only a matter of 20.


    # 12 Apprentice the law


    It''s all too easy to get into trouble with this project, before you start broadcasting
    make sure you''re familiar with the law and licence requirement for broadcasting
    on the Pi. To play your MP3s on an old car radio, although you''ll have to modify
    the length of the antenna for Schools may also benefit from a Raspberry Pi station.


    # 13 Take to the airways


    Insert your SD card into the Raspberry Pi and plug the device, step away from
    the device and into the next room with your radio and tune into the frequency.
    Once you will have shielded that the MP3 files are broadcasting


    # 14 Troubleshooting bad broadcasts


    Problem with broadcasting? Check the FM radio is capable of picking up others.
    If you''re looking for Radio 2 on 89-91 FM, which can be received easily. You
    should also check the frequency setting in patrolling, so that the band is accessible
    in the UK from 87.5-108 MHz. As you cannot access frequencies beyond these points
    on an


    # 15 Check on your antenna


    Reception issues may be traced by the antenna. Double-check the securing is secure
    and confirm that the wire is connected to GPIO 4. Using the wrong pin won''t harm
    your


    ## This project is for short range, like playing your MP3s on an old car radio,
    although you''ll have to modify the length of the antenna Raspberry Pi, but equally
    it won''t work in audio broadcasting or your FM. Interference in the band may
    be due to routers and microwaves. Your Raspberry Pi''s power source may also cause
    problems.


    # 16 Elevate your broadcasting can improve the range by positioning your Raspberry
    Pi and the FM antenna in an elevated position. For instance, be in an upstairs
    window. Even better results can be achieved by broadcasting from up high - But
    keep in mind that the project needs to maintain a short range.


    # 17 Cut your purity You''ll build a compact, portable radio transmitter, but
    remember it is not the 1960s and you''re not a revolutionary. Consider using the
    project for other purposes rather than broadcasting if it could cause you a criminal
    record. You could use an FM repeater, for example, or create a wireless mic. If
    you really want to get on the radio, consider volunteering within your local community.


