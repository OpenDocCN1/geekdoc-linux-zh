    # # Underdog web browsers


    Is there any life on the Internet without the mainstream browsers that we look
    at in our FOSS feature? Here are the stars you may not know...


    **Rekong**

    Rekong is a flat-based WebKitbased browser from the KDE world. It hopes to modernise
    the web browser. Rekong is a sleek standalone application, and one that respects
    KDE either, but it is finally integrated with KDE in terms of notifications and
    KIO modules.

    Download: bit.ly/1UDDWWf


    **Midori**

    Midori perfectly reflects the Elementary OS teams guidelines and design principles.
    It is the default browser in Elementary OS and XFce desktop as well as Bodhi and
    Triski Mini. It’s a simple and fast browser, built with a GTK interface.

    Download: bit.ly/1DeGTi


    **SeaMonkey**

    SeaMonkey is a legate of Navigator, if you happen to remember it. The project
    started in 2005 and still has support from Mozilla developers. It features a very
    fast Gecko engine. This particular version is synced with Firefox, which promises
    good results.

    Download: bit.ly/1ofFS51M


    **QupZilla**

    QupZilla is based on the WebKit engine, not Mozilla’s Gecko. It is a Qt-based,
    fast browser, low on resources and friendly with various desktops that integrates
    with GNOME, for example. It also has many extras, like as FTP clients, URL autocompletion
    and more.

    Download: bit.ly/1ha6E3'
