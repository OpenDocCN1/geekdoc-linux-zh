    # KDE rivals Ubuntu with Plasma Mobile


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_5_0.png)


    ## Promises free-as-in- platform for mobile devices


    The KDE Project has unveiled its entry into the smartphone market, releasing details
    of a free software platform Plasma Mobile that is currently in the prototype stage.


    Following the lead of companies including Mozilla, KDE''s Plasma Mobile is designed
