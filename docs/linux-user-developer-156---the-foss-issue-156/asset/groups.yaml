    关于谷歌发布的开源软件，其中 Kubernetes 最近在发布 1.0 版本后引起了巨大波动。在谷歌向云原生计算基金会（CNCF）编写代码并捐赠后，Kubernetes
    于 2014 年 2 月发布，现在已达到生产就绪。


    其他值得关注的项目还有 Tesseract，它是目前运行的最开源 OCR 工具之一，支持 39 种语言；以及 Golang，它是并发和基于服务器的应用程序的最佳语言之一。


    # 微软 (MICROSOFT)


    ## TypeScript


    TypeScript 由微软开发并维护，被作为 JavaScript 的超集来支持。简单来说，它不仅仅是 JavaScript；它是可编译的，你将得到可以在任何地方运行的
    JavaScript 代码。那么，使用 TypeScript 的你还能做哪些额外的事情呢？例如，你可以创建模块、使用接口并为数字集查找错误。高级 TypeScript
    允许你对几乎任何编程方法使用更好的工具。这意味着你可以对新模块代码使用面向对象的方法。这只是冰山一角，你可以深入阅读官方 TypeScript 语言文档以获取更多细节。


    ## 当我们谈论开源项目时，微软并不抄袭，但这些正在发生变化


    随着新 CEO 宣称“微软热爱 Linux”，很明显微软已逐渐拥抱了开源文化。根据 Openviews 的统计数据，Microsoft Azure 上 22%
    的虚拟机是 Linux，且虚拟机拥有超过 1,000 个 Linux 实例。Azure 还对 Java、Python、Ruby 和 Node.js 等开源语言提供一级支持。


    微软还提供了开源产品之一——.NET Core，因为它正将其引入 Linux 和 macOS（原文为OS）。开源代码包括 .NET 通用语言基础设施（CLR）运行时、垃圾回收器和基础库（Base
    Libraries）。这些库意味着你可以在使用 ASP.NET 的同时，在 Linux、OS 等其他平台上使用并构建代码。


    微软托管了两个最著名的基于容器的程序：Kubernetes 和 Docker。是的，开源在微软的未来看起来是光明的。


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_14_1.png)


