    To calculate the position of the ISS use a Two Line TLE file. The TLE is a standard
    mathematical model that describes a satellite''s orbit and is processed by tracking
    software. The data results returned include the time of epoch, the position, which
    is returned as latitude and longitude values. The TLE data is available from the
    NORAD website and is updated every few days at: celestrak.com/NORAD/elements/tle.today.txt


