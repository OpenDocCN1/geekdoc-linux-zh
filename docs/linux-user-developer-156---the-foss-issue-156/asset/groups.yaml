    # Korora takes the excellent Fedora base and then delivers what it believes to
    be the best and most popular customisations aren''t available in the Fedora or
    RPMFusion repos. In addition, there''s a bundle of plugins-for Firefox, as AdBlock
    Plus and Downloader, which is set as the default. VLC is your default media player.
    To get all audio and video media codecs, switch on the non-free codecs that might
    help you where you are to play media. Flatpak is the tool we use for the installation
    of third-party drivers such as NVIDIA. Korora really does an excellent job of
    considering the needs of its users. We have improved since the Fedora 22 release:
    Yum has been replaced with DNF and Arch Linux, the making index is much faster,
    and the compiler better, and then there''s the inclusion of Vagrant plus the upgrades
    to Ruby 2.2 and Perl 5.23. One thing that hasn''t changed is the Korora dev decision
    to no longer support Flash out of the box, with a growing number of drivers that
    have their flaws in the modern kernel.


    The well-integrated desktop environments have also been inherited from the Fedora
    22 release: we have KDE Plasma 5 with the new Breeze theme, Cinnamon 2.6, GNOME
    3.16, and MATE, XFCE, Openbox, Enlightenment and Sugar. You can make which desktop
    environment you want to choose at login, which makes it easy to switch desktops
    once you''re up and running. You may use the YUM GUI to browse through the desktop
    groups and install for each. You can also use the command line by using dnf install
    @desktop-environment and dnf install @kde-environment. The desktop settings are
    excellent, too - Korora adds a GNOME Shell extension to GNOME that shows an application
    dock and it also adds the ''Open in Terminal'' contextual menu, for example. The
    theme of this distro is quite something.


    Gordon Thomas


    ### Pros

    - Fedora without post-install useful systems tweaks are preset, there''s a huge
    range of packages and the desktops are customised


    ### Cons

    - Inclusion of non-free software is available de facto. While Korora has some
    compromises (by the inclusion of non-free software), we have gained away expert
    users and developers. Korora 22 is an improved, polished and inviting system that
    we''ve seen in a long time.


    ### Summary

    Korora takes one of the best media distros and delivers a significant improvement,
    adding to the Fedora base what really makes it even better.


