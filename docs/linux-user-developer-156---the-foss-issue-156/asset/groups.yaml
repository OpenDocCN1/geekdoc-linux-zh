    Ubuntu Touch 的应用现在可以安装在普通的桌面电脑上了。


    ### 01 添加软件源


    可以在 Linux 上安装的核心内核应用可以通过 Ubuntu Touch 团队运行的 Core Apps PPA 访问。可用应用列表会根据每个发行版的不同而略有差异，但由于该手机目前侧重于
    15.04 Verid Vivid，我们将从这里开始。你可以将该存储库添加到你的列表中。


    由于 Ubuntu 现在已可以安装在普通的桌面电脑上，这些应用的设计使其能够在所有开发版本的 Ubuntu 上运行——你可以在桌面上配合设备一起进行软件测试。


    ```

    $ sudo add-apt-repository ppa:ubuntu-touch-core-ppa/daily

    ```


    为了帮助你开始，在本教程中，我们将向你展示如何在你的 Ubuntu 系统上安装 Ubuntu Touch 应用，以及哪些是真正值得使用的。让我们开始吧。


    ### 02 安装核心应用


    如果你愿意，可以安装所有应用，你也可以逐个安装，我们将在后续所有步骤中介绍。要这样做，你首先需要更新列表。


