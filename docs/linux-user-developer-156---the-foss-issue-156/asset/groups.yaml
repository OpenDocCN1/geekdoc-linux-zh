    # Tutorial Ubuntu apps


    ## Install Ubuntu mobile apps on your PC


    Ubuntu Touch from your mobile have gone cross-platform – here’s how to access
    them...


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_29_0.png)


    It’s weird to think that Ubuntu and Android phones are with us now. After many
    years existing under the radar most of its development, the fact that we now are
    in possession of actual phones as promised, in adding a growing ecosystem, still
    seems slightly surreal. The apps from Ubuntu Touch are now available to be installed
    on regular desktops.


    ### 01 Add the repository


    The core apps available for installation on Linux can be accessed via the Core
    Apps PPA run by the Ubuntu Touch team. The list of what is available varies a
    little per distro, but as the phone is currently focused on 15.04 Verid Vivid,
    we’re going to be working from here. You can add the repo to your list.


    As Ubuntu is now available to be installed on regular desktops, the apps have
    been designed so that they will work across all versions of Ubuntu in order to
    development – you can test software on your desktop along with a device.


    ```

    $ sudo add-apt-repository ppa:ubuntu-touch-core-ppa/daily

    ```


    To help you get started, in this tutorial we will be going to show you how to
    install Ubuntu Touch apps on your Ubuntu system, but also the best ones to actually
    use. Let’s get started.


    ### 02 Install the core apps


    You can install all the apps if you wish so, but you can also install each individually,
    which we will go over in all subsequent steps. To do this you first need to update
    your list.


    A manage of phones, right on your desktop


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_29_1.png)


    Rob Zweletsu

    models complex systems. developer proficient in Python. He has deep experience
    with computing


    Resources


    An Ubuntu distro


    ### 03 Access the apps


    The apps are not stored in their categories (the Mail app is also not in the Internet
    Stores), but they can be found in the Other category of software menu. You can
    search for the individual apps if you find them around development environment.
    They all all the name they''re given in the Ubuntu phone OS in the menus,


    `sudo apt-get update. Once that''s done, you can install them all using the metapackage
    touch-correaps`


    You''ll find this app Calendar in the menus, and you can install it with the following:


    ```bash

    $ sudo apt-get install touch-correaps

    ```


    How do they look?


    It''s a bit temperamental, so if it doesn''t work, the metapackage might be down
    for


    ```bash

    $ sudo apt-get install calendar-app

    ```


    - Using the mouse

    Remember, your mouse is a finger that will do, and clicking will be as effective
    as swiping a finger. Right-click and hold, which are functionally similar.


    - Sudoku

    The Sudoku app on Ubuntu is a great implementation of the game, with a good UI.
    It doesn''t assist you and it will let you put down incorrect answers so that
    you can clear them later if you''re not sure. It also has a ridiculously hard
    if you want a proper challenge.


    ### 04 Calendar


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_30_0.png)


    Left The Calendar app can be utilised as an organiser


    The Calendar app works the same way as it does on the Ubuntu Phone, although the
    default size of the window is more tablet-sized to make use of the space. Save
    your schedule, if you want to use it as a fully functioning organiser app.


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_30_1.png)


    ### 05 Dekko


    The apps all display in the aspect ratio of the screen maximized and them cropped
    only so much, as the apps maintain aspect ratios and scale without any problems.


    ```bash

    $ sudo apt-get install dekko

    ```


    Dekko can connect to multiple account types so you can easily read your mail locally,
    get notifications from messages arriving and the like. It enables you to get the
    web interfaces that the standard default apps uses and enable mail when you''re
    not online.


    ### 06 Dropping Letters


    Dropping Letters is a game for Ubuntu Touch, the package name for which is dropping-letters.
    Install it individually.


    ```bash

    $ sudo apt-get install dropping-letters

    ```


    The aim of the game is to spell out (dictionary) words with the letters that are
    falling from the sky. Once you''ve got the big word, you can claim your points
    and clear away some of the playing field. It''s risk and reward to wait for certain
    letters and get a bigger score while also risking game.


    ### ## Music


    The music playback for Ubuntu phones can be installed on your system using:


    ```

    $ sudo apt-get install music-app

    ```


    It won''t replace your music player on your standard system (it doesn''t hook
    into the global music controls. However, it''s interesting to see the way it plays
    and clears media if you''re doing any dev or music creation that would require
    you to know its working a bit better.


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_31_0.png)


    ### ## Calculator


    This is the basic calculator app for the Ubuntu phones. It''s inside the ubuntu-calculator-app,
    which can be installed using the following:


    ```bash

    $ sudo apt-get install-calculator-app

    ```


    A good, simple calculator, it doesn''t have any notification in it, but it does
    have brackets so that you can create calculations in your head. It also has the
    ability to create formulas - a quick way to save calculations or refer back to
    old numbers if you really need


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_31_1.png)

    ![](img/f16f9d33e3edd8d8_31_2.png)


    ### ## Notes


    This is the note-taking app for Ubuntu phone, a sort of Evernote or Keep. Keep
    it to be called Reminders, and so the package, install it with:


    ```bash

    $ sudo apt-get install reminders-app

    ```


    You can create notes to remember later and also set reminders. It''s a quite simple
    app: very useful on your phone, and if you use right it may be useful on the Ubuntu
    desktop after all.


    ### ## Clock


    The time and alarm app for the Ubuntu phones has the package name ubuntu-clock-app,
    and you can install it over your:


    ```bash

    $ sudo apt-get install ubuntu-clock-app

    ```


    If it is just a clock and you have already one on Ubuntu, you might be wondering
    the point of this. With this, you can set multiple time zones to scroll through,
    which is great if you have contacts and people to work around the world. It also
    allows to add alarms if you drag the slider at the bottom - something you don''t
    get on Ubuntu.


    ### ## DocViewer


    You can view PDFs and documents with this viewer. The package name is ubuntu-docviewer,
    installable with:


    ```bash

    $ sudo apt-get install-docviewer-app

    ```


    The DocViewer can view more than just PDFs, and also access your desktop files
    in order to open these types of files. Unfortunately, you can view any of files
    on the viewer - switch to nighttime mode for reading docs and text better in the
    dark.


    ### ## Sudoku


    Another game for Ubuntu phones, Sudoku is the classic puzzle game, and it''s under
    the package name sudoku-app. You can install it with:


    ```bash

    $ sudo apt-get install sudoku-app

    ```


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_31_3.png)

    ![](img/f16f9d33e3edd8d8_31_4.png)


    ### ## Documents


    ### 13 File Manager


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_32_0.png)


    This is a nicely file manager for Ubuntu Touch that you may rarely see, but it''s
    nevertheless included within it ubuntu-filemanager-app. Install it with:


    ```bash

    $ sudo apt-get install-filemanager-app

    ```


    This is actually a very nice file manager, the default one you get on any OS.
    It hooks into Ubuntu''s filesystem, so you can use it as a file manager for yours.
    For touchscreen, clicks work fine on screens, but you can also perform a right-click
    for options.


    > Although you certainly didn''t need to get extra emulators for Ubuntu, the phone
    does have some neat features


    Left File Manager works fine with Ubuntu''s filesystem so can also be used on
    your desktop


    ### 14 Shorts


    This is an RSS reader for the; the package name for this is ubuntu-rss-reader
    rather than Shorts. You can install it using:


    ```bash

    $ sudo apt-get install-rss-reader

    ```


    It''s a bit limited on Ubuntu to use for yourself; but it''s a good indicator
    of how your own feeds will look on Ubuntu Phones. Then you can make tweaks and
    optimize your own sites for people who are viewing on the phone.


    ### 14 Weather


    Unless, this is the best weather app, for checking weather or you should take
    an umbrella. The package name is ubuntu-weather-app, which you can install with:


    ```bash

    $ sudo apt-get install-weather-app

    ```


    not the best weather app for your PC, but you can at least see data it uses and
    how it handles. Tabbed tabs for multiple instances at once. It might be a beginner''s
    terminal.


    ### 15 Terminal


    A simple terminal emulator for Ubuntu, available using the package ubuntu-terminal-app.
    You can install it with:


    ```bash

    $ sudo apt-get install-terminal-app

    ```


    features. You can insert key comments if you can''t remember what they''re supposed
    to be. It has a bit of trouble accurately detecting your location on normal Ubuntu,
    however you can add your own location settings.


    ### 17 More apps?


    From the core apps, the apps available for Ubuntu will sound much more like the
    full desktop; it''s mostly down to the dev of those other apps and scopes as to
    whether they want it not. Ubuntu just is definitely worth checking out your own
    Ubuntu mobile apps on the Ubuntu desktop as part of your development process.

