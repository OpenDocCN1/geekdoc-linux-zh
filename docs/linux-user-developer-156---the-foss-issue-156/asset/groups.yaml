    # 教程


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_63_0.png)


    Christian Cowley

    自 2010 年起担任前 IT 和软件工程工程师，他曾在在线和纸质杂志上为计算机和创客者撰稿。


    # 构建无线电发射器


    利用抗干扰功能，在电波中留下你的印记


    回到 20 世纪 60 年，离岸船用于广播所谓的“海盗广播”：即未经许可的广播，为 BBC 的锁定节目（当时最受欢迎的广播电台）提供替代方案。海盗广播启发了
    Radio 1 电台和商业广播，但如今你不需要一艘船来追求你的 DJ 梦想——只需要一个树莓派。


    添加一个基础天线、一张保存了 MP3 歌曲的 SD 卡，以及一个自动播放的脚本，你就可以追随 John Peel 和 Tony Blackburn 的脚步了。


    这是一个全 DIY 项目，除了通常制作 SD 卡之外，还有许多 DIY 内容。你还需要一个电池组，而且之前在 美国展示过的 AA 电池 DIY 收藏值得你参考。


    警告：在 FM 波段进行未经许可的广播是违法行为。本教程仅仅是一个概念验证——例如可以用于学校的广播项目。


    # 你需要的物品


    - 跳线线

    - 2mm 导线

    - 热缩管

    - 烙铁

    - 剪剪线钳/剥线器

    - 吹风机/热风枪

    - PiRadio bit.ly/3MWvxxpp

    - PirateRadio.py 脚本 bit.ly/15Tkkech


    我们自制天线的边缘看起来有些粗糙，但它工作得非常好！


    # 01 收集设备


    通过下载 PIMF 文件（其大小为 2.3GB），如果你的连接较慢，则需要等待下载。同时，寻找一个天线。这可能是一个衣架，或者从当地电子元件店购买 2mm
    导线。在你那里时，顺便买一些热缩管和跳线线，确保你已准备好开始项目。


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_63_1.png)


    # 构建外壳


    好了，你已经为你的树莓派准备了合适的外壳，但为什么不为这个项目组合一个新的外壳呢？这是一个从广播主题中获取灵感并设计一个带有树莓派和真实天线的外壳的好机会。或者，梅森罐或任何其他宽口瓶也是
    PIMF 的绝佳家园——只需在盖子上钻一个用于天线的孔即可！


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_63_2.png)


    # Pi 无线电


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_64_0.png)


    检测到系统问题


    你想现在报告此问题吗？


    取消


    报告问题


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_64_1.png)


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_64_2.png)


    # 02 提前准备 MP3 文件


    没有直播广播的功能。相反，你需要提前准备 MP3 文件。这些文件将使用脚本播放并传输到最近的无线电。


    打算当 DJ 吗？一切尚未丧失，你可以使用 Audacity 或类似的开源音频制作工具制作自己的 MP3 文件。为了让文件按特定顺序播放，请对它们或文件夹进行编号。


    在 FM 波段进行未经许可的广播是违法行为。本教程仅仅是一个概念验证——例如可以用于学校的广播项目。


    由于你只需要 200-250mm 的长度，最佳选择是使用加热旋转刀（或钢锯）从金属衣架上剪出所需的长度。


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_64_3.png)


    # 03 准备你的树莓派


    计划在偏远地区尝试？你需要一个电池组来为树莓派供电，或者通过汽车的点烟器供电。为了灵活性，你可能还需要一个带有 SSH 软件的移动设备来无线连接到无头模式下的树莓派。


    当然，项目不必是便携的，你可以像往一样为树莓派供电。


    # 04 准备你的广播天线


    要从树莓派广播，你需要一个合适的天线。电子零售商有售直径约为 2mm 的铜线，但通常只有在...


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_64_4.png)


    # 05 连接跳线


    剥去母头跳线的线皮，留下足够的长度进行焊接。


    冷却后，在跳线的绝缘层和天线的下部分添加 50mm 的热缩管进行连接。这会在加热时收紧。加热时要小心，因为天线会变热并烫伤你的手指。


    # 06 连接天线


    天线连接到树莓派的 GPIO 4 引脚。在此之前，检查你的树莓派外壳是否适合高空安装。如果不，考虑使用导线的长度并将其胶贴在外壳的侧面。只要天线连接到引脚
    4，就可以了。


    # 07 准备你的 SD 卡


    对于所有树莓派项目，最好从新烧录的 SD 卡开始。为了快速获取，使用来自 GitHub 的链接磁盘镜像。


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_65_1.png)


    在整个教程中，我们提到了像 MP3 的音频文件，但树莓派项目的许多优点之一是它支持其他格式。在我们准备好 SD 卡时，你可以使用 FLAC、WAV 和 AAC。


    # 08 将你的 MP3 文件拷贝到 SD


    将烧录好的 SD 卡插入电脑，进入 /PirateRadio 分区并将你的副本粘贴到上面。


    位于 GPIO 4


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_65_0.png)


    # 09 配置 Pirate Radio


    将 SD 卡插入树莓派，用文本编辑器打开 pirateadio.config 文件。寻找频率设置，你需要将其设置为当前空闲的频率，根据需要修改 pirateadio.config
    文件。保存并退出文件。


    # 10 随机和连续


    如果你想向 SD 添加一些音乐，使用 pirateadio.config 文件中的 shuffle 和 repeat 设置。默认情况下，这些被设置为 true，要禁用它们，只需将它们改为
    false。除了简单使用编号的 MP3，你还可以放入包含整个专辑或艺术家的文件夹。完成后保存，并记得从电脑中取出 SD 卡。


    # 11 双声道还是单声道？


    pirateadio.config 文件提供了 true 或 false 的 stereo_playback 选择。请仔细选择，因为它将决定你广播的质量和范围。设置为
    true，广播将具有卓越音频质量。然而，范围将减少。


    # Pi 无线电


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_66_0.png)


    ## 广播许可


    关于模拟和数字广播电台许可，你需要的一切。你还将找到最新的广播更新，以及有关广播电台格式和限制性许可（RSLs）的信息。


    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_66_1.png)


    | 社区广播 | 限制性许可 | 商业广播 |

    | :--- | :--- | :--- |

    | 在本节中 | 每月发布广播更新 | 关于商业广播许可流程和限制性模拟许可的信息。 |


    需要的。所以 stereo_playback 将增加你的广播范围。由于发射器的尺寸，这只是一个问题。


    # 12 遵守法律


    使用这个项目很容易遇到麻烦，在开始广播之前，请确保你熟悉在树莓派上广播的法律和许可要求。为了在旧收音机上播放你的 MP3，虽然你必须修改天线的长度，但学校可能从树莓派站中受益。


    # 13 接入频率


    将 SD 卡插入树莓派并接入设备，离开设备进入另一个房间，带着你的收音机调到该频率。一旦你确认 MP3 文件正在广播即可。


    # 14 广播故障排除


    广播有问题？检查 FM 收音机是否能够接收其他信号。如果你在寻找 89-91 FM 的 Radio 2，这很容易被接收。你还应该检查脚本中的频率设置，因为英国的可访问频段为
    87.5-108 MHz。由于你无法访问这些点之外的频率...


    # 15 检查你的天线


    接收问题可以通过天线追踪。双倍检查连接是否牢固并确认导线连接到 GPIO 4。使用错误的引脚不会损坏你的树莓派。


    ## 此项目适用于短距离场景，例如在旧收音机上播放你的 MP3，虽然你必须修改天线的长度，但在音频广播或你的 FM 中同样不起作用。频段内的干扰可能是由于路由器和微波炉引起的。你树莓派的电源也可能导致问题。


    # 16 提高高度


    通过将树莓派和 FM 天线放置在高处可以提高范围。例如，位于二楼窗户。从高处广播可以获得更好的效果——但请记住项目需要保持短距离。


    # 17 保持纯净


    你将构建一个紧凑、便携的无线电发射器，但记住现在不是 20 世纪 60 年代，你不是革命者。如果可能导致刑事记录，请考虑将项目用于其他目的而不是广播。例如，你可以使用
    FM 中继器或创建一个无线麦克风。如果你真的想上电，可以考虑在当地社区内做志愿者。


    www.luxuser.com | 67


