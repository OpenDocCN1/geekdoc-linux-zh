    \ is more suited for situations where you need to process large amounts of text\
    \ data, such as log files, and it also supports arrays and regular expressions.\n\
    \n# 08 Programming in AWK\n\nThis step will show how to write an AWK function\
    \ that manages the content of the AWK line unit. As you can see, this AWK script\
    \ will use an END block for printing the results for each individual file after\
    \ it has been processed.\n\nThe example is simple: to use the C print function.\
    \ It is essential when you want better control of what is printed. The current\
    \ version of AWK does not support command line options like wc -\nThe modelOne\
    \ parameter lets the program know if it has to process more than one file. In\
    \ that case, we.awk will have to print totals.\n\n```\n### functions.awk\n# is\
    \ functions.awk\nfunction square(x) {\n    return x*x\n}\nfunction sum(n) {\n\
    \    s = 0\n    for (i=1; i<=n; i++) {\n        s += square(i)\n    }\n    return\
    \ s\n}\nfunction main() {\n    for (i=1; i<=10; i++) {\n        printf \"%d: %n\"\
    , i, sum(i)\n    }\n}\n```\n"
  mdcn: "\n\n# GNOME 和 Cinnamon\n\n对于任何使用基于 GNOME 环境的桌面（例如 GNOME 本身、Unity 和 Cinnamon），你都可以将脚本添加到启动列表中。从这里点击“启动应用程序下”（Under\
    \ Start Applications），并在此处添加脚本。如果你想再次运行它进行测试，请给它设置一个延迟，以便 GNOME 在尝试执行命令之前有时间正确加载。\n\
    \n> 由于我们希望脚本在所有程序启动后运行，因此我们应该使用桌面环境的启动函数\n\n点击“启动”（Startup）选项卡，这里就是我们需要放置脚本的地方。点击“添加脚本”（Add\
    \ Script）并浏览到它的位置。一旦找到它，勾选“运行在”（Run On）选项为“启动”并保存规则。你可以通过注销并重新登录来测试它。\n\n# 其他桌面\n\
    \n不同的桌面环境使用不同的方法在启动时启动应用程序——大多数与上述方法类似，但对于其他环境，你可能需要编辑文件才能使其工作。最好的办法是查看桌面的文档，看看你应该如何让脚本在启动时运行。\n\
    \n# 听音乐\n\n有了这一切，你一整天的音乐收听体验应该会更好。记得定期更新你的播放列表或添加更多歌曲。此外，不要害怕关闭你今天选择的脚本并使用你自己的。如果你想利用其他媒体播放器的功能，可以使用其他的播放器。\n\
    \n![](img/f16f9d3399c2c447b8fa7812e3edd8d8_44_0.png)\n\n# KDE\n\n在 KDE 中添加脚本代码与\
    \ GNOME 大大相同，尽管你需要区分系统中的程序和脚本。在 KDE 设置中，寻找“启动和关闭”（Startup and Shutdown）菜单，第一个\n\
    \n![](img/f16f9d3399c2c447b8fa7812e3edd8d8_44_1.png)\n\n你选择的桌面将有其自己的将脚本添加到启动的方法\n\
    \n# AWK 编程教程\n\n## 中级 AWK 编程\n\n通过这个循序渐进的教程，将你的 AWK 知识提升到新的层次\n\n![](img/f16f9d3399c2c447b8fa7812e3edd8d8_45_0.png)\n\
    \n我们将从关于 AWK 的一点历史信息开始这个教程；教程其余部分将处理更高级的 AWK 编程技术，例如代码块的使用和开发。\n\nAWK 的名字来源于其三位作者的名字：Alfred\
    \ Aho、Peter Weiner 和 Brian Kernighan。它是一种在 AT&T 贝尔实验室开发的实用模式匹配语言。变体版本与 AWK 原版本之间最大的区别在于，新版本支持更多的内置函数和变量。\n\
    \n如果你以前用过 AWK，你可以预期能够同样很好地解决每个问题。它更适用于需要处理大量文本数据（如日志文件）的情况，并且还支持数组和正则表达式。\n\n\
    # 01 安装 AWK\n\n虽然每个 Linux 发行版都带有 AWK，但本文将引导你通过运行 `apt-get install gawk` 来使用特定版本\
    \ `gawk`，它已经安装在 Linux 上：\n\n如果没有安装，你可以通过运行命令在 Debian 系统上安装 gawk。接下来，你可以通过运行 `gawk\
    \ -V` 找到你的 gawk 版本。所有的 AWK 代码将以以下格式的独立执行程序的形式显示：\n\n你可以通过以下命令为 AWK 脚本赋予执行权限：\n\
    \n```bash\n# /usr/bin/gawk -f\n```\n\n```awk\n# 没有 nextfile 语句\n$ # FATAL ERROR\n\
    $ cat ./BEGIN.awk *\nNew file filenames.awk\nNew file BEGIN.awk\nNew file BEGIN.awk\n\
    New file CANNOTREAD\ngawk: BEGIN.awk:8: fatal: cannot open file 'CANNOTREAD' for\
    \ reading (Permission denied)\n# 使用 nextfile 语句\n$ cat BEGIN.awk -f\n# /usr/bin/gawk\n\
    \nBEGIN {\nBEGINFILE {\n  print \"New file\", FILENAME\n}\n\n# 检查在尝试读取文件时是否有错误\n\
    if (ERRNO)\n}\nn\n```\n\nMihalis Toukalos\n赫尔辛基大学的管理员，曾任程序员和数学家。自 1993 年以来一直如此\n\
    \n# 资源\n\n| 文本编辑器 | Gawk |\n| :--- | :--- |\n| | gnu.org/software/gawk |\n| Mawk\
    \ | invisible-land.net/mawk |\n\n| 右 使用 ERRNO 变量使用 extfile 函数可以帮助你在处理多个文件时避免出现致命错误\
    \ |\n\n# 02 AWK awks\n\nAWK 按行读取输入，并将每行拆分为行字段。AWK 具有自动初始内置变量，还具有用于字符串、数值和时间处理的内置函数。\n\
    \nNF 包含输入记录中的字段数；每个记录可以有不同数量的字段。FS 是内置字段分隔符，默认定义为单个空格。此外，任何数量的前导或尾随空格都被视为空白。如果它的值不为空，那么该行中的字符将成为字段分隔符。\n\
