    Canonical, creator of the popular Ubuntu distribution, has settled its long-running
    dispute with the Free Software Foundation and the Software Freedom Conservancy
    over its intellectual property, by adding a ''truce clause'' for GNU General Public
    License.


    Under this policy, the GPL includes a clause specifying that "where any other
    license grants, this policy does not modify or reduce those rights under licenses"
    - a hard exception to the usual GPL rule.


    The Free Software Foundation, however, was not happy with it. "The FSF acknowledges
    that the first issue emerging from the policy - its interference with users''
    rights under the GPL and potentially cover other licenses within Ubuntu - the
    policy prevents freedom for others," the group said in a statement on the matter.
    "The FSF will continue to provide feedback to Canonical in the days ahead, and
    urge them to monitor any changes."


    "Canonical, in ours, repeatedly expressed that it is their full right to develop
