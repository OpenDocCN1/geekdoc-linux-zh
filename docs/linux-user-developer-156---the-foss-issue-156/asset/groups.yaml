    \ knowledge to the next level with this step-by-step tutorial\n\n![](img/f16f9d3399c2c447b8fa7812e3edd8d8_45_0.png)\n\
    \nWe will begin this tutorial with a touch of historical information about AWK;\
    \ the rest of the tutorial will deal with more advanced AWK programming techniques\
    \ such as the use and development of code blocks.\n\nThe name AWK comes from the\
    \ names of its three authors: Alfred Aho, Peter Weiner and Brian Kernighan. It\
    \ is a handy pattern-matching language developed at AT&T Bell Labs. The biggest\
    \ difference between the variants and the original version of AWK is that newer\
    \ versions support a larger set of built-in functions and variables.\n\nIf you\
    \ have used AWK before, you can expect to solve every problem equally well. It\
    \ is more suited for situations where you need to process large amounts of text\
    \ data, such as log files, and it also supports arrays and regular expressions.\n\
    \n# 01 Installing AWK\n\nAlthough AWK comes with every Linux distribution, this\
    \ article guides you to use a specific version gawk by running the apt-get install\
    \ gawk which is already installed on Linux:\n\nIf it is not installed, you can\
    \ install gawk on a Debian system by running. Next, you can find your version\
    \ of gawk by running gawk -V. All AWK code will be shown in the form of autonomous\
    \ executable programs in the following format:\n\nYou can give execute permissions\
    \ to an AWK script with:\n\n```bash\n# /usr/bin/gawk -f\n```\n\n```awk\n# Without\
    \ the nextfile statement\n$ # FATAL ERROR\n$ cat ./BEGIN.awk *\nNew file filenames.awk\n\
    New file BEGIN.awk\nNew file BEGIN.awk\nNew file CANNOTREAD\ngawk: BEGIN.awk:8:\
    \ fatal: cannot open file 'CANNOTREAD' for reading (Permission denied)\n# With\
    \ the nextfile statement\n$ cat BEGIN.awk -f\n# /usr/bin/gawk\n\nBEGIN {\nBEGINFILE\
    \ {\n  print \"New file\", FILENAME\n}\n\n# Check if there is an error while trying\
    \ to read the file\nif (ERRNO)\n}\nn\n```\n\nMihalis Toukalos\nAn administrator\
    \ at University of Helsinki, a former programmer and a mathematician. Has been\
    \ since 1993\n\n# Resources\n\n| Text editor | Gawk |\n| :--- | :--- |\n| | gnu.org/software/gawk\
    \ |\n| Mawk | invisible-land.net/mawk |\n\n| Right Using the extfile function\
    \ with the ERRNO variable helps you avoid fatal errors when processing multiple\
    \ files |\n\n# 02 AWK awks\n\nAWK reads input line by line and splits each into\
    \ line fields. AWK has built-in variables that are automatically initialized and\
    \ also has built-in functions for string, numeric and time-manipulation.\n\nThe\
    \ NF holds the number of fields in the input record; each record can have a different\
    \ number of fields. The FS is the built-in field separator, and it is defined\
    \ by default as a single space. Additionally, any number of leading or trailing\
    \ spaces are considered blank. If its value is not null, then the character in\
    \ that line becomes the field separator.\n\n> The first gawk version was introduced\
    \ in 1986. It is still the most powerful and popular version of AWK\n\nonly END\
    \ reads without any additional code, all the specified input is read before the\
    \ END rule needs to reference FNR or NR.\n\nThe FNR variable is for keeping the\
    \ total number of records that have been read from the input file only, keeping\
    \ track of the number of records that have been read so far.\n\n# Versions of\
    \ AWK\n\nThe original version of AWK was introduced in the first AWK back in 1977.\n\
    \nIntroduced in 1986, Michael Bryan introduced AWK variant named gawk, which is\
    \ still a popular version of AWK.\n\n# 03 Using BEGIN and END\n\nAWK has patterns\
    \ named BEGIN and END, each of which has a specific and meaning. It is noted that\
    \ both are executed once: once before getting any input and processing input.\
    \ They are used to set up and finish an AWK program.\n\nAlthough it is not required\
    \ to have BEGIN rules before your AWK program and the END rule at the end, it\
    \ is considered good practice to put them there. AWK program can have multiple\
    \ BEGIN and END rules.\n\nIf an AWK program has only BEGIN rules without any other\
    \ rules without reading any input, an AWK program contains\n\n# 04 Using BEGINFILE\
    \ and ENDFILE\n\nTwo patterns have a special function: BEGINFILE and ENDFILE -\
    \ please note that these only work on GAWK. BEGINFILE is executed before the first\
    \ record read and ENDFILE is executed done with the last record of a file.\n\n\
    ENDFILE can be used for removing rows from the input file that AWK can pass the\
    \ control to ENDFILE (stopping almost normally) and the ERNO variable which describes\
    \ the error that has happened. Similarly, the nextfile when used inside BEGINFILE,\
    \ allows gawk to move to the next data file instead of exiting with a fatal error\
    \ and without executing END.\n\nThe presented showcases their usage by printing\
    \ the total number of files as well as the filename of each item. Each code also\
    \ reports if there is a problem reading a file. The printing of the filename is\
    \ done with the help of the FILENAME variable.\n\n```\nNew BEGINFILE.awk\nNew\
    \ file CANNOTREAD\nCannot read CANNOTREAD next file!\nNew functions.awk\nNew special.awk\n\
    Total number of files processed: 6\ncat BEGIN file.awk\n# /usr/bin/gawk -f\nBEGIN\
    \ {\nnumberFiles = 0\n}\nBEGINFILE {\nprint \"New file\", FILENAME\n# Check if\
    \ there is an error while trying to read the file\nif (ERNO) {\nprint \"Cannot\
    \ read\", FILENAME, \"Processing next file!\"\nnext\n}\n```\n\n![](img/f16f9d3399c2c447b8fa7812e3edd8d8_44_0)\n\
