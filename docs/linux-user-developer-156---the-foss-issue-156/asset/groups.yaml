    # ## 11 Change status bar preview


    When you select some cells with a numerical value inside, you get a handy prompt
    on the status bar that tells you the value you added. That might not be what you
    want the time, Click on the status bar to change it to average, maximum or minimum
    numbers in the selection.


    # ## 09 AutoFormat tables


    If you created a table, you may need to give it colours to make it more readable.
    You can do this manually, however Calc has an AutoFormat here which can give you
    a colour scheme to your table and even customise what is take into account for.


    # ## 12 AutoFilter rows


    Filtering rows to organise data, but if you''re not sure exactly to go doing that,
    Calc has an automatic filtering you can use. Select a row, then go to Data/Filter
    to activate automatic filtering based on that row. You can also modify it if it''s
    in place.


    # ## 10 Protect your spreadsheet


    Shared spreadsheets are good for productivity, but the more difficult it can be
    the more likely accidental change made by one of the users. You can protect the
    spreadsheet using Tools/Document/Sheet to give it a password so that only certain
    people can make changes.


    # ## 13 Grouped cells


    Sometimes you don''t need to specific cells of data all the time, and collapsing
    it like in a piece of code would add to the viewable page. Using the function
    under Data/Group and Outline=OutlineOut, you can create these groups, which use
    a thick line to indicate themselves.


