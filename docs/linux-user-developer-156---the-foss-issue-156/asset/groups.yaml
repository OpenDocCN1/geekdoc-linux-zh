    ![](img/f16f9d3399c2c447b8fa7812e3edd8d8_2_0.png)


    Welcome to the latest issue of Linux User & Developer, and the UK and America''s
    favourite Linux and open source magazine.


    Open source has never been as crucial as it is now. Linux is enjoying unprecedented
    freedom to move open source business models, embrace means developing new tools,
    and open code bases to further import technologies that shape our future.


    Jon Masters is a kernel hacker who has been working on Linux for over 19 years,
    since he first attended university at 18. He now lives in Cambridge, Massachusetts,
    and works for a large enterprise Linux vendor. You can find his Kernel Column
    on pages 12-13.


    This month, we reveal the open source contributions from the world''s biggest
    tech companies (page 14). We also take a look at landed FOSS in our lead feature
    (page 16), selecting the best-in-class apps so you''re getting the most out of
    your Linux system. Our feature includes guides too, and we find the Novena Python
    library that helps fly drones (38 from page 28). On the Raspberry Pi we''re broadcasting
    homebrew radio stations (page 64) and showing how you can track the ISS (page
    54). Now may you enjoy it!


    Nitish Tiwai is a software professional and open source consultant. He helps firms
    set up and use open source software. This month, he shows the tech techs who are
    shaping how to handle social media marketing with Campaign(page 34).


    Dan Alder is a Raspberry Pi Certified Educator and a Lead School Teacher at CAS.
    He is passionate about creating and hacking projects, and uses open source to
    engage the students. In this issue, we find out how his students won the Raspberry
    Pi competition and how you can too.


    This month, we also find a farewell to the talented Jon Zwetsloot, the creative
    heart of this magazine (and king), who has been with us for three years. Now we
    wish him the very best in his new adventures and the future.



    Gareth Halifree is our resident reporter and brings us the latest developments
    from the open source world, starting over on page 27. He reviews the Novena All-in-One
    Desktop, a new computer built with open hardware and software.


