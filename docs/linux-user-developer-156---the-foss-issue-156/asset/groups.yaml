    ## FAQ


    ### Linux graphics

    Q: Are there any issues with certain graphics cards on Linux?

    A: These days, pretty much all AMD, NVIDIA and Intel graphics cards will work
    fine out of the box on Linux distro. Drivers and modules in the kernel are generic
    enough, and most drivers are already installed.


    Q: What''s the deal with NVIDIA drivers?

    A: NVIDIA drivers are not open source, while there is an open solution for NVIDIA
    that most of us use Nouveau is not always as stable as the restricted proprietary
    drivers, can be accessed easily though and carry extra agreements.


    Q: Can I download up-to-date drivers for Linux online?

    A: Absolutely. If you don''t have them you should be able to find all of the releases
    on the respective store or the ones you already have access to.


    ### Drive switching

    I had an HP Pavilion laptop which had Kali Linux installed instead of a dual-boot
    configuration. I pulled the hard drive and put a different one in, and it works
    for dual-boot on a different laptop. Now when I start my computer, Linux pops
    up, but then it shows Windows on it. It shows Windows Recovery, and when I select
    it screen pops up and says that a recent hardware change has made it impossible
    to boot. Are there any ideas? I was thinking maybe I needed a BIOS update since
    this is an older laptop that came with Windows 7. I am new to Linux, but have
    never messed with dual-boot hard drives, so I''m a bit lost. Starting with Windows
    7, Microsoft has added extra features that will disable Windows if a significant
    hardware change has occurred. This requires you to re-enter license key. Windows
    8.1 also has this feature. It''s not just OS issue - you''ve put it in a completely
    different computer. You might have to reinstall


    ## How do I make it recompile all files, if the makefile is looking at the timestamp
    of each file though are not modified?


    ### Quick compiling

    While running a file or build, a rule is generated (let''s say from to) and placed
    into /path/code/; if you then modify what needs to be the files, they are overwritten
    by the created files. As a result, they are not updated, leading to problems where
    not of the files are compiled. For some reason timestamps determine what needs
    to be included when compiling and won''t work recompiling.


    How do I make it recompile all files, if the makefile is looking at the timestamp
    of each file though are not modified?


    You can force the makefile to look for timestamps, which should sort this problem
    for you. You can do this with:


    ```

    $ make -T

    ```

    Only use this when you are recompiling, though.


