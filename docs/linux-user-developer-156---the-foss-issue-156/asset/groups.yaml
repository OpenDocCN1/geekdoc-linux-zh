    # HOW OPEN SOURCE GIANTS


    # ARE CHANGING THE WORLD


    Major tech companies are open-sourcing their most important software – here are
    the biggest projects


    T here have been talks about open source going mainstream for quite some now,
    but taking it doesn''t always mean nothing. To really check if there has been
    growth, innovation and adoption of open source software, we need to take a look
    at the companies that dictate the ways and related technologies are shaped.


    open source does it best. There are many different reasons, depending on the company
    and industry. For example, a social media company like Facebook faces no disadvantage
    by leveraging its stack; rather, the innovation around the core stack helps it.
    For instance, Microsoft is being open and inclusive as it continuously faces competition
    from Linux. Microsoft still uses its OS on the cloud, it simply cannot free a
    large part of the cloud infrastructure. Open source support has become more of
    a necessity for the company.


    But, there are questions – why large corporations, both with and without outsourcing
    see the benefit for them? To understand here is the technological innovation works
    – it''s all about compatibility and interconnectivity. Today, almost all modern
    software is completely, truly standalone. At some point in time, software has
    to talk to some other software to get things done. So, collaboration is the key
    for the upcoming technologies, and


    A study of how well these questions treat open source would a good idea. In this
    article, we will look at some of the biggest giants in the tech world, their contributions
    to open source and how they engage with the open source community.'
