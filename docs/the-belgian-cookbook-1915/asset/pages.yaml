  md: '# The Belgian Cookbook (ed Mrs Brian Luck) [with accents]


    The recipes in this little book have been set by Belgian refugees from all parts
    of the United Kingdom, and it is through the kindness of these correspondents
    that I have been able to compile. It is thought, also, that British cooking may
    benefit by the study of Belgian dishes.


    The perfect cook, Mrs. Arris or the fourth dimension, is often heard of, but never
    actually found, so this small manual is opened for the use of the work-a-day and
    inexperienced mistress and maid. It is not written in the interests of millionaires.
    The recipes are simple, and most inexpensive, rather for persons of modest means
    than those who can follow the famous directions for a certain savoury: "Take a
    leg of mutton," et c. A shelf of provisions should be valued, like-making, not
    only for itself but for what it may become.


    SAVORIES: If you serve them, let them be an ankle, some neat and alluring. This
    dish is not obligatory; recollect that it is a culinary work of superrogation.


    SOUP: Let soup be extremely hot; do not let it be the Laodiceans. You know what
    St. John said about them, and you would be sorry to think of your soup sharing
    the fate with which he describes with saint veyre. Be sure that your soup has
    a good foundation, and avoid the Italian method of making consommé—which is to
    put a pot of water on and to drive a cow past the door.


    FISH: It is a trusty to say that fish should be absolutely fresh, yet too many
    cooks think, during the week-end, that fish is like the man of the Hebrews, was
    imbued with Sabbatarian principles that keep it from Saturday to Monday. I employ
    you to think about fish. It is most nourishing and strengthening food—other qualities
    it has, too, if one must believe the anecdote of the Sultan and the two anchors.


    MEAT: If meat be cooked in water, let it not boil but simmer; let the just put
    wisely agree of a good dish to come. Do you know what English tourist said, looking
    into a Moorish cooking-pot? "What have you got there? Mutton and rice?" For the
    moment, Sid, it is mutton and rice," said the Moor; "look in two hours, insallah,
    when the garlic is hissed, it will be the most nourishing comforter from Mecca
    to Casa Blanca." Simmer and season, then, your meats, and let the onion (if not
    garlic) just kiss the pot, even if you allow no further intimacy between them.
    Use bay-leaves, spices, herbs of all sorts, vinegar, cloves; and never forget
    pepper and salt.


    Game is like love, it has been appreciated when it comes to. Only experience will
    teach you, by blowing up the breast feathers of a pheasant, that it ought to be
    cooked-to-day or to-tomorrow. As a rule, we are very particular about the dressing
    of a game, though they may not be able to tell, the Frenchman, who of his legs
    was in the habit of sitting. Game should be under rather than well done; it is
    never better without well-buttered roast to understand the gravity, and to carve
    it with knife


    VEGETABLES: Nearly all are at their best (brunettes) just before they are fully.
    So says a great authority, and no doubt he is thinking of young peas and beans,
    lettuce and asparagus. To try dry such as potatoes, pumpkins, cabbages, carrots,
    in ways other than boiled in water, for the water removes the leaves and the fiber.
    Let not your vegetable—dishes remind you account of Froissart''s cod, which was
    "rubbed in a little water."


    SWEETS: It is difficult to give any general directions for sweets. They should
    be made to look attractive, and they should be constantly varied. The same remarks
    apply to savories, which last ought to be highly seasoned, whether hot or cold.


    MADE DISHES are a great feature in this book. I have tried to help those small
    households who cook, let say, a leg of mutton on Sunday, and then see it through
    the week in various guides till its days honourable as soup on the following Friday.
    Endeavor to find from your husband that you are making'
