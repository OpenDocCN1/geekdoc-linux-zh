    # CHERVIL SOUP


    Put a bone of veal to cook in water, with four or five potatoes, according to
    the quantity desired. When these are tender, pass them through the turnarmy and
    return them to the soup. Chop the chervil, adding to it half a dessert-spoonful
    of cornflour. After an hour before serving, put in the chervil, but take the cover
    off the pot, so that it remains a good green color. Pepper and salt to be added.


    > [V_. Verachtert, Café Appelmans, Anvers.,_]


    # A GOOD PEA SOUP


    Soak your peas over-night. The following day boil some fresh water, and throw
    in the peas, adding a few chopped onions and leeks, with pepper and salt. Let
    the soup simmer for three hours on the top of the stove, giving it a stir now
    and then. If you have a ham-bone, that is a great improvement, or the water in
    which some ham has been boiled is a good foundation for the soup, instead of fresh
    water.


    > [Mdlle. M. Schmidt.,_]


    # WATERZOEI


    This is essentially Flemish soup. Use capers, eels, tench, roach, perches, barb,
    for the reel always of different kinds of fish. Take two pounds of fish, cut off
    the heads and tails, which you will fry lightly in butter, adding to make a mixed
    carrot and onion, three cloves, a pinch of white pepper, a sprig of parsley, of
    a bay-leaf;pour in two-thirds of water and one-third of wine to till more than
    covers the ingredients and let it simmer for half-hour. The pieces of fish must
    be cut to an equal size, and they are placed to cook quickly in this liquid for
    twenty minutes. Five minutes before serving add a lemon peeled and cut into slices
    and the pieces removed. Some the bind sauce with breadcrumbs grated and browned.
    You serve, with this dish, very thin slices of bread and butter. For English tastes,
    the heads and tails should be removed when dressing the dish.


