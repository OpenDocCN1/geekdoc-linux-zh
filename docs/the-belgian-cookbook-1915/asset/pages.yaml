    # PEASANTS'' EGGS


    For six people on the fire two handfuls of sorrel, reduce it to a puree, and add
    two desserts of cream, a lump of butter size of a pigeon''s egg, pepper, salt.
    Take six hard-boiled eggs, and crumbling the yolks, add them to the sour puree.
