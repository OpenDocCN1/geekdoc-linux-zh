    eggs and a tablespoon of cream. Take out a bean and it to see if it is cooked,
    and if so, pour all on a hot dish. Garnish with fried snippets of bread. Old beans
    can be treated in the same way, but they must be skinned.


    > [Aimee_]


    # OMELETTE OF PEAS


    Beat up three eggs, to add one tablespoon of grated cheese, pepper, and salt,
    and mix thoroughly. Butter an omelette pan, and pour in the mixture, keep moving
    it with a fork while you sprinkle in with the other hand some cooked green peas.
    The omelette will be cooked by the time you have sprinkled in two handfuls. Slip
    it off a very hot dish, fold over, and serve at once.


    > [Jean O._]


    # BRUSSELS ARTICHOKES


    Wash some good artichokes, and boil them in salted water. Meanwhile make a good
    mushroom filling, highly seasoned, of cooked mushroom, dip into butter, pepper,
    salt, few breadcrumbs, and shreds of ham. Remove the center leaves from the vegetable
    and as much of the chuke as you can. Fill up with the mushroom force and stew
    gently in brown sauce flavored with a bunch of herbs.


    > [_F. R._]


    # BELGIAN SALAD


    is merely dressed, washed and torn apart with red peppers added here and there
    as well as the ordinary salad dressing.


    Belgian asparagus is done by adding to the cooked vegetable bechamel sauce, poured
    over the dish, and then slices of boiled eggs placed on the top. The giant asparagus
    is used, and it is eaten with a fork.


    > [A Grocer''s Wife_]


    # BRUSSELS CARROTS


    Cut young carrots in small pieces, blanch them in salted water; melt some butter
    in a stew pan, add enough water and extract to make sufficient for the carrots,
    season with pepper, salt and a pinch of sugar and toss the carrots in this till
    they are tender. Then add the yolk of an egg and a tablespoon of cream, holding
    the pan off the fire with the left hand, while you stir with the right. When it
    is well mixed pour all'
