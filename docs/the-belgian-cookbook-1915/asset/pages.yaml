    [_Madame Groubet,_.]


    # FRUIT ELLIES


    Jellies that are very well flavored can be made with fresh fruit, raspberries,
    strawberries, apricots, or even rhubarb, using the proportions of one ounce of
    gelatin (in cold water) to every fruit of puree. In hot weather use a little less
    gelatin. As the fruit gives a bad color, you must use cochineal for the hot jellies
    and a little green coloring for gooseberry jellies. The gelatin is of course melted
    in the fruit puree and all turned into a mold. You may make your own green coloring
    in this way. Pick a pound of spinach, throwing away the stalks and midrib. Put
    it in a pan with a little salt and cover the down. Let it boil for twelve minutes.
    Then put a fine sieve over a basin and pour the spinach water through it. Strain
    the spinach once or twice through muslin; it will be a good color and keep some
    time. Orange and lemon jellies are much more wholesome when made at home than
    those from bought powders. To the juice of every six oranges you add the juice
    of lemon, and you procure as much from the fruit, just before you squeeze it,
    let it soak in hot water for three or four minutes.


    [_Pour la Patrie._]


    # STRAWBERRY FANCY


    Take a slice or two of plain sponge cake and cut rounds two inches across. Then
    whip up in a basin the whites of four eggs, coloring them with the thinner part
    of strawberry jam. As a rule this jam is not red enough, and you must add a little
    cochineal. Put the pink mixture in high piles on the cakes.


    [_Pour la Patrie._]


    # PINK RICE


    This sweet is liked by children who are tired of rice pudding. Boil your rice
    and tender mix in with the juice of a boiled beetroot to some sugar has been added.
    Turn it into a mold and when cold remove and serve it with a spoonful of raspberry
    preserve on the top or with red plums run under.


    [_Pour la Patrie._]


    # MILITARY PRUNES


    Take some of the best French preserved prunes, and remove the stones. Soak them
    in orange curaçao for as long as you have at your disposal. Then replace each
    stone by a blanced almond, and place the prunes in small crystal dishes.


    [_Pour la Patrie._]


    # MADELINE CHERRIES


    Take some Madeleine cakes and scoop them out to form baskets. Fill these with
    stoned cherries both white and black that you have soaked in a good liqueur—cherry
    brandy is the best but you may use maraschino. Place two stalks of Angelica across
    the top and where these intersect a very fine stoned cherry.


    [_Pour la Patrie._]


    # STRAWBERRY TARTLETS'
