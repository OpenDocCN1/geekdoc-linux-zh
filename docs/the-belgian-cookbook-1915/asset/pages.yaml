    # 49


    out on a vegetable dish and sprinkle over chopped parsley.


    [Amie reconnaissante_]


    # CARROTS AND EGGS


    Make the same preparation as above, for the sauce, with the same seasonings, but
    add a dash of nutmeg. Then add half a pint of white stock which will be enough
    for a small bunch of carrots; simmer them for fifteen minutes and then break in
    three whole eggs, taking that they fall apart from each other. Let them cook until
    nearly set (for they will go in the hot sauce after you remove them from the fire)
    and serve at once. This is nearly good if you use old carrots sliced, instead
    of the young ones.


    [M. Zoeben_]


    # CUCUMBERS AND TOMATOES


    Take two earthenware pots and put some tomatoes to stew in one, in water, pepper,
    and salt. Peel a cucumber, open it, remove the seeds and stuff it with whatever
    you have; but a white one is best. Let it cook gently in some brown stock, well
    covered over. When tender put the cucumber along the dish and tomatoes on each
    side. A puree of potatoes can surround them.


    [A. Fanderverde_]


    # RED HARICOTS


    Soak some white haricot-beans over night, then them till tender in some weak stock.
    Make a tomato sauce in a saucepan, and flavor it rather with mustard, stirring
    well, so that it is well incorporated. When the beans are tender, drain them from
    the liquor (keeping them hot) and reduce to half its quantity. Put back the beans
    and add the tomato sauce, heat for a couple of minutes, and serve with three-cornered
    pieces of toast.


    [Elise et Jean.]


    # POTATOES A LA BRABCONNE


    Boil some potatoes, rub them through a sieve, add pepper, salt, a spring or two
    of parsley and a tablespoonful of cream to a pound of potatoes, rub through a
    tammy again. Chop a shallot, a spring of parsley and mix them in, sprinkling at
    the same time a dash of nutmeg and a dessertful of grated cheese. Place the puree
    in a dish to be baked, and before setting it in the oven sprinkle on the top bread-crumbs,
    and cheese grated and mixed one or two pats of salt butter. Bake till it is a
    golden brown.


    [Elise et Jean.]


    # FLEMISH PEAS


    Cook some young peas and some carrots (scraped and shaped into cones) in separate
    pans. Then put them together in an earthenware close covered pan to simmer together
    in butter and gravy, the first water having well drained from the pan. Season
    with pepper and salt and let them cook gently for ten or twelve minutes; do not
    uncover the pot to stir it, but shake it every now and to prevent the contents
    from burning.


    [Amie inconnue_]'
