    # MUSLIN SAUCE


    Melt a piece of butter the size of an egg, sprinkle and stir in some flour, adding
    water if it is too thick. Keep stirring over the fire for five minutes, and still
    stirring, add pepper and salt and the yolks of two eggs. You may add the yolks
    of three or four eggs if you wish for a rich sauce. The last item is the juice
    of a lemon to your taste. This is a very popular addition to meat.


    > [_Mme. Spinette._]


