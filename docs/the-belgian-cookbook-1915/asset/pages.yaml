    [_A Belgian at Droitwich._]


    # HOCHE POT GANTOIS


    (For eight or nine persons)


    Take one pound beef, one pound pork, and one pound mutton; cut into pieces about
    three inches by two, let it boil, and skin. Take two carrots, one large turnip,
    one head of celery, or four leeks, a good green cabbage, cut in four, other vegetables
    into pieces of moderate size, not too small; put them in the meat, and see that
    they are covered by the water. Let it boil for three to four hours, and then quarters
    of an hour before dish, add some potatoes in pieces.


    To dish: Place the meat in the center of a flat dish, and the vegetables around;
    serve the liquid in a soup-tureen. This dish should be eaten out of soup plates,
