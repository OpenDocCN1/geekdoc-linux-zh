    [_V. Verachtert._]


    # HEADLESS SPARROWS


    Take two pounds of beef, which must be lean and cut in slices. Cut your slices
    of beef in five inches by three. Put in the middle of each piece a little square
    of very bacon, a sprig of parsley, pepper and salt. Roll the slices and tie them
    round with a thread so that the seasoning remains inside. Melt in a pan a lump
    of butter of a very big egg. Let it get brown and then, after rolling the beef
    in flour, put them in the butter. Let them cook for five minutes, half a pint
    of water, and let them simmer for two hours. Fill up with water if it becomes
    too dry. Before serving, take great care to remove the threads.


    [_A Belgian at Droitwich._]


    # MUTTON STEW


    Take two pounds of mutton, the breast or one of the interior parts will as well
    as a prime cut. Put in an earthenware pan of butter as big as an egg, and let
    it. Cut the mutton in pieces and let them color in the butter, adding salt and
    pepper, a few onions or shallots. When all are colored, add a pint of turnips,
    cut in slices, with about a pint of water. Let it boil until the turnips turn.
    Then add two and one-half pounds of potatoes; salt and pepper these, but in moderation,
