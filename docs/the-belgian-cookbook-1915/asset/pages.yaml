    # 53


    If you have only a little piece of veal or other cold meat, you can make a very
    presentable dish in the following way: Cut a slice of meat and spread on each
    side of it a layer of mashed potatoes to which you have added some tomato sauce.
    Beat an egg and dip the slices and potato into it, lay them in fine breadcrumbs
    and fry them till a golden color in plenty of fat. Serve this dish under a table
    for cover.


    [Pour la Patrie._]


    # STEWED BEEF


    If you are obliged to make a hot dish in a hurry and have only a piece of inferior
    meat, there is no better way of using it by dressing in the Brabant way, which
    is rather expensive. Clean and cook some mushrooms, and when fried lightly, add
    them and their liquor to your beef, cut up in small pieces, but not minced. Add
    pepper, salt, dust of spices, or an onion with three or four cloves, and a half
    bottle of red wine. Stew all together for at least twenty minutes, take out the
    onion and cloves, and serve in the dish which was cooked in should be earthenware
    pot.


    [Pour la Patrie._]


    # A MUTTON SALAD


    Cut some slices of cold mutton or lamb, removing every bit of fat and skin that
    you can, unless that destroys the firmness of the slice. Prepare a salad of lettuce,
    and if you cannot make a mayonnaise, add to the lettuce piece sliced cucumber,
    for that keeps the mutton moist. Put the salad on each and roll the meat over
    as tightly as you can. Lay the rolls together in a dish and sprinkle a very little
    salad dressing over them. This way of doing meat is very useful for taking to
    picnics, or for taking on a long journey.


    [Pour la Patrie._]


    # SAUSAGE PATTIES


    Half a pound of sausage of any kind that you like. Make some rounds of paste,
    lay the meat on half of each round and fold over. Steam for quarter of an hour,
    or stew in plenty of gravy.


    [Pour la Patrie._]


    # SAUSAGE AND POTATOES


    Roll some cooked sausage in mashed potatoes, making a roll for each person. Brush
    the potatoes with milk and bake them to till nicely browned. Decorate with gherkins
    on each roll of butter.


    [Pour la Patrie._]


    # RAGOUT OF COLD MEAT


    Take any cold meat that you have, free from fat and skin and cut it in rounds
    like a five-pence piece. If you have some lean bacon or ham, a little of that
    should be added. I should tell you of all to put some rice on to boil in boiling
    water. Make a sauce of flour and butter in a pan, adding gravy if you happen to
    have it, failing that, use water and vinegar in equal parts to this; season with
    pepper and salt and a small spoonful of anchovy sauce. When the sauce is heating,
    put in the meat and cover the pan, let it all heat for twelve minutes and then
    place rice and sauce in the middle of a dish. By this time the rice may be tender.
    Drain it well and put it as a border to the stew.'
