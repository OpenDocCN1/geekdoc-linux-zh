    # 55


    Braise your shoulder of lamb; that is, put it in a closely covered stewpan, in
    a brown sauce or gravy for the vegetables, to be served with it. It is the lid
    closed that makes the meat take some flavor from the vegetables. To do it in the
    Belgian way take some good white turnips, wash and scrape them, put some in whole,
    large ones cut in half. Take some cabbages, trim off leaves, cut them in half,
    remove the stalk, make a hollow in the center and fill it with forcement of any
    kind; but sausage meat is good. Place the stuffed cabbages around the meat to
    cook gently at the same time.


    > [_Madame Versagen._]


    # FILLET OF BEEF À LA BRABANCONNE


    Take a whole fillet of beef, trim neatly and set it in a braising pan to cook
    very slowly in some good brown sauce to which you have added a pint of stock.
    Put in neatly shaped carrots and turnips and some balls made of mashed potato
    fried. Keep hot in two sauceboats of Brussels sprouts and a puree of onions. These
    are prepared by cooking the vegetables in water, then chopping fine, and rubbing
    them through a sieve with cream, or with a little milk, pepper, and salt. To serve
    the fillet, lay it on a dish with the carrots and turnip, potato cakes round;
    pour over it the rest of the brown sauce from the pan; then add in heaps onion
    puree and the sprouts puree.


    > [_Madame Versagen._]


    # STEWED BEEF


    An interior part of beef may be to taste excellent if it is braised; that is,
    simmered with the cover on slowly, in company with onions (already fried) and
    well washed pieces of carrots and whole turnips. Put on also small cabbage cuts
    in halves, and if you can give it, a glass of good red wine.


    > [_Une refugee._]


    # BEEF AND APRICOTS


    Stew your beef, say three pounds of steak, in some gravy, adding to a pint of
    liquor a le level teaspoonful of white sugar. Throw in a handful of the dried
    apricots, but be sure you wash them first. This dish is generally accompanied
    by leeks, first blanced for a few moments, and then put in the stew. Flavor with
    salt, pepper, and the half of a lemon remove before you serve the stew. For English
    taste the sugar could be omitted.


    > [_Seulette._]


    # FOR AN INVALID


    This must be at least three hours before it will be required. Take two ounces
    of pearl barley, wash it well, and put it in cold water for an hour. Take a pound
    of good steak, shred it in small pieces, and put it in an enam saucepan with a
    quart of cold water and a sprinkle of salt. Strain the water from the barley and
    add this to the meat, and let it simmer for two hours. Then off the meat and barley
    in a mortar, rub it through a sieve; it is a smooth puree put back into the pan
    with its liquor and a gravy of cream. Let it simmer again for a moment and serve
    it in a cup with a lid to it.


    > [_Madame A. F._]


    # INVALIDS'' EGGS'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# PART II


    # 56


    Cut out some rounds of bread a good larger than a poached egg would be. While
    they are frying, make a puree of Brussels sprouts. Boil them till tender, squeeze
    in a cloth. Rub them through a sieve and make into a very thick puree with cream,
    pepper and salt. Poach an egg for each crouton, and slip it on, very quickly,
    put some of the green puree, and serve under a cover.


    # A SWEET FOR THE CHILDREN


    If you have some little breads over, cut each one in four, soak the pieces in
    milk sweetened and flavored with vanilla, for three hours. When they are soaked
    roll them for a moment in grated and dried breadcrumbs, and dip them for a moment
    in boiling fat, just as you do croquettes. Sit white sugar over them and serve
    very hot.


    > [Madame M._]


    # QUINCE CUSTARD


    When you make preserves by this it is a quickly prepared dish. Make a good custard
    with a pint of rich milk, eggs and a little essence of almonds and two ounces
    of powdered sugar. Put your quince preserve at the bottom of a foolproof circular
    dish and fill up with custard. Put it to bake for half hour or hour till set.
    When add some more quince (heated) on the top with chopped almonds and serve.
    This dish may be served with apples, which should be stewed, flavored with the
    rind of half a lemon, and passed through a sieve. Apple puree is put on top the
    same way, and it is decorated with some thin lemon peel cut into stars.


    > [Chef reconnaissant,_]


    # YELLOW PLUMS PANCAKE


    Put half a pound of rice in hot milk till it has absorbed all and is tender. Beat
    lightly the yolks of three eggs, beating in a lump of fresh butter the size of
    a plum; add sugar and the whites of the eggs well beaten. Put the rice into this
    mixture and in a mold. Cook it gently for twenty-five minutes. Meanwhile take
    some very yellow plums, skin and stone and heat in half a bottle of light white
    wine that you have seasoned with a little spice. Turn out the rice, put the plums
    on the top and pour the sauce, strained through muslin. Very good cold.


    # BRABANT PANCAKE


    Butter first of all your pancakes, and you should have proper pancake sauces fit
    to go to. Heat half a pint of sweetened milk and melt a quarter of a pound of
    salt butter with it. When well poured it into a basin and sprinkle in nearly ounces
    of flour. Beat the yolks of three or four small eggs and incorporate them, add
    the whites well beaten. Put a spoonful or two on each saucer and bake in the oven
    for ten minutes and when done place each saucer on a plate with a good of apricot
    jam on each. If you have no pancake sauce, use the apricot on one half of each
    pancake and fold it up.


    > [Jean O._]


    # DELICIOUS SAUCE FOR PUDDINGS


    To a wineglass (as a glass for champagne wine) of some Madeira adds the only of
    two eggs. Put in a very clean enamel saucepan over the fire and stir in powdered
    sugar to your taste. Whisk it over the fire till it froiths, but do not allow
    it to simmer. Use for Genoese cakes and puddings.'
