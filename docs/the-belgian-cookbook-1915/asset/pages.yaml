    For one and one–half pints of milk half a breakfast–cupful of rice. Let it boil
    with sugar and vanilla; strain the whole. Add one–half pint of cream, well beaten,
    five leaves of gelatine (melted). Mix the whole and pour in a mold which has been
    wet. When turned out of the mold, put apricots or other fruit on the top. Pour
