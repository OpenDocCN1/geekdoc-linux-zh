    # FISH AND CUSTARD


    Boil the trimmings of your fish with milk, pepper and salt. Strain it and add
    the yolks of eggs till you get a good custard. Pour the custard into a mold, and
    lay it in your fish, which must already be parboiled. If you have cold fish, flake
