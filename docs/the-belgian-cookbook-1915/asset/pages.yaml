    the strong taste, use shall; lay or four flat slices on the bottom of the dish.
    Put the tomato slices over them, sprinkle with salt and just a dust of sugar.
    For hours let the tomatoes and remove the onions altogether. Make in cup the following
    sauce: Dissolve a salt-spoonful of mustard, some pepper and a sprinkle of chopped
    chervil. Stir in a dessert–spoonful of oil, dropping it slowly, in a very little
    mustard, some pepper and a sprinkle of chopped chervil. Some people liked chives.
    Pour this over the tomato salad and leave it for an hour before serving it.


    # POTATOES AND CHEESE


    Every one likes this nourishing dish, and it is a cheap. Peel the potatoes and
    put in a fireproof dish sprinkle them with grated cheese, pepper, salt, a few
    pats of butter. Then some more potatoes, and so on till the dish is full. Beat
    the yolks of two eggs in a pint of milk, add pepper and salt and pour it over
    the dish. Leave it on the top of the stove for five minutes, then cook it for
    half–an hour in a moderate oven. Time may be required if the dish is small, but
    the potatoes must be thoroughly cooked. The original recipe demands Gruyère cheese,
    but or pale Canadian Cheddar be used.


    # FRIDAY’S FEAST


    Cook a medium cabbage till it, and all the better if you can cook it in soup.
    When needed, mince it and rub it through a sieve. At the same time three pounds
    of chestnuts skin them, keep them whole, and rub the others through the sieve,
    adding a little milk to make a puree. Mix the puree with the cabbage, adding salt,
    pepper, and a lump of butter the size of a chestnut. Press it into a mold and
    cook it in a double sauce for quarter of an hour. Take it and decorate it with
    the chestnuts.


    # RED CABBAGE


    Take a half red cabbage of medium size, chop it finely and put it in a pan; add
    a little water, salt, and pepper, three or four potatoes in fine slices and five
    lumps of sugar. Let it simmer for two hours with the lid on. Take off the cover
    and let it reduce. Before serving, add either a bit of fat pork or some gravy,
    with a dessert–spoon of vinegar. Stir it well before sending it to table.


    > _Mrs. Emelie Jones._


    # ASPARAGUS À L’ANVERS


    Clean a bunch of asparagus and cook it in salt water for fifteen minutes. To do
    this successfully, tie the bunch with string and place it upright in a pan of
    boiling water. Let the heads be above the water so that they will get cooked by
    the steam and will not be broken. In this way, hard–boiled three eggs and chop
    some parsley. Lay the asparagus on a dish and sprinkle parsley'
