    # CHOCOLATE CREAM


    10 leaves of gelatine, well melted and sifted. Pint cream, well beaten. 3–1/2
    sticks of chocolate melted with a little milk.


    Mix all the ingredients together and put them in a mold which has been previously
    wet.


    [_Mle. Breakers_]


    # KIDNEY SOUFFLE


    Mince finely veiled kidney and add one–half pound of minced veal. Make a brown
    sauce of flour and butter, and add the meat to it. Let it cool a, add three well–beaten
    eggs, with a teaspoon ofed Gruyère. Butter a mold, and sprinkle the inside with
    breadcrumbs, and fill it with the mince. Leave it for two quarters of an hour
    in the oven, or for an hour and half in the double saucepan of boiling water.
    Turn out the mold and serve with a tomato or a mushroom sauce.


    [_L. L. B. (d''Anvers_]


    # BAKED SOUFFLE


    Three eggs, two–spoonfuls of powdered sugar and a thimbleful of cornflour or of
    fecolina flour. The original recipe gives also one of vanilla sugar, but this
    may be difficult to get in England it will be easier to add a few drops of vanilla
    essence when mixing. Mix the yolks of the eggs with the sugar for ten minutes,
    then add the whites, tightly beaten, stirring in very lightly, so as to let as
    much as possible remain in the mixture sprinkle in the flour. Take a fireproof
