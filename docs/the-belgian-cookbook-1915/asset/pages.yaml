    Take three pounds of the rump of beef, put it into a deep pan upon one onion,
    one sliced carrot, some thyme, and a bay-leaf, three tablespoons of dripping,
    salt, and pepper. Put it on top of the fire, and when it comes fully to the boil,
    put it to the side, and allow it to simmer nicely for an hour and a half. Dress
    it on a dish and serve the sauce properly.


