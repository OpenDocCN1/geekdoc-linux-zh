  md: '# PART I


    # POTAGE


    Make a good gravy with one and-half pounds of skirt of beef. With half of the
    gravy make a very good purée of peas—if possible the green peas—with the other
    half make a good purée of tomatoes. Combine the two purées, adding pepper and
    salt a dust of cayenne. For each guest add the soup teaspoonful of Madeira wine,
    beat it all well and serve quickly. Or add, instead of Madeira, one dessert—spoonful
    of sherry wine.


    This celebrated soup is honored by the glorious defender of Namur.


    [Gabrielle Janssens,_]


    # TOMATO SOUP


    Boil through medium potatoes, celery, two leeks, two carrots, and a pound of fresh
    tomatoes, with pepper, salt and a leaf of bay. Pass through the sieve. Fry or
    three chopped onions in butter and add the soup to them. Boil up for twenty minutes
    before serving. If you have no fresh tomatoes, the tinned ones can be used, removing
    the skin, at the same time that you had the fried onions.


    [_Mme. van Praet,_]


    # SOUP, CREAM OF ASPARAGUS


    Boil some potatoes and pass them through the sieve, add the asparagus– tops, with
    a pat of butter for each four tins; then the soup with extract of meat and water,
    and at the last moment stir in the raw yolks of two eggs, and a little chopped
    parsley.


    [_Mme. van Praet,_]


    # GREEN PEA SOUP


    Put half pound of dry green peas to soak overnight in water, with a teaspoonful-of-bicarbonate
    of soda in it. In the morning take out the peas and put them on the fire in three–and–a–half
    pints of water. When the peas are nearly cooked, add five big potatoes. When all
    is cooked for the skins to come off easily, rub all through a sieve. In some butter
    four or five onions and five or six leeks until they are brown, or frying use
    fat of beef; add the peas and boil together a half-hour. If possible, add a pig’s
    trotter cut into four, which makes the soup most excellent. When ready to serve,
    remove the four pieces of trotter. Little dice of fried bread should be handed
    with the soup.


    [_V. Verachert,_]


    # VEGETABLE SOUP


    Fry four onions till they are brown. Add them to three pints of water, with four
    carrots, a crust of white bread, five potatoes, celery and a bunch of parsley,
    which you must take out before passing the soup through the sieve. A few tomatoes
    make the soup better; if they are tinned, do not add them till after the soup
    has passed through the tammy; if they are fresh, put them in with the other vegetables.
    Simmer for an hour, add pepper and salt serving.


    [_V. Verachert,_]


    # MUSHROOM CREAM SOUP'
