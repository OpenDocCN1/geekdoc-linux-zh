    Two shallots, tarragon leaves all chopped, are put into a very small saucepan.
    Add a large glass of claret, a dessert–spoonful of butter, and let it reduce together.
    Add salt, pepper, three dessert–spoonfuls of demi-glaze, let it come to the boil,
    and stir in two dessert-spoonfuls of butter. [Georges Gaus.]


    # POOR MAN''S SAUCE


    Even a piece of poor quality is much liked if you have the following sauce poured
    over it. Put a little milk, say in a saucepan, with salt and pepper; let it cook.
    Chop a handful of shallots and a quarter as much of parsley that is well. Throw
    them into the milk; let it boil, and when the shallots are tender the sauce is
    ready. If you have no milk, use water; but in case let it be strongly flavored
    with vinegar.


    # THE GOOD WIFE''S SAUCE


    This sauce is indispensable for any one who wishes to use slices of cod mutton.
    Turn your slices, away skin and pour them over the following cold sauce. Hard-boiled
    three eggs, let them get cold. Crumble the yolks in a cup, adding slowly a tablespoon
    of oil, salt, pepper, a mustard, a teaspoon of vinegar; then chop the whites of
    egg, with a scrap of onion, and if you have some, capers. Mix all together and
    pour it over the cold meat.


    # CREAM SAUCE


    Roll a lump of butter in flour, put it in a pan on the fire, and as it melts add
    pepper and salt. Stir it, and as it thickens a little milk; let it simmer and
    keep on stirring. You will never get a good sauce unless you season it well and
    let it simmer for a quarter of an hour. Strain it, heat it again, and serve for
    fish, potatoes, chicken.


    # SAUCE MAÎTRE D''HÔTEL


    Every likes this sauce for either meat or fish. In a double saucepan melt a lump
    of butter, flavor it with salt, pepper, minced parsley that you had rubbed on
    a raw slice of onion, and some lemon–juice. Use vinegar instead of the lemon if
    you wish, but do not forget that it does not require so much vinegar. Mix it with
    a fork and serve it warm; do not let it bubble.


    # SAUCE AU DIABLE


    (For cold meats)


    Take a shallot or two, according to quantity of sauce needed, slice very finely,
    shred a little parsley, put both into the sauce–boat; with salt, pepper, and mustard
    to taste; add oil and vinegar in proportion of one dessert–spoonful of oil to
    two table–spoonful of oil, till sufficient quantity.


    # FRICASSEE OF PIGEONS


    Put your pieces of pigeon into a stew–pan in butter, and let it cook with the
    pigeons. Add one carrot, two onions, two sprigs of parsley, a leaf of sage, five
    juniper berries, and a very little nutmeg. Stir it all for five minutes, and then,
    add a half–cupful of water and Liebig, two rusks or dry biscuits in pieces, the
    juice of a lemon. Put it all on the side of the fire, cover the saucepan and let
    it cook gently for an hour and a half.


