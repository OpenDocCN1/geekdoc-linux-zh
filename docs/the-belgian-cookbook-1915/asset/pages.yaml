    # CHOU–CROUTE


    Take as many September cabbages as you wish, trim them, cut in halves, remove
    the stalks, wash them very thoroughly and shred them finely. Procure an earthenware
    crock and put in a layer of cabbage, sprinkle with coarse salt, white pepper,
    juniper berries. Fill up the crock in this way, put on the lid, and keep it down
    closely with weights. It will be ready in about six weeks'', when the fermentation
    has taken place. It is good with pork or bacon.


    # SPINACH FRITTERS


    Take any boiled spinach—though people generally eat all that there is—and mix
    it thickly with the yolk of egg and a little rice flour; you may add a little
    powdered sugar. Have ready boiling fat, and drop spoonfuls of the spinach into
    it. If the fat is not hot the fritters will pull off. Drain them quickly and serve
    very hot.


    # HARLEQUIN CABBAGES


    Shred some red cabbage, to half a pound of two medium sized apples, minced finely
    without core or a bit of fat bacon, season with pepper, salt, vinegar, which should
    be tarragon vinegar and put it to simmer in some gravy or milk and water. It should
    cook for an hour over a gentle fire. Cook separately some green cabbage, boiled
    till tender in salted water, chopped then put back on a gentle fire with salt,
    pepper, a dust of nutmeg, and for butter. Let it heat and mix, and then serve
    the two colors by the same side; the red cabbage has a sour and the green has
    a nutty flavor which is very agreeable.


    # LITTLE TOWERS OF SALAD


    Put a couple of eggs to boil hard, while you make a thick mayonnaise. Cut some
    beetroot, some cucumber, some cold potato, some tomato into slices. Peel the eggs,
    slice them, and build up little piles of the different things, till about two
    inches high. Between each slice you will sprinkle grated breadcrumbs, pepper,
    salt, a tiny of chopped raw shallot, parsley, all mixed in a cup. With the finished
    ends of white egg on the top, put lettuce and pour the dressing over it.


    # PUFFS FOR FRIDAY


    Make a batter of an egg, a dust of rice flour, pepper, salt and as cream as you
    can give. Roll out this butter so thinly that you can see through it. Cut it into
    rounds and put on any cooked vegetables that you have, but they must be heavily
    seasoned. Cold potatoes will do if they are done with mustard, vinegar, or a strong
    boiled sauce. Fold over the paste, press it together at the edges, and fry in
    hot.


    # HADDOCK A LA CARDINAL


    Take some fillets of hock, of cod or had, and poach gently in milk and water.
    Meanwhile, prepare a good white sauce, and in another a thick tomato sauce, highly
    seasoned, colored with codine if needed, and as as a good cream. Lay the fillets
    on a plate, put each one of the white sauce round it, and along the top put the
    tomato sauce which must not run down. A sprig of chervil is to be placed at end
    of the fillet.


    [_Selette._]


    # SKATE STEW'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# PART II


    Put the fins, skin, trimmings of skate into water enough to cook them, with pepper
    and salt and simmer for half an hour. Strain it through a fine sieve. Make a brown
    sauce of butter and flour, pepper, salt, adding a little milk, by a teacupful
    for a pound of skate, then squeeze in the juice of a lemon, and if you have, a
    glass of white wine. Take the skate, cut into pieces, simmer it in salted water;
    when, strain away the water, dish the fish, pouring it over the above sauce. Decorate
    with strips of lemon peel in a lattice-work center.


    [Une epiciere.]


    # TO DRESS COARSE FISH


    Any fish good if dressed in this way. Make a brown sauce, well flouring with salt,
    pepper, and dried herbs. Pence and fry a shallot and add it, then a large glass
    of red wine, a few drops of lemon juice. Cook some fish, sieve it, and stir it
    into the sauce. Take your fish and simmer it in milk and water until cooked, then
    heat it quickly in the sauce to serve.


    [_F. R. _]


    # FLEMISH SALAD


    This is fillets of herring, laid in a bowl with slices of apple, beetroot, cold
    potatoes, and cold cooked sprouts, covered with the ordinary salad dressing. If
    the fish is salted, let it soak in all milk to take away the greater part of the
    salt. This is a winter dish, the same sort of which is prepared in summer, substituting
    cold peas, cauliflower, artichokes, beans, with the fish.


    [_Amie reconnaissante_]


    # FLEMISH SAUCE


    This popular sauce is composed of melted butter thickened with yolk of egg and
    flavored with mustard; it is used greatly for fish.


    # BEEF SQUARES


    If you have a small piece of very good beef, as rump or fillet of beef, it is
    more economical to cut it into squares, and grill it at a clear fire. Have some
    squares of toast, buttered and hot, lay these on a hot dish with a bit of steak
    on the top, and on top of that a slice of tomato mashed and salted and a pile
    of horse-radish. This makes a pretty dish and can be varied by using capers or
    chopped gherkins instead of horse-radish. It is a great saving to cut meat, bread,
    etc., in squares instead of rounds.


    [_Une amie au convent._]


    # IMITATION CUTLETS


    A dish that I love for those who like curry flavoring is the following. Take any
    cold cooked vegetables, and cutting them in small pieces, roll them in a thick
    sauce which you have strongly flavored with curry. Put it aside to get firm. If
    you are in a hurry you can bind with the yolk of an egg in the flour and make
    a thicker batter in way. Form into cutlets and fry as you would a real cutlet.
    The same thing can be done with macaroni or spaghetti that is already cooked,
    cold fish or anything that is insipid to the taste.


    [_Une amie au convent._]'
