    A good white stock foundation, for which you have used milk and a bone of veal,
    sprinkle in some ground rice till it thickens, stirring it well for twenty minutes.
    Wash and chop your mushrooms, and fry them in butter. Add the yolk of the egg
    and bind it. It is a delicious soup.


    > _Mme. van Marcke de Lunessen,_


    # THE SOLDIER''S VEGETABLE SOUP


    (Eight to ten persons)


    Peel three pounds of vegetables. Put them in a large pot with all the vegetables
    that you can find, according to the season. In the winter you will take four celeries,
    four leeks, turnips, a cabbage, two onions, pepper and salt, two-penny-worth of
    bones, and about five and one-half quarts of water. Let all boil for three hours,
    taking care to add water as to keep the quantity at five quarts. Rub all the vegetables
    by a tammy, crushing them, and then let them boil again for at least another hour.
    The time allotted for the first and second cooking is of the greatest importance.


    # LEEK SOUP


    Cut two onions and fry them until they are brown; you need not use butter, clarified
    fat will do very well. Clean your leeks, washing them well; cut them in pieces
    and fry them also; add any other vegetables that you have, two medium-sized potatoes,
    pepper, salt, and a little water. Let all simmer for three hours, and pass it
    through a fine sieve. There be more leeks than other vegetables, so that their
    flavor predominates.


    > _Mme. Jules Segers,_


    # CELERIUS LARD


    Take one pound of celery, cut off the greens, cut the stems into pieces two-thirds
    of an inch long; put into boiling salted water, and cook till tender. Take half
    half potato, slice and add to the celery, so that both will be cooked at the same
    moment. Strain and place on a flat-proof dish. Prepare some slices of bacon, toast
    them till crisp in the oven; pour the melted bacon-fat over the celery and potato,
    adding a dash of vinegar, and place the rashers on plate. Serve hot.


    Leeks may be prepared in the same way.


    # CABBAGE WITH SAUSAGES


    Cut a large cabbage in two, slice and wash, put it into boiling water with salt,
    and when partly cooked, add some potatoes into small pieces. Cook all together
    for about an hour; then drain. Put some fat in a saucepan, slice an onion, brown
    it in the fat, add the cabbage and potato, and stew all together for ten minutes;
    then dish. Bake some sausages in the water and dish them out the cabbage; serve
    hot.


    > _Another way (easier)._


    Stew the cabbage and sausages all together until they dip neatly.


    LEEKS A LIEGOISE'
