    # 费迪南德风味菊苣


    将菊苣水煮并切成中等大小的块，根据你的口味切碎几根大葱苔，在一些奶油中加热这两种蔬菜，加入盐和胡胡椒。盛在盘中，用切碎的煮熟蛋装饰。


    # 苹果炖香肠


    这道菜来自比利时与法国的边界；它的味道比你想象的要好。取一磅牛肉香肠，最好是小切波塔土豆香肠。（如果英国人也能制作除牛肉和猪肉以外的其他香肠，那该多令人高兴！）用黄油轻煎你的香肠，将它们看作在炼狱中停留几刻钟的小生物，直到它们被送往天堂，与苹果在一起。在煎好后保持香肠温度，取一磅棕色熟透的苹果，去皮并去核。将它们切成一英寸厚的整齐圆片，然后放入香肠的汁中（你将其放在别处保温），并加入黄油使其润滑。让它们小火慢炖以保持形状。将苹果环放在盘中心，将香肠环绕四周。这道菜使用了大量的黄油，但煎炸时不能使用其他任何油脂。


    # 酿馅菊苣


    将任何冷白肉（如小牛肉肉、猪肉或鸡肉）做成肉末，加入一些肉末中；淋上浓稠白酱。与此同时，菊苣应该正在煮；用线将每根菊苣系起来以保持形状紧实，煮十分钟。煮好后，充分沥干，小心纵向切开，塞入一勺肉末。合上，保持叶片整齐，如有必要，再次用线绕好。将它们放入耐火盘中，每块上面放一块黄油，加热热透。连同原汁或淋上更多的白酱食用，注意去掉线。


    > [Lippens 女士]


    # 豆角填番茄


    将番茄切半，在每个里面滴几滴醋。煮好你的豆子，无论是四季豆、长豆还是花叶豆，在它们变软后将它们拌入良好的奶油酱中。让其变冷。倒出番茄里的醋并填入混合物，顶部淋上蛋黄酱和欧芹。


    > [van Praet 女士]


    # 卷菜和土豆


    在盐水中煮卷菜至变软。将其切碎。用黄油煎黄洋葱，加入卷菜、盐、胡胡椒和少量水。将一些土豆切厚片并煎炸，将蔬菜放在盘中间，煎好的土豆环绕四周即可。


    > [_安特卫普 M. Schmidt 小姐]


    # 布拉克尼尔风味菠菜


    # 第一部分


    煮两磅洗净的菠菜；沥干并通过筛网；如果没有，就用黄油、胡胡椒和盐将其切碎。不要加牛奶，让它保持有些硬度。制作浓稠的奶油酱，足够加入四分之一的擦碎格鲁耶尔芝士，如果你愿意，拌入一个生蛋黄。在圆盘中铺上半磅火腿碎，淋上浓稠白酱，再环绕上热的菠菜。这道菜很漂亮，而且并不昂贵。


    > [_Braconnière 夫人—]


    # 一道芸豆


    将芸豆放入冷水中浸泡六小时。在水里加入一个胡萝卜、一个洋葱、盐、两瓣大蒜和一大撮干香料水煮。滤掉豆子的汁。切碎一个红洋葱并用黄油煎；加入你的豆子、胡胡椒、盐和番茄泥。充分搅拌，并在顶部撒上切碎的欧芹。


    > [_Goffaux 夫人—]


    # 比利时式土豆


    取一些长约五英寸的条纹培肉片，在锅中加热。当培肉半熟时，将其取出锅，用剩余的脂肪煎极细的——洋葱片，直到它们变黄。当洋葱煎黄后，将它们放入大锅中（足以装下你想煮的土豆），加入胡胡椒、盐和一咖啡匙干混合的甜香料（这些在英国取代了比利时使用的月桂和月桂叶）。加入足够的水煮土豆和你的培肉片。煮至变软。


    > [_E. Wainard—]


    # 番茄配虾仁


    在盘中铺上切片番茄（去籽），在上面撒上剥好的虾仁。然后全部淋上大量的蛋黄酱。酱的做法：取一个蛋黄，与两匙沙拉油混合，必须轻柔且少量多次地搅拌。在茶匙醋中融化一大撮盐（如果有龙舌草醋就用龙舌草醋）；加入胡胡椒和少量芥末。制作这种酱时，务必始终朝着同一个方向搅拌。制作好这种酱需要半小时。


    > [_Paquette—]


    # 弗兰芒菊苣


    选择短小而整洁的菊苣；切掉外层叶并削去底部；用大量水洗净，在沸水中煮三分钟。从水中取出，放入抹了足黄油的平底锅中，撒上盐和一撮糖。加入半个柠檬的汁和少于一品脱的水。将锅放在火上加热两三分钟开始烹饪，然后盖上锅盖完成烹饪。将苹果环放在盘中心，将香肠环绕四周。这道菜使用了大量的黄油，但煎炸时不能使用其他任何油脂。必要时放入菊苣。


    > [_Kirert 先生—]


