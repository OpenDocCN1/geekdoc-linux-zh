    # 第一部分


    # 38


    这种紫色的水果像西红柿一样，总是被当作蔬菜烹饪。它就像东方的茄子。制作茄子的调味几乎不需要特殊的食食谱，因为你一眼就能看出它的各种可能性。你可以用白酱汁包裹白色肉馅：将水果切半，去掉部分内部，填入肉馅和酱汁，盖回顶部，烤二十分；或者简单地切半在酱汁中煮，加入胡椒和盐即可；又或者也可以放入水中煮熟，在上菜时淋上白酱汁，像西葫芦一样。如果它们在英国很便宜，那么下面的道菜就会很贵，而且看起来像：


    ## 舒芙蕾茄子


    洗净水果，切成长段，去瓤。在每个半部分填入打散的鸡蛋、碎奶酪、一些细面包屑和一小撮芥末的混合物。将半部分放入十五分钟，或直到舒芙蕾升起。煮好后放入椭圆形盘中，边缘围上一圈压出的米饭。


    ## 土豆饼炸丸


    煮熟土豆，通过筛网压碎，加入胡椒和盐，以及两到三个轻轻打散的鸡蛋（混合蛋黄和蛋蛋白），并根据用量加入少量黄油和牛奶。充分搅拌并放凉。揉成丸子状，每个丸子裹上鸡蛋，再裹上细碎的面包屑，放入沸的脂肪或油中煎炸。


    > [Emelie Jones 女士]


    ## 栗子泥


    在每颗栗子上切开一个小口，将其煮熟，然后放入另一个有冷水的锅中重新点火。取出的同时逐个剥皮，并通过筛网压碎（先捣碎会更容易一些），加入盐、一大块黄油和少量牛奶制成美味的泥。这种泥非常适合包裹烤鸡或烤火鸡腿，或者用于鸭肉或兔肉的肉酱。


    ## 前菜


    英国晚餐桌上富有吸引力的“咸味菜”（savory）似乎在用餐开始时冷食蛋和鱼类中找到了对应物，因此我们所说的前菜。


    ## 土豆丁


    煮熟土豆，让它们保持结实、肥皂般的口感，而不是淀粉质的。煮熟后，切成丁状，拌入以下酱汁中：


    取等量的沙拉油和奶油，取其量分之一四的抽根醋，一小撮盐和一些切碎的辣椒。充分混合，淋在土豆丁上。你可以通过只用奶油来改变它，这种情况下请省略醋。用胡椒、盐、芹菜籽调味，并用腌渍旱菜籽代替酸豆，将菜子籽细碎，留在酱汁中浸泡一小时后再使用。


    ## 鲱鱼


    将这些鱼片铺在土豆泥上呈网格状，看起来非常漂亮。确保使用用盐腌制的优质鲱鱼，洗净并浸泡以去除大部分咸味；或者，如果你能做一些吐司，冷的时候涂上黄油，切成条状，在中间放上一片鲱鱼。在吐司两侧填上切碎的熟蛋黄。


    ## 鲱鱼三明治


    切一些面包和黄油，切得非常薄，并切成手指状。切碎一些水芹菜，铺在“手指”形面包上，洒上少许紫抽根醋和水（等量），然后铺在一片鲱鱼上，盖上更多的水芹菜和一片“手指”形的面包黄油。将它们堆放在盘子下压平，然后在修剪边缘。


    ## 鲱鱼圆片


    做一些吐司，切成圆形，冷时涂上黄油。将一片圆形的鲱鱼绕住一颗煮过的橄榄，放在吐司上。用蛋围出一小圈边缘。


    ## 鲱鱼饼干


    像制作饼干一样制作，注意不要放入叶子。（等一下，原文说将白色花瓣放入玻璃瓶中，注意不要放入叶子。）


    ## 鲱鱼饼


    制作一些面团并将其擀开。用杯子装满。（等一下，原文说是白色和一、一、一的盐。）


    ## 仿制鲱鱼


    取一个大瓶，倒入十二盎司最优质的葡萄酒，加入一滴琥珀脑、两便士价值的麝香和三打司薰衣草油。塞紧瓶子，放在黑暗处，每天摇晃一个月。这真的是薰衣草酒，因为没有使用任何水。


    ## 法式黄瓜


    取一根黄瓜并切成段。去皮并切花瓣。


    ## 鲱鱼美乃酱


    取一些鲱鱼，切开。剥去五个大柠檬（或小柠檬）的皮，然后在一个新鲜捣碎的糖块上撒两盎司切碎捣碎的苦仁；将这些与两加仑最优质的兰地酒或荷兰酒混合，加入六汤匙沸牛奶。


