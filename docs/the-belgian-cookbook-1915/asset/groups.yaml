    minute, egg powder will serve very well.


    [_V. Verachtert_]


    # VEAL CAKE, EXCELLENT FOR SUPPER


    Take some chopped veal with it an equal quantity of chopped beef, and one–quarter
    the quantity of breadcrumbs from a fresh loaf. Bind all with a raw egg, adding
    salt and pepper, and, if wished, some blanched and chopped almonds. (Put a large
    piece of butter both above and below.) Shape the meat into the form of a loaf
    and put it in a dish, with a large slice of butter above and below. Cook it for
    about half-an-hour.


    [_Mme. Gabrielle Janssens_]


    # BREST OF VEAL

    (A good and inexpensive dish)


    Cook the breast of veal in stock or in a little meat extract and water, with sliced
    carrots and onions, thyme, pepper, salt, three bay-leaves and three cloves. Let
    it for one hour in this, and then take it out. Take out the vegetables, and drain
    the liquor. Make a beamel sauce and add it to the liquor, giving it a sharp taste
    with the juice of a lemon. Put back the breast of veal in this sauce and when
    hot again serve them together.


    [_Mdlle. Spinette_]


    # OX TONGUE


    Cook the ox tongue in stock or in meat extract and water. Make the hunters'' sauce,
    as for a hare, but sprinkle into it some chopped sultanas. Take the tongue out
    of the stock and skin it, cut it in neat pieces if you wish, and let it heat in
    your sauce.


    [_Mdlle. Spinette_]


    # VEAL À LA MILANAISE


    Egg and breadcrumb thick slices of veal; fry and garnish with boiled macaroni
    in small pieces, with ham, mushrooms, truffles, all in Julien strips, pepper,
    salt, and a little tomato sauce. Mix all these well together, serve very hot.


    # STUFFED VEAL, LIVER OR LIV À PANIER D''OR


    The Panier d''Or, is a hotel in Bruges, much requested before the war by many
    the English.


    Take the yolk of a hard-boiled egg, a bit of bread the same size, and crumble
    them together; rub in some chopped parsley and onion and moisten it with gravy
    or milk; season highly with salt, cayenne, and a little vinegar and mustard. Take
    your liver, if possible in one large flat slice. Make deep cuts in it, parallel
    to each other, and lying closely together. Press your stuffing into these cuts.
    Put a bit of the butter of a walnut into a pan, fireproof dish. Take your liver
    and tie it round with a slice of bacon or pork fat. Lay it in the dish and let
    it cook for an hour in a moderate oven. When done, remove the slice of bacon,
    if there is any left, and serve the liver in its own juice.


    # PART I

    VEAL À LA CRÈME


    Take a piece of veal suitable for roasting, and put it in vinegar for twenty-four-hours.


    Roast with butter, pepper and salt, with a few slices of onion. Baste it well,
    and when it is finished crush the onions in the gravy and add some cream. Mix
    together with flour so to thicken.


    > [_Mdlle. Speakers._]


    _This is the demi-glaze Sauce which is used for all brown Sauces,

    Take one pound of flour, dry it on an onion tray till it is the color of cocoa;
    pass it through a sieve into a saucepan, melt it with stock, mixing very carefully.
    Boil it for two or three days during forty-eight hours, adding carrots, onions,
    thyme, bay, all cut up, which you have colored in the frying-pan, also some salt
    and pepporns. When it is all cooked, pass it through a cloth or sieve. When it
    is reduced the first time, you should add some stock, but by the time it is finished
    it should be fairly thick. It will keep for a fortnight._


    > [_G. Goffaux._] FOR FISH


    Take a tablespoon of flour and three of water; make it and add the yolks of three
    into your first mixture, add half-one pound of butter and beat it gently add salt,
    the juice of half a lemon and a pinch of grated nutmeg. Keep the sauce hot in
    a _bain-marie_ or in a double saucepan. If you have neither, keep it in a large
    cup placed in a saucepan of hot water.


    > [_Mrs. Emelie Jones._]


    # BEARNAISE SAUCE

    (Very good with stewed meat)


    Put onions to cook in tarragon vinegar and when they are half done, add more water
    and throw in a little thyme and a leaf or two of bay; let it cook for one hour
    and pass it through a sieve. Melt some butter in a pan and thicken it with flour;
    pour your vinegar to it and more water if you think it necessary; stir in salt
    and pepper and the yolks of two eggs or more, according to the quantity that you
    wish to make. Let it get thick, and just as you like to take it off the fire a
    sprinkle of chopped parsley and a pat of butter. This is a useful sauce and it
    well repays the trouble.


    > [_Mme. Spinette._]


    # MUSLIN SAUCE


    Melt a piece of butter the size of an egg, sprinkle and stir in some flour, adding
    water if it is too thick. Keep stirring over the fire for five minutes, and still
    stirring, add pepper and salt and the yolks of two eggs. You may add the yolks
    of three or four eggs if you wish for a rich sauce. The last item is the juice
    of a lemon to your taste. This is a very popular addition to meat.


    > [_Mme. Spinette._]


    # SAUCE BORDELAI


    Two shallots, tarragon leaves all chopped, are put into a very small saucepan.
    Add a large glass of claret, a dessert–spoonful of butter, and let it reduce.
    Add salt, pepper, three dessert–spoons of demi-glaze, let it come to the boil,
    and stir in two dessert-spoons of butter.


    > [_Georges Gaus._]


    # POOR MAN''S SAUCE

    Even poor quality is much liked if you have the following sauce poured over it.
    Put a little milk, say in a saucepan, with salt and pepper; let it cook until
    the shallots are tender the sauce is ready. If you have no milk, use water; but
    in case let be strongly flavored with vinegar.


    # THE GOOD WIFE''S SAUCE

    This sauce is indispensable for any who wishes to use mutton. Turn your slices,
    away skin and pour them over the following sauce. Hard-boiled eggs, let them get
    cold. Crumble the yolks in a cup, adding slowly a tablespoon of oil, salt, pepper,
    a mustard, a teaspoon of vinegar; then chop the whites of egg, with a scrap of
    onion, and if you have some, capers. Mix all together and pour it over the meat.


    # CREAM SAUCE

    Roll a lump of butter in flour, put it in a pan on the fire, and as it melts add
    pepper and salt. Stir it, and as it thickens a little milk; let it simmer and
    keep on stirring. You will never get a good sauce unless you season it well and
    let it simmer for a quarter of an hour. Strain it, heat it again, and serve for
    fish potatoes.


    # SAUCE AU DIABLE

    (For cold meats)

    Take a shallot or two, according to quantity of sauce needed, slice very finely,
    shred a little parsley, put both into the sauce-boat; with salt, pepper, and mustard
    to taste; add oil and vinegar in proportion of one dessert–spoonful to two table–spoonful,
    till sufficient.


    # FRICASSEE OF PIGEONS

    Put your pieces of pigeon into a stew–pan in butter, and let it cook. Add one
    carrot, two onions, twoigs of parsley, a leaf of sage, five juniper berries, and
    a very little nutmeg. Stir it all for five minutes, and then, add a half–cupful
    of water and two rusks or dry biscuits in pieces, the juice of a lemon. Put it
    all on the side of the fire, cover the saucepan and let it cook gently for an
    hour and a half.


    > [_Mme. Vandervalle_]


