    **M·布莱恩·拉克奇夫人**


    第一部分


    **菜花汤**


    在煮好菜花后，倒掉汤是极大的浪费；它味道鲜美，是好汤的基础。洗净你的菜花，小心去除所有的虫子。将其头部朝下放入盐水中慢炖；等变软后取出。现在来做汤。将所有的外叶和碎末充分煮熟，然后通过筛子。炒一些洋葱，加入菜花的汤汁和筛过的碎片，加入一点白胡椒和一片棕色面包。慢火煮半小时，上桌前取出面包，撒上两茶匙格鲁耶尔奶酪。


    鱼汤


    当你有鱼时，将其切片，直到骨头和筋膜变软。使用一升牛奶，加入一束混合香草、一些碎洋葱、胡椒和盐。放入你的鱼煮一小时。如果你有任何芹菜，或者三根白芦笋。过滤汤。品尝味道，根据需要增加盐或牛奶。送回锅中。取一个蛋黄，在将汤离火前快速搅拌。这种汤绝不能煮沸。应该用白鱼制作，排除鲱鱼和鲭鱼。


    饥饿汤


    如果你有一块猪骨，让它在水中浸一小时。将锅放入锅，去掉脂肪，取出骨头。将锅放回火上，加入两磅抱子蓝。不要在这汤里加入洋葱，以及卷心菜的心。用胡椒香料调味。通过筛子，使其变得足够稠，以形成薄泥。


    即时汤，或十分钟汤


    在一升沸水中加入两汤匙玉米糊或淀粉：煮沸八分钟，撒入许盐和胡椒。与此同时，取你的时间，快速加入两个非常


