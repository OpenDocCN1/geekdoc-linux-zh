    ## FRUIT ELLIES


    Jellies that are very well flavored can be made with fresh fruit, raspberries,
    strawberries, apricots, or even rhubarb, using the proportions of one ounce of
    gelatin (in cold water) to every fruit of puree. In hot weather use a little less
    gelatin. As the fruit gives a bad color, you must use cochineal for the hot jellies
    and a little green coloring for gooseberry jellies. The gelatin is of course melted
    in the fruit puree and all turned into a mold. You may make your own green coloring
    in this way. Pick a pound of spinach, throwing away the stalks and midrib. Put
    it in a pan with a little salt and cover the down. Let it boil for twelve minutes.
    Then put a fine sieve over a basin and pour the spinach water through it. Strain
    the spinach once or twice through muslin; it will be a good color and keep some
    time. Orange and lemon jellies are much more wholesome when made at home than
    those from bought powders. To the juice of every six oranges you add the juice
    of lemon, and you procure as much from the fruit, just before you squeeze it,
    let it soak in hot water for three or four minutes.


