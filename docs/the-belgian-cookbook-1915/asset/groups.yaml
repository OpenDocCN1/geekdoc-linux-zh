    # 第一部分


    # 41


    取一块新鲜的白鱼片，将鱼肉通过丝筛滤碎。


    做一道小菜，取四盎司鱼肉，与四汤匙浓稠的奶油轻微混合，加入胡椒和盐。使用椭圆形模具，在涂了黄油的纸下小火蒸20分钟。


    煮好一些小龙虾，剥去尾部，切段，并去除内部的黑线。将三块松露切成厚片，将松露和小龙虾放入一些白汁中加热，白汁中加入了一个生蛋蛋黄、胡椒和一小甜匙塔香草醋。这种汁千万不能煮沸。当把奶油盛入热银盘中时，将炖菜淋在中心，盖上热盖子。


    这道菜（见第 86–87 页）是由一位苏格兰女士为了纪念比利时国王创作的。并不是每位厨师都能处理好这种奶油，但比例是精确的，时间也是如此。


    [亚历克斯·斯图尔特夫人，]


    # 鱼肉鱼奶


    将鱼的碎料与牛奶、胡椒和盐一起煮沸。滤后加入蛋黄，直到得到浓稠的鱼奶羹。将奶羹倒入模具中，放入已焯过水的鱼肉中。如果是冷鱼，将其撕碎成平片并与奶羹混合。将模具放入双层水锅中。蒸45
    分钟。脱模后，用柠檬片装饰，如果有的话，撒上莳萝碎。


    # 鳕鱼配土豆


    鳕鱼虽然不是最娇嫩的鱼，但如果用以下酱汁炖煮就会变得非常美味：在牛奶奶油中加入一小甜匙任何优质的英式酱汁；用一块裹过面粉的黄油增稠，搅拌至光滑。当酱汁开始离锅时，放入鳕鱼块，移至火旁保持高热（不要煮沸）25分钟。同时制作土豆，将其作为土豆泥铺在圆盘中，鱼放在中心，撒上碎欧芹。汤汁应浓缩即可。


    # 极佳的鯪鱼


    取鯪鱼（或任何易翻滚的鱼），切成片并晾干，在每片鱼上撒上胡椒、盐和一撮混合香料，将每片鱼紧紧卷起，紧密地放入盘中以防松散。取等量的醋和啤酒；若不喜欢用黄油，则用醋加一些黑胡椒，并撒上大量的干混合香草和盐。淋在鱼上，在顶部放上一块黄油，在中火烤箱中（中型派盘）烤1
    小时15 分钟。


    # ����鱼保存法


