    [_V. Verachtert_]


    # 极佳小肉饼，非常适合晚餐


    取一些切碎的小牛肉肉，与它等等量的切碎牛肉，以及从一个新鲜面包中取出的四分之一量的面包包屑。用一个生蛋将所有粘匀，加入盐和胡椒，如果需要，还可以加入一些烫过并切碎的杏仁。（在肉块上方和下方各放一块大黄油。）将肉做成肉排状放入盘中，上方和下方各放一大片黄油。烹煮约半小时。


    [_Mme. Gabrielle Janssens_]


    # 小牛胸肉

    （一道美味且廉价的菜肴）


    用高汤或少量的肉精加水煮小牛胸肉，加入切片的胡萝卜、洋葱、百香、胡椒、盐、三片月叶和三瓣大蒜。在其中浸泡一小时，然后取出。取出蔬菜，滤干汤汁。制成贝梅酱（beamel
    sauce）并加入汤中，用柠檬汁使其味道酸爽。将小牛胸肉放回酱中，加热后一同上菜。


    [_Mdlle. Spinette_]


    # 牛舌


    用高汤或肉精加水煮牛舌。制作猎人酱（类似于制作野兔酱），但在其中撒入一些切碎的葡萄干。从汤中取出牛舌去皮，如果需要可以切成整齐，让它在酱中加热。


    [_Mdlle. Spinette_]


    # 米兰式小牛肉


    裹上蛋液和包屑的厚切小牛肉；煎炸后，装饰上煮的小碎意大利面、火腿、蘑菇、松露（全部切成朱利安条状）、胡椒、盐和少许番茄酱。将所有食材充分混合，趁热上菜。


    # 填充肝脏或金篮酒店肝脏


    金篮（Panier d''Or）是布鲁日的一家酒店，在战前深受许多英国人的青睐。


    取一个水煮蛋的蛋黄、等大小的一块面包，将它们揉碎；拌入一些切碎的欧芹和洋葱，用肉汁或牛奶润湿；加入盐、辣椒粉和少许醋和芥末进行重味调味。取你的肝脏，最好是一块大平肉的。在上面切下平行的深口，彼此紧密。将填充物压入这些切口中。在锅或烤盘中放入一点核桃油。取你的肝脏，用一片培根或猪油包起来。放入盘中，用中火烤箱烤一小时。完成后，如果还有培根则取出，用肝脏自身的肉汁上菜。


    # 第一部分

    奶油小牛肉


    取一块适合煎烤的小牛肉，放入醋中浸泡二十四小时。


    用黄油、胡椒盐和几片洋葱进行煎烤。涂抹好肉汁，完成后将洋葱在肉汁中压碎并加入一些奶油。与面粉混合以加稠。


    > [_Mdlle. Speakers._]


    _这是用于所有褐色酱的浓汁（demi-glaze Sauce）。

    取一磅面粉，在洋葱盘上烘干直到呈可可色；筛入酱锅中，加入高汤融化，并小心搅拌。在48小时内沸煮二三天，加入切碎的并在锅中煎上色的胡萝卜、洋葱、百香、月叶，以及一些盐和胡椒粒。全部煮熟后，用布或筛子过滤。第一次浓缩时应加入一些高汤，但在完成时它应该相当浓稠。它可以保存两周。


    > [_G. Goffaux._] 用于鱼类


    取一汤匙面粉和三勺水；调匀后将三个蛋黄加入你的第一个混合物中，加入半磅黄油并轻轻搅拌，加入盐、半个柠檬的汁和一小撮磨好的肉豆粉。在水浴（bain-marie）或双层锅中保持酱汁温度。如果两者都没有，就将其放在置于热水的锅中的大杯中保温。


    > [_Mrs. Emelie Jones._]


    # 贝尔纳酱

    （配炖肉极佳）


    将洋葱放入龙蒿醋中煮，当熟了一半时，加入更多水并丢入少许百香和一片或两片月叶；煮一小时后滤出。在锅中融化一些黄油并用面粉加稠；倒入你的醋，如果认为必要可以加更多水；拌入盐、胡椒和两个或更多的蛋黄，取决于你想制作的量。让它变稠，在你喜欢的离火时，撒上一把切碎的欧芹和一块黄油。这是一道实用的酱汁，省去很多麻烦。


    > [_Mme. Spinette._]


    # 慕斯酱


    取一汤匙面粉和三勺水；调匀后加入三个蛋黄，加入半磅黄油轻轻搅拌，加入盐、半个柠檬的汁和一小撮肉豆粉。如果太稠加水。在火上搅拌五分钟，加入胡椒、盐和两个蛋黄。如果你想要浓郁的酱，可以加入三四个蛋黄。最后加入柠檬汁。这是一道非常受欢迎的配酱。


    > [_Mme. Spinette._]


    # 波尔多莱酱


    两个小洋葱，全部切碎的龙蒿叶，放入极小的酱锅中。加入一大杯红酒、一汤匙黄油，让其浓缩。加入盐、胡椒、三汤匙浓汁（demi-glaze），煮沸后加入两汤匙黄油。


    > [_Georges. Gaus._]


    # 穷人酱


    即使是品质不佳的肉配上这道酱也很受欢迎。将如下酱汁淋在上面。在锅中加入少量牛奶、盐和胡椒；煮到洋葱变软，酱汁就好了。如果没有牛奶则用水；如果需要，用醋强烈调味。


    # 贤妇酱


    这道酱对于任何想用羊肉的人来说都是不可少的。将你的肉片去皮，放入如下酱汁中。加入一个水煮蛋，缓慢加入一汤匙油、盐、胡椒、芥末和一茶匙醋；加入蛋蛋白、一小块洋葱，如果有的话加入酸豆角。将全部混合并淋在肉上。


    [_Mme. Vandervalle._]


    # 奶油酱


    取一块黄油裹上面粉，放入锅中加热，融化时加入胡椒和盐。不断搅拌直到它变稠，加入少量牛奶；小火慢煮即可。滤滤后再次加热，配土豆食用。


    # 第一部分


    # 20


    # 猎人兔


    将兔切成块，放入烤箱中煮，加入黄油和胡椒，偶尔翻面以防变干。然后制作猎人酱。融化一块蛋黄大小的黄油并加入面粉使其变褐色，用大量的洋葱和小洋葱煎香，加入龙蒿、辣椒粉和胡椒粒；加入肉豆粉、三瓣大蒜、一枝百香和两片月叶。切碎兔肝放入酱中并全部过滤。将酱汁淋在兔身上，加入一杯红酒，或者根据英国口味加入葡萄酒酱汁。如果酱汁太薄，用面粉加稠，一同上菜。


    [_Mme. Spinette._]


    # 弗兰芒兔


    将兔切成整齐的块。放入深煎锅中用黄油翻炒，直到每块都煎黄而不烧焦黄油。将它们取出，在原黄油中煎香六个小洋葱（切碎）。将兔回锅中，用盐和胡椒调味，加入三片月叶、两瓣大蒜再加两瓣。如果有肉汁则加入一品，如果没有肉汁则加入等量的水和水。置火煮沸，然后转小火慢煮四分之小时。快好时，加入少许醋，根据口味增减。此菜配煮好并沥干的土豆。如果酱汁不够稠，加入一些先与冷水混合的面粉。


    > _Georges Kerckeert._>


    # 烤小羊配鹿肉酱


    这道菜用羊肉代替小羊效果非常好；如果遵循此配方，肉的味道会像鹿肉：


    将肉（例如羊肩）放入红酒中，加入切片的胡萝卜、百香、月叶（四片）、六瓣大蒜、十五粒胡椒和一茶匙醋，浸泡两小时。将汤汁煮沸并淋在肉上。这种淋热汁的过程重复两天。然后将肉放入烤箱，加入黄油、胡椒和盐直到煮熟。


    酱：在黄油中煎洋葱并倒入汁（不加胡萝卜）。慢煮四分之小时，过滤。取一核黄油裹上面粉，逐渐加入肉出的汁，然后加入一咖啡匙肉精和两块糖。这道酱汁应该相当稠。配肉食用。
    [_Mme. Vandervelle._]


    # 烤兔


    将兔块放入黄油锅中煎，加入三个洋葱、两个中等大小的土豆、半杯啤酒、少量水或高汤、胡椒和盐。在陶罐中慢火烤两小时，然后用面粉将汤加稠。煮好时加入两瓣大蒜、两片月叶、一小撮肉豆粉以及任何新鲜香料，如百香、欧芹、薄荷，味道更佳。


    [_Mme. E. Macs._]


    # 麦克斯鸡


    将一些冷鸡肉切成小方块，与浓稠的白酱混合并加热。放入热盘中，覆盖上炸洋葱。盘的两端放上碎土豆，另一端放煮过的菊苣。


