    # 第一部分


    制作优质的高汤汤底，你使用了牛奶和一根小牛肉骨，撒入一些磨碎的米粉直到变稠，充分搅拌二十分钟。洗净并切碎蘑菇，用黄油煎香。加入蛋黄并使其胶结。这是一道美味的汤。


    > _MMme. van Marcke de Lunessen,_


    # 士兵蔬菜汤


    （八至十人份）


    去皮三磅蔬菜。将它们放入一个大锅中，根据季节放入你所找到的所有蔬菜。在冬天，你需要准备四根芹芹、四根大葱、萝卜、一个卷心菜、两个洋葱、胡椒和盐、价值两便士的骨头，以及大约五半夸脱的水。让它们全部煮三小时，注意加水以保持分量在五夸脱。用毛毡擦拭所有蔬菜，将其压碎，然后让它们再次煮至少一小时。分配给第一次和第二次烹饪的时间至关重要。


    # 大葱汤


    切开两个洋葱并煎至金褐色；你不需要用黄油，用澄清脂肪即可。洗净大葱，冲洗干净；切段并同样煎；加入你有的任何其他蔬菜、两个中等大小的土豆、胡椒、盐和少许水。让所有食材炖三小时，然后通过细筛。由于大葱比其他蔬菜多，因此它们的风味占主导地位。


    > _Mme. Jules Segers,_


    # 芹芹油


    取一磅芹芹，去掉绿叶，将茎切成三分之二英寸长的段；放入沸盐水中煮至软软。取半个土豆，切片并加入芹芹中，使两者同时煮熟。滤出并放在平盘上。准备一些培根片，在烤箱中烤至脆；将融化的猪油淋在芹芹和土豆上，加一滴醋，将培根片放在盘中。热食用。


    大葱可以用同样的方法准备。


    # 卷心菜肉肠


    将一个大卷心菜切对对，切片并洗净，放入盐水中煮，半熟时加入切成小块的土豆。一起煮约一小时；然后沥干。在锅中放入一些脂肪，切开一个洋葱，在脂肪中煎香，加入卷心菜和土豆，一起炖十分钟；然后装盘。在水中煮一些肉肠并放在卷心菜上；热食用。


    > _另一种方法（更容易）。_


    一起炖卷心菜和肉肠，直到它们完全融合。


    # 利时式大葱


    注：煮过大葱的水冷后是种健康的饮品，或是蔬菜汤的基底。


    > _来自 Dollarfair 的比利时人，注。_


    # 西番茄沙拉


    制作西番茄沙拉时，你不能将水果切片后淋一点醋和油；不要加盐——那是无知。


    取一些西番茄，如果能买到也取一些金色的。将每个放入沸水中片刻，去皮，但要小心不要让汁弄破果肉。切一些生洋葱片；如果你不喜欢浓烈的味道，用小洋葱；在盘底部铺上四五薄片。铺上西番茄片，撒上盐和少许糖。让西番茄放置几小时，完全取出洋葱。在杯中调制以下酱汁：溶解一茶匙芥末、一些胡椒并撒少许碎欧芹。搅拌入一甜匙油，缓慢滴入，加入极少量芥末、一些胡椒并撒少许碎欧芹。有些人喜欢细葱。将此酱汁淋在西番茄沙拉上，静置一小时后食用。


    # 土豆奶士


    每个人都喜欢这道营养丰富的菜，而且很便宜。去土豆皮，将其放入耐火盘中，撒上碎奶士、胡椒、盐和几块黄油。再加一些土豆，以此类推，直到盘装满。将两个蛋黄打入一品品牛奶中，加入胡椒和盐并淋在菜上。放在炉灶顶部五分钟，然后在中温烤箱中烤半小时。如果菜较小可能需要更多时间，但土豆必须彻底煮熟。原配方要求格瑞乳奶士，但可以使用淡色的加拿大切达奶士。


    # 周五宴


    煮一个中等大小的卷心菜，如果能做成汤就更好。需要时，将其切碎并通过筛网。同时取三磅栗子去皮，保持整颗，另一部分通过筛网，加入少许牛奶制成泥。将泥与卷心菜混合，加入盐、胡椒和一块栗子大小的黄油。压入模具中，在双水加热中煮十五分钟。取出并用栗子装饰。


    # 紫卷心菜


