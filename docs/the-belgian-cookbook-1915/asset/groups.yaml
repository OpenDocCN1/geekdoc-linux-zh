    # 《比利时菜谱》（布莱恩·拉克奇夫人编辑）[带重音]


    这本书中的食谱是由来自英国各地的比利时难民设定的，正是由于这些通讯人的慷慨帮助，我才得以汇编。人们认为，英国烹饪也可以通过研究比利时菜肴从中获益。


    人们经常听说“完美的厨师，阿瑞斯夫人或第四维度”，但从未真正找到过，因此这本小手册的开启是为忙碌且缺乏经验的女主人和女仆准备的。它并不是为了百万富翁的利益而写的。这些食谱简单且大多数并不便宜，更适合收入普通的人士，而不是那些能够遵循某些名贵菜肴指令的人，例如：“取一只羊腿”等等。一架物资的价值，就像制作食物一样，不仅在于其本身，更在于它可能变成什么。


    咸点：如果你供应这些菜，就让它们成为一只踝肉，整洁且诱人。这道菜并非强制性的，记住这是一项超越常规的烹饪杰作。


    汤：让汤保持极热；不要让它像拉奥狄基人（指优柔不决的人）。你知道圣约翰对他们是怎么说的，如果你想到你的汤将和他所描述的圣维尔一样遭遇同样的命运，你会很遗憾的。确保你的汤有良好的汤底，避免意大利式的制作清汤法——即烧一锅水，然后让一牛从门口走过。


    鱼：说鱼应该绝对新鲜是可靠的，然而，有太多的厨师在周末认为，鱼就像希伯来人一样，被注入了安息日原则，使它从周六保持到周一。我雇佣你思考鱼。它是最有营养、最强健的食物——如果必须相信关于苏丹和两个锚的故事，它还有其他品质。


    肉类：如果用水煮肉，不要煮沸，而要慢炖；让正义的人明智地同意一道好菜的到来。你知道英国游客在看着摩尔人的锅时说了什么吗？“你那里有什么？羊肉和米饭？”西德，现在是羊肉和米饭，”摩尔人说，“两小时后看吧，如果真主允许，当大蒜嘶嘶作响时，它将是从麦加到卡萨布兰卡最有营养的慰藉。”然后，慢炖并调味你的肉类，让洋葱（如果没有大蒜）仅仅亲吻锅，即使你不允许它们之间有进一步的亲密关系。使用月桂叶、香料、各种香草、醋，并让洋葱（如果没有大蒜）仅仅亲吻锅，即使你不允许它们之间有进一步的亲密关系。使用月桂叶、香料、各种香草、醋，并让洋葱（如果没有大蒜）仅仅亲吻锅，即使你不允许它们之间有进一步的亲密关系。使用月桂叶、香料、各种香草、醋，并让洋葱（如果没有大蒜）仅仅亲吻锅，即使你不允许它们之间有进一步的亲密关系。使用月桂叶、香料、各种香草、醋，并让洋葱（如果没有大蒜）仅仅亲吻锅，即使你不允许它们之间有进一步的亲密关系。使用月桂叶、香料、各种香草、醋，并让洋葱（如果没有大蒜）仅仅亲吻锅，即使你不允许它们之间有进一步的亲密关系。使用月桂叶、香料、各种香草、醋，并让洋葱（如果没有大蒜）仅仅亲吻锅，即使你不允许它们之间有进一步的亲密关系。使用月桂叶、香料、各种香草、醋，并让洋葱（如果没有大蒜）仅仅亲吻锅，即使你不允许它们之间有进一步的亲密关系。使用月桂叶、香料、各种香草、醋，并让洋葱（如果没有大蒜）仅仅亲吻锅，即使你不允许它们之间有进一步的亲密关系。使用月桂叶、香料、各种香草、醋，并让洋葱（如果没有大蒜）仅仅亲吻锅，即使你不允许它们之间有进一步的亲密关系。使用月桂叶、香料、各种香草、醋，并让洋葱（如果没有大蒜）仅仅亲吻锅，即使你不允许它们之间有进一步的亲密关系。使用月桂叶、香料、各种香草、醋，并让洋葱（如果没有大蒜）仅仅亲吻锅，即使你不允许它们之间有进一步的亲密关系。使用月桂叶、香料、各种香草、醋，并让洋葱（如果没有大蒜）仅仅亲吻锅，即使你不允许它们之间有进一步的亲密关系。使用月桂叶、香料、各种香草、醋，并让洋葱（如果没有大蒜）仅仅亲吻锅，即使你不允许它们之间有进一步的亲密关系。
