    # 第一部分


    # 32


    百里香、胡椒和盐，再放入一片抹了芥末酱的面包皮。让这一切慢煮三小时。


    > _塞古尔夫人 (Mme. Segur)__


    # 瓦洛隆肉菜 (WALLON ENTRÉE)


    制作一些烤面包，可以切成圆形或正方形，并涂上黄油。切几片盐渍牛肉，或者更好一点用肉类，放在上面；在肉上抹上一层厚厚的碎奶酪，再放上另一片形状相同的涂了黄油的吐司。在小煎锅中融化一些黄油，将圆片煎至金黄色。


    > _马斯夫人 (Mme. E. Maes)_


    # 肉碎


    你的肉碎必须切小或粗碎；在其中加入少量香肠肉，大约占肉量的四分之一，以及一片浸泡过水或牛奶并充分沥干的白面包心。如果鸡蛋不不贵，就加入两个鸡蛋，将其与肉混合。将菜肴放入烤箱中烤半小时——但必须是慢火炉——要注意不要让肉变干。


    > _维拉查赫尔特 (V. Verachert)_


    # 肉丸 (FRICADELLE)


    每一磅碎猪肉取一一半磅碎小牛肉肉；切三片厚度近乎一英寸的白面包并将其揉碎；加入两个鸡蛋、胡椒和盐。将所有食材混合均匀，放入烤箱烤半小时。如果热吃，请配上肉汁酱。如果你想做成晚餐菜，请在肉下面垫上沙拉。


    # 苦苣火腿奶酪酱汁


    用黄油温和地煎煮苦苣直到煮熟。然后取每一块，裹上一片火腿肉片，放入耐火盘中。用面粉、黄油、牛奶调制一种极好的白酱，加入奶酪以增强浓郁风味，并加入一个蛋黄。将这种酱淋在苦苣上，将菜肴放入烤箱。让它变成褐色，直接上桌。


    > _范德瓦莱夫人 (Mme. Vandervalle)_


    # 小牛肉肉炸丸 (CROQUETTES OF VEAL)


    首先用面粉、牛奶和黄油制作一种非常稠的酱，不要忘了加盐和胡椒；当酱非常稠时，加入格鲁耶奶酪，比例为一满茶匙奶酪对应一小碗酱。移离离火，拌入全部的柠檬汁，然后加入一个蛋黄。让其冷却。将你的小牛肉肉（或任何瘦肉）切碎。与酱混合均匀，做成炸丸。然后将每个炸丸裹上你留下的蛋蛋白，再裹上碎的面包屑，放入深油中炸炸。


    > _范德瓦莱夫人 (Mme. Vandervalle)_


    # 奶士火三明治 (CROQUE-MONSIEUR)


    # 第一部分


    # 33


    用饼干模具切一些大小相等的面包圆片；如果没有模具，就用酒杯切。在所有圆片涂上黄油并撒上碎奶酪——首选格鲁耶奶酪。在一半数量的圆片上放上同样大小的火腿肉。在锅中放入一块黄油和鸡蛋，与圆片一起煎，直到它们变成金黄色。当色泽漂亮时，将一片抹了奶酪的圆片放在一片抹了火腿的圆片上，使上下都是金色的面包。趁热上菜，并用欧芹点缀。


    [_E. Defouck._]


    # 炖肉锅 (HOT-POT)


    在放入肉之前，先在水中煮一根芹芹、四根大葱、两个洋葱、萝卜、两根胡萝卜；然后加入肉、胡椒和盐，慢火炖三小时。如果你能放入一根骨髓，那会让汤具有非常美味的味道。


    [_维拉查赫尔特 (V. Verachtert)_]


    # 法式锅 (HOCHE POT)


    一磅新鲜猪肉，一磅牛后腱肉，一磅小牛肉臀，两个洋葱、芹芹、四根大葱、两根胡萝卜或三个萝卜（取决于大小）、几颗抱子蓝、五到六个土豆（取决于人数）。在放入肉之前让水水开，将所有蔬菜切成与糖块一样的正方形。只需慢炖三小时；它非常美味，可以作为一顿晚餐。


    [_维拉查赫尔特 (V. Verachtert)_]


    # 皇后的甜味包 (BOUCHEES À LA REINE)


    从起司饼上取一些小正方形，里面将填入切丁状的胸腺。在填充之前加热蛋糕是个好主意。


    填充料混合物。用加了胡椒盐的水煮胸腺直到煮熟，去皮并切成丁状。准备一种好的奶油调酱，用柠檬汁调味，并加入一些用黄油煎过的蘑菇。将胸腺丁在酱中加热并填充容器。放回烤箱加热。


    # 根特法式锅 (HOCHE POT OF GHENT)


    洗净两根大胡萝卜并切小块，两个萝卜也如此，四根大葱在流动的水中洗净，两根芹芹，一棵绿菜，将所有蔬菜切成等大小的方块。在放入肉之前让水水开，将牛肉切成等大小的圆片，加入一块猪蹄。在锅中放入一块黄油和鸡蛋，与圆片一起煎，直到变黄。当色泽漂亮时，将一片抹了奶酪的圆片放在一片抹了火腿的圆片上，使上下都是金色的面包。趁热上菜，并用欧芹点缀。


    [_Georges Kerckaert._]


    # 弗兰德斯炖肉 (CARBONADE OF FLANDERS)


    # 第一部分


    # 34


    将牛肉切成等大小的小块。将一些洋葱切碎，加入月桂叶、丁香、胡椒和盐；慢火炖三小时。用面粉勾稠酱。


    [_维拉查赫特 (V. Verachtert)_]


    # “无头鸟雀” (HEADLESS SPARROWS)


    取两磅牛肉（必须是瘦肉），切片。在每个肉片中间放入一小块培根，用丝线系好。加入根欧芹、胡椒和盐。在锅中融一块黄油，让其变色。将肉片裹上面粉后，放入黄油中煎。加入半品水，慢炖两小时。上菜前，要注意去除丝线。


    [_比利时特罗维奇式 (A Droitwich)_]


    # 羊肉炖 (MUTTON STEW)


    取两磅羊肉（胸肉或内脏），切片。在锅中融一块黄油，让其变色。将肉片煎色，加入胡椒、盐和一些小洋葱。当所有食材变色后，加入一品水和切片的萝卜。煮熟后，取出肉块，搅拌成均匀的混合物；然后将肉放在混合物上面，上菜。注意：必须仔细观察这道菜的烹饪过程，必要时加入少量水，因为肉很容易变干。


    [_比利时特罗维奇式 (A Droitwich)_]


    # 甘甘法式炖肉 (HOCHE POT GANTOIS)


    (供八九人准备)


    取一磅牛肉、一磅猪肉和一磅羊肉；切成约三英寸两英寸的块，煮熟去皮。取两根胡萝卜、一个大萝卜、一根芹芹或四根大葱、一棵绿菜切四份，其他蔬菜切成中等大小的块；放入肉块中，确保被水淹没。煮三到四小时，然后在上菜前十五分钟，加入切块的土豆。


    装盘方法：将肉放在平盘中央，蔬菜环绕四周；用汤匙盛汤。这道菜应该用汤匙吃，因为它既是汤又是肉。


    # 中式软塞 (CHINESE CORKS)


    制作一种奶油酱，在等其稍凉后，加入一个蛋黄和几滴柠檬汁。撒入一片陈面包和碎奶酪以增强浓郁风味，并让其冷却两小时。塑成像软塞的小块，浸入打散的蛋白中，再裹上碎的面包屑。准备一些热油或猪油，将奶酪球在其中炸至金黄色。


