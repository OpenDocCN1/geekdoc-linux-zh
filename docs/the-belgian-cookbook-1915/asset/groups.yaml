    # 第二部分


    # 50


    # 德国腌包菜 (CHOU–CROUTE)


    随心所欲地取大量的九月卷心菜，修剪后对半切开，去掉茎，彻底清洗并切细丝。准备一个陶罐，铺上一层卷心菜，撒上粗盐、白胡椒和杜松子。用这种方式填满罐子，盖上盖子，用重物压紧。大约六周后，发酵完成后即可备好。搭配猪肉或培肉食用极佳。


    # 菠菜炸饼


    取任何煮熟的菠菜——尽管人们通常会把它们吃光——与蛋黄和少许米粉充分混合；你可以加入一点糖粉。准备好热油，用勺一勺将菠菜滴入锅中。如果油温不够热，炸饼会脱落。迅速沥干并趁热享用。


    # 彩花人卷心菜


    切碎一些红甘心菜，半磅两个中等大小的苹果，去核切碎（或加入少许切碎的培肉），用胡椒、盐、醋（应该是龙舌兰醋）调味，放入一些肉汁或牛奶加水中炖煮。用小火慢炖一小时。另外单独煮一些绿甘心菜，在盐水中煮至软烂，切碎后放回小火上，加入盐、胡椒、一许肉豆蔻和黄油。加热混合，然后将两种颜色放在同一侧食用；红甘心菜有酸味，绿甘心菜有坚果味，非常悦人。


    # 小沙拉塔


    煮几个全熟蛋，同时制作浓稠的蛋黄酱。将甜菜根、黄瓜、冷土豆、番茄切片。剥好蛋并切片，将不同的食材堆成小堆，高度约二英寸。在每片食材之间撒上碎的面包屑、胡椒、盐、一小撮碎的生红葱、欧芹，将这些在一个杯中混合。顶部摆上切好的白色蛋白边缘，放上生菜并淋上酱料。


    # 周五酥皮饼


    用蛋、一许米粉、胡椒、盐和尽可能多的奶油调成面糊。将这种黄油擀得薄到透明。切成圆片，放在你现有的煮熟蔬菜上，但必须重重调味。冷土豆也可以，配上芥末、醋或浓郁的煮汁即可。将面饼折叠，在边缘压紧，放入热油中炸。


    # 枢机风式大西洋鳕鱼 (HADDOCK A LA CARDINAL)


    取一些大西洋鱼、鳕鱼或鯳鱼的鱼片，在牛奶和水中轻轻水煮（poach 意为水煮）。同时，准备一份好的白汁，另一份准备一份浓稠的番茄酱，重重调味，必要时加入鱼汁，以及大量的奶油。将鱼片放在盘子里，周围淋上白汁，顶部淋上番茄酱（酱不能流下）。在鱼片末端放一小枝香芹。


    [_Selette._]


    # 鯳鱼炖


    将鯳鱼的鳍、皮、边料放入足够烹煮的水中，加入胡椒和盐，炖半小时。通过细筛滤出。用黄油面粉、胡椒、盐制成棕酱，每磅大鯳鱼加入一茶杯牛奶，然后挤入柠檬汁，如果有的话，加一杯白酒。将鯳鱼切成块，在盐水中炖；熟后滤去水，装盘，淋上上方的酱。用柠檬皮装饰，中心呈网格状。


    [_Une epiciere._]


    # 粗鱼做法


    任何鱼用这种方法处理都很好。制作一份棕酱，裹好面粉，加入盐、胡椒和干香料。煎一下红葱并加入，然后加一大杯红酒、几滴柠檬汁。煮一些鱼，滤出并入酱汁中。取你的鱼，在牛奶和水中煮至熟，然后在酱汁中快速加热后享用。


    [_F. R. _]


    # 弗兰芒沙拉


    这是����鱼片，铺在碗里，配上苹果片、甜菜根片、冷土豆片和冷熟的豆芽，淋上普通的沙拉酱。如果鱼是盐渍，让它浸在全牛奶中去除大部分盐分。这是一道冬季菜，夏天也准备类似的，只是用冷豌豆、花菜、朝鲜蓟菊、豆类代替鱼。


    [_Amie reconnaissante_]


    # 弗兰芒酱 (FLEMIS SAUCE)


    这种流行的酱由融化的黄油加入蛋黄增稠，并用芥末调味；常用于鱼。


    # 牛肉块


    如果你有一小块非常好的牛肉，如牛臀肉或菲力肉，将其切成方块并在明火上煎烤更划算。准备几块抹了黄油且热热的烤吐司，放在热盘上，顶部放一块牛排，再在上面放一片压碎并加过味的番茄片，和一堆山辣末。这是一道精美的菜，可以用酸豆豆或碎酸黄瓜代替山辣末来增加变化。将肉、面包等切成方块而不是圆形是非常省钱的妙法。


    [_Une amie au convent._]


    # 模仿肉排


    对于喜欢咖喱味的人，我喜欢这道菜。取任何冷熟的蔬菜，切成小块，裹上面粉。


