    # 第二部分


    ## 56


    切下一些比水煮蛋稍大的圆形面包片。在煎面包片时，制作一份布鲁塞尔蔬菜泥。将它们煮至软烂，放入布中挤干水分。通过筛网揉碎，并加入奶油、胡椒和盐，制成非常浓稠的泥。为每个面包片准备一个水煮蛋，迅速将其滑入面包上，放上一些绿色蔬菜泥，然后盖上盖子上菜。


    ## 给孩子们的甜点


    如果你有一些剩余的小面包，将每个面包切成四份，浸泡在加了糖并调过香草精味的牛奶中，浸泡三小时。浸泡后，将它们在磨碎的干面包屑中轻轻裹一下，然后放入沸油中油炸片刻，就像做炸丸一样。在上面撒上白糖，趁热上菜。


    > [Madame M._]


    ## 杏果酱布丁


    用这种方法制作果酱时，这是一道准备快速的菜肴。用一品脱浓牛奶、鸡蛋、少许杏仁精和两盎司糖粉调制一份好的佳丁。将你的杏果酱放在耐热圆形容器的底部，倒入佳丁。放入烤箱烤半小时或一小时，直到凝固。在顶部再放上一些（加热过的）杏果和碎杏仁点，即可上菜。这道菜可以配上苹果，苹果应被煮熟，加入半个柠檬的皮调味，并通过筛网。苹果泥以同样的方式放在顶部，并用一些切成星状的薄柠檬皮进行装饰。


    > [Chef reconnaissant,_]


    ## 黄李子煎饼


    将半磅大米放入热牛奶中煮，直到其吸收所有牛奶并变软。轻轻击打三个鸡蛋的蛋黄，并加入一块如李子大小的新鲜黄油；加入糖和充分打发的蛋蛋白。将米饭放入这种混合物中并放入模具。用小火慢煮二十五分钟。同时，取一些非常黄的李子，去皮去核，放入半瓶加了少许香料的淡白葡萄酒中加热。将米饭盛出，把李子放在顶部，淋上用纱布过滤过的酱汁。冷吃味道极佳。


    ## 布拉班煎饼


    首先给煎饼涂黄油，你应该准备好正宗的煎饼酱。加热半品脱甜牛奶，并与之融化四分之一磅的盐油。充分融化后倒入盆中，撒入近一盎司的面粉。击打三或四个小鸡蛋的蛋黄并混合，加入充分打发的蛋蛋白。在每个碟子上放一或两勺糊，放入烤箱中烤十分分钟，完成后，将每个碟子放在盘子里，在每个上面放上足量的杏果酱。如果你没有煎饼酱，就将每个煎饼的一半涂上杏果酱并折叠起来。


    > [Jean O._]


    ## 甜点的美味酱汁


    取一个酒杯（如香槟杯大小）的马德拉酒，加入两个鸡蛋中的一个。放入一个非常干净的珐琅锅中用火加热，根据口味搅拌入糖粉。在火上快速搅拌打直到起泡沫，但不要让它煮腾。用于热诺亚斯蛋糕和布丁。


    # 第二部分


    [_Madame Groubet,_.]


    ## 水果冻


    风味极佳的果冻可以用新鲜水果制作，如树莓、草莓、杏子甚至大黄瓜，比例为每盎司吉明胶（加冷水）配每盎司果泥。天气炎热时使用少量的吉明胶。由于水果会导致颜色变差，制作热果冻时必须使用胭脂虫，制作醋醋李果冻时使用一点绿色色素。吉明胶当然在果泥中融化并全部倒入模具中。你可以通过这种方法制作自己的绿色色素。取一磅菠菜，去掉菜茎和中脉。放入锅中加少许盐并盖上锅。煮十二分钟。然后在盆上方放一个细筛，将菠菜水倒出来。用纱布对菠菜水过滤一两次；它的颜色会很好且能保持一段时间。自制的橙子和柠檬果冻比购买的粉末健康得多。在每六个橙子的汁中加入柠檬汁，从水果中榨取等量的汁，挤压前让它浸泡在热水中三至四分钟。


    [_Pour la Patrie._]


    ## 草莓花式取一片或两片原味海绵蛋糕，切成两英寸宽的圆形。然后在盆中打发四个鸡蛋的蛋白，用草莓酱中较稀的部分着色。通常这种酱的颜色不够红，你必须加入一点胭脂虫。将粉红色的混合物高高地放在蛋糕上。


    > [_Pour la Patrie._]


    ## 粉红米饭


    这种甜点深受厌倦了牛奶布丁的孩子喜爱。将大米煮软，拌入煮熟的甜菜根汁，并加入一些糖。将其放入模具中，冷却后取出，并在顶部放上一勺树莓酱或配上流过果汁的红李子。


    > [_Pour la Patrie._]


    ## 军事西子


    取一些最好的法国浸渍西子，去掉核。在橙味利口酒中浸泡直到你有时间为止。然后用去皮的杏仁代替每个核，将西子放在小水晶玻璃碟中。


    > [_Pour la Patrie._]


    ## 玛德琳樱桃


    取一些玛德琳蛋糕并将其挖空形成篮子。在这些篮子里填入浸泡在良好烈酒中的黑白樱桃——樱桃白兰地是最好的，但你也可以使用马拉斯奇诺果酒。在上面横跨两根欧香芹。


    > [_Pour la Patrie._]


    ## 草莓小挞


    # 第二部分


    ## 马德拉酒蛋（OEUFS À GRAND-MÈRE）


    将一个鸡蛋的蛋黄打破盆中，根据需要加入糖。加入几滴柠檬汁调味，然后在牛奶中打发一个新鲜鸡蛋，并加入等量能在盐匙中平铺的淀粉。将佳丁与醋醋李混合，通过……。


