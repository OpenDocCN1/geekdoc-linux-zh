    # PART I


    ## RICE À CONDE


    Simmer the rice in milk until it is tender, sweeten it, and add, for a medium-sized
    mold, the yolks of two eggs. Let it thicken a little, and stir in pieces of pineapple.
    Pour it into a mold, and let it cool. Turn it out when it has well set, and decorate
    with crystallized fruits. Pour round it an apricot syrup.


    [_Mme. Spinette._]


    ## PAINS PERDUS

    (Lost bread)


    Make a mixture of milk and raw eggs, enough to soak up in six rolls. Flavor it
    with a little mace or cinnamon. Put some butter in a pan and put the rolls in
    it to fry. Let them color a good brown, and serve them hot with sugar dusted over
    them.


    [_Mme. Spinette._]


    ## FRUIT FRITTERS


    Peel some apples, take the core and cut them in slices, powder them on each side
    with sugar. You can use also pears, melons, or bananas. Make a batter with flour,
    milk and eggs, beating well the whites; a glass of rum and sugar to sweet it.
    Put your lard on the heat, and when the blue steam rises your fruit slices in
    the butter and throw them into the lard. When they are golden, serve them with
    powdered sugar.


    [_Mme. Spinette._]


    ## MOCHA CAKE


    Take half pound of fresh butter, four ounces of powdered sugar, and work them
    well together. When they are well mixed, add the yolks of the four eggs, each
    separately, and the whites of two. When the mixture is thoroughly well done, add,
    drop by drop, some boiling coffee essence to your taste. Butter a mold and line
    it with small sponge biscuits, and fill it with alternate layers of the cream
    and biscuits. Put it for the night in the cellar before you serve it the following
    day. You can replace the essence of coffee by some chocolate that has been melted
    over hot water.


    [_Mme. Spinette._]


    ## VANILLA CREAM


    Sweeten well half pint of milk and flavor it with vanilla. Put it to boil. Mix
    in a dish the yolks of the four eggs with a little cornstarch. When the milk boils,
    pour it very slowly over the eggs, mixing it well. Return it all to the pan and
    let it get thick without bringing it to the boil. Add some chopped almonds, and
    turn the mixture into a mold.


    [_Mme. Spinette._]


    ## RUM CREAM


    Take sponge biscuits and arrange them on a dish, joining each to the other with
    jam. (You can make a square or a circle or a sort of hollow.) Pour your rum over
    them they are well soaked. Pour over them, into the middle of the biscuits, a
    vanilla cream like the foregoing recipe, but let it be nearly cold before you
    use it. Decor the top with the whites of eggs sweetened and beaten, or use fresh
    cream in the same way.


    [_Mme. Spinette._]


    ## PINEAPPLE À L''ANVERS


    Take some slices of pineapple, and cut off the spots at the edges. Steep them
    for three hours in a plateful of kirsch, or maraschino, which is slightly warmed.
    Take some slices of plain cake of equal thickness, and glaze them. This is done
    by sprinkling sugar over the slices and placing them in a gentle oven. The sugar
    melts and weaves the slices *glacés*. Arrange the slices in a circle, alternating
    pineapple and cake, and pour over the apricotade thinned with kirsch or liqueur.
    This dish looks very nice, and if whipped cream can be added it is excellent.


    [_L. L. B. Anvers._]


    ## POUDING AUX POMMES


    Take a pound of apples and peel them. Cook them, rub them, when soft, through
    a sieve to make them into a purée. Sweeten it well, and scent it with a scrap
    of vanilla; then let it get cold. Beat three eggs, with whites and yolks, and
    mix them into your compote, and put all in a dish that will stand the heat of
    the oven. Then place on the top a bit of butter the size of a fiber and pour over
    it with white sugar. Place the dish in an oven with a gentle heat for half-an-hour,
    watching how it cooks. This dish can be eaten hot or cold.


    [_E. Defouc._]


    ## SOUFFLE AU CHOCOLAT


    Melt two tablespoons of chocolate (Menier) in a dessert-spoonful of water over
    heat, stirring till the chocolate is well wetted and thick. Then prepare some
    flour in the following way: Take for five or six persons nearly a pint of milk.
    Sweeten it well with sugar; take two-dessert spoons of chocolate. Boil the sweetened
    milk, flavoring it with a few drops of vanilla. When it is boiled, take it from
    the fire, and let it get cold, mixing in the flour by adding slowly so not to
    make lumps. Put it on a break of fire and stir till; then add the melted chocolate,
    when it is gently tinted in your pan, and again it get cold. At the moment of
    cooking the soufflé, three whites of eggs beaten stiff. Butter a deep-proof dish,
    and pour in the mixture, only filling half of the dish. Cook it in the oven for
    fifteen minutes with a gentle heat, and serve immediately. A tablet of Chocolate
    Menier is a recognized weight.


    [_Gabri Jansens._]


    ## A NEW DISH OF APPLES


    Take a pint of apple purée and add to it well-beaten eggs, a taste of cinnamon
    if liked, quarter of a pound of melted butter and the same quantity of white powdered
    sugar. Mix all together, and taking a fireproof dish, put a little water in the
    bottom of it and then few breadcrumbs. Pour in the mixture, then few breadcrumbs,
    cover the dish, and sprinkle with breadcrumbs and a lump of butter to prevent
    it from burning.


    ## GOLDEN RICE


    Take a pint of apple purée and add to it well-beaten eggs, a taste of cinnamon
    if liked, quarter of a pound of melted butter and the same quantity of white powdered
    sugar. Mix all together, and taking a fireproof dish, put a little water in the
    bottom of it and then few breadcrumbs. Pour in the mixture, then few breadcrumbs,
    cover the dish, and sprinkle with breadcrumbs and a lump of butter to prevent
    it from burning.


    ## BANANA COMPOTE


    Hard-boiled eggs and, while they are cooking, fry a large slice of bread in butter
    to make a large crouton. Peel the eggs when they have been in boiling water for
    ten minutes. Pile them on the crouton, and have a ready tomato sauce to pour over.


    ## RICE CONDE


    Simmer the rice in milk until it is tender, sweeten it, and add, for a medium-sized
    mold, the yolks of two eggs. Let it thicken a little, and stir in pieces of pineapple.
    Pour it into a mold, and let it cool. Turn it out when it has well set, and decorate
    with crystallized fruits. Pour round it an apricot syrup.


    [_Mme. Spinette._]


    ## CHOCOLATE CREAM


    Sweeten well half pint of milk and flavor it with vanilla. Put it to boil. Mix
    in a dish the yolks of the four eggs with a little cornstarch. When the milk boils,
    pour it very slowly over the eggs, mixing it well. Return it all to the pan and
    let it get thick without bringing it to the boil. Add some chopped almonds, and
    turn the mixture into a mold.


    [_Mme. Spinette._]


    ## KIDNEY SOUFFLE


    The sliced mushrooms in butter, adding, if you wish, a little mushroom ketchup.
    Break the eggs in a pan and beat them lightly together, and cook for three minutes
    over a good fire. Slip the omelette on a hot dish, spread with butter.


    ## ASPARAGUS OMELETTE


    This is made quite differently. Cook the asparagus-tops in salt and water and
    drain them. Roll them in a little bechamel sauce. Break your eggs into the pan
    which you have put a little butter; stir them with a fork in your left hand, adding
    salt and pepper with your right. This will only take a minute. Add the asparagus-tops
    in the thick sauce; this will take another minute. Roll or fold up the omelette
    and slip it on a hottered dish.


