    ## 22


    ## 儿童生日甜点


    煮沸一夸脱牛奶，加入近半磅糖调味，并加入香草调风味。让其冷却。打散六个鸡蛋（蛋黄和蛋蛋白），将其与牛奶混合，全部放入耐火容器中用小火慢煮。享用前盖上顶部，配拉拉塔炖蔬菜饼（ratatfia
    biscuits）食用。


    ## 法式奶油


    将煎锅放在桌上，打入两个鸡蛋。将这些与两汤匙面粉混合。加入一品脱牛奶，放在火上，始终向一个方向搅拌。让它煮十五分钟，一只手搅拌，另一只手撒入糖粉和杏仁粉。倒出冷却，切成方块。


    ## 杏果舒芙蕾


    这足以应付一场英式的“晚宴”。将六个鸡蛋的蛋白打至硬性。取四汤匙杏果果酱，或等量的浸泡并煮成泥的干杏。如果你使用果酱，则无需加糖。如果你使用干杏，则加糖调甜。在盘底部涂上黄油，当与打发的蛋白和杏果充分混合后，将其呈金字塔形放在盘中，在中温烤箱中烤十五分钟。撒上糖粉。


    ## 炖西梅


    西梅这样吃法非常好。取一磅西梅，在水中浸泡二十四小时。将其放在火上，加入一杯水、半瓶淡红酒、一磅糖，如果你喜欢，还可以加少许肉桂或混合香料。全部炖煮直到液体减少且西梅入味。让其冷却，装在玻璃盘中，配上打发的奶油奶油。


    ## 巧克力奶油


    取六个鸡蛋的蛋白并打至硬性，先打一个后打另一个，其中加入三汤匙糖粉和三根碎的巧克力。如果你手有巧克力粉，则使用它，并在调味良好后加入混合物中。在凉爽处充分混合。要成功制作这道菜，请在准备食用前制作。


    [来自布鲁塞尔的 Lust 女士，小姐._]


    ## 粗麦舒芙蕾


    煮沸两品脱牛奶和十五块糖，加入少许香草。加入三汤匙粗麦粉，在搅拌时让其沸十五分钟。离火，将其加入两个鸡蛋的蛋黄和已打至硬性的蛋蛋白中。放入烤箱烤十五分钟，热吃即可。


    [来自布鲁塞尔的 Lust 女士，小姐_._]


    ## 雪山


    在六个圆形饼干上涂上黄油，上面铺上一层果酱。打发三个鸡蛋的蛋白，将它们放在饼干上，呈金字塔形。放入烤箱稍稍上色。必须热吃。


    ## 第一部分


    [来自布鲁塞尔的 Lust 女士，小姐._]


    ## 瑞切米饭


    将三汤匙卡罗来纳米饭放入少量水中膨胀，加入一块黄油。当米饭吸收所有水后，加入一品脱牛奶、加糖调味、一些葡萄干、一些碎橘皮和任何其他糖渍。全部放在火上，当混合物煮好后，米饭应呈奶油状。加入一个蛋黄，搅拌，全部倒入一品容器中。冷却。装盘并淋上以下酱汁（形状装饰）：


    一品脱牛奶、糖和香草；煮沸。将一汤匙玉米粉在水中搅拌至光滑，将其加入沸腾的牛奶中，与米饭装盘。加入一个蛋黄。


    [来自布鲁塞尔的 Lust 女士，小姐._]


    ## 极佳面糊


    在土碗中混合半品脱面粉、五个蛋黄、一咖啡匙砂糖、半品脱新鲜牛奶，加入少许盐和香草；然后加入隔水融化的几司黄油。将四个鸡蛋的蛋白打至硬性，并加入其中。使用烤盘或烤板（因为英国人没有华夫饼机，那种双层且能合拢的），倒入你的混合物，将其摊平在烤板上。当华夫饼煎至金黄色时，取出并撒上糖粉。但要使这道食谱绝对成功，正确的用具是必要的。


    ## 布鲁塞尔式华夫饼


