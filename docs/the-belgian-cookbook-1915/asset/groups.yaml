    # PART II


    # STUFFED CARROTS


    Some good sized carrots, and after washing them and cutting off the green tuff,
    cut each across about two and a half inches from the leaves. Scoop out the inside
    yellow part, leaving a case of the redder part and a piece to form the butter,
    small stender. Then the cases very gently till a tender, but not quite soft. Take
    out of the water, drain them, and then placing each on its small end, fill up
    with chopped mushrooms, which have been tossed in butter. Arrange in a circle
    on a dish, and garnish with small sprigs of carrot leaves. The insides that you
    have scooped out are to be used for soup flavoring.


    > [Pour la Patrie._]


    # TO COOK ASPARAGUS


    One should not let the tips of this vegetable touch the water. Take your bundle,
    dip the stalks in warm water to remove any dust, and the tips also, if it is necessary.
    Tie the bundle with tape, keeping the ends of stalks so that it will stand upright.
    Place them in boiling water with the heads sticking out, and keep them like that.
    In this way the heads, which are very tender, will be cooked in the steam and
    not drop off.


    > [Pour la Patrie._]


    # TOMATOES IN HASTE


    Butter a pie dish, preferably a fireproof china dish. Open a tin of tomatoes and
    remove as much skin as you can if they are the unpeeled kind. Put a handful of
    crumbled brown bread in the dish with lumps of butter, then pour on that some
    tomatoes, dust with pepper and salt, then more, and so on, finishing at the last
    with lumps of butter, and a thick sprinkling of grated cheese. Bake for twenty
    minutes.


    > [Pour la Patrie._]


    # KIDNEYS AND LETTUCE


    Put on some water to boil. Take your lettuce, and choose the round kind, and wash
    it. Take out neatly with your fingers the center leaves, and fill up instead a
    sheep''s kidney which you have lightly dusted with flour, pepper, and salt. Tie
    the lettuce round very firmly and set it in a pan of boiling water that covers
    only three quarters of the vegetable. Boil for eighteen minutes. Take the lettuce,
    drain it, and serve at once. Kidneys are good when they are placed inside large
    Spanish onions and gently stewed, in which case a dab of mustard is used given.


    # TOMATO RICE


    Put on your rice to boil. Make a tomato sauce by stewing it gently, and then rubbing
    it through a sieve this makes a purée, which you must put to heat with pepper
    and salt and a small quantity of mustard. Then grate some parmesan, or failing
    that, use Gruyère cheese. Take the rice, drain it, and keeping it hot, put it
    on a dish and pour over your purée. Then sprinkle the grated cheese thickly on
    top of all.


    > [Pour la Patrie._]


    # RICE WITH EGGS


    Boil some rice till it will press closely together. Fill some teacups with it,
    pressing the rice well down; then'
  - '[PAGE 47]


    # PART II


    # 48


    leave a hole in the middle and pour into each hole a small raw egg, yolk, and
    white. Set the tea-cups to in the oven, and when the eggs are just set and no
    more, press on some more rice. Turn them out of the teacups, and if you have rubbed
    the inside of the cups with a little butter this will be tasty, and sprinkle over
    the top of each finely chopped parsley. Do not forget salt and pepper to season
    the ingredients.


    > _Pour la Patrie_]


    # BROAD BEANS IN SAUCE


    Take your shelled beans, very young and tender. Throw them into boiling water
    for a minute, then pour the water away. Heat for a pound of beans and one—half
    pints of milk, stir in four ounces of salt butter, very little chopped parsley,
    salt and pepper. Do not let the milk boil, but when it simmers put in the beans.
    When they been heated for ten minutes, thicken your sauce with the yolks of two
    eggs and a tablespoon of cream. Take out a bean and it to see if it is cooked,
    and if so, pour all on a hot dish. Garnish with fried snippets of bread. Old beans
    can be treated in the same way, but they must be skinned.


    > [Aimee_]


    # OMELETTE OF PEAS


    Beat up three eggs, to add one tablespoon of grated cheese, pepper, and salt,
    and mix thoroughly. Butter an omelette pan, and pour in the mixture, keep moving
    it with a fork while you sprinkle in with the other hand some cooked green peas.
    The omelette will be cooked by the time you have sprinkled in two handfuls. Slip
    it off a very hot dish, fold over, and serve at once.


    > [Jean O._]


    # BRUSSELS ARTICHOKES


    Wash some good artichokes, and boil them in salted water. Meanwhile make a good
    mushroom filling, highly seasoned, of cooked mushroom, dip into butter, pepper,
    salt, few breadcrumbs, and shreds of ham. Remove the center leaves from the vegetable
    and as much of the chuke as you can. Fill up with the mushroom force and stew
    gently in brown sauce flavored with a bunch of herbs.


    > [_F. R._]


    # BELGIAN SALAD


    is merely dressed, washed and torn apart with red peppers added here and there
    as well as the ordinary salad dressing.


    Belgian asparagus is done by adding to the cooked vegetable bechamel sauce, poured
    over the dish, and then slices of boiled eggs placed on the top. The giant asparagus
    is used, and it is eaten with a fork.


    > [A Grocer''s Wife_]


    # BRUSSELS CARROTS


    Cut young carrots in small pieces, blanch them in salted water; melt some butter
    in a stew pan, add enough water and extract to make sufficient for the carrots,
    season with pepper, salt and a pinch of sugar and toss the carrots in this till
    they are tender. Then add the yolk of an egg and a tablespoon of cream, holding
    the pan off the fire with the left hand, while you stir with the right. When it
    is well mixed pour all'
  - '[PAGE 48]


    # PART II


    # 49


    out on a vegetable dish and sprinkle over chopped parsley.


    [Amie reconnaissante_]


    # CARROTS AND EGGS


    Make the same preparation as above, for the sauce, with the same seasonings, but
    add a dash of nutmeg. Then add half a pint of white stock which will be enough
    for a small bunch of carrots; simmer them for fifteen minutes and then break in
    three whole eggs, taking that they fall apart from each other. Let them cook until
    nearly set (for they will go in the hot sauce after you remove them from the fire)
    and serve at once. This is nearly good if you use old carrots sliced, instead
    of the young ones.


    [M. Zoeben_]


    # CUCUMBERS AND TOMATOES


    Take two earthenware pots and put some tomatoes to stew in one, in water, pepper,
    and salt. Peel a cucumber, open it, remove the seeds and stuff it with whatever
    you have; but a white one is best. Let it cook gently in some brown stock, well
    covered over. When tender put the cucumber along the dish and tomatoes on each
    side. A puree of potatoes can surround them.


    [A. Fanderverde_]


    # RED HARICOTS


    Soak some white haricot-beans over night, then them till tender in some weak stock.
    Make a tomato sauce in a saucepan, and flavor it rather with mustard, stirring
    well, so that it is well incorporated. When the beans are tender, drain them from
    the liquor (keeping them hot) and reduce to half its quantity. Put back the beans
    and add the tomato sauce, heat for a couple of minutes, and serve with three-cornered
    pieces of toast.


    [Elise et Jean.]


    # POTATOES A LA BRABCONNE


    Boil some potatoes, rub them through a sieve, add pepper, salt, a spring or two
    of parsley and a tablespoonful of cream to a pound of potatoes, rub through a
    tammy again. Chop a shallot, a spring of parsley and mix them in, sprinkling at
    the same time a dash of nutmeg and a dessertful of grated cheese. Place the puree
    in a dish to be baked, and before setting it in the oven sprinkle on the top bread-crumbs,
    and cheese grated and mixed one or two pats of salt butter. Bake till it is a
    golden brown.


    [Elise et Jean.]


    # FLEMISH PEAS


    Cook some young peas and some carrots (scraped and shaped into cones) in separate
    pans. Then put them together in an earthenware close covered pan to simmer together
    in butter and gravy, the first water having well drained from the pan. Season
    with pepper and salt and let them cook gently for ten or twelve minutes; do not
    uncover the pot to stir it, but shake it every now and to prevent the contents
    from burning.


