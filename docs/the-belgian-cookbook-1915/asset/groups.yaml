    # ANCHOY BISCUITS


    Made as you would make cheese biscuits, using anchovy sauce instead to flavor
    them. If you make the pastry then you can put some lettuce between two biscuits
    and press together with a little butter inside.


    # ANCHOY PATTIES


    Make some paste and roll it out. Take a coffee cup and turn it upside down stamp
    some rounds. Turn the cup right again, and put it on a round. Then you will see
    an edge of paste protruding all round. Turn up the end of a fork, which has a
    pretty little edge. Do this with all, and fill the shallow cases made with a good
    mayonnaise in which you have put chopped celery and potato, and a small quantity
    of chopped gherkins. Lay three fillets of anchovy each other to form a six-pointed
    star and season highly with cayenne pepper.


    All the above recipes can be followed with sardines instead of anchovies, and
    indeed one can use them in many other ways, with eggs, with lettuce, to tomatoes.
    As anchovies are expensive to buy, I give a recipe for mock anchovies, which is
    easy to do, but must be done six months before you use.


    # MOCK ANCHOVIES


    When sprays are cheap, buy a good quality, what in England you would call a peck.
    Do not wipe or wash them. Take four ounces of saltpeter, a pound of bay salt,
    two pounds of coarse salt, and pound them, add a little liquor to color it out,
    and mix very well. Take a stone jar and put in it a layer of the mixture and a
    layer of the sprays, on each layer of fish adding three or four leaves and a few
    leaves pepper-corns. Fill the jar and press it all down very firmly. Cover with
    a stone cover, and let them stand for six months before you use them.


    # CUCUMBER A LA LAEKEN


    Take a cucumber and cut it into two inches long, then peel the dark green skin
    for one inch, leaving the other as is. Set up each piece on end, scoop it out
    till the marrow and fill up with bits of cold salmon or lobster in mayonnaise.
    Cold trout or any other delicate fish will equally well or a small turret of whipped
    cream, slightly salted, should be piled on top. This dish never fails to please.


    # HERRING AND MAYONNAISE


    Take some salt herring, a half for each person, and soak them for a day in water.
    Skin them, cut them open'
