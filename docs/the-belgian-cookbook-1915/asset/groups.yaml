    # CHICORY À LA FERDINAND


    Boil and chop in medium-sized pieces the chicory, mince up a few chives according
    to your taste and heat both the vegetables in some cream, adding salt and pepper.
    Pour on a dish and decorate with chopped hard-boiled eggs.


    # APPLES AND SAUSAGES


    This dish comes from the French border of Belgium; it tastes better than you would
    think. Take a pound of beef sausages, and preferably the small chipolata potatoes.
    (What a delightful thing if the English would make other kind of sausages as well
    as their and pork ones!) Fry your sausages lightly in butter, look upon them as
    little beings for few moments in purgatory before they are removed to heaven,
    among apples. Keeping your sausages hot after they are fried, take a pound of
    brown ripened apples, pare and core. Cut them into neat rounds of an inch thick,
    then put them in their liquor of the sausages (which you are keeping elsewhere),
    and add butter to moist them. Let them simmer gently so to keep their shape. Put
    the apple–rings in the center of the dish, place the sausages round. This dish
    uses a good of butter, but you must not use anything else for frying.


    # STUFFED CHICORY


    Make a mince of any cold white meat, such as veal, pork, or chicken, and add it
    to some mince; sprinkle it with a thick white sauce. In the meantime the chicories
    should be cooking; tie each one with a thread to keep them firm and boil for ten
    minutes. When cooked, drain them well, open them lengthwise carefully, and slip
    in a spoonful of the mince. Close them, keeping the leaves very neat, and, if
    necessary, tie them round again. Put them in a fire–proof dish with a lump of
    butter on each, and let them heat through. Serve them in their juice or with more
    of the white sauce, taking care to remove the threads.


    > [Madame Lippens.]


    # TOMATOES STUFFED WITH BEANS


    Halfve and the tomatoes, and put a few drops of vinegar in each. Cook your beans,
    whether French beans or haricots or flagelets, and stir them, when tender, into
    a good bechamel sauce. This will get cold. Empty out the vinegar from the tomatoes
    and fill it with the mixture, pouring over the top mayonnaise sauce and parsley.


    > [Madame van Praet.]


    # CABBAGE AND POTATOES


    Boil the cabbages in salted water till tender. Chop them up. Brown an onion in
    butter, and add the cabbage, salt, pepper, and a little water. Slice some potatoes
    thickly, fry them, and serve the vegetable with cabbage in the center, and the
    fried potatoes laid round.


    > [_Mdlle. M. Schmidt, Antwerp_]


    # SPINACH À LA BRACONNIÈRE'
  - '[PAGE 10]


    # PART I


    Cook two pounds of well—washed spinach; drain it, and pass it through a sieve;
    or failing, chop it very finely with butter, pepper and salt. Do not add milk,
    but let it remain somewhat firm. Make a thick beamel sauce, sufficient to take
    up a quarter of a grated Gruyère, and if you wish, stir in the yolk of a raw egg.
    Lay in a circular dish half pound of minced ham, pour it the thick white sauce,
    and round again the hot spinach. This makes a pretty dish, and it is not costly.


    > [_Mme. Braconnière—]


    # A DISH OF HARICOT BEANS


    Put the haricots to soak for six hours in cold water. Boil them in water with
    one carrot, one onion, salt, two cloves, a good pinch of dried herbs. Drain off
    the liquor from the haricots. Chop up a shallot, and fry it in butter; add your
    haricots, with pepper and salt and tomato puree. Stir well, and with minced parsley
    scattered at the top.


    > [_Mme. Goffaux—]


    # POTATOES IN THE BELGIAN MANNER


    Take some slices of streaky bacon, about five inches long, and heat them in a
    pan. When the bacon is half-cooked, take it out of the pan and in the fat remains
    fry very finely—sliced onions till they are brown. When the onions are well browned,
    put them in a large pot, large enough for the potatoes you wish to cook, adding
    pepper, salt and a coffee-spoonful of sweet herbs dried and mixed, which in England
    replace the thyme and bay—leaves used in Belgium. Add sufficient water to cook
    the potatoes and your slices of bacon. Cook until tender.


    > [_E. Wainard—]


    # TOMATOES AND SHRIMPS


    Lay on a dish sliced tomatoes, taking the seeds, and sprinkle them over with picked
    shrimps. Then pour over all a good mayonnaise. For the sauce: Take the yolk of
    an egg and mix it with two-spoonfuls of salad oil that you must whisk in gently
    and very little at a time. Melt a good pinch of salt in a teaspoonful of vinegar
    (tarragon vinegar, if you have it); add pepper and a small quantity of mustard.
    In making this sauce be sure to stir it always the same way. It will take half—an—hour
    to make it properly.


    > [_Paquette—]


    # FLEMISH ENDIVE


    Choose endives that are short and neat; cut off the outside leaves and pare the
    bottom; wash them in plenty of water, and cook them in simmering water for three
    minutes. Take them from the water and place them in a well—buttered frying—pan,
    dust them with salt and also with a pinch of sugar. Add the juice of half a lemon,
    and rather less than a pint of water. Place the pan on the fire for two or three
    minutes to start the cooking, then cover it closely, and finish the cooking by
    placing it in the oven for fifty minutes. Take out the endives and put them in
    the vegetable—dish and pour over the liquor which they have been cooked. This
    liquor is improved by being reduced, and when off the fire, by having a small
    piece of butter added to it.


    The above recipe can be used for chicory as well as for endive.


    > [_J. Kirckaert—]'
  - '[PAGE 11]


    # PART I

    CAULIFOWER AND SHRIMPS


    Take a cauliflower and cut off the green part, and wash it several times in salted
    water. Boil it gently until cooked, taking care that it remains whole. Put it
    aside to cool, and when it is quite cold make a hole in the center down to the
    bottom. Pick shrimps till you have half a pint of them, make a good mayonnaise,
    and taking half of it, mix with the shrimps. Fill the hole in the cauliflower
    with the shrimps and sauce, and pour the rest of the sauce over the top of the
    cauliflower.


    This dish is to be served cold.


    > [_E. Defouck_


    # BELGIAN CARROTS


    Clean the carrots, cut them in dice, and wash them well. Put them on the fire
    with enough water to cover them, a bit of butter, an onion well minced, salt and
    pepper and a dessert—spoonful of powdered sugar. Place the dish in the oven for
    at least an hour, and when you serve it, sprinkle the carrots over minced parsley.


    > [Gabrielle Janssens.]


    # STUFFED TOMATOES


    Take good tomatoes and cut off the tops, which are to serve as lids. Remove the
    insides, and fill with the mixture: minced veal and ham, rather more than ham,
    mushrooms tossed in butter, a little breadcrumb, mince to render it, moist. Put
    on the covers and add each on a scrap of butter. Bake them in a fireproof oven:
    Use any stock that you have, preferably veal, adding the insides of the tomatoes,
    pepper and salt; pass this through the wire sieve. Make a_roux_—that is, melt
    some butter in a pan, adding flour little by little and stirring until it goes
    a brown color. Add to it then your tomatoes that have been through the sieve,
    and some fried mushrooms. Pour this sauce over the whole and serve very hot.


    > [_Mme. van Praet_


    # RED CABBAGE


    Mince the cabbage and put it in a pan with plenty of refined fat (clarified fat)
    and two three large potatoes, pepper and salt. Add sufficient water to cover it,
    with a dash of vinegar and six dessert—spoonful of brown or moist sugar. Let it
    simmer for four hours, drain it and serve cold.


    > [_Mme. Segers_


    # VEGETABLE SALAD


    The special point of this dish is that peas, beans, carrots in dice, are all cooked
    separately and when they are cold they are placed in a large dish without being
    mixed. Decorate with the hearts of lettuce round edge and with slices of tomato,
    and put over it, or with it, a good mayonnaise.


    > [_Mme. van Praet_


    # CHICORY'
  - '[PAGE 12]


    # PART I


    # 13


    This excellent vegetable can be dressed either in a beamel sauce, or with butter
    and lemon-juice. It is gently stirred, first of all, and it requires pepper and
    salt. The sauces can be varied with tomato, or with some of the good English bottled
    sauces stirred with the bechamel.


    > [_Mme. van Praet_]


    # CAULIFLOWER À LA REINE ELIZABETH


    Simmer the cauliflower till tender. Prepare a meat of veal and pork, and season
    it well with a little spice. Butter a mold and fill it with alternate layers of
    mince and cauliflower broken in small pieces. Fill a large saucepan three-quarters
    full of boiling water and place the mold in this; let it cook for one hour in
    this way over the fire; turn it out and pour a spinach sauce over it.


    > [_Mme. van Praet_]


    # MUSHROOMS À LA SPINETTE


    Make some pastry cases, wash and chop the mushrooms and toss them in butter to
    which you have added a slice of lemon. Make a beamel sauce with cream, or, failing
    that, with thick tinned cream, and mix with the mushrooms. Heat the cases for
    a few minutes in the oven and fill them with the hot sauce.


    > [_Mme. Spinette_]


    # DRESSED CAULIFLOWER


    Simmer a cauliflower till it is tender. Pour out the liquor, and add it to a bit
    of butter, the size of a nut, rolled in flour, a pinch of nutmeg, and a tablespoon
    of Gruyère cheese. At the moment of serving, pour the sauce over the cauliflower,
    which you have placed upright on a dish. The nutmeg and the cheese are indispensable
    to this dish.


    Bind the sauce with a little fecolina flour.


    > [_V. Verachtert_]


    # BRUSSELS SPROUTS


    (The best to cook them)


    Having cleaned and trimmed your sprouts, let them simmer in salted water, to which
    you have also added a little soda to preserve the color. Or, if you do not like
    to add soda, keep the pan firmly covered by the lid. When tender, take them out
    and let them dry, place them in another pan with a good loop of butter or fat;
    stir, so as to let the butter melt at once, and sprinkle in pepper and a tiny
    pinch of nutmeg.


    > [_Mddl. Germaine Verstraerte_]


    # RAGOUT OF MUTTON


    Fry the mutton very well. Place in another pan sufficient water to cover your
    mutton, adding pepper, salt, a little nutmeg, a celery, and a few turnips cut
    in pieces. When they are well cooked, add the meat and let all simmer for two
    hours.


    > [_V. Verachtert_]'
