    # PART I


    # STUFFED EGGS


    Hard-boil your eggs, allowing an egg for each person. Take the yolk. While they
    are boiling and afterwards cooling in water, make a small quantity of mayonnaise
    sauce. Peel the eggs, cut them through lengthways, and take out the yolks. Crumble
    them with a little chopped herbs, add the mayonnaise. Fill the eggs with this
    mixture, and place them in a dish with chopped lettuce round it, to which you
    may add a little more of the sauce.


    [_Mme. van Marcke de Lunessen_]


    # POACHED EGGS, TOMATO SAUCE


    Make some rounds of toast and butter; place on each a slice of tomato or ham.
    Keep these hot, and poach as many eggs as you require. Slip each egg on the toasts,
    and cover them quickly with a highly seasoned tomato sauce.


    [_Mme. van Marcke de Lunessen_]


    # EGGS AND MUSHROOMS


    Pick over half a pound of mushrooms, cut them in small pieces like dice, and put
    them to stew in the oven with plenty of butter, pepper, and salt. Make a thick
    sauce, and you may add it to the juice from the mushrooms when they are cooked;
    stir in the sauce. Take three hard-boiled eggs, and separate the yolks from whites.
    Put into a shallow vegetable—dish the whites cut up in small pieces, pour over
    them the beamel with the mushrooms, and finish up by sprinkling over the top the
    hard-boiled yolks, which you have crumbled up with a fork.


    [_Mme. Braconiere_]


    # BELGIAN EGGS


    Make some scrambled eggs, and place them on a very hot dish, and round them a
    thick tomato sauce. Decorate the dish quickly with rounds of tomato.


    # EGGS À LA RIBEUCOURT


    Put little paper cases, and let them dry in the oven. Put into one a pat of butter
    and let it melt lightly. Break an egg into each case, taking care not to break
    the yolk, and put a bit of butter on each yolk. Place in a quick oven until the
    whites are half soft. At the moment of serving them out, and have ready some minced
    tongue or ham, to sprinkle on them, and decorate with a big bit of truffle.


    # TO USE UP REMAINS OF MEAT


    Cut in slices of any cold meat, such as pork, beef, veal, or ham. Melt in a pan
    of salt butter the size of a walnut, and put it in an onion cut into slices; let
    it get brown in the hot. Another pan put a larger piece of butter rolled in a
    soup– plenty of flour; add it to the onion and butter, and add enough to prevent
    the sauce from getting very thick. And, if you wish it, a teaspoon of meat-extract
    and a pinch of salt. Have ready some potatoes, but let them be very light. Place
    the slices of meat in a fireproof dish, pour the sauce on them, the mashed potatoes,
    and put the dish in the oven, all well heated through. This is called in Belgium
    "un philosophie."


    [_Paquerette.]'
  - '[PAGE 29]


    # PART I


    # VEAL WITH ONIONS


    Take a lump of butter the size of an egg, and let it color in a saucepan. Slice
    some onions and fry them in another pan. When fried, add them to the butter with
    sliced carrots, a few small onions, and your pieces of veal, salt, and pepper.
    Add a small quantity of water, and close the lid on the saucepan. When the meat
    is tender, you can thicken the sauce with a little flour. This is a good way to
    use veal that is hard, or parts that are not the best.


    > [Paquerette.]


    # VEAL CAKE


    Mince very finely three pounds of raw veal—one-fourth pound of pork. It is better
    to do this at home than have it done at the butcher''s. Put two slices of beef
    to soak in milk, add two yolks of eggs and the whites, pepper and salt. Mix it
    well, working it for ten minutes. Then let it rest for half-an-hour. Put it in
    a small few, add a lump of butter the size of a pigeon''s egg, and put it in the
    oven. It will be ready to serve when the juice has ceased to run out.


    > [Paquerette _]


    # TO USE COLD MEAT


    Take a fresh celery, wash it, and remove the green leaves. Let it boil till half-cooked
    in salted water. Drain it on a sieve, and cut it into lengthways, and minced meat
    of any kind, well seasoned, between two pieces. Tie them together with a thread
    and let them cook again for a quarter of an hour, this either in the same water
    and gently simmered, or in the oven, a well-buttered dish. Other people, to avoid
    the trouble of tying the two halves, spread the mince on each half and cook it
    in the oven, laid flat in a fireproof dish. In this case put a good lump of butter
    on each portion of mince.


    > [L. Verhaaghe _]


    # FLESH CHARBONADE


    Put two onions to color in butter or in hot fat. Add them to the beef, which you
    have cut into pieces the size of a small cake. Let it cook for a few minutes,
    then add pepper, salt, carrot sliced, and enough water to allow the meat to cook
    gently by the side of the fire, allowing one and one-half hours for one and one-half
    pounds of meat. Ten minutes before serving add the small meat—or Liebig. You may
    be at the same time, if it is wished, cook potatoes with the meat for about twenty
    minutes. Serve it all in a large dish, the meat in the center and the potatoes
    around. The sauce is served separately, and without being passed through the sieve.


    > [L. Verhaaghe _]


    # A USE FOR COLD MUTTON


    Cut the meat into neat pieces, take away all fat and skin. Fry in butter and add
    all sorts of vegetables in it, with thyme, bay-leaves, and parsley. Let all this
    stew very gently for two hours; you may add more stock or water to prevent it
    getting dry. Keep the lid of the pan off, and half-an-hour before serving, put
    in peeled potatoes. This dish is served very liquid.


    > [Mme. Spinette]'
  - '[PAGE 30]


    # PART I


    # 31


    # FLEMSH CARBONADES


    Take four pounds of beef—there is a cut near the neck that is suitable for this
    recipe. Cut the neck in small pieces (square) and fry them in a pan. In another
    pan put a piece of refined fat and fry it in five big onions that you have finely
    chopped. When these were boiled brown, add them to the meat, sprinkling in some
    pepper, salt, mixed herbs. Cover all with water, and let it cook for an hour with
    the lid on. After an hour''s cooking, add half a glass of beer, a slice of crumb
    of bread with a light layer of mustard and three tablespoons of best vinegar.
    Let it cook again for three quarters of an hour. If the sauce is not thick enough,
    add a little flour, taking care that it boils upwards.


    # FISH


    When there remains any cold fish, take away all skin and bones, mashing the flesh
    with salt, butter, pepper, and one or two raw eggs as you wish. Take some smallproof
    cases and place in each one lemon—juice with a little minced butter and grated
    breadcrumbs. Bake the cases till the top of this is of a golden color.


    # REMAINS OF FISH


    Make a good white sauce, add pepper, salt, and a little nutmeg and juice of a
    lemon. Add then your remains of fish and a few pickled shrimps. Fill some shells
    with it and sprinkle over the top a powdery of grated Gruyère cheese. Lay a pat
    of butter in the middle of each shell and put them in the oven. When they are
    a colored golden brown, serve them decorated with parsley.


    > [_Mme. Lekent._]


    # GOOD RISSOLES


    Mince old meat, adding to a pound of one—half pound of fresh lean pork, a chopped
    shallot and parsley, salt, pepper, a little nutmeg, and bind with an egg, both
    yolk and white. Form into balls, dip in flour, color them in some butter, and
    when they are nicely brown pour them in the butter a little stock or meat-juice
    and water. Let them gently cook in it for ten minutes, and serve.


    > [_Mme. Lekent._]


    # CROQUETES OF BOILED MEAT


    I think that boiled meat when cold is neglected as being tasteless, but prepared
    as I will show you, it will deserve your approval.


    Mince your boiled meat and put it into a thick white sauce well-spiced with pepper,
    salt, and nutmeg, and let it remain for two hours. Then prepare your croquettes
    by rolling the mixture in egg and fine breadcrumbs. Put a piece of butter in the
    saucepan, sufficient to take all the croquettes, and let them brown in for about
    ten minutes. A white sauce served with them is a good addition.


    > [_Mille. A. Demulemeester._]


    # CARBONADES DONE WITH BEER


    Cut the meat into slices that are thinner than thick. Mince two big onions and
    fry them till brown; then fry the slices till they are colored on both sides.
    Pour on them first some beer, then a dash of vinegar, adding'
- md: '

    # PART I


    # 32


    thyme, pepper, and salt, and throw in also a slice of crust of bread, which you
    have spread with mustard. Let this all simmer for three hours.


    > _Mme. Segur_


    # WALLON ENTRÉE


    Make some toasted bread, either cut in rounds or in squares, and butter them.
    Cut some slices of salt beef, or better still, meat, and put them on; spread the
    meat with a good layer of grated cheese, and over place another piece of buttered
    toast of corresponding shape. Melt some butter in a small saucepan and fry the
    rounds until they are golden-brown.


    > _Mme. E. Maes_


    # SCRAPS OF MEAT


    Your scraps of meat must be small or roughly minced; add to them a little sausage-meat,
    about a quarter as much, and a slice of white crumb bread that you have dipped
    in water or milk, and well drained. If eggs are not too dear, add two eggs, mixing
    them with the meat. Place the dish in the oven for half-an-hour—but it must be
    a slow oven—and take care that the meat does not become dry.


    > _V. Verachert_


    # FRICADELLE


    For one pound of minced pork take one-and-half pounds of minced veal; cut three
    slices of white bread the thickness of nearly an inch, and crumble them up; two
    eggs, pepper and salt. Mix it all well, and place it it in the oven for half-an-hour.
    If you eat this hot, serve it with a gravy sauce. If you wish for a supper-dish,
    put salad under the meat.


    # CHICORY AND HAM WITH CHEESE SAUCE


    Cook the chicory gently in butter until they are done. Then take each one, and
    roll it in a slice of ham, and put them in a fireproof dish. Make a very good
    white sauce of flour and butter, milk, adding cheese to flavor it strongly, and
    the yolk of an egg. Pour this sauce over the chicory, and place the dish in the
    oven. Let it turn brownish, and serve it directly.


    > _Mme. Vandervalle_


    # CROQUETTES OF VEAL


    Make first of all a very thick sauce of flour, milk, and butter, not forgetting
    also salt and pepper; when it is very thick added Gruyère cheese, in the proportion
    of a heaped teaspoon of to a breakfast-cupful of sauce. Take it off the fire,
    and stir in all the juice of a lemon, and then the yolk of an egg. Let it get
    cold. Pence it finely your veal, or, indeed, any lean meat. Mix it well with the
    sauce, and make croquettes of it. Then roll each in the white of egg that you
    have left, and then in grated breadcrumbs, and fry in deep fat.


    > _Mme. Vandervalle_


    # ENTREE (CROQUE-MONSIEUR)


    # PART I


    # 33


    Cut out some rounds of crumb of bread, of equal size, with a tin cutter; or, failing,
    with a wine-glass. Butter all the rounds and sprinkle them with grated cheese—for
    preference with Gruyère. On half the number rounds place a bit of ham to the same
    size. Put a lump of butter of egg into a pan, and fry with the rounds in it, they
    become golden. When they are a nice color, place one dressed with cheese on a
    round dressed with ham, so as to have the golden bread both above and below. Serve
    them very hot, and garnished with parsley.


    [_E. Defouck._]


    # HOT-POT


    Before putting in your meat, cook in the water a celery, four leeks, two onions,
    turnips, two carrots; then add the meat, with pepper and salt, and stew gently
    for three hours. If you can put in a marrow–bone well, that will give the soup
    a delicious flavor.


    [_V. Verachtert._]


    # HOCHE POT


    One pound of fresh pork, one pound rump (flank) of beef, one pound rump of veal,
    two onions, celery, four leeks, two carrots, or three turnips, according to the
    size, a few Brussels sprouts, five or six potatoes, according to the number of
    persons. Let the water boil before putting in the meat, and cut all the vegetables
    in cubes of the same size, like cubes of sugar. Let simmer only, for three hours;
    it is delicious and makes a dinner.


    [_V. Verachtert._]


    # BOUCHEES À LA REINE


    Get some little squares from the pastry–cook of puff past, which are to be filled
    with sweetbread cut in dice. It is a good plan to heat the cakes before filling
    them.


    The filling mixture. Cook the sweetbreads in water with pepper and salt, till
    done, skin them and cut in dice. Prepare a good beamel sauce, seasoned with the
    juice of a lemon, and add to it a few mushrooms that have been fried in butter.
    Heat the dice of sweetbread in this sauce and fill the cases with it. Put them
    back in the oven to get hot.


    # HOCHE POT OF GHENT


    Clean two big carrots and cut them into small pieces, the same for two turnips,
    four leeks, wells in running water, two celeries, and a good green cabbage, using
    the pale leaves. Wash all these vegetables in well water, two or three times,
    and put them on the fire for one and one–half pints of water. Add salt, and let
    it for an hour. At the end of this time, add a good piece of pork weighing perhaps
    three pounds—for choice it be cutlets. You can also add a bit of pig’s trotter.
    Let it cook for another hour, taking care that the meat remains below the water.
    At the end of that time, half–hour before you wish to eat it, add potatoes to
    be three for each person. Watch the cooking so as to to see that the potatoes
    do not stick, and finish the seasoning with pepper and salt.


    [_Georges Kerckaert._]


    # CARBONADE OF FLANDERS


    # PART I


    # 34


    Cut your beef into small neat pieces. Mince some onions finely, for five or six
    people you would add two bay-leaves, two cloves, pepper, salt; simmer gently for
    three hours in water, and at the end of time, bind the sauce with cornflour. Some
    people like the sauce to be thickened instead with mustard.


    [_V. Verachtert._]


    # HEADLESS SPARROWS


    Take two pounds of beef, which must be lean and cut in slices. Cut your slices
    of beef in five inches by three. Put in the middle of each piece a little square
    of very bacon, a sprig of parsley, pepper and salt. Roll the slices and tie them
    round with a thread so that the seasoning remains inside. Melt in a pan a lump
    of butter of a very big egg. Let it get brown and then, after rolling the beef
    in flour, put them in the butter. Let it cook for five minutes, half a pint of
    water, let it simmer for two hours. Before serving, take great care to remove
    the threads.


    [_A Belgian Droitwich._]


    # MUTTON STEW


    Take two pounds of mutton, the breast or one of interior parts as well as prime
    cut. Put in earthenware pan of butter as big as an egg, and let it. Cut the mutton
    in pieces and let them color in the butter, adding salt and pepper, a few onions
    or shallots. When all are colored, add a pint of turnips, cut in slices, with
    a pint of water. When cooked, take out the pieces, the and, so as to make a uniform
    mixture; then place the meat on the top of the mixture, and serve it. N.B. It
    is necessary to watch the cooking of this dish carefully, so that you add a little
    water whenever it becomes necessary, for if one leaves the preparation a little
    dry it drops quickly.


    [_A Belgian Droitwich._]


    # HOCHE POT GANTOIS


    (For eight or nine persons)


    Take one pound beef, one pound pork, and one pound mutton; cut into pieces about
    three inches by two, let it boil, and skin. Take two carrots, one large turnip,
    one head of celery, or four leeks, a good green cabbage, cut in four, other vegetables
    into pieces of moderate size, not too small; put them in the meat, and see that
    they are covered by the water. Let it boil for three to four hours, and then quarters
    of an hour before dish, add some potatoes in pieces.


    To dish: Place the meat in the center of a flat dish, and the vegetables around;
    serve the liquid in a soup-tureen. This dish should be eaten out of soup plates,
    as it is soup and meat at one time.


    # CHINESE CORKS


    Make a white sauce, and when it has grown a little cold, add the yolk of one egg,
    and a few drops of lemon-juice. Sprinkle in a slice of stale bread, and grated
    cheese to flavor it strongly, and leave it to cool for two hours. Shape into small
    pieces like corks, dip them into the beaten whites of your egg, and into grated
    breadcrumbs. Have ready some hot, fat, or lard, and fry the cheese-balls in it
    till they are golden.

