    既然你的餐厅家具是早期英式风格的，没有理由让烹饪也变成早期英式风格。而且它无疑会如此，除非在细节上出大差错。


    让我们假设晚上 7:30，你的丈夫打来电话，说他将带一个朋友在 8 点来用餐。让我们假设他比比常更加鲁莽。他在 7:15 到达，带着一个朋友：你察觉到了那个未说明的推论——晚餐必须比比常的更好。在瞬间的惊讶中，展现出你最好的一面（那种寡妇遗孀练习过的从容），说：“我很高兴你们能这样过来；你们介意在
    8 点或者 8 点一刻之后用餐吗？”然后拿着手中的书把厨师支开。


    我认为你认为她是家里的初级合伙人，你当然是高级合伙人，你丈夫是其中的睡眠合伙人。家里还有什么可以多出一道菜呢？我打赌整套系统和根火柴，保证你会在这些页中找到适合的食谱。一块冷牛肉，着眼未来，会演变成一种奶油般的白色美味享受，在口中融化；一个刚下的蛋，水煮在顶部，全部盛在瓷壳里。如果你完全没有肉，就必须用鱼类和蔬菜来掩饰你的朋友。


    你听过法国格尔特青的故事：


    > “唉，安妮特，我有几位先生要用餐，我们家里没肉了。该怎么办？”


    > “啊！夫人”


    但对于现在，我更倾向于建议如果要在过程中掩盖任何缺陷，就让这些绅士自己聊起来，这样他们的注意力就会被吸引。


    如果一道菜经过装饰，就能消除那种现做的感觉，而且除了欧芹，还有很多装饰元素。可以使用甜菜根、切成块的萝卜、胡萝卜、碎酸黄、切开的蛋；对于甜点，除了常用的渍樱桃和香草，你还可以柠檬皮、切尖或切碎的杏仁、去核切半的李子、草莓、橘子块。有句俗话：


    把鞋擦亮，尽管有些已经破了，


    而一个非常简单的巧克力可以通过在中心装饰一簇切尖杏仁变得吸引人，周围围着一圈剥好皮的橘子，像许多时候那样一个接一个。没有什么东西是如此微小不足，却具有巨大可能性的。达尔文曾从鸟脚的一块土里变出八十幼苗吗？


    遗憾的是塞缪尔·约翰逊没有写下他构思的那本手册。“先生，”他说，“我可以写出一本比写过的任何书都好的烹饪书。它应该是一本关于哲学原理的书。”


    也许舰队街的外装让他想起了斯斯巴达人的黑汤，那种饱腹的狄奥尼索斯认为极度难喝的汤；那个暴君被告诉，如果没有疲劳和饥饿的调味，那汤确实什么都不是。我们不希望一顿饭缓解他的压力，所以极端饥饿的影响——它必须有其自身的独特本质，它必须以易于吸收的形式呈现出来。


    无论如何，我相信这个小集（由我们比利时朋友的热心组成）能创造奇迹；因为现在的奇迹有很多，尽管并非由那些认为事情会自然发生的浪漫灵魂所创造。好的晚餐当然不会，我用这对对联结束：


    一个温柔的女人和一个胖的女人，让国王和农夫留在家。


    其含义是，如果你想让一个男人留在家，你必须顺着他，并且不能让他吃晚餐。


    ## 幸运先生。


    ## 前菜

    （盐鲱配蛋乃酱）


    取一些盐鲱鱼，每人一条，在水中浸泡一天。去皮，纵切开，取出脊骨，放入醋中浸泡一天。在上菜前，让它们在牛奶中放置几分钟，放在盘子里，淋上上好的蛋乃滋酱。


    [Delhaye 夫人]


    ## 胡萝卜汤


    洗并刮去一磅胡萝卜，切片；两个中等大小土豆同样处理，加入一片月叶、一束百香和一个切碎的洋葱。用水、盐、胡椒一起煮直到变软，然后通过筛网。在锅里放入鸡蛋大小的黄油，加入切碎的韭葱和一枝香芹。煮三四四分钟，然后倒入胡萝卜泥，让其全部沸腾后离火上桌。


    [Stoppers 夫人]


    ## 酸模草汤


    取一夸的高汤或肉提取物。黄油中煎一个胡萝卜、一个萝卜、一个洋葱、一个小卷甘菜（全部洗净并切碎），加入半茶匙芥末。将汤下锅，火煮二十分钟，加入你任何想要的调料和再多一点水，再慢煮半小时。切碎一点罗勒或马郁兰草，加入一把洗净的酸模草，丢进去煮五分钟，撇去浮沫，倒入汤碗中上菜。


    ## 奥斯滕丹汤


    不同的酒店里这种汤有许多品种，但它是一种白汤，由鱼肉制成并过滤，返回锅中，在上菜前加入大量奶油和生蚝。加入奶油后绝不能煮沸。通常加少许肉豆，但不加洋葱或小洋葱。一种简单的做法是用面粉和牛奶代替奶油，加入鱼汁和生蚝汁，最后时刻加入打散的蛋液。


    [Esperance]


    ## 另一种酸模草汤


    取一夸的高汤或肉提取物。黄油中煎一个胡萝卜、一个萝卜、一个洋葱、一个小卷甘菜（全部洗净并切碎），加入半茶匙芥末。将你的汤下锅，开火煮二十分钟，加入你任何想要的调料和再多一点水，再慢煮半小时。切碎一点罗勒或马郁兰草，加入一把洗净的酸模草，丢进去煮五分钟，撇去浮沫，倒入汤碗中上菜。


    [Esperance]


    ## 快速汤


    向一夸沸水中丢入四勺粗米粉，使米粒分离。慢煮四十分钟，加胡椒和盐。取出汤碗，放入一个蛋黄和一点黄油。快速淋入粗米粉上菜。


    [Esperance]


    ## 法式苦笋


    在盐水中煮一些苦笋直到变软。取出中心的叶子，在底部留下一圈整齐的叶子。去掉一些心。在黄油中蒸熟一些豌豆，然后将其混合入奶油中，将苦笋和豌豆放入中心，尽力而。这道菜并不需要奶油，但苦笋和豌豆必须是嫩的。


    [感谢厨]


    ## 蔬菜沙拉


    有时有几根韭葱、一个花椰菜、一把豌豆和豆角。与其直接用这些蔬菜（它们有收敛味）不如，将它们轻轻煮，冷后用上好的沙拉酱拌。如果能加一个蛋黄会更好。任何冷肉配上这种菜都会得到提升。适合做咖喱的蔬菜有切块的大芦瓜、萝卜、防豆根。


    [Marguerite Leblanc]


    ## 惊喜土豆


    土豆烤好后，十五分钟即可准备并煮好这种美味的酱汁。三个大小对称的大土豆，洗净并烤好；切开并取出内部但不弄坏皮。火上融化半司黄油，然后加入通过筛的土豆泥、一茶匙帕玛森芝士、胡椒、盐和一汤牛奶。拌入一个蛋黄，放入打好的蛋白。将混合物填入空的土豆皮，在十到十二分钟内应当膨胀。


    ## 爱德华·格爵式西茄


    取一些优质结实的西茄，未成熟。将柄朝上，用利刀切开顶部。用茶匙取出内部。每个西茄中打破一个蛋，撒上胡椒和盐。将西茄内部通过细筛，变成浓稠的液体；将其与面包屑、盐、胡椒和一些碎芝士混合。将这种混合物放在每个蛋上面，放入烤箱烤三四分钟，直到蛋恰好凝固，不再久。


    [匿名朋友]


