    # LIMPENS CHEESE


    Take a roll, cutting it in slices, remove the crusts to that round of crumbs remain.
    Butter each slice, and cover it with grated cheese, building up the slices one
    on the top of the other. Boil a cupful of milk, with pepper, salt, and a little
    nutmeg; when boiled, pour it over the bread until it is soaked. Put them in the
    oven, for quarter of an hour, according to the heat of the oven and the quantity
    you have. You must pour its juice over it every now and then, and when the top
    is turning into a crust, serve it.


    [_Mme. Limpens,_]


    # CHEESE SOUFFLE


    Take two good-spoons of flour, and mix it with half a teaspoonful of milk; melt
    a lump of butter, the size of a fibert, and add enough cheese to your taste, and
    the yolks of four eggs. Add at the last the whites of the four eggs, beat stiffly;
    pepper and salt. Beat a little, put in your mixture, and let it cook for one hour
    in a saucepan, surrounded by boiling water, and let turn out the soufflé, and
    serve with a mushroom sauce. The sauce is a good white sauce, to which you add
    already cooked mushrooms. Clean them from all, chop them and cook them tender
    in butter; and their own juice; then throw them into the sauce, and pour over
    your soufflé.


    [_Mme. Vandervelle,_]


    # CHEESE CROQUETTES


    Make a thick beamel sauce, and be sure that you cook it for ten minutes, constantly
    stirring. Add, till well flavored, some Gruyère and Parmesan cheese, mixed and
    grated. Let it get cold. Roll this mixture into the shape of carrots; roll them
    in finely-graded breadcrumbs, and fry them in hot lard or refined fat. Lay them
    on a hot dish, and the thicker at the end of each carrot stick in a sprig of parsley
    to look like the stalk.


    [_Mme. van Varcke de Lunessen,_]


    # CHEESE FONDANTS


    For twelve fondants make a white sauce with two soupspoons of flour and milk.
    Add it to the yolks of three eggs. Stir in four ounces of finely Gruyère cheese,
    and Parmesan, grated very finely. Add at the end of the eggs of half a lemon,
    and a dust of cayenne. Let it get all cold. Make little balls with this paste
    and roll them in breadcrumbs. Throw them in a pan of boiling fat, where they must
    remain till they are a good golden color. Drain them, keeping them hot, and serve
    quickly.


    [_Madame Emelie Jones,_]


    # CHEESE SOUFFLE


    Grate a pound of Gruyère cheese. Mix in a cup of milk a dessert–spoonful of flour;
    beat four eggs, and add first the cheese, and then the flour and milk mixture.
    Season with pepper and salt, and put all into a mold. Let it cook in a saucepan
    of boiling water for an hour and a half. Then at the end of this time put it in
    the oven for a half hour.


    [_Madame Emelie Jones._]'
