    [_林彭斯夫人，_]


    # 林彭斯式奶士面包


    取一根面包，切成薄片，去掉外皮，留下圆形的面包芯。在每片上涂上黄油，撒上切碎的奶士，将面包片层层堆叠起来。煮沸一杯牛奶，加入胡椒、盐和少许肉豆蔻；煮沸后，淋在面包上直到完全浸透。放入烤箱，根据烤箱温度和你的分量烤15分钟。必须不时为其淋上汤汁，当顶部变成焦壳时，即可上菜。


    [_林彭斯夫人，_]


    # 奶士舒芙蕾


    取两大汤匙面粉，与半茶匙牛奶混合；融化一块如鱼排大小的黄油，并根据口味加入足量的奶士，以及四个鸡蛋的蛋黄。最后加入四个鸡蛋的蛋白，用力打发至硬性；加胡椒和盐。稍稍搅拌，加入混合物中，放入锅中，周围用沸水隔水煮一小时，然后倒出舒芙蕾，配蘑菇酱食用。酱汁是一种良好的白酱，其中加入已煮好的蘑菇。将蘑菇彻底洗净，切碎并用黄油炒至软；连同其自身的汁水一起倒入酱汁中，然后淋在你的舒芙蕾上。


    [_范德维尔夫人，_]


    # 奶士炸丸


    制作浓稠的贝沙麦酱（beamel sauce），确保不断搅拌烹煮10分钟。加入混合并切碎的格鲁耶奶士和帕玛森奶士，直到调味适中。放凉。将此混合物揉成胡萝卜状；裹上细碎的包屑，在热猪油或精炼植物油中炸酥。放在热盘中，在每根胡萝卜状的末端较厚处插上一小枝欧芹，看起来像茎梗。


    [_范瓦尔克·德伦内森夫人，_]


    # 奶士流心饼


    制作12个流心饼，用两汤匙面粉和牛奶做成一个白酱。将其加入三个鸡蛋的蛋黄中。拌入4盎司细碎的格鲁耶奶士和帕玛森奶士。最后加入半个柠檬的汁和一撮辣椒粉。彻底冷却。用这种面糊搓成小球，并裹上包屑。投入有沸油的锅中，炸直到呈现良好的金黄色。沥干保持温热，快速上菜。


    [_艾梅莉·琼斯夫人，_]


    # 奶士舒芙蕾


    擦碎一磅格鲁耶奶士。在一杯牛奶中混合一甜汤匙面粉；打散四个鸡蛋，先加入奶士，再加入面粉牛奶混合液。用胡椒和盐调味，全部放入模具中。在满沸水的锅中隔水煮一半小时。在时间结束时，将其放入烤箱烤半小时。


    [_艾梅莉·琼斯夫人。_]


    # 第一部分


    # 土豆与奶士料理


    洗净一些生土豆，去皮，切成薄圆片。取一个可以进烤箱的盘和一个上桌用的漂亮盘子，在里面铺上一层豆片，撒上胡椒、盐、少许面粉和大量的切碎格鲁耶奶士。继续这种方式层叠，最后以一层奶士和少许面粉结尾。将盘放入烤箱（烤箱不要过热），用火慢炖。


    对于中型派盘，你会发现半小时足以煮熟土豆。


    > 艾梅莉·琼斯夫人。


    # 火腿、脑花配马德拉拉酒酱


    在双层锅（水浴法）中加热火腿。煮熟脑花，焯水后用一些黄油煎。


    取面粉并融化制成浓稠酱，加入一杯水和马德拉拉酒，这会让你的酱汁变褐。在黄油中煎半磅蘑菇，变色后将蘑菇和汁加入酱汁中，并淋上优质马德拉拉酒或雪莉酒提味。将火腿放在盘子中间，周围环绕脑花，淋上马德拉拉酒酱。


    > [范德维尔夫人（注：此处原文应为马德拉拉酱，此处标注为范德维尔夫人）]


    # 马德拉拉酒酱配火腿


    煮一些意大利面或意大利心面，加盐和胡椒。制作一种褐色酱，这道菜需要大量的酱，因此在酱汁（roux）中加入一些番茄泥（炖熟并过滤）、少许肉提取物、一些炒过的蘑菇、几滴优质白地兰酒或根据口味调味。让你的火腿片浸在酱汁中，准备好后，将它们放在平盘中间，周围摆上蘑菇或意大利面，将热的酱汁淋在火腿上。


    > [斯皮内特夫人。_]


    # 困难的煎蛋


    这终归底只是煎蛋！锅里加一些油；如果不用黄油，用油是最好的。当蓝色蒸汽升起时，温度就足够了。将一个蛋打入平盘，手柄侧倾斜煎锅，让蛋滑进去，然后用木勺将蛋翻过来；即在它滑入锅时先翻，再把蛋白翻到蛋黄上。如果你搞不定，让蛋加热几秒，一旦煎好就让它沥干并在火旁温热。全部完成后，将它们围成圆放在盘子里，淋上非常热的酱汁，可以是番茄制的，也可以是醋和芥末调味的。


    # 乡村煎蛋


    制作混合洋葱的浓稠物，就像在英国吃的那样，配羊腿肉吃。不要忘了蔬菜（此处指葱）的调味。做一堆土豆泥，让酱汁在火旁静置（同时煮熟六个鸡蛋），去壳，将酱汁倒入土豆中，趁热食用。


    # 第一部分


    # 法式煎蛋


    将一个鸡蛋大小的黄油放入耐火盘中，拌入面包屑、切碎的葱、三个番茄的瓤、胡椒和盐。放入烤箱烤三四分钟，加入蛋黄，让蛋士酱凝固。然后根据你喜欢的量，在蛋士酱凝固后，取出盘子，在这些蛋士酱顶部淋上煎蛋。我曾见过这道菜淋上热的萨拉内特（注：此处原文可能指某种酱汁），并立即食用。


    # 欧斯特兰式蛋料理


    （致埃德华爵士）


    用优质的肉汁慢火煮一些新鲜豌豆；当肉汁浓缩时，加入黄油。如果不用奶油，用牛奶代替并拌入蛋黄。使用时，撒一撮糖和切碎的欧芹。


    # 纸盒蛋料理


    取一根欧斯特兰萝卜，像常一样浸泡在水中，用一些优质高汤煮熟。冷却后，将肉切成小丁丁；加入等量的火腿和切成同样大小的熟鸡蛋蛋白。


    用奶油、少许柠檬汁、胡椒和盐做的优质白酱浸润内料。小纸盒周围围上一圈约四分之一厚的奶士；用小匙小心放入内料即可。将内料填充至边缘处，并用如下比利时旗进行装饰：


    用胶胶、醋和少许雪德拉酒制作一些胶冻。用辣椒粉或红色胭脂染一部分；第二部分加入滤过的熟鸡蛋蛋黄，其余部分腌渍核桃（也滤过大筛）。将胶冻倒入带有直壁的小模具中；冷却后脱模，切成合适的大小的块。如果你做了太多芦笋，它可以装饰夜晚的冷菜或沙拉。


    > [_玛格丽特·斯特劳尔，或 A·斯特劳特夫人，]


    # 法式式胡萝卜


    取一些胡萝卜，像对待婴儿一样温柔地洗净并刷洗，然后加胡椒和盐慢火煮软。煮熟后，将它们推到火的一侧，倒入一些奶油制作优质酱汁。如果不用奶油，用牛奶代替并拌入蛋黄。使用时，撒一撮糖和切碎的欧芹。


