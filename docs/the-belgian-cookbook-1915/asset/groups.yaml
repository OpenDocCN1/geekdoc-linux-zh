    Take two pigeons, two cabbages, four slices of fried bacon, an ounce of butter,
    a large wineglass of sherry, and some gravy. Press your pigeons and cook them
    in for ten minutes in a fireproof dish. Then them out, cut them into neat pieces.
    Meanwhile have the cabbages boiled in salted water. Drain them. Cut them in small
    pieces and roll up each slice of cabbage; lay the pigeons on top, pouring over
    them the liquor put all in the oven for ten minutes—pour the rest of the wine
    and leave for another ten minutes before serving. If you have stock to add to
    this is an improvement, or put half teaspoon of meat to extract half a pint of
    water.


    [_Une refugee. _]


    # REMAINS OF SAUSAGE


    If you have a few inches of a big sausage cut it into as thick slices as you can—fry
    them and lay them in a circle on a dish with a poached egg. Little dinner breads
    are good when soaked in milk, stuffed with sausage meat, and fried. It can be
    used to stuff cucumber, or eggplants, but you should crumble the meat and bind
    it with the yolk of a raw egg.


    [_Mme. Georgette., _]


    # SHOULDER OF LAMB A LA BEIGE'
  - '[PAGE 54]


    # PART II


    # 55


    Braise your shoulder of lamb; that is, put it in a closely covered stewpan, in
    a brown sauce or gravy for the vegetables, to be served with it. It is the lid
    closed that makes the meat take some flavor from the vegetables. To do it in the
    Belgian way take some good white turnips, wash and scrape them, put some in whole,
    large ones cut in half. Take some cabbages, trim off leaves, cut them in half,
    remove the stalk, make a hollow in the center and fill it with forcement of any
    kind; but sausage meat is good. Place the stuffed cabbages around the meat to
    cook gently at the same time.


    > [_Madame Versagen._]


    # FILLET OF BEEF À LA BRABANCONNE


    Take a whole fillet of beef, trim neatly and set it in a braising pan to cook
    very slowly in some good brown sauce to which you have added a pint of stock.
    Put in neatly shaped carrots and turnips and some balls made of mashed potato
    fried. Keep hot in two sauceboats of Brussels sprouts and a puree of onions. These
    are prepared by cooking the vegetables in water, then chopping fine, and rubbing
    them through a sieve with cream, or with a little milk, pepper, and salt. To serve
    the fillet, lay it on a dish with the carrots and turnip, potato cakes round;
    pour over it the rest of the brown sauce from the pan; then add in heaps onion
    puree and the sprouts puree.


    > [_Madame Versagen._]


    # STEWED BEEF


    An interior part of beef may be to taste excellent if it is braised; that is,
    simmered with the cover on slowly, in company with onions (already fried) and
    well washed pieces of carrots and whole turnips. Put on also small cabbage cuts
    in halves, and if you can give it, a glass of good red wine.


    > [_Une refugee._]


    # BEEF AND APRICOTS


    Stew your beef, say three pounds of steak, in some gravy, adding to a pint of
    liquor a le level teaspoonful of white sugar. Throw in a handful of the dried
    apricots, but be sure you wash them first. This dish is generally accompanied
    by leeks, first blanced for a few moments, and then put in the stew. Flavor with
    salt, pepper, and the half of a lemon remove before you serve the stew. For English
    taste the sugar could be omitted.


    > [_Seulette._]


    # FOR AN INVALID


    This must be at least three hours before it will be required. Take two ounces
    of pearl barley, wash it well, and put it in cold water for an hour. Take a pound
    of good steak, shred it in small pieces, and put it in an enam saucepan with a
    quart of cold water and a sprinkle of salt. Strain the water from the barley and
    add this to the meat, and let it simmer for two hours. Then off the meat and barley
    in a mortar, rub it through a sieve; it is a smooth puree put back into the pan
    with its liquor and a gravy of cream. Let it simmer again for a moment and serve
    it in a cup with a lid to it.


    > [_Madame A. F._]


    # INVALIDS'' EGGS'
