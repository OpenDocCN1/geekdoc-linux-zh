    in orange curaçao for as long as you have at your disposal. Then replace each
    stone by a blanced almond, and place the prunes in small crystal dishes.


    [_Pour la Patrie._]


    # MADELINE CHERRIES


    Take some Madeleine cakes and scoop them out to form baskets. Fill these with
    stoned cherries both white and black that you have soaked in a good liqueur—cherry
    brandy is the best but you may use maraschino. Place two stalks of Angelica across
    the top and where these intersect a very fine stoned cherry.


    [_Pour la Patrie._]


    # STRAWBERRY TARTLETS'
  - '[PAGE 57]


    # PART II


    # 58


    It often happens that you have among the strawberries a quantity that are not
    good enough to be table as dessert, and yet not enough to make jam of. Put these
    strawberries on heat, with some brown sugar, and use them to fill small pastry
    tarts. Pastry cases can be bought for very little the confectioner''s. Cover the
    top of the tartlet with the strawberry conserve is with whipped cream.


    [_Pour la Patric_]


    # MADEIRA EGGS OR OEUFS À LA GRAND-MÈRE


    Break the yolk of an egg in a basin and be that it is very fresh; beat it up,
    adding a little powdered sugar, and then, drop by drop, of the best Madeira to
    give it a strong flavor. This makes a nice sweet served in glass cups and it is
    besides good for sore throats.


    [_Pour la Patric_]


    # BUTTERFLIES


    You will get at the confectioner''s small round cakes that are smooth on the top:
    they are plain, and are about two and one—half inches across. Take one and cut
    it in halves, separating the top from the bottom. Cut the pieces right away; you
    have no half moons. Put some honey along the straight edge of each half moon and
    stick it by that the lower piece of cake, a side to side. Do the same with the
    second half moon, so that they stick up, unlike wings. Fill the space between
    with a mixture of almonds rolled in honey, and place two strips of angelica pointing
    forward to suggest antennae. A good nougat will answer instead of the honey.


    [_Pour la Patrie]


    # CHERRY AND STRAWBERRY COMPOTE


    Take half pint of rich cream and mix it with a small glassy of Madeira wine or
    of good brandy. Pick over some fine cherries and strawberries, stoning the cherries,
    and taking out the little center of each strawberry that is attached to the stalk.
    Lay your fruit in a shallow dish and serve it with the long sponge biscuits known
    as "langues de chat" (Savoy fingers).


    [_Amitie aux Anglais._]


    # CHOCOLATE CUSTARD


    To make a nice sweet in a few minutes can be easily managed if you follow this
    recipe. A custard of cream milk and yolks of eggs, sweet with sugar, vanilla and,
    if you have a little cream to add also. Then grate down of the best chocolate,
    as finely as you can, rub it through muslin so that it is a fine powder. Stir
    this with your custard, always stirring so that no bubbles of air get in. When
    you have got a thick consistency like rich cream, pour the mixture into pore or
    china cases, sprinkle over the tops with chopped almonds. There is no cooking
    required.


    # GOOSEBERRY CREAM WITHOUT CREAM


    Take your blueberries and wash them well, cut off the stem and the bark of each.
    Stew with sugar until they are tender, just in water. Do not let them burn. If
    you have not time to attend to them in the oven in a shallow dish sprinkled with
    sugar. When tender rub them through a sieve at twice. Flavor with a few drops
    of lemon juice, and add sugar if required. Then beat up a fresh egg in milk and
    add as much beetroot or cornflour as will lie flat in a salt spoon. Mix the custard
    with the gooseberries, pass'
