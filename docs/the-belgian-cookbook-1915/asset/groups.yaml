    # 第二部分


    # 53


    如果你只有一小块小牛肉肉或其他冷肉，可以用以下方法做出一道非常体面的菜肴：切一片肉片，在肉片的每一面涂上一层土豆泥，泥中已加入一些番茄酱。打一个鸡蛋，将肉片和土豆泥入蛋液中，裹上细面包屑，在大量的油中煎至金色。将这道菜盛好后用桌布遮盖即可。


    [_为了法国祖国._]


    # 炖牛肉


    如果你被迫急着做道热菜且只有一块次等肉，那么没有比用布拉班特（Brabant）式做法更好的方法了，这种做法相当昂贵。清洗并煮好一些蘑菇，在轻煎后，将它们和汤汁加入切成小块的牛肉中（不要切成碎）。加入胡椒、盐、香料粉，或一个带三四瓣大蒜的洋葱，以及半瓶红酒。一起炖至少二十分钟，取出洋葱和大蒜，装在之前烹饪牛肉的陶锅中食用。


    [_为了法国祖国._]


    # 羊肉沙拉


    切几片冷羊肉或羊羔肉，去除所有能去的脂肪和皮，除非这会破坏肉片的紧实度。准备一份生菜沙拉，如果你无法制作蛋黄酱，就在生菜中加入切片黄瓜，因为这可以保持羊肉的湿润。将沙拉放在肉片上，并将肉尽可能紧紧地卷起来。将肉卷一起放在一个盘子里，在上面淋上极量的沙拉调料。这种处理肉的方法非常适合去野餐或长途旅行时携带。


    [_为了法国祖国._]


    # 香肠饼


    半磅你喜欢的任何品种香肠。做一些圆饼状的面团，将肉放在每个圆饼的一半处并折叠起来。蒸十五钟，或在大量的肉汁中炖煮。


    [_为了法国祖国._]


    # 香肠配土豆


    将一些煮好的香肠裹在土豆泥里，每人做一卷。在土豆上刷上牛奶，烤至漂亮的金黄色。在每卷土豆上用酸黄瓜装饰。


    # 冷肉肉烩


    取你现有的任何冷肉，去除脂肪和皮，切成像五分币大小的圆片。如果你有一些瘦熏根或火腿，也应该加入一点。我应该告诉你们先在锅里用面粉和黄油做酱汁，如果你有肉汁就加入，如果没有，用等量的水和醋代替；用胡椒、盐和一小勺鱼鲱鱼汁调味。当酱汁加热时，放入肉并盖上锅，让全部加热十二分钟，然后将米饭和酱汁放在盘子中央。此时米饭可能已经变软了。沥干水分，将其作为炖菜的边框。


    # 第二部分


    # 54


    [_艾米., _]


    # 快速炖肉菜


    在炖肉锅中放入一块黄油，加入一个切块的洋葱、几瓣大蒜、盐和胡椒、一汤匙碎欧芹，如果你有一些好的肉汁或肉汤和水，也加进去。将冷肉丢入酱汁中（最好是生肉），在炖了十五钟后，取半个洋葱，用它擦一下将要用的盘底。取一杯好的红酒（如勃艮红），与鸡蛋蛋黄混合，将其搅拌入炖锅中，几分钟后即可上菜。


    [_格鲁贝夫人., _]


    # 牛肉弹


    取一个耐火盘，在撒上面包包屑后，铺一层烤好的牛肉片、一层土豆泥、一层牛肉肾脏（切成块），最后铺一层土豆。用加入了刨碎奶酪的贝夏梅尔酱（béamel sauce）覆盖全部；放入烤箱烘烤。然后用你现有的任何牛肉或肾肉汁制作一种褐汁，在其中用胡椒和盐煮一些蘑菇；酱汁与肉肉弹一同食用。


    # 高锅烩（HOCHEP POT）


    切片洋葱并在黄油中煎至棕色；加入去掉了脂肪和皮的猪肉和羊肉块；加水没并加入你有的各种蔬菜；特别是切片的胡萝卜和绿甘蓝；放入烤箱中煮。在另一个锅里煮一些白芸豆，加盐和胡椒，直到变软，然后将它们连同少量煮豆水一起加入炖锅中。


    # 鸽子卷甘菜卷


    取两只鸽子、两棵甘蓝、四片煎培根、一盎司黄油、一大酒杯雪莉酒和一些肉汁。压扁你的鸽子，在耐火盘中煮十分钟。将其取出，切成整齐的块。同时，将甘蓝放入盐水中煮熟。沥干。将甘蓝切成小块并将每片甘蓝卷起来；将鸽子放在上面，淋上煮肉的汁水，全部放入烤箱中十分钟——最后淋入剩下的酒，再静置十分钟后上菜。如果你有高汤加入其中效果会更佳，或者用半茶匙肉提取物浸泡半品脱水。


    [_一名难民. _]


    # 香肠剩余


    如果你有几英寸长的大香肠，将其切成尽可能厚的片——煎熟并放在一个有少量黄油的盘子里摆成圆圈。这是一道很好的菜肴，配一个蛋黄食用。


    [_乔热特., _]


    # 第二部分


    # 55


    # 贝奇式羊肩肉


    慢炖你的羊肩肉，即放入一个密封的炖锅中，在肉汁中。取一磅好的牛肉，切成碎末，放入平底锅，加入一夸冷水和一许盐。滤出豆水并加入肉中，炖二十分钟。然后将肉和豆子放入研臼中，通过筛网制成平滑的泥，放回锅中加入其汤汁和奶油酱。


    [_难民夫人._]


    # 布拉班特式菲力牛


    取一整块菲力牛，修剪整齐，放入煎锅，放入加入了一品高汤的褐汁中煮。食用时，将菲力牛放在盘子里，配上胡萝卜和土豆饼；将锅中剩下的酱汁淋在上面；然后加入洋葱泥和嫩芽泥。


    # 炖牛肉


    牛肉的内里（interior part）如果是炖出来的，味道会极佳；即在盖上盖子的情况下慢炖，配上煎过的洋葱和洗净的萝卜。再加入一些切半的小甘蓝，如果可以的话，加一杯红酒。


    [_一名难民._]


    # 牛肉配杏仁


    将你的牛肉（比如三磅牛排）用肉汁炖煮，向一品汤中加入一平匙白糖。丢入一把干杏仁，但确保先洗过它们。这道菜通常配有葱，先焯几分钟，然后放入炖锅中。用盐、胡椒和半个柠檬调味，上菜前取出柠檬。对于英式口味，可以省略糖。


    [_苏莱特._]


    # 病人专用


    这道菜必须提前三小时准备。取两盎司珍珠大麦，洗净放入冷水中浸泡一小时。取一磅好的牛肉，切成碎末，放入平底锅，加入一夸冷水和一许盐。滤出豆水并加入肉中，炖二小时。然后将肉和豆子放入研臼中，通过筛网制成平滑的泥，放回锅中加入其汤汁和奶油酱。再次炖片刻，盛在带盖的杯中即可。


    [_A. F.夫人._]


    # 病人蛋


