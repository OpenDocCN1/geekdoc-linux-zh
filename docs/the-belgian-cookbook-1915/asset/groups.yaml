    # BEEF SQUARES


    If you have a small piece of very good beef, as rump or fillet of beef, it is
    more economical to cut it into squares, and grill it at a clear fire. Have some
    squares of toast, buttered and hot, lay these on a hot dish with a bit of steak
    on the top, and on top of that a slice of tomato mashed and salted and a pile
    of horse-radish. This makes a pretty dish and can be varied by using capers or
    chopped gherkins instead of horse-radish. It is a great saving to cut meat, bread,
    etc., in squares instead of rounds.


    [_Une amie au convent._]


    # IMITATION CUTLETS


    A dish that I love for those who like curry flavoring is the following. Take any
    cold cooked vegetables, and cutting them in small pieces, roll them in a thick
    sauce which you have strongly flavored with curry. Put it aside to get firm. If
    you are in a hurry you can bind with the yolk of an egg in the flour and make
    a thicker batter in way. Form into cutlets and fry as you would a real cutlet.
    The same thing can be done with macaroni or spaghetti that is already cooked,
    cold fish or anything that is insipid to the taste.


    [_Une amie au convent._]'
  - '[PAGE 51]


    # PART II


    # KIDNEYS WITH MADEIRA


    Use either sheep or pigs'' kidneys. Cut them longways, so as to be able to take
    out the threads from the inside of them. Put some butter to fry over a brisk fire
    and when it is browned, not burnt, put in the kidneys for three or four minutes.
    Take them out and keep them hot for a while you add to the butter we cooked in
    a spoonful of Madeira wine, a dust of chopped parsley, a little cayenne pepper
    and salt. Mix it, and if then add a little gravy. Pour the sauce over the kidneys
    and finish with a powdering of chopped parsley. Fried potatoes are eaten with
    this.


    [Mme. Vanderbilt Genotte_]


    # PIGS'' TROTTERS IN BLANQUETTE


    Any part of pork or veal is done in this way. Take your pieces of meat and fry
    them in butter until they are a golden brown color. Put them in a pan, covering
    them with water, and adding a sliced onion, a bay leaf, a carrot, a leek, pepper,
    salt—let all simmer gently a slow fire until the meat is cooked not boiled. Take
    the pieces from the liquor and pass it through a sieve. Mix a little rice flour
    in a cup of cold water, stirring still. Drop in the juice of a half lemon and
    the beaten yolk of an egg, which stir round quickly. Put in the meat for a moment
    and serve it with boiled potatoes.


    # LOIN OF MUTTON IN THE POT


    Put in an earthenware pot three shallots, minced; take a bit of fat, cut it and
    rub it the side of the pot; put in well as a bit of butter, pepper, peppers and
    some rather fat gravy. Divide the loin and put six chops in simmer for three quarters
    of an hour on a moderate fire; cover the pot with the lid. Before you serve, stir
    in a little lemon juice and stir up the sauce. To serve with Cauliflower is la
    Aershot as follows: Cut your cauliflower into pieces, seeing that it is very clean,
    while you have some salted water boiling. Put in the pieces, boil till tender,
    then drain them on a sieve. Make a good white sauce, adding the vegetable into
    the pot to simmer and serve as basis for a vegetable soup. Adding the yolk of
    an egg, and flavoring it with nutmeg. Put the vegetable on a dish and pour over
    the sauce, letting it sit for a few minutes before the fire before it is eaten.


    [Madame Herman Noppen_]


    # OX TONG WITH SPINACH AND WHITE SAUCE


    Boil the tongue in salted water until the skin peel off. Take this off, then put
    the tongue back in the liquor to simmer while you prepare the same. Take a piece
    of butter the size of an egg, melt it and mix it with two dessert spoonfuls of
    gravy, add some of the liquor, pepper, stir well, so that it makes a good cream;
    drop in the yolks of two eggs, always stirring, and a little lemon juice. Serve
    the whole with this sauce poured over it and spinach done in the following way:
    Wash the spinach in running water until every bit of grit has gone. Put some water
    to boil, salt it well, and throw in the spinach which you have freed from mid-rib
    and stalk. Wait the water is boiling and the brisk fire. When tender, press the
    spinach through the sieve, then put a bit of butter into an enamel saucepan, the
    spinach, which heat for six minutes, and a little pepper. Serve it with the tongue,
    and you can garnish with little croutons of bread fried in butter.


    [Madame Herman Noppen_]


    # VEAL FRITTERS'
- md: '

    # PART II


    # 53


    If you have only a little piece of veal or other cold meat, you can make a very
    presentable dish in the following way: Cut a slice of meat and spread on each
    side of it a layer of mashed potatoes to which you have added some tomato sauce.
    Beat an egg and dip the slices and potato into it, lay them in fine breadcrumbs
    and fry them till a golden color in plenty of fat. Serve this dish under a table
    for cover.


    [Pour la Patrie._]


    # STEWED BEEF


    If you are obliged to make a hot dish in a hurry and have only a piece of inferior
    meat, there is no better way of using it by dressing in the Brabant way, which
    is rather expensive. Clean and cook some mushrooms, and when fried lightly, add
    them and their liquor to your beef, cut up in small pieces, but not minced. Add
    pepper, salt, dust of spices, or an onion with three or four cloves, and a half
    bottle of red wine. Stew all together for at least twenty minutes, take out the
    onion and cloves, and serve in the dish which was cooked in should be earthenware
    pot.


    [Pour la Patrie._]


    # A MUTTON SALAD


    Cut some slices of cold mutton or lamb, removing every bit of fat and skin that
    you can, unless that destroys the firmness of the slice. Prepare a salad of lettuce,
    and if you cannot make a mayonnaise, add to the lettuce piece sliced cucumber,
    for that keeps the mutton moist. Put the salad on each and roll the meat over
    as tightly as you can. Lay the rolls together in a dish and sprinkle a very little
    salad dressing over them. This way of doing meat is very useful for taking to
    picnics, or for taking on a long journey.


    [Pour la Patrie._]


    # SAUSAGE PATTIES


    Half a pound of sausage of any kind that you like. Make some rounds of paste,
    lay the meat on half of each round and fold over. Steam for quarter of an hour,
    or stew in plenty of gravy.


    [Pour la Patrie._]


    # SAUSAGE AND POTATOES


    Roll some cooked sausage in mashed potatoes, making a roll for each person. Brush
    the potatoes with milk and bake them to till nicely browned. Decorate with gherkins
    on each roll of butter.


    # RAGOUT OF COLD MEAT


    Take any cold meat that you have, free from fat and skin and cut it in rounds
    like a five-pence piece. If you have some lean bacon or ham, a little of that
    should be added. I should tell you of all to put some rice on to boil in boiling
    water. Make a sauce of flour and butter in a pan, adding gravy if you happen to
    have it, failing that, use water and vinegar in equal parts to this; season with
    pepper and salt and a small spoonful of anchovy sauce. When the sauce is heating,
    put in the meat and cover the pan, let it all heat for twelve minutes and then
    place rice and sauce in the middle of a dish. By this time the rice may be tender.
    Drain it well and put it as a border to the stew.


    # PART II


    # 54


    [_Aimee., _]


    # A QUICKLY MADE STEW


    Put a piece of butter in a stewpan, with an onion cut in pieces, a few cloves,
    salt and pepper, a tablespoon of shredded parsley, and if you have some good gravy
    or meat juice and water. Throw into the sauce cold meat, preferably underdone,
    and after it has simmered for fifteen minutes take a cut onion and rub with the
    bottom of the dish that you are going to use. Take a good glass of red wine, such
    as Burgundy and mix it with the yolk of an egg, stir this into the stew and serve
    up in a couple of minutes.


    [_Madame Groubet., _]


    # GRENADES OF VEAL


    Take a firefox dish, and after sprinkling it with breadcrumbs put in a layer of
    roast veal in slices, a layer of mashed potatoes, a layer of veal kidney, and
    cut into pieces and lastly a layer of potato. Cover the whole with a beamel sauce
    into which you have stirred grated cheese; put it to bake in the oven. Then make
    a brown sauce with any veal or kidney gravy that you have, and cook some mushrooms
    in it with pepper and salt; the sauce is to be served with the grenade.


    # HOCHEP POT


    Slice an onion and fry it in butter till it is brown; add pieces of pork and of
    mutton freed from fat and skin; cover them with water and throw into it kinds
    of vegetables that you may have; but particularly sliced carrots and green cabbages;
    put it in the oven to cook. In another saucepan boil some white haricot beans,
    salt, and pepper, until they are tender, when they must be added to the stew with
    a small quantity of the liquor that they have boiled in.


    # PIGEON AND CABBAGE ROLLS


    Take two pigeons, two cabbages, four slices of fried bacon, an ounce of butter,
    a large wineglass of sherry, and some gravy. Press your pigeons and cook them
    in for ten minutes in a fireproof dish. Then them out, cut them into neat pieces.
    Meanwhile have the cabbages boiled in salted water. Drain them. Cut them in small
    pieces and roll up each slice of cabbage; lay the pigeons on top, pouring over
    them the liquor put all in the oven for ten minutes—pour the rest of the wine
    and leave for another ten minutes before serving. If you have stock to add to
    this is an improvement, or put half teaspoon of meat to extract half a pint of
    water.


    [_Une refugee. _]


    # REMAINS OF SAUSAGE


    If you have a few inches of a big sausage cut it into as thick slices as you can—fry
    them and lay them in a circle on a dish with a little butter. It is a good dish
    to serve it in, with a yolk of an egg.


    [_me. Georgette., _]


    # PART II


    # 55


    # SHOULDER OF LAMB A BEIGE


    Braise your shoulder of lamb; that is, put it in a closely covered stewpan, in
    some gravy to cook. Take a pound of good steak, shred it in small pieces, and
    put it in an enam saucepan with a quart of cold water and a sprinkle of salt.
    Strain the water from the barley and add this to the meat, and let it simmer for
    two hours. Then off the meat and barley in a mortar, rub it through a sieve; it
    is a smooth puree put back into the pan with its liquor and a gravy of cream.


    [_Madame refugee._]


    # FILLET OF BEEF À BRABANNE


    Take a whole fillet of beef, trim neatly and set it in a braising pan to cook
    in some brown sauce to which you have added a pint of stock. To serve the fillet,
    lay it on a dish with carrots and turnip, potato cakes round; pour over it the
    rest of the sauce from the pan; then add in onion puree and the sprouts-puree.


    # STEWED BEEF


    An interior part of beef may be to taste excellent if it is braised; that is,
    simmered with the cover on slowly, in company with onions (already fried) and
    well washed turnips. Put on also small cabbage in halves, and if you can give
    it, a glass of red wine.


    [_Une refugee._]


    # BEEF AND APRICOTS


    Stew your beef, say three pounds of steak, in some gravy, adding to a pint of
    liquor a level teaspoonful of white sugar. Throw in a handful of the dried apricots,
    but be sure you wash them first. This dish is generally accompanied by leeks,
    first blanced for a few moments, and then put in the stew. Flavor with salt, pepper,
    and the half of a lemon remove before you serve the stew. For English taste the
    sugar could be omitted.


    [_Seulette._]


    # FOR AN INVALID


    This must be at least three hours before it will be required. Take two ounces
    of pearl barley, wash it well, and put it in cold water for an hour. Take a pound
    of good steak, shred it in small pieces, and put it in an enam saucepan with a
    quart of cold water and a sprinkle of salt. Strain the water from the barley and
    add this to the meat, and let it simmer for two hours. Then off the meat and barley
    in a mortar, rub it through a sieve; it is a smooth puree put back into the pan
    with its liquor and a gravy of cream. Let it simmer again for a moment and serve
    it in a cup with a lid to it.


    [_Madame A. F._]


    # INVALIDS'' EGGS

