    # STEWED SHOULDER OF MUTTON


    Put in a large lump of butter or clarified fat, and place the shoulder in it.
    Add two big onions sliced, and a large carrot also sliced, thyme, bay-leaf, two
    cloves, pepper and salt, and if you like it, two garlic knobs. Let the shoulder
    simmer in this side of the fire for three hours. Strain the sauce through a fine
    sieve, and add it to either a glass of good red wine or to a little mustard with
    a teaspoonful of brown sugar.


    > [Mme. Segers._]


    # SHOULDER OF MUTTON


    Put a handful of dried white haricots to soak over-night and simmer them the following
    day for two hours with some salt. Rub your shoulder of mutton with a little bit
    of garlic before putting it in the oven to cook, and when it is done, serve with
    the haricots round it, to which a pat or two of butter.


    > [V. Verachtert._]


    # MUTTON COLLOPS


    Take some slices of roast or boiled leg of mutton, egg them, and roll in a mixture
    of breadcrumbs, salt, pepper, and a little flour. Fry the slices are brown on
    each side; serve with chipped potatoes.


    # SHOULDER OF MUTTON DRESSED LIKE KID


    My readers have probably tasted shoulder of kid as mutton. Let them therefore
    try the converse of the dish, and if they have really trouble with it, they will
    have a dinner of the most delicious. Put into a deep dish that will hold your
    shoulder of mutton following this mixture:


    A cupful of oil, white or red wine, an onion stuffed with cloves, a bunch of herbs
    which must be fresh—thyme, parsley, marjoram, sage, a bit of mint, a few bay-leaves—two
    carrots cut in slices. Put the shoulder of mutton in this mixture and keep it
    for four days, turning every now and then pouring the mixture on it. On the fifth
    day take it out, and if you care to take the trouble, you will improve it by larding
    the meat here there. Put it to roast in a good fit of fire, which serves to baste
    with it, in a pan beneath. You cannot hang the mutton by a string to turn like
    a roasting jacket, then bake it, and continue basting. A small shoulder is most
    successful. For one of four pounds baked for fifty minutes.


    # ROAST RUMP OF BEEF, BORDELAISE SAUCE


    Take three pounds of the rump of beef, put it into a deep pan upon one onion,
    one sliced carrot, some thyme, and a bay-leaf, three tablespoons of dripping,
    salt, and pepper. Put it on top of the fire, and when it comes fully to the boil,
    put it to the side, and allow it to simmer nicely for an hour and a half. Dress
    it on a dish and serve the sauce properly.


    # ROASTED FILLET OF BEEF


    About three pounds of fillet of beef in a good hot oven for forty minutes; let
    it be rather undertone. Take three turnips, four good-sized carrots, cut them
    into jardiniere slices. Cook them separately in salted water, drain them and add
    salt, pepper, a tiny pinch of sugar and one dessert-spoonful of butter. Dress
    the fillet on a long dish with the garnish of carrots and turnips, some artichoke–bottoms
    cooked in and finished with butter, also add potatoes _château– Be the dish is
    very hot. Put a little water, or, for choice, clear stock, upon the roasting–dish
    and pour it over the fillet.


    # BEEF À LA BOURIGNONNE


    Braise three pounds of beef upon twenty little onions, ten mushrooms, and two
    glasses of red wine, salt, pepper, thyme and bay–leaf; cook for one and one-half
    hours with not too hot fire. After that, place the beef on an oval dish; keep
    it hot; stir two tablespoons of demi–glaze into the vegetables and let it boil
    over. Cut some slices of the beef, and strain the sauce until


    # OX-TONGUE À LA BOURGEOISE


    Braise a tongue with two glasses of Madeira, one carrot, one onion, thyme, bay–leaf,
    for two hours. Take seven tomatoes in pieces, four carrots in two and in three
    four, about one–half inch long, ten small onions, and braise all them together;
    add two large–spoonful of demi–glaze, some salt and pepper. Serve very hot on
    an oval dish.


    Braised tongue eats very well with spinach, carrots or sorrel.


    # BEEF À LA MODE


    Take the raw beef, either rump–steak or fillet, and brown it in the pan with some
    butter. Then add a little boiling water. Add six or eight chopped shallots, the
    heads of two celeries chopped, a small few and white carrots, pepper, salt, two
    cloves. Before serving, bind the sauce with a little flour and pour all over the
    meat.


    [_V. Verachtert._]


    # BOEUF À LA FLAMANDE


    For this national dish that of the animal called “spiering” is used, which is
    cut from near the neck. What is called fresh silveride in England answers very
    well. Cut the beef into slices about half–an–inch thick and divide the slices
    into four pieces. You can do this with a piece of four. For a piece of beef, cook
    first of all large fried onions in fat. Put the beef in the hot fat when the onions
    are coloured, sauté; that is, keep the moving about gently. Take the meat out
    and place it on a dish. Add to the fat two dessert–spoonful of gravy and let it
    cook for five minutes, adding a good point of vinegar. Pass the sauce through
    a tammy, over the onions, and put the meat back in it, and let to cover them.
    Then add a dessert–spoonful of good vinegar and a strong bunch of herbs. Stew
    for an hour, take off the fat and remove the bunch of herbs. Heat up again and
    serve.


    # CARETAKER’S BEEF


    The real name of this dish is _Miroton de la Concierge,_ and it is currently known
    that canciers do to perfection. Put a handful of minced onion to fry in butter;
    when it is nearly cooked, but not quite, add a dessert–spoonful of butter, and
    stir until all is well coloured. Pour on a little gravy, or meat–juice of some
    kind, and let it simmer for ten minutes after it begins to steam again. Take your
    beef, which must be cold, and cut in small slices; throw them in and let it cook
    for a quarter of an hour, only simmering, and constantly stirring, so that it
    becomes considerably reduced it does not stick to the pan.


    # BLANKENBERG BEEF


    This is a winter dish; it is most sustaining, and once made, it can be kept for
    hours without spoiling. Make a puree of lentils or peas, and season it with pepper
    and salt. Mince your beef with an equal quantity of peeled chestnuts, chopped
    parsley, and a dash of nutmeg or a few cloves. If you have any red wine pour it
    over the mince till it is well moistened. If you have no red wine, use gravy.
    Use milk. Heat up in the oven for ten minutes, sprinkle in some currants or sultanas.
    The dish you wish to serve over it, put the stew in the middle, and place the
    purée round out. If the mince is moist it can be kept by the fire required, or
    the dish can be covered with one and placed in a carrying-can, taken out to skating
    or shooting parties.


    # VEAL WITH TOMATOES


    Grill some slices of veal; cook some sliced tomatoes with butter, pepper and salt,
    on a flat dish in a pretty quick oven. Garnish the veal with the tomatoes on top
    of each slice, and pour _maire–d’hotel–butter over, with butter, salt, chopped
    parsley, and lemon-juice.


    # FRICANDEAU OF VEAL


    A fillet of veal, larded with fat bacon, of about three pounds. Braise it and
    one–half hours on a moderate fire. This dish eats well with spinach, endive, sorrel.


    # VEAL CUTLETS WITH MADEIRA SAUCE


    are garnished with potatoes and mushrooms, and the sauce is made of demi–glaze
    and madeira, worked up with butter, pepper, salt and chopped parsley.


    # GRENADINS OF VEAL


    Cut your veal into thick cutlets, lard them with fat bacon, and braise them in
    the oven, with salt, pepper and butter. Dish up, and rinse the pot with a little
    stick, and pour it on the meat to serve.


    # CALF’S LIVER À LA BOURGEOISE


    Take a calf’s liver, lard with it bacon, braise it with the bourgeois garnish–carrots
    and turnips. After it is cooked and dished, stir some demi–glaze into the sauce,
    pour it on the meat and garnish with potatoes _château–_.


    # VEAL WITH MUSHROOMS, OR THE CALF IN PARDISE


    Take some slices of loin of veal, fry them in butter, with pepper and salt, for
    twenty minutes. Take two spoonfuls of demi–glaze and heat it with some mushrooms
    and a little madeira. Put the mushrooms and sauce on each slice and sprinkled
    parsley over all.


    This can also be done with _fines herbs–mushrooms, chervil and parsley, chopped
    before cooking in the butter.


    # BLANQUETTE OF VEAL


    Take your veal, which need not be from the fillet or the best cuts. Cut it into
    pieces about an inch long and add a little water when putting it into the pan;
    salt, pepper and a little nutmeg, and let it simmer for ten minutes. When tender,
    stir in the juice of half lemon, and bind the sauce with the yolk of an egg, or
    in default of that, with a little flour. Serve immediately. You will find that
