    # 炖羊肩


    在锅中放入一大块黄油或澄清脂肪，将羊肩肉放入其中。加入两个大块切片的洋葱、一根大块切片的胡萝卜，再加入百香草、月桂叶、两瓣大蒜、胡椒和盐，如果你喜欢的话，再加两头大蒜。让羊肩肉在火火旁慢炖三小时。用细筛滤酱汁，将其加入一杯上好的红酒中，或加入少许芥末和一茶匙红糖调味。


    > [Mme. Segers._]


    # 羊肩


    将一把干白豆浸泡一晚，，第二天加入一些盐，煮两小时。在将羊肩肉放入烤箱烹饪前，用少许大蒜揉搓表面。煮好后，用豆围在周围食用，并在豆中加入一或两块黄油。


    > [V. Verachtert._]


    # 羊肉肉片


    取一些烤过或煮过的羊腿肉片，裹上蛋液，然后在面包屑、盐、胡椒和少许面粉的混合物中滚一遍。将肉片两面煎至金黄色；配上碎土豆食用。


    # 仿小羊做法的羊肩


    我的读者可能已经吃过当作羊肉的小羔羊肩。让他们尝试这道菜相反的做法，如果他们真的觉得困难，将享受到一顿美味的晚餐。在一个能盛下羊肩肉的深盘中放入以下混合物：


    一杯油、白葡萄酒或红酒、一个塞满丁香豆的洋葱、一把新鲜的香料——百香草、欧芹、马郁、鼠草、一点薄荷、几片月桂叶——两根切片的胡萝卜。将羊肩肉放入这种混合物中腌四天，偶尔翻面并将混合物淋在肉上。第五天取出，如果你愿意花些功夫，可以在肉上到处点油以改善风味。放入旺火中烘烤，并用下方的锅收集肉汁不断淋回肉。你也可以用绳挂起羊肉使其像烤肉架一样旋转，然后烘烤并持续淋汁。较小的羊肩效果最好。四磅重的肉烤50分钟即可。


    # 烤牛臀肉，波尔多酱


    取三磅牛臀肉，放入深锅中，垫上一个洋葱、一个切片的胡萝卜、一些百香草和一片月桂叶、三汤匙牛油、盐和胡椒。放在火上，等完全沸腾后移到一旁，让它静静慢炖一个半小时。装盘并妥善淋上酱汁。


    # 烤牛菲力


    约三磅牛菲力肉，放入良好的热烤箱中烤40分钟；保持稍偏生。取三个芜萝卜、四根中等的胡萝卜，将它们切成条状。分别在盐水中煮熟，沥干并加入盐、胡椒、一小撮糖和一汤匙黄油。将牛菲力摆放在长盘中，配上胡萝卜和芜萝卜的装饰、一些煮熟并用黄油收尾的朝鲜心，再加入
    _城堡式_ 土豆——确保菜肴非常烫。在烤盘中加入少许水，或根据喜好加入清汤，淋在牛菲力上。


    # 法式炖牛肉


    用三磅牛肉，加入二十个小洋葱、十个蘑菇和两杯红酒，盐、胡椒、百香草和月桂叶焖炖；用中小火煮一个半小时。之后，将牛肉放在椭圆形盘中；保持温度；将两汤匙浓缩汁（demi-glaze）拌入蔬菜中煮沸。切几片牛肉，滤酱汁直到


