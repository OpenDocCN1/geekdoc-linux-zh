    侧。这道佳肴因其名字而闻名，源自布鲁塞尔那位奇异且富有天赋的市长。


    [_M. Stuart._]


    ## 波尔尔多式烩兔肉


    将兔子切成块，用醋覆盖，切碎两个个小洋葱、百里香、胡椒、盐和少许肉豆蔻；让全部浸泡二十四小时。


    取出肉块，用少许猪油轻轻煎炸。当全部煎至金黄色色时，加入一杯果酱炖煮一小时半到两小时。准备好后，滤出酱汁用面粉充分浓稠，将兔子装盘，淋上酱汁。


    ## 莱肯兔


    取一只中等大的兔子，准备好并切成块。肉块在醋中浸泡四十八小时，上面覆盖上一层肥肉培肉和少许切碎的小洋葱。四十八小时后，将四分之一磅培肉放入锅中煎，待其融化后，取出剩余部分，向肉中加入一块如蛋大的黄油，让其融化至起泡；撒入汤匙面粉。在火上搅拌，充分混合直至酱汁变成棕色，然后放入腌制过的兔肉。加入胡椒和盐，将每块肉的双面都煎至良好上色。上色后，加入一束百里香、切好的洋葱和用于浸泡的一半醋；三片叶子、一打干杏子和干西梅、五块糖、半品脱水。盖紧盖子，火慢炖两个半小时。


    [一位来自罗特维奇的比利时人。]


    ## 兔肉


    将一两只兔子的背部和后腿放入烤箱，在第一层涂上黄油（半英寸厚），然后再涂一层法式芥末、胡椒和盐。用大火烤一小时，经常用肉汁和肉汁淋烤。


    ## 野兔


    放入烤箱的锅中：酱汁、黄油和四品脱奶油、胡椒、盐和一些面粉以浓稠酱汁。在野兔放入烤箱之前，在其上方覆盖一层薄培肉，在野兔上桌前取下。


    [_Mdlle. Breakers._]


    ## 朗姆姆蛋


    这道简单的菜深受男士们喜爱。打碎五个鸡蛋，加入砂糖调味，倒入一小雪利杯的朗姆酒。用力击打直至起泡沫。在浅锅中放入一点新鲜黄油，倒入蛋液。在火上静置三分钟，然后移至热盘中。在送往餐厅的途中撒上糖粉。在餐厅门口，点燃一大勺朗姆酒点燃，然后将其淋在欧姆蛋上。在匆忙中为你的欧姆蛋点燃一整杯朗姆酒几乎是不可能的，所以请使用厨房勺。


