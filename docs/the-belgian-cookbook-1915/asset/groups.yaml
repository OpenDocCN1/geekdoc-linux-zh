  mdcn: "\n\n# 第一部分\n\n取新鲜鸡蛋，加入两块黄油和两小勺水混合均匀。用勺子快速搅拌，当汤煮沸八分钟后，将其淋在盛于汤碗里的鸡蛋和黄油上。这是一道极佳的汤。加入少量的牛肝提取物（Bovril）会使其味道更佳。\n\
    \n## 欧芹汤\n\n将一块小牛骨放入水中煮煮，根据需要的量加入四至五个土豆。等土豆煮软后，用蔬菜捣碎器压碎并放回汤中。切碎欧芹，加入半个甜点勺的玉米粉。在上菜前一小时放入欧芹，但要取下锅盖，以保持其鲜绿的。加入黑胡椒和盐调味。\n\
    \n> [_V_. Verachtert, Café Appelmans, Anvers.,_]\n\n## 极佳的豌豆汤\n\n将豌豆浸泡过夜。第二天烧一些清水水，倒入豌豆，加入一些切碎的洋葱和大葱，并加黑胡椒和盐。让汤在炉火上慢炖三小时，偶尔搅拌。如果你有一块火骨，那将是巨大的提升；或者用煮过火腿的水作为汤底，而不是用清水。\n\
    \n> [_Mdlle. M. Schmidt.,_]\n\n## WATERZOEI（水烩汤）\n\n这本质上是一道佛兰汤。使用酸豆子、鳗鱼、鳋、拟鱼、鲈、翘鱼，因为总是使用不同种鱼。取两磅鱼，切掉鱼头鱼尾（用黄油轻煎），加入混合切碎的胡萝卜和洋葱、三瓣大蒜、一小撮白胡椒、一小枝欧芹、一片月叶；倒入三分之二的水和三分之一的葡萄酒，直到没过食材，慢炖半小时。鱼块必须切成等大，放入此汤中快速煮二十分钟。上菜前五分钟加入一个去皮并切片的柠檬，然后取出柠檬片。用磨碎并煎至金黄色的面包屑勾稠酱汁。食用这道菜时，配上极薄的面片和黄油。根据英国人的口味，装菜时应去除鱼头和鱼尾。\n\
    \n## 极佳的比利时汤\n\n被称为*奶油煎汤*（crème de sauté）-作为最健康的蔬菜之一，芦芹菜与土豆在做汤时完美结合。洗净、晾干并切碎四盎司留茎的叶，在黄油中慢煎五分钟或不煎加入切薄洋葱，加入一磅切小丁的土豆，煎，继续慢煎不要煎焦；倒入一夸脱水或浓汤，小火慢煮；盖严，煮三十五至五十分钟，在小火上搅拌，将过滤后的纯汤倒回锅中，加入半勺黄糖、根据口味加入适量的盐和辣椒粉，用搅拌好的一大汤匙面粉均匀调入一杯早餐杯冷牛奶中勾稠；大火煮沸，撒上芦芹菜享用。\n\
    \n> [_E. Haig.,_]\n\n## 比利时蔬菜泥\n\n将两磅布鲁塞尔芽芽放入沸水中煮。取出，沥干并在黄油中翻炒五分钟，撒上一茶匙面粉，然后在肉汁（或肉水）中用大火快速煮沸，并保持锅盖打开，以便它们保持绿色。通过筛网，静置十分钟，用三个蛋黄和一品牛奶将混合物勾稠；最后时刻，每一品汤加入一个甜点勺黄油和半份汤底。\n\
    \n## 大使汤\n\n取一半品新鲜豌豆，或在冷水中浸泡六小时的干豌豆；一个大葱和两个切碎的洋葱。慢炖至豌豆变软，然后将全部通过筛网。洗净红葱头，将过滤后的纯汤倒回锅中，加入半勺糖、根据口味加入盐，用搅拌好的一大汤匙面粉均匀调入一杯早餐杯冷牛奶中勾稠；大火煮沸，撒上欧芹享用。\n\
    \n> [_G. Georges._]\n\n## 克雷西汤（比利时法）\n\n取一半品新鲜豌豆，或在冷水中浸泡六小时的干豌豆；一个大葱和两个切碎的洋葱。慢炖至豌豆变软，然后将全部通过筛网。洗净红葱头，将过滤后的纯汤倒回锅中，加入半勺糖、根据口味加入盐，这种汤应保持绿色。\n\
    \n> [_G. Georges._] （注：此处原文逻辑似乎重复，已按字面翻译）\n\n## 克雷西汤（比利时法） \n\n取一半品新鲜豌豆，或在冷水中浸泡六小时的干豌豆；一个大葱和两个切碎的洋葱。慢炖至豌豆变软，然后将全部通过筛网。洗净红葱头，将过滤后的纯汤倒回锅中，加入半勺糖、根据口味加入盐，这种汤应保持绿色。\n\
    \n> [_G. Georges._] （注：此处原文逻辑似乎重复，已按字面翻译）\n\n## 弗兰芒汤\n\n取两磅布鲁塞尔芽芽放入沸水中煮。取出，沥干并在黄油中翻炒五分钟，撒上一茶匙面粉。土豆煮软后，通过筛网。\n\
    \n> [_G. Georges._]\n\n## 西茄泥\n\n将土豆放入水中煮，加入芹、两根大葱、两根胡萝卜和一磅新鲜西茄，加入黑胡椒、盐和一片月叶。通过筛网。将切碎的洋葱在黄油中煎，加入汤中煮二十分钟。如果没有新鲜西茄，可以使用罐装西茄，在煎洋葱的同时去皮。\n\
    \n> [_Mme. van Praet.,_]\n\n## 芦芹奶油汤\n\n煮一些土豆并通过筛网，加入芦芹尖，每罐加入一块黄油；加入肉汤和水，最后时刻拌入两个蛋黄和一些碎欧芹。\n\
    \n> [_Mme. van Praet.,_]\n\n## 绿豌豆汤\n\n将半磅干绿豌豆放入冷水中浸泡过夜，加入一茶匙小苏打。第二天早上取出豌豆，放入三又半品水中煮。当豌豆快煮好时，加入五个大土豆。等全部煮熟皮容易脱落时，将全部通过筛网。在一些黄油中将五个洋葱和六根大葱煎至焦，或者用牛油煎；加入豌豆一同煮半小时。可能的话，加入切四的猪爪，这会让汤味道极佳。准备享用时，取出四块猪爪。应配上酥的小的面丁。\n\
    \n> [_V. Verachtert,__]\n\n## 蔬菜汤\n\n将四个洋葱煎至焦。将它们加入三品水中，加入四根胡萝卜、一块白面包皮、五个土豆、芹和一束欧芹（在通过通过筛网前必须取出欧芹）。加入几颗西茄会让汤更好；如果是罐装的，在汤通过筛网后再加入；如果是新鲜的，则与其他蔬菜一起放入。慢炖一小时，加入黑胡椒和盐享用。\n\
    \n"
