    # FISH AND CUSTARD


    Boil the trimmings of your fish with milk, pepper and salt. Strain it and add
    the yolks of eggs till you get a good custard. Pour the custard into a mold, and
    lay it in your fish, which must already be parboiled. If you have cold fish, flake
    it flat, and mix it with the custard. Put the mold in a double saucepan. Steam
    it for three quarters of an hour. Turn it out, and garnish with strips of lemon,
    and if you have, sprays of fennel.


    # HAKE AND POTATOES


    Hake, which is not one of the most delicate fish, can be made excellent if stewed
    in the following sauce: A cream of milk to which add a dessertspoon of any of
    the good English sauces; thicken it with a knob of butter rolled in flour, stir
    until it is all smooth. When it takes off the fish, and put it in pieces of hake,
    set it back by the side of the fire to keep very hot, without boiling, for twenty–five
    minutes. Meanwhile make potatoes, and put it as a puree round dish, the fish in
    the center, sprinkle it on chopped parsley. The liquor ought to be reduced.


    # VERY NICE SKATE


    Take skate, or indeed any fish that rolls easily, make into fillets, dry them
    well, and sprinkle on each fillet, pepper, salt, a dash of mixed spice, and roll
    each fillet tightly, and pack them tightly into a dish, so that they will not
    become loose. Take vinegar and beer in equal quantities, or if you do not like
    to use butter, use the vinegar with some black pepper, and a good sprinkle of
    dried and mixed herbs with salt. Pour over the fish, tie a piece of butter over
    the top, and bake for an hour and a quarter (a medium pie dish) in a moderate
    oven.


    # TO KEEP SPRATS


    A large quantity of these may be bought cheaply and kept for some weeks by this
    method. Put on warm equal quantities of vinegar and water, what you think sufficient
