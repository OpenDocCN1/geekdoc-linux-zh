    it through the sieve once more and serve it in a crystal bowl.


    [Mdle. B–M.,]


    # CHOCOLATE PUDDINGS


    Make some Genoese cake mixture as would a light cake, and pour it into greased
    molds like cups. You can take the weight of one egg in dried fruit, butter, and
    lesser of sugar. Beat the butter and sugar together to a cream, sprinkle in a
    pinch of salt, stirring all the time, until the beaten egg. When your little cakes
    are baked, turn them out of the molds and when cool turn them upside down over
    the inside, leaving a deep hole and a crust run all. Fill this hole with the custard
    and chocolate as above, and let it grow firm. Then turn the case right up and
    pour over the top a sweet cherry chocolate sauce. You may require the yolks of
    two eggs to make the custard firm.


    [Mdle. B–M.,]


