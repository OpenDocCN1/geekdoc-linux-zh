    # HUNTER''S HARE


    Cut the hare in pieces and cook it in the oven, butter and pepper, turning it
    now and then so that it does not get dry. Then prepare Hunter''s Sauce. Melt a
    bit of butter the size of an egg and add flour, letting it brown, fry in plenty
    of chopped onions and shallots, added tagon cayenne and pepper-corns; spice it
    highly with nutmeg, three cloves, a sprig of thyme and a couple of bay-leaves.
    Chop up the hare liver, put it in the sauce and pass all through the sieve. Pour
    the sauce over the hare and add a good glass of claret, or for English tastes,
    of wine sauce. If the sauce is too thin, thicken it with flour, and serve it all
    together.


    [_Mme. Spinette._]


    # FLEMISH RABBIT


    Cut the rabbit into neat pieces. Put them into a deep frying-pan and toss them
    in butter, so that each piece is well browned without burning the butter. Take
    them out of the pan and in the same butter cook six shallots (finely minced).
    Return the rabbit to the pan, seasoning all with salt and pepper, adding well
    three bay-leaves, two cloves, and two more. If you have any gravy, add a pint
    of it, but in default of gravy the same quantity of Bonvil and water. Place on
    the fire till it boils, then it to the side and let it cook gently for three-quarters
    of an hour. When it is nearly done, add a little vinegar, more or less according
    to your taste. This is served with boiled and well-drained potatoes. The sauce
    is not thick enough, add to it a little flour which has been first mixed with
    cold water.


    > _Georges Kerckeert._


    # ROAST KID WITH VENISON SAUCE


    This dish is very excellent with mutton instead of kid; the meat tastes venison
    if this recipe is followed:


    Put the meat, say a shoulder of mutton, in a soak of red wine, with a sliced carrot,
    thyme, bay-leaves (4), six cloves, fifteen peppercorns and a teaspoonful of vinegar,
    for two hours. Bring the liquor to the boil and pour it over and the meat. Do
    this pouring of hot liquor for two days. Then put the meat in the oven with butter,
    pepper, and salt, until it is cooked.


    Sauce: Brown onions in butter and pour in the liquor, without the carrot. Let
    it simmer for three-quarters of an hour, and pour it through a sieve. Roll a nut
    of butter in flour and add little by little the liquor you have from meat, then
    a coffee-spoonful of meat extract and two lumps of sugar. This sauce ought to
    be quite thick. It is served with the meat. [_Mme. Vandervelle._]


    # BAKED RABBIT


    Fry the pieces of rabbit, adding three onions, two medium potatoes, half a glass
    of beer, a little water or stock, pepper and salt. Bake it all gently in an earthenware
    pot for two hours, and then thicken the same with flour. It is an improvement
    to add when it is cooked with two cloves, two bay-leaves, a pinch of nutmeg, and
    any fresh herbs, such as thyme, parsley, mint.


    [_Mme. E. Macs._]


    # CHICKEN À LA MAX


    Chop some cold chicken into small squares, mix with a thick white sauce, and let
    it het. Put it on a hot dish and cover with fried onions. Chipped potatoes at
    the ends of the dish and the boiled chicory at either'
