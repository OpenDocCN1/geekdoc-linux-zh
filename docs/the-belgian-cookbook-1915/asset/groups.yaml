    # PART I


    35


    [_Mme. Limpens,_]


    # LIMPENS CHEESE


    Take a roll, cutting it in slices, remove the crusts to that round of crumbs remain.
    Butter each slice, and cover it with grated cheese, building up the slices one
    on the top of the other. Boil a cupful of milk, with pepper, salt, and a little
    nutmeg; when boiled, pour it over the bread until it is soaked. Put them in the
    oven, for quarter of an hour, according to the heat of the oven and the quantity
    you have. You must pour its juice over it every now and then, and when the top
    is turning into a crust, serve it.


    [_Mme. Limpens,_]


    # CHEESE SOUFFLE


    Take two good-spoons of flour, and mix it with half a teaspoonful of milk; melt
    a lump of butter, the size of a fillet, and add enough cheese to your taste, and
    the yolks of four eggs. Add at the last the whites of the four eggs, beat stiffly;
    pepper and salt. Beat a little, put in your mixture, and let it cook for one hour
    in a saucepan, surrounded by boiling water, and let turn out the soufflé, and
    serve with a mushroom sauce. The sauce is a good white sauce, to which you add
    already cooked mushrooms. Clean them from all, chop them and cook them tender
    in butter; and their own juice; then throw them into the sauce, and pour over
    your soufflé.


    [_Mme. Vandervelle,_]


    # CHEESE CROQUETTES


    Make a thick beamel sauce, and be sure that you cook it for ten minutes, constantly
    stirring. Add, till well flavored, some Gruyère and Parmesan cheese, mixed and
    grated. Let it get cold. Roll this mixture into the shape of carrots; roll them
    in finely-graded breadcrumbs, and fry them in hot lard or refined fat. Lay them
    on a hot dish, and put the thicker at the end of each carrot stick in a sprig
    of parsley to look like the stalk.


    [_Mme. van Varcke de Lunessen,_]


    # CHEESE FONDANTS


    For twelve fondants make a white sauce with two tablespoons of flour and milk.
    Add it to the yolks of three eggs. Stir in four ounces of finely Gruyère cheese,
    and Parmesan, grated very finely. Add at the end of the eggs of half a lemon,
    and a dust of cayenne. Let it get all cold. Make little balls with this paste
    and roll them in breadcrumbs. Throw them in a pan of boiling fat, where they must
    remain till they are a good golden color. Drain them, keeping them hot, and serve
    quickly.


    [_Madame Emelie Jones,_]


    # CHEESE SOUFFLE


    Grate a pound of Gruyère cheese. Mix in a cup of milk a dessert–spoonful of flour;
    beat four eggs, and add first the cheese, and then the flour and milk mixture.
    Season with pepper and salt, and put all into a mold. Let it cook in a saucepan
    of boiling water for an hour and a half. Then at the end of this time put it in
    the oven for a half hour.


    [_Madame Emelie Jones._]


    # PART I


    # POTATOES AND CHEESE


    Wash some raw potatoes, peel them, cut them into thin round slices. Take a dish
    which will stand the oven, and a nice enough to go on the table, and put in it
    a layer of the slices sprinkled with pepper, salt, a little flour, and plenty
    of grated Gruyère. Continue in this way, finishing with a layer of cheese, and
    a little flour. Put the dish in the oven, which must not be a very hot oven, and
    cook gently.


    For a medium pie dish you will find that half hour is sufficient to cook the potatoes.


    > Madame Emelie Jones.


    # YORK HAM, SWEETBREADS, MADEIRA SAUCE


    Heat the ham in a double saucepan (bain marie). Boil the breads, blanch them and
    let them fry in some butter.


    Take flour and melt them to a thick sauce, adding a tumbler of water and Madeira
    which will turn your sauce brown. Fry half a pound of mushrooms in butter and
    when brown, add them and the liquor to your sauce with a good glaze of madeira
    or sherry. Place your ham in the middle of the dish, surround it with the sweets,
    and pour over the Madeira sauce.


    > [Mme. Vandervelle_]


    # HAM WITH MADEIRA SAUCE


    Cook some macaroni or spaghetti, with salt and pepper. Make a brown sauce, using
    plenty of butter, for this dish requires a great deal of sauce, and add to it
    "roux" some tomatoes in purée (stew and run through a sieve), a little meat extract,
    some fried mushrooms, a few drops of good brandy or made to taste. Let your slices
    of ham in this sauce, and when ready, place them in the middle of a flat dish,
    put the mushrooms or spaghetti around, and put the sauce, hot, over the ham.


    > [Madame Spinette._]


    # A DIFFICULT DIS OF EGGS


    And this is only of fried eggs after all! Put some oil on it; if you do not use
    butter, but oil is the best. When the bluish steam rises it is hot enough. Break
    an egg into a flat dish, tip the frying pan by the handle side, slide it into,
    then with a wooden spoon turn the egg over itself; that is, roll and then roll
    the white over the yolk as it slips into the pan. If you cannot manage, let the
    egg heat for a second, and as soon as one is done let it drain and warm by the
    fire. When all are done put them in a circle, in a dish, and pour them around
    a very hot sauce, either made with tomatoes, or flavored with vinegar and mustard.


    # COUNTRY EGGS


    Make a thickly mixed with onions, as you would eat in England with a leg of mutton,
    but not forget a little seasoning of sauce. Make a high mound of mashed potatoes,
    and scoop it out from the top, leaving the bottom and sides of the vegetable.
    While your sauce is kept by the fire (the potatoes also), boil six eggs for two
    minutes, shell them, and you will find the whites just set and no more. Pour the
    onion sauce into the potato, and drop in the whole eggs and serve very hot.


    # PART I


    # FRENCH EGGS


    Put a lump of butter the size of an egg in a fireproof dish, mixing in when it
    is melted breadcrumbs, a chopped leek, the inside of three tomatoes, pepper and
    salt. Let it cook for three or four minutes in the oven, then stir in the yolks
    of two eggs, and let it make a custard.


    Then break on the top of this custard as many eggs as you wish; sprinkle with
    pepper and salt. Let it remain in the oven until these are beginning to set. Take
    out the dish, and push over the top the salamander, or shovel, red hot, and serve
    at once. I have seen this dish with the whites beaten and slightly browned by
    the shovel.


    # OEFSLESTES


    (Hommage to Sir Edward)


    Gently boil the quality of best green peas in good gravy; as the gravy becomes
    reduced, add butter. If you cannot cream, milk instead and stir it with the yolk
    of an egg. For use, add a pinch of sugar and some chopped parsley.


    # PETITES CAISS À FURNES


    Take a small Ostend radish, steep it in water as usual, and boil it in some white
    stock, with good peppercorns. When it is cold chop the meat up into small dice;
    add it to a quarter of the amount of ham, and the whites of two hard-boiled eggs,
    cut to the same size.


    Moisten the salpicon with a good white sauce made with cream, a little lemon juice,
    pepper and salt. The little paper cases must have a ring of cheese arranged, around
    a quarter of an inch thick; the salpicon, put in carefully with a small spoon,
    will hold in place. Fill the cases to the level of the crease, and decorate with
    a Belgian flag made as follows:


    Make some as jelly with gelatine, vinegar, and a little sherry. Color one portion
    with paprika or coralline; a second part with the sieved yolks of two hard-boiled
    eggs, and the remainder pickled walnuts, also passed through a wide sieve. Pour
    the jelly into a small mould with straight sides; and when it is cold in the black.
    When the jelly is jelly, turn it out, slice it, and cut it into pieces of suitable
    size. If you make too much asparagus it can decorate any cold dish or salad at
    night.


    > [_Margaret Strail, or Mrs. A. Straut.,]


    # FLEMIS CARROTS


    Take some carrots, wash and brush them as tenderly as you would an infant, then
    simmer them tender with pepper and salt. When cooked, draw them to the side of
    the fire and pour in some cream to make a good sauce. If you cannot cream, milk
    instead and stir it with the yolk of an egg. For use, add a pinch of sugar and
    some chopped parsley.


