    # 第一部分


    ## 酿蛋


    将鸡蛋煮熟，每人准备一个。取出蛋黄。在鸡蛋煮期间及随后在水里冷却时，制作少量的蛋黄酱。剥去蛋壳，纵向切开，取出蛋黄。将蛋黄弄碎，加入少量切碎的香草，加入蛋黄酱。用这种混合物填充鸡蛋，放入盘中，周围铺上切碎生菜，可以在上面再加一点酱汁。


    [_Mme. van Marcke de Lunessen_]


    ## 水煮蛋配番茄酱


    制作几片吐司并涂上黄油；在每片吐司上放一片番茄或火腿。保持这些热量，水煮你所需的所需的鸡蛋。将每个鸡蛋滑到吐司上，迅速淋上调味味浓郁的番茄酱。


    [_Mme. van Marcke de Lunessen_]


    ## 鸡蛋与蘑菇


    挑选半磅蘑菇，切成小丁丁，放入烤箱中加入大量的黄油、胡椒和盐炖制。制作一种浓稠的酱汁，蘑菇煮熟后可以将其加入蘑菇汁中；搅拌入酱汁。取三个煮熟的鸡蛋，将蛋黄和蛋白分离。放入浅的蔬菜盘中——将蛋白切成小块，在上面淋上蘑菇奶油白汁，最后在顶部撒上用叉子弄碎的熟蛋黄。


    [_Mme. Braconiere_]


    ## 比利时鸡蛋


    制作一些炒蛋，将它们放在非常热的盘子里，周围淋上一层厚厚的番茄酱。用圆片番茄快速装饰盘子。


    ## RIBEUCOURT 风格鸡蛋


    放入小纸盒，置在烤箱中烘干。在一个纸盒中放入一块黄油，让其轻微融化。每个纸盒打一个鸡蛋，小心不要弄破蛋黄，在每个蛋黄上放一点黄油。放入快速烤箱中，直到蛋白半软。上菜时，准备好一些碎舌肉或火腿撒在上面，并用一大块黑松露装饰。


    ## 利用剩余肉类


    将任何冷肉（如猪肉、牛肉、小牛肉或火腿）切成片。在锅中融化核桃大小的盐黄油，放入切片的洋葱；让其受热变色。在另一个锅中，放入一块较大的、裹有汤粉的黄油——大量的面粉；加入洋葱和黄油中，加入足够的水以防酱汁变得太稠。如果你愿意，还可以加入一茶匙肉精和一撮盐。准备好一些土豆，但要做得非常松软。将肉片放入耐热盘，在上面淋上酱汁和土豆泥，将盘放入烤箱，直到完全加热透。这在比利时被称为“哲学肉肴”。


    [_Paquerette._]


    ## 洋葱炖牛肉


    取一块鸡蛋大小的黄油块，在煎锅中煎上色。切一些洋葱，在另一锅中煎炒。煎好后，将它们加入黄油中，加入切片的胡萝卜、几个小洋葱和你的牛肉块、盐和胡椒。加入少量的水，盖上锅盖。当肉变软后，可以用少量面粉加稠酱汁。这是使用质地较硬或非上牛肉的好方法。


    > [Paquerette.]


    ## 牛肉肉饼


    将三磅生牛肉——四分之一磅猪肉——剁得很细。在家里做比在肉铺里做更好。取两片牛肉浸泡在牛奶中，加入两个蛋黄和蛋白、胡椒和盐。充分混合，搅拌十分钟。然后让它静置半小时。放入一个小模具中，加入一块鸽子蛋大小的黄油，放入烤箱中。当肉汁停止流出时即可上菜。


    > [Paquerette _]


    ## 肉类冷肉


    取一根新鲜芹菜，洗净并去掉绿叶子。在盐水中煮至半熟。在滤子上沥干，将其纵向切开，在两片芹菜之间夹入任何种类的、调味充分的肉末。用线将它们系在一起，再次煮十五分钟，可以在原水中轻轻炖煮，也可以放在涂了大量黄油的耐热盘中烘烤。其他人为了避免系两半部分的麻烦，会将肉末涂抹在每个半部分上，平放在耐热盘中在烤箱中烘烤。在这种情况下，在每份肉末上放一块好的黄油。


    > [L. Verhaaghe _]


    ## 炭火炖肉


    放入两个洋葱在黄油或热脂肪中煎色。将其加入切成小蛋糕大小的牛肉中。煮几分钟，然后加入胡椒、盐、切片的胡萝卜和足够的水，让肉在火边慢炖，一匹半磅的肉需要一小时半。上菜前十分钟加入小块肉——或利比毕提取肉精。如果需要，你可以同时和肉一起煮大约二分钟土豆。将全部盛放在大盘子里，肉在中间，土豆在周围。酱汁单独上菜，不要经过滤网。


    > [L. Verhaaghe _]


    ## 利用剩余肉类


    放入两个洋葱在黄油或热脂肪中煎色。将其加入切成小蛋糕大小的牛肉中。煮几分钟，然后加入胡椒、盐、切片的胡萝卜和足够的水让肉在火边慢炖，一匹半磅的肉需要一小时半。上菜前十分钟加入小块肉——或利比毕提取肉精。如果需要，你可以同时和肉一起煮大约二分钟土豆。将全部盛放在大盘子里，肉在中间，土豆在周围。酱汁单独上菜，不要经过滤网。


    （注：此处原文内容重复，已按要求不重复输出翻译）


    若有剩余鱼肉，去掉皮和骨，将鱼肉与盐、黄油、胡椒和两个鸡蛋混合。制作一些小纸盒，每个纸盒放入一点柠檬汁——少量的。烘烤纸盒直到顶部呈金黄色。


    ## 啤酒酱肉


    （注：此处原文内容重复，已按要求不重复输出翻译）


    洋葱肉


    将肉切成比厚片更薄的片。剁两个大洋葱并煎至变色；然后将肉片煎至上色，加入白汁、胡椒、盐和肉豆蔻。加入水，一撮盐。如果酱汁不够稠，加入少量面粉，注意使其煮沸。


    ## 鱼


    若有剩余鱼肉，去掉皮和骨，将鱼肉与盐、黄油、胡椒和两个鸡蛋混合。制作一些小纸盒，每个纸盒放入一点柠檬汁——少量的。


    ## 鱼肉剩余料


    若有剩余鱼肉，去掉皮和骨，将鱼肉与盐、黄油、胡椒和两个鸡蛋混合。制作一些小纸盒，每个纸盒放入一点柠檬汁——少量的。


    制作一种好的白汁，加入胡椒、盐和肉豆蔻，然后加入剩余鱼肉和一些虾。用这种混合填充壳，并在顶部撒上一层格鲁耶奶酪。在每个壳中间放一块黄油，放入烤箱中。当呈金黄色时，装饰上欧芹食用。


    > [_Mme. Lekent_]


    ## 美味肉卷


    剁碎旧肉，在一磅肉中加入半磅新鲜猪肉、切碎的小洋葱和欧芹、盐、胡椒、少量肉豆蔻，用一个鸡蛋（蛋黄和蛋白）结合。揉成球，裹上面粉，用一些黄油煎色，煎得漂亮后，向锅中倒入少量高汤或肉汁和水。让它们在其中慢煮十分钟即可即可。


    > [_Mme. Lekent_]


    ## 煮肉肉丸


    我认为冷肉由于被忽视而变得没有滋味，但如果按照我向你展示的方法准备，它将赢得你的认可。


    将煮熟的肉剁碎，放入加入调味味丰富的胡椒、盐和肉豆蔻的浓稠白汁中，让静置两小时。然后通过将混合物裹上鸡蛋和细面包屑来准备你的肉丸。在锅中放入足够煎所有肉丸的黄油，让它们煎约十分钟。配上一份白汁是一个很好的补充。


