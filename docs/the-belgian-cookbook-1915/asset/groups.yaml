    Because your dining-room furniture is Early English, there is no reason the cooking
    should be early English too. And it certainly will be, unless one makes great
    trouble with detail.


    Let us suppose that at 7:30 P.M., your husband telephones that he is bringing
    a friend to dine at 8. Let us suppose an even more rash than usual. He arrives
    at 7:15, a friend: you perceive the unexpressed corollary that the dinner must
    be better than usual. In some moment of momentary surprise, let your very best
    (the kind that is practiced by bachelors'' widows) and say "I am delighted you
    have come like this; do you mind eight or a quarter past dinner? Then melt away
    the cook with this book in your hand.


    I take it that you consider her-be to be the junior partner in the household,
    you, of course, being the senior and your husband the sleeping partner in it.
    What is there in house for an extra dish, and I wager the whole system to a burnt
    match you will find in these pages the recipe fits. A piece of cold veal, viewed
