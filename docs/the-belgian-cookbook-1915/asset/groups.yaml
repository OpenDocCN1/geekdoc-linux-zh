    ## M. LUCK.


    ## HORS D''OEUVRE

    (Herring and Mayonnaise)


    Take some salt herring, one for each person, and soak them for a day in water.
    Skin, cut them open lengthways, take out the backbone, and put them to soak for
    a day in vinegar. Before serving them, let them lie for a few minutes in milk,
    and putting them on a dish, pour over them a good mayonnaise sauce.


    [Mme. Delhaye]


    ## CARROT SOUP


    Wash and scrape a pound of carrots, slice them, treat two medium potatoes in the
    same manner, add a bay leaf, a spring of thyme and a chopped onion. Cook all with
    water, salt, pepper, and cook until tender, when it passes through a sieve. Put
    in a pan of butter the size of an egg, with a chopped leek and a sprig of chvil.
    Let it cook for three or four minutes, then pour over the puree of carrots and
    let it all come to the boil before taking it off serve.


    [Madame Stoppers]


    ## SORREL SOUP


    Take a quart of bouillon or meat extract. Fry in butter a carrot, a turnip, an
    onion, a small cabbage, all washed and chopped, and add half a teaspoon of mustard.
    Put your soup to and set it on the fire. Let it simmer for twenty minutes, adding
    any seasoning you wish and a little more water, and let it simmer for another
    half hour. Shred a bit of basil or marjoram with a handful of well washed sorrel,
    throw them in, cook for five minutes, skim it, pour into a soup tourne, and serve.


    ## OSTEND SOUP


    There are many varieties of this soup to be in the different hotels, but it is
    a white soup, made of fish pieces and strained, returned to the pot, and with
    plenty of cream and oysters before serving. It should never boil after the cream
    is put in. A little m is usual, but no onions or shallot. A simple variety is
    made with flour and milk instead of cream, the liquor of fish as well as oysters,
    the beaten egg added at the last moment.


    [Esperance]


    ## ANOTHER SORREL SOUP


    Take a quart of bouillon or meat extract. Fry in butter a carrot, a turnip, an
    onion, a small cabbage, all washed and chopped, and add half a teaspoon of mustard.
    Put your soup to and set it on the fire. Let it simmer for twenty minutes, adding
    any seasoning you wish and a little more water, and let it simmer for another
    half hour. Shred a bit of basil or marjoram with a handful of well washed sorrel,
    throw them in, cook for five minutes, skim it, pour into a soup tourne, and serve.


    [Esperance]


    ## HASTY SOUP


    Into a quart of boiling water throw four spoonfuls of semolina, so that the grains
    are separated. Let it boil for a quarter of hour, with pepper and salt. Take the
    tureen and put the yolk of an egg in it with a bit of butter as you wish. Quickly
    pour in the semolina and serve.


    [Esperance]


    ## ARTICHOKES A LAEDETTE


    Boil some artichokes in salted water till they are tender. Take out the center
    leaves, leaving an even fringe of leaves under. Remove some of the choke as you
    can. Steam some cooked peas in butter, then mix them in cream and taking your
    artichokes in your cream and peas in the center, as much as you get. The cream
    is not necessary for this dish to be a good one, but the artichokes and peas must
    be young.


    [Chef reconnaissant]


    ## VEGETABLE SALADS


    Sometimes one has a few leeks, a head cauliflower, a handful of peas and beans.
    Instead of these vegetables (which have restrictive flavor from them) cook them
    gently, and toss them cold in a good salad dressing. If you can use the yolk of
    an egg to it, so much the better. Any cold meat is improved by a side dish of
    this sort. The vegetables that one can curry with advantage are large marrows,
    cut into cubes, turnips, potatoes parsnips.


    [Marguerite Leblanc]


    ## SURPRISE POTATOES


    Quarter of an hour will suffice to prepare and cook this savory sauce, once the
    potatoes are baked. Three large potatoes of symmetrical size, clean and bake them;
    cut in two and remove the inside injuring the skin. Half an ounce of butter by
    the fire, then two ounces of potato passed through a sieve, a teaspoon of grated
    parmesan, pepper, salt, and a tablespoon of milk. Stir in the yolk of an egg and
    present the white, well beaten. Fill the empty potato skins with the mixture which
    ought to rise and puff out in ten or twelve minutes.


    ## TOMATOES A LA SIR EDWARD GREY


    Take some fine firm tomatoes, not ripe. Turn them with the stalk side up and cut
    a slice of the top with a sharp knife. Take out the inside with a teaspoon. Break
    each into an egg, sprinkle with pepper and salt. The inside of the tomato you
    will pass through a fine sieve and it will be a thick liquor; mix it with bread-crumbs,
    salt, pepper, and some grated cheese quite thick. Put this mixture on the top
    of each egg and place all in the oven for three or four minutes, so that the eggs
    are just set and no more.


    [Amie inconnue]

