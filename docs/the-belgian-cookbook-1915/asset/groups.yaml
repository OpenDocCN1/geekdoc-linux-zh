    # PART I


    fresh eggs, add two pats of butter and two small spoonfuls of water to mix it.
    Stir quickly with the spoon, and when the soup has done its eight minutes'' boiling,
    pour it on the egg and butter in the tureen. This is an extremely good soup. It
    is rendered better by a small quantity of Bovril.


    ## CHERVIL SOUP


    Put a bone of veal to cook in water, with four or five potatoes, according to
    the quantity desired. When these are tender, pass them through the turnarmy and
    return them to the soup. Chop the chervil, adding to it half a dessert-spoonful
    of cornflour. After an hour before serving, put in the chervil, but take the cover
    off the pot, so that it remains a good green color. Pepper and salt to be added.


    > [V_. Verachtert, Café Appelmans, Anvers.,_]


    ## A GOOD PEA SOUP


    Soak your peas over-night. The following day boil some fresh water, and throw
    in the peas, adding a few chopped onions and leeks, with pepper and salt. Let
    the soup simmer for three hours on the top of the stove, giving it a stir now
    and then. If you have a ham-bone, that is a great improvement, or the water in
    which some ham has been boiled is a good foundation for the soup, instead of fresh
    water.


    > [Mdlle. M. Schmidt.,_]


    ## WATERZOEI


    This is essentially Flemish soup. Use capers, eels, tench, roach, perches, barb,
    for the reel always of different kinds of fish. Take two pounds of fish, cut off
    the heads and tails, which you will fry lightly in butter, adding to make a mixed
    carrot and onion, three cloves, a pinch of white pepper, a sprig of parsley, of
    a bay-leaf; pour in two-thirds of water and one-third of wine to till more than
    covers the ingredients and let it simmer for half-hour. The pieces of fish must
    be cut to an equal size, and they are placed to cook quickly in this liquid for
    twenty minutes. Five minutes before serving add a lemon peeled and cut into slices
    and the pieces removed. Some the bind sauce with breadcrumbs grated and browned.
    You serve, with this dish, very thin slices of bread and butter. For English tastes,
    the heads and tails should be removed when dressing the dish.


    ## A GOOD BELGIAN SOUP


    is called *crème de sauté*-. One of the most wholesome of vegetables, watercress
    combines admirably with potatoes in making soup. Wash, dry, and chop four ounces
    of the leaves left from the stalks, fry slowly for five minutes or without a thinly-sliced
    onion, add one pound of potatoes in small dice, fry, still slowly without browning;
    pour in one quart of water or thick stock, simmer gently; closely-covered, for
    thirty-five to fifty minutes, stir over a slight heat, and having returned the
    pure to the saucepan with a half-spoonful of castor sugar, salt and cayenne to
    taste, thicken with one table-spoonful of flour stirred smoothly into one breakfast-cupful
    of cold milk; boil up sharply, and serve sprinkled with watercress.


    > [E. Haig.,_]


    ## BELGIAN PURÉE


    Cook two pounds of Brussels sprouts in boiling water. Take them out, drain and
    toss them in butter for five minutes, sprinkle them with a teaspoonful of flour,
    and then cook in gravy (or meat and water), fast boiling, over a good fire, and
    keep the lid of the saucepan off so that they may remain green. Pass them through
    the sieve, leave them in ten minutes, bind the mixture with the yolks of three
    eggs, a pint of milk; then at the last minute dessert–spoonful of butter for each
    pint and half of a soup.


    ## AMBASSADOR SOUP


    A pint and half of fresh peas, or of dried peas that have been soaked for six
    hours in cold water; a leek, and two onions chopped finely. Simmer till the peas
    are tender, then pass all through the sieve. Well-wash some shallot and chop it,
    and add as much will be to taste. In another pan cook tablespoonsful of rice,
    and add that to your soup. Simmer again, stirring it very well. This soup should
    be of a green color.


    > [_Mme. Georges Gouauff._]


    ## CRECY SOUP (BELGIAN RECIPE)


    Take carrots, two onions, one leek, five potatoes, and cook all gently in water,
    with salt and pepper; when they are tender, rub them through the sieve and serve
    it very hot.


    > [_G. Gouff._]


    ## FLEMISH SOUP


    To two pounds of washed and picked Brussels sprouts adds ten potatoes, two onions,
    two leeks, salt, pepper. Cook all gently and pass through a sieve. Add at the
    last moment a sprinkle of chopped chervil.


    > [_G. Gouff._]


    ## TOMATO PURÉE


    Begin by cleaning four potatoes, two leeks, a celery, four carrots, three pounds
    of big tomatoes; wash all these vegetables and cut them in dice, the tomatoes
    a larger. Cook them all gently for an hour in nearly two pints of gravy, to which
    you have added two thick slices of bread and a pinch of salt. Take care of your
    vegetables do not stick to the bottom of the pan. When all is cooked, pass through
    a fine tammy. Add more gravy, or water or meat juice; make it of the consistency
    that you wish. Bring it to the boil over the fire, adding pepper and salt, and
    just before serving a bit of fresh butter also. It is a great improvement to add
    at the last minute of an egg, mixed in a little cold water, quickly stirred in
    the soup is off.


    The three recipes for seven or eight persons.


    > [_G. Kerckaert.__]


    ## ONION SOUP


    Mince some thick onions, five or six, and let them color over the fire in butter.
    Add a dessert–spoonful of flour, sprinkling it in, and the same amount in gravy;
    thicken it with potatoes and when these are cooked, peas, pass all through a sieve.
    Bring the purée to the right consistency with milk, and let it simmer for a few
    minutes before serving, adding pepper and salt.


    > [_Gabrielle Janssens.__]


    ## POTAGE


    Make a good gravy with one and-half pounds of skirt of beef. With half of the
    gravy make a very good purée of peas—if possible the green peas—with the other
    half make a good purée of tomatoes. Combine the two purées, adding pepper and
    salt a dust of cayenne. For each guest add the soup teaspoonful of Madeira wine,
    beat it all well and serve quickly. Or add, instead of Madeira, one dessert—spoonful
    of sherry wine.


    This celebrated soup is honored by the glorious defender of Namur.


    [Gabrielle Janssens,_]


    ## TOMATO SOUP


    Boil through medium potatoes, celery, two leeks, two carrots, and a pound of fresh
    tomatoes, with pepper, salt and a leaf of bay. Pass through the sieve. Fry three
    chopped onions in butter and add the soup to them. Boil up for twenty minutes.
    If you have no fresh tomatoes, the tinned ones can be used, removing the skin,
    at the same time that you had the fried onions.


    [_Mme. van Praet,_]


    ## SOUP, CREAM OF ASPARAGUS


    Boil some potatoes and pass them through the sieve, add the asparagus–tops, with
    a pat of butter for each tins; then the soup with extract of meat and water, and
    at the last moment stir in the raw yolks of two eggs, and a little chopped parsley.


    [_Mme. van Praet,_]


    ## GREEN PEA SOUP


    Put half pound of dry green peas to soak overnight in water, with a teaspoonful-of-bicarbonate
    of soda in it. In the morning take out the peas and put them on the fire in three–and-a–half
    pints of water. When the peas are nearly cooked, add five big potatoes. When all
    is cooked for the skins to come off easily, rub all through a sieve. In some butter
    four or five onions and five or six leeks until they are brown, or frying use
    fat of beef; add the peas and boil together a half-hour. If possible, add a pig’s
    trotter cut into four, which makes the soup most excellent. When ready to serve,
    remove the four pieces of trotter. Little dice of fried bread should be handed
    with the soup.


    [_V. Verachtert,_]


    ## VEGETABLE SOUP


    Fry four onions till they are brown. Add them to three pints of water, with four
    carrots, a crust of white bread, five potatoes, celery and a bunch of parsley,
    which you must take out before passing the soup through the sieve. A few tomatoes
    make the soup better; if they are tinned, do not add them till after the soup
    has passed through the tammy; if they are fresh, put them in with the other vegetables.
    Simmer for an hour, add pepper and salt serving.


