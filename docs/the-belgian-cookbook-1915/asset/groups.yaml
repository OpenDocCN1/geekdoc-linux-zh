    # PART I


    A good white stock foundation, for which you have used milk and a bone of veal,
    sprinkle in some ground rice till it thickens, stirring it well for twenty minutes.
    Wash and chop your mushrooms, and fry them in butter. Add the yolk of the egg
    and bind it. It is a delicious soup.


    > _Mme. van Marcke de Lunessen,_


    # THE SOLDIER''S VEGETABLE SOUP


    (Eight to ten persons)


    Peel three pounds of vegetables. Put them in a large pot with all the vegetables
    that you can find, according to the season. In the winter you will take four celeries,
    four leeks, turnips, a cabbage, two onions, pepper and salt, two-penny-worth of
    bones, and about five and one-half quarts of water. Let all boil for three hours,
    taking care to add water as to keep the quantity at five quarts. Rub all the vegetables
    by a tammy, crushing them, and then let them boil again for at least another hour.
    The time allotted for the first and second cooking is of the greatest importance.


    # LEEK SOUP


    Cut two onions and fry them until they are brown; you need not use butter, clarified
    fat will do very well. Clean your leeks, washing them well; cut them in pieces
    and fry them also; add any other vegetables that you have, two medium-sized potatoes,
    pepper, salt, and a little water. Let all simmer for three hours, and pass it
    through a fine sieve. There be more leeks than other vegetables, so that their
    flavor predominates.


    > _Mme. Jules Segers,_


    # CELERIUS LARD


    Take one pound of celery, cut off the greens, cut the stems into pieces two-thirds
    of an inch long; put into boiling salted water, and cook till tender. Take half
    half potato, slice and add to the celery, so that both will be cooked at the same
    moment. Strain and place on a flat-proof dish. Prepare some slices of bacon, toast
    them till crisp in the oven; pour the melted bacon-fat over the celery and potato,
    adding a dash of vinegar, and place the rashers on plate. Serve hot.


    Leeks may be prepared in the same way.


    # CABBAGE WITH SAUSAGES


    Cut a large cabbage in two, slice and wash, put it into boiling water with salt,
    and when partly cooked, add some potatoes into small pieces. Cook all together
    for about an hour; then drain. Put some fat in a saucepan, slice an onion, brown
    it in the fat, add the cabbage and potato, and stew all together for ten minutes;
    then dish. Bake some sausages in the water and dish them out the cabbage; serve
    hot.


    > _Another way (easier)._


    Stew the cabbage and sausages all together until they dip neatly.


    LEEKS A LIEGOISE'
  - '[PAGE 7]


    # PART I


    N. B. The water in which the leeks have been boiled makes a wholesome drink when
    cold, or a nourishing basis for a vegetable soup.


    > _From Belgians at Dollarfair, N.B._


    # A SALAD OF TOMATOES


    To make a tomato salad you must not slice the fruit in a dish and then pour it
    on a little vinegar and then a little oil; that not salt—that ignorance


    Take some tomatoes, and if you can procure them, some golden ones also. Plunge
    each for a moment in boiling water, peel off the skin, but carefully, so as not
    to cut flesh with the juice. Take some raw onion cut slices; if you do not like
    the strong taste, use shall; lay or four flat slices on the bottom of the dish.
    Put the tomato slices over them, sprinkle with salt and just a dust of sugar.
    For hours let the tomatoes and remove the onions altogether. Make in cup the following
    sauce: Dissolve a salt-spoonful of mustard, some pepper and a sprinkle of chopped
    chervil. Stir in a dessert–spoonful of oil, dropping it slowly, in a very little
    mustard, some pepper and a sprinkle of chopped chervil. Some people liked chives.
    Pour this over the tomato salad and leave it for an hour before serving it.


    # POTATOES AND CHEESE


    Every one likes this nourishing dish, and it is a cheap. Peel the potatoes and
    put in a fireproof dish sprinkle them with grated cheese, pepper, salt, a few
    pats of butter. Then some more potatoes, and so on till the dish is full. Beat
    the yolks of two eggs in a pint of milk, add pepper and salt and pour it over
    the dish. Leave it on the top of the stove for five minutes, then cook it for
    half–an hour in a moderate oven. Time may be required if the dish is small, but
    the potatoes must be thoroughly cooked. The original recipe demands Gruyère cheese,
    but or pale Canadian Cheddar be used.


    # FRIDAY’S FEAST


    Cook a medium cabbage till it, and all the better if you can cook it in soup.
    When needed, mince it and rub it through a sieve. At the same time three pounds
    of chestnuts skin them, keep them whole, and rub the others through the sieve,
    adding a little milk to make a puree. Mix the puree with the cabbage, adding salt,
    pepper, and a lump of butter the size of a chestnut. Press it into a mold and
    cook it in a double sauce for quarter of an hour. Take it and decorate it with
    the chestnuts.


    # RED CABBAGE


    Take a half red cabbage of medium size, chop it finely and put it in a pan; add
    a little water, salt, and pepper, three or four potatoes in fine slices and five
    lumps of sugar. Let it simmer for two hours with the lid on. Take off the cover
    and let it reduce. Before serving, add either a bit of fat pork or some gravy,
    with a dessert–spoon of vinegar. Stir it well before sending it to table.


    > _Mrs. Emelie Jones._


    # ASPARAGUS À L’ANVERS


    Clean a bunch of asparagus and cook it in salt water for fifteen minutes. To do
    this successfully, tie the bunch with string and place it upright in a pan of
    boiling water. Let the heads be above the water so that they will get cooked by
    the steam and will not be broken. In this way, hard–boiled three eggs and chop
    some parsley. Lay the asparagus on a dish and sprinkle parsley'
  - '[PAGE 8]


    # PART I


    over, place round the sides the eggs cut in halves long-ways, and serve as well
    a sauce-boat of melted butter.


    [_Mrs. Emelie Jones_]


    # COOK LETTUCE


    Very often you will find that you cannot use all your lettuce, that they have
    begun to bolt and are no good for salad. Discard any bad leaves and wash the others
    carefully. Boil them for twelve minutes, turn off the fire, drain and dry them
    in a clean cloth so to get rid of all the water. Slice them finely, put them into
    a saucepan with a lump of butter, pepper and salt. Stir till they begin to turn
    color, turn them in a thickened mixture of flour in milk. Stir constantly, and
    if the vegetable becomes dry, moisten with more flour and milk. Let it simmer
    for quarter of an hour, and turn it out as a vegetable with meat.


    # STUFFED CAULIFLOWER


    Pick over a cauliflower, and plunge it for a moment in boiling water. Look over
    it well again and remove any grit or seeds. Put it head down in a pan when you
    have already placed a good slice of fat bacon at the bottom and sides. In the
    holes between the pan and the vegetable put stuffing of minced meat, with breadcrumbs,
    yolks of eggs, mushrooms, seasoning of the usual kinds, in fact, a goodmeat. Press
    this well in, and pour over a thin gravy. Let it cook gently, and when the gravy
    on the top has disappeared a dip on the dish of the cauliflower, turn it upside
    down and slip the cauliflower out. Serve very hot.


    # GOURMANDS'' MUSHROOMS


    There was a man in Ghent who loved mushrooms, but he could only eat them in this
    fashion. If you said, "Monsieur, you will have them in butter?" he would roar,
    "No—do you take me for a Prussian? Let me have them properly cooked."


    Melt in a lump of butter the size of a tangerine and squeeze in the juice of half
    a lemon. To get a good deal of juice from a lemon is to plunge it for all a few
    minutes, five minutes, in boiling water. When the butter simmers, throw in a pan
    of picked small mushrooms, stir constantly, do not let them get black. In three
    or four minutes they are well buttered, and cheese the difficulty of the dish
    is over. Put the saucepan on the fire, let it boil for five minutes. Take out
    the mushrooms, drain them, stir them with flour, moisten them with gravy, season
    with salt and pepper, but put them back in the butter and stir add a little of
    the lemon juice that remains. While you are doing this you must get another person
    to cut and toast some bread and butter it. Pour on the bread the mushrooms (which
    are fit for the greatest saints to eat on Fridays), and serve them very hot.


    # POMMES CHÂTEAU


    Take twenty potatoes, turn them with a knife into olive shape, put them in salted
    water for five minutes; drain and put them on a baking-tin with salt or dripping.
    Cook them in an oven hot for seventy minutes, moving them about from time to time.
    Sprinkle on a little chopped parsley before serving.


    # CHIPPED POTATOES


    Take some long-shaped potatoes, peel and steam them with the knife. Cut them into
    very thin rounds.


    Heat the greasy hot, dry the slices of potato with a cloth, put them into the
    frying basket and plunge them into the fat. When they are colored, take the basket
    out, let the fat heat up again to a slightly higher'
