    > _Mme. E. Maes_]


    # SCRAPS OF MEAT


    Your scraps of meat must be small or roughly minced; add to them a little sausage-meat,
    about a quarter as much, and a slice of white crumb bread that you have dipped
    in water or milk, and well drained. If eggs are not too dear, add two eggs, mixing
    them with the meat. Place the dish in the oven for half-an-hour—but it must be
    a slow oven—and take care that the meat does not become dry.


    > _V. Verachert_]


    # FRICADELLE


    For one pound of minced pork take one-and-half pounds of minced veal; cut three
    slices of white bread the thickness of nearly an inch, and crumble them up; two
    eggs, pepper and salt. Mix it all well, and place it it in the oven for half-an-hour.
    If you eat this hot, serve it with a gravy sauce. If you wish for a supper-dish,
    put salad under the meat.


    # CHICORY AND HAM WITH CHEESE SAUCE


    Cook the chicory gently in butter until they are done. Then take each one, and
    roll it in a slice of ham, and put them in a fireproof dish. Make a very good
    white sauce of flour and butter, milk, adding cheese to flavor it strongly, and
    the yolk of an egg. Pour this sauce over the chicory, and place the dish in the
    oven. Let it turn brownish, and serve it directly.


    > _Mme. Vandervalle]


    # CROQUETTES OF VEAL


    Make first of all a very thick sauce of flour, milk, and butter, not forgetting
    also salt and pepper; when it is very thick added Gruyère cheese, in the proportion
    of a heaped teaspoon of to a breakfast-cupful of sauce. Take it off the fire,
    and stir in all the juice of a lemon, and then the yolk of an egg. Let it get
    cold. Pence it finely your veal, or, indeed, any lean meat. Mix it well with the
    sauce, and make croquettes of it. Then roll each in the white of egg that you
    have left, and then in grated breadcrumbs, and fry in deep fat.


    > _Mme. Vandervalle_]


    # ENTREE (CROQUE-MONSIEUR)'
