    thyme, the thin rind of half a lemon, and pepper; if you use tarragon vinegar
    for the better. Clean the sprats, remove tails and heads, and lay them in a deep
    dish. Take liquor and pour over the fish, tie a large paper over all, and let
    them bake in a cool oven for two or three hours; cook as required. Put aside to
    cool, and take out the fish to use as needed.


