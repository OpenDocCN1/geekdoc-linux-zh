    # PART I


    side. This excellent dish has received distinction from its name, from that of
    herotic and ingenious burgomaster of Brussels.


    [_M. Stuart._]


    # RABBIT A LA BORDELAISE


    Cut a rabbit into joints, cover with vinegar, chop finely two small onions, thyme,
    pepper, and salt, and a little nutmeg; let all soak for twenty-four hours.


    Take out the joints and brown gently in a little dripping; when all are nicely
    browned take one cupful of the marmalade and stew till one and a half to two hours.
    When ready, strain off the sauce, thicken nicely with flour, dish the rabbit,
    and pour over the sauce.


    # LAEKEN RABBIT


    Take a medium-sized rabbit, and have it prepared and cut into joints. The pieces
    to soak for forty-eight hours in vinegar, cover them, with a sprinkle of fat bacon
    in it and a small onion sliced finely. After forty-eight hours, put one-quarter
    pound of bacon, sliced in a pan and when it has melted, take out any that remain,
    and add to the meat a bit of butter as big as an egg, which let it melt to froths;
    sprinkle in a dessert-spoon of flour. Stir it over the fire, mixing well till
    the sauce becomes brown, then put in your marinated pieces of rabbit. Add pepper
    and salt and cook each piece well colored on each side. When they are colored,
    add the bunch of thyme, the sliced onion and half the vinegar that you used for
    soaking; three-leaves, one dozen dried and dry prunes, five lumps of sugar, half
    a pint of water. Cover closely and let it simmer for two hours and a half.


    [A Belgian at Droitwich.]


    # RABBIT


    Put the back and hind legs of one or two rabbits in an oven, covering the first
    with a layer of butter (half inch thick) and then with a layer of French mustard,
    pepper and salt. Roast by a good fire for one hour, bas often with the juice from
    the meat and the gravy.


    # HARE


    To be in a pan in the oven: sauce, butter, and a quarter of a pint of cream, pepper,
    salt and some flour to thicken the sauce. Before the hare is in the oven, cover
    it with a thin slice of bacon, which must be taken before the hare is brought
    to table.


    [_Mdlle. Breakers._]


    # RUM OMELETTE


    This simple dish is much liked by gentlemen. Break five eggs, sweetened with caster
    sugar, pour in a sherry glassful of rum. Beat them very hard till they froth.
    Put a bit of fresh butter in a shallow pan and pour in your eggs. Let it sit on
    the fire just three minutes and slip it off to a hot dish. Powder it with sugar,
    as you take it to the dining-room. At the dining-room door, set a light to a big
    spoonful of rum and pour it over the omelette. It is almost impossible to light
    a glass of rum in a hurry, for your omelette, so use a kitchen spoon.'
  - '[PAGE 21]


    # PART I


    # 22


    # THE CHILDREN''S BIRTHDAY DISH


    Boil a quart of milk, sweeten it with nearly half a pound of sugar, and flavor
    with vanilla. Let it get cold. Beat up six eggs, yolks and whites, mix them with
    the milk, put it all in a fireproof dish and cook very gently. Cover the top before
    you serve it with ratatfia biscuits.


    # A FRANGIPANI


    Put your saucepan on the table and break in two eggs. Mix these with two dessertspoonful
    of flour. Add a pint of milk, and put it on the fire, stirring always one way.
    Let it cook for a quarter of an hour, stirring with one hand, with the other sprinkle
    in powdered sugar and ground almonds. Turn out to get cold, and cut in squares.


    # APRICOT SOFFLÉ


    This is good enough for an English "dinner–party." Beat the whites of six eggs
    stiffly. Take four dessert–spoonful of apricot jam, or an equal quantity of dried
    apricots that have been soaked and stewed to a puree. If you use jam, you need
    not add sugar. If you use the dried apricots, add sugar to sweet. Butter a dish
    at the bottom, and when you have well mixed with the beaten whites and apricot,
    put it in a pyramid on the dish and bake for fifteen minutes in a moderate oven.
    Powder with sugar.


    # STEWED PRUNES


    Prunes are very good this way. Take a pound of prunes, soak them twenty–four hours
    in water. Put them on the fire with a cup of water and half a bottle of light
    red wine, a pound of sugar and, if you like, a pinch of cinnamon or mixed spice.
    Let it all stew until the liquor is reduced and the prunes are well flavored.
    Let them get cold, and serve them in a glass dish with whipped cream.


    # CHOCOLATE CREAM


    Take the whites of six eggs and beat them stiff, first one and then another, adding
    to them three soup–spoonfuls of powdered sugar and three sticks of chocolate that
    you have grated. If you have powdered chocolate by you, use that, and add to the
    mixture when it is well flavored. Mix it all well in a cool place. To do this
    dish successfully, make it just before you wish to serve it.


    [Mdlle. Lust, of Brussels._]


    # SEMOLINA SOFFLÉ


    Boil two pints of milk and fifteen lumps of sugar with a bit of vanilla. Add three
    soup–spoonfuls of semolina, and let it boil for fifteen minutes, while you stir.
    Take it from the fire, and add it to the yolks of two eggs and their whites that
    you have beaten stiffly. Put it in the oven for a quarter of an hour, and serve
    it hot.


    [Mdlle. Lust, of Brussels._]


    # SNOWY MOUNTAINS


    Butter six circular rusks, and put them on a layer of jam. Beat the whites of
    three eggs and place them on the rusks in the shape of a pyramid. Put them in
    the oven and color a little. They must be served hot.'
  - '[PAGE 22]


    # PART I


    [Mdlle. Lust, of Brussels.,_]


    # RICHELIE RICE


    Put three-spoonfuls of Carolina rice to swell in a little water, with a pat of
    butter. When the rice has absorbed all the water, add a pint of milk, sugar to
    sweeten, a few raisins, some chopped orange-peel, and any other preserved fruit.
    Put all on the fire, and when the mixture is cooked the rice ought to be creamy.
    Add the yolk of an egg, stir, and pour all into a pint. To cool. Turn it out,
    and serve with the following sauce, which was poured on the shape.


    A pint of milk, sugar, and vanilla; let it boil. Stir a soup-spoonful of cornflour
    in water till it is smooth, mix it with the boiling milk, let it boil while stirring
    it for a few minutes, take it from the fire, add the yolk of an egg, and pour
    it on the rice shape. Serve when cold.


    [Mdlle. Lust, of Brussels.,_]


    # EXCELLENT PASTE FOR PASTRY


    Equal quantities of butter and flour, well mixed in a little beer; also a pinch
    of salt. Make this paste the day before you require it; it is good for little
    patties and tarts.


    [Mdlle. Le Kent.,_]


    # CHOCOLATE CREAM


    (No. 2)


    Melt four penny tablets of chocolate in hot milk till it is liquid and without
    lumps. Boil up a pint of milk with a stick of vanilla, a big lump of butter (size
    of a walnut) and ten lumps of sugar. When this boils, add the chocolate and keep
    continually. Then take the yolks of three eggs and beat them; it is better to
    have these beaten before, so as not to interfere with the stirring of your mixture.
    Add your three yolks and stirring, always in the same way. Pour the mixture into
    a mold that has been rinsed out in very cold water, and let it stand in a cool
    place till set.


    [Mrs. Emelie Jones.,_]


    # BELGIAN GINGERBREAD


    1/2 pound cornflour 1/4 pound butter 1/4 pound white sugar 1 or 2 eggs 1/2 ounce
    ginger powder.


    Work all the ingredients together on a marble slab, to get the paste all of the
    same consistency. Make it into balls as big as walnuts, flattening them slightly
    before putting them into the oven. This sort of gingerbread keeps very well.


    [L. L. B. d''Anvers.,_]


    # APPLE FRITTERS


    Put half pound of flour in a deep dish and stir it with butter, beating it till
    there are no lumps left. Make it into a paste that is not very liquid. Peel and
    core some good apples, cut them into rounds, put them in the paste so that each
    one is well covered. Have a pan of boiling fat and fry the slices for two minutes.
    They ought to be golden by then, if that fat has been hot enough. Serve them dusted
    with powdered'
  - '[PAGE 23]


    # PART I


    sugar and the juice of half a lemon squeezed on them.


    [_Mme. Delahay_]


    # FOUR QUARTERS


    Weigh four fresh eggs and put them in an earthenware dish. Add successively, sieved
    flour, fine sugar, and fresh butter, each of these items being of the same weight
    of the eggs—hence the name: Four Quarters. With a wooden spoon, work these four
    ingredients, let them rest for five minutes. Turn it all into a buttered mold
    and cook it for five quarters of an hour in a gentle oven or in a double saucepan.
    Turn it out, and eat it cold or hot with fruit.


    [Georges Kerckaert.]


    # SAFFRON FRITTERS


    Wash the rice in cold water, heat it in a little water and add a dust of salt.
    Flavor some milk (enough to cover the rice) with vanilla, and pour it on the rice.
    Let it cook in the oven for an hour and a quarter. Take it from the fire, and
    stir in the yolks of two eggs, or of one, if wished. Sweeten the whole with sugar,
    and color it with a little saffron. Turn it out, and let it get very cold.


    [Paquerette.]


    # SEMOLINA FRITTERS


    Quarter pound semolina, and a half pint of milk, three eggs. Put on the milk,
    and as it is boiling, drop the semolina in a shower. Let it boil for a few minutes,
    stirring continuously. Then add the yolks of three eggs, and the whites, which
    you have already beaten stiff. Pour all on a dish, and cool. Have some boiling
    water (it is boiling when it ceases to bubble), and throw into it spoonful of
    the mixture. When they are fried golden, take out, drain them a moment, and sprinkle
    on some sugar water.


    [_Mme. Segers.,_]


    # SPECULOOS


    (A Brussels recipe


    Pound half pound flour, four ounces brown sugar, three and a half ounces butter,
    a pinch of nutmeg, and the of mace and cinnamon in powder. Add, as well, a pinch
    of bicarbonate of soda. Make the paste into a ball, and cover it with a fine linen
    or muslin cloth, and leave it till the following day. If you have no molds to
    press it in, cut it into different or different shapes, and cook them in the oven
    trays. Believe waffles can be bought in London.


    # GAUFRES FROM BRUSSELS


    Mix in an earthen half pint of flour, five yolks of eggs, a coffee—spoonful of
    castor sugar, half pint of milk (fresh), adding a pinch of salt and vanilla; then
    ounces butter melted over hot water. Beat up the whites of four eggs very stiff,
    and add them. Use a baking-tin or sheet (since English have not got a gauf-iron,
    which is double and closes up), and pour in your mixture, spreading it over the
    sheet. When the gaufre is nicely browned, take out and powder it with sugar. But
    to render this recipe absolutely successful, the correct implement is necessary.'
