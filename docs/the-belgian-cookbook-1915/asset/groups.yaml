    # PART I


    # 38


    This purple fruit is, like the tomato, always cooked as a vegetable. It is like
    the brinjal of the East. It is hardly necessary to give special recipes for the
    dressing of aubergines, for you can see their possibilities at a glance. They
    can be stuffed with white mince in a white sauce, when you would cut the fruit
    in half, remove some of the interior, fill up with mince and sauce, replace the
    top, and bake for twenty minutes, or simply cut in half and stewed in sauce, with
    pepper and salt they are good, or if you can simmer them in water and when ready
    to serve, pour them a white sauce as vegetable marrow. If they are cheap in England
    the following entrée would be expensive and would look like


    ## EGG PLANTS AS SOFFLÉ


    Wash the fruit, cut lengths, remove the inside. Fill each half with a mixture
    of beaten egg, grated cheese, and some fine breadcrumbs, and a dash of mustard.
    Put the halves to bake for a quarter of an hour, or till the soufflé has risen.
    When cooked place it in an oval dish with a border of rice turned out from a border.


    ## POTATO CROQUETTES


    Cook your potatoes, rub them through the sieve, add pepper and salt, to two or
    three eggs, lightly beaten, mixing both yolks and whites, and according to the
    quantity you are making a little butter and milk. Work all well and let it get
    cold. Roll into croquettes, roll each in egg, then in finely grated breadcrumbs,
    and let them cook in boiling fat or oil.


    > [Madame Emelie Jones._]


    ## PURÉE DE CHESTNUTS


    Make a little slice in each chestnut, boil them then, put them in another pan
    with cold water in it and replace them on the fire. Peel them by one as you take
    them out, and rub through a sieve, pounding them first to make it easier, add
    salt, a good lump of butter and a little milk to make a nice purée. This is very
    good to surround grilled chicken or turkey legs, or for a salmi of duck or hare.


    ## HORS DOEUVRES


    The attractive "savory" of English dinner tables finds its counterpart apparently
    in egg and fish dishes served cold at the beginning of a meal, and therefore what
    we call hors d''oeuvres.


    ## POTATO DICE


    Boil your potatoes and let them be of the firm, soapy knot, not the floury kind.
    When cooked, and, cut them into dice, and toss them in the following sauce:


    Take equal quantities of salad oil and cream, a quarter of that amount of tarragon
    vinegar, a pinch of salt, and a few chopped peppers. Mix very well, and pour it
    on dice. You may vary this by using cream only, in which case omit the vinegar.
    Season with pepper, salt, celery seed, and instead of capers take pickled nasturtium
    seed, and that, finely minced, remain in the sauce for an hour before using it.


    ## ANCHOVIES


    Fillets of these, put in a lattice over mashed potato look very nice. Be sure
    you use good anchovies preserved in salt, washed and soaked to take away greater
    part of the saltiness; or, if you can make some toast butter it when cold, cut
    it into strips, and lay a fillet in the center. Fill up the sides of the toast
    with chopped hard–boiled yolk of egg.


    ## ANCHOY SANDWICHES


    Cut some bread and butter, very thin, and in fingers. Chop some water–cress, lay
    it on a finger, sprinkle a little Tarragon vinegar and water (equal quantities)
    over it, and lay it on a fillet of anchovy, cover with more cress and a finger
    of bread and butter. Put it in a pile under a plate to flatten and before trimming
    the edges.


    ## ANCHOY ROUNDS


    Make some toast, cut it in rounds, butter when it cold. Curl an anchovy round
    a stewed olive, and put it on the toast. Make a little border of egg.


