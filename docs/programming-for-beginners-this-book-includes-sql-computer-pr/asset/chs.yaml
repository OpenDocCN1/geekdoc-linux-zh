  \ | 24 | 男性 | O+ | 48963214 |\n| 1 | Tom | 20 | 男性 | O+ | 123589746 |\n\n在本章中，我们学习了如何根据条件过滤记录。我们还学习了如何使用运算符和\
  \ `WHERE` 子句来实现这些条件。最后，我们涵盖了如何使用 `ORDER BY` 子句按升序和降序对数据进行排序。\n\n# 结论\n\n好了，我们已经到了最后。我希望你在开始读这本书时是一个中中高级的\
