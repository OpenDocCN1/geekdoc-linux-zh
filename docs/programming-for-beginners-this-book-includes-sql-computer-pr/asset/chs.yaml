  \n即使你最终没有从事编程，你的 `SQL` 知识也会大有用场。例如，如果你成为一名作家，你可以建立自己的网站；作为一名艺术家，建立自己的在线作品集。如果你最终成为一名经理，你将比那里的任何人都更擅长与开发团队交流，从而确保你顺利升职。\n\
