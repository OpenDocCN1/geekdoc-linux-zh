  \ Instagram 账号。\n\n### 黑客历史\n黑客行为可以追溯到 20 世纪 60 年。1961 年，麻省理工学院（MIT）的一群学生黑入了他们的模型火车以修改其功能。这个词就源于此。因此，“黑客”一词甚至与计算机没有直接关系！最初，黑客的意思是探索和改进某些东西。\n\
  \n20 世纪 70 年代，电话黑客（或“phackers”）首次亮相，他们利用手机中的操作特性来获取免费电话，尽管他们相当罕见。在当时，计算机黑客还不流行，因为很少有人拥有个人电脑。\n\
  \n这种情况在 20 世纪 80 年发生了变化，个人电脑的普及催生了第一批计算机黑客。这并不意外，因为只要有产品，就一直有人愿意通过摆弄产品来牟取便利。同样，当有人摆弄产品时，就会有人来保护它。计算机黑客的诞生也导致了伦理黑客的诞生。80\
  \ 年代是我们第一次看到黑客入侵系统并将其用于个人利益的十年。\n\n这种新类型的犯罪自然需要新的立法。1986 年，《联邦计算机欺诈和滥用法》首次被编写。该法规定，任何人访问由金融机构、政府机构或涉及外国贸易或通信的组织所使用的计算机都是犯罪。这主要是由普通大众使用\
  \ PC 的增加所引起的。\n\n20 世纪 90 年代的标志是第一批与黑客相关的知名逮捕。凯文·米特尼克（Kevin Mitnick）、凯文·波尔森（Kevin\
  \ Poulsen）、罗伯特·莫里斯（Robert Morris）和弗拉基米尔·列文（Vladimir Levin）是首批因盗取财产软件以及领导数字劫持被捕的人。这时，“破解者”（crackers，意指那些“破解”数字加密代码（如密码等）的人）这一词开始使用。\n\
  \n20 年代后期，eBay、Amazon 和 Microsoft 等大公司的黑客攻击经常占据头条新闻。当 2000 年初的消息传出，国际空间站系统被 15 岁的乔纳森·詹姆斯（Jonathon\
  \ James）入侵时，情况尤为如此。\n\n## 1. 伦理黑客\n在现实案例中，你会把伦理黑客称为群体中的消防员；他们扑灭火灾并拯救无辜的生命。他们通常受政府或执法机构聘用，保护数据并解决对个人或企业造成的任何伤害。小型企业也可以聘佣伦理黑客，以保护被恶意使用或受恶意黑客攻击的公司数据。\n\
  \n### 非伦理黑客 - 破解者\n非伦理黑客又被称为破解者（cracker），是在所有者不知情或未经许可的情况下进入设备非法获取信息和资产的犯罪分子。这种攻击意图是恶意的。这种黑客会导致财务损失、盗取机密、侵吞资金、破坏业务以及传播错误数据等。\n\
  \n### 灰帽\n还有一种黑客既不完全伦理也不完全不伦理；他是那种为了救济人而偷东西的人。他处于其他两种黑客之间的灰色地带。这个灰色地带就是“灰帽”名称的来源。灰帽黑客的一个例子是：被聘用保护特定数据库，然后利用该访问权限获取机密数据用于个人利益。你可能认为他们不是罪犯，但他们很快就不会获得任何奖章了。你有“黑客行动主义者”（hacktivists），例如\
  \ Anonymous 等组织，他们利用黑客传递政治和社会信息。最后是“小儿”（kiddies），即使用现成工具访问系统的非专业人员。比如你猜某人的 Facebook\
  \ 密码，只想看看他们昨晚是否在他们所说的地方。\n\n## 2. 黑客类型\n如你所见，黑客攻击并不是猜别人的密码并登录账号那么简单。实际上，你有许多需要熟悉的黑客攻击类型。\n\
  \n### 网络钓鱼 (Phishing)\n网络钓鱼（phishing）的概念源于日常的钓鱼活动。这类攻击使用电子邮件（有时是电话）假装合法机构，获取可能损害个人或企业的重要信息。因此，他们抛出钩来“钓”受害者。这通常是先告诉受害者他们是受信任的组织，然后索要加密数据。\n\
  \n第一起网络钓鱼诉讼于 2004 年提起，针对一名加州青少年，该青少年创建了一个名为“America Online”的网站副本，从中获取访问者的信用卡信息。最早且最流行的网络钓鱼邮件之一是臭名昭著的“尼日利亚王子”邮件，那是来自一位陷入困境的“王子”，需要你的帮助来取回他的百万资产。今天，我们大多数人不会落入尼日利亚王子诈骗，但网络钓鱼仍然存在，并给数百万互联网用户带来麻烦。常见的钓鱼邮件大多容易识别。它们具有紧迫感、异常的发件人以及可疑的超链接。当网站被复制并看起来和真的一样时，情况就会变得复杂。银行网站通常是网络钓鱼的目标，因为它们拥有大量的信用卡号和敏感信息访问。\n\
  \n### 病毒\n病毒的目的是破坏网站上的资源。就像人体一样，病毒可以改变形态、破坏“健康”程序并自我传播。就像我们之间一样，有很多病毒可以攻击你的恶意软件。\n\
  \n顶级加密器病毒（Topher Crypter Virus）是最危险的病毒类型之一，因为它能够完全接计算机，导致更多病毒的传播。加密器病毒的一个著名例子是木马病毒（Trojan\
  \ Virus）。\n\n\n\n\n变态病毒（Metamorphic Virus）可以编写、重写和编辑自己的代码。它是最具传染性的病毒，如果不及早检测，可能会对计算机和数据造成巨大的破坏。\n\
  \n多态病毒（Polymorphic Virus）与变态病毒相似，但它是复制自己；变态病毒可以重写代码，而多态病毒只是对原始代码进行微调后复制。\n\n宏病毒（Macro\
  \ Virus）使用 `Microsoft Word` 或 `Excel` 等软件程序相同的语言编写。每当打开应用程序时，它都会启动一系列自动操作。\n\n集群病毒（Cluster\
  \ Virus）会让系统中的每个程序看起来都受到了影响，但实际上系统中只有一个一个程序受了影响。它产生了集群的幻象，可以通过找出病毒的原始“载体”来移除。\n\n\
  隧道病毒（Tunneling Virus）针对杀毒软件运行。它位于后台并处于杀毒软件之下。当杀毒软件检测到病毒时，杀毒软件会尝试重新安装自己，结果却作为隧道病毒安装。\n\
  \n隐形病毒（Stealth Virus）利用其机制避免杀毒软件的任何检测。隐形病毒会隐藏在内存中并隐藏它对任何文件所做的任何更改。\n\n扩展病毒（Extension\
  \ Virus）会隐藏在网站或浏览器扩展中并通过那里创建更改。\n\n## Cookie 窃取\n\nCookies 是存储在你的计算机上的文件，浏览器利用它们保存有关你访问的网站或所执行操作的有用信息。会话\
  \ Cookie 是临时的，关闭浏览器后就会删除。某些 Cookie 会一直存在你的浏览器中，直到你手动删除它们或它们过期（可能需要多年）。这些被称为持久性 Cookie（persistent\
  \ cookies）。\n\n网站使用 Cookie 修改你的浏览体验，以适应你的需求并进行适当广告投放。黑客利用 Cookie 窃取来获取这些信息。Cookie\
  \ 是破解最自然的方法之一，它们可以通过公共 Wi-Fi 网络被窃取！\n\n## UI 欺骗\n\nUI 欺骗（UI redress），也称为点击劫持（clickjacking），是通过屏蔽点击来为另一个网站获取点击。用户可能认为他们正在点击一个简单的链接，但由于点击劫持，他们会被重定向到一个完全不同的网站。黑客正在“劫持”点击。这可能会迅速失去控制，因为用户会点击诸如“赢得免费假期”之类的链接，然后重定向到共享页面，导致点击劫持在社交媒体或电子邮件上大规模传播。\n\
  \n## DNS 欺骗\n\n域名服务器欺骗（Domain name server spoofing）是一种攻击，通过将点击重定向到欺诈网站来接管域名。一旦到达那里，用户会被认为他们正在使用用户名和密码登录原始网站，但实际上，他们正在将信息交给执行\
  \ DNS 欺骗的黑客。执行 DNS 欺骗有几种方法，例如中间人攻击（服务器和用户之间的交互被偏离）或 DNS 服务器被攻破（直接攻击服务器）。\n\n上述示例都是恶意黑客使用的黑客类型，但伦理黑客也使用这些方法。为了防止和“治愈”这些攻击，伦理黑客必须了解它们的工作原理，这就是为什么伦理黑客必须接受所有用到的黑客类型和方法的教育。\n\
  \n成为黑客需要技能，讽刺的是，不道德和合理的黑客将使用相同的教育和工具。唯一的区别在于，其中一个将他们的“力量”用于恶，而另一个用于善（或介于两者之间）。这就像现代版的经典英雄与反派组合蝙蝠侠和小丑。为了成为一名成功的伦理黑客，你也必须理解恶意破解。\n\
  \n## 2. 伦理破解的意义与类型\n\n伦理破解（Ethical Hacking）是一项批准的常规工作，旨在绕过框架安全区分系统中潜在的信息泄露和危险。声称拥有框架或系统的允许网络安全专家执行此类活动，以测试框架的保护措施。通过这种方式，与恶意破解完全不同，这种程序是经过安排、确认且而且是合法的。\n\
  \n伦理程序员计划检查框架或系统，寻找恶意程序员可以滥用或破坏的弱点目标。他们收集并分析数据，以理解加强框架/组织/应用程序安全的方法。因此，他们可以增强安全状况，使其更有可能抵御攻击或重定向攻击。\n\
  \n伦理破解的行为被称为“白帽”（White Hat）破解，执行此类操作的人员被称为白帽程序员。与伦理破解相反，“黑帽”（Dark Hat）破解描述的是包括安全违规在的工作。黑帽程序员利用非法程序处理框架或破坏数据。\n\
  \n与白帽程序员完全不同，“灰帽”（Dim Hat）程序员在进入你的框架之前不请求授权。尽管如此，灰帽与黑帽也不完全相同，因为他们不是为了任何个人或外部利益而进行破解。这些程序员没有恶意意图，仅出于娱乐或其他原因破解框架，通常会向所有者报告他们发现的任何风险。黑帽破解和黑帽破解都是非法的，因为两者都建立了未经授权的框架破入，尽管这两类程序员的目标有所不同。\n\
  \n区分白帽和黑帽程序员的最理想方法是研究他们的意图。黑帽程序员受恶意目标启发，表现为个人增益、利益或挑衅；而白帽程序员则是寻找并修复漏洞，以防止黑帽利用。\n\
  \n区分白帽程序员和黑帽程序员的不同方法包括：\n\n- **所使用的程序**：白帽程序员复制恶意程序员追求的策略和技术，以发现框架的不一致之处，模拟所有的最后手段以发现框架攻击是如何发生或可能发生的。如果他们在框架或系统中发现了弱点，他们会迅速报告并修复该缺陷。\n\
  - **合法性**：尽管白帽破解追求的是与黑帽破解相似的程序和策略，但只有一个是合法的。黑帽程序员通过未经许可进入违反法律。\n- **所有权**：白帽程序员被组织用于进入其框架并识别安全问题。黑帽程序员既不拥有框架，也不为声称拥有的人工作。\n\
  \n## 伦理黑客的工作与职责\n\n伦理黑客必须遵循某些规则以合法地进行破解。一名良好的程序员知道自己的责任并遵守大多数伦理规则。以下是伦理破解最重要的原则：\n\
  \n伦理程序员必须寻求框架所有者的批准。程序员在对框架或系统进行执行任何安全评估之前，应获得完全许可。\n\n确定评估范围并将计划告知组织。\n\n报告在框架或系统中发现的任何安全漏洞和漏洞。\n\
  \n保持他们的发现机密。\n\n在检查框架的任何弱点之后，消除所有破解痕迹。这防止了恶意程序员通过这些特殊条款进入框架。\n\n\n\n\n\n# 道德黑客概述\n\
  \n道德黑客是一个需要高度集中的领域，因为它要求对构成框架或系统的每一个部分都精通掌握。这就是为什么认证在渴望进步的道德黑客程序员中广为人知的原因。\n\n通过获得相关的`道德黑客认证`，你可以通过以下方式推动你的网络安全职业发展：\n\
  \n- 经过认证的人员知道如何配置、构建和维护安全的业务环境。如果你能在这些领域展示你的见解，你将在风险分析和制定成功策略方面变得极具价值。\n- 经过认证的网络安全专家与其未认证的同事相比拥有更好的薪资前景。根据\
  \ Payscale 的数据，认证的道德黑客在美国的平均薪资为 `$90K`。\n- 认证证明了你在 IT 安全领域的技能，并让你在申请测试性工作时更具可见度。\n\
  - 随着安全泄露事件的日益频繁，企业正向 IT 安全投入巨额资金，并倾向于聘用经过认证的竞争者。\n- 初创公司需要长于防御数字威胁的深深技能专家。认证可以让你展示自己的\
  \ IT 安全能力，从而在初创公司获得丰厚的工作。\n\n在当今时代，网络安全已成为许多组织中日益增长的热门话题。随着恶意程序员不断发现更现代的方法来攻破系统屏障，道德程序员的工作在各个领域都变得越来越重要。它为网络安全专家创造了大量机会，并激励了人们将道德黑客作为自己的职业。基于此，如果你曾考虑过进入网络安全领域的潜在结果，或者仅仅是提升技能，现在是采取行动的理想时机。此外，显然实现这一终点的最有效方法是获得道德黑客认证，而最理想的方法是让\
  \ Simplilearn 帮助你实现！现在就关注他们，加入维护安全框架的斗争吧。\n\n## 3. 选择你的帽子\n\n还记得《哈利·波特》系列中吗？分院帽将你分到你所属的学院（坏人去`斯莱特林`，勇敢的人去`格兰格芬多`等）。黑客的帽子与此类似，只不过你是你自己的分院帽，而且你可以切换立场。让我们来看看每种帽子意味着什么。\n\
  \n要理解黑客比喻上戴的帽子，我们必须首先理解黑客社区的伦理标准。\n\n### 黑客伦理\n\n自由软件基金会的理查德·斯尔曼以及拷贝权（copyleft）概念的创建者之一对黑客有如下描述：\n\
  \n“黑客伦理指的是对错的感觉，即这个人类社区拥有的伦理思想——知识应该与其他能够从中获益的人共享，重要的资源应该被利用而不是浪费。”\n\n黑客伦理的通用原则是：\n\
  \n1. 访问计算机必须是通用且无限制的\n2. 所有信息必须是的\n3. 鼓励去中心化\n4. 根据黑客技术进行判断，而不是根据文凭、经济地位、种族、性别、宗教等\n\
  5. 用计算机创造艺术和美感\n6. 让你的生活变得更好\n\n### 黑帽黑客\n\n“黑帽黑客”一词源于旧西部电影，在那里坏人戴黑帽子，而好人戴着——你猜得没错——白帽子。\n\
  \n看起来最时尚的黑色背负了所有的坏名。反派通常只穿黑色，然后是死亡、黑暗魔法和黑猫——这些都与黑暗邪恶的事物相关。因此，黑帽黑客是我们在媒体上听得最多的，那些利用他们的“力量”作恶的人。\n\
  \n黑帽黑客是那些寻找安全漏洞以获取访问并将其用于恶意意图的人。这些目的可能是财务的——例如获取信用卡信息以便访问资产和账户——或者纯粹是信息方面的。黑帽黑客获取名人的个人文件，他们是那些会用你的卡去购物，甚至访问大型公司文件以进行更大规模黑客的人。黑帽黑客可以给个人或企业造成重大损害，破坏网站甚至关闭安全系统。\n\
  \n黑帽黑客的跨度很大，从传播病毒的少年到获取信用卡密码的大型联赛黑客不等。有时，恶意黑客在互联网之外工作，通过打电话伪装成合法公司来获取信息。黑客使用的臭名昭著的非电脑诈骗之一是假装成`IRS`（美国税务局）或`CRS`（税务服务处），并打电话威胁要因为他们没交税而采取法律行动。识别这种诈骗的一个良好标准是寻找紧迫感，例如——必须现在、这里通过你的信用卡支付——以及恐惧的施加——“如果你现在不交，你就会坐牢！”\n\
  \n黑帽黑客有他们的传统，就像针对黑客的漫漫大会一样。最著名的两个是`DefCon`和`Black Hat`。然而，这些会议通常也有白帽黑客参加，以从黑帽那里学习并获取任何必要了解的信息。这两个世界保持得如此接近，以便互相学习并击败对方，真是令人着迷。\n\
  \n有很多臭名昭著的黑帽黑客可以选择，但有些在人群中也脱颖而出。当然，许多顶级高手从未被捕获，但在被捕获的人中包括：\n\n- **Albert Gonzales**：他被指控在\
  \ 2005 年至 2007 年间实施了历史上最大的 ATM 盗窃案。当他被捕时，当局发现他身上有 `$1.6 million` 现金，在其财产周围还有 `$1\
  \ million` 现金，自然地，他被判处联邦监狱 20 年。\n- **Vladimir Levin**：他在住在公寓里时，从 `Citibank`（花旗银行）账户转账了\
  \ `$10 million` 到他自己的账户。当他的同伙试图从世界各地的银行账户取款并被捕时，他们指证了他。他被捕并仅判了三年，大部分资金已追回（除 `$40000`\
  \ 之外）。媒体将 Levin 描为一个生物化学家和拥有 `Ph.D.` 的科学家，但多年后揭露他只是一个没有过太多正式教育的管理员。这说明了在没有实际证据的情况下，报道可以变得多么夸张。\n\
  - **George Hotz**：2007 年，年仅 17 岁的他是第一个解锁 `iOS` 安全系统的人，在 2010 年他入侵了 `Sony` 系统，这导致了一场巨大的且著名的\
  \ `Sony` 诉讼。这导致了黑客组织 `Anonymous` 攻击 `Sony` 以及迄今为止最昂贵的安全漏洞。他一直发布越狱技术，直到 2010 年他最终转到了白帽一方，或者说是灰色地带。\n\
  - **Johnathan James（别名 `c0mrade`）**：16 岁时，Johnathan 成为美国第一个因网络犯罪进入少年监狱的人。15 岁时，他就入侵了\
  \ `NASA`（美国国家航空航天局）和国土安全部的安全系统，并走了价值超过 `$1 million` 的软件。他入侵了国防威胁减少局并拦截了员工的消息。Johnathan\
  \ 在 28 岁时自杀，一份过去的遗书表明这可能与他卷入另一起黑客事件有关。\n\n\n\n\n加里·麦金农（Gary McKinnon）——这位来自苏格兰的麦金农入侵了美国国家航空航天局（NASA）、美国陆军、空军和海军系统，寻找他认为美国政府正在隐藏的关于\
  \ UFO 的信息。一次，美国陆军所有的电脑上都出现了一条信息显示：“你们的安全系统是垃圾”。他被指控实施了史上最大的美国政府计算机入侵案，但他从未被引渡美国。未引渡的原因是他患有阿斯伯格综合。特蕾莎·梅（Theresa\
  \ May）认为，引渡他将弊大于利，且这种引渡将违反人权。\n\n凯文·米特尼克（Kevin Mitnick）——他在 12 岁时开始学习黑客，绕过了洛杉矶公共公交系统的打票系统。1979\
  \ 年，17 岁的他获得了该系统未经授权的网络访问；随后，他被定罪并入禁，之后获得了监督性释放。当他接近假释期结束时，他入侵了太平洋电信（Pacific Bell）的计算机并逃离。他当了两年半的逃犯。在经历了非常公开的追捕后，他于\
  \ 1995 年因多项电信诈骗和持有未经授权设备罪被捕。他曾出现在多部电影、书籍和漫画书中，直到今天，他仍然是最著名的黑帽黑客。\n\n# 黑客层级\n\n与世界其他地方一样，黑客世界也有自己的划分。黑帽黑客社区中的划分之一是根据你的黑客技能划分的：\n\
  \n- **新手（Newbies）** - 他们拥有黑客工具，但不非常了解这些程序是如何工作的。\n- **赛博朋克（Cyberpunks）** - 也称为绿帽黑客，他们是有更有野心成为程序员的新手。他们使用其他工具，但会积极学习编程。\n\
  - **代码人员（Coders）** - 这些是编写其他黑客用来入侵系统的程序的人。\n- **网络恐怖分子（Cyberterrorists）** - 他们入侵系统是为了非法盈利；他们处于黑客食物链的顶端。\n\
  \n# 白帽黑客\n\n白帽黑客就是他们所谓的黑客行业中的“好人”。他们入侵系统并做与黑帽黑客几乎相同的事情，只是白帽黑客入侵背后的目的是安全。在黑帽黑客利用系统弱点之前，他们暴露漏洞以创建更高的安全标准。\n\
  \n通常，以前的黑帽黑客会转变为白帽黑客，但你很少看到相反的情况。白帽黑客也被称为伦理黑客。从简单来说，伦理黑客通过假装成恶意黑客来测试安全网络，以查看弱点在哪里。这意味着从给员工发邮件索要密码到测试复杂的安全系统的任何事情。这就是许多黑帽黑客转换阵营的原因，他们可以做同样的事情，但不必担心法律起诉。\n\
  \n伦理黑客在美国军中也显而易见。伦理黑客的早期案例之一实际上是由美国空军进行的。然而，伦理黑客的想法并非来自空军。丹·法默（Dan Farmer）和维特塞·维内马（Wietse\
  \ Venema）是两个程序员，首次创造了伦理黑客的想法，尽管他们没有那样命名。他们的想法是提高整个互联网的安全性。法默开始编写一个名为`Computer Oracle\
  \ and Password System (COPS)`的软件，旨在识别安全弱点。维内马设计了`Security Administrative Tool for\
  \ Analyzing Networks (SATAN)`，这成为了一种被接受的计算机和网络安全审计方法。\n\n其他著名的伦理黑客包括：\n\n- **凯文·米特尼克（Kevin\
  \ Mitnick）** - 是的，同一个曾经是逃犯的凯文·米特尼克现在是一个著名的白帽黑客。在他臭名昭著的黑帽时代之后，现在担任顾问并为 FBI 工作。他还担任公共演讲员并在大学授课。\n\
  - **约翰娜·鲁特科夫斯卡（Joanna Rutkowska）** - 她是一位专注于`Qubes OS`的网络安全研究人员。2006 年，她参加了一个黑帽会议并暴露了`Vista\
  \ Kernel`的漏洞。2009 年，她阻止了针对包括`Trusted Execution Technology`在内的 Intel 系统的攻击。\n- **查利·米勒（Charlie\
  \ Miller）** - 他以暴露苹果公司的漏洞闻名，也是第一个发现`MacBook Air`漏洞的人。他在 Uber 工作了多年，并在某些时候甚至为国家安全局（NSA）工作过。2014\
  \ 年，他入侵了一辆`Jeep Cherokee`并成功远程控制了它的刹车、方向盘和加速器。\n- **格雷格·霍格伦德（Greg Hoglund）** - 他是一位作家、研究人员和计算机取证专家。他对软件利用和在线游戏黑客做过贡献，并专利了用于白帽黑客目的故障注入方法。他还创立了著名的`rootkit.com`，这是一个致力于根内核主题（旨在启用未被允许访问的计算机软件集合）的网站。白帽黑客的工作更困难，获得的荣誉也少得多，但他们的工作更有成就感，而且最终是合法的。虽然某些黑帽黑客会获得“酷点”，但白帽黑客同样有趣。白帽黑客最酷的地方在于你可以享受到的所有自由，因为你不会被起诉和逮捕。\n\
  \n# 灰帽黑客\n\n世界上没有非黑即白的，黑客帽也是如此。有一组处于黑帽和白帽黑客之间的黑客，被称为灰帽黑客。那么灰帽黑客到底是什么呢？\n\n他们是不总是遵守法律或道德标准的黑客，但他们没有黑帽黑客那样的恶意意图。这个词最早在黑帽会议`DEFCON`上由黑客小组`L0pht`提出的，并首次于\
  \ 1999 年的《纽约时报》采访中公开使用。\n\n`Lopht`将自己描述为一群支持伦理报告和暴露漏洞，但不同意于主导白帽社区的完全披露做法的人。\n\n\
  他们也被称为白天是白帽黑客，晚上是黑帽黑客。\n\n目前还不清楚灰帽黑客到底是什么，因为这个术语非常广泛。通常的想法是一个为了改进安全而违反法律的黑客。你可以把他们看作是群体中的“混沌善良”。\n\
  \n灰帽黑客的例子包括：\n\n**德米特里·斯克拉罗夫（Dmitry Sklyarov）** - 在 21 世纪 00 年代，这位俄罗斯公民及其雇主`ElcomSoft`因涉嫌违反`DMCA`（数字千年版权法）引起了\
  \ FBI 的注意。斯克拉罗夫访问美国参加一个名为`eBooks Security`的演讲，并在回途中因违反`DMCA`被捕。指控是斯克拉罗夫和他的公司非法获取了`Adobe`的复制保护方案。美国政府最终以他对`ElcomSoft`作证为交换撤销了所有指控。\n\
  \n**朱利安·阿桑基（Julian Assange）** - 朱利安·阿桑基是发布泄露信息的非营利组织 WikiLeaks 的创始人，可能是最典型的灰帽黑客。他\
  \ 16 岁时开始黑客，随后入侵了`NASA`、五角大楼和斯坦福大学。他在 2006 年创立了`WikiLeaks`，这仍然是一个伦理地带。有些人认为阿桑基仅仅是在揭露精英企业的腐败，而另一些人认为他所做的工作是非法的且腐败的。`WikiLeaks`发布的著名文件之一是美国士兵在伊拉克直升机上射击\
  \ 18 名平民的视频。阿桑基一直在逃避多年，目前仍处于此。他面临 17 项不同指控，许多人认为这些指控无效，是新闻自由终结的象征。\n\n\n\n\n# Loyd\
  \ Blankenship\n也被称为 The Mentor（导师），Blankenship 是一位知名的作家和黑客。他曾包括毁灭军（Legion of Doom）在内的多个黑客组织的成员。他是《Hacker\
  \ Manifesto》和《GURPS Cyberpunk》的作者，后者是为 `Steve Jackson Games` 编写的赛博朋克角色扮演设定。这本书让\
  \ Blankenship 陷入了困境，因为人们认为他非法访问了 `Bell South`，这将帮助其他组织实施类似的黑客攻击。\n\n# Guccifer\n\
  Guccifer 是一个针对名人的罗马尼亚黑客。他是希拉里·克林顿邮件泄露事件的幕后黑手，有人认为这最终导致了她在 2016 年总统竞选中的失败，并让`唐纳德·特朗普`当选。在克林顿之前，Guccifer\
  \ 访问了罗马尼亚女星的邮件。随后，他转向了美国国务卿`科林·鲍威尔`和`乔治·W·布什`。\n\n# Anonymous\n这是一个近期活跃于新闻中的知名黑客行动主义团体。他们因对政府机构、机构、公司和科学技术教会发动攻击而广为人知，但\
  \ Anonymous 的成员名单可以列上好几天。尽管有多人因参与 Anonymous 的网络攻击被捕，但直到今天，该团体仍在运行。\n\n# 黑客帽子\n黑客的帽子完全取决于你最终想要代表什么。其理念是相同的——突破由个人和公司建立的安全措施。黑客行为背后的伦理立场决定了你想为自己选择哪种帽子。\n\
  \n如果你只是想通过测试系统来寻找点乐趣，那么请坚持明确的白帽黑客。我的意思是，通常情况下坚持下去，因为这会让你免于入狱。\n\n# 4. Linux 编程\n\
  在 Linux 上编程被用于创建接口、应用程序、软件和程序。Linux 代码经常用于桌面、嵌入式系统以及实时程序。Linux 是一个开源操作系统内核，与 `Perl`、`C++`、`Java`\
  \ 以及其他各种编程语言兼容。\n\n## Linux 是如何工作的？\nLinux 作为操作系统的内核，也可以被免费分发和共享。操作系统（OS）是帮助用户与计算机硬件连接的接口，并支持应用程序和程序的运行。内核无非是操作系统的核心，因为它管理着硬件和软件组件之间所有的通信。\n\
  \n## Linux 程序员的功能是什么？\nLinux 编程首先使用诸如 `GBU` 编译器和调试器等工具，这些工具有助于创建用于存储数据的应用程序、构建 GUI\
  \ 以及编写脚本。与 Linux 相关的更高级形式的应用允许程序员开发与 Linux 相关的软件、优化已有的程序，并编写具有各种复杂功能的新程序，例如多进程、多线程、进程间通信以及硬件设备交互。\n\
  \n## Linux 的用途\n如今，Linux 已被广泛应用于各种服务器、计算机安全系统和计算机系统架构中。它在实时程序以及 PDA 和手机的嵌入式系统中也被广泛使用。Linux\
  \ 编程还产生了各种应用程序。\n\n## 如何开发内核模块？\n在你开始 Linux 核心编程之前，增加你的知识和 Linux 编程专业知识的最佳方法是开始研究内核模块。模块是独立开发的，与\
  \ Linux 内核协同工作以作为一个紧凑的操作系统。内核模块包含各种内容，如用于多种硬件外围设备的驱动程序、文件管理器以及操作系统的其他底层功能。进入内核模块的门槛远低于开发\
  \ Linux 内核。有许多个人和团队正在开发不同的模块。因此可以得出结论，在开发入口并没有特定的守门人。\n\n# Linux 编程的逻辑分解\n当你使用某些主要的操作系统形式时，你实际上是在间接地与\
  \ shell（壳）交互。如果你使用 `Linux Mint`、`Ubuntu` 或任何其他 Linux 发行版，你每次使用终端时都会与 shell 交互。让我们讨论一下\
  \ Linux 编程的拆解，它由 Linux shell 和 shell 脚本组成。\n\n在在我们开始之前，你需要熟悉以下一些术语：\n* `Kernel`（内核）\n\
  * `Shell`（壳）\n* `Terminal`（终端）\n\n## 什么是内核？\n内核无非与计算机系统相关的程序，作为操作系统的核心。它对系统中的所有元素拥有整体控制权。它帮助基于\
  \ Linux 管理系统的各种资源：\n* 文件管理\n* 进程管理\n* I/O 管理\n* 内存管理\n* 设备及其他各种组件的管理\n\n一个完整的 Linux\
  \ 系统可以分解为：`Kernel + 安装脚本 + 其他管理脚本 + GNU 系统库和工具`。\n\n## 什么是 shell？\nshell 是一种特殊的用户程序，帮助为用户提供适当的接口以使用与操作系统相关的服务。shell\
  \ 接受来自用户的人类可读的命令，然后将其转换为内核可以理解的内容。它可以被视为命令语言的解释器，帮助执行从键盘等输入设备或系统文件中读取的命令。当用户登录系统或启动终端时，shell\
  \ 启动。\n\nshell 可以很容易分为两类：\n* 图形化 shell\n* 命令行 shell\n\n图形化 shell 通过基于 GUI 或用户界面提供了操纵程序的各种手段，允许进行关闭、打开、调整窗口大小和移动窗口等操作，以及切换窗口的焦点。`Ubuntu\
  \ OS` 和 `Windows OS` 可以被视为提供 GUI 让用户与各种程序交互的佳例。\n\n用户可以通过 CLI 或命令行界面访问 shell。Linux\
  \ 中有一种名为终端的特殊程序，用于输入人类的命令，如 `ls`、`cat` 等许多命令，并对其进行执行。最终结果将直接显示在终端上供用户查看。假设你执行命令\
  \ `ls` 以及选项 `-l`。这将长格式列出当前工作目录下的可用文件。\n\n如果你是初学者，使用命令行 shell 可能会有些困难，因为很难同时记住大量的命令。它在本质上非常强大，还允许用户将所有命令存储在一个特定的文件中并一起执行所有命令。通过这种方式，任何形式的重复任务都可以轻松实现自动化。所有这些文件在\
  \ Linux 系统中通常被称为 `Shell Scripts`。\n\n在 Linux 系统中，有多种类型的 shell 可供用户：\n* `BASH`：也被称为\
  \ `Bourne Again Shell`，广泛应用于基于 Linux 的系统。它是 Linux 系统登录的默认 shell。如果你愿意，也可以在 Windows\
  \ 操作系统中安装它。\n* `CSH`：也被称为 `C shell`，它使用 `C shell` 的语法，其用法与 `C` 编程语言基本相似。\n\n\n\n\
  \n\n## KSH\n- KSH: 也称为 Korn shell，它是 POSIX Shell 标准的基础。\n\n每种 shell 的功能方式相同，但它们都理解各种命令，并提供了各种内置函数。\n\
  \n## Shell 脚本编写\n\n总的来说，shell 本质上是交互性的，这意味着它们可以接受用户的命令作为输入并能够执行这些命令。然而，你可能需要或想要以例行的方式执行大量命令，这样你就不需要每次在终端中输入所有命令了。由于\
  \ shell 也可以以文件作为输入的形式接收命令，因此你也可以将命令写入文件中，然后在 shell 中执行，以避免重复任务。所有这些文件都称为 Shell 程序或\
  \ Shell 脚本。Shell 脚本的结构与 MS-DOS 中的批处理文件（batch file）相似。每个 shell 脚本以 .sh 文件扩展名保存，例如\
  \ `yourscript.sh`。\n\nShell 脚本也与其他所有编程语言类似的语法。如果你已经熟悉 C、C++ 或 Python 等任何编程语言，那么开始编写\
  \ shell 脚本将变得更容易。Shell 脚本包含：\n\n- Shell 关键字：包括 `else`、`if`、`break` 等许多其他\n- Shell\
  \ 命令：包括 `ls`、`cd`、`echo`、`touch`、`pwd` 等许多其他\n- 控制流：包括 `if..then..else`、`shell`\
  \ 和 `case` 循环等许多其他\n\n你可以使用 shell 脚本避免重复工作，从而选择自动化。它也有助于系统监控。它允许为 shell 添加各种新功能。\n\
  \n## 在 Linux 中使用 C 语言编程\n\nLinux 正在成为所有开发者的天堂。这主要是因为 Linux 的开源特性，而且它是一个完全免费的操作系统。Turbo\
  \ C 编译器是旧形式的编译器，曾用于编译程序。在 Linux 上也可以完成相同的工作，创建一个新的编程环境。让我们看看如何使用 C 语言编写、编译和运行基于\
  \ C 的程序，从而开始在 Linux 中编程。\n\n## 在 Linux 中使用 C++ 编程\n\nC 可以被视为一种具有过程性的编程语言。它在 1969\
  \ 年至 1973 年间由 Dennis Ritchie 开发。最初，它被开发为用于编写完整操作系统的系统编程语言。C++ 语言的主要特性包括对系统内存的低级访问、一组非常简单易用的关键字以及非常整洁的风格。所有这些特征使得\
  \ C++ 语言非常适合各种系统编程，如操作系统，甚至是编译器的开发。第一步包括安装一些开发工具以及几个应用程序，如 `GCC`、`GNU C++` 编译器，用于编译程序以及在\
  \ Linux 中执行整体代码。C 和 C++ 有某些相似之处，为了理解 C++，让我们先看看 C。\n\n如果你需要，也可以通过命令验证已安装的工具集：\n\n\
  ```bash\ncc –v\n```\n\n现在，让我们考虑一个名为 `Sort.c` 的非常简单的 C 程序文件：\n\n```c\nint main( void\
  \ )\n{\nprintf( “Hello! Sort\\n” );\nreturn 0;\n}\n```\n\n要编译这个简单的程序，你可以使用：\n\n\
  ```bash\ncc filename.c -0 executable_file_name\n```\n\n在该命令中，`filename.c` 是 C 程序文件，`-0`\
  \ 用于显示代码中的错误。如果代码中没有形式的错误，它将生成一个名为 `executable_file_name` 的可执行文件。\n\n```bash\ncc\
  \ Sort.c -0 sortoutput\n```\n\n在这里，`sortoutput` 是正在生成的具有执行属性的文件。因此，你可以这样执行：\n\n\
  ```bash\n./sortoutput\n```\n\n### 对于与 C++ 相关的程序文件\n\nC++ 是一种为了通用编程而开发的编程语言，如今被广泛用于竞争性编程。它具有面向对象、命令式和泛型程序特征。你可以在\
  \ Linux、Windows、Mac、Unix 等许多操作系统平台上运行 C++。在我们开始使用 C++ 编程之前，你将需要一个适当的环境，该环境需要在你的计算机系统上设置，以便成功地编译和运行你基于\
  \ C++ 的程序。你可以使用此命令验证你所有已安装的 C++ 工具：\n\n```bash\ng++ -- version\n```\n\n让我们考虑一个非常简单的\
  \ C++ 程序：\n\n```cpp\n// main 函数\n// 程序的执行\n// 从开始\nint main()\n{ \n// 打印 Hello Universe!\n\
  cout<< “Hello Universe!\\n”;\nreturn 0;\n}\n```\n\n要编译这整个代码，你可以使用：\n\n```bash\n\
  g++ filename.cpp -0 executable_file_name\n```\n\n在此命令中，`filename.cpp` 是 C++ 程序文件，`-0`\
  \ 选项用于显示代码内部的错误。如果没有发现任何错误，它将生成一个名为 `executable_file_name` 的可执行文件。\n\n```bash\n\
  g++ sort.cpp -0 sortoutput\n```\n\n在此命令中，`sortoutput` 是正在生成的具有执行格式的文件。因此，你可以这样执行：\n\
  \n```bash\n./sortoutput\n```\n\n### 在 Linux 中安装 C++ 编译器\n\n如果你正在使用 CentOS、Red Hat、Fedora\
  \ 等基于 Linux 的系统，可以通过输入以下命令安装 C++ 编译器：\n\n```bash\nyum install –y gcc-c++\n```\n\n\
  为了验证系统中已安装了 GCC，使用：\n\n```bash\nrpm –qa | grep –i c++\n```\n\n你也可以使用 `which` 命令：\n\
  \n```bash\nwhich c++\n```\n\n### 在 Linux 上编写 C++ 程序\n\n- 从终端窗口通过 `vim` 命令打开一个新文件进行编辑：\n\
  \n```bash\nvim hello.cc\n```\n- 在 `vim` 编辑器中，你现在可以编写 C++ 程序或代码。\n- 完成编写后，保存并退出文件。\n\
  - 为了编译新的 C++ 程序，你需要在终端输入此命令：\n\n```bash\nc++ hello.cc\n```\n\n如果编译过程没有任何错误，则不会在屏幕上打印输出。\n\
  \n- 在当前目录下创建一个名为 `a.out` 的可执行文件。\n- 为了运行该程序，你可以像执行任何 Linux 可执行文件一样执行该文件。\n\n####\
  \ 如何为生成的可执行文件指定名称？\n\n在没有任何任何选项的情况下编译 C++ 程序将生成名为 `a.out` 的可执行文件。如果你想为执行文件指定特定的名称，有两种方法：第一是在创建后重命名默认的\
  \ `a.out`，第二是在编译时通过 `-o` 选项指定执行文件的文件名。\n\n```bash\nc++ hello.cc –o /opt/hello.run\n\
  ```\n\n### 从 C++ 程序执行系统命令\n\n需要时，通过执行 OS 命令与编译系统进行通信是非常重要的。`system()` 函数将允许你从 C++\
  \ 代码运行系统命令。为了让编译器能够正确识别所有这些函数并以正确的方式进行编译，需要调用 `stdlib.h` 库文件。\n\n## 总结\n\n- 在基于\
  \ Linux 的机器上编写 C 或 C++ 程序，你需要 `GCC` 编译器。\n- 所有的 C++ 程序都保存并编写为 `.cc` 格式的文件。\n- 所有的生成形式的可执行文件也可以以类似于\
  \ Linux 或 Unix 可执行文件的方式进行执行。\n- `system()` 函数被用于从 C++ 代码运行系统命令。\n- `g++` 和 `c++`\
  \ 命令均可编译并链接 C++ 源文件。\n\n\n\n\n要将列表中的任何项追加到末尾，请使用 `append()`。要从列表中删除任何项，您可以轻松地将特定元素传递给\
  \ `remove()` 方法，或将项在列表中的正确位置传递给 `pop()`。在输入项目名称并加上一个点之后，可以使用 `Ctrl+space` 来显示任何对象的可用方法的完整列表。\n\
  \n# 使用 Java 进行 Linux 编程\n\nJava 是最流行的编程语言之一，广泛用于开发软件，涵盖了从手机到电缆电视盒几乎的所有设备，并扩展到大型企业信息系统。编写\
  \ Java 源代码、编译以及随后运行的整体概念在大多数操作系统上大体相同。\n\nJava 是一种最初由 Sun Microsystems 开发的编程语言。它属于编译型编程语言的范畴，程序员编写源代码然后将其提交给编译器，编译器将检查程序的语法并生成一个可以运行的完整文件。例如，当你使用\
  \ Google Chrome 浏览器时，从本质上说，你正在运行所有由软件开发者使用的编译器所生成的程序。\n\n在很大程度上，过去的编程语言需要你为每个想要运行程序的新操作系统重新编译所有源代码。例如，一个为\
  \ Windows 运行而编译的程序，在重新编译之前是无法在带有 Linux 的系统上运行的。考虑到操作系统和硬件元素之间的巨大差异，这一过程的执行非常困难且复杂。Java\
  \ 编程语言的主要动力之一是：能够只编写一套源代码，然后让生成的程序具有在不同的操作系统或运行环境中运行的能力。\n\nJava 之所以具有“编写一次，随处运行”的能力，仅是因为编译器将特定文件中的整个源代码翻译为名为“字节码（Byte\
  \ Code）”的文件，该文件随后可以在任何形式的支持的 `JRE` 或 Java 运行环境下运行。\n\nJava 的开发过程涉及以下步骤：\n\n- 编写\
  \ Java 源代码并将其保存到一个或多个纯文本文件中。所有这些文件通常以 `.java` 格式结尾。\n- 运行 Java 编译器 (`javac`)，将你编写的源代码编译为字节码文件。字节码的文件名通常以\
  \ `.class` 结尾。\n- 将字节码提交给 `JRE` 后运行程序。\n\n# 5. 黑客过程\n\n黑黑客过程通常涉及制定一个攻击将如何发生的计划。首先，你应该制定一个如何收集信息的计划，这些信息在促进攻击时将非常有用。计划的主要意义在于确保攻击将得到良好的协调，并且在过程中不会发生差错。此外，计划确保了道德黑客对他们所做的事情充满信心……你可能从测试客户端计算机上的一个程序开始；在此过程中，你可能还可以概述、定义并记录你的目标。测试阶段非常重要，因为你能够制定测试标准，并对你将在道德黑客过程中需要使用的工具获得一定的熟悉。在本章，我们还将研究如何创建一个良好的黑客环境，因为这将有助于确保黑客过程的成功。在没有获得目标或客户授权的情况下，道德黑客无法入侵系统。\n\
  \n## 制定你的目标\n\n黑客应该制定可以实施的目标。作为一名道德黑客，你的首要目标是确保你已经发现了系统内部存在的所有漏洞。如果存在任何漏洞，道德黑客将制定出用于封堵所有漏洞的技术，以确保外部攻击者无法入侵系统并以不同的方式破坏它。目标形成过程涉及以下步骤：\n\
  \n1. 始终定义你的特定目标。目标还应该与业务/客户的目标一致。作为一名道德黑客，确保你已经调查了管理层试图实现的目标以及你的终极目标。\n2. 确保你还制定了一份引导你从项目开始到结束的进度表。黑客时间线还应该包含具体的日期和时间。例如，某些攻击不能在工作时间内发生，因为员工导致流量很大，并且应该尽一切手段避免\
  \ `DoS`（拒绝服务）攻击。\n\n目标的形成过程可能花费大量时间；然而，这是值得的。目标旨在提供一些指导。作为一名道德黑客，你可能经常参考你的目标，以确保你处于正确的轨道上。\n\
  \n## 确定你将要攻击的特定系统\n\n可能有许多 Web 应用需要测试，并且不能一次性完成测试，因为系统可能会在此过程中崩溃。确保黑客项目已进行相应的拆分，以便攻击也易于管理。你也可以从分析开始，以便调查你将测试的特定系统。你应该问自己的主要问题包括：\n\
  \n1. 哪些系统是关键的？有些系统不需要授权即可访问，这意味着当外部攻击者获取这些系统时，会有很多麻烦，业务可能会遭受一些损失。\n2. 哪些系统容易被攻击？\n\
  3. 哪些特定系统已经记录？\n\n在你制定好目标后，你就可以决定开始测试的特定系统。目标重要的主要原因是它们将帮助你实现预期，并且你能够调查这些预期是否可行。此外，目标将帮助你确保能够制定时间表，并还将估算执行攻击所需的资源量。\n\
  \n你可以测试的设备包括：\n\n1. 交换机和路由器——交换机通常连接一个网络上的计算机。路由器将连接许多网络。\n2. Web 应用和数据库服务器。\n3.\
  \ 防火墙。\n4. 电子邮件和文件。\n5. 桥接器和无线访问点。\n6. 笔记本电脑、工作站和平板。\n7. 客户端和服务器操作系统。\n8. 移动设备存储机信息。\n\
  \n在处理小型网络时，你可以轻松测试所有内容。你可以测试电子邮件和 Web 服务器。此外，确保道德黑客过程也是灵活的。确保你从高漏洞的网络和系统开始。\n\n\
  # 攻击树分析\n\n\n\n攻击者在制定攻击方案时会使用攻击树分析。它以流程图的形式存在，有助于概述攻击的实施方式。安全团队在进行某些关键风险分析时通常会使用攻击树。为了提高你的黑客技巧，你应该确保自己能够规划攻击，并以一种方法论的方式处理它。\n\
  \n目前的主要挑战是制定攻击树所需的时间。此外，在制定攻击树时，你应该具备必要的专业知识。如今，有一些工具可以用于制定攻击树。你可以使用 `SecurITree`\
  \ 工具来制定攻击树。\n\n与对当前漏洞的评估相比，伦理黑客过程也在进步。作为一名伦理黑客，你应该确保自己拥有许多关于各种系统的知识。例如，你可以从查找有关目标的一些信息开始。此外，你可以使用不同的伦理黑客技术。有时，你可能会犹豫不决，这意味着你应该对系统进行彻底评估，以确保有足够的可见。你也可以更多地关注防火墙。\n\
  \n# 制定测试标准\n\n在发生某种形式的误解的情况下，系统在伦理黑客过程中很容易崩溃。确保你已经制定了测试标准，以避免某些挑战。一些标准包括：\n\n1.\
  \ 你在何时进行测试？有特定的时间吗？\n2. 正在进行哪些测试？\n3. 你将如何执行每项测试以及将使用哪个 `IP` 地址？\n4. 你对将要测试的系统所拥有的特定知识量。\n\
  5. 在发现系统中存在某些漏洞后，采取哪些步骤最好。\n\n在伦理黑客过程中，你应该利用的一些实践包括：\n\n## 时机\n\n时机非常重要，它也应该适用于伦理黑客过程。当你执行某些测试时，你必须确保组织内进行的业务流程不会受到任何形式的影响。存在一些有害的情况，你应该通过一切可能的手段避免这些情况，包括避免误解。也应该避免\
  \ `DoS`（拒绝服务）攻击，特别是在处理高流量的电子商务网站时。如果有许多人参与处理项目，最好对时间达成共识，以便轻松实现最终目标。\n\n确保 `ISP`（互联网服务提供商）对即将发生的伦理黑客攻击了解情况是好的。在确保他们知情后，你可以继续评估系统内部存在的漏洞，`ISP`（互联网服务提供商）就不会在怀疑发生了某些恶意行为后尝试拦截流量。\n\
  \n确保测试时间表由短期的日期组成，并应分隔进行测试。确保里程碑也已列出。时间线和所有数据应输入到电子表格中，以便提供一些指导。\n\n## 特定测试\n\n\
  作为一名伦理黑客，你的服务在某些时候可能被需要，特别是在进行渗透测试时。某些测试包括破解密码，以便能够访问某些 Web 应用程序。在某些情况下，你可能需要收集一些信息，这些信息在协助攻击时会有用，这意味着你应该进行社会工程攻击。你可能需要进行不同的测试，你应该确保自己没有泄露任何关于你即将进行的测试的进。文档记录过程是重要的，因为它将帮助消除未来可能出现的误解。在某些情况下，你可能必须确保通过截图收集一些证据。此外，你可能缺乏处理某些测试的知识，但这并不意味着测试无法进行。在这种情况下，你应该使用自动化工具，因为你可能无法进一步了解关于你应该开展的某些测试。\n\
  \n## 关于盲测评估和知识评估\n\n在测试阶段，确保你对系统和网络拥有足够的知识。拥有这种知识可能并非必须；尽管如此，你应该确保你对将要测试的系统拥有一些基础知识，并且能够通过确保没有可以追溯到协助攻击个人的数字足迹来保护自己。当你想要了解更多关于特定组织的信息时，这个过程并不困难。你只需要进行一种形式上的调查，以便理解系统如何运作，并继续规划攻击。在进行一些背景研究后，你将不会盲目地进行攻击。当你进行评估时，你使用的某些技术将取决于你拥有的特定需求。\n\
  \n在黑客过程中你可以使用的最佳方法是确保你已经制定了一项计划，该计划在协助多次攻击时会。此外，作为客户，你应该确保你雇佣的黑客没有怀有任何恶意动机。某些黑客的范围取决于他们预期的最终结果。此外，确保网络管理员检测不到正在进行测试。作为一名攻击者，为了避免被捕获，你可以使用社会工程攻击。如果一个系统被许多人访问，当他们发现正在发生攻击时，他们可能会改变习惯，这意味着预期结果将是不准确的。如果你想告知人们攻击，请确保只有\
  \ IT 专家等关键人物可以获取此类信息。\n\n## 位置\n\n你作为伦理黑客正在进行的测试应该决定你执行伦理黑客过程的位置。主要目标是确保系统在恶意用户可以轻松访问的位置经过测试。在这种情况下，主要的挑战包括无法确定组织内部是否有人入侵了系统；因此，始终确保所有现有漏洞都已封堵。此外，你可能结合不同的测试，它们也可以从外部和内部执行。\n\
  \n# 如何处理网络中的漏洞\n\n\n\n\n\n在处理网络内部漏洞时，你应该确保自己已经制定了合理的方案，用于封堵组织内部所有的漏洞。黑客攻击不能无限持续，因为系统将面临崩溃的风险。确保你遵循了特定的路径，直到你无法访问该系统为止。你可能会产生疑问，在这种情况下，请确保你参考了在开始伦理黑客攻击过程之前概述过的目标。在发现某些漏洞后，确保你已经联系了相关人员，以便他们也能快速处理问题。如果这些某些问题没有得到及时修复，某些外部攻击者可能会利用这些漏洞，并可能造成不可逆转的损害。公司内部员工也应该确保他们没有违反公司内的任何就业安排。\n\
  \n## 愚蠢的假设\n\n当你开始臆断某些事情时，你很可能无法实现目标。人们在准备黑入系统时会做出许多假设，包括：\n\n1. 你可能假设在测试阶段网络是可用的。\n\
  2. 你可能假设你了解所有存在的风险。\n3. 你可能还假设在测试阶段你拥有所需的所有工具。\n4. 你可能还假设这些某些工具也能减少网络崩溃的概率。\n\n\
  确保在伦理黑客攻击过程开始之前，记录下你可能产生的所有假设。\n\n## 如何选择执行漏洞评估的工具\n\n在选择漏洞评估过程中将使用的安全评估工具之前，你本应该考虑一些因素。首先，你必须考虑你预计要运行的测试。伦理黑客测试也可以通过网络进行。当你全面执行测试时，确保你已经选择了适当的工具。\n\
  \n确保你对扫描漏洞时将要使用的所有工具都有深入的理解。这些工具附有说明书，说明书可能以 Readme 文件的形式存在。确保你已经打开了该文件，以便了解更多关于工具如何运行以及应该如何安装的信息。一些论坛也可以帮助你了解更多关于\
  \ `Kali Linux` 提供的工具。\n\n某些工具是相当危险的，因为它们也会影响网络的健康。在使用某些工具时，务必非常小心。同时，确保你对可用的选项有深入的了解。在伦理黑客阶段，不要尝试使用任何你不熟悉的工具，因为你可能会导致适得其反。例如，你可能会突然启动\
  \ `DoS`（拒绝服务）攻击。在此过程中还可能会丢失某些数据。如果某些免费工具被证明是不物有所值的，你可以购买这些工具的商业版，因为它们会更有效。需要注意的主要点是，这些某些商业工具非常昂贵，但它们的功能非常卓越。商业工具确保了你的投入物有所值。\n\
  \n##  Kali Linux 工具\n\n在本节中，我们将介绍 `Kali Linux` 中提供的不同类型的工具。工具可以根据使用它们所实现的任务进行分类。分类如下：\n\
  \n* 漏洞利用工具\n* 取证分析工具\n* 信息收集工具\n* 逆向工程工具\n* 无线攻击工具\n* 报告工具\n* 压力测试工具\n* 权限维持工具\n\
  * 嗅探与欺骗工具\n* 密码攻击工具\n\n让我们逐一查看每个类别中的可用工具，以了解它们的具体用途。\n\n### 漏洞利用工具\n\n如果你考虑一个位于互联网上的网络，上面运行着一组计算机，那么每个系统中都有许多应用程序可能使该系统变得脆弱。这可能是由于许多原因造成的，例如糟糕的代码、服务器上的开放端口等，导致这些系统很容易被访问。这就是漏洞利用工具派用场的地方。它们帮助你针对并利用此类脆弱的机器。但你并不是攻击者，因此这些工具将帮助你识别并修补这些漏洞。让我们逐一查看\
  \ `Kali Linux` 中可用的漏洞利用工具。\n\n#### Armitage\n\n由 Raphael Mudge 开发的 `Armitage` 是一个图形用户界面前端，与\
  \ `Metasploit` 框架配合使用。它是一个图形形式提供的工具，并且易于使用，因为它会针对给定系统推荐利用程序。该工具是开源且免费的。它主要因其提供的关于共享会话的数据以及通过单个\
  \ `Metasploit` 实例提供的通信而闻名。用户可以使用 `Armitage` 在系统上启动扫描和利用程序，这将为用户提供有关可用利用程序的数据。这结合\
  \ `Metasploit` 框架中提供的高级工具，使用户获得了对脆弱系统的控制权。\n\n#### 后门工厂 (BDF)\n\n被称为 `BDF` 的 `Backdoor\
  \ Factory` 是一种 `Kali Linux` 工具，被研究人员和安全专业人员使用。使用该工具，用户可以在应用程序文件上的系统文件的可执行二进制文件中滑入他们所需的代码。该工具执行代码，而不会让系统知道在常规系统或应用程序进程之外还有额外的操作。\n\
  \n#### 浏览器漏洞利用框架 (BeEF)\n\n顾如其名，如果你想对浏览器进行渗透测试，`Browser Exploitation Framework`\
  \ 应该是你的首选工具。使用该工具，如果客户端浏览器中存在漏洞，你也可以对该浏览器进行攻击。\n\n#### Commix\n\n`Commix` 是一种 `Kali\
  \ Linux` 工具，允许用户测试 Web 应用。对于 Web 开发人员、渗透人员和研究人员设置测试环境非常有用。它可以对 Web 应用进行注入，并允许用户识别漏洞。该工具是用\
  \ Python 开发的。\n\n#### Crackle\n\n`Crackle` 工具是一种用于暴力破解的 `Kali Linux` 工具。它可以检测并拦截蓝牙设备之间的流量。蓝牙设备之间的配对代码通常是\
  \ 4-6 位，并且是加密格式。`Crackle` 可以破解这些代码，然后你就可以拦截蓝牙设备之间发生的所有通信。\n\n#### JBoss-Autopwn\n\
  \n`JBoss-Autopwn` 是一种用于 JBoss 应用的渗透测试工具。GitHub 上的 `JBoss Autopwn` 版本过旧，最后更新是 2011\
  \ 年。它是一个历史工具，现在很少使用。\n\n#### Linux 漏洞建议\n\n`Linux Exploit Suggester` 工具提供了一个脚本，用于跟踪漏洞并显示所有帮助用户在渗透期间获取\
  \ root 权限的可能利用程序。该脚本使用 `uname -r` 命令来查找 Linux 系统的内核版本。此外，它还会提供 `-k` 参数，用户可以通过它手动输入\
  \ Linux 系统的内核版本。\n\n#### sqlmap\n\n`sqlmap` 是一个用于自动检测和利用 SQL 注入漏洞的开源程序。\n\n\n\n\n\
  \n`sqlmap` Kali 工具是一个免费且开源的工具，用于渗透测试。使用此工具，你可以检测 SQL 数据库中的漏洞，从而执行 SQL 注入。该工具的检测引擎极其强大，并拥有一系列可以执行深度渗透的工具，允许用户获取诸如数据库数据、数据库指纹等信息。它还可以让用户访问操作系统的文件系统，从而允许用户执行命令。\
  \ \n\n# Yersinia\n\nKali Linux 中提供的 `Yersinia` 工具可用于检测网络协议中的漏洞，使用户可以利用这些漏洞。该工具的框架对于测试和分析系统及网络的部署非常稳健。使用该工具进行的攻击属于二层（layer-2）攻击，可用于利用二层网络协议中的弱点。`Yersinia`\
  \ 在渗透测试期间被用于对网络设备（如使用生成树协议/spanning tree protocol 的 `DHCP` 服务器、交换机等）发起攻击。\n\n# Cisco\
  \ Global Exploiter\n\n`Cisco Global Exploiter` (`CGE`) 工具是一个安全测试利用引擎/工具，既简单又快速且先进。已知\
  \ Cisco 路由器和交换机中存在 14 个漏洞。该工具可用于利用这些漏洞。`Cisco Global Exploiter` 本质上是一个 perl 脚本，通过命令行驱动，并有一个简单易用的前端界面。\n\
  \n# 取证工具 (Forensics Tools)\n\n在本节中，我们将介绍 Kali Linux 中可用于取证领域的工具。 \n\n## chkrootkit\n\
  \n`chkrootkit` 工具可以在系统的实盘启动（live boot）期间使用。它可以帮助识别系统中是否安装了任何 `rootkits`。该工具有助于加固系统，让用户确保系统不会受到黑客攻击。该工具还可用于系统二进制文件扫描，使用户了解对原始\
  \ rootkit 是否进行了任何修改、字符串替换、临时删除等。这些只是这个小工具能完成的几项工作。它看起来是一个相当简单的工具，但它所拥的力量对于取证调查员来说可能是无价的。\
  \ \n\n## p0f\n\n`p0f` 工具用于在识别目标主机的操作系统。你只需通过截获传输的数据包并对其进行分析即可。无论系统是否有防火墙，该工具都能为你获取有关操作系统的信息。该工具非常神奇，因为它不会在网络上产生额外的流量，且其探测完全并不神秘。考虑到所有这些特性，高级用户手中的\
  \ `p0f` 还可以帮助检测防火墙的存在、`NAT` 设备的使用以及负载均衡器的存在。 \n\n## pdf-parser\n\n`pdf-parser` 工具可用于解析\
  \ PDF 文件并识别文件中使用的所有元素。该工具对 PDF 文件的输出并不是 PDF 文件。它不建议用于教科书级别的 PDF 文件，但它可以完成任务。该工具的用例主要是识别可能嵌入了脚本的\
  \ PDF 文件。 \n\n## Dumpzilla\n\n`Dumpzilla` 工具用 Python 开发。该工具从 Seamonkey、`Mozilla\
  \ Firefox` 和 `Iceweasel` 等网络浏览器中提取取证可能感兴趣的所有信息。 \n\n## ddrescue\n\n`ddrescue` 工具通常被称为“救星工具”。它用于将数据从硬盘等块设备复制到另一个块设备上。它之所以被称为救星，是因为在复制数据时，它会先复制所有完整的部分，这有助于防止源块设备出现读取错误。\
  \ \n\n`ddrescue` 工具的基本操作是完全自动的，这意味着一旦启动了它，就不需要等待任何错误提示（在错误情况下你需要停止程序或重启它）。 \n\n\
  通过使用该工具的 `mapfule` 功能，数据将以高效的方式恢复，因为它只读取所需的块。你还可以选择随时停止 `ddrescue` 进程并在稍后从相同点重新恢复。\
  \ \n\n## Foremost\n\n有时你可能故意或无意中删除了文件，并在以后发现需要它们。`Foremost` 工具可以为你营救。该工具是一个开源工具，可以从完全格式化的磁盘上检索数据。文件周围的元可能会丢失，但检索的数据将是完好的。一个神奇的功能是，即使目录信息丢失，它也可以通过引用文件的头部或尾部帮助检索数据，使其成为快速可靠的数据恢复工具。\n\
  \n一个有趣的事实是，`Foremost`是由美国空军的特工开发的。\n\n## Galleta\n\n`Galleta` 工具帮助你解析你追踪的 cookie\
  \ 轨迹并将其转换为表格格式，以便导出供以后参考。 \n\n每当网络犯罪案件进行时，cookie 都可以作为证据。但理解原始格式的 cookie 是一项挑战性。这时\
  \ `Galleta` 工具就派上用场了，因为它帮助对 cookie 轨迹中获取的数据进行建模，然后可以通过其他软件进一步解码数据。这些软件需要输入的数据为表格格式，而这正是\
  \ `Galleta` 提供给这些软件的内容。\n\n# 信息收集工具 (Information Gathering Tools)\n\n任何攻击的前提都是信息。当你对系统有充分的信息时，目标系统就会变得非常容易。当了解目标系统的一切时，攻击的成功率也会较高。\n\
  \n信息收集的过程包括：\n\n- 获取有助于社交工程并最终有助于攻击的信息\n- 理解网络范围以及作为攻击计算的计算机\n- 识别并理解攻击的完整表面，即暴露的进程和系统\n\
  - 识别暴露的服务并尽可能收集有关它们的信息\n- 查询特定的服务以获取用户名等有用数据\n\n我们将逐一介绍 Kali Linux 中提供的信息收集工具。\n\
  \n## Nmap 和 Zenmap\n\n渗透测试是 Kali Linux 中的一个阶段，可以使用 `Nmap` 和 `Zenmap` 工具。`Nmap` 和\
  \ `Zenmap` 基本上是相同的工具。`Zenmap` 是命令行 `Nmap` 工具的图形界面。\n\nNmap 用于安全审计和网络发现，是一个免费工具。除了渗透测试员，系统管理员和网络管理员还将其用于日常任务，例如监控服务器或服务的运行时间以及管理升级计划。\
  \ \n\n`Nmap` 通过原始的 `IP` 数据包识别网络上的可用主机。这还帮助 `Nmap` 识别主机上托管的服务，包括应用程序名称和版本。基本上，它帮助识别网络上最重要的应用程序是主机上的过滤器或防火墙。\n\
  \n### 隐蔽扫描 (Stealth Scan)\n\n隐蔽扫描也称为半开放扫描或 `SYN` 扫描。之所以这样命名是因为它避免了完成标准的 TCP 三次握手。攻击者向目标主机发送\
  \ `SYN` 数据包，目标主机确认 SYN 并返回 `SYN/ACK`。如果收到 `SYN/ACK`，可以安全地假设到目标主机的连接将完成，且端口是开放并可以监听目标主机的。如果收到的是\
  \ `RST`，则假设该端口在目标主机上是关闭或未活跃。\n\n\n\n\n\n`braa` 是一种用于大规模扫描简单网络管理协议（SNMP）的工具。该工具允许你进行\
  \ SNMP 查询，但与其他一次仅向 SNMP 服务发送单个查询的工具不同，`braa` 能够使用单个进程同时对多个主机进行查询。`braa` 的优势在于它能够极快速度地扫描多个主机，而且消耗的系统资源非常有限。\n\
  \n与需要 SNMP 库才能运行的其它 SNMP 工具不同，`braa` 实现了并维护了自己的一套 SNMP 栈。该实现方式非常复杂且凌乱。它支持的数据类型有限，在任何情况下都无法达到标准。然而，`braa`\
  \ 的开发目标是成为一个快速的工具，而它确实很快。\n\n# dnsmap\n\n`dnsmap` 是一种最初于 2006 年出现的工具，其灵感源于 Paul\
  \ Craig 写的虚构小说《无人察觉的窃贼》。\n\n作为渗透测试人员在信息收集阶段使用的工具，`dnsmap` 能够帮助发现目标公司的 IP 地址、域名、网段、电话号码等。\n\
  \n`dnsmap` 还有助于子域名破解，这在 DNS 区域传输（zone transfers）失效的情况下非常有帮助。如今已经不再允许公开进行区域传输，这使得\
  \ `dnsmap` 变得不可或缺。\n\n# Fierce\n\n`Fierce` 是一个 Kali 工具，用于扫描端口和映射网络。通过使用 `Fierce`可以实现跨网络的主机发现以及对非连续\
  \ IP 空间的扫描。它是一个类似于 `Nmap` 的工具，但在 `Fierce` 的情况下，它专门用于企业内部的网络。\n\n一旦渗透测试人员定义了目标网络，`Fierce`\
  \ 会对目标网络中的域名进行大量测试，并获取对攻击者有价值、可以分析和利用的信息。\n\n`Fierce` 具有以下特性：\n\n* 支持通过自定义和内置测试列表进行暴力攻击的能力\n\
  * 发现名称服务器\n* 区域传输攻击\n* 扫描内部和外部 IP 范围\n* 有修改 DNS 服务器以进行反向主机查找的能力\n\n# Wireshark\n\
  \n`Wireshark` 是一个 Kali 工具，它是一个开源网络分析器，适用于于 Linux、BSD、OS X 和 Windows 等多个平台。\n\n它可以帮助人们理解网络的工作原理，因此在政府基础设施、教育行业和其他企业中具有用途。\n\
  \n它与 `tcpdump` 工具类似，但 `Wireshark` 高出一个水平，因为它有一个图形化界面，你可以通过该界面过滤和组织捕获的数据，这意味着进一步分析数据所需的时间更短。它还有一个纯文本版本称为\
  \ `tshark`，其功能几乎完全相同。\n\n`Wireshark` 具有以下特性：\n\n* 界面具有友好的 GUI\n* 数据包的实时捕获和离线分析\n\
  * 支持 `Gzip` 压缩和提取\n* 完整协议检查\n* 完整的 VoIP 分析\n* 支持 `IPsec`、`Kerberos`、`SSL/TLS`、`WPA`/WPA/2`\
  \ 解密\n\n# URLCrazy\n\n`URLCrazy` 是一个 Kali 工具，通过测试和生成域名的拼写错误和变体来针对 URL 劫持、抢注（typo\
  \ squatting）和企业间谍活动。它拥有一个数据库，可以为域名最多 15 种类型的变体以及 8000 个常见拼写错误。`URLCrazy` 支持多种键盘布局，检查特定域名是否在使用中，并计算某个拼写错误的流行程度。\n\
  \n# Metagoofil\n\n`Metagoofil` 是一个 Kali 工具，旨在检索公司在互联网上公开的 `pdf`、`xls`、`doc`、`ppt`\
  \ 等文件。该工具通过 Google 搜索扫描互联网并将此类文件下载到本地机器。然后该工具使用 `pdfminer`、`hachoir` 等库提取这些文件的元数据。该工具的输出随后作为输入进入信息收集流水线。输入包括用户名、服务器或机器名称以及软件版本，这些有助于渗透测试人员进行调查。\n\
  \n# Ghost Phisher\n\n`Ghost Phisher` 是一个 Kali 工具，用于攻击软件程序以及对有线和无线网络的安全审计。`Ghost\
  \ Phisher` 使用 `Python` 语言开发。该程序基本上模拟网络接入点，因此会在网络中部署自己的内部服务器。\n\n# Fragroute\n\n\
  使用 Kali Linux 中的 `Fragroute` 工具可以拦截并修改指向特定系统的流量。简单来说，源自攻击者系统的数据包被称为 `frag route`\
  \ 包，被策略性地路由到目标系统。攻击者和安全人员使用它来绕过防火墙。信息收集是 `fragroute` 的一个用例，因此被攻击者或渗透测试人员广泛使用。\n\n\
  # 反向工程工具\n\n我们可以通过从简单的乐高积木到汽车引擎的各种物品，通过逐个拆解零件然后将它们重新装好，学习如何制造和拆解某物。这种通过将事物拆解以进行深度研究并进一步改进的过程被称为反向工程（Reverse\
  \ Engineering）。\n\n反向工程技术在早期仅用于硬件。随着多年来的演变，工程师们开始将其应用于软件，现在也应用于人类 DNA。在网络安全领域，反向工程有助于理解如果一个系统被攻破，攻击者是如何进入系统的，以及他为了破解和进入系统所采取的步骤。\n\
  \n在进入企业基础设施网络时，攻击者确保他们正在利用一切可用工具。反向工程使我们能够对抗这些受资助且高技能的攻击者。Kali Linux 配备了许多对反向工程非常有用的工具。我们将列出一些工具并学习它们的用法。\n\
  \n## Apktool\n\n`Apktool` 是一个用于反向工程的工具。该工具能够将资源拆解为接近原始的形式，然后通过调整来重建资源。它还可以调试较小的代码。它具有类似于项目的文件结构，因此易于操作。通过\
  \ `Apktool`，你还可以处理具有重复性质的任务，例如构建 `apk`。\n\n## Dex2jar\n\n`Dex2jar` 是一个具有轻量级 API\
  \ 的 Kali 工具，旨在处理 Dalvik 可执行文件 `.dex`/`.odex` 格式。该工具基本上帮助处理 Java 和 Android 的 `.class`\
  \ 文件。\n\n它具有以下组件：\n\n* `Dex2jar` 拥有与 `ASM` 类似的轻量级 API\n* `dex-translator` 组件执行转换工作。它从\
  \ `dex` 读取到 `dex-ir` 格式，并在优化后转换为 `ASM` 格式。\n* `dex-ir` 组件被 `dex-translator` 组件使用，基本上表示\
  \ `dex` 指令。\n* `dex-tools` 组件处理 `.class` 文件。它用于修改 `apk` 等任务。\n\n\n\n\n\n# EDB 调试器\n\
  \n`edb debugger` 是一款 `Kali` 工具，它是流行的 Windows 工具“Olly debugger”的 Linux 对应版本。它是一个调试工具，模块化是其主要设计目标之一。其部分功能如下：\n\
  \n* 直观的图形用户界面\n* 所有常规调试操作，如单步跳、单步执行、运行和断点\n* 条件断点\n* 指令的基础分析\n* 查看或转储（Dump）内存区域\n\
  * 有效的地址检查\n* 符号映射的生成与导入\n* 各种可用的插件\n\n用于调试的核心内核以插件的形式集成，以便根据需要进行替换。\n\n数据转储（data\
  \ dump）视图采用标签页格式显示。此功能允许用户在同时打开多个内存视图的同时，可以在这些视图之间进行切换。\n\n# Jad 调试器\n\n`jad` 是一个\
  \ `Kali Linux` 工具，一种 Java 反编译器，也是全球最流行的反编译器。它是一个在命令行运行的工具，并用 `C++` 语言编写。多年来，已经开发了许多图形界面，它们在后台运行\
  \ `jad` 并为用户提供了一个舒适的前端，用于执行项目管理、源码浏览等任务。`Kali Linux` 在其发行版中内置 `jad`，用于 Java 应用程序调试和其他逆向工程流程。\n\
  \n# JavaSnoop\n\n`JavaSnoop` 是一个 `Kali Linux` 工具，允许测试 Java 应用程序安全性。通过开发 `JavaSnoop`，`Aspect`\
  \ 证明了其作为安全行业的领导者，为所有应用程序（而不仅仅是 Web 应用）提供验证服务。\n\n`JavaSnoop` 允许你通过挂载现有进程（类似于调试器），开始篡改方法调用、运行自定义代码，或者静静观察系统中发生的情况。\n\
  \n# OllyDbg\n\n`OllyDbg` 是一个 `Kali Linux` 工具，一个为微软 Windows 开发的 32 位汇编器级调试器。它特别实用的地方在于在源码不可用的情况下，强调对二进制代码的处理。\n\
  \n`OllyDbg` 具有以下特性：\n\n* 具有交互式用户界面，没有命令行烦恼\n* 直接加载并调试 `DLLs`\n* 允许用户定义函数描述、注释和标签\n\
  * 安装后注册表或系统目录中没有垃圾文件\n* 可用于调试多线程应用程序\n* 由于具有开放架构，可以集成许多第三方应用程序\n* 挂载到运行中的程序\n\n\
  # Valgrind\n\n`Valgrind` 是 `Kali Linux` 中的一个工具，用于对基于 Linux 的系统进行分析和调试。该工具允许你自动管理线程错误和内存管理错误。它帮助消除在寻找漏洞上浪费的小时，从而在很大程度上稳定了程序。通过\
  \ `Valgrind` 对程序进行详细分析，还可以提高程序的处理速度。这是一套用于 Linux 程序调试和分析的套件。`Valgrind` 发版目前包含以下生产级工具：\n\
  \n* `Memcheck`：检测内存错误\n* `DRD` 和 `Helgrind`：另外两个线程错误检测器\n* `Cachegrind`：分支预测和缓存分析工具\n\
  * `Callgrind`：分支检测分析工具和生成调用图的缓存分析工具\n* `Massif`：堆（heaps）分析工具\n* `Valgrind` 分发中还包含三个实验工具\n\
  * `SGCheck`：栈或全局数组溢出检测器\n* `DHAT`：第二个堆分析器，有助于理解堆块是如何使用的\n* `BBV`：基本块向量生成器\n\n# 逆向工程\n\
  \n逆向工程发挥着重要作用，制造商利用它来维持与竞争对手的竞争。在其他情况下，逆向工程基本上被用于发现软件缺陷并重新构建更好的软件版本。`Kali Linux`\
  \ 提供了在逆向工程领域为人知的工具。除了我们过的工具外，还有许多第三方逆向工程工具，但我们讨论的这些是安装在 Kali Linux 镜像中的。\n\n# 7.\
  \ 恶意软件与网络攻击\n\n在本章中，我们将讨论恶意软件类型，稍后将讨论网络攻击。首先，我们将讨论病毒、木马、蠕虫、勒索软件和其他设计不当的程序。但首先，让我们回答以下问题：\n\
  \n### 1) 什么是恶意软件？\n\n恶意软件（又名恶意程序）是一种旨在窃取、破坏或损坏存储在我们设备上数据的恶意软件程序。\n\n许多人使用“病毒”这一通用术语，这并不一定正确，因为可能有很多种危险程序。以下是（其中）一部分：\n\
  \n1) 病毒 (Virus)\n2) 木马 (Trojans)\n3) 蠕虫 (Worms)\n4) 勒索软件 (Ransomware)\n5) 间谍软件 (Spyware)\n\
  6) 广告软件 (Adware)\n7) 以及更多（Rootkit、时间炸弹、后门等）\n\n这是来自 [维基百科](https://en.wikipedia.org/wiki/Malware)\
  \ 的图片，显示了 2011 年来自互联网的恶意软件比例。从那时起，很多情况发生了变化，但拥有这样一个包含最常见恶意软件类型的层次结构是很有趣的。\n\n现在选取其中的一些恶意软件进行更详细讨论：\n\
  \n### 1) 病毒\n\n病毒是一种我们都熟悉的程序。无论我们的计算机被感染了病毒，还是我们听过/见过别人被感染，我们都知道这些病毒对我们来说非常危险（特别是对存储在计算机中的数据——这是我们最重要的元素）。\n\
  \n病毒程序利用不同操作系统的漏洞（特别是 `Windows`）并编写软件来利用这些设备的用户。\n\n### 2) 木马\n\n木马是一种设计成看似对用户有利的程序，但背后有其他意图的恶意代码。这类程序在互联网上非常常见（如上图所示），并且能够欺骗缺乏经验的用户。因此，在木马首次运行时，它会安装并静静执行工作。这个术语源于希腊神话中的特洛伊马](https://en.wikipedia.org/wiki/Troy_(film)).\n\
  \n### 3) 蠕虫\n\n蠕虫恶意软件的形式，一旦感染设备（电脑、笔记本、服务器等），就会尽力扩散并感染网络上的其他设备。因此，蠕虫会导致网络和连接设备（通过消耗\
  \ `CPU` 和 `RAM` 资源）产生异常流量。\n\n### 4) 勒索软件\n\n最近更流行的恶意软件类型是勒索软件，其目的是加密受害者的硬盘（或 `SSD`）并索要解密密钥。\n\
  \n### 5) 广告软件\n\n有些程序在安装到设备（或浏览器）后会开始显示广告（烦人的）。\n\n### 6) 间谍软件\n\n间谍软件是旨在从用户那里提取某些数据的程序。它们不会伤害（通过消耗资源）或以任何方式影响受害者，而只是提取数据并发送到“母服务器”（发起间谍的人）。\n\
  \n首先，你需要意识到这些程序的存在，之后要对它们采取防护/预防措施。\n\n在这种情况下，杀病毒程序是非常受欢迎的，因为它们包含了巨大的数据库（称为签名），可以检查操作系统（`Windows`、`Linux`\
  \ 或 `Mac`）上的每个程序/文件。\n\n现在你也可以知道 Windows 有最多的恶意软件（病毒、木马、勒索软件等）。为什么？因为 Windows 是世界上最广泛使用的操作系统，黑客有东西可以“偷”。这就是为什么攻击者和网络安全公司的主要目标是\
  \ Windows 的原因。\n\n\n\n\n\nMac 和 Linux 也并非免受恶意软件的侵害，但其数量并不大。它们在设计时考虑了更高的安全性，且运行机制与\
  \ Windows 完全不同。\n\n# 网络攻击示例\n\n这些黑客方法非常常见，每种方法都有特定的目的。\n\n## 什么是网络攻击？\n\n网络攻击是指个人（怀有恶意意图）利用特定系统（服务器、计算机、网络设备、应用程序等）存在的漏洞的手段。\n\
  \n以下是互联网上最常见的攻击类型：\n\n1) `MITM`-中间人攻击\n2) `DoS`-拒绝服务\n3) `DDoS`-分布式拒绝服务，查看此链接：[\
  \ [`www.digitalattackmap.com/`](http://www.digitalattackmap.com/)]\n4) `SQLi`-SQL\
  \ 注入\n5) `XSS`-跨站脚本\n\n此外，互联网世界中还有许多攻击，但为了说明问题，我们将只关注前 3 种。因此，让我们从第一种攻击 `MITM` 开始，对其进行更详细的讨论（并向你展示一些进行此类攻击的方法——请务必以符合道德的方式进行），之后我们将进一步讨论\
  \ `DoS` 和 `DDoS`。\n\n最后，我们还会讨论网络安全以及其他类型的攻击：SQL 注入和 `XSS`。\n\n## 什么是 MITM（中间人）攻击？\n\
  \n`MITM` 是一种网络攻击，旨在监听连接到同一网络的用户流量。\n\n这意味着什么？这意味着如果你去镇上的某个咖啡馆，有人可以与你连接到同一个 Wi-Fi，只需通过几条命令，他们就能看到你在\
  \ Facebook、Google 等上的所有对话。\n\n情况确实如此，但不要担心，因为事情没有那么简单。为什么？因为我们大多数的互联网连接都是安全的（使用\
  \ `HTTPS` 而不是 `HTTP`；))），这并不意味着没有人能监听你的流量。\n\n为了避免此类情况，我建议你在公共场所使用 VPN。\n\n有几种方法可以实施\
  \ `MITM`（我在下面列出许多可能性中的几种）：\n\n● `MAC Spoofing`（MAC 欺骗）\n● `ARP Spoofing`（ARP 欺骗）\n\
  ● `Rogue DHCP Server`（造假 DHCP 服务器）\n● `STP Attack`（STP 攻击）\n● `DNS Poisoning`（DNS\
  \ 污染）\n\n这些是最常见的攻击。在下文中，我将讨论其中一些，并为你提供一些如何操作的实际示例。\n\n### 1) MAC Spoofing\n\n“Spoofing”一词源于“欺骗”，在这种情况下，它指的是通过将某台计算机的的\
  \ `MAC` 地址伪装成另一台计算机（甚至是路由器），从而欺骗网络中的至少一个设备。\n\n这可以使用更改 PC MAC 地址以查看其流量的程序轻松实现。[这里有一个关于如何在\
  \ Windows 10 上更改 MAC 地址的示例](https://windowsreport.com/mac-address-changer-windows-10/)\
  \ (https://windowsreport.com/mac-address-changer-windows-10/)，但我认为，与 Linux 相比，这个过程要复杂得多：\n\
  \n```bash\n# ifconfig eth0 down\n# macchanger -m 00:d0:70:00:20:69 eth0\n# ifconfig\
  \ eth0 up\n```\n\n首先，我们停止接口（在本例中为 `eth0`），然后使用 `macchanger` 命令帮助我们更改 MAC 地址，`-m`\
  \ 参数允许我们指定地址。要进行验证，使用命令：`#ifconfig`\n\nPS：如果你想生成随机 MAC，请使用：`#macchanger -r eth0`\n\
  \n### 2) ARP Spoofing\n\n`ARP Spoofing` 的工作原理与 MAC 欺骗类似，只是攻击者利用 `ARP` 协议误导整个网络，使其认为\
  \ MAC 地址 `X` 实际上是路由器。因此，所有想要访问互联网的网络设备都会将流量发送给攻击者（攻击者将其重定向到路由器）。在这种情况下，攻击者可以使用 `Wireshark`\
  \ 等流量捕获程序查看所有通过它的流量。\n\n要启动此类攻击，我们必须先在 Linux 上启动路由进程，以便流量可以从受害者到路由器，反之亦然（通过我们，即“攻击者”）：\n\
  \n```bash\n# echo “1” > proc/sys/net/ipv4/ip_forward\n# cat /proc/sys/net/ipv4/ip_forward\n\
  ```\n\n现在我们将流量重定向到我们想要监听的端口：\n\n```bash\n# iptables -t nat -A PREROUTING -p tcp\
  \ --destination-port 80 -j REDIRECT --to-port 8181\n```\n\n之后，我们需要安装程序：\n\n```bash\n\
  # sudo apt-get update\n# sudo apt-get install dsniff\n```\n\n现在我们可以下命令开始启动攻击了：\n\
  \n```bash\n# sudo arpspoof -i eth0 -t 192.168.1.3 192.168.1.1\n# sudo arpspoof -i\
  \ eth0 -t 192.168.1.1 192.168.1.3\n```\n\n● `-i eth0`:我们将启动攻击的接口\n● `-t 192.168.1.3`:受害者的\
  \ IP（我们想要攻击的设备 - 请根据网络中的 IP 进行更改）\n● `-t 192.168.1.1`:路由器\n\n\n\n\n\n我们接下来需要关注的是\
  \ VPN 的类型和用途。在这台服务器上，我们主要有两个选项可以使用，它们根据其用途进行分类。这包括站点到站点（site-to-site）和远程访问（remote\
  \ access）。远程访问 VPN 是家庭或个人用户最常用的类型，用于保护他们的匿名性，或者确保他们能够绕过某些限制，例如区域限制、公司限制或 ISP 限制。\n\
  \n如果家庭或企业用户希望从办公室以外的地方访问自己的局域网（LAN），他们可能会使用这种 VPN。对于拥有远程办公人员的公司，或者有多个地点但仍需要为服务和数据库提供中央访问点的公司来说，这种安排可能是最理想的。家庭用户可以选择以类似于此处的方式设置其中一个\
  \ VPN，以便访问他们家中的文件，或者让他们有一种方法可以从远程位置控制自己的电脑。\n\n虽然远程访问 VPN 可以创建一个加密连接，但它是通过对在互联网上传输的数据包进行封装的过程完成的，其方式看起来与标准流量无异。站点到站点\
  \ VPN 通过采用任何可以维持路由器之间通信的协议，来帮助我们建立更安全的连接。这种通信只有在服务器和客户端汇合并相互验证信息时才可能。\n\n## VPN\
  \ 协议\n\n你的 VPN 使用的协议类型很大程度上取决于你服务器的用途以及用户的一些需求。许多商业 VPN 服务可以帮助客户端选择他们想要使用的服务器协议。这种选择通常被视为在速度、可靠性和安全性之间的一种权衡。\n\
  \n加密从本质上说会为了隐藏信息而稍微减慢连接速度，但由于通常有多个用户共享该服务器访问，严重的拥塞将是速度变慢的更可能的原因。你想要访问的内容类型也会影响协议的选择。例如，音频流媒体和视频流媒体需要对\
  \ `UDP` 端口的支持以及比我们看到的普通 `HTTP` 浏览更多的带宽，因此我们也必须考虑其速度。\n\n现在，对于想要使用的 VPN 以及我们如何确保其受到保护，有几种不同的协议可以让我们。第一个选项是\
  \ OpenVPN。这是一种非常常见且流行的 VPN 协议，它使用了许多不同的库（都是开源的）来帮助通信和加密。\n\n我们能看到的这种协议最大的优势是，它可以轻松地应用于你想要使用的任何端口或子层协议，特别是当我们谈论安全性时。缺点之一是，目前大多数浏览器都无法原生支持它，如果你想使用这种协议，将需要依靠一些第三方软件来确保你的移动设备或计算机能够连接到该服务器。\n\
  \n我们能够使用的下一种类型的 VPN 协议被称为点对点隧道协议，或 `PPTP`。这是一个较旧的协议，但仍有很多程序员在使用它。`PPTP` 为我们提供了一些加密，但它充满了许多安全漏洞，由于它的年代久远，它可能比其他某些协议更容易被利用。\n\
  \n然而，因为它能够支持一些旧平台以及一些遗留操作系统，而且因为它仍然易于使用，这是一种尽管有缺点但仍然很常见的协议。许多 VPN 服务会为喜欢或需要使用 `PPTP`\
  \ 的客户端提供这种 `PPTP` 选项，但他们也会花时间警告客户某些安全风险。\n\n我们能够使用的第三种选项被称为二层隧道协议，或 `L2TP`。这是可以被选择的协议之一，因为它易于使用且具有原生支持，但你所信赖的通道并不十分安全。事实上，这种协议无法执行某些自身的数据加密，因此我们需要将其与其他几种加密协议结合使用以完成工作。我们在这个选项中可能看到的另一个缺点是，它必须局限于单个端口，这使得\
  \ ISP 或防火墙更容易进行拦截，对于黑客来说也不太好。\n\n## 选择我们的 VPN\n\n家庭用户在连接互联网时，会寻求使用这种 VPN，无论他们决定使用哪种协议，为了匿名性、安全性和自由。通常他们会有几个选择，在速度、可靠性、安全性和成本之间发生权衡。虽然\
  \ VPN 提供了加密，并为客户端提供出口节点来很大程度上隐藏他们的身份，但作为一个黑客，你想要确保你知道是否有人能够记录或跟踪你的活动。\n\n在选择这些 VPN\
  \ 之一时，我们需要考虑的问题之一是是否存在用户日志记录。如果 VPN 活动日志被执法部门传唤或被黑客攻破，那么出口节点所提供的相对匿名性就将不再是优势了。如果用户想要添加那层匿名性，那么他们需要确保他们选择的\
  \ VPN 是不日志的服务。但请记住，“不日志”实际上意味着“最小日志”。\n\n会有一定数量的内部日志产生，以确保 VPN 能够维持其连接的可靠性和速度，并确保没有受到攻击。最好的服务将仅维持稳定运行所需的最少日志记录，并且不会比需要的时间保留保留这些日志。\n\
  \n作为这里的黑客，我们需要确保对某些 VPN 保持怀疑，特别是那些声称不记录任何活动的免费 VPN，至少在你能够阅读细则并确切知道公司记录和不记录什么之前。此外，这些免费服务本身并不一定值得信赖。在使用任何免费\
  \ VPN 之前，进行自己的尽职调查是必须的。\n\n## VPN 的额外安全考量\n\n如果用户对购买某些信誉良好的 VPN 服务订阅感到犹豫，因为他们担心该交易会丢失所有的匿名性，那么市上有一些商业\
  \ VPN 允许你使用类似 `bitcoin` 的工具来支付费用。如果你担心通过这些系统的日志暴露你的身份，即使服务器是不日志服务器，也可以通过一种被称为 VPN\
  \ 链接的过程将几个 VPN 连接结合起来。\n\n\n\n\n\n当我们可以将 VPN 连接到一台主机上时，我们将在同一台主机的虚拟机上为 VPN 设置一个不同的服务。如果内部\
  \ VPN 的任何日志被泄露，该活动仍将作为来自外部 VPN 的操作被记录下来。虽然存在有人尝试获取外层 VPN 日志的可能性，但这仍然是一个额外的障碍，而且大多数公司不会去承担这种风险。\n\
  \n请注意，有几种 VPN 服务可以为您提供一种选项，即通过之前讨论过的洋葱网络（Onion network）的帮助，从 VPN 服务器连接到目标地。虽然这能为我们提供一些额外的安全优势，但会导致连接速度变慢，因此我们也必须考虑这一点。\n\
  \n# 9. 使用框架进行攻击\n\n## 社会工程学\n\n由于技术在我们几乎所有的活动中的应用日益增加，公司和组织投入了巨额资金来确保他们使用的技术能够免受黑客的攻击。这些公司开发并实施了广泛的防火墙，以防止任何可能的安全漏洞。尽管通过网络连接可以轻松获取信息，但大多数互联网用户并没有安全意识。加之的是，大多数恶意黑客将精力集中在计算机服务器和客户端应用程序漏洞上。多年来，这些黑客在收集信息以及构建对网站和\
  \ Web 应用的攻击方面变得越来越有创意。由于在网络安全上投入了巨额资金，我们本以为恶意信息窃取或控制已经得到了消除。然而，事实并非如此。\n\n这就是我们使用社会工程学来实现目标的地方。这是一种非技术手段，可以绕过公司的安全措施。无论一家公司的在线应用程序有多安全，它们仍然容易受到黑客攻击。黑客已经能够利用社会工程和基于社会工程学的工具实现这一点。社会工程学是一种实操性的黑客方法。它涉及针对个人并操纵他们提供关键信息，从而导致安全系统的泄露。这些个人（可能是组织的员工，甚至是目标组织高层人员的近亲）会被接触并被迫使信任黑客。他们开始收集可能在黑客攻击过程中大有用的信息。这通常是公司防火墙能够有效阻止外部渗透时所采取的方法。当黑客获取了必要信息（例如，社会工程学目标的登录信息）后，他们就可以从内向外攻破该公司。\n\
  \n人们认为，人类是任何信息安全链中最薄弱的环。。社会工程学的物理方法可以通过许多方式发生，在本章中无法涵盖所有方式。然而，流行的手段包括接触并与公司员工建立朋友关系（甚至是伴侣关系）。有时，员工会收到一个包含电影或其他他们感兴趣的文件闪存驱动。员工插入驱动盘并启动一个在后台执行脚本的文件，从而授予黑客对相应机器的访问权限。社会工程攻击还可能发生在某人给员工打电话，冒充呼叫中心代表并告诉员工他或她需要信息来纠正一项重要的服务。黑客可能从员工的社交媒体账户或通过与该人的私人对话收集了有关该员工的细节。一旦黑客获取了信息（可能包括受害者的社会安全号码或登录详情），黑客就会劫持账户并在上面进行欺诈交易，或将其用于额外的攻击。社会工程学可以轻松构建一个用户名和密码列表，帮助登录目标账户。\n\
  \n黑客利用他们收集的信息，结合确保能轻松攻破公司系统的工具。这些工具大部分都用于客户端攻击，并根据通过社会工程学收集的信息进行增强。如果直接的社会工程攻击失败，这些信息将与网络钓鱼和伪装工具结合起来攻击客户端。在攻击客户端这种方法中，社会工程学是收集信息的程序。黑客攻击已变成一种商业活动。黑客获取信息仅仅是为了为了钱出售，或将其用于转账。现在的动机是金钱。通常，先选择目标，然后黑客利用公开的关于客户的信息来开发攻击。通常情况下，从网上获得的信息就足够构建攻击了。然而，随着员工对黑客和社会工程学教育的增加，员工已开始限制他们在社交媒体和其他公共平台上分享的个人信息。\n\
  \n基于社会工程学的攻击的成功与完全取决于所收集信息的质量。攻击者在与受害者互动时必须表现得乐于社交且有说服力，使受害者变得开放并开始信任黑客。一些黑客会将这一方面外包给擅长让人吐露秘密的个人。\n\
  \n## 社会工程学工具包 (SET)\n\n社会工程学工具包是计算机辅助社会工程攻击中使用的非常重要的工具。它预装在 Kali Linux 发行版中。它用 Python\
  \ 编写，也是一个开源工具包。社会工程学工具包，或 `SET` 由 David Kennedy 创建，用于利用网络安全中的人性因素。然而，确保社会工程学工具包保持更新是非常重要的。一旦更新了工具，就可以设置配置文件。默认配置文件足以让\
  \ `SET` 无任何问题地运行。高级用户可能想要编辑和调整某些设置。然而，如果你是初学者，在更加熟悉社会工程学工具包之前，最好保持原样。要访问配置文件，打开终端，然后切换目录到\
  \ `SET`。打开 `config` 文件夹，你会发现 `set_config` 文件，你可以用文本编辑器打开并编辑它以更改参数。\n\n可以通过点击应用程序图标，然后点击\
  \ Kali Linux 桌面访问社会工程学工具包。接下来，点击 BackTrack 然后点击利用工具（Exploitation Tools）。点击社会工程学工具（Social\
  \ Engineering Tools）并点击选择 `SET`。`SET` 将终端窗口中打开。或者，也可以直接在终端中输入 `setoolkit`（不带引号）来打开\
  \ `SET`。\n\n社会工程学工具包以菜单的形式在终端中打开。菜单根据你需要使用的社会工程攻击类型包含不同的选项。编号 1 的选项用于针对性钓鱼攻击向量（spear-phishing\
  \ vectors），它允许用户执行网络钓鱼攻击。网络钓鱼攻击是一种电子邮件攻击。它就像向随机潜在受害者发送电子邮件来撒网。相比之下，针对性钓鱼针对的是个人，且邮件更具个性化。\n\
  \n\n\n\n\n`SET` 菜单上的第二个选项是网站攻击向量，它使用不同的网络攻击方法针对其目标受害者。网站攻击向量选项到目前为止是社会工程工具（Social\
  \ Engineering Toolkit）中最受欢迎且可能也是常用的选项。点击网站攻击向量选项将打开一个包含 Java applet 攻击向量、Metasploit\
  \ 浏览器漏洞利用、用于克隆网站的凭据收集器攻击、标签劫持（tabnabbing）攻击、中间人攻击、网页劫持攻击和多攻击网络方法的菜单。\n\n社会工程工具菜单上的第三个选项是感染性媒体生成器。这是一个非常易用的工具，目标是那些能够让黑客访问组织网络的个人，从而使黑客能够从网络内部进行攻击。该工具允许黑客创建一个包含恶意脚本的\
  \ `USB` 盘或 `DVD`，该脚本可以赋予黑客对目标 shell 的访问权限。选择此选项将打开一个菜单，提示在文件格式漏洞或标准 Metasploit 可执行文件之间进行选择。选择文件格式选项将打开一个载荷列表供从中选择。默认是一个嵌入在可执行脚本中的\
  \ `PDF` 文件。然后，它会被发送到驱动器，并在该驱动器创建带有 `PDF` 文件的 `autorun.inf`。当员工打开驱动器上的文件时，文件会在后台执行，黑客即可获得受害者计算机的\
  \ shell 访问权限。\n\n第四个选项是 `generate-a-payload-with-listener` 选项。此选项允许黑客创建一个恶意脚本作为载荷并生成一个监听器。该脚本是一个\
  \ `.exe` 文件。关键是要让受害者点击并下载此脚本。一旦受害者下载并执行了该 `.exe` 文件，监听器就会提醒黑客，黑客就可以访问受害者的 shell。\n\
  \n社会工程工具中的第五个选项是批量邮件发送器。点击此选项将弹出一个包含两个选项的菜单：单电子邮件地址攻击和批量邮件发送邮件攻击。单电子邮件地址攻击允许用户向单个电子邮件地址发送邮件，而批量邮件邮件攻击允许用户向多个电子邮件地址发送邮件。选择此选项将提示用户选择一个包含多个电子邮件地址的列表，然后将邮件发送到这些地址。\n\
  \n列表中的第六是基于 Arduino 的攻击。通过此选项，你获得了破坏 Arduino 设备的手段。另一方面，第七个选项是 SMS 伪装选项，它允许黑客向某人发送短信。此\
  \ SMS 伪装选项将打开一个菜单，提供执行 SMS 伪装形式攻击或创建社会工程模板的选项。选择第一个选项将发送到单个号码或进行批量短信攻击。仅选择单个号码将提示用户输入接收者的手机号码。然后，你会被要求使用预定义模板或编写自己的消息。根据你对短信的偏好，输入\
  \ `1` 选择第一个选项而输入 `2` 选择第二个选项。然后你输入源号码，即你希望接收者看到作短信发送件的号码。接下来，你输入你想让接收者看到的消息。你可以嵌入指向钓鱼网站的链接或指向会导致用户下载恶意\
  \ `.exe` 文件的页面链接。消息编写好后，屏幕上会显示用于 SMS 伪装的服务选项。其中一些是付费选项，另一些是免费的。\n\n`SET` 中的第八个选项是无线\
  \ AP 攻击向量。此选项用于创建一个伪造的无线 AP，不知情的公共 Wi-Fi 用户可以连接，黑客可以嗅探他们的流量。此选项使用其他应用程序来实现这一目标。`AirBase-NG`、`AirMon-NG`、`DNSSpoof`\
  \ 和 `dhcpd3` 是与无线 AP 攻击向量协同工作的所需应用程序。\n\n菜单中的第九个选项是 QR 码攻击向量。如今，QR 码无处不在，从物品识别到获取促销产品的更多详情。现在\
  \ QR 码甚至被用于支付。某些网站使用 QR 码登录或作为 Web 应用。这种登录方法被使用因为它被认为是获取访问更安全的方式，因为黑客可以窃取 cookie、执行中间人攻击甚至使用暴力破解密码获取未经授权的访问。然而，QR\
  \ 码使用的增加为黑客提供了更多利用受害者的途径。QR 码攻击向量帮助黑客创建一个恶意的 QR 码。然后黑客使用凭据收集器选项创建或克隆像 Facebook 这样的网站，并将恶意的\
  \ QR 码嵌入指向克隆网站的链接中。随后，黑客向受害者发送钓鱼邮件或伪造短信，提示该人员用移动设备扫描代码。当受害者访问网站并输入登录详情时，这会泄露受害者的\
  \ GPS 位置和其他信息。\n\n菜单中的第十个选项是 PowerShell 攻击向量。此选项允许黑客在操作系统的 PowerShell 中部署载荷。PowerShell\
  \ 是 Windows 操作系统中命令提示符更强大的选项。它允许访问操作系统的不同区域。它由微软开发用于简化任务自动化和文件配置，并从 Windows Vista\
  \ 发布以来一直随 Windows 操作系统一起。PowerShell 攻击向量允许攻击者创建一个脚本，然后在受害者的 PowerShell 中执行。选择此选项将引出四个菜单选项：PowerShell\
  \ 字母数字注入器、PowerShell SAM 数据库、PowerShell 反向 shell 和 PowerShell 绑定 shell。其中任何一个选项都会创建一个针对性的\
  \ PowerShell 程序并导出到 PowerShell 文件夹中。欺骗目标访问、下载并执行此程序将为攻击者创建访问权限。\n\n到目前，你应该意识到 `SET`\
  \ 在执行计算机辅助的社会工程攻击方面是多么强大。这个工具对于渗透测试人员非常有价值，因为它提供了一种强大且化的化的手段检查组织网络可能存在的各种漏洞。\n\n\
  ### BeEF\n\nBeEF 代表浏览器利用框架（Browser Exploitation Framework）。该工具包含大多数基于安全的 Linux 发行版中，例如\
  \ Parrot OS 和 Kali Linux。BeEF 最初作为一个通过攻击者浏览器访问的服务器。它的创建是为了针对网络浏览器的漏洞，从而获得执行命令的目标系统。BeEF\
  \ 是由 Wade Alcorn 领导的团队使用 Ruby 语言在 Rails 平台上编写的。正如之前提到的，密码、cookie、登录凭据和浏览历史通常存储在浏览器中，因此对客户端进行\
  \ BeEF 攻击是非常危险的。\n\n然而在 Kali Linux 上，BeEF 已包含在发行版中。可以通过进入应用程序、点击利用工具然后点击 BeEF XSS\
  \ 框架来启动 BeEF 框架。这将显示 BeEF 框架服务器已启动的终端。一旦服务器启动，我们打开选择的浏览器并访问端口 3000 的 `localhost`。这在浏览器的\
  \ URL 空间中显示为 `localhost:3000/ui/authentication` 或 `127.0.0.1:3000/ui/authentication`。这将带我们进入\
  \ BeEF 框架的身份验证页面，需要登录用户名和密码。\n\n\n\n\n\n# 一旦进入 BeEF 框架，它就会打开一个“入门”（Get Started）选项卡。在这里，你将接触该框架并学习如何使用它。特别重要的是挂钩（hooking）浏览器。挂钩浏览器涉及点击\
  \ JavaScript 载荷，让 BeEF 框架访问客户端浏览器。我们有多种方法可以部署此载荷，但最简单的方法是创建一个包含该载荷的页面，提示目标访问该页面并执行\
  \ JavaScript 载荷。你可以在这方面充分发挥创意。另一方面，“入门”页面上有一个链接，可以将你重定向到“屠夫”（The Butcher）页面。该页面下方有包含\
  \ JavaScript 载荷的按钮。点击此按钮将执行脚本，从而挂钩你的浏览器。当你的浏览器被挂钩时，你会在 BeEF 控制面板左侧浏览器图标旁边看到一个挂钩图标，标题为“已挂钩的浏览器”（Hooked\
  \ browser），以及在线和离线浏览器的文件夹。\n\n# 浏览器被挂钩后，无论它是在线还是离线，我们都可以从 BeEF 控制面板对其进行控制。点击控制面板中的详情菜单可以提供如受者的浏览器版本和安装的插件等信息。浏览器的窗口大小也可以用于确定受者的屏幕尺寸、浏览器平台（即\
  \ PC 上的操作系统）以及更多信息。为了在浏览器上执行命令，我们点击控制面板中的命令菜单。这会弹出一系列可以在受者浏览器上执行的不同命令。这些命令会在受者的浏览器上创建一个弹窗消息，因此在执行之前可以对其进行创意性的重命名以避免引起怀疑。该菜单中可以执行的命令包括：获取所有\
  \ Cookie（Get all Cookie）命令（开始收集受者的浏览器 Cookie）、截图（Screenshot）、用于拍摄受害者照片的摄像头（Webcam）、获取访问\
  \ URL（Get visited URL）命令等。该菜单中有许多命令。\n\n# BeEF 框架的 JavaScript 载荷也可以挂钩手机浏览器。如果我们最终挂钩了手机浏览器，在挂钩后检查详情选项卡将获得特定信息。点击模块并搜索\
  \ PhoneGap 命令允许我们执行手机手机命令，例如定位设备和在受害者设备上启动音频录制。点击 Ipec 菜单还会显示一个我们可以用于向受者系统发送 shell\
  \ 命令的终端。\n\n# 一旦 BeEF 框架挂钩了浏览器，可能性就是无限的。我们几乎可以做任何事情。因此，在点击链接和弹出或 Flash 消息时保持谨慎是非常重要的。\n\
  \n# METASPLOIT \n\nMetasploit 框架可能是当今最大、最完整的渗透测试和安全审计工具。该工具是一个开源工具，定期更新新模块以监控即使是最新的漏洞。Metasploit\
  \ 随 Kali Linux 发行版一起。它用 Ruby 编写，尽管在创建时是用 Perl 编写的。该工具由 HD Moore 在 2003 年开发，并于 2009\
  \ 年卖给了一名为 Rapid7 的 IT 公司。\n\nMetasploit 是一个极其强大且极具多性的工具。要充分利用 Metasploit，你必须熟练使用终端（这是一个控制台类型的窗口）。然而，有一个选项允许在\
  \ GUI 窗口中使用 Metasploit。开源工具 Armitage 使得这成为可能，尽管它没有能力在攻击中充分利用 Metasploit 框架的所有方面。Metasploit\
  \ 框架中的 meterpreter 是一个注入到受者系统中的模块，使黑客能够控制那台 PC 并为未来对该系统的进一步攻击维持访问权限。在 Kali Linux\
  \ 上开始使用 Metasploit 只需要打开终端并输入 `msfconsole`（不带引号）。\n\nMetasploit 包含了可以在攻击期间使用的模块。其中一些模块由开源社区的开发者或贡献者编写。一组重要的模块包括载荷（payloads）。在\
  \ Metasploit 框架内执行攻击时，载荷非常重要。这些载荷是编写好的代码，让黑可以在受者的计算机上立足。在这些载荷中，流行的可能是 meterpreter。这种特定的载荷非常强大，因为它不会在系统硬盘上留下任何攻击痕迹。它仅存在于受者的系统内存中。\n\
  \n然后是利用（Exploits）模块。这些利用是针对受者操作系统特定缺陷编写并打包的代码。针对不同的操作系统漏洞存在不同的利用程序，因此针对一个漏洞的利用在用于另一个漏洞时将会失败。\n\
  \n编码器（encoders）是用于对部署到目标系统的不同载荷进行编码的模块，以避免受者的防病毒软件、反间谍软件或其他安全工具检测到。\n\nMetasploit\
  \ 框架上可用的其他模块包括 Post 模块（允许黑客收集密码、令牌和哈希值）、Nops 模块（大部分允许 100% 执行载荷或利用）以及 Auxiliary\
  \ 模块（不属于其他类别的模块）。\n\n该框架非常健壮，可以执行各种黑客程序。某些程序通过组合模块并让它们以不同的方式工作来实现。初学者学习更多 Metasploit\
  \ 框架的良好方法是在 Metasploit 框架控制台中输入 `help`（不带引号）。\n\n# 10. 使用 Kali Linux 进行攻击的真实示例\n\
  \nKali Linux 拥有超过 600 个工具。每种工具都执行不同的功能。由于存在不同类型的黑客，每种黑客都会总是尝试寻找系统内存在的漏洞。白帽黑客确保他们已经修复了所有漏洞。黑帽黑客通常利用这些漏洞来获取不同的信息，并将其用于个人利益。我们现在来看一些人员如何使用\
  \ Kali Linux 进行攻击的示例。\n\n在执行攻击时，你必须确保你已经进行了了先导研究（pilot study）。它可以帮助你收集在发起攻击时使用的信息。在识别出某些漏洞后，你可以利用网络甚至\
  \ Web 应用程序。在利用过程中，你考虑的一些因素包括：\n\n- 攻击者应确保已完全描述了目标。如果攻击者没有对网络进行深入了解，攻击极有可能完全失败。此外，攻击者很容易被发现。\n\
  - 攻击者应首先查看利用程序是否广为人知。系统中是否已经定义了某些操作？如果一个利用程序没有被完全描述，可能会产生一些意外之外的后果。先确保所有利用程序都经过了验证是好的。\n\
  - 首先查看执行利用程序的方式。例如，攻击可能从远程位置进行，这意味着你不容易被捕获。主要问题是你对利用程序没有太多的控制权。\n- 考虑一些利用后活动（post-exploit\
  \ activities）。如果你需要先收集一些数据，你必须确保已经建立了某些交互操作。\n\n考虑你是否应该维持访问或你是否会被破解。这些因素将有助于确保你想出一种隐蔽的方法来避免检测。\n\
  \n\n\n\n存在许多很容易被识别的漏洞。其中一些利用程序基于不同的技术，这就是为什么系统很容易被攻破的原因。现在我们将提供一些关于如何使用 Kali Linux\
  \ 进行黑客的真实示例。\n\n## 威胁建模\n\n试点研究非常有用，它能确保你了解更多关于当前的漏洞。务必确保攻击是按照计划的方式进行协调的。否则，你可能无法实现你的目标。而且，你可能会很容易被发现。在执行攻击时，有一个通常被称为“威胁建模”的过程。值得注意的是，攻击者和测试人员使用的是相同的工具。主要的区别在于双方的动机。\n\
  \n在尝试提高攻击成功率时，威胁建模派非常用。这包括进攻性威胁建模，它涉及对研究和试点研究结果的使用。作为攻击者，你必须首先考虑目标的可用性。目标的类型如下所示：\n\
  \n- **首要目标**：当此类目标被攻破时，它们将支持目标的实现。\n- **次要目标**：这是一个可以提供密码和安全控制等信息的目标。这些信息在发起攻击时将非常有用。\n\
  - **三级目标**：这些目标很容易被攻破，而且也很容易被分散，这意味着它们也可以提供一些用于发起攻击的信息。\n\n对于每个目标，攻击者都应该始终确定他们想要使用的方法。如果存在某些漏洞，攻击者将继续发起攻击。如果是大规模攻击，可能会出现一些问题。一些攻击者利用攻击树方法。接下来的图表将提供关于攻击树方法的概述：\n\
  \n该方法用于尝试将某些攻击选项视觉化，以确保攻击按预期进行。在生成攻击树后，你可以视觉化可用的攻击选项。漏洞将确保你学习更多关于最合适的攻击选项。\n\n##\
  \ 如何使用漏洞资源\n\n试点研究帮助你了解更多关于目标的攻击面，这意味着你将评估以寻找漏洞的位点总数。如果服务器有一个操作系统，这意味着只有当该操作系统存在某些漏洞时，服务器才可能被利用。如果系统中安装了许多应用程序，就会有许多漏洞。\n\
  \n作为攻击者，你的任务是寻找系统内部存在的某些漏洞。刚开始，你应该确保已经查看了一些供应商的网站。你将获得一些关于不同漏洞的信息，以及某些补丁和升级发布的时间。针对不同的弱点存在一些利用程序，而且它们通常是为人知的。许多供应商会向其客户提供此类一些信息。当攻击者获取此类信息时，他们将利用它为自己谋利。你可以从许多来源获取这些信息。\n\
  \nKali Linux 有一个漏洞数据库。它位于 `/usr/share/exploitdb` 目录。在使用它之前，你应该使用以下命令更新它：\n\n首先，通过搜索\
  \ exploitdb 本地副本来打开终端窗口。然后你在命令提示符中输入 `searchsploit`。随后一个脚本将搜索拥有所有利用程序列表的数据库。然后你可以根据当前的漏洞提取、编译并运行这些利用程序。接下来的截图展示了一些漏洞。\n\
  \n打开终端窗口以搜索 exploitdb。在打开终端窗口后，你可以输入 `searchsploit` 命令。然后输入你想要查找的术语。将调用一个脚本，并出现一个包含所有利用程序的数据库。文件将是\
  \ `.csv` 格式。该搜索允许你了解不同的漏洞。你还可以提取利用程序，稍后针对各种漏洞对其进行编译和运行。下方的截图显示了各种漏洞的列表：\n\n在搜索本地数据库时，你会发现系统内部存在许多利用程序。路径列表也会列出一些描述。在发起攻击之前，你必须确保环境已经过自定义。某些利用程序以脚本的形式呈现，包括\
  \ `PHP`、`Perl` 和 `Ruby`。其中一些利用程序可以很容易地实现。如果你想黑入像 Microsoft IIS 6.0 这样的服务器，这种利用程序很容易，因为可以使用\
  \ `WebDAV` 远程访问服务器。要利用该服务器，你应该复制利用程序，然后将其复制到根目录。然后你将如下所示使用 `Perl` 脚本执行该利用程序：\n\n\
  这些利用程序中的是以源代码的形式存在的，在使用它们之前应该对其进行编译。例如，如果你正在搜索 RPC 漏洞，你会发现有许多漏洞。下方的截图显示了一个示例：\n\n\
  有许多漏洞，包括 `RPC DCOM`。它通常被识别为 `76.c`。在编译此利用程序时，你首先将其从存储目录复制到 `/tmp` 目录。在指定的 Location，你将使用下所示命令编译所有内容：\n\
  \n`76.c` 将使用 `GNU` 编译器进行编译。下方的截图将提供一些指导：\n\n在根据你的目标调用应用程序后，你应该确保你已经使用以下命令调用了可执行文件：\n\
  \n对于此利用程序，源代码已经有了充分的记录，你还应该遵守执行过程中非常清晰的参数。下方的截图提供了一些指导：\n\n尽管有很多利用程序，但并非所有的利用程序都会利用公共资源或编译为\
  \ `76.c` 的数据库。存在许多问题，这就是为什么使用其中一些利用程序会变成一件棘手的问题。一些问题包括：\n\n- 源代码不完整，并且可能存在一些故意的错误，因为某些开发者试图确保某些利用程序不会被没有经验的用户利用。这些初学者中的某些可能正尝试攻破系统，根据他们的具体操作，他们可能不熟悉涉及的一些风险。\n\
  - 某些利用程序没有以全面的方式进行记录，这意味着使用源代码的方法可能会带来一些问题。如果攻击者或测试人员遇到某些问题，他们将无法很好地利用这些利用程序。\n\
  - 环境的变化将带来一些不一致的行为，这意味着源代码将发生巨大变化。只有熟练的开发者应该处理此类任务。\n\n某些源代码中可能包含某些恶意功能，攻击者在尝试渗透系统时可能会利用此为自己谋利。恶意功能在尝试创建一个后门时非常有用，允许他们随心所欲进入系统。\n\
  \n作为攻击者，你会希望确保你的结果是一致的，这就是为什么一些程序员聚集在一起形成了一个社区。他们能够提出不同的且一致的实践。一些合适的利用框架包括 `Metasploit`\
  \ 框架。\n\n## Metasploit Framework\n\n\n\n\nMetasploit 框架是一个开源工具，旨在方便网络渗透测试。该框架是使用\
  \ `Ruby` 语言创建的。在创建过程中使用了模块化方法，这就是为什么人们可以轻松地编写和开发不同的漏洞利用。某些复杂的任务可以使用 Metasploit 框架轻松实现。\n\
  \nMetasploit 框架将始终为每个后端模块提供许多接口，从而易于控制整个利用过程。在本例中，我们将使用控制台界面，因为它能保证高速度。此外，界面会显示一些攻击命令，人们也可以轻松地理解该界面。您应该先打开命令提示符，然后输入\
  \ `msfconsole`。\n\nMetasploit 框架包含许多组合在一起影响漏洞利用的模块。这些模块包括：\n\n- **漏洞利用（Exploits）**：通常用于针对不同漏洞的代码片段。其中某些活动利用将针对特定的目标。它们会运行并在之后退出。而对于被动利用，它们只在用户连接到网络时才会采取行动。\n\
  - **攻击载荷（Payloads）**：载荷以恶意代码的形式存在，通常在漏洞利用成功后执行某些命令。\n- **后渗透模块（Post modules）**：在攻击成功后，这些模块将在某些受害的目标上运行。随后将收集一些重要数据，攻击者将获得对网络的深层访问权限。\n\
  - **辅助模块（Auxiliary modules）**：某些模块不允许攻击者与目标系统之间进行某些访问。这些模块执行诸如模糊测试、扫描或嗅探等活动。\n-\
  \ **编码器（Encoders）**：某些利用可以绕过某些杀毒软件防御。这些模块可对攻击载荷进行编码，使其无法被检测到用于匹配特征的技术。\n- **无操作模块（No\
  \ operations）**：这些模块用于在攻击期间促进缓冲区溢出。\n\n在进行试点研究时，您可以使用这些模块中的一些。如果您想在执行攻击时使用 Metasploit\
  \ 框架，可以遵循以下步骤：\n\n1. 选择一个漏洞利用并进行配置。根据当前的漏洞，配置后的代码将用于破坏系统。\n2. 检查目标系统，确定其是否容易受到攻击。\n\
  3. 选择并配置攻击载荷。\n4. 选择一种编码技术以绕过检测控制。\n5. 执行漏洞利用。\n\n### 利用有漏洞应用程序\n\nMetasploit 框架在利用某些第三方应用程序中存在的漏洞时非常有用。在本例中，我们将研究如何利用缓冲区溢出。首先，漏洞将存在于\
  \ `ReadFile` 函数中，该函数用于存储未安全存储的用户数据。在启动攻击时，测试人员必须生成一个特制的 `BMP` 文件。随后，目标在使用 `Chasys`\
  \ 应用程序时打开该文件。当此类活动发生时，基础操作系统将受到破坏。该攻击对 XP service pack 3 和 Windows 7 service pack\
  \ 1 等操作系统有效。\n\n要启动攻击，请打开 `msfconsole`。然后将使用 Metasploit 执行漏洞利用，如下所示：\n\n漏洞利用过程非常简单；但攻击者应该为目标系统设置一个反向\
  \ shell（reverse shell）。他们还应该确保系统已被破坏。漏洞利用完成后，将创建一个 `BMP` 文件，并默认以 `msf.bmp` 命名存储。攻击者应该确保他们已经诱导目标打开该文件。为了做到这一点，攻击者应确保文件没有使用默认名称存储，因为这可能被不同的设备检测到。名称应更改为与目标相关的名称。之后，攻击者应重新启动\
  \ `msfconsole` 的新实例。还将设置一个监听器来跟踪反向 TCP shell，因为在目标被破坏后，它将从目标端发起。下面的截图显示了一个简单的监听器。\n\
  \n在目标打开漏洞应用程序中的 `BMP` 图像文件后，两个系统中将建立一个 `meterpreter` 会话。`meterpreter` 提示符将替换 `msf`\
  \ 提示符。攻击者将无法使用命令 shell 远程访问系统。确保系统被破坏后的第一步是验证系统是否可以访问。下方的截图展示了攻击者在终端窗口中输入 `sysinfo`\
  \ 命令后的操作系统和计算机名称：\n\n### 使用 Armitage 如何利用多个目标\n\nArmitage 的功能可以类比于 Metasploit 控制台。使用\
