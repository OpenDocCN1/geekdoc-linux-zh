  \ 如何伪造地址\n- 11. 常见问题解答\n- 结论\n\n# 引言\n黑客通过计算机或程序代码工作，代码是一组在后台运行并构成软件的指令集。虽然许多黑客确实知道如何编写代码，但许多人只是下载并使用他人编写的代码。需要掌握的主要要求是如何运行这些代码并对其进行调整以达到自己的目的。对于恶意黑客来说，这可以是利用它来窃取密码、秘密、身份、财务信息，或者产生巨大的流量导致目标网站关闭。\n\
  \n### 窃取密码\n密码很容易破解，因为人类的行为是非常容易预测的。在密码方面，我们认为自己是独一无二的但实际上很容易被猜。例如，女性经常使用个人姓名作为密码——想想孩子、亲戚、旧情人——而男性则倾向于爱好。我们使用最频繁的数字是\
  \ 1 和 2，它们通常被放在密码的末尾。大多数情况下，我们使用一个单词后面跟着一些数字，如果网站坚持包含大写字母，我们就会把它放在单词开头，然后抱怨这个网站太烦人了，非得让我们做这一切。\n\
  \n但黑客是如何获取我们的密码的呢？嗯，有几种实用的技术。\n\n尝试错误法被称为`暴力破解攻击`（brute force attack），即通过尝试字母和单词的可能组合来尝试猜测正确的密码。这之所以有效，是因为正如之前提到的，在我们使用的密码类型方面，我们是非常容易被预测的。\n\
  \n另一种类似的技术被称为`字典攻击`（dictionary attack）；黑客使用一个包含字典中所有单词的文件，程序会尝试所有的单词。这就是为什么通常建议在密码中添加数字单词，但这并不意味着你的\
  \ `sunshine22` 密码就是无懈破解的。\n\n第三种技术是`彩虹表攻击`（rainbow table attack）。\n\n## 如何保护自己受密码攻击\n\
  使用加盐技术（salt）。这指的是在哈希输入中添加简单的随机数据。例如，密码可以是 `sunshine22`，但添加盐 `e34f8` 后，你的加盐密码变为 `sunshine22e34f8`。因此，加盐密码会被哈希并保存到数据库中。加盐只是降低了哈希值在任何预计算表中被找到的概率。如果你是网站所有者，为每个用户加盐为黑客创建了更复杂且更昂贵的操作。他们需要为每个加盐密码单独生成预计算表，使过程变得枯燥且缓慢。\n\
  \n即使使用了加盐技术，坚定的黑客也可以通过`password salting`。另一种实用的技术是`加料技术`（peppering technique）。就像盐一样，辣椒也是一个唯一值。辣椒与盐的不同在于，盐对每个用户是唯一的，而辣椒对数据库中的所有人都是。辣椒不存储在数据库中；它是一个秘密值。加料意味着在存储密码时添加另一个额外值。\n\
  \n例如，假设辣椒是字母 `R`。如果存储的密码是 `sunshine22`，存储的哈希将是 `sunshine22` 与添加的字母 `R` 的哈希乘积。当用户登录时，他们提供的密码仍然是\
  \ `sunshine22`，但添加的辣椒存储的是带有 `R` 的 `sunshine22`。用户并不知道在使用加料。网站将循环所有可能的辣椒组合，通过考虑大小写字母，将产生\
  \ 50 种新组合。网站将尝试哈希 `sunshine22A`、`sunshine22B` 等，直到达到 `sunshine22R`。如果其中一个哈希与存储的哈希匹配，则允许用户登录。这种做法的意义在于辣椒是不存储的，因此如果黑客想用彩虹表或字典攻击破解密码，破解单个密码所需的时间将增加\
  \ 50 倍以上。\n\n### 钓鱼攻击\n获取某人密码最简单的方法是直接问他们。毕竟，既然你可以礼貌地询问，为什么要费力研究那些算法和破解代码呢？\n\n\n\
  \n\n钓鱼攻击通常承诺只要你点击特定链接即可获得奖品，该链接会将你带入一个伪造的登录页面，你只需输入密码即可。防御这种攻击简单的方法是明智点击，或者不要点击诈骗性的弹出式广告。\n\
  \n假期和 iPod 并不是仅仅通过点击一下就能送出的，而“你不会相信接下来发生了什么”是点击诱饵导致钓鱼攻击的明确迹象。\n\n奇迹减肥药、增大工具、在当地等待与你见面的单身人士以及其他只需点击一下即可享受奢华生活的承诺都是钓鱼。不幸的是，我们必须通过工作来挣钱，通过运动来减肥。\n\
  \n# 1. 使用 Kali Linux 进行黑客攻击\n\nKali Linux 是一个包含许多供安全专家使用的工具的操作系统。该系统中预装了 600 多个工具。在本章中，主要的讨论内容将是针对初学者的\
  \ Kali Linux。许多人可能并不熟悉 Kali Linux；但在本章中，你将学会如何熟练操作 Kali Linux。\n\n## Kali Linux\n\
  \n`BackTrack` 平台主要是为安全专业人员创建的，操作系统中预装了许多工具。由于 Kali Linux 是该平台的后续者，因此该操作系统也拥有许多安全专业人员可以使用工具。这些工具主要供网络管理员和安全审计员等人员使用。在使用这些工具时，可以对网络进行评估并确保其安全性。有不同类型的黑客，他们都可以访问这些工具。\n\
  \n`BackTrack` 对安全专业人员非常有用，但主要问题是架构相当复杂，且预装的工具也不容易使用。工具存在于 `pentest` 目录下，在执行渗透测试时非常有效。此外还存在许多子文件夹，且大多数工具都能被轻松检测到。该平台提供的工具包括\
  \ `sqlninja`——该工具在执行 SQL 注入时非常有用。还有许多其他工具可用，在评估 Web 应用程序中存在的漏洞时，可以使用它们来执行 Web 攻击。\n\
  \nKali Linux 取代了 `BackTrack`，其操作系统的架构基于 `Debian GNU`，并遵循`文件层次结构系统`（`FHS`），与 `BackTrack`\
  \ 平台相比，这具有许多优势。当你使用 Kali Linux 操作系统时，可以轻松地访问可用工具，因为某些应用程序位于系统路径中。\n\nKali Linux\
  \ 提供以下功能：\n\n* 操作系统支持许多桌面环境，如 `XFCE`、`Gnome`、`KDE` 和 `LXDE`。操作系统还提供多语言支持。\n* 操作系统提供的工具符合\
  \ `Debian` 标准，并且每天可以使用 `Debian` 存储库同步至少四次。软件包可以轻松更新，同时确保某些安全补丁也已应用。\n* Kali Linux\
  \ 允许 ISO 定制，这意味着作为用户，你可以创建出适合你需求的不同版本的 Kali Linux。\n* 操作系统同时支持 `ARMEL` 和 `ARMFH`，这意味着用户可以在不同的设备上安装\
  \ Kali Linux 操作系统。\n* 预装工具也具有多种多样的用途。\n* Kali Linux 是开源的，这意味着它是免费的。\n\n在本章中，重点将是作为虚拟机运行的\
  \ Kali Linux 操作系统。作为开始，重点将是针对初学者的 Kali Linux，以确保读者的你可以对该操作系统有一个概览。要将操作系统作为虚拟机，你应该利用\
