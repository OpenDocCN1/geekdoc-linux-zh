- "# 初学者编程指南：本书包含初学者 SQL 计算机编程、Python、Kali Linux、基于 Kali Linux 的黑客攻击。2020 编程语言学习。\n\
  \n\n\n![](img/cover.jpeg)\n\n\n本书包含：\n- 初学者 SQL 计算机编程，\n- Python 语言，\n- KALI LINUX，\n\
  - 使用 KALI LINUX 进行黑客攻击。\n- 2020 年学习编程语言。\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n本书受版权保护。本书仅供个人使用。未经作者或出版者的同意，您不能修改、分发、销售、使用、引用或转述本书的任何部分或书内内容。\n\
  \n阅读本文档即表示读者同意，作者在任何情况下对因使用本文档包含的信息而导致的任何直接或间接损失不承担责任，包括但不限于错误、遗漏或不准确。\n\n\n# 引言\n\
  \n网络程序更大、更灵活。在许多情况下，基础操作方案通常是困难且复杂的。\n\n这就是结构化查询语言 (SQL) 的基础，它通常是一种全球性的数据语言。IBM\
  \ 在 1970 年代发明了 SQL；在当时它被命名为 `SEQUEL`。后来，Oracle 和微软也开始使用 `SEQUEL`。\n\n在国际知名度提高后，`SEQUEL`\
  \ 发生了变化。在 1986 年，美国国家标准协会 (ANSI) 将 `SEQUEL` 标准化为 `SQL`。\n\n直到今天，仍有很多人拒绝称之为 `SQL`；对于这些人来说，`SEQUEL`\
  \ 无疑是更准确的称呼，因为这是一个标准化的数据源语言。\n\n\n\n\n本章列出了你可以在 SQL 中使用的所有各种命令。基础命令位于章节的开头，而更高级的命令将位于章节的后后部分。将列出命令名称，以及如何使用它以及如何通过语法正确使用它。在基础命令之后，将介绍运算符、子句以及关键字。还将展示如何正确使用每个命令的示例。\n\
  \n# 命令\n\n## `CREATE DATABASE`\n\n为了创建你自己的数据库，你需要使用如下所示语法。\n\n```sql\nCREATE DATABASE\
  \ database_name\n```\n\n## `CREATE TABLE`\n\n在创建数据库之后，你可能想要开始创建要输入到数据库中的表。可以使用如下所示的\
  \ `CREATE TABLE` 命令。\n\n```sql\nCREATE TABLE table_name \n(\n  column_name1 data_type,\
  \ \n  column_name2 data_type, \n  column_name3 data_type\n);\n```\n\n这是一个示例：\n\n\
  ```sql\nCREATE TABLE Individuals \n(\n  Id number(20), \n  Last varchar (255), \n\
  \  First varchar (255), \n  Address varchar (255), \n  City varchar (255)\n);\n\
  ```\n\n结果将给你一个 `Individuals` 表，其信息按照姓、名、地址以及所在的城市进行排序。顶部的 `Id` 代表他们的 ID 编号，该编号将作为数字输入。`ID`\
  \ 列能够存储多达 20 位的数字。\n\n## `INSERT`\n\n在你设置好数据库和所有表之后，你可能会发现自己需要向现有表中添加另一行。为了在不建立完全新表的情况下完成此操作，你可以使用\
  \ `INSERT INTO` 命令。语法如下所示。\n\n```sql\nINSERT INTO table_name\nVALUES (value1, value2,\
  \ value3);\n```\n\n接下来的语法将仅针对某一列的值。它无法指定任何列名。如果你想同时指定列名和它们的列值，你可以使用如下所示的语法。\n\n\
  ```sql\nINSERT INTO table_name\n(column_1, column_2, column_3) \nVALUES (value1,\
  \ value2, value3)\n```\n\n如果你想能够向表中插入新的一行，将使用如下所示的类似语法。\n\n```sql\nINSERT INTO table_name\
  \ \nVALUES ('insert various row information here')\n```\n\n示例：(3 个，例如‘row 3’、作为姓的‘Williams’、作为名的‘Travis’)\n\
  \n这将允许你同时向不同行插入多种数量的各种数据。为了能够向特定列插入数据，你可以使用如下所示的语法。\n\n```sql\nINSERT INTO Individuals\
  \ \n(Id, Last, First) \nVALUES (5, 'Thompson', 'Jessica')\n```\n\n这将把信息输入到第 5 行，并在姓列中输入“Thompson”这个名字。然后，接下来的名字“Jessica”将被输入到名列中。\n\
  \n现在由于我们已经彻底涵盖了与 CRUD 中 `CREATE` 类型命令相关的几个基础命令，现在是时候转向该缩写词的下一类型命令了。下一步是查询或读取你已经在数据库中创建并插入的数据。下一个命令将向你展示如何轻松且具体地从数据库中检索信息。\n\
  \n## `SELECT`\n\n为了能够查询和读取数据库中的数据，你希望选择任何你想返回给你的数据。这就是 `SELECT` 命令用用场。该命令可以按照如下所示的语法形成。\n\
  \n```sql\nSELECT columns \nFROM tables \n[JOIN joins] \nWHERE search_condition]\
  \ \n[GROUP BY grouping_columns] \n[HAVING search_condition] \n[ORDER BY sort_columns];\n\
  ```\n\n这是一个更复杂的语法，可以用于非常特定的搜索。语法中提到的运算符、子句和关键字将在介绍基础命令后引入。这是一个你可以在彻底理解了如何使用每个部分后再回来查看的语法。\n\
  \n为了从表中检索单个列，可以使用如下所示的语法。\n\n```sql\nSELECT column \nFROM table;\n```\n\n为了从表中检索多个列，请使用如下所示的语法。\n\
  \n```sql\nSELECT columns \nFROM table;\n```\n\n为了从表中检索所有列，你实际上是在选择整张表，因为你并不希望某一个或几列优于其他列。为了选择一个表，关键字\
  \ `FROM` 将发挥作用。使用如下所示的语法。\n\n```sql\nSELECT * FROM table;\n```\n\n正如我们之前从表中选择多个列一样，同样也适用于如下所示。例如，假设你有一个名为\
  \ `Clients` 的表，你想根据姓和名搜索你的客户。你将使用如下所示的语法。\n\n```sql\nSELECT Last, First \nFROM Clients\n\
  ```\n\n这是另一个你如何使用 `SELECT` 命令调出整张表而不是表中指定列的示例。假设你只想按照数据库中的现状搜索你的客户列表，而不通过姓或名搜索客户。你将使用如下所示的语法。\n\
  \n```sql\nSELECT * FROM Clients\n```\n\n现在我们已经涵盖了创建和读取的命令，接下来的命令是作为 CRUD 命令一部分更新。\n\
  \n## `UPDATE`\n\n现在你已经理解了如何在数据库中创建和读取数据，当你需要更新表中存在的数据时，可以使用 `UPDATE` 命令。可以使用如下所示的语法。\n\
  \n```sql\nUPDATE table_name\nSET column1=value, column2=value, column3=value\n[WHERE\
  \ search_condition];\n```\n\n如果没有正确放置 `WHERE` 子句，所有数据将被更新。下面列出了另一种使用 `WHERE` 子句的示例。\n\
  \n```sql\nUPDATE Clients\nSET First='Jason', \nCity='Rochester' \nWHERE Last='Knight';\n\
  ```\n\n这个示例将通过搜索姓来输入名字和所在的城市。当然，由于你可能有许多姓相同的客户，你可以使用 `WHERE` 子句来确保你的结果是特定的。\n\n\
  ## `DELETE`\n\n现在你不仅理解了如何在数据库中创建和读取数据，现在你也理解了如何更新它。“CRUD”的最后一步是删除。在 SQL 中删除信息的方法比你想象的要多。列出的命令是根据你的需求或偏好删除数据的不同方法。\n\
  \n当你发现自己需要删除表中的行时，可以使用 `DELETE` 命令执行此操作。为了正确使用它，请遵循如下所示的语法。\n\n```sql\nDELETE FROM\
  \ table_name\n[WHERE search_condition];\n```\n\n如果在 `DELETE` 命令上没有正确使用 `WHERE` 子句，所有记录将被删除。当你想要从表中仅删除某一行时，可以使用如下语法示例。\n\
  \n```sql\nDELETE FROM Clients \nWHERE Last='Johnson' AND First='Sarah';\n```\n\n\
  \n\n\n`DROP` 命令可以用于删除表中包含的索引。`DROP` 命令也可以用于删除数据库或表。可以通过创建索引来使表更具定义，从而加速数据库中的搜索。索引对于查看表格的人来说是不可见的，只有那些搜索表格的人才能看到它们。下面显示了在删除索引时正确使用\
  \ `DROP` 命令的语法。根据你所使用的 SQL 平台，语法有四种变体。\n\n## Access\n```\nDROP INDEX index_name\n\
  ```\n\n### MS SQL Server\n```\nDROP INDEX table_name.index_name\n```\n\n### Oracle\n\
  ```\nDROP INDEX index_name\n```\n\n### MySQL\n```\nALTER TABLE table_name DROP INDEX\
  \ index_name\n```\n\n当你想要删除数据库中的表时，可以使用 `DROP TABLE` 命令来实现。正确的语法所示所示。\n\n### 如何使用\
  \ `DROP TABLE` 命令：\n```\nDROP TABLE table_name\n```\n\n当你想要删除整个数据库本身时，可以使用 `DROP\
  \ DATABASE` 命令来实现。正确的语法所示所示。\n\n### 如何使用 `DROP DATABASE` 命令：\n```\nDROP DATABASE\
  \ database_name\n```\n\n# TRUNCATE\n当你想要删除表中已经包含的数据但不删除表本身时，就可以使用 `TRUNCATE` 命令。这对于你想重新开始而不需要完全从表中重新开始的情况非常有用。为了正确使用\
  \ `TRUNCATE` 命令，语法所示所示。\n\n```\nTRUNCATE TABLE table_name\n```\n\n这就完成了“CRUD”所代表的四类命令。接下来的语法将是可以在命令中使用的操作符、子句和关键字。其中一些已经在列出的命令中显示过了。这些额外内容可以为你的命令添加精确的操作，并且非常有用。\n\
  \n#  way 符和子句\n\n### AND\n当你想要查找表中的客户或任何内容时，可以使用 `AND` 操作符使搜索更具针对性。如果你在查找一个客户，可以用它通过他们的名字\
  \ `AND` 姓氏来查找该个人。如果你在数据库中寻找 Garrett Lee，你将使用以下语法来使用 `AND` 操作符。\n\n```\nSELECT *\
  \ FROM Clients\nWHERE First= ‘Garrett’\nAND Last= ‘Lee’\n```\n\n### OR\n该运算符与 `AND`\
  \ 操作符类似。如果你想通过他们的名字 `OR` 姓氏在数据库中找到两种不同类型的客户，可以使用下面所示的语法。\n\n```\nSELECT * FROM Clients\n\
  WHERE First= ‘John’\nOR Last= ‘Thomas’\n```\n这将能够调出数据库中任何名字为 John 或姓氏为 Thomas 的客户。当然，你可以以你想要的方式使用此运算符来获得更精确的结果。\n\
  \n### AND/OR\n此运算符可以用于通过多个条件过滤你的记录。`AND` 和 `OR` 操作符本身就非常有用，但当它们结合在一起以精炼你的搜索时，会变得更加有用。如果数据搜索适用于两个特定条件，`AND`\
  \ 操作符将显示两条记录。如果一条记录符合第一个或第二个条件，`OR` 操作符将显示更具体的的结果。示例语法所示所示。\n\n```\nSELECT * FROM\
  \ Clients\nWHERE Last= ‘Jones’\nAND (First= ‘Carl’ OR First= ‘Mark’)\n```\n通过将这些命令组合在一起，结果将选择（select）具有指定相同姓氏的个人。这将选出姓氏等于“Jones”且名字为“Carl”或“Mark”之一的个人。\n\
  \n### NOT\n在搜索数据库时，可以使用此运算符根据一个条件进行排除。此运算符用作 `SELECT` 命令的子句使用。正确的语法所示所示。\n\n```\n\
  SELECT * First, Last, State\nFROM Clients\nWHERE NOT (State = ‘AK’);\n```\n结果将根据客户的名字、姓氏以及他们居住的州调出客户。它将调出所有居住在阿拉斯加州的客户。当然，你可以在搜索中添加多个而非一个州。\n\
  \n### WHERE\n`WHERE` 子句在之前的命令中显示过，以具体化命令的使用。你放置 `WHERE` 子句的位置非常重要。为了确保你对如何正确使用它有一个了解，下面包含了以正确和错误格式所示的两种语法，以及应该使用的初始语法。\n\
  \n```\nSELECT column_names\nFROM table_name\nWHERE test_column operator value;\n\
  ```\n假设你想从一个城市检索客户：\n```\nSELECT * FROM Clients\nWHERE City= ‘Portland’\n```\n\n\
  #### 如何对文本和数值值使用 WHERE 子句：\n正确：\n```\nSELECT * FROM Clients\n[WHERE First=‘Amanda’]\n\
  ```\n错误：\n```\nSELECT * FROM Clients\n(WHERE First=Amanda)\n```\n正确：\n```\nSELECT\
  \ * FROM Clients\nWHERE Year=1985\n```\n错误：\n```\nSELECT * FROM Clients\nWHERE Year=\
  \ ‘1985’\n```\n\n### GROUP BY\n此运算符可以与其他命令一起使用，对表的一个或多个列的结果进行分组。正确的语法用法所示所示。\n\n\
  ```\nSELECT column_name\nAggregate_function (column_name)\nFROM table_name\nWHERE\
  \ column_name operator value\nGROUP BY column_name\n```\n这将根据日期调出数量的。\n```\nSELECT,,\
  \ (Orders)\n```\n为了调出多个列，你可以使用：\n```\nSELECT Clients, SUM (Orders)\nFROM Products\n\
  GROUP BY Date\n```\n\n# 关键字\n\n### ORDER BY\n与 `GROUP BY` 运算符类似，`ORDER BY` 关键字并没有很大区别。它将根据你输入的特定顺序调出结果。默认情况下，数据将以升序返回...\n\
  \n如果你想对多个列进行排序，以下语法示例所示：\n```\nSELECT column_names\nFROM table_name\nORDER BY\n\
  sort_column1 [ASC | DESC],\nsort_column2 [ASC | DESC],\nsort_column3 [ASC | DESC];\n\
  ```\n按列的位置排序：\n```\nSELECT column_names\nFROM table_name\nORDER BY\nsort_number1\
  \ [ASC | DESC],\nsort_number2 [ASC | DESC],\nsort_number3 [ASC | DESC];\n```\n按降序顺序排序：\n\
  ```\nSELECT * FROM Clients\nORDER BY Last name DESC\n```\n结果将根据姓氏从 Z 到 A 调出你的客户，而不是字母顺序。在数字的情况下，它将从最小到最大调出。\n\
  \n### DISTINCT\n在需要消除任何重复行时，可以使用 `DISTINCT` 关键字来实现。你可以在所示所示语法中使用此关键字。\n\n```\nSELECT\
  \ DISTINCT column_names\nFROM table_name\n```\n你也可以将 `SELECT` 命令与 `DISTINCT` 关键字结合。如果你想找到来自特定城市的客户，可以使用下面所示的语法示例。\n\
  \n```\nSELECT DISTINCT New York City\nFrom Clients\n```\n这将调出数据库中所有居住在纽约的客户。\n\n\
  # 2. SQL 函数\n\n### SQL count 函数\n`COUNT()` 函数用于返回符合给定条件的行数。\n\n其语法如下：\n\n\n\n\n\
  在此语句中，表达式可以指代算术运算或列名。如果你想计算表中存储的总记录数，也可以指定 `*`。\n\n本节中的示例将使用 `SALES_REP` 表中的数据：\n\
  \n要执行简单的计数操作（例如，计算 `SALES_REP` 表中有多少行），你将输入：\n\n```sql\nSELECT COUNT(EMP_NAME)\n\
  FROM SALES_REP;\n```\n\n结果如下：\n\n你也可以使用 `*` 代替指定列名：\n\n```sql\nSELECT COUNT(EMP_NAME)\n\
  FROM SALES_REP;\n```\n\n此语句将产生相同的结果，因为 `EMP_NAME` 字段没有 `NULL` 值。但是，假设 `EMP_NAME`\
  \ 字段中的某一个字段包含 `NULL` 值，那么在指定 `EMP_NAME` 的语句中将不会包含它，但如果你使用 `*` 符号作为参数，它将包含在 `COUNT()`\
  \ 的结果中。\n\n你还可以结合 `GROUP BY` 子句使用 `COUNT` 函数。例如，如果你想计算每个分支的记录数，可以输入此语句：\n\n```sql\n\
  SELECT BRANCH, COUNT(*) FROM SALES_REP\nGROUP BY BRANCH;\n```\n\n输出将是：\n\n`COUNT()`\
  \ 函数可以配合 `DISTINCT` 使用来查找不同条目的数量。例如，如果你想知道 `SALES_REP` 表中有多少个不同的分支，你将输入此语句：\n\n\
  ```sql\nSELECT COUNT (DISTINCT BRANCH)\nFROM SALES_REP;\n```\n\n它将产生此结果：\n\n## SQL\
  \ AVG 函数\n\n`AVG()` 函数计算数值数据类型列的平均值。其语法如下：\n\n在上述语句中，表达式可以指代算术运算或列名。算术运算可以包含单列或多列。\n\
  \n本节中的示例将使用带有以下数据的 `SALES_REP` 表：\n\n在第一个示例中，你使用 `AVG()` 函数计算平均销售额。你可以输入此语句：\n\n\
  ```sql\nSELECT AVG(Sales) FROM Sales_Rep;\n```\n\n结果如下：\n\n数字 `6245.500000` 是 `Sales_Rep`\
  \ 表中所有销售数据的平均值，它是通过相加 `Sales` 字段并将结果除以记录数（在本例中为 `10` 行）计算得出的。\n\n`AVG()` 函数可以用于算术运算。例如，假设销售税为销售额的\
  \ 6.6%，你可以使用此语句来计算平均销售税：\n\n```sql\nSELECT AVG(Sales*.066) FROM Sales_Rep;\n```\n\
  \n结果如下：\n\n为了得到结果，SQL 必须在应用 `AVG` 函数之前先计算算术运算 `Sales *.066` 的结果。\n\n你可以将 `AVG()`\
  \ 函数与 `GROUP BY` 子句结合，以获取指定分组的平均值。例如，假设你想计算每个分支的平均销售额，你可以可以输入此语句：\n\n```sql\nSELECT\
  \ Branch, AVG(Sales) FROM Sales_Rep\nGROUP BY Branch;\n```\n\n结果如下：\n\n## SQL ROUND\
  \ 函数\n\n`ROUND()` 函数用于将数字舍入到指定的小位数或精度。这是 SQL `ROUND()` 函数的语法：\n\n```sql\nROUND (expression,\
  \ [decimal place])\n```\n\n在上述语句中，`decimal place` 指定了返回的小数位数。如果你指定一个负数，它将舍入小数点左侧的数字。例如，指定\
  \ `-1` 将把数字舍入到最近的十位。\n\n本节的示例将使用带有以下数据的 `Student_Grade` 表：\n\n| ID | Name | Grade\
  \ |\n| :--- | :--- | :--- |\n| 1 | Jack Knight | 87.6498 |\n| 2 | Daisy Poult |\
  \ 98.4359 |\n| 3 | James McDuff | 97.7853 |\n| 4 | Alicia Stone | 89.9753 |\n\n\
  假设你想将成绩舍入到最近的十分位，你可以输入此语句：\n\n```sql\nSELECT Name, ROUND (Grade, 1) Rounded_Grade\
  \ FROM Student_Grade;\n```\n\n这将是结果结果：\n\n假设你想将成绩舍入到最近的十位，你将为 `ROUND()` 函数使用一个负参数：\n\
  \n```sql\nSELECT Name, ROUND (Grade, -1) Rounded_Grade FROM Student_Grade;\n```\n\
  \n结果如下：\n\n## SQL SUM 函数\n\n`SUM()` 函数用于返回表达式的总和。以下是 `SUM()` 函数的语法：\n\n`expression`\
  \ 参数可以指代算术运算或列名。算术运算可能包含一列或多列。\n\n同样，除了 `SUM()` 函数中指定的列外，`SELECT` 语句中还可以有多个列。这些列也应该形成\
  \ `GROUP BY` 子句的一部分。\n\n在本节的示例，你将使用带有以下数据的 `SALES_REP` 表：\n\n要计算 `Sales_Rep` 表中所有销售的总额，你将输入此语句：\n\
  \n```sql\nSELECT SUM(Sales) FROM Sales_Rep;\n```\n\n这将是结果：\n\n数字 `62455.00` 代表 `Sales`\
  \ 列中所有条目的总和。\n\n为了说明如何在 `SUM()` 函数中使用算术运算作为参数，假设你需要对销售额征收 6.6% 的销售税。以下是获取总销售税的语句：\n\
  \n```sql\nSELECT SUM(Sales*.066) FROM Sales_Rep;\n```\n\n你将得到结果：\n\n在此示例中，你将结合 `SUM()`\
  \ 函数和 `GROUP BY` 子句来计算每个分支的销售总额。你可以使用此语句：\n\n```sql\nSELECT Branch, SUM(Sales) FROM\
  \ Sales_Rep\nGROUP BY Branch;\n```\n\n结果如下：\n\n## SQL MAX 函数\n\n`MAX()` 函数用于获取给定表达式中的最大值。其语法如下：\n\
  \n```sql\nSELECT MAX (expression)\nFROM table_name;\n```\n\n`expression` 参数可以指代算术运算或列名。算术运算可以包含单列或多列。`SELECT`\
  \ 语句除了 `MAX()` 函数中指定的列外，还可以有多个列。\n\n## SQL MIN 函数\n\n`MIN()` 函数用于获取给定表达式中的最小值。其语法如下：\n\
  \n```sql\nSELECT MIN (expression)\nFROM table_name;\n```\n\n\n\n\nDML（数据操作语言）是 SQL\
  \ 的一个部分，帮助你对数据库进行执行更改。通过 DML，你可以向表中填充新信息、更新旧表，并从任何表中删除不必要的数据。\n\n## 如何向表中填充新信息\n\
  \n你可以通过两种方式完成此过程：(1) 手动输入新数据，或 (2) 使用计算机程序自动输入数据。手动数据填充是指使用键盘输入新数据。另一方面，自动数据填充是指从外部源（例如，另一个数据库）加载数据并将其传输到首选数据库中。\n\
  \n在输入新数据时，不同的因素可能会影响你所处理的数据类型和数量。以下是你必须考虑的要因素：当前约束、表的物理大小以及列的长度。\n\n**重要说明**：你可以运行\
  \ SQL 语句而不必担心字母的大小写问题。然而，数据本身是极其区分大小的。例如，如果你使用大写字母将数据输入数据库，那么在引用该数据时也应该使用大写字母。下面提供的示例使用了大写和小写字母，仅是为了证明这一因素不会影响结果。\n\
  \n## 如何插入数据\n\n你应该使用 `INSERT` 命令向现有表中插入数据。该命令有几个选项；请检查下面的语法：\n\n```sql\nINSERT INTO\
  \ table_name (column1, column2, ...) VALUES (value1, value2, ...);\n```\n\n使用此语法，你应该在名为\
  \ `VALUES` 的列表中指定每个列。如你所见，列表中的值用逗号隔开。你应该引号来包围你想插入的值，特别是当你处理日期/时间和字符数据类型时。对于 `NULL`\
  \ 值或数值数据，你不需要使用引号。表中的每一列都应该包含一个值。\n\n在下面的示例中，你将向一个名为 `PRODUCTS_TBL` 的表插入一条记录。\n\n\
  表的当前结构：\n\n使用此 `INSERT` 语句：\n\n```sql\nINSERT INTO PRODUCTS_TBL (product_id, product_name,\
  \ price) VALUES (1, 'Laptop', 1200);\n```\n\n在这个示例中，你向一个具有三列的表插入了三个值。你插入的值遵循表中列的排列顺序。其中两个值被引号括起来，因为它们所在的列是字符类型。最后一个值（即\
  \ `cost`）是一个数字数据类型：引号是可选的。\n\n## 如何向特定列插入数据\n\n你可能向某些列插入数据。例如，假设你需要插入员工的值，但除了他的传呼机号码。在这种情况下，在运行\
  \ `INSERT` 语句时，你应该确定一个 `VALUES` 列表和一个列列表。以下是你可能使用的值的屏幕截图：\n\n在向特定列插入值时，你应该使用的语法如下：\n\
  \n```sql\nINSERT INTO table_name (column1, column2, ...) VALUES (value1, value2,\
  \ ...);\n```\n\n在下面的示例中，你将向名为 `ORDERS_TBL` 的表中的特定列插入值。这是该表的当前结构：\n\n假设你使用了此 `INSERT`\
  \ 语句：\n\n```sql\nINSERT INTO ORDERS_TBL (order_id, customer_name, order_date) VALUES\
  \ (101, 'John Doe', '2023-10-01');\n```\n\n在这个 `INSERT` 语句中，你通过在括号中包含列名来指定一个列列表。此外，列列表必须在表名之后输入。你已经指定了你需要的列。基本上，你排除了名为\
  \ `ORD_DATE` 的列。\n\n如果你检查表定义，你会发现 `ORD_DATE` 是一个独立列：它不需要表中的任何数据。该列不需要信息，因为你没有在表的定义中指定\
  \ `NOT NULL`。`NOT NULL` 表示该列接受 `NULL` 值。此外，值的数组应该遵循列的排列顺序。\n\n## 如何从不同的表插入数据\n\n\
  你可以通过结合两个 SQL 语句来实现：`INSERT` 和 `SELECT`。以下是你应该遵循的语法：\n\n```sql\nINSERT INTO table1\
  \ (column1, column2, ...) SELECT column1, column2, ... FROM table2 WHERE condition;\n\
  ```\n\n此语法有新的关键字：`FROM`、`WHERE` 和 `SELECT`。让我们逐一讨论它们。`FROM` 是数据库查询的一部分，确定所需数据的位置。这部分应该包含表名。`WHERE`\
  \ 是数据库查询的另一个部分，应用条件来改进搜索结果。这是一个示例条件：`WHERE PRODUCT = ‘CAR’`。最后，`SELECT` 是用于开始 SQL\
  \ 查询的主语句。\n\n**重要说明**：“应用条件”意味着对受 SQL 命令影响的信息添加筛选标准。\n\n## 如何插入 NULL 值\n\n向现有表插入\
  \ `NULL` 值是简单而的。你为什么要在你的表或数据库中添加这种值呢？嗯，如果你不知道应该放在那里的具体值，你就需要向列中插入 `NULL` 值。例如，并不是每个人都拥有手机，所以插入错误的手机号码是不准确的。你可以使用单词\
  \ `NULL` 向你指定的列中插入空值。以下是其语法：\n\n```sql\nINSERT INTO table_name (column1, column2,\
  \ ...) VALUES (value1, NULL, ...);\n```\n\n## 如何更新数据\n\n你可以使用 `UPDATE` 语句来修改数据。此\
  \ SQL 语句不会添加或删除记录——它只是更新你正在处理的表内部的数据。通常情况下，`UPDATE` 用于逐个修改表。根据你的需要，你可以更新单行或多行。\n\
  \n### 如何更新列\n\n这也许是使用 `UPDATE` 命令最简单的方法。如果你要更新一列，你可以更新单行，也可以更新多行。以下是该过程的语法：\n\n\
  ```sql\nUPDATE table_name SET column1 = value1 WHERE condition;\n```\n\n### 如何更新多个列\n\
  \n如前所述，你可以使用 `UPDATE` 语句更新许多列。检查此语法：\n\n```sql\nUPDATE table_name SET column1 =\
  \ value1, column2 = value2, ... WHERE condition;\n```\n\n此语法包含一个 `SET` 和三个列：列之间用逗号隔开。通常情况下，你应该使用逗号来分隔不同类型的参数。\n\
  \n在这个示例中，逗号分隔了必须更新的列。\n\n## 如何删除数据\n\n你可以使用 `DELETE` 语句从表中删除数据行。此语句将删除整条记录（甚至是列）。因此，如果你只想从几列中删除某些值，就不应该使用它。在使用\
  \ `DELETE` 时必须非常小心——它是一个高效的命令。在本节中，你将学习删除数据的不同技术。\n\n要删除一条或多条记录，你应该遵循以下语法：\n\n```sql\n\
  DELETE FROM table_name WHERE condition;\n```\n\n此语法使用 `WHERE` 作为子句。该子句是 `DELETE`\
  \ 命令的一个方面，特别是当你试图消除特定的数据行时。实际上，你大多数时候会在 `DELETE` 使用 `WHERE`。如果没有 `WHERE` 子句，你会得到类似的结果：\n\
  \n```sql\nDELETE FROM table_name;\n```\n\n**重要说明**：如果你省略了 `WHERE`，表中的所有数据将被删除。\n\
  \n## 如何管理数据库事务\n\n简单来说，事务是对数据库的操作单元或工作集合。你可以手动（即通过输入）或自动（即使用数据库程序）完成数据库事务。对于使用 SQL\
  \ 的关系型数据库，你可以使用 DML 语句完成事务。DML 语句在上一章中讨论过。\n\n数据库事务可以是 DML 命令，也可以一组命令。在执行事务时，所有事务都必须成功。如果至少有一个事务失败，其余事务也将失败。\n\
  \n以下是数据库事务的特征：\n\n*   每个事务都有一个起点和一个终点。\n*   每个事务都可以撤销或保存。\n*   如果事务未能完成，则任何事务都无法保存。\n\
  \n\n\n\n这是一种控制数据库管理系统内部可能发生的不同事务的能力。每当你谈到事务时，指的都是 DML 命令（即 `UPDATE`、`DELETE` 和 `INSERT`）。\n\
  \n一旦事务成功完成，你将不会在受影响的数据表中立即看到更改。有时，你必须使用事务控制语句来最终提交你的数据库事务。这些控制语句可以帮助你保存或撤销你所所的更改。\n\
  \n以下是你可以使用的控制语句：\n\n*   `ROLLBACK`\n*   `COMMIT`\n*   `SAVEPOINT`\n\n当数据库事务完成时，关于它的信息将保留在数据库内部的指定区域或短期的回滚区域（rollback\
  \ area）中。这些区域将持有事务信息，直到执行控制语句为止。如前所述，控制语句可能会保存或丢弃事务。一旦事务被保存或丢弃，回滚区域将被清空。\n\n下图显示了如何在数据库上执行更改：\n\
  \n## ROLLBACK 语句\n\n你必须使用此语句来撤销未保存的更改。`ROLLBACK` 只能应用于上一次 `ROLLBACK` 或 `COMMIT`\
  \ 语句之后生成的事务。以下是 `ROLLBACK` 语句的语法：\n\n```\nROLLBACK [WORK];\n```\n\n在这里，`WORK` 是完全可选的。\n\
  \n**重要说明：** 目前 MySQL 不支持此语句。\n\n## COMMIT 语句\n\n你将使用此语句来保存由事务引起的更改。此语句最终提交在上一次 `ROLLBACK`\
  \ 或 `COMMIT` 语句之后完成的所有事务。\n\n使用此命令时，你必须遵循以下语法：\n\n```\nCOMMIT [WORK];\n```\n\n此语法有一个强制性部分：`COMMIT`。该部分后面跟着用于结束命令的字符或语句。关键字\
  \ `WORK` 是可选的：使用它可以提高该命令的用户友好性。\n\n## SAVEPOINT 语句\n\n这是事务的一部分，你可以在其中撤销某些更改而不影响整个事务。以下是\
  \ `SAVEPOINT` 的语法：\n\n```\nSAVEPOINT savepoint_name;\n```\n\n你只能在事务事务命令中创建 `SAVEPOINT`\
  \ 时才能使用此语句。如果你想撤销更改，必须使用 `ROLLBACK`。`SAVEPOINT` 允许你通过将事务分成若干小组来管理数据库事务。\n\n### 回到保存点\n\
  \n如果你想回滚到特定的 `SAVEPOINT`，请使用以下语法：\n\n```\nROLLBACK TO savepoint_name;\n```\n\n###\
  \ 保存点\n\n你可以使用 `RELEASE SAVEPOINT` 来移除你创建的保存点。通过这种方式移除保存点后，你将无法在该点回滚数据库更改时它。你可以使用\
  \ `RELEASE SAVEPOINT` 语句来防止数据库修改的意外撤销。以下是你应该遵循的语法：\n\n```\nRELEASE SAVEPOINT savepoint_name;\n\
  ```\n\n## 如何从数据库查询中获得卓越结果\n\n本章将重点介绍数据库查询。在这里，你将学习如何对查询结果使用 `SELECT` 命令。通常情况下，一旦你的数据库建立，你将多次使用\
  \ `SELECT`。此命令可以帮助你搜索和查看存储在数据库中的信息。\n\n### 查询\n\n查询是对数据库的提问。这些提问通过 `SELECT` 命令提交。你必须使用查询来从数据库中获取数据。例如，如果你有一个产品表，你可能执行一条\
  \ SQL 命令来识别你的最畅销产品。这种对可用产品信息的请求在现代关系型数据库中是常有的。\n\n### Select 命令\n\n此命令代表了 SQL 的\
  \ DQL（即数据查询语言）方面。你可以使用 `SELECT` 命令启动并执行数据库查询。通常情况下，此语句不能独立存在：你必须使用额外的子句来使查询成为可能。强制子句外，还存在可选子句来帮助用户提高数据库查询的有效性。\n\
  \n使用 `SELECT` 命令时，有四个子句（也称为关键字）是你必须考虑的。这些语句是：\n\n1.  `SELECT` – 此命令与 `FROM` 结合使用，以可读的、组织的格式获取数据。你可以用它来确定你需要获取的数据。以下是基础\
  \ `SELECT` 命令的语法：\n\n    ```\n    SELECT column1, column2... FROM table;\n    ```\n\
  \n    `SELECT` 子句引入了你希望在搜索结果中看到的列列表。另一方面，`FROM` 引入了你想要从中选择数据的表。你应该使用星号 `*` 来表示查询结果中将显示每一列。`ALL`\
  \ 允许你查看任何列的所有值，即使是冗余数据。`DISTINCT` 是一个你可以使用的选项，用于隐藏重复信息。如你所见，逗号用于分隔 `FROM` 和 `SELECT`\
  \ 的列。\n\n2.  `FROM` – 你应该结合 `SELECT` 使用此子句。它是任何数据库查询的强制元素。该子句的目的是指定搜索期间必须访问的表。运行查询时，你应该在\
  \ `FROM` 子句中指定至少一个表。\n\n    该子句的语法是：\n\n    ```\n    FROM table_name;\n    ```\n\
  \n3.  `WHERE` – 此子句可以有多个条件（即查询中显示由数据库用户选择的选择性数据的元素）。如果你正在使用此功能，你应该使用 `OR` 和 `AND`\
  \ 运算符连接这些条件。这是 `WHERE` 的语法：\n\n    ```\n    WHERE condition1 AND condition2...\n\
  \    ```\n\n4.  `ORDER BY` – 你可以使用此子句来安排数据库查询的输出。此子句按升序排列数据库查询输出（默认情况下）。其语法为：\n\n\
  \    ```\n    ORDER BY column_name [ASC|DESC];\n    ```\n\n### 大写敏感性\n\n当你处理数据时，你应该完全理解大写敏感性。通常，SQL\
  \ 语句和语句对大小写不敏感。\n\n然而，当你使用某些操作符时，大写敏感性变得至关重要。例如，数据以这种方式存储：\n\n*   `JOHN`\n*   `John`\n\
  *   `John`\n\n如果你对 `JOHN` 执行查询，将得到输出。\n\n## 使用数据库运算符对信息进行分类\n\n### 操作符 – 基础\n\n\
  运算符是主要用于 `WHERE` 子句的保留字或字符。正如其名称所示，运算符用于执行操作（例如比较和数学运算）。运算符可以指定 SQL 语句的参数。最后，它们可以连接同一个语句中的多个参数。\n\
  \n本章将使用以下运算符：\n\n*   逻辑运算符\n*   比较运算符\n*   算术运算符\n*   用于否定条件的运算符\n\n让我们详细讨论每个运算符类型：\n\
  \n### 逻辑运算符\n\n这些运算符使用关键字进行比较。在本节中，你将学习以下逻辑运算符：\n\n*   `IN`\n*   `LIKE`\n*   `UNIQUE`\n\
  *   `EXISTS`\n*   `BETWEEN`\n*   `IS NULL`\n*   `ANY` 和 `ALL`\n\n#### `IN`\n\n使用此运算符，你将与一组指定的字面值进行比较。只有当指定的值中至少有一个与测试值相等时，你才会获得\
  \ TRUE。这里是一个示例：\n\n```\nWHERE column_name IN (value1, value2);\n```\n\n#### `LIKE`\n\
  \n在这里，你将使用通配操作符与相似的值进行比较。你可以将 `LIKE` 与以下通配操作符结合：\n\n*   `_`（即下划线）\n*   `%`（即百分分号）\n\
  \n你应该使用下划线来表示一个字符或数字。另一方面，你必须使用 `%%` 来表示一个、零或多个字符。你可以在 SQL 语句中组合这些通配操作符。这里是一些示例：\n\
  \n```\nWHERE PRICE LIKE '100%'\n```\n此语句将找到以 100 开头的值。\n\n```\nWHERE PRICE LIKE\
  \ '%100%'\n```\n此 SQL 语句将搜索包含 200 的值。\n\n\n\n\n\n`WHERE PRICE LIKE ‘_11%’` – 该语句将搜索第二和第三位数字为“11”的值。\n\
  \n`WHERE PRICE LIKE ‘1_%_%_%’` – 该语句将找到以 1 开头且长度至少为四个字符的值。\n\n`WHERE PRICE LIKE\
  \ ‘%1’` – 这将搜索最后一个字符为 1 的值。\n\n### UNIQUE\n使用此操作符，你可以检查一个或多行数据唯一唯一性。请检查这个简单的示例：\n\
  \n### EXISTS\n你可以使用此操作符查找符合你所选标准的数据行。这里有一个示例：\n\n### BETWEEN\n你可以使用 `BETWEEN` 来查找特定范围内的值。在这里，你将指定最大值和最小值。你必须在条件集中包含最大值和最小值。请检查此示例：\n\
  \n### IS NULL\n你可以使用 `IS NULL` 将你选择的值与 `NULL` 值进行比较。例如，你可以通过检查 `PRODUCTS_TBL` 表中\
  \ `WHEEL` 列的 `NULL` 值，来识别出没有轮子的产品。\n\n在下例示例中，你不会得到 `NULL` 值：\n\n### ANY and ALL\n\
  `ANY` 是一个操作符，可以将一个值与列表中的任何合法值进行比较。值列表应该具有预设的条件。这里有一个示例：\n\n然而，`ALL` 将你选定的值与另一个值集中包含的值进行比较。请检查此示例：\n\
  \n### 比较操作符\n这些操作符可以测试 SQL 语句中的单个值。该类别由 `<`, `>`, `<>`, ` 和 `=` 组成。你可以使用这些操作符来测试：\n\
  * 不相等\n* 等于\n* 大于值\n* 小于值\n\n#### 不相等\n作为 SQL 用户，你应该使用 `<>` 来测试不相等。如果数据不相等，则操作返回\
  \ `TRUE`；如果数据相等，则返回 `FALSE`。\n\n**重要提示**：你也可以使用 `!=` 操作符。实际上，许多 SQL 实现都使用此操作符来测试不相等性。请检查你正在使用的实现以获取更多关于此主题的信息。\n\
  \n#### 等于\n你可以使用此操作符测试你 SQL 语句中的单个值。显然，`=`（即等号）代表相等。在检查相等性时，只有当所选值完全相同时，你才会获得数据。如果值相等，你将得到结果\
  \ `TRUE`。如果值不相等，你将得到 `FALSE`。\n\n#### 大于、小于\n通常，`<` 和 `>` 可以作为独立的操作符使用。然而，如果你将它们与其他操作符结合，就可以提高操作的有效性。\n\
  \n#### 比较操作符 – 简单组合\n你可以将 `=` 与 `<` 和 `>` 结合。请查看下例：\n\n使用 `<= 20,000`（即小于等于 20,000），你将得到\
  \ 20,000 及其之下的所有值。如果数据库对象在该范围内，你将从操作中得到 `TRUE`。另一方面，如果对象的值为 20,001 或更高，你将得到 `FALSE`。\n\
  \n第二个示例遵循相同的原理。唯一的区别是，对于值为 20,000 及以上的对象体，你将得到 `TRUE`。对于值为 19,999 及以下的对象体，你将得到 `FALSE`。\n\
  \n### 算术操作符\n这些操作符可以帮助你在 SQL 语言中执行数学运算。在本节中，你将学习关系型数据库中常用的典型操作符：`+`, `-`, `*` 和\
  \ `/`。\n\n#### 加法\n你可以使用 `+`（即加号）执行加法。学习以下 SQL 语句：\n\n```sql\nSELECT MATERIALS +\
  \ OVERHEAD FROM PRODUCTION_COST_TBL\n```\n在这一 SQL 语句中，你将 `MATERIALS` 列和 `OVERHEAD`\
  \ 列中的值相加。\n\n```sql\nSELECT MATERIALS FROM PRODUCTION_COST_TBL WHERE MATERIALS +\
  \ OVERHEAD < ‘500’\n```\n此操作将返回 `MATERIALS` 和 `OVERHEAD` 之和小于 500 的值。\n\n#### 减法\n\
  你可以使用 `-`（即减号）执行减法。为了帮助你理解这个过程，下面提供了两个示例：\n\n```sql\nSELECT SALES – COST FROM COMPANY_FINANCIALS_TBL\n\
  ```\n对于这条 SQL 语句，`COST` 列的值将从 `SALES` 列中减去。\n\n```sql\nSELECT SALES FROM COMPANY_FINANCIALS_TBL\
  \ WHERE SALES – COST < ‘100000’\n```\n该语句将提供 `SALES` 减去 `COST` 小于 ‘100,000’ 的值。\n\
  \n#### 乘法\n你应该使用 `*`（即星号）执行乘法。请查看下例：\n\n```sql\nSELECT SALES * 10 FROM COMPANY_FINANCIALS_TBL\n\
  ```\n`SALES` 列中的值将被乘以十。\n\n```sql\nSELECT SALES FROM COMPANY_FINANCIALS_TBL WHERE\
  \ SALES * 10 < ‘100000’\n```\n该语句将返回 `(SALES * 10)` 积小于 100,000 的值。\n\n#### 除法\n\
  执行除法时，必须使用 `/`（即斜杠符号）。这里有两个示例：\n\n```sql\nSELECT SALES / 5 FROM COMPANY_FINANCIALS_TBL\n\
  ```\n`SALES` 列除以 5。\n\n```sql\nSELECT SALES FROM COMPANY_FINANCIALS_TBL WHERE SALES\
  \ / 5 < ‘100000’\n```\n此 SQL 语句将返回 `SALES / 5` 小于 100,000 的行。\n\n### 算术操作符的组合\n\
  你可以组合算术操作符来简化你的数据库处理。请注意优先级会影响顺序。\n\n### 用于否定条件的操作符\n在本节中，你将学习如何否定逻辑操作符。如果你想更改条件，否定逻辑操作符是必要的。\n\
  \n#### 不等于\n之前，你学习了如何使用 `<` 和 `>` 测试不相等。在这里提到不相等很重要，因为如果你正在检查它，你已经取消了 `=` 操作符。这里是你可以使用的另一种技术：\n\
  \n```sql\nWHERE PRICE <> ‘10000’\n```\n价格不等于 1000\n\n```sql\nWHERE !=10000’\n```\n\
  不等于 10000\n\n在第二个语句中，`!` 否定了相等比较。某些 SQL 实现允许用户将 `!` 与典型的不等操作符结合。\n\n#### 不在之间\n\
  你可以使用 `NOT BETWEEN` 操作符否定 `BETWEEN`。这里有一个示例：\n\n```sql\nWHERE PRICE NOT BETWEEN\
  \ ‘5000’ AND ‘10000’\n```\n`PRICE` 的值不在 5000 到 10000 的范围内。\n\n#### 不包含\n你可以使用 `NOT\
  \ IN` 来否定 `IN` 操作符。在下例中，将返回未包含在列表中的所有价格。\n\n```sql\nWHERE PRICE NOT IN (‘200’, ‘300’,\
  \ ‘400’)\n```\n只有当 `PRICE` 不等于列表中的任何值时，才会采取操作。\n\n#### 不像\n`NOT LIKE` 否定通配符操作符 `LIKE`。如果你使用\
  \ `NOT LIKE`，你只会得到与指定的值不同的值。这里是一些示例：\n\n```sql\nWHERE PRICE NOT LIKE ‘100%’\n```\n\
  该 SQL 语句将查找除“100”以外的任何数字开头的值。\n\n```sql\nWHERE PRICE NOT LIKE ‘%100%’\n```\n该语句将获取不包含“200”的值。\n\
  \n\n\n\n\n`WHERE PRICE NOT LIKE ‘_11%’` – 此 SQL 语句将返回第二和第三位不包含“11”的值。\n\n`WHERE\
  \ PRICE NOT LIKE ‘1_%_%’` – 此语句将不会找到以 1 开头且长度为三个字符的值。\n\n### IS NOT NULL\n\n你可以使用\
  \ `IS NOT NULL` 运算符来否定 `IS NULL`。此操作通常用于检查不为 `NULL` 的数据。这里有一个示例：\n\n`WHERE PRICE\
  \ IS NOT NULL` – 此操作将返回非空的价格值。\n\n### NOT EXISTS\n\n此运算符可以帮助你否定 `EXIST`。请研究下方的示例：\n\
  \n在这个示例中，输出部分显示了最大成本。这是因为所有现有记录的成本都小于 100。\n\n### NOT UNIQUE\n\n使用此运算符来否定 `UNIQUE`。\n\
  \n`WHERE NOT UNIQUE PRICE (SELECT FROM PRODUCT_TBL)` – 此语句用于检查 `PRODUCT_TBL` 表中是否存在“非唯一（non-UNIQUE）的价格。\n\
  \n### 连接运算符 (Conjunctive Operators)\n\n有时，你必须使用多个准则。当你从数据库查询中得到混淆的结果时，通常会遇到这种情况。你可以在\
  \ SQL 语句中使用连接运算符来组合不同的准则。这些运算符是：\n\n- `OR`\n- `AND`\n\n### OR\n\n你可以使用此运算符在 SQL\
  \ 语句的 `WHERE` 子句中组合条件。在 SQL 语句执行任何操作之前，准则应当为真（TRUE）或由 `OR` 分隔。\n\n这里有一个示例：\n\n`WHERE\
  \ PRICE = ‘100’ OR PRICE = ‘300’` – 此语句将找到 `PRICE` 列中匹配 200 或 300 的值。\n\n### AND\n\
  \n此运算符允许你在 SQL 语句的 `WHERE` 部分包含多个准则。只有当由 `AND` 分隔的准则全部为真（TRUE）时，你的 SQL 语句才会执行。分析下方的示例：\n\
  \n`WHERE PRODUCT_ID = ‘ABC’ AND PRICE = ‘200’` – 此语句将查找 `PRODUCT_ID` 值为 ABC 且 `PRICE`\
  \ 值为 200 的数据对象。\n\n重要提示：请记住，你始终可以在 SQL 语句中组合多个运算符和条件。你还可以通过括号来提高语句的可读性。\n\n# 4.\
  \ 数据库管理\n\n一旦你运行了带有表和查询的数据库，就要由你保持生产数据库的顺利运行。数据库需要定期进行检查，以确保其继续按照最初的预期运行。如果数据库维护不当，很容易导致连接的网站性能不佳，或者导致停机甚至数据丢失。通常会指定一个名为数据库管理员（DBA）的人员来负责数据库。然而，通常是那些不是\
  \ DBA 的人需要方面的帮助。\n\n在执行维护时，你可以执行许多不同的任务，包括以下：\n\n- **数据库完整性 (Database Integrity)**：当你检查数据库的完整性时，你正在对数据进行检查，以确保数据库的物理和逻辑结构一致且准确的。\n\
  - **索引重组 (Index Reorganization)**：一旦你开始在数据库中插入和删除数据，索引就会出现碎片（或分散）。重组索引将所有内容重新聚集并提高速度。\n\
  - **重建索引 (Rebuild Index)**：你不需要执行索引重组；你可以删除索引然后重新创建它。\n- **数据库备份 (Database Backup)**：最重要的任务之一。你有多种不同的方法可以备份数据库。这些包括：全备（full\
  \ - 完整备份数据库）、差异备（differential - 自上次全备以来备份数据库）和事务日志备（transaction log - 仅备份事务日志）。\n\
  - **检查数据库统计信息 (Check Database Statistics)**：你可以检查用于查询的数据库统计信息。如果你更新了可能会过时的统计信息，可以帮助正在运行的查询。\n\
  - **数据和日志文件 (Data and Log File)**：通常，确保数据文件和日志文件分开存放。当数据库被使用时，这些文件会增长，最好今后为它们分配适当的大小（而不是仅仅允许它们自动增长）。\n\
  \n取决于你的数据库，某些任务可能比其他任务更有用。除了数据库备份（如果是在生产环境中，这可能是强制性的）之外，你可以根据数据库的状态选择其他任务。例如，如果数据库碎片低于\
  \ 30%，则你可以选择执行索引重组。然而，如果数据库碎片大于 30%，则你应该重建索引。你可以每周或更频繁（如果可能）重建索引。\n\n你可以根据数据库需求，通过\
  \ SQL Server 的服务器 代理（Server Agent）运行维护计划。设置合适的时间非常重要，不要在应用程序预计繁忙的时期设置。你可以选择一个时间，也可以在服务器\
  \ CPU 不空闲时运行。对于较大的数据库，选择在服务器空闲时运行是比选择特定时间更优的选择，因为可能无法保证 CPU 何时会空闲。然而，通常只有当你的应用程序很大且有大量请求时，这才是需要的问题。\n\
  \n当你重建索引时，确保结果排序在 `tempdb` 中是非常重要的。使用 `tempdb` 时，在添加新索引之前，旧索引会被保留。通常情况下，重建索引使用分配给数据库的固定空间。因此，如果你耗尽了磁盘空间，将无法完成索引重建。可以使用\
  \ `tempdb` 而无需增加数据库的磁盘大小。数据库维护可以同步运行，也可以异步运行。\n\n## 在 SQL Server 中设置维护计划\n\n要在 SQL\
  \ Server 中设置维护计划，你必须首先让服务器显示高级选项。这是通过在 SQL Server 中执行以下代码实现的：\n\n```\nsp_configure\
  \ 'show advanced options', 1\nGO\nRECONFIGURE\nsp_configure 'AgentPs', 1\nGO\nRECONFIGURE\n\
  ```\n\nSQL Server 现在将显示高级选项。点击左侧管理（Management）旁边的 + 号。现在，左点击维护计划（Maintenance Plans），然后右键点击维护计划。选择新建维护计划向导。\n\
  \n输入适当的维护计划名称和描述。从这里，你可以在一个计划中运行一个或所有任务，并拥有多个计划。在分配名称后，选择单一计划（Single Schedule）并点击下一步。\n\
  \n你将看到许多可以用于维护的的选项，包括：\n\n- 检查数据库完整性\n- 压缩数据库\n- 重组索引\n- 重建索引\n- 更新统计信息\n- 清理历史\n\
  - 执行 SQL Server 代理\n- 备份 – 全备、差异备或事务日志\n- 维护清理任务\n\n选择你想要执行的项（在本示例中，选择所有）。此向导将带你通过所选的每一项以进行精细调整。\n\
  \n一旦你选择了计划中需要的项目，点击下一步。你现在可以按照你希望完成的顺序对它们进行排序。最好将数据库放在第一个，以防断电，因此选择它并将其移动到列表顶部。点击下一步。\n\
  \n### 定义备份数据库（全备）任务\n\n此屏幕将让你自由选择想要执行的任何全数据库备份。最佳实践是每个数据库保留一个计划；选择一个数据库并点击下一步。\n\
  \n### 定义数据库完整性检查任务\n\n完整性任务是一个 SQL Server 命令，旨在检查数据库的完整性以确保一切稳定。选择一个数据库并点击下一步。\n\
  \n\n\n\n\n### 定义收缩数据库任务\n\n你现在可以在下一个屏幕配置收缩数据库以释放空间。这仅会在有可用空间时收缩空间，但如果你将来需要空间，则必须重新分配。不过，此步骤将有助于备份速度。大多数开发者并不经常使用此功能。选择要收缩的数据库后点击“下一步”。\n\
  \n### 定义重组织索引任务\n\n下一个屏幕是 `定义` `重组织索引任务` 屏幕。当你添加、修改和删除索引时，像表一样，你需要重组织它们。这个过程类似于硬盘，即存在碎片文件和分散在整个磁盘上的空间。对于繁忙的数据库，请每周执行一次此任务。你可以选择压缩大对象，这会压缩任何包含大型二进制对象数据的索引。点击“下一步”继续到下一个屏幕。\n\
  \n### 定义重建索引任务\n\n此屏幕涵盖单个索引行，涉及重组织或重新索引。在一个计划中同时进行这两项操作是没有意义的。根据你的碎片化程度，选择其中之一。在示例中，选择你的数据库并在\
  \ `tempdb` 中对结果排序。点击“下一步”继续。\n\n### 定义更新统计信息任务\n\n更新统计信息任务帮助开发者跟踪数据创建、修改和删除时的检索情况。你可以通过执行此计划来保持统计信息的更新。会保留索引和单个列的统计信息。选择你的数据库并点击“下一步”继续。\n\
  \n### 定义历史清理任务\n\n你现在应该看到此屏幕，它指定了要删除的历史数据。你可以在下拉菜单上指定更短的时间范围保留备份和恢复、代理作业历史和维护位置。点击“下一步”继续。\n\
  \n### 定义备份数据库（差异）任务\n\n此屏幕允许你备份自上一次或最后一次完整备份以来已更改数据库中的每个页。选择你想要使用的数据库并点击“下一步”。\n\
  \n### 定义备份数据库（事务日志）任务\n\n事务日志备份备份自上次备份以来的所有日志记录。你可以选择一个文件夹来存储它。执行此类备份是资源消耗最低的备份。选择数据库和存储位置并点击“下一步”。\n\
  \n### 定义执行 SQL Server Agent 作业任务\n\n`SQL Server Agent 作业任务` 处理外部的任务。例如，它可以检查空值、检查数据库是否符合指定标准等。在\
  \ `SQL Server Agent 作业任务` 中指定的任何作业都会列在此处。点击“下一步”继续。\n\n### 定义维护清理任务\n\n此屏幕定义了维护任务的清理操作。这确保了文件不会占用不必要的空间，你可以指定它们的存储位置。你还可以删除特定的备份文件。点击“下一步”继续。\n\
  \n### 报告选项\n\n下一个屏幕涵盖了你想存储维护计划报告的地方。请记住你打算将其存储在哪里。为了通过电子邮件发送，你需要在 SQL Server 上设置电子邮件。点击“下一步”继续。\n\
  \n### 完成向导\n\n最后一个屏幕是向导的完整审核。你可以查看计划的摘要以及选择了哪些选项。点击“完成”将结束向导并创建计划。你现在应该会看到显示已完成任务的成功屏幕。\n\
  \n# 运行维护计划\n\n一旦成功完成维护向导，下一步是运行你创建的计划。为了让计划运行，你需要让 `SQL Server Agent` 运行。它在 `SQL\
  \ Server Management Studio` 的 `管理` 下方第二个位置可见。你可以左键点击 `SQL Server Agent`，然后右键点击并选择“启动”。\n\
  \n或者，你可以按下 Windows 键并按 R 键，然后输入 `services.msc` 并按回车。一旦出现“服务”，向下滚动并寻找 `SQL Server\
  \ Agent (MSSQLEXPRESS)`。此本书指示你安装了 `SQL Server Express`，但如果你安装了其他版本，也可以选择如 `(MSSQLSERVER)`。左键点击它，然后右键点击它并选择“启动”。\n\
  \n你可以返回 `SSMS`，右键点击你在 `维护计划` 下创建的维护计划，然后选择“执行”。现在将运行你的计划。在计划成功完成后，点击“确定”并关闭对话框。你可以通过右键点击创建的维护计划并选择“查看历史”来查看报告。左侧是\
  \ SQL Server 中所有不同的计划，而特定计划的结果在右侧。\n\n### 通过电子邮件发送报告\n\n许多 DBA 喜欢通过电子邮件接收数据库报告。你需要做的是在发送电子邮件之前设置数据库邮件，然后设置一个发送电子邮件的`服务器代理`（Agent）。\n\
  \n### 配置数据库邮件\n\n第一步是在 `SSMS` 中右键点击 `数据库邮件` 并选择“配置数据库邮件”。将出现一个向导屏幕；点击“下一步”。现在选择第一个选项——`设置数据库邮件`——并点击“下一步”。输入配置文件的名称，如果需要，还可以为该配置文件提供可选的描述。现在，点击右侧的“添加”按钮。\n\
  \n这将带你进入“添加新数据库邮件帐户 - SMTP”。你需要为电子邮件帐户输入 `SMTP` 详情。你可能想为此服务设置一个新的电子邮件帐户。你可以在网上搜索\
  \ `SMTP` 详情，Gmail 运行非常良好（服务器名称：`smtp.gmail.com`，端口号 587，需要 SSL，勾选基本身份验证并确认密码）。点击“确定”。点击“下一步”，选择“公共”；这样做很重要，以便它可以被数据库的其他部分使用。将其设置为`默认配置文件`，点击“下一步”，再次点击“下一步”。你现在应该得到一个成功屏幕。点击“关闭”。\n\
  \n### SQL Server Agent\n\n为了发送数据库电子邮件，你需要设置一个`服务器代理`（Agent）。首先右键点击 `SQL Server Agent`\
  \ → `新建` → `操作员`。为操作员命名名称，如 `维护计划`，输入你想接收报告的电子邮件地址，并点击“确定”。\n\n现在，右键点击你已执行的维护计划并选择“修改”。维护计划设计屏幕将出现在右侧，你可以在其中看到已完成的任务图形。现在，点击`报告和日志`；它是位于设计计划菜单栏上的图标，位于`管理连接`的左侧。\n\
  \n`报告和日志`窗口将出现。选择`向电子邮件接收者发送报告`选项，并选择你刚刚创建的维护计划操作员。当你下次运行计划时，将向该电子邮件地址发送电子邮件。\n\n\
  \n\n\n\n备份数据库的第一步是为数据库选择恢复选项。当 `SQL Server` 在线时，你可以执行三种类型的备份，甚至可以在用户同时向数据库发送请求时进行。\n\
  \n在 `SQL Server` 中执行备份和恢复过程时，你是在恢复模型的限制内执行的，该模型设计用于控制事务日志的维护。这种恢复模型被认为是数据库的一个属性，旨在确保所有事务都按照特定的程序进行记录。\n\
  \n有三种不同的恢复模式：简单（simple）、完全（full）和大容量日志记录（bulk-logged）。\n\n## 简单恢复模式\n\n使用简单恢复模型时，你无法备份事务日志。通常，此模型用于更新不频繁的情况。事务将进行最小化记录，并且日志会被截断。\n\
  \n## 完全恢复模式\n在完全恢复模型下，必须进行事务日志备份。只有在备份过程开始时，事务日志才会被截断。你可以恢复到任何时间点。然而，你还需要完整的日志文件链才能将数据库恢复到尽可能最近的时间。\n\
  \n## 大容量日志记录模式\n该模型设计用于在使用批量导入操作时的短期使用。当你不需要恢复到特定时间点时，可以将它与完全恢复模型配合使用。它具有性能优势且不会填满事务日志。\n\
  \n## 更改恢复模式\n要更改恢复模式，你可以在 `SQL Server Management Studio` 中右键点击数据库并选择 `Properties`（属性）。然后，选择\
  \ `Options`（选项）并在下拉框中选择恢复模式。或者，你也可以使用以下命令：\n\n```sql\nALTER DATABASE SQLEbook SET\
  \ RECOVERY SIMPLE\nGO\n```\n\n```sql\nALTER DATABASE SQLEbook SET RECOVERY FULL\n\
  GO\n```\n\n```sql\nALTER DATABASE SQLEbook SET RECOVERY BULK_LOGGED\nGO\n```\n\n\
  ## 备份\n有三种类型的备份：全备份、差异备份和事务日志备份。当数据库管理员设置备份计划时，他们基于两个衡量标准制定计划：恢复时间目标 (`RTO`) 和恢复点目标\
  \ (`RPO`)。`RTO` 记录了在收到业务流程中断通知后恢复所需的时间。`RPO` 衡量在中断期间可能经过的时间范围，直到丢失的数据量超过业务流程的最大限制。\n\
  \n如果 `RPO` 仅为 60 分钟，而你的备份被设置为每 24 小时一次，那么你无法实现这一目标。你需要根据这两个衡量标准设置你的备份计划。\n\n###\
  \ 全备份\n当你创建全备份时，`SQL Server` 会创建一个 `CHECKPOINT`（检查点），确保任何现有的脏页都已写入磁盘。然后，`SQL Server`\
  \ 会备份数据库的每一个页面。接着，它会备份大部分事务日志以确保事务一致性。这意味着你能够将数据库恢复到最近的时间点，并恢复所有事务，包括一直到备份开始前的每一个事务。\n\
  \n仅执行这种方式是灵活性最低的选项。本质上，你只能将数据库恢复到某一个时间点，即最后一次全备份。因此，如果数据库在午夜后两小时发生损坏（而你的备份是在午夜进行的），那么你的\
  \ `RPO` 将是 22 小时。此外，如果用户在午夜后两小时截断了一个张表，你将面临同样的 22 小时业务事务损失。\n\n### 事务日志备份\n通过事务日志备份，`SQL\
  \ Server` 只备份事务日志中的数据，换句话说，只备份最近提交到数据库的事务。事务日志并不消耗资源，并且被认为是重要的，因为它可以更频繁地执行备份而不会影响数据库性能。\n\
  \n如果你选择完全恢复模式，可以同时运行全备份和事务日志备份。你还可以运行更频繁的备份，因为运行事务日志备份消耗的资源较少。如果你的数据库在全天都在更新，这是一个非常好的选择。\n\
  \n在调度事务日志备份时，最好遵循 `RPO`。例如，如果 `RPO` 为 60 分钟，则将日志文件备份设置为 60 分钟一次。然而，你必须检查此类备份的 `RTO`。如果你有一个\
  \ 60 分钟的 `RPO` 但每周只执行一次全备份，你可能无法在规定的时间内恢复所有 330 次备份。\n\n### 差异备份\n为了解决上述问题，你可以在计划中添加差异备份。差异备份是累积的，这意味着将数据库恢复到故障发生前一点点所需的备份数量将大幅减少。\n\
  \n差异备份顾如其名，它备份自上次备份以来修改过的数据库中的每个页面。`SQL Server` 通过标记和 `DIFF` 页面跟踪所有修改过的不同页面。\n\n\
  ## 执行备份\n要备份数据库，在 `SSMS` 中右键点击数据库，然后选择 `Tasks`（任务） -> `Backup`（备份）。你可以选择执行哪种备份（全备份、差异备份或事务日志备份）以及何时执行备份。仅复制备份允许你执行不影响恢复序列的备份。\n\
  \n## 恢复数据库\n当你想在 `SSMS` 中恢复数据库时，右键点击数据库，然后选择 `Tasks`（任务） -> `Restore`（恢复） -> `Database`（数据库）。你可以从下拉菜单中选择目标数据库，并保持其他选项页的内容填充。\n\
  \n如果你点击 `Timeline`（时间线），你可以看到上次备份创建的图形图表，它显示了丢失了多少数据。你可能有恢复到日志结束或特定日期的选项。\n\n`Verify\
  \ Backup` 媒体按钮允许你在实际恢复之前验证备份。如果你想更改存储备份的位置，可以点击 `Files` 选择不同的位置。你可以在 `Options` 页面上指定恢复选项：是覆盖现有数据库还是保留它。\n\
  \n点击 `OK` 后，数据库将进行恢复。\n\n## 附加和分离数据库\n附加和分离数据库的方法与备份和恢复相似。本质上，该方法的详细信息如下：\n\n* \
  \  允许将 `.MDF` 文件和 `.LDF` 文件复制到新的磁盘或服务器。\n*   执行方式类似于备份和恢复，但在某些情况下速度更快。\n*   数据库处于离线状态，用户或应用程序无法访问，直到重新附加为止。\n\
  \n那么，你应该选择哪一个呢？虽然备份是理想选择，但在某些情况下，附加/分离数据库可能是你的唯一选择。\n\n考虑以下场景：\n\n你的数据库包含多个文件组。附加这些文件组非常麻烦。\n\
  \n相应的解决方案是备份数据库并将其恢复到目标位置。\n\n根据数据库的大小，备份/恢复过程需要很长时间。但是，如果需要尽快使用，附加/分离数据库可能会快得多。\n\
  \n\n\n\n然而，备份数据库时创建的 `.BAK` 文件会将所有文件组合，允许你从单个备份集中恢复不同的文件版本。\n\n在采取任一选项之前，请考虑你的实际情况，但在考虑将附加/分离方法作为下一个备选方案之前，请先考虑备份和恢复。此外，在处理实时数据之前，请务必对其进行测试！\n\
  \n## 附加/分离 AdventureWorks2012 数据库\n\n由于你已经附加了此数据库，我们将让你将其从服务器上分离（detach）。之后，你将使用\
  \ SQL 语法重新附加它。\n\n### 分离数据库\n\n在 SQL Server 中，有一个存储过程可以为你分离数据库。该特定的存储过程位于 `master`\
  \ 数据库中。通过执行以下操作，你可以看到该存储过程的复杂性：\n\n1. 点击展开 `Databases`（数据库）文件夹\n2. 点击 `System Databases`（系统数据库），然后点击\
  \ `master` 数据库\n3. 点击 `Programmability`（可编程性）\n4. 点击 `Stored Procedures`（存储过程），然后点击\
  \ `System Stored Procedures`（系统存储过程）\n5. 找到 `sys.sp_detach_db`，在 SSMS 中右键点击它并选择“Modify”（修改）以查看其语法\n\
  \n对此，你只需直接执行该存储过程。\n\n以下是语法：\n\n```sql\nUSE master\n\nGO\n\nALTER DATABASE DatabaseName\
  \ SET SINGLE_USER\nWITH ROLLBACK IMMEDIATE\n\nGO\n\nEXEC master.dbo.sp_detach_db\
  \ @dbname = N'DatabaseName',\n@skipchecks = 'false'\nGO\n```\n\n我们将稍微扩展一下正在发生什么。你希望使用\
  \ `master` 数据库来修改你要分离的数据库，并将其设置为单用户（single user）而不是多用户。\n\n最后，`@dbname` 之后的值允许你指定要分离的数据库名称，将\
  \ `@skipchecks` 设置为 `false` 意味着引擎将更新统计信息，识别出数据库已分离。在分离数据库时，将此设置为 `@false` 是理想的，这样系统就能保留所有数据库当前的信息。\n\
  \n### 附加数据库\n\n一旦分离了数据库，如果你导航到数据目录所在，你会发现 `AdventureWorks2012_Data.MDF` 文件仍然存在——这应该是这样的，因为你只是分离了它而没有删除。\n\
  \n接下来，获取 `.MDF` 文件的路径，并将其复制粘贴到某个你可以轻松访问的地方，例如记事本。我们使用的位置是 `C:\\Program Files\\Microsoft\
  \ SQL Server\\MSSQL13.MSSQLSERVER\\MSSQL\\DATA`。\n\n现在，回到 SSMS 并点击 `New Query`（新建查询）按钮（如果你已经连接）。如果你尚未连接，请连接到你的实例。\n\
  \n一旦你连接到实例并打开了新的查询会话，你只需要使用数据文件存储的路径。一旦获取了路径，你可以在以下 SQL 语法示例中输入该值以附加你的数据库。\n\n以下是附加数据库文件和日志文件的语法。在接下来的练习中，你将完全附加日志文件，因为你并没有将其附加到新服务器上。因此，你可以省略附加日志文件的语句。\n\
  \n```sql\nCREATE DATABASE DatabaseName ON\n(FILENAME = 'C:\\SQL Data Files\\DatabaseName.mdf'),\n\
  (FILENAME = 'C:\\SQL Data Files\\DatabaseName_log.ldf') FOR ATTACH\n```\n\n在上面的示例中，如果存在日志文件，我们会调用附加该日志文件的语句。然而，如果你恰好没有\
  \ `.LDF` 文件而只有 `.MDF` 文件，那也没关系。你只需附加 `.MDF` 文件，数据库引擎将创建一个新的日志文件并开始向该特定日志写入活动。\n\n\
  # 5. 执行 CRUD 操作\n\n现在是时候对数据库执行 CRUD 操作了。CRUD 是 Create（创建）、Read（读取）、Update（更新）和 Delete（删除）的缩写。这些是最基本的四数据库操作。在本章中，我们将学习如何执行这些操作。\n\
  \n## 创建数据\n\n要在表中创建数据，会使用 `INSERT` 查询。插入查询的语法如下：\n\n```sql\nINSERT INTO TABLE (Column1,\
  \ Column2, Column3 …. Column N)\nVALUES (Value1, Value2, Value3 …. Value N),\n(Value1,\
  \ Value2, Value3 …. Value N),\n(Value1, Value2, Value3 …. Value N)\n```\n\n插入查询的语法非常简单；你必须使用关键字\
  \ `INSERT INTO TABLE`，其后跟一对括号。在括号内，你必须指定用逗号分隔的列名列表，即你想要插入数据的列。接下来的使用 `VALUES` 关键字，后跟一对括号，其中包含要存储在列中的用逗号分隔的值列表。你可以一次存储多条记录。每组列之间应通过逗号与其他分开。重要的一是是列和值的顺序应该是相似的。\n\
  \n如果你在 `INSERT INTO TABLE` 关键字后的括号内没有指定列，则使用默认表方案。\n\n让我们向我们的 `Hospital` 数据库插入一些数据。与创建表一样，首先你应该向没有包含任何外键的表中插入记录。我们将从\
  \ `Patients` 表开始。查看以下查询：\n\n```sql\nUSE Hospital;\n\nINSERT INTO Patients\nVALUES\
  \ ('Tom', 20, 'Male' ,'O+', 123589746),\n('Kimer', 45,'Female', 'AB+', 45686412),\n\
  ('James', 16,'Male', 'O-', 78452369),\n...\n```\n\n\n\n\n现在让我们向 `Treatments` 和 `Patient_Examinations`\
  \ 表插入占位记录。`Treatments` 表有两个外键列 `patient_id` 和 `doctor_id`。前者引用了 `Patients` 表的 `id`\
  \ 列，后者引用了 `Doctors` 表的 `id` 列。因此，在为这些外键列插入记录时，我们应该只插入在相应引用列中存在的值。以下脚本将向 `Treatment`\
  \ 表中插入记录。\n\n```sql\nUSE Hospital;\n\nINSERT INTO Treatment\nVALUES (1,3, 'Fit'),\n\
  (1,3, 'Good condition'),\n(2,5, 'Needs more treatment'),\n(1,4, 'Referred for XRay'),\n\
  (8,1, 'Medicnes recommended'),\n(5,2, 'Fit'),\n(9,3, 'Perfect')\n```\n\n同样地，执行以下脚本向\
  \ `Patient_Examination` 表添加数据。\n\n```sql\nUSE Hospital\nINSERT INTO Patient_Examination\n\
  VALUES (1,3, 'Positive'),\n(1,3, 'Negative'),\n(2,5, 'Positive'),\n(1,4, 'Negative'),\n\
  (8,1, 'Positive'),\n(5,2, 'Negative'),\n(9,3, 'Positive')\n```\n\n## 选择数据\n\n我们已经在所有表中都插入了数据。现在是检索这些数据的时间了。在\
  \ SQL 中，我们使用 `SELECT` 查询。你可以从所有列选择数据，也可以从单个列选择数据。这两种操作的语法如下：\n\n### 选择所有列\n```sql\n\
  SELECT * FROM Table_Name\n```\n\n### 选择单个列\n```sql\nSELECT column1, column2, column3\
  \ ... columnN FROM Table_Name\n```\n\n让我们从 `Patients` 表选择所有记录。执行以下查询：\n\n```sql\n\
  SELECT * FROM Patients\n```\n\n此查询将检索 `Patients` 表中带有所有列值的所有记录。上述查询的结果如下：\n\n| id\
  \ | name | age | gender | blood_group | phone |\n| :--- | :--- | :--- | :--- | :---\
  \ | :--- |\n| 1 | Tom | 20 | Male | O+ | 123589746 |\n| 2 | Kimer | 45 | Female\
  \ | AB+ | 45686412 |\n| 3 | James | 16 | Male | O- | 78452369 |\n| 4 | Matty | 43\
  \ | Female | B+ | 15789634 |\n| 5 | Sal | 24 | Male | O+ | 48963214 |\n| 6 | Julie\
  \ | 26 | Female | A+ | 12478963 |\n| 7 | Frank | 35 | Male | A- | 85473216 |\n|\
  \ 8 | Alex | 21 | Male | AB- | 46971235 |\n| 9 | Hales | 54 | Male | B+ | 74698125\
  \ |\n| 10 | Elice | 32 | Female | O+ | 34169872 |\n\n例如，如果你只想检索 `Patients` 表中所有记录的\
  \ `name` 和 `blood_group` 列，可以执行以下查询。\n\n```sql\nSELECT name, blood_group FROM Patients\n\
  ```\n\n结果集将如下：\n\n| name | blood_group |\n| :--- | :--- |\n| Tom | O+ |\n| Kimer\
  \ | AB+ |\n| James | O- |\n| Matty | B+ |\n| Sal | O+ |\n| Julie | A+ |\n| Frank\
  \ | A- |\n| Alex | AB- |\n| Hales | B+ |\n| Elice | O+ |\n\n## 更新数据\n\n要更新现有表数据，可以使用\
  \ `UPDATE` 查询。更新查询的语法如下：\n\n```sql\nUPDATE Table_Name\nSET Column_Name = Value\n\
  ```\n\n让我们将所有检查的价格增加 10%。为了做到，我们必须通过将 `Examinations` 表中 `price` 列的值乘以 `1.1` 来更新它。以下更新查询执行了此操作。\n\
  \n```sql\nUPDATE Examinations\nSET price = price * 1.1\n```\n\n## 删除数据\n\n`DELETE`\
  \ 查询用于从表中删除记录。`DELETE` 查询的语法如下：\n\n```sql\nDELETE FROM Table_Name\n```\n\n要删除 `Patient_Visits`\
  \ 表中的所有记录，执行以下查询。（不要忘记在 `Patient_Visits` 表中重新插入记录。我们将使用这些数据在后续章节中执行查询）\n\n```sql\n\
  DELETE FROM Patient_Visits\n```\n\n在本章中，我们学习了创建、插入、更新和删除表记录。然而，我们看到这些操作是在所有记录上执行的。如果我们只想删除特定的记录呢？例如，如果我们只想更新女性患者的记录，该怎么做？\n\
  \n# 6. 嵌套查询与递归的硬核概念\n\n正如标题所示，在本章中，我们将处理 SQL 编程中两个非常不同但至关重要的方面。让我们先从子查询开始，它基本上将涵盖嵌套查询部分。\n\
  \n## 到底什么是嵌套查询！\n\n\n\n\n\n# 在 UPDATE、INSERT 和 DELETE 语句中插入子查询\n\n正如你可能已经注意到的，子查询在结合不同语句以处理多条数据方面非常多能。将\
  \ `WHERE` 子句（带有子查询）与任何 `UPDATE`、`INSERT` 或 `DELETE` 语句结合，你还将获得一些非常有趣的结果。\n\n继续我们之前假设公司的示例，如果我们在某个时刻想要将上个月所有购买记录的信用额度增加\
  \ 10%，我们将如下所示更新数据：\n\n```sql\nUPDATE TRANSMASTER\nSET NetAmount = NetAmount * 0.9\n\
  WHERE SaleDate > (CurrentDate – 30) DAY AND CustID =\n(SELECT CustID\n FROM CUSTOMER\n\
  \ WHERE Company = ‘Olympic Sales’) ;\n```\n\n## 处理递归概念\n\n现在我们已经完成了这个章节的第一部分，让我们来谈谈\
  \ `Recursion`（递归）。这主要主要是一个在其他语言中已经存在很长时间的特性，但在集成到 SQL 框架时遭遇了不幸的延迟。要理解递归，你需要理解一个简单的机制。\n\
  \n在任何如 `LISP`、`Logo`、`C++` 或 `SQL` 等编程语言中，每当你定义一个执行特定操作的函数时，程序都会创建一个名为“函数调用”（function\
  \ call）的命令来自动模拟该函数。递归最简单的例子是：在执行某个函数的同时，该函数开头调用了它自己！\n\n为了让事情更清楚，让我们通过一个用 `C++`\
  \ 编写的程序展示递归，该程序设计用于在显示器上画螺旋线。请记住，假设绘图工具最初指向屏幕顶部。\n\n程序的代码如下：\n\n```cpp\nvoid spiral(int\
  \ segment) {\n    line(segment)\n    left_turn(90)\n    spiral(segment + 1)\n} ;\n\
  ```\n\n当你通过调用 `spiral (1)` 程序时，将发生以下动作：\n\n* `Spiral(1)` 在屏幕顶部绘制一条长度为 1 的线\n* `Spiral(1)`\
  \ 向左转 90 度\n* `Spiral(1)` 调用了 `spiral(2)`\n* `Spiral(2)` 在屏幕顶部绘制一条长度为 1 的线\n* `Spiral(2)`\
  \ 向左转 90 度\n\n循环就这样一直持续，直到最终你得到这个结果。\n\n![00014.jpeg](img/00004.jpeg)\n\n注意程序是如何一次又一次调用它自己的？这就是递归。你可以将其与\
  \ `Java` 中常见的简单循环进行类比。\n\n![00015.jpeg](img/00005.jpeg)\n\n## 递归查询简介\n\n现在你已经知道了什么是递归，对于你来说，掌握递归查询（recursive\
  \ query）的概念应该并不难。这简单来说就是一个在功能上依赖于它自身的查询。例如，如果我们在查询 1 中包含一个表达式，运行该表达式就会在查询表达式的主体中调用自己。\n\
  \n听起来很奇怪吗？别担心！让我们用一个现实中的例子来澄清这一点。\n\n考虑这样一个场景：一家名为“The Secretive International”的假设航空公司决定为你提供一次完全免费的航空旅行机会。这时，你脑海中浮现的最明显的问题是：“我可以免费去哪里？”\n\
  \n下面是一张包含可用航班的号、出发地和目的地的表格。使用上述数据，你将希望使用下面的代码创建一个完整的表，作为你的假期计划师。\n\n```sql\nCREATE\
  \ TABLE LIGHT (\n    FlightNo INTEGER NOT NULL,\n    Source CHAR (30),\n    Destination\
  \ CHAR (30)\n);\n```\n\n一旦你选择了一个起点，你将希望决定哪些城市是可以到达的。例如，如果你从波特兰（Portland）或蒙特马利（Montgomery）出发！如果你逐个处理以下每个查询，寻找解决方案将非常繁琐。这是一个通过下面的代码利用递归查询的完美示例：\n\
  \n```sql\nWITH RECURSIVE REACHABLEFROM (Source, Destination) AS (\n    SELECT Source,\
  \ Destination\n    FROM FLIGHT\n    UNION\n    SELECT in.Source, out.Destination\n\
  \    FROM REACHABLEFROM in, FLIGHT out\n    WHERE in.Destination = out.Source\n\
  )\nSELECT * FROM REACHABLEFROM\nWHERE Source = ‘Portland';\n```\n\n### 结果将类似于下面的表，它通过递归显示从每个源城市出发时可能到达的城市。\n\
  \n# 7. 使你的数据库安全\n\n作为大型数据库的系统管理员并不如想象中那么简单。你不仅要处理客户的需求，还必须维护并提供一个更安全的环境，让你的客户在知道数据存储在安全手中时感到放心。SQL\
  \ 提供了多种功能，可以组合起来创建非常复杂且无缝的安全系统，让你能够控制授予或撤销单个用户的访问权限。\n\n## 控制的 9 个函数\n\n以下函数有助于你强化安全系统的方法。\n\
  \n* `INSERT` \n* `DELETE`\n* `UPDATE`\n* `SELECT`\n* `REFRENCE`\n* `USAGE`\n* `UNDER`\n\
  * `TRIGGER`\n* `EXECUTE`\n\n## 数据库系统的层次结构\n\n在建立安全系统时，理解数据库系统的层次结构至关重要。层次结构让你对整个系统如何运作有一个直观的认识。SQL\
  \ 安全系统的核心部分分类如下：\n\n* `DBA`（数据库管理员）：数据库管理员通常是对比数据库内发生的所有操作拥有最高权威的人。所有的修改权限都在 `DBA`\
  \ 手中，他一个错误就能摧毁一切。\n* 数据库所有者：这是另一组拥有高权限的用户。通常，创建表、视图等数据对象的人被称为这些对象的所有者，他们拥有与这些对象的操作和保护相关的权限。\n\
  * 公共（Public）：一旦排除了 `DBA` 和数据库所有者，其余没有特殊权限的数据库用户被称为 `PUBLIC`。公众的访问权限在很大程度上取决于特权用户授予他们的权利。\n\
  \n## 设置权限\n\n作为数据库的 `DBA`，你将允许某些用户访问数据库的特定部分，并防止他们访问其他部分。这是通过 `GRANT` 语句实现的。\n\n\
  ```sql\nGRANT privilege-list\nON object\nTO user-list\n[WITH HIERARCHY OPTION]\n\
  [WITH GRANT OPTION]\n[GRANTED BY grantor];\n```\n\n这里的 `Privilege`（权限）定义为：\n\n*\
  \ `SELECT`\n* `DELETE`\n* `INSERT [(column-name [, column-name]...)]\n* `UPDATE\
  \ [(column-name [, column-name]...)]`\n* `REFERENCES [(column-name [, column-name]...)]`\n\
  * `USAGE`\n* `UNDER`\n* `TRIGGER`\n* `EXECUTE`\n\n而对象定义为：\n\n`[ TABLE ] <table name>`\n\
  | `DOMAIN <domain name>`\n| `COLLATION <collation name>`\n| `CHARACTER SET <character\
  \ set name>`\n| `TRANSLATION <transliteration name>`\n| `TYPE <schema-resolved user-defined\
  \ type name>`\n| `SEQUENCE <sequence generator name>`\n| `<specific routine designator>`\n\
  \n\n\n\n最后，用户列表如下：\n\n`login-ID` [, `login-ID`]...\n\n| PUBLIC |\n\n## 角色分配的重要性\n\
  \n角色本质上是用户名的另一种替代方案，可以作为授权标识符。你可以使用如下语法设置角色：\n\n```sql\nCREATE ROLE SalesClerk ;\n\
  ```\n\n之后，你可以使用 `GRANT` 将人员分配到已创建的角色中：\n\n```sql\nGRANT SalesClerk to Becky ;\n\
  ```\n\n这本质上将帮助你轻松地创建一个具有相似权限的人员组。\n\n可以通过以下方式允许角色 `INSERT` 数据：\n\n```sql\nGRANT\
  \ INSERT ON CUSTOMER TO SalesClerk ;\n```\n\n可以通过以下方式允许角色查看数据：\n\n```sql\nGRANT\
  \ SELECT ON PRODUCT TO PUBLIC ;\n```\n\n可以通过以下方式允许角色修改数据：\n\n```sql\nGRANT UPDATE\
  \ ON BONUSRATE TO VPSales ;\n```\n\n## 授予权限的\n\n这个概念在某种程度上类似于向你信任的其他用户授予少量的你的权限，让他们能够控制数据库访问权限。这实际上非常有意义，特别是当你尝试与一个大型团队合作时。你并不能一直在场，有时你可能会生病，那时你就需要有人临时接管！\n\
  \n这可以通过 `grant option` 实现，以下是一个销售经理的示例，他已被授予向他人提供 `UPDATE` 权限的权力：\n\n```sql\nGRANT\
  \ UPDATE (BonusPct) ON BONUSRATE TO SalesMgr WITH GRANT OPTION ;\nGRANT UPDATE (BonusPct)\
  \ ON BONUSRATE TO AsstSalesMgr ;\n```\n\n## 收回权限\n\n正如标题所暗示，有时你可能需要采取关键且严肃的步骤来撤销用户的权限。这通过如下\
  \ `REVOKE` 语句完成：\n\n```sql\nREVOKE [GRANT OPTION FOR] privilege-list ON object FROM\
  \ user-list [RESTRICT|CASCADE] ;\n```\n\n## 理解对数据完整性的威胁\n\n现在你已经知道如何控制你的结构，你应该能清楚地掌握可能面临的阻碍数据稳定性的常见威胁。\n\
  \n- **平台不稳定性**：意外出现的问题，例如未发现的漏洞或新 DBMS 或操作系统发布中的问题，都属于此类。\n- **设备故障**：如名所示，这是指不可预见的事件，即你高度可靠的先进设备可能会故障，导致你的数据“送往人后”。保持一个不断复制所有内容的冗余备份可以防止此类事件的发生。\n\
  - **并发访问问题**：即使你完全确定程序没有漏洞和硬件错误，如果多个用户尝试同时访问你的数据库，仍然出现问题。在这种情况下，系统将挣扎决定谁先进入（竞争）。解决此问题的良好方法是调用序列化系统，让第一个用户先获得访问，然后是第二个，以此类推……\n\
  \n## 减少数据损坏概率的技巧\n\n虽然你可以采取若干步骤来确保数据安全，但以下是一些你应该熟悉的常用方法：\n\n- **SQL 事务的使用**：这是 SQL\
  \ 维护数据库完整性的主要方法之一。我们之前已经讨论过这一点。它简单地封装了可能影响数据库的所有 SQL 语句，并且仅通过 `COMMIT` 或 `ROLLBACK`\
  \ 选项执行。\n\n```\nStart of the application\n    Various SQL statements (SQL transaction-1)\n\
  \    COMMIT or ROLLBACK\n    Various SQL statements (SQL transaction-2)\n    COMMIT\
  \ or ROLLBACK\n    Various SQL statements (SQL transaction-3)\n    COMMIT or ROLLBACK\n\
  End of the application\n```\n\n- **隔离性**：另一种方法是隔离单个事务，以便即使多个用户同时工作，它们也不会与彼此冲突。使用\
  \ `SET TRANSACTION` 命令，隔离性可以很好地锁定数据库中的对象，如果它们被错误地访问。\n\n```\nSET TRANSACTION READ\
  \ ONLY, ISOLATION LEVEL READ UNCOMMITTED, DIAGNOSTICS SIZE 4 ;\nSET TRANSACTION\
  \ READ WRITE, ISOLATION LEVEL SERIALIZABLE, DIAGNOSTICS SIZE 8 ;\n```\n\n- **保存点的使用**：通过结合\
  \ `ROLLBACK` 和 `SAVEPOINT` 语句，可以控制事务的流程。`SAVEPOINT` 的设置基本上是为了结束事务。这让你在事务执行后发生任何问题时，有机会回到上一个保存点。\n\
  \n```\nSAVEPOINT savepoint_name ;\nROLLBACK TO SAVEPOINT savepoint_name ;\n```\n\
  \n# 8. 表的修改与控制\n\n### 修改表\n\n`ALTER TABLE` 命令用于修改现有数据库表。这是一个强大的命令，允许你更改表名、添加新字段、删除列、编辑字段定义、修改表的存储值，并包含或排除约束。以下是修改表的的基本语法：\n\
  \n#### 修改表名\n\n`ALTER TABLE` 命令可以配合 `RENAME` 函数更改表名。为了演示此语句的使用，你将使用带有以下记录的 `EMPLOYEES`\
  \ 表。假设你想将 `EMPLOYEES` 表更名为 `INVESTORS`，你可以轻松地使用此语句：\n\n```sql\nALTER TABLE EMPLOYEES\
  \ RENAME TO INVESTORS;\n```\n\n你的表现在命名为 `INVESTORS`。\n\n#### 修改列属性\n\n列的属性指的是输入列中的数据的属性和行为。你通常会在创建表时设置列属性。但你仍然可以使用\
  \ `ALTER TABLE` 命令更改一个或多个属性。你可以修改以下内容：\n\n- 列名\n- 分配给列的数据类型\n- 列的标度、长度或精度\n- 列中使用或不使用\
  \ `NULL` 值\n\n#### 重命名列\n\n你可能想修改列名以反映其包含的数据。例如，由于你已经将 `EMPLOYEES` 数据库重名为 `INVESTORS`，列名\
  \ `SALARY` 将不再合适。你可以将列名更改为类似 `CAPITAL`。同样，你可能想将其数据类型从 `DECIMAL` 更改为最大十位数字的 `INTEGER\
  \ TYPE`。\n\n```sql\nALTER TABLE INVESTORS CHANGE SALARY CAPITAL INT(10);\n```\n\n\
  ### 删除列\n\n此时 `Position` 列不再适用。你可以使用此语句删除该列：\n\n```sql\nALTER TABLE INVESTORS DROP\
  \ COLUMN Position;\n```\n\n这是更新后的 `INVESTORS` 表：\n\n### 添加新列\n\n由于你现在正在处理另一组数据，你可能决定添加另一个列，使\
  \ `INVESTORS` 表中的数据更具相关性。你可以添加一个存储每位投资者持股数量的列。你可以将新列命名为 `STOCKS`。该列接受最多 9 位的整数。\n\
  \n```sql\nALTER TABLE INVESTORS ADD STOCKS INT(9);\n```\n\n这是更新后的 `INVESTOR` 表：\n\
  \n#### 在不更改列名的情况下修改现有列\n\n你还可以将 `ALTER TABLE` 命令与 `MODIFY` 关键字结合，更改表的数据类型和规格。为了演示，你可以使用以下语句将\
  \ `CAPITAL` 列的数据类型从 `INT` 类型更改为最多 9 位数字和两位小数的 `DECIMAL` 类型。\n\n\n\n\n此时，你可能好奇想查看\
  \ `INVESTORS` 表的列名和属性。你可以使用 `SHOW COLUMNS` 语句来显示表的结构。输入以下语句：\n\n```\nSHOW COLUMNS\
  \ FROM INVESTORS;\n```\n\n这里是结果的截图：\n\n你使用此语句也可以获得相同的结果：\n\n```\nDESC INVESTORS;\n\
  ```\n\n## 使用 ALTER TABLE 时需要记住的规则\n\n### 向数据库表中添加列\n在添加新列时，请记住，你不能向带有已有数据的表中添加带有\
  \ `NOT NULL` 属性的列。通常情况下，你会指定某列为 `NOT NULL`，以表示它将包含一个值。如果现有数据没有新列的值，则添加 `NOT NULL`\
  \ 列将违反该约束。\n\n### 修改字段/列\n在修改当前数据库列时，你应该密切关注以下规则：\n1. 你可以轻松地修改列的数据类型。\n2. 你可以增加列的长度，但只有当列长度等于或小于目标列长度时，你才能缩短列长度。\n\
  3. 你可以增加数值数据类型包含的位数，但只有当表中存储的最大位数等于或低于目标位数时，你才能减少它。\n4. 只要不超过允许的最大小数位数，你就可以增加或减少数值数据类型的小数位数。\n\
  \n如果处理不当，删除和修改表可能会导致价值信息的丢失。因此，在执行 `ALTER TABLE` 和 `DROP TABLE` 语句时要极度小心。\n\n##\
  \ 删除表\n`DROP TABLE` 命令用于从数据库中删除表及其定义。删除表还会删除其数据、关联索引、触发器、约束和权限数据。在使用此语句时你应该非常小心。\n\
  \n其语法如下：\n\n例如，如果你想从 `xyzcompany` 数据库中删除 `INVESTORS` 表，你可以使用此语句：\n\n```\nDROP TABLE\
  \ INVESTORS;\n```\n\n`DROP TABLE` 命令已有效地从当前数据库中删除了 `INVESTORS` 表。\n\n如果你尝试使用此命令访问\
  \ `INVESTORS` 表：\n\n```\nSELECT* FROM INVESTORS;\n```\n\nSQL 将返回类似所示的错误信息；\n\n##\
  \ 合并和连接表\n如果多个表之间存在共同字段，你就可以合并来自多个表的数据。`JOIN` 语句用于执行此操作。SQL 支持几种类型的 `JOIN` 操作：\n\
  \n### INNER JOIN（内连接）\n`INNER JOIN` 或简称为 `JOIN` 是最常用的 `JOIN` 类型。当要连接的表具有匹配字段时，它会显示这些行。\n\
  \n其语法如下：\n\n在这种变体中，使用 `JOIN` 子句代替了 `INNER JOIN`。\n\n### LEFT JOIN（左连接）\n`LEFT JOIN`\
  \ 操作返回左表的所有行以及右表中匹配的行。如果未找到匹配项，右侧将返回 `NULL`。\n\n`LEFT JOIN` 的语法如下：\n\n在某些数据库系统中，使用关键字\
  \ `LEFT OUTER JOIN` 代替 `LEFT JOIN`。该变体的语法如下：\n\n### RIGHT JOIN（右连接）\n此 `JOIN` 操作返回右表的所有行以及左表中匹配的行。如果未找到匹配项，左侧将返回\
  \ `NULL`。\n\n此操作的语法如下：\n\n在某些数据库系统中，使用 `RIGHT OUTER JOIN` 代替 `LEFT JOIN`。该变体的语法如下：\n\
  \n### FULL OUTER JOIN（全外连接）\n此 `JOIN` 操作在在至少有一个表满足条件时将显示所有行。它结合了来自 `RIGHT` 和 `LEFT`\
  \ 连接操作的结果。\n\n为了演示 SQL 中的 `JOIN` 操作，你将使用 `Branch_Sales` 和 `Branch_Location` 表：\n\
  \n**Branch_Sales 表**\n| Branch | Product_ID | Sales |\n| :--- | :--- | :--- |\n\
  | New York | 101 | 7500.00 |\n| Los Angeles | 102 | 6450.00 |\n| Chicago | 101 |\
  \ 1560.00 |\n| Philadelphia | 101 | 1980.00 |\n| Denver | 102 | 3500.00 |\n| Seattle\
  \ | 101 | 2500.00 |\n| Detroit | 102 | 1450.00 |\n\n**Location 表**\n| Region | Branch\
  \ |\n| :--- | :--- |\n| East | New York |\n| East | Chicago |\n| East | Philadelphia\
  \ |\n| East | Detroit |\n| West | Los Angeles |\n| West | Denver |\n| West | Seattle\
  \ |\n\n目标是按区域获取销售额。`Location` 表包含区域和分支的数据，而 `Branch_Sales` 表持有每个分支的销售数据。要找到每个区域的销售额，你需要合并\
  \ `Location` 和 `Branch_Sales` 表的数据。注意，这些表有一个共同字段 `Branch`。该字段连接了这两个表。\n\n以下语句将演示你如何使用表别名连接这两个表：\n\
  \n```\nSELECT A1.Region Region, SUM(A2.Sales) Sales\nFROM Location A1, Branch_Sales\
  \ A2\nWHERE A1.Branch = A2.Branch\nGROUP BY A1.Region;\n```\n\n结果将是：\n\n在前两行中，该语句告诉\
  \ SQL 从 `Location` 表中选择 `Region` 字段并计算 `Sales` 的总和。\n\n\n\n\n在合并表格时，请注意某些 `JOIN`\
  \ 语法在不同的数据库系统中可能会产生不同的结果。为了最大限地利用这一强大的数据库功能，阅读 RDBMS 文档至关重要。\n\n# 9. 聚合函数、删除与更新\n\
  \n到为止，我们处理的都是单个记录。我们已经了如何向数据库中插入单个记录、如何根据标准从数据库检索记录，以及如何应用不同类型的过滤器来获取所需的输出。如果我们想从\
  \ `PatientAge` 列检索患者的最大年龄怎么办？SQL 聚合函数可以帮助我们完成这项任务。我们将看到一些 SQL 中最常用的聚合函数。我们还将看到如何从表中删除记录，以及如何更新现有记录。\n\
  \n## 目录\n\n- 聚合函数\n  1. `Count()`\n  2. `Avg()`\n  3. `Sum()`\n  4. `Max()`\n  5.\
  \ `Min()`\n  6. `First/Top()`\n  7. `Ucase/Upper()`\n  8. `Lcase/Lower()`\n- Delete\
  \ 语句\n- Update 语句\n\n## 1- 聚合函数\n\n以下是一些最常用的函数。\n\n### 1. `Count()`\n\n`Count()`\
  \ 函数计算符合特定条件的行数。例如，如果你想统计患有心脏病的患者人数，可以如下所示使用 `Count()` 函数：\n\n查询 1\n```sql\nSELECT\
  \ COUNT(PatientID) as PatientsWithHeartDisease\nFrom Patient\nWHERE DiseaseDescription\
  \ LIKE ('%heart%')\n```\n\n上述查询统计了患有心脏病的患者，并将结果显示在 `PatientsWithHeartDisease` 列中。\n\
  \n### 2. `Avg()`\n\n`Avg()` 函数根据某些标准返回特定表列中值的平均值。例如，如果你想检索所有心脏病患者的平均年龄，可以如下所示使用\
  \ `Avg()` 函数：\n\n查询 2\n```sql\nSELECT AVG(PatientAge) as AverageAgeofHeartDisease\n\
  From Patient\nWHERE DiseaseDescription LIKE ('%heart%')\n```\n\n### 3. `Sum()`\n\
  \n`Sum()` 函数根据某些标准返回特定表列中值的和。例如，如果你想检索所有患者年龄的总和，可以如下所示使用 `Sum()` 函数：\n\n查询 3\n```sql\n\
  SELECT Sum(PatientAge) as SumOfAges\nFrom Patient\n```\n\n### 4. `Max()`\n\n`Max()`\
  \ 函数返回特定表列中所有值的最大值。例如，如果你想检索所有患者的最大年龄，可以如下所示使用 `Max()` 函数：\n\n查询 4\n```sql\nSELECT\
  \ Max(PatientAge) as MaximumAge\nFrom Patient\n```\n\n### 5. `Min()`\n\n同样，要检索最小患者年龄，可以执行以下查询：\n\
  \n查询 5\n```sql\nSELECT Min(PatientAge) as MaximumAge\nFrom Patient\n```\n\n### 6.\
  \ `Top/First()`\n\n`Top()` 或 `First()` 函数返回特定表列中所有值中的前“n” 个，其中“n”可以是任何整数。例如，如果你想检索\
  \ `Patient` 表中前三个患者的年龄，可以如下所示使用 `Top()` 函数：\n\n查询 6\n```sql\nSELECT Top 3 PatientAge\
  \ as First3Ages\nFrom Patient\n```\n\n上述查询将检索前三个患者的年龄。输出将如下：\n\n| First3Ages |\n\
  | 10 |\n| 26 |\n| 15 |\n\n要检索 `Patient` 表中最后三个患者的年龄，可以结合 `Order By` 子句使用 `Top()`\
  \ 查询，如下所示：\n\n查询 7\n```sql\nSELECT Top 3 PatientAge as Last3Ages\nFrom Patient Order\
  \ by PatientAge desc\n```\n\n查询 7 的输出如下：\n\n| Last3Ages |\n| 47 |\n| 42 |\n| 31\
  \ |\n\n### 7. `Upper()/Ucase`\n\n`Upper()` 或 `Ucase()` 函数将所选列中的所有值转换为大写。此函数仅适用于字符串或字符值的列。\n\
  \n查询 8\n```sql\nSELECT Upper(PatientName) as PatientNameUpper\nFrom Patient\n```\n\
  \n查询 8 的输出如下：\n\n| PatientNameUpper |\n| JAMES |\n| JOSEPH |\n| SARAH |\n| JULIAN\
  \ |\n| ISAAC |\n| MARGRET |\n| MIKE |\n| RUSS |\n| MARIA |\n| CANDICE |\n\n### 8.\
  \ `Lcase()/Lower()`\n\n同样，要将列值转换为小写，使用 `Lcase()` 或 `Lower()` 函数。由于我为了演示使用了 MS SQL\
  \ Server，我将在查询中使用 `Lower()`。\n\n查询 9\n```sql\nSELECT Lower(PatientName) as PatientNameLower\n\
  From Patient\n```\n\n输出将包含所有小写的 `PatientName` 值，如下所示：\n\n| PatientNameLower |\n\
  | james |\n| joseph |\n| sarah |\n| julian |\n| isaac |\n| margret |\n| mike |\n\
  | russ |\n| maria |\n| candice |\n\n## 2- Delete 语句\n\n我们知道如何向数据库插入记录；我们也知道如何使用\
  \ `SELECT` 语句检索记录，以及如何使用带有各种 SQL 操作符的 `where` 子过滤记录。现在我们将学习如何从表中删除记录。\n\n删除记录使用\
  \ SQL `DELETE` 语句。像 `SELECT` 语句一样，`DELETE` 语句也可以结合 `SELECT` 语句使用来删除过滤后的记录。让我们看看如何删除表中的所有记录。为此可以执行以下查询：\n\
  \n查询 10\n```sql\nDELETE From Patient\n```\n\n此查询将删除患者表中的所有记录。然而，在某些情况下，我们只想删除满足特定标准的记录。例如，你可以使用以下查询删除患有心脏病的记录：\n\
  \n查询 11\n```sql\nDelete From Patient\nwhere DiseaseDescription like('%heart%')\n\
  ```\n\n## 3- Update 语句\n\n我们知道如何向数据库插入记录；我们也知道如何使用 `SELECT` 语句检索记录以及如何删除记录；在本节中，我们将学习如何更新现有记录。\n\
  \n在 SQL 中，使用 `UPDATE` 语句来更新记录，后跟 `SET` 关键字，该关键字用于更新现有值。\n\n如果你想将 `DiseaseDescription`\
  \ 列中的字符串“Heart Disease”替换为字符串“Cardiac Disease”，可以如下所示使用 `UPDATE` 语句：\n\n查询 12\n\
  ```sql\nUPDATE Patient\nSET DiseaseDescription = 'Cardiac Disease'\nwhere DiseaseDescription\
  \ like('%heart%')\n```\n\n### 练习 7\n\n任务：\n删除所有年龄大于 30 岁且患有耳朵病的记录。将所有患有肺病的患者的年龄设置为\
  \ 40。\n\n### 答案\n\n删除记录：\n```sql\nDelete From Patient\nwhere PatientAge > 30 AND\
  \ DiseaseDescription LIKE('%ear%')\n```\n\n更新记录：\n```sql\nUPDATE Patient\nset PatientAge\
  \ = 40\nwhere DiseaseDescription LIKE('%lung%')\n```\n\n# 10. 关系与连接查询\n\n到为止，我们一直在单表上执行所有查询。然而，现实中的数据库包含成百上千甚至万张表。这些表通过关系关联。我们看到过\
  \ `Student` 表是如何通过列 `DID` 与 `Department` 表关联的，该列存储了学生所属部门的 ID。这就是数据库关系的一种。\n\n##\
  \ 目录\n\n- 表关系\n  1. 一一关系\n  2. 一对多关系\n  3. 多对多关系\n- 连接语句\n  1. 内连接 (Inner Join)\n\
  \  2. 左连接 (Left Join)\n  3. 右连接 (Right Join)\n  4. 外连接 (Outer Join)\n- Group By\n\
  - Having\n\n## 1- 表关系\n\n数据库表可以通过三种关系类型之一相互关联。\n\n### 一一关系\n\n在两个表之间的“一一”关系中，第一个表中的每个记录在第二个表中恰恰有一个记录。第一个表的主键作为第二个表的外键存在，反之亦然。例如，`Employee`\
  \ 表和 `Pension` 表之间存在“一一”关系，因为每份养老金记录属于一名员工，而一名员工只能有一份养老金记录。在大多数情况下，“一一”关系通过将数据合并到单个列来消除。\n\
  \n\n\n\n外键（Foreign key）本质上是表中的一列，用于存储与其关联的表的主键。正如我们所看到的，`Student` 表有一个名为 `DID` 的列，它存储了学生所属部门的\
  \ ID。\n\n### 一对多关系\n\n在“一对多”关系中，第一张表中的一条记录对应第二张表中的多条记录。在“一对多”关系中，关系“多”的一侧的表以外键形式存储，而表的主键则位于关系“一”的一侧。“Department”（部门）表和“Student”（学生）表之间的关系就是“一对多”关系的完美范例，因为一个部门可以拥有多个学生。在“Student”表中，许多记录可以属于同一个部门。\n\
  \n### 多对多关系\n\n在“多对多”关系中，第一表中的一条记录对应第二张表中的多条记录；第二表中的一条记录也对应第一表中的多条记录。“Author”（作者）表和“Book”（书籍）表之间的关系是多对多”关系的良好示例。一本书可以由多个作者编写，而一个作者可以写多本书。在大多数情况下，“多对多”关系通过创建一个中间表被拆解为“一对多”关系，该中间表与两个实际表都具有“一对多”的关系。\n\
  \n## 2- Join 语句\n\nJoin 语句用于从相互关联的两个或多个表中选择列值。例如，假设有这样一个场景：你必须显示学生的姓名以及他们所属部门的名称。然而，“Student”表中并没有部门名称列；它只包含部门\
  \ ID，该 ID 用充指向 `Department` 表的外键。因此，我们需要某种机制从多个相互关联的表中选择列值。`JOIN` 查询可以帮助我们实现这一功能。\n\
  \n在执行 `JOIN` 查询之前，请在你的查询窗口中运行以下脚本。\n\n#### 脚本 1\n\n```sql\nCreate Database School\n\
  Use School\nGo\nCREATE TABLE Student\n  (StudID int PRIMARY KEY NOT NULL,\n    StudName\
  \ varchar(50) NOT NULL,\n    StudentAge int NULL,\n    StudentGender varchar(10)\
  \ NOT NULL,\n    DepID int NULL)\nCREATE TABLE Department\n  (DepID int PRIMARY\
  \ KEY NOT NULL,\n    DepName varchar(50) NOT NULL,\n    DepCapacity int NULL)\n\
  ALTER TABLE Student ADD CONSTRAINT StudDepRel FOREIGN KEY ( DepID) references Department(DepID)\n\
  INSERT INTO Department Values\n(1, 'English', 100),\n(2, 'Math', 80),\n(3, 'History',\
  \ 70),\n(4, 'French', 90),\n(5, 'Geography', 100),\n(6, 'Drawing', 150),\n(7, 'Architecture',\
  \ 120)\nINSERT INTO Student Values\n(1, 'Alice', 21, 'Male', 2),\n(2, 'Alfred',\
  \ 20, 'Male', 3),\n(3, 'Henry', 19, 'Male', 3),\n(4, 'Jacobs', 22, 'Male', 5),\n\
  (5, 'Bob', 20, 'Male', 4),\n(6, 'Shane', 22, 'Male', 4),\n(7, 'Linda', 24, 'Female',\
  \ 4),\n(8, 'Stacy', 20, 'Female', 1),\n(9, 'Wolfred', 21, 'Male', 2),\n(10, 'Sandy',\
