  \ 25, 'Male', 2),\n(16, 'Vic', 25, 'Male',null),\n(17, 'Nick', 25, 'Male',null)\n\
  ```\n\n上述脚本将创建一个新数据库 `School`，其中包含两个表：“Department”和“Student”。通过以下查询，在“Department”表和“Student”表之间定义了一种“一对多”关系：\n\
  \n```sql\nALTER TABLE Student ADD CONSTRAINT StudDepRel FOREIGN KEY ( DepID) references\
  \ Department(DepID)\n```\n\n上述查询表示，在 `Student` 表中将添加一个名为 `StudDepRel`（你可以使用任何名称）的外键约束，该约束将\
  \ `Student` 表的 `DepID` 列设置为外键，引用 `Department` 表的 `DepID` 列。\n\n运行脚本 1 后，你应该拥有包含以下数据的“Department”表和“Student”表：\n\
