  \ 用户运行的，且没有管理员权限。\n\n在确保浏览器正在 noroot 账户下运行后，观察所有打开的进程。\n\n## 有效地管理渗透测试\n\n当你执行渗透测试时，你将遇到一系列挑战，而且每项测试都将用于揭示网络或服务器可能存在的不同漏洞。在某些情况下，你可能不会忘记自己进行过某些测试，也可能无法跟踪已经完成的测试。\n\
  \n某些渗透测试非常复杂，所使用的方法必须适应目标的情况。在执行测试时，可以使用许多应用程序，其中包括键盘记录器和 `Wireshark` 等（仅列举几个）。每个应用程序都用于特定的测试。使用这些应用程序收集的数据将非常有用。在对数据包进行分析后，很容易识别出可能受影响的数据包工具。\n\
  \n`Kali Linux` 中存在许多工具，其中一些还可以在使用 `KeepNote` 桌面 wiki 和 `Zim` 作为存储库的同时进行一些快速记录。测试人员还能执行各种测试。在此过程中，他们将收集一些数据，这些数据也将有助于测试。测试有助于识别系统中发生的一些变化。可能会出现某些漏洞，应该立即封堵，以确保外部攻击者无法访问系统并获取敏感信息。作为一名测试人员，请确保你已经收集了截图形式的证据，并在向客户展示发现的同时，向他们解释网络中存在的某些漏洞。使用\
  \ `shutter` 等工具进行截图。你也可以使用 `CutyCapt`，它可以以多种格式保存图像。\n\n## 2. 后门攻击\n\n想象你正要去参加一场演唱会，但你没有票。你看到一排人拿着买好的票在等通过安检。你看到摄像头正对着大门，侧面还有几名额外的安保在守卫。你既没有票也没有钱买票。这时，你看到一条无人看守、阴暗、隐藏的小巷，那里没有摄像头，还有一个后门。通往场场的门。它们是解锁的，周围没有安保或摄像头。你会进那扇门吗？这就是后门攻击的理念。\n\
  \n后门是如何进入我们的电脑的呢？嗯，它们可能是制造商故意放置在那里的；这种设计是为了让他们能够方便地测试漏洞，并在程序测试时快速移动程序。\n\n后门也可以由恶意软件构建。经典的后门恶意软件是臭名昭著的\
  \ `Trojan`（木马）。木马会悄悄溜入我们的电脑，为使用恶意软件的人打开后门。恶意软件可以隐藏在任何东西中——免费文件转换器、PDF 文件、种子文件，或你下载到电脑的任何东西。当然，如果你下载的是原本需要付费产品的免费版，几率会更高（这是一个吸训的教训）。木马具有复制能力，在你发觉之前，你的电脑就已经感染了恶意软件，它为整条线的人进来免费看秀打开了后门。\n\
  \n后门不仅用于入侵你的系统以获取密码，还用于间谍活动、勒索软件以及各种其他恶意攻击。\n\n 如何保护自己免受后门攻击\n\n仔细选择应用程序、下载内容和插件；免费应用和插件是很棒的东西，但如果你对保持密码安全感兴趣，那么\
  \ YouTube 转 MP3 转换器、《游戏之王》最新一季的种子文件以及 Photoshop 副本可能不是最佳选择。Android 用户应该坚持使用 Google\
  \ Play 应用，Mac 用户应该坚持 Apple Store。同时跟踪应用权限，并确保在把生命交托给一个三级手电筒应用之前，至少要读一下。\n\n你还可以尝试：\n\
  \n*   **监控网络活动** - 使用防火墙并跟踪你的数据使用情况。任何数据流量激增都是后门活动的明确信号。\n*   **更改你的默认密码** - 当网站分配默认密码时，我们可能会发现自己太懒了，不愿花那所需的\
  \ 30 秒去修改它。动手吧。你可能没有用最先进的安全系统锁上后门，但至少你没有在挂着霓虹灯牌指向你密码的情况下让大门敞开。斑点可能是你的小狗，但它不能作为所有东西的密码。常见的抱怨是：“我会忘记它”。把它写下来。与大众认知相反，黑客不会进你家里搜寻那张纸，但他们会进你的电脑。哪种选择看起来更安全？\n\
  \n## 用于分布式拒绝服务（DDoS）攻击的僵尸电脑\n\n听起来非常酷，对吧？嗯，并不是。基本上，当黑客入侵电脑并控制它进行非法活动时，电脑就变成了僵尸电脑。最棒的部分（对黑客来说，不是对你来说）是你完全不知道这一切正在发生。你仍会正常使用它，尽管它可能会变慢。然后突然，你的电脑会开始发送与你无关的垃圾邮件或社交媒体帖子。DDoS\
  \ 攻击对黑客来说是太奇妙了，因为它们可以同时在多台电脑上运行，数量可以达到数百万。百万僵尸电脑会在互联网上盲目游荡，垃圾所有可见的一切，感染其他电脑。你的电脑仅被感染发送垃圾邮件的版本是轻级的。DDoS\
  \ 攻击还可以用于犯罪活动，这就是为什么预防它们至关重要。\n\n### 如何防御 DDoS\n\n大型企业需要更实实的 DDoS 防御，我们将详细介绍，但即使对于个人来说，防御的一半是预防。\n\
  \n理解警告信号——电脑变慢、连接不稳定或网站关闭，都是 DDoS 攻击正在发生的迹。\n\n你可以做什么？\n\n*   **拥有更多带宽** - 这确保你有足够的带宽来应对由恶意活动引起的大流量激增\n\
  *   **使用反 DDoS 硬件和软件模块** - 使用网络和 Web 应用程序防火墙保护你的服务器。硬件供应商可以通过监控不完整的连接以及将特定的软件模块添加到\
  \ Web 服务器软件中提供软件保护，从而提供 DDoS 防御。\n\n## 中间人攻击\n\n\n\n\n当你在线时，你的电脑会进行许多往返的交易。你点击一个链接，你的电脑会让世界各地的服务器知道你正在请求访问该网站。随后，服务器接收到信息并允许你访问所请求的网站。这一切都在纳秒内完成，我们并不会想太多。在你的电脑和网络服务器之间这几纳秒的时刻会被分配一个\
  \ `session ID`，该 ID 对你的电脑和网络服务器来说是唯一的且私有的。然而，黑客可以劫持这个会话并伪装成电脑，从而获取用户名和密码。他变成了一个中间人，通过劫持你的会话来获取信息。\n\
  \n## 如何保护自己免受中间人攻击\n\n高效的杀病毒软件和最新的软件在防止劫持方面非常有作用，但还有其他一些技巧可以帮助你防止成为受害者。\n\n- **使用虚拟专用网络**\
  \ - `VPN` 是一个私有的加密网络，充当私有通道，并严厉限制黑客对你信息的访问。`Express VPN` 还可以掩盖你的位置，让你无论在何处都能匿名浏览网页。\n\
  - **防火墙和渗透测试工具** - 使用主动防火墙和渗透测试工具保护你的网络。\n- **插件** - 仅使用来自信誉良好且评分高的插件。\n- **确保你的通信安全**\
  \ - 使用双重验证程序，并在有人从不同的计算机登录你的账户时接收警报。\n\n## Root 权限\n\nRoot 权限（Root access）是访问任何\
  \ `Unix`、`Linux` 以及类 `Linux` 系统特定命令的授权。这让黑客获得了对系统的完全控制权。Root 权限是通过设计良好的 `rootkit`\
  \ 软件授予的。一个设计良好的 `rootkit` 软件将访问一切并隐藏任何存在的的痕迹。这在所有 `Unix` 类系统中都是可能的，因为它们的设计采用了树形结构，其中所有的单元都分支出到一个根节点上。\n\
  \n原始的 `Unix` 操作系统设计于个人电脑出现之前的时代，当时所有电脑都通过非常简单的终端连接到一台大型主机上。在用户同时使用系统时，需要一台大型、强大的主机来分离和保护文件。\n\
  \n黑客通过获取 `rootkit` 的特权访问来获得 root 权限。访问可以通过密码授予；密码保护是限制非预期 root 权限的重要组成部分。`rootkit`\
  \ 还可以通过恶意下载自动安装。处理 `rootkit` 可能是困难且昂贵的，因此最好保持保护，并将 root 权限攻击的可能性降至最低。\n\n## 如何保护自己免受\
  \ root 权限攻击\n\n优质的杀病毒软件是所有电脑推荐的标准配置之一，无论是个人还是企业。优质的杀病毒软件有助于系统加固，使 `rootkits` 难以安装。\n\
  \n- **最小权限原则** - `PoLP` 仅赋予程序执行所需的最少权限，可以更好地防御可能发生的攻击。例如，在公司中，一个工作仅仅是回复邮件的用户应该只获得邮件的访问权限。如果该用户的电脑受到攻击，攻击无法扩散得远，因为这个人只有访问邮件的权限。如果该员工拥有\
  \ root 权限，攻击将扩散整个系统。\n- **禁用 root 登录** - 大多数 `Unix` 和 `Linux` 操作系统上的服务器都带有 root\
  \ 登录选项。使用 root 登录可以让获取 root 权限变得容易得多，如果你将其与弱密码结合，你就像在薄冰上行走。禁用 root 访问选项可以防止所有用户受到\
  \ root 登录的诱惑。\n- **阻止暴力破解** - 某些程序会为你拦截可疑的 IP 地址。它们会检测恶意 IP 并阻止攻击。虽然手动检测是最安全的方法，但可能是一个漫长的过程；设计用于拦截恶意\
  \ IP 的程序可以大幅节省时间。\n\n\n\n\n# 防止勒索软件 - 每 10 秒就有一个人成为勒索软件的受害者。如果你不知道你的网络中发生了什么，攻击者可能已经找到了进入网络的方法。\n\
  \n防止广告软件 - 广告软件会让你的计算机充斥着广告，并允许攻击者进入你的网络。\n\n防止间谍软件 - 攻击者可以监控你的活动，并利用这些信息来了解你的计算机和网络漏洞。\n\
  \n提升你的搜索引擎排名 - 在现代数字市场中，SEO 是关键。希望在搜索引擎上提高排的小企业如果想在财务上取得进展，必须接受 SEO 教育。`HTTPS`（安全超文本传输协议），即对用户名、密码和信息的加密，是关键\
  \ SEO 排名因素之一。\n\n防止财务损失并拯救你的初创公司 - 超过一半的小企业在网络攻击后倒闭。修复损坏所需的停机时间阻止任何新业务的开展，而数据泄露会导致你失去现有客户的信任。经营稳健的企业可以找到恢复的方法，但初创公司很少能能幸生。\n\
  \n## 4. 无线网络\n\n在谈论网络时，无线网络是最热门的话题之一。它让人们在可靠性上达到了新的高度，并允许他们在无需任何形式电缆或电线的情况下使用设备接入互联网。这一切之所以可能，仅仅是因为无线网络。在无线网络中，所有设备都连接到网络交换机或路由器，这通过无线电帮助设备与\
  \ `Web` 之间建立连接。所有信息和连接都是通过空气建立的。因此，它可以被视为一种移动形式的网络，你不再需要坐在某一个固定的地方上网。无线网络带有各种组件以及一些非常有趣的特性，这些将在本书中进一步讨论。那么，让我们从无线网络及其各种特性开始吧。\n\
  \n## 使用 Kali Linux 进行黑客攻击和渗透测试\n\n每一个组织公司都有某些弱点，这些弱点可能对组织产生危害。这些弱点还可能导致某些形式的攻击，随后可被用于操纵组织数据。在这种情况下，你唯一能做的并最终帮助你防止所有形式的黑客进入系统的，就是定期检查基础设施安全。你还需要确保基础设施内部不存在任何形式的漏洞。为了实现所有这些功能，渗透测试是最终可以帮助你的东西。它有助于检测系统内部的漏洞并将信息转发给组织管理员以修补漏洞。渗透测试始终在高度安全且真实的环境中进行，这有助于发现漏洞的真实形式并在修复系统的同时进行后续修复。\n\
  \n### 关于渗透测试的细节\n\n这是一个用于系统测试的过程，以发现或确保第三方是否可以渗透系统。伦理黑客经常与渗透测试混淆，因为两者的目的在某种程度上是相似，功能也大同小异。在渗透测试中，测试人员扫描系统以寻找任何形式的系统漏洞、缺陷、风险和恶意内容。你可以在在线环境、服务器甚至计算机系统中执行渗透测试。渗透测试具有一些终极的议程：加强系统安全，并保护组织结构免受潜在攻击和威胁的影响。\n\
  \n渗透测试具有绝对的法律性质，并与其他官方工作一起进行。当以正确完美的方式使用时，渗透测试具有创造奇迹的能力。如果你愿意，也可以将渗透测试考虑为伦理黑客的潜在组成部分。你需要在固定的间隔执行渗透测试，因为它具有提高能力的能力。它也有助于改进网络安全策略。为了从程序、系统或应用程序中钓出所有弱点，渗透测试人员会构建或创建各种形式的恶意内容。为了进行有效的测试，有害形式的内容会被传播到整个网络中进行漏洞测试。\n\
  \n渗透测试所使用的技术可能无法成功处理所有的安全问题，但它可以帮助减少系统遭受可能攻击的概率。渗透测试确保组织或公司绝对免受所有形式的威胁和漏洞，并最终有助于提供来自网络形式攻击的安全保障。它还确保组织的防御系统运行正常，并且足以公司或组织防止可能的攻击和威胁。不仅如此，它还指示了组织为了防御系统受攻击和漏洞需要更改的安全措施。所有关于渗透测试的报告都会交给系统管理员。\n\
  \n## Metasploit\n\nMetasploit 不过是一个用于渗透测试的框架，它实际上让黑客攻击的概念变得更加简单、更容易。它被大多数攻击者和安全防御者视为重要的工具形式。你所做的只需将\
  \ Metasploit 指向目标，选择任何你喜欢的漏洞（exploit），选择你想投放的载荷（payload），然后按回车即可。然而，它的本质上并不随意，因此你需要从头开始。在黄金时代，渗透测试的概念带有大量的重复性劳动，而这些现在正通过使用\
  \ Metasploit 实现自动化。\n\n### 你需要哪些东西？收集信息、获取访问、维持持久化还是规避所有形式的检测？Metasploit 可以被视为黑客的瑞士军刀，如果你想选择信息安全作为你的未来职业，那么你就需要详细了解这个框架。Metasploit\
  \ 框架的核心是免费的，并且预装在 `Kali Linux`软件中。\n\n### 如何使用 Metasploit？\n\nMetasploit 可以无缝地与\
  \ `SNMP` 扫描、`Nmap` 以及 Windows 补丁枚举等其他工具集成。它还带有一个指向 Tenable 漏洞扫描器 `Nessus` 的桥接。你能想到的大多数侦察工具都可以与\
  \ Metasploit 集成，从而使得在安全盾中找到最可能的切入点成为可能。\n\n\n\n\n\n大多数黑客都在寻找 shell（外），在攻击基于 Windows\
  \ 的系统时，一个合适的载荷（payload）充当 Meterpreter 的同时也作为一种内存形式的交互式 shell。Linux 拥有它自己的 shell\
  \ 码（shellcodes），这取决于所使用的漏洞利用程序。一旦进入目标机器，Metasploit 的工具箱就提供了一套完整的后渗透工具，其中也包括权限提升、哈希传递（pass\
  \ the hash）、屏幕截获、包嗅探、转向（pivoting）和键盘记录器工具。如果你需要，当目标机器由于某种原因重启时，你也可以轻松设置一个后后门。\n\n\
  Metasploit 每年都会加载越来越多的功能，以及一个用于识别二进制文件中潜在安全漏洞的模糊器（fuzzer），以及长长的辅助性模块列表。我们到目前为止讨论的只是使用\
  \ Metasploit 可以做的事情的高级愿景。整个框架本质上是模块化的，可以轻松扩展，并且拥有活跃的社区支持。如果它无法满足你的需求，你可以轻松对其进行调整以满足你的要求。\n\
  \n# 如何学习 Metasploit？\n\n你可以找到各种廉价或免费的资源来学习 Metasploit。开始 Metasploit 的最好方法是下载 Kali\
  \ Linux，然后安装它并配合虚拟机来练习目标。维护 Kali Linux 并运行 OSCP 认证的组织 Offensive Security 提供了一门包含\
  \ Metasploit 培训的免费课程，名为 Metasploit Unleashed。\n\n# 在哪里下载 Metasploit？\n\nMetasploit\
  \ 可以随黑客软件 Kali Linux 一起找到。但是，如果你需要，也可以从 Metasploit 的官方网站单独下载。Metasploit 可用于基于 Windows\
  \ 和 `nix` 的系统。你可以在 GitHub 上找到 Metasploit Framework 的源代码。Metasploit 还以各种形式存在，你可以在互联网上轻松找到。\n\
  \n# 数据存储 (Datastore)\n\n数据存储可以认为是 Metasploit Framework 的核心元素。它无非包含若干命名值的表，允许用户轻松配置\
  \ Metasploit 内部的组件行为。数据存储允许接口配置任何设置、用于定义参数的漏洞程序以及用于补丁操作码（opcodes）的载荷。它还允许 Metasploit\
  \ Framework 在模块选项之间进行内部传递。你可以找到两种数据存储：使用 `setg` 定义的全局数据存储（Global datastore）和使用 `set`\
  \ 在模块级定义的模块数据存储（Module datastore）。\n\n# SQL 注入与 Wi-Fi 破解\n\n提到网络攻击时，最广泛使用的攻击形式之一是\
  \ SQL 注入攻击。在这种情况下，攻击者通过执行威胁或无效格式的 SQL 语句来执行攻击，这些语句用于 Web 应用程序的数据库服务器控制。它被用于在用户完全不知情的情况下修改、删除或添加数据库中的记录。这最终破坏了数据的完整性。避免或防止\
  \ SQL 注入可以采取的最重要步骤是输入验证。\n\n## SQL 注入及其类型\n\n今天你可以找到多种类型的 SQL 注入。让我们来看看。\n\n- **经典或带内\
  \ SQL 注入 (Classic or In-band SQL injection)**：\n    1. 基于错误（Error based）：攻击者利用数据库生成的错误来攻击数据库服务器。\n\
  \    2. 基于联合（Union based）：在此处，使用 `UNION` SQL 运算符来组合返回到 HTTP 响应的响应。\n- **推断或盲注 SQL\
  \ 注入 (Inferential or Blind SQL injection)**：\n    1. 基于布尔型（Based on Boolean）：它基于真或假的返回。\n\
  \    - 基于时间（Time based）：它发送 SQL 注入，强制数据库在响应之前处理。\n- **带外 SQL 注入 (Out of band SQL\
  \ injection)**：当攻击者无法使用相似的通道进行攻击和收集结果时发生这种情况。\n\n## 用于 SQL 注入的工具\n\n有各种工具用于执行 SQL\
  \ 注入。\n\n- **SQLMap**：该工具用于自动化的 SQL 注入，是一个帮助接管数据库的工具。\n- **jSQL Injection**：这是一个基于\
  \ Java 的 SQL 注入工具。\n- **Blind-SQL-BitShifting**：这是一个通过位移（BitShifting）进行盲 SQL 注入的工具。\n\
  - **BBQSQL**：这是一个盲注 SQL 注入利用工具。\n- **explo**：一种机器和人类可读的 Web 漏洞测试格式。\n- **Whitewidow**：这是一个用于检查\
  \ SQL 数据库漏洞的扫描工具。\n- **Leviathan**：它充当音频工具包。\n- **Blisqy**：用于利用 HTTP 标头中基于时间的 SQL\
  \ 注入。\n\n## SQL 注入检测工具\n\n一种名为 Spider testing tool 的工具被广泛用于通过 `POST` 或 `GET` 请求手动识别\
  \ SQL 注入漏洞。如果你能解决代码中的漏洞，就可以轻松防止 SQL 注入。你也可以借助 Web 漏洞扫描器的帮助，来识别代码中的所有缺陷并修复它们以防止 SQL\
  \ 注入。Web 应用程序或应用层中的防火墙也可以广泛用于防止任何形式的入侵。\n\n# Wi-Fi 破解\n\n在当今世界，Wi-Fi 或无线网络可以被视为用于网络连接的最优选介质。然而，由于其非常流行，无线网络也受到各种攻击的影响，并伴随着若干安全问题。如果攻击者获得了网络的完全访问权限，攻击者就可以从任何附近的位置嗅探数据包。攻击者利用嗅探工具发现\
  \ SSID，然后破解 Wi-Fi 或无线网络。成功破解后，攻击者可以监控所有连接到相同 SSID 的设备。如果你使用 WEP 认证，它可能会受到字典攻击。攻击者利用\
  \ RC4 加密算法来创建流密码，这非常容易破解。如果你正在使用 WPA 认证，它可能会遭受拒绝服务（DoS）以及字典攻击。\n\n## 破解 Wi-Fi 的工具\n\
  \n为了破解 WEP，攻击者使用各种工具，如 `WEPcrack`、`Aircrack`、`Kismet`、`WEPDecrypt` 等。为了破解 WPA，黑客使用\
  \ `Cain`、`Abel` 和 `CowPatty` 等工具。还有许多类型的工具通用于破解无线网络系统，如 `wireshark`、`Airsnort`、`Wiphisher`、`Netstumbler`\
  \ 等。攻击者现在能够通过无线网络系统破解手机平台。\n\n\n\n\n\n- **恶性孪生攻击（Evil Twin attack）**：在这种攻击中，黑客设置一个与公司附近的企业\
  \ AP 命名相同的虚假接入点。当公司的任何员工由于认为该接入点是真实的而与其连接时，该员工就会在不知情的情况下泄露真实接入点的所有身份验证详情。因此，黑客可以轻易破解整个连接。\n\
  - **信号干扰（Signal jamming）**：黑客可以通过干扰网络信号来轻易破坏网络连接。这是通过各种用于产生噪声的工具实现的。\n- **配置错误攻击（Misconfiguration\
  \ attack）**：当网络路由器使用默认配置、弱加密方式、弱身份凭据和算法进行设置时，攻击者可以轻松破解网络。\n- **蜜罐攻击（Honey spot attack）**：攻击者设置与任何公共\
  \ Wi-Fi 接入点 SSID 名称相同的虚假热点或接入点。当任何用户在不知情的情况下连接到该接入点时，黑客就可以轻松访问实际网络。\n\n# 如何执行有效的攻击\n\
  \n提到“黑客”这一术语时，并不意味着它总是是负面的。只有当你对黑背后的过程有清晰的认知时，你才能对黑客的整体流程有一个合理的理解。不仅你能够收集有关黑客过程的知识，还能让你的系统免受外部攻击的侵害。在大多数情况下，当攻击者试图访问组织或公司的服务器时，通常是使用\
  \ 5 个适当的步骤完成的。让我们来看看这些步骤。\n\n## 侦察（Reconnaissance）\n这可以被视为黑客过程中的第一步。在这个阶段，攻击者利用所有可用手段收集有关主要目标系统的各种形式的相关信息。相关信息集可能包括对目标的正确识别、服务器的\
  \ DNS 记录、目标所在的 IP 地址范围、网络以及其他各个方面。简单来说，攻击者试图收集各种信息，以及网站或服务器的联系方式。攻击者可以通过使用多种形式的搜索引擎（如\
  \ `maltego`），或者通过对目标系统进行研究，或者使用如 `HTTPTrack` 等各种工具下载完整网站以供后续阶段枚举。\n\n通过执行所有这些步骤，攻击者可以非常容易地确定组织内所有员工的，找到员工指定的职位及其电子邮件地址。\n\
  \n## 扫描（Scanning）\n在收集了关于目标的所有信息后，攻击者现在将开始扫描过程。在这个阶段，攻击者采用各种形式的工具，如拨号器、端口扫描器、漏洞扫描器、扫描仪和网络映射器，唯一目的是扫描目标网站或服务器数据。在这一步中，攻击者试图寻找所有实际上可以帮助执行成功攻击的信息，例如系统的\
  \ IP 地址、该服务器内的用户帐户和计算机名称。在黑客完成基础信息的扫描后，他们开始测试目标所在的网络，以寻找可能的攻击途径。他们可能还会使用诸如 `Kali\
  \ Linux` 的多种方法进行网络映射。\n\n黑客还会寻找任何自动邮件系统，通过该系统向目标公司的员工发送有关某些虚假查询，例如向公司人力资源部门发送关于职位查询的邮件。\n\
  \n## 获取访问权限（Access gaining）\n这是所有步骤中最重要的一步。在这个阶段，攻击者在黑客攻击第一、第二步收集的所有相关信息的帮助下，设计目标网络的蓝图。当黑客完成数据枚举以及系统扫描后，他们现在将移动到获取系统访问权限的步骤，这将基于收集的信息。\n\
  \n例如，攻击者可能会决定使用钓鱼攻击。攻击者总是尝试保持稳妥，并可能采用非常简单的钓鱼攻击来获取系统的访问访问。攻击者还可能从 IT 部门的壳渗透系统。\n\n\
  黑客通过使用公司的电子邮件地址使用钓鱼邮件。通过使用此钓鱼邮件 ID，攻击者将向技术人员发送各种邮件，这些邮件将包含某些形式的特殊程序以及用于收集登录密码和 ID\
  \ 信息的钓鱼网站。对于这一点，攻击者可以使用各种方法，如手机应用、网站邮箱或其他，然后要求员工使用他们的凭据登录新网站。\n\n当黑客使用这种方法时，他们已经在后台运行了一个特殊类型的程序，该程序被称为\
  \ `Social Engineering Toolkit`（社会工程工具包），用于向用户发送带有服务器地址的邮件。\n\n## 维持服务器的访问（Maintaining\
  \ access to the server）\n在攻击者获得目标服务器的访问后，他们将尝试每种可能的方法确保他们对服务器访问的安全，以便未来的攻击和利用。由于攻击者现在拥有服务器的完全访问权限，他可能还将服务器作为他启动其他几种形式攻击的基地。当攻击者获得整个系统的访问权限并拥有该系统时，这种系统被称为\
  \ `zombie system`（僵尸系统）。黑客可能还会通过创建一个新的管理员帐户来隐藏自己，通过他可以在无人不知的情况下轻松与系统混合。为了保持访问系统的安全，黑客会追踪所有长时间未使用的帐户，然后提升所有帐户的权限。\n\
  \n当黑客确保没有人察觉他在系统中的存在时，他开始对该服务器上的所有数据以及联系方式、消息、机密文件等进行备份，供将来使用。\n\n## 清除踪迹（Clearance\
  \ of tracks）\n在开始攻击之前，黑客会规划他们身份的整个足迹，以便他人无法追踪他们。攻击者从更改系统 `MAC` 地址开始，然后通过 `VPN` 运行整个系统，以便无人可以追踪他们的真实身份。\n\
  \n# 如何使用 Kali Linux 启动黑客\n\n在策划攻击时，要考虑最重要的因素是启动过程。在对目标进行攻击或渗透测试之前，它应该是首先的。作为攻击者，你必须花费大量时间在侦察上。在这个阶段，攻击者将能够定义、映射并探索存在的某些漏洞，并能够成功执行利用。启动过程有两种类型：被动和主动。\n\
  \n被动启动过程涉及对可用信息的分析。例如，某些信息可以通过搜索引擎在网上获取。这些信息可以进行分析。虽然攻击者可以利用这些信息，但无法将其追溯到他们身上。至于被动侦察，主要是确保目标无法察觉到即将到来的攻击。\n\
  \n被动侦察的主要实践和原则包括：\n\n- `OSINT`（开源情报）。\n- 如何获取用户信息。\n- 启动过程的基础知识。\n\n\n\n\n\n# 试点研究\n\
  \n试点研究是个人想要发起攻击时的第一步。该研究在确定目标后进行。在此阶段获得的信息在执行实际攻击时将大有用处。侦察可以确保他们提供了方向感，这种方向感在尝试查看网络或目标服务器中存在的某些漏洞时是必不可少的。\n\
  \n## 被动侦察\n\n被动式试点研究不涉及与目标进行物理交互，这意味着攻击者的 `IP` 地址不会被记录。例如，攻击者可能会搜索目标的 `IP` 地址。获取此类信息可能很困难；但也是完全可能的。目标也无法察觉到攻击者在计划攻击时正试图收集某些信息。\n\
  \n被动侦察将更多地关注业务内的业务活动以及组织内部的员工。互联网上可以轻易获取的信息被称为 `OSINT`（开源情报）。\n\n对于被动侦察，攻击者将以预期的方式与目标进行交互。例如，攻击者将访问攻击者的网站。然后他们将查看可用页面，并下载一些可用文档。这些交互始终是意料之中的，且不易被检测，目标可能不知道攻击即在眼前。\n\
  \n## 主动侦察\n\n主动侦察涉及通过对特定网络进行端口扫描，以及发送直接查询，这将触发系统警报，这意味着目标可以轻松捕获到攻击者的 `IP` 地址及其活动。目标获得的信息也可以用于逮捕攻击者。此外，这些信息还可以作为证据提交给法庭审判，证明攻击者正在计划某些恶意行为。对于主动式试点研究，攻击者应该考虑各种活动，以便隐藏自己的身份。\n\
  \n作为一名攻击者，在收集信息过程中你还应该遵循一些步骤。主要重点是用户账户数据。为了使试点研究有效，作为攻击者，你应该始终知道自己在寻找什么。此外，请确保你已经收集了所有需要的数据。虽然被动侦察的风险较低，但它限制了你能够收集的数据量。\n\
  \n# OSINT（开源情报）\n\n这是计划攻击的第一步。在这种情况下，攻击者应该尽可能利用现有的搜索引擎，首选 `Google`。有很多信息在协助攻击时可能大有用处。收集信息的过程相当复杂。\n\
  \n在本书中，我们仅提供概述，因为主要重点是如何使用 `Kali Linux` 进行黑客。核心亮点将提供一些适当的指导。攻击者收集的信息始终取决于他们的初始动机和计划攻击时的主要目标。例如，攻击者可能想要访问特定组织内的财务数据。他们可能需要的其他类型信息是员工姓名。大多数攻击者会更多关注担任高管的高级员工。这些员工包括\
  \ `CFO` 在内的其他高层人员。攻击者将专注于获取他们的用户名和相应的密码。在某些情况下，攻击者可能会尝试进行社会工程学。在这种情况下，他们必须补充所拥有的信息，以便看起来像是可信的人。之后，他们就可以轻松地请求所需的信息。\n\
  \n对于开源情报，攻击者将从查看目标的在线状态开始。他们将从观察社交媒体页面、博客和网站开始。公共财务记录在某些情况下也大有用处。最重要的信息是：\n\n* \
  \  办公室的地理位置。例如，可能有一些卫星办公室共享一些公司信息，但它们没有建立任何确保信息在办公室之间传输过程中安全的安全的措施。\n*   母公司和子公司的概述，这在处理通过\
  \ `M&A` 交易收购的新公司时尤为重要。与母公司相比，被收购公司的安全性较低。\n*   员工的联系方式和姓名。应该获取电话号码和电子邮件。\n*   寻找有关目标公司企业文化的线索，以便可能实施社会工程攻击。\n\
  *   业务合作伙伴也有权访问目标网络。\n*   正在使用的技术。例如，目标可能会发布一份关于如何采用软件的新闻稿，攻击者将继续查看供应商的网站，试图寻找漏洞报告。在发现一些漏洞后，他们就可以发起攻击。\n\
  \n攻击者在计划攻击时也可以使用的一些在线信息源包括：\n\n*   包括 `Google` 在内的搜索引擎。还有其他搜索引擎，如 `Bing`。只是我们已经习惯了\
  \ `Google`。在搜索过程中，你会发现这个过程是高度手化的。你可能需要输入公司名称以及其他相关细节。由于技术也取得了进步，有一些 `APIs` 可以用来自动化搜索引擎的搜索。一些有效的\
  \ `APIs` 包括 `Maltego`。\n\n还有其他来源，包括：\n\n*   财务和政府网站，因为它们提供了有关公司内部关键人物的信息以及一些支持性数据。\n\
  *   `Usenet` 新闻组。重点应放在你作为测试人员或攻击者所针对的员工所发布的帖子上。你也可以就不同形式的技术寻求一些帮助。\n*   `Jigsaw`\
  \ 和 `LinkedIn`；这些公司大有用处，因为它们提供了有关公司内员工的一些信息。\n*   缓存内容。它可以被包括 `Google` 在内的搜索引擎轻松检索。\n\
  *   国家以及使用的特定语言。\n*   员工和公司博客。\n*   如 `Facebook` 等社交媒体平台。\n*   可以查询服务器信息以及 `DNS`\
  \ 和路由的网站。这些网站包括 `myIPneighbors.com`。\n\n# 路由映射 DNS 侦察\n\n作为测试人员或攻击者，你必须确保已经识别了具有在线状态的目标。确保你已经获取了某些感兴趣项目的访问权限。然后你将继续识别目标的\
  \ `IP` 地址。`DNS` 侦察在识别域名和 `DNS` 信息时大有用处，这有助于定义一些 `IP` 地址和实际域名。攻击者与目标之间的路径也将将被识别。\n\
  \n\n\n\n这些信息在一些开放源中可以很容易获得。某些信息主要存在于 DNS 注册商处，它们被视为第三方。注册商可能会收集 IP 地址以及攻击者发起的某些数据请求。此类信息很少提供给将作为攻击受害者的特定目标。对于目标而言，他们可以轻松地监控\
  \ DNS 服务器日志。所需的信息也可以通过系统化的方法获取。\n\n## WHOIS\n\n第一步涉及研究 IP 地址，以识别出同样分配给目标网站的地址。随后，你将使用\
  \ `whois` 命令，它将允许你查询存储了某些用户信息的数据库。你获得的信息包括 IP 地址和域名。\n\n在提供物理地址、姓名、电子邮箱地址以及电话号码时，`whois`\
  \ 请求将大派用用场。在执行社会工程攻击时，此类信息非常重要。\n\n作为一名攻击者或测试人员，你可以使用 `whois` 命令执行以下活动：\n\n*   支持针对通过\
  \ `whois` 查询识别出的目标进行社会工程攻击。\n*   识别可以发起物理攻击的位置。\n*   进行一些研究，让你了解更多关于服务器上存在的域名。你也可以了解更多运行该服务器的用户数量。作为攻击者，你还会兴趣了解这些域名是否安全，以及你是否可以利用现有的漏洞获取访问权限，同时攻破目标服务器。\n\
  *   识别电话号码，因为在进行社会工程攻击时，你可能还需要发起拨号攻击。\n\n攻击将利用 DNS 服务器执行 DNS 侦察。\n\n在某些情况下，域名可能会到期，攻击者可能会尝试夺取该域名，同时创建一个仿冒网站，用于诱导那些认为自己正在进入原始网站的毫无防备的访问者。\n\
  \n为了确保数据得到相应的屏蔽，第三方的使用量有所增加。此外，在使用公共域名时，你无法访问如 `.gov` 和 `.mil` 等域名。上述域名属于军事和政府，这就是为什么它们经过了安全处理，防止其他方访问。当你向此类域名发送请求时，该请求会被记录。有许多在线列表也可以用于描述\
  \ IP 地址和域名。如果你想使用 `whois` 查询，下面的截图将为你针对某些数字防御（Digital Defense）域名运行查询时提供一些指导：\n\n\
  将返回一个 `whois` 命令记录，它将包含一些名称、地理信息以及联系信息，这些信息在辅助社会工程攻击时大派用用。还有许多网站也用于自动化 `whois` 查找。一些攻击者使用这些网站来插入一个介于他们和攻击者之间的步骤。执行查找的网站可能会记录请求者的\
  \ IP 地址。\n\n## 映射通目标的路径\n\n路由映射曾被用作一种诊断工具。该工具允许攻击者查看 IP 包从一个主机移动到另一个主机时遵循的路由。当在\
  \ IP 数据包中使用 `TTL`（存活时间）字段时，会从某一点到另一点触发 ICMP `TIME_EXCEEDED` 消息。该消息将从接收路由器发送，并有助于确定\
  \ `TTL` 字段中的值。数据包还会计算经过的路由数量和跳数。\n\n从攻击者或渗透测试人员的角度来看，`traceroute` 数据将有助于产生以下数据：\n\
  \n*   关于网络拓扑的提示。\n*   目标与攻击者之间存在的路径。\n*   识别用于控制网络访问的防火墙和其他设备。\n*   识别网络是否存在配置错误。\n\
  \n在 Kali Linux 中，你可以使用 `traceroute` 命令映射路由。如果你在使用 Windows，可以使用 `tracert` 命令。如果你在运行\
  \ Kali Linux 时恰启动了攻击，你会发现大多数跳数都被过滤了。例如，使用 Google 追踪某个目标的位置时，结果将如下所示：\n\n如果你在 Windows\
  \ 平台使用 `tracert` 运行相同的请求，你将看到：\n\n我们将获得完整的路径，并且注意到 Google 显示了一个略有不同的 IP 地址。还指示了负载均衡器。路径数据不同的主要原因是\
  \ `traceroute` 使用了 UDP 数据报文，而 Windows 的 `tracert` 将使用 ICMP 请求（具体为 ICMP 类型 8）。当你使用\
  \ Kali Linux 提供的工具完成 `traceroute` 时，还应该确保你使用了多种协议，以便在获取完整路径的同时，绕过一些执行数据包过滤的设备。\n\
  \n## 获取用户信息\n\n当攻击者或渗透测试人员成功收集到目标的用户名和电子邮箱地址时，他们就可以将其收集到系统中。最常用的工具是 Web 浏览器，你必须进行手动搜索。你需要搜索包括\
  \ Jigsaw 和 LinkedIn 在内的某些第三方网站。你也可以使用 Kali Linux 提供的工具来自动化搜索。\n\n## 6. 你的第一次攻击\n\
  \n对于第一次攻击，我们可以使用一个简单的示例，详细说明如何使用 Kali Linux 破解 WPA2 Wi-Fi 网络。\n\n\n\n\n-   确保你有一有一个无线适配器，并且它应该具备监听模式（monitor\
  \ mode）等功能。某些电脑也带有网卡，在这种情况下这些电脑是更优的。如果你使用的电脑没有网卡，请确保你已经购买。\n-   准备一个字典列表（wordlist），因为它在破解\
  \ WPA2 网络时派用场。\n-   你必须耐心，并留出足够的时间来处理整个过程。\n\n在确保你已遵循列出的所有要求后，你可以按照这些步骤操作，并将成功破解\
  \ WPA2 网络。本教程可能会有所帮助；尽管如此，你不应该没有授权的情况下破解 WPA2 网络。本教程对于执行安全审计和渗透测试的专业人员有用。在进行一些测试后，道德黑客能够出具详细报告，说明网络是否安全。如果存在漏洞，将给出一些建议。\n\
  \n### 第一步\n启动电脑并登录 `Kali Linux`。\n\n![Step 1](img/00013.jpeg)\n\n### 第二步\n确保你已经插入了无线适配器。当你以“实时模式（Live\
  \ Mode）”运行 Kali Linux 时，确保你也插入了无线适配器，此时设备菜单上会出现一个图标，如下所示：\n\n![image](img/00014.jpeg)\n\
  \n### 第三步\n确保你没有连接到任何无线网络。同时，打开终端并在其中输入 `airmon-ng` 命令。\n\n![Step 3](img/00015.jpeg)\n\
  \n`airmon-ng` 命令会列出所有支持监听模式的无线网卡。如果没有网卡，请确保你重新连接了网络适配器，并查询网卡是否支持监听模式。\n\n### 第四步\n\
  打开终端窗口并输入 `airmon-ng start` 命令。之后，输入你无线网卡的接口名称。在这种情况下，我们的网卡接口名称为 `wlan0`；因此，我们的命令应该是\
  \ `airmon-ng start wlan0`。\n\n![Step 4](img/00016.jpeg)\n\n如上面的截图所示，监听模式已经启用。新接口被命名为\
  \ `mon0`。\n\n### 第五步\n在监听接口中输入 `airodump-ng` 命令。将添加一个新的监听接口，命名为 `mon0`。\n\n![Step\
  \ 5](img/00017.jpeg)\n\n### 第六步\n`airodump` 命令确保你可以获取包含你所在范围内所有无线网络的列表。你也可以获取有关列出网络的重要信息。首先，确保你已经定位到要破解的网络。在识别出一个你感兴趣的网络后，你应该点击\
  \ `Ctrl + C`，整个过程将停止。确保你记录了目标网络的通道（channel）。\n\n### 第七步\n拷贝目标网络的 BSSID。\n\n![Step\
  \ 7](img/00018.jpeg)\n\n打开终端窗口输入此命令——`airodump-ng -c [channel] --bssid [bssid] -w\
  \ /root/Desktop/ [monitor interface]`\n\n确保你已将目标通道替换为网络中的实际通道。继续复制并粘贴目标网络的 BSSID，并将监听接口名称替换为\
  \ `mon0`，因为这是你监听接口的名字。`-w` 和文件路径将指定 `airodump` 保存拦截到的握手包（handshakes）的位置，以便你能够轻松破解\
  \ Wi-Fi 网络。在此实例，握手包将保存在桌面上。\n\n整个命令如下所示：\n\n```\nairodump-ng -c 10 --bssid 00:14:BF:E0:E8:D5\
  \ -w /root/Desktop/ mon0\n```\n\n![image](img/00019.jpeg)\n\n按下回车键启动命令。\n\n### 第八步\n\
  使用 `airodump` 命令来监控网络。该命令还允许你捕获目标网络的特定信息。在此实例中，我们必须等待设备连接网络。路由器通常会发送四次握手（four-way\
  \ handshakes），攻击者可以捕获它们并最终破解 Wi-Fi 密码。桌面上会出现四个文件。握手包存在于桌面上的一个文件夹中，你应该确保不删除桌面上的任何文件夹。\n\
  \n有些人通常很没耐心，这意味着他们可能不愿意等待设备连接。如果你不想等待，应该使用 Aircrack 工具包中的工具之一。你可以使用的一些工具包括 `aireplay-ng`；如果你想加速整个过程，这个工具会非常有用。该工具确保设备已重新连接；首先，通常会发送一些去认证包（deauthentication\
  \ packets），它们将触发重新连接。这些数据包将确保网络设备认为它必须重新连接，这意味着作为攻击者，你不需要等待长时间。\n\n使用此工具时，你必须确保有人连接到目标网络。同时，在等待特定客户端出现时，密切关注\
  \ `airodump-ng` 工具。过程可能需要更长时间。\n\n在下方的图中，客户端已连接到网络，这意味着 Wi-Fi 破解过程可以继续了。\n\n###\
  \ 第九步\n确保 `airodump-ng` 正在运行。黑客应该打开另一个终端窗口输入此命令：\n\n如果你使用默认模式，你会注意到有一个快捷方式为 `-0`。后面有一个数字\
  \ 2，它代表你默认可以发送的数据包数量。`--bssid` 指路由器的 BSSID，将被替换为 `00:14:BF:E0:E8:D5`。`-c` 指客户端的\
  \ BSSID，它最终会被替换。完整命令如下：\n\n```\naireplay-ng -0 2 --bssid 00:14:BF:E0:E8:D5\n```\n\
  \n### 第十步\n当你按下回车时，`aireplay-ng` 命令将发送数据包。如果你离目标足够近，就可以促进去认证过程。`airodump` 屏幕上也会一些消息。\n\
  \n![image](img/00020.gif)\n\n上面的截图显示握手包已被捕获。获取密码后，应关闭 `aireplay-ng` 终端。然后你应该点击 `Ctrl\
  \ + C` 并确保 `airodump-ng` 仍在运行。工具将停止并监控网络。在需要更多信息的情况下，你不应该关闭终端窗口。\n\n在各种情况下，你可能无法收到“握手消息（handshake\
  \ message）”。这意味着在发送数据包时存在某些问题。过程中可能会出现挑战。确保你移动得更近。有些设备可能无法自动重新连接，这意味着当你尝试重新连接时，去认证过程可能会失败。确保你尝试了新设备，或者在等待有人重新连接到目标网络时让\
  \ `airodump` 继续运行。\n\n\n\n\n\n黑客过程中的所有步骤都是外部的，这是攻击者破解 WPA2 网络的最后一个环节。桌面上位于四个文件，它们是在获取握包消息期间生成的。在这种情况下，最重要的文件是带有\
  \ `.cap` 命令的那一个。打开新终端并输入此命令：\n\n随后 `Aircrack` 工具将使用 `-a` 方法。当你想要破解握包时，该工具非常有用。它有一个\
  \ `-b` 参数，代表 `BSSID`，它将把路由器的 `BSSID` 替换为目标路由器的 `BSSID`。在此情况下，`BSSID` 为 `00:14:BF:E0:E8:D5`。有一个\
  \ `-w` 参数，代表字典文件（wordlist）。它应该被替换为字典文件的路径，你需要先下载它。在根目录下有一个名为 `wpa.txt` 的字典文件。`.cap`\
  \ 文件位于 `/root/Desktop/*cap`。密码也包含在该文件夹中。\n\n这是完整的命令：\n\n![00076.gif](img/00021.gif)\n\
  \n![image](img/00022.jpeg)\n\n按下回车键。\n\n### 第 12 步\n\n启动 `Aircrack-ng` 将破解用于访问 WPA2\
  \ 网络的密码。只有当密码存在于编译的字典文件中时，你才能破解它。在某些情况下，如果字典文件中没有精确密码，你可能无法破解网络。字典文件包含了许多可能用于访问\
  \ WPA2 目标网络的密码。尝试失败后，请编译一个新的字典文件。如果你无法破解网络，这表明该网络免受外部攻击者的侵害。即使攻击者发起暴力破解攻击，也无法攻击一个安全的\
  \ WPA2 网络。在某些情况下，WPA2 破解过程可能会花费更长时间。确保你已经考虑了字典的长度。如果正确密码出现在字典文件中，`Aircrack-ng` 的输出应该所示：\n\
  \n![image](img/00023.jpeg)\n\n在这种情况下，网络的密码是 `notsecure`。你可以注意到该密码存在于黑客过程中使用的字典文件中。在某些情况下，你不需要太费力就能获得密码。作为攻击者，你还可以更改网络密码，通过这种方式判断网络是否真的安全。当你更改密码时，一切都将对你有利。访问网络后，你还能获取某些敏感信息的权限。\n\
  \n## 7. 道德黑客与渗透测试\n\n大多数人存在一个误解，他们认为道德黑客和渗透测试是同一件事。然而，在实际上并非如此。不仅是不熟悉网络安全世界的普通人，甚至网络安全专家有时也会混淆这两者的概念。尽管它们都属于攻击安全（offensive\
  \ security）的同一范畴，但两者之间存在一条微妙的界限。攻击安全由各种对象组成，例如渗透测试、软件逆向工程、社会工程学、道德黑客等。\n\n在网络安全领域，道德黑客和渗透测试这两项都至关重要。让我们来看看这两个组件的某些方面。\n\
  \n### 渗透测试\n\n渗透测试顾如其名，可以理解为测试是否可能渗透的过程。它寻找系统内部各种漏洞、风险、恶意内容和缺陷。这里的系统可以是计算机系统、在线服务器或网络。执行这一过程的目的是加强组织的安全系统，唯一目的是防御\
  \ IT 基础设施。这在本质上是正式的程序，如果使用得当，可以被非常有帮助且完全不是破坏性的尝试。渗透测试是道德黑客不可或缺的一部分，其重点在于尝试渗透信息系统。\n\
  \n由于渗透测试有助于快速改进整体网络安全策略，因此需要定期进行渗透测试。构建多种形式的恶意内容是为了发现应用程序、程序或系统内部的弱点。恶意软件在整个网络中传播以测试漏洞。渗透测试可能无法解决所有形式的安全问题，但它实际上可以减少任何攻击发生的概率。渗透测试有助于确定一个组织或公司是否容易受到任何形式的网络攻击的影响，防御措施是否到位，以及哪些安全措施需要更改以降低系统脆弱性。\n\
  \n渗透测试可以很容易地显示某一时刻 IT 系统架构的优点和缺点。渗透测试过程绝非随意的过程。它包含了大量的规划、获得管理层对渗透的许可，并在不影响组织正常工作流的情况下启动该过程。\n\
  \n### 道德黑客\n\n道德黑客的角色与渗透测试员有些相似。但道德黑客的过程伴随着各种形式的多样化职责。道德黑客涵盖了黑客方法以及与网络攻击相关的所有形式。道德黑客过程的目标是识别漏洞，并在任何攻击者利用这些信息执行网络攻击之前修复所有漏洞。道德黑客之所以被称为“道德”的，是因为所有必要的功能只有在获得授权的必要许可后才会执行。\n\
  \n### 渗透测试 VS 道德黑客\n\n尽管渗透测试和道德黑客的功能看起来相似，但它们在许多方面都是相互不同的。渗透测试的主要目标是寻找特定环境内的漏洞。在道德黑客案例中，它使用各种类型的攻击来发现安全缺陷。渗透测试涉及特定区域的安全，而道德黑客本身是一个综合术语，渗透测试是道德黑客的一个功能。要成为一名优秀的渗透员，需要在道德黑客领域拥有经验。道德黑客是迈向渗透测试的一步。除非某人正确掌握了方法，否则他们无法进行渗透测试。\n\
  \n\n\n渗透测试不需要编写非常详细的报告。然而，对于一个道德黑客来说，一个道德黑客需要成为专家级的报告作家。与道德黑客相比，渗透测试的文档工作相对较少。在道德黑客的情况下，需要带有法律协议的详细文档。渗透测试消耗的时间非常少，而道德黑客则不然。它需要更多的时间和精力。对于渗透测试，不需要获得整个系统的访问权限。在道德黑客的情况下，黑客需要目标系统的完全访问权限。\n\
  \n## 总结\n\n随着渗透测试技术被用于保护系统不受各种形式的威胁，攻击者也在应对，并在目标应用程序中发现了新的漏洞点。因此，可以说，某些类型的渗透测试完全不足以保护系统安全。道德黑客则不同，因为它能有效地发现漏洞并对其进行报告以便进一步改进。在许多案例中发现，当系统中发现一个新漏洞时，攻击者在测试后立即入侵了系统。然而，这并不渗透测试完全没有用。它不能阻止攻击的发生，但可以帮助系统的改进。\n\
  \n## 8. 解决级别问题\n\n由于这非常简单，它只是为了让你理解在进入下一个级别之前需要的一些概念。我将利用这个空间进行解释。我们在 `level0` 的主要目标（与其他所有级别一样）是获取下一个级别的密码。这可以通过运行\
  \ `bin` 目录下的 `pass` 命令来实现。尝试连接到 HackersLab 并输入 `pass`。会出现一个屏幕并向你显示 `level0` 的密码。所以，为了获取\
  \ `level1` 的密码，我必须以这个用户的身份登录吗？这如何可能？\n\n还有另一种方法。在每个级别中，都有一个文件的 `UID`（用户标识符）比你的高，`GID`（组标识符）更高。任务是：如何探索这个文件，以便通过它执行\
  \ `pass` 命令并获取下一个密码？现在，如果我们通过它执行操作，而它具有更高的用户权限（`UID`），我们的系统将“认为”我们是另一个用户。困难吗？让我们来看一个例子。\n\
  \n假设我们连接到 HackersLab。让我们创建一个虚拟的 `level0` 作为测试：\n```\n8 Login: level0\nPassword:\
  \ [level0 @ level0]\n$ whoami\n[level0 @ level0] $ id\nUID = 2000 GID = 2000 OTHER\
  \ ANY = 9999\n```\n到目前为止我们实现了什么？我们成功登录了 `level0`，输入了 `whoami` 命令，它告诉我们用户名是 `level0`，以及\
  \ `id` 命令为我们提供了用户 ID（`UID`）、组 ID（`GID`）以及我们不需要的其他信息。\n\n现在我将让系统搜索 `UID` 优于我们的文件。例如，如果我们的\
  \ `UID` 是 `2000`，那么我想搜索 `UID` 为 `2001` (`level1`）的文件。\n```\n[level0 @ level0] $\
  \ find / -uid 2001 –gid 2000/ tmp / suzuki: Permission Denied/ bin / joy: Permission\
  \ Denied/ etc / test/ usr / local / yu: Permission Denied/ var / shenmue: Permission\
  \ Denied.\n```\n我要求系统向我显示所有允许的用户为 `level1`（`UID` 为 `2001`）且组为 `level0`（`GID` 为 `2000`）的文件。为什么要寻找\
  \ `GID`？很简单。该文件需要属于我们的组，这样我们才能操纵它。这很快就会变得清晰。我们只找到了 `/etc/test` 文件。其他显示 `Permission\
  \ Denied`（拒绝访问）的都是垃圾。\n\n那么，如何列出我们想要的文件？\n```\n[level0 @ level0] $ find / -uid 2001\
  \ –gid 2000 2> / dev / null\n/etc / test\n```\n重新执行命令，我包含了字符串 `2> / dev/ null`，我告诉系统“任何不需要的\
  \ ( 2 ) 发送到 ( > ) 垃圾 ( / dev/ null )”。因此，我们只得到了预期的结果。现在，让我们列出文件信息。\n```\n[level0\
  \ @ level0] $ ls –la /etc/test\n-rwx — x— 1 level1 level0 10876 Mar 8 06:24 test\n\
  ```\n从信息中，我们确认了我们想要的内容。这是一个由用户 `level1` 创建的文件，属于组 `level0`。创建它的用户拥有所有用户的权限，组用户被允许仅执行，而其他人甚至执行的权限都没有。出于好奇，我可以使用用户名而不是\
  \ `UID` 来浏览文件吗？当然可以！\n\n让我们检查：尝试 `id` 命令。噢！一个惊喜！出现了一个带有 `EUID` 数字 `2001` (`level1`)\
  \ 的新 ID。这个 `EUID` 之前并不存在……它是程序给我们的。然后我们将尝试 `whoami` 命令，以消除疑虑。没错！！该命令告诉我们是 `level1`（或至少我们拥有\
  \ `level1` 的权限）。\n\n\n\n\n\n# 逐步登录 HackersLab\n\n使用 level1 的密码登录。要做的第一件事（已经是经典操作）是输入命令\
  \ `find / -userlevel2 -group level1 2> /dev/null` 来寻找我们的目标文件。我们找到了两个：`/proc/20840`\
  \ 和 `/usr/bin/amos`。但等一下……`Amos` 是一个先知的名字（哦，哦，哦……我们发现为什么这个关卡有这个提示了）。\n\n让我们检查一下\
  \ `amos` 文件：通过从大师们（系统信息）那里获得的信息，我们发现再次拥有执行该文件的组权限（`x`）。我们成功地在不需要前面加 `./`（斜杠）的情况下运行了它，这意味着它在\
  \ `PATH` 中。在我们的学习课程模拟中，是如何发生的呢？程序询问我们任何文件的 `PATH`。我们输入了当前正在运行的文件（如前所述，可以是任何文件）。它告诉我们它是它是可执行的。\n\
  \n回到这一级的问题，我们看到 Matthew 必须使用 `file` 命令来制作 `amos` 程序。那么，程序是在运行外部文件归吗？你呢？让我们试试看！是的！！示例运行了外部文件。让我们尝试运行它并建立一个管道来尝试获取你的权限。所以让我们按照我们学习的方式来吧：我们输入\
  \ `/usr/bin/amos` 的信息、`|`（管道）和 `pass` 命令。这样，程序将拥有文件 `/usr/bin/amos | pass`。结果是？`level2`\
  \ 的密码。又赢了一关。\n\n# Level 2 问题\n\nKevin 是一个 BBS 程序员，想在你的首页上添加一个提醒，这样你的成员每次登录都能看到你的帖子。遗憾的是，消息有多页，成员们无法阅读。结果，他日没夜地思考，试图寻找解决方案。最后，他考虑使用\
  \ `more` 命令来解决你的问题。然而，由于安全问题，这种方法是有风险的。提示：话如此！\n\n**登录：** `level2`  \n**密码：** `DoItYourself`\
  \  \n**学习：** Shell 与子 Shell（Shells and Subshells）\n\n系统的 shell 无非是执行输入的 shell 解释器命令。它是文本模式屏幕，你可以在其中通过系统命令进行交互。例如，在\
  \ DOS 系统中，命令解释器是 `command.com` 文件。在 Windows NT 兼容系统上，它是 `cmd.exe`。你可以在 NT 上通过“开始/运行”并输入\
  \ `cmd` 来证明这一点。一个命令窗口将会打开。\n\n# Level 3 问题\n\n**登录：** `level3`  \n**密码：** `hackerproof`\
  \  \n**学习：** PATH 和 IFS HackersLab\n\n第 3 和第 4 级几乎一样，在这两个中你需要理解 `PATH`、`IFS` 和 `export`\
  \ 的概念。挑战初期的这些级别非常有趣且困难（稍后你会发现 `level5` 和 `level6` 要简单得多）。虽然书重点是如何破解 Linux 系统，但我将简要解释\
  \ `PATH`。学习这个术语有助于理解其他内容。首先，让我们来看概念：\n\n`PATH` 是目录的绝对路径，系统始终会在那里查找要运行的文件。例如，在系统的根目录下输入命令\
  \ `ls`、`dir`、`date` 或其他命令，操作系统将通过这些命令搜索目录 `PATH` 并执行它们。如果没有，它将返回错误。复杂吗？没那样。\n\n\
  让我们来看一个简单的例子。在上面的 DOS 示例中，我列出了名为 `test director` 目录下的数据。我发现有一个名为 `app.exe` 的程序。然后我尝试从根目录运行\
  \ `app`。我收到一个错误说命令未识别（未找到）。因此，我修改了 `PATH` 并指向 app 所在的 test director。只需使用 `PATH =\
  \ C:\\directoriotest`。我再次尝试运行 app，哇！它正常运行了。当然，现在命令位于系统的搜索 `PATH` 内部了。好了，这和黑客挑战有什么关系？关系。想象一个\
  \ Windows 应用程序外部调用 `NET.EXE`（控制 NetBIOS 协议的命令，可能连接共享、发送消息、启用用户等）。如果我创建另一个同名的文件（`NET.EXE`），将其放在\
  \ test director 中并设置 `PATH`，该程序会发生什么？`NET` 将由该程序正常运行，但我的 `NET` 可能是一个像后门那样的入侵程序（或木马病毒）。\n\
  \n回到 Linux，假设 Steven 的程序简单地写了 `date`。这很简单，只需在目录（任你选择哪一个）中创建一个伪版本，将 `PATH` 移动到那里并\
  \ `export` 它（将其发回系统）。\n\n但我们有一个问题……如果他的程序直接运行 `/bin/date` 而不只是 `date` 呢？即使我们修改了\
  \ `PATH`，程序也会直接在目录运行……现在呢？谁能帮我们？无畏的 `IFS`。`IFS`（内部字段分隔符）有一个有趣的特性——你可以给它一个 ASCII\
  \ 字符，每当系统中输入命令时，该字符就会被分隔。这个过程有一些非常有趣的用途：在我们的问题中，Steven 程序在系统上直接运行 `/bin/date`。如果我们这样配置\
  \ `IFS`：`export IFS = /`（一行完成配置并导出到系统，节省时间），这意味着什么？程序不是运行 `/bin/date`，而是运行 `bin\
  \ date`（两个独立的命令），因为 `IFS` 删除了斜杠。嗯，如果它运行 `date`，它就会落在我们糟糕的 `PATH` 中，我们就能破解系统……如果你还有问题，现在将在实践部分解决。\n\
  \n重复（已经开始变得无聊了）以 `level3` 连接 HackersLab 并寻找 Steven 创建的文件的过程，我们找到了 `today`（奇怪的是它位于\
  \ `/usr/man/en/`，那是手册的葡萄牙语版本）。我们列出了文件（常规操作）并看到它有执行权限。然后检查 amos 文件：通过从大师们那里获得的信息，我们发现再次拥有执行该文件的组权限（`x`）。我们成功地在不需要前面加\
  \ `./`（斜杠）的情况下运行了它，这意味着它在 `PATH` 中。在我们的学习课程模拟中，是如何发生的呢？程序询问我们任何文件的 `PATH`。它告诉我们它是可执行的。\n\
  \n进入文件目录并输入 `pwd` 命令只需确认（显示当前目录）。尝试运行 `./today`，这样它返回日期。\n\n# Level 4 问题\n\n**登录：**\
  \ `level4`  \n**密码：** `AreReady?`  \n**学习：** 更多推断与更多 PATH\n\n第 4 级与第 3 级非常相似。我在过去级别展示的内容都适用于这里。但有一个巨大的区别。我是怎么知道的？根据问题，Kevin\
  \ 在你的游戏中只添加了一行代码。这行代码可以是任何内容……屏幕上的消息、注释，或者执行的外部命令。你唯一的方法是：运行游戏并尝试识别它正在运行的某些命令（它是列出目录？显示日期？时间？）。有一些像\
  \ `strace` 之类的命令可以用来尝试找出外部引用。但最简单的方法是运行游戏并发现。我提到的巨大区别是：在第 3 级中，你知道哪个应该冒充 `date`\
  \ 命令，但在这一级，除了知道在使用哪个命令外，你不确定这是否是正确的流程。只有通过分析你才知道。让我们逐步检查流程应该是怎样的。\n\n以 `level4`\
  \ 连接 HackersLab 并寻找带有 level5 用户任务的文件。我们找到了我们的游戏，木马文件，它位于 `/usr/games` 目录。让我们运行它看看发生什么。游戏提示你选择想要玩的速度。那个游戏有点像俄罗斯。我们在这里看到的一个有趣点是，游戏在开始时清理了屏幕。而且在你玩的时候它也多次清理屏幕。那么，是清理屏幕的\
  \ `clear` 命令在外部运行吗？\n\n\n\n\n再次，我们将 `PATH` 导出到 `/home/level4/tmp` 目录（我们唯一可以记录的目录）。我们还向系统导出了\
  \ `IFS`。我们在记录目录中创建了一个名为 `clear` 的文件，并在其中使用了 `/bin/pass` 命令。如果这些操作没问题，那么当我们运行 `trojka`\
  \ 时，它的效果和上一关一样，但现在由于程序已经执行，我们清理掉了那个坏的。所以……静静，神圣夜！向第 5 关进发！\n\n# 第 5 关问题\n\n登录：`level5`\
  \ 密码：`Silent night, holy night!` 学习：二进制文件中的字符串（Strings in Binaries）。\n\n首先，什么是字符串？正如大学里教的那样，它是字符分组。在普通语言中，它是一个单词、句子或文本。每当我们编写程序时，都需要使用字符串来相互通信以及与用户通信。以下是不同语言中面向用户的两个字符串示例：\n\
  Pascal `writeln ('Enter a number');`\nC++ `cout >> \"Enter a number \\n\";`\n\n\
  字符串也用于对单词和短语进行简单的比较。\n\n我知道所有程序员都厌倦了看到这些，但对于非程序员来说，基础的解释很重要，以免让他们迷失方向。一个比较示例：\n\
  ```pascal\nTest Program; varx : string; beginwriteln (' Enter your password: ');\
  \ readln ( x ); if x = ' binladen ' then beginwriteln (' Correct Password '); endelse\
  \ beginwriteln (' Incorrect password '); end; end;\n```\n\n在这个 Pascal 小程序中，我首先向用户发送一段请求密码的文本。我读取包含密码的变量\
  \ `x`，然后进行比较：如果字符串（密码）与 `binladen` 相同，我就写下密码正确，否则输入 `Incorrect password`。这对任何人来说都不是什么新奇。在这里，我们感兴趣的是编译后的程序而不是源代码。当我们在编译程序中不使用加密功能或可执行文件时，它会把大部分字符串显示在屏幕上。你可以使用十六进制编辑器看到这一点。但有一种更简单的方法：`strings`\
  \ 命令，它可以扫描任何二进制文件（不仅仅是可执行文件）并向你显示找到字符串。我将在 DOS 中编译之前显示的代码，并逐步演示问题。我已经编写了程序并测试了它。\n\
  \n我输入 `saddamhussein` 作为密码。它返回密码错误，所以我测试了默认密码 `binladen`。程序返回了正确的密码。不久后，我将输入 `strings\
  \ progteste.exe` 来尝试寻找字符串 `binladen`。\n\n哎呀……快速查看查看 `strings` 命令生成的结果，我们发现了四行有趣的内容：`Type\
  \ your password: bin Laden`。`Correct password` 等。这样我们就可以在不使用任何加密功能或对任何可执行文件进行压缩的情况下，推导出简单的密码。我们在\
  \ DOS 中看到了它，但 Linux 呢？所以，让我们一步步来。\n\n我们以 `level5` 的身份连接到 HackersLab。我们正在寻找目标文件，即问题中提到的新的修改后门位置。我们找到了\
  \ `/lib/security/pam_auth.so`（目录 `/lib/security` 下的 `pam_auth.so` 文件）。我列出了你的信息，我们再次被允许执行操作。那么让我们开始吧。\n\
  \n我们运行了 `./pam_auth.so`，它要求输入密码，我们输入了任意单词字符串，它返回 `Password incorrect`。让我们先检查你的目录是否有更多趣的文件。有很多文件。我们会浪费大量时间在每个文件中尝试\
  \ `strings` 命令。所以，我们将尝试主文件 `pam_auth.so`。我们会找到一些有趣的东西吗？我们发现了几个可能的密码：`abcd1234`、`loveyou!`、以及\
  \ `flr1234`，我们必须逐一尝试这些作为 `level6` 的密码。还有两句可能作为密码的短语：`what the hell are you thinking?`\
  \ 和 `Best of The Best Hackerslab`。嗯，这个 `Best of TheBest Hackerslab` 非常可疑。让我们先试一下。\n\
  \n`Best of The Best Hackerslab` 是正确的密码。直接进入最高层级。如果你愿意，与其直接登录 `level6` 并输入密码，不如使用后门上的正确密码让\
  \ John 再次愤怒！\n\n# 第 6 关问题\n\n登录：`level6` 密码：`Best of The Best Hackerslab` 学习：端口扫描（Port\
  \ Scan）。\n\n这是 HackersLab 最容易的关卡之一。它适合一个非常放松的时刻。它关注以下事实：访问系统有第二个开放的门。这些门是什么？每当你连接到系统时，就会创建一个“套接字”（Socket）。套接字无非是\
  \ IP + 地址的组合服务门。这允许同一个互联网地址运行多个如 Web 服务器、FTP、SMTP、POP 等其他服务。\n\n常用端口号：\n- 21 - FTP\n\
  - 22 - SSH\n- 23 - TELNET\n- 25 - SMTP\n- 79 - FINGER\n- 80 - WWW\n- 3128 - PROXY\n\
  - 6000 – XWINDOWSERVER\n\n使用 TCP 和 UDP 协议的常用端口。\n\n例如：当我连接到任何网页如 `http://www.visualbooks.com.br`\
  \ 时，我实际上是在连接到 `http://www.visualbooks.com.br:80`（`visualbooks.com.br`，端口 80，这是 Web\
  \ 标准）。到目前为止似乎很简单。但我们陷入了以下问题——TCP 和 UDP 协议都有 65535 个端口。门是无尽的。我们如何发现哪些是开放的？通过端口扫描器。端口扫描器尝试发现特定\
  \ IP 地址或主机上哪些端口是开放的。它们通常使用已知端口列表或范围（例如：1000 到 8000）。它们通常非常快，结果迅速返回给我们。常见的端口扫描器对目标机器执行\
  \ TCP 连接。这意味着它执行 TCP 三次握手 syn-ack。使用这种系统，扫描尝试很容易被发现。例如防火墙或 IDS 会快速捕捉黑客的 IP。为了结束这个问题，现在有了更复杂的扫描器，如\
  \ `nmap`。nmap 除了 TCP 连接 () 还可以以多种方式扫描：半连接 ()（仅发送 syn）、fin、`Xmas` 等。每种类型使用不同的标志位来增加检测主机的难度。在这个逐步关卡中，我将使用两个不同的扫描器：用于\
  \ Linux 的 `NMAP` 和用于 Windows 的 `VALHALLA`，我们将寻找端口。\n\n# 第 7 关问题\n\n登录：`level7` 密码：`Can't\
  \ help falling in love` 学习：破解 Unix / Linux 密码。\n\n许多老牌黑客对 DES、shadow、Cracker Jack、John\
  \ the Ripper 等词已经熟悉……遗憾新一代不熟悉这些术语。Unix / Linux 使用名为 DES 的密码加密系统。该系统创建一个加密字符串并将其放在安全文件中。系统名称通常为\
  \ `/etc/passwd`。现在改为使用 `/etc/shadow` 以提高安全性，使原始密码只留下用户名。获取系统控制的人可以获取任何文件，甚至是 shadow\
  \ 文件。\n\n典型的 shadow 条目：\n`mflavio:yFdrXa1EwNYng:12126:0:99999:7:::`\n\n根据之前的信息，我们拥有用户名\
  \ `asmflavio`。加密密码为 `yFdrXa1EwNYng`。其余数字是系统 ID（UID、GID 等）。\n\n\n\n太棒了，我获取了一个 Linux\
  \ 用户的密码，但它是加密的！没问题，我找一个可以解密的程序。这听起来很有可行，但实际上是不可能的。正如我之前说的，DES 创建的是哈希值，这是一种单向加密系统。它是无法被解密的。但是……我们如何找到密码呢？发挥你的想象力吧。想一下：如果\
  \ `shadow` 文件中的密码无法解密，系统是如何将这个密码与用户登录时输入的密码进行比较的？很简单。系统会对新密码进行加密并比较这两个加密值。如果它们相等，那就是正确的密码。\n\
  \n`CrackerJack` 和 `John The Ripper` 是允许你使用字典文件或暴力破解来“破解” Unix /Linux 系统的程序。它们会使用\
  \ `DES` 对每个单词进行加密，并将其与密码文件中的密码进行比较。如果结果命中……那就是正确的密码。当然，为了这一点，你需要一个良好的字典文件。字典文件包含常用密码，并被分为电影名、德语单词等类别……让我们再次看看，在实践中，这个过程是如何操作的。\n\
  \n我们登录 HackersLab，寻找 UID 为 `level8` 且 GID 为 `level7` 的文件。我们找到了 `/dev/audio2`。进入\
  \ `/dev` 目录并运行 `./audio`。程序在屏幕上显示了一些乱码。但这些真的是垃圾吗？它显示了三个字符串（这些可能可以使用 `string` 命令获取）：`level8`、`shadow`\
  \ 和 `VoE4HoQCFfMW2`。嗯，我推断了一下，根据最后一个字符串与其他两个字符串的哈希特征，我认为我们找到了密码……是加密过的。\n\n我们不得不尝试使用\
  \ `John the Ripper`（可以在 http://www.blackcode.com 获取）来尝试找到密码。但首先，我们需要停止字典并适配加密后的密码。是否有方法可以仅通过在\
  \ `John the Ripper` 的命令行中输入哈希值来尝试破解密码？对于这一点，你可以使用单个选项。但为了回答习题，我们取了一个 `shadow` 文件，并将\
  \ root 密码替换为我们获取的哈希值。这样，我们模拟并破解了一个 `shadow` 文件。`JTR`（`John The Ripper`）将尝试列表中的所有的单词作为密码。该列表已保存为\
  \ `passwords.txt`。现在，让我们使用 `JTR`。`JTR` 的执行命令为 `john –wordfile: passwords.txt shadow`（sig-Nice：亲爱的\
  \ John，请使用字典文件 `passwords.txt` 来移除将在 `shadow` 中测试的密码）。它很快将密码返回给了我。\n\n这太神奇了。这是一个多么奇怪的单词？过了一会儿我们发现：`wonderfu`\
  \ 实际上是 `wonderful`（仅从英语角度来看），它是我们列表中的单词之一。但为什么它只显示了八个字符（最后一个是缺失的“l”）？这与 `Program\
  \ File` 目录变成文件时发生的问题相同。该程序是基于 DOS 的，它只能显示八个字符。当然，你可以在规则中更改这一点。要学习更多知识，请查看 `JTR`\
  \ 手册。重要的是，`level8` 的密码是 `wonderful`！\n\n# 第 8 关\n\n登录：`level8` 密码：`wonderful` 学习：竞态条件\
  \ (Race Conditions)。\n\n到此为止，HackersLab 挑战发生了很多变化。之前的关卡都非常简单，所以没什么关于学习的可以说的，而现在的变化来自于竞态条件。它们的构思比我们目前处理过的要复杂一点，需要更多的知识（包括代码示例）才能正确理解。如果你不懂\
  \ `C`，最好在此之前先有一个概念，但现在没关系。理解问题背后的通用概念已经向前了一步。\n\n这种关于竞态条件问题的理论介绍是必要的，以便理解它是如何发生的，在两个读取和写入函数之间是如何产生问题的，并感知哪些函数可以用来纠正特定问题。如果你对\
  \ `C` 没有概念且在解释中感到“不知所云”，我建议你尝试学习一下，因为之后的所有关卡都将使用编程。这一关比之前的关卡难度高得多，但很容易循序渐进。\n\n\
  我们以 `level8` 身份登录 HackersLab，寻找 `level9` UID 和 `level8` GID 的文件。我们找到了问题中提到的文件 `/usr/bin/ps2`。在进入\
  \ `/usr/bin` 目录后，我尝试运行 `./ps2`。什么都没有发生……但真的吗？我们知道它创建了一个临时文件，但假设我们并没有被告知。所以我们可以使用\
  \ `strace` 命令来“检查”我们的操作。输入 `strace /usr/bin/ps2`（不带引号）。让我们看看命令生成了什么：听起来像个笑话……我们在学习中看到的一切……`open()`\
  \ 函数打开了一个临时文件而没有进行任何描述符检查，尝试使用 `write()` 函数写入字符串 `hahahahahahaha` 而没有读取任何权限，更糟糕的是，它给了我们文件名而不是创建一个随机文件。\n\
  \n让我们尝试创建一些“小脚本”，将 `ps2` 程序创建的临时文件 `/var/tmp2/ps2.tmp` 链接到我们感兴趣的内容。你将需要使用 `VI` 文本编辑器创建两个小程序或脚本。其中一个将运行\
  \ `ps2` 文件，以便我们可以在它“关闭”之前享受我们的竞态条件。\n\n```bash\nrace1 while do\n    /usr/bin/ps2\
  \ &\n    rm -rf /var/tmp2/ps2.tmp\n    ln -sf /var/tmp2/ps2.tmp /race1\ndone\n\n\
  race2 while do\n    /usr/bin/ps2 &\n    rm -rf /var/tmp2/ps2.tmp\n    ln -sf /var/tmp2/ps2.tmp\
  \ /race2\ndone\n```\n（注：此处根据上下文逻辑微调了脚本结构以符合翻译意图）\n\n关于 `VI` 的小贴士：启动 `VI` 时，输入 `a`\
  \ 进入编辑模式，按 `Esc` 返回程序模式。要保存（按 `Esc` 后）输入 `:w`；要退出输入 `:q`，如下所示。两个脚本都会循环。第一个（`race1`）正常运行\
  \ `ps2` 但不断重复，给了我们修改临时文件的时间。第二个脚本（`race2`）再次运行 `ps2`，但作为后台运行（使用 `&`），从而给了我们更多时间来赢得竞争。让我们逐行分析以免复杂：\n\
  `/usr/bin/ps2 &`（再次运行程序）；\n`rm -rf /var/tmp2/ps2.tmp`（删除临时文件）；\n`ln -sf /var/tmp2/ps2.tmp\
  \ /race1`（将临时文件链接到第一个脚本，这样程序尝试将字符串写入我们的脚本而不是临时文件）。创建了两个脚本后，我们必须赋予它们执行权限。只需输入命令：`chmod\
  \ +x race1` 和 `chmod +x race2`，如 `chmod` 前后的权限所示。现在我们可以执行了。现在我们必须做一件 HackersLab\
  \ 未曾过的事：连接两次。也就是说，你需要打开两个 telnet 窗口并同时登录 `level8`。在其中一个窗口中，你通过输入 `./race1` 运行 `race1`，在另一个窗口中通过输入\
  \ `./race2` 运行 `race2`。当你运行两者时，屏幕上会出现一些“乱码”，类似于“文件已存在”。但在运行 `race2` 后，如果 `race1`\
  \ 已经在运行，你的“垃圾”将会变成：\n\n“恭喜你!!! 你的竞态攻击成功了……level9 的密码是! Secu!”\n\n# 第 9 关\n\n登录：`level9`\
  \ 密码：`! Secu!` 学习：缓冲区溢出 (Overflow Buffers)。\n\n注意：在这一关不需要担心 `/bin/pass` 文件，因为 `ps2`\
  \ 本身包含了密码。\n\n\n\n我们正在寻找一个具有 `level10` UID 和 `level9` GID 的文件。我们找到了文件 `/etc/bof`（名字很有暗示性……`bof`\
  \ =缓冲区溢出）。我们列出了你的权限并发现了一些有趣的东西。除了执行权限外，这里还有一个位。这是一个 `level10` SUID 位。继续检查，我们运行了程序。它要求你输入一个昵称（`nick_name`）。我写了我的名字，它在屏幕上显示“hello~\
  \ macros_flavio”。仅仅作为一个测试，如果我输入一个过长的字符串会发生什么？程序会进行“边界检查”吗？还是我会溢出缓冲区？只是想测试一下我在屏幕上输入了大量的\
  \ \"x\"。发生了一个错误：`Segmentation fault`（段错误）。搞定！\n\n# 第 10 关问题\n\n在我们完成连接之前，我们必须不断对\
  \ `Target` 进行欺骗和嗅探，真的真以为自己是在与受害者通信。当然，“手动”操作是非常糟糕的，所以有各种应用程序可以完成这个过程。我们在 Linux 上有几十种这样的工具，如\
  \ `spoofit`、`lcrzoex`（多平台）以及其他。我们也有用于 Windows 2000 的程序来欺骗 IP 和 MAC 地址。其中一种是 `sterm`，配置\
  \ IP 欺骗非常简单，如下所示。查看附录 B 可获取这些程序的方法。\n\n### UDP 欺骗\n\n既然我们已经看到了如何在 IP 上进行欺骗，那么很容易理解我们将如何通过进行\
  \ UDP 欺骗来获取下一级 HackersLab 的密码了。原理相同，但简单得多。UDP 与 TCP 不同，没有三次握手认证。它被认为是一种“不可靠”的通信协议，因为丢失数据包也没关系。UDP\
  \ 广泛用于广播（例如在互联网上流某些视频或音乐）。因此，我们不需要尝试寻找某种序列号来发送欺骗的 UDP 包。只需获取此包的头部（仍在允许我们发送 RAW 数据包的根机器上）并包含新的“欺骗”地址即可。我们有两种方法来实现此点：使用出色的\
  \ `hping` 工具(www.hping.org)，它可以执行各种类型的欺骗（包括 UDP，结果显示除外）。或者我们将用 C 语言编写自己的代码来实现。根据教学性问题，我们将选择第二种方案。\n\
  \n用我的代码邮件换你的，你就会收到密码。记得我在开始时说过即使在这一层也很少有人通过吗？好吧，问题在于：太多的防火墙和路由器拦截了欺骗包。这意味着在你的计算机和\
  \ HackersLab 之间的路径上，很有可能某个路由器“阻止”了损坏的数据包。该怎么办？尝试多条路由……我尝试在互联网上获取的几个空 shell 上运行程序，直到我一个来自\
  \ Fortaleza 朋友的 shell 成功了，我通过邮件收到了密码。让我们逐步运行看看结果吧。\n\n### 逐步步骤\n\n现在让我们尝试我们的欺骗操作。在下面的图中，我们编译了\
  \ `udpspoofbr`（或你喜欢的任何名字，我们在 `study` 部分看过代码）并执行它。它要求我们提供源 IP、源端口、目标 IP 和目标端口。在问题中，它要求我们发送一条消息，就好像来自\
  \ `www.hackerslab.org`，从任何端口发送到端口为 5555 的 `todrill.hackerslab.org`。所以我是这样输入命令的：\n\
  \n```\n./udpspoofbr www.hackerslab.org 1234 drill.hackerslab.org5555\n```\n注意源端口没有区别，以至于我们用了\
  \ `1234`。但我收到了“socket failed”（套接字失败）错误。当然，我必须是 root 才能执行，否则系统不允许操作 RAW 数据包进行欺骗。让我们再次以\
  \ root 身份尝试。\n\n# 第 11 关问题\n\n就像栈溢出是一个危险一样，堆溢出也是如此。每当我们使用不限制函数缓冲区大小且且具有 SUID 位和\
  \ `.root` 文件权限的程序进行这种危险组合时，我们就创造了一个大问题。只要很好地理解这个概念，操作过程将非常简单。找到问题文件，选择利用程序并更改 `PROGVULN`\
  \ 和 `ARQVULN` 的值。\n\n### 逐步步骤\n\n我们连接到 HackersLab 并找到了问题描述中引用的 `/usr/local/bin/hof`\
  \ 文件。让我们看看它是否真的会导致段错误。让我们执行它。\n\n它就在那儿。它要求我们提供第 11 关密码，不久后发生了一个失败的段错误。这是我们的网关，就像在栈中一样。只是现在有一点不同。程序的运行方式如下：如果我们提供了正确的密码，它将访问\
  \ `passwd.success` 文件（或者在错误未发生时访问它），如果我们犯了错，它将访问 `passwd.fail`。我们将尝试利用 `passwd.success`，利用段错误通过\
  \ `hof` 程序的 SUID 权限访问该文件的内容。我在 VI 中编写了利用程序，并将 `PROGVULN` 常量设置为 `/usr/local/bin/hof`，`ARQVULN`\
  \ 设置为 `/usr/local/bin/passwd.success`。保存。我们编译了它：\n\n```\ncc exploit.c -o exploit\n\
  ```\n搞定了！让我们测试并对十六进制地址进行一些暴力破解，直到成功为止。\n\n准备好了！在尝试了不同的地址后（注意：找到正确的地址直到 `/usr/local/bin/hof`\
  \ 出现），哇！want to 就是第 13 关的密码。\n\n# 第 12 关问题\n\n登录：`level12`\n密码：`want to`\n学习：简单加密\n\
  \n我们已经讨论了加密，从那一层开始，HackersLab 开始重复我们过的技术。在第 7 关，我说过必须使用 `John the Ripper` 程序来尝试。当然，当加密涉及大量数字时，机会很小。在这种情况下，你可以编写一个脚本自动完成该过程。通过这个值我们得到了下一级的密码吗？让我们逐步测试。\n\
  \n### 逐步步骤\n\n我们连接到 HackersLab 并找到了加密程序。让我们现在用字符串 `encrypt` 来猜它。我们随后运行\n\n```\n\
  ./encrypt encrypt | more (翻页)\n```\n加密将应用几次，我们将得到结果：\n\n这真的是我们尝试匹配的加密密码。但它有效吗？只是想测试一下……那个！！！密码是有效的。这意味着第\
  \ 13 关的密码是 `chl29rh`。\n\n# 9. 计算机系统的利用\n\n随着计算机系统使用的日益增加，第三方对系统的攻击百分比也在逐渐增加。过去人们使用物理拷贝存储所有数据和机密信息。但现在大多数人倾向于在计算机系统中存储机密信息，这就是产生系统攻击的原因。利用无非是编写好的脚本或软件，它允许黑客获取整个系统的控制权并从中获利。\n\
  \n利用攻击试图利用用户操作系统、应用程序或任何其他形式的软件代码中的任何形式的漏洞。此类代码的所有者会对此发布补丁或修复。系统用户或应用程序用户完全负责获取补丁。补丁可以从开发者处下载（在网上很容易获得），也可以由操作系统或所需的应用程序自动下载。如果用户未能安装特定问题所需的补丁，将面临计算机系统被利用的风险，并可能导致安全泄露。\n\
  \n## 计算机利用及其类型\n\n计算机利用可以分为两种类型：\n\n\n\n\n\n-   **远程漏洞**：远程漏洞是指那些无法访问网络或远程系统的漏洞类型。此类漏洞通常用于获取对本质上远程的系统的访问。\n\
  -   **本地漏洞**：本地漏洞用于那些具有本地系统访问权限的系统。攻击者借此绕过本地系统用户的权限。\n\n安全漏洞可以以任何大小和形状的形式出现。然而，在众多技术中，某些技术比其他技术更频繁地使用。Web\
  \ 端常见的漏洞是 `XSS`（跨站脚本攻击）、`SQL injection`注入以及跨站请求伪造。它还包括对本质上已破解的身份验证码的滥用或其他系统安全性的配置不当。\n\
  \n### 零日漏洞\n\n计算机系统的漏洞可以根据多种方式进行区分，这取决于漏洞的工作原理以及它可以实现的攻击类型。最常见的漏洞形式是 `zero-day exploit`（零日漏洞）。这种形式的漏洞充分利用了零日脆弱性。当某个软件（可能是应用程序或操作系统）在安全措施中存在某些关键形式的漏洞，且厂商对此无所知时，就会产生零日脆弱性。只有当发现黑客利用该系统的脆弱性进行攻击时，系统漏洞才能被检测到。这就是为什么它被称为\
  \ `zero-day exploit`。在这种漏洞发生后，运行该软件的系统将一直受到各种形式攻击的影响，除非软件厂商发布了所需的补丁来修复系统漏洞。\n\n\
  计算机漏洞还可以根据预期的攻击形式进行分类，例如远程代码执行、恶意软件投递、权限提升、拒绝服务以及各种其他有害目标。漏洞还可以根据被利用的漏洞类型进行分类，这包括\
  \ `code injection`代码注入、`buffer overflow`缓冲区溢出利用以及各种其他侧信道攻击和输入验证漏洞。\n\n### 漏洞是如何发生的？\n\
  \n事实上，漏洞可以以各种方式发生。然而，所有最常见的方法之一是从本质上恶意的网站发起漏洞。此类漏洞的受害者通常是误访问了恶意网站。受害者也可能被骗浏览或点击恶意网站链接，这些链接可能附带在钓鱼邮件中，或以恶意广告的形式出现。\n\
  \n用于计算机漏洞的恶意网站配备了各种软件工具包和漏洞包，这些工具可以轻松地从有害网站对浏览器的各种漏洞发动攻击。也可能来自被黑掉的网站。这种形式的攻击通常针对\
  \ `JAVA` 编写的软件、浏览器插件以及未打补的浏览器。它用于将恶意软件植入目标受害者的计算机系统中。\n\n由各种恶意网站发发的自动化漏洞形式由两个组件组成：`exploit\
  \ code`利用代码和`shell code`外壳代码。`exploit code`是一种尝试利用已知形式漏洞的软件。利用软件的有效负载是 `shell code`，它被设计在系统攻破完成后运行一次。`shell\
  \ code` 的名称源于这样一个事实：许多负载会打开命令 shell，用于运行与目标系统相矛盾的命令。然而，并不是所有的 shell codes 都能打开命令\
  \ shell。\n\n### 外壳代码\n\n`shell code` 像一段微小的代码，在软件利用过程中作为有效负载使用。shell codes 以机器码的形式编写。`Download\
  \ and execute`（下载并执行）是 shell code 的一种形式，通过直接从目标系统下载并执行某些恶意软件来实现。这种形式的 shell code\
  \ 不产生 shell，而是指示目标机器下载一个离线的可执行文件，然后将其保存到磁盘并执行该文件。这种形式的 shell code 最常用于驱动下载形式的攻击，其中受害者点击恶意网站链接，shell\
  \ code 下载恶意软件并将其安装在目标受害者的系统上。\n\n### 1. 如何伪造地址\n\nMacintosh 地址伪造是一种在系统设备上偶然更改媒体访问控制（`MAC`）地址的系统。`MAC\
  \ Address` 是一个定制到系统设备中的有趣且硬编码的地址，无法永久更改。`MAC address` 位于 OSI 模型的第二层，应被视为接口的物理位置。`Macchanger`\
  \ 是一个集成在任何版本的 `Kali Linux` 中的（包括 2016 移动版本）的工具，可以将 `MAC address` 更改为任何理想位置，直到下次重启。在练习中，我们将使用\
  \ `Kali Linux` 上的 `Macchanger` 创建的随机 MAC 地址来伪造我们远程连接器的 MAC 地址。\n\n-   首先，我们必须关闭系统连接器以更改\
  \ MAC 地址。可以通过以下指令实现：`ifconfig` 工具被 `iproute2` 取代。使用以下命令通过 `iproute2` 关闭 `wlan1`：\n\
  -   将 `wlan1` 替换为您自己的系统接口。\n-   现在使用以下命令将您的 MAC 地址更改为另一个随机 MAC 地址：\n-   如截图所示，`Macchanger`\
  \ 将向您显示永久的、当前和更改后的 MAC 地址。永久的 `MAC Address` 在重启后将恢复到您的系统连接器，或者您可以物理重置系统连接器的 MAC\
  \ 地址。使用以下指令物理恢复您系统连接器的永久 MAC 地址：\n-   您也可以使用以下指令伪造特定的 MAC 地址：`ifconfig wlan1 up`\n\
  -   或使用相应的 `iproute2` 指令将 `wlan1` 设备恢复开启：`ip connection set wlan1 up`\n\n\n\n\n\
  “连接更改”包括修改发送给购物者的页面到达地址，以便将受益者重定向到程序员的网站，而不是真实的网页。这是通过在电子邮件的真实位置之前包含程序员的 IP 地址来实现的，该电子邮件包含一个返回到第一个站点的诱导请求。如果某个人不小心收到一封钓鱼邮件并继续“点击此处刷新”账户数据（例如），并被重定向到一个看起来完全像商业网站的站点（例如\
  \ eBay 或 PayPal），那么该个人很有可能会提交个人信息和信用卡数据。此外，这实际上正是程序员所寄赖的。\n\n## 保护自己的最有效方法\n\n-\
  \ 如果你必须在网上刷新数据，请使用你之前使用的类似策略，或者打开另一个程序窗口并输入真实机构页面的网站地址。\n- 如果网站的地址是新的，它很可能是假的。只需使用你之前使用的地址，或者更好，是从典型的主页开始。\n\
  - 大多数机构都希望你登录受保护的站点。搜索程序底部的锁头图标以及网站地址前的“https”。\n- 如果你收到一封意外邮件，要求直接或通过网站提供个人预算或身份数据（例如，社会安全号码、密码或其他标识符），请保持极度警惕。\n\
  - 注意网站上的头部地址。大多数真实站点将有一个简短的网页地址，通常以“.com”或可能的“.organization”结尾，标明目标业务名称。伪造的目标在头部中会有极长的字符字符串，真实的业务名称位于字符串的某个地方，或者可能根本没有。\n\
  - 如果你对电子邮件或网站有任何疑问，请通过合法渠道联系真实的机构。复制该错误站点的 URL 地址，将其发送给真实业务并询问该请求是否真实。\n\n## 如何实现任务自动化\n\
  \n对于那些完全不知道大规模编程如何自动化任务的人，或者他们甚至没有大规模编程的人来说，简单的答案是：你阅读了这本书，之后你就完全理解了大规模编程是如何自动化任务的。\n\
  \n监控类似的站点、记住密码、提交给审核架构师以及反复测试网站，是每个浏览器普通用户的枯燥任务。此外，填写表单、在特定时间运行项目、处理杂事以及计划安排任务都是无聊的重复性工作。你的任务可以是这些单调任务中的任何一个。如果这些任务至少有一项每天发生，自动化这些单调的任务将帮助你节省宝贵的时间并提高效率。\n\
  \n自动化枯燥任务有两种基本方法——记录击键和鼠标操作，或通过大规模编程物理地更改内容。这两种方法都可以被视为脚本，稍后可以使用任何这些策略之一——热键、调度器和触发器进行重放。显然，通过记录击键和鼠标操作来尝试这些任务是一种简单的方法。然而，这种方法无法完成那些不可预测的任务，除非这些任务仅通过击键和鼠标操作即可完成（例如，点击捕获窗口）。因此，对于那些令人头疼的任务，有一种简单且快速的方法——物理地更改内容。\n\
  \n要开始使用这些内容，你需要理解大规模编程中的什么是内容管理器。大规模内容管理器是一个用于更改大规模活动的工具。虽然可以通过账户创建大规模脚本，但记录只能捕获鼠标和控制台操作。这样，为了获取其他复杂的活动（例如，等待一个居中的窗口），你可以使用大规模编程中的内容编辑器来更改这些活动并自动化在稍后执行它们。\n\
  \n通过这种方式，你可以将 PC 上的任何任务自动化，从单个任务到复杂的业务任务以及更多。同时，你可以利用大规模编程来有效地创建任务：浏览电子邮件、移动或备份文档、发送电子邮件以及逐步复杂的自动化，包括限制性的\
  \ `IF/ELSE` 语句、循环、因子和其他增强选项。\n\n现在，你已经了解了大规模编程是如何自动化任务的。如果你没有，你必须从网上下载免费或试用版副本，或者购买你所选程序的副本。\n\
  \n## 11. 常见问题 (FAQs)\n\n### 应该多久进行一次渗透测试？\n机构根据自己的法规和要求执行。它们遵循的标准将决定它们是否需要渗透测试。机构的标准带有它们自己的方法论，有助于描述保护安全系统的最佳实践。标准还将决定是否需要进行测试记录以满足合规性和后续审计目的。\n\
  \n### 什么是违规无线网络？\n违规无线网络的作用就像路由器或 Wi-Fi 基站一样的接入点点。它被接入组织的网络；但它并不符合组织现有的无线基础设施标准。\n\
  \n### 如何安装违规无线网络？\n这种安全威胁发生在任何设备被引入组织并无论有意还是无意地连接到网络时。许多类型的设备默认激活了 Wi-Fi，但没有进行任何配置。这意味着，当设备首次打开时，它会开始广播信号进行连接。\n\
  \n### 企业员工会使组织面临网络威胁吗？\n是的，他们可以。任何携带与公司 Wi-Fi 连接的设备的人都可能成为企业的潜在威胁。恶意软件可能会通过网络从笔记本电脑、平板电脑或手机无意中进入系统。这在\
  \ Wi-Fi 分段未被正确锁定时就会发生。如果业务服务器没有在完全不同的 `VLAN` 中隔离，所有无线网络流量都可以访问同一个，那么发生安全泄露和数据窃取的可能性很高。\n\
  \n### 尽管存在相关的潜在风险，企业是否仍需要无线网络？\n现代企业如果没有无线技术将无法运行。然而，应用于无线设备的技术标准和配置将决定无线技术的实用性以及以及安全泄露的潜在风险。\n\
  \n### MITM 是严重的安全威胁吗？\n\n\n\n\n它也被称为“中间人攻击”，是常见的常见的攻击形式之一，也是攻击者最常用的战术。攻击者欺骗受害者并传输数据，使受害者认为通信仅源于合法的接触方式。通过使用\
  \ `MITM`，攻击者可以轻松地针对受害者的系统并进行远程控制，获取包括银行详情在多个敏感数据以及利用漏洞的程序。\n\n## 什么是数据包分析器？\n\n\
  攻击者能够分析和嗅探通过无线网络传输的数据包。攻击者还可以截获位于 `TCP` 数据包内部的各种未加密数据。使用这种方法收集数据时，攻击者可以轻松洞察目标组织的内部运行系统，并可能钓出可能对业务造成巨大损失的价值价值信息。\n\
  \n## 什么是恶意软件？\n\n恶意软件是网络攻击的一种形式，也是最常见的攻击形式。它对网络和服务器构成了严重威胁。它还具有在各种网络中自我传播的能力。一旦进入某个网络网段，想要检测并停止它将变得非常困难。当两个设备连接到同一个网络时，它可以感染系统，这导致病毒传播非常快。\n\
  \n## 配置不当的 Wi-Fi 会导致网络攻击吗？\n\n是的，当 `Wi-Fi` 配置不当时，这是可能的。这是无线网络被渗透的主要原因。当 IT 人员没有可用的管理工具来获取无线环境视图时，情况会变得更加严重。\n\
  \n## 在组织外分享渗透测试结果可以吗？\n\n不，你永远不要在组织外披露测试报告。你只能与公司官员和授权机构共享。向外部世界共享测试结果将为组织暴露漏洞，并可能导致严重的网络攻击。\n\
  \n## 结论\n\n恭喜你！自从你第一次打开这本书以来，你已经走了很长一段路！这可能很困难，但在网络安全领域进步会让你非常有成就感和满足感。你不应该在没有“辅助轮”的情况下就准备好开始独立渗透测试。如果你投入努力，很快就会成为一名专业的伦理黑客。\n\
  \n然而，这段旅程还没有结束。不要仅仅依赖这些内容，因为渗透测试是一个如此发达的话题，你可以在上面写满整排书架。本指南应该消除伦理黑客背后的神秘，并引导你学习所有的渗透测试方法，但仅仅看书是不够的。你必须采取行动！利用所有的黑客在线资源进一步提高你的技能，并加入一个志同道合的社区。\n\
  \n带着这些信息，让我们简要回顾一下通过阅读这本书所获得的一切：\n\n理解基本术语以及渗透测试到底是什么是非常重要的。我们还花了一些时间探索黑帽黑客的心态，因为作为一名伦理黑客，你有时需要设身处地以便对真实攻击进行准确模拟。不要承担不必要的风险，并且只有在获得完全授权的情况下才进行测试。\n"
