  \n## 预留关键字\n\n标识符名称有一个限制。Python 语言有一组独特的关键字，用于定义特定的语言功能。任何对象都不能使用与预留关键字相同的名称。\n\n\
  ### Python 关键字\n\n你可以在 Python 解释器中输入 `help(\"keywords\")` 来查看预留字。预留关键字对大小写敏感。因此，你不应该更改它们，而应该按照它们出现的形式使用。除了以下内容外，所有的都是小写的：\n\
  \n`True`、`False` 和 `None`。\n\n尝试使用预留关键字创建变量，会导致错误。\n\n## 2. Python OOP 概念\n\n###\
  \ Python OOP 概念\n\nPython 面向对象编程概念在软件行业中起着至关重要的作用。它拥有面向对象编程的所有概念。Python 是从一开始就基于\
  \ OOP 概念的语言。在这里，软件专家可以调用函数、对象和类来执行任何编程任务。这种语言被高度推荐用于数据科学概念。\n\n让我们讨论 Python OOP\
  \ 的一些重要部分：\n- 对象框架- Python 中的属性和方法\n- 类-对象的集合\n- 方法-对象的能力\n- 继承-继承父对象的属性\n- 多态-多重结构\n\
  - 数据抽象-程序的核心属性\n- 封装-将代码和数据封封装在一起\n\n### 对象框架\n\n这个框架在编程中的概念与现实世界相似。任何具有某些属性的现有物质都是对象。在\
  \ Python 中，有一种无处不在面向对象的方法，所有这些对象都有某些特定的属性和功能。通过定义的容量，对象包含了所有重要的信息，利用这些信息创建一个全面的结果导向的信息。\n\
  \n### 类-对象组\n\n类是关于对象组的。这些类具有特定属性的元素。就像在现实生活中，我们在编程世界中也定义类。例如，我们可以有学生、工人、官员等类。所有类在类内部都有某种相似的特征。\n\
  \n#### 类语法\n\n```python\nclass 类名:\n```\n```python\n<语句 1>\n```\n```python\n<语句\
  \ 2>\n```\n```python\n<语句 N>\n```\n\n### 方法-对象的能力\n\n方法是关于程序中对象的能力。它基于对象拥有多少方法。它经常用于\
  \ Python 编程。\n\n### 继承-继承对象的属性\n\n它是 Python 语言不可或缺的一部分。在 OOP 中，它类似于人类生物传统的继承系统。子对象拥有所有的属性和方法。通过这个框架，我们可以开发类来互相使用属性。它有助于通过使用单一代码获取结果。同时也节省了时间。\n\
  \n### 多态-多重结构\n\n这个框架是面向对象编程的一项优秀特性。它的意义与其名称相似：多重结构。这意味着一个任务可以通过多种方法完成。\n\n### 数据抽象-程序的核心属性\n\
  \n这个框架具有优秀的特性，通过它可以获取执行功能所需的精确信息。不需要运行整个程序即可获得结果。它获取内部命令并运行功能。我们可以为函数标记一些名称并调用它们来获取功能。\n\
  \n### 封装-将代码和数据封装在一起\n\n封装的代码和数据是编程中的重要部分。它将方法和代码限制在特定的用户范围内。这样做是为了将它们结合并保持安全。\n\
  \n### 面向对象与过程化的编程语言\n\n| 面向对象 | 过程化的 |\n| :--- | :--- |\n| 面向对象编程是一种批判性思维方法，适用于通过使用对象完成计算的情况。\
  \ | 过程编程利用指令列表来逐条执行计算。 |\n| 它让改进和维护变得更容易。 | 在过程编程中，当任务变得复杂时，维护代码并不困难。 |\n\n\n\n\n\
  \n# Python 类与对象\n\n类基本上是一个包含许多对象的假定元素。它是虚拟的，当我们结合对象及其属性来观察它时，它就赋予了意义。例如，假设有一栋医院建筑。它有房间、床、医疗设备等。这栋医院建筑就是一个类（class），而建筑的所有部分都是它的对象（objects）。\n\
  \n在教学练习的这一部分，我们将讨论如何在 Python 中创建类和对象。我们还将讨论如何使用类对象来获取特征。\n\n## 在 Python 中创建类\n\n\
  Python 创建类的语法非常简单。非技术人员也可以通过输入简单的命令来创建一个类。\n\n### 语法\n```python\nclass ClassName:\n\
  #statement_suite\n```\n\n考虑以下指南，以创建一个名为 `Employee` 类，它包含两个字段：`Employee` id 和 `name`。该类同样包含一个能力\
  \ `show()` 方法，用于显示 `Employee` 的信息。\n\n### 示例\n```python\nclass Employee:\n  id =\
  \ 10;\n  name = \"ayush\"\n  def display (self):\n    print(self.id,self.name)\n\
  ```\n在这里，`self` 被用作实例变量源，指代当前的类对象。它始终是方法定义中的主参数。尽管如此，在方法调用中使用 `self` 是可选的。\n\n##\
  \ 创建类的实例\n\n如果我们在另一个类中使用类的特征，则应该对类进行实例化。可以通过使用类名调用类来对其实例化。\n\n### 示例\n```python\n\
  id number = 10;\nname = \"John\"\nprint(\"ID number: %d \\nName: %s\"%(self.id,self.name))\n\
  emp = Employee()\nemp.display()\n```\n**输出：**\n```\nID number: 10\nName: John\n\
  ```\n\n## Python 构造函数\n\n它是一种特殊的方法（函数），用于初始化类中指定的成员。构造函数有两种类型：\n\n* 参数化构造函数\n* 非参数化构造函数\n\
  \n它的定义在我们创建该类的对象时执行。构造函数确保对象有可衡量的资源来执行启动任务。\n\n### 在 Python 中创建构造函数\n\n在 Python\
  \ 中，方法 `__init__` 生成了类的构造函数。该方法在类实例化时使用。在创建类对象时，我们可以使用 `__init__` 的定义传递多个参数。每个类都应该有一个构造函数，即使它只是默认构造函数。\n\
  \n### 示例\n```python\nclass Student:\n  count = 0\n  def __init__(self):\n    Student.count\
  \ = Student.count + 1\ns1=Student()\ns2=Student()\ns3=Student()\nprint(\"The number\
  \ of students:\",Student.count)\n```\n**输出：**\n```\nThe number of students: 3\n\
  ```\n\n### Python 非参数化构造函数示例\n```python\nclass Student:\n  def __init__(my):\n \
  \   print(\"It is non parametrized constructor\")\n  def show(my,name):\n    print(\"\
  Hello\",name)\ny = Student()\ny.show(\"Jack\")\n```\n**输出：**\n```\nIt is non parametrized\
  \ constructor\nHello Jack\n```\n\n### 参数化构造函数示例\n```python\n# 假设 Student 类在上方定义\n\
  def __init__(my, firstname):\n  print(\" parametrized constructor\")\n  my.firstname\
  \ = name\ndef show(my):\n  print(\"Hello\",my.firstname)\ns = Student(\"Jack\")\n\
  s.show()\n```\n**输出：**\n```\nparametrized constructor\nHello Jack\n```\n\n## Python\
  \ 内置类函数\n\nPython 有多个内置的类函数。让我们尝试通过一个示例来理解它的功能。\n\n### 示例\n```python\nclass Workers:\n\
  \  def __init__(my,name,age):\n    my.name = name;\n    my.age = age\nW = worker(\"\
  Jack\",115,22)\nprint(getattr(W,'name'))\nsetattr(W,\"age\",24)\nprint(getattr(s,'age'))\n\
  delattr(s,'age')\nprint(s.age)\n```\n**输出：**\n```\nJack\n24\nAttributeError: There\
  \ is no attribute 'age' in object.\n```\n\n## 内置类属性\n\nPython 中的类还包含属性（内置），这些属性提供了关于类的信息。\n\
  \n| 属性 |  |\n| :--- | :--- |\n| `__dict__` | 用于提供包含命名空间信息的字典。 |\n| `__doc__` | 包含类文档字符串的字符串。\
  \ |\n| `__name__` | 访问类名。 |\n| `__module__` | 访问定义此类的模块。 |\n| `__bases__` | 拥有一个元组。\
  \ |\n\n### 示例\n```python\ndef __init__(my,name,roll number,age):\n  my.name = name;\n\
  \  my.roll number = roll number;\n  m.age = age\ndef display_details(my):\n  print(\"\
  Name:%s, Roll Number:%d, age:%d\"%(my.name,my.roll number))\ny = Student(\"Jack\"\
  ,10,17)\nprint(y.__doc__)\nprint(y.__dict__)\n```\n**输出：**\n```\nNone\n{'name':\
  \ 'Jack', 'Roll number': 10, 'age': 17}\n```\n\n## Python 继承\n\n继承是编程语言的一种特性。它改进了代码的可用性。在这种框架下，子类可以访问父类的特征和功能。\n\
  \n### 语法\n```python\nclass derived-class(base_class):\n```\n考虑以下语法：\n```python\n\
  class derived-class(<base_1>, <base_2>), .....\n```\n\n### 示例\n```python\nclass\
  \ Animal:\n  def speak(self):\n    print(\"Animal Speaking\")\nclass Dog(Animal):\n\
  \  def bark(self):\n    print(\"barking dog\")\nd = Dog()\nd.bark()\nd.speak()\n\
  ```\n**输出：**\n```\nbarking dog\nAnimal Speaking\n```\n\n## Python 多级继承\n\n继承在 Python\
  \ 中有多个层次。同样，在其他语言中也有。这种面向对象的特性可以从一个类派生数据并在另一个类中使用。\n\n### 多级继承的语法\n```python\nclass\
  \ class1:\nclass class2(class1):\nclass class3(class2):\n```\n\n### 示例\n```python\n\
  class Animal:\n  def speak(self):\n    print(\"Animal Speaking\")\nclass Dog(Animal):\n\
  \  def bark(self):\n    print(\"barking dog\")\nclass DogChild(Dog):\n  def eat(self):\n\
  \    print(\"Bread eating...\")\nd = DogChild()\nd.bark()\nd.speak()\nd.eat()\n\
  ```\n**输出：**\n```\nbarking dog\nAnimal Speaking\nBread eating...\n```\n\n## Python\
  \ 多重继承\n\nPython 允许在子类中继承多个基类。\n\n### 语法\n```python\nclass Base1:\nclass Base2:\n\
  class BaseN(Base1,Base2):\n```\n\n### 示例\n```python\nclass Calculate1:\n  def Summation(self,a,b):\n\
  \    return a+b;\nclass Calculate2:\n  def Multiplication(self,a,b):\n    return\
  \ a*b;\nclass Derive(Calculate1,Calculate2):\n  def Divide(self,a,b):\n    return\
  \ a/b;\nd = Derive()\nprint(isinstance(d,Derive))\n```\n**输出：**\n```\nTrue\n```\n\
  \n## 方法重写\n\n我们可以在子类中为父类方法提供特定的实现。在子类中使用或定义父类方法被称为方法重写（method-riding）。\n\n### 示例\n\
  ```python\nclass Bank:\n  def getroi(self):\n    return 10;\nclass SBI(Bank):\n\
  \  def getroi(self):\n    return 7;\nclass ICICI(Bank):\n  def getroi(self):\n \
  \   return 8;\na1 = Bank()\na2 = SBI()\na3 = ICICI()\nprint(\"Bank interest:\",a1.getroi());\n\
  print(\"SBI interest:\",a2.getroi());\nprint(\"ICICI interest:\",a3.getroi());\n\
  ```\n**输出：**\n```\nBank interest: 10\nSBI interest: 7\nICICI interest: 8\n```\n\n\
  \n\n\n抽象是面向对象编程的一个重要部分。在 `Python` 中，我们同样可以通过在需要隐藏的属性前添加双下划线（`__`）前缀来执行数据隐藏。之后，该属性在类外部无法通过对象被注意到。\n\
  \n### 示例：\n\n```python\nclass Employee:\n    count = 0\n    def __init__(self):\n\
  \        Employee.__count = Employee.__count+1\n    def display(self):\n       \
  \ print(\"The number of employees\",Employee.__count)\n\nemp = Employee()\nemp2\
  \ = Employee()\ntry:\n    print(emp.__count)\nfinally:\n    1emp.display()\n```\n\
  \n**输出：**\n```\nThe number of employees 2\nAttributeError: 'Employee' object has\
  \ no attribute '__count'\n```\n\n### 1. Python 魔法方法\n\nPython 魔法方法（Magic Method）定义为类中包含“魔法”的特殊方法。它们以双下划线开头和结尾，例如\
  \ `__init__` 或 `__str__`。\n\n内置类定义了许多魔法方法。可以使用 `dir()` 函数查看类继承的魔法方法数量。它具有两个前缀，并且方法名中有额外的下划线。\n\
  \n它主要用于定义预定义操作符的重载。\n\n#### `__init__`\n`__init__` 方法在类创建后调用，但在返回给调用者之前。它在创建类实例时被自动调用，类似于其他编程语言中的构造函数。例如，`C++`、`Java`、`C#`、`PHP`\
  \ 等。这些方法也被称为初始化方法，并在 `__new__` 之后被调用。在这里你应该初始化实例属性。\n\n#### `__str__`\n该方法处理对象的“非正式”的或易于打印的字符串表示，并应该返回一个字符串对象。\n\
  \n#### `__repr__`\n该方法由 `repr()` 内置函数调用，用于确定对象的“官方”字符串表示，并返回机器可识别的类型表示。`__repr__`\
  \ 的目标是无歧义。\n\n#### `__len__`\n该方法应该返回对象的长度。\n\n#### `__call__`\n通过添加 `__call__`\
  \ 魔法方法，可以让对象变成可调用的，另一个不需要频繁需要的方法也是 `__call__`。\n\n每当在类中定义时，该类就可以被调用。在任何情况下，如果它本身是一个实例而不是修改。\n\
  \n#### `__del__`\n同样，`__init__` 是构造器方法，`__del__` 类似于析构器。如果你在 `__init__` 中打开了一个文档，那么在\
  \ `__del__` 中关闭它。\n\n#### `__bytes__`\n它提供对象的字节字符串表示，并应该返回一个字符串对象。\n\n#### `__ge__`\n\
  当使用 `>=` 操作符时调用此方法，并返回 `True` 或 `False`。\n\n#### `__neg__`\n该方法在一元操作符被需要。\n\n####\
  \ `__ipow__`\n该方法以带参数的形式处理类型。例如 `a**=b`。\n\n#### `__le__`\n该方法在使用 `<=` 操作符时处理相关性。\n\
  \n#### `__nonzero__`\n\n### Python 栈和队列\n\nPython 栈和队列是最基本的功能。它们被用于访问数据并为了某些目的修改数据。这些数据结构在计算机软件世界非常有名。队列使用\
  \ `FIFO`（先进先出）规则进行数据排序，而栈遵循 `LIFO`（后进先出）方法。\n\n#### 栈的属性：\n- `push`：向栈顶添加组件。\n-\
  \ `pop`：从栈顶弹出一个组件。\n\n#### 栈上的任务：\n- 添加——增加栈的大小。\n- 取消——用于减小栈的大小。\n- 遍历——访问栈的每一个组件。\n\
  \n#### 特性：\n- 栈的插入请求被保存。\n- 有助于解析活动。\n- 允许重复。\n\n#### 代码\n```python\n# 使用列表实现栈的代码\n\
  y = [\"Python-language\", \"Csharp\", \"Androidnew\"]\ny.push(\"Javaflash\")\ny.push(\"\
  C++lang\")\nprint(y)\nprint(y.pop())\nprint(y)\nprint(y.pop())\nprint(y)\n```\n\n\
  **输出：**\n```\n['Python-language', 'Csharp', 'Androidnew', 'Javaflash', 'C++lang']\n\
  C++lang\n['Python-language', 'Csharp', 'Androidnew', 'Javaflash']\nJavaflash\n['Python-language',\
  \ 'Csharp', 'Androidnew']\n```\n\n#### 队列属性\n先进先出（`FIFO`）原则允许队列从两端拥有元素。它是开放进入和释放组件的。\n\
  \n#### 队列中的基本功能：\n- `enqueue`：添加元素。\n- `dequeue`：从队列中移除元素。\n\n#### 特性：\n- 队列的插入请求被保护。\n\
  - 允许重复。\n- 用于解析 CPU 任务活动。\n\n#### 代码\n```python\nimport queue\n# 创建队列\nL = queue.Queue(maxsize=10)\n\
  # 插入数据\nL.put(9)\nL.put(6)\nL.put(7)\nL.put(4)\n# 输出：\nprint(L.get())\nprint(L.get())\n\
  print(L.get())\nprint(L.get())\n```\n**输出：**\n```\n9\n6\n7\n4\n```\n\n### Python\
  \ Assert\n\nPython `assert` 是一个调试工具。它检查条件是否为真。如果条件为假，会抛出 `AssertionError`。它用于告知程序员每一步中的错误。它与条件语句配合工作。它通过消息警告用户。\n\
  \n#### 语法\n`assert condition, error_message(optional)`\n\n#### 示例：\n```python\n\
  def avg(scores):\n    assert len(scores) != 0, \"The List is empty.\"\n    return\
  \ sum(scores)/len(scores)\n\nscoresb = [67,59,86,75,92]\nprint(\"The Average of\
  \ scoresb:\",avg(scoresb))\n\nscoresa = []\nprint(\"The Average of scoresa:\",avg(scoresa))\n\
  ```\n\n**输出：**\n```\nThe Average of scoresb: 75.8\nAssertionError: The List is empty.\n\
  ```\n\n### Python 模块、异常和数组\n\nPython 模块、异常和数组是面向对象编程的重要部分。在数据科学中，我们经常使用它们来更好地以逻辑方式理解代码。\n\
  \n#### Python 模块\nPython 模块是包含 Python 编程的程序。它们包含了这种独特语言的所有变量、类和函数。它们允许程序员以正确的格式组织代码。\n\
  \n#### 示例：\n```file.py\ndef displayMsg(name):\n    print(\"Hi \"+name)\n```\n\n\
  现在需要将此模块添加到主程序中\n```python\nimport file\nfile.displayMsg(\"World\")\n```\n\n####\
  \ 在我们的 Python 代码中加载模块\n为了利用 Python 代码的功能，需要加载模块。Python 两种两种语句：\n\n1. `import` 语句\n\
  2. `from-import` 语句\n\n#### Python 标准库-内置模块\n有无限的 Python 内置模块池。我们将讨论一些重要的模块。这些是：\n\
