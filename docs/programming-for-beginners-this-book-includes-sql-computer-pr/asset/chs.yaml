  | 4 | Jacobs | 22 | Male | 5 |\n| 5 | Bob | 20 | Male | 4 |\n| 6 | Shane | 22 |\
  \ Male | 4 |\n| 7 | Linda | 24 | Female | 4 |\n| 8 | Stacy | 20 | Female | 1 |\n\
  | 9 | Wolfred | 21 | Male | 2 |\n| 10 | Sandy | 25 | Female | 1 |\n| 11 | Colin\
