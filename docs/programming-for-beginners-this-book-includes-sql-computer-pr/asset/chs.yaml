  \ `StudDepRel`（你可以使用任何名称）的外键约束，该约束将 `Student` 表的 `DepID` 列设置为外键，引用 `Department`\
  \ 表的 `DepID` 列。\n\n在运行脚本 1 后，你应该拥有包含以下数据的“Department”表和“Student”表：\n\n*(此处重复原文表格内容，保持格式一致)*\n\
  \n**Department 表**\n（如上所示）\n| 1 | English | 100 |\n| 2 | Math | 80 |\n| 3 | History\
  \ | 70 |\n| 4 | French | 90 |\n| 5 | Geography | 100 |\n| 6 | Drawing | 150 |\n\
  | 7 | Architecture | 120 |\n\n**Student 表**\n（如上所示）\n| 1 | Alice | 21 | Male | 2\
  \ |\n| 2 | Alfred | 20 | Male | 3 |\n| 3 | Henry | 19 | Male | 3 |\n| 4 | Jacobs\
  \ | 22 | Male | 5 |\n| 5 | Bob | 20 | Male | 4 |\n| 6 | Shane | 22 | Male | 4 |\n\
  | 7 | Linda | 24 | Female | 4 |\n| 8 | Stacy | 20 | Female | 1 |\n| 9 | Wolfred\
  \ | 21 | Male | 2 |\n| 10 | Sandy | 25 | Female | 1 |\n| 11 | Colin | 18 | Male\
  \ | 1 |\n| 12 | Maria | 19 | Female | 3 |\n| 13 | Ziva | 20 | Female | 5 |\n| 14\
