  ## C 家族\n\nUNIX 可能是第一个在不同系统中被广泛使用的操作系统。AT&T 贝尔实验室在 20 世纪 60 年代后期基于我们现在称为 C 的语言开发了用于小型机的操作系统。AT&T\
  \ 强制要求使用 UNIX 的公司，这意味着 UNIX 随着 C 语言被移植到各种计算机系统。由于 C 语言变得如此普遍，许多开发的语言都提供了类似的编码环境，以便\
  \ C 语言程序员更容易使用它们。C 家族编程语言的列表很长，但某些比其他的更著名。C、C++ 和 C# 是最流行的三个语言，紧随其后的是 Objective\
  \ C。\n\n### 优点\n\n-   截至 2019 年 10 月，C 是 Java 和 Python 之后最广泛使用的语言。\n-   每位程序员都应该至少学习\
  \ C、C++ 或 C# 语言之一，以理解程序执行期间后台发生了什么。\n\n### 缺点\n\n-   学习很困难，因为它迫使程序员关注现代编程语言已经处理的问题。\n\
  -   其语法虽然启发了许多其他语言，但非常丑。\n-   即使是执行最基本的任务也需要大量的额外代码。\n\n## Java 平台\n\n得益于使用该语言开发的数百万\
  \ Web ，Java 可能是世界上最广泛使用的编程语言。Java 由 Sun Microsystems 于 1995 年作为 Java 平台的核心组件发布，它允许使用\
  \ Java 构建的应用程序在任何具有 `Java 虚拟机` 的计算机系统上运行。虽然语法与 C 和 C++ 语言相似，但它并不要求程序员考虑底层。Oracle\
  \ 收购了 Sun Microsystems 并现在管理 Java 平台。\n\n多年来，微软的 C# 和太阳的 Java 一直处于冷战状态，试图超越另一种编程语言。两种语言都受到严厉批评，为了赢得竞争而不是遵循标准方向而添加新功能。直到\
  \ 2004 年，两种语言才开始分道扬扬，发展成为我们今天所知的独特语言。\n\n\n\n\n尽管如此，Java 仍然是世界上最流行的编程语言，Java 平台运行在几乎每台笔记本电脑、游戏机、数据中心甚至超级计算机上。\n\
  \n## 优点\n\n- `Java` 让程序员摆脱了对计算机的依赖，并提供了巨大的自由。\n- `Java` 兼容几乎所有的计算机系统。这意味着几乎使用 `Java`\
  \ 语言创建的程序都能在所有系统上运行而不会出现任何问题。\n\n## 缺点\n\n- 多年来，`Java` 出现过严重的安全问题。在最近的 `Java` 版本发现了严重的安全漏洞，`Oracle`\
  \ 建议所有 `Java` 用户更新到最新版本。\n- 众周知，`Java` 程序运行速度比竞争对手慢，尽管最近的版本已经有了巨大的性能改进。\n- 长期以来，`Java`\
  \ 一直是一个私有平台。即使在 Sun 公司之前宣布开源后，`Oracle` 和 `Google` 之间就 `Google Android` 中使用 `Java`\
  \ 发生了一场长期的版权大战。\n\n## Python 的不同之处\n\n我们简要讨论了如果我们不想使用 `Python` 时的最佳选择。它们是很棒的选择，但在你跳船之前，让我告诉为什么我选择\
  \ `Python` 而不是其他语言。\n\n- `Python` 是最容易学习的高级编程语言之一。这意味着从安装到编写程序的时间非常短。\n- 用 `Python`\
  \ 编写的代码更容易理解。它让程序员能够参考其他程序员编写的代码并将其调整到自己的项目中。\n- `Python` 是一种解释型语言。代码逐行执行，这使得初学者更易于进行调试。\n\
  - `Python` 代码可以在任何计算机上运行，不论是 `Windows`、`Linux`、`UNIX` 还是基于 `macOS` 的系统。\n- `Python`\
  \ 拥有庞大的标准库，为独特项目需求提供了各种方法。\n- `Python` 支持多种编码范式，包括面向对象编程 (`OOP`) 和函数式编程。\n- `Python`\
  \ 编程语言是免费开源的。这帮助建立了一个活跃的程序员社区，并且互联网上免费提供详细的教程。\n- 该语言的开源特性还让许多程序员通过编写特殊库来扩展 `Python`\
  \ 的功能。这些库在互联网上免费提供供所有人使用。\n- 通过 `Python` 创建图形用户界面 (`GUI`) 非常简单。\n- Python 最大的优点之一是它与不同编程语言集成的能力。你可以导入特定的库并开始用完全不同的语言编写代码，`Python`\
  \ 会理解这些代码。`Python` 支持与 `C++` 和 `Java` 的扩展集成。不仅如此，`Python` 代码可以放置在用另一种编程语言编写的代码内部。\n\
  \n这些是 `Python` 相比其他编程语言的通用优点。根据你的项目，`Python` 可能会提供更多收益。我们将看到 `Python` 如何让数据分析变得简单。\n\
  \n## 在数据分析中使用 Python 的优点\n\n### 擅长字符串\n\n`Python` 对字符串有特殊地位。`Python` 支持多种与字符串相关的操作。如果你处理的是字符串数据，这些操作在数据分析的解析和处理阶段非常有帮助。\n\
  \n### 专用库\n\n`Python` 中有专门的库来帮助数据分析项目变得更易处理。这些库定期更新，这意味着它们能够兼容最新的分析算法。\n\n`Python`\
  \ 上一些流行的数据分析库有：\n\n1. `NumPy`: 用于快速计算的数学函数集合\n2. `SciPy`: 提供先进的科学工具\n3. `Pandas`:\
  \ 使用数据结构对数学组件进行稳健处理\n4. `Matplotlib`: 提供数据可视化方法，包括折线图、柱状图和散点图\n\n### 高扩展性\n\n`Python`\
  \ 在处理大型复杂数据集方面非常高效。这种特性使得这种语言对于 `YouTube`、`Facebook` 和 `Amazon` 这样经常处理海量数据的公司来说无价之。\n\
  \n### 快速部署\n\n凭借简单的代码语法和直接的开发流程，与其他语言相比，使用 `Python` 创建和部署应用无疑更快。\n\n从大局来看，`Python`\
  \ 提供了最简单且最稳健的编码环境。它学习和部署应用更快。它与其他编程语言和技术良好地集成。如果你无法解决问题，互联网上有大量的免费教程和文档可以提供帮助。\n\
  \n所有这些特性使得 `Python` 成为编程语言中的最佳组合包。是的，你可能会发现另一种编程语言更适合你特定应用的需求，例如，对于 Web 应用，`JavaScript`\
  \ 更流行，而对于数据库，`SQL` 使用得更多。但从整体来看，`Python` 为你提供了 90% 编程任务所需的一切。\n\n在了解这一切之后，你仍然认为我坚持使用\
  \ `Python` 是一个错误吗？我个人认为这是一个伟大的决定。我告诉我的朋友这些观点，他对 `Python` 的多功能感到惊讶。每当我遇到有人问我他们应该从哪里开始编程时，我建议他们从\
  \ `Python` 开始。\n\n数据分析是一个多阶段的过程。`Python` 在数据分析过程的每个阶段都支持卓越的方法和程序。还有外部库进一步扩展 `Python`\
  \ 的功能。这使得 `Python` 适用于许多其他应用。\n\n### 1. Python 变量\n\n如果你计划编写复杂的代码，就必须包含会改变程序执行的数据。这就是你在这章中将学习的内容。在章节的末尾，你将学习“对象”一词如何解释\
  \ Python 中的每部分数据，并且将学习如何通过变量来更改对象。\n\nPython 编程中的变量正如其名所示，是 Python 中的数据类型。在编程世界中，变量是存储值的位置。你存储的值未来可能会根据描述而改变。\n\
  \n### 变量赋值\n\n将变量视为与特定对象的链接。在 Python 编程中，你不需要像其他编程语言那样在使用之前先声明变量。相反，你直接给变量赋值并开始使用。\n\
  \n\n\n\n首先，Python 是一种面向对象的语言。事实上，Python 中的每个数据项都是给定类型的对象。\n\n请考虑以下示例：\n\n当解释器遇到语句\
  \ `print (300)` 时，会发生以下情况：\n- 给其赋 `300` 的值。\n- 构建一个整数对象。\n- 将其输出到控制台。\n\nPython\
  \ 变量是作为指向对象的指针的符号名称。当给一个对象分配一个变量时，可以使用名称对该对象进行引用。然而，数据本身包含在对象内部。\n\n对象的生命周期从创建的那一刻开始；此时，对象可能有一个引用。在对象的生命周期内，可以创建指向该对象的其他引用。只要对象至少有一个引用，它就会保持活跃状态。\n\
  \n但当对对象的引用次数降为零时，它将无法再次被访问。这时就说对象的生命周期结束了。Python 最终会意识到它是不可访问的，并回收分配的空间以便将其用于其他用途。这个过程被称为`垃圾回收`。\n\
  \n## 对象标识\n\n在 Python 中创建的每个对象都会被分配一个数字来标识它。换句话说，在对象生命周期重叠期间，没有任何两个对象会共享相同的标识符。当对象引用的计数降为零并被垃圾回收时，对象的标识数字就会被收回再次使用。\n\
  \n![00038.jpeg](img/00006.jpeg)\n\n## 缓存小整数值\n\n根据你对 Python 中变量赋值和引用的了解，你不会对以下内容感到意外：\n\
  \n在这段代码中，Python 使用值 `300` 定义了整数类型对象并允许 `m` 指向它。同样，`n` 被分配了一个值为 `300` 的整数对象，但并不是一个不同的对象。让我们考虑以下：\n\
  \n在这个示例中，`m` 和 `n` 都被分别分配了持有值 `30` 的整数对象。但在这种情况下，`id(m)` 和 `id(n)` 是相似的。\n\n解释器会在开始时创建\
  \ `[-5, 256]` 之间的对象，并在稍后重用它们。因此，如果你为一个整数值分配唯一的变量，它们将指向同一个对象。\n\n## 变量名\n\n之前的示例使用了如\
