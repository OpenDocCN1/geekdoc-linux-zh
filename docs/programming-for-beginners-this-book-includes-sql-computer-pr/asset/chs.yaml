  \ 结构不完整，译文严格遵循原文呈现的对应关系)*\n\n上述查询表示，在 `Student` 表中将添加一个名为 `StudDepRel`（你可以使用任何名称）的外键约束，该约束将\
  \ `Student` 表的 `DepID` 列设置为外键，引用 `Department` 表的 `DepID` 列。\n\n### INNER JOIN\n\n\
  `INNER JOIN` 仅选择在两个表中都有匹配的记录。例如，为了显示学生的姓名以及他们所属部门的名称，由于“Student”表中没有部门名称列（仅包含部门\
  \ ID，该 ID 是指向 `Department` 表的外键），我们需要使用 `JOIN` 查询来从多个相互关联的表中选择列值。\n\n```sql\nSELECT\
  \ Student.StudName, Department.DepName\nFROM Student\nINNER JOIN Department ON Student.DepID\
  \ = Department.DepID\n```\n\n输出如下：\n\n### LEFT JOIN\n\n`LEFT JOIN` 选择左表的所有记录，以及右表中匹配的记录。如果右表中没有匹配，则右侧显示为\
  \ `NULL`。\n\n```sql\nSELECT Student.StudName, Department.DepName\nFROM Student\n\
  LEFT JOIN Department ON Student.DepID = Department.DepID\n```\n\n输出如下：\n\n| StudName\
  \ | DepName |\n| :--- | :--- |\n| Alice | English |\n| Alfred | Math |\n| Henry\
  \ | History |\n| Jacobs | Geography |\n| Bob | French |\n| Shane | French |\n| Linda\
  \ | French |\n| Stacy | English |\n| Wolfred | Math |\n| Sandy | English |\n| Colin\
  \ | English |\n| Maria | History |\n| Ziva | Geography |\n| Mark | Geography |\n\
  | Fred | Math |\n| Vic | NULL |\n| Nick | NULL |\n\n你可以看到，最后两个没有对应 `DepID` 的学生也被检索到了。\n\
  \n### RIGHT JOIN\n\n`RIGHT JOIN` 选择右表的所有记录，以及左表中匹配的记录。如果左表中没有匹配，则左侧显示为 `NULL`。\n\
  \n```sql\nSELECT Student.StudName, Department.DepName\nFROM Student\nRIGHT JOIN\
  \ Department ON Student.DepID = Department.DepID\n```\n\n输出如下：\n\n| StudName | DepName\
  \ |\n| :--- | :--- |\n| Stacy | English |\n| Sandy | English |\n| Colin | English\
  \ |\n| Alice | Math |\n| Wolfred | Math |\n| Fred | Math |\n| Alfred | History |\n\
  | Henry | History |\n| Maria | History |\n| Bob | French |\n| Shane | French |\n\
  | NULL | Geography |\n| NULL | Drawing |\n| NULL | Architecture |\n\n\n\n\n\n| Linda\
  \ | French |\n| Jacobs | Geography |\n| Ziva | Geography |\n| Mark | Geography |\n\
  | NULL | Drawing |\n| NULL | Architecture |\n\n### FULL JOIN\n\n`FULL JOIN` 是 `RIGHT\
  \ JOIN` 和 `LEFT JOIN` 的并集。`FULL JOIN` 从两个表中检索所有记录，无论关联表的 `Foreign key`（外键）和 `Primary\
  \ key`（主键）之间是否存在匹配。查看以下查询：\n\nQuery 4\n\n```sql\nSELECT Student.StudName, Department.DepName\n\
  From Student\nFull Join Department\nOn Student.DepID = Department.DepID\n```\n\n\
  查询 4 中代码的输出如下：\n\n| StudName | DepName |\n| Alice | Math |\n| Alfred | History |\n\
  | Henry | History |\n| Jacobs | Geography |\n| Bob | French |\n| Shane | French\
  \ |\n| Linda | French |\n| Stacy | English |\n| Wolfred | Math |\n| Sandy | English\
  \ |\n| Colin | English |\n| Maria | History |\n| Ziva | Geography |\n| Mark | Geography\
  \ |\n| Fred | Math |\n| Vic | NULL |\n| Nick | NULL |\n| NULL | Drawing |\n| NULL\
  \ | Architecture |\n\n### 3- Group By\n\n`Group By` 语句允许我们根据某些聚合函数的结果对数据进行分组。例如，如果你想显示每个部门的名称以及该部门学生的平均年龄，可以使用以下\
  \ `Group By` 语句：\n\nQuery 5\n\n```sql\nSELECT Department.DepName, AVG(Student.StudentAge)\
  \ as AverageStudentAge\nFrom Student\nRight Join Department\nOn Student.DepID =\
  \ Department.DepID\nGroup by DepName\n```\n\n上述查询将计算每个部门学生的平均年龄，并将其与每个部门名称对应显示。\n\
  \n| DepName | AverageStudentAge |\n| Architecture | NULL |\n| Drawing | NULL |\n\
  | English | 21 |\n| French | 22 |\n| Geography | 21 |\n| History | 19 |\n| Math\
  \ | 22 |\n\n### 4- Having\n\n由于 `Where` 子句不能用于过滤由聚合函数分组的数据，因此 SQL 中引入了 `Having`\
  \ 语句。例如，如果你只想检索学生平均年龄大于 20 的部门名称，可以使用以下 `Having` 语句：\n\nQuery 6\n\n```sql\nSELECT\
  \ Department.DepName, AVG(Student.StudentAge) as AverageStudentAge\nFrom Student\n\
  Right Join Department\nOn Student.DepID = Department.DepID\nGroup by DepName\nHaving\
  \ AVG(Student.StudentAge) > 20\n```\n\n查询 6 的结果如下：\n\n| DepName | AverageStudentAge\
  \ |\n| English | 21 |\n| French | 22 |\n| Geography | 21 |\n| Math | 22 |\n\n###\
  \ Exercise 8\n\n任务：\n\n对于每个部门，如果学生年龄在 21 到 24 之间，则显示该部门的名称和学生的最大年龄。\n\n#### 解决方案\n\
  \n```sql\nSELECT Department.DepName, Max(Student.StudentAge) as Age\nFrom Student\n\
  Right Join Department\nOn Student.DepID = Department.DepID\nGroup by DepName\nHaving\
  \ Max(Student.StudentAge) Between 21 AND 24\n```\n\n# 11. 表达式\n\n当运算符、函数和值以这种方式结合，使得可以求值并计算出一个值时，这种组合被称为表达式。你可以将\
  \ SQL 表达式想象成使用 SQL 语法编写的数学公式。为了帮助你理解典型的 SQL 表达式像什么样，让我们举一个例子。\n\n```sql\nSELECT\
  \ col1, col2, colN FROM t_name WHERE [exp];\n```\n\n在给出的示例中，表达式正在执行 `SELECT` 操作，并请求从表\
  \ `t_name` 选择第 1 到 N 列。必须输出对应于表达式求值为真的的行结果。SQL 支持三种类型的表达式，每种类型将在下文中进行讨论。\n\n## 布尔表达式\n\
  \n在布尔表达式的情况下，数据的获取在匹配单个值后进行。此类表达式的语法如下——\n\n```sql\nSELECT col1, col2, colN FROM\
  \ t_name WHERE exp_matching_single_value;\n```\n\n该语句从 `t_name` 表中选择第 1 到 N 列，并输出满足\
  \ `exp_matching_single_value` 指定条件的行。为了更好地理解布尔表达式，让我们举一个例子。考虑一个名为 `CUSTOMERS` 的表。下面的\
  \ SQL 语句将打印 `CUSTOMERS` 表中的所有记录。\n\n```sql\nSELECT * FROM CUSTOMERS;\n```\n\n输出通常看起来如下——\n\
  \n| ID | Name | Age | Salary |\n| 98701 | Rohan | 45 | 50000.00 |\n| 98675 | Amit\
  \ | 32 | 37000.00 |\n| 98706 | Shayla | 22 | 12000.00 |\n| 98718 | Mathews | 37\
  \ | 41000.00 |\n\n下面的 SQL 语句是布尔表达式的最简单示例。\n\n```sql\nSELECT * FROM CUSTOMERS WHERE\
  \ Salary=37000;\n```\n\n该查询的执行将返回以下结果。\n\n| ID | Name | Age | Salary |\n| 98675\
  \ | Amit | 32 | 37000.00 |\n\n## 数值表达式\n\n数值类型的表达式通常用于执行数学运算。此类表达式的语法如下：\n\n```sql\n\
  SELECT formula_arith FROM t_name WHERE cond;\n```\n\n这里 `formula_arith` 是任何数学公式，`t_name`\
  \ 是表名，`cond` 是条件。演示其工作的简单示例如下：\n\n```sql\nSELECT (100+76) AS ADD;\n```\n\n## 日期表达式\n\
  \n此类表达式通常用于获取有关日期或时间的信息。示例语句如下：\n\n```sql\nSELECT CURRENT_TIMESTAMP;\nSELECT GETDATE();\n\
  ```\n\n# 12. 序列与注入\n\n在进入本章之前，请确保你已经理解了本书的其他部分。我们将讨论 SQL 中一些复杂的元素，例如自增和注入。如果你在这一章遇到困难，不要担心，让我们深入吧！\n\
  \n### 自增\n\nSQL 可以实现自增。对于初学者来说，增加一个值意味着将其增加一个指定的数字。通常，这个数字是 1，通常这个值是一个整数。\n\nSQL\
  \ 的 `AUTO-INCREMENT` 函数允许在每次调用时自动增加一个数字。现在，这初看起来可能有些陌生。这就是为什么我们要给你一个 SQL `AUTO INCREMENT`\
  \ 函数用用的通用示例。\n\n```sql\nCREATE TABLE Table1\n(\nID int NOT NULL AUTO_INCREMENT,\n\
  Name varchar(200) NOT NULL,\nTitle varchar(200),\nLocation varchar(200),\nCountry\
  \ varchar(255),\nPRIMARY KEY (ID)\n)\n```\n\n这是 SQL 如何执行自增的一个极佳示例。对于 MySQL 等方言，也存在\
  \ `AUTO_INCREMENT` 等替代方案。根据默认，如果没有声明，起始值将被假设为 1，并且每次循环运行时都会增加 1。\n\n如果 1 不是你想要开始的值，请使用以下语法：\n\
  \n```sql\nALTER TABLE Table1 AUTO_INCREMENT=X\n```\n\n其中 `X` 是你想要增加的数字。如果你正在尝试在例如表\
  \ 1 中启动一个新的数据点，那么你不需要为每个值指定。\n\n例如，假设表 1 包含这些人。\n\n```sql\nINSERT INTO Students\
  \ (Name,Title)\nVALUES (‘Ilija’,’Mr’)\n```\n\n该语句将在 table1 中创建一个全新的数据点，并插入一个名为 Ilija、前缀为\
  \ Mr 的人员。自然地，这些列将反映这些变化。\n\n\n\n\n现在，我们之前以一种简单的方式处理过这个问题，但是，有多种方法可以从某个值开始编号，并根据你的需要按较大或较小的数字递增。\n\
  \n这非常有用，例如，当你给学生评分时，你只需要以 10 分为步进的各种分数，因此你可以轻松地编写一个程序，根据分数自动为每个学生填入等级。\n\n总的来说，这是\
  \ SQL 容易学习的特性之一。以下是从较大的起始值按数字 `N` 递增的语法：\n\n```sql\nCREATE TABLE Table1\n(\nID int\
  \ 10 AUTO_INCREMENT,\nName varchar(200) NOT NULL,\nTitle varchar(200),\nLocation\
  \ varchar(200),\nCountry varchar(255),\nPRIMARY KEY (ID)\n)\nALTER TABLE Table1\
  \ AUTO_INCREMENT=N\n```\n\n很简单吧？太棒了！现在继续尝试你自己的练习，让你的想象力飞翔吧。\n\n## 防止 SQL 注入\n\n\
  现在，SQL 注入是初学者 SQL 开发者最常见的错误之一。在本节中，我们将尝试教你如何防止这种安全问题发生在你身上，尽管这些都是基础知识，你完全可以就这个主题轻松地写另一整本书。\n\
  \n通常，当你通过网页获取用户输入时就会发生注入。在将其插入 SQL 数据库之后，可能会发生各种事情。哎，你可能会意外地获得一个直接在你的数据库中运行的 SQL\
  \ 语句。\n\n这意味着通过你的网页插入病毒是非常容易，因为他们可能会给你一个 SQL 命令，而不是比如他们的名字或订单。当这种情况发生时，可能会导致灾难性的后果。这通常通过限制用户可以输入的内容来约束。例如，以下脚本限制了用于排序的字符数量在\
  \ 6 到 40 个之间。\n\n```php\nif (found_match(\"/^\\w{4,40}$/\", $_GET['order'], $matches))\
  \ {\n  $result = mysql_query(\"SELECT * FROM BUYS WHERE name = $matches[false]\"\
  );\n} else {\n  echo \" You have entered an invalid order\";\n}\n```\n\n如果你想知道人们到底是如何做到的，让我们假设用户给出以下输入：\n\
  `$name= “A”; DELETE FROM BUYS;`\n`mysql_query( “SELECT FROM BUYS WHERE order='{$order}’`\n\
  \n现在，这在处理时将运行插入到 `order` 字段中的查询。正如你所看到的，此查询将直接删除你所有的所有的订单。想象一下，一家公司必须从所有订单完全丢失中恢复过来？没错，他们非常不喜欢那样，而且他们的\
  \ SQL 开发者可能要被开除了。\n\n尽管如此，大多数现代 SQL 派变体（如 `MySQL`）不允许你堆叠 SQL 函数。这是一件好事，因为如果用户尝试这样做，会导致失败。\n\
  \n`MySQL` 的少数救星之一是，它会禁止每一个嵌套在另一个调用中的 `mysql_query()` 调用。这有助于你防止 SQL 注入。\n\n其他基于\
  \ PHP 的数据库扩展并不那么友好。例如，`SQLite` 会让你的用户堆叠查询，并执行告诉他们的一切。这也是它们通常不被大公司使用的原因之一。\n\n# 13.\
  \ 创建数据库和定义表关系\n\n在本书中，我们将采用逐步的方法来解释不同的 SQL 概念。我们将从实体关系图（ERD）开始，它是数据库的蓝图。ERD 定义了数据库方案。然后我们将根据该方案创建我们的数据库。下一步是在数据库中添加一些数据。一旦我们有了包含数据的数据库，我们就可以对其进行实验了。所以，让我们从\
  \ ERD 开始。\n\n## 实体关系图 (ERD)\n\nERD 是数据库方案的图形化表示。ERD 包含了数据库中的表、表中的列以及表之间的关系。\n\n\
  我们在本书中开发的数据库是一个医院数据库。它将包含六张表：Patients（病人）、Treatment（治疗）、Doctors（医生）、Examinations（病人检查）和\
  \ Patient_Visits（病人就诊）。图 2.1 包含了医院数据库的 ERD。\n\n医院数据库 ERD 包含了数据库中所有的表及其关系。这些关系将在本章后面解释。\n\
  \n## 创建数据库\n\n我们已经有了 ERD，现在我们必须根据 ERD 定义实际创建数据库。让我们执行本书的第一个查询。此查询将在数据库服务器上创建数据库。\n\
  \n```sql\nCREATE DATABASE Hospital;\n```\n\n`CREATE database` 查询的语法非常简单，你必须使用关键字\
  \ `CREATE DATABASE` 后跟着数据库的名称。你可以给你的数据库起任何名称。\n\n**注意：**\n这里也很重要的一点是 SQL 是不区分大小写的。值得提到的是，我们在本书中使用\
  \ MS SQL Server 2017 作为我们的 DBMS。你可以使用任何其他关系数据库系统，如 `MySQL`、`SQL Lite` 等。核心 SQL 对所有数据库都是相似的，只有细微差异。\n\
  \n你可以如下编写上述查询：\n\n```sql\nCreate database Hospital;\n```\n没有区别。\n\n## 删除数据库\n\n\
  要删除现有数据库，我们使用 `DROP DATABASE` 查询。例如，如果你想删除我们创建的 Hospital 数据库，请执行以下查询：\n\n```sql\n\
  DROP DATABASE Hospital;\n```\n\n在继续之前，如果你删除了它，请重新创建 Hospital 数据库，因为在下一节中我们将在其中创建表。\n\
  \n## 创建表\n\n我们有了 ERD，现在我们必须根据 ERD 定义实际创建我们的数据库。让我们执行本书的第一个查询。此查询将在数据库服务器上创建数据库。\n\
  \n我们已经创建了 Hospital 数据库，但目前它是空的。数据库存储数据。因此，创建数据库的第一步是创建表。\n\n根据原则，先创建独立表，然后创建依赖表。如果一个表不包含任何外键，则它就是独立的，反之亦然。表之间的关系定义了依赖性和独立性。\n\
  \n创建表的语法如下：\n\n```sql\nCREATE TABLE table_name\n(\nColum1_name data_type constraints,\n\
  Colum2_name data_type constraints,\n)\n```\n\n现在让我们使用这种语法创建 `Patients` 表。在你的数据库上执行以下查询以创建表。\n\
  \n```sql\nUSE Hospital;\nCREATE Table Patients\n(\nId int IDENTITY (1,1) PRIMARY\
  \ KEY NOT NULL,\nname VARCHAR (50) NOT NULL,\nage int NOT NULL,\ngender VARCHAR\
  \ (50) NOT NULL,\nblood_group VARCHAR (50),\nphone BIGINT\n);\n```\n\n上述查询的第一行是\
  \ `USE Hospital`。`USE` 命令用于指定你要创建数据库的数据库。我们在 Hospital 数据库中创建 `Patients` 表，因此通过 `USE`\
  \ 命令提到了它。\n\n看看我们是如何定义 `Patients` 表的。定义列从列名开始，后面是该列存储的数据类型以及键列的约束。例如，`Patients`\
  \ 中的第一个列是 `id` 列。列定义的第三部分是约束规范。约束对表列实施某些规则。`id` 列有三个约束：\n\n注意 `Patients` 表中的列与 ERD\
  \ 中定义的病人表相对应。\n\n同样，使用以下查询创建 `Doctors` 和 `Examinations` 表：\n\n```sql\nUSE Hospital\n\
  CREATE Table Doctors\n(\nId int IDENTITY (1,1) PRIMARY KEY NOT NULL,\nname VARCHAR\
  \ (50) NOT NULL,\ndesignition VARCHAR (50),\nspecialization VARCHAR (50),\n);\n\n\
  USE Hospital\nCREATE Table Examinations\n(\n```\n\n\n\n\n```sql\nid int IDENTITY\
  \ (1,1) PRIMARY KEY NOT NULL,\nname VARCHAR (50) NOT NULL,\nprice int NOT NULL,\n\
  );\n```\n\n我们已经创建了三个独立表。下一步是创建依赖表，即 `Patient_Examination`、`Treatments` 和 `Patient_Visits`\
  \ 表。这些表与 `Patients` 表建立了关系。在创建这些表之前，让我们先学习数据库表之间可以具有的关系类型。\n\n## 表关系\n\n在关系型数据库中，表之间有三种主要的关系：\n\
  \n- 一一对一 (One to One Relation)\n- 一对多 (One to Many Relation)\n- 多对多 (Many to Many\
  \ Relation)\n\n### 一对一关系\n\n在一对一关系中，对于第一个表中的一条记录，相关或依赖表中可以有且仅有一个记录。一对一关系的一个简单例子是患者与其联系信息之间的关系。一个患者可以有一份联系信息，而特定的联系信息只属于一个患者。在大多数情况下，会避免使用一对一关系，并且参与一对一关系的表会被合并在一起。例如，你可以在一个表中包含患者信息（如姓名、姓氏、出生日期）和联系信息（如电话、地址、电子邮箱）。\n\
  \n### 一对多关系\n\n在一对多关系中，第一个表中的每条记录都可以被第二个表中的多条记录引用。例如，在我们的医院数据库中，`Patients` 和 `Patient_Visits`\
  \ 表是一一对多关系。对于 `Patients` 表中的每条记录，`Patient_Visits` 表中可以有多条记录。简单来说，一个患者可以多次访问医院；但某一次就诊只属于一个人。\n\
  \n要在数据库中实现一对多关系，我们必须在关系处于“多”的一侧的表中添加外键。该外键引用关系处于“一”的一侧的表的主键。在 `Patients` 和 `Patient_Visits`\
  \ 表的中，后者将有一个外键列，引用前一个表的主键。让我们使用查询来实现它。\n\n```sql\nUSE Hospital\n\nCREATE Table Patient_Visits\
  \ (\nid int IDENTITY(1,1) PRIMARY KEY NOT NULL,\npatient_id int FOREIGN KEY REFERENCES\
  \ Patients(id),\nvisit_time DATETIME NOT NULL\n);\n```\n\n上面的脚本在 `Hospital` 数据库中创建了\
  \ `Patient_Visits` 表。它还实现了 `Patient` 和 `Patient_Visits` 表之间一对多的关系。查看上述脚本中的这一行代码：\n\
  \n```sql\npatient_id int FOREIGN KEY REFERENCES Patients(id),\n```\n\n这在 `Patient_Visits`\
  \ 表中创建了一个外键列 `patient_id`。该列引用 `Patients` 表的 `id` 列。这就是我们如何在数据库中实际实现一对多关系。\n\n###\
  \ 多对多关系\n\n在多对多关系中，第一个表中的每条记录都可以被第二个表中的多条记录引用。同样，第二个表中的每条记录也可以被第一个表中的多条记录引用。例如，一个患者可以多次检查；同样，一次检查也可以由多位患者进行。换句话，对于\
  \ `Patients` 表中的每条记录，`Patient_Examination` 表中可以有多条记录，反之亦然。\n\n多对多关系通常通过中间表（junction\
  \ table）拆分为两个一对多关系。参与多对多关系的两个表与中间表都有一对多关系。中间表包含了所有参与多对多关系的表的外键。在 `Hospital` 表的 ER\
  \ 图中，我们将 `Patient_Examination` 表定义为中间表，以实现 `Patients` 和 `Examinations` 表之间一对多的关系。这个\
  \ `Patient_Examination` 表将有两个外键：一个引用 `Patients` 表的主键列，另一个引用 `Examinations` 表的主键列。下面的脚本在医院数据库中创建了\
  \ `Patient_Examination` 表。\n\n```sql\nCREATE Table Patient_Examination(\nid int\
  \ IDENTITY(1,1) PRIMARY KEY NOT NULL,\npatient_id int FOREIGN KEY REFERENCES Patients(id),\n\
  examination_id int FOREIGN KEY REFERENCES Examinations(id),\nresult VARCHAR(50)\n\
  );\n```\n\n同样，`Patients` 和 `Doctors` 之间也存在一对多关系，因为一个患者可以被许多医生治疗，而一个医生也可以治疗许多患者。这里\
  \ `Treatments` 表是实现 `Patient` 和 `Doctors` 表之间关系的中间表。创建 `Treatments` 表的脚本如下：\n\n\
  ```sql\nCREATE Table Treatment(\nid int IDENTITY(1,1) PRIMARY KEY NOT NULL,\npatient_id\
  \ int FOREIGN KEY REFERENCES Patients(id),\ndoctor_id int FOREIGN KEY REFERENCES\
  \ Doctors(id),\nremarks VARCHAR(50)\n);\n```\n\n# 14. 使用运算符过滤，使用 ORDER BY 排序\n\n\
  在本章中，我们将学习如何结合 `WHERE` 子句使用不同类型的 SQL 运算符来过滤数据。\n\n## SQL 运算符\n\nSQL 中有四种主要的运算符：\n\
  \n- 比较运算符\n- 复合连接运算符\n- 逻辑运算符\n- 否定运算符\n\n## WHERE 子句\n\n在详细学习 SQL 运算符之前，我们需要先理解\
  \ `WHERE` 子句。`WHERE` 子句根据查询中使用的运算符过滤记录。`WHERE` 子句的语法非常简单。让我们来看一个简单的 `WHERE` 子句示例。此查询过滤出所有\
  \ `id` 大于 5 的患者记录。\n\n```sql\nSELECT * FROM Patients\nWHERE id > 5\n```\n\n上述查询的输出结果如下：\n\
  \n| name | age | gender | blood_group | phone |\n| :--- | :--- | :--- | :--- | :---\
  \ |\n| Julie | 26 | Female | A+ | 1247963 |\n| Frank | 35 | Male | A- | 85473216\
  \ |\n| Alex | 21 | Male | AB- | 46971235 |\n| Hales | 54 | Male | B+ | 74698125\
  \ |\n| Elice | 32 | Female | O+ | 34169872 |\n\n现在，让我们详细学习 SQL 运算符。\n\n### 比较运算符\n\
  \nSQL 比较运算符细分为六类。这些运算符通过比较操作数来过滤记录。\n\n- `=` (等于)\n- `<>` (不等于)\n- `<` (小于)\n- `>`\
  \ (大于)\n- `<=` (小于等于)\n- `>=` (大于等于)\n\n每个运算符的工作原理通过示例进行了演示。来看它们：\n\n#### 等于 (=)\n\
  \n```sql\nSELECT * FROM Patients\nWHERE name = 'Frank'\n```\n\n上述查询返回名为 'Frank'\
  \ 的患者。\n\n#### 不等于 (!=)\n\n```sql\nSELECT * FROM Patients\nWHERE name != 'Frank'\n\
  ```\n\n上述查询返回除 'Frank' 以外的所有患者记录。\n\n#### 小于 (<)\n\n```sql\nUPDATE Examinations\n\
  SET price = price * 1.1\nWHERE price < 250\n```\n\n上述查询更新 `Examinations` 表中价格小于\
  \ 250 的 `price` 列。\n\n#### 大于 (>)\n\n```sql\nSELECT * FROM Patients\nWHERE id >\
  \ 5\n```\n\n#### 小于等于 (<=)\n\n```sql\nSELECT * FROM Patients\nWHERE age <= 30\n\
  ```\n\n上述查询从 `Patients` 表中选择年龄小于或等于 30 的记录。上述查询的输出如下：\n\n| id | name | age | gender\
  \ | blood_group | phone |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 1 | Tom\
  \ | 20 | Male | O+ | 1235897 |\n| 3 | James | 16 | Male | O- | 78452369 |\n| 5 |\
  \ Sal | 24 | Male | O+ | 48963214 |\n| 6 | Julie | 26 | Female | A+ | 1247963 |\n\
  | 8 | Alex | 21 | Male | AB- | 46971235 |\n\n#### 大于等于 (>=)\n\n```sql\nSELECT *\
  \ FROM Patients\nWHERE age >= 30\n```\n\n上述查询从 `Patients` 表中选择年龄大于或等于 30 的记录。上述查询的输出如下：\n\
  \n| id | name | age | gender | blood_group | phone |\n| :--- | :--- | :--- | :---\
  \ | :--- | :--- |\n| 2 | Kimer | 45 | Female | AB+ | 45686412 |\n| 4 | Matty | 43\
  \ | Female | B+ | 15789634 |\n| 7 | Frank | 35 | Male | A- | 85473216 |\n| 9 | Hales\
  \ | 54 | Male | B+ | 74698125 |\n| 10 | Elice | 32 | Female | O+ | 34169872 |\n\n\
  \n\n\n在之前的示例中，我们只使用了一个操作符来过滤数据。如果我们想过滤满足多个条件的记录，可以使用合取操作符（Conjunctive operators）。SQL\
  \ 中有两种常用的合取操作符。\n\n- `AND`\n- `OR`\n\n让我们来看看它们的实际用法：\n\n### AND\n```sql\nSELECT\
  \ * FROM Patients\nWHERE age > 30 AND gender = 'Female'\n```\n上述查询将检索所有年龄大于 30 且性别为女性的患者记录。上述查询的输出如下：\n\
  \n| id | name | age | gender | blood_group | phone |\n| :--- | :--- | :--- | :---\
  \ | :--- | :--- |\n| 2 | Kimer | 45 | Female | AB+ | 45686412 |\n| 4 | Matty | 43\
  \ | Female | B+ | 15789634 |\n| 10 | Elice | 32 | Female | O+ | 34169872 |\n\n###\
  \ OR\n```sql\nSELECT * FROM Patients\nWHERE age > 30 OR gender = 'Female'\n```\n\
  此查询将选择所有年龄大于 30 或性别为女性的患者记录。上述查询的输出为：\n\n| id | name | age | gender | blood_group\
  \ | phone |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 2 | Kimer | 45 | Female\
  \ | AB+ | 45686412 |\n| 4 | Matty | 43 | Female | B+ | 15789634 |\n| 6 | Julie |\
  \ 26 | Female | A+ | 12478963 |\n| 7 | Frank | 35 | Male | A- | 85473216 |\n| 9\
  \ | Hales | 54 | Male | B+ | 74698125 |\n| 10 | Elice | 32 | Female | O+ | 34169872\
  \ |\n\n## 逻辑操作符\n\n以下是 SQL 中最常用的逻辑操作符：\n\n- `IN`\n- `BETWEEN`\n- `LIKE`\n- `DISTINCT`\n\
  - `IS NULL`\n\n### IN\n`IN` 操作符用于根据 `IN` 操作符中指定的值来过滤记录。`IN` 操作符接受括号内用逗号分隔的值作为输入。例如，如果你想检索所有血型为\
  \ O+ 或 O- 的患者记录，可以使用如下方式的 `IN` 操作符：\n\n```sql\nSELECT * FROM Patients\nWHERE blood_groupIN('O+','O-')\n\
  ```\n上述查询的输出将是血型为 O+ 或 O- 的患者记录，如下所示：\n\n| id | name | age | gender | blood_group\
  \ | phone |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 1 | Tom | 20 | Male\
  \ | O+ | 123589746 |\n| 3 | James | 16 | Male | O- | 78452369 |\n| 5 | Sal | 24\
  \ | Male | O+ | 48963214 |\n| 10 | Elice | 32 | Female | O+ | 34169872 |\n\n###\
  \ BETWEEN\n`BETWEEN` 操作符用于过滤落在指定范围内的记录。该范围使用 `AND` 操作符指定。例如，如果你想检索 id 在 3 到 7 之间的所有患者，可以使用如下方式的\
  \ `BETWEEN` 操作符：\n\n```sql\nSELECT * FROM Patients\nWHERE id BETWEEN 3 AND 7\n```\n\
  上述查询的输出如下：\n\n| id | name | age | gender | blood_group | phone |\n| :--- | :---\
  \ | :--- | :--- | :--- | :--- |\n| 3 | James | 16 | Male | O- | 78452369 |\n| 4\
  \ | Matty | 43 | Female | B+ | 15789634 |\n| 5 | Sal | 24 | Male | O+ | 48963214\
  \ |\n| 6 | Julie | 26 | Female | A+ | 12478963 |\n| 7 | Frank | 35 | Male | A- |\
  \ 85473216 |\n\n### LIKE\n`LIKE` 操作符根据字符串匹配来获取记录。例如，如果你想选择所有名字以 ‘J’ 开头的患者记录，可以使用\
  \ `LIKE` 操作符。`LIKE` 操作符使用两个通配符进行字符串匹配。它们分别用百分号（`%`）和下划线（`_`）表示。`%` 通配符指定任意数量的字符，而\
  \ `_` 指定单个字符。因此，如果你想获取所有名字以 J 开头的患者，可以使用如下方式的 `like` 操作符：\n\n```sql\nSELECT * FROM\
  \ Patients\nWHERE name LIKE('J%')\n```\n在这里你可以看到我们使用了 `%` 通配符。这里 `J%` 意味着名字应该以 J\
  \ 开头，之后可以有任意数量的字符。此查询的输出将：\n\n| id | name | age | gender | blood_group | phone |\n\
  | :--- | :--- | :--- | :--- | :--- | :--- |\n| 3 | James | 16 | Male | O- | 78452369\
  \ |\n| 6 | Julie | 26 | Female | A+ | 12478963 |\n\n同样，如果你想选择所有 ‘a’ 是名字第二个字符的记录，可以使用如下方式的\
  \ `_` 通配符：\n\n```sql\nSELECT * FROM Patients\nWHERE name LIKE('_a%')\n```\n这里 `_a%`\
  \ 指定在字符 ‘a’ 之前仅有一个字符，之后可以有任意数量的字符。此查询的输出如下：\n\n| id | name | age | gender | blood_group\
  \ | phone |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 3 | James | 16 | Male\
  \ | O- | 74452369 |\n| 4 | Matty | 43 | Female | B+ | 15789634 |\n| 5 | Sal | 24\
  \ | Male | O+ | 48963214 |\n| 10 | Elice | 32 | Female | O+ | 34169872 |\n\n###\
  \ DISTINCT\n`DISTINCT` 关键字用于返回不同的（唯一的）值。\n\n### IS NULL\n`IS NULL` 操作符用于测试列中的空值。\n\
  \n\n\n\n| id | name | age | gender | blood_group | phone |\n| :--- | :--- | :---\
  \ | :--- | :--- | :--- |\n| 3 | James | 16 | 男性 | O- | 78452369 |\n| 1 | Tom | 20\
  \ | 男性 | O+ | 123589746 |\n| 8 | Alex | 21 | 男性 | AB- | 46971235 |\n| 5 | Sal |\
  \ 24 | 男性 | O+ | 48963214 |\n| 6 | Julie | 26 | 女性 | A+ | 12478963 |\n| 10 | Elice\
