  \ | 54 | 男性 | B+ | 74698125 |\n\n默认情况下，如果排序列是整数，数据按升序排列；如果通过字符串列实现排序，则按字母顺序排列。然而，你可以可以通过\
  \ `ORDER BY` 子句后添加 `DESC` 来反转默认排序的输出。\n\n以下查询从 `Patients` 表中按字母倒序检索记录。\n\n```sql\n\
