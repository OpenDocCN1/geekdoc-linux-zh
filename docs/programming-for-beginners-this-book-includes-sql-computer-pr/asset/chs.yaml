  \n\n\n\n下一步是确保你能够实际应用手册中的信息。你还可以制定一个计划，让自己学习更多关于 Kali Linux 的知识。\n\n研究表明，网络应用程序、服务器和网络都存在漏洞。作为外部攻击者和渗透测试员，你可以在发起攻击时利用这些漏洞。你必须确保自己有目标，以便在执行测试和攻击时保持动力。\n\
