  \n请记住，小写字母和大写字母是不同的。使用下划线字符同样重要：\n\n没有任何会阻止你在同一个程序中定义两个名称如 `number` 和 `Number` 的变量。然而，完全不建议这样做。这绝对会困扰任何阅读你代码的人，甚至在你离开代码一段时间没回来后，连你自己也会感到困惑。\n\
