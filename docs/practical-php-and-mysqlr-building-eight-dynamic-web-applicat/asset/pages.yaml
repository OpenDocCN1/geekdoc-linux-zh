- pgno: 401
  md: 'EXAMPLE 10-1 The configuration file is separate from the main configuration
    file of your Web site.


    ```

    "<?php


    $dbhost = "localhost";

    $dbuser = "root";

    $dbpassword = "";

    $dbdatabase = "phphomeproject";


    $config_headerfile = "http://localhost/sites/homeproject/header.php";

    $config_footerfile = "http://localhost/sites/homeproject/footer.php";


    $config_projecturl = "http://localhost/sites/homeproject/";

    $config_projectdir = "/opt/lampp/htdocs/sites/homeproject/";


    $config_projectadminbasedir =

    "http://localhost/sites/homeproject/admin/";

    $config_projectadminfilename = "admin.php";


    $config_projectscreenthumbssize = 300;

    ??>"

    ```


    In addition to the normal database settings, this configuration file includes
    a number of other options:


    +   - $config_headerfile and $config_footerfile. The location of the header and
    footer files in the Web application.


    +   - $config_projecturl. The URL where you can find phphomeproject.


    +   - $config_projectdir. The directory that includes phphomeproject. Use this
    directory when copying new releases and screenshots to the releases and screenshots
    directories.


    +   - $config_projectadminbasedir. The location of the admin directory.


    +   - $config_projectadminfilename. The name of the file (such as admin.php) used
    to access the admin functionality.


    +   - $config_projectscreenthumbssize. The width to which thumbnails should be
    set when viewing screenshots.


    It is important to remember that you are developing phphomeproject in a separate
    directory, which is independent of an existing Web site. When phphomeproject is
    deployed in an application, these settings need to be changed to reflect the existing
    site (for example, changing $config_projecturl to http://www.mysite.com/projects/).
    You will deploy the site later in the chapter.'
  merge: -1
  img_proc: true
- pgno: 402
  md: "# ## Accessing the Database\n\nIn the base directory (phpomeoproject), create\
    \ *db.php* and add the connection code shown in Example 10-2.\n\n# EXAMPLE 10-2\
    \ This file is no different from other projects.\n\n```\n```php\n<?php\n    require(\"\
    phpomeoprojectconfig.php\");\n    $db = mysql_connect($dbhost, $dbuser, $dbpassword);\n\
    \    mysql_select_db($databatabase, $db);\n?>\n```\n```\n\n# ## Creating the Functions\n\
    \nThis project uses two custom functions in addition to *pf_fix_slashes()* and\
    \ *pf_check_number()* from previous projects. In the base directory, create a\
    \ new file called *functions.php* and add the configuration file:\n\n```\n```php\n\
    <?php\n    require(\"phpomeoprojectconfig.php\");\n    Add pf_protect_nonadmin_page():\n\
    \    require(\"phpomeoprojectconfig.php\");\n    function pf_protect_nonadmin_page()\
    \ {\n        if(basename($_SERVER['SCRIPT_NAME']) != \"index.php\") {\n      \
    \      echo \"<h1>Error</h1>\";\n            echo \"You cannot access this page\
    \ directly. Please go to the main project pages directly.\";\n            exit;\n\
    \        }\n    }\n```\n```\n\nThe *pf_protect_nonadmin_page()* function protects\
    \ individual pages from direct access. If you refer to Figure 10-1, you can see\
    \ that a page such as *download.php* is included in *project-main.php*, which\
    \ is in turn included in *index.php*. Naturally, you don't want users to access\
    \ *download.php* directly. This function simply checks to see if the name of the\
    \ current page is different from *index.php*. If so, an error is displayed. Currently,\
    \ this function is hard coded to *index.php*, so you might want to adjust this\
    \ code to work with files not called *index.php*."
  merge: -1
  img_proc: true
- pgno: 403
  md: "Use a similar technique to protect the admin pages:\n\n```\n```\n    exit;\n\
    }\n}\n\nfunction pf_protect_admin_page() {\n    global $config_projectadminfilename;\n\
    \n    if(basename($_SERVER['SCRIPT_NAME'])\n    != $config_projectadminfilename)\
    \ {\n        echo \"<h1>Error</h1>\";\n        echo \"You cannot access this page\
    \ directly. Please go to the admin pages directly.\";\n        exit;\n    }\n\
    }\n```\n```\n\nThe only difference here is that the function checks what the name\
    \ of the admin page is set to. You can’t assume that the admin page should be\
    \ called _index.php_, because the _index.php_ file in an _admin_ directory may\
    \ administer a different part of the site. To solve this problem, the function\
    \ refers to the $config_projectadminfilename setting in the configuration file.\n\
    \nThe first line of the function uses the **global** keyword to access a variable\
    \ outside the scope of the function, and the variable is checked in the **if**\
    \ statement.\n\n# **NOTE**\n**Understanding Variable Scope**\n\nVariable scope\
    \ is a problem that confuses many newcomers to a language. The basic concept is\
    \ that a variable is accessible within the scope of whatever block in which it\
    \ was created. This is fine in most scripts because the variable was created outside\
    \ of a function and is therefore accessible by anything.\n\nWhen you use a function,\
    \ however, only the function knows about the variable created inside it. To access\
    \ the variable outside the function, you need to add this line before you use\
    \ it:\n\n```\n```php\nglobal <variableName>\n```\n```\n\nThe variable is now accessible.\n\
    \nAdd the functions you already know and love:"
  merge: -1
  img_proc: true
