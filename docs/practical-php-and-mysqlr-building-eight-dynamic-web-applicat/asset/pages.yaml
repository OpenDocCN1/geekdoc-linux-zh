- pgno: 309
  md: "On the first line, you check the status of the request. The *readyState* method\
    \ can return one of five possible status codes. These codes are shown in Table\
    \ 8-2.\n\nTABLE 8-2 Use *readyState* to check which status code the request currently\
    \ has.  \n\n| CODE | MEANING |  \n| :--- | :--- |  \n| 0 | Uninitialized |  \n\
    | 1 | Loading |  \n| 2 | Loaded |  \n| 3 | Interactive |  \n| 4 | Finished |\n\
    \nIf the returned code is 4 (Finished), the returned text from the query (referred\
    \ to with *responseText*) is stored in a variable called *response*. You now use\
    \ the *getElementById* method to refer to the *eventage* <div> in the sidebar\
    \ and use the *innerHTML* method to change the contents of the <div> to the contents\
    \ of the response variable.\n\nAs shown in Example 8-10, create the *internal_request.php*\
    \ page that you referred to earlier in the *getEvent()* function.\n\n> EXAMPLE\
    \ 8-10 This code simply requests the record that matches the id GET variable.\n\
    \n```\n```php\n<?php\n\nsession_start();\n\nrequire('db.php');\nrequire('config.php');\n\
    \nif(isset($_SESSION['LOGGEDIN']) == FALSE) {\n    header(\"Location: \" . $config_baseDir);\n\
    }\n\nif($_GET['action'] == 'getevent'){\n    $sql = \"SELECT * FROM events WHERE\
    \ id = \" . $_GET['id'] . \";\";\n    $result = mysql_query($sql);\n    $row =\
    \ mysql_fetch_assoc($result);\n    echo \"<h1>Event Details</h1>\";\n```\n```"
