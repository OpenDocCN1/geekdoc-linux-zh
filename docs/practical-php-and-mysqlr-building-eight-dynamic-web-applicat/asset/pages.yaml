- pgno: 439
  md: '# C H A P T E R  1 1


    # Building a News Web Site


    With the rapid spread of the Internet, news has become an essential resource,
    read-ily available at your fingertips. With the click of a search engine, it is
    possible to expose yourself to both general and niche news that covers virtually
    any subject.


    Although the design may seem complex at first, news sites are fundamentally simple
    database-driven Web sites. News stories and categories are typically stored in
    a database, and this information is formatted and presented to readers in a usable
    and attractive way.


    In this chapter you will create your own news site, one that is craftily con-structured
    to satisfy a few core goals. This chapter aims to


    +   Cement much of the fun and games covered previously in the book.

    +   Help you explore the powerful PEAR framework and use one of the many PEAR
    modules.


    Right, then. Let’s get this show on the road....


    # PROJECT OVERVIEW


    You may not know about it yet, but *Read All About It* is going to be the hottest
    new news Web site—and you are, coincidentally, its founder. In this chapter, you
    breathe life into Read All About It.'
  merge: -1
  img_proc: true
- pgno: 440
  md: 'Although this project does not scratch the complexity and depth of Web sites
    such as those for BBC News or CNN, a number of new concepts to explore and features
    to build makes this simple site a worthwhile project:


    +   - Easy forms. The **HTML_QuickForm PEAR** extension eases the creation and
    validation of forms.

    +   - Menus and submenus. The main navigation area includes a number of menu options.
    When the user clicks a menu, submenus display with more options.

    +   - Search capabilities. A search feature that hunts through the content on
    the site for a search term and presents a list of matches.

    +   - Paging. Don’t frustrate users with a huge page with hundreds of search results;
    split the results across a number of different pages.

    +   - Password encryption. Increase site security by storing encrypted passwords
    in the database. This stops people from snooping out passwords either in the database
    or by using malicious trickery to sniff out plain-text passwords.


    These five features develop essential skills you can bolt onto any of the projects
    already covered in this book.


    # ## INSTALLING PEAR PACKAGES


    The **PEAR** framework provides a stack of different PHP extensions that ease
    and automate the production of your sites. You can find **PEAR** packages for
    Web services, XML, validation, form handling, and tons of other areas, and the
    huge and sprawling **PEAR** community constantly piles more and more packages
    into the system every week.


    The *Read All About It* site makes extensive use of the **HTML_QuickForm PEAR**
    extension. This package creates how you create forms in your scripts. With the
    extension, you can easily create forms, apply validation rules, manage how the
    form is processed, and implement various other features. Although **HTML_QuickForm**
    needs to be installed before you begin coding, the **PEAR** framework is fortunately
    clever enough to easily manage the installation and use of extensions.


    > > ### NOTE

    > >

    > > **For You XAMPP Users...**

    > >

    > > If you are using the XAMPP system, you can safely ignore this section. XAMPP
    includes a range of PEAR modules, including HTML_QuickForm.'
  merge: -1
  img_proc: true
- pgno: 441
  md: 'To install PEAR, you run a script for PHP that automatically downloads and
    installs the framework. However, you need to download the framework before you
    download the PEAR extensions you want.


    Because running this script is slightly different for each operating system, this
    section addresses the installation for each.


    For Windows, go to the directory where you installed PHP (such as C:/PHP) and
    run the following command:


    ```

    PHP go-pear.org

    ```


    In Linux, run the following command in a terminal or xterm (you need the Lynx
    Web browser installed to do this):


    ```

    foo@bar:~$ lynx -source go-pear.org | php

    ```


    In Mac OS X, run the following command in the Terminal:


    ```

    curl go-pear.org | sudo php

    ```


    When you run each of these commands, you are prompted to answer a number of questions.
    Simply use the default answer for each, including when prompted to modify php.ini—the
    script should keep other parts of php.ini intact. When the installation program
    is complete, the PEAR command-line tool becomes available to manage your PEAR
    packages. In Windows, you may need to be inside your PHP directory to run the
    command, but on Linux and Mac OS X, you should be able to run it from anywhere.
    In Linux and Mac OS X, you need to be the super-user to use the command.


    Using PEAR simply involves passing different options to the pear program. As an
    example, to view the installed packages on your system, run this:


    ```

    pear list

    ```


    If you have a number of installed packages (if you are running XAMPP with its
    default set of PEAR extensions, for example), you should see something similar
    to the following:


    Installed packages:


    | Package | Version | State |

    | Archive_Tar | 1.1 | stable |

    | Crypt_RC4 | 1.0.2 | stable |

    | Crypt_Std | 1.0 | stable |

    | DB | 1.6.2 | stable |

    | DBA | 1.0 | stable |

    | DB_DataObject | 1.2 | stable |

    | Date | 1.3 | stable |'
