    kind of information you want to store includes:


    +   □  Product name

    +   □  Category

    +   □  Price

    +   □  Product description


    This content is very typical of the kind of information that you usually want
    to put in a database. Before you create any database, it is a good idea to write
    down the kind of data that you need to deal with; this makes it easier when designing
    your tables.'
