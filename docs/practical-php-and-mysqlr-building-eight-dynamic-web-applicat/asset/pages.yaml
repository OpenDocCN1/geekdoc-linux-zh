- pgno: 73
  md: 'TABLE 3-1 Options for starting and stopping different LAMPP components


    | **OPTION** | **DESCRIPTION** |

    | :--- | :--- |

    | lampp startapache | Starts only Apache |

    | lampp startmysql | Starts only MySQL |

    | lampp stopapache | Stops only Apache |

    | lampp stopmysql | Stops only MySQL |

    | lampp restartapache | Stops and then restarts Apache |

    | lampp restartmysql | Stops and then restarts MySQL |


    # ## Accessing phpMyAdmin


    Included with XAMPP (and on the Live CD) is a powerful Web-based database editor
    called phpMyAdmin, available from http://localhost/phpmyadmin/. phpMyAdmin will
    be used extensively throughout the book.


    # ## Switching PHP Versions


    One of the nicest features in XAMPP is that it includes both PHP4 and PHP5 with
    the release (in the future it will no doubt include PHP5 and PHP6). This makes
    testing your application with different versions of PHP simple. Simply restart
    XAMPP with the version you want to use.


    To switch versions, pass the version to the lampp program. So, to start PHP4,
    run the following:


    ```

    `foo@bar:/opt/lampp$ sudo /opt/lampp/lampp php4`

    ```


    To start PHP5, run the following:


    ```

    `foo@bar: /opt/lampp $ sudo /opt/lampp/lampp php5`

    ```


    These commands restart Apache with the version of PHP that you want to use. You
    can also check which version of PHP you are running by using the following:


    ```

    `foo@bar: /opt/lampp $ sudo /opt/lampp/lampp phpstatus`

    ```'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# # Backing Up


    There are also techniques available for backups. After you create the backup archive,
    you can copy it to the hard disk or a network server so you can keep the backup
    permanently. (Remember that after you reboot, any changes you make will disappear
    from the Live CD if you don''t somehow back those changes up to another medium.)
    First, use the build XAMPP backup script. Make sure XAMPP is running and then
    run the following:


    ```

    foo@bar: `/opt/lamp $` **sudo /opt/lamp/lamp backup**

    ```


    This command backs up the databases and Web pages and then puts them in a single
    script that you can run to restore the system. This script will be stored in `/opt/lamp/backup`.
    To restore the backup, install a free XAMPP and run the following script, making
    sure to replace the filename for the filename of your backup script:


    ```

    foo@bar: `/opt/lamp/backup $` **sudo /lamp/backup/xampp-backup-00-00-00.sh**

    ```


    The second technique backs up the entire XAMPP directory. To do this, first shut
    down the XAMPP server by using `lamp stop` and then go to the `/opt` directory
    and zip it up:


    ```

    foo@bar: `/opt $` **sudo tar zcvf lamp.tgz lamp**

    ```


    To restore it, make sure you are on a Linux system and run the following:


    ```

    foo@bar: `/opt $` **sudo tar zxvf lamp.tgz**

    ```


    # ## SUMMARY


    The Live CD included with the book provides a simple and easy way to get started
    running the applications that you will write throughout the book. This disc is
    a great example of how innovative open source software, such as the Ubuntu Live
    CD, XAMPP, and the different LAMP components, make Web development easier and
    more efficient. This is far nicer than a book with a drab floppy disk that contains
    a few scant source code files.


    The disc provides a great opportunity just in running the applications. But it
    is also recommended that, when going through each of the projects, you carefully
    follow how the code is built up—building up the source files manually by entering
    the code is essential when learning PHP and MySQL. The aim of this book is not
    to get'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'you to read a chapter and follow the code with your finger, but to instead
    write code, run it, fix errors, and learn as you go. Just reading code and not
    actually typing it and running it nearly always results in a less than great learning
    experience; instead, in this book you learn by doing.


    So, as much as this Live CD is a fantastic time-saver, don''t let it replace the
    essential act of typing code from the book, running it, and fixing errors. That
    is where the real learning happens.'
