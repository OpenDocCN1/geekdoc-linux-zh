    # # DEALING WITH LOGINS\n\nIn any CMS, users need to be properly managed. Different\
    \ systems have different user requirements, ranging from simple user logins to\
    \ multi-user, layered permissions systems. Having a properly designed plan of\
    \ how users will be managed, who can access what, and what kind of restrictions\
    \ are in place is essential.\n\nThe user management system in this project is\
    \ fairly simple. The system has two types of users: *normal users* and *administrators*.\
    \ Normal users and administrators are different primarily in the capabilities\
    \ that they offer (administrators can naturally manage many more parts of the\
    \ system).\n\n# ## Normal User Logins\n\nThe vast majority of users on the system\
    \ are normal users. A normal user can perform the following actions:\n\n+   -\
    \ Browse subjects, topics, and questions\n+   - Leave a comment for a particular\
    \ question\n+   - Submit a question to be included in a topic\n\nWhen a user submits\
    \ a question for inclusion in a topic, the subject’s owner or administrators can\
    \ moderate the question. Any user can own a subject; she can apply to own an orphaned\
    \ subject, and the administrator will accept or deny the request. This method\
    \ of applying for subject ownership will be developed later."
