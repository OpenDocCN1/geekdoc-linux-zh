- pgno: 263
  md: "# NOTE\n**The Risks with Input**\n\nWhen you accept any kind of input from\
    \ a user, there is a risk that the input could break the query. The most common\
    \ breakage occurs when a user types a single quotation mark, because the quotation\
    \ mark ends the input and anything after the second quotation mark is ignored.\
    \ Imagine that the user types 'Tim O'Chin'. The query would be as follows:\n\n\
    ```\nINSERT INTO users(name) VALUES('Tim O'Chin');\n```\n\nIn this query, the\
    \ second quotation mark (in O'Chin) ends the input and causes a SQL error.\n\n\
    In your projects, it is unlikely that you have encountered this error. This is\
    \ because a feature called *magic_quotes* is likely to be turned on in your *php.ini*\
    \ file. With this feature, any quotation marks accepted from a form are automatically\
    \ escaped. The act of escaping a quotation mark happens when you use a forward\
    \ slash to make the quotation mark legitimate. As such, a properly escaped query\
    \ would be:\n\n```\nINSERT INTO users(name) VALUES('Tim O\\'Chin');\n```\n\nYou\
    \ can run this project with *magic_quotes* turned off if you wrap your data with\
    \ *addslashes()*; this function escapes the quotation marks.\n\nAfter closing\
    \ the main *if* block, begin the *else* that displays the form:\n\n```\n} \nelse\
    \ {\n\trequire(\"header.php\");\n?>\n\n<h1>Add a new item</h1>\n<strong>Step 1</strong>\
    \ - Add your item details.\n```\n\nAfter the form, add the closing curly bracket\
    \ and footer code:\n\n```\n</table>\n</form>\n\n<?php\n}\n\nrequire(\"footer.php\"\
    );\n?>\n```"
  merge: -1
  img_proc: true
- pgno: 264
  md: "# Adding the Images\n\nBeing able to upload images is a common and useful skill\
    \ used when developing Web sites. The basic technique is as follows:\n\n+   Provide\
    \ a form the user can use to select an image.\n\n+   When the user clicks the\
    \ Submit button, transfer the image to a temporary location on the server. Inside\
    \ this location, give the file a random, temporary filename.\n\n+   Check that\
    \ the image is valid and copy it to a specific directory on the Web server.\n\n\
    +   Add the name of the image and the id of the item it is associated with to\
    \ the *images* table.\n\nWith this process complete, you can iterate through the\
    \ *images* table for items with the same id and then add the filename to the image\
    \ HTML tag from the table.\n\nCreate a new file called *addimages.php* and add\
    \ the following form:\n\n```\n```\n<form enctype=\"multipart/form-data\" action=\"\
    ?php\n  pf_script_with_get($SCRIPT_NAME); ?>\" method=\"POST\">\n<input type=\"\
    hidden\" name=\"MAX_FILE_SIZE\" value=\"3000000\">\n\n<table>\n<tr>\n  <td>Image\
    \ to upload</td>\n  <td><input name=\"userfile\" type=\"file\"></td>\n</tr>\n\
    <tr>\n  <td colspan=\"2\"><input type=\"submit\" name=\"submit\"\n   value=\"\
    Upload File\"></td>\n</tr>\n</table>\n</form>\n```\n\n```\n\nWhen you have finished\
    \ adding photos, go and\n<a href=\"?php echo \"itemdetails.php?id=\" .\n$validid;\
    \ ?>\" >see your item</a>!  \nWithin the form tag, you created a new attribute,\
    \ called enctype, that ensures the form submits the image data in an understandable\
    \ format. The first <input> tag creates a special hidden form element that can\
    \ be used to store hidden information and variables in the form. In this example,\
    \ the *hidden* element stores the maximum size of the image. The second *input*\
    \ element is a *userfile* type and adds a browse button that the user can click\
    \ to select the image to upload. The preceding code also adds a Submit button."
