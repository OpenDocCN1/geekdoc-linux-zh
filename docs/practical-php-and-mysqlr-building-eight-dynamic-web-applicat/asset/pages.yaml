- pgno: 41
  md: 'not loop 18 times because 18 is not less than 18; it is equal to 18. Finally,
    a line is displayed to indicate that adulthood has been reached.


    An important point to note is what would happen if you left off the `$age++` line.
    If you create a `while` loop in which it loops while a particular condition is
    set, but that condition never changes, an infinite loop will occur. This is never
    a good thing, and you should always check your loop to ensure that it will eventually
    end when you want it to. If you are running your scripts on somebody else''s server
    and get into an infinite loop, you may get some angry emails. Always check that
    the `while` has some means of ending.


    You will revisit `while` loops later when you explore other facets of PHP programming,
    particularly database development.


    ![](img/c75d0c4fa51711b62f211459ae794f3f_41_0.png)


    # Be Careful!


    One common mistake you can make with a `while` loop is to set the loop condition
    to something that doesn''t change, and as such, causes the `while` loop to loop
    forever. This is known as an **infinite loop**. For example—don''t run this—here
    is an example of an infinite loop:


    ```

    `<?php

    $age = 1;

    while($age == 1) {

    echo "Argh! Infinite loop!";

    }

    ?>`

    ```


    Here, the loop cannot break out of the of `$age` being set to 1 and as such loops
    forever. This causes an insane slowdown on your computer, and you will probably
    need to restart your Web server or XAMPP if you are using it.


    # Ask Questions of Your Code


    One of the most fundamental purposes of a programming language is to check a particular
    condition and respond where necessary. A good example of this is if you were to
    type an age into a Web form, and you wanted to return a response based on the
    user''s age. For example, you may want to respond to the user differently if she
    is a child as opposed to an adult. This is a common theme among Web sites containing
    content that may be unsuitable for minors; the user is prompted to enter her age
    and is denied access if the age is below a certain threshold.'
