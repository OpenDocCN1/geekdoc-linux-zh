- pgno: 487
  md: '# CSS VERSUS TABLES


    Many newcomers to Web development begin by using a tool such as Macromedia Dreamweaver
    (now owned by Adobe) to graphically nest invisible tables inside other invisible
    tables to create complex page designs. Although this technique works, using CSS
    and <div> tags offers a number of advantages:


    +   ▪ Improved accessibility. Nested tables are more difficult to understand and
    display in tools such as screen readers.

    +   ▪ Improved readability. If the CSS file is not present, the order of the content
    still makes sense.

    +   ▪ Improved searching. Search engines rank <div>-driven sites higher than sites
    that use nested tables. Search engines generally cannot understand tables very
    well (especially nested ones) and because of this often rank them lower than sites
    without extensive table usage.


    Using <div> tags is acknowledged by leading developers as the best practice for
    modern Web development, and with such benefits as those mentioned here, why not?


    With an idea of these different areas and how they are positioned on the screen,
    you can create a map of which <div> areas are needed and how they will be laid
    out, as shown in Figure A-3.


    ![](img/c75d0c4fa51711b62f211459ae794f3f_487_0.png)'
  merge: -1
  img_proc: true
- pgno: 488
  md: "The top two `<div>` areas are the header and menu bars. Below these areas is\
    \ the `container <div>` (indicated by the dotted line), which contains the bar\
    \ and main `<div>` areas. The container area identifies where the major content\
    \ on the page is displayed, and the two nested areas identify the two different\
    \ areas of the container.\n\n> **TIP**\n> \n> The header area is typically used\
    \ for consistent branding. If you go to virtually any Web site, you will see the\
    \ logo or name of the Web site at the top of every page. This is purpose of the\
    \ header area in this project.\n\n# STARTING TO CODE\n\nBefore you get started\
    \ creating your HTML and CSS, you need to create a tiny PHP configuration file\
    \ for the project. Every project that you create in this book includes one of\
    \ these special configuration files. Although it is unnecessary to create a configuration\
    \ file for your projects, it can be useful to have a single place to store project-wide\
    \ settings, such as the location and name of the site, database settings, preferences,\
    \ and more. If you plan to reproduce settings in different parts of your project,\
    \ it makes sense to specify them once in a single configuration file.\n\nFirst,\
    \ create a new directory called *genericsite* inside your htdocs directory. This\
    \ directory will store your project code.\n\n> **TIP**\n> \n> It is a good idea\
    \ to keep each project in a separate subdirectory inside the htdocs directory.\
    \ This makes it simple to access the different projects.\n\nInside the *genericsite*\
    \ subdirectory, create a new file called *config.php* and add the settings shown\
    \ in Example A-1 here.\n\n# EXAMPLE A-1 The configuration file is useful to store\
    \ important settings for the project.\n\n```\n```php\n<?php\n\n$config_sitename\
    \ = \"Jinny's Homepage\";\n\n$config_basedir = \"http://localhost/sites/genericsite/\"\
    ;\n?>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 489
  md: "Within this file, you set two variables that are used throughout the project.\
    \ The first one of these, `$config_sitename`, contains the name of the Web site—in\
    \ this case, *Jinny’s Homepage*. The second setting specifies the Internet location\
    \ of the Web site, which is used to reference other files on the site. This second\
    \ variable is typically used as a reference point for links and is discussed in\
    \ more detail later.\n\nTo see an example of this, create a file called `header.php`\
    \ and add the following header code:\n\n```\n```php\n<?php\n    require(\"config.php\"\
    );\n?>\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01 Transitional//EN\" \"http://www.w3.org/TR/html4/loose.dtd\"\
    >\n<head>\n    <title><?php echo $config_sitename; ?></title>\n    <link href='stylesheet.css'\
    \ rel='stylesheet'>\n</head>\n<body>\n```\n```\n\nIn this example, you set the\
    \ title of the page by displaying the value of the `$config_sitename` variable\
    \ in the `<title>` tag. You then include `stylesheet.css` file in the `<link>`\
    \ tag (`stylesheet.css` is where the design for your site is created). Later,\
    \ you will create `stylesheet.css` to add style and formatting to the site.\n\n\
    Next, begin adding the `<div>` blocks. First, add the header `<div>`:\n\n```\n\
    ```html\n</head>\n<body>\n\n    <div id=\"header\">\n    <h1><?php echo $config_sitename;\
    \ ?></h1>\n    </div>\n```\n```\n\nWhen adding a `<div>` tag, you use the `id`\
    \ or `class` attribute to indicate the name of the `<div>` area. All tags and\
    \ content between the opening and closing `<div>` tags are considered a part of\
    \ that `<div>` and are formatted accordingly.\n\n# ### id Versus class\n\nThe\
    \ `id` and `class` attributes in `<div>` tags have two very different purposes:\n\
    \n+   * Use `id` if the `<div>` tag name is unique. This typically occurs with\
    \ major sections in which there is only ever one section. For example, this project\
    \ only has one header, menu, container, and footer and, hence, uses the `id` attribute."
  merge: -1
  img_proc: true
- pgno: 490
