    \ object. This object has a range of methods available to it, and you can find\
    \ out more about them at `http://pear.php.net/package/HTML_QuickForm/docs`.\n\n\
    To create a form, you need to add the usual text boxes and Submit button, and\
    \ also a `select` box with the list of categories from which the user can select.\
    \ When manually creating the forms, you add a `<select>` tag and then loop through\
    \ the results of a query to add the contents of the `<select>` box.\n\nWhen using\
    \ `HTML_QuickForm`, the process is slightly different. You need to perform the\
    \ query and then build up an array containing the items. This array is added to\
    \ the form later.\n\nAdd the code to build the array:\n\n```\n$form = new HTML_QuickForm('firstForm');\n\
    \n$catsql = \"SELECT id, category FROM categories ORDER BY category\";\n$catres\
    \ = mysql_query($catsql);\n\nwhile($catrow = mysql_fetch_assoc($catres)) {\n \
    \  $catarr[$catrow['id']] = $catrow['category'];\n}\n```\n\nYou first create the\
    \ query, and the `while` loop creates the array. The array key (the part in the\
    \ square brackets) is set to the id, and the value is set to the category name.\
    \ For example, if you had the categories *Music* (with an id of 1) and *Fashion*\
    \ (with the id of 20), the array would look like this:\n\n```\n$catarr[1] = \"\
    Music\"\n$catarr[2] = \"Fashion\"\n```\n\nCreate the form element and load the\
    \ array:\n\n```\n$catarr[$catrow['id']] = $catrow['category'];\n}\n\n$s =& $form->createElement('select',\
    \ 'cat_id', 'Category ');\n$s->loadArray($catarr);\n$form->addElement($s);\n```\n\
    \nThe first line uses the `createElement()` `HTML_QuickForm` method on the `$form`\
    \ object. Methods in OOP development are accessed with `->` (such as"
