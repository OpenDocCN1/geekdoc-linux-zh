    users WHERE dateends < NOW() AND items.user_id = users.id AND endnotified = 0;";
    $itemresult = mysql_query($itemssql);

    ```


    ```

    while($itemrow = mysql_fetch_assoc($itemresult)) { $bidsssql = "SELECT bids.amount,
    users.username, users.email FROM bids, users WHERE bids.user_id = users.id AND
    item_id = '' . $itemrow[''id''] . '' ORDER BY amount DESC LIMIT 1"; $bidsresult
    = mysql_query($bidsssql); $bidsnumrows = mysql_num_rows($bidsresult);

    ```


    For each ended auction, a check is made to see if any bids were placed, and the
    highest amount and username and email address of the highest bidder is returned.
    The query works by asking for the username, email, and bid amount for a record
    in which item_id is equal to $itemrow[''id'']. Each record is ordered in descending
    order by amount and returns only a single row (LIMIT 1). Ordering in descending
    order and only returning one row returns the latest entry in the table. This is
    a nice alternative to using the MAX() function to determine the highest price.


    With the data gathered, now you can construct and send the emails. To generate
    the mails, use the heredoc syntax that was discussed in Chapter 5. When using
    this syntax, you cannot use arrays inside it. Instead, extract data into normal
    variables:


    ```

    $bidsresult = mysql_query($bidsssql); $bidsnumrows = mysql_num_rows($bidsresult);
    $own_owner = $itemrow[''username'']; $own_email = $itemrow[''email'']; $own_name
    = $itemrow[''name''];

    ```


    There are three possible scenarios in which emails need to be sent. You would
    send them to


    +   - The owner of the auction to indicate that no bids were made on the item.

    +   - The owner to indicate the highest bidder and the bidder''s contact details.

    +   - The winning bidder to indicate the owner of the auction.


    First, create the one that is sent to the owner indicating that no bids were made.
    To see if there were any bids, check if the $bidsnumrows has a value. If not,
    create the following email message:


    ```

    $own_email = $itemrow[''email'']; $own_name = $itemrow[''name''];

    ```'
