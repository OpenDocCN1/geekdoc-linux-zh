    \ could be used for repeating areas such as box-outs. For example, the text you\
    \ are reading this sentence in a sidebar. If the book were formatted in HTML,\
    \ this box-out would have a class attribute, because several box-outs are spread\
    \ throughout the book.\n\nBearing these points in mind, the `<div>` you just added\
    \ uses an id attribute because only one header `<div>` is present. The `<div>`\
