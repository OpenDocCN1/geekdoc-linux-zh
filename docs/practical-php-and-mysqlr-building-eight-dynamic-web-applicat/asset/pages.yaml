- pgno: 239
  md: "The final file to create before beginning the code for the auction is `functions.php`.\
    \ In this project, you use the `pf_script_with_get()` function that you used in\
    \ the forums project, but you will also create another snazzy function called\
    \ `pf_validate_number()`. Copy `functions.php` from the forums project and add\
    \ the code shown in Example 7-4 after the `pf_script_with_get()` function.\n\n\
    # EXAMPLE 7-4  *The* `pf_validate_number()` *function validates a number and either\
    \ returns* `0` *or redirects.*\n\n```\n```\n}\nfunction pf_validate_number($value,\
    \ $function, $redirect) {\n   if(isset($value) == TRUE) {\n      if(is_numeric($value)\
    \ == FALSE) {\n         $error = 1;\n      }\n      if($error == 1) {\n      \
    \   header(\"Location: \" . $redirect);\n      }\n      else {\n         $final\
    \ = $value;\n      }\n   }\n   else {\n      if($function == 'redirect') {\n \
    \        header(\"Location: \" . $redirect);\n      }\n      if($function == \"\
    value\") {\n         $final = 0;\n      }\n   }\n   return $final;\n}\n?>\n```\n\
    ```\n\nThis function takes the number validation code that you wrote in previous\
    \ pages and wraps it inside a function. This makes the files less cluttered because\
    \ any reproduced code can be stored away in a function you can call.\n\nThe function\
    \ takes three options. The first option passes the value that you want validated\
    \ to the function. You set the second option to either *redirect* or *value*."
  merge: -1
  img_proc: true
- pgno: 240
  md: 'If you pass **redirect**, the third option is used as the page to redirect
    to when the value to validate fails. If you pass the function **value**, zero
    (0) is returned from the function if the variable to validate is invalid.


    # ## DISPLAYING AUCTION ITEMS


    The first challenge is to create a list of auction categories and a list of auction
    items. These lists will look similar to the ones shown in Figure 7-2.


    ![](img/c75d0c4fa51711b62f211459ae794f3f_240_0.png)


    FIGURE 7-2 The sidebar is an ideal area to include a categories list.


    This process involves creating a drill-down so that when the user clicks an item,
    he can view more information about it on a separate page.


    The items table is where most of the action happens. Inside this table, the typical
    details such as item name, description, and starting price are stored. (Each auction
    needs a starting price, even if that starting price is 0.) The **dateends** field
    is particularly important and indicates the date when the auction finishes; this
    is used extensively later. The final field (**enddateofied**) is irrelevant for
    creating the item listing page. This field is used later when you send emails
    summarizing the final price and bidder for the item. You can ignore this field
    for the moment.'
