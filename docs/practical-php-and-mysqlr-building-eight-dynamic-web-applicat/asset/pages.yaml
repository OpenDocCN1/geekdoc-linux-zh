  md: "Processing forms on Web pages works in a rather backwards fashion. At the top\
    \ of your page—before showing any HTML—you need to check to see if the Submit\
    \ button has been clicked by checking for the `_POST['submit']` variable. If this\
    \ variable exists, the user has submitted a form. If the variable does not exist,\
    \ you should assume that the user has not actually seen the form yet and, therefore,\
    \ need to display it. It sounds crazy, but hang in there—it will all make sense\
    \ momentarily.\n\nInsert the following code after your validation code, before\
    \ you include the *header.php* file:\n\n```\nelse {\n    $validentry = 0;\n}\n\
    \nif($_POST['submit']) {\n    $db = mysql_connect($dbhost, $dbuser, $dbpassword);\n\
    \    mysql_select_db($dbdatabase, $db);\n    \n    $sql = \"INSERT INTO comments(blog_id,\
    \ dateposted,\n        name,  comment) VALUES('$'\n        . $validentry .\",'\n\
    \        . NOW() ,','\n        . $_POST['name']\n        .'',','\n        . $_POST['comment']\
    \ .'\");'\n    mysql_query($sql);\n    header(\"Location: http://\" . $_HTTP_HOST\n\
    \        . $SCRIPT_NAME . \"?id=\" . $validentry);\n}\nelse {\n    // code will\
    \ go here\n}\n\nrequire(\"header.php\");\n```\n\nThe first line checks if the\
    \ submit POST variable exists. For explanation purposes, assume that the Submit\
    \ button has been clicked and the variable exists. The code then connects to the\
    \ database. (Remember, you have not included header.php yet, so no database connection\
    \ is available.)\n\n# NOTE\n\n# Don't Blow Up Your Headers\n\nWhen you use a header\
    \ redirect, always ensure that *no* data is displayed on the page before the header\
    \ is sent—this includes white space. As a simple example of how important this\
    \ is, add a single space before the `<?php` instruction and reload the page. You\
    \ should now get a lot of “headers been sent” errors. Whenever you see these errors,\
    \ check that there are no erroneous letters or white space either in the page\
    \ itself or within the files that are included (such as *config.php*)."
