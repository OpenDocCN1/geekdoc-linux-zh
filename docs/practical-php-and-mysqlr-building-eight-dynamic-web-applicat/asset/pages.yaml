- pgno: 498
  md: "Here you simply set the color of the link. The a:link part of the block applies\
    \ the style to an available link. In addition to the link type, you can also add\
    \ the visited and hover types:\n\n```\na:visited {\n    text-decoration: none;\n\
    \    border-bottom: 1px dotted #369;\n    color: #000;\n}\n\na:hover, a:active\
    \ {\n    text-decoration: none;\n    border-bottom: 1px solid #036;\n    color:\
    \ #000;\n}\n```\n\nThese blocks look very similar to the first link style. The\
    \ only addition is the border-bottom property.\n\nThe border CSS instruction applies\
    \ a border to the edge of the object that you are formatting. The instruction\
    \ takes three parameters: thickness, line type, and color. For example, you would\
    \ use border: thin solid black; to add a thin black continuous line around the\
    \ object or border: thick dashed #ffff; to add a thick white dashed line. If you\
    \ want to style only a part of the border, use the border-top, border-bottom,\
    \ border-left, and border-right properties.\n\nThe visited link uses a dotted\
    \ border, and the hover uses a solid border.\n\n# Styling the Container and Content\n\
    \nIf you look at how the <div> elements are laid out, you can see a main container\
    \ <div> that houses the main and bar <div> areas. Figure A-6 shows the bar and\
    \ main content on the page.\n\nThe first style is the container:\n\n```\n#container\
    \ {\n    position: absolute;\n    top: 85px;\n    left: 0px;\n    background:\
    \ #ffffff;\n    margin: 0 auto 0 auto;\n    text-align: left;\n    width: 100%;\n\
    \    height: 100%;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 499
  md: "APPENDIX A Web Site Design\n\n![](img/c75d0c4fa51711b62f211459ae794f3f_499_0.png)\n\
    \n**FIGURE A-6 The container holds the bar on the left and the main content in\
    \ the body of the page.**\n\nIn this style block, you position the **container\
    \ 85 pixels** from the top of the screen (taking into account the total height\
    \ of both the **header** and menu `<div>` areas). The **background** of the **container**\
    \ is set to white, and the text is aligned to the left with `text-align`. The\
    \ **width** and **height** are set to **100%** to take up the full space inside\
    \ the browser.\n\n# *Styling the Side Bar*\n\nAdd the bar style webblog:\n\n```\n\
    ```\n#bar {\n    float: left;\n    width: 200px;\n    background: #eee;\n    padding:\
    \ 10px;\n    margin-right: 30px;\n    height: 100%;\n}\n```\n```\n\nYou first\
    \ set the `float` property to `left`. This property specifies that you want the\
    \ content on the right to float around the edge of the area being styled. In this\
    \ case, you float the bar `<div>` so that the main `<div>` appears on the right.\n\
    \nIn addition to the `float`, the **width** is set to **200 pixels**, and the\
    \ background color is set to light gray. You also set a margin of **30 pixels**\
    \ on the right side, which adds some space between the bar and the main content.\n\
    \nInside the bar is an image. Some browsers automatically put a rather ugly border\
    \ around the image, so add a style definition to remove it:\n\n```\n```\nimg {\n\
    \    border: 0;\n}\n```\n```"
