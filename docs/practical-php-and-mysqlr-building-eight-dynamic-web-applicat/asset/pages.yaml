  md: '# ## Paying


    The final part of the checkout process is to take payment. Dealing with payments
    on a Web site can take a variety of different routes: PayPal, NOCHEX, Worldpay,
    and more. This project offers two payment methods: PayPal and checks. These two
    methods demonstrate how to deal with automatic (PayPal) and manual (check) purchases.


    Create a new file called *checkout-pay.php* and add the form:


    ```

    <h2>Select a payment method</h2> <form action=''checkout-pay.php'' method=''POST''>
    <table cellspacing=10> <tr> <td><h3>PayPal</h3></td> <td> This site uses PayPal
    to accept Switch/Visa/Mastercard cards. No PayPal account is required - you simply
    fill in your credit card details and the correct payment will be taken from your
    account. </td> <td><input type="submit" name=''paypalsubmit'' value=''Pay with
    PayPal''>/td> </tr> <tr> <td><h3>Cheque</h3></td> <td> If you would like to pay
    by cheque, you can post the cheque for the final amount to the office. </td> <td><input
    type=''submit'' name=''chequesubmit'' value=''Pay by cheque''>/td> </tr> </table>
    </form>

    ```


    This simple form provides two Submit buttons only—one to pay by PayPal and the
    other to pay by check. Processing the form involves two main sections—one for
    PayPal and one for the check.


    At the top of the file, begin adding the code:


    ```

    <?php session_start(); require(''db.php''); require(''functions.php'');

    ```


    If the user clicks the PayPal button, process the order:


    ```

    require(''functions.php'');

    ```'
