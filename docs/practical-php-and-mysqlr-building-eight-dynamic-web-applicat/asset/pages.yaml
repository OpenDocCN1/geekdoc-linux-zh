- pgno: 11
  md: '# # Foreword


    Listen to podcasts by Jono Bacon and friends at LUG Radio (www.lugradio.org) and
    you get a sense of both the spirit and thoughtfulness Jono brings to the open
    source community. At one moment they speak seriously about hurdles in contributing
    code to free software projects, while the next they offer a Monty Python-like
    discussion on which Linux distribution each of them most resembles.


    *Practical PHP and MySQL* reflects Jono’s commitment to the spirit of making open
    source subjects accessible to everyone. The book carefully walks you through the
    code for eight useful, dynamic Web applications. Projects are presented in a playful
    way, like the forum project that touts horror movies that make you “hide behind
    the couch.” And everything in the book can be run live, modified, saved, and reused
    from the included live CD.


    Although the tools you need to create Web content are readily available from the
    open source community, having a skillful guide like Jono Bacon to help you create
    dynamic Web applications from those tools is a real treat. The results form a
    foundation for developing your own blogs, forums, shopping carts, and other Web
    destinations that should significantly cut your startup time.


    I am thrilled to have Jono Bacon’s *Practical PHP and MySQL* as one of the first
    books in the Negus Live Linux Series. Its content perfectly suits the goals of
    the series to put quality free and open source software covering various topics
    into peoples’ hands so they can quickly get high-quality results. I hope you enjoy
    learning from this book as much as I have.


    —Christopher Negus


    **Series Editor, Negus Live Linux Series**'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# About the Author


    **Jono Bacon** works for Canonical as the Ubuntu community manager and is an established
    speaker, author, and regular contributor to the Open Source community. As an author,
    Bacon co-authored *Linux Desktop Hacks* and the *Official Ubuntu Book*, and has
    written more than 400 published articles in more than 14 publications. Bacon has
    also contributed as a columnist for *Linux Format*, *Linux User & Developer*,
    and *PC Plus*, and is an O''Reilly Network weblog author.


    In addition, Bacon is a regular contributor to Open Source in a range of projects,
    a lead developer on the Jokosher (www.jokosher.org) project, and one of the co-founders
    of the popular LUGRadio (www.lugradio.org) podcast---a show with more than 15,000
    listeners and an annual event that pulls visitors from around the world.'
  merge: -1
  img_proc: true
