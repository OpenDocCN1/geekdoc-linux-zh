    # Managing User Logins


    Within the context of a forum, identity is important. Users want to post messages
    that come from them—not from a faceless anonymous user. In addition to normal
    users, you also need to support administrator logins. The administrator can perform
    tasks such as adding categories/forums and removing threads, forums, and categories.
    Luckily, PHP provides comprehensive support to make all of these requirements
    simple to add.


    We are going to begin by building a User Registration system that will allow new
    users to automate the process of applying for membership. We will also build the
    requisite functionality to email the user a verification link they can click on
    to confirm their account.'
