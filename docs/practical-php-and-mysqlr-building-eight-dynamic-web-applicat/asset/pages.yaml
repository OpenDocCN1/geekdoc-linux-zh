- pgno: 136
  md: '# CREATING THE SITE DESIGN


    The first step in writing the code is to create the design. Create a new file
    called `config.php` and add the code shown in Example 5-1.


    > EXAMPLE 5-1 The configuration file stores settings about the site.


    ```

    ```

    <?php


    $dbhost = "localhost";

    $dbuser = "root";

    $dbpassword = "";

    $database = "forum";


    // Add the name of the forums below

    $config_forumsname = "CineForums";


    // Add your name below

    $config_admin = "Jono Bacon";

    $config_adminemail = "jono AT jonobacon DOT org";


    // Add the location of your forums below

    $config_basedir = "http://127.0.0.1/sites/forums/";

    ?>

    ```

    ```


    Inside this file, you specify the variables used when connecting to the database
    as well as the variables used to configure the name and author of the site. In
    addition, `$config_basedir` contains the URL of forums; this will be used mainly
    when performing redirects.


    Now, build the header file. Create a new file called `header.php` and add the
    following code:


    ```

    ```

    <?php


    session_start();


    require("config.php");


    $db = mysql_connect($dbhost, $dbuser, $dbpassword);

    mysql_select_db($database, $db);


    ?>

    ```

    ```


    You first add session support with `session_start()` and then include the configuration
    file. After this, you create the connection to the database.'
  merge: -1
  img_proc: true
