    # ## POSTS AND REPLIES


    A fundamental feature in the forum software is the capability to post new content
    to a chosen forum or to reply to existing conversations. This process should be
    as simple and intuitive as possible, and it should be convenient to read a discussion
    and then post a reply.


    The process of posting a new message and replying are fairly similar. To post
    a new message, a topic must first be created and then the id of the topic can
    be used when creating the message. It is important to remember that a new thread
    must include both a topic *and* a message. If you will create a reply, you simply
    need to know the id of the existing topic and then add a new entry to the messages
    table.


    # ### Posting a New Topic


    To post a new topic, the page must essentially have two potential ways of working:


    +   - The forum id is passed to the page as an **id GET** variable. This id can
    be used to determine to which forum the topic will be added.'
