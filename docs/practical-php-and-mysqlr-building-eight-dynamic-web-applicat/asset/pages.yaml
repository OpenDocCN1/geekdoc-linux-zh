  img_proc: true
- pgno: 408
  md: "**FIGURE 10-4**\nAccessing releases is simple.\n\n![](img/c75d0c4fa51711b62f211459ae794f3f_408_0.png)\n\
    \nThe releases are grouped by version numbers, and each available download is\
    \ displayed as one of the different types of packages (Tarball, Debian Package,\
    \ Windows ZIP, and so on).\n\nCreate *download.php* and begin adding the code:\n\
    \n```\n`<?php\n    require(\"project_functions.php\");\n    pf_protect_nonadmin_page();`\n\
    ```\n\nYou first include the *project_functions.php* file and then use `pf_protect_nonadmin_page()`\
    \ to protect the page from direct use.\n\nRun a query to grab the release versions:\n\
    \n```\n`pf_protect_nonadmin_page();\n\n$sql = \"SELECT * FROM homepageproject_releaserversions\
    \ WHERE\nproject_id = \" . $project_id . \" ORDER BY id DESC\";\n$result = mysql_query($sql);`\n\
    ```\n\n```\n`echo \"<h1>Download</h1>\";`\n```\n\nIn this case, you ask for all\
    \ versions in which the *id* field matches `$project_id` (set in *project_main.php*)\
    \ and then order the results in descending (reverse) order. You use descending\
    \ order because it is likely that the most recently added versions are the latest\
    \ versions.\n\nIterate through each version, displaying the version number as\
    \ you go:\n\n```\n`echo \"<h1>Download</h1>\";\nwhile($vrow = mysql_fetch_assoc($result))\
    \ {\n    echo \"<h2>\" . $vrow['version'] . \"</h2>\";`\n```"
  merge: -1
  img_proc: true
- pgno: 409
  md: "Run a query to gather the releases for each version:\n\n```\necho \"<h2>\"\
    \ . $verrow['version'] . \"</h2>\";\n$sql2= \"SELECT homepage_project_releasefiles.filename,homepage_project_releasefiles.date,\
    \ homepage_project_releasetypes.type FROM homepage_project_releaseversions INNER\
    \ JOIN homepage_project_releasefiles ON homepage_project_releasefiles.version_id\
    \ = homepage_project_releaseversions.id INNER JOIN homepage_project_releasetypes\
    \ ON homepage_project_releasetypes.type_id = homepage_project_releasetypes.id\
    \ WHERE homepage_project_releaseversions.id = \" . $verrow['id'];\n$result = mysql_query($sql2);\n\
    $numrows = mysql_num_rows($result);\n```\n\nThis query performs two inner joins,\
    \ connecting the *homepage_project_releaseversions* table to the *homepage_project_releasefiles*\
    \ table and then to the *homepage_project_releasetypes* table. The query returns\
    \ the filename, date, and type of the release.\n\nDisplay the results:\n\n```\n\
    $numrows = mysql_num_rows($result);\n\n\necho \"<ul>\";\n\n\\if($numrows == 0)\
    \ {\n\techo \"<li><strong>No releases!</strong></li>\";\n} else {\n\nwhile($verrow\
    \ = mysql_fetch_assoc($result)) {\necho \"<li><a href='releases/\"\n.\n$verrow['filename']\
    \ . \"'>Download the \" . $verrow['type']\n.</</a> (<i>Released\" . date(\"D jS\
    \ F Y g.iA\",\nstrtotime($verrow['date'])) . \"</i>)</a>\";\n\n\n\n} else {\n\n\
    echo \"</ul>\";\n\n?\n>\n```"
  merge: -1
  img_proc: true
- pgno: 410
  md: "# ## VIEWING SCREENSHOTS\n\nIf the user clicks the Screenshots link, the func\
    \ GET variable contains screenshots and screenshots.php is loaded into project_main.php.\n\
    \nCreate screenshots.php and add the code shown in Example 10-5.\n\n# ### EXAMPLE\
    \ 10-5 Displaying screenshots is as simple as iterating through the query results.\n\
    \n```\n```php\n<?php\n    require(\"project_functions.php\");\n    pf_protect_nonadmin_page();\n\
    \n    $sql = \"SELECT * FROM homeproject_screenshots WHERE\n          project_id\
    \ = \" . $project_id . \";\";\n    $result = mysql_query($sql);\n    $numrows\
    \ = mysql_num_rows($result);\n\n    echo \"<h1>\" . $project_name . \" Screenshots</h1>\"\
    ;\n    if($numrows == 0) {\n        echo \"No screenshots!\";\n    } else {\n\
    \        while($row = mysql_fetch_assoc($result)) {\n            echo \"<a href='screenshots/\"\
    \ . $row['name'] . \"'><img\n          src='./screenshots/\" . $row['name'] .\
    \ \"' width='\"\n          . $config_projectscreenshotthumbsize . \"'></a>\";\n\
    \            echo \"<br><br>\";\n        }\n    }\n?>\n```\n```\n\nThe first few\
    \ lines protect the file from direct access (as you did earlier) and then a query\
    \ gathers all screenshots for the current project. A check is made to see if any\
    \ rows were returned. If none came back, No screenshots! is displayed; otherwise,\
    \ the images are listed. Each image displays at the width set in $config_projectscreenshotthumbsize\
    \ and links to the full-size image.\n\nWith a couple of screenshots available,\
    \ you should see something similar to Figure 10-5 in your browser."
  merge: -1
  img_proc: true
