    # Viewing and Rating Stories


    When the user clicks a category and views the list of available stories, each
    story’s subject links to the page with the full story text. This page not only
    views the full story, but also includes a feature to allow users who are logged
    in to rate the story. Now you know if your editors are writing rubbish stories
    or not.


    Ratings are specifically limited to logged-in users. The reason for this limitation
    is subtle but important. You need to prevent trigger-happy users from voting for
    the same story more than once. To prevent such abuse, you somehow need to track
    whether the user has voted. To solve this problem, a number of options are at
    your disposal, each with advantages and disadvantages:


    +   Track the user by his session ID. You could store the current session ID in
    a table and prevent more than one vote from the same ID. This session ID will
    reliably track a unique user currently viewing the Web site. The problem is that
    the user could restart the browser to generate a new session ID, thus foiling
    your system.


    +   Use cookies. Cookies allow you to store a tiny text file, which you can use
    to store a small amount of information on the user’s hard disk. The problem with
    this technique is that the cookies are deleted when the user clears his history
    so that Aunt Maude doesn’t come across any visited Web sites that would make her
    blush.


    +   Only allow voting by users who are logged in. This technique provides a solid
    means of tracking the user, and there is no way the rating system can be forged.
    The obvious disadvantage of this method is that the user needs to register with
    yet another Web site.'
