    # ## RUNNING THE APPLICATIONS


    Running the different applications included with the disc is simple—just double-click
    one of the icons on the desktop to access that particular application. When you
    double-click an application icon, Firefox opens and displays the application that
    icon represents in the window. As an example, double-clicking the Forums icon
