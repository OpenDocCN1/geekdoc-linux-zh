    # ## Logging Out Users


    To log out a user, unregister the three sessions created in the login page. Remember
    that the menu bar uses sessions to track which options are currently selected,
    so you can''t simply destroy the session. Add the following code from Example
    11-6 to userlogout.php.


    > EXAMPLE 11-6 Don''t destroy the session, because the menu uses session variables.


    ```

    ?php


    session_start();


    require("config.php");


    session_unregister("SESS_USERNAME");

    session_unregister("SESS_USERID");

    session_unregister("SESS_USERLEVEL");

    header("Location: " . $config_basedir);

    ?>

    ```


