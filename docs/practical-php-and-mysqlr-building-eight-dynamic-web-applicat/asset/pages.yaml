    # NOTE


    # Unordered and Ordered Lists


    In *bar.php*, you create an *unordered* list, and it displays as bullet points.
    You can also use an *ordered* list by using the `<ol>` tag (you still add `<li>`
    items inside the tag). An ordered list uses numbers instead of bullet points,
    such as:


    +   1. One item.

    +   2. Another item.

