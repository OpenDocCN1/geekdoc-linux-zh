- pgno: 206
  md: "The `showcart()` function does not include a link to the checkout, because\
    \ not every page needs one. The block of code after the function call checks if\
    \ an order number is available and if so, a check is made to see if the cart contains\
    \ any items. If the cart contains one or more items, the checkout link is displayed.\n\
    \nAdd the `showcart()` code to `functions.php`:\n\n```\nfunction showcart() \n\
    {\nif($SESSION['SESS_ORDERNUM'])\n{\nif($SESSION['SESS_LOGGEDIN'])\n{\n$custsql\
    \ = \"SELECT id, status from orders WHERE customer_id = \" . $SESSION['SESS_USERID']\
    \ . \" AND status < 2;\";\n$cuvres = mysql_query($custsql);\n$custrow = mysql_fetch_assoc($cuvres);\n\
    }\n```\n\nThe outer `if` check in the function determines if an order number exists.\
    \ If it does, a second `if` checks if the user is logged in. If this is the case,\
    \ the query selects the row from the `orders` table that has the user `id` for\
    \ the user and in which the status is 0 or 1. The query should return a single\
    \ row only.\n\nThe main query to grab the item details is now ready to run:\n\n\
    ```\n$custrow = mysql_fetch_assoc($cuvres);\n$itemssql = \"SELECT products.*,\
    \ orderitems.*, orderitems.id AS itemid FROM products, orderitems WHERE orderitems.product_id\
    \ = products.id AND order_id = \" . $custrow['id'] . \";\";\n$itemsres = mysql_query($itemssql);\n\
    $itemnumrows = mysql_num_rows($itemsres);\n}\n```\n\nIf no user is logged in,\
    \ a similar `SELECT` query is made to get the order number, but the match is made\
    \ on the current session `id`. After this query, the list of items is returned:\n\
    \n```\n$itemnumrows = mysql_num_rows($itemsres);\n}\n\nelse\n{\n$custsql = \"\
    SELECT id, status from orders WHERE session = '\" . session_id() . \"' AND status\
    \ = 2;\";\n$cuvres = mysql_query($custsql);\n$custrow = mysql_fetch_assoc($cuvres);\n\
    ```"
