    ;\n}\n```\n```\n\n# NOTE\n\n# Using the LEFT Join on this Page\n\nThe reason for\
    \ using the **LEFT** join on this page is important. If the **subjects** table\
    \ has an **owner_id** set to something other than 0, an **INNER** or **LEFT**\
    \ join can relate the **owner_id** to the **user id** in the **users** table.\
    \ If, however, the subject has no owner and the **owner_id** is set to 0, an **INNER**\
    \ join fails because no user with the id 0 exists in the **users** table. When\
    \ you use a **LEFT** join, this mismatch still returns the data, but the mismatched\
    \ information is set to **NULL**.\n\nIn this project, you use a combination of\
    \ joins that use the **JOIN** and **WHERE** syntax. This ensures that you are\
    \ exposed to both methods of creating joins.\n\nIf the subject has no owner, check\
    \ to see if a user is logged in and display a link to the subject ownership page:\n\
