  md: "# ## Logging Out Users\n\nThe process of logging out a user is a little different\
    \ from some of the earlier projects in the book. Instead of destroying the entire\
    \ session with `session_destroy()`, you instead un-register the user’s session\
    \ variables. You can’t run `session_destroy()` because it destroys the administrator’s\
    \ login session when the administrator is logged in as both a normal user and\
    \ an admin.\n\nCreate `logout.php` and add the code:\n\n```\n```php\n<?php\n\n\
