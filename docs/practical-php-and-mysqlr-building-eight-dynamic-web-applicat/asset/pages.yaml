    <p>Thankyou for your vote.</p>\";\n}\n?>\n```\n```\n\n# ## MANAGING STORIES\n\n\
    To ease the creation and processing of forms, **HTML_QuickForm** is used. **HTML_QuickForm**\
    \ simplifies the display and validation of forms and also has the side benefit\
    \ of reducing the amount of code in your script, making the code look a little\
    \ neater.\n\n**HTML_QuickForm** makes use of a technique called Object Oriented\
    \ Programming (**OOP**). The idea of **OOP** is that you have a series of classes\
    \ that describe common types of operation, and you can use these classes as blueprints\
    \ to create an object. Imagine you were a higher being and able to create a farm\
    \ full of animals. You might have class called **Mammal** that creates and object\
    \ with the characteristics of a mammal. You might have another class called **Dog**\
    \ that inherits the **Mammal** class but adds the characteristics unique to a\
    \ **Dog**. This is the basis of how **OOP** works. In a technical context, you\
    \ may have a class called **Button** that specifies very general button concepts\
    \ and then have different **PushButton** and **ToggleButton** classes that inherit\
    \ **Button**.\n\n![](img/c75d0c4fa51711b62f211459ae794f3f_465_0.png)\n\n# ###\
    \ Why Use the Traditional Procedural Method?\n\n**OOP** is a huge and varied subject,\
    \ and although **PHP** can be used for **OOP**, this book resorts to the traditional\
    \ procedural method of development because it is simpler to understand and use.\
    \ In addition, the **OOP** way of creating **PHP** scripts is not used as extensively\
    \ as the procedural method."
