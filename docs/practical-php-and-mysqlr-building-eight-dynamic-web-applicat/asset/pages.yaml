    # ## CREATING YOUR SEARCH ENGINE


    Search engines are a common feature of most Web sites, but they are essential
    for sites that catalogue a large quantity of information. With a search engine,
    users can effectively find anything they want easily.


    Search engines are notoriously complex applications to write. Not only do you
    need to ensure the search term entered by the user brings back the correct results,
    but also the search engine may need to be usable in different ways. In addition,
    the results may need to be returned by order of relevance, special symbols may
    need to be supported in the search, and the whole process needs to work quickly.
    If users experience a huge delay between clicking the Search button and getting
    the results, she will likely get bored and leave. You can see how Google makes
    its money.


    Another interesting challenge with a search engine is how you order the results.
    If you search for “rock” at a music Web site, hundreds or thousands of results
    may be returned. To make this information easily digestible, the results should
    be displayed as a series of pages, each of which contains a portion of the results.
    This technique is called *paging* and is an essential skill when building the
    perfect Web site.


    There are different methods of handling your search, and you could spend your
    entire life making the search work well. In this project, you create a simple
    search engine that is suitable for small sites. A huge site with millions of records
    would need to use an alternative solution, using relevance results (MySQL can
    provide relevance figures for searches).'
