- pgno: 178
  md: "+   The `topic_id` field in the `messages` table stores the same value as the\
    \ `id` field in the `topics` table.\n+   - The `forum_id` field in the `topics`\
    \ table stores the same value as the `id` field in the `forums` table.\n+   -\
    \ The `cat_id` field in the `forums` table stores the same value as the `id` field\
    \ in the `categories` table.\n\nTo create the first relationship, go to phpMyAdmin,\
    \ click the SQL tab, and add the following code:\n\n```\nALTER TABLE `messages`\
    \ ADD FOREIGN KEY(`topic_id`) REFERENCES `topics` (`id`) ON DELETE CASCADE;\n\
    ```\n\nHere you change the `messages` table (ALTER TABLE `messages`) and specify\
    \ that the `topic_id` (ADD FOREIGN KEY (`topic_id`)) relates to the `id` field\
    \ in the `topics` table (REFERENCES `topics` (`id`)) with cascading deletes enabled\
    \ (ON DELETE CASCADE).\n\nRun a very similar statement, but with different tables\
    \ and fields for the second relationship:\n\n```\nALTER TABLE `topics` ADD FOREIGN\
    \ KEY(`forum_id`) REFERENCES `forums` (`id`) ON DELETE CASCADE;\n```\n\nAnd, finally,\
