    # Learning Database Theory


    It should be noted that database design is a huge subject, and there simply isn''t
    the space in this book to provide a thorough exapanation of database design theory
    and referential integtrity. If you are new to database design and would like to
    understand how to design a solid database structure, consult your local bookstore
    and take a look at one of the many books on the subject.


    In this example, you will use two tables to store the data: a products table and
    a categories table. The products table will contain the following fields:


    +   - id

    +   - cat_id

    +   - product_name

    +   - description

    +   - price


    Whenever you create a table, it is essential that you have a means of pulling
    out a unique record. To do this, you need to be able to identify certain fields,
    or groups of fields, that can assist you in adding uniqueness when pulling out
    a specific record. For example, if you were storing a list of customers, you might
    think that you could reference a unique record by searching for the name. This
    would not work, however; a number of people share the same name and, hence, are
    not unique. Another option is to search for the name AND the postal code. Again,
    this would not work because there may be more than one person with the same name
    living in the same postal code. This may be unlikely, but the point is that you
    should not base this uniqueness judgment on likeness—it absolutely *must* be unique.


    The solution to this problem is to create an additional field that contains a
    unique ID number for that record. Each time a new record is added to the database,
    this number will be increased by 1, and as such you will have this unique ID by
    which you can reference each record. MySQL includes support to make this unique
    number very easy to implement. In the field list for the previous products table,
    the'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'very first field (the **id** field) stores this unique number. This unique
    field (be it a unique number or some other unique field such as a username) is
    called a **primary key**. You will use primary keys throughout the book.


    The second field in the previous list is **cat_id**. This field is called a **foreign
    key** and will be matched to the primary key of the **categories** table, discussed
    next. The other fields in the table contain generic information about different
    aspects of the product.


    The **categories** table contains a series of fields that pertain to the different
    types of product categories. This table includes the following fields:


    +   - **id**

    +   - **category**


    As you can see, this table is rather simple, because the aim of the table is simply
    to provide a means to store information about the category. In this simple example,
    you will just store the name of the category in the table as well as its primary
    key field.


    # # How the Tables Relate to Each Other


    With the two tables designed, it now makes sense to discuss how they relate to
    each other. The relationship that is created between the two tables is performed
    by matching certain types of information. In these two tables, this match is made
    between the **id** field in the **categories** table and the **cat_id** field
    in the **products** table. If both fields contain the same number, a relationship
    exists.


    When you add records to the **products** table, instead of adding the text name
    of the category in the **cat_id** field, you instead store the **id** value associated
    with the relevant category. For example, if the first category in the **categories**
    table is *Swimming* and has an **id** of 1, you would store the number 1 in the
    **cat_id** field of the **products** table for a swimming-related product. Later,
    when you write code to pull information from the database, you can make use of
    these different relationships to pull different types of information.


    At this point, you may be wondering what the benefits are of separating this information
    into separate tables. Why not just include the name of the category in the field?
    There are various practical reasons for this separation, as follows:


    +   - The first benefit becomes obvious when you want to change the name of the
    **category**. If you wanted to broaden the category from *Swimming* to *Water
    Activities*, for example, you would need to go through each record and change
    the field manually. If you used two tables to separate the data, you'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# CHAPTER 2  Getting Started with PHP and MySQL


    would need to change only a single record to adjust the category, and then the
    changes would be reflected in all related records.


    +   If you use separate tables, you can associate more information with the category.
    There is no reason you could not add extra fields in the **categories** table
    later to add features such as a *description* of the category, *category icon*,
    *translated definitions*, and more.


    +   A big reason for extracting data into separate tables is ease of use. If you
    have a single table with a huge number of fields, it looks a lot more complex
    and difficult to deal with. It is better to have a number of simple, smaller tables.


    +   If you spread your data across a number of smaller tables, your database will
    perform more efficiently, because it will not need to trudge through endless amounts
    of irrelevant data.


    Separating your information into different tables has a number of benefits, and
    it is certainly the *right* way to develop database-driven applications. You will
    see many examples of how this separation of data across tables works throughout
    the book.


