    After you set the variables, you can make the connection. This happens with the
    `$db = mysql_connect($dbhost, $dbuser, $dbpassword)` line. This line uses the
    mysql_connect( ) function to pass the host, username, and password variables to
    the MySQL server and put the result of the connection in the $db variable. You
    then use the $db variables as a pointer to the main connection. To keep the code
