    To best explain this code, review the following bulleted points to see what hap-pens.
    As you read each bullet, reference the code you typed into your editor. All set?
    Here goes...


    +   At the top of the page, a query returns the product with the id GET variable.
    If no rows are returned, the page redirects to the site''s base URL.


    +   The form is displayed and includes a drop-down select box that uses a for
    loop to provide options from 1 to 100. In addition to the form, some product information
    is displayed.


    +   When the user submits the form, the page is reloaded and a check is made to
    see if a SESS_ORDERNUM variable exists. If it does, this means an order is already
    open and an INSERT statement adds the product id and quantity to the orderitems
    table, in which the order_id is SESS_ORDERNUM.


    +   If no SESS_ORDERNUM exists, an order must be created in the orders table before
    you can add the item to the orderitems table. A check is then made to see if the
    SESS_LOGGEDIN session variable exists. If it does, the user is already logged
    in and an order is created before the item is added to the orderitems table. If
    SESS_LOGGEDIN does not exist, the user is not currently logged in (they possibly
    don''t have a user account). As such, an order is created in the orders table
    (using session_id() to get the unique session id) and then the item is added to
    the orderitems table.


    +   The total field in the orders table is updated. This is performed by calculat-ing
    the price multiplied by the quantity (the result is stored in $totalprice).


    +   Finally, the page redirects to the cart summary page on showcart.php.


    Before you click the Submit button, make sure your page looks similar to the one
    shown in Figure 6-5.'
