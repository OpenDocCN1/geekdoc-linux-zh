  md: '# CHAPTER 8


    # Creating a Web-Based Calendar


    For most of us, life is increasingly busy. Unless you made a few million in the
    stock market and now live aboard a gold-plated yacht, keeping your meetings, social
    events, dentist appointments, and basket weaving club meetings straight is a daily
    struggle.


    In this project, you will create a Web-based calendar to help with these struggles.
    The project implements everything you need to manage your life—the ability to
    view months at a time, display event information, and add new events. Although
    simple in concept, calendars offer a number of interesting challenges for developers.
    To make the project even more interesting, you explore Ajax, a technology set
    that provides for highly dynamic Web sites that function much like desktop applications.
    Plug yourself in, stretch those fingers, and get ready!


    # PROJECT OVERVIEW


    To get a clear idea of how the project will work, take a look at the following
    use case:


    Susan has a terrible memory. Although she is extremely popular among her friends
    and co-workers, Susan often accepts invitations to parties and events and then
    promptly forgets about them. After one too many missed dinner appointments, she
    decides to use a Web-based calendar, one she can access from any Web browser,
    anywhere in the world.


    Susan goes to her calendar and enters her login details. After she successfully
    logs in, she can see the current month, as well as each of the events she booked
    for that month—all located on the correct day. The calendar''s sidebar'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'also includes a list of the events occurring in the near future. To view infor-

    mation about a specific event, Susan clicks the event name, and the details

    appear (also in the calendar sidebar).


    Susan realizes that she added an event for the coming Saturday, which she

    needs to cancel. To delete it, she clicks the X button next to event. The cal-\endar
    is updated, and the event disappears.


    Susan now needs to add a new event (her dachshund''s training class) to the

    calendar. She clicks on the day that the class is scheduled, and the sidebar is

    redrawn with a form that she can fill in. She adds the name of the event, the

    start and end times, and a short description. She then clicks the Add Event

    button, and the calendar refreshes, displaying the new event.


    # ## BUILDING THE DATABASE


    The database you will create is shown in Figure 8-1.


    # **FIGURE 8-1**


    To say that the database in this project is simple is

    quite an understatement!


    ![](img/c75d0c4fa51711b62f211459ae794f3f_280_0.png)


    With only two tables in the project (neither of which are related), this is an

    incredibly simple database to set up. The events table contains a list of the
    events

    in the calendar, and the users table contains the user logins.


    # ## Implementing the Database


    Start phpMyAdmin. Create a new database called simplecal and add the following

    tables.


    # ### The events Table


    +   - id. Make this an INT (several events are possible) and turn on auto_incre-

    +   ment. Set this field as a primary key.


    +   - date. Make this a DATE.


    +   - starttime. Make this a TIME.


    +   - endtime. Make this a TIME.


    +   - name. Make this a VARCHAR with a length of 50.


    +   - description. Make this a TEXT.'
