- pgno: 67
  md: '# CHAPTER 3


    # Running the Projects


    This book is crammed full of projects, lots of delightfully delicious projects
    that show you how to do interesting things with PHP and MySQL. Within each project
    are pages and pages of source code that gradually build up each project. Although
    you are more than welcome to sit there and carefully type each line as you go,
    we figured you might want to just run the projects right away and see how they
    work. Sound good? Well, you will be pleased to see that the shiny disc wedged
    into the book provides you with hours of project-running enjoyment!


    So what is on the disc? Well, the disc is called a Live CD, and it provides you
    with a simple and easy means of running a complete operating system on your computer
    without touching your existing hard disk in any way. The way it works is that
    you pop the disc in the drive and boot from it. The computer then pretends that
    the CD is a hard disk and runs the operating system like any other. This means
    that you can play around with the system as much as you like, and it won''t touch
    your precious hard drive. Cool, huh?


    # ABOUT THE DISC


    With most programming books, you often get a disc that contains the code from
    the book. This handy supplement saves hours of laborious copying of code from
    the book to your computer. Despite saving hours of typing, the code-on-the-disc
    approach still makes the assumption that you actually have the software required
    to run it. As such, if you know you want to learn something (such as PHP and MySQL),
    but you don''t have the PHP and MySQL software to run the code, you are stumped.


    Not so with this book. The Live CD not only contains the code for each of the
    projects, but also includes a complete development environment in which to run'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'the code. You get PHP and MySQL, as well as Apache, phpMyAdmin, Mozilla Firefox,
    PEAR modules, and much more—all neatly contained on the Linux operating system.


    Now, we know what we are thinking—“Oh, I need to go out and buy a new hard disk,
    or I need to partition my existing disk, or I need to…” Relax. There is no need
    to buy a new hard disk, no need to partition, and no need to worry. The entire
    system runs from the CD.


    # Live CDs: A New Approach


    In recent years, the Live CD has really taken off. The idea is simple: You take
    an operating system (usually Linux), and instead of running it from a hard drive,
    you run it from a CD or DVD. This provides a number of benefits. First, you can
    try out an operating system without actually installing it. When you run the disc
    included with this book, it won’t ever touch your hard drive. Because the system
    runs from the CD, you can play around with it, break things, and experiment. Not
    only is your hard drive completely safe, but you can also reboot the CD to get
    the original system back at any time. Second, a Live CD provides a great way to
    “take your system” with you; just put the disc in a drive of any computer and
    reboot to run it.


    # Starting the System


    Not all computers automatically attempt to boot from the CD/DVD drive when starting.
    If you turn on your computer and see the CD/DVD drive light flicker, the computer
    is looking for something to boot. In this case, put the Live CD in and reboot
    to get started!


    If the light did not flicker, you may need to enable booting from the CD/DVD drive
    in your computer’s BIOS. To access the BIOS setup, your computer will have a particular
    key or key combination to press to enter it. Common keys are F12 and Del. I recommend
    that you refer to the manual for your computer or motherboard to find out how
    to boot from the CD/DVD drive.


    For best results, find a computer that has lots of RAM. Because a Live CD is a
    read-only medium, areas that need to be written to for running the Linux system
    are stored in RAM. So, for example, the live CD will boot faster and run better
    on a computer with 1GB or more of RAM than it will on a computer with 256MB of
    RAM.


    When your system is enabled to boot, pop the disc in the drive and reboot. After
    a few seconds, the screen shown in Figure 3-1 should appear.


    Press Enter to the start the system. Soon, you’ll see the desktop boot and the
    splash screen appear, as shown in Figure 3-2.'
  merge: -1
  img_proc: true
