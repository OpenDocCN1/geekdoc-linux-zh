    # ## Creating the Session


    To use sessions, first add the session_start() function at the very beginning
    of each page for which you want to use sessions. It is critically important that
    session_start() is right at the beginning—no fancy HTML, no picture of your Aunt
    Maud, and not even white space should come before it.


    To demonstrate the importance of this, create a new file called sessions.php and
    add the following code:


    ```

    ```php

    <?php

    session_start();

    ?>

    ```

    ```


    When you run the script, you will not see anything; the session support has been
    happily built into your page. Now adjust the code and put a single white space
    before the <php tag:


    ```

    ```php

    <?php

    session_start();

    ?>

    ```

    ```


    When you make this tiny change, you are given a particularly venomous error message:


    > Warning: session_start() [function.session-start]: Cannot send session cookie
    - headers already sent by (output started at /opt/lampp/htdocs/sites/startingchapter/sessions.php:1)
    in /opt/lampp/htdocs/sites/startingchapter/sessions.php on line 3


    The reason it is so important to not have anything before session_start() is that
    the sessions framework makes use of the HTTP headers that form the mechanics of
    the Web page. These special headers are pre-pended to each Web page and as such,
    if you add any content before session_start() the script will be trying to send
    out content (such as the white space), then the headers, and then the main content.
    This is not the way the Web works and, hence, PHP will shout at you in the form
    of the previous warning message.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# All About Headers


    Every Web page on the Internet has some information called **headers** that is
    invisible to most users. Headers store a number of pieces of information that
    browsers care about. Here are some example headers:


    ```

    ```

    GET / HTTP/1.

    Host: www.yourfavewebsite.org

    Connection: close

    Accept-Encoding: gzip

    Accept: text/xml, application/xml, application/xhtml+xml, text/html;q=0.9,text/plain;q=0.8,image/png,
    */*;q=0.5

    Accept-Language: en-gb, en;q=0.5

    Accept-Charset: ISO-8859-1, utf-8;q=0.7, *;q=0.7

    User-Agent: Mozilla/5.0 (X11; U; Linux i686; en-GB; rv:1.8.0.3) Gecko/20060523
    Ubuntu/dapper Firefox/1.5.0.3

    Referer: http://www.someotherwebsite.net/

    ```

    ```


    Beneath the headers lies the content. When you add content to the page, the headers
    are added automatically. As such, when data is added to the page, the headers
    are also sent and cannot be modified after they have been sent.


    When you use sessions, the sessions system modifies some of these headers, and
    this is why you must add session_start() before any data is added to the page.


    # Using Session Variables


    Before you use a session variable, you need to register it. This is achieved with
    the rather predictably named `session_register()` function. To use it, specify
    the name of the variable to create inside the brackets. To demonstrate this, add
    the following line of code to sessions.php after `session_start()`:


    ```

    ```php

    session_register("userid");

    ```

    ```


    This line registers with the session handling system that the `userid` variable
    can be shared across pages. The next step is to actually set this variable to
    something useful. Add this line next:


    ```

    ```php

    $_SESSION[''userid''] = 10;

    ```

    ```


    In this line, you are using the special `$ _SESSION` superglobal to reference
    the `userid` variable. The `$ _SESSION` syntax should look fairly familiar, as
    you used `$ _GET` and `$ _POST` earlier to access GET and POST variables respectively.'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'To test whether your session variable is accessible on the second page, create
    a file called sessions2.php, and add the following code:


    ```

    ```php

    <?php

    session_start();

    echo "The userid session variable is: " . $_SESSION[''userid''];

    ?>

    ```

    ```


    Remember to visit sessions.php first (so the variable is set) and then visit sessions2.php
    to see that the variable is shared across the pages. To access the session variables,
    you simply include session_start() on the page and then refer to the variable
    with $_SESSION.


    The session information is available while the browser is open. When the browser
    window is closed, the session information is lost. Although this is often a suitable
    means of destroying a session, sometimes you need to forcibly destroy the session
    data on command. To do this, you can use the following command:


    ```

    `session_destroy();`

    ```


    All the session variables are then suitably deleted.


    # SUMMARY


    This chapter explored some of the core concepts that need to be understood before
    you can move on and start writing applications. Instead of spending hours covering
    every nuance of PHP and MySQL, you have learned the fundamentals needed to move
    on, and each application will present new skills, techniques, and ideas.


    As with any programming language, or natural language for that matter, practice
    really does make perfect. Just reading how to do something in PHP and actually
    understanding it are often two separate things. A great way to get accustomed
    to the language is to create lots of little scripts that test different aspects
    of the language. These scripts are useful not only for learning, but also they
    can be a great reference point further down the line when you have forgotten how
    to do something.'
  merge: -1
  img_proc: true
