- pgno: 331
  md: "A query is created to gather the subject information and the username that\
    \ maps to the **subjects.owner_id** field. In previous projects the join was made\
    \ using the **WHERE** clause in the SQL, but here you are using the **LEFT JOIN**\
    \ syntax. The following paragraph describes how the syntax works:\n\nSelect the\
    \ username and subject information (**SELECT users.username, subjects.\\*** )\
    \ from the **subjects** table (**FROM subjects**) and then join the **subjects**\
    \ and **users** tables (**LEFT JOIN users**) with the relevant condition (**ON\
    \ subjects.owner_id = users.id**) in which the subject id is the same as $\\text{\\\
    $validsub** (WHERE subjects.id = $\\text{\\$validsub.**)\n\nWhen writing joins,\
    \ you can use a variety of different types of join (**INNER, OUTER, LEFT**, and\
    \ **RIGHT**), with **INNER** and **LEFT** as the most common variants. An **INNER**\
    \ join connects tables with the conditions that you specify. A **LEFT** join performs\
    \ the same process but also fills in any mismatched fields with **NULL** values.\
    \ Check the data returned to see if the subject has an owner. If 0 is returned,\
