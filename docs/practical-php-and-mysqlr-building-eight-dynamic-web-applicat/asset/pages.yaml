    # STARTING TO CODE


    One of the challenges in creating a shopping cart is dealing with both registered
    and unregistered users. For registered users, there is no problem because, when
    adding information to the tables, you can use their IDs to track them. The challenge
    arises with unregistered users. How do you track them?'
