  md: '![](img/c75d0c4fa51711b62f211459ae794f3f_71_0.png)


    FIGURE 3-4 Loading an application is as simple as double-clicking an icon.


    # ### USING XAMPP


    Other than the operating system included on the Live CD, the most critical piece
    of software is XAMPP. The XAMPP project provides the core pieces of software required
    for LAMP development (Apache, MySQL, and PHP) in a single download-able archive.
    As such, you can go to the XAMPP Web site (http://www.xampp.org), download the
    latest version to your computer, unzip it, and run it; you now have a complete
    LAMP system set up to do your development. This saves the hours of tweaking and
    configuration and frustration with the non-trivial installation of the separate
    Apache, MySQL, and PHP components.


    Not only does XAMPP ease the installation of these components, but it also includes
    a huge array of additional software, including phpMyAdmin (used to create databases
    easily), PEAR modules (additional features in PHP), graphics libraries, documentation,
    and much more. XAMPP really does provide a comprehensive and complete Web development
    platform.


    Although you can just boot from the Live CD, start XAMPP, and access your applications
    straight away in the Web browser, it will be useful to have a look at'
  merge: -1
  img_proc: true
- pgno: 72
  md: "some of the common features of XAMPP. The following sections cover these features,\
    \ so you can get to know the system.\n\n> **NOTE**\n> \n> **Running XAMPP Elsewhere?**\n\
    > \n> If you want to run the XAMPP included on the disc on a different operating\
    \ system, you can find a file called *laminp.tgz* in `/opt`. Just copy that file\
    \ to a Linux system, unzip it, and then run `/opt/laminp/laminp`, as shown in\
    \ the following “Starting and Stopping” section.\n\n# ## Starting and Stopping\n\
    \nXAMPP installations in Linux are always installed to the `/opt` directory. Inside\
    \ the XAMPP directory is the `laminp` command, which can be used to start and\
    \ stop the XAMPP system. To start XAMPP, run the following command:\n\n```\n`foo@bar\
    \ : /opt/laminp $ sudo /opt/laminp/laminp start`\n```\n\nBecause XAMPP provides\
    \ system services, you need to be the super-user to run the command, the reason\
    \ for using `sudo`. You can also stop XAMPP by using the following:\n\n```\n`foo@bar\
    \ : /opt/laminp $ sudo /opt/laminp/laminp stop`\n```\n\nYou can stop and start\
    \ XAMPP by using `restart` (this is the command that the Start XAMPP icon on the\
    \ desktop runs):\n\n```\n`foo@bar : /opt/laminp $ sudo /opt/laminp/laminp restart`\n\
    ```\n\nThis command actually has a huge range of features available, and you can\
    \ see them all by running the command without any options:\n\n```\n`foo@bar :\
    \ /opt/laminp $ sudo /opt/laminp/laminp`\n```\n\nTable 3-1 provides a list of\
    \ some of the commands that may be of particular interest for starting and stopping\
    \ specific components.\n\nWhen the XAMPP system is started, you can use the Web\
    \ browser to view the running server by visiting `http://localhost`. When you\
    \ visit that page, you will see a number of included Web pages that are part of\
