- pgno: 493
  md: "```\n</ul>\n</p>\n<?php\n\nrequire(\"footer.php\");\n?>\n```\n\nInside this\
    \ file you include a few paragraphs in `<p>` tags. If you want to create valid\
    \ HTML, it is important that each paragraph is within both the opening `<p>` and\
    \ closing `</p>` tags (just like with other tags such as `<i>` and `<strong>`).\n\
    \n> NOTE\n> \n> - `<b>` Versus `<strong>`\n> \n> As you wander the streets of\
    \ the Internet learning about PHP and MySQL, you may see some people use the `<b>`\
    \ tag instead of `<strong>` and wonder what the difference is. Surely they both\
    \ just indicate bold text, right? Well, not so much.\n> \n> The `<strong>` tag\
    \ is intended to add strong emphasis to the text it is applied to, whereas the\
    \ `<b>` tag is intended to simply make text bold. This can cause an issue with\
    \ some accessibility tools such as screen readers. If you want to ensure that\
    \ your code works well on all browsers and devices, including accessibility software,\
    \ use the `<strong>` tag.\n\n# START BUILDING THE STYLESHEET\n\nThe main focus\
    \ of this chapter is to cover how the CSS stylesheet is created. To make this\
    \ as simple as possible, you will build up the stylesheet step by step.\n\nTo\
    \ begin, create a new file called `stylesheet.css` and add the following block:\n\
    \n```\nbody {\n    font-family: \"trebuchet ms\", verdana, sans-serif;\n    font-size:\
    \ 12px;\n    line-height: 1.5em;\n    color: #333;\n    background: #ffffff;\n\
    \    margin: 0;\n    padding: 0;\n    text-align: center;\n    width: 100%;\n\
    }\n```"
