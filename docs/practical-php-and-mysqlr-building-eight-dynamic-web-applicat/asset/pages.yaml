  md: '# MANAGING SUBJECTS


    Subjects are the core foundation of the content that this project manages, and
    are very similar to Categories in the blog project in Chapter 4. Managing subjects
    is something that you naturally only want the administrator to be able to do.
    If you were to give a regular user the run of the subjects, anything could happen.


    The capabilities to add and delete subjects are important pieces of functionality
    to create, but deleting is a capability with which you should take special care.
    By using InnoDB tables in MySQL, any accidental deletions of a subject cause all
    of the child topics and questions to be deleted also. As such, be very careful
    when working through this section.


    # Adding Subjects


    Adding a subject to the database is as simple as creating a form and adding the
    contents of the form to the database. Create a new file called addsubject.php
    and add the following code:


    ```

