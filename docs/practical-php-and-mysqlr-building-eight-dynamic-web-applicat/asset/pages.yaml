  md: "# NOTE\n\n# Horribly Ageist?\n\nYou may have noticed that many of the examples\
    \ here are age related. This can mean one of two things: I am either horrifically\
    \ ageist or about to have a mid-life crisis. Well it’s neither, drama fans. Age\
    \ is just a great subject for sample programs.\n\nThere are two major types of\
    \ conditional to explore here: the if and switch blocks. The if statement is useful\
    \ for asking a single question of a particular condition, whereas a switch is\
    \ useful for checking whether a particular value meets any one of a number of\
    \ options.\n\n# The if Statement\n\nThe if statement is used extensively throughout\
    \ PHP development. You use if to check conditions across different pages in a\
    \ variety of different ways. To get started, you’ll first create a very simple\
    \ example. Add this code to a file named if1.php:\n\n```\n```php\n<?php\n\n$age\
    \ = 21;\n\nif($age == 21) {\n    echo \"Congratulations!\";\n}\n?>```\n```\n\n\
    In this example, you first created a variable called $age and set it to 21. You\
    \ then used the if statement to check if $age is equal to 21 and if it is, the\
    \ text Congratulations! is displayed in the browser. The magic in this statement\
    \ happens between the brackets. You may have noticed that two equals signs are\
    \ used instead of a single equals sign. This is important. When you use two equals\
    \ signs in your code, you are comparing the values on either side. In the preceding\
    \ example, the use of the two equals signs compares the $age variable and the\
    \ value 21. If you use a single equals sign, the variable on the left is set to\
    \ the right value.\n\nIn the previous example, the if check was fairly straightforward.\
    \ The problem with the previous example, however, is that it only caters for a\
    \ match. In many cases, you need to check when the if does not match.\n\nTo achieve\
    \ this, you can bolt on an else to the if block. This small addition will execute\
    \ some code when the if doesn’t match."
