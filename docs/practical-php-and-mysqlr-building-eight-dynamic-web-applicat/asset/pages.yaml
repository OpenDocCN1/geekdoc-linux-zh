    \ < 18) {\n    echo \"You are age \" . $age . \" and still not an adult<br />\"\
    ;\n    $age++;\n}\n\necho \"You are now an adult!\";\n?>\n```\n```\n\nIn this\
    \ example, you first created a variable, called **$age**, that is set to 1. You\
    \ then created a **while** loop that repeated the code between the { and } brackets\
    \ while **$age** is less than 18. Inside the **while** loop, a line is printed\
    \ out indicating the current age, and then the **$age** variable is incremented\
