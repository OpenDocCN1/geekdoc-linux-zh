- pgno: 476
  md: 'NOTE


    # Optimizing the Database


    Optimizing your search engine is coupled closely with the size of a Web site.
    Aside from providing a suitable search, database optimization is essential for
    larger sites. When the number of records enters the thousands, hundreds of thousands,
    or millions, you should dedicate some time seriously researching database optimization.


    A useful technique for optimizing the database is to index it. Creating an index
    builds a reference of the data and can be used by searches to return the results
    quicker. Take a look at http://www.mysql.com/ for details about optimization.


    The first step is to create a box in which users can type search terms. From a
    usability perspective, this search box should always be visible for two reasons:


    +   - A search box is a safety net for the user. If he starts getting lost on
    a large Web site, the search box provides a simple, single-shot way of finding
    what he needs.

    +   - Searching is a familiar concept to all modern computer users. The advent
    and popularity of Google has made the search box a familiar sight and a required
    component for a Web site.


    To implement the search box, use HTML_QuickForm and specify a different page to
    process the form results. Open bar.php and put the search box in the sidebar:


    ```

    echo "<h1>Search</h1>";


