- pgno: 468
  md: '$**object**->method(). The createElement() method takes three parameters. The
    first specifies the type of form element (in this case, `select` is a select box).
    The next parameter is the name you want to refer to the form element as. Finally,
    the third parameter is the label that should appear next to the form element.


    In the first line, the `&` symbol is used to create a reference. A reference is
    used to take the code on the right of the symbol and make the variable on the
    left refer to it. As such, `$s` refers to the form element.


    The second line uses the loadArray() function to load the select box with the
    values in `$cattr`. The select box is now complete. The next step is to add the
    completed select element to the form. This happens on the third line, with the
    addElement() method.


    Create the other form elements:


    ```

    $s->loadArray($cattr);

    $form->addElement($s);


    $form->addElement(''text'', ''subject'', ''Subject'', array(''size'' => 50, ''maxlength''
    => 255));

    $form->addElement(''textarea'', ''body'', ''Comment:'', array(''size'' => 50,
    ''maxlength'' => 255, ''rows'' => 20, ''cols'' => 80));

    $form->addElement(''submit'', null, ''Add Story!'');

    ```


    The first line creates a text box (using the text element type) with the name
    subject. The fourth parameter includes an array of additional options to specify
    the size and length of the box. The next two lines add a textarea box for the
    body of the story and, finally, a Submit button.


    Add the processing rules:


    ```

    $form->addElement(''submit'', null, ''Add Story!'');


    $form->addRule(''subject'', ''Please enter a subject'', ''required'', null, ''client'');

    $form->addRule(''body'', ''Add some body text'', ''required'', null, ''client'');

    ```


    These two lines add validation rules that ensure users cannot submit empty form
    elements. The first parameter specifies which form element to apply the rule to,
    and the second parameter is the error message that is displayed when the rule
    fails. The third parameter is the type of rule you want to use. HTML_QuickForm
    includes a range of different rules, and in this case, the `required` rule enforces
    typed input. A nice feature of HTML_QuickForm is that when you add a `required`
    rule, a small red star appears next to the form elements that must receive input.
    Nifty, no?'
