    # # Affirm Some Power and Moderate Some Questions


    Question moderation is open to both the site administrator and the owner of the
    subject to which the question was added. To make this process as simple as possible,
    the added questions are listed as shown in Figure 9-11.


    ![](img/c75d0c4fa51711b62f211459ae794f3f_363_0.png)


    Each question has three possible options: to view the details, or to allow or
    deny the question.


    This script has a number of different personalities. To access the different pieces
    of functionality, the page is passed a `func` GET variable, which is then run
    through a `switch` statement that has five possible outcomes:


