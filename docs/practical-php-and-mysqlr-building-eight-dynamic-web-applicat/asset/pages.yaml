    \ and copy the code into it:\n\n```\n```php\n<?php\nfunction pf_validate_number($value,\
    \ $function, $redirect) {\n    if(isset($value) == TRUE) {\n        if(is_numeric($value)\
    \ == FALSE) {\n```\n```"
