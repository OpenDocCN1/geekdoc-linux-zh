- pgno: 29
  md: '# # Getting Started with PHP and MySQL


    As the proud owner of Practical PHP and MySQL or a prospective owner rifling though
    it in a bookstore—you will be pleased to know that this book consists of a number
    of real-world Web applications that are built from scratch. Although the main
    focus of the book is to teach you how to create these applications, it is important
    to review some of the introductory aspects of learning PHP and MySQL. This chapter
    provides a quick primer.


    The intention of this chapter is not to be exhaustive, but to provide a solid
    introduction to PHP and MySQL—enough to get you started writing applications.
    Many PHP and MySQL books spend most of the time discussing abstract concepts that
    don''t relate in any way, and you can often see the eyes of the readers physically
    glazing over with sheer, unadulterated boredom. As a man who objects to any kind
    of retina glazing, you won''t find this kind of content here. The grand plan is
    to show you enough of PHP and MySQL to get started and then get on with the interesting
    stuff: writing applications.


    This chapter discusses core PHP language fundamentals such as loops and variables
    and then moves on to cover how to create a database and access it from PHP. The
    chapter concludes with coverage of sessions, a key technology used in most Web
    applications. Although this chapter provides an introduction to these concepts,
    the real action happens inside the applications you will write. Each project provides
    a means to explore further into the many aspects of programming PHP and MySQL
    Web applications, and the general ethos is of learning by doing instead of learning
    by reading.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '16 Practical PHP and MySQL


    # # Setting up PHP and MySQL


    When I started teaching people how to use PHP and MySQL, I would typically teach
    it within the safe confines of a computer lab, complete with a network of perfectly
    set up and configured machines. My students would come to the course, learn how
    to use the software, and leave incredibly excited about the potential that PHP
    and MySQL gave them. Then, a few days later, I would start getting e-mails detailing
    problems they were facing when installing PHP, MySQL, and Apache on Windows, Linux,
    or Mac OS X. Although the computer lab was great for teaching the software, the
    course back then did not cover installation—yet it was evidently such a hurdle.


    The problem is that PHP, Apache, and MySQL are really difficult to set up on Windows.
    They are much easier to set up on Linux because the major distributions typically
    include MySQL, Apache, and PHP packages, but on Windows it is a royal pain in
    the nether region. Back then, I was somewhat stumped about what to do—teaching
    the installation side of the software could take up a substantial amount of time
    on the course.


    Then, in a fit of pure genius, my colleague and friend Elliot Smith discovered
    XAMPP (www.xampp.org/). XAMPP provides a complete PHP, Apache, and MySQL (web
    development environment that can be installed by downloading, unzipping, and running
    the software. XAMPP makes the installation dramatically easier, and the software
    also includes a raft of addititions and extras that are genuinely useful, including
    PHP extensions, a Web front-end for MySQL (which is used throughout the book),
    and more. XAMPP is freely available for Windows, Linux, Mac OS X, and Solaris.


    It is recommended that you use XAMPP for setting up the software if you have never
    done it before. The following sections cover how to set up XAMPP on Windows and
    Linux.


    # ## Setting Up XAMPP on Windows


    To begin, download the latest XAMPP installer from www.xampp.org/. Double-click
    the installer and follow the instructions. After installation, load the XAMPP
    Control Panel by clicking Start > Programs > XAMPP.


    # ## Setting Up XAMPP on Linux


    To begin, download the latest XAMPP release from www.xampp.org/. Next, copy the
    installation file to /opt and then unzip it. If you don''t have an /opt directory,
    create it with ''mkdir /opt'' as the superuser. If you don''t have sudo installed
    on your'
  merge: -1
  img_proc: true
- pgno: 31
  md: "computer, you can become the superuser by running ‘su’ and entering your superuser\
    \ password.\n\nTo copy the file to /opt:\n\n```\nfoo@bar:~$ sudo cp xampp-linux-x.x-x.tar.gz\
    \ /opt\n```\n\nTo move to /opt and unzip the file:\n\n```\nfoo@bar:~$ cd /opt\
    \  \nfoo@bar:/opt$ sudo tar zxvf xampp-linux-x.x-x.tar.gz /opt\n```\n\nA stream\
    \ of files is now unpacked into a directory called **lampp**. Currently, all of\
    \ this unpacking has been done as the superuser, yet you will want your normal\
    \ user account to be able to write to the **htdocs** directory, so change the\
    \ permissions on the directory:\n\n```\nfoo@bar:/opt$ sudo chmod -R a+rw /opt/lampp/htdocs\n\
    ```\n\nYou are now all set to run XAMPP:\n\n```\nfoo@bar:/opt$ sudo /opt/lampp/lampp\
    \ start\n```\n\nYou can also stop XAMPP:\n\n```\nfoo@bar:/opt$ sudo /opt/lampp/lampp\
    \ stop\n```\n\nYou can now save your PHP code in /opt/lampp/htdocs and access\
    \ your new XAMPP server in your Web browser at http://localhost/.\n\n# NOTE\n\n\
    # XAMPP Control Panel for Linux\n\nRather disappointed with the nice graphical\
    \ XAMPP Control Panel for Windows, I wrote one in Python for Linux, and it is\
    \ now included with the official XAMPP release. You can find it in /opt/lampp/share/xampp-control-panel.\
    \ Just run it like this:\n\n```\nfoo@bar:/opt/lampp/share/xampp-control-panel$\
    \ sudo ./xampp-\\ncontrol-panel\n```\n\n# GETTING STARTED WITH PHP\n\nPHP and\
    \ HTML are good friends. Working side by side, the PHP and HTML pals are so reliant\
    \ on each other that it is virtually impossible to tear them apart. Whenever you\
    \ do any kind of Web development, you use PHP and HTML"
  merge: -1
  img_proc: true
- pgno: 32
  md: 'interchangeably on the vast majority of scripts that you write. Both your HTML
    and PHP code will reside in any files that end in .php.


    To begin, you''ll create a simple page that contains some HTML. Create a new file,
    and call it 1.php. Add the following code in the file:


    ```

    <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"

    "http://www.w3.org/TR/html4/loose.dtd">

    <html>

    <head>

    <title>Tough first script</title>

    </head>

    <body>

    <h1>The very first script</h1>

    <p>

    This is the first script!

    </p>

    </body>

    </html>

    ```


    In this example, you are writing some HTML to construct a simple Web page. This
    HTML first selects a suitable DOCTYPE (the dialect of HTML to use) and then goes
    on to set the title of the page (the text in the window border) with the <title>
    tag. Next, a large heading with the <h1> tag is added before then supplying the
    memorable words This is the first script! inside a paragraph (indicated by the
    <p> and </p> tags). If you have a burning ambition to change the memorable words
    to something else, so be it.


    # NOTE


    # Running Your Code


    When you create the files that store your code, make sure to place them in the
    directory that your Web server reads for files. This directory is typically called
    htdocs. If you are using XAMPP, this directory is called /opt/lampp/htdocs on
    Linux, and in Windows it is the htdocs directory inside the directory where you
    installed it.


    To run your code, remember that http://localhost points to this htdocs directory.
    As such, if you want to access 1.php, go to http://localhost/1.php in your Web
    browser.


    You may have noticed that this code has been stored in a file that has a .php
    extension instead of the .htm or .html extension. This is because all PHP scripts
    that you will use are ultimately converted into text that the Web browser can'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'understand. You should *always* remember that the Web browser has no idea what
    PHP is. The Web browser understands text, HTML, and CSS only. It is the Web server
    that runs PHP that does the job of processing the PHP before sending the text,
    HTML, or CSS back to the browser.


    Add a PHP block into your code:


    ```

    "<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01 Transitional//EN\" \n""http://www.w3.org/TR/html4/loose.dtd\"\n<html>\n<head>\n<title>Tough
    first script</title>\n</head>\n<body>\n<h1>The very first script</h1>\n<p>\nThis
    is the first script!\n</p>\n<p>\n<?php\n\necho "This is PHP code";\n\n?>\n</p>\n</body>\n</html>"

    ```


    In this example, you created another paragraph block and added a PHP block inside
    it. If you run the script again, you will see another line of text that displays
    in your Web browser.


    ![](img/c75d0c4fa51711b62f211459ae794f3f_33_0.png)


    # ### **QUICK TIP**


    In this book, the code shown in bold represents new code that is added to your
    script.


    When you want to use PHP code, encase the PHP commands within the `<?php` and
    `?>` tags. These two tags indicate the start and end points of a PHP block, and
    anything between these tags will be fed to the PHP interpreter and digested. You
    can think of these tags behaving in a similar way as the HTML `<!--` and `-->`
    comment tags, where everything inside those tags is considered a comment.


    Remember how the Web browser doesn''t understand PHP? To demonstrate this, look
    at the source code in your Web browser (usually by clicking **View > Source Code**).
    As you can see, there is no PHP in there. What happens is that the PHP'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'interpreter on the server reads any PHP commands, executes them, and spits
    out HTML as the final output. In this example, the PHP **echo** command was used
    to send the contents within the double quotes to the Web browser. Each command
    in PHP ends in a semi-colon (;), and you can see it at the end of the **echo**
    command.


    # **NOTE**

    **Using HTML Within PHP**


    You can use HTML tags within the PHP echo statement. The purpose of an echo statement
    is to send information to the browser, and if you want to embed HTML tags or other
    content (such as CSS or JavaScript) that is readable by Web browsers, you are
    free to do so. For example, change the preceding echo line to this:


    ```

    echo "This is <strong>PHP</strong> code";

    ```


    In this line, you are using the HTML **<strong>** tag to make a part of the echo
    statement bold. This is an incredibly useful and often used feature in PHP.


    Remember that you can only put HTML tags inside legitimate PHP commands. You can’t
    just dump HTML inside a PHP block like this:


    ```

    <?php

    <strong>Boogaloo with my didgeridoo</strong>

    ?>

    ```


    Everything inside the **<?php** and **?>** tags is expected to be PHP, and the
    **<strong>** tags are HTML (not PHP).


    # # Using Variables


    Variables are the bread and butter of any programming language. A **variable**
    is a small portion of memory that stores a particular piece of information. Imagine
    for a second that you have a cardboard box and a pen in your hand. You now decide
    to store your favorite CD in the box. To better remember what is in it later,
    you write ‘favealbum’ on the front of the box. You now know that if you look at
    the box and see ‘favealbum,’ you will remember that you have your slightly embarrassing
    Lep- rechaun Hits Volume 1 CD in there.


    This is exactly how variables work, except that a variable stores information.
    In your program, you can create a variable to store some information and then
    reference what is in that variable by the name of the variable itself. This is
    best explained with an example.'
  merge: -1
  img_proc: true
- pgno: 35
  md: "Create a new file called `simplevariable.php` and add the following code:\n\
    \n```\n```php\n<?php\n  $monkeys = 10;\n\n  echo \"Number of monkeys: \" . $monkeys;\n\
    ?>\n```\n```\n\nAll variables in PHP begin with a dollar sign ($). In the preceding\
    \ example, you first create a variable called $monkeys and then used the = sign\
    \ to set this to the value 10. This is the common way to create a variable in\
    \ PHP; you simply pick a variable name out of thin air (in this example, my love\
    \ of monkeys has been indulged) and then set the variable to store a particular\
    \ value. With $monkeys created, you can now read the code and mentally replace\
    \ $monkeys for the value 10 when you see it.\n\nOne important note at this point,\
    \ particularly for those of you with prior experience in other programming languages,\
    \ is that you do not need to indicate what type a variable will be in PHP. In\
    \ other languages (such as C/C++), you would need to indicate that a variable\
    \ containing a number is an integer variable. PHP is different and figures out\
    \ what the type is when you use the variable.\n\nWith the variable set, it is\
    \ then used in the next line in which the echo command is used to first display\
    \ Number of monkeys: and then the value of $monkeys is displayed next to it. When\
    \ you run the script, you should see the following output: Number of monkeys:\
    \ 10\n\nThis echo line uses a technique called concatenation. This bizarre-sounding\
    \ act provides a simple method of stringing together bits of text (called strings)\
    \ with the contents of variables. To do this, you use the . symbol (called the\
    \ concatenation operator) to glue together whatever is on the left and right sides\
    \ of the dot, or period. In the preceding code, the part on the left side is the\
    \ text Number of monkeys: and the part on the right is the contents of the $monkeys\
    \ variable.\n\nConcatenation is an important but often slightly confusing topic.\
    \ It does take a little while to get used to, particularly when using more complex\
    \ examples. As an example of this, change the echo line above to the following\
    \ line:\n\n```\n```php\necho \"You have \" . $monkeys . \" monkeys!\";\n```\n\
    ```\n\nIn this line, you used the concatenation operator twice to glue an additional\
    \ part onto the line. If you read the line from left to right, you can see how\
    \ You have is then glued to the value of $monkeys (10), which is then glued to\
    \ monkeys."
