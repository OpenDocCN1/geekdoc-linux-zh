    *In delete.php, when deleting a thread, you use $_GET[’forum’] to redirect to
    the forum page after the thread has been deleted. Don’t worry too much about validating
    this variable; it does not reference data going into the database and is merely
    used for displaying a page. If you are still concerned, however, and to be doubly
    safe against SQL injection attacks, validate the variable.*


