- pgno: 110
  md: 'Allowing restricted access for the owner to add and remove content is an essential
    feature, however. Having to log into phpMyAdmin to add content is not an ideal
    solution, so the master plan is to create pages to provide a convenient means
    of adding content. You need to provide a way for someone to log in, and the login
    details the user enters should match the ones in the *login* table. You will use
    PHP sessions (covered in Chapter 2) to track the user by sharing variables across
    different pages. If the user successfully logs in, you can set a session variable
    and then check to ensure that session variable exists on the restricted pages.


