  md: 'On this line, a series of GET variables pass data to the PayPal Web site. These
    GET variables are reserved words that PayPal can use to process the order. Table
    6-4 explains the purpose of each variable.


    # TABLE 6-4 PayPal variables, explained


    | PayPAL VARIABLE | SETTING | DESCRIPTION |

    |---|---|---|

    | business | "you%40youraddress.com"& | The name of the business running the site.
    |

    | item_name | urlencode($config_site-name) . "+Order" | A small name for the order—in
    this case, <sitename> Order`. |

    | item_number | "PROD" . $row[''id''] | A product code. Here you concatenate `PROD`
    and the order number (PROD12, for example). |

    | amount | urlencode(sprintf(''%.2f'' , $row[''total''])) | The amount of the
    order. |

    | no_note | 1 | The no_note variable specifies whether the customer should specify
    a note with the payment. Setting this to 1 indicates that no note is required.
    |

    | currency_code | GBP | The currency type for the transaction. |

    | lc | GB | The locale of the transaction. |


    It is important to remember that any textual information transmitted as a GET
    variable should be run through urlencode() to escape nonstandard characters.


