- pgno: 46
  md: '# Working with Forms


    If you do any kind of Web development, you will come across forms in your daily
    programming. These unsuspecting creatures reside on Web pages, suck information
    from you through your fingers, and are then processed by a script on the server.


    Dealing with forms involves two processes. First, the displayed form needs to
    capture all the relevant information. Second, you read in the form and process
    it when the user clicks the Submit button.


    The first step is performed with HTML, to use the wide range of HTML form elements
    to produce the form on the page. To get started, add the following code to form1.php:


    ```

    <form action="form1.php" method="POST">

    <br/> Username <input type="text" name="username"/><br/>

    <br/> Password <input type="password" name="password"/><br/>

    <br/> <input type="submit" name="submitbutt" value="Login!"/>

    </form>

    ```


    In this example, you create a simple form that contains three different elements.
    These elements work together to create a login form.


    On the first line, is the opening <form> tag. This tag takes two primary attributes.
    The first (**action**) needs to know the location of the script that will process
    the form. In this example, the action contains the name of the file with the form
    in it (form1.php), so the code to process the form is assumed to be in the same
    file.


    The second attribute (**method**) can contain either **GET** or **POST**. This
    refers to how the data will be transferred to the action script. These two types
    of method are very different:


    +   - POST: When you use the POST method, the data entered into the form is transferred
    to the action behind the scenes. The user has no visual cue as to what the data
    is; it will be transmitted non-visually. Although you cannot see it, there are
    still methods of accessing POSTed data, so it should not be considered 100% secure.

    +   - GET: When you use the GET method, the data from the form is appended to
    the end of the URL as a series of variables. For example, if you were to fill
    in the preceding form and use the GET method, you would use http://localhost/form1?username=jono&password=secret&pass=Login%21
    in the address bar of your browser, assuming you typed jono and secret&pass into
    the form. When you use the GET method, be careful that no sensitive information
    is displayed in the URL, such as a password!'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'After the `<form>` tag has been displayed, the next step is to display each
    form element. The majority of form elements are added with the `<input>` tag and
    then relevant options are selected with the `type` attribute in the `<input>`
    tag.


    The first field added is a normal text box. This provides a single line box in
    which the user can type some text. To select this type of element, use the `text`
    setting in the `type` attribute. You also should give the tag a `name` attribute.
    You will use the value of the name attribute to refer to the contents of the box
    later.


    The second field added is a password box. When you use `password` in the `type`
    field of the `<input>` tag, the box behaves the same as a text box, but it disguises
    the data the user enters with stars or circles.


    The final box added uses the `submit` type. This provides a clickable Submit button
    that can be used when the user has clicked the form. The additional attribute
    passed to this tag is `value`; this pre-fills the widget with data. In the case
    of the Submit button, the `value` attribute changes the text displayed on the
    button.


    ![](img/c75d0c4fa51711b62f211459ae794f3f_47_0.png)


    # NOTE


    # Web Editors


    A number of Web editors help you to write HTML more efficiently. A good example
    is a tool called Bluefish (http://bluefish.openoffice.nl) available for Linux.
    With it you can use toolbar buttons to add form elements easily.


    A number of handy editors like this are available all operating systems, such
    as SciTE (http://www.scintilla.org/).


    # Processing the Form


    Displaying a form and not processing it is just short of useless. To do anything
    useful with the form data, you need to hook up the form to some PHP that can process
    the data.


    To process a form, follow these steps:


    +   1. Determine whether the submit button variable exists. If the user has clicked
    the button, you can make the assumption that the form has been displayed and that
    the Submit button has been clicked.

    +   2. If the Submit button has not been clicked, you should assume the form has
    not been displayed yet, so you don’t display it.

    +   3. If the Submit button has been clicked, you then process the form.'
  merge: -1
  img_proc: true
