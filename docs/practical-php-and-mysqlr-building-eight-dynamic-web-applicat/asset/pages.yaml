  md: 'The top level is the main **MySQL** Server. The server contains all of the
    other parts in the diagram. Many people get confused by the term *server* and
    think that it must be some kind of hardware. The word *server* actually has a
    dual meaning, referring to both hardware designed to serve things and software
    designed to serve things. In the case of MySQL, we are referring to a software
    server.


    Within the MySQL server, you then may have a number of databases. This is another
    area in which newcomers to database development sometimes get confused. When you
    use MySQL, you can actually have a number of databases within the same server;
    you are not limited to just one. As such, you could run a single MySQL installation
    on a computer and run databases for your main company, a products database, and
    your Web site.


    To now shift the focus to a specific database inside the server, you can see a
    number of tables. Each database stores its data in a series of tables that can
    relate to each other in different ways. Table 2-2 shows a typical table from a
    database.


    # TABLE 2-2  An Example Database Table


    | Forename | Surname |

    |---|---|

    | Craig | Tucker |

    | Lee | Jordan |


    Every table consists of rows and columns. In database parlance, columns are referred
    to as **fields** , and rows are referred to as **records** . When you create database
    tables, you define what kinds of information you want to store in your fields
    (the columns), and then each entry in the database is stored as a record (the
    rows).


    # An Example: Product Database


