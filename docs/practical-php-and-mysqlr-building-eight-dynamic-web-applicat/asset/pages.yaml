  md: "# # Deleting Items\n\nThe `showcart()` function contains a link to `delete.php`,\
    \ in which you can remove an item from the shopping cart. By clicking the link,\
    \ the item is removed from the `orderitems` table, and the total price in the\
    \ `orders` table is updated.\n\nCreate `delete.php` and begin adding the code:\n\
    \n```\n```php\n<?php\n\nrequire(\"config.php\");\nrequire(\"db.php\");\nrequire(\"\
    functions.php\");\n\n  $validid = pf_validate_number($ _GET['id'],\n  \"redirect\"\
    , $config_basedir . \"showcart.php\");\n\n  $itemsql = \"SELECT * FROM orderitems\
    \ WHERE id = \"\n. $ _GET['id'] . \"\";\n  $itemres = mysql_query($itemsql);\n\
    \  $numrows = mysql_num_rows($itemres);\n\n  if($numrows == 0) {\n    header(\"\
    Location: \" . $config_basedir . \"showcart.php\");\n  }\n\n  $itemrow = mysql_fetch_assoc($itemres);\n\
    ```\n```\n\nIn this code, the query pulls the item from the `orderitems` table,\
    \ and the number of rows returned is checked. This check prevents someone modifying\
    \ the URL and adding `delete.php?id=73` if there is no item with an `id` of 73.\
    \ If no rows are returned, a header redirect jumps to `showcart.php`. If a row\
    \ is returned, the script continues:\n\n```\n```php\n  $itemrow = mysql_fetch_assoc($itemres);\n\
    \n  $prodsql = \"SELECT price FROM products\n  WHERE id = \" . $itemrow['product_id']\
    \ . \"\";\n  $prodres = mysql_query($prodsql);\n  $prodrow = mysql_fetch_assoc($prodres);\n\
    \n  $sql = \"DELETE FROM orderitems WHERE id = \" . $ _GET['id'] ;\n  mysql_query($sql);\n\
    ```\n```\n\nIn this block, the price of the product is selected first and then\
    \ a separate query removes the item from `orderitems`.\n\nUpdate the `orders`\
    \ table with the new total price:"
