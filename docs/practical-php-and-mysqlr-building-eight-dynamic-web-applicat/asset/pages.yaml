    Configuration Files for Distributed Applications

    If you plan on writing a Web application that you intend to distribute so that
    others can download, install, and run it, easy configuration is essential. This
    is where a standard configuration file is useful. Settings that the user may want
    to tweak can be kept out of the main code.


