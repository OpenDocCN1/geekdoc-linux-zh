    # SUMMARY


    Creating re-usable Web applications is a tough job. The challenge is not only
    in satisfying the day-to-day tasks such security, functionality, and good programming,
    but also in remembering at every turn that the project can work in any number
    of different situations. Complex projects often have to make a strong compromise
    between ease of setup and ease of use, sometimes sacrificing either or both.


    Hopefully this chapter has provided a firm foundation and plenty of food for thought
    for creating your own re-usable applications. With PHP and MySQL fully ingrained
    in Open Source culture, it is very common to write re-usable applications such
    as this one. Re-using existing code not only improves the application but also
    eases the creation of large chunks of code.'
