    \      $row['cat'] . \"</a> – Posted on \" .\n      date(\"D jS F Y g.iA\", strtotime($row['dateposted']))\
    \ . \"</i>\";\necho \"<p>\";\necho nl2br($row['body']);\necho \"</p>\";\n```\n\
    ```\n\nThe main blog entry section is now complete.\n\n# ## Showing Blog Comments\n\
