- pgno: 393
  md: '# **CHAPTER 10**

    Building a Re-Usable Project


    Life is increasingly difficult for Web developers. With the deluge of people getting
    online and using the Internet for more and more purposes, Web developers have
    more being asked of them than ever before. This not only means a wider range of
    applications are required, but also the complexity of the development is growing,
    too. It is not uncommon for even the smallest business to have a large, complex
    Web application that drives its primary business requirements.


    One of the solutions to this problem is to write re-usable code. Those of you
    who have been rattling around the IT industry for a few years are likely to be
    familiar with the re-usable buzzword, and in many situations it does actually
    make sense.


    The following list describes a few ways to re-use existing code in your application:


    +   - **PEAR.** The PHP Extension and Applications Repository (PEAR) provides
    a huge directory of extensions that can be easily installed and used. Each PEAR
    module is written in PHP.

    +   - **PECL.** The PHP Extension Community Library (PECL) includes a range of
    PHP extensions that need to be compiled. These extensions offer entirely new functionality
    to PHP and are very fast.

    +   - **Other pre-built applications.** Many people re-use zipped-up projects
    that can be unzipped into your Web application to satisfy some specific functionality.
    An example of this is the Magpie RSS parser.


    In this chapter, you will write an application that is designed to be dropped
    into existing Web sites. Along the way, you will explore the plethora of challenges
    that comes with writing software that is easy to install, re-use, and implement.'
  merge: -1
  img_proc: true
- pgno: 394
  md: '# PROJECT OVERVIEW


    For many developers, it is not uncommon to write little tools that solve very
    specific tasks. These small tools often don’t warrant their own SourceForge account
    or even a complex project management system such as Trac (http://www.edgewall.com/trac/).
    Instead, the ideal solution includes a simple means to download the program and
    view screenshots. To satisfy these requirements, you will create the *phphome-project*
    tool. Oh, the power.


    When viewing a project inside the application, users will be able to view the
    following:


    +   Available projects.


    +   The range of versions and download releases inside each version.


    +   Screenshots.


    These are the core features that the majority of Web surfers look for when *exploring*
    software.


    To make the application re-usable, some thought needs to go into how it works
    and how easy it is to set up. It is difficult, if not impossible, to write a re-usable
    application without first sitting down and getting a strong idea of how the different
    pieces fit together.


    The basic concept in this application is that each project has its own *project*
    directory (such as www.foo.com/projects/myproject/ or www.foo.com/projects/ *myotherproject*/).
    The site administrator creates these project directories manually.


    When a new project is created, two actions occur:


    +   The new project is added to the database.


    +   The project directory is created and populated with the files for viewing
    and maintaining the content.


    To be as flexible as possible, it should be very simple to drop this application
    into an existing Web site—as simple as including a single file into a normal Web
    page (such as *<?php require(”thisapp.php”); ?>*). But how do you cram all the
    functionality into a single page without it becoming horribly complex and bloated?


    The solution to the problem is shown in Figure 10–1.


    To best explain this process, the following list what happens from the moment
    the user accesses the Web site:


    +   The user accesses the www.mysite.com/projects/myproject/ Web address, and
    the *index.php* file is loaded. Between the header and footer files, a file called
    *project-main.php* is included.'
  merge: -1
  img_proc: true
- pgno: 395
  md: "+   * The *project-main.php* files checks to see if a `func GET` variable exists.\
    \ If so, a *switch* statement includes the relevant file. If the user clicks the\
    \ Download link, for example, `func=download` is appended as a `GET` variable.\n\
    +   \n+   * Inside the *switch* statement in *project-main.php*, the relevant\
    \ file is included. In the case of `func=download`, *download.php* is included;\
    \ it contains the code to display the available downloads.\n\nWith the main *index.php*\
    \ file including *project-main.php*, which in turn includes a file such as *download.php*,\
    \ the eventual download functionality is displayed to the user in the *index.php*\
    \ file. This makes it easier to spread the features across different pages, and\
    \ the URL looks clean and consistent.\n\n![](img/c75d0c4fa51711b62f211459ae794f3f_395_0.png)\n\
    \n# BUILDING THE DATABASE\n\nThe database you will create is shown in Figure 10-2.\n\
    \nA project inside the application lives in *homeproject_projects*. Releas es\
    \ of the project are organized in versions (stored in *homeproject_releaseversions*),\
    \ and the actual releases (the downloaded files) are described in *homeproject_releasefiles*.\
    \ Each entry in *homeproject_releasefiles* refers to its parent version from *homeproject_releaseversions*.\
    \ In addition to the parent version, a release file also stores the type_"
  merge: -1
  img_proc: true
- pgno: 396
  md: 'of release (such as a Debian Package, RPM, Windows ZIP, Mac OS X disk image,
    and so on) from the homeproject_releasetypes table. Finally, the homeproject_screenshots
    table stores the names of the screenshots for each release.


    ![](img/c75d0c4fa51711b62f211459ae794f3f_396_0.png)


    # FIGURE 10-2 The database is fairly straightforward.


    # NOTE


    # Making Your Tables Stand Out


    The reusable component uses the same database as the application that is hosting
    it. To indicate which tables are which, each table in the reusable component project
    uses the prefix homeproject_. This is an intentional choice so that when this
    application is deployed in an existing Web site, the tables that are part of the
    application can be identified easily. As an example, take a look at the following
    list of tables:


    +   - admins


    +   - customers


    +   - blogentries


    +   - homeproject_projects


    +   - homeproject_releaserversions


    You can quite easily identify which tables are part of the application.'
  merge: -1
  img_proc: true
- pgno: 397
  md: '# Implementing the Database


    Start phpMyAdmin. Create a new database called *phphomeproject* and add the following
    tables:


    # The *homeproject_projects* Table


    +   *   *id*. Make this an `MEDIUMINT` and turn on `auto_increment`. Set this
    field as a primary key.

    +   *   *name*. Make this a `VARCHAR` with a length of 100.

    +   *   *about*. Make this a `TEXT`.

    +   *   *pathname*. Make this a `VARCHAR` with a length of 30.


    # The *homeproject_releaseversions* Table


    +   *   *id*. Make this an `INT` and turn on `auto_increment` in the `Extras`
    column. Set this field as a primary key.

    +   *   *project_id*. Make this an `INT`.

    +   *   *version*. Make this a `VARCHAR` and set the size to 20.


    # The *homeproject_releasestypes* Table


    +   *   *id*. Make this a `TINYINT` and turn on `auto_increment`. Set this field
    as a Primary Key.

    +   *   *type*. Make this a `VARCHAR` and set the size to 20.


    # The *homeproject_releasefiles* Table


    +   *   *id*. Make this an `INT` (there could be lots of questions) and turn on
    `auto_increment`. Set this field as a primary key.

    +   *   *type_id*. Make this a `TINYINT`.

    +   *   *date*. Make this a `DATETIME`.

    +   *   *version_id*. Make this an `INT`.

    +   *   *filename*. Make this a `VARCHAR` with a length of 50.


    # The *homeproject_screenshots* Table


    +   *   *id*. Make this an `INT` (there could be lots of subjects) and turn on
    `auto_increment`. Set this field as a primary key.

    +   *   *project_id*. Make this an `INT`.

    +   *   *name*. Make this a `VARCHAR` with a length of 50.'
  merge: -1
  img_proc: true
- pgno: 398
  md: '# Inserting Sample Data


    With a solid set of tables ready to go, you can now add some sample data. Remember,
    do not fill in a number in the *id* column, which *auto_increment* does for you
    automatically. Feel free to add your own sample data, or use the suggested information
    described in the following sections.


    # Sample Data for the homeproject_projects Table


    Add a project such as the one shown in Table 10-1.


    **TABLE 10-1**  This table contains the main project details.


    | NAME | ABOUT | PATHNAME |

    | :--- | :--- | :--- |

    | My Project | This is an example project that demonstrates how a project is managed
    inside this re-usable project management application. | myproject |


    The pathname field provides a unique string to refer to the project. This is used
    in a few parts of the Web application—most notably in the URL, such as localhost/sites/homeproject/<pathname>/.


    # Sample Data for the homeproject_releasesversions Table


    Add version numbers as shown in Table 10-2.


    **TABLE 10-2**  Because a version number could have multiple releases, store the
    version numbers in a dedicated table.


    | PROJECT_ID | VERSION |

    | :--- | :--- |

    | 1 | 0.1 |

    | 1 | 0.2 |


    # Sample Data for the homeproject_releasesTypes Table


    Add three records, using the following names:


    +   * Tarball

    +   * Debian Package

    +   * Windows ZIP'
  merge: -1
  img_proc: true
- pgno: 399
  md: '# Sample Data for the `homeproject_releasefiles` Table


    Add two records to this table, using the correct `version_id` and `type_id`. The
    `filename` field should contain the name of the release file (such as `myrelease.tar.gz`).
    When you later create the `releases` directory, remember to place a file in the
    directory with the same filename.


    # Sample Data for the `homeproject_screenshots` Table


    Add a few records into the table, using the correct `project_id`. The `name` field
    should contain the name of the screenshot (such as `myscreenshot.png`). When you
    create the `screenshots` directory later, remember to include images with the
    same name.


    # Using Directories Intelligently


    Unlike previous projects in the book, `phphomeproject` makes extensive use of
    directories to determine specific types of functionality. The project has three
    main directories: `base`, `admin`, and `project`.


    The base directory, such as www.mysite.com/projects, is the base projects directory
    on the Web site. This directory contains the different files that form `phphomeproject`.
    This directory also includes an `index.php` file, which lists the projects on
    the server so that the user can select which project to view.


    A project directory, such as www.mysite.com/projects/myproject, is a subdirectory
    inside the base directory. This directory contains a single `index.php` file (which
    includes the files from the base directory, as shown in Figure 10-1). The project
    also contains two subdirectories: `releases` (which stores software releases)
    and `screenshots` (which stores screenshots).


    The `admin` directory is the directory the site administrator uses to adjust project
    settings. This directory is also found within the base directory, such as www.mysite.com/projects/admin,
    and contains a number of files for managing the site.


    # Creating the Directories


    First, create the base directory and call it `homeproject`. Then create the `admin`
    subdirectory.


    For each project you also need to create a subdirectory inside `homeproject`.
    The name of the directory should be the same as the pathname field in the `homeproject_projects`
    table. If you added the My Project record as was done in this example, create
    a directory called `myproject`. Inside `myproject` create the `releases` and `screenshots`
    subdirectories. Be sure that both `releases` and `screenshots` have write access
    to them.'
  merge: -1
  img_proc: true
- pgno: 400
  md: "You should now have the following directories:\n\n+   - homeproject\n+    \
    \   - admin\n+       - myproject\n+           - releas es\n+           - screenshots\n\
    \n```\nParent\n   |\n   |-----Subdir1\n   |\n   |-----Subdir2\n   |\n   |------Subsubdir1\n\
    \   |\n   |------Subsubdir2\n```\n\n![](img/c75d0c4fa51711b62f211459ae794f3f_400_0.png)\n\
    \n# ## STARTING TO CODE: BUILDING THE BACKBONE\n\nDeveloping *phphomeproject*\
    \ requires two core areas:\n\n+   - Viewable project information. This is the\
    \ area that Web site visitors see. Visitors can view project information, downloads,\
    \ and screenshots.\n+   - Project administration. This is the interface for configuring\
    \ projects; only the site administrator accesses this interface.\n\nIn this project,\
    \ you will implement the project viewing area first and then move on to create\
    \ the administration area. Before you begin, you will create some of the structural\
    \ files (configuration file, functions, and so on).\n\nBecause this project is\
    \ available as a re-usable component, you should use a separate configuration\
    \ file for the settings specific to the project. Inside the *homeproject* directory,\
    \ create *phphomeproject.php* and then add the code shown in Example 10-1."
