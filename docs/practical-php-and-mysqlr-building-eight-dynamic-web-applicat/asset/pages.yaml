- pgno: 130
  md: 'This project contains six important tables:


    | TABLE NAME | WHAT THE TABLE STORES |

    | :--- | :--- |

    | *categories* | Three different categories. |

    | *forums* | The different forums that are part of the categories. |

    | *topics* | Details about the topics. |

    | *messages* | The messages of the discussion thread. |

    | *admins* | Login details for the site administrator. |

    | *users* | Details about the users who can post to the forums. |


    There is an important relationship among the *categories*, *forums*, *topics*,
    and *messages* tables—each table stores the same *id* of the table to which it
    relates. For example, the *categories* and *forums* tables are related by storing
    the *id* of the relevant category in the *cat_id* field in the *forums* table.


    # Enforcing Relationships with InnoDB


    When you create databases with MySQL, the MyISAM table type stores the data. This
    *non-transactional* table engine does not enforce relationships between tables.
    Imagine you have a table, called *orders*, that has a *customer_id* field that
    stores the same value as the *id* from the *customers* table. If you delete a
    record from the *customers* table, it would make sense to delete or update the
    respective entry in the *orders* table; otherwise, the relationship would break
    and the order would reference a customer who no longer exists.


    With the default MyISAM table type, the database does not demand that these potential
    inaccuracies are resolved, and you *can* remove the customer and have the order
    refer to a non-existent customer. With MyISAM, the assumption is that you enforce
    these relationships in your code.


    In this project, however, you will use a different type of table: InnoDB. This
    *transaction-safe* table can enforce these relationships. This not only gives
    you the peace of mind that your relationships work, but also you can perform a
    cascading delete, in which you delete one table and all of the related tables
    are also deleted. Feel the power, my friends.


    Although it’s a feature of MySQL, InnoDB is normally turned off by default (check
    with your distribution to verify whether it is in fact turned off). To enable
    it, load the *my.cnf* file (often found in the *etc* directory on a Linux machine
    or inside the MySQL directory on a Windows machine) and look for *skip-innodb*.
    Comment out this option by adding a *#* symbol:


    ```

    ```sql

    #skip-innodb

    ```

    ```


    Uncomment the other *innodb* lines so that the code looks something similar to
    the following:'
  merge: -1
  img_proc: true
- pgno: 131
  md: '```

    innodb_data_home_dir = /opt/lampp/var/mysql/

    innodb_data_file_path = ibdata1:10M:autoextend

    innodb_log_group_home_dir = /opt/lampp/var/mysql/

    innodb_log_arch_dir = /opt/lampp/var/mysql/

    ```


    After you have switched on innodb support, restart MySQL for the changes to take
    effect.


    # WARNING!


    When using transaction-safe tables such as InnoDB, be extremely careful with cascading
    deletes. If you mistakenly enforce a relationship, you could possibly lose data.
    This is typically quite rare because you need to deliberately enforce the relationship,
    but you are now cordially warned.


    # Building the Database


    Fire up phpMyAdmin and create a new database called *forum*. Now add each of the
    tables below, complete with their fields:


    # The *admins* Table


    +   - id. Set this to a `TINYINT`, make it a primary key, and enable `auto_increment`.

    +   - username. Set this to `VARCHAR` with a length of 10 (a common length for
    usernames).

    +   - password. Set this to `VARCHAR` with a length of 10.


    # The *categories* Table


    +   - id. Set this to a `TINYINT`, make it a primary key, and enable `auto_increment`.

    +   - name. Set this to `VARCHAR` with a length of 50.

    +   - Set the table type to InnoDB.


    # NOT

    NOTE


    # Setting the Table Type


    Most of the tables need to have their table type set to InnoDB. In the table design
    screen where you configure the *fields*, a control at the bottom enables you to
    select the table type.'
  merge: -1
  img_proc: true
