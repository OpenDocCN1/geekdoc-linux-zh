  md: "# **NOTE**\n\n# **Poking at $_FILES**\n\nIf you want to see what is in the\
    \ `$_FILES` array, or any other variable or array for that matter, use print_r():\n\
    \n```\nprint_r($_FILES);\n```\n\nTo access specific information from a specific\
    \ array, use the following format:\n\n```\n$_FILES['array']['item']\n```\n\nFor\
    \ example, you could refer to the filename of the file in the userfile box that\
    \ you added by using:\n\n```\n$_FILES['userfile']['name']\n```\n\nBefore the file\
    \ is authorized, you will run the file through a series of validation checks to\
    \ ensure that a file was actually uploaded, that it is a legitimate photo, and\
    \ that the size is not too large. First, check that a file was uploaded:\n\n```\n\
    if($theitemrow['user_id'] != $_SESSION['USER_ID']) {\n    header(\"Location: \"\
    \ . $config_basedir);\n}\n\nif($_POST[\"submit\"]) {\n    if($_FILES['userfile']['name']\
    \ == '') {\n        header(\"Location: \" . $HOST_NAME . $SCRIPT_NAME\n      \
    \      . \"?error=no photo\");\n    }\n```\n\nThis code checks to see if the name\
    \ information in the `$_FILES` array has a value. If it does not, the page reloads\
    \ with an appended error variable.\n\nNow you can run a further set of tests.\
    \ First, check to see if the size is legitimate (not zero):\n\n```\nheader(\"\
    Location: \" . $HOST_NAME . $SCRIPT_NAME\n        . \"?error=no photo\");\n} elseif($_FILES['userfile']['size']\
    \ == 0) {\n    header(\"Location: \" . $HOST_NAME . $SCRIPT_NAME\n        . \"\
    ?error=photo prob\");\n```"
