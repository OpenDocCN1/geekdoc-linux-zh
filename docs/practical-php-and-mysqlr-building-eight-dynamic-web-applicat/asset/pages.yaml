- pgno: 190
  md: 'The solution is to use session IDs. When the user loads the first page with
    the `session_start()` function, a special session ID is generated. This ID is
    unique to that specific user and tracks which session variables are assigned to
    which user visiting the site. Although you have not referred to the session ID
    before, in this project you will use the session ID extensively.


    Every time a user visits the shopping cart and adds his first item, an order is
    added to the *orders* table. For registered users, the user’s id is added to the
    *customer_id* field in the table. For unregistered users, the unique session id
    is added to the *session* field. When this order has been added to the table,
    a session variable called SESS_ORDERNUM is created with the id of the order. SESS_ORDERNUM
    can now be used to track the order’s progress throughout the site.


    To get started, build the usual configuration file that stores generic information
    about the site. Create a new directory called *shoppingcart* and add the code
    shown in Example 6-1 to *config.php*.


    EXAMPLE 6-1 The configuration file is similar to the other projects in the book.


    ```

    <?php


    $dbhost = "localhost";

    $dbuser = "root";

    $dbpassword = "";

    $database = "shoppingcart";


    $config_basedir = "http://localhost/sites/shoppingcart/";


    $config_sitename = "BidTastic Auctions";

    ?>

    ```


    To make life easier when dealing with redirects, create a file called *db.php*
    that contains just the database connection details, as shown in Example 6-2.


    EXAMPLE 6-2 The db.php file will be included when you need a database connection
    but don’t want to include header.php because of a redirect.


    ```

    <?php


    require("config.php");


    $db = mysql_connect($dbhost, $dbuser, $dbpassword);

    mysql_select_db($database, $db);

    ?>

    ```'
