    # ## CREATING A FREQUENTLY ASKED QUESTIONS PAGE


    A common type of page on many sites is a Frequently Asked Questions (FAQ) page.
    This page contains a list of questions, each of which is a link. When a link is
    clicked, the page jumps to the location of the answer, found lower down on the
    page. The answer typically includes another link to jump back to the list of questions
    at the top of the page. This method of jumping between different parts of the
    page is achieved by using HTML *anchors*.


    Create a new file called `faq.php` and add the following code:


    ```

    ```

    <?php

    require("header.php");

    ?>


    <h1 name="top">top</h1>

    <h1>Frequently Asked Questions</h1>

    <ul>

    <li><a href="#1">Ipsum, eu consectetuer, praesent ad, lobortis veniam.</a></li>

    <li><a href="#2">Autem illum suscipit voluptat exerci adipiscing in lorem.</a></li>

    <li><a href="#3">Luptatum suscipit.</a></li>

    <li><a href="#4">Qui veniam accumsan tincidunt veniam.</a></li>

    <li><a href="#5">At iriure amet ed odio.</a></li>

    </ul>

    ```

    ```'
