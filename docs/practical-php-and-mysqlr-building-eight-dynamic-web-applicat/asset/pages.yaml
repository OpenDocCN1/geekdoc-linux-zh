  md: "```\n</p>\n</form>\n\n<?php\n}\nrequire(\"footer.php\");\n?>\n```\n\n# PROCESSING\
    \ AUCTIONS\n\nWith most auction sites, when an auction ends, email messages are\
    \ sent to the owner of the item and the winning bidder (if there is one) to indicate\
    \ the result of the auction. This message typically includes the name of the item\
    \ and the details of the owner/winner, depending on which email is sent. The challenge\
    \ with this feature is in sending the emails when the auction has finished. PHP\
    \ and MySQL do not include features to specify a particular time at which a piece\
    \ of code should be executed. So how do you do it?\n\nThe solution is to first\
    \ create a page that determines which auctions have ended and sent the emails.\
    \ To ensure processing is kept to a minimum, the `endnotified` field in the `items`\
    \ table is set to `1` when an item has been processed. As such, you can search\
    \ for items with an `enddate` older than `NOW()` in which `endnotified` is `0`.\
    \ This page can be used to process all auctions by simply running it.\n\nTo solve\
    \ the problem of processing the auctions when they have finished, you can use\
    \ a scheduled tasks tool such as `cron` (Linux) or Windows Scheduler (Windows)\
    \ to schedule that the page is accessed approximately every five minutes. You\
    \ can use the `wget` command-line tool to do this.\n\nCreate a page called `processauctions.php`\
    \ and run a query to select all the items:\n\n```\n<?php\n\nrequire(\"config.php\"\
    );\nrequire(\"header.php\");\n\n$itemssql = \"SELECT users.username, users.email,\
    \ items.id, \nitems.name FROM items, users WHERE dateends < NOW() AND \nitems.user_id\
    \ = users.id AND endnotified = 0;\";\n$itemresult = mysql_query($itemssql);\n\
    ```\n\nThis query selects the username, email, item id, and name for all records\
    \ in which `dateends` is in the past and in which `endnotified` is set to `0`.\
    \ Each record returned is an ended auction."
