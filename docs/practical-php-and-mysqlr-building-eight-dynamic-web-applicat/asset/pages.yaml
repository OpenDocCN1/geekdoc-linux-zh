- pgno: 233
  md: '# CHAPTER 7


    # Building an Online Auction Site


    If you wander around the Internet, you will likely find only a handful of people
    who have never visited or used eBay. This popular auction site has become part
    and par-

    \cell

    cel of Internet life for many users, and an afternoon can be easily whiled away

    browsing for all sorts of items.


    In this chapter, you will create your own auction site. Rather than creating a
    successor to eBay, the aim of this project is to teach you many of the concepts
    involved in coding an auction site. And many of these concepts come in handy when
    working with other projects. An example of this is the core feature of dealing
    with bids. You can apply the same logic used to deal with bidding to online voting
    sites, polls, quizzes, and more. As such, the benefit of this chapter is not so
    much the product you have at the end, but the journey you traveled to create it.


    # PROJECT OVERVIEW


    This project implements the following core features of an auction site:


    +   ■ The page displays a series of different categories for different types of
    items.

    +   ■ On the front page, a list of items will be available for all categories.
    The user can click a category name to view items within it. Only items before
    the bid deadline are displayed.

    +   ■ The user can register and log in to the site.

    +   ■ The user can view an item—complete with pictures—and place a bid.

    +   ■ The users can add items—complete with pictures—to the site.

    +   ■ When an auction is complete, the owner of the item and the winning bidder
    receive email messages that include the details of the closing auction.'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'From the outset, an auction site seems quite straightforward to build. In reality,
    there are a few interesting challenges that can test the scope of your PHP and
    SQL knowledge. As such, this project will add some useful new skills to your toolbox.


    # # BUILDING THE DATABASE


    The database you use in this project is relatively straightforward and includes
    five tables. These tables are shown in Figure 7-1.


    ![](img/c75d0c4fa51711b62f211459ae794f3f_234_0.png)


    Each table in the database is related to the *items* table, which provides information
    about an item on the site. Within the *items* table, you also reference the *categories*
    table (to determine the category to which the item belongs), the *users* table
    (to specify which user added the item), the *bids* table (to store each bid made
    for a particular item), and the *images* table (to store images added to the items).


    # # Implementing the Database


    Fire up phpMyAdmin. Create a new database called *auction* and add the following
    tables:


    # ## The *categories* Table


    +   - id. Make this a TINYINT (there will not be many categories) and turn on
    `auto_increment` in the Extras column. Make this field a primary key.

    +   - cat. Make this a VARCHAR and set the size to 20. It is unlikely a category
    title will be longer than 20 letters.


    # ## The *users* Table


    +   - id. Make this an INT (several users are possible) and turn on `auto_increment`.
    Set this field as a primary key.

    +   - username. Make this a VARCHAR with a length of 10.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '+   * **password**. Make this a `VARCHAR` with a length of 10.

    +   * **email**. Make this a `VARCHAR` with a length of 100. You would be surprised
    by the length of some governmental email addresses!

    +   * **verifystring**. Make this a `VARCHAR` with a length of 20.

    +   * **active**. Make this a `TINYINT`.


    # The items Table


    +   * **id**. Make this an `INT` (several items are possible) and turn on `auto_increment`.
    Make this field a primary key.

    +   * **user_id**. Make this an `INT`.

    +   * **cat_id**. Make this a `TINYINT`.

    +   * **name**. Make this a `VARCHAR` with a length of 100. It is common for item
    titles to be quite long.

    +   * **startingprice**. Make this a `FLOAT`. You use this type for store prices
    that have a decimal point (such as $22.90); FLOAT supports the decimal point.

    +   * **description**. Make this a `TEXT`.

    +   * **dateends**. Make this a `DATETIME`.

    +   * **endnotified**. Make this a `TINYINT`.


    # The bids Table


    +   * **id**. Make this an `INT` (several bids are possible). Turn on `auto_increment`.
    Make this field a primary key.

    +   * **item_id**. Make this an `INT`.

    +   * **amount**. Make this a `FLOAT` for store prices that have a decimal point.

    +   * **user_id**. Make this an `INT`.


    # The images Table


    +   * **id**. Make this an `INT` (several images are possible). Turn on `auto_increment`.
    Make this field a primary key.

    +   * **item_id**. Make this an `INT`.

    +   * **name**. Make this a `VARCHAR` with a length of 100. Long image filenames
    are likely.


    # Insert Sample Data


    With the tables created, it is useful to fill some initial data into some tables
    for testing the code as you write. Remember that when you are adding data to any
    of these tables not to fill in a number in the id column; this is handled by `auto_increment`.'
  merge: -1
  img_proc: true
