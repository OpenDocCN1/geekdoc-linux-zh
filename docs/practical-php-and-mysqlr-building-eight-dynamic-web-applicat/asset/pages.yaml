- pgno: 405
  md: 'The first line in this file grabs the name of the current project. To do this,
    the project path name is cut out of the URL (for example, cutting out *myproject*
    from www.mysite.com/projects/myproject/). This can be used later to gather information
    about the project.


    Three files are then included: the main configuration file (*phphomeprojectconfig.php*),
    the menu options (*project_bar.php*), and the main application page (*project_main.php*).
    These files are accessed from the preceding directory by including the prefix
    `../` with each file.


    ![](img/c75d0c4fa51711b62f211459ae794f3f_405_0.png)


    # Deploying *phphomeproject*


    The site administrator uses the *phphomeproject* file to deploy *phphomeproject*
    inside an existing Web application. The admin simply includes *project_bar.php*
    in the side menu bar code (such as *bar.php* in previous projects) and then includes
    *project_main.php* in the main body of the page.


    In the next sections, you will create the files that you have just included.


    # Viewing Menu Options


    Create *project_bar.php* and add the menu options with the code in Example 10-4.


    # EXAMPLE 10-4 This file can be deployed in an existing design to display the
    menu anywhere easily.


    ```

    <h1>Options</h1>

    <ul>

    <li><a href="index.php">Home</a></li>

    <li><a href="index.php?func=download">Download</a></li>

    <li><a href="index.php?func=screenshots">Screenshots</a></li>

    </ul>

    ```


    This file contains a simple unordered list with the different options. Each option
    links to *index.php* but passes a different setting to the func GET variable.
    This variable is processed by *project_main.php*, and the relevant functionality
    is displayed.'
  merge: -1
  img_proc: true
- pgno: 406
  md: "# ## Accessing the Project’s Features\n\nWhen a user clicks one of the menu\
    \ options, project_main.php acts the middleman, pulls off the func variable, and\
    \ serves the correct page.\n\nTo do this, func is run through a switch statement.\
    \ The switch provides case blocks for the different options available. If no func\
    \ variable is present, or if func contains something that a case block does not\
    \ satisfy, the default block is executed.\n\nCreate project_main.php in the base\
    \ directory and begin adding the code:\n\n```\n<?php\nrequire('db.php');\n\n$sql\
    \ = \"SELECT * FROM homeproject_projects WHERE pathName = '' . $project . ''\"\
    ;\n$result = mysql_query($sql);\n$row = mysql_fetch_assoc($result);\n\nHere you\
    \ run a query to select any projects in which pathname is equal to the directory\
    \ name held in $project ($project was created in index.php).\n```\n\nSet up the\
    \ variables:\n\n```\n$row = mysql_fetch_assoc($result);\n$project_id = $row['id'];\n\
    $project_name = $row['name'];\n```\n\nTwo variables (user later) are created to\
    \ store the project id and name.\n\nOpen the switch and add the first case block:\n\
    \n```\n$project_name = $row['name'];\nswitch($_GET['func']) {\n    case 'download':\n\
    \        require('download.php');\n        break;\n```\n\nIf the user clicks the\
    \ Download link, func is set to download and the block is executed. The download.php\
    \ page is included inside the block.\n\nAdd a similar block for the Screenshots\
    \ link:\n\n```\nbreak;\ncase 'screenshots':\n    require('screenshots.php');\n\
    \    break;\n```"
  merge: -1
  img_proc: true
- pgno: 407
  md: "Add the `default` block that catches any other situation:\n\n```\nbreak;\n\n\
    default:\n    $sql = \"SELECT * FROM homeproject_projects\n          WHERE pathname\
    \ = \" . $project . \"';\n    $result = mysql_query($sql);\n    $row = mysql_fetch_assoc($result);\n\
    \n    echo \"<h1>\" . $row['name'] . \"</h1>\";\n    echo \"<p>\" . $row['about']\
    \ . \"</p>\";\n\nbreak;\n```\n\nYou construct a query that returns the project\
    \ and then simply prints the name of the project and displays the description.\n\
    \nFinally, close the `switch`:\n\n```\nbreak;\n}\n?>\n```\n\nWhen you view My\
    \ Project, you should be presented with a vision not vastly different from the\
    \ one shown Figure 10-3.\n\n![](img/c75d0c4fa51711b62f211459ae794f3f_407_0.png)\n\
    \n**FIGURE 10-3** The rather uninteresting design can be replaced when the application\
    \ is deployed in an existing site with its existing design.\n\n# # DOWNLOADING\
    \ RELEASES\n\nReleases are by far the most important aspect in a software project.\
    \ If your releases are difficult to access, unstable, or unusable, it is unlikely\
    \ that many people will bother to download and use them.\n\nThe application manages\
    \ releases in a very simple way, as shown in Figure 10-4."
