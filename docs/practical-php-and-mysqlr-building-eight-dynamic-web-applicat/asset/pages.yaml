- pgno: 183
  md: '# C H A P T E R 6


    # # Creating a Shopping Cart


    For many developers, the humble shopping cart holds a special place in their hearts.
    Although PHP and MySQL are the fodder for a range of Web applications, many developers
    learned their trade with the ambition to write the ubiquitous shopping cart. If
    there is a Zen to Web development, it is likely to be experienced while writing
    a shopping cart.


    Although a common sight on the Web, shopping carts do come in a variety of different
    flavors. The various incarnations typically differ in ways that are specific to
    the type of business using the software. For example, the sale of items such as
    books, CDs, and DVDs differs from the sale of cables, food, building materials,
    and janitorial products. The core difference is quantity: you generally buy only
    a single book or DVD at time, but it is not uncommon for a restaurant to buy 10
    packs of dinner rolls.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# **PROJECT OVERVIEW**


    In this project, you create the core features of a shopping cart. To get a clear
    idea of how the project works, take a look at the following use case:


    John needs to buy some teabags for his mobile café. He goes to a popular online
    shop that was created by an owner of this very book. John does not have a user
    account on the Web site but starts shopping anyway. He clicks the Beverages category
    and sees the list of teabags. He clicks the Buy link and is taken to another page,
    where he can choose the quantity. He selects 10 boxes of teabags and adds them
    to his shopping cart. The page now refreshes, and he sees the contents of his
    shopping cart. John then buys coffee, and his cart is updated again. John realizes
    he does not need the coffee after all, so he clicks the X link to delete the coffee
    from his cart. John finishes choosing items and clicks the Go to the Checkout
    link. He is prompted for his address, which he fills in, and is taken to the payment
    screen. John can choose to pay with PayPal or by check. John clicks the PayPal
    button and taken to the PayPal payment screen at paypal.com, where he pays for
    the order.


    Pauline needs some teabags, too. Pauline already has an account on the site, so
    she logs in. She adds the items she needs to her cart and clicks the Go to the
    Checkout link. At the address page, she can choose between a new address and the
    address stored with her user account. She chooses the account address and is taken
    to the payment screen. Pauline chooses to pay by check and is given instructions
    about where to send the check and to whom to make it payable.


    Ken runs the Web site and wants to see all current orders. He logs in with his
    administrator username and password and is provided with a list of orders. Ken
    looks at each item, packages the order, and writes the address on the parcel.
    To confirm the completion of the order, Ken clicks the Confirm Payment link. The
    order is now complete.


    The shopping cart you build in this chapter satisfies all of the features discussed
    in the preceding use case, but there is still a huge scope for development. Shopping
    carts can become huge and complex systems, and an entire book would do the subject
    of building shopping carts justice. This project will provide a solid foundation
    in which you can continue to build in extra features.'
  merge: -1
  img_proc: true
