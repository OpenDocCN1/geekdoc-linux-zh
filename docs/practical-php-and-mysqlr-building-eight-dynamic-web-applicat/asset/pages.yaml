    FIGURE 8-2 Because you don''t want just anyone looking at your events, a login
    screen—with its own unique look and feel—protects the calendar.


    # VIEWING EVENTS


    The vast majority of calendars have a very similar interface. This interface typically
    includes a view of the entire month, with each day shown with its date. Usually,
    the days are represented as squares, and events on those days are positioned inside
    the squares. And, for usability, each day''s events are normally listed in chronological
    order. Because this design has worked for so long, we''ll stick with it here.
    Figure 8-3 shows the user interface for the calendar.'
  merge: -1
  img_proc: true
- pgno: 292
  md: '![](img/c75d0c4fa51711b62f211459ae794f3f_292_0.png)


    FIGURE 8-3 The calendar interface provides a simple means of viewing and deleting
    events in any given month.


    Two primary elements comprise the interface: the main calendar view and the sidebar.
    Each of these interface areas has several key functions.


    The key functions of the main calendar are as follows:


    +   • Displays a month, as well as the days of the week and the dates for each
    day.

    +   • Displays the events within a given month.

    +   • Allows the user to click an event and view information about that event.

    +   • Allows the user to add events by clicking any open space for a given day.


    The key functions of the sidebar are as follows:


    +   • Displays the current month’s name and year. The user can use the arrows
    to choose previous or future months.

    +   • Allows the user to click an event in the main calendar to display the event
    information in the sidebar.

    +   • Allows the user to add a new event and displays the new event form in the
    sidebar.

    +   • Displays a list of upcoming events.'
