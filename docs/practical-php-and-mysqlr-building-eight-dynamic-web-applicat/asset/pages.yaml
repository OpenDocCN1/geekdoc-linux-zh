  md: 'To log out the user, just use the `session_destroy()` function to delete all
    the registered session variables. The session is now destroyed, and the user is
    no longer logged in. You can then perform a header redirect to *index.php*.


    # NOTE


    # The Life and Death of a Session


    When dealing with session-based code, you should always clear out any sessions
    when testing your code. Apart from creating the *logout.php* script, another option
    is to close the Web browser. Sessions will live only for the duration that the
    browser is open, and when you close the browser (not just the *window*), the session
    is lost.


    When developing your code, closing your browser when you want to clear a session
    can be quite frustrating. To relieve the pain, use the Web Developers Toolbar
    extension that is available for Mozilla Firefox on all platforms. Download it
    from the Mozilla Extensions Web site at http://extension-room.mozdev.org.


