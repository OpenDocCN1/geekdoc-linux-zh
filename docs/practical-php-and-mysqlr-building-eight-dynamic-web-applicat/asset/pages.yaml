  md: "# ## BUILDING YOUR OWN FORUMS\n\nIn this project, you will concentrate on the\
    \ essential features that should go into discussion forum software, including\
    \ the ability\n\n+   * To display categories, forums, and topics.\n+   * To log\
    \ in as an administrator.\n+   * For administrators to add categories and forums.\n\
    +   * For administrators to delete categories, forums, and topics.\n+   * To log\
    \ in as a user.\n+   * For users to register. When a user fills in the registration\
    \ form, a verification e-mail is sent.\n+   * For users to view a category and\
    \ forums, and then click a forum to view the topics. The user can also click a\
    \ topic to view the thread.\n+   * For users to post new threads or reply to existing\
    \ ones.\n\nAlthough hundreds of extra features could go into this project, adding\
    \ them would take an entire book in itself. In this project, you build a core\
    \ forums engine, but you can, of course, build additional features into it afterward.\n\
    \n# ## BEFORE YOU BEGIN\n\nThis project uses some additional chunks of CSS. Copy\
    \ *stylesheet.css* to the new project directory for this project and add the following\
    \ lines to the end of *stylesheet.css*:\n\n```\n`table {`  \n`border: thin solid\
    \ #cccccc;`  \n`background: #ffffff;`  \n`}`  \n`th {`  \n`letter-spacing: 2.5px;`\
    \  \n`background: #eeeeee;`  \n`color: #000000;`  \n`text-transform: uppercase;`\
    \  \n`text-align: center;`  \n`border-top: thick solid #eeeeee;`  \n`border-bottom:\
    \ thin solid #cccccc;`  \n`}`  \n`tr.head {`  \n`letter-spacing: 1.5px;`\n```"
  merge: -1
