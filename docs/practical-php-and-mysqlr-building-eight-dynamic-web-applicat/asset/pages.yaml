    # ### Deleting Subjects


    When logged in as an administrator, a user deletes content by clicking the little
    *X* links. These links hook up with a page to delete the type of content the *X*
    is next to. If you take a look at the list of subjects, you will see that the
    *X* next to each subject links to *deletesubject.php* and passes the script the
    id of the subject to be deleted.'
