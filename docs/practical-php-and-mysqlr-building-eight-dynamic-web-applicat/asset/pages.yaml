- pgno: 87
  md: '# Building the Query


    To build the SQL query, think about the kind of information you want the database
    to return. For the latest blog entry, you want all the information from the *entries*
    table (such as the subject, body, and date the blog was posted), but you also
    need to get the category to which the entry belongs.


    The name of the category isn’t stored in the *entries* table, however; only the
    cat_id is. With this in mind, you need to ask for all the information from the
    *entries* table and also ask for the category name in which the category id matches
    the cat_id from the *entries* table.


    Here is the SQL you need:


    ```

    ```

    SELECT entries.*, categories.cat FROM entries, categories

    WHERE entries.cat_id = categories.id

    ORDER BY dateposted DESC

    LIMIT 1;

    ```

    ```


    One of the great benefits of SQL is that you can read it fairly easily from left
    to right. Additionally, if you lay out your SQL on separate lines, you easily
    see the four main parts of the SQL query:


    +   1. The command (first line)

    +   2. The conditions under which the command is executed (second line)

    +   3. Any ordering requirements (third line)

    +   4. Any limits (fourth line)


    If you read the SQL from the beginning to the end, this is what happens:


    Select (*SELECT*) every field from the *entries* table (*entries* . *) and the
    cat field from the *categories* table (*categories* . cat), with the condition
    (*WHERE*) that the cat_id field from the *entries* table (*entries* . cat_id)
    is equal to (=) the id field from the *categories* table (*categories* . id).
    Order the results by (*ORDER* BY) the dateposted field in descending order (*DESC*)
    and only show a single result (*LIMIT* 1).


    The aim of the query is to limit the results that come back and return only the
    last entry that was added to the database. Without the *ORDER BY* clause, the
    query would bring back every entry in the order that it was added. By adding the
    *ORDER BY* line, the results come back in descending date order (the last date
    is first). Finally,'
  merge: -1
  img_proc: true
