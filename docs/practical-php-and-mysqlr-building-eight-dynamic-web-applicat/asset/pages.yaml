- pgno: 329
  md: "In previous projects, you used **addslashes()** to escape quotes in user input\
    \ destined for the database. Although this works fine, the function makes the\
    \ assumption that the **magic_quotes_gpc** option in **php.ini** is turned off.\
    \ If the option is turned on and you use **addslashes()**, additional slashes\
    \ are added in front of the slashes that were added by **magic_quotes_gpc**. The\
    \ result is a visible slash added to your data.\n\nTo solve this problem, the\
    \ new function uses the **get_magic_quotes_gpc()** to check if the feature is\
    \ turned on or off. If the function returns 1 or TRUE, magic quotes is turned\
    \ on and the normal string is returned. If magic quotes are turned off, the string\
    \ is run through **addslashes()** and then returned. This new function ensures\
    \ that your application can work with magic quotes turned on or off and requires\
    \ no modification. Sweet, no?\n\nThe next function to roll in is **pf_check_number()**:\n\
    \n```\nfunction pf_check_number($val) { \n  if(isset($val) == FALSE) { \n    $error\
    \ = 1; \n  } \n  \n  if(is_numeric($val) == FALSE) { \n    $error = 1; \n  } \n\
    \  \n  if($error == 1) { \n    return FALSE; \n  } \n  else { \n    return TRUE;\
    \ \n  }\n}\n? >\n```\n\nThis function is virtually identical to the **pf_validate_number()**\
    \ function used in previous projects, but the **if** check on **$error** returns\
    \ FALSE if there is an error and TRUE if there is not.\n\n![](img/c75d0c4fa51711b62f211459ae794f3f_329_0.png)\n\
    \n# NOTE\n\n# Why Use This Slightly Different Function?\n\nSome of the pages in\
    \ this project have two personalities: one that is triggered with a GET variable\
    \ and one without. If you used **pf_validate_number()** in these pages, the personality\
    \ that does not need the GET variable would fail (**pf_validate_number()** checks\
    \ if the variable is present) and redirect to another page.\n\nThe **pf_check_number()**\
    \ function does not include the redirect functionality. As such, the function\
    \ can be used to validate a GET variable if it is present."
  merge: -1
  img_proc: true
