- pgno: 62
  md: "# Iterating Through the Results\n\nInside `$result` lies the holy grail, the\
    \ motherland that is the result of your query. Although `$result` contains the\
    \ results, you can think of it as a big conjoined mess of results. In its current\
    \ form, `$result` is not all that useful, and to be really practical you need\
    \ to iterate through each row from the query. If you loop through each row, you\
    \ can then display the relevant information on the page. This is the grand plan.\n\
    \nAdd the following code beneath the `mysql_query` line in your file:\n\n```\n\
    ```\n$sql = \"SELECT * FROM products;\";\n$result = mysql_query($sql);\n\nwhile($row\
    \ = mysql_fetch_assoc($result)) {\n    echo $row[ 'product' ];\n}\n```\n```\n\n\
    In this chunk of code, you are using a `while` loop to iterate through each row\
    \ in the result set. This is performed by adding a loop condition that extracts\
    \ each row from `$result` by using `mysql_fetch_assoc` and then putting the row\
    \ into the `$row` variable.\n\nThe purpose of the `mysql_fetch_assoc()` function\
    \ is to make an associative array out of the results. This provides you with a\
    \ convenient key-value (explained in the \"Arrays\" section earlier) means of\
    \ pulling out information. As such, if you need to access the contents of the\
    \ product field in the current row, you would use `$row[ 'product']`.\n\n# Consistency\
    \ Across Pages with Sessions\n\nOne of the biggest challenges when doing any kind\
    \ of Web development is maintaining state across pages in a stateless Web. This\
    \ grandiose statement basically translates into \"sharing information across different\
    \ pages.\" The reason for this difficulty is that each Web page you create essentially\
    \ functions as an individual program. When you build Web applications that span\
    \ a number of different pages, there is no implicit means of sharing information\
    \ across these pages other than using the **GET** and **POST** variables. Sessions\
    \ change all of this.\n\n**Sessions** offer a surprisingly simple and efficient\
    \ means of literally sharing variables across different pages. This is achieved\
    \ with a number of PHP functions"
  merge: -1
  img_proc: true
