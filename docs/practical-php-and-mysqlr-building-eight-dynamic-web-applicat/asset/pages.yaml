  img_proc: true
- pgno: 500
  md: "In the HTML for the page, you use `<h1>` tags in the header, bar, and main\
    \ `<div>` areas. Each of these different areas need to format `<h1>` tags differently.\n\
    \n# NOTE\n\n# **The Same Tag—So Many Different Meanings**\n\nAlways remember to\
    \ style an HTML tag relative to its context. As such, when you add the `<h1>`\
    \ tag to the side bar, you are saying, “This text should use the largest font\
    \ size for this area.” Although you might be tempted to simply use `<h3>` tags\
    \ as the largest font size in the side bar to avoid creating different styles,\
    \ this is certainly not the right way to do it.\n\nApply a style definition to\
    \ the `<h1>` tags that are in the bar:\n\n```\n```css\n#bar h1 {\n    font-size:\
    \ 12px;\n    text-transform: uppercase;\n    letter-spacing: 0.3em;\n}\n```\n\
    ```\n\nFor the largest heading in the side bar, the size of the font is set to\
    \ 12 pixels, and the text is converted to *uppercase* letters. Minimal character\
    \ spacing is also applied to ensure that the text stands out as a heading in the\
    \ side bar and looks sufficiently different to a heading in the main content of\
    \ the page.\n\n# **Styling the Main Body of the Page**\n\nAdd the main `<div>`\
    \ style definition:\n\n```\n```css\n#main {\n    margin: 15px 15px 15px 240px;\n\
