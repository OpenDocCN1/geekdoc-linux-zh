- pgno: 483
  md: '# APPENDIX A


    # # Web Site Design


    Design is a complex science, particularly if you lack any artistic talent. For
    many, the challenge of creating a visually appealing Web site is one marred with
    the uncomfortable feeling that despite your best efforts, the resulting design
    will look ugly, blocky, and predictable.


    Although those who lack artistic chops are unlikely to give leading Web designers
    a run for their money, there is still a lot you *can* achieve by following some
    basic design principles. Many of the most popular and usable sites on the Internet
    have clean and effective designs driven by a series of simple yet powerful design
    decisions.


    In this chapter, you will explore how to build some attractive and usable designs.
    These designs provide simple and consistent site layouts that your visitors will
    find usable. Good usability is, after all, the big win in good design.


    # ## PROJECT OVERVIEW


    In ye old days of the Web, design was really secondary to content. The majority
    of Web sites looked plain and simple. Most design was performed using the limited
    set of HTML tags available in the early days of the Web.


    As the Web grew larger and sites had more and more pages, the challenge of managing
    a consistent design became apparent. When a fresh design was created for a site,
    the task of the unlucky Web developer was to go through each and every page on
    the site and apply the new design changes. For sites with hundreds of Web pages,
    this was a mundane and error-prone task. Since those dim and distant days, Cascading
    Style Sheets (CSS) has burst onto the scene and dramatically eased how design
    is handled.'
  merge: -1
  img_proc: true
- pgno: 484
  md: 'CSS allows you to centralize the design in your Web site. Instead of applying
    the design via HTML tags, you create a special style sheet file that is loaded
    by each page on the site. With CSS, you can dramatically change the design of
    the entire site by changing a single file.


    In this project, you will create and style a simple home page. The project covers
    a range of common design requirements, including general page design, and styling
    lists, headings, and tables. The stylesheet that you create in this chapter will
    be the basis for the rest of the projects in the book, as well, showing you how
    CSS can be applied not only across several pages, but also across entire Web applications.


    To demonstrate how CSS can drastically change a page’s design, take a look at
    the simple page shown in Figure A-1. The page is rather dull, uninteresting, and
    plain.


    ![](img/c75d0c4fa51711b62f211459ae794f3f_484_0.png)


    FIGURE A-1 Pages that don’t use CSS (or some other means of style) look boring.


    When you link the stylesheet that is developed in this chapter, you get the more
    interesting page shown in Figure A-2.


    With the addition of a single stylesheet, the page changes significantly. In addition
    to simple font and color issues, CSS is also used for positioning information
    on different parts of the page.'
  merge: -1
  img_proc: true
- pgno: 485
  md: '![](img/c75d0c4fa51711b62f211459ae794f3f_485_0.png)


    FIGURE A-2  A little CSS makes a world of difference; the simple page suddenly
    looks clean and organized, instead of bland and clunky.


    A key goal when designing with CSS is that you should not need to touch the HTML
    code. The aim of CSS is that you can change the entire design of a site by changing
    a single stylesheet, making design both simple and scalable throughout the site.


    > TIP  In addition to good CSS design, you’ll have to resist the urge to add “just
    a little bit” of style in your HTML—leave those font and align tags and attributes
    behind.


    # LAYING OUT THE SITE


    When you create a CSS-driven design, you use HTML to specify the purpose of different
    parts of the page. At the top of the page, for example, you may want an area that
    contains the name of the site. To outline this area, you use the HTML <div> tag
    to identify it.'
  merge: -1
  img_proc: true
- pgno: 486
  md: 'The purpose of the `<div>` tag is to define an area on the page that is used
    for a specific purpose. The `<div>` areas specify not only major areas, such as
    headers or sidebars, but also smaller areas, such as box-outs (separate boxes
    filled with information) that contain additional information. Inside the `<div>`
    and `</div>` tags, the relevant code for that area is added.


    It is important that the `<div>` areas are added in the same order as the page
    flows. If for some reason the CSS file is unavailable, the correct ordering of
    the `<div>` areas still provides the correct page structure, albeit without any
    design. This is particularly important for supporting devices, such as phones
    and PDAs, that do not have full support for CSS.


    For example, if you want to include a header area, a main content area, and a
    footer area, you could use the following `<div>` tags (note that order matters
    here):


    ```

    <div id="header"> </div>

    <div id="main"> </div>

    <div id="footer"> </div>

    ```


    When creating `<div>` tags, you can name them with the **id** or **class** attributes.
    Although both of these two attributes reference the `<div>` area from the stylesheet
    to style them, **id** and **class** have different purposes. If you use the **id**
    attribute, you can use only one `<div>` by name on the page. If you use the **class**
    attribute, you can use more than one `<div>` by that name on the page. As such,
    use the **id** attribute for major areas, such as the header, main section, and
    footer, and use the **class** attribute for page "furniture" (the different parts
    of a page), such as box-outs, which could appear multiple times.


    The first step, before you even think about creating any code, is to get an idea
    of how your page will be *structured*. Start by knowing the basic sections of
    your pages. If you look at Figure A-3, you can see several distinct areas:


    +   - At the top of the page is a consistent gray area that contains the name
    of the site.

    +   - Below the top area is a menu bar.

    +   - A gray sidebar is on the left side of the page. This area is useful for
    information relevant to the main content.

    +   - The main body of the page is where the content will be displayed.'
