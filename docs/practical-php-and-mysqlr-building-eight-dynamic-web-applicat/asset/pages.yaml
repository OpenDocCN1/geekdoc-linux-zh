    # NOTE


    # Counting from Zero


    Many functions in PHP begin counting at zero. When you code and get results that
    are just slightly different (such as 8 cells appearing instead of 7), it could
    be because you have assumed that a function begins counting at 1. Although this
    can be the case, most functions begin from 0.


    The `$numrows` variable takes the `$sundays` variable from `bar.php`, adds the
    `weekday`, and divides by the number of columns (7). The reason you add `weekday`
    to `$sundays` is to pad out the days remaining from the previous month. Referring
    to Figure 8-5, you can see that the month begins on Friday, but the Sunday to
    Thursday days do not contain any dates. By adding `weekday`, you set the amount
    of days that are padded. In this example, Friday returns 5, and if you count from
    left to right (starting with 0), you get Friday.


    After setting these variables, the table headings are added and, finally, two
    variables are set to 1. These variables will be used as counters later in the
    code.


