- pgno: 307
  md: '# Fill In the Ajax Functionality


    When you added the links for new and existing events to the main calendar view,
    they loaded the `newEvent()` and `getEvent()` JavaScript functions. You will create
    them now.


    Way back when you created the `header.php` file, you included the following chunk
    of code at the top:


    ```

    <script language="javascript" type="text/javascript"

    src="./internal_request.js">

    </script>

    ```


    This code includes the `internal_request.js` file, which contains some JavaScript
    code. By including this file at the top of the header file, the code inside the
    file is accessible from any script that includes `header.php` (similar in concept
    to including files in PHP). This file will contain the `newEvent()` and `getEvent()`
    functions.


    Before you can perform any Ajax requests, you need to create an XML HTTP request
    object that transports your requests around. This object is used to transport
    data from the client (the browser) to the server using XML. With it, you tunnel
    data through between the client and server and then update the page dynamically.


    Unfortunately, the Microsoft and Netscape/Mozilla browsers have different objects.
    To determine which object is loaded, you can detect the browser and create the
    relevant object.


    Create a new file called `internal_request.js` and add the function shown in Example
    8-8. Remember that this file contains JavaScript, not PHP.


    **EXAMPLE 8-8 This function loads the right XML HTTP request object for the browser.**


    ```

    function createRequestObject(){

    var request_o;

    var browser = navigator.appName;

    if(browser == "Microsoft Internet Explorer"){ request_o = new ActiveXObject("Microsoft.XMLHTTP");

    } else{

    request_o = new XMLHttpRequest();

    }

    return request_o;

    }

    ```


    The first line creates a new variable called `request_o`. The next line detects
    the name of the Web browser and stores it in the `browser` variable. An `if` then
    checks if'
  merge: -1
  img_proc: true
- pgno: 308
  md: "the browser is Microsoft Internet Explorer and sets request_o to the relevant\
    \ ActiveX object. Otherwise, request_o is set to the Netscape/Mozilla object.\n\
    \nRun the function to instantiate the object:\n\n```\nvar http = createRequestObject();\n\
    ```\n\nAt this point, you now have a working XML HTTP request object available.\
    \ You can begin adding the functions that were called earlier in the main calendar\
    \ view.\n\n# ## Viewing Event Information\n\nIf the user clicks on an event, the\
    \ details should appear in the sidebar. The event link calls the getEvent() function\
    \ (shown in Example 8-9), so add it to internal_request.js.\n\nEXAMPLE 8-9 This\
    \ function loads the page to request the event details from the database.\n\n\
    ```\nfunction getEvent(eventid){\n    http.open('get', 'internal_request.php?action=getevent&id='\
    \ + eventid);\n    http.onreadystatechange = handleEvent;\n    http.send(null);\n\
    }\n```\n\nThe first line uses the open() method from the XML HTTP request object\
    \ to open the page to deal with the request. This method takes two arguments.\
    \ The first is the mechanics of how the request is submitted (GET or POST). Second,\
    \ you specify the script to deal with the request. In this line, you access internal_request.php\
    \ (not to be confused with internal_request.js) and pass it a GET variable called\
    \ id. This variable is set to the number that is passed to the function.\n\nWhen\
    \ the request has been made, you indicate which method should deal with the response;\
    \ the second line specifies handleEvent as this method. Finally, the third line\
    \ actually sends the data. Null is passed to the send() method, because you are\
    \ using GET (if you used POST, you would use a value other than null).\n\nAdd\
    \ the handleEvent() method to deal with the result of the request:\n\n```\nfunction\
    \ handleEvent(){\n    if(http.readyState == 4){\n        var response = http.responseText;\n\
    \        document.getElementById('eventage').innerHTML = response;\n    }\n}\n\
    ```"
