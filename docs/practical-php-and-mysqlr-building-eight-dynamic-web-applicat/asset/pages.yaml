- pgno: 97
  md: "information (such as the ID of an entry or comment) is legitimate. This verification\
    \ process is known as *validation*. In this project, validation is applied to\
    \ only the variables that are added to the address of the site. These variables\
    \ are visible, and the user can change them by editing the address in the browser.\n\
    \n> **NOTE**\n> \n> **Validation, Step by Step**\n> \n> The reason you will validate\
    \ only GET variables, and not other types of information, is to make validation\
    \ easier to learn. This application introduces some basic concepts and keeps things\
    \ simple. Later projects in the book explore validation in more detail, and you\
    \ can return to earlier projects and apply these skills later.\n\nAlthough GET\
    \ variables can be set to letters or numbers, virtually every GET variable in\
    \ this book is set to a number. When you created *index.php* and the links to\
    \ *viewentry.php*, each of them included a GET variable that contained a numeric\
    \ *id*.\n\nTo validate a numeric variable, feed it into a block of code that runs\
    \ some simple tests. Add the following code to the beginning of *viewentry.php*:\n\
    \n```\n```php\n<?php\n\nrequire(\"config.php\");\n\nif(isset($_GET['id']) == TRUE)\
    \ {\n    if(is_numeric($_GET['id']) == FALSE) {\n        $error = 1;\n    }\n\n\
    \    if($error == 1) {\n        header(\"Location: \" . $config_basedir);\n  \
    \  }\n    else {\n        $validentry = $_GET['id'];\n    }\n}\nelse {\n    $validentry\
    \ = 0;\n}\n```\n```\n\nThe first line includes *config.php*. Unlike the previous\
    \ example, *header.php* has not been included (yet). If validation fails, you'll\
    \ redirect users to another page, so there's no need to show the HTML in *header.php*\
    \ until these tests have passed.\n\nThe next line is the first *if* condition.\
    \ The *isset*() function checks to see if the GET variable exists. If it does,\
    \ *isset*() returns *TRUE*; if not, *validentry* is set to 0."
