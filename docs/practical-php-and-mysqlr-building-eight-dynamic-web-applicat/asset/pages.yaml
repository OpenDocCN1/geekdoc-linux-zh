- pgno: 241
  md: "> **NOTE**\n> \n> **The Rights and Wrongs of Drill-Downs**\n> \n> The primary\
    \ aim of a drill-down is to provide a summarized list of items, each of which\
    \ can be clicked to provide more information. This technique is a useful means\
    \ of organizing information effectively throughout a site.\n> \n> When using drill-downs,\
    \ you need to think about what information to sum- marize in the list. In many\
    \ cases this is fairly obvious, but in some cases you may need to do a little\
    \ research to get a clear idea of the information that people primarily look for\
    \ on a Web site.\n\n# Displaying the Categories\n\nTo make the categories appear\
    \ on the left sidebar as a bullet point list, add the fol- lowing code to *bar.php*:\n\
    \n```\nrequire(\"header.php\");\n\n$catsql = \"SELECT * FROM categories ORDER\
    \ BY category ASC\";\n$catsresult = mysql_query($catsql);\n\necho \"<h1>Categories</h1>\"\
    ;\necho \"<ul>\";\necho \"<li><a href='index.php'>View All</a></li>\";\nwhile($catrow\
    \ = mysql_fetch_assoc($catsresult)) {\n  echo \"<li><a href='index.php?id'\n \
    \      . $catrow['id'] . '=' . $catrow['category']\n       . \"</a></li>\";\n\
    }\necho \"</ul>\";\n```\n\nThe query selects everything from the categories table\
    \ in alphabetical order. An unordered list houses the categories, and the first\
    \ entry (View All) is added; this entry links to *index.php* with no id GET variable.\
    \ With the *pf_validate_number()* function added earlier, if no id GET variable\
    \ exists, *$valiid* is set to 0; this is what happens when the user clicks View\
    \ All. Next, the *while* loop iterates through the categories and creates a link\
    \ to *index.php*, in which the category *id* is passed as a GET variable (again,\
    \ called id). The categories list is now complete.\n\n# Viewing the Items in a\
    \ Category\n\nThe front page of the Web site displays the list of available items.\
    \ The vast majority of people who visit an auctions site want to instantly find\
    \ the range of items offered, so it makes sense to put this information on the\
    \ front page."
  merge: -1
  img_proc: true
- pgno: 242
  md: "# Create a file called `index.php` and add the following code:\n\n```\n```php\n\
    <?php\nrequire(\"config.php\");\nrequire(\"functions.php\");\n```\n```\n\nOne\
    \ of the planned features for `index.php` is to list a range of categories that\
    \ users can click to see the items in that category. To create this functionality,\
    \ the categories are listed as a series of links, and each link is passed the\
    \ category id as a GET variable (called `id`). Use the `pf_validate_number()`\
    \ function to validate this variable:\n\n```\n```php\nrequire(\"functions.php\"\
    );\n$validid = pf_validate_number($_GET['id'], \"value\", $config_basedir);\n\
    ```\n```\n\nTo begin displaying information on the page, add the `header.php`\
    \ code:\n\n```\n```php\n$validid = pf_validate_number($_GET['id'], \"value\",\
    \ $config_basedir);\nrequire(\"header.php\");\n```\n```\n\nWhen displaying auction\
    \ items on the main page, you need a different query depending on whether the\
    \ `id` GET variable is present. If it is not, the user clicked View All, and no\
    \ category is selected, so the page should display all of the items. If the `id`\
    \ GET variable is present, only the items within that category should be displayed.\
    \ When you used the `pf_validate_number()` function, you used the value option\
    \ as the second argument so that the function returns 0 if no id GET variable\
    \ exists.\n\nCheck what `$validid` is set to so that you can determine which SQL\
    \ query is used:\n\n```\n```php\nrequire(\"header.php\");\nif($validid == 0) {\n\
    \    $sql = \"SELECT items.* FROM items WHERE dateends > NOW()\";\n} else {\n\
    \    $sql = \"SELECT * FROM items WHERE dateends > NOW()\n    AND cat_id = \"\
    \ . $validid . \" ;\";\n}\n$result = mysql_query($sql);\n$numrows = mysql_num_rows($result);\n\
    ```\n```\n\nIf `$validid` is equal to 0, those items from the *items* table where\
    \ dateends is greater than (newer than) the current date and time (NOW()) are\
    \ selected. If `$validid` is set to a value, the items from the *items* table\
    \ that are newer than the current date and where cat_id matches the value of `$validid`\
    \ is selected."
  merge: -1
  img_proc: true
