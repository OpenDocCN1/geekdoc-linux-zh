    \ . $validforum . \">New Topic</a>]\";\necho \"<br /> <br />\";\n```\n\nNow you\
    \ need to display the topics inside this forum. Although this may sound as simple\
    \ as merely displaying all topics with the forum_id of $validforum, the query\
    \ is actually more complex.\n\nOn this page, you need to display a range of information,\
    \ much of it from different tables:\n\n+   - The topic name lives in the topics\
    \ table.\n+   - The author name is in the users table that is linked by the user_id\
    \ in the topics table.\n+   - The date posted is in the topics table.\n\nTo make\
    \ life more complicated, you also need to display the topic with the most recent\
    \ post at the top of the list. Organizing these topics is quite tough—the actual\
    \ posts are stored in the messages table and then joined to the topics table with\
    \ topic_c_id. As such, you need to order the displayed topics with the newest\
    \ topic as the message with the latest date from the messages table.\n\nTo solve\
    \ this ordering problem, you will use a special function in MySQL called MAX().\
    \ This function selects the latest dates from the messages table. In addition,\
    \ information from the topics and users table is selected. The messages and topics\
    \ tables are then linked in the WHERE clause.\n\nNow sit back, hold your breath,\
    \ and run this epic query:\n\n```\necho \"<br /> <br />\";\n\n$topicsql = \"SELECT\
    \ MAX(messages.date ) AS maxdate,\n topics.id AS topicid, topics.*, users.*\n\
    \ FROM messages, topics, users WHERE messages.topic_id\n = topics.id AND topics.user_id\
    \ = users.id AND\n topics.forum_id = \" . $validforum . \" GROUP BY\n messages.topic_id\
    \ ORDER BY maxdate DESC;\";\n$topicresult = mysql_query($topicsql);\n$topicnrows\
    \ = mysql_num_rows($topicresult);\n```"
