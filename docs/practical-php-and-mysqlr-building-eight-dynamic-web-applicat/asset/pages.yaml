- pgno: 356
  md: 'Before long, the site never gets updated and becomes another dusty, old, unmaintained
    husk on the Internet.


    To solve this problem, you need to encourage site users to become involved and
    contribute content themselves. With this in mind, you will add functionality to
    allow any user to submit questions. The owner of the subject (another contributor)
    can moderate the wheat from the chaff. This will encourage some community spirit.


    # ## Adding Questions


    When adding questions to a topic, the script needs to take into account two possible
    modes of operation:


    +   If the user is the subject owner, the question should be added instantly to
    the range of available questions for the subject.


    +   If the user is not the owner of the subject, the submitted question should
    be held for moderation by the subject owner.


    The logistics of handling which questions are intended for moderation is simply
    a case of adjusting the active field in the *questions* table. If this field is
    set to 0, the question requires moderation; if it is set to 1, the question is
    live.


    In addition to handling these questions differently, this script can also be used
    in two possible places. When browsing the topics, the topic view contains a link
    to add a question. In this case, the script is passed the id of the topic to which
    the question is added. The selected topic is displayed on the form, as shown in
    Figure 9-9.


    ![](img/c75d0c4fa51711b62f211459ae794f3f_356_0.png)


    ![](img/c75d0c4fa51711b62f211459ae794f3f_356_1.png)


    The user’s control panel also provides a link to add a question to a subject.
    In this case, the topic is not known, and the script provides a list of topics
    from the subject, as shown in Figure 9-10.'
