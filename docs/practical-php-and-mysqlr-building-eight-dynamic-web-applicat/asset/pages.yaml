  md: '# # CHAPTER 5


    # Discussion Forums


    Discussion forums have become a fundamental part of the Internet. Within these
    Web-based message boards, users discuss topics that are cogitated over by a close
    community of contributors. And within these discussion forums, Internet users
    can become part of a wider community. Discussion forums offer a compelling and
    interesting challenge to code. Features such as creating categories, forums, and
    topics; replying to messages; registering users; and more are common requirements.


    After you’ve created a blog, writing the code behind a discussion board is a natural
    progression of your skills because it introduces the idea of two-way communication,
    as opposed to the relatively one-way perspective offered by a blog. As such, this
    chapter provides an important step in your programming experience—everyone should
    write some discussion forums at least once!


    # ## UNDER THE HOOD


    Virtually all discussion forums have a very similar design that involves three
    primary entities: categories, forums, and topics. To explain this structure, take
    a look at Figure 5-1.


    This figure shows a typical phpBB (http://www.phpbb.com/) installation. phpBB
    is a popular Open Source forums engine that adheres to these common usability
    methods. In the figure, you can see a list of categories (only one—LUGRadio),
    and the category has a number of forums (General Discussion, Ideas for the show,
    Mirrors, and LUGRadio Live). When you click a forum, the forum topics display,
    as shown in Figure 5-2.'
