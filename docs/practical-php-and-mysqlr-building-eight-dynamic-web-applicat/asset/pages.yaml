    # ## FORMATTING TABLES


    Tables are an important part of many pages, and they are useful for showing summarized
    chunks of information. It is important to remember to use tables only for what
    they are intended: showing tabular information. Many beginners can’t resist the
    temptation to use tables to store information that really should be designed for
    a <div>—and as explained earlier, there are many reasons to avoid nested tables.
    The best approach is to think about how tables are displayed in books. If your
    information was inside a book, for example, and would likely be in a table, use
    a table. If not, use something else, such as a <div>.'
  merge: -1
  img_proc: true
