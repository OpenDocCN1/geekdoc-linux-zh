    # **NOTE**


    # **No Batteries Required**


    As you learned in Chapter 1, PHP is very much a batteries-included language and
    includes a huge range of functions that solve a huge range of common challenges.
    Throughout this book, you will learn to use a range of functions that are common
    in typical programming situations.


    To find out more about a function, just visit www.php.net. Add the function after
    a slash, such as www.php.net/floor, to find out more about `floor()`.


    # **Arrays**


    One of the most useful types of variable is an **array**. This special variable
    gives you the ability to store more than one piece of information in a single
    variable. Imagine that you are storing a list of your favorite choices in a program.
    You may want to store the following choices:


    | Favorite | Choice |

    | :------- | :----- |

    | Color | Blue |

    | Food | Mexican |

    | Pastime | Swimming |

    | Music | Metal |


    In this list of things to store, a clear relationship exists between the item
    on the left and the item on the right. This is called a **key-value pair**, or
    an **associative array**. With one of these pairs, you have a key (such as `Color`)
    and a value that the key is set to (such as `Blue`). Arrays are perfect for storing
    these relationships.


    There are a few methods of creating arrays. The first is to use the following
    format:


    ```

    ```

    $arr["Color"] = "Blue";

    $arr["Food"] = "Mexican";

    ```


    ```'
