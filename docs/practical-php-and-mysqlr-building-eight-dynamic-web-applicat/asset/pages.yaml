- pgno: 376
  md: 'You now need to protect this file from unauthorized use. This is more challenging
    because both the administrator and users who own subjects can use the file. Unauthorized
    users include people not logged in and those users who don’t own a subject.


    The solution is to perform checks to see if the current user is a valid user.
    If the user is a valid user, the $auth variable is set to 1. After these tests,
    the $auth variable is checked. If $auth is not equal to 1, the page is redirected.


    Add the checks:


    ```

    require("functions.php");


    if(isset($_SESSION["SESS_ADMINUSER"]) == TRUE) {

    $auth = 1;

    }


    if(isset($_SESSION["SESS_USERNAME"]) == TRUE) {

    $authsql = "SELECT * FROM subjects WHERE owner_id = "

    . $_SESSION["SESS_USERID"] . " ORDER BY subject ASC;";

    $authresult = mysql_query($authsql);

    $authnumrows = mysql_num_rows($authresult);

    if($authnumrows >= 1) {

    $auth = 1;

    }

    }

    ```


    The first check identifies whether the administrator is logged in. If he is, $auth
    is set to 1. The next check identifies whether a user is logged in and then performs
    a query to see that user owns any subjects. If the query returns one or more rows,
    $auth is set to 1.


    Check the value of $auth:


    ```

    $auth = 1;

    }


    if($auth != 1) {

    header("Location: " . $config_basedir);

    }

    ```


    If $auth is not equal (!=) to 1, the page redirects.'
