    # **NOTE**


    # **Active and Inactive Questions**


    The *active* field lives inside the *questions* table. This field identifies whether
    the question is live. If the field contains 0, the question is currently being
    held for moderation. If the field is set to 1, the question is live.


    When a user who does not own the subject submits a question, *active* is set to
    0 (Requires moderation). When the owner adds a question, *active* is set to 1.
    When a question to be moderated is accepted, *active* is changed from 0 to 1.


    # **The *comments* Table**


    +   - *id*. Make this a BIGINT (several comments are possible) and turn on auto_increment
