    \  <a href=\"<?php echo $config_basedir; ?>about.php\">About</a>\n  •\n  <a href=\"\
    <?php echo $config_basedir; ?>faq.php\">FAQ</a>\n  •\n  <a href=\"<?php echo $config_basedir;\
    \ ?>tech.php\">Technical Details</a>\n</div>\n```\n\nThis `<div>` adds a number\
    \ of links to different pages on the site. Each link is prefixed with the address\
    \ of site (stored in the $config_basedir variable). Using the variable as a prefix,\
    \ you can guarantee that each page links to the correct Web address where the\
    \ pages are stored. This solves common problems that can occur when just specifying\
    \ the page filename.\n\nAdd the main body of the site:\n\n```\n<a href=\"<?php\
    \ echo $config_basedir; ?>tech.php\">Technical Details</a>\n</div>\n\n<div id=\"\
    container\">\n  <div id=\"bar\">\n    <?php\n      require(\"bar.php\");\n   \
    \ ?>\n  </div>\n```\n\nThe container `<div>` first includes the bar `<div>`. Inside\
    \ the bar, you include bar.php. You will create bar.php in a later section.\n\n\
    Add the main `<div>`:"
