- pgno: 345
  md: "# **NOTE**\n\n**Hiding the Administrator Login screen**\n\nThose of you with\
    \ a penchant for small detail may have noticed that figures in this chapter have\
    \ no link to an Administrator login page. This is a deliberate and enforced decision\
    \ to improve the security of the site.\n\nIf you are providing the opportunity\
    \ for an administrator to log into the site, don't provide a link to the login\
    \ page. If a link is available, the vermin of the Internet may descend on it and\
    \ try to fake a login. By hiding the link, the aforementioned vermin need to find\
    \ the login page before they can try to crack it. This may be frustrating enough\
    \ for many of them to give up.\n\nThis technique should by no means be your only\
    \ security solution, but every little bit helps.\n\nAlways remember that security\
    \ is about a number of small steps and not just one large step. A number of different\
    \ measures, large and small, can help improve your site's security.\n\nFirst,\
    \ build the login page. Create a new file called login.php and add the code shown\
    \ in Example 9-4.\n\n**EXAMPLE 9-4** This code is virtually the same as previous\
    \ login pages.\n\n```\n<?php\n\nsession_start();\n\nrequire(\"config.php\");\n\
    \nif($_SESSION['SESS_USERNAME']) {\n    header(\"Location: \" . $config_basedir\
    \ . \"userhome.php\");\n}\n\n$db = mysql_connect($dbhost, $dbuser, $dbpassword);\n\
    mysql_select_db($dbdatabase, $db);\n\nif($_POST['submit']) {\n    $sql = \"SELECT\
    \ * FROM users WHERE username = '\n            . $_POST['username'] . \"' AND\
    \ password = '\n            . $_POST['password'] . \"';\";\n\n    $result = mysql_query($sql);\n\
    \    $numrows = mysql_num_rows($result);\n\n    if($numrows == 1) {\n```\n\ncontinues"
