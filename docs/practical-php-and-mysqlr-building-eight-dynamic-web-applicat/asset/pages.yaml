- pgno: 77
  md: '# CHAPTER 4


    # Building a Weblog


    One of the most talked about Internet phenomenon in recent times is that of the
    Weblog (often shorted to *blog*). The conceipt of a blog—and the subsequent art
    of blogging—is that you provide your own online diary or journal in which you
    can scribe your thoughts for the world to see. The actual content that you pour
    into your blog is completely up to you, and the blog can be as formal, or informal,
    as you like. If you want to tell the world that your milk went bad and you need
    to pick up some from the store, a blog is where you write all about it.


    The blog-reading public is not just obsessed with milk-longevity-related shenanigans,
    though. Although typically used as a vehicle to communicate thoughts online, blogs
    have also become a primary means by which various people connected to a hobby
    or project share what they are working on. This has been particularly popular
    with Open Source developers who use their blogs to give their readers a sneak
    peak of what''s to come in the software they hack.


    Although the basic function of a blog is to store a series of blog posts (often
    called *entries*), many blogs also include other features:


    +   ■ **Commenting.** Readers of the blog can often leave comments. This can add
    real value to a *blog*, and conversations often strike up over varying subjects.

    +   ■ **Categorization.** Blogs are often *separated* into different categories.
    This gives the blog author the ability to file entries into a specific section.
    This also allows readers to read only the category that interests them.

    +   ■ **Archives.** Most blogs have some means of archiving and accessing previous
    entries. With blogs becoming as relavant a medium as “normal” Web sites, being
    able to access earlier entries is important.'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'In this project, you will build a blog that incorporates all of the preceding
    features. Aren’t you lucky?


    # ## PROJECT OVERVIEW: BLOGTASTIC USE CASE


    The blog application created in this chapter is rather nifflly titled Blogtastic.
    To get an overview of how to build the blog, here is a simple use case that demonstrates
    how typical users would interact with the application. Use cases are very handy
    for helping to visualize exactly how different interactions and content should
    be presented to users. The following is a synopsis of the use case for the Blogtastic
    application:


    John visits Pauline’s blog and, naturally, wants to see Pauline’s latest entry.
    John is interested in reading the blog entry but would also like to see if any
    comments have been posted in response to her. If the blog entry has comments,
    the names of the commenters are added to the bottom of the blog, so John can see
    who posted each comment.


    To access the blog and any corresponding comments, John clicks the title of the
    blog entry, and that specific entry (with comments) is displayed. In case John
    wants to leave a comment, a form for him to express his views is conveniently
    available on the same page. John fills out the form and clicks the Submit button,
    after which the page is reloaded with John’s comment added. John then whiles away
    the afternoon pursuing through older blog entries in the archived entries page.


    Later that day, Pauline decides she wants to add a new blog entry. Pauline visits
    a special page on the Web site where she can log in. As the blog’s author, some
    additional options are made available only to her. Pauline can add a new blog
    entry to a specific category, or she can even add a new category. Pauline adds
    a new entry and then realizes she made a mistake. Fortunately, a special Edit
    button that she—and only she—can see displays on the page. Pauline uses this button
    to correct her mistake and avoid looking silly in front of John. Pauline secretly
    thinks she is better than John.


    This is a typical example of a blog, and in this project, you will pour all of
    the preceding functionality into Blogtastic to match this use case.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '![](img/c75d0c4fa51711b62f211459ae794f3f_79_0.png)


    # NOTE

    Take Your Time


    Because this is the first database-driven project in this book, progress through
    the chapter at a pace that is comfortable to you. If you come across any concepts
    you don''t understand, take a moment to stop, visit Google, and do some research
    to clear up the misunderstanding before you continue. When learning a new technology,
    never plough on if you don''t understand the concepts; you will only dig a bigger
    hole to fall into.


    # BUILDING THE DATABASE


    The first step in the Blogtastic project is to build the database. To begin, create
    a new database in phpMyAdmin called blogtastic. Within this database, create four
    tables:


    <table><thead><tr><th style="text-align: left">TABLE NAME</th><th style="text-align:
    left">WHAT THE TABLE STORES</th></tr></thead><tbody><tr><td style="text-align:
    left"><i>categories</i></td><td style="text-align: left">Different blog categories</td></tr><tr><td
    style="text-align: left"><i>entries</i></td><td style="text-align: left">Blog
    postings</td></tr><tr><td style="text-align: left"><i>comments</i></td><td style="text-align:
    left">Comments on blog entries</td></tr><tr><td style="text-align: left"><i>logins</i></td><td
    style="text-align: left">Usernames and passwords</td></tr></tbody></table>


    The schema of the tables is shown in Figure 4-1.


    ![](img/c75d0c4fa51711b62f211459ae794f3f_79_1.png)


    ![](img/c75d0c4fa51711b62f211459ae794f3f_79_2.png)


    # FIGURE 4-1


    Even for a simple application such as a blogging engine, careful database design
    will save a lot of work in the long run.'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'Figure 4-1 shows how the four tables relate to each other. The first relationship
    is between the blog category (the categories table) and the blog entry (the entries
    table). To reference the correct category, the same id from the categories table
    is stored in the cat_id field of the entries table. In database parlance, the
    id field is known as the primary key, and the cat_id field is known as the foreign
    key. If these two values match, an explicit connection exists between the tables.
    In other words, if you know the id of the category (stored in cat_id), you can
    run a query to pull out the other category information (such as the name of the
    category) using that id. The second relationship—between the entries table and
    the comments table—works in exactly the same way; the id field from the entries
    table is connected to the blog_id in the comments table. This connects each comment
    with the correct blog entry.


    The final table is the logins table, which has no relationship to the others;
    the table is used simply for logging each user into the application.


    # ## Implementing the Database


    With the database design laid out, you can create the database tables. In phpMyAdmin,
    follow the steps discussed in Chapter 2 to add new tables, using these details:


    # ### The categories Table


    +   - id. Make this a TINYINT (this type is used because there will not be many
    categories) and turn on auto_increment in the Extras column. Set this field as
    a primary key.

    +   - cat. Make this a VARCHAR. Because a category title longer than 20 letters
    is unlikely, set the size to 20.


    # ### The entries Table


    +   - id. Make this an INT (several blog entries are possible) and turn on auto_increment.
    Set this field as a primary key.

    +   - cat_id. Make this a TINYINT (the same type as the primary key it references—id
    in the categories table).

    +   - dateposted. Use the DATETIME type. This data type stores the current date
    and time in the international ISO standard format, which is pretty clunky, but
    you can format the date later in PHP.

    +   - subject. Make this a VARCHAR. Unless your blog title is extremely long,
    set the length of this field to 100.

    +   - body. Make this a TEXT field. If you ever want to store very large areas
    of text, the TEXT type is a good choice. You don’t need to specify a length.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '67


    # The comments Table


    +   id. Make this an INT (several comments are likely). Turn on auto_increment
    and set this field as a primary key.


    +   blog_id. Make this an INT (the same type as the id field in the entries table,
    to which it is related).


    +   dateposted. Use the DATETIME type.


    +   name. Make this a VARCHAR. Because comment titles longer than 50 characters
    is unlikely, set the length to 50.


    +   comment. This is the main body of the comment. Set to the TEXT type.


    # The logins Table


