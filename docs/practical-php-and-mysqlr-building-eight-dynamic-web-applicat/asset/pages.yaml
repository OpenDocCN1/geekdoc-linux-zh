    \ use it to loop between 1 and 31 to fill the box with possible day values.\n\n\
    # The while Loop\n\nThe other type of loop that is used extensively in PHP is\
    \ the **while** loop. A **while** is particularly useful because it simply keeps\
    \ looping while the loop condition is true. This is commonly used to iterate through\
    \ database records.\n\nThe **while** loops are difficult to demonstrate because\
    \ they are most typically used in real-world examples that uses code not yet covered\
