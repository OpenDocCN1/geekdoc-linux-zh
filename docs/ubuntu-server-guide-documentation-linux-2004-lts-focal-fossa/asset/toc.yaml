- - '###'
  - multipathd 进程。
- - '###'
  - 值：max|n > 0
- - '###'
  - 默认：None
- - '###'
  - max_fds 8192
- - '###'
  - 名称：rr_weight
- - '###'
  - 范围：multipath & multipathd
- - '###'
  - 描述：如果设置为 priorities（优先级），multipath 配置器将分配
- - '###'
  - 路径权重为 "path pri* rr_min_io"
- - '###'
  - 值：priorities|uniform（均匀）
- - '###'
  - 默认：uniform
- - '###'
  - 名称：failback
- - '###'
  - 范围：multipathd
- - '###'
  - 描述：告诉进程管理路径组的回滚（failback），或者不管理。
- - '###'
  - 0 表示立即回滚，值 >0 表示延迟
- - '###'
  - failback 以秒为单位。
- - '###'
  - 值：manual（手动）|immediate（立即）|n > 0
- - '###'
  - 默认：manual
- - '###'
  - 名称：no_path_retry
- - '###'
  - 范围：multipath & multipathd
- - '###'
  - 描述：禁用之前的重试次数，或者
- - '###'
  - '"fail" 表示立即失败（不队列），'
- - '###'
  - '"queue" 表示永远不停止队列'
- - '###'
  - 值：queue|fail|n (>0)
- - '###'
  - 默认：(null)
- - '###'
  - 名称：queue_without_daemon
- - '###'
  - 范围：multipathd
- - '###'
  - 描述：如果设置为 "no",multipathd 在关闭时将禁用所有设备的队列功能。
- - '###'
  - 值：yes（是）|no（否）
- - '###'
  - 默认：yes
- - '###'
  - 名称：user_friendly_names
- - '###'
  - 范围：multipath & multipathd
- - '###'
  - 描述：如果设置为 "yes"，将使用绑定文件
- - '###'
  - /etc/multipath/bindings 为 multipath 分配持久且
- - '###'
  - 唯一的别名，格式为 mpath<n>
- - '###'
  - 如果设置为 "no"，则使用 WWID 作为别名。任何情况下，将被文件中的任何别名覆盖。
- - '###'
  - 值：yes|no
- - '###'
  - 默认：no
- - '###'
  - 名称：mode
- - '###'
  - 范围：multipath & multipathd
- - '###'
  - 描述：用于 multipath 节点的模式，采用八进制。
- - '###'
  - 值：077
- - '###'
  - 默认：由操作系统决定
- - '###'
  - 名称：uid
- - '###'
  - 范围：multipath & multipathd
- - '###'
  - 描述：用于 multipath 节点的用户 ID。可以使用数字型或符号型
- - '###'
  - 值：<user_id>
- - '###'
  - 默认：由操作系统决定
- - '###'
  - 名称：gid
- - '###'
  - 范围：multipath & multipathd
- - '###'
  - 描述：用于 multipath 节点的组 ID。可以使用数字型或符号型
- - '###'
  - 值：<group_id>
- - '###'
  - 默认：由操作系统决定
- - '###'
  - 名称：checker_timeout
- - '###'
  - 范围：multipath & multipathd
- - '###'
  - 描述：用于路径检查器和优先级分配器的超时，单位秒。
- - '###'
  - 值：n > 0
- - '###'
  - 默认：取自 /sys/block/sd<device>/timeout
- - '###'
  - 名称：fast_io_fail_timeout
- - '###'
  - 范围：multipath & multipathd
- - '###'
  - 描述：在远程端口检测到问题，scsi 层等待的秒数，然后对远程端口失败。
- - '###'
  - 值：off | n >= 0
- - '###'
  - 默认：由操作系统决定
- - '###'
  - 名称：dev_loss_tmo
- - '###'
  - 范围：multipath
- - '###'
  - 描述：在远程端口检测到问题，scsi 层在系统中移除之前等待的秒数。
- - '###'
  - 值：infinity（无限）|n > 0
- - '###'
  - 默认：由操作系统决定
- - '###'
  - 名称：bindings_file
- - '###'
  - 范围：multipath
- - '###'
  - 描述：与 user_friendly_names 选项使用的绑定位置。
- - '###'
  - 值：<full_pathname>
- - '###'
  - 默认：/var/lib/multipath/bindings
- - '###'
  - /etc/multipath/bindings
- - '###'
  - 名称：wwids_file
- - '###'
  - 范围：multipath
- - '###'
  - 描述：multipath 用于跟踪已创建的 multipath 设备。
- - '###'
  - 值：<full_pathname>
- - '###'
  - 默认：/var/lib/multipath/wwids
- - '###'
  - /etc/multipath/wwids
- - '###'
  - 名称：reservation_key
- - '###'
  - 范围：multipath
- - '###'
  - 描述：mpathpersist 使用操作预留。
- - '###'
  - 值：<key>
- - '###'
  - 默认：(null)
- - '###'
  - reservation_key：mpathkey
- - '###'
  - 名称：force_sync
- - '###'
  - 范围：multipath
- - '###'
  - 描述：如果设置为 yes，multipath 将同步模式运行所有检查器，如果检查器具有异步模式。
- - '###'
  - 值：yes|no
- - '###'
  - 默认：yes
- - '###'
  - 名称：config_dir
- - '###'
  - 范围：multipath & multipath
- - '###'
  - 描述：如果不是字符串，multipath 将按字母顺序搜索该目录中 ".conf" 结尾的文件，并从这些文件中读取来自 /etc/multipath.conf
- - '###'
  - 值："" 或完整路径
- - '###'
  - 默认：/etc/multipath.d
- - '###'
  - 名称：delay_watch_checks
- - '###'
  - 范围：multipathd
- - '###'
  - 描述：如果设置为大于 0，multipathd 将监控最近变为有效的路径。如果它们在监控期间发生故障，当再次有效时，将持续 delay_wait_checks
    后使用。
- - '###'
  - 值：no|<0
- - '###'
  - 默认：no
- - '###'
  - 名称：delay_wait_checks
- - '###'
  - 范围：multipathd
- - '###'
  - 描述：如果设置为大于 0，当设备在 delay_wait_checks 时间内重新上线，下次上线将被标记为延迟，直到通过 delay_wait_checks
    后使用。
- - '###'
  - 值：no|<0
- - '###'
  - 默认：no
