    # Nagios


    # Installation


    First, on server01 install the nagios package. In a terminal enter:


    ```

    sudo apt install nagios3 nagios-nrpe-plugin

    ```


    You will be asked to enter a password for the nagiosadmin user. The user''s credentials
    are stored in /etc/nagios3/htpasswd.users. To change the nagiosadmin password,
    or add additional users to the Nagios CGI scripts, use the htpasswd utility that
    is part of the apache2-utils package.


    For example, to change the password for the nagiosadmin user enter:


    ```

    sudo htpasswd /etc/nagios3/htpasswd.users nagiosadmin

    ```


    To add a user:


    ```

    sudo htpasswd /etc/nagios3/htpasswd.users steve

    ```


    Next, on server02 install the nagios-nrpe-server package. From a terminal on server02
    enter:


    ```

    sudo apt install nagios-nrpe-server

    ```


    > Note

    NRPE allows you to execute local checks on remote hosts. There are other ways
    of accomplishing this through other Nagios plugins as well as other checks.


    # Configuration Overview


    There are a couple of directories containing Nagios configuration and check files.


    +   - /etc/nagios3: configuration files for the operation of the nagios daemon,
    CGI files, hosts, etc.

    - /etc/nagios-plugins: house configuration files for the service checks.

    - /etc/nagios: on the remote host contains the nagios-nrpe-server configuration
    files.

    - /usr/lib/nagios/plugins/: where the check binaries are stored. To see the options
    of a check use the -h option.


    For example: /usr/lib/nagios/plugins/check_dhcp -h


    There are a plethora of checks Nagios can be configured to execute for any given
    host. For this example Nagios will be configured to check disk space, DNS, and
    a MySQL hostgroup. The DNS check will be on server02, and the MySQL hostgroup
    will include both server01 and server02.


    > Note

    See details on setting up Apache, Domain Name Service, and MySQL.'
