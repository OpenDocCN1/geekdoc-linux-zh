- img_proc: true
  md: '# Backing store


    LXD supports backing stores. The recommended and default backing store is zfs.
    If you already

    a ZFS pool configured, you can tell LXD to use it during the lxd init procedure,
    otherwise a file-backed

    zpool will be created automatically. With ZFS, launching a new container is fast
    because the filesystem starts

    a a copy on write of the images'' filesystem. Note that unless the container is
    privileged (see below)

    lXD will need to change ownership of all files before the container can start,
    however this is fast and change

    very little of the actual filesystem data.


    The other supported backing stores are described in detail in the Storage configuration
    section of the LXD

    documentation.


    # Container configuration


    Containers are configured according to a set of profiles, described in the next
    section, and a set of container-specific configuration. Profiles are applied first,
    so that container specific configuration can override profile

    configuration.


    Container configuration includes properties like the architecture, limits on resources
    such as CPU and RAM,

    security details including apparmor restriction overrides, and devices to apply
    to the container.


    Devices can be of several types, including UNIX character, UNIX block, network
    interface, or disk. In order

    to insert a host mount into a container, a ''disk'' device type should be used.
    For instance, to mount /opt in

    container cl at /opt, you could use:


    ```

    lxc config add cl opt source=/opt path=opt

    ```


    See:


    ```

    lxc help config cl

    ```


    for more information about editing container configurations. You may also use:


    ```

    lxc config edit cl

    ```


    to edit the whole of cl''s configuration. Comments at the top of the configuration
    will show examples of

    correct syntax to help administrators hit the ground running. If the edited configuration
    is not valid

    the editor is exited, then the editor will be restarted.


    # Profiles


    Profiles are named collections of configurations which may be applied to more
    than one container. For

    instance, all containers created with lxc launch, by default, include the default
    profile, which provides a

    network interface eth0.


    To mask a device which would be inherited from a profile but which should not
    be in the final container,

    define a device by the same name but of type ''none'':


    ```

    lxc config device add cl eth1 none

    ```


    # Nesting


    Containers all share the same kernel. This means that there is always an inherent
    trade-off between

    features exposed to the container and host security from malicious containers.
    Containers by default are

    therefore restricted from features needed to nest child containers. In order to
    run lxc or lxd containers under

    a lxd container, the security .nesting feature must be set to:'
  merge: -1
