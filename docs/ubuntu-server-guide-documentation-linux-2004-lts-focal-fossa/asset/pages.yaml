    \    service_description DNS\n    check_command check_dns!172.18.100.101\n}\n\
    ```\n\nRestart the nagios daemon to enable the new configuration:\n\nsudo systemctl\
    \ restart nagio3.service\n\n+   * Now add a service definition for the MySQL check\
