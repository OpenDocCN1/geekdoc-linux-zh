    # # Firewall


    # # Introduction


    The Linux kernel includes the Netfilter subsystem, which is used to manipulate
    or decide the fate of network traffic headed into or through your server. All
    Linux firewall solutions use this system for packet filtering.


    The kernel''s packet filtering system would be of little use to administrators
    without a userspace interface to manage it. This is the purpose of iptables: When
    a packet reaches your server, it will be handed off to the Netfilter subsystem
    for acceptance, manipulation, or rejection based on the rules supplied to it from
    userspace via iptables. This is all you need to manage your firewall, if you''re
    familiar with it, many frontends are available to simplify the task.


    # # ufw - Uncomplicated Firewall


    The default firewall configuration tool for Ubuntu is ufw. Developed to create
    iptables firewall configuration, ufw provides a user-friendly way to create an
    IPv4 or IPv6-based firewall.

    ufw by default is initially disabled. From the ufw man page:


    > > ufw is not intended to provide complete firewall functionality via its command
    interface, but instead provides an easy way to add or remove simple rules. It
    is currently used for host-based firewalls.


    The following are examples of how to use ufw:


    +   - First, ufw needs to be enabled. From a terminal prompt enter:

    sudo ufw enable

    - To open a port (SSH in this example):

    sudo ufw allow 22

    - Rules can also be added using a numbered format:

    sudo u insert 1 allow 80

    - Similarly, to close an opened port:

    sudo ufw deny 22

    - To remove a rule, delete followed by the rule:'
