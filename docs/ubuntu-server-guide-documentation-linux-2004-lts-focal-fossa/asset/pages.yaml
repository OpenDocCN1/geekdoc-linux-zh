    # # Domain Name Service (DNS)


    Domain Name Service (DNS) is an Internet service that maps IP addresses and fully
    qualified domain names (FQDN) to one other. In this way, DNS alleviates the need
    to remember IP addresses. Computers with DNS runs are called *name servers*. Ubuntu
    ships with BIND (Berkley Internet Naming Daemon), the most common program used
    for maintaining a name server on Linux.


    # # Installation


    At a terminal prompt, enter the following command to install dns:


    ```

    sudo apt install bind9

    ```


    A very useful package for testing and troubleshooting DNS issues is the dnsutils
    package. Very often these tools will be installed already, but to check and/or
    install dnsutils enter the following:


    ```

    sudo apt install dnsutils

    ```


    # # Configuration


    There are many ways to configure BIND9. Some of the most common configurations
    are a caching nameserver, primary server, and secondary server.


    +   - When configured as a caching nameserver BIND9 will find the answer to name
    queries and remember the answer when the domain is queried again.

    - As a primary server, BIND9 reads the data for a zone on its host and is authoritative
    for that zone.

    - As a secondary server, BIND9 gets the data from another nameserver that is authoritative
    for that zone.


    # # Overview


    The DNS configuration files are stored in the /etc/bind directory. The primary
    configuration file is /etc/bind/named.conf, which is in the layout provided by
    the package just includes these files.


    +   - /etc/bind/named.conf: global DNS options

    - /etc/bind/named.conf.local: for your zones

    - /etc/bind/named.conf.default: zones such as localhost, its reverse, and the
    root hints


    The root nameservers are described in the file /etc/bind/db.root. This is now
    provided by the /usr/share/dns/root.hints file included with the dns-data package,
    and is referenced in the named.conf.default configuration file above.


    It is possible to configure the server to be a caching nameserver, primary, and
    secondary: it all depends on the zones it is serving. A server can be the Start
    of Authority (SOA) for one zone, while'
