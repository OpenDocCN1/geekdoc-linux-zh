  md: "# Download and Serve GRFI Binary\n\nThe grub binary helps us redirect the downloading\
    \ path to the target files via grub.cfg. You may refer to this discourse post\
    \ to get more information about the PXE process and why we need this binary.\n\
    \n```\n$ sudo wget http://ports.ubuntu.com/ubuntu-ports/dists/focal/main/uefi/grub2-arm64/current/grubnetaa64.efi\
    \ -O /var/lib/tftboot/grubnetaa64.efi -nsigned\n```\n\nPlease note you may need\
    \ to change the archive dists names from focal to your target distribution name.\n\
    \n# Download and Serve More Files\n\nFetch the installer by downloading a Ubuntu\
    \ server iso, e. 20.04.1 live server arm64 iso. Please note the prefix live is\
    \ significant. We need the files available only in the live version.\n\nMount\
    \ the iso and copy the target files to the TFTP folder\n\n```\n$ sudo mount /ubuntu-20.04.1-live-server-arm64.iso\
    \ /mnt\n$ sudo mkdir /var/lib/tftboot/grub /var/lib/tftboot/casper\n$ sudo cp\
    \ /mnt/boot/grub/grub.cfg /var/lib/tftboot/grub/\n$ sudo cp /mnt/casper/initrd\
    \ /var/lib/tftboot/casper/\n$ sudo cp /mnt/casper/vmlinuz /var/lib/tftboot/casper/\n\
    ```\n\nSo, the TFTP root folder should look like this:\n\n```\n$ /var/lib/tftboot/\n\
    /var/lib/tftboot/\n/var/lib/tftboot/grub\n/var/lib/tftboot/grub.cfg\n/var/lib/tftboot/grubnetaa64.efi.signed\n\
    /var/lib/tftboot/casper\n/var/lib/tftboot/casper/initrd\n/var/lib/tftboot/casper/vmlinuz\n\
    ```\n\nFinally, let's customize the grub menu so we install our target image by\
    \ fetching it directly over the internet.\n\n```\n$ sudo chmod +w /var/lib/tftboot/grub/grub.cfg\n\
    $ sudo vi /var/lib/tftboot/grub/grub.cfg\n```\n\nAdd an new entry\n\n```\nmenuentry\
    \ \"Install Ubuntu Server (Focal 20.04.1) (Pull the iso from web)\\ {\n  linux\
    \ set gpxload-key url=http://cdimage.ubuntu.com/releases\n  20.04.1/release/ubuntu-20.04.1-live-server-arm64.iso\
    \ only-\n  ubiquity ip=dhcp\n  initrd /casper\n}\n```\n\nip=dhcp for the dhcp\
    \ management setup in the lab, url is to point to your target download url. Remember\
    \ to change them according to your scenario.\n\nIf everything goes well, you will\
    \ get the expected grub menu of the ephemeral live prompt. Select the entry you\
    \ put in grub.cfg, which is Ubuntu Server (Focal 20.04.1) (Pull the iso from web)\
