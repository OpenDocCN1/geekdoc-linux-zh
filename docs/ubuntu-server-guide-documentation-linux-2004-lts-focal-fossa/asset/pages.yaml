    # Creating a Profile


    +   - Design a test plan: Try to think about how the application should be exercised.
    The test plan should be divided into small test cases. Each test case should have
    a small description and list the steps to follow.


    Some standard test cases are:


    +   - Starting the program.

    - Stopping the program.

    - Reloading the program.

    - Testing all commands supported by the init script.


    +   - Generate the new profile: Use aa-genprof to generate a new profile. From
    a terminal:

    sudo aa-genprof executable


    For example:

    sudo aa-genprof slapd


    +   - To get your new profile included in the apparmor-profiles package, file
    a bug in Launchpad against the AppArmor package:

    - Include your test plan and test cases.

    - Attach your new profile to the bug.


    # Updating Profiles


    When the program is misbehaving, audit messages are sent to the log files. The
    program aa-logprof can be used to scan log files for AppArmor audit messages,
    review them and update the profiles. From a terminal:

    sudo aa-logprof


    # Further pre-existing Profiles


    The packages apart--profiles and apparmor--extra ship experimental profiles for
    AppArmor security policies. We do not expect these profiles to work out-of-the-box,
    but they can give you a head start when trynin to create a new profile by starting
    off a base that exists.


    These profiles are not considered mature enough to be shipped in enforce mode
    by default. Therefore they are shipped in complain mode so that users can test
    them, which are desired, and help improve upstream if needed.'
