  md: 'The vendor, product, and revision fields multipath or multipathd detect for
    devices in a system depend on the device type. For SCSI devices, they correspond
    to the respective fields of the SCSI INQUIRY page. In general, the command multipathd
    show forms format "%d %s*" command can be used to see the detected properties
    for all devices in the system.


    The device subsection recognizes the following attributes:


    +   1. vendor(Mandatory) Regular expression to match the vendor name.

    2. product(Mandatory) Regular expression to match the product name.

    3. revisionRegular expression to match the product revision.

    4. product_blacklistProducts with given vendor matching string is blacklisted.

    5. alias_prefixThe user_friendly name to use for this device type, instead of
    the default "multipath".

    6. hardware_handlerThe handler to use for this device type. The following hardware
    handler are implemented:


    +   - 1 emc - (Hardware-dependent) Hardware handler for DGC class arrays as CLariION
    CX/AX and EMC VN and Unity families.

    - 1 rdac - (Hardware-dependent) Hardware handler for LSI / Ingenio / NetApp RDAC
    class as NetApp SAN E/F Series, and OEM arrays from IBM DELL SGI STK and SUN.

    - 1 hp_sw - (Hardware-dependent) Hardware handler for HP/COMPAQ/DEC BSG80 and
    MSA/HSV arrays with Active/Standby mode exclusively.

    - 1 alua - (Hardware-dependent) Hardware handler for SCSI-3 ALUA compatible arrays.

    - 1 ana - (Hardware-dependent) Hardware handler for NVME ANA arrays.


    The following attributes are optional: if not set the default values are taken
