    # SSSD and KDC spoofing


    When using SSSD to manage kerberos logins on a Linux host, this is an attack scenario
    you should be aware of: KDC spoofing.


    The objective of the attacker is to login on a workstation that is using Kerberos
    authentication. Let''s say he knows john is a valid user on that machine.


    The attacker deploys a rogue KDC server in the network, and creates the john principal
    there with a password of his choice. What he has to do now to have his rogue KDC
    respond to the login request from the workstation, before (or instead of the real
    KDC). If the workstation isn''t authenticating the KDC, it will accept the reply
    from the rogue server and let john in.'
