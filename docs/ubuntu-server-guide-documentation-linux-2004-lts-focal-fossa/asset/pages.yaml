    \ Files\n\nYou can skip the whole section of the following manual setup instruction\
    \ by using this non-official tool. The tool will setup your TFTP server to serve\
    \ files for netbooting.\n\n# Necessary Files\n\nThere are several files needed\
    \ for this process. The following files are needed:\n\n+   * Ubuntu live image\n\
    \    - For arm64 architecture, its name has a -arm64 suffix. For example, ubuntu-20.04.1-live-server-arm64.iso.\n\
    \    - For amd64 architecture, its name has a -amd64 suffix. For example, ubuntu-20.04.1-live-server-amd64.iso.\n\
    * grub binary (and the corresponding grub.cfg, which is a txt file)\n    - For\
