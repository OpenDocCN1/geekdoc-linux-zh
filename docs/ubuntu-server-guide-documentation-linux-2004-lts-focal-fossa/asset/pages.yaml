    ```


    # Check SSL setup on the client


    The client must be able to use START_TLS when connecting to the LDAP server, with
    full certificate checking. This means:


    +   - the client host knows and trusts the CA that signed the LDAP server certificate

    - the server certificate was issued for the correct host (ldap01.example.com in
    this guide)

    - the time is correct on all hosts performing the TLS connection

    - and, of course, neither certificate (CA or server''s) expired'
