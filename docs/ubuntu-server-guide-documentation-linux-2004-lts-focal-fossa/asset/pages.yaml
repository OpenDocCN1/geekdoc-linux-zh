    # DPDK Device configuration


    The package dpdk provides init scripts that ease configuration of device assignment
    and huge pages. It makes them persistent across reboots.


    The following is an example of the file /etc/dpdk/interfaces configuring two ports
    of a network card. One with uio_pci_generic and the other with vfo-pci.


    ```

    # <bus> Currently "pci" is supported

    # <id> Device ID on the specified bus

    # <driver> Driver to bind again (vfo-pci or uio_pci_generic)

    #

    # Be aware that the two DPDK compatible drivers uio_pci_generic and vfo-pci are

    # part of linux-image-extra-<VERSION> package.

    # This package is not always installed by default - for example in cloud-images.

    # So please install it in case you are running into module issues.

    # <bus> <id>

    pci 0000:04:00.0 uio_pci_generic

    pci 0000:04:00.1 vfo-pci

    ```


    Cards are identified by their PCI-ID. If you are unsure you might use the tool
    dpdk_nic_bind.py to show the current available devices and the drivers they are
    assigned to.


    ```

    dpdk_nic_bind.py --status

    ```


    Network devices using DPDK-compatible drivers


    ```

    0000:04:00.0 ''Ethernet Controller 10-Gigabit X540-AT2'' drv=uio_pci_generic

    unused=ixgbe

    0000:02:00.0 ''Xtreme BCM5719 Gigabit Ethernet PCIe'' if=eth0 drv=tg3 unused=

    uio_pci_generic *Active*

    0000:02:00.1 ''Xtreme BCM5719 Gigabit Ethernet PCIe'' if=eth1 drv=tg3 unused=

