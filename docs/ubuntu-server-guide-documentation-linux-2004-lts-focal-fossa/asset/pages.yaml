  md: '# Share Security


    There are several options available to increase the security for each individual
    shared directory. Using the `/share/` example, this section will cover some common
    options.


    # Groups


    Groups define a collection of computers or users who have a common level of access
    to particular network resources and offer a level of granularity in controlling
    access to such resources. For example, a group is defined and contains the users
    `freda`, `danika`, and `rob` and a second group `support` is defined and consists
    of users `danika`, `jeremy`, and `vincent` then network resources configured to
    allow access by the group will subsequently enable access by `freda`, `danika`,
    and `rob`, but not jeremy or vincent. Since the user `danika` belongs to both
    the `qa` and `support` groups, she will be able to access resources configured
    for both groups, whereas all other users will only have access to resources limiting
    the group they are part of.


    By default Samba looks for the local system groups defined in `/etc/group` to
    determine which users belong to which groups. For more information on adding and
    removing users from groups see.


    When defining groups in the Samba configuration file, `/etc/samba/smb.conf`, the
    recognized syntax is to prefix the group name with an “@” symbol. For example,
    if you wished to define a group named `sysadmin` in a section of the `/etc/samba/smb.conf`
    file, you would do so by entering the group name as `@sysadmin`.


    # File Permissions


    File Permissions define the rights a computer or user has to a particular directory,
    or set of files. Permissions may be defined by editing the `/etc/samba/smb.conf`
    file and specifying the explicit permissions of the defined file.


    For example, if you have defined a shared group `share` and wished to give `read-only`
    permissions to the group of users known as `qa`, but wanted to allow writing to
    the group called `sysadmin` and the user named `vincent`, then you could edit
    the `/etc/samba/smb.conf` file, and add the following entries under `/share/`
    entry:


    ```

    read list = @qa

    write list = @sysadmin, vincent

    ```


    Another possible Samba permission is to declare administrative permissions to
    a particular shared resource. Users having administrative permissions may deny
    read, write, or modify any information contained in the resource the user has
    given explicit administrative permissions to.


    For example, if you wanted to give the user `melissa` administrative permissions
    to the `share` example, you would edit the `/etc/samba/smb.conf` file, and add
    the following line under `/share/` entry:


    ```

    admin users = melissa

    ```


    After editing /etc/samba/smb.conf, restart Samba for the changes to take effect:


    ```

    sudo systemctl restart smbd.service nmbid.service

    ```


    # Note


    For the read list and write list to work the Samba security mode must not be set
    to security = share'
