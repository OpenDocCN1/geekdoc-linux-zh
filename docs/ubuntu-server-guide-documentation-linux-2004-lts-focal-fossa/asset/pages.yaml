    # Qemu


    Qemu is a emulator that can run operating systems and programs for one machine
    on a different machine. Mostly it is not used as emulator but as virtualizer in
    collaboration with KVM kernel components. In that case it utilizes the virtualization
    technology of the hardware to visualize guests.


    While qemu has a command line interface and a monitor to interact with running
    guests this is rarely used for other than development purposes. Libvirt provides
    an abstraction from specific versions and hypervisors and encapsulates some workarounds
    and best practices.


    # Running Qemu/KVM


    While there are many more friendly and comfortable ways, with the command below
    is probably the quickest way to see Ubuntu moving on screen is running it from
    the netboot iso.


    > **Warning:** this is just for illustration - not generally recommended without
    verifying the check-sums; Multipass and UVTool are much better ways to get actual
    guests easily.


    Run:


    ```

    sudo qemu-system-x86_64 --enable-kvm --cdrom http://archive.ubuntu.com/ubuntu/dists/bionic/main/installer-amd64/images/netboot/mini.iso

