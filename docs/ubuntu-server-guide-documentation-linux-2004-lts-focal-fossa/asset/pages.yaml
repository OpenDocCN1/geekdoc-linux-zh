  md: '# Ubuntu Server Guide


    Welcome to the Ubuntu Server Guide! This site includes information on using Ubuntu
    Server for the latest LTS release, Ubuntu 20.04 LTS (Focal Fossa). For an offline
    version as well as versions for previous releases see below.


    # Improving the Documentation


    If you find any errors or have suggestions for improvements to pages, please use
    the link at the bottom of each topic titled: "Help improve this document in the
    forum." This link will take you to the Server Discourse forum for the specific
    page you are viewing. There you share your comments or let us know about bugs
    with any page.


    # PDFs and Previous Releases


    Below are links to the previous Ubuntu Server release server guides as well as
    an offline copy of the current version of this:


    Ubuntu 20.04 LTS (Focal Fossa): PDF Ubuntu 18.04 LTS (Bionic Beaver): Web and
    PDF Ubuntu 16.04 LTS (Xenial Xerus): Web and PDF


    # Support


    There are a couple of ways that the Ubuntu Server edition is supported: commercial
    support and community support. The main commercial support (and development funding)
    is available from Canonical, Ltd. They reasonably- priced support contracts on
    a desktop or per-server basis. For more information see the Ubuntu Advantage page.


    Community support is also provided by dedicated individuals and companies that
    wish to make Ubuntu the best distribution possible. Support is provided through
    multiple mailing lists, IRC channels, blogs, wikis, etc. The large amount of information
    available can be overwhelming, a good search engine query can usually provide
    an answer to your questions. The Ubuntu Support page for more information.


    # Basic installation


    This chapter provides an overview of installing Ubuntu 20.04 Server Edition. There
    is more detailed documentation on other installer topics.


    # Preparing to Install


    This section explains various aspects to consider before starting the installation.


    # System requirements


    Ubuntu 20.04 Server Edition provides a common, minimalist base for a variety of
    server applications, such as file/print services, web hosting, email hosting,
    etc. This version supports four 64-bit architectures:


    +   - amd64 (Intel/AMD 64-bit)'
  merge: -1
  pgno: 0
- img_proc: true
  md: '+   * arm64 (64-bit ARM)

    * ppc64el (POWER8 AND POWER9)

    * s390x (IBM Z and LinuxONE)


    The recommended system requirements are:


    +   * CPU: 1 gigahertz or better

    * RAM: 1 gigabyte or more

    * Disk: a minimum of 2.5 gigabytes


    # Server and Desktop Differences


    The Ubuntu Edition and the Ubuntu Desktop Edition use the same apt repositories,
    making it just as easy to install a server application on the Desktop Edition
    as on the Server Edition.


    One major difference is that the graphical environment used for the Desktop Edition
    is not installed on the Server. This includes the graphics server itself, the
    graphical utilities and applications, and the various user-supporting services
    needed by desktop users.


    # Backing Up


    Before installing Ubuntu Server you should make sure all data on the system is
    backed up.


    If this is not the first operating system has been installed on your computer,
    it is likely you will need to re-partition your disk to make room for Ubuntu.


    Any time you partition your disk, you should be prepared to lose everything on
    the disk should you make a mistake or something goes wrong during partitioning.
    The programs used in install are quite reliable, most have seen years of use,
    but they also perform destructive actions.


    # Preparing install media


    There are platform specific step-by-step examples for s390x LPAR, z/VM and ppc64el
    installations.


    For amd64, download the install image from https://releases.ubuntu.com/20.04.


    There are many ways to boot the installer but the simplest and safest way is to
    create a bootable stick to the system to be installed with (tutorials for other
    operating systems are also available).


    # Booting the installer


    Plug the USB stick into the system to be installed and start it.


    Most computers will automatically boot from USB or DVD, in some cases this is
    disabled to improve boot times. If you do not see the message and "Welcome" screen
    should appear after it, you will need to set your computer to boot from the install
    media.


    There should be an on-screen message when the computer starts telling you what
    key to press for settings or a boot menu. Depending on the manufacturer, this
    could be Escape, F2,F10 or F12. Simply restart your computer and hold down this
    key until the boot menu appears, then select the drive with the Ubuntu media


    If you are still having problems, check out the Ubuntu Community documentation
    on booting from CD/DVD.


    After a few moments, the installer will start in its language selection screen.'
