  md: "+   - Reboot a virtual machine:\n  - virsh reboot <username>\n\n+   - The *state*\
    \ of virtual machines can be saved to a file in order be restored later. The following\
    \ will save the virtual machine state into a file named according to the date:\n\
    \  - virsh save <username> save-my.state\n\n+   - Once the virtual machine will\
    \ no longer be running.\n\n+   - A saved virtual machine can be restored using:\n\
    \  - virsh restore save-my.state\n\n+   - To shutdown a virtual machine do:\n\
    \  - virsh shutdown <username>\n\n+   - A CDROM device can be mounted in a virtual\
    \ machine by entering:\n  - virsh attach-disk <username> /dev/cdrom /media/cdrom\n\
    \n+   - To change the definition of a virtual guest exposes the domain\n  - virsh\
    \ edit <username>\n\nThat will allow one to edit the XML representation that defines\
    \ the guest and when saving it will apply format and integrity checks on these\
    \ definitions.\n\nEditing the XML directly is certainly the most powerful, but\
    \ also the most complex one. Tools like Virtual Machine Manager / Viewer can have\
    \ inexperienced users to do of the common tasks.\n\nIf virsh (or other vir* tools)\
    \ shall connect to something else than the default qemu-kvm/system hypervisor\
    \ one can find alternatives for the connect option in man virsh or libvirt doc\n\
    \n# system and session scope\n\nVir - as well as other tools to manage virtualization\
    \ - can be passed connection strings.\n\nThere are two options for the connection.\n\
    \n+   - qemu://system - connect locally as the daemon supporting QEMU and KVM\
    \ domains\n- qemu://session - connect locally as a normal to his own set of QEMU\
    \ and KVM domains\n\nThe default was (and still is) qemu://system as that the\
    \ behavior users are used to. But there are a few benefits (and drawbacks) to\
    \ qemu://session to consider.\n\nqemu://session is per user and can connect on\
    \ a multi-user system used to separate the people. But importantly things run\
    \ under the permissions of the user which means no struggle on the just downloaded\
    \ image in your HOME or the attached USB-stick. On the other hand it can access\
    \ system resources that well, which includes network setup that is known to have\
    \ qemu://session. It fails back to slip networking which is functional but slow\
    \ makes it impossible to reach from other systems.\n\nqemu://session is different\
    \ in that it is run by the global system which libvirt can provide resources as\
    \ needed. But you might need to move and/or files to the right permissions to\
    \ have them usable.\n\nApplications usually will decide on their primary use-case.\
    \ Desktop-centric applications often choose qemu://session which solutions that\
    \ implement an administrator anyway to continue to qemu://system.\n\nRead more\
    \ about the libvirt FAQ and this blog about the topic."
