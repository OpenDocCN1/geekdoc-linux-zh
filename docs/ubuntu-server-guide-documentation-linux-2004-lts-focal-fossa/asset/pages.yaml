    \ '0' prio=50 status=enabled\n    |-- 0:0:2 sdd 8:48 active running\n```\n\nMake\
    \ sure to run resize2fs /dev/multipath to revive the filesystem.\n\n# Moving Root\
    \ File System from a Single Path to a Multipath Device\n\nThis is dramatically\
    \ simplified by using the UUIDs of WWIDs to identify as an intrinsic link. Simply\
    \ install multipath-tools-boot and reboot. This will rebuild the initial ramdisk\
    \ and multipath the opportunity to build it's root filesystem by mounted UUID.\n\
    \n# Note\n\nWhenever multipath is updated, follow the initrd by executing:\nupdate-initramfs\
    \ -u -k all\nThe reason behind multipath is copied to the ramdisk and is integral\
    \ to determining the available devices to map it via blacklist and devices sections.\n\
    \n# The Multipath Daemon\n\nIf you have trouble implementing a multipath configuration,\
    \ you should ensure the multipath daemon is running as described in Device Mapper\
    \ Multipath Setup. The multipath daemon must be running in order to use** multipath**.\n\
    \n# Multipath Command Output\n\nWhen you create, modify, or list a multipath device,\
    \ you get a printout of the current device setup. The following is as follows\
    \ for each multipath device:\naction_if= alias (uuid_different from alias) device_name\
    \ if_known vendor,product\nsize=size=features='features' hwwander='hardware_handler'\
    \ wp=write_permission_if_known\nFor each path:\n+- policy=scheduling_policy_prio_if_status=group_status_if_known\n\
    For each path:\n+- channel:id: major dm_status status if_known path_status online_status\n\
    For example, the output of a multipath command might appear as follows:\nmultipath\
    \ (360014056eeceec6e1164b595096482) dm-0 LIO-ORG,lun01 size=2.0G features='0'\
    \ hwwander\n='1 ' alua ' wp=rw |+- policy=service-time '0' prio=50 status=active|-\
    \ 7:0:0.1 sd 8:64 active running"
