  md: '# DPDK KVM Guests


    If you have no access to DPDK supported network cards you can still work with
    DPDK by using its support for virtio. To do so you have to create guests backed
    by hugepages (see above).


    On top of that it is required to have at least SSE3. The default CPU model qemu/libvirt
    uses only up to SSE2. So you will have to define a model that passed the proper
    feature flags (or use host-passthrough). An example can be found in snippet to
    your virt xml (or the equivalent virt interface you use).


    ```

    <cpu mode="host-passthrough">

    ```


    Also virtio nowadays supports multique which DPDK in turn can exploit for better
    speed. To modify a normal virtio definition to have multiple queues add the following
    to your interface definition. This is about enhancing a normal virtio nic to have
    multiple queues, to later be on consumed e.g. by DPDK in the guest.


    ```

    <driver name="vhost" queues="4/>

    ```


    # Use DPDK


    Since DPDK on its own is (massive) library you most likely might like to continue
    on OpenSwitch-DPDK as an example to put it to use.


    # Resources


    +   - DPDK Documentation

    - Release Notes marking the version packages in Ubuntu 16.04

    - Linux DPDK User Getting Started

    - EAL Command-line Options

    - DPDK Api Documentation

    - OpenSwitch DPDK installation

    - Wikipedias definition of DPDK


    # OpenSwitch-DPDK


    With DPDK just a library it does not have a lot on its, so it depends on emerging
    projects making use of it. One consumer of the library that is part of Ubuntu
    is OpenSwitch with DPDK in the package openswitch-switch-dpdk.


    Here an example how to install and configure a basic OpenSwitch using DPDK for
    later use via libvirt/qemu-


    ```

    sudo apt-get install openswitch-switch-dpdk

    sudo update-alternatives --set ovs-vswitchd /usr/lib/openswitch-switch-dpdk/

    ovs-vswitchd-dpdk

    ovs-vsctl set OpenSwitch "other_config:dpdk-init=true"

    # run on core 0

    ovs-vsctl set OpenSwitch "other_config:dpdk-lcore-mask=0x1"

    # Allocate 2G huge pages (not Numa node aware)

    ovs-vsctl set OpenSwitch "other_config:dpdk-alloc-mem=2048"

    # list to one whitelisted device

    ```'
