    user@workstation~$ sudo mount -o loop ubuntu-20.04.1-live-server-s390x.\niso iso\n\
    user@workstation~$ ls -1 /iso/boot/*ubuntu.exec,parmfile.*,kernel.u*,\ninitrd.u*\\\
    \n./iso/boot/initrd.ubuntu\n./iso/boot/kernel.ubuntu\n./iso/boot/parmfile.ubuntu\n\
    ./iso/boot/ubuntu.exec\nuser@workstation:~$\n```\n\n+   * Now transfer these files\
    \ to your z/VM guest (for example to its 'A' file mode), using either the 3270\
    \ terminal emulator or ftp.\n* Then log on to your z/VM guest that you want to\
    \ use for the installation, in this example it will be '10.222.111.24'\n* And\
