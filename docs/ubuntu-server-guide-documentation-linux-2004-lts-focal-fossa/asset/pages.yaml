    and other architectures from http://cdimage.ubuntu.com/rele/20.04/release/


    Installer images are made (approximately) daily and are available from http://cdimage.ubuntu.com/ubuntu-server/daily-live/current/.
    These are not extensively tested as the images from release day, but they contain
    the latest packages and fewer updates will be required after installation.


    # Installer UI generics


    In general, the installer can be used with the down and arrow space or enter keys
    and a little typing. Tab and shift-tab move the focus up and down respectively.
    Home / End / Page Up / Page Down can be used to navigate through long lists more
    quickly in the usual way.'
