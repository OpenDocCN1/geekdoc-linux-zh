  md: '# apache2 Settings


    This section explains some apache2 daemon configuration settings.


    **LockFile** - The LockFile directive sets the path to the lockfile used when
    the server is compiled with either USE_FCNTL_SERIALIZED_ACCEPT or USE_FLOCK_SERIALIZED_ACCEPT.
    It must be stored on the local disk. It should be left to the default value unless
    the logs directory is located on an NFS share. If this is the case, the default
    value should be changed to a location on the local disk and to a directory that
    is read-only by root.


    **PidFile** - The PidFile directive sets the file in which the server records
    its process ID (pid). This file should only be readable by root. In most cases,
    it should be left to the default value.


    **User** - The User directive sets the userid by the server to answer requests.
    This setting determines the server''s access. Any files accessible to this user
    will be inaccessible to your website''s visitors. The default value for User is
    “www-data".


    **Warning**


    Unless you know exactly what you are doing, do not set the User directive to root.
    Using as the User will create large security holes for your Web server.


    **Group** - The Group directive is similar to the User directive. Group sets set
    the group under which the server will answer requests. The default group is “www-data".


    # Apache2 Modules


    Apache2 is a modular server. This implies that only the most basic functionality
    is included in the server. Extended features are available through modules which
    can be loaded into Apache2. By default, a base of modules is included at compile-time.
    If the server is compiled to use dynamically loaded modules, modules can be compiled
    separately, and added at any time using the LoadModule directive. Otherwise, Apache2
    must be recompiled to add or remove modules.


    Ubuntu allows the dynamic loading of modules. Configuration directives be conditionally
    included on the presence of a particular module by enclosing them in an `<IfModule>`
    block.


    You can install additional Apache2 modules and use them with your Web server.
    For example, run the following command at a terminal prompt to install the Python
    3 WSGI module:


    ```

    sudo apt install apache2-mod-wsgi-py3

    ```


    The installation will enable the module automatically, but we can disable it with
    a2dismod:


    ```

    sudo systemctl restart apache2.service

    ```


    And then use the a2mod to re-enable it:


    ```

    sudo a2mod wsgi

    sudo systemctl restart apache2.service

    ```


    See the /etc/apache2/mods-available for additional modules already available on
    your system.


    # HTTPS Configuration


    The mod_ssl module adds an important feature to the Apache2 server - the ability
    to encrypt communication. Thus, when your browser is communicating with SSL, the
    https:// prefix is used at the beginning of the Uniform Resource Locator (URL)
    in the browser navigation bar.'
  merge: -1
  pgno: 252
- img_proc: true
  md: 'The mod_ssl module is available in apache-common package. Execute the following
    command at a terminal

    prompt to enable the mod_ssl module:


    sudo aenmod ssl


    There is a HTTPS configuration file in /etc/apache2/sites-available/default-ssl.conf.
    In order for

    Apache to provide HTTPS, a certificate and key file are also needed. The default
    HTTPS configuration

    will use a certificate and key generated by the ssl-cert package. For testing,
    the auto-

    generated certificate and key should be replaced by a certificate specific to
    the site or server. For information

    on on generating a key and obtaining a certificate see Certificates.


    To configure Apache for HTTPS, enter the following:


    sudo a2ensite default-ssl


    # Note


    The directories /etc/ssl/certs and /etc/ssl/private are the default locations.
    If you install the

    certificate and key in any other directory make sure change SSLCertificateFile
    and SSLCertifi-

    cKeyFile appropriately.


    With Apache now configured for HTTPS, restart the service to enable the new settings:


    ```

    sudo systemctl restart apache2.service

    ```


    # Note


    Depending on how you have obtained your certificate you may need to enter a passphrase
    when

    Apache2 starts.


    You can access the secure server pages by typing https://your_hostname/url/ in
    your browser address bar.


    # Sharing Write Permission


    For more than one user is able to write to the same directory it will be necessary
    to grant write permission

    to a group they share in common. The following example granted write permission
    to /var/www/html

    to the group "webmasters",


    ```

    sudo chown -R webmasters /var/www/html

    sudo chmod -R g=wx /var/www/html/

    ```


    These commands recursively set the group permission on all files and directories
    in /var/www/html to allow

    reading, writing and searching of directories. Many admins find this useful for
    allowing multiple users to

    edit files in a directory tree.


    # Warning


    The Apache2 daemon runs as the www—data user, which has a corresponding www—data

    group. These should not be granted write access to the document root, as this
    would mean that

    vulnerabilities in Apache or the applications it is serving allow attackers to
    overwrite the

    served content.


    # References


    +   - Apache Documentation contains details in information on Apache configuration
    directives. Also, see the apache-2-doc package for the official Apache docs.

    - O’Reilly’s Apache Cookbook is a good resource for accomplishing specific Apache2
    configurations.

    - For Ubuntu specific Apache2 questions, ask in the #ubuntu-server IRC channel
    on freenode.net.'
  merge: -1
