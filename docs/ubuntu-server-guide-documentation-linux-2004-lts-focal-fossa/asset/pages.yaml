    Change the values to match your environment.


    # Note


    The smb.conf as by the package is quite long and has many configuration examples.
    An easy way to visualize it without any comments is to run testparam -s.


    Now inform Samba about the rootDN user''s password (the one set during the installation
    of the slapd package):


    ```

    sudo smbpasswd -W

    ```


    As a final step to have your LDAP users be able to connect to samba and authenticate,
    we need these to also show up in the system as "unix" users. Use SSSD for that
    detailed in Service - SSSD.


    Install ssd-ldap


    ```

    sudo apt install ssd-ldap

    ```


    Configure /etc/sssd/sssd.conf:


    ```

    [sssd]

    config_file_version = 2

    domain = example.com


    [domain/example.com]

    id_provider = ldap

    auth_provider = ldap

    ldap_uri = ldap://ldap01.example.com

    cache_credentials = True

    ldap_search_base = dc=example,dc=com

    ```


    Adjust permissions and start the service:


    ```

    sudo chmod 0600 /etc/sssd/sssd.conf

    sudo chown root:/etc/sssd/sssd.conf

    sudo systemctl start sssd

    ```


    Restart the Samba services:


    ```

    sudo systemctl restart smbd.service nmbd.service

    ```


    To quickly test the setup, see if getent can list the Samba groups:


    ```

    $ getent group Replicators

    Replicators*:552:

    ```


