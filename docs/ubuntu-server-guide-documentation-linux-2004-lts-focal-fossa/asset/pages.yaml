    # Certification Authority


    If the services on your network require more than a few self-signed certificates
    it may be worth the effort to set up your own Certification Authority (CA). Using
    certificates signed by your own CA, allows the various services using the certificates
    to easily trust other services using certificates issued from the same CA.


    First, create the directories to hold the CA certificate and related files:


    ```

    sudo mkdir /etc/ssl/CA

    sudo mkdir /etc/ssl/newcerts

    ```


    The CA needs a few additional files to operate, one keep track of the last serial
    number, and another file to record which certificates have been issued:


    ```

    sudo sh -c "echo ''01'' > /etc/ssl/CA/serial"

    sudo touch /etc/ssl/CA/index.txt

    ```


    The third file is a CA configuration file. Though not strictly necessary, it is
    very convenient when issuing multiple certificates. Edit /etc/ssl/openssl.cnf,
    if / CA_default change:


    ```

    dir = /etc/ssl/ # Where everything is kept

    database = $dir/CA/index.txt # database index file

    cificate = $dir/certs/cacert.pem # The CA certificate

    serial = $dir/CA/serial # The current serial number

    rivate_key = $dir/private/cakey.pem# The private key

    ```


    Next, create the self-signed root certificate:


    ```

    openssl req -new x509 -extensions v3_ca -keyout cakey.pem -out cacert.pem

    days 3650

    ```


    You will be asked for details about the certificate:


    Now install the root certificate and key:


    ```

    sudo mv cakey.pem /etc/ssl/private/

    sudo mv cacert.pem /etc/ssl/certs/

    ```


    You are now to start signing certificates. The first item needed is a Certificate
    Signing Request (CSR), for Generating a Certificate Signing Request (CSR) for
    starts. Once you have a CSR, enter the following to generate a certificate signed
    by the CA:


    ```

    openssl ca -in server.csr --config /etc/ssl/openssl.cnf

    ```


    After entering the password for the CA key, you will be prompted to sign the certificate,
    and again to commit the new certificate. There should then see a large amount
    of output related to the certificate creation. Copy and paste everything between
    the line: -----BEGIN CERTIFICATE----- and /etc/ssl/newcerts/01.pem, containing
    the same output. through the line: -----END CERTIFICATE----- to a file named after
    the hostname of the server where the certificate will be installed. For example
    example.example.com,crt, is a nice descriptive name.

    Subsequent certificates will be named 02.pem, 03.pem, etc.'
