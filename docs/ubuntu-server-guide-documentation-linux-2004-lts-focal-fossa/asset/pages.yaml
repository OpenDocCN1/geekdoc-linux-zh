  md: "Several config keys are lists of commands to be executed. Each command can\
    \ be a string (in which case it is executed via \"sh -c\") or a list, in which\
    \ case it is executed directly. Any command exiting with a non-zero return code\
    \ is considered an error and aborts the install (except for error-commands, where\
    \ it is ignored).\n\n# # Top-level keys\n\n## version\n\n**type:** integer default:\
    \ no default\n\nA future-proofing config file version field. Currently this must\
    \ be \"1\".\n\n## interactive-sections\n\n**type:** list of strings default: []\n\
    \nA list of config keys to show still in the UI. So for example:\n\n```\nversion:\
    \ 1\ninteractive-sections:\n  - network\nidentity:\n  username: ubuntu\n  password:\
    \ $encrypted_pass\n```\n\nWould stop on the network screen and allow the user\
    \ to change the defaults. If a value is provided for an interactive section it\
    \ is used as the default.\n\nYou can use the special section name of \"*\" to\
    \ indicate that the installer should ask all the usual questions - in this case\
    \ the autoinstall yaml file is not really an \"autoinstall\" file at all, instead\
    \ just a way to change the defaults in the UI.\n\nNot all config keys correspond\
    \ to screens in the UI. This documentation indicates if a given section is interactive\
    \ or not.\n\nIf there are any interactive sections at all, the reporting is ignored.\n\
    \n## early-commands\n\n**type:** command default: no commands **interactive:**\
    \ no\n\nA list of shell commands to invoke as soon as the installer starts, in\
    \ particular probing for block and network devices. The autoinstall config is\
    \ available at /autoinstall.yaml (irrespective of how it was provided) and the\
    \ file will be re-read after the early-commands have run to alter the config\n\
    \n## locale\n\n**type:** string default: en_US.UTF-8 **can be interactive:** yes,\
    \ always interactive if any section is\n\nThe locale to configure for the installed\
    \ system.\n\n## refresh-installer\n\n**type:** mapping default: see below **can\
    \ be interactive:** yes\n\nControls whether the installer updates to a new version\
    \ available in the given channel before continuing.\n\nThe mapping keys keys:"
