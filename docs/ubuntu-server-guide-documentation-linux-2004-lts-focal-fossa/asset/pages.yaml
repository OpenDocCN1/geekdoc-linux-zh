  md: 'The Ubuntu Wiki Samba page.


    # Samba File and Print Server


    # Samba Security Modes


    There are two security levels available to the Common Internet Filesystem (CIFS)
    network protocol user-level and share-level. Samba''s security mode implementation
    allows more flexibility, providing four ways of implementing user-level security
    and one way to implement share-level:


    +   * security = user: requires clients to supply a username and password to connect
    to shares. Samba user accounts are separate from system accounts, but the libpam-winbind
    package will sync system users and passwords with the Samba user database.

    * security = domain: this mode allows the Samba server to appear to Windows clients
    as a Primary Domain Controller (PDC), Backup Domain Controller (BDC), or a Domain
    Member Server (DMS). See As a Domain Controller for further information.

    * security = ADS: allows the Samba server to join an Active Directory domain as
    a native member. See Active Directory Integration for details.

    * security = server: this is left over from before Samba could become a member
    server, and due to some security issues should not be used. See the Server Security
    section of the Samba guide for more details.

    * security = share: allows clients to connect to shares without supplying a username
    and password.


    The security mode you choose will depend on your environment and what you need
    the Samba server to accomplish.


    # Security = User


    This section will reconfigure the Samba file and printer server, from File Server
    and Print Server, to require authentication.


    First, install the libpam-winbind package which will sync the system users to
    the Samba user database:


    ```

    sudo apt install libpam-winbind

    ```


    > Note

    If you choose the Samba Server task during installation libpam-winbind is already
    installed.

    Edit /etc/samba/smb.conf, and in the [share] section change:


    guest ok = no


    Finally, restart Samba for the new settings to take effect:

    systemctl restart smbd.service nmbd.service


    Now when connecting to the shared directories or printers you will be prompted
    for a username and password.


    > Note

    If you choose to map a network drive to the share you can check the "Reconnect
    on Logon" check box, which will require you to only enter the username and password
    once, at least until the password changes.'
