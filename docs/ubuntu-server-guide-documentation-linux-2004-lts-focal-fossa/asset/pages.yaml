  md: "# Migration\n\nThere are different types of migration available depending on\
    \ the versions of libvirt and the hypervisor being used. In general those types\
    \ are:\n\n+   - offline migration\n- live migration\n- postcopy migration\n\n\
    There are various options to those methods, but the entry point for all of them\
    \ is `virsh migrate`. Read the integrated help for more detail.\n\n```\nvirsh\
    \ migrate —help\n```\n\nSome useful documentation on constraints and considerations\
    \ about live migration can be found at the Ubuntu Wiki\n\n# Device Passthrough\
    \ / Hotplug\n\nIf instead of the device hotplugging you want to always pass through\
    \ a device add the xml content of the device to your static guest xml representation\
    \ via e.g. virsh edit `<hostname>`. In that case you don't need to use `attach/detach`.\
    \ There are different kinds of passthrough. Types available to depend on your\
    \ Hardware and software setup.\n\n+   - USB hotplug/passthrough\n- VF hotplug/Passthrough\n\
    \nBut both kinds are handled in a very similar way and there are various ways\
    \ to do it (e.g. also qemu monitor) driving such a change via libvirt is recommended.\
    \ That libvirt can try to manage all sorts of special cases for you and also masks\
    \ version differences.\n\nIn general when hotplug via libvirt you create a snippet\
    \ that describes the device just as you would do in a static guest description.\
    \ A usb device is usually identified by Vendor/Product id's:\n\n```\n<hostdev\
