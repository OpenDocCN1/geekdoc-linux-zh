  md: '# Running the installer over serial


    By default, the installer runs on the first virtual terminal, tty1. This what
    is displayed on an connected monitor by default. Clearly though, servers do not
    have a monitor. Some out-of-band management systems provide a remote virtual terminal,
    but some times it is necessary to run the installer on the serial port. To do
    this, the kernel command line needs an appropriate console specified on it - a
    common value istty0 but this is not something that can be generated.


    When running on serial, the installer starts in a basic mode that does using only
    the ASCII character set black and white colours. If you are connecting from a
    terminal emulator such as gnome-terminal that supports unicode and rich colours
    you can switch to "rich mode" which uses unicode, colours and supports many languages.


    # ## Connecting to the installer over SSH


    If the only available is very basic, an alternative is to connect via SSH. If
    the network is up by the time the installer starts, instructions are offered on
    the initial screen in basic mode. Otherwise, instructions are available from the
    help menu once network is configured.


    In addition, connecting to SSH is assumed to be capable of displaying all unicode
    characters, enabling more translations to be used than can be displayed on a virtual
    terminal.


    # Help menu


    The help menu is always in the top of the right. It contains help, both general
    and for the currently displayed screen, and some general actions.


    # Switching to a shell prompt


    You can switch to a shell at any time by selecting "Enter shell" from the help
    menu, or pressing Control-Z or F2.


    If you are accessing the installer via tty1, you can also access a shell by switching
    to a different virtual terminal (control-alt-arrow or control-alt-number keys
    move between virtual terminals).


    # Global keys


    There are some global keys you can press at any time:


    | Key | Action |

    | ESC | go back |

    | F1 | open help menu |

    | Control-Z, F2 | switch to shell |

    | Control-L, F3 | redraw screen |

    | Control-T, F4 | toggle rich mode (colour, unicode) and on off |


    # Using the installer step by step


    The installer is designed to be easy to use without constant reference to documentation.'
  merge: -1
