  md: '+   - See the Ubuntu Wiki page for more information.


    # # Data Plane Development Kit


    DPDK is a set of libraries and drivers for fast packet processing and runs mostly
    in Linux userland. It is a set of libraries that provide the so called “Environment
    Abstraction Layer” (EAL). The EAL hides the details of the environment and provides
    a standard programming interface. Common use cases are around specialized solutions
    for instance network function virtualization and advanced high-throughput network
    switches. The DPDK uses a run-to-completion model for fast data plane performance
    and accesses devices via polling to eliminate the latency of interrupt processing
    at the tradeoff of higher cpu consumption. It was designed to run on any processors.
    The first supported CPU was Intel x86 and it is now extended to IBM PPC64 and
    ARM64.


    Ubuntu provides some infrastructure to ease DPDK usability.


    # # Prerequisites


    This package is compiled for the lowest possible CPU requirements allowed by upstream.
    Starting with DPDK 17.08 it requires at at least SSE4_2 and anything else activated
    by -march=corei7 (in gcc) to be supported by the CPU.


    The list of upstream DPDK supported network cards are found at NICs. A lot of
    those are disabled in the upstream Project as they are not yet in a stable state.
    The subset of network cards that DPDK has enabled in the package as in Ubuntu
    16.04 is:


    DPDK has “userspace” drivers for the called PMDs. The packages for these follow
    the pattern of librte-<pund-<<version>. The example for intel e1000 in 18.11 is
    librte-pund-e1000-18.11.


    The more commonly used, tested and fully supported drivers are installed as dependencies
    of DPDK. But there are many ways in universe that follow the same naming pattern.


    # # Unassigning the default Kernel drivers


    Cards have to unassigned from their kernel driver and instead be assigned to uio_pci_generic
    of vfio-pci. uio_pci_generic is older and usually getting to work more easily,
    but also has less features and isolation.


    The newer vfio-pci requires that you activate the following kernel parameters
    to enable iommu. iommu=pt intel_iommu=


    Or AMD


    and_iommu-pt


    On top for vfio-pci you then have to configure and assign the iommu groups accordingly.
    That is mostly done in Firmware and by HW layout, you can check the group assignment
    kernel probed in /sys/kernel/iommu_groups/


    > Note: virtue is special, dpdk can directly work on those devices with vio_pci/uio_pci_generic.
    But to avoid issues by kernel and DPDK managing the device you still have to unassign
    the kernel driver.


    Manual configuration and status checks can be done via sysfs or with the tool
    dpdk_nic_bind dpdk_nic_bind.py -help'
