  md: '# Import keys from public keyserver


    These days many users have already ssh keys registered with services like launchpad
    or github. Those can be easily imported with:


    ```

    ssh-import-id <username-on-remote-service>

    ```


    The prefix ip: is implied and means fetching from launchpad, the alternative gh:
    will make the tool fetch from github installed.


    # Two factor authentication with U2F/FIDO


    OpenSSH 8.2 added support for U2F/FIDO hardware authentication devices. These
    devices are used to provide an extra layer of security on top of existing key-based
    authentication, as the hardware token needs to be present for the authentication.


    It''s very simple to set and use. The only extra step is to generate a new keypair
    that can be used by the hardware device. For that, there are two key types that
    can be used: edcdsa-sk and ed25519-sk. The former has hardware support, while
    the latter might need a more recent node.


    For example, use the U2F device to generate a keypair to use it with:


    ```

    ssh-keygen -t edcdsa-sk

    Generating public/private edcdsa-sk key pair.

    You may need to touch your authenticator to authorize key generation. <-

    Enter file in which to save the key (/home/ubuntu/.ssh/edcdsa_sk):

    Enterter passphrase (empty for no passphrase):

    Enter passphrase again:

    Your identification has been saved in /home/ubuntu/.ssh/edcdsa_sk

    Your public key has been saved in /home/ubuntu/.ssh/edcdsa_sk.pub

    Your key fingerprint:

    SHA256:V9FQI1MqaUSFOdXhDqH9Mxb8K3csaYDQLVI9IFRo@focal

    ```


    Now just publish the key to the server to ~/.ssh/authorized_keys and you are ready
    to go:


    ```

    ssh -i ~/.ssh/edcdsa_sk ubuntu@local.server

    Confirm user presence for key EDCDSA-SK SHA256:

    V9FQI1MqaUSFOdXhDqH9Mxb8K3csaYDQLVI9IFRo <- touch device

    Welcome to Ubuntu Focalossa (GNU/Linux 5.4.0-21-generic x86_64)

    (..)

    ubuntu@local:~$

    ```


    # References


    +   * Ubuntu Wiki SSH

    * OpenSSH Website

    * OpenSSH 8.2 release notes

    * Advanced OpenSSH Wiki Page'
