  md: '# Kerberos


    Kerberos is a network authentication system based on the principal of a trusted
    third party. The other two parties being the user and the service user wishes
    to authenticate to. Not all services and applications can use Kerberos, but for
    those that, it brings the network environment one closer to being Single Sign
    On (SSO).


    This section covers installation and configuration of a Kerberos server, and some
    example client configurations.


    # Overview


    If you are new to Kerberos there are a few terms that are good to understand before
    setting up a Kerberos server. Most of the terms will relate to things you may
    be familiar with in other environments:


    +   * Principal: any users, computers, and services provided by servers need to
    be defined as Kerberos Principals.


    +   * Instances: are used for service principals and special administrative principals.


    +   * Realms: the unique realm of control provided by the Kerberos installation.
    Think of it as the domain or group hosts and users belonging to. Convention dictates
    the realm should be in uppercase. default, ubuntu will use the DNS domain converted
    to uppercase (EXAMPLE.COM) as the realm.


    +   * Key Distribution Center: (KDC) consists of three parts: a database of all
    principals, the authentication server, and the ticket granting. For each realm
    there must be at least one KDC.


    +   * Ticket Granting Ticket: Issued by the Authentication Server (AS), the Ticket
    Granting Ticket (TGT) is encrypted in the user''s password which is known only
    to the user and the KDC.


    +   * Ticket Granting Server: (TGS) issues service tickets to clients upon request.


    +   * Tickets: confirm the identity of the two principals. One principal being
    a user and the other a service requested by the user. Tickets establish an encryption
    key used for secure communication during the authenticated session.


    +   * Keytab Files: are files extracted from the KDC principal database and contain
    the encryption key for a service or host.


    To put the pieces together, a Realm has at least one KDC, preferably for redundancy,
    which contains a database of Principals. When a user logs into a workstation that
    is configured for Kerberos authentication, the KDC issues a Ticket Granting Ticket
    (TGT). If the user supplied credentials, the user is authenticated and can then
    request tickets for Kerberos services from the Ticket Granting Server (TGS). The
    service tickets allow the user to authenticate to the service without entering
    another username and password.


    # Kerberos Server


    # Installation


    For this discussion, we will create a MIT Kerberos domain with the following features
    (edit them to fit your needs):


    +   * Realm: EXAMPLE.COM


    +   * Primary KDC: kdc01.example.com (192.168.0.1)


