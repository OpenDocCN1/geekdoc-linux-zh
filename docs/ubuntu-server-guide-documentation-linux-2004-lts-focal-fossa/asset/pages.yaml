    # Troubleshooting


    When problems arise, there are a few common ways to diagnose the cause.


    # Escaping chroot


    The Ubuntu Postfix package will by default install a chroot environment for security
    reasons. This can add greater complexity when troubleshooting problems.


    To turn off the chroot usage, locate the following line in the /etc/postfix/master.cf
    configuration file:


    ```

    smtp      inet n     - -       smtpd

    ```


    and modify it as follows:


    ```

    smtp      inet n       - -       smtpd

    ```


    You will need to restart Postfix to use the new configuration. From a terminal
    prompt enter:


    ```

    sudo service postfix restart

    ```


    # SMTPS


    If you need secure SMTP, edit /etc/postfix/master.cf and uncomment the following
    line:


    ```

    smtps     inet n       - -       smtpd

    --o smtpd_tls_wrappermode=yes

    --o smtpd_sasl_auth_enable=yes

    --o smtpd_client_restrictions=permit_sasl_authenticated,reject

    --o milter_macro_daemon_name=ORIGINATING

    ```


    # Log Viewing


    Postfix sends all messages to /var/log/mail.log. However, error and warning messages
    can sometimes get lost in the normal log output so they are also logged to /var/log/mail.err
    and /var/log/mail.warn respectively.


    To see messages entered into the logs in real time you can use the tail -f command:


    ```

    tail -f /var/log/mail.err

    ```'
