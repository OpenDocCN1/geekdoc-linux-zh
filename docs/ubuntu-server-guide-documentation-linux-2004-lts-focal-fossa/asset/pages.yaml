    # Netbooting the server installer on amd64


    amd64 systems boot in UEFI or legacy (“BIOS”) mode (many systems can be configured
    to boot in either mode). The precise details depend on the system firmware, but
    both modes usually support PXE (“Preboot eExecution Environment”) specification,
    which allows the provisioning of a bootloader over the network.'
