    # Installing gitolite server


    Gitolite provides a traditional source control management server for git, with
    multiple users and access rights management. gitolite can be installed with the
    following command:


    ```

    sudo apt install gitolite3

    ```


    # Gitolite configuration


    Configuration of the gitolite server is a little different than most other servers
    on Unix-like systems, in that gitolite stores its configuration in a git repository
    rather than in /etc/. The first step to configuring a new installation is to allow
    access to the configuration repository.


    First of all, let''s create a user for gitolite to use the service:


    ```

    sudo adduser --shell /bin/bash --group --disabled-password --home /home/git get
    git

    ```


    Now we want to gitolite know about the repository administrator''s public SSH
    key. This assumes that the current user is the repository administrator. If you
    have not generated an SSH key, refer to openssh-keys in this manual.


    ```

    cp - ~/.ssh/rsa_pub /tmp/$(whoami).pub

    ```


    Let''s switch to the git user and import the administrator''s key into gitolite.


    ```

    sudo su - git

    gl-setup /tmp/*

    ```


    Gitolite will allow you to make initial changes to its configuration file during
    the setup process. You can now clone and modify the gitolite configuration repository
    from your administrator user (the user whose public SSH key injected). Switch
    back to that user, then clone the configuration repository:


    ```

    exit

    git clone git@IP_ADDRESS:gitolite-admin

    cd gitolite-admin

    ```'
