    # OpenLDAP Server


    The Lightweight Directory Access Protocol, or LDAP, is a protocol for querying
    and modifying a X.500-based directory service over TCP/IP. The current LDAP version
    is LDAPv3, as defined in RFC4510, and the implementation used in Ubuntu is OpenLDAP.


    The LDAP protocol accesses directories. A common mistake is to call a LDAP directory,
    or LDAP database, but it''s really common, and we all know what we are talking
    about, that''s ok. Here are some key concepts and terms:


    +   - A directory is a tree of data entries that is hierarchical in nature and
    is what the Directory Information Tree (DIT).

    - An entry has a set of attributes.

    - An attribute has a key (a name/description) and one or more values.

    - Every attribute must be defined in at least one objectClass.

    - Attributes and objectclasses are defined in schemas (an objectclass is actually
    considered a special kind of attribute).

    - Each entry has a unique identifier: its Distinguished Name (DN or dn). In turn,
    consists of a Relative Distinguished Name (RDN) followed by the parent entry''s
    DN.

    - The entry''s DN is not an attribute.


    Note


    The terms object, container, and node have certain annotations that they essentially
    mean the same as entry, the technically correct term.


    For example, we have a single entry of 11 attributes where the following is true:


    +   - DN is "cn=John Doe,dc=example,dc=com"

    - RDN is "cn=John Doe"

    - parent DN is "dc=example,dc=com"'
