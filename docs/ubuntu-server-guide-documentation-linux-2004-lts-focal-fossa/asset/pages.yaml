    the DNS documentation.


    Also, Kerberos is a time sensitive protocol. So if the local system time between
    a client machine and the server differs by more than five minutes (by default),
    the workstation will not be able to authenticate. To correct the problem all hosts
    should have their synchronized using the same Network Time Protocol (NTP) server.
    Check out the NTP chapter for more details.


    The first step in creating a Kerberos Realm is to install the kb5-kdc and kb5-admin-server
