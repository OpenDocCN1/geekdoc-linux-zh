  md: "# Backups\n\nThere are many ways to backup an Ubuntu installation. The most\
    \ important thing about backups is to develop a backup plan consisting of what\
    \ to backup, where to backup, how to back it up to, and how to restore it.\n\n\
    It is good practice to take backup media off-site in case of a disaster. For backup\
    \ plans involving physical tape or removable hard drives, the tapes or drives\
    \ can be manually off-site, but in other cases this may not be practical and the\
    \ archives will need copied over a WAN link to a server in another location.\n\
    \n# Archive Rotation\n\nThe shell script in Shell Scripts only allows for seven\
    \ different archives. For a server whose data doesn't change often, this may be\
    \ enough. If the server has a large amount of data, a more complex rotation scheme\n\
    \n# Rotating NFS Archives\n\nIn this section, the shell script will be slightly\
    \ modified to implement a grandfather-father-son rotation scheme (monthly-weekly-daily):\n\
    \n+   - The rotation will do a daily backup Sunday through Friday.\n\n+   - On\
    \ Saturday a weekly backup is done giving you four weekly backups a month.\n\n\
    +   - The monthly backup is done on the first of the month rotating two monthly\
    \ backups based on if the month is odd or even.\n\nHere is the new script:\n\n\
    ```\n#!/bin/bash\n################################################\n#\n# Backup\
    \ to NFS mount script with\n# grandfather-father-son rotation .\n#\n#################################################\n\
    ```\n\n```\n# What to backup.\nbackup_files=\"/home /var/spool/mail /etc /root\
    \ /boot /opt\"\n\n# Where to backup to.\ndest=\"/mnt/backup\"\n\n# Setup variables\
    \ for the archive filename.\nday=$(date +%d)\nhostname=$(hostname -s)\n\n# Find\
    \ which of the month 1–4 it is.\nif (( $day_num < 7 )); then\n\tweek_file=\"$hostname-week1.tgz\"\
    \nelif (( $day_num > 7 && $day_num <= 14 )); then\n\tweek_file=\"$hostname-week2.tgz\"\
    \nelif (( $day_num > 14 && $day_num <= 21 )); then\n\n```"
  merge: -1
