    # Networking


    Networks connect two or more devices, such as computer systems, printers, and
    related equipment which are connected by physical cabling or wireless links for
    the purpose of sharing and distributing information among the connected devices.


    This section provides general and specific information pertaining to networking,
    including an overview of network concepts and detailed discussion of popular network
    protocols.


    # TCP/IP


    The Transmission Control Protocol and Internet Protocol (TCP/IP) is a standard
    set of protocols developed in the late 1970s by the Defense Advanced Research
    Projects Agency (DARPA) as a means of communication between different types of
    computers and computer networks. TCP/IP is the driving force of the Internet,
    and it is the most popular set of network protocols on Earth.


    # TCP/IP Introduction


    The two protocols of TCP/IP deal with different aspects of computer networking.
    Internet Protocol, the "IP" of TCP/IP is a connectionless protocol which deals
    only with network packet routing using the IP Datagram as the basic unit of networking.
    The IP Dat consists of a header followed by a message. The Transmission Control
    Protocol is the "TCP" of TCP/IP and enables network hosts to establish connections
    which may be used to exchange data streams. TCP also guarantees that the data
    between connections is delivered and that it arrives at one network host in the
    same order as sent from another network host.'
