    # # Finding Images


    Users can find the latest Ubuntu images on the GCE UI by selecting “Ubuntu” as
    the Operating System under the Boot Disk settings.


    For a programmatic method, users can use the gcloud command to find the latest,
    release images:


    ```

    gcloud compute images list --filter ubuntu-os-devel

    ```


    Daily, untested, images are found under the ubuntu-os-cloud-devel project:


    ```

    gcloud compute images --project ubuntu-os-cloud-devel list --filter ubuntu-os-cloud-devel

    ```


