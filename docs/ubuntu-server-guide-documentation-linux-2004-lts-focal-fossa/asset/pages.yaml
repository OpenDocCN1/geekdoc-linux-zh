    # Network


    network|690x517


    This screen allows the configuration of the network. Ubuntu Server users netplan
    to configure networking and the UI of the installer can configure a subset of
    netplan''s capabilities. In particular it can configure DHCP or static addressing,
    VLANs and bonds.


    If networking is proper (defined "at least one interface has a default route")
    then the installer will install updates from the archive at the end of installation.


    # Proxy


    proxy|690x517


    The proxy configured on this screen is used for accessing the package repository
    and the snap store both in the installer environment and in the installed system.


    # Mirror


    mirror|690x517


    The installer will attempt to geoip to look up an appropriate default mirror for
    your location. If you want or need to use a different mirror, enter its URL here.


    # Storage


    storage_config|690x517


    Storage configuration is a complicated topic and has its own page for documentation.


    storage_confirm|690x517


    Once the storage configuration is confirmed, the installer begins in the background.


    # Identity


    identity|690x517


