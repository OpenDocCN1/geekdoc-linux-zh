  md: '# Increasing Logging Detail


    The amount of detail that is recorded in the logs can be increased via the configuration
    options. For example, to increase `TLS` activity logging set the `smtpd_tls_loglevel`
    option to a value from 1 to 4.


    ```

    sudo postconf -e ‘smtpd_tls_loglevel = 4’

    ```


    Reload the service after any change, to make the new config active:


    ```

    sudo systemctl reload postfix.service

    ```


    # Logging mail delivery


    If you are having trouble sending or receiving mail from a specific domain you
    can add the domain to the `debug_peer_list` parameter.


    ```

    sudo postconf -e ‘debug_peer_list = problem.domain’

    sudo systemctl reload postfix.service

    ```


    # Increasing daemon verbosity


    You can increase the verbosity of any Postfix process by editing the `/etc/postfix/master.cf`
    and adding `a v` after the entry. For example, edit the `smtp` entry:


    ```

    smtp      -       -       smtp  -v

    ```


    Then, reload the service as usual:


    ```

    sudo systemctl reload postfix.service

    ```


    # Logging SASL debug info


    To increase the amount of information logged when troubleshooting SASL issues
    you can set the following options in `/etc/dovcot/conf.d/10-dovcot.conf`


    ```

    auth_debug=yes

    auth_debug_passwords=yes

    ```


    Just like postfix if you change a Dovecot configuration the process will need
    to be reloaded:


    ```

    sudo systemctl reload dovecot.service

    ```


    # Note


    Some of the options above can drastically increase the amount of information sent
    to the log files. Remember to return the log level back to normal after you have
    corrected the problem. Then reload the appropriate daemon for the new configuration
    to take effect.


    # References


    Administering a Postfix server can be a very complicated task. At some point you
    may need to turn to the Ubuntu community for more experienced help.


    +   - The Postfix website documents all available configuration options.

    - O''Reilly''s Postfix: The Definitive Guide is rather dated but provides deep
    background information about configuration options.'
