    \  <product id='0x03880'/>\n</source>\n</hostdev>\n```\n\nVirtual functions are\
    \ usually assigned via their PCI-ID (domain, bus, slot, function).\n\n```\n<hostdev\
    \ mode='subsystem' type='pci' managed='yes'>\n<source>\n  <address domain='0x0000'\
