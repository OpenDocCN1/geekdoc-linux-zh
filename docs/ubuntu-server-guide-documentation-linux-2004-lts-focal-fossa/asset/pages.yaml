    # HTTPD - Apache2 Web Server


    Apache is the most commonly used Web server on Linux systems. Web servers are
    used to serve Web pages requested by client computers. Clients typically request
    and view Web pages using Web browser applications such as Firefox, Opera, Chrome,
    Chromium or Internet Explorer.


    Users enter a Uniform Resource Locator (URL) to point to a Web server by means
    of its Fully Qualified Domain Name (FQDN) and a path to the required resource.
    For example, to view the home page of the Ubuntu site a user will enter only the
    FQDN:


    ```

    www.ubuntu.com

    ```


    To view the community sub-page, a user will enter the FQDN followed by a path:


    ```

    www.ubuntu.com/community

    ```


    The most common protocol used to transfer Web is Hyper Text Transfer Protocol
    (HTTP), Protocols such as Hyper Text Protocol over Secure Sockets (HTTPS), and
    File Transfer Protocol (FTP), a protocol for uploading and downloading files,
    are also supported.


    Apache Web Servers are often used in combination with the MySQL database engine,
    the HyperText processor (PHP) scripting language, and other popular scripting
    languages as Python and Perl. This configuration is termed LAMP (Linux, Apache,
    MySQL and Perl/Python/PHP) and forms a powerful and robust platform for the development
    and deployment of Web-based applications.


    # Installation


    The Apache2 web server is available in Ubuntu Linux. To install Apache2:


    At a terminal prompt enter the following command:


    ```

    sudo apt install apache2

    ```


    # Configuration


    Apache2 is configured by placing directives in plain text configuration files.
    These directives are separated between the following files and directories:


    +   - apache2.conf: the main Apache2 configuration file. Contains settings that
    are global to Apache2.

    - httpd.conf: historically the main Apache2 configuration file, named after the
    httpd daemon. On all distributions (or older versions of Ubuntu), the file might
    be present. In Ubuntu, all configuration options have been moved to apache2.conf
    and the referenced directories, and this file no longer exists.

    - conf-available: this directory contains configuration files. All files that
    were previously in /etc/apache2/conf.d should be moved to /etc/apache2/conf-available.

    - conf-enabled: holds symlinks to the files in /etc/apache2/conf-available. When
    a configuration file is linked, it will be enabled when the apache2 is restarted.'
