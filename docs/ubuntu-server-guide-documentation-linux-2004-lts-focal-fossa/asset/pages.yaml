  md: '+   * Listen: By default on Ubuntu, the CUPS server listens only on the loopback
    interface at IP address 127.0.0.1. To instruct the CUPS server to listen on an
    actual network adapter''s IP address, you must specify either a hostname, the
    IP address, or optionally, an IP address/port pairing via the addition of a Listen
    directive. For example, if your CUPS server resides on a local network at the
    IP address 192.168.1.250 and you want to make it accessible to the other systems
    on your subnet, you would edit the /etc/cups/cups.conf and add a Listen directive,
    as such:


    ```

    Listen 127.0.0.1                   # existing loopback Listen

    Listen /var/run/cups/cups.sock      # existing socket Listen

    Listen 192.168.1.250:631            # Listen on the LAN interface , Port 631 (IPP)

    ```


    In the example above, you may comment out or remove the reference to the Loopback
    address (127.0.0.1) if you do not wish to listen on that interface, but rather
    have it only on the Ethernet interfaces of the Local Area Network (LAN). To enable
    listening for all network interfaces for which a certain hostname is bound, including
    the Loopback, you could create a Listen entry for the hostname socrates as:


    ```

    Listen socrates:631      # Listen on all interfaces for the hostname socrates

    ```


    or by omitting the Listen directive and using Port instead, as in:


    ```

    Port 631      # Listen on port 631 on all interfaces

    ```


    For more examples of configuration directives in the CUPS server configuration
    file, view the associated system manual page by entering the following command
    at a terminal prompt:


    ```

    man cupsd.conf

    ```


    # Note


    Whenever you make changes to the /etc/cups/cupsd.conf configuration file, you''ll
    need to restart the CUPS server by typing the following command at a terminal
    prompt:


    ```

    sudo systemctl restart cups.service

    ```


    # Web Interface


    # Tip


    CUPS can be configured and monitored using a web interface, which by default is
    available at http://localhost:631/admin. The web interface can be used to perform
    all printer management tasks.


    To perform administrative tasks via the web interface, you must either have the
    root account enabled on your server, or authenticate as a user in the lpadmin
    group. For security. reasons, CUPS won''t authenticate a user that doesn''t have
    a password.


    To add a user to the lpadmin group, run at the terminal prompt:


    ```

    sudo usermod -aG lpadmin username

    ```


    Further documentation is available in the Documentation/Help tab of the web interface.'
