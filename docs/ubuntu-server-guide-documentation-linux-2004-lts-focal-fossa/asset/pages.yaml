  md: '# Prerequisites, Assumptions, and Requirements


    For this setup, we need:


    +   - an existing OpenLDAP server with SSL enabled and using the RFC2307 schema
    for users and groups

    - a client where we will install the necessary tools and login as an user from
    the LDAP server


    # Software Installation


    Install the following packages:


    ```

    sudo apt install sssd ldap-utils

    ```


    # SSSD Configuration


    Create the /etc/sssd/sssd.conf configuration file, with permissions 0600 and ownership
    root:root, and this


    ```

    [sssd]

    config_file_version = 2

    domains = example.com


    [domain/example.com]

    id_provider = ldap

    auth_provider = ldap

    ldap_uri = ldap://ldap01.example.com

    cache_credentials = True

    ldap_search_base = dc=example,dc=com

    ```


    Make sure to start the sssd service:


    ```

    sudo systemctl start sssd.service

    ```


    > Note


    > sssd will START_TLS for authentication requests against the LDAP server (the
    auth_provider), but not for the id_provider. If you want to enable START_TLS for
    the id_provider, specify ldap_id_start_tls = true.


    # Automatic home directory creation


    To enable automatic home directory creation, run the following command:


    ```

