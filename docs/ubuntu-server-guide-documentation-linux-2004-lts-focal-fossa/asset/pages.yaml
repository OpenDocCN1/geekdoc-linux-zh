  md: '# SSSD and Active Directory


    This section describes the use of sssd to authenticate user logins against an
    Active Directory using sssd''s “ad” provider. At the end, Active Directory users
    will be able to login on the host using their AD credentials. Group membership
    will also be maintained.


    # Prerequisites, Assumptions, and Requirements


    +   - This guide does not explain Active Directory, how it works, how to set one
    up, or how to maintain it.

    - This guide assumes that working Active Directory domain is already configured
    and you have access to the credentials to join a machine to that domain.

    - The domain controller is acting as an authoritative DNS server for the domain.

    - The domain controller is the primary DNS resolver (check with systemd-resolve
    --status)

    - System time is correct and in sync, maintained via a service like chrony or
    ntp

    - The domain used in this example is ad1.example.com.


