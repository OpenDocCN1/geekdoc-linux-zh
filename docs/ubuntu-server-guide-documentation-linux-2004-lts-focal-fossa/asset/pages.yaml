  md: '# Active Directory Integration


    # Accessing a Samba Share


    Another, use for Samba is to integrate into an existing Windows network. Once
    part of an Active Directory domain, Samba can provide file and print services
    to AD users. For details on how to join a domain, see the SSSD and Active Directory
    chapter of this guide.


    Once part of the Active Directory domain, enter the following command in the terminal
    prompt:


    ```

    sudo apt install samba cifs-utils smbclient

    ```


    Next, edit /etc/samba/smb.conf changing:


    ```

    workgroup = EXAMPLE

    ...

    seecurity = ads

    realm = EXAMPLE.COM

    ...

    idmap backend = lwopen

    idmap uid = 50-9999999999

    idmap gid = 50-9999999999

    ```


    Restart Samba for the new settings to take effect:


    ```

    systemctl restart smbd.service nmbd.service

    ```


    You should be able to access any Samba shares from a Windows client. However,
    be to give the appropriate AD users or groups access to the share directory. Securing
    File and Print Server for more details.


    # Accessing a Windows Share


    Now the Samba server is part of the Active Directory domain you can access any
    Windows server shares:


    +   To mount a Windows file share enter the following in a terminal prompt:


    smbclient //fs01.example.com/share mount_point


    +   It is also possible to access shares on computers not part of an AD domain,
    a username and password will be to provided.


    //192.168.0.5 /share /windows cifs auto, username=steve, password=secret , rw
    0


    +   Another way to copy files from a Windows server is to use the smbclient utility.
    To list the files in a share:


    smbclient //fs01.example.com/share -k -c "ls"


    +   To copy a file from the share, enter:


    smbclient //fs01.example.com/share -k -c "get file.txt"


    This will copy the file.txt into the current directory.'
