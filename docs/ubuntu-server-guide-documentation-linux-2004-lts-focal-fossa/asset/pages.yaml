    # Password Policy


    A strong password is one of the most important aspects of your security posture.
    Many successful breaches involve simple brute force and dictionary attacks against
    weak passwords. If you intend to offer any form of remote access involving your
    local password system, make sure you adequately address minimum password complexity
    requirements, and frequent audits of your authentication sessions.


    # Minimum Password Length


    By default, Ubuntu requires a minimum password length of 6 characters, as well
    as some basic entropy checks. These values are controlled in the file /etc/pam.d/common-password,
    which is outlined below.


    ```

    password [success=1 default=ignore] pam_unix.so obscure sha512

    ```


    If you would like to adjust the minimum password length to 8 characters, the appropriate
    variable min=8. The modification is outlined below.


    ```

    password [success=1 default=ignore] pam_unix.so obscure sha512

    min=8

    ```


    # Note


    Basic password entropy checks and minimum length rules do not apply to the administrator
    sudo level commands to set a new user.


    # Password Expiration


    When creating user accounts, you should make a policy to have a minimum and maximum
    password age forcing users to change their passwords when they expire.


