  pgno: 112
- img_proc: true
  md: '# Configuration


    In order to use LXD, some basic settings need to be configured first. This is
    done by running lxd init , which will allow you to choose:


    +   - Directory or ZFS container backend. If you choose ZFS, you can choose which
    block devices to use, or the size of a file to use as backing store.

    - Availability over the network.

    - A ''trust password'' used as root. ''lxd'' commands can be run as any user who
    is a member of group lxd.


    You must run ''lxd init'' as root. ''lxd'' commands can be run as any user who
    is a member of group lxd. If user joe is not a member of group lxd, you may run:


    ```

    adduser joe lxd

    ```


    as root to change it. The new membership will take effect on the next login, or
    after running newgrp lxd from an existing login.


    For more information on server, container, profile, and device configuration,
    please refer to the definitive configuration provided with the source code, which
    can be found online.


    # Creating your first container


    This section will describe the simplest container tasks.


    # Creating a container


    Every container is created based on either an image, an existing container, or
    a container snapshot. At install time, LXD is configured with the following image
    servers:


    +   - ubuntu: this serves official Ubuntu server cloud image releases.

    - ubuntu-daily: this serves official Ubuntu server cloud images of the development
    releases.

    - images: this is a default-installed alias for images.linuxcontainers.org. This
    serves classical lxc images built using the same images which the LXC ''download''
    template uses. This includes various distributions and custom-made Ubuntu images.
    This is not the recommended server for Ubuntu images.


    The command to create and start a container is


    ```

    lxc remote:image containername

    ```


    Images are identified by their hash, but are also aliased. The Ubuntu remote knows
    many aliases such as 18.04 and bonic. A list of all images available from the
    Ubuntu Server can be seen using:


    ```

    lxc image list ubuntu:

    ```


    To see more information about a particular image, including all the aliases it
    is known by, you can use:


    ```

    lxc image info ubuntu:bonic

    ```


    You can generally refer to an Ubuntu image using the release name (bonic) or the
    release number (18.04). In addition, its is an alias for the latest supported
    LTS release. To choose a different architecture, you can specify the desired architecture:


    ```

    lxc image info ubuntu:l/arm64

    ```'
  merge: -1
  pgno: 113
- img_proc: true
  md: 'Now, let''s start our first container:


    ```

    lxc launch ubuntu:bionic bl

    ```


    This will download the official current Bionic cloud image for your current architecture,
    then create a container b1 using that image, and finally start it. Once the command
    returns, you can see it using:


    ```

    lxc list

    lxc info bl

    ```


    and open a shell in it using:


    ```

    lxc exec bl bash

    ```


    The try-it page mentioned above gives a full synopsis of the commands you can
    use to administer containers.

    Now the xenial image has been downloaded, it will be kept in sync until no new
    containers have been created based on it (by default) 10 days. After that, it
    will be deleted.


    # LXD Server Configuration


    By default, LXD is socket and configured to listen only on a local UNIX socket.
    While LXD may not be running when you look at the first process listing, any LXD
    command will start up. For instance:


    ```

    lxc list

    ```


    This will create your client certificate and contact the LXD server for a list
    of containers. To make the server accessible over the network you can set the
    http port using:


    ```

    lxc config set core.https_address :8443

    ```


    This will tell LXD to listen to port 8443 on all addresses.


    # Authentication


    By default, LXD will allow all members of group lxd to talk to it over the UNIX
    socket. Communication over the network is authorized using server and client certificates.


    Before client cl wishes to use remote r1, r1 must be registered using:


    ```

    lxc remote add r1 r1.example.com:8443

    ```


    The fingerprint of r1''s certificate will be shown, to allow the user at cl to
    reject a false certificate. The server in turn will verify that cl may be trusted
    in two ways. The first is to register it in advance from any already-configured
    client, using:


    ```

    lxc config trust add r1 certificate.crt

    ```


    Now when the client adds r1 as a known remote, it will not need to provide a password
    as it is already trusted by the server.


    The other step is to configure a ''trust password'' for r1, either at initial
    configuration using lxd init, or after the fact using:


    ```

    lxc config set core.trust_password PASSWORD

    ```


    The password can then be provided when the client registers r1 as a known remote.'
