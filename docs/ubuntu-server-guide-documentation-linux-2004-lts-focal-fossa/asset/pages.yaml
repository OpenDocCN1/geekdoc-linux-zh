  md: "# Logging\n\nBIND9 has a wide variety of logging configuration options available,\
    \ but the two main ones are channel and category, which configure where logs go,\
    \ and what gets logged, respectively.\n\nIf no logging options are configured\
    \ the default configuration:\n\n```\nlogging {\n    category default { default_syslog;\
    \ default_debug; };\n    category unmatched { null; };\n}\n```\n\nLet's instead\
    \ configure BIND9 to debug channel to specify which file to send the messages\
    \ to, and a category. In this example, the category will log all queries. Edit\
    \ /etc/bind/named.conf.local and add the following:\n\n```\nlogging {\n    channel\
    \ query.log {\n        file \"/var/log/named/query.log\";\n        severity debug\
    \ 3;\n    }\n    category queries { query.log };\n}\n```\n\n# Note\n\nThe debug\
    \ option can be set from 1 to 3. If a level is not specified, level 1 is the default.\n\
    \n+   - Since the named daemon runs as the bind user /var/log/named directory\
    \ must be created and the ownership changed:\n  sudo mkdir /var/log/named\nsudo\
    \ chown bind:bind /var/log/named\n- Now restart BIND9 for the changes to take\
    \ effect:\n  sudo systemctl restart bind9 query\n\nYou should see the file /var/log/named/query.log\
    \ fill with query information. This is a simple example of the BIND9 logging options.\
    \ For coverage of advanced options see More Information.\n\n# References\n\nCommon\
    \ Record Types\n\nThis section covers some of the most common DNS record types.\n\
    \n+   - A record: This record maps an IP Address to a hostname.\n  www IN A 192.168.1.12\n\
    - CNAME record: Used to create an alias to an existing A record. You cannot create\
    \ a CNAME record pointing to another CNAME record.\n  web IN CNAME www\n- MX record:\
    \ Used to define where email should be sent to. Must point to an A record, not\
    \ a CNAME."
