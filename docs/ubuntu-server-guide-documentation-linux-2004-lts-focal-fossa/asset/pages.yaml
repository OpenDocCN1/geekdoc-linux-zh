    # # Reporting problems with the installer


    We of course hope that every install with the server succeeds. But of course reality
    doesn''t always work that way and there will be failures of various kinds. This
    section explains the most useful way to report them so that we can fix the bugs
    causing them, and we''ll keep the topic up to date as the installer changes.


    The first thing is to update your subiquity snap. Not only because fix issues
    that cause failures over time but also we''ve been working on features to make
    failure reporting easier.


    A failure will result in a crash report being generated which bundles up all the
    information we need to fully diagnose a failure. These live in /var/crash in the
    install environment, and for Ubuntu 19.10 and newer this is persisted to the install
    media by default (if there is space).


    When an error occurs you are presented with a dialog which allows you to upload
    the report to the error tracker and offers options for continuing. Uploads to
    the error tracker are non-interactive and anonymous, so they are useful for tracking
    which kinds of errors are affecting most users, but do not get us a way to ask
    you to help diagnose the failure.


    You can create a Launchpad bug report, which does us establish this kind of two
    way communication, based on the contents of a crash report using the standard
    ''apport-cli '' tool that is part of Ubuntu. Copy the crash report to another
    system, run ''apport-/path/to/report.crash'' and'
