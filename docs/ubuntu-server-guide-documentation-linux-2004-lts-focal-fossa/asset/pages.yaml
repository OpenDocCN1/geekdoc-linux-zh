    # dpkg


    dpkg is a package manager for Debian-based systems. It can install, remove, build
    packages, but unlike other package management systems, **apt and Aptitude are
    newer, and layer additional features on top of dpkg.** This section covers using
    dpkg to manage locally installed packages:


    +   * To list all packages in the system''s package database, including all packages,
    installed and uninstalled, from a terminal prompt type:

    dpkg -l


    +   * Depending on the number of packages on your system, this can generate a
    large amount of output. Pipe the output through grep to see if a specific package
    is installed:

    dpkg -l | grep apache2


    Replace apache2 with any package name, part of a package name, or a regular expression.


    +   * To list the files installed by a package, in this case the ufw package,
    enter:

    dpkg -L ufw

    ufw


    +   * If you are not sure which package was installed, dpkg -S may be able to
    tell you. For example:

    dpkg -S /etc/host.conf

    base-files : /etc/host.conf


    The output shows that the /etc/host.conf belongs to the base-files package.


    > Note

    Many files are automatically generated during the package install process, and
    even though they are on the filesystem, dpkg -S may not know which package they
    belong to.


    +   * You can install a .deb file by entering:

    sudo dpkg -i zip_3.0-4_amd64.deb


    Change zip_3.0-4_amd64.deb to the actual file name of the .deb file you wish to
    install.


    +   * Uninstalling a package can be accomplished by:

    sudo dpkg -r zip'
