    # Squid


    Squid is a full-featured web proxy server application which provides cache services
    for Hyper Text Transport Protocol (HTTP), File Transfer Protocol (FTP), and other
    popular protocols. Squid can implement caching and proxy of Secure Sockets Layer
    (SSL) requests and caching of Domain Name Server (DNS) lookups, and support a
    wide variety of caching protocols, such as Internet Cache Protocol (ICP), the
    Hyper Caching Protocol (HTCP), the Cache Array Routing Protocol (CARP), and the
    Web Cache Coordination Protocol (WCCP).


    The Squid cache server is an excellent solution to a variety of proxy and caching
    server needs, and scales from the branch office to enterprise level networks while
    providing extensive, granular access control mechanisms, and monitoring of critical
    parameters via the Simple Network Management Protocol (SNMP). When selecting a
    computer system for use a dedicated Squid cache proxy for many users ensure it
    is configured with a large amount of physical memory as Squid maintains an in-memory
    cache for increased performance.


    # Installation


    At a terminal prompt, enter the following command to install the Squid server:


    ```

    sudo apt install squid

    ```


    # Configuration


    Squid is configured by editing the directives contained within the /etc/squid/squid.conf
    configuration file. The following examples illustrate some of the directives which
    may be modified to affect the behavior of the Squid server. For more in-depth
    configuration of Squid, see the References section.


    # Tip


    Prior to editing the configuration file, you should make a copy of the original
    file and protect it writing so you will have the original settings as a reference,
    and to re-use as necessary. Make this copy and protect it from writing using the
    following commands:


    ```

    sudo cp /etc/squid/squid.conf /etc/squid/squid.conf.original

    sudo chmod -w /etc/squid/squid.conf.original

    ```


    +   • To set your Squid server to listen on TCP port 8888 instead of the default
    TCP port 3128, change the http_port directive as:

    http_port 8888


    +   • Change the visible_hostname directive in order to give the Squid server
    a specific hostname. This hostname does not necessarily need to be the computer''s
    hostname. In this example it is set to weezie

    visible_hostname weezie


    +   • The cache_dir option allows one to configure an on-disk, cache, the default
    option is on-memory cache. The cache_dir directive takes the following arguments:'
