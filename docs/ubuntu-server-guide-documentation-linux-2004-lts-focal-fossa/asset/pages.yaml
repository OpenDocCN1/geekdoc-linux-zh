  md: 'Finally, you should restart the PostgreSQL service to initialize the new configuration.
    From a terminal

    prompt enter the following to restart PostgreSQL:

    sudo systemctl restart postgresql.service


    # Warning


    The above configuration is not complete by any means. Please refer to the PostgreSQL
    Administrator''s Guide to configure more parameters.


    You can test server connections from other machines by using the PostgreSQL client.


    ```

    sudo apt install postgresql-client

    psql -h postgresql.example.com -U postgres -W

    ```


    # Note


    Replace the domain name with your actual server domain name.


    # Streaming Replication


    PostgreSQL has a nice feature called Streaming Replication which provides the
    capability to continuously

    ship and apply the WAL records to any number of standby servers in order to keep
    them current.

    Here is presented a very basic and simple method to replicate a PostgreSQL server
    (master) in a standby server.


    First, create a replication user in the master to be used by the standby:


    ```

    $ sudo -u postgres createuser --replication -P -e replicator

    ```


    Let''s configure the master server to turn on the streaming replication. Open
    the file /etc/postgresql/12/

    main/postgresql.conf and make sure you have the following lines:


    ```

    listen_addresses = ''*''

    wal_level = replica

    max_wal_senders = 10

    ```


    Also edit the file /etc/postgresql/12/main/pg_hba.conf to add an line to allow
    tte the standby server

    connection using the replication user:


    ```

    host replication replicator <IP address of the standby> md5

    ```


    Restart the service to apply changes:


    ```

    $ systemctl restart postgresql

    ```


    Now, in the standby server, let''s stop the PostgreSQL service:


    ```

    $ systemctl stop postgresql

    ```


    Edit the /etc/postgresql/12/main/postgresql.conf to set hot standby:

    hot_standby = on


    Back up the current state of the master server:


    ```

    $ sudo su postgres

    $ cp -R /var/lib/postgresql/12/main /var/lib/postgresql/12/main_bak

    $ rm -rf /var/lib/postgresql/12/* # remove all the files in the data

    directory

    $ pg_basebackup <IP address of the master> -D /var/lib/postgresql/12/main -U replicator
    -P -v -R

    ```'
  merge: -1
  pgno: 134
- img_proc: true
  md: 'In the pg_basebackup command the flags represent the following:


    +   - -h: the hostname or IP address of the master server

    - -D: the data directory

    - -U: the user to be used in the operation

    - -P: tunes on progress reporting

    - -v: enables verbose mode

    - -R: Creates a standby.signal file and append connection settings to postgresql.auto.conf


    Finally, let''s start the PostgreSQL service on standby server:


    ```

    $ sudo systemctl start postgresql

    ```


    To make sure it is working, go to the master server and run the following command:


    ```

    $ sudo -u postgres pql -c "select * from pg_stat_replication:"

    ```


    You need to see an entry for the standby server. As you can see in the presented
    row draw the data synchronization is asynchronous. If you want to make it synchronous,
    go to the /etc/postgresql/12/main/postgresql.conf file in the master server and
    make sure you have the following lines:

    synchronousous_commit = on

    synchronousous_standby_names = ''*'' # you can also specify an IP address


    And restart the service:


    ```

    $ sudo systemctl restart postgresql

    ```


    Now, you can check the pg_stat_replication table again and the sync_state of the
    standby server need to become sync instead of:


    ```

    $ sudo -u postgres pql -c "select * from pg_stat_replication:"

    ```


    To test the replication you can now create a test database in the master and check
    if it is replicated in the standby server:


    ```

    $ sudo -u postgres createdb test # on the master server

    $ sudo -u postgres pql -c "#" on the standby server

    ```


    You need to see the test database created on the master server.


    # Backups


    PostgreSQL databases should be backed up regularly. Refer to the PostgreSQL Administrator''s
    Guide for different approaches.


    # Resources


    +   - As mentioned above the PostgreSQL Administrator''s Guide is an excellent
    resource. Refer to the guide is also available in the postgresql-doc-12 package.
    Execute the following in a terminal to install the package:

    sudo apt install postgresql-doc-12


    To view the guide file:file:///usr/share/doc/postgresql-doc-12/html/index.html
    into the address bar of your browser.


    +   - For general SQL information see the O''Reilly books Getting Started with
    SQL: A Hands-On Approach for Beginners by Thomas Nield as an entry point and SQL
    in a Nutshell as a quick reference.

    - Also, see the PostgreSQL Ubuntu Wiki for more information.'
