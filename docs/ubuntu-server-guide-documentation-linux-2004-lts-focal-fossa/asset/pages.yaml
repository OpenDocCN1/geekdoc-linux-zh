  md: '# Troubleshooting


    # Logging


    If something goes wrong when starting a container, the first step should be to
    get full logging from LXC:

    sudo lxc-start -n C1 -l trace -o debug.out


    This will cause lxc to log to the most verbose level, trace, and to output log
    information to a file called

    debug.out. If the file debug.out already exists, the new log information will
    be appended.


    # Monitoring container status


    Two commands are available to monitor container state changes. lxc-monitor monitors
    one or more con-

    tain for any state changes. It takes a container name as usual with the -n option,
    but in this case the

    name can be a posit regular expression to allow monitoring desirable sets of containers.
    lxc-

    monitor continues running as it prints container changes. lxc-wait waits for a
    specific state change and

    its. For instance:


    ```

    sudo lxc-monitor -n cont [0-5]*

    ```


    would print all state changes to any containers matching the listed expression,
    whereas

    sudo lxc-wait -n cont1 -s ''STOPPED|FROZEN''


    will wait until container1 enters state STOPPED or state FROZEN and then exit.


    # Attach


    As of Ubuntu 14.04, it is possible to attach to a container''s namespaces. The
    simplest case is to do

    sudo lxc-attach -n C1


    which will start a shell attached to C1''s namespaces, or effectively inside the
    container. The attach func-

    tionality is very flexible, attaching to a subset of the container''s namespaces
    and security context.

    See the manual page for more information.


    # Container init verbosity


    If LXC completes the startup, but the container init fails to complete (for instance,
    no login prompt

    is shown), it can be useful to request additional verbosity from the init process.
    For an upstart container,

    this might be:


    ```

    sudo lxc-start -n C1 /bin/init loglevel=debug

    ```


    You can also start an entirely different program in place of init, for instance


    ```

    sudo lxc-start -n C1 /bin/bash

    sudo lxc-start -n C1 /bin/sleep 100

    sudo lxc-start -n C1 /bin/cat /proc/1/status

    ```'
