  md: '# Configuration


    The main Samba configuration file is located in /etc/samba/smb.conf. The default
    configuration file has a significant number of comments in order to document various
    configuration directives.


    # Note


    Not all the available options are included in the default configuration file.
    See the smb.conf man page or the HOWTO Collection for more details.


    First, edit the following key/value pairs in the [global] section of /etc/samba/smb.conf:


    ```

    workgroup = EXAMPLE


    security = user

    ```


    The security parameter is further down in the [global] section, and is commented
    by default. Also, change EXAMPLE to better match your environment.


    Create a new section at the bottom of the file, or uncomment one of the examples,
    for the directory to be shared:


    ```

    [share]

    comment = Ubuntu File Server Share

    path = /srv/samba/share

    nbrowsable = yes

    guest ok = yes

    read only = no

    create mask = 0755

    ```


    +   - comment: a short description of the share. Adjust to fit your needs.

    - path: the path to the directory to share.


    This example uses /srv/samba/sharename, according, to the Filesystem Hierarchy
    Standard (FHS), /srv is where site-specific data should be served. Technically
    Samba shares can be placed anywhere on the filesystem as the permissions are correct,
    adhering to standards is recommended.


    +   - browsable: enables clients to browse the share directory without supplying
    a password.

    - read only: determines if the share is read or if write privileges are granted.
    Write privileges are allowed only when the value is no, as seen in this example.
    If the value is yes, access to the share is read only.

    - create mask: determines the permissions new files will have created.


    Now that Samba is configured, the directory needs to be created and the permissions
    changed. From a terminal enter:


    ```

    sudo mkdir -p /srv/samba/share

    sudo chown nobody:nogroup /srv/samba/share/

    ```


    # Note


    The -p switch tells mkdir to create the entire directory tree if it doesn''t exist.


    Finally, restart the samba services to enable the new configuration:

    sudo systemctl restart smbd.service nmbd.service'
