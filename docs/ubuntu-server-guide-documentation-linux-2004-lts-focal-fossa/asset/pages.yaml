    # pam_motd


    When logging into an Ubuntu server you may have noticed the informative Message
    Of The Day (MOTD). This information is obtained and displayed using a couple of
    packages:


    +   * landscape-common: provides the core libraries of landscape-client, which
    is needed to manage systems with Landscape (proprietary). The package also includes
    the landscape-syninfo utility which is responsible for displaying system data
    including cpu, memory, disk space, etc. For instance:


    | System load: 0.0 | Processes: | 76 |

    | --- | --- | --- |

    | Usage of /: | 30.2% of 3.11GB | Users logged in: | 1 |

    | Memory usage: 20% | IP address for eth0: | 10.153.107.115 |

    | Swap usage: 0% | | |


    Graph this data and manage this system at https://landscape.canonical.com/


    #  Note


    You can run landscape-syninfo manually at any time.


    +   * update-notifier-common: provides information on available package updates,
    impending filesystem checks (fsck), and required reboots (after a kernel upgrade).


    pam_motd executes the scripts in /etc/update/ in order by the number prepended
    to the script. The output of the scripts is written to /var/run/motd, keeping
    the numerical order, then concatenated with /etc/motd.local.


    You can add your dynamic information to the MOTD. For example, to add local weather
    information:


    +   * First, install the weather-package:

    udo apt install weather-util

    * The weather utility uses METAR data from the National Oceanic and Atmospheric
    Administration and forecasts from the National Weather Service. To find local
    information you will need the 4-character ICAO location indicator. This can be
    determined by browsing to the National Weather site.'
