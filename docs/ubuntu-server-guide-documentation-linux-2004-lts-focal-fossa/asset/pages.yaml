    # libvirt


    The libvirt library is used to interface with different virtualization technologies.
    Before getting started with

    lvirt it is to make sure your hardware supports the necessary virtualization extensions
    for KVM. Enter

    the following from a terminal prompt:


    kvm-ok


    A message will be printed informing you if your CPU does or not support hardware
    virtualization.


    Note


    On many computers with processors supporting assisted virtualization, it is necessary

    to activate one in the BIOS to enable it.


    # Virtual Networking


    There are few ways to allow virtual machine access to the external network. The
    default virtual

    network configuration includes bridging and iptables rules implementing usmode
    networking, which uses

    t SLIRP protocol. Traffic is NATed through the host interface to the outside network.


    To enable hosts to directly access services on virtual machines a different type
    of bridge than the

    default needs to be configured. This allows the virtual interfaces to connect
    to the outside network through

    physical interface, making them appear as normal hosts to the rest of the network.


    There is a great example how to configure an owned bridge and combining it with
    libvirt so that guests will

    use at the netplan.io.'
