    # LDAP Workstation Authentication


    Once you have a working LDAP server, you will need to install libraries on the
    client that will know when and where to contact it. On Ubuntu, this has traditionally
    accomplished by installing the libnss-ldap package, but nowadays you should use
    SSSD. Please refer to - SSSD.


    # User and Group Management - ldapscripts


    Another common use case for having an LDAP server is to store user and group information
    in the directory. There are many tools out there, but usually big deployments
    have developed their own. Here we briefly show how to use the ldapscripts package
    for an easy and quick way to start storing user and group information in OpenLDAP.


    Install the package:


    ```

    sudo apt install ldapscripts

    ```


    Then edit the file /etc/ldapscripts/ldapscripts.conf to refer something to the
    following:


    ```

    SERVER=ldap://ldap01.example.com

    LDAPINOPTS=''-ZZ''

    BINDDN=''dc=admin,dc=example,dc=com''

    BINDPASSWORDFILE=''/etc/ldapscripts/ldapscripts.passwd''

    SUFFIX=''dc=example,dc=com''

    GSUFFIX=''ou=Groups''

    USSUFFIX=''ou=People''

    MSUSSUFFIX=''ou=Computers''

    ```


    # Note


    +   - Adjust SERVER and related SUFFIX options to suit your directory server.

    - Note we are forcing START_TLS using (-ZZ parameter), please refer to LDAP with

    TLS for details on how to set the server up with TLS support'
