  md: 'The -l option allows the LV to be extended using PE. The -L option allows the
    LV to be extended using Meg, Gig, Tera, etc bytes.


    Even though you are supposed to be able to expand an ext3 or ext4 filesystem without
    unmounting it first, it may be a good practice to unmount it and check the filesystem,
    so that you do not mess up your day you want to recover a logical volume (in case
    unmounting first is compulsory).


    The following commands are for an EXT3 or EXT4 filesystem. If you are using another
    filesystem there may be other utilities available.


    ```

    sudo mount /srv

    sudo e2fsck -f /dev/vg0/srv

    ```


    The -f option of efsck forces checking even if the system cleans.


    Finally, resize the filesystem:


    ```

    sudo resize2fs /dev/vg0/srv

    ```


    Now mount the partition and check its size.


    ```

    mount /dev/vg0/srv /srv && df -h /srv

    ```


