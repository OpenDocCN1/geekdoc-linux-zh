    # Certificates


    One of the most common forms of cryptography today is public key and private key
    cryptography. Public-key cryptography utilizes a public key and a private key.
    The system works by encrypting information using the public key. The information
    can then only be decrypted using the private key.


    A common use for public-key cryptography is encryption traffic using a Secure
    Socket Layer (SSL) or Transport Layer Security (TLS) connection. One example:
    configuring Apache over HTTPS, the HTTP protocol over SSL/TLS allows us to encrypt
    traffic using a protocol that does not itself provide encryption.


    A certificate is a method used to distribute a public key and other information
    about a server and the organization who is responsible for it. Certificates can
    be digitally signed by a Certification Authority, CA. A CA is a trusted party
    that has confirmed the information contained in the certificate is accurate.'
