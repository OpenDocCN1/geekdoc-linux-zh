    # Kerberos and LDAP


    Kerberos supports a few database backends. The default one is what has been used
    so far, called db2. The DB documentation shows all the options, one of which is
    LDAP.


    There are several reasons why one would want to have the Kerberos principals stored
    in LDAP as opposed to a local-only disk. There are also cases when it is not a
    good idea. Each side has to evaluate the pros and cons. Here are a few: the OpenLDAP
    implementation is faster and more robust than the native Kerberos, based on a
    cron job - setting things up with LDAP isn''t exactly trivial and shouldn''t be
    attempted by administrators without prior knowledge of OpenLDAP - as highlighted
    in LDAP section of DB Types, since krb5kcd is single threaded there may be higher
    latency in serving requests when using the OpenLDAP backend - if you already have
    OpenLDAP for storing users and groups, adding the Kerberos attributes to the same
    mix might be beneficial and can provide a nice integrated strategy'
