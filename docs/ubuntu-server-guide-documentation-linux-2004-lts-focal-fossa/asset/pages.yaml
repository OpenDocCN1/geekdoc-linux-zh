  md: '# Cloning


    For rapid provisioning, you may wish to customize a canonical container according
    to your needs and make multiple copies of it. This can be done with the lxc-clone
    command.


    Clones are either snapshots or copies of another container. A copy is a new container
    copied from the original, and takes as much space on the host as the original.
    A snapshot exploits the underlying store''s snapshotting ability to make a copy-on-write
    container referencing the first. Snapshots can be created from btrfs, svm, zfs,
    and directory backed containers. Each store has its own peculiarities - for instance,
    LVM containers which are not thin-provisioned cannot support snapshots; zfs containers
    with snapshots will grow until all snapshots are removed; directory backed containers
    must be carefully deleted; btrfs does not store any of these shortcomings, but
    suffers from reduced fiance performance using dpkg and apt be slow.


    Snapshots of directory-backed containers are created using the overlay filesystem.
    For instance, a directory-backed container C1 will have its root filesystem mounted
    under /var/lib/lxc/rootfs. A snapshot of C1 called C2 will be started with C1''s
    roots mounted readonly at /var/lib/lxc/C2/delta0. Importantly, in this case C1
    should not be allowed to run or be removed while C2 is running. It is advised
    instead to consider C1 a canonical base container, and to use it its snapshots.


    Given an existing container C1, a copy can be created using:


    ```

    sudo lxc-clone -o C1 -n C2

    ```


    A snapshot can be created using:


    ```

    sudo lxc-clone -s o C1 -n C2

    ```


    See the lxc-clone manual for more information.


    # Snapshots


    To easily possible to support the use of snapshots for iterative container development,
    LXC supports snapshots. When working on a container C1, before making a potentially
    dangerous or hard-to-revert change, you can create a snapshot


    ```

    sudo lxc-snapshot -n C1

    ```


    which is a snapshot-clone called ''snap0'' under /var/lib/lxcsnap or $HOME/.local/share/lxcsnaps.
    The next will be called ''snap1'', existing snapshots can be loaded using lxc-snapshot
    -L n C1, and a snapshot can be restored - erasing the current C1 using lxc-snapshot
    -r snap1 -n C1. After the restore, the snapshot continues to exist, and the C1
    is erased and replaced with the new snapshot


    Snapshots are supported for btrfs, lvm, zfs, and overlay containers. If lxc-snapshot
    is called on a directory-backed container, an error will be logged and the snapshot
    will be created as a copy-clone. The reason for this is that if the user creates
    an overlay of a directory-backed container and then makes changes to the directory-backed
    container, the original container will be partially reflected in the snapshot.
    If snapshots of a directory backed container C1 are desired, then overlays of
    C1 should be created, as such C1 should not be touched again, and the overlays
    can be edited and snapshotted at will:


    ```

    lxc-clone -s o C1 -n C2

    lxc-start -n C2 -d # make some changes

    lxc-stop -n C2

    lxc-snapshot -n C2

    lxc-start -n C2 # etc

    ```'
  merge: -1
