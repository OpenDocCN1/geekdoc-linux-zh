    # Console Security


    With as other security barrier you put in place to protect your server, it is
    tough to guard against untold damage caused by someone with physical access to
    your environment, for example, theft of hard drives, power or service disruption,
    and so on. Therefore, console security should be addressed merely as one component
    of your physical security strategy. A locked “screen” may deter a casual criminal,
    or at the very slow down a determined one, it is still advisable to perform precautions
    regard to console security.


    The following instructions will help defend your server against issues that could
    otherwise yield very serious consequences.


    # Disable Ctrl+Alt+Delete


    Anyone that has physical access to the keyboard can use the Ctrl+Alt+Delete key
    combination to reboot the server without having to log on. While some could unplug
    the power source, you should still prevent the use of this combination on a production
    server. This forces an attacker to take more drastic measures to reboot the server,
    and prevent accidental reboots at the same time.


    To disable the reboot action taken by pressing the Ctrl+Alt+Delete key combination,
    run the following commands:


    ```

    sudo systemctl mask ctrl-alt-.target

    sudo systemctl daemon-reload

    ```


    # eCryptfs is deprecated


    eCryptfs is deprecated and should not be used, instead LUKS setup as defined by
    the Ubuntu installer is recommended. That in turn - for a typical remote server
    setup will need a remote key store as no one is there to enter a key on boot.


    Virtualization is being adopted in many different environments and situations.
    If you are a developer, virtualization can provide you with a contained environment
    where you can safely do almost any sort'
