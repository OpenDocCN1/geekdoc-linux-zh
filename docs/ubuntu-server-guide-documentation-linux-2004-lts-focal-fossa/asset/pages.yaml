  md: '# Tuning OpenvswitchDPDK


    DPDK has plenty of options - in combination with Openvswitch-DPDK the two most
    commonly used are:

    ovs-vsctl set Open_vSwitch . other_config:n-dpdk-rxqs=2

    ovs-vsctl set Open_vSwitch . other_config:pmd-cpu-mask=0x6


    The first may refer how rx queues to be used for each DPDK interface, while the
    controls

    how many and where to run PMD threads. The example above will utilize two rx queues
    and run PMD

    threads on CPU 1 and 2. The referred links to "EAL Command-line Options" and "Openvswitch
    DPDK

    installation" at the end of this document for more.


    As with tunings you have to know your system and workload really well - so please
    verify any tunings

    with workloads matching your real use case.


    # Support and Troubleshooting


    DPDK is a fast evolving project. In any case of a search for support and further
    guides it is highly recom-

    mended to first check if they apply to the current version.


    Check if it is a known issue on:


    +   - DPDK Mailing Lists

    - For Openvswitch-DPDK OpenStack Mailing Lists

    - Known issues in DPDK Launchpad Area

    - Join the IRC channels #DPDK or #openvswitch on freedom.


    Issues are often due to missing small details in the general setup. Later on,
    on these missing details cause

    problems which can be hard to track down to their root cause. A common case seems
    to be the "could

    ot open network device dpd0 (No such device)\ issue. This occurs rather late when
    setting a port in

    Open vSwitch with DPDK. The root cause most of the time is very early in the setup
    and initialization.

    Here is an example how a proper initialization of a device looks - this can be
    found in the syslog/journal when

    Starting Open vSwitch with DPDK enabled.


    ```

    ovs-vsctl [3560]: EAL: PCI device 0000:04:00.01 on NOMA socket 0

    ovs-vsctl [3560]: EAL: probe driver: 8056:1528 rte_igbe_pmd

    ovs-vsctl [3560]: EAL: PCI memory mapped at 0x7f2140000000

    ovs-vsctl [3560]: EAL: PCI memory mapped at 0x7f2140200000

    ```


    If this is issue, by either cards, failed initialization or other reasons, later
    on there will be no

    DPDK device to refer to. Unfortunately the load is spread across syslog/journal
    and the openvswitch

    log. To allow some checking here an example what can be found in these logs, relate
    to the entered

    command.


    ```

    #Note: This log was taken with dpdk 2.2 and openvswitch 2.5 but still looks

    quite similar (a bit extended) these days

    ```


    Captions:

    CMD: that you enter

    YSLOG: (Including EAL OVS Messages)

    OVS-LOG: (Openvswitch messages)


    ```

    #PREPARATION

    Bind an interface to DPDK UIO drivers, make Hugepages available, enable DPDK

    on OVS

    ```


    CMD: sudo service openvswitch-restart'
