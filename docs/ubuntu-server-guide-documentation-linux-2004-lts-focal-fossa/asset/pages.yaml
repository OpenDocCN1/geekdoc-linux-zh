    # Reporting Bugs in Ubuntu Server


    The Ubuntu Project, and thus Ubuntu, uses Launchpad as its bug tracker. In order
    to file a bug,

    will need a Launchpad account. Create one here if necessary.


    # Reporting Bugs With apport-cli


    The preferred way to report a bug is with the apport-cli command. It must be invoked
    on the machine

    affected by the bug because it collects information from the system on which it
    is running and publishes

    to the report on Launchpad. Getting information to Launchpad can, therefore, be
    a challenge if

    is system is not running a desktop environment in order to use a browser (with
    servers) or if it

    d not have Internet access. The steps to take in these situations are described
    below.


    # Note


    The commands apport-cli and ubuntu-bug should give the same results on a CLI server.
    The

    latter is actually a symlink to apport-bug which is intelligent enough to know
    whether a desktop

    environment is in and will choose apport-cli if not. Since server systems tend
    to be CLI-only

    apport-cli was chosen from the outset in this guide.


    Bug reports in Ubuntu need to be filed against a specific software package, so
    the name of the package

    (source package or package name/path) after the bug needs to be supplied to apport-cli:

    apport-cli PACKAGENAME'
