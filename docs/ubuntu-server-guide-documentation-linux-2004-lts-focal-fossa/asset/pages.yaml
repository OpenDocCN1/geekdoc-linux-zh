  md: '# Linux High Availability Projects


    There are many upstream high availability related projects that are included in
    Ubuntu Linux. This section will describe the most important ones.


    The following packages are present in latest Ubuntu LTS release:


    # Ubuntu HA Core Packages


    Packages in this list are supported like any other package available in [main]
    repository would be.


    | Package | URL |

    | --- | --- |

    | libqb | Ubuntu | Upstream |

    | krosnet | Ubuntu | Upstream |

    | corync | Ubuntu | Upstream |

    | pacemaker | Ubuntu | Upstream |

    | resource-agents | Ubuntu | Upstream |

    | fence-agents | Ubuntu | Upstream |

    | crmsh | Ubuntu | Upstream |

    | cluster-glue | Ubuntu | Upstream |

    | drbd-utils | Ubuntu | Upstream |

    | dlm | Ubuntu | Upstream |

    | g22-utils | Ubuntu | Upstream |

    | keepalived | Ubuntu | Upstream |


    +   **Krosnet** - Krosnet, referred to as knit, is a network abstraction layer
    designed for High Availability. Corync uses multiple networks for its interconnect
    (replacing the Old Totem Redundant Ring Protocol) and add support for more features
    like interconnect network hot-plug.


    +   **Corync - or Cluster Membership Layer**, provides reliable messaging, membership
    and quorum information about the cluster. Currently, Pacemaker supports Corync
    as this layer.


    +   **Resource Agents** - Scripts or operating system components that start, stop
    or monitor resources, giving a set of resource parameters. These provide a uniform
    interface between pacemaker and the managed services.


    +   **Fence Agents** - Scripts that execute fencing actions, giving a target and
    device parameters.


    +   **Pacemaker** - or Cluster Resource Manager, provides the brain that brings
    processes and reacts to events that occur in the cluster. Events might be: nodes
    joining or leaving the cluster, resource events caused by failure, maintenance,
    or scheduled activities. To achieve the desired availability, Pacemaker will start
    and stop resources and fence devices. nodes joining or leaving the cluster, resource
    events caused by failure, maintenance, or scheduled activities. To achieve the
    desired availability, Pacemaker will start and stop resources and fence devices.


    +   **DRBD** - A Distributed Replicated Block Device, DRBD is a distributed replicated
    storage system for the Linuxplatform. It is implemented as a kernel driver, several
    users management applications, and some shell scripts. DRBD is traditionally used
    in high availability (HA) clusters.


    +   **DLM** - A distributed lock manager (DLM) runs in every machine in a cluster,
    with an identical copy of a cluster-wide lock database. In this way DLM provides
    software applications that are distributed across a cluster on multiple machines
    to synchronize their accesses to shared resources.


    +   **Keepalived** - Keepalived provides simple and robust facilities for loadbalancing
    and high-availability to Linux system and Linux based infrastructures. Loadbalancing
    framework relies on well-known and widely used Linux Virtual Server (IPVS) kernel
    module providing Layer4 loadbalancing. Keepalived'
