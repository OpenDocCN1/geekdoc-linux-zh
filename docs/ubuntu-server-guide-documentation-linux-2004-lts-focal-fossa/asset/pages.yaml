    # etkeeper


    etkeeper allows the contents of /etc to be stored in a Version Control System
    (VCS) repository. It integrates with APT and automatically commits changes to
    /etc when packages are installed or upgraded. Placing /etc under version control
    is considered an industry best practice, and the goal of etkeeper is to make this
    process as painless as possible.


    Install etkeeper by entering the following in terminal:


    ```

    sudo apt install etkeeper

    ```


    The main configuration file, /etc/etkeeper/etkeeper.conf, is fairly simple. The
    main option is which VCS to use and by default etkeeper is configured to use git.
    The repository is automatically initialized (and committed for the first time)
    during package installation. It is possible to undo this by entering the following
    command:


    ```

    sudo etkeeper unitinit

    ```


    By default, etkeeper will commit uncommitted changes to /etc daily. This can be
    disabled using the AVOID_DAILY_AUTOCOMMITS configuration option. It will also
    automatically commit changes before after package installation. For a more precise
    tracking of changes, it is recommended to commit your changes manually, together
    with a commit message:


    ```

    sudo etkeeper commit "Reason for configuration change"

    ```


    The vs etkeeper command allows to run any subcommand of the VCS that etkeeper
    is configured to run. It will be run in /etc. in the case of:


    ```

    sudo etkeeper vcs log /etc/passwd

    ```


    To demonstrate the integration with the package management system (APT), install
    postfix:'
