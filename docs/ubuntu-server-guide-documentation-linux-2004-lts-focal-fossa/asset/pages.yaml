  md: 'Now Samba has been configured to limit groups have access to the shared directory,
    the filesystem permissions Linux need to be updated.


    Traditional Linux file permissions do not map well to Windows NT Access Control
    Lists (ACLs). Frequently POSIX ACLs are available on Ubuntu servers providing
    more grained control. For example, to enable ACLs on /srv or EXT3 filesystem,
    /etc/fstab adding the acl option:


    ```

    UUID=66bcd2de2-8861-4fb0-b7c4-e61c569fe17d /srv noatime,relime,acl=0

    1

    ```


    Then reboot the partition:


    ```

    sudo mount -v -o mount /srv

    ```


    > Note

    The above example assumes /srv on a separate partition. If /srv, or wherever you
    have configured

    your path, is part of the partition a reboot may be required.


    To match the Samba configuration using the sysadmin group will be given read,
    write, and execute permis- to /srv/samba/, the group will be given read and execute
    permissions, and the files will be\owned by the username melissa. Enter the following
    in a terminal:


    ```

    sudo chown -R melissa /srv/samba/share/

    sudo chgrp -R sysadmin /srv/samba/

    sudo setfacl -R -m g:qrx /srv/samba/share/

    ```


    > Note

    The setfacl command above execute permissions to all files in the /srv/samba/samba
    direc-ory, which you may or may not.


    Now from a Windows client you should notice the new file permissions are implemented.
    See the acl and

    setfac man for more information on POSIX ACLs.


    # Samba AppArmor Profile


    Ubuntu comes with the AppArmor security module, which provides mandatory access
    controls. The default

    Armor profile for Samba will need to be adapted to your configuration. For more
    details using

    AppArmor see??.


    There are default AppArmor profiles for /usr/sbin/smbd and /usr/sbin/smbd, the
    Samba daemon binaries,

    as part of the apparmor-profiles packages. To install the package, from a terminal
    prompt enter:


    ```

    sudo apt install apparmor-profiles apparmor-utils

    ```


    > Note

    This package contains profiles for smbd and other are in complain mode allowing
    Samba to work without modifying

    the profile, and only logging errors. To place the smbd profile into enforce mode,
    and have Samba work as

    expected, the profile will need to be modified to reflect any directories that
    are shared.


    Edit /etc/apparmor.d/usr.sbin.smbd adding information for [share] from the file
    server example:


    ```

    /srv/samba/share/ r,

    /srv/samba/share/** rwkix ,

    ```


    Now place the profile into enforce and reload it:'
