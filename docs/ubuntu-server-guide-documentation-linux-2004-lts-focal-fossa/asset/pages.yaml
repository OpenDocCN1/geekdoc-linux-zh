    # Executing the Script


    # Executing from a Terminal


    The simplest way of executing the above backup script is to copy and paste the
    contents into a file. backup.sh for example. The file must be made executable:

    chmod u+x backup.sh


    Then from a terminal prompt:


    ```

    sudo ./backup.sh

    ```


    This is a great way to test the script to make sure everything works as expected.


    # Executing with cron


    The cron utility can be used to automate the script execution. The cron daemon
    allows the execution of scripts, commands, at a specified time and date

    cron configured through entries in a crontab file. crontab files are separated
    into fields:


    ```

    # m h dom mon dow command

    ```


    +   - m: minute the command executes on, between 0 and 59.

    - h: hour the command executes on, between 0 and 23.

    - dom: day of month the command executes on.

    - mon: day of the week the command executes on, between 1 and 12.

    - dow: day of the week the command executes on, between 0 and 7. Sunday may be
    specified by 0 or 7, both values are valid.

    - command: the command to execute.


    To add or change entries in a crontab file the crontab -e command should be used.
    Also, the contents of a crontab file can be viewed using the crontab -l command.

    To execute the backup.sh script listed using cron. Enter the following from a
    terminal prompt:


    ```

    sudo crontab -e

    ```


    # Note


    Using with the crontab -e command edits the root user''s crontab. This is necessary
    if you are backing up directories only the root user has access to.

    Add the following to your crontab file:


    ```

    # m h dom mon dow command

    0 * * * bash /usr/local/bin/backup.sh

    ```'
