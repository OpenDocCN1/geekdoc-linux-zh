  md: "# Preconfiguration\n\nPrior to configuring puppet you may want to add a DNS\
    \ CNAME record for puppet.example.com, where example.com is your domain. By default\
    \ Puppet clients check DNS for puppet.example.com as the puppet server name, or\
    \ Puppet Master. See Domain Name Server for more details.\n\nIf you do not to\
    \ use DNS, you can add entries to the server and /etc/hosts file. For example,\
    \ if the Puppet server's /etc/hosts file add:\n\n```\n127.0.0.1 localhost.localdomain\
    \ localhost puppet\n192.168.1.17 puppetclient .example.com puppetclient\n```\n\
    \nOn each Puppet client, add an entry for the server:\n\n```\n192.168.1.16 puppetmaster\
    \ .example.com puppetmaster puppet\n```\n\n# Note\n\nReplace the IP addresses\
    \ and domain names above with your your actual server and client addresses and\
    \ domain names.\n\n# Installation\n\nTo install Puppet, in a terminal on the server\
    \ enters:\n\n```\nsudo apt install puppetmaster\n```\n\nOn the client machine,\
    \ or machines, enter:\n\n```\nsudo apt install puppet\n```\n\n# Configuration\n\
    \nCreate a folder path for the apache2 class:\n\n```\nsudo mkdir -p /etc/puppet/modules/apache2/manifests/init.pp\n\
    ```\n\nNow setup some resources for apache2. Create a file /etc/puppet/modules/apache2/manifests/init.pp\
    \ containing the following:\n\n```\nclass apache2 {\n  package `apache2` {\n \
    \   ensure => installed\n  }\n  service { `apache2` {\n    ensure => true,\n \
    \   enable => true,\n    require => Package['apache2'],\n  }\n}\n```\n\nNext,\
    \ create a node file /etc/puppet/code/environments/production/manifests/site.pp\
    \ with:\n\n```\nnode `puppetclient.example.com` {\n  include apache2\n}\n```"
