    # Extending Volume Groups


    Continuing with srv as an LVM volume group, this section covers adding second
    hard disk, creating a Physical Volume (PV), adding it to the volume group (VG),
    extending the logical volume srv and finally extending the filesystem. This example
    assumes a second hard disk has been added to the system. In this example, this
    hard disk will be named /dev/sdb and we will use the disk as a physical volume
    (you could choose to create partitions and use them as different physical volumes)


    # Warning


    Make sure you don''t already have an existing /dev/sdb before issuing the commands
    below. You could lose some data if you use these commands on a non-empty disk.


    First, create the Volume Group, in a terminal:


    ```

    sudo pvcreate /dev/sdb

    ```


    Now extend the Volume Group (VG):


    ```

    sudo vgextend vg0 /dev/sdb

    ```


    Use vgdisplay to find out the free extents - Free PE / size (the size you can
    allocate). We will assume a free size of 511 PE (equivalent to 2GB with a PE size
    of 4MB) and we will use the whole free space available. Use your own PE andor
    free space.


    The Logical Volume (LV) can be extended by different methods, we will only see
    how to use the PE to extend the LV:


    ```

    sudo lvextend /dev/vg0/srv -l +511

    ```'
