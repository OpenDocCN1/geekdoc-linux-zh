    \ {CRYPT}x\n```\n\nThen add it with ldapadd:\n\n```\n$ ldapadd -x -ZZ -D cn=admin,dc=example,dc=com\
    \ -W -f replicator.ldif\nEnter LDAP Password:\n  add entry cn=replicator,dc=example,dc=com\n\
    ```\n\nNow set a password for it with ldappass:\n\n```\n$ ldappasswd -x -ZZ -D\
    \ cn=admin,dc=example,dc=com -W -S cn=replicator,dc=\nexample,dc=com\nNew password:\n\
    Re-enter new password:\nEnter LDAP Password:\n```\n\nThe next step is to give\
    \ this replication user the correct privileges:\n\n+   - read access to the content\
    \ that we want replicated\n- no search limits on this content\n\nFor we need to\
    \ update the ACLs on the provider. Since first check what the existing\nACLs look\
    \ like on the dc=example,dc=com tree:\n\n```\n$ ldapsearch -q -Y EXTERNAL -H ldapi:///\
    \ -LLL -b cn=config '(olcSuffix=dc=\nexample,dc=com'\ndn: olcDatabase={1}mdb,cn=config\n\
    olcAccess:{0} to attrs=userPassword by write by anonymous auth by * none\nolcAccess:{1}\
    \ to attrs=addLastChange by write by * read\nolcAccess:{2} to * read\n```\n\n\
