    # Upgrading


    There are several ways to upgrade from one Ubuntu release to another. This section
    gives an overview of the recommended upgrade method.


    # do-release-upgrade


    The recommended way to upgrade a Server Edition installation is to use the do-release-upgrade
    utility. Part of the update-manager-core package, does not have any graphical
    dependencies and is installed by default.


    Debian based systems can also be upgraded by using apt-upgrade. However, using
    do-release-upgrade is recommended because it has the ability to handle system
    configuration changes sometimes needed between releases.


    To upgrade to a newer release, from a terminal prompt enter:


    ```

    do-release-upgrade

    ```


    It is possible to use do-release-upgrade to upgrade to a development version of
    Ubuntu. To accomplish this


    ```

    do-release-upgrade -d

    ```


    # Warning


    Upgrading to a development release is not recommended for production environments.


    For further stability of an LTS release, there is a slight change in behaviour
    if you are currently running an LTS version. LTS systems are only automatically
    considered for an upgrade to the next LTS via do-release-upgrade with the first
    release. For example 18.04 will only upgrade once 20.04.1 is released. If you
    want to update before, e.g. on a subset of machines to evaluate the LTS upgrade
    for your setup the same argument as an upgrade to a dev release has been via the
    -d switch'
