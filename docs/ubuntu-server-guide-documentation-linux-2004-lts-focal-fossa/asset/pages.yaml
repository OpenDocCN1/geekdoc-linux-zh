  md: 'Deleting an account does not remove their respective home folder. It is up
    to you whether or not wish to delete the folder manually or keep it according
    to your desired retention policies.


    Remember, any user added later with the same UID/GID as the previous owner will
    now have access to this holder if you have not taken the necessary precautions.


    You may change these UID/GID values to something more appropriate, such as the
    root account, and perhaps relocate the folder to avoid future conflicts.


    ```

    sudo chown -R root /home/username/

    sudo mkdir /home/username/archived_users/

    sudo mv /home/username/archived_users/

    ```


    +   To temporarily lock or unlock a user password, use the following syntax:

    - sudo passwd -l username

    - sudo passwd -u username


    +   To add or delete a personalized group, use the following syntax:

    - sudo addgroup groupname

    - sudo delgroup groupname


    +   To add a user to a group, use the following syntax:

    - sudo adduser username groupname


    # User Profile Security


    When a new user is created, the adduser utility creates a brand new home directory
    named /home/username. The default profile is modeled after the contents found
    in the directory of /etc/skel, which includes all profile basics.


    If your server will to be multiple users, you should pay close attention to the
    user home directory permissions to ensure confidentiality. By default, home directories
    in Ubuntu are created with world read/execute permissions. This means that all
    users can access and the contents of other user directories. This may not be suitable
    for your environment.


    +   To verify your current user home directory permissions, use the following
    syntax:

    - ls -ld /home/username


    The following output shows that the directory /home/username has read-writable
    permissions:

    dwx-xr-x 2 username username 4096 2007-10-02 20:03 username


    +   You can remove the world-readable permissions using the following syntax:

    - sudo chmod 0750 /home/username


    # Note


    Some people tend to use the recursive option (-R) indiscriminately which modifies
    all child folders and files, but this is not necessary, and may yield other undesirable
    results. The parent directory is sufficient for preventing unauthorized access
    to anything below the parent.


    A much efficient approach to the matter would be to modify the adduser global
    default permissions when creating a new home folders. Simply edit the file /etc/adduser.conf
    and modify the DIR_MODE variable to something appropriate, so that all new home
    directories will receive the correct permissions.'
