  md: "running --policy=service-time 0 prio=50 status=enabled 8:0:0:1 sdf 88 active\
    \ running\n\nIf the path is ready for I/O, the status of the path is ready or\
    \ ghost. If the path is down, the status is faulty or shaky. The path status is\
    \ updated periodically by the multipath daemon based on the polling interval defined\
    \ in the /etc/multipath.conf.\n\nThe dm_status is similar to the path status,\
    \ but from the kernel's point of view. The dm_status has two states: failed, which\
    \ is analogous to faulty, active, which covers all other path states. Occasionally,\
    \ the path state and the dm state of a device will not agree.\n\nThe possible\
    \ values for online_status are running and offline. A status of offline means\
    \ the SCSI device has been damaged.\n\n# Multipath Queries with multipath Command\n\
    \nYou can use the -l and -ll options of the multipath command to display the current\
    \ multipath configuration. The -l option displays multipath topology gathered\
    \ from information in sysfs and the device mapper. The -ll option displays the\
    \ information -ll in addition to all available components of the system.\n\nWhen\
    \ displaying the multipath configuration, there are three verbosity levels you\
    \ can see with the -v option of the multipath command. Specifying -v0 yields no\
    \ output. Specifying -v1 outputs the created or updated multipath names only,\
    \ which you can then feed to tools tools as kpart. Specifying -v2 detects all\
    \ paths, multipaths, and devices.\n\n> Note The default verbosity level of multipath\
    \ is 2 and can be globally modified by defining the verbosity attribute in the\
    \ defaults section of multipath.conf.\n\nThis example shows the output of a multipath\
    \ -l\n\n```\n$ multipath\nmultipath (360014506eee8ec6114facb59086482) dm-0 LIO-ORG,Lun01\n\
    size=2.0G features=0 hwinder=1 alua wp=rw\n+- policy=service-time 0 prio=0 status=active\n\
    \  +- 7:0:0:1 sda 8:64 active undef\n  +- policy=service-time 0 prio=50 status=enabled\n\
    \  +- 8:0:0:1 sdf 8:60 active undef running\nmultipath (360014053ce2841330c4b3fe1bb998)\
    \ dm-1 LIO-ORG,Lun02\nsize=1.0G features=0 hwinder=1 alua wp=rw\n+- policy=service-time\
    \ 0 prio=0 status=active\n  +- 7:0:0:2 sdc 8:32 active undef running\n  +- policy=service-time\
    \ 0 prio=0 status=enabled\n```\n\n# Determining Device Mapper Entries with dmset\
    \ Command\n\nYou can use the dmset command to find which device mapper matches\
    \ the multipathed devices. The following command displays all the multipath devices\
    \ and their major and minor numbers. The minor numbers determine the name of the\
    \ dm device. For example, a minor number of 1 corresponds to the multipath device\
    \ /dev/dm1.\n\n```\n$ dmset ls\nmultipath (253:1)\nmultipa (253:1)\n\n$ ls -lahd\
    \ /dev/dm*\n```"
