  md: "The advantage of using DHCP is that changes to the network, for example a change\
    \ in the address of the DNS server, need only be changed at the DHCP server, and\
    \ all network hosts will be reconfigured the next time DHCP clients poll the DHCP\
    \ server. As an added advantage, it is also easier to integrate new computers\
    \ into the network, as there is no need to check for the availability of an IP\
    \ address. Conflicts in IP address allocation are also reduced.\n\nDHCP server\
    \ can provide configuration settings using the following methods:\n\n+   - **Manual\
    \ allocation (MAC address)**\n  This method entails using DHCP to identify the\
    \ unique hardware address of each network card connected to the network and then\
    \ continually supplying a constant configuration each time the DHCP client requests\
    \ the DHCP server using that network device. This ensures that a particular address\
    \ is assigned automatically to that network card, based on its MAC address.\n\
    - **Dynamic allocation (pool)**\n  In this method, the DHCP server will assign\
    \ an IP address from a pool of addresses (sometimes called a range) for a period\
    \ of time or which is configured on the server or until the client informs the\
    \ server it doesn't need the address anymore. This, the client will be receiving\
    \ their configuration dynamically and on a \"first come, first served\". When\
    \ a DHCP client is no longer on the network for a specified period, the configuration\
    \ is expired and released back to the pool for use by other DHCP Clients. This\
    \ way, the client has to negotiate the lease with the server to maintain use of\
    \ address.\n- **Automatic allocation**\n  Using this method, the DHCP automatically\
    \ assigns an IP address permanently to a client, selecting from a pool of addresses.\
    \ Usually DHCP is used to assign an address to a client, and a DHCP server can\
    \ allow an infinite lease.\n\nThe last two methods can be considered \"automatic\"\
    \ because in each case the DHCP server assigns an address with no extra intervention\
    \ needed. The difference between them is in how long the IP address is leased,\
    \ in words whether a client's address varies over time. The DHCP server Ubuntu\
    \ makes available dhcpd (dynamic host configuration protocol daemon), which is\
    \ easy to install and configure and will be automatically started at boot system.\n\
    \n# # Installation\n\nAt a terminal prompt, enter the following command to install\
    \ dhcpd:\nsudo apt install isc-dhcp-server\n\nNOTE: dhcpd messages are being sent\
    \ to syslog. Look there for diagnostics messages.\n\n# # Configuration\n\nYou\
    \ will probably need change the default configuration by editing /etc/dhcp/dhcpd.conf\
    \ to suit your needs and particular configuration.\n\nMost commonly, what you\
    \ want to do is assign an IP address randomly. This can be done with settings\
    \ as:\n\n```\n# minimal sample /etc/dhcp/dhcpd.conf\ndefault-lease-time 600;\n\
    max-lease-time 7200;\n```\n\nsubnet 192.168.1.0 netmask 255.255.255.0 {"
