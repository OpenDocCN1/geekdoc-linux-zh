  md: 'selected as a boot device (a disk with an existing GPT partition table can
    only be used as a boot device if it has this partition).


    In UEFI mode, the bootloader loaded from a "EFI System Partition" (ESP), which
    is a partition with a particular type GUID. The installer automatically creates
    a 512MiB ESP on a disk when it is selected as a boot device and will install grub
    to (a disk with an existing partition table can only be used as a boot device
    if it has an ESP –loaders for multiple operating systems can be installed into
    a single ESP). UEFI defines a standard way to configure the way in which the operating
    system is chosen on boot, and the installer uses this to configure the system
    to boot the just-installed operating system. One of the ESPs must be mounted at
    /boot/efi.


    Supported amd64 servers using boot UEFI, and are configured the same way as an
    UEFI-booting amd64 system.


    ppce64 systems also load their bootloader (pettiboot, a small linux kernel) and
    a "PreP" partition with a special flag, so in many ways they are similar to a
    UEFI system. The installer only supports PreP partition at this time.


    # Limitations and workarounds


    Currently the installer cannot edit partitions. You can use existing partitions
    or reformat a drive entirely you want, for example, expand a large partition and
    replace it with two smaller ones.


    The installer allows the creation of LVM volume groups and logical and MD devices,
    but not allow tweaking of the parameters – example, all logical volumes are linear
    and all MD devices use the default metadata format (1.2).


    These limits can be worked around in the same way: drop to a shell and use the
    usual command to edit the partition table or create the LV or RAID with desired
    parameters, and then select these partitions or devices as mount points in the
    installer. Any changes you make while the installer is running but before altering
    the storage configuration will be reflected in the installer.


    The installer cannot configure SCSI devices, ZFS at all, or btrfs subsystems.


    # Automated Server Installs


    # Introduction


    The server installer for 20.04 supports a new mode of operation: automated installation,
    autoinstallation for short. You might also know this feature as unattended or
    handoff or preceded installation.


    Autoinstall lets you define all configuration questions ahead of time with an
    autoinstall config and lets the installation process run without any interaction.


    # Differences from debian-installer proceeding


    preseeds are the way to automate an installer based on debian-installer (aka d-i).

    autoinstalls for the new server installer differs from the following ways:


    +   - the format is completely different (cloud-init config, usually yaml, vs
    debconf-select-selections format)


    +   - when the answer to a question is not present in a preset, d-i stops and
    asks the user for input.

    autoinstalls are not like this by: if there is an autoinstall config at all, the
    installer takes the default for any unanswered question (and fails if there is
    no default),'
  merge: -1
