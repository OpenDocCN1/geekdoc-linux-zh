    deb-sec http://us.archive.ubuntu.com/ubuntu/ DISTRO-SHORT-CODENAME multiverse


    deb http://us.archive.ubuntu.com/ubuntu/ DISTRO-SHORT-CODENAME-updates

    universe

    ```'
