- img_proc: true
  md: '# TCP/IP Configuration


    The TCP/IP protocol configuration consists of several elements which must be set
    by editing the appropriate configuration files, or deploying solutions such as
    the Dynamic Host Configuration Protocol (DHCP) server which in turn, can be configured
    to provide the proper TCP/IP configuration settings to network clients automatically.
    These configuration values must be set correctly in order to facilitate the proper
    network operation of your Ubuntu server.


    The common configuration elements of TCP/IP and their purposes are as follows:


    +   - IP Address is a unique identifying string expressed as four decimal numbers
    ranging from zero (0) to two-hundred and twenty-five (255), separated by periods,
    each of the four numbers representing eight (8) bits of the address for a total
    of thirty-two (32) bits for the address. This format is called *dotted notation*.


    +   - Network Mask (or, *netmask*) is a local bit, or set of flags that separate
    the portions of an IP address to the network and the *subnet*. For example, in
    a Class C network, the standard mask is 255.255.255.0 which masks the first three
    bytes of the IP address and allows the last byte of the IP address to remain available
    for hosts in the subnet.


    +   - Network Address Network Address represents the bytes comprising the network
    portion of an IP address. For example, the 122.128.1 in a Class A network would
    use 122.0.0.0 as the network address, where 122 represents the first byte of the
    IP address, (the network part) and zeros (0) in any of the remaining three bytes
    to represent the host value. A network host using the private IP address 192.168.1.100
    would turn into a Network Address of 192.168.1.0, which specifies the first three
    bytes of the Class C 192.168.1 and a zero (0) for all possible hosts on the network.


    +   - Broadcast Address The Broadcast Address is an IP address which allows data
    to be sent simultaneously to all hosts on a given subnet without specifying a
    host. The standard general broadcast address for IPs is 255.255.255.255, but this
    broadcast address cannot be used to send a message to every host on the internet
    because routers block it. A more appropriate broadcast address is set to match
    a specific subnet. For example, on the private Class C network 192.168.1.0, the
    broadcast address is 192.168.1.255. Broadcast messages are typically produced
    by network protocols such as the Address Resolution Protocol (ARP) and the Routing
    Information Protocol (RIP).


    +   - Gateway Address Gateway is the IP address through which a particular network,
    or host on a network, may be reached. If one host wishes to communicate with another
    network host, a *gateway* must be used. In many cases, the Gateway Address will
    be of a router on the same network, which will in turn pass traffic to other networks
    or hosts, such as Internet. The value of the Gateway Address setting must be correct,
    or you will not be able to reach any hosts beyond the same network.


    +   - Nameserver Address Nameserver represent the IP addresses of Domain Name
    Service (DNS) systems, which resolve hostnames into IP addresses. There are three
    levels of Nameserver: the *Primary*, the *Secondary*, and the *Tertiary* Nameserver.
    For your system to be able to resolve hostnames into their corresponding IP addresses,
    you must specify valid Nameserver addresses you are authorized to use in your
    TCP/IP configuration. In many cases these addresses can will be provided by your
    name service provider, but many free and publicly accessible nameservers are available
    for use, such as the *Level2 (Verizon)* servers with IP addresses from 4.2.2.1
    to 4.2.2.


    Tip The IP address, Network Address, Broadcast Address, Gateway Address,'
