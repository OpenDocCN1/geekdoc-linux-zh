    # FTP Server


    File Transfer Protocol (FTP) is a TCP protocol for downloading files between computers.
    In the past, it has also been used for uploading, but that method does not use
    encryption, user credentials and data transferred in clear are easily intercepted.
    If you are looking for a way to upload and download files securely see the OpenSSH
    documentation instead.


    FTP works on a client/server model. The server component is called an FTP daemon.
    It continuously listens for requests from remote clients. When a request is received,
    it manages the login and sets up the connection. For the duration of the session
    it executes any of commands by the FTP client.


    Access to FTP server can be managed in two ways:


    +   - Anonymous

    - Authenticated


    In the Anonymous mode, remote clients can access the FTP server using the default
    user account "anonymous" or "ftp" and sending an email address as the password.
    In the Authenticated mode user must have an account and password. This latter
    choice is better and should not be used except in special circumstances. If you
    are looking to transfer files securely see SFTP in the section OpenSSH-Server.
    Access to the FTP server directories and files is dependent on the permissions
    defined for the account used at login. As a general rule, the FTP daemon will
    hide the root directory of the FTP server and change it to the FTP Home directory.
    This hides the rest of the file system from remote sessions.


    # vsftpd - FTP Server Installation


    vsftpd is an FTP daemon available in Ubuntu. It is easy to set, up, and maintain.
    To install vsftpd you can run the following command:


    ```

    sudo apt install vsftpd

    ```'
