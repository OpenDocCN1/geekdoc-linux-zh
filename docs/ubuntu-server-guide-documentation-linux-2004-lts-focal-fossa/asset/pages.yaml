    # DPDK HugePage configuration


    DPDK makes heavy use of hugepages to eliminate pressure on the TLB. Therefore
    hugepages have to be configured in your system.


    The dpdk package has a config file and scripts that try to ease hugepage configuration
    for DPDK in the form of /etc/dpdk/dpdk.conf. If you have more hugepages than just
    DPDK in your system or very special requirements how your hugepages are to be
    set you likely want to allocate/control by yourself. If this not be a great simplification
    to get DPDK configured for your needs.


    Here example configuring 1024 Hugepages of 2M and 4G pages.


    ```

    NR_2M_PAGES=1024

    NR_1G_PAGES=4

    ```


    As shown supports configuring 2M and the larger 1G hugepages (or a mix of both).
    It will make there are proper hugetlbfspoints to find sizes no matter what your
    default page size is. The config file itself holds details on corner cases and
    a few hints on how to allocate hugepages manually via a kernel parameter.


    It depends on your needs which you want - 1G pages are more effective regarding
    TLB pressure. But there were reports of fragmenting inside the DPDK memory allocations.
    It can also be harder to grab enough space to set up a certain amount of 1G pages
    later in the life-cycle of a system.


    # Compile DPDK Applications


    Currently there are not consumers of the DPDK library that are stable and released.
    OpenSwitch-DPDK being an exception to that (see below) and more are appearing.
    But in general it still happen that you might want to compile an against the library.


    You will find guides that tell you to fetch the DPDK sources, build them to your
    needs and eventually build your application based on DPDK by setting values RTE_
    * for the build system. Since Ubuntu provides an already compiled pkg-DPDK for
    you we can skip that all.


    DPDK provides a valid pkg-config file to simplify setting the variables and options.


    ```

    sudo apt-get install dpdk-dev libdpdk-dev

    gcc testdpdkprog.c $(pkg-config --flags libdpdk) -o testdpdkprog

    ```


    An example of a complex (autoconfig) user of pkg-config of DPDK including fallbacks
    to older non pkg-config style can be seen in the OpenSwitch build system.


    Depending on what you might build it is a great addition to all of DPDK build
    dependencies the make, which on Ubuntu can be done automatically with.


    ```

    sudo apt-get install build-dep dpdk

    ```'
