    # Extra Repositories


    In addition to the officially supported repositories available for Ubuntu, there
    exist additional community-maintained repositories which adds more packages for
    potential installation. Two of the most popular are the universe and multiverse
    repositories. These repositories are not officially supported by Ubuntu, but they
    are maintained by the community they generally provide packages which are safe
    for use with your Ubuntu computer.


    # Note


    Packages in the multiverse or multiverse repositories contain officially supported
    packages. In particular, there may prevent them from being distributed with a
    free operating system, and they may be illegal in your local.


    # Warning


    Be advised that the universe or multiverse repositories contain officially supported
    packages. In particular, there may not be security updates for these packages.


    Many other sources are available, even offering only one package, as in the case
    of package sources provided by the developer of a single application. You should
    always be careful and cautious when using non-standard package sources, however.
    Research the source and packages carefully before performing installation, as
    some package sources and packages could render your system unstable or nonfunctional
    in some respects.


    By default, the universe and multiverse repositories are enabled but if you would
    like to disable them edit /etc/apt/sources.list and comment the following lines:


