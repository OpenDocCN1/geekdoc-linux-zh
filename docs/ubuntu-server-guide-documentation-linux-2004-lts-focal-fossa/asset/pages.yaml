  md: 'The upstream LXC project is hosted at linuxcontainers.org.


    # Databases


    Ubuntu provides two popular database servers. They are:


    +   - MySQL

    - PostgreSQL


    Both are popular choices among developers, with similar feature sets and performance
    capabilities. Historically, Postgres tended to be a preferred choice for its attention
    to standards conformance, features, and extensibility, whereas MySQL may be more
    preferred for higher performance requirements, over time each has made good strides
    catching up with the other. Specialized needs may make one a better option for
    a certain application, but in general both are good strong options.


    They are available in the main repository and well supported by Ubuntu. This section
    explains how to install and configure these database servers.


    # MySQL


    MySQL is a fast, multi-threaded, multi-user, and robust SQL database server. It
    is intended for mission-critical, heavy-load production systems and mass-deployed
    software.


    # Installation


    To install MySQL, run the following command from a terminal prompt:


    ```

    sudo apt install mysql-server

    ```


    Once the installation is complete, the MySQL server should be started automatically.
    You can quickly check its current status via는지:


    ```

    mysql.service - MySQL Community Server

    Loaded: loaded ((lib/systemd/system/mysql.service; enabled; vendor preset: enabled)

    Active: (running) since Tue 2019-10-08 14:37:38 UTC; 2 weeks 5 days ago

    Main PID: 2028 (mysql)

    Tasks: 28 (limit: 4915)

    ControlGroup: /system.slice/mysql.service

    2028/ /usr/bin/mysqld --daemonize --file=/run/mysql/mysqld.pid

    ```


