- img_proc: true
  md: "+   * log_checker_err\n* reservation_key\n* all_tg_pt\n* retain_attached_hw_handler\n\
    * detect_prio\n* detect_checker\n* force_xne\n* strict_timing\n* deferred_remove\n\
    * partition_delimiter\n* config_dir\n* san_path_err_threshold\n* san_path_err_forget_rate\n\
    * san_path_err_recovery_time\n* marginal_path_err_double_failed_time\n* marginal_path_err_sample_time\n\
    * marginal_path_err_rate_threshold\n* marginal_path_err_recheck_gap_time\n* delay_watch_checks\n\
    * delay_wait_checks\n* multipath_groups\n* find_multipaths\n* find_multipaths_timeout\n\
    * ussock_timeout\n* retry_triggers\n* retry_delay\n* missing_uev_wait_timeout\n\
    * skip_lpartx\n* disable_changed_wids\n* remove_retries\n* max_sectors_kb\n* ghost_delay\n\
    *enable_foreign\n\nPreviously the multipath project used to provide a complete\
    \ configuration file with the most used options for each of the most used storage\
    \ devices. Currently you can see all those default options by executing sudo multipath\
    \ -t. This will dump used configuration file including all the embedded default\
    \ options.\n\n# ## Configuration File Blacklist & Exceptions\n\nThe blacklist\
    \ section is used to exclude specific devices from the multipath topology. It\
    \ is most commonly used to exclude local devices, non-multipath OR non-disk devices.\n\
    \n+   1. Blacklist by devnode\n\nThe default blacklist consists of the regular\
    \ expressions \"[ram|zram|raw|loop|fd|md|dm-|sr|scd|dcssblk][0-9]*\" and \"(td|hd|vd)[a-z]*\"\
    . This causes virtual devices, non-disk devices, and some other device types to\
    \ be excluded from multipath handling by default.\n\n```\nblacklist {\n  devnode\
    \ \"(ram|zram|raw|loop|fd|md|dm-|sr|st|scd|dcssblk) [0-9]*\"\n  devnode \"(td|hd|vd)[a-z]*\"\
    \n  devnode ~~cciss!c[0-9]d[0-9]*\"\n}\n```"
