    # Byobu


    One of the most useful applications for any system administrator is an xterm multiplexer
    such as screen or tmux. It allows for the execution of multiple shells in one
    terminal. To make some of the advanced multiplexor features more user-friendly
    and provide some useful information about the system, the byobu package was created.
    It acts as a wrapper to these programs. By default Byobu is installed in Ubuntu
    server and it uses tmux (if installed) but this can be changed by the user.


    Invoke it with simply:

    byobu


    Now bring up the configuration menu. By default this is done by pressing the F9
    key. This will allow you to:


    +   - Help - Quick Start Guide

    - Toggle status notifications

    - Change the escape sequence

    - Byobu currently does not launch at login (toggle)


    byobu provides a menu which displays the Ubuntu release, processor information,
    memory information, and the time and date. The effect is similar to a desktop
    menu.


    Using "Byobu currently does not launch at login (toggle on)" option will cause
    byobu to be executed when a terminal is opened. Changes made to byobu are on per
    user basis, and will not affect other users on the system.


    One difference when using byobu is the scrollback mode. Press the F7 to enter
    scrollback mode. Scrollback mode allows you to navigate past output like vi. Here
    is a quick list of movement commands:'
