  md: '# OpenSSH Server


    # Introduction


    OpenSSH is a powerful collection of tools for the remote control of, and transfer
    of data between, networked computers. You will also learn some about the configuration
    settings possible with the OpenSSH server application and how to change them on
    your Ubuntu system.


    OpenSSH is a freely available version of the Secure Shell (SSH) protocol family
    of tools for remotely controlling, or transferring files between. Traditional
    tools used to accomplish these functions, such as telnet or rpc, are insecure
    and threaten the user''s password in cleartext when used. OpenSSH provides a server
    daemon and client tools to facilitate secure, encrypted remote control and file
    operations, effectively replacing the legacy tools.


    The OpenSSH server component, sshd, listens continuously for client connections
    from any of the client tools. When a request occurs, sshd sets up the correct
    connection depending on the type of client connecting. If a remote computer is
    connecting with the ssh client application, the OpenSSH server sets up remote
    authentication. If a remote user connects to an OpenSSH server with sep, the OpenSSH
    server daemon initiates a secure copy of files between the server and client after
    authentication. OpenSSH can use many authentication methods, including plain password,
    public key, and Kerberos tickets.


    # Installation


    Installation of the OpenSSH client and server applications is simple. To install
    the OpenSSH client applications on your Ubuntu system, use this command at a terminal
    prompt:


    ```

    sudo apt install openssh-client

    ```


    To install the OpenSSH server application, and related support files, use this
    command at a terminal prompt:


    ```

    sudo apt install openssh-server

    ```


    # Configuration


    You may configure the default behavior of the OpenSSH server application, sshd,
    by editing the file /etc/ssh/sshd_config. For information about the configuration
    directives used in this file, you may view the appropriate manual page with the
    following command, issued at a terminal prompt:


    ```

    man sshd_config

    ```


    There are many directives in the sshd configuration file controlling such things
    as communication settings, and authentication modes. The following are examples
    of configuration directives that can be changed by editing the /etc/ssh/sshd_config
    file.


    # Tip


    Prior to editing the configuration file, you should make a copy of the original
    file and protect it from writing so that you will have the original settings as
    a reference to use as necessary.


    Copy the /etc/ssh/sshd_config file and protect it from writing with the following
    commands, issued at a terminal prompt:


    ```

    sudo cp /etc/ssh/sshd_config /etc/ssh/sshd_config.original

    sudo chmod a-w /etc/ssh/sshd_config.original

    ```'
