  md: '# Dovecot Server


    Dovecot is a Mail Delivery Agent, written with security primarily in mind. It
    supports the major mailbox

    formats: mbox or Maildir. This section explains how to set it up as an IMAP or
    POP3 server.


    # Installation


    To install a basic Dovecot server with common POP3 and IMAP functions, run the
    following command:


    ```

    sudo apt install dovecot-imapd dovecot-pop3

    ```


    There are other Dovecot modules including dovecot-sieve (mail filtering), dovecot-sol
    (full text

    search), dovecot-antispam (spam filtering), dovecot-ldap (user directory).


    # Configuration


    To configure Dovecot, edit the file /etc/dovecot/dovecot.conf and its included
    config files in /etc/dovecot/conf

    d/. By default all protocols will be enabled via an include directive in /etc/dovecot/conf

    !include_try /usr/share/dovecot/protocols.d/*.protocol


    IMAPS and POP3 are more secure because they use SSL encryption to connect. A basic
    self-signed SSL

    certificate is automatically set up by package-cert and used by Dovecot in /etc/dovecot/conf.d/10-ssl.

    conf.


    By default mbox format is configured, if required you can also use Maildir. More
    about that can be found in

    the comments in /etc/dovecot/conf.d/10-mail.conf. See the Dovecot web site to
    learn about further

    bands and details.


    Make sure to configure your Mail Transport Agent (MTA) to transfer the incoming
    mail to the selected

    type of mailbox.


    Once you have configured Dovecot, restart its daemon in order to test your setup:


    ```

    sudo service dovecot restart

    ```


    Try to log in with the commands telnet localhost pop3 (for POP3) or telnet localhost
    imap2 (for IMAP).

    You should see something like the following:


    ```

    $bhuvanrainbow:~ telnet localhost pop3

    Trying 127.0.0.1...

    Connected to localhost.localdomain.

    Escape character is ''^]'';

    +OK Dovecot ready.

    ```


    # Dovecot SSL Configuration


    Dovecot is configured to use SSL automatically by default, using the package ssl-cert
    which provides a bas

    signed certificate.


    You can generate your own custom certificate for Dovecot using openssl, for example:


    ```

    sudo openssl req -new -x509 -days 365 -nodes "/etc/dovecot/dovecot.pem"

    \-keyout "/etc/dovecot/private/dovecot.pem"

    ```'
