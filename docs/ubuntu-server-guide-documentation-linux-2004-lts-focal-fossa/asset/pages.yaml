  md: '+   systemctl can be used to reload all profiles:


    sudo systemctl reload apparmor.service


    +   The /etc/apparmor.d/disable directory may be used along with the apparmor_parser
    -R option to disable a profile.


    sudo in -s /etc/apparmor.d/profile_name /etc/apparmor.d/disable/ sudo apparmor_parser
    -R /etc/apparmor.d/profile_name


    To re-enable a disabled profile remove the symbolic link to the profile in /etc/apparmor.d/disable/.
    Then load the profile using the -a option.


    sudo rm /etc/apparmor.d/disable/.name cat /etc/apparmor.d/profile_name | sudo
    apparmor_parser -a


    +   AppArmor can be disabled, and the kernel module unloaded by entering the following:
    sudo systemctl stop apparmor.service systemctl disable apparmor.service


    +   To re-enable AppArmor enter: sudo systemctl enable apparmor.service sudo systemctl
    start apparmor.service


    # Note


    Replace profile.name with the name of the profile you want to manipulate. Also,
    replace /path/to/bin/ with the actual executable file path. Example for the ping
    command use /bin/ping


    # Profiles


    AppArmor profiles are simple text files located in /etc/apparmor.d/. The files
    are named after the full path to the executable they profile replacing "/" with
    ". Example /etc/apparmor.d/bin.ping is the AppArmor profile for /bin/ping command.


    There are two types of rules used in profiles:


    +   Path entries: detail which files an application can access in the file system.


    +   Capability entries: determine what privileges a confined process is allowed
    to use.


    As an example, take a look at /etc/apparmor.d/bin.ping:


    ```

    #include <tunables/global>

    /bin/ping flags=(complain) {

    #include <abstractions/base>

    #include <abstractions/consoles>

    #include <abstractions/nameservice>

    ```


    ```

    capability net_raw,

    capability setuid,

    network inet raw,


    /bin/ping mixer,

    /etc/modules.conf r,

    }

    ```'
