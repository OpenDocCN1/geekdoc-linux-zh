  md: '# LDAP Configuration


    We will now configure the LDAP server so that it can accomodate Samba data. We
    will perform three tasks in this section:


    +   - Import a schema

    - Index some entries

    - Add objects


    # Samba schema


    In order for OpenLDAP to be used as a backend for Samba, the DIT will need to
    use attributes that can properly describe Samba data. Such attributes can be obtained
    by introducing a Samba LDAP schema. Let''s do this now.


    The schema is found in the now-installed samba package and is already in the ldif
    format. We can import it with one simple command:


    ```

    sudo ldapadd -Q -Y EXTERNAL -H ldapi:/// -f /usr/share/doc/samba/examples/LDAP/samba.ldif

    ```


    To query and view this schema:


    ```

    sudo ldapsearch -Q -LLL -Y EXTERNAL -H ldapi:/// -b cn=schema,cn=config ''cn=*''

    ```


    # Samba indices


    Now that slapd knows the Samba attributes, we can set up some indices on them.
    Indexing entries is a way to improve performance when a client performs a filtered
    search on the DIT.


    Create the file samba.ldif with the following contents:


    ```

    dn: olcDatabase={1}mdb,cn=config

    changetype: modify

    replace: olcDbIndex

    olDbIndex: objectClass eq

    olDbIndex: uidNumber,gidNumber eq

    olDbIndex: loginShell eq

    olDbIndex: uid,cn=schema,cn=config eq*

    olDbIndex: memberUid eq,sub

    olDbIndex: member,uniqueMember eq

    olDbIndex: sambaSID,sub eq

    olDbIndex: sambaPrimaryGroupID eq

    olDbIndex: sambaGroupType eq

    olDbIndex: sambaDomainList eq

    olDbIndex: default eq,sub

    ```


    Using the ldapmodify utility to load the new indices:


    ```

    sudo ldapmodify -Q -Y EXTERNAL -H ldapi:/// -f samba_indices.ldif

    ```


    If all went well you should see the new indices using ldapsearch:'
  merge: -1
  pgno: 148
- img_proc: true
  md: '```

    sudo ldapsearch -q -LL -Y EXTERNAL -H

    ldap:// -b cn=config olcDatabase={1}mdb olcDbIndex

    ```


    # Adding Samba LDAP objects


    Next, configure the smbdldap-tools package to match your environment. The package
    comes with a configuration helper script smbdldap-config. Before running it, though,
    you should decide on two important configuration settings in /etc/samba/smb.conf.


    +   - netbdios name: how this server will be. The default value is derived from
    the server''s hostname, but truncated at 15 characters.


    +   - workgroup: the workgroup name for this server, or, if you later decide to
    make it a domain controller, this will be the domain.


    It''s important to make these choices now because smbdldap-config will use them
    to generate the config that will be stored in the LDAP directory. If you /etc/samba/smb.conf
    change these values later there will be an inconsistency.


    Once you are happy with netbdios name and workgroup, proceed to generate the smbdldap-tools
    configuration by running the configuration script which will ask you some questions:

    sudo smbdldap-config


    Some of the most important ones:


    +   - workgroup: has to match what you configure in /etc/samba/smb.conf later
    on.


    +   - ldap suffix: has to match the ldap suffix you chose when you configured
    the LDAP server. for example, for ldap user suffix you should use ou=People and
    for computer/machines, use ou=Computers.


    +   - ldap master bind dn and password: use the root DN credentials.


    The smbdldap-populate script will then add the LDAP objects required for Samba.
    It will ask you for a password for the "root" user, which is also the "root" stored
    in LDAP:

    sudo smbdldap-populate -g 10000 -u 10000 -r 10000


    The g -u and -r parameters tell smbdldap-tools where to start the uid and gid
    allocation for the LDAP users. You should pick a start range that does not overlap
    with your local /etc/passwd users.


    You can create a LDIF file containing the new Samba objects by executing smbdldap-populate
    -e samba.ldif. This allows you to look over the changes making everything is correct.
    If it is, rerun the script without the ‘-e’ switch. Alternatively, you can take
    the LDIF and import its data per user.

    Your LDAP directory has the necessary information to authenticate samba users.


    # Samba Configuration


    To configure Samba to use LDAP, edit its configuration file /etc/samba/smb.conf
    commenting out the default passdb backend and adding some ldap-related ones. Make
    sure to use the same values you used when running smbdldap-populate:


    ```

    # backend = tdbams

    workgroup = EXAMPLE

    ```


    # # LDAP Settings'
