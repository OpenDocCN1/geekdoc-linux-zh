    # Backup and Restore


    Now we have ldap running just the way we want, it is specifically to ensure we
    can save all of our work and restore it as needed.


    What we need is a way to backup the directory database(s), specifically the configuration
    backend (cn=config) and the D (dc=example,dc=com). If we are going to backup these
    databases to say, /export/backup, we could use slapcat as shown in the following
    script, /usr/local/bin/ldapbackup:


    ```

    #!/bin/bash


    set -e


    BACKUP_PATH=/export/backup

    SLAPCAT=/usr/bin/slapcat


    nice ${SLAPCAT} -b cn=config > ${BACKUP_PATH}/config.ldif

    nice ${SLAPCAT} -b dc=example,dc=com > ${BACKUP_PATH}/example.com.ldif

    chown root:root chmod 600 ${BACKUP_PATH}/*.ldif

    ```


    # Note


    These files are uncompressed text files containing everything in your directory
    including the tree layout, usernames, and every password. So, you might want to
    consider /export/backup an encrypted partition and even running the script those
    files as it creates. Ideally you should do both, but that depends on your security
    requirements.


    Then, it is just a matter of having a cron script to run this as often as you
    feel comfortable with. For many, once a day suffices. For others, more often is
    required. Here is an example of a cron script called /etc/cron.d/ldapbackup that
    is run every night at 22:45:'
