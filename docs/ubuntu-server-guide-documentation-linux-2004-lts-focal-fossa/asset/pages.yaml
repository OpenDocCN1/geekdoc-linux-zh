- img_proc: true
  md: '2. Disable all your multipath devices on your other machines by running the
    following commands:


    ```

    # systemctl stop multipath-tools.service

    # multipath -F

    ```


    3. Copy the /etc/multipath.conf file from the first machine to all the other machines
    in the cluster.


    4. Re-enable the multipath daemon on all the other machines in the cluster by
    running the following command:


    ```

    # systemctl start multipath-tools.service

    ```


    When you add a new device you will need to repeat this process.


    # Multipath Device attributes


    In addition to the user_friendly_names alias options, a multipath device has numerous
    attributes. You can modify these attributes for a specific multipath device by
    creating an entry for that device in the multipaths section of /etc/multipath.conf.


    For information on the multipath section of the multipath configuration file,
    see DM-Multipath Configuration.


    # Multipath Devices in Logical Volumes


    After creating multipath devices, you can use the multipath device names just
    as you would use a physical device name when creating an LVM physical volume.


    For example, /dev/mapper/impatath is the name of a multipath device, the following
    command will create /dev//mapper/impatath as a physical volume:


    ```

    # pvcreate /dev/mapper/impatath

    ```


    You can use the result LVM physical volume when you create an LVM volume group
    just as you would use any other LVM physical device.


    > Note


    If you attempt to create an LVM physical volume on a whole device on which you
    have configured partitions, the pvcreate will fail.


    When you create an LVM logical volume that uses active/passive multipath arrays
    under the underlying devices, you should include filters in the lvm.conf to exclude
    the disks that underlie the multipath devices. This is because multipath automatically
    changes the active path to the passive path when it receives I/O, multipath will
    fail and fallback when LVM scans the passive path if these devices are not filtered.


    For active/passive arrays that require a command to make the passive path active,
    LVM prints a warning message when this occurs. To filter all SCSI devices in the
    LVM configuration file (lvm.conf), include the filter in the device section of
    the file.


    ```

    filter = [ "r/block", "r/disk/", "r/sd.*", "a/.*" ]

    ```


    After updating /etc/lvm.conf, it''s necessary to update the initrd so that this
    file will be copied there, where it matters the most, during boot.


    Perform:


    ```

    update-initramfs -u -k all

    ```'
