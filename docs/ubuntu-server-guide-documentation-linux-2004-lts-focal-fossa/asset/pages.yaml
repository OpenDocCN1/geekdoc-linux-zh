  md: '# LXC startup


    LXC does not have a long-running daemon. However it does have three startup jobs.

    * /etc/init/lxc-net.conf is an optional job which only runs if /etc/default/lxc-net
    specifies USE_LXC_BRIDGE (true by default). It sets up a NAT bridge for containers
    to use.

    * /etc/init/lxc.conf loads the lxc apparmor and optionally starts autostart containers.
    The autostart containers are ignored if LXC_AUTO (true by default) is set in /etc/default/lxc.
    See the lxc-autostart manual for page on autostarted containers.

    * /etc/init/lxc-instance.conf is used by /etc/lxc.conf to restart a container.


    # Backing Stores


    LXC supports several backing stores for container root filesystems. The default
    is a simple directory backing store, because it requires no prior host customization,
    so as long as the filesystem is large enough. It also requires no root privilege
    to create the backing store, so that it is seamless for unprivileged users. The
    roots for a privileged directory backing container are located (by default) under
    /var/lib/lxc/roots, while the roots for an unprivileged container are under ~/.local/share/lxc/roots.
    If a custom lxpath is specified in lxc-system.conf, then the container roots will
    be lxpath/C1/roots.

    A snapshot clone of a directory backing container C1 becomes an overlays backed
    container, with roots called overlays: /var/lib/lxc/C1/roots/var/lib/lxc/C2/delta.
    Other backing store types include loop, btrfs, LVM and zfs.

    A btrfs container mostly looks like a directory backing store, with its location.
    However, the root system comprises a volume, so that a snapshot clone is created
    using a subvolume snapshot.

    The root system for an LXVM backed container can be any separate LV. The default
    VG name is specified in lxc.conf. The filesystem type and size are configurable
    per-container using lxc-create.

    The roots for a zfs backed container is a separate zfs filesystem, mounted under
    the traditional /var/lib/lxc/C1/roots location. The zroot can be specified in
    lxc-create, and a default can be specified in lxc-system.conf.

    More information on creating containers with the various backing stores can be
    found in the lxc-create manual page.


    # Templates


    Creating a container generally involves creating a root filesystem for the container.
    lxc-create delegates this to templates, which are generally de-distribution. The
    LXC templates shipped with /usr/share/lxc/templates and include templates to create
    Ubuntu, Debian, Fedora, Oracle, and gentoo containers among others.

    Creating images in most cases requires the ability to create device nodes, often
    requires tools which are not available in all distributions, and usually is quite
    time-consuming. Therefore lxc has a special download template, which downloads
    pre-built images from a central lxc server. The most important use case is to
    allow simple creation of unprivileged containers by non-root users, who could
    not for instance run the bootstrap command.

    When running lxc-create, all options which come after are passed to the template.
    In the following command, --name, -template and -bdev are passed to lxc-create,
    while -release is passed to the template:

    lxc-create --template ubuntu --name c1 --bdev loop --release DISTRO-SHORT-COENAME'
  merge: -1
  pgno: 122
- img_proc: true
  md: 'You can obtain help for the options supported by any particular container by
    passing -help and the template name to lxc-create. For instance, for help with
    the download template,

    lxc-create --template download --help


    # Autostart


    LXC supports marking containers to be started at system boot. Prior to Ubuntu
    14.04, this was done using symbolic links to the directory /etc/lxc/auto. Starting
    with Ubuntu 14.04, it is done through the container configuration files. An entry


    ```

    lxc.start.auto = 1

    lxc.start.delay = 5

    ```


    would mean that the container should be started at boot, and the system should
    wait 5 seconds before starting the next container. LXC also supports ordering
    and grouping of containers, as well reboot and shutdown by autostart groups. See
    the manual pages for lxc-autostart and lxc-container.conf for more information.


    # Apparmor


    LXC ships with a default AppArmor profile intended to protect the host from accidental
    misuses of privilege inside the container. For instance, the container will not
    be able to write to /proc/sysrq-trigger or to /sys files.


    The usr.lxc-start profile is entered by running lxc-start. This profile mainly
    means lxc-start mounting new filesystems out of the container''s root filesystem.
    Before executing the container''s init LXC requests a switch to the container.
    By default, this profile is the lxc-container-default policy which is defined
    in /etc/apparmor.d/lxc-default. This profile prevents the container from accessing
    dangerous paths, and from mounting many filesystems.


    Programs in a container cannot be further confined - for instance, MySQL runs
    under the container profile (protecting the host) but will not be able to enter
    the MySQL profile (to protect the container).


    lxc-execute does not enter an AppArmor profile, but the container it spawns will
    be.


    # Customizing container policies


    If you find lxc-start failing due to a legitimate access which is being denied
    by your Apparmor policy, you can disable it for root by:


    ```

    sudo apparmor_parser -R /etc/apparmor.d/usr.bin.lxc-start

    sudo -S /etc/apparmor.d/usr.bin.lxc-start --etc/apparmor.d/

    ```


    This will make lxc-start run unconfined, but continue to confine the container
    itself. If you also wish to disable confinement of the container, in addition
    to using the usr.bin.lxc-start profile, you must add:


    ```

    lxc.aa_profile = unconfined

    ```


    to the container configuration file.


    LXC ships with a few alternate policies for containers. If you wish to run containers
    inside containers (nesting), you can use the lxc-container-default-with-nesting
    profile by adding the following line to the container configuration file


    ```

    lxc.aa_profile = lxc-container-default--nesting

    ```'
