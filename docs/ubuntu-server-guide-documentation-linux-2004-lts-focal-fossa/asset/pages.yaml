    - If you run no graphical output at all you can save memory and cpu cycles by
    using -nographic


    If you run with spice you can use native vnc tools or virtualization focused tools
    like virt-viewer. More about this in the libvirt section.


    All those above are considered basic usage of graphics. There are advanced options
    for further needs. These cases usually differ in their ease-of-use and capability:


    +   - Need 3D acceleration: -vga virtio with a local display -display gtk;gl=on
    That will use virgl on the host and needs guest drivers for virt3d which are common
    in Linux kernels >2.4 hard to get for other cases. While not as fast as the next
    options, the benefit is that it can be used without additional hardware and without
    a proper IOMMU setup for device passthrough.

    - Need native performance: PCI passthrough of all GPUs in the host. You need an
    IOMMU setup and unwind the cache from the host before you can pass through using
    like -device vio-pci,host=0x05:0.0,addr=0x0,multifunction=on,x-vga=-device vio-pci,host=0x05:0.1,addr=0x0

    - Need native performance, multiple guests per card: Like PCI Passthrough, but
    using mediated devices to share a card on the Host into multiple devices and pass
    those like like -display gtk;gl=on -device vio-pci,sysfdev=/sys/bus/pci/devices/0000:00:02.0/4d5511fe-ec08-11e8-b359-2f63333,display=driver
    While not at kartel on Ubuntu and Ubuntu GPU evaluation. The sharding of the cards
    is driver specific and therefore will differ per manufacturer like Intel or Nvidia.


    Especially the advanced cases get pretty complex, therefore it is recommended
    to use qemu libvirt for those. Libvirt will take care of all the host/guest/boots
    of such configurations.


    # Upgrading the machine type


    If you are unsure what, you might consider this by using (virtual) Hardware of
    the spec but a new release date. You are encouraged in general and might want
    to update your machine type of an existing guests in particular to:


    +   - to pick up security fixes and features

    - continue using a guest created on an unsupported release


    In general it is recommended to update machine types when upgrading qemu-kvm to
    a new major version. But this can never be an automated task as it will change
    the guest. The guests might change in appearance, new features will be announced
    to the guest and so on. Linux is very good at tolerating such changes, but it
    depends on the setup and workload of the guest that this has to be evaluated by
    the owner/admin of the system. Other operating systems have known to have severe
    impacts by changing the hardware. Consider a machine type change similar to replacing
    all devices and firmware of a physical machine to the virtual layer apply when
    evaluating a machine type as well.'
