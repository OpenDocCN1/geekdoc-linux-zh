- img_proc: true
  md: 'In this example we keep 6 snapshots of our daily strategy, 7 snapshots of our
    weekly strategy, and 4 snapshots of our monthly strategy. These data will guide
    the rotation made by rsnapshot.


    If you are accessing a remote machine over SSH and the port is not the default
    (port 22), you need to set the variable with the port number:


    ```

    ssh_args -p 22222

    ```


    And the most important part, you need to decide on what you would like to backup.
    If you are backing up locally to the same machine, this is as easy as specifying
    the directories that you want to save and following with localhost/, which will
    be a sub-directory in the snapshot_root that you set earlier.


    ```

    backup /home/ localhost/

    backup /etc/ iocalhost/

    backup /usr/local/ localhost/

    ```


    If you are backing up a remote machine you need to tell rsnapshot where the server
    is and which directories you would like to backup:


    ```

    backup rsnapshot@example.com:/home/ example.com/ +rsync_long_args=--bwlimit=16,
    exclude=core

    backup rsnapshot@example.com:/etc/ example.com/ exclude=mtab, exclude=core

    ```


    As you can see you can pass extra rsync parameters (the + parameter to the default
    list, if you remove the + sign over it) and also exclude directories.


    You can check the comments in /etc/rsnapshot.conf and the rsnapshot man page for
    more options.


    # Test Configuration


    After modifying the configuration file is a good practice to check if the syntax
    is ok:


    ```

    sudo rsnapshot configtest

    ```


    You can also test your backup levels with the following command:


    ```

    sudo rsnapshot -t daily

    ```


    If you are happy with the output and want to see it in action you can run:


    ```

    sudo rsnapshot daily

    ```


    # Scheduling Backups


    With rsnapshot working correctly with the current configuration, the only thing
    left to do is to schedule it to run at certain intervals. We will use cron to
    make this happen since rsnapshot includes a default cron file in /etc/cron.d/rsnapshot.
    If you open this file there are entries commented out as reference.


    ```

    0 4 * * root /usr/bin/rsnapshot daily

    0 3 * * root /usr/bin/rsnapshot weekly

    0 2 1 * root /usr/bin/rsnapshot monthly

    ```


    The settings above added to /etc/cron.d/rsnapshot run:


    +   - the daily snapshot everyday at 4:00 am

    - the weekly snapshot every Monday at 3:00 am

    - the monthly snapshot on the first of every month at 2:00 am


    For more information on how to schedule a backup please take a look at Executing
    with cron section in Backups - Shell Scripts.'
