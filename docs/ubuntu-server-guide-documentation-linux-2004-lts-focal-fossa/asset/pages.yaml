    journal on server.

    * Client and server must use same protocol and port, e.g. UDP port 1194, see port
    and proto config option

    * Client and server must use same config regarding compression, see comp-lzo config
    option

    * Client and server must use same config regarding bridged vs routed mode, see
    server vs server-bridge config option


