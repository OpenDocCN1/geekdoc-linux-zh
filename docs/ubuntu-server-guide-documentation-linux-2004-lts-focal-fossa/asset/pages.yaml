  md: '# sudo exports -a


    You can replace * with one of the hostname formats. The hostname declaration as
    specific as possible so unwanted systems cannot access the NFS mount. Be aware
    that *.hostname will matchfoo.hostname.com but not foo.bar.my-domain.com.


    The sync/async options control whether changes are guaranteed to be committed
    to stable storage before replying requests. async thus gives a performance benefit
    but risks data loss or corruption. Even though sync is the default, it''s worth
    noting setting entries will issue a warning if it''s left unspecified.


    subtree_check and no_subtree_check enables a security verification that subdirectories
    a client attempts to mount for an exported system are ones they are permitted
    to do so. This verification has some performance implications for use cases, such
    as home directories with frequent renames. Read-only filesystems are more suitable
    subtree_check on. Like sync, async will warn you if it''s left unspecified.


    There are a number of options for NFS mounts for tuning, tightening security,
    or providing conveniences. These settings have their own trade-offs so it is important
    to use them with care, only as needed for the particular case. no_root_squash,
    for example, adds a convenience to allow read-only files to be modified by any
    system''s root user; in a multi-user environment where executables are allowed
    on a shared mount point, this could lead to security problems. noctree prevents
    executables from running from the mount point.


    # NFS Client Configuration


    To enable NFS support on a client system, enter the following command at the terminal
    prompt:


    ```

    sudo apt install nfs-common

    ```


    Use the mount command to share a shared directory from another machine, by typing
    a command line similar to the following at a terminal prompt:


    ```

    sudo mkdir /opt/example sudo mount example.com:/srv /opt/example

    ```


    # Warning


    The mount directory /opt/example must exist. There should be no files or subdirectories
    in the /opt/example directory, else they will become inaccessible when the filesystem
    is unmounted.


    An alternate way to mount an NFS share from another machine is to add a line to
    the /etc/fstab file. The mount line must state the hostname of the NFS server,
    the directory on the server being exported, and the local directory where the
    NFS is to be mounted.


    The general syntax for the line in /etc/fstab is as follows: example.com:/srv
    /opt/example nfs size=8192,w=8192,time=14,intr


    # References


    +   Linux Wiki Linux NFS faq

    Ubuntu Wiki NFS Howto Ubuntu NFSv4'
