  md: '# PostgreSQL


    PostgreSQL is an object-relational database system that has the features of traditional
    commercial database systems with enhancements to be found in next-generation DBMS
    systems.


    # Installation


    To install PostgreSQL, run the following command in the command prompt:

    sudo apt install postgresql


    The database service is automatically configured with viable defaults, but can
    be customized based on your specialized needs.


    # Configuration


    PostgreSQL supports multiple client authentication methods. By default, the IDENTENT
    authentication method is used for postgres. Please refer to the PostgreSQL''s
    Guide if you would like to configure alternatives like Kerberos.


    The following discussion assumes that you wish to enable TCP/IP connections and
    the MD5 method for client authentication. PostgreSQL configuration files are stored
    in the /etc/postgresql/<version>/main directory. For example, if you install PostgreSQL
    12, the configuration files are stored in the /etc/postgresql/12/main directory.


    # Tip


    To configure IDENT authentication, add entries to the /etc/postgresql/12/main/pg_hident.conf
    file. There are detailed comments in the file to guide you.


    To enable other computers to connect to your PostgreSQL server, edit the file
    /etc/postgresql/12/main/postgresql.conf


    Locate the line #listen_addresses = ''localhost'' and change it to:

    listen_addresses = ''*''


    # Note


    To allow both IPv4 and IPv6 connections replace ''localhost'' with '':'',


    For details on other parameters, refer to the configuration file or to the PostgreSQL
    documentation for how they can be edited.


    Now that we connect to our PostgreSQL server, the next step is to set a password
    for the postgres user. Run the following command at a terminal prompt to connect
    to the default PostgreSQL template database:

    sudo u postgres psql template


    The above command connects to PostgreSQL database template1 as user postgres.
    Once you connect to the PostgreSQL server, you will be at a SQL prompt. You can
    run the following command at the prompt prompt to configure the password for the
    postgres user.


    ```

    ALTER postgres with encrypted password ''your_password'';

    ```


    After configuring the password, edit the file /etc/postgresql/12/main/pg_hba.conf
    to use MD5 authentication with the postgres user:


    ```

    local   postgres         md5

    ```'
