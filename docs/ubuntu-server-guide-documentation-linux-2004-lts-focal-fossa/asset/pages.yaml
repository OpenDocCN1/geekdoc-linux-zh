    # Automatic Updates


    The unattended-upgrades package can be used to automatically install unattended
    packages and can be configured to ignore all packages or just install security
    updates. First, install the package by entering the following in a terminal:


    ```

    sudo apt install unattended-upgrades

    ```


    To configure unattended-upgrades, edit /etc/apt/apt.conf/50unattended-upgrades
    and adjust the fitting to your needs:


    ```

    Unattended-Upgrade :: Allowed-Origins {

    //"${distro_id}: ${distro_codename}";

    //"${distro_id}: ${distro_codename}-security";

    //"${distro_id}: ${distro_codename}-updates";

    //"${distro_id}: ${distro_codename}-proposed";

    //"${distro_id}: ${distro_codename}-backports";

    };

    ```


    Certain packages can also be blacklisted and therefore will not be automatically
    updated. To blacklist a package, add it to the list:


    ```

    Unattended-Upgrade :: Package-Blacklist {

    //"vim";n//"libc6";n//"libc6-dev";n//"libc6-1686";

    };

    ```


    # Note


    ////" serve as comments, so whatever follows "//" will not be evaluated.


    To enable automatic updates, edit /etc/apt/apt.conf/20auto-upgrades and set the
    appropriate apt configuration options:


    ```

    APT:: Periodic :: Update-Package-Lists "1";nAPT:: Periodic :: Download-Upgradeable-Packages
    "1";

    ```'
