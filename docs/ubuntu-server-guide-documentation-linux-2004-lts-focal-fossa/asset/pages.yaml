- img_proc: true
  md: '```

    ovs-vsctl set Open_Switch . "other_config:dpdk-extra-pci=0000:04:00.0"

    sudo service openvswitch-switch restart

    ```


    Please remember that you have to assign devices to DPDK compatible drivers see
    above at Network - DPPK before restarting.


    Please note that the section dpdk-alloc-mem=2048 is the most basic numa setup
    for a single socket system. If you have multiple sockets you might want to define
    how to split your memory among them. Here details about these options are outlined
    in OpenVSwitch.


    # Attaching DPDK ports to OpenSwitch


    The OpenSwitch you started supports all port types OpenVSwitch usually, plus DPDK
    port types, Here is an example how to create a bridge - instead of a normal external
    port - add an extra DPDK port to it. The good news is, with the new qemu/libvirt/dpdk
    you can specify the device that it will be attached:


    ```

    ovs-vsctl add-br ovsdpdk0 set bridge ovsdpdk0 datapath_type=netdev

    ovs-vsctl add-port ovsdpdk0 dpdk0 -- set Interface dpdk0 type=dpdk "options :dpdk-devargs=${OVS_DEV_PCID}\}"

    ```


    Further tuning can be applied by setting options:


    ```

    ovs-vsctl set Interface dpdk0 "options:n_rxq=2"

    ```


    # OpenVSwitch DPDK to KVM Guests


    If you are building some SDN or NFV on top of DPDK it is very likely that you
    want to forward traffic to KVM guests. The good news is, with the new qemu/libvirt/dpdk
    versions in Ubuntu it is no more about appending commandline string. This chapter
    covers a basic configuration on how to connect a KVM guest to an OpenVSwitch-DPDK
    instance.


    The recommended way to get to a KVM guest is using vhost_user_client. OVS-DPDK
    to create a socket to that you created. That way issues guest failures on OVS
    restart are avoided. Here is an example how to add a port to the bridge you have
    created.


    ```

    ovs-vsctl add-port ovsdpdk0 vhost-user-1 -- set Interface vhost-user-1 type=dpkvhostuserclient
    "options:vhost-server-path=/var/run/vhostuserclient/vhost-user-client-1"

    ```


    This will connect the path that has been created for a guest listening on.


    To let libvirt/kvm consume the socket and create a virtio network device for it
    add a snippet like this your guest definition as the network device.


    ```

    <interface type=''vhostuser''>n<source type=''unix''

    p=''/var/run/vhostuserclient/vhost-user-client-1''

    mode=''server''/>

    <model type=''virtio''/>

    </interface>

    ```'
