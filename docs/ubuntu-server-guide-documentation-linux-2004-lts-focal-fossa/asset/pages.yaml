    # Logical Volume Manager (LVM)


    Logical Volume Manger, or LVM, allows administrators to create logical volumes
    out of one or multiple physical disks. LVM volumes can be created on both software
    RAID partitions and standard partitions residing on a single disk. Volumes can
    also be extended, giving greater flexibility to systems as requirements change.


    # Overview


    A side effect of LVM''s power and flexibility is a greater degree of complication.
    Before diving into the LVM installation process, it is best to get familiar with
    some terms.


    +   - Physical Volume (PV): physical disk, disk partition or software RAID partition
    formatted as LVM PV.

    - Group Volume (VG): is made from one or more physical volumes. A VG can be extended
    by adding more PVS. A VG is like a virtual disk, from which one or more logical
    volumes are carved.

    - Logical Volume (LV): is similar to a partition in a non-LVM system. A LV is
    formatted with the desired file system (EXT3, XFS, JFS, etc), it is then available
    for mounting and data storage.


    # Installation


    As an example this covers installing Ubuntu Server Edition with /srv mounted on
    a LVM volume. During the initial install only one Physical Volume (PV) will be
    part of the Volume Group (VG). Another PV will be added after install to demonstrate
    how a VG can be extended.


    There are several installation options for LVM in Guided storage configuration
    step:


    +   - Select "Use an entire disk", "Set up this as an LVM group", and Done. This
    option will create a /boot partition in the local disk and the rest of the disk
    space is allocated to the LVM group.

    - Select "Use an entire disk", "Set up this as an LVM group", "Encrypt the LVM
    group with LUKS", insert the password (and confirm it), and Done. The output is
    the same as described above but the LVM group is encrypted.'
