    # LXD


    LXD (pronounced lcx-dex) is the lithvisor, or lightweight container hypervisor.
    LXC (lcx-sec) is a program that creates and administers "containers" on a local
    system. It also provides an API to allow higher level managers, such as LXD, to
    administer containers. In a sense, one could compare LXD to QEMU, by comparing
    libvirt.


    The LXD API deals with a ''container''. The LXD API deals with ''remotes'', which
    serve images and containers. This extends the LXC functionality over the network,
    and allows concise management of tasks like container migration and container
    image publishing.


    LXD uses LXC under the covers for some container management tasks. However, it
    keeps its own container configuration and has its own conventions, so it is best
    not to use classic LXC commands with hand LXD containers. This document will focus
    on how to configure and administer LXD on Ubuntu systems.


    # Online Resources


    There is excellent documentation for getting started with LXD and an online server
    allowing you to try out LXD remotely. Stephane Graber has an excellent blog series
    on LXD 2.0. Finally, there is great documentation on how to drive lxd using juju.


    This document will offer an Ubuntu Server-side view of LXD, focusing on administration.


    # Installation


    LXD is pre-installed on Ubuntu Cloud images. On other systems, the lxd package
    can be installed using:


    ```

    sudo snap install lxd

    ```


    This will install the self-contained LXD snap package.


    # Kernel preparation


    In general, Ubuntu should have all the desired features enabled by default. One
    exception to this is that in order to enable swap accounting the boot argument
    swapaccount=1 must be set. This can be done by appending it to the GRUB_CMDLINE_LINUX_DEFAULT=variable
    in /etc/default/grub, then running ''update-grub'' as root and rebooting.'
