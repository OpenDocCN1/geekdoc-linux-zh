    # Time Synchronization


    NTP is a TCP/IP protocol for synchronizing time over a network. Basically a client
    requests the current time from a server, and uses it to set its own clock.


    Behind this simple description, there is a lot of complexity - there are tiers
    of NTP servers, with the tier one NTP servers connected to atomic clocks, and
    tier two servers spreading the load of actually handling requests over the Internet.
    The client software is a more complex than you might think - it has to factor
    communication delays, and the delay in the time that does not upset all the processes
    that run on the server. But luckily that complexity is hidden from you!


    Ubuntu by default uses timesyncd / synchronize time and users can optionally use
    chrony to serve the Network Time Protocol.


    # Synchronizing your systems time


    Since Ubuntu 16.04 timesyncd (which are part of systemd) replaces default and
    not only ntpdate, but also the client portion of chrony (or formerly ntp). So
    on top of the one-shot action that update provided on boot and network activation,
    timesyncd by default regularly checks and keeps your local time in sync. It also
    stores updates locally, if applicable.


    If chrony is installed timesyncd lets back go to chrony the time keeping. Also
    ensure that no two syncing systems are fighting. While no more recommended to
    be used, this also applies to ntp being installed to retain any kind of old behavior/config
    that you had through an upgrade. But it also implies that an upgrade from a former
    release ntp/ntdate might be installed and therefore renders the new systemd based
    services disabled.


    59'
