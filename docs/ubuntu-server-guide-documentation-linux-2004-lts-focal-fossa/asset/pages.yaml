  md: 'sudo systemctl restart smbd.service nmbd.service


    Lastly, there are a few additional commands needed to setup the appropriate rights.


    With root disabled by default, in order to join a workstation to the domain, a
    system group needs to be mapped to the Windows Domain Admins group. Using the
    net command from a remote terminal:


    sudo net groupmap add group="Domain Admins" unixgroup=sysadmin rid=512 type=d


    # Note


    Change sysadmin to whichever group you prefer. Also, the user used to join the
    domain needs to be a member of the sysadmin group, as well as a member of the
    system admin group. The admin group also uses sudo.


    If the user does not have Samba credentials yet, you can add them with the smbpasswd
    utility, to change the sysadmin username appropriately:


    ```

    sudo smbpasswd -a sysadmin

    ```


    Also, rights must be explicitly granted to the Domain Admins group to allow the
    add admin script (and other admin functions) to work. This is achieved by executing:


    ```

    net rpc grant -U sysadmin "EXAMPLE\Domain Admins"

    SeMachineAccountPrivilege \

