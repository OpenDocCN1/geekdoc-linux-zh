    # Advanced bridged VPN configuration on server


    OpenVPN can be setup for either routed or a bridged VPN mode. Sometimes this is
    also referred to as OSI layer-2 versus layer-3 VPN. In a bridged VPN all layer-2
    frames - e.g. all ethernet frames - are sent to VPN partners and in a routed VPN
    only-3 packets are sent to VPN partners. In bridged mode'
