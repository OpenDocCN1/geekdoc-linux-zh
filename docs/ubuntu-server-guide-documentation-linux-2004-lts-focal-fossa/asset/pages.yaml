    # ## Installation with iBFT


    In order to setup iSCSI based on the iBFT (iSCSI Boot Firmware Table) on the installation
    and boot, append these options to the install prompt (or to the preset file


    ```

    disk-detect/ibft/enable=true partman-iscsi/iscsi_auto=true

    ```


    This should probe for iBFT information and configure network interface(s) and
    iSCSI target(s) accordingly during the installation, and configure system boot
    (initramfs) to that in order to find the root device.


    **Warning** The support for iBFT is available in the debian-installer on network
    images as of 2019-06-20 and (expected) ISO images for the 18.04.3 point release
    and later.


    # Rebooting to an iSCSI target


    The procedure is to specify your hardware target. As an example, here is how to
    reboot your iSCSI target using iPXE


    ```

    iPXE> dhcp

    ```


    Configuring (net0 52:54:00:a4:f2:a9)....... ok


    ```

    iPXE> sanboot isscsi:192.168.1.29:::iqn.2016-03.TrustyS-isiscarget:storage.

    sys0

    ```


    If the procedure is successful, you should see the Grub menu appear on the screen.


    # ## Package Management


    Ubuntu features a comprehensive package management system for installing, upgrading,
    configuring, and removing software. In addition to providing access to an organized
    base of over 60,000 packages for your Ubuntu computer, the management facilities
    also feature dependency resolution capabilities and software update checking.


    Several tools are available for interacting with Ubuntu''s package management
    system, from simple commandline utilities which may be easily automated by system
    administrators, to a graphical interface which is easy to use by those new to
    Ubuntu.


    # ## Introduction


    Ubuntu''s package management system is derived from the same system used by the
    Debian GNU/Linux distribution. The package files contain all the necessary files,
    meta-data, and instructions to implement a particular functionality or software
    application on your Ubuntu computer.


    Debian package files typically have the extension .deb, and usually in repositories
    are collections of packages found online or on physical media, such as CD-ROM
    discs. Packages are normally in a precompiled binary format; thus installation
    is quick and requires no compilation of software.'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'Many packages use *dependencies*. Dependencies are additional packages required
    by the principal package in order to function properly. For example, the speech
    synthesis package festival depends upon the package also-utils, which is a package
    supplying the ALSA sound library needed for audio playback. In order for festival
    to function, it and all of its dependencies must be installed. The software management
    tools in Ubuntu will do this automatically.


    # Apt


    The apt command is a powerful command-line tool, with Ubuntu''s *Advanced Packaging
    Tool* (APT) performing functions as installation of new software packages, upgrade
    of existing software packages, updating the package list index, and upgrading
    the entire Ubuntu system.


    Some examples of popular uses for the apt utility:


    +   * Install a Package: Installation of packages using the apt tool is quite
    simple. For example, to install the nmap network scanner, type:


    ```

    sudo apt install nmap

    ```


    +   * Remove a Package: Removal of a package (or packages) is also straightforward.
    To remove the package installed in the previous example, type this:


    ```

    sudo apt remove nmap

    ```


    # Tip


    **Multiple Packages:** You may specify multiple packages to be installed or removed,
    separated by spaces.


    # Notice


    Scripting: While apt is a command-line tool, it is intended to be used interactively,
    and not to be called from non-interactive scripts. The apt–get command should
    be used in scripts (perhaps with a *—quiet* flag). For basic commands the syntax
    of the two tools is identical.


    Also, adding the —purge option to apt will remove the package configuration files
    as well. This may not be the desired effect, so use with caution.


    +   * Update the Index:** The APT package index is essentially a database of available
    packages from the repositories defined in the `/etc/apt/sources.list` file and
    in the `/etc/apt/sources.list.d` directory. To update the local package index
    with the latest changes in repositories, type the following:


    ```

    sudo apt update

    ```


    +   * **Upgrade Packages:** Over time, updated versions of packages currently
    installed on your computer may become available from the package repositories
    (for example security updates). To upgrade your system, first update your package
    index as outlined above, and then type:


    ```

    sudo apt upgrade

    ```


    For information on upgrading to a new Ubuntu release see Upgrading.


    Actions of the apt command, such as installation and removal of packages, are
    logged in the `/var/log/dpkg.log` log file.


    For further information about the use of APT, read the comprehensive APT User''s
    Guide or type:


    ```

    apt help

    ```'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Aptitude


    Launching Aptitude with no command-line options will give you a menu-driven, text-based
    front-end to the Advanced Packaging Tool (APT) system. Many of the common package
    management functions, such as installation, remove, and upgrade, can be performed
    in Aptitude with single-key commands, which are typically lowercase letters.


    Aptitude is best suited for use in a non-graphical terminal environment to ensure
    proper functioning of the command keys. You may start the menu-driven interface
    of Aptitude as a normal user by typing the following command at a terminal:


    ```

    sudo aptitude

    ```


    When Aptitude starts, you will see a menu bar at the top of the screen and two
    panes below the menu bar. The top pane contains package categories, such as New
    Packages and Not Installed Packages. The bottom pane contains information related
    to the packages and package categories.


    Using Aptitude for package management is relatively straightforward, and the interface
    makes tasks simple to perform. The following are examples of common package management
    functions as performed in Aptitude:


    +   * **Install Packages**: To install a package, locate the package via the Not
    Installed Packages category, using the keyboard arrow keys and the ENTER key.
    Highlight the desired package, then press the + key. The package entry should
    turn green, indicating that it has been marked for installation. Now g to be presented
    with a summary of package actions. Press g again, and downloading and installation
    of the package will commence. When finished, press ENTER, to return to the menu.

    * **Remove Packages**: To remove a package, locate the package via the Installed
    Packages category, using the keyboard arrow keys and the ENTER key. Highlight
    the desired package you wish to remove, press the - key. The package entry should
    turn pink, indicating it has been marked for removal. Now g to be presented with
    a summary of package actions. Press g again, and removal of the package will commence.
    When finished, press ENTER, to return to the menu.

    * **Update Package Index**: To update the package index, simply press the u key.
    Updating of the package index will commence.

    * **Upgrade Packages**: To upgrade packages, perform the update of the package
    index as detailed above, and press the U key to mark all packages with updates.
    Now g whereby you will be presented with a summary of package actions. Press g,
    and the download and installation will commence. When finished, press ENTER, to
    return to the menu.


    The first column of information displayed in the package list in the top pane,
    when actually viewing packages lists the current state of the package, and uses
    the following key to describe the state of the package:


    +   * i: Installed package

    * c: Package not installed, but package configuration remains on the system

    * p: Purged from system

    * v: Virtual package

    * u: Unpacked files, but package not configured

    * C: Half-configured - Configuration failed and requires fix

    * H: Half-installed - Removal failed and requires a fix


    To exit Aptitude, simply press the q and confirm you wish to exit. Many other
    functions are available from the Aptitude menu by pressing the F10 key.'
