    \ Client)\n\nWikipedia iSCSI Definition:\n\niSCSI is an acronym for **Internet\
    \ Small Computer Systems Interface**, an Internet Protocol (IP)-based storage\
    \ networking for linking data storage facilities. It provides block-level access\
    \ to storage devices by carrying SCSI commands over a TCP/IP network.\n\niSCSI\
    \ is used to facilitate data transfers over intranets and to manage storage over\
    \ long distances. It can be used to transmit data over local networks (LANs),\
    \ wide area networks (WANs), or the Internet and enable location-independent storage\
    \ and retrieval devices.\n\nThe protocol allows clients (called initiators) to\
    \ send SCSI commands (CDBs) to storage devices (targets) on remote servers. It\
    \ is a storage area network (SAN) protocol, allowing organizations to consolidate\
    \ storage into arrays while providing clients (such as database and web servers)\
    \ with the illusion of locally attached SCSI disks.\n\nIt mainly competes with\
    \ Fibre Channel but unlike traditional Fibre Channel, which usually requires dedicated\
    \ cabling, iSCSI can be run over long distances using existing network infrastructure.\n\
    \nUbuntu server can be configured as: **iSCSI initiator** and **iSCSI target**.\
    \ This guide provides commands and configuration options to set up an iSCSI initiator\
    \ (or Client).\n\n> *Note: It is assumed that you already have an iSCSI target\
    \ on your local network and have the appropriate rights to connect to it. The\
    \ instructions for setting up a target vary greatly between hardware providers,\
    \ so consult your vendor documentation to configure your specific iSCSI target.*\n\
