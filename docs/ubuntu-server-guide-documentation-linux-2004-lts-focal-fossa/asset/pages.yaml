  md: "# Installation\n\nTo install the necessary packages, from a terminal prompt\
    \ enter:\n\nsudo apt update\nsudo apt install qemu-kvm libvirt-daemon-system\n\
    \nAfter installing libvirt-daemon-system, the user used to manage virtual machines\
    \ will need to be added to the libvirt group. This is done automatically for members\
    \ of the sudo group, but needs to be done in add for anyone else that has access\
    \ system wide libvirt resources. Doing so will grant the user access to the\n\
    advanced networking options.\n\nIn a terminal enter:\n\nsudo adduser $USER libvirt\n\
    \n> Note\nIf the user is the current user, you will need to log out and back in\
    \ for the new group\nmembership to take effect.\n\nYou are now ready to install\
    \ a Guest operating system. Installing a virtual machine follows the same process\n\
    as installing the operating system directly on the hardware.\nYou either need:\
    \ a way to automate the installation - a keyboard and monitor will need to be\
    \ attached to the\nphysical machine. - use cloud images which are meant to self-initialize\
    \ (see Multipass and UVTool)\nIn the case of virtual machine a Graphical User\
    \ Interface (GUI) is analogous to using a physical keyboard\nand mouse on a real\
    \ computer. Instead of installing a GUI the virt-viewer or virt-manager application\
    \ can\nbe used to connect to a virtual machine's console using VNC. See Virtual\
    \ Machine Manager / Viewer for\nmore information.\n\n# Virtual Machine Management\n\
    \nThe following section covers the command-line tools around virsh that are part\
    \ of libvirt itself. But there\nare various options at different levels of complexities\
    \ and feature-sets, like:\n\n+   - multipass\n- uvt\n- virt-* tools\n- openstack\n\
    \n# virsh\n\nThere are several utilities available to manage virtual machines\
    \ and libvirt. The virsh utility can be used\nfrom the command line. Some examples:\n\
    \n+   - To list running virtual machines:\n  virsh list\n- To start a virtual\
    \ machine:\n  virsh start <username>\n- Similarly, to start a virtual machine\
    \ at boot:\n  virsh autostart <username>"
