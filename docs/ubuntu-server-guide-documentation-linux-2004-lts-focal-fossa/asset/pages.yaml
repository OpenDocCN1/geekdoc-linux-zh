    Another popular way of joining a domain is using an OTP, or One Time Password,
    token. For that, use the --one-time-password option.


    # SSSD Configuration


    The realm tool took care of creating an ssd configuration, adding the pam and
    ssd modules, starting the necessary services.


    Let''s look at /etc/sssd/sssd.conf:


    ```

    [sssd]

    domain = ad1.example.com

    config_version = 2

    services = nss, pam


    [domain/ad1.example.com]

    default_shell = /bin/bash

    krb5_store_password_if_offline = True

    cache_credentials = True

    krb5_realm = AD1.EXAMPLE.COM

    realm_tags = manages-system joined-with-adcli

    id_provider = ad

    fallback_homedir = /home/%u@@d

    ad_domain = ad1.example.com

    use_fully_qualified_names = True

    ldap_id_mapping = True

    access_provider = ad

    ```


    # Note


    Something very important to remember is that this file must have permissions 0600
    and ownership root:root, or ssd won''t start!


    Let''s highlight a few things from this config when the AD is unreachable


    +   * cache_credentials: True

    * home directory: it''s by default /home/<user>@<domain>. For example, the AD
    user john will have a home directory of /home/john@ad1.example.com

    * use_fully_qualified_names: users use the form of user@domain, not just user.
    This should only be changed if you are certain no other domains will ever join
    the AD forest, via one of the several possible trust relationships


