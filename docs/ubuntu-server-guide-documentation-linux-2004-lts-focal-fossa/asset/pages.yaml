- img_proc: true
  md: '# Container Offerings


    Ubuntu images are also produced for a number of container offerings:


    +   - Amazon Elastic Kubernetes Service (EKS)

    - Google Kubernetes Engine (GKE)


    # Private Clouds


    On cloud-images.ubuntu.com, users can find standard and minimal images for the
    following:


    +   - Hyper-V

    - KVM

    - OpenStack

    - Vagrant

    - VMware


    # Release Support


    Cloud images are published and supported throughout the lifecycle of an Ubuntu
    release. During this time images can receive all supported security updates and
    bug fixes.


    For users wanting to upgrade from one release to the next, the recommended path
    is to launch a new image with the desired release and then migrate whatever workload
    or data to the new image.


    Some cloud image customization must be applied during image creation, these would
    be missing if an in-place upgrade was performed. For that reason in-place upgrades
    of cloud images are not recommended.


    # Amazon EC2


    Amazon Web Service''s Elastic Compute Cloud (EC2) provides a platform for deploying
    and running applications.


    # Images


    On EC2, cloud images are referred to as Amazon Machine Images (AMIs). Canonical
    produces a wide variety of images to support numerous features on EC2:


    +   - Generally, all images utilize EBS storage and HVM virtualization types.
    Older releases may also support PV and instance-store, but benefit from the newer
    storage and virtualization technologies.

    - Standard server images as well as minimal images for amd64. As well, arm64 images
    for the standard server set.

    - Daily (untested) and release images are published.


    # Find Images with SSM


    The AWS Systems Manager (SSM) parameter store is used by Canonical to store the
    latest AMI release versions for EC2. This provides users with a programmatic method
    of querying for the latest AMI ID.


    Canonical stores SSM parameters under /aws/service/canonical/. To find the latest
    AMI ID user''s can use the AWS CLI:'
  merge: -1
  pgno: 374
- img_proc: true
  md: '```

    aws ssm get-parameters --names \

    /aws/service/canonical/ubuntu/server/20.04/stable/current/amd64/hvm/ebs-

    gp2/ami-id

    ```


    The path follows the following format:

    ub$PRODUCT/$RELEASE/stable/$ARCH/$VIRT_TYPE/$VOL_TYPE/ami-id


    +   - PRODUCT: server or server-minimal

    - RELEASE: focal, 20.04, bionic, 18.04, xenial, or 16.04

    - ARCH: amd64 or arm64

    - VIRT_TYPE: pv or hvm

    - VOL_TYPE: ebs-gp2, ebs-standard, and instance-store


    The given serial for an image (e.g. 20210222) is also uploaded in place of current:

    ubuntu$PRODUCT/$RELEASE/stable/$SERIAL/$ARCH/$VIRT_TYPE/$VOL_TYPE/ami-id


    For more details on check out the following Discourse thread.


    **Ownership Verification** User''s can verify that an AMI was published by Canonical
    by ensuring the OwnerId of an image is 09970109477. This ID is stored in SSM and
    is discoverable by running:

    aws ssm get-parameters --names /aws/service/canonical/meta/publisher-id


    With the value returned command, you can then run the describe-images command
    against an AMI ID and verify the OwnerId matches the above ID:

    aws ec2 describe-images --image-ids $AMI_ID


    Note that listings on the AWS Marketplace will always show the OwnerId as Amazon
    (e.g. 6795933332441). In these cases, users can verify the Amazon ID and look
    for aws-marketplace/ubuntu in the ImageLocation field.


    # Image Locator


    Canonical also produces Ubuntu Cloud Image Finder where users can filter based
    on a variety of criteria (e.g. region, release, etc.).


    # AWS EKS


    EKS is a managed Kubernetes service provided by AWS that lets users run Kubernetes
