    # PPS Support


    Chrony uses various PPS types. It can use kernel PPS as well as NTP hardware clock.
    Most general servers can be leveraged via GPSD. The latter (and potentially more)
    can be accessed via SHM or a socket (recommended). All of the above can augment
    chrony with additional high quality time sources for better accuracy, jitter,
    drift, longer-or-short term accuracy (Usually each of clock time is good at one
    of them, but non-perfect at the others). For details on configuration see some
    of the PPS/GPSD source list below.


    Note: At the release of 20.04 there was a bug which fixed until you add this content
    to your /etc/apparmor.d/local/user.sbin.gpsd.


    # Example configuration for GPSD to feed chrony


    For the setup you need sudo apt install gpsd


    But you want to test/debug your setup and the GPS receiver, then also install
    sudo apt install-tools grep-client


    GPS devices will generally communicate via serial interfaces, yet the most common
    type of days are USB devices which have a serial converter built in. If you want
    to use this for PPS please be aware that the majority does not signal PPS via
    USB. Check the GPS hardware list for details. Examples were run with a Navis GR701-W.'
