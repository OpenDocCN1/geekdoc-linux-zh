  md: '# Serve the Network Time Protocol


    If addition to synchronizing your system you also want to serve NTP information
    you need an NTP server. There are several options with chrony, ntppd and open-ntp.
    The recommended solution is chrony.


    # chrony(d)


    The NTP daemon chrony calculates the drift and offset of your system clock and
    continuously adjusts it, so there are no large corrections that could lead to
    inconsistent logs for instance. The cost is a little processing power and memory,
    but for a modern server this is usually negligible.


    # Installation


    To install chrony, from a terminal prompt enter:

    sudo apt install chrony


    This will provide binaries:


    +   - chronyd - the actual daemon to sync and serve via the NTP protocol

    - chronyc - command-line interface for chrony daemon


    # Chronyd Configuration


    Edit /etc/chrony/chrony.conf to add/remove server lines. By default these servers
    are configured:


    ```

    # Use users from the NTP Pool Project. Approved by Ubuntu Technical Board

    # on 2011-02-08 (IP: #104255). See http://www.pool.ntp.org/join.html for

    # more information

    pool 0.ubuntu.pool.ntp iburst

    pool 1.ubuntu.pool.ntp iburst

    pool 2.ubuntu.pool.ntp iburst

    pool 3.ubuntu.pool.ntp iburst

    ```


    See man chrony.conf for more details on the configuration options. After changing
    any of the config file you have to restart chrony:


    ```

    sudo systemctl restart chrony.service

    ```


    Of the pool 2.ubuntu.pool.ntp as well as ntp.ubuntu.com all support ipv6 if needed.
    If one needs ipv6 there is also ipv6,ntp.ubuntu.com which is not configured by
    default.


    # Serving the NTP Protocol


    You can install chrony (above) and configure special Hardware (below) for a local
    synchronization and-installed that is the default to stay the conservative and
    conservative side. But if you want to serve NTP you need your configuration.


    To enable the NTP protocol you will need at to set the allow rule to which controls
    clients/networks you want chrony to serve NTP to.


    An example would be


    ```

    allow 1.2.3.4

    ```'
