  md: '5. Update initial ramdisk


    For detailed setup instructions for multipath configuration see DM-Multipath Configuration
    and DM-Multipath Setup.


    # Multipath Devices


    Without multipath, each path from a server node connect to a storage controller
    is treated by the system as a separate device, even when the I/O path connects
    the same server node to the same storage controller. Multipath provides a way
    of organizing the I/O paths logically, by creating a single device on top of the
    underlying paths.


    # Multipath Device Identifiers


    Each multipath device has a Wide World Identifier (WWID), which is guaranteed
    to be globally unique and unchanging. By default, the name of a multipath device
    is set to its WWID. Alternately, you can set the user_friendly_names option in
    multipath.conf, which causes multipath to use a node-unique alias of the form
    multipath as the name.


    For example, a node with two HBAs to a storage controller with two ports via a
    single uniqued FC switch sees four devices: /dev/sda, /dev/sdb, /dev/sdc, and
    /dev/sdd. Multipath creates a single device with a unique WWID that routes I/O
    to these four devices according to the multipath configuration.


    When the user_friendly_names configuration is set to yes, the name of the multipath
    device is set to multipath. When new devices are brought under the control of
    multipath, the new devices will be seen in two places under the /dev directory:
    /dev/mapper/multipath and /dev/dm-n.


    +   - The devices in /dev/mapper are created early in the boot process. Use these
    devices to access the multipathed devices.


    +   - Any of the form /dev/dm-n are internal use only and should not be used directly.


    You can also set the name of a multipath device to a name of your choosing using
    the alias option in the multipaths section of the multipath configuration.


    For information on the multipath configuration defaults, including the user_friendly_names
    and alias configuration options, see DM-Multipath Configuration.


    # Consistent Multipath Device Names in a Cluster


    When the user_friendly_names configuration is set to yes, the name of the multipath
    device is unique to a node, but is not guaranteed to be the same across all nodes
    using multipath. Similarly, if you set the alias for a device in the multipaths
    section of /etc/multipath.conf, the name is not automatically consistent across
    all nodes in the cluster.


    This should not cause any difficulties if you use LVM to create logical devices
    from the multipath device, but if you require your multipath device names to be
    consistent in every node it is recommended that you leave the user_friendly_names
    option set to no and that you do not configure aliases for devices.


    If you configure an alias for a device that you would like to be consistent across
    the cluster, you should ensure that the /etc/multipath.conf file is the same for
    each node in the cluster by following the procedure:


    +   - Configure the aliases for the multipath devices in the multipath.conf file
    on one machine.'
