    # IP Routing


    IP routing is a means of specifying and routing paths in a TCP/IP network along
    which network data

    may be sent. Routing uses a set of routing tables to direct the forwarding of
    network data packets from

    ttheir source to the destination, often via intermediary network nodes known as
    routers. There are two

    primary forms of IP routing: Static Routing and Dynamic Routing.


    Static routing involves manually adding routes to the system''s route code. Static
    routing enjoys many advantages

    by manipulating the route with static command, such as simplicity of implementation
    on smaller networks, predictability (the routing

    table is always computed in advance, and thus route remains the same time it is
    used), and low

    head on routers and network links due to the lack of dynamic routing protocol.
    However, static

    routing does present some disadvantages. For example, static routing is limited
    to small networks

    and does not scale. Static routing also fails completely to network outages and
    failures along

    the route due to the fixed nature of the route.


    Dynamic routing depends on large networks with multiple possible IP routes from
    a source to a destination

    an makes use of special routing, such as the Router Information Protocol (RIP),
    which handle the

    automatic adjustments in routing tables that make dynamic routing. Dynamic routing
    has

    advantages over static routing, such as superior scalability and the ability to
    adapt to failures and outages

    ell network routes. However, there is less manual configuration of the tables,
    since routers

    learn from one another after their existence and available routes. This trait
    also enables the possibility

    of introducing mistakes in the routing tables via human error. Dynamic routing
    is not perfect, however,

    presents disadvantages such as heightened complexity and additional network overhead
    from router

    communications, which does not immediately benefit the end users, but consumes
    network bandwidth.


    # TCP and UDP


    TCP is a connection-based protocol, offering error correction and guaranteed delivery
    of data via what is

    known as flow control. Flow control determines when the flow of a data stream
    needs to be stopped, and

    previously sent packets should be re-sent due to problems such as collisions,
    for example, thus

    uring complete and accurate delivery of the data. TCP is typically used in the
    exchange of important\information as database transactions.


    The User Datagram Protocol (UDP), on the other hand, is a connectionless protocol
    which seldom

    with the transmission of important data because it lacks flow control or any other
    method to ensure reliable

    delivery of the data. UDP is commonly used in such applications as audio and video
    streaming, where it is

    considerably faster than TCP due to the lack of error correction and flow control,
    and where the loss of a

    few packets is not catastrophic.


    # ICMP


    The Internet Control Messaging Protocol (ICMP) is an extension to the Internet
    Protocol (IP) as defined

    in the Request For Comments (RFC) #792 and supports network packets containing
    control, error, and

    ininformational messages. ICMP is used by network applications as the ping utility,
    which can determine'
