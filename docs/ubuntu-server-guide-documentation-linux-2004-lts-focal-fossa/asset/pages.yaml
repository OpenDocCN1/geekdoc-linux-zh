  md: 'As usual with major configuration changes it is wise to back up your guest
    definition and disk state to be able to do a rollback just in case. There is no
    integrated single command to update the machine type via virsh or similar tools.
    It is a normal part of your machine definition. And updated the same as most others.


    First shutdown your machine and wait until it has reached that state.


    ```

    virsh shutdown <yourmachine>

    # wait

    virsh list --inactive

    # should now list your machine as "shut off"

    ```


    Then edit the machine definition and find the type in the type at the machine
    attribute.


    ```

    virsh edit <yourmachine>

    <type arch=''x86_64'' machine=''pc-i440fx-bionic-hvm''></type>

    ```


    Change this to the value you want. If you need to check what types are available
    via -M providing up types as only Ubuntu types are supported. You can also see
    what the current default will be. In general it is strongly recommended that you
    change newer types if possible to exploit newer features, but also to benefit
    of bugs that only apply to the newer device virtualization.


    +   - -M

    # lists machine types, e.g.

    pc-i440fx-xenial Ubuntu 16.04 PC (i440FX + PII, 1996) (default)

    pc-i440fx-bionic Ubuntu 18.04 PC (i440FX + PII, 1996) (default)


    After this you can start your guest again. You can check the current machine type
    by guest and host depending on your needs.


    ```

    virsh start <yourmachine>

    # check from host, via dumping the xml definition

    virsh dumpxml <yourmachine> | xmllint --xpath "string(//domain/os/type/@machine)"

    # or from the guest via dmidecode (if supported)

    sudo dmidecode -A 1

    ```


    If you need non-live definitions around - like xml files - remember to update
    those as well.


