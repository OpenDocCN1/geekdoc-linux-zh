  md: "# # User Management\n\nUser management is a critical part of maintaining a\
    \ secure system. Ineffective user and privilege management often lead many systems\
    \ into being compromised. Therefore, it is important that you understand how you\
    \ can protect your server through simple and effective user account management\
    \ techniques.\n\n# ## Where is root?\n\nUbuntu developers made a conscientious\
    \ decision to disable the administrative root account by default in all Ubuntu\
    \ installations. This does not mean the root account has been deleted or that\
    \ it may not be accessed. It has merely been given a password hash which matches\
    \ no possible value, therefore may not log in directly by itself.\n\nInstead,\
    \ users are encouraged to use a tool of the name `sudo` to carry out system administrative\
    \ duties. Sudo allows an authorized user to temporarily elevate their privileges\
    \ using their own password instead of having to know the password to the root\
    \ account. This simple yet methodology provides accountability for all user actions,\
    \ and gives the administrator granular control over which actions a user can perform\
    \ with said privileges.\n\n+   * For some reason you wish to enable the root account,\
    \ simply give it a password:\n  ```bash\n  sudo passwd\n  ```\n\nSudo will prompt\
    \ you for your password, and then ask you to supply a new password for root as\
    \ shown below:\n```\n[sudo] password for username: (enter your own password)\n\
    Enter new UNIX password: (enter a new password for root)\nRetype new UNIX password:\
    \ (repeat password for root)\npasswd: updated successfully\n```\n\n+   * To disable\
    \ the root account password, use the following syntax:\n  ```bash\n  sudo passwd\
    \ -l root\n  ```\n\n+   * You should read more on Sudo by reading the page:\n\
    \  ```bash\n  man sudo\n  ```\n\nBy default, the initial user created by the Ubuntu\
    \ installer is a member of the group sudo which is added to the file `/etc/sudoers`\
    \ sudo. If you wish to give any other account full root access through sudo, simply\
    \ add them to the sudo group.\n\n# ## Adding and Deleting Users\n\nThe process\
    \ for managing local users and groups is straightforward and differs little from\
    \ most other GNU/Linux operating systems. Ubuntu and other Debian distributions\
    \ encourage the use of the `adduser` package for account management.\n\n+   *\
    \ To add a user account, use the following syntax, and follow the prompts to give\
    \ the account a password and identifiable characteristics, such as a full name,\
    \ phone number, etc.\n  ```bash\n  sudo adduser username\n  ```\n\n+   * To delete\
    \ a user account and its primary group, use the following syntax:\n  ```bash\n\
    \  sudo deluser username\n  ```"
  merge: -1
