  md: 'The most simple, yet least reliable way to allocate huge pages is to just echo
    a value to sysfs. Be sure to re-check if it worked.


    ```

    $ echo 256 | sudo tee /sys/kernel/mm/hugepages/hugepages-2048kB/nr_hugepages

    $ cat /sys/kernel/mm/hugepages/hugepages-2048kB/nr_hugepages

    256

    ```


    There one of these sizes is "default huge page size" which will be used in the
    auto-mounted /dev/hugepages. Changing the default size requires a reboot and is
    set via default_hugepagessz

    You can check the current default size:


    ```

    $ grep Hugepagesize /proc/meminfo

    Hugepages:             2048 kB

    ```


    But there can be more than one at the same time one better:


    ```

    $ tail /sys/kernel/mm/hugepages/hugepages-*/nr_hugepages \

    ==>/sys/kernel/mm/hugepages/hugepages-1048576kB/nr_hugepages \

    ==>/sys/kernel/mm/hugepages/hugepages-2048kB/nr_hugepages ===

    2

    ```


    And even that on bigger systems there be further split by Numa node.

    One can allocate huge pages at runtime, but due to fragmentation there are no
    guarantees it works later.

    Huge pages must be allocated by the kernel as mentioned above but to be consumable
    they also have to be mounted. By default system will make /dev/hugepages available
    for the default huge page size. Feel to add more pages if you need different size.
    An overview can be queried with


    ```

    $ hugeadm --list all-mounts

    Mount Point             Options

    /dev/hugepages         rw,relatime, pagesize=2M

    ```


    A one-stop info for the overall huge page status of the system can be reported
    with


    ```

    $ hugeadm —explain

    ```


    # Huge page usage in libvirt


    With the above in place libvirt can map guest memory to huge pages. In a guest
    definition add the most simple form of


    ```

    <memoryBacking>

    <hugepages/>

    </memoryBacking>

    ```


    That will allocate the huge pages using the default huge page size for a autodetected
    mountpoint. For more control e.g. how memory is spread over Numa nodes or which
    page size to use check out details at the libvirt doc.


