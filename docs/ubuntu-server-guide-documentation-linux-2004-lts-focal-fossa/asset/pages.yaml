  md: '# Web Servers


    The primary function of a web server is to store, process and deliver Web pages
    to clients. The clients communicate with the server sending HTTP requests. Clients,
    mostly via Web Browsers, request for specific resources and the server responds
    with the content of that resource or an error message. The response is usually
    a Web page as HTML documents may include images, style sheets, scripts, and in
    the content of form.


    When accessing a Web Server, every HTTP request that is received is responded
    to with a content and an HTTP status code. HTTP status codes are three-digit,
    and are grouped into five different classes. The class of a status code can be
    quickly identified by its first digit:


    +   - 1xx: Informational - Request received, continuing process

    - 2xx: Success - The action was successfully received, understood, and accepted

    - 3xx: Redirection - Further action must be taken in order to complete the request

    - 4xx: Client Error - The request contains bad syntax or cannot be fulfilled

    - 5xx: Server Error - The server failed to fulfill an apparently valid request


    More information about status code check the RFC 2016.


    # Implementation


    Web Servers are heavily used in the deployment of Web sites and in this scenario
    we can use two different implementations:


    +   - Static Web Server: The content of the server response will be the files
    "as-is"

    - Dynamic Web Server: Consist in a Web Server plus an extra software, usually
    an application server and a database. For example, to produce the Web pages you
    see in the Web browser, the application server might fill an HTML template with
    contents from a database. Due to that we say the content of the server''s response
    is generated dynamically.


    # Introduction to High Availability


    A definition of High Availability Clusters from Wikipedia:


    # High Availability Clusters


    High-availability clusters (also known as HA clusters, fail-over clusters or Metroclusters
    Active/Active ) are groups of computers that support server applications that
    can be reliably utilized with a minimum amount of down-time.


    They operate using high availability software to harness redundant computers in
    groups or clusters that provide continued service when system components fail.


    Without clustering, if a server running a particular application crashes, the
    application will be unavailable until the crashed server is fixed. Clustering
    remedies this situation by detecting hardware/software faults, and immediately
    restarting the application on another system without requiring administrative
    intervention, a process known as fail.


    As of this process, clustering software may configure the node before starting
    the application on it. For example, appropriate file systems may need to be imported
    and mounted, network hardware may have to be configured, and some supporting applications
    may need to be running as well.'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'HA clusters are often used for critical databases, file sharing on a network,
    business applications, and customer services as electronic commerce websites.


    # High Availability Cluster Heartbeat


    HA clusters implement attempt to rebuild redundancy into a cluster to eliminate
    single points of failure, including multiple network connections and data storage
    which is redundantly connected via storage area networks.


    HA clusters use a heartbeat private network connection which is used to monitor
    the health and status of each node in the cluster. One subtle but serious condition
    all software must be able to handle split-brain, which occurs when all of the
    private links go down simultaneously, but the cluster nodes are still running.


    If that happens, each node in the cluster mistakenly decide that every other node
    has gone down and attempt to start services that other nodes are still running.
    Having duplicate instances of services may cause data corruption on the shared
    storage.


    # High Availability Cluster Quorum


    HA clusters often use quorum witness storage (local or cloud) to avoid this scenario.
    A witness device cannot be shared between two halves of a split cluster, in the
    event that all cluster members cannot communicate with each other (e.g., failed
    heartbeat), if a member cannot access the witness, it cannot become active.


    # Example


    ```

    2node1Cluster|578x674,75%

    ```


    # Fencing


    Fencing protects your data from being corrupted, and your application from becoming
    unavailable, due to unintended access by rogue nodes.


    Just as a node is unresponsive doesn''t mean it has accessing your data. The only
    way to be 100% sure that your data is safe, is to use fencing to ensure that the
    node is truly offline before allowing the data to be accessed from another node.


    Fencing also has a role to play in the event that a clustered service cannot be
    stopped. In this case, the cluster uses fencing to fence the whole node offline,
    making it safe to start the service elsewhere.


    Fencing is also known as STONITH, an acronym for "Shoot The Other Node In The
    Head", since the most popular form of fencing is cutting a node''s power.


    Key Benefits:


    +   - Active countermeasure taken by a functioning host to isolate a misbehaving
    (usually dead) host from shared data.

    - MOST CRITICAL part of a cluster utilizing SAN or other shared storage technology
    (Ubuntu HA Clusters can only be supported if the fencing mechanism is configured).

    - Required by OCFS2, GFS2, LVM2 (before Ubuntu 20.04), lvlockd (from 20.04 and
    beyond).'
  merge: -1
  pgno: 255
