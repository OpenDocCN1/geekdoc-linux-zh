    # LDAP & TLS


    When authenticating to an OpenLDAP server it is best to do using an encrypted
    session. This can be accomplished using Transport Layer Security (TLS).


    Here, we will be our own Certificate Authority and then sign our LDAP server certificate
    as that CA. This guide will use the certtool utility to complete these tasks.
    For simplicity, this is being done on the OpenLDAP server itself, but your real
    internal CA should be elsewhere.


    Install the gnutsls-bin and ssl-cert packages:


    ```

    sudo apt install gnutsls-bin ssl-cert

    ```


    Create a private key for the Certificate Authority:


    ```

    sudo certtool --generate-privkey --bits 4096 --output /etc/ssl/private/

    mcakey.pem

    ```


    Create the template /etc/ssl/ca.info to define the CA:


    ```

    cn = Example Company

    ca

    cert_signing_key =

    expiration_days = 3650

    ```


    Create the self-signed CA certificate:


    ```

    sudo certtool --generate-self-signed \

    --load-privkey /etc/ssl/private/mycakey.pem \

    --template /etc/ssl/ca.info \

    --output /usr/local/share/ca-certificates/mycacert.pem

    ```


    Yes, the -output path is correct, is writing the CA certificate to ca-certificates.
    This is where update-ca-certificates will pick up trusted local CAs. To pick up
    CAs from /usr/share/ca-certificates, a call to dpkg-reconfigure ca-certificates
    is necessary.


    Run update-ca-certificates to add the new CA certificate to the list of trusted
    CAs. Note the one added CA:


    ```

    $ sudo update-ca-certificates

    ```


    Updating certificates in /etc/ssl/certs...

    1 added, 0 removed; done.


    Running hooks in /etc/ca-certificates/update.d...

    done.


    This creates a certificate /etc/ssl/certs/mycacert.pem symlink pointing to the
    real file in /usr/local/share/ca-certificates.


    Make a private key for the server:


    ```

    sudo certtool --generate-privkey \

    --bits 2048 \

    --output /etc/ldap/ldap01_slapd_key.pem

    ```'
  merge: -1
  pgno: 205
- img_proc: true
  md: '# Note


    Replace ldap01 in the filename with your server''s hostname. Naming the certificate
    and key for the host and service that you use will help keep things clear.

    Create the /etc/ssl/ldap01.info file containing:

    organization = Example Company

    cn = ldap01.example.com

    tls_www_server

    encryption_key

    signing_key

    pexpiration_days = 365


    The above certificate is good for 1 year, and it''s valid only for the ldap01.example.com
    hostname. Adjust accordingly.


    Create the server''s certificate:

    sudo certtool --generate-certificate \

    --load-privkey /etc/ldap/ldap01_slapd_key.pem \

    --load-ca-certificate /etc/ssl/certs/mycacert.pem \

    --load-ca-privkey /etc/ssl/private/myca.pem \

    --template /etc/ssl/ldap01.info \

    --outfile /etc/ldap/ldap01_slapd_cert.pem


    Adjust permissions and ownership:

    sudo chgrp openldap /etc/ldap/ldap01_slapd_key.pem

    sudo chmod 0640 /etc/ldap/ldap01_slapd_cert.pem


    Your server is now ready to accept the new TLS configuration.

    Create the file certinfo.ldif with the following contents (adjust paths and filenames
    accordingly):

    dn: cn=config

    add: olcTLSCertificateFile\olcCSCertificateFile: /etc/ssl/certs/mycacert.pem

    add: olcTLSCertificateFile

    olCSCertificateFile: /etc/ldap/ldap01_slapd_cert.pem

    add: olcTLSCertificateKeyFile

    olcSCertificateKeyFile: /etc/ldap/ldap01_slapd_key.pem


    Use the ldapmodify command to tell slap about your work via the slap-config database:

    sudo ldapmodify -Y EXTERNAL -H ldap:/// -f certinfo.ldif

    Contrary to popular belief, you do not need ldaps: in /etc/default/slapd to use
    encryption. Your should have just:

    SLAP_SERVICES="ldap://"


    # Note


    LDAP over TLS/SSL (ldap://) is deprecated in favour of StartTLS. The latter refers
    to an existing LDAP session (listening on TCP port 389) becoming protected by
    TLS/SSL whereas LDAP, like HTTPS, is a distinct-from-the-start protocol that operates
    over TCP port 636.


    207'
