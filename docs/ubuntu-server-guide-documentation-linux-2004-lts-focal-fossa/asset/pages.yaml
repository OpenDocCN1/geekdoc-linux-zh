  md: '# Installation


    To install WordPress, run the following comand in the command prompt::


    ```

    sudo apt install wordpress

    ```


    You should also install apache2 web server, and mysql server. For installing apache2
    web server, please refer to Apache2 documentation. For installing mysql server,
    please refer to MySQL documentation.


    # Configuration


    For configuring your first WordPress application, configure an apache site. Open
    /etc/apache2/sites-available/wordpress.conf and write the following lines:


    ```

    Alias /blog /usr/share/wordpress

    <Directory /usr/share/wordpress>

    Options FollowSymLinks

    AllowOverride Limit FileInfo

    DirectoryIndex .php

    Order allow, deny

    Allow from all

    </Directory>

    <Directory /usr/share/wordpress/wp-content>

    Options FollowSymLinks

    Order allow, deny

    Allow from all

    </Directory>

    ```


    Enable this new WordPress site


    ```

    sudo a2ensite wordpress

    ```


    Once you configure the apache2 web server and make it ready for your WordPress
    application, you should restart it. You can run the following command to restart
    the apache2 web server:


    ```

    sudo systemctl reload apache2.service

    ```


    To facilitate multiple WordPress installations, the name of this configuration
    file is based on the Host header of the HTTP request. This means that you have
    a configuration for VirtualHost by simply matching the hostname portion of your
    configuration with Apache Virtual Host. e.g. /etc/wordpress/config-10.21.55.50.php,
    /etc/wordpress/config-localhost.php, These instructions assume you can access
    Apache via the localhost hostname (perhaps using an ssh tunnel) if not, replace
    /etc/wordpress/config-localhost.php with /etc/wordpress/config-NAME_OF_VIRTUAL_HOST.php.


    Once the configuration is written, it is up to you to choose a convention for
    username and password to mysql for each WordPress database instance. This documentation
    shows only one, localhost, example.

    Now configure WordPress to a mysql database. Open /etc/wordpress/config-localhost.php
    and write the following lines:


    ```

    <?php

    define ( ''DB_NAME'', ''wordpress'' );

    define ( ''DB_USER'', ''wordpress'' );

    define ( ''DB_PASSWORD'', ''yourpasswordhere'' );

    define ( ''DB_HOST'', ''localhost'' );

    define ( ''WP_CONTENT_DIR'', ''/usr/share/wordpress/wp-content'' );

    ?>

    ```'
