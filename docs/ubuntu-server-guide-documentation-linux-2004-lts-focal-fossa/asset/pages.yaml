    # Puppet


    Puppet is a cross platform framework enabling system administrators to perform
    common tasks using code. The code can do a variety of tasks from installing new
    software, to checking file permissions, or updating user accounts. Puppet is great
    not only during the initial installation of a system, but also throughout the
    system''s entire life cycle. In most circumstances puppet will be used in a client/server
    configuration.


    This section will cover installing and configuring Puppet in a client/server configuration.
    This simple example will demonstrate how to install Apache using Puppet.'
