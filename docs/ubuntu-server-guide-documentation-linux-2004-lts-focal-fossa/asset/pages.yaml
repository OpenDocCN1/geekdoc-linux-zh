  md: '# Ephemeral Containers


    While snapshots are useful for longer-term incremental development of images,
    ephemeral containers utilize snapshots for quick, single-use throwaway containers.
    Given a base container C1, you can start an ephemeral container using


    ```

    lxc-start-ephemeral -o C1

    ```


    The container begins as a snapshot of C1. Instructions for logging into the container
    will be printed to the console. After shutdown, the ephemeral container will be
    destroyed. The lxc-start-ephemeral manual for more options.


    # Lifecycle management hooks


    Beginning with Ubuntu 12.10, it is possible to define hooks to be executed at
    specific points in a container''s lifetime:


    +   - Pre-start hooks are run in the host''s namespace before the container tty,
    consoles, or mounts are up.

    - If any mounts are done in this hook, they should be cleaned up in the post-start
    hook.

    - Pre-mount hooks are run in the container''s namespaces, but before the root
    filesystem has been mounted. Mounts done in this will be automatically cleaned
    up when the container shuts down.

    - Mount hooks are run after the container filesystems have been mounted, but before
    the container has called pivot_root to change its root filesystem.

    - Start hooks are run immediately after executing the container''s init. Since
    these are executed after pivoting into the container''s filesystem, the command
    must be copied into the container''s filesystem.

    - Post-stop hooks are executed after the container has shut down.


    If any hook returns an error, the container will be aborted. Any post-stop hook
    will still be executed. Any output generated by the script will be logged by the
    debug process.


    Please see the lxc.container.conf(5) manual page for the configuration format
    with which to specify hooks. Some sample hooks are shipped with the lxc package
    to serve as an example of how to write and use such hooks.


    # Consoles


    Containers have a configurable number of consoles. One exists on the container''s
    /dev/console. This is shown on the terminal from which you run lxc-start, unless
    the -d option is specified. The output on /dev/console can be redirected to a
    file using the -c console-file option to lxc-start. The number of extra consoles
    is specified by the lxc.tty variable, and usually set to 4. Consoles are shown
    on /dev/ttyN (1 <= N < 4). To log into 3 consoles from the host:


    ```

    sudo lxc-console -n 3

    ```


    or if the t N is not specified, an unused console will be automatically chosen.
    To exit the console, use the escape sequence Ctrl-a q. Note that the escape sequence
    does not work in the console resulting from lxc-start without the -d option.


    Each console is a Unix88 in the host''s (not the guest''s) pty mount, bind-mounted
    over the guest''s /dev/ttyN and /dev/console. If the guest unmounts those or tries
    to access the actual character device 4:N, it will not be getting served by the
    LXC consoles (With the default settings, the container will not be able to access
    that character device and getty will therefore fail.). This can easily happen
    when a boot script blindly mounts a new /dev.'
