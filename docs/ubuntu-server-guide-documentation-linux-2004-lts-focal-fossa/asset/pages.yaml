    # Configuration


    The configuration files for phpMyAdmin are located in /etc/phpadmin. The main
    configuration file is /etc/phpadmin/config.inc.php. This file contains configuration
    options that apply globally to phpMyAdmin.

    To use phpMyAdmin to administer a MySQL database hosted on another server, adjust
    the following in /etc/phpadmin/config.inc.php:


    ```

    $cfg[ ''Servers'' ][$i] = ''db_server ''

    ```


    # Note


    Replace db_server with the actual remote database name or IP address. Also, be
    sure that the phpMyAdmin host has permissions to access the remote database.

    Once configured, log out of phpMyAdmin and back in, and you will be accessing
    the new server.

    The config.header.inc.php and footer.inc.php files in /etc/phpadmin directory
    are used to add a HTML header and footer for phpMyAdmin.

    Another important configuration file is /etc/phpadmin/apache.conf, which is symlinked
    to /etc/apache2/conf-available/phpadmin. The file contains directives for loading
    PHP, directory permissions, From a terminal type:

    sudo ln -s /etc/phpadmin/apache.conf /etc/apache2/conf-available/phpadmin.conf

    sudo a2enconf phpmyadmin

    sudo systemctl reload apache2.service


    For more information on configuring Apache2 see this documentation.


    # References


