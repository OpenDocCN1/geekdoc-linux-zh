- img_proc: true
  md: "2. Blacklist by wwid\n\nRegular expression for the World Wide Identifier, a\
    \ device to be excluded/included\n\n3. Blacklist by device\n\nSubsection for the\
    \ device description. This subsection recognizes the vendor and product keywords.\
    \ Both are regular expressions.\n\n```\ndevice {\n  vendor \"LENovo\"\n  product\
    \ \"Universal Xport\"\n}\n```\n\n4. Blacklist by property\n\nRegular expression\
    \ for an udev property. All devices that have matching udev properties will be\
    \ excluded/included. The handling of the keyword is special, because devices must\
    \ have at least one whitelisted udev property; otherwise they're treated as blacklisted,\
    \ and the message “blacklisted, udev property missing” is displayed in the logs.\n\
    \n5. Blacklist by protocol\n\nThe protocol strings that multipath recognizes are\
    \ scifep, scsi:spi, scsi:ssa, scsi:sbp, scsi:srp, scsi:iscs, scsisas, scsi:adt,\
    \ scsiata, scsi:unspec, cww, csis, nvme, and udev. The protocol that a path is\
    \ be viewed by running multipath show format “%d %P”\n\n6. Blacklist Exceptions\n\
    \nThe blacklist_exceptions section is used to revert the actions of the blacklist\
    \ section. This allows one to selectively include (“whitelisted”) devices which\
    \ would normally be excluded by the blacklist section.\n\n```\nblacklist_exceptions\
    \ {\n  property \"SCSI_IDENT |_ID_WWN\"\n}\n```\n\nA common use is to blacklist\
    \ “everything” using a catch-all regular expression, and create specific blacklist_exceptions\
    \ entries for those devices that should be handled by multipath-tools.\n\n# Configuration\
    \ File Multipath Section\n\nThe multipaths section allows setting attributes of\
    \ multipath maps. The attributes that are set via the multipaths section (see\
    \ list below) take precedence over all other configuration settings, including\
    \ those from the overrides section.\n\nThe only recognized attribute for the multipaths\
    \ is the multipath subsection. If there are multiple multip subsections matching\
    \ a given WWID, the contents of these sections are merged, and settings from later\
    \ entries take precedence.\n\nThe multipath subsection recognizes the following\
    \ attributes:\n\n+   - wwid = (Mandatory) World Identifier. Detected multipaths\
    \ are matched against this attribute. Note that, unlike the wwid attribute in\
    \ the blacklist section, this is not a regular expression or a substring; WWIDs\
    \ must match exactly inside the multipath section.\n\n+   - alias = Symbolic name\
    \ for the multipath map. This takes precedence over an entry for the same WWID\
    \ in the bindings_file.\n\nThe following attributes are optional; if not set the\
    \ default values are taken from the overrides, devices, and defaults section:"
