  pgno: 316
- img_proc: true
  md: 'The process for network booting the live installer is similar for both modes
    and goes like this:


    +   1. The-to-be-installed machine is directed to network boot.

    2. The DHCP/boot server tells the machine its configuration and where to get the
    bootloader.

    3. The machine''s firmware downloads the bootloader over tftp and executes it.

    4. The bootloader downloads configuration, also over tftp, telling it where to
    download the kernel, ramdisk and kernel command to use.

    5. The ramdisk looks at the kernel command to learn how to configure the network
    and to download the server ISO.

    6. The ramdisk downloads the ISO and mounts it as a loop device.

    7. From this point the install follows the same path as if the ISO was on a local
    device.


    The difference between UEFI and legacy modes is that in UEFI mode the bootloader
    is a EFI executable, signed so it is accepted by SecureBoot, and in legacy mode
    it is PXELINUX. Most DHCP/bootp servers can be configured to serve the right bootloader
    to a particular machine.


    # Configuring DHCP/boot and tftp


    There are several implementations of DHCP and tftp protocols available. This document
    will briefly describe how to configure dnsmasq to perform both of these roles.


    +   1. Install dnsmasq with `sudo apt install dnsmasq`

    2. Put something like this in `/etc/dnsmasq.conf/pxe.conf:

    ```

    interface<=your interface ,lo

    bind-interfaces

    dhcp-range=your interface >,192.168.0.100,192.168.0.200

    dhcp-boot=pxelinux.0

    dhcp-match=set=efi-x86_64,client=arch,7

    dhcp-boot-tag=efi-x86_64,bootx64.efi

    enable-tftp

    tftp-root=/srv/tftp

    ```

    (This assumes several things about your network; read man dnsmasq or the default
    /etc/dnsmasq.conf for more options.)

    3. restart dnsmasq with systemctl restart dnsmasq.service.


    # Serving the bootloaders and configuration.


    We need to make this section possible to write sanely


    Ideally this would be something like:


    ```

    # apt install cd-boot-images-amd64

    # ln -s /usr/share/cd-boot-images-amd64 /srv/tftp/boot-amd64

    ```


    # Mode independent set up


    +   1. Download the latest live ISO for the release you want to install:

    ```

    # wget http://cdimage.ubuntu.com/ubuntu-server/daily-live/current/focal-live-server-amd64.iso

    ```

    2. Mount it.'
