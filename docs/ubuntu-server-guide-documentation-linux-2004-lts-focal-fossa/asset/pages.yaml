  md: '# Server Keys and Certificates


    Next, we will generate a key pair for the server:

    ./ easyrsa gen-req myservername noopass


    Diffie Hellman parameters must be generated for the OpenVPN server. The following
    will place them in

    pki/dh.pem.


    ```

    ./ easyrsa gen-dh

    ```


    And finally a certificate for the server:

    ./ easyrsa gen-req myservername noopass

    ./ easyrsa sign-req server myservername


    All certificates and keys have been generated in subdirectories. Common practice
    is to copy them to

    /etc/openvpn/

    c pki/dh.pem pki/ca.crt pki/issued/myservername.crt pki/private/myservername.

    key /etc/openvpn/


    # Client Certificates


    The VPN client will need a certificate to authenticate itself to the server. Usually
    you create a

    certificate for each client.

    This can either be done on the server (as the keys and certificates above) and
    then securely distributed to

    t client. Or versa: the client can generate and submit a request that is sent
    and returned by the server.


    To create the certificate, enter the following in a terminal while using user
    root:

    ./ easyrsa gen-req client1 nopass

    ./ easyrsa sign-req client client1


    If the first command above was done on a remote system, then copy the .req file
    to the CA server. You can go there

    import it via easyrsa import-req /incoming/myclient1.req my1. Then you can go
    on

    the second sign-req command.


    +   - pki/ca.crt

    - pki/issued/myclient.crt


    As the client certificates and keys are only required on the client machine, you
    can remove them from the

    server.


    # Simple Server Configuration


    Along with your OpenVPN installation you get these sample config files (and many
    more if you check):

    root@server# ls -l /usr/share/doc/openvpn/examples/sample-config-files/

    total 68


    ```

    -rw-r--r-- 1 root root 3427 2011-07-04 15:09 client.conf

    -rw-r--r-- 1 root root 4141 2011-07-04 15:09 server.conf.gz

    ```


    Start with copying and unpacking server.conf.gz to /etc/openvpn/server.conf.'
