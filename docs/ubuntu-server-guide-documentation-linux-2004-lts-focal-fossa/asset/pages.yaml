- img_proc: true
  md: 'Furthermore since losing an ssh server might mean losing your way to reach
    a server, check the configuration after changing it and before restarting the
    server:

    sudo sshd -t /etc/ssh/sshd_config


    The following are examples of configuration directives you may change:


    +   - To set your OpenSSH to listen on TCP port 2222 instead of the default TCP
    port 22, change the Port directive as such:

    Port 2222

    - To make your OpenSSH server display the contents of the /etc/issue.net file
    as a pre-login banner, simply add or modify this line in the /etc/ssh/sshd_config
    file:

    Banner /etc/issue.net


    After making changes to the /etc/ssh/sshd_config file, save the file, and restart
    the sshd server application to effect the changes using the following command
    at a terminal prompt: sudo systemctl restart sshd.service


    # Warning


    Many configuration directives for sshd are available to change the server application''s
    behavior to fit your needs. Be advised, however, if your only method of access
    to a server is ssh, and if you make a mistake in configuring sshd via the /etc/ssh/sshd_config
    file, you may find yourself locked out of the server upon restarting. Additionally,
    if an incorrect directive is supplied, the sshd server may refuse to start, so
    be extra careful when editing this file on a remote server.


    # SSH Keys


    SSH allow authentication between two hosts without the need of a password. SSH
    key authentication uses a private key and a public key.


    To generate the keys, from a terminal prompt enter:


    ```

    ssh-keygen -t rsa

    ```


    This will generate the keys using the RSA Algorithm. At the time of this writing,
    the generated keys will have 3072 bits. You may modify the number of bits by using
    the -b option. For example, to generate keys with 4096 bits, you can do:


    ```

    ssh-keygen -t rsa -b 4096

    ```


    During the process you will be prompted for a password. Simply hit Enter when
    prompted to create the key.


    By default the public key is saved in the file ~/.ssh/id_rsa.pub, while ~/.ssh/id_rsa
    is the private key. Now copy the id_rsa.pub to the remote host and append it to
    ~/.ssh/authorized_keys by entering: ssh-copy-id username@remotehost


    Finally, double check the permissions on the authorized_keys file, only the authenticated
    user should have read and write permissions. If the permissions are not correct
    change them by:


    ```

    chmod 600 .ssh/authorized_keys

    ```


    You should be able to SSH to the host without being prompted for a password.'
