    A directory accessed via LDAP is good for anything that involves a large number
    of requests to a mostly-read, attribute-based (name:value) that can benefit from
    a hierarchical structure. Examples include an address book, company directory,
    a list of email addresses, and a mail server''s configuration.


    # Installation


    The installation of slapd will create minimal working configuration with a top
    level entry, and an administrator''s DIT. In particular, it will create a database
    instance that you can use to store your data. However, the suffix (or base DN)
    of this instance will be determined by the domain name of the host. If you want
    something different, you can change it after the installation when you still don''t
    have any useful data.


    # Note


    This guide will use a database suffix for dc=example,dc=com.


    Proceed with the install of the server and the main command line utilities:


    ```

    sudo apt install slapd ldap-utils

    ```


    If you want to change your DIT suffix, now would be a good time, because changing
    discards your existing one. To change the suffix, run the following command:


    ```

    sudo dpkg-reconfigure slapd

    ```


    To switch your DIT suffix to dc=example,dc=com, for example, you can follow this
    guide more closely, answer example.com when asked about the DNS domain name.


    Throughout this guide we issue commands with the LDAP utilities. To save some
    typing, we configure the OpenLDAP libraries with certain details in /etc/ldap/ldap.conf:


    ```

    BASE dc=example,dc=com

    URI ldap:///01.example.com

    TLS_CACERT=/etc/ssl/ca-certificates.crt

    ```


