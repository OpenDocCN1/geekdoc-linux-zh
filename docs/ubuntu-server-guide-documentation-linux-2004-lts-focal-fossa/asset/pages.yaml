  md: '# Note


    This is not necessary for all my.cnf changes. Most of the variables you may wish
    to change to improve performance are adjustable even when the server is running.
    As with anything, make sure to have a good backup copy of config files and data
    before making changes.


    # MySQL Tuner


    MySQL Tuner connects to a running MySQL instance and offer configuration suggestions
    to optimize the database for your workload. The longer the server has been running,
    the better the advice mysltuner can provide. In a production environment, consider
    waiting for at least 24 hours before running the tool. You can install mysltuner
    from Ubuntu repositories:


    ```

    sudo apt install mysltuner

    ```


    Once it has been installed, run:


    ```

    mysltuner

    ```


    and wait for its report. The top section provides general information about the
    database server, and the bottom section provides suggestions to alter in your.cnf.
    Most of these can be altered on the server without restarting; look through the
    official MySQL documentation (link in Resources section) for the relevant variables
    to change in production. The following example is part of a report from a production
    database showing potential benefits from increasing the query cache:


    +   - Recommendations:


    +   Run OPTIMIZE TABLE to fragment tables for better performance

    Increase table_cache_size to avoid file descriptor

    Variables to adjust:

    key_buffer_size (> 1.4G)

    query_cache_size (> 32M)

    table_cache (> 64)\innodb_buffer_pool_size (>= 22G)


    It is worth noting that optimization strategies vary from application to application.
    For example, what works for Wordpress might not be the best for Drupal or Joomla.
    Performance can be dependent on the types of queries, use of indexes, how efficient
    the database design is and so on. You may find it useful to spend some time searching
    for database tuning tips based on what applications you''re using. Once you''ve
    reached the point of diminishing returns from database configuration adjustments,
    look to the application itself for improvements, or invest in more powerful hardware
    and/or scaling up the database environment.


