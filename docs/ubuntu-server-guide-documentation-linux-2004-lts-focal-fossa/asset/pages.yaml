    ubuntu\")\nTrue\n>>> c.start()\nTrue\n>>> c.wait(\"STOPPED\")\nTrue\n```\n\n#\
    \ Security\n\nA namespace maps ids to resources. By not providing an id with which\
    \ to a reference, the resource can be protected. IPC namespaces are completely\
    \ isolated. Other namespaces, however, have various leaks which allow privilege\
    \ to be inappropriately exerted from one container or to the host.\n\nBy default,\
    \ LXC containers are started under a AppArmor policy to restrict some actions.\
    \ The details of AppArmor integration with lxc are in section AppArmor. Unprivileged\
    \ containers go further by mapping root in the container to an unprivileged UID.\
    \ This prevents access to /proc and /sys files representing host resources, as\
    \ well as other files owned by root.\n\n# Exploitable system calls\n\nIt is a\
    \ core container feature that containers share a kernel with the host. Therefore\
    \ if the kernel contains any exploitable system calls the container can exploit\
    \ these as well. Once the container controls the kernel it can fully control any\
    \ resource known to the host.\n\nIn general a full distribution contains a large\
    \ number of system calls will be needed. However for application containers it\
    \ may be possible to reduce the number of available system calls to only a few.\
    \ For system containers running a full distribution security gains may be had,\
    \ by removing the 32-bit compatibility system calls in a 64-bit container. The\
    \ lxc.container.conf manual page for details of how to configure a container to\
    \ use seccomp. By default, no seccomp policy is loaded.\n\n# Resources\n\n+  \
    \ * The DeveloperArticle LXC: Linux container tools was an early introduction\
    \ to the use of containers.\n* The Secure Containers Cookbook demonstrated the\
    \ use of security modules to make containers secure."
