  md: '# External User Database Authentication


    Most enterprise networks require centralized authentication and access controls
    for all system resources. If you have configured your server to authenticate users
    against external databases, be sure to disable the user accounts both externally
    and locally. This way ensure that local fallback authentication is not possible.


    # AppArmor


    AppArmor is a Linux Security Module implementation of name-based mandatory access
    controls. AppArmor confines individual programs to a set of listed files and ports
    1003.ie draft capabilities.


    AppArmor is installed and loaded by default. It uses profiles of an application
    to determine what files and permissions the application requires. Some packages
    will install their own profiles, and additional profiles can be found in the apparmor-profiles
    package.


    To install the apparmor-profiles package from a terminal prompt:


    ```

    sudo apt install apparmor-profiles

    ```


    AppArmor has two modes of execution:


    +   * Complaining/Learning: profile violations are permitted and logged. Useful
    for testing and developing new profiles.

    * Enforced/Confined: confines profile policy as well as logging the violation.


    # Using AppArmor


    The optional apparmor-utils package contains command line utilities that you can
    use to change the AppArmor execution mode, the status of a profile, create new
    profiles, etc.


    +   * apparmor_status is used to view the current status of AppArmor profiles.

    sudo apparmor_status


    +   * aa-complain places a profile into complain mode.

    sudo aa-complain /path/to/bin


    +   * aa-enforce places a profile into enforce mode.

    sudo aa-enforce /path/to/bin


    +   * /etc/apparmor.d directory is where the AppArmor profiles are located. It
    can be used to manipulate the mode of all profiles.


    Enter the following to place all profiles in complain mode:

    sudo aa-complain /etc/apparmor.d/*


    To place all profiles in enforce mode:

    sudo aa-enforce /etc/apparmor.d/*


    +   * apparmor_parser is used to load a profile into the kernel. It can also be
    used to reload a currently loaded profile using the -r option after modifying
    it to have the changes take effect. To reload a profile:

    sudo apparmor_parser -r /etc/apparmor.d/profile.name'
