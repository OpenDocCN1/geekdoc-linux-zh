  md: '+   - envvars: file where Apache2 environment variables are set.


    +   - mods-available: this directory contains configuration files to load modules
    and configure them.

    Not all modules will have specific configuration files, however.


    +   - mods-enabled: holds symlinks to the files in /etc/apache2/mods-available.
    When a configuration file is symlinked it will be enabled the next time apache2
    is restarted.


    +   - ports.conf: houses the directives that determine which TCP ports Apache2
    is listening on.


    +   - sites-available: this directory has configuration files for Apache Virtual
    Hosts. Virtual Hosts allow Apache2 to be configured for multiple sites that have
    separate configurations.


    +   - sites-enabled: like mods-enabled, contains symlinks to the /etc/apache2/sites-available
    directory. When a configuration file in sites-available is symlinked, the site
    configured by it becomes active once Apache2 is restarted.


    +   - mime: instructions for determining MIME type based on the first bytes of
    a file.


    In addition, other configuration files may be added using the Include directive,
    and wildcards can be used to include any configuration files. Any directive may
    be placed in any of these configuration files. Changes to the main configuration
    files are only recognized by Apache when it is started or restarted.


    The server also has a containing document types; the filename is set by the TypesConfig
    directive, typically via /etc/apache2/mods-available/mime, which might also include
    additions and overrides, and /etc/mime.types by default.


    # Basic Settings


    This section explains Apache2 essential configuration parameters. Refer to the
    Apache2 Documentation for more details.


    +   - Apache2 ships with a virtual-host-default configuration. That is, it is
    configured with a single default virtual host (using the VirtualHost directive)
    which can be modified or used as is if you have a single site, or as a template
    for additional virtual hosts if you have multiple sites. If left, the default
    virtual host will serve as your default site, or the site users will see the URL
    they enter does not match the ServerName directive of any of your custom sites.
    To modify the default virtual host, edit the file /etc/apache2/sites-available/000-default.conf.


    # Note


    The directives set for a virtual host apply only to that particular host. If a
    directive is set-wide and not defined within the host settings, the default is
    used. For example, you can define a Webmaster email address and not define individual
    email addresses for each virtual host.


    If you wish to create a new virtual host, copy the file to the same name in a
    new directory you choose. For example:


    ```

    sudo cp /etc/apache2/sites-available/000-default.conf /etc/apache2/sites-available/mysite.conf

    ```


    Edit the file to configure the new site using one of the directives described
    below.


    +   - The ServerAdmin directive specifies the email address to be advertised for
    the server''s administrator. The default value is webmaster@localhost. This should
    be changed to an address that is delivered to you (if you are the server''s administrator).
    If your website has a problem, Apache2 will display an error message containing
    this email address to report the problem. Find this directive in your site''s
    configuration file in /etc/apache2/sites-available.'
