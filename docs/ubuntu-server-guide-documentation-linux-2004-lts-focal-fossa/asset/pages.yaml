  md: '```

    passdb backend = ldaps:ldap://ldap01.example.com

    ldap suffix = dc=example,dc=com

    ldap user suffix = ou=People

    ldap group suffix = ou=Computers

    ldap idmap suffix = ou-Idmap

    ldap admin dn = cn=admin,dc=example,dc=com

