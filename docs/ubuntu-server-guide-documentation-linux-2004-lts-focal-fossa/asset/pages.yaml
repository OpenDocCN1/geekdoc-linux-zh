  md: '# Device Mapper Multipathing - Introduction


    Device Mapper Multipath will be referred here as multipath only.

    Multath allows you to configure multiple I/O paths between server nodes and storage
    arrays into a single device. These I/O paths are physical SAN connections that
    can include separate cables, switches, and controllers.

    MMultipathing aggregates the I/O paths, creating a new device that consists of
    the aggregated paths. This chapter provides an introduction and a high-level overview
    of multipath.


    # Overview


    Multipath can be used to provide:


    +   - Redundancy multipath can provide failover in an active/passive configuration.
    In an active/passive configuration, only half the paths are used at time for I/O.
    If any element of an I/O path (the cable, switch, or controller) fails, multipath
    switches to an alternate path.

    - Improved Performance Multipath can be configured in active/active mode, where
    I/O is spread over the paths in a round-robin fashion. In some configurations,
    multipath can detect load on the I/O paths and dynamically rebalance the load.


    # Storage Array Overview


    It is a good idea to configure your storage vendor installation guide for the
    recommended multipath configuration variables for your storage model. The default
    configuration will work well but will likely need adjustments over your storage
    setup.


    # Multipath Components


    | Component | Description | | | dm_multipath kernel module | Reroutes |

    | I/O and supports failover for paths and path groups. | | multipath command |
    Lists and configures |

    | multipath devices. | Normally started up by /etc/rc.sysinit, it can also be
    started up by a udev program whenever a block device is added or it can be run
    by the initsystems file. | multipath daemon |

    Monitors paths; as paths fail and come back, it may initiate multipath switches.
    For interactive

    changes to multipath. This daemon must be restarted for any changes to the /etc/multipath.conf

    take effect. || kpartx command | Creates device mapper devices for the partitions
    on a device It is

    package, the multipath-tools package depends on it. | depends on it. |


    # Multipath Setup Overview


    multipath includes compiled-in default settings that are suitable for common multipath
    configurations. Setting up multipath is often a simple procedure. The basic procedure
    for configuring your system with multipath is as follows:


    +   - Install the multipath-tools and multipath-tools-boot packages

    - Create an empty config file /etc/multipath.conf

    - Edit the multipath.conf file to modify default values and save the updated file.

    - Start the multipath daemon'
  merge: -1
