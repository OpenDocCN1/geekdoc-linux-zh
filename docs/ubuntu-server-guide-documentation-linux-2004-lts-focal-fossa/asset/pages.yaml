    Enter LDAP Password:

    n:uid=kdc-service,dc=example,dc=com

    ```


    Finally, update the Access Control Lists (ACL). These can be tricky, as it highly
    depends on what you have already defined. By default, the slap package configures
    your database with the following ACLs:


    ```

    olcAccess:{0} to attrs=userPassword by self write by anonymous auth *

    none

    olcAccess:{1} to attrs=shadowLastChange by self write by * read

    olcAccess:{2} to * read

    ```


    We need to insert new rules before the final to * by read, to control access to
    Kerberos related and attributes:


    ```

    $ sudo ldapmodify -Q -Y EXTERNAL -H ldap:/// <<EOF

    dn: olcDatabase={1}mdb,dc=config

    add: olcAccess

    olcAccess:{2} to attrs=krbPrincipalKey

    by anonymous auth

    by.exact="uid=kdc-service,dc=example,dc=com" read

    by.exact="uid=admin-service,dc=example,dc=com" write

    by self

    by * none


    add: olcAccess

    olcAccess:{3} to subtree="cnkrbContainer,dc=example,dc=com"

    by.exact="uid=kdc-service,dc=example,dc=com" read

    by.exact="uid=admin-service,dc=example,dc=com" write

    by self

    by * none

    EOF

    ```


    This will make the existing (2) rule become {4}. With sudo slapcat -b cn=config,
    the output below was reformatted a bit for clarity:


    ```

    olcAccess:{0} to attrs=userPassword

    by self

    by anonymous auth

    by * none

    olcAccess:{1} to attrs=shadowLastChange

    by self

    by * read

    olcAccess:{2} to attrs=krbPrincipalKey by anonymous auth

    by.exact="uid=kdc-service,dc=example,dc=com" read

    by.exact="uid=admin-service,dc=example,dc=com" write

    by self

    by * none

    olcAccess:{3} to subtree="cnkrbContainer,dc=example,dc=com"

    by.exact="uid=kdc-service,dc=example,dc=com" read

    by.exact="uid=admin-service,dc=example,dc=com" write

    by self

    by * none

    olcAccess:{4} to * read

    ```


    That''s it, your LDAP database is now ready to serve as a Kerberos principal database.'
