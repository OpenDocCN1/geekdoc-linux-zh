    # # Using the installer


    The installer is designed to be easy to use and have sensible defaults for a first
    install you can mostly just accept the defaults for the most straightforward install:


    +   - Choose your language

    - Update the installer (if offered)

    - Select your keyboard layout

    - Do not configure networking (the installer attempts to configure wired network
    interfaces via DHCP, but you can continue without networking if this fails)

    - Do not configure a proxy or custom mirror unless you have to in your network

    - For storage, leave “use an entire disk” checked, and choose a disk to install,
    then select “Done” on the configuration screen and confirm the install

    - Enter a username, hostname and password

    - Just select Done on the SSH and snap screens

    - You will now log messages as the install is complete, and log in with the username
    and password provided


    There is more detailed documentation on all these options.


    # # Advanced Installation


    # # Software RAID


    Redundant Array of Independent Disks “RAID” is a method of using multiple disks
    to provide different balances of increasing reliability/increasing input/output
    performance, depending on the RAID level used. RAID is implemented in software
    (where the operating system knows about drives and actively maintains both of
    them) or hardware (where a special controller makes the OS think there’s only
    one drive and maintains the drives “invisibly


    The RAID software included with current versions of Linux (and Ubuntu) is based
    on the ‘mdraid’ driver and works very well, even than many so-called ‘hardware’
    RAID controllers. This section will guide you through installing Ubuntu Server
    Edition 2 using RAID 1 partitions on two physical hard drives, for / and for swap.


    # # RAID Configuration


    Follow the installation steps until you get to the Guided storage configuration
    step, then:


    Select Custom storage layout.


    Create the /boot partition in a local disk. So select one of the devices listed
    in available devices and Add GPT Partition. Next, enter the partition size, then
    choose the Format (ext4) and /boot as mount point. And finally, select Create.


    Now to create the RAID device Create software RAID (md) under AVAILABLE DEVICES.


    Add the name of the RAID disk (the default is md0).


    For this example, select “1 (mirrored)” in RAID level, but if you are using a
    different setup choose the appropriate type (RAID0 RAID1 RAID5 RAID10).


    3'
