  md: 'To generate the keys for the Certificate Signing Request (CSR) run the following
    command from a terminal prompt:

    openssl genrsa -des3 -out server.key 2048


    Generating RSA private key, 2048 bit long modulus

    ................+++++

    e is 65537 (0x10001)


    Enter passphrase for server.key:

    You can now enter your passphrase. For best security, it should contain at least
    eight characters. The minimum length when specifying -des3 is four characters.
    As a best practice it should include numbers and/or punctuation and not be a word
    in a dictionary. Also remember that your passphrase is case-sensitive.


    Re-type the passphrase to verify. Once you have re-typed it correctly, the server
    key is generated and stored in the server.key file.


    Now create the certificate, the one without passphrase, and shuffle the keys:

    openssl rsa -in server.key -out server.key.insecure

    mv server.key server.key.secure

    mv server.key.insecure server.key


    The key is now named server.key, and you can use this file to generate the CSR
    without passphrase.

    To create the CSR, run the following command at a terminal prompt:

    openssl req -new -key server.key -out server.csr


    It will prompt you for the passphrase. If you enter the correct passphrase, it
    will prompt you to enter Company Name, Site Name, Email Id, Once you enter all
    these details, your CSR will be created and will be stored in the server.csr file.


    You can now submit this CSR file to a CA for processing. The CA will use this
    CSR file and issue the certificate. On the other hand, you can create self-signed
    certificate using this CSR.


    # Creating a Self-Signed Certificate


    To create the self-signed certificate, run the following command at a terminal
    prompt:

    openssl x509 -req -days 365 -in server.csr -signkey server.key -out server.crt


    The above command will prompt you to enter the passphrase. Once you enter the
    correct passphrase, your certificate will be created and will be stored in the
    server.crt file.


    > Warning


    If your secure server is to be used in a production environment, you probably
    need a CA-signed certificate. It is not recommended to use self-signed certificate.


    # Installing the Certificate


    You can install the file server.key and certificate file server.crt, or the certificate
    file issued by your CA, by running following commands at a terminal prompt:


    ```

    sudo cp server.crt /etc/ssl/certs

    sudo cp server.key /etc/ssl/private

    ```'
