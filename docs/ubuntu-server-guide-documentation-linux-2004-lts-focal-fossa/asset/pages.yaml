    # Samba - OpenLDAP Backend


    > NOTE


    This section is flagged as legacy because nowadays Samba 4 is best integrated
    with its own

    LDAP server in AD mode. Integrating Samba with LDAP as described here covers the
    NT4

    de, deprecated for many years.


    This section covers the integration of Samba with LDAP. The Samba server''s role
    will be that of a "standalone"

    server and the LDAP directory will provide the authentication layer in addition
    to containing the user, group,

    machine account information that Samba requires to function (in any of 3 possible
    roles).

    The pre-requisite is an OpenLDAP server configured with a directory that can accept
    authentication requests.

    Service - LDAP and Service LDAP with TLS for details on fulfilling this requirement.
    Once those steps

    completed, you will need to decide what you want Samba to do for you and then
    configure

    it accordingly.


    This guide will assume that the LDAP and Samba services are running on the same
    server and therefore

    use SASL EXTERNAL authentication whenever changing something under cn=config.
    If that is not your

    scenario, you will have to run those ldap commands on the LDAP server.


    # Software Installation


    There are two packages needed when integrating Samba with LDAP: samba and smbdap-tools.


    Strictly speaking, the smbdap-tools package isn''t needed, but unless you have
    some other way to manage

    t various Samba entities (users, groups, computers) in an LDAP context then you
    should install it.


    Install these packages now:


    ```

    sudo apt install samba smbdap-tools

    ```'
