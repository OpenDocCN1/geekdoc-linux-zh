  md: "# Note\n\nEvery time either /etc/lvm.conf or /etc/multipath.conf is updated,\
    \ the initrd should be rebuilt to reflect these changes. This is imperative when\
    \ blacklists and filters are necessary to maintain a stable configuration.\n\n\
    # Device Mapper Multipathing - Configuration\n\nDevice Mapper Multipath will be\
    \ referred here as **multipath** only.\n\nMoving on with this session it is recommended\
    \ that you read: 1. Device Mapper Multipathing - Introduction\n\nMultipath is\
    \ generally able to work out-of-the-box with most common storages. This doesn't\
    \ mean the default configuration variables should be used in production: they\
    \ don't important parameters your storage might need.\n\nConsult your storage\
    \ manufacturer's install guide for the Linux Multipath configuration options.\
    \ It is very common that storage vendors provide the most adequate options for\
    \ Linux, including minimal kernel and multipath-tools versions required.\n\nDefault\
    \ configuration values for DM-Multipath can be overridden by editing the /etc/multipath.conf\
    \ file and restarting the multipath service.\n\nThis chapter provides information\
    \ on parsing and modifying the multipath.conf file and it is split into the following\
    \ configuration sections:\n\n+   * Configuration File Overview\n* Configuration\
    \ File Defaults\n* Configuration File Blacklist & Exceptions\n* Configuration\
    \ File Multipath Section\n* Configuration File Devices Section\n\n# Configuration\
    \ File Overview\n\nThe configuration file contains entries of the form:\n\n```\n\
    <section> {\n  <attribute> <value>\n  ...\n  <subsection> {\n    <attribute> <value>\n\
    \  }\n}\n```\n\nThe following keywords are recognized:\n\n+   * **defaults** -\
    \ This section defines default values for attributes which are used whenever no\
    \ values are given in the appropriate device or multipath sections.\n* **blacklist**\
    \ - This section defines which devices should be excluded from the multipath topology\
    \ discovery."
  merge: -1
  pgno: 28
- img_proc: true
  md: "+   * blacklist_exceptions - This section defines which devices should be included\
    \ in the multipath topology discovery, despite being listed in the blacklist section.\n\
    \n+   * multipaths - This section defines the multipath topologies. They are indexed\
    \ by a World Wide Identifier(WWID).Attributes set in this section take precedence\
    \ over all others.\n\n+   * devices - This section defines the device-specific\
    \ settings. Devices are identified by vendor, product, and revision.\n\n+   *\
    \ overrides - This section defines values for attributes that should override\
    \ the device-specific settings for all devices.\n\n#  Configuration File Defaults\n\
    \nCurrently, the multipath configuration file ONLY includes a minor defaults section\
    \ that sets the user_friendly_names parameter to yes:\n\n```\ndefaults {\n   \
    \ user_friendly_names yes\n}\n```\n\nThis overwrites the default value of the\
    \ user_friendly_names parameter.\n\nAll the multipath attributes that can be set\
    \ in the defaults section of the multipath.conf file can be found HERE with an\
    \ explanation of what they mean. The attributes are:\n\n+   * verbosity\n* polling_interval\n\
    * max_polling_interval\n* reassign_maps\n* multipath_dir\n* path_selector\n* path_grouping_policy\n\
    * uid_attrs\n* uid_attribute\n* getuid_callout\n* prio\n* prio_args\n* features\n\
    * path_prefix\n* alias_checker\n* failback\n* rr_min_io\n* rr_min_io_rq\n* max_fds\n\
    * rr_weight\n* no_path_retry\n* queue_without_daemon\n* checker_timeout\n* flush_on_last_del\n\
    * user_friendly_names\n* fast_io_fail_tmo\n* dev_loss_tmo\n* bindings_file\n*\
    \ wwids_file\n* prkeys_file"
