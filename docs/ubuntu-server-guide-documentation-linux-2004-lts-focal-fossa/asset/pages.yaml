  md: '# Consumer Configuration - standard replication


    Install the software by going through Installation. Make sure schemas and the
    database suffix are the same, and enable TLS.


    Create an LDIF file with the following contents and name consumer_simple_sync.ldif:


    ```

    dn: cn=module{0},cn=config

    changetype: modify

    add: olcModuleLoad

    olculeLoad: syncprov


    dn: olcDatabase={1}mdb,cn=config

    changetype: modify

    add: olcDbIndex

    olcDbIndex: entryUUID eq


    add: olcSyncrepl

    olSyncrepl: rid=0

    provider=ldap://ldap01.example.com

    bindmethod=simple

    bindn=cn-replicator,dc=example,dc="com" credentials=<secret>

    searchbase=dc=example,dc="com"

    schemachecking=on

    type=refreshAndPersist retry="60" +

    starttls=critical tls_reqcert=demand

    ```


    add: olcUpdateRef

    olUpdateRef:ldap://ldap01.example.com


    Ensure the following attributes have the correct values:


    +   - provider (Provider server''s hostname - ldap01.example.com in this example
    - or IP address). It must match what is presented in the replicator''s SSL certificate.

    - bindn (the DN for the replicator user)

    - credentials (the password you selected for the replicator user)

    - searchbase (the database suffix you''re using, i.e., content that is to be replicated)

    - olcUpdateRef (Provider server''s hostname or IP address, given to clients if
    they try to write to this consumer)

    - rid ID, a unique 3-digit number that identifies the replicator. Each consumer
    should have at least one rid


    # Note


    Note that a successful encrypted connection via START_TLS is being enforced in
    this configuration, avoid sending the credentials in the clear over the network.
    See LDAP for TLS for details on how to setup OpenLDAP with trusted SSL certificates.


    Add the new configuration:


    ```

    sudo ldapadd -Q -Y EXTERNAL -H ldap:// -f consumer_simple_sync.ldif

    ```


    You''re done. The dc=example,dc=com tree should now be synchronizing.'
