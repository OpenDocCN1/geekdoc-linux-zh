  pgno: 221
- img_proc: true
  md: 'The gitolite-admin contains two subdirectories, "conf" and "keydir". The configuration
    files are in the conf dir, and the keydir directory contains the list of user''s
    public SSH keys.


    # Managing gitolite users and repositories


    Adding a new user to gitolite is simple: just obtain their public key and add
    it to the keydir directory as $DESIRED_USER_NAME.pub. Note that the gitolite usernames
    don''t have to match the system usernames - they are only used in the gitolite
    configuration file to manage access control. Similarly, users are deleted by deleting
    their public key. After any change, do not forget to commit the changes to git,
    and push the changes to the server


    ```

    git commit -a

    git push origin master

    ```


    Repositories are managed by editing the conf/ gitolite.conf file. The syntax is
    space separated, and simply specify the list of repositories by some access rules.
    The following is a default example


    ```

    repo gitolite-admin

    RW+ = admin

    R = alice

    repo project1

    RW+ = alice

    RW = bob

    R = denise

    ```


    # Using your server


    Once a user''s public key has been imported by the gitolite admin and authorization
    granted to the user to one or more repositories, the user can access repositories
    with the following command:


    ```

    git clone git@$SERVER_IP:$PROJECT_NAME.git

    ```


    To add the server as a new remote for an existing git repository:


    ```

    git remote add git@$SERVER_IP:$PROJECT_NAME.git

    ```


    # References


    +   - Gitolite''s code repository provides access to source code.

    - Gitolite''s documentation includes a "fool setup" guide and a cookbook with
    recipes for common tasks.

    - Gitolite''s maintainer has written a book, Gitolite Essentials, for more in-depth
    information about the software.

    - General information about git itself can be found at the Git homepage.


