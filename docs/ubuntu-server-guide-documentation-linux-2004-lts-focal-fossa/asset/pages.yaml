    sudo journalctl -u mysql


    # Configuration


    You can edit the files in /etc/mysql/ to configure the basic settings - log file,
    port number, etc. For example, to configure MySQL to listen for connections from
    network hosts, in the file /etc/mysql/mysql.conf/mysqld.cnf, change the bind-address
    directive to the server''s IP address:


    ```

    bind-address = 192.168.0.5

    ```


    Note


    Replace 192.168.0.5 with the appropriate address, which can be determined via
    ip address show.

    After making a change configuration, the MySQL daemon will need to be restarted:


    ```

    sudo systemctl restart mysql.service

    ```


    # Database Engines


    While the default configuration of MySQL provided by the Ubuntu packages is perfectly
    functional and performs well there are things you might wish to consider before
    proceed


    MySQL is designed to allow data to be stored in different ways. These methods
    are referred to as database engines. There are two main engines you will be interested
    in: InnoDB and MyISAM. Storage engines are transparent to the end user. MySQL
    will handle things differently under the surface, regardless of which storage
    engine you use, you will interact with the database in the same way.


    While is, and may be advantageous to match database engines on a table level,
    doing so reduces the effectiveness of the performance tuning you can do as you''ll
    splitting the resources between two engines instead of dedicating them to one.


    +   - MyISAM is the other of the two. It can be faster than InnoDB under certain
    circumstances and favours a read only workload. Some applications have been tuned
    around MyISAM (that''s not to imply that they will slow under InnoDB). MyISAM
    also supports the FULLTEXT data type, which allows very fast searches of large
    quantities of text data. However MyISAM is only capable of locking an entire table
    for writing. This means only one process can update a table at a time. As any
    application uses the table scales may prove to be a hindrance. It also lacks journaling,
    which makes it harder for data to be recovered after a crash. The following link
    provides some points for consideration about using MyISAM on a production database.'
  merge: -1
  pgno: 130
- img_proc: true
  md: '+   InnoDB is a more modern database engine, designed to be ACID compliant
    which guarantees database transactions are processed reliably. Write locking can
    occur on a row level basis within a table. That means multiple updates can occur
    on a single table simultaneously. Data caching is also handled in memory within
    the database engine, allowing for a more efficient row level basis rather than
    file based. To meet ACID compliance all transactions are journaled independently
    of the main tables. This allows for much more reliable data recovery as data consistency
    can be checked.


    As of MySQL 5.5 InnoDB is the default engine, and is highly recommended over MyISAM
    unless you have specific features unique to the engine.


    # Advanced configuration


    # Creating a tuned configuration


    There are a number of parameters that can be adjusted in MySQL''s configuration
    files that will allow you to improve the performance of the server over time.


    Many of the parameters can be adjusted with the existing database, however some
    may affect the data layout and this need more care to apply.


    First, if you have existing data, you will need to carry out a mysqldump and reload:


    ```

    mysqldump --all-databases --routines -u root -p > /fulldump.sql

    ```


    This will prompt you for the root password before creating a copy of. It is advisable
    to make there are no other users or processes using the database while this takes
    place. Depending on how much data you''ve got in your database, this may take
    a while. You won''t see anything on the screen during this process.


    Once the dump has been completed, shut down MySQL:


    ```

    sudo service mysql stop

    ```


    It''s also a good idea to backup the original configuration:


    ```

    sudo rsync -avz /etc/mysql /root/mysql-backup

    ```


    Next, make any desired configuration changes.


    Then delete and re-initialise the database space and make ownership is correct
    before restarting MySQL:


    ```

    sudo rm -rf /var/lib/mysql/*

    sudo mysql --initialize

    sudo chown -R mysql mysql: /var/lib/mysql

    sudo service mysql start

    ```


    The final step is re-importation of data by piping your SQL commands to the database.


    ```

    cat ~/fulldump.sql | mysql

    ```


    For large imports, the ''Pipe Viewer'' utility can be useful to track import progress.
    Ignore any ETA produced by pv, they are based on the average time to handle each
    row of the file, but the speed of inserting can vary wildly from row to row with
    mysqldumps:


    ```

    sudo apt install pv

    pv ~/fulldump.sql | mysql

    ```


    That is complete all is good to go!'
