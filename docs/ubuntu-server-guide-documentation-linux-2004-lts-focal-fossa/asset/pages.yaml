- img_proc: true
  md: '```

    lxc config set container1 security.nesting true

    ```


    Once this is done, container1 will be able to start sub-containers.


    In order to run unprivileged (the default in LXD) containers nested under an unprivileged
    container, you will need to ensure a wide enough UID mapping. Please see the ''UID
    mapping'' section below.


    # Limits


    LXD supports flexible constraints on the resources which containers can consume.
    The limits come in the following categories:


    +   - CPU: limit cpu available to the container in several ways.

    - Disk: configure the priority of I/O requests under load

    - RAM: configure memory and swap availability

    - Network: configure the network priority under load

    - Processes: limit the number of concurrent processes in the container.


    For a full list of limits known to LXD, see the configuration documentation.


    # UID mappings and Privileged containers


    By default, LXD creates unprivileged containers. This means that root in the container
    is a non-root UID on the host. It is privileged against the resources owned by
    the container, but unprivileged with respect to the host, making root in a container
    roughly equivalent to an unprivileged user on the host. (The main exception is
    the increased attack surface exposed through the system call interface)


    Briefly, in an unprivileged container, 65536 UIDs are ''shifted'' into the container.
    For instance, UID 0 in the container may be 100000 on the host, UID 1 is 100001,
    etc, up to 165535. The starting value for UIDs and GIDs, respectively, is determined
    by the ''root'' entry /etc/subuid and /etc/subgid (See the subid(5) page).


    It is possible to request a container to run without a UID mapping by setting
    the security.privileged flag to true:


    ```

    lxc config set c1 security.privileged true

    ```


    Note however that in this case root user in the container is the root user on
    the host.


    # Apparmor


    LXD confines containers by an apparmor profile which protects containers from
    each other and the host from containers. For instance this will prevent root in
    one container from signaling root in another container, even though they have
    the same mapping. It also prevents writing to dangerous, un-namespaces files such
    as mysctls and /proc/sysrq-trigger.


    If the apparmor policy for a container needs to be modified for a container c1,
    specific apparmor policy lines can be added in the raw.apparmor configuration
    key.'
  merge: -1
  pgno: 116
- img_proc: true
  md: '# Seccomp


    All containers are confined by a default seccomp policy. This policy prevents
    dangerous actions such as forced ummounts, kernel module loading and unloading,
    kexec, and the open_by_handle_at system call. The seccomp configuration cannot
    be modified, however a completely different seccomp policy – or none – can be
    requested using raw.xlc (see below).


    # Raw LXC configuration


    LXD configures containers for the best balance of host safety and container usability.
    Whenever possible it is highly recommended to use the defaults, or use the LXD
    configuration keys to request LXD to modify as needed. Sometimes, however, it
    may be necessary to talk to the underlying LXC driver itself. This can be done
    by specifying LXC configuration items in the ''raw.xlc'' LXD configuration key.
    These must be valid as documented in the lxc.container(5) manual page.


    # Snapshots


    Containers can be renamed and live-migrated using the lxc move command:


    ```

    lxc move cl final-beta

    ```


    They can also be snapotted:


    ```

    lxc snapshot cl YYYY-MM-DD

    ```


    Later changes to cl can be reverted by restoring the snapshot:


    ```

    lxc restore cl YYYY-MM-DD

    ```


    New containers can also be created by copying a container or snapshot:


    ```

    lxc copy ul YYYY-MM-DD testcontainer

    ```


    # Publishing images


    When a container or container snapshot is ready for consumption by others, it
    can be published as a new image:


    ```

    lxc publish ul/YYYY-MM-DD alias foo-2.0

    ```


    The published image is private by default, meaning that LXD will not allow clients
    without a trusted certificate to see them. If the image is safe for public viewing
    (i.e. contains no private information), then the ''public'' flag can be set, either
    at publish time using


    ```

    lxc publish ul/YYYY-MM-DD alias foo-2.0 public=true

    ```


    or after using the fact


    ```

    lxc image edit foo-2.0

    ```


    and changing the value of the public field.'
