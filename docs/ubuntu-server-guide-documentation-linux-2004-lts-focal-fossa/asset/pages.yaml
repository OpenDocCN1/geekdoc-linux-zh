    # SSH


    ssh|690x517


    A default Ubuntu has no open ports. It is very common to administer servers via
    SSH so the installer allows it to be installed with the click of a button.


    You can import keys for the default user from Github or Launchpad.


    If you import a key, then password authentication is disabled by default but it
    can be re-enabled again if you wish.'
