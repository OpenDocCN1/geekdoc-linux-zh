    # JSON Schema for autoinstall config


    # Introduction


    The server installer validates the provided autoinstall config against a JSON
    Schema.


    # How the config is validated


    Although the schema is presented below as a single document, and if you want to
    pre-validate your config you should validate it against this document, the config
    is not actually validated against this document at runtime. What happens instead
    is some sections are loaded, validated and applied first, before all other sections
    are validated. In detail:


    +   1. The reporting section is loaded, validated and applied.

    2. The error commands are loaded and validated.

    3. The early commands are loaded and validated.

    4. The early commands, if any, are run.

    5. The config is reloaded, and all sections are loaded and validated.


    This is so that validation errors in most sections can be reported via the reporting
    and error-commands configuration, as all other errors are.


    # Schema


    The JSON schema for autoinstall data is as follows:


    # Regeneration


    The schema above can be regenerated by running “make schema” in a subiquity source
    checkout.


    # Automated Server Installs Config File Reference


    # Overall format


    The autoinstall file is YAML. At top level it must be a mapping containing the
    keys described in this document. Unrecognized keys are ignored.


    # Schema


    Autoinstall configs are validated against a JSON schema before they are used.


    # Command lists'
