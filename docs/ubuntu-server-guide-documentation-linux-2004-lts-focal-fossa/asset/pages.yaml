- img_proc: true
  md: 'There is a configuration parameter that can be set to protect the workstation
    from this attack. It will have SSSD authenticate the KDC, block the login if the
    KDC cannot be verified. This option is called krb5_validate, and it is by default.


    To enable it, edit /etc/sssd/sssd.conf and add this line to the domain section:


    ```

    sssd

    config_file_version = 2

    domains = example.com

    ```


    ```

    [domain/example.com]

    id_provider = ldap

    ```


    ```

    krb5_validate = True

    ```


    The second step is to create a host principal on the KDC for this workstation.
    This is how the KDC''s authenticity is verified. It''s like a "machine account",
    with a shared secret that the attacker cannot control and replicate in his rogue
    KDC. The host principal has the host/<fqdn>@REALM.


    After the host principal is created, its keytab needs to be stored on the workstation.
    This two step process can be easily done on the itself kadmin (not kadmin.local)
    to contact the KDC remotely:


    ```

    $ sudo kadmin -p ubuntu/admin

    kadmin: addprincipal -randkey host/ldap/krb-client.example.com@EXAMPLE.COM

    WARNING: no policy specified for host/ldap/krb-client.example.comEXAMPLE.COM,

    Principal "host/ldap/krb-client.example.com@EXAMPLE.COM" created.

    ```


    ```

    kadmin: ktadd -e /etc/krb5.keytab host/ldap/krb-client.example.com

    Entry principal for host/ldap/krb-client.example.com with knvo 6, encryption

    type aes256-hmac-sha1-6 added to keytab FILE:/etc/krb5.keytab.

    Entry principal for host/ldap/krb-client.example.com with knvo 6, encryption

    type aes128-hmac-sha1-6 added to keytab FILE:/etc/krb5.keytab.

    ```


    ```

    Then exit the tool and set the permissions on the keytab file are:

    sudo chmod 600 /etc/krb5.keytab

    sudo chown root:root /etc/krb5.keytab

    ```


    You can also do the KDC itself using kadmin.local, but you will have to store
    the keytab temporarily in another file and securely copy it over to the workstation.


    Once these steps are complete, you can restart sssd on the workstation and perform
    the login. If the rogue KDC picks the attempt up replies, it will fail the host
    verification. By debugging we can see what is happening on the workstation:


    > ==>/var/log/sssd/krb5_child.log<

    (Mon Apr 20 19:43:58 2020) [sssd[krb5_child[2102]]] [validate_tgt] (0x0020):

    TGT failed verification using key for host/ldap/krb-client.example.com.

    example:EXAMPLE.COM]

    (Mon Apr 20 19:43:58 2020) [sssd[krb5_child[2102]]] [get_and_save_tgt] (0x0020):1741:
    [-1765328377][Server host/ldap/krb-client.example.com.

    com@EXAMPLE.COM not found in Kerberos database


    And the login is denied. If the real KDC picks it up, the host verification succeeds:


    > ==>/var/log/sssd/krb5_child.log <='
