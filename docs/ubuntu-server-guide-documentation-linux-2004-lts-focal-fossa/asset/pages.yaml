  md: '# networkd-dispatcher for pre-up, post-up, etc. hook scripts


    Users of the former ifupdown may be familiar with using hook scripts (e.g pre-up,
    post-up, etc.) in their interfaces file. Netplan configuration does not currently
    support hook scripts in its configuration definition.


    Instead to achieve this functionality with the networkd renderer, users can use
    networkd-dispatcher. The package provides users and package hooks when specific
    network states are reached to act in reacting to network state.


    Note: If not on Ubuntu Server, Desktop the network is driven by Network Manager
    - in that case you''d need NM Dispatcher scripts installed.


    The Netplan FAQ has a great table that compares event timings between ifupdown/systemd-networkd/network-manager


    It is important to note that those hooks run asynchronous; that they will not
    block transition into another state.


    The Netplan FAQ also has an example on converting an old ifupdown hook to networkd-dispatcher.


    # Resources


    +   - The Ubuntu Wiki Network page has links to articles covering more advanced
    network configuration.

    - The netplan website has additional examples and documentation.

    - The netplan man page has more information on netplan.

    - The systemd-resolve man page has details on systemd-resolve command.

    - The systemd-resolved man page has more information on systemd-resolved.

    - For more information on bridging see the netplan.io examples page and the Linux
    Foundation''s Networking-Bridge page.


    # Dynamic Host Configuration Protocol (DHCP)


    The Dynamic Host Configuration Protocol (DHCP) is a network service that enables
    host computers to be automatically assigned settings from a server as opposed
    to manually configuring each network host. Computers configured to be DHCP clients
    have no control over the settings they receive from the DHCP server, and the configuration
    is transparent to the computer''s user.


    The most common settings provided by a DHCP server to DHCP clients include:


    +   - IP address and netmask

    - IP address of the default-gateway to use

    - IP addresses of the DNS servers to use


    However, a DHCP server can also supply configuration properties such as:


    +   - Host Name

    - Domain Name

    - Time Server

    - Print Server'
