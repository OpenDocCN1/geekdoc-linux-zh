    \ it is grubnetexamd64.signed.\n* initrd extracted from your Ubuntu live server\
    \ image (hwe--initrd instead if you want to boot with HWE kernel)\n* vmlinuz extracted\
    \ from your Ubuntu live server image (hwe--vmlinuz instead if you want to boot\
    \ with HWE kernel)\n\n# Examples\n\nIn the following sections, we will take amd64\
    \ image as an example. This means the following files are used:\n\n+   * Ubuntu\
