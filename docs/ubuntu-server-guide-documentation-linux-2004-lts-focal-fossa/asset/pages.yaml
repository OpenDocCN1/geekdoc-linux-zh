    # Troubleshooting with the multipath interactive console


    The multipath-k command is an interactive interface to the multipath daemon. Entering
    this command brings up an interactive multipath console. After entering this command,
    you can enter help to get a list of available commands, you can enter an interactive
    command, or you enter CTRL-D to quit.


    The multipath interactive console can be used to troubleshoot problems you may
    be having with your system. For example, the following command displays the multipath
    configuration, including the defaults, before exiting the console:


    ```

    $ sudo multipath -k > show config > CTRL-D

    ```


    The following command ensures that multipath has picked up any changes to the
    multipath.conf,


    ```

