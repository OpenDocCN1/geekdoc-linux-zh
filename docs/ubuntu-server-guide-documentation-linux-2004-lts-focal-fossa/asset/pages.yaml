  md: '# Anonymous FTP Configuration


    By default vsftpd is not configured to allow anonymous download. If you wish to
    enable anonymous download edit /etc/vsftpd.conf by changing:


    anonymous_enable=YES


    During installation a ftp user is created with a home directory of /srv/ftp. This
    is the default FTP directory.


    If you wish to change this location, to /srv/files/ftp for example, simply create
    a directory in another location and change the ftp user''s home directory:


    ```

    sudo mkdir -p /srv/files/ftp

    sudo usermod -d /srv/files/ftp ftp

    ```


    After making the change restart vsftpd:


    ```

    sudo systemctl restart vsftpd.service

    ```


    Finally, copy any files and directories you would like to make available through
    anonymous FTP to /srv/files/ftp, or /srv/ftp if you wish to use the default.


    # User Authenticated FTP Configuration


    By default vsftpd is configured to authenticate users and allow them to download
    files. If you wish users to be able to upload files, edit /etc/vsftpd.conf:


    ```

    write_enable=YES

    ```


    Now restart vsftpd:


    ```

    sudo systemctl restart vsftpd.service

    ```


    When system users login to vsftpd they will start in their home directories where
    they can download, upload, create directories, etc.


    Similarly, by default, anonymous users are not allowed to upload files to FTP
    server. To change this setting, you should uncomment the following line, and restart
    vsftpd:


    ```

    anon_upload_enable=YES

    ```


    # Warning


    Enabling anonymous FTP upload can be an extreme security risk. It is best to not
    enable anonymous upload on servers accessed directly from the Internet.


    The configuration file consists of many configuration parameters. The information
    about each parameter is available in the configuration file. Alternatively, you
    can refer to the man page, man 5 vsftpd.conf for details of each parameter.


    # Securing FTP


    There are options in /etc/vsftpd.conf to help make vsftpd more secure. For example
    users can be limited to their home directories by uncommenting:


    ```

    chroot_local_user=YES

    ```


    You can also limit a specific list of users to just their home directories:'
