  md: '# Utool packages


    The following packages and their dependencies will be required in order to use
    uvtool:


    +   - uvtool

    - uvtool-libvirt


    To install uvtool, run:


    ```

    $ sudo apt -y install uvtool

    ```


    This will install uvtool''s main commands:


    +   - uvt-simplestream-libvirt

    - uvt-kvm


    # Get the Ubuntu Cloud Image with uvtool-simplestream-libvirt


    This is one of the major simplifications that uvtool brings. It is aware of where
    to find the cloud images only one command is required to get a new cloud image.
    For instance, if you want to synchronize all cloud images for the amd64 architecture,
    the uvtool command would be:


    ```

    $ uvtool-simplestream-libvirt --base sync arch=amd64

    ```


    After an amount of time required to download all the images from the Internet,
    you will have a complete set of cloud images stored locally. To see what has been
    downloaded use the following command:


    ```

    $ uvtool-simplestream-libvirt query

    release=bionic arch=amd64 label=daily (20191107)

    release=focal arch=amd64 label=daily (20191029)

    ...

    ```


    In the case you want to synchronize only one specific cloud-image, you will need
    to use the release= and arch filters to identify which images need to be synchronized.


    ```

    $ uvtool-simplestream-libvirt sync release=DISTRO-SHORT-CODENAME arch=amd64

    ```


    Furthermore you can provide an alternative URL to fetch images. A common case
    are the daily images which helps to get the very latest images or if you want
    to access the next to your very released image of Ubuntu.


    ```

    $ uvtool-simplestream-libvirt sync --source http://cloud-images.ubuntu.com/daily

    [... options]

    ```


