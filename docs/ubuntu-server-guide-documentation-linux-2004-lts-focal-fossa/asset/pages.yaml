  md: 'This section covers configuring a primary and secondary kerberos server to
    use OpenLDAP for the principal database. Note that as of version I.18, the KDC
    from MIT Kerberos does not support a primary KDC using a read-only (secondary)
    server. What we have to consider is that a Primary KDC is read-write, and it needs
    a read-write backend. The Secondaries can use both read-write and read-only depend,
    because they are expected to be read-only. There are some possible layouts we
    can use:


    +   - Simple case: Primary KDC connected to primary OpenLDAP, Secondary KDC connected
    to both Primary and Secondary OpenLDAP

    - Extended case: Multiple KDCs connected to one primary OpenLDAP, and multiple
    Secondary KDCs connected to Primary and Secondary OpenLDAP

    - OpenLDAP with multi-master replication: multiple KDCs connected to all primary
    OpenLDAP servers


    We''ve covered OpenLDAP multi-master replication in this guide, so we will show
    the first case only. The second scenario is an extension: just add another primary
    KDC to the mix, talking to the primary OpenLDAP server.


    #  Configuring OpenLDAP


    We are going to install the OpenLDAP server on the same host as the KDC, to simplify
    the communication between them. In a setup, we will use the ldap:// transport,
    which is via a unix socket, and not need to setup SSL certificates to ensure the
    communication between the Kerberos services and OpenLDAP. However, note that SSL
    is still needed for the OpenLDAP replication. See LDAP with TLS for details.


    If you want to use an OpenLDAP server elsewhere, that is also possible, but keep
    in mind that you should use SSL for the communication between the KDC and OpenLDAP
    server.


    First, the necessary schema needs to be loaded on an OpenLDAP server that has
    network connectivity to the Primary and Secondary KDCs. The rest of this section
    assumes that you also have LDAP replication configured between at least two KDCs.
    For information on setting up OpenLDAP Server.


    # Note


    admin,dc=example,com is a default user that is created during the installation
    of the slapd package (the OpenLDAP server). The domain component will change for
    your server, so adjust accordingly.


    +   - Install the necessary packages (it''s assumed that OpenLDAP is already installed):

    sudo apt install krb5-kdc-ldap kb5-admin-server

    - Next, extract the kerberos.schema.gz:

    sudo cp /usr/share/doc/krb5-kdc-ldap/kerberos.schema.gz /etc/ldap/schema/

    sudo unzip /etc/ldap/schema/kerberos.schema.gz

    - The kerberos schema needs to be added to the cn-config tree. This schema file
    needs to be converted to LDIF format before it can be added. For that we will
    use a helper tool, called schema2ldif, provided by the package of the same name
    which is available in the Universe:

    sudo apt install schema2ldif


    +   - To import the kerberos schema, run:

    $ sudo kerberos-manager -i kerberos.schema

