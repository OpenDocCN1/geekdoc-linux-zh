    \n+   - IncludesNOEXEC - Allow server-side includes, but disables the #cxec and\
    \ #include commands in CGI scripts.\n\n+   - Indexes - Display a listed of the\
    \ directory's contents, if no DirectoryIndex (such as index.html) exists in the\
    \ requested directory.\n\n# Caution\n\nFor security reasons, this usually not\
    \ be set, and certainly should not be set on your DocumentRoot. Enable this option\
    \ carefully on a per-directory basis only if you are certain you want to see the\
    \ entire contents of the directory.\n\n+   - Multiview - Support content-negotiated\
    \ multiviews; this option is disabled by default for security reasons. See the\
    \ Apache 2 documentation on this option.\n\n+   - SymLinksOwnerMatch - Only symbolic\
    \ links if the target file or directory has the same owner as the link."
