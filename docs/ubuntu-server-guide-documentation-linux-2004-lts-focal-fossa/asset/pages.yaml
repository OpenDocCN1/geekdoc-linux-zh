    # SMTP Authentication


    SMTP-AUTH allows a client to identify itself through the SASL authentication mechanism,
    using Transport Layer Security (TLS) to encrypt the authentication process. Once
    authenticated the SMTP server will allow the client to relay mail.


    To configure Postfix for SMTP-AUTH using SASL (Dovecot SASL), run these commands
    at a terminal prompt:


    ```

    sudo postfix -e ''smtpd_sasl_type = dovecot''

    sudo postfix -e ''smtpd_sasl_path = private/auth''

    sudo postfix -e ''smtpd_sasl_local_domain = ''

    sudo postfix -e ''smtpd_sasl_security_options = anonymous, noplainext ''

    sudo postfix -e ''smtpd_sasl_tls_security_options = anonymous''

    sudo postfix -e ''broken_sasl_auth_clients = yes''

    sudo postfix -e ''smtpd_sasl_auth_enable = yes''

    sudo postfix -e ''smtpd_recipient_restrictions = /\npermit_authenticated,mynetworks,reject_unauth_destination''

    ```


    # Note


    The smtpd_sasl_path parameter is a path relative to the Postfix queue directory.


    There are several SASL mechanisms worth evaluating to improve the security of
    your deployment. The options "anonymous,noplainext" prevent use of mechanisms
    that permit anonymous authentication or transmit credentials encrypted.


    Next, generate or obtain a digital certificate for TLS. See security in this guide
    for details about generating certificates and setting up your own Certificate
    Authority (CA).


    # Note


    MUAs connecting to your mail server via TLS will need to recognize the certificate
    used for TLS. This can either be done using a certificate from Let''s Encrypt,
    from a commercial CA or with a self-signed certificate that users manually install/accept.
    For MTA to MTA TLS certificates are never validated without agreement from the
    configured policy. For MTA to TLS, unless local policy requires it, there is no
    reason not to use a self-signed certificate. Refer to security - certificates
    in this guide for more details.


    Once you have a certificate, configure Postfix to provide TLS encryption for both
    incoming and outgoing mail:


    ```

    sudo postfix -e ''smtpd_tls_security_level = may''

    sudo postfix -e ''smtpd_tls_security_level = may''

    sudo postfix -e ''smtpd_tls_note_starttls = yes''

    sudo postfix -e ''smtpd_tls_key_file = /etc/ssl/private/server.key''

    sudo postfix -e ''smtpd_tls_cert_file = /etc/ssl/certs/server.crt''

    sudo postfix -e ''smtpd_tls_logfile =''

    sudo postfix -e ''smtpd_tls_received_header = yes''

    sudo postfix -e ''myhostname = mail.example.com''

    ```


    If you are using your own Certificate Authority to sign the certificate enter:


    ```

    sudo postfix -e ''smtpd_tls_CAfile = /etc/ssl/certs/cacert.pem''

    ```'
