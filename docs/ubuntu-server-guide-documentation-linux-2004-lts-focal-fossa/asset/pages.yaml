  md: "# Name Service Switch Configuration\n\nThe order in which your system selects\
    \ a hostname to IP addresses is controlled by the Name Service Switch (NSS) configuration\
    \ file /etc/nsswitch.conf. As mentioned in the previous section, typically static\
    \ hostnames defined in the systems /etc/hosts file precedence over names resolved\
    \ from DNS. The following is an example of the line responsible for this hostname\
    \ lookups in the file /etc/nsswitch.conf.\n\nhosts: files mdns4_minimal [NOTFOUND=return]\
    \ dns mdns4\n\n+   - files tries to resolve static hostnames located in /etc/hosts.\n\
    - mdns4_minimal attempts to resolve the name using Multicast DNS.\n- [NOTFOUND=return]\
    \ means any response of notfound by the preceding mdns4_minimal is treated as\
    \ authoritative and that the system should not try to continue hunting for an\
    \ answer.\n- dns represents a legacy unicast DNS query.\n- mdns4 represents a\
    \ Multicast DNS query.\n\nTo modify the order of the above mentioned name resolution\
    \ methods, you can simply change the hosts: string to value of your choosing.\
    \ For example, if you prefer to use Unicast DNS versus Multicast DNS, you can\
    \ change the string in /etc/nsswitch.conf as shown below.\n\nhosts: dns [NOTFOUND=return]\
    \ mdns4_minimal mdns4\n\n# Bridging\n\nBridging multiple interfaces is an advanced\
    \ configuration, but is very useful in multiple scenarios. One scenario is setting\
    \ up a bridge with multiple network interfaces, using a firewall to filter traffic\
    \ between two network segments. Another scenario is using bridge on a system with\
    \ one interface to allow machines direct access to the outside network. The following\
    \ example covers the latter scenario.\n\nConfigure the bridge by editing your\
    \ netplan configuration found in /etc/netplan/\n\n```\nnetwork:\n  version: 2\n\
    \  renderer: networkd\n  ethernets:\n    enp3s:\n      dhcp4: no\n  bridges:\n\
    \    br0:\n      dhcp4: yes\n      interfaces:\n        enp3s0\n```\n\n# Note\n\
    \nEnter the appropriate values for your physical interface and network.\n\nNow\
    \ apply the configuration to enable the bridge:\n\nsudo netplan apply\n\nThe new\
    \ bridge interface should now be up and running. The brctl provides useful information\
    \ about the state of the bridge, controls which interfaces are part of the bridge,\
    \ etc. See man brctl for more information."
