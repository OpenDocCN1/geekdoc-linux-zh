- img_proc: true
  md: '# Image export and import


    Image can be exported as, and imported from, tarballs:


    ```

    lxc image export foo -2.0 foo -2.0.tar.gz

    lxc image import foo -2.0.tar.gz --alias foo -2.0 --public

    ```


    # Troubleshooting


    To view debug information about LXD itself, on a systemd based host


    ```

    journalctl -u lxd

    ```


    Container logfiles for container c1 may be seen using:


    ```

    lxc info c1 --show-log

    ```


    The configuration file which was used may be found under /var/log/lxd/c1/c1.lxc.conf
    while apparmor profiles can be found in /var/lib/lxd/security/profiles/c1 and
    seccomp profiles in /var/lib/lxd/security/seccomp/c1.


    # LXC


    Containers are a lightweight virtualization technology. They are more than an
    enhanced chroot to full virtualization like Qemu or VMware, both they do not emulate
    hardware and because containers share the same operating system as the host. Containers
    are similar to Solaris zones or BSD jails. Linux-server and OpenVZ are two pre-existing,
    independently developed implementations of containers-functionality for Linux.
    In fact, containers can come as a result of the work to upstream the vserver and
    OpenVZ functionality.


    There are two user-space implementations of containers, each exploiting the kernel
    features. Libvirt allows the use of containers through the LXD driver by connecting
    to lxc://. This can be very convenient as it supports the same usage as the other.
    The other implementation, called simply ''LXC'', is not compatible with libvirt,
    but is more flexible with multiple users tools. It is possible to switch between
    the two, there are peculiarities which can cause confusion.


    In this document we will mainly describe the LXC package. Use of libvirt-lxc is
    not generally recommended due to a lack of Apparmor protection for libvirt-lxc
    containers.


    In this document, a container name will be shown as CN, C1, or C2.


    # Installation


    The LXc package can be installed using


    ```

    sudo apt install lxc

    ```


    This will pull in the required and recommended dependencies, as well as set up
    a network bridge for containers to use. If you wish to use unprivileged containers,
    you will need to ensure that users have sufficient allocated subids and subgids,
    and will likely want to allow users to connect containers to a bridge (see Basic
    unprivileged usage below).'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# Basic usage


    LXC can be used in two distinct ways - privileged by running the lxc commands
    as the root user; or unprivileged, running the lxc commands as a non-root user.
    (The starting of unprivileged containers by the root user is possible, but not
    described here.) Unprivileged containers are more limited, for instance unable
    to create device nodes or mount block-backed filesystems. However they are less
    dangerous to the host, as the root UID in the container is mapped to a non-root
    UID on the host.


    # Basic privileged usage


    To create a privileged container, you can do so:


    ```

    sudo lxc-create --template download --name ul

    ```


    or, abbreviated


    ```

    sudo lxc-create -t download -n ul

    ```


    This will interactively ask for a container filesystem type to download - in particular
    the distribution, release, and architecture. To create the container non-interactively,
    you can specify these values on the command line:


    ```

    sudo lxc-create -t download -n ul --dist ubuntu --release DISTRO-SHORT-CODENAME
    --arch amd64

    ```


    or


    ```

    sudo lxc-create -t download -n ul -d ubuntu -r DISTRO-SHORT-CODENAME -a amd64

    ```


    You can use lxc-ls to list containers, lxc-info to obtain detailed information,
    lxc-start to start and lxc-stop to stop the container. lxc-attach and lxc-console
    you to enter a container, if ssh is not an option. lxc-destroy removes the container,
    including its roots. See the manual pages for more information on each command.
    An example session might look like:


    ```

    sudo lxc-ls --fancy

    sudo lxc-start --name ul

    sudo lxc-info --name ul

    sudo lxc-stop --name ul

    sudo lxc-destroy --name ul

    ```


    # User namespaces


    Unprivileged containers allow users to create and administer containers without
    having any root privilege. The feature underpinning this is user namespaces, with
    privileged tasks in a namespace being able to map its ids into child namespaces.
    By default every task on the host runs in initial user namespace, where the full
    range of ids is mapped onto the full range. This can be seen looking at /proc/self/uid_map
    and /proc/self/gid_map, which will show 0 0 4294967295 when read from the initial
    user namespace. As of Ubuntu 14.04, when new users are created by default offered
    a range of UIDs. The set of assigned ids can be seen in the files /etc/subuid
    and /etc/subgid started at id 100000 to avoid conflict with system users.


    If a user was created on an early release, it can be granted a range of ids using
    usermod, as follows:


    ```

    sudo usermod -v 100000-200000 -w 100000-200000 user

    ```'
  merge: -1
  pgno: 119
- img_proc: true
  md: 'The programs newuidmap and newgidmap are setuid-root programs in the uidmap
    package, which are used internally by lxc to map subids and subgids from the host
    into the unprivileged container. They ensure the user only uses ids which are
    authorized by the host configuration.


    # Basic unprivileged usage


    To create unprivileged containers, a few first steps are needed. You will need
    to create a default container configuration file, specify your desired mappings
    and network setup, as well as configure the host to allow the unprivileged user
    to hook into the network. The example assumes that your mapped user and group
    id ranges are 100000-65536. Check your actual user and group id and modify the
    example accordingly.


    ```

    grep USER /etc/subuid

    grep USER /etc/subgid


    mkdir -p ~/.config/lxc

    echo "lxc.id_map = u 0 100000 65536" >> ~/.config/lxc/default.conf

    echo "lxc.id_map = g 0 100000 65536" >> ~/.config/lxc/default.conf

    echo "lxc.network.type = veth >> lxc.network.link = veth0" >> ~/.config/lxc/default.conf

    echo "$USER veth2 " | sudo tee -a /etc/lxc-usernet

    ```


    After this, you can create unprivileged containers the same as privileged ones,
    simply without using sudo.


    ```

    lxc-create -t download -n ul -d ubuntu -r DISTRO-SHORT-CODENAME -a amd64

    lxc-start -n ul -d

    lxc-attach -n ul

    lxc-stop -n ul

    lxc-destroy -n ul

    ```


    # Nesting


    In order to run containers inside containers - referred to as nested containers
    - two lines must be present in the parent container configuration file:


    ```

    lxc.mount.auto = cgroup

    lxc.aa_profile = lxc-default-with-nesting

    ```


    The first case allows the cgroup manager to be bound to the container, so that
    lxc inside the container is able to manage cgroups for its nested containers.
    The second case causes the container to run in a looser Apparmor policy which
    allows the container to do the mounting required for starting containers. Note
    that this policy, when used with a privileged container, is much less safe than
    the regular policy or an unprivileged container. See the Apparmor section for
    more information.


    # Global configuration


    The following configuration files are created by LXC. For privileged use, they
    are found under /etc/lxc, while for unprivileged they are under ~/.config/lxc.


    +   - lxc.conf may optionally specify alternate values for several lxc settings,
    including the lxcpath, the default configuration, cgroups to, a cgroup creation
    pattern, and storage backend settings for lvm and zfs.'
  merge: -1
  pgno: 120
- img_proc: true
  md: '+   - default.conf specifies configuration which every newly created container
    should contain. This usually contains at least a network section, and, for privileged
    users, an id mapping section

    - lxc-user.conf specifies unprivileged users may connect their containers to the
    host-owned network.


    lxc.conf and default.conf are both under /etc/lxc and $HOME/.lxc, while lxc-user.conf
    is only hostwide.


    By default, containers are located under /var/lib/lxc for the root user.


    # Networking


    By default LXC creates a private network namespace for each container, which includes
    a layer 2 networking stack. Containers usually connect to the outside world by
    either having a physical NIC or a v tunnel endpoint passed to the container. LXC
    creates a NAT bridge, lxc0, at startup. Containers created using the default configuration
    will have one NIC with the endpoint plugged into the lxc0 bridge. A NIC can only
    exist in one namespace at a time, so a physical NIC passed to the container is
    unusable on the host.


    It is possible to create a container without a private network namespace. In this
    case, the container will have access to the host networking like any other application.
    Note that this is particularly dangerous if the container is running a distribution
    with upstart, like Ubuntu, since programs which talk to it, like shutdown, will
    take the Abstract Unix socket to the host and shut down the host.


    To give containers lxc0 a persistent ip address from domain name, you can write
    entries to /etc/dnsmasq.conf like:

    dhcp-host=lxcmail,10.0.3.100

    dhcp-host=ttrs,10.0.3.101


    If it is desirable for the container to be publicly accessible, there are a few
    ways to go about it. One is to use iptables to forward host ports to the container,
    for instance


    ```

    iptables -t nat -A PREROUTING -p tcp -i eth0 --dport 587 -j DNAT \

    --to-destination 10.0.3.1:587

    ```


    Then, specify the host''s bridge in the container configuration file in place
    of lxc0, for instance

    lxc.network.type = veth

    lxc.network.link = br0


    Finally, you can ask LXC to use macvlan for the container NIC. Note that this
    has limitations and depending on configuration may not allow the container to
    talk to the host itself. The other two options are preferred and more commonly
    used.


    There are several ways to determine the ip address for a container. First, you
    can use lxc-ls --fancy which will print the ip addresses for all running containers,
    or lxc-info -i -H -n C1 will print C1''s address. If dnsmasq is installed on the
    host, you can also add an entry to /etc/dnsmasq.conf as follows

    server=/lxc/10.0.3.1


    after dnsmasq will resolve C1.lxc locally, so that you can:

    ping C1

    ssh C1


    For more information, check the lxc.conf(5) manual as well as the example network
    configurations under /usr/share/doc/lxc/examples/'
