    # Secondary KDC


    Once you have one Key Distribution Center (KDC) on your network, it is good practice
    to have a Secondary KDC in case the primary becomes unavailable. Also, if you
    have Kerberos clients are in different networks (possibly separated by routers
    using NAT), it is wise to place a secondary KDC in each of those networks.


    # Note


    The native replication mechanism explained here relies on a cronjob, and essentially
    dumps the DB on the primary and loads it up the secondary. You may want to take
    a look at the kldap backend which can use the Openldap replication mechanism.
    It is explained further below.


    First, install the packages, and when asked for the Kerberos and Admin server
    names enter the name of the Primary KDC:


    ```

    sudo apt install kerb5-kdc kerb5-admin-server

    ```


    Once you have installed the packages, create the host principals for all KDCs.
    From a terminal prompt, enter:


    ```

    kadmin -q "addprincipal -randkey host/kdc01.example.com"

    kadmin -q "addprincipal -randkey host/kdc02.example.com"

    ```


    # Note


    The kadmin command defaults to a principal like username/admin@EXAMPLE.COM, where
    username is your current shell user. To override that, use -p <principal>-you-want


    Make sure the principal you are using has the extra-keys privilege in kdc01''s
    /etc/krb5kdc/kadm5. Something like this:


    ```

    ubuntu/admin@EXAMPLE.COM *e

    ```


    Where "*" means all privileges (except extract-keys), and e means exactly extract-keys.


