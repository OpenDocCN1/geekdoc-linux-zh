  md: '# Postfix


    Postfix is the default Mail Transfer Agent (MTA) in Ubuntu. It attempts to be
    fast and secure, with

    flexibility in administration. It is compatible with the MTA sendmail. This section
    will explain installation,

    including how to configure SMTP for secure communications.


    # Note


    This guide does not cover setting up Postfix Virtual Domains, for information
    on Virtual Domains

    and other advanced configurations see References.


    # Installation


    To install Postfix run the following command:


    ```

    sudo apt install postfix

    ```


    For now, it is ok to simply accept defaults by pressing return for each question.
    Some of the configuration

    options will be investigated in greater detail in the next stage.


    **Deprecation warning:** please note that the mail-delivery metapackage has been
    dep-

    recated in Focal. The package still exists for compatibility reasons, but won''t
    set up a

    mail system.


    # Basic Configuration


    There are four things you should decide before starting configuration: The <Domain>
    for which you''ll

    accept email (we will use mail.example.com in our example) - The network and class
    range of your mail server

    (we will use 192.168.0.0/24) - The username (we''re using steve) - Type of mailbox
    format (mbox is default,

    we will use the alternative, Maildir)


    To configure postfix, run the following command:


    ```

    sudo dpkg-reconfigure postfix

    ```


    The user interface will be displayed. On each screen, select the following values:


