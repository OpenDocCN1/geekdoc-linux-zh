  md: "Additionally, there are some terms once explained will hopefully make understanding\
    \ Nagios configuration-easier:\n\n+   * *Host*: a server, workstation, network\
    \ device, etc that is being monitored.\n* *Host Group*: a group of similar hosts.\
    \ For example, you could group all web servers, file server, etc.\n* *Service*:\
    \ the service monitored on the host. Such as HTTP, DNS, NFS, etc.\n* *Service\
    \ Group*: allows you to group multiple services together. This is useful for grouping\
    \ multiple HTTP for example.\n* *Contact*: person to be notified when an event\
    \ takes place. Nagios can be configured to send emails, SMS messages, etc.\n*\
    \ *Terminal*: a terminal end that will ping the gateway.\n\nBy default Nagios\
    \ is configured to check HTTP, disk space, SSH, current users, processes, and\
    \ load on the localhost. Nagios will also ping the gateway.\n\nLarge Nagios installations\
    \ can be complex to configure. It is usually best to start small, one or two hosts,\
    \ gets configured the way you like then expand.\n\n# Configuration\n\n+   * First,\
    \ create a host configuration file for server02. Unless otherwise specified, run\
    \ all commands on server01. In a terminal enter:\n\nsudo cp /etc/nagios3/conf.d/localhost_nagios2.cfg\
    \ \\ /etc/nagios3/conf.d/server02.cfg\n\n# Note\n\nIn the above and following\
    \ example commands, replace \"server01\", \"server02\" 172.18.100.100, and 172.18.100.101\
    \ with the host names and IP addresses of your servers.\n\nNext, edit /etc/nagios3/conf.d/server02.cfg:\n\
