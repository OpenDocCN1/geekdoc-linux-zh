- img_proc: true
  md: '# Types of Certificates


    To set up a secure server using public-key cryptography, in most cases, you send
    your certificate request (including your public key), proof of your company''s
    identity, and payment to a CA. The CA verifies the certificate request and identity,
    then sends back a certificate for your secure server. Alternatively, you can create
    your own self-signed certificate.


    Note


    Continuing the HTTPS example, a CA-signed certificate provides two important capabilities
    that a self-signed certificate does not:


    +   * Browsers (usually) automatically recognize the CA signature and allow a
    secure connection to be made without prompting the user.


    +   * When a CA issues a certificate, it is guaranteeing the identity of the organization
    that is providing the web pages to the browser.


    Most of the software supporting SSL/TLS has a list of CAs whose certificates they
    automatically accept. If a browser encounters a certificate whose CA is not in
    the list, the browser asks the user to either accept or reject the certificate.
    Also, other applications may generate an error message when using a self-signed
    certificate.


    The process of getting a certificate from a CA is fairly easy. A quick overview
    is as follows:


    +   1. Create a private and public encryption key.


    +   2. Create a self-signed certificate request based on the public key. The certificate
    request contains information about your server and the company hosting it.


    +   3. Send the certificate request, along with documents proving your identity,
    to a CA. We cannot tell you which authority to choose. Your decision may be based
    on your past experiences, or on the experiences of your friends or colleagues,
    or purely on monetary factors.


    Once you have decided upon a CA, you need to follow the instructions they provide
    to obtain a certificate from them.


    +   4. When the CA is satisfied that you are who you claim to be, they send you
    a digital certificate.


    +   5. Install this certificate on your secure server, and configure the appropriate
    applications to use the certificate.


    # Generating a Certificate Signing Request (CSR)


    Whether you are getting a certificate from a CA or generating your own self-signed
    certificate, the first step is to generate a key.


    If the certificate will be used by service daemons, such as Apache, Postfix, Dovecot,
    etc., without a passphrase is often appropriate. Not having a passphrase allows
    the services to start without manual intervention, usually the preferred way to
    start a daemon.


    This section will cover generating a key with a passphrase, and one non-passphrase
    key will then be used to generate a certificate that can be used with various
    service daemons.


    Warning


    Running your secure service without a passphrase is convenient because you will
    not need to enter the passphrase every time you start your secure service. But
    it is insecure and a compromise of the key means a compromise of the server as
    well.'
