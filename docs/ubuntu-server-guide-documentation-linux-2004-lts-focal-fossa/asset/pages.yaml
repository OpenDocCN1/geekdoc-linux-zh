- img_proc: true
  md: 'Fortunately, your Ubuntu system may provide all such facilities to Windows
    clients and share network resources among them. One of the principal pieces of
    software your Ubuntu system includes for Windows networking is the Samba suite
    of SMB server applications and tools.


    This section of the Samba guide will introduce some of the common Samba use cases,
    and how to install and configure the necessary packages. Additional detailed documentation
    and information on Samba can be found on the Samba website.


    # Print Server


    Another common use of Samba is to configure it to share printers installed, either
    locally or over the network, on an Ubuntu server. Similar to File Server this
    section will configure Samba to allow any client on the local network to use the
    installed printers without prompting for a username and password.


    For a more secure configuration Securing File and Print Server.


    # Installation


    Before installing and configuring Samba it is best to already have a working CUPS
    installation. See ??? details.


    To install the samba package, from a terminal enter:


    ```

    sudo apt install samba

    ```


    # Configuration


    After installing samba edit /etc/samba/smb.conf. Change the workgroup attribute
    to what is appropriate for your network, and change security to user:


    ```

    workgroup = EXAMPLE

    ...

    security = user

    ```


    In the [printers] section change the guest ok option to yes:


    ```

    browsable = yes

    guest ok = yes

    ```


    After editing smb.conf restart Samba: systemctl restart smbd.service nmbd.service


    The default Samba configuration will automatically share any printers installed.
    Simply install the printer on your Windows clients.


    # Resources


    +   - For depth Samba configurations see the Samba HOWTO Collection

    - The guide is also available in printed format.

    - O''Reilly''s Using Samba is another good reference.

    - Also, see the CUPS Website for more information on configuring CUPS.'
