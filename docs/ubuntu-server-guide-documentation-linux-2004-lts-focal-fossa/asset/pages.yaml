  md: '# CUPS - Print Server


    The primary mechanism for Ubuntu printing and print services is the Common UNIX
    Printing System (CUPS). This printing system is a freely available, portable printing
    layer which has become the new standard for printing in many Linux distributions.


    CUPS manages print queues and provides network printing via the standard Internet
    Printing Protocol (IPP), offering support for a very large range of printers,
    from dot-matrix to laser and in between. CUPS also supports PostScript Printer
    Description (PPD) and auto-detection of network printers, and features a simple
    web-based configuration and administration tool.


    # Installation


    To install CUPS on your Ubuntu computer, simply use sudo with the apt command
    and give the packages to install as the first parameter. A complete CUPS install
    has many package dependencies, they may all be specified on the same command line.
    Enter the following at a terminal prompt to install CUPS:


    ```

    sudo apt install cups

    ```


    Upon authenticating with your user password, the packages should be downloaded
    and installed without error. On the conclusion of installation, the CUPS server
    will be started automatically.


    For troubleshooting, you can access CUPS errors via the log file: /var/log/cups/error_log.
    If the error log does not show enough information to troubleshoot any problems
    you encounter, the verbosity of the log can be increased by changing the LogLevel
    directive in the file (discussed below) to "debug" or even "debug", which logs
    everything from the default of "info". If you make this change, remember to change
    it back once you''ve solved your problem, to prevent the log file from becoming
    overly large.


    # Configuration


    The Common UNIX Printing System''s behavior is configured through the directives
    contained in the file /etc/cups/cupsd.conf. The CUPS configuration file follows
    the same syntax as the primary configuration file for the Apache server, users
    familiar with editing Apache''s configuration will feel at ease when editing the
    CUPS configuration file. Some examples of what you may wish to change initially
    be presented here.


    # Tip


    Prior to editing the configuration file, you should make a copy of the original
    file and protect it from writing, so you will have the original settings as a
    reference, and to reuse as necessary.


    Copy the /etc/cups/cupsd.conf and protect it from writing using the following
    commands, issued at a terminal prompt:


    ```

    sudo cp /etc/cups/cupsd.conf /etc/cups/cupsd.original

    chmod a-w /etc/cups/cupsd.original

    ```


    +   * ServerAdmin: To configure the address of the administrator of the CUPS server,
    simply edit the /etc/cups/cupsd.conf configuration file with your preferred text
    editor, and add or modify the ServerAdmin line accordingly. For example, if you
    are the Administrator for the CUPS server, and your e-mail address is "bjoy@somebigco.com",
    then you would modify the ServerAdmin line to appear as:


    ```

    ServerAdmin bjoy@somebigco.com

    ```'
