  md: '# RAID


    add_raid|690517,100%


    Linux software RAID stands for "Redundant Array of Inexpensive Disks") can be
    used to combine several disks into a single device that (usually) is tolerant
    to any disk failure.


    A software RAID device can be created out of entire disks or unformatted partitions.
    Select the "Create software RAID (md)" button to open the creation dialog.


    The server installer supports creating devices with RAID level 0, 1, 5, 6 or 10.
    It does not allow customizing other options as metadata format or RAID10 at this
    time. See the RAID documentation for more.


    A software RAID device can be formatted and mounted directly, or partitioned into
    several partitions, even when used as part of another RAID device or LVM volume
    group.


    # LVM


    add_lvm|690517


    LVM ( "Logical Volume Manager") is a system of managing logical volumes, or filesystems,
    that is much more advanced and flexible than the traditional method of partitioning
    a disk into one or more segments and formatting that partition with a filesystem.
    It can be used to combine several disks into one pool of storage but it offers
    advantages in a single disk system, such as snapshots and easy resizing of logical
    volumes.


    As with RAID, a L volume group can be created out of entire disks or unformatted
    partitions. Select the "Create volume group (LVM)" button to open the creation
    dialog.


    Once a volume group has been created, it can be divided into many logical volumes
    which can then be formatted and mounted. Generally makes sense to leave some space
    in the volume group for storage of snapshots and creation of more logical volumes
    as needed.


    The server installer does not supported configuring any of the many, options LVM
    supports when creating volume groups and logical volumes.


    # Selecting boot devices


    add_boot_device|614163


    On all architectures except s39x, the bootloader needs to be installed to a disk
    in such way that the system firmware can find it on. By default, the first device
    to have a partition created on it is selected as a boot device but this can be
    changed.


    On amd64 and arm64 systems, multiple disks can be selected as boot devices, which
    means a system can be configured so that it will continue to boot after a failure
    of any one drive (assuming the root filesystem is placed on RAID). The bootloader
    will be installed to each of these, and the system configured to install new versions
    of grub as it is updated.


    amd64 systems use grub as bootloader. amd64 systems can boot in either UEFI or
    legacy (sometimes "BIOS") mode can be configured to boot in both mode and the
    bootloader is loaded completely in the two modes.


    In legacy mode, the bootloader is read from the first "sector" of a hard drive
    (exactly which hard drive is up to the system firmware, which can usually be configured
    in a vendor specific way). The installer will install grub to the start of all
    disks as selected boot device. As Grub does not entirely fit in one sector, a
    small unformatted partition is needed at the start of the disk, which will automatically
    be created when a disk is'
  merge: -1
