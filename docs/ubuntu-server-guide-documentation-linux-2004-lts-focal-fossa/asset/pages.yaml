  md: '# VPN


    OpenVPN is a Virtual Private Networking (VPN) solution provided in the Ubuntu
    Repositories. It is flexible, reliable and secure. It belongs to the family of
    SSL/TLS VPN stacks (different from IPSec VPNs). This chapter will cover installing
    and configuring OpenVPN to create a VPN.


    # OpenVPN


    If you want more than just-shared keys OpenVPN makes it easy to set up a Public
    Key Infrastructure (PKI) to use SSL/TLS certificates for authentication and key
    exchange between the VPN server and clients. OpenVPN can be used in a routed or
    bridged VPN mode and can be configured to use each UDP or TCP. The port number
    can be configured as well, but port 1194 is the official one; this single port
    is used for all communication. VPN client implementations are available for almost
    anything including all Linux distributions, OS X, Windows and OpenWRT WLAN routers.


    # Server Installation


    To install openvpn in a terminal:


    ```

    sudo apt install openvpn easy-rsa

    ```


    # Public Key Infrastructure Setup


    The first step in building an OpenVPN configuration is to establish a PKI (public
    key infrastructure) and private key for the server and each client. The PKI consists
    of:


    +   - a separate certificate (also known as a public key) and private key for
    the server and each client.

    - a master Certificate Authority (CA) certificate and key, used to sign the server
    and client certificates.


    OpenVPN supports bidirectional authentication based on certificates, meaning that
    the client must authenticate the certificate and the server must authenticate
    the certificate before mutual trust is established.


    Both server and client will authenticate the other by verifying that the presented
    certificate was signed by the master certificate authority (CA), and by testing
    information in the now-authenticated certificate header, such as the common name
    or certificate type (client or server).


    # Certificate Authority Setup


    To setup your Certificate Authority (CA) and generate certificates and keys for
    an OpenVPN server and multiple clients first copy the easy-rsa directory to /etc/openvpn.
    This will ensure that any changes to the scripts will not be lost when the package
    is updated. From a terminal, run:


    ```

    sudo make-cadir /etc/openvpn/easy-rsa

    ```


    Note: If you desired alternatively edit /etc/openvpn/easy-rsa/vars 따로, adjusting
    it to your needs. As root user change to the newly created directory /etc/openvpn/easy-rsa
    and run:


    ```

    ./easyrsa init-pki

    ./easyrsa build-ca

    ```'
