    # Degraded RAID


    At some point in the life of the computer a disk failure event may occur. When
    this happens, using Software

    RAID, the operating system will place the array into what is known as a degraded
    state.


    If the array has degraded, due to the chance of data corruption, booting Ubuntu
    Server Edition

    will boot to initramfs after thirty seconds. Once the initramfs has booted there
    is a fifteen prompt

    giving you the option to go and boot the system, or attempt manual recovery. Rebooting
    to the initramfs

    prom may not be the desired behavior, especially if the machine is in a remote
    location. Booting

    to degraded array can be configured several ways:


    +   - The dpkg-reconfigure utility can be used to configure the default behavior,
    and during the process you

    will be queried about additional settings related to the array. Such as monitoring,
    email alerts, etc. To

    configure mdadm after the following:


    ```

    sudo dpkg-reconfigure mdadm

    ```


    +   - The dpkg-reconfigure mdadm process will change the /etc/initramfs-tools/conf.d/mdadm
    configura-

    tion file. The file has the advantage of being pre-configure the system''s behavior,
    and can also

    be manually edited:'
