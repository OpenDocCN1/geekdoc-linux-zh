    # Rsnapshot


    Rsnapshot is an rsync-based filesystem snapshot utility. It can take incremental
    backups of local and remote filesystems for any number of machines. Rsnapshot
    makes extensive use of hard links, so disk space is only used when absolutely
    necessary. It leverages the power of rsync to create scheduled, incremental backups.


    To install it a terminal shell and run:


    ```

    sudo apt-get install rsnapshot

    ```


    If you want to backup a remote filesystem the rsnapshot server needs to be able
    to access the target machine over SSH without password. For more information on
    how to enable it see OpenSSH documentation. If the backup target is a local filesystem
    there no need to set up OpenSSH.


    # Configuration


    The rsnapshot configuration resides in /etc/rsn.conf. Below you can find some
    of the available options there.


    The root directory where all snapshots will be stored:


    ```

    snapshot_root      /var/cache/rsn/

    ```


    How many backups would you like to keep? Since rsnapshot uses incremental backups,
    we can afford to keep older backups for awhile before removing them. You set these
    up under the BACKUP LEVELS section. You tell rsnapshot to retain a specific number
    of backups of each kind of interval.


    +   - retain daily 6

    - retain weekly 7

    - retain monthly 4'
