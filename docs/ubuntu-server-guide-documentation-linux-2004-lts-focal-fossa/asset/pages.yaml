  md: 'serial: ADATA_SX200PNP_XXXXXXXXXX

    — type: partition


    The extensions to the curtin setup are disk selection identifying disks by serial
    (e.g. Crucial_CT512MX100SSD1_14250C57FCE) or by path (e.g. /dev/sdc) and the server
    installer supports this as well. The installer additionally supports ‘match spec’
    on a disk action that supports more flexible matching.


    The actions in the storage config are processed in the order they are in the autoinstall
    file. Any disk action is assigned a matching disk – chosen arbitrarily from the
    set of unassigned disks if there is more than one, and causing the installation
    to fail if there is no unassigned matching disk.


    A spec supports the following keys:


    +   * model: matches a disk where _VENDOR=foo in udev, supporting globbing

    * path: matches a disk where DEVPATH=foo in udev, supporting globbing (the globbing
    distinguishes this from specifying serial: foo directly in the disk action)

    * serial: matches a disk where ID_SERIAL=foo in udev, supporting globbing (the
    globbing distinguishes this from specifying serial: foo directly in the disk action)

    * ssd: yes/no; matches a disk that is or not SSD (vs a rotating disk)

    * size: matches |smallest: take the smallest or smallest disk rather than an arbitrary
    one if there are multiple matches [support smallest added in version 20.06.1]


    For example, to match an arbitrary disk it is:


    ```

    type: disk

    id: disk0

    ```


