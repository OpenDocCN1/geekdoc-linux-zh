    \n# Network File System (NFS)\n\nNFS allows a system to share directories and\
    \ files with others over a network. By using NFS, users and programs can access\
    \ remote systems almost as if they were local files.\n\nSome of the most notable\
    \ benefits that NFS can provide:\n\n+   - Local workstations use less space because\
    \ commonly used data can be stored on a single machine and still remain accessible\
    \ to others over the network.\n\n+   - There is no need for users to have separate\
