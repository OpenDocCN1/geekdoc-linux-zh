    # 4.6.3 Pilot-tone-aided coherent sensing


    Here we assume that the primary signal contains a known pilot tone, and that,
    to detect the presence of the primary user signal, the secondary-user sensor compares
    against a threshold $\theta$ the statistic


    ```

    $Y = \frac{1}{N} \sum_{n=0}^{N-1} \Re\{y_n x_n^*\} = \frac{1}{N} \sum_{n=0}^{N-1}
    \Re\{|x_n|^2 + i x_n x_n^* + w_n x_n^*\}.$ (4.124)

    ```


    The conditional false-alarm and missed-detection probabilities have the form


    ```

    $P_{FA}(1) = \mathbb{E}_I\left[ Q\left(\sqrt{N}\frac{\theta - I}{\sqrt{\mathcal{P}\sigma_w^2}}\right)\right],$
    (4.125)

    $P_{MD}(1) = \mathbb{E}_I\left[ Q\left(\sqrt{N}\frac{\mathcal{P} - \theta + I}{\sqrt{\mathcal{P}\sigma_w^2}}\right)\right],$

    ```


    where $Q(\cdot)$ is the Gaussian tail function, $I$ denotes the interference term


    ```

    $I \triangleq \frac{1}{N} \sum_{n=0}^{N-1} \Re\{i_n x_n^*\},$ (4.126)

    ```


    and $\mathcal{P}$ is, as usual, the estimate of the average signal power:


    ```

    $\mathcal{P} \triangleq \frac{1}{N} \sum_{n=0}^{N-1} |x_n|^2.$ (4.127)

    ```


    We finally assume for simplicity that $I \in [-1,1]$, and that $I$ has an even
    probability density function (this implies in particular that its mean value is
    zero). The assumption of a symmetric pdf $p_I(\cdot)$ for the interference term
    $I$ allows us to write $P_{FA}$ and $P_{MD}$ in a symmetric form, where now $I
    \in [0,1]$.


    2 If the symmetry assumption for the interference is invalid, all the developments
    below can be rephrased, mutatis mutandis, to account for this situation.'
