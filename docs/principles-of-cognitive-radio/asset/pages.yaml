- pgno: 131
  md: 'As noted, a sensor usually can only detect the presence of a primary transmitter,
    not of a receiver. It is nontrivial to draw conclusions from these observations
    about whether transmission from secondary devices create excessive interference
    to a primary receiver. Imagine as a simple scenario a primary system using frequency-domain
    duplexing. Then, the two ends of a primary link transmit in separate bands. It
    is thus essential to understand the correlation of the signal levels in the transmit
    and receive bands of the primary system. This is related to the frequency selectivity
    of the small-scale fading and the frequency dependence of the path loss. Propagation
    channels also have a key influence on the “hidden node problem” [90], where a
    secondary transceiver is outside the “listening range” for a primary transmitter
    but close enough to the primary receiver to create interference. The likelihood
    for hidden nodes to occur increases with increasing path loss and shadowing variance.


    # 3.1.3 Impact of propagation on transmission


    After sensing, the next step for the secondary system is to find a good transmission
    strategy. In the case of a spectrum-sensing radio (i.e., involving just changing
    the operating frequency), this entails decisions about which secondary transmitter
    can transmit in which frequency band, and for how long. In other words, the “free”
    spectrum has to be distributed among the different secondary devices that want
    to transmit information. Optimum assignment strategies can often be obtained from
    game-theoretic considerations (Chapter 1). As an input to such computations, knowledge
    of the propagation channels is essential. The actual performance, as well as the
    relative effectiveness of different schemes, depends on the observed signal levels.
    For an overlay approach, the secondary system needs accurate knowledge of the
    propagation channels within and between the primary and secondary systems at the
    time of actual transmission. In order to develop proper transmission strategies,
    it is vital that the secondary transmitter be able to make channel predictions
    (based on the past and present observations) and that it understands the achievable
    accuracy of those predictions. This, in turn, requires good channel models.


    The necessity of updates in the optimum transmission scheme is intimately tied
    to the temporal properties of the channel, including the Doppler spectrum for
    mobile users and temporal variations of the Rice factor for fixed users. This
    also has an impact on whether cooperative games or noncooperative games can be
    used to develop a transmission strategy. Cooperative games require exchange of
    information between the different secondary users, but if the channel changes
    rapidly (large Doppler spread) and/or too strongly (small Rice factor), the overhead
    for the required information exchange becomes large.


    The channel characteristics also have an impact on the design of transmission
    and reception strategies for CRs. For example, in CR systems using orthogonal
    frequency division multiplexing (OFDM), the optimal subcarrier spacing depends
    on the Doppler spectrum and also the power delay profile. Thus, a CR design using
    OFDM should choose a subcarrier spacing that is well-matched to the expected channel
    properties.'
