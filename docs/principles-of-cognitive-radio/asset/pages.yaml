- pgno: 141
  md: 'The Erceg model for PLmed in fixed wireless scenarios, as presented in [27],
    is as follows.


    +   - Up to the reference distance d0, specified in this case to be 100 m, the
    median path loss follows the free-space path loss formula, i.e., A = 20 log10((4π
    d0)/λ) and γ = 2. For a carrier frequency of 1.9 GHz, λ = 15.8 cm and A = 78.0
    dB.

    +   - For d > d0, A remains the same, but γ becomes a quantity that varies in
    a seemingly random way from one area (or "cell") to another. Over all cells, it
    has a mean value, μγ, that depends on the base antenna height, hb, and on the
    terrain type; and a zero-mean variable part whose standard deviation, σγ, depends
    on the terrain type only.

    +   - Specifically, μγ = (a − b hb + c hb²), where hb is in meters; (a, b, c)
    are constants that depend on terrain category, in units that make μγ dimensionless;
    and this applies for hb from 10 m to 80 m.

    +   - The terrain categories, A, B, and C, are, respectively, hilly/moderate-to-heavy
    tree density; hilly/light tree density or flat/moderate-to-heavy tree density;
    and flat/light tree density.

    +   - The variable part of γ is represented using a truncated Gaussian distribution,
    the truncation being chosen to preclude γ from going negative.


    The Erceg model combines this description of median path loss with the shadow
    fading description in Section 3.4.2. Numerical values of all model parameters
    are in Table I of [27] for each of the three terrain categories. The model thus
    incorporates the randomness of γ and σ from one area to another, the influence
    of base antenna height, and the influence of terrain type.


    # 3.4.4 Antenna gain and the gain reduction factor


    We have, up to this point, written the relationship between transmit power and
    received power under the implicit assumption that there is no antenna gain, i.e.,
    that the antennas transmit or receive equally in all directions. In truth, this
    is never quite the case. In cellular base stations, for example, the antennas
    have gain in the elevation plane in order to focus transmission and reception
    at the heights containing most user terminals; and they may have moderate azimuth
    gains (e.g., azimuthal beamwidths between 60° and 120°) to improve frequency reuse
    efficiency through sectoring. If the gain of a transmit antenna beam pattern towards
    a receiver is Gt dB, and the gain of the receive antenna beam pattern toward the
    transmitter is Gr dB, then the dB power gain will be augmented, in theory, by
    an amount (Gt + Gr) dB. This composite gain is in fact realized in engineered
    routes like those for point-to-point radio relay.


    The notion of an antenna with a highly directive beam, and correspondingly low
    sidelobes, suggests a potential benefit for CR receivers: by pointing a receive
    antenna beam at the intended transmitter, it can both improve the received signal
    level against noise and suppress interfering signals coming from off-beam directions.
    This approach is most feasible to contemplate when the link ends are not moving.
    It thus has relevance to fixed wireless applications, such as a CR-based network
    of fixed sensors. Nevertheless, propagation measurements conducted for fixed wireless
    systems in multipath'
