    channels is equal to the mutual information of the channel maximized over all
    possible input distributions:


    $$C=\max _{p(x)} I(X ; Y)=\max _{p(x)} \int_{\mathcal{X}, \mathcal{Y}} p(x, y)
    \log \left(\frac{p(x, y)}{p(x) p(y)}\right) d x d y, \tag{2.5}$$


